    using the

    applications provided in the download.


    ### 1.2.3 • Using the Applications on Microsoft Windows


    First, you need to download and install gputils for Windows from here:


    https://sourceforge.net/projects/gputils/files/gputils-win32/


    The version used at the time of writing was 1.4.0. Although not the latest version,
    it was

    chosen to be the same as used by the current Debian and Ubuntu. You can use the
    latest

    version if like.


    You will need the FTDI driver for your USB interface lead, and the installation
    of the file

    FTD2XX.DLL. The best way to do this is to download the executable setup for Windows

    from:


    http://www.ftdichip.com/Drivers/D2XX.htm


    At the time of writing, it is named CDM2128_Setup.zip. Inside the zip file is
    *CDM2128_*

    *Setup.exe* that will install the driver and the required DLL file. Install it
    before plugging in

    the lead.


    You need to unzip the file from the Elektor website into a convenient directory
    on your

    computer. Please make sure that you download the correct file. The Linux version
    won’t

    work on Windows and vice versa. It’s not just executables that are not compatible.
    Text

    files have different line endings: Linux files have a new line character while
    Windows files

    Figure 1-2 Programming Chain


    have a carriage return and new line character at the end of each line. The file
    unzips several

    directories. The working directory contains a batch file called terminal_here.
    Clicking on

    this will open a virtual terminal. If you type dir and press return, the contents
    of the

    directory will be displayed. Initially, the files in the working directory are
    executable. These

    executables will be run from the command line. This only involves typing a couple
    of words

    and pressing return. Later in this chapter, instructions will be given on how
    to use these

    applications. For reading and writing PIC source files, you can use Windows’ text
    editor,

    notepad, but any text editor will do, including *notepad++*.


    ### 1.2.4 ● Installing the Applications on Linux


    The archive file for Linux is a tar file. This can be extracted by typing on the
    command line

    *tar -xvf <file name>.tar.*


    There are many variants of Linux. I won’t try to cover the instructions in detail
    for all of

    them. I will give instructions for two: Debian and Fedora. The details for Debian
    are also

    applicable to Ubuntu and other Debian derivatives.


    The assembler program *gpasm* is part of the GNU PIC Utilities (*gputils*) package.
    This can

    be installed on Debian based Linux by opening a terminal window and typing:


    *sudo apt-get install gputils*.


    Of course, you have to be connected to the Internet. On Fedora, the command is
    *sudo dnf

    *install gputils*.


    ![](img/a08bd00952da48f769971864f33af432_13_0.png)


    For Fedora:


    ![](img/a08bd00952da48f769971864f33af432_13_1.png)


    To load the hex file contents into the PIC microcontroller and read back the loaded
    bytes,

    the two programs that have been written especially for this book are called *program_*

    *writer_xx* and *program_reader_xx*, where *xx* is 32 or 64. Both versions are
    provided: one

    for 32-bit and one for 64-bit operating systems. These programs need to have the
    package

    libftdi1-dev installed to work. This can be installed on Debian by opening a terminal
    window

    and typing *sudo apt-get install libftdi1-dev *.


    ![](img/a08bd00952da48f769971864f33af432_13_2.png)


    Figure 1-3a Installing gputils on Debian (Ubuntu etc)


    Figure 1-3b Installing gputils on Fedora


    Figure 1-4a Installing libftdi1-dev on Debian


    For Fedora:


    ![](img/a08bd00952da48f769971864f33af432_14_0.png)


    These two applications have only been tested with these two PICs. Figure 1-5 shows
    the

    directory trees for the Linux and Windows downloads.


    ![](img/a08bd00952da48f769971864f33af432_14_1.png)


    Once you have all the software installed, the next thing is to try it out using
    the hardware.


    ### 1.2.5 • The FTDI Lead and Testing the Programming Chain


    All that is required is an FTDI *TTL-232R-5V-WE* USB wire end lead. They are readily
    available

    from suppliers such as Farnell, RS Components, and Digi-Key. 1k resistors to pins
    4, 6, and

    7 are recommended for protection. The one connected to pin 5 is to limit the current
    flowing

    through the LED.


    Figure 1-4b Installing libftdi on Fedora


    Figure 1-5 Download directory tree for Linux and Windows


    ![](img/a08bd00952da48f769971864f33af432_15_0.png)


    The above circuit can quickly be connected to a plugin breadboard: see Figure
    1-9. The LED

    is not part of the programming circuit. It is there for the test program to demonstrate
    that

    it is all correctly working. The test program *test.hex* is included in the *Chap01_progs*

    folder of the archive file. It makes the LED flash on for a quarter of a second
    and off for three-

    quarters of a second. You need to copy it to the working directory to use it.


    If you are using Windows, click on the *terminal_here* batch file in the working
    directory to

    open the terminal window. Type in the following and press return. See the upper
    pane in

    Figure 1-7.


    program_writer.exe test.hex


    If you are using Linux, open a virtual terminal and navigate to the working directory.
    Type

    the following and press return. See the lower pane in Figure 1-7.


    sudo ./program_writer_64 test.hex


    Note that in Linux you must prefix the executable file with ./ .This is the path
