    [content]

    转一两圈以清除孔周围的铜。接子 T1 到 T8 是穿过 1.0 mm 孔的铜销。接子 *T1* 和 *T4* 到 *T7* 穿过到接线一侧。孔是沉孔的，引脚用一滴像
    Araldite 这样的环氧胶水固定。接子引脚 *T2, T3* 和 *T8* 也插入到 1.0 mm 直径的孔中，但这些孔没有沉孔，因为引脚将焊接在接地平面。图
    5-3b 显示了孔的细节。在板板角处钻四个 4 mm 直径的孔：如果你想将板板安装在盒子里，这些孔用于固定螺丝。当你在无铜侧面焊接接线时，可以临时用螺丝和螺母穿过这些孔将其作为支脚，将板板倒过来立起来，这样在焊接时可以让元件远离桌面。要将电路板切割成尺寸，最简单的方法是使用金属直尺，并用模型刀在两面刻一条线。然后用两块木板夹住电路板，沿线将其折断。


    ![](img/a08bd00952da48f769971864f33af432_95_0.png)


    ## 5.4 • 电路板的装配与接线


    钻孔后，将接子放入孔中，焊接接地的部分，并用胶水将绝缘部分固定好。可以使用如快速固化 Araldite 这样的胶水。对于 PIC 本身，我建议使用 IC 插座，将其放入孔中并在插座上焊接接线。在完成所有焊接后再将
    PIC 插入。这样可以减少损坏 PIC 的概率。如果将来它发生电学损坏，你可以轻松更换它。对于其他元件，将引脚弯成直角以与孔对齐。将它们穿过直到元件几乎贴紧铜表面。剪掉除
    5mm 外的所有引脚，并在无铜侧弯成直角并平放，见图 5-3b。确保你的二极管方向正确。这些二极管的作用是保护 PIC 的输入免受反向电压的影响（如果探头意外反向使用），以及防止输入电压高于电源电压时的过压。通过使用螺丝和螺母制作支脚让电路板倒立起来，可以方便地焊接接线，同时保持元件远离工作表面。如果
    IC 插座掉落，可以用胶带将其临时固定。对于元件引脚和 IC 插座引脚之间的连接，我发现绕线线是理想的，因为它是一根实心单股，而且非常细。


    图 5-3b 孔的细节


    图 5-4 显示了翻转到接线一侧的电路板，接线用直线表示。如果你使用绝缘线，可以采取最直接的路径进行连接。仅仅为了美观而将电缆束缚在一起并没有电气上的优势，有时反而可能是一个劣势。


    电池及其开关未在接线图中显示。它们通过线连接到 *T1* 和 *T2*。如前所述，该项目使用电池而不是 5 V USB。可以使用四节 1.5 V 电池，因为为
    PIC 提供的最大电压为 6.5 V。请参阅数据表第 322 页。你必须确保极性正确。否则 PIC 将无法存活。


    所示的接线用于共阳极显示器。可以使用共阴极，但显示器上的公共端**必须**连接到 0V 而不是电源，并对显示器宏应用相应的修改。


    ![](img/a08bd00952da48f769971864f33af432_96_0.png)


    ## 5.5 • 电路板测试程序


    这个项目是迄为止最复杂的，但它汲取了之前程序的经验。在开发任何项目时，边构建边测试是非常明智的。这对于软件和硬件都是如此。将问题拆分成若干部分并测试每个部分。这样在你进行下一步工作之前，可以依赖于你已经完成的内容。在制作好电路板后，将使用一个程序来测试其功能是否正常，然后再对剩余部分进行实验。


    图 5-4 电路板的接线侧


    观察电路图，用于测量电压的探头连接到 *RA2* 输入，该输入通过 *R11, R12* 电压分位器配置为 *AN2* 模拟通道。我们将配置 PIC，将输入电压与
    4.096 V 的内部参考进行比较。为了在输入引脚处实现 4.096 V，探头之间的电压将为 22.7 V：这是满量程读数。如果电源电压为 5 V，在不损坏
    PIC 的情况下可以应用的最大电压为 29.4 V。见数据表第 322 页。不能向任何输入引脚施加高于电源电压 0.3 V 的电压，如果发生这种情况，肖特基二极管
    D1 将处于正偏置，并将输入电压限制在 Vss 之上 0.3 V 左右。


    PIC 电源电压为 5V 时探头跨最大允许电压的计算：

    最大电压 = (Vss + 0.3) x 22/5 V。其中 Vss 是电源电压。例如 5.3x22/5 = 29.4 V。


    此程序不显示探头两端的输入电压值。这将在第 7 章介绍。

    '
