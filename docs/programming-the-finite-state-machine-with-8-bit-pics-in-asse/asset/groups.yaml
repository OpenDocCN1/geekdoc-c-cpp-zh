    \ ; Call subroutine.\nCALL TX_THIRTY_TWO_BIT_NUMBER ; Call subroutine.\nGOTO LOOP\n\
    \n; Subroutines.\nMULT_TWO_SIXTEEN_BIT_NUMBERS ; Y = Xa*Xb, note each variable\
    \ has a high and low byte.\nMULT_S0\nCLRF Y3 ; Clear output to zero. Here because\
    \ Xb0 is not zero.\nCLRF Y2 ; Clear output to zero.\nCLRF Y1 ; Clear output to\
    \ zero.\nCLRF Y0 ; Clear output to zero.\nMOVF Xb1, F ; By moving a file to itself\
    \ the Z flag in STATUS gets affected.\nBTFSS STATUS, Z ; Test Xb1.\nGOTO $+4 ;\
    \ Here because Xb1 is not zero.\nMOVF Xb0, F ; Here because Xb1 is zero.\nBTFSC\
    \ STATUS, Z ; Test Xa0.\nRETURN ; Here because Xb1 and Xa0 are both zero.\nMULT_S1\n\
    MOVF BUFFH, F ; By moving a file to itself the Z flag in STATUS gets affected.\n\
    BTFSS STATUS, Z ; Test BUFFH.\n```\n"
