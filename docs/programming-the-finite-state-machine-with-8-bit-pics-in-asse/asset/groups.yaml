    ## 8.7 Using Debug Macro on the Voltmeter Programmable


    One of the reasons why finite state programming is so useful is the way the code
    that is running in any given state is isolated from other code in the program.
    If you can monitor the state variable’s value, you can see what the program is
    doing. To demonstrate this, we can use the Debug macro to transmit the current
    state to the computer and watch what is happening. Program 8-4 is the voltmeter
    Program (7-1) with some additional debug code. The complete program is in the
    download file, but reproduced here are the altered lines marked with chevrons.
    The 25 ms delay macro was added to settle the serial comms update rate from the
    PIC is too fast.


    CBLOCK 0x70

    TICKS ; Used to count 8.2ms ticks.

    STATE_M0

    STATE_M1

    STATE_M2

    Y0 ; Output variable for arithmetic.

    Y1 ; Output variable for arithmetic.

    Y2 ; Output variable for arithmetic.

    Xa0 ; Input variable for arithmetic.

    Xa1 ; Input variable for arithmetic.

    Xa2 ; Input variable for arithmetic.

    VALUE ; Is the value written to the display (0 is blank).

    FLAGS ; The FLAGS bits are: 0 is display update, 1 is division complete, 2 is
    voltage available, and 3 is reading required.

    LAPS ; Number of laps with a zero display.

    BUFF_DEBUG1 ; Added for debug <<<<<<<<<<<<<<<<<<<

    BUFF_DEBUG2 ; Added for debug <<<<<<<<<<<<<<<<<<<

    ENDC


    ;================================================================================

    MOVLB 3

    CLRF TICKS ; Initialize count to zero.

    CLRF STATE_M0 ; Initialize state to zero.

    CLRF STATE_M1 ; Initialize state to zero.

    CLRF STATE_M2 ; Initialize state to zero.

    CLRF FLAGS ; Initialize to false.

    CLRF LAPS

    SET_SERIAL_TX 6F823 ; For transmissions. <<<<<<<<<<<<<<<

    MOVLB 0

    CLRF F0 ; Initiate to 0.

    CLRF F1 ; Initiate to 0.

    CLRF F100 ; Initiate to 0.

    CLRF Fm ; Initiate to 0.


    ;================================================================================

    SWITCH_M0

    DELAY_25ms BUFF_DEBUG1, BUFF_DEBUG2 ; Delay to settle the comms <<<<<<<<<<<<<

    MOVLB 3 ; Bank 3 required. <<<<<<<<<<<<<

    DEBUG STATE_M0 ; Transmit the state. <<<<<<<<<<<<<


