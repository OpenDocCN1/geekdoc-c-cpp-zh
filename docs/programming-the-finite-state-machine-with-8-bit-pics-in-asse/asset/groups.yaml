    \ in C\n\n## 10.5.2 Turning Bits On and Off Using Bitwise Operators\n\nAnother\
    \ way of changing individual bits is to use bitwise logic and bitmasks. Suppose\
    \ we take an eight-bit variable *var* and want to turn bit 2 on, leaving the others\
    \ unchanged. The way to do this is to bitwise OR the byte with a mask where all\
    \ the bits are off except for the one to be turned on. Let the state of the flags\
    \ byte *var* be B'01100001', the table below shows the bitwise OR with the mask\
    \ B'00000100'. In the code, this would be written in hex as 0x04.\n\nvar = var\
    \ | 0x04; // | is the bitwise OR in C.\n\n| | Bit 7 | Bit 6 | Bit 5 | Bit 4 |\
    \ Bit 3 | Bit 2 | Bit 1 | Bit 0 |\n| :--- | :---: | :---: | :---: | :---: | :---:\
    \ | :---: | :---: | :---: |\n| **var** | 0 | 1 | 1 | 0 | 0 | 0 | 0 | 1 |\n| **mask**\
    \ | 0 | 0 | 0 | 0 | 0 | 1 | 0 | 0 |\n| **result** | 0 | 1 | 1 | 0 | 0 | 1 | 0\
    \ | 1 |\n\nThe assignment assigns the result of the bitwise OR to var. To turn\
    \ it off is not so obvious. Again we need a mask and bitwise operator that changes\
    \ the bit we want to change but leaves all others as are. This can be achieved\
    \ by using bitwise AND where the mask is made up of 1s in the positions where\
    \ the bits are not going to change and a 0 in the position where the bit is be\
    \ turned off. To produce the required mask, take a byte with the bit in the position\
    \ you want to change Set to 1, that is in this example B'00000100' and invert\
    \ the bits to give B'11111011'. There is an operator ~ does this. The code to\
    \ turn off bit 2 is this: var = var & ~0x04;\n\n### 10.5.3 Turning Bits On and\
    \ Off Using Bitfields\n\nStandard C also has bitfield that allows you to access\
    \ individual bits in word. To understand this you need to be introduced to the\
    \ structure which is an object that contains named members of various data types.\
    \ You can create a structure for our flags like this:\n\n```c\nstruct {\n    unsigned\
    \ int dis_update : 1;\n    unsigned int vol_available : 1;\n    unsigned int read_required\
    \ : 1;\n} flags;\n```\n\nIndividual flags can be accessed like this: flags.dis_update\
    \ = 1; // This sets the flag on. We have already used this method before, for\
    \ example in Program 9-1, where TRISA was used. The definition of the structure\
    \ in this case would be found by tracing back through the include file xc.h. Also\
    \ TRISA was used on its own, it had been defined as a bit type in the relevant\
    \ include file. There's a lot more to the topic of structures. It would have to\
    \ bring in other topics, for example, unions and pointers that are beyond the\
    \ scope of these two chapters.\n\nTable 10-2 Turning a Bit On\nTable 10-3 Turning\
    \ a Bit Off\n\n## 10.6 Summary of Assembly, C, and Finite State Machines\n\nThe\
    \ most common consideration regarding C versus assembly is that programming in\
    \ C is better. This is because the compiler does so much of the work for you.\
    \ In C you no longer have to worry about bank selection that in assembly is a\
    \ frequent cause of errors in code. You can take certain things for granted like\
    \ simple arithmetic, which can be very complicated if done from scratch. Assembly\
    \ can be difficult to read compared to C where the language has formats such as\
    \ the if, if..else, and while statements. In assembly, these are achieved with\
    \ lots of skips and goto instructions. goto can lead to what is referred to as\
    \ spaghetti code. The state machine can come to the rescue by giving the assembly\
    \ program the structure to make it readable and more robust. As mentioned, there\
    \ are fundamental types of FSM: The Moore and the Mealy. If you look up Unified\
    \ Modeling Language (UML) or Harel statecharts, you will see how things have progressed.\
    \ I have seen examples of the state machine approach used in many control system\
    \ programs. They don't always adhere to the strict academic version of a particular\
    \ type. They nearly always make up part of the program. The thing that gives them\
    \ their stability is that if the program is in a particular state, it can only\
    \ respond to the inputs that that state is looking at. In a way, the program is\
    \ focused on one part of a time. Getting back to the C versus assembly debate,\
    \ 8-bit PICs can be programmed using C. Assembly, however, can make better use\
    \ of their smaller memory space.\n\nI hope that this book has been useful. The\
    \ finite state machine is only one approach to writing software. There are many\
    \ different approaches to using them. You can easily find ongoing debates about\
    \ which programming language, paradigm, text editor or IDE to use. I think the\
    \ best way is to try as many as you can and see what suits you.\n\n**Index**\n\
