    As can be seen in Figure 6-4, the serial reader correctly displays the output
    of 1000 minus 1500 as -500 when the option for a short integer -h (two bytes)
    is used. So how are negative numbers represented in binary?


    ## 6.5 • Negative numbers in binary


    When we do arithmetic on paper to represent a negative number, we just put a –
    sign in front of the number and take it into account when doing additions and
    subtractions. Binary arithmetic in computing is somewhat different. Let us start
    by considering an integer data type of only 4 bits. This means that unsigned numbers
    between 0 and 15 can be represented. Table 6-4 shows the bit pattern but there
    are two value columns: one for unsigned and one for how signed is represented.
    Note how the same bit pattern is used for 0 to +15 unsigned as -8 to +7 signed.
    For 0 to +7, the two values for signed and unsigned are the same, but the +8 to
    +15 range of the unsigned maps across to the -8 to -1 of the signed.


    Now take +3 that is 0011 and take -3 from the signed integers that is 1101. If
    you add +3 and -3 you get 0. Let’s add the two binary numbers 0011 and 1101.


    0011 = +3

    1101 = -3

    0000 with 1 carried out.


    You can try any pair of positive and negative numbers from the table that have
    the same absolute value. For example, +2 and -2. The sum of all of these binary
    numbers will result in 0.


    Now if for example, we add +3 and -8 the answer is -5. Using our binary numbers
    from the table 0011 and 1000:


    0011 = +3

    1000 = -8

    1011 = -5


    Giving the correct answer of -5 from the table.


