    MOVLB 0

    MOVF STATE_M0, W ; Move STATE_M0 to the working register.

    BRW ; Program jumps by the value moved into the working register.

    GOTO M0_S0 Wake from sleep

    GOTO M0_S1 State 1 code executed many times waiting for 1s Runs states 4 to 0
    controlling the display During delay period the state code for each state is executed
