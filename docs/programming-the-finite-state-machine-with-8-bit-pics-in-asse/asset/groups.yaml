    The reference voltage is 4.096 V or 4096 mV. This equates to an A-D conversion
    of 1024. A change of one least significant bit is therefore 4096/1024 or 4 mV.


    From Fig 5-2, the input voltage is reduced by the input potential divider by a
    factor of 22/122. A change of one least significant bit means a change of 4x122/22
    mV, equal to 22.1818 mV at the voltmeter probes. To read in millivolts, we have
    to multiply the result in *ADRESH:ADRESL* by 22.1818. However, we can not do floating-point
    arithmetic only integer arithmetic. Therefore we need to find two integers with
    a ratio of 22.1818:1.


    Now, 22.1818/1 is the same as 221818/10000. We need to multiply by 221818 then
    divide by 10000. We do, however, need to tread carefully here when multiplying
    221818 x 1023, which is the highest possible result. It will give 226919814 (28
    bits). This is too big for our 24-bit dividend. By dividing by the numerator and
    denominator first by 20 to get 11090.9/500 rounded to 11091/500, it gives a ratio
    of 22.182. The maximum product will be 1023 x 11091, equal to 11,346,093 (24 bits).
    There is one more thing to watch out for when scaling with integers. This is to
    multiply before you divide, otherwise, there will be a loss in precision. For
    example, if I want to multiply 60 by 1.125, this could be done by multiplying
    by 9 and then dividing by 8.


    - *60 x 1.125 = 67.5 correct answer.*

    - *Using integer arithmetic*

    - *Multipying first:*

    - *60 x 9 = 540*

    - *540/8 = 67 integer result we lose the 0.5.*

    - *Dividing first:*

    - *60/8 = 7 integer result we lose the 0.5.*

    - *7 * 9 = 63 bigger error.*


    Table 7-1 ADCON1


    The details of the arithmetic are commented on the program. The voltage measured
    at the probes and now scaled to millivolts is moved to RESBUFF. The result buffer
    is made up of two files: *RESBUFFH:RESBUFFL*. The individual significant figures
    for tens of volts, volts, hundreds of millivolts, and tens of millivolts are now
    extracted.


    ## 7.4 • Extracting the individual figures for the display


    Each figure is obtained by calling subroutine EXTRACT_FIGS. The routine is called
    four times: once for each figure. Suppose the voltage read is 12345 mV or 12.345
    V. We want our display to first present the 1, then the 2, 3 and lastly the 4.
    5 will be discarded as we are only resolving to tens of millivolts. The value
    12345 is held in RESBUFF and each time EXTRACT_FIGS routine is called, it divides
    the RESBUFF by a divisor placed in Xb. The integer division result is placed in
    FIG and the remainder after the division is placed in RESBUFF to used on next
    call.


    So starting by dividing by 10000, RESBUFF(12345)/10000 gives a result of 1 and
    remainder of 2345 to go into FIG. 1 is the number of tens of volts and is placed
    in file F10V.


    On the next call RESBUFF(2345)/100 gives a result of 2 and remainder of 345 to
    go into FIG. 2 is the number of volts and is placed in file F1V.


    On the next call RESBUFF(345)/100 gives a result of 3 and remainder of 45 to go
    into FIG. 3 is the number of hundreds of millivolts and is placed in file F100mv.


    Finally, on the last call, RESBUFF(45)/10 gives a result of 4 and remainder of
    5 to go into FIG. 4 is the number of tens of millivolts and is placed in file
    F10mv.


    ## 7.5 • Detecting Input Voltage


    The detection of no input voltage or less than 1 mV is done by comparing the value
    in ADRESH:ADRESL with . The two registers hold the 10-bit result, right justified
    so the 8 least significant bits are in ADRESL and the 2 most significant bits
    in ADRESH. First ADRESH is checked to see if it is zero. ADRESL is then checked
    to see if it is less than 5. A value of 5 is 0 mV at the input pin on the PIC,
    or 1 mV at the probe.


    ## 7.6 • Recalibration


    You can easily change the voltage range to suit your needs by using a different
    divider and recalculating the scaling. Be mindful of the voltages you are playing
    with. If you are sure of your electrical knowledge, you could even make it into
    an ammeter by connecting the analog input across a shunt resistor.


    ## Chapter 8 • Troubleshooting and Planning


    ## 8.1 • Introduction


    If you have been experimenting with the programs or have been trying to write
    your own from scratch, you will likely experienced the odd bug or even a completely
    inoperative program. Assembly language programs can be unfriendly. The assembler
    will warn you of things as syntax errors or jumps to labels that aren''t recognised.
    It won''t however help you with the functionality of your code. This chapter will
    try to help you debug your code when it doesn’t work, or better, stop you from
    making the mistakes. Do not be put off if you make mistakes when coding. I rarely
    get code to run the first time. One way you can produce reliable code is to keep
    it. This chapter covers both fixing bugs and the planning of programs to avoid
    bugs. Most of the advice in this chapter applies to general programming. If you
    are writing in C, Python, Java or programming an industrial programmable logic
    controller (PLC), the same things are true.


    ## 8.2 • Have an Overview of the Project


    You need to have a clear idea of what the project will do. Just letting it grow
    can lead to you having to start again. If you take a look at Figures 7-1 and 7-2
    (the state charts for the voltmeter), you have a representation of what the entire
    program does. Three separate state machines run concurrently with each state being
    responsible for a limited range of activity. You can see what the program does
    without getting bogged down in local.


    ### 8.2.1 • State Diagrams and Flow Charts


    You will have seen flow charts: they crop up in all sorts of places wall charts,
    instruction booklets, even cartoons. They are generally easy to understand as
    they can be seen as routes through actions and decisions. Looking at state charts,
    you might think they are just the same, but they are different. As an example,
    imagine a central heating system for a building where there is a boiler and a
    circulation pump. To control the system, there is a master switch and a thermostat.
    When the master switch is on, the system is enabled and when it is off it''s disabled.
    If the system is enabled, the boiler and pump will run if the temperature is below
    the setpoint configured on the thermostat. They will stop when the temperature
    reaches the setpoint. Figure 8-1 compares a state diagram with a flow chart to
    describe the system. The FSM, in this case, is shown as a Moore machine where
    the outputs are dependent only on the state. On the diagram, the outputs are shown
    inside the states. If you trace your way around both diagrams, you will see the
    same functionality but the flow diagram has no concept of state. If the machine
    is in state 2 where the master switch is on and the boiler and pump are off, it
    will remain in that state until either the master switch is turned off, causing
    a transition to state 0, or the temperature drops below the setpoint with the
    master switch set to on, in which case the transition will be to state 1 to fire
    the boiler and start the pump. The machine will then stay in this state until
    another transition is called for.

