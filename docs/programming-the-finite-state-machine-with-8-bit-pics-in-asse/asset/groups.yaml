    ## 10.5 C语言中的电压表\n\n最后一个程序是第 7 章用 C 语言编写的电压表。它遵循与 07-01 和 07-02 相同的状态图。如果你将 C\
    \ 程序与汇编程序对比，由于它们遵循相同的状态图，不同的部分可以直接进行比较。汇编程序包含子程序和用于的宏，这些在 C 版本中仅以简单表达式的形式出现。比较\
    \ hex 文件的大小，C 编译器生成的生成的大约大 70%。这部分可以归咎于使用了免费版本的编译器。由于其占用的程序空间为 37%，这是一个满意的结果。对于更大的项目，你可能必须使用汇编语言来容纳它。程序所示。再次，注释应该解释代码的作用。\n\
    \n### 10.51 使用位开启/关闭\n\n处理位（bits）是此类编程的核心。在汇编语言中，PIC 有 BSF 和 BCF 指令允许你开启或关闭位。注意“读取-修改-写入”问题。参见程序\
    \ 2-3 的连接，更新使用了一个数据类型 bool，但如果你需要多个位，有另一种方法。XC8 编译器有一个名为 bit 的数据类型，其值为 0 或 1。除了使用它们外，不需要做任何其他操作。通常在函数中声明变量时，它们被视为自动的（automatic）。它们必须是静态或全局的。要将变量声明为静态，请在声明前加上\
    \ static。\n\n```c\n// prog_04 C语言中的电压表\n#include <xc.h>\n// PIC16F182 配置位\n#pragma\
    \ config FOSC = INTOSC\n#pragma config WDTE = OFF\n#pragma config PWRTE = OFF\n\
    #pragma config MCLRE = OFF\n#pragma config CP = OFF\n#pragma config BOREN = OFF\n\
    #pragma config ESO = OFF\n#pragma config FCMEN = OFF\n#pragma config LVP = ON\n\
    \nchar tick_counter = 0;\n\nvoid interrupt(void)\n{\n  if (IOCAF5) // 检查是否为变化中断。\n\
    \  {\n    IOCAF5 = 0; // 重置中断标志。\n  }\n  else // 只有开启的中断必须是定时器溢出。\n  {\n    TMR0IF\
    \ = 0; // 重置中断标志。\n    tick_counter++;\n  }\n}\n\nvoid main()\n{\n  OPTION_REG\
    \ = 0xD7; // 书中的表 2-2。\n  INTCON = 0xE0; // 书中的表 2-3。\n  IOCIE = 1; // IOCIE 位。在\
    \ INTCON 寄存器中（第 3 位），之前的行可以写成 INTCON = xE8，此处省略。\n  TRISC = 0; // 设置 PORTC 为输出。\n\
    \  TRISA = 0x24; // 设置 PORTA 为输出，除去 RA2 和 RA5。\n  ADCON0 = 0x09; // 选择 AN2 (RA2)\
    \ 并启用 ADC。数据表第 136。\n  ADCON1 = 0xE3; // 右对齐结果，Fosc/64，内部 Vref。第 137。\n  OSCCON\
    \ = 0x70; // 第 65 页，32 MHz。\n  FVRCON = 0x83; // 见第 5 章表 5-3 和数据表第 128。\n  tick_counter\
    \ = 0;\n  unsigned char value = 0, state_m0 = 0, state_m1 = 0, state_m2 = 0, laps\
    \ = 0, F10V = 0, F1V = 0, F100mV = 0;\n  static bit dis_update = 0, vol_available\
    \ = 0, read_required = 0; // 标志位。\n\n  while (1)\n  {\n    /*  M0 */\n    switch\
    \ (state_m0)\n    {\n      case 0: if (tick_counter > 61)\n      {\n        value\
    \ = 10;\n        dis_update = 1;\n        read_required = 1;\n        tick_counter\
    \ = 0;\n        state_m0++;\n      }\n      break;\n      case 1: if (tick_counter\
    \ > 122)\n      {\n        if (vol_available)\n        {\n          laps = 0;\n\
    \          state_m0 = 3;\n        }\n        else\n        {\n          state_m0\
    \ = 2;\n        }\n      }\n      break;\n      case 2: if (laps >= 3)\n     \
    \ {\n        laps = 0;\n        IOCAF5 = 1;\n        FREN = 0;\n      }\n    \
    \  else\n      {\n        laps++;\n      }\n      break;\n      case 3: if (tick_counter\
    \ > 61)\n      {\n        value = F10V;\n        dis_update = 1;\n        read_required\
    \ = 1;\n        tick_counter = 0;\n        state_m0++;\n      }\n      break;\n\
    \      case 4: if (tick_counter > 61)\n      {\n        value = F1V;\n       \
    \ dis_update = 1;\n        read_required = 1;\n        tick_counter = 0;\n   \
    \     state_m0++;\n      }\n      break;\n      case 5: if (tick_counter > 61)\n\
    \      {\n        value = F100mV;\n        dis_update = 1;\n        read_required\
    \ = 1;\n        tick_counter = 0;\n        state_m0++;\n      }\n      break;\n\
    \      case 6: if (tick_counter > 61)\n      {\n        value = F10mV;\n     \
    \   dis_update = 1;\n        read_required = 1;\n        tick_counter = 0;\n \
    \       state_m0++;\n      }\n      break;\n    }\n\n    if (dis_update)\n   \
    \ {\n      /* M1 */\n      switch (state_m1)\n      {\n        case 0: if (tick_counter\
    \ > 122)\n        {\n          F10V = value;\n          tick_counter = 0;\n  \
    \        state_m1++;\n        }\n      break;\n        case 1: if (tick_counter\
    \ > 122)\n        {\n          F1V = value;\n          tick_counter = 0;\n   \
    \       state_m1++;\n        }\n      break;\n        case 2: if (tick_counter\
    \ > 122)\n        {\n          F100mV = value;\n          tick_counter = 0;\n\
    \          state_m1++;\n        }\n      break;\n        case 3: if (tick_counter\
    \ > 122)\n        {\n          F10mV = value;\n          tick_counter = 0;\n \
    \         state_m1++;\n        }\n      break;\n      }\n    }\n\n    if (read_required)\n\
    \    {\n      /* 更新逻辑此处 */\n    }\n  }\n}\n```\n\n"
