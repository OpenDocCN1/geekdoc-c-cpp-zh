  mdcn: "\n\n![](img/a08bd00952da48f769971864f33af432_80_0.png)\n\n如果 Vdd 电压经过调节，那么这样做是可以的；但如果你希望测量结果不受电源电压的影响，可以使用芯片的内部电压基准，正如我们在书中稍后将看到的那样。\n\
    \n## 4.5 调制输出脉冲\n\n为了给负载提供可变电压，PIC 使用了脉宽调制（PWM）技术。这涉及以快速速率切换输出的开启和关闭。我们的示例速率为\
    \ 1.95 kHz。输出切换的频率保持不变，但每个周期内输出开启的时间长度会发生变化，以控制供给给负载的功率。图 4-8 显示了三条迹形：\n\n- 迹形\
    \ A，输出开启时间短，关闭时间长，产生低功率输出。\n- 迹形 B \n- 迹形 C，开启时间长，关闭时间短，产生高输出功率。PIC 允许我们改变这种开启/关闭比例，精度高达\
    \ 1/1024，即 10 位分辨率。\n\nPWM 的巨大优势是，当完美的开关开启时，有电流通过但两端没有电压；当关闭时，两端有电压但没有电流通过。因此，它不会消耗任何功率。如果你尝试用串联通路晶体管来控制输出功率，晶体管将会产生功率损。然而，输出并非完美的开关，但损失非常小。输出电压可能是\
    \ 5V 或 0V，但通过在输出端并联电容可以使其看起来像平均电压。对于 LED 来说这不是必需，因为你的眼睛会对亮度取平均。\n\n图 4-7 读取输入电压\n\
    \n![](img/a08bd00952da48f769971864f33af432_81_0.png)\n\n### 4.5.1 脉冲亮度 LED\n\n\
    为了演示 PWM 的用法，程序 4-4 以周期性地改变 LED 的亮度。LED 应该像之前那样通过电阻连接，但连接到 *RC5*。从状态图图 4-9 开始，共有四种状态。在状态\
    \ 0 中，亮度恒定 41 ms，之后亮度增加 1，程序跳转到状态 1。如果已达到最大亮度，机器将跳转到状态 4 并将 TICK_COUNTER 重置为零。如果未达到最大亮度，状态变回\
    \ 0 并重复此循环。当达到最大亮度且处于状态 4 时，状态保持 41 ms，然后状态变为 3，亮度减 1。如果亮度高于最低值，状态返回 4 并重置 TICK_COUNTER\
    \ 为零。\n\n![](img/a08bd00952da48f769971864f33af432_81_1.png)\n\n图 4-8 脉宽调制\n\n\
    图 4-9 程序 4-4 状态图\n\n当亮度达到最低值时，状态从 3 变为 0，回到起始条件。\n\nPIC 具有许多与 PWM 外围设备相关的复杂功能。在这里，我们将使用一个简单的配置示例。我将展示如何使用解释位值的表格来设置此示例。数据手册提供了完整的解释。\n\
    \n必须配置四个特殊目的寄存器：*PR2, T2CON, CCP1CON* 和 *CCPR1L*。PWM 周期的周期是其频率的倒数。如上述，此频率将为 1.95\
    \ kHz。使用 Timer2 来确定频率。数据手册第 176 页的图 22-1 是该定时器的框图。寄存器 *TMR2* 通过来自 *Fosc/4* 的预分频器的脉冲递增。当\
    \ *TMR2* 中的值达到 *PR2* 中的值时，比较器给出输出，寄存器 *TMR2* 重置为零。\n\n如果你查看数据手册第 195 页的图 24-4，你会看到它是与另一个比较器和一个\
    \ S-R 触发器配合使用的。概述解释是：Timer2 以固定的间隔设置触发器，该间隔即为 PWM 周期的周期，在周期中间，触发器由另一个比较器通过比较来自\
    \ *CCPR1L* 的值来重置。这意味着我们可以通过改变 *CCPR1L*（8 位）以及来自位 *CCP1CON* <5:4> 的两个额外位的值来控制输出功率。来自\
    \ *CCP1CON* 的两个位是低有效位，因此我们不会使用它们。功率将通过在 *CCPR1L* 0 到 255 的范围内改变数值来调整。\n\n*T2CON*\
    \ 特殊寄存器被设置为提供 1.95 kHz 的 PWM 频率。表 4-7 显示了这些设置。预分频值 16 来自数据手册第 197 页的表 24-5。\n\n\
    为了解释此设置，振荡器频率将为32MHz。预分频器由 *Fosc/4* 馈电。\n\n**T2CON**\n| 位 | 值 | 描述 |\n| :--- |\
    \ :--- | :--- |\n| 7 | 0 | 未实现 |\n| 6 | 0 | 后分频器未使用，保持默认 |\n| 5 | 0 | |\n| 4 |\
    \ 0 | |\n| 3 | 1 | Timer2 开启 |\n| 2 | 1 | 预分频器设置为 16 |\n| 1 | 0 | |\n| 0 | 0 |\
    \ |\n\n**CCP1CON**\n| 位 | 值 | 描述 |\n| :--- | :--- | :--- |\n| 7 | 0 | 单输出 P1A（16F823，数据手册第5页）\
    \ |\n| 6 | 0 | |\n| 5 | 0 | 这些是用于设置脉冲宽的最低低有效位 |\n| 4 | 0 | |\n| 3 | 1 | 设置为 P1A\
    \ 高电平 PWM 模式。如果选择一个低电平模式，亮暗相位将反转。 |\n| 2 | 1 | |\n| 1 | 1 | |\n| 0 | 0 | |\n\n"
