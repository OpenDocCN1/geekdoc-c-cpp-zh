    \n## 6.7 • 二进制除法\n\n对于二进制除法，我将使用相似的重复减法技术。这将是整数除法，结果为实值下方的整数。例如，将 35 除以 4 在实数集中的结果是\
    \ 8.75，而整数除法的结果将是 8。以这个例子来计算 35 除以 4：\n\n35 – 4 – 4 – 4 – 4 – 4 – 4 – 4 – 4 =\
    \ 3\n\n这表明 4 可以除 32 次 8 次余 3。对于除法，我们需要做的就是不断减去除数，并计算它可以被减掉的次数。\n\n程序 6-5 两个十六位整数相乘\n\
    \n图 6-8 使用串口读取器\n\n再次，状态机仅用于将一个 16 位无符号整数除以另一个整数的子程序。*Xa* 是分子或被除数，*Xb* 是分母或除数，*Y*\
    \ 是商。*Xa* 由 *Xa1* 和 *Xa0* 组成，而 *Xb* 由 *Xb1* 和 *Xb0* 组成。*Y* 由 *Y1* 和 *Y0* 组成。商只需要一个\
    \ 16 位整数。除后的余数将位于 *Xc* 中。\n\n为了在程序再次需要时保留 *Xa* 的值，将其传输到由 *BUFFH* 和 *BUFFL* 组成的\
    \ *BUFF* 中。然后在每个循环中从 *BUFF* 中减去 *Xb*。\n\n状态 0 将 *Xa* 传输到 *BUFF* 并将 *Y* 和 *Xc*\
    \ 重置为零。重置 *Y* 和 *Xc* 看起来不像 Mealy 机器，因为它在跳转开始之前就已经完成了，但这样做是为了缩短代码。从状态 0 的跳转取决于\
    \ *Xb* 是否为 0。如果是，则子程序返回，因为除以 *Xb* 将导致减法循环无限运行，即除以零！\n\n如果 *Xb* 大于 0，则跳转到状态 1。在状态\
    \ 1 中，从 *BUFF* 中减去 *Xb*，并将结果放在 *BUFF* 中，直到 *BUFF* 小于零。如果结果小于 0，子程序返回。如果不是，则 *Y*\
    \ 加 1 并重复循环。这导致 *Y* 持有整数除法的商，*Xc* 保存余数。\n\n余数是最后一次减法之前 *BUFF* 的值。它存储在 *Xc* 中。图\
    \ 6-9 显示了状态图。程序 6-6 是该程序。此列表显示了 65535 除以 5997 得到商 11，余数 8。图 6-10 显示了使用串口读取器通过选项\
    \ *-h* 读取短整数（16 位整数）的输出。\n\n![](img/a08bd00952da48f769971864f33af432_118_0.png)\n\
