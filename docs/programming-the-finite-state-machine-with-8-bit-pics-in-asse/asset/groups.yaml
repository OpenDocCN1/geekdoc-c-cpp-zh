    ## 1.5.2 Assembling the Program


    To assemble the program, carry out the following:


    Copy the source file *prog_01_01.asm* from the *chap01_source_xxxx* (xxxx = Windows
    or Linux) directory to the working directory.


    Windows:


    Click on the *terminal_here.bat* batch file in the working terminal to open a
    terminal window. Type the following on the command line and press return:


    `gpasm.exe prog_01_01.asm`


    Linux:


    Open a virtual terminal and navigate to the working directory. Type the following
    on the command line and press return:


    `./gpasm prog_01_01.asm` This will generate a few files, one of which is the hex
    file *prog_01_01.hex*. To write this to the PIC, type the following on the command
    line and press return:


    Windows:

    `program_writer.exe prog_01_01.hex`


    Linux 32 bit:

    `sudo ./program_writer_32 prog_01_01.hex`


    Linux 64 bit:

    `sudo ./program_writer_64 prog_01_01.hex`


    The *gpasm* assembler produces a file *prog_01_01.hex* that is written to the
    PIC using ‘program_writer’. You will, of course, have to connect everything up
    as described earlier in the chapter. The message saying to check the bank bits
    is not an error. It is just a reminder to ensure you are in the right bank. Note
    how the value written to flash memory address 0x007 agrees with Fig 1-16. For
    the differences between Windows and Linux, please study Figures 1-7 and 1-8. (img/a08bd00952da48f769971864f33af432_29_0.png)


    I hope you are getting a feel for how assembly works. It is extremely verbose
    where every action is visible in the code. This makes it all the interesting as,
    unlike high-level languages where things seem to happen by magic, here you can
    trace what is happening at a hardware level. This means that you have to be on
    top of a lot more detail and is more work. The C programming language was developed
    fifty years ago to overcome the problems of writing code in assembly. Modern software
    projects would take an enormous amount of human work without languages like C++,
    Java, Python, etc. Please don’t get the idea that I’m trying to persuade you that
    assembly is better by using it here. It is generally agreed that you should code
    in a higher-level language to save time if nothing else. Modern compilers can
    outperform most humans at code optimisation. This book focuses on midrange PICs
    where programming in assembly is a practical proposition, and where executable
    code will be smaller and faster than that produced by the free version of the
    XC compiler. To be fair to Microchip, the free version states that smaller and
    faster code can be produced by the paid version. There is also good reason for
    coding in assembly. If you are doing this as a hobby or to learn then it is more
    fun. If you take a look at any code written in C for a PIC, like these you will
    see that there is still a need to manually select bits in registers when configuring
    oscillator, inputs, etc. Figure 1-17 Assembling prog_01_01.asm and Writing prog_01_01.hex
    to the PIC.


    The rest of the book is mostly about using finite state machine methods to structure
    your programs. This helps to keep things in some kind of order. Along the way,
    more features will be introduced. The last two chapters will be an introduction
    to programming in C where you can make a comparison with programs already written
    in assembly.


    ## Chapter 2 The Assembly Program as a Finite State Machine


    ### 2.1 Introduction


    This chapter demonstrates a format for laying out an FSM in assembly that will
    be used throughout the rest of the book. The first example will be a two-state
    machine that will have a structure that can be scaled to have more states and
    even more than one state machine in the program allowing a form of program threading.
    The PIC is not just a processor but has other features such as three timers that
    can run independently of the code. There is also the ability to interrupt and
    divert the program using events from within and from outside the PIC.


    As was mentioned in the first chapter I advise having the datasheet for these
    PICs to hand while programming, it is *DS4001413E* and is available for free download
    from the Microchip website. Throughout the book, I will refer to pages in the
    datasheet where relevant. Where a page number is quoted it refers to the Microchip
    datasheet.


    ### 2.2 A State Machine Framework for Assembly Language


    Figure 2-1 shows the two-state machine to flash an LED on and off. We will use
    this as the first step to develop a standard framework for an FSM in assembly
    language. With a Moore machine, the outputs are dependent only on the current
    state, whereas with a Mealy machine the outputs are dependent on the state and
    the value of the inputs. Most of the FSMs in this book will be based on the Mealy
    format, in the state diagram here the input is the expiry of the timer, this causes
    the transition, and the outputs are the resetting of the timer and the switching
    of the LED. The inputs and outputs are written on the transition arrow separated
    by a forward slash.


