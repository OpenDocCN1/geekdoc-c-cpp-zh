  - "[PAGE 118]\n\np\n\ny\n\n● 119\n\n GOTO $+4 ; Here because BUFFH is not zero.\n\
    \n MOVF BUFFL, F ; Here because BUFFH is zero.\n\n BTFSC STATUS, Z ; Test BUFFL.\n\
    \n RETURN ; Here because BUFFH and BUFFL are both zero.\n\n ADD\\_REGISTERS\\\
    _16 Y1, Y0, Xb1, Xb0, Y3, Y2, Y1, Y0\n\n MOVLW 1\n\n SUBWF BUFFL, F\n\n CLRW\n\
    \n SUBWFB BUFFH, F\n\n GOTO MULT\\_S1 \n\nTX\\_THIRTY\\_TWO\\_BIT\\_NUMBER ; There\
    \ is 4 bytes because the serial reader program reads either 1,\n\n ; 2 or 4 bytes\
    \ and we need 3.\n\n BANKSEL TXREG\n\n MOVF Y3, W ; Put the highest order byte\
    \ in W.\n\n MOVWF TXREG ; Transmit W using the EUSART.\n\n BTFSS TXSTA, TRMT\n\
    \n GOTO $-1\n\n MOVF Y2, W ; Put the high middle order byte in W.\n\n MOVWF TXREG\
    \ ; Transmit W using the EUSART.\n\n BTFSS TXSTA, TRMT\n\n GOTO $-1\n\n MOVF Y1,\
    \ W ; Put the low middle order byte in W.\n\n MOVWF TXREG ; Transmit W using the\
    \ EUSART.\n\n BTFSS TXSTA, TRMT\n\n GOTO $-1\n\n MOVF Y0, W ; Put the lowest order\
    \ byte in W.\n\n MOVWF TXREG ; Transmit W using the EUSART.\n\n BTFSS TXSTA, TRMT\n\
    \n GOTO $-1\n\n RETURN\n\n END\n\n![](img/a08bd00952da48f769971864f33af432_118_0.png)\n\
    \n**6.7 • Binary Division**\n\nFor binary division, I’ll use a similar technique\
    \ of repetitive subtraction. This will be integer \n\ndivision where the result\
    \ is the integer below the real value. For example, dividing 35 by 4 \n\ngives\
    \ the result in the set of real numbers of 8.75, with integer division the result\
    \ will be 8. \n\nTaking this example to divide 35 by 4.\n\n \n\n35 – 4 – 4 - 4\
    \ - 4 – 4 – 4 - 4 - 4 = 3 \n\nThis shows that 4 divides into 32 8 times with 3\
    \ left over. All we have to do for division is \n\nto subtract the divisor over\
    \ and over counting the number of times it can be subtracted.\n\nProgram 6-5 Multiplying\
    \ Two Sixteen-Bit Integers\n\nFigure 6-8 Using Serial Reader"
  - "[PAGE 119]\n\ng\n\ng\n\ny\n\n● 120\n\nAgain the state machine is only for the\
    \ subroutine that divides one sixteen-bit unsigned \n\ninteger into another. *Xa*\
    \ is the numerator or dividend and *Xb* is the denominator or divisor, \n\n*Y*\
    \ is the quotient. *Xa* is made up of *Xa1* and *Xa0* and *Xb* is made up of *Xb1*\
    \ and *Xb0*. *Y* is \n\nmade up of *Y1* and *Y0*. The quotient will only need\
    \ a 16-bit integer. The remainder after \n\nthe division will be in *Xc*.\n\n\
    To preserve the value of *Xa* if it is needed again in the program, it gets transferred\
    \ to *BUFF *\n\nmade up of *BUFFH* and *BUFFL*. *Xb* is then subtracted from *BUFF*\
    \ on each loop.\n\nState 0 transfers *Xa* to *BUFF* and resets *Y* and *Xc* to\
    \ zero. The resetting of *Y* and *Xc* does \n\nnot look like a Mealy machine as\
    \ it happens before the start of the transitions but has been \n\ndone this way\
    \ to shorten the code. The transitions from state 0 depend on if *Xb* is zero\
    \ or \n\nnot. If it is, the subroutine returns as division by *Xb* would result\
    \ in the subtraction loop \n\nrunning forever, division by zero!\n\nIf *Xb* is\
    \ greater than zero, the transition is to state 1. In state 1, *Xb* is subtracted\
    \ from *BUFF *\n\nand the result placed in *BUFF* until *BUFF* is less than zero.\
    \ If the result is less than zero, \n\nthe subroutine returns. If it isn't, *Y*\
    \ is incremented and the loop repeated. This results in *Y *\n\nholding the quotient\
    \ of the integer division and *Xc* holding the remainder.\n\nThe remainder is\
    \ the value of *BUFF* before the last subtraction. It is stored in *Xc*. Figure\
    \ \n\n6-9 shows the state diagram. Program 6-6 is the program. This listing shows\
    \ 65535 being \n\ndivided by 5997 resulting in 11 with a remainder of 8. Figure\
    \ 6-10 shows the output from \n\nserial reader using the option *\\-h* to read\
    \ a short (16-bit integer).\n\n![](img/a08bd00952da48f769971864f33af432_119_0.png)\n\
    \nFigure 6-9 State Diagram for the Division Subroutine"
