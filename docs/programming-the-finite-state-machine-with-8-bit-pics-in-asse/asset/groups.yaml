    ## Chapter 5 • Project Hardware Construction


    ### 5.1 • Introduction


    Using a plug-in breadboard is a convenient way of developing software or wanting
    to try different circuits. Sooner or later, you will want to make a project to
    keep and this will require some sort of circuit board. There are many available
    options and if you are experienced at building you will have your favoured methods.
    This chapter is for those who are new to circuit construction or want to try something
    different. The method to be described here is my preferred method. They are, however,
    more practical than professional looking. They require the use of basic hand tools
    but a workshop is not necessary. A piece of plywood or chipboard to protect your
    work surface is all that is required. You will need to solder so health and safety
    must be considered. Soldering irons will burn you if you touch the wrong end.
    You could also accidentally burn through a mains supply. Also, breathing in the
    fumes from hot solder is not recommended. When using drills and other tools with
    points or sharp edges you can cut yourself. Remember to protect your eyes from
    solder and swarf. **Be careful!** The above list of mishaps is not exhaustive.


    I will begin by giving an overview of the suggested method and make comparison
    to comparable methods. This method is meant for building single projects and not
    for commercial production. It gives a reliable board that is easy to modify if
    you change your design. It is also very easy to plan the layout and the wiring.
    How tidy you make your boards is up to you. Ugly boards work just as well. This
    chapter will describe the construction of a complete project, this being a digital
    DC voltmeter with a range of 0V to 20V, powered by four 1.5 V cells (AA or AAA
    size). The display is a single-digit 7-segment LED that flashes four significant
    figures of the reading. It turns off when no voltage is detected for three readings.
    This chapter will deal only with the construction and testing of the board. The
    voltmeter program will be covered in Chapter 7 after binary arithmetic has been
    described in Chapter 6. At the end of this chapter is a test program to demonstrate
    the board.


    ### 5.2 • Overview of the Suggested Method


