- md: '

    ![](img/a08bd00952da48f769971864f33af432_85_0.png)


    Figure 4-11 shows the state diagram for the program. The program remains in state
    0 while the switch is open and moves to state 1 if it closes. On transition, the
    pulse counter is incremented by 1 and the value transmitted. The machine remains
    in state 2 until the switch opens again when it then transitions to state 0.


    ![](img/a08bd00952da48f769971864f33af432_85_1.png)


    The program below has comments on almost every line.


    By running the serial read program, you can see the counts incrementing every
    time you close the switch. Depending on the switch you are using, there might
    be a problem though. If you are just touching a wire end to use as a switch, the
    problem will be very pronounced. This is the problem of switch bounce. Switch
    bounce is when the switch does not close or open cleanly and bounces several times.
    The PIC is fast enough to count the bounces,


    Figure 4-10 Circuit for Program 4-5


    Figure 4-11 State Diagram for Program 4-5


    when the switch closes, several counts will be recorded, not just one. This problem
    can be overcome by connecting the switch to the input using a resistor-capacitor
    network. These, however, are more components that take up space. Switch bounce
    can be eliminated using software.


    Figure 4-12 shows an oscilloscope trace of voltage across a push switch as it
    closes. The time interval between the two vertical dotted ruler lines is 1ms.
    This is just one example. Different switches will have different characteristics
    and a given switch will not always respond in the same way every time.


    ![](img/a08bd00952da48f769971864f33af432_86_0.png)


    Figure 4-12 Example of a Switch Contact Bounce


    ;prog_04_05.asm


    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm\_macros.inc>


    RADIX DEC ; Default numbers are to base 10.

    BOOK\_CONFIGURATION ; See macro in fsm\_macros.inc.


    CBLOCK 0x70

    PULSE\_COUNTER

    ENDC


    ORG 0X00

    MOVLB 1

    BCF OPTION\_REG, 7 ; Weak pull ups enable

    SET\_FREQ\_32MHZ ; See file fsm\_macros.inc.

    MOVLB 3

    BCF ANSELA, 2 ; Set RA2 as a digital input.

    SET\_SERIAL\_TX\_16F1823 ; See file fsm\_macros.inc, this sets TXEN, SPEN, sets
    the Baud rate and changes the use of pin 2 to be TX.

    CLRF PULSE\_COUNTER ; Initialize count to zero.

    BANKSEL PORTA


    ;-------Machine states

    S0

    BTFSC PORTA, 2 ; If switch is open input will be high weak pull-up resistor will
    make input high. Weak pull-ups are enabled by default. See page 119 in the datasheet.

    ; If high no skip so program stays in state 0

    GOTO S0

    INCF PULSE\_COUNTER, F

    MOVF PULSE\_COUNTER, W ; Move value in PULSE\_COUNTER to W

    BANKSEL TXREG

    MOVWF TXREG ; Loading TXREG starts the transmission.

    BTFSS TXSTA, TRMT ; When the transmission has completed TRMT gets set, until then
    this line and the next loop around.

    GOTO $-1

    S2

    BANKSEL PORTA

    BTFSS PORTA, 2 ; If switch is closed input will be low. No skip the program stays
    in state 2.

    GOTO S2

    GOTO S0

    END


    ## 4.6.2 First method eliminating the effect of switch bounce


    One software method of eliminating the effect of switch bounce is to introduce
    a time delay after the first detection of a switch opening or closing. This is
    the method used in Program 4-6. It is not the best way of dealing with the problem
    as it causes the program to stall for a short time: in this case about 33 ms.
    Although this is not noticeable to a human, in a busy program it could be undesirable.
    At a clock frequency of 32MHz, this is 264000 instructions.

    Period of one instruction = 4/(32x10^6) = 1.25x10^-7 s

    Number of instructions in 33 ms = 33/1.25x10^-7 = 264000 instructions


    Program 4-5 Counting Inputses Without Switch Bounce


    ;prog_04_06.asm

    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm\_macros.inc>

    ;This is not the best way to deal with the problem of bounce.

    RADIX DEC ; Default numbers are to base 10.

    BOOK\_CONFIGURATION ; See macro in fsm\_macros.inc.


    CBLOCK 0x70

    PULSE\_COUNTER

    TICKS

    ENDC


    ORG 0X00

    GOTO START

    ORG 0X04 ; Interrupt vector.

    BCF INTCON, TMR0IF ; Clear the tmr0 overflow flag.

    INCF TICKS, F ; Increment TICKS by 1.

    RETFIE ; Return from interrupt.

    START:

    MOVLB 1

    SET\_TMR0\_CASE1 ; See file fsm\_macros.inc.

    BCF OPTION\_REG, 7 ; Weak pull ups enable, this has to come after that macro changes
    the OPTION\_REG.

    SET\_FREQ\_32MHZ ; See file fsm\_macros.inc.

    MOVLB 3

    BCF ANSELA, 2 ; Set RA2 as a digital input.

    SET\_SERIAL\_TX\_16F1823 ; See file fsm\_macros.inc, this sets TXEN, SPEN, sets
    the Baud rate and changes the use of pin 2 to be TX.

    CLRF PULSE\_COUNTER ; Initialize count to zero.


    ;-------Machine states

    S0

    BANKSEL PORTA

    BTFSC PORTA, 2 ; If switch is open input will be high weak pull-up resistor will
    make input high. Individual pull-ups are enabled by default. See page 119 in the
    datasheet.

    ; If high no skip so program stays in state 0

    GOTO S0

    CALL DELAY\_33\_ms ; Call the 33 ms subroutine.

    S1

    INCF PULSE\_COUNTER, F

    MOVF PULSE\_COUNTER, W ; Move value in PULSE\_COUNTER to W

    BANKSEL TXREG

    MOVWF TXREG ; Loading TXREG starts the transmission.

    BTFSS TXSTA, TRMT ; When the transmission has completed TRMT gets set, until then
    this line and the next loop before moving to state 2.

    GOTO $-1

    S2

    BANKSEL PORTA

    BTFSS PORTA, 2 ; If switch is closed input will be low. No skip the program stays
    in state 2.

    GOTO S2

    CALL DELAY\_33\_ms ; Call the 33 ms subroutine.

    GOTO S0


    ;Subroutine

    DELAY\_33\_ms

    BANKSEL TMR0

    CLRF TMR0 ; Start the subroutine with TMR0 at 0.

    CLRF TICKS ; Start the subroutine with TICKS at 0.

    LOOP

    MOVLW 4

    IF\_LESS\_THAN\_W TICKS

    GOTO LOOP ; Stay in the subroutine until 4 ticks of 8.2 ms.

    RETURN ; Return from subroutine.

    END


    Program 4-6 Counting Input Pulses with a Time Delay to Eliminate Bounce


    This method works and is fine where the program has nothing else to do. The next
    program takes a different approach where there is no blocking of the program so
    that required other things can be done while waiting for the switch contacts to
    settle down.


    ## 4.6.3 A Better Method of Eliminating the Effect of Switch Bounce


    This program might seem complicated and difficult to follow as it uses two state
    machines running together as threads. The state machine technique keeps the different
    functions separate and easy to write. The first machine M0 is the same as the
    previous program except that it does not look at the input from the switch directly.
    It is informed of the switch position by a signal from the other machine, M1.


    Machine M1 monitors the input directly and if the switch moves to open from closed
    or from closed to open, it starts counting 1ms interrupt ticks. Only if the counter
    reaches 25 without the input bouncing, does it change the signal that is used
    by M0.


    The way the two machines run together is: once a block of state code is executed
    in one machine, the program executes a block of state code in the other machine.
    No spinning loops are used as time delays except for waiting for serial transmission
    of one byte to complete. This means the processor is not wasting cycles. Figure
    4-13 shows the state diagram for Program 4-7.


    ![](img/a08bd00952da48f769971864f33af432_89_0.png)


    Figure 4-13 State Diagram for Program 4-7


    ;prog_04_07.asm

    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm\_macros.inc>


    RADIX DEC ; Default numbers are to base 10.

    BOOK\_CONFIGURATION ; See macro in fsm\_macros.inc.


    CBLOCK 0x70

    PULSE\_COUNTER

    TICKS

    STATE\_M0

    STATE\_M1

    CONTACT\_SIGNAL ; Debounced signal in bit 0.

    ENDC


    ORG 0X00

    GOTO START

    ORG 0X04 ; Interrupt vector.

    BCF INTCON, TMR0IF ; Clear the tmr0 overflow flag.

    INCF TICKS, F

    RETFIE ; Return from interrupt.

    START:

    MOVLB 1

    SET\_TMR0\_CASE2 ; Gives 1 ms ticks. See file fsm\_macros.inc

    BCF OPTION\_REG, 7 ; Weak pull ups enable.

    SET\_FREQ\_32MHZ ; See file fsm\_macros.inc.

    MOVLB 3

    BCF ANSELA, 2 ; Set RA2 as a digital input.

    SET\_SERIAL\_TX\_16F1823 ; See file fsm\_macros.inc, this sets TXEN, SPEN, sets
    the Baud rate and changes the use of pin 2 to be TX.

    CLRF TICKS ; Initialize count to zero.

    CLRF STATE\_M0

    CLRF STATE\_M1

    CLRF PULSE\_COUNTER

    BANKSEL PORTA

    SWITCH\_M0

    MOVF STATE\_M0, W ; Move STATE\_0 to the working register.

    BRW ; Program jumps by the value moved into the working register.

    GOTO M0\_S0

    GOTO M0\_S1

    SWITCH\_M1

    MOVF STATE\_M1, W ; Move STATE\_1 to the working register.

    BRW ; Program jumps by the value moved into the working register.

    GOTO M1\_S0

    GOTO M1\_S1

    GOTO M1\_S2

    GOTO M1\_S3


    ;-------Machine states

    M0\_S0

    BTFSC CONTACT\_SIGNAL, 0 ; Using bit 0 as contacts’ variable. Skip if close that
    is low.

    GOTO M0\_S1 ; Remain in state 0 awaiting contact closure.

    M0\_S1

    BTFSS CONTACT\_SIGNAL, 0 ; Skip if opened.

    GOTO M0\_S1 ; Remain in state 1 awaiting contact opening.

