    BTFSC STATUS, Z ; If Y0 rolls over to 0, Y1 has to be incremented with the carry.

    INCF Y1, F

    GOTO DIV_S1


    MULT_TWO_SIXTEEN_BIT_NUMBERS ; Y = Xa*Xb, note each variable has a high and low
    byte.

    MULT_S0

    CLRF Y3 ; Clear output to zero. Here because Xb0 is not zero.

    CLRF Y2 ; Clear output to zero.

    CLRF Y1 ; Clear output to zero.

    CLRF Y0 ; Clear output to zero.

    MOVF Xb1, F ; By moving a file to itself the Z flag in STATUS gets affected.

    BTFSS STATUS, Z ; Test Xb1.

    GOTO $+4 ; Here because Xb1 is not zero.

    MOVF Xb0, F ; Here because Xb1 is zero.

    BTFSC STATUS, Z ; Test Xa0.

    RETURN ; Here because Xb1 and Xa0 are both zero.

    MOVF Xa1, W

    MOVWF BUFFH ; Move Xa1 to BUFFH.

    MOVF Xa0, W

    MOVWF BUFFL ; Move Xa0 to BUFFL.

    MULT_S1

    MOVF BUFFH, F ; By moving a file to itself the Z flag in STATUS gets affected.

    BTFSS STATUS, Z ; Test BUFFH.

    GOTO $+4 ; Here because BUFFH is not zero.

    MOVF BUFFL, F ; Here because BUFFH is zero.

    BTFSC STATUS, Z ; Test BUFFL.

    RETURN ; Here because BUFFH and BUFFL are both zero.

    ADD_REGISTERS_16 Y1, Y0, Xb1, Xb0, Y3, Y2, Y1, Y0

    MOVLW 1

    SUBWF BUFFL, F

    CLRW

    SUBWFB BUFFH, F

    GOTO MULT_S1


    EXTRACT_SIG_FIGS ; Subroutine is called with the divisor in Xb1:Xb0.

    MOVLB 0

    CLRF Xa2

    MOVF RESBUFFH, W

    MOVWF Xa1

    MOVF RESBUFFL, W

    MOVWF Xa0

    CALL DIV_24_BY_16_BIT

    MOVF Y0, W

    MOVWF FIG ; The extracted significant figure. FIG = RESBUFF/Xb.

    MOVF Xc1, W ; Remainder from the division RESBUFF/Xb.

    MOVWF RESBUFFH

    MOVF Xc0, W ; Remainder from the division RESBUFF/Xb.

    MOVWF RESBUFFL

    RETURN

    END


    ## 7.3 • Scaling the Raw Analog Value


    Machine *M3* deals with the analog-to-digital conversion. It puts the raw value
    in *ADRESH:ADRESL* with the ten-bit result right justified so that the eight least
    significant bits are in *ADRESL* and the two most significant bits are in *ADRESH*.
    This is configured in *ADCON1*.


    Program 7-1 Voltmeter Program


    | ADCON1 | Description |

    | :--- | :--- |

    | E 7 1 | ADRESH:ADRESL Right justified. Eight least significant bits in ADRESL
    |

    | 6 1 | Set the ADC clock period to 2 μS for 32 Mhz clock speed. See Table 16-1
    in the data sheet |

    | 5 1 4 0 3 0 | Unimplemented |

