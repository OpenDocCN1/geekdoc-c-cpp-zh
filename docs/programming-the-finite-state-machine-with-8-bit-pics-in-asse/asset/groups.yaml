    \ out to a file using *serial\\_read*. The PIC was woken \n\nfrom sleep and ran\
    \ around the states displaying four zeros, three times before sleeping \n\nagain.\n\
    \n**8.8 • A List of Things to Remember**\n\n• \n\nHave a clear idea of what the\
    \ program has to do\n\n• \n\nBreak the program down into separate smaller problems\n\
    \n• \n\nDraw a top-level state chart or start with a flow chart to get a picture\
    \ of what you want\n\n• \n\nConsider using sub-states inside the main states to\
    \ deal with awkward details that \n\nwould otherwise add many more states\n\n\
    • \n\nDraw the circuit diagram and identify the inputs and outputs you need\n\n\
    • \n\nStart coding in small chunks and test as you go\n\n• \n\nGet the basic configuration\
    \ correct by using small temporary test routines to prove \n\ninputs, outputs,\
    \ and timers, etc\n\n• \n\nComment on as many lines as you can \n\n• \n\nKeep\
    \ your comments, code, and state diagrams synchronized\n\n• \n\nUse debugging\
    \ to troubleshoot\n\n• \n\nBank selection is probably the first place to look\
    \ for a problem\n\n• \n\nIf you get completely stuck, stop working and do something\
    \ else before trying again \n\nlater"
  - "[PAGE 150]\n\np\n\np\n\n● 151\n\n**Chapter 9 • A Comparison with C**\n\n**9.1\
    \ • Introduction**\n\nAssembly language has advantages and disadvantages. One\
    \ advantage is the insight into \n\nthe hardware and what your code does. If you\
    \ are a hobbyist, then using assembly can be \n\nfun and interesting. If you are\
    \ a student, it will give you a better foundation for when you \n\ncome to use\
    \ higher-level languages, or need to get the most out of a chip. For PICs, the\
    \ \n\nfree version of the XC8 compiler will generally create larger code than\
    \ you can do yourself \n\nin assembly. One of the purposes of this book is to\
    \ show how the finite state machine \n\napproach could give structure to an assembly\
    \ program, making it easier to write and just \n\nas important, easier to read.\
    \ The last two chapters are about using C with FSMs. I assume \n\nthat you have\
    \ never used C before. This chapter will firstly be about installing the compiler\
    \ \n\nand will detail some of the essential knowledge regarding the language.\
    \ Writing software \n\nin a higher-level language does save you time, so provided\
    \ the program performs correctly \n\nand fits into the available memory, using\
    \ C makes sense. \n\n**9.2 • The Microchip XC8 Compiler**\n\nThe compiler used\
    \ is the free version of Microchip’s XC8. The code will be written in a text \n\
    \nfile and the hex file produced by the compiler will be written to the chip with\
    \ the FTDI \n\nlead and the *program\\_writer* program used throughout the book.\
    \ The compiler is available \n\nfor free download from Microchip’s website. One\
    \ way to find the page is to Google “XC8 \n\ndownloads”, or navigate from their\
    \ home page to Technical Support, Resources, C Compilers \n\nand then Downloads.\
    \ For this book, we will be using XC8 as a stand-alone program without \n\nMPLAB\
    \ where you would have a graphic user interface (GUI). This will be done by running\
    \ it \n\nfrom the command line. Make sure you get the correct version for either\
    \ Linux or Windows.\n\n**9.2.1 • XC8 for Microsoft Windows**\n\nRun the installer\
    \ file and answer the terms and conditions questions. Accept the default \n\n\
    location for installation, and agree to add XC8 to the path environment variable.\
    \ It is up to \n\nyou if you want to buy a license, use a free trial of the paid-for\
    \ version, or just use the free \n\nversion. For this book, the free version is\
    \ all you need. \n\n**9.2.2 • XC8 for 32 Bit Debian-Based Distributions**\n\n\
    This applies to Debian and its derivatives such as Ubuntu and Mint. Download the\
    \ Linux \n\nversion of the installer. Its file name will end with .run. Note that\
    \ this is not free as in open-\n\nsource software. You will not be installing\
    \ it the way you would normally, with the package \n\nmanager taking care of things.\
    \ The first thing you will have to do is make the file executable \n\nby running\
    \ this command as shown in Fig 9-1. Here I downloaded the file to my Downloads\
    \ \n\ndirectory and the command *chmod +x xc8-v2.10-full-install-linux-installer.run*\
    \ will make it \n\nexecutable. Note: the version might be different now."
- md: "\nThe installer can now be run. However, you will need root permission: this\
    \ is done by using *sudo* in front of the command, as in Fig 9-2.\n\n![](img/a08bd00952da48f769971864f33af432_151_1.png)\n\
    \nAs described for Windows, you will be asked several questions. This time the\
    \ default location is in the */opt* directory. This is OK as it will not get in\
    \ the way of your package manager.\n\n## 9.2.3 • XC8 for 64 Bit Debian-Based Distributions\n\
    \nThe XC8 compiler is a 32-bit program. To run it on a 64-bit Debian based system\
    \ such as Ubuntu, you have to do a few things to make it run 32-bit programs.\n\
    \nOn the command line as *sudo*, run these commands:\n\n```bash\nsudo dpkg --add-architecture\
    \ i386\nsudo apt-get update\n```\n\nNext, you have to install the library by running\
    \ this command:\n\n```bash\nsudo apt-get install libc6:i386\n```\n\nNow you can\
    \ install XC8 as described above for 32-bit Debian based systems.\n\n## 9.2.4\
    \ • XC8 for 64-Bit Fedora\n\nThere is only a 64-bit system available now for Fedora.\
    \ To run the 32-bit XC8, you have to add a library. Fig 9-3 shows the steps to\
    \ do this. Using *dnf*, the package manager, you can find the library version\
    \ you need and install it. Figure 9-3 shows you how to go about this. The exact\
    \ details might have changed by the time you are reading this. Once this is complete,\
    \ the XC8 installer can be used as described above for Debian based systems.\n\
    \nFigure 9-1 Making the XC8 Installer Executable\n\nFigure 9-2 Running The XC8\
    \ Installer\n\n## 9.3 • Introduction to C\n\nIt is assumed that you have not used\
    \ C before. These days, C might not be considered to be a high-level language\
    \ but is more human-friendly than assembly language. It is not like Python for\
    \ example, where you don’t need to know anything about the machine you are running.\
    \ With C you are never far from your hardware and you have direct access to memory\
    \ locations, making it particularly important for microcontrollers. You can practice\
    \ C programming on your computer using the GCC compiler on Linux or MinGW for\
    \ Windows. There is lots of help contained in books and online if you want to\
    \ try. For our two PICs, all examples will be for XC8. This is not a course on\
    \ C programming. What I will do is reproduce some of the programs already made\
    \ in previous chapters but in C. There will be some explanation on what is going\
    \ on, as well as some additional C specific points. The two chapters in this book\
    \ can't possibly cover all of C and the full details of the XC8 compiler. For\
    \ more detailed information on the compiler, there is the Microchip user guide,\
    \ DS50002053G, available for download.\n\nTo begin, let's look at the ‘Hello World’\
    \ program from Chapter 1. This is the simple LED blinking program.\n\nFigure 9-3\
    \ Installing the 32-bit Library for Fedora\n\n### 9.3.1 • Hello World in C\n\n\
    If you look at Program 1-1 from Chapter 1, this was a very simple LED flashing\
    \ program using two loops as time delays. The delay in each loop was achieved\
    \ by decrementing an 8-bit file until it reached zero, then moving to the next\
    \ loop to the same then back to the beginning over and over. Entering one loop\
    \ switched the LED off and the other loop switched it on. The frequency of the\
    \ oscillator was set to 31.25 kHz. Program 9-1 shown below does the same thing\
    \ but in C. I will use these two programs to explain some of the key points of\
    \ a C program.\n\n```c\n//prog_09_01\n\n#include <xc.h> // Must be included for\
    \ all programs.\n\n// PIC12F1822 Configuration Bit Settings\n// CONFIG1\n#pragma\
    \ config FOSC = INTOSC\n#pragma config WDTE = OFF\n#pragma config PWRTE = OFF\n\
    #pragma config CP = OFF\n#pragma config BOREN = OFF\n#pragma config IESO = OFF\n\
    #pragma config MCLRE = OFF\n#pragma config FCMEN = OFF\n\n// CONFIG2\n#pragma\
    \ config LVP = ON\nvoid main(void) @ 0x20 // The @ 0x20 makes the compiler start\
    \ main() at this address\n{ // to save loading time with 'program_writer'.\n unsigned\
    \ char counter; // Declare the variable 'counter'.\n\n TRISAbits.TRISA2 = 0; //\
    \ Set RA2 as an output.\n\n OSCCON = 0;\n}\n```\n"
  mdcn: "\n现在可以运行安装程序了。然而，你需要 root 权限：这通过在命令前使用 *sudo* 来实现，如图 9-2 所示。\n\n![](img/a08bd00952da48f769971864f33af432_151_1.png)\n\
    \n正如在 Windows 中描述的，你将被问及几个问题。这次默认位置位于 */opt* 目录。这是可以的，因为它不会影响你的包管理器。\n\n## 9.2.3\
    \ • 适用于 64 位 Debian 系系统的 XC8\n\nXC8 编译器是一个 32 位程序。要在 Ubuntu 等 64 位 Debian 系系统上运行它，你必须进行一些操作才能使其运行\
    \ 32 位程序。\n\n在命令行中以 *sudo* 运行这些命令：\n\n```bash\nsudo dpkg --add-architecture i386\n\
    sudo apt-get update\n```\n\n接下来，你必须运行此命令来安装库：\n\n```bash\nsudo apt-get install\
    \ libc6:i386\n```\n\n现在，你可以像上述方法为 32 位 Debian 系系统那样安装 XC8 了。\n\n## 9.2.4 • 适用于\
    \ 64 位 Fedora 的 XC8\n\n目前 Fedora 只有 64 位系统。要运行 32 位的 XC8，你需要添加库。图 9-3 显示了执行此操作的步骤。使用包管理器\
    \ *dnf*，你可以找到所需的库版本并安装。图 9-3 展示了如何操作。在你阅读此内容时，具体细节可能已经发生了变化。完成后，就可以像上述 Debian\
    \ 系系统那样使用 XC8 安装程序了。\n\n图 9-1 使 XC8 安装程序可执行\n\n图 9-2 运行 XC8 安装程序\n\n## 9.3 • C语言简介\n\
    \n假设你以前没有使用过 C 语言。如今，C 可能不再被视为高级语言，但它比汇编语言更人性友好。它不像 Python，在 Python 中你不需要了解关于运行它的机器的任何信息。使用\
    \ C 时，你离硬件并不远，并且可以直接访问内存位置，这对于微控制器特别重要。你可以使用 Linux 上的 GCC 编译器或 Windows 上的 MinGW\
    \ 在电脑上练习 C 编程。如果你想尝试，书籍和网上有很多帮助信息。对于我们的两款 PIC，所有的示例都将使用 XC8。这不是一门 C 语言编程课程。我要做的是重现之前章节已经制作的一些程序，但用\
    \ C 语言来实现。我会对发生的情况进行一些解释，并提供额外的 C 语言特定点。书中的这两个章节无法涵盖所有的 C 语言和 XC8 编译器的完整细节。关于编译器的更多信息，可以下载\
    \ Microchip 用户指南 DS50002053G。\n\n首先，让我们看看第 1 章中的“Hello World”程序。这是一个简单的 LED 闪烁程序。\n\
    \n图 9-3 为 Fedora 安装 32 位库\n\n### 9.3.1 • C 语言中的 Hello World\n\n如果你看第 1 章的程序 1-1，这是一个非常简单的\
    \ LED 闪烁程序，使用两个循环作为时间延迟。每个循环中的延迟是通过递减一个 8 位文件直到其归零实现的，然后移动到下一个循环执行相同操作，然后反复回到开头。进入一个循环会关闭\
    \ LED，另一个循环会开启它。振荡器频率设置为 31.25 kHz。下所示程序 9-1 执行了相同的功能，但使用的是 C 语言。我将使用这两个程序来解释\
    \ C 语言的一些关键点。\n\n```c\n//prog_09_01\n\n#include <xc.h> // 所有程序都必须包含此文件。\n\n//\
    \ PIC12F1822 配置位设置\n// CONFIG1\n#pragma config FOSC = INTOSC\n#pragma config WDTE\
    \ = OFF\n#pragma config PWRTE = OFF\n#pragma config CP = OFF\n#pragma config BOREN\
    \ = OFF\n#pragma config IESO = OFF\n#pragma config MCLRE = OFF\n#pragma config\
    \ FCMEN = OFF\n\n// CONFIG2\n#pragma config LVP = ON\nvoid main(void) @ 0x20 //\
    \ @ 0x20 使编译器从此地址开始 main()\n{ // 以节省 'program_writer' 的加载时间。\n unsigned char counter;\
    \ // 声明变量 'counter'。\n\n TRISAbits.TRISA2 = 0; // 将 RA2 设置为输出。\n\n OSCCON = 0;\n\
    }\n```\n"
