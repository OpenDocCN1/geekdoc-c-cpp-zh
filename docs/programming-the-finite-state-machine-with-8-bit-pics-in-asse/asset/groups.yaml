    \ to Xa.\nMOVLW 3\nMOVWF Xb ; Move 3 to Xb.\nCALL ADD_TWO_EIGHT_BIT_NUMBERS ;\
    \ Call subroutine.\nCALL TX_SIXTEEN_BIT_NUMBER ; Call subroutine.\nGOTO LOOP\n\
