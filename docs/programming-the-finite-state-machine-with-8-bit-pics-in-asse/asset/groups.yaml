    \ waiting for TRMT to go high.\nRETURN\n\nEND\n\n![](img/a08bd00952da48f769971864f33af432_121_0.png)\n\
    \nFinally, a similar program to divide a 16-bit number into a 24-bit number. This\
    \ will be required for the scaling of the raw result from the analog to digital\
    \ converter in the voltmeter. The method is the same in the previous program except\
    \ the numerator has an extra 8 bits.\n\nProgram 6-6 Integer Division - Two Sixteen-Bit\
    \ Numbers\n\nFigure 6-10 Using Serial Reader\n"
