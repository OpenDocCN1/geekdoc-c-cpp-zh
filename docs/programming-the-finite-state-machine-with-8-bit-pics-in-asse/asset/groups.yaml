    **Andrew Pratt**


    Andrew Pratt 详细介绍了 PIC 微控制器的编程，并全面概述了有限状态机（FSM）编程方法。书中大部分内容使用汇编语言，但请不要因此被吓到。FSM
    为程序提供了结构，使其易于规划、编写和修改。最后两章介绍了 C 语言编程，以便对这两种技术进行直接比较。


    本书面向 Microsoft Windows 和 Linux 用户。为了尽可能降低成本并简化工具链，提供了一些免费下载的应用程序，可以使用 FTDI 串口线作为编程器。书中使用了微芯片（Microchip）数据手册的相关部分，这是获取详细信息的最佳方法。使用的汇编器是开源
    gpasm。所有编程可以在编辑器中完成。书中详细介绍了如何在 Windows、Linux Debian 及其衍生版（如 Ubuntu 和 Fedora）上进行必要的安装。对于
    C 语言编程，从命令行使用 XC8 编译器。除了编程程序外，提供了两个串口读取和串口写入程序，用于从计算机与 PIC 进行通信。


    书中包含电压表项目，以及从零开始构建电路的实用说明。在此之前涵盖了所有理论知识，包括如何在汇编中进行整数算术。涵盖了两个 PIC：PIC12F1822 和
    PIC16F1823。它们都可以在内部振荡器支持下以 32 MHz 运行。你不需要购买成品开发板和编程器。只需一些廉价的元件，包括串口线、微控制器、一些电阻和
    LED，即可开始嵌入式编程。


