    \ ones in place. A glue such as rapid Araldite can be used. For the PIC itself,\
    \ I recommend using an IC holder that you place in the holes and solder the wiring\
    \ to. Plug the PIC in after all the soldering is finished. This makes it less\
    \ likely to damage the PIC. Should it become damaged electrically in the future\
    \ you can easily change it. For the other components, bend the legs at a right\
    \ angle to line up with their holes. Feed them through until the component is\
    \ almost against the copper surface. Snip off all but 5mm of the legs and bend\
    \ at right angles flat on the non-copper side, see Figure 5-3b. Ensure you have\
    \ the diodes the correct way round. The purpose of these diodes is to protect\
    \ the PIC’s input from reverse voltage, if the probe leads are accidentally used\
    \ the wrong way round and an overvoltage if the input rises above the supply voltage.\
    \ By using screws and nuts to make legs to stand the board upside down, it will\
    \ be easy to solder the wiring while keeping the components clear of the work\
    \ surface. If the IC holder drops out, it can be temporarily held in place with\
    \ a bit of tape. For the connection between component legs and the IC holder pins,\
    \ I find wire wrapping wire ideal as it’s one solid strand and is very thin.\n\
    \nFigure 5-3b Details of the Holes\n\nFigure 5-4 shows the board turned over to\
    \ the wiring side with wiring shown as straight lines. If you are using insulated\
    \ wire, you can connect it taking the most direct route. There is no electrical\
    \ advantage and sometimes it can be a disadvantage to loom cables together just\
    \ to look good.\n\nThe battery and its switch are not shown on the wiring diagram.\
    \ They are connected by wires to *T1* and *T2*. As previously mentioned, this\
    \ project uses a battery instead of the 5 V USB. The four 1.5 V cells can be used,\
    \ as the maximum voltage that the PIC can be supplied with is 6.5 V. Refer to\
    \ datasheet page 322. You must get the polarity correct. The PIC will not survive\
    \ if you don’t.\n\nThe wiring shown is for a common anode display. A common cathode\
    \ can be used but the common terminal on the display **must** be taken to 0V instead\
    \ of the supply and the modifications applied to the display macro.\n\n![](img/a08bd00952da48f769971864f33af432_96_0.png)\n\
    \n## 5.5 • The Circuit Board Test Program\n\nThis project is the most complicated\
    \ so far, but it draws from previous programs. With any project you are developing,\
    \ it pays to build in bits and test as you go. This applies to software and hardware.\
    \ Break problems down into parts and test each part. This way you can depend on\
    \ what you have done before moving on. Having built the circuit board, a program\
    \ will be used to test that it functions before moving on to experimenting with\
    \ the rest of the software.\n\nFigure 5-4 The Wiring Side of the Board\n\nLooking\
    \ at the circuit diagram, the probes used to measure voltage are connected to\
    \ the *RA2* input configured as an *AN2* analog channel through the *R11, R12*\
    \ potential divider. We will be configuring the PIC to compare input voltage against\
    \ an internal reference of 4.096 V. To achieve 4.096 V at the input pin, the voltage\
    \ across the probes will be 22.7 V: this being the full-scale reading. The maximum\
    \ voltage that can be applied without damaging the PIC is 29.4 V if the supply\
    \ voltage is 5 V. See page 322 of the datasheet. You must not apply a voltage\
    \ greater than 0.3 V above the supply voltage to any input pin, Schottky diode\
    \ D1 will be forward biased if this happens and will clamp the voltage on the\
    \ input around 0.3 V above Vss.\n\nCalculation of maximum allowable voltage across\
    \ the probes for PIC supply voltage of 5V:\nMaximum voltage = (Vss + 0.3) x 22/5\
    \ V. Where Vss is supply voltage. e.g. 5.3x22/5 = 29.4 V.\n\nThis program does\
    \ not display the value of the input voltage across the probes. This will be in\
    \ Chapter 7. It detects if the voltage is above or below 4 V. When there is 4\
    \ V across the probes, there will be 0.21 V between the analog pin and ground.\
    \ This will produce an analog-to-digital result of 180\nA/D result = (4×22/5)\
    \ * 1024/4.096 = 180\n\nIf you look at the ADC Transfer Function on page 141 of\
    \ the datasheet, the value of 1023 (0xFF) is one least significant bit (LSB) of\
    \ Vref. This is why I used 1024 in my calculation. Incidentally, one LSB is 4\
    \ mV. As we are feeding the analog input through the potential divider, 4 mV at\
    \ the input pin is 22 mV at probe leads. All this program is for to test circuit\
    \ board. When powered up the display will show 0. If 4 V or more is connected\
    \ across input connections or the start button is pressed, the display will step\
    \ through the numbers.\n\nFig 5-5 shows the state machines for this program. There\
    \ is the macro M1 to drive the seven-segment LED display and the main machine\
    \ M0 to control the sequencing and A/D measurement. As before, these two machines\
    \ are interlaced that they run one block of code in one machine then run one block\
    \ of code in other.\n\n![](img/a08bd00952da48f769971864f33af432_98_0.png)\n\n\
    ### 5.5.1 • Analog Configuration\n\nTables 5-1 to 5-3 show the configuration of\
    \ ADCON0, ADCON1, and FVRCON. We are using *RA2*, which is analog channel *AN2*,\
    \ pin 1 for the analog input. The choices for ADCON0 can be read on page 136 of\
    \ the datasheet. The choices for ADCON1 can be seen on page 137. Note the 10-bit\
    \ analog result is leftjustified in the two files *ADRESH:ADRESL* so that we will\
    \ be looking at *ADRESH* to read the 8 most significant bits. The *FVRCON* register\
    \ is used to configure the fixed voltage reference. It is enabled and set to 4.096\
    \ V (see pages 127 and 128 of the datasheet). To keep it simple only *ADRESH*,\
    \ containing the 8 most significant bits is used to determine input voltage. Above\
    \ it was calculated that the A/D reading would be 180 when 4 V was reached. This\
    \ is ‘0010110100’B as a 10-bit binary number. We are only looking at the top 8\
    \ bits that are in *ADRESH* ‘00101101’B as the result is left justified, giving\
    \ 45 decimal in *ADRESH*. The loss of two bits is not important in this program\
    \ as it is a test of the circuit board.\n\nFigure 5-5 Test Program State Diagram\n\
    \n| ADCON0 | |\n|---|---|\n| 0 | |\n| 7 | |\n| 0 | Unimplemented |\n| 6 | |\n\
    | 0 | Channel Select (CHS) AN2 |\n| 5 | |\n| 0 | |\n| 4 | |\n| 0 | |\n| 9 | |\n\
    | 3 | |\n| 1 | |\n| 2 | |\n| 0 | \n| 1 | |\n| 0 | GO/DONE, this will be set later\
    \ when a conversion is required and read back to check for completion |\n| 0 |\
    \ |\n| 1 | ADC enable |\n\n| ADCON1 | |\n|---|---|\n| 6 | |\n| 7 | |\n| 0 | ADRESH:ADRESL\
    \ Left justified. Eight most significant bits in ADRESH |\n| 6 | |\n| 1 | Set\
    \ the ADC clock period to 2 μS for 32 Mhz clock speed. See Table 16-1 in the datasheet.\
    \ |\n| 5 | |\n| 1 | |\n| 4 | |\n| 0 | |\n| 3 | |\n| 0 | Unimplemented |\n| 2 |\
    \ |\n| 0 | Unimplemented |\n| 1 | |\n| 1 | V REF + is connected to internal Fixed\
    \ Voltage Reference (FVR) module |\n| 0 | |\n| 1 | |\n\n| FVRCON | |\n|---|---|\n\
    | 8 | |\n| 7 | |\n| 1 | Enable fixed voltage reference |\n| 6 | |\n| 0 | Default\
    \ |\n| 5 | |\n| 0 | Default |\n| 4 | |\n| 0 | Default |\n| 3 | |\n| 3 | |\n| 0\
    \ | Unimplemented |\n| 2 | |\n| 0 | Unimplemented |\n| 1 | |\n| 1 | Fixed voltage\
    \ reference set to 4.096 V |\n| 0 | |\n| 1 | |\n\n"
