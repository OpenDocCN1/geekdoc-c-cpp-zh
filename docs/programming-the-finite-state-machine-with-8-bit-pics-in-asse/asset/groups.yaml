    \ ; 提供 8.1 ms 的节拍。参见 fsm_macros.inc\nMOVLB 3 ; EUSART 宏需要银行 3。\nSET_SERIAL_TX_16F1823\
    \ ; 设置 EUSART。\n\nLOOP\nCLRF TICKS\nMOVLW 244\nIF_REG_LESS_THAN_W TICKS ; 2秒的延迟\
    \ = 244*8.2 ms。\nGOTO $-3 ; 我们必须在宏中回跳两行。\nMOVLW 192\nMOVWF Xa ; 将 192 移入 Xa。\n\
    MOVLW 168\nMOVWF Xb ; 将 168 移入 Xb。\nCALL ADD_TWO_EIGHT_BIT_NUMBERS ; 调用子程序。\n\
    CALL TX_SIXTEEN_BIT_NUMBER ; 调用子程序。\nMOVLW 192\nMOVWF Xa ; 将 192 移入 Xa。\nMOVLW\
