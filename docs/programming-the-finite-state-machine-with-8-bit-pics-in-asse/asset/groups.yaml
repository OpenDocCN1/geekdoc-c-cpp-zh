    ## 8.8 A List of Things to Remember

    - Have a clear idea of what the program has to do

    - Break the program down into separate smaller problems

    - Draw a top-level state chart or start with a flow chart to get a picture of
    what you want

    - Consider using sub-states inside the main states to deal with awkward details
    that would otherwise add many more states

    - Draw the circuit diagram and identify the inputs and outputs you need

    - Start coding in small chunks and test as you go

    - Get the basic configuration correct by using small test routines to prove inputs,
    outputs, and timers, etc

    - Comment on as many lines as you can

    - Keep your comments, code, and state diagrams synchronized

    - Use debugging to troubleshoot

    - Bank selection is probably the first place to look for a problem

    - If you get completely stuck, stop working and do something else before trying
    again later


    ## Chapter 9 A Comparison with C


    ### 9.1 Introduction

    Assembly language has advantages and disadvantages. One advantage is insight into
    the hardware and what your code does. If you are a hobbyist, then using assembly
    can be fun and interesting. If you are a student, it will give you a better foundation
    for when you come to use higher-level languages, or need to get the most out of
    a chip. For PICs, the free version of the XC8 compiler will generally create larger
    code than you can do yourself in assembly. One of the purposes of this book is
    to show how the finite state machine approach could give structure to an assembly
    program, making it easier to write and just as important, easier to read. The
    last two chapters are about using C with FSMs. I assume that you have never used
    C before. This chapter will firstly be about installing the compiler and will
    detail some of the essential knowledge regarding the language. Writing software
    in a higher-level language does save time, provided the program performs correctly
    and fits into memory.


    ### 9.2 The Microchip XC8 Compiler

    The compiler used is the free version of Microchip’s XC8. The code will be written
    in a text file the hex file produced by the compiler will be written to the chip
    with the FTDI lead and the program_writer used throughout the book. For this book,
    we will be using XC8 as a stand-alone program without MPLAB where you would have
    a graphic user interface (GUI). This will be done by running it from the command
    line. Make sure you get the correct version for either Linux or Windows.


    ### 9.2.1 XC8 for Microsoft Windows

    Run the installer file and answer the terms and conditions questions. Accept the
    default location for installation, and agree to add XC8 to the path environment
    variable. It is up to you if you want to buy a license, use a free trial of the
    paid-for version, or just use the free version. For this book, the free version
    is all you need.


    ### 9.2.2 XC8 for 32 Bit Debian-Based Distributions

    This applies to Debian and its derivatives such as Ubuntu and Mint. Download the
