    \ expresses true or false. There is no need for any comparison.\n\nProgram 9-8\
    \ Serial Byte Reception\n\n## Chapter 10 • Further C\n\n## 10.1 • Introduction\n\
    \nC saves you some effort in that it takes care of some of the more monotonous\
    \ aspects of programming. For example, being in the correct bank and C if..else\
    \ statements being much easier to use than conditional skips in assembly. C is\
    \ not a big language compared with most others, but there is still a lot to it.\
    \ You can make good use of it even if you only know some of it. If you are new\
    \ to it, this final chapter will cover some of the more important aspects to add\
    \ to your repertoire.\n\n## 10.2 • Data Types\n\nC offers several different types\
    \ of data. When they reside in memory, these different data types are just bits,\
    \ either 0 or 1. What makes them into different data types is how they are interpreted\
    \ when they are used. For example, in the PIC, if we take the analog-to-digital\
    \ conversion result in the registers ADRESH and ADRESL, these two registers are\
    \ eight-bit and could be read as two separate values, each from 0 to 255. Because\
    \ they are known to contain a 10-bit value, they are taken together as one 16-bit\
    \ register. The 10 bits of interest are either left justified or right justified\
    \ - refer to Fig 16-3 on page 133 of the datasheet.\n\nWith XC8, there are integers\
    \ of different lengths: 8, 16, and 32 bit (Both signed and unsigned). Refer to\
    \ Chapter 6 concerning negative numbers in binary. Since the compiler needs to\
    \ know what it is dealing with, a variable is declared with its name and type.\
    \ When a variable is declared it can also have a value assigned to it. This is\
    \ good practice as it can be a cause of a bug if it gets used later in the code\
    \ without having a safe value. Here are some examples:\n\n```c\nchar x = 10; //\
    \ Signed 8 bit integer value -128 to 127.\nunsigned char y = 5; // Unsigned 8\
    \ bit integer value 0 to 255.\nint z; // Signed 16 bit integer value -32768 to\
    \ 32767, not assigned a value.\nunsigned int a = 0; // Unsigned 16 bit integer\
    \ value 0 to 65535.\nunsigned long int a = 0; // Unsigned 32 bit integer value\
    \ 0 to 4294967296.\nbool update = false;\n```\n\nThe char type can be assigned\
    \ a value that is expressed by writing a character in single quotes. The value\
    \ is then the ASCII value of that character for example.\n\n```c\nchar x = 'A';\
    \ // The numerical value assigned to x will be 65, the ASCII value of A.\n```\n\
    \nEach variable takes up space in memory, a char type requires one byte or register\
    \ in our PIC an int type takes two and a long int takes four. The compiler takes\
    \ care of this.\n\nThere are times when it is convenient to have several values\
    \ attached to one variable name. For this, you can use arrays. An array of, for\
    \ example, five 16-bit integers called 'zed' could be declared as follows, with\
    \ various values. By the way, zed is just a made-up name.\n\n```c\nunsigned int\
    \ zed[5] = {0, 0, 3, 8, 200};\n```\n\nTo access one of the members of this array,\
    \ you use the index number enclosed in square brackets e.g. zed[2] has the value\
    \ 3. The first index is 0, last is 4. zed[4] is 200. I have missed out floating-point\
    \ variables as we don't need them here. They can be used, but you need to consider\
    \ the overhead on low resource device. A very useful feature of C is the way a\
    \ variable can hold the memory address of another variable. This is called a pointer:\
    \ I won't go any further on this as we won't need pointers for this. If you are\
    \ going to use C for more than this book you will need to understand pointers.\n\
    \n## 10.3 • More on Functions\n\nIn assembly, we deal with subroutines and macros.\
    \ Macros substitute code wherever you insert the macro name, thus saving typing.\
    \ C also has macros, but am not going to cover these. Subroutines are different:\
    \ when you call a subroutine, the program jumps to a different place in the code\
    \ and then executes what is there, returning to where the program was. The advantage\
    \ of this is if you have something that has to be done more than one place in\
    \ the code, you only have to write code in one place. In C, there is the main()\
    \ function that is always there. Also, there can be functions that like subroutines.\
    \ You can call a function from anywhere and when it finishes, the program continues\
    \ where it was called. Functions take arguments that the function can use and\
    \ can return data that the calling part can then use. As an example of how a function\
    \ can return a value, suppose there is a calculation that needs to be carried\
    \ out several times in the program. Rather than include the calculation several\
    \ times, it can be in a function where the return value is the result of the calculation.\
    \ Here is a function. It takes one argument, an integer value and returns the\
    \ result.\n\n```c\nint cent(int f)\n{\n    int c;\n    c = (f-32)*5/9;\n    return\
    \ c;\n}\n```\n\nFor example, to use the function from within the main function,\
    \ I could assign the returned value from the function like this. Here the value\
    \ held by temp_sensor is being passed to the function to be assigned to temp_now.\n\
    \n```c\nvoid main(void)\n{\n    temp_now = cent(temp_sensor);\n}\n```\n\nFunctions\
    \ can have a function call to another function so you can have a chain of functions.\
    \ The last one in the chain returning to the one that called it, then back through\
    \ the chain of functions to main(). Functions can even call themselves: this is\
    \ called recursion but should be treated with care on low resource devices like\
    \ eight-bit PICs. Functions also provide a way of separating your code into different\
    \ solutions to problems.\n\n## 10.4 • Integer Arithmetic\n\nChapter 6 dealt with\
    \ integer arithmetic where multi-byte adding, subtracting, multiplying and division\
    \ routines were created from scratch. It was mentioned that when using C, this\
    \ would be trivial for the programmer, who only has to write simple expressions.\
    \ So here they are.\n\nIf the calculation the PIC has done needs to be transmitted\
    \ over the serial link, it will require the individual bytes that make up the\
    \ integer to be transmitted separately due to the transmission being done one\
    \ byte at a time. In the assembly programs of chapter 6, subroutines were used\
    \ to handle the transmission of multi-byte words. Here in C, the same approach\
    \ will be taken. Program 10-1 adds 65000 to six different numbers in turn and\
    \ transmits the result to the computer. The different numbers are 50000, 1, 2,\
    \ 3, 100, and 200. These numbers are declared and assigned to members of an array\
    \ of long integers. The declaration for the array is:\n\n```c\nlong x[6] = {50000,\
    \ 1, 2, 3, 100, 200};\n```\n\nThe array called x is held in memory having been\
    \ allocated space by the compiler as four 32-bit words. Each word is four bytes.\
    \ In the declaration, x[6] states that the array will have six members. The members\
    \ are assigned values by the numbers in the brackets separated by commas. After\
    \ the declaration, anywhere else in the code x[n] will mean the member n of the\
    \ array.\n\n### 10.4.1 • Transmitting a Four-Byte Integer\n\nBefore going into\
    \ the arithmetic part of the code, let's consider the function to transmit the\
    \ four-byte integer.\n"
