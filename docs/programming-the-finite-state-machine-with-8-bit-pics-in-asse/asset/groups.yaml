    图 4-3a 调用串口读取


    注意，当达到 255 时，值将回零到 0。


    如果您在命令后添加 *-o some_filename*，则读取器的输出将写入此文件。输出内容将追加到文件中，因此后续对程序的调用不会破坏之前捕获的数据。


    **Windows:**


    serial_reader.exe -o data.csv


    **Linux 64 bit:**


    sudo ./serial_reader_64 -o data.csv


    **Linux 32 bit:**


    sudo ./serial_reader_32 -o data.csv


    `serial_reader` 程序还有其他可用于更改其操作的命令行参数。这些参数将在稍后进行说明。


    然后可以使用文本编辑器或如 excel 等电子表格程序打开该文件。这在 Windows 和 Linux 上均可行。


    串口读取程序打印一列值。每个值都是从 PIC 的 *EUSART* 发出的字节值。


    当两个设备进行通信时（例如此处 PIC 与计算机之间），有一点可能会令人困惑：一个设备的输出是另一个设备的输入。因此，当 PIC 正在传输时，计算机正在接收，且运行在计算机上的程序正在读取，也就是说它是计算机的输入。


    ## 4.3 • 从计算机进行串口输入


    也可以通过串口线从计算机向 PIC 写入数据。计算机将向 PIC 传输。LED 开启 0.25 秒，关闭时间由图 4-3b 所示的从计算机写入 PIC 的串口读取输出值决定。如果值为
    0，则 LED 将常亮。如果数值为 255，则它将关闭 2.1 秒。您可能会发现这个程序很难懂，因此我几乎对每一行都加了注释。只有两种状态：LED 开启和关闭。额外的复杂性源于
    *EUSART* 从计算机读取字节。使用 C 语言编程仍然需要理解 PIC 内部正在发生什么。图 4-4 显示了状态图。


    ![](img/a08bd00952da48f769971864f33af432_72_0.png)


    ### 4.3.1 • 配置 EUSART 接收字节


    接下来的内容与上述关于字节传输的描述相似。表 4-2 显示了配置 EUSART 接收字节的步骤。设置几乎相同。差异部分已加粗显示。


    | 目的 | 代码 | 注释 |

    | :--- | :--- | :--- |

    | 启用接收 | **BSF RCSTA, CREN** | *CREN 是接收状态和控制寄存器 RCSTA 中的第 4 位（数据手册第 278 页）* 启用串口。
    |

    | | **BSF RCSTA, SPEN** | *SPEN 是接收状态和控制寄存器中的第 7 位（第 278 页）* 通过设置串口波特率发生寄存器 SPBRGL（低位字节）和
    SPBRGH（高位字节）中的值来设置 19200 的波特率，这些值组成一个 16 位字。 |

    | | MOVLW 0x19<br>MOVWF SPBRGL<br>CLRF SPBRGH | *波特率=频率/(64*(spbrgh:spbrgl+1))*
    *波特率=19200*（第 280 和 282 页） |

    | 在 PIC 16F1823 上，接收引可以是引脚 12 (RA1) 或引脚 5 (RC5)，我们需要引脚 12。 | **BSF APFCON, RXDT**
    | 设置 APFCON（备引脚配置）中的第 7 位，使接收引脚变为 RA1（第 114 页） |

    | 在 INTCON 中启用全局和外设中断位 | MOVLW 0xE0<br>MOVWF INTCON | 上一个程序也启用了第 7 和第 6 位，但是是针对定时器0。外设中断寄存器（第
    87 页）中的串口接收中断也需要第 7 和第 6 位。 |

    | | BSF PIE1, RCIE | 表 4-2 配置 EUSART 接收 |


    出于此目的，EUSART 的接收配置已定义为如下宏。同样，这些是用于 32MHz 的。


    SET_SERIAL_RX_16F1823 MACRO


    BSF PIE1, RCIE | 设置 RCIE 位


    BSF APFCON, RXDT | 设置接收引脚为 RA1（第 114 页）


    BSF RCSTA, CREN | 启用串口。


    MOVLW 0x19

    MOVWF SPBRGL | 波特率=频率/(64*(spbrgh:spbrgl+1))* *波特率=19200*（第 280 和 282 页）


    CLRF SPBRGH | 32MHz。


    MOVLW 0xE0

    MOVWF INTCON | 87。


    BSF PIE1, RCIE | 接收中断。


    ### 4.3 • 接收程序。


