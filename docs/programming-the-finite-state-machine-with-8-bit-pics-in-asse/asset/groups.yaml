    \ state and reset it in the current state. \n\nMany developments have occurred\
    \ since the Moore and Mealy machines were invented. You \n\nmight like to look\
    \ up the topic of Harel statecharts to see how things have evolved. Some \n\n\
    variations can be used to make things more flexible. One of these is the idea\
    \ of sub-states \n\nwhere a state machine is nested inside a state.\n\nFigure\
    \ 8-4 Circuit Diagram"
  - "[PAGE 140]\n\np\n\ng\n\ng\n\n● 141\n\nFigure 8-5 Use of Sub-States\n\n![](img/a08bd00952da48f769971864f33af432_140_0.png)\n\
    \nFigure 8-5 shows how two sub-states are added to the main *S7* and *S0* states.\
    \ When sub-\n\nstates are used, the main state can still set outputs and respond\
    \ to inputs, but we have \n\nthe additional functionality of being able to run\
    \ a sub-state machine within it. Transitions \n\nout of the main state can be\
    \ made to occur, depending on either conditions to do with the \n\nmain state\
    \ or one of the sub-states. In this example, exit from sub-state *SS\\_1* causes\
    \ the \n\ntransition. The main state sets the outputs for the LEDs and sub-state\
    \ *SS\\_0* is entered \n\nto reset the tick counter. Once the tick counter has\
    \ been reset, the machine stays in *S7*, \n\n*SS\\_1* waiting for the time-period\
    \ to elapse. The only other thing we need is the enable \n\nsignal from a switch.\
    \ No debounce precautions are needed and the input that the switch \n\nis connected\
    \ to only has to be looked at in states *S0* and *S4*. The complete state diagram\
    \ \n\nwill have sub-states in each main state. *S0* and *S4* will be the same\
    \ as will *S1, S2, S3, S5, *\n\n*S6,* and *S7*.\n\n**8.6.3 • Producing the Code**\n\
    \nBefore producing the code that runs the above state machine, the PIC needs a\
    \ particular \n\nconfiguration, including configuration file settings, oscillator\
    \ frequency, and port \n\nconfiguration. It is best to progress in small parts,\
    \ testing as you go. This testing will take \n\nthe form of adding debug code\
    \ to prove that each bit you add works and can be depended \n\non. Writing a complete\
    \ program and then trying to get it to work is not the way to go.\n\nThe program\
    \ needs to count in seconds up to 20. We will start by writing enough code to\
    \ \n\nachieve this and then test it. Drawing from previous programs, we can create\
    \ an interrupt \n\nbased counter, based on timer0 generating 8.2ms ticks. 122\
    \ ticks are approximately 1s. \n\nProgram 8-1 is the test program for the timer."
- md: '

    ;PROG_08_01.asm


    LIST P=16F1823


    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm_macros.inc>


    RADIX DEC ; Default numbers are to base 10.


    BOOK_CONFIGURATION ; See macro in fsm\_macros.inc.


    CBLOCK 0x70


    TICKS ; Used to count 8.2ms ticks.


    SECONDS ; Used to hold the seconds count.


    ENDC


    ORG 0X00


    GOTO START


    ORG 0X04 ; Interrupt vector.


    BCF INTCON, TMR0IF ; Clear the tmr0 overflow interrupt flag.


    DECF TICKS, F ; Decrement by one the 8.2ms ticks.


    BTFSS STATUS, Z ; Test to see if TICKS has reached zero.


    GOTO $+4 ; If TICKS has not reached zero jump to return from interrupt.


    INCF SECONDS, F ; If TICKS has reached zero increment the seconds count.


    MOVLW 122


    MOVWF TICKS ; Restore TICKS to 122 (122 x 8.2 ms 1 second).


    RETFIE ; Return from interrupt.


    START


    MOVLB 1 ; Bank 1 required for the following macros.


    SET_FREQ_32MHZ ; See file fsm\_macros.inc.


    SET_TMR0_CASE1 ; Gives 8.2 ms ticks. See fsm\_macros.inc.


    MOVLB 3 ; Bank 3 required for the following macro.


    SET_SERIAL_TX_16F1823 ; Configure the serial comms, see file fsm\_macros.inc.


    MOVLB 3 ; Leaves the previous macro in bank 2, bank 3 required for the

    ; following macro.


    S0


    BTFSS SECONDS, 0 ; Will skip the bext line if least significant bit is high.


    GOTO S0 ; Stays in state 0 while least significant bit is low.


    S1


    DEBUG SECONDS ; Transmits odd seconds


    S2


    BTFSC SECONDS, 0 ; Will skip the next line if least significant bit is low.


    GOTO S2 ; Stays in state 0 while least significant bit is high.


    S3


    DEBUG SECONDS ; Transmits even seconds


    GOTO S0


    END


    Beginning at the *START* label there are three macros:


    - to set the frequency,

    - to set up timer0 to produce the 8.2 ms interrupt ticks

    - and lastly, one to set up the serial comms that will work with the serial read
    program.


    Going back a few lines in the code at the interrupt vector is the interrupt service
    routine. There is only one interrupt in play: from timer0. The first thing is
    to reset the timer0 interrupt flag *TMROIF*. Next, the *TICKS* variable is decremented
    by one and the zero flag in the *STATUS* register is tested to see if *TICKS*
    has reached zero. If it has, the program skips one line and the *SECONDS* variable
    is incremented to count another second. TICKS is then reloaded with the value
    122 followed by the return from interrupt.


    To test the program so far, we will transmit the value of the *SECONDS* file over
    a serial lead to a computer.


    Program 8-1 TraFFICc Lights Developing the Timer


    Debug Macro


    Figure 8-6 State Machine to Detect Edges


    As we will also be doing other tests, it makes sense to have a macro that can
    be placed in programs wherever we want to monitor a value. Here is the macro.
    There is one argument: that is the register or file to be monitored. Bank 3 must
    be selected before using it.


    DEBUG MACRO REG_TO_TX ; Bank 3 required. EUSART has to be configured to transmit.


    MOVF REG_TO_TX, W


    MOVWF TXREG ; Start transmission by loading TXREG


    BTFSS TXSTA, TRMT ; Poll TXSTA bit TRMT to see if the transmit shift register
    is

    GOTO $-1 ; empty. See datasheet page 271, paragraph 26.1.1.14.


    ENDM ; Leaves in bank 3.


    To read the *SECONDS* file, we could just put the *DEBUG* macro in a loop and
    it would constantly transmit the value held in *SECONDS*. Unfortunately, this
    can result in incorrect values being read. The problem can be solved by introducing
    a 25 ms delay between transmissions but you get about 30 outputs per second...
    29 more than you need. A more elegant solution is to transmit the *SECONDS* value
    after each rising and falling edge of the least significant bit (LSB) of the *SECONDS*
    file. A simple four-state machine provides a way of detecting edges. This is shown
    in Fig 8-6. Starting in state 0, if the least LSB of *SECONDS* is high there will
    be a transition to *S1* where the value of *SECONDS* will be transmitted. After
    transmission, there will be a transition to *S2* where the machine will stay waiting
    for the LSB to go low and then transition to *S3* to transmit again before returning
    to *S0* to await the LSB going high again. *S1* transmits odd values of *SECONDS*.
    *S3* transmits even values. This is implemented as a Moore machine where the outputs
    are only dependent on the current state. A Mealy machine would only need two states
    because transmissions would be done on state transitions. The effect on code,
    in this case, is practically none as states 1 and 3 are merely labels. (img/a08bd0095da48f76997864f3af432_142_0.png)


    Figure 8-7 Testing the Second Count


    Figure 8-8 Testing Outputs


    Now that the second count is shown to be working, more of the program can be written.
    There are six outputs to be driven. We can use the code we have to prove the outputs
    work correctly by changing the temporary state machine to add two states so the
    LEDs are switched on and off in turn each edge of the *SECONDS* LSB. Also, RA5
    is configured as an input for the enable signal. In the state diagram below, the
    machine stays in state 0 unless the LSB goes high and the enable signal is high.
    (img/a08bd0095da48f76997864f3af432_143_0.png)


    ;PROG_8_02.asm


    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm_macros.inc>


    RADIX DEC ; Default numbers are to base 10.


    BOOK_CONFIGURATION ; See macro in fsm\_macros.inc.


    CBLOCK 0x70


    TICKS ; Used to count 8.2ms ticks.


    SECONDS ; Used to hold the seconds count.


    ENDC


    ORG 0X00


    GOTO START


    ORG 0X04 ; Interrupt vector.


    BCF INTCON, TMR0IF ; Clear the tmr0 overflow interrupt flag.


    DECF TICKS, F ; Decrement by one the 8.2ms ticks.


    BTFSS STATUS, Z ; Test to see if TICKS has reached zero.


    GOTO $+4 ; If TICKS has not reached zero jump to return from interrupt.


    INCF SECONDS, F ; If TICKS has reached zero increment the seconds count.


    MOVLW 122


    MOVWF TICKS ; Restore TICKS to 122 (122 x 8.2 ms 1 second).


    RETFIE ; Return from interrupt.


    START


    MOVLB 1 ; Bank 1 required for the following macros, and TRISC.


    SET_FREQ_32MHZ ; See file fsm\_macros.inc.


    SET_TMR0_CASE1 ; Gives 8.2 ms ticks. See fsm\_macros.inc.


    CLRF TRISC ; Set all PORTC as outputs.


    MOVLB 3 ; Bank 3 required for the following macro.


    SET_SERIAL_TX_16F1823 ; Configure the serial comms, see file fsm\_macros.inc.


    MOVLB 0


    S0


    MOVLW b''00100000''


    MOVWF PORTC ; Turn Red A (RC5) on others off.


    BTFSS SECONDS, 0 ; Stay in this state until LSB in SECONDS goes high. Then skip
    to

    check enable signal on RA5.


    GOTO S0


    BTFSS PORTA, 5 ; Here because LSB high, still stay in state unless RA5 high.


    GOTO S0


    S1


    MOVLW b''00010000''


    MOVWF PORTC ; Turn Yellow A (RC4) on others off.


    BTFSC SECONDS, 0 ; Stay in this state until LSB in SECONDS goes low.


    GOTO S1


    S2


    MOVLW b''00001000''


    MOVWF PORTC ; Turn Green A (RC3) on others off.


    BTFSS SECONDS, 0 ; Stay in this state until LSB in SECONDS goes high.


    GOTO S2


    S3


    MOVLW b''00000100''


    MOVWF PORTC ; Turn Red B (RC2) on others off.


    BTFSC SECONDS, 0 ; Stay in this state until LSB in SECONDS goes low.


    GOTO S3


    S4


    MOVLW b''00000010''


    MOVWF PORTC ; Turn Yellow B (RC1) on others off.


    BTFSS SECONDS, 0 ; Stay in this state until LSB in SECONDS goes high.


    GOTO S4


    S5


    MOVLW b''00000001''


    MOVWF PORTC ; Turn Green B (RC0) on others off.


    BTFSC SECONDS, 0 ; Stay in this state until LSB in SECONDS goes low.


    GOTO S5


    GOTO S0


    END


    Now that the timekeeping and inputs and outputs have been proved, the program
    can be written in its final form. Fig 8-3 provided a top-level view of what we
    want, but substates were introduced as in Fig 8-5 to deal with the resetting of
    the *SECONDS* counter. For clarity, the whole program is reproduced in Fig 8-9,
    followed by the complete program. (img/a08bd0095da48f76997864f3af432_145_0.png)


    ;PROG_8_03.asm

    ... (rest of code follows logic above) ...


    Figure 8-9 Complete TraFFICc Lights State Chart

