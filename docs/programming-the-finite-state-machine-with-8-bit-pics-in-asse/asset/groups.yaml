    前言


    本实用指南面向电子类学生和爱好者。它旨在为使用汇编语言编写有限状态机（FSM）程序提供有价值的帮助。最后两章引入了 C 语言的使用，并与汇编开发进行了直接比较。


    有限状态机是一种编写程序的方法，使其更容易制作和修改。这种机器是抽象的，因为它仅仅是程序的结构。这种抽象机器可以通过纸上画图来表示。该图独立于所使用的编程语言。FSM
    图完整地描述了程序的功能，然后可以将其实现源代码。


    本书应该对电子与软件结合感兴趣，并对事物工作原理的人产生吸引。书中将描述两个特定微控制器的代码：12F1822 和 16F1823。两者都是中端且廉价的。为了在
    PIC 之间读写程序，除了一条 FTDI TTL 电平 USB 线（TTL-232R-5V-WE）外，还需要两个从 Electronics 免费下载的可执行文件和源代码的程序。可以使用
    Microsoft Windows 或 Linux。


    PIC 程序是用汇编语言编写的。这违背了使用 C 等高级语言的传统观点。之所以这样做的原因之一是汇编是学习底层发生什么情况的好方法。这很重要，因为微控制器编程需要对芯片有深入。使用有限状态机方法的另一个原因是使汇编程序变得出奇地易读。开始嵌入式编程的主要障碍之一是安装和学习新的软件工具。


