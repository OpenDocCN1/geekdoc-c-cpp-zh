    BANKSEL LATA

    BSF LATA, 2


    ;--------------------------机器状态

    S0 ; LED 开启

    MOVLW 31

    IF_REG_LESS_THAN_W TICK_COUNTER

    GOTO S0

    BANKSEL LATA

    BCF LATA, 2

    CLRF TICK_COUNTER


    S1 ; LED 关闭

    MOVF PERIOD, W ; PERIOD 由电脑通过 EUSART 写入。

    IF_REG_LESS_THAN_W TICK_COUNTER

    GOTO S1

