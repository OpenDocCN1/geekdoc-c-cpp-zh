    \ use BCF.\nCLRF STATE_M1\nGOTO SWITCH_M0\nEND\nGOTO SWITCH_M0\n\nN_6\n\n## 2.8\
    \ The Differences Between the PIC 12F1822 and the 16F1823\n\nThe obvious difference\
    \ is that the 12F1822 has 8 pins, while the 16F1823 has 14. This is because the\
    \ 16F1823 has two I/O ports. Apart from this difference, programming is almost\
    \ the same. You must quote the correct include file at the top of your source\
    \ code and state the correct controller for your chip. Below are the relevant\
    \ lines:\n\nLIST P=12F1822\n#INCLUDE <p12f1822.inc>\n\nLIST P=16F1823\n#INCLUDE\
    \ <p16f1823.inc>\n\nThe advantage of a smaller chip is that it takes up less space\
    \ on a circuit board and there are fewer pins to solder if you don’t need the\
    \ extra port. You must consult the datasheet as there are always traps to fall\
    \ into. There will be occasions when you will stare at your code trying to understand\
    \ what is wrong, but the answer will be in the datasheet.\n\nProgram 2-3 Two Machines\
    \ Seven-Segment Display Counting Pulses\n\n## 2.9 Interrupts and State Diagrams\n\
    \nI have not tried to show interrupts in any way on the state diagrams as they\
    \ do not change the state of the machine. When an interrupt occurs, the main program\
    \ is suspended: see paragraph 2.4 above. Therefore no change in state occurs until\
    \ after the return from interrupt and then only if the interrupt has changed the\
    \ input to the state machine (such as an increase in a counter changing the result\
    \ of comparison).\n\n## Chapter 3 • Macros, Subroutines and Bank Switching\n\n\
    ### 3.1 Introduction\n\nThe circuit from Chapter 2, Fig 2-9, can be used for all\
    \ of the examples in this chapter. This circuit drives the 7-segment LED display\
    \ and the single LED using the 16F1823 PIC. You might by now be thinking that\
    \ assembly language is just too inconvenient. It does take longer to write and\
    \ can be difficult to read. Take for example Fig 2-4 of the last chapter where\
    \ a comparison of two values was made to decide between two courses of action\
    \ in the program. If you are used to a higher level language like C, it could\
    \ be something like this:\n\n```c\nif (tick_counter < 31)\n{\n    goto S0\n}\n\
    else\n{\n    goto S1\n}\n```\n\nEven if you have never seen this programming language\
    \ before, you would understand it. In contrast, this is what we have.\n\n```asm\n\
    ;----------Machine States\nS0 ; LED on.\nMOVLW 31\nSUBWF TICK_COUNTER, W ; C in\
    \ STATUS is set when counter_on >= 31.\nBTFSS STATUS, C ; Skip next instruction\
    \ if C in STATUS is found set.\nGOTO S0 ; C in status found not set.\nCLRF TICK_COUNTER\
    \ ; Reset the counter.\nBCF PORTA, 2 ; Turn the LED off.\n\nS1 ; LED off.\nMOVLW\
    \ 91\n```\n\nThe MOVLW 31 line is easy to follow. It is just moving the literal\
    \ value decimal 31 into the working register. The next line, SUBWF TICK_COUNTER_ON,\
    \ W, means subtract the value in the *W* register from the register *TICK_COUNTER_ON*\
    \ and put the result in the *W* register. The next line makes reading this difficult.\
    \ You have to know what effect the sign of the result has on the carry flag *C*\
    \ in the *STATUS* register and then work out if a skip is going to happen. Page\
    \ 320 of the datasheet explains how *SUBWF* (subtract w from f) works. This describes\
    \ what the code means:\n\n*C = 1* 31 ≤ TICK_ON\n*C = 0* 31 > TICK_ON\n\nIf C is\
    \ 0, the program executes the GOTO S0 because TICK_ON has not reached 31. If C\
    \ is 1 it skips this line and moves on to the code that follows. What we need\
    \ is an instruction that looks more like the if...else statement that can be read\
    \ easily. While we’re on the subject, if you were wondering about goto, it is\
    \ part of the C language but isn’t recommended.\n\n### 3.2 Create Your Own Instruction\n\
    \nThe macro allows you to define your instruction that can be reused. For the\
    \ problem above, the code snippet can be written as follows. Both states are shown\
    \ here:\n\n```asm\nS0 ; LED on.\nMOVLW 31\nIF_REG_LESS_THAN_W TICK_COUNTER ; See\
    \ macro in fsm_macros.inc.\nGOTO S0\nCLRF TICK_COUNTER ; Reset the counter.\n\
    BCF PORTA, 2 ; Turn the LED off.\n\nS1 ; LED off.\nMOVLW 91\nIF_REG_LESS_THAN_W\
    \ TICK_COUNTER ; See macro in fsm_macros.inc.\nGOTO S1\nCLRF TICK_COUNTER ; Reset\
    \ the counter.\nBSF PORTA, 2 ; Turn the LED on.\nGOTO S0\nEND\n```\n\nWe have\
    \ introduced a new instruction IF_REG_LESS_THAN_W meaning if a register value\
    \ is less than the value in W, execute the next line, else skip and execute the\
    \ line after. The register is presented as the argument TICK_COUNTER. Define the\
    \ macro before the place in the code where it is first used. The definition is\
    \ started by typing its name at the start of the line and following it with the\
    \ word MACRO, then names for the arguments. There will be one argument. In this\
    \ case, the register to be compared to the value in W. Subsequently add the code\
    \ you want the macro to perform. End the macro definition with ENDM.\n\nTable\
    \ 3-1 Carry Flag Behaviour for SUBWF\n\n| Operation | Condition | Carry Flag (C)\
    \ |\n| :--- | :--- | :--- |\n| SUBWF F, W | W > F | C = 0 |\n| SUBWF F, W | W\
    \ ≤ F | C = 1 |\n\n```asm\nIF_REG_LESS_THAN_W MACRO ARG1\nSUBWF ARG1, W\nBTFSS\
    \ STATUS, C ; See SUBWF on page 320, if W > ARG1, C = 0\nENDM\n\nThe ‘if’ code\
    \ here - this will be a GOTO to jump over else code. The ‘else’ code here. The\
    \ argument names used in the definition should be different from any register\
    \ names used in your program. Here I used ARG1 in the definition. When the macro\
    \ name is inserted into the program, the argument name used is TICK_COUNTER.\n\
    \nThe thing to grasp here is that this is not a new opcode or instruction created\
    \ for the processor. What happens is the macro definition gets placed in our code\
    \ wherever we type its name. ARG1 is substituted by the argument used in the program.\n\
    \n### 3.2.1 Use an Include File\n\nMacros don’t have to be in the source code\
    \ file with the rest of your program. You can put them in a separate file and\
    \ use the include directive at the top of the source code. This will give you\
    \ access to any macros in that file. Program 3-1 shows the macro inserted in two\
    \ places and the definition placed in a file called *fsm_macros.inc*. At the top\
    \ of code is the line #INCLUDE <fsm_macros.inc>. The file can be in the same directory\
    \ as your source file. You will have to copy it from the *chap03_source_xxx* directory\
    \ to the working directory.\n\n```asm\n; prog_03_01.asm\n; This is Prog_02_01.asm\
    \ using macros. \nLIST P=12f1822\n#INCLUDE <p12f1822.inc>\n#INCLUDE <fsm_macros.inc>\n\
    \nRADIX DEC ; Default numbers to 10.\n__CONFIG 0X8007, (_FOSC_INTOSC & _WDTE_OFF\
    \ & _PWRTE_OFF & _CP_OFF & _BOREN_OFF & _IESO_OFF & _FMN_OFF)\n__CONFIG 0X8008,\
    \ (_LVP_ON)\n\nCBLOCK 0x70\nTICK_COUNTER\nENDC\n\nORG 0X00\nGOTO START\n\nORG\
    \ 0X04 ; Interrupt vector.\nBCF INTCON, TMR0IF ; Clear the tmr0 overflow interrupt\
    \ flag.\nINCF TICK_COUNTER, F ; Increment by one TICK_COUNTER.\nRETFIE ; Return\
    \ from interrupt.\n\nSTART:\nMOVLB 1 ; TRISA, OSCCON, OPTION_REG.\nBCF TRISA,\
    \ 2 ; Make RA2 an output.\nMOVLW 0x70\nMOVWF OSCCON ; Page 65 32MHz.\nMOVLW 0xD7\n\
    MOVWF OPTION_REG ; Page 164.\nMOVLB 0 ; Back to bank 0 for the rest of the program.\n\
    ```\n\n```asm\n;------Machine states.\nS0 ; LED on.\nMOVLW 31\nIF_REG_LESS_THAN_W\
    \ TICK_COUNTER ; See macro in fsm_macros.inc.\nGOTO S0\nCLRF TICK_COUNTER ; Reset\
    \ the counter.\nBCF PORTA, 2 ; Turn the LED off.\n\nS1 ; LED off.\nMOVLW 91\n\
    IF_REG_LESS_THAN_W TICK_COUNTER ; See macro in fsm_macros.inc.\nGOTO S1\nCLRF\
    \ TICK_COUNTER ; Reset the counter.\nBSF PORTA, 2 ; Turn the LED on.\nGOTO S0\n\
    END\n```\n"
