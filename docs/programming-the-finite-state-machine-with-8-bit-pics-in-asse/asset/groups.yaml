    \n## 9.3.6 • __delay() 函数\n\nXC8 中提供了可用的延迟函数，通过指定时钟频率，你可以调用具有所需毫秒或微秒延迟的函数。这些函数通过循环时钟周期来提供延迟。这将阻塞程序执行任何其他操作。如果你需要一个微小的、不会产生碍事的延迟——这些函数非常方便使用。程序\
    \ 9-3 使用 __delay()* 函数让 LED 闪烁 0.25s 并关闭 0.5s。这种方法非常简单，但在延迟进行期间，任何其他事情都不会发生。每秒只执行两个有用的指令。除了极短的延迟外，这不是一个好方法。\n\
