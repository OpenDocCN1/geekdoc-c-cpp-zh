    \ 使用位运算符开启和关闭位\n\n更改单个位位的另一种方法是使用位逻辑和位掩码。假设我们有一个八位变量 *var*，并想要开启位 2，而保持其他位不变。这样做的方法是将该字节与掩码进行位或（OR）操作，掩码除了要开启的位外，所有位都关闭状态。假设标志字节\
    \ *var* 的状态为 B'01100001'，下表显示了与掩码 B'00000100' 进行位或操作的结果。在代码中，这以十六进制形式写为 0x04。\n\
    \nvar = var | 0x04; // | 是 C 语言中的位或运算符。\n\n| | 位 7 | 位 6 | 位 5 | 位 4 | 位 3 | 位\
    \ 2 | 位 1 | 位 0 |\n| :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---:\
    \ | :---: |\n| **var** | 0 | 1 | 1 | 0 | 0 | 0 | 0 | 1 |\n| **mask** | 0 | 0 |\
    \ 0 | 0 | 0 | 1 | 0 | 0 |\n| **result** | 0 | 1 | 1 | 0 | 0 | 1 | 0 | 1 |\n\n\
    赋值操作将位或的结果赋给 var。要将其关闭则没那么直观了。我们仍然需要一个掩码和一个位运算符来改变我们想要改变的位，同时保持其他位不变。这可以通过位与（AND）来实现，其中掩码在位不会改变的位置设为\
    \ 1，在要关闭的位的位置设为 0。为了产生所需的掩码，取一个将你想要改变的位置的位设为 1 的字节，即在本例中为 B'00000100'，然后反转这些位以得到\
    \ B'11111011'。有一个运算符 ~ 可以执行此操作。关闭位 2 的代码是：var = var & ~0x04;。\n\n### 10.5.3 使用位域开启和关闭位\n\
    \n标准 C 语言还具有位域（bitfield），它允许你访问字中的单个位。要理解这一点，你需要了解结构体，它是一个包含命名成员的对象。如下所示：\n\n\
    ```c\nstruct {\n    unsigned int vol_available : 1;\n    unsigned int read_required\
    \ : 1;\n} flags;\n```\n\n位域允许你定义具有特定位宽的成员。例如：\n\n```c\nstruct {\n    unsigned\
    \ int F10V : 4;\n    unsigned int F1V : 3;\n    unsigned int F100mV : 2;\n   \
    \ unsigned int F10mV : 1;\n} voltage;\n```\n\n这种方法可以有效地节省内存，特别是在内存受限的微控制器应用中。\n"
