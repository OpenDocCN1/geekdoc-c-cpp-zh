    \ 2\n\n MOVLW 0x83 ; Configure the fixed voltage reference, enable and set to\
    \ 4.096 V.\n\n MOVWF FVRCON ; See Chapter 5 Table 5-3, and page 128 in the data\
    \ sheet.\n\n MOVLB 3\n\n CLRF TICKS ; Initialize count to zero.\n\n CLRF STATE\\\
