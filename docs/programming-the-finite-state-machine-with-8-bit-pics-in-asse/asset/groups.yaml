    GOTO SWITCH_M0 ; Electrical contacts open, stay in state 0.

    CLRF TICKS ; Electrical contacts closed, change to state 1 reset TICKS.

    INCF STATE_M1, F

    GOTO SWITCH_M0


    M1_S1

    BTFSS PORTA, 2 ; If electrical contacts are open, bit will be high.

    GOTO $+3

    CLRF STATE_M1 ; Skipped to her because the switch bounced open.

    GOTO SWITCH_M0

    MOVLW 4

    IF_REG_LESS_THAN_W TICKS

    GOTO SWITCH_M0 ; Time has not elapsed.

    INCF STATE_M1, F ; Time has elapsed change to state 2.

    BCF CONTACT_SIGNAL, 0 ; Indicating the contacts are closed.

    GOTO SWITCH_M0


    M1_S2 ; Awaiting opening.

    BANKSEL PORTA

    BTFSC PORTA, 2 ; If electrical contacts are closed, bit will be low.

    GOTO $+2

    GOTO SWITCH_M0 ; Electrical contacts closed, stay in state 2

    CLRF TICKS ; Electrical contacts open, change to state 3 reset TICKS.

    MOVLW 3

    MOVWF STATE_M1

    GOTO SWITCH_M0


    M1_S3

    BTFSC PORTA, 2 ; If electrical contacts are closed, bit will be low.

    GOTO $+3

    GOTO SWITCH_M0 ; Skipped to her because the switch bounced closed.

    MOVLW 4

    IF_REG_LESS_THAN_W TICKS

    GOTO SWITCH_M0

    CLRF STATE_M1

    BSF CONTACT_SIGNAL, 0

    GOTO SWITCH_M0

    END


