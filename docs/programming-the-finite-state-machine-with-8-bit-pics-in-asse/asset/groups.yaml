    \nEND\n\nFigure 6-3 An Example of Adding Two-Bit Numbers\n"
  mdcn: "\n\n```asm\n;PROG_06_01.asm\nLIST P=16F1823\n#INCLUDE <p16f1823.inc>\n#INCLUDE\
    \ <fsm_macros.inc>\n\nRADIX DEC ; 默认数字为110进制。\nBOOK_CONFIGURATION ; 参见 fsm_macros.inc\
