    \ distinct arrangements, common cathode, and common anode. With common \n\ncathodes,\
    \ the cathodes must be connected to 0V. With common anode, anodes must be \n\n\
    connected to +5V. The segment connections are then connected to the output pins\
    \ of the \n\nPIC. The logic of the output code has to be designed to suit the\
    \ polarity of the display. It \n\nwould be easier if you use a display with this\
    \ pinout arrangement, but if not you will have \n\nto work out your own wiring.\
    \ The LA-601VB common anode display that can be supplied by \n\nRS Components\
    \ is similar to the one I used. Farnell has a similar one (part number SA52-\n\
    \n11SRWA).\n\n![](img/a08bd00952da48f769971864f33af432_45_0.png)\n\nAs there are\
    \ a total of 8 LEDs to drive, the 16F1823 PIC is used. This has an extra IO port,\
    \ \n\nPORTC. Let’s start with Figure 2-9 - the circuit diagram for connections\
    \ to the PIC.\n\nFigure 2-8 Connections for Typical 7-Segment LED Displays"
  - "[PAGE 46]\n\np\n\ny\n\ng\n\n● 47\n\n![](img/a08bd00952da48f769971864f33af432_46_0.png)\n\
    \nThe next part of the design process is to draw the finite state machine diagram\
    \ (see Figure \n\n2-10). Machine *M1* is the display driver. On power-on, the\
    \ LED is initialised to on, and then \n\nmachine *M0* starts in state 0. After\
    \ 0.25s, the timer expires and machine 0 transitions to \n\nstate 1. The timer\
    \ is reset, the LED turned off, the pulse counter is incremented by 1 and a \n\
    \nsignal called *UPDATE* is set to high. This *UPDATE* signal is used by machine\
    \ 1. While in state \n\n1, when the timer expires at 0.75s, the machine transitions\
    \ to state 0 and the timer resets \n\nand its LED turned on. This continues indefinitely.\
    \ When in state 1, if the pulse counter has \n\nreached 10, there is a transition\
    \ to the same state. This is to reset the pulse counter to \n\nzero. Meanwhile,\
    \ machine *M1* is running independently but time sharing the CPU. Machine \n\n\
    *M1* starts in state 0 and the display will be blank. When the *UPDATE* signal\
    \ goes high, the \n\nmachine transitions to state 2 and resets the *UPDATE* signal\
    \ to low. Depending on the value \n\nof the variable *N*, the machine transitions\
    \ back to state 1, driving on and off the necessary \n\nsegments of the display.\
    \ The machine will remain in state 0 waiting for another update \n\nsignal. The\
    \ output details shown for machine *M1* are for a common anode display. The \n\
    \ncomments in the code show the alternatives for a common cathode display.\n\n\
    Figure 2-9 Connections for the PIC 16F1823 and 7-Segment LED Display"
  - "[PAGE 47]\n\ng\n\ng\n\ny\n\n● 48\n\n![](img/a08bd00952da48f769971864f33af432_47_0.png)\n\
    \n \n\nNearly everything in program *prog\\_02\\_03.asm* has been already explained,\
    \ except for \n\none thing you have to watch out for: The READ MODIFY WRITE problem\
    \ that can happen \n\nwhen using the *BSF* and *BCF* instructions. Up to now,\
    \ we have only been setting one output \n\npin by setting the bit value on *PORTA*.\
    \ This works if you are only working with one output \n\npin on a port but something\
    \ strange happens when trying to alter an output shortly after \n\naltering a\
    \ different pin. To understand the problem, we have to look at basic electrical\
    \ \n\ntheory regarding charging and discharging capacitors, along with how the\
    \ PIC handles \n\nchanging the value of one pin at a time. When the PIC writes\
    \ to outputs it can only write \n\nto a complete byte or eight bits, so to change\
    \ one bit it has to read the state of the pins, \n\nmodify the one it wants to\
    \ alter, and then write back to the outputs. The problem is that say \n\n*PORTA*\
    \ bit 5 (physical pin 2) has been changed from 0 to 1, and then in the next instruction,\
    \ \n\nyou want to change the value on *PORTA* bit 4 (physical pin 3). The PIC\
    \ reads the values on \n\nthe *PORTA* pins - you might expect the value on bit\
    \ 5 to be high as you have just set it, but \n\nNO because in the real world the\
    \ electrical circuit could be capacitive and it will take time \n\nfor the voltage\
    \ to rise, resulting in the value of bit 5 reading as low. When the outputs are\
    \ \n\nwritten back to port, bit 5 (pin 2) gets set back to low. This is an example\
    \ of where testing \n\nin a simulator can let you down. Generally, when using\
    \ *BCF* and *BSF* you should write to \n\nthe latch registers for the ports (*LATA*\
    \ and *LATC*). If however, you are writing to the whole \n\nport as a register,\
    \ for example, using *MOVWF PORTA*, then this is safe.\n\nFigure 2-10 State Diagram\
    \ for Program 2-3"
