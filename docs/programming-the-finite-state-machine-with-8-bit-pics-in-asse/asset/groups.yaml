  - "[PAGE 152]\n\np\n\np\n\n● 153\n\n![](img/a08bd00952da48f769971864f33af432_152_0.png)\n\
    \n**9.3 • Introduction to C**\n\nIt is assumed that you have not used C before.\
    \ These days, C might not be considered to \n\nbe a high-level language but is\
    \ more human-friendly than assembly language. It is not \n\nlike Python for example,\
    \ where you don’t need to know anything about the machine you \n\nare running.\
    \ With C you are never far from your hardware and you have direct access to \n\
    \nmemory locations, making it particularly important for microcontrollers. You\
    \ can practice C \n\nprogramming on your computer using the GCC compiler on Linux\
    \ or MinGW for Windows. \n\nThere is lots of help contained in books and online\
    \ if you want to try. For our two PICs, \n\nall examples will be for XC8. This\
    \ is not a course on C programming. What I will do is \n\nreproduce some of the\
    \ programs already made in previous chapters but in C. There will \n\nbe some\
    \ explanation on what is going on, as well as some additional C specific points.\
    \ \n\nThe two chapters in this book can't possibly cover all of C and the full\
    \ details of the XC8 \n\ncompiler. For more detailed information on the compiler,\
    \ there is the Microchip user guide, \n\nDS50002053G, available for download.\
    \ \n\nTo begin, let's look at the ‘Hello World’ program from Chapter 1. This is\
    \ the simple LED \n\nblinking program. \n\nFigure 9-3 Installing the 32-bit Library\
    \ for Fedora"
  - "[PAGE 153]\n\ng\n\ng\n\ny\n\n● 154\n\n**9.3.1 • Hello World in C**\n\nIf you\
    \ look at Program 1-1 from Chapter 1, this was a very simple LED flashing program\
    \ \n\nusing two loops as time delays. The delay in each loop was achieved by decrementing\
    \ \n\nan 8-bit file until it reached zero, then moving to the next loop to the\
    \ same then back to \n\nthe beginning over and over. Entering one loop switched\
    \ the LED off and the other loop \n\nswitched it on. The frequency of the oscillator\
    \ was set to 31.25 kHz. Program 9-1 shown \n\nbelow does the same thing but in\
    \ C. I will use these two programs to explain some of the \n\nkey points of a\
    \ C program.\n\n//prog\\_09\\_01\n\n#include <xc.h> // Must be included for all\
    \ programs.\n\n// PIC12F1822 Configuration Bit Settings\n\n// CONFIG1\n\n#pragma\
    \ config FOSC = INTOSC\n\n#pragma config WDTE = OFF\n\n#pragma config PWRTE =\
    \ OFF\n\n#pragma config CP = OFF\n\n#pragma config BOREN = OFF\n\n#pragma config\
    \ IESO = OFF\n\n#pragma config MCLRE = OFF\n\n#pragma config FCMEN = OFF\n\n//\
    \ CONFIG2\n\n#pragma config LVP = ON\n\nvoid main(void) @ 0x20 // The @ 0x20 makes\
    \ the compiler start main() at this address\n\n{ // to save loading time with\
    \ 'program\\_writer'.\n\n unsigned char counter; // Declare the variable 'counter'.\n\
    \n TRISAbits.TRISA2 = 0; // Set RA2 as an output.\n\n OSCCON = 0x10; // Set the\
    \ oscillator frequency to 31.25 kHz\n\n counter = 0;\n\n while (1) // (1) is always\
    \ true.\n\n { // Start of the while loop.\n\n do //LOOP\\_OFF\n\n {\n\n counter--;\n\
    \n } while (counter > 0);\n\n PORTAbits.RA2 = 1;\n\n do //LOOP\\_ON\n\n {\n\n\
    \ counter--;\n\n } while (counter > 0) ;\n\n PORTAbits.RA2 = 0;\n\n } // End of\
    \ the while loop\n\n}\n\nVariables are data that have a type, for example, an\
    \ integer and each variable will occupy \n\na memory location. When programming\
    \ in assembly, variables were placed directly in files \n\nof our choosing using\
    \ the *CBLOCK* directive.\n\n \n\nCBLOCK 0x70 \n\n \n\nCOUNTER\n\n \n\nENDC \n\
    \nIn C this is achieved by declaring a variable e.g. counter of data type ‘unsigned\
    \ char’ in \n\nthe line:\n\nProgram 9-1 Hello World in C"
  - "[PAGE 154]\n\np\n\np\n\n● 155\n\n \n\nunsigned char counter; \n\nAn unsigned\
    \ char in C is an integer value from 0 to 255 and occupies one 8-bit file in the\
    \ \n\nPIC’s memory. This line of code is a variable declaration. Every variable\
    \ must be declared \n\nbefore it is used so that the compiler knows its type and\
    \ can allocate space in memory for \n\nit. You will notice that C programs have\
    \ semi-colons here and there throughout the code. \n\nAlthough they seem to appear\
    \ at the end of lines, they don’t mark the end of a line: they \n\nmark the end\
    \ of a statement. \n\nFunctions are another key thing to understand. To begin\
    \ with, every program has to have \n\na main function. If you have done any coding\
    \ with an Arduino, you might now be confused \n\nbecause the Arduino sketches\
    \ don’t seem to have a main function. They do, but it’s hidden \n\nfrom view when\
    \ you use their integrated development environment (IDE). The main \n\nfunction\
    \ of a C or C++ program is the entry or start point of execution. Functions can\
    \ have \n\narguments that are used to pass data to the function. In our case,\
    \ there is no data to pass \n\nto main so the brackets after main contain the\
    \ word void. In front of main is also the void \n\nword. This means the function\
    \ does not return any data when it finishes. There will be other \n\nfunctions\
    \ used later that take arguments or return data. Generally, when programming \n\
    \nfor a computer where there is an operating system that runs the program, you\
    \ can pass \n\ncommand-line arguments to main and the program returns a value\
    \ to the operating system \n\nto indicate success or not. With our PICs, however,\
    \ there is no operating system.\n\nAs advised before, comments are useful in code.\
    \ In C there are two ways to annotate a \n\ncomment. \n\n• \n\nThe first is to\
    \ put in front of the comment two // forward slashes. This means that the \n\n\
    rest of this line is a comment. \n\n• \n\nThe other way is to start the comment\
    \ with /\\* and end it with \\*/ .This allows the \n\ncomment to continue over\
    \ more than one line.\n\nStarting with the first line of Program 9-1, there is\
    \ a comment stating the name of the \n\nprogram. The next line starts with #.\
    \ This symbol is used to mark a preprocessor directive, \n\nin this case, to include\
    \ the file *xc.h* that is located in the include directory of your XC8 \n\ninstallation.\
    \ The outward-facing < > around *xc8.h* means that the file is in the include\
    \ \n\ndirectory. If you want to include a file in the local directory, you would\
    \ surround the file \n\nname with \" \". If you care to look at this file, it\
    \ will start you on a trail through lots of other \n\nfiles by way of their *#include*\
    \ directives. This is how the compiler gets chip-specific variables \n\nand definitions.\
    \ Next, there are several lines of *#pragma* directives. These are compiler \n\
    \ndirectives that are used to configure the bits in configuration words. The abbreviations\
    \ can \n\nbe obtained from the datasheet pages 46 to 48.\n\nNow we come to the\
    \ start of the main function. The first line is the declaration of the \n\nvariable\
    \ ‘counter’ as was described above. The next line sets bit 2 of *TRISA* to 0 make\
    \ *RA2 *\n\nan output.\n\n \n\nTRISA2 = 0; // Set RA2 as an output."
- md: "\nThe names of the bits and complete registers can be taken from the datasheet.\
    \ The *TRISA2* bit used here is on page 117 of the datasheet. These definitions\
    \ can be found in the include file *pic12f1822.h* which is included by *xc.h.*\
    \ We will come on to how XC8 knows you are using a 12F1822 when we compile the\
    \ code. If you want to look at this file yourself, it can be opened using a text\
    \ editor. It can be found in */opt/microchip/xc8/v2.10/pic/include/* if you are\
    \ using Linux or *C:\\Program Files (x86)\\Microchip\\xc8\\v2.10\\pic\\include*\
    \ if you are using Windows. Note: The version might be different.\n\nThe next\
    \ line sets the oscillator frequency to 31.25kHz. There is still a requirement\
    \ for the programmer to know hardware details. Refer to the chip’s datasheet (page\
    \ 65 to set *OSCCON*).\n\nFinally, we come to the logic part of the program. Up\
    \ to now, not much has changed from the assembly version, but this is where using\
    \ C starts to pay off. The rest of the program is almost plain language. There\
    \ is one outer loop that starts with *while (1)*. A while loop in C executes for\
    \ as long as the expression following it inside the () brackets evaluates to logical\
    \ true. The value 1 is taken as being true and 0 as false, so this loop will execute\
    \ forever. The loop encloses some code and is marked by the first left { bracket\
    \ and ends with the right bracket }. It is good practice to indent lines of code\
    \ so you can easily see when things like loops are nested inside others. The end\
    \ of the while loop can be seen easily because the two left and right brackets\
    \ are vertically in-line. As far as the compiler is concerned, it does not matter.\
    \ It is not interested in white space. You can put the whole function on one line\
    \ but this isn't recommended.\n\nWithin the *while* loop, there are two do loops.\
    \ These have the same purpose as delay loops in the assembly version. The difference\
    \ between a *while* and a *do* loop are:\n\n- A *while* loop checks the logic\
    \ expression at the start. If it is not true, it skips it and so it might not\
    \ get executed at all.\n- A *do* loop checks the logic expression at the end of\
    \ the loop and so it gets executed at least once. Regardless of the value of counter,\
    \ it gets decremented by 1. This is what counter-- does and then the value is\
    \ checked at the end of the loop. If it is greater than 0, the loop goes around\
    \ again until counter is zero. The program then leaves the loop and the output\
    \ is set low. Then the next loop is run: when it ends the output is set high,\
    \ the outer while loop then repeats forever.\n\nThe reason for *@0x20* after the\
    \ *main(void)* is to make the compiler start the code at this memory address.\
    \ This speeds up the writing to the chip with the *program_writer* program.\n\n\
    ## 9.3.2 • Using the XC8 Compiler in Microsoft Windows\n\nThe XC8 compiler is\
    \ used from the command line but is very quick and easy to use. Using scripts\
    \ written in batch files, and the up and down arrows to recall previous commands,\
    \ it can be quicker than a GUI and mouse clicking. The first thing to do is to\
    \ open a terminal window. If you use Windows Explorer to navigate to the *working_windows*\
    \ directory and click on *terminal_here.bat*, it will open a terminal window in\
    \ the working directory. To compile a C source file to produce the hex file, two\
    \ batch files will call the XC8 compiler: one for 12F1822 chips and one for 16F1823\
    \ chips. These batch files save you the trouble of adding the *--chip=12F1822*\
    \ or *--chip=16F1823* to the command line whenever you run the compiler.\n\n![](img/a08bd00952da48f769971864f33af432_156_0.png)\n\
    \nAs well as the hex file, the compiler produces a lot of other files. These can\
    \ easily be deleted by running *clean.bat*, either from the command line or from\
    \ Windows Explorer by clicking on it.\n\n## 9.3.3 • Using the XC8 Compiler in\
    \ Linux\n\nUsing the XC8 compiler on Linux is the same as on windows. In the working\
    \ directory, there are two scripts, one for each type of PIC. You might have to\
    \ edit these scripts using a text editor if Microchip updates the version of XC8.\
    \ To run them put ./ in front with the name of the source code file after as shown\
    \ in Figure 9-5. There is also a cleanup script to delete all other files generated\
    \ by XC8 apart from the hex file.\n\n![](img/a08bd00952da48f769971864f33af432_156_1.png)\n\
    \n## 9.3.4 • Emitted Code\n\nWhen using assembly language, you use mnemonics such\
    \ as *DECF*. Following a mnemonic, there will be one or more arguments: DECFSZ,\
    \ F, etc. To see details, look at datasheet page 30. With assembly, what you write\
    \ is translated into machine code. With C, it is processed by the compiler. The\
    \ program follows the same form as the assembly version.\n\n- DECFSZ, COUNTER;\
    \ One instruction \n\n- GOTO LOOP; Two instructions \n\n- BSF PORTA, LED; Three\
    \ instructions \n\nThe end of the while loop can be seen easily because the two\
    \ left and right brackets are vertically in-line. As far as the compiler is concerned,\
    \ it does not matter. It is not interested in white space. You can put the whole\
    \ function on one line but this isn't recommended.\n\n- 9-4 Oscilloscope Trace\
    \ for Windows\n- 9-5 Oscilloscope Trace for Linux\n- 9-6 Oscilloscope Trace for\
    \ Assembly\n- 9-7 Oscilloscope Trace for C\n"
