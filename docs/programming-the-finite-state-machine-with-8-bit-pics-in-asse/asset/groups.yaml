- md: "\nThe *MOVLB* instruction can be used to move the bank number into *BSR*. Alternatively,\
    \ the gpasm *BANKSEL* directive can be used to generate the required code for\
    \ example.\n\nBANKSEL TRISA \n\nThis will save you from looking up the bank number\
    \ for *TRISA*. Although this can be convenient, there are times when you need\
    \ to know the required bank number. For example, if you need to access several\
    \ special registers whilst configuring say the oscillator, the interrupts, and\
    \ the inputs and outputs, you can save on bank switching if you write your code\
    \ so the special registers are grouped by bank.\n\nAs programs become more complicated,\
    \ the problem of bank switching becomes more difficult. Because of GOTOs and returning\
    \ from subroutines, you can easily be in the wrong bank for the subsequent instruction.\
    \ It is one of the first places to look if the code does not run. Interrupts have\
    \ automatic context saving. Therefore, the value in *BSR* is restored on return\
    \ so you only need to change the bank within the interrupt. Refer to page 85 on\
    \ the datasheet. If you are programming in C, the compiler will handle bank switching\
    \ for you.\n\nMy suggestion is to inspect your code by looking at small blocks\
    \ such as the code for each machine state, subroutine or macro. By just looking\
    \ at that block of code you can tell that it is in the correct bank for the instructions\
    \ in it. You might well end up with redundant bank switching but you can always\
    \ optimize it once you have it running. Be extra careful with macros where code\
    \ might be out of sight in a different file.\n\nFor macros, the policy I adopt\
    \ is to only put bank switching inside a macro if there is a requirement to switch\
    \ banks partway through the macro. This means you have to check to see if you\
    \ are in the correct bank before entering the macro. It might seem inconvenient\
    \ but if you have bank switching within the macro at the start, it could be redundant\
    \ and wasteful of program memory.\n\n## Chapter 4 • Inputs and Outputs\n\n###\
    \ 4.1 • Introduction\n\nThe first three chapters only used PIC outputs to drive\
    \ LEDs. This was to simply get up and running with the toolchain and the concept\
    \ of FSM. This chapter will elaborate on inputs and outputs and deal with digital/analog\
    \ inputs, pulse width modulated outputs and serial communication with a computer.\
    \ PICs can also communicate with other devices using the I2C bus and accept inputs\
    \ by finger touching using capacitive sensing. The book will not go into these\
    \ however from what has been covered and with the information from the datasheet,\
    \ you should be able to make use of these in your projects. From a state machine\
    \ point of view, the programs in this chapter are trivial This chapter is about\
    \ using the I/O.\n\n### 4.2 • Serial Output to a Computer\n\nThese PICs have an\
    \ ‘Enhanced Universal Synchronous Asynchronous Receiver Transmitter’ (EUSART)\
    \ that we can use with an *FTDI* serial lead to communicate directly between the\
    \ PIC and computer. Contained within the archive file download for both Windows\
    \ and Linux, is a program called *serial\\_reader* that prints to screen values\
    \ transmitted by the PIC. To produce data to transmit, program 3-1 will flash\
    \ an LED and increment a counter. The counter value will be transmitted over the\
    \ serial link to the computer where it will be displayed on the screen.\n\n![](img/a08bd00952da48f769971864f33af432_66_0.png)\n\
    \n#### 4.2.1 • TTL Level Serial Communications\n\nAn RS232 serial link in general\
    \ uses a negative voltage of between -3V and -25V to represent a logical 1 and\
    \ a positive voltage between +3V and +25V to represent a logical 0. The PICs and\
    \ FTDI lead use voltages of 0V for a logical 0 and +5V (approx) to represent a\
    \ logical 1. This is very convenient as we only need one power supply voltage\
    \ and no level shifting circuitry. The serial link transfers bytes of data at\
    \ a rate referred to as ‘Baud’. The Baud rate can be regarded in this case as\
    \ bits per second. We will use a rate of 19200 Baud. The bytes that are sent along\
    \ the wire are made up of a leading start bit, 7 or 8 data bits, a parity bit\
    \ and then 1 or 2 stop bits. The programs presented here will not use the parity\
    \ bit, have one stop bit and 8 data bits. This is configured by setting values\
    \ in registers then *EUSART* will transmit values whenever a byte is loaded into\
    \ the *TXREG* register. Once configured, sending data requires only a couple of\
    \ lines of code each time.\n\n#### 4.2.2 • Configuring the EUSART to Transmit\
    \ a Byte\n\nThe datasheet gives a full description of the Enhanced Universal Synchronous\
    \ Asynchronous Receiver Transmitter that is in both PICs. There are many more\
    \ accessible features than I will use. Page 268 shows a diagram of the transmit\
    \ details. Table 4-1 shows the steps necessary to configure *EUSART* to transmit\
    \ bytes.\n\n| Purpose | Code | Comments |\n| :--- | :--- | :--- |\n| Enable transmission.\
    \ | BSF TXSTA, TXEN | TXEN is bit 5 in the status and control register (page 277).\
    \ |\n| Enable the serial port. | BSF RCSTA, SPEN | SPEN is bit 7 in the status\
    \ and control register (page 278). |\n| Set up a baud rate of 19200 | MOVLW 0x19,\
    \ MOVWF SPBRGL, CLRF SPGH | Baudrate = clock/(64*(spgh:spgl+1)) = 19200 (page\
    \ 280 and 282). |\n| On the PIC 16F183 the transmit pin can be either pin 13 (RA0)\
    \ or pin 6 (RC4), we want pin 13. | BSF APFCON, TXCKSEL | Set bit 2 in APFCON\
    \ (alternate function) to make transmit pin RA0 (page 114). |\n\nThis configuration\
    \ of EUSART for this purpose has been made into a macro. This macro is for use\
    \ at 32 MHz:\n\n```asm\nSET_SERIAL_TX_16F1823 MACRO ; Bank 3 required.\nBSF TXSTA,\
    \ TXEN ; Enables transmit BIT 5. See page 277.\nBSF RCSTA, SPEN ; Enables the\
    \ serial port BIT 7. See page 278.\nMOVLW 0x19 ; Sets the Baudrate=clock/(64*(spgh:spgl+1))=19200\
    \ for clock=32MHz. See pages 280 and 282.\nMOVWF SPBRGL\nCLRF SPGH\nMOVLB 2\n\
    BSF APFCON, TXCKSEL ; Set bit 2 of APFCON to change the use of pin 13 to be TX.\
    \ See page 114.\nENDM ; Leaves in bank 2\n```\n\nThe transmission of the byte\
    \ is achieved by loading a value into the *TXREG* register. If Shift Register\
    \ (*TSR*) is empty, the byte is moved immediately to the *TSR*. The next line\
    \ tests the *TRMT* bit in *TXSTA*. This bit is low when *TSR* is not empty and\
    \ goes high when *TSR* is empty. The line after loading the byte into *TXREG*\
    \ tests the *TRMT* bit and the next line loops around until the byte has been\
    \ transmitted.\n\nMOVFW PULSE\\_COUNTER\nMOVWF TXREG ; Loads the value of pulse\\\
    _counter into TXREG for transmission.\nBTFSS TXSTA, TRMT ; When the transmission\
    \ has completed TRMT gets set, until then this line and the next loop around.\n\
    GOTO $-1\nCLRF TICK\\_COUNTER\n\nYou can compare the state diagram Figure 4-1\
    \ with the program below.\n\n#### 4.2.3 • Serial Output Example\n\nBelow is the\
    \ complete program to demonstrate transmitting values. A single byte has a maximum\
    \ value of 255. If incremented by one, it rolls over to 0.\n\n```asm\n;prog_04_01.asm\n\
    LIST P=16F1823\n#INCLUDE <p16f1823.inc>\n#INCLUDE <fsm_macros.inc>\nRADIX DEC\
    \ ; Default numbers are to base 10.\nBOOK_CONFIGURATION ; See macro in fsm_macros.inc.\n\
    CBLOCK 0x70\nTICK_COUNTER\nPULSE_COUNTER\nENDC\nORG 0X00\nGOTO START\nORG 0X04\
    \ ; Interrupt vector\nBCF INTCON, TMR0IF ; Clear the tmr0 overflow interrupt flag.\n\
    INCF TICK_COUNTER, F ; Increment by one COUNTER_ON.\nRETFIE ; Return from interrupt.\n\
    START:\nMOVLB 1\nSET_FREQ_32MHZ ; See file fsm_macros.inc.\nBCF TRISA, 2 ; Set\
    \ RA4 as an output for the LED.\nSET_TMR0_CASE1 ; See file fsm_macros.inc.\nMOVLB\
    \ 3\nSET_SERIAL_TX_16F1823 ; See file fsm_macros.inc, this sets TXEN, SPEN, sets\
    \ the Baud rate and changes the use of pin 2 to be TX.\nBANKSEL LATA\nBSF LATA,\
    \ 2 ; Initialise LED on. We are in bank 2 for LATA from the macro.\nCLRF PULSE_COUNTER\n\
    ;-------Machine states\nS0 ; LED on\nMOVLW 31 ; Put 31 into W to compare with\
    \ TICK_COUNTER.\nIF_REG_LESS_THAN_W TICK_COUNTER ; See macro in fsm_macros.inc.\n\
    GOTO S0\nBANKSEL LATA ; Bank 2.\nBCF LATA, 2\nCLRF TICK_COUNTER\nS1 ; LED on\n\
    MOVLW 91 ; Put 91 into W to compare with TICK_COUNTER.\nIF_REG_LESS_THAN_W TICK_COUNTER\
    \ ; See macro in fsm_macros.inc.\nGOTO S1\nBANKSEL LATA ; Bank 2.\nBSF LATA, 2\n\
    BANKSEL TXREG ; Bank 3.\nINCF PULSE_COUNTER, F\nMOVFW PULSE_COUNTER\nMOVWF TXREG\
    \ ; Loads the value of pulse\\_counter into TXREG for transmission.\nBTFSS TXSTA,\
    \ TRMT ; When the transmission has completed TRMT gets set, until then this line\
    \ and the next loop around.\nGOTO $-1\nCLRF TICK_COUNTER\nGOTO S0\nEND\n```\n\n\
    The circuit diagram is shown in Figure 4-2. It is the same as used for the seven-segment\
    \ display but without the display.\n\nProgram 4-1 Transmitting Bytes\n"
  mdcn: "\n*MOVLB* 指令可将银行号移动到 *BSR* 中。或者，可以使用 gpasm 的 *BANKSEL* 指令来生成所需的代码，例如：\n\n\
    ```asm\nBANKSEL TRISA \n```\n\n这可以节省你查找 *TRISA* 银行号的次数。虽然这很方便，但有时你仍然需要知道所需的银行号。例如，如果你在配置振荡器、中断以及输入/输出时需要访问几个特殊寄存器，你可以通过编写代码将这些特殊寄存器按银行分组，从而节省切换银行的次数。\n\
    \n随着程序变得越来越复杂，银行切换问题会变得更加棘手。由于 `GOTO` 和从子程序返回的操作，你很容易在执行后续指令时处于错误的银行。如果代码没有运行，这是你应该优先检查的地方之一。中断具有自动保存上下文的功能。因此，在返回时，*BSR*\
    \ 的值会被恢复，所以你只需要在中断内部更改银行。请参阅数据手册的第 85 页。如果你使用 C 语言编程，编译器将为你处理银行切换。\n\n我的建议是，通过查看小块代码来检查你的程序，例如每个机器状态、子程序或宏的代码。通过查看那小块代码，你就可以判断其内部指令是否处于正确的银行。你最终可能会产生冗余的银行切换，一旦程序运行，你随时可以对其进行优化。处理宏时要格外小心，因为代码可能在另一个文件中是不可见的。\n\
    \n对于宏，我采用的策略是：只有在宏执行过程中途需要切换银行时，才在宏内部放置银行切换。这意味着在进入宏之前，你必须检查是否处于正确的银行。这看起来可能不方便，但如果你在宏的开头进行银行切换，可能会导致冗余并浪费程序内存。\n\
    \n## 第 4 章 • 输入与输出\n\n### 4.1 • 引言\n\n前三章仅使用了 PIC 输出来驱动 LED。这只是为了让你熟悉工具链和 FSM（有限状态机）的概念。本章将详细介绍输入和输出，并处理数字/模拟输入、脉冲调制输出以及与计算机的串行通信。PIC\
    \ 还可以通过 I2C 总线与其他设备通信，并利用电容传感技术接受手指触摸输入。然而，根据已涵盖的内容，本书将不会深入介绍这些，但根据数据手册的信息，你应该能够在项目中使用这些功能。从状态机的角度来看，本章中的程序是非常微不足道的。本章的核心是关于使用\
    \ I/O。\n\n### 4.2 • 向计算机的串口输出\n\n这些 PIC 具有“增强型通用同步异步收发器”（EUSART），我们可以结合 *FTDI*\
    \ 串口连接线，实现 PIC 与计算机之间的直接通信。在适用于 Windows 和 Linux 的压缩包下载中包含一个名为 *serial\\_reader*\
    \ 的程序，它可以打印 PIC 发送的屏幕数值。为了产生要传输的数据，程序 3-1 将闪烁 LED 并增加计数器值。计数器值将通过串口链路传输到计算机并显示在屏幕上。\n\
    \n![](img/a08bd00952da48f769971864f33af432_66_0.png)\n\n#### 4.2.1 • TTL 电平串行通信\n\
    \n通常，RS232 串口链路使用 -3V 到 -25V 之间的负电压表示逻辑 1，使用 +3V 到 +25V 之间的正电压表示逻辑 0。PIC 和 FTDI\
    \ 线使用的电压为：0V 表示逻辑 0，+5V（约）表示逻辑 1。这非常方便，因为我们只需要电源电压，不需要电平转换电路。串口链路以“波特率”（Baud）速率传输数据字节。在这种情况下，波特率可以被视为每秒比特数。我们将使用\
    \ 19200 波特的速率。沿线发送的字节由一个起始起始位、7 或 8 个数据位、一个校验位以及 1 或 2 个停止位组成。这里提供的程序不会使用校验位，采用一个停止位和\
    \ 8 位数据位。这是通过设置寄存器中的值配置的，之后每当一个字节加载到 *TXREG* 寄存器时，*EUSART* 就会传输数值。一旦配置，每次发送数据只需要几行代码。\n\
    \n#### 4.2.2 • 配置 EUSART 发送字节\n\n数据手册对两个 PIC 中的增强型通用同步异步收发器进行了完整描述。它的可用功能比我将使用的多得多。第\
    \ 268 页显示了传输细节的图。表 4-1 显示了配置 *EUSART* 发送字节所需的步骤。\n\n| 目的 | 代码 | 注释 |\n| :--- |\
    \ :--- | :--- |\n| 启用传输。 | BSF TXSTA, TXEN | TXEN 是状态控制寄存器中的第 5 位（第 277 页）。 |\n\
    | 启用串口。 | BSF RCSTA, SPEN | SPEN 是状态控制寄存器中的第 7 位（第 278 页）。 |\n| 设置波特率为 19200 |\
    \ MOVLW 0x19, MOVWF SPBRGL, CLRF SPGH | 波特率 = clock/(64*(spgh:spgl+1)) = 19200\
    \ (第 280 页和 282 页）。 |\n| 在 PIC 16F183 上，传输引脚可以是引脚 13 (RA0) 或引脚 6 (RC4)，我们需要引脚\
    \ 13。 | BSF APFCON, TXCKSEL | 设置 APFCON（备用功能）中的第 2 位使传输引脚变为 RA0（第 114 页）。 |\n\n\
    这种为此目的进行的 EUSART 配置已制成一个宏。该宏用于 32 MHz：\n\n```asm\nSET_SERIAL_TX_16F1823 MACRO\
    \ ; 需要银行 3。\nBSF TXSTA, TXEN ; 启用传输 BIT 5。参见第 277 页。\nBSF RCSTA, SPEN ; 启用串口 BIT\
    \ 7。参见第 278 页。\nMOVLW 0x19 ; 为 clock=32MHz 设置波特率=clock/(64*(spgh:spgl+1))=19200。参见第\
    \ 280 页和第 282 页。\nMOVWF SPBRGL\nCLRF SPGH\nMOVLB 2\nBSF APFCON, TXCKSEL ; 设置 APFCON\
    \ 的第 2 位将引脚 13 的用途更改为 TX。参见第 114 页。\n```\n\n对于宏，我采用的策略是：只有在宏执行过程中途有切换银行的需求时，才在宏内部放置银行切换。这意味着你必须在进入宏之前检查是否处于正确的银行。这看起来可能不方便，但如果你在宏的开头进行银行切换，可能会导致冗余并浪费程序内存。\n\
