    \n在这个第一个简单的示例中，我们可以“走捷径”，因为只启用了一个中断。不需要检查是哪种中断，所以中断服务程序更加简单。我们要做的是每发生一次中断，计数器就加1。这个计数器计算滴答（ticks）。这里是此示例的简化版\
    \ ISR。\n\n```\nORG 0X04 ; 中断向量。\n\nBCF INTCON, TMR0IF ; 清除 TMR0 溢出中断标志，INTCON\
    \ 位于所有银行中。\n\nINCF TICK_COUNTER, F ; TICK_COUNTER 加 1，结果存回文件。\n\nRETFIE ; 中断返回。\n\
    ```\n\n图 2-3 中断程序流 (timer0)\n\n| 位 | 值 | 描述 |\n| :--- | :--- | :--- |\n| 7 | 1\
    \ | 全局中断允许位 |\n| 6 | 1 | 外设中断允许位 |\n| 5 | 1 | Timer0 溢出中断允许位 |\n| 4 | 0 | INT\
    \ 外部中断允许位 |\n| 3 | 0 | 变化中断允许位 |\n| 2 | 0 | Timer0 溢出中断标志位 |\n| 1 | 0 | INT 外部中断标志位\
    \ |\n| 0 | 0 | 变化中断标志位 |\n\n*INTCON* 寄存器在所有银行中均可用（第 22 页）。该计数器位于所有银行可访问的 16 个内存单元块中，0x070\
    \ – 0x07F（第 21 页）。现在每当 *TMR0* 从 255 回到 0 时，就会发生一次中断，每秒 122 次。对于我们的闪烁 LED 来说这太快了，它看起来一直亮着，但亮度较暗。这就是计数器的用武之地。代码将有两个状态：一个用于\
    \ LED 开启，一个用于熄灭。计数器 *TICK_COUNTER* 将由中断代码递增。在开启状态下，将检查计数器是否大于或等于 31。如果是，状态将发生改变。这意味着开启时间将是\
    \ 31/122 秒：大约 0.25 秒。在熄灭状态下，将检查计数器是否达到 91。这将提供 91/122 秒的延迟：大约 0.75 秒。以下是开启状态的代码行。计数器在转换过程中作为输出或操作之一被重置。\n\
    \n```\nS0 ; LED 开启。\n\nMOVLW 31\n\nSUBWF TICK_COUNTER, W ; 当 counter_on >= 31\
    \ 时，STATUS 中的 C 被设置。\n\nBTFSS STATUS, C ; 如果发现 STATUS 中的 C 位为 1，则跳过下一条指令\n\nGOTO\
    \ S0 ; 发现 status 中的 C 位未设置。\n\nCLRF TICK_COUNTER ; 重置计数器。\n\nBCF PORTA, 2 ; 关闭\
    \ LED。\n```\n\n使用 gpasm 时，默认进制是十六进制。要表示大于 9 的十进制数（如九十一），你必须放入 D’91’。我倾向于在代码中添加‘RADIX\
    \ DEC’行，这样进制现在变为 10。现在可以使用传统的数字表示法。从现在起，数字将如下所示。\n\n11 表示十进制的十一。\n\n0x11 表示十六进制的十七。\n\
    \nB’11’ 表示二进制的三。\n\n混淆十进制和十六进制的进制是导致 bug 的另一个特定原因。\n\n表 2-3 INTCON 寄存器的示例位设置\n\
