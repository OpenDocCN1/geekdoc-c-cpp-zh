    ## 8.8 需要记住的事项

    - 对程序需要做什么有清晰的认识

    - 将程序拆分成较小的独立问题

    - 绘制顶层状态图或使用流程图来获取你想要的内容

    - 考虑在主状态内部使用子状态，否则会增加许多状态

    - 绘制电路图并识别所需的输入和输出

    - 分块编码并边写边测试

    - 使用小型测试程序正确配置输入、输出和定时器等

    - 尽可能对许多行添加注释

    - 保持注释、代码和状态图的同步

    - 使用调试进行故障排除

    - 银行选择可能是查找问题的第一个地方

    - 如果完全卡住了，停止工作做点事情，稍后再尝试


    ## 第 9 章与 C 的比较


    ### 9.1 引言

    汇编语言有优点也有缺点。一个优点是能够深入了解硬件以及你的代码在做什么。如果你是一个爱好者，那么使用汇编可以是很有趣且有趣的。如果你是一个学生，当你以后使用高级语言或需要充分利用芯片性能时，它将为你提供更好的基础。对于
    PIC，XC8 编译器的免费版本生成的代码通常比你自己用汇编编写的大。本书的目的之一是展示有限状态机方法如何为汇编程序提供结构，使其更容易编写，同样也更容易阅读。最后两个章节关于如何将
    C 与 FSM 使用。我假设你从未使用过 C。这一章首先将介绍安装编译器，并详细介绍有关该语言的基本知识。使用高级语言编写软件可以节省时间，前提是运行正确并符合内存限制。


    ### 9.2 Microchip XC8 编译器

    使用的编译器是 Microchip XC8 的免费版本。代码将写在文本文件中，编译器产生的 hex 文件将通过书中使用的 FTDI 引导线和程序写入器写入芯片。对于本书，我们将
    XC8 作为一个独立程序使用，而不是在具有图形用户界面 (GUI) 的 MPLAB 中。这将通过命令行运行来实现。确保获取了适用于 Linux 或 Windows
    的正确版本。


    ### 9.2.1 适用于 Microsoft Windows 的 XC8

    运行安装文件并回答条款问题。接受默认安装位置，并同意将 XC8 添加到路径环境变量中。是否购买许可证、使用付费版本的免费试用版或直接使用免费版本取决于你。对于本书，免费版本就是你需要的。


    ### 9.2.2 适用于 32 位 Debian 发行版的 XC8

    这适用于 Debian 及其衍生版本（如 Ubuntu 和 Mint）。下载 Linux 版本的安装程序。其文件名以 .run 结尾。注意，这并不是开源软件意义上的“免费”。你不会像通常那样通过包管理器来安装它。你必须的第一的第一是运行如图
    9-1 所示的命令使文件变为可执行。这里我将文件下载到 Downloads 目录，命令 `*chmod +x xc8-v2.10-full-install-linux-installer.run*`
    将使其可执行。注意：现在的版本可能不同。


