- md: '

    MOVLB 0 ; Select the bank for PIR1 see page 89.

    BTFSS PIR1, RCIF ; Test the receive interrupt flag, if set skip to receive routine.

    RETFIE ; Escape from interrupt routine if none apply.


    INT_RECEIVE

    MOVLB 3 ; Select the bank for RCREG where the received byte can be

    ; recovered the same bank as RCSTA.

    BTFSC RCSTA, FERR ; Test for a framing error, indicated by the stop bit being
    zero,

    ; see page 278.

    GOTO ABORT_READ ; Framing error detected therefore value is unreliable, jump to

    ; ABORT_READ.

    MOVF RCREG, W ; Move the value from RCREG to the working directory.

    MOVWF PERIOD ; Received byte value from RCREG is moved to the PERIOD file.

    BTFSS RCSTA, OERR ; Check for overrun error if so then skip to disable/enable

    ; continuous read to reset the error flag.

    RETFIE ; If no overrun error return from interrupt.

    BCF RCSTA, CREN ; Disable continuous read (CREN), see page 278 and page

    ; 274 for overrun error.

    BSF RCSTA, CREN ; Enable CREN again.

    RETFIE ; Return from interrupt.


    INT_TMR0

    BCF INTCON, TMR0IF ; Clear the tmr0 overflow interrupt flag.

    INCF TICK_COUNTER, F ; Increment by one COUNTER_ON.

    RETFIE ; Return from interrupt.


    ABORT_READ

    MOVF RCREG, W ; RCREG read and value discarded.

    RETFIE ; Return from interrupt.


    ;--------------End of interrupt service routine


    START:

    MOVLB 1 ; Select the bank for TRISA, it is also the bank for

    ; the next two macros.

    BCF TRISA, 2 ; Set RA2 pin 11 an output.

    SET_FREQ_HZ 32000000 ; See file fsm_macros.inc, stays in bank 1

    SET_TMR0_CASE1 ; See file fsm_macros.inc, stays in bank 1

    SET_SERIAL_RX_16F1823 ; See file fsm_macro.inc. Comes out of macro in bank 3

    CLRF PULSE_COUNTER ; Clear file (initialise) PULSE_COUNTER to 0 .

    MOVLW 91

    MOVWF PERIOD ; Initial off period 91/122 = 0.75 s

    BANKSEL LATA

    BSF LATA, 2


    ;--------------------------machine states

    S0 ; LED on

    MOVLW 31

    IF_REG_LESS_THAN_W TICK_COUNTER

    GOTO S0

    BANKSEL LATA

    BCF LATA, 2

    CLRF TICK_COUNTER


    S1 ; LED off

    MOVF PERIOD, W ; PERIOD is written to by the EUSART from the computer.

    IF_REG_LESS_THAN_W TICK_COUNTER

    GOTO S1

    BANKSEL LATA

    BSF LATA, 2

    CLRF TICK_COUNTER

    GOTO S0

    END


    ## 4.4 • Analog Inputs


    Some of the inputs on the PIC can be configured to convert the voltage applied
    to them to a number from 0 to 1023 for a range of 0 – 5V. The PIC 12F1822 has
    four analog inputs on its only port (*PORTA*). The PIC 16F1823 has eight analog
    inputs, four on *PORTA* and four on PORTC. Although there are multiple analog
    input channels, there is only one analog to digital converter so you have to select
    the channel that is to use the A/D converter.


    Program 4-2 Receiving Byte


    Page 130 in the datasheet shows a diagram of the A/D multiplexing. The procedure
    for configuring an analog input channel is as follows. For this program, only
    one pin will be used as an analog input.


    The port must be configured so that the pin is an input and set as analog.


    - *TRISA* or *TRISC* is used for setting the pin as an input. The default setting
    is input.

    - *ANSELA* and *ANSELC* are used to set the inputs as analog. *ANSELC* is only
    on the 16F1823. The default setting is analog.


    The channel used by the A/D converter must be selected.


    - The channel select bits *CHS* in *ADCON0* is used to select the channel.


    Voltage reference must be selected. Voltage reference is what the input voltage
    is being measured against. This can be the +5V supply, external voltage reference
    or internal voltage reference.


    - The *ADPREF* bits in *ADCON1* are used to select voltage reference.


    The conversion clock must be set. Pages 131 and 132 in the datasheet explain this
    fully.


    - The *ADCS* bits in *ADCON1* are used to select the conversion clock.


    The result of the conversion is a 10-bit word presented in two registers: *ADRESH*
    and *ADRESL*. These are the high and low bytes of the analog to digital result.
    We can justify the bits to the left so that the 8 highest bits are in *ADRESH*
    and the two lowest in *ADRESL*, or we can justify right so that the lowest 8 bits
    are in *ADRESL* with the two highest in *ADRESH*. Figure 16-3 in the datasheet
    shows this.


    - The justification is set by bit 7 *ADFM* in *ADCON1*.


    Table 4-4 shows the mapping of analog channels to pins and I/O bits. Note how
    the channel numbers don’t always match the I/O numbers. Be careful when setting
    the *CHS* bits in *ADCON0*.


    ### Analog Inputs


    | 12F1822 Port | 12F1822 Pin | 12F1822 I/O | 12F1822 A/D | 16F1823 Port | 16F1823
    Pin | 16F1823 I/O | 16F1823 A/D |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | PORTA | 7 | RA0 | AN0 | PORTA | 13 | RA0 | AN0 |

    | PORTA | 6 | RA1 | AN1 | PORTA | 12 | RA1 | AN1 |

    | PORTA | 5 | RA2 | AN2 | PORTA | 11 | RA2 | AN2 |

    | PORTA | 3 | RA4 | AN3 | PORTA | 3 | RA4 | AN3 |

    | PORTC | 10 | RC0 | AN4 | PORTC | 9 | RC1 | AN5 |

    | PORTC | 8 | RC2 | AN6 | PORTC | 7 | RC3 | AN7 |


    Table 4-4 Analog input pins


    This program is going to read analog voltages on pin RA4 (*AN3). It will transmit
    the most significant bits of 10 available from the A/D converter to be read by
    the computer. By ignoring the two least significant bits we will only resolve
    to 20 mV instead of 5 mV. Analog-to-digital conversion is started by setting bit
    1 in *ADCON0* to 1. This bit has name *GO/DONE*, meaning that when it is set to
    high it starts the conversion. When the conversion is completed the bit gets to
    low by the hardware. Inside the code is a loop that waits for completion before
    moving on.


    BTFSC ADCON0, 1 ; This and the next line loop around until the conversion is finished.

    GOTO $-1


    ## 4.4.1 Setting ADCON0 and ADCON1


    | ADCON0 | Bit 7 | Bit 6 | Bit 5 | Bit 4 | Bit 3 | Bit 2 | Bit 1 | Bit 0 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 0x70 | Implemented | 0 | 0 | 0 | 0 | 0 | GO/DONE | 0 |


    | ADCON1 | Bit 7 | Bit 6 | Bit 5 | Bit 4 | Bit 3 | Bit 2 | Bit 1 | Bit 0 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 0x60 | ADC enable | 0 | 0 | 0 | 0 | 0 | 0 | 0 |


    ADRESH:ADRESL left-justified. Eight most significant bits in ADRESH Set the ADC
    clock period to μS for 32 MHz speed. See Table 16-1 in the datasheet. 0x40 is
    Implemented. V REF is connected to VDD.


