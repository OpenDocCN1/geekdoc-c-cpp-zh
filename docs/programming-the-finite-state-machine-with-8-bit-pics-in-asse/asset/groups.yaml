    \n**9.3.4 • Emitted Code Assembly vs C**\n\nWhen programming using assembly language,\
    \ you are using mnemonics such as *DECFSZ*, \n\netc. Following a mnemonic, there\
    \ will usually be one or more arguments. In the case of \n\n*DECFSZ*, there will\
    \ two arguments: the file to be decremented and the destination either \n\nback\
    \ in the same file *F* or into the working register *W*. To see all details, look\
    \ on datasheet \n\npage 309 and onwards. These assembly instructions are formed\
    \ into 14-bit words that are \n\nformatted into the hex file that will be loaded\
    \ into the PIC. With assembly language, what \n\nyou write is translated directly\
    \ into machine code. With C, we take a step back and what is \n\nwritten in the\
    \ source code is processed by the compiler. It will produce machine code that\
    \ \n\nyou don’t have any direct control over. \n\nTo give an example, the period\
    \ calculated for each on and off for the assembly program is \n\n98.5ms. \n\n\
