    \ • The Differences Between the PIC 12F1822 and the 16F1823**\n\nThe obvious difference\
    \ is that the 12F1822 has 8 pins, while the 16F1823 has 14. This is \n\nbecause\
    \ the 16F1823 has two I/O ports. Apart from this difference, programming is almost\
    \ \n\nthe same. You must quote the correct include file at the top of your source\
    \ code and state \n\nthe correct controller for your chip. Below are the relevant\
    \ lines:\n\n \n\nLIST P=12F1822\n\n \n\n#INCLUDE <p12f1822.inc>\n\n \n\nLIST P=16F1823\n\
    \n \n\n#INCLUDE <p16f1823.inc>\n\nThe advantage of a smaller chip is that it takes\
    \ up less space on a circuit board and there \n\nare fewer pins to solder if you\
    \ don’t need the extra port. You must consult the datasheet as \n\nthere are always\
    \ traps to fall into. There will be occasions when you will stare at your code\
    \ \n\ntrying to understand what is wrong, but the answer will be in the datasheet.\n\
    \nProgram 2-3 Two Machines Seven-Segment Display Counting Pulses"
  - "[PAGE 51]\n\ng\n\ng\n\ny\n\n● 52\n\n**2.9 • Interrupts and State Diagrams**\n\
    \nI have not tried to show interrupts in any way on the state diagrams as they\
    \ do not change \n\nthe state of the machine. When an interrupt occurs, the main\
    \ program is suspended: \n\nsee paragraph 2.4 above. Therefore no change in state\
    \ occurs until after the return from \n\ninterrupt and then only if the interrupt\
    \ has changed the input to the state machine (such as \n\nan increase in a counter\
    \ changing the result of comparison)."
  - "[PAGE 52]\n\np\n\n,\n\ng\n\n● 53\n\n**Chapter 3 • Macros, Subroutines and Bank\
    \ Switching **\n\n**3.1 • Introduction**\n\nThe circuit from Chapter 2, Fig 2-9,\
    \ can be used for all of the examples in this chapter. This \n\ncircuit drives\
    \ the 7-segment LED display and the single LED using the 16F1823 PIC. \n\nYou\
    \ might by now be thinking that assembly language is just too inconvenient. It\
    \ does take \n\nlonger to write and can be difficult to read. Take for example\
    \ Fig 2-4 of the last chapter \n\nwhere a comparison of two values was made to\
    \ decide between two courses of action in the \n\nprogram. If you are used to\
    \ a higher level language like C, it could be something like this: \n\n \n\nif\
    \ (tick\\_counter < 31)\n\n \n\n{\n\n \n\n goto S0\n\n \n\n}\n\n \n\nelse\n\n\
    \ \n\n{\n\n \n\n goto S1\n\n \n\n}\n\nEven if you have never seen this programming\
    \ language before, you would understand it. \n\nIn contrast, this is what we have.\
    \ \n\n \n\n;----------Machine States\n\n \n\nS0 ; LED on.\n\n \n\n MOVLW 31\n\n\
    \ \n\n SUBWF TICK\\_COUNTER, W ; C in STATUS is set when counter\\_on >==31.\n\
    \n \n\n BTFSS STATUS, C ; Skip next instruction if C in STATUS is found set.\n\
    \n \n\n GOTO S0 ; C in status found not set.\n\n \n\n CLRF TICK\\_COUNTER ; Reset\
    \ the counter.\n\n \n\n BCF PORTA, 2 ; Turn the LED off.\n\n \n\n \n\n \n\nS1\
    \ ; LED off.\n\n \n\n MOVLW 91\n\nThe MOVLW 31 line is easy to follow. It is just\
    \ moving the literal value decimal 31 into the \n\nworking register. The next\
    \ line, SUBWF TICK\\_COUNTER\\_ON, W, means subtract the value in \n\nthe *W*\
    \ register from the register *TICK\\_COUNTER\\_ON* and put the result in the *W*\
    \ register. \n\nThe next line makes reading this difficult. You have to know what\
    \ effect the sign of the \n\nresult has on the carry flag *C* in the *STATUS*\
    \ register and then work out if a skip is going to \n\nhappen. Page 320 of the\
    \ datasheet explains how *SUBWF* (subtract w from f) works. This \n\ndescribes\
    \ what the code example means:"
  - "[PAGE 53]\n\ng\n\ng\n\ny\n\n● 54\n\n*C = 1*\n\n*31 ≤ TICK\\_COUNTER\\_ON *\n\n\
    *C = 0*\n\n*31 > TICK\\_COUNTER\\_ON *\n\nIf C is 0, the program executes the\
    \ GOTO S0 line, because TICK\\_COUNTER\\_ON has not \n\nreached 31 yet. If C is\
    \ 1 it skips this line and moves on to the code that follows. What we \n\nneed\
    \ is an instruction that looks more like the if...else statement that can be read\
    \ more \n\neasily. While we’re on the subject, if you were wondering about goto,\
    \ it is part of the C \n\nlanguage but isn’t recommended.\n\n \n\n**3.2 • Create\
    \ Your Own Instruction**\n\nThe macro allows you to define your instruction that\
    \ can be reused. For the problem above, \n\nthe code snippet can be written as\
    \ follows. Both states are shown here:\n\n \n\n \n\nS0 ; LED on.\n\n \n\n MOVLW\
    \ 31\n\n \n\n IF\\_REG\\_LESS\\_THAN\\_W TICK\\_COUNTER ; See macro in fsm\\_macros.inc.\n\
    \n \n\n GOTO S0\n\n \n\n CLRF TICK\\_COUNTER ; Reset the counter.\n\n \n\n BCF\
    \ PORTA, 2 ; Turn the LED off. \n\n \n\nS1 ; LED off.\n\n \n\n MOVLW 91\n\n \n\
    \n IF\\_REG\\_LESS\\_THAN\\_W TICK\\_COUNTER ; See macro in fsm\\_macros.inc.\n\
    \n \n\n GOTO S1\n\n \n\n CLRF TICK\\_COUNTER ; Reset the counter. \n\n \n\n BSF\
    \ PORTA, 2 ; Turn the LED on.\n\n \n\n GOTO S0\n\n \n\n \n\n END\n\nWe have introduced\
    \ a new instruction IF\\_REG\\_LESS\\_THAN\\_W meaning if a register value \n\n\
    is less than the value in W, execute the next line, else skip and execute the\
    \ line after. The \n\nregister is presented as the argument TICK\\_COUNTER. \n\
    \nDefine the macro before the place in the code where it is first used. The definition\
    \ is started \n\nby typing its name at the start of the line and following it\
    \ with the word MACRO, then names \n\nfor the arguments. There will be one argument.\
    \ In this case, the register that is to be \n\ncompared to the value in W. Subsequently\
    \ add the code you want the macro to perform. \n\nEnd the macro definition with\
    \ ENDM.\n\nTable 3-1 Carry Flag Behaviour for SUBWF"
  - "[PAGE 54]\n\np\n\n,\n\ng\n\n● 55\n\nIF\\_REG\\_LESS\\_THAN\\_W MACRO ARG1\n\n\
    \ SUBWF ARG1, W\n\n BTFSS STATUS, C ;See SUBWF on page 320, if W > ARG1, C = 0\n\
    \n ENDM\n\n ; The ‘if’ code here - this will be a GOTO to jump over the else code.\n\
    \n ; The ‘else’ code here.\n\nThe argument names used in the definition should\
    \ be different from any register names \n\nused in your program. Here I used ARG1\
    \ in the definition. When the macro name is inserted \n\ninto the program, the\
    \ argument name used is TICK\\_COUNTER.\n\nThe thing to grasp here is that this\
    \ is not a new opcode or instruction created for the \n\nprocessor. What happens\
    \ is the macro definition gets placed in our code by the assembler \n\nwherever\
    \ we type its name. Argument ARG1 is substituted by the argument used in the \n\
    \nprogram.\n\n**3.2.1 • Use an Include File**\n\nMacros don’t have to be in the\
    \ source code file with the rest of your program. You can put \n\nthem in a separate\
    \ file and use the include directive at the top of the source code. This will\
    \ \n\ngive you access to any macros in that file. Program 3-1 shows the macro\
    \ inserted in two \n\nplaces and the definition placed in a file called *fsm\\\
    _macros.inc*. At the top of the source \n\ncode is the line #INCLUDE <fsm\\_macros.inc>.\
    \ The file can be in the same directory as your \n\nsource file. You will have\
    \ to copy it from the *chap03\\_source\\_xxx* directory to the working \n\ndirectory.\n\
    \n; prog\\_03\\_01.asm\n\n; This is Prog\\_02\\_01.asm using macros. \n\nLIST\
    \ P=12f1822\n\n#INCLUDE <p12f1822.inc>\n\n#INCLUDE <fsm\\_macros.inc>\n\n RADIX\
    \ DEC ; Default numbers to base 10.\n\n \\_\\_CONFIG 0X8007, (\\_FOSC\\_INTOSC\
    \ & \\_WDTE\\_OFF & \\_PWRTE\\_OFF & \\_CP\\_OFF & \\_BOREN\\_OFF & \\_IESO\\\
    _OFF & \\_FC-\n\nMEN\\_OFF )\n\n \\_\\_CONFIG 0X8008, (\\_LVP\\_ON)\n\n CBLOCK\
    \ 0x70\n\n TICK\\_COUNTER\n\n ENDC\n\n ORG 0X00\n\n GOTO START\n\n ORG 0X04 ;\
    \ Interrupt vector.\n\n BCF INTCON, TMR0IF ; Clear the tmr0 overflow interrupt\
    \ flag.\n\n INCF TICK\\_COUNTER, F ; Increment by one TICK\\_COUNTER.\n\n RETFIE\
    \ ; Return from interrupt.\n\nSTART:\n\n MOVLB 1 ; TRISA, OSCCON, OPTION\\_REG.\n\
    \n BCF TRISA, 2 ; Make RA2 an output.\n\n MOVLW 0x70\n\n MOVWF OSCCON ; Page 65\
    \ 32MHz.\n\n MOVLW 0xD7\n\n MOVWF OPTION\\_REG ; Page 164."
