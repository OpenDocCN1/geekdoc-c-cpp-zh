    ## 4.4.2 电路和状态图


    向模拟输入提供变电压的简单方法是使用电位器。值并不关键：一个 1KΩ 即可。由于我们使用电源电压 VDD 作为参考，当电位器从 0V 扫描到 Vdd 时，结果（查看结果中的最高位）应该从
    0 扫描到 255。


    状态图简单，只有两个状态。机器在等待模拟数字转换的状态和等待串口传输的状态不断切换。源代码中的注释解释了代码的操作。


    图 4-5 程序 4-3 电路

    图 4-6 程序 4-3 状态图


    ; prog_04_03.asm

    ; 页码参考数据手册。

    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm_macros.inc>

    RADIX DEC ; 默认数字为10进制。


    BOOK_CONFIGURATION

    ORG 0x00

    GOTO START

    ORG 0x08

    START:

    MOVLB 1 ; 宏需要存储器区 1，TRISA 在存储器区 1。

    SET_FREQ_32MHZ ; 参见文件 fsm_macros.inc。

    BSF TRISA, 4 ; RA4 (AN3) 作为输入。参见书中文字 RA4 是 AN3！

    MOVLW 0x0D ; 选择通道 AN3 并启用 ADC。

    MOVWF ADCON0 ; 参见书中的表4-5。

    MOVLW 0x60 ; 参见第137页，左对齐结果，转换时钟为 Fosc/64，Vref 是 PIC 电源 Vdd。

    MOVWF ADCON1 ; 参见书中的表4-5。

    MOVLB 3

    SET_SERIAL_TX_161823 ; 参见文件 fsm_macros.inc。

    S0

    BANKSEL ADCON0 ; 存储器区 1

    BSF ADCON0, 1 ; 启动模拟数字转换

    BTFSC ADCON0, 1 ; 此行和下一行循环直到转换完成。

    GOTO $-1

    S1

    MOVF ADRESH, W ; 最高8位位于 ADRESH（左对齐）。

    BANKSEL TXREG ; 存储器区 3

    MOVWF TXREG ; 加载 TXREG 开始传输。

    BTFSS TXSTA, TRMT ; 传输完成后 TRMT 被置位，否则此行和下一行循环。

    GOTO $-1

    GOTO S0

    END


    工作目录中提供的 serial_reader 程序可以接受缩放系数作为命令行参数。如果全量程读取 255 时输入电压为 4.99 V，则 0.01957 的缩放系数将以电压输出到屏幕：参见下图7。这是可用的命令行选项之一。通过添加
    -f 后跟缩放系数，程序的输出将从原始字节值变为原始字节值和缩放浮点值。你还可以在命令行中添加 -o file_name 选项来捕捉结果。请注意此程序将在10秒内创建一个
    500k 字节的文件，包含约 20000 个样本。


