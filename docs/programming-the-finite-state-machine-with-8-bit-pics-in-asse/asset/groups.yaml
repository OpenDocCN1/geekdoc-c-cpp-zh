    \ to go high.\nMOVF Y0, W\nMOVWF TXREG ; Transmit the low order byte of the result.\n\
    BTFSS TXSTA, TRMT\nGOTO $-1 ; Loop while waiting for TRMT to go high.\nRETURN\n\
    \nEND\n\nProgram 6-1 Adding Two Eight-Bit Positive Numbers\n\n## 6.2.2 • Serial\
    \ Read Program Command Line Arguments\n\nThe program *serial_read_x*, provided\
    \ to read data from your PIC has some command-line arguments that can be appended\
    \ to change the output, depending on what you are using the PIC for. There are\
    \ four modes:\n\n- In the first with no command-line argument, the output is simply\
    \ single unsigned byte values (0–255).\n- The second is when *-h* is used, the\
    \ output is a signed short integer value (-32768 to +32767) that is derived from\
    \ reading two consecutive bytes, the first one being the most significant known\
    \ as big-endian.\n- The third is when *-d* is used, the output is a signed integer\
    \ value for four bytes (-2147483648 to +2147483647).\n- The fourth is when *-f*\
    \ <scaling coefficient> is used, where each byte is multiplied by a real number\
    \ to be used to scale the output as we did previously with the potentiometer input\
    \ Program 4-3. Table 6-2 below should clarify these uses. Although the serial\
    \ reader program can interpret signed integers, we are initially outputting only\
    \ positive numbers from the additions. Also, there is the option *-o* *some_filename*\
    \ that will log all outputs to a file of your choosing. This can be done with\
    \ any of the modes.\n\n| Operating System | Program Command |\n| :--- | :--- |\n\
    | Microsoft Windows | *serial_reader.exe [options] [output file name]* |\n| 64\
    \ Bit Linux | *sudo ./serial_reader_64 [options] [output file name]* |\n| 32 Bit\
    \ Linux | *Sudo ./serial_reader_32 [options] [output file name]* |\n\n| Examples\
    \ below for Microsoft Windows | Command with options | Output Format |\n| :---\
    \ | :--- | :--- |\n| serial_reader.exe | This will output a value from 0 to 255\
    \ for each byte, one value on each line. |\n| serial_reader.exe -o file_name |\
    \ This will output a value from 0 to 255 for each byte, one value on each line\
    \ and also write the same to a file called file_name. |\n| serial_reader.exe -h\
    \ | This will output a value from -32768 to +32767 for pair of bytes, the first\
    \ byte being the most significant, one value on each line. |\n| serial_reader.exe\
    \ -h -o file_name | This will output a value from -32768 to +32767 for pair of\
