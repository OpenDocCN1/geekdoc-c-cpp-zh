    Figure 6-2 shows how to read the output from program 0601 on 64 bit Linux.\n\n\
    ## 6.2.3 • Adding Two Sixteen Bit Numbers\n\nJust using eight-bit numbers is to\
    \ a certain extent as the largest unsigned number is 255. If we move up to sixteen\
    \ bits, this gives a range from 0–65535 which is much more useful for practical\
    \ programs. This requires two bytes for each addend and three bytes for the sum\
    \ to handle the maximum result possible, adding two sixteen-bit numbers. Figure\
    \ 6-3 shows how to do this. The two 16-bit numbers being added are 65000 (253*256\
    \ + 232) and 50000 (195*256 + 80) giving a sum of 115000 (1*256*256 + 193*256\
    \ + 56) requiring three bytes. The highest sum for two 65535 inputs is 131070\
    \ (1*256*256 + 255*256 + 254). This number can also be accommodated by three bytes.\
    \ Program 6-2 carries this out. The comments explain what each line does. The\
    \ serial reader program reads a 16-bit integer with the command line *-h*. The\
    \ next longest type is the 32-bit (4 bytes) integer. The transmit subroutine in\
    \ the PIC will have to output 4 bytes. The highest-order byte will always be zero\
    \ when adding only two sixteen-bit addends.\n\nTable 6-2 Using The Serial Reader\
    \ Program\nFigure 6-2 Using Serial Reader\n\n;PROG_06_02.asm\nLIST P=16F1823\n\
