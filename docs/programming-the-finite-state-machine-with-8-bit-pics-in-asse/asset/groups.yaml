    \ the remainder as 32-bit integers, hence the use of -d option.\n\n![](img/a08bd00952da48f769971864f33af432_124_0.png)\n\
    Figure 6-11 Using Serial Reader\n\n## Chapter 7 Digital Voltmeter Project\n\n\
    ### 7.1 Introduction\n\nChapter 5 was a guide to constructing the hardware part\
    \ of the project. The circuit tested using Program 5-1. This chapter will develop\
    \ a program to use this circuit as a digital voltmeter. This is the most complicated\
    \ program so far. It involves sequencing of the display digits, analog measurement,\
    \ sleep mode to conserve battery life, and the binary arithmetic dealt with in\
    \ chapter 6.\n\nVoltage is read using a single-digit display which displays four\
    \ significant figures by flashing four figures for each reading in-turn. Each\
    \ figure will appear for 1/2 second with a blank space of 1/4 second between figures\
    \ and a blank space of 1 second before the next reading. This means a reading\
    \ of 7.25 volts will appear as ‘0’, ‘7’, ‘2’, ‘5’, following on with a one-second\
    \ delay before the next reading.\n\nThere are three state machines in the program:\n\
    - Sequence handler\n- The seven-segment display driver\n- Voltage reading and\
    \ digit value handler.\n\nThis project introduces the sleep mode that allows the\
    \ PIC to conserve battery charge when no voltage is sensed by the probes.\n\n\
    ### 7.2 The State Diagrams\n\nThe three machines are shown in figures Fig 7-1\
    \ and Fig 7-2. The machines are separate but share processor and memory space.\
    \ As this is a more complicated program, I will recap on how several machines\
    \ run together. Each machine is made up of several states. The machine will stay\
    \ in its current state until a condition is true that causes it to change to another\
    \ state. This condition can be an input of some sort such as an actual input on\
    \ a pin or a comparison of value with some constant or a logical combination of\
    \ these. If a machine remains in a particular state, it does not mean that the\
    \ code being executed is only the local lines for that state. After executing\
    \ local lines, the program goes to a block that uses BRW for the next machine\
    \ that has a turn to go to the relevant state for that machine. This way all the\
    \ machines take their current state. In the voltmeter program, the order the machines\
    \ take is M0, M2, M1 and back to M0. The reason for this order is because the\
    \ seven-segment driver goes to M0 next. Figure 7-1 gives an overview of how machine\
    \ rotation works. In this project, we have three state diagrams and program listings.\
    \ This program uses FLAGS as a set of booleans that are used as signals. Bit 0\
    \ is update signal, bit 1 is division complete signal used in binary arithmetic,\
    \ bit 2 is voltage available meaning that probe voltage measured is above mV,\
    \ and bit 3 is read. Although there are only two states in machine 2, they allow\
    \ the machine to idle in state 0 until a reading is required, thus reducing the\
    \ number of cycles used if the arithmetic and other logic ran wasn't needed.\n\
    \n![](img/a08bd00952da48f769971864f33af432_126_0.png)\nFigure 7-1 Voltmeter State\
    \ Diagram for M0\nFigure 7-2 Voltmeter State Diagram for M1 and M2\n\n;PROG_01.asm\n\
    LIST P=16F823\n#INCLUDE <16f823.inc>\n#INCLUDE <fsm_macros.inc>\nRADIX DEC ; Default\
    \ numbers are to base 10.\nCONFIGURATION ; See macro in fsm_macros.inc.\n\nCBLOCK\
    \ 0x70\nTICKS ; Used to count 8.2ms ticks.\nSTATE_M0\nSTATE_M1\nSTATE_M2\nY0 ;\
    \ Output variable for arithmetic.\nY1 ; Output variable for arithmetic.\nY2 ;\
    \ Output variable for arithmetic.\nXa0 ; Input variable for arithmetic.\nXa1 ;\
    \ Input variable for arithmetic.\nXa2 ; Input variable for arithmetic.\nVALUE\
    \ ; Is the value to be written to the display (0 is blank).\nFLAGS ; The FLAGS\
    \ bits are: 0 is display update, 1 is division complete, 2 is voltage available,\
    \ and 3 is reading required.\nLAPS ; Number of laps with a zero display.\nENDC\n\
    \nCBLOCK 0x20 ; Declare a block of variables - Bank 0 only.\nRESBUFFH ; The ADRESH:ADRESL\
    \ scaled to millivolts. High byte.\nRESBUFFL ; The ADRESH:ADRESL scaled to millivolts.\
    \ Low byte.\nXb0 ; Input variable for arithmetic.\nXb1 ; Input variable for arithmetic.\n\
    Xb2 ; Input variable for arithmetic.\nXc0 ; General purpose variable for arithmetic.\n\
    Xc1 ; General purpose variable for arithmetic.\nXc2 ; General purpose variable\
    \ for arithmetic.\nBUFFH ; Buffer used for arithmetic.\nBUFFM ; Buffer used for\
    \ arithmetic.\nBUFFL ; Buffer used for arithmetic.\nF10V ; Variable holding tens\
    \ of volts.\nF1V ; Variable holding units of volts.\nF100mV ; Variable holding\
    \ hundreds of millivolts.\nF10mV ; Variable holding tens of millivolts.\nFIG ;\
    \ To hold the current significant figure during extraction.\nENDC\n\nORG 0X00\n\
    GOTO START\n\nORG 0X04 ; Interrupt vector.\nBANKSEL IOCAF\nBTFSC IOCAF, 5 ; Test\
    \ the interrupt on change flag for RA5.\nGOTO $+4 ; At this line because IOCAF\
    \ is set. Now jump to clear IOCAF, 5.\nBCF INTCON, TMR0IF ; Clear the tmr0 overflow\
    \ interrupt flag.\nINCF TICKS, F ; Increment by one the 8.2ms ticks.\nRETIE ;\
    \ Return from interrupt.\nBCF IOCAF, 5 ; Jumped to here to clear IOCAF, 5.\nRETIE\
    \ ; Return from interrupt.\n\nSTART:\nMOVLB 1\nSET_TMR0_CASE1 ; Gives 8.2 ms ticks.\
    \ See fsm_macros.inc.\nBSF INTCON, IOCIE ; Interrupt on change enable.\nMOVLW\
    \ 0x24 ; 0x24 = b'00100100'.\nMOVWF TRISA ; Set PORTA RA2 and RA5 as an inputs\
    \ others as outputs.\nCLRF TRISC ; Set all PORTA as outputs .\nMOVLW 0x09 ; Select\
    \ channel AN2 and enable ADC.\nMOVWF ADCON0\nMOVLW 0xE3 ; See page 137, right\
    \ justified result, conversion clock Fosc/64,\n; Vref is from the internal referance\
    \ 4.096 V.\nMOVWF ADCON1\nSET_FREQ_32MHZ ; See file fsm_macros.inc.\nMOVLB 2\n\
    MOVLW 0x83 ; Configure the fixed voltage reference, enable and set to 4.096 V.\n\
    MOVWF FVRCON ; See Chapter 5 Table 5-3, and page 128 in the data sheet.\nMOVLB\
    \ 3\nCLRF TICKS ; Initialize count to zero.\nCLRF STATE_M0 ; Initialize state\
    \ to zero.\nCLRF STATE_M1 ; Initialize state to zero.\nCLRF STATE_M2 ; Initialize\
    \ state to zero.\n"
  mdcn: "\n\nCALL TX_THIRTY_TWO_BIT_NUMBER ; 调用子程序。传输余数。\nGOTO LOOP\n\n; 子程序。\n\n\
    DIV_24_BY_16_BIT ; Y = Xa/Xb,\n\nDIV_S0\nCLRF Y0 ; 将 Y 置为零。\nCLRF Y1\nCLRF Xc1\
    \ ; 将 Xc1 置为零。\nCLRF Xc0\nMOVF Xb1, F\nBTFSS STATUS, Z \nGOTO $+4 ; 因为 Xb1 不为\
    \ 0，跳转。\nMOVF Xb0, F ; 因为 Xb1 为 0。\nBTFSC STATUS, Z\nRETURN ; 因为 Xb0 为 0。且 Xb1\
    \ 也为 0。\nMOVF Xa2, W\nMOVWF BUFFH ; 将 Xa 的高位加载到 BUFFH。\nMOVF Xa1, W\nMOVWF BUFFM\
    \ ; 将 Xa 的中位加载到 BUFFM。\nMOVF Xa0, W\nMOVWF BUFFL ; 将 Xa 的低位加载到 BUFFL。\nBCF FLAGS,\
    \ 1 ; 确保除法结束位。\nDIV_S1\nBTFSC FLAGS, 1\nRETURN ; 因为除法已结束。\nMOVF BUFFH, W\nMOVWF\
    \ Xc2 ; Xc 将包含余数。\nMOVF BUFFM, W\nMOVWF Xc1 ; Xc 将包含余数。\nMOVF BUFFL, W\nMOVWF\
    \ Xc0 ; Xc 将包含余数。\nMOVF Xb0, W\nSUBWF BUFFL, F ; 从 BUFFL 中减去 Xb0。\nMOVF Xb1, W\n\
    SUBWF BUFFM, F ; 从 BUFFM 中减去 Xb1。\nCLRW\nSUBW BUFFH, F ; 如果有借位则减去借位。\nBTFSS STATUS,\
    \ C\nDIV_S2\nGOTO DIV_S1 ; 因为 BUFF 现在小于 Xb，这是最后一次循环，X 包含余数。\nINCF Y0, F ; 计数 BUFF\
    \ 减去 Xb 且得到正结果的次数。\nBTFSC STATUS, Z ; 如果 Y0 溢出回到 0，则 Y1 必须进位。\nINCF Y1, F\nGOTO\
    \ DIV_S1\nTX_THIRTY_TWO_BIT_NUMBER ; 有 4 个字节，因为串口读取器读取 1 或 4 字节，而我们需要 3 字节。\n\
    BANKSEL TXREG\nMOVF Y3, W ; 将最高位字节放入 W。\nMOVWF TXREG ; 使用 EUSART 传输 W。\nBTFSS\
    \ TXSTA, TR\nGOTO $-1\nMOVF Y2, W ; 将高中间字节放入 W。\nMOVWF TXREG ; 使用 EUSART 传输 W。\n\
    BTFSS TXSTA, TR\nGOTO $-1\nMOVF Y1, W ; 将低中间字节放入 W。\nMOVWF TXREG ; 使用 EUSART 传输\
    \ W。\nBTFSS TXSTA, TR\nGOTO $-1\nMOVF Y0, W ; 将最低位字节放入 W。\nMOVWF TXREG ; 使用 EUSART\
    \ 传输 W。\nBTFSS TXSTA, TR\nGOTO $-1\nRETURN\nEND\n\n程序 6-7 24 位数字除以 16 位数字\n\n\
    该程序将 16,777,215 除以 5,957。得到商 2816，余数为 2303。图 6-11 显示了程序的输出，首先输出商，然后以 32 位整数的形式输出余数，因此使用了\
    \ -d 选项。\n\n![](img/a08bd00952da48f769971864f33af432_124_0.png)\n图 6-11 使用串口读取器\n\
    \n## 第7章 数字电压表项目\n\n### 7.1 引言\n\n第 5 章是构建项目硬件部分的指南。使用程序 5-1 测试了电路。本章将开发一个程序，使该电路作为数字电压表。这是到为止最复杂的程序。它涉及显示数字的顺序控制、模拟测量、用于节省电池寿命的睡眠模式以及第\
    \ 6 章处理的二进制算术。\n\n电压通过单位显示器进行读取，通过轮流闪烁四个数字来显示四位有效数字。每个数字出现 1/2 秒，数字之间留 1/4 秒的空白，下次读取前留有\
    \ 1 秒的空白。这意味着 7.25 伏的读取值将显示为‘0’、‘7’、‘2’、‘5’，然后在下次读取之前延迟一秒。\n\n程序中有三个状态机：\n- 序列处理器\n\
    - 七段显示驱动器\n- 电压读取和数字值处理器。\n\n该项目引入了睡眠模式，当探头没有检测到电压时，允许 PIC 节省电量。\n\n### 7.2 状态图\n\
    \n三个机器分别在图 7-1 和图 7-2 中所示。这三个机器是独立的，但共享处理器和内存空间。由于这是一个更复杂的程序，我将总结一下几个机器是如何协同运行的。每个机器都由若干状态组成。机器将保持在当前状态，直到某个条件为真导致其切换到另一个状态。该条件可以是某种输入，例如引脚上的实际输入，或者值与常数的比较，或者是这些值的逻辑组合。\n\
    \n该项目引入了睡眠模式，当探头没有检测到电压时，允许 PIC 节省电量。\n\n"
