    \ has one byte.\n; The output Y has a high and low byte.\nCLRF Y1 ; Zero the high\
    \ order byte.\nMOVF Xa, W ; Move contents of Xa to W.\nADDWF Xb, W ; Add Xb to\
    \ W with result in W and the carry in STATUS C.\nMOVWF Y0 ; Put the low byte of\
    \ the result in Y0.\nCLRW ; Clear W, it needs to be 0 for the next line.\nADDWFC\
    \ Y1, F ; Add W, Y1 and C with result in Y1.\nRETURN\n\nTX_SIXTEEN_BIT_NUMBER\n\
    BANKSEL TXREG\nMOVF Y1, W ; Put the high order byte in W.\nMOVWF TXREG ; Transmit\
    \ W using the EUSART.\nBTFSS TXSTA, TRMT\nGOTO $-1 ; Loop while waiting for TRMT\
    \ to go high.\nMOVF Y0, W\nMOVWF TXREG ; Transmit the low order byte of the result.\n\
