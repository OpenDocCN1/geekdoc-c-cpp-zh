    \ is around 70 % larger. Part of this can be blamed on \n\nusing the free version\
    \ of the compiler. As the amount of program space taken by this is \n\nonly 37%,\
    \ it is a satisfactory result. For a larger project, you might have to use assembly\
    \ \n\nto get it in. \n\nThe program is shown below. Again the comments should\
    \ explain what the code does.\n\n**10.5.1 • Turning Bits On and Off Using Bit\
    \ Type**\n\nDealing with bits is a central part of this sort of programming. In\
    \ assembly the PIC has \n\nBSF and BCF instructions that allow you to turn one\
    \ bit on or off. Watch out for the read \n\nmodify write problem to do with outputs.\
    \ See Chapter 2 in connection with Program 2-3. \n\nIn program 9-6, the update\
    \ flag used a data type called a bool, however, a bool needs a \n\nbyte of space.\
    \ If you need several bools there is another way to do it. The XC8 compiler \n\
    \nhas a data type called a bit that is an integer 1 bit wide, it can have a value\
    \ of 0 or 1. XC8 \n\nwill pack eight of these into a byte, you don’t have to do\
    \ anything other than use them. \n\nOne point though regarding how you declare\
    \ them. Normally when variables are declared \n\nthey only have the scope of the\
    \ function they are declared in. When that function returns \n\nthe variables\
    \ cease to exist, these variables are referred to as automatic. However \n\nvariables\
    \ of the bit type can not be automatic variables. They have to be either static\
    \ \n\nor global. A static variable stays in existence. To declare a variable as\
    \ static you put the \n\nword static before the data type in the declaration.\n\
    \n//prog\\_10\\_04 Voltmeter in C\n\n#include <xc.h>\n\n// PIC16F1823 Configuration\
    \ Bit Settings\n\n// CONFIG1\n\n#pragma config FOSC = INTOSC\n\n#pragma config\
    \ WDTE = OFF\n\n#pragma config PWRTE = OFF\n\n#pragma config MCLRE = OFF\n\n#pragma\
    \ config CP = OFF\n\n#pragma config BOREN = OFF\n\n#pragma config IESO = OFF\n\
    \n#pragma config FCMEN = OFF\n\n// CONFIG2\n\n#pragma config LVP = ON\n\nchar\
    \ tick\\_counter = 0;\n\nvoid interrupt tick(void)\n\n{\n\n \n\nif (IOCAF5) //\
    \ Check to see if it's the interrupt on change.\n\n \n\n{\n\n \n\nIOCAF5 = 0;\
    \ \n\n// Reset the interrupt flag.\n\n \n\n}\n\n \n\nelse \n\n// As there only\
    \ two interrupts enabled it must be the\n\n \n\n{ \n\n// timer0 overflow.\n\n\
    \ TMR0IF = 0; \n\n// Reset the interrupt flag."
