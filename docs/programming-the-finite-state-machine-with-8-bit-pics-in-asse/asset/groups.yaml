    \ taken by this is 37%, it is a satisfactory result. For a larger project, you\
    \ might have to use assembly to get it in. The program is shown below. Again the\
    \ comments should explain what the code does.\n\n### 10.51 Turning Bits On Off\
    \ Using Bit Type\n\nDealing with bits is a central part of this sort of programming.\
    \ In assembly the PIC has BSF and BCF instructions that allow you to turn one\
