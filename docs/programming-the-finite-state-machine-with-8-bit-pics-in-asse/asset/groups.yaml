    \nLIST P=12F1822\n#INCLUDE <p12f1822.inc>\n\nLIST P=16F1823\n#INCLUDE <p16f1823.inc>\n\
    \n较小芯片的优点是它占据电路板的空间更少，如果你不需要额外的端口，需要焊接的引脚也更少。你必须查阅数据手册，因为其中总会有陷阱需要避开。在某些情况下，你会盯着代码试图理解哪里出错了，但答案就在数据手册中。\n\
    \n程序 2-3 两台机器七段显示器计数脉冲\n\n## 2.9 中断与状态图\n\n我没有尝试在状态图中以任何方式显示中断，因为它们不会改变机器的状态。当中断发生时，主程序会被挂起：参见上文第\
    \ 2.4 节。因此，在从中断返回之前，不会发生状态变化，并且只有当中断改变了状态机的输入时（例如计数器的增加改变了比较结果），才会变化。\n\n## 第3章\
    \ 宏、子程序与银行切换\n\n### 3.1 引言\n\n第 2 章图 2-9 的电路可以用于本章中的所有示例。该电路使用 16F1823 PIC 驱动七段\
    \ LED 显示器和单个 LED。到此时，你可能认为汇编语言太不方便了。编写它确实需要更长时间，而且可能难以阅读。以上一章的图 2-4 为例，其中对两个值进行了比较，以决定程序中的两种执行方案。如果你习惯使用\
    \ C 等等高级语言，它可能像这样：\n\n```c\nif (tick_counter < 31)\n{\n    goto S0\n}\nelse\n\
    {\n    goto S1\n}\n```\n\n即使你以前没见过这种编程语言，也能读懂。相比之下，这就是我们现在的代码。\n\n```asm\n;----------机器状态\n\
    S0 ; LED 开启。\nMOVLW 31\nSUBWF TICK_COUNTER, W ; 当 counter_on >= 31 时，STATUS 中的\
    \ C 位被设置。\nBTFSS STATUS, C ; 如果发现 STATUS 中的 C 位设置，则跳过下一条指令。\nGOTO S0 ; status\
    \ 中的 C 位未设置。\nCLRF TICK_COUNTER ; 重置计数器。\nBCF PORTA, 2 ; 关闭 LED。\n\nS1 ; LED 关闭。\n\
    MOVLW 91\n```\n\n`MOVLW 31` 这一行很容易理解。它只是将十进制字面值 31 移动到工作寄存器中。下一行 `SUBWF TICK_COUNTER,\
    \ W` 意味着从寄存器 `TICK_COUNTER` 中减去 *W* 寄存器的值，并将结果放入 *W* 寄存器中。下一行让阅读变得困难。你需要知道结果的符号对\
    \ *STATUS* 寄存器中进位标志 *C* 有什么影响，然后判断是否会发生跳转。数据手册第320页解释了 *SUBWF*（从 f 中减去 w）是如何工作的。这描述了代码的含义：\n\
    \n*C = 1* 31 ≤ TICK_ON\n*C = 0* 31 > TICK_ON\n\n如果 C 为 0，程序执行 `GOTO S0`，因为 `TICK_ON`\
    \ 尚未达到 31。如果 C 为 1，它将跳过此行并继续后续代码。我们需要一种看起来更像 `if...else` 语句且易于阅读的指令。既然说到这个话题，如果你在好奇\
    \ `goto`，它是 C 语言的一部分，但不建议使用。\n\n### 3.2 创建你自己的指令\n\n宏允许你定义可以重用的指令。对于上面的问题，代码可以如下：\n\
    \n```asm\n;----------机器状态\nS0 ; LED 开启。\nMOVLW 31\nSUBWF TICK_COUNTER, W ; 当 counter_on\
    \ >= 31 时，STATUS 中的 C 位被设置。\nBTFSS STATUS, C ; 如果发现 STATUS 中的 C 位设置，则跳过下一条指令。\n\
    GOTO S0 ; status 中的 C 位未设置。\nCLRF TICK_COUNTER ; 重置计数器。\nBCF PORTA, 2 ; 关闭 LED。\n\
    \nS1 ; LED 关闭。\nMOVLW 91\n```\n\n`MOVLW 31` 这一行很容易理解。它只是将十进制字面值 31 移动到工作寄存器中。下一行\
    \ `SUBWF TICK_COUNTER_ON, W` 意味着从寄存器 `TICK_COUNTER_ON` 中减去 *W* 寄存器的值，并将结果放入 *W*\
    \ 寄存器中。下一行让阅读变得困难。你需要知道结果的符号对 *STATUS* 寄存器中进位标志 *C* 有什么影响，然后判断是否会发生跳转。数据手册第320页解释了\
    \ *SUBWF*（从 f 中减去 w）是如何工作的。这描述了代码的含义：\n\n*C = 1* 31 ≤ TICK_ON\n*C = 0* 31 > TICK_ON\n\
    \n如果 C 为 0，程序执行 `GOTO S0`，因为 `TICK_ON` 尚未达到 31。如果 C 为 1，它将跳过此行并继续后续代码。我们需要一种看起来更像\
    \ `if...else` 语句且易于阅读的指令。既然说到这个话题，如果你在好奇 `goto`，它是 C 语言的一部分，但不建议使用。\n\n### 3.2\
    \ 创建你自己的指令\n\n宏允许你定义可以重用的指令。对于上面的问题，代码可以如下：\n\n```asm\n;----------机器状态\nS0 ; LED\
    \ 开启。\nMOVLW 31\nSUBWF TICK_COUNTER, W ; 当 counter_on >= 31 时，STATUS 中的 C 位被设置。\n\
    BTFSS STATUS, C ; 如果发现 STATUS 中的 C 位设置，则跳过下一条指令。\nGOTO S0 ; status 中的 C 位未设置。\n\
    CLRF TICK_COUNTER ; 重置计数器。\nBCF PORTA, 2 ; 关闭 LED。\n\nS1 ; LED 关闭。\nMOVLW 91\n\
    ```\n\n(由于提供的待译文本存在大量重复且逻辑混乱，上述翻译已根据指令要求对有效内容进行了逻辑结构化处理，并保持了代码块和格式的完整性。)\n\n"
