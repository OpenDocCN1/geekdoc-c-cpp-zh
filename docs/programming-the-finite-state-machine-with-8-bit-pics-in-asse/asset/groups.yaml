  - "[PAGE 36]\n\np\n\ny\n\ng\n\n● 37\n\n![](img/a08bd00952da48f769971864f33af432_36_0.png)\n\
    \nThe first code we need is to configure *INTCON*. All of the bits are 0 by default.\
    \ Bit 7 *GEI*, \n\nglobal interrupt enable has to be set. Bit 6 *PEIE* peripheral\
    \ interrupt enable and bit 5 *TMR0* \n\noverflow interrupt enable *TMR0IE* have\
    \ to be set. This gives a hexadecimal value of 0xE0.\n\n \n\nMOVLW 0xE0 ; See\
    \ Table 2-3 in the book.\n\n \n\nMOVWF INTCON ; See page 86. \n\nIf *TMR0* overflows,\
    \ the automatic events described above will happen and the program will \n\nbe\
    \ at 0x0004. We have to write the interrupt service routine to handle this.\n\n\
    We can cheat on this first simple example because there is only one interrupt\
    \ enabled. \n\nThere is no need to check to see what the interrupt is, so the\
    \ interrupt service routine is \n\nsimpler. What we are going to do is increment\
    \ the counter by one every time the interrupt \n\noccurs. This counter counts\
    \ the ticks. Here is the simplified ISR for this example. \n\nORG 0X04 ; Interrupt\
    \ vector.\n\nBCF INTCON, TMR0IF ; Clear TMR0 overflow interrupt flag, INTCON is\
    \ in all banks.\n\nINCF TICK\\_COUNTER, F ; Increment by one TICK\\_COUNTER, result\
    \ back in the file.\n\nRETFIE ; Return from interrupt.\n\nFigure 2-3 Program Flow\
    \ for an Interrupt (timer0)"
  - "[PAGE 37]\n\ng\n\ng\n\ny\n\n● 38\n\n**INTCON**\n\n*E*\n\n*7*\n\n*1*\n\n*Global\
    \ Interrupt Enable Bit*\n\n*6*\n\n*1*\n\n*Peripheral Interrupt Enable Bit*\n\n\
    *5*\n\n*1*\n\n*Timer0 Overflow Interrupt Enable Bit*\n\n*4*\n\n*0*\n\n*INT External\
    \ Interrupt Enable Bit*\n\n*0*\n\n*3*\n\n*0*\n\n*Interrupt on Change Enable Bit*\n\
    \n*2*\n\n*0*\n\n*Timer0 Overflow Interrupt Flag Bit*\n\n*1*\n\n*0*\n\n*INT External\
    \ Interrupt Flag Bit*\n\n*0*\n\n*0*\n\n*Interrupt-on-Change Interrupt Flag Bit*\n\
    \nThe *INTCON* register is available in all banks (page 22). This counter is in\
    \ the block of 16 \n\nmemory locations accessible for all banks, 0x070 – 0x07F\
    \ (page 21). We now have an \n\ninterrupt occurring every time *TMR0* overflows\
    \ from 255 back to 0, 122 times per second. \n\nThis is way too fast for our flashing\
    \ LED as it would appear to be on all the time, but dimmer. \n\nThis is where\
    \ the counter comes in. The code is going to have two states: one for LED on \n\
    \nand one for off. The counter *TICK\\_COUNTER* is going to be incremented by\
    \ the interrupt \n\ncode. The counter is going be checked to see if it is greater\
    \ than or equal to 31 whilst in the \n\non state. If it is, the state will be\
    \ changed. This means that the on-time will be 31/122 of \n\na second: approximately\
    \ 0.25s. When in the off state, the counter will be checked to see if \n\nit has\
    \ reached 91. This will give a delay of 91/122 of a second: approximately 0.75s.\
    \ Here \n\nare the lines of code for the on-state. The counter is reset as being\
    \ one of the outputs or \n\nactions during the transition.\n\nS0 ; LED on.\n\n\
    \ MOVLW 31\n\n SUBWF TICK\\_COUNTER, W ; C in STATUS is set when counter\\_on\
    \ >==31.\n\n BTFSS STATUS, C ; Skip next instruction if C in STATUS is found set\n\
    \n GOTO S0 ; C in status found not set.\n\n CLRF TICK\\_COUNTER ; Reset the counter.\n\
    \n BCF PORTA, 2 ; Turn the LED off.\n\n \n\nWith gpasm, the default number base\
    \ is hexadecimal. To express decimal numbers greater \n\nthen 9 such as ninety-one,\
    \ you have to put D’91’. I prefer to add the line ‘RADIX DEC’ to \n\nthe code\
    \ so that the base is now 10. Conventional notation for numbers can now be used.\
    \ \n\nFrom now on, numbers will be expressed as follows. \n\n11 Means eleven in\
    \ decimal.\n\n0x11 Means seventeen in hexadecimal.\n\nB’11’ Means three in binary.\n\
    \nConfusing number bases between decimal and hexadecimal is another particular\
    \ cause of \n\nbugs.\n\nTable 2-3 Example Bit Settings for INTCON Register"
  - "[PAGE 38]\n\np\n\ny\n\ng\n\n● 39\n\nThe *SUBWF* instruction can be a bit confusing\
    \ and needs to be carefully considered. The \n\nmeaning of the instruction is\
    \ to subtract what is in the working register *W* from what is in \n\nthe file.\
    \ The file can be any register. The value in *W* is subtracted from *COUNTER\\\
    _ON* and \n\nif the result is negative, the carry flag in *STATUS* set to 0. If\
    \ the result is zero or positive, \n\nthe carry flag is set to 1. The result will\
    \ be positive or zero if *COUNTER\\_ON* has reached or \n\nexceeded the value\
    \ in *W*, in this case, 31. Page 320 in the datasheet describes this. Figure \n\
    \n2-4 below shows this visually.\n\n![](img/a08bd00952da48f769971864f33af432_38_0.png)\n\
    \nThe code for the off block works in the same way but the timing is different\
    \ and the LED is \n\nturned on. Here is the complete program:\n\nFigure 2-4 Explanation\
    \ of SUBWF"
  - "[PAGE 39]\n\ng\n\ng\n\ny\n\n● 40\n\n; prog\\_02\\_01.asm\n\n; Page numbers refer\
    \ to the data sheet DS40001413E.\n\n; Tables refer to the book.\n\nLIST P=12f1822\n\
    \n#INCLUDE <p12f1822.inc>\n\n RADIX DEC ; Default numbers to base 10\n\n \\_\\\
    _CONFIG 0X8007, (\\_FOSC\\_INTOSC & \\_WDTE\\_OFF & \\_PWRTE\\_OFF & \\_CP\\_OFF\
    \ & \\_BOREN\\_OFF & \\_IESO\\_OFF & \\_FC-\n\nMEN\\_OFF)\n\n \\_\\_CONFIG 0X8008,\
    \ (\\_LVP\\_ON)\n\n CBLOCK 0x70\n\n TICK\\_COUNTER \n\n ENDC\n\n ORG 0X00\n\n\
    \ GOTO START\n\n ORG 0X04 ; Interrupt vector.\n\n BCF INTCON, TMR0IF ; Clear TMR0\
    \ overflow interrupt flag, INTCON is in all banks.\n\n INCF TICK\\_COUNTER, F\
    \ ; Increment by one TICK\\_COUNTER, result back in the file.\n\n RETFIE ; Return\
