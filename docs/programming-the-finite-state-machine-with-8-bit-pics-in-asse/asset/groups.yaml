    \ bank 1\n\n为了节省书中空间，定义一个设置配置字中位位的宏：\n\nBOOK\\_CONFIGURATION 宏\n    __CONFIG 0X8007,\
    \ (_FOSC\\_INTOSC & _WDTE\\_OFF & _PWRTE\\_OFF & _CP\\_OFF & _BOREN\\_OFF & _IESO\\\
    _OFF & _FCMEN\\_OFF)\n    __CONFIG 0X8008, (_LVP\\_ON)\nENDM\n\n这是另一个 if ...else\
