    图 2-6 显示了 LED 两电压的示波器波形。


    ![](img/a08bd00952da48f769971864f33af432_41_0.png)


    程序所示。通过参考状态图，你应该能够理解正在发生什么。这里有一个新点需要解释：`$` 符号的使用。它表示当前行的地址，因此我们不是跳转到标签，而是可以跳转若干行。例如，编写
    `GOTO $+3` 将向前跳转 3 行。


    ; prog_02_02.asm


    ; 页码参考数据数据表 DS40001413E。


    ; 表格参考书籍。


    LIST P=12f1822


    #INCLUDE <p12f1822.inc>


    RADIX DEC ; 默认数字为 10 进制。


    __CONFIG 0X8007, (_FOSC_INTOSC & _WDTE_OFF & _PWRTE_OFF & _CP_OFF & _IESO_OFF
    & _IESO_OFF & _FCMEN_OFF)


    __CONFIG 0X8008, (_LVP_ON)


    CBLOCK 0x70 ; 在通用 RAM 中，所有 bank均可访问。


    TICK_COUNTER


    PULSE_COUNTER


    ENDC


    ORG 0X00


    GOTO START


    ORG 0X04 ; 中断向量。


    BCF INTCON, TMR0IF ; 清除 tmr0 溢出标志位。INTCON 在所有 bank 中。


    INCF TICK_COUNTER, F ; 计数器加一。


    RETFIE ; 从中断返回


    START


    MOVLB 1 ; 为了访问 TRISA, OSCCON, OPTION_REG。


    BCF TRISA, 2 ; 将 PORTA 位 2（芯片引脚 5）配置为输出


    MOVLW 0x70


    MOVWF OSCCON ; 第 65 页，32MHz。见书籍中的表 2-1。


    MOVLW 0xD7


    MOVWF OPTION_REG ; 数据表中的第 164 页和书籍中的表 2-2。


    MOVLW 0xE0


    MOVWF INTCON ; 数据表中的第 86 页和书籍中的表 2-3。


    MOVLB 0 ; 程序其余部分用于访问 PORTA。


    Figure 2-6 周期循环的示波器波形


    BSF PORTA, 2 ; 初始化 LED 打开；


    ;-----------机器状态。


    S0 ; LED 开启。快速循环。


    MOVLW 3


    SUBWF TICK_COUNTER, W ; 当 TICK_COUNTER >= 3 时，STATUS 中的 C 位置位。


    BTFSS STATUS, C ; 如果发现 STATUS 中的 C 位置位，则跳过下一条指令。


    GOTO S0 ; STATUS 中的 C 位未置位。保持在此状态。


    BCF PORTA, 2 ; 关闭 LED


    CLRF TICK_COUNTER ; 重置滴计数器。


    INCF PULSE_COUNTER, F ; PULSE_COUNTER 加 1 结果存入 PULSE_COUNTER。


    ; 继续到 S1


    S1 ; LED 关闭。快速循环。


    MOVLW 10


    SUBWF PULSE_COUNTER, W ; 当 PULSE_COUNTER >= 10 时，STATUS 中的 C 位置位。


    BTFSS STATUS, C ; 如果发现 STATUS 中的 C 位置位，则跳过下一条指令。


    GOTO $+3 ; 未达到 10 个脉冲，跳转到滴答检查。


    CLRF PULSE_COUNTER ; 已计数 10 个脉冲，重置 PULSE_COUNTER。


    GOTO S3 ; 到 S3。


    MOVLW 9 ; 为 W 载入 9 用于滴答检查。


    SUBWF TICK_COUNTER, W ; 当 TICK_COUNTER >= 9 时，STATUS 中的 C 位置位。


    BTFSS STATUS, C ; 如果发现 STATUS 中的 C 位置位，则跳过下一条指令。


    GOTO S1 ; STATUS 中的 C 位置位，已计数 9 次滴答。


    CLRF TICK_COUNTER


    BSF PORTA, 2 ; 打开 LED。


    GOTO S0


    S2


    MOVLW 31


    SUBWF TICK_COUNTER, W ; 当 TICK_COUNTER >= 31 时，STATUS 中的 C 位置位。


    BTFSS STATUS, C ; 如果发现 STATUS 中的 C 位置位，则跳过下一条指令。


    GOTO S2 ; STATUS 中的 C 位未置位。


    BCF PORTA, 2 ; 关闭 LED


    CLRF TICK_COUNTER ; 重置滴计数器。


    INCF PULSE_COUNTER, F ; PULSE_COUNTER 加 1 结果存入 PULSE_COUNTER。


    ; 继续到 S3


    S3 ; LED 打开。慢循环。


    MOVLW 3


    SUBWF PULSE_COUNTER, W ; 当 PULSE_COUNTER >= 3 时，STATUS 中的 C 位置位。


    BTFSS STATUS, C ; 如果发现 STATUS 中的 C 位置位，则跳过下一条指令。


    GOTO $+3 ; 未达到 3 个脉冲，跳转到滴答检查。


    CLRF PULSE_COUNTER ; 重置 PULSE_COUNTER。


    GOTO S1 ; 到 S1。


    MOVLW 91


    SUBWF TICK_COUNTER, W ; 当 TICK_COUNTER >= 91 时，STATUS 中的 C 位置位。


    BTFSS STATUS, C ; 如果发现 STATUS 中的 C 位置位，则跳过下一条指令。


    GOTO S3 ; STATUS 中的 C 位置位。


    CLRF TICK_COUNTER


    BSF PORTA, 2 ; 打开 LED。


    GOTO S2


    END


    ## 2.6 • 在程序中运行多个机器


    到目前的 FSM 程序每个状态都有一小段代码，并反复运行，直到某些输入事件跳转到另一个状态。现在我将提出一种在程序中同时运行多个机器的方法：这就像通过执行一个任务的一部分、另一个任务的一部分、然后回到第一个任务来完成两件事。这就是时间复用，微控制器的
    CPU 每次只能执行一条指令，因此为了共同执行任务，它们必须共享处理器的时间。与定时器等 PIC 的其他可以真正并行运行的独立硬件部分不同，如果程序中存在多个任务，它们看起来像是在并行运行。它们以线程的形式运行，每个线程共享处理器的时间。


    循环之间的程序流


