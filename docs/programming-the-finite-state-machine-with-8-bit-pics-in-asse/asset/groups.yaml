    \ from each line \n\nof code. Page 308 onwards describes all the detail you need\
    \ to manually assemble the \n\ninstructions. You would however, then have to format\
    \ the Intel hex file. I will revisit the \n\ntopic of bank selection in Chapter\
    \ 3. In assembly programming, the term ‘move from one \n\nlocation to another’\
    \ means to copy the value to a destination. It does not delete the value \n\n\
    from the source location. \n\n**1.3.7 • An Assembly Program Snippet **\n\nFrom\
    \ an electronic point of view, a microcontroller is a programmable integrated\
    \ circuit or \n\nchip. It has several electrical connections or pins that can\
    \ be used as inputs or outputs. The \n\nPIC can be programmed to perform many\
    \ different functions. To get an idea, I will describe \n\npart of a program to\
    \ make a 12F1822 into an AND gate. This is a trivial use of a PIC and \n\nonly\
    \ part of the code will be shown to demonstrate what you can expect when assembly\
    \ \n\nTable 1-2 Bit Clear File (BCF) Instruction"
- md: "\nWhen you write a program for a computer, there is an operating system such\
    \ as Windows, Linux, BSD or macOS that deals with hardware interfacing by way\
    \ of a kernel. The PIC has no operating system. You have to deal with the details\
    \ of hardware such as configuring inputs and outputs, oscillator frequency or\
    \ perhaps configuration of the serial port (if you want to communicate with a\
    \ PC). Figure 1-14 shows how the PIC would appear if programmed to be an AND gate.\
    \ You might want to argue that what I have drawn is a ‘NOT OR’ gate. As the switches\
    \ pull the inputs down to 0V when they are closed, from the point of view of the\
    \ voltages on the inputs, they all have to be high for the output to go high.\
    \ Therefore, it is an AND gate. Each input has an internal high-value resistor\
    \ that pulls it up to 5V when the pin is open circuit. This is called a weak pull-up\
    \ and is configured in the code. This saves on external components as all that\
    \ is needed is a switch to pull the voltage on the pin-down. Something that I\
    \ should mention is that the programming method used by my programs, *program_writer*,\
    \ and *program_reader* use low voltage programming with the FTDI lead as opposed\
    \ to high voltage programming that would require pin 5 *MCLR/Vpp/* *RA3* to have\
    \ between 8 and 9V applied to it to enter the programming mode. Low voltage programming\
    \ can be performed with just a 5V supply and special train of bits applied to\
    \ the *ICPDAT* pin to enter programming mode. The downside of this is pin 4 can\
    \ only be used as *MCLR* (not master clear reset). This means that 0V applied\
    \ to this pin resets the PIC. Pin 4 must therefore always have 5V applied to it.\
    \ The weak pull-up does this. It is enabled by default in low voltage programming\
    \ mode. This means we have lost the use of *RA3* as an input pin. It is never\
    \ an output anyway. Don’t concern yourself with all this detail about programming\
    \ methods for now. If you want more information about the details of this then\
    \ Figure 1-14 PIC 12F1822 as an AND gate take a look at page 1, note 2 of the\
    \ datasheet on in circuit *DS41390C* programming. This datasheet explains everything\
    \ about the in circuit programming of these PICs. One last point: the line drawn\
    \ over *MCLR* means *‘NOT MCLR’*. If the voltage is 5V, it is not resetting the\
    \ PIC. It resets on 0V.\n\nNow for a look at some assembly language code. The\
    \ code once written to the PIC is a list of machine instructions. Generally, one\
    \ instruction is executed for every four clock cycles. Clock cycles are produced\
    \ by the oscillator. Everything in this book will use the internal oscillator.\
    \ No external components are required for the oscillator. Each instruction is\
    \ located at a memory address in the flash memory of the PIC. As the program runs,\
    \ the current instruction is pointed to by the program counter. This counter increments\
    \ by one as each instruction is executed. Some of the instructions can cause the\
    \ program counter to jump forwards or backward. These jumps can be decided on\
    \ by the outcome of logical or mathematical operations. If you have programmed\
    \ in another language such as C/C++, Java, Python, etc, you will be familiar with\
    \ the *if...else* statement used frequently to execute one piece of code or another\
    \ based on whether an expression is true or false. Consider this example in pseudo-code.\n\
    \n```\nif bit Z in the STATUS register is high then\n    turn the output on; \n\
    else\n    turn the output off;\nend_if;\n```\n\nFigure 1-15 shows how to implement\
    \ this in PIC assembly language. Before the code that is shown here, a subtraction\
    \ calculation is carried out. If the result is zero, bit *Z* in *STATUS* will\
    \ be set on. *BTFSS* (bit test skip on set) tests a bit in a file. If the bit\
    \ is high, the next instruction will be skipped. If low, the next instruction\
    \ will be executed. In typing your assembly program, the opcode mnemonics are\
    \ indented. The words on the extreme left are labels that you invent to mark places\
    \ in the code. These labels can be used as the destination for *GOTO* opcode.\n\
    \n*PORTA* is the register holding the state of the pins for port A. In this example\
    \ bit 5 was configured as an output. Therefore, writing to bit 5 sets the electrical\
    \ state of the pin. The *BTFSS STATUS, Z* decides whether to skip the next instruction.\
    \ If *Z* is high, the program jumps to the line *BSF PORTA, 5* (bit set file)\
    \ and turns on bit 5 in *PORTA*. If *Z* is low the next instruction *GOTO ELSE*\
    \ is executed. The program then jumps to *BCF PORTA, 5* (bit clear file) turning\
    \ off bit 5.\n\n## 1.4 • Program Memory\n\nThe program is held in flash memory.\
    \ Each location is 14 bits wide and holds a machine instruction. The next instruction\
    \ to be executed is held in the program counter that is 15 bits wide making it\
    \ capable of addressing 32k locations. The 12F1822 and 16F1823 PICS have only\
    \ 2048 locations implemented.\n\nThe rate at which instructions are executed is\
    \ determined by oscillator frequency. It takes four clock cycles for every instruction\
    \ cycle. Program memory is divided up into pages that are 2048 locations long.\
    \ The program counter PC that points to the current location in the program is\
    \ 15 bits wide. It can point to a range of 0 to 32767 or 32568 locations. The\
    \ PC is loaded from two registers: *PCL* and *PCLATH*. This occurs under five\
    \ circumstances that are described on page 38 of the datasheet. PCL is one of\
    \ the special function registers and appears in all banks. It provides the lower\
    \ 8 bits of *PC, PCL* (standing for Program Counter Lower). *PCLATH* (standing\
    \ for Program Counter Latch Higher) provides the higher 7 bits. If you are using\
    \ a PIC that has more than 2048 program memory locations, you have to be aware\
    \ that your program will cross page boundaries. Fortunately, we don’t have to\
    \ worry about this with these two PICs as all of our program will be on page 0.\
    \ This can be seen in the diagram on page 18 of the datasheet.\n\n## 1.5 • Hello\
    \ World\n\nHere is the obligatory ‘Hello World’ program which flashes an LED.\
    \ It is the same as the state machine described in the introduction to the chapter\
    \ except that in state 1 the LED is off instead of on, and the timer is a counter\
    \ that rolling over from 255 to 0.\n\n```asm\n; 01.asm Hello World\nLIST P=12f1822\n\
    #INCLUDE <12f1822.inc>\n\n__CONFIG 0x7007, FOSC=INTOS, WDTE=OFF, PWRTE=OFF, CP=OFF,\
    \ BREN=OFF, IESO=OFF, LVP=ON\n\nCBLOCK 0x70\nCOUNTER\nENDC\n\nORG 0x00\nMOVLW\
    \ 0x00\nMOVWF TRISA\nMOVLW 0x10\nMOVWF OSCCON\n\nSTATE_0\nDECFSZ COUNTER, F\n\
    GOTO ELSE\nBSF PORTA, 5\nGOTO STATE_0\nELSE:\nBCF PORTA, 5\nGOTO STATE_0\nEND\n\
    ```\n\n### 1.5.1 • Some Key Points\n\n- On any line where there is a semi-colon,\
    \ the rest of the line is a comment and is ignored by the assembler.\n- The second\
    \ line has the word LIST followed by p=12f1822, this tells the assembler program\
    \ what type of processor is being used.\n- The #include <12f1822> line tells the\
    \ assembler to read this file. The file is one of the header files containing\
    \ numerical definitions of abbreviations used in the assembly code. If you want\
    \ to read this file, it is in the */usr/share/gputils/headers/* if you are using\
    \ Linux, and *C:\\Program Files(x86)\\gputils\\header*\\* if you are using Windows.\
    \ It can be read with a text editor. Don’t alter it!\n- The lines beginning with\
    \ __CONFIG are extremely important. They set the bits in the two memory locations\
    \ known as configuration words. For the PICs, they are at addresses 0x8007 and\
    \ 0x8008 in flash.\n"
  mdcn: "\n\n当你为计算机编写程序时，有一个像 Windows、Linux、BSD 或 macOS 这样的操作系统，通过内核来处理硬件接口。PIC 没有操作系统。你必须处理硬件细节，例如配置输入和输出、振荡器频率，或者串口配置（如果你想与\
    \ PC 通信）。图 1-14 显示了如果将 PIC 编程为一个与门，它会是什么样的。你可能会争辩说我画的是一个“非或门”（NOT OR）。由于开关在关闭时会将输入拉低到\
    \ 0V，从输入电压的角度来看，为了输出高电平，所有输入都必须为高电平。因此，它是一个与门。每个输入都有一个内部高阻电阻，当引脚开路时，它会将其拉高到 5V。这被称为弱上拉，并在代码中配置。这节省了外部组件，因为只需要一个开关将引脚上的电压拉低即可。我应该提到的是，我的程序所使用的编程方法\
    \ *program_writer* 和 *program_reader* 使用带有 FTDI 线缆的低电压编程，而不是高电压编程；高电压编程需要对引脚 5\
    \ *MCLR/Vpp/* *RA3* 加上 8V 到 9V 的电压以进入编程模式。低电压编程仅需 5V 电源和应用于 *ICPDAT* 引脚的特殊位序列即可进入编程模式。这种方法的缺点是引脚\
    \ 4 只能用作 *MCLR*（而不是主清除复位）。这意味着应用于此引脚的 0V 会重置 PIC。因此，引脚 4 必须始终加上 5V 电压。弱上拉就实现了这一点。它在低电压编程模式下默认启用。这意味着我们失去了将\
    \ *RA3* 作为输入引脚的使用。反正它从不是输出引脚。现在不要担心这些所有关于编程方法的细节。如果你想获得更多关于这些细节的信息，请查看图 1-14“作为与门的\
    \ PIC 12F1822”，并参阅数据表中第 1 页关于在系统 *DS41390C* 编程的第 2 条注释。该数据表解释了关于这些 PIC 在系统编程的所有信息。最后一点：画在\
    \ *MCLR* 上方的横线表示 *‘非 MCLR’*。如果电压是 5V，它就不会重置 PIC。它在 0V 时重位。\n\n现在来看一些汇编语言代码。一旦写入\
    \ PIC 的代码是一系列机器指令。通常，每四个时钟周期执行一条指令。时钟周期由振荡器产生。此书中的所有内容都将使用内部振荡器。振荡器不需要外部组件。每条指令都位于\
    \ PIC 闪存内存中的一个内存地址。随着程序的运行，程序计数器指向当前指令。每执行一条指令，该计数器就会加 1。某些指令可以导致程序计数器向前或向后跳转。这些跳转可以通过逻辑或数学操作的结果来决定。如果你用过\
    \ C/C++、Java、Python 等其他语言编程，你将熟悉常用的 *if...else* 语句，它经常根据表达式的真假来执行某一段代码或另一段代码。考虑这个伪代码示例。\n\
    \n```\nif STATUS 寄存器中的 Z 位为高则\n    开启输出； \nelse\n    关闭输出；\nend_if;\n```\n\n图\
    \ 1-15 显示了如何在 PIC 汇编语言中实现这一点。在在此显示的代码之前，会执行一个减法计算。如果结果为零，*STATUS* 中的 *Z* 位将被设置。*BTFSS*（位测试跳过设置）测试文件中的一个位。如果该位为高，将跳过下一条指令。如果为低，将执行下一条指令。在编写你的汇编程序时，操作码助符是缩进的。最左侧的单词是你发明的标签，用于标记代码中的位置。这些标签可以作为\
    \ *GOTO* 操作码的目标。\n\n*PORTA* 是持有端口 A 引脚状态的寄存器。在这个示例中，位 5 被配置为输出。因此，写入位 5 会设置引脚的电学状态。*BTFSS\
    \ STATUS, Z* 决定是否跳过下一条指令。如果 *Z* 为高，程序将跳转到行 *BSF PORTA, 5*（位设置）并开启 *PORTA* 中的位\
    \ 5。如果 *Z* 为低，则执行下一条指令 *GOTO ELSE*。程序随后跳转到 *BCF PORTA, 5*（位清除），从而关闭位 5。\n\n##\
    \ 1.4 • 程序内存\n\n程序存储在闪存内存中。每个位置宽度为 14 位，存储一条机器指令。要执行的下一条指令存在宽度为 15 位的程序计数器，使其能够寻址\
    \ 32k 个位置。12F1822 和 16F1823 PIC 实现了 2048 个位置。\n\n指令的执行速率取决于振荡器频率。每个指令周期需要四个时钟周期。程序内存被分为长度为\
    \ 2048 个位置的页。指向程序中当前位置的程序计数器 PC 宽度为 15 位。它可以指向 0 到 32767 或 32568 个位置的范围。PC 从两个寄存器加载：*PCL*\
    \ 和 *PCLATH*。这发生在数据表第 38 页描述的五种情况之一。PCL 是特殊功能寄存器并出现在所有银行中。它提供了 PC 的低 8 位（程序计数器低位）。*PCLATH*（程序计数器高位）提供高\
    \ 7 位。如果你使用超过 2048 个内存位置的 PIC，必须意识到你的程序将跨越页边界。幸运的是，对于这两个 PIC，我们不必担心这个问题，因为我们的程序都在页\
    \ 0 上。这可以在数据表的第 18 页看到。\n\n## 1.5 • Hello World\n\n这是一个闪烁 LED 的强制“Hello World”程序。它与引言描述的状态相同，只是状态\
    \ 1 中 LED 是关闭的，定时器是一个从 255 翻转到 0 的计数器。\n\n```asm\n; 01.asm Hello World\nLIST P=12f1822\n\
    #INCLUDE <12f122.inc>\n\n__CONFIG 0x7007, FOSC=INTOS, WDTE=OFF, PWRTE=OFF, CP=OFF,\
    \ BREN=OFF, IESO=OFF, LVP=ON\n\nCBLOCK 0x70\nCOUNTER\nENDC\n\nORG 0x00\nMOVLW\
    \ 0x00\nMOVWF TRISA\nMOVLW 0x10\nMOVWF OSCCON\n\nSTATE_0\nDECFSZ COUNTER, F\n\
    GOTO ELSE\nBSF PORTA, 5\nGOTO STATE_0\nELSE:\nBCF PORTA, 5\nGOTO STATE_0\nEND\n\
    ```\n\n### 1.5.1 • 关键点\n\n- 在任何带有分号的行上，分号之后都是注释，汇编器会忽略它们。\n- 第二行有单词 LIST，后面跟着\
    \ p=12f1822，这告诉汇编程序正在使用什么类型的处理器。\n- #include <12f1822> 行告诉汇编器读取此文件。该文件是包含汇编代码中所用缩写数值定义的头文件。如果你想读取此文件，在\
    \ Linux 上它位于 */usr/share/gputils/headers/*，在 Windows 上它位于 *C:\\Program Files(x86)\\\
    gputils\\header*\\*。可以使用文本编辑器读取。不要修改它！\n- 以 __CONFIG 开头的行至关重要。它们设置了两个配置字内存位置中的位。对于\
    \ PIC 来说，它们位于闪存中地址 0x8007 和 0x8008。\n\n"
