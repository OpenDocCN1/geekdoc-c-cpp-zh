    ## 7.4 • 提取显示数字


    每个数字都通过调用 EXTRACT_FIG 子程序获得。该程序被调用四次：每次一个数字。假设电压为 12345 mV 或 12.345 V。我们希望显示首先显示
    1，然后是 2，最后是 4。由于我们只解析到毫伏，5 将被丢弃。值 12345 保存在 RESBUFF 中，每当调用 EXTRACT_FIG 程序时，它会将
    RESBUFF 除以除数 Xb。整数除法的结果放在 FIG 中供下次使用。


    所以从除以 10000 开始，RESBUFF(12345)/10000 得到结果 1，余数 2345 进入 FIG。1 是十伏，放在 F10V 中。


    下次调用，RESBUFF(2345)/100 得到结果 2，余数 345 进入 FIG。2 是伏，放在 F1V 中。


    下次调用，RESBUFF(345)/100 得到结果 3，余数 45 进入 FIG。3 是百毫伏，放在 F100mv 中。


    最后，在最后一次调用中，RESBUFF(45)/10 得到结果 4，余数 5 进入 FIG。4 是十毫伏，放在 F10mv 中。


    ## 7.5 • 检测电压


    无电压或小于 1 mV 检测是通过比较 ADRESH:ADRESL 中的值实现的。这两个寄存器持有 10 位结果，右对齐，因此八个最低位在 ADRESL 中，两个最高位在
    ADRESH 中。首先检查 ADRESH 是否为零。然后检查 ADRESL 是否小于 5。值 5 表示 PIC 引脚处的 0 mV，或探头处的 1 mV。


    ## 7.6 • 重新校准


    可以使用不同的分压器并重新计算缩放来调整电压范围。注意你正在处理的电压。如果你熟悉电学知识，甚至可以通过连接采样电阻将其转换为电流表。


    ## 第 8 章 故障排除与规划


    ## 8.1 • 引言


    如果你一直在尝试程序或尝试从零开始编写，你可能会遇到奇怪的 Bug 或完全无法运行的程序。汇语言程序可能是不友好的。汇编器会警告你语法错误或跳转到未识别的标签。它不会帮助解决代码的功能问题。本章将尝试在代码无法工作时帮助你调试，或者更好，防止你犯错。如果在编码时出错，请不要气馁。我很少有代码是第一次就能运行的。产生可靠代码的一种方法是保持它。本章涵盖了修复
    Bug 和避免 Bug 的程序规划。本章中的大多数建议适用于通用编程。如果你使用 C、Python、Java 或编写工业编程逻辑控制器 (PLC)，情况也是一样。


    ## 8.2 • 项目概述


    你需要对项目将做什么有一个清晰的想法。仅仅让它增长可能会导致你必须重新开始。如果你查看图 7-1 和图 7-2（电压表的状态图），你就得到了整个程序的表示。三个独立的状态机并发运行，每个状态负责一个有限范围的活动。你可以看到程序在做什么，而无需陷入局部。


