    ### 1.3.5 PIC Architecture


    Inside the PIC is a central processing unit connected to a set of peripheral devices,
    memory

    and inputs and outputs. Refer to pages 9 and 16 of the datasheet. You get a lot
    for your

    money! Throughout the book and in comments to the source code files, I will refer
    to pages

    to supplement information. These are the pages in the Microchip DS4001413E datasheet

    unless stated otherwise.


    There are three areas of memory:


    - Program Memory: Non-volatile: it retains information when the power is off.
    It is flash memory. This is where your program (the hex file) is loaded to.

    - Data Memory: Volatile: it does not retain information when the power is off.
    It is a random access memory (RAM), made up of banks of eight-bit registers also
    referred to as files in this context.

    - Electrically Erasable Programmable Read-Only Memory (EEPROM): Non-volatile:
    this can be used to store data when the power is off.


    This is called the Harvard architecture where the program and the data are in
    separate

    memory areas.


    ### 1.3.6 Data Memory Organization


    Data memory is made up of 32 banks. Each bank has 128 locations although not every

    location is implemented. Each location is one byte or eight bits wide. Some of
    the implemented

    memory can be used to store variables. Other locations are registers that have
    predefined

    use and are called special function registers. Pages 22 to 25 of the datasheet
    shows a map of

    data memory. Of these special registers, 12 are core registers. These are repeated
    in

    every bank in the first 12 locations. I’ll start by mentioning only three of these
    registers:


    - W (Working Register): temporary storage used by logic and arithmetic operations.

    - STATUS: A register containing the status of the arithmetic, logic unit of the
    CPU and reset status.

    - BSR (Bank Select Register): This register is used to select the bank you are
    accessing.


