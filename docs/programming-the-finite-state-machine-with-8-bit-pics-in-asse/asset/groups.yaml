    Table 4-6 ADCON1


    ## 4.4.2 Circuit and State Diagram


    A straightforward way of presenting a variable voltage to the analog input is
    to use a potentiometer. The value is not critical: a linear 1KΩ will be fine.
    As we are using supply voltage VDD as the reference, the result should sweep from
    0-255 (looking at most significant bits in the result) as the potentiometer sweeps
    from 0V to Vdd.


    The state diagram is trivial and only has two states. The machine constantly transitions
    between a state of waiting for the a/d conversion and waiting for serial transmission.
    The comments in the source code explain the code’s operation.


    Figure 4-5 Circuit for Program 4-3

    Figure 4-6 State Chart for Program 4-3


    ; prog_04_03.asm

    ; Page numbers refer to the data sheet.

    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm_macros.inc>

    RADIX DEC ; Default numbers are to base 10.


    BOOK_CONFIGURATION

    ORG 0x00

    GOTO START

    ORG 0x08

    START:

    MOVLB 1 ; Macros require bank 1, TRISA in bank 1.

    SET_FREQ_32MHZ ; See the file fsm_macros.inc.

    BSF TRISA, 4 ; RA4 (AN3) as input. See text in the book RA4 is AN3!

    MOVLW 0x0D ; Select channel AN3 and enable ADC.

    MOVWF ADCON0 ; See table 4-5 in the book.

    MOVLW 0x60 ; See page 137, left-justified result, conversion clock Fosc/64, Vref
    is Vdd the PIC supply voltage.

    MOVWF ADCON1 ; See table 4-5 in the book.

    MOVLB 3

    SET_SERIAL_TX_161823 ; see file fsm_macros.inc.

    S0

    BANKSEL ADCON0 ; Bank 1

    BSF ADCON0, 1 ; Start a to d conversion

    BTFSC ADCON0, 1 ; This and the next line loop around until the conversion is finished.

    GOTO $-1

    S1

    MOVF ADRESH, W ; The most 8 significant bits are in ADRESH (left justification).

    BANKSEL TXREG ; Bank 3

    MOVWF TXREG ; Loading TXREG starts the transmission.

    BTFSS TXSTA, TRMT ; When the transmission has completed TRMT gets set, until then
    this line and the next loop around.

    GOTO $-1

    GOTO S0

    END


    The serial_reader program provided in the working directory can accept a scaling
    coefficient as a command-line argument. If the input voltage is 4.99 V for the
    full-scale reading of 255, a scaling coefficient of 0.01957 will give the output
    to the screen in volts: see Fig 4-7 below. This is one of the command-line options
    that can be used. By adding -f followed by a scaling coefficient, the output from
    the program is changed from raw byte values to raw byte values and a scaled floating-point
    value. You can also add the -o file_name option to the command line to capture
    the results. Be aware that this program will create a 500k byte file in 10 seconds
    with approximately 20000 samples.


    Program 4-3 Read and Transmit an Analog Value

    '
  mdcn: '

    MOVLB 0 ; 选择 PIR1 的存储器器，参见第 89 页。

    BTFSS PIR1, RCIF ; 测试接收中断标志，如果置位，则跳转到接收例程。

    RETFIE ; 如果无适用条件，则退出中断程序。


    INT_RECEIVE

    MOVLB 3 ; 选择 RCREG 的存储器器，接收到的字节可以在

    ; 与 RCSTA 相同的存储器区中恢复。

    BTFSC RCSTA, FERR ; 测试是否存在帧错误，停止位为 0 表示帧错误，

    ; 参见第 278 页。

    GOTO ABORT_READ ; 检测到帧错误，因此值不可靠，跳转到

    ; ABORT_READ。

    MOVF RCREG, W ; 将值从 RCREG 移动到工作寄存器。

    MOVWF PERIOD ; 将 RCREG 的接收字节值移动到 PERIOD 文件。

    BTFSS RCSTA, OERR ; 检查溢出错误，如果是则跳转到禁用/启用

    ; 连续读取以重置错误标志。

    RETFIE ; 如果没有溢出错误，从中断返回。

    BCF RCSTA, CREN ; 禁用连续读取 (CREN)，参见第 278 页和第

    ; 274 页溢出错误。

    BSF RCSTA, CREN ; 再次启用 CREN。

    RETFIE ; 从中断返回。


    INT_TMR0

    BCF INTCON, TMR0IF ; 清除 tmr0 溢出中断标志。

    INCF TICK_COUNTER, F ; 将 COUNTER_ON 加1。

    RETFIE ; 从中断返回。


    ABORT_READ

    MOVF RCREG, W ; 读取 RCREG 并丢弃值。

    RETFIE ; 从中断返回。


    ;--------------中断程序结束


    START:

    MOVLB 1 ; 选择 TRISA 的存储器区，它也是后续

    ; 宏的存储器区。

    BCF TRISA, 2 ; 将 RA2 引脚设置为输出。

    SET_FREQ_HZ 32000000 ; 参见文件 fsm_macros.inc，保持在存储器区 1

    SET_TMR0_CASE1 ; 参见文件 fsm_macros.inc，保持在存储器区 1

    SET_SERIAL_RX_16F1823 ; 参见文件 fsm_macro.inc。从宏输出到存储器区 3

