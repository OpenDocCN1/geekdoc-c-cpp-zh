    ![](img/a08bd00952da48f769971864f33af432_70_0.png)


    Assembly of the program and writing it to the PIC is the same as described in
    Chapter One.


    Once the program is loaded, the LED will flash and the flash count will be transmitted
    from the serial port. To read this value on your computer, you can use the program
    *serial_reader.exe* on Windows or the Linux equivalents. The serial reader programs
    are in the working directory and print single-byte values to screen as they are
    received using the TTL-232-5V-WE lead. There is no need to change the electrical
    connections, just run the program.


    Figure 4-3a shows this for the 64-bit Linux version. Other versions are the same,
    just remember you don’t put the ./ in front of the Windows version *serial_reader.exe*
    and you use sudo in Linux to allow you to open the USB port.


    ![](img/a08bd00952da48f769971864f33af432_70_1.png)


    Figure 4-2 Circuit Diagram for the Serial Read and Write Programs


    Figure 4-3a Calling Serial Read


    Note when 255 is reached, the value rolls over to 0.


    If you add *-o some_filename* after the command, the output of the reader will
    be written to this file. The output is appended to the file so subsequent calls
    to the program do not destroy data previously captured.


    **Windows:**


    serial_reader.exe -o data.csv


    **Linux 64 bit:**


    sudo ./serial_reader_64 -o data.csv


    **Linux 32 bit:**


    sudo ./serial_reader_32 -o data.csv


    The program serial_reader has other command-line arguments that can be used to
    change its operation. These will be explained later.


    The file can then be opened using a text editor or spreadsheet program like excel.
    This works for both Windows and Linux.


    The serial read program prints a column of values. Each a byte value sent from
    the PIC’s *EUSART*.


    One point that can confuse when two devices are communicating such as here between
    a PIC and a computer: the output from one device is the input to another device.
    Hence when the PIC is transmitting, the computer is receiving and the program
    running on the computer is reading, that is it is an input to the computer.


    ## 4.3 • Serial Input from a Computer


    The PICs can also be written to from a computer using a serial lead. The computer
    will transmit to the PIC. The LED is turned on for 0.25s and off for a period
    determined by the Figure 4-3b Serial Read Output values written to the PIC from
    the computer. If the value is 0, the LED will be always on. If it is 255, it will
    be off for 2.1s. You might find this program hard going so I have commented nearly
    every line. There are only two states, LED on and off. The extra complication
    is due to *EUSART* reading the bytes from the computer. Programming in C would
    still require an understanding of what is going on in the PIC. Fig 4-4 shows the
    state diagram.


    ![](img/a08bd00952da48f769971864f33af432_72_0.png)


    ### 4.3.1 • Configuring the EUSART to Receive Bytes


    What follows is similar to the description above regarding the transmission of
    bytes. Table 4-2 shows the steps to configure EUSART to receive bytes. The settings
    are almost the same. The differences are in bold.


    | Purpose | Code | Comments |

    | :--- | :--- | :--- |

    | Enable reception | **BSF RCSTA, CREN** | *CREN is bit 4 in the receive status
    and control register RCSTA (page 278 in the datasheet)* Enable the serial port.
    |

    | | **BSF RCSTA, SPEN** | *SPEN is bit 7 in the receive status and control register
    (page 278)* Set up a baud rate of 19200 by setting the values in the serial port
    baud rate generator registers SPBRGL (low order byte) and SPBRGH (high order byte),
    these make up a 16-bit word. |

    | | MOVLW 0x19<br>MOVWF SPBRGL<br>CLRF SPBRGH | *Baudrate=clock/(64*(spbrgh:spbrgl+1))*
    *Baudrate=19200* (page 280 and 282) |

    | On the PIC 16F1823 the receive pin can be either pin 12 (RA1) or pin 5 (RC5),
    we want pin 12. | **BSF APFCON, RXDT** | Set bit 7 in APFCON (alternate pin configuration)
    to make the receive pin RA1 (page 114) |

    | Enable the global and peripheral interrupt bits in INTCON | MOVLW 0xE0<br>MOVWF
    INTCON | Bits 7 and 6 were also enabled in the previous program but for timer0.
    Bits 7 and 6 are also required for the serial receive interrupt enable in peripheral
    interrupt register (page 87). |

    | | BSF PIE1, RCIE | Table 4-2 Configuring the EUSART to receive


    For this purpose, the receive configuration of the EUSART has been made into a
    macro as follows. Again this is for use at 32MHz.


    SET_SERIAL_RX_16F1823 MACRO


    BSF PIE1, RCIE | Set the RCIE bit in PIE1 to enable the receive interrupt, see
    page 87.


    BSF APFCON, RX | Set bit 7 of APFCON to change the use of pin 12 (RA1) to be RX,
    see page 114.


    BSF RCSTA, CREN | Enables continuous receive (CREN), see page 278.


    BSF RCSTA, SPEN | Enable the serial port.


    MOVLW 0x19

    MOVWF SPBRGL | Sets baudrate=clock/(64*(spbrgh:spbrgl+1))=19200 for clock=32MHz.


    CLRF SPBRGH | See pages 280 and 282.


    BCF ANSELA,1 | RA1 (RX) set as digital input. The default is set as analog when
    input see page 118.


    MOVLW 0xE0

    MOVWF INTCON | Page 86 in the datasheet and Table 2-3 in the book.


    ENDM | Leaves in bank 3


    ### 4.3.2 • Interrupt Service Routine


    The ISR is now more complicated as we have two possible interrupts: timer0 overflowing
    and the reception of serial communication. Figure 2-3 is an illustration of how
    an service routine has to decide the cause of the interrupt and run the appropriate
    code before returning to the main program. The ISR is shown below in Table 4-3.


    | Label | Code | Comments From Source Code |

    | :--- | :--- | :--- |

    | ORG 0X04 | Interrupt vector, this is where the start of the interrupt service
    routine is. |

    | BTFSS INTCON, TMR0IF | This tests the timer0 overflow flag bit in INTCON and
    skips the next line if set. |

    | GOTO $+2 | If the overflow flag is not set the program jumps to the next but
    one instruction. |

    | GOTO INT_TMR0 | If the overflow flag is set the program jumps to the INT_TMR0
    label. |

    | MOVLB 0 | Select the bank for PIR1 see page 89. |

    | BTFSS PIR1, RCIF | Test the receive interrupt flag, if set skip to receive routine.
    |

    | RETFIE | Escape from interrupt routine if none apply. |

    | INT_RECEIVE | MOVLB 3 | Select the bank for RCREG where the received byte can
    be recovered, the same bank as RCSTA. |

    | BTFSC RCSTA, FERR | Test for a framing error, indicated by the stop bit being
    zero, see page 278. |

    | GOTO ABORT_READ | Framing error detected, therefore, value is unreliable, jump
    to ABORT_READ. |

    | MOVF RCREG, W | Move the value from RCREG to the working directory. |

    | MOVWF PERIOD | Received byte value from RCREG is moved to the PERIOD file. |

    | BTFSS RCSTA, OERR | Check for overrun error if so then skip to disable/enable
    continuous read to reset the error flag. |

    | RETFIE | If no overrun error return from interrupt. |

    | BCF RCSTA, CREN | Disable continuous read (CREN), see page 278 and page 274
    for overrun error. |

    | BSF RCSTA, CREN | Enable CREN again. |

    | RETFIE | Return from interrupt. |

    | INT_TMR0 | BCF INTCON, TMR0IF | Clear the tmr0 overflow interrupt flag. |

    | BCF INTCON, TMR0IF | Clear the tmr0 overflow interrupt flag. |

    | INCFTICK_COUNTER, F | Increment by one. |

    | RETFIE | Return from interrupt. |

    | ABORT_READ | MOVFW RCREG | RCREG read and value discarded. |

    | RETFIE | Return from interrupt. |


    ### 4.3.3 • Serial Input Example


    ; prog_04_02.asm


    LIST P=16F1823


    #INCLUDE <p16f1823.inc>


    #INCLUDE <fsm_macros.inc>


    RADIX DEC ; Default numbers are to base 10.


    BOOK_CONFIGURATION ; See macro in fsm_macros.inc.


    CBLOCK 0x70 ; Declares files starting from 0x70 to be the following variables.


    TICK_COUNTER


    PULSE_COUNTER


    PERIOD


    ENDC ; End of the declaration.


    ORG 0x00 ; Start assembling the code at location 0x00.


    GOTO START ; Jumps past the interrupt service routine.

