    \ = OFF\n#pragma config PWRTE = OFF\n#pragma config MCLRE = OFF\n#pragma config\
    \ CP = OFF\n#pragma config BOREN = OFF\n#pragma config IESO = OFF\n#pragma config\
    \ FCMEN = OFF\n// CONFIG2\n#pragma config LVP = ON\n\nchar tick_counter = 0;\n\
    \nvoid interrupt tick(void)\n{\n    INTCONbits.TMR0IF = 0;\n    tick_counter++;\n\
    }\n\nvoid main() @ 0x20\n{\n    TRISA4 = 0;\n    TRISC = 0;\n    OSCCON = 0x70;\
    \ // Page 65 in 32 MHz See Table 2-1 in the book.\n    OPTION_REG = 0xD7; // Page\
    \ 164 in the data sheet and Table 2-2 in the book.\n    INTCON = 0xE0; // Page\
    \ 86 in the data sheet and Table 2-3 in the book.\n    char state_m1 = 0, value\
