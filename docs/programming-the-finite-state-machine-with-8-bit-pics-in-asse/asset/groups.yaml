    state diagram shows the logic of the sequencing, in any practical program there
    will be some support code off to the side that does things like configuring the
    PIC’s peripherals or counting clock cycles, etc.


    The next two sections will describe how this fast timer is configured and used.
    Also how its ticks are counted to provide the inputs to the machine.


    ## 2.3 • Timer0


    These PICs have three onboard timers that run independently of the program. In
    the Hello World program in the last chapter, we created a delay by decrementing
    a file value until it reached zero. This is a bad way of creating longer delays
    as the CPU is doing nothing other than counting instruction cycles. The three
    timers are *timer0*, *timer1*, and *timer2*. We will start by looking at *timer0*.
    The first problem is how do timers keep track of time? They work as counters counting
    clock cycles, but because each timer is a separate hardware entity, they do this
    concurrently with the program. Because the timers are counting clock cycles, we
    must take into account the frequency of the oscillator being used. We will be
    using the internal oscillator where a range of frequencies from 31 kHz to 32 MHz
    can be selected.


    *Timer0* is an eight-bit timer/counter that can be used as a timer or a counter.
    Here I’ll describe how to configure it as a timer. At the heart of the module
    is the *TMR0* register that is in bank 0 of the data memory. See page 22 of the
    datasheet. When the timer is running it will count up until its value is 255 and
    then overflow or roll over to 0. The time it takes to overflow will depend on
    the value loaded into it, to begin with, the clock frequency, and the configuration
    of a Prescaler that can divide the incoming frequency. The full block diagram
    can be seen on page 162 of the datasheet. Figure 2-2 is a simplified diagram of
    our application.


    ![](img/a08bd00952da48f769971864f33af432_32_0.png)


    Figure 2-2 Simplified Block Diagram of timer0


    Starting from the left-hand side of the diagram, the tapered block is a multiplexer
    that can choose a signal from more than one source. The simplified diagram shows
    a dotted line coming from circuitry associated with an input pin. We are not using
    this source here. The signal we are using is the one that carries the clock frequency
    divided by four. To select this, the *TMRCS* bit in the *OPTION_REG* must be set
    to 0. The next choice is: do we want the frequency of cycles to be fed straight
    through to be counted or do we use the Prescaler? The Prescaler can divide the
    frequency by 2 through to 256 according to the bits PS in the *OPTION_REG*. The
    *PS<2:0>* means the three bits numbered 0,1 and 2 referred to as PS, see page
    164 in the datasheet when this notation is used the numbers do not refer to the
    bit numbers in the register but to the bit numbers in that group.


    Here is an example that will be used in the next program. We are going to set
    the internal oscillator to run at 32 MHz. The internal oscillator has already
    been selected in the configuration word 1. The frequency is set using bits *IRCF<3:0>*
    actually bits 6, 5, 4 and 3 in the register *OSCCON* (page 65). These are set
    to 1110. The code to do this is:


    ```asm

    MOVLW 0x70 ;Move (copy) 0x70 to W (working register)

    MOVWF OSCCON ;Move (copy) W to OSCCON

    ```


    In the datasheet, it says 8 or 32 MHz for this selection of bits depending on
    whether the phase-locked loop is enabled. As phase lock loop is defaulted to be
    enabled in configuration word 1, the frequency will be 32 MHz. The tables below
    are a handy way of working out what you need to move to registers configurations.
    You can do this on paper: just write the bits 7-0 in a vertical column and by
    reading from the datasheet add the bit settings then convert the two groups of
    bits 7-4 and 3-0 to hexadecimal digits. Once converted to hex, they are less likely
    to be typed into your code incorrectly. From Table 2-1, *OSCCON* will be loaded
    with 0x70.


    | OSCCON | Bits | Hex Value |

    | :--- | :--- | :--- |

    | 7-4 | 1110 | 7 |

    | 3-0 | 0000 | 0 |


    | OPTIONS_REG | Bits | Hex Value |

    | :--- | :--- | :--- |

    | 7-4 | 1101 | D |

    | 3-0 | 0111 | 7 |


    To use the Prescaler, *PSA* in *OPTION_REG* must be set 0. The Prescaler ratio
    is to be 1:256, so bits *PS<2:0>* in *OPTION_REG* must be set to 111. We don’t
    need the pull ups to be enabled, so by leaving the other bits that don’t affect
    this at their default, we get the bits for *OPTION_REG* to be 1101111. This is
    summarized in Table 2-2.


    ```asm

    MOVLW 0xD7 ;Move (copy) 0xD7 to W (working register)

    MOVWF OPTION_REG ;Move (copy) W to OPTION_REG

    ```


    We now have a frequency of 32MHz divided initially by 4 then by 256 by the Prescaler
    presenting a frequency of 31.25kHz to be counted by *TMR0*. 32000000/(4 x 256)
    = 31250. If *TMR0* starts from 0, it will overflow after it has counted 256 cycles
    as it is an 8-bit register. It will take 256/31250 seconds to overflow: that is
    0.008192 seconds or 8.192ms. Stated another way, it will overflow at a frequency
    of 1/0.008192Hz or 122.07Hz. The next paragraph will show how to catch the points
    in time when the overflow of *TMR0* occurs.


    ## 2.4 • Interrupts


    Suppose you are working on something but you have arranged to meet someone at
    eleven oclock. How can you be sure you are not going to miss the appointment?
    One way is to keep checking your watch to see what the time is. This is called
    polling where the value of something is repetitively read. This method is often
    used in software but can be a wasteful use of resources if the polling has to
    be frequent. Another way of ensuring that you get to your appointment on time
    is to set an alarm on your watch to tell you it’s time to go. When you hear the
    alarm, you stop work, go to your appointment and then return to work. The PIC
    can be programmed to respond to events that can interrupt the program, do something
    else, and then return to what it was doing.


    Many events can be used as interrupt sources: a timer overflow being one of them.
    There are a few things that have to be done to use an interrupt. The first example
    here will demonstrate how to use *timer0* to cause a routine to be carried out
    every time it overflows and then return the program to where it was. To use interrupts,
    the global interrupt enable bit *GIE* must be set in register *INTCON* (page 86).
    Additionally, the peripheral interrupt enable bit *PEIE* and timer0 overflow interrupt
    enable bit *TMRIE* must be set, again in register *INTCON*.


    When an interrupt occurs, the program completes the instruction it is currently
    executing. The *GIE* bit is cleared to prevent another interrupt occurring. The
    program counter is pushed on to the hardware stack. A block in the core, 15 bits
    wide that has 16 locations is used for storing program counter values. The value
    being stored is the return address where the program must continue after the interrupt
    is over. Important registers such as *W*, *STATUS*, and other others (they are
    listed on page 85) are temporarily stored in shadow registers in 31 to be recovered
    later. The program counter now jumps to 0x04. This special address is called the
    interrupt vector. This happens automatically. If you look at page 39 of the datasheet,
    there is an explanation of the stack.


    The code starting at 0x04 is called the interrupt service routine and you have
    to write it. The first thing to do is to determine the cause of the interrupt.
    In our first example, we are interested in TMR0 overflowing. When *TMR0* overflows,
    the *timer0* interrupt flag *TMRIF* in *INTCON* gets set and this is used to establish
    the cause of the interrupt.


    At this point, we can execute any code we want. *TMRIF* can now be cleared by
    our code as the interrupt has been caught. Next, the instruction return from interrupt
    *RETFIE* is used. This returns the program to where it was by popping the return
    address off the stack to the program counter. It restores the *W, STATUS*, and
    other registers from the shadow registers and sets *GEI* again so that other interrupts
    can be caught.


    If another interrupt occurs while an interrupt is being serviced, it is not forgotten.
    Its interrupt flag is still set and will cause another interrupt when the *GEI*
    is set again. Figure 2-3 shows the program flow for an interrupt.

