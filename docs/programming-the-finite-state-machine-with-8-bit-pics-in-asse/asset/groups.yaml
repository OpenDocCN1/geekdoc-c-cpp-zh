  - "[PAGE 163]\n\ng\n\ng\n\ny\n\n● 164\n\nas a *SWITCH*. In C there is a switch statement\
    \ that runs a block of code according to \n\nthe value of integer expression.\
    \ To demonstrate the switch, here is a 7-segment driver \n\nwhere the variable\
    \ value determines outputs. The form of the switch statement is the \n\nword *switch*\
    \ followed by parenthesis containing an expression of an integer type. Here the\
    \ \n\ninteger variable value is used, but you can have a calculation that results\
    \ in an integer. The \n\nbody of the switch is enclosed by a pair of braces and\
    \ the body is divided up into cases. \n\nEach case is made up of the word case\
    \ followed by an integer then a colon. Following the \n\ncolon is the code to\
    \ be executed when the case value matches the value. A very important \n\npoint\
    \ to remember is at the end of each case that precedes another case: you have\
    \ to have \n\nthe word break otherwise the next case block will be executed and\
    \ you probably don't want \n\nthat. State machine programs in this book have favoured\
    \ the Mealy type where outputs are \n\ndependent on current state and inputs.\
    \ If you look at Program 9-5, this is a Moore machine \n\nbecause the outputs\
    \ are being driven depending on the state, and all the time it is one \n\nparticular\
    \ state the output code is being executed over and over on each loop. As the output\
    \ \n\ncondition is a memory state, once written to it doesn't have to be reminded\
    \ every loop. \n\nProgram 9-6 replicates the *M1* assembly machine used before\
    \ where two states are used: \n\none to idle and one to update the outputs. Refer\
    \ to Figure 2-10. Although the program does \n\nnot explicitly name the two states,\
    \ the idle state is when 'update' is low which it always \n\nis apart from one\
    \ call per second. An experiment that was made to measure the speed \n\nimprovement\
    \ is shown in paragraph 9.3.9.\n\nProgram 9-6 introduces the *bool* type that\
    \ is used for the update signal. To use it in the \n\ncode, you have to include\
    \ the *stdbool.h* file.\n\n//prog\\_09\\_05\n\n#include <xc.h>\n\n// PIC16F1823\
    \ Configuration Bit Settings\n\n// CONFIG1\n\n#pragma config FOSC = INTOSC\n\n\
    #pragma config WDTE = OFF\n\n#pragma config PWRTE = OFF\n\n#pragma config MCLRE\
    \ = OFF\n\n#pragma config CP = OFF\n\n#pragma config BOREN = OFF\n\n#pragma config\
    \ IESO = OFF\n\n#pragma config FCMEN = OFF\n\n// CONFIG2\n\n#pragma config LVP\
    \ = ON\n\nchar tick\\_counter = 0;\n\nvoid interrupt tick(void)\n\n{\n\n INTCONbits.TMR0IF\
    \ = 0;\n\n tick\\_counter++;\n\n}\n\nvoid main() @ 0x20\n\n{\n\n TRISAbits.TRISA4\
    \ = 0;\n\n TRISC = 0;\n\n OSCCON = 0x70;\n\n OPTION\\_REG = 0xD7;\n\n INTCON =\
    \ 0xE0;\n\n char value = 0, seconds\\_counter;\n\n while (1)\n\n {\n\n if (tick\\\
    _counter >= 121) // When a second has been reached.\n\n {\n\n value++; // Increment\
    \ the state by 1."
- md: "\n// prog_09_06\n#include <xc.h>\n#include <stdbool.h>\n\n// PIC16F1823 Configuration\
