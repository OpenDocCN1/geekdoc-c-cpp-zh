    交变电压。LED 的缺点是每个段都需要几毫安的电流。目前有许多七段 LED 显示器可用。我使用的是一个单数字显示器。图 2-8 显示了一个典型模式的物理连接。显示器有两种不同的排列：共阴极和共阳极。对于共阴极，阴极必须连接到
    0V。对于共阳极，阳极必须连接到 +5V。然后将段连接连接到 PIC 的输出引脚。输出代码的逻辑必须设计为适应显示器的极性。如果你使用具有这种引脚布局的显示器会更简单，但如果没有，你将不得不自己接线。RS
    Components 可以提供的 LA-601VB 共阳极显示器与我使用的相似。Farnell 也有类似的型号（部件号 SA52-11SRWA）。


    ![](img/a08bd00952da48f769971864f33af432_45_0.png)


    由于总共有 8 个 LED 需要驱动，因此使用了 16F1823 PIC。它有一个额外的 IO 端口 PORTC。让我们从图 2-9 开始——连接到 PIC
    的电路图。


    图 2-8 典型七段 LED 显示器的连接


    ![](img/a08bd00952da48f769971864f33af432_46_0.png)


    设计过程的下一步是绘制有限状态机图（见图 2-10）。机器 *M1* 是显示驱动器。上电时，LED 初始化为开启，然后机器 *M0* 从状态 0 开始。0.25s
    后，定时器到期，机器 0 转换到状态 1。定时器重位，LED 关闭，脉冲计数器加 1，并将名为 *UPDATE* 的信号置高电平。这个 *UPDATE* 信号被机器
    1 使用。在状态 1 下，当定时器在 0.75s 到期时，机器转换到状态 0，定时器重位并开启其 LED。这会无限持续下去。在状态 1 下，如果脉冲计数器达到
    10，则跳转到同一状态。这是为了将脉冲计数器重置为零。同时，机器 *M1* 独立运行但共享 CPU。机器 *M1* 从状态 0 开始，显示器将为空。当 *UPDATE*
    信号变为高平时，机器转换到状态 2 并将 *UPDATE* 信号置为低电平。根据变量 *N* 的值，机器转换回状态 1，驱动显示器必要段的开启和关闭。机器将保持在状态
    0 等待另一个更新信号。为机器 *M1* 显示的输出细节是针对共阳极显示器的。代码中的注释显示了共阴极显示器的替代方案。


    图 2-9 PIC 16F1823 与七段 LED 显示器的连接


    ![](img/a08bd00952da48f769971864f33af432_47_0.png)


    程序 *prog_02_03.asm* 中的几乎所有内容都解释过了，但有一点你必须注意：在使用 *BSF* 和 *BCF* 指令时可能会发生“读-修改-写”（READ
    MODIFY WRITE）问题。到为止，我们只通过设置 *PORTA* 上的位值来设置一个输出引脚。如果你只在一个端口上操作一个输出引脚，这是有效的，但在更改另一个引脚后立即尝试更改输出引脚时会发生奇怪的事情。要理解这个问题，我们必须查看有关电容器充电和放电的基础电理论，以及
    PIC 如何处理一次更改一个引脚的值。当 PIC 写入输出时，它只能写入一个完整的字节或八位，因此为了更改一个位，它必须读取引脚状态，修改它想要更改的那个位，然后写回输出。问题在于，假设
    *PORTA* 位 5（物理引脚 2）已从 0 变为 1，然后在下一条指令中，你想更改 *PORTA* 位 4（物理引脚 3）的值。PIC 读取 *PORTA*
    引脚上的值——你可能认为位 5的值是高，因为你刚刚设置了它，但并不是，因为在现实世界中，电路可能是电容性的，电压升高需要时间，导致位 5 的读取值为低。当输出被写回端口时，位
    5（引脚 2）被置回低电平。这是一个在仿真器中测试可能会让你失望的例子。通常，在使用 *BCF* 和 *BSF* 时，你应该向端口的锁存寄存器（*LATA*
    和 *LATC*）写入。但是，如果你作为寄存器写入整个端口，例如使用 *MOVWF PORTA*，那么就是安全的。


    图 2-10 程序 2-3 状态图


    ```asm

    ; prog_02_03.asm

    ; 页码参考数据表 DS413；表格参考书籍。

    LIST=16f1823

    #include <16f1823.inc>

    #include <fsm_macros.inc>


    ; 默认数字为 10 进制。

    __CONFIG 0x807 (FOSC_INTC & WDTE_OFF & PWRTE_OFF & CP_OFF & IEO_OFF), 0x08 (LVP_ON)


    BLOCK 0x70

    TICK_COUNTER

    STATE_M0

    STATE_M1

    PULSE_COUNTER

    UPDATE


    ORG 0x00

    GOTO START


    ORG 0x04 ; 中断向量

    BCF INTCON, TMR0 ; 清除 TMR0 溢出标志

    INCF TICK_COUNTER, F ; 增加 TICK_COUNTER

    RETF ; 从中断返回


    START

    BCF TRISA, 2 ; 配置 PORTA 引脚 2 为输出

    BCF TRISA, 4 ; 配置 PORTA 引脚 4 为输出

    CLRF TRISC ; 配置 PORTC 所有输出

    MOVLW 0xD7 ; 查看表 2-2

    MOVWF OPTION_REG ; 设置 2MHz，页 164

    MOVLW 0xE0

    MOVWF INTCON ; 数据表 86 和表 2-3

    CLRF STATE_M0 ; 将 STATE_M0 置为 0

    CLRF STATE_M1 ; 将 STATE_M1 置为 0

    CLRF UPDATE ; 将 UPDATE 置为低

    CLRF PULSE_COUNTER ; 将 PULSE_COUNTER 置为 0

    CLRF TICK_COUNTER ; 将 TICK_COUNTER 置为 0

    MOV2 ; 后续程序访问 LATA 和 LATC

    BSF LATA, 2 ; 开启 LED

    MOVLW 0xFF ; 共阴极 0x00。空显示

    MOVWF PORTC

    BSF LATA, 4 ; 共阴极使用 BCF。空显示


    SWITCH_M0

    MOVF STATE_M0, W ; 将 STATE_0 移入 W

    BRW ; 程序根据 W 的值跳转

    GOTO M0_S0 ; 如果 W 为 0

    GOTO M0_S1 ; 如果 W 为 1


    SWITCH_M1

    MOVF STATE_M1, W ; 将 STATE_0 移入 W

    BRW ; 程序根据 W 的值跳转

    GOTO M1_S0 ; 如果 W 为 0

    GOTO M1_S1 ; 如果 W 为 1


    M0_S0

    MOVLW 31

    SUBWF TICK_COUNTER, W ; 当 TICK_COUNTER_ON >= 31 时 STATUS 置位

    BTFSS STATUS, C ; 如果 STATUS 置位则跳过下条指令

    GOTO SWITCH_M1 ; STATUS 未置位

    INCF STATE_M0, F ; 转换到状态 1

    BCF LATA, 2 ; 关闭 LED

    CLRF TICK_COUNTER ; 重置 TICK_COUNTER

    INCF PULSE_COUNTER, F ; 增加脉冲计数

    BSF UPDATE, 0 ; 设置 UPDATE 位 0

    GOTO SWITCH_M1


    M0_S1

    MOVLW 10

    SUBWF PULSE_COUNTER, W ; 测试脉冲计数是否达到 10

    BTFSS STATUS, C ; 如果脉冲计数 < 10 则跳过清除 PULSE_COUNTER

    GOTO $+2

    CLRF PULSE_COUNTER ; 在状态图中显示为离开重新进入状态。实际上我们留在状态中

    MOVLW 91

    SUBWF TICK_COUNTER, W ; 当 TICK_COUNTER_OFF >= 91 时 STATUS 置位

    BTFSS STATUS, C ; 如果 STATUS 置位则跳过下条指令

    GOTO SWITCH_M1 ; STATUS 未置位。保持在此状态。

    INCF STATE_M0, F ; 时间过期跳转到此处

    CLRF TICK_COUNTER ; 清除 TICK_COUNTER

    BSF LATA, 2 ; 开启 LED

    CLRF STATE_M0 ; 切换到状态 0

    GOTO SWITCH_M1


    M1_S0

    BTFSS UPDATE, 0 ; 测试 UPDATE 位 0 查看是否已调用更新，如果是则跳过

    GOTO SWITCH_M0 ; 未调用更新，保持在此状态

    BCF UPDATE, 0 ; 已调用更新，清除更新信号

    MOVLW 1

    MOVWF STATE_M1 ; 切换到状态 1

    GOTO SWITCH_M0


    M1_S1

    MOVF PULSE_COUNTER, W

    BRW ; 程序根据 W 的值跳转

    GOTO N_0 ; 跳转到 PULSE_COUNTER 需要的适当输出设置

    GOTO N_1

    GOTO N_2

    GOTO N_3

    GOTO N_4

    GOTO N_5

    GOTO N_6

    GOTO N_7

    GOTO N_8

    GOTO N_9

    GOTO N_10


    N_0

    MOVLW 0x00 ; 共阴极 0x3F。

    MOVWF PORTC

    BSF LATA, 4 ; 共阴极使用 BCF。

    CLRF STATE_M1

    GOTO SWITCH_M0


    N_1

    MOVLW 0x36 ; 共阴极 0x09。

    MOVWF PORTC

    BSF LATA, 4 ; 共阴极使用 BCF。

    CLRF STATE_M1

    GOTO SWITCH_M0


    N_2

    MOVLW 0x21 ; 共阴极 0x1E。

    MOVWF PORTC

    BSF LATA, 4 ; 共阴极使用 BCF。

    CLRF STATE_M1

    GOTO SWITCH_M0


    N_3

    MOVLW 0x24 ; 共阴极 0x1B。

    MOVWF PORTC

    BSF LATA, 4 ; 共阴极使用 BCF。

    CLRF STATE_M1

    GOTO SWITCH_M0


    N_4

    MOVLW 0x16 ; 共阴极 0x29。

    MOVWF PORTC

    BSF LATA, 4 ; 共阴极使用 BCF。

    CLRF STATE_M1

    GOTO SWITCH_M0


    N_5

    MOVLW 0x0C ; 共阴极 0x33。

    MOVWF PORTC

    BSF LATA, 4 ; 共阴极使用 BSF。

    CLRF STATE_M1

    GOTO SWITCH_M0

