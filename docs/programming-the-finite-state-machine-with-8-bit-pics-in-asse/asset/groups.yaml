    \ 配置位设置\n\n// CONFIG1\n\n#pragma config FOSC = INTOSC\n\n#pragma config WDTE =\
    \ OFF\n\n#pragma config PWRTE = OFF\n\n#pragma config MCLRE = OFF\n\n#pragma config\
    \ CP = OFF\n\n#pragma config BOREN = OFF\n\n#pragma config IESO = OFF\n\n#pragma\
    \ config FCMEN = OFF\n\n// CONFIG2\n\n#pragma config LVP = ON\n#define _XTAL_FREQ\
    \ 32000000 /* #define 将 _XTAL_FREQ 设置为 32 MHz，这\n告诉编译器频率，以便它可以设置所需延迟\n的时钟周期数量.*/\n\
    \nvoid main() @ 0x20\n{\n TRISA2 = 0;\n OSCCON = 0x70; // 第 65 页 32 MHz，参见书中的表\
    \ 2-1。\n OPTION_REG = 0xD7; // 数据手册中的第 164 页以及书中的表 2-2。\n while (1) // 无限循环。\n\
    \ {\n __delay_ms(750); // 函数参数单位为毫秒。\n RA2 = 1;\n __delay_ms(250); // 函数参数单位为毫秒。\n\
    \ RA2 = 0;\n }\n}\n\n## 9.3.7 扩展 if 语句\n\n为了在程序中决策，if..else 语句比编写汇编代码要容易得多……即使你编写了宏来提高其可读性。如果选择很复杂，可能有多个条件为真，但你又倾向于其中一个呢？举一个简单的例子，假设\
    \ LED 在上电后前 3 秒关闭，接下来的 5 秒内开启，然后以四分之一的功率运行 4 秒，然后重复该序列。我们扩展 if 语句的方法是使用 else if。这允许我们对决策进行优先级排序。向\
    \ LED 开启的变化发生在 3 秒处。1/4 功率的变化发生在 7 秒处，然后在 12 秒处变回 LED 关闭。每秒有 122 次滴答，因此要达到 12\
    \ 秒需要 1464 次滴答。这对于单字节（byte）来说太多了，因此我们需要使用两个字节来计数。我们可以让编译器完成工作，并将计数器声明为无符号整数（unsigned\
    \ integer），允许计数达到 65535。为了方便，你可以让编译器将秒乘以 122，这样你就不需要手动计算。这种运算在 PIC 代码编译之前完成。程序\
    \ 9-4 所示。除了 tick_counter，还有一个声明为无符号字符（unsigned char）的变量 dim_counter。每当执行 else\
    \ 部分时它就会递增。除以 4 后每 4 次产生一个余数。如果余数为零（dim_counter%4 == 0 为真），LED 开启；在其他三次中 LED 关闭。这使得\
