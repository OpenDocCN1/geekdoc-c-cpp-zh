    \ F1V\n\n*RESBUFF*(345)/100 gives a result of 3 and a remainder of 45 to go into\
    \ *RESBUFF*. 3 is the \n\nnumber of hundreds of millivolts and is placed in F100mv.\n\
    \nFinally, on the last call, *RESBUFF*(45)/10 gives a result of 4 and a remainder\
    \ of 5 that we \n\ndon’t need. 4 is the number of tens of millivolts and is placed\
    \ in the F10mv file.\n\nYou can follow this through in state 2 and the subroutine.\n\
    \n**7.5 • Detecting No Input Voltage**\n\nThe detection of no input voltage or\
    \ somewhat less than 111 mV is done by comparing the \n\nvalue in *ADRESH:ADRESL*\
    \ with 5. The two registers hold the 10-bit result, right justified \n\nso the\
    \ 8 least most significant bits are held in *ADRESL* and the 2 most significant\
    \ bits in \n\n*ADRESH*. First *ADRESH* is checked to see if it is zero. *ADRSEL*\
    \ is then checked to see if it \n\nis less than 5. A value of 5 is 20 mV at the\
    \ input pin on the PIC, or 111 mV at the probe.\n\n**7.6 • Recalibration**\n\n\
    You can easily change the voltage range to suit your needs by using a different\
    \ potential \n\ndivider and recalculating the scaling. Be mindful of the voltages\
    \ you are playing with. If \n\nyou are sure of your electrical knowledge, you\
    \ could even make it into an ammeter by \n\nconnecting the analog input across\
    \ a shunt resistor."
