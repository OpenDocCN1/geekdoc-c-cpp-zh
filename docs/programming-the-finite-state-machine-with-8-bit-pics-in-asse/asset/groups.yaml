    \ page 128 in the data sheet.\n  tick_counter = 0;\n  unsigned char value = 0,\
    \ state_m0 = 0, state_m1 = 0, state_m2 = 0, laps = 0, F10V = 0, F1V = 0, F100mV\
    \ = 0, F10mV = 0;\n  static bit dis_update = 0, vol_available = 0, read_required\
    \ = 0; // Flag bits.\n\n  while (1)\n  {\n    /* Machine M0 */\n    switch (state_m0)\n\
    \    {\n      case 0: if (tick_counter > 61)\n      {\n        value = 10;\n \
    \       dis_update = 1;\n        read_required = 1;\n        tick_counter = 0;\n\
    \        state_m0++;\n      }\n      break;\n      case 1: if (tick_counter >\
    \ 122)\n      {\n        if (vol_available)\n        {\n          laps = 0;\n\
