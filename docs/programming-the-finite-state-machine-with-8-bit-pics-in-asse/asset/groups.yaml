- md: "\n![](img/a08bd00952da48f769971864f33af432_80_0.png)\n\nThis is OK if the Vdd\
    \ voltage is regulated, but if you want to make measurements independent \nof\
    \ the supply voltage, you can use the internal voltage reference of the chip as\
    \ we will see \nlater in the book.\n\n## 4.5 Pulse with modulated outputs\n\n\
    To supply a load with a variable voltage, the PICs use a technique of pulse width\
    \ modulation \n(PWM). This involves turning the output on and off at a fast rate.\
    \ Our example will be at a \nrate of 1.95 kHz. The frequency that the output switches\
    \ remains constant but the length of \ntime in each cycle that the output is on\
    \ is varied to control the power supplied to the load. \nFigure 4-8 shows three\
    \ traces:\n\n- Trace A, the time the output is on is short with a long off-time,\
    \ giving a low power \noutput.\n- Trace B\n- Trace C the on-time is long with\
    \ a short off-time giving a high output power. The PIC \nallows us to vary this\
    \ on to off ratio with up to a precision of one part in 1024 that is \na 10 bit\
    \ resolution.\n\nThe great advantage of PWM is that when a perfect switch is on,\
    \ it has current flowing through \nit but no voltage across it. When off, it has\
    \ a voltage across it but no current through it. \nTherefore it does not dissipate\
    \ any power. If you tried to control the output power by using \na series pass\
    \ transistor, there would be power loss in the transistor. However, the output\
    \ is \nnot a perfect switch but the losses are very small. The voltage at the\
    \ output is either 5V or \n0V but can be made to appear like the average voltage\
    \ by connecting a capacitor across the \noutput. This is not required for an LED\
    \ as your eye averages the brightness.\n\nFigure 4-7 Reading the Input Voltage\n\
    \n![](img/a08bd00952da48f769971864f33af432_81_0.png)\n\n### 4.5.1 LED with Pulsing\
    \ Brightness\n\nTo demonstrate the use of PWM, Program 4-4 varies the brightness\
    \ of an LED in cycles \nthrough bright and dim. The LED should be connected through\
    \ a resistor as previously \nbut to *RC5*. Starting with the state diagram Figure\
    \ 4-9, there are four states. In state 0, \nthe brightness is constant for 41\
    \ ms after which the brightness is incremented by 1 and \nthe program jumps to\
    \ state 1. If the maximum brightness has been reached, the machine \njumps to\
    \ state 4 and resets TICK_COUNTER to zero. If maximum brightness has not been\
    \ \nreached, the state changes back to 0 and this cycle repeats. When maximum\
    \ brightness \nhas been reached and the state is 4, the state holds for 41 ms\
    \ and the state changes to \n3 and the brightness is decremented by 1. If the\
    \ brightness is above the minimum, the \nstate returns to 4 and TICK_COUNTER is\
    \ reset to zero.\n\n![](img/a08bd00952da48f769971864f33af432_81_1.png)\n\nFigure\
    \ 4-8 Pulse Width Modulation\n\nFigure 4-9 State Diagram Prog 4-4\n\nWhen the\
    \ brightness reaches the minimum, the state changes from 3 to 0, back to the \n\
    start condition.\n\nThe PICs have complicated features associated with PWM peripherals.\
    \ Here we will use a \nsimple example of its configuration. I will show how this\
    \ example is set up using tables \nexplaining the bit values used. The datasheet\
    \ gives full explanations.\n\nFour special-purpose registers have to be configured:\
    \ *PR2, T2CON, CCP1CON*, and \n*CCPR1L*. The period of a PWM cycle is the inverse\
    \ of its frequency. As mentioned above, \nthis frequency will be 1.95 kHz. Timer2\
    \ is used to determine the frequency. On page 176 \nof the datasheet, Fig 22-1\
    \ is a block diagram of the timer. Register *TMR2* is incremented \nby pulses\
    \ from a Prescaler that is fed from *Fosc/4*. When the value in *TMR2* reaches\
    \ the \nvalue in *PR2*, a comparator gives an output and the register *TMR2* is\
    \ reset to zero. \n\n if you look at page 195 of the datasheet, on Fig 24-4 you\
    \ can see that this is used in \nconjunction with another comparator and an S-R\
    \ flip flop. The overview explanation is \nthat Timer2 sets the flip flop at regular\
    \ intervals that are the period of the PWM cycle \nand partway through the cycle\
    \ the flip flop is reset by the other comparator comparing \nthe value that comes\
    \ from *CCPR1L*. This means that we can control the output power by \nchanging\
    \ the values in *CCPR1L* (eight bits) and two additional bits that come from bits\
    \ \n*CCP1CON* <5:4>. The two bits from *CCP1CON* are the least significant bits\
    \ so we will not \nuse them. The power will be adjusted by varying *CCPR1L* over\
    \ its range of 0 to 255.\n\nThe *T2CON* special register is set up to give the\
    \ PWM frequency of 1.95 kHz. Table 4-7 \nshows the settings. The Prescaler value\
    \ of 16 comes from Table 24-5 on page 197 of the \ndatasheet.\n\nTo explain this\
    \ setting, the oscillator frequency will be 32MHz. The Prescaler is fed with \n\
    Fosc/4. The Prescaler is 16 and according to the table, *PR2* will be OxFF (dec\
    \ 255). This \nmeans that the period will be determined when *TMR2* matches *PR2*.\n\
    \nPWM frequency = 32000000/(16x256x4) = 1.95 kHz\n\n**T2CON**\n| Bit | Value |\
    \ Description |\n| :--- | :--- | :--- |\n| 7 | 0 | Unimplemented |\n| 6 | 0 |\
    \ Post scaler not used, left as default |\n| 5 | 0 | |\n| 4 | 0 | |\n| 3 | 0 |\
    \ |\n| 2 | 1 | Timer2 is on |\n| 1 | 1 | Timer 2 Prescaler set to 16 |\n| 0 |\
    \ 0 | |\n\nTable 4-7 T2CON\n\n**CCP1CON**\n| Bit | Value | Description |\n| :---\
    \ | :--- | :--- |\n| 7 | 0 | Single output P1A (RC5 on the 16F1823, see page 5\
    \ of the datasheet). |\n| 6 | 0 | |\n| 5 | 0 | These are used as the least significant\
    \ bits of the 10 bits to set the pulse width ratio. |\n| 4 | 0 | |\n| 3 | 1 |\
    \ Set to PWM mode with P1A active high. If one of the active low modes is chosen\
    \ the dim and bright phases will be reversed. |\n| 2 | 1 | |\n| 1 | 1 | |\n| 0\
    \ | 0 | |\n\nThe program is shown below:\n\n```asm\n; prog_04\n; 0000:     GOTO\
    \ START\n; 0002:     MOVLW 0xFF\n; 0004:     MOVWF PR2\n; 0005:     MOVLW 0x06\n\
    ; 0007:     MOVWF T2CON\n; 0009:     MOVLW 0x05\n; 000B:     MOVWF CCP1L\n; 000D:\
    \     MOVLW 0x0C\n; 000F:     MOVWF CCP1CON\n; 0010:     MOVLW 0x01\n; 0012: \
    \    MOVWF LATA\n; 0013:     BCF LATA, 5\n; 0014:     MOVLW 0x02\n; 0016:    \
    \ MOVWF TRISC\n; 0017:     BCF TRISC, 2\n; 0018: START:\n; 0018:     ; Compare\
    \ TMR2 and PR2\n; 0018:     BTFSS TMR2, T_PR2 ; Placeholder logic for example\n\
