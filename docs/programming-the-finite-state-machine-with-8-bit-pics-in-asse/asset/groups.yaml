    The program is shown below. By referring to the state diagram, you should be able
    to understand what is happening. There is one new thing to explain: the use of
    the $ sign. This means the address of the current line, so instead of jumping
    to a label, we can jump so many lines. Writing GOTO $+3 will jump forwards 3 lines
    for example.


    ; prog_02_02.asm


    ; Page numbers refer to the data sheet DS40001413E.


    ; Tables refer to the book.


    LIST P=12f1822


    #INCLUDE <p12f1822.inc>


    RADIX DEC ; Default numbers are to base 10.


    __CONFIG 0X8007, (_FOSC_INTOSC & _WDTE_OFF & _PWRTE_OFF & _CP_OFF & _IESO_OFF
    & _IESO_OFF & _FCMEN_OFF)


    __CONFIG 0X8008, (_LVP_ON)


    CBLOCK 0x70 ; In common RAM, accessible in all banks.


    TICK_COUNTER


    PULSE_COUNTER


    ENDC


    ORG 0X00


    GOTO START


    ORG 0X04 ; Interrupt vector.


    BCF INTCON, TMR0IF ; Clear the tmr0 overflow interrupt flag. INTCON is in all
    banks.


    INCF TICK_COUNTER, F ; Increment by one counter_off.


    RETFIE ; Return from interrupt


    START


    MOVLB 1 ; To access TRISA, OSCCON, OPTION_REG.


    BCF TRISA, 2 ; Configure PORTA bit 2 (chip pin 5) as an output


    MOVLW 0x70


    MOVWF OSCCON ; Page 65 32MHz. See Table 2-1 in the book.


    MOVLW 0xD7


    MOVWF OPTION_REG ; Page 164 in the data sheet and Table 2-2 in the book.


    MOVLW 0xE0


    MOVWF INTCON ; Page 86 in the data sheet and Table 2-3 in the book.


    MOVLB 0 ; To access PORTA for the rest of the program.


    Figure 2-6 Oscilloscope Trace for the Cycle of Cycles


    BSF PORTA, 2 ; Initialise LED on;


    ;-----------Machine States.


    S0 ; LED on. Fast cycle.


    MOVLW 3


    SUBWF TICK_COUNTER, W ; C in STATUS is set when TICK_COUNTER >= to 3.


    BTFSS STATUS, C ; Skip the next instruction if C in STATUS is found set.


    GOTO S0 ; C in STATUS found not set. Stay in this state.


    BCF PORTA, 2 ; Turn LED off


    CLRF TICK_COUNTER ; Reset the tick counter.


    INCF PULSE_COUNTER, F ; Add 1 to PULSE_COUNTER and put the result in PULSE_COUNTER.


    ; Continue to S1


    S1 ; LED off. Fast cycle.


    MOVLW 10


    SUBWF PULSE_COUNTER, W ; C in STATUS is set when PULSE_COUNTER >= to 10.


    BTFSS STATUS, C ; Skip the next instruction if C in STATUS is found set.


    GOTO $+3 ; Have not reached 10 pulses jump to ticks check.


    CLRF PULSE_COUNTER ; 10 Pulses have been counted, reset PULSE_COUNTER.


    GOTO S3 ; Transition to S3.


    MOVLW 9 ; Load W with 9 for ticks check.


    SUBWF TICK_COUNTER, W ; C in STATUS is set when TICK_COUNTER >= to 9.


    BTFSS STATUS, C ; Skip the next instruction if C in STATUS is found set.


    GOTO S1 ; C in STATUS found set, 9 ticks counted.


    CLRF TICK_COUNTER


    BSF PORTA, 2 ; Turn LED on.


    GOTO S0


    S2


    MOVLW 31


    SUBWF TICK_COUNTER, W ; C in STATUS is set when TICK_COUNTER >= to 3.


    BTFSS STATUS, C ; Skip the next instruction if C in STATUS is found set.


    GOTO S2 ; C in STATUS found not set.


    BCF PORTA, 2 ; Turn LED off


    CLRF TICK_COUNTER ; Reset the tick counter.


    INCF PULSE_COUNTER, F ; Add 1 to PULSE_COUNTER and put the result in PULSE_COUNTER.


    ; Continue to S3


    S3 ; LED on. Slow cycle.


    MOVLW 3


    SUBWF PULSE_COUNTER, W ; C in STATUS is set when PULSE_COUNTER >= to 3.


    BTFSS STATUS, C ; Skip the next instruction if C in STATUS is found set.


    GOTO $+3 ; ave not reached 3 pulses jump to ticks check.


    CLRF PULSE_COUNTER ; Reset PULSE_COUNTER.


    GOTO S1 ; Transition to S1.


    MOVLW 91


    SUBWF TICK_COUNTER, W ; C in STATUS is set when TICK_COUNTER >= to 9.


    BTFSS STATUS, C ; Skip the next instruction if C in STATUS is found set.


    GOTO S3 ; C in STATUS found set.


    CLRF TICK_COUNTER


    BSF PORTA, 2 ; Turn LED on.


    GOTO S2


    END


    ## 2.6 • Running More Than One Machine in a Program


    The two FSM programs have so far had a small block of code for each state and
    have run that code over and over until some input event causes a jump to another
    state. I will now suggest a way of running more than one machine at once in a
    program: This is like doing two things at once by performing part of one task
    then part of another task then back to the first and so on. This is time multiplexing,
    the CPU in the microcontroller can only carry out one instruction at a time so
    if tasks are to be carried out together they must share the processor’s time.
    Unlike timers and other peripheral parts of the PIC that are separate hardware
    entities that can truly run concurrently, if there is more than one task in the
    program, they only appear to run concurrently. They are running as threads, with
    each thread sharing the processor’s time.


    Program Flow Between Cycles


    Time multiplexing, the CPU in the microcontroller can only carry out one instruction
    at a time so if tasks are to be carried out together they must share the processor’s
    time. To achieve this multi-threading, the program flow alternates between machines.
    The state of different machines share the processor''s time. Example of Program
    Flow Between Two Machines


