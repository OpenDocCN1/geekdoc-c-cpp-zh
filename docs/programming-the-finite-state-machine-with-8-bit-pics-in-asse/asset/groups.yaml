    ## 6.3 • Binary Subtraction of unsigned integers


    Subtracting numbers is similar. The next program subtracts one sixteen-bit number
    from another. As an example, we will subtract 1000 from 1500. Both numbers are
    greater than 255 so they require two bytes each. 1500 is 256x5 + 220 and 1000
    is 256x3 + 232. The subtraction is outlined below in Table 6-3 with explanation
    of what has to happen with the assembly code.


    | High Order Byte counts the 256s | Low order Byte counts the units | Decimal
    Values |

    | :--- | :--- | :--- |

    | 5 | 220 (Need to borrow from 256s, this makes C the not borrow bit C= 0) | 1500
    |

    | 3 | 232 | 1000 |

    | 5 - 3 – C = 1, C is 0 because of the borrow, therefore C is 1 | Uses the SUBWFB
    instruction. | |

    | | 220 + 256(borrow) – 232 = 244 | Uses the SUBWF instruction. |


    Something confusing to follow, but doesn’t cause a problem in practice, is the
    *SUBWFB* instruction, which is the subtract *W* from file with borrow used when
    subtracting the higher-order bytes in the multibyte subtraction. In a multibyte
    subtraction, if a subtraction has occurred where the result is either zero or
    positive, the carry bit in the *STATUS* register is set to 1. This is taken as
    meaning that no borrow was required. If the result of the subtraction is negative,
    the carry bit in the *STATUS* register is cleared to 0 meaning that a borrow was
    required. What happens next is that in the subtraction involving the next higher
    pair of bytes using *SUBWFB*, the state of the carry bit is taken into account.
    The working register *W* is subtracted from *F*. If C is 0, another 1 is subtracted.
    If C is 1, no extra 1 is subtracted. You don’t need to do anything other than
    use the instruction. This can be stated as follows:


    F – W – C -> destination (W or F) (also, the carry bit C is affected)


    Program 6-3 demonstrates this with Figure 6-5 showing its output. As the output
    is a 16-bit word, the *-h* option is used.


    ```asm

    ;PROG_06_03.asm

    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm_macros.inc>


    RADIX DEC ; Default numbers are to base 10.

    BOOK_CONFIGURATION ; See macro in fsm_macros.inc.


    CBLOCK 0x70

    TICKS ; Used to count 8.2ms ticks.

    Xa0 ; Minuend low byte.

    Xa1 ; Minuend high byte.

    Xb0 ; Subtrahend low byte.

    Xb1 ; Subtrahend high byte.

    Y0 ; Difference lowest byte.

    Y1 ; Difference highest byte.

    ENDC


    ORG 0X00

    GOTO START


    ORG 0X04 ; Interrupt vector.

    BCF INTCON, TMR0IF ; Clear the tmr0 overflow interrupt flag.

    INCF TICKS, F ; Increment by one the 8.2ms ticks.

    RETFIE ; Return from interrupt.


    START ;

    MOVLB 1

    SET_FREQ_32MHZ ; See file fsm_macros.inc.

    SET_TMR0_CASE1 ; Gives 8.1 ms ticks. See fsm_macros.inc

    MOVLB 3 ;

    SET_SERIAL_TX_16F1823 ; Set up EUSART.


    LOOP

    CLRF TICKS

    MOVLW 244

    IF_REG_LESS_THAN_W TICKS ; A delay of 2 seconds = 244*8.2 ms.

    GOTO $-3 ; We have to jump back two lines in the macro.


    ; Loading value int Xa 256*5 + 220 = 1500

    MOVLW 5 ; This can be expressed as MOVLW HIGH 1500

    MOVWF Xa1 ; Move 5 to Xa0. This is the high byte of 1500.

    MOVLW 220 ; This can be expressed as MOVLW LOW 1500

    MOVWF Xa0 ; Move 220 to Xa1. This is the low byte of 1500.


    ; Loading value into Xb 256*3 + 232 = 1000

    MOVLW 3 ; This can be expressed as MOVLW HIGH 1000

    MOVWF Xb1 ; Move 3 to Xb0. This is the high byte of 1000.

    MOVLW 232 ; This can be expressed as MOVLW LOW 1000

    MOVWF Xb0 ; Move 232 to Xb1. This is the low byte of 1000.

    CALL SIXTEEN_BIT_NUMBERS ; Call subroutine.

    CALL SIXTEEN_BIT_NUMBER ; Call subroutine.

    GOTO LOOP


    Subroutines.

    SIXTEEN_BIT_NUMBERS ; Y = Xa - Xb, note each variable has a high and low byte.

    CLRF Y1 ; Clear significant result byte.

    MOVF Xb0, W ; Move low byte to W.

    SUBWF Xa0, W ; Subtract W (Xb1) from Xa1, result. If the result is not negative
    there is no need for a borrow so the carry bit in STATUS is set to high. C is
    also referred to as ‘not borrow’.

    MOVWF Y0 ; Move low byte result to Y1.

    MOVF Xb1, W ; Move the Xb high byte to W.

    SUBWFB Xa1, W ; Subtract the ‘not borrow’ and W (Xb0) from Xa0 put the result
    in W.

    MOVWF Y1 ; Move the result to Y1, the high output byte.

    RETURN


    SIXTEEN_BIT_NUMBER

    BANKSEL REG

    MOVF Y1, W ; Put the high order byte in W.

    MOVWF TXREG ; Transmit W using the EUSART.

    BTFSS STA, TRMT ; Loop while waiting for TRMT to go high.

    MOVF Y0, W ; Transmit the low order byte of the result.

    BTFSS STA, TRMT ; Loop while waiting for TRMT to go high.

    RETURN

    END

    ```


    ## 6.4 • Binary Subtraction with Negative Results


    In the previous example, although the low order bytes gave a negative result,
    it was handled by borrowing from the high order bytes using the carry/borrow bit
    in *STATUS* register. If the high order subtraction has a negative result, how
    is this handled? I’ll start with the same program but modifying it so that 1500
    is subtracted from 1000 to give an answer of -500. This is Program 6-4, but the
    only difference is the input values shown here. To save space, only the modified
    part is in the book.


    ```asm

    LOOP

    CLRF TICKS

    MOVLW 244

    IF_REG_LESS_THAN_W TICKS ; A delay of 2 seconds = 244*8.2 ms.

    GOTO $-3 ; We have to jump back two lines in the macro.


    ; Loading value into Xb 256*3 + 232 = 1000

    MOVLW 3 ; This can be expressed as MOVLW HIGH 1000

    MOVWF Xa1 ; Move 3 to Xa0. This is the high byte of 1000.

    MOVLW 232 ; This can be expressed as MOVLW LOW 1000

    MOVWF Xa0 ; Move 232 to Xa1. This is the low byte of 1000.


    ; Loading value int Xa 256*5 + 220 = 1500

    MOVLW 5 ; This can be expressed as MOVLW HIGH 1500

    MOVWF Xb1 ; Move 5 to Xb0. This is the high byte of 1500.

    MOVLW 220 ; This can be expressed as MOVLW LOW 1000

    MOVWF Xb0 ; Move 220 to Xb1. This is the low byte of 1500.

    CALL SIXTEEN_BIT_NUMBERS ; Call subroutine.

    CALL SIXTEEN_BIT_NUMBER ; Call subroutine.

    GOTO LOOP

    ```


