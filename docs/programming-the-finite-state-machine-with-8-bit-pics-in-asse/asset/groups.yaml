    widely available, usually in Epoxy Glass Fabric Laminate or Synthetic Resin Bonded
    Paper. The former is more expensive. Components are mounted on the copper side
    by first drilling 0.5 mm diameter holes for component legs to pass through and
    then connecting the circuit on the non-copper side with thin single-core wires
    using soldered joints. The holes need to be countersunk to prevent the copper
    from touching the legs. The copper side of the board is used as a ground plane
    at 0 V. Any connections to 0 V can be soldered directly to the copper without
    a hole. There are a couple of...


