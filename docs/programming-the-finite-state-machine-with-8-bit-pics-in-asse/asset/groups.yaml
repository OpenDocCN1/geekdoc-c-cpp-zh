  - "[PAGE 76]\n\np\n\np\n\np\n\n● 77\n\nPage 130 in the datasheet shows a diagram\
    \ of the A/D multiplexing. The procedure for \n\nconfiguring an analog input channel\
    \ is as follows. For this program, only one pin will be \n\nused as an analog\
    \ input.\n\nThe port must be configured so that the pin is an input and set as\
    \ analog.\n\n*• *\n\n*TRISA* or *TRISC* is used for setting the pin as an input.\
    \ The default setting is input.\n\n*• *\n\n*ANSELA* and *ANSELC* are used to set\
    \ the inputs as analog. *ANSELC* is only on the \n\n16F1823. The default setting\
    \ is analog.\n\nThe channel used by the A/D converter must be selected. \n\n•\
    \ \n\nThe channel select bits *CHS* in *ADCON0* is used to select the channel.\n\
    \nVoltage reference must be selected. Voltage reference is what the input voltage\
    \ is being \n\nmeasured against. This can be the +5V supply, external voltage\
    \ reference or internal \n\nvoltage reference.\n\n• \n\nThe *ADPREF* bits in *ADCON1*\
    \ are used to select voltage reference.\n\nThe conversion clock must be set. Pages\
