    ## 4.4 • 模拟输入


    PIC 上的某些输入可以配置为将加在其上的电压转换为 0 到 1023 的数字，范围为 0 – 5V。PIC 12F1822 在其唯一的端口 (*PORTA*)
    上有四个模拟输入。PIC 16F1823 有八个模拟输入，四个在 *PORTA* 上，四个在 PORTC 上。尽管有多个模拟输入通道，但只有一个模拟数字转换器，因此你必须选择用于
    A/D 转换器的通道。


    程序 4-2 接收字节


    数据手册第 130 页显示了 A/D 复用图。配置模拟输入通道的步骤如下。对于此程序，将使用一个引脚作为模拟输入。


    必须配置端口以使引脚为输入并设置为模拟模式。


    - 使用 *TRISA* 或 *TRISC* 将引脚设置为输入。默认设置为是输入。

    - *ANSELA* 和 *ANSELC* 用于将输入设置为模拟。*ANSELC* 仅用于 16F1823。默认设置为是模拟。


    必须选择 A/D 转换器所使用的通道。


    - *ADCON0* 中的通道选择位 *CHS* 用于选择通道。


    必须选择电压参考源。电压参考是测量输入电压的基准。这可以是 +5V 电源、外部电压参考或内部电压参考。


    - *ADCON1* 中的 *ADPREF* 位用于选择电压参考。


    必须设置转换时钟。数据手册第 131 页和 132 页详细解释了此点。


    - *ADCON1* 中的 *ADCS* 位用于选择转换时钟。


    转换结果是一个 10 位字，在两个寄存器中：*ADRESH* 和 *ADRESL*。这些是模拟数字结果的高字节和低字节。我们可以对左侧位进行对齐，使最高 8
    位位于 *ADRESH* 中，最低两个位位于 *ADRESL* 中；或者我们可以右对齐，使最低 8 位位于 *ADRESL* 中，最高两个位位于 *ADRESH*
    中。数据手册中的图 16-3 显示了这一点。


    - 对齐通过 *ADCON1* 中的第 7 位 *ADFM* 设置。


    表 4-4 显示了模拟通道到引脚和 I/O 位的映射。注意通道编号并不总是与 I/O 编号匹配。在设置 *ADCON0* 中的 *CHS* 位时要小心。


    ### 模拟输入


    | 12F1822 端口 | 12F1822 引脚 | 12F1822 I/O | 12F1822 A/D | 16F1823 端口 | 16F1823 引脚
    | 16F1823 I/O | 16F1823 A/D |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | PORTA | 7 | RA0 | AN0 | PORTA | 13 | RA0 | AN0 |

    | PORTA | 6 | RA1 | AN1 | PORTA | 12 | RA1 | AN1 |

    | PORTA | 5 | RA2 | AN2 | PORTA | 11 | RA2 | AN2 |

    | PORTA | 3 | RA4 | AN3 | PORTA | 3 | RA4 | AN3 |

    | PORTC | 10 | RC0 | AN4 | PORTC | 9 | RC1 | AN5 |

    | PORTC | 8 | RC2 | AN6 | PORTC | 7 | RC3 | AN7 |


    表 4-4 模拟输入引脚


    此程序将读取 RA4 (*AN3*) 上的模拟电压。它将传输 A/D 转换器的可用最高位位供电脑读取。通过忽略两个最低位，分辨率为 20 mV 而不是 5
    mV。通过设置 *ADCON0* 中的第 1 位启动模拟数字转换。该位名为 *GO/DONE*，意味着当它置高电平时开始转换。转换完成后，硬件会将该位置低电平。代码内部是一个等待完成的循环。


    BTFSC ADCON0, 1 ; 此行和下一行循环直到转换完成。

    GOTO $-1


