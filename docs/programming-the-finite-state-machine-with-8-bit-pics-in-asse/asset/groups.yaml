    ;PROG_08_01.asm


    LIST P=16F1823


    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm_macros.inc>


    RADIX DEC ; 默认数字为10进制。


    BOOK_CONFIGURATION ; 参见 fsm\_macros.inc 中的宏。


    CBLOCK 0x70


    TICKS ; 用于计数 8.2ms 的滴答。


    SECONDS ; 用于存储秒数。


    ENDC


    ORG 0X00


    GOTO START


    ORG 0X04 ; 中断向量。


    BCF INTCON, TMR0IF ; 清除 tmr0 溢出中断标志。


    DECF TICKS, F ; 将 8.2ms 的滴答减 1。


    BTFSS STATUS, Z ; 测试 TICKS 是否达到零。


    GOTO $+4 ; 如果 TICKS 未达到零，则跳转到中断返回。


    INCF SECONDS, F ; 如果 TICKS 达到零，则增加秒数。


    MOVLW 122


    MOVWF TICKS ; 将 TICKS 恢复为 122 (122 x 8.2 ms =1秒)。


    RETFIE ; 中断返回。


    START


    MOVLB 1 ; 后续宏需要 Bank 1。


    SET_FREQ_32MHZ ; 参见文件 fsm\_macros.inc。


    SET_TMR0_CASE1 ; 产生 8.2 ms 的滴答。参见 fsm\_macros.inc。


    MOVLB 3 ; 后续宏需要 Bank 3。


    SET_SERIAL_TX_16F1823 ; 配置串口通信，参见文件 fsm\_macros.inc。


    MOVLB 3 ; 将上一个宏留在 bank 2，后续宏需要 bank 3。


    S0


    BTFSS SECONDS, 0 ; 如果最低位为高电平，则跳过下一行。


    GOTO S0 ; 如果最低位为低电平，保持在状态 0。


    S1


    DEBUG SECONDS ; 发送奇数秒


    S2


    BTFSC SECONDS, 0 ; 如果最低位为低电平，则跳过下一行。


    GOTO S2 ; 如果最低位为高电平，保持在状态 0。


    S3


    DEBUG SECONDS ; 发送偶数秒


    GOTO S0


    END


    在*START* 标签处有三个宏：


    - 用于设置频率，

    - 用于设置 timer0 以产生 8.2 ms 的中断滴答

    - 最后，是一个用于设置串口通信的宏，它将与串口读取程序配合。


    回到代码中中断向量处的几行，是中断服务程序。程序中只有一个有效中断：来自 timer0。第一件事是重置 timer0 中断标志 *TMROIF*。接下来，*TICKS*
    变量减 1，并测试 *STATUS* 寄存器中的零标志以检查 *TICKS* 是否已达到零。如果是，程序将跳过一行，*SECONDS* 变量加 1 以计数另一秒。然后将值
    122 重新载入 TICKS，最后返回中断。


    为了测试目前为止的程序，我们将通过串口线将 *SECONDS* 文件的值传输到计算机。


    程序 8-1 开发红绿灯的定时器


    调试 Debug 宏


    图 8-6 检测边缘的状态机


    由于我们还将进行其他测试，因此拥有一个可以放在程序中任何需要监控值地方的宏是有意义的。这里是该宏。它有一个参数：即要监控的寄存器或文件。在使用它之前必须选择
    Bank 3。


    DEBUG MACRO REG_TO_TX ; 需要 Bank 3。EUSART 必须配置为传输。


    MOVF REG_TO_TX, W


    MOVWF TXREG ; 通过加载 TXREG 开始传输


    BTFSS TXSTA, TRMT ; 轮询 TXSTA 的 TRMT 位以查看移位寄存器是否

    GOTO $-1 ; 空闲。参见数据手册第 271 页，第 26.1.1.14 段。


    ENDM ; 留在 bank 3。


    为了读取 *SECONDS* 文件，我们只需要将 *DEBUG* 宏放在循环中，它就会不断传输 *SECONDS* 中持有的值。遗憾的是，这可能会导致读取到错误的值。可以通过在传输之间引入
    25 ms 的延迟来解决这个问题，但你每秒只能得到约30 个输出……比你需要的多了 29 个。更优雅的解决方案是在 *SECONDS* 文件的最低位（LSB）每次上升沿和下降沿之后传输
    *SECONDS* 值。一个简单的四状态机提供了一种检测边缘的方法。如图 8-6 所示。从状态 0 开始，如果 *SECONDS* 的最低 LSB 为高电平，将跳转到
    *S1*，在其中传输 *SECONDS* 的值。传输后，将跳转到 *S2*，机器将等待 LSB 变为低电平，然后跳转到 *S3* 再次传输，最后返回到 *S0*
    等待 LSB 再次变为高电平。*S1* 发送 *SECONDS* 的奇值。*S3* 发送偶值。这被实现为一个 Moore 机器，其输出仅取决于当前状态。Mealy
    机器只需要两个状态，因为传输将在状态转换时完成。在这种情况下，对代码的影响几乎忽略不计，因为状态 1 和 3 仅仅是标签。（img/a08bd0095da48f76）


    图 8-7 测试秒计数


    图 8-8 测试输出


