    位和完整寄存器的名称可以从数据手册中获取。这里使用的 *TRISA2* 位位于数据手册的第 117 页。这些定义可以在 *xc.h* 包含的头文件 *pic12f1822.h*
    中找到。当我们编译代码时，我们会介绍 XC8 是如何知道你正在使用 12F1822 的。如果你想自己查看此文件，可以使用文本编辑器打开它。如果你使用的是 Linux，可以在
    **/opt/microchip/xc8/v2.10/pic/include/* 找到它；如果你使用的是 Windows，则可以在 *C:\Program
    Files (x86)\Microchip\xc8\v2.10\pic\include* 找到它。注意：版本可能会不同。


    下一行将振荡器频率设置为 31.25kHz。编程人员仍然需要了解硬件细节。请参阅芯片的数据手册（第 65 页设置 *OSCCON*）。


    最后，我们来到程序的逻辑部分。到目前为止，与汇编版本相比没有太大变化，但这就是使用 C 语言开始发挥优势的地方。程序的其余部分几乎是自然语言。有一个以 *while
    (1)* 开始的外部循环。C 语言中的 `while` 循环只要 `()` 括号内的表达式求值为逻辑上的真，就会一直执行。值 1 被视为真，0 被视为假，因此此循环将永远执行。循环包含一些代码，并以第一个左括号
    `{` 标记，以右括号 `}` 结束。对代码行进行缩进是一个好习惯，这样你就可以轻松看到循环等结构嵌套在其他结构内部。可以很容易看到 `while` 循环的结束，因为左右括号在垂直方向是对齐的。对于编译器来说，这并不重要。它不关心空格。你可以将整个函数放在同一行中，但不建议这样做。


    在 *while* 循环内部，有两个 *do* 循环。它们的目的与汇编版本中的延迟循环相同。*while* 循环和 *do* 循环的区别在于：


    - *while* 循环在开始时检查逻辑表达式。如果它为假，则会跳过它，因此可能完全不会执行。

    - *do* 循环在循环结束时检查逻辑表达式，因此它至少会被执行一次。无论计数器的值如何，它都会减1 1。这就是 `counter--` 的作用，然后在循环结束时检查该值。如果大于
    0，循环将再次进行，直到计数器为 0。程序随后离开循环并将输出置低。然后运行下一个循环：当它结束时，输出置高，然后外部 `while` 循环无限重复。


    在 *main(void)* 之后使用 *@0x20* 的目的是让编译器从此内存地址开始代码。这可以加速使用 *program_writer* 程序向芯片写入。


    ## 9.3.2 • 在 Microsoft Windows 中使用 XC8 编译器


    XC8 编译器从命令行使用，但非常快速且易用。通过使用批处理文件编写的脚本，并使用上下方向键调用之前的命令，它可以比 GUI 和鼠标点击更快。要做的第一件事是打开终端窗口。如果你使用
    Windows 资源管理器导航到 *working_windows* 目录并点击 *terminal_here.bat*，它将在工作目录中打开终端窗口。要将
    C 源文件编译生成 hex 文件，有两个批处理文件会调用 XC8 编译器：一个用于 12F1822 芯片，另一个用于 16F1823 芯片。这些批处理文件为您节省了每次运行编译器时向命令行添加
    *--chip=12F1822* 或 *--chip=16F1823* 的麻烦。


    ![](img/a08bd00952da48f769971864f33af432_156_0.png)


    除了 hex 文件外，编译器还会产生许多其他文件。可以通过从命令行运行 *clean.bat* 或在 Windows 资源管理器中点击它来轻松删除它们。


    ## 9.3.3 • 在 Linux 中使用 XC8 编译器


    在 Linux 上使用 XC8 编译器与在 Windows 上相同。在工作目录中有两个脚本，每种 PIC 各对应一个。如果 Microchip 更新了 XC8
    版本，你可能需要使用文本编辑器编辑这些脚本。要运行它们，如图 9-5 所示，在源文件名名前加上 `./`。还有一个清理脚本，用于删除 XC8 生成的除 hex
    文件以外的所有文件。


    ![](img/a08bd00952da48f769971864f33af432_156_1.png)


    ## 9.3.4 • 输出代码


    使用汇编语言时，你会使用如 *DECF* 这样的助记符。在助记符后面将有一个或多个参数：DECFSZ, F 等。要查看详细信息，请看数据手册第 30 页。使用汇编时，你编写的内容被翻译为机器。使用
    C 语言时，它由编译器处理。程序的形式与汇编版本相同。


    - DECFSZ, COUNTER; 一条指令


    - GOTO LOOP; 两条指令


    - BSF PORTA, LED; 三条指令


    - 9-4 Windows 示波器追踪

    - 9-5 Linux 示波器追踪

    - 9-6 汇编示波器追踪

    - 9-7 C 语言示波器追踪

    '
