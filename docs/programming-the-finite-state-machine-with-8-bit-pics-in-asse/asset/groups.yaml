    \ interrupt(void)\n{\n  if (IOCAF5) // Check to see if it's the interrupt on change.\n\
    \  {\n    IOCAF5 = 0; // Reset the interrupt flag.\n  }\n  else // As only two\
    \ interrupts enabled it must be timer0 overflow.\n  {\n    TMR0IF = 0; // Reset\
    \ the interrupt flag.\n    tick_counter++;\n  }\n}\n\nvoid main() @ 0x20\n{\n\
    \  OPTION_REG = 0xD7; // See Table 2-2 in the book.\n  INTCON = 0xE0; // See Table\
    \ 2-3 in the book.\n  IOCIE = 1; // IOCIE is Interrupt on Change bit. It is in\
    \ the INTCON register (bit 3) so the previous line could have been written as\
    \ INTCON = xE8, and this line omitted.\n  TRISC = 0; // Set all PORTC as outputs.\n\
