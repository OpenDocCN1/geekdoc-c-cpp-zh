    \ 6 章中命名为 *Y3, Y2, Y1* 和 *Y0* 的程序。我们将利用位移和位与 *AND* 运算。\n\n| 字节 3 | 字节 2 | 字节 1\
    \ | 字节 0 |\n| :--- | :--- | :--- | :--- |\n| 31 | 23 | 15 | 7 |\n| 30 | 22 | 14\
    \ | 6 |\n| 29 | 21 | 13 | 5 |\n| 28 | 20 | 12 | 4 |\n| 27 | 19 | 11 | 3 |\n| 26\
