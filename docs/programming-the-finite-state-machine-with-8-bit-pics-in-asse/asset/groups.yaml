    \ substituted with FLAGS, VALUE M1\\_S0 and M1\\_S1 in the program.\n\n## 3.2.3\
    \ Conditional Assembly\n\nOne of the macros above is SET\\_FREQ\\_32MHZ to set\
    \ the oscillator frequency. We could write more macros, one for each available\
    \ frequency, but there is another way allowing us to select different code within\
    \ the macro, depending on the value of the argument to the macro. Conditional\
    \ assembly has if statements selecting different assembly code to be placed in\
    \ our source code. Here is an example for frequency selection. The macro takes\
    \ an argument specifying the required frequency and the macro inserts the relevant\
    \ code according to the if statements. Each if statement is terminated by an endif.\n\
    \nSET\\_FREQ\\_HZ MACRO ARG0\n    if (ARG0 == 32000000);\n    MOVLW 0x70;\n  \
    \  endif;\n    if (ARG0 == 16000000)\n    MOVLW 0x78;\n    endif;\n    if (ARG0\
    \ == 4000000)\n    MOVLW 0x68;\n    endif;\n    if (ARG0 == 2000000)\n    MOVLW\
    \ 0x60;\n    endif;\n"
