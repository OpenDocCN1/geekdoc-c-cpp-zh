    \n## 9.3.6 • The __delay() functions\n\nThere are delay functions available in\
    \ XC8 whereby specifying the frequency of the clock\nyou can call a function with\
    \ the required delay in milliseconds or microseconds. These\nfunctions provide\
    \ the delay by spinning through clock cycles. This will block your program\nfrom\
    \ doing anything else. If you need a small delay, one that is not going to get\
    \ in the way\n- they are convenient to use. Program 9-3 uses the __delay()* function\
    \ to flash an LED on\nfor 0.25s and off for 0.5s. It is very simple to use but\
    \ while the delay is in progress, nothing\nelse can happen. Only two useful instructions\
    \ are being carried out every second. This is\nnot a good method other than for\
    \ very short delays.\n\nFigure 9-8 Oscilloscope Trace for the C Version with Interrupt-Based\
    \ Timing\n\n//prog_09_03_delay\n\n#include <xc.h>\n\n// PIC16F1823 Configuration\
    \ Bit Settings\n\n// CONFIG1\n\n#pragma config FOSC = INTOSC\n\n#pragma config\
    \ WDTE = OFF\n\n#pragma config PWRTE = OFF\n\n#pragma config MCLRE = OFF\n\n#pragma\
    \ config CP = OFF\n\n#pragma config BOREN = OFF\n\n#pragma config IESO = OFF\n\
    \n#pragma config FCMEN = OFF\n\n// CONFIG2\n\n#pragma config LVP = ON\n#define\
    \ _XTAL_FREQ 32000000 /* #define sets _XTAL_FREQ to 32 MHz, this tells\nthe compiler\
    \ the frequency so it can set the number\nof clock cycles for the required delay.*/\n\
    \nvoid main() @ 0x20\n{\n TRISA2 = 0;\n OSCCON = 0x70; // Page 65 32 MHz See Table\
    \ 2-1 in the book.\n OPTION_REG = 0xD7; // Page 164 in the datasheet and Table\
    \ 2-2 in the book.\n while (1) // Never ending loop.\n {\n __delay_ms(750); //\
    \ Function argument is in milliseconds.\n RA2 = 1;\n __delay_ms(250); // Function\
    \ argument is in milliseconds.\n RA2 = 0;\n }\n}\n\n## 9.3.7 Extending the If\
    \ Statement\n\nFor making decisions in the program, the if..else statement is\
    \ much easier to use than\nwriting assembly code... even if you write macros to\
    \ make it readable. What if the choices are complicated that more than one thing\
    \ might be true but you want to favour one over another? As a simple example,\
    \ suppose the LED is off for the first 3s after-up, and on for the next 5s to\
    \ then run at quarter power for 4s, then repeat the sequence. The way we extend\
    \ the if statement is to use else if. This allows us to prioritise decisions.\
    \ The change to LED on occurs at 3s. The change to 1/4 power occurs at 7s and\
    \ then back to LED off at 12s. There are 122 ticks in a second, so to reach 12s\
    \ requires a count of 1464 ticks. This is too many for a single byte. Therefore,\
    \ we need to use two bytes to count this high. We can let the compiler do the\
    \ work and declare counter variable an unsigned integer, allowing a count up to\
    \ 65535. To make it even convenient you can let the compiler multiply the seconds\
    \ by 122 so you don't have to. This arithmetic is performed before compilation\
    \ and therefore doesn't add to the code in the PIC. Program 9-4 is shown below.\
    \ In addition to the tick_counter, there is a dim_counter variable declared as\
    \ unsigned character. This gets incremented whenever else part gets executed.\
    \ The dim_counter gets divided by 4 so that once of every 4 increments there is\
    \ no remainder. The expression dim_counter%4 gives the remainder. If it is zero,\
    \ the LED is turned on as dim_counter%4 == 0 evaluates to true otherwise false.\
    \ Every fourth time the else part is used, the LED is on. The other three times\
    \ it is off. This cuts the average power supplied to the LED to one quarter.\n\
    \nProgram 9-3 Use of A __delay() Function\n\n//prog_09_04\n\n#include <xc.h>\n\
    \n// PIC16F1823 Configuration Bit Settings\n\n// CONFIG1\n\n#pragma config FOSC\
    \ = INTOSC\n\n#pragma config WDTE = OFF\n\n#pragma config PWRTE = OFF\n\n#pragma\
    \ config MCLRE = OFF\n\n#pragma config CP = OFF\n\n#pragma config BOREN = OFF\n\
    \n#pragma config IESO = OFF\n\n#pragma config FCMEN = OFF\n\n// CONFIG2\n\n#pragma\
    \ config LVP = ON\n#define TICKS_PER_SECOND 122 // Define the constant TICKS_PER_SECOND\
    \ as 122.\nunsigned int tick_counter = 0; // This variable is defined as an unsigned\
    \ integer.\n\nvoid interrupt tick(void)\n{\n TMR0IF = 0; // Clear TMR0 overflow\
    \ interrupt flag.\n tick_counter++; // 8.2 ms ticks.\n}\n\nvoid main() @ 0x20\n\
    {\n TRISA2 = 0;\n OSCCON = 0x70; // Page 65 in 32 MHz See Table 2-1 in the book.\n\
    \ OPTION_REG = 0xD7; // Page 164 in the datasheet and Table 2-2 in the book.\n\
    \ INTCON = 0xE0; // Page 86 in the datasheet and Table 2-3 in the book.\n unsigned\
    \ char dim_count = 0; // Declare and initialise variables.\n while (1){ // Never\
    \ ending loop.\n if (tick_counter < 122*3 ) // First choice if tick_counter <\
    \ 366.\n {\n RA2 = 0; // Output is off.\n }\n else if (tick_counter < 122*8) //\
    \ Second choice if tick_counter < 976.\n {\n RA2 = 1; // Output is on.\n }\n else\
    \ if (tick_counter < 122*12) // Third choice if tick_counter < 1464.\n {\n dim_count++;\
    \ // Increment the dim counter by 1.\n LATA2 = dim_count%4 == 0; // LED on for\
    \ 1/4 of the time.\n }\n else // No other choice.\n {\n tick_counter = 0; // If\
    \ all of the above are untrue\n } // when 12 s has been reached.\n }\n}\n\nIn\
    \ this program, there has been no explicit state machine used, although the if\
    \ statements behave like a state machine.\n\n## 9.3.8 • The Switch Statement\n\
    \nIn previous assembly programs, we used the GOTO to branch to a particular state.\
    \ In C there is a switch followed by parenthesis. Here is the form of the switch:\
    \ match the value of an integer. A very important point to remember is at the\
    \ end of each case you have to have a word break. State machine programs in this\
    \ book have favoured the Mealy type where outputs are dependent on current state\
    \ and inputs. If you look at Program 9-5, this is a Moore machine because the\
    \ outputs are driven depending on the state. Refer to Figure 2-10. Although the\
    \ program does not explicitly name the two states, an experiment was made to measure\
    \ the speed improvement is shown in paragraph 9.3.9. Program 9-6 introduces the\
    \ bool type that is used for the update signal. To use it in the code, you have\
    \ to include the *stdbool.h* file.\n\n//prog_09_05\n\n#include <xc.h>\n\n// PIC16F1823\
    \ Configuration Bit Settings\n\n// CONFIG1\n\n#pragma config FOSC = INTOSC\n\n\
