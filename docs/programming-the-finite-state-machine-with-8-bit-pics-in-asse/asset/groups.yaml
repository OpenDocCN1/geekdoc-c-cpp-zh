- md: "\nSET\\_TMR0\\_CASE1 MACRO ; Bank 1 required. Gives 8.2 ms ticks.\n    MOVLW\
    \ 0xD7 ; See Table 2-2 in the book.\n    MOVWF OPTION\\_REG ; Page 164.\n    MOVLW\
    \ 0xE0\n    MOVWF INTCON ; Page 86 in the datasheet and Table 2-3 in the book.\n\
    ENDM ; Leaves in bank 1\n\nAnother one to set up timer0 to generate an overflow\
    \ interrupt at a rate of 976.56 interrupts per second (every 1.024 ms). The difference\
    \ is the Prescaler ratio is 1/32 instead of 1/256.\n\nSET\\_TMR0\\_CASE2 MACRO\
    \ ; Bank 1 required. Gives 1.024 ms ticks.\n    MOVLW 0xD4 ; See Table 2-2 in\
    \ the book.\n    MOVWF OPTION\\_REG ; Page 164.\n    MOVLW 0xE0\n    MOVWF INTCON\
    \ ; Page 86 in the datasheet and Table 2-3 in the book.\nENDM ; Leaves in bank\
    \ 1\n\nTo save space in the book, a macro to set the bits in the configuration\
    \ words:\n\nBOOK\\_CONFIGURATION MACRO\n    __CONFIG 0X8007, (_FOSC\\_INTOSC &\
    \ _WDTE\\_OFF & _PWRTE\\_OFF & _CP\\_OFF & _BOREN\\_OFF & _IESO\\_OFF & _FCMEN\\\
    _OFF)\n    __CONFIG 0X8008, (_LVP\\_ON)\nENDM\n\nHere is another if ...else macro\
    \ to compare a register value to see if it is greater than or equal to the value\
    \ in the working register. There is only one difference between this and the other\
    \ if else macro. This is the skip is on carry clear instead of carry set.\n\n\
    IF\\_REG\\_GREATER\\_THAN\\_OR\\_EQUAL\\_W MACRO ARG1\n    SUBWF ARG1, W\n   \
    \ BTFSC STATUS, C ; See SUBWF on page 320, if ARG1 >= W, C = 1\nENDM\n\n; The\
    \ ‘if’ code here - this will be a GOTO to jump over the else code.\n; The ‘else’\
    \ code here.\n\nProgram 3-2 is program 2-2 but using macros. The macros are shown\
    \ in bold.\n\n; prog\\_03\\_02.asm\n; This is prog\\_02\\_02.asm using macros.\n\
    ; Page numbers refer to the data sheet DS40001413E.\n; Tables refer to the book.\n\
    \nLIST P=12f1822\n#INCLUDE <p12f1822.inc>\n#INCLUDE <fsm\\_macros.inc>\nRADIX\
    \ DEC ; Default numbers are to base 10.\n\n**BOOK\\_CONFIGURATION** ; See macro\
    \ in fsm\\_macros.inc.\n\nCBLOCK 0x70 ; In common RAM, accessible in all banks.\n\
    \    TICK\\_COUNTER\n    PULSE\\_COUNTER\nENDC\n\nORG 0X00\n    GOTO START\n\n\
    ORG 0X04 ; Interrupt vector.\n    BCF INTCON, TMR0IF ; Clear the tmr0 overflow\
    \ interrupt flag. INTCON is in all banks.\n    INCF TICK\\_COUNTER, F ; Increment\
    \ by one counter.\n    RETFIE ; Return from interrupt\n\nSTART\n    MOVLB 1 ;\
    \ To access TRISA, OSCCON, OPTION\\_REG.\n    BCF TRISA, 2 ; Configure PORTA bit\
    \ 2 (chip pin 5) as an output\n    **SET\\_FREQ\\_32MHZ** ; See macro in fsm\\\
    _macros.inc.\n    **SET\\_TMR0\\_CASE1** ; See macro in fsm\\_macros.inc.\n  \
    \  MOVLB 0 ; To access PORTA for the rest of the program.\n    BSF PORTA, 2 ;\
    \ Initialise LED on;\n\n;-----------Machine States.\n\nS0 ; LED on. Fast cycle.\n\
    \    MOVLW 4\n    IF\\_REG\\_LESS\\_THAN\\_W TICK\\_COUNTER\n    GOTO S0 ; C in\
    \ STATUS found not set. Stay in this state.\n    BCF PORTA, 2 ; Turn LED off\n\
    \    CLRF TICK\\_COUNTER ; Reset the tick counter.\n    INCF PULSE\\_COUNTER,\
    \ F ; Add 1 to PULSE\\_COUNTER and put the result in PULSE\\_COUNTER.\n    ; Continue\
    \ to S1\n\nS1 ; LED off. Fast cycle.\n    MOVLW 10\n    **IF\\_REG\\_LESS\\_THAN\\\
