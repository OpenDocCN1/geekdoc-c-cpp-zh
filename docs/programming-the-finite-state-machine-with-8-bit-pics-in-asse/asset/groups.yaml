    This is no different to the way we count in tens. The number 364 is four lots
    of units plus

    six lots of tens plus three lots of hundreds. Each place is weighted by a factor
    of ten. If we

    add 6 to 364 it becomes 370. The units position has overflowed and the value of
    ten has

    been carried and added to the tens position. The same happens with binary addition.
    Here

    are three separate examples:


    When an addition results in the overflow of a byte, a carry is generated that
    adds to the

    next byte. If the first byte counts up to 255, the next will count the number
    of 256s

    and on with the next higher byte counting the number of 65536s and on.


    ### 1.3.2 The Hexadecimal Numbering


    In everyday life, we use the decimal system. Microcontrollers and computers

    operate using the binary system as above using bits and bytes. Converting the

    expression of a value backward and forwards to a binary pattern is not very convenient.

    There is an alternative to the decimal system that uses 16 characters instead
    of the ten

    What makes this convenient is that a group of four bits has sixteen permutations.

    To have 16 characters representing the values from 0-15, the letters A to F are
    used

    for 10, 11, 12, 13, 14, and 15. This means that a byte’s value can be represented
    by

    two hexadecimal digits. Figure 1-11 shows an example of the decimal number 44
    which

    is 00101100 as eight bits displayed as hexadecimal 0x2C. Two ways of indicating
    that

    number is being expressed in hexadecimal notation, are to prefix it with ‘0x’
    or suffix it

    with ‘h’. Hexadecimal offers a way of writing binary numbers in a way that is
    easier than

    long strings of ones and nought in a way that can be converted to individual bits.


