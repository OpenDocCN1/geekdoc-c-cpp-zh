    }\n```\n\n函数名为 *tx_long_int*。你可以为函数命名：标准是使用小写。C 是大小敏感的，名称必须以字母开头，也可以用下划线开头。库函数使用下划线开头是为了避免名称冲突。最好不要用下划线开头命名。下划线可以在名称内部自由使用。由于名称中不能有空格，下划线提供了一种易读的单词组合方式。此函数接收一个变量：一个要传输的长整型。参数在函数名后的括号中声明，其数据类型为\
    \ `long int`，名称为 *w*。变量 *w* 在函数的局部作用范围内，当函数被调用时，要赋给 w 的值会被传递给它。变量 *w* 不能在该函数以外的任何地方写入或读取。它的初始赋值被称为“值传递”。当调用函数时（例如在主函数某处），编写函数名并在括号内传入传递的值。它可能像这样出现在主函数（或其他函数）中：\n\
