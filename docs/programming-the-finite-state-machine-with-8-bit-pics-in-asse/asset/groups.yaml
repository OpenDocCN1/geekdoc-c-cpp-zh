    \ connection with Program 2-3, the update used a data type called bool, however\
    \ a bool needs space. If you need several bools there is another way to do it.\
    \ XC8 compiler has a data type called bit that is an integer 1 wide, it can have\
    \ a value of 0 or 1. XC8 will pack eight of these into a byte, you don’t have\
    \ to do anything other than use them. One point regarding how you declare them\
    \ Normally when variables are declared they only have the scope of the function\
    \ they are declared in. When that function returns these variables cease to exist\
    \ are referred to as automatic. They have to be either static or global. A static\
    \ variable stays in existence. To declare a variable as static you put static\
    \ before the declaration.\n\n```c\n// prog_04 Voltmeter in C\n#include <xc.h>\n\
    // PIC16F1823 Configuration Bits\n#pragma config FOSC = INTOSC\n#pragma config\
