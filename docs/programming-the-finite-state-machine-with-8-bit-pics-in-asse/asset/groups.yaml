    ## 3.3 Subroutines


    Another way of writing reusable code is to use a subroutine. A subroutine is a
    chunk of

    code that stands apart from your main program. It gets called as required. When
    it gets

    called, the main program is temporarily halted. The subroutine code runs and then
    when

    it finishes, and the main program continues. We could achieve the same result
    by using

    macros, however, every time you use a macro the code that makes up the macro gets

    inserted into the code and you end up with lots of duplicated code taking up program

    memory space. The subroutine only appears once in the program memory. The downside

    is that there is a time overhead in calling a subroutine. The decision to use
    a subroutine

    or a macro depends on how you want to optimize your code. If the macro is long,
    then a

    subroutine would save more space. If the macro is only a couple of lines, then
    the call and

    return overhead might make the macro a better choice.


    ### 3.3.1 An Example of a Subroutine


    To demonstrate how a subroutine call and return works, here is a short program
    that again

    flashes an LED. It will be on for 1 second and off for 2 seconds. Instead of using
    a timer with

    an interrupt, it uses a subroutine that wastes clock cycles to give delays. I
    have said that

    spinning around loops counting clock cycles is not a good thing, however, this
    is to merely

    demonstrate a subroutine call.


    To create a subroutine, start the routine with a label at the left end of the
    line and follow

    it with whatever code you need. End the routine with the instruction RETURN or
    RETLW.

    Refer to the datasheet on page 319 for information about RETLW. Program 3-4 shows
    the

    program. There are two states, LED on and LED off. While in each state, the subroutine

    called DELAY is called. This subroutine has two nested loops that count down.
    When finished,

    the program resumes on the line after the call. To set the delay period, a value
    is moved

    into BUFFER0 prior to the subroutine call.


    ```assembly

    ;prog_03_04.asm

    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm_macros.inc>

    RADIX DEC ; Default numbers to base 10.

    BOOK_CONFIGURATION

    CBLOCK 0x70

    BUFFER0

    BUFFER1

    ENDC

    ORG 0X00

    GOTO START

    START:

    CLRF BUFFER1

    MOVLB 1 ; OSCCON, OPTION_REG

    SET_FREQ_HZ 125000 ; Page 65 125k, and fsm_macros.inc.

    BCF TRISA, 2 ; Make RA2 an output

    MOVLB 0 ; To access PORTA for the rest of the program.

    ;Machine states

    S0 ; LED on.

    MOVLW d’40’ ; 40 gives ~0.99 seconds.

    MOVWF BUFFER0 ; Load buffer prior to subroutine call.

    CALL DELAY ; Call subroutine.

    BCF PORTA, 2 ; Turn LED off.

    On to state 1 return.

    S1 ; LED off.

    MOVLW d’80’ ; 80 gives ~1.99 seconds.

    MOVWF BUFFER0 ; Load buffer prior to subroutine call.

    CALL DELAY ; Call subroutine.

    BSF PORTA, 2 ; Turn LED on.

    GOTO S0 ; Back to state 0.


    Subroutine

    DELAY

    DECFSZ BUFFER1, F

    GOTO $-1 ; Go round 256 times, inner loop total of 256*3 + 1 = 769 instruction
    cycles.

    DECFSZ BUFFER0, F

    GOTO DELAY ; Go round by the number of times loaded into BUFFER0, outer loop.

    RETURN ; Return from subroutine

    END

    ```


    ### 3.3.2 Return Address and the Stack


    When the CALL instruction is used, the value of the program counter plus 1 (*PC+1*)
    is

    pushed on the top of the stack. The stack was mentioned before describing the
    return from the

    chapter. The location of the subroutine is then moved into the program counter
    so that the subroutine is now executed. If you look at page 39 in the datasheet
    there is an explanation of the stack. As mentioned in Chapter 1, these two PICs
    have 2048 program words and therefore the programs will not cross a boundary.
    Refer to datasheet page 18.


    ### 3.3.3 Calculating the Delay


    Here is an explanation of how the time was calculated: The inner loop goes around
    256 times because it starts at 0 and decrements by one back to zero. Each loop
    is made up of 3 instruction cycles: one for DECFSZ and two for GOTO. There is
    one extra for the final DECFSZ as it is two instruction cycles when the skip is
    required. Consequently, each call to the inner loop from the outer loop needs
    769 instruction cycles (256*3 + 1 = 769). The outer loop runs around the number
    put into BUFFER0 before the subroutine call. If we put 40 into BUFFER0, it will
    give a total of 30885 instructions (769x40 + 40x3 + 1 + 2 + 2 = 30885 instruction
    cycles per subroutine call). As the clock frequency is 125kHz, the time interval
    of one instruction is as follows: 1/125000 = 8 microseconds. This gives an on
    subroutine time as 1.02 seconds (30885 x 32x10-6 = 1.019 seconds).


    This is not the end of the story. There are three more instruction cycles in state
    S0 that add a further 96 microseconds. The point to note is that it is the number
    of cycles inside a loop that matter. Their time period gets multiplied by the
    number of times around the outside loop. The same explanation can be applied to
    S1 state for the LED off period. Furthermore, oscillator frequency can be trimmed
    by setting bits in the OSCTUNE register. See page 67 of the datasheet.


    ### 3.3.4 Calling Subroutines from Subroutines


    The purpose of the stack is to store return addresses for subroutines and interrupts.
    It is 16 deep so it is possible to call subroutines from subroutines and to return
    in reverse to the main program. See the diagrams starting on page 39 of the datasheet.
    To demonstrate this, Program 3-5 splits the two loops into two subroutines so
    that the first subroutine gets called by the main program and then calls the second
    subroutine. The second subroutine contains one loop that goes around 256 times,
    each time it is called. The second subroutine gets called again and again by the
    first subroutine. The number of times is determined by the value placed in BUFFER0
    by the main program before calling the first subroutine.


    ```assembly

    ;prog_03_05.asm

    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm_macros.inc>

    RADIX DEC ; Default numbers to base 10.

    BOOK_CONFIGURATION

    CBLOCK 0x70

    BUFFER0

    BUFFER1

    ENDC

    ORG 0X00

    GOTO START

    START:

    CLRF BUFFER1

    MOVLB 1 ; OSCCON, OPTION_REG

    SET_FREQ_HZ 125000

    ...

    ```

