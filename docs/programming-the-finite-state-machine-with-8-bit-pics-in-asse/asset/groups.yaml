    状态图（statechart）胜出。使用状态机，可以更容易分离具有特定目的的代码。这引出了下一段的主题。


    ![](img/a08bd00952da48f769971864f33af432_136_0.png)


    ## 8.3 • 将大问题分解为较小问题


    如果你的项目涉及多项任务，请将其拆分为不同的部分。在电压计项目中，程序必须使用模数转换器读取输入电压，然后判断电压是否高于 111 mV。如果是，则必须对此转换的原始结果进行缩放，以用毫伏表示。必须提取组成输出的各个数字，直到实现项目的所有功能。这些操作中的每一步都应该被视为一个独立的问题。这就是状态机方法可以发挥作用的地方，因为你可以拥有只执行一项任务的状态，或者执行少数几个任务的机器。子程序和宏也有助于可靠性。在编写出可以运行的代码后，它可以被重复使用并被依赖。在开发代码时，将其编写成小部分，以便它们可以进行独立测试。这种测试可以通过编写短小的微型项目来测试单个代码块来实现。


    ## 8.4 • 详细阅读你的代码并添加注释


    花时间仔细阅读你的代码。仔细尝试视觉化正在发生的情况。首先，为每一行代码添加注释。这将迫使你思考每一个细节。你可能是唯一读过这些注释的人，但当你日后查看代码时，它们将非常有用。如果你出于任何原因更改了代码，请保持你的状态图与代码同步并更新你的注释。错误的注释会让人非常困惑！


    ## 8.5 • 调试运行中的程序


    由于本书没有要求使用 Microchip 的 PICKIT 编程器/调试器，我们而是使用 FTDI 线缆和书中提供的程序。我们无法利用图 8-1 状态图和流程图进行“在线”调试。然而，我们可以利用
    FTDI 线和 `serial_reader` 程序并将数据输出到计算机。这等同于在 Python、C 或其他语言中放置打印语句以辅助调试。我们将做的是编写一个调试宏，它可以插入到任何地方，将变量值输出到计算机，以查看正在发生什么。


    ## 8.6 • 交通灯


    这是一个用来练习上述要点的小项目。第一步是定义程序将做什么。我们的交通灯将由六个 LED 组成，代表两组红、黄绿灯。它们模仿了道路施工中用于控制单行交通流量的类型。


    ![](img/a08bd00952da48f769971864f33af432_137_0.png)


    上电时，两组灯都将显示红灯并保持 10 秒。然后 A 组将变为红黄色持续 2 秒，然后变为绿色。在另外 20 秒后，A 组将变为黄色持续 5 秒，然后变为红色。两组灯都将保持红色
    10 秒，然后 B 组经历相同的变化。此循环将一直重复直到断电。此外，还有一个信号可以启用灯光序列。如果该信号变为低电平，序列将在下一个双红灯处停止。在启动序列之前，两组灯红亮的整个
    10 秒期间，启用信号必须保持高电平。


    根据文字描述，我们需要确定系统可能处于的不同状态。图 8-2 施工交通控制


    | 状态 | A 组灯 | B 组灯 |

    | :--- | :--- | :--- |

    | 0 | 红 | 红 |

    | 1 | 红黄 | 红 |

    | 2 | 绿 | 红 |

    | 3 | 黄 | 红 |

    | 4 | 红 | 红 |

    | 5 | 红 | 红黄 |

    | 6 | 红 | 绿 |

    | 7 | 红 | 黄 |


    确定了所需的状态后，下一步是确定触发这些条件的允许转换和输入条件。这是一个非常简单的例子，状态一个接一个地循环。到目前为止，状态机一直遵循 Mealy 格式，输出取决于当前状态。输入和输出显示在图中转换箭头旁边。Moore
    机器的区别在于输出仅取决于当前状态。对于本项目，我将使用 Moore 形式。输出仅取决于当前状态，并显示在每个状态的框内。


    ![](img/a08bd00952da48f769971864f33af432_138_0.png)


    向状态状态转换由状态 0 和 4 决定。在启动序列之前，两组灯红亮的整个 10 秒期间，启用信号必须保持高电平。如果该信号变为低电平，序列将在下一个双红灯处停止。图
    8-3 交通灯状态


    ## 8.6.1 • 电路图


    在编写代码之前，你需要规划电路。FTDI 线和 LED 需要限流电阻。这些电阻的数值约为 1kΩ。


    ![](img/a08bd00952da48f769971864f33af432_139_0.png)


    ## 8.6.2 • 分离问题


    程序需要计数到 20 秒。我们首先编写实现此目的的代码并对其进行测试。根据之前的程序，我们可以创建一个基于中断的计数器，基于 timer0 生成 8.2ms
    的脉冲。122 个脉冲大约是 1 秒。程序 8-1 是计时器的测试程序。


    ## 8.6.3 • 生成代码


    在生成上述状态机的代码之前，PIC 需要特定的配置，包括配置文件设置、振荡器频率和端口配置。最好的方法是分部分进行，边写边测试。这种测试将以添加调试代码的形式进行，证明你添加的每一部分都是正常的且可以依赖的。编写一个完整的程序然后尝试让它运行不是可行的方法。


    ![](img/a08bd00952da48f769971864f33af432_140_0.png)


    图 8-5 子状态的使用


