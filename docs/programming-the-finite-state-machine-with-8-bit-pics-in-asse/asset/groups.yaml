    ## 第1章 入门


    ### 1.1 引言


    不要被“有限状态机”（Finite State Machine, FSM）这类听起来很专业的词汇吓倒。它们的工作原理其实很容易理解。首先，这种机器并不是一个你必须实际构建的实体机器，它仅仅是你程序中的一种结构。其核心思想是将程序分解为固定数量的状态。当程序处于这些状态之一时，它可以对一组输入或事件做出响应，导致程序跳转到另一个状态。程序的输出仅取决于状态（摩尔机
    Moore machine）或取决于状态和输入（梅利机 Mealy machine）。让我们从基本的“Hello World”微控制器程序开始，通过闪烁 LED
    作为一个作为一个具有两个状态（LED 开启和关闭）的状态机示例。


    ![](img/a08bd00952da48f769971864f33af432_9_0.png)


    图 1-1 显示了程序的功能以及如何编写。


    该程序的功能是：


    - 上电后，初始状态为 LED 开启，且定时器重位并启动。

    - 定时器到期后，LED 关闭，定时器重位并启动。

    - 定时器再次到期后，LED 开启，定时器重位并启动。

    - 这一过程持续进行，直到微控制器断电。


    在这个示例中，只有一个事件会触发状态变化：即定时器到期。到期的影响取决于当前状态——它可能会跳转到 LED 开启状态或 LED 关闭状态。输入或事件仅由当前状态使用的这一事实，有助于让复杂的程序变得更健壮且更易于理解。这个示例是一个梅利机，其输出或动作由当前状态和输入决定。在状态图中，状态之间的转换由箭头表示。箭头旁边是触发转换的输入条件以及产生的输出。在摩尔机中，输出仅取决于机器的当前状态。输出将显示在图中状态内部。本书专门针对实用的程序。我不会尝试去遵循严格的定义。至于如何编写程序（图
    1-1 一个双状态机器），你已经通过规划完成了最重要的一部分。现在要做的仅仅是将图表实现为代码，这样可以减少出错概率，因为你可以专注于局部细节。本书将主要使用梅利型机器。引起转换的输入将用正斜杠与输出分开。这将写在两个状态之间的转换旁边。关于
    FSM，输入和输出（I/O）并不限于电气 I/O。它们还包括其他类型的变化。输入可以是定时器超时，输出可以是向 CPU 寄存器中写入一个值。FSM 可以用几乎任何编程语言编写。


    ### 1.2 实际实现


    微控制器项目并不需要昂贵。书中贯穿使用的两个 PIC 是 12F1822 和 16F1823 变体。它们都是廉价的中端设备，在撰写本书时，它们在英国的价格不到
    1 英镑。它们以双直插封装（DIP）形式提供，易于焊接，也可以插入插座中。程序将在文本编辑器中编写，并使用开源汇编器 `gpasm` 进行汇编。若要将将的程序加载到
    PIC 中，你可以使用如 PICKIT 3 这样的编程器，但没有必要购买一个。本书编写了两个程序，可以使用 FTDI USB 线缆 *TTL-232R-5V-WE*
    进行读写。同样的线缆也可以在后续项目中用于读取和写入 PIC 中的数据。


    #### 1.2.1 操作系统的选择


    可以使用 Microsoft Windows 或 Linux 来汇编和加载程序到 PIC 中。你可以从 Elektor 网站免费下载两个归档文件：一个适用于
    Windows，另一个适用于 Linux。这些文件包含了书中示例以及上述应用程序的所有源文件。正如前言中所述，书中在 Linux 还是 Windows 中都统一使用了命令行方法。对于那些还记得使用
    DOS 的人来说，在终端中输入命令可能看起来像是回到了上个世纪。然而，这是一种非常简单的方法，特别是对于像运行汇编程序或将程序加载到 PIC 这样的重复性任务。可以通过脚本简化任务以节省输入，并可以使用向上和向下键找回最近的命令。如果你使用
    Linux，输入历史（typing history）将列出你之前使用过的命令的编号列表。可以使用感叹号后跟数字来重新运行它们。自动补全允许你使用 `tab`
    键列出可能的文件。你永远不需要输入完整名称。如果你乐于使用文本文件为电子设备编写源代码，那么使用命令行应该是逻辑上的选择。图形用户界面（GUI）有其优势。然而，如果你在做重复性的工作，与运行脚本或调用之前的命令及其选项相比，频繁点击鼠标甚至使用键盘快捷键都是枯燥的。


    #### 1.2.2 机器语言与汇编源文件


    PIC 微控制器需要通过将机器码加载到闪存器中编程。最后一句中的“编程”是指将机器码从计算机传输到 PIC，而不是编写代码。机器码是程序运行时处理的原始字节值。这些机器码首先被汇组成一个名为
    hex 的文件。它的名称源于英特尔十六进制（Intel Hex Format），这是该用途的文件标准。然后，hex 文件通过计算机上的程序和一个称为编程器的硬件接口写入
    PIC。当谈到机器码时，指的不是有限状态机，而是被称为“机器”的处理器本身。


    可以通过直接在文本编辑器中输入 hex 文件来编写程序。手动汇编机器指令太耗时，不能被认为是一项现实的任务。为了方便起见，使用汇编语言编写，通过机器指令的短缩写来产生更具读性的代码。你通过这种方式编写的文件是源代码，通常具有
    .asm 后缀。该文件随后由汇编器程序读取并写入 hex 文件中。


    人们通常认为使用高级语言编写程序更好。如果你想更快地完成任务并减少出错几率，那么这是绝对正确的。C 语言的发明是为了摆脱汇编语言编程的问题。本书关于在简单的
    PIC 上实现的有限状态机。为微控制器编写代码，你必须理解软件与硬件交界处发生了什么。虽然 C 让编码更快更容易，但它让事情变得更复杂。然而，你并没有看到这些额外的复杂：它们是由编译器和链接器处理的。这一切都会阻碍你理解代码在做什么。对于书中使用的
    PIC，有 49 条可用指令。常用的很容易学会。汇编语言的妙之处在于你可以看到发生的一切。你编写的代码正是进入 PIC 的机器码。一旦源文件完成，它将由汇编器程序转换为机器语言：即
    *gpasm*。汇编器读取你的源代码并输出 hex 文件。然后，hex 文件由另一个应用程序读取，并通过某种形式的硬件接口写入 PIC。下方的图 1-2 展示了这一编程链。


    '
