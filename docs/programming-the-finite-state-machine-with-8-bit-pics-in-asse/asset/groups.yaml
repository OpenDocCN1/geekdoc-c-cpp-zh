    下面的程序几乎每一行都有注释。


    通过运行串口读取程序，你可以看到每关闭一次开关，计数器都会增加。不过，取决于你所使用的开关，可能会出现问题。如果你只是触碰一下电线末端来当作开关，问题会非常明显。这就是开关抖动（Switch
    bounce）问题。开关抖动是指开关没有干净地关闭或打开，而是弹了好几次。PIC 的速度足够足够这些抖动，


    图 4-10 程序 4-5 的电路


    图 4-11 程序 4-5 的状态图


    当开关关闭时，将记录多次计数，而不仅仅是一个。这个问题可以通过使用电阻-电容网络将开关连接到输入端来克服。然而，这些是更多占用空间的组件。开关抖动可以使用软件来消除。


    图 4-12 显示了按键开关关闭时跨电压的示波器轨迹。两条垂直虚线尺线之间的时间间隔为 1ms。这仅仅是一个例子。不同的开关具有不同的特性，而且给定的开关并不总是每次都以相同的方式响应。


    ![](img/a08bd00952da48f769971864f33af432_86_0.png)


    图 4-12 开关触抖抖示例


    ;prog_04_05.asm


    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm\_macros.inc>


    RADIX DEC ; 默认数字为 10 进制。

    BOOK\_CONFIGURATION ; 查看 fsm\_macros.inc 中的宏。


    CBLOCK 0x70

    PULSE\_COUNTER

    ENDC


    ORG 0X00

    MOVLB 1

    BCF OPTION\_REG, 7 ; 启用弱上拉

    SET\_FREQ\_32MHZ ; 查看文件 fsm\_macros.inc。

    MOVLB 3

    BCF ANSELA, 2 ; 将 RA2 设置为数字输入。

    SET\_SERIAL\_TX\_16F1823 ; 查看文件 fsm\_macros.inc，这设置了 TXEN、SPEN，设置了波特率并将引脚 2 的改为
    TX。

    CLRF PULSE\_COUNTER ; 初始化计数为零。

    BANKSEL PORTA


    ;-------机器状态

    S0

    BTFSC PORTA, 2 ; 如果开关打开，输入将为高电，弱上拉电阻将使输入变为高电。弱上拉默认启用。参阅数据手册第 119 页。

    ; 如果为高电则不跳过，程序保持在状态 0

    GOTO S0

    INCF PULSE\_COUNTER, F

    MOVF PULSE\_COUNTER, W ; 将 PULSE\_COUNTER 中的值移动到 W

    BANKSEL TXREG

    MOVWF TXREG ; 加载 TXREG 开始传输。

    BTFSS TXSTA, TRMT ; 当传输完成时 TRMT 会被设置，否则此行和下一个循环将循环。

    GOTO $-1

    S2

    BANKSEL PORTA

    BTFSS PORTA, 2 ; 如果开关关闭，输入将为低电。不跳过，程序保持在状态 2。

    GOTO S2

    GOTO S0

    END


    ## 4.6.2 消除开关抖动影响的方法


    消除开关抖动影响的一种软件方法是在第一次检测到开关打开或关闭后引入时间延迟。这是程序 4-6 中使用的方法。这不是处理该问题的最佳方法，因为它会导致程序短时间暂停：在这种情况下大约为
    33 ms。虽然人类察觉不到这一点，但在繁忙的程序中，这可能是不理想的。在 32MHz 的时钟频率下，这是 264000 条指令。

    一个指令周期 = 4/(32x10^6) = 1.25x10^-7 s

    33 ms 内的指令数 = 33/1.25x10^-7 = 264000 条指令


    程序 4-5 无抖动计数脉冲


    ;prog_04_06.asm

    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm\_macros.inc>

    ;这不是处理抖动问题的最佳方法。

    RADIX DEC ; 默认数字为 10 进制。

    BOOK\_CONFIGURATION ; 查看 fsm\_macros.inc 中的宏。


    CBLOCK 0x70

    PULSE\_COUNTER

    TICKS

    ENDC


    ORG 0X00

    GOTO START

    ORG 0X04 ; 中断向量。

    BCF INTCON, TMR0IF ; 清除 tmr0 溢出标志。

    INCF TICKS, F ; TICKS 加 1。

    RETFIE ; 从中断返回。

    START:

    MOVLB 1

    SET\_TMR0\_CASE1 ; 查看文件 fsm\_macros.inc。

    BCF OPTION\_REG, 7 ; 弱上拉启用。

    SET\_FREQ\_32MHZ ; 查看文件 fsm\_macros.inc。

    MOVLB 3

    BCF ANSELA, 2 ; 将 RA2 设置为数字输入。

    SET\_SERIAL\_TX\_16F1823 ; 查看文件 fsm\_macros.inc，这设置了 TXEN、SPEN，设置了波特率并将引脚 2 的改为
    TX。

    CLRF PULSE\_COUNTER ; 初始化计数为零。


    ;-------机器状态

    S0

    BANKSEL PORTA

    BTFSC PORTA, 2 ; 如果开关打开，输入将为高电，弱上拉电阻将使输入变为高电。默认启用单独上拉。参阅数据手册第 19 页。

    ; 如果为高电则不跳过，程序保持在状态 0

    GOTO S0

    CALL DELAY\_33\_ms ; 调用 33 ms 子程序。

    S1

    INCF PULSE\_COUNTER, F

    MOVF PULSE\_COUNTER, W ; 将 PULSE\_COUNTER 中的值移动到 W

    BANKSEL TXREG

    MOVWF TXREG ; 加载 TXREG 开始传输。

    BTFSS TXSTA, TRMT ; 当传输完成时 TRMT 会被设置，否则此行和下一个循环将循环。

    GOTO $-1

    S2

    BANKSEL PORTA

    BTFSS PORTA, 2 ; 如果开关关闭，输入将为低电。不跳过，程序保持在状态 2。

    GOTO S2

    CALL DELAY\_33\_ms ; 调用 33 ms 子程序。

    GOTO S0


    ;子程序

    DELAY\_33\_ms

    BANKSEL TMR0

    CLRF TMR0 ; TMR0 为 0 开始子程序。

    CLRF TICKS ; TICKS 为 0 开始子程序。

    LOOP

    MOVLW 4

    IF\_LESS\_THAN\_W TICKS

    GOTO LOOP ; 在子程序中保持直到 4 ticks。

    RETURN ; 从子程序返回。

    END


    程序 4-6 使用时间延迟消除脉冲计数


    这种方法在程序没有其他事情要做时是有效的。下一个程序采用了不同的方法，不会阻塞程序，这样在等待触点稳定时可以执行其他操作。


    ## 4.6.3 消除开关抖动影响的更好方法


    此程序可能看起来复杂且难以追踪，因为它使用了两个共同运行的状态机。状态机技术使不同的函数分离并易于编写。第一个机器 M0 与之前的程序相同，只是它不直接查看输入。通过另一个机器
    M1 的信号获取开关位置。


    机器 M1 直接监控输入，如果开关从关闭变为打开，它开始计数 1ms 中断。只有当计数器达到 25 且没有抖动时，才会更改 M0 使用的信号。


    两个机器共同运行的方式是：一旦在一个机器中执行一段状态代码，程序就在另一个机器中执行一段状态代码。除了等待一个字节串口传输外，没有使用旋转循环。这意味着处理器没有浪费周期。图
    4-13 显示了程序 4-7 的状态图。


    ![](img/a08bd00952da48f769971864f33af432_89_0.png)


    图 4-13 程序 4-7 的状态图


    ;prog_04_07.asm

    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm\_macros.inc>


    RADIX DEC ; 默认数字为 10 进制。

    BOOK\_CONFIGURATION ; 查看 fsm\_macros.inc 中的宏。


    CBLOCK 0x70

    PULSE\_COUNTER

    TICKS

    STATE\_M0

    STATE\_M1

    CONTACT\_SIGNAL ; 位 0 中的去抖动信号。

    ENDC


    ORG 0X00

    GOTO START

    ORG 0X04 ; 中断向量。

    BCF INTCON, TMR0IF ; 清除 tmr0 溢出标志。

    INCF TICKS, F

    RETFIE ; 从中断返回。

    START:

    MOVLB 1

    SET\_TMR0\_CASE2 ; 提供 1ms 脉冲。查看文件 fsm\_macros.inc

    BCF OPTION\_REG, 7 ; 弱上拉启用。

    SET\_FREQ\_32MHZ ; 查看文件 fsm\_macros.inc。

    MOVLB 3

    BCF ANSELA, 2 ; 将 RA2 设置为数字输入。

    SET\_SERIAL\_TX\_16F1823 ; 查看文件 fsm\_macros.inc，这设置了 TXEN、SPEN，设置了波特率并将引脚 2 的改为
    TX。

    CLRF TICKS ; 初始化计数为零。

    CLRF STATE\_M0

    CLRF STATE\_M1

    CLRF PULSE\_COUNTER

    BANKSEL PORTA

    SWITCH\_M0

    MOVF STATE\_M0, W ; 将 STATE\_0 移动到工作寄存器。

    BRW ; 程序根据移动工作寄存器的值跳转。

    GOTO M0\_S0

    GOTO M0\_S1

    SWITCH\_M1

    MOVF STATE\_M1, W ; 将 STATE\_1 移动到工作寄存器。

    BRW ; 程序根据进入工作寄存器的值跳转。

    GOTO M1\_S0

    GOTO M1\_S1

    GOTO M1\_S2

    GOTO M1\_S3


    ;-------机器状态

    M0\_S0

    BTFSC CONTACT\_SIGNAL, 0 ; 使用触点作为变量。如果是低电关闭则跳过。

    GOTO M0\_S1 ; 保持在状态 0 等待开关关闭。

    M0\_S1

    BTFSS CONTACT\_SIGNAL, 0 ; 如果打开则跳过。

    GOTO M0\_S1 ; 保持在状态 1 等待开关打开。


