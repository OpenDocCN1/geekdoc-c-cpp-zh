    \ \n\nto fire the boiler and start the pump. The machine will then stay in this\
    \ state until another \n\ntransition is called for. In the flow chart, the equivalent\
    \ of state 2 is the continuous loop \n\nshown by the dotted ellipse. You can pick\
    \ out the other loops that equate to the two other \n\nstates. When it comes to\
    \ converting these charts into code and then debugging, I find that"
