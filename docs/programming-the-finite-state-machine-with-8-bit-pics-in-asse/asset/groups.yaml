  - "[PAGE 104]\n\np\n\ny\n\n● 105\n\nvalues in the range of 0 – 255 can be tried.\
    \ Fig 6-1 shows in detail what happens in the \n\nsubroutine when 192 and 168\
    \ are added.\n\n![](img/a08bd00952da48f769971864f33af432_104_0.png)\n\nThe code\
    \ for the addition is in a subroutine so that it can be called as required. There\
    \ is \n\nanother subroutine that transmits the 16-bit result as two single-byte\
    \ transmissions. The \n\nfirst byte being the high order one. There are four files\
    \ used as variables. *Xa* and *Xb* are \n\nthe two addends to be added together.\
    \ *Y0* and *Y1* are the two bytes that make up the \n\nsum or the result. *Y1*\
    \ is the high order byte. The program is not written as a finite state \n\nmachine\
    \ as it’s just one loop. \n\nIn the first addition, *Xa* is loaded with 192, and\
    \ *Xb* 168. The add and then the transmit \n\nsubroutine is called. Then *Xa*\
    \ and *Xb* are loaded with 192 and 3. These are then added \n\nand transmitted.\
    \ To slow things down so that the print out on the computer can be read, \n\n\
    there is a delay of two seconds included. This is just another time-wasting loop\
    \ counting \n\n244 x 8.2 ms interrupt ticks, however, it’s all we need here.\n\
    \nFigure 6-1 An Example of Adding Two Eight-Bit Numbers"
- md: "\n;PROG_06_01.asm\nLIST P=16F1823\n#INCLUDE <p16f1823.inc>\n#INCLUDE <fsm_macros.inc>\n\
    \nRADIX DEC ; Default numbers are to base 10.\nBOOK_CONFIGURATION ; See macro\
    \ in fsm_macros.inc.\n\nCBLOCK 0x70 \nTICKS ; Used to count 8.2ms ticks.\nXa ;\
    \ Augend for the addition.\nXb ; Addend for the addition.\nY0 ; Sum low byte for\
    \ the addition.\nY1 ; Sum high byte for the addition.\nENDC\n\nORG 0X00\nGOTO\
    \ START\nORG 0X04 ; Interrupt vector.\nBCF INTCON, TMR0IF ; Clear the tmr0 overflow\
    \ interrupt flag.\nINCF TICKS, F ; Increment by one the 8.2ms ticks.\nRETFIE ;\
    \ Return from interrupt.\n\nSTART\nMOVLB 1\nSET_FREQ_32MHZ ; See file fsm_macros.inc.\n\
    SET_TMR0_CASE1 ; Gives 8.1 ms ticks. See fsm_macros.inc\nMOVLB 3 ; bank 3 required\
    \ for EUSART macro.\nSET_SERIAL_TX_16F1823 ; Set up EUSART.\n\nLOOP\nCLRF TICKS\n\
    MOVLW 244\nIF_REG_LESS_THAN_W TICKS ; A delay of 2 seconds = 244*8.2 ms.\nGOTO\
    \ $-3 ; We have to jump back two lines in the macro.\nMOVLW 192\nMOVWF Xa ; Move\
    \ 192 to Xa.\nMOVLW 168\nMOVWF Xb ; Move 168 to Xb.\nCALL ADD_TWO_EIGHT_BIT_NUMBERS\
    \ ; Call subroutine.\nCALL TX_SIXTEEN_BIT_NUMBER ; Call subroutine.\nMOVLW 192\n\
    MOVWF Xa ; Move 192 to Xa.\nMOVLW 3\nMOVWF Xb ; Move 3 to Xb.\nCALL ADD_TWO_EIGHT_BIT_NUMBERS\
    \ ; Call subroutine.\nCALL TX_SIXTEEN_BIT_NUMBER ; Call subroutine.\nGOTO LOOP\n\
    \n; Subroutines.\nADD_TWO_EIGHT_BIT_NUMBERS ; Y = Xa + Xb, note each X variable\
    \ has one byte.\n; The output Y has a high and low byte.\nCLRF Y1 ; Zero the high\
    \ order byte.\nMOVF Xa, W ; Move contents of Xa to W.\nADDWF Xb, W ; Add Xb to\
    \ W with result in W and the carry in STATUS C.\nMOVWF Y0 ; Put the low byte of\
    \ the result in Y0.\nCLRW ; Clear W, it needs to be 0 for the next line.\nADDWFC\
