    ```\n\n![](img/a08bd00952da48f769971864f33af432_177_1.png)\n\nFig 10-2 Use of\
    \ serial_reader(2)\nProgram 10-3 Division (excerpt)\nFig 10-3 Use of serial_reader\
    \ (3)\n\n## 10.5 The Voltmeter in C\n\nThe final program is the Voltmeter from\
