- md: '

    CLRF FLAGS ; Initialize FLAGS to false.

    CLRF LAPS

    MOVLB 0

    CLRF F10V ; Initiate to 0.

    CLRF F1V ; Initiate to 0.

    CLRF F100mV ; Initiate to 0.

    CLRF F10mV ; Initiate to 0.


    SWITCH_M0

    MOVLB 0

    MOVF STATE_M0, W ; Move STATE_M0 to the working register.

    BRW ; Program jumps by the value moved into the working register.

    GOTO M0_S0

    GOTO M0_S1

    GOTO M0_S2

    GOTO M0_S3

    GOTO M0_S4

    GOTO M0_S5

    GOTO M0_S6

    GOTO M0_S7

    GOTO M0_S8

    GOTO M0_S9


    SWITCH_M1

    MOVLB 2 ; Bank 2 required for the 7 segment display driver.

    MOVF STATE_M1, W ; Move STATE_1 to the working register.

    BRW ; Program jumps by the value moved into the working register.

    GOTO M1_S0

    GOTO M1_S1


    SWITCH_M2

    MOVF STATE_M2, W ; Move STATE_2 to the working register.

    BRW ; Program jumps by the value moved into the working register.

    GOTO M2_S0

    GOTO M2_S1


    M0_S0

    MOVLB 0

    MOVLW 61

    IF_REG_LESS_THAN_W TICKS ; Waiting for 10 mV display to end

    GOTO SWITCH_M2

    MOVLW 10 ; Setting up for a blank.

    MOVWF VALUE

    BSF FLAGS, 0 ; Update display bit.

    BSF FLAGS, 3 ; Trigger a read in machine 2.

    CLRF TICKS ; Reset TICKS for next state.

    INCF STATE_M0, F ; Increment the state number.

    GOTO SWITCH_M2


    M0_S1

    MOVLB 0

    MOVLW 122

    IF_REG_LESS_THAN_W TICKS ; O0.5 s delay after complete reading.

    GOTO SWITCH_M2

    BTFSS FLAGS, 2 ; Test for a non zero reading available.

    GOTO $+5 ; Here because reading is below 111 mV.

    MOVLW 3 ; Here because reading is above 111 mV.

    CLRF LAPS ; Clear the laps counter as there is voltage to read.

    MOVWF STATE_M0

    GOTO SWITCH_M2

    ; This block when probe voltage is below 111 mV.

    MOVLW 2

    MOVWF STATE_M0 ; No non zero reading available go to state 2.

    GOTO SWITCH_M2


    M0_S2

    MOVLW 3

    IF_REG_GREATER_THAN_OR_EQUAL_TO_W LAPS

    GOTO $+11 ; Here if LAPS == 3.

    INCF LAPS, F ; Here if LAPS < 3.

    CLRF F10V

    CLRF F1V

    CLRF F100mV

    CLRF F10mV

    CLRF VALUE

    BSF FLAGS, 0

    MOVLW 3

    MOVWF STATE_M0

    GOTO SWITCH_M2

    ; This block when LAPS == 3.

    CLRF LAPS

    BANKSEL FVRCON

    BCF FVRCON, FVREN ; Disable fixed voltage reference.

    BANKSEL IOCAP

    BSF IOCAP, 5 ; Interrupt on change enabled on RA5 for positive going edges.

    SLEEP

    BCF IOCAP, 5 ; Interrupt on change disabled on RA5 for positive going edges.

    BANKSEL FVRCON

    BCF FVRCON, FVREN ; Enable fixed voltage reference.

    CLRF STATE_M0

    GOTO SWITCH_M2


    M0_S3

    MOVLB 0

    MOVF F10V, W

    MOVWF VALUE ; Setting up for F10V

    BSF FLAGS, 0

    CLRF TICKS

    INCF STATE_M0, F

    GOTO SWITCH_M2


    M0_S4

    MOVLB 0

    MOVLW 61

    IF_REG_LESS_THAN_W TICKS ; Waiting for F10V display to end.

    GOTO SWITCH_M2

    MOVLW 10 ; Setting up for a blank.

    MOVWF VALUE

    BSF FLAGS, 0

    CLRF TICKS

    INCF STATE_M0, F

    GOTO SWITCH_M2


    M0_S5

    MOVLB 0

    MOVLW 31

    IF_REG_LESS_THAN_W TICKS ; Waiting for blank display to end.

    GOTO SWITCH_M2

    MOVF F1V, W ; Setting up for F1V

    MOVWF VALUE

    BSF FLAGS, 0

    CLRF TICKS

    INCF STATE_M0, F

    GOTO SWITCH_M2


    M0_S6

    MOVLB 0

    MOVLW 61

    IF_REG_LESS_THAN_W TICKS ; Waiting for F1V display to end.

    GOTO SWITCH_M2

    MOVLW 10 ; Setting up for a blank.

    MOVWF VALUE

    BSF FLAGS, 0

    CLRF TICKS

    INCF STATE_M0, F

    GOTO SWITCH_M2


    M0_S7

    MOVLB 0

    MOVLW 31

    IF_REG_LESS_THAN_W TICKS ; Waiting for blank display to end.

    GOTO SWITCH_M2 ; Setting up for F100mV

    MOVF F100mV, W

    MOVWF VALUE

    BSF FLAGS, 0

    CLRF TICKS

    INCF STATE_M0, F

    GOTO SWITCH_M2


    M0_S8

    MOVLB 0

    MOVLW 61

    IF_REG_LESS_THAN_W TICKS ; Waiting for F100mV display to end.

    GOTO SWITCH_M2

    MOVLW 10 ; Setting up for a blank.

    MOVWF VALUE

    BSF FLAGS, 0

    CLRF TICKS

    INCF STATE_M0, F

    GOTO SWITCH_M2


    M0_S9

    MOVLB 0

    MOVLW 31

    IF_REG_LESS_THAN_W TICKS ; Waiting for blank to end.

    GOTO SWITCH_M2

    MOVF F10mV, W ; Setting up for F10mV

    MOVWF VALUE

    BSF FLAGS, 0

    CLRF TICKS

    CLRF STATE_M0

    GOTO SWITCH_M2


    SEVEN_SEG_DRIVE_MACHINE

    VALUE, M1_S0, M1_S1

    M2_S0

    BTFSS FLAGS, 3

    GOTO SWITCH_M1 ; Here if measurement is not called for.

    INCF STATE_M2, F

    GOTO SWITCH_M1 ; Here if measurement is called for.

    M2_S1

    BCF FLAGS, 3 ; Reset the reading gets set by M0_S1.

    MOVLB 1 ; Change to bank 1 for ADCON,ADRESH.

    BSF ADCON0, 1 ; Start a conversion

    BTFSC ADCON0, 1 ; And the next line loop until the conversion is finished.

    GOTO $-1

    BCF FLAGS, 2 ; Set the reading available to false.

    MOVF ADRESH, F

    BTFSS STATUS, Z

    GOTO M2_S1 ; Here because ADRESH is not zero

    MOVLW 5

    IF_REG_GREATER_THAN_OR_EQUAL_TO_W ADRESH ; Test to see if probe voltage is greater
    than 111 mV.

    GOTO M2_S1 ; Voltage greater than 111 mV.

    CLRF STATE_M2 ; Voltage not greater than 111 mV.

    GOTO SWITCH_M1

    M2_S1 ; Label 0 in this state

    BSF FLAGS, 2 ; Jumped to here because voltage greater than 111 mV.

    Set the reading available to true.

    MOVLB 1

    MOVF ADRESH, W

    MOVWF Xa1 ; Move ADRESH into Xa1.

    MOVF ADRESH, W

    MOVWF Xa0 ; Move ADRESH into Xa0.

    MOVLB 0

    MOVLW HIGH 1091 ; Scaling factor high byte, see text.

    MOVWF Xb1

    MOVLW LOW 1091 ; Scaling factor low byte, see text.

    MOVWF Xb0

    Scaling is done by first multiplying by 1091, then dividing 500. See text.

    CALL MULT_TWO_SIX_BIT_NUMBERS

    MOVF Y0, W

    MOVWF Xa0 ; The result of the multiplication is transferred from Y to Xa.

    MOVF Y1, W

    MOVWF Xa1

    MOVF Y2, W

    MOVWF Xa2

    CLRF Xb2 ; Xb2 and Xb1 are cleared then 500 moved into Xb0 for division.

    MOVLW HIGH 500

    MOVWF Xb1

    MOVLW LOW 500

    MOVWF Xb0

    DIV_24_BY_16_BIT ; Scaling is completed by dividing by 500.

    MOVLB 0

    MOVF Y1, W

    MOVWF RESBUFFH ; The scaled voltage reading is now moved to RESBUFF. The scaling
    gives the voltage in 10s of mV.

    MOVF Y0, W

    MOVWF RESBUFFL

    MOVLB 0

    MOVLW HIGH 10000

    MOVWF Xb1

    MOVLW LOW 10000

    MOVWF Xb0

    CALL EXTRACT_SIGFS ; The extract significant figures uses 10000 as denominator
    to extract 10s of volts.

    MOVF FIG, W

    MOVWF F10V ; Load F10V with tens of volts.

    MOVLW HIGH 1000

    MOVWF Xb1

    MOVLW LOW 1000

    MOVWF Xb0

    CALL EXTRACT_SIGFS ; The extract significant figures uses 1000 as denominator
    to extract units of volts.

    MOVF FIG, W

    MOVWF F1V ; Load F1V with units of volts.

    CLRF Xb1

    MOVLW 100

    MOVWF Xb0

    CALL EXTRACT_SIGFS ; The extract significant figures uses 100 as denominator to
    extract 100s of millivolts.

    MOVF FIG, W

    MOVWF F100mV ; Load F100mV with hundreds of millivolts.

    CLRF Xb1

    MOVLW 10

    MOVWF Xb0

    CALL EXTRACT_SIGFS ; The extract significant figures uses 10 as denominator to
    extract 10s of millivolts.

    MOVF FIG, W

    MOVWF F10mV ; Load F10mV with tens of millivolts.

    CLRF STATE_M2

    GOTO SWITCH_M1

    ; See the state diagram in chapter 6 Fig 6-7

    DIV_24_BY_16_BIT ; Y = Xa/Xb,

    DIV_S0

    CLRF Y0 ; Set Y to zero.

    CLRF Y1

    CLRF Xc1 ; Set Xc to zero.

    CLRF Xc0

    MOVF Xb1, F

    BTFSS STATUS, Z

    GOTO $+4 ; Here because Xb1 is not 0.

    MOVF Xb0, F ; Here because Xb1 is 0.

    BTFSC STATUS, Z

    RETURN ; Here because Xb0 is 0. Also Xb1 is 0.

    MOVF Xa2, W

    MOVWF BUFFH ; Load Xa high byte to BUFFH.

    MOVF Xa1, W

    MOVWF BUFFM ; Load Xa high byte to BUFFM.

    MOVF Xa0, W

    MOVWF BUFFL ; Load Xa high byte to BUFFM.

    BCF FLAGS, 1 ; Ensure end of division flag low.

    DIV_S1

    BTFSC FLAGS, 1

    RETURN ; Here because end of division flag set.

    MOVF BUFFH, W

    MOVWF Xc2 ; Xc will contain the remainder.

    MOVF BUFFM, W

    MOVWF Xc1 ; Xc will contain the remainder.

    MOVF BUFFL, W

    MOVWF Xc0 ; Xc will contain the remainder.

    MOVF Xb0, W

    SUBWF BUFFL, F ; Subtract Xb0 from BUFFL result in BUFFL.

    MOVF Xb1, W

    SUBWFB BUFFM, F ; Subtract Xb1 from BUFFM result in BUFFM.

    CLRW

    SUBWFB BUFFH, F ; Subtract the carry if there is one.

    BTFSS STATUS, C

    BSF FLAGS, 1 ; Here because C == 0 therefore below zero.

    DIV_S2

    BTFSC FLAGS, 1

    GOTO DIV_S1 ; Because BUFF is now less then Xb this is the last loop

    ; and Xc contains the remainder.

    INCF Y0, F ; Counting the number of times Xb has been subtracted from BUFF

    ; with a positive result.

    '
