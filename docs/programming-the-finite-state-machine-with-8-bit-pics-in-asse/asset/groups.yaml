  - "[PAGE 158]\n\np\n\np\n\n● 159\n\n**9.3.5 • Interrupts in C**\n\nTo achieve accurate\
    \ timing, we can use timer0 and an interrupt as in Program 2-1 from \n\nChapter\
    \ 2. Program 9-2 shows how this is done. The program follows the same form as\
    \ \n\nthe assembly version. The interrupt is achieved by creating a separate function\
    \ that is the \n\ninterrupt service routine. The name doesn’t matter but must\
    \ have the word interrupt in \n\nfront of the name after void. \n\nInterrupt functions\
    \ take no arguments and the return type must be void.\n\n \n\nWhen variables are\
    \ declared in C, they have a scope that is limited to the function they \n\nare\
    \ declared in. This means that other functions can’t read or change them. As the\
    \ two \n\ncounters have to be accessible to both the interrupt and the main functions,\
    \ they have \n\nbeen declared outside of the functions. A variable declared outside\
    \ any function is then \n\naccessible by any function in this file.\n\nThe interrupt\
    \ function consists of just three lines. The timer0 overflow flag is reset and\
    \ the \n\ntick counter is incremented. The ++ after a variable increments it by\
    \ one. \n\nThis program introduces the *if* statement. By using the state variable,\
    \ one block of code \n\nruns when in state 0. The other when in state 1. As there\
    \ are only two states here, we \n\ncould have used the *if…else* statement. Following\
    \ the word if, is the expression that is being \n\nevaluated to see if it is true\
    \ or not. This expression is enclosed in parenthesis. Following this \n\nis the\
    \ code that will be executed if the expression is true. The code is enclosed in\
    \ brackets. \n\n \n\nif (state == 0){\n\n \n\n \n\n// Do this. \n\n \n\n}\n\n\
    \ \n\nelse\n\n \n\n{\n\n \n\n \n\n// Otherwise do this. \n\n \n\n}  \n\nThere\
    \ are different opinions on how you should style the placement of brackets around\
    \ the \n\nbodies of functions and if statements. As a suggestion, I would follow\
    \ what I have done \n\nhere. Indent whenever something is nested inside something\
    \ else. Indent the body of \n\nfunctions and leave the brackets in line with the\
    \ outer parts. An important thing to watch \n\nout for is the difference between\
    \ one = sign and two == signs. One sign is an assignment, \n\nmeaning a variable\
    \ is being made equal to something. Two signs mean that a check is being \n\n\
    made to see if something is equal to something else. It is an expression that\
    \ evaluates to \n\neither true or false. Both examples are in this code. If you\
    \ use a single equal sign when you \n\nshould have used two, the compiler will\
    \ accept it but will cause a runtime bug."
