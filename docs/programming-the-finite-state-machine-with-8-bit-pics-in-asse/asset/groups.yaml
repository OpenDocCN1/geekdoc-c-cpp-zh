    ## 6.3 • 无符号整数的二进制减法


    减法的原理是类似的。下一个程序将一个 16 位数减去另一个。作为例如，我们将从 1500 中减去 1000。这两个数都大于 255，因此每个都需要两个字节。1500
    是 256x5 + 220，1000 是 256x3 + 232。减法过程在表 6-3 中列出，并解释了汇编代码中需要发生的情况。


    | 高位字节计算256的倍数 | 低位字节计算个位 | 十进制值 |

    | :--- | :--- | :--- |

    | 5 | 220 (需要从 256 处借位，这使得 C 为非借位 C= 0) | 1500 |

    | 3 | 232 | 1000 |

    | 5 - 3 – C = 1, C 因为借位为 0，因此 C 为 1 | 使用 SUBWFB 指令。 | |

    | | 220 + 256(借位) – 232 = 244 | 使用 SUBWF 指令。 |


    执行起来有些困惑但在实践中不会产生问题的是 *SUBWFB* 指令，它在多字节减法中减去高位字节时，使用“带借位的从文件中减去W*”的操作。在多字节减法中，如果减法结果为零或正数，*STATUS*
    寄存器中的进位（carry bit）将设置为 1。这表示不需要借位。如果减法结果为负数，*STATUS* 寄存器中的进位将清零为0，表示需要借位。接下来发生的是，在涉及
    *SUBWFB* 的下一对高位字节的减法中，将考虑进位状态。工作寄存器 *W* 减去 *F*。如果 C 为 0，则再减去 1。如果 C 为 1，则不额外减去
    1。除了使用该指令外，你不需要做任何事情：


    F – W – C -> 目标 (W 或 F) (同样，进位 C 也会受到影响)


    程序 6-3 展示了这一点，图 6-5 显示了输出。由于输出是一个 16 位字，因此使用了 *-h* 。


    ```asm

    ;PROG_06_03.asm

    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm_macros.inc>


    RADIX DEC ; 默认数字为10 进制。

    BOOK_CONFIGURATION ; 查看 fsm_macros.inc 中的宏。


    CBLOCK 0x70

    TICKS ; 用于计算 8.2ms 的滴答。

    Xa0 ; 被减数低字节。

    Xa1 ; 被减数高字节。

    Xb0 ; 减数低字节。

    Xb1 ; 减数高字节。

    Y0 ; 差值最低字节。

    Y1 ; 差值最高字节。

    ENDC


    ORG 0X00

    GOTO START


    ORG 0X04 ; 中断向量。

    BCF INTCON, TMR0IF ; 清除 tmr0 溢出中断标志。

    INCF TICKS, F ; 8.2ms 滴答加 1。

    RETFIE ; 从中断返回。


    START ;

    MOVLB 1

    SET_FREQ_32MHZ ; 查看文件 fsm_macros.inc。

    SET_TMR0_CASE1 ; 产生 8.1 ms 的滴答。查看 fsm_macros.inc

    MOVLB 3 ;

    SET_SERIAL_TX_16F1823 ; 设置 EUSART。


    LOOP

    CLRF TICKS

    MOVLW 244

    IF_REG_LESS_THAN_W TICKS ; 2 秒的延迟 = 244*8.2 ms。

    GOTO $-3 ; 我们必须在宏中跳回两行。


    ; 加载值 Xa 256*5 + 220 = 1500

    MOVLW 5 ; 这可以表示为 MOVLW HIGH 1500

    MOVWF Xa1 ; 将 5 移动到 Xa1。这是 1500 的高字节。

    MOVLW 220 ; 这可以表示为 MOVLW LOW 1500

    MOVWF Xa0 ; 将 220 移动到 Xa0。这是 1500 的低字节。


    ; 加载值到 Xb 256*3 + 232 = 1000

    MOVLW 3 ; 这可以表示为 MOVLW HIGH 1000

    MOVWF Xb1 ; 将 3 移动到 Xb1。这是 1000 的高字节。

    MOVLW 232 ; 这可以表示为 MOVLW LOW 1000

    MOVWF Xb0 ; 将 232 移动到 Xb0。这是 1000 的低字节。

    CALL SIXTEEN_BIT_NUMBERS ; 调用子程序。

    CALL SIXTEEN_BIT_NUMBER ; 调用子程序。

    GOTO LOOP


    子程序。

    SIXTEEN_BIT_NUMBERS ; Y = Xa - Xb，注意每个变量都有高字节和低字节。

    CLRF Y1 ; 清空结果字节。

    MOVF Xb0, W ; 将低字节移动到 W。

    SUBWF Xa0, W ; 从 Xa0 减去 W (xb1)。如果结果为负，则不需要借位，STATUS 中的进位置位。C 也称为“非借位”。

    MOVWF Y0 ; 将低字节移动到 Y1。

    MOVF Xb1, W ; 将 Xb 高字节移动到 W。

    SUBWFB Xa1, W ; 从 Xa1 减去“非借位”和 W (xb0)，将结果放入 W。

    MOVWF Y1 ; 将结果移动到 Y1，高字节。

    RETURN


    SIXTEEN_BIT_NUMBER

    BANKSEL

    MOVF Y1, W ; 将高字节放入 W。

    MOVWF TXREG ; 使用 EUSART 传输。

    BTFSS STATUS, TRMT ; 等待 TRMT 置位。

    MOVF Y0, W ; 传输结果的低字节。

    BTFSS STATUS, TRMT ; 等待 TRMT 置位。

    RETURN

    END

    ```


    ## 6.4 结果为负数的二进制减法


    在上例中，虽然低位字节产生了负结果，但它是通过 *STATUS* 寄存器从高位字节借位处理的。如果高位减法结果为负数，该如何处理？我将使用相同的程序进行修改，从
    1000 减去 1500 以得到 -500。这是程序 6-4，区别在于这里显示的值。为了节省空间，书中只保留修改部分：


    ```asm

    LOOP

    CLRF TICKS

    MOVLW 244

    IF_REG_LESS_THAN_W TICKS ; 2 秒的延迟 = 244*8.2 ms。

    GOTO $-3 ; 我们必须在宏中跳回两行。


    ; 加载值 Xb 256*3 + 232 = 1000

    MOVLW 3 ; 这可以表示为 MOVLW HIGH 1000

