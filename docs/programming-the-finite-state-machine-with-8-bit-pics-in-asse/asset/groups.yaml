    \ >= 121) // When a second has been reached.\n        {\n            value++;\
    \ // Increment the state by 1.\n            update = true;\n            tick_counter\
    \ = 0; // Reset the tick_counter.\n        }\n        if (value > 9) // The value\
    \ value will return to 0 when 9 is exceeded.\n        {\n            value = 0;\n\
    \        }\n        if (update) // The switch statement only gets called if update\
    \ is true.\n        {\n            update = false; // Reset update.\n        \
    \    switch (value) // The switch statement only runs when called.\n         \
    \   {\n                case 0:PORTC = 0x00; // For common cathode use 0x3F.\n\
    \                    LATA4 = 1; // For common cathode use 0.\n               \
    \     break;\n                case 1:PORTC = 0x36; // For common cathode 0x09.\n\
    \                    LATA4 = 1; // For common cathode use 0.\n               \
    \     break;\n                case 2:PORTC = 0x21; // For common cathode 0x1E.\n\
    \                    LATA4 = 0; // For common cathode use 1.\n               \
    \     break;\n                case 3:PORTC = 0x24; // For common cathode 0x1B.\n\
    \                    LATA4 = 0; // For common cathode use 1.\n               \
    \     break;\n                case 4:PORTC = 0x16; // For common cathode 0x29.\n\
    \                    LATA4 = 0; // For common cathode use 1.\n               \
    \     break;\n                case 5:PORTC = 0x0C; // For common cathode 0x33.\n\
    \                    LATA4 = 0; // For common cathode use 1.\n               \
    \     break;\n                case 6:PORTC = 0x08; // For common cathode 0x37.\n\
    \                    LATA4 = 0; // For common cathode use 1.\n               \
    \     break;\n                case 7:PORTC = 0x26; // For common cathode 0x19.\n\
    \                    LATA4 = 1; // For common cathode use 0.\n               \
    \     break;\n                case 8:PORTC = 0x00; // For common cathode 0x3F.\n\
    \                    LATA4 = 0; // For common cathode use 1.\n               \
    \     break;\n                case 9:PORTC = 0x04; // For common cathode 0x3B.\n\
    \                    LATA4 = 0; // For common cathode use 1.\n               \
    \     break;\n            }\n        }\n    }\n}\n\n## Program 9-6 The Switch\
    \ Statement Nested in if Statement\n\nProgram 9-6 has a small bug in that power\
    \ up the display shows 8 before joining sequence. This was noticed on common anode\
    \ displays. Can you work out why and correct the code?\n\n### 9.39 An Experiment\
    \ to Measure Code Speed\n\nThe two programs 9-5 and 9-6 differ in that one runs\
    \ the switch statement on every loop and the other has it nested into an if statement\
    \ that it only runs when required to change the display. To measure the execution\
    \ time of loop, the RA2 I/O pin was configured as a digital output and toggled\
    \ every loop. This is the temporary modification to both programs so that loop\
    \ time could be measured directly using an oscilloscope. The difference in hex\
    \ file sizes between 9-5 and 9-6 is an extra 36 bytes. This gives 40% improvement\
    \ in the loop time.\n\nvoid main() @ 0x20\n{\n    TRISA4 = 0;\n    TRISA2 = 0;\
    \ // Temporary modification.\n    TRISC = 0;\n    OSCCON = 0x70;\n    OPTION_REG\
    \ = 0xD7;\n    INTCON = 0xE0;\n    char value = 0, seconds_counter;\n    while\
    \ (1)\n    {\n        LATA2 = !LATA2; // Toggles the value of RA2.\n        if\
    \ (tick_counter >= 121) // When a second has been reached.\n        {\n      \
    \      tick_counter = 0; // Reset to start counting another.\n            value++;\
    \ // Increment the value by one.\n        }\n        // Putting ! in front of\
    \ a bit inverts its value: 0 to 1 or 1 to 0.\n        // The oscilloscope traces\
    \ in Figure 9-8 show the difference in speed.\n        // These show the voltage\
    \ on RA2 that changes every loop.\n        // A switch statement running every\
    \ time instead of just when it is required results in a time of 5.3µs instead\
    \ of 3.1µs.\n        // It is fair to say that this does not improve this program\
    \ in any way as the display has to be updated every second meaning that the loop\
    \ goes nearly 190,000 times between display updates. In other programs time savings\
    \ such as this might be important.\n}\n\n## 9.4 Serial Communication\n\nCommunicating\
    \ with a computer over a serial link in C is similar to using assembly language:\
    \ you still need to configure the same bits in the same registers. There is less\
    \ typing and you don't have to keep track of banks. One small point regarding\
    \ bank selection: although you don't have to worry about it, the compiler does\
    \ it for you when assigning values to special register for configuration you don't\
    \ group them in their banks. The compiled code can be a few bytes bigger.\n\n\
    ### 9.4.1 Serial Byte Transmission\n\nProgram 9-7 outputs a byte value over serial\
    \ that can be read by the serial_reader program as before. The bytes increment\
    \ by one every second.\n\n// prog_09_07\n#include <xc.h>\n\n// PIC16F1823 Configuration\
    \ Settings\n// CONFIG1\n#pragma config FOSC = INTOSC\n#pragma config WDTE = OFF\n\
    #pragma config PWRTE = OFF\n#pragma config MCLRE = OFF\n#pragma config CP = OFF\n\
    #pragma config BOREN = OFF\n#pragma config IESO = OFF\n#pragma config FCMEN =\
    \ OFF\n// CONFIG2\n#pragma config LVP = ON\nchar tick_counter = 0;\n\nvoid interrupt\
    \ tick(void)\n{\n    TMR0IF = 0;\n    tick_counter++;\n}\n\nvoid main() @ 0x20\n\
    {\n    OPTION_REG = 0xD7; // Page 164 in the data sheet and Table 2-2 in the book.\n\
    \    OSCCON = 0x70; // Page 65 32 MHz See Table 2-1 in the book.\n    INTCON =\
    \ 0xE0; // Page 86 in the data sheet and Table 2-3 in the book.\n    TXCKSEL =\
    \ 1; // Set bit 2 of APFCON to change the use of pin 2 to be TX. See page 114.\n\
    \    SPBRG = 0x19; // Sets the Baudrate=clock/(64*(spbrgh:spbrgl))=19200 for clock=32MHz.\n\
    \    SPEN = 1; // Enables the serial port. See page 278.\n    TXEN = 1; // Enables\
    \ transmit. See page 277.\n    unsigned char value = 0;\n\n    while (1)\n   \
    \ {\n        if (tick_counter >= 122) // True after 1 second.\n        {\n   \
    \         tick_counter = 0; // Reset to start counting another.\n            value++;\
    \ // Increment the value by one.\n            TXREG = value; // Assign value to\
    \ TXREG for transmission.\n            while (!TRMT); // Wait for TRMT to go high.\n\
    \        }\n    }\n}\n\n## 9.4.2 Serial Byte Reception\n\nThe example program\
    \ for the byte reception Program 9-8 is a C version of Program 4-2 that has a\
    \ flashing LED with a constant on-time of 0.25 s and a variable off-time determined\
    \ by the value of a byte written to it from the computer running serial_writer.\n"
