  - "[PAGE 178]\n\np\n\n● 179\n\n**10.5 ****• ****The Voltmeter in C**\n\nThe final\
    \ program is the Voltmeter from Chapter 7 written in C. It follows the same state\
    \ \n\ndiagram as Figures 07-01 and 07-02. If you compare the C program with the\
    \ assembly \n\nprogram, because they follow the same state diagram, the different\
