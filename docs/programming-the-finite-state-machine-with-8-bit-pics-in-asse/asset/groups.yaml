    Y0 ; 加法结果的低字节。\nY1 ; 加法结果的高字节。\nENDC\n\nORG 0X00\nGOTO START\nORG 0X04 ; 中断向量。\n\
    BCF INTCON, TMR0IF ; 清除 tmr0 溢出中断标志。\nINCF TICKS, F ; 将 8.2ms 的节拍加1。\nRETFIE ;\
