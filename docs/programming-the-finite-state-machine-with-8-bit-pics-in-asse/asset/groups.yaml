    ## 6.5 • 二进制中的负数


    当我们在纸上运算表示负数时，只需在数字前加一个负号，并在加减法时考虑它。计算机中的二进制运算有所不同。让我们从考虑仅限 4 位的整数类型开始。这意味着可以表示
    0 到 15 之间的无符号数。表 6-4 显示了位模式，但有两列值：一列用于无符号，另一列用于带符号的表示。注意，0 到 +15 的无符号与 -8 到 +7
    的带符号使用了相同的位模式。对于 0 到 +7，带符号和无符号的值是相同的，但无符号的 +8 到 +15 范围映射到带符号的 -8 到 -1。


    现在取 +3（即 0011），从带符号整数中取 -3（即 1101）。如果将 +3 和 -3 相加，将得到 0。让我们相加二进制数 0011 和 1101。


    0011 = +3

    1101 = -3

    0000 产生 1 进位。


    你可以尝试表中任意两个绝对值相同的正数和负数对。例如，+2 和 -2。所有这些二进制数之和将为 0。


    现在例如，如果相加 +3 和 -8，答案是 -5。使用表中的二进制数 0011 和 1000：


    0011 = +3

    1000 = -8

    1011 = -5


