    程序的组装并将其写入 PIC 与第一章中描述的相同。


    一旦程序加载，LED 将闪烁，且闪烁次数将从串口传输。若要在您的计算机上读取此值，您可以在 Windows 上使用程序 *serial_reader.exe*
    或 Linux 下的等效程序。串口读取程序位于工作目录中，并在使用 TTL-232-5V-WE 引线接收时将单字节值打印到屏幕上。无需更改电气连接，只需运行程序即可。


    图 4-3a 显示了 64 位 Linux 版本的示例。其他版本也是相同的，只需记住在 Windows 版本的 *serial_reader.exe* 前不需要加
    `./`，而在 Linux 中需要使用 `sudo` 来允许打开 USB 端口。


    ![](img/a08bd00952da48f769971864f33af432_70_1.png)


