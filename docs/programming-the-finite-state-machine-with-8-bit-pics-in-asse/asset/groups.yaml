  - "[PAGE 65]\n\ng\n\ng\n\ny\n\n● 66\n\nThe *MOVLB* instruction can be used to move\
    \ the bank number into *BSR*. Alternatively, the \n\ngpasm *BANKSEL* directive\
    \ can be used to generate the required code for example.\n\n \n\n \n\nBANKSEL\
    \ TRISA\n\nThis will save you from looking up the bank number for *TRISA*. Although\
    \ this can be \n\nconvenient, there are times when you need to know the required\
    \ bank number. For \n\nexample, if you need to access several special registers\
    \ whilst configuring say the oscillator, \n\nthe interrupts, and the inputs and\
    \ outputs, you can save on bank switching if you write your \n\ncode so the special\
    \ registers are grouped by bank. \n\nAs programs become more complicated, the\
    \ problem of bank switching becomes more \n\ndifficult. Because of GOTOs and returning\
    \ from subroutines, you can easily be in the wrong \n\nbank for the subsequent\
    \ instruction. It is one of the first places to look if the code does not \n\n\
    run. Interrupts have automatic context saving. Therefore, the value in *BSR* is\
    \ restored on \n\nreturn so you only need to change the bank within the interrupt.\
    \ Refer to page 85 on the \n\ndatasheet. If you are programming in C, the compiler\
    \ will handle bank switching for you.\n\nMy suggestion is to inspect your code\
    \ by looking at small blocks such as the code for each \n\nmachine state, subroutine\
    \ or macro. By just looking at that block of code you can tell that it \n\nis\
    \ in the correct bank for the instructions in it. You might well end up with redundant\
    \ bank \n\nswitching but you can always optimize it once you have it running.\
    \ Be extra careful with \n\nmacros where code might be out of sight in a different\
    \ file.\n\nFor macros, the policy I adopt is to only put bank switching inside\
    \ a macro if there is a \n\nrequirement to switch banks partway through the macro.\
    \ This means you have to check to \n\nsee if you are in the correct bank before\
    \ entering the macro. It might seem inconvenient \n\nbut if you have bank switching\
    \ within the macro at the start, it could be redundant and \n\nwasteful of program\
    \ memory."
  - "[PAGE 66]\n\np\n\np\n\np\n\n● 67\n\n**Chapter 4 • Inputs and Outputs**\n\n**4.1\
    \ • Introduction**\n\nThe first three chapters only used PIC outputs to drive\
    \ LEDs. This was to simply get up and \n\nrunning with the toolchain and the concept\
    \ of FSM. This chapter will elaborate on inputs \n\nand outputs and deal with\
    \ digital/analog inputs, pulse width modulated outputs and serial \n\ncommunication\
    \ with a computer. PICs can also communicate with other devices using the \n\n\
    I2C bus and accept inputs by finger touching using capacitive sensing. The book\
    \ will not \n\ngo into these however from what has been covered and with the information\
    \ from the \n\ndatasheet, you should be able to make use of these in your projects.\
    \ From a state machine \n\npoint of view, the programs in this chapter are trivial\
    \ This chapter is about using the I/O. \n\n**4.2 • Serial Output to a Computer**\n\
    \nThese PICs have an ‘Enhanced Universal Synchronous Asynchronous Receiver Transmitter’\
    \ \n\n(EUSART) that we can use with an *FTDI* serial lead to communicate directly\
    \ between the \n\nPIC and computer. Contained within the archive file download\
    \ for both Windows and Linux, \n\nis a program called *serial\\_reader* that prints\
    \ to screen values transmitted by the PIC. To \n\nproduce data to transmit, program\
    \ 3-1 will flash an LED and increment a counter. The \n\ncounter value will be\
    \ transmitted over the serial link to the computer where it will be \n\ndisplayed\
    \ on the screen.\n\n![](img/a08bd00952da48f769971864f33af432_66_0.png)\n\n**4.2.1\
    \ • TTL Level Serial Communications**\n\nAn RS232 serial link in general uses\
    \ a negative voltage of between -3V and -25V to represent \n\na logical 1 and\
    \ a positive voltage between +3V and +25V to represent a logical 0. The PICs \n\
    \nand FTDI lead use voltages of 0V for a logical 0 and +5V (approx) to represent\
    \ a logical \n\n1\\. This is very convenient as we only need one power supply\
    \ voltage and no level shifting \n\ncircuitry. The serial link transfers bytes\
    \ of data at a rate referred to as ‘Baud’. The Baud rate \n\nFigure 4-1 State\
    \ Diagram for Program 4-1"
  - "[PAGE 67]\n\ng\n\ng\n\ny\n\n● 68\n\ncan be regarded in this case as bits per\
    \ second. We will use a rate of 19200 Baud. The bytes \n\nthat are sent along\
    \ the wire are made up of a leading start bit, 7 or 8 data bits, a parity \n\n\
    bit and then 1 or 2 stop bits. The programs presented here will not use the parity\
    \ bit, have \n\none stop bit and 8 data bits. This is configured by setting values\
    \ in registers then *EUSART *\n\nwill transmit values whenever a byte is loaded\
    \ into the *TXREG* register. Once configured, \n\nsending data requires only a\
    \ couple of lines of code each time.\n\n \n\n**4.2.2 • Configuring the EUSART\
    \ to Transmit a Byte**\n\nThe datasheet gives a full description of the Enhanced\
    \ Universal Synchronous Asynchronous \n\nReceiver Transmitter that is in both\
    \ PICs. There are many more accessible features than \n\nI will use. Page 268\
    \ shows a diagram of the transmit details. Table 4-1 shows the steps \n\nnecessary\
    \ to configure *EUSART* to transmit bytes.\n\n**Purpose**\n\n**Code**\n\n**Comments**\n\
    \n*Enable transmission.*\n\n*BSF TXSTA, TXEN *\n\n*TXEN is bit 5 in the transmit\
