    这些 `if` 语句不是汇编代码。它们属于汇器指令，用于在生成 hex 文件之前选择放入你的源码的汇编代码。此示例是为 *gpasm* 1.4.0 版本编写的，以兼容当前的
    Debian 版本。


    ## 3.3 子程序


    编写可重用的另一种方法是使用子程序。子程序是一段独立于主程序的代码块。它根据需要被调用。当它被调用时，主程序会暂时停止。子程序代码运行，完成后，主程序继续执行。然而，我们可以通过宏（macros）来实现相同的结果，但每当你使用宏时，组成宏的代码都会被插入到代码中，导致你产生大量的重复代码并占用程序内存空间。而子程序在程序内存中只出现一次。缺点是调用子程序会有时间开销。决定使用子程序还是宏取决于你如何优化代码。如果宏很长，那么子程序将节省更多空间。如果宏只有几行，那么调用和返回的开销可能会让宏成为更好的选择。


    ### 3.3.1 子程序示例


    为了演示子程序调用和返回的工作原理，这里有一个短程序，它再次闪烁 LED。LED 将点亮 1 秒并熄灭 2 秒。它没有使用带中断的定时器，而是使用了一个通过消耗时钟周期来产生延迟的子程序。虽然我提到过通过循环计数计数时钟周期不是一件好事，但这仅仅是为了演示子程序的调用。


    要创建一个子程序，以行左侧的标签开始例程，后面跟着你需要的任何代码。使用 `RETURN` 或 `RETLW` 指令结束例程。关于 `RETLW` 的信息请参考数据手册第
    319 页。程序 3-4 显示了程序。有两个状态：LED 亮和 LED 灭。在每个状态下，都会调用名为 `DELAY` 的子程序。该子程序有两个递减的嵌套循环。完成后，程序将在调用后的下一行继续执行。要设置延迟周期，在调用子程序之前会将一个值移入
    `BUFFER0`。


    ```assembly

    ;prog_03_04.asm

    LIST P=16F1823

    #INCLUDE <p16f1823.inc>

    #INCLUDE <fsm_macros.inc>

    RADIX DEC ; 默认数字为10 进制。

    BOOK_CONFIGURATION

    CBLOCK 0x70

    BUFFER0

    BUFFER1

    ENDC

    ORG 0X00

    GOTO START

    START:

    CLRF BUFFER1

    MOVLB 1 ; OSCCON, OPTION_REG

    SET_FREQ_HZ 125000 ; Page 65 125k, and fsm_macros.inc.

    BCF TRISA, 2 ; 将 RA2 设置为输出

    MOVLB 0 ; 程序剩余部分访问 PORTA。

    ;机器状态

    S0 ; LED 亮。

    MOVLW d’40’ ; 40 约产生0.99 秒。

    MOVWF BUFFER0 ; 调用子程序前加载缓冲区。

    CALL DELAY ; 调用子程序。

    BCF PORTA, 2 ; 灭 LED。

    返回到状态 1。

    S1 ; LED 灭。

    MOVLW d’80’ ; 80 约产生1.99 秒。

    MOVWF BUFFER0 ; 调用子程序前加载缓冲区。

    CALL DELAY ; 调用子程序。

    BSF PORTA, 2 ; 点亮 LED。

    GOTO S0 ; 回到状态 0。


    Subroutine

    DELAY

    DECFSZ BUFFER1, F

    GOTO $-1 ; 循环 256 次，内层循环共 256*3 + 1 = 769 个指令周期。

    DECFSZ BUFFER0, F

    GOTO DELAY ; 根据加载到 BUFFER0 的次数循环，外层循环。

    RETURN ; 从子程序返回

    END

    ```


    ### 3.3.2 返回地址与栈


    当使用 `CALL` 指令时，程序计数器加 1（*PC+1*）的值会被压入栈顶。在描述“返回”的章节之前已经提到过栈。然后将子程序的地址移动到程序计数器中，以便现在执行该子程序。如果你查看数据手册第
    39 页，有关于栈的解释。如第 1 章所述，这两款 PIC 具有 2048 个程序字，因此程序不会跨越边界。请参阅数据手册第 18 页。


    ### 3.3.3 计算延迟


    以下是时间如何计算的说明：内层循环运行 256 次，因为它从 0 开始并逐次减 1 直到零。每个循环由 3 个指令周期组成：一个用于 `DECFSZ`，两个用于
    `GOTO`。在跳过时有一个额外一个周期。外层循环根据加载到 `BUFFER0` 的次数运行。内层循环需要 769 次周期（256*3 + 1)。如果我们在调用子程序前在
    `BUFFER0` 中放入 40，将得到 30885 次。由于时钟频率为 125kHz，一个指令的时间间隔如下：1/125000 = 8 微秒。这使得点亮时间为
    1.02 秒（30885 x 32e-6 = 1.019 秒）。


    故事还没有结束。S0 状态中还有三个指令周期，增加了 96 微秒。需要注意的是，循环内部的周期数。它们的时间会被乘以外层循环的次数。同样的解释适用于 S1
    状态的 LED 灭期间。此外，可以通过设置 `OSCTUNE` 寄存器的位来微调振荡器频率。请查看数据手册第 67 页。


    ### 3.3.4 从子程序调用子程序


    栈的目的是存储子程序和中断的返回地址。它的深度为 16，因此可以从子程序调用子程序并反向返回主程序。请参考数据手册从 39 页开始的图表。为了演示这一点，程序
    3-5 将两个循环拆分为两个子程序，使得主程序调用第一个子程序，然后调用第二个子程序。第二个子程序包含一个运行 256 次的循环，每次被调用都是如此。第二个子程序会被第一个子程序反复调用。次数由主程序在调用第一个子程序之前放入
    `BUFFER0` 的值决定。


