    \ the code. Real projects aren’t \n\njust about coding: our software has to do\
    \ something real. As a consequence, a chapter \n\ndeals with a method of circuit\
    \ board construction.\n\nAll coding is done in a text editor of your choosing.\
    \ The command line is used for running \n\nprograms. If you are a Windows user,\
    \ you might look at this as old fashioned. This is \n\nactually an efficient way\
    \ of doing things: simple scripts for repetitive tasks save lots of \n\nmouse\
    \ clicks. The last two chapters give an introduction to programming in C using\
    \ the XC8 \n\ncompiler. Again this is done using a text editor and the command\
    \ line.\n\nThe intention has been to achieve results using an inexpensive microcontroller\
    \ with simple \n\ncommand line tools. Much emphasis is placed on using Microchip’s\
    \ datasheet as this is the \n\nbest place to get correct detailed information."
- md: "\n## Chapter 1 Getting Started\n\n### 1.1 Introduction\n\nDon’t be put off\
    \ by the technical-sounding words ‘Finite State Machine’ (FSM). The principle\
    \ \nof how they work is really easy to understand. Firstly, the machine is not\
    \ an actual machine \nthat you have to build. It is merely a structure your program\
    \ has. The idea is that the \nprogram is broken down into a set number of states.\
    \ When the program is in one of these \nstates, it can respond to a set of inputs\
    \ or events resulting in the program jumping to a \ndifferent state. The outputs\
    \ from the program depend only on the state (Moore machine) \nor on the state\
    \ and the inputs (Mealy machine). Let’s start with the basic ‘Hello World’ \n\
    microcontroller program to flash an LED as an example of a state machine with\
    \ two states, \nLED ON and OFF.\n\n![](img/a08bd00952da48f769971864f33af432_9_0.png)\n\
    \nFigure 1-1 displays what the program does and how to write it.\n\nWhat the program\
    \ does is:\n\n- After power up, the initial conditions are the LED is ON and the\
    \ timer is reset and started.\n- After the timer expires, the LED turns OFF and\
    \ the timer is reset and started.\n- After the timer expires again, the LED turns\
    \ ON and the timer is reset and started.\n- This continues until the microcontroller\
    \ is powered down.\n\nIn this example, there is only one event that triggers a\
    \ change of state: This being the \nexpiry of the timer. The effect of the expiry\
    \ depends on the current state - it might jump \nto the LED ON state or the LED\
    \ OFF state. The fact that an input or event is only used \nby the current state\
    \ helps to make a more complicated program robust and easier to \nfollow. This\
    \ example is a Mealy machine, where outputs or actions are determined by \nthe\
    \ current state and inputs. On the state diagrams, the transitions between states\
    \ are \nshown by arrows. Alongside these are the input conditions that trigger\
    \ transitions and the \nresulting outputs. In a Moore machine, the outputs depend\
    \ only on the current state of \nthe machine. The outputs would be shown on the\
    \ diagram inside the states. This book is \nspecifically about practical programs.\
    \ I will not try to adhere to strict definitions. As for how \nFigure 1-1 A two-state\
    \ machine \n\nto write the program, you have already done the important bit by\
    \ planning. All that has \nto be done now is to implement the diagram as code\
    \ and this will be less prone to error \nas you can concentrate on local detail.\
    \ The book will mostly use the Mealy type machine. \nInputs causing a transition\
    \ will be separated by a forward slash from the outputs. This will \nbe written\
    \ next to the transition between two states. With regards to the FSM, inputs and\
    \ \noutputs (I/O) are not restricted to electrical I/O. They also include other\
    \ types of change. \nAn input could be the timer timing out or an output could\
    \ be the writing of a value to a \nregister in the CPU. FSMs can be written in\
    \ just about any programming language.\n\n### 1.2 Practical Implementation\n\n\
    Microcontroller projects do not need to be expensive. The two PICs that are going\
    \ to be \nused throughout the book are the 12F1822 and 16F1823 variants. Both\
    \ are cheap mid-\nrange devices, costing less than one pound in the UK at the\
    \ time of writing. They are \navailable in the dual in-line package (DIP) form\
    \ that is easy to solder or can be plugged \ninto a holder. The programs will\
    \ be written in a text editor and assembled with the gpasm \nopen-source assembler.\
    \ To load your programs into the PIC, you could use a programmer \nsuch as PICKIT\
    \ 3, but there is no need to buy one. Two programs have been written for this\
    \ \nbook that can read and write using an FTDI USB lead *TTL-232R-5V-WE*. This\
    \ same lead can \nalso be used for reading and writing data from PICs in later\
    \ projects.\n\n#### 1.2.1 Choice of Operating System\n\nMicrosoft Windows or Linux\
    \ can be used for assembling and loading programs to the PICs. \nThere are two\
    \ archive files available by way of a free download from the Elektor website:\
    \ \nOne is for Windows and the other for Linux. These files contain all the source\
    \ files for the \nexamples in the book and applications mentioned above. As described\
    \ in the preface, the \ncommand line method is used throughout the book for both\
    \ Linux and Windows. The use of \nthe terminal with typed commands might seem\
    \ like a throwback to the last century for \nthose who remember using DOS. It\
    \ is, however, a very easy way of doing things, especially \nfor repetitive tasks\
    \ like running assembler programs or loading the PIC with its program. \nTasks\
    \ can be simplified with scripts to save typing and recent commands can be recalled\
    \ \nusing the up and down keys. If you are using Linux, typing history will give\
    \ a numbered list \nof the previous commands you have used. They can be run again\
    \ by using the exclamation \nmark followed by the number. Auto-completion allows\
    \ you to use the tab key to list possible \nfiles. You never have to type the\
    \ complete name. If you are happy writing source code \nfor an electronic device\
    \ using text files then using the command line should be the logical \nchoice.\
    \ Graphic User Interfaces (GUIs) have their advantages. However, if you are doing\
    \ \nsomething repetitive, a lot of mouse clicking or even using keyboard shortcuts\
    \ is tedious \ncompared with running a script or recalling a previous command\
    \ and its options.\n\n#### 1.2.2 Machine Language and Assembly Source Files\n\n\
    The PIC microcontroller has to be programmed by loading the machine code into\
    \ its flash \nmemory. The word ‘programmed’ in the last sentence means transferring\
    \ machine code \nfrom a file on a computer to the PIC as opposed to writing the\
    \ code. The machine code is-\nthe raw byte values that it processes when running.\
    \ This machine code is first assembled \ninto a file called a hex on your computer.\
    \ It gets its name from the Intel Hex Format which \nis a file standard for this\
    \ purpose. The hex file is then written to the PIC using a combination \nof a\
    \ program on your computer and a hardware interface called a programmer. When\
    \ \nreferring to machine code, this is not the finite state machine but the processor\
    \ itself being \nreferred to as a machine.\n\nIt is possible to write your program\
    \ by typing a hex file directly into a text editor. Manually \nassembling machine\
    \ instructions is too time-consuming to be considered a realistic task. \nTo make\
    \ it easier, code is written in assembly language where short acronyms for machine\n\
    instructions are used to produce more readable code. The file that you type this\
    \ way is the\nsource code and usually has the file suffix .asm. This file is then\
    \ read by the assembler\napplication and written to the hex file.\n\nIt is generally\
    \ accepted that it is better to write your programs in a higher-level language.\
    \ \nIf you want to get things done quicker and with less chance of error, then\
    \ this is absolutely\ntrue. C language was invented to get away from the problems\
    \ of programming in assembly \nlanguage. This book is about finite state machines\
    \ implemented on simpler PICs. To write\ncode for a microcontroller, you have\
    \ to understand what is going on at the level where \nsoftware meets hardware.\
    \ Where C makes coding faster and easier, it also makes things\nmore complicated.\
    \ You don’t, however, see this extra complication: it’s taken care of by the\n\
    compiler and linker. All of this gets in the way of understanding what your code\
    \ is doing. \nFor the PICs used in this book, there are 49 available instructions.\
    \ The ones commonly used\nare quickly learnable. The beauty of assembly language\
    \ is that you can see what’s going on. The code you write is exactly the machine\
    \ code that goes into the PIC. Once the source \nfile is finished, it is converted\
    \ to machine language by the assembler application: in \ncase the program *gpasm*.\
    \ The assembler reads your source code and outputs the hex file. The hex \nfile\
    \ is then read by another application that writes to the PIC using some form \n\
    of hardware interface. Figure 1-2 below depicts this programming chain.\n"
