    \ argument is in milliseconds.\n\n RA2 = 0;\n\n }\n\n}\n\n**9.3.7 • Extending\
    \ the If Statement**\n\nFor making decisions in the program, the *if..else* statement\
    \ is much easier to use than \n\nwriting assembly code involving skips... even\
    \ if you write macros to make it more \n\nreadable. What if the choices are more\
    \ complicated in that more than one thing might be \n\ntrue but you want to favour\
    \ one over another? As a simple example, suppose the LED is \n\noff for the first\
    \ 3s after power-up, and on for the next 5s to then run at a quarter power \n\n\
    for 4s, then repeat the sequence.\n\nThe way we extend the if statement is to\
    \ use the else if statement. This allows us to \n\nprioritise decisions. The change\
    \ to LED on occurs at 3s. The change to 1/4 power occurs \n\nat 7s and then back\
    \ to LED off again at 12s. There are 122 ticks in a second, so to reach \n\n12s\
    \ requires a count of 1464 ticks. This is too many for a single byte. Therefore,\
    \ we need \n\nto use two bytes to count this high. We can let the compiler do\
    \ the work and declare the \n\ncounter variable as an unsigned integer, allowing\
    \ a count of up to 65535. To make it even \n\nmore convenient you can let the\
    \ compiler multiply the seconds by 122 so you don't have \n\nto. This arithmetic\
    \ is performed before compilation and therefore doesn't add to the code \n\nin\
    \ the PIC.\n\nProgram 9-4 is shown below. In addition to the *tick\\_counter*,\
    \ there is a *dim\\_counter* \n\nvariable declared as an unsigned character. This\
    \ gets incremented whenever the else part \n\ngets executed. The *dim\\_counter*\
    \ gets divided by 4 so that once out of every 4 increments \n\nthere is no remainder.\
    \ The expression *dim\\_counter%4* gives the remainder. If it is zero, \n\nthe\
    \ LED is turned on as *dim\\_counter%4 == 0* evaluates to true otherwise evaluating\
    \ to \n\nProgram 9-3 Use of A \\_\\_delay() Function"
