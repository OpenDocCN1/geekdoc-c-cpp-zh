  - "[PAGE 170]\n\np\n\n● 171\n\n**Chapter 10 • Further C**\n\n**10.1 • Introduction**\n\
    \nC saves you some effort in that it takes care of some of the more monotonous\
    \ aspects of \n\nprogramming. For example, being in the correct bank and C if..else\
    \ statements being much \n\neasier to use than conditional skips in assembly.\
    \ C is not a big language compared with \n\nmost others, but there is still a\
    \ lot to it. You can make good use of it even if you only know \n\nsome of it.\
    \ If you are new to it, this final chapter will cover some of the more important\
    \ \n\naspects to add to your repertoire. \n\n**10.2 • Data Types**\n\nC offers\
    \ several different types of data. When they reside in memory, these different\
    \ data \n\ntypes are just bits, either 0 or 1. What makes them into different\
    \ data types is how they are \n\ninterpreted when they are used. For example,\
    \ in the PIC, if we take the analog-to-digital \n\nconversion result in the registers\
    \ ADRESH and ADRESL, these two registers are eight-bit \n\nand could be read as\
    \ two separate values, each from 0 to 255. Because they are known to \n\ncontain\
    \ a 10-bit value, they are taken together as one 16-bit register. The 10 bits\
    \ of interest \n\nare either left justified or right justified - refer to Fig\
    \ 16-3 on page 133 of the datasheet. \n\nWith XC8, there are integers of different\
    \ lengths: 8, 16, and 32 bit (Both signed and \n\nunsigned). Refer to Chapter\
    \ 6 concerning negative numbers in binary. Since the compiler \n\nneeds to know\
    \ what it is dealing with, a variable is declared with its name and type. When\
    \ \n\na variable is declared it can also have a value assigned to it. This is\
    \ good practice as it can \n\nbe a cause of a bug if it gets used later in the\
    \ code without having a safe value. Here are \n\nsome examples:\n\nchar x = 10;\
    \ // Signed 8 bit integer value -128 to 127. \n\nunsigned char y = 5; // Unsigned\
    \ 8 bit integer value 0 to 255. \n\nint z; // Signed 16 bit integer value -32768\
    \ to 32767, not assigned a value.\n\nunsigned int a = 0 // Unsigned 16 bit integer\
    \ value 0 to 65535.\n\nunsigned long int a = 0 // Unsigned 32 bit integer value\
    \ 0 to 4294967296.\n\nbool update = false;\n\nThe char type can be assigned a\
    \ value that is expressed by writing a character in single \n\nquotes. The value\
    \ is then the ASCII value of that character for example.\n\nchar x = 'A'; // The\
    \ numerical value assigned to x will be 65, the ASCII value of A.\n\n \n\nEach\
    \ variable takes up space in memory, a char type requires one byte or register\
    \ in our \n\nPIC an int type takes two and a long int takes four. The compiler\
    \ takes care of this.\n\nThere are times when it is convenient to have several\
    \ values attached to one variable \n\nname. For this, you can use arrays. An array\
    \ of, for example, five 16-bit integers called 'zed' \n\ncould be declared as\
    \ follows, with various values. By the way, zed is just a made-up name."
