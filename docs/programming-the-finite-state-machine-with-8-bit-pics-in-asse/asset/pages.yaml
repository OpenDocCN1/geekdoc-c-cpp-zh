  md: "g\n\ng\n\ny\n\n● 26\n\n![](img/a08bd00952da48f769971864f33af432_25_0.png)\n\
    \n*PORTA *is the register holding the state of the pins for port A. In this example\
    \ bit 5 was \n\nconfigured as an output. Therefore, writing to bit 5 sets the\
    \ electrical state of the pin. \n\nThe *BTFSS STATUS, Z* decides whether to skip\
    \ the next instruction. If *Z* is high, the program \n\njumps to the line *BSF\
    \ PORTA, 5* (bit set file) and turns on bit 5 in *PORTA*. If *Z* is low the next\
    \ \n\ninstruction *GOTO ELSE* is executed. The program then jumps to *BCF PORTA*,\
    \ 5 (bit clear \n\nfile) turning off bit 5. \n\n**1.4 • Program Memory**\n\nThe\
    \ program is held in flash memory. Each location is 14 bits wide and holds a machine\
    \ \n\ninstruction. The next instruction to be executed is held in the program\
    \ counter that is 15 \n\nbits wide making it capable of addressing 32k locations.\
    \ The 12F1822 and 16F1823 PICS \n\nhave only 2048 locations implemented.\n\nThe\
    \ rate at which instructions are executed is determined by oscillator frequency.\
    \ It takes \n\nfour clock cycles for every instruction cycle. Program memory is\
    \ divided up into pages that \n\nare 2048 locations long. The program counter\
    \ PC that points to the current location in the \n\nprogram is 15 bits wide. It\
    \ can point to a range of 0 to 32767 or 32568 locations. The PC \n\nis loaded\
    \ from two registers: *PCL* and *PCLATH*. This occurs under five circumstances\
    \ that \n\nare described on page 38 of the datasheet. PCL is one of the special\
    \ function registers and \n\nappears in all banks. It provides the lower 8 bits\
    \ of *PC, PCL *(standing for Program Counter \n\nLower). *PCLATH* (standing for\
    \ Program Counter Latch Higher) provides the higher 7 bits. If \n\nyou are using\
    \ a PIC that has more than 2048 program memory locations, you have to be \n\n\
    aware that your program will cross page boundaries. Fortunately, we don’t have\
    \ to worry \n\nFigure 1-15 Part of an Assembly Language Program Implementing ‘if\
    \ ...else’"
