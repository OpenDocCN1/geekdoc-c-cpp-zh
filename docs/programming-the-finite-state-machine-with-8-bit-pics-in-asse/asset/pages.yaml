  md: "g\n\ng\n\ny\n\n● 94\n\nand the fact that all the soldered joints and wiring\
    \ are on the same side as the components \n\nmakes the board more crowded. Another\
    \ similar technique to the Manhattan method uses \n\nhigh-value resistors instead\
    \ of the copper islands: one end of the resistor is soldered to the \n\ncopper,\
    \ and the other end uses as a terminal to connect components. The idea is that\
    \ the \n\nhigh value of the resistors makes them effective insulators. Figure\
    \ 5-1 gives an example of \n\na board built using my suggested method.\n\n![](img/a08bd00952da48f769971864f33af432_93_0.png)\n\
    \n**5.3 • Cutting and Drilling the board**\n\nPlanning the circuit layout is time\
    \ well spent. If you have already tested your circuit on a \n\nbreadboard, you\
    \ will know the amount and the physical sizes of components. When finished, \n\
    \nyou will probably want to put the board in a box of some sort. For one-off experimental\
    \ \n\nprojects, I find it best to wait and acquire a box big enough at the end.\
    \ Lay the components \n\nout on a piece of paper starting with the larger items,\
    \ usually integrated circuits, large \n\ncapacitors, coils, and transformers if\
    \ you need them. Fit the smaller components around \n\nthem, having a thought\
    \ for the distances between components that are to be connected. \n\nIf carried\
    \ out with insulated wires, the connections on the opposite side can be allowed\
    \ to \n\ncross one another. This is one of the advantages of this method. Try\
    \ to plan your layout to \n\nkeep the interconnecting wires as short as possible.\
    \ The circuit diagram for the voltmeter is \n\nshown in Figure 5-2. It is similar\
    \ to the circuit in Figure 2-9 from Chapter 2. The 7-segment \n\ndisplay has been\
    \ omitted to save space in the diagram. This circuit is powered by four 1.5V \n\
    \ncells. Once the PIC has had the program loaded into it, the FTDI lead can be\
    \ disconnected. \n\nThe 5V supply from the lead is not used, and therefore, the\
    \ end of the red wire should \n\nbe insulated. Once the program has been loaded\
    \ into the PIC, the FTDI lead is no longer \n\nrequired for the project. By having\
    \ the terminals for the lead, future modifications can be \n\nmade to the program\
    \ including using the serial interface.\n\nFigure 5-1 Example of a Board"
