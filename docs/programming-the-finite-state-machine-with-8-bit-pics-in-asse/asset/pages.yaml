  md: "g\n\ng\n\ny\n\n● 120\n\nAgain the state machine is only for the subroutine\
    \ that divides one sixteen-bit unsigned \n\ninteger into another. *Xa* is the\
    \ numerator or dividend and *Xb* is the denominator or divisor, \n\n*Y* is the\
    \ quotient. *Xa* is made up of *Xa1* and *Xa0* and *Xb* is made up of *Xb1* and\
    \ *Xb0*. *Y* is \n\nmade up of *Y1* and *Y0*. The quotient will only need a 16-bit\
    \ integer. The remainder after \n\nthe division will be in *Xc*.\n\nTo preserve\
    \ the value of *Xa* if it is needed again in the program, it gets transferred\
    \ to *BUFF *\n\nmade up of *BUFFH* and *BUFFL*. *Xb* is then subtracted from *BUFF*\
    \ on each loop.\n\nState 0 transfers *Xa* to *BUFF* and resets *Y* and *Xc* to\
    \ zero. The resetting of *Y* and *Xc* does \n\nnot look like a Mealy machine as\
    \ it happens before the start of the transitions but has been \n\ndone this way\
    \ to shorten the code. The transitions from state 0 depend on if *Xb* is zero\
    \ or \n\nnot. If it is, the subroutine returns as division by *Xb* would result\
    \ in the subtraction loop \n\nrunning forever, division by zero!\n\nIf *Xb* is\
    \ greater than zero, the transition is to state 1. In state 1, *Xb* is subtracted\
    \ from *BUFF *\n\nand the result placed in *BUFF* until *BUFF* is less than zero.\
    \ If the result is less than zero, \n\nthe subroutine returns. If it isn't, *Y*\
    \ is incremented and the loop repeated. This results in *Y *\n\nholding the quotient\
    \ of the integer division and *Xc* holding the remainder.\n\nThe remainder is\
    \ the value of *BUFF* before the last subtraction. It is stored in *Xc*. Figure\
    \ \n\n6-9 shows the state diagram. Program 6-6 is the program. This listing shows\
    \ 65535 being \n\ndivided by 5997 resulting in 11 with a remainder of 8. Figure\
    \ 6-10 shows the output from \n\nserial reader using the option *\\-h* to read\
    \ a short (16-bit integer).\n\n![](img/a08bd00952da48f769971864f33af432_119_0.png)\n\
    \nFigure 6-9 State Diagram for the Division Subroutine"
