  md: "g\n\ng\n\ny\n\n● 184\n\nYou can create a structure for our flags like this:\n\
    \n \n\nstruct {\n\n \n\n unsigned int dis\\_update : 1;\n\n \n\n unsigned int\
    \ vol\\_available : 1;\n\n \n\n unsigned int read\\_required : 1;\n\n \n\n } flags;\
    \ \n\n \n\nIndividual flags can be accessed like this:\n\n \n\n \n\nflags.dis\\\
    _update = 1 // This sets the flag on.\n\nWe have already used this method before,\
    \ for example in Program 9-1, where *TRISAbits.*\n\n*TRISA2* was used. The definition\
    \ of the structure in this case would be found by tracing back \n\nthrough the\
    \ include file *xc.h*. Also *TRISA2* was used on its own, it had been defined\
    \ as a bit \n\ntype in the relevant include file. \n\nThere's a lot more to the\
    \ topic of structures. It would have to bring in other topics, for \n\nexample,\
    \ unions and pointers that are beyond the scope of these two chapters. \n\n**10.6\
    \ ****• ****Summary of Assembly, C, and Finite State Machines**\n\nThe most common\
    \ consideration regarding C versus assembly is that programming in \n\nC is better.\
    \ This is because the compiler does so much of the work for you. In C you no \n\
    \nlonger have to worry about bank selection that in assembly is a frequent cause\
    \ of errors \n\nin code. You can take certain things for granted like simple arithmetic,\
    \ which can be very \n\ncomplicated if done from scratch. Assembly can be difficult\
    \ to read compared to C where \n\nthe language has formats such as the if, if..else,\
    \ and while statements. In assembly, these \n\nare achieved with lots of skips\
    \ and goto instructions. goto can lead to what is referred \n\nto as spaghetti\
    \ code. The state machine can come to the rescue by giving the assembly \n\nprogram\
    \ the structure to make it readable and more robust. As mentioned, there are two\
    \ \n\nfundamental types of FSM: The Moore and the Mealy. If you look up Unified\
    \ Modeling \n\nLanguage (UML) or Harel statecharts, you will see how things have\
    \ progressed. I have seen \n\nexamples of the state machine approach used in many\
    \ control system programs. They \n\ndon't always adhere to the strict academic\
    \ version of a particular type. They nearly always \n\nmake up only part of the\
    \ program. The thing that gives them their stability is that if the \n\nprogram\
    \ is in a particular state, it can only respond to the inputs that that state\
    \ is looking \n\nat. In a way, the program is focused on one part at a time. Getting\
    \ back to the C versus \n\nassembly debate, 8-bit PICs can be programmed using\
    \ C. Assembly, however, can make \n\nbetter use of their smaller memory space.\n\
    \nI hope that this book has been useful. The finite state machine is only one\
    \ approach to \n\nwriting software. There are many different approaches to using\
    \ them. You can easily find \n\non-going debates about which programming language,\
    \ paradigm, text editor or IDE to use. \n\nI think the best way is to try as many\
    \ as you can and see what suits you."
