  md: "g\n\ng\n\ny\n\n● 142\n\n;PROG\\_08\\_01.asm\n\nLIST P=16F1823\n\n#INCLUDE <p16f1823.inc>\n\
    \n#INCLUDE <fsm\\_macros.inc>\n\n RADIX DEC ; Default numbers are to base 10.\n\
    \n BOOK\\_CONFIGURATION ; See macro in fsm\\_macros.inc.\n\n CBLOCK 0x70\n\n TICKS\
    \ ; Used to count 8.2ms ticks.\n\n SECONDS ; Used to hold the seconds count.\n\
    \n ENDC\n\n ORG 0X00\n\n GOTO START\n\n ORG 0X04 ; Interrupt vector.\n\n BCF INTCON,\
    \ TMR0IF ; Clear the tmr0 overflow interrupt flag.\n\n DECF TICKS, F ; Decrement\
    \ by one the 8.2ms ticks.\n\n BTFSS STATUS, Z ; Test to see if TICKS has reached\
    \ zero.\n\n GOTO $+4 ; If TICKS has not reached zero jump to return from interrupt.\n\
    \n INCF SECONDS, F ; If TICKS has reached zero increment the seconds count.\n\n\
    \ MOVLW 122\n\n MOVWF TICKS ; Restore TICKS to 122 (122 x 8.2 ms 1 second).\n\n\
    \ RETFIE ; Return from interrupt.\n\nSTART\n\n MOVLB 1 ; Bank 1 required for the\
    \ following macros.\n\n SET\\_FREQ\\_32MHZ ; See file fsm\\_macros.inc.\n\n SET\\\
    _TMR0\\_CASE1 ; Gives 8.2 ms ticks. See fsm\\_macros.inc.\n\n MOVLB 3 ; Bank 3\
    \ required for the following macro.\n\n SET\\_SERIAL\\_TX\\_16F1823 ; Configure\
    \ the serial comms, see file fsm\\_macros.inc.\n\n MOVLB 3 ; Leaves the previous\
    \ macro in bank 2, bank 3 required for the\n\n ; following macro.\n\nS0\n\n BTFSS\
    \ SECONDS, 0 ; Will skip the bext line if least significant bit is high.\n\n GOTO\
    \ S0 ; Stays in state 0 while least significant bit is low.\n\nS1\n\n DEBUG SECONDS\
    \ ; Transmits odd seconds\n\nS2\n\n BTFSC SECONDS, 0 ; Will skip the next line\
    \ if least significant bit is low.\n\n GOTO S2 ; Stays in state 0 while least\
    \ significant bit is high.\n\nS3\n\n DEBUG SECONDS ; Transmits even seconds\n\n\
    \ GOTO S0\n\n END\n\nBeginning at the *START* label there are three macros:\n\n\
    • \n\nto set the frequency, \n\n• \n\nto set up timer0 to produce the 8.2 ms interrupt\
    \ ticks \n\n• \n\nand lastly, one to set up the serial comms that will work with\
    \ the serial read program. \n\nGoing back a few lines in the code at the interrupt\
    \ vector is the interrupt service routine. \n\nThere is only one interrupt in\
    \ play: from timer0. The first thing is to reset the timer0 \n\ninterrupt flag\
    \ *TMROIF*. Next, the *TICKS* variable is decremented by one and the zero flag\
    \ \n\nin the *STATUS* register is tested to see if *TICKS* has reached zero. If\
    \ it has, the program \n\nskips one line and the *SECONDS *variable is incremented\
    \ to count another second. TICKS \n\nis then reloaded with the value 122 followed\
    \ by the return from interrupt.\n\nTo test the program so far, we will transmit\
    \ the value of the *SECONDS* file over a serial \n\nProgram 8-1 Traﬁc Lights Developing\
    \ the Timer"
