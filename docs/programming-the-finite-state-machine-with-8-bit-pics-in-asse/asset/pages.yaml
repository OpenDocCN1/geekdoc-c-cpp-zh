  md: "p\n\ny\n\ng\n\n● 47\n\n![](img/a08bd00952da48f769971864f33af432_46_0.png)\n\
    \nThe next part of the design process is to draw the finite state machine diagram\
    \ (see Figure \n\n2-10). Machine *M1* is the display driver. On power-on, the\
    \ LED is initialised to on, and then \n\nmachine *M0* starts in state 0. After\
    \ 0.25s, the timer expires and machine 0 transitions to \n\nstate 1. The timer\
    \ is reset, the LED turned off, the pulse counter is incremented by 1 and a \n\
    \nsignal called *UPDATE* is set to high. This *UPDATE* signal is used by machine\
    \ 1. While in state \n\n1, when the timer expires at 0.75s, the machine transitions\
    \ to state 0 and the timer resets \n\nand its LED turned on. This continues indefinitely.\
    \ When in state 1, if the pulse counter has \n\nreached 10, there is a transition\
    \ to the same state. This is to reset the pulse counter to \n\nzero. Meanwhile,\
    \ machine *M1* is running independently but time sharing the CPU. Machine \n\n\
    *M1* starts in state 0 and the display will be blank. When the *UPDATE* signal\
    \ goes high, the \n\nmachine transitions to state 2 and resets the *UPDATE* signal\
    \ to low. Depending on the value \n\nof the variable *N*, the machine transitions\
    \ back to state 1, driving on and off the necessary \n\nsegments of the display.\
    \ The machine will remain in state 0 waiting for another update \n\nsignal. The\
    \ output details shown for machine *M1* are for a common anode display. The \n\
    \ncomments in the code show the alternatives for a common cathode display.\n\n\
    Figure 2-9 Connections for the PIC 16F1823 and 7-Segment LED Display"
