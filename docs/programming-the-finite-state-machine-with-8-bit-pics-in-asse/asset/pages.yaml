  md: "g\n\ng\n\ny\n\n● 150\n\nAbove is an example of states, printed out to a file\
    \ using *serial\\_read*. The PIC was woken \n\nfrom sleep and ran around the states\
    \ displaying four zeros, three times before sleeping \n\nagain.\n\n**8.8 • A List\
    \ of Things to Remember**\n\n• \n\nHave a clear idea of what the program has to\
    \ do\n\n• \n\nBreak the program down into separate smaller problems\n\n• \n\n\
    Draw a top-level state chart or start with a flow chart to get a picture of what\
    \ you want\n\n• \n\nConsider using sub-states inside the main states to deal with\
    \ awkward details that \n\nwould otherwise add many more states\n\n• \n\nDraw\
    \ the circuit diagram and identify the inputs and outputs you need\n\n• \n\nStart\
    \ coding in small chunks and test as you go\n\n• \n\nGet the basic configuration\
    \ correct by using small temporary test routines to prove \n\ninputs, outputs,\
    \ and timers, etc\n\n• \n\nComment on as many lines as you can \n\n• \n\nKeep\
    \ your comments, code, and state diagrams synchronized\n\n• \n\nUse debugging\
    \ to troubleshoot\n\n• \n\nBank selection is probably the first place to look\
    \ for a problem\n\n• \n\nIf you get completely stuck, stop working and do something\
    \ else before trying again \n\nlater"
