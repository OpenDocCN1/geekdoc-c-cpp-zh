  md: "p\n\ng\n\ng\n\n● 143\n\nDebug Macro\n\nFigure 8-6 State Machine to Detect Edges\n\
    \nlead to a computer. As we will also be doing other tests, it makes sense to\
    \ have a macro \n\nthat can be placed in programs wherever we want to monitor\
    \ a value. Here is the macro. \n\nThere is one argument: that is the register\
    \ or file to be monitored. Bank 3 must be \n\nselected before using it.\n\nDEBUG\
    \ MACRO REG\\_TO\\_TX ; Bank 3 required. EUSART has to be configured to transmit.\n\
    \n MOVF REG\\_TO\\_TX, W\n\n MOVWF TXREG ; Start transmission by loading TXREG\n\
    \n BTFSS TXSTA, TRMT ; Poll TXSTA bit TRMT to see if the transmit shift register\
    \ is\n\n GOTO $-1 ; empty. See datasheet page 271, paragraph 26.1.1.14. \n\n ENDM\
    \ ; Leaves in bank 3.\n\nTo read the *SECONDS* file, we could just put the *DEBUG*\
    \ macro in a loop and it would \n\nconstantly transmit the value held in *SECONDS*.\
    \ Unfortunately, this can result in incorrect \n\nvalues being read. The problem\
    \ can be solved by introducing a 25 ms delay between \n\ntransmissions but you\
    \ get about 30 outputs per second... 29 more than you need. A more \n\nelegant\
    \ solution is to transmit the *SECONDS* value after each rising and falling edge\
    \ of \n\nthe least significant bit (LSB) of the *SECONDS *file. A simple four-state\
    \ machine provides \n\na way of detecting edges. This is shown in Fig 8-6. Starting\
    \ in state 0, if the least LSB \n\nof *SECONDS* is high there will be a transition\
    \ to *S1* where the value of *SECONDS* will be \n\ntransmitted. After transmission,\
    \ there will be a transition to *S2* where the machine will \n\nstay waiting for\
    \ the LSB to go low and then transition to *S3* to transmit again before \n\n\
    returning to *S0* to await the LSB going high again. *S1* transmits odd values\
    \ of *SECONDS*. \n\n*S3* transmits even values. This is implemented as a Moore\
    \ machine where the outputs \n\nare only dependent on the current state. A Mealy\
    \ machine would only need two states \n\nbecause transmissions would be done on\
    \ state transitions. The effect on the code, in this \n\ncase, is practically\
    \ none as states 1 and 3 are merely labels.\n\n![](img/a08bd00952da48f769971864f33af432_142_0.png)"
  merge: -1
  pgno: 142
