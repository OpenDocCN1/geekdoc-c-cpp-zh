    \ so program stays in state 0\n\n GOTO S0\n\n CALL DELAY\\_33\\_ms ; Call the\
    \ 33 ms subroutine.\n\nS1\n\n INCF PULSE\\_COUNTER, F\n\n MOVF PULSE\\_COUNTER,\
    \ W ; Move value in PULSE\\_COUNTER to W\n\n BANKSEL TXREG\n\n MOVWF TXREG ; Loading\
    \ TXREG starts the transmission.\n\n BTFSS TXSTA, TRMT ; When the transmission\
    \ has completed TRMT gets set, until then this\n\n ; line and the next loop round\
