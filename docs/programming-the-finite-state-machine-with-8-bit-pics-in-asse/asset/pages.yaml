  md: "g\n\ng\n\ny\n\n● 104\n\nAny value from 0 to 255 can be expressed by selecting\
    \ bits. The value 192 is \n\nB’11000000’ in binary and the value 3 is B’00000011’.\
    \ Adding 192 to 3 gives 195.\n\n \n\n 11000000 = 192\n\n \n\n+00000011 = 3\n\n\
    \ \n\n 11000011 = 195\n\nAdding 3 to 6 gives 9. In any column, 1 + 0 gives 1,\
    \ but 1 + 1 gives a value too large for \n\nthat column. Therefore, it is carried\
    \ as a 1 to the next column. In this example, the two’s \n\ncolumn is a 2 added\
    \ to a 2 giving the carry over into the four’s column. In the four’s \n\ncolumn,\
    \ the carry added to the existing four value results in an eight that is carried\
    \ over \n\nto the eight’s column. \n\n \n\n 00000011 = 3\n\n \n\n+00000110 = 6\n\
    \n \n\n 00001001 = 9\n\nAnother example is adding 3 + 3 to get 6. In the first\
    \ column, there is a carry to the \n\ntwo’s column giving a sum of 2 + 2 + 2.\
    \ This means another carry into the four’s column \n\nwith 2 left in the two’s\
    \ column. Also, note that multiplying by two can be done by moving \n\nall the\
    \ bits one place to the left.\n\n \n\n 00000011 = 3\n\n \n\n+00000011 = 3\n\n\
    \ \n\n 00000110 = 6\n\n**6.2.1 • Adding Two Eight Bit Positive Integers**\n\n\
    \ \n\nSo far all very straight forward, let’s write a program that can add two\
    \ eight-bit numbers \n\nand output the result to a computer. Program 6-1 has two\
    \ new instructions: \n\n*• *\n\n*ADDWF*: this adds the contents of a file to the\
    \ working register and puts the result in \n\nthe destination that can be either\
    \ *W* or back in the file. If the result is greater than \n\n255, the destination\
    \ will roll over and the carry bit *C* in the *STATUS* register is set. By \n\n\
    rolling over, I mean that if the result was, for example, 360, the carry bit represents\
    \ \n\n256 of this, leaving 104 that would appear in the destination.\n\n*• *\n\
    \n*ADDWFC*: this adds the contents of the working register *W*, to a file and\
    \ the carry \n\nbit *C* (set or not set by a previous calculation). If the carry\
    \ bit has been set, it will \n\nbe added as 1 to the addition of the file and,\
    \ *W*, the result will be placed in the \n\ndestination (*W* or *F*) and the carry\
    \ bit either cleared or set depending on the result. \n\nThe program has a subroutine\
    \ that does the addition. The result is transmitted by the \n\nsubroutine *TX\\\
    _SIXTEEN\\_BIT\\_NUMBER*.\n\nThere are two separate additions in the program:\
    \ 192 + 168 and 192 + 3, however, any"
