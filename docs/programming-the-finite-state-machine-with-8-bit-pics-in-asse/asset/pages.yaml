  md: "g\n\ng\n\ny\n\n● 22\n\n![](img/a08bd00952da48f769971864f33af432_21_0.png)\n\
    \n**1.3.5 • PIC Architecture**\n\nInside the PIC is a central processing unit\
    \ connected to a set of peripheral devices, memory \n\nand inputs and outputs.\
    \ Refer to pages 9 and 16 of the datasheet. You get a lot for your \n\nmoney!\
    \ Throughout the book and in comments to the source code files, I will refer to\
    \ pages \n\nto supplement information. These are the pages in the Microchip *DS40001413E*\
    \ datasheet \n\nunless stated otherwise.\n\nThere are three areas of memory:\n\
    \nProgram Memory\n\nNon-volatile: it retains information when the power is off.\
    \ It is flash memory. This is where \n\nyour program (the hex file) is loaded\
    \ to.\n\nData Memory\n\nVolatile: it does not retain information when the power\
    \ is off. It is a random access memory \n\n(RAM), made up of banks of eight-bit\
    \ registers also referred to as files in this context. \n\nElectrically Erasable\
    \ Programmable Read-Only Memory (EEPROM)\n\nNon-volatile: this can be used to\
    \ store data when the power is off.\n\nThis is called the Harvard architecture\
    \ where the program and the data are in separate \n\nmemory areas.\n\n**1.3.6\
    \ • Data Memory Organization**\n\nData memory is made up of 32 banks. Each bank\
    \ has 128 locations although not every \n\nlocation is implemented. Each location\
    \ is one byte or eight bits wide. Some of the implemented \n\nmemory can be used\
    \ to store variables. Other locations are registers that have predefined \n\n\
    use and are called special function registers. Pages 22 to 25 of the datasheet\
    \ shows a map \n\nof data memory. Of these special registers, 12 are core registers.\
    \ These are repeated in \n\nevery bank in the first 12 locations. I’ll start by\
    \ mentioning only three of these registers:\n\nFigure 1-13 Bitwise Logic"
