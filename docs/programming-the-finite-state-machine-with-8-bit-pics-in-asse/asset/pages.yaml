  md: "p\n\n● 175\n\nTable 10-1 shows the 32 bits in a four-byte integer. To access\
    \ Byte 3, we can shift all the \n\nbits 24 places to the right using the operator\
    \ *\\>>*. This will put Byte 3 where Byte 0 is and \n\nthe other bytes will drop\
    \ off the end and not be seen. Something to be aware of when we \n\nwrite something\
    \ like *w >> 24* - this does not alter w, it just means that we are seeing the\
    \ \n\nvalue of x with right-shifted bits. If we want to change x by shifting the\
    \ bits, we would have \n\nto write this assignment, *x = x >> 24*. x is now being\
    \ re-assigned with its right-shifted \n\nvalue. \n\nLooking at the code snippet:\
    \ \n\n TXREG = w >> 24 & 0xFF ; // Bitwise and 0XFF with most significant byte.\n\
    \n while (!TRMT); // Wait for TMRT to go high when.\n\n TXREG = w >> 16 & 0xFF;\
    \ // Bitwise and 0XFF with the next significant byte.\n\n while (!TRMT); // Wait\
    \ for TMRT to go high when.\n\n TXREG = w >> 8 & 0xFF; // Bitwise and 0XFF with\
    \ the next significant byte.\n\n while (!TRMT); // Wait for TMRT to go high when.\n\
    \n TXREG = w; // Bitwise and 0XFF with least significant byte.\n\n while (!TRMT);\
    \ // Wait for TMRT to go high when.\n\nWe can access the most significant byte\
    \ by assigning variable *w* to *TXREG* with the bits \n\nshifted 24 places to\
    \ the right. Variable *w* does not change, so we can now access the next \n\n\
    most significant byte by assigning *w* right-shifted 16 places to *TXREG*, and\
    \ then an 8-bit \n\nshift for the next byte, and finally no shift for the least\
    \ significant byte. The result of the bit \n\nshift is bitwise ANDed (&) with\
    \ the mask 0xFF (B'11111111') so that only bits 0 to 7 are \n\nassigned to *TXREG*.\
    \ This is not required in this case as TXREG is only an 8-bit register. Only \n\
    \n8 bits can be assigned, however for generality, if you were assigning to something\
    \ other \n\nthan *TXREG* and it had more than eight bits, you would need this\
    \ bitwise AND to mask off \n\nany unwanted bits. You can try compiling without\
    \ the bitwise AND here and it will still work.\n\nAnother very common C statement\
    \ is the for loop. As we want to carry out six calculations \n\nwith different\
    \ values, we are going to use this loop to take a different member from the x\
    \ \n\narray on each lap around the loop. \n\n**10.4.2 • The \"for\" loop**\n\n\
    This statement is used to repeat the execution of a block of code several times.\
    \ The form \n\nis as follows\n\n \n\nfor (n = 0; n < 100; n++)\n\n \n\n{\n\n \n\
    \n// Whatever code is inside these brackets will be executed 100 times.\n\n \n\
    \n}\n\nFollowing the for inside the parenthesis are three statements: an initial\
    \ assignment to an \n\ninteger, in this case *n*, followed by a comparison of\
    \ this integer with some value and finally \n\nan operation on the variable -\
    \ in this case, it is incremented. After the parenthesis, there \n\nare the brackets\
    \ containing code to be repetitively executed."
