  md: "p\n\ng\n\n● 27\n\nabout this with these two PICs as all of our program will\
    \ be on page 0. This can be seen in \n\nthe diagram on page 18 of the datasheet.\n\
    \n**1.5 • Hello World**\n\nHere is the obligatory ‘Hello World’ program which\
    \ flashes an LED. It is the same as the \n\nstate machine described in the introduction\
    \ to the chapter except that in state 1 the LED \n\nis off instead of on, and\
    \ the timer is a counter that resets by rolling over from 255 to 0.\n\n; prog\\\
    _01\\_01.asm ‘Hello World’\n\nLIST P=12f1822\n\n#INCLUDE <p12f1822.inc>\n\n \\\
    _\\_CONFIG 0X8007, (\\_FOSC\\_INTOSC & \\_WDTE\\_OFF & \\_PWRTE\\_OFF & \\_CP\\\
    _OFF & \\_BOREN\\_OFF & \\_IESO\\_OFF & \\_FC-\n\nMEN\\_OFF)\n\n \\_\\_CONFIG\
    \ 0X8008, (\\_LVP\\_ON)\n\n CBLOCK 0x70 ; Declares a register as the variable\
    \ COUNTER at location 0x70.\n\n COUNTER\n\n ENDC\n\n ORG 0x00 ; Directive to the\
    \ assembler to start assembling the code from location\n\n ; 0x00.\n\n MOVLB 1\
    \ ; Change to bank 1 for TRISA and OSCCON.\n\n BCF TRISA, 2 ; Sets RA2 (pin 5)\
    \ to be an output.\n\n MOVLW 0x10\n\n MOVWF OSCCON ; Configures the oscillator\
    \ to run at 31.25kH (page 65).\n\n MOVLB 0 ; Change to bank 0 for PORTA.\n\nSTATE\\\
    _0\n\n DECFSZ COUNTER, F ; COUNTER is at memory location 0x70 its value is decremented\
    \ by 1 and\n\n ; the result is stored back in the file COUNTER if the result is\
    \ zero\n\n ; the program skips a line otherwise the next line is executed.\n\n\
    \ GOTO STATE\\_0 ; If the value of COUNTER is not zero this line is executed.\n\
    \n BSF PORTA, 2 ; The program skips to here if the COUNTER is zero and turns the\
    \ \n\n ; output on.\n\nSTATE\\_1\n\n DECFSZ COUNTER, F ; This loop works the same\
    \ way.\n\n GOTO STATE\\_1\n\n BCF PORTA, 2\n\n GOTO STATE\\_0 ; After turning\
    \ the output off the program jumps back to the off loop.\n\n END\n\n**1.5.1 •\
    \ Some Key Points**\n\n• \n\nOn any line where there is a semi-colon, the rest\
    \ of the line is a comment and is \n\nignored by the assembler. The first line;\
    \ Program 1-1 Hello World, is just to identify \n\nthe program to the human reader.\
    \ \n\n• \n\nThe second line has the word LIST followed by p= 12f1822, this tells\
    \ the assembler \n\nprogram what type of processor is being used.\n\n• \n\nThe\
    \ #include <p12f1822> line tells the assembler to read this file. The file is\
    \ one of \n\nthe header files containing numerical definitions of abbreviations\
    \ used in the assembly \n\ncode. If you want to read this file, it is in the */usr/share/gputils/headers/*\
    \ folder if you \n\nare using Linux, and *C:\\\\Program Files(x86)\\\\gputils\\\
    \\header\\\\* if you are using Windows. \n\nIt can be read with a text editor.\
    \ Don’t alter it! The lines beginning with \\_\\_CONFIG  \n\nare extremely important.\
    \ They set the bits in the two memory locations known as \n\nconfiguration words.\
    \ For the PICs, they are at addresses 0x8007 and 0x8008 in flash \n\nProgram 1-1\
    \ Hello World"
