  md: "g\n\ng\n\ny\n\n● 134\n\n**ADCON1**\n\n*E*\n\n*7*\n\n*1*\n\n*ADRESH:ADRESL Right\
    \ justi-*\n\n*fied. Eight least significant bits in *\n\n*ADRESL*\n\n*6*\n\n*1*\n\
    \n*Set the ADC clock period to 2 μS *\n\n*for 32 Mhz clock speed.*\n\n*See Table\
    \ 16-1 in the data sheet*\n\n*5*\n\n*1*\n\n*4*\n\n*0*\n\n*3*\n\n*3*\n\n*0*\n\n\
    *Unimplemented*\n\n*2*\n\n*0*\n\n*Unimplemented*\n\n*1*\n\n*1*\n\n*V REF + is\
    \ connected to internal *\n\n*Fixed Voltage Reference (FVR) *\n\n*module*\n\n\
    *0*\n\n*1*\n\nThe reference voltage is 4.096 V or 4096 mV. This equates to an\
    \ A-D conversion of 1024. \n\nA change of one least significant bit is therefore\
    \ 4096/1024 or 4 mV.\n\nFrom Fig 5-2, the input voltage is reduced by the input\
    \ potential divider by a factor of \n\n22/122. A change of one least significant\
    \ bit means a change of 4x122/22 mV, equal to \n\n22.1818 mV at the voltmeter\
    \ probes. To read in millivolts, we have to multiply the result \n\nin *ADRESH:ADRESL*\
    \ by 22.1818. However, we can not do floating-point arithmetic only \n\ninteger\
    \ arithmetic. Therefore we need to find two integers with a ratio of 22.1818:1.\
    \ \n\nNow, 22.1818/1 is the same as 221818/10000. We need to multiply by 221818\
    \ then divide \n\nby 10000. We do, however, need to tread carefully here when\
    \ multiplying 221818 x 1023, \n\nwhich is the highest possible result. It will\
    \ give 226919814 (28 bits). This is too big for \n\nour 24-bit dividend. By dividing\
    \ by the numerator and denominator first by 20 to get \n\n11090.9/500 rounded\
    \ to 11091/500, it gives a ratio of 22.182. The maximum product will \n\nbe 1023\
    \ x 11091, equal to 11,346,093 (24 bits). There is one more thing to watch out\
    \ for \n\nwhen scaling with integers. This is to multiply before you divide, otherwise,\
    \ there will be \n\na loss in precision. For example, if I want to multiply 60\
    \ by 1.125, this could be done by \n\nmultiplying by 9 and then dividing by 8.\n\
    \n*60 x 1.125 = 67.5 correct answer. *\n\n*Using integer arithmetic*\n\n*Multipying\
    \ first:*\n\n*60 x 9 = 540*\n\n*540/8 = 67 integer result we lose the 0.5.*\n\n\
    *Dividing first:*\n\n*60/8 = 7 integer result we lose the 0.5.*\n\n*7 \\* 9 =\
    \ 63 bigger error. *\n\nTable 7-1 ADCON1"
