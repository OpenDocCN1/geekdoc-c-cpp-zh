  md: "g\n\ng\n\ny\n\n● 62\n\ndemonstrate a subroutine call.\n\nTo create a subroutine,\
    \ start the routine with a label at the left end of the line and follow \n\nit\
    \ with whatever code you need. End the routine with the instruction RETURN or\
    \ RETLW. \n\nRefer to the datasheet on page 319 for information about RETLW. Program\
    \ 3-4 shows the \n\nprogram. There are two states, LED on and LED off. While in\
    \ each state, the subroutine \n\ncalled DELAY is called. This subroutine has two\
    \ nested loops that count down. When finished, \n\nthe program resumes on the\
    \ line after the call. To set the delay period, a value is moved \n\ninto BUFFER0\
    \ prior to the subroutine call.\n\n; prog\\_03\\_04.asm\n\nLIST P=16F1823\n\n\
    #INCLUDE <p16f1823.inc>\n\n#INCLUDE <fsm\\_macros.inc>\n\n RADIX DEC ; Default\
    \ numbers to base 10.\n\n BOOK\\_CONFIGURATION ; See fsm\\_macros.inc\n\n CBLOCK\
    \ 0x70\n\n BUFFER0\n\n BUFFER1\n\n ENDC\n\n ORG 0X00\n\n GOTO START\n\n \n\nSTART:\n\
    \n CLRF BUFFER1\n\n MOVLB 1\n\n SET\\_FREQ\\_HZ 125000 ; Page 65 125kH, and fsm\\\
    _macros.inc.\n\n BCF TRISA, 2 ; Make RA2 an output, in bank 1 from the macro.\n\
    \n MOVLB 0 ; To access PORTA for the rest of the program.\n\n;--------Machine\
    \ states\n\nS0 ; LED on.\n\n MOVLW d’40’ ; 40 gives ~0.99 seconds.\n\n MOVWF BUFFER0\
    \ ; Load buffer prior to subroutine call.\n\n CALL DELAY ; Call subroutine.\n\n\
    \ BCF PORTA, 2 ; Turn LED off.\n\n ; On to state 1 on return.\n\nS1 ; LED off.\n\
    \n MOVLW d’80’ ; 80 gives ~1.99 seconds.\n\n MOVWF BUFFER0 ; Load buffer prior\
    \ to subroutine call.\n\n CALL DELAY ; Call subroutine.\n\n BSF PORTA, 2 ; Turn\
    \ LED on.\n\n GOTO S0 ; Back to state 0.\n\n;----------Subroutine\n\nDELAY\n\n\
    \ DECFSZ BUFFER1, F\n\n GOTO $-1 ; Go round 256 times, inner loop total of 256\\\
    *3 + 1 = 769\n\n ; instruction cycles.\n\n DECFSZ BUFFER0, F\n\n GOTO DELAY ;\
    \ Go round by the number of times loaded into BUFFER0, outer loop.\n\n RETURN\
    \ ; Return from subroutine.\n\n END\n\nProgram 3-4 Example of calling a subroutine"
