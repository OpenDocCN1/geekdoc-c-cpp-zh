  md: "g\n\ng\n\ny\n\n● 114\n\n![](img/a08bd00952da48f769971864f33af432_113_0.png)\n\
    \nAs can be seen in Figure 6-4, the serial reader correctly displays the output\
    \ of 1000, \n\nminus 1500 as -500 when the option for a short integer -h (two\
    \ bytes) is used. So how \n\nare negative numbers represented in binary?\n\n**6.5\
    \ • Negative numbers in binary**\n\nWhen we do arithmetic on paper to represent\
    \ a negative number, we just put a – sign \n\nin front of the number and take\
    \ it into account when doing additions and subtractions. \n\nBinary arithmetic\
    \ in computing is somewhat different. Let us start by considering an \n\ninteger\
    \ data type of only 4 bits. This means that unsigned numbers between 0 and 15\
    \ \n\ncan be represented. Table 6-4 shows the bit pattern but there are two value\
    \ columns: \n\none for unsigned and one for how signed is represented. Note how\
    \ the same bit pattern is \n\nused for 0 to +15 unsigned as -8 to +7 signed. For\
    \ 0 to +7, the two values for signed and \n\nunsigned are the same, but the +8\
    \ to +15 range of the unsigned maps across to the -8 \n\nto -1 of the signed.\
    \ \n\nNow take +3 that is 0011 and take -3 from the signed integers that is 1101.\
    \ If you add \n\n+3 and -3 you get 0. Let’s add the two binary numbers 0011 and\
    \ 1101.\n\n \n\n0011 = +3\n\n \n\n1101 = -3\n\n \n\n0000 with 1 carried out.\n\
    \nYou can try any pair of positive and negative numbers from the table that have\
    \ the same \n\nabsolute value. For example, +2 and -2. The sum of all of these\
    \ binary numbers will \n\nresult in 0.\n\nNow if for example, we add +3 and -8\
    \ the answer is -5. Using our binary numbers from \n\nthe table 0011 and 1000:\n\
    \n \n\n0011 = +3\n\n \n\n1000 = -8\n\n \n\n1011 = -5\n\nGiving the correct answer\
    \ of -5 from the table.\n\nFigure 6-6 Using Serial Reader"
