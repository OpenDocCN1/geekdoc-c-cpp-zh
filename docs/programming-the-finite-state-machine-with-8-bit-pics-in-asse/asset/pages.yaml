    \nTo access one of the members of this array, you use the index number of the\
    \ member \n\nenclosed in square brackets e.g. *zed\\[2\\]* has the value 3. The\
    \ first index number is 0, the \n\nlast is 4. *zed\\[4\\]* is 20000. I have missed\
    \ out floating-point variables as we don't need them \n\nhere. They can be used,\
    \ but you need to consider the overhead on a low resource device.\n\nA very useful\
    \ feature of C is the way a variable can hold the memory address of another \n\
    \nvariable. This is called a pointer: I won't go any further on this as we won't\
    \ need pointers \n\nfor this book. If you are going to use C for more than just\
    \ this book you will need to \n\nunderstand pointers.\n\n**10.3 • More on Functions**\n\
    \nIn assembly, we deal with subroutines and macros. Macros just substitute code\
    \ wherever \n\nyou insert the macro name in your source, thus saving typing. C\
    \ also has macros, but I \n\nam not going to cover these. Subroutines are different:\
    \ when you call a subroutine, the \n\nprogram jumps to a different place in the\
    \ program code and then executes what is there, \n\nreturning to where the program\
    \ was. The advantage of this is if you have something that has \n\nto be done\
    \ in more than in one place in the code, you only have to write code in one place\
    \ \n\nand then it can be called from many places. This saves memory space. In\
    \ C, there is the \n\nmain() function that is always there. Also, there can be\
    \ functions that are like subroutines. \n\nYou can call a function from anywhere\
    \ and when it finishes, the program continues from \n\nwhere it was called. Functions\
    \ take arguments that are data that the function can use. The \n\nfunction can\
    \ return data that the calling part of the code can then use. As an example of\
    \ \n\nhow a function can return a value, suppose there is a calculation that needs\
    \ to be carried \n\nout several times in the program. Rather than include the\
    \ calculation several times, it can \n\nbe in a function where the return value\
    \ is the result of the calculation. The input values to \n\nthe calculation are\
    \ the command arguments. Here is a function. It takes one argument, an \n\ninteger\
    \ value and returns the result of the calculation. \n\n \n\n int con\\_far\\_cent(int\
    \ f)\n\n \n\n {\n\n \n\n \n\nint c;\n\n \n\n \n\nc = (f-32)\\*5/9);\n\n \n\n \n\
    \nreturn c;\n\n \n\n } \n\nFor example, to use the function from within the main\
    \ function, I could assign the returned \n\nvalue from the function like this.\
    \ Here the value held by *temp\\_from\\_sensor* is being passed \n\nto the function.\
    \ The function is returning the value of the calculation to be assigned to \n\n\
    *temp\\_now*."
