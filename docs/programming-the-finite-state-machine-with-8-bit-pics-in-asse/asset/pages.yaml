  md: "g\n\ng\n\ny\n\n● 98\n\nrest of the software.\n\nLooking at the circuit diagram,\
    \ the probes used to measure voltage are connected to the \n\n*RA2* input configured\
    \ as an *AN2* analog channel through the *R11, R12* potential divider. We \n\n\
    will be configuring the PIC to compare input voltage against an internal reference\
    \ of 4.096 \n\nV. To achieve 4.096 V at the input pin, the voltage across the\
    \ probes will be 22.7 V: this \n\nbeing the full-scale reading. The maximum voltage\
    \ that can be applied without damaging \n\nthe PIC is 29.4 V if the supply voltage\
    \ is 5 V. See page 322 of the datasheet. You must \n\nnot apply a voltage greater\
    \ than 0.3 V above the supply voltage to any input pin, Schottky \n\ndiode D1\
    \ will be forward biased if this happens and will clamp the voltage on the input\
    \ to \n\naround 0.3 V above Vss.\n\nCalculation of maximum allowable voltage across\
    \ the probes for a PIC supply voltage of 5 \n\nV:\n\n \n\nMaximum voltage = (Vss\
    \ + 0.3) x 122/22 V. Where Vss is PIC supply voltage.\n\n \n\ne.g. 5.3x122/22\
    \ = 29.4 V.\n\nThis program does not display the value of the input voltage across\
    \ the probes. This will be \n\nin Chapter 7. It detects if the voltage is above\
    \ or below 4 V. When there is 4 V across the \n\nprobes, there will be 0.721 V\
    \ between the analog input pin and ground. This will produce \n\nan analog-to-digital\
    \ result of 180.\n\n \n\nA/D result = (4×22/122) \\* 1024/4.096 = 180.3 \n\nIf\
    \ you look at the ADC Transfer Function graph on page 141 of the datasheet, the\
    \ value of \n\n1023 (0x3FF) is one least significant bit (LSB) short of *Vref*.\
    \ This is why I used 1024 in my \n\ncalculation. Incidentally, one LSB is 4 mV.\
    \ As we are feeding the analog input pin through \n\nthe potential divider, 4\
    \ mV at the input pin is 22.18 mV at the probe leads. \n\nAll this program is\
    \ for is to test the circuit board. When powered up the display will show \n\n\
    0\\. If 4 V or more is connected across the input probe connections or the start\
    \ button is \n\npressed, the display will step through the numbers. Fig 5-5 shows\
    \ the state machines for \n\nthis program. There is the macro machine *M1* to\
    \ drive the seven-segment LED display and \n\nthe main machine *M0* to control\
    \ the sequencing and the A/D measurement. As before, \n\nthese two machines are\
    \ interlaced in that they run one block of code in one machine and \n\nthen run\
    \ one block of code in the other."
