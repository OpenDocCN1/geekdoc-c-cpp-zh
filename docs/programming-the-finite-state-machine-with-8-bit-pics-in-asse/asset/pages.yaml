    \nAs described for Windows, you will be asked several questions. This time the\
    \ default location \n\nis in the */opt* directory. This is OK as it will not get\
    \ in the way of your package manager.\n\n**9.2.3 • XC8 for 64 Bit Debian-Based\
    \ Distributions**\n\nThe XC8 compiler is a 32-bit program. To run it on a 64-bit\
