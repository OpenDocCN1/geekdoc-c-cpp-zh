  md: "g\n\ng\n\ny\n\n● 48\n\n![](img/a08bd00952da48f769971864f33af432_47_0.png)\n\
    \n \n\nNearly everything in program *prog\\_02\\_03.asm* has been already explained,\
    \ except for \n\none thing you have to watch out for: The READ MODIFY WRITE problem\
    \ that can happen \n\nwhen using the *BSF* and *BCF* instructions. Up to now,\
    \ we have only been setting one output \n\npin by setting the bit value on *PORTA*.\
    \ This works if you are only working with one output \n\npin on a port but something\
    \ strange happens when trying to alter an output shortly after \n\naltering a\
    \ different pin. To understand the problem, we have to look at basic electrical\
    \ \n\ntheory regarding charging and discharging capacitors, along with how the\
    \ PIC handles \n\nchanging the value of one pin at a time. When the PIC writes\
    \ to outputs it can only write \n\nto a complete byte or eight bits, so to change\
    \ one bit it has to read the state of the pins, \n\nmodify the one it wants to\
    \ alter, and then write back to the outputs. The problem is that say \n\n*PORTA*\
    \ bit 5 (physical pin 2) has been changed from 0 to 1, and then in the next instruction,\
    \ \n\nyou want to change the value on *PORTA* bit 4 (physical pin 3). The PIC\
    \ reads the values on \n\nthe *PORTA* pins - you might expect the value on bit\
    \ 5 to be high as you have just set it, but \n\nNO because in the real world the\
    \ electrical circuit could be capacitive and it will take time \n\nfor the voltage\
    \ to rise, resulting in the value of bit 5 reading as low. When the outputs are\
    \ \n\nwritten back to port, bit 5 (pin 2) gets set back to low. This is an example\
    \ of where testing \n\nin a simulator can let you down. Generally, when using\
    \ *BCF* and *BSF* you should write to \n\nthe latch registers for the ports (*LATA*\
    \ and *LATC*). If however, you are writing to the whole \n\nport as a register,\
    \ for example, using *MOVWF PORTA*, then this is safe.\n\nFigure 2-10 State Diagram\
    \ for Program 2-3"
