  md: "g\n\ng\n\ny\n\n● 36\n\ndemonstrate how to use *timer0* to cause a routine to\
    \ be carried out every time it overflows \n\nand then return the program to where\
    \ it was. To use interrupts, the global interrupt enable \n\nbit *GIE* must be\
    \ set in register *INTCON* (page 86). Additionally, the peripheral interrupt \n\
    \nenable bit *PEIE* and timer0 overflow interrupt enable bit *TMROIE* must be\
    \ set, again in \n\nregister *INTCON*\n\n \n\nWhen an interrupt occurs, the program\
    \ completes the instruction it is currently executing. \n\nThe *GIE* bit is cleared\
    \ to prevent another interrupt occurring. The program counter is \n\npushed on\
    \ to the hardware stack. A block in the core, 15 bits wide that has 16 locations\
    \ \n\nis used for storing program counter values. The value being stored is the\
    \ return address \n\nwhere the program must continue from after the interrupt\
    \ is over. Important registers such \n\nas *W*, *STATUS*, and some others are\
    \ temporarily stored in shadow registers in bank 31 to \n\nbe recovered later.\
    \ The program counter now jumps to 0x004. This special address is called \n\n\
    the interrupt vector. This happens automatically. If you look at page 39 of the\
    \ datasheet, \n\nthere is an explanation of the stack.\n\nThe code starting at\
    \ 0x004 is called the interrupt service routine and you have to write it. \n\n\
    The first thing to do is to determine the cause of the interrupt. In our first\
    \ example, we are \n\ninterested in TMR0 overflowing. When *TMR0* overflows, the\
    \ *timer0* interrupt flag *TMR0I* in \n\n*INTCON* gets set and this is used to\
    \ establish the cause of the interrupt.\n\nAt this point, we can execute any code\
    \ we want. *TMROIF* can now be cleared by our code as \n\nthe interrupt has been\
    \ caught. Next, the instruction return from interrupt *RETFIE* is used. \n\nThis\
    \ returns the program to where it was by popping the return address off the stack\
    \ to the \n\nprogram counter. It restores the *W, STATUS*, and other registers\
    \ (they are listed on page \n\n85) from the shadow registers and sets *GEI* again\
    \ so that other interrupts can be caught.\n\nIf another interrupt occurs while\
    \ an interrupt is being serviced, it is not forgotten. Its \n\ninterrupt flag\
    \ is still set and will cause another interrupt when the *GEI* is set again. Figure\
    \ \n\n2-3 shows the program flow for an interrupt."
