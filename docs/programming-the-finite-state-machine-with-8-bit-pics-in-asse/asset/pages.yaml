  md: "g\n\ng\n\ny\n\n● 90\n\nThis method works and is fine here where the program\
    \ has nothing else to do. The next \n\nprogram takes a different approach where\
    \ there is no blocking of the program so that if \n\nrequired other things can\
    \ be done while waiting for the switch contacts to settle down. \n\n**4.6.3 ●\
    \ A Better Method of Eliminating the Effect of Switch Bounce**\n\nThis program\
    \ might seem complicated and difficult to follow as it uses two finite state \n\
    \nmachines running together as threads. The state machine technique keeps the\
    \ different \n\nfunctions separate and easy to write. The first machine *M0*,\
    \ is the same as the previous \n\nprogram except that it does not look at the\
    \ input from the switch directly. It is informed of \n\nthe switch position by\
    \ a signal from the other machine, *M1*.\n\nMachine *M1* monitors the input directly\
    \ and if the switch moves to open from closed or from \n\nclosed to open, it starts\
    \ counting 1ms interrupt ticks. Only if the counter reaches 25 without \n\nthe\
    \ input bouncing, does it change the signal that is used by *M0*. \n\nThe way\
    \ the two machines run together is: once a block of state code is executed in\
    \ one \n\nmachine, the program executes a block of state code in the other machine.\
    \ No spinning \n\nloops are used as time delays except for waiting for serial\
    \ transmission of one byte to \n\ncomplete. This means the processor is not wasting\
    \ cycles. Figure 4-13 shows the state \n\ndiagram for Program 4-7.\n\n![](img/a08bd00952da48f769971864f33af432_89_0.png)\n\
    \nFigure 4-13 State Diagram for Program 4-7"
