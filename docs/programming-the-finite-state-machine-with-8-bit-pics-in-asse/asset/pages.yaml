    \n**6.2.3 • Adding Two Sixteen Bit Positive Numbers**\n\nJust using eight-bit\
    \ numbers is to a certain extent limiting as the largest unsigned \n\nnumber is\
    \ 255. If we move up to sixteen bits, this gives a range from 0 – 65535 \n\nwhich\
    \ is much more useful for practical programs. This requires two bytes for each\
    \ \n\naddend and three bytes for the sum to handle the maximum result possible,\
    \ adding \n\ntwo sixteen-bit numbers. Figure 6-3 shows how to do this. The two\
    \ 16-bit numbers \n\nbeing added are 65000 (253x256x + 232) and 50000 (195x256\
    \ + 80) giving a sum \n\nof 115000 (1x256x256 + 193x256 + 56) requiring three\
    \ bytes. The highest sum for \n\ntwo 65535 inputs is 131070 (1x256x256 + 255x256\
    \ + 254). This number can also be \n\naccommodated by three bytes. \n\nProgram\
    \ 6-2 carries this out. The comments explain what each line does. The serial \n\
    \nreader program reads a 16-bit integer with the command line option *\\-h*. The\
    \ next longest \n\ntype is the 32-bit (4 bytes) integer. The transmit subroutine\
    \ in the PIC will have to output \n\n4 bytes. The highest-order byte will always\
    \ be zero when adding only two sixteen-bit \n\naddends.\n\nTable 6-2 Using The\
    \ Serial Reader Program\n\nFigure 6-2 Using Serial Reader"
