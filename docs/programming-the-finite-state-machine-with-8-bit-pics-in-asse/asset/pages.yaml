  md: "p\n\nj\n\n● 93\n\n**Chapter 5 • Project Hardware Construction**\n\n**5.1 •\
    \ Introduction**\n\nUsing a plug-in breadboard is a convenient way of developing\
    \ software or wanting to try \n\ndifferent circuits. Sooner or later, you will\
    \ want to make a project to keep and this will require \n\nsome sort of circuit\
    \ board. There are many available options and if you are experienced \n\nat building\
    \ you will have your favoured methods. This chapter is for those who are new to\
    \ \n\ncircuit construction or want to try something different. The method to be\
    \ described here is \n\nmy preferred method. They are, however, more practical\
    \ than professional looking. They \n\nrequire the use of basic hand tools but\
    \ a workshop is not necessary. A piece of plywood \n\nor chipboard to protect\
    \ your work surface is all that is required. You will need to solder so \n\nhealth\
    \ and safety must be considered. Soldering irons will burn you if you touch the\
    \ wrong \n\nend. You could also accidentally burn through a mains supply. Also,\
    \ breathing in the fumes \n\nfrom hot solder is not recommended. When using drills\
    \ and other tools with points or sharp \n\nedges you can cut yourself. Remember\
    \ to protect your eyes from solder and swarf. **Be **\n\n**careful!** The above\
    \ list of mishaps is not exhaustive.\n\nI will begin by giving an overview of\
    \ the suggested method and make comparison \n\nto comparable methods. This method\
    \ is meant for building single projects and not for \n\ncommercial production.\
    \ It gives a reliable board that is easy to modify if you change your \n\ndesign.\
    \ It is also very easy to plan the layout and the wiring. How tidy you make your\
    \ boards \n\nis up to you. Ugly boards work just as well. This chapter will describe\
    \ the construction of a \n\ncomplete project, this being a digital DC voltmeter\
    \ with a range of 0V to 20V, powered by \n\nfour 1.5 V cells (AA or AAA size).\
    \ The display is a single-digit 7-segment LED that flashes \n\nfour significant\
    \ figures of the reading. It turns off when no voltage is detected for three \n\
    \nreadings. This chapter will deal only with the construction and testing of the\
    \ board. The \n\nvoltmeter program will be covered in Chapter 7 after binary arithmetic\
    \ has been described \n\nin Chapter 6. At the end of this chapter is a test program\
    \ to demonstrate the board.\n\n**5.2 • Overview of the Suggested Method**\n\n\
    The circuit boards are built on plain, single-sided copper clad board. They are\
    \ widely \n\navailable, usually in Epoxy Glass Fabric Laminate or Synthetic Resin\
    \ Bonded Paper. The \n\nformer is more expensive. Components are mounted on the\
    \ copper side by first drilling 0.5 \n\nmm diameter holes for component legs to\
    \ pass through and then connecting the circuit on \n\nthe non-copper side with\
    \ thin single-core wires using soldered joints. The holes need to be \n\ncountersunk\
    \ to prevent the copper from touching the legs. The copper side of the board is\
    \ \n\nused as a ground plane at 0 V. Any connections to 0 V can be soldered directly\
    \ to the copper \n\nwithout a hole. There are a couple of other methods that also\
    \ use single-sided boards, one \n\nwhere instead of drilling the board, small\
    \ single-sided copper pads are glued to the copper \n\nside as insulated islands\
    \ that the components can be soldered to. This is sometimes called \n\nManhattan\
    \ Construction. Integrated circuits e.g. PICs are glued upside down with their\
    \ legs \n\nupwards. This is referred to as dead bug. I don’t like this method\
    \ even though it has two \n\nadvantages: there is no need to drill lots of holes\
    \ and secondly, everything is accessible \n\nfrom one side. I find cutting and\
    \ gluing small pads just as time-consuming as drilling holes"
