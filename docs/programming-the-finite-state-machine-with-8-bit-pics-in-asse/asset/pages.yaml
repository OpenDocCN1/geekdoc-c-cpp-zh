    \ The \n\nbody of the switch is enclosed by a pair of braces and the body is divided\
    \ up into cases. \n\nEach case is made up of the word case followed by an integer\
    \ then a colon. Following the \n\ncolon is the code to be executed when the case\
    \ value matches the value. A very important \n\npoint to remember is at the end\
    \ of each case that precedes another case: you have to have \n\nthe word break\
    \ otherwise the next case block will be executed and you probably don't want \n\
    \nthat. State machine programs in this book have favoured the Mealy type where\
    \ outputs are \n\ndependent on current state and inputs. If you look at Program\
    \ 9-5, this is a Moore machine \n\nbecause the outputs are being driven depending\
    \ on the state, and all the time it is one \n\nparticular state the output code\
    \ is being executed over and over on each loop. As the output \n\ncondition is\
    \ a memory state, once written to it doesn't have to be reminded every loop. \n\
