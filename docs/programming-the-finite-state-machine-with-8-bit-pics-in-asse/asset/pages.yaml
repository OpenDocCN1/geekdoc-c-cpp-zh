    \ using DOS. It is, however, a very easy way of doing things, especially \n\n\
    for repetitive tasks like running assembler programs or loading the PIC with its\
    \ program. \n\nTasks can be simplified with scripts to save typing and recent\
    \ commands can be recalled \n\nusing the up and down keys. If you are using Linux,\
    \ typing history will give a numbered list \n\nof the previous commands you have\
    \ used. They can be run again by using the exclamation \n\nmark followed by the\
    \ number. Auto-completion allows you to use the tab key to list possible \n\n\
    files. You never have to type the complete name. If you are happy writing source\
