    \ ; Stay in the subroutine until 4 ticks of 8.2 ms.\n\n RETURN ; Return from subroutine.\n\
    \n END\n\nProgram 4-6 Counting Input Pulses with a Time Delay to Eliminate Bounce\
    \ Eﬀect"
