    **2.6 • Running More Than One Machine in a Program**\n\nThe two FSM programs have\
    \ so far had a small block of code for each state and have run \n\nthat code over\
    \ and over until some input event causes a jump to another state. I will now \n\
    \nsuggest a way of running more than one machine at once in a program: This is\
    \ like doing \n\ntwo things at once by performing part of one task then part of\
    \ another task then back to \n\nthe first and so on. This is time multiplexing,\
    \ the CPU in the microcontroller can only carry \n\nout one instruction at a time\
    \ so if tasks are to be carried out together they must share \n\nthe processor’s\
    \ time. Unlike timers and other peripheral parts of the PIC that are separate\
    \ \n\nhardware entities that can truly run concurrently, if there is more than\
    \ one task in the \n\nprogram, they only appear to run concurrently. They are\
    \ running as threads, with each \n\nthread sharing the processor’s time. To achieve\
    \ this multi-threading, the first machine \n\nProgram 2-2 Cycles of Cycles"
