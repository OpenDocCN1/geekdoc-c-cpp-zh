  md: "g\n\ng\n\ny\n\n● 106\n\n;PROG\\_06\\_01.asm\n\nLIST P=16F1823\n\n#INCLUDE <p16f1823.inc>\n\
    \n#INCLUDE <fsm\\_macros.inc>\n\n RADIX DEC ; Default numbers are to base 10.\n\
    \n BOOK\\_CONFIGURATION ; See macro in fsm\\_macros.inc.\n\n \n\n CBLOCK 0x70\
    \ \n\n TICKS ; Used to count 8.2ms ticks.\n\n Xa ; Augend for the addition.\n\n\
    \ Xb ; Addend for the addition.\n\n Y0 ; Sum low byte for the addition.\n\n Y1\
    \ ; Sum high byte for the addition.\n\n ENDC\n\n ORG 0X00\n\n GOTO START\n\n ORG\
    \ 0X04 ; Interrupt vector.\n\n BCF INTCON, TMR0IF ; Clear the tmr0 overflow interrupt\
    \ flag.\n\n INCF TICKS, F ; Increment by one the 8.2ms ticks.\n\n RETFIE ; Return\
    \ from interrupt.\n\nSTART\n\n MOVLB 1\n\n SET\\_FREQ\\_32MHZ ; See file fsm\\\
    _macros.inc.\n\n SET\\_TMR0\\_CASE1 ; Gives 8.1 ms ticks. See fsm\\_macros.inc\n\
    \n MOVLB 3 ; bank 3 required for EUSART macro.\n\n SET\\_SERIAL\\_TX\\_16F1823\
    \ ; Set up EUSART.\n\nLOOP\n\n CLRF TICKS\n\n MOVLW 244\n\n IF\\_REG\\_LESS\\\
    _THAN\\_W TICKS ; A delay of 2 seconds = 244\\*8.2 ms.\n\n GOTO $-3 ; We have\
    \ to jump back two lines in the macro.\n\n MOVLW 192\n\n MOVWF Xa ; Move 192 to\
    \ Xa.\n\n MOVLW 168\n\n MOVWF Xb ; Move 168 to Xb.\n\n CALL ADD\\_TWO\\_EIGHT\\\
    _BIT\\_NUMBERS ; Call subroutine.\n\n CALL TX\\_SIXTEEN\\_BIT\\_NUMBER ; Call\
    \ subroutine.\n\n MOVLW 192\n\n MOVWF Xa ; Move 192 to Xa.\n\n MOVLW 3\n\n MOVWF\
    \ Xb ; Move 3 to Xb.\n\n CALL ADD\\_TWO\\_EIGHT\\_BIT\\_NUMBERS ; Call subroutine.\n\
    \n CALL TX\\_SIXTEEN\\_BIT\\_NUMBER ; Call subroutine.\n\n GOTO LOOP\n\n; Subroutines.\n\
    \nADD\\_TWO\\_EIGHT\\_BIT\\_NUMBERS ; Y = Xa + Xb, note each X variable has one\
    \ byte.\n\n ; The output Y has a high and low byte.\n\n CLRF Y1 ; Zero the high\
    \ order byte.\n\n MOVF Xa, W ; Move contents of Xa to W.\n\n ADDWF Xb, W ; Add\
    \ Xb to W with result in W and the carry in STATUS C.\n\n MOVWF Y0 ; Put the low\
    \ byte of the result in Y0.\n\n CLRW ; Clear W, it needs to be 0 for the next\
    \ line.\n\n ADDWFC Y1, F ; Add W, Y1 and C with result in Y1.\n\n RETURN\n\nTX\\\
    _SIXTEEN\\_BIT\\_NUMBER\n\n BANKSEL TXREG\n\n MOVF Y1, W ; Put the high order\
    \ byte in W.\n\n MOVWF TXREG ; Transmit W using the EUSART.\n\n BTFSS TXSTA, TRMT\n\
    \n GOTO $-1 ; Loop while waiting for TRMT to go high.\n\n MOVF Y0, W\n\n MOVWF\
    \ TXREG ; Transmit the low order byte of the result.\n\n BTFSS TXSTA, TRMT\n\n\
    \ GOTO $-1 ; Loop while waiting for TRMT to go high.\n\n RETURN\n\n END\n\nProgram\
    \ 6-1 Adding Two Eight-Bit Positive Numbers"
