  md: "p\n\np\n\np\n\n● 81\n\n![](img/a08bd00952da48f769971864f33af432_80_0.png)\n\
    \nThis is OK if the Vdd voltage is regulated, but if you want to make measurements\
    \ independent \n\nof the supply voltage, you can use the internal voltage reference\
    \ of the chip as we will see \n\nlater in the book.\n\n**4.5 ● Pulse with modulated\
    \ outputs**\n\nTo supply a load with a variable voltage, the PICs use a technique\
    \ of pulse width modulation \n\n(PWM). This involves turning the output on and\
    \ off at a fast rate. Our example will be at a \n\nrate of 1.95 kHz. The frequency\
    \ that the output switches remains constant but the length of \n\ntime in each\
    \ cycle that the output is on is varied to control the power supplied to the load.\
    \ \n\nFigure 4-8 shows three traces: \n\n• \n\nTrace A, the time the output is\
    \ on is short with a long off-time, giving a low power \n\noutput. \n\n• \n\n\
    Trace B\n\n• \n\nTrace C the on-time is long with a short off-time giving a high\
    \ output power. The PIC \n\nallows us to vary this on to off ratio with up to\
    \ a precision of one part in 1024 that is \n\na 10 bit resolution. \n\nThe great\
    \ advantage of PWM is that when a perfect switch is on, it has current flowing\
    \ through \n\nit but no voltage across it. When off, it has a voltage across it\
    \ but no current through it. \n\nTherefore it does not dissipate any power. If\
    \ you tried to control the output power by using \n\na series pass transistor,\
    \ there would be power loss in the transistor. However, the output is \n\nnot\
    \ a perfect switch but the losses are very small. The voltage at the output is\
    \ either 5V or \n\n0V but can be made to appear like the average voltage by connecting\
    \ a capacitor across the \n\noutput. This is not required for an LED as your eye\
    \ averages the brightness.\n\nFigure 4-7 Reading the Input Voltage"
  merge: -1
