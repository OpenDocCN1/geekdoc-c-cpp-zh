    \ with the same intervals as before but only for 3 \n\nflash cycles. It then flashes\
    \ 10 times faster for 10 cycles before going back to the slower \n\nspeed. Note\
    \ there are four states with six transitions. There are off and on states for\
    \ fast \n\nflashing and off and on states for slow flashing. The whole diagram\
    \ can be divided into four \n\nquadrants with two dividing lines: one between\
    \ fast and slow and one between on and off.\n\n![](img/a08bd00952da48f769971864f33af432_40_0.png)\n\
