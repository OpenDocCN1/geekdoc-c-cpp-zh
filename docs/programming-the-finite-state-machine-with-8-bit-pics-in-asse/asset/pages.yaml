    \ than 5 s have elapsed stay in substate 1.\n\n GOTO S0\n\n END\n\n**8.7 • Using\
    \ Debug Macro on the Voltmeter Programmable**\n\nOne of the reasons why finite\
    \ state programming is so useful is the way the code that is \n\nrunning in any\
    \ given state is isolated from other code in the program. If you can monitor \n\
    \nthe state variable’s value, you can see what the program is doing. To demonstrate\
    \ this, we \n\ncan use the Debug macro to transmit the current state to the computer\
    \ and watch what is \n\nhappening. Program 8-4 is the voltmeter Program (7-1)\
    \ with some additional debug code. \n\nThe complete program is in the download\
    \ file, but reproduced here are the altered lines \n\nmarked with chevrons. The\
    \ 25 ms delay macro was added to settle the serial comms as the \n\nupdate rate\
    \ from the PIC is too fast.\n\n CBLOCK 0x70\n\n TICKS ; Used to count 8.2ms ticks.\n\
    \n STATE\\_M0\n\n STATE\\_M1\n\n STATE\\_M2\n\n Y0 ; Output variable for arithmetic.\n\
    \n Y1 ; Output variable for arithmetic.\n\n Y2 ; Output variable for arithmetic.\n\
    \n Y3\n\n Xa0 ; Input variable for arithmetic.\n\n Xa1 ; Input variable for arithmetic.\n\
    \n Xa2 ; Input variable for arithmetic.\n\n VALUE ; Is the value to be written\
    \ to the display (10 is blank).\n\n FLAGS ; The FLAGS bits are: 0 is display update,\
    \ 1 is division complete,\n\n ; 2 is voltage available, and 3 is reading required.\n\
    \n LAPS ; Number of laps with a zero display.\n\n BUFF\\_DEBUG1 ; Added for debug.\
    \ <<<<<<<<<<<<<<<<<<<<<<<<<<<\n\n BUFF\\_DEBUG2 ; Added for debug. <<<<<<<<<<<<<<<<<<<<<<<<<<<\n\
    \n ENDC\n\n;=================================================================================================\n\
    \n MOVLB 3\n\n CLRF TICKS ; Initialize count to zero.\n\n CLRF STATE\\_M0 ; Initialize\
    \ state to zero.\n\n CLRF STATE\\_M1 ; Initialize state to zero.\n\n CLRF STATE\\\
    _M2 ; Initialize state to zero.\n\n CLRF FLAGS ; Initialize FLAGS to false.\n\n\
    \ CLRF LAPS\n\n SET\\_SERIAL\\_TX\\_16F1823 ; For debug transmissions. <<<<<<<<<<<<<<<<<<<<<<<\n\
    \n MOVLB 0\n\n CLRF F10V ; Initiate to 0.\n\n CLRF F1V ; Initiate to 0.\n\n CLRF\
    \ F100mV ; Initiate to 0.\n\n CLRF F10mV ; Initiate to 0.\n\n;=================================================================================================\n\
    \nSWITCH\\_M0\n\n DELAY\\_25ms BUFF\\_DEBUG1, BUFF\\_DEBUG2 ; Delay to settle\
