  md: "p\n\np\n\np\n\n● 77\n\nPage 130 in the datasheet shows a diagram of the A/D\
    \ multiplexing. The procedure for \n\nconfiguring an analog input channel is as\
    \ follows. For this program, only one pin will be \n\nused as an analog input.\n\
    \nThe port must be configured so that the pin is an input and set as analog.\n\
    \n*• *\n\n*TRISA* or *TRISC* is used for setting the pin as an input. The default\
    \ setting is input.\n\n*• *\n\n*ANSELA* and *ANSELC* are used to set the inputs\
    \ as analog. *ANSELC* is only on the \n\n16F1823. The default setting is analog.\n\
    \nThe channel used by the A/D converter must be selected. \n\n• \n\nThe channel\
    \ select bits *CHS* in *ADCON0* is used to select the channel.\n\nVoltage reference\
    \ must be selected. Voltage reference is what the input voltage is being \n\n\
    measured against. This can be the +5V supply, external voltage reference or internal\
    \ \n\nvoltage reference.\n\n• \n\nThe *ADPREF* bits in *ADCON1* are used to select\
    \ voltage reference.\n\nThe conversion clock must be set. Pages 131 and 132 in\
    \ the datasheet explain this fully.\n\n• \n\nThe *ADCS* bits in *ADCON1* are used\
    \ to select the conversion clock.\n\nThe result of the conversion is a 10-bit\
    \ word presented in two registers: *ADRESH* and \n\n*ADRESL*. These are the high\
    \ and low bytes of the analog to digital result. We can justify the \n\nbits to\
    \ the left so that the 8 highest bits are in *ADRESH* and the two lowest in *ADRESL*,\
    \ or \n\nwe can justify right so that the lowest 8 bits are in *ADRESL* with the\
    \ two highest in *ADRESH*. \n\nFigure 16-3 in the datasheet shows this.\n\n• \n\
    \nThe justification is set by bit 7 *ADFM* in *ADCON1*.\n\nTable 4-4 shows the\
    \ mapping of analog channels to pins and I/O bits. Note how the channel \n\nnumbers\
    \ don’t always match the I/O numbers. Be careful when setting the *CHS* bits in\
    \ \n\n*ADCON0*.\n\n**Analog Inputs**\n\n*12F1822*\n\n*16F1823*\n\n*Port*\n\n*Pin*\n\
