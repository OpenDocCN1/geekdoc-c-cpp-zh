    \ of \n\nDebian.\n\n \n\n**3.3 • Subroutines**\n\nAnother way of writing reusable\
    \ code is to use a subroutine. A subroutine is a chunk of \n\ncode that stands\
    \ apart from your main program. It gets called as required. When it gets \n\n\
    called, the main program is temporarily halted. The subroutine code runs and then\
    \ when \n\nit finishes, and the main program continues. We could achieve the same\
    \ result by using \n\nmacros, however every time you use a macro the code that\
    \ makes up the macro gets \n\ninserted into the code and you end up with lots\
    \ of duplicated code taking up program \n\nmemory space. The subroutine only appears\
    \ once in the program memory. The downside \n\nis that there is a time overhead\
    \ in calling a subroutine. The decision to use a subroutine \n\nor a macro depends\
    \ on how you want to optimize your code. If the macro is long, then a \n\nsubroutine\
    \ would save more space. If the macro is only a couple of lines, then the call\
    \ and \n\nreturn overhead might make the macro a better choice. \n\n**3.3.1 •\
