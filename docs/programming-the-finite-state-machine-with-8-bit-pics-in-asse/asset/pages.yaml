  md: "p\n\n,\n\ng\n\n● 63\n\n**3.3.2 • Return Address and the Stack**\n\nWhen the\
    \ CALL instruction is used, the value of the program counter plus 1 (*PC+1*) is\
    \ \n\npushed on to the top of the stack. The stack was mentioned before when describing\
    \ the \n\nreturn from interrupts in the previous chapter. The location of the\
    \ subroutine is then moved \n\ninto the program counter so that the subroutine\
    \ is now executed. If you look at page 39 \n\nin the datasheet there is an explanation\
    \ of the stack. As mentioned in Chapter 1, these \n\ntwo PICs only have 2048 program\
    \ words and therefore the programs will not cross a page \n\nboundary. Refer to\
    \ the datasheet page 18.\n\n**3.3.3 • Calculating the Delay**\n\nHere is an explanation\
    \ of how the time delay was calculated:\n\nThe inner loop goes around 256 times\
    \ because it starts at 0 and decrements by one each \n\nloop back to zero.\n\n\
    \ \n\nDECFSZ BUFFER1, F\n\n \n\nGOTO $-1 #\n\n \n\n; $ is the current address\
    \ in the program so $-1 is back one.\n\nEach loop is made up of 3 instruction\
    \ cycles: one for the DECFSZ and two for the GOTO. There \n\nis one extra for\
    \ the final DECFSZ as it is two instruction cycles when the skip is required.\
    \ \n\nRefer to page 315 in the datasheet. \n\nConsequently, each call to the inner\
    \ loop from the outer loop needs 769 instruction cycles.\n\n \n\n256x3 + 1 = 769\
    \ \n\nThe outer loop runs around by the number put into BUFFER0 before the subroutine\
    \ call. \n\nEvery time the outer loop goes around, it uses another batch of 769\
    \ inner loop cycles, also \n\neach outer loop has its own 3 instructions cycles\
    \ per lap, plus one for the final DECFSZ skip \n\nand finally the 2 instruction\
    \ cycles for the subroutine call and 2 for the return instruction.\n\nIf we put\
    \ 40 into BUFFER0, it will give a total of 30885 instructions.\n\n \n\n769x40\
    \ + 40x3 + 1 + 2 + 2 = 30885 instruction cycles per subroutine call.\n\nAs the\
    \ clock frequency is 125kHz, the time interval of one instruction is as follows:\n\
    \n \n\n4/125000 = 32 microseconds\n\nThis gives an on flash subroutine time as\
    \ 1.02 seconds.\n\n \n\n30885 x 32x10-6 = 1.019 seconds"
