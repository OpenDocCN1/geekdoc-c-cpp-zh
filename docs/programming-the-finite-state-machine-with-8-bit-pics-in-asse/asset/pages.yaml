  md: "p\n\ny\n\ng\n\n● 39\n\nThe *SUBWF* instruction can be a bit confusing and needs\
    \ to be carefully considered. The \n\nmeaning of the instruction is to subtract\
    \ what is in the working register *W* from what is in \n\nthe file. The file can\
    \ be any register. The value in *W* is subtracted from *COUNTER\\_ON* and \n\n\
    if the result is negative, the carry flag in *STATUS* set to 0. If the result\
    \ is zero or positive, \n\nthe carry flag is set to 1. The result will be positive\
    \ or zero if *COUNTER\\_ON* has reached or \n\nexceeded the value in *W*, in this\
    \ case, 31. Page 320 in the datasheet describes this. Figure \n\n2-4 below shows\
    \ this visually.\n\n![](img/a08bd00952da48f769971864f33af432_38_0.png)\n\nThe\
    \ code for the off block works in the same way but the timing is different and\
    \ the LED is \n\nturned on. Here is the complete program:\n\nFigure 2-4 Explanation\
    \ of SUBWF"
