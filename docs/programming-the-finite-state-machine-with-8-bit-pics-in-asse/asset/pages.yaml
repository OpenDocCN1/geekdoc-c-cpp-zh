  md: "g\n\ng\n\ny\n\n● 34\n\nStarting from the left-hand side of the diagram, the\
    \ tapered block is a multiplexer that can \n\nchoose a signal from more than one\
    \ source. The simplified diagram shows a dotted line \n\ncoming from circuitry\
    \ associated with an input pin. We are not using this source here. The \n\nsignal\
    \ we are using is the one that carries the clock frequency divided by four. To\
    \ select this, \n\nthe *TMROCS* bit in the *OPTION\\_REG* must be set to 0. The\
    \ next choice is: do we want the \n\nfrequency of cycles to be fed straight through\
    \ to be counted or do we use the Prescaler? \n\nThe Prescaler can divide the frequency\
    \ by 2 through to 256 according to the bits PS in the \n\n*OPTION\\_REG*. The\
    \ *PS<2:0>* means the three bits numbered 0,1 and 2 referred to as PS, \n\nsee\
    \ page 164 in the datasheet when this notation is used the numbers do not refer\
    \ to the \n\nbit numbers in the register but to the bit numbers in that group.\
    \ \n\nHere is an example that will be used in the next program. We are going to\
    \ set the internal \n\noscillator to run at 32 MHz. The internal oscillator has\
    \ already been selected in the \n\nconfiguration word 1. The frequency is set\
    \ using bits *IRCF<3:0>* actually bits 6, 5, 4 and 3 \n\nin the register *OSCCON*\
    \ (page 65). These are set to 1110. The code to do this is: \n\n \n\nMOVLW 0x70\
    \ ;Move (copy) 0x70 to W (working register)\n\n \n\nMOVWF OSSCON ;Move (copy)\
    \ W to OSCCON\n\nIn the datasheet, it says 8 or 32 MHz for this selection of bits\
    \ depending on whether \n\nthe phase-locked loop is enabled. As the phase lock\
    \ loop is defaulted to be enabled in \n\nconfiguration word 1, the frequency will\
    \ be 32 MHz. The tables below are a handy way of \n\nworking out what you need\
    \ to move to registers during configurations. You can do this on a \n\nbit of\
    \ paper: just write the bits 7-0 in a vertical column and by reading from the\
    \ datasheet, \n\nadd the bit settings then convert the two groups of bits 7-4\
    \ and 3-0 to two hexadecimal \n\ndigits. Once converted to hex, they are less\
    \ likely to be typed into your code incorrectly. \n\nFrom Table 2-1, *OSCCON*\
    \ will be loaded with 0x70.\n\n**OSCCON**\n\n*7*\n\n*7*\n\n*0*\n\n*Left at default\
    \ PLL is set by PLLEN in configuration *\n\n*word 1*\n\n*6*\n\n*1*\n\n*32 Mhz*\n\
    \n*5*\n\n*1*\n\n*4*\n\n*1*\n\n*0*\n\n*3*\n\n*0*\n\n*2*\n\n*0*\n\n*Unimplemented*\n\
    \n*1*\n\n*0*\n\n*Clock determined by configuration word 1*\n\n*0*\n\n*0*\n\nTo\
    \ use the Prescaler, *PSA* in the *OPTION\\_REG* must be set 0. The Prescaler\
    \ ratio is to be \n\n1:256, so bits *PS<2:0>* in *OPTION\\_REG* must be set to\
    \ 111. We don’t need the weak pull-\n\nups to be enabled, so by leaving the other\
    \ bits that don’t affect this project at their default, \n\nTable 2-1 Example\
    \ Bit Settings for OSCCON"
