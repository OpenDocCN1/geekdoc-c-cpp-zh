  md: "g\n\ng\n\ny\n\n● 64\n\nThis is not the end of the story. There are three more\
    \ instruction cycles in state *S0* that add \n\na further 96 microseconds. The\
    \ point to note is that it is the number of cycles inside a loop \n\nthat matter.\
    \ Their time period gets multiplied by the number of times around the outside\
    \ \n\nloop. The same explanation can be applied to *S1* state for the LED off\
    \ period.\n\nFurthermore, oscillator frequency can be trimmed by setting bits\
    \ in the *OSCTUNE* register. \n\nSee page 67 of the datasheet. \n\n**3.3.4 • Calling\
    \ Subroutines from Subroutines**\n\nThe purpose of the stack is to store return\
    \ addresses for subroutines and interrupts. It is \n\n16 deep so it is possible\
    \ to call subroutines from subroutines and to return in reverse to \n\nthe main\
    \ program. See the diagrams starting on page 39 of the datasheet. To demonstrate\
    \ \n\nthis, Program 3-5 splits the two loops into two subroutines so that the\
    \ first subroutine gets \n\ncalled by the main program and then calls the second\
    \ subroutine. The second subroutine \n\ncontains one loop that goes around 256\
    \ times, each time it is called. The second subroutine \n\ngets called again and\
    \ again by the first subroutine. The number of times is determined by \n\nthe\
    \ value placed in BUFFER0 by the main program before calling the first subroutine."
