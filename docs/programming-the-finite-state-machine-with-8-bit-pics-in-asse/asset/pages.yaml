    \ in the datasheet.\n\n ; If high no skip so program stays in state 0\n\n GOTO\
    \ S0\n\n INCF PULSE\\_COUNTER, F\n\n MOVF PULSE\\_COUNTER, W ; Move value in PULSE\\\
    _COUNTER to W\n\n BANKSEL TXREG\n\n MOVWF TXREG ; Loading TXREG starts the transmission.\n\
    \n BTFSS TXSTA, TRMT ; When the transmission has completed TRMT gets set, \n\n\
    \ ; until then this line and the next loop around.\n\n GOTO $-1\n\nS2\n\n BANKSEL\
    \ PORTA\n\n BTFSS PORTA, 2 ; If switch is closed input will be low. No skip the\
    \ program\n\n ; stays in state 2.\n\n GOTO S2\n\n GOTO S0\n\n END\n\n**4.6.2 ●\
    \ First method eliminating the effect of switch bounce**\n\nOne software method\
    \ of eliminating the effect of switch bounce is to introduce a time delay \n\n\
    after the first detection of a switch opening or closing. This is the method used\
    \ in Program \n\n4-6. It is not the best way of dealing with the problem as it\
    \ causes the program to stall for \n\na short time: in this case about 33 ms.\
    \ Although this is not noticeable to a human, in a busy \n\nprogram it could be\
    \ undesirable. At a clock frequency of 32MHz, this is 264000 instructions.\n\n\
    \ \n\nPeriod of one instruction = 4/(32x106) = 1.25x10-7 s\n\n \n\nNumber of instructions\
    \ in 33 ms = 33x10-3/1.25x10-7 = 264000 instructions\n\nProgram 4-5 Counting Input\
    \ Pulses Without Switch Bounce Elimination"
