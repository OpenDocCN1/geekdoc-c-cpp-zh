  md: "g\n\ng\n\ny\n\n● 138\n\n“in-circuit” debugging. We can, however, make use of\
    \ the FTDI lead and the serial\\_reader \n\nprogram and output data to a computer.\
    \ This is the equivalent of putting print statements \n\nin Python, C, or another\
    \ language to assist with debugging. What we will be doing is writing \n\na debug\
    \ macro that can be inserted anywhere to output a variable value to the computer\
    \ \n\nto see what is happening or not.\n\n**8.6 • Traffic Lights**\n\nThis is\
    \ a small project to practice the points outlined above. The first step is to\
    \ define what \n\nthe program will do. Our traffic lights will consist of six\
    \ LEDs that represent the two sets of \n\nred, yellow, and green lights. They\
    \ imitate the type used on road works to control the flow \n\nof single file traffic.\n\
    \n![](img/a08bd00952da48f769971864f33af432_137_0.png)\n\nOn power-up, both sets\
    \ of lights will be on red and remain so for 10s. Then set A will change \n\n\
    to red and yellow for 2s, then to green. After a further 20 seconds, Set A will\
    \ change to \n\nyellow for 5s and then to red. Both sets will remain on red for\
    \ 10s before set B goes through \n\nthe same changes. This cycle will repeat until\
    \ power is removed. Also, there is a signal that \n\nenables the light sequence.\
    \ If this signal goes low, the sequence stops at the next double \n\nred. The\
    \ enable signal must be high for the entire 10s period when both sets are on red\
    \ \n\nbefore starting the sequence. \n\nFrom the written description, we need\
    \ to identify the different states that the system can \n\nbe in.\n\nFigure 8-2\
    \ Road Works Traﬃc Control"
