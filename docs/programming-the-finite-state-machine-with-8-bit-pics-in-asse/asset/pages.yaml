  md: "p\n\ng\n\nj\n\n● 135\n\nThe details of the arithmetic are commented on in the\
    \ program. The voltage measured at \n\nthe probes and now scaled to millivolts\
    \ is moved to *RESBUFF*. The result buffer is made up \n\nof the two files: *RESBUFFH:RESBUFFL*.\
    \ The individual significant figures for tens of volts, \n\nvolts, hundreds of\
    \ millivolts, and tens of millivolts are now extracted.\n\n**7.4 • Extracting\
    \ the individual figures for the display**\n\nEach figure is obtained by calling\
    \ subroutine *EXTRACT\\_SIG\\_FIGS*. The routine is called four \n\ntimes: once\
    \ for each figure with a different divisor for each figure. Suppose the voltage\
    \ read \n\nis 12345 mV or 12.345 V. We want our display to first present the 1,\
    \ then the 2, 3 and lastly \n\nthe 4. 5 will be discarded as we are only resolving\
    \ to tens of millivolts.\n\nThe value 12345 is held in *RESBUFF* and each time\
    \ the *EXTRACT\\_SIG\\_FIGS* routine is \n\ncalled, it divides the *RESBUFF* by\
    \ a divisor placed in *Xb*. The integer division result is placed \n\nin the FIG\
    \ file and the remainder after the division is placed in *RESBUFF* to used on\
    \ the \n\nnext call.\n\nSo starting by dividing by 10000, *RESBUFF*(12345)/10000\
    \ gives a result of 1 and a \n\nremainder of 2345 to go into *RESBUFF*. 1 is the\
    \ number of tens of volts and is placed in \n\nfile F10V. \n\nOn the next call\
    \ *RESBUFF*(2345)/1000 gives a result of 2 and a remainder of 345 to go into \n\
    \n*RESBUFF*. 2 is the number of volts and is placed in file F1V\n\n*RESBUFF*(345)/100\
    \ gives a result of 3 and a remainder of 45 to go into *RESBUFF*. 3 is the \n\n\
    number of hundreds of millivolts and is placed in F100mv.\n\nFinally, on the last\
    \ call, *RESBUFF*(45)/10 gives a result of 4 and a remainder of 5 that we \n\n\
    don’t need. 4 is the number of tens of millivolts and is placed in the F10mv file.\n\
    \nYou can follow this through in state 2 and the subroutine.\n\n**7.5 • Detecting\
    \ No Input Voltage**\n\nThe detection of no input voltage or somewhat less than\
    \ 111 mV is done by comparing the \n\nvalue in *ADRESH:ADRESL* with 5. The two\
    \ registers hold the 10-bit result, right justified \n\nso the 8 least most significant\
    \ bits are held in *ADRESL* and the 2 most significant bits in \n\n*ADRESH*. First\
    \ *ADRESH* is checked to see if it is zero. *ADRSEL* is then checked to see if\
    \ it \n\nis less than 5. A value of 5 is 20 mV at the input pin on the PIC, or\
    \ 111 mV at the probe.\n\n**7.6 • Recalibration**\n\nYou can easily change the\
    \ voltage range to suit your needs by using a different potential \n\ndivider\
    \ and recalculating the scaling. Be mindful of the voltages you are playing with.\
    \ If \n\nyou are sure of your electrical knowledge, you could even make it into\
    \ an ammeter by \n\nconnecting the analog input across a shunt resistor."
