  md: "g\n\ng\n\ny\n\n● 140\n\nthe program will do. We can run through its operation\
    \ without thinking about the code.\n\n**8.6.1 • A Circuit Diagram**\n\nBefore\
    \ you write the code you need to plan the circuit so you know the inputs and output\
    \ \n\nthat are going to be used. The FTDI lead connections are the same and there\
    \ are six LEDs \n\nconnected through current limiting resistors. The value of\
    \ these resistors is not critical: 1kΩ \n\nwill give about 3mA.\n\n![](img/a08bd00952da48f769971864f33af432_139_0.png)\n\
    \n**8.6.2 • Separate Different Problems**\n\nThis program needs a timer to determine\
    \ when to change state. We have a tested method \n\nto implement this from previous\
    \ programs that involve counting ticks generated by an \n\ninterrupt from timer0.\
    \ For this particular program, we have to reset a tick counter for each \n\nstate.\
    \ In previous programs that were Mealy machines, the counter reset was an output\
    \ \n\nduring state transition. As we are using a Moore machine, it creates a problem\
    \ in that we \n\ncan't reset the counter with an output from the current state\
    \ as it will remain held at reset \n\nforever. One solution is to add a state\
    \ between existing states just to reset the counter. \n\nAnother is to have a\
    \ different counter for the next state and reset it in the current state. \n\n\
    Many developments have occurred since the Moore and Mealy machines were invented.\
    \ You \n\nmight like to look up the topic of Harel statecharts to see how things\
    \ have evolved. Some \n\nvariations can be used to make things more flexible.\
    \ One of these is the idea of sub-states \n\nwhere a state machine is nested inside\
    \ a state.\n\nFigure 8-4 Circuit Diagram"
  merge: -1
  pgno: 139
- img_proc: true
  md: "p\n\ng\n\ng\n\n● 141\n\nFigure 8-5 Use of Sub-States\n\n![](img/a08bd00952da48f769971864f33af432_140_0.png)\n\
    \nFigure 8-5 shows how two sub-states are added to the main *S7* and *S0* states.\
    \ When sub-\n\nstates are used, the main state can still set outputs and respond\
    \ to inputs, but we have \n\nthe additional functionality of being able to run\
    \ a sub-state machine within it. Transitions \n\nout of the main state can be\
    \ made to occur, depending on either conditions to do with the \n\nmain state\
    \ or one of the sub-states. In this example, exit from sub-state *SS\\_1* causes\
    \ the \n\ntransition. The main state sets the outputs for the LEDs and sub-state\
    \ *SS\\_0* is entered \n\nto reset the tick counter. Once the tick counter has\
    \ been reset, the machine stays in *S7*, \n\n*SS\\_1* waiting for the time-period\
    \ to elapse. The only other thing we need is the enable \n\nsignal from a switch.\
    \ No debounce precautions are needed and the input that the switch \n\nis connected\
    \ to only has to be looked at in states *S0* and *S4*. The complete state diagram\
    \ \n\nwill have sub-states in each main state. *S0* and *S4* will be the same\
    \ as will *S1, S2, S3, S5, *\n\n*S6,* and *S7*.\n\n**8.6.3 • Producing the Code**\n\
    \nBefore producing the code that runs the above state machine, the PIC needs a\
    \ particular \n\nconfiguration, including configuration file settings, oscillator\
    \ frequency, and port \n\nconfiguration. It is best to progress in small parts,\
    \ testing as you go. This testing will take \n\nthe form of adding debug code\
    \ to prove that each bit you add works and can be depended \n\non. Writing a complete\
    \ program and then trying to get it to work is not the way to go.\n\nThe program\
    \ needs to count in seconds up to 20. We will start by writing enough code to\
    \ \n\nachieve this and then test it. Drawing from previous programs, we can create\
    \ an interrupt \n\nbased counter, based on timer0 generating 8.2ms ticks. 122\
    \ ticks are approximately 1s. \n\nProgram 8-1 is the test program for the timer."
