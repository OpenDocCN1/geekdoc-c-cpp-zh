  md: "g\n\ng\n\ny\n\n● 174\n\nvoid tx\\_long\\_int(long w)\n\n{\n\n TXREG = w >>\
    \ 24 & 0xFF ; // Bitwise and 0XFF with most significant byte.\n\n while (!TRMT);\
    \ // Wait for TMRT to go high when.\n\n TXREG = w >> 16 & 0xFF; // Bitwise and\
    \ 0XFF with the next significant byte.\n\n while (!TRMT); // Wait for TMRT to\
    \ go high when.\n\n TXREG = w >> 8 & 0xFF; // Bitwise and 0XFF with the next significant\
    \ byte.\n\n while (!TRMT); // Wait for TMRT to go high when.\n\n TXREG = w; //\
    \ Bitwise and 0XFF with least significant byte.\n\n while (!TRMT); // Wait for\
    \ TMRT to go high when.\n\n}\n\nThe function is called *tx\\_long\\_int*. You\
    \ invent names for functions: it is standard to use \n\nlower case. C is case\
    \ sensitive and the name must start with a letter although they can \n\nstart\
    \ with an underscore. The underscore start is used by library functions to avoid\
    \ name \n\nclashes. It's probably best not to use underscores to start the name.\
    \ Underscores can be \n\nused freely within the name. As names must not have any\
    \ spaces in them, underscore \n\ngives a readable way of combining words in a\
    \ name. This function takes one variable: a \n\nlong integer to transmit. The\
    \ argument is declared in the parenthesis following the function \n\nname with\
    \ its data type long int and its name *w*. Variable *w* is in the local scope\
    \ of the \n\nfunction and when the function gets called, the value that is to\
    \ be assigned to w is passed \n\nto it. Variable *w* can not be written to or\
    \ read from anywhere other than in this function. Its \n\ninitial assignment is\
    \ called 'pass by value'. When the function is called, say somewhere in \n\nthe\
    \ main function, its name is written with the value that is passed inside the\
