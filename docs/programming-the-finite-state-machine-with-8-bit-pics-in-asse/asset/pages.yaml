  md: "● 9\n\n**• ****Preface**\n\nThis practical guide is aimed at electronics students\
    \ and hobbyists. It is intended to \n\nbe a valuable aid in writing programs using\
    \ Finite State Machines (FSMs) in assembly \n\nlanguage using 8-bit PIC microcontrollers.\
    \ The last two chapters introduce the use of the \n\nC programming language and\
    \ make a direct comparison with development in Assembly. \n\nAn FSM is a way of\
    \ writing a program to make it easier to produce and modify. The \n\nmachine is\
    \ abstract in that it is just the structure of the program. This abstract machine\
    \ \n\ncan be represented by drawing a diagram on paper. The diagram is independent\
    \ of the \n\nprogramming language used. The FSM chart gives a complete description\
    \ of what the \n\nprogram does. It can then be implemented as source code. \n\n\
    The book should appeal to those with an interest in the combination of electronics\
