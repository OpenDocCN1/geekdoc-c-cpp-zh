  md: "g\n\ng\n\ny\n\n● 24\n\nprogramming.\n\n![](img/a08bd00952da48f769971864f33af432_23_0.png)\n\
    \nWhen you write a program for a computer, there is an operating system such as\
    \ Windows, \n\nLinux, BSD or macOS that deals with hardware interfacing by way\
    \ of a kernel. The PIC has \n\nno operating system. You have to deal with the\
    \ details of hardware such as configuring \n\ninputs and outputs, oscillator frequency\
    \ or perhaps configuration of the serial port (if \n\nyou want to communicate\
    \ with a PC). Figure 1-14 shows how the PIC would appear if \n\nprogrammed to\
    \ be an AND gate. You might want to argue that what I have drawn is a ‘NOT \n\n\
    OR’ gate. As the switches pull the inputs down to 0V when they are closed, from\
    \ the point \n\nof view of the voltages on the inputs, they all have to be high\
    \ for the output to go high. \n\nTherefore, it is an AND gate. Each input has\
    \ an internal high-value resistor that pulls it up \n\nto 5V when the pin is open\
    \ circuit. This is called a weak pull-up and is configured in the \n\ncode. This\
    \ saves on external components as all that is needed is a switch to pull the voltage\
    \ \n\non the pin-down. Something that I should mention is that the programming\
    \ method used \n\nby my programs, *program\\_writer*, and *program\\_reader* use\
    \ low voltage programming with \n\nthe FTDI lead as opposed to high voltage programming\
    \ that would require pin 5 *MCLR/Vpp/*\n\n*RA3* to have between 8 and 9V applied\
    \ to it to enter the programming mode. Low voltage \n\nprogramming can be performed\
    \ with just a 5V supply and special train of bits applied to \n\nthe *ICPDAT*\
    \ pin to enter programming mode. The downside of this is pin 4 can only be used\
    \ \n\nas *MCLR* (not master clear reset). This means that 0V applied to this pin\
    \ resets the PIC. \n\nPin 4 must therefore always have 5V applied to it. The weak\
    \ pull-up does this. It is enabled \n\nby default in low voltage programming mode.\
    \ This means we have lost the use of *RA3* as \n\nan input pin. It is never an\
    \ output anyway. Don’t concern yourself with all this detail about \n\nprogramming\
    \ methods for now. If you want more information about the details of this then\
    \ \n\nFigure 1-14 PIC 12F1822 as an AND gate"
