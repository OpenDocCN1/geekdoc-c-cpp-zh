    \ ; Page 164.\n\n MOVLW 0xE0\n\n MOVWF INTCON ; Page 86 in the datasheet and Table\
    \ 2-3 in the book.\n\n ENDM ; Leaves in bank 1\n\nAnother one to set up timer0\
    \ to generate an overflow interrupt at a rate of 976.56 interrupts \n\nper second\
    \ (every 1.024 ms). The difference is the Prescaler ratio is 1/32 instead of 1/256.\n\
    \nSET\\_TMR0\\_CASE2 MACRO ; Bank 1 required. Gives 1.024 ms ticks.\n\n MOVLW\
    \ 0xD4 ; See Table 2-2 in the book.\n\n MOVWF OPTION\\_REG ; Page 164.\n\n MOVLW\
    \ 0xE0\n\n MOVWF INTCON ; Page 86 in the datasheet and Table 2-3 in the book.\n\
    \n ENDM ; Leaves in bank 1\n\nTo save space in the book, a macro to set the bits\
    \ in the configuration words:\n\nBOOK\\_CONFIGURATION MACRO\n\n \\_\\_CONFIG 0X8007,\
    \ (\\_FOSC\\_INTOSC & \\_WDTE\\_OFF & \\_PWRTE\\_OFF & \\_CP\\_OFF & \\_BOREN\\\
    _OFF & \\_IESO\\_OFF \n\n& \\_FCMEN\\_OFF )\n\n \\_\\_CONFIG 0X8008, (\\_LVP\\\
    _ON)\n\n ENDM\n\nHere is another if ...else macro to compare a register value\
    \ to see if it is greater than or \n\nequal to the value in the working register.\
    \ There is only one difference between this and the \n\nother if else macro. This\
    \ is the skip is on carry clear instead of carry set.\n\nIF\\_REG\\_GREATER\\\
    _THAN\\_OR\\_EQUAL\\_W MACRO ARG1\n\n SUBWF ARG1, W\n\n BTFSC STATUS, C ; See\
    \ SUBWF on page 320, if ARG1 >= W, C = 1\n\n ENDM\n\n ; The ‘if’ code here - this\
    \ will be a GOTO to jump over the else code.\n\n ; The ‘else’ code here.\n\nProgram\
    \ 3-2 is program 2-2 but using macros. The macros are shown in bold.\n\n; prog\\\
    _03\\_02.asm\n\n; This is prog\\_02\\_02.asm using macros.\n\n; Page numbers refer\
    \ to the data sheet DS40001413E.\n\n; Tables refer to the book.\n\nLIST P=12f1822\n\
    \n#INCLUDE <p12f1822.inc>\n\n#INCLUDE <fsm\\_macros.inc>\n\n RADIX DEC ; Default\
    \ numbers are to base 10.\n\n ** BOOK\\_CONFIGURATION ** ; See macro in fsm\\\
    _macros.inc."
