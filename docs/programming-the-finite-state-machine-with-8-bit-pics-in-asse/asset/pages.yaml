  md: "g\n\ng\n\ny\n\n● 10\n\n**Chapter 1 ****•**** Getting Started**\n\n**1.1 ****•****\
    \ Introduction**\n\nDon’t be put off by the technical-sounding words ‘Finite State\
    \ Machine’ (FSM). The principle \n\nof how they work is really easy to understand.\
    \ Firstly, the machine is not an actual machine \n\nthat you have to build. It\
    \ is merely a structure your program has. The idea is that the \n\nprogram is\
    \ broken down into a set number of states. When the program is in one of these\
    \ \n\nstates, it can respond to a set of inputs or events resulting in the program\
    \ jumping to a \n\ndifferent state. The outputs from the program depend only on\
    \ the state (Moore machine) \n\nor on the state and the inputs (Mealy machine).\
    \ Let’s start with the basic ‘Hello World’ \n\nmicrocontroller program to flash\
    \ an LED as an example of a state machine with two states, \n\nLED ON and OFF.\n\
    \n![](img/a08bd00952da48f769971864f33af432_9_0.png)\n\nFigure 1-1 displays what\
    \ the program does and how to write it.\n\nWhat the program does is:\n\nAfter\
    \ power up, the initial conditions are the LED is ON and the timer is reset and\
    \ started.\n\nAfter the timer expires, the LED turns OFF and the timer is reset\
    \ and started.\n\nAfter the timer expires again, the LED turns ON and the timer\
    \ is reset and started.\n\nThis continues until the microcontroller is powered\
    \ down\n\nIn this example, there is only one event that triggers a change of state:\
    \ This being the \n\nexpiry of the timer. The effect of the expiry depends on\
    \ the current state - it might jump \n\nto the LED ON state or the LED OFF state.\
    \ The fact that an input or event is only used \n\nby the current state helps\
    \ to make a more complicated program robust and easier to \n\nfollow. This example\
    \ is a Mealy machine, where outputs or actions are determined by \n\nthe current\
    \ state and inputs. On the state diagrams, the transitions between states are\
    \ \n\nshown by arrows. Alongside these are the input conditions that trigger transitions\
    \ and the \n\nresulting outputs. In a Moore machine, the outputs depend only on\
    \ the current state of \n\nthe machine. The outputs would be shown on the diagram\
    \ inside the states. This book is \n\nspecifically about practical programs. I\
    \ will not try to adhere to strict definitions. As for how \n\nFigure 1-1 A two-state\
    \ machine"
