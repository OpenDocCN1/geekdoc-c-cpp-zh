    \n SET\\_SERIAL\\_TX\\_16F1823 ; Configure the serial coms, see file fsm\\_macros.inc.\
    \ \n\n MOVLB 0\n\n \n\nS0\n\n MOVLW b'00100000'\n\n MOVWF PORTC ; Turn Red A (RC5)\
    \ on others off. \n\n BTFSS SECONDS, 0 ; Stay in this state until LSB in SECONDS\
