    \n**6.7 • Binary Division**\n\nFor binary division, I’ll use a similar technique\
    \ of repetitive subtraction. This will be integer \n\ndivision where the result\
    \ is the integer below the real value. For example, dividing 35 by 4 \n\ngives\
    \ the result in the set of real numbers of 8.75, with integer division the result\
    \ will be 8. \n\nTaking this example to divide 35 by 4.\n\n \n\n35 – 4 – 4 - 4\
    \ - 4 – 4 – 4 - 4 - 4 = 3 \n\nThis shows that 4 divides into 32 8 times with 3\
    \ left over. All we have to do for division is \n\nto subtract the divisor over\
    \ and over counting the number of times it can be subtracted.\n\nProgram 6-5 Multiplying\
    \ Two Sixteen-Bit Integers\n\nFigure 6-8 Using Serial Reader"
