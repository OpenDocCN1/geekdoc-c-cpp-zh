    **6.3 • Binary Subtraction of unsigned integers**\n\nSubtracting numbers is similar.\
    \ The next program subtracts one sixteen-bit number from \n\nanother. As an example,\
    \ we will subtract 1000 from 1500. Both numbers are greater than \n\n255 so they\
    \ require two bytes each. 1500 is 256x5 + 220 and 1000 is 256x3 + 232. The \n\n\
    subtraction is outlined below in Table 6-3 with explanation of what has to happen\
    \ with the \n\nassembly code.\n\n**High Order Byte counts the **\n\n**256s**\n\
    \n**Low order Byte counts the **\n\n**units**\n\n**Decimal Values**\n\n*5*\n\n\
    *220 (Need to borrow from 256s, *\n\n*this makes C the not borrow bit *\n\n*\\\
    = 0) *\n\n*1500*\n\n*3 *\n\n*232*\n\n*1000*\n\n*5 - 3 – C = 1, C is 0 because\
    \ of the *\n\n*borrow, therefore C is 1 *\n\n*Uses the SUBWFB instruction.*\n\n\
    *220 + 256(borrow) – 232 = 244 *\n\n*Uses the SUBWF instruction.*\n\n*500*\n\n\
    Something confusing to follow, but doesn’t cause a problem in practice, is the\
    \ *SUBWFB *\n\ninstruction, which is the subtract *W* from file with borrow used\
    \ when subtracting the higher-\n\norder bytes in the multibyte subtraction. In\
    \ a multibyte subtraction, if a subtraction has \n\noccurred where the result\
    \ is either zero or positive, the carry bit in the *STATUS* register \n\nis set\
    \ to 1. This is taken as meaning that no borrow was required. If the result of\
    \ the \n\nsubtraction is negative, the carry bit in the *STATUS* register is cleared\
    \ to 0 meaning that a \n\nborrow was required. What happens next is that in the\
    \ subtraction involving the next higher \n\npair of bytes using *SUBWFB*, the\
    \ state of the carry bit is taken into account. The working \n\nregister *W* is\
    \ subtracted from *F*. If C is 0, another 1 is subtracted. If C is 1, no extra\
    \ 1 is \n\nsubtracted. You don’t need to do anything other than use the instruction.\
    \ This can be stated \n\nFigure 6-4 Using Serial Reader\n\nTable 6-3 Example Sixteen-bit\
    \ Subtraction"
