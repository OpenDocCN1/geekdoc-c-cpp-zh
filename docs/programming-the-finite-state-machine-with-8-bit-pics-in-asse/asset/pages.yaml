  md: "g\n\ng\n\ny\n\n● 54\n\n*C = 1*\n\n*31 ≤ TICK\\_COUNTER\\_ON *\n\n*C = 0*\n\n\
    *31 > TICK\\_COUNTER\\_ON *\n\nIf C is 0, the program executes the GOTO S0 line,\
    \ because TICK\\_COUNTER\\_ON has not \n\nreached 31 yet. If C is 1 it skips this\
    \ line and moves on to the code that follows. What we \n\nneed is an instruction\
    \ that looks more like the if...else statement that can be read more \n\neasily.\
    \ While we’re on the subject, if you were wondering about goto, it is part of\
    \ the C \n\nlanguage but isn’t recommended.\n\n \n\n**3.2 • Create Your Own Instruction**\n\
    \nThe macro allows you to define your instruction that can be reused. For the\
    \ problem above, \n\nthe code snippet can be written as follows. Both states are\
    \ shown here:\n\n \n\n \n\nS0 ; LED on.\n\n \n\n MOVLW 31\n\n \n\n IF\\_REG\\\
    _LESS\\_THAN\\_W TICK\\_COUNTER ; See macro in fsm\\_macros.inc.\n\n \n\n GOTO\
    \ S0\n\n \n\n CLRF TICK\\_COUNTER ; Reset the counter.\n\n \n\n BCF PORTA, 2 ;\
    \ Turn the LED off. \n\n \n\nS1 ; LED off.\n\n \n\n MOVLW 91\n\n \n\n IF\\_REG\\\
    _LESS\\_THAN\\_W TICK\\_COUNTER ; See macro in fsm\\_macros.inc.\n\n \n\n GOTO\
    \ S1\n\n \n\n CLRF TICK\\_COUNTER ; Reset the counter. \n\n \n\n BSF PORTA, 2\
    \ ; Turn the LED on.\n\n \n\n GOTO S0\n\n \n\n \n\n END\n\nWe have introduced\
    \ a new instruction IF\\_REG\\_LESS\\_THAN\\_W meaning if a register value \n\n\
    is less than the value in W, execute the next line, else skip and execute the\
    \ line after. The \n\nregister is presented as the argument TICK\\_COUNTER. \n\
    \nDefine the macro before the place in the code where it is first used. The definition\
    \ is started \n\nby typing its name at the start of the line and following it\
    \ with the word MACRO, then names \n\nfor the arguments. There will be one argument.\
    \ In this case, the register that is to be \n\ncompared to the value in W. Subsequently\
    \ add the code you want the macro to perform. \n\nEnd the macro definition with\
    \ ENDM.\n\nTable 3-1 Carry Flag Behaviour for SUBWF"
