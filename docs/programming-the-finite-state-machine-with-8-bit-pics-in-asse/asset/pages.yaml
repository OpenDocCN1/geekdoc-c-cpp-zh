  md: "g\n\ng\n\ny\n\n● 126\n\n**Chapter 7 • Digital Voltmeter Project**\n\n**7.1\
    \ • Introduction**\n\nChapter 5 was a guide to constructing the hardware part\
    \ of the project. The circuit was \n\ntested using Program 5-1. This chapter will\
    \ develop a program to use this circuit as a \n\ndigital voltmeter. This is the\
    \ most complicated program so far. It involves sequencing of the \n\ndisplay digits,\
    \ analog measurement, sleep mode to conserve battery life, and the binary \n\n\
    arithmetic dealt with in chapter 6.\n\nVoltage is read using a single-digit display\
    \ which displays four significant figures by flashing \n\nfour figures for each\
    \ reading in-turn. Each figure will appear for 1/2 second with a blank \n\nspace\
    \ of 1/4 second between figures and a blank space of 1 second before the next\
    \ reading. \n\nThis means a reading of 7.25 volts will appear as ‘0’, ‘7’, ‘2’,\
    \ ‘5’, following on with a one-\n\nsecond delay before the next reading. \n\n\
    There are three state machines in the program: \n\n• \n\nSequence handler \n\n\
    • \n\nThe seven-segment display driver \n\n• \n\nVoltage reading and digit value\
    \ handler. \n\nThis project introduces the sleep mode that allows the PIC to conserve\
    \ battery charge when \n\nno voltage is sensed by the probes.\n\n**7.2 • The State\
    \ Diagrams**\n\n \n\nThe three machines are shown in figures Fig 7-1 and Fig 7-2.\
    \ The machines are separate \n\nbut share processor and memory space. As this\
    \ is a more complicated program, I will recap \n\non how several machines run\
    \ together. Each machine is made up of several states. The \n\nmachine will stay\
    \ in its current state until a condition is true that causes it to change to \n\
    \nanother state. This condition can be an input of some sort such as an actual\
    \ digital input \n\non a pin or the comparison of a counter value with some constant\
    \ or a logical combination \n\nof these. If a machine remains in a particular\
    \ state, it does not mean that the code being \n\nexecuted is only the local lines\
    \ of code for that state. After executing local lines, the program \n\ngoes to\
    \ the switch block that uses the *BRW* for the next machine that has a turn of\
    \ the \n\nprocessor to go to the relevant state for that machine. This way all\
    \ the machines take a turn \n\nin executing their current state code. In the voltmeter\
    \ program, the order the machines \n\ntake is *M0, M2, M1* and back to *M0*. The\
    \ reason for this order is because the macro for the \n\nseven-segment driver\
    \ goes to *M0* next. Figure 4-14 gives an overview of how machine \n\nrotation\
    \ works for two machines. In this project, we have three.\n\nBelow are state diagrams\
    \ and program listings. This program uses variable *FLAGS* as a set \n\nof booleans\
    \ that are used as signals. Bit 0 is the update display signal, bit 1 is the division\
    \ \n\ncomplete signal used in binary arithmetic, bit 2 is the voltage reading\
    \ available, meaning \n\nthat probe voltage measured is above 111 mV, and bit\
    \ 3 is the signal to tell machine 2 to \n\nread voltage. Although there are only\
    \ two states in machine 2, they allow the machine to"
