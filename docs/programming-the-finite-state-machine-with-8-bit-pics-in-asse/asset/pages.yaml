    \ A (RC4) on others off.\n\n BTFSC SECONDS, 0 ; Stay in this state until LSB in\
    \ SECONDS goes low.\n\n GOTO S1 \n\nS2\n\n MOVLW b'00001000'\n\n MOVWF PORTC ;\
    \ Turn Green A (RC3) on others off.\n\n BTFSS SECONDS, 0 ; Stay in this state\
    \ until LSB in SECONDS goes high. \n\n GOTO S2 \n\n \n\nS3\n\n MOVLW b'00000100'\n\
    \n MOVWF PORTC ; Turn Red B (RC2) on others off.\n\n BTFSC SECONDS, 0 ; Stay in\
    \ this state until LSB in SECONDS goes low. \n\n GOTO S3 \n\n \n\nS4\n\n MOVLW\
    \ b'00000010'\n\n MOVWF PORTC ; Turn Yellow B (RC1) on others off.\n\n BTFSS SECONDS,\
    \ 0 ; Stay in this state until LSB in SECONDS goes high. \n\n GOTO S4 \n\nS5\n\
    \n MOVLW b'00000001'\n\n MOVWF PORTC ; Turn Green B (RC0) on others off.\n\n BTFSC\
    \ SECONDS, 0 ; Stay in this state until LSB in SECONDS goes low.\n\n GOTO S5 \n\
    \n GOTO S0\n\n END"
