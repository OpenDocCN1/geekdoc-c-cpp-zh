  md: "p\n\nj\n\n● 99\n\n![](img/a08bd00952da48f769971864f33af432_98_0.png)\n\n**5.5.1\
    \ • Analog Configuration**\n\nTables 5-1 to 5-3 show the configuration of *ADCON0,\
    \ ADCON1*, and *FVRCON*. We are using \n\n*RA2*, which is analog channel *AN2*,\
    \ pin 11 for the analog input. The choices for *ADCON0* can \n\nbe read on page\
    \ 136 of the datasheet. The choices for *ADCON1* can be seen on page 137. \n\n\
    Note the 10-bit analog result is left-justified in the two files *ADRESH:ADRESL*\
    \ so that we will \n\nbe looking at *ADRESH* to read the 8 most significant bits.\
    \ The *FVRCON* register is used to \n\nconfigure the fixed voltage reference.\
    \ It is enabled and set to 4.096 V (see pages 127 and \n\n128 of the datasheet).\
    \ To keep it simple only *ADRESH*, containing the 8 most significant \n\nbits\
    \ is used to determine input voltage. Above it was calculated that the A/D reading\
    \ would \n\nbe 180 when 4 V was reached. This is ‘0010110100’B as a 10-bit binary\
    \ number. We are \n\nonly looking at the top 8 bits that are in *ADRESH* ‘00101101’B\
    \ as the result is left justified, \n\ngiving 45 decimal in *ADRESH*. The loss\
    \ of two bits is not important in this program as it is \n\na functional test\
    \ of the circuit board.\n\nFigure 5-5 Test Program State Diagram"
