  md: "g\n\ng\n\ny\n\n● 40\n\n; prog\\_02\\_01.asm\n\n; Page numbers refer to the\
    \ data sheet DS40001413E.\n\n; Tables refer to the book.\n\nLIST P=12f1822\n\n\
    #INCLUDE <p12f1822.inc>\n\n RADIX DEC ; Default numbers to base 10\n\n \\_\\_CONFIG\
    \ 0X8007, (\\_FOSC\\_INTOSC & \\_WDTE\\_OFF & \\_PWRTE\\_OFF & \\_CP\\_OFF & \\\
    _BOREN\\_OFF & \\_IESO\\_OFF & \\_FC-\n\nMEN\\_OFF)\n\n \\_\\_CONFIG 0X8008, (\\\
    _LVP\\_ON)\n\n CBLOCK 0x70\n\n TICK\\_COUNTER \n\n ENDC\n\n ORG 0X00\n\n GOTO\
    \ START\n\n ORG 0X04 ; Interrupt vector.\n\n BCF INTCON, TMR0IF ; Clear TMR0 overflow\
    \ interrupt flag, INTCON is in all banks.\n\n INCF TICK\\_COUNTER, F ; Increment\
    \ by one TICK\\_COUNTER, result back in the file.\n\n RETFIE ; Return from interrupt.\n\
    \nSTART\n\n MOVLB 1 ; TRISA and OSCCON, OPTION\\_REG.\n\n BCF TRISA, 2 ; Make\
    \ RA2 an output.\n\n MOVLW 0x70\n\n MOVWF OSCCON ; Page 65 32 MHz. See Table 2-1\
    \ in the book.\n\n MOVLW 0xD7\n\n MOVWF OPTION\\_REG ; Page 164 in the data sheet\
    \ and Table 2-2 in the book.\n\n MOVLW 0xE0 ; See Table 2-3 in the book.\n\n MOVWF\
    \ INTCON ; See page 86. \n\n MOVLB 0 ; Stay in bank 0 to access PORTA for the\
    \ rest of the program.\n\n BSF PORTA, 2 ; Initialise LED to on;\n\n;----------Machine\
    \ States\n\nS0 ; LED on.\n\n MOVLW 31\n\n SUBWF TICK\\_COUNTER, W ; C in STATUS\
    \ is set when counter\\_on >==31.\n\n BTFSS STATUS, C ; Skip next instruction\
    \ if C in STATUS is found set.\n\n GOTO S0 ; C in status found not set.\n\n CLRF\
    \ TICK\\_COUNTER ; Reset the counter.\n\n BCF PORTA, 2 ; Turn the LED off.\n\n\
    \ \n\nS1 ; LED off.\n\n MOVLW 91\n\n SUBWF TICK\\_COUNTER, W ; C in STATUS is\
    \ set when counter\\_on greater than or equal to 91.\n\n BTFSS STATUS, C ; Skip\
    \ the next instruction if C in STATUS is found set.\n\n GOTO S1 ; C in STATUS\
    \ found not set.\n\n CLRF TICK\\_COUNTER ; Reset the counter. \n\n BSF PORTA,\
    \ 2 ; Turn the LED on.\n\n GOTO S0\n\n END\n\nTo assemble and load the program\
    \ into the PIC, start by copying the program into the \n\nworking directory, and\
    \ then carry out these steps:\n\nWindows:\n\n**gpasm.exe prog\\_02\\_01.asm**\n\
