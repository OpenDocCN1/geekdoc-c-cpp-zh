  md: "p\n\ng\n\n● 23\n\nW \n\nWorking Register: temporary storage used by logic and\
    \ arithmetic operations.\n\nSTATUS\n\nA register containing the status of the\
    \ arithmetic, logic unit of the CPU and reset status.\n\nBSR\n\nBank Select Register:\
    \ This register has to be set to the bank that you want to access.\n\nBank selection\
    \ is a feature of this type of PIC. It comes about because of the format of \n\
    \nmachine instructions. They are 14 bits wide. For some instructions, 7 bits are\
    \ used to point \n\nto the address of a register. Note that the word *file* is\
    \ used, meaning register. Here is an \n\nexample of one of the instructions, *BCF\
    \ *(bit clear file). This sets a particular bit in a file to \n\nzero. If you\
    \ wanted to turn bit 5 in the *PORTA* register off, the assembly code would be\
    \ BCF \n\n*PORTA*, 5.\n\n*0*\n\n*1*\n\n*0*\n\n*0*\n\n*b*\n\n*b*\n\n*b*\n\n*f*\n\
    \n*f*\n\n*f*\n\n*f*\n\n*f*\n\n*f*\n\n*f*\n\n*Operation code*\n\n*Bit in the file\
    \ e.g*\n\n*bit 5 = 1 0 1*\n\n*File in the bank e.g PORTA is 0x0c in bank 0. *\n\
    \n*0x0C = 0 0 0 1 1 0 0*\n\nThere are only 7 bits in the instruction for the file\
    \ address, which limits the range to 128 - \n\none bank. If you are in the wrong\
    \ bank, for example, bank 1 instead of bank 0, and think \n\nyou are going to\
    \ access *PORTA* you would get *TRISA* - not what you wanted. The bank is \n\n\
    set in *BSR*. There is an *MOVLB* instruction (move literal to bank select register)\
    \ that is used \n\nto load *BSR* directly. To use it you have to remember or look\
    \ up the bank number for each \n\nfile you want to access. To make it easier,\
    \ there is an assembly directive provided called \n\n*BANKSEL* that generates\
    \ the correct code. For example, *BANKSEL PORTA* will generate \n\n*MOVLB 0*.\
    \ Please note it is the gpasm assembler’s job to generate the instructions like\
    \ \n\nthe one in Table 1-2 using the operation code (opcode) and the operands\
    \ from each line \n\nof code. Page 308 onwards describes all the detail you need\
    \ to manually assemble the \n\ninstructions. You would however, then have to format\
    \ the Intel hex file. I will revisit the \n\ntopic of bank selection in Chapter\
    \ 3. In assembly programming, the term ‘move from one \n\nlocation to another’\
    \ means to copy the value to a destination. It does not delete the value \n\n\
    from the source location. \n\n**1.3.7 • An Assembly Program Snippet **\n\nFrom\
    \ an electronic point of view, a microcontroller is a programmable integrated\
    \ circuit or \n\nchip. It has several electrical connections or pins that can\
