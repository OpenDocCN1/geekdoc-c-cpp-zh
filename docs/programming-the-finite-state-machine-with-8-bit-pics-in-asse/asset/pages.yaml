  md: "p\n\ng\n\ng\n\n● 139\n\n**State**\n\n**Lights A**\n\n**Lights B**\n\n*0*\n\n\
    *Red*\n\n*Red*\n\n*1*\n\n*Red - Yellow*\n\n*Red*\n\n*2*\n\n*Green*\n\n*Red*\n\n\
    *3*\n\n*Yellow*\n\n*Red*\n\n*4*\n\n*Red*\n\n*Red*\n\n*5*\n\n*Red*\n\n*Red-Yellow*\n\
    \n*6*\n\n*Red*\n\n*Green*\n\n*7*\n\n*Red*\n\n*Yellow*\n\nHaving identified the\
    \ eight states that are required, the next step is to work out the \n\nallowable\
    \ transitions and input conditions to trigger these conditions. This is a very\
    \ simple \n\nexample, in that the states follow around one after another with\
    \ only a single allowable \n\ntransition to the next state. So far, throughout\
    \ the book, state machines have followed the \n\nMealy format where outputs are\
    \ dependent on the current state. Inputs and outputs are \n\nshown on the diagram\
    \ next to the transition arrows. The Moore machine is different in that \n\nthe\
    \ outputs only depend on the current state. For this project, I will use the Moore\
    \ machine \n\nform. The outputs only depend on the current state and are shown\
    \ in the diagram inside \n\nthe box for each state.\n\n![](img/a08bd00952da48f769971864f33af432_138_0.png)\n\
    \nThe transition to the next state is determined by the elapsed time in a particular\
    \ state \n\nexcept for the leaving states 0 and 4 where there are two reds. In\
    \ these states, the enable \n\nsignal must be present for 10s. This will cover\
    \ our requirement for the sequence to continue \n\nto the next two reds state\
    \ if the enable signal goes low. We now have a clear idea of what \n\nTable 8-1\
    \ Traﬃc Light States\n\nFigure 8-3 Road Works State Chart"
