    \ 4\n\n IF\\_REG\\_LESS\\_THAN\\_W TICK\\_COUNTER \n\n GOTO S0 ; C in STATUS found\
    \ not set. Stay in this state.\n\n BCF PORTA, 2 ; Turn LED off \n\n CLRF TICK\\\
    _COUNTER ; Reset the tick counter.\n\n INCF PULSE\\_COUNTER, F ; Add 1 to PULSE\\\
    _COUNTER and put the result in PULSE\\_COUNTER.\n\n ; Continue to S1\n\n \n\n\
    S1 ; LED off. Fast cycle.\n\n MOVLW 10\n\n **IF\\_REG\\_LESS\\_THAN\\_W PULSE\\\
    _COUNTER**\n\n GOTO $+3 ; Have not reached 10 pulses jump to ticks check.\n\n\
    \ CLRF PULSE\\_COUNTER ; 10 Pulses have been counted, reset PULSE\\_COUNTER.\n\
    \n GOTO S3 ; Transition to S3.\n\n MOVLW 9 ; Load W with 9 for ticks check.\n\n\
    \ **IF\\_REG\\_LESS\\_THAN\\_W TICK\\_COUNTER** ; See macro in fsm\\_macros.inc.\n\
    \n GOTO S1 ; C in STATUS found set, 9 ticks counted.\n\n CLRF TICK\\_COUNTER \n\
    \n BSF PORTA, 2 ; Turn LED on.\n\n GOTO S0\n\n \n\nS2\n\n MOVLW 32\n\n **IF\\\
    _REG\\_LESS\\_THAN\\_W TICK\\_COUNTER**\n\n GOTO S2 ; C in STATUS found not set.\n\
    \n BCF PORTA, 2 ; Turn LED off \n\n CLRF TICK\\_COUNTER ; Reset the tick counter.\n\
    \n INCF PULSE\\_COUNTER, F ; Add 1 to PULSE\\_COUNTER and put the result in\n\n\
