    _01\\_01.hex\n\nLinux 64 bit:\n\nsudo ./program\\_writer\\_64 prog\\_01\\_01.hex\n\
    \nThe *gpasm* assembler produces a file *prog\\_01\\_01.hex* that is written to\
    \ the PIC using the \n\nprogram ‘program\\_writer’. You will, of course, have\
    \ to connect everything up as described \n\nearlier in the chapter. The message\
    \ saying to check the bank bits is not an error. It is just a \n\nreminder to\
    \ ensure you are in the right bank. Note how the value written to flash memory\
    \ \n\naddress 0x8007 agrees with Fig 1-16 above. Figure 1-17 shows this being\
    \ done on a 64-bit \n\nLinux system. For the differences between Windows and Linux,\
    \ please study Figures 1-7 \n\nand 1-8. \n\n![](img/a08bd00952da48f769971864f33af432_29_0.png)\n\
    \nI hope you are getting a feel for how assembly programming works. It is extremely\
    \ verbose \n\nwhere every action is visible in the code. This makes it all the\
    \ more interesting as, unlike \n\nhigh-level languages where things seem to happen\
    \ by magic, here you can trace what is \n\nhappening at a hardware level. This\
    \ means that you have to be on top of a lot more detail \n\nand is more work.\n\
    \nThe C programming language was developed fifty years ago to overcome the problems\
    \ of \n\nwriting code in assembly. Modern software projects would take an enormous\
    \ amount of \n\nhuman work without languages like C, C++, Java, Python, etc. Please\
    \ don’t get the idea \n\nthat I’m trying to persuade you that assembly is better\
    \ by using it here. It is generally \n\nagreed that you should code in a higher-level\
    \ language to save time if nothing else. Modern \n\ncompilers can outperform most\
    \ humans at code optimisation. This book focuses on mid-\n\nrange PICs where programming\
    \ in assembly is a practical proposition, and where executable \n\ncode will be\
    \ smaller and faster than that produced by the free version of the XC8 compiler.\
    \ \n\nTo be fair to Microchip, the free version states that smaller and faster\
    \ code can be produced \n\nby the paid-for version. There is also good reason\
    \ for coding in assembly. If you are doing \n\nthis as a hobby or to learn then\
    \ it is more fun. If you take a look at any code written in C \n\nfor a PIC, like\
    \ these you will see that there is still a need to manually select bits in registers\
    \ \n\nwhen configuring oscillator, inputs, outputs, etc.\n\nFigure 1-17 Assembling\
    \ prog\\_01\\_01.asm and Writing prog\\_01\\_01.hex to the PIC"
