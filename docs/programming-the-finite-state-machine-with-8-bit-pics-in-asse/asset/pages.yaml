    \ access to all memory, *M1* \n\ncan signal to *M0* when it is satisfied the switch\
    \ bouncing has stopped. Don’t confuse the \n\nelectrical switch with the switch\
    \ code that is used to select the state block of code.\n\n![](img/a08bd00952da48f769971864f33af432_91_0.png)\n\
