  md: "p\n\ny\n\n● 103\n\n**Chapter 6 • Binary Arithmetic**\n\n**6.1 • Introduction**\n\
    \nIf you are programming in a higher-level language such as C, simple arithmetic\
    \ involving \n\naddition, subtraction, multiplication, and division can seem trivial\
    \ because you simply write \n\nyour expression as you would on paper. The C compiler\
    \ will then create the necessary \n\nmachine code to do the calculation. The routines\
    \ required to do the calculations can be \n\nquite complicated and if you have\
    \ never done this in assembly, you could be unaware of the \n\nwork you are asking\
    \ the processor to do. This has to be paid for in clock cycles and memory \n\n\
    space. This chapter is all about doing binary arithmetic in assembly language.\
    \ For all of the \n\nexamples in this chapter, the same circuit board from the\
    \ last chapter can be used. If you \n\nhaven’t built it, you can use a plugin\
    \ breadboard.\n\n**6.2 • Binary Addition of Unsigned Numbers**\n\nTo start with,\
    \ consider unsigned numbers of eight bits, giving a range of numbers of 0 \n\n\
    to 255. There are eight bits in a PIC register, or file as it is referred to,\
    \ and usually eight \n\nbits in a byte. Table 6-1 shows four example values: 192,\
    \ 195, 3, and 6. These values are \n\nexpressed by summing the weighted values\
    \ of each bit that is set to 1, referred to as being \n\non or high.\n\n*Bits*\n\
    \n*7*\n\n*6*\n\n*5*\n\n*4*\n\n*3*\n\n*2*\n\n*1*\n\n*0*\n\n*Weight*\n\n*128*\n\n\
    *64*\n\n*32*\n\n*16*\n\n*8*\n\n*4*\n\n*2*\n\n*1*\n\n*Example *\n\n*value*\n\n\
    *192*\n\n*1*\n\n*1*\n\n*0*\n\n*0*\n\n*0*\n\n*0*\n\n*0*\n\n*0*\n\n*Example *\n\n\
    *value*\n\n*195*\n\n*1*\n\n*1*\n\n*0*\n\n*0*\n\n*0*\n\n*0*\n\n*1*\n\n*1*\n\n*Example\
    \ *\n\n*value*\n\n*3*\n\n*0*\n\n*0*\n\n*0*\n\n*0*\n\n*0*\n\n*0*\n\n*1*\n\n*1*\n\
    \n*Example *\n\n*value*\n\n*6*\n\n*0*\n\n*0*\n\n*0*\n\n*0*\n\n*0*\n\n*1*\n\n*1*\n\
    \n*0*\n\nTable 6-1 Example Eight-Bit Bytes"
