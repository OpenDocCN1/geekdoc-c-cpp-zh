  md: "p\n\ng\n\n● 21\n\n![](img/a08bd00952da48f769971864f33af432_20_0.png)\n\n**1.3.3\
    \ • Boolean Logic**\n\nIn programming, bits are often operated on by logic operations\
    \ to give a binary result either \n\ntrue or false. The operations used are AND,\
    \ OR, NOT, and XOR. A good way to see how this \n\nworks is the truth table. Figure\
    \ 1-12 shows these. In the tables, only two input bits called \n\nthe operands\
    \ are shown for the AND, OR, and XOR operators. The NOT simply inverts the \n\n\
    value of one bit. XOR stands for exclusive OR.\n\n![](img/a08bd00952da48f769971864f33af432_20_1.png)\n\
    \n**1.3.4 • Bitwise logic**\n\nIf we carry out boolean logic with corresponding\
    \ bits in two or more words, the result will \n\nbe another word. Here is an example\
    \ to demonstrate this. Taking two words with the values \n\n0x1234 and 0xABCD\
    \ and then performing the bitwise AND operation the result is 0x0204. \n\nThis\
    \ sort of operation is frequently used in low-level programming.\n\nFigure 1-11\
    \ Example of a Hexadecimal Number (0x2C)\n\nFigure 1-12 Boolean Logic Truth Tables"
