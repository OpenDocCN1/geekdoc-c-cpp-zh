  md: "g\n\ng\n\ny\n\n● 116\n\nvalue. Take the value 4: in our four-bit integer type\
    \ 0100, the one’s complement is 1011. \n\nAdding 1 to that gives 1100, appearing\
    \ in the table as -4.\n\nAlso note that this is reversible if we take -4 represented\
    \ by 1100 and take its one’s \n\ncomplement, 0011, and then add 1. We get 0100\
    \ which is +4. \n\nComputers do subtraction by adding the two’s complement of\
    \ the number that is being \n\nsubtracted (the subtrahend).\n\nFor a demonstration,\
    \ I have used an integer type of only four bits. A point to remember \n\nhere\
    \ is that you have to know the width in bits of the integer. You can have \n\n\
    • \n\nSigned bytes that range from -128 to + 127, \n\n• \n\nSigned short integers,\
    \ usually, 16 bits ranging from -32768 to + 32767 and \n\n• \n\nSigned integers,\
    \ usually 32 bits that range from -2147483648 to +2147483647. With \n\n64 bit\
    \ long integers that are huge, every additional bit doubles the size.\n\nYou will\
    \ also notice that with a signed integer, the most significant bit is 0 when it\
    \ is positive \n\nand 1 when it is negative. If negative, remember that it’s the\
    \ two’s complement. \n\nHow do you know if a binary number is a signed integer\
    \ or an unsigned integer or some \n\nother data type? \n\nWell, you don’t just\
    \ by looking at it. This is why variables have to be declared in C and other \n\
    \nstatically typed languages, the declaration states the data type so the compiler\
    \ knows what \n\nit is dealing with. \n\n**6.6 • Binary Multiplication**\n\nPICs\
    \ do not have a handy multiplication instruction. Therefore we have to write our\
    \ own \n\nroutine. If you take a binary number and shift the bits one place to\
    \ the left, it doubles \n\nthe number. It is possible to multiply by values other\
    \ than two by combining addition and \n\nmultiplying by powers of two. As an example,\
    \ if I want to multiply variable *X* by 35, I could \n\ntake a copy of *X* and\
    \ shift the bits 5 places left. Each place shifted multiplies by 2 giving \n\n\
    a multiplication by 32. If I take another copy of *X* and move the bits one place\
    \ to the left, \n\nI multiply by 2. Finally, if I take another copy of *X* and\
    \ add it to the 32 times *X* and the 2 \n\ntimes *X*, I will have 35 times *X*.\n\
    \n \n\nX + 2X + 32X = 35X\n\nThis method executes very quickly but isn’t the method\
    \ I am going to use here. The method \n\nof multiplication I am going to describe\
    \ is not the fastest but is easy to implement and is \n\nversatile. It is simply\
    \ a repetitive addition. If I want to multiply *X* by 35, I am going to just \n\
    \nadd *X* to the output 35 times. We will end up with a multiplying subroutine\
    \ that accepts two \n\n16-bit unsigned integer variables to multiply together.\
    \ When I tested this method it took \n\napproximately 75 ms to multiply 46340\
    \ by 46341 to give a result of 2,147,441,940. This \n\nis the worst case we can\
    \ use without overflowing a 32-bit signed integer’s positive range. \n\nIt will\
    \ multiply 65535 times 65535 in approximately 107 ms but the result is a negative"
