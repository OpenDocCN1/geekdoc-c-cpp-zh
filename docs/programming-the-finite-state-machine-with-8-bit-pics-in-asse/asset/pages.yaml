  md: "g\n\ng\n\ny\n\n● 44\n\nwill execute the block of code for its current state\
    \ and then the block of code for the other \n\nmachine’s current state and then\
    \ back to the first machine. These different machines are \n\nindependent. They\
    \ just happen to use the same CPU by time-sharing. They can also share \n\nmemory\
    \ to access each other’s data.\n\nIn the examples so far, the state was defined\
    \ by being in a certain block of code now the \n\nstate is going to be defined\
    \ by the value stored in a register. Let the register that holds the \n\nstate\
    \ of machine 0 be *STATE\\_M0* and for machine 1 be *STATE\\_M1*. Figure 2-7 below\
    \ shows \n\nhow this program flow will be.\n\n![](img/a08bd00952da48f769971864f33af432_43_0.png)\n\
    \nTo control this switching between states, we can use the instruction *BRW*.\
    \ The *BRW* \n\ninstruction is a branch with *W* meaning that the program counter\
    \ will increase by the \n\nvalue held in *W*. In other words, you can do a calculated\
    \ jump. \n\nAfter a block of state code is executed, the program will jump back\
    \ to the switch for the \n\nnext machine where the *BRW* instruction will go to\
    \ the next line if the state value is 0 or \n\nskip a line if it is 1 and skip\
    \ two lines if the value is 2. The program flow is not trapped in \n\nthe state\
    \ blocks but routes round via the switch code. To run two machines as threads,\
    \ \n\nthere will be two state variables: *STATE\\_M0, STATE\\_M1*, and two switches.\
    \ Below is a \n\nFigure 2-7 Example of Program Flow Between Two machines in the\
    \ Same Program"
