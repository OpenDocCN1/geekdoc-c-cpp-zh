    \ SUBWF TICK\\_COUNTER, W ; C in STATUS is set when TICK\\_COUNTER\\_ON >= to\
    \ 31.\n\n BTFSS STATUS, C ; Skip the next instruction if C in STATUS is found\
    \ set.\n\n GOTO SWITCH\\_M1 ; C in STATUS found not set.\n\n INCF STATE\\_M0,\
    \ F ; Tansition to state 1.\n\n BCF LATA, 2 ; Turn LED off\n\n CLRF TICK\\_COUNTER\
