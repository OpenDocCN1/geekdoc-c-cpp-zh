    \ to the chip’s datasheet (page 65 to set \n\n*OSCCON*). \n\nFinally, we come\
    \ to the logic part of the program. Up to now, not much has changed from \n\n\
    the assembly version, but this is where using C starts to pay off. The rest of\
    \ the program is \n\nalmost plain language. There is one outer loop that starts\
    \ with *while (1)*. A while loop in C \n\nexecutes for as long as the expression\
    \ following it inside the () brackets evaluates to logical \n\ntrue. The value\
    \ 1 is taken as being true and 0 as false, so this loop will execute forever.\
    \ The \n\nloop encloses some code and is marked by the first left { bracket and\
    \ ends with the right \n\nbracket }. It is good practice to indent lines of code\
    \ so you can easily see when things like \n\nloops are nested inside others. The\
    \ end of the while loop can be seen easily because the \n\ntwo left and right\
    \ brackets are vertically in-line. As far as the compiler is concerned, it does\
    \ \n\nnot matter. It is not interested in white space. You can put the whole function\
    \ on one line \n\nbut this isn't recommended.\n\nWithin the *while *loop, there\
    \ are two do loops. These have the same purpose as delay loops \n\nin the assembly\
    \ version. The difference between a *while* and a *do* loop are:\n\n• \n\nA *while\
    \ *loop checks the logic expression at the start. If it is not true, it skips\
    \ it and so \n\nit might not get executed at all. \n\n• \n\nA *do* loop checks\
    \ the logic expression at the end of the loop and so it gets executed at \n\n\
    least once. Regardless of the value of counter, it gets decremented by 1. This\
    \ is what \n\ncounter-- does and then the value is checked at the end of the loop.\
    \ If it is greater than \n\n0, the loop goes around again until counter is zero.\
    \ The program then leaves the loop \n\nand the output is set low. Then the next\
    \ loop is run: when it ends the output is set high, \n\nthe outer while loop then\
    \ repeats forever. \n\nThe reason for *@ 0x20* after the *main(void)* is to make\
    \ the compiler start the code at this \n\nmemory address. This speeds up the writing\
