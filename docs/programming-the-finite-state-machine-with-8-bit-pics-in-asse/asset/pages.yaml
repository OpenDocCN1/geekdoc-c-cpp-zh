  md: "g\n\ng\n\ny\n\n● 20\n\nFor example, eleven is expressed by the bits with the\
    \ weights of 8, 2 and 1 being set on. \n\nThis is no different to the way we count\
    \ in tens. The number 364 is four lots of units plus \n\nsix lots of tens plus\
    \ three lots of hundreds. Each place is weighted by a factor of ten. If we \n\n\
    add 6 to 364 it becomes 370. The units position has overflowed and the value of\
    \ ten has \n\nbeen carried and added to the tens position. The same happens with\
    \ binary addition. Here \n\nare three separate examples:\n\n![](img/a08bd00952da48f769971864f33af432_19_0.png)\n\
    \nWhen an addition results in the overflow of a byte, a carry is generated that\
    \ adds to the \n\nnext higher byte. If the first byte counts up to 255, the next\
    \ will count the number of 256s \n\nand so on with the next higher byte counting\
    \ the number of 65536s and so on. \n\n**1.3.2 • The Hexadecimal Numbering System**\n\
    \nIn everyday life, we use the decimal numbering system. Microcontrollers and\
    \ computers \n\noperate using the binary system as described above using bits\
    \ and bytes. Converting the \n\nexpression of a value backward and forwards to\
    \ a binary bit pattern is not very convenient. \n\nThere is an alternative to\
    \ the decimal system that uses 16 characters instead of the ten. \n\nWhat makes\
    \ this convenient is that a group of four bits has sixteen different permutations.\
    \ \n\nTo have 16 characters representing the values from 0 - 15, the letters A\
    \ to F are used \n\nfor 10, 11, 12, 13, 14, and 15. This means that a byte’s value\
    \ can be represented by \n\ntwo hexadecimal digits. Figure 1-11 shows an example\
    \ of the decimal number 44 which \n\nis 00101100 as eight bits displayed as hexadecimal\
    \ 0x2C. Two ways of indicating that a \n\nnumber is being expressed in hexadecimal\
    \ notation, are to prefix it with ‘0x’ or suffix it \n\nwith ‘h’. Hexadecimal\
    \ offers a way of writing binary numbers in a way that is easier than \n\nlong\
    \ strings of ones and noughts in a way that can be converted to individual bits\
    \ easily.\n\nFigure 1-10 Additions with Carry"
