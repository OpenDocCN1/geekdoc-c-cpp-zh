  md: "g\n\ng\n\ny\n\n● 78\n\nThis program is going to read analog voltages on pin\
    \ 3 RA4 (*AN3*). It will transmit the eight \n\nmost significant bits of the 10\
    \ available read from the A/D converter to be read by the \n\ncomputer. By ignoring\
    \ the two least significant bits, we will only resolve to 20 mV instead \n\nof\
    \ 5 mV.\n\nAnalog-to-digital conversion is started by setting bit 1 in *ADCON0*\
    \ to 1. This bit has the \n\nname *GO/DONE*, meaning that when it is set to high\
    \ it starts the conversion. When the \n\nconversion is completed the bit gets\
    \ set to low by the hardware. Inside the code is a loop \n\nthat waits for completion\
    \ before moving on.\n\n BTFSC ADCON0, 1 ; This and the next line loop around until\
    \ the conversion is finished.\n\n GOTO $-1\n\n**4.4.1 ● Setting ADCON0 and ADCON1**\n\
    \n**ADCON0**\n\n*0*\n\n*7*\n\n*0*\n\n*Unimplemented*\n\n*6*\n\n*0*\n\n*5*\n\n\
    *0*\n\n*4*\n\n*0*\n\n*D*\n\n*3*\n\n*1*\n\n*2*\n\n*1*\n\n*1*\n\n*0*\n\n*GO/DONE,\
    \ this will be set later when a conversion is *\n\n*required and read back to\
    \ check for completion*\n\n*0*\n\n*1*\n\n*ADC enable*\n\n**ADCON1**\n\n*6*\n\n\
    *7*\n\n*0*\n\n*ADRESH:ADRESL left-justified. Eight most significant *\n\n*bits\
