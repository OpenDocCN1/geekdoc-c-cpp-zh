  md: "g\n\ng\n\ny\n\n● 88\n\n;prog\\_04\\_05.asm\n\nLIST P=16F1823\n\n#INCLUDE <p16f1823.inc>\n\
    \n#INCLUDE <fsm\\_macros.inc>\n\n RADIX DEC ; Default numbers are to base 10.\n\
    \n BOOK\\_CONFIGURATION ; See macro in fsm\\_macros.inc.\n\n CBLOCK 0x70\n\n PULSE\\\
    _COUNTER\n\n ENDC \n\n ORG 0X00\n\n MOVLB 1\n\n BCF OPTION\\_REG, 7 ; Weak pull\
    \ ups enable\n\n SET\\_FREQ\\_32MHZ ; See file fsm\\_macros.inc.\n\n MOVLB 3\n\
    \n BCF ANSELA, 2 ; Set RA2 as a digital input.\n\n SET\\_SERIAL\\_TX\\_16F1823\
    \ ; See file fsm\\_macros.inc, this sets TXEN, SPEN, sets the Baud\n\n ; rate\
    \ and changes the use of pin 2 to be TX.\n\n CLRF PULSE\\_COUNTER ; Initialize\
    \ count to zero.\n\n BANKSEL PORTA\n\n ;-------Machine states\n\nS0\n\n BTFSC\
