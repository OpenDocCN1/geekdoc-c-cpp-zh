  md: "g\n\ng\n\ny\n\n● 66\n\nThe *MOVLB* instruction can be used to move the bank\
    \ number into *BSR*. Alternatively, the \n\ngpasm *BANKSEL* directive can be used\
    \ to generate the required code for example.\n\n \n\n \n\nBANKSEL TRISA\n\nThis\
    \ will save you from looking up the bank number for *TRISA*. Although this can\
    \ be \n\nconvenient, there are times when you need to know the required bank number.\
    \ For \n\nexample, if you need to access several special registers whilst configuring\
    \ say the oscillator, \n\nthe interrupts, and the inputs and outputs, you can\
    \ save on bank switching if you write your \n\ncode so the special registers are\
    \ grouped by bank. \n\nAs programs become more complicated, the problem of bank\
    \ switching becomes more \n\ndifficult. Because of GOTOs and returning from subroutines,\
    \ you can easily be in the wrong \n\nbank for the subsequent instruction. It is\
    \ one of the first places to look if the code does not \n\nrun. Interrupts have\
    \ automatic context saving. Therefore, the value in *BSR* is restored on \n\n\
    return so you only need to change the bank within the interrupt. Refer to page\
    \ 85 on the \n\ndatasheet. If you are programming in C, the compiler will handle\
    \ bank switching for you.\n\nMy suggestion is to inspect your code by looking\
    \ at small blocks such as the code for each \n\nmachine state, subroutine or macro.\
    \ By just looking at that block of code you can tell that it \n\nis in the correct\
    \ bank for the instructions in it. You might well end up with redundant bank \n\
    \nswitching but you can always optimize it once you have it running. Be extra\
    \ careful with \n\nmacros where code might be out of sight in a different file.\n\
    \nFor macros, the policy I adopt is to only put bank switching inside a macro\
    \ if there is a \n\nrequirement to switch banks partway through the macro. This\
    \ means you have to check to \n\nsee if you are in the correct bank before entering\
    \ the macro. It might seem inconvenient \n\nbut if you have bank switching within\
    \ the macro at the start, it could be redundant and \n\nwasteful of program memory."
