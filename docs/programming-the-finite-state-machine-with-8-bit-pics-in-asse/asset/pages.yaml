  md: "g\n\ng\n\ny\n\n● 136\n\n**Chapter 8 • Troubleshooting and Planning **\n\n**8.1\
    \ • Introduction**\n\nIf you have been experimenting with the programs or have\
    \ been trying to write your own \n\nfrom scratch, you will likely have experienced\
    \ the odd bug or even a completely inoperative \n\nprogram. Assembly language\
    \ programs can be unfriendly. The assembler will warn you \n\nof some things such\
    \ as syntax errors or jumps to labels that aren't recognised. It won't \n\nhowever,\
    \ help you with the functionality of your code. This chapter will try to help\
    \ you \n\ndebug your code when it doesn’t work, or better, stop you from making\
    \ the mistakes. Do \n\nnot be put off if you make mistakes when coding. I very\
    \ rarely get code to run the first time. \n\nOne way you can produce reliable\
    \ code is to keep testing it. This chapter covers both fixing \n\nbugs and the\
    \ planning of programs to avoid bugs. Most of the advice in this chapter applies\
    \ \n\nto general programming. If you are writing in C, Python, Java or programming\
    \ an industrial \n\nprogrammable logic controller (PLC), the same things are true.\n\
    \n**8.2 • Have an Overview of the Project**\n\nYou need to have a clear idea of\
    \ what the project will do. Just letting it grow can lead to \n\nyou having to\
    \ start again. If you take a look at Figures 7-1 and 7-2 (the state charts for\
    \ \n\nthe voltmeter), you have a representation of what the entire program does.\
    \ Three separate \n\nstate machines run concurrently with each state being responsible\
    \ for a limited range of \n\nactivity. You can see what the program does without\
    \ getting bogged down in local detail.\n\n**8.2.1 • State Diagrams and Flow Charts**\n\
    \nYou will have seen flow charts: they crop up in all sorts of places, wall charts,\
    \ instruction \n\nbooklets, even cartoons. They are generally easy to understand\
    \ as they can be seen as \n\nroutes through actions and decisions. Looking at\
    \ state charts, you might think they are \n\njust the same, but they are different.\
    \ As an example, imagine a central heating system for \n\na building where there\
    \ is a boiler and a circulation pump. To control the system, there is \n\na master\
    \ switch and a thermostat. When the master switch is on, the system is enabled\
    \ \n\nand when it is off it's disabled. If the system is enabled, the boiler and\
    \ pump will run if the \n\ntemperature is below the setpoint configured on the\
    \ thermostat. They will stop when the \n\ntemperature reaches the setpoint. Figure\
    \ 8-1 compares a state diagram with a flow chart \n\nto describe the system. The\
    \ FSM, in this case, is shown as a Moore machine where the \n\noutputs are dependent\
    \ only on the state. On the diagram, the outputs are shown inside \n\nthe states.\
    \ If you trace your way around both diagrams, you will see the same functionality\
    \ \n\nbut the flow diagram has no concept of state. If the machine is in state\
    \ 2 where the master \n\nswitch is on and the boiler and pump are off, it will\
    \ remain in that state until either the \n\nmaster switch is turned off, causing\
    \ a transition to state 0, or the temperature drops below \n\nthe setpoint with\
    \ the master switch set to on, in which case the transition will be to state 1\
    \ \n\nto fire the boiler and start the pump. The machine will then stay in this\
    \ state until another \n\ntransition is called for. In the flow chart, the equivalent\
    \ of state 2 is the continuous loop \n\nshown by the dotted ellipse. You can pick\
    \ out the other loops that equate to the two other \n\nstates. When it comes to\
    \ converting these charts into code and then debugging, I find that"
