    \n*+6*\n\n*+6*\n\n*0*\n\n*1*\n\n*1*\n\n*1*\n\n*+7*\n\n*+7*\n\n*1*\n\n*0*\n\n*0*\n\
    \n*0*\n\n*+8*\n\n*\\-8*\n\n*1*\n\n*0*\n\n*0*\n\n*1*\n\n*+9*\n\n*\\-7*\n\n*1*\n\
    \n*0*\n\n*1*\n\n*0*\n\n*+10*\n\n*\\-6*\n\n*1*\n\n*0*\n\n*1*\n\n*1*\n\n*+11*\n\n\
    *\\-5*\n\n*1*\n\n*1*\n\n*0*\n\n*0*\n\n*+12*\n\n*\\-4*\n\n*1*\n\n*1*\n\n*0*\n\n\
    *1*\n\n*+13*\n\n*\\-3*\n\n*1*\n\n*1*\n\n*1*\n\n*0*\n\n*+14*\n\n*\\-2*\n\n*1*\n\
    \n*1*\n\n*1*\n\n*1*\n\n*+15*\n\n*\\-1*\n\nThis way of representing negative numbers\
    \ is called two’s complement. As we have \n\ndemonstrated, the two’s complement\
    \ of a number when added to that number results in \n\nzero. This means that the\
    \ two’s complement of a number is it’s negative. So how do we \n\nwork out what\
    \ the two’s complement of a number is? \n\nLet’s start by taking any binary number\
    \ from the table in the positive range say 5 = 0101. \n\nIf we invert the bits,\
    \ that is, to make zeros ones and ones zeros, you get 1010. Adding \n\nthese numbers\
    \ gives:\n\n \n\n0101\n\n \n\n1010\n\n \n\n1111\n\nIt should be seen that this\
    \ will apply to all binary numbers. If you add the number to the \n\nnumber obtained\
    \ by inverting the bits, the sum will contain all 1s. The number that is the \n\
    \nbit inversion of the original number is called one’s complement. What happens\
    \ if you add \n\n1 to the one’s complement? \n\n \n\n1111\n\n \n\n0001\n\n \n\n\
    0000 with 1 carried out\n\nBy adding 1 to the ones’s complement, you get the two’s\
    \ complement that is the negative \n\nTable 6-4 Bit Pattern Used for Four-Bit\
    \ Integers Signed and Unsigned"
