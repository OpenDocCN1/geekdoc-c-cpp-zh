  md: "g\n\ng\n\ny\n\n● 32\n\n**Chapter 2 • The Assembly Program as a Finite State\
    \ Machine**\n\n**2.1 • Introduction**\n\nThis chapter demonstrates a format for\
    \ laying out an FSM in assembly that will be used \n\nthroughout the rest of the\
    \ book. The first example will be a two-state machine that will \n\nhave a structure\
    \ that can be scaled to have more states and even have more than one \n\nstate\
    \ machine in the program allowing a form of program threading. The PIC is not\
    \ just a \n\nprocessor but has other features such as three timers that can run\
    \ independently of the \n\ncode. There is also the ability to interrupt and divert\
    \ the program using events from within \n\nand from outside the PIC. \n\nAs was\
    \ mentioned in the first chapter I advise having the datasheet for these PICs\
    \ to hand \n\nwhile programming, it is *DS40001413E* and is available for free\
    \ download from the Microchip \n\nwebsite. Throughout the book, I will refer to\
    \ pages in the datasheet where relevant. Where \n\na page number is quoted it\
    \ refers to the Microchip datasheet. \n\n**2.2 • A State Machine Framework for\
    \ Assembly Language**\n\nFigure 2-1 shows the two-state machine to flash an LED\
    \ on and off. We will use this as \n\nthe first step to develop a standard framework\
    \ for an FSM in assembly language. With a \n\nMoore machine, the outputs are dependent\
    \ only on the current state, whereas with a Mealy \n\nmachine the outputs are\
    \ dependent on the state and the value of the inputs. Most of the \n\nFSMs in\
    \ this book will be based on the Mealy format, in the state diagram here the input\
    \ is \n\nthe expiry of the timer, this causes the transition, and the outputs\
    \ are the resetting of the \n\ntimer and the switching of the LED. The inputs\
    \ and outputs are written on the transition \n\narrow separated by a forward slash.\n\
    \n![](img/a08bd00952da48f769971864f33af432_31_0.png)\n\nThe operation of this\
    \ machine has already been explained in Chapter 1. In the ‘Hello \n\nWorld’ program\
    \ in Chapter 1, the timer was just a counter that triggered the transition \n\n\
    when it rolled over. What needs to be elaborated on is the practical implementation\
    \ of \n\nthe timer that decides when to change state in this program where we\
    \ want to measure \n\nthe time more precisely. This is another counter that counts\
    \ the number of times that a \n\nfast timer repeatedly expires and then starts\
    \ timing again. This fast timer can be thought \n\nof as generating ticks. It\
    \ will tick at approximately 122 times per second. Although the \n\nFigure 2-1\
    \ Example FSM"
