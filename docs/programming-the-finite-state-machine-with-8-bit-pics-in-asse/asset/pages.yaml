  md: "g\n\ng\n\ny\n\n● 38\n\n**INTCON**\n\n*E*\n\n*7*\n\n*1*\n\n*Global Interrupt\
    \ Enable Bit*\n\n*6*\n\n*1*\n\n*Peripheral Interrupt Enable Bit*\n\n*5*\n\n*1*\n\
    \n*Timer0 Overflow Interrupt Enable Bit*\n\n*4*\n\n*0*\n\n*INT External Interrupt\
    \ Enable Bit*\n\n*0*\n\n*3*\n\n*0*\n\n*Interrupt on Change Enable Bit*\n\n*2*\n\
    \n*0*\n\n*Timer0 Overflow Interrupt Flag Bit*\n\n*1*\n\n*0*\n\n*INT External Interrupt\
    \ Flag Bit*\n\n*0*\n\n*0*\n\n*Interrupt-on-Change Interrupt Flag Bit*\n\nThe *INTCON*\
    \ register is available in all banks (page 22). This counter is in the block of\
    \ 16 \n\nmemory locations accessible for all banks, 0x070 – 0x07F (page 21). We\
    \ now have an \n\ninterrupt occurring every time *TMR0* overflows from 255 back\
    \ to 0, 122 times per second. \n\nThis is way too fast for our flashing LED as\
    \ it would appear to be on all the time, but dimmer. \n\nThis is where the counter\
    \ comes in. The code is going to have two states: one for LED on \n\nand one for\
    \ off. The counter *TICK\\_COUNTER* is going to be incremented by the interrupt\
    \ \n\ncode. The counter is going be checked to see if it is greater than or equal\
    \ to 31 whilst in the \n\non state. If it is, the state will be changed. This\
    \ means that the on-time will be 31/122 of \n\na second: approximately 0.25s.\
    \ When in the off state, the counter will be checked to see if \n\nit has reached\
    \ 91. This will give a delay of 91/122 of a second: approximately 0.75s. Here\
    \ \n\nare the lines of code for the on-state. The counter is reset as being one\
    \ of the outputs or \n\nactions during the transition.\n\nS0 ; LED on.\n\n MOVLW\
    \ 31\n\n SUBWF TICK\\_COUNTER, W ; C in STATUS is set when counter\\_on >==31.\n\
    \n BTFSS STATUS, C ; Skip next instruction if C in STATUS is found set\n\n GOTO\
    \ S0 ; C in status found not set.\n\n CLRF TICK\\_COUNTER ; Reset the counter.\n\
    \n BCF PORTA, 2 ; Turn the LED off.\n\n \n\nWith gpasm, the default number base\
    \ is hexadecimal. To express decimal numbers greater \n\nthen 9 such as ninety-one,\
    \ you have to put D’91’. I prefer to add the line ‘RADIX DEC’ to \n\nthe code\
    \ so that the base is now 10. Conventional notation for numbers can now be used.\
    \ \n\nFrom now on, numbers will be expressed as follows. \n\n11 Means eleven in\
    \ decimal.\n\n0x11 Means seventeen in hexadecimal.\n\nB’11’ Means three in binary.\n\
    \nConfusing number bases between decimal and hexadecimal is another particular\
    \ cause of \n\nbugs.\n\nTable 2-3 Example Bit Settings for INTCON Register"
