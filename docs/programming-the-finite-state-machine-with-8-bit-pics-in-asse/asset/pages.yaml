  md: "p\n\ny\n\ng\n\n● 33\n\nstate diagram shows the logic of the sequencing, in\
    \ any practical program there will be \n\nsome support code off to the side that\
    \ does things like configuring the PIC’s peripherals or \n\ncounting clock cycles,\
    \ etc.\n\nThe next two sections will describe how this fast timer is configured\
    \ and used. Also how its \n\nticks are counted to provide the inputs to the machine.\n\
    \n**2.3 • Timer0**\n\nThese PICs have three onboard timers that run independently\
    \ of the program. In the Hello \n\nWorld program in the last chapter, we created\
    \ a delay by decrementing a file value until it \n\nreached zero. This is a bad\
    \ way of creating longer delays as the CPU is doing nothing other \n\nthan counting\
    \ instruction cycles. The three timers are *timer0, timer1*, and *timer2*. We\
    \ will \n\nstart by looking at *timer0*. The first problem is how do timers keep\
    \ track of time? They work \n\nas counters counting clock cycles, but because\
    \ each timer is a separate hardware entity, \n\nthey do this concurrently with\
    \ the program. Because the timers are counting clock cycles, \n\nwe must take\
    \ into account the frequency of the oscillator being used. We will be using the\
    \ \n\ninternal oscillator where a range of frequencies from 31 kHz to 32 MHz can\
    \ be selected. \n\n*Timer0* is an eight-bit timer/counter that can be used as\
    \ a timer or a counter. Here I’ll \n\ndescribe how to configure it as a timer.\
    \ At the heart of the module is the *TMR0* register \n\nthat is in bank 0 of the\
    \ data memory. See page 22 of the datasheet. When the timer is \n\nrunning it\
    \ will count up until its value is 255 and then overflow or roll over to 0. The\
    \ time it \n\ntakes to overflow will depend on the value loaded into it, to begin\
    \ with, the clock frequency, \n\nand the configuration of a Prescaler that can\
    \ divide the incoming frequency. The full block \n\ndiagram can be seen on page\
    \ 162 of the datasheet. Figure 2-2 is a simplified diagram of \n\nour application.\n\
    \n![](img/a08bd00952da48f769971864f33af432_32_0.png)\n\nFigure 2-2 Simpliﬁed Block\
    \ Diagram of timer0"
