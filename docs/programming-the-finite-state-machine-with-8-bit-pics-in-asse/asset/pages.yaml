    \ Terminals T1 to T8 are copper pins \n\nthat pass through 1.0 mm holes. Terminals\
    \ *T1*, and *T4* to *T7* pass through to the wiring \n\nside. The holes are countersunk\
    \ and the pins secured with a drop of epoxy glue such as \n\nAraldite. Terminal\
    \ pins *T2, T3* and *T8* are also inserted into 1.0 mm diameter holes, but the\
    \ \n\nholes are not countersunk as the pins are soldered to the ground plane.\
    \ Figure 5-3b shows \n\ndetails of the holes. Drill four 4 mm diameter holes at\
    \ the corners of the board: these are \n\nfor the fixing screws if you want to\
    \ mount the board in a box. When you come to solder the \n\nwiring on the non-copper\
    \ side, you can temporarily attach the screws with nuts through \n\nthe holes\
    \ as legs to stand the board upside down holding the components clear of the table\
    \ \n\nwhile you solder. To cut the board to size, the easiest method is to use\
    \ a metal straight edge \n\nand score a line on both sides with a modelling knife.\
    \ Then clamp the board between two \n\nbits of wood and snap it along the lines.\n\
    \n![](img/a08bd00952da48f769971864f33af432_95_0.png)\n\n**5.4 • Populating and\
    \ Wiring the Board **\n\nOnce the holes have been drilled, place the terminals\
    \ in the holes and solder the grounded \n\nones and glue the insulated ones in\
    \ place. A glue such as rapid Araldite can be used. For the \n\nPIC itself, I\
    \ recommend using an IC holder that you place in the holes and solder the wiring\
    \ \n\nto. Plug the PIC in after all the soldering is finished. This makes it less\
    \ likely to damage \n\nthe PIC. Should it become damaged electrically in the future\
    \ you can easily change it. For \n\nthe other components, bend the legs at a right\
    \ angle to line up with their holes. Feed them \n\nthrough until the component\
    \ is almost against the copper surface. Snip off all but 5mm of \n\nthe legs and\
    \ bend at right angles flat on the non-copper side, see Figure 5-3b. Ensure you\
    \ \n\nhave the diodes the correct way round. The purpose of these diodes is to\
    \ protect the PIC’s \n\ninput from reverse voltage, if the probe leads are accidentally\
    \ used the wrong way round \n\nand an overvoltage if the input rises above the\
    \ supply voltage. By using screws and nuts to \n\nmake legs to stand the board\
    \ upside down, it will be easy to solder the wiring while keeping \n\nthe components\
    \ clear of the work surface. If the IC holder drops out, it can be temporarily\
    \ \n\nheld in place with a bit of tape. For the connection between component legs\
    \ and the IC \n\nholder pins, I find wire wrapping wire ideal as it’s one solid\
    \ strand and is very thin. \n\nFigure 5-3b Details of the Holes"
