    \n \n\n END\n\n**4.6 ● Digital Inputs**\n\nWe can use I/Os *RA0, RA1, RA2, RA4,\
    \ RA5, RC0, RC1, RC2, RC3, RC4*, and *RC5* as digital \n\ninputs. We can not use\
    \ *RA3* as an input as we are using low voltage in-circuit programming \n\nand\
    \ this pin is automatically enabled as *MCLR*. When pin *MCLR* is held low, the\
    \ device is \n\nreset. The pin is held high by the internal weak pull-up resistor.\
    \ To configure a pin as an \n\ninput, the relevant bit in *TRISA* or *TRISC* should\
    \ be set to 1. This is the default anyway. \n\nSome of the pins can be analog\
    \ inputs, so their relevant bit in *ANSELA* or *ANSELC* **must **\n\n**be cleared\
    \ to 0**. The default is 1. See pages 3 and 5 of the datasheet for tables giving\
    \ an \n\noverview of these points. Also, be aware of the *APFCON* register that\
    \ changes the use of \n\nsome pins. We already used this to reassign the *Tx*\
    \ pin in Program 4-1.\n\n**4.6.1 ● Counting Input Pulses From a Switch**\n\nThis\
    \ program will try to count pulses from a manually operated switch. The count\
    \ will be \n\nread by transmitting to the computer over a serial link. The circuit\
    \ diagram is shown in \n\nFigure 4-10. A switch is connected to pin 11 (RA2).\
    \ By using the internal weak pull-up \n\nresistor, there is no need for an external\
    \ resistor. The switch pulls the pin voltage down to \n\n0 V when it is closed.\n\
    \nProgram 4-4 Pulse Width Modulated Output"
