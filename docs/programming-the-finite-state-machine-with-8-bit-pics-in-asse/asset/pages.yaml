  md: "p\n\np\n\np\n\n● 83\n\nWhen the brightness reaches the minimum, the state changes\
    \ from 3 to 0, back to the \n\nstart condition.\n\nThe PICs have complicated features\
    \ associated with PWM peripherals. Here we will use a \n\nsimple example of its\
    \ configuration. I will show how this example is set up using tables \n\nexplaining\
    \ the bit values used. The datasheet gives full explanations.\n\nFour special-purpose\
    \ registers have to be configured: *PR2, T2CON, CCP1CON*, and \n\n*CCPR1L*. The\
    \ period of a PWM cycle is the inverse of its frequency. As mentioned above, \n\
    \nthis frequency will be 1.95 kHz. Timer2 is used to determine the frequency.\
    \ On page 176 \n\nof the datasheet, Fig 22-1 is a block diagram of the timer.\
    \ Register *TMR2* is incremented \n\nby pulses from a Prescaler that is fed from\
    \ *Fosc/4*. When the value in *TMR2* reaches the \n\nvalue in *PR2*, a comparator\
    \ gives an output and the register *TMR2* is reset to zero. Now \n\nif you look\
    \ at page 195 of the datasheet, on Fig 24-4 you can see that this is used in \n\
    \nconjunction with another comparator and an S-R flip flop. The overview explanation\
    \ is \n\nthat Timer2 sets the flip flop at regular intervals that are the period\
    \ of the PWM cycle \n\nand partway through the cycle the flip flop is reset by\
    \ the other comparator comparing \n\nthe value that comes from *CCPR1L*. This\
    \ means that we can control the output power by \n\nchanging the values in *CCPR1L*\
    \ (eight bits) and two additional bits that come from bits \n\n*CCP1CON* <5:4>.\
    \ The two bits from *CCP1CON* are the least significant bits so we will not \n\
    \nuse them. The power will be adjusted by varying *CCPRIL* over its range of 0\
    \ to 255.\n\nThe *T2CON* special register is set up to give the PWM frequency\
    \ of 1.95 kHz. Table 4-7 \n\nshows the settings. The Prescaler value of 16 comes\
    \ from Table 24-5 on page 197 of the \n\ndatasheet.\n\nTo explain this setting,\
    \ the oscillator frequency will be 32MHz. The Prescaler is fed with \n\nFosc/4.\
    \ The Prescaler is 16 and according to the table, *PR2* will be OxFF (dec 255).\
    \ This \n\nmeans that the period will be determined when *TMR2* matches *PR2*.\n\
    \n \n\nPWM frequency = 32000000/(16x256x4) = 1.95 kHz\n\n**T2CON**\n\n*0*\n\n\
    *7*\n\n*0*\n\n*Unimplemented*\n\n*6*\n\n*0*\n\n*Post scaler not used, left as\
    \ default*\n\n*5*\n\n*0*\n\n*4*\n\n*0*\n\n*6*\n\n*3*\n\n*0*\n\n*2*\n\n*1*\n\n\
    *Timer2 is on*\n\n*1*\n\n*1*\n\n*Timer 2 Prescaler set to 16*\n\n*0*\n\n*0*\n\n\
    Table 4-7 T2CON"
