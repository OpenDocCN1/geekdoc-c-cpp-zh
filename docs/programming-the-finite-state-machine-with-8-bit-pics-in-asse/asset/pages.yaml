  md: "p\n\np\n\n● 151\n\n**Chapter 9 • A Comparison with C**\n\n**9.1 • Introduction**\n\
    \nAssembly language has advantages and disadvantages. One advantage is the insight\
    \ into \n\nthe hardware and what your code does. If you are a hobbyist, then using\
    \ assembly can be \n\nfun and interesting. If you are a student, it will give\
    \ you a better foundation for when you \n\ncome to use higher-level languages,\
    \ or need to get the most out of a chip. For PICs, the \n\nfree version of the\
    \ XC8 compiler will generally create larger code than you can do yourself \n\n\
    in assembly. One of the purposes of this book is to show how the finite state\
    \ machine \n\napproach could give structure to an assembly program, making it\
    \ easier to write and just \n\nas important, easier to read. The last two chapters\
    \ are about using C with FSMs. I assume \n\nthat you have never used C before.\
    \ This chapter will firstly be about installing the compiler \n\nand will detail\
    \ some of the essential knowledge regarding the language. Writing software \n\n\
    in a higher-level language does save you time, so provided the program performs\
    \ correctly \n\nand fits into the available memory, using C makes sense. \n\n\
    **9.2 • The Microchip XC8 Compiler**\n\nThe compiler used is the free version\
    \ of Microchip’s XC8. The code will be written in a text \n\nfile and the hex\
    \ file produced by the compiler will be written to the chip with the FTDI \n\n\
    lead and the *program\\_writer* program used throughout the book. The compiler\
    \ is available \n\nfor free download from Microchip’s website. One way to find\
    \ the page is to Google “XC8 \n\ndownloads”, or navigate from their home page\
    \ to Technical Support, Resources, C Compilers \n\nand then Downloads. For this\
    \ book, we will be using XC8 as a stand-alone program without \n\nMPLAB where\
    \ you would have a graphic user interface (GUI). This will be done by running\
    \ it \n\nfrom the command line. Make sure you get the correct version for either\
    \ Linux or Windows.\n\n**9.2.1 • XC8 for Microsoft Windows**\n\nRun the installer\
    \ file and answer the terms and conditions questions. Accept the default \n\n\
    location for installation, and agree to add XC8 to the path environment variable.\
    \ It is up to \n\nyou if you want to buy a license, use a free trial of the paid-for\
    \ version, or just use the free \n\nversion. For this book, the free version is\
    \ all you need. \n\n**9.2.2 • XC8 for 32 Bit Debian-Based Distributions**\n\n\
    This applies to Debian and its derivatives such as Ubuntu and Mint. Download the\
    \ Linux \n\nversion of the installer. Its file name will end with .run. Note that\
    \ this is not free as in open-\n\nsource software. You will not be installing\
    \ it the way you would normally, with the package \n\nmanager taking care of things.\
    \ The first thing you will have to do is make the file executable \n\nby running\
    \ this command as shown in Fig 9-1. Here I downloaded the file to my Downloads\
    \ \n\ndirectory and the command *chmod +x xc8-v2.10-full-install-linux-installer.run*\
    \ will make it \n\nexecutable. Note: the version might be different now."
