    \n CBLOCK 0x70 ; In commom RAM, accessible in all banks.\n\n TICK\\_COUNTER ;\
    \ Only one tick counter is used.\n\n ENDC\n\n ORG 0x00\n\n GOTO START\n\n ORG\
    \ 0x04\n\n BCF INTCON, TMR0IF\n\n INCF TICK\\_COUNTER, F\n\n RETFIE\n\nSTART\n\
    \n MOVLW 0xFF\n\n MOVWF PR2 ; See the text in the book reference PWM frequency.\n\
    \n MOVLW 0x06\n\n MOVWF T2CON ; see Table 4-7 in the book.\n\n MOVLB 5\n\n MOVLW\
    \ 0x0C\n\n MOVWF CCP1CON ; See Table 4-8 in the book.\n\n CLRF CCPR1L ; Initialises\
    \ the PWM to minimum output.\n\n MOVLB 1 ; For macros and TRISC.\n\n SET\\_FREQ\\\
    _32MHZ ; See the file fsm\\_macros.inc.\n\n SET\\_TMR0\\_CASE1\n\n BCF TRISC,\
    \ 5 ; Sets RC5 as an output.\n\n MOVLB 2\n\n BCF LATA, 2 ; Initialise LED to off.\n\
    \n MOVLB 5 ; For CCPR1L \n\n \n\nS0 ; LED brightness increasing states 0 and 1.\
    \ \n\n MOVLW 0x5\n\n IF\\_REG\\_LESS\\_THAN\\_W TICK\\_COUNTER\n\n GOTO S0 ; When\
    \ tick counter is less than 5 stay in S0.\n\nS1 ; Waxing inc.\n\n INCF CCPR1L,\
    \ F\n\n CLRF TICK\\_COUNTER ; This is common to both outcomes. See state chart.\n\
    \n MOVLW 255\n\n IF\\_REG\\_GREATER\\_THAN\\_OR\\_EQUAL\\_TO\\_W CCPR1L\n\nTable\
    \ 4-8 CCP1CON"
