  md: "p\n\ng\n\ng\n\n● 137\n\nthe statechart wins. With a state machine, it is easier\
    \ to separate code that has a particular \n\npurpose. This leads to the subject\
    \ of the next paragraph.\n\n![](img/a08bd00952da48f769971864f33af432_136_0.png)\n\
    \n**8.3 • Break Big Problems Down Into Smaller Ones**\n\nIf your project does\
    \ several things, break it down into different parts. In the voltmeter \n\nproject,\
    \ the program has to read input voltage using the analog-to-digital converter,\
    \ \n\nthen decide on whether the voltage is above 111 mV or not. If it is, the\
    \ raw result of \n\nthis conversion has to be scaled to represent millivolts.\
    \ The individual figures that make \n\nup the output have to be extracted until\
    \ all the functionality of the project is achieved. \n\nEach of these operations\
    \ should be seen as a separate problem. This is where the state \n\nmachine approach\
    \ can help because you can have states that do one job or machines that \n\ndo\
    \ a small number of jobs. Subroutines and macros also help towards reliability.\
    \ Having \n\nproduced some code that works, it can be used again and depended\
    \ on. When you come to \n\ndeveloping code, write it in small parts so that they\
    \ can be tested on their own. This testing \n\ncan be done by writing short mini-projects\
    \ to test individual blocks of code.\n\n**8.4 • Read Through Your Code in Detail\
    \ and Add Comments**\n\nTake your time reading through your code. Carefully try\
    \ to visualize what is happening. To \n\nstart with, add comments to every line.\
    \ This will force you to think about every detail. You \n\nmight be the only person\
    \ who ever reads these comments but they will be useful when you \n\nlook at the\
    \ code at a later date. If you make changes for any reason, keep your state chart\
    \ \n\nsynchronized with the code and update your comments. Incorrect comments\
    \ are can be \n\nvery confusing! \n\n**8.5 • Debugging a Running Program**\n\n\
    As this book does not call for the use of Microchip’s PICKIT programmer/debugger,\
    \ we are \n\ninstead using the FTDI lead and the programs provided for the book.\
    \ We can’t make use of \n\nFigure 8-1 State diagram and Flow Chart"
