  md: "p\n\np\n\np\n\n● 67\n\n**Chapter 4 • Inputs and Outputs**\n\n**4.1 • Introduction**\n\
    \nThe first three chapters only used PIC outputs to drive LEDs. This was to simply\
    \ get up and \n\nrunning with the toolchain and the concept of FSM. This chapter\
    \ will elaborate on inputs \n\nand outputs and deal with digital/analog inputs,\
    \ pulse width modulated outputs and serial \n\ncommunication with a computer.\
    \ PICs can also communicate with other devices using the \n\nI2C bus and accept\
    \ inputs by finger touching using capacitive sensing. The book will not \n\ngo\
    \ into these however from what has been covered and with the information from\
    \ the \n\ndatasheet, you should be able to make use of these in your projects.\
    \ From a state machine \n\npoint of view, the programs in this chapter are trivial\
    \ This chapter is about using the I/O. \n\n**4.2 • Serial Output to a Computer**\n\
    \nThese PICs have an ‘Enhanced Universal Synchronous Asynchronous Receiver Transmitter’\
    \ \n\n(EUSART) that we can use with an *FTDI* serial lead to communicate directly\
    \ between the \n\nPIC and computer. Contained within the archive file download\
    \ for both Windows and Linux, \n\nis a program called *serial\\_reader* that prints\
    \ to screen values transmitted by the PIC. To \n\nproduce data to transmit, program\
    \ 3-1 will flash an LED and increment a counter. The \n\ncounter value will be\
    \ transmitted over the serial link to the computer where it will be \n\ndisplayed\
    \ on the screen.\n\n![](img/a08bd00952da48f769971864f33af432_66_0.png)\n\n**4.2.1\
    \ • TTL Level Serial Communications**\n\nAn RS232 serial link in general uses\
    \ a negative voltage of between -3V and -25V to represent \n\na logical 1 and\
    \ a positive voltage between +3V and +25V to represent a logical 0. The PICs \n\
    \nand FTDI lead use voltages of 0V for a logical 0 and +5V (approx) to represent\
    \ a logical \n\n1\\. This is very convenient as we only need one power supply\
    \ voltage and no level shifting \n\ncircuitry. The serial link transfers bytes\
    \ of data at a rate referred to as ‘Baud’. The Baud rate \n\nFigure 4-1 State\
    \ Diagram for Program 4-1"
