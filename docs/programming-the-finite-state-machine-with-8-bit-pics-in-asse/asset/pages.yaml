  md: "p\n\np\n\np\n\n● 69\n\nSET\\_SERIAL\\_TX\\_16F1823 MACRO ; Bank 3 required.\n\
    \n BSF TXSTA, TXEN ; Enables transmit BIT 5. See page 277.\n\n BSF RCSTA, SPEN\
    \ ; Enables the serial port BIT 7. See page 278.\n\n MOVLW 0x19 ; Sets the Baudrate=clock/(64\\\
    *(spbrgh:spbrgl+1))=19200\n\n ; for clock=32MHz. See pages 280 and 282.\n\n MOVWF\
    \ SPBRGL\n\n CLRF SPBRGH\n\n MOVLB 2\n\n BSF APFCON, TXCKSEL ; Set bit 2 of APFCON\
    \ to change the use of pin 13 to be TX. See page 114.\n\n ENDM ; Leaves in bank\
    \ 2\n\n \n\nThe transmission of the byte is achieved by loading a value into the\
    \ *TXREG* register. If the \n\nTransmit Shift Register (*TSR*) is empty, the byte\
    \ is moved immediately to the *TSR*. The next \n\nline tests the *TRMT* bit in\
    \ *TXSTA*. This bit is low when *TSR* is not empty and goes high when \n\n*TSR*\
    \ is empty. The line after loading the byte into *TXREG* tests the *TRMT* bit\
    \ and the next \n\nline loops around until the byte has been transmitted. \n\n\
    \ MOVFW PULSE\\_COUNTER\n\n MOVWF TXREG ; Loads the value of pulse\\_counter into\
    \ TXREG for transmission.\n\n BTFSS TXSTA, TRMT ; When the transmission has completed\
    \ TRMT gets set, until then this\n\n ; line and the next loop around.\n\n GOTO\
    \ $-1\n\n CLRF TICK\\_COUNTER\n\nYou can compare the state diagram Figure 4-1\
    \ with the program below.\n\n \n\n**4.2.3 • Serial Output Example**\n\nBelow is\
    \ the complete program to demonstrate transmitting byte values. A single byte\
