    \n CLRF PULSE\\_COUNTER ; Initialize count to zero.\n\n ;-------Machine states\n\
    \nS0\n\n BANKSEL PORTA\n\n BTFSC PORTA, 2 ; If switch is open input will be high\
    \ weak pull up\n\n ; resistor will make input high. Individual weak pull ups are\n\
