  md: "p\n\ny\n\n● 105\n\nvalues in the range of 0 – 255 can be tried. Fig 6-1 shows\
    \ in detail what happens in the \n\nsubroutine when 192 and 168 are added.\n\n\
    ![](img/a08bd00952da48f769971864f33af432_104_0.png)\n\nThe code for the addition\
    \ is in a subroutine so that it can be called as required. There is \n\nanother\
    \ subroutine that transmits the 16-bit result as two single-byte transmissions.\
    \ The \n\nfirst byte being the high order one. There are four files used as variables.\
    \ *Xa* and *Xb* are \n\nthe two addends to be added together. *Y0* and *Y1* are\
    \ the two bytes that make up the \n\nsum or the result. *Y1* is the high order\
    \ byte. The program is not written as a finite state \n\nmachine as it’s just\
    \ one loop. \n\nIn the first addition, *Xa* is loaded with 192, and *Xb* 168.\
    \ The add and then the transmit \n\nsubroutine is called. Then *Xa* and *Xb* are\
    \ loaded with 192 and 3. These are then added \n\nand transmitted. To slow things\
    \ down so that the print out on the computer can be read, \n\nthere is a delay\
    \ of two seconds included. This is just another time-wasting loop counting \n\n\
    244 x 8.2 ms interrupt ticks, however, it’s all we need here.\n\nFigure 6-1 An\
    \ Example of Adding Two Eight-Bit Numbers"
