  md: "p\n\ng\n\n● 25\n\ntake a look at page 1, note 2 of the datasheet on in circuit\
    \ *DS41390C* programming. This \n\ndatasheet explains everything about the in\
    \ circuit programming of these PICs. One last \n\npoint: the line drawn over *MCLR*\
    \ means *‘NOT MCLR’*. If the voltage is 5V, it is not resetting \n\nthe PIC. It\
    \ resets on 0V. \n\nNow for a look at some assembly language code. The code once\
    \ written to the PIC is a \n\nlist of machine instructions. Generally, one instruction\
    \ is executed for every four clock \n\ncycles. Clock cycles are produced by the\
    \ oscillator. Everything in this book will use the \n\ninternal oscillator. No\
    \ external components are required for the oscillator. Each instruction \n\nis\
    \ located at a memory address in the flash memory of the PIC. As the program runs,\
    \ the \n\ncurrent instruction is pointed to by the program counter. This counter\
    \ increments by one \n\nas each instruction is executed. Some of the instructions\
    \ can cause the program counter \n\nto jump forwards or backward. These jumps\
    \ can be decided on by the outcome of logical \n\nor mathematical operations.\
    \ If you have programmed in another language such as C/C++, \n\nJava, Python,\
    \ etc, you will be familiar with the *if...else* statement used frequently to\
    \ execute \n\none piece of code or another based on whether an expression is true\
    \ or false. Consider this \n\nexample in pseudo-code.\n\n \n\nif bit Z in the\
    \ STATUS register is high then\n\n \n\n turn the output on; \n\n \n\nelse\n\n\
    \ \n\n turn the output off;\n\n \n\nend\\_if;\n\nFigure 1-15 shows how to implement\
    \ this in PIC assembly language. Before the code that \n\nis shown here, a subtraction\
    \ calculation is carried out. If the result is zero, bit *Z* in *STATUS* \n\n\
    will be set on. *BTFSS* (bit test file skip on set) tests a bit in a file. If\
    \ the bit is high, the \n\nnext instruction will be skipped. If low, the next\
    \ instruction will be executed. In typing \n\nyour assembly program, the opcode\
    \ mnemonics are indented. The words on the extreme \n\nleft are labels that you\
    \ invent to mark places in the code. These labels can be used as the \n\ndestination\
    \ for *GOTO* opcode."
