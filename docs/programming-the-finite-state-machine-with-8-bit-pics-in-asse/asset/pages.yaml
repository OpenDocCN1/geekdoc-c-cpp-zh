  md: "p\n\np\n\n● 155\n\n \n\nunsigned char counter; \n\nAn unsigned char in C is\
    \ an integer value from 0 to 255 and occupies one 8-bit file in the \n\nPIC’s\
    \ memory. This line of code is a variable declaration. Every variable must be\
    \ declared \n\nbefore it is used so that the compiler knows its type and can allocate\
    \ space in memory for \n\nit. You will notice that C programs have semi-colons\
    \ here and there throughout the code. \n\nAlthough they seem to appear at the\
    \ end of lines, they don’t mark the end of a line: they \n\nmark the end of a\
    \ statement. \n\nFunctions are another key thing to understand. To begin with,\
    \ every program has to have \n\na main function. If you have done any coding with\
    \ an Arduino, you might now be confused \n\nbecause the Arduino sketches don’t\
    \ seem to have a main function. They do, but it’s hidden \n\nfrom view when you\
    \ use their integrated development environment (IDE). The main \n\nfunction of\
    \ a C or C++ program is the entry or start point of execution. Functions can have\
    \ \n\narguments that are used to pass data to the function. In our case, there\
    \ is no data to pass \n\nto main so the brackets after main contain the word void.\
    \ In front of main is also the void \n\nword. This means the function does not\
    \ return any data when it finishes. There will be other \n\nfunctions used later\
    \ that take arguments or return data. Generally, when programming \n\nfor a computer\
    \ where there is an operating system that runs the program, you can pass \n\n\
    command-line arguments to main and the program returns a value to the operating\
    \ system \n\nto indicate success or not. With our PICs, however, there is no operating\
    \ system.\n\nAs advised before, comments are useful in code. In C there are two\
    \ ways to annotate a \n\ncomment. \n\n• \n\nThe first is to put in front of the\
    \ comment two // forward slashes. This means that the \n\nrest of this line is\
    \ a comment. \n\n• \n\nThe other way is to start the comment with /\\* and end\
    \ it with \\*/ .This allows the \n\ncomment to continue over more than one line.\n\
    \nStarting with the first line of Program 9-1, there is a comment stating the\
