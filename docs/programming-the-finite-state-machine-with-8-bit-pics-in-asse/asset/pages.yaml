  md: "g\n\ng\n\ny\n\n● 82\n\n![](img/a08bd00952da48f769971864f33af432_81_0.png)\n\
    \n**4.5.1 ● LED with Pulsing Brightness**\n\nTo demonstrate the use of PWM, Program\
    \ 4-4 varies the brightness of an LED in cycles \n\nthrough bright and dim. The\
    \ LED should be connected through a resistor as previously \n\nbut to *RC5*. Starting\
    \ with the state diagram Figure 4-9, there are four states. In state 0, \n\nthe\
    \ brightness is constant for 41 ms after which the brightness is incremented by\
    \ 1 and \n\nthe program jumps to state 1. If the maximum brightness has been reached,\
    \ the machine \n\njumps to state 4 and resets TICK\\_COUNTER to zero. If maximum\
    \ brightness has not been \n\nreached, the state changes back to 0 and this cycle\
    \ repeats. When maximum brightness \n\nhas been reached and the state is 4, the\
    \ state holds for 41 ms and the state changes to \n\n3 and the brightness is decremented\
    \ by 1. If the brightness is above the minimum, the \n\nstate returns to 4 and\
    \ TICK\\_COUNTER is reset to zero.\n\n![](img/a08bd00952da48f769971864f33af432_81_1.png)\n\
    \nFigure 4-8 Pulse Width Modulation\n\nFigure 4-9 State Diagram Prog 4-4"
  merge: -1
