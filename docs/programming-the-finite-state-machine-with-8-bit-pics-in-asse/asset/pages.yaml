    \ LEARN ● DESIGN ● SHARE ● LEARN \n\n**Andrew Pratt**\n\n![](img/a08bd00952da48f769971864f33af432_187_2.png)\n\
    \nAndrew Pratt provides a detailed introduction to programming \n\nPIC microcontrollers,\
    \ as well as a thorough overview of the \n\nFinite State Machine (FSM) approach\
    \ to programming. Most of \n\nthe book uses assembly programming, but do not be\
    \ deterred. \n\nThe FSM gives a structure to a program, making it easy to plan,\
    \ \n\nwrite, and modify. The last two chapters introduce programming \n\nin C,\
    \ so you can make a direct comparison between the two \n\ntechniques. The book\
    \ references the relevant parts of the \n\nMicrochip datasheet as familiarity\
    \ with it is the best way to \n\ndiscover detailed information.\n\nThis book is\
    \ aimed at Microsoft Windows and Linux users. To \n\nkeep your costs to a minimum\
    \ and to simplify the toolchain, \n\nspecific applications are provided as a free\
    \ download to \n\nenable you to use an FTDI serial lead as the programmer. The\
    \ \n\nassembler used is the open-source \"gpasm\". All programming \n\ncan be\
    \ done in a text editor. There are detailed instructions \n\non how to perform\
    \ the necessary installations on Windows, \n\nLinux Debian, and derivatives such\
    \ as Ubuntu and Fedora. For \n\nprogramming in C, Microchip's XC8 compiler is\
    \ used from the \n\ncommand line. In addition to the programming applications,\
    \ \n\ntwo serial read and serial write applications can be used for \n\ncommunicating\
    \ with the PICs from a computer.\n\nA voltmeter project including practical instructions\
    \ on building \n\na circuit board from scratch is included. All theory is covered\
    \ \n\nbeforehand, including how to do integer arithmetic in assembly. \n\nTwo\
    \ PICs are covered: the PIC12F1822 and the PIC16F1823. \n\nBoth can run at 32\
    \ MHz with an internal oscillator. You do \n\nnot need to buy a factory-made development\
    \ board and \n\nprogrammer. With relatively inexpensive parts including a \n\n\
    serial lead, microcontroller, a few resistors, and LEDs, you can \n\nget started\
    \ exploring embedded programming.\n\nAndrew Pratt served for \n\n25 years in the\
    \ Royal \n\nAir Force as an Aircraft \n\nTechnician. He holds a \n\nHigher National\
    \ Certificate \n\nin electrical and electronic \n\nengineering and an \n\nHonours\
    \ Degree from \n\nthe Open University. He \n\ncontinued his career \n\nworking\
    \ in industrial \n\ncontrols.\n\n**Programming the Finite State Machine**\n\n\
    **with 8-Bit PICs in Assembly and C**\n\n![](img/a08bd00952da48f769971864f33af432_187_3.png)\n\
    \nElektor International Media BV\n\nwww.elektor.com\n\nISBN 978-1-907920-92-9\n\
    \nSHARE\n\nDESIGN\n\nLEARN"
