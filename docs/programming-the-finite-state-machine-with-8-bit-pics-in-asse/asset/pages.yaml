  md: "g\n\ng\n\ny\n\n● 12\n\nthe raw byte values that it processes when running.\
    \ This machine code is first assembled \n\ninto a file called a hex on your computer.\
    \ It gets its name from the Intel Hex Format which \n\nis a file standard for\
    \ this purpose. The hex file is then written to the PIC using a combination \n\
    \nof a program on your computer and a hardware interface called a programmer.\
    \ When \n\nreferring to machine code, this is not the finite state machine but\
    \ the processor itself being \n\nreferred to as a machine.\n\nIt is possible to\
    \ write your program by typing a hex file directly into a text editor. Manually\
    \ \n\nassembling machine instructions is too time-consuming to be considered a\
    \ realistic task. \n\nTo make it easier, code is written in assembly language\
    \ where short acronyms for machine \n\ninstructions are used to produce more readable\
    \ code. The file that you type this way is the \n\nsource code and usually has\
    \ the file suffix .asm. This file is then read by the assembler \n\napplication\
    \ and written to the hex file as raw machine code.\n\nIt is generally accepted\
    \ that it is better to write your programs in a higher-level language. \n\nIf\
    \ you want to get things done quicker and with less chance of error, then this\
    \ is absolutely \n\ntrue. C language was invented to get away from the problems\
    \ of programming in assembly \n\nlanguage. This book is about finite state machines\
    \ implemented on simpler PICs. To write \n\ncode for a microcontroller, you have\
    \ to understand what is going on at the level where \n\nsoftware meets hardware.\
    \ Where C makes coding faster and easier, it also makes things \n\nmore complicated.\
    \ You don’t, however, see this extra complication: it’s taken care of by the \n\
    \ncompiler and linker. All of this gets in the way of understanding what your\
    \ code is doing. \n\nFor the PICs used in this book, there are 49 available instructions.\
    \ The ones commonly used \n\nare quickly learnable. The beauty of assembly language\
    \ is that you can see what’s going \n\non. The code you write is exactly the machine\
    \ code that goes into the PIC. Once the source \n\ncode file is finished, it is\
    \ converted to machine language by the assembler application: in \n\nour case\
    \ the program *gpasm*. The assembler reads your source code and outputs the hex\
    \ \n\nfile. The hex file is then read by another application that writes to the\
    \ PIC using some form \n\nof hardware interface. Figure 1-2 below depicts this\
    \ programming chain."
