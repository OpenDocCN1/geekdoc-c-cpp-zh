  md: "p\n\n,\n\ng\n\n● 53\n\n**Chapter 3 • Macros, Subroutines and Bank Switching\
    \ **\n\n**3.1 • Introduction**\n\nThe circuit from Chapter 2, Fig 2-9, can be\
    \ used for all of the examples in this chapter. This \n\ncircuit drives the 7-segment\
    \ LED display and the single LED using the 16F1823 PIC. \n\nYou might by now be\
    \ thinking that assembly language is just too inconvenient. It does take \n\n\
    longer to write and can be difficult to read. Take for example Fig 2-4 of the\
    \ last chapter \n\nwhere a comparison of two values was made to decide between\
    \ two courses of action in the \n\nprogram. If you are used to a higher level\
    \ language like C, it could be something like this: \n\n \n\nif (tick\\_counter\
    \ < 31)\n\n \n\n{\n\n \n\n goto S0\n\n \n\n}\n\n \n\nelse\n\n \n\n{\n\n \n\n goto\
    \ S1\n\n \n\n}\n\nEven if you have never seen this programming language before,\
    \ you would understand it. \n\nIn contrast, this is what we have. \n\n \n\n;----------Machine\
    \ States\n\n \n\nS0 ; LED on.\n\n \n\n MOVLW 31\n\n \n\n SUBWF TICK\\_COUNTER,\
    \ W ; C in STATUS is set when counter\\_on >==31.\n\n \n\n BTFSS STATUS, C ; Skip\
    \ next instruction if C in STATUS is found set.\n\n \n\n GOTO S0 ; C in status\
    \ found not set.\n\n \n\n CLRF TICK\\_COUNTER ; Reset the counter.\n\n \n\n BCF\
    \ PORTA, 2 ; Turn the LED off.\n\n \n\n \n\n \n\nS1 ; LED off.\n\n \n\n MOVLW\
    \ 91\n\nThe MOVLW 31 line is easy to follow. It is just moving the literal value\
    \ decimal 31 into the \n\nworking register. The next line, SUBWF TICK\\_COUNTER\\\
    _ON, W, means subtract the value in \n\nthe *W* register from the register *TICK\\\
    _COUNTER\\_ON* and put the result in the *W* register. \n\nThe next line makes\
    \ reading this difficult. You have to know what effect the sign of the \n\nresult\
    \ has on the carry flag *C* in the *STATUS* register and then work out if a skip\
    \ is going to \n\nhappen. Page 320 of the datasheet explains how *SUBWF* (subtract\
    \ w from f) works. This \n\ndescribes what the code example means:"
