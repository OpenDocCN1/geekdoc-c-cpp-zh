  md: "p\n\ny\n\n● 107\n\n**6.2.2 • Serial Read Program Command Line Arguments**\n\
    \nThe program *serial\\_read\\_x*, provided to read data from your PIC has some\
    \ command-line \n\narguments that can be appended to change the output, depending\
    \ on what you are using \n\nthe PIC for. There are four modes: \n\n• \n\nIn the\
    \ first with no command-line argument, the output is simply single unsigned \n\
    \nbyte values (0–255). \n\n• \n\nThe second is when *\\-h* is used, the output\
    \ is a signed short integer value (-32768 to \n\n+32767) that is derived from\
    \ reading two consecutive bytes, the first one being the \n\nmost significant\
    \ known as big-endian. \n\n• \n\nThe third is when *\\-d* is used, the output\
    \ is a signed integer value for four bytes \n\n(-2147483648 to +2147483647). \n\
    \n• \n\nThe fourth is when *\\-f* <scaling coefficient> is used, where each byte\
    \ is multiplied \n\nby a real number to be used to scale the output as we did\
    \ previously with the \n\npotentiometer input Program 4-3. Table 6-2 below should\
    \ clarify these uses. Although \n\nthe serial reader program can interpret signed\
    \ integers, we are initially outputting \n\nonly positive numbers from the additions.\
    \ Also, there is the option *\\-o* s*ome\\_filename* \n\nthat will log all outputs\
    \ to a file of your choosing. This can be done with any of the \n\nmodes.\n\n\
    **Operating System**\n\n**Program Command**\n\n*Microsoft Windows*\n\n*serial\\\
    _reader.exe \\[options\\] \\[output file name\\]*\n\n*64 Bit Linux*\n\n*sudo ./serial\\\
    _reader\\_64 \\[options\\] \\[output file name\\]*\n\n*32 Bit Linux*\n\n*Sudo\
    \ ./serial\\_reader\\_32 \\[options\\] \\[output file name\\]*\n\n**Examples below\
    \ shown for Microsoft Windows**\n\n**Command with options**\n\n**Output Format**\n\
    \n*serial\\_reader.exe*\n\n*This will output a value from 0 to 255 for each byte,\
    \ one *\n\n*value on each line.*\n\n*serial\\_reader.exe -o file\\_name*\n\n*This\
    \ will output a value from 0 to 255 for each byte, one *\n\n*value on each line\
    \ and also write the same to a file called *\n\n*file\\_name.*\n\n*serial\\_reader.exe\
    \ -h*\n\n*This will output a value from -32768 to +32767 for each *\n\n*pair of\
    \ bytes the first byte being the most significant, one *\n\n*value on each line.*\n\
    \n*serial\\_reader.exe -h -o file\\_*\n\n*name*\n\n*This will output a value from\
    \ -32768 to +32767 for each *\n\n*pair of bytes the first byte being the most\
    \ significant, one *\n\n*value on each line and also write the same to a file\
    \ called *\n\n*file\\_name.*\n\n*serial\\_reader.exe -d*\n\n*This will output\
    \ a value from -2147483648 to *\n\n*+2147483647 for each three bytes the first\
    \ byte being *\n\n*the most significant, one value on each line.*\n\n*serial\\\
    _reader.exe -d -o file\\_*\n\n*name*\n\n*This will output a value from -2147483648\
    \ to *\n\n*+2147483647 one value on each line and also write the *\n\n*same to\
    \ a file called file\\_name.*"
