    \ 2 ; Turn LED on.\n\n GOTO S0 ; Back to state 0.\n\n;----subroutine DELAY\\_OUTER\n\
    \nDELAY\\_OUTER\n\n CALL DELAY\\_INNER\n\n DECFSZ BUFFER0, F\n\n GOTO $-2\n\n\
    \ RETURN ;return to main program\n\n;---subroutine DELAY\\_INNER\n\nDELAY\\_INNER\n\
    \n DECFSZ BUFFER1, F\n\n GOTO $-1\n\n RETURN ; Return to the DELAY\\_OUTER subroutine.\n\
    \n END\n\n**3.4 • Bank Switching**\n\nIn Chapter 1 paragraph 1.3.6, I stated that\
    \ in instructions that point to a special function \n\nregister, for example,\
    \ bit clear file *BCF*, there are only seven bits allocated for the address \n\
    \nof the register. This means that we can only point to an address range of 0\
    \ to 127 (128 \n\nlocations). To get the necessary special function register,\
    \ we need a way to point to the \n\nrequired bank. If you look at page 22 in the\
    \ datasheet you can see that *PORTA* in bank 0 \n\nis next to *TRISA* in bank\
    \ 1. *PORTA* is at address 07Ch. *TRISA* is at 08Ch. These addresses \n\nare expressed\
    \ in hexadecimal. They are two special function registers with the same offset\
    \ \n\nin their own bank. To get the correct bank, we have to put that information\
    \ into the bank \n\nselect register. *BSR* is always accessible as it is one of\
    \ the 12 core registers appearing in \n\nall banks.\n\nProgram 3-5 Example of\
    \ Calling a Subroutine from a Subroutine"
