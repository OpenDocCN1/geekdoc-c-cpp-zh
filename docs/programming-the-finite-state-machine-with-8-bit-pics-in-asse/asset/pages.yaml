  md: "g\n\ng\n\ny\n\n● 86\n\n![](img/a08bd00952da48f769971864f33af432_85_0.png)\n\
    \nFigure 4-11 shows the state diagram for the program. The program remains in\
    \ state 0 \n\nwhile the switch is open and moves to state 1 if it closes. On transition,\
    \ the pulse counter \n\nis incremented by 1 and the value transmitted. The machine\
    \ remains in state 2 until the \n\nswitch opens again when it then transitions\
    \ to state 0.\n\n![](img/a08bd00952da48f769971864f33af432_85_1.png)\n\nThe program\
    \ below has comments on almost every line.\n\nBy running the serial read program,\
    \ you can see the counts incrementing every time you \n\nclose the switch. Depending\
    \ on the switch you are using, there might be a problem though. \n\nIf you are\
    \ just touching a wire end to use as a switch, the problem will be very pronounced.\
    \ \n\nThis is the problem of switch bounce. Switch bounce is when the switch does\
    \ not close or \n\nopen cleanly and bounces several times. The PIC is fast enough\
    \ to count the bounces, so \n\nFigure 4-10 Circuit for Program 4-5\n\nFigure 4-11\
    \ State Diagram for Program 4-5"
