  md: "g\n\ng\n\ny\n\n● 68\n\ncan be regarded in this case as bits per second. We\
    \ will use a rate of 19200 Baud. The bytes \n\nthat are sent along the wire are\
    \ made up of a leading start bit, 7 or 8 data bits, a parity \n\nbit and then\
    \ 1 or 2 stop bits. The programs presented here will not use the parity bit, have\
    \ \n\none stop bit and 8 data bits. This is configured by setting values in registers\
    \ then *EUSART *\n\nwill transmit values whenever a byte is loaded into the *TXREG*\
    \ register. Once configured, \n\nsending data requires only a couple of lines\
    \ of code each time.\n\n \n\n**4.2.2 • Configuring the EUSART to Transmit a Byte**\n\
    \nThe datasheet gives a full description of the Enhanced Universal Synchronous\
    \ Asynchronous \n\nReceiver Transmitter that is in both PICs. There are many more\
    \ accessible features than \n\nI will use. Page 268 shows a diagram of the transmit\
    \ details. Table 4-1 shows the steps \n\nnecessary to configure *EUSART* to transmit\
    \ bytes.\n\n**Purpose**\n\n**Code**\n\n**Comments**\n\n*Enable transmission.*\n\
    \n*BSF TXSTA, TXEN *\n\n*TXEN is bit 5 in the transmit *\n\n*status and control\
    \ register *\n\n*TXSTA (page 277 in the *\n\n*datasheet).*\n\n*Enable the serial\
    \ port.*\n\n*BSF RCSTA, SPEN *\n\n*SPEN is bit 7 in the receive *\n\n*status and\
    \ control register *\n\n*(page 278).*\n\n*Set up a baud rate of 19200 *\n\n*by\
    \ setting the values in *\n\n*the serial port baud rate *\n\n*generator registers*\n\
    \n*SPBRGL (low order byte) and *\n\n*SPBRGH (high order byte), *\n\n*these make\
    \ up a 16-bit *\n\n*word.*\n\n*MOVLW 0x19 *\n\n*MOVWF SPBRGL*\n\n*CLRF SPBRGH*\n\
    \n*Baudrate = clock/(64\\*(sp-*\n\n*brgh:spbrgl+1))*\n\n*Baudrate = 19200*\n\n\
    *(page 280 and 282).*\n\n*On the PIC 16F1823 the *\n\n*transmit pin can be either\
    \ *\n\n*pin 13 (RA0) or pin 6 (RC4), *\n\n*we want pin 13.*\n\n*BSF APFCON, TXCKSEL*\n\
    \n*Set bit 2 in APFCON *\n\n*(alternate pin function *\n\n*configuration) to make\
    \ the *\n\n*transmit pin RA0*\n\n*(page 114).*\n\nThis configuration of EUSART\
    \ for this purpose has been made into a macro as follows. This \n\nmacro is for\
    \ use at 32 Mhz:\n\nTable 4-1 Conﬁguring EUSART to Transmit"
