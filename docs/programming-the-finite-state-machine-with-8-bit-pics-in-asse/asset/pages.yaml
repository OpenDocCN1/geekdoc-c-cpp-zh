  md: "p\n\n● 183\n\n**10.5.2 • Turning Bits On and Off Using Bitwise Operators **\n\
    \nAnother way of changing individual bits is to use bitwise logic and bitmasks.\
    \ Suppose we \n\ntake an eight-bit variable *var* and want to turn bit 2 on, leaving\
    \ the others unchanged. The \n\nway to do this is to bitwise OR the byte with\
    \ a mask where all the bits are off except for \n\nthe one to be turned on. Let\
    \ the state of the flags byte *var* be B'01100001', the table below \n\nshows\
    \ the bitwise OR with the mask B'00000100'. In the code, this would be written\
    \ in hex \n\nas 0x04.\n\n \n\nvar = var | 0x04; // | is the bitwise OR in C.\n\
    \n*OR*\n\n*Bit 7*\n\n*Bit 6*\n\n*Bit 5*\n\n*Bit 4*\n\n*Bit 3*\n\n*Bit 2*\n\n*Bit\
    \ 1*\n\n*Bit 0*\n\n*var*\n\n*0 *\n\n*1*\n\n*1*\n\n*0*\n\n*0*\n\n*0*\n\n*0*\n\n\
    *1*\n\n*mask*\n\n*0*\n\n*0*\n\n*0*\n\n*0*\n\n*0*\n\n*1*\n\n*0*\n\n*0*\n\n*result*\n\
    \n*0*\n\n*1*\n\n*1*\n\n*0*\n\n*0*\n\n*1*\n\n*0*\n\n*1*\n\nThe assignment assigns\
    \ the result of the bitwise OR to var changing that bit. \n\nTo turn it off is\
    \ not so obvious. Again we need a mask and bitwise operator that changes \n\n\
    the bit we want to change but leaves all others as they are. This can be achieved\
    \ by using a \n\nbitwise AND where the mask is made up of 1s in the positions\
    \ where the bits are not going \n\nto change and a 0 in the position where the\
    \ bit is to be turned off. To produce the required \n\nmask, take a byte with\
    \ the bit in the position you want to change. Set to 1, that is in this \n\nexample\
    \ B'00000100' and invert the bits to give B'11111011'. There is an operator ~\
    \ does \n\nthis. The code to turn off bit 2 is this.\n\n \n\nvar = var & ~0x04;\n\
    \n*AND*\n\n*Bit 7*\n\n*Bit 6*\n\n*Bit 5*\n\n*Bit 4*\n\n*Bit 3*\n\n*Bit 2*\n\n\
    *Bit 1*\n\n*Bit 0*\n\n*var*\n\n*0 *\n\n*1*\n\n*1*\n\n*0*\n\n*0*\n\n*1*\n\n*0*\n\
    \n*1*\n\n*mask*\n\n*1*\n\n*1*\n\n*1*\n\n*1*\n\n*1*\n\n*0*\n\n*1*\n\n*1*\n\n*result*\n\
    \n*0*\n\n*1*\n\n*1*\n\n*0*\n\n*0*\n\n*0*\n\n*0*\n\n*1*\n\n**10.5.3 • Turning Bits\
    \ On and Off Using Bitfields**\n\nStandard C also has the bitfield that allows\
