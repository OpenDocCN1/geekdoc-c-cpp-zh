  md: "p\n\ny\n\ng\n\n● 35\n\nwe get the bits for *OPTION\\_REG* to be 11010111. This\
    \ is summarized in Table 2-2.\n\n**OPTIONS\\_REG**\n\n*D*\n\n*7*\n\n*1*\n\n*Left\
    \ at default. *\n\n*6*\n\n*1*\n\n*Left at default. *\n\n*5*\n\n*0*\n\n*Timer0\
    \ clock select (TMR0CS) Fosc/4.*\n\n*4*\n\n*1*\n\n*Left at default.*\n\n*7*\n\n\
    *3*\n\n*0*\n\n*Prescaler assignment PSA to TMR0.*\n\n*2*\n\n*1*\n\n*Prescaler\
    \ set to 1:256.*\n\n*1*\n\n*1*\n\n*0*\n\n*1*\n\nThe code to set *OPTION\\_REG*\
    \ is going to be: \n\n \n\nMOVLW 0xD7 ;Move (copy) 0xD7 to W (working register)\
    \ \n\n \n\nMOVWF OPTION\\_REG ;Move (copy) W to OPTION\\_REG  \n\nWe now have\
    \ a frequency of 32Mhz divided initially by 4 then by 256 by the Prescaler \n\n\
    presenting a frequency of 31.25kHz to be counted by *TMR0*. \n\n32000000/(4 x\
    \ 256) = 31250.0\n\nIf *TMR0* starts from 0, it will overflow after it has counted\
    \ 256 cycles as it is an 8-bit register. \n\nIt will take 256/31250 seconds to\
    \ overflow: that is 0.008192 seconds or 8.192ms.\n\nStated another way, it will\
    \ overflow at a frequency of 1/0.008192Hz or 122.07Hz. The next \n\nparagraph\
    \ will show how to catch the points in time when the overflow of *TMR0* occurs.\n\
    \n**2.4 • Interrupts**\n\nSuppose you are working on something but you have arranged\
    \ to meet someone at eleven \n\no’clock. How can you be sure you are not going\
    \ to miss the appointment? One way is to \n\nkeep checking your watch to see what\
    \ the time is. This is called polling where the value of \n\nsomething is repetitively\
    \ read. This method is often used in software but can be a wasteful \n\nuse of\
    \ resources if the polling has to be frequent. Another way of ensuring that you\
    \ get to \n\nyour appointment on time is to set an alarm on your watch to tell\
    \ you it’s time to go. When \n\nyou hear the alarm, you stop work, go to your\
    \ appointment and then return to work. The \n\nPIC can be programmed to respond\
    \ to events that can interrupt the program, do something \n\nelse, and then return\
    \ to what it was doing.\n\nMany events can be used as interrupt sources: a timer\
    \ overflow being one of them. There \n\nare a few things that have to be done\
    \ to use an interrupt. The first example here will \n\nTable 2-2 Example Bit Settings\
    \ for OPTIONS\\_REG"
