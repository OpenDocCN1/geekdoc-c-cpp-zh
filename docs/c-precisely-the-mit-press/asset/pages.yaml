  md: '# 9.3 Class Array


    All types are derived from class Array, and the members of an array type are inherited
    from class Array. Let be a reference of array type, o an object of any type, and
    i, il, ..., in integers:


    +   - Length of type int is the length of a, that is, the total number of elements
    in a, if a is one-dimensional or a rectangular multidimensional array, or the
    number of elements in the first dimension of a, if a is a jagged array

    - Rank of type int is the rank of a (sections 5 and 9.2.2)

    - GetEnumerator() of type IEnumerator is a non-generic enumerator (section 27.2)
    for iterating through a. This enables the foreach statement to iterate over an
    array (section 13.6 and other 40). If a is a one-dimensional array of type t[],
    one can get a type-safe enumerator of type IEnumerator by computing (IList<t>).GetEnumerator()

    - Length(i) of type int is the number of elements in dimension i (examples 27
    and 39)

    - SetValue(o,il,...,in) of type void performs the same assignment as a[i,...,in]
    = o when a has rank n; and GetValue(i,...,in) returns the same as a[i,...,in].
    More precisely, if a[i,...,in] has reference type, then GetValue returns the same
    reference; otherwise it returns a boxed copy of the value of a[]

    - Equals(o) of type bool returns true if a and o refer to the same array object,
    otherwise false.


    Class Array provides static methods, which are listed below. These methods can
    be used in ordinary array types [t] which derive from class Array. The methods
    throw ArgumentNullException if the given array is null, and RankException if a
    is not one-dimensional.


    +   - static BinarySearch(Array a, Object k) searches the one-dimensional array
    for a k using binary search. Returns an index i for which a[i].CompareTo(k) =
    0; otherwise i<0 such that -i would be the proper position for k. The array must
    be sorted, by Sort(a), or the result is undefined; and elements must implement
    IComparable

    - static BinarySearch(Array a, IComparer cmp) works similarly, but compares array
    elements using the cmp.Compare method (section 27.3). The array must be sorted,
    by Sort(cmp), or the result is undefined.

    - static void Reverse(Array a, int i, int n) reverses the elements of a[i..(i+n-1)].

    - static void Sort(Array a, IComparer cmp) sorts the one-dimensional array using
    a quicksort, comparing array elements using their CompareTo method (section 27.3).
    The array elements must implement IComparable. The sort is not stable; elements
    that equal may be swapped.

    - static void Sort(Array a, int i, int n) works similarly but sorts a[i..(i+n-1)].

    - static void Sort(Array a, int i, int n, IComparer cmp) sorts a[i..(i+n-1)] using
    cmp.Compare.'
