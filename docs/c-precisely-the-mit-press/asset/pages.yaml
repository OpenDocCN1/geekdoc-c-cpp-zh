  md: 'Task Parallel Library (C# 4.0)


    # 22 Task Parallel Library (C# 4.0)


    The Task Parallel Library is implemented by several types in namespace System.Threading.Tasks.


    # 22.1 Class Parallel


    Static class Parallel in namespace System.Threading.Tasks


    +   * staticParallelLoopResult For(int m, int n, Action<int> body) executes body(m),
    body(m+1),....(n-1), possibly concurrently and out of order. Blocks until all
    calls complete; does nothing if m>=n.

    * staticParallelLoopResult For(int m, int n, Action<int, LoopState> body) executes
    body(m, loopState), body(m+1, loopState)....(n-1, loopState), possibly concurrently
    and out of order. A delegate i(loopState).Break(i) to signal that no iterations
    beyond the i/th are needed, or call loopState.Stop() to signal that no further
    iterations are at all. In some cases further iterations may be performed. Note
    that the loopState object of class ParallelLoopState is created by the For method.


    For overload exists, for taking long instead of bounds, taking parallel options,
    and for creating thread-local state. See the .NET library documentation for details.


    +   * staticParallelLoopResult ForEach<T>(IEnumerable<T> xs, Action<T> body) executes
    body(x1).body(x2)....for all elements x1, x2.... of xs, possibly and out of order.


    ForEach overload exists, for Action delegates that take a parallel loop argument,
    taking parallel options, and for creating thread-local state. See the .NET library
    documentation.


    +   * static void Invoke(params Action[] acts) calls the delegates in array acts,
    possibly and out of order. Also overloaded to take a parallel options argument.


    +   * Read-only property bool IsCompleted is true if all iterations were performed;
    otherwise false.

    * Read-only property length? LowestBreakIteration returns the index of the lowest
    iteration from Break(i) was called, if it was null.


    When multiple iterations of a parallel loop need to update the global resource,
    they must lock the resource (section 21.2). For instance, for the Parallel.For
    in example 170 were to retrieve the results in an array list results, rather than
    in distinct array, then the loop must lock the array while adding to it (but not
    while performing the computation):


    ```

    i => { String res = NcbProtein(ids[i]);

    lock (results) results.Add(res); };

    ```


    This approach is safe to prevent excess locking because some or all iterations
    may be performed on the same thread. Further overloads of For and ForEach provide
    ways to introduce thread-local resources and thereby save some locking. See the
    .Net library documentation.'
