  md: "# Generic Types and Methods 173\n\nExample 207 Generic Quicksort Using a Compar\
    \ Object\nThis method sorts an array of T[] where T is a type parameter. A parameter\
    \ of type IComparer<T> determines the element ordering (section 27.3 and example\
    \ 224).\n\n```\nprivate static void Quicksort<T>(T[] arr, IComparer<T> comp, int\
    \ a, int b) {\n    if (a < b) {\n        int i = a, j = b;\n        T x = arr[(i\
    \ + j) / 2];\n        do {\n            while (comp.Compare(arr[i], x) < 0) i++;\n\
    \            while (comp.Compare(x, arr[j]) < 0) j--;\n            if (i < j)\
    \ {\n                T temp = arr[i]; arr[i] = arr[j]; arr[j] = temp;\n      \
    \          i--;\n            }\n        } while (i <= j);\n        Quicksort(arr,\
    \ comp, a, j);\n        Quicksort(arr, comp, i, b);\n    }\n```\n\nExample 208\
    \ Generic Quicksort for Comparable Values\nThis method sorts an array of T[] whose\
    \ elements of T must be comparable to themselves. This is expressed by the method's\
    \ parameter constraint, as in example 203.\n\n```\nprivate static void Quicksort<T>(T[]\
    \ arr, int a, int b) {\n    where T : IComparable<T> {\n        ...\n        while\
    \ (arr[i].compareTo(x) < 0) i++;\n        while (x.compareTo(arr[j]) < 0) j--;\n\
    \    }\n```\n\nExample 209 A Generic Method in a Generic Class\nThe generic class\
    \ LinkedList<T> (example 200) can be equipped with a generic method Map<U> that\
    \ takes an additional type parameter U and returns a new list of type LinkedList<U>.\
    \ The generic interface IList<T> is defined in example 205, and the generic delegate\
    \ Func<T,U> is defined on page 122.\n\n```\npublic class LinkedList<T> : IList<T>\
    \ {\n    ...\n    public IList<U> Map<U>(Func<T, U> f) { // Maps f over all elements\n\
