    ```\n\n# Example 53 Method Overriding\n\nIn the vessel hierarchy (example 45),\
    \ the classes Tank and Barrel override the method ToString inherited\nfrom the\
    \ universal base class Object, and class Cube overrides inherited from class Tank.\n\
    \n# Example 54 Parameter Arrays and Overloading\n\nThis example declares three\
    \ overloads of the method Max, including one with a parameter array (params).\n\
    When the params overload is called, the first argument will be bound to parameter\
    \ xr of Max, and all\nremaining arguments will be stored in a new array, bound\
    \ to the parameter xr. Example 95 shows several\nto these methods. Example 149\
    \ demonstrates a parameter array in an indexer.\n\n```\npublic static int Max(int\
    \ a, double b) {\n    return a > b ? a : (int)b;\n}\n\npublic static int Max(int\
    \ a, int b, int c) {\n    a = a > b ? a : b;\n    return a > c ? a : c;\n}\n\n\
    public static int Max(int xo, params int[] xr) {\n    foreach (int i in xr) {\n\
    \        if (i > xo)\n            xo = i;\n    }\n    return xo;\n}\n```"
