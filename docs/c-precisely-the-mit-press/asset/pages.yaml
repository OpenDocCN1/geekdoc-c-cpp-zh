  md: '# 25.10 Network Communication


    A pair of distinct processes may communicate through sockets. The processes may
    be on the same machine or on different machines connected by a network.


    Sockets are often used in client/server architectures, where the server process
    creates a server socket that listens for connections. When a client connects to
    the server socket, a fresh socket is created on the server side and is connected
    to the client used when connecting to the server. The socket connection is used
    for bidirectional communication between client and server; both ends can obtain
    a stream that can be written to and read from.


    Here are a constructor and some methods from the Class in namespace System.Net.Sockets:


    +   * Socket(AddressFamily af, SocketType st, ProtocolType pt) creates a server
    socket of the specified kind.

    * void Listen(int queue) transfers the socket to listening mode.

    * void Accept(EndPoint ep) listens for a connection, blocking until a connection
    is made. Creates returns a new Socket when a connection is made. Throws SocketException
    if the socket is not in listening mode.

    * void Bind(EndPoint ep) binds the socket to a given end point ep (network address
    and port number) which may be an IPPoint expression (example 196).

    * void Close() closes the socket.

    * Read-only property RemoteEndPoint returns the remote end point to which this
    socket is connected.

    * int Send(byte[] b) and int Receive(byte[] b) are used to send data to and receive
    data from the socket.


    Although it is possible to communicate using only Sockets, it is usually preferable
    to wrap a Socket in a NetworkStream and communicate through that either binary
    or character format.


    Class NetworkStream (from namespace System.Net.Sockets) is a subclass of abstract
    class Stream (section 25.7); it further contains the following constructor and
    property:


    +   * NetworkStream(Socket s) creates a new stream associated with socket s.

    * Read-only property DataAvailable indicates whether data are available to read
    from the stream.'
