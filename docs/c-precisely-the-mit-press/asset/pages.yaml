  md: "# 10.9 Extension Methods (C# 3.0)\n\nAn extension method is a non-virtual instance\
    \ method declared outside the type to which it belongs. An extension method must\
    \ be declared in a non-generic static class (section 10.2) using this syntax:\n\
    \n```\nstatic class CExtensions {\n    access-modifier retype M(this C variable-name,\
    \ formal-list)\n    method-body\n    ...\n}\n```\n\nNote this keyword before the\
    \ first parameter, whose type C determines the class (or interface or delegate\
    \ type) to which it belongs. The extension method can be called using instance\
    \ method syntax o.M(...) or as an instance of compile-time type C. This is just\
    \ syntactic sugar for the static method call CExtensions.M(o, ...). Unlike for\
    \ normal methods, the receiver o and the extension method's first parameter, may\
    \ be null.\n\nThe purpose of the instance method syntax is to pretend that the\
    \ extension method had been declared in type C like this:\n\n```\naccess-modifier\
    \ retype M(formal-list)\n    method-body\n```\n\nAn extension method can access\
    \ only public or internal members of the type on which it is defined. An extension\
    \ method defined on a class or interface is very similar to a non-virtual instance\
    \ method. However, in call s.M() to an extension method M defined on a struct\
    \ type, the instance s will be copied when passed to M, whereas a real instance\
    \ method defined in the struct would be called on itself.\n\nThe scope of an extension\
    \ method is the nearest namespace in which it is defined and any scope that imports\
    \ namespace via a using declaration (section 29.1).\n\nWhen resolving a method\
    \ call in namespace syntax o.M(), real instance methods are preferred over extension\
    \ methods, extension methods available in inner namespace declarations are preferred\
    \ over extension methods, methods declared directly in a namespace are preferred\
    \ over extension methods imported by a using directive.\n\nIEnumerable<T> from\
    \ System.Collections.Generic has extension methods (section 28.5), declared in\
    \ static class System.Linq.Enumerable. For those extension methods to be usable\
    \ in a source file, it must contain the using declaration System.Linq.\n\nThere\
    \ is no concept of \"extension property\" or \"extension indexer\".\n\n# 10.10\
    \ Optional or Default-Value Method Parameters (C# 4.0)\n\nIn the formal-list of\
    \ a method declaration (section 10.7), constructor declaration (section 10.11),\
    \ or indexer declaration (section 10.16), a parameter may be optional by giving\
    \ a default value for it:\n\n```\ntype parametername = constant\n```\n\nIn calls,\
    \ the argument corresponding to an optional parameter may be left out (section\
    \ 12.17.7), which is convenient for rarely used arguments and can reduce the temptation\
    \ to introduce a large number of overloads. The default value must be a compile-time\
    \ constant. A ref parameter, an out parameter or a parameter array cannot have\
    \ a default value. An optional parameter must follow all required parameters."
