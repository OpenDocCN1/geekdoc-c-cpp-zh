  md: "# 26.8 Generic Delegate Types\n\nA declaration of a generic delegate D<T1,...,Tn>\
    \ has one of these forms:\n\n```\ndelegate-modifiers rentype delegate D<T1,...,Tn>(formal-list);\n\
    delegate-modifiers rentype delegate D<T1,...,Tn>(formal-list)\n  where parameter-constraints;\n\
    ```\n\nThe delegate-modifiers, rentype, and formal-list are as for non-generic\
    \ delegates (section 17), except that the type parameters T1,...,Tn may be used\
    \ in the rentype and formal-list.\nThe parameter-constraints are as for generic\
    \ classes (section 26.4). The type parameters of a generic delegate type can have\
    \ co- and contravariant modifiers out and in (section 26.12).\n\n# 26.9 Abbreviations\
    \ for Constructed Types\n\nWith the using directive one can introduce abbreviations\
    \ for constructed types, which may otherwise become verbose. The relevant form\
    \ of the using directive (section 29.1) is this one:\n\n```\nusing T = t;\n```\n\
    \nwhere T is a name. The right-hand side t is a type, possibly involving types\
    \ constructed from generic types. A using directive can appear only at the beginning\
    \ of a compilation unit or a namespace declaration (section 29), not inside classes,\
    \ interfaces, or struct types.\nA using directive does not affect other directives\
    \ in the same namespace. Thus although a using directive can make type aliases\
    \ in method headers and declarations more readable, the using directives themselves\
    \ can become rather unwise.\n\nFor instance, assume one wants to introduce a type\
    \ alias Set<int> and a type alias IntSet2 for the Dictionary<Set<int>,int> in\
    \ this program:\n\n```\nusing System.Collections.Generic;\nclass Nfa {\n  static\
    \ List<int> Rename(IDictionary<Set<int>,int> renamer,\n    IList<Set<int>> states)\
    \ { ... }\n}\n```\n\nThen the right-hand side of using directives must use the\
    \ full type paths, like this:\n\n```\nusing Set = Set<int>; // Type abbreviation\n\
    using IntSet2 = System.Collections.Generic.IDictionary<Set<int>,int>;nclass Nfa\
    \ {\n  static List<int> Rename(IntSet2 renamer, List<int> states) { ... }\n}\n\
    ```\n\nIn particular, the definition of IntSet2Int, the System.Collections.Generic\
    \ prefix is needed, and Set<int> cannot be replaced by IntSet. One solution to\
    \ this problem would be to artificially introduce nested namespace declarations:\
    \ a using directive in an outer namespace does affect directives in inner namespaces.\
    \ But this is not recommended."
