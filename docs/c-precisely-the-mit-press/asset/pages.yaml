    \ Run-Time Checks and Wrapping of Values\nThe legacy non-generic ArrayList cool\
    \ should only contain Person objects, but without generic types, the compiler\
    \ cannot check that only Person objects are added to cool. Hence at run-time the\
    \ program must check and cast objects when extracting them from the list. These\
    \ checks take time, and may fail.\n\n```\nSC.ArrayList cool = new SC.ArrayList();\
    \ // needs SC = System.Collections;\ncool.add(new Person(\"Kristen\"));\ncool.add(new\
    \ Person(\"Bjarne\"));\ncool.add(new Exception(\"Larry\"));\ncool.add(new Person(\"\
    Anders\"));\nPerson p = (Person)cool[2]; // Wrong, but no compile-time check\n\
    ```\n\nExample 198 Using Generic Array List: Compile-Type Checks, Wrapping of\
    \ Values\nWith generic types, cool can be declared to have type SC.Collections.List<Person>,\
    \ the compiler can check that only Person objects are added to the cool.add, and\
    \ therefore the list can contain only Person objects. At run-time there is no\
    \ need to check and cast objects when extracting from the list. Generic types\
    \ improve speed and safety of the program.\n\n```\nList<Person> cool = new List<Person>();\n\
    cool.add(new Person(\"Kristen\"));\ncool.add(new Person(\"Bjarne\"));\ncool.add(new\
    \ Exception(\"Larry\"));\ncool.add(new Person(\"Anders\"));\nPerson p = cool[2];\
    \ // Wrong, detected at compile-time needed\n```\n\n# Example 199 A Generic Class\
    \ for Logging\n\nGeneric class Log<T> is similar to class Log (example 66), but\
    \ can log any type of object, not just strings. The use of default(T) instead\
    \ of null in the Last property; null is not a result of error when Last is initialized\
    \ with a value type. Compare also the automatically implemented properties (section\
    \ 10.15) InstanceCount and Count with the one in example 66.\n\n```\npublic class\
    \ Log<T> {\n    private const SIZE = 5;\n    public static int InstanceCount {\
    \ get; private set; } // Auto-implemented property\n    public int Count { get;\
    \ private set; } // Auto-implemented property\n    private T[] log = new T[SIZE];\n\
    \    public Log() { InstanceCount++; }\n    public void Add(T msg) { log[Count\
    \ % SIZE] = msg; }\n    public T Last {\n        return Count==0 ? default(T)\
    \ : log[Count-1]%SIZE];\n    }\n    set { ... }\n}\n    public T[] All { ... }\n\
    }\n...\nLog<DateTime> log2 = new Log<DateTime>();\nlog2.Add(DateTime.Now);\n```\n\
