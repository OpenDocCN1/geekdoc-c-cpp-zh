  md: "# Example 196 Socket Communication between Processes\n\nThis program runs as\
    \ a server process or as a client machine, depending on the first command line\
    \ argument. The server and client may run on the same machine, or on machines\
    \ communicating via a network. Several clients may connect to the same server.\
    \ The server creates a socket that accepts connections on port 2357. When a client\
    \ connects, a new socket is created and an integer is received on that socket.\
    \ If the integer is a prime, the server replies true on that, otherwise others\
    \ are false. Each client process asks about the primality of numbers 1 through\
    \ 99 and those that are primes. For simplicity the client creates a new socket\
    \ for every request to the server, but this is inefficient.\n\n```\nusing System.Net;\n\
    using System.Net.Sockets;\n// BinaryReader, BinaryWriter\n// AddressFamily, Dns,\
    \ IPAddress, ProtocolType, ...\n// NetworkStream\nclass SocketTest {\n    const\
    \ int Port = 2357;\n    public static void Main(string[] args) {\n        bool\
    \ server = (args.Length == 1 && args[0] == \"server\");\n        bool client =\
    \ (args.Length == 2 && args[0] == \"client\");\n        if (server) // Server:\
    \ accepts queries about primality\n            Socket socket = new Socket(AddressFamily.InterNetwork,\
    \ ProtocolType.Tcp);\n            socket.bind(new IPEndPoint(IPAddress.Any, Port));\n\
    \            socket.listen(10); // Max queue queue = 10 connections.\n       \
    \     for (;;) // Forever, accepts connections\n                NetworkStream\
    \ s = new NetworkStream(socket.Accept());\n                BinaryReader reader\
    \ = new BinaryReader(s);\n                BinaryWriter writer = new BinaryWriter(s);\n\
    \                int number = reader.ReadInt32();\n                writer.Write(IsPrime(number));\n\
    \                input.Close(); socket.Close();\n    } else if (client) // Client:\
    \ ask queries about primality\n        IPAddress ip = Dns.Resolve(args[1]).Address[0];\n\
