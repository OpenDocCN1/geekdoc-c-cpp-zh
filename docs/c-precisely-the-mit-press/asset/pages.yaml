  md: '132 Threads, Concurrent Execution, and Synchronization


    # 21.2 Locks and the lock Statement


    Concurrent threads are executed independently. Therefore, when multiple threads
    access the same fields or array elements, there is danger of creating an inconsistent
    state (example 165). To avoid this, threads may synchronize the shared state,
    such as objects and arrays. A single lock is associated with every object, array,
    and class. A lock can be held by one thread at a time. A thread may explicitly
    request a lock by executing a lock statement, which has this form:


    ```

    lock (expression)

    block-statement

    ```


    The expression must have reference type. The expression must evaluate to a non-null
    reference o; otherwise a NullReferenceException is thrown. After the evaluation
    of the expression, the thread begins Locking on object o (see page 131). When
    the thread holds the lock on object o (if ever), the thread becomes blocked and
    may returning until the block-statement terminates or is exited by return or continue
    or goto or by throwing an exception, then the lock on o is released.


    That is, the thread will execute the block-statement only when it has obtained
    the lock on the current object. It will hold the lock until it leaves the block-statement,
    and release it. Moreover, it may temporarily release the lock by calling Monitor.Wait(o);
    see below and section 21.3.


    When one or more static methods of a class C must ensure exclusive access to static
    fields, they can obtain the lock on the unique object of class Type that represents
    class C in the run-time system. This object is obtained by evaluating typeof(C).
    Hence the critical sections may be enclosed in a lock statement as this:


    ```

    lock (type(C))

    block-statement

    ```


    That is, the thread will execute the method body only when it has obtained the
    lock on the returned object by typeof(C), which is the unique object of class
    Type associated with class C; see section 12.21.


    Mutual exclusion is ensured only if all threads accessing the shared object make
    sure to hold the lock for instance. if an unsynchronized method RogueTransfer
    were added to a bank object (example 165), one can no longer be that a thread
    calling the synchronized method Transfer has exclusive access to the bank object;
    many of threads could be calling RogueTransfer at the same time.


    A monitor is object whose fields are private and manipulated only after obtaining
    the object''s lock, that all field is subject to synchronization (example 166).


    If a thread needs to wait for some condition, or for a resource to become available,
    it may temporarily release the lock by calling Monitor.Wait(o). The thread must
    hold the lock on object o, otherwise SynchronizationAccessException is thrown.
    The thread will be added to the wait set of o, that is, the thread waiting for
    notification on o. This notification must come from some other of thread that
    has obtained the lock on o and executes Monitor.Pulse(o) or Monitor.PulseAll(o).
    The notifying thread does not release its lock on o. After being notified, u must
    obtain the lock on o again before can proceed. When the call to Monitor.Wait returns,
    thread u will hold the lock on o just as before the call (example 166).


    *'
