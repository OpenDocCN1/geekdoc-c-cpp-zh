  md: '54 Classes


    # 10.17 Operator Overloading


    Some of the operators listed on page 61 can be overloaded in a user-defined type
    (class or struct) t. No new operator symbols can be defined, and the precedence
    of existing operators cannot be changed. An operator declaration must have one
    of these forms, as the operator is binary or unary:


    ```

    public static returntype operator operator-symbol(formal, formal)

    method-body

    ```


    ```

    public static returntype operator operator-symbol(formal)

    method-body

    ```


    The returntype cannot be void. The operator is an overloadable operator. The formal
    parameters are as for a method declaration (section 10.7) but cannot be ref or
    out. The method-body is in section 10.7. A class inherits the operator declarations
    of its base class. A struct cannot contain two operator declarations with the
    same signature. An operator declaration must follow these rules:


    +   * When overloading a binary operator + - / & | ^ = != > <= in t, at least
    one argument must have type t. When overloading a shift operator << >>, the first
    argument must have type t and the second argument must have type int.

    * When overloading a unary operator in type t, these arguments and result are
    permitted:


    | Operators | Argument Type | Result Type |

    | --- | --- | --- |

    | + - | t | Any |

    | ++ -- | t | t |

    | true false | | bool |

    * There can be only one definition of the unary increment (++) and decrement (--)
    operators in a type. The same definition is used for prefix (++x) as well as postfix
    (x++) applications.


    +   * Some operators go together in pairs; either none of them or both must be
    overloaded:


    | Operator | Operator | Comment |

    | --- | --- | --- |

    | true false | |

    | == != | Methods Equals and GetHashCode must be overridden also |

    | < | |

    | <= >= |


    +   * When a binary operator (say, +) is overloaded, the corresponding assignment
    operator (+=) is automatically overloaded also (example 145).

    * The operators =, &, |, ,, ?, and ? cannot be overloaded. A compound assignment
    operator (such as +=) can be overloaded only by overloading the corresponding
    binary operator (such as +).

    * When any of the operators & or | is overloaded, the operators true and false
    must be overloaded also, and the corresponding sequential conditional && || is
    automatically overloaded.


    Operator overloading is illustrated by examples 68, 145, and 200.'
