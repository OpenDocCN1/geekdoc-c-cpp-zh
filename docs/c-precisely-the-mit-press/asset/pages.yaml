  md: '# Expressions


    # 12.5 Bitwise Operators and Shift Operators


    The operators ~ (bitwise complement) and & (bitwise exclusive-or) and | (bitwise
    or) may be used on operands of enum type or integer type. The operators work in
    parallel on all of the operands and never cause overflow, not even in a checked
    context. The complement representation is used for signed integer types, so ~n
    equals -(n-1) and also equals (-1) n.


    The shift operators << and >> shift the bits of the two''s complement representation
    of the first argument; they never cause overflow, not even in a checked context.
    The two operands are promoted (section 12.1) separately, and the result is the
    type of the first argument.


    This shift operation is always performed on a 32-bit (int or uint) or a 64-bit
    (Long or along) value. In the first case, the length of the shift is between 0
    and 31 determined by the first significant bits of the second argument; in the
    latter case, the length of the shift is between 0 and 63 determined by the first
    significant bits of the second argument. This holds when argument is negative:
    the length of the shift is the non-negative number determined by the five or six
    significant bits of its complement representation.


    The left shift << equals n*2^..., where the number of multiplications is determined
    by the five or six significant bits of s, as promoted to a 32-bit value or a 64-bit
    value.


    For signed integer types, the right shift performs shift with sign-bit extension:
    the right shift >> equals n/2^..., where the number of divisions is determined
    by the five or six significant bits of s. The right shift of a negative value
    equals ~((n)>>s). In other words, the low-order bits of n are discarded, shifted
    right, and the high-order empty bits are set to zero if n is non-negative and
    set to 1 if n is negative.


    For unsigned integer types, the operator >> performs shift with zero extension:
    the right shift >> equals n/2^..., where the number of divisions is determined
    by the five or six significant bits of s. In other words, the low-order bits of
    n are discarded, shifted right, and the high-order empty bits are set to zero.


    See example 252 for clear and intricate use of bitwise operators. This may be
    efficient and good style on a embedded processor, but not in general programming.


    # 12.6 Comparison Operators


    The comparison operators == and != require the operands to be compatible; one
    must be convertible to the other. The operators that generate generic types must
    be constrained to reference types (section 26.4), unless one is null. Two values
    of same type comparison (by ==) will return the same value for account. For instance,
    10 and 10 are equal. Values of a reference type that does not override the default
    implementation of the operators are equal (==) if both are null, or both are references
    to the same object or array, by the execution of the new operator.


    Class String re the == and != operators so that they compare the characters in
    the strings. Two strings s1 and s2 may be equal by s1==s2 be distinct objects
    and therefore unequal by (Object)s1==(Object)s2; see example 18.


    Values of struct can be compared using == and != only if the operators have been
    defined for that type. The default Equals method (section 5.2) compares struct
    values field by field.


    The operators < <= >= are used on numeric types (and on user-defined types); section
    10.17. They perform comparison on signed integer types, and unsigned comparison
    on unsigned ones.'
