  md: '# 21.3 Operations on Threads


    The current thread, whose state is Running, may call these methods among others.
    More Thread methods are described in the .Net Framework Class Library.


    +   * Thread.Sleep(n) sleeps for n milliseconds. The current thread becomes Sleeping,
    and after n milliseconds becomes Enabled. If it is 0, then it becomes Enabled
    immediately, and by going from Running to Enabled it allows the system to schedule
    another Enabled thread, if any. May throw ThreadInterruptedException if the thread
    is interrupted while sleeping.

    * Thread.CurrentThread() returns the current thread object.


    Let u be an object of class Thread:


    +   * u.Start() changes the state of u to Enabled, so that the delegate from which
    it was created will be called when a processor becomes

    * u.Interrupt() interrupts the thread u. If u is Running or Enabled or Locking,
    then its interrupted status is set to true. If u is Sleeping or Joining, or if
    u is Waiting, then it will Locking. In the latter cases u will throw ThreadInterruptedException
    and if it becomes Running (and then interrupted status is set to false).

    * u.Join() waits for u to die. May throw ThreadInterruptedException if the current
    thread is interrupted waiting.

    * u.Join(n) works as u.Join() but times out and returns after at most n milliseconds.
    There is no indication whether the call returned because of a timeout or because
    u died.


    # 21.4 Operations on Locked Objects


    A thread that holds the lock on an object o may call the following methods from
    the Monitor class in the System.Threading namespace. The methods throw ArgumentNullException
    if o is null and SynchronizationException if the thread does not hold the lock
    on o.


    +   * Monitor.Wait(o) releases the lock on o, changes its state to Waiting, and
    adds itself to the set of threads waiting for notification on o. When notified
    by Pulse or PulseAll(if ever), the thread must obtain the lock on o, so when the
    call returns, it holds the lock on o. May throw ThreadInterruptedException if
    the thread is interrupted while sleeping.

    * Monitor.Wait(o, n) works as Monitor.Wait(o), except that the thread will change
    state to Locking after n milliseconds regardless of or not there has been a notification
    on o. There is no indication whether the state change was caused by a timeout
    or because of a notification.

    * Monitor.Pulse(o) chooses an arbitrary thread among those waiting for notification
    on o (if any) and changes the state of that thread to Locking. The chosen thread
    cannot actually obtain the lock on until the current thread has released it.

    * Monitor.PulseAll(o) works as Monitor.Pulse(o), except that it changes the state
    of all threads waiting for notification on o.'
