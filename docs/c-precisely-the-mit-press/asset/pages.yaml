  md: "# Statements 111\n\nExample 140 Iterator for Integer Sequences\nThe yield statement\
    \ can be used to enumerate a sequence of integers (struct Seq from example 68)\
    \ by declaring GetEnumerator as shown below. It has the same effect as a method\
    \ that returns an object of the complicated class SeqEnumerator in example 64.\
    \ In fact GetEnumerator below will be transformed into a class, similar to SeqEnumerator,\
    \ which implements IEnumerator<int> and IEnumerator (section 27.2).\nInterface\
    \ IEnumerable<int> has non-generic base interface System.Collections.IEnumerator\
    \ whose\\GetEnumerator method returns a non-generic IEnumerator. To satisfy this,\
    \ we use an explicit interface method implementation (15.3).\n\n```\nstruct Seq\
    \ : IEnumerator{\n    private readonly int b, k, n;\n    ...\n\n    public IEnumerator<int>\
    \ GetEnumerator() {\n        for (int i=0; i<n; i++) {\n            yield return\
