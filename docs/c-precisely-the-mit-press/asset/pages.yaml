  md: "# Example 151 Representing Weekdays and Months Using Enum Types\n\nWhen specifying\
    \ a date it is desirable to use numbers for years (2003), dates (31), and ISO\
    \ week numbers (22), but symbolic values for weekdays (Sat) and months (May).\
    \ In calendrical calculations it is useful to assign numbers 0–6 to the weekdays\
    \ (Mon-Sun) and numbers 1–12 to the months (Jan-Dec). This is done in the enum\
    \ Type Day and Month; note the Jan=1 in Method. MethodDaynumber uses m++ to increment\
    \ a month number (an enum value), method Weekday computes the weekday by casting\
    \ the remainder modulo 7 to enum type, and ToString casts a month (an enum value)\
    \ to int.\n\n```\npublic enum Day { Mon, Tue, Wed, Thu, Fri, Sat, Sun }\npublic\
    \ enum Month { Jan=1, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec }\n\
    public class Date {\n    readonly int yy // 0-9999, // 1-31 *\n    readonly int\
    \ mm;\n    public Date(int y, Month m, int dd) {\n        ...\n    }\n    public\
    \ static int MonthDays(int y, Month m) {\n        switch (m) {\n            case\
    \ Month.Apr: case Month.Jun: case Month.Sep: case Month.Nov:\n               \
