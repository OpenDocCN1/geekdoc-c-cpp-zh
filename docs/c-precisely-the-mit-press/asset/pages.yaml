  md: '# Struct Types


    # 14 Struct Types


    A value is an instance of a struct type. A struct value can contain fields, methods,
    declarations, and other members, just like a class, but struct type is a value
    type. This means that a variable or element of struct type directly contains an
    instance of the struct type (struct value), whereas a variable or array element
    of class type contains only a reference to a class instance (object). Also, the
    assignment of a struct value to struct variable is performed by copying the fields
    of the struct value to the fields of the struct value held in the variable (example
    71). By contrast, the assignment of an object to a variable type only copies a
    reference into the variable (example 71). Similarly, passing a struct type by
    argument or returning a struct type from a method will copy the struct value (example
    96).


    Struct types are well-suited for representing pairs, complex numbers, rational
    numbers, and other small, value-oriented or functional data structures: data structures
    may be freely copied because their fields are never modified after creation. Fields
    should be declared `readonly`.


    ```

    A-declaration of struct type S struct-modifiers S struct-interface-clause

    ```


    A declaration of struct type S introduces a new value type S (section 5.1). The
    `struct-modifiers` may be new and a class access modifier (section 10.14). It
    cannot be abstract or `sealed`. The `struct-interface-clause` may be left out;
    if it is present it has the form `: I1, I2,...` where I1, I2 are a non-comma-separated
    list of interface types that must be implemented by struct type S; see section
    15.2.


    A struct declaration may consist of one or more part declarations (section 30).
    The `struct-body` can have the same members as a `class-body` (section 10.1).
    A struct type is similar to a class, but there are some differences:


    +   * A struct type implicitly inherits from `System.ValueType`, which inherits
    from Object (section 5.2). A struct type can inherit from no other class or struct
    type, and no class or struct type can inherit from a struct type. As a consequence
    a struct type cannot be abstract or sealed, and a struct member cannot be protected
    or `protected internal`.


    +   * A struct can have virtual methods, properties, or indexers, and all calls
    are non-virtual. The `method-modifiers` virtual, sealed, and abstract are not
    permitted, and override can be used only on members inherited from Object or ValueType,
    as `ToString` in example 142.


    +   * A struct is a value type, and therefore a variable or field of struct type
    cannot be null. A struct type has a predefined constructor `S()` that initializes
    the struct instance''s fields with their default values; this initializes the
    struct''s default initial value. No argueless constructor can be declared explicitly
    in a struct type.


    +   * If S is an array whose element is a struct type S, then each array `arr[i]`
    holds an entire struct value, not just a reference to one. Creating new `S[3]`
    will set aside space for three instances of struct type S; see example 71.


    +   * Conversion between a struct type and type interfaces is performed by boxing
    and unboxing (sections 5.3.3 and 14.1).


    +   * Field declarations cannot have initializers; a field is always initialized
    with its default value.'
