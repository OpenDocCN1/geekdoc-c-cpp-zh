  md: '# 15.2 Classes and Struct Types Implementing Interfaces


    A class C (section 10.1) may be declared to implement one or more interfaces by
    a class-base-clause. Similarly, a struct type S (section 14) may be declared to
    implement one or more interfaces by a struct-interface-clause. Both have the


    ```

    : I1, I2, ...

    ```


    If this is applied to the declaration of a class C, it means that a reference
    of class C is implicitly convertible to type I1, I2, and so, by a reference conversion
    (section 5.3.2). If applied to the declaration of a struct type S, it means a
    value of type S is implicitly convertible to type I1, I2, and so, by a boxing
    conversion (section 14.1). The interfaces I1, I2, and so, are the *base interfaces*
    of the class or struct type


    The compiler will check that C declares—or inherits from a superclass—every function
    member described by I1, I2, ..., with exactly the prescribed signature, including
    ref and out modifiers, and the prescribed return type. Only public instance methods,
    properties, indexers, and events in a class or struct can implement a member described
    by an interface; a static or non-public member cannot.


    A class or struct may implement any number of interfaces.


    # 15.3 Explicit Interface Member Implementations


    When a class implements an interface I, it may declare an *explicit interface
    member implementation* of any method, property, indexer, or event described by
    interface I. Such implementations have the following


    ```

    returntype I.M(format-list) method-body

    returntype I.P { get-body set-body }

    returntype I.this[format-list] { get-body set-body }

    devent delegate-type I.E { add-body remove-body }

    ```


    An explicit interface member implementation cannot access members but is implicitly
    public. Also, it cannot include any of the member''s *abstract, virtual, override,
    or static*. A member cannot explicitly implement more than one interface.


    A member declared by explicit interface member implementation is an instance member
    and may be accessed as o.M(...) or o.P or ..., where o is an expression of type,
    possibly obtained by an explicit cast (section 150).


    Explicit interface implementation is useful when a class must implement both a
    generic interface such as IEnumerator and a legacy non-generic interface as IEnumerator
    (section 27.2). Each of these interfaces describes a read-only property Current,
    but with different types: T and Object. Using explicit interface member implementation,
    one can declare them as follows, thereby implementing both interface IEnumerator<T>
    and interface IEnumerator:


    ```

    T IEnumerator<T>.Current { get { ... } }

    Object SC.IEnumerator.Current { get { ... } }

    ```


    Here namespace System.Collections is abbreviated by SC. See also examples 64 and
    140.'
