  md: '130 Threads, Concurrent Execution, and Synchronization


    # 21 Threads, Concurrent Execution, and Synchronization


    # 21.1 Threads and Concurrent Execution


    In sequential program execution, expressions are evaluated and statements are
    executed one after the other, in a single thread of execution: a thread is an
    independent sequential activity. A C# program may execute several threads concurrently,
    that is, potentially overlapping in time. For instance, one part of a program
    may continue computing while another part is blocked waiting for input (example
    163).


    A thread is created and controlled using an object of the sealed class Thread
    in the namespace System.Threading. A thread object is created from a delegate
    of type void ThreadStart(), also from System.Threading. When started, the new
    thread executes the body of that delegate. To every thread (independent sequential
    activity) there is a unique controlling Thread object, so are two identified.


    To create and run, declare anargument method as void Run(), create a ThreadStart
    delegate from Run, and create a thread object from the delegate:


    ```

    Thread u = new Thread(new ThreadStart())

    ```


    Call u.Start() to allow the thread to run concurrently with other threads (example
    163).


    Threads can communicate with each other via shared state, by assigning and assigning
    static fields, instance fields, and arrays (element 166). Two threads can communicate
    via a local variable or parameter only if both are created from anonymous delegates
    within the same method.


    # States and Transitions of a Thread


    A thread is alive if it has started and has not died. A thread dies by exiting
    the delegate from which it was created, either by returning or by throwing an
    exception. A live thread is in one of the states (ready to run), Running (actually
    executing), Sleeping (for a timeout), Joining (waiting for thread to die), Locking
    (trying to obtain the lock on object o), or Waiting (for notification on object
    o). The state transitions of a thread are summarized in the table and in the figure
    opposite:


    | From | To State | Reason for Transition |

    | --- | --- | --- |

    | Enabled | Running | The system schedules the thread and another one |

    | Running | Enabled | The thread executes Monitor.Wait(o), thus releasing the
    lock on o |

    | Running | Waiting | The thread attempts to execute lock (o) { ... } |

    | Running | Sleeping | The thread executes Thread.Sleep() |

    | Running | Joining | The thread executes u.Join() |

    | Running | Dead | The thread is exited by returning or by throwing an exception
    |

    | Sleeping | Enabled | The period expires |

    | Sleeping | Waiting | The thread was interrupted; throws ThreadInterruptedException
    when run |

    | Joining | Enabled | The thread being joined died, or the join timed out |

    | Joining | Waiting | The thread was interrupted; throws ThreadInterruptedException
    when run |

    | Waiting | Enabled | Another thread executed Monitor.Pulse(o) or Monitor.PulseAll(o)
    |

    | Waiting | Locking | The wait for the lock on o timed out |

    | Waiting | Dead | The thread was interrupted; throws ThreadInterruptedException
    when run |

    | Locking | Enabled | The lock on o became available and was given to this thread
    |


    *'
