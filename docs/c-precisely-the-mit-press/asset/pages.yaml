- pgno: 226
  md: "# 31 Assertions and the Debug.Assert Method\n\nThe class System.Diagnostics.Debug\
    \ defines several overloaded versions of an Assert method:\n\n```\nstatic void\
    \ Assert(bool chk)\nstatic void Assert(bool chk, String msg)\n```\n\nUnder ordinary\
    \ execution of a program, a call Assert(expression) to Assert has no effect at\
    \ all; the argument expression is not evaluated. However, assertions in a compilation\
    \ may be enabled by compiling with option /d:DEBUG, using one of these command\
    \ lines (section 1.1):\n\n```\ncsc /d:DEBUG Prog.cs\nmcs -define:DEBUG Prog.cs\n\
    ```\n\nTo selectively enable assertions in part of a compilation unit, one may\
    \ insert the preprocessor directive #define DEBUG before that part and the preprocessing\
    \ directive #undef DEBUG after it.\n assertions are enabled, a call to Assert\
    \ will evaluate the arguments. If the result of the first expression is true,\
    \ program execution continues normally. If the result is false, the assertion\
    \ fails. This means that a dialog box will appear, or a message will be logged\
    \ (by a TraceListener), or the CLR debugger will be started; in any case, a message\
    \ about the error will be given. The message will include the result of the string\
    \ expression, if present. This simplifies troubleshooting in a malfunctioning\
    \ program.\n An assertion failure should signal the failure of a fundamental assumption\
    \ in the program.\n\nAn Assert can serve two purposes: to document the programmer's\
    \ assumption about the state at a certain point in the program, and to check at\
    \ run-time that that assumption holds (provided the program has been compiled\
    \ with assertions enabled).\n One may put an Assert after a particularly complicated\
    \ piece of code, to check that it has achieved what it was supposed to (example\
    \ 252).\n In a class that has a data representation invariant, one may assert\
    \ the invariant at the end of every method in the class (example 253).\n One should\
    \ not use Assert calls to check the validity of user input or public methods or\
    \ constructors, because the check will be performed only if assertions are enabled\
    \ at compile-time. Instead, use if statements and throw an exception in case of\
    \ error."
  merge: -1
