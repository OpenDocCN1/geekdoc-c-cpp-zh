  md: "# 16 Enum Types\n\nAn enum type is an integer t and zero or more compile-time\
    \ constants of that type.\n\nAn enum-type-declaration has the form\n\n```\nenum-modifiers\
    \ enum t base-clause {\n  enum-member-list\n}\n```\n\nwhere enum-member-list is\
    \ a (possibly empty) comma-separated list of enum member declarations, having\
    \ one of these forms:\n\n+   enum-member\nenum-member = constant-expression\n\n\
    The enum-modifiers control the access of the enum type and follow the same rules\
    \ as class access modifiers (section 10.14). The modifiers abstract and sealed\
    \ cannot be used. The base-clause determines the representation type of the enum\
    \ type. If the base-clause is present, it must have the form : where type is one\
    \ of byte, byte, short, ushort, or int. If the base-clause is absent, then the\
    \ underlying representation type is int.\n\nThe value of an enum-member is the\
    \ value of the constant-expression if the enum member has one. Otherwise, if the\
    \ enum-member is the first one in the list, the value is zero. Otherwise is it\
    \ the value of the preceding enum-member, plus 1. The constant-expression must\
    \ be constant and may refer to (unqualified) enum-members from the same enum type,\
    \ but it is a compile-time error for enum-members to be recursively defined. Distinct\
    \ enum members may have different underlying representation value. It is a compile-time\
    \ error for the constant-expression to evaluate to a value not representable in\
    \ the underlying representation type.\n\nOutside an enum declaration, an enum-member\
    \ must be written in its fully qualified form, such as Month.Jan.\n\nAn enum member\
    \ has the type of the enclosing enum type declaration. An enum member can be explicitly\
    \ cast to the underlying representation type; there are no implicit conversions.\
    \ The value 0 may be implicitly cast to the enum type; other values of the underlying\
    \ representation type must be explicitly cast to the enum type. In either case\
    \ the resulting value does not correspond to any declared member; this is not\
    \ an error.\n\nThe following 14 operators can be applied to enum members:\n\n\
    ```\n= == < <= = + & ++\n```\n\nThe comparison operators == can be applied to\
    \ two arguments of the same enum type t; the result has bool. The operators +\
    \ - can be used to add an integer to an enum value of t or subtract an integer\
    \ from enum value of t; the result has t. The bitwise operators (^, &, and |)\
    \ may be applied to two arguments of the same enum type t; the result has t.\n\
    \nArithmetics on enum members may produce results in the underlying representation\
    \ type that do not correspond to any declared enum member; this is not an error,\
    \ not even in a checked context (section 12.3).\n\nAn enum type is a subclass\
    \ of System.Its ToString method converts an value to a string. If the enum value\
    \ corresponds to one or more declared enum members, it will be formatted as a\
    \ symbol, such as \"Jan\"; if it does not, it will be formatted as an integer,\
    \ such as \"7\"."
