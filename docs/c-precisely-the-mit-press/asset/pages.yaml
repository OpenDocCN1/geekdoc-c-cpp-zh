    \ part of the declaration of class C is a valid declaration on its own: each part\
    \ of C uses members declared in the other part; and similarly for struct S.\n\n\
    All parts of the declaration of S have the same access modifier (public). Although\
    \ only one part of class C has the sealed modifier and one part the public modifier,\
    \ the modifiers also apply to the other parts, and the resulting type C is a sealed\
    \ public class. Similarly, although only one part of class C says that it implements\
    \ interface I, all parts of C contribute to implementing I.\n\n```\npartial interface\
    \ I {\n    void M2(C s n);\n}\nsealed partial class C : I {\n    public void M1(S\
    \ s n) {\n        if (n.x > 0)\n            M2(n.Decr());\n    }\n    public partial\
    \ struct S {\n        public S(int x) { this.x = x; }\n    }\n    public static\
    \ void Main() {\n        C c = new C();\n        c.M1(new S(5));\n    }\n}\n```\n\
    \n# Example 251 Partial Type Declarations, Part Two\n\n```\npartial interface\
    \ I {\n    void M1(C s n);\n}\npublic partial class C {\n    public partial struct\
    \ S {\n        public int x;\n        public S Decr() { x--; return this; }\n\
    \    }\n}\n```\n\n```\npublic void M2(S n) {\n    Console.WriteLine(\"n.x={0}\"\
    , n.x);\n    M1(n);\n}\n```"
