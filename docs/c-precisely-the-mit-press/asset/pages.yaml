    +   - int Count() returns the number of items (example 244).

    - int Count(Func<T,bool> p) applies to each item x and returns the number of items
    for which p(x) is true.

    - IEnumerable<T> DefaultEmpty() returns an enumerable that generates the same
    items as the given enumerable, if non-empty; otherwise it generates the singleton
    enumerable containing the single item default(T).

    - IEnumerable<T> DefaultEmpty(T x) returns an enumerable that generates the same
    items as the given enumerable, if non-empty; otherwise it generates the singleton
    enumerable containing the single item x.

    The DefaultEmpty methods can be used to produce a left outer join when combined
    with the GroupJoin method (example 242).

    - IEnumerable<T> Distinct(T x) returns an enumerable that generates each item
    of the given enumerable exactly once, distinguishing items by the default equality
    comparer. Also overloaded to take an explicit EqualityComparer<T> as last argument.

    - T Element(int i) returns the item at index i, counting from 0. ThrowsOutOfRangeException
    if i<0 or if i is greater than equal to the number of items in the enumerable.

    - T ElementAtDefault(int i) returns the item at index i, counting from 0. Returns
    default(T) if i<0 or if i is greater than equal to the number of items in the
    enumerable.

    - IEnumerable<T> Except(IEnumerable<T> ys) returns an enumerable that generates
    those items not equal to any item ys, comparing items by the default equality
    comparer. In comparison notation: (x | xx, where y ys). Also overloaded to take
    an explicit EqualityComparer<T> as last argument.

    - T First() returns the first item of the given enumerable, if non-empty. Returns
    InvalidOperationException if the enumerable is empty.

    - T First(Func<T,bool> p) returns the first item x of the given enumerable for
    which p(x) is true, if any. Throws InvalidOperationContext if there is no such
    item.

    - T FirstDefault() returns the first item of the given enumerable, if non-empty;
    otherwise returns default(T).

    - T FirstDefault(Func<T,bool> p) returns the first item x of the given enumerable
