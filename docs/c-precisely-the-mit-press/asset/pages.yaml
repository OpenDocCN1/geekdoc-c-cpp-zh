  md: "# Generic Collections: Sets, Lists, and Dictionaries 183\n\n**Example 220**\
    \ Traversing a Collection\nThe prototypical traversal of a collection coll (which\
    \ implements IEnumerable<T>) uses a foreach statement.\n\n```\npublic static void\
    \ Print<T>(ICollection<T> coll) {\n  foreach (T x in coll)\n    Console.Write(\"\
    {0} \", x);\n    Console.WriteLine();\n}\n```\n\n**Example 221** Traversing a\
    \ Dictionary\nA dictionary implements IEnumerable<KeyValuePair<K,V>> so its key/value\
    \ pairs (section 27.8) can be printed like this:\n\n```\npublic static void Print<K,V>(IDictionary<K,V>\
    \ dict) {\n  foreach (KeyValuePair<K,V> entry in dict)\n    Console.WriteLine(\"\
    {0} --> {1}\", entry.key, entry.value);\n    Console.WriteLine();\n}\n```\n\n\
    **Example 222** An Enumerator Class for LinkedList<T>\nClass LinkedListEnumerator\
    \ is a member of class and enumerator for class LinkedList<T> (example 200). The\
    \ Dispose method releases any data and nodes reachable through the current element.\
    \ The non-generic Current property and the Reset method are required by interface\
    \ IEnumerator, which IEnumerator<T> extends. The yield statement (section 13.12)\
    \ provides a much simpler way to define enumerators.\n\n```\nprivate class LinkedListEnumerator\
    \ : IEnumerator<T> {\n  T curr; // The enumerator's current element\n  bool valid;\
    \ // Is the current element valid?\n  Node next; // Node holding the next element,\
    \ or null\n  public LinkedListEnumerator(LinkedList<T> list) {\n    next = list.first;\
    \ valid = false;\n  }\n  public T Current {\n    get { if (valid) return curr;\
    \ else throw new InvalidOperationException(); }\n  }\n  public bool MoveNext()\
    \ {\n    if (next != null) {\n      curr = next.item; next = next.next; valid\
    \ = true;\n    } else {\n      valid = false;\n    }\n    return valid;\n  }\n\
    \  public void Dispose() { curr = default(T); next = null; valid = false; }\n\
    \  Object IEnumerator.Current { get { return Current; } }\n  void IEnumerator.Reset()\
    \ { throw new NotSupportedException(); }\n}\n```"
