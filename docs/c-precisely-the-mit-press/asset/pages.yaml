  md: "# Interfaces\n\n# 15 Interfaces\n\n# 15.1 Interface Declarations\n\nAn interface\
    \ describes methods, properties, indexers, and events but does not implement them.\
    \ An interface-declaration may contain method descriptions, indexer descriptions,\
    \ and event descriptions. The descriptions in an interface may appear in any order:\n\
    \n```\ninterface-modifiers interface I base-interfaces {\n  method-descriptions\n\
    \  property-descriptions\n  indexer-descriptions\n  event-descriptions\n}\n```\n\
    \nAn interface may be declared at top level or inside a namespace or class or\
    \ struct. At top level in a namespace, the interface-modifiers may be public or\
    \ internal (which means internal). Inside a class or struct, the interface-modifiers\
    \ may be any of the member modifiers (section 10.3). In a class it may also be\
    \ to hide an interface inherited from a base class.\n\nAn interface declaration\
    \ consists of one or more partial type declarations (section 30). The base-interfaces\
    \ clause may be absent. Otherwise the interface declaration has this\n\n```\n\
    interface-modifiers interface I : I1, I2, ... { }\n```\n\nWhere I1, I2,... is\
    \ a non-empty list of interfaces. If the base-interfaces clause is present, then\
    \ interface I describes all members described by I1, I2,..., and is a subinterface\
    \ of I1, I2,.... Interface I can describe additional methods, properties, indexers,\
    \ and events not described by the base interface I1, I2,..., and it may hide inherited\
    \ members by describing new members. A method-description for method M must have\
    \ the\n\n```\ndescription-modifier returntype M(format-list);\n```\n\nwhere the\
    \ description-modifier should be new if the description hides a member inherited\
    \ from a base interface such as II (otherwise a compiler is given). No access\
    \ modifiers can be given; all interfaces are implicitly public. A property-description\
    \ for a property P must have the\n\n```\ndescription-modifier returntype P {\n\
    \  get;\n  set;\n}\n```\n\nwhere one of get and set may be left out. An indexer-description\
    \ must have the\n\n```\ndescription-modifier returntype this[format-list] {\n\
    \  get;\n  set;\n}\n```\n\nwhere one of get and set may be left out. An event-description\
    \ for an event E must have the\n\n```\ndescription-modifier event delegate-type\
    \ E;\n```"
