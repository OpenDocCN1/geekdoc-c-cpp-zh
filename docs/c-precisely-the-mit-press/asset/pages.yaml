    \ See also examples 209 and 222.\n\n```\npublic class LinkedList<T> : MyList<T>\
    \ {\n    protected int size;                // Number of elements in the list\n\
    \    protected Node first, last;        // Invariant: first=null iff last=null\n\
    \    protected class Node {\n        public Node next;\n        public T Item;\n\
    \    }\n\n    public LinkedList() { first = null; size = 0; }\n    public LinkedList(params\
    \ T[] elements) : this(elements) { ... }\n    public int Count { get { return\
