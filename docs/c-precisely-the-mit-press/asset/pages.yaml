  md: '# 10.5 Field Declarations in Classes


    The purpose of a field is to hold a value inside an object (non-static) or a class
    (static). A field must be declared in a class declaration. A field-declaration
    has one of the following:


    ```

    field-modifiers type fieldname1, fieldname2, ...

    field-modifiers type fieldname1 = initializer1, ...

    ```


    The field-modifiers is a list of static, readonly, new, and a member access modifier
    (section 10.3).

    If a f in class C declared static, then f is associated with the class C and can
    be referred to independently of any objects of class C or its subclasses. If f
    in class C not declared static, then f is an instance field associated with an
    object of class C, and has its own instance of the field. The field can be referred
    to as o, where o is an expression or non-static code inside the declaration of
    C and C''s subclasses, as f.

    If f is declared readonly, then it can be assigned elsewhere but not as an out
    or ref parameter (possibly multiple times). It can be assigned elsewhere in constructors.
    If f has a reference type and points to an object or array, then that object''s
    fields or array''s elements may be modified. If f is static, then assignments
    to f.x are allowed, but such assignments, and method calls f(M), work on a temporary
    copy of f and have no effect on f.

    A field initializer may be an expression or an array initialization (section 9.1).
    No field initializer can reference fields of C or the current reference this.
    A static field initializer can only refer to static members of C. Thus a field
    initializer is static code (section 10.1).

    A field has a default value depending on the type of t. If t is a simple type,
    then the field is initialized to 0 (when t is an integer) or 0.0 (when t is float
    or decimal) or when t is a struct whose fields have default initial values (when
    t is a struct). If t is a reference type, the default value is null.


    Static fields are initialized when the class is loaded. All static fields are
    given their default values, then the static initializers are executed in order
    of appearance in the class declaration, and then the static constructor (section
    10.12), if any, is executed.

    Instance fields are initialized when an instance is constructed, at which time
    all static fields have been initialized already (section 10.1).

    If class C declares an instance field f, and C is a subclass of class B that has
    an instance field f, then the declaration of f should have the new modifier. Every
    object of C has two fields, both one is the B f declared in the base class, and
    one is the C f declared in C static. Which field is referred to by a field access
    o, f is determined by the type of o (section 12.15).


    # 10.6 Constant Declarations in Classes


    A constant in a class is similar to a static read-only field, but its value is
    computed at compile-time:


    ```

    const-modifier const type fieldname = initializer1, ...

    ```


    A constant is implicitly static. The const-modifier must be one of the member
    access modifiers (section 10.3). The type must be a simple type (section 5.1)
    or String or a reference. The initializer expressions must be compile-time constant
    expressions; other than String the only possible value is null.'
