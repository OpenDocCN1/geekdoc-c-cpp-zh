    \ Data Retrieval with async and await\nMethods NbiEntQueryAsync and NbiProteinAsync\
    \ behave the same as the task-returning methods in example 170, but the async\
    \ and await keywords give a neater syntax.\n\n```\npublic static async Task<String>\
    \ NbiEntrezAsync(String query) {\n    byte[] bytes = await newClient().DownloadDataAsync(new\
    \ Uri(server + query));\n    return ASCIIICode.GetString(bytes);\n}\n```\n\n```\n\
    public static async Task<String> NbiProteinAsync(String id) {\n    return await\
    \ NbiEntrezAsync(\"etch.fcgi?retype=fasta&retmode=textidb=proteinid=\" + id);\n\
    }\n```\n\nExample 177 Parallel Asynchronous Data Retrieval\nTo retrieve many proteins,\
    \ one may use asynchronous method NbiProteinAsync (example 176). The from expression\
    \ creates and starts a task for each protein ID, and WhenAll creates a task that\
    \ waits for all of them to complete and collects the results and returns them\
    \ in an array.\n\n```\npublic static async Task<String[]> NbiProteinParallelAsync(params\
    \ String[] ids) {\n    IEnumerable<Task<String>> tasks = from id in ids select\
    \ NbiProteinAsync(id);\n    return await Task.WhenAll(tasks);\n}\n```\n\nExample\
    \ 178 Composite Asynchronous Data Retrieval\nA query to the PubMed publication\
    \ database at NCBI must be done in two steps: first an search query that returns\
    \ an XML document containing a WebEnv key; then an fetch query that gets the actual\
    \ results. The asynchronous method performs such a two-step query, calling asynchronous\
    \ method NbiEntrezAsync(example 176) twice. Because the result is a task, one\
    \ could further add a timeout (example 179) or use WhenAll to perform many such\
    \ two-step queries in parallel (example 177).\n\n```\npublic static async Task<String>\
    \ NbiPubMedAsync(String term) {\n    String search = String.Format(\"etch.fcgi?db=PubMed&retmode=l&term={0}\"\
    , term);\n    XmlDocument xml = new XmlDocument();\n    xml.LoadXml(await NbiEntrezAsync(search));\n\
    \    XmlNode node = xml[\"EsearchResult\"];\n    String fetch = String.Format(\"\
    retmax=3&db=PubMed&query_key={0}&WebEnv={1}\", node[\"Query\"].InnerText, node[\"\
    WebEnv\"].InnerText);\n    return await NbiEntrezAsync(\"etch.fcgi?retype=abstract&retmode=text\"\
    \ + fetch);\n}\n```\n\nExample 179 Implementing Timeout with async and await\n\
    A timeout (example 173) can be implemented using async methods and await.\n\n\
    ```\npublic static async Task<double> SlowTimeout2Task(int n) {\n    Task<double>\
    \ slowFibTask = SlowFibTask(n);\n    Task completed = await Task.WhenAny(slowFibTask,\
    \ Task.Delay(1000));\n    return completed == slowFibTask ? slowFibTask.Result\
    \ : -1;\n}\n```\n\n![](img/0895719d2f186cd73b49fccec3a97f1f_155_0.png)"
