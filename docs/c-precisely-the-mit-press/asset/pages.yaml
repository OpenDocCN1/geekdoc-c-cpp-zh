- pgno: 18
  md: 'Data and Types


    # 5 Data and Types


    A type is a set of data values and operations on them. Every variable, parameter,
    and field has a declared type, every method has a declared return type, and so
    on. The compiler will infer a type for every expression based on this information.
    This compile-time type determines which operations can be performed on the value
    of the expression.


    Types are used in declarations of local variables; in declarations of classes,
    interfaces, struct types, and their members; delegate type; object and array creation
    expressions (sections 9 and 12); in type cast expressions (section 12.20); and
    in instance test expressions (section 12.13).

    A type is either a value type (section 5.1) or a reference type (section 5.2).


    # 5.1 Value Types and Simple Types


    A value type is either simple (this section), a struct type (section 14), or an
    enum type (section 16). A variable of value type directly contains a value of
    that, not just a reference to it. Assigning a value of value type to a variable
    or array element of value type makes a copy of the value.

    A simple type is either bool or one of the numeric types. A numeric type is signed
    or unsigned integer, including the character type, or a floating-point type, or
    the fixed-point decimal which is useful for exact calculations such as financial
    accounting. The tables below show simple types, some example constants, value
    range, kind, and size (in bytes). For escape sequences such as \u0000 characters,
    see section 7. Integer may be written in decimal or hexadecimal notation:


    | Notation | Base | Distinction |

    |---|---|--- |

    | Decimal | 10 | 1234567890, .127, -127 |

    | Hexadecimal | 16 | Leading Ox, 0X1ABCDEF, -07F |


    Two''s complement representation is used for signed integer types (byte, short,
    int, and long). The integer types are exact. The floating-point types are inexact
    and follow the IEEE754 floating-point standard, with number of significant digits
    indicated often.

    For each type there is a predefined struct (in the System namespace), also shown.
    The simple type is alias for the struct and has these members:


    +   * int.Parse(String a) of type int is the integer by parsing a (example 1).
    It throws ArgumentNullException if a is null, FormatException if it cannot be
    parsed as an integer, OverflowException if the parsed number cannot be represented
    as an int. All simple types have similar Parse methods. The floating-point Parse
    methods are culture-sensitive (section 7.2).

    * The smallest and greatest possible values of each numeric type are represented
    by constant fields MinValue and MaxValue, such as int.MinValue and int.MaxValue.

    * The float and double types define several constants: double.Epsilon is the smallest
    number of type double greater than zero, double.PositiveInfinity and double.NegativeInfinity
    positive negative infinity, and double.NaN is a double value that is not a number.
    These values are determined by the IEEE754 standard.

    * The decimal type defines the constants MinusOne, Zero, and One type decimal
    along methods for computing with and converting numbers of type decimal.


    *'
