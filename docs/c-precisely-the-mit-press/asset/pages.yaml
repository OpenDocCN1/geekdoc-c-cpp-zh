    \ U> key, Func<U, K> fx, Func<T, V> fy, Func<T, U, V, U> g);\n    public C<U,\
    \ V> Select<U, V>(Func<T, U> key, Func<U, K> fx, Func<U, K> fy, Func<T, U, V>\
    \ g);\n    public C<U> Select<U>(Func<T, U> f);\n    public C<R> SelectMany<U,\
    \ R>(Func<T, U> selector, Func<U, IEnumerable<R>> resultSelector);\n    public\
    \ C<T> OrderBy<K>(Func<T, K> h);\n    public C<T> OrderByDescending<K>(Func<T,\
    \ K> h);\n    \n    public C<T> Where(Func<T, bool> p);\n}\nclass C<K, T> : C\
    \ {\n    public K Key { get; set; }\n}\nclass C<T> : C {\n    public C<T> ThenBy<K>(Func<T,\
