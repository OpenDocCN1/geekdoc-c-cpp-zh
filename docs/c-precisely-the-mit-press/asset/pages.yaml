  md: '# 20 Exceptions


    An exception is an object of an exception type: a subclass of Class Exception.
    An exception is used to signal and describe an abnormal situation during program
    execution. The evaluation of an expression or the execution of a statement may
    terminate abruptly by throwing an exception, either by executing a throw statement
    (section 13.8.1) or by executing a primitive operation, such as assignment to
    an element, that may throw an exception.


    A caught exception may be rethrown by a throw statement. If the exception is not
    caught, then the entire program execution will be aborted, and information from
    the exception is reported to the user (in a console or log). What is printed depends
    on the exception''s ToString() method.


    In an exception, the Message property is set by the exception, and the StackTrace
    property is the stack at the point where the exception was thrown. Both have type
    String.


    The table shows part of the exception class hierarchy and the namespace in which
    each exception class is defined. User-defined exceptions should be subclasses
    of ApplicationException.


    | Exception | Namespace |

    | --- | --- |

    | AggregateException | System |

    | ApplicationException | System |

    | RuntimeBinderException | Microsoft.CSharp.RuntimeBinder |

    | SystemException | System |

    | ArgumentException | System |

    | ArgumentNullException | System |

    | ArgumentOutOfRangeException | System |

    | ArrayTypeMismatchException | System |

    | DivideByZeroException | System |

    | FormatException | System |

    | IndexOutOfRangeException | System |

    | InvalidCaseException | System |

    | InvalidOperationException | System |

    | ObjectDisposedException | System |

    | InvalidProgramException | System |

    | NotImplementedException | System |

    | NotSupportedException | System |

    | NullReferenceException | System |

    | OperationCanceledException | System |

    | OverflowException | System |

    | RandException | System |

    | StackOverflowException | System |

    | SynchronizationLockException | System.Threading |

    | ThreadInterruptedException | System.Threading |

    | ThreadStateException | System.Threading |

    | InitializationException | System |

    | TypeLoadException | System |

    | DirectoryNotFound | System.IO |

    | EndOfStreamException | System.IO |

