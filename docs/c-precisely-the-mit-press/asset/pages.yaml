  md: '# 28.6 Numeric Extension Methods on IEumerable<T> (C# 3.0)


    Some extension methods on IEumerable perform aggregation over numerical values
    and are applicable only when the item type T is a numeric type or a nullable type.
    More precisely, they are defined on IEumerable<N> when N is one of the types decimal,
    decimal?, double?, int?, float?, and float?. The same requirement applies to the
    result type N of delegate aggregate f of the numeric aggregation methods Average,
    Min, Sum (section 28.5).


    +   * Average() computes the average of the numbers in the enumeration. The return
    type R is double if the type N is int or long, and double if N is int or long?;
    otherwise the return type R. When N is a nullable type, null items are ignored
    in the computation, and if the enumeration returns null. When N is not a nullable
    type and the enumeration is empty, InvalidOperation is thrown. See example 244.

    * Max() returns the maximum of the numbers in the enumeration. When N is a nullable
    type, null items are ignored in the computation, and if the enumeration contains
    non-null items, the method returns null. When N is not a nullable type and the
    enumeration is empty, InvalidOperationException is thrown. See example 244.

    * Min() returns the minimum of the numbers in the enumeration. When N is a nullable
    type, null items are ignored in the computation, and if the enumeration contains
    non-null items, the method returns null. When N is not a nullable type and the
    enumeration is empty, InvalidOperationException is thrown. See example 244.

    * Sum() returns the sum of the numbers in the enumeration. When N is a nullable
    type, null items are ignored in the computation. and if the enumeration contains
    non-null items (for instance, if N is not nullable and the enumeration is empty),
    the method returns zero. See example 244.


