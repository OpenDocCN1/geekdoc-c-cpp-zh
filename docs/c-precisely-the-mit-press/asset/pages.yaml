  md: "198 Linq, Language Integrated Query (C# 3.0)\n\n# 28.1.3 Query Continuations\n\
    \nA query-expression may have any number of query-continuations, each beginning\
    \ with into, like this:\n\n```\nquery-expression\ninto :\n    query-body-clauses\n\
    \    select e\n```\n\nThe into introduces a new range variable z that precedes\
    \ it. Expression e is evaluated for each value of z and of any range variables\
    \ introduced by the new query-body-clauses, to produce the items of the query\
    \ result. All range variables and 1-bound variables introduced by the initial\
    \ query-expression before e and the query-body-clauses cannot refer to any variables\
    \ introduced before into. The meaning of into is rather different from the meaning\
    \ of into in a group clause (section 28.1.2).\n\nAn important use of query continuations\
    \ is to make the groups by a query expression ending in group, so that the groups\
    \ can be further processed (examples 243 and 245).\n\n# 28.2 The Query Expression\
    \ Pattern\n\nAny class or C<T> can support Linq queries by implementing the query\
    \ expression pattern, that is, by having the methods and supporting types shown.\
    \ This works because a Linq query is rewritten to method calls (examples 235–243).\
    \ Note that Enumerable<T> and its supporting types (section 28.4) implement the\
    \ query pattern through their extension methods (sections 28.5–28.8).\n\nFor Linq\
    \ queries to make good sense, methods used in the query expression pattern should\
    \ behave similarly to those in Enumerable<T>, but this cannot be enforced by the\
    \ C# compiler.\n\n```\nclass C {\n    public C<T> Cast<>();\n}\nclass C<T> : C\
    \ {\n    public C<K, T> GroupBy<K>(Func<T, K> h);\n    public C<K, E> GroupBy<K,\
