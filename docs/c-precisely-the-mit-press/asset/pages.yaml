  md: "# Example 31 Efficiently Concatenating All Command Line Arguments\n\nWhen there\
    \ are many (more than 50) command line arguments, this is much faster than example\
    \ 20.\n\n```\nusing System;\nusing System.Text; // StringBuilder\n\nclass StringBuilderConcatenate\
    \ {\n    public static void Main(String[] args) {\n        StringBuilder res =\
    \ new StringBuilder();\n        for (int i=0; i<args.Length; i++) {\n        \
    \    res.Append(args[i]);\n            Console.WriteLine(res.ToString());\n  \
    \      }\n    }\n}\n```\n\n# Example 32 Replacing Occurrences of a Character by\
    \ a String\n\nTo replace occurrences of character c1 with the string s2 in string\
    \ s, it is best to use a string builder for the result, since the size of the\
    \ resulting string is not known in advance. This works well when replacing a character\
    \ c1 with another character c2, but in case the length of the result is known\
    \ in advance (equals the length of s), and one can use a character array instead.\
    \ Solving this problem by repeated concatenation (using res += s2 where res has\
    \ type String) would be very slow.\n\n```\nstatic String ReplaceCharString(String\
    \ s, char cl, String s2) {\n    StringBuilder res = new StringBuilder();\n   \
    \ for (int i=0; i<s.Length; i++) {\n        if (s[i] == cl)\n            res.Append(s2);\n\
    \        else\n            res.Append(s[i]);\n    }\n    return res.ToString();\n\
    }\n```\n\n# Example 33 An Inefficient Way to Replace Occurrences of a Character\
    \ by a String\n\nThe problem in example 32 can also be solved by destructively\
    \ modifying a string builder with Remove and Insert. However, repeated use of\
    \ Remove and Insert is very inefficient: for a string of 200,000 random characters\
    \ this method is approximately 100 times slower than in example 32.\n\n```\nstatic\
    \ void ReplaceCharString(StringBuilder sb, char cl, String s2) {\n    int i =\
    \ 0;\n    while (i < sb.Length) { // Inefficient\n        if (sb[i] == cl) { //\
    \ Inefficient\n            sb.Remove(i, 1); // Inefficient\n            sb.Insert(i,\
    \ s2); // Inefficient\n            i += s2.Length; // Inefficient\n        } else\
    \ // Inefficient\n            i += 1; // Inefficient\n        }\n    }\n}\n```"
