  md: "# Classes 45\n\n**Example 55** Inheritance, Hiding, and Overriding\nThe class\
    \ A declares static method M1, non-virtual instance method M2, virtual method\
    \ M3, and abstract method M4. Class B overrides M4 and inherits the other classes.\
    \ Class C hides the static M1 by a static method M1 and hides M2 by a new non-virtual\
    \ M2, and overrides the virtual M3. Abstract class D hides non-virtual method\
    \ M2 and virtual method M3 and overrides M4 by an abstract method. Class E overrides\
    \ M2 and M4 with virtual methods. Classes methods are shown in example 97.\n\n\
    ```\nabstract class A {\n    public static void M1() { Console.Write(\"A.M1\"\
    ); }\n    public virtual void M2() { Console.Write(\"A.M2\"); }\n    public virtual\
    \ void M3() { Console.Write(\"A.M3\"); }\n    public abstract void M4();\n}\n\
    class B : A {\n    public override void M4() { Console.Write(\"B.M4\"); }\n}\n\
    class C : B {\n    public static new void M1() { Console.Write(\"C.M1\"); }\n\
    \    public new void M2() { Console.Write(\"C.M2\"); }\n    public override void\
    \ M3() { Console.Write(\"C.M3\"); }\n}\nabstract class D : C {\n    public new\
    \ abstract void M2();\n    public new virtual void M3() { Console.Write(\"D.M3\"\
    ); }\n    public abstract override void M4();\n}\nclass E : D {\n    public sealed\
    \ override void M2() { Console.Write(\"E.M2\"); }\n    public override void M3()\
    \ { Console.Write(\"E.M3\"); }\n    public override void M4() { Console.Write(\"\
    E.M4\"); }\n}\n```\n\n**Example 56** Static Field Initializers and the Static\
    \ Constructor\nThe initializer of static field creates an array and binds it to\
    \ ps. The static constructor fills it with an increasing sequence of pseudo-random\
    \ numbers, then scales them that the last number is 1.0. This is useful for generating\
    \ a random loaded deal, and cannot be done using a static field initializer.\n\
    \n```\nclass InitializerExample {\n    static double[] ps = new double[6];\n \
    \   static readonly Random rnd = new Random();\n    static InitializerExample()\
    \ { // Static constructor\n        double sum = 0;\n        for (int i=0; i<ps.Length;\
    \ i++) // Fills ps with increasing random numbers\n            ps[i] = sum +=\
    \ rnd.NextDouble(); // Random number 0 <= x < 1\n        for (int i=0; i<ps.Length;\
    \ i++) // Scales so that last ps element is 1.0\n            ps[i] /= sum;\n \
