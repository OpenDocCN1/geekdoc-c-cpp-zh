    # 25.7 Byte Input and Output: Stream


    The abstract class Stream and its subclasses (all of whose names end in Stream)
    are used for byte-oriented input and output. A stream is associated with some
    resource to read from or write to, typically a file or an area of memory. A stream
    may support reading, seeking, writing, or a combination of these. A stream has
    a current position, indicating which byte to read from or write to. Let s be a
    variable of type Stream:


    +   * Read-only property s.CanRead is true if the stream is not closed and supports
    reading; else false.

    * Read-only property s.CanSeek is true if the stream is not closed and supports
    seeking; else false.

    * Read-only property s.CanWrite is true if the stream is not closed and supports
    writing; else false.

    * Read-only property s.Length of type long is the number of bytes in the stream,
    if the stream supports seeking; otherwise throws UnsupportedException.

    * Read-write property s.Position of type long returns the current position of
    the stream. Setting s.Position to v sets the current position of the stream to
    v.


    Variables of class Stream (and any subtype) have the following methods:


    +   * int ReadByte() reads one (0...255) and returns it as an int, blocking until
    input is available; returns -1 on end-of-stream.

    * int Read(byte[] b, int i, int n) reads at most n bytes from the stream and copies
    them into b[i..i+n-1] and returns the number of bytes actually read as an int
    and updates the position of the stream. Returns 0 on end-of-stream. Throws Length.OutOfRangeException
    if i<0 or n<0, ArgumentNullException, ArgumentNullException if b evaluates to
    null, UnsupportedException if the stream does not support reading, and ObjectDisposedException
    if the stream has been closed.

    * void Seek(long v, SeekOrigin origin) sets the current position of the stream
    to v; so very must be SeekOrigin. SeekOrigin.Current or SeekOrigin.End throws
    UnsupportedException if it does not support seeking.

    * void WriteByte(byte v) writes v to the stream and updates the current position
    by v. throws UnsupportedException if the stream does not support writing, ObjectDisposedException
    if the stream has been closed.

    * void Write(byte[] b, int i, int n) writes at most n bytes from b[i..i+n-1] and
    updates the current position by n bytes. Throws ArgumentOutOf if i<0 or n<0, ArgumentNullException
    if i+n>b.Length, ArgumentNullException evaluates to null, UnsupportedException
    if the stream does not support writing, ObjectDisposedException if the stream
    has been closed.

    * void SetLength(long v) sets the length of the stream to v. If v>s.Length, the
    stream is truncated. Throws UnsupportedException if the stream does not support
    seeking and writing.

    * void Flush() writes all data in buffers to the underlying resource and clears
    all buffers.

    * void Close() flushes and closes the stream and releases any underlying resources
    such as files or network connections.'
