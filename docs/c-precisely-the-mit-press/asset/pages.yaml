- pgno: 34
  md: '# 7.2 String Formatting


    When producing a string to the console, an output stream, the output string may
    contain numeric values, dates, and other values that require special formatting
    such as right or left justification, padding, and so on. The formatting can be
    specified using a format specification, which is a sequence of characters of one
    of these forms


    ```

    {index:code} {align:align} {index:code} {index}

    ```


    where index is a non-negative integer 0, 1..., specifying which value is to be
    formatted, and align is an integer value specifies the minimum number of characters
    in the resulting string. When align is positive, the string to be formatted is
    right-justified (padded on the left) if shorter than the minimum width, and when
    align is negative, the string to be formatted is left-justified (padded on the
    right) if shorter than the minimum width. The code is a formatting property (sections
    7.2.1 and 7.2.2).


    Let fmt be a string that contains one or more format specifications, and let v0,v1...,
    be values of any type:


    +   * String.Format(fmt, v0, v1, ...) of type String is fmt in which the format
    specifications with index 0, 1..., are replaced by the formatted string representations
    of v0, v1..., according to the format specifications in fmt.


    If the type of v is DateTime or a numeric type (section 5.1), the format specification
    {i,align} is replaced by the result of formatting vi using code, as shown in sections
    7.2.1 and 7.2.2 examples. Otherwise the format specification is replaced with
    vi.ToString(). In both cases, the resulting string is aligned as specified by
    align.


    The String.Format method throws a FormatException if the index of a format specification
    is less than 0 or greater than n, or if a formatting code in fmt is invalid.


    The String.format is usually not called explicitly but it is called implicitly
    from


    +   * Console.WriteLine(String fmt, Object v) and its overloads (example 26),
    and from other similar output methods (section 25)


    +   * AppendFormat(String fmt, Object v) and its overloads (section 8).


    String formatting is culture-sensitive: The actual characters used for decimal
    points, thousand separator, currency symbols, and so on, and the actual date formatting
    properties, weekday names, month names, and depend on the NumberFormat and DateTimeCulture
    properties of the current thread (example 30). The culture also affects the parsing
    of floating-point numbers. A culture is represented by an object of class Culture,
    and the culture of the current thread is either determined externally by the operating
    environment or explicitly in the source code. For instance, to use the predefined
    U.S. English culture:


    ```

    Thread.CurrentThread.CurrentCulture = new CultureInfo("en-US");

    ```'
