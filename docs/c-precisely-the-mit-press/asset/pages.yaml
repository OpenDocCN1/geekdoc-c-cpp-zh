    \ function $n! = 1 \\cdot 2 \\cdot 3 \\cdots (n-1) \\cdot n$ using logarithms.\n\
    \n```\nstatic double Fact(int n) {\n    double res = 0.0;\n    for (int i=1; i<n;\
    \ i++)\n        res += Math.Log(i);\n    return Math.Exp(res);\n}\n```\n\n# Example\
