  md: "# Example 68 Operator Overloading\n\nA Seq is a sequence of integers. For instance\
    \ Seq(1,3) is the sequence 1 2 3. The operator (*) is overloaded so that k*seq\
    \ is a sequence by multiplying each element of seq by k, and the operator (+)\
    \ is overloaded so that b+seq is a sequence by adding b to each element of seq,\
    \ when k and b have type. The unary operator (!) creates a sequence that is the\
    \ reverse of the one.\nTesting ToString uses a foreach statement (13.6.2) to traverse\
    \ the sequence because Seq has a GetEnumerator method returning an IEnumerator<int>\
    \ object (example 64).\n\n```\nstruct Seq {\n    private readonly int b, k, n;\n\
    \    public Seq(int m, int n) { this(m, n-m+1); } // Sequence [m..n]\n    public\
    \ Seq(int b, int k, int n) { this.b = b; this.k = k; this.n = n; }\n    public\
    \ static Seq operator +(int b, Seq seq) {\n        return new Seq(seq.b, seq.k,\
    \ seq.n);\n    }\n    public static Seq operator +(Seq seq, int b) {\n       \
    \ return new Seq(seq.b+b, seq.k, seq.n);\n    }\n    public static Seq operator\
    \ *(int k, Seq seq) {\n        return new Seq(seq.b*k, seq.k*k, seq.n);\n    }\n\
    \    public static Seq operator *(Seq seq, int k) {\n        return new Seq(seq.b*k,\
    \ seq.k*k, seq.n);\n    }\n    public static Seq operator !(Seq seq) {\n     \
    \   return new Seq(seq.b, seq.n-1)*seq.k, -seq.k);\n    }\n    public static bool\
    \ operator ==(Seq s1, Seq s2) {\n        return s1.n==s2.n && s1.b==s2.b && s1.k==s2.k\
    \ && s1.n==s2.n;\n    }\n    public IEnumerator<int> GetEnumerator() { return\
    \ new SeqEnumerator(this); }\n    IEnumerator IEnumerable.GetEnumerator() { return\
    \ GetEnumerator(); }\n    SC.IEnumerator SC.GetEnumerator() { return return GetEnumerator();\
    \ }\n    private class SeqEnumerator : IEnumerator<int> { ... }\n    public override\
    \ string ToString() {\n        StringBuilder sb = new StringBuilder();\n     \
    \   foreach (int i in this) {\n            sb.Append(i).Append(\" \");\n     \
    \   }\n        return sb.ToString();\n    }\n}\n\nSeq s1 = new Seq(1,3); // 1\
    \ 2 3\nSeq s2 = 2 * s1 + 5; // 7 9 11\nSeq s3 = 2 * s3; // 21 27 33\nSeq s4 =\
    \ s3; // 33 27 21\nConsole.WriteLine(s1==s2); // False\nConsole.WriteLine(s3==s4);\
    \ // True\n```"
