- pgno: 70
  md: 'The Machine Model: Stack, Heap, and Garbage Collection


    # 11 The Machine Model: Stack, Heap, and Garbage Collection


    The machine model describes how data are stored and manipulated at run-time during
    the execution of a C# program. It has two main components:


    +   - The Stack, which is divided into frames. A frame has room for the local
    variables and parameters of one invocation of method. A new frame is created when
    the method is called, and thrown away when the method returns. Thus at any point
    in time, the frames on the stack correspond to those methods that have been called
    but have not yet returned.

    - The heap stores objects, arrays, and aggregates. These data are automatically
    removed from the heap by a garbage collector when they are no longer needed by
    the program. The space can be reused for other data. There is no way to explicitly
    remove anything from the heap, not even by calling a so-called destructor (which
    is not the same as in C++).


    In fact, there is a separate stack for each thread (section 21), but only one
    heap shared among all threads. The various values used in C# are stored as follows:


    +   - All objects, arrays, and delegates are stored in the heap. If an array''s
    element t is a simple type, each array element directly contains its value. If
    t is a reference type, then each array element contains null or a reference to
    an object, array, or delegate elsewhere in the heap. If t is a struct type, then
    each array element directly contains the struct value, that is, has room for its
    instance fields.

    - Local variables and parameters are stored on the stack. A local variable of
    simple type contains its value. A local variable of reference type contains null
    or a reference to an object, or delegate stored in the heap. A local variable
    of struct type directly contains the struct, that is, has room for its instance
    fields.


    # 11.1 Class and Object struct Type and Struct Value


    At run-time, a class is represented by a chunk of storage, set aside when the
    class is loaded. The representation of a class contains the name of the class
    and all the static fields of the class (see the illustration in example 51). At
    run-time, an object (instance of a class) is allocated in the heap and has two
    parts: an identification of the run-time class C of object, which is the class
    used when creating it; and room for all the instance fields of the object. The
    class identification is used when evaluating instance test expressions (section
    12.13), and array element assignments (section 9.1).


    At run-time, a struct type is represented very much like a class: the representation
    of a struct type contains the name of the struct and all the static fields of
    the struct type. At run-time, a struct value (instance of a struct type) is allocated
    on the stack or as part of an array or object in the heap. Like an object the
    struct value has room for the instance fields of the struct, but unlike an object
    it contains no indication of its struct type.'
