  md: '# Asynchronous Methods: async and await (C# 5.0)


    # 23 Asynchronous Methods: async and await (C# 5.0)


    Asynchronous methods build on the Task and Task<T> classes to simplify the definition
    and composition of operations such as remote servers, user interactions, and heavy
    computations.


    The async method modifier is used to declare (section 10.7) an asynchronous method:


    ```

    async method-modifiers rentype Task async

    method-body

    ```


    An asynchronous method must return type Task or Task<T> (section 22.2) or ref
    or out parameters. By convention, the name of an asynchronous method should end
    in Async.


    Similarly, a delegate or lambda expression preceded by the async keyword will
    be asynchronous.


    A call to an asynchronous method executes synchronously, from the caller''s thread,
    until it evaluates an await expression (see below) when e is not a completed task.
    At this point the asynchronous method returns to the caller, while the task resulting
    from e is executing asynchronously.


    An asynchronous method with return type Task<T> can return only e, where the expression
    has type T. The return value of e can be retrieved using the Result property of
    the task produced by the asynchronous method. An asynchronous method with return
    type Task or void may contain return statements, but these cannot have expression
    arguments.


    The Task or Task<T> has the facilities for awaiting the completion of one or more
    tasks (Wait, When, WhenAll), for obtaining the result of a task (Result), and
    so on (section 22.2). A call to an asynchronous method may be the argument of
    a further await expression in an expression.


    An asynchronous method has this form:


    ```

    await e

    ```


    where e is an expression of type Task or Task<T> and must be non-null. When e
    has type Task<T>, the await expression has type T, and when e has type Task, the
    await expression has type void. The effect of the await expression is to create
    and start a task that (1) evaluates e to a started task, (2) awaits the completion
    of that task, and (3) continues with the rest of the asynchronous method.


    Roughly, the C# compiler replaces await with an expression e.ContinueWith(result),
    where result is a delegate representing the remainder of the asynchronous method.
    For instance, example 7 is equivalent to what is in page 172. This explanation
    is too simplistic because the await expression may be expressed in one or more
    loops. To cover cases, an asynchronous method is implemented as a state machine,
    like the iterator methods in 13.12, but using a TaskAwaiter class (not described
    in this book).


    An await expression can appear only inside an asynchronous method, delegate, or
    lambda expression and not inside a catch or finally block, a lock statement, or
    a nested synchronous delegate or lambda expression.


    An exception thrown by an asynchronous method will not be propagated to the caller
    but will be encapsulated in an AggregateException when Wait or Result is called
    on the task returned from the asynchronous method. An exception thrown by a void
    asynchronous method may remain unreported.


    For more information about asynchronous methods, see the resources in section
    34,'
