  md: "# Task Parallel Library (C# 4.0) 141\n\n### Example 174 Task Cancellation\n\
    To allow a task to be canceled, one must create a cancellation token source cts\
    \ and pass the cancellation cts.Token to the method that creates the task. Moreover,\
    \ the task itself must acknowledge cancellation by throwing OperationCanceledException\
    \ with the token as argument. If the task's for cancellation requests were removed,\
    \ it would keep running and eventually reach RanToCompletion.\n\n```\npublic static\
    \ void ComputeTaskWithAcknowledgement(CancellationToken token) {\n    for (int\
    \ i=0; i=100000000; i++) token.ThrowIfCancellationRequested();\n}\n\nCancellationTokenSource\
    \ cts = new CancellationTokenSource();\nCancellationToken token = cts.Token;\n\
    Task task = Task.Run(() => ComputeTaskWithAcknowledgement(token), token); // Running\n\
    cts.Cancel(); // Canceled\ntask.Wait(); // Would throw AggregateException containing\
    \ TaskCanceledException\n```\n\n### Example 175 Exceptions in Tasks\nIf a running\
    \ task throws an exception (other than an OperationCanceledException that acknowledges\
    \ cancellation), it will complete in the Faulted state. Calling Wait() or Result\
    \ on the task will throw an AggregateException whose InnerExceptions contains\
    \ the exception thrown by the task.\n\n```\nTask task = new Task(delegate { throw\
    \ new Exception(\"died\"); }); // Created\ntask.Start(); // WaitingOr or Faulted\n\
    task.Wait(); // Would throw AggregateException containing Exception(\"died\")\n\
    ```\n\nTask States and Task Transitions Enum TaskStatus from namespace System.Threading.Tasks\
    \ describes task state. A task is completed in one of the last three states, and\
    \ faulted in the last state.\n\n| Task State | Meaning |\n|---|---|\n| Created\
    \ | Created by a Task constructor, but not started |\n| WaitingForActivation |\
    \ Waiting to be activated and scheduled internally |\n| WaitingToRun | Scheduled\
    \ but not yet running |\n| Running | Running but not yet completed |\n| RanToCompletion\
    \ | Completed successfully |\n| Canceled | Canceled before running, or acknowledged\
    \ its cancellation |\n| Faulted | Completed due to anhandled exception |\n\n![](img/0895719d2f186cd73b49fccec3a97f1f_153_0.png)"
