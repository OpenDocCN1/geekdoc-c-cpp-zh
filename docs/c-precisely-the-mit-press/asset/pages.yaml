    , 49); // ArgumentException\nbool b1 = dict.Remove(\"Greece\"); // False (but\
    \ no exception)\nbool b2 = dict.Remove(\"Japan\"); // True\nPrint(dict.Keys);\
    \ // Sweden Germany\nbool b3 = dict.Contains(\"Germany\"); // True\ndict[\"Sweden\"\
    ] = 45; // No exception\nConsole.WriteLine(\"Sweden\"); // 45\n```\n\n# Example\
    \ 230 Fast Set Membership Test: Use a Hash Set or Binary Search?\n\nTo exclude\
    \ keywords (section 2) from the file index in example 225 would require a fast\
    \ way to recognize names. Method IsKeyword uses a HashSet built from a 77-element\
    \ array of C keywords, and method IsKeyword2 binary search in the sorted array.\
    \ The HashSet is more than ten times faster than the binary search in this case.\n\
    \n```\nstatic readonly string[] keywordarray = \n{ \"abstract\", \"as\", \"base\"\
    , \"bool\", \"break\", \"byte\", ..., \"while\" };\nstatic readonly HashSet<string>\
    \ keywords = new HashSet<string>();\n\nstatic bool IsKeyword(string id) { return\
    \ keywords.Contains(id); }\nstatic bool IsKeyword2(string id) { return Array.BinarySearch(keywordarray,\
    \ id) >= 0; }\n```\n\n# Example 231 Using a Set as a Key in Dictionary\n\nThe\
    \ standard algorithm for turning a non-deterministic finite automaton (NFA) into\
    \ a deterministic finite automaton (DFA) creates composite states that are sets\
    \ of integers. It is preferable to replace composite types with integers. This\
    \ method takes as argument a collection of composite states and returns a renamer,\
    \ which maps a composite state to a Set<int> from example 226 providing element-based\
    \ hash codes) to a simple state name (an int).\n\n```\nstatic Dictionary<Set<int>,\
    \ int> MkRenamer(ICollection<Set<int>> states) {\nIDictionary<Set<int>, int> renamer\
    \ = new Dictionary<Set<int>, int>();\nint count = 0;\nforeach (Set<int> k in states)\n\
    renamer.Add(k, count++);\ntreturn renamer;\n}\n```"
