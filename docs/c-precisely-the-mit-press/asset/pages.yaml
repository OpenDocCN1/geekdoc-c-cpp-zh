  md: '# 10.11 Constructor Declarations


    The purpose of an instance constructor in class C is to initialize a new object
    (instance) of the class. A constructor-declaration in class C has the form


    ```

    constructor-modifier (formal-list)

    constructor-body

    ```


    The constructor-modifier is one of the member access modifiers (section 10.3),
    and the formal-list is as a method (section 10.7). A constructor cannot be abstract
    or sealed. For the static constructor, see 10.12. A constructor has no return
    type.


    Instance constructors may be overloaded in the same way as methods: the constructor
    signature (a list of the parameters in formal-list) is used to distinguish constructors
    in the same class. A constructor may call another overloaded constructor in the
    same class using the syntax


    ```

    constructor-modifier (formal-list) : this(actual-list)

    constructor-body

    ```


    but a constructor may not call itself, directly or indirectly. The argument expressions
    in actual-list are static code and cannot use the object reference this or any
    instance member of class C, but can use the parameters from formal-list.


    The constructor-body is a block-statement (section 13.2) and may contain statements
    with declarations of variables. The constructor-body may contain return statements,
    but no return statement can take an argument expression.


    A class that does not explicitly declare a constructor implicitly declares a public,
    default constructor whose only action is to call the base class constructor (section
    10.4):


    ```

    public C() : base() {

    ```


    When new creates a new object in the computer store (section 12.9), a constructor
    is called to initialize the fields of the class. The first initializers of the
    object''s instance fields are executed, in order of appearance in the class declaration.
    Then either constructor this(...) in the same class or base class constructor
    base(...) is called (explicitly or implicitly; see examples 62 and 98). Finally,
    the body of the constructor is executed (example 63).


    The call to a base class constructor will cause a call to a constructor in its
    base class, and execution of its instance initializers, and so on, until the constructor
    Object().


    # 10.12 Static Field Initialization and the Static Constructor


    A static field of an object may be initialized by a static field initializer (section
    10.5) or by a parameterless static constructor, declared as follows:


    ```

    static C()

    block-statement

    ```


    See example 56. All static initializers are executed, in order of appearance in
    the class declaration, when the class is loaded. Then the body of the static constructor
    (if any) is executed. If the execution of a static field initializer or a static
    constructor throws an exception (section 20), then a TypeInitializationException
    is thrown instead, and the class is not loaded.'
