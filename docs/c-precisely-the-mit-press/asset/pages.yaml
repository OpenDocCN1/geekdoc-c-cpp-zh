- pgno: 24
  md: '# Data and Types


    # 5.3.2 Standard Conversions between Reference Types or Type Parameters


    If ts and tt are types, then a standard implicit conversion from ts to tt exists
    in these cases:


    +   - ts is a reference type and tt is the class Object;

    - ts and tt are class types or interface types, and ts is derived from tt (section
    10.4); or

    - ts is a class type and tt is an interface implemented by ts or one of its base
    classes; or

    - ts and tt are arrays with the same number of dimensions, their elements are
    reference types, and there is an implicit conversion from the element type of
    ts to the element type of tt; or

    - ts is an array and tt is Array, or ts is a delegate and tt is Delegate;

    - ts is t[j] or IList<t> with an implicit conversion from u to o; or

    - ts is the type of the null expression and tt is a reference or a nullable type
    (section 19); or

    - ts is a type parameter (section 26.2) and tt a type bound for that parameter.


    If ts and tt are types, then a standard explicit conversion from ts to tt exists
    in these cases:


    +   - ts is the class Object and tt is a reference type; or

    - ts and tt are class types, and tt is derived from ts; or

    - ts is a non-sealed class type and tt is an interface, and ts does not implement
    tt; or

    - ts is an interface and tt is a class type, and tt is not sealed or else tt implements
    ts; or

    - ts and tt are interfaces and ts does not implement tt; or

    - ts and tt are arrays with the same number of dimensions, their elements are
    reference types, and there is an explicit conversion from the element type of
    ts to the element type of tt; or

    - tt is an array and tt is Array, or ts is a delegate and tt is Delegate; or

    - ts is IList<t> and tt is u[j] and there is an implicit conversion from u[j]
    to IList<t>; or

    - tt is a type parameter (section 26.2) and ts a type bound for that parameter.


    A standard implicit or explicit conversion from one reference type to another
    does not change the given reference value, nor does it produce a new one; only
    the compile-time type of the reference is affected.


    # 5.3.3 Boxing and Unboxing Conversions


    A standard boxing conversion is an implicit conversion from a value type ts to
    Object or to an interface type implemented by ts. A boxing conversion creates
    a copy of the value in the heap, including an indication of its ts (section 14.1).
    This permits values of simple types and struct types to be stored in non-generic
    collections. However, generic collections should be preferred for type safety
    and efficiency (section 26.6).


    An unboxing is an explicit conversion (tt) from a reference v of type Object or
    interface type ts to a value tt that implements ts. An unboxing conversion first
    tests whether the type stored in the boxed object v is tt. If this is not so,
    or v is null, it throws InvalidCastException; otherwise it copies the value of
    v.


    # 5.3.4 User-Defined Conversions


    A class or struct may declare implicit and explicit conversions for that type
    (section 10.18).'
