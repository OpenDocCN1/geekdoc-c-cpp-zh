  md: "# Classes 37\n\n**Example 45** Classes, Subclasses, and Overriding\nThe abstract\
    \ class Vessel the concept of a vessel for holding liquids: its field contents\
    \ represents its actual contents, the abstract method Capacity computes its maximal\
    \ capacity, and method Fill fills in more, but only up to its capacity; the abstract\
    \ class Tank (a rectangular vessel), Cube (a cubic vessel, subclass of Tank) and\
    \ Barrel (a cylindrical vessel). The subclasses implement the Capacity method;\
    \ they inherit the field and the Fill method from the base class, and they override\
    \ the toString method (inherited from class Object) to format each vessel object.\n\
    \n```\npublic abstract class Vessel {\n    private double contents;\n    public\
    \ abstract double Capacity();\n    public void Fill(double amount) { contents\
    \ = Math.Min(contents + amount, Capacity()); };\n    public double Contents()\
    \ { return contents; }\n}\npublic class Tank : Vessel {\n    protected readonly\
    \ double length, width, double height;\n    public Tank(double length, double\
    \ width, double height) {\n        this.length = length;this.width = width;this.height\
    \ = height;\n    }\n    public override double Capacity() { return length * width\
    \ * height; }\n    public override String toString() {\n        return \"tank\
    \ \" + length + \", \" + width + \", \" + height + \");\n    }\n}\npublic class\
    \ Cube : Tank {\n    public Cube(double side) : base(side, side, side) {}\n  \
    \  public override String toString() { return \"cube \" + side + \"); }\n}\npublic\
    \ class Barrel : Vessel {\n    private readonly double radius, height;\n    public\
    \ Barrel(double radius, double height) { this.radius = radius;this.height = height;\
    \ }\n    public override double Capacity() { return Math.PI * radius * radius;\
    \ }\n    public override String toString() { return \"barrel (\" + radius + \"\
    , \" + height + \"); }\nn\n```\n\n**Example 46** Member Access Modifiers\nThe\
    \ member access modifiers in the Vessel hierarchy (example 45) are justified as\
    \ follows: (1) the contents field in Vessel is private to prevent modification,\
    \ (2) a public property Contents reads the field, and (3) the fields of Tank and\
    \ Barrel are declared to protect access from subclasses.\n    Since the fields\
    \ in Vessel is private, it is not accessible in the subclasses (Tank, Barrel,\
    \ ...), but the subclasses inherit the field. Every subclass has room for storing\
    \ the field, but can change and access it only by using the Fill method or the\
    \ Contents property inherited from the abstract base class."
