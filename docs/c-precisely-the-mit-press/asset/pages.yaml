  md: '# 13.6 Loop Statements


    # 13.6.1 The for Statement


    A statement has the form


    ```

    for (initialization; condition; step)

    ```


    body


    where initialization is a local variable declaration (section 13.4) or a possibly
    empty comma-separated list of method call expressions, assignment expressions,
    object creations, increment expressions, and decrement expressions; condition
    is an expression of type bool; step is a possibly comma-separated list of the
    same kinds of expressions allowed for initialization; and body is a statement
    but not a declaration statement or a labeled statement. Comma-separated lists
    of expressions are evaluated from to right when the list is evaluated. The initialization,
    condition and step may be empty. An empty condition is equivalent to true. Thus
    for (;;) body means “forever execute body.”


    +   1. The initialization is executed.

    2. The condition is evaluated. If it is false, the loop terminates.

    3. If it is true, then


    +   (a) the body is executed;

    (b) the step is executed;

    (c) execution continues at 2.


    # 13.6.2 The foreach Statement


    A foreach statement has the form


    ```

    foreach (type x in expression)

    body

    ```


    where the expression must be enumerable, and its enumerators produce elements
    that can be explicitly converted to type. The body must be a statement but not
    a declaration statement or a labeled statement. If the keyword was used instead
    of type, then the compiler infers the type of x from the element type of the enumerable
    expression (section 6.3).


    First the expression is evaluated to obtain an enumerator. Then the body is evaluated
    for each element produced by the enumerator, with variable x bound to the result
    of converting the element to type, possibly by an unboxing conversion. If the
    element cannot be converted to type, an InvalidCastException is thrown. The scope
    of local variable x is body, and the body is read-only; it cannot be assigned
    to or as a ref or out parameter. The body should not modify the enumerator or
    any data under the enumerator. The expression of type t is enumerable in the following
    cases:


    +   * In particular, class Array and hence all array types (section 9) implement
    IEnumerable, and array type T implements IList<U> implement IEnumerable<U> whenever
    T[] is implicitly convertible to U[].

    * It implements a public instance method GetEnumerator() with return type that
    must implement both a public instance method Next() with return bool and a public
    instance property Current, as required by interface IEnumerator (section 27.2).
    See examples 64 and 68.


    +   *'
