    the compile-time target type is A, and the target object''s run-time class is
    E. As seen, if a method is a non-virtual instance method in the compile-time target
    type, then only the compile-time type matters: ae.M2() calls M2 in A although
    the target object''s run-time class is E. When the method is virtual or abstract
    in the compile-time target type, the target object''s class methods: .M2() calls
    M2 in class E is marked in the compile-time target type D, and the target object''s
    class is E.


    For virtual instance methods, note that method M5 in E is an override M3 in D,
    but not M3 in C. The reason is the modifier new virtual in class D, which hides
    the inherited from C.


    ```

    A.M1(); B.M1(); C.M1(); D.M1(); E.M1(); // A.M1 A.M1 C.M1 C.M1

    E = new E(); D = de; C = ce; B = be; Ae = ae; ee =;

    ae.M2(); be.M2(); ce.M2(); de.M2(); ee.M2(); // A.M2 A.M2 C.M2 E.M2 E.M2

    ae.M3(); be.M3(); ce.M3(); de.M3(); ee.M3(); // C.M3 C.M3 E.M3 E.M3

    ab = new B(); A = new C();

    ab.M2(); ac.M2(); // // A.M2 A.M2 A.M2

    ab.M3(); ac.M3(); // // A.M3 C.M3 C.M3

    ab.M4(); ac.M4(); // // B.M4 B.M4 E.M4

