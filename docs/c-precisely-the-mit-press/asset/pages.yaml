  md: "# 13.6.3 The while Statement\n\nA while statement has the form\n\n```\nwhile\
    \ (condition)\n  body\n```\n\nwhere the *condition* is an expression of type bool,\
    \ and *body* is a statement but not a declaration statement or a labeled statement.\
    \ The while statement is executed as follows:\n\n+   1. The *condition* is evaluated.\
    \ If it is false, the loop terminates.\n2. If it is true, then\n  (a) the *body*\
    \ is executed;\n  (b) execution continues at 1.\n\nAn infinite loop can be written\
    \ *while (true) body*, which may be clearer than the “forever” idiom for (;;)\
    \ *body* shown in 13.6.1.\n\n# 13.6.4 The do–while Statement\n\nA do–while statement\
    \ has the form\n\n```\ndo\n  while (condition);\n```\n\nwhere *condition* is an\
    \ expression of type bool, and *body* is a statement but not a declaration statement\
    \ or a labeled statement. The do-while statement is executed as follows:\n\n+\
    \   1. The *body* is executed.\n2. The *condition* is evaluated. If it is false,\
    \ the loop terminates.\n3. If it is true, execution continues at 1.\n\nThe body\
    \ is always executed at least once because the *condition* is tested only after\
    \ executing the *body*. This also means that the *condition* does not contribute\
    \ to establishing a prethat that guarantees successful execution of the *body*.\
    \ Usually it is safer and more appropriate to use a while loop or for loop, which\
    \ do test the *condition* before executing the *body*."
