  md: '# 25.4 Sequential Input: TextReaders


    The abstract class TextReader and its subclasses StringReader and StreamReader
    are used for character-oriented input. In addition to the classes shown here,
    see the corresponding Writer classes (section 25.5). The standard input stream
    Console. is a TextReader(example 183). The TextReader class has the following
    methods:


    +   * Read() reads the reader from the stream and returns it. Returns -1 on end-of-stream.

    * Read(char[] b, int i, int n) reads n characters into b[i..(i+n-1)] and returns
    the number of characters read. Returns immediately if n is 0. Returns 0 on end-of-stream.
    Throws ArgumentOutOfRangeException if i<0 or n<0, ArgumentException if i+n>b.length,
    and ArgumentNullException if b is null.

    * ReadBlock(char[], int i, int n) works until blocks until n characters are read
    or end-of-stream is reached.

    * ReadLine() returns the next line from the stream. Returns null at end-of-stream.

    * ReadToEnd() returns the characters from the current position to end-of-stream.
    Returns -1 on end-of-stream.

    * Peek() returns the character without advancing the stream.

    * void Close() closes the reader and the underlying stream. Any subsequent operation,
    except Close, will throw ObjectDisposedException.


    # 25.4.1 Sequential Character Input from a Byte Stream or File: StreamReader


    A StreamReader is a character input stream that reads characters from a byte stream
    or from a file. StreamReader converts bytes from the underlying stream or file
    into character encoding. The input operations are buffered for efficiency. It
    has the same methods as TextReader (section 25.4) and also these constructors
    and property:


    +   * StreamReader(Stream s) creates a character input stream (from a reader)
    by byte stream s, using UTF-8 encoding.

    * StreamReader(Stream s, Encoding enc) works similarly but with enc as encoding.

    * StreamReader(String filename, Encoding enc) creates a character input stream
    with the named file on the file system, using UTF-8 encoding. Throws FileNotFoundException
    if the file cannot be found, DirectoryNotFoundException if filename is null, ArgumentNullException,
    ArgumentException if it is the empty string, and IOException if it contains invalid
    path or name characters.

    * StreamReader(String filename, Encoding enc) works similarly but uses character
    encoding enc.

    * Read-only property CurrentEncoding.Encoding of Type is the name of the character
    encoding used by this StreamReader, for instance, "Unicode (UTF-8)".


    Examples 137, 139, 185, 186, and 225 present various ways to use StreamReader
    and TextReader.'
