  md: "# 26.10 Generic Struct Types\n\nA declaration of a generic type struct S<T1,...,Tn>\
    \ is very similar to the declaration of a generic class.\nIt has one of these\
    \ forms:\n\n```\nstruct-modifiers struct S<T1,...,Tn> struct-interfaces\n    struct-body\n\
    ```\n\nIn both cases, the T1,...,Tn are type parameters as for generic classes\
    \ (section 26.3), and the struct-modifiers and struct-body are for non-generic\
    \ struct types (section 14). The parameter-constraints are as for generic classes\
    \ (section 26.4).\n\nA type constructed from the generic struct has form S<t1,...,tn>,\
    \ where the t1,...,tn are types. The t1,...,tn must satisfy the parameter-constraints\
    \ on the generic struct, if any, as described in section 26.4.\n\nGeneric struct\
    \ types are used in the generic collection library, for instance to represent\
    \ key/value pairs in dictionaries (section 27.8 and example 221).\n\n# 26.11 The\
    \ Implementation of Generic Types and Methods\n\nGeneric types and methods in\
    \ C# type templates and function templates, resemble generic types and methods\
    \ in Java 1.5. However, the design and implementation of C# generics provide better\
    \ safety and less code duplication than C++ templates, but better performance\
    \ and more features than Java 1.5 generic types and methods.\n\nIn C# type declaration\
    \ or generic method declaration can be fully type-checked before any constructed\
    \ type is created for type arguments, and then the typecheck is valid for all\
    \ possible arguments. Hence type errors are discovered as early as possible. In\
    \ C++ a class template or function template cannot be type-checked before a instance\
    \ is created for generic parameters, and the typecheck must be performed for every\
    \ set of generic parameters.\n\nIn each constructed struct, such as Pair<double,\
    \ int> (see Pair in example 214), principle gives rise to a new type (in the run-time\
    \ system) with its own field layout; this permits unbounded storage of fields.\
    \ To save space and code duplication, every of argument types will share the same\
    \ field layout; all references have the same size regardless of. Thus the two\
    \ constructed types Pair<Object, String> and Pair<String, String> have the same\
    \ field layout. On the other hand, combinations of argument types that vary require\
    \ different field layouts at run-time, values of different value types take different\
    \ amounts of memory. For instance, the constructed struct Pair<double, int> and\
    \ Pair<int, int> have different field layouts.\n\nThis implementation for C# has\
    \ the considerable advantage that it permits generic types and methods to handle\
    \ value types unboxed, which reduces memory usage and increases speed. By contrast,\
    \ the Java 1.5 implementation of generics uses boxed representation of all values\
    \ type parameters, which requires costly boxing, here references, and when accessing\
    \ the values.\n\nOn the other hand, the C# implementation has the disadvantage\
    \ that it may cause code duplication (at run-time), but this problem is much less\
    \ pronounced than C++ templates."
