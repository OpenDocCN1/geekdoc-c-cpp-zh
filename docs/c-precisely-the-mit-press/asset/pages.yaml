  md: "# Classes 53\n\nExample 66 Property Used to Access a Log\nClass Log implements\
    \ a simple log that stores the SIZE strings written to it. The static property\
    \ InstanceCount is the total number of Log objects created. Property Count is\
    \ the number of log entries written to this log. Property Last is the latest string\
    \ logged to this log. It has a set- as well as get-accessors, so one can use assignment\
    \ operators over log.Last += \"...\". All returns an array of the (up to) SIZE\
    \ strings created. Example 103 uses these properties. Example 199 shows how to\
    \ declare automatically implemented properties Count and InstanceCount instead.\n\
    \n```\npublic class Log {\n    private static int instanceCount = 0;\n    private\
    \ int count = 0;\n    private String[] log = new String[SIZE];\n    public Log()\
    \ { instanceCount++; }\n    public static int InstanceCount { get { return instanceCount;\
    \ }}\n    public void Add(String msg) { log[count++ % SIZE] = msg; }\n    public\
    \ int Count { get { return count; }\n    public String Last {\n        get { //\
    \ Returns the last log entry, or null if not logged yet\n            return count==0\
    \ ? null : log[(count-1)%SIZE];\n        }\n        set { // Updates the log entry,\
    \ or creates one if not logged yet\n            if (count==0)\n              \
    \  log[count++] = value;\n            else\n                log[(count-1)%SIZE]\
    \ = value;\n        }\n    }\n    public String[] All { ... }\n}\n```\n\nExample\
    \ 67 Sparse Matrix Indexing\nA sparse matrix has many zeros. A sparse matrix may\
    \ be represented as an array of columns, where each column is an array list (section\
    \ 27.6) of only the non-zero elements. Using a two-argument index, one can get\
    \ and set its elements as A[i,j], as if it were one rectangular array. The indexer\
    \ performs a linear search of column j for the element index i; this may surprise\
    \ users because the array-like notation suggests constant time.\n\n```\npublic\
    \ double this(int i, int j) {\n    get {\n        List<NonZero> col = this[j];\n\
    \        int k = 0;\n        while (k < col.Count && col[k].i < i)\n         \
    \   k++;\n        return k < col.Count && col[k].i == i ? col[k].Mij : 0.0;\n\
    \    }\n    set { ... }\n}\n```"
