  md: '# Generic Types and Methods 179


    Example **217** Variance in Predefined Interfaces

    Notable predefined interfaces with covariant type parameters are IEnumerable<out
    T> (section 27.2) because it only outputs values of T, and IEnumerable<out T>
    because it only outputs something that only outputs values of type T. Notable
    predefined interfaces with contravariant type parameters are the comparison interfaces
    (27.3) because they only input values of type.


    ```

    interface IEnumerator<out T> { T Current { get; } ... }

    interface IEnumerator<out T> { IEnumerable<T> GetEnumerator(); }

    interface IComparable<in T> { int Compare(T v1, T v2); }

    interface IComparable<in T> { int Compare(T v); ... }

    interface IEquality<in T> { bool Equals(T v1, T v2); int GetHashCode(T v); }

    interface IEquatable<in T> { bool Equals(T v); ... }

    ```


    If Class is a subclass of Person, then IEnumerable<Student> is a subclass of IEnumerable<Student>.
    Whenever a stream of Person objects is expected, as in method Persons, a stream
    of Student objects can be used; and whenever a comparator of Student objects is
    expected, as in method Sorted, a comparator of Person objects can be used.


    ```

    class Person { ... }

    class Student : Person { ... }

    class PersonComparer : IComparer<Person> { ... }


    static void PrintPersons(IEnumerable<Person> ps) { ... }

    static bool Sorted(IComparable<Student> cmp, Student[] a) { ... }


    Student[] students = { new Student("Daniel"), ... , new Student("Vincenzo") };

    IEnumerable<Student> ss = students;

    PrintPersons(ss);

    PrintPersons(students);

    bool sorted = Sorted(new PersonComparer(), students);

    ```


    # Example **218** Variance in Predefined Delegate Types


    The Func and action families of generic delegate types are contravariant (in)
    in their arguments and covariant (out) in their return types.


    Let Student be a subclass of Person as in example 217, and let ColoredPoint be
    a subclass of Point as in example 147. Func<Person,ColorPoint> is a subtype of
    Func<Point,Point>. Whenever one expects a function from Student to Point, a function
    pc from Person to Color will do.


    Also, Func<Func<Student,Point>,int> is a subtype of Func<Func<Person,ColoredPoint>,int>.
    When one expects a function fpi that takes a Person-to-ColoredPoint function to
    apply to fpc, it must be because there is a Person-to-ColoredPoint function to
    apply to fpc, and there a function fpi that takes a Student-to-Point function
    will do instead.


    ```

    Func<Person,ColoredPoint> pc = (Person p) => ColoredPoint(2, p.name.Length, Color.Red);

    Func<Student,Point> sp = pc;

    Func<Func<Person,Point>,int> fpi = (Func<Student,Point> fsp) = fsp(new Student("Lise")).y;

    Func<Func<Person,ColoredPoint>,int> fpc = fpi;

    ```


