    **Example 71** Heap, Objects, Arrays, Structs, and Assignment

    The assignment p = q of a variable of reference type (class Point, example 43)
    copies only the reference.

    After p and q point to the same object, the assignment to p.x affects q.x. Likewise
    for the array assignment arr2 = arr1. By contrast, an assignment r = s of a variable
    type (Spoint, example 142) copies the struct from s to r; hence the later assignment
    to r.x does not affect s.x.

    When method M2 calls itself recursively, the stack maintains a separate copy of
    local variables and parameters (here just i) for each unfinished call of the method.


