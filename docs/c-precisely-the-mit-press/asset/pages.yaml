    # 25.8 Directories


    Classes Directory and DirectoryInfo implement methods for manipulating directories.
    Class Directory provides static methods, and class DirectoryInfo provides similar
    methods. Every call to a Directory method incurs a security check, whereas DirectoryInfo
    instance may be null to save some checks.


    +   * Directory.GetCurrentDirectory() of type String returns the string representation
    of the working directory.

    * DirectoryInfo(String path) creates a new DirectoryInfo object with the associated
    path name. Throws DirectoryNotFoundException if the directory does not exist.


    Let d be a variable of type DirectoryInfo:


    +   * d.Name of type String is the name of d.

    * d.Parent of type DirectoryInfo is the parent directory of d, or null if d is
    a root directory.

    * d.GetDirectories() of type DirectoryInfo[] returns the subdirectories of d.

    * d.GetFiles() of type FileInfo[] returns the files in d.


    # 25.9 Files


    An object of FileInfo represents a file, which is a file name in the file system.
    The file name may denote a file or nothing at all (if there is no file or path
    of that). Even if the file name denote a file, a given program may have the permission
    to read or write to that, or to read a directory on the path to the file. These
    are few of the constructors and methods in class FileInfo:


    +   * FileInfo(String name) creates a file name corresponding to the path name,
    which may be relative or absolute. ArgumentException if name is an empty string
    or has an invalid format, ArgumentNullException if name is null, PathTooLongException
    if the name or length is too long, UnauthorizedAccessException or SecurityException
    if the caller does not have permissions.

    * Read-only property Ex is true if a file exists by this file name; otherwise
    false.

    * Read-only property Name and FullName of type String are the file''s name and
    its full path.

    * Read-only property Extension of type String is the file''s extension including
    its leading period (), or the empty string if there is no extension.

    * Read-only property Length of type long is the length of the file in bytes.

    * FileStream Create() creates a new file and returns a FileStream associated with
    it.

    * void Delete() deletes the file if it exists; otherwise does nothing.

    * FileStream OpenRead() creates a FileStream associated with the file for reading.

    * FileStream OpenWrite() creates a FileStream associated with the file for writing.

    * StreamReader OpenText() creates a StreamReader associated with the file for
    reading.

    * StreamWriter AppendText() creates a StreamWriter for appending text to the file.

    * StreamWriter CreateText() creates a new file and returns a StreamWriter for
    writing to it.'
