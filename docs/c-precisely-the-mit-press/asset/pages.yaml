  md: '# 12.9 Object Expression


    The object creation expression


    ```

    new C (actual-list)

    ```


    creates a new object of non-abstract constructor call to initialize the actual-list,
    a (possibly empty) comma-separated list of expressions. matches the argument types
    in actual-list,


    The actual-list is evaluated from left to right to obtain a list of arguments.
    These argument values are bound to the constructor''s parameters, an object of
    the class is created in the computer''s store, instance fields get default initial
    values according to their type, a base constructor is called (explicitly or implicitly:
    see examples 62 and 98), all field initializers are executed in order of appearance,
    and finally the constructor is executed to initialize the object. The value of
    the constructor expression is the newly created object, which is C.


    # 12.10 Object Initializer (C# 3.0)


    An initializer immediately follows a constructor call to initialize the fields
    or properties of the newly created object or struct instance. Thus its purpose
    is similar to that of an array initialization (section 9.1). If the constructor
    takes no arguments, the complete syntax, including the constructor call, is this:


    ```

    new C { x1 = e1, ..., xn = en }

    ```


    If the constructor takes arguments, the syntax is this:


    ```

    new C (actual-list) { x1 = e1, ..., xn = en }

    ```


    In either case, the xi must name accessible fields or properties of the object,
    and each ej must be an expression (example 81) or a nested object initializer
    or collection initializer (example 82). Nested initializers are not allowed on
    fields or properties of struct type. The ej cannot refer to the newly created
    object. At run-time the constructor is called, each ej is evaluated from left
    to right, and its value is assigned to the corresponding field or property xi.


    # 12.11 Collection Initializers (C# 3.0)


    A collection initializer immediately follows a constructor call and adds items
    to the new collection. If the constructor takes no arguments, the complete syntax,
    including the constructor, is:


    ```

    new C { { e1, ..., en }, { e1, ..., en }, ... }

    ```


    If the constructor takes arguments, the syntax is this:


    ```

    new C (actual-list) { { e1, ..., en }, { e1, ..., en }, ... }

    ```


    In either case, the newly created collection must implement System.Collections.Enumerable
    and the ej must be expressions. Each inner group will be grouped to call a Add(e1,
    ..., en) method on the collection. The usual overloading resolution is to determine
    which Add method to call. When n = 1 and the eij do not contain an assignment
    operator, the inner braces may be omitted.'
