  md: '# 12.19 Indexer Access Expression


    An indexer get-access must have one of these three forms:


    +   o[actual-list]

    this[actual-list]

    base[actual-list]


    where o is an expression of reference type. In the first case, the type of o must
    have an indexer with the given argument types. In the second case, the current
    class must have (declare or inherit) an indexer with the given argument types.
    In the third case, the base class of the current class must have an indexer with
    the given argument types. In each case, the type of the expression is the declared
    type of the indexer. An indexer get-access is evaluated by evaluating o, if present,
    and then evaluating the expressions in the actual-list to obtain argument values,
    implicitly converting them to the types of the formal parameters of the indexer,
    and then executing the body of the get-accessor. The value of the expression is
    returned by the return statement that terminates the execution of the get-accessor''s
    body. A return statement will eventually be executed, provided the get-accessor
    terminates normally (section 10.16). If o is present but evaluates to null, NullReferenceException
    is thrown.


    An indexer set-access must have one of these three forms:


    +   o[actual-list] = expression

    this[actual-list] = expression

    base[actual-list] = expression


    where o is an expression of reference type. Each case must satisfy the same requirements
    as access. In each case, the type of the entire expression is the declared type
    of the indexer. The type of the right-hand side expression must be implicitly
    convertible to the declared type of the indexer. To evaluate an indexer set-access,
    first evaluate o, if present; evaluate the expressions in the actual-list to obtain
    argument values, implicitly converting them to the types of the formal parameters
    of the indexer; bind expression to a value v is implicitly convertible to a value
    v of the declared type of the indexer; bind parameter to v; if o is present but
    evaluates to null, NullReferenceException is thrown.


    An indexer may be used in a compound assignment as o[e] *= 2 or with increment
    and decrement operators as o[e]++. First the get-accessor is called to get the
    indexer''s value, and then the set-accessor is called to set it. The expression
    o and the argument expressions are evaluated only once. An indexer cannot be used
    as a ref or out parameter.'
