  md: "Example 168 Parallel Matrix Multiplication\nMatrix multiplication R = AB can\
    \ be implemented by a tripled nested loop. The usual sequential outermost loop\
    \ may be replaced by a parallel outermost loop by calling method Parallel.Forwith\
    \ a lambda expression expressing the inner loops. No synchronization is needed\
    \ here because each task has a different value of r, so no two write to the same\
    \ element of array R. On a four-CPU machine this makes matrix multiplication more\
    \ than three times faster.\n\n```\n// for (int r=0; r<rows; r++) { // Old sequential\
    \ loop\nParallel.For(0, rows, r => {\\ // New parallel loop\n    for (int c=0;\
    \ c<cols; c++) {\n        double sum = 0.0;\n        for (int k=0; k<A; k++)\n\
    \            sum += A[r,k]*B[k,c];\n        R[r,c] = sum;\n    }\n```\n\nExample\
    \ 169 Parallel Execution of Illegal Computations\nTo compute SlowFib(40) = 3 +\
    \ SlowFib(43) one may compute the two SlowFib in parallel. The speed-up factor\
    \ will be less than 2 unless computations take equally (which they do not).\n\n\
    ```\ndouble fib40 = 0, fib43 = 0; // Define assignment rules require initialization\n\
    Parallel.Invoke(delegate { fib40 = SlowFib(40); }, delegate { fib43 = SlowFib(43);\
    \ });\ndouble result = fib40 + 3 + fib43;\n```\n\nExample 170 Parallel Web Data\
    \ Retrieval\nThe Entrez serves at the U.S. National Center for Bioinformatics\
    \ Information (NCBI) can query the center's databases. Given a protein ID, such\
    \ as P01308 for human, it can search the database and return the protein's amino\
    \ acid sequence MALW...ENCH. Method NCBIProteinParallel uses Parallel.For to perform\
    \ multiple queries in parallel. For correctness each iteration of the loop writes\
    \ a distinct element of the result array. 177 uses asynchronous methods.\n\n```\n\
    public static String NCBIEntrez(String query) {\nbyte[] bytes = new WebClient().DownloadData(new\
    \ Uri(server + query));\nreturn ASCIIEncoding.ASCII.GetString(bytes);\n}\npublic\
    \ static String NCBIProteinID(String id) {\n    return NCBIEntrez(\"efetch.fcbi?type=fastretrieval&text=db&proteinid=\"\
    \ + id);\n}\npublic static String[] NCBIProteinParallel(params String[] ids) {\n\
    \    String[] results = new String[ids.Length];\nParallel.For(0, ids.Length, i\
    \ => { results[i] = NCBIProtein(ids[i]); });\n    return results;\n}\n```\n\n\
    ```\nShowResult(NCBIProtein(\"P01308\"));\nShowResult(NCBIProteinParallel(\"P01308\"\
    , \"P01315\", \"P01317\"));\n```"
