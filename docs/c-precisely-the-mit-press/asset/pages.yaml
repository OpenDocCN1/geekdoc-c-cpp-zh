  md: "# Example 202 Type Parameter Constraints\n\nInterface Iprintable describes\
    \ a method Print will print an object on a TextWriter. The generic PrintableLinkedList<T>\
    \ can implement Iprintable provided the list elements (of type T) do.\n\n```\n\
    class PrintableLinkedList<T> : LinkedList<T>, Iprintable where T : Iprintable\
    \ {\n    public void Print(TextWriter fs) {\n        foreach (T x in this) {\n\
    \            x.Print(fs);\n        }\n    }\ninterface Iprintable { void Print(TextWriter\
    \ fs); };\n```\n\n# Example 203 Constraints Involving Type Parameters, Multiple\
    \ Constraints\n\nThe elements of a type T are mutually comparable if any T-value\
    \ can be compared to any T-value using x.CompareTo(y). This is the case if T implements\
    \ IComparable<T>(section 27.3). The requirement that T implements IComparable<T>\
    \ is expressible by the constraint T : IComparable<T>.\nComparable<T,U> is a type\
    \ of ordered pairs (T,U)-values. For (T,U) pairs to support comparison, both T\
    \ and U must support comparison, so constraints are required on both T and U.\n\
    \n```\nstruct Comparable<T,U> : IComparable<Comparable<T,U>>\nwhere T : IComparable,\
    \ U : IComparable {\n    public readonly T Fst;\n    public readonly U Snd;\n\
    \    public int CompareTo(Comparable<T,U> that) // Lexicographic ordering\n  \
    \      int firstCmp = this.Fst.CompareTo(that.Fst);\n        return firstCmp !=\
    \ 0 ? firstCmp : this.Snd.CompareTo(that.Snd);\n    }\n}\n```\n\n# Example 204\
    \ The class and struct Constraints\n\nWithout the class constraint, type parameter\
    \ T in Cl might be instantiated as a value type, and then null would not be a\
    \ legal value of field. Conversely, without the struct constraint, type parameter\
    \ U in DI might be instantiated with a reference type or a nullable value type,\
    \ and then the nullable U? would be illegal. Either class declaration will be\
    \ rejected by the compiler if its constraint were left out.\n\n```\nclass CI<T>\
    \ where T : class {\n    T f = null; // Legal: T is a reference type\n}\nclass\
    \ D1<U> where U : struct {\n    U? f; // Legal: U is a non-nullable value type\n\
    }\n```"
