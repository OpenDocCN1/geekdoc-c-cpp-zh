  md: "# 29 Namespaces\n\nA program may be divided into namespaces. A type t declared\
    \ inside a namespace N may be used unqualified, simply as t, within the namespace.\
    \ Outside the namespace, references to t must be prefixed by the namespace, as\
    \ N.t, or must follow the clause using N.\n\nNamespace declarations may be nested:\
    \ giving rise to composite namespaces such as N1.N2. A namespace-declaration can\
    \ appear only at top level in a compilation unit or inside a namespace declaration,\
    \ cannot have access modifiers, and has this form, where declarations can appear\
    \ in any order:\n\n```\nnamespace N {\n  class-declarations\n  struct-declarations\n\
    \  interface-declarations\n  enum-type-declarations\n  delegate-type-declarations\n\
    \  namespace-declarations\n}\n```\n\nThe namespace identifier N may be composite,\
    \ as in N1.N2. A namespace may consist of separate and mutually dependent declarations.\
    \ Top-level declarations (of classes, struct types, interfaces, enum or delegate\
    \ types) not within a namespace declaration belong to the default namespace.\n\
    \n# 29.1 The Using Directive\n\nA using directive can open a namespace, or introduce\
    \ an alias for a namespace, or introduce an alias for a type (for abbreviating\
    \ constructed types; see section 26.9). A using directive must appear before any\
    \ member of a compilation unit or a namespace declaration. A using directive has\
    \ one of these forms:\n\n```\nusing N;\nusing M = N;\n```\n\nThe first form opens\
    \ namespace N. The second form means that any namespace type member N.T can be\
    \ referred to as M.T, which is useful if N is N1...Rn. The third form means that\
    \ the type will be referred to as T, where T is a type and t is any type, possibly\
    \ of form N.tl or possibly constructed.\n\nA using directive does not affect other\
    \ directives. Using N1,N2 opens the namespace N1,N2, using N1; N2 does not. Even\
    \ after using N1, one must refer to N2.C by its fully qualified name, not by N2.C.\
    \ It is a compile-time error for using two directives to the same name.\nA local\
    \ declaration (of a variable, struct, delegate type or enum type) may hide a declaration\
    \ of the same name from another namespace, or as from a using directive.\nNamespace's\
    \ .NET Framework class library, which is used with C#, is divided into many namespaces.\
    \ Namespace System contains classes such as Object, Math, Random, and String,\
    \ struct types such as Int32, and enum types such as DayOfWeek. Namespace System.Text\
    \ contains classes such as StringBuilder. After opening the namespace with using\
    \ one may use the unqualified name StringBuilder instead of the fully qualified\
    \ name System.Text.StringBuilder."
