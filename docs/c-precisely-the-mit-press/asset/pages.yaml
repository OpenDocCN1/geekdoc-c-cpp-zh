  md: "# Generic Collections: Sets, Lists, Dictionaries 185\n\n**Example 223** A Class\
    \ of Comparable Points\nA object represents the time of day 00:00-23:59. The method\
    \ t1.CompareTo(t2) returns a negative number if t1 is before t2, a positive number\
    \ if t1 is after t2, and zero if they are the same time. By defining two overloads\
    \ of CompareTo, the class implements the non-generic interface and the constructed\
    \ interface Comparable<T>.\n\n```\nusing System;\n    // IComparable, IComparable<T>,\
    \ IEquatable<T>\npublic class Time : IComparable, IComparable<T>, IEquatable<T>\
    \ {\n    private readonly int hh, mm; // 24-hour clock\n    public Time(int hh,\
    \ int mm) { this.hh = hh; this.mm = mm; }\n    public int CompareTo(Object obj)\
    \ { // For IComparable\n        return CompareTo((Time)obj);\n    }\n    public\
    \ int CompareTo(Time that) { // For Comparable<T>\n        return hh == that.hh\
    \ ? mm - that.mm : hh - that.hh;\n    }\n    public bool Equals(Time that) { //\
    \ For IEquatable<T>\n        return hh == that.hh && mm == that.mm;\n    }\n \
    \   public override string ToString() { return String.Format(\"{0:00}:{1:00}\"\
    , hh, mm); }\n}\n```\n\n**Example 224** A Comparer for Integer Pairs\nInteger\
    \ pairs are ordered lexicographically by this comparer, which has features from\
    \ examples 80 and 223.\n\n```\nusing SC = System.Collections; // IComparer\nusing\
    \ System.Collections.Generic; // IComparer<T>, IEquality<T>\n```\n\n```\npublic\
    \ struct IntPair {\n    public readonly int fst, snd;\n    public IntPair(int\
    \ fst, int snd) { this.fst = fst; this.snd = snd; }\n}\npublic class IntPairComparer\
    \ : SC.IComparer, IComparer<IntPair>, IEqualityComparer<IntPair> {\n    public\
    \ int Compare(Object obj, Object obj) { // For SC.IComparer\n        return Compare((IntPair)obj,\
    \ (IntPair)obj);\n    }\n    public int Compare(IntPair v1, IntPair v2) { // For\
    \ IComparable<T>\n        return v1.fst != v2.fst ? v1.fst - v2.fst : v1.snd !=\
    \ v2.snd ? v1.snd - v2.snd : 0;\n    }\n    public bool Equals(IntPair v1, IntPair\
    \ v2) { // For IEqualityComparer<T>\n        return v1.fst == v2.fst && v1.snd\
    \ == v2.snd;\n    }\n    public int GetHashCode(IntPair v) { // For IEqualityComparer<T>\n\
    \        return v.fst ^ v.snd;\n    }\n}\n```"
