- pgno: 28
  md: '# 6.3 Local var Declarations: Compile-Time Type Inference (C# 3.0)


    The var keyword may be used in a local variable declaration (section 13.4) to
    tell the compiler that the type of the declared variable should be inferred from
    the given expression:


    ```

    var identifier = expression;

    ```


    The expression (section 12) must have a compile-time type and hence cannot be
    an anonymous method (section 12.22), a lambda expression (section 12.23), or the
    null literal. The declared variable is inferred for the expression as if that
    type had been explicitly stated; subsequent uses of, assignments to, the value
    do not affect this type inference process. The variable remains statically typed
    as if the type had been explicitly given.


    The var keyword may also be used in for statements (section 13.6.1), foreach statements
    (section 13.6.2), and using statements. It cannot be used for declaration of fields,
    method parameters, or return types; their types must be explicitly given. Var
    is not a keyword that declares a variable using compile-time type, also cannot
    be used in casts, as array element type, as type parameter in generic types, and
    so on.


    # 6.4 The Type dynamic: Run-Time Resolution of Calls and More (C# 4.0)


    With type dynamic, one can obtain behavior similar to that of dynamically programmed
    languages like C#, Groovy, Javascript (Script), Python, Ruby, Scheme, and others.


    If an expression has dynamic type, then a method call, operator application, delegate
    call, or field access involving that expression will be resolved dynamically at
    run-time rather than at compile-time. This means that any such expression will
    be accepted by the compiler but may fail with an exception at run-time.


    Whereas var is a keyword, dynamic is a type. Unlike var, dynamic can be used for
    fields, method parameters, and return types as well as constructed types such
    as `dynamic<T>`.


    Run-time resolution of method calls, operator applications, delegate delegations,
    and field accesses produces exactly the same result as compile-time resolution.
    In cases where compile-time resolution fails (causing the compiler to reject the
    program), run-time resolution will instead throw an exception (RuntimeBinderException).
    Thus the runtime repeats the compiler''s resolution machinery for this purpose.
    Since compile-time operations are moved to run-time, where they may be executed
    repeatedly, operations involving expressions of type dynamic are slower than those
    resolved at compile-time; in extreme cases, up to ten times slower. Nevertheless,
    run-time resolution is convenient when calling external dynamic applications such
    as Microsoft Excel or web browsers.


    The run-time resolution machinery is the Dynamic Language Runtime which is actually
    a set of libraries built on top of the ordinary .NET runtime system.


    More information and examples using type dynamic are found in sections 12.178
    and 18.'
