  md: '# 25 Input and Output


    Sequential input and output objects called streams. There are two kinds of streams:
    character streams and byte streams, also called text streams and binary streams.
    Character streams are used for input from text files and human-readable output
    to text files, printers, and so on, using 16-bit Unicode characters. Byte streams
    are used for compact and efficient input and output of simple data (int, double,
    ...) as well as objects and arrays, in machine-readable format.


    There are separate classes for handling character streams and byte streams. The
    classes for character input and output are called Readers and Writers. The classes
    for byte input and output are called Streams. This section describes input and
    output using the System.IO namespace.


    One can create subclasses of the stream classes, inherited methods to obtain specialized
    stream classes. This is not further discussed here.


    The class hierarchies are shown in the following table, with related input and
    output classes shown on the same line. The table shows, for instance, BufferedStream
    and FileStream are subclasses of Stream, and that StreamReader is a subclass of
    TextReader. Abstract classes are in italics.


    | Char. | Input Streams | Output Streams |

    |---|---||

    | | TextReader | TextWriter |

    | | StreamReader | StringWriter |

    | | | StreamWriter |

    | | BinaryReader | BinaryWriter |

    | | Byte | Stream |

    | | | FileStream |

    | | | BufferedStream |

    | | | CryptoStream |

    | | | MemoryStream |

    | | | NetworkStream |


    # 25.1 Creating Streams


    An input stream or reader has an underlying source of data to read from, and an
    output stream or writer has an underlying sink of data to write to. A stream may
    either be created outright (e.g., a StreamReader may be created and associated
    with a named file on disk, e.g., for reading from file) or created from an existing
    stream to provide additional features (e.g., a BufferedStream may be created from
    a Stream for more efficient input). The figure opposite shows how streams may
    be created from existing streams or from other data.


    The stream classes are divided along two lines: character streams (top) versus
    byte streams (bottom), and input streams (left) versus output streams (right).
    For byte streams the arrows show what streams can be created from other streams
    (solid arrow heads) and what stream classes are base classes of other stream classes
    (open arrow heads). For instance, the arrow from Stream to BinaryReader shows
    that one can create a BinaryReader from a Stream, and the arrow from MemoryStream
    to Stream shows that MemoryStream is a (subclass of) Stream. Hence one can create
    a BinaryReader from a MemoryStream.'
