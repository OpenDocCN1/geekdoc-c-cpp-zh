  md: '# 12.7 Assignment Expression


    In the assignment expression x = e, the type of e must be implicitly convertible
    to the type of x (section 5.3). The type of the expression x = e is the same as
    the type of x. The assignment is executed by evaluating x, then evaluating e and
    implicitly converting the value of e to the type of x (if necessary; see section
    5.3), and finally storing the result in variable x. The value of the expression
    x = e is the value that was stored in x.


    The left-hand side x may be a local variable or parameter, or a field as o->f,
    or an array element as a[i], or a pointer or index. See sections 12.18 and 12.19
    for the latter case.


    When x is an element of an array whose element value is type t, it is checked
    at run-time there is an implicit reference conversion from the value of e to t
