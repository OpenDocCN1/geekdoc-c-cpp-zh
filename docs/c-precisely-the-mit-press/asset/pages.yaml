  md: "# Compiling, Loading, and Executing C# Programs\n\nExample 1 Complete Program\
    \ in File Example001.cs\nAlmost all programs need the using System directive (section\
    \ 29.1) but it is omitted in later examples.\n\n```\nusing System;\npublic class\
    \ Sum {\n    static void Main(String[] args) {\n        int sum = 0;\n       \
    \ for (int i=0; i<args.Length; i++)\n            sum += int.Parse(args[i]);\n\
    \        Console.WriteLine(\"The sum is \" + sum);\n    }\n}\n```\n\nExample 2\
    \ Compiling and Running a Program from the Command Line\nThis example shows how\
    \ to compile the file Example001.cs from the command line under Microsoft .Net\
    \ (left) or Linux or Windows using the Mono system (right). In both cases the\
    \ program outputs the text: The sum is 29.\n\n+   csc Example001.cs mcs Example001.cs\n\
    Example001 7 9 13 mono Example001.exe 7 9 13\n\nExample 3 Compiling an Executable\
    \ with a Reference to a Library\nFirst compile file Mod.cs into a module Mod.netmodule\
    \ and compile Lib.cs into a library Lib.dll.\nThen compile the file Prog.cs and\
    \ create an executable program in Prog.exe that has an external module Mod and\
    \ refers to the library Lib. Finally, run the executable.exe:\n\n```\ncsc /target:module\
    \ Mod.cs\ncsc /target:library.dll\ncsc /addmodule:Mod.netmodule /reference:Lib.dll\
    \ Prog.cs\n\n```\n\nThe resulting assembly consists of two files: the main file\
    \ Prog.exe, and file Mod.exe which contains the external module. The assembly\
    \ has a manifest with version number, other metadata, and references to two other\
    \ assemblies: the Lib, and mscorlib which is included by default.\n\n![](img/0895719d2f186cd73b49fccec3a97f1f_15_0.png)"
