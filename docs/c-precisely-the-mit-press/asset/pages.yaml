  md: '92 Expressions


    # 12.23 Lambda Expressions (C# 3.0)


    A lambda expression is similar to an anonymous method expression (section 12.22),
    but the syntax is more compact. Its basic forms are:


    ```

    x => e


    (xt, ..., xn) => e


    (parameter-modifier t1 x1, ..., parameter-modifier tn xn) => e

    ```


    The x and xi are parameters, the expression is the lambda expression''s body,
    the ti are parameter types, and the parameter-modifier is ref or out. Lambda expressions
    cannot take parameter arrays (params; see section 10.7) or optional parameters
    (section 10.10). The e may refer to variables and parameters in the enclosing
    scope according to the rules as anonymous methods (section 12.22).


    The value of a lambda x => e is a delegate object, when applied to a parameter
    x, it will evaluate expression and return the result. Like an anonymous method,
    a lambda expression has no type in itself but is convertible to delegate types
    that agree with the parameter types and the type of e (the return type). When
    a lambda expression''s parameter types are not specified, the compiler attempts
    to infer them using context information, such as the type of variable or method
    to which the lambda expression is assigned (example 111).


    # 12.24 Anonymous Object Expressions (C# 3.0)


    An anonymous object evaluates to an object with read-only fields:


    ```

    new { xi = ei, ..., xn = en }

    ```


    The xi are identifiers and the ei are expressions that are evaluated from left
    to right to obtain the values of xi. When ei is an identifier x or a field or
    property access e.f, then xi= be left out, in which case the identifier x or the
    identifier f will be used for xi.


    The resulting anonymous object has read-only properties, returning the values
    given at creation. The type of the expression is an anonymous type. All anonymous
    expressions that have the same fields with the same order will have the same anonymous
    type, at least within the same assembly (section 1.1). The Equals and Get methods
    are overridden to the anonymous object''s field values. The ToString method displays
    the object''s field values. Anonymous object expressions are used in the implementation
    of LINQ queries (example 242).


    # 12.25 Implicit Typed Array Creation Expressions (C# 3.0)


    An implicitly typed array creation for a one-dimensional array has this form:


    ```

    new [] { xi = ei, ..., xn = en }

    ```


    The difference from an ordinary array creation (section 9) is that the implicitly
    typed type format does not specify the type of the newly created array; this would
    be impossible for an array initialized with anonymous object expressions. The
    preceding expression creates an array of length n whose element type is the best
    type of the types of ei. The ei are evaluated from left to right. Rectangular
    multidimensional arrays new[] { { ... }, ..., { ... } } are created as shown in
    section 9.2.'
