  md: "# Generic Types and Methods 177\n\n# Example 214 A Generic Type for Pairs\n\
    \nA pair of two values of type T and U can be represented by a generic type Pair<T,U>.\
    \ The generic struct type has read-only fields for holding the components, and\
    \ a constructor for creating pairs.\n\n```\npublic struct Pair<T,U> {\n    public\
    \ readonly T Fst;\n    public readonly U Snd;\n    public Pair(T fst, U snd) {\n\
    \        this.Fst = fst;\n        this.Snd = snd;\n    }\n}\n```\n\n# Example\
    \ 215 Logging Pairs\n\nThe constructed Pair<DateTime, String> is the type of pairs\
    \ of a DateTime struct and a String object. A log (example 199) of such pairs\
    \ is created and used as follows. Note that an element of allMsgs is known to\
    \ be a Pair<DateTime, String>, not just an Object.\n\n```\nLog<DateTime, String>\
    \ log = new Log<Pair<DateTime, String>>();\nlog.add(new Pair<DateTime, String>(DateTime.Now,\
    \ \"Tea leaves\"));\nlog.add(new Pair<DateTime, String>(DateTime.Now.AddMinutes(2),\
    \ \"Hot water\"));\nlog.add(new Pair<DateTime, String>(DateTime.Now.AddMinutes(7),\
    \ \"Ready\"));\nPair<DateTime, String>[] allMsgs = log.All;\nforeach (var p in\
    \ allMsgs)\n    p.Fst ... p.Snd\n\n```\n\n# Example 216 A Generic Struct Type\
    \ to Represent Possibly Missing Values\n\nStruct Option<T> can represent a value\
    \ of type T that may be missing. Sometimes the null reference is used to mean\
    \ \"missing\", but this is impossible for value types. The generic struct Nullable<T>\
    \ serves a similar purpose but be used only for argument types T that are value\
    \ types (section 19). Note that the default value of the HasValue field is false,\
    \ so the struct'sless constructor Option<T>() constructs a missing value.\n\n\
    ```\npublic struct Option<T> {\n    public readonly bool HasValue;\n    private\
    \ readonly T value;\n    public Option(T value) { this.HasValue = true; this.value\
    \ = value; }\n    public T Value() {\n        if (this.HasValue) return value;\n\
    \        else throw new InvalidOperationException(\"No value\");\n    }\n    public\
    \ static operator Option<T>(T value) { return new Option<T>(value); }\n    public\
    \ static explicit operator T(Option<T> option) { return option.Value; }\n    public\
    \ override string ToString() { return HasValue ? value.ToString() : \"[No value]\"\
    ; }\n}\n\npublic static Option<double> Sqrt(double x) {\n    return x >= 0.0 ?\
    \ new Option<double>(Math.Sqrt(x)) : new Option<double>();\n}\n```\n\n![](img/0895719d2f186cd73b49fccec3a97f1f_189_0.png)"
