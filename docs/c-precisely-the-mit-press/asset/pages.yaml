  md: "# Attributes 217\n\nExample 254 using the Serialization Attribute\nThe classes\
    \ SC and SO have the Serializable attribute and therefore can be serialized and\
    \ deserialized.\nField s of class SO has the NonSerialized attribute and therefore\
    \ is not serialized and deserialized along\n the other fields of the class. This\
    \ example uses namespaces System.Runtime.Serialization and ei-\nSystem.Runtime.Serialization.Formatters.Soap\
    \ or System.Runtime.Serialization.Formatters.Binary.\n\n```\n[Serializable()]\\\
    class SC {\n    public int ci;\n}\n[Serializable()]\nclass SO {\n    public int\
    \ i;\n    public SC c;\n    [NonSerialized()] public String s;\n    public SO(int\
    \ i, SC c) { this.i = i; this.c = c; s = i.ToString(); }\n}\n\nFormatter fmtr\
    \ = new SoapFormatter(); // Or; new BinaryFormatter();\n// Serialize o1 and o2\
    \ to file \"objects\"\nsc = new SC();\nso1 = new SO(1, sc), o2 = new SO(2, c);\n\
    Stream stream = File.Open(\"Objects\", FileMode.Create);\nfmtr.Serialize(stream,\
    \ o1);\n// Deserialize o1 and o2 from file; the sharing of c is lost\nstream =\
    \ File.Open(\"Objects\", FileMode.Open);\nso1 = (SO)fmtr.Deserialize(stream),\
    \ o2 = (SO)fmtr.Deserialize(stream));\n```\n\nExample 255 Declaring and Using\
    \ a Custom Attribute\nThe AuthorAttribute is a custom attribute holding an author\
    \ name and a month (of month type: see example 15). Its legal targets are classes\
    \ and methods, and it may be used many times at each target.\n\n```\n[AttributeUsage(AttributeTargets.Class\
    \ | AttributeTargets.Method, AllowMultiple = true)]\nclass AuthorAttribute : Attribute\
    \ {\n    public readonly String Name;\n    public readonly Month Month;\n    public\
    \ AuthorAttribute(String name, Month month) { }\n    public override String ToString()\
    \ { }\n}\nclass TestAttributes {\n    [Author(\"Donald\", Month.May)]\n    public\
    \ void MyMethod1() { }\n\n    [Author(\"Andrzej\", Month.Jul)]\n    [Author(\"\
    Andreas\", Month.Mar)]\n    public void MyMethod2() { }\n}\n```\n\n* Note"
