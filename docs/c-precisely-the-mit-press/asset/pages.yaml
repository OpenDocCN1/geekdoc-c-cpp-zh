  md: '# 10.2 Class Modifiers abstract, sealed, static


    If a class C declared sealed, it cannot be instantiated, but non-abstract subclasses
    of C can be instantiated. An abstract class may have constructors that can be
    called from constructors in subclasses, by means of base(...) calls, when instantiating
    non-abstract subclasses. An abstract class may declare abstract and non-abstract
    methods, by a non-abstract class cannot declare abstract methods.


    If a class is declared sealed, it cannot declare subclasses of C, and hence cannot
    override or hide any methods declared in C. This is useful for preventing rogue
    subclasses by violating data representation invariants.


    A class cannot be both abstract and sealed, so no objects of that class could
    be created. However, a class may be declared static, in which case it has only
    static members, and no instances can be created from it. This is used for declaring
    utility classes such as System.Math and for declaring extension methods (section
    10.9).


    # 10.3 Member Access Modifiers private, protected, internal, public


    A member (data, function, or type) is accessible in the class in which it is declared,
    except where shadowed by a variable or parameter of member, or by a member of
    a nested class or struct. The following access modifiers may be used to make the
    member accessible elsewhere. The following access modifiers are legal (in a class
    declaration or a struct type declaration):


    | Member Modifier | Accessible With | In |

    | --- | --- | --- |

    | private or absent | This class or struct | private |

    | internal | This assembly | internal |

    | protected | This class + subclasses | C-protected |

    | protected internal | This assembly + this class''s | protected internal |

    | public | Everywhere | public |


    The modifiers protected and internal can be used on members of a class but not
    on members of a struct (section 14) because the latter cannot have subclasses.
    All members of an interface (section 15) are implicitly public, and only the public
    access modifier may, but need not, be.


    +   * If a member is declared private in class C, it is accessible in C and its
    nested classes and struct types, but not in its subclasses or other classes.

    * A member without an explicit access modifier is private.

    * If a member is declared internal, then it is accessible everywhere C is, but
    only within the same assembly as C (section 1.1).

    * If a member is declared protected, then it is accessible in subclasses of C.

    * If a member is declared protected internal, then it is accessible everywhere
    C is, but within the same assembly as C, and in subclasses of C. (This is similar
    to Java''s notion of a protected member).

    * If a member is declared public, then it is accessible everywhere C is, also
    in other assemblies.'
