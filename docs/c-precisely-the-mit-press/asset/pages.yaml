    \ new LinkedListEnumerator<T>(this); }\n    IEnumerator GetEnumerator() { return\
    \ GetEnumerator(); }\n```\n\n**Example 201** Subclass Between Generic Classes\
    \ and Interfaces\nThe constructed type Point<String> is implicitly convertible\
