  md: "# Example 192 Organizing a String Array for Random Access\n\nThis example shows\
    \ a way to implement large numbers of texts, such as millions of cached pages\
    \ or millions of DNA sequences. Define a string array to have three parts: (1)\
    \ a sequence of strings, each of which is in UTF-8 format; (2) a sequence of integers,\
    \ representing the start offsets of the strings; and (3) an integer, which is\
    \ the number of strings in the file.\n\nPut the number of strings and the string\
    \ offset at the end of the file, so that it is not necessary to know the number\
    \ of strings or the length of each string before writing the file. The strings\
    \ can be written to the file incrementally, and the only structure to keep in\
    \ memory is the table of strings. The table is represented as a List<Long>(27.6)\
    \ for type safety and performance.\n\n```\nstatic void WriteStrings(String filename,\
    \ String[] data) {\nFileStream raf = new FileStream(filename, FileMode.Create);\n\
    BinaryWriter sw = new BinaryWriter(raf);\nraf.SetLength(0);                  \
    \              // Truncates the file\nList<Long> offset = new List<Long>();\n\
    foreach (string s in data) {\n    offset.Add(raf.Position);                  \
    \  // string offset\n    sw.Write(s);                                // Writes\
    \ string\n}\nforeach (long v in offset) {\\ // Writes string offsets\n    Console.WriteLine(v);\n\
    }\nsw.Write(v);\\ // string count\nsw.Close();\n```\n\n# Example 193 Random Access\
    \ Reads from a String Array File\n\nThe method call ReadString(f, i) reads string\
    \ number i from string array file f (example 192) in three stages, using three\
    \ calls to Seek. First, it reads the offset table N from the last 4 bytes of the\
    \ file. Second, since an int takes 4 bytes and a long takes 8 bytes (section 5.1),\
    \ the string offset table must begin at position Length-4-8*N, and so the offset\
    \ of string number i can be read from position Length-4-8*N+i. Third, the string\
    \ is read from offset.\n\n```\nstatic string ReadString(String filename, int i)\
    \ {\nconst int IntSize = 4, LongSize = 8;\nFileStream raf = new FileStream(filename,\
    \ FileMode.Open);\nraf.Seek(raf.Length - IntSize, SeekOrigin.Begin);\nBinaryReader\
    \ br = new BinaryReader(raf);\nint n = br.ReadInt32();\nraf.Seek(raf.Length -\
    \ IntSize - n * LongSize + i, SeekOrigin.Begin);\nlong si = br.ReadInt64();\n\
    raf.Seek(si, SeekOrigin.Begin);\nString s = br.ReadString();\nbr.Close();\nreturn\
    \ s;\n}\n```"
