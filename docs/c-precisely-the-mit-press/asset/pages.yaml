    for (int i=0; i<count; i++)\\ lst.Add(i);\nlst.Clear();\nConsole.WriteLine(\"\
    Adding elements at head of list (slow)...\");\nfor (int i=0; i<count; i++)\\ lst.Insert(0,\
    \ i);\n```\n\n### Example 228 Database Query Results in a List and Returning Them\
    \ in an Array\nSometimes a method must return an array of results where the number\
    \ of results is not known in advance. In that case, the results could be produced\
    \ in a list and transferred to an array when the method returns. This method performs\
    \ a database query, reads each record from the query, and puts it into a List<Record>,\
    \ then copies the records to an array and returns them. The full example source\
    \ code shows how to open the database connection.\n\n```\nusing System.Data.Odbc;\
    \ // OdbcConnection OdbcDataReader\nusing System.Collections.Generic; // List<T>\n\
    struct Record {\n    public string Name, msg;\n}\nstatic Record[] GetMessages(OdbcConnection\
    \ conn) {\n    string query = \"SELECT name, msg FROM Message ORDER BY name\"\
    ;\n    OdbcCommand cmd = new OdbcCommand(query, conn);\n    OdbcDataReader reader\
    \ = cmd.ExecuteReader();\n    List<Record> results = new List<Record>();\n   \
    \ while (reader.Read())\n        results.Add(new Record(reader.GetString(0), reader.GetString(1),\
