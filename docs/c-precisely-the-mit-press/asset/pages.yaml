    Choosing an Appropriate Collection Class The running time or time complexity of
    an operation on a collection is usually given in O notation, as a function of
    size of the collection. O(1) means constant time, O(log n) means logarithmic time
    (time at most proportional to the logarithm of n), and O(n) means linear time
    (time at most proportional to n). For adding, or removing an element, respectively
    corresponds to very fast, fast slow.

    in this case, n is the number of elements in the collection and i is an integer
    index. Removing an element of a List is fast only near the end of the list, where
    n-i is small. The average time per operation indicates amortized complexity: over
    a sequence of operations, O(1) means any single operation could take O(n). HashSet
    and Dictionary use element hash (and therefore their operations have similar speeds),
    whereas SortedSet and SortedDictionary use element comparison.


    | Operation | HashSet<T> | SortedSet<T> | Dictionary<K,V> | SortedDictionary<K,V>
    |

    | --- | --- | --- | --- | --- |

    | Add(o) | O(1) | O(log n) | O(1) | O(log n) |

    | Insert(i,o) | | O(n-i) | O(n) |

    | Add(k, v) | O(1) | O(log n) | O(1) | O(log n) |

    | Remove(o) | O(1) | O(log n) | O(1) | O(log n) |

    | RemoveAt(i) | | O(n-i) | | |

    | Contains(o) | O(1) | O(log n) | O(1) | O(log n) |

    | ContainsKey(o) | | O(log n) | O(1) | O(log n) |

    | ContainsValue(o) | | | O(n) | O(n) |

    | IndexOf(o) | | O(log n) | | O(log n) |

    | this[i] | | | O(1) | O(log n) |

    | this[k] get/set | | | O(1) | O(log n) |'
