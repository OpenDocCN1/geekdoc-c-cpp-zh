  md: "# 10.8 Method Modifiers static new virtual override sealed abstract\n\nThe-modifiers\
    \ are used in method declarations (section 10.7),property declarations (section\
    \ 10.15), and indexer declarations (section 10.16). See also section 10.3 for\
    \ member access modifiers. The following-modifiers are legal (in classes C, structs\
    \ S, or interfaces I):\n\n| Method Modifier | Meaning for This Method | Allowable\
    \ Base Class Method | In |\n| --- | --- | --- | --- |\n| static | Static method\
    \ | No method, private | CS- |\n| new static | Static method; hide base | Any\
    \ method | CS- |\n| new | Non-virtual instance method | No method, private | CSI\
    \ |\n| virtual | Virtual method | No method, private | C- |\n| override | Virtual;\
    \ override base | virtual/override/abstract | CS- |\n| sealed override | Virtual;\
    \ prevent further overriding | abstract | C- |\n| new virtual | Virtual; hide\
    \ base | Any method | C-- |\n| abstract | Virtual and abstract; no body | No method,\
    \ private | C-- |\n| abstract override | Virtual and abstract; override base |\
    \ abstract | C-- |\n| new abstract | Virtual and abstract; hide base | Any method\
    \ | C-- |\n\nWhen a method's accessibility (section 10.3) is not explicitly specified,\
    \ it defaults to private, which is not permitted for methods that are abstract,\
    \ virtual, or override. There are several kinds of methods:\n\n+   * A static\
    \ method is a method M (in a class or type C) that is declared. Then M is associated\
    \ with the class itself; it can be called without any object of class C. The method\
    \ may be called as C.M(...) or inside methods, constructors, field initializers,\
    \ initializer blocks blocks and nested classes in C, simply as M(...). A static\
    \ method cannot use the current object reference this and can only refer to static\
    \ members of the enclosing class.\n* An instance method is a method M (in a class\
    \ or type C) that is not declared. Then every call to M is associated with an\
    \ instance of class C or a subclass. The method may be called as O.M(...), where\
    \ O is an object of class C or a subclass. Instance methods and constructors of\
    \ C, it may be called as M(...), which has the same meaning as M(...). An instance\
    \ method can refer to all members of class C, static or not. There are two kinds\
    \ of instance methods:\n    * A non-virtual instance method is one not declared\
    \ virtual or override. In a call O.M(...) to such a method, the compile-time type\
    \ of O determines which method is called (section 12.17.5).\n    * A instance\
    \ method is one declared virtual or override. In a call O.M(...) to such a method,\
    \ the compile-time type of O and the run-time type of the object determine which\
    \ method is called (section 12.17.5). Only classes have virtual instance methods;\
    \ structs types (section 14). A sealed method cannot be overridden in subclasses.\
    \ The combination sealed virtual is illegal; that would just mean.\n* An abstract\
    \ method is a method M (in a class C) declared abstract. Then class C must be\
    \ abstract, so cannot be instantiated. The declaration of an abstract method has\
    \ no method body:\n\nabstract method-modifiers retype M(format-list);"
