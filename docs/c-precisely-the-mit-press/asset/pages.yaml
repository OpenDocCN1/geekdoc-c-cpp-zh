    # Example 98 Calling Overridden Methods from a Constructor


    If d is an object of class D2, then calling d.M2() will call the method M2 inherited
    from base class D1.

    The call M1() in M2 is equivalent to this.M1(), which this equals d2, so the method
    M1 declared in class D2 is called. Hence the call d.M2() will print D1.M2 and
    D2.M1:7. It because field f is initialized to 7 in constructor D2().


    Perhaps surprisingly, the creation d = new D2() of an object of class D2 will
    print D1.M2 and D2.M1:10. Why does it print 0, not 7? The very first constructor
    of class D2() is to make an implicit call to the base constructor D1(), even before
    executing the assignment f = 7. Hence f will still have its default value 0 when
    method M1 in D2 is called from method M2 in D1, which in turn is called from constructor
    D1().


    ```

    class D1 {

    public D1() {}

    public virtual void M1() { Console.WriteLine("D1.M1"); }

    public virtual void M2() { Console.WriteLine("D1.M2"); }

    }

    ```


    ```

    class D : D1 {

    int f;

    public D2() { f = 7; }

    public override void M1() { Console.WriteLine("D2.M1"); }

    }

    ```'
