  md: '# 10.7 Method Declarations


    A method must be declared inside a class (or struct; see section 14). A method-declaration
    declaring the corresponding method M has the form


    ```

    method-modifiers returntype M(formal-list)

    method-body

    ```


    The formal-list is a comma-separated list of zero or more formal parameter declarations,
    each of one these forms:


    ```

    parameter-modifier type parametername

    paramara type[] parametername // default value; see section 10.10

    type parametername = constant

    ```


    The params must appear in a formal-list if at; it can occur only once, and cannot
    be used with the ref or out modifiers. A parameter-modifier may be out or absent.
    A parameter that is neither an out nor a ref parameter is a by-value parameter.
    The type is any type expression. The parametername is any name, but no two parameters
    in a formal-list have the same name. The scope of a parameter is the method-body.


    A by-value parameter is similar to a local variable


    The params modifier is used when declaring a method that can take a variable number
    of arguments. The formal parameters in the method declaration must have array
    type; in a method call it gets to bind an array holding values of zero or more
    arguments without bounding to the preceding formal parameters (see also section
    12.17.3). Parameter arrays cannot be used with anonymous methods.


    The method name M with list t1,...,tn of declared parameters in the formal-list
    determine the method signature M(t1,...,tn). The signatures include any ref and
    out modifiers but not the params modifier (if any) and not the return type.


    A class may declare more than one method with the same name M, the methods have
    different signatures. This is called overloading. Overloaded methods may have
    different return types.


    The method-body is a block-statement (section 13.2). In particular, if the return
    type is void, the method-body does not return a value, and no return statement
    in the method-body can have an expression argument. If the return type is not
    void, a method must return a value; it is not possible for execution to reach
    the end of method-body without executing a return statement. Moreover, every return
    statement must have an expression argument which is implicitly convertible to
    the return type


    The legal method-modifiers consist of a member access modifier (section 10.3)
    and a method modifier (section 10.8).


    In a class whose-base-clause includes interface I, the method name in a method
    declaration may be written as I.M to explicitly state that it implements a method
    from interface I; in that case, there can be no method-modifiers (section 15.3).'
