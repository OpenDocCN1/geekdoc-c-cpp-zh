    \ method, or a compatible lambda expression (section 12.23) or Anonymous (section\
    \ 12). Instead of delegate type DComparer one could use Func<Object,int>; see\
    \ section 17.\n\n```\npublic delegate int DComparer(Object v1, Object v2)\nprivate\
    \ static void Qsort(Object[] arr, DComparer cmp, int a, int b)\nif (a < b)\n{\n\
    \    int i = a, j = b;\n    Object x = arr[(i + j) / 2];\n    do\n        while\
    \ (cmp(arr[i], x) < 0) i++; // Calls delegate cmp\n        while (cmp(arr[j],\
    \ x) > 0) j--; // Calls delegate cmp\n        if (i < j)\n        {\n        \
