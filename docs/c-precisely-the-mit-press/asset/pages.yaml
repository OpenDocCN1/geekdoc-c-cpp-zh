  md: '# 12.15 Field Access Expression


    A field access must have one of these four forms:


    ```

    f

    C.f

    o.f

    base.f

    ```


    where C is a class and an expression of reference type. Note that an object of
    a class may have several fields of the same name f, distinguished by the name
    of the class that declared the field (see section 10.5 and examples 50 and 87).
    Field accesses are evaluated as follows:


    +   * A field access of form f refers to a static or instance field of the innermost
    enclosing class that declares or inherits a field named f.

    * A field access of form C.f refers to a static field declared or inherited by
    class C.

    * A field access of form o.f, where expression o has compile-time type C, refers
    to an instance field declared or inherited by class C. Evaluate the field o is
    evaluated to obtain an object. The value of o.f is found as the value of the C-field
    f in object o. Throws NullReferenceException if o is null.

    * A field access of form base.f refers to an instance field in the base class
    of the innermost class whose declaration includes the field expression.


    Note the resolution of an instance field access o.f is similar to a non-virtual
    instance method call o.M(...); see also 12.17:


    +   * In an instance field access o.f, the field referred to is determined by
    the compile-time type of the object expression o; see example 87.

    * In a call to a non-virtual instance method o.M(...), the method is determined
    by the compile-time type (which must be a class or struct type) of the object
    expression o; see example 97.

    * In a call to a virtual instance method o.M(...), the method is determined by
    the run-time type (which must be a class) of the object to which o evaluates;
    see example 97.


    # 12.16 The Current Object Reference this


    The name this may be used in non-static code to refer to the current object (section
    10.1). When non-static code in a given object is executed, the object reference
    this refers to the object as a whole and is never null. Here, if m is an instance
    (non-static) member, this.m means the same as m when the member m has not been
    shadowed by a variable or parameter of the same name.


    In a class, this reference is not assignable; in a struct method it is (section
    14.2).'
