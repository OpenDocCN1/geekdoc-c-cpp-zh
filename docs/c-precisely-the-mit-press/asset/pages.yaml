  md: "# 26.5 Generic Interfaces\n\nA declaration of a generic interface I<T1,...,Tn>\
    \ has one of these forms:\n\n```\ninterface-modifiers interface I<T1,...,Tn> extends-clause\n\
    \  interface-body\n```\n\n```\ninterface-modifiers interface I<T1,...,Tn> extends-clause\
    \ parameter-constraints\n  interface-body\n```\n\nIn both cases, the T1,...,Tn\
    \ are type parameters for generic classes (section 26.3), and the interface-modifiers,\
    \ extends-clause and interface-body are as non-generic interfaces (section 15.1).\
    \ If present, the parameter-constraints are as for generic classes (section 26.4).\n\
    \nA type constructed from the generic interface has I<t1,...,tn>, where the t1,...,tn\
    \ are types. The types t1,...,tn must satisfy the parameter-constraints, if any,\
    \ on the generic interface I<T1,...,Tn>, as described in section 26.4.\n\nThe\
    \ parameters of a generic interface can have covariance modifiers out and in (section\
    \ 26.12).\n\n# 26.6 How Can Type Parameters Be Used?\n\nWithin the body { ...\
    \ } of a generic class C<T1,...,Tn> { ... } or generic interface or struct, a\
    \ type parameter Ti may be used almost as if it were a public type.\n\n+   * One\
    \ can use type parameter Ti in the return type or parameter types of methods,\
    \ operators, properties, anonymous delegates, and indexers; in the type of fields,\
    \ variables and parameters; and in member classes, struct types and delegate types.\n\
    * One can use new Ti[10] to create an array whose element type is Ti; (o is Ti)\
    \ to test whether o is an instance of Ti; (o as Ti) to test and cast to Ti; (Ti)e\
    \ for types; Ti when constructing a type C<T1> from a generic type; and Ti in\
    \ a typeof expression such as typeof(Ti) or typeof(C<Ti>).\n* One can use expression\
    \ default(Ti) to obtain the default value for type Ti. This is the null reference\
    \ when Ti is instantiated with a reference type, and an appropriate value (0,\
    \ 0.0, false, a zero member, struct with default value fields) when Ti is instantiated\
    \ with a value type.\n* One can use new Ti() to create an instance of Ti only\
    \ if there is a parameter constraint of the form Ti : new() on Ti; see section\
    \ 26.4 and example 206.\n* One cannot call static methods on a type parameter\
    \ Ti, as in Ti.M()."
