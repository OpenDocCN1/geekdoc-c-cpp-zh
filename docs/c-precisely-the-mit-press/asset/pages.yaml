  md: '# 25.5 Sequential Character Output: TextWriters


    The abstract class TextWriter and its subclasses StreamWriter and StreamWriter
    are for character-oriented sequential output. For instance, the standard output
    stream Console and standard error stream Console.Write is all really a call to
    Console.Out and similarly for Console.WriteLine. Class TextWriter has the following
    methods:


    +   - void Write(char[]) b writes characters of character array b to the stream.

    - void Write(char[] b, int i, int n) writes n characters from b starting at position
    i; throws ArgumentNullException if b is null, ArgumentOutOfRangeException if i<0
    or n<0, and ArgumentException if i+n>Length.

    - void Write(char c) writes character c to the stream.

    - void Write(int i) writes the representation of i to the stream, and similarly
    for bool, long, uint, ulong, float, decimal, and String.

    - void Write(Object o) writes o.ToString() to the stream if o is non-null; otherwise
    nothing.

    - void Write(String s, Object ol, ..., Object on) writes String.Format(s,ol,...,on)
    to the stream (section 7.2).

    - void WriteLine() writes a line terminator to the stream.

    - String EncodingName is the character encoding''s name, e.g., "Unicode (UTF-8)"

    - void Flush() writes all data to the underlying stream (or buffer) and clears
    all buffers.

    - void Close() flushes and closes the stream.


    For each method there is a LineWriter with the same signature that writes a line
    terminator (\r\n by default, see section 7 for escape codes). All methods may
    throw IOException on error.


    # 25.5.1 Sequential Character Output to a Byte Stream or File: StreamWriter


    A StreamWriter is a character output stream that writes to an byte stream or file,
    converting characters to bytes using a character encoding. The output operations
    are buffered for efficiency. StreamWriter has the same members as a TextWriter
    (25.5) and in addition these constructors:


    +   - StreamWriter(Stream s) creates a writer that writes to s using UTF-8 character
    encoding.

    - StreamWriter(s, Encoding enc) works similarly but uses character encoding enc.

    - StreamWriter(String filename) creates a character output stream and associates
    it with the named file. If it exists, then overwrites the file; otherwise it creates
    a new empty file. Throws ArgumentNullException if filename is null, ArgumentException
    if it is the empty string, DirectoryNotFoundException if the directory is not
    found, UnauthorizedAccessException if access to the file or directory is denied,
    and SecurityException if the caller does not have required permissions.

    - StreamWriter(String filename, bool append) works similarly, but if append is
    true, it does not overwrite the file. Instead, will append to the existing contents.

    - StreamWriter(filename, append, Encoding enc) uses character encoding enc.

    - StreamWriter(filename, append, enc, int n) works similarly but sets the buffer
    size to n.


