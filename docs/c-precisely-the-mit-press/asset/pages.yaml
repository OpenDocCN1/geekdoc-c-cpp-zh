  md: "# Classes 51\n\nExample 64 An Enumerator as a Member Class\nThe member class\
    \ SeqEnumerator, declared inside struct Seq (example 68), can enumerate the elements\
    \ of a sequence. To support the foreach statement (section 13.6.2), the SeqEnumerator\
    \ class must have a property Current to get the current sequence element and a\
    \ method Next to move to the next one. If it has methods Dispose and Reset, it\
    \ can implement interfaces IEnumerator and IEnumerator<T> explicit interface member\
    \ implementation (section 15.3) of Current with return type Object is needed for\
    \ the non-generic IEnumerator. The yield return statement provides a radically\
    \ simpler implementation of enumerators (section 13.12 and example 140).\n\n```\n\
    private class SeqEnumerator : IEnumerator {\n    private readonly Seq seq;\n \
    \   private int i;\n    public SeqEnumerator(Seq seq) { this.seq = seq; Reset();\
    \ }\n    public int Current {\n        // For IEnumerator<int>\n        get {\n\
    \            if (0 < i && i < seq.n)\n                return seq.b + seq.k * i;\n\
    \            else\n                throw new InvalidOperationException();\n  \
    \      }\n    }\n    object SC.Current { return Current(); } // For IEnumerator\n\
    \    public bool Next() {\n        return ++i < seq.n;\n    }\n    public void\
    \ Reset() { i = -1; } // For IEnumerator\n    public void Dispose() { } // For\
    \ IEnumerator<int>\n}\n```\n\nExample 65 Nested Classes Can Access All Static\
    \ Members of Enclosing Class\nThe nested class C.D can access all static members\
    \ of the enclosing class C, even private ones, as well as non-private static members\
    \ of the base class B of the enclosing class. The enclosing class cannot access\
    \ the private members of a nested class C.D.\n\n```\nclass B {\n    protected\
    \ static int bx = 10;\n    private static int bz = 10;\n}\nclass C : B {\n   \
    \ private static int cx = 11;\n    public class D {\n        private static int\
    \ dx = bx + cx; // Can access protected bx and private cx\n        // public static\
    \ int dz = bz + 2; // Cannot access private bz in base class\n    }\n    static\
    \ void m() {\n        int z = D.dx; // Cannot access private dx in nested class\n\
    \    }\n}\n```"
