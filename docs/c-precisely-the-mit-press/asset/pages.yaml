    \ has the form\n\n```\nif (condition)\n    truebranch\nelse\n    falsebranch\n\
    ```\n\nThe condition must have type bool, and truebranch and falsebranch are statements\
    \ but not declaration statements or labeled statements. If the condition evaluates\
    \ to true, then truebranch is executed; otherwise falsebranch is executed.\n\n\
    # 13.5.3 The switch Statement\n\nA switch statement has the form\n\n```\nswitch\
    \ (expression) {\n    case constant;: branch1\n    case constant;: branch2\n \
    \   ...\n    default: branchn\n}\n```\n\nThe expression must have type byte, byte,\
    \ short, ushort, int, uint, long, char, String, an enum type, or a user-defined\
    \ type with exactly one implicit conversion to one of these types (except an enum\
    \ type). This is called the governing type of the switch statement. Each constant\
    \ must be a compile-time constant. No two constants may have the same value. The\
    \ type of each constant must be implicitly convertible to the type of expression.\n\
    \nEach branch is preceded by one or more case clauses, which may be terminated\
    \ by return (if a method or constructor) or continue (if a loop) or goto or break\
    \ or any other combination of statements that ensures the end of the branch is\
    \ never reached. This is checked by the compiler. The default clause may be left\
    \ out. It can appear anywhere among the other clauses, first or last to be the\
    \ most sensible choices.\n\nThe switch statement is executed as follows. The expression\
    \ evaluates to a value v. If the corresponding branch is executed. If v does not\
    \ equal any of the constants, then the default is executed; if there is no default\
    \ clause, nothing is executed. A branch may contain goto and goto default statements\
    \ (section 13.7.5)."
