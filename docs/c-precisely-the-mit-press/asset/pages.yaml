    \ xs2) { ... }\n    public LinkedList<D> Map(Func<T, D> f) {\n        var res\
    \ = new LinkedList<D>();\n    }\n    public void Apply(Action<T> act) { ... }\n\
    \    public static LinkedList<T> Tabulate(Func<int, T> f, int from, int to) {\
