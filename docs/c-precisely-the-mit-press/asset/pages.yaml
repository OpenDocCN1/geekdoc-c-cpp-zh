- pgno: 227
  md: "# Assertions and the Debug.Assert Method 215\n\nExample 252 Using Assert to\
    \ Specify and Check the Result of an Algorithm\nThe integer square root of x ≥\
    \ 0 is an integer y such that y ≤ x and (y+1) > x. The precondition x ≥ 0 is always\
    \ checked, if an statement. The postcondition on y is specified by a call to Assert\
    \ and is checked if assertions are enabled at run-time, which is reassuring, that\
    \ the algorithm's correctness is never obvious. The assertion uses calls to avoid\
    \ arithmetic overflow.\n\n```\nstatic int Sqrt(int x) { // Algorithm by Borgerding,\
    \ Hsieh\n  if (x < 0)\n    throw new ArgumentOutOfRangeException(\"Sqrt: negative\
    \ argument\");\n  int temp, y = 0, b = 0x8000, bshift = 15, v = x;\n  do {\n \
    \   if (v >= (y << bshift))\n      y += b; v -= bshift;\n  } while ((b >>= 1)\
    \ > 0);\n  Debug.Assert((long)y <= x && (long)(y+1) > x);\n  return y;\n}\n```\n\
    \nExample 253 Using Assert to Specify and Check Invariants\nA list of words is\
    \ to be formatted as a line of text. Its length is the minimum number of characters\
    \ needed to format the words and the interspace spaces, which are the lengths\
    \ of the words plus the number of words 1. Those methods change the word list\
    \ use Assert to specify the invariant of the field length, and check it if assertions\
    \ are enabled at compile.\n\n```\nclass WordList {\n  private Queue<String> strings\
    \ = new Queue<String>();\n  private int length = -1; // Invariant: equals words\
    \ length plus interspaces\n  public int Length { get { return length; } }\n  public\
    \ void Enqueue(string s) {\n    length += 1 + s.Length;\n    Debug.Assert(length\
    \ == computeLength() + strings.Count - 1);\n  }\n  public string RemoveFirst()\
    \ {\n    String res = strings.Dequeue();\n    length -= 1 + res.Length;\n    Debug.Assert(length\
    \ == computeLength() + strings.Count - 1);\n    return res;\n  }\n  private int\
    \ computeLength() { ... } // For checking the invariant\n}\n```\n\nAn algorithm\
    \ for formatting a sequence of words into a text with a straight right-hand margin\
    \ produce a line of a specified length lineWidth, unless there is only one word\
    \ on the line or the line is the last one. This requirement can be expressed and\
    \ checked using a call to Assert (see the example file for details of the formatting\
    \ algorithm itself).\n\n```\nDebug.Assert(res.Length==lineWidth || wordCount==1\
    \ || !moreWords);\n```"
  merge: -1
