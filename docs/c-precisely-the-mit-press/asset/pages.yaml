  md: '# 25.7.2 Byte Input and Output from a Byte Array: MemoryStream


    A MemoryStream is a Stream that reads from or writes to a byte array in memory.
    A memory stream has a capacity indicating the maximum number of bytes in the stream,
    and a length indicating the current number of bytes in the stream. The capacity
    is set at the creation of the stream and cannot be changed unless the stream is
    resizable. Class MemoryStream has these constructors:


    +   - MemoryStream() creates a resizable MemoryStream with capacity 0 that supports
    reading, writing, and seeking.

    - MemoryStream(int n) creates a resizable MemoryStream with capacity n that supports
    reading, writing, and seeking. Throws ArgumentOutOfRangeException if n<0.

    - MemoryStream(byte b[]) creates a non-resizable MemoryStream with capacity b.Length
    that supports reading, writing, and seeking. Throws ArgumentNullException if b
    is null.

    - MemoryStream(byte b, bool wr) works similarly but supports writing if wr is
    true.

    - MemoryStream(byte b, int i, int n) creates a non-resizable MemoryStream based
    on b[i..i+n-1] with capacity n that supports reading, writing, and seeking. Throws
    ArgumentNullException if i<0 or n<0, and ArgumentException if i+n>b.Length.

    - MemoryStream(byte b, int i, int n, bool wr) works similarly but supports writing
    if wr is true.


    MemoryStream has the same members as class Stream (25.7) and in addition these,
    where ms is a variable of type MemoryStream:


    +   - SetLength(n), where n has type length, sets the length of ms to n. If n<ms.Length
    the stream is truncated and the current position is set to that after the last
    byte of the stream. If n>ms.Capacity, the capacity of ms is increased and the
    new bytes in the stream are initialized to 0. If ms is non-resizable or ms does
    not support writing, NotSupportedException is thrown. If n<0, ArgumentOutOfRangeException
    is thrown.

    - Read-write property ms.Capacity of type int of the stream. Setting the capacity
    to n throws NotSupportedException if ms is non-expandable or closed, and throws
    ArgumentOutOfRangeException if n!=ms.Length.

    - ToArray() of type byte[] writes the contents to a new byte array regardless
    of the current position of the stream.

    - WriteTo(st), where st is an expression of type Stream, writes the contents to
    the stream st or ms is closed. Throws ArgumentNullException if st is null, and
    ObjectDisposedException if ms is closed.'
