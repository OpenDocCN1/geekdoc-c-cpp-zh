  md: "# Generic Types and Methods 171\n\nExample 205 A Generic List Interface\n\n\
    The generic interface MyList<T> extends the interfaces IEnumerable<T> (section\
    \ 27.2) and IEquatable<T> (section 27.3) with methods to add and remove list elements,\
    \ an indexer to get and set the element at a particular position, and a generic\
    \ method Map<U> that takes as an argument a delegate-in generic type Func<T,U>\
    \ (page 222) and builds a list of MyList<U>. Note that the generic method Map<U>\
    \ has an additional type parameter U.\n\n```\npublic interface MyList<T> : IEnumerable<T>,\
    \ IEquatable<T> {\n    int Count { get; } // Number of elements\n    T this[int\
    \ i] { get; set; } // Gets or sets element at index i\n    void Add(T item); //\
    \ Add element at index\n    void Insert(int i, T item); // Inserts element at\
    \ index i\n    void Remove(int i); // Removes element at index i\n    MyList<U>\
    \ Map(Func<T, U> f); // Maps f over all elements\n}\n```\n\nExample 206 A Generic\
    \ Polyminal Type. Implementing Generic Twice\n\nA value of type AddMul<A,R> supports\
    \ addition and multiplication with values of type A, giving results of type R.\
    \ A value of type Polynomial<E> is a polynomial with coefficients of type E; for\
    \ this to make sense, values of type E must support addition and multiplication\
    \ with values of type E, and E must have an argumentless constructor E() that\
    \ creates a zero element of E.\n\nIn return, polynomials over E support addition\
    \ and multiplication with values of type E (thus implementing interface AddMul<E,Polynomial<E>>)\
    \ and support addition and multiplication with themselves (thus implementing interface\
    \ AddMul<Polynomial<E>,Polynomial<E>>).\n\n```\ninterface AddMul<A,R> {\n    R(A\
    \ a); // Addition with A, giving R\n    Mul(A a); // Multiplication with A, giving\
    \ R\n}\n```\n\n```\nclass Polynomial<E> : AddMul<E,Polynomial<E>>,\n    where\
    \ E : AddMul<E,E>, new() {\n        private readonly E[] cs;\n        public Polynomial()\
    \ { this.cs = new E[0]; }\n        public Polynomial<E> Add(E other) { ... }\n\
    \        public Polynomial<E> Mul(E other) { ... }\n\n        for (int i=0; i<len;\
    \ i++) {\n            E sum = new E(); // Permitted by constraint E : new()\n\
    \        }\n\n        public Polynomial<E> Add(E other) { ... }\n        public\
    \ Polynomial<E> Mul(E other) { ... }\n    }\n```"
