  md: "# Example 185 Numbers from a File\n\nThis example reads one number from each\
    \ line of a text file and computes the sum of the numbers. Method double.Parse\
    \ is culture-sensitive, one must use culture en-US or similar to parse a number\
    \ whose decimal point is a period (.); see the full example source code. To parse\
    \ more numbers from each line, one may use the Split method (section 7.1).\n\n\
    ```\ndouble sum = 0.0;\nTextReader rd = new StreamReader(\"foo\");\nString line;\n\
    while (null != (line = rd.ReadLine()))\nsum += double.Parse(line);\nrd.Close();\n\
    Console.WriteLine(\"The sum is {0}\", sum);\n```\n\n# Example 186 Scanning Tokens\
    \ from a Text Reader\n\nLanguage processors, such as compilers, convert the raw\
    \ stream of characters from a file into a stream of tokens, where a token is an\
    \ identifier, an operator, a separator as a left or right parenthesis, and so\
    \ on. This example shows how this conversion can be performed: given a TextReader\
    \ presents a sequence of tokens. The token is an object of abstract class Token\
    \ with derived classes Int, Id, and Sep. An exercise for the reader: using the\
    \ yield statement (section 13.12), modify the reader to return an IEnumerable<Token>.\n\
    \n```\npublic static void Tokenize(TextReader rd) {\n    while (rd.Peek() != -1)\
    \ {\n        if (Char.IsWhitespace((char)rd.Peek())) // Whitespace, skip\n   \
    \         rd.Read();\n        else if (Char.IsDigit((char)rd.Peek())) // Number\n\
    \            int val = rd.Read() - '0';\n            while (Char.IsDigit((char)rd.Peek()))\n\
    \                val = 10 * val + rd.Read() - '0';\n            Console.WriteLine(new\
    \ Int(val));\n        } else if (Char.IsLetter((char)rd.Peek())) { // Identifier\n\
    \            StringBuilder id = new StringBuilder().Append((char)rd.Read());\n\
    \            while (Char.IsLetterOrDigit((char)rd.Peek()))\n                id.Append((char)rd.Read());\n\
    \            Console.WriteLine(new Id(id.ToString()));\n        } else {\n   \
    \         switch (rd.Peek()) {\n                case '+': case '-': case '*':\
    \ case '/': // Operator\n                    Console.WriteLine(new Op((char)rd.Read()));\
    \ break;\n                case '(': case ')': // Separator\n                 \
    \   Console.WriteLine(new Sep((char)rd.Read())); break;\n                default:\
    \ // Illegal token\n                    throw new ApplicationException(\"Illegal\
    \ character '\" + (char)rd.Peek() + \"'\");\n            }\n        }\n    }\n\
    }\n```"
