- pgno: 30
  md: '# Strings


    A string is an object of the predefined class String from namespace System. The
    keyword string is an alias for System.String. A string constant is a sequence
    of characters within double quotes, such as "New York", "B52", or the empty string".
    Internally, a character is stored as a number using the Unicode character encoding,
    where character 0–127 coincide with the ASCII character encoding. String constants
    and character constants may use escape codes:


    | Escape Code | Meaning |

    | --- | --- |

    | \a | Alert (bell) |

    | \b | Backspace |

    | \t | Horizontal tab |

    | \v | Vertical tab |

    | \n | New line |

    | \f | Form feed (page break) |

    | \r | Carriage return |

    | \" | The double quote character |

    | \'' | The single quote character |

    | \\ | The backslash character |

    | \0 | The NUL character (ASCII or Unicode 0) |

    | \x | The character whose code is the hexadecimal number d |

    | \xd | The character whose code is the hexadecimal number dd |

    | \xdd | The character whose code is the hexadecimal number ddd |

    | \xddd | The character with the four-digit hexadecimal encoding dddd |

    | \udddddd | The character with the eight-digit hexadecimal encoding dddddddd
    |


    A character escape sequence represents a single character. Since the letter A
    has code 65 (decimal), it is written 41 in hexadecimal, the string constant "A\x41\u00000041"
    is the same as "AAAA". \udddddd is used only in string constants, not in character
    constants.


    A verbatim string is a string prefixed with the @ character. Any escape sequence
    in a string denotes itself, like ordinary characters, that """ denotes the double
    quote character. Let s1 and s2 be types of string:


    +   * s1.ToString() returns s itself, and somewhat surprisingly, so does s1.Clone(),
    whereas String.Copy(s1) produces a new object containing the same sequence of
    characters as s1.

    * s1.Length of type int is the length of s1, that is, number of characters in
    s1.

    * s1[i] of type char is the character at position i in s1, counting from 0. If
    the index is less than 0, or greater than s1.Length, the exception IndexOutOfRangeException
    is thrown.

    * s1.Equals(s2) of type bool is true if s1 and s2 are non-null and contain the
    same sequence of characters. Uppercase and lowercase characters are considered
    different.

    * s1 == s2 is true if s1 and s2 are null, or if both are non-null and s1.Equals(s2);
    and the inequality s1 != s2 has the same meaning as !(s1 == s2). Here s1 != """
    is true when s1 is a non-empty string, also when s1 is null.'
