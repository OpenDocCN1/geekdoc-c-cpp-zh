  md: "# Example 171 Performing Slow Computation in a Separate Task\n\nA long-running\
    \ computation, or access to a web server, database or other remote service, may\
    \ be executed as a separate task to avoid blocking the user interface or to allow\
    \ other activities to proceed currently. Here SlowFibTask creates and starts a\
    \ task that performs a long-running computation asynchronously. The result of\
    \ the task can be obtained as task.Result.\n\n```\npublic static double SlowFib(int\
    \ n) { ... computation take 10 seconds for n=43 ... }\npublic static Task<double>\
    \ SlowFibTask(int n) {\n    return Task.Run(() => SlowFib(n));\n}\n\nTask<double>\
    \ task = SlowFibTask(); // Returns a Running task\nConsole.Write(\"[task is running\
    \ ]\");\nConsole.WriteLine(task.Result);\n```\n\n# Example 172 Asynchronous Web\
    \ Data Retrieval with Task Continuations\n\nAssume one wants to make asynchronous\
    \ versions of the NbiEntrez and NbiProtein methods in 170, returning a Task<String>\
    \ instead of a String. Instead of the DownloadData method, an asynchronous version\
    \ DownloadDataAsync returns a Task<byte[]>. When that task completes, convert\
    \ the byte array to a String by using ContinueWith from class<T> (section 22.2)\
    \ to attach a continuation (as a lambda expression) to download the task. Example\
    \ 176 presents noticeably better but functionally equivalent methods.\n\n```\n\
    public static Task<String> NbiEntrezTask(String query) {\n    return new WebClient().DownloadAsync(new\
    \ Uri(server + query))\n    .ContinueWith((Task<byte[]> task) =>\n        ASCII.Encoding.GetString(task.Result));\n\
    }\n```\n\n```\npublic static Task<String> NbiProteinTask(String id) {\n    return\
    \ NbiEntrezTask(\"effetch.cgi?retry=fasta&retmode=text&db=\" + id);\n}\n```\n\n\
    ShowResult(NbiProteinTask(\"P01308\").Result);\n\n# Example 173 Implementing Timeout\n\
    \nTask timeout can be implemented using WhenAny to determine whether a given SlowFibTask\
    \ (example 171) or a certain Delay completes. The WhenAny creates and starts a\
    \ task, when completes, gets bound to the continuation's parameter task. The result\
    \ of the task that completed, so one can test whether it is SlowFibTask and if\
    \ so, return its result, otherwise some dummy value. Example 179 shows how this\
    \ can be expressed more naturally.\n\n```\npublic static Task<double> SlowFibTimeout(int\
    \ n) {\n    Task<double> slowFib = SlowFib(n);\n    return Task.WhenAny(slowFib,\
    \ Task.Delay(1000))\n    .ContinueWith<double>((Task<double> task) =>\n      \
    \  task.Result == slowFib ? slowFib.Result : -1);\n}\n```"
