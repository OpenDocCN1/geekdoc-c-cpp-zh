  md: "# Classes 49\n\nExample 61 Constructor Overloading: Calling Another Constructor\n\
    Adding a new constructor to the Point class (example 43) overloads its constructors.\
    \ The old constructor signature is Point(int, int), and the new ones are Point()\
    \ and Point(Point). The latter makes a copy of the point p by calling the old\
    \ constructor using the syntax : this(p.x, p.y).\n\n```\npublic class Point {\n\
    \    protected internal int x, y;\n    public Point(int x, int y) // //loaded\
    \ constructor\n        { this.x = x; this.y = y; } // Overloaded constructor\n\
    \    public Point()\n    { }\n    public Point(Point p) // Overloaded constructor\n\
    \        { this(p.x, p.y); } // Calls the first constructor\n    public void Move(int\
    \ dx, int dy)\n        { x += dx; y += dy; }\n    public override string ToString()\n\
    \        { return \"(\" + x + \", \" + y + \"); }\n}\n```\n\nExample 62 Calling\
    \ a Base Class Constructor\nThe constructor in the ColoredPoint subclass (example\
    \ 147) calls its base class constructor using the syntax : base(x, y) in the header\
    \ of the constructor declaration.\n\nExample 63 The Execution Order of Field Initializers\
    \ and Constructor Bodies\nEvaluating new C() will execute the instance field initializers\
    \ in class C, execute the instance field initializers in class B, execute the\
    \ body of the B() constructor, execute the body of the C(int) constructor, and\
    \ finally execute the body of the C(). That is, it will print 1 2 3 4 5 6 7.\n\
    \n```\nclass B {\n    public readonly int fb1 = Print(3);\n    public B(int k)\
    \ { Print(5); }\n    public readonly int fb2 = Print(4);\n    public static int\
    \ Print(int i) { Console.Write(i + \" \"); return i; }\n}\n\nclass C : B {\n \
    \   public readonly int fc1 = Print(1);\n    public C() : this(0) { Print(7);\
    \ }\n    public C(int k) : base(k) { Print(6); }\n    public readonly int fc2\
    \ = Print(2);\n}\n```"
