  md: "# Example 225 Building a Text Index\n\nThis example uses generic Dictionary\
    \ and List collections to build a list of all words in a given text file and the\
    \ line numbers on which they occur. The file is read using a StreamReader (section\
    \ 25.4).\n\n```\nIDictionary<String, List<int>> IndexFile(String filename) {\n\
    \    IDictionary<String, List<int>> index = new Dictionary<String, List<int>>();\n\
    \    Regex delim = new Regex(\"[^a-zA-Z0-9]*\");\n    StreamReader rd = new StreamReader(filename);\n\
    \    int lineno = 0;\n    String line;\n    while ((line = rd.ReadLine()) != null)\
    \ {\n        String[] res = delim.Split(line);\n        lineno++;\n        foreach\
    \ (String s in res) {\n            if (s != \"\") {\n                if (!index.ContainsKey(s))\n\
    \                    index[s] = new List<int>();\n                index[s].Add(lineno);\n\
    \            }\n        }\n    }\n    rd.Close();\n    return index;\n}\n```\n\
    \n# Example 226 Defining a Set with an Element-Based Hash Code\n\nTo use a set\
    \ as key or element in another collection (examples 223 and 232) the set's hash\
    \ code must be based on its elements. To ensure that, one may define a class Set<T>\
    \ on HashSet<T> or SortedSet<T> (section 27.9) with an appropriate definition\
    \ of hash code, caching it for efficiency.\n\n```\nclass Set<T> : IEquatable<Set<T>>,\
    \ ICollection<T> where T : IEquatable<T> {\n    private readonly HashSet<T> inner\
    \ = new HashSet<T>();\n    private int? cachedHash = null; // Cached hash code\
    \ is valid if non-null\n    public void Add(T x) {\n        if (!Contains(x))\
    \ {\n            inner.Add(x);\n            cachedHash = null;\n        }\n  \
    \  }\n    public override int GetHashCode() {\n        if (!cachedHash.HasValue)\
    \ {\n            int res = 0;\n            foreach (T x in inner) {\n        \
    \        res += x.GetHashCode();\n            }\n            cachedHash = res;\n\
    \        }\n        return cachedHash.Value;\n    }\n...\n```"
