    \  x = ?; // x #3 in scope\n{\n        int x; // Declaration of variable x (#4);\
    \ shadows x (#5)\n        x = ?; // x #4 in scope\n}\n    public int x; // Declaration\
    \ of field x (#5)\n}\n```\n\nExample 13 Definite Assignment\nx is definitely assigned\
    \ (#1) below because it gets assigned regardless of branch of the\nif statement\
    \ is executed, but y is not, because it gets assigned only in one of the branches.\
    \ Variable z\nis not definitely assigned (#3) because it will be assigned only\
    \ if the body of the loop gets executed\n(and the compiler does not take the value\
    \ of variables in loop conditions into account when determining\nhat).\n\n```\n\
    int x, y, z;\nif (args.Length == 0)\n    x = 10;\nelse\n    x = args.Length;\n\
    Console.WriteLine(x); // x definitely assigned, and z not (#1)\ny = x;\nfor (int\
