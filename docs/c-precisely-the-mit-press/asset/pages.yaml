    \ an exception, the TextReader and the file get closed. This behavior is the same\
    \ as example 137. Class TextReader implement IDisposable, so it can be used in\
    \ the using statement.\n\n```\nstatic double[] ReadRecord(string filename) {\n\
    \    using (TextReader reader = new StreamReader(filename)) {\n        double[]\
    \ res = new double[3];\n        res[0] = double.Parse(reader.ReadLine());\n  \
    \      res[1] = double.Parse(reader.ReadLine());\n        res[2] = double.Parse(reader.ReadLine());\n\
    \        return res;\n    }\n}\n```"
