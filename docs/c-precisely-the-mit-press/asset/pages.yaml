  md: "# Classes\n\n# 10.18 User-Defined Conversion Operators\n\nA class or struct\
    \ may declare conversions to from that class or struct. A user-defined conversion\
    \ from type to type tt may be implicit or explicit; the declaration must have\
    \ one of these forms:\n\n```\npublic static implicit operator tt(ts x)\n    method-body\n\
    public static explicit operator tt(ts x)\n    method-body\n```\n\nThe ts and tt\
    \ are the source and target types of the conversion. At least one of them must\
    \ be the type of the enclosing class or struct; neither can be the Object, nor\
    \ an interface; and neither can be a base class of the other. A class or struct\
    \ cannot define both implicit and an explicit conversion from type to tt.\n\n\
    The method-body must satisfy the same requirements as a method that has a single-parameter\
    \ x of type and whose return type is tt. In particular, normally terminating paths\
    \ should execute a return expression which is implicitly converted to tt. Although\
    \ not enforced by the compiler, a user-defined conversion should have unexpected\
    \ side effects, and an implicit conversion should always terminate successfully,\
    \ whereas an explicit conversion may throw an exception.\n\nUser-defined implicit\
    \ conversions are used in assignments, by-value parameter passing, and cast expressions,\
    \ but not in inline tests (12.13).\n\nUser-defined implicit conversions can be\
    \ subtle. The declaration of an implicit conversion may be accepted by the compiler\
    \ but cause stack overflow at run-time, if the body of the conversion itself uses\
    \ the implicit conversion.\n\nExamples 69 and 145.\n\n# 10.19 Events\n\nAn E is\
    \ a field holding handlers, where a handler is a delegate (section 17). An event\
    \ is similar to a delegate type that can be invoked only from inside the declaring\
    \ class, new handlers can be added and removed from the outside also. A declaration\
    \ of E has one of two forms:\n\n```\nmethod-modifiers event delegate-type E;\n\
    method-modifiers event delegate-type E { add add-body remove-body }\n```\n\nwhere\
    \ add and remove must either be absent (as in the first form) or both be present\
    \ (as in the second form). The delegate-type is the type of handlers associated\
    \ with event E; it must be a delegate type. The methods are as for methods; the\
    \ abstract cannot be used with the second form. Outside the class declaring an\
    \ event, it can be used only on the left-hand side of the operators += and -=\
    \ which return type void. In particular, the event does not provide access to\
    \ the individual handlers for the event.\n\nIn the first form of event declaration,\
    \ the event E is just a delegate (holding the event handlers). The usual delegate\
    \ operations (section 17) can be used on E inside the class or struct declaring\
    \ it, and the operations += and -= are implemented as the corresponding delegate\
    \ operations on E.\n\nIn the second form of event declaration, the operations\
    \ += and -= are implemented as calls to the add-body and remove-body. These behave\
    \ as return type void and a single by-value parameter called whose type is delegate-type,\
    \ and they must satisfy the same requirements as such methods."
