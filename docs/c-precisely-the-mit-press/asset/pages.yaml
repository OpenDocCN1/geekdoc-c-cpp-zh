  md: '88 Expressions


    # 12.20 Type Cast Expression


    A type cast expression is used to perform an explicit conversion (section 5.3)
    of a value from one type to another. When e is an expression and t is a type,
    a type cast of e to t is done using the expression


    (t)e


    This expression, when legal, has type t. It is evaluated by evaluating e to a
    value v. If e has a simple type and t is a simple type, the conversion is performed
    as described in section 5.3.1.


    If e has a reference type and there is a standard conversion from type to t, then
    if v is null or a reference to an object or array works implicitly to t, the conversion
    succeeds with result v; otherwise the exception InvalidCastException is thrown.


    If e has a struct type and there is a standard conversion from type to t (t must
    be an interface, Object, or ValueType), the conversion succeeds with a result
    that is a boxed copy of v


    If e has a class type, and that type or type t declares a conversion to type t,
    that conversion is used to obtain the result.


    If e is a simple type, and type declares a conversion from type to type t, that
    conversion is used to obtain the result.


    The type cast is illegal and rejected at compile-time when it can be determined
    at compile-time that it cannot possibly succeed at run-time; for instance, when
    e has type String and t is Array. When one or both is an interface, this cannot
    be determined at compile-time.


    If the instance test e is t described in section 12.13 returns true, then the
    type cast (t) will succeed without throwing an exception. The converse does not
    hold. For example, the cast (t)e may succeed although e evaluates to null; it
    takes user-defined conversions into account, and it takes implicit conversion
    of simple types into account, where the instance test e is does.


    # 12.21 The typeof Operator


    Any type can be represented at run-time by an object of the predefined class Type
    from namespace System. This also holds for the pseudo-type void and for types
    constructed from generic types (section 26.2). There is a single Type object for
    any given type.


    The expression typeof(t) evaluates to the Type representing the type t, and typeof(void)
    evaluates to the type object representing void. The typeof operator can be applied
    to all types, even types involving type parameters (section 26.6).


    Note that whereas typeof(t) returns the Type object for a given type t, the method
    e.GetType() returns the Type object for the run-time type of a given value e.
    The GetType method is declared in class Object and is therefore available on all
    kinds of values (except anonymous methods); see section 5.2 and example 8).'
