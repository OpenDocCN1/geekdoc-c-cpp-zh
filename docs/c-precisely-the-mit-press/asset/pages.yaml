- pgno: 16
  md: '4 Comments and Program Layout


    # 2 Names and Reserved Names


    A name of a variable, parameter, method, field, indexer, property, class, struct,
    enum, delegate, interface, or namespace starts with a letter or an underscore
    (_) and continues with zero or more letters or digits (0-9). Uppercase letters
    and lowercase letters are distinct. A legal name cannot be one of the keywords,
    which are reserved names:


    ```

    abstract base bool break byte case char checked class const continue decimal

    default default do double else enum event explicit extern finally fixed float

    for goto if implicit in int interface is long long namespace

    ull object object or override private protected public readonly return

    byte sealed short size stackalloc static string switch true try

    typeof unless unchecked unsafe using virtual void volatile while

    ```


    To use as a name, prefix it with the @ character, as in @while = 17. The pseudo-keywords
    add, aliases, ascending, by, descending, from, global, group, into, join, let,
    orderby, partial, remove, select, value, where, and yield are reserved only in
    certain contexts.


    # 3 C Naming Conventions


    The following naming conventions are often followed, although not enforced by
    the C compiler:


    +   - If a name is composed of several words, each word (except possibly the first
    one) begins with an uppercase letter. Examples: currentLayout, LayoutComponent.

    - Names of local variables, parameters, and protected fields begin with a lowercase
    letter. Examples: vehicle, currentVehicle. Using lowercase l1 or uppercase letter
    0 as names.

    - Names of public or internal fields, static fields, and named constants begin
    with an uppercase letter. Examples: Vehicle, MaxValue.

    - Names of classes, methods, events, properties, and enum types begin with an
    uppercase letter. Examples: Cube, ColorCube.

    - Names of interfaces begin with the I followed by an uppercase letter. Example:
    IEnumerable.

    - A namespace name is a dot-separated sequence of names, each of which begins
    with an uppercase letter (System or System.Text or System.RegularExpressions),
    but could also be a reverse domain name (dk.itu.c5 or ck.cern.mathlib).


    # 4 Comments and Program Layout


    A comment has no effect on the execution of the program but is used to help humans
    understand the program. It may be inserted anywhere permitted. There are two forms:
    one-line comments and delimited comments. Do not insert a delimited comment in
    the middle of a line, as in example 5.


    Program layout has no effect on the computer''s execution of the program but is
    used to help humans understand the structure of the program. For reasons of space
    the recommended layout style is not always followed in the rest of the book.'
  merge: -1
  img_proc: true
- pgno: 17
  md: "# Example 4 Using Keywords as Identifier Names\n\nThis feature is provided\
    \ for interoperability with other programming languages, in which class or public\
    \ may be a perfectly legal name for a field or method; it should not be used in\
    \ ordinary C# programming. Note that for non-keywords as i, the identifier @i\
