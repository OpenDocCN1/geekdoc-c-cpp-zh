- pgno: 12
  md: '# # Notational Conventions


    | Symbol | Meaning |

    |---|---|

    | a | expression or value of array type |

    | b | expression or value of boolean type |

    | C | class |

    | D | delegate type |

    | e | expression |

    | E | exception type or event name |

    | f | field |

    | g | group of items (Linq) |

    | i | expression or value of integer type |

    | I | interface type |

    | M | method |

    | | namespace |

    | N | expression or value of object type |

    | P | property name |

    | s | expression of type string |

    | S | struct type |

    | sig | signature of method or constructor |

    | t | type name or expression (simple type or value type or reference type) |

    | T, U | type parameters (generic types and methods) |

    | u | expression or value of thread type |

    | v | value of any type |

    | x, y | variable or parameter or field element or range variable (Linq) |

    | xs, ys | stream of items, such as an enumerable (Linq) |


    In this book, the grammars of C# are presented using an informal notation, with
    non-terminal symbols such as *class-declaration* in italics, terminal symbols
    such as `class` in typewriter font, and metvariables such as `C` for class names
    and `M` for method names.


    A complete and detailed grammar for C# can be found in the official language specification
    (see section 34). The complete grammar is not included here because it runs to
    more than 30 pages and is yet too general: many well-formedness requirements must
    be expressed as additional side conditions on the grammar.'
