  md: "# Example 138 Checked and Unchecked Integer Operations\n\nThe checked and unchecked\
    \ statements affect only the operations textually enclosed by the statements.\
    \ Thus overflow that occurs in methods called from the statement is not affected\
    \ by the explicit overflow checking text. For instance, the call int.Parse(\"\
    999999999\") always throws OverflowException regardless of checked or unchecked\
    \ context.\n\nIn a checked context, an overflow computation performed at compile-time\
    \ will cause a compile-time error, not throw an exception at runtime.\n\n```\n\
    checked {\n    Console.WriteLine(int.MaxValue + 1); // Compile-time error\n  \
    \  Console.WriteLine(int.MinValue - 1); // Compile-time error\n    Console.WriteLine((uint)(0-1));\
    \ // Compile-time error\n    int i = int.Parse(\"999999999\"); // Throws OverflowException\n\
    }\n\nunchecked {\n    Console.WriteLine(int.MaxValue + 1); // -2147483648 (wrap-around)\n\
    \    Console.WriteLine(int.MinValue - 1); // 2147483647 (wrap-around)\n    Console.WriteLine((uint)(0-1));\
    \ // 4294967295 (wrap-around)\n    int i = int.Parse(\"999999999\"); // Throws\
    \ OverflowException\n}\n```\n\nSee also example 73.\n\n# Example 139 The using\
