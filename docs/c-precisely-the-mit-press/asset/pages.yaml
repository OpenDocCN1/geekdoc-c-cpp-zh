    \ struct dt using the call dt.IsoWeek().\n\n```\npublic static class DateTimeExtensions\
    \ {\n    public static int IsoWeek(this DateTime dt) { }\n}\n```\n\n# Example\
    \ 58 String Concatenation with Extension Method\n\nAn extension method may be\
    \ added to a particular array type as String[] or to a particular instance of\
    \ a generic type. If ss has type String[], then one can call ss.Concat(\", \"\
    ) to format the array elements comma-separated values.\n\n```\npublic static class\
    \ StringArrayExtensions {\n    public static StringBuilder Concat(this[] arr,\
    \ string sep) {\n        StringBuilder sb = new StringBuilder();\n        if (arr.Length\
    \ > 0) {\n            sb.Append(arr[0]);\n            for (int i = 1; i < arr.Length;\
    \ i++) {\n                sb.Append(sep).Append(arr[i]);\n            }\n    \
    \    }\n        return sb.ToString();\n    }\n}\n```\n\n# Example 59 Extension\
    \ Method with Type Constraint\n\nAn extension method may be added to a particular\
    \ type instance of a generic type, restricted by a type constraint. This extension\
    \ method can be called only on type instances IEnumerable<T> which implements\
    \ IComparable<T>, such as IIEnumerable<int> or IList<int> or int[] or List<String>\n\
    \n```\npublic static bool IsSorted<T>(this IEnumerable<T> xs) where T : IComparable<T>\
    \ {\n    var etor = xs.GetEnumerator();\n    if (etor.MoveNext()) {\n        T\
    \ prev = etor.Current;\n        while (etor.MoveNext()) {\n            if (prev.CompareTo(etor.Current)\
    \ > 0)\n                return false;\n            } else {\n                prev\
    \ = etor.Current;\n            }\n        }\n    }\n    return true;\n}\n```\n\
    \n# Example 60 Optional Parameter\n\nBecause a default value is given for parameter\
    \ radix in method Convert, the call Convert(\"123\") will have the same meaning\
    \ as Convert(\"123\", 10).\n\n```\nstatic uint Convert(String s, uint radix =\
    \ 10) { ... }\n```"
