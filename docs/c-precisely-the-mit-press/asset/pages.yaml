  md: "# Threads, Concurrent Execution, and Synchronization 135\n\n# Example 166 Producers\
    \ and Consumers Communicating via a Monitor\n\nA buffer has room for integer,\
    \ and a method Put for storing into the buffer (if empty) and a method Get for\
    \ reading from the buffer (if non-empty); it is a monitor (section 21.2). A thread\
    \ calling Get must obtain the lock on the buffer. If it finds that the buffer\
    \ is empty, it calls Wait to release the lock and wait until something has been\
    \ put into the buffer. If another thread calls Put and Pulse, then the getting\
    \ thread will start competing for the buffer lock again, and if it gets it, will\
    \ continue executing.\n\n```\nclass Buffer {\n    private int contents;\n    private\
    \ bool empty = true;\n    public int get() {\n        lock (this);\n        while\
    \ (empty) Monitor.Wait(this);\n        empty = true;\n        Monitor.Pulse(this);\n\
    \        return contents;\n    }\n    public void Put(int v) {\n        lock (this);\n\
    \        while (!empty) Monitor.Wait(this);\n        empty = false; contents =\
    \ v;\n        Monitor.Pulse(this);\n    }\n}\n```\n\n# Example 167 Deadlock\n\n\
    Careless locking of more than one object can cause deadlock. Assume that there\
    \ are one left shoe and one right shoe (two objects) and two people (threads)\
    \ want to use them. First one person, the pair of shoes. But if two shoes are\
    \ created by new Person(\"groucho\", left, right) and new Person(\"harpo\", right,\
    \ left), then the first person may lock the left shoe, and the second person may\
    \ lock the right one, and then both wait forever for the other shoe. This is avoided\
    \ by always locking the objects in the same fixed order (instance, before right).\n\
    \n```\nclass Person {\n    String name, fst, snd;\n    public Person(String name,\
    \ String fst, String snd) {\n        this.name = name; this.fst = fst; this.snd\
    \ = snd;\n        new Thread(new ThreadStart(Run)).Start();\n    }\n    public\
    \ void Run() {\n        lock (this);\n        Console.WriteLine(name + \" got\
    \ \" + fst);\n        Thread.Sleep(0); // Yields to other threads\n        lock\
    \ (snd) { Console.WriteLine(name + \" got \" + snd);\n            Console.WriteLine(name\
    \ + \" released \" + snd);\n        }\n        Console.WriteLine(name + \" released\
    \ \" + fst);\n    }\n}}\n```"
