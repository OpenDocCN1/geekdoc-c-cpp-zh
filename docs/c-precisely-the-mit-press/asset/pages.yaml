    \ so on. The call Util.Pause(100,300) pauses between 100 and 300 ms to enhance\
    \ the inherent non-determinism of synchronized concurrency.\n\n```\nclass Printer\
    \ {\n    static readonly Object mutex = new Object();\n    public static void\
    \ Run() {\n        for (;;) {\n            lock (mutex) {\n                Console.Write(\"\
    -\");\n                Util.Pause(100\n```\n\n# Example 165 Synchronized Methods\
    \ in an Object\n\nThis bank object has two accounts. Money is being transferred\
    \ from one account to the other by clerks. The total amount of money should remain\
    \ constant at 30. This holds when the Transfer method locks the accounts, because\
