    # 9.4 ENTROPY


    The Shannon entropy H(X) is a measure of the uncertainty associated with a random
    variable. Moreover, it is also a measure of the average information content missing
    when the value of the random variable is unknown. The Shannon entropy was one
    of the first measures to be proposed to analyze anonymity protocols and secure
    communications (Diaz, Seys, Claessens, & Preneel, 2003). It can be defined as
    the expectation of pX or simply as I (X; X).


    # Definition 9.4


    ```

    |- ∀ x. H (X) = I (X; X)

    ```


    It can also be expressed in terms of the KL divergence between p_X and the uniform
    distribution p''_X where N is the size of the alphabet of X.


    # Definition 9.5


    ```

    |- ∀ X N p. H (X) =

    log (N) - KL_divergence b (distribution p X) (uniform_dist p X)

    ```


    Cross entropy H(X; Y), which measures how much entropy is contained in a joint
    system of two random variables, is the entropy of the random variable (X; Y) and
    hence there is no need for a separate formalization of the cross entropy.


    The conditional entropy H (X | Y) quantifies the remaining uncertainty about the
    random variable X given that the value of the random variable Y is known. It is
    defined in terms of the KL divergence as follows:


    # Definition 9.6


    ```

    |- ∀ X Y N p. H (X | Y) =

    log (N) - KL_divergence b (joint_distribution p X Y)

    prod_measure (uniform_dist p X)

    (distribution p Y)

    ```'
