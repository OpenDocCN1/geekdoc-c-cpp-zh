    # 6.7 CONCLUSION


    In this chapter, we presented a higher-order-logic formalization of the DTMC with
    a finite state space. This formalization allows the modeling of both time-homogeneous
    and time-inhomogeneous DTMCs. When the transition probabilities are time dependent,
    then the parameter p_g contains the dependence on time t. Furthermore, the general
    state space s in Definition 6.3 covers two cases: infinite or finite state spaces.
    Since time-homogeneous DTMCs are the most frequently used in many applications,
    the chapter provided a formal definition of time-homogeneous DTMC. Building upon
    the formalization of DTMC, the most commonly used theorems, such as joint probability
    theorem, Chapman-Kolmogorov Equation and Absolute probability, were formally verified
    in HOL. These theorems are foundational for analyzing all kinds of DTMC models.
    Moreover, the reversible stochastic process and detailed balance equations, which
    facilitate the verification of the reversibility property of a DTMC, have also
    been verified. Also, we described the formalizations of stationary distribution
    and stationary process, which are the basic concepts of the performance analysis.
    Using these notions, the formal verification of two interesting properties of
    the DTMC that satisfy the detailed balance equations has also been presented.
    Finally, for illustration purposes, the chapter presented the formal verification
    of two interesting applications of DTMC.'
