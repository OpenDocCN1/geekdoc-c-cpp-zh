    # 5.2.1 Expectation


    In this section, we provide a formalization of the expectation of a random variable
    in HOL (Hasan & Tahar, 2010a). This definition uses the Lebesgue integration formalization
    and, hence, is valid for both discrete and continuous random variables. The expectation
    of a random value X is defined as the integral of X with respect to the probability
    measure. E [ X | J ] = \int_c X dp


