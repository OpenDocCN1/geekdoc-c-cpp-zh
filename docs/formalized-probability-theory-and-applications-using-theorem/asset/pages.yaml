  md: '# Chapter 9

    Information Measures


    # ABSTRACT


    This chapter presents a higher-order-logic formalization of the main concepts
    of information theory (Cover & Thomas, 1991), such as the Shannon entropy and
    mutual information, using the formalization of the foundational theories of measure,
    Lebesgue integration, and probability. The main results of the chapter include
    the formalizations of the Radon-Nikodým derivative and the Kullback-Leibler (KL)
    divergence (Coble, 2010). The latter provides a unified framework based on which
    most of the commonly used measures of information can be defined. The chapter
    then provides the general definitions that are valid for both discrete and continuous
    cases and then proves the corresponding reduced expressions where the measures
    considered are absolutely continuous over finite spaces.'
