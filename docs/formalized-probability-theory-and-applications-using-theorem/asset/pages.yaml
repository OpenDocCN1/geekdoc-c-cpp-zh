    A state $j$ in a DTMC $\{ X_j \}_{j \ge 0}$ is called transient if $f_{jj} < 1$,
    and persistent if $f_{jj} = 1$. If the mean return time $\mu_j$ of a persistent
    state $j$ is finite, then $j$ is said to be persistent non null state (or positive
    persistent state). Similarly, if $\mu_j$ is infinite, then $j$ is termed as persistent
    null state.


