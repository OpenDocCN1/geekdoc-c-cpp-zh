    In a similar, way other lifetime distributions like hazard function, cumulative
    hazard function and the p^th fractile a random variable can also be formalized
    in HOL. The work presented in this chapter, makes it possible to perform accurate
    lifetime reliability modeling and analysis for the very first time in the sound
    environment of a theorem prover. This approach, though interactive, is very flexible
    and allows modeling of lifetime behavior using single and multiple parameter,
    bounded and unbounded continuous random variables. This allows us to model increasing,
    constant and decreasing failure rates together with both short and long term lifetime
    behaviors. In fact, at this time any random variable with a closed form CDF expression
    is supported and can be formally reasoned about. This ability makes it suitable
    for a large set of reliability analysis problems in safety-critical engineering
    systems.


    # 12.4 RELIABILITY BLOCK DIAGRAMS


    A reliability block diagram (RBD) (Abd-Allah, 1997) is used to asses various failure
    related characteristics, such as reliability, availability, dependability and
    maintainability, of a wide range of engineering systems (Sahinoglu (2007); Huffman
    & Antelme (2009); Kolowrocki, (2009). Lin et al. (2010)). The main idea is to
    represent the behavior of the given system in terms of a RBD, i.e., a graphical
    structure consisting of blocks and connectors (lines). For example, while assessing
    the reliability of computational software, the blocks may represent the computational
    elements, with some given failure rate, and the connectors between them may be
    used to describe various alternative paths required for a successful computation
    using the given software. Now, based on this RBD, the failure characteristics
    of the overall system can be judged based on the failure rates of individual components,
    whereas the overall system failure happens if all the paths for successful execution
    fail. The RBD-based analysis enables us to evaluate the impact of component failures
    on the overall system safety and reliability and thus is widely used for assessing
    the tradeoffs of various possible system configurations, such as series, parallel
    or a combination of both, at the system design stage.'
