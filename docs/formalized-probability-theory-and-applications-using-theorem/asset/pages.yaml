- pgno: 116
  md: 'tion presents the higher-order-logic formalization of the expectation of a
    discrete random variable and Discrete-time Markov Reward Models. These foundations
    are then utilized to analyze the memory contention problem of a multi-processor
    system configuration with two processors and two memory modules using the HOL4
    theorem prover.


    The extensive computation requirements in complex engineering systems and the
    trend to move towards smart consumer electronic devices has brought a paradigm
    shift towards using multi-core processors in all sorts of embedded systems. These
    processors usually share information with one another by accessing shared variables
    in a common memory space. In order to avoid concurrent updates to these shared
    variables, which may lead to erroneous results, only one processor at a time is
    allowed to access the memory. However, this configuration leads to the well-known
    memory contention problem, which results in an overall performance degradation
    as the processors may have to wait for accessing the memory. This problem is usually
    alleviated by using a multi-module memory, as depicted in Figure 4. The main idea
    is to divide the cache memory into sub modules so that the processors can simultaneously
    access different sub-modules in parallel. This configuration tends to minimize
    the memory contention problem but cannot rectify it completely since two or more
    processors may want to access the same memory sub-module as well. Thus, rigorous
    performance analysis is conducted to determine the optimized size of sub-modules
    of memory fora given memory access rate.


