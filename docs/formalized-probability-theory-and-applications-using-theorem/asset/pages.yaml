    # 6.5 BINARY COMMUNICATION MODEL


    A binary communication channel (Trivedi, 2002) is a channel with binary inputs
    and outputs. The transmission channel is assumed to be noisy or imperfect, i.e.,
    it is likely that the receiver gets the wrong digit. This channel can be modeled
    as a two-state DTMC with the following state transition probabilities.


    Pr { Xₙ₊₁ = 0 | Xₙ = 0 } = 1 - a; Pr { Xₙ₊₁ = 1 | Xₙ = 0 } = a;


    Pr { Xₙ₊₁ = 0 | Xₙ = 1 } = b; Pr { Xₙ₊₁ = 1 | Xₙ = 1 } = 1 - b


    The corresponding state and channel diagrams are given in Figure 1.


    The binary communication channel is widely used in telecommunication theory as
    more complicated channels are modeled by cascading several of them. In Figure
    1, variables Xₙ₊₁ and Xₙ denote the digits leaving the systems (n - 1)ᵗʰ stage
    and entering the nᵗʰ one, respectively. a and b are the crossover bit error probabilities.
    Because Xₙ is also a random variable, the initial state cannot be determined and
    thus Pr (X₀ = 0) and Pr (X₀ = 1) cannot be 0 or 1. Although the initial distribution
    is unknown, the n-step transition probabilities can be verified as the elements
    of the matrix in Equation (6.7). Also, the steady-state probabilities can be concluded
    as that in Equation (6.8).


