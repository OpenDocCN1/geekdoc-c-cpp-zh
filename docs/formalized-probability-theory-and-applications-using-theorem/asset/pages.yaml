- pgno: 13
  md: '# Chapter 1

    Probabilistic Analysis


    # ABSTRACT


    This chapter provides the motivations behind the usage of probabilistic analysis
    in the domains of science and engineering. This is followed by a brief introduction
    of some of the foremost concepts of probabilistic analysis and the widely used
    probabilistic analysis techniques. The chapter concludes by highlighting some
    of the limitations of the traditional probabilistic analysis techniques.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 1.1 MOTIVATION


    > It is remarkable that this science, which originated in the consideration of
    games of chance, should have become the most important object of human knowledge
    ... The most important questions of life are, for the most part, really only problems
    of probability. (Pierre Simon, Marquis de Laplace [1749-1827])


    This quote by the famous French mathematician and astronomer may appear exaggerated,
    but it is a fact that probabilistic analysis has become a tool of fundamental
    importance in almost every area of science and engineering. A system may be purely
    deterministic but the unpredictable and random nature of its real-world surroundings
    makes it very hard to predict its exact outputs. The randomness may originate
    from the unwanted noise effects, failures due to aging of the components of an
    engineering system or the unpredictable traffic pattern in the case of telecommunication
    protocols. Due to these random components, establishing the correctness of a system
    under all circumstances usually becomes impractically expensive. For example,
    consider a simple telecommunication protocol, with handshake, that is used to
    ensure reliable communication in the presence of noise. We can never formally
    verify that the packet sent for transmission would be received properly because
    there is a possibility that the noisy channel may corrupt the transmission all
    the time. Probabilistic analysis is thus used. The main idea behind probabilistic
    analysis is to mathematically model the random and unpredictable elements of the
    given system and its environment by appropriate random variables. The probabilistic
    properties of these random variables are then used to judge the system’s behavior
    regarding parameters of interest, such as downtime, availability, number of failures,
    capacity, and cost. Thus, instead of guaranteeing that the system meets some given
    specification under all circumstances, the probability that the system meets this
    specification is reported (Mitzenmacher & Upfal, 2005). Again considering the
    example of the handshake protocol, we can model the behavior of the noise with
    an appropriate random variable and thus use its corresponding probabilistic and
    statistical properties to judge the probability of successful transmission.


    # 1.2 RANDOMIZED MODELS


    The randomized models of systems, which exhibit uncertainties, are constructed
    using appropriate random variables. For example, a random variable may be used
    to mathematically describe the outcome of a coin or a die. A random variable can'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'be defined mathematically as a function that maps elements of a probability
    space to some other measurable space. Random variables can be broadly classified
    into two types, i.e., discrete and continuous.


    A random variable is called discrete if the number of different values that it
    can acquire, or its range, is finite or at most countably infinite. For example,
    a coin toss and roll of a die can be modeled using discrete random variables.
    Discrete random variables can be used to construct randomized models of many real-world
    systems. For example, channel noise in digital communication is usually modeled
    by the Bernoulli random variable, randomized algorithms often use the Geometric
    random variable and the Binomial random variable has numerous applications in
    quality control problems.


    A random variable is called continuous if it can attain an infinite number of
    values or in other words its range is an interval of real numbers. For example,
    the arrival time of a data packet at a web server and the temperature of an electrical
    component can be modeled using continuous random variables. Many real-world systems
    exhibit randomness of continuous nature and thus continuous random variables are
    used to construct their randomized models in probabilistic analysis. For example,
    the Continuous Uniform distribution is used to model quantization errors in computer
    arithmetic applications, the Exponential distribution occurs in queuing applications
    to model inter arrival and service times and the Normal distribution is extensively
    used to model signals in data transmission and digital signal processing systems.


    We often encounter systems where randomness has some sort of time-dependency.
    For example, noise signals vary with time, the duration of a telephone call is
    somehow related to the time it is made, population growth is time dependent and
    so is the case with chemical reactions. Such random processes usually exhibit
    the memory-less property, which means that the future state depends only on the
    current state and is independent of any past state. The systems possessing the
    memory-less property are called Markov processes and they are mathematically modeled
    using Markov Chains. The randomized models of many real-world systems are built
    using Markov chains. Some of the common applications of Markov chains include
    telecommunication and security protocols, reliability analysis of hardware circuits,
    software testing, biological models and statistical mechanics.


    # 1.3 PROBABILISTIC PROPERTIES


    The main goal of probabilistic analysis is to analyze the behavior or performance
    of the given system by observing its probabilistic properties (Billingsley, 1995).
    These properties primarily originate from the probability distribution character-'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'istics of the random variables, which are used to construct the randomized
    model of the system. The probability distribution of a random variable X can be
    uniquely described by its cumulative distribution function (CDF), which is defined
    as


    ```

    F_X(x) = \text{Pr}(X \le x)

    ```


    for any number x, where Pr denotes the probability function. The CDF allows us
    to distinguish between discrete and continuous random variables as well. The CDF
    of a discrete random variable always consists of a sequence of finite jumps while
    it has a smooth continuous plot for continuous random variables.


    Besides the CDF, another useful distribution function for discrete random variables
    are their probability mass function (PMF), which provides the probability that
    a random variable X is exactly equal to some value x.


    ```

    p_X(x) = \text{Pr}(X = x)

    ```


    The PMF of a continuous random variable is always 0. So another probability distribution
    characteristic, i.e., the probability density function (PDF), which represents
    the slope of the CDF, is frequently used to characterize continuous random variables.


    ```

    f_X(x) = \frac{dF_X(x)}{dx}

    ```


    # 1.4 STATISTICAL PROPERTIES


    Statistical properties allow us to summarize the behavior of a random variable
    as a single number, rather than a distribution function, and thus provide a very
    useful criterion for choosing the most suitable solution from various probabilistic
    analysis results. The most widely used statistical property is expectation, which
    is defined for a random variable X as follows:


    ```

    E_X[X] = \begin{cases} \sum_i x_i p_x(x_i), & \text{if } X \text{ is discrete};
    \\ \int_{-\infty}^{+\infty} x f_x(x) dx, & \text{if } X \text{ is continuous.}
    \end{cases}

    ```'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'where $\sum_i$ denotes the summation carried over all possible values of the
    random variable X. Another closely associated statistical characteristic is the
    nth moment of a random variable X, which is basically the expected value of the
    random variable X^n. Thus, the expectation and the first moment of a random variable
    represent the same statistical characteristic of a random variable. Another useful
    statistical characteristic of random variables is the measure of their dispersion
    from the average or the typical values.


    The most widely used measures of dispersion are the standard deviation and the
    variance. The variance of a random variable X describes the difference between
    X and its expected value.


    ```

    Var[X] = \sigma_x^2 = \begin{cases} \sum_i (x_i - E_x[X])^2 p_x(x_i), & \text{if
    } X \text{ is discrete}; \\ \int_{-\infty}^{\infty} (x - E_x[X])^2 f_X(x) dx,
    & \text{if } X \text{ is continuous.} \end{cases} \quad (1.5)

    ```


    The square root of the variance, which is always a positive number, is known as
    the standard deviation; which is a useful in the sense that it has the same units
    as X and thus can be compared directly with the expected value. Based on the expectation
    and variance characteristics of a random variable, we can find bounds for the
    tail distribution, i.e., the probability that a random variable assumes values
    that are far from its expectation. These bounds are usually calculated using the
    Markov''s or the Chebyshev''s inequalities. The Markov''s inequality gives an
    upper bound for the probability that a non-negative random variable X is greater
    than or equal to some positive constant.


    ```

    \text{Pr}(X \ge a) \le \frac{E_X[X]}{a} \quad (1.6)

    ```


    Markov''s inequality gives the best tail bound possible, for a nonnegative random
    variable, using the expectation for the random variable only. Chebyshev''s inequality
    provides a significantly stronger tail bound than the Markov''s inequality by
    using the variance of the random variable:


    ```

    \text{Pr}(|X - E_X[X]| \ge a) \le \frac{Var[X]}{a^2} \quad (1.7)

    ```'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Due to the widespread interest in failure probabilities and the ease of calculation
    of tail distribution bounds, Markov and Chebyshev''s inequalities have now become
    one of the core techniques in modern probabilistic analysis.


    # 1.5 TRADITIONAL PROBABILISTIC ANALYSIS METHODS


    Traditionally, probabilistic analysis is done using paper-and-pencil proof techniques.
    The main idea here is to develop a randomized model of the given system on paper
    and then use mathematical reasoning to derive the desired probabilistic and statistical
    properties on paper. However, this method cannot cope with the complexity of the
    present-age engineering and scientific systems. This fact has led to the usage
    of computers for conducting probabilistic analysis. These days, simulation (Ross,
    2002) has become the most commonly used computer based probabilistic analysis
