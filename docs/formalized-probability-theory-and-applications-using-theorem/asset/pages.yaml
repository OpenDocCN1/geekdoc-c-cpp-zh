    # 12.2 CUMULATIVE DISTRIBUTION FUNCTION


    In this section, we present the formal specification of the cumulative distribution
    function (CDF) and the verification of CDF properties in the HOL4 theorem prover.
    The CDF and its properties have been an integral part of any reliability analysis
    as all the lifetime distributions are primarily based on CDF.


    Mathematically, the CDF is defined as follows:


    $F_x(t) = Pr(T \le t)$ (12.5)


    It follows from Equation (9.5) that the CDF can be formally specified in HOL4
    by a higher-order-logic function that accepts a random variable as an argument
    and returns the probability of the event when the given random variable is less
    than or equal to the value of any given real number. A formalization of the CDF
    has already been given in Definition 5.6 and we repeat it here:


    # Definition 12.1


    ```

    ⊢ ∀ p x. CDF p X x = distribution p X { y | y ≤ x }

    ```


    where X represents the random variable, p is the probability space and x is the
    real argument. Using this formal specification of the CDF, we can verify the classical
    CDF properties within the HOL4 theorem prover. The formal proofs for these properties
    not only ensure the correctness of Definition 9.1 but also play a vital role in
    proving various reliability properties associated with the lifetime distributions.


    # 12.2.1 CDF Bounds


    According to the CDF bounds property, for any real number x, 0 ≤ F_x(x) ≤ 1. In
    other words, if we plot the CDF against its real argument x, then the graph of
    the CDF, F_x, is always going to be between the two horizontal lines y=0 and y=1.
    This characteristic can be verified in HOL4 using the basic probability law, which
    states that the probability of an event is always less than 1 and greater than
    0.'
