  md: '# Figure 1. 5'' splice site recognition model


    ![](img/0e284aa46fa831bc38a68343fef110e3_136_0.png)


    A DNA fragment is a sequence of proteins called A, T, G and C. However, not every
    sequence represents a valid DNA: some regularities can be found among the possible
    sequences. For instance, it might be that all four proteins can appear with equal
    probability at the beginning of the sequence, but after a particular point, only
    A and G can appear, and then all four can appear again but with higher probabilities
    for A and E. In this application, there are thus three different “states” of the
    DNA, characterized by the probabilities of occurrence of each base. In this DNA
    model, the first state is called exon (E), the second one 5’ splice site (5),
    and the third one intron (I). This model is described studied very naturally using
    HMMs: a DTMC over the states E, 5, and I is used in order to know in which state
    the proteins are, then another random process is defined which characterizes the
    emission of A, G, T or C according to the state which the proteins are in. This
    is summarized in Figure 1.


    In order to formalize this HMM, we first define the types representing the states
    and the bases below.


    ```

    Definition 8.3

    | dna = A | G | T | C

    | state = START | E | I | FIVE | END

    ```


    Note that, in order to characterize the sequence, it is a common practice to add
    some fake start and end states. Hence the definition of state in Definition 8.3
    includes START and END, which have no emission probabilities. As examples, we
    define the following state and DNA sequences:'
