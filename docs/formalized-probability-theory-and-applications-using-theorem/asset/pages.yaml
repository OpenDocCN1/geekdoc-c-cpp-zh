- pgno: 265
  md: 'Finally, we show that the above mentioned two results are also valuable for
    the given application for border surveillance through a simple instantiation of
    the input parameter q by its value. The corresponding HOL4 analysis is given in
    the following 2 lemmas.


    # Lemma 14.15


    ```

    |- ∀ p m s L Ts. (0 < s < 1) ∧ (0 < L) ∧ (0 < Ts) ∧ (∀k. L < & (SUC k) × Ts)

    ⇒ lim (k→∞) (∀x. Pd_surv p (k × m) k s L Ts (0.28)) =

    1 - (1 - s) × e ^ (-⌊L / Ts⌋) × (0.28) × m - s × e ^ (-⌊(L + 1) / Ts⌋) × (0.28)
    × m.

    ```


    # Lemma 14.16


    ```

    |- ∀ p s L Ts. (0 < s < 1) ∧ (0 < L) ∧ (0 < Ts) ∧ (∀k. L < & (SUC k) × Ts)

    ⇒ lim (m→∞) (∀m. lim (k→∞) (∀x. Pd_surv p (k × m) k s L Ts (0.28))) = 1.

    ```


    Unlike traditional analysis techniques for the validation of a WSN for border
    surveillance, using the k-set randomized scheduling algorithm, our approach is
    much more efficient. Indeed, while paper-and-pencil based analysis or simulation
    cannot guarantee the correctness of the scheduling performance results, the reported
    theorems in this chapter are absolutely accurate. This distinguishing feature
    is due to the inherent soundness of theorem proving and its generic nature, e.g.,
    the detection probability for any given values of n and k can be computed by instantiating
    Theorem 14.2 with appropriate values. Contrarily, simulation is usually restricted
    to specific network configurations, while probabilistic model checking is frequently
    using parameter abstraction in order to cope with the state-space explosion problem
    (Pruth, 2006). Moreover, for each of the formally verified theorems, the set of
    required assumptions is clearly stated so there is no doubt about missing a critical
    assumption. This can never be ensured in simulation and model checking where many
    assumptions can be taken into account without explicitly mentioning them.


    In this work, we provided a completely rigorous method for the performance evaluation
    of the randomized scheduling algorithm for WSNs through theorem proving. Indeed,
    the probabilistic feature of the randomized nodes scheduling algorithm makes its
    analysis challenging for all possible cases. Since the assignment of the sensor
    nodes to the k sub-networks is randomly done, it may happen that some of the sub-networks
    are empty. Moreover, due to the random deployment of nodes, the random scheduling
    can lead to a situation where certain parts of the area'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'are not monitored at all or simultaneously monitored by many sensors. Rigorous
    performance evaluation of such algorithm is a non-trivial task, especially given
    the non-exhaustive nature of traditional performance analysis techniques.


    Throughout this chapter, we developed the formalizations of the detection properties
    of wireless sensor networks using the k-set randomized scheduling within the HOL4
    theorem prover. We have been able to achieve accurate formalizations of the intrusion
    period of any occurring event, upon which we have built our formal developments
    of the detection probability and delay. The practical effectiveness of these higher-order-logic
    developments, have been then illustrated, later, through analyzing a WSN for border
    surveillance, using the k-set randomized scheduling algorithm.


    Due to the undecidable nature of higher-order logic, the development of the detection
    properties consumed approximately about 260 man-hours and 2400 lines of code.
    On the other hand, the formal analysis of our application took only 400 lines
    of HOL4 code for the verification of Lemmas 14.1, 14.2, 14.7 and 14.8. Whereas,
    the proofs of the monotonicity of the detection delay versus the two parameters
    n and k in Lemmas 14.3 and 14.9 have been quite tedious and long, and took at
    their own 1500 lines of HOL4 code. Indeed, given the complexity of the mathematical
    expressions of the detection delay, the HOL4 analysis of these 2 lemmas was requiring
    a lot of real reasoning on the convergence of series and the properties of infinite
    sums. More specifically, to prove Lemma 14.3, we have been obliged to consider
    another mathematical solution since the initial paper-and-pencil proof includes
    some mathematical aspects, which were not available in the HOL4 theories. In addition,
    looking for the range from which the detection delay starts to be decreasing versus
    n, was somewhere tricky. Regarding the proof of Lemma 14.9, it has been based
    on computing the derivative of the corresponding real functions and applying the
    mean value theorem. Similarly, the proofs of Lemmas 14.13 and 14.14 have been
    quite lengthly consuming in total 600 lines of HOL4 code. Indeed, as we previously
    mentioned, these proofs required the mathematical theorem lim (1 + x / k)^k =
    e^x, which was missing in HOL. The latter is based on a lot of real analysis associated
    to the definition of the exponential function as a power series and many properties
    related to the sequences convergence.


    Thanks to the sound support of the probability theory available within the HOL4
    theorem prover, we have been able to provide an accurate formalization of the
    detection performance of the k-set randomized scheduling through an appropriate
    modeling of its inherent randomness. It is clear that other analysis techniques
    can never have this efficiency. Indeed, previous simulation works are mainly based
    on pseudo-random modeling. Similarly, compared to probabilistic model checkers,
    a major novelty provided in this chapter is the ability'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'to perform formal and accurate reasoning about statistical properties of the
    problem. Hence, it was possible to verify the detection delay as a statistical
    measure. Moreover, the generic nature of theorem proving and the high expressibility
    of higher-order logic, allows us to set up theorems for any values for the number
    of nodes n, the number of disjoint subsets k, the success probability q, the intrusion
    period L, and the scheduling time slot T. Obviously, such generality can never
    be achieved by simulation and model checking. Finally, because missing a critical
    assumption can lead to verification failure within the theorem prover, the current
    approach is distinguishable by its completeness regarding the minimum set of assumptions.


    On the other hand, the formal performance analysis of the detection behavior of
    the border surveillance application distinctly shows the usefulness of the theoretical
    higher-order-logic developments. Furthermore, such verification enables reliable
    asymptotic reasoning of the deployed WSN. For example, the missing term in the
    proof of Lemma 14.9 clearly highlights the main strength of formal methods guaranteeing
    accurate and complete results. It is also important to note that the presented
    application is a simple case study illustrating the feasibility, but these results
    can be valuable for any other WSN application as well.


    The above mentioned additional benefits, associated with the theorem proving approach,
    are attained at the cost of the time and effort spent, while formalizing the randomized
    scheduling algorithm and formally reasoning about its detection properties, by
    the user. We believe that the main challenge incurred in our work was to map a
    probabilistic model of a real WSN algorithm, which is far from a pure mathematical
    problem, into higher-order logic. Indeed, many difficulties were faced in this
    work. The mathematical modeling of real-world systems is commonly very intuitive.
    The initial theoretical model hence included many hidden steps with few attached
    explanations either when considering the random variables or when applying the
    probability rules. We have thus to reason correctly about all missing steps so
    that we can first understand the flow of the theoretical analysis, and achieve
    then the higher-order-logic formalizations of the detection attributes. At this
    stage, a good background on probability and a solid knowledge of the WSN context
    is usually required for a deep understanding of the probabilistic reasoning. Additionally,
    the assumptions of the original model are never presented exhaustively, whereas,
    a complete set is essential for a successful verification. Nevertheless, the fact
    that we were building on top of already verified probability theory related results
    helped significantly to keep the amount of proof efforts reasonable.'
