- pgno: 150
  md: 'where $H(X)$ and $H(X|Y)$ represent the Shannon entropy of X and the conditional
    entropy of X given Y, respectively.


    # Definition 9.9


    ```

    |- ∀ X Y p. ILD p X Y = conditional_entropy p X Y / entropy p X

    ```


    To better understand the intuition behind this definition, let us consider the
    two extreme cases of a completely secure program and a completely insecure program.
    Complete security, intuitively, happens when the knowledge of the public output
    Y of a program does not affect the uncertainty about the secret input X. This
    is equivalent to the requirement that X is independent of Y. In this case $H(X|Y)
    = H(X)$ and the information leakage degree is equal to 1. On the other hand, when
    the output of the program completely identifies its secret input, the entropy
    $H(X|Y)$ is equal to 0 and hence the information leakage degree is equal to 0
    in this case of perfect identification. For situations between the two extremes,
    it can be verified that the information leakage degree lies within the interval
    (0, 1).


    # Theorem 9.4


    ```

    |- ∀ X Y p.0 ≤ ILD p X Y ≤ 1

    ```


    Using the properties of the mutual information, $I(X; Y)$, it can also be formally
    verified that the information leakage degree is also equal to


    $D = 1 - \frac{I(X;Y)}{H(X)}$ (9.12)


    This result illustrates the significance of the information leakage degree definition
    since the mutual information measures how much information an adversary can learn
    about the input X after observing the output Y.


    # 9.6.2 Conditional Information Leakage Degree


    Consider a program that has a set of high security inputs S, a set of low security
    inputs L and a set of public outputs O (Zhu & Bettati, 2009). The adversary wants
    to learn about the high inputs S by observing the outputs O given the knowledge
    of the low inputs L. To capture this added information for the adversary (low
    inputs), the following definition, called the conditional information leakage
    degree, may be used'
  merge: -1
  img_proc: true
