    # Discrete-Time Markov Reward Models


    Discrete-time Markov Reward Models (DMRMs) are extended DTMCs that consider the
    costs, or dually bonuses (rewards). In the performance analysis of some real-world
    systems, DMRMs allow numerous quantitative measures of the system, such as the
    elapsed time, power consumption, size of message queue, net profit, etc.


    Mathematically, a DMRM is defined on a DTMC / Xt / t ≥ 0 with a real valued reward
    function rxy, which associates a real reward (or cost) to a state x in the state
    space of X for all t, t ≥ 0 by the conditional expectation of the reward (or cost)
    given the state x.'
