  md: '# ## 8.2 HMM PROPERTIES


    HMMs are used to solve three types of problems: 1) evaluating the probability
    of occurrence of a particular observed sequence; 2) finding the most probable
    state sequence to generate given observations; and 3) learning parameters in the
    presumed model. The solutions are related to certain important HMM properties,
    which are verified in the following sections.


    # ## 8.2.1 Joint Probability of HMM


    The most important property of time-homogeneous HMMs is the expression of the
    joint distribution of a sequence of states and its corresponding observation,
    which can be expressed using products of its emission probabilities and transition
    probabilities. This is frequently used to find the best state path or estimate
    model''s parameters. Mathematically, this is expressed as the following equation:


    ```

    \mathcal{P}r \left( Y_{0},...,Y_{t},X_{0},...,X_{t} \right) =

    \mathcal{P}r \left( X_{0} \right) \mathcal{P}r \left( Y_{0} | X_{0} \right) \prod_{k=0}^{t-1}
    \mathcal{P}r \left( X_{k+1} | X_{k} \right) \mathcal{P}r \left( Y_{k+1} | X_{k+1}
    \right) \quad (8.1)

    ```


    and has been formally verified using the HOL4 theorem prover as follows:


    # ## Theorem 8.1


    ```

    |- !V X Y p s_x s_y P_0 P_ij P_xy t sts_x sts_y.

    thmm X Y p s_x s_y P_0 P_ij P_xy =>

    (P (| \k_0. {x | X k x = EL k sts_x} \inter k_0. {x | Y k x = EL k sts_y}) =

    P {x | X 0 x = EL 0 sts_x }

    P ({x | Y 0 x = EL 0 sts_x } | {x | X 0 x = EL 0 sts_x })

    (PROD (0, t) (\k. P. P ({x | X (k + 1) x = EL (k + 1) sts_x } |

    { x | X k x = EL k sts_x })

    P ({x | Y (k + 1) x = EL (k + 1) sts_x } |

    { x | X (k + 1) x = EL (k + 1) sts_x }))))

    ```


    where the first eight variables keep the same notations as the corresponding ones
    in Definitions 8.1 and 8.2, variable t represents the index of the last observation
    considered in this theorem and it also equals to the amount of the production
    numbers from 0 to (t – 1) on the right-side of Equation (8.1), and sts_x and sts_y
    denote the possible underlying state path and observable sequence, respectively.'
