  md: 'tourism industries and its impact still continues. Just like the BP pipeline,
    there are tens of thousands of miles long oil and gas pipelines around the world.
    All of these pipelines are aging and are becoming more and more susceptible to
    failures, which may lead to disasters like the BP one. Hence, it is very important
    to do rigorous reliability analysis of oil and gas pipelines to detect and rectify
    potential problems.


    The reliability analysis of a pipeline system (Soszynska, 2010) involves a three-step
    process:


    +   1. Partitioning the given pipeline into segments and constructing its equivalent
    reliability block diagram (RBD),

    +   2. Assessing the reliability of the individual segments, and

    +   3. Evaluating the reliability of the complete pipeline system based on the
    RBD and the reliability of its individual segments. The reliability of an individual
    segment is usually expressed in terms of its failure rate \(\lambda\) and a random
    variable, like exponential or Weibull random variable, which models the failure
    time. A single oil or gas pipeline can be simply modeled as a series RBD. However,
    in many cases, these pipeline systems have either reserved components or subsystems
    and such pipeline systems exhibit a combination of series and parallel RBDs.


    The reliability analysis of oil and gas pipelines has predominantly been accomplished
    by first gathering data from in-line inspection tools to detect cracks, corrosion
    or damage. This information is then manipulated using the paper-and-pencil based
    analytical analysis and computer simulations to deliver diagnostics and insightful
    pipeline integrity reports. However, due to the complex nature of large pipeline
    system analysis, paper-and-pencil proof methods are error prone and the exhaustive
    testing of all possible system behaviors using simulation is almost impossible.
    Thus, these traditional analysis techniques cannot guarantee accurate results,
    which is a severe limitation in the case of oil and gas pipelines as an uncaught
    system bug may endanger human and animal life or lead to a significant financial
    loss.


    The inaccuracy limitations of traditional analysis techniques can be overcome
    by using the formalized RBD approach described in this chapter. In order to illustrate
    the utilization and effectiveness of the proposed idea, we utilize the above-mentioned
    formalization to analyze a simple pipeline that can be modeled as a series RBD
    with an exponential failure time for individual segments.


    A typical oil and gas pipeline can be partitioned into a series connection of
    N segments, where these segments may be classified based on their individual failure
    times. For example, a 60 segment pipeline can be analyzed under the assumption
    that the segments, which exhibit exponentially distributed failure rates, can
