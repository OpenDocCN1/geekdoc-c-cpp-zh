    # ABSTRACT


    The main focus of this chapter is on the formalization of classified DTMCs. The
    chapter begins by presenting the formalization of some foundational notions of
    classified states, which are categorized based on reachability, periodicity, or
    absorbing features. Then, these results along with the formal definition of a
    DTMC, presented in the previous chapter, are used to formalize classified Markov
    chains, such as aperiodic and irreducible DTMCs. Based on these concepts, some
    long-term properties are verified for the purpose of formally checking the correctness
    of the functions of Markovian systems or analyzing the performance of Markov chain
