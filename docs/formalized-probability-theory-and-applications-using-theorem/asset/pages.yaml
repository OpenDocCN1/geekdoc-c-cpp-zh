- pgno: 23
  md: '# ## 2.1 INTRODUCTION


    The history of formal methods dates back to Knuth and Dijkstra as both of them
    advocated the topic. Formal verification methods started to be investigated as
    CAD tools in the 1970s for software verification. However, the interest was marred
    by the fact that software bugs can be easily fixed by releasing a software patch
    and thus the added reliability of software is not worth the rigorous exercise
    of formal verification. There were some research activity related to the formal
    verification of security systems funded by the US National Security Agency in
    the 1980s but the real catalyst for the active research interest in formal verification
    was their usage in verifying digital hardware systems in late 1980s. This is mainly
    because hardware descriptions are often more regular and hierarchical than software
    ones, hardware primitives are less obscure than the ones used in software and
    the cost of an uncaught design bug in hardware is much more profound than software
    since the hardware silicon chip once fabricated cannot be fixed by releasing a
    patch but instead has to be re-designed and re-fabricated, which costs considerable
    amount of time and money. The Intel FDIV bug in 1994 (Pentium FDIV Bug, 2015)
    further enhanced the interest in formal hardware verification and the industry
    started to adopt formal hardware verification tools in their design flows in late
    1990s. With the success of formal verification in hardware and due to some interesting
    developments in the underlying technologies, it started to be used again for software,
    transportation and security system analysis domains. Moreover, formal verification
    has recently been explored for accurately analysis of continuous physical systems,
    such as control systems, robotics and analog circuits. The future of formal methods
    seems to be quite promising and besides academia, industry giants, like Intel
    and Microsoft, are also actively participating in the research related to both
    foundational and practical aspects.


    The added benefits of formal verification methods (Hall, 2007) come mainly at
    the cost of extreme rigor. Generally speaking, the expressiveness of a formal
    verification method is in direct proportion with the amount of required user intervention.
    Thus, formal verification of complex systems is more challenging and time consuming.
    Therefore, the general trend is to use a lightweight approach, i.e., use traditional
    verification methods, like simulation or testing, where accuracy of the analysis
    is not a big concern while using formal verification methods for the critical
    sections of the systems. On similar lines, hybrid formal verification methods
    are also being developed which allow us to partition the overall system model
    based on its complexity levels and thus facilitate using automatic formal verification
    methods for the rather simpler sections of the system while using the interactive
    methods with the complex sections.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Generally, formal verification methods are classified based on their underlying
    logic, expressiveness and decidability. The most commonly used formal verification
    methods include model checking and theorem proving, which are described in detail
    below:


    # 2.2 MODEL CHECKING


    Model checking is primary used as the verification technique for reactive systems,
    i.e., the systems whose behavior is dependent on time and their environment, like
    controller units of digital circuits and communication protocols. The inputs to
    a model checker include the finite-state model of the system that needs to be
    analyzed along with the intended system properties, which are expressed in temporal
    logic. The model checker automatically verifies if the properties hold for the
    given system while providing an error trace in case of a failing property. The
    main verification principle behind model-checking is to construct a precise state-based
    model of the given system and exhaustively verify the given property for each
    state of this model. The analysis is automatic which is why model checking is
    one of the most widely used formal verification technique. On the other hand,
    model-checking is limited to systems that can only be expressed as finite-state
    machines. Another major limitation of the model checking approach is state space
    explosion. The state-space of a system can be very large, or sometimes even infinite.
    Thus, it becomes computationally impossible to explore the entire state-space
    with limited resources of time and memory. This problem is usually resolved by
    working with abstract, less complex, models of the system by somehow compromising
    the accuracy of the analysis.


    Many efficient methods have been proposed to alleviate the memory and computation
    requirements of model checking. Symbolic model checking is based on the idea of
    grouping multiple states together and assigning them a unique symbol and then
    running model-checking algorithms on this symbolic state-space. Bounded model
    checking (BMC) (Baier & Katoen, 2008) is an extension of symbolic model checking
    and the idea is to encode states as propositional logic formulas and then use
    SAT solvers (Huth & Ryan, 2000) for the analysis. A subset of executions with
    an upper bound on length, say k, is chosen and the counter-example is searched
    in this subset in BMC. If the contradiction is not found then the value of k is
    increased and the algorithm is re-run.


    For illustration purposes, consider a simple automatic bank teller machine (ATM):
    The first step to initiate a transaction is to insert the ATM card. Next, the
    user may make a request, like requesting and depositing money, or do nothing.
    If a request is made then it is serviced and the card is ejected else the card
    is ejected without providing any service to the user. The first step in analyzing'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Figure 1. State transition system for the simple ATM


    ![](img/0e284aa46fa831bc38a68343fef110e3_25_0.png)


    this system using model checking is to construct a state-based model, depicted
    in Figure 1, for this system in the language supported by the model checker. It
    is interesting to note that more than one transition is possible from the state
    s1. To model such cases, all model-checking languages support non-deterministic
    assignments.


    Now, we may check that eventually the card is ejected for all executions. This
    property can be specified in linear temporal logic (LTL) (Baier & Katoen, 2008)
    as “GF (card eject)”, where the temporal operator G represents the global validity
    of a property and F represents eventual verification of a property in the future.
    The model checker can be invoked to check the correctness of this property and
    it automatically returns False with the counter-example path: s0, s1, s2, s3,
    s1.... This is the case when the user always initiates another request just when
    her previous request was serviced. Similarly, another property could be that every
    request is eventually serviced. This can be modeled in LTL as “G (request → F
    response)” and can be automatically verified by the model checker since it is
    valid for all possible state-paths.


    The above example illustrates that model checking is a rigorous method and unlike
    testing it verifies a property only if it is true for all possible executions.
    This is a very useful feature, as the verification engineer does not need to think
    about creating smart test cases to identify system problems. However, due to the
    same rigorous nature of verification, the technique may not be used for larger
    models.


    Due to the extensive usage of Markov chains in analyzing safety-critical systems,
    a variant of model checking, i.e., probabilistic model checking (Kwiatkowska,
    Norman, & Parker, 2005), has been recently proposed for conducting probabilistic
    analysis of systems that can be modeled as Markovian models. Like traditional
    model checking, it involves the construction of a precise state-based mathematical
    model of the given probabilistic system, which is then subjected to exhaustive
    analysis to verify if it satisfies a set of formally represented probabilistic
    properties. Some notable probabilistic model checkers include PRISM (Kwiatkowska,
    Norman, & Parker, 2005) and Ymer (Ymer, 2015). Besides the accuracy'
