    that if i or j is not in state space, then it can imply both of the transition
    probabilities P_ij and P_ji, corresponding to Trans X p s t l i j and Trans X
    p s t l j i, respectively, equal to zero and thus both sides of the Equation (6.5)
    are zeroes.


    A Markov chain is defined as reversible Markov chain if it satisfies the Detailed
