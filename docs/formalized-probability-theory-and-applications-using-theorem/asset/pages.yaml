    Regular_mc X p s P₀ Pᵢⱼ =

    th_dtmc X p s P₀ Pᵢⱼ^

    ∃ n. ∀ i j. i ∈ space s ∧ j ∈ space s ⇒ Trans X p s t n i j > 0

    ```


    The main utility of the higher-order logic formalization of the classified Markov
    chains mentioned above is to formally specify and analyze the dynamic features
    of Markovian systems within the sound environment of a theorem prover as will
