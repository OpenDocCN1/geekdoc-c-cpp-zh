    # Memory Contention Problem


    Consider a multi-processor system with two memory modules and two processors.
    This system can be modeled as a Discrete-time Markov Reward Model (DMRM), depicted
    in Figure 5, by assuming that access time of any memory module is a constant and
    all the memory modules are synchronized. The states of the system are denoted
    by the pair (i, j), where i represents the number of the processors waiting for
    the memory module 1 and j refers to the amount of the processors waiting for the
    memory module 2. Due to the fact that memory access time is always longer than
    any other data transaction of the processor, it is reasonable to assume that 0
    ≤ i, 0 ≤ j, and i + j = 2 in every memory cycle. Thus, the states set { (1, 1),
    (0, 2), (2, 0) } provides all the possible states of the'
  merge: -1
  img_proc: true
