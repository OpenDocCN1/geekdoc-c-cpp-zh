  md: '# Figure 2. Typical set encoding


    ![](img/0e284aa46fa831bc38a68343fef110e3_173_0.png)


    The encoding is performed separately for the typical and the non-typical set as
    depicted in Figure 2. Clearly, we need to formalize the concept of a typical set
    and prove its properties to be able to formally verify that the average code word
    length associated to the typical-set encoding can be made arbitrarily close to
    the Shannon entropy with a vanishing probability of error. To prove the properties
    of the typical set, we need to prove the Asymptotic Equipartition Property (AEP),
    which in turn, requires the proof of the classical probability results, namely,
    the Weak Law of Large Numbers (WLLN) and the Chebyshev inequality.


    # 11.1.1 Chebyshev and Markov Inequalities


    In probability theory, both the Chebyshev and Markov inequalities provide estimates
    of tail probabilities. The Chebyshev inequality guarantees, for any probability
    distribution, that nearly all the values are close to the mean and it plays a
    major role in the derivation of the laws of large numbers. The Markov inequality
    provides loose yet useful bounds for the cumulative distribution function of a
    random variable. Let X be a random variable with expected value m and finite variance
    σ². The Chebyshev inequality states that for any real number k > 0,


    P (|X - m| ≥ kσ) ≤ 1/k² (11.1)


    The HOL4 formalization of the Chebyshev inequality is stated as:


    ```

    |- random_variable X p Borel ^

    integrable p (λx. ((Xx - E [ X ])^2) ∧ 0 < k ⇒

    prob p { x | x ∈ Ω ∧ kVar [ X ] ≤ | X x - E [ X ] | } ≤ 1/k²

    ```


    The Markov inequality states that for any real number k > 0,


    P (|X| ≥ k) ≤ m/k (11.2)'
