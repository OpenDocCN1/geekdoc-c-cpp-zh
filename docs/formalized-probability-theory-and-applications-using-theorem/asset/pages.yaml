    This communication protocol can be modeled as a DTMC with 4 states: s0 (start),
    s1 (try), s2 (lost) and s3 (delivered), as shown in Figure 3.


    In the start state, the message is generated. The next state is always the state
    try and thus the probability from the start state to try state is 1. The probability
