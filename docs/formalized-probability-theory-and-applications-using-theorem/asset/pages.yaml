    # 5.3 HEAVY HITTER PROBLEM


    Given a Universe U, a data stream of length n and a parameter λ ε [0, 1], the
    Heavy Hitter problem is to find the λ-Heavy Hitter list which contains the elements
    of the Universe that occur in the data stream at least λn times. The algorithms
    for the Heavy Hitter problem are widely used to identify frequently encountered
    items of streams in a compact way. For example, they have been used to identify
    heavily traded stocks in streams of financial transactions, to detect viruses
    spread in networks, to monitor network traffic for statistical data collection
    and to detect Distributed Denial of Services (DDoS). An algorithm for the heavy
    hitter problem is as follows:


    ```

    Input: the frequencyλ, a data stream DS and a Universe U with length n

    Output: the list L of elements from U occurring at least λ * n times in DS

    L ← [ ]

    for i = 1 → n do

    if freq (DS [i]) ≥ λthen

    L ← L INSERT DS [i]

    end if

    end for

    ```


    The major goal of analyzing such a problem is to predict the behavior of some
    precise elements in a data stream. For example, controlling specific transactions
    in a financial flow. The biggest challenge in this analysis is the unpredictable
    nature of the input data stream. Therefore, probabilistic techniques are used
    for the analysis where the algorithm is modeled by an appropriate random variable.


    In this section, we conduct the formal probabilistic analysis of the heavy hitter
    problem using theorem proving. For this purpose, we first formalize the above
    algorithm in higher-order logic along with the random input behavior. This is
    followed by the formal verification of an interesting performance characteristic,
    i.e., Chebychev’s inequality based bound on the probability of identifying a heavy
    hitter, within the sound environment of a theorem prover. The analysis results
    can'
