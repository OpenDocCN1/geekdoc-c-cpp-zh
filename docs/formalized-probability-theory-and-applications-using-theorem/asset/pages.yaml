    # 4.2 FORMALIZATION OF MEASURE THEORY


    A measure is a way to assign a number to a set, interpreted as its size, and can
    be considered as a generalization of the concepts of length, area, volume, etc.
    Two important examples are the Lebesgue measure on a Euclidean space and the probability
    measure on a Borel space. The former assigns the conventional length, area and
    volume of Euclidean geometry to suitable subsets of $\mathbb{R}^n, n = 1; 2; 3$
    and the latter assigns a probability to an event and satisfies the condition that
    the measure of the sample space is equal to 1.


    The HOL4 formalization of measure theory (Mhamdi, Hasan & Tahar, 2010) is primarily
    based on the Zermelo-Fraenkel set theory with the famous Axiom of Choice (ZFC).
    This set theory is the most common foundation of mathematics down to the present
    day and allows avoiding a number of paradoxes caused by the use of the naive set
    theory. The Axiom of Choice, however, implies the existence of counter-intuitive
    sets and gives rise to paradoxes of its own, in particular, the Banach-Tarski
    paradox, which says that it is possible to decompose a solid unit ball into finitely
    many pieces and reassemble them into two copies of the original ball, using only
    rotations and no scaling. This paradox shows that there is no way to define the
    volume in three dimensions in the context of the ZFC set theory and at the same
    time requires that the rotation preserves the volume, and that the volume of two
    disjoint sets is the sum of their volumes. The solution to this is to tag some
    sets as non-measurable and to assign a volume only to a measurable set. Consequently,
    a measure function is defined over a class of subsets called the measurable sets
    and assigns a non-negative real number to every measurable set. It satisfies the
    countable additivity condition, which states that the measure of the union of
    a collection of disjoint sets is equal to the sum of their measures.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'Let A be a collection of subsets (or subset class) of a space X. Now, a predicate,
    which is a function with an output of Boolean type, subset_class can be defined
    in HOL4 such that it can test whether A is a subset class of X.


    # Definition 4.7


    ```

    ⊢ ∀ X A. subset_class X A = ∀ s. s ∈ A ⇒ s ⊆ X

    ```


    A set is called countable if its elements can be counted one at a time, or in
    other words, if there exists a surjective function: f : N → s such that every
    element of the set s can be associated with a natural number. This is formalized
    in HOL4 as:


    # Definition 4.8


    ```

    ⊢ ∀ s. countable s = ∃ f. ∀ x. x ∈ s ⇒∃ (n: num). f n = x

    ```


    Now, a collection of subsets A (or subset class) of a space X, defines a sigma
    algebra on X if A contains the empty set ∅, and is closed under countable unions
    and complementation within the space X.


    # Definition 4.9


    ```

    ⊢ ∀ X A. sigma_algebra (X, A) =

    subset_class X A ∧ { } ∈ A ∧

    (∀ s. s ∈ A ⇒ X \ s ∈ A) ∧ ∀ c. countable c ∧ c ⊆ A ⇒

    ∪ c ∈ A

    ```


    where X\s denotes the complement of s within X and ∪c, i.e., the union of all
    elements of c. The pair (X, A) is called a σ-field or a measurable space and A
