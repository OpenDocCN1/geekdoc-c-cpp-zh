  img_proc: true
- pgno: 198
  md: 'Traditionally, the RBD-based analysis has been done using paper-and-pencil
    proof methods and computer simulations (Sahinoglu & Ramamoorthy, 2005). The first
    step in the paper-and-pencil based proof methods is to express the reliability
    of a sub-module in terms of its failure rate \(\lambda\) and a random variable,
    like exponential or Weibull random variable, which models the failure time. This
    information, along with the RBD of the system, is then used to analytically derive
    mathematical expressions for the system-level failure characteristics. Due to
    the involvement of manual manipulation and simplification, this kind of analysis
    is error-prone and the problem gets more severe while analyzing large systems.
    Moreover, it is possible, in fact common occurrences, that many key assumptions
    required for the analytical proofs are in the mind of the mathematician and are
    not documented. These missing assumptions are thus not communicated to the design
    engineers and are ignored in the system implementations, which may also lead to
    erroneous designs. The RBD-based computer simulators, such as ReliaSoft (2015)
    and ASENT Reliability analysis tool (2014) generate samples from the exponential
    and Weibull random variables to model the reliabilities of the sub-modules of
    the system. This data is then manipulated using computer arithmetic and numerical
    techniques to compute the reliability of the complete system. These software are
    more scalable than the paper-and-pencil proof methods. However, they cannot ensure
    absolute correctness as well due to the involvement of pseudo random numbers and
    numerical methods.


    To overcome the above-mentioned inaccuracy problems, formal methods have been
    proposed for the RBD-based analysis as well. For example, colored Petri nets (CPN)
    (Rodious, Xu, Xing & Zhou, 2010) have been used to model dynamic RBDs (DRBDs),
    which are used to describe dynamic reliability behavior of systems. The CPN verification
    tools, based on model checking principles, are then used to verify behavioral
    properties of the DRBDs models to identify design flaws. However, due to the state-based
    model, only state related property verification, like deadlock checks, is supported
    by this approach, i.e., we cannot verify generic reliability relationships for
    the given systems using the approach. On the other hand, the higher-order-logic
    theorem prover HOL4 can be used for RBD analysis using the probability theory
    available in the HOL4 theorem prover, to formalize reliability block diagrams
    and the exponential random variable. In the current chapter, we formalize the
    service, parallel, parallel-series and series-parallel RBD configurations. The
    parallel configuration allows us to model redundancy in the successful paths of
    the system and the overall system fails only if all the redundant paths fail.
    Thus, most of the RBDs for the real-world systems involve a combination of series
    and parallel configurations and the results of the current chapter allow us to
    formally assess the reliability of a wider range of systems. To illustrate the
    practical effectiveness of our work, we utilize our foundational formalization
    to conduct the formal reliability analysis of a'
