  md: '# KEY TERMS AND DEFINITIONS


    **Continuous Random Variable:** A random variable is called continuous if it can
    attain an infinite number of values or in other words its range is an interval
    of real numbers.


    **Discrete Random Variable:** A random variable is called discrete if the number
    of different values that it can acquire, or its range, is finite or at most countably
    infinite.


    **Probabilistic Analysis:** Probabilistic analysis of a system is the process
    of applying probability theory based reasoning to estimate the probabilities of
    interesting events associated with the given system.


    **Random Variable:** A random variable is a function that maps elements of a probability
    space to some other measurable space.'
