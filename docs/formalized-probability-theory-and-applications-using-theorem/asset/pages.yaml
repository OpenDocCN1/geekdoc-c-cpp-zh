    # 7.3 FORMAL VERIFICATION OF LONG-TERM PROPERTIES


    The analysis of the long-term behavior of a DTMC is dependent on the type of state
    under consideration. Among the classified DTMCs formalized in the previous section,
    aperiodic and irreducible DTMCs are considered to be the most widely used ones
    in analyzing Markovian systems because of their attractive stationary properties,
    i.e., their limit probability distributions are independent of the initial distributions.
    For this reason, we now focus on the verification of some key properties of aperiodic
    and irreducible DTMCs.


