  md: '# 11.1.4 Typical Set


    A consequence of the AEP is the fact that the set of observed sequences (x1, ...,
    xn) for which joint probabilities p(x1, x2, ..., xn) are close to 2^-nH(X) has
    a total probability equal to 1. This set is called the typical set and such sequences
    are called the typical sequences. In other words, out of all possible sequences,
    only a small number of sequences will actually be observed and those sequences
    are nearly equally probable. The AEP guarantees that any property that is proved
    for the typical sequences will then be true with high probability and will determine
    the average behavior of a large sample.


    # Definition 11.1


    The typical set $A_\epsilon^n$ with respect to $p(x)$ is the set of sequences
    $(x_1, ..., x_n)$ satisfying:

    $2^{-n(H(X)+\epsilon)} \le p(x_1, ..., x_n) \le 2^{-n(H(X)-\epsilon)}$ (11.6)


    The typical set has the following properties


    # Theorem 11.4


    if $(x_1, ..., x_n) \in A_\epsilon^n$


    then


    H(X) - \(\epsilon \le - \frac{1}{n} \log (P(X_1, ..., X_n)) \le H(X) + \epsilon\)
    (11.7)


    This theorem is a direct consequence of Definition 5.1.


    # Theorem 11.5


    \(\forall \epsilon > 0, \exists N, \forall n \ge N, P(A_\epsilon^n) > 1 - \epsilon.\)


    The proof of this theorem is derived from the formally verified AEP. The next
    two theorems give upper and lower bounds for the number of typical sequences \(|A_\epsilon^n|\).


    # Theorem 11.6


    \(|A_\epsilon^n| \le 2^{n(H(X) + \epsilon)}.\)'
