- pgno: 42
  md: '# 4.1 FORMALIZATION OF EXTENDED REAL NUMBERS


    The set of extended-real numbers R'' is the set of real numbers R extended with
    two additional elements, namely, the positive infinity +∞ and negative infinity
    -∞. Extended reals are useful in describing limiting behaviors in many mathematical
    fields. In particular, it is necessary to use the extended reals system to define
    the integration theory as otherwise the convergence theorems, like the monotone
    convergence and dominated convergence, would be less useful. Similarly, using
    extended reals for defining the measure theory allows us to define infinite measures
    like the sigma-finite measure. We now describe the HOL4 formalization of extended
    reals.


    # 4.1.1 Type and Operators


    An extended real is either a normal real number or positive infinity or negative
    infinity. We use Hol_datatype to define the new type extreal as follows:


    ```

    val _ = Hol_datatype ''extreal = NegInf | PosInf | Normal of real ''

    ```


    The HOL4 notation x: extreal is used to specify that the type of the variable
    x is extreal. The function Normal will convert a real number in HOL4 to its corresponding
    extended real number. For example, Normal (1: real) returns an extended real number
    (1: extreal). All the arithmetic operations of the real numbers need to be extended
    for the new type. This can be done by defining HOL4 functions over the new type
    and then overloading the common operators using these functions. For instance,
    the addition operation over the extended-real numbers can be defined using the
    function extreal_add as follows:


    # Definition 4.1


    ```

    ∀ x y. extreal_add (Normal x) (Normal y) = (Normal x + y) ∧

    extreal_add (Normal _) a = a ∧

    extreal_add b (Normal _) = b ∧

    extreal_add NegInf NegInf = NegInf ∧

    extreal_add PosInf PosInf = PosInf

    ```


    The function is left undefined when one of the operands is PosInf and the other
    is NegInf. The + operator is then overloaded as


    ```

    val _ = overload_on ("+", Term ''extreal_add'');

    ```'
  merge: -1
  img_proc: true
