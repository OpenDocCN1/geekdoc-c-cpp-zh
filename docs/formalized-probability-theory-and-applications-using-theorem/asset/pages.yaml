  md: '# 6.2.2 Chapman-Kolmogorov Equation


    For a finite time homogeneous DTMC $\{ X_t \}_{t \in \sigma^+}$, its transition
    probabilities satisfy the Chapman-Kolmogorov Equation


    $P_{ij}^{(m+n)} = \sum_{k \in S} P_{ik}^{(m)} P_{kj}^{(n)}$ (6.4)


    The Chapman-Kolmogorov equation is a widely used property of time homogeneous
    DTMCs. It gives the probability of going from state $i$ to $j$ in $m+n$ steps.
    Assuming the first $m$ steps take the system from state $i$ to some intermediate
    state $k$ and the remaining $n$ steps then take the system from state $k$ to $j$,
    we can obtain desired probability by adding the probabilities associated with
    all the intermediate steps.


    # Theorem 6.2


    ```

    |- ∀ X p s i j t m n P₀ Pᵢⱼ.

    th_dtmc X p s P₀ Pᵢⱼ ⇒

    (Trans X p s t (m + n) i j =

    SIGMA (IMAGE (λ k. Trans X p s t m i k * Trans X p s t n k j)

    (k ∈ space s)))

    ```


    The above is again verified using induction on the variables m and n. Both of
    the base and step cases are discharged using the following multistep transition
    probability lemma.


