- pgno: 221
  md: '# 13.1 COVERAGE-BASED RANDOMIZED SCHEDULING ALGORITHM


    Wireless sensor networks (WSNs) have been proposed as an efficient solution to
    monitor a field without any continuous human surveillance. Such networks are composed
    of small tiny devices wirelessly connected over the field. The main task of sensors
    involves taking measurements of the monitored event. According to these measurements,
    a decision procedure is made at the base station. The WSNs are extensively being
    deployed these days in a variety of applications like detection of natural disasters
    or biological attacks and military tracking.


    Minimizing energy requirements for the sensor nodes is very critical given the
    fact that these nodes are always stand-alone and battery powered. Scheduling of
    the nodes is one of the most widespread solutions to preserve energy (Lin & Chen,
    2008; Jain & Srivastava, 2007; Liu, Wu, Xiao & Sun, 2006). It consists in splitting
    the network on several sub-networks, which work alternatively. The biggest challenge
    involved in this approach is the ability to provide continuous coverage, i.e.,
    reliable monitoring or tracking by sensors.


    Consider a WSN that deploys n sensors over a field of size a. All sensors have
    the same task: gathering data and routing it back to the base station. The deployment
    of nodes over the two-dimensional field is random and thus no location information
    is available. The size of the sensing area of each sensor is denoted by r. A sensor
    can only sense the environment and detect events within its sensing range. A point
    of the monitored field is considered to be covered when any event occurring at
    this point can be detected by at least one active sensor (Xiao et al, 2010). The
    probability q that each sensor covers a given point is r/a. The random scheduling
    of the nodes assigns each sensor to one of the k sub-networks with equal probability
    1/k. During a time slot Ti, only the nodes belonging to the sub-network i will
    be active and can cover an occurring event. Hence, the disjoint sub-networks created
    will work alternatively. Let: S_i be the set of sensors that belongs to the sub-network
    i and covers a specific point inside the field, S be the set of nodes covering
    a specific point inside the field, and, c, the cardinality of S.


    For illustration purposes, consider randomly deployed eight nodes in the monitored
    region. The nodes are identified by IDs ranging from 0 to 7. There are two sub-networks
    called S0 and S1. Each node chooses at random between 0 and 1 in order to be assigned
    to one of these two sub-networks. Suppose that nodes 0; 2; 5; 6 select the number
    0 and join the subset S0 and nodes 1; 3; 4; 7 choose the number 1 and join the
    subset S1. Thus, the two sub-networks will work alternatively. In other words,
    when the nodes 0; 2; 5; 6, are active, the nodes 1; 3; 4; 7 will be idle and vice
    versa.'
  merge: -1
  img_proc: true
- pgno: 222
  md: "# 13.2 FORMAL ANALYSIS OF THE K-SET RANDOMIZED SCHEDULING\n\nThe formal probabilistic\
    \ analysis of any system can be broadly divided into two main steps, i.e., the\
    \ formalization of the given system, while modeling its random components by the\
    \ formalized random variables, and using this model to formally verify properties\
    \ of interest as higher-order-logic theorems. In this section, we develop a HOL4\
    \ formalization of the coverage-based random scheduling algorithm for WSNs (Elleuch,\
