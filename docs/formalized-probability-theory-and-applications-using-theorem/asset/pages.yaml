    +   - $\vdash \forall x, 0 \le f(x) \Rightarrow 0 \le \int_x f \, d\mu$

    +   - $\vdash \forall x, f(x) \le g(x) \Rightarrow \int_x f \, d\mu \le \int_x
    g \, d\mu$

    +   - $\vdash \int_x c f \, d\mu = c \int_x f \, d\mu$

    +   - $\vdash \int_x f + g \, d\mu = \int_x f \, d\mu + \int_x g \, d\mu$

    +   - $\vdash A \text{ and } B \text{ disjoint sets} \Rightarrow \int_{A \cup
    B} f \, d\mu = \int_A f \, d\mu + \int_B f \, d\mu$


    This chapter presented a higher-order-logic formalization of measure theory including
    the formalization of the Borel sigma algebra. Moreover, a formalization of Lebesgue
    integration along with the formal verification of its main properties and convergence
    theorem is also presented. Both measure theory and Lebesgue integration formalization
    can be used to conduct the formal analysis of a wide range of engineering systems
