  md: '# Definition 9.11


    ```

    ⊢ ∀ X Y Z. markov_chain p X Y Z ⇔

    ∀ x y z, P_{xyz} ( x, y, z ) = P_x ( x ) * P_{y|x} ( y | x ) * P_{z|y} ( z | y
    )

    ```


    Now, it can be verified that X → Y → Z is equivalent to the statement that X and
    Z are conditionally independent given Y. In fact, p ( x ) p ( y | x ) p ( z |
    y ) = p ( x, y ) p ( z | y ) = p ( x | y ) p ( y ) p ( z | y ). This in turn is
    equivalent to I ( X ; Z | Y ) = 0. This result allows us to express the data processing
    inequality as: if X → Y → Z then I ( X ; Z ) ≤ I ( X ; Y ).


    The data processing inequality can be verified using the properties of the mutual
    information. In fact, as shown previously, I ( X ; ( Y, Z ) ) = I ( X ; Z ) +
    I ( X ; Y | Z ). By the symmetry of the mutual information, we also have I ( X
    ; ( Y, Z ) ) = I ( X ; Y ) + I ( X ; Z | Y ). The last equality results from the
    fact that I ( X ; Z | Y ) = 0 for a Markov Chain. Using the non-negativity of
    the conditional mutual information, it is straight forward to conclude that I
    ( X ; Z ) ≤ I ( X ; Y ).


    The data processing inequality is a very important result in information theory
    that is used, for instance, in statistics to define the notion of sufficient statistic.
    We make use of the data processing inequality to interpret the conditional information
    leakage degree. For a system with high security inputs S, low security inputs
    L and outputs O, if the outputs depend only on the low inputs, i.e., p ( O | S,
    L ) = p ( O | L ) then S → L → O and S and O are conditionally independent given
    L. This is the perfect security scenario, for which Dc = 1. Using the data processing
    inequality, we conclude that I ( S ; O ) ≤ I ( S ; L ). This means that when the
    conditional mutual information leakage is equal to 1, no clever manipulation of
    the low inputs, by the attacker, deterministic or random, can increase the information
    that L contains about S, ( I ( S ; L ) ).


    # 9.7 CONCLUSION


    In this chapter, the formalization of measure theory, Lebesgue integration and
    probability theory has been built upon to provide a higher-order-logic formalization
    of the main concepts of information theory. Based on the formalization of the
    KL divergence, most of the commonly used measures of information including the
    Shannon entropy and mutual information have been defined using higher-order logic.
    Two novel measures of information leakage have also been introduced that may be
    used to reason about information flow of real-world protocols and programs.'
