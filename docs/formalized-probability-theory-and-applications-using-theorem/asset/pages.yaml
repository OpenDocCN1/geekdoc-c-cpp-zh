    # ## 5.4 FORMALIZATION OF CONDITIONAL PROBABILITIES


    The notion of conditional probability involves the probability of an event, say
    A, given the information that an event B has occurred. In order to understand
    usage of conditional probability, consider the example of an integrated circuit
    testing process where we test circuits in pairs. The concept of conditional probability
    allows us to compute the probability of correctness of two integrated circuits
    given that the first integrated circuit in the pair was found to be faultless.
    It is important to note that this probability would be different than the probability
    of both integrated circuits being accepted if no information about the first integrated
    circuit acceptance is given. This section provides a higher-order-logic formalization
    of the mathematical relationship for conditional probability and then utilizes
    this formal definition to verify some of its classical properties in the HOL4
    theorem prover. The properties are explained in detail along with some hints on
    their verification to provide some insights about the formalization and verification
    process in HOL [Hasan, 2010b].


