  md: '# # Formalization of Memory Contention Problem


    To formally analyze the properties of this system, we first describe this multi-processor
    system in HOL. As shown in Figure 5, this kind of system can be described as a
    DMRM with aperiodic and irreducible DTMC. First of all, we define the state space
    for the requests as a general function in HOL.


    # ## Definition 7.17


    ```

    \vdash \forall n. request n = (\{r:real\} | r \in [0, n] )

    \vdash \forall n. request\_space n = (request n, POW (request n))

    ```


    where variable n refers to the number of memory modules in the system and POW
    (request n) is the sigma algebra of the request set. In the case of the two processor
    system, at most two requests can be created in a memory cycle, thus, n = 2.


    Now, the system state space and the transition probabilities can be formally expressed
    as follows:


    # ## Definition 7.18


    ```

    \vdash sys\_state = (\{ (0, 2); (2, 0); (1, 1) \}

    \vdash sys\_space = (sys\_state, POW sys\_state)

    \vdash \forall q1 q2 t i j. Lt q1 q2 t i j = case (i, j) of

    ((1, 1), (1, 1)) -> 2q1q2 | ((0, 2), (1, 1)) -> q1 |

    ((2, 0), (1, 1)) -> q2 | ((1, 1), (0, 2)) -> q22 |

    ((0, 2), (0, 2)) -> q2 | ((2, 0), (2, 0)) -> q1 |

    ((1, 1), (2, 0)) -> q21 | (\_, \_) -> 0

    ```


    where sys\_space is a pair, in which the first element is a set sys\_state and
    the second element is the sigma algebra of sys\_state, the function Lt returns
    the transition probabilities.


    # ## Definition 7.19


    ```

    \vdash \forall t i j. rewards t (i, j) =

    if (i, j) = (1, 1) then 2 else

    if (i, j) = (2, 0) then 1 else

    if (i, j) = (0, 2) then 1 else 0

    ```


