  md: '# Lemma 14.5


    ⊢ ∀ p k s L Ts. (1 < k) ∧ (0 < s < 1) ∧ (0 < L) ∧ (0 < Ts) ∧

    (L < s & (k - 1) x Ts)

    ⇒ lim (∀ n. Pd_surv p n k s L Ts (0.28)) = 1.


    In addition, we reconfirm the result of Lemma 14.3 using Lemma 14.6, i.e., increasing
    the number of deployed nodes n gives smaller detection delays and thus a better
    performance of the deployed application.


    # Lemma 14.6


    ⊢ ∀ p k s L Ts. (1 < k) ∧ (0 < s < 1) ∧ (0 < L) ∧ (0 < Ts)

    ⇒ (mono_decr_range (∀ n. (real (D_surv p D n k (0.28))))).


    According to Lemmas 14.1 and 14.3, enhancing the detection capacities of the deployed
    WSN, is possible through the deployment of more nodes. However, random deployment
    is known to be very costly for most WSN applications. In the context of a WSN
    using the k-set randomized scheduling, it is usually possible to improve the whole
    detection capacity of the network by simply updating the number of disjoint subsets
    k by a suitable value.


    Based on the parameter k, we perform now an interesting study of the limiting
    behavior of the detection performances. First, we formally verify that a smaller
    k value induces a larger detection probability Pd_wsn, i.e., Pd_wsn decreases
    while increasing the value of k:


    # Lemma 14.7


    ⊢ ∀ p k q n s L Ts. (1 ≤ n) ∧ (0 < s < 1) ∧ (0 < L) ∧ (0 < Ts) ∧

    (0 < q < 1) ∧

    (∀k. L < s & (sUC k) x Ts) ⇒ (mono_decr (∀k. Pd_wsn p n k s L Ts q)).


    where the HOL4 function mono_decr defines a decreasing sequence as follows:


    # Definition 14.9


    ⊢ ∀ f. mono_decr f ⇔∀n. f (SUC n) ≤ f n.


    We formally confirm that given a number of nodes n, the detection probability
    Pd_wsn goes to 0 when k becomes very large:'
