- pgno: 172
  md: '# 11.1 DATA COMPRESSION


    Data compression or source coding may be viewed as a branch of information theory
    (Cover & Thomas, 1991) in which the primary objective is to reduce redundancy,
    minimizing the amount of data to be stored or transmitted. It consists in encoding
    information using fewer bits than an un-encoded representation would use, through
    use of specific encoding schemes. As depicted in Figure 1, data compression has
    important applications in the areas of data storage and data transmission, for
    instance, in the speech compression for real time transmission over digital cellular
    networks. On the other hand, the proliferation of computer communication networks
    is resulting in massive transfer of data and the growing number of data processing
    applications require storage of large volumes of data. Compressing data reduces
    costs and increases capacity. However, to guarantee reliable transmission or storage
    of data, particularly in systems for safety-critical applications, a certain limit
    of compression must be respected.


    We propose to formally prove an important result establishing the fundamental
    limit of data compression. This result is also known as the Shannon source coding
    theorem (Afeldt & Hagiwara, 2012) and states that it is possible to compress the
    data at a rate that is arbitrarily close to the Shannon entropy without significant
    loss of information (Gray, 1990). In other words, n independent and identically
    distributed (iid) random variables with entropy H (X) can be expressed on the
    average by n H (X) bits without significant risk of information loss, as n tends
    to infinity. To the best of our knowledge, most of the formalization framework
    that we need for this application, such as the properties of real valued measurable
    functions, properties of the expectation of arbitrary functions, variance, independence
    of random variables and the weak law of large numbers, is not available in the
    open literature.


    A proof of this result consists in proposing an encoding scheme for which the
    average code word length can be made arbitrarily close to n H (X) with negligible
    probability of loss. We propose to perform a typical set encoding. The typical
    set contains the typical sequences, which are used to represent the frequent source
    symbols while the non-typical sequences represent rare source symbols.


    Figure 1. Source coding


    ![](img/0e284aa46fa831bc38a68343fef110e3_172_0.png)'
