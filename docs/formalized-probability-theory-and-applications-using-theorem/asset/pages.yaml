    # 10.2.2 Formalization of Belief Min-Entropy


    The Belief Min-Entropy allows us to deal with the attacker''s extra knowledge
    or beliefs about the system behavior. This measure is actually a refinement of
    the Min-Entropy since it takes into account another parameter, i.e., belief, that
    is expected to increase the reliability of the analysis.


    Let pp and pβ denote the distributions related to the system behavior and the
    adversary''s belief, respectively. Given an additional information B = b, the
    adversary chooses a value having the maximal conditional probability according
    to her belief, that is a value x'' ∈ Γb, such that Γb = argmax x∈X pβ (x | b),
    and argmax x∈X pβ (a | b) returns the elements from A having the maximal conditional-distribution.
    In case of more than one value of A with the maximal conditional probability,
    the attacker uniformly and randomly picks a single element from Γb.'
