  md: 'The formal reasoning about the above theorem is primarily based on the Lebesgue
    monotone convergence and the following lemma (Lemma 9.1) which, to the best of
    our knowledge, has not been referred in mathematical texts before:


    If P is a non-empty set of extended-real valued functions closed under the max
    operator, g is monotone over P and g(P) is upper bounded, then there exists a
    monotonically increasing sequence f(n) of functions, elements of P, such that:


    \(sup_x g(f(n)) = sup_x g(f)\) (9.3)


    Proving the Radon Nikodym theorem consists in defining the set F of non-negative
    measurable functions such that for any measurable set A, \(\int_A f d\mu = \nu(A)\).
    This set can be verified to be non-empty, upper bounded by the finite measure
    of the space and closed under the max operator. Next, using the monotonicity of
    the integral and the lemma above, the existence of a monotonically increasing
    sequence f(n) of functions in F can be verified such that:


    \(sup_x \int_X f_n d\mu = sup_x \int_X f d\mu\) (9.4)


    Finally, it can be verified that the function g, defined below, satisfies the
    conditions of the theorem.


    \(\forall x . g(x) = sup_n f_n(x)\) (9.5)


    One of the main reasons why the extended reals have been used in the formalization
    of probability theory is the inability to verify the Radon Nikodym theorem without
    considering infinite values. In fact, the Lebesgue monotone convergence is used
    to prove that:


    \(\int_X g d\mu = sup_n \int_X f_n d\mu\) (9.6)


    On the other hand, if the extended reals were not used then the proof of Lebesgue
    monotone convergence requires the sequence fn to be convergent, which is not necessarily
    the case here and cannot be added as an assumption because the sequence fn'
