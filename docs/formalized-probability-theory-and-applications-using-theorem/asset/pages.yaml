- pgno: 268
  md: '# 14.4 CONCLUSION


    This chapter presented an approach for the formal analysis of the detection performance
    of wireless sensor networks using the k-set randomized scheduling to preserve
    energy. In particular, we formalized the notions of intrusion period, detection
    probability and delay using the measure theoretic formalization of probability
    theory in the HOL4 theorem prover. This formalization allowed us to formally verify
    the detection related characteristics of most WSNs using the k-set randomized
    scheduling. In order to illustrate the practical effectiveness of our foundational
    results, we utilized them to perform the formal probabilistic analysis of a WSN
    application for border surveillance. The obtained results are exhaustive and completely
    generic, i.e., valid for all parameter values; a result which cannot be attained
    with simulation or probabilistic model checking based approach. Moreover, unlike
    most of the existing work that focuses on the validation of the functional aspects
    of WSN algorithms, our work is distinguishable by addressing the performance aspects.
    Finally, the proposed approach described in this chapter can be generalized to
    tackle the formal analysis of the same randomized scheduling under other assumptions,
    or even other probabilistic problems in the WSN context. Indeed, the presented
    formalizations can be valuable for formally verifying the same algorithm with,
    for example, a modified shape of the intrusion object. In addition, the higher-order-logic
    formalizations of some common random variables such as Bernoulli or Binomial can
    be very useful for the formal analysis of any probabilistic analysis problem.


    This work lays also an interesting foundation for our future work on the higher-order-logic
    formalization of the lifetime properties of WSNs using the k-set randomized scheduling.
    Similarly, once the formal reasoning support of the lifetime aspect is developed
    in the HOL4 theorem prover, the performance of other interesting WSN applications,
    such as underwater monitoring, can also be formally analyzed.'
  merge: -1
  img_proc: true
