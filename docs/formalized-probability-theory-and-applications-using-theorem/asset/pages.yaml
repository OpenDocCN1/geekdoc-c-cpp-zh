    # 13.4 CONCLUSION


    This chapter presents a reliable approach for the formal analysis of the coverage
    performances of wireless sensor networks using the k-set randomized scheduling
    to save energy. In particular, we formalized the main foundations of the randomized
    scheduling and expected values of the coverage intensity using the measure theoretic
    formalization of probability theory described in Chapters 4 and 5. This formalization
    allowed us to formally verify the coverage related characteristics of most WSNs
    using the k-set randomized scheduling. In order to illustrate the practical effectiveness
    of our foundational results, we utilize them to perform the formal probabilistic
    analysis of a WSN application for forest fire detection. Such application is considered
    as one of the most safety-critical applications of WSN. The achieved results are
    absolutely generic, i.e., valid for all parameter values; a result which cannot
    be attained in simulation or probabilistic model checking based approach. Moreover,
    it has been possible to provide precise formal reasoning on the statistical coverage
    using expectation. Finally, unlike most of the existing work that focuses on the
    validation of the functional aspects of WSN algorithms, our work is distinguishable
    by addressing the performance aspects.


    This work lays also an interesting foundation for our future work on the higher-order-
    logic formalizations of the detection properties of WSNs using the k-set randomized
    scheduling. In the next chapter, we formally check the relationship between coverage
    and detection showing that coverage reflects detection. On the other hand, once
    the formal reasoning support of the detection aspect is developed in the HOL theorem
    prover, the performance of other interesting applications, such as underwater
    monitoring, can also be formally analyzed.'
