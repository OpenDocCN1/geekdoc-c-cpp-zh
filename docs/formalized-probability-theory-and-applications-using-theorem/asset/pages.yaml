    # 11.1.5 Data Compression Limit


    The main idea behind the proof of the source coding theorem is that the average
    code word length for all sequences is close to the average code word length considering
    only the typical sequences. This is true because according to the typical set
    properties above, for a sufficiently large n, the typical set has a total probability
    close to 1. In other words, for any \(\epsilon > 0\), and sufficiently large n,
    the probability of observing a non-typical sequence is less than \(\epsilon\).
    Furthermore, the number of typical sequences is smaller than \(2^{n(H(X) + \epsilon)}\)
    and hence no more than \(n(H(X) + \epsilon) + 1\) bits are needed to represent
    all typical sequences. If we denote by Y the random variable defined over all
    the possible sequences and returns the corresponding code word length. The expectation
    of the Y is equal to the average code word length L. Using the properties of the
    typical set we can prove that


    ```

    \(\bar{L} \le n(H(X) + \epsilon'')\) (11.8)

    ```


    where \(\epsilon'' = \epsilon + \frac{1}{n}\)'
