  md: '# 12.1 LIFETIME DISTRIBUTIONS


    The foremost foundation for reliability analysis of engineering systems (Bilinton
    & Allan, 1992) is lifetime distribution. Various lifetime distribution representations
    have been used in the literature depending upon the specific needs of a lifetime
    reliability analysis problem. For example, sometimes the probability of failure
    is of interest at a certain time (Survival function), whereas, in some other applications,
    such as in planning for serviceability and maintainability of a system, the total
    amount of risk associated with a system up to a given time (Cumulative Hazard
    function) may be required. Two other commonly used important reliability properties
    are the hazard function and the fractile function. The hazard function expresses
    the failure risk at a given time and the fractile function allows reasoning about
    the times of failure corresponding to a given probability of failure. The survival
    function $S_T(t)$ is defined as:


    $S_T(t) = 1 - F_T(t)$ (12.1)


    where $F_T(t)$ is the cumulative distribution function of the random variable
    $T$. The Hazard function, $h_T(t)$, is defined as:


    $h_T(t) = \frac{dS_T(t)}{dt} \frac{1}{S_T(t)} = \lim_{h \to 0} \frac{S_T(t) -
    S_T(t+h)}{h S_T(t)}$ (12.2)


    and the cumulative hazard function, $H_T(t)$, is defined as:


    $H_T(t) = \int_0^t h_T(\tau) d\tau$ (12.3)


    Finally, the pth fractile $t_p(p)$ of a random variable $T$ is defined as:


    $t_p(p) = F_T^{-1}(p)$ (12.4)


    The main scope of this chapter is the formalization cumulative distribution function
    and survival function in higher-order-logic and the formal verification of some
    of their key properties. This formalization can then be utilized to formalize
    other'
