    transmission. Hence, the probability that a message can be delivered successfully
    is $\beta$, which equals to $1 - \alpha$. Once a message is delivered successfully,
    the system moves to the start state for getting ready to identify the other tags
    in the next time slot. When the collection process ends, the system goes to sleep
    mode in order to minimize power consumption. The state


