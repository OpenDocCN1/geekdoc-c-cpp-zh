  md: 'So far, in this chapter, we have provided a higher-order-logic formalization
    of the KL divergence, which is used to define various measures of quantitative
    information flow (Sabelfeld & Myers, 2003). This formalization, along with the
    formalization of measure and probability theories, allows us to conduct many analyses
    of quantitative information flow using a theorem prover and we present an illustrative
    example in the next section.


    # 9.6 FORMALIZATION OF QUANTITATIVE ANALYSIS OF INFORMATION


    In most applications, some information is always intended by design to ensure
    the functionality of the protocol. For example, in the case of an election protocol,
    the outcome of an individual vote has to remain secret but overall election results
    should be made public. Similarly, a password checking programs reveals some information
    when it rejects an incorrect password (Malacaria, 2007).


    Quantitative analysis of information flow (Smith, 2009) is gaining a lot of attention
    in a variety of contexts, such as secure information flow, anonymity protocols
    (Serjantov & Danezis, 2003), and side channel analysis. It allows us to measure
    how much information about the high security inputs of a system can be leaked,
    accidentally or maliciously, by observing the systems outputs and possibly the
    low security inputs. Unlike non-interference analysis, which only determines whether
    a system is completely secure or not completely secure, quantitative information
    flow analysis provides an information-theoretic measure on how secure or insecure
    a system is.


    We introduce two new measures of information (Mhamdi, Hasan & Tahar, 2012), namely
    the information leakage degree and the conditional information leakage degree,
    which can be used to evaluate the anonymity and security properties of various
    systems and protocols.


    # 9.6.1 Information Leakage Degree


    Consider a program having a set of secret inputs, represented by the random variable
    X and a set of public outputs, represented by Y. We define the information leakage
    degree of this program as


    ```

    D = \frac{H\left(\frac{X}{Y}\right)}{H(X)} \qquad (9.11)

    ```'
