    The law of total probability is a useful tool for breaking down the computation
    of a probability into a number of distinct cases. It can be expressed in higher-order
    logic as follows:


    # Theorem 5.12


    ```

    |- Pr A B s . (prob_space p) /\ (A IN events p) /\ FINITE s /\

    (∀x . x IN s ∨ ∀ x IN events p) /\

    (∀a b. a IN s ∧ b IN s /\ ~ (a = b) => DISJOINT (B a) (B b)) /\

    (BIGUNION (IMAGE B s) = p_space p) =>

    (prob p A = SIGMA (λi. (prob p (B i)) * (cond_prob p A (B i))) s)

    ```


    The variable A in the above theorem represents an event, whereas B represents
    a sequence of sets. The assumption with the BIGUNION ensures that the elements
    of the sequence B are exhaustive, i.e., their union gives the sample space or
    the universal set. Moreover, the sets in sequence B are also mutually exclusive
    according to another assumption. The right-hand side of the equality in the above
    theorem represents the summation of the first m terms of the real sequence (ai.Pr(Bi)
    Pr(A | Bi)) using the HOL4 function SIGMA.


    The proof of the above theorem is based the probability additive axiom along with
    some set theoretic principles.


