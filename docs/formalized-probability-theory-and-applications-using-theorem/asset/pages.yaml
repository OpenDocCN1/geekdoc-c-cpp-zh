    by real numbers). The set of values taken by each \(X_t\), commonly called states,
    is referred to as the state space. The sample space of the process consists of
    all the possible state sequences based on a given state space S. Now, based on
    these definitions, a Markov process can be defined as a stochastic process with
    Markov property. If a Markov process has finite or countably infinite state space,
    then it is called a Markov chain and satisfies the following Markov property:
    for \(0 \le t_o \le \dots \le t_n\) and \(x_o, \dots, x_n\) in the state space
