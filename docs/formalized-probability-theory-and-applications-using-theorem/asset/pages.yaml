    # 3.1.1 Markov Chains


    With an extensive usage of Markov chains in modeling and analysis of systems,
    the availability of their accurate analysis techniques has become imperative.
    Various techniques have been proposed for analyzing Markovian models but none
    of them can guarantee providing accurate analysis for all sorts of Markovian models.
    Probabilistic model checking provides a formal analysis of various Markov chain
    models, but to the best of our knowledge it cannot cater for some, for example
    hidden Markovian models. Moreover, model checking suffers from state-space explosion
    problem when analyzing larger systems and some of its underlying algorithms are
    not formally verified, which may lead to inaccurate analysis as well.


    Based on the theories of probability and Lebesgue integration, we can formalize
    Markov chains. In this book, we particularly target the formalization of Discrete-Time
    Markov chains (DTMCs). This formalization would allow us to overcome the above-mentioned
    inaccuracies of the traditional analysis methods for DTMCs. In this respect, the
    book presents the formalization of some commonly used definitions, such as DTMCs,
    classified states and classified DTMCs, in higher-order logic. Moreover, some
    classical properties based on these definitions are also verified. Some important
    formally verified DTMC properties, presented in this book, include the joint probability
    theorem, Chapman-Kolmogorov Equation and Absolute probability, etc., and the stationary
    properties, which are verified in higher-order logic based on the classified DTMC.
    Now, based on this formalization, any system that can be expressed as a DTMC or
    a classified DTMC can be analyzed within the sound core of a theorem prover.


    # 3.1.2 Information Theory


    The formalization of information theory consists in using the underlying theories
    of measure, Lebesgue integration and probability to develop a higher-order-logic
    formalization of the main concepts and measures of information, such as the Shannon
    entropy, the mutual information and more generally the Kullback-Liebler divergence.
    In this book, we use the Kullback-Liebler divergence as a unified measure of information
    from which we derive all the other measures. We provide simpler expressions of
    these measures for the case of finite spaces. Once this formalization has been
    done, it can be built upon to formally analyze various information theoretic aspects
    of engineering and scientific problems. These problems can be described using
    the formalized random'
