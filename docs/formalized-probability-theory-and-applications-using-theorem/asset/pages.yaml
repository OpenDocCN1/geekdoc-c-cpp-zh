    inequality. Random variables X, Y and Z are said to form a Markov chain in that
    order (denoted by X -> Y -> Z) if the conditional distribution of Z depends only
    on Y and is conditionally independent of X. Specifically, X, Y and Z form a Markov
    chain X -> Y -> Z if the joint probability mass function can be written as


