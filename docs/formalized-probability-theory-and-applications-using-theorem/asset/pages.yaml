    This section first present a formal definition of the first passage time in higher-order
    logic. Based on this formalization, a series of classified states, including transient
    state, persistent state and persistent null state, as well as non-null persistent
    state, are introduced. By introducing the formalization of the greatest common
    divisor (gcd) of a set, the periodic and aperiodic states are formally defined
    in HOL. The higher-order-logic formalization of the communicating state and absorbing
    state is also provided. Building upon these definitions, various commonly used
    classified DTMC properties are verified. These concepts primarily appear in the
