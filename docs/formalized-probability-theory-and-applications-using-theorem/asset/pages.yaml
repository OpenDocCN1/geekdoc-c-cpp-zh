    # KEY TERMS AND DEFINITIONS


    **Discrete-Time Markov Chains**: A discrete-time Markov chain (DTMC) is a Markov
    chain with a countable set of time values or, in other words, the time index of
    this Markov chain exhibits a discrete nature.


    **Markov Chains**: A Markov chain is a stochastic process that exhibits the Markovian
    property, i.e., the next state depends on the current state of the system only
    and not on the history through which the current state was reached.


    **Stochastic Process**: A stochastic process describes a set of random variables
    that model the evolution of a time-varying system.'
