  md: '# **Lemma 14.8**


    ```

    ⊢ ∀ p q n s L Ts. (1 ≤ n) ∧ (0 < s < 1) ∧ (0 < L) ∧ (0 < Ts)

    ∧ (0 < q < 1) ∧

    (Vk. L < s (SUC k) x Ts) ⇒ lim (λk. Pd_wsn p n k s L Ts q) = 0.

    k→∞

    ```


    Furthermore, we show, in Lemma 14.9, that the detection delay of the randomized
    scheduling, D_wsn, increases as the value of k increases. In other words, the
    detection delay D_wsn increases when the WSN is divided into a quite large number
    of sub-networks k. Indeed, the allocated time slot for each subset would be small,
    so that the active nodes do not have enough time to detect the occurring intrusion.


    # **Lemma 14.9**


    ```

    ⊢ ∀ p q n s L Ts. (1 ≤ n) ∧ (0 < s < 1) ∧ (0 < L) ∧ (0 < Ts) ∧

    (0 < q < 1)

    ⇒ (mono_incr (λk. real (D_wsn p D n k q))).

    ```


    It is important to note that the original proof of the above lemma in was missing
    a whole fraction term, which is fortunately positive and thus does not finally
    affect the validity of the function monotonicity.


    Now, it is possible to confirm, in the following 2 lemmas, the validity of the
    generic results given in Lemmas 14.7 and 14.8 for our WSN application.


    # **Lemma 14.10**


    ```

    ⊢ ∀ p k n s L Ts. (1 ≤ n) ∧ (0 < s < 1) ∧ (0 < L) ∧ (0 < Ts) ∧

    (Vk. L < s (SUC k) x Ts)

    ⇒ (mono_decr (λk. Pd_surv p n k s L Ts (0.28))).

    ```


    Consequently, for the border monitoring application, increasing k surely saves
    more energy, but a significant increase in k may induce several sub-networks,
    which in turns translates to a poor detection probability.


    # **Lemma 14.11**


    ```

    ⊢ ∀ p k n s L Ts. (1 ≤ n) ∧ (0 < s < 1) ∧ (0 < L) ∧ (0 < Ts) ∧

    (Vk. L < s (SUC k) x Ts)

    ⇒ lim (λk. Pd_surv p n k s L Ts (0.28)) = 0.

