    # 11.3 ONE-TIME PAD


    The one-time pad is a simple yet solid encryption system that provides, if used
    correctly, an unbreakable security. The encryption is performed by modular addition
    of every character of the plaintext with a character from a secret random key
    of at least the same length as the original message. If the key is truly random
    and never reused in whole or in part, then it can be proven that the one-time
    pad encryption provides a perfect security. We formally prove this property within
    the HOL4 theorem prover using the higher-order-logic framework proposed in this
    book. The one-time pad


