  md: 'encryption technique takes its name from the paper pads that have been historically
    used to distribute the keys, making it easy to simply pull the top sheet of the
    pad and destroy it after use. An example of a Russian one-time pad that was captured
    by MI5 is depicted in Figure 5 (Chaum, 1981).


    The one-time pad (Gallager, 1968) has been extensively used to secure the communications
    of various international intelligence agencies and was used for instance in the
    Washington/Moscow hotline to provide perfectly secure communication between the
    White House and the Kremlin and without disclosing any other secret cryptographic
    technology.


    The main challenges for this encryption technique are the generation of truly
    random keys and their distribution to both sender and receiver. This sometimes
    makes the technique impractical and limits the types of its applications to the
    cases where, for example, absolute security is a real must, regardless of the
    costs. Still, the onetime pad is available as a backup encryption option if other
    theoretically less secure but more practical encryption systems are unavailable
    for reasons of war or attacks. The one-time pad encryption is also very important
    in situations, where both sender and receiver need to do all the work by hand
    without the use of a computer, whether because one is not available or to avoid
    possible vulnerabilities of a standard computer. The structure of a typical one-time
    pad encryption system is depicted in Figure 6. The plaintext is first encoded
    into digits or bits then fed to the encryption block, which performs a modular
    addition (modulo 10) to produce a cipher text. The latter is transmitted to the
    receiver side, which performs the inverse operations to recover the original message.


