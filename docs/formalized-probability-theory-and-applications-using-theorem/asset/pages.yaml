  md: 'returns a list of digits. The decoder performs the inverse operations to convert
    a list of digits back to a string. The functions encode and decode have the following
    HOL4 types:


    ```

    |- encode: string -> num list

    |- decode: num list -> string

    ```


    # 11.3.2 Encryption-Decryption


    The encryption and decryption blocks are formalized as two functions, encrypt
    and decrypt, taking as input a pair of same length lists of digits and returning
    a list of digits.


    ```

    |- encrypt: (num list, num list) -> num list

    |- decrypt: (num list, num list) -> num list

    ```


    The encryption is performed by a modulo10 addition, digit by digit, of the list
    representing the encoded message and the list of digits representing the one-time
    pad key. The result of this operation is a cipher text, which is also represented
    by a list of digits. On the receiver side, the cipher text is decrypted by subtracting,
    modulo10, the key from cipher text, resulting into a list of numbers that represent
    the original message. In the case where the plaintext is encoded into bits instead
    of digits, both encryption and decryption are performed by a simple XOR operation.
    We formalize encrypt in higher-order logic, recursive. h1 and h2 represent the
    first elements or heads of the lists l1 and l2 and their tails. The: operator
    is the list constructor.


    ```

    |- encrypt ([] , []) = [] /\n\/t1 t2 h1 h2.

    encrypt (h1:: t1, h2:: t2) =

    (h1 + h2) MOD 10:: encrypt (t1, t2)

    ```


    Similarly, we formalize the decryption block as follows.


    ```

    |- decrypt ([] , []) = [] /\n\/t1 t2 h1 h2.

    decrypt (h1:: t1, h2:: t2) =

    (h1 - h2) MOD 10:: decrypt (t1, t2)

    ```'
