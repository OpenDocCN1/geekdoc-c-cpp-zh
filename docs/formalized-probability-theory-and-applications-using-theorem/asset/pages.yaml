- pgno: 32
  md: '# KEY TERMS AND DEFINITIONS


    **Formal Methods:** Formal methods are mathematical techniques, often supported
    by computer-based tools, for the specification and verification of software and
    hardware systems. The main principle behind formal analysis of a system is to
    construct a computer based mathematical model of the given system and formally
    verify, within a computer, that this model meets rigorous specifications of intended
    behavior.


    **Higher-Order Logic:** Higher-order logic is a system of deduction with a precise
    semantics. It differs from the more commonly-known predicate and first-order logic
    by allowing quantification over function variables. This extension substantially
    increases the expressiveness of the logic and thus higher-order logic can be used
    for the formal specification of most of the mathematical concepts and theories.


    **Model Checking:** Model checking is one of the most widely used formal method.
    The inputs to a model checker include the finite-state model of the system that
    needs to be analyzed along with the intended system properties, which are expressed
    in temporal logic. The model checker automatically verifies if the properties
    hold for the given system while providing an error trace in case of a failing
    property.


    **Temporal Logic:** Temporal logic allows us to formally represent time-dependent
    propositions. For example, propositions like an event would happen in the next
    time step or sometime in the future or would never happen in the future, can be
    expressed using temporal logic operators. Temporal logic is used in model checking
    to express properties of interest about the reactive systems.


    **Theorem Proving:** Theorem proving is a widely used formal method. The system
    that needs to be analyzed is mathematically modeled in an appropriate logic and
    the properties of interest are verified using computer based tools. The core of
    theorem provers usually consists of some well-known axioms and primitive inference
    rules. Soundness is assured as every new theorem must be created from these basic
    axioms and primitive inference rules or any other already proved theorems or inference
    rules.'
