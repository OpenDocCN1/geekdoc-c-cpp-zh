  md: '# KEY TERMS AND DEFINITIONS


    **Asymptotic Equipartition Property:** Asymptotic equipartition property (AEP)
    is the foundational property behind the concept of a typical set and allows us
    to acquire the output samples of a stochastic process.


    **Data Compression:** Data compression involves encoding information using fewer
    bits than the original representation. Data compression may or may not lead to
    data losses.


    **Pseudorandom Number Generation and a Typical Set:** A pseudorandom number whose
    output sequence lies outside the typical set by some statistical standards is
    rejected as insufficiently random.'
