- pgno: 200
  md: 'The function mutual_indep accepts a list of events L along with probability
    space p and returns True if the events in the given list are mutually independent
    in the probability space p. The formal definitions for the HOL4 functions used
    in the above definition are given in Table 1. The function PERM takes two lists
    as its arguments and makes sure that these lists form a permutation of one another.
    The function LENGTH returns the length of the given list. The function TAKE returns
    the first n elements of its argument list as a list. The function inter_set performs
    the intersection of all the sets in its argument list of sets and returns the
    probability space if the given list of sets is empty. The function list_prob takes
    a list of events and returns a list of probabilities associated with the events
    in the given list of events in the given probability space. Finally, the function
    list_prod recursively multiplies all the elements in the given list of real numbers.
    Using these functions, the function mutual_indep, given in Definition 12.3, models
    the mutual independence condition such that for any 2 or more events n taken from
    any permutation of the given list L, the property Pr (∩_{i=0}^n Li) = ∏_{i=0}^n
    Pr (Li) holds.


    Next, we define a list of events constructed from a given list of random variables,
    such that each event models the proper functioning of a component or system at
    a given time based on the corresponding random variable.


    # Definition 12.4


    ```

    |- ∀ p p . rel_event_list p [ ] x = [ ] ∧

    |- ∀ p p x h t . rel_event_list p (h::t) x =

    PREIMAGE h (y | Normal x < y ) ∩

    p_space p:: rel_event_list p t x

    ```


    The function rel_event_list accepts a probability space p, a list of random variables,
    representing the failure time of individual components, and a real number x, which
    represents the time index at which the reliability is desired. It returns a list
    of events, representing the proper functioning of the all the individual components
    at time x.


    Similarly, we can model the individual reliabilities of every random variable
    in a list as follows:


    # Definition 12.5


    ```

    |- ∀ p p . rel_list p [ ] x = [ ] ∧

    |- ∀ p h t x . rel_list p (h::t) x =

    Reliability p h x:: rel_list p t x

    ```'
