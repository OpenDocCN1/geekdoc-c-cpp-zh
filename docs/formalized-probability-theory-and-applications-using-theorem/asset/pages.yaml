    # 9.2 FORMALIZATION OF KULLBACK-LEIBLER DIVERGENCE


    The Kullback-Leibler (KL) divergence DKL (u ‖ v) is a measure of the distance
    between two distributions u and ∫x (log dν / dμ) du. It can be used to define
    most information-theoretic measures, such as the mutual information and entropy
    and can, hence, be used to provide a unified framework to formalize most information
    leakage measures. Mathematically, the KL divergence is defined as:


    ```

    DKL(μ ‖ ν) = - ∫x log(dν/dμ) dμ (9.7)

    ```


    where dν/dμ is the Radon-Nikodym derivative of v with respect to u. The KL divergence
    is formalized in HOL4 as:


    # Definition 9.2


    ```

    |- ∀ b m v. KL_divergence b m v =

    -integral m (λx. logr b (RN_deriv m v x))

    ```


    where b is the base of the logarithm. DKL is measured in bits when b = 2. This
    definition can now be used to verify some classical properties of DKL. For instance,
    for absolutely continuous measures over a finite space, the DKL reduces to:'
  merge: -1
  img_proc: true
