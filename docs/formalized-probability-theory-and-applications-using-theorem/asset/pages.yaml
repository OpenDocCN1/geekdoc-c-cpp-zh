  md: 'variables and probabilistic notions. Now, their information theoretic characteristics
    can be formally reasoned about in a theorem prover using the formally verified
    properties of probability, Lebesgue Integral and information theories.


    # 3.1.1 Reliability Theory


    The reliability of a system is defined as the probability that it will adequately
    perform its specified purpose for a given period of time under certain specific
    environmental conditions. Thus reliability theory foundations are primarily based
    on the probability theory. Some of the commonly used notions of reliability assessment
    are cumulative distribution function (CDF), survival function and hazard function.
    All of these foundations have been formalized and some of their important properties
    have been also formally verified in the HOL4 theorem prover. This manuscript describes
    these formalizations as well.


    The framework of Figure 1 is presented in terms of theories to be developed specifically
    for the context of the book but it is important to highlight the fact that different
    components of this framework are also quite usable in a much wider range of applications.
    Lebesgue integration, for instance, is used in this work to define statistical
    properties of random variables but the developed theory can also be used in the
    study of Fourier series and Fourier transforms.


    # 3.2 HOL4 THEOREM PROVER


    In this section, we give a brief introduction to the HOL4 theorem prover (Gordon
    & Melham, 1993) to facilitate the understanding of the rest of the book. HOL4
    is an interactive theorem prover developed by Mike Gordon at the University of
    Cambridge for conducting proofs in higher-order logic. It utilizes the simple
    type theory of Church (1940) along with Hindley-Milner polymorphism (Milner, 1977)
    to implement higher-order logic. HOL4 has been successfully used as a verification
    framework for both software and hardware as well as a platform for the formalization
    of pure mathematics.


    # 3.2.1 Secure Theorem Proving


    In order to ensure secure theorem proving, the logic in the HOL4 system is represented
    in the strongly-typed functional programming language ML (Paulson, 1996). An ML
    abstract data type is used to represent higher-order-logic theorems and the only
    way to interact with the theorem prover is by executing ML procedures that operate
    on values of these data types. The HOL4 core consists of only 5 basic axioms and'
  merge: -1
  img_proc: true
- pgno: 38
  md: '8 primitive inference rules, which are implemented as ML functions. Soundness
    is assured as every new theorem must be verified by applying these basic axioms
    and primitive inference rules or any other previously verified theorems/inference
    rules.


    # 3.2.2 Terms


    There are four types of HOL4 terms: constants, variables, function applications,
    and lambda-terms (denoted function abstractions). Polymorphism, types containing
    type variables, is a special feature of higher-order logic and is thus supported
    by HOL. Semantically, types denote sets and terms denote members of these sets.
    Formulas, sequences, axioms, and theorems are represented by using terms of Boolean
    types.


    # 3.2.3 Theories


    A HOL4 theory is a collection of valid HOL4 types, constants, axioms and theorems
    and is usually stored as a file in computers. Users can reload a HOL4 theory in
    the HOL4 system and utilize the corresponding definitions and theorems right away.
    The concept of HOL4 theory allows us to build upon existing results in an efficient
    way without going through the tedious process of regenerating these results using
    the basic axioms and primitive inference rules. HOL4 theories are organized in
    a hierarchical fashion. Any theory may inherit types, definitions and theorems
    from other available HOL4 theories. The HOL4 system prevents loops in this hierarchy
    and no theory is allowed to be an ancestor and descendant of a same theory. Various
    mathematical concepts have been formalized and saved as HOL4 theories by the HOL4
    users. These theories are available to a user when he first starts a HOL4 session.
    We utilized the HOL4 theories of Booleans, lists, sets, positive integers, real
    numbers, measure and probability in our work. In fact, one of the primary motivations
    of selecting the HOL4 theorem prover for our work was to benefit from these built-in
    mathematical theories.


    # 3.2.4 Writing Proofs


    HOL4 supports two types of interactive proof methods: forward and backward. In
    forward proof, the user starts with previously proved theorems and applies inference
    rules to reach the desired theorem. In most cases, the forward proof method is
    not the easiest solution, as it requires the exact details of a proof in advance.
    A backward or a goal directed proof method is the reverse of the forward proof
    method. It is based on the concept of a tactic; which is an ML function that breaks
    goals into simple subgoals. In the backward proof method, the user starts with
    the desired theorem or the main goal and specifies tactics to reduce'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'it to simpler intermediate subgoals. Some of these intermediate subgoals can
    be discharged by matching axioms or assumptions or by applying built-in decision
    procedures. The above steps are repeated for the remaining intermediate goals
    until we are left with no further subgoals and this concludes the proof for the
    desired theorem. The HOL4 theorem prover includes many proof assistants and automatic
    proof procedures to assist the user in directing the proof. The user interacts
    with a proof editor and provides it with the necessary tactics to prove goals
    while some of the proof steps are solved automatically by the automatic proof
    procedures.


