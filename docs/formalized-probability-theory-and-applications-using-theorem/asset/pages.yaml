    \ respectively, and p and q denote probability spaces.\n\n# 10.2.1 Formalization\
    \ of Min-Entropy\n\nThe Min Entropy H∞ of a random variable X is a special case\
    \ from the R´enyi Entropy when α = ∞.\n\nDefinition 10.1\nThe Min-Entropy of a\
    \ random variable X is given by\nH∞ (X) = -log max p (x)\n\nThis can be formalized\
    \ in HOL4 as follows:\n\n```\n|- ∀ X p.\nmin_entropy X p =\n  -log (extrale max_set\
