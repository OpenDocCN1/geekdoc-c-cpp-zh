  md: '# 8.1 DEFINITION OF HMM


    In order to accurately analyze the HMMs (Eddy, 2004), we propose to apply the
    formalized DTMC to formally define HMMs and verify their properties in higher-order
    logic as the extended DTMC models.


    An HMM is a pair of two stochastic processes { Xk ; Yk } k ≥ 0, where { Xk } k
    ≥ 0 is a Markov chain, and { Yk } k ≥ 0 is conditionally independent of { Xk },
    i.e., Yk depends only on Xk and not on any Xt, such that t ≠ k. The HMMs model
    situations where an experimenter sees some observations at every instant (mathematically
    represented by Yk) and suspects these observables to be the outcome of a process
    that can be modeled by a Markov chain ( { Xk } k ≥ 0). The name “Hidden Markov
    Model” arises from the fact that the state in which this model is at a particular
    instant is not available to the observer. Now, a HMM is defined as a parameterized
    triple (A, B, π(0)) with the following conditions:


    +   1. Hidden Markov Chain { Xk } k ≥ 0 with a finite state space S, the initial
    distribution π(0) = { π i (0) } i ∈ S and the transition probabilities A = { aij
    } i ∈ S, j ∈ S.

    +   2. A random process { Yk } k ≥ 0 with finite state space O. The hidden Markov
    chain and the random process are associated with the emission probabilities B
    = { bj (Ok) } j ∈ S, k ∈ O = { Pr { Yn = Ok | Xn = j } } j ∈ S, k ∈ O. It implies
    that:

    +      a. ∀ j k. bj (Ok) ≥ 0.

    +      b. ∑ k ∈ O bj (Ok) = 1.

    +   3. The random process { Yk } k ≥ 0 and hidden Markov chain { Xk } k ≥ 0 have
    conditional independence.


