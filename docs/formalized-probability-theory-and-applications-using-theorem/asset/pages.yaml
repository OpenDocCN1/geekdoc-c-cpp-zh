    Now, we formally define expectation and conditional expectation of a discrete
    random variable and then use these results along with the formal DTMC definition
    to formalize a Discrete-time Markov Reward Model (DMRM).


    # Expectation


    The expectation (also called expected value) of a discrete random variable X is
    E [X] = \(\sum_{i \in space sx} i Pr\{X = i\}\). Whereas, the conditional expectation
    of a discrete random variable X given a condition Y is E [ Y | X ] = \(\sum_{i
    \in space sx} i Pr\{Y | X = i\}\).


    These definitions can be formalized as (Liu, Hasan & Tahar, 2013c):


    # **Definition 7.13**


    \(\vdash \forall X p sx . expect X p sx = \sum_{i \in space sx} i Pr\{X = i\}\)


    and


    # **Definition 7.14**


    \(\vdash \forall X Y y p sx . cond\_expect X Y y p sx = \sum_{i \in space sx}
    i \mathbb{P}(\{x | Y x = y\} | \{x | X x = i\})\)


    where X is a discrete random variable, which has type ’a \(\rightarrow\) real,
    sx is a finite state space, and { x | X x = y } is a discrete event given in the
    conditional probability to calculate the expectation.


    Utilizing these two formal definitions, we can verify some interesting properties
    of expectation that play a vital role in the performance analysis of multiprocessor
    systems. We can prove that the total expectation of a random variable X is E [
    Y ] = \(\sum_{j \in space sx} E [ Y | Xj ] Pr \{ Xj \}\). Here, Xj represents
    a discrete event involved in the event space (subsets sx) and j is any state in
    the state space(space sx) of random variable X.'
