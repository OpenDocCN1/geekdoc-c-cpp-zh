    # KEY TERMS AND DEFINITIONS


    **Absorbing States:** The system cannot leave an absorbing state once it enters
    it. **Birth-Death Process:** A birth-death process is a continuous-time Markov
    chain (CTMC) with births and deaths, i.e., state-transitions that increase the
    value of the state variable by 1 or decrease its value by 1, respectively.


    **Periodic States:** Periodic states are the ones that can be visited at certain,
    pre-determined, time periods only.


    **Recurrent States:** The DTMC states that are always guaranteed to be re-visited
    in the future are termed as recurrent states.


    **Transient States:** Transient states are the states where the return after some
    time in the future is uncertain.'
