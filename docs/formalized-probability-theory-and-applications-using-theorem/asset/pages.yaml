  md: '# 7.2 FORMALIZATION OF CLASSIFIED DTMCs


    In this section, we build upon the above mentioned definitions to formalize classified
    DTMCs. Usually, a DTMC is said to be irreducible if every state in its state space
    can be reached from any other state including itself in finite steps.


    ```

    ⊢ ∀ X p s P₀ Pᵢⱼ ·

    Irreducible_mc X p s P₀ Pᵢⱼ =

    thdtmc X p s P₀ Pᵢⱼ ∧

    (∀ i j. i ∈ space s ∧ j ∈ space s ⇒

    Communicating_states X p s i j)

    ```


    where th_dtmc is time-homogeneous Markov chain and the second conjunct expresses
    that all the states in the state space can communicate with each other.


    If there exists a state in the state space of a DTMC, which cannot reach other
    states, then this DTMC is called reducible.


    ```

    ⊢ ∀ X p s P₀ Pᵢⱼ ·

    Reducible_mc X p s P₀ Pᵢⱼ =

    th_dtmc X p s P₀ Pᵢⱼ ∧

    ∃ i j. i ∈ space s ∧ j ∈ space s ∧

    ~ Communicating_states X p s i j

    ```


    A DTMC is considered as aperiodic if every state in its state space is an aperiodic
    state; otherwise it is a periodic DTMC.


    ```

    ⊢ ∀ X p s P₀ Pᵢⱼ ·

    Aperiodic_mc X p s P₀ Pᵢⱼ =

    th_dtmc X p s P₀ Pᵢⱼ ∧

    (∀ i. i ∈ space s ⇒ Aperiodic_state X p s i)

    ```


    ```

    ⊢ ∀ X p s P₀ Pᵢⱼ ·

    Periodic_mc X p s P₀ Pᵢⱼ =

    th_dtmc X p s P₀ Pᵢⱼ ∧ (∃ i. i ∈ space s ∧ Periodic_state X p s i)

    ```'
