    # 12.4.3 Parallel-Series Reliability Block Diagram


    Most of the safety-critical systems in the real-world contain many reserved sub-stages
    for backup and ensuring reliable operation. If components in these reserved subsystems
    are connected serially then the structure is termed as a parallel-series structure,
    depicted in Figure 3. The parallel-series RBD is used to model such complex structures.
    If Aj is the event corresponding to the reliability of the jth component connected
    in a ith subsystem, then the reliability of the complete system can be expressed
    mathematically as follows:


    $R_{Parallel-Series} = Pr(\bigcup_{i=1}^M \bigcap_{j=1}^N A_{ij})$ (12.11)


    By using the mutual independence of events and some basic probability theory axioms,
    the above equation can be simplified to


    $R_{Parallel-Series} = 1 - \prod_{i=1}^M (1 - \prod_{j=1}^N (R_{ij}(t)))$ (12.12)


