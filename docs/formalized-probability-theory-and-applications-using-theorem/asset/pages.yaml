  md: '# 11.1.2 Weak Law of Large Numbers (WLLN)


    The WLLN states that the average of a large number of independent measurements
    of a random quantity converges in probability towards the theoretical average
    of that quantity. Interpreting this result, the WLLN states that for a sufficiently
    large sample, there will be a very high probability that the average will be close
    to the expected value. This law is used in a multitude of fields. It is used,
    for instance, to prove the AEP, which is a fundamental concept in the field of
    information theory.


    # Theorem 11.2


    Let X1, X2, ... be an infinite sequence of independent, identically distributed
    random variables with finite expected value E [ X1 ] = E [ X2 ] = ... = m and
    let


    ```

    \overline{X} = \frac{1}{n} \sum_{i=1}^n Xi \text{ then for any } \varepsilon >
    0,

    ```


    ```

    lim_{n \to \infty} P(|\overline{X} - m| < \varepsilon) = 1 \quad (11.3)

    ```


    ```

    \vdash \text{prob\_space } p \land 0 < \varepsilon \land (\forall i j. i \neq
    j \Rightarrow \text{uncorrelated } p (Xi) (Xj)) \land (\forall i. E [ Xi ] = m)
    \land (\forall i. \text{Var } [ Xi ] = v) \Rightarrow lim (\lambda n. \text{prob
    } p (x | x \in \Omega \land | \frac{1}{n} \sum_{i=1}^n Xi x - m | < \varepsilon
    )) = 1

    ```


    +   Proof: Using the linearity property of the Lebesgue integral as well as the
    properties of the variance, we prove that \(E[\overline{X}] = \frac{1}{n} \sum_{i=1}^n
    m = m\) and \(Var(\overline{X}) = \frac{\sigma^2}{n}\). Applying the Chebyshev
    inequality to \(\overline{X}\), we get \(P(|\overline{X} - m| \ge \varepsilon)
    \le \frac{\sigma^2}{n\varepsilon^2}\). Equivalently, \(1 - \frac{\sigma^2}{n\varepsilon^2}
    \le P(|...m| < \varepsilon) \le 1\). It then follows that \(\lim_{n \to \infty}
    P(|\overline{X} - m| < \varepsilon) = 1\).


    # 11.1.3 Asymptotic Equipartition Property (AEP)


    The Asymptotic Equipartition Property (AEP) is the information theory analog of
    the Weak Law of Large Numbers. It states that for a stochastic source X, if its
    time series X1, X2, ... is a sequence of iid random variables with entropy H(X),
    then \(-\frac{1}{n} \log p(X1, ..., Xn)\) converges in probability to H(X).'
