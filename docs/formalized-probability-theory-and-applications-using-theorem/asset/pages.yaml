    # 4.3 FORMALIZATION OF LEBESGUE INTEGRATION IN HOL


    Lebesgue integration is a fundamental concept in many mathematical theories, such
    as real analysis (Goldberg, 1976) and probability (Halmos, 1944), which are widely
    used to model and reason about the continuous and unpredictable components of
    physical systems. The reasons for its extensive usage, compared to the commonly
    known Riemann integral, include the ability to handle a broader class of functions,
    which are defined over more general types than the real line, and its better behavior
    when it comes to interchanging limits and integrals, which is of prime importance,
    for instance, in the study of Fourier series.


    Similar to the way in which step functions are used in the development of the
    Riemann integral, the Lebesgue integral makes use of a special class of functions
    called positive simple functions. They are measurable functions taking finitely
    many values. In other words, a positive simple function g is represented by the
    triple (s, a, α) as a finite linear combination of indicator functions of measurable
    sets (aⱼ) that form a partition of the space X.


    ```

    ∀ x∈ X, g(x) = Σₖ αₖ I_{Aₖ}(x) cᵢ ≥ 0 (4.3)

    ```'
