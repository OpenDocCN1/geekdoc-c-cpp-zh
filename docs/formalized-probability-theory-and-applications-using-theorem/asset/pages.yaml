  md: '# Probabilistic Analysis


    +   Like all other computer arithmetic based computations, round-off and truncation
    errors also creep into the numerical computations in these simulation based software
    packages. The main cause of these errors is the finite precision representation
    of numbers in the computers.


    To illustrate the above approximation issues further, consider the example of
    the rand function in the statistical toolbox of MATLAB, which is one of the widely
    used simulation environment for probabilistic analysis. It approximates the Standard
    Uniform [0,1] random variable (Yates & Goodman, 2005) by producing a pseudorandom
    double precision floating-point number, represented in the computer by 64 bits.
    Therefore rand is capable of producing no more than 2^64 unique double precision
    floating-point numbers compared to the uncountably infinite real numbers in the
    interval [0,1] that a True Standard Uniform random variable can produce. Additional
    approximations are introduced if we consider the product of two Standard Uniform
    random variables that are produced by the rand function in MATLAB. The result
    of the product could be up to 128 bits long but due to finite bit precision, the
    value is expressed in 64 bits using various rounding or truncation techniques.
    Besides the inaccuracy of the results, another major limitation of simulation
    based probabilistic analysis is the enormous amount of CPU time requirement for
    attaining meaningful estimates. This approach generally requires hundreds of thousands
    of simulations to calculate the probabilistic quantities and becomes impractical
    when each simulation step involves extensive computations.


    Computer Algebra systems (Grozin, 2013), like Maple and Mathematica, provide an
    arbitrary-precision numeric engine, primarily by increasing the number of digits
    carried through calculations, and converting real numbers to their corresponding
    rational numbers. Because of this feature, the probabilistic analysis packages
    available in computer algebra systems, like MathStatica (Rose & Smith, 2002) that
    is available in Mathematica, provide much accurate results than simulation. However,
    as per the general rule of computing that is there is always a tradeoff between
    speed and accuracy and thus, the computer algebra system based probabilistic analysis
    tends to be very slow and is not practical for analyzing real-world systems.


    The accuracy of the engineering and scientific system analysis results has become
    imperative these days because of the extensive usage of these systems in safety
    and mission-critical domains, such as medicine, transportation and military. Therefore,
    the above-mentioned traditional techniques cannot be relied upon for the analysis
