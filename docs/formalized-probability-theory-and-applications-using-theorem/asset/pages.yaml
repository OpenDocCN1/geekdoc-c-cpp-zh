- pgno: 34
  md: '# 3.1 METHODOLOGY


    The methodology followed by this book is depicted in Figure 1. The rectangle with
    the dashed border in this figure represents the foundational requirements of conducting
    probabilistic analysis in a theorem prover. Like all system analysis tools, the
    input to this framework, represented by the oval blocks, is a description about
    the given system that needs to be analyzed and a set of properties that are required
    to be checked for the given system. These foundational theories provide the necessary
    tools to formally or mathematically express a system description and its desired
    properties in a format that is understood by the theorem prover. The formally
    expressed properties are then formally verified to hold for the given model within
    the sound environment. These proofs are the final outcome of the analysis and
    are given in the form of a proof script written in the language of HOL.


    The foremost requirements, which are enclosed in the rectangle with dashed borders,
    are the theories of probability, Markov chains, information and reliability. However,
    all of these theories heavily rely upon the measure and Lebesgue integration theories
    to formalize the random variables, statistical properties and information measures.
    The Lebesgue integration theory also makes use of the measure theory as the integrals
    are defined for measurable functions with respect to measure functions. Finally,
    the measure theory, and more specifically the formalization of the Borel sigma
    algebra, requires various concepts from the topology theory, like the definition
    of open sets, and important properties from the theory of rational numbers, like
    the countability of the set of rational numbers and its density in the set of
    real numbers.


    The formalization of the set of extended-real numbers, i.e., the set of real numbers
    augmented by the negative and positive infinity, is used as a basis for the development
    of the various theories of the framework to facilitate the verification of several
    properties, mainly convergence theorems, that would not have been possible to
    prove using the normal (finite) real numbers. This choice also aids the verification
    of the important Radon Nikodym theorem and definition of the Radon Nikodym derivative,
    which is a necessity to define most commonly used measures of information. The
    measure theory is formalized in this framework based on the Borel spaces allowing
    us to work on any topological space and prove important properties of extended-real-valued
    measurable functions. Thus, the basic concepts of topology of the set of real
    numbers, such us, the notions of neighborhood and open sets, are also formalized
    in HOL. Then, this formalization, as well as the formalization of the set of rational
    numbers, is used to formalize the Borel sigma algebra in terms of open sets, and
    thus providing a generalized definition that can be used in any topological space.
    This approach facilitates the verification of various key properties of the Lebesgue
    integral.'
  merge: -1
  img_proc: true
