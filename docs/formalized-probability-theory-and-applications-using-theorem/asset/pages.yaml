    So to model the HMM represented in Figure 1, we need an initial distribution,
    the transition probabilities, and the emission probabilities, which we define
    as follows:


    # Definition 8.5


    ```

    |- ini_distr i = if (i = START) then 1 else 0

    |- trans_distr t i j = case (i, j) of

    (START, E) -> 1 | (E, E) -> 0.9 | (E, FIVE) -> 0.1 | (FIVE, I) -> 1 |

    (I, I) -> 0.9 | (I, END) -> 0.1 | -> 0

    |- e_distr a i = case (i, a) of

    (E, _) -> 0.25 | (FIVE, A) -> 0.05 | (FIVE, G) -> 0.95 | (I, A) -> 0.4 |

    (I, T) -> 0.4 | (I, C) -> 0.1 | (I, G) -> 0.1 | _ -> 0

    ```


    Then, in order to work with random variables X and Y denoting the states and the
    observations, respectively, on a probability space p, it is sufficient to have
    the following predicate:


    ```

    thmm X Y p s_x s_y ini_distr trans_distr e_distr

    ^ space s_x = univ(: state) ^ space s_y = univ(: dna)

