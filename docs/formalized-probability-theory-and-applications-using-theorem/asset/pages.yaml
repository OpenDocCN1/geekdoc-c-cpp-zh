- pgno: 271
  md: '# # Conclusion


    This book presented an alternative approach for conducting probabilistic analysis.
    The idea is to use higher-order-logic theorem proving as a complementary approach
    to state-of-the-art simulation and probabilistic model checking based techniques.
    For this purpose, the book presented a formal framework of all the tools needed
    to describe the system under consideration and its desired properties in a formal
    language that can be used within the theorem prover to verify that the system
    implementation satisfies its specification. Because of the formal nature of the
    models, the analysis will be free of approximation and precision errors and due
    to the high expressive nature of higher-order logic a wider range of systems can
    be analyzed. Thus, this kind of an analysis approach can prove to very useful
    for the performance and reliability optimization of safety critical and highly
    sensitive engineering and scientific applications.


    # ## 1. SUMMARY


    The book provided a higher-order-logic formalization of measure theory that is
    based on the extended-real numbers and includes the formalization of the Borel
    sigma algebra defined on the open sets. This allowed us to define measurable functions
    defined over arbitrary topological spaces. The book also presented the formalized
    product measure spaces that are required to formalize the operators involving
    multiple measurable functions.


    The formalization of measure theory is then used to define the Lebesgue integral
    and prove its properties. This formalization is also based on the extended-real
    numbers allowing us to work with non-integrable functions and to prove the Lebesgue
    monotone convergence theorem without assuming the integrability criterion. This
    result is later utilized in the proof of the important Radon Nikodym theorem,
    which is a theorem that would not have been possible to verify without the use
    of extended-real numbers.


    The above mentioned theories are then used to develop a higher-order-logic formalization
    of the main concepts of probability, like the probability spaces and'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'random variables, as well as their statistical properties, like the expectation
    and variance. Some classical results of probability theory, like the Shannon and
    Markov inequalities and the Weak Law of Large Numbers, have also been verified
    in a theorem prover.


    The book also provided a higher-order-logic formalization of Discrete-Time Markov
    Chains (DTMC) and verification of most of their important properties. These formalizations
    provide the capability formally evaluate the performance, maintainability and
    reliability of a wide variety of systems which are described as DTMCs. For illustration
    purposes, the book provides the analysis of the binary communication channel and
    the tag-collection process in an Automatic Mail Quality Measurement (AMQM) protocol.
    The formalization of the DTMC theory is further used to formally define classified
    states and classified DTMCs and the formal proofs of their significant properties.
    As an example, we used the formalization of the aperiodic and irreducible DTMCs
    to validate the LRU stack model in higher-order logic These applications highlight
    the benefits of the formalization of DTMCs and the formal verification of their
    properties using a higher-order-logic theorem prover.


    Next, the main measures of information are also formalized starting with the Radon-Nikodym
    derivative, which is used to define the Kullback-Leibler (KL) divergence as a
    unified measure of information. The KL divergence is then used to define the most
    commonly used measures of information, like the Shannon entropy, the mutual information
    and the conditional mutual information.


    The book also described the formalization of various measures of reliability and
    how reliability-engineering problems can be modeled and analyzed in the sound
    core of a theorem prover. The reliability analysis notions of the cumulative distribution
    function and he survival function are presented. Various useful properties of
    these measures are also verified. These theorems facilitate reasoning when constructing
    formal reliability proofs. Some examples for this work has also been presented
    in this book.


    Finally, the book presents a reliable approach for the formal analysis of the
    coverage and detection performance of wireless sensor networks using the k-set
    randomized scheduling to save energy. In particular, the main foundations of the
    randomized scheduling and expected values of the coverage intensity and intrusion
    period, detection probability and delay properties are prestened. This formalization
    allows to formally verify the coverage and detection related characteristics of
    most WSNs using the k-set randomized scheduling.


    The main limitation of the higher-order-logic based probabilistic analysis approach
    is the associated significant user interaction, i.e., the users needs to guide
    the proof tools manually since we are dealing with higher-order logic,which is
    known to be non-decidable. Thus, this approach should not be viewed as an alternative
    to methods, such as simulation and model-checking for the performance analysis
    of'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Conclusion


    real-time systems but rather as a complementary technique, which can prove to
    be very useful when precision of the results is of prime importance.


    The work is presented using the HOL4 theorem prover and its existing theories
    of Boolean algebra, sets, lists, positive integers and real numbers have been
    extensively utilized. The formalization, presented in this book, can therefore
    be regarded as a useful indicator of the state-of-the-art in theorem proving.
    The presented work clearly shows that formalizing mathematics in a mechanical
    system is a tedious work that requires deep understanding of both mathematical
    concepts and theorem-proving. It was often the case that lemmas that are commonly
    known to be true are found to be quite difficult to verify using theorem proving
    as all the required reasoning of truth should be explicitly provided to the verification.
    The automated reasoners aid somewhat in the proof process by automatically verifying
    some of the first-order-logic goals but most of the times the user needs to guide
    the tool by providing the appropriate rewriting and simplification rules. On the
    other hand, theorem-proving was found to be very efficient in book keeping. For
    example, it is very common to get confused with different variables and mathematical
    notations and make human errors when working with large paper-and-pencil proofs,
    which leads to the loss of a lot of effort. In the case of mechanical theorem
    provers such problems do not exist. Another major advantage of theorem proving
    is that once the proof of a theorem is established, it is guaranteed to be valid
    and the proof can be readily accessed, contrary to the case of paper-and-pencil
    proofs where we have to explore the enormous amount of mathematical literature
    to find proofs. Thus, it can be concluded that theorem-proving is a tedious but
    promising field, which can help mathematicians to cope with the explosion in mathematical
    knowledge and to save mathematical concepts from corruption. Also, there are areas,
    such as security critical software, military, space travel and medicine, where
    using formal methods will become a dire need.


    # 2. FUTURE DIRECTIONS


    The formalization and verification results, presented in this book, open new avenues
    in using theorem proving for the precise analysis of systems that exhibit randomness.
    Building on these results, more features can be added to strengthen the capabilities
    of the theorem proving based probabilistic analysis framework. Some of the future
    extensions are outlined below:


    The formalization of probability theory can be extended by defining the Probability
    Density Function (PDF). The PDF is defined as the Radon Nikodym derivative of
    the cumulative distribution function with respect to the probability measure.
    Formalizing the PDF allows to analyze the class of systems that can be described'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'by standard continuous distributions such as the normal distribution. The latter
    can be used to model a wide class of systems due to the central limit theorem.
    A formal proof of this theorem can also be an interesting extension to the formalization.
    Finally, formalizing the PDF allows writing the statistical properties of random
    variables, like the expectation, in terms of the density function and hence can
    be useful in the evaluation of continuous systems.


    Some of the interesting future directions for the DTMC formalization include the
    formalization of continuous time Markov chains (CTMC), the formalization of Queuing
    theory foundations and Markov decision procedures. These extensions would further
    expand the scope of using theorem proving for analyzing the probabilistic aspects
    of systems.


    The evaluation of the performance of protocols, like Crowds or Tor, can be an
    interesting application of the information theory related formalization reported
    in this book. The measures of information leakage, given in Chapter 8, can be
    used to quantify the leakage of information for different configuration of these
    networks.


    Building upon the Reliability Block Diagram (RBD) formalization, presented in
    this book, other commonly used RBDs, including series-parallel and K-out-of-N,
    can be formalized. Moreover, the formalization of RBDs can lead to analyzing many
    safety-critical applications, including cloud computing, automotive systems and
    medical devices. Likewise our formalization of the WSN properties of coverage
    and detection leads to many interesting formal analysis case studies, such as
    underwater monitoring and Body Area Sensor Networks (BASNs).


    Osman Hasan


