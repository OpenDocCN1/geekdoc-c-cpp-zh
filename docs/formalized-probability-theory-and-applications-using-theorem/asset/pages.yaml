    # 11.4 CONCLUSION


    In this chapter, we have verified some classical results of probability theory,
    namely, the Chebyshev and Markov inequalities and the Weak Law of Large Numbers.
    We used these results to formally verify the Asymptotic Equipartition Property,
    an important property used in the proofs of numerous information-theoretic theorems.
    We used the AEP to verify the properties of a typical encoder that is used in
    the formal proof of the Shannon source coding theorem. We have also presented
    two example applications of the use of quantitative analysis within a theorem
    prover to analyse the properties of an anonymity-based MIX channel as well as
    the properties of the one-time pad encryption. In the first example, we were able
