  md: '# 14.2.3 Average Detection Delay


    Within a wireless sensor network, the average detection delay is generally defined
    as the expectation of the time elapsed from the occurrence of an intrusion event
    to the time when this event is detected by some sensor nodes. In this part, we
    target the formal verification of this average detection delay, denoted by E (D).
    Mathematically, E (D) is specified as the expectation of the random variable D
    describing the detection delay. We suppose that E (D) is finite.


    Let DT i be the average time that the intrusion is detected in the ith round.
    For the first round (i = 1), the delay is obviously zero (DT1 = 0). Since the
    subsets of nodes are working by rounds, it is thus intuitive that the delay for
    detecting an intrusion depends on the detection round i. In addition, the DTi
    values depend also on the starting time, tz, of the intrusion, i.e., A12 and A22.
    Hence, for the second round (i = 2), we can find that


    +   If tz ∈ [t0, t0 + (1 − s) x T ], then DT2 = T − ((1 − s) x T) / 2.


    +   If tz ∈ ]t0 + (1 − s) x T, T [, then DT2 = (s x T) / 2.


    More generally, according to the original specification, if tz ∈ [t0, t0 +(1−s)
    x T ], i.e., given A12, then:


    \( DT_i |_{A_{12}} = \begin{cases} 0 & \text{if } i=1 \\ \left( (i-1) - \frac{(1-s)}{2}
    \right) \times T & \text{if } 1 < i \le \lfloor \frac{L}{T} \rfloor \end{cases}
    \) (14.13)


    However, when tz ∈ ]t0 + (1 − s) x T, T [, we have


    \( DT_i |_{A_{22}} = \begin{cases} 0 & \text{if } i=1 \\ \left( (i-2) - \frac{s}{2}
    \right) \times T & \text{if } 1 < i \le \lfloor \frac{L}{T} \rfloor + 1 \end{cases}
    \) (14.14)


    Note that the notations (DT i | A12) and (DT i | A22) refer to the values taken
    by the random variable D given A12 and A22, respectively.'
