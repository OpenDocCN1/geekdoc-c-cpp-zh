  md: '# Chapter 13


    # Scheduling Algorithm for Wireless Sensor Networks


    # ABSTRACT


    In Wireless Sensor Networks (WSNs), scheduling of the sensors is considered to
    be the most effective energy conservation mechanism. The random and unpredictable
    deployment of sensors in many WSNs in open fields makes the sensor-scheduling
    problem very challenging and thus randomized scheduling algorithms are used. The
    performance of these algorithms is usually analyzed using simulation techniques,
    which do not offer 100% accurate results. Moreover, probabilistic model checking,
    when used, does not include a strong support to reason accurately about statistical
    quantities like expectation and variance. In this chapter, the authors overcome
    these limitations by using higher-order-logic theorem proving to formally analyze
    the coverage-based random scheduling algorithm for WSNs. Using the probability
    theory formalization, described in Chapter 5, the authors formally reason about
    the probability of some events that are interesting in the context of WSN coverage.'
  merge: -1
