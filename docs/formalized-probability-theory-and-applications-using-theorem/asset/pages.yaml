    Engineering (LNCS), (vol. 6991, pp. 372–387). Springer-Verlag. doi:10.1007/978-3-642-24559-6_26


    # KEY TERMS AND DEFINITIONS


    **Average Detection Delay**: The average detection delay of a WSN is the expectation
    of the time elapsed from the occurrence of an intrusion event to the time when
    this event is detected by some sensor nodes.


    **Detection Probability of a WSN**: Detection probability is the probability of
    detecting an occurring event within the monitored area of the given WSN.


    **Detection**: Detection or intrusion detection is the process of detecting inappropriate,
    incorrect or suspicious intruders in the WSN. One of the foremost requirements
    of a WSN is to be able to detect all interesting events.'
