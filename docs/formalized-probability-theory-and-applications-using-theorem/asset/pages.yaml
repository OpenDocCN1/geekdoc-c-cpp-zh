    B) \), is defined as


    \( H^{\infty}(X; B) = -\log \left( \sum_{b \in \mathcal{B}} \frac{1}{\Gamma_b}
    \sum_{x \in \mathcal{X}} P(b) \sum_{x \in \mathcal{X}} P(x / b) \right) \)


    In order to formalize the Belief Min-Entropy in HOL4, we first define the belief
    vulnerability, which can be extended to obtain the Belief Min-Entropy by applying
    the converse logarithm.


    ```

