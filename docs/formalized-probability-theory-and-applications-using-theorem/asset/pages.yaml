- pgno: 117
  md: 'Due to the random nature of time dependent memory access requests, the above
    mentioned configurations are modeled as classified Discrete-time Markov Chains
    (DTMCs). Then performance characteristics, such as the average number of memory
    accesses and the steady state probabilities of processors waiting, can be deduced
    based on the properties of classified Markov chains and Discrete-time Markov Reward
    Models (DMRMs). These properties are expressed in terms of the transition probabilities
    of the given Markov chain and thus provide useful insights for system optimization.


    Traditionally, the above mentioned performance analysis is conducted analytically,
    using paper-and-pencil proof methods, computer simulations or numerical methods.
    The paper-and-pencil proof methods do not scale well to the complex multi-processor
    systems. Moreover, they are prone to human errors. Computer based simulations
    or numerical methods are scalable but due to the usage of computer arithmetic
    and pseudo random numbers and their inherent incompleteness cannot guarantee accurate
    results.


    The accuracy of the above mentioned performance analysis is becoming quite important
    these days due to the increasing usage of multi-processor systems in safety-critical
    domains like medicine and transportation. Recently, probabilistic model checking
    has been used to analyze DMRMs. The typical model checking tools are PRISM and
    MRMC, which provide precise system analysis by modeling the stochastic behaviors
    using probabilistic state machines and exhaustively verifying their probabilistic
    properties. These tools can be used for performance analysis of multi-processor
    systems as well. However, some algorithms implemented in these model checking
    tools are also based on numerical methods. For example, the Power method, which
    is a well-known iterative method, is applied to compute the steady-state probabilities
    (or limiting probabilities) of Markov chains in PRISM. Thus, most of the stationary
    properties analyzed in model checkers are time bounded. Moreover, probabilistic
    model checking often utilizes unverified algorithms and optimization techniques.
    Finally, model checking cannot be used to verify generic mathematical expressions
    for statistical properties, like expectation.


    In order to provide an accurate and complete approach for analyzing the memory
    ontention problem of multi-processor systems, we propose to use higher order-logic
    theorem proving. The high expressiveness of higher-order logic allows us to formally
    express the systems that can be modeled using classified Markov chains and DMRMs.
    Whereas, the soundness of theorem proving guarantees the correctness and completeness
    of the analysis. In this section, we develop the formalization of Discrete-time
    Markov Reward Models based on the formalization of expectation and conditional
    expectation functions for discrete random variables along with the available formalization
    of Discrete-Time Markov Chains (DTMCs). The fact that we are building upon a more'
