    # 10.5 CONCLUSION


    This chapter presents a formalization of vulnerability, belief-vulnerability,
    Min-Entropy and Belief Min-Entropy in higher-order logic. These metrics provide
    more reliable information flow analysis compared to the traditional definitions
    of quantitative information flow based on Shannon entropy for some corner cases.
    One such threat model being the case when an adversary can guess the secret input
    value in one try, given the observable output. The proposed formalization can
    be built upon to conduct the information flow analysis within the sound core of
    a theorem prover and thus the analysis is guaranteed to be free of approximation
    and precision errors. For illustration purposes, we performed the information
    flow analysis of a cascade of two channels using the HOL4 theorem prover and the
    analysis results were found to be generic and accurate.


    The proposed higher-order-logic formalization can be used in analyzing many other
    applications. We are particularly aiming to apply it for the formal information
    flow analysis of the Crowds protocol (Reiter & Rubin, 1998). Moreover, our work
    can be extended to analyze information flow in a reverse way, i.e. starting from
    a specific leakage bound we evaluate the input set with respect to the output
    set. This formalization can be used to formally ensure a specific level of security
    of critical information.'
