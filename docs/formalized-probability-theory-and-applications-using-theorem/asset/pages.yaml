- pgno: 60
  md: '# 5.1 FORMALIZATION OF PROBABILITY THEORY


    The classical approach to define the probability of an event A is P(A) = N<sub>A</sub>
    / N, where N<sub>A</sub> is the number of outcomes favorable to the event A and
    N is the number of all possible outcomes of the experiment. However, this approach
    is based on the assumptions that all outcomes are equally likely (equiprobable)
    and that the number of possible outcomes is finite. These assumptions are not
    always true and thus the above-mentioned classical definition has a limited scope.


    Kolmogorov introduced the axiomatic definition of probability, which overcomes
    the above-mentioned problem and provides a mathematically consistent way for assigning
    and deducing probabilities of events. This approach consists in defining a set
    of all possible outcomes, \(\Omega\), called the sample space, a set F of events
    which are subsets of \(\Omega\) and a probability measure p such that \((\Omega,
    F, p)\) is a measure space with \(p(\Omega) = 1\). Now, \((\Omega, F, p)\) is
    a probability space if it is a measure space and \(p(\Omega) = 1\).


    # Definition 5.1


    ```

    \forall p. prob_space p \Leftrightarrow measure_space p \wedge (measure p (p_space
    p) = 1)

    ```


    A probability measure is a measure function and an event is a measurable set.


    ```

    \prob = measure

    events = measurable_sets

    p_space = m_space

    ```


    Two events A and B are independent iff p (A \(\cap\) B) = p (A) p (B).


    # Definition 5.2


    ```

    \forall a b. indep p a b \Leftrightarrow a \in events p \wedge b \in events p
    \wedge

    prob p (a \cap b) = prob p a * prob p b

    X: \Omega \to R is a random variable iff X is (F, B (R)) measurable

    ```


    # Definition 5.3


    ```

    \forall X p s. random_variable X p s \Leftrightarrow

    prob_space p \wedge X \in measurable (p_space p, events p) s

    ```


    In this book, we focus on real-valued random variables but the definition can
    be adapted for random variables having values on any topological space thanks
    to the general definition of the Borel sigma algebra.'
