- pgno: 26
  md: 'of the results, the most promising feature of probabilistic model checking
    is the ability to perform the analysis automatically. On the other hand, it is
    limited to systems that can only be expressed as Markov chains. Another major
    limitation of the probabilistic model checking approach is state-space explosion.
    The state-space of a probabilistic system can be very large, or sometimes even
    infinite. Thus, at the outset, it is impossible to explore the entire state-space
    with limited resources of time and memory. Thus, the probabilistic model checking
    approach, even though is capable of providing exact solutions, is quite limited
    in terms of handling a variety of probabilistic analysis problems. Similarly,
    some algorithms implemented in these model-checking tools are based on numerical
    methods. For example, a well-known iterative method, i.e., the Power method (Kwiatkowska,
    Norman, & Parker, 2005), is applied to compute the steady-state probabilities
    (or limiting probabilities) of the Markov chain in PRISM. For this reason, most
    of the stationary properties analyzed in model checkers are time bounded. Moreover,
    probabilistic model checking tools often utilize unverified algorithms and optimization
    techniques. Finally, probabilistic model checking cannot be used to verify generic
    mathematical expressions corresponding to probabilistic and statistical properties.
    Thus, the verified properties involve values that are expressed in a computer-based
    notation, such as fixed or floating point numbers, which also introduces some
    degree of approximation in the results.


    # 2.3 THEOREM PROVING


    Theorem proving or automated reasoning (Harrison, 2009) is one of the most widely
    used formal verification method. The system that needs to be analyzed is mathematically
    modeled in an appropriate logic and the properties of interest are verified using
    computer based formal tools usually called theorem provers. The use of formal
    logics as a modeling medium makes theorem proving a very flexible verification
    method, as it is possible to formally verify any system that can be described
    mathematically. The core of theorem provers usually consists of some well-known
    axioms and primitive inference rules. Soundness is assured as every new theorem
    must be created from these basic axioms and primitive inference rules or any other
    already proven theorems or inference rules. A question may arise here that why
    do we need logic to model the system and why natural languages like English or
    other commonly used programming languages like C++ or Java may not suffice for
    carrying out theorem proving. The foremost answer to this question is that the
    meanings of these languages can be ambiguous and can lead to multiple interpretations
    depending on the context and implicit assumptions. Thus, statements specified
    in such languages cannot be used for theorem proving where the main goal is to
    verify'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Formal Verification Methods


    formulas based on precise rigorous reasoning and we need a logical language with
    a syntax that can be described using a few basic rules and a semantics that can
    be unambiguously defined.


    The human interaction or the manual proof effort required for proving logical
    formulas in a theorem prover varies from trivial to complex depending on the underlying
    logic. For instance, Propositional logic (Huth & Ryan, 2000) is the logic of propositions
    or declarative sentences which can be true or false. The propositions can be combined
    using Boolean operators: and (∧), or (∨), not (¬), implication (⇒) and equality
    (=). Theoretically speaking, propositional logic is decidable, i.e., the logical
    correctness of a formula specified in propositional logic can be automatically
    verified using an algorithm. The main limitation of propositional logic is its
    limited expressiveness, as it cannot be used to represent verification problems
    for all sorts of systems. First-order logic (Huth & Ryan, 2000) extends propositional
    calculus with quantifiers, i.e., for all (∀) and there exists (∃), and predicates,
    which are functions that return a Boolean value. One can declare constants, function
    names and free variables in first-order logic, which gives a considerable amount
    of flexibility in terms of expression. However, first-order logic is not completely
    decidable and is usually referred to as semi-decidable since a computer algorithm
    cannot automatically verify all statements expressed in first-order logic. Thus,
    the user of first-order-logic theorem provers may have to interactively verify
    some formulas by providing inputs to assist the tools. Finally, higher-order logic
    (Gordon, 1989) is the most expressive form of logic that allows quantification
    over functions and sets. These features make it so expressive that any system,
    along with its continuous and unpredictable elements, can be described using higher-order
    logic given that its behavior can be expressed in a closed mathematical form.
    This expressiveness comes at the cost of manual verification where user input
    is required to verify all formulas expressed in higher-order-logic, due to its
    un-decidable nature. Based on the required user intervention in the proof process,
    theorem proving can be broadly classified into two sub branches, i.e., automated
    theorem proving and interactive theorem proving.


    Automated theorem provers are primarily based upon propositional or first-order
    logics. The propositional logic is decidable theoretically, but in practice, exponential-time
    algorithms are required for automatic proofs. Thus, automatic proofs are mainly
    done by first reducing the formula to be verified to a propositional tautology
    or Boolean satisfiability-checking problem. This way, efficient algorithms like
    Binary decision diagrams (BDD), DPLL based SAT (satisfiability) solvers, Stakmarck’s
    procedure, or satisfiability modulo theory (SMT) solvers (Nieuwenhuis, Oliveras,
    & Tinelli, 2006) may be used to automatically check the validity of the formula.
    Recently proposed, SMT solvers significantly extend the capabilities of SAT solvers
    by handling arithmetic and some other decidable theories.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'From the automated theorem proving user''s perspective, formal verification
    can be done by developing a formal model of the system under verification using
    the available logic, i.e., propositional or first-order logic. The next step is
    to formally specify the property that needs to be verified for the given system.
    This property can then be verified using the automatic verification utilities
    like SMT solvers. Thus, the main challenge in using automated theorem proving
    for system analysis is the formal specification of the system model and the properties.


    In system analysis, we often come across systems, such as analog circuits or optical
    systems, whose behavior can only be described in terms of more general mathematics
    involving sets, real numbers, etc. As described earlier, first-order logic cannot
    be used to model these kinds of systems and thus we have to use higher-order logic
    (Gordon, 1989) and interactive theorem proving, where the user is involved in
    the formal verification process along with the machine. Edinburgh LCF (Logic for
    Computable Functions) (Gordon, 1989) is one of the most commonly used methods
    for developing interactive theorem provers. LCF style theorem provers are implemented
    using the strongly-typed functional programming language ML (Meta Language) (Paulson,
    1996) or its variants. An ML abstract data type is used to represent higher-order-logic
    theorems and the only way to interact with the theorem prover is by executing
    ML procedures that operate on values of these data types. Interactive theorem
    provers usually include many automatic proof assistants and automatic proof procedures
    to assist their user in the verification process. The user interacts with a proof
    editor and provides it with the necessary tactics to prove goals while using automatic
    proof procedures whenever the problem is reduced to a decidable subset. This process
    could be very tedious and usually takes thousands of lines of proof script and
    hundreds of man-hours for verifying the mathematical analysis presented in a couple
    of pages using paper-and-pencil proof methods. However, the ability to build upon
    already verified results is a big strength of interactive theorem proving.


    For illustration purposes, consider the formal verification of an algorithm that
    returns the minimum value of an array of real numbers. Due to the involvement
    of real numbers and an arbitrary number of elements, higher-order logic theorem
    proving is used for the verification. The first step in analyzing this algorithm
    is to formalize it in higher-order logic. This can be mainly done by the following
    recursive definition:


    ```

    ⊤ ∀ x. min_list [] (x: real) = x ∧

    ∀ h t x. min_list (h:: t) x = minimum (min_list t h) x

    ```


    where the function minimum takes two real numbers and returns the lesser one out
    of them and the symbol :: denotes the cons operation between the head and tail
    of'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'an array. The function recursively finds the minimum real number of a list
    of real numbers and another real number x.


    The next step after the formalization of the algorithm is to formalize the property
    of interest as a proof goal in the theorem prover. The following property serves
    this purpose:


    ```

    ⊢ ∀ (L: real list) x. MEM x L ⇒ min_list (TL (L)) (HD L) ≤ x

    ```


    The predicate MEM x L ensures that x is a member of list L and the functions HD
    and TL return the head and tail of their list argument, respectively. Thus, the
    goal guarantees that the value returned by the function min_list is less than
    or equal to all values of list L. This theorem can now be verified in a theorem
    prover using induction on the variable L. The rest of the reasoning is based on
    the above-mentioned definitions and properties of real numbers and lists. The
    main strength of the analysis presented above is its generic nature, which is
    evident from the usage of the “for all” quantifier for variables L and x, and
    guaranteed accuracy, based on the inherent soundness of a theorem prover. However,
    on the downside, the formalization involves the understanding of higher-order
    logic and the theories of real numbers and lists. Moreover, the verification required
    human guidance and was done interactively.


    For probabilistic analysis, we need to formalize (mathematically model) random
    variables as functions and formalize characteristics of random variables, such
    as CDF and expectation, etc., by quantifying over random variables (Hasan, 2008).
    Henceforth, first-order logic does not support such formalization and we need
    to use higher-order logic to formalize probabilistic analysis. The first step
    in this regard would be to model the behavior of the system that needs to be analyzed
    in higher-order logic, while expressing its random or unpredictable elements in
    terms of formalized random variables. The second step is to use this formal model
    to express the probabilistic and statistical properties, regarding the system,
    in higher-order logic. Finally, these probabilistic and statistical properties
    of the system model can be mechanically checked for correctness in a theorem prover.
    Based on these principles, formal reasoning support for probability theory and
    its related mathematical foundations has been developed in various higher-order
    logic theorem provers, including HOL4 (HOL4, 2015), Isabelle/HOL (Isabelle/HOL,
    2015) and PVS (PVS, 2015).


    The above-mentioned theorem proving based probabilistic analysis approach overcomes
    the limitations of the simulation and model checking based probabilistic analysis
    approaches. Due to the formal nature of the models and properties and the inherent
    soundness of the theorem proving approach, probabilistic analysis carried out
    in this way will be free from any approximation and precision issues. Similarly,
    the high expressiveness of higher-order logic allows us to analyze a wider range
    of'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'systems without any modeling limitations, such as the state-space explosion
    problem in the case of probabilistic model checking, and formally verify analytically
    complex properties, such as expectation, variance and tail distribution bounds.
    Furthermore, the use of mechanical theorem provers will increase the confidence
    in the proofs over the traditional paper-and-pencil approach. Given these benefits
    of conducting probabilistic analysis using higher-order logic theorem proving,
    the main scope of this manuscript is to provide a comprehensive guide to its foundational
    principles and practical utilization.


    # 2.4 CONCLUSION


    This chapter provided a brief overview of formal verification methods, their strengths,
    weaknesses and applications. Formal verification provides precise system analysis,
    which is a dire need in safety-critical system design. However, this precision
    comes at the cost of extensive engineering time and effort. Theorem proving is
    one of the most generic formal verification methods as it can automatically handle
    the analysis of systems that can be expressed using propositional or first-order
    logic and can also handle complex systems, involving continuous and unpredictable
    components, using higher-order logic at the cost of significant manual effort.
    Whereas, model checking requires manual efforts in formal specification of the
    system and properties but the verification is done automatically. However, it
    is limited by the state-space explosion problem and thus cannot handle very large
    systems.'
