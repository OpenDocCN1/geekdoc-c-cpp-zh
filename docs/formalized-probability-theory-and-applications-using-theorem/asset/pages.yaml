    The most commonly used RBD configurations include series, parallel and a combination
    of both. In this chapter, we present the formalization of series, parallel, series-parallel
    and parallel-series RBD configurations. These formalized configurations can then
    be used in turn to formally model systems behaviors in HOL4 and reason about their
    reliability, availability, dependability and maintainability characteristics.


    # 12.4.1 Series Reliability Block Diagram


    The reliability of a system with components connected in series, depicted in Figure
    1, mainly depends upon the reliability of a component that has minimum reliability
    among all the components. In other words, the system is no longer functional if
    any one of its component fails. Thus, we can say that the system will be reliable
    at time t only if all of its components are functioning reliably at time t. If
    A_i(t) is an event that represents the reliable functioning of the i^th component
    at time t then a serially connected system with N components at time t then the
    overall reliability of the complete system can be expressed mathematically as:


    $R_{series}(t) = Pr(A_1(t) \cap A_2(t) \cap A_3(t) \dots \cap A_N(t))$ (12.7)


    The mutual independence condition of individual reliability events of a series
    system allows us to simplify the above expression as follows:


    $R_{series}(t) = \prod_{i=1}^{N} R_i(t)$ (12.8)


    Now, we can formalize the serial RBD configuration in HOL4 as shown in (Ahmad,
    2014):


    Figure 1. System with a series connection of components


