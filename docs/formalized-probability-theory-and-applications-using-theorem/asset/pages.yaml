    # 7.3.2 Convergence Analysis


    The long-run probability distributions are often considered in the convergence
    analysis of random variables in stochastic systems. It is not very easy to verify
    that the limit probability distribution of a certain state exists in a generic
    non-trivial DTMC, because the computations required in such an analysis are often
    tremendous. However, in the aperiodic and irreducible DTMCs, we can prove that
    all states possess limiting probability distributions, by the following two properties.


    +   Property: For any aperiodic and irreducible DTMC with finite state space S,
    there exists \( \lim_{n \to \infty} p_{ij}^{(n)} \), for any state \( i \in S
    \).


    # Theorem 7.5


    ```

    ∀ X p s p0 pij i.

    Aperiodic_DTMC X s p s0 pij ∧ Irreducible_DTMC X s p s0 pij ⇒

    ∃ u. λ (n. P ( x | X n x = i ) - u)

    ```


    The proof is based on Theorem 7.4 along with some properties of the limit of a
    sequence.


    +   Property: For every state \( i \) in an aperiodic and irreducible DTMC, \(
    \lim_{n \to \infty} p_{i}^{(n)} \) is a stationary distribution.'
