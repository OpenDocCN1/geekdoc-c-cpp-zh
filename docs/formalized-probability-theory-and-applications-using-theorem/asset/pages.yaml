- pgno: 307
  md: '# About the Authors


    Osman Hasan received in 1997 the BEng (Hons) degree from the N-W.F.P University
    of Engineering and Technology, Pakistan, and in 2001 and 2008, the MEng and PhD
    degrees from Concordia University, Montreal, Quebec, Canada, respectively. He
    worked as a postdoctoral fellow at the Hardware Verification Group (HVG) of Concordia
    University for one year until August 2009. Currently, he is an Assistant Professor
    in the School of Electrical Engineering and Computer Science, National University
    of Science and Technology (NUST), Islamabad, Pakistan. He is the founder and director
    of System Analysis and Verification (SAVe) Lab at NUST, whose main focus is on
    the design and formal verification of embedded systems. Dr. Hasan is a senior
    member of IEEE, member of Association for Automated Reasoning (AAR), and member
    of the Pakistan Engineering Council.


    Sofiène Tahar received in 1990 the Diploma degree in Computer Engineering from
    the University of Darmstadt, Germany, and in 1994 the Ph.D. degree with “Distinction”
    in Computer Science from the University of Karlsruhe, Germany. Currently, he is
    Professor in the Department of Electrical and Computer Engineering at Concordia
    University, Montreal, Quebec, Canada, where he is holding a Senior Research Chair
    in Formal Verification of System-on-Chip. Prof. Tahar is founder and director
    of the Hardware Verification Group at Concordia University, which focuses on developing
    verification technologies in the fields of microelectronics, telecommunications,
    security, aviation, etc. He has received several awards and distinctions, including
    in 2010 a National Discovery Award, given to Canada’s top 100 researchers in engineering
    and natural sciences. Prof. Tahar is senior member of IEEE, senior member of ACM,
    and member of the Order of Engineers of Quebec, IEEE Computer, and IEEE Communications
    Societies.'
