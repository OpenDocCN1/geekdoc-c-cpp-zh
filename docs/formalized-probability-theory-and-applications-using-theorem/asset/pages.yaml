  md: '# Lemma 14.12


    ⊢ ∀ p n s L Ts. (1 ≤ n) ∧ (0 < s < 1) ∧ (0 < L) ∧ (0 < Ts) ⇒ (mono_incr (λk. real
    (D_surv p D n k (0.28)))) .


    The randomized scheduling is thus a dynamic approach, which provides performance
    adjustments of the deployed WSN application according to the value of k.


    The randomness in the nodes scheduling approach leads to sub-networks of different
    sizes with respect to the number of nodes. Obviously, the ideal case arises when
    the algorithm makes a fair split of the network so that all the subsets have the
    same size, i.e., the same number of nodes which we denote by m. The number of
    nodes n can be written hence as k x m. In what follows, we closely investigate
    the asymptotic performance behavior of the k-set randomized algorithm in the case
    of a uniform split of the nodes.


    In particular, we successfully verify the upper limit of the detection probability
    Pd_wsn when n = k x m and k goes to infinity:


    # Lemma 14.13


    ⊢ ∀ p m q s L Ts. (0 < s < 1) ∧ (0 < L) ∧ (0 < Ts) ∧ (∀k. L < & (SUC k) x Ts)
    ∧ (0 < q < 1) ⇒ lim k→∞ (λk. Pd_wsn p (k x m) k s L Ts q) = 1 - (1 - s) ^ -⌊(L
    / Ts)⌋ x q x m - s - e ^ -⌊(L / Ts)⌋ + 1) x q x m.


    The proof of the above lemma is based on the important mathematical result lim
    k→∞ (1 + x / k)^k = e^e, which wehave proved beforehand.


    Based on Lemma 14.13, the analysis of the above limit versus various parameters
    such as the intrusion period L, and the number of nodes per subset m, is now feasible.
    We hence verify that when m is very large, the detection probability will surely
    approach 1. Such result is considered as a second verification of Lemma5.2 in
    the specific case where n = k x m.


    # Lemma 14.14


    ⊢ ∀ p q s L Ts. (0 < s < 1) ∧ (0 < L) ∧ (0 < Ts) ∧ (∀k. L < & (SUC k) x Ts) ∧
    (0 < q < 1) ⇒ lim m→+∞ (λm. lim k→+∞ (λk. Pd_wsn p (k x m) k s L Ts q)) = 1 .'
