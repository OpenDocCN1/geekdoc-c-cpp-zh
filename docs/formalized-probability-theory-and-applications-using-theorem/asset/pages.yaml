    # ABSTRACT


    This chapter provides a brief introduction to the domain of formal methods (Boca,
    Bowen, & Siddiqi, 2009) and the most commonly used verification methods (i.e.,
    theorem proving [Harrison, 2009] and model checking [Baier & Katoen, 2008]). Due
