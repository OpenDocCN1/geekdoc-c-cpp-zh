- pgno: 259
  md: '# 14.3 WSN FOR BORDER SURVEILLANCE


    Wireless sensor networks have been widely explored for border monitoring applications
    (Sun et al., 2011). The main goal of a WSN deployed for border monitoring is to
    continuously detect intruding elements with a high probability and a small delay.
    These systems are useful for the detection of forces or vehicles in a military
    context, or the prevention of illegal intrusions of migrants or terrorists along
    a country border. In this context, the potential harsh nature of the field of
    interest makes a random deployment by air-dropping sensors much more practical.
    In this section, we are interested in formally analyzing the detection performances
    of a wireless sensor network deployed for a border monitoring application.


    Due to the safety-critical feature of the target application, the deployed WSN
    has to remain alive as long as possible while ensuring an efficient detection.
    Nevertheless, most of the existing WSNs for border monitoring suffer from lifetime
    limitations, e.g., a REMBASS sensor node, once deployed, can be functional for
    30 days only. In case of using the WSN to monitor terrorist intrusions along a
    mountainous border, it is obviously not required to monitor the whole area at
    all times. Thus, we can use the k-set randomized scheduling algorithm to preserve
    energy in a given border monitoring application. In the specified application,
    the nodes have a sensing area r = 30, and are deployed into an area of size a
    = 10000m², whereas, the success probability q of a sensor covering a point, is
    q - r/a = 0.28.


    In the previous section, we analyzed the detection probability Pr (D) according
    to the intrusion length L by distinguishing 2 cases: { L < (k – 1) x Ts } and
    { L ≥ (k – 1) x Ts }. It is important to note that, in the current application
    analysis, we focus on the first case; { L < (k – 1) x Ts }, which reflects transient
    events, that may not be detected, and is thus the most pertinent part of this
    analysis. For the other case, i.e., { L ≥ (k–1) x Ts }, we have already discussed
    that the detection probability Pr (D) equals the network coverage.


    Based on our theoretical development done in the previous section, we now conduct
    a formal asymptotic analysis (Xiao, Zhang, Sun & Chen; 2007) of the probabilistic
    detection and delay based on the parameters n and k. For that, we are'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'going to tackle the generic case and then instantiate it for the given border
    monitoring application. Hence, we simply denote (prob p (p_space p DIFF (udset
    n k s L Ts q))) by (Pd_wsn p n k s L Ts q) and (delay_wsn p n D k q) as (D_wsn
    p D n k q). In the context of our application, we basically verify two main properties
    of interest related to the detection probability of the events of interest and
    the detection delay. Thus, we easily check in HOL4 that (prob p (p_space p DIFF
    (udset n k s L Ts (0.28)))) equals


    ```

    1 - ((1 - s) \times \left( 1 - \frac{\lfloor L/T_s \rfloor}{k} \times (0.28) \right)^n
    - s \times \left( 1 - \frac{\lfloor L/T_s \rfloor}{k} + 1 \times (0.28) \right)^n

    ```


    and, the expected detection delay, (delay_wsn p D n k (0.28)), is


    ```

    \sum_{j=1}^n E(D|c=j) \times C_n^j \times (0.28)^j \times (1-(0.28))^{n-j}

    ```


    where E (D | c = j) represents the expression specified in Equation (14.30). Next,
    we simply denote Equation (14.31) and Equation (14.32), by (Pd surv p n k s L
    Ts (0.28)) and (D_surv p D n k (0.28)), respectively. It is important to note
    that, for space constraints, and in all the asymptotic analysis below, we only
    mention the main mathematical assumptions related to the used variables in the
    detection probability and delay.


    Hence, we formally verify that the detection probability is an increasing function
    of n, i.e., a larger n value leads to a better detection probability.


    # Lemma 14.1


    ```

    \vdash \forall p k q s L Ts. (1 < k) \land (0 < s < 1) \land (0 < L) \land (0
    < Ts) \land (L < s (k-1) \times Ts) \land (0 < q < 1) \Rightarrow (mono_incr (\lambda
    n. Pd_wsn p n k s L Ts q)) .

    ```


    where mono_incr is the HOL4 definition of an increasing sequence, which we define
    as follows:


    # Definition 14.7


    ```

    \vdash \forall f. mono_incr f \iff \forall n. f n \le f (SUC n) .

    ```'
