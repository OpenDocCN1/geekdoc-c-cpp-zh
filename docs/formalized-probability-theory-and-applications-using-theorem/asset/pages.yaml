    # 7.4.3 Memory Contention in a Multiprocessor System


    Multi-core processors along with multi-module memories are extensively being used
    in high performance computers these days. One of the main performance evaluation
    metrics in such configurations is the memory contention problem and its effect
    on the overall memory access time (Aviztzakh, 1973). Usually, this problem is
    analyzed using simulation or numerical methods. However, these methods either
    cannot guarantee accurate analysis or are not scalable due to the unacceptable
    computation times. As an alternative approach, we explore using theorem proving
    to analyze the memory contention problem of a multiprocessor system. For this
    purpose, this sec-'
