- pgno: 240
  md: '# Chapter 14


    # Formal Probabilistic Analysis of Detection Properties in Wireless Sensor Networks


    # ABSTRACT


    In the context of Wireless Sensor Networks (WSNs), the ability to detect an intrusion
    event is the most desired characteristic. Due to the randomness in nodes scheduling
    algorithm and sensor deployment, probabilistic techniques are used to analyze
    the detection properties of WSNs. However, traditional probabilistic analysis
    techniques, such as simulation and model checking, do not ensure accurate results,
    which is a severe limitation considering the mission-critical nature of most of
    the WSNs. In this chapter, the authors overcome these limitations by using higher-order-logic
    theorem proving to formally analyze the detection properties of randomly deployed
    WSNs using the randomized scheduling of nodes. Based on the probability theory,
    described in Chapters 5, they firstly formally reason about the intrusion period
    of any occurring event. This characteristic is then built upon to develop the
    fundamental formalizations of the key detection metrics: the detection probability
    and the detection delay. For illustration purposes, the authors formally analyze
    the detection performance of a WSN deployed for border security monitoring.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 14.1 DETECTION OF A WIRELESS SENSOR NETWORK


    Wireless Sensor Networks (WSNs) guarantee a continuous and automated monitoring
    of a given field without any human presence. This distinguishing feature is attained
    trough deploying a collection of battery-powered and wirelessly-connected miniature
    devices over the area of interest. The main task of such devices is to take measurements
    of the surrounding environment, to a base station to perform a centralized decision
    mechanism. Nowadays, wireless sensor networks are extensively being deployed in
    a wide range of real-world applications, such as home automation, detection of
    natural disasters, biological attacks and military tracking.


    Since nodes are usually stand-alone and battery powered, extending the network
    lifetime is very critical. Therefore, the k-set randomized nodes scheduling is
    commonly applied to preserve energy (Abrams, Goel, & Plotkin, 2004). The main
    idea of such approach is to randomly organize the nodes into alternatively working
    sub-networks. Hence, during a given time slot, only the nodes belonging to the
    current active sub-network are powered up and may report an occurring event while
    all the other nodes are inactive and thus contribute to the power saving of the
    overall system.


    In general, a wireless sensor network is expected to always report occurring events
    at any point of the monitored area to a base station with a short delay. This
    feature determines the detection abilities of the whole network and is measured
    through two key performance attributes: the detection probability and the detection
    delay. More specifically, the detection probability is the probability of detecting
    an occurring event within the monitored area. Due to the randomness in the nodes
    scheduling approach coupled with the unpredictable deployment of sensors, the
    detection characteristic cannot be usually ensured. Indeed, there is a possibility
    that an occurring event may not be detected if there are no nodes deployed in
    its surrounding area or the deployed nodes are inactive, due to random scheduling.
    Such situations will also lead to an infinite detection delay which is not desired
    at all. However, in most WSN applications, the network has to react according
    to intrusions detection. For example, in a WSN deployed for forest fire detection,
    the outbreak of afire should be simultaneously reported with the highest probability
    and the minimum delay, in order to alert the user. Consequently, missing an intrusion
    event can be really disastrous in the context of mission-critical WSN applications.
    Thus, probabilistic techniques are used to judge the detection properties of WSNs
    with the goal to maximize the probability of detection and minimize the detection
    delay.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'Traditionally, paper-and-pencil proof based probabilistic techniques have been
    used to analyze the performance of random scheduling for WSNs. Simulation, using
    the Monte Carlo method, is then used to validate the analytical results, which
    can be error-prone. Due to the inherent incompleteness of simulation coupled with
    the rounding errors of computer arithmetic, which is a serious limitation for
    mission-critical WSNs.


    Formal methods (Lveczy & Thorvaldsen, 2007; Bernardeschi, Masci & Pfeifer, 2008;
    Hanna, Rajan, & Zhang, 2008; Bernardeschi, Masci & Pfeifer, 2009; Elleuch, Hasan,
    Tahar & Abid, 2011; Zheng, Sun, Liu, Dong & Gu, 2011; Elleuch, Hasan, Tahar &
    Abid, 2013) can overcome the limitations of simulation and have been used to validate
    a wide range of hardware and software systems. Such methods enhance the analysis
    reliability using rigorous mathematical techniques to model and verify the given
    system. Formal methods have also been explored for analyzing WSNs but most of
    the existing work is focused on analyzing their functional aspects only (Fehnker,
    Hoesel & Mader 2007). However, given the wide application to WSNs in safety and
    mission-critical domains, there is a dire need to accurately assess their performance
    as well. With this motivation, this chapter provides a formal approach for an
    accurate performance analysis of the probabilistic detection properties of WSNs
    using the k-set randomized scheduling.


    We primarily build upon the recently developed probability theory available in
    the HOL4 theorem prover, described in this manuscript, to formally analyze the
    detection properties of the k-set randomized scheduling algorithm. The choice
    of using higher-order-logic allows us to model any system including its random
    and unpredictable components. In the last chapter, we presented the HOL4 formalization
    of the coverage property in WSNs. The effectiveness of our higher-order-logic
    developments has been shown on a real-world WSN application for forest fire detection.
    In this chapter, we provide a development regarding detection properties in WSN,
    which include the detection probability and the detection delay. The practical
    effectiveness of the developed formalizations is illustrated through formally
    analyzing the asymptotic detection behavior of areal-world WSN for border surveillance.
    Thanks to the proposed approach, this is the first time, to the best of our knowledge,
    that the performance analysis of this kind of a WSN application is analyzed in
    a complete formal manner.


    The rest of this chapter is organized as follows: In Section 14.2, we describe
    our higher-order-logic formalizations of the key detection properties: the detection
    probability and the detection delay. The practical effectiveness of these formal
    results is illustrated, in Section 14.3, through a WSN application for border
    monitoring security. Finally, Section 14.4 concludes the chapter.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# 14.2 DETECTION PROPERTIES


    In a wireless sensor network, an occurring event of any length is expected to
    be detected with a given probability by one or more active nodes within a given
    delay. The detection behavior of the network is hence a key feature whose performance
    is measured through two widely used metrics, which are the detection probability
    and the detection delay. In this section, we first formally reason about some
    properties related to the intrusion period of any occurring event. Next, we exploit
    this analysis to develop the higher order-logic formalization of the main detection
    metrics in WSNs using the k-set randomized scheduling.


    # 14.2.1 Intrusion Period


    According to the description of the k-set randomized algorithm, given in the previous
    chapter, the k formed subsets of nodes { Si, 1 ≤ i ≤ k } are disjoint and work
    alternatively within their scheduling time cycles / slots { Ti, 1 ≤ i ≤ k }. In
    a wireless sensor network, an event, e.g., the outbreak of a fire in a forest,
    happens randomly at any time. The duration of this event, denoted L, will obviously
    overlap with a number of scheduling cycles T. We are interested in formally verifying
    the average number of overlapping cycles with an intrusion period L.


    Now, the number of overlapping cycles with an intrusion event depends mainly on
    s, which is the remainder of the intrusion period L in terms of the number of
    slots T. Let t0 be any reference time and tz the beginning of the intrusion event.
    Hence, if tz belongs to the interval


    • [ t0, t0 + (1 - s) → T ], then L overlaps ⌈ L/T ⌉ with the probability (1 -
    s).

    • [ t0 + (1 - s) → T, T ], then L overlaps ⌈ L/T + 1 ⌉ with the probability s.


    More specifically, by expressing L in terms of T, the variable s has been defined
    by the following equation.


    s = L/T + 1 - ⌊ L/T ⌋ (14.1)'
