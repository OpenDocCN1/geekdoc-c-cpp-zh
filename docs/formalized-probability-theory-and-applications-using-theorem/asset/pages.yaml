  md: 'We also add the condition that positive simple functions take finite values,
    i.e., \(\forall i \in s, x < \infty\). Their Lebesgue integral can however be
    infinite. The Lebesgue integral is first defined for these functions and the definition
    is then extended to non-negative functions and finally to arbitrary functions


    Let \((X, \mathcal{A}, \mu)\) be a measure space. The integral of the positive
    simple function g with respect to the measure \(\mu\) is defined as


    \(\int_X g d\mu = \sum_{i \in s} \alpha_i \mu(a_i)\) (4.4)


    This is formalized in HOL4:


    ```

    Definition 4.25

    \(\vdash \forall m s a \alpha. \text{pos\_simple\_fn\_integral m s a} \alpha =\)

    \(\text{SIGMA } (\lambda i. \alpha\_\_i * \text{measure m (a i)}) s\)

    ```


    While the choice of \(((\alpha), (a), s)\) to represent g is not unique, the integral
    as defined above is independent of that choice. Several properties of the Lebesgue
    integral of positive simple functions such as the linearity and monotonicity have
    been verified. These results can be extended to be used for the definition in
    which the Lebesgue integral is an extended-real valued integral.


    The definition of the Lebesgue integral of positive simple functions can be used
    to define the integral of non-negative measurable functions using the supremum
    operator as follows:


    \(\int_X f d\mu = \sup \{ \int_X g d\mu | g \le f \text{ and } g \text{ positive
    simple function } \}\) (4.5)


    It can be formalized in HOL4 as follows:


    ```

    Definition 4.26

    \(\vdash \forall m f. \text{pos\_fn\_integral m f} =\)

    \(\text{sup } \{ r | \exists g. r \in \text{psfis m g} \land \forall x. g x \le
    f x \}\)

    ```


    where psfis m g is used to represent the Lebesgue integral of the positive simple
    function g. Finally, the integral for an arbitrary measurable function f is formalized
    in terms of the integrals of f* and f- where f* and f- are the non-negative functions
    defined by f*(x) = max (f(x), 0) and f-(x) = max (-f(x), 0).'
