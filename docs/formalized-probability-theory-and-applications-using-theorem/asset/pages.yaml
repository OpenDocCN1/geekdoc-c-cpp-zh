    of elements and the data stream as lists (Halali, Hasan & Tahar, 2012). Then we
    model a function, freq, that returns the frequency of an element in a list.


    # Definition 5.9


    ```

    |- ∀ L e. freq e L =

    (LENGTH (FILTER (λ r.r = e) L)) / (LENGTH L)

    ```


    where LENGTH returns the length of a list, and FILTER returns a filtered list
    out of its argument list with elements that satisfy the given condition. The above
    function will be required later, to report the list of the α-heavy hitter elements.
    Next, we model another function, HeavyHitter_lst, which takes as parameters two
    lists and a real value and returns the list of heavy hitters corresponding to
    the algorithm of heavy hitter problem.


