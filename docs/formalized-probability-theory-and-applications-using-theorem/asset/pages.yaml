    The theory of probability can be formalized in higher-order logic according to
    the Kolmogorov axiomatic definition of probability. This definition provides a
    mathematically consistent way for assigning and deducing probabilities of events.
    This approach consists in defining a set of all possible outcomes, \(\Omega\),
    called the sample space, a set \(F\) of events which are subsets of \(\Omega\)
    and a probability measure \(p\) such that \((\Omega; F; p)\) is a measure space
    with \(p(\Omega) = 1\). In this context, a random variable is then a measurable
    function and its expectation is equal to the Lebesgue integral with respect to
    the probability measure. Using measure theory to formalize probability provides
    a mathematically rigorous treatment of probability and a unified framework for
    analyzing discrete and continuous probability measures. Similarly, using the Lebesgue
    integral to define various statistical properties of'
