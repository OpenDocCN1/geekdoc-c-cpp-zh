    # 10.4 APPLICATION: CHANNELS IN CASCADE


    A channel is a triplet (A, B, CAB), where A is a finite set of the critical inputs,
    B is the observable output and CAB is the channel matrix representing the transitional
    probabilities from the input to the output of the channel. The channels are frequently
    connected in a cascade manner such that the outputs of the previous stage act
    as the input to the next one. In cascaded channels, the final output is produced
    in n steps, where n represents the number of cascaded channels.


