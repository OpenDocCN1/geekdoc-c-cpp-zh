    In Markov chain theory, certain Markov chains satisfy the Detailed Balance Equations,
    which ensures that this Markov chain has an equilibrium distribution. This kind
    of Markov chain exhibits a reversibility feature and is called reversible Markov
    chain. Mathematically, the detailed balance equations are expressed as


    π (i) P_ij = π (j) P_ji ∀ I,j ∈ Ω (6.5)


    where the π(i) and π(j) are the equilibrium probabilities of being states i and
    j. The detailed balance equations can be formalized as:


    # Definition 6.6


    ```

    ⊢ ∀ f X p s. db_equations f X p s =

    ∀ i j t. (f i * Trans X p s t l i j = f j * Trans X p s t l j I)

