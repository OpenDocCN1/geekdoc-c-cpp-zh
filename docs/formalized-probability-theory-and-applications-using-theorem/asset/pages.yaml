    # 8.5 CONCLUSION


    In this chapter, we first provided a formal definition of hidden Markov models
    (HMM). Building upon the definition of the time-homogeneous HMM, we verified fundamental
    properties, such as the joint probability of the sequences of states and observations,
    the joint probability of an observed sequence and the best path selection. These
    properties provide the foundations of the computation algorithms applied in diverse
    simulation tools and computer algebra systems in order to mitigate the tremendous
    computation loads in the HMM analysis. In addition, we presented an automatic
    verification method for systems involving HMMs in this chapter. Our automation
    can be further optimized in order to compare with the other simulation tools.


    HMMs are widely applied in almost all speech recognition, data compression, artificial
    intelligence and pattern recognition, as well as computational molecular biology
    applications. For this reason, we utilized our proved results for the formal analysis
    of a DNA sequence. We first defined the DNA types and the underlying states using
    HOL4 types, then constructed the DNA sequence model by instantiating the relevant
    parameters. The joint probability of a state sequence is obtained accurately based
    on the given model. Moreover, we described how to select the DNA sequence, which
    has the highest joint probability of a possible underlying state path (the best
    path). Finally, we showed the way to automatically compute the best path of an
    observed DNA sequence.'
