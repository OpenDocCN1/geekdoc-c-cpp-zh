    # 8.4 APPLICATION: DNA SEQUENCE ANALYSIS


    DNA sequence analysis plays a vital role in constructing gene mapping, discovering
    new species and investigating disease-manifestations in genetic linkage, parental
    testing and criminal investigation. Statistical methods are mainly applied for
    analyzing DNA sequences. In particular, obtaining the probability of a state path
    underlying the DNA fragment is the most critical step in identifying a particular
    DNA sequence.'
