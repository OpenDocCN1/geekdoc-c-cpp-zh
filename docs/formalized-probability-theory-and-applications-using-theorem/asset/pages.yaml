    (Trans X p s t (m + 1) i j =

    SIGMA (IMAGE (λ k. Trans X p s t l k j * Trans X p s t m i k)

    (k ∈ space s)))

    ```


    which gives the m step transition probability $P_{ij}^{(m)} = \sum_{k \in S} P_{ik}^{(m)}
