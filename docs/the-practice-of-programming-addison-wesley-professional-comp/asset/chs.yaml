  ### 2. 库\n\nC 和 C++ 的标准库包含了排序函数，这些函数应该对不利输入具有健壮性，并经过调优以尽可能快速运行。库程序准备好排序任何类型，但作为交换，我们必须适应它们的接口，这可能比我们上面展示的复杂一些。在\
  \ C 中，库函数名为 `qsort`，我们需要提供一个比较函数，以便当 `qsort` 需要比较两个值时调用它。由于值可以是任何类型，比较函数接收两个指向待比较项的\
  \ `void*` 指针。该函数将指针转换为正确的类型，提取数据值并返回结果（根据第一个值是否小于、等于或大于第二个值返回负、零或正）。\n\n*(注：由于原文文本存在严重重复，译文已剔除重复以保持输出的唯一性)*\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```c\n    /* nvcmp:比较两个 Nameval 名字 */\n    int nvcmp(const\
  \ void *va, const void *vb)\n    {\n        const Nameval *a, *b;\n        a = (Nameval\
  \ *) va;\n        return strcmp(a->name, b->name);\n    }\n```\n\n这与 `scmp` 类似，但不同之处在于字符串存储在结构体的成员中。提供键的方式非常笨拙，这意味着\
  \ `bsearch` 提供的灵活性不如 `qsort`。一个良好的通用排序例程需要一页或两页的代码，而二分查找的代码比与 `bsearch` 接口的代码长不了多少。尽管如此，使用\
  \ `bsearch` 而不是自己编写仍然是一个好主意。多年来，事实证明二分查找对于程序员来说要写正确非常困难。\n\n标准 C++ 库有一个名为 `sort`\
  \ 的通用算法，它可以保证 `O(n log n)` 的行为。代码更简单，因为它不需要类型转换或元素大小，而且对于具有顺序关系的类型，不需要显式的比较函数。\n\
  \n```cpp\n    sort(arr, arr+N);\n```\n\nC++ 库也拥有通用的二分查找例程，具有类似的表示法优势。\n\n**练习 2-1.**\
  \ 快速排序最自然的方式是递归的。请写出它的迭代版本并比较这两个版本。（Hoare 描述了用迭代实现快速排序有多困难，以及当他用递归实现时它是如何迎刃而解的。）\n\
  \n## 2.4. Java 快速排序\n\n\n为我们想要排序的每个类型适配 `quicksort` 很容易，但编写一个可以为任何类型的对象调用的通用排序更有启发性，更符合\
  \ `qsort` 接口的风格。\n\n与 C 或 C++ 的一大区别在于，在 Java 中无法将比较函数传递给另一个函数；没有函数指针。相反，我们创建一个*接口*，其唯一内容是一个比较两个\
  \ `Object` 的函数。对于每个要排序的数据类型，我们都创建一个类，其中包含一个实现该数据类型接口的成员函数。我们将该类的实例传递给排序函数，排序函数反过来使用类内部的比较函数来比较元素。\n\
  \n我们首先定义一个名为 `Cmp` 的接口，它声明了一个单一成员，即比较两个 `Object` 的比较函数 `cmp`：\n\n点击此处查看代码图像\n\n\
  \    interface Cmp {\n        int cmp(Object x, Object y);\n    }\n```\n\n然后我们可以编写实现此接口的比较函数；例如，这个类定义了一个比较\
  \ `Integer` 的函数：\n\n点击此处查看代码图像\n\n    // Icmp: Integer 比较\n    class Icmp implements\
  \ Cmp {\n        public int cmp(Object o1, Object o2)\n        {\n            int\
  \ i1 = ((Integer) o1).intValue();\n            int i2 = ((Integer) o2).intValue();\n\
  \            if (i1 < i2)\n                return -1;\n            else if (i1 ==\
  \ i2)\n            else\n                return 1;\n        }\n    }\n```\n\n而这个类比较\
  \ `String`：点击此处查看代码图像\n\n```java\n    class Scmp implements Cmp {\n        public\
  \ int cmp(Object o1, Object o2)\n        {\n            String s1 = (String) o1;\n\
  \            String s2 = (String) o2;\n            return s1.compareTo(s2);\n  \
  \      }\n    }\n```\n通过这种机制，我们只能排序派自 `Object` 的类型；它不能应用于 `int` 或 `double` 等基本类型。这就是为什么我们排序的是\
  \ `Integer` 而不是 `int`。\n\n有了这些组件，我们现在可以将 C 的 `quicksort` 函数翻译成 Java，并让它调用从参数传递的\
  \ `Cmp` 对象的比较函数。最显著的变化是使用了索引 `left` 和 `right`，因为 Java 不支持指向数组的指针。点击此处查看代码图像\n\n\
  ```java\n    // Quicksort.sort: 快速排序 v[left]..v[right]\n    static void sort(Object[]\
  \ v, int left, int right, Cmp cmp)\n    {\n        int i, last;\n            return;\n\
  \        last = left; // 移动元素\n        for (i = left+1; i <= right; i++) // 分区\n\
  \            if (cmp.cmp(v[i], v[left]) < 0)\n                swap(v, ++last, i);\n\
  \        swap(v, left, last); // 恢复元素\n        sort(v, left, last-1, cmp); // 递归排序\n\
  \        sort(v, last+1, right, cmp); // 每个部分\n    }\n\n`Quicksort.sort` 使用 `cmp`\
  \ 比较一对对象，并调用 `swap` 交换它们。点击此处查看代码图像\n\n```java\n    // Quicksort.swap: 交换 v[i] 和\
  \ v[j]\n    static void swap(Object[] v, int i, int j)\n    {\n        Object temp;\n\
  \        temp = v[i];\n        v[j] = temp;\n    }\n```\n\n随机数生成通过一个在 `left` 到 `right`\
  \ 范围内产生随机整数函数完成：点击此处查看代码图像\n\n```java\n    static Random rgen = new Random();\n\
  \    // Quicksort.rand: 返回 [left,right] 随机数\n    {\n        return left + Math.abs(rgen.nextInt())%(right-left+1);\n\
  \    }\n```\n\n我们计算绝对值并使用 `Math.abs`，因为 Java 的随机数生成器也会产生负整数。`sort`、`swap` 和 `rand`\
  \ 函数以及生成器 `rgen` 是 `Quicksort` 类的成员。最后，为了调用 `Quicksort.sort` 来排序 `String` 数组，我们会\n\
  \n```java\n    String[] sarr = new String[n];\n    Quicksort.sort(sarr, 0, sarr.length-1,\
  \ new Scmp());\n```\n\n这使用为此创建的比较对象调用 `sort`。\n\n**练习 2-2.** 我们的 Java 快速排序在元素从原始类型（如\
  \ `Integer`）转换为 `Object` 并反转时，进行了大量的类型转换。尝试一个使用被排序特定类型的 `Quicksort.sort` 版本，以估计类型转换带来的性能损失。\n\
  \n## 2.5. O 符号法\n\n\n\n\n\n这种思想有一个标准的表示法，称为“大 O 表示法”（O-notation）。它的基本参数是 `n`，即问题实例的大小，而`complexity`或运行时间表示为\
  \ `n` 的函数。“O”代表 `order`（阶阶），例如“二分查找是 `O(log n)`；搜索一个包含 `n` 个元素的数组需要对数级 `n` 数量的步骤。”该表示法\
  \ `O(f(n))` 意味着，一旦 `n` 变得很大，其运行时间最多与 `f(n)` 成正比，例如 `O(n²)` 或 `O(nlog n)`。这样的渐近估计对于理论分析非常有价值，并且对算法的粗略比较非常有帮助，但在实践中细节可能会产生差异。例如，对于较小的\
  \ `n` 值，一个低开销的 `O(n²)` 算法运行可能比一个高开销的 `O(nlog n)` 算法更快，但不可避免的是，如果 `n` 足够大，增长行为较慢的算法将会更快。\n\
  \n我们还必须区分`最坏情况`（worst-case）和`期望`（expected）行为。定义“期望”很困难，因为它取决于对将提供什么样的输入的假设。我们通常可以精确地界定最坏情况，尽管这可能具有误导性。快速排序的最坏情况运行时间是\
  \ `O(n²)`，但期望时间是 `O(nlog n)`。通过每次仔细选择枢值元素，我们可以将二次方或 `O(n²)` 行为的概率降低到为零；在实践中，实现良好的快速排序通常在\
  \ `O(nlog n)` 时间内运行。\n\n这些是最重要的情况：\n![image](img/041tab01.jpg)\n\n访问数组中的项是一个常数时间操作或\
  \ `O(1)` 操作。一个在每个阶段都消除一半输入的算法（如二分查找）通常需要 `O(log n)`。使用 `strcmp` 比较两个长度 `n` 字符的字符串是\
  \ `O(n)`。传统的矩阵乘法算法耗时 `O(n³)`，因为输出的每个元素都是 `n` 对元素相乘并相加的结果，而每个矩阵中有 `n²` 个元素。\n\n指数级时间算法通常是评估所有可能性的结果：一个包含\
  \ `n` 个元素的集合有 `2^(n)` 个子集，因此一个需要查看所有子集的算法将是指数级的或 `O(2^(n))`。除非 `n` 非常小，否则指数级算法通常太昂贵，因为向问题中添加一个元素会导致运行时间翻倍。遗憾的是，有很多问题（例如著名的“旅行员问题”），目前只已知指数级算法。在这种情况下，通常会使用寻找最佳答案近似值的算法来代替。\n\
  \n**练习 2-3.** 哪些输入序列可能会导致快速排序实现显示最坏情况行为？尝试找到一些能让你的库版本运行缓慢的序列。将此过程自动化，以便你可以轻松地指定并执行大量实验。\n\
  \n**练习 2-4.** 设计并实现一种算法，以尽可能慢排序一个包含 `n` 个整数的数组。你必须遵守公平规则：算法必须取得进展并最终终止，且实现不能通过浪费时间的循环等技巧来作弊。你的算法作为\
  \ `n` 的函数的其复杂度是多少？\n## 2.6 动态增长数组\n\n在之前的几节中使用的数组是静态的，它们的大小和内容在编译时就已经固定了。如果在运行时修改软词表或\
  \ HTML 字符表，哈希表将是更合适的数据结构。通过一次一次插入 `n` 个元素来增长排序数组是一个 `O(n²)` 操作，如果 `n` 很大，则应该避免。\n\
  \n然而，通常我们需要跟踪一些变量但数量较小的事物，此时数组仍然可以是首选方法。为了最小化分配成本，应该分块调整数组的大小，并且为了整洁，数组应该与维护它所需的信息聚集在一起。在\
  \ C++ 或 Java 中，这将通过标准库中的类完成；在 C 中，我们可以通过 `struct` 实现类似的结果。\n\n以下代码定义了一个包含 `Nameval`\
  \ 项的可增长数组；新项被添加到数组末尾，数组会根据需要进行增长以留出空间。任何元素都可以通过其下标以常数时间访问。这类似于 Java 和 C++ 库中的 vector\
  \ 类。\n\n点击此处查看代码图像\n```c\ntypedef struct Nameval Nameval;\nstruct Nameval {\n  \
  \  char    *name;\n    int     value;\n};\nstruct NVtab {\n    int    nval;  /*\
  \ 当前值的数量 */\n    int    max;    /* 分配值的数量 */\n} nvtab;\nenum { NVINIT = 1, NVGROW\
  \ = 2 };\n/* addname: 向 nvtab 添加新的名称和值 */\nint addname(Nameval newname)\n{\n   \
  \ Nameval *nvp;\n    if (nvtab.nameval == NULL) { /* 第一次执行 */\n        nvtab.nameval\
  \ = (Nameval *) malloc(NVINIT * sizeof(val));\n        if (nvtab.nameval == NULL)\n\
  \        nvtab.max = NVINIT;\n        nvtab.nval = 0;\n    } else if (nvtab.nval\
  \ >= nvtab.max) { /* 增长 */\n        nvp = (Nameval *) realloc(nvtab.nameval, (NVGROW*nvtab.max)\
  \ * sizeof(val));\n        if (nvp == NULL)\n            return -1;\n        nvtab.max\
  \ *= NVGROW;\n        nvtab.nameval = nvp;\n    }\n    return nvtab.nval++;\n}\n\
  ```\n\n`addname` 返回新添加项的索引，如果发生错误则返回 `-1`。\n\n`realloc` 调用将数组扩展到新大小，保留现有元素，如果内存不足则返回\
  \ `NULL`。在每次 `realloc` 调用中翻倍大小使得拷贝每个元素的代价保持为常数；如果每次调用只增长一个元素，性能可能是 `O(n²)`。由于重新分配时数组地址可能会改变，程序的其他部分必须下标引用元素。注意代码没有\n\
  \n点击此处查看代码图像\n```c\nnvtab.nameval = (Nameval *) realloc(nvtab.nameval, (NVGROW*nvtab.max)\
  \ * sizeof(val));\n```\n\n在这种形式下，如果重新分配失败，原始数组将丢失。\n\n我们数组初始值从一个非常小的值（`NVINIT =\
  \ 1`）。这强制程序立即增长数组，从而确保这部分代码得到了测试。一旦代码投入生产使用，可以增加初始大小，尽管这种开始的代价可以忽略不计。\n\n`realloc`\
  \ 的返回值不需要强制转换为最终类型，因为 C 会自动提升 `void*`。但 C++ 不会；在那里需要强制转换。人们可以争论进行强制转换更安全（整洁、诚实）还是不进行（转换会掩盖真实的错误）。我们选择强制转换是因为它使程序在\
  \ C 和 C++ 中都是合法的；代价是少了 C 编译器的检查，但可以通过两个编译器提供的额外检查来补偿。\n删除名称可能是复杂的，因为我们必须决定如何处理产生的空隙。如果元素的顺序不重要，简单的方法是将最后一个元素交换到洞中。然而，如果要保留顺序，我们必须将洞之后的元素向下移动位置：\n\
  \n点击此处查看代码图像\n\n```c\n/* delname: 从 nvtab 中删除第一个匹配的 nameval */\nint delname(char\
  \ *name)\n{\n    int i;\n        if (strcmp(nvtab.nameval[i].name, name) == 0) {\n\
  \            memmove(nvtab.nameval+i, nvtab.nameval+i+1,\n```\n\n\n\n\n\n```c\n\
  nvtab.nval--;\nreturn 1;\n}\nreturn 0;\n}\n```\n\n对 `memmove` 的调用通过将元素向下移动一位来压缩数组；`memmove`\
  \ 是一个用于复制任意大小内存块的标准库程序。\n\n\n我们可以用以下循环来替换 `memmove` 调用：\n\n点击此处查看代码图片\n\n```c\n\
  int j;\nfor (j = i; j < nvtab.nval-1; j++)\n    nvtab.nameval[j] = nvtab.nameval[j+1];\n\
  \n我们更倾向于使用 `memmove`，因为它避免了按错误顺序复制元素这种容易犯的错误。如果我们要插入而不是删除，循环需要递减计数而不是递增，以避免覆盖。通过调用\
  \ `memmove`，我们不需要每次都深思细节。\n\n移动数组元素的替代方案是将已删除的元素标记为未使用。当要添加新项时，首先查找一个空位，如果未找到，则扩展向量（vector）。在这个示例中，可以通过将其字段设置为\
  \ `NULL` 来将元素标记为未使用。\n\n数组是分组数据最简单的方法；大多数语言提供高效且方便的索引数组并将字符串表示为字符数组，这并非偶然。数组易于使用，可提供对任何项的\
  \ `O(1)` 访问，与二分查找和快速排序配合良好，且开销很小。对于可以在编译时构造的固定大小数据，或者对于保证的数据集合，数组是无比拟的。但在数组中维护一个变化的值集合可能是昂贵的的，因此如果元素数量不可预测且很大，使用另一种结构可能更好。\n\
  \n**练习题 2-5。** 在上面的代码中，`delname` 没有调用 `realloc` 来返回删除时释放的内存。这值得吗？你会如何决定是否这样做？\n\n\
  \n## 2.7 列表\n\n除了数组之外，列表是程序中最常见的数据结构。许多语言具有内置的列表类型——某些语言（如 Lisp）就是基于列表的——但在 C 中我们必须自己构建它们。在\
  \ C++ 和 Java 中，列表是由库实现的，但我们仍然需要知道如何以及何时使用它。在本节我们将讨论 C 中的列表，但这些原理适用于更广泛的。\n\n单链表是一组项，每项都包含数据和一个指向下一个项的指针。列表的头部（head）指向第一个项的指针，列表末尾由空指针标记。这显示了一个包含四个元素的列表：\n\
  \n![image](img/045fig01.jpg)\n\n\n这些差异表明，如果项的集合会频繁变化，特别是当项的数量不可预测时，列表是存储它们的有效方法；相比之下，数组更适用于相对静态的数据。\n\
  \n列表有几个基本操作：在头部或尾部添加新项、查找特定项、在特定项之前或之后添加新项，可能还有删除某项。列表的简单性使得很容易根据需要添加其他操作。\n\n与其定义一个显式的\
  \ `List` 类型，在 C 中使用列表的通常方法是从一个元素的类型开始，例如我们的 `Nameval`，并添加一个连接到下一个元素的指针：\n\n点击此处查看代码图片\n\
  \ntypedef struct Nameval Nameval;\nstruct Nameval {\n    char *name;\n    int value;\n\
  \    Nameval *next; /* 在链表中使用 */\n};\n```\n\n在编译时很难初始化一个非空列表，因此与数组不同，列表是动态构造的。首先，我们需要一种构造项的方法。最直接的方法是使用合适的函数分配一个，我们将其命名为\
  \ `newitem`：\n点击此处查看代码图片\n\n```c\n/* newitem: 根据 name 和 value 创建新项 */\nNameval *newitem(char\
  \ *name, int value)\n{\n    Nameval *newp;\n    newp = (Nameval *) emalloc(sizeof(Nameval));\n\
  \    newp->name = name;\n    newp->next = NULL;\n    return newp;\n}\n```\n\n`emalloc`\
  \ 程序将在整个过程中都会使用；它调用 `malloc`，如果分配失败，它会报告错误并退出。构建列表的最简单方法是将每个项添加到头部：\n\n点击此处查看代码图片\n\
  \n/* addfront: 将 newp 添加到头部 */\nNameval *addfront(Nameval *listp, Nameval *newp)\n\
  {\n    newp->next = listp;\n    return newp;\n}\n```\n\n当列表被修改时，它可能会获得一个新的头部，因为调用了\
  \ `addfront`。更新列表的函数必须返回新元素，并存储在变量中：\n```c\nnvlist = addfront(nvlist, newitem(\"\
  smiley\", 0));\n```\n\n这种设计即使列表为空也有效，并且比传入头部指针更自然。在列表末尾添加项是一个 `O(n)` 过程，因为我们需要遍历列表找到末尾：\n\
  \n点击此处查看代码图片\n\n```c\nNameval *addend(Nameval *listp, Nameval *newp)\n{\n    Nameval\
  \ *p;\n    if (listp == NULL)\n        return newp;\n    for (p = listp; p->next\
  \ != NULL; p = p->next)\n        ;\n    p->next = newp;\n    return listp;\n```\n\
  \n如果我们想让 `addend` 成为 `O(1)` 操作，可以保留一个指向列表末尾的独立指针。这种方法的缺点除了维护末尾指针的麻烦外，列表不再由单个指针变量表示。我们将坚持简单的风格。要搜索具有特定名称的项，请遵循\
  \ `next` 指针：\n\n点击此处查看代码图片\n\n```c\n/* lookup: 在 listp 中顺序查找 name */\nNameval *lookup(Nameval\
  \ *listp, char *name)\n    for ( ; listp != NULL; listp = listp->next)\n       \
  \ if (strcmp(name, listp->name) == 0)\n            return listp;\n    return NULL;\
  \ /* 无匹配项 */\n}\n```\n\n\n\n这需要 `O(n)` 时间的时间，并且通常情况下没有办法改进这个界限。即使列表是有排序的，我们也需要遍历列表以找到特定的元素。二分查找不适用于列表。\n\
  \n为了打印列表的元素，我们可以写一个函数来遍历列表并打印每个元素；为了计算列表的长度，我们可以写一个函数遍历列表并增加计数器；依此类推。另一种方法是写一个名为\
  \ `apply` 的函数，它遍历列表并对每个列表元素调用另一个函数。我们可以通过为 `apply` 提供一个参数，并在每次调用函数时传递该参数，使 `apply`\
  \ 变得更具灵活性。因此，`apply` 有三个参数：列表、要应用到列表每个元素上的函数，以及该函数的参数：\n\n点击此处查看代码图片\n\n```c\n/*\
  \ apply: 对列表 listp 的每个元素执行 fn */\nvoid apply(Nameval *listp,\n{\n    for ( ; listp\
  \ != NULL; listp = listp->next)\n        (*fn)(listp, arg);  /* 调用函数 */\n}\n```\n\
  \n`apply` 的第二个参数是一个指向函数的指针，该函数接受两个参数并返回 `void`。标准但笨拙的语法：\n\n```c\n```\n\n将 `fn`\
  \ 声明为指向 `void` 值函数的指针，即一个存储返回 `void` 函数地址的变量。该函数接受两个参数：一个 `Nameval*`（列表元素）和一个 `void*`（一个指向函数参数的通用指针）。\n\
  \n例如，为了使用 `apply` 打印列表的元素，我们可以写一个简单易的函数，其参数是一个格式化字符串：\n\n点击此处查看代码图片\n\n```c\nvoid\
  \ printnv(Nameval *p, void *arg)\n{\n    char *fmt;\n    fmt = (char *) arg;\n \
  \   printf(fmt, p->name, p->value);\n}\n```\n\n我们像这样调用它：\n点击此处查看代码图片\n\n```c\napply(nvlist,\
  \ printnv, \"%s: %x\\n\");\n```\n\n为了计数元素，我们定义一个参数为指向要增加整数指针的函数：\n\n点击此处查看代码图片\n\
  ```c\n/* inccounter: 增加计数器 *arg */\nvoid inccounter(Nameval *p, void *arg)\n{\n\
  \    int *ip;\n    /* p 未未使用 */\n    ip = (int *) arg;\n    (*ip)++;\n}\n\n并像这样调用它：\n\
  \n点击此处查看代码图片\n\n```c\nint n;\nn = 0;\napply(nvlist, inccounter, &n);\n```\n\n并不是每个列表操作都最好用这种方式完成。例如，为了销毁列表，我们必须更加小心：\n\
  \n点击此处查看代码图片\n\n```c\n/* freeall: 释放 listp 的所有元素 */\nvoid freeall(Nameval *listp)\n\
  \    Nameval *next;\n    for ( ; listp != NULL; listp = next) {\n        next =\
  \ listp->next;\n        /* 假设 name 在其他处释放 */\n        free(p);\n    }\n}\n```\n\n\
  \n注意 `freeall` 没有释放 `listp->name`。它假设每个 `Nameval` 的 `name` 字段会在某处被释放，或者从未被释放。确保项目被分配和释放需要\
  \ `newitem` 和 `freeall` 之间的约定；在保证内存被释放和确保事物不被错误释放之间存在权衡。这样做时错误频繁发生。在包括 Java 在内的其他语言中，垃圾回收为你你解决了这个问题。我们将在第\
  \ 4 章中返回资源管理的话。\n\n从列表中删除单个元素的工作比添加一个要多：\n\n点击此处查看代码图片\n\n```c\n/* delitem: 从 listp\
  \ 中删除第一个 \"name\" */\n{\n    Nameval *p, *prev;\n    prev = NULL;\n    for (p =\
  \ listp; p != NULL; p = p->next) {\n        if (strcmp(name, p->name) == 0) {\n\
  \            if (prev == NULL)\n                listp = p->next;\n            else\n\
  \                prev->next = p->next;\n            return listp;\n        }\n \
  \       prev = p;\n    }\n    eprintf(\"delitem: %s not in list\", name);\n    return\
  \ NULL;  /* 不在这里 */\n}\n```\n\n\n\n\n有很多类型的树反映了复杂的结构，例如捕捉句子或程序语法的解析树，或者描述人与人关系的家族树。我们将通过二叉搜索树来解释这些原理，二叉搜索树的每个节点有两个链接。它们最容易实现，并展示了树的基本属性。二叉搜索树中的节点包含一个值和两个指针\
  \ `left` 和 `right`，指向其子节点。如果节点的子节点少于两个，则子指针可能为空空。在二叉搜索树中，节点的值定义了树的结构：特定节点左侧的所有节点值都较小，右侧的所有节点值都较大。由于这一属性，我们可以使用二分搜索的变体在树中快速查找特定值，或确定其不存在。\n\
  \n`Nameval` 的树版本非常直观：\n\n点击此处查看代码图像\n\ntypedef struct Nameval Nameval;\nstruct Nameval\
  \ {\n    char    *name;\n    int     value;\n    Nameval *left;  /* 较小 */\n    Nameval\
  \ *right; /* 较大 */\n};\n```\n\n\n作为一个具体示例，此图显示了字符名称表的子集，它以 `Nameval` 二叉搜索树的形式存储，按名称中的\
  \ ASCII 字符排序：\n\n![image](img/051fig01.jpg)\n\n由于树的每个节点都有多个指向其他元素的指针，许多在列表或数组中需要\
  \ `O(n)` 时间的操作在树中仅需 `O(log n)` 时间。每个节点上的多个指针通过减少查找项目时访问的节点数量，降低操作的时间复杂度。\n\n二叉搜索树（在本节中我们简称为“树”）通过递归向下进入树来构建，根据情况向左或向右分支，直到找到链接新节点的合适位置，该节点必须是一个正确初始化的\
  \ `Nameval` 类型对象：一个名称、一个值和两个空指针。新节点作为叶子节点 `leaf` 添加，即它还没有子节点。\n\n\n```c\n/* insert:\
  \ 将 newp 插入 treep, 返回 treep */\nNameval *insert(Nameval *treep, Nameval *newp)\n\
  {\n    int cmp;\n    if (treep == NULL)\n        return newp;\n    cmp = strcmp(newp->name,\
  \ treep->name);\n        weprintf(\"insert: duplicate entry %s ignored\",\n    \
  \         newp->name);\n    else if (cmp < 0)\n        treep->left = insert(treep->left,\
  \ newp);\n    else\n        treep->right = insert(treep->right, newp);\n    return\
  \ treep;\n}\n```\n我们之前没有提到过重复项。这个版本的 `insert` 会对尝试向树插入重复项（`cmp == 0`）的行为报错。列表插入例程没有报错，因为那需要搜索列表，使插入复杂度变为\
  \ `O(n)` 而不是 `O(1)`。然而对于树来说，这种测试基本上是免费的，而且如果存在重复项，数据结构的属性就不够明确了。但在其他应用程序中，可能需要接受重复项，或者完全忽略它们也是合理的。\n\
  \n`weprintf` 例程是 `eprintf` 的变体；它打印以 `warning` 为前缀的错误消息，但与 `eprintf` 不同，它不会终止程序。从根到每个叶节点的路径长度大致相同的树被称为\
  \ `balanced`（平衡树）。平衡树的优势在于查找项目的过程是一个 `O(log n)` 过程，因为就像二分搜索一样，每一步的可能性都会减半。\n\n如果项目按照到达顺序插入树中，树可能是不平衡的；事实上，它可能非常不平衡。例如，如果元素按顺序到达，代码将始终沿着树的一个分支向下，实际上产生了一个沿\
  \ `right` 链接的列表，并具有列表的性能问题。然而，如果元素按随机顺序到达，这种情况不太可能发生，树会相对平衡。实现保证平衡的树是很复杂的；对于我们的目的，我们将避开这个问题，并假设输入数据是随机的，以保持树足够平衡。`lookup`\
  \ 的代码与 `insert` 类似：\n\n点击此处查看代码图像\n\n```c\nNameval *lookup(Nameval *treep, char\
  \ *name)\n{\n    int cmp;\n    if (treep == NULL)\n        return NULL;\n    cmp\
  \ = strcmp(name, treep->name);\n    if (cmp == 0)\n        return treep;\n    else\
  \ if (cmp < 0)\n    else\n        return lookup(treep->right, name);\n}\n```\n\n\
  关于 `lookup` 和 `insert` 有几点需要注意。首先，它们看起来与章节开头的二分搜索算法非常相似。这并非偶然，因为它们与二分搜索共享一个思想：分治法，这是对数性能的来源。\n\
  \n其次，这些例程是递归的。如果将它们重写为迭代算法，将与二分搜索更加相似。事实上，`lookup` 的迭代版本可以通过对递归版本应用转换来构建。除非找到了项目，否则\
  \ `lookup` 的最后一个动作是调用自身，这种情况被称为尾递归。最直接的方法是使用 `goto` 语句，但 `while` 循环更整洁：\n\n\n```c\n\
  /* nrlookup: 非递归地在 tre ep 中查找名称 */\nNameval *nrlookup(Nameval *treep, char *name)\n\
  {\n    int cmp;\n    while (treep != NULL) {\n        cmp = strcmp(name, treep->name);\n\
  \        if (cmp == 0)\n        else if (cmp < 0)\n            treep = treep->left;\n\
  \        else\n            treep = treep->right;\n    }\n    return NULL;\n}\n```\n\
  \n\n中序遍历是在访问左子树之后、访问右子树之前执行操作：\n\n点击此处查看代码图像\n\n```c\n/* applyinorder: 对 treep 进行中序应用\
  \ */\nvoid applyinorder(Nameval *treep,\n    void (*fn)(Nameval*, void*), void *arg)\n\
  \    if (treep == NULL)\n        return;\n    applyinorder(treep->left, fn, arg);\n\
  \    (*fn)(treep, arg);\n    applyinorder(treep->right, fn, arg);\n}\n```\n\n这种序列用于按排序顺序处理节点，例如按顺序打印所有节点，将如下：\n\
  点击此处查看代码图像\n\n\n\n\n\n```c\napplyinorder(treep, printnv, \"%s: %x\\n\");\n```\n\
  它还提供了一种合理的排序方法：将项插入树中，分配一个合适大小的数组，然后使用中序遍历将它们顺序存储在数组中。\n\n*后序*遍历在访问完子节点后，对当前节点执行操作：\n\
  \n点击此处查看代码图像\n\n```c\n/* applypostorder: 对 treep 采用后序应用函数 fn */\nvoid applypostorder(Nameval\
  \ *treep,\n{\n  if (treep == NULL)\n    return;\n  applypostorder(treep->left, fn,\
  \ arg);\n  applypostorder(treep->right, fn, arg);\n  (*fn)(treep, arg);\n}\n```\n\
  \n\n第三种选择*前序*遍历很少使用，因此我们将其省略。\n\n在现实中，二叉搜索树很少使用，尽管分支因子极高的 B 树被用于维护次级存储器信息。在日常编程中，树的一个常见用途是表示语句或表达式的结构。例如，语句\n\
  \n```c\nmid = (low + high) / 2;\n```\n\n\n![image](img/054fig01.jpg)\n\n我们将在第 9\
  \ 章中详细讨论解析树。\n\n**练习 2-11。** 比较 `lookup` 和 `nrlookup` 的性能。递归与迭代相比开销有多大？\n\n**练习\
  \ 2-12。** 使用中序遍历创建一个排序例程。它的时间复杂度是多少？在什么情况下表现可能不佳？它的性能与我们的快速排序以及库版本相比如何？\n\n\n##\
  \ 2.9 哈希表\n\n哈希表是计算机科学伟大的发明之一。它结合了数组、列表和数学数学，创建了一个高效存储和检索动态数据的结构。典型的应用是*符号表*，它将某些值（*数据*）与动态字符串集合的每个成员（*键*）关联。你喜爱的编译器几乎使用哈希表来管理程序中每个变量的信息。你的网络浏览器可能使用哈希表来跟踪最近使用的页面，而你的互联网连接可能使用哈希表来缓存最近使用的域名及其\
  \ IP 地址。\n\n其思想是将键通过*哈希函数*生成一个*哈希值*，该值将均匀分布在一个中等大小的整数范围内。哈希值用于索引存储信息的表。Java 提供了哈希表的标准接口。在\
  \ C 和 C++ 中，通常的风格是与每个哈希值（或“桶”）关联一个共享该哈值的项列表，如图所示：\n\n![image](img/055fig01.jpg)\n\
  \n\n由于哈希表是列表的数组，因此其元素类型与列表相同：\n\n点击此处查看代码图像\n\n```c\ntypedef struct Nameval Nameval;\n\
  struct Nameval {\n  char    *name;\n  Nameval *next;   /* 链 */\n};\nNameval *symtab[NHASH];\
  \ /* 符号表 */\n```\n\n我们在第 2.7 节中讨论过的列表技术可以用于维护各个链。一旦你有了良好的哈希函数，一切都会顺风顺利：只需选择哈希桶并顺着列表查找完美匹配项。以下是哈希表查找/插入的代码。如果找到了该项，则返回它。如果没有找到该项且设置了\
  \ `create` 标志，则 `lookup` 将该项添加到表中。同样，这不会创建名称的副本，假设调用者已经创建了安全的拷贝。\n\n点击此处查看代码图像\n\
  \n/* lookup: 在 symtab 中查找名称，可选 create */\nNameval* lookup(char *name, int create,\
  \ int value)\n{\n  int h;\n  Nameval *sym;\n  h = hash(name);\n  for (sym = symtab[h];\
  \ sym != NULL; sym = sym->next)\n    if (strcmp(name, sym->name) == 0)\n      return\
  \ sym;\n    sym = (Nameval *) emalloc(sizeof(Nameval));\n    sym->name = name; /*\
  \ 在其他假设 */\n    sym->value = value;\n    sym->next = symtab[h];\n    symtab[h] =\
  \ sym;\n  }\n  return sym;\n}\n```\n\n这种查找与可选插入的组合很常见。如果没有它，就会出现重复工作；必须编写\n\n点击此处查看代码图像\n\
  \n```c\nif (lookup(\"name\") == NULL)\n  additem(newitem(\"name\", value));\n```\n\
  \n并且计算两次哈希。\n\n数组应该有多大？通常的想法是让它大到使得每个哈希链最多只有几个元素，这样查找将是 *O*(1)。例如，编译器可能有一个几千大小的数组，因为大型源文件几千行，我们预计每行代码最多有一个标识符。\n\
  \n我们现在必须决定哈希函数 `hash` 计算什么。该函数必须是确定性的，并且快速并将数据均匀分布在数组中。字符串常用的哈希算法之一是将字符串的每个字节添加到当前哈值的倍数上构建哈希值。乘法将新字节位传播到当前值中；循环结束时，结果应该是输入字节的彻底混合。实验证明，31\
  \ 和 37 是作为 ASCII 字符串哈希函数乘数的良好选择。\n\n点击此处查看代码图像\n\n```c\nenum { MULTIPLIER = 31 };\n\
  /* hash: 计算字符串的哈希值 */\nunsigned int hash(char *str)\n{\n  unsigned int h;\n  unsigned\
  \ char *p;\n  h = 0;\n  for (p = (unsigned char *) str; *p != '\\0'; p++)\n    h\
  \ = MULTIPLIER * h + *p;\n  return h % NHASH;\n}\n```\n\n计算使用了无符号字符，是因为 `char` 是否有符号\
  \ C 和 C++ 均规定，且我们希望哈希值保持正数。\n\n\n\n\n实验表明，对于各种字符串，很难构造出一个比上述函数明显更好的哈希函数，但很容易构造出一个更差的函数。Java\
  \ 的早期版本有一个字符串哈希函数，如果字符串很长，它的效率更高。该哈希函数通过从开头开始，对超过 16 个字符的字符串以固定间隔仅检查 8 或 9 个字符来节省时间。遗憾的是，尽管该哈希函数更快，但它具有糟糕的统计特性，抵消了任何性能提升。通过跳过字符串的片段，它往往会错过唯一的区别部分。文件名以长相同的前缀（目录名）开头，可能仅在最后几个字符上不同（`.java`\
  \ 与 `.class`）。URL 通常以 `http://www.` 开头并以 `.html` ，因此它们往往只在中间不同。哈希函数经常只检查名称中不变的部分，导致长哈希链，减慢搜索速度。这个问题通过将哈希替换为与我们展示的等效函数（倍数为\
  \ 37）来解决，该函数会检查字符串的每一个字符。\n\n对于一个输入集（例如，短变量名）良好的哈希函数，对于另一个输入集（URL）可能是糟糕的，因此一个潜在的哈希函数应该在各种典型输入上进行测试。它对短字符串的处理好吗？长字符串呢？对有细微差异的等长度字符串呢？\n\
  \n字符串并不是我们唯一可以哈希的对象。我们可以对物理模拟中粒子的三个坐标进行哈希处理，将存储减少为线性表 `O(number of particles)`，而不是三维数组\
  \ `O(`xsize` × `ysize` × `zsize)`。\n\n哈希的一个显著用途是 Gerard Holzmann 用于分析协议和并发系统的 Supertrace\
  \ 程序。Supertrace 获取分析系统下每个可能状态的完整信息，并对这些信息进行哈希处理，以生成内存中单个位的地址。如果该位开启，则说明该状态之前出现过；如果没有，则没有。Supertrace\
  \ 使用一个几兆字节长的哈希表，但在每个桶中只存储一个位。它没有链法；如果两个状态通过哈希到相同值发生碰撞 `collide`，程序不会感知。Supertrace\
  \ 取决于碰撞概率很低（不需要为零，因为 Supertrace 是概率性的，而不是精确的）。因此，哈希函数特别小心；它使用 `cyclic redundancy\
  \ check`（循环冗余校验），这是一个产生数据彻底混合的函数。\n\n哈希表对于符号表是非常优秀的，因为它们提供了对任何元素的预期 `O(1)` 访问。它们确实有一些局限性。如果哈希函数很糟糕或表大小太小，列表可能会变长。由于列表是无序的，这将导致\
  \ `O(n)` 行为。无法直接按排序访问元素，但很容易对它们计数、分配一个数组、用指向元素的指针填充它并对该数组进行排序。尽管如此，当使用得当时，哈希表的常数查找、插入和删除属性是其他技术无法比拟的。\n\
  \n**练习 2-14.** 我们的哈希函数是字符串的一种极佳的通用哈希函数。尽管如此，特殊的数据可能会导致糟糕的行为。构造一个导致我们的哈希函数表现糟糕的数据集。对于不同的\
  \ `NHASH` 值，找到一个坏的集合是否更容易？\n\n**练习 2-15.** 写一个函数来以无序顺序访问哈希表的连续元素。\n\n**练习 2-16.**\
  \ 修改 `lookup`，使得如果平均列表长度超过 `x`，数组将按因子 `y` 自动增长并重建哈希表。\n\n**练习 2-17.** 设计一个用于存储 2\
  \ 维点坐标的哈希函数。你的函数适应坐标类型变化（例如，从整数到浮点数，或从笛卡尔坐标到极坐标，或从 2 维到更高维）有多容易？\n\n## 2.10 总结\n\
  \n选择算法有几个步骤。首先，评估潜在的算法和数据结构。考虑程序可能处理的数据量。如果问题涉及的数据不多，选择简单的技术；如果数据可能会增长，排除无法扩展到大型输入的设计。然后，如果可能，使用库或语言特性。如果不行，编写或借用短简单、易理解的实现。尝试一下。如果测量证明它太慢，这时才升级到更高级的技术。\n\
  \n尽管有很多数据结构（某些在特殊情况下对良好性能至关重要），但大多数程序主要基于数组、列表、树和哈希表。每种结构支持一组基本操作，通常包括：创建新元素、查找元素、在某处添加元素、可能删除元素，以及对所有元素应用某些操作。\n\
  \n每个操作都有预期的计算时间，这通常决定了该数据类型（或实现）对于特定应用的适用性。数组支持对任何元素的常数时间访问，但无法优雅地增长或缩小。列表很好适应插入和删除，但访问随机元素需要\
  \ `O(n)` 时间。树和哈希表提供了一个很好的折中：只要维持某些平衡标准，就可以快速访问特定项目并易于增长。\n\n对于特殊问题还有其他更复杂的数据结构，但这个基础集合足以构建绝大多数软件。\n\
  \n## 补充阅读\n\nBob Sedgewick 的 *Algorithms* 系列书籍（Addison-Wesley）是寻找各种实用算法易懂处理方法的极场所。《Algorithms\
  \ in C++》的第三版（1998）对哈希函数和表大小有很好的讨论。Don Knuth 的 *The Art of Computer Programming*（Addison-Wesley）是许多算法严谨分析的权威来源；第\
  \ 3 卷（第二版，1998）涵盖了排序和搜索。\n\nSupertrace 在 Gerard Holzmann 出版的 *Design and Validation\
  \ of Computer Protocols*（Prentice Hall, 1991）中描述。\n\nJon Bentley 和 Doug McIlroy\
  \ 在“Engineering a sort function”中描述了快速且健壮的快速排序的创建，发表于 *Software—Practice and Experience*，**23**,\
  \ 1, pp. 1249-1265, 1993。\n\n\n\n具体来说，我们将生成一段读起来良好的随机英文文本。如果我们输出随机字母或随机单词，结果将是毫无意义的。例如，一个随机选择字母（以及空格以分隔单词）的程序可能会产生如下内容：\n\
  \n点击此处查看代码图像\n\n```\nxptmxgn xusaja  afqnzgxl  lhidlwcd rjdjuvpydrlwnjy\n```\n\n\
  这看起来并不怎么有服力。如果我们根据字母在英文文本中出现的频率对其加权，我们可能会得到这个：\n\n点击此处查看代码图像\n\n```\nidtefoae tcs\
  \ trder jcii ofdslnqetacp t ola\n```\n\n但这看起来并没有好到哪里。从字典中随机选择单词也不会有太大意义：\n\n点击此处查看代码图像\n\
  \n```\npolydactyl equatorial splashily jowl verandah circumscribe\n```\n\n为了获得更好的效果，我们需要一个具有更多结构的统计模型，例如整个短语出现的频率。但我们在哪里能找到这些统计数据呢？\n\
  \n我们可以获取大量的英语语并进行详细研究，但有一种更简单、更有趣的方法。关键观察是，我们可以利用任何现有文本来构建一个*在该文本中所使用的*语言统计模型，并由此生成与原始文本具有相似统计数据的随机文本。\n\
  \n## 3.1. 马尔可夫链算法\n\n实现这种处理的一种优雅方法是称为*马尔可夫链算法*的技术。如果我们把输入想象为一系列重叠的短语，该算法将每个短语分为两个部分：一个多单词的*前缀*和一个紧跟在前缀后面的单个*后缀*单词。马尔可夫链算法根据（在本例中）原始文本的统计数据，随机选择跟随前缀的后缀来输出短语。三单词短语的效果很好——使用两个单词的前缀来选择后缀单词：\n\
  \n- 将 `w[1]` 和 `w[2]` 设置为文本中的两个单词\n- 打印 `w[1]` 和 `w[2]`\n- 循环：\n    - 随机选择 `w[3]`，它是文本中前缀\
  \ `w[1] w[2]` 的后继之一\n    - 打印 `w[3]`\n    - 将 `w[1]` 和 `w[2]` 替换为 `w[2]` 和 `w[3]`\n\
  \    - 重复循环\n\n为了说明，假设我们想根据上述引言改写后的几个句子来生成随机文本，并使用两个单词的前缀：\n\n点击此处查看代码图像\n\n```\n\
  Show your flowcharts and conceal your tables and I will be \nmystified.  Show your\
  \ tables and your flowcharts will be\nobvious.  (end)\n```\n\n这些是部分输入单词对以及紧随其后的单词：\n\
  \n![image](img/063tab01.jpg)\n\n马尔可夫算法处理这段文本将从打印 `Show your` 开始，然后随机选择 `flowcharts`\
  \ 或 `tables`。如果选择前者，当前的前缀将变为 `your flowcharts`，下一个单词将是 `and` 或 `will`。如果选择 `tables`，下一个单词将是\
  \ `and`。这种过程一直持续，直到生成了足够的输出，或者作为后缀遇到了结束标记。\n\n我们的程序将读取一段英文文本，并使用马尔可夫链算法根据固定长度短语出现的频率生成新文本。前缀中的单词数（在我们的示例中为二）是一个参数。使前缀变短往往产生连贯性较低的散文；使其变长则倾向于逐字复制输入文本。对于英文文本，使用两个单词选择第三个是一个很好的折中方案；它似乎恢复了输入的风味，同时增添了自身的奇幻色彩。\n\
  \n什么是单词？显而易见的答案是字母字符序列，但最好将标点保留在单词中，这样 `words` 和 `words.` 就是不同的。这有助于通过让标点符号（从而间接地影响了语法）影响单词选择来提高生成的散文质量，尽管这也会允许不平衡的引号和括号溜入。因此，我们将“单词”定义为空白之间的任何内容，这个决定对输入语言没有限制，并让标点保留在单词中。由于大多数编程语言都具有将文本拆分为空格分隔单词的功能，因此这也很实现。\n\
  \n由于这种方法，输出中的所有单词、所有双词短语和所有三词短语都必须出现在输入中，但应该会有许多四词及更长的短语。这里是海明威《太阳依然照升》的示例，为了运行速度。\n\
  \n## 3.2. 数据结构替代方案\n\n我们打算处理多少输入？程序必须运行多快？要求程序处理大小为 100,000 的输入似乎是合理的。输出将是数百或数千单词，程序应该在几秒钟内运行而不是几分钟。对于\
  \ 100,000 个单词的输入，n 相当大，因此算法不能太简单。\n\n马尔可夫算法在生成输出之前必须看到所有输入，它必须以某种形式存储整个输入。一种可能性是读取整个输入并将其存储在一个长字符串中，但我们显然希望输入拆分为单词。如果我们将其存储为指向单词的数组，输出生成非常简单：为了产生每个单词，扫描输入查看哪些单词跟随前缀，然后随机选择一个。然而，这意味着每生成一个单词都要扫描\
  \ 100,000 个输入单词；1,000 个输出单词意味着数亿次字符串比较，这不会很快。\n\n另一种可能性是只存储唯一的输入单词，连同它们在输入中的位置列表，以便我们更快地定位后继单词。可以使用类似于第二章](#ch02.html_ch02)\
  \ 中的哈希表，但该版本没有直接解决马尔可夫算法的需求，算法必须快速定位给定前缀的所有后缀。\n\n我们需要一种更好地表示前缀及其关联后缀的数据结构。程序将有两个阶段：一个构建表示短语的数据结构的输入阶段，另一个使用该数据结构生成随机输出的输出阶段。在两个阶段中，我们都需要查找前缀（快速）：在输入阶段中更新其后缀，在输出阶段中从可能的后缀中随机选择。这暗示了一个哈希表，其键为前缀，值为对应前缀的后缀集。\n\
  \n为了描述方便，我们将假设使用两个单词的前缀，因此每个输出单词都基于其之前的两个单词对。我们将前缀及其所有可能的后缀的集称为*状态*（state），这是马尔可夫算法的标准术语。\n\
  \n\n\n给定一个前缀，我们需要存储随其后的所有后缀，以便以后访问它们。这些后缀是无序的，并且逐个添加的。我们不知道会有多少个后缀，因此我们需要一种能够易扩展且高效增长的数据结构，例如列表或动态数组。在生成输出时，我们需要能够从与特定前缀相关的后缀集中随机选择一个后缀。条目永远不会被删除。\n\
  \n如果一个短语出现多次会怎样？例如，“might appear twice’（可能出现两次）可能会出现两次，但‘might appear once’（可能出现一次）只出现一次。这可以通过在‘might\
  \ appear’的后缀列表中放入两次‘twice’来表示，也可以只放入一次，并关联一个设置为 2 的计数器。我们尝试了带计数器和不带计数器的方法；不带计数器的更简单，因为添加后缀不需要检查它是否已经存在，而且实验表明运行时间上的差异微乎其微。\n\
  \n总结之，每个状态由一个前缀和一个后缀列表组成。这些信息存储在哈希表中，以前缀为键。每个前缀是一个固定大小的单词集合。如果某个后缀对于给定的前缀出现多次，则列表中将包含每一次出现的情况。\n\
  \n下一个决策是如何表示单词本身。一种简单的方法是将它们存储为独立的字符串。由于大多数文本有许多单词多次出现，如果我们维护一个存储单个单词的第二个哈希表，让每个单词的文本只存储一次，可能会节省存储空间。这也会加速前缀的哈希计算，因为我们可以比较指针而不是单个字符：唯一的字符串具有唯一的地址。我们将这一设计留作练习题；目前，字符串将被单独存储。\n\
  \n## 3.3 在 C 中构建数据结构\n\n让我们从 C 语言的实现开始。第一步是定义一些常量。\n\n点击此处查看代码图像\n\n```c\nenum {\n\
  \    NPREF   = 2,    /* 前缀单词数 */\n    NHASH   = 4093, /* 状态哈希表数组的大小 */\n    MAXGEN\
  \  = 10000 /* 生成的单词最大数量 */\n};\n```\n\n此声明定义了前缀的单词数（`NPREF`）、哈希表数组的大小（`NHASH`）以及生成单词数量的上限（`MAXGEN`）。如果\
  \ `NPREF` 是编译时常量而不是运行时变量，存储管理将更简单。数组大小设置得相当大，因为我们预计给程序提供大型输入文档，也许是一整本书。我们选择 `NHASH\
  \ = 4093` 是为了确保如果输入有 10,000 个不同的前缀（单词对），平均链长度将非常短，只有两个或三个前缀。尺寸越大，预期的链长度越短，查找速度越快。这个程序实际上是一个玩具，所以性能并不至关，但如果我们把数组做得太小，程序将无法在合理时间内处理我们预期的输入；另一方面，如果我们把它做得太大，它可能无法放入可用内存中。\n\
  \n前缀可以存储为单词数组。哈希表的元素将表示为 `State` 数据类型，将 `Suffix` 列表与前缀关联：\n\n点击此处查看代码图像\n\n```c\n\
  typedef struct State State;\ntypedef struct Suffix Suffix;\nstruct State {  /* 前缀\
  \ + 后缀列表 */\n    char    *pref[NPREF];   /* 前缀单词 */\n    Suffix  *suf;         \
  \  /* 后缀列表 */\n    State   *next;           /* 哈希表中的下一个节点 */\n};\nstruct Suffix\
  \ { /* 后缀列表 */\n    char    *word;           /* 后缀 */\n    Suffix  *next;      \
  \     /* 后缀列表中的下一个节点 */\n};\nState   *statetab[NHASH];   /* 哈希表 */\n```\n\n从图示上看，数据结构如下：![image](img/066fig01.jpg)\n\
  \n我们需要一个用于前缀的哈希函数，前缀是字符串数组。修改第 2 章中的字符串哈希函数](#ch02.html_ch02) 以遍历字符串（从而实际上实现字符串的拼接）是简单的：\n\
  \n点击此处查看代码图像\n\n```c\n/* hash: 为 NPREF 个字符串数组计算哈希值 */\nunsigned int hash(char *s[NPREF])\
  \ {\n    unsigned int h;\n    unsigned char *p;\n    int i;\n    h = 0;\n    for\
  \ (i = 0; i < NPREF; i++)\n        for (p = (unsigned char *) s[i]; *p != '\\0';\
  \ p++)\n            h = MULTLIER * h + *p;\n    return h % NHASH;\n}\n```\n\n对 `lookup`\
  \ 例程进行类似的修改即可完成哈希表的实现：\n\n点击此处查看代码图像\n\n```c\n/* lookup: 查找前缀；如果需要则创建。 */\n/* 如果存在或已创建则返回指针；不存在则返回\
  \ NULL。 */\n/* 创建时不使用 strdup，所以字符串以后不会改变。 */\nState* lookup(char *prefix[NPREF],\
  \ int create) {\n    int i, h;\n    State *sp;\n    h = hash(prefix);\n    for (sp\
  \ = statetab[h]; sp != NULL; sp = sp->next) {\n        for (i = 0; i < NPREF; i++)\n\
  \            if (strcmp(prefix[i], sp->pref[i]) != 0)\n                break;\n\
  \        if (i == NPREF)   /*找到了 */\n            return sp;\n    }\n    if (create)\
  \ {\n        sp = (State *) emalloc(sizeof(State));\n        for (i = 0; i < NPREF;\
  \ i++)\n            sp->pref[i] = prefix[i];\n        sp->suf = NULL;\n        sp->next\
  \ = statetab[h];\n        statetab[h] = sp;\n    }\n    return sp;\n}\n```\n\n注意\
  \ `lookup` 在创建项时不复制输入的字符串。`lookup` 的调用者必须保证字符串以后不会改变。例如，如果字符串在 I/O 缓冲区中，在调用 `lookup`\
  \ 之前必须复制；否则，后续输入可能会覆盖数据。\n\n接下来在读取文件时构建哈希表：\n\n点击此处查看代码图像\n\n```c\n/* build: 读取输入，构建表\
  \ */\nvoid build(char *prefix[NPREF], FILE *f) {\n    char buf[100], fmt[10];\n\
  \    /* 创建格式字符串；%s 可能会溢出 buf */\n    sprintf(fmt, \"%%%ds\", sizeof(buf)-1);\n \
  \   while (fscanf(f, fmt, buf) != EOF)\n        add(prefix, strdup(buf));\n}\n```\n\
  \n\n\n\n点击此处查看代码图像\n\n```c\n/* add: add word to suffix list, update prefix */\n\
  void add(char *prefix[NPREF], char *suffix)\n{\n    State *sp;\n    sp = lookup(prefix,\
  \ 1);  /* create if not found */\n    addsuffix(sp, suffix);\n    /* move the words\
  \ down the prefix */\n    memmove(prefix, prefix+1, (NPREF-1)*sizeof(prefix[0]));\n\
  \    prefix[NPREF-1] = suffix;\n}\n```\n\n对 `memmove` 的调用是从数组中删除元素的惯用法。它将 `prefix`\
  \ 中从索引 1 到 `NPREF-1` 的元素移动到位置 0 到 `NPREF-2`，从而删除了第一个前缀词，并为末尾的新词留出了空间。\n\n`addsuffix`\
  \ 例程添加了新的后缀：\n\n点击此处查看代码图像\n\n```c\n/* addsuffix: add to state. suffix must not\
  \ change later */\nvoid addsuffix(State *sp, char *suffix)\n{\n    Suffix *suf;\n\
  \    suf = (Suffix *) emalloc(sizeof(Suffix));\n    suf->word = suffix;\n    suf->next\
  \ = sp->suf;\n    sp->suf = suf;\n}\n```\n\n我们将更新状态的操作拆分为两个函数：`add` 执行向前缀添加后缀的通用服务，而\
  \ `addsuffix` 执行向后缀列表添加单词的特定于实现的操作。`add` 例程被 `build` 调用，但 `addsuffix` 仅在 `add` 内部被使用；它是一个可能会改变的实现细节，尽管它只被调用了一次，但将其放在单独的函数中似乎更好。\n\
  \n## 3.4 生成输出\n\n构建好数据结构后，下一步生成输出。基本思想与之前相同：给定一个前缀，随机选择其它的一个后缀并打印它，然后推进前缀。这是处理的稳态；我们仍然需要弄清楚如何启动和停止该算法。如果我们记住第一个前缀的词并从它们开始，启动是很容易的。停止也很容易。我们需要一个标记词来终止算法。在处理所有常规输入后，我们可以添加一个终止符，一个保证不会出现在任何输入中的“词”：\n\
  \n```c\nbuild(prefix, stdin);\nadd(prefix, NONWORD);\n```\n\n`NONWORD` 应该是某个在常规输入中永远不会遇到的值。由于输入单词是由空白字符分隔的，一个空白字符的“词”就可以用，例如换行符：\n\
  \n点击此处查看代码图像\n\n```c\nchar NONWORD[] = \"\\n\";  /* 不能作为真实词出现 */\n```\n\n另一个担心是：如果输入不足以启动算法怎么办？对于这类问题有两种方法，要么在输入不足时提前退出，要么安排始终有足够的输入且不去检查。在程序中，后者的方法效果良好。\n\
  \n我们可以使用一个伪造的前缀来初始化构建和生成，这保证了程序始终有足够的输入。为了引导循环，将前缀数组初始化为所有的 `NONWORD` 单词。这样做有一个很棒的好处：输入文件的第一个词将是虚假前缀的第一个*后缀*，因此生成循环只需要打印它产生的后缀。\n\
  \n如果输出过长到无法管理，我们可以在产生若干单词后或在遇到 `NONWORD` 后缀时终止算法，以较者为准。\n\n在数据末尾添加几个 `NONWORD` 可以显著简化程序的主处理循环；这是添加*哨兵*值来标记边界的技术示例。\n\
  \n原则上，尝试处理数据中的不规则、异常和特殊情况。代码很难写对，因此控制流应该尽可能简单和规则。\n\n`generate` 函数使用了我们最初勾勒的算法。它每行输出一个单词，可以使用文字处理器将其成更长的行；第\
  \ 9 章 显示了一个名为 `fmt` 的简单格式器用于此任务。\n\n通过使用初始和最终的 `NONWORD` 字符串，`generate` 可以正确地启动和停止：\n\
  \n点击此处查看代码图像\n\n```c\n/* generate: produce output, one word per line */\nvoid generate(int\
  \ nwords)\n{\n    State *sp;\n    Suffix *suf;\n    char *prefix[NPREF], *w;\n \
  \   int i, nmatch;\n    for (i = 0; i < NPREF; i++) /* reset prefix */\n       \
  \ prefix[i] = NONWORD;\n    for (i = 0; i < nwords; i++) {\n        sp = lookup(prefix,\
  \ 0);\n        nmatch = 0;\n        for (suf = sp->suf; suf != NULL; suf = suf->next)\n\
  \            if (rand() % ++nmatch == 0) /* prob = 1/nmatch */\n               \
  \ w = suf->word;\n                if (strcmp(w, NONWORD) == 0)\n               \
  \     break;\n                printf(\"%s\\n\", w);\n                memmove(prefix,\
  \ prefix+1, (NPREF-1)*sizeof(prefix[0]));\n                prefix[NPREF-1] = w;\n\
  \    }\n}\n```\n\n现在我们可以将所有内容放入一个 `main` 例程，它读取标准输入并生成指定数量的单词：\n\n点击此处查看代码图像\n\n\
  ```c\n/* markov main: markov-chain random generation */\nint main(void)\n{\n   \
  \ int i, nwords = MAXGEN;\n    char *prefix[NPREF]; /* 当前输入前缀\n    for (i = 0; i\
  \ < NPREF; i++) /* 设置初始前缀\n        prefix[i] = NONWORD;\n    build(prefix, stdin);\n\
  \    add(prefix, NONWORD);\n    generate(nwords);\n    return 0;\n}\n```\n\n这完成了我们的\
  \ C 实现。我们将在章节末回到不同语言程序的比较。C 的巨大优势是它赋予了程序员对实现的完全控制，用它编写的程序通常很快。然而，代价是 C 程序员必须做更多工作，分配和释放内存，创建哈希表和链表等。C\
  \ 是一把锋利的工具，用它可以创造优雅高效的程序，也可以制造一团乱麻。\n\n**练习 3-1.** 从未知长度的列表中随机选择项目的算法依赖于良好的随机数生成器。设计并进行实验，以确定该方法在实践中的效果如何。\n\
  \n\n\n\n\n**练习 3-2.** 如果将每个输入单词都存储在第二个哈希表中，那么文本只会被存储一次，这应该节省空间。测量一些文档以估算节省了多少空间。这种组织允许我们在哈希链中通过指针而不是字符串来比较前缀，这运行速度会更快。实现这个版本，并测量速度和内存消耗的变化。\n\
  \n**练习 3-3.** 移除那些在数据开头和结尾放置哨兵 `NONWORD` 的语句，并修改 `generate` 函数使其在没有哨兵的情况下也能正确地开始和停止。确保对于包含\
  \ 0、1、2、3 和 4 个单词的入的输入，它都能产生正确的输出。将此实现版本与使用哨兵的版本进行比较。\n\n## 3.5. Java\n\n我们对马尔可夫链算法的第二次实现是用\
  \ Java 编写的。像 Java 这样面向对象的语言鼓励人们特别关注程序组件之间的接口，这些接口被封装为独立的数据项，称为对象或类，并带有相关的函数称为方法。\n\
  \nJava 拥有比 C 语言丰富的库，包括一组`容器类`（container classes），用于以各种方式对现有对象进行分组。一个例子是 `Vector`，它提供了一个可以动态增长的数组，可以存储任何\
  \ `Object` 类型。另一个例子是 `Hashtable` 类，可以使用另一种类型的对象作为键来存储和检索另一种类型的值。\n\n在我们的应用程序中，字符串的\
  \ `Vector` 是存放前缀和后缀的自然选择。我们可以使用 `Hashtable`，其键为前缀向量，值为后缀向量。这种构造的术语是从前缀到后缀的 `map`（映射）；在\
  \ Java 中，我们不需要显式的 `State` 类型，因为 `Hashtable` 隐式地连接（映射）了前缀和后缀。这种设计与 C 版本不同，在 C 版本中，我们建立了同时包含前缀和后缀列表的\
  \ `State` 结构，并对前缀进行哈希以恢复完整的 `State`。\n\n`Hashtable` 提供了一个 `put` 方法来存储键值对，以及一个 `get`\
  \ 方法根据键检索值：\n\n点击此处查看代码图像\n\n```java\nHashtable h = new Hashtable();\nh.put(key,\
  \ value);\nSometype v = (Sometype) h.get(key);\n```\n\n我们的实现包含三个类。第一个类 `Prefix`\
  \ 持有前缀的单词：\n\n点击此处查看代码图像\n\n```java\nclass Prefix {\n    public Vector pref; //\
  \ 输入中 NPREF 个相邻的单词\n    ...\n}\n```\n\n第二个类 `Chain` 用于读取输入、构建哈希表并生成输出；以下是它的类变量：\n\
  \n点击此处查看代码图像\n\n```java\nclass Chain {\n    static final int NPREF = 2; // 前缀的大小\n\
  \    static final String NONWORD = \"\\n\"; // 不得出现的“单词”\n    Hashtable statetab\
  \ = new Hashtable(); // key = Prefix, value = suffix Vector\n    Prefix prefix =\
  \ new Prefix(NPREF, NONWORD); // 初始前缀\n    Random rand = new Random();\n    ...\n\
  }\n```\n\n第三个类是公共接口；它持有 `main` 方法并实例化一个 `Chain`：\n\n点击此处查看代码图像\n\n```java\nclass\
  \ Markov {\n    static final int MAXGEN = 10000; // 最大生成的单词\n    public static void\
  \ main(String[] args) throws IOException\n    {\n        Chain chain = new Chain();\n\
  \        int nwords = MAXGEN;\n        chain.build(System.in);\n        chain.generate(nwords);\n\
  \    }\n}\n```\n\n当创建 `Chain` 类的实例时，它会转而创建一个哈希表并设置 `NPREF` 个 `NONWORD` 的初始前缀。`build`\
  \ 函数使用库函数 `StreamTokenizer` 将输入解析为由空白字符分隔的单词。循环之前的三个调用将分词器设置为处理“单词”的正确状态。\n\n点击此处查看代码图像\n\
  \n```java\n// Chain build: 从输入构建表\nvoid build(InputStream in) throws IOException\n\
  {\n    StreamTokenizer st = new StreamTokenizer(in);\n    st.reset(); // 移除默认规则\n\
  \    st.wordChars(0, Character.MAX_VALUE); // 开启字符支持\n    st.whitespaceChars(0,\
  \ ' '); // 除空格\n    while (st.nextToken() != st.TT_EOF)\n    {\n        add(st.val);\n\
  \        add(NONWORD);\n    }\n}\n```\n\n`add` 函数从哈希表中检索当前前缀的后缀向量；如果没有（向量为 null），则\
  \ `add` 会创建一个新向量和一个新前缀存储在哈希表中。无论何种情况，它都会将新单词添加到后缀向量中，通过丢弃第一个单词并在末尾添加新单词来推进前缀。\n\n\
  点击此处查看代码图像\n\n```java\n// Chain add: 将单词添加到后缀列表，更新前缀\nvoid add(String word)\n{\n\
  \    Vector suf = statetab.get(prefix);\n    if (suf == null) {\n        suf = new\
  \ Vector();\n        statetab.put(new Prefix(prefix), suf);\n    }\n    suf.addElement(word);\n\
  \    prefix.pref.removeElementAt(0);\n    prefix.pref.addElement(word);\n}\n```\n\
  \n注意，如果 `suf` 为 null，`add` 会在哈希表中安装一个新的 `Prefix`，而不是 `prefix` 本身。这是因为 `Hashtable`\
  \ 类通过引用存储项，如果我们不进行复制，可能会覆盖表中的数据。这是我们在 C 程序中必须处理的相同问题。\n\n生成函数与 C 版本相似，但稍微紧凑，因为它可以索引随机向量元素，而不是遍历列表。\n\
  \n点击此处查看代码图像\n\n```java\n// Chain generate: 生成输出单词\nvoid generate(int nwords)\n\
  {\n    prefix = new Prefix(NPREF, NONWORD);\n    for (int i = 0; i < nwords; i++)\
  \ {\n        Vector s = statetab.get(prefix);\n        int r = Math.abs(rand.nextInt())\
  \ % s.size();\n        String suf = (String) s.elementAt(r);\n        if (suf.equals(NONWORD))\n\
  \            break;\n        System.out.println(suf);\n        prefix.pref.removeElementAt(0);\n\
  \        prefix.pref.addElement(suf);\n    }\n}\n```\n\n`Prefix` 的两个构造函数从提供的数据创建新实例。第一个复制现有的\
  \ `Prefix`，第二个从 `n` 个字符串的拷贝创建前缀；我们在初始化时用它创建 `NPREF` 个 `NONWORD`：\n\n点击此处查看代码图像\n\
  \n```java\n// Prefix constructor: 复制前缀\nPrefix(Prefix p)\n{\n    pref = (Vector)\
  \ p.pref.clone();\n}\n\n// Prefix constructor: str 的 n 次拷贝\nPrefix(int n, String\
  \ str)\n{\n    pref = new Vector();\n    for (int i = 0; i < n; i++)\n        pref.addElement(str);\n\
  }\n```\n\n`Prefix` 还有两个方法 `hashCode` 和 `equals`，这两个方法被 `Hashtable` 的实现隐式调用，用于索引和搜索表。正是为了让\
  \ `Hashtable` 拥有这两个方法，迫使我们让 `Prefix` 成为一个类，而不是像后缀那样仅仅是一个 `Vector`。\n\n`hashCode`\
  \ 方法通过结合向量元素集合的 `hashCode` 值来构建单个哈希值：\n\n点击此处查看代码图像\n\n```java\nstatic final int\
  \ MULTIPLIER = 31; // 用于 hashCode\n// Prefix hashCode: 从所有前缀单词生成哈希\npublic int hashCode()\n\
  {\n    int h = 0;\n    for (int i = 0; i < pref.size(); i++)\n        h = MULTIPLIER\
  \ * h + pref.elementAt(i).hashCode();\n    return h;\n}\n```\n\n\n\n\n且 `equals`\
  \ 对两个前缀中的单词进行逐个元素的比较：\n\n点击此处查看代码图片\n\n```java\n// Prefix equals: compare two prefixes\
  \ for equal words\npublic boolean equals(Object o)\n{\n    Prefix p = (Prefix) o;\n\
  \    for (int i = 0; i < pref.size(); i++)\n        if (!pref.elementAt(i).equals(p.pref.elementAt(i)))\n\
  \            return false;\n    return true;\n}\n```\n\nJava 程序比 C 语言程序短得多，并且处理了更多细节；`Vector`\
  \ 和 `Hashtable` 就是显而易见的例子。总的来说，存储管理是简单的，因为向量会根据需要增长，而且垃圾回收会处理不再被引用的内存。但要使用 `Hashtable`\
  \ 类，我们仍然需要编写 `hashCode` 和 `equals` 函数，因此 Java 并没有处理所有的细节。\n\n比较 C 程序和 Java 程序表示和操作相同基本数据结构的方式，我们发现\
  \ Java 版本具有更好的功能分离。例如，从 `Vector` 切换到数组会非常容易。在 C 版本中，万物都知道其他事物在做什么：哈希表在维护在各个处的数组上操作，`lookup`\
  \ 知道 `State` 和 `Suffix` 结构的布局，每个人都知道前缀数组的大小。\n\n点击此处查看代码图片\n\n```text\n% java Markov\
  \ <jr_chemistry.txt | fmt\nWash the blackboard. Watch it dry. The water goes\ninto\
  \ the air. When water goes into the air it\nevaporates. Tie a damp cloth to one\
  \ end of a solid or\nliquid. Look around. What are the solid things?\nChemical changes\
  \ take place when something burns. If\nthe burning material has liquids, they are\
  \ stable and\nthe sponge rise. It looked like dough, but it is\nburning. Break up\
  \ the lump of sugar into small pieces\nand put them together again in the bottom\
  \ of a liquid.\n```\n\n**练习 3-4。** 修改 `markov` 的 Java 版本，在 `State` 类中使用数组代替 `Vector`\
  \ 来存储前缀。\n\n## 3.6 C++\n\n我们的第三次实现是使用 C++ 的。由于 C++ 几乎是 C 的超集，它可以像 C 一样被使用，只需一些符号上的便利，而且我们原始的\
  \ C 版本的 `markov` 也是一个合法的 C++ 程序。然而，C++ 更合适的用法是为程序中的对象定义类，某种程度上类似于我们在 Java 中做的那样；这让我们能够隐藏实现细节。我们决定更进一步，使用标准模板库（STL），因为\
  \ STL 内置的机制可以完成我们所需的大部分工作。C++ 的 ISO 标准将 STL 包含语言定义的一部分。\n\nSTL 提供了如 `vector`、`list`\
  \ 和 `set` 等容器，以及一组用于搜索、排序、插入和删除的基础算法。使用 C++ 的模板特征，每个 STL 算法都可以在各种容器上运行，包括用户定义类型和整数等内置类型。容器以\
  \ C++ 模板的形式表示，并为特定的数据类型实例化；例如，有一个 `vector` 容器可以用于创建特定类型，如 `vector<int>` 或 `vector<string>`。所有\
  \ `vector` 操作（包括用于排序的标准算法）都可以用于此类数据类型上。\n\n除了与 Java 的 `Vector` 相似的 `vector` 容器外，STL\
  \ 还提供了 `deque` 容器。`deque`（读音为“deck”）是一个双端队列，符合我们处理前缀的方式：它持有 `NPREF` 个元素，并允许我们弹出第一个元素并在末尾添加新元素，两者的操作均为\
  \ `O(1)`。STL 的 `deque` 比我们需要的通用，因为它允许在两端进行推入弹出，但其性能保证使其成为显而易见的选择。\n\nSTL 还提供了基于平衡树的显式\
  \ `map` 容器，它存储键值对并提供对任何键关联值的 `O(log n)` 检索。Map 的效率可能不如 `O(1)` 的哈希表，但不需要为了使用它们而编写任何代码是一件很棒的事。（某些非标准\
  \ C++ 包含了 `hash` 或 `hash_map` 容器，其性能可能更好。）我们使用了内置的比较函数，在这种情况下，将使用单个字符串进行字符串比较。\n\
  \n有了这些组件，代码就组合在一起了。以下是声明：\n\n点击此处查看代码图片\n\n```cpp\ntypedef<string> Prefix;\nmap<Prefix,\
  \ vector<string> > statab; // prefix -> suffixes\n```\n\nSTL 为 `deque` 提供了一个模板；`deque<string>`\
  \ 符号将其特化为元素为字符串的 `deque`。由于这种类型在程序中出现了多次，我们使用 `typedef` 给它命名为 `Prefix`。存储前缀和后缀的\
  \ `map` 类型只出现一次，所以我们没有给它单独的名称；`map` 声明了一个变量 `statab`，它是一个从前缀到字符串的 map。这比 C 或 Java\
  \ 都方便，因为我们不需要提供 `hash` 函数或 `equals` 方法。\n\n`main` 程序程初始化前缀，读取输入（来自标准输入，在 `iostream`\
  \ 库中称为 `cin`），添加尾部并生成输出，与之前的版本完全一致：\n\n点击此处查看代码图片\n\n```cpp\n// markov main: markov-chain\
  \ random generation\nint main(void)\n{\n    int nwords = MAXGEN;\n    Prefix prefix;\
  \ // current input\n    for (int i = 0; i < NPREF; i++) // set initial prefix\n\
  \        add(prefix, NONWORD);\n    build(prefix, cin);\n    add(prefix, NONWORD);\n\
  \    generate(nwords);\n    return 0;\n}\n```\n\n`build` 函数使用 `iostream` 库一次一个单词地读取输入：\n\
  \n点击此处查看代码图片\n\n```cpp\n// build: read input words, build state table\nvoid build(Prefix&\
  \ prefix, istream& in)\n{\n    string buf;\n    while (in >> buf)\n        add(prefix,\
  \ buf);\n}\n```\n\n字符串 `buf` 将根据需要增长，以处理任意长度的输入单词。\n\n`add` 函数展示了使用 STL 的更多优势：\n\
  \n点击此处查看代码图片\n\n```cpp\n// add: add word to suffix list, update prefix\nvoid add(Prefix&\
  \ prefix, const string& s)\n{\n    if (prefix.size() == NPREF) {\n        statab[prefix].push_back(s);\n\
  \        prefix.pop_front();\n    }\n    prefix.push_back(s);\n}\n```\n\n在这些简单的语句背后有很多大量操作。`map`\
  \ 容器重载了下标运算符（`[]`），使其行为像一个查找操作。表达式 `statab[prefix]` 以 `prefix` 为键在 `statab` 中进行查找并返回所需条目的引用；如果它不存在，则创建它。`vector`\
  \ 和 `deque` 的 `push_back` 成员函数将新字符串推入 vector 或 deque 的末端；`pop_front` 从 deque 中弹出第一个元素。\n\
  \n生成过程与之前的版本相似：\n\n点击此处查看代码图片\n\n```cpp\n// generate: produce output, one word line\n\
  void generate(int nwords)\n{\n    Prefix prefix;\n    int i;\n    for (i = 0; i\
  \ < NPREF; i++) // reset initial prefix\n        add(prefix, NONWORD);\n    for\
  \ (i = 0; i < nwords; i++) {\n        vector<string>& suf = statab[prefix];\n  \
  \      const string& w = suf[rand() % suf.size()];\n        if (w == NONWORD)\n\
  \            break;\n        cout << w << \"\\n\";\n        prefix.pop_front();\
  \ // advance\n        prefix.push_back(w);\n    }\n}\n```\n\n\n\n```\n}\n}\n```\n\
  \n总的来说，这个版本看起来特别清晰且优雅——代码紧凑，数据结构可见，且算法完全透明。遗憾的是，这是需要代价的：这个版本的运行速度比原始 C 版本要慢得多，尽管它不是最的。我们很快会回到性能测量。\n\
  \n**练习 3-5。** STL 的强大之处在于人们可以方便地尝试不同的数据结构。修改 Markov 的 C++ 版本，使用各种结构来表示前缀、后缀列表和状态表。对于不同的结构，性能发生了怎样的变化？\n\
  \n**练习 3-6。** 编写一个纯 C++ 版本，只使用类和 `string` 数据类型，而不使用任何其他高级库功能。在风格和速度上与 STL 版本进行比较。\n\
  \n## 3.7 Awk 和 Perl\n\n为了完成这项练习，我们还用两种流行的脚本语言 Awk 和 Perl 编写了程序。这些语言为该应用程序提供了必要的特性：关联数组和字符串处理。\n\
  \n*关联数组*（associative array）是哈希表的一种方便封装；它看起来像一个数组，但其下标是任意字符串或数字，或者是它们的逗号分隔列表。它是从一种数据类型到另一种数据类型的映射形式。在\
  \ Awk 中，所有数组都是关联数组；Perl 则既有带有整数下标的传统索引数组，也有关联数组，被称为“哈希”（hashes），这个名字暗示了它们的实现方式。\n\
  \nAwk 和 Perl 的实现针对长度为 2 的前缀进行了优化。\n\n点击此处查看代码\n\n```awk\n# markov.awk: 用于 2 字前缀的马尔可夫链算法\n\
  BEGIN { MAXGEN = 10000; NONWORD = \"\\n\"; w1 = w2 = NONWORD }\n{\n  for (i = 1;\
  \ i <= NF; i++) {      # 读取所有单词\n        statetab[w1,w2,++nsuffix[w1,w2]] = $i\n\
  \        w1 = w2\n        w2 = $i\n  }\n}\nEND {\n    statetab[w1,w2,++nsuffix[w1,w2]]\
  \ = NONWORD  # 添加尾部\n    w1 = w2 = NONWORD\n    for (i = 0; i < MAXGEN; i++) { \
  \ # 生成\n        r = int(rand()*nsuffix[w1,w2]) + 1  # nsuffix >= 1\n        p =\
  \ statetab[w1,w2,r]\n        if (p == NONWORD)\n            exit\n        print\
  \ p\n        w1 = w2            # 推进链\n        w2 = p\n    }\n}\n```\n\nAwk 是一种模式-动作语言：输入逐行读取，每行都与模式进行匹配，并对每个匹配项执行相应的动作。有两个特殊的模式\
  \ `BEGIN` 和 `END`，它们分别在第一行输入之前和最后一行之后匹配。\n\n动作是一个用大括号括起来的语句块。在 Markov 的 Awk 版本中，`BEGIN`\
  \ 块初始化了前缀和其他几个变量。\n\n下一个块没有模式，因此默认对每行输入执行一次。Awk 自动将每行输入拆分为字段（由空白分隔的单词），称为 `$1` 到\
  \ `$NF`；变量 `NF` 是字段的数量。语句\n\n点击此处查看代码\n\n```awk\nstatetab[w1,w2,++nsuffix[w1,w2]]\
  \ = $i\n```\n\n构建了从前缀到后缀的映射。数组 `nsuffix` 计算后缀，元素 `nsuffix[w1,w2]` 统计与该前缀相关的后缀数量。后缀存储在数组元素\
  \ `statetab[w1,w2,1]`、`statetab[w1,w2,2]` 等中。当执行 `END` 块时，所有输入都已读取完毕。此时，对于每个前缀，`nsuffix`\
  \ 中都有一个元素包含计数，并且有相应数量的 `statetab` 元素包含后缀。\n\nPerl 版本类似，但它使用匿名数组而不是第三下标来跟踪后缀；它使用多赋值来更新前缀。Perl\
  \ 使用特殊字符来指示变量类型：`$` 标记标量，`@` 标记索引数组，而括号 `[]` 用于索引数组，大括号 `{}` 用于索引哈希。\n\n点击此处查看代码\n\
  \n```perl\n# markov.pl: 用于 2 字前缀的马尔可夫链算法\n$MAXGEN = 10000;\n$NONWORD = \"\\n\";\n\
  $w1 = $w2 = $NONWORD;  #初始状态\nwhile (<>) {          # 读取每行输入\n  foreach (split)\
  \ {\n    push(@{$statetab[$w1][$w2]}, $_);\n    ($w1, $w2) = ($w2, $_); # 多赋值\n\
  \  }\n}\npush(@{$statetab[$w1][$w2]}, $NONWORD); # 添加尾部\n$w1 = $w2 = $NONWORD;\n\
  for ($i = 0; $i < $MAXGEN; $i++) {\n    $suf = $statetab[$w1][$w2}; # 数组引用\n   \
  \ $r = int(rand @$suf);  # @$suf 是数量\n    exit if (($t = $suf[$r]) eq $NONWORD);\n\
  \    print \"$t\\n\";\n    ($w1, $w2) = ($w2, $t); # 推进链\n}\n```\n\nAwk 是一种模式-动作语言：输入逐行读取，每行都与模式进行匹配，并对每个匹配项执行相应的动作。有两个特殊的模式\
  \ `BEGIN` 和 `END`，它们分别在第一行输入之前和最后一行之后匹配。\n\n与前面的程序一样，映射存储在变量 `statetab` 中。虽然 Perl\
  \ 和 Awk 程序相比之前的三个版本要短，但它们更难适应非两个单词的前缀。C++ STL 实现的核心（`add` 和 `generate` 函数）长度相当且看起来更清晰。尽管如此，脚本语言通常是实验性编程、原型制作的好选择，甚至可以用于生产环境（如果\
  \ run-time 不是主要问题的话）。\n\n**练习 3-7。** 修改 Awk 和 Perl 版本以处理任意长度的前缀。实验这种变化对性能产生什么影响。\n\
  \n## 3.8 性能\n\n我们有几个实现需要进行比较。我们在《钦定圣经》的诗篇上对程序进行了计时，该书有 42685 个单词（5238 个不同单词，22482\
  \ 个前缀）。该文本有足够的重复短语（“幸运的人……”），以至于一个后缀列表包含 400 个元素，并且几条链带有几十个后缀，因此是一个很好的测试数据集。\n\n\
  下表中的时间是生成 10000 个输出所需的秒数；一台机器是运行 Irix 6.4 的 250MHz MIPS R1000，另一台是运行 Windows NT\
  \ 的拥有 128 兆内存的 400MHz Pentium II。运行时间几乎完全输入大小；相比之下，生成速度非常快。该表还包含了程序的大致源代码行数。\n\n\
  ![image](img/081tab01.jpg)\n\nC 和 C++ 版本使用了优化编译器编译，而 Java 运行开启了即时编译器。Irix 上的 C 和\
  \ C++ 时间是从三种不同编译器中获得的最快；在 Sun SPARC 和 DEC Alpha 机器上也观察到了类似的结论。C 版本的程序快得多；Perl 次之。然而，表中的时间是我们在特定编译器和库上经验的快照，因此在你的环境中可能会看到完全不同的结果。\n\
  \n\n\n\nWindows 上的 STL `deque` 版本明显存在问题。实验表明，代表前缀的 `deque` 占据了大部分运行时间，尽管它包含的元素从未多于两个；我们本以为核心数据结构\
  \ `map` 应该占据主导。将 `deque` 切换到 `list`（STL 中的双向链表）极大地提高了运行速度。另一方面，将 `map` 切换到（非标准的）`hash`\
  \ 容器在 Irix 上并没有区别；因为在我们的 Windows 机器上无法使用 `hash`。这恰恰证明了 STL 设计在根本上的稳健性：这些更改只需要在两个地方将单词\
  \ `list` 替换为 `deque` 或将 `hash` 替换为 `map` 并重新编译即可。我们得结论是，STL 作为 C++ 的一个新组件，仍受困于实现不成熟的问题。在不同的\
  \ STL 实现之间、以及在各个数据结构之间，其性能是不可预测的。Java 也是如此，其实现也在快速变化。\n\n在测试一个旨在产生大量随机输出的程序时，存在一些有趣的挑战。我们如何知道它是有效的？我们如何知道它是一直都有效的？第\
  \ 6 章 讨论了测试，包含了一些建议并描述了我们如何测试这些马链 程序。\n\n### 3.9. 训训\n\n马链程序有很久的历史。第一个版本由 Don P.\
  \ Mitchell 编写，由 Bruce Ellis 改编，并应用于 20 世纪 80 年代的各种幽默解构主义活动。它一直处于休眠状态直到直到我们将其用于大学课程，作为程序设计的示例。我们没有翻出原版，而是用\
  \ C 语言从头重写了它，以刷新我们对出现各种问题的记忆，然后用其他几种语言又写了一遍，使用每种语言独特的惯用法来表达相同的基本思想。课程结束后，我们对程序进行了多次修改，以提高清晰度和呈现效果。\n\
  \n然而，在这一整段时间里，基本设计保持不变。最早的版本使用的方法与我们在这里介绍的相同，尽管它确实使用了第二个哈希表来表示单个单词。如果我们再次重写它，可能不会做太大改变。程序的设计根植于其数据的布局。数据结构并没有定义每一个细节，但它们确实塑造了整个解决方案。\n\
  \n某些数据结构的选择区别很小，例如列表与可增长数组。某些实现比其他更具通用性——Perl 和 Awk 代码可以很容易地修改为单单词或三单词前缀，但对这种选择进行参数化会很笨拙。正如对象语言的特性，对\
  \ C++ 和 Java 实现进行微小的调整就能使数据结构适用于英语文本以外的其他对象，例如程序（其中空格具有重要意义）、音乐谱，甚至是用于生成测试序列的鼠标点击和菜单选择。\n\
  \n当然，虽然数据结构大相同，但在程序的整体外观、源代码的大小以及性能方面存在巨大差异。粗略来说，高层语言的程序比低层语言的程序慢，尽管在定性分析之外进行其他方面的概括是不明智的。像\
  \ C++ STL 或脚本语言的关联数组和字符串处理这样的大型构建块，可以带来更紧凑的代码和更短的开发时间。这些并不是没有代价的，尽管对于像 Markov 这样只运行几秒钟的程序来说，性能损失可能并不重要。\n\
  \n然而，不太清楚的是，当系统提供的代码堆变得大到人们不再知道底层发生了什么时，该如何评估控制力和洞察力的丧失。STL 版本就是这种情况；它的性能不可预测，而且没有简单的方法来解决这个问题。我们使用的一个不成熟的实现在运行我们的程序之前需要进行修复。我们很少有人有资源或精力去追踪并修复此类问题。\n\
  \n这是软件中一个普遍且日益增长的担忧：随着库、接口和工具变得越来越复杂，它们变得越来越难以理解和难以控制。当一切运行正常时，丰富的编程环境可以非常高效；但当它们失败时，就无能为力。事实上，如果问题涉及性能或微妙的逻辑错误，我们可能甚至意识不到出了问题。\n\
  \n这个程序的设计和实现说明了针对大型程序的若干教训。首先是选择简单算法和数据结构的重要性，即对于预期的问题规模，能在合理时间内完成任务的最简单方案。如果别人已经写好了它们并把它们放入库中，那就更好了；我们的\
  \ C++ 实现就受益于此。\n\n遵循布鲁克斯（Brooks）的建议，我们认为在算法知识的指导下，从数据结构开始详细设计是最好的；一旦结构确定，代码很容易组合在一起。\n\
  \n完全设计好一个程序然后构建它是困难的；构建真实的程序涉及迭代和实验。构建的行为迫使人们澄清之前被忽略的决策。我们这里的程序诚然如此，它们经历了许多细节上的变化。尽可能从简单的东西开始，并随着经验推演进行演变。如果我们的目标只是为了好玩写一个个人版本的马链算法，我们几乎肯定会用\
  \ Awk 或 Perl 编写——尽管没有像我们展示的这些那样精炼——然后就此罢。\n\n然而，生产代码比原型花费要多得多。如果我们把这里介绍的程序视为生产级代码（因为它们经过了精炼和彻底测试），生产级质量所需的精力比个人使用的程序要多出一两个数量级。\n\
  \n**练习 3-8。** 我们已经见过各种语言的马链程序版本，包括 Scheme、Tcl、Prolog、Python、Generic Java、ML 和 Haskell；每种语言都有自己的挑战和优势。用你喜欢的语言实现该程序，并比较其通用风格和性能。\n\
  \n## 扩展阅读\n\n许多书籍描述了标准模板库，包括 Matthew Austern 的 *Generic Programming and the STL*。关于\
  \ C++ 本身的权威参考是 Bjarne Stroustrup 写的 *The C++ Programming Language*。对于 Java，我们参考\
  \ Ken Arnold 和 James Gosling 写的 *The Java Programming Language, 2nd Edition*。对 Perl\
  \ 的最佳描述是 Larry Wall、Tom Christiansen 和 Randal Schwartz 写的 *Programming Perl, 2nd\
  \ Edition*。\n\n设计模式背后的想法是，就像只有基本数据结构一样，大多数程序中只有几种独特的设计构建模式；粗略地说，它是我们在第 1 章 中讨论的代码习惯在设计上的类比。标准参考是\
  \ Erich Gamma、Richard Helm、Ralph Johnson 和 John Vlissides 写的 *Design Patterns: Elements\
  \ of Reusable Object-Oriented Software*。\n\n`markov` 程序（最初名为 `shaney`）的奇幻历险描述在 1989\
  \ 年 6 月份的《美国人》的“计算娱乐”专栏中。该文章曾发表在 A. K. Dewdney 写的 *The Magic Machine*（W. H. Freeman,\
  \ 1990）中。\n\n\n\n\n设计的本质是平衡竞争性的目标和约束。尽管在编写一个小型自包含的系统时，可能存在许多权衡，但特定选择的影响仍局限于系统内部，仅影响个人程序员。但当代码要供他人使用时，决策就会产生更广泛的影响。\n\
  \n设计中需要解决的问题包括：\n\n*   **接口 (Interfaces)**：提供了哪些服务和访问权限？接口实质上是供应商与客户之间的合同。其目标是提供统一且方便的服务，具备足够的功能以便于使用，但又不至于变得臃肿不堪。\n\
  *   **信息隐藏 (Information hiding)**：哪些信息是可见的，哪些是私有的？接口必须为组件提供直接的访问，同时隐藏实现细节，以便在不影响用户的情况下进行更改。\n\
  *   **资源管理 (Resource management)**：谁负责管理内存和其他限制资源？在这里，主要问题是存储的分配与释放，以及共享拷贝的管理。\n\
  *   **错误处理 (Error handling)**：谁来检测错误，谁来报告错误以及如何报告？检测到错误时，尝试什么样的恢复？\n\n在第 2 章中，我们查看了构建系统所需的各个部分——数据结构。在第\
  \ 3 章中，我们研究了如何将这些组合成一个小型程序。现在话题转向了可能来自不同来源的组件接口。在本章中，我们将通过为常见任务构建一个函数和数据结构库来演示接口设计。在此过程中，我们将介绍一些设计原则。通常有大量的决策需要做出，但大多数几乎是在无意识的情况下完成的。如果没有这些原则，结果往往是那种杂乱无章的接口，每天都会挫败并阻碍程序员。\n\
  \n## 4.1. 逗号分隔值\n\n`逗号分隔值（Comma-separated values，或 `CSV`` 是表格数据的一种自然且广泛使用的表示方法。表格的每一行都是一行文本；每行的每个字段由逗号分隔。前一章末尾的表格可以用如下\
  \ CSV 格式开头：\n\n点击此处查看代码图像\n\n```\n    ,\"250MHz\",\"400MHz\",\"Lines of\"\n    ,\"\
  R10000\",\"Pentium II\",\"source code\"\n    C,0.36 sec,0.30 sec,150\n    Java,4.9,9.2,105\n\
  ```\n\n这种格式由电子表格等程序进行读写；并非巧合的是，它也出现在股票报价等服务的网页上。一个流行的股票报价网页显示如下：\n\n![image](img/086tab01.jpg)\n\
  \n下载电子表格格式\n\n通过与网络浏览器交互来获取数字是有效的，但很耗时。调用浏览器、等待、观看如接踵而来的广告、输入股票列表、等待、等待、等待，然后看另一波广告，仅仅为了获取几个数字，这是一种困扰。要进一步处理这些数字需要更多的交互；点击“下载电子表格格式”链接可以获取一个包含许多相同信息的文件，内容如下\
  \ CSV 数据行（为了适应性而进行了编辑）：\n\n点击此处查看代码图像\n\n```\n    \"LU\",86.25,\"11/4/1998\",\"\
  2:19PM\",+4.0625,\n               83.9375,86.875,83.625,5804800\n    \"T\",60.6875,\"\
  11/4/1998\",\"2:19PM\",-1.1875,\n               62.375,62.625,60.4375,2468000\n\
  \    \"MSFT\",106.5625,\"11/4/1998\",\"2:24PM\",+1.375,\n               105.8125,107.3125,105.5625,11474900\n\
  ```\n\n在这个过程中显而易见缺失的是让机器干活的原则。浏览器允许你的计算机访问远程服务器上的数据，但如果不需要强制交互就能获取数据会更方便。在所有点击按钮的背后，是一个纯文本的程序——浏览器读取一些\
  \ HTML，你输入一些文本，浏览器将其发送到服务器并读回一些 HTML。有了正确的工具和语言，自动获取信息变得很容易。这里有一个使用 Tcl 语言编写的程序，用于访问报价网站并按上述格式获取\
  \ CSV 数据，前面带有几行表头：\n\n点击此处查看代码图像\n\n```tcl\n    # getquotes.t\n    set s [open socket\
  \ yahoo.com 80]\n    puts $s \"GET /quotes.csv HTTP/1.0\\r\\nHost: yahoo.com\\r\\\
  n\\r\\n\"\n    flush $s\n    while {[line = gets $s]} {\n        puts $line\n  \
  \  }\n    close $s\n```\n（注：上面的 Tcl 代码是根据源代码提供的上下文重构的，因为原始文本包含占位符/注释）。\n\n## 4.2.\
  \ 原型库\n\n我们不太可能第一次尝试就写出库的设计。正如弗雷德·布鲁克斯（Fred Brooks）所说：“计划好丢弃它。”布鲁克斯写的是大型系统，但这个想法适用于任何软件。\n\
  \n本着这种精神，我们通过构建一个可以丢弃的东西来构建库，即一个*原型*。我们的第一个版本将忽略许多困难，但将足够完整并有用。我们的起点是一个 `getline`\
  \ 函数，它从文件中读取一行 CSV，将其拆分为字段并返回字段数量。我们几乎在每种语言中都写过类似的代码，因此这是一项熟悉的任务。这里有一个 C 语言的原型；我们将其标记为存疑：\n\
  \n点击此处查看代码图像\n\n```c\nchar buf[200]; // 输入缓冲区\nchar *field[20]; // 字段\n\n/* getline:\
  \ 读取并解析行，返回字段计数 */\n/* 示例输入: \"LU\",86.25,\"11/4/1998\",\"2:19PM\",+4.0625 */\n\
  int csvgetline(FILE *fin) {\n    int nfield;\n    char *p, *q;\n    if (fgets(buf,\
  \ sizeof(buf), fin) == NULL) {\n        return -1;\n    }\n    nfield = 0;\n   \
  \ for (q = buf; (p=strtok(q, \",\\n\\r\")) != NULL; q = NULL) {\n        field[nfield++]\
  \ = unquote(p);\n    }\n    return nfield;\n}\n```\n\n函数顶部的注释包含了程序接受的输入格式的示例；此类注释对于解析混乱输入的程序非常有帮助。\n\
  \n\n\n\n\nCSV 格式过于复杂，无法通过 `scanf` 轻松解析，因此我们使用 C 标准库函数 `strtok`。每次调用 `strtok(p,s)`\
  \ 都会返回 `p` 中第一个 token 的指针，该 token 由不包含在 `s` 中的字符组成；`strtok` 通过将原始字符串的后续字符替换为空字节（null\
  \ byte）来终止该 token。在第一次调用时，`strtok` 的第一个参数是待扫描的字符串；后续调用使用 `NULL` 来指示从上一次调用停止的地方继续扫描。这是一个糟糕的接口。由于\
  \ `strtok` 在调用之间在一个“秘密位置”存储了一个变量，因此一次只能有一组调用序列处于激活状态；不相关的交错调用会相互干扰。\n\n我们的函数 `unquote`\
  \ 删除了上述示例输入中开头和结尾的引号。然而，它没有处理嵌套引号，因此虽然对于原型来说足够了，但它并不通用。\n\n点击此处查看代码图像\n\n```c\n\
  /* unquote: remove leading and trailing quote */\nchar *unquote(char *p)\n{\n  \
  \  if (p[0] == '\"') {\n        if (p[strlen(p)-1] == '\"')\n            p[strlen(p)-1]\
  \ = '\\0';\n        p++;\n    }\n    return p;\n}\n```\n\n一个简单的测试程序有助于验证 `csvgetline`\
  \ 是否正常工作：\n\n点击此处查看代码图像\n\n```c\n/* csvtest main: test csvgetline function */\n\
  int main(void)\n{\n    int i, nf;\n\n    while ((nf = csvgetline(stdin)) != -1)\n\
  \        for (i = 0; i < nf; i++)\n            printf(\"field[%d] = '%s'\\n\", i,\
  \ field[i]);\n    return 0;\n}\n```\n\n`printf` 将字段封装在匹配的单引号中，这界定了字段的边界，并有助于揭示处理空格不当的\
  \ bug。\n\n现在我们可以在 `getquotes.tcl` 生成的输出上运行它：\n\n```bash\n% getquotes.tcl | csvtest\n\
  ...\nfield[0] = 'LU'\nfield[1] = '86.375'\nfield[2] = '11/5/1998'\nfield[3] = '1:01PM'\n\
  field[4] = '-0.125'\nfield[5] = '86'\nfield[6] = '86.375'\nfield[7] = '85.0625'\n\
  field[8] = '2888600'\nfield[0] = 'T'\nfield[1] = '61.0625'\n...\n```\n\n（我们已经删除了\
  \ HTTP 头部行。）\n\n现在我们有了一个似乎可以处理我们上面展示的数据数据的原型。但尝试一下其他数据可能也是明智的，特别是如果我们计划让其他人使用它。我们找到了另一个下载股票报价的网站，并获得了一个信息类似但格式不同的文件：使用回车符（`\\\
  r`）而不是换行符分隔记录，且文件末尾没有终止的回车符。我们对其进行了编辑和格式化，以适应页面：\n\n点击此处查看代码图像\n\n```text\n\"Ticker\"\
  ,\"Price\",\"Change\",\"Open\",\"Prev Close\",\"Day High\",\n    \"Day Low\",\"\
  52 Week High\",\"52 Week Low\",\"Dividend\",\"Yield\",\"Volume\",\"Average Volume\"\
  ,\"P/E\"\n```\n\n使用这种输入，我们的原型失败了。我们在检查了一个数据源后设计了原型，并且最初只针对该数据源进行了测试。因此，当第一次遇到不同的数据源并发现严重的缺陷时，我们不应该感到惊讶。长的输入行、大量的字段和意之外的分隔符都导致了问题。这个脆弱的原型可能供个人使用或演示某种方法的可行性，但仅此而已。在尝试另一种实现之前，是时候重新思考设计了。\n\
  \n我们在原型中做出了大量的决策，既有隐式的也有显式的。以下是所做的一些选择，它们并不总是对通用库来说是最好的方式。每个选择都引发了一个需要更多关注的问题：\n\
  \n- 原型不处理长行或大量字段。它可能会给出错误答案或崩溃，因为它甚至没有检查溢出，更不用在发生错误时返回合理的值了。\n- 假设输入由换行符终止的行组成。\n\
  - 字段由逗号分隔，并移除周围的引号。没有为嵌入引号或逗号提供规定。\n- 输入行未被保留；它在创建字段的过程中被覆盖了。\n- 没有从一行输入保存数据到下一行；如果需要记住某些内容，必须进行复制。\n\
  - 对字段的访问是通过全局变量 `field` 数组实现的，该数组由 `csvgetline` 和调用它的函数共享；对字段内容或指针的访问没有任何控制。也没有尝试防止访问最后一个字段之外。\n\
  - 全局变量使得该设计不适用于多线程环境，甚至不适用于两序列交错的调用。\n- 调用者必须打开和关闭文件；`csvgetline` 仅从打开的文件中读取。\n\
  - 输入和拆分是不可分割的：每次调用都会读取一行并将其拆分为字段，无论应用程序是否需要该服务。\n- 返回值是行中的字段数；每行都必须计算此值。此外没有区分错误和文件结束的方法。\n\
  - 无法在不更改代码的情况下更改这些这些属性。\n\n这个长且不完整的列表说明了一些设计权衡。每个决策都交织在代码中。对于解析已知格式的快速工作来说足够。但如果格式改变，或者字符串内部出现逗号，或者服务器产生长行或大量字段呢？\n\
  \n这似乎很容易应对，因为这个“库”只是一个原型。然而，想象一下，在架上放了几个月或几年后变成了更大程序的一部分，`csvgetline` 如何适应？如果该程序被其他人使用，原始设计中的快速选择可能会多年后引发问题。这种场景代表了许多糟糕接口的历史。这是一个令人悲哀的事实，###\
  \ 4.3 给他人使用的库\n\n利用从原型中中学的知识，我们现在想要构建一个适用于通用的库。最明显的要求是，我们需要使 `csvgetline` 更健壮，以便处理长行或大量字段；它在解析字段时也必须更加小心。\n\
  \n为了创建一个他人可以使用接口，我们必须考虑本开头列的问题：接口、信息隐藏、资源管理和错误处理。这些问题之间的相互作用强烈影响设计。我们对这些问题的划分有些随意，因为它们是相互关联的。\n\
  \n**接口。** 我们决定了三个基本操作：\n\n- `char *csvgetline(FILE *)`：读取新的 CSV 行\n- `char *csvfield(int\
  \ n)`：返回当前行的第 n 个字段\n- `int csvnfield(void)`：返回当前行的字段数\n\n`csvgetline` 应该返回什么函数值？理想情况是尽可能多地返回有用信息，这建议返回字段数，正如原型中那样。但即使不使用字段，也必须计算字段数。另一个可能的值是输入行的长度，这取决于是否保留末尾换行符的影响。在几次实验后，我们决定\
  \ `csvgetline` 返回指向原始输入行的指针，如果到达文件结束则返回 `NULL`。\n\n\n\n\n\n我们将移除 `csvgetline` 返回的行尾换行符，因为在必要时可以很容易恢复它。\n\
  \n## 字段定义\n\n字段的定义是复杂的；我们尝试匹配在电子表格和其他程序中通过经验观察到的结果。字段是零或多个字符的序列。字段之间用逗号分隔。开头和结尾的空格会被保留。字段可以用双引号字符包围，在这种情况下，字段可以包含逗号。被引号的字段可以包含双引号字符，这用两个连续的双引号来表示；CSV\
  \ 字段 `\"x\"\"y\"` 定义了字符串 `x\"y\"`。字段可以是空的；指定为 `\"\"` 的字段是空的，且与相邻逗号所指定的字段相同。\n\n\
  字段从零开始编号。如果用户通过调用 `csvfield(-1)` 或 `csvfield(100000)` 请求一个不存在的字段怎么办？我们可以返回 `\"\"\
  `（空字符串），因为这可以被打印和比较；处理可变数量的程序无需为了处理不存在的字段而采取特殊措施。但这种选择没有办法区分“空字段”和“不存在”。第二种选择是打印错误信息甚至终止；我们决定返回\
  \ `NULL`，这是 `C` 语言中不存在字符串的约定值。\n\n## 信息隐藏\n\n库不对输入行的长度或字段数量施加任何限制。为了实现这一点，要么由调用者提供内存，要么由被者（库）分配内存。库函数\
  \ `fgets` 的调用者传递一个数组和一个最大 own。如果行比缓冲区长，它会被分成几部分。这种行为对于 CSV 接口来说是不满意的，因此我们的库会在发现需要更多内存时进行分配。\n\
  \n因此，只有 `csvgetline` 内存内存；其组织内存的方式从外部无法访问。提供这种隔离性的最好方法是通过函数接口：`csvgetline` 读取下一行（无论它有多大），`csvfield(n)`\
  \ 返回当前行第 `n` 个字段字节的指针，而 `csvnfield` 返回当前行的字段数量。\n\n随着更长的行或更多字段的出现，我们必须扩展内存。如何执行这些细节隐藏在\
  \ `csv` 函数中；程序的其他部分并不知道其工作原理，例如，库是使用会增长的小数组、非常大的数组，还是某种完全不同的机制。接口也没有显示内存何时释放。\n\n\
  如果用户只调用 `csvgetline`，则没有必要拆分成字段；行可以根据需要拆分。字段划分是激进的（在读取行时立即完成）、懒惰的（仅在需要字段或计数时才完成）还是极惰的（仅拆分请求的字段），是另一个对用户隐藏的实现细节。\n\
  \n## 资源管理\n\n我们必须决定谁负责共享信息。`csvgetline` 返回原始数据还是创建副本？我们决定 `csvgetline` 的返回值是指指向原始输入的指针，该指针在读取下一行时会被覆盖。字段将在输入行的副本中构建，`csvfield`\
  \ 将返回该副本中字段的指针。通过这种安排，如果需要保存或更改特定的行或字段，用户必须另行创建一个副本，并且在这些存储不再被需要时释放它们是用户的责任。\n\n\
  由谁负责打开和关闭输入文件？谁打开了输入文件，就应该执行相应的关闭操作：匹配的任务应该在相同的级别或位置完成。我们假设调用 `csvgetline` 时传入的\
  \ `FILE` 指针指向一个已经打开的文件，调用者将在处理完成后关闭它。\n\n管理跨库及其调用者边界的共享或传递的资源是一项艰巨的任务，通常有合理但冲突的理由支持各种设计选择。关于共享责任的错误和误解是\
  \ bug 的频繁来源。\n\n## 错误处理\n\n由于 `csvgetline` 返回 `NULL`，没有好的方法可以区分文件末尾（EOF）和内存耗尽等错误；同样，访问不存在的字段也不会产生错误。类比\
  \ `ferror`，我们可以向接口中添加另一个函数 `csvgeterror` 来报告最近的错误，但为了简单起见，我们在此版本中省略它。\n\n作为一个原则，库程序在发生错误时不应直接崩溃；而应该将错误状态返回给调用者以采取适当行动。它们也不应该打印消息或弹出对话框，因为它们可能运行在消息会干扰其他内容的环境中。错误处理是一个值得在本章后面单独讨论的话题。\n\
  \n## 规范\n\n大型项目中规范于实现，因为规范者和实现者通常是不同的人，并可能来自不同的组织。但在实践中，工作通常是并行进行的，规范和代码共同演进，尽管有时“规范”是在事后才编写的，用来大致描述代码的功能。\n\
  \n最好的方法是尽早编写规范，并在从正在进行的实现中学学习时对其修订。规范越准确越仔细，生成的程序运行得越好的概率就越大。即使对于个人程序，准备一份相当详尽的规范也是有价值的，因为它鼓励了对替代方案的考虑并记录了所做的选择。\n\
  \n对于我们的目的，规范将包含函数原型以及对行为、责任和假设的详细说明：\n\n- 字段由逗号分隔。\n- 字段可以用双引号字符 \"...\" 包围。\n-\
  \ 被引号的字段可以包含逗号但不能包含换行符。\n- 被引号的字段可以包含双引号字符，用 `\"\"` 表示。\n- 字段可以是空的；`\"\"` 和空字符串表示空字段。\n\
  - 开头和结尾的空格会被保留。\n\n```c\nchar *csvgetline(FILE *f);\n// 从打开的文件 f 中读取行\n// 假设行以 \\\
  r、\\n 或 EOF 终止\n// 返回行的指针，并移除终止符；如果发生 EOF 则返回 NULL\n// 行的长度可以是任意的；如果内存溢出则返回 NULL\n\
  // 行必须被视为只读存储\n// 调用者必须创建副本以或更改内容\n```\n\n```c\nchar *csvfield(int n);\n// 字段从 0\
  \ 开始编号\n// 返回上一次 csvgetline 读取的第 n 个字段；\n// 如果 n < 0 或超出最后一个字段则返回 NULL\n// 字段由逗号分隔\n\
  // 字段可能被 \"...\" 包围；此类引号会被移除\n// 在 \"...\" 内部，\"\" 被替换为 \" 且逗号不是分隔符\n// 在未引号的字段中，引号是普通字符\n\
  // 可以有任意数量任意长度的字段；\n// 如果内存溢出则返回 NULL\n// 字段必须被视为只读存储\n// 调用者必须创建副本以或更改内容\n```\n\
  \n```c\nint csvnfield(void);\n// 返回上一次 csvgetline 读取的字段数量。\n// 如果在调用 csvgetline\
  \ 之前调用，行为未定义\n```\n\n\n\n\n本规范仍然留了一些待解决的问题。例如，如果在 `csvgetline` 遇到 `EOF` 之后调用 `csvfield`\
  \ 和 `csvnfield`，它们应该返回什么值？如何处理格式不正确的字段？即使对于一个小型系统，解决所有此类难题都很困难，对于大型系统来说更具挑战性，尽管尝试这样做是重要的。人们通常在实现过程中才会发现疏忽和遗漏。\n\
  \n本节的其余部分包含一个与规范匹配的 `csvgetline` 新实现。该库分为两个文件：一个包含代表接口公共部分的函数声明的头文件 `csv.h`，以及一个包含代码的实现文件\
  \ `csv.c`。用户在源代码中包含 `csv.h`，并将其编译后的代码与 `csv.c` 的编译版本链接；源代码完全不需要可见。\n\n以下是头文件：\n\n\
  点击此处查看代码图像\n\n```c\n    /* csv.h: interface for csv library */\n    extern char\
  \ *csvgetline(FILE *f); /* read next input line */\n    extern char *csvfield(int\
  \ n);     /* return field n */\n    extern int csvnfield(void);       /* return\
  \ number of fields */\n```\n\n存储文本的内部变量和 `split` 等内部函数被声明为 `static`，因此它们仅在包含它们的文件可见。这是在\
  \ C 程序中隐藏信息最简单的方法。\n\n点击此处查看代码图像\n\n```c\n    enum { NOMEM = -2 };           /*\
  \ out of memory signal */\n    static char *line    = NULL;  /* input chars */\n\
  \    static char *sline    = NULL;  /* line copy used by split */\n    static int\
  \  maxline  = 0;      /* size of line[] and sline[] */\n    static char **field\
  \  = NULL;  /* field pointers */\n    static int  maxfield = 0;      /* size of\
  \ field[] */\n    static int  nfield   = 0;      /* number of fields in field[]\
  \ */\n    static char fieldsep[] = \",\"; /* field separator chars */\n```\n\n变量也也是静态初始化的。这些初始值用于测试是否需要创建或扩展数组。\n\
  \n这些声明描述了一个简单的数据结构。`line` 数组持有输入行；`sline` 数组通过从 `line` 复制字符并终止每个字段来创建。`field` 数组指向\
  \ `sline` 中的条目。此图显示了在处理完输入行 `ab,\"cd\",\"e\"\"f\",,\"g,h` 后这三个数组的状态。`sline` 中的阴影元素不属于任何字段。\n\
  \n![image](img/095fig01.jpg)\n\n以下是 `csvgetline` 函数本身：\n\n点击此处查看代码图像\n\n```c\n \
  \   /* csvgetline:  get one line, grow as needed */\n    /* sample input: \"LU\"\
  ,86.25,\"11/4/1998\",\"2:19PM\",+4.0625 */\n    char *csvgetline(FILE *fin)\n  \
  \  {\n        int i, c;\n        char *newl, *news;\n        if (line == NULL) {\
  \            /* allocate on first call */\n            maxline = maxfield = 1;\n\
  \            line = (char *) malloc(maxline);\n            sline = (char *) malloc(maxline);\n\
  \            field = (char **) malloc(maxfield*sizeof(field[0]));\n            if\
  \ (line == NULL || sline == NULL || field == NULL) {\n                reset();\n\
  \                return NULL;      /* out of memory */\n            }\n        }\n\
  \        for (i=0; (c=getc(fin))!=EOF && !ofline(fin,c); i++) {\n            if\
  \ (i >= maxline-1) {   /* line */\n                maxline *= 2;      /* double\
  \ size */\n                newl = (char *) realloc(line, maxline);\n           \
  \     news = (char *) realloc(line, maxline);\n                if (newl == NULL\
  \ || news == NULL) {\n                    reset();\n                    return NULL;\
  \      /* out of memory */\n                }\n                line = newl;\n  \
  \              sline = news;\n            }\n            line[i] = c;\n        }\n\
  \        line[i] = '\\0';\n        if (split() == NOMEM) {\n            reset();\n\
  \            return NULL;      /* out of memory */\n        }\n        return (c\
  \ == EOF && i == 0) ? NULL : line;\n    }\n```\n\n输入的行被累积在 `line` 中，通过调用 `realloc`\
  \ 根据需要进行扩展；每次扩展时大小翻倍，如第 2.6 节所示。`sline` 数组的大小与 `line` 相同；`csvgetline` 调用 `split`\
  \ 在单独数组 `field` 中创建字段指针，该数组也会根据需要进行扩展。\n\n按照我们的习惯，从非常小的数组开始并根据需要进行扩展，以确保数组扩展代码被执行。如果分配失败，我们调用\
  \ `reset` 将全局变量恢复到初始状态，这样随后的 `csvgetline` 调用就有机会再次成功：\n\n点击此处查看代码图像\n\n```c\n  \
  \  /* reset: set variables back to starting values */\n    static void reset(void)\n\
  \    {\n        free(line); /* free(NULL) permitted by ANSI C */\n        free(sline);\n\
  \        free(field);\n        line = NULL;\n        sline = NULL;\n        field\
  \ = NULL;\n        maxline = maxfield = 0;\n    }\n```\n\n`ofline` 函数处理了输入行可能由回车符、换行符、两者甚至\
  \ `EOF` 终止的问题：\n\n点击此处查看代码图像\n\n```c\n    /* endline: check for \\r, \\n, \\r\\\
  n, or EOF */\n    static int endline(FILE *fin, int c)\n    {\n        int eol;\n\
  \        eol = (c=='r' || c=='n');\n        if (c == '\\r') {\n            c = getc(fin);\n\
  \            if (c != '\\n' && c != EOF)\n                ungetc(c, fin); /* read\
  \ too far; put back */\n        }\n        return eol;\n    }\n```\n\n一个独立的函数，因为标准输入函数无法处理实际输入中遇到的各种怪异格式。我们的原型使用\
  \ `strtok` 通过搜索分隔符（通常是逗号）来查找下一个标记，但这使得无法处理引号内的逗号。考虑这些输入行：\n\n```\n\"\",\",\"\",\n\
  ```\n每行都有空字段。确保 `split` 能够解析它们和其他异常输入会使其变得复杂，这是一个特殊情况和边界条件如何主导程序的示例。\n\n点击此处查看代码图像\n\
  \n```c\n    /* split: split line into fields */\n    static int split(void)\n  \
  \  {\n        char *p, **newf;\n        char *sepp; /* pointer to temporary character\
  \ */\n        int sepc;   /* temporary separator character */\n        nfield =\
  \ 0;\n        if (line[0] == '\\0')\n            return 0;\n        strcpy(sline,\
  \ line);\n        p = sline;\n        do {\n            if (nfield >= maxfield)\
  \ {\n                maxfield *= 2;      /* double size */\n                newf\
  \ = (char **) realloc(field,\n                            maxfield * sizeof(field[0]));\n\
  \                if (newf == NULL)\n                    return NOMEM;\n        \
  \        field = newf;\n            }\n            if (*p == '\"')\n           \
  \     sepp = advquoted(++p);  /* skip initial quote */\n            else\n     \
  \           sepp = p + strcspn(p, fieldsep);\n            sepc = sepp[0];\n    \
  \        sepp[0] = '\\0';    /* terminate field */\n            field[nfield++]\
  \ = p;\n            p = sepp + 1;\n        } while (sepc == ',');\n        return\
  \ nfield;\n    }\n```\n\n\n\n循环在需要时会增大字段指针数组，然后调用两个函数之一来定位并处理下一个字段。如果字段以引号开头，`advquoted`\
  \ 会找到该字段并返回指向结束该字段的分隔符的指针。否则，为了找到下一个逗号，我们使用库函数 `strcspn(p,s)`，它在字符串 `p` 中搜索字符串 `s`\
  \ 中任何字符的下一次出现处；它返回跳过的字符数。\n\n字段内部的引号用两个相邻的引号表示，因此 `advquoted` 会将这些引号压缩为单个引号；它还会移除包围字段的引号。为了处理某些可能不符合规范的合理输入（例如\
  \ `\"abc\"def`），代码增加了一些复杂性。在这种情况下，我们将第二个引号之后直到下一个分隔符之前的所有内容作为该字段的一部分追加。Microsoft\
  \ Excel 似乎使用了类似的算法。\n\n点击此处查看代码图像\n\n```c\n    /* advquoted: quoted field; return\
  \ pointer to next separator */\n    static char *advquoted(char *p)\n    {\n   \
  \     int i, j;\n        for (i = j = 0; p[j] != '\\0'; i++, j++) {\n          \
  \  if (p[j] == '\"' && p[++j] != '\"') {\n                /* copy up to next separator\
  \ or \\0 */\n                int k = strcspn(p+j, fieldsep);\n                memmove(p+i,\
  \ p+j, k);\n                i += k;\n                j += k;\n                break;\n\
  \            }\n            p[i] = p[j];\n        }\n        p[i] = '\\0';\n   \
  \     return p + j;\n    }\n```\n\n由于输入行已经过分，`csvfield` 和 `csvnfield` 是显而易见的：\n\n\
  点击此处查看代码图像\n\n```c\n    /* csvfield:  return pointer to n-th field */\n    char\
  \ *csvfield(int n)\n    {\n        if (n < 0 || n >= nfield)\n            return\
  \ NULL;\n        return field[n];\n    }\n    /* csvnfield:  return number of fields\
  \ */\n    int csvnfield(void)\n    {\n        return nfield;\n    }\n```\n\n最后，我们可以修改测试驱动程序来运行这个版本的库；由于它保留了输入行的副本（而原型没有），因此它可以在打印字段之前打印原始行：\n\
  \n点击此处查看代码图像\n\n```c\n    /* csvtest main: test CSV library */\n    int main(void)\n\
  \    {\n        int i;\n        char *line;\n        while ((line = csvgetline(stdin))\
  \ != NULL) {\n            printf(\"line = '%s'\\n\", line);\n            for (i\
  \ = 0; i < csvnfield(); i++)\n                printf(\"field[%d] = '%s'\\n\", i,\
  \ csvfield(i));\n        }\n        return 0;\n    }\n```\n\n我们的 C 版本就此完成。它能处理任意大的输入，并能处理异常数据。代价是它的长度比原型长四倍以上，且某些代码非常复杂。\n\
  \n**练习题 4-1。** 字段拆分有多个程度；可能性包括在请求某个字段时一次性拆分、仅拆分该字段或拆分字段内部。列出这些可能性，评估它们的难度，然后编写它们并测量运行速度。\n\
  \n**练习题 4-2。** 添加一个功能，可以更改分隔符：（a) 改为任意字符类；(b) 为不同的字段使用不同的分隔符；(c) 改为正则表达式（见第 9 章）。接口应该是什么样子的？\n\
  \n**练习题 4-3。** 我们选择使用 C 提供的静态初始化作为一次性切换的基础：如果进入时指针为 `NULL`，则执行初始化。另一种可能性是要求用户调用一个显式函数，该函数可以包含建议的数组大小。实现一个结合两者优点的版本。在你的实现中，`reset`\
  \ 起了什么作用？\n\n**练习题 4-4。** 设计并实现一个创建 CSV 格式数据的库。最简单的版本可以接收一个字符串数组并用逗号打印它们。更复杂的版本可能会使用类似于\
  \ `printf` 的格式化字符串。查看第 9 章关于表示法的建议。\n\n### 4.4 C++ 实现\n\n在本节中，我们将编写 CSV 库的 C++ 版本以解决\
  \ C 版本的一些局限性。这将涉及对规范的一些更改，其中最重要的是函数将处理 C++ 字符串而不是 C 字符数组。使用 C++ 字符串将自动解决一些存储问题，因为库函数将为我们管理内存。特别是，字段例将返回可以由调用者修改的字符串，这比之前的版本设计更灵活。\n\
  \n`Csv` 类定义了公共接口，同时整洁地隐藏了实现的变量和函数。由于类对象包含了实例的所有状态，因此我们可以实例化多个 `Csv` 变量；每个变量都是相互独立的，因此多个\
  \ CSV 输入流可以同时操作。\n\n点击此处查看代码图像\n\n```cpp\nclass Csv { // read and parse comma-separated\
  \ values\n    // sample input: \"LU\",86.25,\"1998\",\"2:25\npublic:\n    Csv(istream&\
  \ fin = cin, string sep = \",\")\n        fin(fin), fieldsep(sep) {}\n    int getline(string&);\n\
  \    string getfield(int n);\n    int getnfield() const { return nfield; }\nprivate:\n\
  \    istream& fin;           // input file\n    string line;            // input\
  \ line\n    vector<string> field;   // field strings\n    int nfield;          \
  \    // number of fields\n    string fieldsep;        // separator characters\n\
  \    int split();\n    int endofline(char c);\n    int advplain(const string& line,\
  \ string& fld);\n    int advquoted(const string& line, string& fld);\n};\n```\n\n\
  构造函数使得 `Csv` 对象从标准输入读取并使用默认分隔符。为了管理字符串，我们使用 `string` 和 `vector` 类而不是 C 风格的数组。没有等价的\
  \ `NULL`。\n\n`+=` 运算符被重载以向字符串追加字符。`endofline` 中需要微调。同样，我们需要逐字符读取输入，因为标准输入无法处理各种输入。\n\
  \n点击此处查看代码图像\n\n```cpp\n// endofline: check and consume \\r, \\n, \\r\\n, or EOF\n\
  int Csv::endofline(char c) {\n    int eol;\n    eol = (c=='r' || c=='\\n');\n  \
  \  if (c == '\\r') {\n        fin.get(c);\n        if (!fin.eof() && c != '\\n')\n\
  \            fin.putback(c); // read too far\n    }\n    return eol;\n}\n```\n\n\
  ```cpp\n// getline: get line as needed\nint Csv::getline(string& str) {\n    char\
  \ c;\n    for (line = \"\"; fin.get(c) && !endofline(c); )\n        line += c;\n\
  \    split();\n    str = line;\n    return !fin.eof();\n}\n```\n\n```cpp\n// split:\
  \ split line into fields\nint Csv::split() {\n}\n```\n\n\n\n\n```cpp\nstring fld;\n\
  int i, j;\nnfield = 0;\nif (line.length() == 0)\n    return 0;\ni = 0;\ndo {\n \
  \   if (i < line.length() && line[i] == '\"')\n        j = advquoted(line, fld,\
  \ ++i);  // 跳过引号\n    else\n        j = advplain(line, fld, i);\n    if (nfield\
  \ >= field.size())\n        field.push_back(fld);\n    else\n        field[nfield]\
  \ = fld;\n    nfield++;\n    i = j + 1;\n} while (j < line.length());\nreturn nfield;\n\
  ```\n\n由于 `strcspn` 无法用于 C++ 字符串，我们必须修改 `split` 和 `advquoted`。`advquoted` 的新版本使用\
  \ C++ 标准函数 `find_first_of` 来定位分隔符字符的下一次出现。调用 `s.find_first_of(fieldsep,j)` 在字符串\
  \ `s` 中搜索 `fieldsep` 中任何字符在位置 `j` 或之后出现的首次实例。如果未能找到实例，它将返回一个超出字符串范围的索引，因此我们必须将其带回范围内。随后的内部\
  \ `for` 循环会将直到分隔符之前的字符追加到正在 `fld` 中累加的字段中。\n\n点击此处查看代码图像\n\n```cpp\n// advquoted:\
  \ 引号字段；返回下一个分隔符的索引\nint Csv::advquoted(const string& s, string& fld, int i)\n{\n\
  \    int j;\n    fld = \"\";\n    for (j = i; j < s.length(); j++) {\n        if\
  \ (s[j] == '\"' && s[++j] != '\"') {\n            int k = s.find_first_of(fieldsep,\
  \ j);\n            if (k > s.length()) // 未找到分隔符\n                k = s.length();\n\
  \            for (k -= j; k-- > 0; )\n                fld += s[j++];\n         \
  \   break;\n        }\n        fld += s[j];\n    }\n    return j;\n}\n```\n\n`find_first_of`\
  \ 函数也被用于新函数 `advplain`，该函数跨越一个非引号的普通字段。同样，这种更改是因为像 `strcspn` 这样的 C 字符串函数不能应用于 C++\
  \ 字符串，它们完全不同的数据类型。\n\n点击此处查看代码图像\n\n```cpp\n// advplain: 非引号字段；返回下一个分隔符的索引\nint\
  \ Csv::advplain(const string& s, string& fld, int i)\n{\n    int j;\n    j = s.find_first_of(fieldsep,\
  \ i); // 寻找分隔符\n    if (j > s.length())    // 无\n        j = s.length();\n    fld\
  \ = string(s, i, j);\n    return j;\n}\n```\n\n和之前一样，`Csv::getfield` 是简单易见的，而 `Csv::getnfield`\
  \ 极其短，可以直接在类定义中实现。\n\n点击此处查看代码图像\n\n```cpp\n// getfield：返回第 n 个字段\nstring Csv::getfield(int\
  \ n)\n{\n    if (n < 0 || n >= nfield)\n        return \"\";\n    else\n       \
  \ return field[n];\n}\n```\n\n我们的测试程序是早期版本的简单变体：\n\n点击此处查看代码图像\n\n```cpp\n// Csv\
  \ main：测试 Csv 类\nint main(void)\n{\n    string line;\n    Csv csv;\n    while (csv.getline(line)\
  \ != 0) {\n        cout << \"line = '\" << line << \"'\\n\";\n        for (int i\
  \ = 0; i < csv.getnfield(); i++)\n            cout << \"field[\" << i << \"] = '\"\
  \ << csv.getfield(i) << \"'\\n\";\n    }\n    return 0;\n}\n```\n\n这种用法与 C 版本不同，尽管仅有细微差别。取决于编译器，对于处理包含\
  \ 30,000 行、每行约 25 个字段的大型输入文件，C++ 版本比 C 版本慢 40% 到四倍。正如我们在比较 `markov` 的版本时看到的，这种波动性反映了库的成熟度。C++\
  \ 源程序大约短了 20%。\n\n**练习题 4-5。** 增强 C++ 实现，通过 `operator[]` 重载下标运算符，以便可以通过 `csv[i]`\
  \ 访问字段。\n\n**练习题 4-6。** 编写 Java 版本的 CSV 库，然后比较这三种实现的清晰性、健壮性和速度。\n\n**练习题 4-7。**\
  \ 将 C++ 版本的 CSV 代码重新封装为 STL 迭代器。\n\n**练习题 4-8。** C++ 版本允许多个独立的 `Csv` 实例并发运行且互不干扰，这是将所有状态封装在可以多次实例化的对象中的优点。修改\
  \ C 版本，通过将全局结构替换为由显式 `csvnew` 函数分配并初始化的结构体来实现相同的效果。\n\n### 4.5 接口原则\n\n在之前的节中，我们讨论了接口的细节，接口定义了提供服务的代码与使用它的代码之间的边界。接口定义了程序可以做什么——读取一行、获取字段以及返回字段数量——这些都是可以执行的操作。\n\
  \n要成功，接口必须适用于其任务——简单、通用、可预测、健壮，并且它在用户和实现发生变化时能够良好地适应。良好的接口遵循一组原则。这些原则不是独立的或一致的，但它们帮助我们描述跨越软件部分之间的边界。\n\
  \n**隐藏实现细节。** 接口背后的实现应该对程序的其余部分隐藏，以便在进行更改时不会影响任何内容。对于这种组织原则有多个术语：信息隐藏、封装、抽象、模块化等，它们都指的是相关的思想。接口应该隐藏对客户端（用户）不相关的实现细节。这些是不可见的，可以被更改而不会影响接口，也许是为了扩展接口、提高效率，甚至完全替换其实现。\n\
  \n大多数编程语言的基础库提供了熟悉的示例，尽管并不总是设计良好。C 标准 I/O 库是最广为人知的：几十个打开、关闭、读、写以及其他操作文件的函数。文件 I/O\
  \ 的实现隐藏在 `FILE*` 类型之后，你可能可以看到它的属性（因为它们通常在 `<stdio.h>` 中列出），但不应加以利用。\n\n如果头文件没有包含结构声明，而只有结构体的名称，这有时被称为不透明类型（opaque\
  \ type），因为其属性不可见，所有操作都通过指向真实对象的指针进行。\n\n强烈建议不要任何形式的公开可见数据；尽可能通过函数参数传递所有数据的引用更好，因为如果用户可以随所欲地更改变量，就很难维护值的致性。函数接口更容易强制访问规则，但这一原则经常被违反。预定义的\
  \ I/O 流如 `stdin` 和 `stdout` 几乎总是定义为全局 `FILE` 结构数组的元素：\n\n点击此处查看代码图像\n\n```cpp\n\
  extern FILE __iob[_NFILE];\n#define stdin  (&__iob[0])\n#define stdout (&__iob[1])\n\
  #define stderr (&__iob[2])\n```\n\n这使得实现完全可见；它意味着你不能给 `stdin`、`stdout` 或 `stderr`\
  \ 赋值，尽管它们看起来像变量。特殊的名称 `__iob` 使用了 ANSI C 的约定，使用两个前导划线表示必须可见的私有名称，这使得这些名称不太与程序中的名称发生冲突。\n\
  \n\n\n\nC++ 和 Java 中的类是隐藏信息的更好机制；它们是正确使用这些语言的核心。我们在第 3 章中使用的 C++ 标准模板库容器类进一步实现了这一点：除了某些性能保证外，没有关于实现的信息，库的创建者可以使用他们喜欢的任何机制。\n\
  \n选择一组较小的正交原语。接口应该提供尽可能必要的功能，但不能更多，且函数在功能上不应过度重叠。许多函数可能会让库更易使用——无论需要什么随手可得。但大型接口更难编写和维护，纯粹的规模也可能使其难以学习和使用。“应用程序接口”或\
  \ API 有时如此巨大，以至于凡人な无法精通它们。\n\n为了方便起见，某些接口提供了实现同一功能的多种方法，这种倾向应该被抵制。C 标准 I/O 库提供了至少四个不同的函数可以向输出流写入单个字符：\n\
  \n点击此处查看代码图像\n\n```\n    char c;\n    putc(c, fp);\n    fputc(c, fp);\n    fprintf(fp,\
  \ \"%c\", c);\n    fwrite(&c, sizeof(char), 1, fp);\n```\n\n如果流是 `stdout`，还有几种可能性。这些虽然很方便，但并非都是必要的。\n\
  \n窄接口应优于宽接口，至少在你有强有证据需要更多函数之前。只做一件事，并将其做好。不要因为可以这样做就向接口添加内容，也不要在由于实现出现问题时去修复接口。例如，与其为了速度使用\
  \ `memcpy` 而为了安全使用 `memmove`，不如拥有一个始终安全且在可能时快速的单一函数。\n\n不要在用户背后搞手脚。库函数不应该写入秘密文件和变量，也不应该更改全局数据，并且在修改调用者的数据时应该审慎。`strtok`\
  \ 函数未能满足了这几项标准。`strtok` 会向其输入字符串中间写入空字节，这有点令人意外。它使用空指针作为从上次断开处继续执行的信号，意味着在多次调用之间持有着秘密数据，这很可能是\
  \ Bug 的根源，并且阻止了该函数的并发使用。更好的设计是提供一个对输入字符串进行分词的单一函数。由于类似的原因，我们的第二个 C 版本无法用于两个输入流；参见练习\
  \ 4-8。\n\n使用一个接口不应为了接口设计者或实现者的方便而要求另一个接口。相反，要使接口自成一体，如果不行，请明确说明需要哪些外部服务。否则，你就给客户端增加了维护负担。一个显而见的例子是\
  \ C 和 C++ 源码中管理巨大的头文件列表的痛苦；头文件可能有数千行长，并包含几十个其他头文件。\n\n在任何地方以相同的方式做相同的事情。一致性和规律性很重要。相关事务应该通过相关的手段实现。C\
  \ 库中基础的 `str...` 函数不需要文档就很容易使用，因为它们的行为大致相同：数据从右向左流，方向与赋值语句相同，且它们都返回结果字符串。另一方面，在\
  \ C 标准 I/O 库中，很难预测函数中参数的顺序。有些将 `FILE*` 参数在第一个，有些在最后；其他的尺寸和元素数量顺序也各异。STL 容器的算法呈现出非常统一的接口，因此很容易预测如何使用一个陌生的函数。\n\
  \n外部一致性（行为像其他东西）也是一个目标。例如，`mem...` 函数在 C 语言 `str...` 函数之后设计，但借鉴了它们的风格。标准 I/O 函数\
  \ `fread` 和 `fwrite` 如果看起来像它们基于的 `read` 和 `write` 函数将会更容易记忆。Unix 命令行选项用减号引入，但给定的选项字母可能意味着完全不同的含义，即使在相关的程序之间也是如此。\n\
  \n如果像 `*.exe` 中的 `*` 通通配符由命令解释器扩展，行为就是统一的。如果它们由各个程序扩展，可能会出现非统一的行为。网络浏览器单击鼠标即可跟踪链接，但其他应用程序需要两次点击来启动程序或跟踪链接；结果是许多人无论如何都会自动点击两次。\n\
  \n这些原则在某些环境中比其他环境更容易遵循，但它们仍然适用。例如，在 C 中隐藏实现细节很困难，但一个优秀的程序员不会利用它们，因为这样做会使细节成为接口的一部分并违背信息隐藏原则。头文件中的注释、具有特殊形式的名称（如\
  \ `__iob`）等，是在无法强制时鼓励良好行为的方法。\n\n无论如何，我们在设计接口方面能做的程度是有限的。即使今天最好的接口最终可能变成明天的问题，但良好的设计可以把明天推迟一段时间。\n\
  \n### 4.6 资源管理\n\n设计库（或类或包）接口时，最困难的问题之一是管理由库拥有或由库与调用者共享的资源。最显而易见的资源是内存——谁负责分配和释放存储？但其他共享资源包括打开的文件和值具有共同利益的变量状态。粗来说，这些问题分为初始化、维护状态、共享和清理几类。\n\
  \n我们 CSV 包的原型使用静态初始化来设置指针、计数等的初始值。但这种选择是局限的，因为一旦某个函数被调用，就会防止在初始状态下重新启动例程。替代方案是提供一个设置所有内部值的初始化函数。这允许重启，但依赖于用户显式调用它。第二个版本中的\
  \ `reset` 函数可以为此设为公共。\n\n在 C++ 和 Java 中，构造函数用于初始化类的数据成员。正确定义的构造函数确保所有数据成员都已初始化，并且没有办法创建未初始化的类对象。一组构造函数可以支持各种类型的初始化器；我们可以为\
  \ `Csv` 提供一个接受文件名的构造函数和另一个接受输入流的构造函数。\n\n库管理的信息拷贝（如输入行和字段）怎么办？我们的 C `csvgetline`\
  \ 程序通过返回指向输入字符串（行和字段）的指针来直接访问这些字符串。这种无限制的访问有几个缺点。用户可能会覆盖内存导致其他内容失效；例如，像这样的表达式：\n\
  \n点击此处查看代码图像\n\n```\n    strcpy(csvfield(1), csvfield(2));\n```\n\n可能会以多种方式失败，最可能是如果字段\
  \ 2 长于字段 1，则会覆盖字段 2 的开头。库的用户必须对任何要在下次调用 `csvgetline` 之后保留的信息进行拷贝；在以下序列中，如果第二次 `csvgetline`\
  \ 导致其行缓冲区重新分配，那么指针在结束时可能是无效的。\n\n点击此处查看代码图像\n\n```\n    char *p;\n    csvgetline(fin);\n\
  \    p = csvfield(1);\n    csvgetline(fin);\n    /* p 在此处可能是无效的 */\n```\n\n\n\n\
  C++ 版本更安全，因为字符串是能够随意更改的副本。\n\nJava 使用引用来指向对象，即引用除了像 `int` 等基本类型以外的任何实体。这比创建副本更高效，但人们可能会误认为引用是一个副本；我们在\
  \ Java `markov` 程序的早期版本中就遇到过这样的 bug，而这个问题是 C 语言中涉及字符串的长期 bug 源。`Clone` 方法提供了一种在需要时创建副本的方法。\n\
  \n初始化或构造的另一面是终结或析毁——即当某个实体不再需要时进行清理并回收资源。这对于内存尤为重要，因为一个无法回收未使用内存的程序最终会耗尽内存。许多现代软件都极易犯这种错误。在需要关闭打开的文件时也会出现相关问题：如果数据正在缓冲区中，则可能需要刷新缓冲区（并回收其内存）。对于标准\
  \ C 库函数，刷新会在程序正常终止时自动发生，否则必须通过编程来处理。C 和 C++ 的标准函数 `atexit` 提供了一种在程序正常终止之前获取控制权的方法；接口实现者可以使用此机制来安排清理工作。\n\
  \n### 在分配资源的同一层级释放资源\n\n控制资源分配和回收的一种方法是让分配资源的相同库、包或接口负责释放它。这种说法的另一种方式是，资源的分配状态不应跨接口改变。我们的\
  \ CSV 库从已经打开的文件读取数据，因此它们在完成工作后保持文件打开状态。库的调用者需要关闭这些文件。\n\nC++ 构造函数和析构函数有助于强制执行这一规则。当类实例离开作用域或被显式销毁时，就会调用析构函数；它可以刷新缓冲区、回收内存、重置值并执行任何其他必要操作。Java\
  \ 没有提供类似的机制。虽然可以为类定义一个终结方法，但无法保证它一定会运行，更不用说是在特定时间运行了，因此清理操作无法保证会发生，尽管假设它们会发生通常是合理的。\n\
  \nJava 确实在内存管理方面提供了巨大的帮助，因为它内置了垃圾回收机制。随着程序的运行，它会分配新对象。没有方法可以显式地释放它们，但运行时系统会跟踪哪些对象仍在在使用，哪些没有，并定期将未使用的使用的对象返回到可用内存池。\n\
  \n垃圾回收有多种技术。某些方案跟踪每个对象的使用次数（其引用计数），并在引用计数归零时释放对象。这种技术可以在 C 和 C++ 中显式使用来管理共享对象。其他算法则定期追踪从分配池到所有被引用对象的踪迹。通过这种方式找到的对象仍在在使用；未被任何其他对象引用的对象则未使用，可以被回收。\n\
  \n自动垃圾回收的存在并不意味着设计中没有内存管理问题。我们仍然需要确定接口返回的是共享对象的引用还是它们的副本，这会影响整个程序。垃圾回收也不是免费的——维护信息和回收未使用内存需要开销，且收集可能在不可预测的时间发生。\n\
  \n如果一个库要被使用在一个可能有多个控制线程同时执行其例例程的环境中（例如在多线程 Java 程序中），那么所有这些问题都会变得更加复杂。\n\n为了避免问题，有必要编写可重入（reentrant）的代码，这意味着无论同时执行多少次它都能工作。可重入代码将避免全局变量、静态局部变量以及任何在另一个线程使用它时可能被修改的变量。良好的多线程设计的关键是将组件分离，使得它们除了定义良好的接口外不共享任何内容。无意中暴露变量进行共享的库会破坏这种模型。（在多线程程序中，`strtok`\
  \ 是场灾难，C 库中其他将值存储在内部静态内存中的函数也是。）如果变量可能被共享，它们必须被某种锁定机制保护，以确保一次只有一个线程访问它们。类在这里非常有帮助，因为它们为讨论共享和锁定模型提供了焦点。Java\
  \ 中的同步方法（synchronized methods）提供了一种让一个线程锁定整个类或类实例以防止某些其他线程同时修改的方法；同步块（synchronized\
  \ blocks）仅允许一次只有一个线程执行一段代码。\n\n多线程给编程问题增加了巨大的复杂性，而且是一个太大的话题，我们无法在这里详细讨论。\n\n###\
  \ 4.7. 中止、重试、失败？\n\n在之前的章节中，我们使用了像 `eprintf` 和 `estrdup` 这样的函数在终止执行之前显示消息来处理错误。例如，`eprintf`\
  \ 的行为类似于 `fprintf(stderr,...)`，但在报告错误后以错误状态退出程序。它使用 `<stdarg.h>` 头文件和 `vfprintf`\
  \ 库程序来打印原型中 `...` 代表的参数。`stdarg` 库必须通过调用 `va_start` 初始化，并通过 `va_end` 终止。我们将在第 9\
  \ 章 中更多地使用此接口。\n\n点击查看代码图像\n\n```c\n#include <stdarg.h>\n#include <string.h>\n#include\
  \ <errno.h>\n/* eprintf: print error message and exit */\nvoid eprintf(char *fmt,\
  \ ...) {\n    va_list args;\n    fflush(stdout);\n    va_start(args, fmt);\n   \
  \ vfprintf(stderr, fmt, args);\n    va_end(args);\n    if (fmt[0] != '\\0' && strlen(fmt)-1\
  \ == ':') {\n        fprintf(stderr, \"%s\", strerror(errno));\n    }\n    fprintf(stderr,\
  \ \"\\n\");\n    exit(2);\n}\n```\n\n格式参数以冒号结尾，`eprintf` 会调用 `strerror`，该函数返回包含任何系统错误的字符串。我们还写了\
  \ `weprintf`，它与 `eprintf` 类似，显示警告但不退出。同样，`estrdup` 尝试制作字符串的副本，如果内存不足则通过 `eprintf`\
  \ 退出：\n\n点击查看代码图像\n\n```c\n/* estrdup: duplicate a string, report if error */\n\
  char *estrdup(char *s) {\n    char *t = (char *) malloc(strlen(s)+1);\n    if (t\
  \ == NULL) {\n        eprintf(\"estrdup(\\\"%20s\\\") failed:\", s);\n    }\n  \
  \  strcpy(t, s);\n    return t;\n}\n```\n\n而 `emalloc` 为 `malloc` 的调用提供了类似的服务：\n\
  \n点击查看代码图像\n\n```c\n/* emalloc: malloc and report if error */\nvoid *emalloc(size_t\
  \ n) {\n    void *p;\n    p = malloc(n);\n    if (p == NULL) {\n        eprintf(\"\
  malloc of %u bytes failed:\", n);\n    }\n    return p;\n}\n```\n\n匹配的头文件 `eprintf.h`\
  \ 声明了这些函数：\n\n点击查看代码图像\n\n```c\n/* eprintf.h: error wrapper functions */\nvoid eprintf(char\
  \ *, ...);\nvoid weprintf(char *, ...);\nchar *estrdup(char *);\n```\n\n\n\n\n\n\
  ```c\nextern void *emalloc(size_t);\nextern void *erealloc(void *, size_t);\nextern\
  \ char *progname(void);\nextern void setprogname(char *);\n```\n\n此头文件被包含在任何调用一个错误函数的文件中。如果调用者设置了程序名称，则每条错误消息也会包含该程序名称；这些名称是通过简单的函数\
  \ `setprogname` 和 `progname` 进行设置和检索的，这两个函数在头文件中声明，并在源文件中通过 `eprintf` 进行定义：\n\n\
  点击此处查看代码图片\n\n```c\nstatic char *name = NULL;  /* program name for messages */\n\
  /* setprogname: set stored name of program */\nvoid setprogname(char *str)\n{\n\
  \    name = estrdup(str);\n}\n/* progname: return stored name of program */\nchar\
  \ *progname(void)\n{\n    return name;\n}\n```\n\n典型的用法如下：\n\n点击此处查看代码图片\n\n```c\n\
  int main(int argc, char *argv[])\n{\n    setprogname(\"markov\");\n    ...\n   \
  \ f = fopen(argv[i], \"r\");\n    if (f == NULL)\n        eprintf(\"can't open %s:\"\
  , argv[i]);\n    ...\n}\n```\n\n其输出如下：\n\n点击此处查看代码图片\n\n```text\nmarkov: can't open\
  \ psalm.txt: No such file or directory\n```\n\n我们发现这些封装函数对我们自己的编程非常方便，因为它们统一了错误处理，而且它们本身的存在鼓励我们去捕获错误而不是忽略它们。然而，我们的设计并没有特殊之处，你可能更喜欢为自己的程序选择某种变体。\n\
  \n假设我们不是在为自己编写函数，而是正在创建一个供他人在程序中使用的库。当发生不可恢复的错误时，该库中的函数应该做什么？我们在本章较之前编写的函数显示一条消息并退出。这对于许多程序（特别是小型独立工具和应用程序）来说是可以接受的。。但对于其他程序来说，退出是错误的，因为它阻止了程序的其余部分尝试任何恢复；例如，文字处理器必须从错误中恢复，以免丢失你正在输入的文档。在某些情况下，库例程甚至不应该显示任何消息，因为程序可能运行在一个消息会干扰显示数据或无声无息地消失的环境中。一个实用的替代方案是将诊断输出记录在显式的“日志文件”中，可以在那里对其进行独立监控。\n\
  \n### 在低层检测错误，在高层处理错误。\n\n作为一个通用原则，错误应该尽可能在低层检测，但在高层处理。在大多数情况下，应该由调用者决定如何处理错误，而不是被调用者。库例程可以通过优雅地失败来帮助这一点；这种理由导致我们在遇到字段不存在时返回\
  \ `NULL` 而不是中止程序。同样，`csvgetline` 无论在第一次遇到文件末尾后被调用多少次，都会返回 `NULL`。\n\n合适的返回值并不总是显而易见的，正如我们在之前关于\
  \ `csvgetline` 应该返回什么的讨论中所看到的。我们希望返回尽可能多的有用信息，但要是易于程序其余部分使用的形式。在 C、C++ 和 Java 中，这意味着将某些值作为函数的返回值，并可能通过引用（指针）参数返回其他值。许多库函数依赖于区分正常值和错误值的能力。输入函数如\
  \ `getchar` 返回 `char` 表示有效数据，并返回某些非 `char` 值（如 `EOF`）表示文件结束或错误。\n\n如果函数的合法返回值占据了所有可能的值，这种机制就不起作用。例如，像\
  \ `log` 这样的数学函数可以返回任何浮点数。在 IEEE 浮点中，一个名为 `NaN`（“不是数字”）的特殊值表示错误并可以返回。\n\n某些语言（如 Perl\
  \ 和 Tcl）提供了 `tuple` 来将两个或多个值组合在一起。在 C++ 中，可以这样使用 `pair` 数据类型。\n\n区分文件和错误的各种值是理想的，而不是将它们归为一个单一值。这是\
  \ Unix 使用的方法，其中系统调用返回 `-1` 并设置一个名为 `errno` 的全局变量。\n\n```c\n#include <stdio.h>\n\
  #include <string.h>\n#include <errno.h>\n#include <math.h>\n\nstatic char *name\
  \ = NULL;  /* program name for messages */\nvoid setprogname(char *str)\n{\n   \
  \ name = estrdup(str);\n}\nchar *progname(void)\n{\n    return name;\n}\n\nint main(void)\n\
  {\n    double f;\n    errno = 0; /* clear error */\n    f = log(-1.2);\n    printf(\"\
  %f %s\\n\", f, strerror(errno));\n    return 0;\n}\n```\n\n### 异常仅用于异常情况。\n\n异常用于捕获异常情况并从中恢复；它们提供了一种替代的控制流。异常不应用于预期的值。在\
  \ Java 中，你可以这样写：\n\n```java\nString fname = \"someFileName\";\ntry {\n    FileInputStream\
  \ in = new FileInputStream(fname);\n    int c;\n    while ((c = in.read()) != -1)\n\
  \        System.out.print((char) c);\n    in.close();\n} catch (FileNotFoundException\
  \ e) {\n    System.err.println(fname + \" not found\");\n} catch (IOException e)\
  \ {\n    System.err.println(\"IOException: \" + e);\n    e.printStackTrace();\n\
  }\n```\n\n循环读取字符直到文件末尾，这是一个预期的事件，通过 `read` 的返回值 `-1` 信号。然而，如果无法打开，它会抛出异常，而不是像 C\
  \ 或 C++ 那样将输入流设置为 `null`。\n\n\n\n\n\n发生错误时，资源如何恢复？库是否应该在出现问题时尝试进行恢复？通常不需要，但如果它能确保将信息尽可能留在整洁且无害的状态，也可能提供了帮助。无疑，未使用的存储空间应该被回收。如果变量可能仍然可以访问，则应该将它们设置为合理的值。一个常见的错误来源是尝试使用一个指向已释放存储的指针。如果错误处理代码在释放其所指向的内容后将指针置零，那么这种错误将无法被察觉。CSV\
  \ 库第二个版本中的 `reset` 函数就是为了解决这些问题的尝试。总的来说，目标是让库在发生错误后仍保持可用性。\n\n### 4.8. 用户界面\n\n\
  到为止，我们主要讨论了程序组件之间或程序与程序之间的接口。但还有另外一种重要的接口，即程序与其人类用户之间的接口。\n\n书中的大多数示例程序都是基于文本的，因此它们的用户界面往往是直观的。正如我们在上一节中讨论的，应该应该检测并报告错误，并在可行的情况下尝试恢复。错误输出应该包含所有可用信息，并且在脱离上下文的情况下尽可能具有意义；诊断信息不应该只说\n\
  \n`estrdup failed`\n\n而本可以说点击此处查看代码图像\n\n`markov: estrdup(\"Derrida\") failed: Memory\
  \ limit reached`（内存限制已达到）\n\n像我们在 `estrdup` 中做的那样添加额外信息并没有成本，而且它可能帮助用户识别问题或提供有效的输入。\n\
  \n当发生错误时，程序应该显示有关正确用法的信息，如点击此处查看代码图像等函数所示：\n\n```c\n    /* usage: print usage message\
  \ and exit */\n    void usage(void)\n    {\n        fprintf(stderr, \"usage: %s\
  \ [-d] [-n nwords]\"\n                \" [-s seed] [files ...]\\n\", progname());\n\
  \        exit(2);\n    }\n```\n\n程序名标识了信息的来源，如果这是一个更大过程的一部分，这一点尤为重要。如果程序呈现的是一条只显示\
  \ `syntax error`（语法错误）或 `estrdup failed` 的消息，用户可能不知道是谁说的。\n\n错误消息、提示和对话框的文本应该说明有效输入的格式。不要说某个参数太大；要报告有效的取值范围。可能的情况下，文本本身就应该是有效输入，例如带有正确设置参数的完整命令行。除了引导用户正确使用外，此类输出还可以被捕获到文件中或通过鼠标扫描捕获，然后用于运行某些后续过程。这指出了对话框的一个弱点：其内容难以提取供以后使用。\n\
  \n创建良好的输入用户界面的一种有效方法是设计一种特殊语言来设置参数、控制动作等；一种良好的表示法可以使程序易于使用，同时有助于组织实现。基于语言的接口是第 9\
  \ 章讨论的主题。\n\n防御性编程，即确保程序对不良输入具有免疫力，对于保护用户免受其自身伤害以及作为一种安全机制都是重要的。这在第 6 章中会有更多的讨论，该章节讨论了程序测试。\n\
  \n对于大多数人来说，图形界面是他们电脑的用户界面。图形用户界面是一个巨大的课题，因此我们只说几件与本书相关的事情。首先，图形界面很难创建并做到“正确”，因为它们的适用性和成功在很大程度上取决于人类行为和预期。其次，从实际问题来说，如果一个系统有用户界面，那么处理用户交互的代码通常比执行工作的算法代码要多。\n\
  \n尽管如此，熟悉的原则同样适用于用户界面软件的外部设计和内部实现。从用户的角度来看，简单、清晰、规整、统一、熟悉和节制等风格问题都有助于形成一个易于使用的界面；此类属性的缺失通常伴随着不愉快或笨拙的界面。\n\
  \n统一性和规整性是理想的，包括术语、单位、格式、布局、字体、颜色、大小以及图形系统提供的所有其他选项的一致使用。使用了多少英文单词来退出程序或关闭窗口？选择范围从\
  \ Abandon（放弃）到 control-Z，中间至少有十种。这种不一致对于母语者来说令人困惑，对其他人来说更是难以理解。\n\n在图形代码内部，接口尤为重要，因为这些系统庞大、复杂，且其驱动模型与扫描顺序文本完全不同。面向对象的编程在图形用户界面方面表现出色，因为它提供了一种封装窗口所有状态和行为的方法，使用继承来结合基类中的相似之处，同时分离派生类中的差异。\n\
  \n## 补充阅读\n\n虽然其一些技术细节现在已经过时，但 Frederick P. Brooks, Jr. 的的《人月神谭》（The Mythical Man\
  \ Month, Addison-Wesley, 1975；1995 年周年版）是一本令人愉快的读物，其中包含关于软件开发的见解在今天与最初出版时一样有价值。\n\
  \n几乎每一本关于编程的书对于接口设计都有用的见解。一本基于宝贵经验的实用书籍是 John Lakos 写的《大规模 C++ 软件设计》（Large-Scale\
  \ C++ Software Design, Addison-Wesley, 1996），讨论了如何构建和管理真正的大型 C++ 程序。David Hanson\
  \ 的《C 接口与实现》（C Interfaces and Implementations, Addison-Wesley, 1997）是对 C 程序的很好的处理。\n\
  \nSteve McConnell 的《快速开发》（Rapid Development, Microsoft Press, 1996）是对如何团队构建软件的极佳描述，强调了原型的作用。\n\
  \n# 第 5 章：调试\n\n**bug**。\n\n**b.** 机器、计划或类似物的缺陷或故障。源自*美国* 1889 年 Pall Mall Gaz 3\
  \ 月 11 日 1/1 据我告知，爱迪生先生连续两个晚上都在发现他的留声机有一个“bug”（虫子）——一种解决困难的表达方式，暗示某种想象中的昆虫躲在内部引起了所有麻烦。\n\
  \n*《牛津英语词典》第二版*\n\n我们在过去的四章中展示了大量的代码，并假装它们在第一次运行时都运行得很好。很自然这并非事实；有很多 bug。“bug”这个词并不是程序员发明的，但它无疑是计算领域常用的术语之一。为什么软件会如此困难？\n\
  \n\n\n\n其中一个原因是，程序的复杂性与其组件相互作用的方式有关，而软件中充满了组件和交互。许多技术试图减少组件之间的连接，以减少交互的环节；示例包括信息隐藏、抽象和接口，以及支持这些特语言特性。还有一些确保软件设计完整性的技术——程序证明、建模、需求分析、形式化验证——但还没有哪一种技术改变软件的构建方式；它们只在小问题上取得了成功。现实情况是，我们总会通过测试发现错误，并通过调试来消除错误。\n\
  \n优秀的程序员知道他们花在调试上的时间和写代码一样多，因此他们倾向于从错误中学习。你发现的每一个 bug 都能教你如何防止类似的 bug 再次发生，或者在发生时识别出它。\n\
  \n调试是困难的，而且可能花费长时间且不可预测的时间，因此目标是避免进行大量的调试。有助于减少调试时间的技术包括良好的设计、良好的风格、边界条件测试、代码中的断言和合理性检查、防御性编程、良好的接口、有限的全局数据以及检查工具。防患未缪真的胜于后治疗。\n\
  \n语言的作用是什么？编程语言演变的一大大动力是试图通过语言特性来防止 bug。某些特性使得某类错误的概率降低：下标范围检查、受限指针或不使用指针、垃圾回收、字符串数据类型、类型化\
  \ I/O 和强类型检查。硬币的另一面，某些特性容易引发错误，如 `goto` 语句、全局变量、无限制指针和自动类型转换。程序员应该了解他们语言中潜在的风险，在使用它们时格外小心。他们还应该开启所有的编译器检查并留意警告。\n\
  \n每一个防止某些问题的语言特性都有自己的代价。如果一种高级语言让简单的 bug 自动消失，代价就是它让你更容易创建高级的 bug。没有一种语言能阻止你犯错。\n\
  \n尽管我们希望情况并非，但大部分编程时间都花在了测试和调试上。在本章中，我们将讨论如何让你的调试时间尽可能短且高效；我们将在第 6 章中回到测试。\n\n##\
  \ 5.1 调试器\n\n主流语言的编译器通常带有复杂的调试器，通常作为开发环境的一部分进行，该环境将源代码的创建与编辑、编译、执行和调试集成在一个系统中。调试器包括图形化界面，允许逐条语句或逐函数地通过程序，在特定行或发生特定条件时停止。它们还提供了格式化和显示变量值的辅助工具。\n\
  \n当已知存在问题时，可以直接调用调试器。当程序执行期间发生意外错误时，某些调试器会自动接管。通常很容易找到程序崩溃时正在执行的位置，检查激活函数的序列（`stack\
  \ trace`，堆栈回溯），并显示局部和全局变量的值。这些信息可能足以识别一个 bug。如果不足，断点和单步执行使得可能可以逐步地重新运行失败的程序，以找到出错的第一个地方。\n\
  \n在合适的环境和经验丰富的用户手中，一个良好的调试器可以使调试变得有效且高效，即使不是完全无痛。既然有如此强大的工具，为什么还会在不使用它们的情况下调试呢？我们为什么需要专门用一章来讨论调试？\n\
  \n有几个充分的理由，有些是客观的，有些是基于个人经验的。主流之外的一些语言没有调试器，或者只提供原始的调试功能。调试器依赖于系统，因此当你在另一个系统工作时，可能无法访问在某个系统中熟悉的调试器。有些程序调试器处理得不好：多进程或多线程程序、操作系统和分布式系统通常必须通过低层的方法进行调试。在这种情况下，你只能孤军奋战，除了打印语句和你自己的经验以及推理代码的能力外，没有其他帮助。\n\
  \n作为一种个人选择，我们倾向于不在获取堆栈回溯或一两个变量值之外使用调试器。原因之一很容易在复杂的数据结构和控制流的细节中迷失；我们发现，逐步执行程序比深入思考、并在关键处添加输出语句和自检代码更有效率。点击跳转语句比扫描明智放置的显示输出要慢得多。决定在何处打印语句比单步执行到代码的关键部分花费的时间更短，即使假设我们知道它在哪里。更重要的是，调试语句会一直留在程序中；而调试会话是转瞬即逝的。\n\
  \n使用调试器进行盲目探测可能产生成效。使用调试器发现程序失败时的状态，然后思考失败是如何发生的，这样大有帮助。调试器可能是晦涩且难以使用的程序，特别是对初学者来说，提供的困惑可能多于帮助。如果你问错了问题，它们可能会给你一个答案，但你可能不知道那个答案是误导性的。\n\
  \n然而，调试器具有巨大的价值，你绝对应该在你的调试工具箱中包含一个；它可能是你首先求助于它的。但如果你没有调试器，或者你被困在一个特别困难的问题上，本章的技术仍然将帮助你有效地高效地进行调试。它们也应该让你对调试器的使用更有效率，因为它们在很大程度上涉及如何推理错误及其可能的原因。\n\
  \n## 5.2 良好的线索，简单的 bug\n\n哎！出大问题了。我的程序崩溃了，或者打印了乱码，或者似乎在永远运行。现在该？\n\n初学者倾向于归咎编译器、库或自己代码以外的任何东西。经验丰富的程序员也想这样做，但他们知道现实中，大多数问题是他们自己的错。\n\
  \n幸运的是，大多数 bug 都是简单的，可以通过简单的技术找到。检查错误输出中的证据，并尝试推断它是产生的。查看崩溃之前的任何调试输出；如果可能，从调试器获取堆栈回溯。现在你知道了发生了什么，以及在哪里发生的。停下来思考。这可能是如何发生的？\n\
  \n调试涉及反向推理，就像破案一样。发生了不可能的事情，而唯一确定的信息是它确实发生了。因此，我们必须从结果反向思考。一旦我们有了完整的解释，我们就知道该修复什么，并且在此过程中，可能会发现一些我们没有预料到的事情。\n\
  \n寻找熟悉的模式。问问自己这是否是一个熟悉的模式。“我见过这个”通常是理解的开始，甚至就是全部答案。常见的 bug 有独特的特征。例如，初学者 C 程序员经常写\n\
  \n```c\nint n;\nscanf(\"%d\", n);\n```\n\n而不是\n\n```c\nint n;\nscanf(\"%d\", &n);\n\
  ```\n\n这在读取行输入时通常会导致尝试访问越界内存。教 C 语言的人一眼就能看出这种症状。\n\n\n\n\n`printf` 和 `scanf` 中的类型不匹配和转换是产生简单\
  \ bug 的无尽源：\n\n```c\nint n = 1;\ndouble d = PI;\nprintf(\"%d %f\\n\", d, n);\n```\n\
  \n这种错误的特征有时是会出现荒谬的值：巨大的整数，或不可置信的极大或极小的浮点值。在 Sun SPARC 上上，该程序的输出是一个巨大的数字和一个天文数字数字（经过折叠以适应显示）：\n\
  \n点击此处查看代码图像\n\n```\n1074340347 268156158598852001534108794260233396350\n1936585971793218047714963795307788611480564140\n\
  0796821289594743537151163524101175474084764156\n422771408323839623430144.000000\n\
  ```\n\n另一个常见错误是使用 `scanf` 时用 `%f` 而不是 `%lf` 来读取 `double`。某些编译器通过验证 `scanf` 和 `printf`\
  \ 参数的类型是否与其格式字符串匹配来捕捉此类错误；如果开启了所有警告，对于上面的 `printf`，GNU 编译器 `gcc` 会报告：\n\n点击此处查看代码图像\n\
  \n```\nx.c:9: warning: int format, double arg (arg 2)\nx.c:9: warning: double format,\
  \ different type arg (arg 3)\n```\n\n未初始化局部变量会导致另一个独特的错误。结果通常是一个极大的值，即之前存储在相同内存位置的任何值留下的垃圾值。尽管某些编译器会警告你，但你可能需要开启编译时检查，而且它们永远无法捕获所有情况。由\
  \ `malloc`、`realloc` 和 `new` 等分配器返回的内存可能也是垃圾；务必初始化它。\n\n### 检查最近的更改。最后一次更改是什么？如果你在程序演进过程中一次只修改一个地方，那么\
  \ bug 最可能位于新代码中，或者被新代码暴露了。仔细观察最近的更改有助于定位问题。如果 bug 出现在新版本中而在旧版本中没有，那么新代码就是问题所在。这意味着你应该保留至少认为是正确的上一个程序版本，以便对比行为。这还意味着你应该记录所做的更改和修复的\
  \ bug，这样当你尝试修复 bug 时，就不需要重新发现这些重要信息。源代码控制系统和其他历史机制在这里非常有帮助。\n\n### 不要犯两次同样的错误。在你修复完一个\
  \ bug 后，问问自己是否可能在其他地方也犯了同样的错误。我们中的其中一人在开始写这一章的前几天就发生过这种情况。那个程序是为同事编写的一个快速原型，包含了一些可选参数的样板代码：\n\
  \n点击此处查看代码图像\n\n```c\nfor (i = 1; i < argc; i++) {\n    if (argv[i][0] != '-') \
  \ /* 选项结束 */\n        break;\n    switch (argv[i][1]) {\n    case 'o':         \
  \     /* 输出文件名 */\n        outname = argv[i];\n        break;\n    case 'f':\n \
  \       from = atoi(argv[i]);\n        break;\n    case 't':\n        to = atoi(argv[i]);\n\
  \        break;\n```\n\n```在我们同事尝试运行后不久，他报告说输出文件名总是带有 `-o` 前缀。这很尴尬，但很容易修复；代码本应该读取\
  \ `outname = &argv[i][2];`。这个问题被修复并发布后，又收到另一个报告，称程序无法正确处理类似 `-f23` 的参数：转换后的值始终为\
  \ 0。这是同一个错误；switch 里的下一个 case 应该读取 `from = atoi(&argv[i][2]);`。由于作者还在赶时间，他没有注意到同样的错误发生了两次，又多花了一轮时间才修复了所有错误。\n\
  \n如果简单的代码因为熟悉而让我们松了警惕，它也可能存在 bug。即使代码简单到你闭着眼睛都能写，在编写时也别睡着了。\n\n### 现在调试，不要等以后。在其他情况下，太匆忙会有害。当崩溃发生时不要忽略它；在事后去追踪它，因为在太晚之前，它可能不会再次发生了了。一个著名的例子发生在火星任务上。在\
  \ 1997 年 7 月完美着陆后，飞天器的计算机往往每天重置一次，工程师们感到困惑。一旦他们追踪到了问题，才意识到他们以前见过这个问题。在发射前的测试中，重置确实发生过，但因为工程师正在处理无关的问题而被忽略了。因此，他们被迫在后期处理这个问题，而那时机器已经处于数千万英里之外，修复起来更加困难。\n\
  \n### 获取堆栈回溯。尽管调试器可以探测运行中的程序，但它们的常见用途之一是检查程序崩溃时的状态。当崩溃发生时不要忽略它，因为在太晚之前，它可能不会再次发生了了。一个著名的例子发生在火星任务上。在\
