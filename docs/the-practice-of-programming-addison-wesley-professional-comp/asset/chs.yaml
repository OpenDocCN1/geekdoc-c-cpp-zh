  ```\n\n如果不遵循所有可能的路径，几乎不可能弄清楚这是做什么的。这种形式虽然长，但更容易遵循，因为它让路径变得显式：\n\nif (LC == 0 &&\
  \ RC == 0)\n    child = 0;\nelse if (LC == 0)\n    child = RC;\nelse\n    child\
  \ = LC;\n```\n（注：由于原文文本在此处不完整，此处根据逻辑补全了翻译的结构。）\n\n\n尽可能在多个编译器上尝试它，看看在实践中发生了什么。\n\
  \n## 1.3. 一致性与惯用法\n\n一致性带来更好的程序。如果格式发生不可预测的变，或者遍历数组的循环这次向上运行，下一次却向下运行，或者这里用 `strcpy`\
  \ 复制字符串，那里用 `for` 循环，这些变化会让你更难看清到底发生了什么。但如果相同的计算每次出现时都以相同的方式进行，那么任何变化都意味着真正的差异，是值得注意的差异。\n\
  \n使用一致的缩进和括号风格。缩进显示了结构，但哪种缩进风格最好？左大括号应该和 `if` 在同一行，还是在下一行？程序员们一直对程序的布局争论不断，但具体的风格远没有其应用的一致性重要。选择一种风格（最好是我们的），并一致地使用它，不要浪费时间在争论上。\n\
  \n\n点击此处查看代码图像\n\n```c\nif (month == FEB) {\n    if (year%4 == 0)\n        if (day\
  \ > 29)\n            legal = FALSE;\n    else\n            legal = FALSE;\n}\n```\n\
  \n缩进具有误导性，因为 `else` 实际上连接在 `if (day > 29)` 这一行，代码是错误的。当一个 `if` 紧随另一个 `if` 时，始终使用大括号：\n\
  \n点击此处查看代码图像\n\n```c\n    if (year%4 == 0) {\n        if (day > 29)\n          \
  \  legal = FALSE;\n    } else {\n        if (day > 28)\n            legal = FALSE;\n\
  \    }\n}\n```\n语法驱动的编辑工具可以降低这类错误的发生概率。\n\n然而，即使修复了错误，这段代码仍然难以理解。如果我们使用一个变量来保存二月的天数，计算过程将变得更容易理解：\n\
  \n点击此处查看代码图像\n\n```c\nif (month == FEB) {\n    int nday;\n    if (year%4 == 0)\n\
  \        nday = 29;\n    if (day > nday)\n        legal = FALSE;\n}\n```\n\n代码仍然是错误的——2000\
  \ 年是闰年，而 1900 年和 2100 年不是——但这种结构更容易调整以使其完全无误。\n\n\n使用惯用法来保持一致性。就像自然语言一样，编程语言也有惯用法，即经验丰富的程序员编写代码的约定方法。学习任何语言的核心部分就是建立对其惯法的熟悉。\n\
  \n最常见的惯用法之一是循环的形式。考虑 C、C++ 或 Java 中遍历数组的 `n` 个元素的代码，例如为了初始化它们。有人可能会这样写循环：\n\n```c\n\
  i = 0;\nwhile (i <= n-1)\n    array[i++] = 1.0;\n\n或者这样：\n\n```c\nfor (i = 0; i\
  \ < n; )\n    array[i++] = 1.0;\n```\n\n甚至这样：\n```c\nfor (i = n; i >= 0; )\n   \
  \ array[i] = 1.0;\n```\n\n这些都是正确的，但惯用形式应该是：\n\n```c\nfor (i = 0; i < n; i++)\n```\n\
  \n这并不是任意的选择。它访问了从 `0` 到 `n-1` 索引的 `n` 元素数组的每个成员。它将所有的循环控制都放在 `for` 中，按增加顺序运行，并使用非常惯用的\
  \ `++` 运算符来更新循环变量。母语者无需学习就能识别并正确编写它。\n\n在 C++ 或 Java 中，一种常见的变体包含了循环变量的声明：\n\n```cpp\n\
  for (int i = 0; i < n; i++)\n    array[i] = 1.0;\n\n这里是 C 语言遍历列表的标准循环：\n\n点击此处查看代码图像\n\
  \n```c\nfor (p = list; p != NULL; p = p->next)\n    ...\n```\n同样，所有的循环控制都在 `for`\
  \ 中。对于无限循环，我们优选\n\n```c\nfor (;;)\n    ...\n```\n\n但\n\nwhile (1)\n    ...\n```\n\
  \n也很流行。不要使用这些以外的形式。\n\n缩进也应该是惯用的。这种不寻常的布局会破坏可读性，它看起来像三个语句而不是循环：\n\n```c\n    ap\
  \ = arr;\n    ap < arr + 128;\n)\n{\n    *ap++ = 0\n}\n```\n\n标准循环更易读：\n点击此处查看代码图像\n\
  \n```c\nfor (ap = arr; ap < 128; ap++)\n    *ap = 0;\n```\n\n铺开的布局会将代码推到多个屏幕或页面上，从而破坏可读性。另一种常见的惯用法是将赋值嵌套在循环条件中，如下：\n\
  \n\n```c\nwhile ((c = getchar()) != EOF)\n    putchar(c);\n```\n\n`do-while` 语句的使用远不如\
  \ `for` 和 `while`，因为它至少执行一次，测试发生在循环的底部。在很多情况下，这种行为是一个等待触发的错误，正如这段 `getchar` 循环的重写：\n\
  \n```c\n    c = getchar();\n    putchar(c);\n} while (c != EOF);\n```\n\n由于测试发生在调用\
  \ `putchar` 之后，它会产生多余的输出。`do-while` 循环只有在循环体必须执行一次时才是正确的；我们稍后会看到示例。\n\n使用惯用法的一个优势是它可以引起对非标准循环的注意，这是问题的征兆：\n\
  \n\n```c\nint i, *iArray, nmemb;\niArray = malloc(nmemb * sizeof(int));\nfor (i\
  \ = 0; i <= nmemb; i++)\n    iArray[i] = i;\n```\n\n为 `nmemb` 个项目分配了空间 `iArray[0]`\
  \ 到 `iArray[nmemb-1]`，但由于循环测试是 `<=`，循环会越界并覆盖存储在下一个位置的内容。不幸的是，这类错误通常在损害发生很久之后才被检测到。\n\
  \n\n\n大多数 C 和 C++ 环境都提供了一个库函数 `strdup`，它使用 `malloc` 和 `strcpy` 创建字符串的副本，使得避免这种错误变得简单。遗憾的是，`strdup`\
  \ 并不是 ANSI C 标准的一部分。\n\n顺便提一下，原始代码和修正后的版本都没有检查 `malloc` 的返回值。为了关注重点，我们省略了这一改进，但在实际程序中，应该始终检查\
  \ `malloc`、`realloc`、`strdup` 或任何其他分配例程序的返回值。\n\n***对于多路分支，请使用 `else if`。*** 多路分支的惯用表达方式是一系列\
  \ `if` ... `else if` ... `else` 链，如下所示：\n\nif (*condition[1])\n    statement[1]\n\
  else if (*condition[2])\n    statement[2]\n    ...\nelse if (*condition[n])\n  \
  \  statement[n]\nelse\n    default-statement\n\n`conditions` 从上到下读取；一旦满足第一个 `condition`，就会执行随后的\
  \ `statement`，然后跳过该结构的其余部分。`statement` 部分可以是一个语句，也可以是一组用大括号括起来的语句。最后一个 `else` 处理“默认”情况，即没有选择其他任何备选方案。如果默认情况下不需要操作，可以省略末尾的\
  \ `else` 部分，尽管保留它并带有错误信息可能有助于捕获那些“不会发生”的情况。\n\n将所有的 `else` 子句垂直对齐，而不是将每个 `else`\
  \ 与对应的 `if` 对齐。垂直对齐强调了测试是顺序执行的，并防止它们超出页面右边界。\n\n一系列嵌套的 `if` 语句序列通常是代码拙劣的警告，即便不是显性的错误：\n\
  \n点击此处查看代码图片\n\nif (argc == 3)\n    if ((fin = fopen(argv[1], \"r\")) != NULL)\n\
  \        if ((fout = fopen(argv[2], \"w\")) != NULL) {\n            while ((c =\
  \ getc(fin)) != EOF)\n                putc(c, fout);\n            fclose(fin); fclose(fout);\n\
  \        } else\n            printf(\"Can't open output file %s\\n\", argv[2]);\n\
  \    else\nelse\n    printf(\"Usage: cp inputfile outputfile\\n\");\n```\n\n这种 `if`\
  \ 序列要求我们在脑中维护一个执行测试的推栈，记录执行了哪些测试，以便在合适的点弹出它们，直到确定相应的操作（如果我们还记得住的话）。由于最多只会执行一个操作，我们真的希望使用\
  \ `else if`。改变决策的顺序可以得到一个更清晰的版本，在这个版本中我们还修正了原始代码中的资源泄漏：\n\n点击此处查看代码图片\n\n```c\n\
  \    printf(\"Usage: cp inputfile outputfile\\n\");\nelse if ((fin = fopen(argv[1],\
  \ \"r\")) == NULL)\n    printf(\"Can't open input file %s\\n\", argv[1]);\nelse\
  \ if ((fout = fopen(argv[2], \"w\")) == NULL) {\n    printf(\"Can't open output\
  \ file %s\\n\", argv[2]);\n    fclose(fin);\n} else {\n    while ((c = getc(fin))\
  \ != EOF)\n        putc(c, fout);\n    fclose(fout);\n}\n```\n\n我们向下读取测试直到第一个 true\
  \ 测试，执行相应的操作，并在最后一个 `else` 之后继续。规则是尽可能通过其关联的操作紧密跟进每个决策。或者换句话说，每当你做一个测试时，就做些事情。\n\
  \n尝试重用代码片段往往会导致程序紧密耦合：\n\n点击此处查看代码图片\n```c\nswitch (c) {\n    case '-':  sign =\
  \ -1;\n    case '+':  c = getchar();\n    case '.':  break;\n    default:    if\
  \ (!isdigit(c))\n                return 0;\n}\n```\n这在 `switch` 语句中使用了一种巧妙的穿透（fall-through）序列来避免重复某行代码。这也不符合惯用法；`case`\
  \ 几乎总是应该以 `break` 结束，除非是少数注释过的例外情况。更传统的布局和结构更易读，尽管更长：\n\n```c\nswitch (c) {\n  \
  \  case '-':\n        sign = -1;\n        /* fall through */\n    case '+':\n  \
  \      c = getchar();\n    case '.':\n        break;\n    default:\n        if (!isdigit(c))\n\
  \            return 0;\n}\n```\n\n尺寸的增加被清晰度的提升所抵消。然而，对于这种不寻的结构，一系列 `else if` 语句甚至更清晰：\n\
  点击此处查看代码图片\n\n```c\nif (c == '-') {\n    sign = -1;\n} else if (c == '+') {\n  \
  \  c = getchar();\n} else if (c == '.') {\n} else if (!isdigit(c)) {\n}\n```\n\n\
  当多个 `case` 具有相同的代码时，使用穿透是可以接受的；惯用的布局如下：\n\n```c\nswitch (c) {\n    case '0':\n \
  \   case '1':\n        break;\n}\n```\n\n**练习 7。** 以更清晰的方式重写这些 C/C++ 段：\n\n点击此处查看代码图片\n\
  \n```c\nelse if (istty(stdout))\nelse if (istty(stderr))\n    return(0);\nretval\
  \ != SUCCESS;\n\nfor (k = 0; k < 5; k++) scanf(\"%lf\", &dx);\n```\n\n**练习 8。**\
  \ 识别此 Java 段中的错误并用惯用的循环修复它：\n点击此处查看代码图片\n\n```java\nint count = 0;\nwhile (count\
  \ < total) {\n    count++;\n    if (this.getName(count) == userName()) {\n     \
  \   return true;\n    }\n```\n\n## 1.4 宏\n\n旧的 C 程序员倾向于编写宏而不是函数来执行短计算；I/O 操作如 `getchar`\
  \ 和字符测试如 `isdigit` 是官方认可的示例。原因是性能：宏避免了函数调用的开销。这个理由在 C 定义之初很无力，那是机器缓慢且函数调用昂贵的时代；今天这已无关。\n\
  \n***避免函数宏。*** 在 C++ 中，内联函数使函数宏变得必要；在 Java 中，没有宏。在 C 中，它们产生的问题比解决的问题要多\n\n函数宏最严重的问题之一是，定义中出现多次的参数可能会被多次求；如果调用中的参数包含带有副作用的表达式，就会导致细微的错误。这段代码尝试实现\
  \ `<ctype.h>` 中的一个字符测试：\n点击此处查看代码图片\n\n```c\n#define isupper(c) ((c) >= 'A' && (c)\
  \ <= 'Z')\n```\n\n注意参数 `c` 在宏体中出现了两次。如果在这样的上下文中调用 `isupper`，\n\n```c\n```\n\n那么每当输入字符大于等于\
  \ `A` 时，它都会被丢弃并读取另一个字符来测试是否等于 `Z`。C 标准编写得非常仔细，允许 `isupper` 和类比函数作为宏，但前提是它们保证只求值一次，因此这种实现是损坏的。\n\
  \n\n\n\n使用 `ctype` 函数总是比自己实现它们更好，而且不嵌套像 `getchar` 这样具有副作用的例程是更安全的。将测试重写为使用两个表达式而不是一个可以使代码更清晰，并有机会显式地捕捉文件结束（EOF）：\n\
  \n\n```c\nwhile ((c = getchar()) != EOF && isupper(c))\n    ...\n```\n\n有时候多次求值会导致性能问题而不是直接的错误。考虑这个例子：\n\
  \n点击此处查看代码图像\n```c\n#define ROUND_TO_INT(x) ((int) ((x)+(((x)>0)?0.5:-0.5)))\n \
  \   ...\nsize = ROUND_TO_INT(sqrt(dx*dx + dy*dy));\n```\n\n这将导致平方根计算的频率比所需的两倍。即使对于简单的参数，像\
  \ `ROUND_TO_INT` 体体这样的复杂表达式也会翻译成许多指令，这些指令应该封装在一个函数中，以便在需要时调用。在每次出现的地方实例化宏会使编译后的程序变得更大。（C++\
  \ 的内联函数也有这个缺点。）\n\n**给宏体和参数加括号。** 如果你坚持使用函数宏，请务小心。宏通过文本替换工作：定义中的参数被调用处的参数替换，而结果作为文本替换原始调用。这与函数之间有一个棘手的区别。表达式\n\
  ```c\n1 / square(x)\n```\n\n如果 `square` 是一个函数，则它运行良好；但如果它是像下面这样的宏，\n\n点击此处查看代码图像\n\
  \n```c\n```\n\n该表达式将展开为错误的：\n\n```c\n1 / (x) * (x)\n```\n\n宏应该重写为：\n点击此处查看代码图像\n\
  \n```c\n#define square(x)   ((x) * (x))\n```\n\n所有这些括号都是必要的。即使正确地为宏加了括号，也没有解决多次求值的问题。如果一个操作足够昂贵或常见而被封装，请使用函数。\n\
  \n在 C++ 中，内联函数在避免语法麻烦的同时，提供了提供了宏可能提供的任何性能优势。它们适用于设置或检索单个值的短函数。\n**练习 1-9。** 识别此宏定义中的问题：\n\
  \n点击此处查看代码图像\n\n```c\n#define ISDIGIT(c) ((c >= '0') && (c <= '9')) ? 1 : 0\n```\n\
  \n## 1.5 魔数\n**魔数（Magic numbers）** 是出现在程序中的常数、数组大小、字符位置、转换因子和其他字面数值。\n\n**给魔数命名。**\
  \ 作为一个准则，除 `0` 或 `1` 之外的任何数字都可能是魔数，并且应该有自己的名称。程序源中的原始数字没有指示其重要性或来源，使得程序更难理解和修改。这段用于在\
  \ 24x80 光标寻址终端上打印字母频率直方图的程序片段，由于大量的魔数而变得晦晦涩：\n\n点击此处查看代码图像\n\n```c\nfac = lim /\
  \ 20;     /* 设置缩放因子 */\nif (fac < 1)\nfor (i = 0, col = 0; i < 27; i++, j++) {\n\
  \    col += 3;\n    k = 21 - (let[i] / fac);\n    star = (let[i] == 0) ? ' ' : '*';\n\
  \    for (j = k; j < 22; j++)\n        draw(j, star);\n}\ndraw(23, 2 '); /* 轴标签\
  \ */\nfor (i = 'A'; i <= 'Z'; i++)\n```\n\n代码包含了数字 `20`、`21`、`23` 和 `27`。它们显然是相关的……真的吗？事实上，有三个数字对这个程序至关重要：`24`，屏幕行数；`80`，列数；以及\
  \ `26`，字母表中的字母数量。但这些数字都没有出现在代码中，这使得这些数字看起来像是有魔术。通过给主要数字命名，我们可以让代码更容易跟进。例如，我们发现数字\
  \ `3` 来自 `(80−1)/26`，且 `let` 应该有 `26` 个条目而不是 `27`（这是一个由 1 索引坐标导致的差错误）。在进行另外一些简化后，结果如下：点击此处查看代码图像\n\
  \n```c\nenum {\n    MINROW  = 1,      /* 顶部边缘 */\n    MINCOL  = 1,      /* 左边缘 */\n\
  \    MAXROW  = 4,      /* 底部边缘 (<=) */\n    LABELROW = 1,    /* 标签位置 */\n    NLET\
  \    = 26,     /* 字母表大小 */\n    HEIGHT  = MAXROW - 4,  /* 柱状高度 */\n    WIDTH   =\
  \ (MAXCOL-1)/NLET  /* 柱状宽度 */\n};\n...\nfac = (lim + HEIGHT-1) / HEIGHT;   /* 设置缩放因子\
  \ */\nif (fac < 1)\n    fac = 1;\n    if (let[i] == 0)\n        continue;\n    for\
  \ (j = HEIGHT - let[i]/fac; j < HEIGHT; j++)\n        draw(j+1, star);\n}\ndraw(MAXROW,\
  \ COL, ' ');\n```\n\n\n\n```c\n    name[i] = 0;\n    x = 0;\n```\n\n而是：\n\n```c\n\
  \    name[i] = '\\0';\n    x = 0.0;\n```\n\n我们更倾向于使用不同的显式常量，将 `0` 留给字面量整数零，因为它们指示了该值的使用，从而提供了一定的文档说明。然而，在\
  \ C++ 中，`0` 而不是 `NULL` 是空指针的表示法。Java 通过定义关键字 `null` 来表示不引用任何内容的对象引用，最好地解决了这个问题。\n\
  \n**使用语言来计算对象的大小。** 不要对任何数据类型使用显式大小；例如，使用 `sizeof(int)` 而不是 `2` 或 4。出于相似的原因，`sizeof(array[0])`\
  \ 可能比 `sizeof(int)` 更好，因为如果数组类型发生变化，需要修改的地方就少。\n\n`sizeof` 运算符有时是避免为决定数组大小的数字发明名称的方便方法。例如，如果我们写\n\
  点击此处查看代码图片\n\n```c\n    char buf[1024];\n    fgets(buf, sizeof(buf), stdin);\n```\n\
  \n缓冲区的大小仍然是一个“魔数”，但它只出现了一次，在声明处。可能不值得为本地数组的大小发明一个名称，但编写即使在大小或类型变化时不需要更改的代码绝对是值得的。\n\
  \n\n点击此处查看代码图片\n\n```java\n    char buf[] = new char[1024];\n    for (int i = 0;\
  \ i < buf.length; i++)\n        ...\n```\n\n\n点击此处查看代码图片\n\n```c\n    #define NELEMS(array)\
  \ (sizeof(array) / sizeof(array[0]))\n    double dbuf[100];\n    for (i = 0; i <\
  \ NELEMS(dbuf); i++)\n        ...\n```\n数组的大小只在一个地方设置；如果大小发生变化，代码的其他部分就不会改变。在这里对宏参数进行多次求值没有问题，因为不会产生副作用，而且实际上计算是在程序编译时完成的。这是宏的一个适当用法，因为它完成了函数无法做的事情：从声明中计算数组的大小。\n\
  \n**练习 1-10。** 你会如何重写这些定义以最大限度地减少潜在错误？\n\n点击此处查看代码图片\n\n```c\n    #define FT2METER\
  \      0.3048\n    #define METER2FT      3.28084\n    #define MI2KM         1.609344\n\
  \    #define SQMI2SQKM     2.589988\n```\n\n## 1.6. 注释\n\n注释旨在帮助程序的阅读者。通过说代码已经显而易见的内容、与代码矛盾或通过复杂的排版显示分散阅读者的注意力，并不能提供任何帮助。最好的注释通过简要指出突出细节或提供过程更宏观的视角，来帮助理解程序。\n\
  \n**不要对显而易见的事啰嗦。** 注释不应该报告自言不讳的信息，例如 `i++` 增加了 `i` 这一事实。这里是我们最喜欢的一些毫无价值的注释：\n点击此处查看代码图片\n\
  \n```c\n    /*\n     * default\n     */\n    default:\n        break;\n    /* 返回成功\
  \ */\n    zerocount++;    /* 增加零项计数器 */\n    /* 初始化 \"total\" 为 \"number_received\"\
  \ */\n    node->total = node->number_received;\n```\n\n所有这些注释都应该删除；它们是冗余。注释应该添加代码中显而易见的内容，或者将分散在源码中的信息收集到一个地方。当发生微妙的情况时，注释可能会阐明这一点，但如果操作是显而易见的，用文字重述它们是没有意义的：\n\
  \n点击此处查看代码图片\n\n    while ((c = getchar()) != EOF && isspace(c))\n        ;   /*\
  \ 跳过空格 */\n    if (c == EOF)      /* 文件末尾 */\n        type = endofile;\n    else\
  \ if (c == '(') /* 左括号 */\n        type = leftparen;\n    else if (c == ')')  /*\
  \ 右括号 */\n        type = rightparen;\n    else if (c == ';')  /* 分号 */\n    else\
  \ if (is_op(c))  /* 运算符 */\n        type = operator;\n    else if (isdigit(c)) /*\
  \ 数字 */\n        ...\n```\n\n这些注释也应该删除，因为良好的命名已经传达了信息。\n\n**注释函数和全局数据。** 注释确实*可以*是有用的。我们可以注释函数、全局变量、常量定义以及任何其他需要简要总结的地方。全局变量往往在程序中间歇性出现；需要时注释可以帮助理解。这里有一个来自第\
  \ 3 章的例子：\n点击此处查看代码图片\n\n```c\n    struct State { /* 前缀 */\n        char *pref[NPREF];\
  \ /* 前缀 */\n        Suffix *suf;      /*后缀 */\n        State *next;      /* 哈希表中的下一个\
  \ */\n    };\n```\n注释每个函数设置了背景。如果代码不是太长，一个单行注释就足够了：\n\n点击此处查看代码图片\n\n```java\n \
  \   // random：返回 0..r-1 范围内的整数\n    int random(int r)\n    {\n        return (int)(Math.random()*r);\n\
  ```\n\n有时代码很难，可能是因为算法复杂或数据结构错综。在这种情况下，指向来源的注释会有帮助。解释为什么某些决定是有价值的。此注释介绍了用于 JPEG 解码器的极其高效的反散余弦变换（DCT）实现。\n\
  \n点击此处查看代码图片\n\n```c\n    /*\n     * idct：8x8 散余弦变换的整数实现\n     * 每个 DCT 需要 11 次乘法，29\
  \ 次加法\n     * 符合 IEEE 1180-1990\n     */\n    static void idct(int b[8*8])\n   \
  \ {\n        ...\n    }\n```\n\n\n**不要注释糟糕的代码，重写它。** 注释异常或可能困惑的内容，但当注释超过了代码时，代码可能需要修复。这个示例使用长而混乱的注释和条件编译调试语句来解释单个语句：\n\
  \n点击此处查看代码图片\n\n```c\n    /* 如果 \"result\" 为 0 则找到了匹配，返回真（非零）。\n       否则，“result\"\
  \ 为非零，返回假（零）。 */\n    #ifdef DEBUG\n        fflush(stdout);\n    #endif\n    return(!result);\n\
  ```\n\n否定形式很难理解且应该避免。部分原因在于变量名 `result` 缺乏信息量。一个更具描述性的名称 `matchfound` 使注释变得不再必要，同时也清理了打印语句。\n\
  \n点击此处查看代码图片\n\n    #ifdef DEBUG\n        printf(\"*** isword returns matchfound\
  \ = %d\\n\", matchfound);\n        fflush(stdout);\n    #endif\n    return matchfound;\n\
  ```\n\n\n\n```c\n#endif\nreturn matchfound;\n```\n\n不要与代码产生矛盾。大多数注释在编写时与代码是一致的，但随着\
  \ Bug 的修复和程序的演进，注释往往保持了原样，导致与代码不一致。这可能是对本章开头那个示例中出现不一致现象的最可能的解释。\n\n无论分歧的来源是什么，与代码矛盾的注释都是令人困惑的，许多调试过程都因为一个错误的注释被误认为是真理，而无谓地延长了调试时间。当你更改代码时，请确保注释依然准确。\n\
  \n\n点击此处查看代码图像\n\n```c\ntime(&now);\nstrcpy(date, ctime(&now));\n/* get rid of trailing\
  \ newline character copied from ctime */\ni = 0;\nwhile(date[i] >= ' ') i++;\n```\n\
  \n一种改进方法是用更符合习惯的方式重写代码：\n\n点击此处查看代码图像\n\n```c\ntime(&now);\nstrcpy(date, ctime(&now));\n\
  for (i = 0; date[i] != '\\n'; i++)\n    ;\ndate[i] = '\\0';\n```\n\n代码和注释现在达成了一致，但两者都可以通过变得更直观来改进。问题在于删除\
  \ `ctime` 在其返回的字符串末尾的换行符。注释应该说明这一点，代码也应该这样做：\n\n点击此处查看代码图像\n\ntime(&now);\nstrcpy(date,\
  \ ctime(&now));\n/* ctime() puts newline at end of string; delete it */\ndate[strlen(date)-1]\
  \ = '\\0';\n```\n\n最后一个表达式是 C 语言中移除字符串最后一个字符的惯用方法。代码现在简短、符合习惯且清晰，而注释通过解释为什么需要那段代码支持了它。\n\
  \n阐说明，而不是制造困惑。注释旨在帮助读者理解困难部分，而不是制造更多障碍。这个示例遵循了我们的原则：对函数进行注释并解释不寻常属性；另一方面，该函数是 `strcmp`，而不寻常属性对于当前任务是边缘性的，任务是实现一个标准且熟悉的接口：\n\
  点击此处查看代码图像\n\n```c\nint strcmp(char *s1, char *s2)\n/* string comparison routine\
  \ returns -1 if s1 is */\n/* above s2 in an ascending order list, 0 if equal */\n\
  /* 1 if s1 below s2 */\n{\n    while(*s1==*s2)  {\n        s1++;\n        s2++;\n\
  \    }\n    if(*s1>*s2) return(1);\n    return(-1);\n}\n```\n\n当需要很多几个字才能解释发生了什么时，通常说明代码应该重写。在这里，代码或许可以改进，但真正的问题在于注释，它几乎和实现代码一样长，而且也令人困惑（哪一边是“上方”？）。我们说这个例程难以理解可能有些牵强过甚，但由于它实现了一个标准函数，它的注释可以通过总结行为并告诉我们定义源自何处来帮助；这些就足够了：\n\
  点击此处查看代码图像\n\n```c\n/* strcmp: return < 0 if s1<s2, > 0 if s1>s2, 0 if equal */\n\
  /* ANSI C, section 4.11.4 */\nint strcmp(const char *s1, const char *s2)\n{\n  \
  \  ...\n}\n\n学生们被教导注释一切是非常重要的。专业程序员通常被要求注释他们所有的代码。但盲目地遵循规则可能会丢失注释的初衷。注释旨在帮助读者理解程序中那些从代码本身无法易于理解的部分。尽可能编写易于理解的代码；你做得越好，需要的注释就越少。良好的代码比糟糕的代码需要的注释少。\n\
  \n**练习 1-11。** 对这些注释进行评述。点击此处查看代码图像\n\n```cpp\nvoid dict::insert(string& w)// returns\
  \ 1 if w in dictionary, otherwise returns 0\nif (n > MAX || n % 2 > 0) // test for\
  \ even number\n// Write a message\nvoid write_message()\n{\n    // increment line\
  \ counter\n    line_number = line_number + 1;\n    fprintf(fout, \"%d %s\\n%d %s\\\
  n%d %s\\n\", line_number, HEADER, line_number + 1, BODY, line_number + 2, TRAILER);\n\
  \    // increment line counter\n    line_number = line_number + 2;\n}\n```\n## 1.7\
  \ 何必费劲？\n\n在本章中，我们讨论了编程风格的主要关注点：描述性命名、表达式的清晰度、直接的控制流、代码的可读性以及通过约定和惯用法来实现这些点的重要性。很难争论这些是坏事。\n\
  \n但为什么要关心风格？如果程序运行良好，谁在乎它看起来如何？让它漂亮不需要花费太多时间吗？规则是随意的吗？\n\n答案是，良好的代码更容易阅读和理解，几乎更少错误，并且比拼凑在一起从未打磨的代码更短。在为了截止日期发布程序时，很容易把风格推到一边以后考虑。这可能是一个代价巨大的决定。本章中的某些示例说明了如果不关注良好的风格会发生什么。\n\
  \n关键观察是，良好的风格应该是习惯。如果你在编写代码时考虑风格，并花时间进行改进，你就会养成良好的习惯。一旦它们变成自动，你的潜意识就会为你处理许多细节，即使你在压力下产生的代码也会更好。\n\
  ## 补充阅读\n\n正如我们在开头提到的，编写良好的代码与编写良好的英语有很多共同之处。Strunk 和 White 的《写作风格》（Allyn & Bacon）仍然是关于如何写好英语最好的短书。\n\
  \n本章借鉴了 Brian Kernighan 和 P. J. Plauger《编程风格元素》（McGraw-Hill, 1978）的方法。Steve Maguire\
  \ 的《编写可靠代码》（Microsoft Press, 1993）是编程建议的极佳来源。在 Steve McConnell 的《Code Complete》（Microsoft\
  \ Press, 1993）和 Peter van der Linden 的《C 语言编程：深度 C 语言》（Prentice Hall, 1994）中，也有关于风格的有用讨论。\n\
  \n\n\n\n在图形、数据库、解析、数值分析和仿真等专业领域，解决问题的能力关键取决于最先进的算法和数据结构。如果你正在一个对你来说陌生的领域开发程序，你*必须*弄清楚已知的知识，否则你会在浪费时间去做那些别人已经做得很很好的糟糕事情。\n\
  \n每个程序都依赖于算法和数据结构，但很少有程序依赖于发明全新的算法或结构。即使在编译器或网络浏览器这样复杂的程序中，大多数数据结构也是数组、列表、树和哈希表。当程序需要更复杂的结构时，它可能会基于这些较简单的结构。因此，对于大多数程序员来说，任务是了解有哪些适当的算法和数据结构可用，并理解如何在备选方案中进行选择。\n\
  \n简而言之，故事是这样的：只有少数基本算法出现在几乎每个程序中——主要是搜索和排序——即使这些算法通常也包含在库中。同样，几乎每种数据结构都源于几个基础结构。因此，本章涵盖的内容对几乎所有程序员来说都是熟悉的。我们编写了可运行的版本以使讨论更加具体，必要时你可以直接复制代码，但在这样做之前，请先研究该编程语言及其库所提供的功能。\n\
  \n## 2.1 搜索\n\n存储静态表格数据，没有什么能比数组更好的了。编译时初始化使得构造此类数组既廉价又简单。（在 Java 中，初始化发生在运行期间，但除非数组很大，否则这是一个不紧的实现细节。）在一个用于检测糟糕散文中过度使用某些词汇的程序中，我们可以写：\n\
  ```c\nchar *flab[] = {\n    \"actually\",\n    \"just\",\n    \"quite\",\n    \"\
  really\",\n    NULL\n};\n```\n搜索例程需要知道数组中有多少个元素。告诉它的一种方法是将长度作为参数传递；另一种方法（此处使用的）是在数组末尾放置一个\
  \ `NULL` 标记：\n\n点击此处查看代码图像\n\n```c\n/* lookup: 在数组中对单词进行顺序搜索 */\nint lookup(char\
  \ *word, char *array[])\n{\n    int i;\n        if (strcmp(word, array[i]) == 0)\n\
  \            return i;\n    return -1;\n}\n```\n\n在 C 和 C++ 中，字符串数组类型的参数可以声明为 `char\
  \ *array[]` 或 `char **array`。虽然这些形式等效，但第一种更清楚地说明了参数如何被使用。\n\n这种搜索算法被称为*顺序搜索*（sequential\
  \ search），因为它逐个检查每个元素以确定它是否是所需的。当数据量较小时，顺序搜索就足够快了。标准库例程可以对特定数据类型进行顺序搜索；例如，`strchr`\
  \ 和 `strstr` 等函数在 C 或 C++ 字符串中搜索给定字符或子字符串的首次出现；Java 的 `String` 类有一个 `indexOf` 方法，而通用\
  \ C++ `find` 算法适用于大多数数据类型。如果针对你拥有的数据类型存在这样的函数，请使用它。\n顺序搜索很容易，但工作量与要搜索的数据量直接成正比；如果目标项不存在，元素数量增加一倍，搜索时间也会一倍。这是一个线性关系——运行时间是数据量的线性函数——因此这种方法也被称为*线性搜索*（linear\
  \ search）。\n\n以下是从一个解析 HTML 的程序中截取的数组，其规模更具现实性，定义了的一百多个单个字符的文本名称：\n\n点击此处查看代码图像\n\
  \n```c\ntypedef struct Nameval Nameval;\nstruct Nameval {\n    int     value;\n\
  };\n/* HTML 字符，例如 AElig 是 A 和 E 的连字。 */\n/* 值是 Unicode/ISO1046 编码。 */\nNameval htmlchars[]\
  \ = {\n    \"AElig\", 0xc6,\n    \"acute\", 0xc1,\n    \"circ\", 0xc2,\n    /* ...\
  \ */\n};\n```\n\n对于这样较大的数组，使用*二分搜索*（binary search）更高效。二分搜索算法是我们在字典中查找单词的有序版本。检查中间元素。如果该值大于我们要找的值，在前半部分查找；否则在后半部分查找。重复直到找到目标项或确定不存在。对于二分搜索，表格必须是排序的，就像这里所示（这是良好的风格；人们在表中找到东西更快），而且我们必须知道表格有多长。来自第\
  \ 1 章的 `NELEMS` 宏可以有所帮助：\n\n点击此处查看代码图像\n\n```c\nprintf(\"The HTML table has %d words\\\
  n\", NELEMS(htmlchars));\n\n该表的二分搜索函数可能看起来所示：\n\n点击此处查看代码图像\n\n```c\n/* lookup:\
  \ 在表表中对名称进行二分搜索；返回索引 */\nint lookup(char *name, Nameval tab[], int ntab)\n{\n  \
  \  low = 0;\n    high = ntab - 1;\n    while (low <= high) {\n        mid = (low\
  \ + high) / 2;\n        cmp = strcmp(name, tab[mid].name);\n        if (cmp < 0)\n\
  \            high = mid - 1;\n        else if (cmp > 0)\n            low = mid +\
  \ 1;\n            return mid;\n    }\n    return -1; /* 未找到匹配 */\n}\n```\n\n将这一切结合起来，搜索\
  \ `htmlchars` 我们写：\n\n点击此处查看代码图像\n```c\nhalf = lookup(\"frac2\", htmlchars, NELEMS(htmlchars));\n\
  ```\n\n找到字符的数组索引。\n\n二分搜索每一步消除一半的数据。因此，步数与我们将 `n` 除以 2 直到剩余单个元素的次数正比。忽略舍入，这就是 `log[2]\
  \ * n`。如果我们有 1000 个项目，线性搜索需要 1000 步，而二分搜索只需要 10 步；如果我们有一百万个项目，线性需要一百万步，而二分只需要 20\
  \ 步。项目越多，二分搜索的优势越大。超过某些输入规模（这取决于实现方式），二分搜索比线性搜索更快。\n\n## 2.2 排序\n二分搜索只有在元素经过排序后才有效。如果对某个数据集进行多次搜索，先排序一次再使用二分搜索将是有利的。如果数据集是预知的，可以在编写构建程序时使用编译时初始化进行排序。如果不是，则需要在程序运行时进行排序。\n\
  \n最好的排序算法之一是*快速排序*（quicksort），它由 C. A. R. Hoare 于 1960 年发明。快速排序是避免额外计算的极佳示例。它通过将数组划分为小元素来工作：\n\
  \n选择数组中的一个元素（“基准”）。\n\n将其他元素分为两组：\n\n小于基准值的“元素”，\n和\n\n大于等于基准值的“元素”。\n\n递归地对每组进行排序。\n\
  \n当这个过程完成后，数组就有序了。\n\n\n\n\n快速排序是实用且高效的；它已经被广泛研究，并存在无数变体。我们在这里展示的版本只是最简单的实现，但它显然不是最快的。\n\
  \n这个 `quicksort` 函数对一个整数数组进行排序：\n\n点击此处查看代码图片\n\n```c\n    void quicksort(int v[],\
  \ int n)\n    {\n        int i, last;\n        if (n <= 1)  /* 无需处理 */\n       \
  \     return;\n        swap(v, 0, rand() % n);   /* 将基元元素移动到 v[0] */\n        last\
  \ = 0;\n        for (i = 1; i < n; i++)   /* 分划分 */\n            if (v[i] < v[0])\n\
  \        swap(v, 0, last);         /* 恢复基元 */\n        quicksort(v, last);     \
  \ /* 递归排序 */\n        quicksort(v+last+1, n-last-1); /* 处理每个部分 */\n    }\n```\n\n\
  `swap` 操作交换两个元素，在 `quicksort` 中出现了三次，因此最好将其单独写一个函数：\n\n点击此处查看代码图片\n```c\n    /*\
  \ swap: 交换 v[i] 和 v[j] */\n    void swap(int v[], int i, int j)\n    {\n       \
  \ int temp;\n        temp = v[i];\n        v[i] = v[j];\n        v[j] = temp;\n\
  \    }\n\n划分过程选择一个随机元素作为基元（pivot），将其临时交换到前面，然后扫描剩余元素，将比基元小的元素（“小值”）交换到开头（位置 `last`\
  \ 处），将较大的元素交换到末尾（位置 `i` 处）。在过程开始时，刚将基元交换到前面之后，`last = 0` 且元素 `i = 1` 到 `n-1` 尚未检查：\n\
  \n![image](img/033fig01.jpg)\n\n在 `for` 循环的顶部，元素 `1` 到 `last` 严格小于基元，元素 `last+1`\
  \ 到 `i-1` 大于或等于基元，而元素 `i` 到 `n-1` 尚未检查。在 `v[i] >= v[0]` 之前，算法可能会将 `v[i]` 与自身交换；这会浪费一些时间，但不至于需要担心。\n\
  \n![image](img/033fig02.jpg)\n\n\n![image](img/034fig01.jpg)\n\n相同的过程被应用于左、右子数组；当这完成后，整个数组就已完成排序。\n\
  \n快速排序有多快？在最好的情况下，\n\n- 第一遍划分将 `n` 个元素分为两个各约 `n/2` 个元素的组。\n- 第二层将两个每组约 `n/2` 元素的组分为四个每组约\
  \ `n/4` 个元素的组。\n- 依此类推。\n\n这持续大约 `log[2] n` 层，因此最好情况下的工作总量正比于 `n + 2×n/2 + 4×n/4\
  \ + 8×n/8 (... log[2] n)`，即 `n log[2] n`。平均情况下，它只多做一点点工作。习惯上使用以 2 为底的对数；因此说快速排序的时间与\
  \ `nlogn` 成比。这种快速排序的实现对于讲解来说是最清晰的，但它有一个缺点。如果每次选择基元都能将元素值分成几乎相等的组，那么我们的分析是正确的；但如果划分经常不均匀，运行时间可能会增长到\
  \ `n²`。我们的实现使用随机元素作为基元，以减少异常数据导致过多划分的概率。但如果所有输入值都相同，我们的实现每次只划分一个元素，因此运行时间将与 `n²`\
  \ 成比。某些算法的行为很大程度上取决于输入数据。糟糕或不幸的输入可能会导致一个原本良好的算法运行得极慢或消耗大量内存。在快速排序的情况下，尽管像我们这样的简单实现可能运行较慢，但更复杂的实现可以将病态行为的概率降低到几乎为零。\n\
  \n### 2. 库\n\nC 和 C++ 的标准库包含了排序函数，这些函数应该对不利输入具有健壮性，并经过调优以尽可能快速运行。库程序准备好排序任何类型，但作为交换，我们必须适应它们的接口，这可能比我们上面展示的复杂一些。在\
