  - 9.6 使用宏生成代码\n- 9.7 实时编译\n\n\n\n\n在编写错误的算法上浪费了大量时间？\n\n使用了过于复杂的数据结构？\n\n测试了程序但遗漏了一个显而易见的问题？\n\
  \n\n需要让程序运行速度快三倍并占用更少的内存？\n\n在将程序从工作站移动到 PC（或反之）时遇到苦恼？\n\n尝试对别人的程序进行微小改动？\n\n因为看不懂某个程序而将其重写了它？\n\
  \n\n这些事情在程序员身上经常发生。但处理此类问题往往比应该的要困难，因为测试、调试、可移植性、性能、设计方案和风格——即编程的`实践`（practice）——通常不是计算机科学或编程课程的重点。大多数程序员是随着经验的增长随机学习这些知识的，而少数人根本从未学习过。\n\
  \n在一个界面庞大且复杂、工具、语言和系统不断变化、以及对一切都追求更多的无情压力的世界里，人们可能会忽视构成良好软件基石的基本原则——简单、清晰、通用。人们还可能忽略工具和符号的价值，这些工具能使软件创建的某些过程机械化，从而让计算机参与到自身的编程中。\n\
  \n本书的方法基于这些底层且相互关联的原则，这些原则适用于计算的所有层面。它们包括：`simplicity`（简单），保持程序简短且易于管理；`clarity`（清晰），确保人类和机器都能轻松理解；`generality`（通用），意味着在广泛的情况下运行良好，并在新情况出现时能良好适应；以及`automation`（自动化），让机器为我们工作，将我们从琐事中解放出来。通过各种语言观察计算机编程，从算法、数据结构到设计、调试、测试和性能改进，我们可以阐述独立于语言、操作系统或编程范式的通用工程概念。\n\
  \n本书源于多年来编写和维护大量软件、教授编程课程以及与各种类型的程序员合作的经验。我们希望分享关于实际问题的教训，传递我们经验中的见解，并为所有水平的程序员提供更精通、更高效的方法。\n\
  \n\n我们希望这些建议能帮助你编写更好的程序。唯一的前提是你做过一些编程，最好是 `C`、`C++` 或 `Java`。当然，经验越丰富，学习就越容易；没有任何东西能让你在\
  \ 21 天内从新手变成专家。`Unix` 和 `Linux` 程序员会发现某些示例比只用过 `Windows` 和 `Macintosh` 系统的用户更熟悉，但任何环境的程序员都应该发现让生活变得更轻松的东西。\n\
  \n本书由九章组成，每章关注编程实践的一个主要方面。\n\n## 第 1 章 (`#ch01.html_ch01`)\n讨论编程风格。良好的风格对良好的编程如此重要，以至于我们选择首先涵盖它。写得好的程序比写得糟糕的程序要好——错误更少，更容易调试和修改——因此从开始考虑风格是关重要的。本章还介绍了良好编程中的一个重要主题：使用适用于所用语言的惯用法。\n\
  \n算法和数据结构主题是计算机科学课程的核心，也是编程课程的主要部分。由于大多数读者已经熟悉这些材料，我们的处理旨在对几乎出现在每个程序中的少数算法和数据结构进行简要回顾。更复杂的算法和数据结构通常由这些构建块演化而来，因此人们应该掌握基础。\n\
  \n描述了一个小型程序的设计和实现，该程序在真实环境中说明了算法和数据结构问题。程序用五种语言实现；对比这些版本展示了每种语言如何处理相同的数据结构，以及表达能力和性能在语言范围内是如何变化的。\n\
  \n## 第 4 章 (`#ch04.html_ch04`)\n用户、程序和程序部分之间的接口是编程的基础，软件的成功在很大程度上取决于接口设计和实现的优劣。本章展示了一个用于解析广泛使用的数据格式的小型库的演变。尽管示例很小，但它说明了接口设计的许多关注点：抽象、信息隐藏、资源管理和错误处理。\n\
  \n尽管我们努力在第一次就正确编写程序，但 bug 及其调试是不可避免的。本章提供了系统且有效的调试策略和战术。主题包括常见 bug 的特征以及“数字学”（numerology）的重要性，即调试输出中的模式通常预示着问题所在。\n\
  \n## 第 6 章 (`#ch06.html_ch06`)\n测试是尝试获得一种合理的保证，确保程序运行正确并在演进过程中保持正确。本章的重点是手工和机器的系统测试。边界条件测试探测潜在的弱点。机械化和测试脚手架使得投入较少精力进行广泛测试变得容易。压力提供了与典型用户不同的测试方式，并揪出另一类\
  \ bug。\n\n计算机非常快，编译器也足够优秀，许多程序在编写时速度就足够快了。但其他程序太慢，或者占用内存过多，或者两者兼有。本章介绍了一种让程序高效利用资源的有序方法，以便程序在提高效率的同时保持正确和稳健。\n\
  \n## 第 8 章 (`#ch08.html_ch08`)\n涵盖可移植性。成功的程序寿命足够长，其环境会发生变化，或者必须移动到新系统、新硬件或国家。可移植性的目标是通过减少适应新环境所需的更改来减少程序的维护工作。\n\
  \n计算拥有丰富的语言，不仅有我们用于大部分编程通用语言语言还有许多专注于特定领域的专门语言。本章展示了计算中符号性的几个示例，并展示了我们如何利用它来简化程序、引导实现，甚至帮助我们编写编写程序的程序。\n\
  \n要讨论编程，我们需要展示大量的代码。大部分示例是为本书专门编写的，尽管一些小示例改编自其他来源。我们努力写好自己的代码，并直接从机器读文本在六个系统上进行了测试。更多信息可以在\
  \ *The Practice of Programming* 的网站获取：\n\n[`http://tpop.awl.com`](http://tpop.awl.com)\n\
  \n\n\n大部分程序使用 `C` 语言，并包含一些 `C++` 和 `Java` 示例，以及对脚本语言的简短介绍。在最底层上，`C` 和 `C++` 几乎完全相同，我们的\
  \ `C` 程序也是有效的 `C++` 程序。`C++` 和 `Java` 是 `C` 的直系后代，共享了其大部分语法以及大部分效率和表达能力，同时引入了更丰富的类型系统和库。在我们自己的工作中，我们惯常地使用这三种语言，以及许多其他语言。语言的选择取决于问题：操作系统最好用像\
  \ `C` 或 `C++` 这样高效且无限制的语言编写；快速原型通常用命令解释器或脚本语言（如 `Awk` 或 `Perl`）最容易；对于用户界面，`Visual\
  \ Basic`、`Tcl/Tk` 以及 `Java` 强竞争者。\n\n为我们的示例选择语言时存在一个重要的教学问题。就像没有一种语言能同等地解决所有问题一样，也没有一种单一语言最适合展示所有主题。高级语言预先了某些设计决策。如果我们使用低级语言，就可以考虑对问题的替代方案；通过暴露更多细节，我们可以很好地讨论它们。经验表明，即使我们使用高级语言的特性，了解它们如何与低级问题相关也是无价的；没有这种洞察力，很容易遇到性能问题和诡异的行为。因此，我们经常在示例中使用\
  \ `C`，，尽管在实践中我们可能会选择其他语言。\n\n\n无论你用什么语言编写代码，你作为程序员的任务就是利用手头的工具尽而为。优秀的程序员可以克服糟糕的语言或笨拙的操作系统，但即使优秀的编程环境也救不了糟糕的程序员。我们希望，无论你现在的经验和水平如何，这本书都能帮助你编写出更好的程序并更加享受其中。\n\
  \n我们深感谢阅读手稿草案并提供许多帮助性意见的朋友和同事。`Jon Bentley`、`Russ Cox`、`John Lakos`、`John Linderman`、`Peter\
  \ Memishian`、`Ian Lance Taylor`、`Howard Trickey` 和 `Chris Van Wyk` 以极其仔细和彻底的态度阅读了手稿，有些人多次。我们感谢\
  \ `Tom Cargill`、`Chris Cleeland`、`Steve Dewhurst`、`Eric Grosse`、`Andrew Herron`、`Gerard\
  \ Holzmann`、`Doug McIlroy`、`Paul McNamee`、`Peter Nelson`、`Dennis Ritchie`、`Rich\
  \ Stevens`、`Tom Szymanski`、`Kentaro Toyama`、`John Wait`、`Daniel C. Wang`、`Peter\
  \ Weinberger`、`Margaret Wright` 和 `Cliff Young` 在不同阶段对草案提供的宝贵意见。我们也感谢 `Al Aho`、`Ken\
  \ Arnold`、`Chuck Bigelow`、`Joshua Bloch`、`Bill Coughran`、`Bob Flandrena`、`Renée\
  \ French`、`Mark Kernighan`、`Andy Koenig`、`Sape Mullender`、`Evi Nemeth`、`Marty Rabinowitz`、`Mark\
  \ V. Shaney`、`Bjarne Stroustrup`、`Ken Thompson` 和 `Phil Wadler` 的良好建议和周全考虑。感谢大家。\n\
  \n\n*Rob Pike*\n\n\n*有一个古老的观点，最好的作家有时会忽略修辞规则。然而，当他们这样做时，读者通常会在句子中发现某些补偿性的价值，而这种价值是以违反规则为代价的。除非他确定自己能做得更好，否则他可能最好遵循规则。*\n\
  \nWilliam Strunk 和 E. B. White，《*风格要素》\n\n这段代码片段源自多年前编写的一个大型程序：\n\n点击此处查看代码图像\n\n\
  \      if ( (country == SING) || (country == BRNI) ||\n            (country == POL)\
  \ || (country == ITALY) )\n      {\n              /*\n              * 如果国家是新加坡、布鲁莱或波兰\n\
  \              * 那么当前时间就是应答时间\n              * 而不是挂机时间。\n              * 重置应答时间并设置星期。\n\
  \              */\n```\n\n它是经过仔细编写、格式化和注释的，它所属的程序运行得非常好；创建这个系统的程序员们对他们构建的东西感到非常自豪。它是经过仔细编写、格式化和注释的，它所属的程序运行得非常好；创建这个系统的程序员们对他们构建的东西感到非常自豪。\n\
  \n代码是被执行的部分，所以它更有可能是正确的。\n\n由于注释和代码不同，其中必有一个是错误的。代码是被执行的部分，所以它更有可能是正确的；当代码更新时，注释没有更新。\n\
  \n编程风格的原则基于经验指导的常识，而不是任意的规则和处方。代码应该是清晰简单的——直截的逻辑、自然的表达、惯用的语言用法、有意义的名字、整洁的格式化、有帮助的注释——并且应该避免巧妙的技巧和不寻常的结构。一致性很重要，因为如果你坚持相同的风格，其他人更容易阅读你的代码，以及他们自己的代码。可能是由当地习惯、管理规定或程序决定的，但即使不是，遵守一套广泛的共识也是最好的。我们遵循《C\
  \ 语言语言》书中使用的风格，并对 `C++` 和 `Java` 进行了微调。\n我们经常通过坏和好编程的小示例来说明风格规则，因为表达同一事情的两种方式之间的对比具有启发性。这些示例并非人为。。“坏”的示例全部改编自真实代码，由普通程序员（有时是我们自己）在工作过多和时间不足的共同压力下编写的。某些示例为了简洁而经过提炼，但它们不会被歪曲。\n\
  \n```c\n?  #define ONE 1\n?  #define TEN 10\n```\n\n\n\n\n为什么这些 `#define` 值得怀疑？考虑一下如果必须将一个包含\
  \ `TWENTY` 个元素的数组变大，需要进行哪些修改。至少，每个名称都应该替换为能够指示该特定值在程序中作用的名称：\n\n```c\n#define INPUT_MODE\
  \ 1\n#define OUTPUT_BUFSIZE 20\n```\n\n## 1.1. 命名\n\n名字包含了什么？变量或函数名标记了一个对象并传达关于其用途的信息。名称应该是具有信息量的、简洁的、易记的，并且尽可能是可发音的。很多信息来自于上下文和作用域；变量的作用域越广，其名称应该传递的信息就越多。\n\
  \n*全局变量使用描述性强名称，局部变量使用短名称。* 根据定义，全局变量可能出现在程序的任何地方，因此它们的名称需要足够长且具有足够的描述性，以提醒读者它们的含义。在每个全局变量的声明中附上简短的注释也是有帮助的：\n\
  \n\n```c\nint npending = 0;  // 输入队列的当前长度\n```\n\n全局函数、类和结构也应该具有暗示它们在程序中作用的描述性名称。\n\
  \n相比之下，局部变量使用较短名称就足够了；在函数内部，`n` 可能足够，`npoints` 很好，而 `numberOfPoints` 就多此一了。\n\n\n\
  点击此处查看代码图片\n\n```c\nfor (theElementIndex = 0; theElementIndex < numberOfElements;\n\
  \     theElementIndex++)\n    elementArray[theElementIndex] = theElementIndex;\n\
  ```\n\n\n点击此处查看代码图片\n\nfor (i = 0; i < nelems; i++)\n    elem[i] = i;\n```\n\n程序员经常被鼓励无论上下文如何都使用长变量名。这是一个错误：清晰性通常是通过简洁来实现的。\n\
  有很多命名规范和局部习惯。常见的规范包括使用以 `p` 开头或结尾的名称（例如用于指针的 `nodep`）；全局变量（Globals）首字母大写；以及所有常写常量（CONSTANTS）全大写。一些编程公司会使用更广泛的规则，例如使用记法在变量中编码类型和用法信息，可能用\
  \ `pch` 表示指向字符的指针，用 `strTo` 和 `strFrom` 表示将要写入和从中读取的字符串。至于名称本身的拼写，使用 `npending`\
  \ 还是 `numPending` 或 `num_pending` 是一个个人喜好问题；具体的规则远没有一致地遵循某种合理的约定重要。\n\n命名规范让你更容易理解自己的代码，以及他人编写的代码。它们也让你在编写代码时更容易发明新名称。程序越长，选择良好的、具有描述性的、系统化的名称就越重要。\n\
  \nC++ 中的命名空间（Namespaces）和 Java 中的包（packages）提供了管理名称作用域的方法，并有助于在不使用过长名称的情况下保持含义清晰。\n\
  \n*保持一致。* 给相关的事起相关的名称，以显示它们的关系并突显它们的区别。\n\n除了太长之外，这个 Java 类中的成员名称也表现出极度不一致性：\n点击此处查看代码图片\n\
