  md: 'and the power of a V-8 engine. A game you make about driving will likely reflect
    this love. My formative experience with a car was a gas-guzzling jalopy that seemed
    to suck dollars out of my wallet to keep the tank full, I will likely make a very
    different game. Your game version of driving a car may focus on racing around
    a wide track, while mine focus on carefully managing a gas budget so you can reach
    your destination. It is through this process of modeling another system and building
    rules to model it that the game designer embeds meaning in a game.


    Then players dive into the game that the designers created, learning the rules
    and interacting with them. Through play we come to understand the game designer''s
    model of the subject system and thus their interpretation of that aspect of the
    world. Then, when we encounter such systems in the real world, we can see them
    through a new lens. We access to a new interpretive model of the system. If I
    play your racing game, I may come to better understand the attraction of speed,
    while my gas tank simulator may you to think about the frustration of managing
    resources. The mapping needs not be so literal. I may bring that new-found desire
    for riding bikes and you may use your new-aware resource management buying groceries.
    That''s the great thing about procedural games: they become flexible through their
    abstraction.


    This interplay between the systems of the world and the systems of games is very
    powerful. An abstract game like Tetris we think about shapes. A game with largely
    intrinsic meaning like Solitaire may highlight ways items are sorted. As a game
    designer, it could be very interesting to look for systems where you can create
    more direct interplay between the world and the game—where the meaning in the
    game is extrinsic, drawing on meaning commonly found in the world around us. If
    the game keeps running in your head even after playing, encountering similar systems
    and systems in the world can reinforce the power of the game. The world and the
    game begin to amplify one another.


    As we saw Solitaire, many games rely on systems of intrinsic information. To provide
    the data set for the game. JoJo''s Fashion Show, a casual downloadable about fashion,
    relies almost completely on extrinsic information. The choices you make depend
    not on numbers or colors, but you look for garments labeled "three"; you look
    for garments that are actual. The actual sorting and ordering you have to do in
    JoJo''s is much simpler than the sorting in Solitaire. But the process of parsing
    and understanding that information is more complex.


    JoJo''s Fashion Show was one of the games I designed while working at the casual
    game developer Gamelab. I published the game. When we originally started working
