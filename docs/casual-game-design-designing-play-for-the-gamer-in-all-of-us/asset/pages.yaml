    After getting acquainted, sit the players down in front of the computer. Preface
    the session by telling your testers that you want to get their unadulterated feedback.
    There are no right or wrong answers. You''ll be observing their play, and in cases,
    you may not give them much help. You''ll likely be an impassive viewer and, may
    not even answer their questions. Give them as little instruction about the actual
    game as you can get them started. With early prototypes missing key features and
    pieces of the user-interface, it will be necessary to set the stage for the game,
    giving some players key instructions on how to start the executable. But ideally,
    tell as little as possible. You don''t taint your playtest results by telling
    players how to avoid specific problems or by teaching them aspects of the game
    that should be teaching.


    With early prototypes, it can be very helpful to structure the playtest to answer
    one specific question about the game mechanics, rather than to address all aspects
