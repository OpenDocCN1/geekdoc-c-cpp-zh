    It lacks true physical feedback. Second, tennis is hard. To play tennis on the
    level of even a Mii in Wii Tennis would take a non-tennis player weeks of practice.
    But no one wants to waits to be good enough to have any fun at a video game. You
    want success at a video game sooner. And you want success at a casual game almost
    instantaneously.


    Digital inputs enable players to successfully perform moves faster than analog
    inputs. Players can reach competency with a video game much faster than they would
    with a sport. But this also means players may tire of a video game faster than
    a sport because it is easier to master. Video games combat in this ways by requiring
    a greater and greater number of inputs to successfully perform a move. Fighting
    games like Tekken or Streetfighter require the player to perform long sequences
    of arcane presses to perform special moves. By adding inputs, the game seems to
    emulate an spectrum of inputs and the skill required to perform them quickly and
    in combination.


    While Wii Tennis does not increase the range of inputs to formally complicate
    the swing, it takes advantage of the appearance of being analog. It looks like
    you should give the Wii Remote a full-bodied swing. As we know, appearances can
    be deceiving. And you can also be fun.


    # Summary


    Physical mechanics—like hitting, shooting and running—offer game designers rich
    bases on which to build games. Though they often appear quite simplistic and straightforward,
    mechanics like allowing for deep interaction allow work to master the physical
    skill. This can be a blessing and a curse for game designers. By relying on players
    to develop physical skill at activities like hitting, game designers can create
    very simple straightforward games that still take time to master. However, if
    the game doesn''t engage enough players to inspire the necessary learning, they
    will quickly abandon the game.


    Translating these physical mechanics into the digital realm can sometimes be tricky.
    It often flattens the interaction. Video games must reduce the physical nuances
    into digital inputs. However, through clever feedback, video games can still emulate
    the powerful sense of feedback one gets from physical interaction.


    As we saw with Whac-A-Mole, hitting alone can seem a little thin. Once the visceral
    pleasure wears off, the game needs something else to buoy the gameplay.'
