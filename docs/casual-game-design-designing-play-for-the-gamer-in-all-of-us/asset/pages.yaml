  md: 'Physics games complicate the player''s moves. Input and output no longer match
    each other exactly. The physics of the game system stand between your input and
    the output in the game. You can no longer simply think about the move you want
    to make; you must consider how you make move and how physics will affect your
    move. You input your move, and depending on slight variations, it can have a variety
    of outcomes. In this way, physics games are all about reading, understanding and
    internalizing a system of variable input and output.


    The physics of the system often make the right move opaque, so players must learn
    what can and cannot. Because there are a range of forces acting on the objects
    you set in motion, slight changes in the input can drastically differ outcomes.
    If you arrow an extra degree and suddenly the arrow flies beyond its mark. This
    can make physics-based games so frustrating. It often looks like you''re doing
    the same thing—repeating a move—but you get quite a different result.


    To prevent players from growing frustrated, interactions must be kept simple and
    short. To remain calm and friendly to the player, physics-based games must allow
    the player to practice by repeating moves or starting again. To understand how
    the physics system works and interacts, the players must be able to try and try
    again until they get right—they must be able to experiment.


