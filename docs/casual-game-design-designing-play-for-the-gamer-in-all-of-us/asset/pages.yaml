  md: 'SUMMARY


    Using other players to judge outfits is a brilliant use of the social milieu of
    Facebook. The game solves the subjective judging issue that we encountered in
    Jojo''s Fashion Show and Top Chef. In Jojo''s Fashion Show, I created a system
    of attributes to try emulate the way people clothed. This worked well in the single-player
    environment of the PC downloadable game and allowed the player a fair amount of
    leeway to improvise. Because Wear can tap into the ever-shifting trends and opinions
    of players, the system of fashion it presents much more dynamic. It can adapt
    and respond over time. The game uses the collective opinions of the crowd to define
    style.


    What to Wear makes full use of the social dynamics available to game designers.
    In some ways, it takes a simple model to Apples to Apples and invites thousands
    of people to sit around the table and play together. It doesn''t force you into
    directly interaction with other players. Instead it smartly uses the crowd as
    content generators and background noise for each other. You feel like you''re
    playing in a social milieu even though you rarely talk or message with other players.
    Instead, judge their clothes and they judge you. This gives you the feeling of
    community and interaction.


    What to Wear realizes style is ambiguous and subjective. So it''s best left to
    the people to judge and decide.


    # Summary


    What Wear points towards the interesting future possibilities of casual games.
    It traps the social potential of Facebook precisely by avoiding group and team
    play. This works for casual players because it doesn''t impose the heavy burden
    of group coordination on players. You don''t have to organize a specific time
    to meet and play together. You don''t have to coordinate appropriate moves with
    other players. You don''t have to wait at anyone for making a silly move, no worry
    about attracting the fury of some alpha player for making a bad move. Other players
    are necessary in your experience, but they aren''t integral. All of this makes
    the game work well for casual players who want to play when they want to play.
    And now they have to play with them. Loads of them.


    Not all games need to include massive numbers of players to have interesting effects.
    Simple games like Apples to Apples are structured to shock conversation can lead
    to interesting interactions between players. But then so can more formal games
    like poker. None of poker try and reveal the tastes or personalities of the players.
    But as any experienced poker player will tell you, people''s personalities reveal
    themselves during play. From formal to informal systems put players into dialogue
    with one another. They give players tools with which to prod and poke at each
    other and the chance to observe the results. Each new player injects new life
    into the game as you learn their tells and personal strategies.


    233'
