    # Intrinsic Qualities


    Some of the qualities of games are intrinsic to the game. They are established
    and defined by the game itself. These are the qualities the game designer has
    the most control over, because they are the qualities laid out by the actual design
    of the game.


    # Governed by Rules


    Of the six qualities that Caillois offers, rules are the most important. Rules
    are the primary characteristic of games. A game is a system of rules that govern
    behavior. The rules, written down on a piece of paper in a Monopoly board set
    or explained out loud to a bunch of first-time basketball players, provide the
    structure for the game. They exist outside of the actual play of the game. Once
    the game is in play, players interact with the rules and adjust their behavior
    accordingly. At a base level to qualify as a game and not just play, the rules
    must encompass an outcome or goal. The rules must include an end state. Whether
    or not that is considered winning up to the designer of the game.


