  md: 'WHAT TO WEAR: TAPPING THE WISDOM OF CROWDS


    to Wear can emulate we popular opinion affects fashion. With thousands of active
    players submitting outfits and then voting on the outfits other players create,
    the game really feels feels like a fashion show.


    What to Wear was created by Large Animal, a New York-based game developer. Large
    Animal produced a range of different casual games, from Web games to PC downloadables.
    Recently they have focused on creating games for social networks like Facebook,
    Bebo and MySpace. Before creating What to Wear, Large Animal released several
    other social network games, including Bumper Stars, Lucky Strike and Banagrams.
    These were all good games, but they felt fairly straightforward Web games. With
    mechanics like bowling and pool to deliver a contained game experience. In Bumper
    Stars, you shoot a ball around a small game area, bouncing bumpers and picking
    up objects to score points. The game is for a single player. The social aspect
    is limited but with What to Wear, Large Animal has made a game which truly takes
    advantage of the social landscape of Facebook. In many ways, a game like What
    to Wear, designed by Wade Tinney and Daisy Bilrow, along design contributions
    from the entire development team, can only be played on a social network like
    Facebook. This game could not exist without the social elements. They are integral
    to the game system and play. To work properly, it requires a large pool of players
    contributing content and serving as judges for one another.


    The gameplay revolves around a daily contest and involves two activities, making
    an outfit and voting on the others you have created. Each day the game introduces
    a new contest that players must design outfits around. Themes for the contests
    range from "A Housewarming Party" to "A Speed Dating Party" to "Chilling at the
    Mall." provide a brief description of the style challenge and a temperature forecast.
    Then you can dive into the clothes, picking items from the shop and closet. At
    the beginning of the game, you are given a bunch of initial credits. You must
    manage this reserve of credits, as each item in the shop costs credits. And just
    like real life, the really hot clothes cost the most. You''re satisfied with the
    outfit you created, you save it and submit it to the contest. Each contest lasts
    24 hours, giving you time to check in some point during the day and make outfit.


    Once you have finished your outfit, you can vote on the outfits that were submitted
    in the previous day''s contest. The game presents you with two random outfits
    and asks you to say which one matches the best theme. You can apply criteria you
    like, but must choose between the two outfits, and you must choose the entry.
    You can''t, "Love the sweater, the shoes." You have to take the ensemble as a
    whole. This keeps the voting simple and straightforward, enabling you to churn
    through many outfits and cast dozens of votes. In five minutes, it''s possible
    to look at dozens of outfits, each one slightly different and possessing its own
    character. In this way, the game makes excellent use the combinatorial possibilities
    of clothing items. Building an outfit takes time, as you want to pick the right
    items for each layer. But judging an outfit takes only a second.


