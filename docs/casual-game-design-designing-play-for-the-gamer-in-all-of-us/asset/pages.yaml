  md: 'As discussed earlier, Wii Tennis offers a new vision for casual gameplay. The
    game—combined with the Wii hardware—drew in players who had little interest in
    video consoles. It promised and delivered a more physical play. You can argue
    that the motion detection software is not terribly robust and that it has largely
    served to enable mini-games. But this misses the fact that a lot of people still
    swing the Wiiote even though they know they don''t need to. And better than that,
    it''s instantly. You don''t have to go through a long learning process to see
    the complexities of the game in order to appreciate the play.


    The game does a great job of translating hits on screen. A really good, well-hit
    serves zooms near the net, leaving a trail of ghostly balls. The designers also
    make hitting relatively straightforward. Players don''t need to run to the ball.
    They just need to swing at the right time. Since the game doesn''t require a specific
    motion—just a general change in force—players can easily pick up the game and
    play without learning a specific motion to hit the ball. However the game leaves
    some room for improvement. Players can improve their timing, hitting the ball
    at just the right moment to improve their hits.


    The simplicity intentionally built into Wii Tennis limits its long-term ability.
    The game definitely enables players to improve their swings. But a swing in Wii
    Tennis offers less complexity than hitting a real tennis ball. This is not to
    fetishize simulation or to suggest that Wii Tennis would realistically real tennis.
    It should do such thing. Wii Tennis is designed to draw players onto the net,
    not to offer long-term strategic gameplay.


    The lack of scalable skill in Wii Tennis points to a contrast between physical
    games and digital games. Physical games have analog inputs, meaning the input
    operates on a spectrum. There is an infinite number of ways to bounce a ball or
    swing a tennis racket. Each of a real-world tennis racket is comprised of small
    adjustments and movements from your grip to the length of your wind up, each contributing
    to how the ball reacts on impact. This spectrum of inputs leads to a greater number
    of outputs. In this way, real-world physical games have a wide variety of outcomes.
    Players practice and practice so they can better replicate the outcomes. They
    spend years doing this. As they master their sport, they learn to use the minor
    adjustments to get the exact outcome they want.


    Video games have digital inputs—they are either on or off. Either you press A
    or you don''t press A. You may press A closer to the right moment, but you don''t
    press A with more or less skill. Board games generally have these sorts of digital
    or on/off inputs. This pushes video games to be more about decision-making than
    physical skill. This they doesn''t require skill. They require quite a bit of
    skill, but of a very different nature than physical play. They require good timing
    combined with decision making. Many video games resort to exacting timing and
    spatial puzzles that players must play and repeat until they solve them. But this
    is more like asking a player to memorize and recognize patterns that build up
    a skill. This means many video games must e long-term play out of decisionmaking
    and not mastering a specific physical skill.'
