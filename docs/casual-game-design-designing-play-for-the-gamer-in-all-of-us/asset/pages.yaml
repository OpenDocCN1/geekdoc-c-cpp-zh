  md: '# # CHAPTER TEN


    # ## Constructing


    Games provide great laboratories for experimentation. They exist in a space largely
    free of real-world consequences. When you first come to a game, you have only
    a vague idea of how things will play out once the game is set in motion. You look
    at the board and, "I see, I should buy as many of these properties as I possibly
    can, develop these two cheap right by GO," only to find out as you play the game
    Baltic and Mediterranean Avenue barely earn you two pennies. That''s okay. Now
    you know and the next time around you can experiment with buying different properties.
    Games enable you to take quantifiable actions, observe the results and then develop
    new strategies. You get to see the direct results of your actions. You get to
    develop theories about what will work better and test those theories in a closed
    environment free of consequences.


    You get design a building without worrying if it will truly be able to stand.
    Or you run down a tunnel full of hostile aliens, be killed, respawn and run down
    a different tunnel instead. Critics of games bemoan this lack of consequences
    as one of the key deficiencies of games. They believe that players, particularly
    kids, take away from the games that they can simply restart a level if they get
    into trouble. These critics see this as a dangerous level because no do-overs
    exist in real life.


    But this freedom from what are really more consequences should actually be celebrated.
    Games may teach kids how to do things over and over again until they get right,
    but this is actually a really important notion to grasp. What games teach is something
    close to the scientific method. You get to formulate an hypothesis about what
    will work and then devise a means to test that hypothesis. You get to say to yourself,"If
    I jump over and flip this switch, I''ll win the level." And when that doesn''t
    work the way you expected, you can say, "Okay, now I know that platform is too
    far away. I wonder if I jump instead and then, if that will get me to the switch."
    This process teaches kids to experiment and develop systematic problem-solving
    skills.


    Games don''t lack consequences. If anything, they are nothing but chains of actions
    and consequences. What they lack are moral consequences. And are quite a burden
    to expect games to bear. Games themselves are agnostic to morality. As in all
    forms of media, the morals in a game reflect the moral viewpoint of the author.'
  merge: -1
