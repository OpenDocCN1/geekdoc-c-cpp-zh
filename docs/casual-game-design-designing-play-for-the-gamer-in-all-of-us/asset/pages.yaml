    # Be Concise and Exact


    Be as concise and exact as possible. Clearly state what will happen when a game
    event occurs. Unclear rules confuse and frustrate players. Many players will simply
    abandon a game before starting if the rules are unclear. In addition, be careful
    not to contradict yourself with rules.


    If you say a player has power-up, define exactly how many rounds or seconds the
    player can use the power-up. If someone loses or gains points, define exactly
    how many points. If you generalize by saying “When you place the paint bomb, it
    changes the color of the gems,” players will have idea how many gems change color,
    nor what color they take. It is much better to say, “When you place the paint
    bomb, it changes the color of all gems in horizontally and vertically squares
    to a color of the player’s choosing.” This way, the outcome is clearly defined.


    # Be Firm


    Your rules should not leave room for argument. The game system governs the game.
    It dictates to how to play it. People expect that of rules. Deliver that.


    Use strong language “will” instead of “may.” This will become increasingly important
    when you begin to write specifications for your game.


    In addition, you don’t want players to interpret your rules during play. They
    will wind up arguing with each other, sucking the life out of your game. You want
    them to stay lodged in the game system you create. Stepping out to argue about
    rules snaps out of the game. It’s like seeing the boom mike dip—it ruins the illusion
    of the game.


    # Can’t vs. Must


    It''s easy to think of rules as just a list of “Can’t Dos.” Pawns can’t move backwards;
    you can’t touch the ball with your hands; you can’t move while holding the basketball
    unless you drib. You will certainly need to have a number of Can’t Dos in your
    list of rules, if you have too many, it may feel claustrophobic to players. Can’t
    Do also do a poor job of telling the player what or she can do, how he or she
    should actually be playing the game. Rather than simply thinking of Can’t, structure
    your rules as Musts. Instead of saying, “You can’t move while holding the basketball,
    unless you dribble,” try, “To move with the basketball, you must dribble.” This
    makes the rule more affirmative and begins to help the player see what type of
    actions the game wants him or her to take.'
