    # Craft the Rules


    Rules provide the skeletal framework for the game they can create. They give your
    game structure and solidity. They tell the players what they can and cannot.

    Once the team has settled on a concept, the designer writes the rules and fleshes
    out the game. It might seem silly to write rules for a video game, but it''s still
    an important exercise. It often seems like video games don''t have rules so much
    as interfaces. The software defines what the player can and cannot do, so the
    player doesn''t need to know the rules. It''s true, the game guides the player,
    but the software still follows rules. As the game designer, you must define the
    behavior so you can write the software specifications for the programmer. Writing
    out the actual rules to the game serves as a good starting point for thinking
    about the software specifications.


    There is no perfect way to write rules for a game, but there are lots of ways
    to wind up with a confusing set of rules. Before you write your rules, make sure
    you have a clear idea of how the game plays and what experience you want the players
    to have. Craft your rules accordingly. Keep your audience in mind. For example,
    hardcore board gamers are much willing to pore through and study a long booklet
    of rules than most casual gamers. In my experience, most people want to get going
    with the game as soon as possible. They view rules as an unfortunate impediment
    to playing, not the intricate and careful crafting of experience that game designers
    do. As always, it''s best to give your audience what they want, not necessarily
    what you want.


    Some general guidelines for writing rules:


    +   * Be concise and clear

    * Be firm

    * Can''t vs. must

    * Instructions are rules too

    * Avoid too many special cases

    * State the game''s goal upfront

