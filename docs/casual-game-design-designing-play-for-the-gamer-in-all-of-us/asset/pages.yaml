  md: The chance to interact, explore and have fun together amplifies the engagement
    of a game. Suddenly playing, performing well and winning carry deeper meaning.
    You aren't simply vying to beat the game system; you are playing to beat someone
    else. Or perhaps you are working together, forming bonds as a team or band. In
    both instances, playing with someone else gives the play context outside of the
    game. It's not simply between you and the game anymore. Now it involves game bragging
    rights and social status. Tapping into social status outside the game gives game
    designers powerful tools to increase engagement within the game. After all, winning
    a single-player game feels like an accomplishment; beating your friends feels
    like a triumph.
