  md: '# CHAPTER TWELVE • SOCIALIZING


    12.10


    ![](img/d6f534b7476a11d93281f19d476f720d_248_0.png)


    **Almost as as equal importance as creating your outfit is voting on the outfits
    other players have created. Player votes provide the engine that powers the game''s
    scoring system.** (Reproduced by permission of Large Animal Games.)


    Best of all, the judge is never wrong. The voting mirrors the choice made by the
    judge in Apples to Apples. In the case of What to Wear, you have thousands of
    judges, each applying their own sense of style to the other outfits. The game
    tallies the votes for all of the outfits and the one with the most wins. *What
    to Wear* encourages you to vote for more outfits by rewarding you with credits
    and Style Points for each. The more credits you earn, the more clothes you can
    buy in the shop. In typical role-playing game fashion, earning Style Points levels
    you up, which in turn rewards you with new clothing items. The designers know
    that if players don''t vote, the game won''t work. So they highly incentivize
    you to spend time reviewing outfits, by making it both easy and lucrative. Plus
    applying your judgment is fun. It''s fun to look at clothes and say, “That''s
    hot! That''s not!”


