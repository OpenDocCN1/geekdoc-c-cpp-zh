    # Sorting


    Every minute of our lives we are bombarded with information. Our brain grapples
    with all of this data in an endless battle to parse it all into some meaningful
    form. Much of it we ignoring. Some of it chunk into larger symbols that are easier
    to read than the individual parts (like the way we know to stop as soon as we
    see a red octagon and white letters before we read the Stop). And some of it we
    have to read line by line, like the book you''re holding. We order all of this
    information any number of ways, by relevance, by degree, and by sexual appeal.
    It''s a so natural that we scarcely realize we do.


    We''re experts at parsing information it''s no wonder we enjoy games that explicitly
    involve sorting. They enable us to practice a natural skill; they challenge our
    ability; they even make us better at reading the world. Sorting is another one
    of those natural activities that game designers have figured out how to mold into
    games. And games have traditionally proven very popular.


    Sorting manifests itself in a number of different ways. Solitaire and games of
    Patience focus on literal sorting of symbols reveal only to the game. Despite
    using the same set of cards, each variation of Solitaire produces a different
    experience, from slow meditative to hair-pulling anxiety. The popular iphone game
    Drop 7 gives you 7 to sequence and sort. It sounds incredibly simple, yet it is
    also quite addictive. The game shows how you can create an engaging, complex experience
    when asking players to perform a relatively simple sort—counting from 1 to 7.
    Word games like Scrabble, Bookwork and Wurdle leverage a broader set of knowledge
    by having players build worlds from jumbles of letters. Games like Fashion Show
    focus the use of contextual knowledge even making gameplay into nebulous style
    categories. And these are just a few of the ways sorting can be applied in games.


    Sorting makes for natural casual gameplay because it doesn''t require the player
    to develop a new skill. Rather it leverages mental skills the player already possesses.
    In sorting games you don''t have to learn to aim a gun with a joystick; you don''t
    have to learn to carefully time jumps in a platformer or play a plastic guitar.
    Rather, you do something you do every day. Read, parse and act upon information.
    In actuality, you do this in every game. Games are all about reading information
    from the game system and deciding how to act. But sorting games make this process
    explicit.'
