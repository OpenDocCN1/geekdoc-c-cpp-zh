    # Organize Play into Phases


    Your game should have a natural rhythm to it. Each move should sensibly lead to
    the next action. This will help players move smoothly through the game. This doesn''t
    mean each move needs to be one simple click or roll of the dice. If your game
    requires more complex interaction patterns, breaking each turn into phases. A
    lot of complex board games does this. This helps chunks and instructions into
    more understandable moments. For example, the excellent game Settlers of Catan
    breaks the game into a number of different phases, each with a set of instructions.
    Each turn player takes is broken into three different phases: the Raw Material
    Production Phase, the Trade Phase and the Build Phase. Each phase has unique actions
    associated with it and involves each player in the game in different ways. By
    breaking each turn into these three phases, players can develop a rhythm to their
    play. Players know when to pay attention and when they can tune out.


    It also makes the rules easier. The player can digest each phase in turn, rather
    than trying to understand, all at once, all of the rules of collecting materials,
    with trades and building new resources.


    This sort of organization can be valuable in video games as well. A game with
    several step process can benefit by laying out each move as a series of steps
    or phases. This will help players finalize the structure of the game and navigate
    through the UI. The easier it is to understand and make moves, the more effort
    the player can expend on strategy and gameplay.


