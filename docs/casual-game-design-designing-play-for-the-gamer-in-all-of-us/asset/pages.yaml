  md: 'In fact, the beginner version of baseball, T-ball, does away with the pitch
    and jumps straight to the hit. Because at the center of baseball lays the sheer
    act of whacking something as hard as you can.


    In talking with game designers, I sometimes have picked up on a note of disdain
    for hitting as a mechanic. It is easy to write off the swinging of a stick or
    the smashing of your hand into another object as an uninteresting act of sheer
    brute force. The sentiment seems to be that hitting is so simple and basic that
    little can be said or explored around. This denies the sheer fun of hitting as
    a mechanic. It ignores the subtleties of a basic play mechanic like hitting. Hitting
    ranges from easy to incredibly difficult, often within the same game. Just look
    at any sport that involves hitting and you''ll see the incredible range of complexity
    that is embodied in each swing. Reducing boxing to "punching your opponent" ignores
    all of the myriad types of punches, feints and jabs that exist. Once you get the
    spectacle of two humans punching each other, you realize that boxing is an incredibly
    technical sport with a complex array of hits, jabs and cuts. The joy that comes
    from hitting, combined with the way it scales to ability, makes the mechanic of
    hitting worth a second look by game designers. Hitting is a great example of play
    mechanic that scales directly into a robust game mechanic.


    # Natural Feedback


    Our parents trained us well. It''s a little uncouth to admit how much fun it is
    to hit. We''ve endured countless admonishments from our parents, crying out, "No,
    hitting!" I would peruse to say that we''ve all felt the joy of picking up a stick,
    hefting it from hand to hand, judging its weight and strength, and smashing it
    against a rock or another tree and watching it splinter. Or maybe we pick a pebble
    on the beach with our stick and watch it out over the water. Why is this expression
    of force so pleasurable? Well, in some measure it has to do with the feedback.


    When expressed, hitting has a very clear result and feedback. If done properly,
    the thing moves clearly in the opposite direction. Having such clear outcome is
    immensely attractive. There is no ambiguity.


    It''s infinitely satisfying to watch that stick splinter into a million pieces
    just after you give it a whack. Successfully hitting something provides clear
    and direct feedback. Either you accomplished what you set out, or you missed it
    and failed. There is clear and direct feedback to your actions. Clear feedback
    amplifies gameplay, making it more legible. Players understand the consequences
    of their actions and make informed decisions based on that understanding. You
    toss a rock in the air and swing your stick at it. If you see the rock sail through
    the air, you know you hit it. If the rock drops to the ground, you know you missed.


    Hitting things clearly falls into the category of physical play. We hit things
    in some part to explore them, to test their strength and to see what they are
    made'
