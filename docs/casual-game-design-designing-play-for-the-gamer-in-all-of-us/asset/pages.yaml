  md: '# Whac-A-Mole: 30 Seconds of Primal Pleasure


    Hitting as a mechanic finds an almost primal expression in the family arcade game
    Whac-A-Mole (Figure 8.2).


    ![](img/d6f534b7476a11d93281f19d476f720d_177_0.png)


    FIGURE 8.2


    Aaron Fletcher created Whac-A-Mole in the early ''70s. Fletcher sold the game
    to a carnival operator who later sold the game to Bob''s Space Racers who continue
    to manufacture the game and other arcade machines to this. In 1980, Fletcher helped
    co-found Showbiz Pizza Place, which became one of the main buyers of his old game
    Whac-A-Mole. Showbiz eventually merged with Nolan Bushnell'' Chuck E. Cheese''s
    Pizza Time Theatre (he of Pong and Atari fame).

    Whac-A-Mole is in a large cabinet. The player stands in front of the game holding
    a large mallet. The goal of the game is to score as many points as possible by
    bopping moles on the head. Moles pop out of holes in the cabinet. The player tries
    to hit each mole before the head retreats back down the hole. After a mole is
    struck, it retreats. The player scores points for each mole hit, and the points
    appear on the three-digit readout atop the cabinet. Each mole appears for a limited
    amount of time and retreats automatically if the player does not hit the mole.
    The game starts slow but quickly speeds up, with more popping up for shorter periods
    of time. The game lasts for a limited amount of time. On repeat plays, you can
    try to best your own score.


    In some ways, it''s an excellent example of a casual game. The second you pick
    the mallet, you know exactly what to do. As soon as the moles start


