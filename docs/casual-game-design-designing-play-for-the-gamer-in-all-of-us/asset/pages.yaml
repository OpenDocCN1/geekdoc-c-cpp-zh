- img_proc: true
  md: 'To complicate matters, the game players in multiple types of chaining. You
    can chain actions on customers, as well as matching customer color to seat colors.
    Lining up of all these actions can get complicated, and a bit stressful, when
    those customers'' hearts start to disappear.


    Initially, the game does not require you to chain. The score thresholds are low
    enough that you can gain by merely serving customers on an ad hoc basis. The game
    teaches you to chain from the very start, but it does not require it. But as the
    game progresses, the score thresholds rise, forcing the player to confront the
    rewards and risks of chaining. This adds tension to the gameplay. Eventually,
    to pass certain levels, the player must chain. At this point, the dominant strategy
    becomes the dominant strategy of the game. Until this point, the dominant strategy
    (or in this case, the path of least resistance) was to churn through as many customers
    as quickly as possible; the new dominant strategy requires you to chain in order
    to maximize points to win the level. The game now teaches you that the path to
    success is through chaining.


    In later levels, the play shifts yet again and it becomes better to quickly serve
    customers and ignore chaining. This ever-shifting set of strategies keeps the
    game fresh. The different created by the spinning planes mechanic and the chaining
    mechanic give the game designer a number of levers to pull to create differences
    from level to level. Nick Fortuno, the game designer behind Diner Dash, mild this
    tension, giving the level progression a feeling of evolution.


    Chaining wouldn''t work, however, if the player were simply being rewarded for
    doing things in the same order as the main mechanic requires. It would reinforce
    the main mechanic, not add tension to the game. If the game rewarded you with
    bonus points for following the path of least resistance, the game would become
    boring, as it would make the dominant strategy even more obvious, robbing you
    of any need to make strategic decisions.


    Chaining is a very clear way to shape player actions. The designer can lay out
    a specific chain of actions, effectively saying, "This is the order I want to
    do things in, if another element of the game says them in a different order."
    It also gives the game designer a clear way to say, "I know you want to do this,
    but you might want to do this." The game designer can lay out these multiple options,
    then leave it to you, the player, to choose which path you want to win. This gives
    you a meaningful choice that directly impacts your experience in the game.


    Chaining asks you to push luck to see how long you can accomplish both goals before
    having met the requirements of the main mechanic. The longer you keep a chain
    going, the more rewarding (and thus more exciting) the game grows.


    Many other games use some form of chaining to help shape the experience. Time
    management games use some form of chaining to add tension to the game. We used
    forms of chaining in Jojo''s Fashion Show to help shape the levels and add tension.
    Players scored bonus points in Jojo''s Fashion Show if they sent out models dressed
    in the same style in a row. They received an even bigger bonus if they could fully
    dress all three models and send them out without making changes to their outfits.
    This incentivized players to quickly dress models and really consider whether
    they wanted to change an outfit to give a model a higher scoring'
