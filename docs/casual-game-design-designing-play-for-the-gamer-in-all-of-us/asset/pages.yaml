    toward making piles that will win the game. You sort cards and you stack the cards
    from ace to king in four piles. Having already made the stacks in the opposite
    order from king to ace the foundation stacks makes the final step of placing them
    on foundation piles clear and easy. These mechanics can make it feel like you''re
    playing Klondike Solitaire on auto-pilot. There is a point halfway through when
