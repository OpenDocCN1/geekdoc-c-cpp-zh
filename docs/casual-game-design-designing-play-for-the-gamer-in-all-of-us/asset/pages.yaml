    # Playtest the Game


    The game designer must continuously play the game as it moves through each iteration.
    By the time the game launches, you won''t be able to stand playing the game anymore.
    But you will have an almost innate understanding of the game system. As the game
    designer, you must also watch others play the game and learn from their play.
    You take notes on where they succeed and where they fail, where they have fun
    and where they grow bored. You must do all of this with lips sealed. You''ll want
    to give players hints on how to play the game, but you won''t. In the end, when
    the game ships, you won''t be there to provide strategic hints to every player.
    The game must teach the player without your help. To produce a game that effectively
    teaches players playtesting, tweaks to the UI, gameplay and tutorials and more
    playtesting.


    Different companies have vastly different tools for playtesting, depending on
    their resources. A company like Microsoft working on a A-title like Halo 3 can
    afford very cool tools for playtesting, as creating statistical maps that reveal
    where players are dying and running all of regression on their data. Other teams
    must take a more low-budget approach, as offering pizza to playtesters and old-fashioned
    pencil and paper. In both cases, though, the general philosophy and approach are
    the same. Observe dispassionately as possible, record moments and places where
    players falter and get stuck, turn this analysis into action items to revise in
    the game. Then do it all again.'
