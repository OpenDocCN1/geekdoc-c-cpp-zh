  md: '# Refine the Concept


    No game is born fully formed. Every concept and game needs refinement to reach
    its full potential. The game designer must listen to the concerns of playtest,,
    team members and publishers and then synthesize all of their comments. From all
    of this feedback, the game designer must lay out a path for changing the game
    if necessary. Often, prototypes show that what you thought would be fun isn''t.
    Instead, some minor feature actually provides the joy in the game. In these cases,
    the designer must be willing to adapt his or her vision to the realities of the
    prototype. You''ll make dozens of false starts. But if you''re willing to prototype,
    refine and throw out ideas that don''t work, you''ll eventually come to something.


    At times, the game designer will need to stay the course if he or her believes
    the game is on the right path and become fun with the implementation of certain
    features. The game designer must not just play the actual prototype, but be able
    to extrapolate and play the imagined game in his or her head. This can be very
    hard, but it''s essential for you to be able to look at a game and begin to play
    out the possibilities in your head.


    This is the sort of skill that requires a fair amount of patience and experience.
    When designers start out, they need to be inflexible about their designs. The
    more you work with your team on different games, the more you will come to trust
    and utilize the opinions of others.


    Just remember that your game and concept will need refinement. No book reads perfectly
    on first. The rough cut of a movie is often a complete mess in dire of editing.
    Games are the same way, possibly more. They require an iterative process to build.
    A game is an interactive conversation between the game system and the player.
    The two sides need to react and dialogue with each other. During development,
    the designer needs to dip into the part of the game system for that conversation,
    listening to what the player has to say and responding with the appropriate refinements.


    # Design the Levels


    Once the game system has been laid out, the game designer will need to build levels.
    Level design is the meat and potatoes of game design, where the designer crafts
    the moment-to-moment user experience. In level design, the game designer finally
    starts all of the knobs and variables they asked the programmers to build. Tweaking
    these variables in different combinations, the game designer hopes to make a fun
    experience with just the right amount of challenge. The game designer must be
    willing to make levels with only a partial set of tools while waiting for the
    game to be fleshed out. Often these levels must be trashed as new features become
    available. But constantly exploring the potential and limitations of the game
    system as it is built will help keep the game on track and focused on the most
    important features—those that actually make the game fun.'
