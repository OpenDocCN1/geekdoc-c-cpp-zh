    in reading and reacting to others. Just figuring out if someone is telling the
    truth an implicit goal; figuring the answer and calling them out can be incredibly
    satisfying. Adding rules and game structure can amplify the tension and excitement.


    However, it also poses risks to the consistency of the game. The more the game
    relies on social interactions, the more dependent it becomes on the players and
    their ability and willingness to relate to one another. As opposed to physical
    play with quantifiable outcomes, social play can feel a bit shaky and subjective.
    Designers can address the subjectivity and the reluctance of players to fully
