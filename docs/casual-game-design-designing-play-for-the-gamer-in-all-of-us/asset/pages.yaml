    # Give Players Room to Explore


    Levels that introduce a new feature focus on teaching the player the basics of
    using the feature. Completing the level should require the player to interact
    with the new feature in some basic and straightforward way. You want the players
    to see the basic utility of the item, be it a power-up or new move. Forcing them
    to use it will help them use the feature and break them out of their established
    playing pattern.


    In the next level, use the feature again, but open the play to let the players
    explore other aspects of the feature. If it''s a power-up, give them the chance
    to explore the different facets and ways they could use the power-up. The first
    interaction teaches them the basics; the second teaches them to creatively apply
    their new tools.


    # Occasionally Break Your Own Rules (With Care)


    Once you have set patterns in your game, you can break your own rules. Do this
    with care. You don''t want to call into doubt the entire system of meaning you
    have created for players. The occasional shift in the patterns of the game can
    surprise and delight your player. It keeps the gameplay fresh and enables the
    players to feel they have creatively applied the mechanics of the game.


    Breaking your own rules should be done with care. You don''t want the game to
    seem arbitrary. You still want it to read like there is a logic to the game.


    # Create a Plan


    Just as you would outline a level or screenplay, it''s crucial to outline your
    level structure. Lay out where you think you will introduce different concepts,
    powerups, enemies and content to the game. Make sure this level plan fits with
    the overall narrative and goals of the game. Make a big spreadsheet or list with
    an entry for every level in the game, detailing what elements will be used. Outlining
    the whole game helps you craft the overall experience of the game, progressing
    the game in complexity and difficulty. It will also help you see which elements
    you are using often and which you are ignoring.'
