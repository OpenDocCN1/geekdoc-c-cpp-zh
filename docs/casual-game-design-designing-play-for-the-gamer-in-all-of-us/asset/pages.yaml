  md: '# CHAPTER SIX • SEEKING


    But this simplicity also points to the limitations of building a game entirely
    around seeking. It offers little in the way of strategic complexity and replayability
    for adults with longer memories. Scavenger hunts are closer to games. Once you
    find the hidden objects, you can''t really play the game again. You have already
    solved the game.


    Still, hidden object games have tortured players for ages. From the back cover
    of Highlights magazine exporting you to find mistakes in the scene, to the 16th
    century Dutch painter Hans Holbein placing a large distorted skull across the
    front of his painting The Ambassadors (Figure 6.2), artists have long challenged
    viewers to decode images. As he painstakingly painted the ceiling of the Sistine
    Chapel and Michelangelo sly included the likeness of his enemies burning in Hell.
    So seeking and finding hidden objects in art has a long—if not particularly kind—history.


    I must admit that while I sometimes find myself engrossed in hidden object games,
    I don''t find them particularly fun. As games, they generally lack strategic depth.
    Instead of developing strategy, you find yourself reduced to squinting and cursing
    as you scan through a morass of illogical objects strewn about the game. The seek-and-find
    mechanic offers less for creativity than matching or most other casual mechanics.
