    # Jojo''s Fashion Show: Sorting the World Through Play


    Games have an amazing ability to install themselves in our brains and take over
    parts of our thoughts. When I intensely play a game for a while, I often find
    that even after putting the game down, it keeps running in my mind. I don''t actually
    remember the first time I played Doom. But I remember trying to go to sleep the
    first night I played Doom. I couldn''t. Because my dreams were full of aliens
    out for my blood. No, it was every time I shut my eyes to sleep my mind with the
    walls and the distinctive gliding movement of a first-person shooter. I was effortlessly
    gliding forward and backward down hallways and corners. My brain couldn''t stop
    playing the game.


    This mental replaying happens with other games too. When I play Tetris I find
    I''m still rotating blocks in my head hours later. Sometimes other shapes, like
    sofas and tables, take on the likeness of Tetris pieces in my mind''s eye and
    I find myself staring them wondering how I tightly pack them into a corner. It''s
    as if games are software we install in our brains. We turn on the system by learning
    the rules. And sometimes it keeps running in the background after we''ve stopped
    playing. Moving through the mechanics of a game is a process, one that you do
    over and again within a game. As you play more and more, this process becomes
    more and more innate to the point where you no longer have to think about it to
    perform the process. The process becomes absorbed into our larger operating system
    for life.


    This sort of residual processing is one of the distinctive ways which games stick
    with us; the way they share meaning within our thoughts. Perhaps the absorption
    and mental reapplication of a game mechanic or process is equivalent of a rich
    character from a novel cropping up in our thoughts after finishing the book. Playing
    the game in your head is the game version of finding yourself what ever became
    of Holden Caulfield or Ian Denisovich.

    The game designer and scholar Ian Bogost argues that games create meaning procedurally.
    Designers pick a subject or then create a set of rules that mimics the subject
    matter. The original system the designer models could be anything from driving
    to city planning to airport security, as Ian did in Airport Insecurity. Of course,
    everyone will interpret the aspects of the system differently and each designer
    will choose different aspects or model in their game. You may have grown racing
    cars and so you love the feel of the open road


    118'
