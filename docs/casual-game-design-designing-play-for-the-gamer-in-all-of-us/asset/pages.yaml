  md: '# CHAPTER FIVE SORTING


    Because the letter tiles in Wurdle are not destroyed and replaced after you use
    them, the play focuses on quickly iterating through every variation of word or
    set of letters. So you quickly connect T-A-R. Then reverse and grab A-R-T. Then
    for the next word you quickly grab T-A-R-S. And if you''re lucky enough to have
    another T within distance then grab T-A-R-T; T-A-R-S; A-R-T and S-T-A-R-T. From
    start to finish a game of Wurdle, the player is working through the same set of
    letters. Starting the next game the tiles shuffle and a new grid of letters appears
    to work.


    The concept of replacement is a key issue in games and game designers must pay
    careful attention to when crafting them. It comes up not in word games, but card
    games and any other game with limited resources. The issue of replacement is most
    evident in card games. Think of how important it is for the balance of a game
    that new cards are not inserted into the deck to replace a new card was added
    in for each one taken out, it would be possible to end up with a few of kind comprised
    of 3 of Spades, a 3 of Clubs, a 3 of Hearts and two 3 of Diamonds or some other
    fact. Card games rely on being only one of each card at any given time. A game
    goes through an increased randomness as cards are played and removed from the
    deck. This enables players to eventually make more informed guesses as to what''s
    coming up. Replacement comes all the time in video games. Wurdle and Bookworm
    provide a clear example.


    Each game of Wurdle is a frenetic race through all of the possible variations
    available in the grid. You can set the length of your game from one to five minutes.
    Then you simply race to the clock to as many points as possible. Your incentive
    lies primarily in beating your own high score. As you play, you begin to recognize
    common word patterns in the jungle of letters. Because vowels are more limited
    and should be sprinkled among the consonants at a higher rate, patterns emerge.
    Using vowels as bases for words, you find that you''re constantly tracing the
    same words in different games. You see a vowel then look for consonant on either
    side. From an A, you look all around and find the T and N. You connect them to
    make T-A-N, then quickly A-N-T. You automatically group those common letter combinations
    into words and keep them close to the surface of your brain for quick access in
    each game. When you find one you quickly cycle through all of the variations.
    This enables you to parse the board more quickly. While your subconscious finds
