  md: 'Yet, I admit, I am often engaged.


    The basic mechanic of a seek-and-find game is very simple. Fill the game area
    with a large number of objects, give players a partial list of those objects and
    tell them to find them. The players find and click the object. This object is
    crossed off the list. When the players find all the objects on the list, they
    win. If you want to get really fancy, you can add a timer.


    The rules for a seek-and-find game are even simpler. You can boil them down to
    one rule: Find all of the listed objects before time runs out.


    This simplicity certainly contributes to the popularity of seek-and-find games.
    You come to the game already understanding how to play. Simply looking around
    the world has taught you all you need to know about the game. This makes the game
    user-casual. A seek-and-find game is the basic activity of looking around your
    goal item.


    This game mechanic has been applied to everything from weddings to murder mysteries
    and uses a relatively standard formula. Present the player with a beautiful background
    scene and layer on top of a number of smaller images of objects that the player
    must find. New levels bring back new scenes and objects to find.

    If matching games tap into our desire to find and match patterns, seek-and-find
    games tap into everything we are basic: the desire to find one thing—to spot it
    and say, “There you are!” Instead of looking for patterns, you simply look for
    one object. There can be real joy in discovery, especially if the object is hard
    to find. It''s analogous to the joy-bird watcher feels upon spotting a particularly
    rare what''s-a-moodle. The satisfaction comes in part from the building tension
    and frustration as you search for an object and the release of tension when you
    actually find the object. You could argue that this release of tension is more
    elation than finally finding the object sustained by consistently doing a good
    job. You get the same feeling when you find your misplaced sunglasses on top of
    your head after 10 minutes scouring your apartment. A lot of people enjoy the
    finding. Seek-and-find games make up a significant portion of the casual market
    and have proven consistently popular with a large part of the audience.


    Finding each object is a game unto itself. There is no build-up of moves as in
    a game like Luxor or Snood. Your choices build up upon themselves—each move is
    entirely isolated. This makes seek-and-find games very stop and go. The experience
    stutters from one object to the next, making it hard to build up a sense of flow.
    While not necessary, a sense of continual progress to your actions—that you are
    making moves and increasing challenges—leads players into the flow state. If move
    is unto itself, building up to a state can be


    A strength of seek-and-find games stems from their mutability to different narrative
    content. It is very easy to apply seek-and-find gameplay to different stories
    and themes. Granted, they lend themselves to mysteries. They are often used for
    licensed games, perhaps because a lot of licenses revolve around mysteries.'
