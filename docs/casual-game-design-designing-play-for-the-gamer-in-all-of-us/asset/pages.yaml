  md: '# CHAPTER TWO | THE GAME MECHANIC AT WORK


    First, casual games are small. They can take anywhere from a week to a year to
    develop. This is a stark contrast to the multiple years necessary to develop a
    console game. The short development time for casual games gives you the opportunity
    to work on more games. This prevents you from getting burned out on a game. New
    projects offer fresh challenges and the chance to try new ideas.


    Designing casual games for a broad audience also means your friends and family
    may actually enjoy playing your game, even if they are not hardcore gamers. Casual
    games have the chance to reach a broad audience in the way that only the best-selling
    hardcore games do. So while the Theft Auto franchise has more money than any casual
    game, more people have probably played Jeweled than Grand Theft Auto. Casual games
    with core mechanics designed specifically to appeal to as many people as possible
    have the chance to become genuine pop culture, spreading widely over the Internet
    and gossiped about around the water-cooler. That potential to reach a mass audience
    excites designers.


    Casual games offer more opportunity for innovation. Because they are small and
    less expensive to make, designers can take more risks. They can try new mechanics
    or base the game around off-beat themes and art. Casual games have their tropes
    and limitations, but the landscape often seems much more open than the console
    market. Even console games have hailed for their innovation, like Halo, must just
    refine known mechanics. Halo very improved upon the health meter and system, but
    in the end it has very closely to first-person shooter conventions. Contrast to
    the puzzle game Crayon Physics, where the player draws objects which are transformed
    into physical objects within the game. Crayon Physics was created by the one-man
    development “team” Petri Purho, who designed, programmed and created the art for
    the game. The game grew out of a series of game design experiments by Purho, in
    which he designed and built a new game every seven days. Crayon Physics feels
    much experimental and far afield than any console game. Obviously, a lot of innovation
    happens on console games, but the conventions of established genres and the cost
    of doing business make it very risky. Smaller teams and budgets allow for quicker
    experimentation.


    # Summary


    You want to be a game designer? Well, you''ve probably already taken the initial
    steps. Start with paper games, card games and physical games—things you can do
    on all your own. Then move on to video games. Game designers appreciate good design,
    whether it is in a card game or a video game. The art of game design is not about
    pixels or programming after all. It''s about crafting experiences over rules.
    The rest is practice and implementation. Like any art, to become a game designer
    you must design games. You must make games.


