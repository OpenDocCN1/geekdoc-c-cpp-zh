    # Top Chef: A Game for Self-Expression


    The PC game Top Chef couches expression, construction and creativity in a more
    constrained fashion like Line Rider. Like Top Chef the TV show, Top Chef the game
    seeks to harness the creativity of players by tasking them to create elaborate.


    Each week on Top Chef, contestants vie to create the best meal meeting specific
    challenges. These ask players to work in a variety of styles and ethnic cuisines,
    or with a particular twist or theme. At the end of each show, a panel of judges
    rates the dishes based on taste, presentation and creativity in meeting the requirements
    of the game. Despite all the backbiting and kitchen intrigue, the eating and judging
    is the most exciting element of Top Chef. It''s at this moment the dishes are
    fully revealed. Often, the meals look bizarre and tantalizing at the same time.
    Just looking at them makes your mouth water. Quite an amazing feat, since the
    TV doesn''t allow you to smell or taste any of the food.


    When the game designer Mattia Romeo from Gamel set about designing a downloadable
    version of the game, he wanted to find a way to preserve the feeling of mouth-watering
    ingenuity. A number of earlier cooking games asked players to create dishes by
    following recipes. Players picked out, in order, a bun, lettuce, tomato, cheese
    and a beef patty to build a cheeseburger. These games used a sorting mechanic
    unlike say, Solitaire. To progress, a player had to use the right ingredients
    in order. And this produced some lovely cooking games. None of them produced the
    feeling of creativity that comes with a skilled chef—the joy of going to the pantry
    and choosing any number of ingredients that will produce the flavor and textures
    that you desire. Instead, these cooking games left you feeling like a cook following
    someone else''s recipe over and over again.


    But how do you evoke the feeling of creativity in a video game about food and,
    more importantly, how do you build a game that will judge creativity? If you let
    players build their own recipes out of any item they want, you''ll wind up with
    some bizarre combinations. The more freedom you make the process of creativity
    and construction, the harder it is to quantify and judge. When you have human
