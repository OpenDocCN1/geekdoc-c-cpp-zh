    The game, designed by Kyle Gabler and Ron Carmel, is based on a prototype Tower
    of Goo that Gabler created as part of the Experimental Gameplay Project at Carnegie
    Mellon University. Comparing Tower of Goo to World of Goo, you can trace the development
    of a physics toy into a game.'
