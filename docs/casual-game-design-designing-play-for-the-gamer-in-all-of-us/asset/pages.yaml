    Casual games reset this difficulty curve and invite in unskilled players.


    # Why Now?


    Evolving dynamics, the Internet and general comfort levels with technology—not
    to mention the deep marketing pockets of Nintendo—have all contributed to the
    rise of casual games.


    First off, gamers are getting older. According to a 2006 survey conducted by the
    Entertainment Software Association (ESA), the average age of a gamer is 33. Of
    all gamers, 31 are under 18 years of age, while 44 are between the ages of 18
    and 49. A full 25 percent of gamers are 50 years or older.¹ This means the audience
    for gamers is much more diverse than the stereotype of the teenage gamer. as the
    average gamers have gotten older, they have found they have less time to play
    games. These players now have wives, husbands, kids, jobs, DirectTV and housework
    all competing for their attention. Fitting in a 15-hour marathon of Civilization
    gets harder. But they still want to play something, just in shorter sessions.
    They need to slot gameplay into their lives, not the other way around. Casual
    gameplay—with its short times—meets that need.


    These statistics also suggest audience of gamers is much wider than normally,
    and growing wider all the time. The stereotypical image of a gamer—the anti-social,
    nerdy teenage boy—is quickly disintegrating. This broad audience is bound to have
    a wide range of tastes. Unexpected to many is the fact that women make up 38 percent
    of the gaming population.


    The Internet is probably the biggest driver behind the growth of casual gameplay.
    We are spending more time online. Much of that time is probably looking for something
    to do. And games often fill that need. The 2006 ESA study found that 44 percent
    of frequent gamers play online, just 19 percent in 2000. So what are they playing?
    More than half of all games played online are puzzle/board/game show/trivia or
    card games, or squarely within casual gamers. This dwarfs the 22 percent playing
    action/sports games.


    Casual gameplay is particularly suited to the Internet. We consume in small chunks,
    from two to three-minute YouTube videos to blog posts, as we jump back and forth
    between our e-mail and work. As a result of playing games in Web browsers with
    Gmail beckoning from another tab, games need to make low-attention demands and
    offer quick rewards. It''s very hard for a game (or anything really) to capture
    their full attention. This “continuous partial attention,” as the writer Linda
    Stone says ¹¹ prevents us from devoting our full attention to any thing for very
    long.¹² This makes it very hard to play a hardcore game like


