    # Jenga plays into our natural play instinct with blocks: build up till they collapse.


    How does the friction of the wood affect the tower when you pull out a piece?
    How much downward force is being exerted on the lower pieces as opposed to the
    upper pieces?


    Jenga taps into the natural drama of building a tower of blocks and amplifies
    it. When we play with blocks, even as kids using wooden ABCs or adults stacking
    more elaborate pieces of machinery, one of our first instincts is always to see
    how high we can stack the blocks before they topple. Leslie Scott, the designer
    of Jenga, recognized the drama in the moment of collapse and sped up the play
    to that moment. From there proceeds directly toward collapse by demanding players
    remove pieces from the foundation of the tower and add them to the top (Figure
    11.8). This makes collapse inevitable. It''s just a matter of not being the one
    to cause it. So every move, even the early ones, feels fraught with tension. With
    each pull, every player stares and asks themselves, “Is this the one? When it
    falls?”


    In other physics-based games, the gameplay revolves around learning and control.
    The player learns which pieces buttress others and which ones can more safely
    removed. The player also garners skill at actually removing pieces, developing
    a steady hand and sure fingers. The rules of the game don''t take long to master,
    but mastering the interaction does. In this, physics-based games are one of the
    few games that really feel skilled.


    Physics-based games open up a wide variety of possibilities for a game very cheaply.
    Once the developer has built the physics engine, they can use that system to create
    a number of different interactions using the same rules. Objects can be shot,
    thrown, bounced and stacked, among many other things. The trick is adding meaningful
    and interesting goals to accompany the physics.'
