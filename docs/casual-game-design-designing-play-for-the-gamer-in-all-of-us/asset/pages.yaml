  md: 'Beyond these exercises, start making your own paper games. Many start their
    lives as prototypes sketched out with pen and paper. Paper prototyping enables
    you to quickly test ideas to see if the general mechanic is fun. Building non-digital
    games, from board games to card games to new sports, exercises your design muscles
    forces you to confront general problems that you''ll encounter again and again
