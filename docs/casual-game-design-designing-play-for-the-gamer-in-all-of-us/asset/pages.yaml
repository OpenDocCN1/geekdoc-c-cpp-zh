    # Casual Queens versus Genre Kings


    So why casual and why not? What''s wrong with a good old fashioned first person
    shooters (FPS) full of screeching aliens and thick-necked space marines? Nothing.
    That is, if you''re a gamer. but if you''ve spent the last 20 years playing video
    games or don''t have 15 hours to dedicate to gaming every week, you will find
    pretty confounding. Over the course of their development, video games have grown
    increasingly complex and hard to use. Just look at an Xbox 360 controller next
    to an NES controller. Or better yet, next to an old-fashioned Atari joystick.
    The array of buttons, thumbsticks and d-pads on an Xbox controller make the d-pad
    and A & B buttons on the NES controller look quaint.


    Worse, yet games rely on the player starting off with deep-seated knowledge of
    genre conventions and mechanics. If you pick up a modern FPS role-playing game
    like Fallout 3, you are confronted with a complex world and inventory system with
    little to explanation. If you have experience with shooters and role-playing,
    the game operates fairly standard lines. But if you don''t have that knowledge
    base, you might spend several hours just to learn around, walk and shoot. Never
    mind once you have figured out the basics of movement, you must still master the
    inventory system and dialogue trees. I''m a fairly decent gamer and it will take
    me 20 minutes to figure out how to switch weapons in the game. That''s 15 minutes
    longer than most people have to dedicate to playing a game, and about 19 minutes
    longer than the patience a casual gamer has for learning a new mechanic.


    Fallout 3 is a great game, full of exciting story, interesting challenges and
    beautiful environments to explore. Easy and intuitive it is not. Fallout 3 is
    what designer and writer Danc (of the insightful game design log Lost Garden)
    call a game name. Fallout 3 stands at the end of a long line of games that use
    similar mechanics. Each new game release makes small adjustments and additions
    to that mechanic, adding new complexity to the gameplay. Each game within a genre
    must add some new complexity to the gameplay or risk being dismissed as too easy
    by fans of the genre. At a fundamental level, games are about learning and mastery.
    You poke and prod a game system until you master it. This learning process makes
    games fun. Once complete Raph Koster explored this length in his excellent book,
    A Theory of Fun.


    So to continue offering games to players, designers have made games harder and
    harder over the years. The change is not necessarily noticeable from FPS to the
    next. When you make the leap forward over 15 years of a genre and all the gradual
    changes made to a mechanic, the difference in difficulty becomes very apparent.
    Essentially, hardcore video games have kept barreling forward, towards a


