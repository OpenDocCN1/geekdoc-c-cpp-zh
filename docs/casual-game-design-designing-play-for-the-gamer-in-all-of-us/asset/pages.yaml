    # Bow Man 2: Experimentation and Repetition


    Bow Man 2 is a simple game. Your goal is to shoot arrows at the other player until
    you kill them. This grizzly duel is represented in stark black and white with
    patches of green grass and bursts of red when you finally pierce your opponent.


    Bow Man 2, created by Free World Group, looks like one of those one-note gags
    that makes its way around the Internet. "Check it out! You shoot arrows through
    this stick figure''s head and blood spurts out! It''s so short and to the point
    that you could almost be forgiven for mistaking it for a banner ad game. But the
    design of the game is actually quite elegant and allows for a lot more replay
    than many small games.


