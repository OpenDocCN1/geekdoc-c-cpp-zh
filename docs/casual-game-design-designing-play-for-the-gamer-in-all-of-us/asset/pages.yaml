  md: '# Instructions Are Rules Too


    There can sometimes be questions about what constitutes a rule. At its core, each
    rule should reflect information the player needs to play the game. It is have
    an element of the game system. However, when written, they may look more like
    instructions. That''s because instructions describe how to interact with the game
    system. So the rule might be, "The number of spaces a player can move is determined
    by the roll of a six-sided die." But the rule as instructions may read "Roll the
    dice to determine how many spaces you can move."


    # Avoid Too Many Special Cases


    You want your game to have an overall systematic consistency. Rules and the effects
    they dictate should naturally flow from one to the other. Special cases are instances
    where one particular element of the game behaves unlike of all the other elements,
