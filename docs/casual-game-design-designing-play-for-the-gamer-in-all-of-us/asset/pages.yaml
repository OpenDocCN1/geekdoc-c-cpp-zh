    So if it''s hard to capture the aesthetic of self-expression in a game, why bother?
    Because creativity excites us. It allows us to push our games, our play and ourselves.
    It expands the possibilities. There wasn''t a basketball fan in the arena of Julius
    Irving''s and under shot—be they a Lakers or a Sixer fan—who wasn''t on their
    feet just as that ball fell and dropped through the net.


    What Top Chef offers is just enough room for construction to achieve the aesthetic
    of creativity. It does not definitively solve the problem of how to create a system
    to procedurally judge absolute creativity. Instead it shows that what a game must
    provide is the right amount of leeway and reward for a player make interesting
    and unique choices. The game doesn''t seem to seek a cooking tool. Instead, it
    recognizes its own limitations as a game and works within those to allow for player
    choice. The game will not produce amazing recipes every day, but more than once
