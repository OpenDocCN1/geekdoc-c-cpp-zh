- img_proc: true
  md: 'In his excellent book What Video Games Have to Teach Us about Learning and
    Literacy, James Paul Gee examines the ways games encourage systematic learning.
    He makes the compelling argument that games teach valuable skills not being taught
    in traditional primary school education.


    Gee believes that games teach players about domains of knowledge and how to transfer
    knowledge from one domain to another. The world is full of different domains of
    knowledge, from law to basketball. Each domain has its own particular set of signs
    and rules which define or apply to the domain. In order to understand the domain
    of law or basketball, we must learn to read the signs and symbols associated with
    it. In a legal environment, this may mean understanding the difference between
    a tort and a law. Reading basketball demands that a player dribble the ball and
    that shouting "Outlet" refers to a specific pass pattern. In law and court in
    basketball have very different meanings. Yet also share some elements of meaning.
    In both law and basketball, court refers to a stage where things play out.


    The domains we encounter within the world, sharing some aspects of meaning. We
    are constantly transferring knowledge from one domain to the next. When we encounter
    something new we haven''t studied, we approach it with all of the knowledge we
    have built by studying other subjects and domains. But this transfer of knowledge
    isnt always straightforward and, especially when our schooling separates pushes
    us into specialization. It''s a skill we must build up through practice and experimentation.


    Games exist within their own semantic domains. Bejeweled represents its own domain.
    The player learns the rules and mechanics specific to Bejeweled. Gems can only
    be swapped into matches. At least three-colored gems must be present to create
    a match, etc. Surrounding Bejeweled is the larger domain of match-three games.
    When a Bejeweled player encounters another match-three game like Luxor, she immediately
    makes certain assumptions about how the game works, such as to make a match she
    create groups of at least three. She assumes she must create matches based on
    color. These assumptions bear themselves out. The player may at first assume she
    can only shoot balls into matches, but she quickly realizes this is not the case.
    Players can place balls anywhere they want. New new


    This process of knowledge transfer bears itself out as the player explores different
    domains. The important thing is not necessarily the specific pieces of knowledge
    that the player takes from domain to domain. What''s important is the thought
    process which goes into transferring the knowledge. Gee makes the important argument
    that the most valuable learning that goes during gameplay is not the acquisition
    of specific facts or pieces of knowledge, but practice at systematic thinking
    and experimentation. Games teach us to creatively approach and solve problems.


    Games centered on constructing highlight this scientific process and foreground
    it in way other games merely hint at. All games offer chances for experimentation,
    but nowhere is the process more manifest in games that revolve around building
    and constructing. These games provide sandboxes to build everything'
