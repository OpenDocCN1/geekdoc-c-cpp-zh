    # Becoming a Professional Game Designer


    Traditionally, playtesting has been a way into the game development industry.
    All video game companies need people to play their games and test them not only
    for bugs, but for playability. For this they hire testers. This helps people get
    their foot in the door and gives them the chance to work with programmers, artists,
    producers and game designers. Some of these playtesters go on to become producers
    or game designers.


    Experience with software production in general can be a good way to get into the
    video game industry. At its core, making games is just software development. The
    product just happens to be really fun. Working as a project manager or producer
    in software development gives you many of the same skills you will need to bring
    to games—from conceiving and specing projects to working with programmers and
    UI designers.


    However, the best way to become a game designer is to start making your own. One
    of the great things about developing casual games is the low barrier to entry.
    Not only can an individual or a small team make a Web game, but can also find
    an audience on the Internet. In this sense, becoming a game designer is not unlike
    hanging your shingle: make a game and put it on the Internet. Monetizing your
    work can be hard. But there are some good channels, from Kongregate to the iPhone
    to the portals, that make self-publishing possible.


    # Why Be a Casual Game Designer?


    So why do game designers work in casual games? Wouldn''t they all rather make
    big budget console games? After all, most game designers are likely used to playing
    console games. No doubt, some casual game designers do long to make big-budget
    AAA console games. But there are many who prefer working in casual games. A number
    of things make creating casual games attractive.'
