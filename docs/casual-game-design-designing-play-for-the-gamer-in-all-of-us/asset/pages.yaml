    taxing. Winning a Spider Solitaire gives way to a moment of great elation as the
    tension of the game built up by slogging through the difficulty of the system
    releases.


    Neither is better, just different. As a game designer, it''s your responsibility
    to consider what type of experience you are creating. There is a reason Klondike
    Solitaire is one of the most popular video games in the known universe. While
    many people certainly play Spider Solitaire, it can''t claim the same ubiquity.
    It''s just more complex and difficult to play and win. Klondike Solitaire is easier
