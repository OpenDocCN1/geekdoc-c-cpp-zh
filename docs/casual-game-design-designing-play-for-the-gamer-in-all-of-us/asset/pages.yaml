  md: '# Introduction


    This book doesn''t offer a grand theory of game design. Rather, it encourages
    close playing and reading. Not of this book, but of the games it discusses. I
    am a firm believer that there are two ways to become a better game designer. First,
    make games and think about why they do or do not work. Second, play other people''s
    games and think about why they do or do not work. Just as you can''t become a
    writer without reading or a film director without watching movies, you can''t
    become a game designer without playing games and trying to pick them apart.


    From this close reading of games and mechanics, we will begin to assemble some
    general ideas about how to approach casual game design.


    # Mechanics


    You can think of mechanics multiple ways. First and foremost they are routines,
    procedures and methods. Mechanics cover everything from running office to the
    play of baseball. Individual mechanics combine to create complex game systems.


    Mechanics hold the dual meaning in games.


    Game mechanics provide the core of game design. Each game is comprised of a series
    of game mechanics. These mechanics, from creating matches of three items in a
    game like *Bejeweled* to sequencing numbers in a game like Sudoku, dictate what
    players do when they play the game. At the heart of any great game is an elegant
    core mechanic, a mechanic that is both firm enough to provide clear gameplay yet
    flexible enough to allow players to develop strategies. Understanding the core
    mechanics of great games helps game designers create games by tweaking, modifying
    and combining successful mechanics into entirely new game systems.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'this process of combination and modification, game designers can invent entirely
    new game mechanics.


    And the game designer is herself a game mechanic, breaking out her conceptual
    toolbox of rules to craft player experience. Sometimes she trusts old rules, like
    "The player with the most points wins." Sometimes exploring and shaping the core
    mechanic of game requires her to write entirely new rules, like "To score points,
    the player must combine colored gems into crosses comprised of five-colored gems."


    The best way to build new games is to understand the games that already exist,
    why they work and why players can find hours of enjoyment interacting with them.
    These understanding stems from picking up and piecing back together the core mechanic
    or mechanics of the game. Designers must play the game. Then they will mentally
    model the system in their heads, modify it and see the results. From this, they
    will see why the mechanics of the game worked so well, and why with a few changes,
    the whole game system might have collapsed.


    Looking at the mechanics of a game is like looking at the heart of the game. The
    mechanics are the pump that makes the rest of the game pulse with life.


    This book examines an array of mechanics that make up games by looking at set
    of well-known classics, some not—picking apart their core mechanics. It is not
    a comprehensive list of all mechanics in games, but rather a look at ones I feel
    holding interesting for casual game designers. This is how I know approach design.
    This process informs how many of the game designers didn''t. They look at games,
    toys, Web sites, tools, software—anything that demands interaction—eraion—for
    ideas. They figure out how to build a new system appropriate for the game they
    want to make out of the various mechanics they have seen.


    I have divided this book into chapters covering very generalized mechanics. Within
    those chapters I look at particular games and how game designers used specific
    mechanics to construct these games.


    In 1927, English novelist and scholar E.M. Forster published Aspects of the Novel.
    This book was collection of letters Forster developed at Cambridge University
    on subjects like "People," "The Plot" and "The Story." In this slim but wonderful
    book, Forster lays out ways to approach reading the novel and ways to approach
    writing the novel. Aspects of the Novel is far from how to write a novel. Its
    value is greater. Forster offers the reader key ways to understand the novel by
    looking at characters, plots, stories and sentences from a wide array of books.
    Through Aspects of the Novel, Forster helps you understand why certain plots are
    great while others fall flat. He gets you to start thinking about the essentials
    of that, as a writer, you will need to construct.


    While I have no illusions that I can match Forster''s level of crystalline wit
    and observation, I do want this book to serve a similar function. This is not
    a how to guide to making video games. Instead, it offers a way to approach the
    design of games, from casual video games to sports. It does this by undertaking
    a similar mission to the one Forster embarked on Aspects of the Novel: it points
    aspiring'
