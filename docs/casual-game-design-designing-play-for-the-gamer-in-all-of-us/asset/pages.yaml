    In Diner Dash, the player moves through a linear progression of steps. But where
    stepping through the process in Diner Dash was very controlled, preventing you
    from making mistakes, Cake Mania asks you to make further choices about the shape
    and color of the cake, opening up the door for potential mistakes in the process.
    In Diner Dash, every customer orders the same thing. You don''t have to worry
    about what to bring. Just pick the labeled “2” and deliver it to the table bearing
    “2” flag. Click the table, and Flo will stop and stand in front of the table,
    but she won''t give you the food. In this, the player only has to worry about
    getting the process right, not about the content that the process produces.


    In Cake Mania, on the other hand, you will have each cake to match the customer''s
    order. There are four buttons on the oven for the four shapes and four colors
    for the different icing clicking at the frosting stage. You can trip up and bake
    the wrong shape of cake. You can slip up and pick the wrong icing on the cake.
    Or you can accidentally store two cakes on top of one another. These cakes must
    be thrown out or stored to give to another customer. You are not being asked to
    make strategic choices about what to make, but simply to match the shape and color
    requested by the customers. Cake Mania layers a very light mechanic on top of
    time management This extra cognitive task adds another level of complexity to
    Cake Mania. The game feels much more about creating right cakes than it does about
    rushing through customers Diner Dash. This makes the overall experience of playing
    Cake Mania a bit slower and more contemplative, while the incessant drive through
    the process and churn of customers Diner Dash feel more frantic and rushed.


    The delta in game mechanics between Diner Dash and Cake Mania again illustrates
    how light changes to mechanics have big impacts on a game system. Cake Mania also
    shows how you can continue to evolve a game mechanic by bringing in an asymmetrical
    mechanic. Color and shape matching has little to do with time management, but
    adding it to the straightforward march of time management makes the system feel
    more robust. Selecting the shape and color of the cakes makes you feel as if you
    are baking a cake than if you simply clicked through the process. The designers
    smartly scaled the complexity of the color matching and shape so that it would
    dovetail nicely with the time management. All you have to do is choose the same
