    be a few hours if you want to see how well the game holds up over dedicated play.
    Have them play enough to answer the question you are testing.


    During the playlist, it is a good idea to note data about the user''s plays. Note
    the player''s scores, how many times a player must attempt a level, what power-ups
    are used. Use these with level balancing later.


    After they finish playing, ask your playtesters directed questions. You can tell
    them whether they liked the game and had fun. That''s the first piece of info
    they''ll want to share. Be prepared to ask some more pointed questions to really
    get their feelings about the game. Generally playtesters will be generous and
    tell you what they thought the game was fun. Often, they are flattered to be asked
    to test the game and want the opportunity to do it again. They may be afraid if
    they say they hated the game they won''t be asked back. Assage them you want their
    honest opinion. But remember between the lines. Ask them how long they think they
    would keep playing. Ask them what parts they specifically liked and liked. Ask
    them about specific moments in the play. Each playtester will like to lead different
    questions, depending on the question you are trying to answer. If you are testing
    the UI, ask them to explain what certain buttons do and if they see really internalized
    the game flow. If you are testing levels, ask them which levels they enjoyed and
    which they didn''t and why.


    You can also ask what features or changes they might like to see in the game.
    But take all features with a grain of salt. Players will often want features that
    might make the game easier or harder. It''s up to the designer to decide if these
    requests would require improve the game. But if playtesters ask for the same feature,
    you should give it serious consideration. There may be something about your game
    that demands this feature.


    Remember that each playtester represents only one data point. You want to collect
    as many data points as possible so you don''t have to put all of your faith in
    the taste or experience of a few players.


    The key to good testing remains impartial and analytical. This can be very hard.
    Developers spend a lot of time trying to get a game just right and want people
    to enjoy the game. It''s tempting to get mad or dismiss players who don''t seem
    to fall in love with the game. But you can learn more from people who get frustrated
    with your game from testers who blindly adore it.'
