  md: 'SUMMARY


    Chaining certainly isn’t the only way to add additional vectors to gameplay. Providing
    supplementary goals in the form of rewards for specific types of behaviors—such
    as collecting achievements and items—accomplishes a similar effect. However, they
    are most effective at creating tension when the supplementary goals don''t simply
    reflect or reinforce the main goal of the game. The dozens, sometimes hundreds,
    of achievements we built into Xbox games for players to find one example of supplementary
    goals. However, these awards usually serve more to bolster replayability than
    to tension to the original play.


    Be careful with chaining and additional vectors. Too many additional vectors and
    the game may grow confusing. The second vector cannot run perpendicular to the
    main gameplay or it will seem seen as tacky and contradictory. This will confuse
    players and potentially turn them off. Casual games can have multiple vectors,
    but they need to be carefully considered. Instead of running perpendicular to
    the goal of the main mechanic, the secondary mechanic should run at an angle to
    your core mechanic. It should complicate the achievement of the main goal, but
    in doing so allow for even greater success than simply following the more obvious
    path.


    # Summary


    Looking for new ways to build in supplementary goals, chaining and push-your-luck
    moments into games can be a good way to inject new energy into a lifeless game.
    For example, you could imagine a Solitaire game where the player is rewarded for
    moving cards of the same color in consecutive moves. This mechanic would stand
    at odds with the normal alternating color of Solitaire. Some places you might
    screw yourself and bury a card you need later, but having to make that choice
    would be a fun and tension-filled moment.


    Chaining isn''t the only way to add additional vectors to gameplay. It''s just
    very straightforward that enables you to directly craft alternate paths. As you
    design games, you will often find yourself in need of some other vector that pulls
    the player away from the optimal strategy. The best way to find out that vector
    is to run through a series of mechanics that pull and push at your original gameplay.
    It can be nerve-wracking for designers, especially casual game designers looking
    to make clear and concise games. Additional vectors complicate and cloud the clear
    core mechanic you spent so long polishing. But you may find great rewards, if
    you just push your luck a bit.


    175'
