    Peggle has the potential to be very frustrating to players. The gameplay is centered
    almost entirely around a bouncing careening between pegs. The ball bounces off
    the first peg and then a second and a third, changing course with each bounce.
    It''s almost impossible to tell where the ball will go beyond the second, or maybe
    the third, if the path is very clear. After the initial collision, the physics
    of the game take over and rattle the ball around the pegs. The ensuing randomness
    stands as a pleasing counterpoint to the straight, legible flight of the player''s
    initial shot. But Peggle avoids frustrating the player through a very clever and
    simple design decision. You can very clearly see where the ball will land on the
    first bounce. The game even gives you a dashed arrow indicating the trajectory
