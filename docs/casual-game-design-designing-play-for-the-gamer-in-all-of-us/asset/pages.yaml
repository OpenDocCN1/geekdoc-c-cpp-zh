  md: '# CHAPTER TWELVE • SOCIALIZING


    and leave the game. Another player can check in later and make moves, even if
    you''re not present. This allows the game to spread over days, weeks, even months,
    as opposed to games which require both players to be continuously present, typically
    top out at a few hours. This concept is not new. Correspondence chess revolves
    around asynchronous gameplay.


    Over the last years Facebook games have become the rage. Facebook gives developers
    access to a large audience looking for something to do. Companies like Zynga and
    Playfish have built hugely successful companies building games for Facebook and
    other social networks on the backs of traditional multiplayer games like Poker.


    Designing for Facebook allows game designers to create new forms of social play.
    A number of games from Mob Wars from Vampires use the player''s social network
    to build gangs and clans. They also use your friends as opportunities to score
    points.


    A game like What To Wear makes clever use of the aggregate opinions of players
    to create a judging system for the game. By using a large pool of people, What


