    Let them get their feet under them before swiping them out.


    # Don''t Forget to Challenge Players


    While it''s crucial to ease players into a game with a gentle initial learning
    curve, don''t forget to challenge your players. Without a bit of challenge, the
    game will lose all sense of vitality, devolving to more than an exercise with
    idiosyncratic constraints. Sometimes challenge actually makes players lose a level,
    just to remind them they are playing a game and keep them on their toes.


    Wade Kinney, the co-founder of Large Animal Games, once told a story about how
    they used difficulty adjustment in one of their games. The game''s algorithm monitored
    how many levels a player won in a row and modified the difficulty. If the player
    won several levels in a row, the game would make the next level, making it likely
    the player would lose the next level. After a loss, though, the game would adjust
    and make the game a bit easier again. In playtesting, they found this kept players
    intrigued and playing the game. If they won every level, they tended to stop playing
    sooner.


    # Build Levels Around a Central Concept


    Before you start laying out all the variables in a level, spend some time thinking
    about what concept underlies the level. The best levels are concise and clean.
    They focus on one central idea, running through different elaborations on that
    idea. In a color-matching game, the core idea of level might be managing a preponderance
    of one color. A puzzle platformer might require a series of similar jumps.


    A level is like a great pop song. It has a central melody that you can build around,
    but underlying the whole level is one catchy hook or idea. This gives your levels
    clarity and focus. Focusing on one idea will help you find the core element of
    fun in the level and polish it to a shine.


    # Teach Players to Play to the Level


    A level should offer signals to the player that indicate how to approach the level.
    You want to guide the player into the experience. If your level is all a particular
    type of move, give your players space to try out the move and learn to master'
