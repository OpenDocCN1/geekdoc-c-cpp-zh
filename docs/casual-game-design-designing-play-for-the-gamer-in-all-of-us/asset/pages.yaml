  md: '# CHAPTER SEVEN • MANAGING


    perform are more complex than those in, say, a Solitaire game, it''s the primary
    pleasure of the game stems from how fully it occupies your attention. To be fun,
    the game must be demanding. Board and card games can demand attention through
    the management of pieces, but they can''t easily demand attention to temporal
    and spatial pressures. By using the computer''s ability to track variables of
    time, spatial relations and volume, these games tap into our playful desire to
    serve as puppet master and orchestr the world. To keep the game casual, game designers
    must carefully choose how they will build up in the game and how they will release
    it. Will they let players have control? Or will they impose a hectic pace on the
    players?


    It''s interesting that so many of these games take work as their setting. Through
    game mechanics, the game designers seek to emulate established working processes.
    And players take to them. Much of this has, no doubt, to with familiarity. The
    games provide a view into processes with which we already feel familiar. This
    makes them instantly familiar. Look through time management games and you''ll
    find most games that emulate well-known work processes like waitressing, styling
    hair, grooming pets and retail jobs. These are jobs with clear and repeatable
    steps. They are also known and understood by players, even if they don''t perform
    that job for a living. As you would expect, you see fewer games about jobs like
    say, managing hedge funds. That may even be a mappable process, but few people
    are familiar with it, which would make it less intuitive.


    Many of these games emulate an aspirational version of work. You are a baker starting
    your own store and building up an empire or a stylist trying to make it to Hollywood.
    Sure Diner Dash feels less aspirational. Flo eventually opens more diners, but
    waitressing isn''t a common fantasy in the way being a fashion designer is. But
    what Diner Dash offers a version of work that provides rewards in direct proportion
    to your efforts. You serve the customers, they pay, and you advance to the next
    level. What job offers a clear career path that is clear and immediate? In the
    end, perhaps that is a big part of the appeal of time management, attention management
    and all other forms of management games. These games offer a clear path to the
    management position. You get to be in charge. You get to tell everyone what to
    do. You simply open and start clicking and you''re the boss.


