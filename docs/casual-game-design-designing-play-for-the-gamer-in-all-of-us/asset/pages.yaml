  md: 'Hardcore gamers generally want a stiff challenge. Casual players get frustrated
    easily and grow dismayed with losing. Other players just want content. I fall
    into this category: I hate games that block my progress. I don''t necessarily
    want the game to be a cakewalk, but I also don''t want to bang my head for days
    over some puzzle or tricky jump in a game. I want to keep progressing with occasional
    moments of repetition.


    I think actually made Jojo''s Fashion Show a little too. We worried too much about
    frustrating the players and not enough challenging them. Our rationale was Jojo''s
    Fashion Show was largely about content. We believed people would be more interested
    in seeing new dresses and clothing items than they would be in maximizing their
    score on any particular level. I still think this is largely true of the game,
    but that Jojo''s could have benefited from a little difficulty to challenge and
    incentivize the player to take the game seriously.


    In the end, it was good we changed course and abandoned the time management game
    with matching and focused on a sorting game. A number of other time management
    fashion games came out at the same time as Jojo''s Fashion Show''s sold better
    than those time management games. The typical sentiment found in comments on Various
