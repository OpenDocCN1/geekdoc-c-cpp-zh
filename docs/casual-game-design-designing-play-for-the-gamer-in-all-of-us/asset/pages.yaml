    # Tapping Play for Games


    Thinking about different categories of play can be useful for game designers.
    It can give you a starting point for a new game. Looking at activities that already
    engender playful characteristics can spark directions for new games. This is true
    for every- from physical games to card games to video games.


    There are obviously many different ways to categorize play. But these are some
    useful characteristics for starting to think about game design:


    +   - Physical play


    +   - Playing with others


    +   - Playing with things


    +   - Playacting


    +   - Daredevry or pushing your luck


    # Physical Play


    Obviously many of our sports grow out of activities such as running, jumping,
    throwing, hitting and spinning, from simple games like the 100-meter dash to more
    complex games like American football. These sorts of activities also inform smaller
    casual games, like arm-wrestling and thumb-wrestling. They also inspire the focus
    of video games from platformers like Super Mario Bros. to fighting games like
    Tekken. Mario''s name was originally Jumpman, after all.


    These activities have an immediacy that stems from their primacy. As children,
    we explore ourselves and the world through physical play, making many of these
    activities intimately familiar. This makes building games out of them relatively
    easy as everyone understands what they need to do. They are enjoyable, satisfying
    in and of themselves. Game designers can use them as building blocks and combine
    them into new structures. For players, the fun and challenge come in mastering
    the actions in the new contexts.


    One of the great advantages of physical play is quantifiable outcomes. You can
    measure how fast someone runs, how hard they hit and how high they jump. This
    makes building a game around the activity easier because you can keep score easily.


    Physical activities do present problems for game designers. The games are quickly
    limited by the physical abilities of the players. For all of your hard work balancing
    the game to make it fair to all players, some people will excel at the game based
    simply on physical prowess. This is especially true of games that have closely'
