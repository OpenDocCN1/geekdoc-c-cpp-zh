    become overwhelming.


    Video games erase this tracking of exponentially more variables and do calculations
    faster than human. So you can create new types of gameplay that would have been
    far too complex or tedious to track in a board game. This includes not only tracking
    more pieces, but also managing things like multiple timers and the spatial relations
    related to all of those pieces.


    When Sid Meier designed his video game Civilization, he borrowed elements from
