    # If You Can''t Beat Your Level, then It''s Waaaaaaaay Too Hard


    On multiple occasions, I''ve had new designers tell me they cannot beat their
    own levels. That''s unacceptable. Designers know every surprise the level will
    throw at the player. They know by heart where to step, what aliens will pop out,
    what gems to swap, over which customers should be served. They have mental access
    to all of the hidden information of the game. If you can''t beat the level, imagine
    how long it will take your average player to beat it. The average player will
    be totally out of his depth. Players can only discover this hidden information
    by the arduous process of trial and error.


    As a general rule of thumb for casual games, I feel a designer should be able
    to beat early levels in a game with one arm behind his back. As the game progresses
    and gets more difficult, perhaps some concentration is required. But unless you
    are designing boss in a hardcore console triple-A title, you shouldn''t be losing
    all that. And even then, you should be able to beat it to ensure it is beat. It''s
    entirely possible to design a level that is unbeatable by setting a goal score
    too high or a jump too far. You have to be able to play through your level from
    beginning to end and prove it''s winnable.


    You designed the level. You know all of the bombs and traps are hidden. For this
    reason, the level is easier for you than anyone else. Don''t tune the level for
    your own enjoyment. Tune it for the player''s enjoyment.


    # Design for the General Audience, not the Hardcore


    The hardcore players always have the loudest voices. They are the ones on forums
    complaining a game is too easy. They clamor for greater and greater challenge.
    But you have to remember: they are a minority. Granted, they are a vocal minority,
    but a minority is just the same. You need to take their demands into consideration,
    like democracy, you need to answer the majority''s needs first. The large majority
    of your casual games audience is not hardcore. They want challenge on the order
    of an invigorating hike, maybe some light scrambling over rocks. They don''t want
    to scale a 1,000-foot cliff. Covered with ice.


    Design your levels to please and thrill the general audience with intermediate
    skill levels. This is the audience that will make your game a success. You want
    them to be happy.


