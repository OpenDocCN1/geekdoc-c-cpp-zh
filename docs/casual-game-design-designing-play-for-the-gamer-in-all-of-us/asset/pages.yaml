  md: '# INTRODUCTION


    The following are some general strategies for casual game design. We will touch
    on these issues again as we look at specific games.


    # Know Your Audience


    As with any product you want to sell, you must know your audience. A fantasy game
    about elves and orcs presents a harder sell to middle-aged women than a game about
    cooking. We don''t want to stereotype, but you do need to develop a sense of your
    audience''s interests, because a lot of successful casual games build off of an
    established interest.


    # Piggyback on Neuroses


    Sometimes nothing makes a better game mechanic than an established obsessive-compulsive
    behavior. Often these behaviors like stepping on cracks, organizing record collections
    or cleaning up kitchens, already have play-like qualities. When we engage in these
    behaviors we generally follow rules we lay out for ourselves: don''t step on cracks,
    organize your music collection by mood, or clean the dishes in less than 15 minutes.
    With a little bit of work, these simple activities can be given goals that make
    them into full-blown games. Sometimes these games can be transferred into video
    games.


    # Delivery Is Everything


    Knowing your audience also means knowing where they want to play games. Do they
    want to play games on their computer during a coffee break at work? Do they want
    to stand in front of their television and pretend to play tennis? Are they more
    likely to play games on their phone during their commute? Games can take so many
    forms, and can be played in many places, that it''s almost mind-boggling. Games
    are no longer limited to PCs and consoles. Cell phones, iPhones, and handhelds
    like the Nintendo DS and Sony PSP make games portable. They also enable games
    to fit into new interstices of our days. Different audiences have unique moments
    of free time. Tailor your games to these moments and you can break through the
    competition for attention.


    # Conceiving and Iterating


    Generating concepts trips up a lot of people. To some, generating ideas comes
    easily, with the birthing process is much harder for others. Fortunately, there
    are a number of smart tools we can use to help us brainstorm game, approaching
    the game from different angles, from story to audience to theme. We must also
    learn'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# INTRODUCTION


    to tackle the hardest game brainstorming task: conceiving new game mechanics.
    Fortunately, many of the best mechanics grow out of established ones. Sometimes
    it''s an unlikely combination of two mechanics, as when Puzzle Quest married RPG
    leveling up to Bejeweled-like game swapping. By looking in depth at a number of
    game types and mechanics, we''ll be happily able to see new possibilities emerge.


    While coming up with a new and unique game idea is certainly important, many people
    feel the hard work starts there. In fact, that''s where it starts. We all have
    loads of game ideas rattling around the back of our heads. Many of them might
    make great games. That is, if they''re well-implemented. Ideas are easy. Implementation
    is hard.


    Most likely, your first attempt to turn your idea into a game will go poorly.
    Few games are run off the bat. If it is easy, you''re probably just re-skinning
    an existing mechanic. In fact, I would argue that making a first-person shooter
    fun is lot easier than inventing a new casual game mechanic at this point. The
    firstperson shooter mechanic has been polished to a sheen by hundreds of designers
    working on different games.


    Making a game requires an move from paper prototype to digital prototype to full
    production. Each step along this path requires the designer to constantly revisit
    and analyze the state of the game, to see if the actual player experience is getting
    close to what they envision.


    To this, the designer will no doubt features to the game in an attempt to make
    it more robust. At some point, designers must step back from their games and think
    about what they can strip away. We are talking about casual games, after all.
    It is imperative that the experience be clean and streamlined.


    # The Promise of Casual Games


    Finally, this book will be about the promise and potential of casual game design.
    Casual games radically changed the landscape of games. Now anyone can make a game.
    Unlike hardcore console games, you don''t need a team of hundreds to develop a
    small casual game. A team of three or one industrious individual can put together
    a Web-based Flash game all on their own.


    The Internet enables you to find an audience and distribute your game. You may
    have to fund the development yourself, but the generally modest scale of most
    games (compared with a console title) makes this possible. From casual downloadable
    portals like Real Arcade and Shockwave to Flash game sites like Adding Games and
    Kongregate, there are multiple venues for your game that can help you monetize
    your game.


    But best of all, there are millions of players for your game. This makes designing
    casual games exciting. They''ve not only opened the audience and reach of games,
    they''ve democratized the development playing field. As it becomes easier to develop
    and distribute games, we''ll hear from an ever-wider range of voices.


    vii'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'will lead to a wealth of innovative new games and mechanics for designers and

    players to explore.


    # The Value of Thinking Casual Casual


    The value of thinking like a casual game extends beyond designing casual games.

    The same lessons about clear and concise goals and guiding players apply to all

    designing, whether you''re making a casual downloadable, creating a new sport

    or designing levels for new console game.


    The lessons of casual game design can also be applied outside of games, to gen-

    eral user experience design. Social networking sites like Facebook and LinkedIn

    already rely on game-like experiences, from building a profile (i.e., character)
    to

    collecting friends (i.e., leveling up). As sites like these continue to compete
    for

    attention, many are relying on game like experiences to draw in users. Casual
    game

    design offers valuable lessons on how to craft those experiences from getting
    users

    on achiever cycles to quickly drawing in users with gentle learning curves.


    Casual game design has the potential to radically influence both games and soft-

    ware. But first we need to look at how casual games engage players. That means

    starting with their mechanics.'
