  md: '# CHAPTER THREE • PLAY IS THE THING


    All of these types of play provide game designers with a list of activities we
    know engages players. The designer''s job is figuring out how to take the basics
    of play and formalize them into games. This involves finding ways to structure
    and lengthen those play experiences. A key element to this process is adding goals
    and rules. As we define games, we''ll see that rules will help us give shape to
    play experiences.


    # Defining Games


    Play and games exist on a spectrum of formality but that spectrum can sometimes
    look very broad and all-encompassing. Activities like poker or basketball are
    clearly games. But what about more ambiguous activities that follow strict rules,
    trading stocks? Stock trading would seem to share many qualities with a game:
    it''s rule-based, you have goals, there''s a lot of randomness involved. Does
    it make a game? Well, that depends on how we define game. And defining games is
    a favorite pastime of game designers.


    The French philosopher Roger Caillois built upon the definition of play laid out
    by Johann Huizenga in *Homo Ludens*. Huizenga focused largely on play and how
    it interacted with culture. He saw play in all manner of activity, from rough-housing
    to politics to war. Caillois meanwhile considered the study of play and honed
    in games. In his book *Man, Play and Games*, Caillois offered a definition of
    play and then provided a system of classification for games. Caillois recognized
    that games and play existed along a spectrum, with unstructured activities on
    one end and more formalized games rounding out the other.


    Caillois provides the following definition of play:¹¹


    +   1. Free: in which playing is not obligatory; if it were, it would at once
    lose its attractive and joyous quality as diversion;


    +   2. Separate: circumscribed within limits of space and time, and defined and
    fixed in advance;


    +   3. Uncertain: the course of which cannot be determined, nor the result attained
    beforehand, and some latitude for innovations being left to the player''s initiative;


    +   4. Unproductive: creating nothing goods, nor wealth, nor new elements of any
    kind; and, except for the exchange of property among the players, ending in a
    situation identical to that prevailing at the beginning of the game;


    +   5. Governed by rules: under conventions that suspend ordinary laws, and for
    the moment establish new legislation, which alone counts;


    +   6. Make-believe: accompanied by a special awareness of a second reality or
    of a free unreality, as against real-life.


    > ¹¹Roger Caillois, *Man, Play and Games*, University of Illinois Press, 2001,
    pp. 9-10


