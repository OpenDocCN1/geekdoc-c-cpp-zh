  md: '# Drop 7: Foiled by Randomness


    The iPhone game Drop 7 made by the New York-based developers Area/Code a wonderful
    little game. It shows how much you can do with a simple mechanic and a straightforward
    sorting scheme. It also shows how puzzle games like this can begin to collapse
    under the weight of a little bit of randomness and the sheer volume of your accumulated
    moves.


    Drop 7 (Figure 5.5) is touted as a mixture of Sudoku and Tetris. And there is
    certain merit to this claim. When the game loads, the player is confronted by
    a seven-seven grid. In each turn, the player is given a random disc with a value
    ranging from one to seven. If a disc lands in a horizontal row or a vertical stack
    equal to the disc being dropped, the matching disc scores and If you drop a disc
    numbered four on a vertical stack of three other discs, the four will score and
    disappear. That core mechanic of the game. Take as long as you need to figure
    out where to drop the disc. The game ends if any one of your stacks grows than
    than discs.


    It seems simple enough. After all, counting seven isn''t terribly hard. However,
    two small mechanics complicate the gameplay and keep it from devolving to a puzzle
    like a Sudoku board. First some discs are grey and don''t have a number. You cannot
    score discs. To reveal what is hiding under the grey disc. To do this you have
    to make at least two scores on one of or next to the grey disc. If you have a
    stack of three discs, with a grey disc at the top, you can drop a four on top.
    The four will score and a dotted border will appear around the grey disc indicating
    you have revealed the hidden number underneath. Once you have revealed the disc
    can be scored.


    The game also applies pressure through a second mechanic. Every X number of dropped
    discs (represented by dots at the bottom of the screen) all of the discs are pushed
    up and a row of grey discs appears at the bottom. The number of moves you have
    between this new row appearing decreases as the game advances. These discs must
    be revealed before they can score and disappear.


    These grey disc mechanics add randomness and hidden information to the game. With
    more perfect knowledge, you could easily sort the discs in a manner that would
    enable you to play forever. But the combination of these two mechanics adds enough
    randomness to the game to eventually cause you to lose. It may take a while to
    lose in the normal mode, but my wife played for 10 minutes and was convinced she
    would never lose. I assured her that wasn''t the case; eventually the discs would
    build up and she would lose. I knew from experience, having been added to the
    game for several weeks.


    The straightforward sorting of Drop 7 mixed with the hidden information and randomness
    of grey discs gives players a lot to sink their teeth into playing. As with any
    game you play it, the more you develop an innate understanding of the system and
    the better you get at scoring points and surviving Drop 7.


    But randomness eventually brings an end to your game. More specifically it''s
    the ones that kill you. As grey discs appear and break you are awarded random
    numbers,'
