  md: '# CHAPTER EIGHT • HITTING


    # 8.4


    ![](img/d6f534b7476a11d93281f19d476f720d_180_0.png)


    Hammer Heads replicates Whac-A-Mole gameplay in a PC downloadable. (Reproduced
    by permission of PopCap Games.)


    Not only have variations of the Whac-A-Mole mechanic found new incarnations in
    digital games, the term has made its way into wide-spread colloquial usage. The
    term whack-a-mole now cononetes a repetitious and likely futile task, in which
    you will keep trying to hit a target that pops up seemingly at random. Among game
    designers, the term also describes a moment when a game breaks down to random
    actions. Any game has the potential to devolve into whack-a-mole if the designer
    adds too many random interactions with little choice. For example, a shooter game
    can devolve into a state of whack-a-mole if enemies keep popping up with no rhyme
    or reason. Even games like Bejeweled can engender feelings of whack-a-mole; the
    player simply matches only to have new random gems appearing in their place.


    In cases where game devolves to whack-a-mole, you need to look for ways to reapply
    order to the randomness and a way to give the player meaningful choices. You can
    institute more legible patterns or scale back the variables generating randomness.
    If you don''t, the game will quickly run its course as players tire of the noise.
    This may be okay if the game is designed to provide a quick visceral experience.
    But if you want more strategic interactions, players need better choices than
    whacking random moles.


    162'
