    a light, but effective, social interaction with other players. At the bottom you
    can see the outfits currently leading the voting. All of this contributes to the
    feeling of fashion and collective taste.(Reproduced by permission of Large Animal
    Games.)


    In addition to these basic mechanics, some additional mechanics encourage more
    social interaction. You can send others, thumbs up for outfits you really like.
    This sends the players a message and awards them bonus credits. You can also peruse
    the portfolio of outfits others players have created, giving you a better sense
    of others'' styles as well as new fashion ideas. This breaks down social barriers.
    It feels easier to interact with players because you are all trying to accomplish
    the same goal, while in other games you are direct competition. It does not hurt
    to appreciate or praise the work of others. Quite to the contrary, you benefit
    from it. This creates a positive social interaction that draws out small moments
    of interaction between players.


