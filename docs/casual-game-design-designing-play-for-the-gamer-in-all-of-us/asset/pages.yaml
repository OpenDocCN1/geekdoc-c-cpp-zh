  md: '# CHAPTER EIGHT • HITTING


    popping up, you''re off and running. When you make contact, you get clear and
    direct feedback as bop the moles on the head. You feel them crack beneath your
    mallet, you watch them disappear into their hole and see you score tick. Arcade
    machines need to be even more accessible than the video games you play at home.
    Sitting in the chair along, they have to compete with all of the other games and
    entertainment options just steps away. And since arcade games typically somewhere
    between 30 seconds and two minutes, the player can''t waste time with tutorials
    and learning to play. The player must be able to jump in quickly. Whac-A-Mole
    fits this.


    It''s a primal expression of power and aggression. It taps directly into our play
    instinct. In this manner, Whac-A-Mole exemplifies casual design. But in the end,
    it''s a little too small and a little too physical to inspire long-term play.
    Your interest in the game eventually exhausts itself, both on a physical and mental
    level. It hurts our desire to smash things on the head draws from a finite well.
    With successive whack, the primal joy felt in hitting is replaced by a different
    type of enjoyment: the joy of meeting with success. This joy lasts until the game
    begins to outpace you. Eventually the bobby heads come too fast and you can''t
    keep up. The game grows down the pressure to move faster.


    The game has only one track along to scale difficulty: More heads pop up subsimultaneously,
    but this is also a speed challenge. The only way for the player to get better
    is to shy away from skill-heavy twitch games. Traditionally, casual players demand
    Actions requiring lightning-quick reflexes and hand-eye coordination can alienate
    game players. If the game requires high degrees of a specific skill, it prevents
    the average person from playing. Whac-A-Mole does not require much initial skill.
    But the number of moles you hit in a game will wear out without more practice.


    For most people, there is a rather finite limit at which our arm will allow us
    to swing the mallet. Sure could practice more, but the game doesn''t provide enough
    reward through addictive gameplay to compel you to undertake the sort of rigorous
    practice that it demands.


    Whac-A-Mole''s failure to draw the player into deeper and longer engagement is
    a consequence of limited choice and randomness. The game offers almost no deeper
    strategic play. There are not many interesting choices in the game—you want to
    hit as many moles as possible. You could be strategic in clumps you choose to
    go after advantage of proximity, but really, you want to bop every critic that
    pops up.


    You can''t really fault Whac-A-Mole for failing to engage over a long period of
    time. The game is designed to be played in short bursts. It is entertaining for
    exactly the amount of time it needs to be. This is an important lesson for game
    designers to learn. Not every game needs to be chess, engaging the player for
    hours at a time. Times, a few minutes are enough. The designer needs to take into
    account the context in which the game will be played, as well as the player''s
    relationship to the game. It''s perfectly fine for some arcade games to last only


