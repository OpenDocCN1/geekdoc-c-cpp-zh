- img_proc: true
  md: 'This incentive to chain puts puts you at odds with the straightforward play
    path of just serving customers and answering their needs as they come up. Playing
    without chaining, you would rush over and take a customer''s order as soon as
    their hand comes up, and then bring the food as soon as it appears in the window.
    Chaining prevents you from playing this way. You must line up actions, delaying
    actions on a customer until you can create a situation where you can perform multiple
    instances of the same action consecutively.



    This forces you to hold off serving some customers even if they are getting impatient
    and losing hearts. For some players, this can be very hard to stomach. When those
    fumes of anger appear over a customer''s head (Figure 9.5), indicating they are
    about to lose a heart, your first impulse is to rush over and serve them. If you
    wait too long, the customers will leave and you will lose points. But experience
    has also taught you that you will score more points if you hold out and chain
    your actions. Chaining presents both rewards and risks.



    You must perform the necessary risk assessment on the fly and decide when to maximize
    points and when to break the chain in order to save a customer. It seems like
    a straightforward decision, but sometimes it may actually be more cost-effective
    (in terms of overall score) to lose a customer than break a series of chains.


    FIGURE 9.5


    ![](img/d6f534b7476a11d93281f19d476f720d_190_0.png)


    Chaining puts you at risk of losing customers. In the queue on the left, customers
    are already losing hearts, with no foreseeable place to seat them. This tension
    animates the game. (Copyright © 2003 PlayFirst, Inc. Reproduced by permission
    of PlayFirst, Inc.)


    172'
