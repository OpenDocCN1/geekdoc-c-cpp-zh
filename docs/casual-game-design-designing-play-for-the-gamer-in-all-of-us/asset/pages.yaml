  md: '# Summary


    Physics-based games tap into our natural desire to explore the world around us
    through play. We get to poke and prod at a system, bouncing, tossing and stacking
    pieces to see what will happen. Turns out this poking and prodding generally translates
    well to video games. Bouncing a real ball is fun and so is bouncing a virtual
    ball. The laws of physics give game designers a familiar set of rules from which
    they can build a game. Basing your game on physics gives you a head start in designing
    a dynamic system.


    But the opaqueness of most physics systems has drawbacks. Very often physics systems
    are not clearly legible. And unless they allow for sufficient experimentation
    to begin understanding the system, players can grow frustrated. Moves don''t have
    the clear, definite outcomes you see in other casual games like Bejeweled or Diner
    Dash. This can be off-putting for some casual players who want a system they can
    interact with quickly and be certain of their results. If the game models physics
    too closely, it can feel punishing. Designers should pick the elements of physics
    most salient to their game system and emulate those. They should also remember
    they have free rein to improve these physical laws. If the game is more fun when
    you can jump higher, then turn gravity down. The limitations of physics games
    can be overcome by balancing legibility and opaqueness, as well as complexity
    and simplicity.'
