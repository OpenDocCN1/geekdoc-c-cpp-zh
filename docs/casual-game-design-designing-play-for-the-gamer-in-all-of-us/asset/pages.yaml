    # # Klondike Solitaire vs. Spider Solitaire: More Choices, More Complexity


    Patience isn''t just a virtue; it''s a game.

    Mary White Jones wrote in Games of Patience for One or More Players, second series
    in 1898, "In days gone, before the world lived at the railway speed it is doing
    now, the game of Patience was looked upon with somewhat contemptuous tolerance,
    as a harmless but dull amusement for idle ladies, and was ironically described
    as a ''roundabout method of sorting the cards''; but it has gradually won for
    itself a higher place. Now, when the work, and still more the worries, of life
    has so enormously and multiplied, the value of a pursuit interesting enough to
    absorb the attention without undoubtedly exciting the brain, and so giving the
    mind a rest, as it were, a breathing-space to recruit its faculties, is becoming
    more and more recognised and appreciated."


    Sorting extends the pleasure of matching. It takes the pleasure of pure matching
    and adds the idea of distinguishing and sequencing. More thought goes into sorting.
    Each object becomes a symbol that you are reading and acting. When you are matching
    objects, each object in the set has the same value or meaning. Thinking of Bejeveled
    again. When you make a match of three gems in Bejeveled each piece has the same
    basic value: it is red. It does not matter what order they go in, only that they
    each share the same basic quality. In a game that involves sorting, the individual
    pieces have some meaning in relation to another. On the most basic level you could
    be sorting of cards so that all of the red cards are in one and all of the black
    ones in another. This is like matching, but the cards have a bit more of a relationship
    to one another. This card is red as opposed to blue so it goes in the red pile.
    You could see more clearly that each card has a distinct meaning that applies
    to itself and how it relates to the other pieces. The level of meaning involved
    scales up from there. In addition to sorting cards based on color, you can sequence
    them based on their numerical values. You can sort and sequence the cards in as
    many ways as the characteristics of the cards or pieces allow. For the player,
    the challenge lies in how well you can read all of the symbols, process their
    meaning and applying the required sort to those pieces.


    Playing cards have a plethora of highly legible symbols. This makes them great
    for games that involve sorting and sequencing. You could also make games that
    rely on pieces with less legible symbols. But as the symbols become less legible,
    you will likely need to simplify the complexity of the sorting players must perform.


