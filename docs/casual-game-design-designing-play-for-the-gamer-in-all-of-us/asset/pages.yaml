  md: '# Wii Tennis:The Swing Is the Thing


    Wii Tennis derives its primary pleasure from swinging your Wiiimote like a tennis
    racket. Before you can even start playing, you have to push your coffee table
    out of the way and clear a big enough area for you and your opponent to really
    wind up and crank the ball. You loosen up, stretch your arms and get to swing.
    When the game comes on, you bob from foot to foot just as if you were playing
    real tennis and swing with great intensity as the ball bouncing toward your little
    Mii. Sure, all you hit is air, but when you look at the screen and see your ball
    zipping back towards your opponent and skipping just out of his or her reach,
    you experience a moment of intense satisfaction, as if you actually creamed a
    real ball (Figure 8.5).


    FIGURE 8.5


    ![](img/d6f534b7476a11d93281f19d476f720d_181_0.png)


    A player swinging the Wiiimote to nail a ball in Wii Tennis. (WikiCommons)


    Of course, experienced Wii players realize you don''t need to swing the controller
    to hit the ball. A simple flick of the wrist will do fine. The accelerometer tucked
    inside the Wiiimote, which measures the force applied to the controller, isn''t
    all refined. A small child can easily apply enough force to top out the meter.
    It''s much more efficient to sit back on your couch and play Wii Tennis by flickering
    your wrist in tight controlled motions at the exact right moment. But it''s also
    a lot fun. by playing the game as you would any other video game (namely sitting
    on your butt on the couch), rub yourself of the visceral pleasure that makes Wii
    Tennis unique—the wind and swing.


    > ⁴http://commons.wikimedia.org/wiki/File:Wiiate3_2006.JPG, User: Cian Ginty'
