- img_proc: true
  md: 'As a designer, ideally you want to create games that don''t reduce to optimal
    strategy, but instead offer an array of different strategies that offer different
    rewards. This can be really hard to do. Even complex systems often break down
    to relatively simple answers. One way to get your game reducing to one obvious
    path is to offer an attractive alternative to the optimal strategy.


    Diner Dash smartly avoids pitfall of having just one optimal strategy by offering
    a mechanic that pulls the player in an alternate direction. To add choice and
    tension to the gameplay Diner Dash employs a chaining mechanic that subverts the
    straightforward march through the process of serving each customer.


    Diner Dash rewards you for performing the same action multiple times in a row.
    Each time Flo takes an order in Diner Dash, you receive a base amount of 20 points.
    However, if you take orders in a row, meaning you don''t bring another customer
    food or clear a table, but just walk around taking orders, you receive a multiplier
    bonus that increases for each customer in the chain. So, for the first order you
    receive 20 points. For the second order, you receive a bonus multiplier of two,
    doubling your score to 40 points. For the third order in a row, you receive a
    bonus multiplier of three, for a total of 60 points. So if you take three orders
    in a row, you score a total of 120 points. This is double what you have earned
    if you took three orders in the normal course of play. In this way, chaining greatly
    increases your score. You earn a similar bonus by chaining other actions in the
    serving process. The longer the chain, the bigger the reward. Through these bonus
    points, the game heavily incentivizes you to chain.


    ![](img/d6f534b7476a11d93281f19d476f720d_189_0.png)


    FIGURE

    9.4


    When you perform the same action consecutively, you receive a bonus multiplier
    for chaining the actions. The more times you perform the action, the longer the
    chain and the bigger the multiplier. (Copyright © 2003 PlayFirst, Inc. Reproduced
    by permission of PlayFirst, Inc.)'
