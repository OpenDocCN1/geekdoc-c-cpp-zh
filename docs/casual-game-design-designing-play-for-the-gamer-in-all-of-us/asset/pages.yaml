  md: 'dressing room, each with a different style, the player has to divide his her
    attention. These time and attention pressures required the player to quickly parse
    the clothing and its attributes to find the item that best fit the required style.
    This process of quickly sorting the clothes into categories, weighing each item
    against another, provided the key challenge of the game. The player would look
    over a top and think, “This blouse is yellow, has an empire waist, long sleeves,
    it’s kind of loose and flowing. It’s more of an autumn shirt, but right now I
    need a summer shirt and the loose nature, as well as the yellow, make it of summer.
    So more than that red coat, that’s for sure.”


    Because this system of processing and sorting into categories was fairly unusual
    for a game, where we found we couldn’t have any complex sequencing or other interactions
    demanding the player’s attention. We tried out a few mechanics to divert players’
    attention, but found that they already had hands full parsing the clothing. Other
    interactions simply overwhelmed the player. We stripped them out and focused the
    game on sorting the clothes. As always, contestants proved invaluable. Game designers
    are so familiar with their own game system that it doesn’t challenge them. But
    players are not familiar with the many variables and mechanisms so apparent to
    the designer are obscured by the players, as in Jo’s. They have enough just figuring
    out the game system. Don’t overburden players, unless the game is about overburdening
    the players; but we’ll get to when we look at time and attention management games
    in Chapter 7.


    In casual game design, it is generally a good policy to be generous with your
    player. JoJo’s Fashion showed a lot of information from the player. It was generally
    a more difficult system to read than a typical game system of exposed symbols
    like Solitaire or a match-three game. The information was there, but it was buried
    in details of the clothing. To compensate for player confusion, we pushed the
    game to be forgiving in the scoring. You scored a lot of points for items, and
    the levels were generally easy to pass. We didn’t want players getting stuck on
    a level because they couldn’t understand our interpretation of disco or some other
    style. To reward levels of skill, we instituted a star system. You only needed
    three stars to pass a level. Getting three stars was too hard. Getting five stars
    was a bit harder. This allowed the game to scale to player’s ability and prevented
    the game from blocking people’s progress simply because the information they needed
    to properly sort the clothes wasn’t clear.


    Tuning your game to the right difficulty is part science and part dark art. Your
    game can’t be too easy or players lose interest. If they cruise through every
    level with no difficulty, they will assume the entire game is easy and dismiss
    it as too poor. Much of the challenge of players coming in and meeting challenges.
    Occasionally failing a level can incentivize players. They will think, “Oh yeah?!
    This game’s not gonna be me, I’m gonna beat it!” Conversely, if the game constantly
    frustrates the players’ every attempt to win, they can turn off as well. They
    will begin to assume that a level can be beaten by following one exacting path,
    which they may decide do not want to trace. To make this balancing act even difficult,
    every player has a different skill level and different desires for difficulty.'
