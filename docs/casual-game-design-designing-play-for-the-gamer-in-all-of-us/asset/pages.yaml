  md: '# CHAPTER TWO


    # The Game Mechanic at Work


    The game designer has a number of responsibilities in the game development process.
    The game designer directs the creative vision of the game from conception through
    to launch. Like the director of a film, the game designer is responsible for creating
    and maintaining the creative direction of the game, working with the artists,
    programmers and producers to bring the game to life. This includes a wide range
    of specific responsibilities from brainstorming concepts to writing rules to crafting
    levels for the game.


    # The Role of the Game Designer


    People have been designing games for thousands of years. In the 1920s, Sir Leonard
    Woolley unearthed a board game in the Royal Tombs of Ur in what is now southern
    Iraq. The Royal Game of Ur, dating back to 2,600 B.C., is probably the world''s
    oldest intact board game (Figure 2.1). The Egyptian game Senet is even older.
    Historians have found evidence dating Senet back to 3500 B.C. But we can confidently
    say games are far older than as long as leisure has existed, we''ve had play and
    games to help fill spare minutes. And as long as there have been games, there
    have been game designers, picking out stones, crafting boards and prescribing
    rules to govern play.


    And while the tools of implementation have changed—we now push instead of round
    stones—the basic idea is still the same: Craft a set of rules. As an author strings
    words together into sentences and builds them into stories, a game designer combines
    rules into mechanics and assembles those mechanics into games.


    We all have some experience with game design. As children, we work with our friends
    to turn play into games. On the playground, bored with simple tag, we conspire
    to add new rules to the basic mechanic of tag, building up new games, from Freeze
    Tag to Television Tag to Zombie Tag, gradually making the game more complex and
    interesting. Just think of the common refrain echoing from kids playing'
