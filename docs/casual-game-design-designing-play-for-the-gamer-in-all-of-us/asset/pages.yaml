  md: 'At the time, Nintendo''s games had fallen far behind Sony''s Playstation and
    even Microsoft''s Xbox. Many analysts were writing off the company. Nintendo realized
    to grow their audience and market share, they needed to bring in new players.
    Instead of trying to take a bigger piece of the game pie, Nintendo decided to
    make the whole pie bigger. And did they focus on? Casual gamers. These people
    weren''t wooed by higher resolution graphics. Like Windows 3.0 users discovering
    Windows Solitaire for the first time, many probably didn''t realize they were
    interested in playing games. But when presented with the Wii''s surprisingly intuitive
    wand and the play it enabled, they were intrigued. With a clever marketing and
    great word of mouth, the Wii became a phenomenon largely on the back of the title
    Wii Sports. The public was enthralled with the idea that you swung the almost
    magical Wii Remote just like you would a real tennis racket to play Wii Tennis.
    Suddenly casual gamers who had never bought a console were up to get hold of the
    Wii.


    Wii Sports was designed as a flagship game, bundled with the Wii to demonstrate
    the capabilities of the Wii Remote. Nintendo wanted to make a game that leveled
    the playing field between casual players and hardcore. By introducing a simplified
    controller with a unique, intuitive control scheme, Nintendo put all on the same
    footing. Nintendo producer Katsuya Eguchi, the man in charge of Wii Sports, said
    "Initially, our goal was to create something very simple that anyone could pick
    up and play, and because everyone knows sports, we thought that would probably
    be the best."


    Wii Sports capitalized on the widespread popularity and familiarity of sports.
    The designers chose five games they could intuitively simulate with the Wii Remote.
    This meant the games needed to clear and familiar arm-motions like swinging and
    punching. Then they stripped those games of much of their complexity, boiling
    them down to one core interaction. So with Wii Tennis, the player swings the Wii
    Remote to whack the virtual ball across the net. You do not even need to correctly
    position the avatar to return the ball. The game largely removed the spatial complexity
    of tennis, boiling it down to a time game. It''s tennis, with no running, only
    swinging. Said Eguchi, "Our goal with Tennis wasn''t to create a game that was
    real, really challenging. We wanted to stay with a simple, pick-up-and-play idea.
    If we added the need for the player to run to the ball, that would add a level
    of complexity we think would be an obstacle. We will see this move—boiling a game
    down to its elemental mechanic—over and over as we go deeper into casual game
    design.


