  md: '# # CHAPTER NINE


    # # Chaining


    Sometimes a game just needs a little something more to bring it all together.
    You can have a well-crafted core mechanic that works as expected and still find
    playing the game to be a little, a little boring. For a designer, this can be
    vexing. Through iteration, you''ve given the core mechanic the proper constraints.
    The interaction plays as you envisioned it. The player can no longer proceed straight
    through a different vector to the game, accomplishing small goals which lead to
    winning the level or the game. Yet playing the game feels as you are painting
    by numbers and the game lacks a sense of tension. In cases like this, the game
    probably needs an additional mechanic, to add a different vector to the gameplay.
    By adding another vector, you add a fork in the clear path through the game. The
    player can no longer simply proceed along the straight line toward the finish
    line without at least considering the other path. Right adding another vector
    adds tension and choice to the game and infuses it with more.


    There are many ways to add another vector to a game. Sometimes a game just needs
    stuff—more things to look at and click on. In Insaniquarium, the game designers
    build this tension by adding more of the same. They stack interactions on top
    of one until simply performing all of these interactions builds a requisite level
    of tension (or in the case of Insaniquarium, frenzy). You can imagine the designers,
    starting with the management of, feeding them by dropping food in front of them.
    That mechanic engages the player, but not fully. So the designers layer in the
    act of picking up coins in addition to the feeding. Now players must feed fish
    and pick up coins. This engages the player a bit more adds tension in the form
    of more activity. On top of that, the designers add the alien-shooting mechanic.
    Performing all three interactions in concert, the game begins to achieve a sufficient
    level of tension. For good measure, the designers add a few more interactions:
    items for the player to purchase and power-ups, all with the hope of bringing
    the game to buzzing life. And it works. With enough interactions and stuff going
    on, Insaniquarium begins to feel dynamic, even if all of the interactions are
    along a similar vector (Figure 9.1). They point the player toward the same goal.
    The conglomerate of these stacked interactions makes Insaniquarium feel a bit
    patchwork.'
