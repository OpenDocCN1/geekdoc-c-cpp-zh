  md: '# # CHAPTER EIGHT


    # # Hitting


    Great pleasure can be found in hitting something. Just whaling the hell out of
    it. On some level, it''s an act of brute force. Somewhere in our caveman ancestry,
    we realized it''s just fun to hit things with a club. And if you hit the right
    thing, like a tasty bird or a 100-mile-per-hour fastball, it can be profitable
    too.


    Hitting—the process of reaching out and coming into contact with another object—is
    such an elemental play mechanic that we tend to overlook as a game mechanic. Games
    like boxing revolve around hitting in a very obvious way. The central act of boxing
    is punching your opponent. Other couches hitting in more baroque systems, burying
    the mechanic in among a slew of competing interactions. When we think of baseball,
    we think of pitching, catching, throwing and running the bases, but the core of
    the game is hitting. Hitting puts it all in motion (Figure 8.1). Sure, the pitch
    comes before the hit, but really it''s when the bat comes into contact with the
    ball that the rest of the game system comes alive. The ball arcs through the air,
    the players in the outfield moving and the runners dash


    FIGURE 8.1


    ![](img/d6f534b7476a11d93281f19d476f720d_173_0.png)


    Hitting animates games like baseball. It puts the entire game system in motion.
    (WikiCommons¹)


    > http://commons.wikimedia.org/wiki/File:Kevin_Millar_hitting.JPG'
