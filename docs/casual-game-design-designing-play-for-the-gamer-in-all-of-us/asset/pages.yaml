  md: '# CHAPTER SIX


    # # Seeking


    Making a game can be as simple as hiding an object and sending players on a hunt
    to find it. This simple mechanic of seeking out a hidden object informs everything
    from scavenger hunts to Easter egg hunts to hidden object video games. This simple
    mechanic comes with many advantages for game designers. It''s straightforward
    and easy to implement. The idea is so simple even small children instantly understand.
    You can scale it from easy to difficult simply by leaving objects in plain sight
    or burying them under layers of other objects. Seeking and finding mechanics tap
    into the natural instinct to find things. Just look at how peek-a-boo entertains
    babies for hours. The puzzlement of the search and the sheer of joy of finding
    the hidden object play across their faces each time they discover it.


    ![](img/d6f534b7476a11d93281f19d476f720d_147_0.png)


    FIGURE 6.1


    A child searches for Easter eggs hidden in his backyard. (WikiCommons¹)


    ¹http://commons.wikimedia.org/wiki/File:Easter_egg_hunt.JPG, User: bobjgalindo'
