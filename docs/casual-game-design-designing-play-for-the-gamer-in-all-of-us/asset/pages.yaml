  md: '# INTRODUCTION


    designers, practicing designers and interested players toward the key elements
    of games and says, "Look at that mechanic! What an ingenious idea! Let''s figure
    out why mechanic worked so well we can figure out how to use it ourselves.",


    I am a casual game designer. This is both my profession and my mission. I like
    casual games that are quick to play and accessible. It is in this realm of casual
    gameplay that I think games have the greatest growth potential and the greatest
    ability to reach a wide audience. This book will focus on game mechanics that
    I''ve explored in relation to my work in casual game design. These are by no means
    the only mechanics for casual games. Nor am saying mechanics found in hardcore
    games can''t be casual. After all, hardcore first-person shooters like Quake have
    at their core the same mechanic found in seek-and-find games: It''s all matter
    of how the mechanic is applied in the game.


    The game designer LeBlanc developed a methodology to examine games called MDA.
    MDA stands for mechanics, dynamics and aesthetics. LeBlanc argues that mechanics
    are the basic elements of games. These mechanics combine to form dynamic systems
    which lead to a certain aesthetic. A game designer selects or develops mechanics
    for the game and combines them into a system. As players interact with the system,
    they have an aesthetic effect. Mechanics that a player''s moves—like the swapping
    mechanic in Beweweled—can engender a sense of claustrophobia. Mechanics that force
    a player to furiously click around the screen, tending to small emergencies—like
    the spinning plates mechanic in Diner Dash—can create a sense of hurried frenzy
    in players. The game designer must pick out the proper mechanics and combine them
    in a way that creates the desired aesthetic and experience for the player.


    # The Issue of "Fun"


    This book will generally focus on fun. Fun. My idea of fun may be your idea of
    torture. Fun is almost as slippery and subjective as pornography. Like pornography,
    you generally know it when you see it. And as a game designer, the big part of
    your job is learning to recognize the pleasure of fun and amplify it. Some people
    derive immense pleasure from sorting their sock drawer. What''s to be done with
    them? For starters you could make a game that replicates the pleasure of progressively
    organizing objects, be socks or gems, and give those people something even more
    than their sock drawer.


    And while I believe games can exist without fun, this is not a book about making
    those games. I have played and admired games that provoked in me more anger, sadness
    and frustration than joy. Art games like Jason Rohr''s Passage have beautiful
    concepts, though I think they lack a general accessibility that making casual
    game games demands. And while casual games often experiment with innovative mechanics,
    their focus is to entertain a broad audience. In this book, I focus on games that
    offer short, but intense blasts of fun. Sometimes that fun will be sustainable.
    Sometimes that joy will quickly fade. But I believe casual games need to deliver
    some element of fun.'
  merge: -1
