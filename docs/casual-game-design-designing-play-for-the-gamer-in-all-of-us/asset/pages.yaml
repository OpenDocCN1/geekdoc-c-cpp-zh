  md: '# # Bouncing, Tossing, Rolling and Stacking


    We all know that if we throw a rock up in the air it must come down. We know that
    friction will eventually slow a rolling ball and bring it to a full stop. Toss
    a ball straight at a brick wall and it will bounce back. Throw the ball at an
    angle, and it will ricochet off the wall at an angle. To throw a football a long
    distance, must increase the force and spin we put on the throw. Years of living
    in this world and obeying the laws of Newtonian physics have taught us much. Exactly
    how much heft and spin to put on a basketball is a matter of intuition mixed with
    memory and guesswork. Despite our familiarity with the basic laws of nature, we
    are often surprised by the results. I''ve been playing basketball for the better
    part of two decades and I am still filled with a burst of joy every time I hit
    a three-point shot. Despite hours of practice, there''s some part of me that still
    can''t believe I can throw a large rubber ball 21 feet and into a hoop perched
    10 feet in the air.


    Physics-based games tap into this potential for amazement and joy. The games rest
    on the simulations of the basic laws of physics, emulating things like gravity,
    friction and force. The laws of physics become rules within the game system that
    impact your moves. Toss a ball into a set of pegs and it will bounce from one
    peg to another. Shoot an arrow through the air and gravity will slowly overtake
    the forward motion of the arrow and draw it back to earth. Build a structure out
    of heavy objects and then gravity will pull them down as it applies forces to
    the weaker joints.


    Our experience with the physical laws of nature informs our understanding of these
    games. The game system simulates systems we are already familiar with, making
    it easier to pick up the basic concept of the game. It also taps into the magic
    and mystery of physics. Just because we understand the basic laws doesn''t mean
    we understand how things will behave. It is only through experimentation that
    we can sort out exactly how far objects will fly or which direction they will
    bounce. That''s exactly what designers of physics games base the play on: exploring,
    discovering and mastering the effects of actions within the game''s simulated
    laws of physics.'
