    # Jenga:The Inherent Drama of Gravity


    The best physics-based games find a way to harness playful interaction and fill
    it with drama. Think of [Jenga](Jenga)(Figure 11.7). It uses blocks, friction
    and gravity to create a dynamic system. You create a stack of blocks and then
    players pull out pieces one by one and placing them on top of the stack, until
    the whole structure comes toppling down. As in physics-based video games, you
    must learn the way the system interacts with forces applied to the game pieces
    by gravity.


