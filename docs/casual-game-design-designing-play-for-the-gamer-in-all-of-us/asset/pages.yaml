  md: '# # CHAPTER THREE


    # # Play Is the Thing


    A firm grasp of physics starts with a good understanding of play. If you don''t
    understand the attraction and enjoyment of play, it can be hard to fathom the
    attraction of games. Even more importantly for a burgeoning game designer, it
    will be hard to create activities with which people want to engage. The playful
    activity is the elemental building block of games. All games have at their heart
    an activity which you could describe as playing. This playful activity often resides
    beneath the level of core mechanic. It supports and animates the core mechanic.
    In a game like Bejeweled, it''s the playful activity of matching, which is then
    structured by a match-three game mechanic. In a sport like soccer, it''s the kicking
    around of an object that sustains the mechanic of kicking the ball into goals.
    Aspiring game designers must be able to identify these playful activities, pick
    out the ones and build games around.


    Play is the act which we experience not only games, but much of the world around
    us. As children we use play to explore the world, sussing out from basic physics
    (if I threw a ball up in the air, it will inevitably come down) to social relations
    (if I call a girl a name, she won''t like me). Through play, we test the limits
    of our actions and impact on the world. This behavior continues into adulthood,
    although it may be less apparent and we may call it by a different name. There
    are obvious ways adults continue to play. We play golf; they get together with
    friends to play poker; they hold Wii Tennis tournaments. Then there are less obvious
    ways. Flirting is a form of play. Rough-housing with your son, painting your face
    blue and rooting for the mets, wildly cheering and calling out for “Freebird”
    at a concert are all forms of play. Even spinning your wedding ring on the conference
    room table during a meeting is play.


    New parents engage in a form of mutual play with their infants, in which both
    baby and parent poke and prod at each other, exploring and establishing the ways
    in which they can interact. A father picks up his daughter. The baby kicks her
    legs wildly, flailing below her father''s arms and whimpers. The father positions
    his daughter on his hip to try and get the girl to stop kicking. He swings her
    around and bounces her on his knee. They both look at each other with a moment
    of incertitude, as if asking, “Is this right? We reached a moment of mutual comfort
    and happiness?” The father tickles the girl and smiles. The girl smiles back'
