  md: '# CHAPTER TWO • THE GAME MECHANIC AT WORK


    As the features are fully built out the game designer will craft the arc of the
    player experience. This means taking into account player learning curves. This
    can be particularly tricky with casual games, as the audience is very broad and
    has a wide range of abilities. As the designer, you will need to design a path
    through the game to suit all types of players, from expert gamers to the first-time
    player uncomfortable with using a mouse.


    Level design is an art unto itself, to which you no doubt dedicate an entire book.
    Here are some general guidelines and approaches for designing levels:


    +   * Be empathetic

    * If you can''t beat your level, it''s waaaaaaaay so hard

    * Design for the general audience, not the hardcore

    * Ease players into the game

    * Don''t forget to challenge players

    * Build levels around a central concept

    * Teach players to play the level

    * Give players room to explore

