  md: '# CHAPTER TWELVE • SOCIALIZING


    The more you play What to Wear, the more you develop a sense for the taste of
    the other players. You begin to realize that part of picking out an outfit is
    assembling a look and using items you think other people will like. Like real
    fashion, picking out an outfit is one part you like and one part what you think
    others will like. You must not only make what you like, but what you think other
    players will find hot. Through the clever combination of creating your own outfits
    and being forced to sit in judgment of other players'' outfits, the game creates
    a system that simulates the social milieu of fashion. By exploring the different
    looks others have created, you can begin to formulate guesses about what combinations
    and looks will earn more votes from the group in future contests. Like Apples
    to Apples, you learn to try and read the crowd.


