  md: 'of. Hitting is such a physical activity that it quickly acquaints us with many
    aspects of the object of our aim. Through swinging a bat at a ball, we come to
    understand the weight and density of the bat. We feel its shape and experience
    how it cuts through the air. From the vibration that rings the bat upon contact
    with a ball, we gauge what material it is made of. And as we focus on the ball,
    we suss out its characteristics as well as intuit basic properties of Newtonian
    physics, from gravity to friction to torque. This learning happens for everyone,
    from kids to adults. This process of learning and exploration combines with the
    visceral expression of power to form a powerful cocktail.


    # Scaling with Skill


    It''s no wonder that hitting, in its myriad forms, sits at the center of so many
    games, from sports like baseball and soccer (albeit hitting with your foot) to
    arcade games like Whac-A-Mole to digital games like Wii Tennis. Each of these
    games hitting into a game context where it draws on the visceral expression of
    power and the exploration of physical characteristics. Hitting imbues each of
    these games with a clear starting point. The main mechanic for interaction is
    so familiar that it requires nearly no explanation. Each game gives clear feedback.
    But the degree to which each game succeeds in providing long-term depends on how
    well the game harnesses the potential of the hitting mechanic to meet various
    skill levels.


    It would be easy to assume that hitting is simply brutish act with little finesse.
    But what''s great about hitting is that it scales with skill levels. While it
    is easy to Take baseball again. Swinging a Wifflebat and knocking a ball off tee
    is not difficult. With a little coordination and a few swings, we can all master
    it. Hitting a softball by a pitcher can be difficult. The ball flies through the
    air and you must quickly calculate its speed and arc, plus how long it will take
    you to bring your back in time to make contact. All you have to keep your eye
    on the ball if you want to hit it. And if hitting a softball seems hard, hitting
    a fastball by a professional pitcher is nearly impossible. In his How We Decide,
    Jonah Lerner breaks down the near absurdity of hitting a Major League Baseball
    pitch. A typical Major League pitch takes 0.35 seconds from the fly to the catcher''s
    mitt. It takes a batter about 0.25 seconds for his muscles to initiate a swing.
    It takes a few milliseconds for the visual information of the oncoming pitch to
    travel from the retina to the visual cortex. This leaves the batter with about
    five milliseconds to decide if he is going to swing. The problem is people can''t
    think that fast. It takes the human brain about 20 milliseconds to react to sensory
    input.


    So Major League batters begin collecting information about the pitch before it
    is thrown. They read how he winds up, what pitches


    > ²Lerner, Jonah, How We Decide, Houghton Mifflin, 2009, p. 25'
