    # Be Empathetic


    When first time designers sit down to try their hand at level design, they almost
    always produce incredibly complex, punishing levels. If all you had to go by levels
    crafted by beginner designers, you would conclude game design was a blood sport.
    First-time designers mistakenly take level design as a contest between player
    and designer. The ethos seems to be, "But can you beat this?! This is the wrong
    approach. Level design should not be a struggle between designer and player. No,
    the game designer should offer a helping hand to guide the players through the
    level, leading them towards enjoyment. At times this means the player a good time.
    But other times it means the player succeeded.


    So how do you know if they are having a good time? That''s a much harder to measure
    than success and failure rates. You need to employ your sense of empathy. You
    need be able to put yourself in the position of the players and see the game through
    their eyes. They don''t know all of the tricks and secrets hidden in the level.
    The game designer creates the basic concept of the level. But then you must ask
    yourself, what would the players like to do? What will make them enjoy the level?'
