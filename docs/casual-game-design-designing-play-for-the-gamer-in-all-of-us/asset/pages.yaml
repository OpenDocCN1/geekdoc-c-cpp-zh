  md: '# CHAPTER NINE > CHAINING


    Sometimes, though a game can''t be brought to life by simply adding more clicks
    and stars. The game may require a different vector that actually directs player
    behavior and gives the experience more shape and tension. This vector needs to
    be at slight odds with the main gameplay. It should present a different choice
    or ask you, the player, to do something different from what the main game asks.
    Sometimes, this second vector stands in actual opposition to the main mechanic,
    asking you to do something which puts you with the main mechanic at risk. This
    forces you to continually make the decision: Do I take the easy route or do the
    more complex route and risk failure, but reap rewards?


    # Diner Dash: Pushing Your Luck


    The chaining mechanic in Diner Dash provides an excellent example of a vector
    that runs almost perpendicular to the main mechanic of ushering customers through
    their meal. Peter Lee, the co-founder of Gamealab and the producer of Diner Dash,
    maintains that Diner Dash wasn''t fun until they started getting points for every
    click. Despite the engaging spinning core mechanic, the game still felt a bit
    limp. But when they started getting points for each step in the process, the game
    came to life. As always, feedback is a good thing. But it''s not that Diner Dash
    awards those points that really imbues the game with a dynamic back and forth
    between risk and reward.


    The basic mechanic of stepping through the process of serving customers is relatively
    straightforward. The player learns the basics in the first level, and after a
    few customers, the player has the process down plus. The games won''t let you
    bring the customers wrong or bother the order of steps. The means really only
    gets complicated when you must serve multiple customers at the same time. When
    you have multiple customers, watch your dots and make sure you act quickly in
    order to keep the line moving. But even in these cases, your best option is generally
    to proceed in the order customers arrived.


    This sort of straight path through can be deadly for a game. After a bit of experimentation,
    players will find a game''s optimal strategy and set of moves. Then they will
    continue to perform that set of moves over and over. They will do this even if
    it makes the game more boring to play. In response, frustrated game designers
    bemoan, "But it''s more fun if you play it this way!" very well may be, but designers
    can''t perfect players to go that extra mile and play the game right way, just
    to have fun. This sort of frustration often gets first-time designers. See, the
    funny thing is, players don'' really want to have fun. They want to win. Fun is
    a sort of happy accident by playing a game in order to win.


    Players want to win, and through the structure of the game, you''ve told them
    the way to win. Once players find the optimal strategy—the strategy that results
    in the fewest moves to the greatest score—they will continue to do until something
    prevents them from doing it. Sometimes, it takes a little to figure out the optimal
    strategy. But every player, from the moment they sit down with the game, is looking
    for the path that offers the least resistance and the greatest reward.


    121'
