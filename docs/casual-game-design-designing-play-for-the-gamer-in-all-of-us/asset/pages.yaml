    A number of researchers have investigated the effects on the brain of playing
    Tetris

    and found that the game increases cerebral energy and boosts general cognitive

    functions, from critical thinking to language processing.


    I doubt that Tetris is the only game that stimulates mental activity. I would
    haz-

    ard a guess that most most games foster some increases in cognitive activity.

    Tetris'' ubiquity and simplicity make it an ideal candidate for study. Thanks
