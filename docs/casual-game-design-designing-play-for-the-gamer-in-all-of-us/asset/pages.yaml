    in the real world reinforced the game system. Real-world fashion and Jojo''s Fashion
    Show became enshed in a small feedback loop.


    Working on Jojo''s and watching how players reacted to the game highlighted the
    interesting potential of using information extrinsic to the game system. The players
    encountered similar information and attributes in the real world they continued
    to play the game even after they hit out. Of course not every game need to leverage
    extrinsic data like this. Fashion is a very peculiar system that already has game-like
    qualities (That''s in style); but for casual gamers using some sort of real-world
    information can be a very potent tool. Players don''t have to learn a particular
    new system of thought to play the game. Rather, they get to lean on one they already
    know and enjoy interacting. Making a game of one of your favorite activities,
    in this case dressing up, is a great way to make a game that people will immediately
    identify and connect with. After all, it''s much easier to fall in love with a
    beautiful pair of black slingbacks than it is the seven of clubs.'
