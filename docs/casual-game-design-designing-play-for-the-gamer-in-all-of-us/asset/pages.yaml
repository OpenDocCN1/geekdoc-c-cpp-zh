  md: '# APPLES TO APPLES: READING PEOPLE, NOT THE GAME


    It is interesting to watch the reactions of first-time players. Those expecting
    a more formal game are inevitably surprised and sometimes frustrated with the
    arbitrary nature of the judging combined with the random cards you deal. Players
    often complain that the game lacks strategy. They point out that players deal
    a hand of cards which are largely useless. They only discard and replace one card
    at a time, making it hard to get new cards if they feel the ones are not. Unlike
    a game like poker, where the players can discard and draw new cards to hopefully
    replenish their hand with more useful cards, Apples to Apples has no such value.
    This leaves players with few options for strategy in managing their card deck.


    The randomness of the deal is compounded by the arbitrariness of the judge''s
    choices. Since the player can choose based on any criteria, some players believe
    they can just throw down any random card and stand about a chance at winning the
    round as if they carefully deliberated their choice. The game offers little strategy
    in this form of deck management. Instead, all of strategy is bound upon how well
    you can read and anticipate the associations other players would like to make.
    This game is explicitly social. There''s nothing to figure out about the game
    system. The only thing to figure out is your fellow players—their personalities,
    their likes and dislikes, what they think. The formal game system is thin, but
    the social elements are complex.


    The thinness of the formal can put a strain on the game. Players must be willing
    to buy into the game and open up to the social interaction. All party games live
    and die on the willingness of players to give themselves over to the game. This
    problem is less pronounced in more formal games, where a complex set of rules
    dictate and control the interaction. A game like checkers doesn''t rely on the
    players'' willingness to get into the game. The rules exactly how pieces should
    move and where they land. Taking another player''s checker is not open to interpretation.
    If you jump the piece, you get to remove it. But a less formal game like Apples
    to Apples handles the reins controlling the proceedings to the player, saying,
    "How will you know which card is right? Just pick one that feels right to"


    If players are unwilling to pick up their reins, the game flags. Along with the
    rules, the game provides Playing Tips, Which are possibly more crucial to the
    success of the game from the formal rules. These tips read:¹


    +   It''s to pick a red card that isn''t a perfect fit. Judges will often pick
