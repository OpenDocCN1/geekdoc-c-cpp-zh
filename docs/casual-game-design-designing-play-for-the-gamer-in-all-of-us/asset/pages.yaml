    but it runs the risk of dampening that moment of tension release accompanies finding
    an object. This enables players to scan the game area with their mouse to see
    what lights up. This is a trade-off the game seems happy to make in exchange for
    the depth of logic. I would tend to agree with this trade-off. I’ll always take
    a bit of depth over a flat exercise—even at the cost of the game easier.


    # Summary


    New use of logic in seek-and-find games holds out the promise for more complex
    gameplay as the mechanic evolves and the audience adapts. Eventually, the games
    will evolve to a place where players can take multiple logical paths to the same
    conclusion. They will be able to find a flashlight or a book of matches to find
    the light switch. This introduction of more variety will strengthen the gameplay
    hooks. As the sought items become actual objects with cultural and functional
    associations the player will not just consider the appearance of the objects on
    the screen, but the functionality as well. This dual processing will offer a more
    engaging experience. It will also allow players to feel clever, creating what
    they believe their own solutions.


    Chains of logic also hold out the potential for usher players into a state of
    flow. If they are part of a sequence, then moves are building on one another.
    Each offers the player a more integrated set of moves and smoother experience.
    Each feels related to the next, rather than entirely individual.


    Of course, multiple paths through a space present other problems. It complicates
    level design and muddies the clarity of the game. Multiple paths to success can'
