    随着他使用 Simula 的时间越来越多，他注意到了该语言一些不尽人意的之处。随着项目规模和范围的扩大，Stroustrup 越发意识到 Simula 无法随着他的程序增长而扩展。当他要求程序与不同的类之间进行通信时，他遇到了时间问题。程序运行所需不再像程序较小时那样的快了。此外，他发现所谓的运行时性能也很糟糕。这意味着继续运行仿真是不切实际的，因为检索到的数据基本上是毫无用处的。为了挽救他的项目，Stroustrup
    进行了最后的最后的挣扎，使用一种名为 `BCPL` 的更偏向机器的语言重写了整个项目。他在 Simula 中遇到的问题是如此严重，以至于如果没有重写项目，就无法获得博士学位。他的最终项目以令人满意的速度运行。然而，`BCPL`
    缺乏 Simula 所提供的简单实现。


    ![](img/main-11.jpg)


    变量就像鸡蛋。尽管它们从外面看起来完全一样，但壳内包含的信息（或蛋黄）才是让程序运行的关键。


    ### C 的诞生


    由于在剑桥度过的时光，Stroustrup 认为需要一种新的编程语言。他希望将零级抽象与硬件的紧密结合。。这种“接近性”的想法意味着，运行软件的物理元素应该是那些距离其运行机器主要组件最近的部件。这成为了最终被称为
    `C++` 的基础。从那里开始，他确定他的语言必须是一个用于程序组织的合适工具，运行速度要像 `BCPL` 一样快，并允许可移植实现。可移植实现的意思是，运行在某台计算机上的程序可以带到另一台计算机上并以非常相同的方式运行。当时，这种语言有几种选择。唯一的问题是？它们对于普通程序员来说远远不可负担。Stroustrup
    构想了一种对专家和初学者程序员都有吸引力的东西。然而，直到他开始在名为贝尔实验室（Bell Laboratories）的公司工作，他的想法才终于开始取得成效。


    在 1979 年 4 月接受贝尔实验室计算机科学研究中心的职位后，Stroustrup 被指派分析最新的 `UNIX` 内核，即运行计算机操作系统的核心程序。与他使用
    Simula 和 `BCPL` 的经历一样，他开始对手头的语言产生问题，于是他着设计一种能够充分完成他所要求任务的工具。


    到同同年 10 月，Stroustrup 成功地使用一种名为 `C` 的现有语言实现了他想要的必要更改。结合了他对组织和速度的需求，他开发了带有类的 `C`（C
    with Classes）。它主要被视为 `C` 的更新，但这是一门完全属于自己的语言。


    ### 贝尔实验室


    o o o


    ![](img/main-12.jpg)


    贝尔实验室是许多技术的诞生地，包括那些使用和影响 `C++` 的技术。


    贝尔实验室的极早期起源可以追溯到 1876 年发明电话的亚历山大·格拉姆·贝尔（Alexander Graham Bell）。贝尔实验室最初是美国电话电报公司（更广为人知的
    `AT&T`）的一部分，一直处于创新的前沿。事实上，贝尔实验室最初是西电电气公司（Western Electric）内部的研究部门，作为 `AT&T` 运作的众多子公司之一。最终，`AT&T`（以及随后的西电电气）决定将其研究工作与普通业务职能分离。这创建了一个独立的研究部门，被称为贝尔电话实验室（Bell
    Telephone Laboratories）。新成立的贝尔实验室于 1925 年 1 月 1 日开始运营。在 20 世纪 30 年代到 70 年代不断增长，贝尔实验室成为了我们今天仍在使用的许多重要技术的诞生地。


    ### 贝尔实验室（续）


    o o o


    随着第二次世界大战的到来，贝尔实验室在 20 世纪 30 年代出现了大量的军事发现。这些创新包括双向无线电、火箭筒和雷达。贝尔实验室甚至让富兰克林·罗斯福和温斯顿·丘吉尔通过名为
    `SIGSALY` 的机器在大西洋两岸之间进行安全通信，使盟军能够保持近乎持续的联系。由于这些发明以及贝尔实验室科学家做出的许多其他贡献，研究工作持续从 20
    世纪 30 年代扩展到 70 年代后期。基于 PC 的发明数量在 20 世纪的 70 年代和 80 年代大幅增加。除了 `C++` 之外，实验室还见证了如
    `Unix` 操作系统等理念的实现。此外，贝尔实验室的研究人员开了光纤技术。不久，得益于互联网的发明，光纤被用于保持世界的连接。但贝尔实验室最终面临了巨大的挫折。


    由于指控 `AT&T` 违反美国反垄断法，该公司于 1984 年被带上法庭。在听证期间，他们被判定为通信行业的垄断者。法院要求 `AT&T` 退出参与的任何本地电话业务，贝尔实验室也受到了影响。贝尔实验室继续存在，但规模较小的业务运营意味着可提供的财务资源减少。他们的研究活动萎缩了。1996
    年再次遇到困难，`AT&T` 与贝尔实验室彻底断了联系，转而将他们置于


    ![](img/main-13.jpg)


    路由器是朗讯科技（Lucent Technologies）改进的许多设备之一。


    阿尔卡塔尔-朗信公司（Alcatel-Lucent Corporation）。虽然朗讯科技的规模小于贝尔实验室鼎盛时期，但朗讯实验室仍然资助语音和数据通信领域的研究活动。最近一次所有交手发生在
    2015 年，当时诺基亚（Nokia）与阿尔卡塔尔 朗信达成了一项价值 170 亿欧元的交易。如今，朗讯科技专注于开发助力通信的元件。这包括更好的路由器、交换机和电缆。自
    20 世纪初创立以来，贝尔实验室见证了十多位诺贝尔奖获得者和数百项发明通过其大门。无论以什么名称运作，贝尔实验室对电信业都做出了不可比拟的贡献。


    ### 带类的 C 如何变成 C++


    带有类的 C 在编程社区获得了略微积极的支持，Stroustrup 面临一个选择。他是应该放弃带有类的 C 并用这段时间做其他事情？还是应该开发一种更好、具有更大潜力和支持的语言？幸运的是，Stroustrup
    选择了后者。在分析了最初尝试（带有类的 C）的缺点后，他确定其继任者需要更精简。此外，它必须使用更便于广泛人士使用的编译器技术来实现。


    在开发一种全新的编程语言时，Stroustrup 在 `C++` 的初始设计过程中始终着几个关键问题：


    1. 它的用户是谁？

    2. 他们将使用什么样的硬件？

    3. 他如何离开工具制造业务转而制作一种成功的语言？

    4. 上述答案将如何影响他对这门语言的定义？


    虽然这些问题看起来很简单，但它们的答案远非如此。

    '
- fmt: '

    Much like any other product on the market, the first question Stroustrup had was
    who would be using his program. Without a viable audience, his efforts would not
    pay off. Initially, he pinpointed his audience to be himself and fellow colleagues
    at Bell Laboratories. He and his colleagues were in desperate need of a programming
    language that did what Stroustrup promised. From there, Stroustrup hoped that
    its use would spread to AT&T and eventually on to universities. The process would
    end with it finally reaching beyond that to a point where AT&T could make money
    by selling the evolved set of tools that came from his language. Stroustrup set
    out to work with affordability in mind, reasoning that bigger corporations, like
    AT&T, could create more industrialized versions of his language that met their
    needs. After all, cost was hardly a concern for large, well-established corporations.
    It was in this way that Stroustrup managed to leave the business of making tools,
    answering the third question he had posed in his language-making process. By putting
    the responsibility of advancement on someone other than himself, Stroustrup was
    able to let C++ form into whatever its users needed at the time, since it was
    they themselves who would be molding it to their needs.


    Another important element of C++’s design Stroustrup had to consider was the type
    of system it would be used on. Since his language was heavily influenced and modeled
    after C with Classes, he determined that it should run on many of the same systems.
    Since C with Classes was an incredibly portable language at the time, it was Stroustrup’s
    intention for C++ to run on anything from supercomputers to the most basic systems.
    Thus, C++ had to be able to be run on variable amounts of memory. This included
    memory sizes from large to miniscule, leaving no room to assume the size and the
    speed of the machines that were in use. Stroustrup considered these and other
    technical aspects as he moved forward. The final piece of defining the language
    was deciding on a compiler. Stroustrup determined that C++ could not require a
    super-sophisticated compiler. Knowing that he needed a simple compiler in order
    for his language to execute in the fashion he desired, Stroustrup took matters
    into his own hands and made the CFront compiler a reality.


    ### The CFront Compiler


    Before delving into the details of Stroustrup’s CFront compiler, it is important
    to understand what a compiler does on a basic level. Compilers fill an essential
    role in implementing programming languages. This is due to the fact that compilers
    serve as a means of translation for the machine that is generating the code. There
    are three parts to the compilation process, which is a simple execution of inputs
    and outputs. The user codes and designs the source program using a source language,
    or language that can be read and understood by the programmer. In the case of
    the CFront compiler, the source language being used is `C++`. The source language
    serves as the version of the program that is defined by human concepts. Once inputted
    into the compiler, the compiler then checks for errors within the source code.
    These errors can span any of the following categories: syntax, semantics (the
    meaning of strings of code), and code generation. It is because of this error-checking
    ability that compilers are a vital component in the debugging process. Once a
    program compiles without triggering any errors, the compiler then translates the
    human-readable code into an assembly language, or language that the machine itself
    can make sense of. Upon successful compilation, the program is then implemented
    and executes the task being asked of it, barring any runtime errors.


    With the initial design stages of `C++` complete, Stroustrup turned his attention
    to creating a compiler devoted to making the most out of his language. First available
    in 1983, the CFront compiler was designed with simplicity in mind. Knowing that
    people were resistant to change, Stroustrup made it so his compiler would translate
    the inputted `C++` source program into machine-generated `C` language. This was
    a good choice because it allowed those who were familiar with the “old” `C` language
    to still maintain a certain familiarity with how their programs worked. In addition,
    technology at the time did not support `C++` debuggers. The lack of a debugger
    forced programmers to look for errors in their `C`-generated machine code. While
    this was tedious, it did not deter people from using `C++` since `C` was already
    a commonly understood language within the computer science industry. Lastly, and
    potentially the most influential, was the CFront compiler’s ability to transfer
    to new platforms. Because it broke down `C++` into `C`, the CFront compiler could
    be placed on any system that housed a `C` compiler. At the time, a `C` compiler
    could be found on nearly every machine in use.


    CFront was unique in the sense that it was one of the first front-end compilers,
    meaning that instead of having one compilation process, `C++` required two. Initially,
    the `C++` source program would be compiled and then translated into a `C`-based
    machine language. That in turn would then be placed within the resident `C` compiler,
    which would be the one to actually execute the code upon completion. In this way,
    Stroustrup managed to leave the business of making tools, answering the third
    question he had posed in his language-making process. By putting the responsibility
    of advancement on someone other than himself, Stroustrup was able to let `C++`
    form into whatever its users needed at the time, since it was they themselves
    who would be molding it to their needs.


    ### Why Use C?


    With all the other languages in use at the time, one might ask why Stroustrup
    decide to base his language off of C, instead of some other language. The simplest
    answer is that Stroustrup had a background of knowledge in `C`, since he spent
    much of his time in school using language. However, there are a few key characteristics
    of `C` that made it a desirable model to base his language off of. The first one
    was its availability. Most every in use at the time had a `C` compiler. If for
    some reason it did not, there was often a multitude of resources to pull from
    so that a programmer hardly ever to design a new compiler system from the ground
    up. In conjunction with its availability, `C` was also portable. While it was
    not immediately possible to transfer a `C` program from one computer to another,
    it was practical both technologically and financially to make this happen with
    the right software. The last two key components that contributed to using `C`
    as a basis for `C++` were its flexibility and efficiency. Stroustrup had wanted
    to design a program that could be used by a large audience on a variety of projects.
    Therefore, he needed a language that would adapt to each user’s unique needs,
    while still matching the memory constraints that had placed upon them.


    ### How C++ Got Its Name


    While it is known ubiquitously throughout the computer science community today
    as `C++`, Stroustrup’s programming language went through many name changes before
    arriving at its current name. When development began in 1983, the resulting programming
    language was still known as C with Classes. Confusing, right? The language underwent
    its first name change at the request of one of Stroustrup’s managers at Bell Laboratories,
    at which point it became known as C84. These changes helped break the habit of
    people referring to the different versions of C with Classes as the “new C” and
    the “old C,” since they no longer shared a name. However, this new identity as
    C84 lasted mere months before another name change was suggested.

    '
