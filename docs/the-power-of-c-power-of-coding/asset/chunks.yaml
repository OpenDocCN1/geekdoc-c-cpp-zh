    As he worked more and more with Simula, he noted a few things that were undesirable
    about the language. As his projects grew in size and scope, Stroustrup became
    increasingly more aware of Simula’s inability to grow with his programs. When
    he asked his programs to communicate with separate classes, he ran into time issues.
    The time it took to run the programs was not as quick as it had been when his
    programs were smaller. In addition, he found that what is known as runtime performance
    was also poor. This meant that it was unrealistic to continue running simulations,
    as the data retrieved would be essentially useless. As a last-ditch effort to
    save his project, Stroustrup rewrote the entire thing using a more machine-oriented
    language called `BCPL`. The problems he’d encountered with Simula were so severe
    that if he had not rewritten his project, he would not have earned his PhD. His
    final project ran at speeds that were desirable. However, `BCPL` lacked the simplistic
    implementation that Simula had offered.


    ![](images/main-11.jpg)


    Variables are like eggs. Even though they appear the same on the outside, the
    information, or yolk, that''s contained within the shell is what makes the program
    run.


    ### C is Born


    Because of his time spent at Cambridge, Stroustrup saw a need for a new programming
    language. He hoped to combine zero-level abstraction with close proximity to hardware.
    The idea of proximity simply means that the physical elements that run the software
    would be those pieces that were closest to the main components of the machine
    it was running on. This became the basis for what would eventually be known as
    `C++`. From there, he determined that his language would have to be a suitable
    tool for program organization, run as fast as `BCPL`, and allow for portable implementations.
    Portable implementation is the idea that a program running on one computer could
    be brought to another computer and run in much the same fashion. At the time,
    there were a few options out there for such a language. The only problem? They
    were far from affordable for the casual programmer. Stroustrup imagined something
    that would be appealing to the expert and novice programmer alike. It was not
    until he began working at a company called Bell Laboratories, however, that his
    idea finally began to come to fruition.


    Upon accepting his position at the Computer Science Research Center of Bell Laboratories
    in April of 1979, Stroustrup was tasked the job of analyzing the most recent `UNIX`
    kernel, or the core program that runs a computer’s operating system. Much like
    his time spent with Simula and `BCPL`, he began to have issues with the language
    at hand, so he set out to design a tool that could adequately perform the tasks
    he asked of it.


    By October of that same year, Stroustrup had managed to implement the necessary
    changes he wanted, using an existing language, known as `C`. Combining his need
    for organization and speed, he developed `C` with Classes. It was primarily viewed
    as an update to `C`, but this was a language all its own.


    ### Bell Laboratories


    o o o


    ![](images/main-12.jpg)


    Bell Laboratories has been the birthplace of many technologies, including those
    that use and influence `C++`.


    The very beginnings of Bell Laboratories can be traced back to Alexander Graham
    Bell, who invented the telephone in 1876. Initially a part of the American Telephone
    and Telegraph Company, more commonly known as `AT&T`, Bell Labs has always been
    at the forefront of innovation. In fact, Bell Labs was originally known as the
    research department within Western Electric and served as one of the many subsidiaries
    that functioned under `AT&T`. Ultimately, `AT&T` (and Western Electric with it)
    decided to split its research from its normal business functions. This created
    a standalone research division, known as Bell Telephone Laboratories. The newly
    formed Bell Labs began operation on January 1, 1925. Continually growing between
    the 1930s and the 1970s, Bell Labs became the birthplace for many important technologies
    that we still use today.


    ### Bell Laboratories (continued)


    o o o


    With the advent of World War II, Bell Laboratories saw an influx of military-based
    discoveries in the 1930s. These innovations included the two-way radio, the bazooka,
    and radar. Bell Laboratories even made it possible for Franklin Roosevelt and
    Winston Churchill to communicate securely from opposite sides of the Atlantic
    through machines called `SIGSALY`, enabling the Allied Forces to remain in near-constant
    contact. Because of these inventions, and the many other contributions scientists
    at Bell Laboratories made, research efforts continued to expand beyond the 1930s
    and into the late 1970s. The number of PC-based inventions created greatly increased
    in the 1970s and 1980s. `C++` aside, the laboratories also saw ideas like the
    `Unix` Operating System come to fruition. In addition, researchers at Bell Labs
    pioneered fiber-optic technology. And in time, optical fiber would be used to
    keep the world connected, thanks to the invention of the internet. But Bell Laboratories
    eventually faced tremendous setbacks.


    Due to allegations that `AT&T` was in violation of the United States''s antitrust
    law, the company was taken to court in 1984. During the hearing, they were determined
    to be a monopoly within the communications industry. The courts required that
    `AT&T` remove itself from any local telephone operations it was a part of, and
    Bell Laboratories was affected. Bell Labs continued to exist, but the smaller-scale
    business operations meant there were fewer financial resources to pull from. Their
    research endeavors shrank. Met again with difficulties in 1996, `AT&T` completely
    severed ties with Bell Laboratories and instead placed them under the control
    of


    ![](images/main-13.jpg)


    Routers are among the many devices that have been imrpoved by Lucent Technologies.


    Alcatel-Lucent Corporation. While Lucent Technologies was smaller than the original
    Bell Laboratories were back during their prime, Lucent Laboratories still funded
    research endeavors within the voice and data communications sector. The most recent
    change of hands took place in 2015, when Nokia merged with Alcatel-Lucent in a
    $17 billion deal. Today, Lucent Technologies focuses on developing elements that
    help enable telecommunication. This includes making better routers, switches,
    and cables. Since its creation in the early 1900s, Bell Laboratories has seen
    more than ten Nobel Prize winners and hundreds of inventions pass through its
    doors. Regardless of what name it was functioning under, Bell Labs has made an
    unmatchable contribution to the telecommunication industry.


    ### How C with Classes Became C++


    C with Classes received mildly positive support from the programming community,
    and Stroustrup was left with a choice. Should he give up on C with Classes and
    do something else with his time? Or should he develop an even better language
    that would have a greater amount of potential and support? Thankfully, Stroustrup
    made the latter decision. After analyzing the weaknesses of his initial attempt,
    C with Classes, he determined that its successor needed to be more streamlined.
    In addition, it had to be implemented using compiler technology that was more
    accessible to a large range of people.


    With an entirely new coding language in the works, Stroustrup maintained a few
    key questions throughout the initial design process of `C++`:


    1. Who would its users be?

    2. What kinds of hardware would they be using?

    3. How would he leave the business of making tools to instead make a successful
    language?

    4. How should the above answers affect how he defined the language?


    While his questions seemed simple enough, their answers were far from it.

