- fmt: '

    While all the other features it added were great additions, quite possibly the
    most influential one was compatibility with the Nintendo Switch. `Unreal Engine
    4.15` allows its users to develop and release games that can be played on the
    Nintendo console that premiered in 2017. This feature was first deemed as “experimental”
    in nature but will switch over to a “shippable state” with coming updates. Going
    hand-in-hand with the `Unreal Engine`, the Nintendo Switch also relies on `C++`.


    # Nintendo Switch


    Hitting markets worldwide on March 3, 2017, the Nintendo Switch was a highly anticipated
    release within the video game industry. Nintendo developed this new gaming console
    to serve as a hybrid between portable and home consoles after the failure of the
    `Wii U`. Complete with a docking station for at-home use and Joy Con joysticks
    for portable play, the Switch has brought about a new way of gaming. This was
    an important event within the `C++` community as well, since a majority of the
    titles released previously through Nintendo were partially or completely coded
    using `C++`.


    ![](images/main-49.jpg)


    The `Wii U` is just one of many technologies that uses `C++` code. The Nintendo
    Switch (also coded in `C++`) was developed after the `Wii U` failed commercially.


    As it stands, most users agree that the Switch has great potential, since Nintendo
    has paired up with `Epic Games` to allow for indie developers to make games. However,
    there are only 185 games available for the Switch as of this writing, which includes
    the long-anticipated `Zelda: Breath of the Wild`. In comparison, `Xbox One` features
    nearly 1,100 titles and the `Playstation 4` has 1,594 games for its users to choose
    from. While the number of games will likely increase as time goes on, the success
    of the console may solely depend on how many game developers decide to create
    titles that are compatible with the new system.


    ## Bringing It All Together


    Bjarne Stroustrup’s language has come a long way since its first standardization
    in 1998. It’s hard to believe that such an important programming language had
    humble beginnings as a descendent of the `Simula` language and from Stroustrup’s
    motivation to develop programming features for his thesis project. This general-purpose
    programming language sought to meet the demands of the programmer, making it an
    adaptable and useful tool to the programming community. Through its backwards
    compatibility with `C` and its influence on languages that were developed after
    it, `C++` has had a lasting effect on the technology of today. While it may not
    be an easy language to learn, its towering presence makes it a beneficial tool
    worth mastering. With learning opportunities present in formal settings, such
    as schools, to more casual settings, such as online video seminars, learning `C++`
    is possible for just about anyone. Whether someone takes on its steep learning
    curve or not, they have surely experienced `C++` in one form or another.


    From video games to various software applications, `C++` is still thriving and
    taking the rapid changes of the tech world in stride. Because of this, there are
    many job opportunities available, from software developers to the less programming-intense
    positions, like technical writing. In addition to standard office jobs, `C++`
    also allows the freedom for those individuals pursuing freelance work. Since it
    only requires a computer to develop code, `C++` jobs can often be done anywhere.
    This, in combination with the growth of alternative career options, makes `C++`
    a great choice for someone pursuing freelance work.


    Work options aside, `C++` has a large amount of potential for the future. Where
    other languages fade away because they’ve become obsolete within the technological
    sector, `C++` continues to adapt to the broad needs of its audience. The future
    implementations that are slated to be released in coming years are direct proof.
    In addition to these updated standards, `C++` and its ever-growing library of
    resources also contribute to its long-lasting usefulness to programmers. As long
    as Stroustrup and the `C++` community keep adapting the language to their needs,
    it will surely be around for years to come.


    ![](images/image_006_.jpg)


    - **abstraction**: The process by which a programmer or program filters out details
    to show only what is completely necessary for the functioning of the program.

    - **backwards compatibility**: The ability to use a programming language or piece
    of technology that came before with a new language or technology.

    - **classes**: Basic outlines of the methods and variables used with a program.
    A class serves as a template to objects.

    - **compile time**: The time it takes a compiler to translate a program into machine-readable
    code and check for potential errors.

    - **constructor**: The part of the class that actually builds an instance of an
    object. This is the part of the code that defines what variables will be available
    in the newly created object.

    - **data structures**: The structures that allow for program information to be
    organized and stored. These can be made from trees, lists, and arrays.

    - **debuggers**: A program that can assist the programmer in finding errors and
    complications within the code.

    - **developing firm**: The formally organized company that develops, publishes,
    and distributes a particular video game.

    - **directive**: The lines of code that are read during the preprocessing of a
    program. Directives tell the compiler how to prepare itself for the incoming program
    by informing it of the various library files that may be used within the program.

    - **embedded systems**: A computer system with a defined use, such as computers
    developed solely for financial banking or airline booking.

    - **extensions**: Add-ons made available to a program or implementation of a programming
    language.

    - **functions**: A collection of statements within the program that perform a
    particular task.

    - **garbage collection**: A form of memory management that automatically deletes
    methods that are no longer being used. `C++` does not automatically provide this,
    but it may be programmed to accommodate such memory deletion.

    - **Include What You Use (IWYU)**: The idea that a program should only include
    what it uses within its code, so as to avoid unnecessary lines of code.

    - **indie developers**: Independent video game developers who release games on
    their own, without help from big corporations.

    - **integrated development environment (IDE)**: A software application that provides
    various tools to make programming easier, such as inline code suggestions and
    a simplified view of the debugging process.

    - **interface**: The application that allows a user to communicati with a computer,
    or what a user sees when a program is run.

    - **interpreted language**: A programming language that does not require compilation,
    or translation of its source code to machine-readable code, like `Python`.

    - **kernel**: The part of the computer that holds the core computing power, known
    as the operating system.

    - **method**: A programmed section of a class that is meant to accomplish something
    for the program.

    - **object**: A particular instance of a class that holds specific information
    to that iteration of the object in question.

    - **object-oriented programming (OOP)**: A variety of programming that implements
    objects within its code.

    - **package**: A collection of Java classes housed together, often in a `.JAR`
    file.

    - **Risch''s algorithm**: A complicated algorithm used within computer science.

    - **scripting**: The process of generating web pages on the internet.

    - **standardization**: The process of developing and recognizing the various rules
    of a programming language as the de facto version and having clear guidelines
    laid out by an organization regarding the specifics of a language.

    - **subsidiaries**: The term used to describe a company that is aerated by another
    company, such as the relationship between Lucent Laboratories and Nokia.

