    study products, survey customers, and select from various mediums in which to
    convey their information. Because of this, technical writers can also benefit
    from more creatively driven courses, since they are expected to deliver text through
    interesting means online and through social media. These positions often do not
    require the long hours that development jobs may, but there is usually a need
    to accommodate those in other time zones. This could translate into an early or
    late workday. However, the lessened amount of stress and need to only work the
    normal requirements of a full-time job, while incorporating their previously acquired
    knowledge of `coding`, may make technical writing appealing to those who do not
    want to be programming on a regular basis. Interestingly enough, those wishing
    to break into this field can receive certification just like their `C++` inclined
    counterparts. Aside from the obvious skill of writing, technical writers should
    also have a good imagination, the ability to work with others, and technical skills.


    ![](images/main-44.jpg)


    A technical writing career can be a good fit for tech-savvy individuals who do
    not want to code.


    ## New Technologies Using C++


    While `C++` has many everyday applications, the industry where it gets the most
    use is the video game industry. Unsurprisingly, then, the newest technologies
    incorporating `C++` are found within game development software and gaming consoles.


    ### Unreal Engine 4.15


    The `Unreal Engine 4.15` was released in early 2017. For those unfamiliar with
    game development, the `Unreal Engine` is a video game engine that was originally
    released by `Epic Games` on July 1, 1998. Since then, it has gone through three
    primary editions, and current releases are updates to its fourth edition. `Unreal
    Engine 4` is a suite of integrated tools that allows game developers to create
    games, all while using `C++` source code for the entire engine.


    ## Working Outside of an Office: A Look at Freelancing


    o o o


    Most professionals sit behind a desk, from at least 9:00 to 5:00, five days out
    of the week. However, for those people who want a little more freedom in their
    schedule and work environment, freelancing is a great option. Freelancing is when
    an individual takes on various projects from hiring individuals or companies,
    rather than working for a single company on a regular basis. For someone pursuing
    this type of career, finding consistent freelance work can be a challenge.


    While securing freelance jobs can present difficulties, there are many resources
    and techniques that can lead to a successful career. The first resource is the
    internet: there are a number of sites that promote freelance work and help connect
    freelancers with those looking to hire. In addition, even job boards geared toward
    corporate jobs often have postings about contracted positions that require the
    flexibility of a freelancing employee. Additionally, varieties of self-promotion
    can come in handy when looking for freelance work. It is important to have an
    accessible online portfolio for potential employers to view past work and to provide
    contact information. Having a website for showcasing skills is only half the battle,
    however. In order to be effective, this website has to be viewed! In-person networking
    can help because it leads to name recognition. If a person''s contacts hear of
    someone looking for a freelance programmer, there is a strong likelihood that
    they will suggest the person they know. Therefore, attending networking events
    can open up a variety of opportunities. Once a job is secured, a recommendation
    from that employer can be enough to create a consistent flow of work for freelancers.


    Freelancing can give people the freedom they want in their own life, while still
    earning them a salary that can pay the expenses they accrue. As it stands right
    now, an individual who lands consistent work through freelancing can earn anywhere
    between $57,000 to $75,000 a year. According to `Glassdoor.com`, some people have
    even reported earning upwards of $150,000 while they are working from home and
    creating their own schedule! The current selection of `C++` programmers listed
    on `Upwork`, one of many freelancing websites, charge anywhere from $20 to almost
    $60 an hour for their skills. The amount of income a freelance programmer generates
    depends on the motivation of the programmer to connect with others and generate
    work, their skill level, and their flexibility. Freelancing can be a great way
    to earn money and still have the freedom to live an exciting life, but there are
    drawbacks to this career path.


    ![](images/main-46.jpg)


    Freelance work provides individuals with a lot of freedom to do what they like
    most, but it still requires a lot of work to maintain a client base.


    Although being in a cubicle forty hours a week may seem unappealing, there are
    some things that corporate life offers that freelancing cannot. The first is a
    consistent stream of income. Unless someone is fired or laid off, they can rely
    on their paycheck being deposited into their bank account on a regular basis.
    With freelancing, especially for those just starting out, there will be highs
    and lows to earning potential. Freelancers have to devote time and energy to acquiring
    work and building a client base for future projects. Because of this ebb and flow
    in income, freelancers often work on community-based projects in their less-busy
    periods, so as to sharpen their skills and continue to forth marketable work.
    In addition to inconsistent work, freelancing lacks the standard benefits that
    come with full-time jobs. Freelancing individuals must provide their own health
    insurance and start their own retirement plans, and they receive no paid off.
    This often leads to freelancers charging more than an in-house programmer would,
    since freelancers have to balance these costs as well as receive adequate compensation.
    Even so, for the right individuals, pursuing work through freelancing may create
    a highly satisfying lifestyle.


    While `Unreal Engine 4` was a great improvement to the previous editions, the
    most recent update in particular has given game developers a whole lot of new
    features to look forward to. Compile times for programs have been greatly lessened,
    cutting them as much as half in certain instances. These shorter times are possible
    for a few different reasons. First, every header within the `C++` code includes
    the necessary information to compile. They also include only information to the
    other headers they need. This `Include What You Use (IWYU)` methodology lessens
    overhead within the program, allowing it to run faster. `Unreal Engine` users
    who are more graphically inclined saw a multitude of new features that would make
    their designs easier to implement. Improved texture streaming has been added,
    which reduces CPU usage and load times. This is useful for high-quality environments
    that are developed but then run on devices that cannot handle the original memory
    versions. This `Automatic Memory Budgeting` determines which materials within
    the gaming world need to be reduced while still maintaining the visual integrity
    of the game. The new edition also saw updates made to animation capability, material
    editing, and user interface options, to name a few.

