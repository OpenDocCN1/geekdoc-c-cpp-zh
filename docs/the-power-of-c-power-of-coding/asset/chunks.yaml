    made the latter decision. After analyzing the weaknesses of his initial attempt,
    C with Classes, he determined that its successor needed to be more streamlined.
    In addition, it had to be implemented using compiler technology that was more
    accessible to a large range of people.


    With an entirely new coding language in the works, Stroustrup maintained a few
    key questions throughout the initial design process of C++:


    1\.    Who would its users be?


    2\.    What kinds of hardware would they be using?


    3\.    How would he leave the business of making tools to instead make a successful
    language?


    4\.    How should the above answers affect how he defined the language?


    While his questions seemed simple enough, their answers were far from it.'
