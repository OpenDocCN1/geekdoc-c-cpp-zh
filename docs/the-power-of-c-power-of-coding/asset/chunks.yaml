- fmt: "\nInheritance is when a new class takes on the various traits and information\
    \ of another class that it is based on. The original class or classes is known\
    \ as the superclass or parent class. The newly produced class that receives the\
    \ traits of the parent is called the child class. Inheritance allows for code\
    \ to be reused, thus allowing the program to avoid repetitive code that is unnecessary\
    \ to the function of the program. Inheritance can be either single or multiple\
    \ in nature. Put simply, a child class can either have a single parent class,\
    \ or more than one, which is called multiple inheritance. This hierarchy within\
    \ a program is comparable to what a family tree would look like, which is why\
    \ it is called inheritance.\n\nThe last item that object-oriented programming\
    \ brought to C++ is the ability to use polymorphism within its code. Polymorphism\
    \ allows a single function to be used in a variety of ways, based on the type\
    \ of data that is being put into the calculation. Let’s look at a simple adding\
    \ function, for example. If a method, or calculation, is supposed to add two things\
    \ together, it will need to act differently for numbers than it does for letters.\
    \ Polymorphism techniques would allow the programmer to have one method of “Add”\
    \ that handles words, while another adds numbers. When the program is asked to\
    \ put two things together, it will then determine what data type is being added\
    \ and then execute the function that accommodates the given types. Now that we’ve\
    \ seen the pieces of object-oriented design, we’ll turn to the various aspects\
    \ that go into C++ itself.\n\n## Driving the C++ Machine: What Makes Up Its Parts\n\
    \nFrom variables to constants, numbers to letters, C++ can accommodate nearly\
    \ any problem that it is given, so long as it is given the data in the correct\
    \ fashion.\n\n### Variables\n\nAt a very basic level, the first thing a program\
    \ will handle is the input of some sort of variable and its associated data. Similar\
    \ to variables discussed in math classes, a variable in computer science is used\
    \ in place of something else. The programmer will name their variable with some\
    \ sort of identifier, and then it may be used to house data that is either known\
    \ or unknown to the user. Within C++, there are four different variable types\
    \ available for use.\n\n#### Boolean\nThe first variable type is called a Boolean,\
    \ which is defined by placing `bool` before the identifier, or name of the variable.\
    \ A Boolean can only house two options: `true` or `false`. This is how Booleans\
    \ are used for flags within programs, or to determine when something should be\
    \ done or not. For example, imagine a program has a Boolean variable named `Stomach_Full`\
    \ that is set to `false`. `Stomach_Full` is then sent through the method `Feed_Stomach`\
    \ within which another variable called, `Food_Amount` is increased by one. The\
    \ only way to prevent the `Stomach_Full` variable from being sent into the `Feed_Stomach`\
    \ method is for the person eating to be full, which would then set `Stomach_Full`\
    \ from `false` to `true`. In other words, a Boolean is like a light switch within\
    \ the program; it is either on or off.\n\n![](images/main-22.jpg)\n\nBoolean variables\
    \ can be thought of as either \"True\" or \"False.\" No other piece of information\
    \ is placed within them.\n\n#### Char\nAnother variable type that can be used\
    \ is called a `char`, which only accepts a single letter at a time, otherwise\
    \ known as a character. Characters are defined by either `char` or `wchar_t` when\
    \ being initialized (when the variable is first mentioned within the program and\
    \ is used to place any known data within said variable). `char` is used for standard\
    \ characters, which only require one byte of memory. `wchar_t` is used for more\
    \ complex characters that require two bytes of memory. An example of these more\
    \ complex characters are Unicode characters, things such as `#`, `$`, and `&`,\
    \ and any other character that does not belong to the standard “A through Z” alphabet.\
    \ A `char` variable would be useful in a program that acted as a multiple-choice\
    \ question. With a variable of type `char` named `User_answer`, the user would\
    \ simply input “A,” “B,” “C,” or “D.” The program could then compare it to another\
    \ char variable, called `correct_answer` and then tell the user whether they were\
    \ correct or not.\n\n#### Integral Types \nThe next set of variables that are\
    \ useful within C++ are those falling under the integral types category, which\
    \ includes `short`, `int`, and `long` variables. Integral variables are used to\
    \ house whole numbers of various lengths and are dependent on the amount of memory\
    \ required. From smallest to largest amount of memory, `short`, `int`, and `long`\
    \ variable usage is determined by the functions of the machine the program is\
    \ being implemented on. If the computer has a smaller bit operating system, and\
    \ thus contains less memory capacity, it would be beneficial to use numbers that\
    \ are defined as `shorts`. Operating systems of today, however, are designed to\
    \ easily accommodate `int` and `long` variables.\n\n#### Floating Point Types\n\
    Much like integral types, floating point types also deal with numerical values.\
    \ There’s only one difference between integral and floating point types: floating\
    \ point types are more specifically used for decimal numbers. Floating point types\
    \ include variables defined as `float`, `double`, and `long double`. Which one\
    \ should be used is determined by the amount of accuracy a programmer requires\
    \ out of their program. The longer the decimal used, the more accurate calculation.\
    \ However, longer decimals also require more memory space, which is why there\
    \ is not a single type of float point variable. `float` is used for a normal amount\
    \ of accuracy, whereas `long double` is used when accuracy is extremely important,\
    \ leaving `double` to fall somewhere in the middle of these two.\n\n#### String\n\
    Lastly, the final variable type worth discussing here is the string variable,\
    \ which may bring images of yarn and twine to mind. Although the name implies\
    \ something that can be tied, this variable is used to house words or sentences.\
    \ By putting the type `string` in front of an identifier, it can then be used\
    \ to hold extended amounts of words or phrases. This is useful in communicating\
    \ with a program’s user for a variety of reasons. If they enter information incorrectly,\
    \ the string variable could be used to inform them of their error. For example,\
    \ if the program wants a birthday in numerical “dd/mm/yyyy” format, and they enter\
    \ “May 25, 2002,” a string named `birthday_error` could be displayed on the screen,\
    \ reading, “That birthday you have entered is incorrect. Please enter the birthday\
    \ in dd/mm/yyyy format.” Having discussed the different types of variables, the\
    \ next important piece of C++ programming lies in its use of constants.\n\n###\
    \ Constants\n\nSimilar to the basic premise behind variables, constants share\
    \ many of the same traits and defining features as their variable counterparts.\
    \ However, the difference is that constants are designed to contain the same value\
    \ throughout the entire execution of the program. This value can be used within\
    \ methods and calculations; however, the information that the constant holds does\
    \ not change at any point. Constants are broken down into the same categories\
    \ as variables, so we’ll take a less-detailed look at them. However, below is\
    \ a list of each data type and how a constant would be useful in an implementation\
    \ that uses that type:\n\n- Boolean constants: Boolean constants are used if there\
    \ is not any case where something would change from true to false or vice versa.\
    \ This type of constant would be useful in a program that explores fire, since\
    \ a Boolean constant named `fire_burns` would always be set to true.\n- Numerical\
    \ constants: Numerical constants are utilized when a number does not change. For\
    \ example, the freezing point of water is always 0 degrees Celsius, so a numerical\
    \ constant named `freezing_point` would prove useful.\n"
  raw: 'Inheritance is when a new class takes on the various traits and information
    of another class that it is based on. The original class or classes is known as
    the superclass or parent class. The newly produced class that receives the traits
    of the parent is called the child class. Inheritance allows for code to be reused, thus
    allowing the program to avoid repetitive code that is unnecessary to the function
    of the program. Inheritance can be either single or multiple in nature. Put simply,
    a child class can either have a single parent class, or more than one, which is
    called multiple inheritance. This hierarchy within a program is comparable to
    what a family tree would look like, which is why it is called inheritance.


    The last item that object-oriented programming brought to C++ is the ability to
    use polymorphism within its code. Polymorphism allows a single function to be
    used in a variety of ways, based on the type of data that is being put into the
    calculation. Let’s look at a simple adding function, for example. If a method, or
    calculation, is supposed to add two things together, it will need to act differently
    for numbers than it does for letters. Polymorphism techniques would allow the
    programmer to have one method of “Add” that handles words, while another adds
    numbers. When the program is asked to put two things together, it will then determine
    what data type is being added and then execute the function that accommodates
    the given types. Now that we’ve seen the pieces of object-oriented design, we’ll
    turn to the various aspects that go into C++ itself.


    #### Driving the C++ Machine: What Makes Up Its Parts


    From variables to constants, numbers to letters, C++ can accommodate nearly any
    problem that it is given, so long as it is given the data in the correct fashion.


    Variables


    At a very basic level, the first thing a program will handle is the input of some
    sort of variable and its associated data. Similar to variables discussed in math classes,
    a variable in computer science is used in place of something else. The programmer
    will name their variable with some sort of identifier, and then it may be used
    to house data that is either known or unknown to the user. Within C++, there are
    four different variable types available for use.


    The first variable type is called a Boolean, which is defined by placing “bool”
    before the identifier, or name of the variable. A Boolean can only house two options: true
    or false. This is how Booleans are used for flags within programs, or to determine
    when something should be done or not. For example, imagine a program has a Boolean
    variable named “Stomach_Full” that is set to false. “Stomach_Full” is then sent
    through the method “Feed_Stomach” within which another variable called, “Food_Amount”
    is increased by one. The only way to prevent the “Stomach_Full” variable from
    being sent into the “Feed_Stomach” method is for the person eating to be full,
    which would then set “Stomach_Full” from false to true. In other words, a Boolean
    is like a light switch within the program; it is either on or off.


    ![](images/main-22.jpg)


    Boolean variables can be thought of as either "True" or "False . " No other piece
    of information is placed within them .


    Another variable type that can be used is called a char, which only accepts a
    single letter at a time, otherwise known as a character. Characters are defined by
    either “char” or “wchar_t” when being initialized (when the variable is first
    mentioned within the program and is used to place any known data within said variable).
    “Char” is used for standard characters, which only require one byte of memory.
    “Wchar_t” is used for more complex characters that require two bytes of memory.
    An example of these more complex characters are Unicode characters, things such
    as #, $, and &, and any other character that does not belong to the standard “A
    through Z” alphabet. A char variable would be useful in a program that acted as
    a multiple-choice question. With a variable of type “char” named “User_answer,”
    the user would simply input “A,” “B,” “C,” or “D.” The program could then compare
    it to another char variable, called “correct_answer” and then tell the user whether
    they were correct or not.


    The next set of variables that are useful within C++ are those falling under the
    integral types category, which includes short, int, and long variables. Integral variables
    are used to house whole numbers of various lengths and are dependent on the amount
    of memory required. From smallest to largest amount of memory, short, int, and
    long variable usage is determined by the functions of the machine the program
    is being implemented on. If the computer has a smaller bit operating system, and
    thus contains less memory capacity, it would be beneficial to use numbers that are
    defined as shorts. Operating systems of today, however, are designed to easily
    accommodate int and long variables.


    Much like integral types, floating point types also deal with numerical values.
    There’s only one difference between integral and floating point types: floating point
    types are more specifically used for decimal numbers. Floating point types include
    variables defined as float, double, and long double. Which one should be used
    is determined by the amount of accuracy a programmer requires out of their program. The
    longer the decimal used, the more accurate the calculation. However, longer decimals
    also require more memory space, which is why there is not a single type of float
    point variable. Float is used for a normal amount of accuracy, whereas long double
    is used when accuracy is extremely important, leaving double to fall somewhere
    in the middle of these two.


    Lastly, the final variable type worth discussing here is the string variable,
    which may bring images of yarn and twine to mind. Although the name implies something
    that can be tied, this variable is used to house words or sentences. By putting
    the type “string” in front of an identifier, it can then be used to hold extended
    amounts of words or phrases. This is useful in communicating with a program’s
    user for a variety of reasons. If they enter information incorrectly, the string
    variable could be used to inform them of their error. For example, if the program
    wants a birthday in numerical “dd/mm/yyyy” format, and they enter “May 25, 2002,”
    a string named “birthday_error” could be displayed on the screen, reading, “That
    birthday you have entered is incorrect. Please enter the birthday in dd/mm/yyyy
    format.” Having discussed the different types of variables, the next important
    piece of C++ programming lies in its use of constants.


    Constants


    Similar to the basic premise behind variables, constants share many of the same
    traits and defining features as their variable counterparts. However, the difference
    is that constants are designed to contain the same value throughout the entire
    execution of the program. This value can be used within methods and calculations; however,
    the information that the constant holds does not change at any point. Constants
    are broken down into the same categories as variables, so we’ll take a less-detailed
    look at them. However, below is a list of each data type and how a constant would
    be useful in an implementation that uses that type:


    • Boolean constants: Boolean constants are used if there is not any case where something
    would change from true to false or vice versa. This type of constant would be
    useful in a program that explores fire, since a Boolean constant named “fire_burns”
    would always be set to true.


    • Numerical constants: Numerical constants are utilized when a number does not
    change. For example, the freezing point of water is always 0 degrees Celsius,
    so a numerical constant named “freezing_point” would prove useful.'
