    虽然它添加的所有其他功能都是极好的补充，但可能影响最大的一个可能是对 Nintendo Switch 的兼容性。`Unreal Engine 4.15` 允许其用户开发并发布可以在
    2017 年首发的 Nintendo 主机上运行的游戏。这一功能最初被被认为具有“实验性”性质，但将随着随后的更新切换到“发布状态”。与 `Unreal Engine`
    配合使用，Nintendo Switch 也依赖于 `C++`。


    # Nintendo Switch


    Nintendo Switch 于 2017 年 3 月 3 日登陆全球市场，是视频游戏行业中一次备受期待的发布。在 `Wii U` 失败后，任天堂开发了这款新款游戏主机，作为便携式和家用主机机之间的混合体。Switch
    配备了用于家庭使用的底座和用于便携游玩的 Joy Con 摇杆，带来了一种全新的游戏方式。对于 `C++` 社区来说，这也是一个重要事件，因为之前通过任天堂发布的大多数游戏都是部分或完全使用
    `C++` 编写的。


    ![](img/main-49.jpg)


    `Wii U` 只是使用 `C++` 代码的许多技术之一。Nintendo Switch（同样用 `C++` 编写）是在 `Wii U` 商业失败后开发的。


    目前，大多数用户认为 Switch 具有巨大的潜力，因为任天堂与 `Epic Games` 合作，允许独立开发者制作游戏。然而，截至本文编写，Switch
    只有 185 款游戏可用，其中包括备受期待的《塞尔达：荒野之》。相比之下，`Xbox One` 拥有近 1100 款作品，而 `Playstation 4`
    有 1594 游戏游戏供用户选择。虽然游戏数量随着时间的推移而增加，但这台主机的成功可能完全取决于有多少游戏开发者决定创建兼容新系统的作品。


    ## 整合一切


    Bjarne Stroustrup 的这种语言自 1998 年首次标准化以来，已经取得了长足的发展。很难相信，这样一种重要的编程语言起源如此卑微，它是 `Simula`
    语言的后代，并源于 Stroustrup 为他的论文项目开发编程功能的动机。这种通用编程语言试图满足编译者的需求，使其成为编程社区中一个灵活且实用的工具。通过对
    `C` 的向后兼容性以及对之后开发的语言的影响，`C++` 对今天的技术产生了深远的影响。虽然它可能不是一种容易学习的语言，但它高大的地位使其成为一个值得掌握的有益工具。从学校等正式场合到在线视频研讨会等更休闲的场合提供的学习机会使得几乎任何人都可以学习
    `C++`。无论人们是否接受了它陡峭的学习曲线，他们都曾以某种形式体验过 `C++`。


    从视频游戏到各种软件应用程序，`C++` 仍然蓬勃发展，并从容应对世界的快速变化。因此，有很多工作机会，从软件开发人员到编程强度较低的职位，如技术写作。除了标准的办公室工作外，`C++`
    还为那些追求自由职业的人提供了自由。由于开发代码只需要一台电脑，`C++` 工作通常可以在任何地方完成。这与替代性职业选择的相结合，使得 `C++` 成为追求自由职业的人的绝佳选择。


    工作选择之外，`C++` 在未来具有巨大的潜力。当其他语言因为在技术领域过时而消失时，`C++` 继续适应其受众的广泛需求。计划在未来几年发布的未来实现就是直接证明。除了这些更新的标准外，`C++`
    及其不断增长的资源库也有助于其对程序员的持久实用性。只要 Stroustrup 和 `C++` 社区继续根据他们的需求调整这种语言，它一定会在未来多年继续存在。


    ![](img/image_006_.jpg)


    - **抽象 (abstraction)**：程序员或程序过滤掉细节，仅显示程序运行所需完全需要的内容的过程。

    - **向后兼容性 (backwards compatibility)**：在新语言或技术中使用先前的编程语言或技术的能力。

    - **类 (classes)**：程序中使用的方法和变量的基本大纲。类充当对象的模板。

    - **编译时间 (compile time)**：编译器将程序翻译成机器可读代码并检查潜在错误所需的时间。

    - **构造函数 (constructor)**：类中实际构建对象实例的部分。这部分代码定义了新创建的对象中将提供哪些变量。

    - **数据结构 (data structures)**：允许组织和存储程序信息的结构。这些结构可以由树、列表和数组组成。

    - **调试器 (debuggers)**：可以帮助程序员寻找代码中错误和复杂问题的程序。

    - **开发公司 (developing firm)**：开发、发布和发行特定视频游戏的正式组织化公司。

    - **指令 (directive)**：在程序预处理期间读取的代行。指令通过告知编译器程序内可能使用的各种库文件，告诉编译器如何为即将进入的程序做准备工作。

    - **嵌入式系统 (embedded systems)**：具有定义用途的计算机系统，例如专门为金融银行业或航空公司预订开发的计算机。

    - **扩展 (extensions)**：为程序或编程语言的实现提供的插件。

    - **函数 (functions)**：程序中执行特定任务的语句集合。

    - **垃圾回收 (garbage collection)**：一种内存管理形式，可自动删除不再使用的内存。`C++` 不自动提供这种功能，但可以通过编程来实现这种内存清理。

    - **按需包含 (Include What You Use, IWYU)**：认为程序应该包含其代码中所使用的内容，以避免不必要的代码。

    - **独立开发者 (indie developers)**：在没有大公司帮助的情况下独立发布视频游戏的开发者。

    - **集成开发环境 (IDE)**：提供各种工具以简化编程的软件应用程序，例如内联代码建议和简化的调试过程视图。

    - **接口 (interface)**：允许用户与计算机通信的应用程序，或程序运行时用户看到。

    - **解释型语言 (interpreted language)**：不需要编译（或将其源代码翻译成机器可读代码）的编程语言，如 `Python`。

    - **内核 (kernel)**：计算机中核心计算能力部分，被称为操作系统。

    - **方法 (method)**：类中旨在为程序完成任务的编程部分。

    - **对象 (object)**：类的特定实例，包含该迭代版本的特定信息。

    - **面向对象编程 (OOP)**：一种在其代码中实现对象的编程类型。

    - **包 (package)**：组织在一起的 Java 类集合，通常位于 `.JAR` 文件中。

    - **Risch 算法 (Risch''s algorithm)**：计算机科学中使用的一种复杂算法。

    - **脚本 (scripting)**：在互联网上生成网页的过程。

    - **标准化 (standardization)**：将编程语言的各种规则发展为事实标准，并由组织就语言的细节制定明确指南的过程。

    - **子公司 (subsidiaries)**：描述被另一家公司控股公司的术语，例如朗讯电信与诺基亚之间的关系。


