    # syntax The rules determining how keywords, phrases, and symbols work together
    within a program, similar to how `grammar` controls the English language .


    `video game engine` A software package used to design and develop video games
    .


    `zero-level abstraction` The lowest form of abstraction in a program, meaning
    the code has little to no details provided . (See "abstraction .")


