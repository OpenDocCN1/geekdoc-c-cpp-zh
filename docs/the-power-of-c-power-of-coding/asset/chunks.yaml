    ## Everyday Applications


    It may not be obvious, but C++` is a critical part of a variety of different platforms.
    Any time a user opens `Photoshop`, they have experienced the direct result of
    `C++` scripting. When someone Googles cat pictures, they have, too: `C++` is incorporated
    into Google’s search engine code. Almost 99 percent of executable games utilize
    `C++`, so it even enables gaming. `C++` can be found in anything from medical
    software to operating systems and is continually used in new applications. Yet,
    while it is an extremely useful programming language, it does have its strengths
    and weaknesses.


    ## Self-Driving Cars


    o o o


    Exciting technological advances are made every day, and any number of these inventions
    and discoveries could change the way the world functions forever. Self-driving
    vehicles are one such invention that has tight ties with the programming community.
    And a new conglomerate known as `Waymo` is continually working toward making these
    cars a reality.


    Beginning in 2009, `Google` began its self-driving car project. The initial goal
    was to equip a collection of `Toyota Prius` vehicles so that they were able to
    drive autonomously over a distance of 100 miles (160.9 kilometers). Three years
    later, they had accomplished that and more. `Google` began adding `Lexus` vehicles
    to their fleet and even allowed `Google` employees to test the technology on the
    road. While these cars were initially driven on freeways, `Google` moved to city
    streets later in 2012. The new, busy terrain introduced a whole new level of complexity.
    Having conquered these additional complications, `Google` released a new prototype
    vehicle in 2014 and put it to work on public roads in 2015. Since then, over two
    million miles have been traversed by self-driving vehicles. These self-driving
    cars utilize `C++` to make it all happen.


    Initially scripted with `C++`, these vehicles are now able to navigate four-way
    stops, predict what human drivers will do, and respond to emergency vehicles.
    The technology `Waymo` has developed is so advanced that the company even completed
    their first successful fully self-driven car ride in October of 2015, complete
    with passenger named `Steven Mahan`. Not only did the vehicle lack any sort of
    functional steering equipment or pedals, but `Steven` rode solo without assistance
    from a test driver. But that''s not the exceptional part; the fact that `Steven`
    is legally blind is. The potential for self-driving vehicles offers enormous benefit
    to people like `Steven`, the elderly, and to everyone else. It is technology like
    this that could give people more freedom while providing a greater amount of safety
    on the road.


    In addition to giving people the ability to go places without driving themselves,
    this developing technology will also provide a brand-new array of jobs. The number
    of people that is needed to develop, test, and fabricate these kinds of vehicles
    is astounding. Self-driving cars will strengthen the need for software engineers
    of all varieties, from those focusing on embedded systems to individuals who specialize
    in hardware. Along with jobs, `Waymo` hopes to make roads safer.


    With nearly 94 percent of crashes being caused by human error in the United States,
    there is plenty of room for improvement. By taking the human part out of the driving
    equation, there is less likelihood of fatal accidents. Self-driving vehicles could
    replace drivers who speed, drink, text, or fall asleep at the wheel. At its core,
    `Waymo` would not be able to make this happen without the use of `C++`. It is
    applications like this that prove just how useful `C++` remains and how it will
    usher in new technologies in the years to come.


    ![](images/main-28.jpg)


    Opposite: Just like athletes have strengths and weaknesses, `C++` is better at
    some things than others.


    ![](images/image_002_.jpg)


    ## Strengths and Weaknesses


    As is the case with many technologies, there is always something better suited
    to tackle the task at hand. `Photoshop` is better suited to edit pictures than
    `Microsoft Paint`. `Microsoft Word` would be a better choice for writing an essay
    than `Adobe Illustrator` would be. With this idea in mind, there are also certain
    languages that are more effective at handling particular tasks. `C++` may be a
    highly adaptable language, but even so, it has its own set of strengths and weaknesses.


    ### Strengths of C++


    As a general-purpose programming language, `C++` has an extensive amount of beneficial
    features and a wide set of uses. The overall performance that `C++` allows for
    might be its most important quality. Because `C++` incorporates `C` into its machine
    code, this allows the program as a whole to run in closer proximity to the machine.
    This means it requires less time for instructions to be executed; the instructions
    have less distance to travel to the main parts of the machine. In addition, `C++`
    also allows programmers to switch to assembly language or `C` at any point. This
    benefit is thanks to the language’s backwards compatibility with `C`. The same
    goes for the relationship between `C` and `C++`. `C` is older, but it still proves
    useful to the functioning of the newer language, `C++`. In regards to performance,
    the last thing that `C++` excels at is its ability to efficiently partner with
    other technology. This can be seen in how it pairs and communicates with various
    operating systems and hardware, as well as how it works with other languages to
    accomplish the task at hand. By allowing these various technologies to communicate
    with `C++`, the overall efficiency and simplicity of a program’s performance is
    greatly improved.


    On the opposite side of `C++`’s low-level features, it also offers the same high-level
    features that other strictly object-oriented languages offer. The difference between
    low level features and high-level features lies in the way the elements of the
    code function. If something is low-level in programming, it simply means that
    it functions much like the machine language used by the computer’s processor does
    and requires little to no abstraction. To the human eye, low-level features appear
    clunky and nonsensical when written in code. High-level language features function
    more closely to how humans understand things, and do not rely on a specific type
    of machine in order to function, but can be implemented on a variety of computers.
    These can typically be read by programmers in a way that informs the programmer
    what that particular section of code is going to accomplish. Aside from inheritance
    and polymorphism (which define object-oriented programming), `C++` contains additional
    characteristics that stem from this programming type.


    ![](images/main-33.jpg)


    The Wii gaming platform is one place where `C++` excels.

