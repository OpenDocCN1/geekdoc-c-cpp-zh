- fmt: '

    Of course, a big part of the staying power of `C++` is that Stroustrup developed
    it with both experts and novices in mind. He did not set out to design code to
    solve a particular problem. Rather, he designed `C++` so that the programmer could
    make it into what he or she needed. This means even novice programmers can find
    uses for `C++`. With implementations spanning many industries, it looks like `C++`
    has what it takes to last.


    ## Bjarne Stroustrup


    o o o


    ![](images/main-15.jpg)


    Bjarne Stroustrup (left) still works tirelessly to ensure `C++` meets users''
    needs.


    Born in Denmark on December 30, 1950, Bjarne Stroustrup is best known for creating
    the popular programming language `C++`. He attended Aarhus University until 1975,
    when he earned his master''s degree in computer science. After graduation, his
    desire to learn more about distributed systems led him to pursue a PhD at the
    Computing Laboratory of Cambridge University in England, which he completed in
    1979. It was during this period that he met and married his wife, Marian, and
    they welcomed a baby named Annemarie. After his studies at Cambridge came to an
    end, the entire family immigrated to New Jersey. Once there, he joined the Computer
    Science Research Center of Bell Telephone Laboratories.


    During his time at Bell Laboratories, Stroustrup focused heavily on the development
    of `C++` and made his idea a reality. He and his wife also welcomed a son named
    Nicholas while living in Meyersville, New Jersey. Following the various breakups
    of Bell Laboratories, Stroustrup served as the department head for the Large-Scale
    Programming Research department until late 2002, when he joined the Computer Science
    department at Texas A&M University. During his time at the university, he served
    as the College of Engineering Chair in Computer Science. He served as a professor
    at the university until January 2014; he then moved to New York City to become
    the managing director in the technology division of Morgan Stanley. Stroustrup
    noted that academia can often distract from solving industrial problems, which
    was what `C++` was made for in the first place. The relocation also allowed him
    to be closer to his daughter and son, who were by then working as a medical doctor
    and a professor in systems biology, respectively. Living in New York City also
    had the benefit of bringing him near to his grandchildren.


    In addition to the various professional positions he has held over the years,
    Stroustrup has kept busy with many side projects and extracurriculars. He has
    written several books, including *The Design and Evolution of C++*, *The C++ Programming
    Language*, and *A Tour of C++*. Along with his writing projects, he remains an
    active participant in the standardization of the upcoming versions of `C++`.


    Strostrup has received high honors within the computer science industry, including
    the Grace Murray Hopper award in 1993 and the Sigma Xi''s William Procter Prize
    for Scientific Achievement in 2005. More recently, in October 2011, he was appointed
    to the board of directors for a cloud computing startup called RollApp. Still
    not busy enough for his liking, Stroustrup also secured a visiting professor position
    at Columbia University. He continues to publish research and present them to the
    community. Nowadays, he focuses on performance and reliability.


    ![](images/main-17.jpg)

    Opposite: Just like a car, learning to code is easier when you know the parts.


    ![](images/main-18.jpg)


    ## How It Works


    Learning to code is much like the vehicle. New coders must first learn the basics.
    Is it manual or automatic? Similarly, `C++` needs to be used effectively. This
    chapter looks at common applications, as well as problems `C++` can be used to
    solve.


    ## Object-Oriented Programming


    `C++` is a general-purpose language, which means it takes on various types. The
    most prevalent type, that `C++` incorporates is object-oriented programming, or
    `OOP` for short.


    ![](images/image_001.jpg)

    While object-oriented design offers a multitude of advantages, there are a few
    in particular that make it better. The first is data abstraction. Data abstraction
    is what allows the programmer to create classes (Think back to the cake analogy
    made in chapter 1). In turn, programmers are able to think differently. Data abstraction
    is a more natural way to think when coding. It goes hand-in-hand with the next
    benefit of object-oriented programming: data encapsulation.


    Data encapsulation is what allows the programmer to control what the user sees.
    Controlled access keeps various aspects of an object’s data secure. In this way,
    data encapsulation prevents important data’s integrity from being compromised.
    To fully grasp this concept, imagine the process of building a house for a new
    homeowner. The homeowner will communicate with the contractor about what they
    want house to look like. Then the contractor will talk to their workers about
    how to accomplish the task. The contractor is aware of the requirements, but that
    does not mean that the homeowner and workers need to know everything. The workers
    do not need to be bothered with what color the front door is supposed to be, because
    they will not be the ones purchasing the materials. Similarly, the homeowner does
    not need to be informed about how many foremen are assigned to their house, only
    that they are meeting the deadlines set in place. Data encapsulation functions
    the same way; it keeps things on a need-to-know basis.


    This need-to-know basis can be divided into three different levels of protection,
    based on how each class within a program is defined. The lowest level of protection
    comes with a public class, meaning that the data housed within the object class
    can be accessed by any other part of the program. The highest level of security
    can be found in a private object class. Only methods or calculations executed
    within that class can access the information. Sandwiched between the two is the
    protected object class. In a protected object class, information within the object
    cannot be accessed by every part of the program. However, this information can
    be used by other classes that inherit the traits of that class. This leads us
    into another valuable piece of object-oriented design, which is inheritance.

