  trans: "\n在探讨了 C++ 作为一种语言的优缺点之后，人们可能会好奇它与其他可用编程语言相比如何。与 Python 相比，很容易看出在某些情况下使用一种语言会比另一种更有利。这两者之间的第一个显著区别在于它们各自所属的语言类型。Python\
    \ 被定义为解释型语言，这意味着它不需要编译即可运行。通过摆脱将自身代码翻译成机器读代码的需求，Python 降低了整体复杂度。它对运行它的机器的要求也更低。Python\
    \ 的简单性也体现在语言的语法（或文本设置）中。与 C++ 相比，Python 的格式在本质上非常简单。程序员首先在 Python 缺乏 `main` 方法中就能看到这一点。C++\
    \ 需要这个中心框架来从其内部构建并运行代码，而 Python 则选择接受任何方法作为主方法。因此，程序可以从代码的任何地方开始。此外，Python 的单行代码要简单得多。Python\
    \ 不需要分号或大括号来分别定义一行代码或一个方法的结束。通过移除多余的文本，代码看起来更加悦目且更易于理解。Python 只有三种不同的数值变量类型（`spam`、`longspam`\
    \ 和 `float`），而 C++ 有六种。由于 Python 需要记住的规则比 C++ 少，因此在编写类似的程序时，Python 需要的开发时间更短。一个\
    \ C++ 程序可能需要一年时间才能完全开发，而类似的 Python 程序仅需要两个月。既然 Python 看起来是更好的选择，为什么还要用 C++ 呢？\n\
    \n问题的答案在于每种编程语言的功能。虽然 Python 简单得多且更容易理解，但它的能力受限于这种简单性。在复杂的程序中，维护使用变量的完整性非常重要。由于\
    \ Python 使用隐式类型，这种完整性遭到了破坏。隐式类型是指程序没有明确说明每个标识符关联的是什么类型的变量，而仅仅是假设。例如，对于一个名为 `Money`\
    \ 值为 `1,879,030,222` 的数值，Python 会简单地假设这是一个 `long` 变量。Python 这种这种直觉的跳跃通常很方便。但有时，Python\
    \ 的假设会导致问题。对于同一个初始设置为某些数值的同名 `Money` 变量，程序的另一个地方可能会将 `Money` 设置为 `\"a\"`，然后将其视为\
    \ `char` 变量。这可能会干扰计算并产生安全漏洞。\n\n另一方面，C++ 使用显式类型。因此，每个变量类型在初始化时都必须定义。`int` 变量将保持为\
    \ `int` 变量；`string` 将保持为 `string`。这些显式类型变量包含的信息可能不同，但它们永远不会改变类型。这增加了语言的复杂度，但显式类型在日常应用中更有利。\n\
    \n两种语言之间的最后一个区别在于它们所针对的人群。由于 Python 很容易理解，它是初级程序员尝试的绝佳语言。它向个人介绍编码，而没有额外的复杂性和规则。对于想要学习\
    \ Python 的人来说，也有很多资源，因为它以成为优秀的第一门编程语言为荣。一旦个人掌握了 Python，过渡到更复杂的语言（如 C++）就会容易得多。正如你看到的，这两种语言非常不同，但它们在编程中都起着重要作用。\n\
    \n## C++ vs. Java\n\n虽然 C++ 和 Python 之间的差异从一开始而易见，但即使是同样源于对象设计的语言（如 C++ 和 Java），也可能存在重要的区别。在设置代码文件时，语言之间的第一个区别变得清晰。Java\
    \ 要求文件名与单个类名之间有严格的关系。这意味着如果一个类被引用为 `MedianFinder`，那么它所在的文件名必须具有相同的名称，甚至大小写也必须一致。C++\
    \ 不强制执行此类标准，在该语言中，使用类似的约定进行命名甚至可以被认为是不良做法。此外，由于 Java 的命名要求，Java 程序的每个部分都必须是类的一部分。如果没有类，就没有东西可以命名它所在的文件。为了方便这种组织系统，Java\
    \ 还在其程序结构中实现了包（packages）。包的作用是为单个程序的多个类提供存放地。它们类似于计算机上找到文件夹；它们仅仅作为一个存储地。相反，C++\
    \ 拥有一种非常松散的组织结构，可以根据程序员的意愿变得非常严格或杂乱。\n\n这两者的另一个关键区别是存在自动垃圾回收系统。正如在缺点部分讨论的，C++\
    \ 目前还没有配备这样的系统。而 Java 拥有这种系统。这意味着程序中不再使用的任何对象都可以被销毁，从而释放内存空间并重新分配给能够更好地利用它的东西。通过这种方式，Java\
    \ 可以被认为更有效率。然而，C++ 也能做出必要的调整来实现这一点。\n\n## 它们如何比较？\n\n在讨论了这么多关于简单与复杂代码的内容后，查看这两种语言实际上是如何相互竞争的是有帮助的。在下面的示例中，两种语言都完成着相同的事情，即评估一个简单的\
    \ xy 计算。\n\nC++ 代码：\n```cpp\nint pow(int x, int y)\n{ \n    int result = 1; \n\
    \    for (int i = 0; i < y; i++) {\n        result *= x;\n    }\n    return result;\n\
    }\n```\n\nPython 代码：\n```python\ndef pow(x, y): return x**y\n```\n\nPython 代码看起来更容易理解。C++\
    \ 代码则必须详细概述计算幂函数的原理，即通过所谓的“for 循环”将基数乘以自身。for 循环是一种在满足特定参数之前重复的简单代码结构。在这种情况下，`i`\
    \ 不再小于 `y`，正如 for 循环定义中的 `i < y` 检查所示。相反，Python 代码能够在没有额外努力的情况下完成。\n\n最后，两种语言都拥有广泛的库来支持用户。虽然一种语言无法在另一种语言内部使用，但\
    \ Java 和 C++ 库系统的功能有很多重叠。因此，使用每种语言的程序员都对 Java 和 C++ 提出了相同的要求。\n\n### 构建块：回顾 C\n\
    \n技术不断在自身基础上构建并不是秘密。火导致了蜡烛；蜡烛导致了灯笼；灯笼导致了电力。以类似的方式，打字机导致了计算机，计算机导致了编程语言（如 C），而\
    \ C 导致了改进后的语言。其中一种改进语言就是 C++。事实上，C++ 的许多方面是从 C 演变而来的。\n\n"
- fmt: '

    It should come as no surprise that because of the ancestral connection between
    the two, C++ is the only language that is backwards compatible with C. This compatibility
    helped as experienced C programmers transitioned over to the new and improved
    C++ coding language. In its prime, C was one of the more prevalent language options
    due to its easy-to-use Application Programming Interfaces (APIs), as well as its
    extensive compiler support. Due to its compiler support, C could be implemented
    on nearly any machine. While C++ continued this trend of portability, there are
    also a few key qualities that Stroustrup built upon to make C++ better than its
    predecessor.


    ### How Java and C++ Work Together


    Even though they are similar, both Java and C++ have their own individual uses
    in the tech world. One of those uses is the programming of various cellular devices.
    Android users can thank Java for their phone''s capabilities. As for iOS users,
    they can thank C++. However, these programming requirements create some issues.
    A lot of companies develop applications for each mobile operating system! It requires
    a lot of money and time to constantly develop apps and their updated versions
    in two different programming languages. Consistency is extremely important for
    user experience, and there should not be any discrepancies between what is seen
    on the Android version versus what is seen on the iOS version of the same app.
    There is a solution: SWIG.


    SWIG stands for the Simplified Wrapper and Interface Generator. It''s what allows
    C++ to be used on a predominantly Java-run system found on any Android device.
    At the most basic level, all core code will be in C++. SWIG is then used to "wrap"
    the Java code around this input file and make it readable to the Android operating
    system. The process is started by running the `SWIG` command, which will separate
    any C++ classes into individual pieces, and generate a filename to match (recall
    the Java package system discussed earlier). These wrappers are then used to translate
    the C++ parts into things that Java will understand. Ironically enough, there
    is little functionality to the Java pieces of code. They merely serve as a means
    of translation from C++ into something Android can understand. With the help of
    the Java Native Interface, or `JNI`, Java code can be used by other languages
    and access their respective libraries.


    ![](images/main-36.jpg)


    At their most basic level, Android devices run on C++.


    Aside from Java, SWIG can be used to connect C++ to other languages including
    Javascript, PERL, PHP, Python, and Ruby. Originally written in 1995, this interface
    compiler has seen many updates and multiple editions, with the most recent one
    being released in 2017. In addition to serving as an interpreter between C++ and
    other languages, it is also useful in prototyping and debugging, systems integration,
    and constructing extension modules. While it is an incredibly useful tool to the
    C and C++ community, one of its weaknesses lies in the fact that it only caters
    to that specific programming language and cannot be used to translate other languages.


    At the most basic level, C++ has more features than C. C++ allows users to define
    strings in three different ways, whereas C only allowed for one. C++ also allows
    variables to be declared anywhere within the program, another huge improvement
    that led to a more logical flow in calculations. Another important addition to
    C++ was the ability to overload functions. This meant that there could be multiple
    methods with the same name that would function in a certain way based on what
    type of input it was receiving. C++ also allowed for dynamic memory, with the
    simple addition of the keywords `new` and `delete`. While it still did not have
    automatic garbage collection, like Java, these words could be used in much the
    same fashion


    ![](images/main-38.jpg)


    Knowing all the parts of C++ code allows you to create a strong, protected program.


    If a new variable was to be created, it was prefaced with the word `new`. `delete`
    worked in the same way. Lastly, C++ incorporated classes and object-oriented programming,
    which allowed for a greater amount of flexibility.


    ### When Should C++ Be Used?


    Considering all that has been discussed in this chapter, the big question remains:
    So when should C++ be used? The answer depends on a few different factors. Based
    on the requirements of the program in question, the answer may change. However,
    at the most basic level, C++ should be used when performance is crucial. Its ability
    to work in close contact with the hardware it is running on allows for efficiency
    that would likely go unmatched if a programmer decided to use another language.
    In addition, the increased flexibility and control that it gives to the programmer
    makes C++ the perfect tool to be shaped into whatever is needed at the time. Another
    factor to consider is if the task at hand has a previous code base. If old versions
    of the program have already been coded using C or C++, it would not make sense
