    Because `C++` is one of the most dominant programming languages in use today,
    there are many career options available to someone looking for a professional
    position. While it is not impossible to secure an entry-level job without some
    sort of secondary education, most positions require an associate’s degree or higher
    in order to be considered. Upon successful completion of a degree, there are many
    career options to choose from.


    ## Software Developer


    One popular option for those wishing to program in their job is that of a software
    developer. Software developers are the individuals responsible for developing
    the various parts of a program. This includes developing the code and exploring
    the background functions that need to be completed in order for the program to
    execute. Software developers can be found contributing to any step of the program
    development process including writing, debugging, testing, and designing. In addition
    to creating and ensuring that the code is functional, software developers can
    also be found creating Graphical User Interfaces (`GUIs`). `GUIs` are the simplified
    menus that the average user would see, such as a start menu for a computer game.
    According to the US Bureau of Labor Statistics, jobs within software development
    are expected to grow as much as 17 percent by 2024, which would result in an additional
    186,600 positions within the field. As of 2016, a software developer in the United
    States could expect to make around $49 per hour, or $102,280 a year. Based on
    experience and specialty, some software developers even make upwards of $160,000
    a year.


    The path to such an impressive salary begins with education. A potential software
    developer should hold a bachelor’s degree in computer science, software engineering,
    or mathematics. For more desirable positions, a master’s degree would also prove
    beneficial. In addition to education, experience should be completed during schooling,
    in the form of an internship or other entry-level position within the technology
    sector. From there, a software developer should sharpen their analytical, communication,
    and interpersonal skills to be the most ideal candidate for a position.


    ![](images/main-42.jpg)


    Software development is just one of the career paths that knowledge of `C++` can
    lead to .


    While the pay and other benefits are definitely a positive to this type of position,
    there are a few downsides that potential applicants should be aware of before
    committing to this career path. One of them is the limitation of one’s location.
    There are software development jobs across the globe, but there are certain areas
    where the job market is more saturated with available positions than others. As
    of 2016, nearly 91 percent of available software developer jobs were located near
    Silicon Valley, California. This is not surprising, since Silicon Valley is home
    to `Google`, `Apple`, and `Cisco Inc.`, to name a few. Other than California,
    open jobs center around larger cities, including Seattle, New York, and Dallas.
    Aside from location, another consideration is the hours that the job requires.
    Oftentimes, software developers are expected to put in long hours, sometimes around
    eighty hours a week. Rigorous work schedules stem from the fact that some projects
    have short turnaround times and need to be completed quickly, regardless of the
    effort required from developers. While these cons may deter some, the promise
    of great compensation and a challenge from their job makes for a desirable career.


    ## Game Developer


    Another appealing option for those who are looking for a career that uses `C++`
    can be found within the gaming industry. While game developers are considered
    to be a subset of software developers, the requirements of the game development
    positions vary. More commonly referred to as applications software developers,
    the duties of a game developer are far more creative and interactive than those
    of a software developer. Game developers are expected to collaborate with writers
    in generating storylines and character biographies. In addition, they document
    the game design process and develop prototypes for their teams. At the most basic
    level, game developers create the essential features of a video game. Just like
    software developers, game developers are expected to have a bachelor’s degree
    in computer science, software engineering, or the like. However, it would also
    benefit an individual if they supplemented their major with more graphics-based
    classes, such as those incorporating `Photoshop` or 3D design software, like `Maya`.
    As of 2016, a game developer could expect to make about $100,000 a year.


    After having decided to pursue a career in game development, there are a few things
    to consider. The first one is what type of developing firm an individual would
    like to work for. The most common types within the industry are first-party, second-party,
    and third-party development firms. First-party developers are those that manufacture
    a specific video game console and then produce games that work exclusively on
    that system. An example of this would be `Nintendo`, since `Nintendo` only produces
    games for its own consoles. A second-party developer is one that typically only
    produces for one console that they are contractually tied to (but they may branch
    out). `Game Freak` and its production of the `Pokemon` series is an example of
    this, since they typically produce games for `Nintendo`-based products but are
    not prevented from completing other projects. Third-party development projects
    are owned by companies outside of those that produce consoles. The very first
    company of this nature was `Activision`, which was founded in 197\. With each
    type, there are varying degrees of creativity and control that may be increased
    or lessened based on the project.


    ![](images/main-43.jpg)


    Writing and developing gaming software can be a viable career for those who are
    fluent in `C++`.


    Though it may sound cool to work on games as a career, there are some negatives
    to game development that are worth looking at. The hours are often long and stress
    is usually high within these jobs, since there are tight deadlines to be met.
    In addition, there is a lot of potential for failure, as financial expectations
    may not be met or the gaming community may publicly bash the quality of the work
    put into a new game. However, this job would allow an individual the freedom to
    work on games every day and make them better, which not many people can say.


    ## Technical Writer


    People often believe that once an individual becomes well versed in a programming
    language, the only jobs available to them would be the ones that they code. This
    is simply not true! Perhaps someone learned a programming language out of curiosity,
    and while they appreciate and understand it, they are not interested in devoting
    their time to a career that requires long hours and intense work environments.
    In this circumstance, a career as a technical writer might be a great fit. Technical
    writers are the individuals tasked with writing how-to guides, documentation for
    software and hardware, and scholarly journal articles that work to communicate
    difficult technical information to less technically experienced readers. It is
    not necessary to have a college degree in computer science, but a degree of some
    kind (usually in writing or English) is required. In addition, an aspiring technical
    writer should have some prior experience within the technology sector. As for
    pay, technical writers can expect to make around $33.58 an hour, with median annual
    pay landing around $70,000 per year. Job growth is not expected to skyrocket like
    software developers will see, but at a projected 10 percent increase by 2024,
    this is still a great field to get into!

    '
