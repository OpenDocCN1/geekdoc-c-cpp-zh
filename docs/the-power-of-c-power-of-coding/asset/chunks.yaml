    Having gotten a handle on the basics of the language, there are a few things to
    remember throughout the learning process. It is important when completing tutorials
    not to simply copy and paste code into the IDE, but rather, understand what is
    happening and how the program works—although it may be beneficial to copy the
    code initially, to ensure that it works correctly and you understand what the
    goal of the program is. Beyond that, however, start thinking in the mindset of
    a programmer and refrain from simply copying the answer. If there is something
    you don’t understand, there are numerous options designed to help and to answer
    questions. The internet is full of discussion boards and videos answering common,
    and not-so-common, questions about `C++` code. Joining an online community will
    also provide opportunities to examine other programmers’ code and to see how others
    solve the same problems in a multitude of ways. Finally, new and experienced programmers
    alike should not simply code tutorial exercises, but rather investigate real-world
    problems that they could solve with `C++`. There are any number of problems today
    that could be solved with the help of code.


    ## Honing Your C++ Skills

    While sitting down and physically coding in the language is the primary part of
    learning a new programming language, there are also other skills that can make
    learning `C++` easier. Think of it like an athlete thinks of training. A runner
    doesn’t simply run every day to make them the best marathon competitor. Many runners
    incorporate yoga to increase dexterity and lift weights to improve muscular endurance.
    Just as an athlete has a broad training plan to improve their specific skillset,
    so should an individual learning to code.


    And luckily, you are already learning a variety of subjects in school. Formal
    education is a great starting point, and it is very easy to find classes that
    will help you make progress programming. Perhaps you’re already familiar with
    algorithms from math class. Algorithms are mathematical equations that receive
    some variety of input, and then in turn, produce an output value. They can be
    something as simple as `x2` or as complicated as the Risch’s algorithm. Just like
    a program, an algorithm is made up of a variety of parts. If you understand how
    each part of an algorithm works, you can apply the same principles to programming.
    Aside from algorithms, many other mathematical concepts can strengthen a programmer’s
    skills. Classes like discrete mathematics, economics, and statistics complement
    coding skills. Not only do these classes foster computational thinking, but they
    also incorporate data analysis and research methodology. Learning to analyze data
    and developing a strong foundation in research methods is beneficial for anyone
    who wants to pursue a career in the technology sector.


    ![](images/main-40.jpg)


    GitHub helps coders around the world collaborate on projects .


    Outside of formal schooling, there are a few notable options to expand programming
    knowledge. Open-source projects are one such resource. Open-source projects are
    projects that make the source code available to anyone who wishes to collaborate
    on a piece. The term “open source” is just what it sounds like; source code that
    can be viewed by anyone. These types of projects allow a programmer to work with
    people of all skill levels and backgrounds on problems with varying levels of
    difficulty. Anyone can find a project that they feel comfortable contributing
    to and get their name added to the credits upon completion of the program. Participation
    in open-source projects also introduces coders to real-world applications of their
    code. Finding a project to join is easy. Quite possibly the most popular website
    for open-source work is `GitHub`. `GitHub` is a database for people to upload
    their projects, outline their needs, then find developers to assist in solving
    their problems. Their program gets completed, and programmers gain more experience.
    It’s a win-win for everyone involved.


    Another option for learning `C++` is to become formally certified. The `C++ Institute`
    offers formal courses, examinations, and certifications for those interested in
    developing a more structured understanding of `C++`. Becoming certified means
    that an individual has successfully passed tests on a variety of topics related
    to the language, and they are up to industry standards. Not only does the process
    of certification allow an individual to learn and validate their skills, but it
    also makes them more desirable on the job market.


    ## Important Non-Programming Skills

    While technical skills are extremely important in learning `C++`, there are other
    professional skills to master to become the best programmer you can be. Strong
    communication skills are chief among the qualities that set the most successful
    programmers apart. In many workplaces, programmers are notorious for being poor
    communicators. Whether this is a fair characterization or not, recruiters are
    always impressed by programmers who speak and write effectively. Speaking skills
    are an important piece of programming for a few different reasons. First, programmers
    must be able to explain their code to a variety of different audiences. The way
    in which a programmer speaks to a CEO about a program would likely be completely
    different than how they would approach the same conversation with a fellow programmer.
    People within the technology sector will often be given tasks by those who do
    not understand coding, and knowing how to speak about complex functionality in
    a way that is easy to follow is a necessity. Additionally, programmers must be
    good at speaking publicly, as they may be expected to present their programs to
    those within their company and sometimes even to large, global audiences at conferences
    or product launches. Lastly, by verbalizing their process, coders can better explain
    why they made a particular choice and validate their reasoning.


    Writing is equally important. Writing can be required in any step of the development
    process from initial idea to final product. Programmers often do not work alone,
    so effective written communication can make this process easier on everyone. This
    need can be seen in various settings, including `GitHub` projects, as they often
    connect developers from all over the world to work on a single project. In addition
    to the writing needed during collaborative endeavors, formal documentation also
    plays a large role in any tech project. Upon completion of a program, a document
    outlining the various elements, goals, and functions of a program must be described
    in understandable detail. These published writings need to be done correctly and
    in a way that people can understand.


    To go along with communication, a programmer should also develop logic and time
    management skills. By thinking logically, programmers will be able to use abstract
    ideas to develop a program. Logical thinking can be sharpened through mind-based
    games, such as `chess`, `sudoku`, or `mah-jongg`. As for time management skills,
    these are important since programming projects are often given deadlines that
    must be met. While it may not take three weeks to create a program, within that
    three weeks, there must also be debugging, efficiency checks, and time allowed
    for overhead problems, such as issues with device performance. Without these skills,
    a company could face massive amounts of money lost, since the longer a program
    is in development, the greater the budget required.


    ![](images/main-41.jpg)


    Chess can help hone logic skills, no computer needed .

