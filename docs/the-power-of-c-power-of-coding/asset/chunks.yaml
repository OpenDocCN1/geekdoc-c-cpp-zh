    在掌握了语言的基础知识后，在学习过程中有几点需要记住。在完成教程时，重要的是不要简单地将代码复制并粘贴到 IDE 中，而是要理解发生了什么以及程序是如何运行的——尽管最初复制代码可能是有益的，这可以确保它运行正常并且你理解程序的目标。然而，在此之后，要开始以程序员的思维进行思考，并克制单纯复制答案的倾向。如果你有不理解的地方，有很多旨在帮助和回答问题的选项。互联网上充斥着讨论板和视频，解答着关于
    `C++` 代码的常见和不常见的问题。加入在线社区还将提供查看其他程序员代码的机会，并观察他人如何以多种方式解决相同的问题。最后，无论是新手还是经验丰富的程序员，都不应该仅仅简单地编写教程练习题，而应该研究他们可以使用
    `C++` 解决的现实世界问题。如今有许多问题可以通过代码帮助得以解决。


    ## 磨练你的 C++ 技能

    虽然坐下来用该语言实际编程是学习新编程语言的主要部分，但还有其他技能可以让你学习 `C++` 变得更容易。把它想象比运动员考虑训练的方式。跑步者并不是每天跑步就能成为最好的马拉松赛手的。许多跑步者会结合瑜伽来增加灵活性，通过举重来提高肌肉耐力。就像运动员有一个广泛的训练计划来提高他们的特定技能一样，学习编程的个人也应该如此。


    幸运的是，你已经在学校学习各种科目了。正式教育是一个极佳的起点，很容易找到能帮助你提高编程水平的课程。也许你已经熟悉数学课上的算法了。算法是接收各种输入并随后产生输出结果的数学方程。它们可以是像
    `x2` 那么简单的，也可以是复杂的 Risch 算法。就像程序一样，算法由许多部分组成。如果你理解算法的每个部分是如何工作的，你就可以将相同的原理应用于编程。除了算法之外，许多其他数学概念也可以加强程序员的技能。离散数学、经济学和统计学等课程补充了编码技能。这些课程不仅培养了计算思维，还纳纳了数据分析和研究方法论。学习分析数据并建立坚实的研究方法基础，对于任何想在技术领域追求职业的人来说都有益的。


    ![](img/main-40.jpg)


    GitHub 帮助世界各地的开发者协作项目。


    在正式教育之外，还有几个扩展编程知识的绝佳选择。开源项目就是这样的资源之一。开源项目是将源代码向任何愿意对某作品做出贡献的人开放的项目。“开源”一词正如其字面意思一样；任何人都可以查看的源代码。这类项目允许程序员与各种技能水平和背景的人合作，解决不同难度等级的问题。任何人都可以找到一个他们觉得可以胜任贡献的项目，并在程序完成后将自己的名字添加到致谢名单中。参与开源项目还让编码者熟悉其代码在现实世界中的应用。找到一个可以加入的项目很容易。`GitHub`
    可能是开源工作最流行的网站。`GitHub` 是一个数据库，人们可以在上面上传自己的项目，列出需求，然后寻找开发者协助解决他们的问题。他们的程序完成了，程序员也获得了更多经验。这对所有参与者来说都是双赢的局面。


    学习 `C++` 的另一个选择是获得正式认证。`C++ Institute` 为那些兴趣对 `C++` 建立更有结构化理解的人提供正式课程、考试和认证。获得认证意味着个人已成功通过了与该语言相关的各种主题测试，并且符合行业标准。认证过程不仅让个人学习并验证自己的技能，还让他们在职场市场上更具吸引力。


    ## 重要的非编程技能

    虽然在学习 `C++` 时技术技能至关重要，但还需要掌握其他专业技能才能成为最好的程序员。强大的沟通能力是让最成功的程序员脱颖而出的主要品质。在许多工作场所，程序员以沟通能力差而闻名。无论这种描述是否公平，招聘人员总是对口语和写作有效的程序员留下深刻印象。口语能力是编程中重要的一部分，原因有几点：首先，程序员必须能够向各种不同的听众解释他们的代码。程序员向
    CEO 解释程序的方式可能与他们与同事程序员进行同样对话的方式完全不同。技术领域的人员经常会收到那些不懂编程的人分配的任务，因此知道如何用易于理解的方式来描述复杂功能是必须的。此外，程序员必须擅长公开演讲，因为他们可能被要求向公司内部展示他们的程序，有时甚至在会议或产品发布会上向大型全球观众进行演示。最后，通过口头化他们的处理过程，编码者可以更好地解释他们为什么做出特定的选择，并验证他们的推理。


    写作同样重要。从最初的想法到最终产品，开发过程中的每一步都可能需要写作。程序员通常不是单兵作战，因此有效的书面沟通可以使这个过程对每个人都更容易。这种需求可以在各种环境中看到，包括
    `GitHub` 项目，因为它们经常连接来自世界各地的开发者完成同一个项目。除了协作过程中所需的写作外，正式文档在任何技术项目中也起着巨大的作用。程序完成后，必须用易懂的细节描述一份概述程序各种元素、目标和功能的文档。这些出版的文章需要正确完成，并以人们可以理解的方式呈现。


    除了沟通之外，程序员还应该培养逻辑和时间管理技能。通过逻辑思考，程序员将能够利用抽象想法来开发程序。逻辑思维可以通过智力游戏（如 `象棋`、`数独`或`麻将”）来强化。至于时间管理技能，它们非常重要，因为编程项目通常有必须完成的截止日期。虽然创建一个程序可能不需要三周时间，但在三周内，还必须进行调试、效率检查并考虑到处理额外问题的时间，例如设备性能问题。没有这些技能，公司可能会面临巨额资金损失，因为程序开发时间越长，所需的预算就越大。

