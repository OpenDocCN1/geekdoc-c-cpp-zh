    C with Classes 在当时是一种极具可移植性的语言，Stroustrup 的目的是让 C++ 运行在从超级计算机到最基础系统的任何设备上。因此，C++
    能够在不同容量的内存中运行。这包含了从大到微小的内存尺寸，没有留空间去假设所用机器的大小和速度。Stroustrup 在推进过程中考虑了这些和其他技术方面。定义这种语言的最后一步是决定一个编译器。Stroustrup
    确定 C++ 不需要一个超级复杂的编译器。由于他知道需要一个简单的编译器以便他的语言能够按照他期望的方式执行，Stroustrup 亲力而为，将 CFront
    编译器变成了现实。


    ### CFront 编译器


    在深入研究 Stroustrup 的 CFront 编译器的细节之前，了解编译器在基础层面上做什么是重要的。编译器在实现编程语言方面起着至关重要的作用。这是因为编译器作为生成代码的机器的翻译手段。编译过程分为三个部分，即输入和输出的简单执行。用户使用源语言（或程序员可以阅读和理解的语言）编写代码并设计源程序。在
    CFront 编译器的情况下，使用的源语言是 `C++`。源语言是根据人类概念定义的程序版本。一旦输入到编译器，编译器就会检查源代码中的错误。这些错误可以跨越以下任何一类：语法、语义（代码段的含义）和代码生成。正是因为这种错误检查能力，编译器才成为调试过程中至关重要的组件。一旦程序编译成功而没有触发任何错误，编译器就会将可读代码翻译成汇编语言（或机器本身可以理解的语言）。成功编译后，程序将得以实现并执行被要求的任务，除非出现任何运行时错误。


    随着 `C++` 初期设计阶段的完成，Stroustrup 将注意力转向了创建一个心用于让其语言发挥最大价值的编译器。CFront 编译器于 1983 年首次面世，其设计考虑了简单性。由于人们对变化持抵触情绪，Stroustrup
    使得他的编译器会将输入的 `C++` 源程序翻译成机器生成的 `C` 语言。这是一个很好的选择，因为它允许那些熟悉“旧” `C` 语言的人仍然对他们的程序的运行方式保持某种熟悉感。此外，当时的技术并不支持
    `C++` 调试器。调试器的缺乏迫使程序员在他们的 `C` 生成的机器码中寻找错误。虽然这很乏味，但并没有阻止人们使用 `C++`，因为 `C` 已经是计算机科学行业内一种被广泛理解的语言。最后，也是可能影响影响的，是
    CFront 编译器迁移到新平台的能力。因为它将 `C++` 拆分成了 `C`，所以 CFront 编译器可以放置在任何拥有 `C` 编译器的系统上。在当时，几乎每台使用的机器都能找到
    `C` 编译器。


    CFront 的独特之处在于，它是最早的前端编译器之一，这意味着 `C++` 需要不是一个编译过程，而是两个。最初，`C++` 源程序会被编译，然后翻译成基于
    `C` 的机器语言。然后，这种语言会被放置在驻留的 `C` 编译器中，由该编译器在完成后实际执行代码。通过这种方式，Stroustrup 成功地脱离了制造工具的业务，回答了他在语言开发过程中提出的第三个问题。通过将进步的责任交给他人，Stroustrup
    能够让 `C++` 形成为当时用户所需的任何形式，因为是用户自己在根据自己的需求来塑造它。


    ### 为什么使用 C？


    考虑到当时使用的其他所有语言，人们可能会问为什么 Stroustrup 决定基于 C 来他的语言，而不是其他某种语言。最简单的答案是 Stroustrup
    拥有 `C` 的知识背景，因为他在学校里花了大量时间在使用这种语言。然而，`C` 有几个关键特征使其成为一个理想的语言基础模型。第一个特征是它的可用性。当时几乎每台使用的机器都有
    `C` 编译器。如果由于某种原因没有，通常也有大量的资源可以利用，使得程序员很少需要从头开始设计一个新的编译器系统。在可用性的同时，`C` 还具有可移植性。虽然无法立即将
    `C` 程序从一台计算机转移到另一台计算机，但在技术和财务上实现这一点是可能的。导致 `C` 作为 `C++` 基础的最后两个关键要素是它的灵活性效率。Stroustrup
    想要设计一个可以被大量用户使用的程序。因此，他需要一种能够适应每个用户独特需求的语言，同时仍然满足加在他们身上的内存限制。


    ### C++ 的名字是怎么来的


    虽然它现在整个计算机科学社区被广泛称为 `C++`，但 Stroustrup 的编程语言在采用目前的名称之前经历了多次更名。当开发在 1983 年开始时，产生的语言仍然被称为
    C with Classes。很困惑，对吧？由于 Stroustrup 在贝尔实验室的一位经理的请求，该语言经历了第一次更名，随后被称为 C84。这些改变有助于打破人们将不同版本的
    C with Classes 称为“新 C”和“旧 C”的习惯，因为它们不再共享同一个名称。然而，它作为 C84 的新身份只持续了几个月，另一个名称建议就被提了出来。


