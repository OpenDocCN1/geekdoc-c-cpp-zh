    不出意外的是，由于两者之间的祖先渊源，C++ 是唯一一种与 C 向后兼容的语言。这种兼容性帮助了丰富的 C 程序员过渡到这种全新的、经过改进的 C++ 编程语言。在它的鼎盛时期，C
    是最流行的语言选项之一，因为它具有易于使用的应用程序编程接口（APIs）以及广泛的编译器支持。得益于对编译器的支持，C 可以实现在几乎任何机器上。虽然 C++
    延续了这种可移植性的趋势，但斯特劳斯特普（Stroustrup）在此基础上构建了一些关键特性，使得 C++ 比其前身更加优秀。


    ### Java 和 C++ 如何协同工作


    尽管它们有相似之处，但 Java 和 C++ 在科技领域都有各自的用途。其中一种用途就是为各种移动设备编程。Android 用户可以感谢 Java 赋予了手机的功能。而对于
    iOS 用户，他们可以感谢 C++。然而，这些编程需求产生了一些问题。许多公司会为每个移动操作系统开发应用程序！在两种不同的编程语言中不断开发应用 及其更新版本需要大量的金钱和时间。一致性对于用户体验至关重要，同一个应用程序在
    Android 版本和 iOS 版本上的显示不应有任何差异。有一个解决方案：SWIG。


    SWIG 代表简化封装器和接口生成器（Simplified Wrapper and Interface Generator）。它让 C++ 能够用于任何 Android
    设备上主要运行 Java 的系统上。在最基础层面，所有核心代码都将是 C++。然后使用 SWIG 将 Java 代码“封装”在该输入文件周围，使其被 Android
    操作系统读取。该过程通过运行 `SWIG` 命令启动，该命令会将任何 C++ 类拆分为各个部分，并生成一个匹配的文件名（回想之前讨论过的 Java 包系统）。然后，这些封装器被用于将
    C++ 部分翻译成 Java 能理解的内容。讽刺的是，Java 代码部分几乎没有功能。它们仅仅作为从 C++ 翻译成 Android 可以理解的内容的媒介。在
    Java 原生接口（或 `JNI`）的帮助下，Java 代码可以被其他语言使用并访问它们各自的库。


    ![](img/main-36.jpg)


    在最基础层面，Android 设备运行在 C++ 上。


    除了 Java 之外，SWIG 还可以连接 C++ 与其他语言，包括 Javascript、PERL、PHP、Python 和 Ruby。这个接口编译器最初编写于
    1995 年，经历了多次更新和多个版本，最新版本发布于 2017 年。除了作为 C++ 与其他语言之间的解释器外，它在原型设计、调试、系统集成以及构建扩展模块方面也有用。虽然它是
    C 和 C++ 社区中非常有用的工具，但它的缺点之一在于它只针对该特定的编程语言，不能用于翻译其他语言。


    在最基础层面，C++ 比 C 具有更多功能。C++ 允许用户以三种不同的方式定义字符串，而 C 只允许一种。C++ 还允许在程序的任何地方声明变量，这是另一个巨大的改进，使计算流变得更加符合逻辑。C++
    的另一个重要新增是支持函数重载。这意味着可以有多个同名的方法，并根据接收到的输入类型以某种方式运行。C++ 还允许动态内存，只需简单地添加 `new` 和
    `delete` 关键字。虽然它还没有像 Java 那样的自动垃圾回收功能，但这些词可以用非常相似的方式使用。


    ![](img/main-38.jpg)


    了解 C++ 代码的所有部分可以让你创建一个强大且受保护的程序。


    如果要创建一个新变量，要在其前面加上 `new` 一词。`delete` 的工作原理相同。最后，C++ 整合了类和面向对象的编程，这提供了更大的活性。


    ### 什么时候应该使用 C++？


    考虑到本章中讨论的所有内容，大问题仍然是：什么时候应该使用 C++ 呢？答案取决于几个不同的因素。根据所涉及程序的需求，答案可能会改变。然而，在最基础层面，当性能至关重要时，应该使用
    C++。它与运行的硬件紧密接触的能力使其具有效率，如果程序员决定使用另一种语言，这种效率可能无法比拟。此外，它赋予程序员更高的灵活性和控制力使得 C++ 成为一个可以塑造成任何所需形状的完美工具。另一个需要考虑的因素是当前任务是否有先前的代码库。如果程序的旧版本已经使用
    C 或 C++ 编写，那么在完全全新的环境中编写它将是浪费时间和金钱。最后，如果领导项目的首席程序员已经在 C++ 方面拥有丰富经验，那么就应该利用这一点。C++
    是一门难以掌握的语言，任何能够完全掌控其潜力的人都应该利用这些知识。总而言之，最佳实践是确定客户、程序员和程序本身能带来什么；评估各种选项；并为相关任务做出最合理的选择。


    ![Image](img/page75_image2.jpg)


    反之：凭借今天所有的可用资源，学习代码可以非常容易。


    ![](img/main-39.jpg)


    ## 入门


    一旦你掌握了 C++ 编程社区通用的常用术语，你就准备好学习编程了。此时，技术要求开始发挥作用了。本章提供了关于这些要求的信息，描述了学习 C++ 的资源，研究了程序员的职业前景，并查看了该语言的最新实现。


    ### 准备你自己和你的电脑


    由于标准电脑通常没有预装集成开发环境（IDE），下载一个是任何新程序员开始的地方。IDE 就像是编程界的 Microsoft Word；它是编写（在本例中是编码）的地方。在
    C++ 社区中，一些流行的 IDE 有 `CLion`、`Visual Studio` 和 `Eclipse`。对于初学者来说，`Code::Blocks`
    是一个可行的选择——它可以与几乎任何编译器配合，并且对公众免费。与 IDE 结合使用，你还需要下载兼容 C/C++ 的编译器。如之前提到的，编译器是将代码翻译成机器可读语言并允许程序在设备上执行的工具。


    一旦学习了术语并安装了技术，就是时候实际编写代码了！学习 C++ 的下一步是探索可用的资源。那里有很多选项可以帮助学习这种语言。找到合适的资源取决于个人偏好。也许一本纸质编程书籍会有最大的帮助。或者
    YouTube 上的一步步引导观众编写程序的视频教程可能更适合你的学习风格。


