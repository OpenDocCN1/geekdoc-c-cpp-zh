    - 第 6 行：程序的内核。该行以 C++ 打印函数开始，即 `std::cout`，它代表标准字符输出设备。这决定了程序员正在（通常是）向计算机屏幕显示以下信息。引号中的单词是需要显示的内容。然后，像每一行已完成的代码一样，它以分号结束。


    如果执行正确，该程序将显示如下所示：


    ```

    Hello World!

    ```


    虽然这个程序非常简单，但它是通向更复杂事业的绝佳起点，这些事业每天都在造福我们的生活。


    ![](img/main-26.jpg)


    C++ 有许多应用，但视频游戏代码是其最常见的用途之一。


    ## 日常应用


    这可能显而易见，但 `C++` 是许多平台的关键部分。每当用户打开 `Photoshop` 时，他们就体验了 `C++` 脚本的直接结果。当有人在 Google
    上搜索猫图片时，也是如此：`C++` 被整合到 Google 的搜索引擎代码中。几乎 99% 的可执行游戏都使用了 `C++`，因此它甚至让游戏成为可能。从医疗软件到操作系统，任何地方都能找到
    `C++`，并持续被用于新的应用程序中。然而，尽管它是一种非常有用的编程语言，但它确实有自己的优缺点。


    ## 自动驾驶汽车


    o o o


    每天都有令人兴奋的技术进步，这些发明和发现中的许多可能会永远改变世界的运行方式。自动驾驶车辆就是这种与编程社区紧密联系的发明之一。一个名为 `Waymo`
    的新集团不断努力让这些汽车成为现实。


    从 2009 年开始，`Google` 启动它的自动驾驶汽车项目。最初的目标是装备一组丰田普锐斯（Toyota Prius）车辆，以便它们能够自主行驶 100
    英里（160.9 公里）的距离。三年后，他们实现了这一目标并更多。`Google` 开始向车队中加入雷克萨斯（Lexus）车辆，甚至允许 `Google`
    员工在道路上测试这项技术。虽然这些汽车最初在高速公路上行驶，但 `Google` 在 2012 年后转向城市街道。新的、繁忙的区域引入了全新的复杂性。在克服了这些额外复杂性后，`Google`
    在 2014 年发布了一种新型原型车，并于 2015 年将其投入公共道路运行。从那时起，自动驾驶车辆行驶了超过百万英里。这些自动驾驶汽车利用 `C++` 实现了这一切。


    这些车辆最初用 `C++` 编写脚本，现在能够处理四路路口、预测人类驾驶员会做什么，并对紧急车辆做出反应。`Waymo` 开发的技术如此先进，以至于公司甚至在
    2015 年 10 月完成了他们的首次成功的全自动驾驶乘车，乘客是一位名为 `Steven Mahan` 的人。这辆车不仅没有任何种功能性转向设备或踏板，而且
    `Steven` 在没有测试司机协助的情况下独自乘车。但这并不是最特别的地方；特别的地方是 `Steven` 在法律上是盲人。自动驾驶汽车的潜力为像 `Steven`
    这样的人、老年人以及每个人提供了巨大的利益。正是这样的技术可以在为人们提供更多自由的同时，在道路上提供程度的安全性。


    除了让人们能够在不自己驾驶的情况下去往地方，这项发展中的技术还将提供一系列全新的工作。开发、测试和制造这类车辆所需的人数是惊人的。自动驾驶汽车将加强对各种类型软件工程师的需求，从专注于嵌入式系统的到专攻硬件的人员。除了工作之外，`Waymo`
    还希望让道路更安全。


    在美国，近 94% 的事故是由人为失误造成的，因此有很大的改进空间。通过从驾驶方程式中消除人为因素，致命事故的概率就会降低。自动驾驶车辆可以取代超速、喝酒、发短信或在方向盘上睡着的驾驶员。从核心上说，如果不使用
    `C++`，`Waymo` 将无法实现这一点。正是这样的应用证明了 `C++` 依然有多么有用，以及它如何在未来几年内开启新技术。


    ![](img/main-28.jpg)


    相反地：就像运动员有优缺点一样，`C++` 在某些方面比其他方面更出色。


    ![](img/image_002_.jpg)


    ## 优点与缺点


    与其他许多技术一样，总会有更适合处理当前的任务。`Photoshop` 比 `Microsoft Paint`（画画）更适合编辑图片。在写论文时，`Microsoft
    Word` 比 `Adobe Illustrator` 是更好的选择。考虑到这一点，某些语言在处理特定任务时也更有效。`C++` 可能是一种适应性极强的语言，但即使如此，它也有自己的优缺点。


    ### C++ 的优点


    作为一种通用编程语言，`C++` 拥有大量的有利功能和广泛的用途。`C++` 允许的整体性能可能是它最重要的品质。因为 `C++` 在其机器码中整合了 `C`，这使得整个程序运行得更接近机器。这意味着执行指令所需的时间更短；指令传输到机器主要部分的距离也更短。此外，`C++`
    还允许程序员在任何时候切换到汇编语言或 `C`。这种优势源于该语言对 `C` 的向后兼容。`C` 和 `C++` 之间的关系也是如此。`C` 较老，但它仍然对新语言
    `C++` 的运行非常有用。


