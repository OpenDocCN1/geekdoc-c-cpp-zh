    它包含的第一个重要特性是在代码中使用了模板。模板作为通用的代码段，可以被重复使用，无论输入的数据类型是什么。这意味着，你不再需要为数值数据、文本数据和符号数据分别编写方法或计算逻辑，而是模板可以简单地适应于放入其中的任何信息片段。通常情况下，这些模板使用泛型数据类型
    `T` 运行。`T` 的作用与显式定义变量中的 `int` 或 `char` 非常相似。


    C++ 的另一个一个重要方面是其使用异常的能力。异常是在程序执行期间标记发现的错误的代码段。例如，如果某个计算尝试将一个数字除以 `0`，`exception
    method` 就会抛出一个异常。这会导致程序自我终止。在处理异常时，会有三个关键词不断出现：`throw`、`catch` 和 `try`。抛出异常简单意味着代码的某个区域触发了异常，程序员正在被提醒该问题。`Try`
    用于异常处理内部，用于标记针对特定异常的可能解决方案，后面通常跟着一个 `catch` 选项块。这是程序在说：“在这里，尝试这些选项，我们看看是否有任何一个能捕获该问题。”异常对于捕获逻辑错误、运行时错误以及其他通过通过阅读代码无法直观发现的错误（例如发生在方法构造函数中的错误）非常有用。


    C++ 的最后一个显著特性是其用户可以访问的广泛库。这与人们最熟悉的物理库相似，C++ 库拥有大量资源，帮助编码人员完成工作。这个由方法和其他代码片段组成的庞大集合可供任何用户使用。广泛的库意味着开发端的工作量更少。C++
    库包含了允许创建存储容器的方法。该库还处理了定义什么是字符串变量的后台工作。如果没有 `C++ Standard Library`，代码的每个元素都必须手动创建，而现有的
    C++ 将不复复存在。从一开始起，C++ 用户一直对该库做出贡献，使这种语言变得更加高效。这种广泛的贡献也帮助提供了更多工具供使用，同时消除了同行程序员编写和开发自己版本的需求。虽然
    C++ 有许多优点并能够完成交给它的绝大多数任务，但它也有一些关键缺点，这些缺点可能通过其他编程语言更好地解决。


    ### C++ 的缺点


    尽管 C++ 如今仍被广泛使用，但它仍然有缺点。C++ 最大的缺点是其陡峭的学习曲线。因为它最初是解决问题的解决方案（包括解决 Simula 缺乏面向对象设计的问题），随着它向新标准发展，它变得越来越复杂。此外，它缺乏像其他面向对象程序那样的内存管理能力。这意味着
    C++ 没有方法在创建对象和类后显式地创建或销毁它们。对于该语言的新手来说，理解这个概念很困难，因为用户通常必须硬编码，或者从零开始，并创建一个垃圾回收系统来处理不再需要的代码段。此外，C++
    具有非常特定的语法，必须遵循这些语法代码才能按预期执行。语法是程序的文本格式化。所有这些问题都源于 C++ 是一种低级语言。随着程序员离目标机器越近，这种语言对于基础用户来说就变得越来越难以理解。然而，C++
    并不是不可学习的。通过足够的练习，任何新手都能精通这种语言。


    虽然 C++ 提供了许多其他语言不具备的特性，但也有一些它不具备且影响性能的特性。除了上述缺乏内存管理外，它还缺乏反射（reflection）和内省（introspection）功能。这些术语简单意味着
    C++ 缺少在运行时查看自身代码的能力。如果具有这种能力，这种语言就可以用于检测错误并根据需要调整程序。C++ 缺少的另一个特性是消息传递（message
    passing），这是各种方法之间相互通信所需要的。假设程序员有一个方法来计算立方体的密度（即质量除以体积）。在同一个程序中，有另一个方法用于确定体积。这些方法需要向彼此传递各自的值，以准确计算密度。遗憾的是，C++
    不允许这样做。然而，通过使用 C++ 库，这个问题以及内存管理问题，可以通过引入之前开发的方法来轻松解决。更有经验的程序员甚至将这些察觉到的缺陷视为优点，因为
    C++ 为编码员提供了大量的低级控制权，允许他们决定程序整体的功能。


    ![](img/main-34.jpg)


    一个缺乏经验的 C++ 程序员可能会无意中让代码和信息处于脆弱状态，C++ 不会自动提供保护。最后一个值得讨论的问题在于 C++ 的安全能力。C++ 面临的最常见安全问题是缓冲区溢出（buffer
    overflow）。当输入字段被赋予一个固定长度，而用户故意超出该限制时，就会发现缓冲区溢出。这对安全意味着什么？一个可能导致问题的例子是密码锁手机。大多数密码将用户限制在四个数字的选择中。然而，可以反复复制和粘贴数字到某些锁屏上，直到锁屏功能因过载而无法正常运行。导致的失败被称为缓冲区溢出。这让黑客获得了访问设备及其存储信息的权限。虽然可以通过
    C++ 库中的各种方法补救缓冲区溢出，但不熟悉 C++ 的人可能会忘记处理这些忧虑。因此，他们的程序就遗留下了受到攻击的漏洞。与任何编程语言一样，使用每种语言都有其优缺点，这只是比较并确定哪一个更适合当前任务的问题。


    #### C++ vs. Python


