- fmt: '

    While the name `C84` alleviated confusion between the varying `C` with Classes
    conundrum, it created further confusion because of the number following the `C`.
    It was often common when naming coding languages to incorporate the year they
    were standardized. By these means, its current name gave the appearance that `C`
    was standardized in 1984. This was not true. In addition to this logic, `C84`
    was not an attractive name. It lacked appeal to the everyday programmer because
    it sounded too institutional. The final name change to `C++` was suggested by
    Rick Mascitti and formally put into use in December of 1983. Stroustrup chose
    this name because it was simple and lacked any sort of indication that it was
    a new variety of the same “old” `C` language. This was because the “plus plus”
    (as it stands in the coding community) was interpreted to mean “successor” or
    “next.” Though it was quite a process to settle on its current name, `C++` cleared
    up a lot of confusion within the programming community.


    ### What Problems C++ Solved


    `C++` brought a lot of desirable features to the field of computer science. Quite
    possibly one of the most important ideas that drove the evolving `C++` language
    forward was the fact that it was motivated by real problems. Programmers wanted
    a tool that could be shaped to fit their needs. This tool had to allow them to
    focus on the task at hand, instead of trying to fit their task into their available
    resources. This need was articulated in `C++`’s general-purpose language design.
    In being a general-purpose language, `C++` could be used in a wide array of applications.
    This kind of flexibility usually makes a language more complicated, but Stroustrup’s
    decision to compartmentalize his language helped keep things simple. A programmer
    did not have to understand every `class` that was within the `C++` library.


    Another problem that was addressed by `C++` was the lack of abstraction available
    in other languages at the time. Abstraction is the idea that only the relevant
    data should be shown. Therefore, any excessive complexities were below surface-level,
    making way for new and interesting implementation techniques. It also allowed
    `C++` the freedom to eliminate type violations, since users were allowed to formulate
    their own data structures. While this introduced potential security threats, Stroustrup
    found that the increased flexibility outweighed the risk. `Virtual functions`
    allowed for a `class` to define the general properties of an object. From there,
    more specific objects could be made. For example, a programmer could create a
    `class` named `Vehicle`, which would house information such as whether or not
    the vehicle in question was a sedan, truck, or SUV. From there, a more specific
    `class` of type `Vehicle`, such as `class` `Truck` could be created to house Make,
    Model, and Year. The increased lack of security came from the fact that most of
    these `classes` were to remain public, or open to threats. However, this allowed
    `C++` to meet more people’s needs and become increasingly appealing to a variety
    of users.


    ![](images/main-14.jpg)


    `C++` was able to run on IBM''s PC/AT computer, which had very little available
    memory to run such a program. This made `C++` useful to many people.


    Lastly, Stroustrup’s ability to recognize the need for an affordable option drew
    users to his programming language. He set out to design a language that could
    be implemented by even the poorest graduate students, since it was created with
    portability in mind. Stroustrup had successfully designed a language and compiler
    that could be run on the IBM PC/AT. At the time, the IBM computer had a mere 16
    MB of memory. (To put that into perspective, today’s average computer user has
    anywhere between 4 and 6 gigabytes of memory available. That is an increase of
    375 percent!) At the time of creation, memory constraints were not as important
    since the available technology did not allow for everyday people to program. Unfortunately,
    the available machines were still clunky and expensive. However, the PC revolution
    brought computers into a growing number of American households by the late 1980s,
    and the expanded adoption of computers became an important element of `C++`’s
    growth. This growth even garnered the attention of commercial software developers.


    ### C++ Today


    `C++` as we know it today is hardly the same beast as Stroustrup’s 1983 creation.
    The language has undergone many changes and updates to adapt to monumental changes
    in computing. However, `C++` is still an active and widely used language among
    programmers worldwide.


    ### The Influence of C++


    Quite possibly the largest influence `C++` has had is in the realm of object-oriented
    programming (OOP). While it was introduced as a general-purpose programming language,
    `C++` was the first of its kind to lend itself to successful object-oriented design.
    At the time of its creation, `C++` challenged two universal “truths”: 1) OOP was
    inefficient and messy, and 2) OOP could be used only by expert programmers due
    to its extreme complexity.


    Because of its ability to overcome these obstacles, `C++` heavily influenced other
    OOP languages to come, forcing the coding community to accept object-oriented
    programs as a useful tool. Nods to `C++` can be found in `Java`, `C#`, and many
    other popular languages used today. Aside from the languages it has helped to
    shape, `C++` can be found in a number of applications that millions of people
    use on a daily basis.


    Due to its overwhelming popularity, `C++` influences a variety of systems and
    programs. However, it is often difficult to document where it is currently being
    used. This is because there is no centralized `C++` organization that tracks this
    information. `C++` was and still is distributed commercially for industries to
    use as they please, meaning their implementations don’t need to be released publicly.
    Even though its detailed usage is usually hidden from view, `C++` can be found
    in anything from e-commerce, such as Amazon, to popular design programs, such
    as Adobe’s `Photoshop` and `Illustrator`. From there, some of the language’s more
    interesting applications include games, such as `Halo` and `StarCraft`, and entertainment
    like the Apple `iPod`’s interface.


    After becoming standardized for the first time in 1998, `C++` solidified its presence
    in the future of programming. In doing so, a committee was appointed to manage
    subsequent releases of the language. The committee also determined what new features
    would be implemented in the new editions. The committee’s role helped the language
    become more mainstream, and the organization has since released three more standards.
    `C++03`, `C++11`, and `C++14` were released in 2003, 2011, and 2014, respectively.
    With a staggering number of suggested extensions to be evaluated for future standards,
    there are tentative plans to release new versions in late 2017 and 2020. Some
    of the expected features intend to add mathematical special functions and include
    the ability to define an object as optional. In addition, a future edition will
    include the option to remove obsolete functions.


    While other coding languages that were developed in the same timeframe as `C++`
    have since grown outdated, `C++` continues to improve and prove its worth to the
    programming community. The language has adapted to modern hardware and techniques
    quickly and efficiently. And Stroustrup, who has always put users first, still
    very much has a say in the direction `C++` will go. He recognizes that new features
    are always a need. However, without backwards compatibility to use what has already
    been developed, his programming language would go from a tool that solved a problem
    to a headache for those who implemented old code.

