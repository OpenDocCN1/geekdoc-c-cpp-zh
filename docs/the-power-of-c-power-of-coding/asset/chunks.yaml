- fmt: "\nHaving covered the pros and cons of C++ as a language, one might wonder\
    \ how it stacks up to the other available programming languages. When compared\
    \ to Python, it is easy to see circumstances where one language would be more\
    \ beneficial to use than the other. The first notable difference between the two\
    \ stems from the type of language each one is. Python is defined as an interpreted\
    \ language, which means it does not require compilation in order to run. By ridding\
    \ itself of the need to translate its own code into machine-readable code, Python’s\
    \ overall complexity is lessened. It demands less from the machine it is running\
    \ on. Python’s simplicity also carries into the syntax, or textual setup, of the\
    \ language. Compared to C++, Python’s formatting is very simple in nature. Programmers\
    \ first see this in Python’s lack of a `main` method. Where C++ requires this\
    \ central framework from which to run its code, Python chooses to accept any method\
    \ as the primary method. Therefore, a program can start from anywhere within the\
    \ code. Additionally, Python’s individual lines of code are much more simplistic.\
    \ Python does not require semicolons or curly brackets to define when a line of\
    \ code or method, respectively, ends. By removing the excess text, the code is\
    \ much more pleasing to the eye and is more understandable. Python also has only\
    \ three different types of numerical variables (`spam`, `longspam`, and `float`),\
    \ whereas C++ has six. Since there are fewer rules to remember with Python than\
    \ there are with C++, Python requires less development time when making comparable\
    \ programs. Where a program in C++ could take up to a year to fully develop, a\
    \ similar program in Python would only take about two months. Why even use C++\
    \ then, if Python seems like the better option?\n\nThe answer to that question\
    \ lies in the functionality of each programming language. While Python is much\
    \ simpler and easier to understand, its abilities are limited because of its simplicity.\
    \ In more complex programs, it is important to maintain the integrity of the variables\
    \ in use. Because Python uses implicit typing, this integrity is compromised.\
    \ Implicit typing is when a program does not specifically state what type of variable\
    \ is tied with each identifier, it simply assumes. For example, for a numerical\
    \ value named `Money` that is set to `1,879,030,222`, Python would simply assume\
    \ this to be a `long` variable. It’s often convenient that Python makes intuitive\
    \ leaps. Yet sometimes, Python’s assumptions cause problems. For that same variable\
    \ named `Money` initially set to some numerical value, there could be another\
    \ place in the program where `Money` is set to `\"a\"` and is then considered\
    \ a `char` variable. This could disrupt calculations and create security vulnerabilities.\n\
    \nOn the other hand, C++ uses explicit typing. Therefore, each variable type has\
    \ to be defined when it is initialized. An `int` variable will remain an `int`\
    \ variable; a `string` will remain a `string`. The information these explicitly\
    \ typed variables contain may differ, but they will never change type. This increases\
    \ the complexity of the language, but explicit typing has more benefit in everyday\
    \ applications.\n\nThe final difference between the two languages is the demographics\
    \ each caters to. Since it is understood with a large amount of ease, Python is\
    \ a great language for beginning programmers to experiment with. It introduces\
    \ individuals to coding without the added complexities and rules. There are also\
    \ a lot of resources for those who are looking to learn Python, since it prides\
    \ itself on being a great first coding language. Once an individual has mastered\
    \ Python, it is much easier to transition over to more complicated languages,\
    \ such as C++. As you can be see, these two languages are very different, but\
    \ each has an important role in programming.\n\n## C++ vs. Java\n\nWhile the difference\
    \ between C++ and Python was obvious from the beginning, even languages that are\
    \ both rooted in object-oriented design, such as C++ and Java, can have some important\
    \ differences. The first difference between the languages becomes clear when setting\
    \ up a file to code in. Java requires a strict relationship between its filename\
    \ and individual class names. This means that if a class is referred to as `MedianFinder`,\
    \ the filename it is housed in must have the same name, down to the capitalization.\
    \ C++ does not enforce such a standard, and it can even be seen as poor practice\
    \ within the language to name things with a similar convention. Alternatively,\
    \ because of Java’s naming requirement, every piece of a Java program has to be\
    \ part of a class. If there is not a class, there is not something to name the\
    \ file it is in. To facilitate this system of organization, Java also implements\
    \ packages within its program structure. Packages serve as a place to house multiple\
    \ classes for a single program. They are similar to the folders found on a computer;\
    \ they simply serve as a storage place. Conversely, C++ has a very loose organization\
    \ structure that can be as strict or messy as the programmer desires.\n\nAnother\
    \ key difference between the two is the presence of an automatic garbage collection\
    \ system. As discussed in the weaknesses section, C++ does not currently have\
    \ one of these systems in place. Java, on the other hand, does. This means that\
    \ any object that is no longer being used within a program can be destroyed, allowing\
    \ the memory space to be released and reassigned to something that would make\
    \ better use of it. In this way, Java can be seen as more efficient. However,\
    \ C++ is able to make the necessary accommodations to accomplish this as well.\n\
    \n## How Do They Compare?\n\nWith all this talk of simple versus complicated code,\
    \ it's helpful to look at how these two languages really stack up against one\
    \ another. In the example below, both languages are accomplishing the same thing,\
    \ which is evaluating a simple xy calculation.\n\nC++ Code:\n```cpp\nint pow(int\
    \ x, int y)\n{ \n    int result = 1; \n    for (int i = 0; i < y; i++) {\n   \
    \     result *= x;\n    }\n    return result;\n}\n```\n\nPython Code:\n```python\n\
    def pow(x, y): return x**y\n```\n\nThe Python code seems easier to understand.\
    \ The C++ code has to thoroughly outline the process of calculating a power function\
    \ by multiplying the base number by itself within what's called a \"for loop\"\
    . A for loop is a simple coding structure that repeats until a certain parameter\
    \ is met. In this case, `i` is no longer smaller than `y`, as seen in the `i <\
    \ y` check within the `for` loop definition. On the flip side, the Python code\
    \ is able to do the calculation without extra effort.\n\nLastly, both languages\
    \ have an extensive library in place to support their users. While neither is\
    \ usable within the other language, a lot of the functionality of Java’s and C++’s\
    \ library systems overlaps. Therefore, programmers using each language are asking\
    \ the same things of Java and C++. Yet even though each language may be for similar\
    \ tasks, the differences between the two are enough to make them separate entities.\
    \ C++ is a lot like flying an aircraft, whereas Java is like driving a car. An\
    \ aircraft needs more pieces than a car to work.\n\nJust like an airplane has\
    \ a lot of moving parts, C++ has many pieces that go into making functional code.\n\
    \n### The Building Blocks: A Look at C\n\nIt is no secret that technology is constantly\
    \ building upon itself. Fire led to candles; candles led to lanterns; lanterns\
    \ led to electricity. Much in the same way, typewriters led to computers, computers\
    \ led to programming languages (like C), and C led to improved languages. One\
    \ of those improved languages was C++. In fact, many aspects of C++ evolved out\
    \ of C.\n"
  raw: 'Having covered the pros and cons of C++ as a language, one might wonder how
    it stacks up to the other available programming languages. When compared to Python,
    it is easy to see circumstances where one language would be more beneficial to
    use than the other. The first notable difference between the two stems from the
    type of language each one is. Python is defined as an interpreted language, which means
    it does require compilation in order to run. By ridding itself of the need to
    translate its own code into machine-readable code, Python’s overall complexity is
    lessened. It demands less from the machine it is running on. Python’s simplicity
    also carries into the syntax, or textual setup, of the language. Compared to C++,
    Python’s formatting is very simple in nature. Programmers first see this in Python’s
    lack of a main method. Where C++ requires this central framework from which to
    run its code, Python chooses to accept any method as the primary method. Therefore,
    a program can start from anywhere within the code. Additionally, Python’s individual
    lines of code are much more simplistic. Python does not require semicolons or
    curly brackets to define when a line of code or method, respectively, ends. By
    removing the excess text, the code is much more pleasing to the eye and is more
    understandable. Python also has only three different types of numerical variables
    (spam, longspam, and float), whereas C++ has six. Since there are fewer rules
    to remember with Python than there are with C++, Python requires less development
    time when making comparable programs. Where a program in C++ could take up to
    a year to fully develop, a similar program in Python would only take about two months.
    Why even use C++ then, if Python seems like the better option?


    The answer to that question lies in the functionality of each programming language.
    While Python is much simpler and easier to understand, its abilities are limited
    because of its simplicity. In more complex programs, it is important to maintain
    the integrity of the variables in use. Because Python uses implicit typing, this
    integrity is compromised. Implicit typing is when a program does not specifically
    state what type of variable is tied with each identifier, it simply assumes. For
    example, for a numerical value named “Money” that is set to 1,879,030,222, Python
    would simply assume this to be a “long” variable. It’s often convenient that Python
    makes intuitive leaps. Yet sometimes, Python’s assumptions cause problems. For
    that same variable named “Money” initially set to some numerical value, there
    could be another place in the program where “Money” is set to “a” and is then
    considered a char variable. This could disrupt calculations and create security
    vulnerabilities.


    On the other hand, C++ uses explicit typing. Therefore, each variable type has
    to be defined when it is initialized. An int variable will remain an int variable;
    a string will remain a string. The information these explicitly typed variables
    contain may differ, but they will never change type. This increases the complexity
    of the language, but explicit typing has more benefit in everyday applications.


    The final difference between the two languages is the demographics each caters
    to. Since it is understood with a large amount of ease, Python is a great language for
    beginning programmers to experiment with. It introduces individuals to coding
    without the added complexities and rules. There are also a lot of resources for
    those who are looking to learn Python, since it prides itself on being a great
    first coding language. Once an individual has mastered Python, it is much easier
    to transition over to more complicated languages, such as C++. As you can be see,
    these two languages are very different, but each has an important role in programming.


    #### C++ vs. Java


    While the difference between C++ and Python was obvious from the beginning, even
    languages that are both rooted in object-oriented design, such as C++ and Java,
    can have some important differences. The first difference between the languages
    becomes clear when setting up a file to code in. Java requires a strict relationship
    between its filename and individual class names. This means that if a class is
    referred to as MedianFinder, the filename it is housed in must have the same name,
    down to the capitalization. C++ does not enforce such a standard, and it can even
    be seen as poor practice within the language to name things with a similar convention.
    Alternatively, because of Java’s naming requirement, every piece of a Java program
    has to be part of a class. If there is not a class, there is not something to
    name the file it is in. To facilitate this system of organization, Java also implements
    packages within its program structure. Packages serve as a place to house multiple
    classes for a single program. They are similar to the folders found on a computer;
    they simply serve as a storage place. Conversely, C++ has a very loose organization
    structure that can be as strict or messy as the programmer desires.


    Another key difference between the two is the presence of an automatic garbage
    collection system. As discussed in the weaknesses section, C++ does not currently
    have one of these systems in place. Java, on the other hand, does. This means
    that any object that is no longer being used within a program can be destroyed,
    allowing the memory space to be released and reassigned to something that would
    make better use of it. In this way, Java can be seen as more efficient. However,
    C++ is able to make the necessary accommodations to accomplish this as well.


    ### How Do They Compare?


    o o o


    With all this talk of simple versus complicated code, it''s helpful to look at
    how these two languages really stack up against one another. In the example below,
    both languages are accomplishing the same thing, which is evaluating a simple
    xy calculation .


    C++ Code:


    int pow(int x, int y)


    { int result = 1; for (int i = 0; i < y; i++) {result *= x;}


    return result;


    }


    Python Code:


    def pow(x, y): return x**y


    The Python code seems easier to understand . The C++ code has to thoroughly outline
    the process of calculating a power function by multiplying the base number by
    itself within what''s called a "for loop " A for loop is a simple coding structure
    that repeats until a certain parameter is met . In this case, "i" is no longer
    smaller than "y," as seen in the "i < y" check within the "for" loop definition
    . On the flip side, the Python code is able to do the calculation without extra
    effort .


    Lastly, both languages have an extensive library in place to support their users.
    While neither is usable within the other language, a lot of the functionality of
    both Java’s and C++’s library systems overlaps. Therefore, programmers using each
    language are asking the same things of Java and C++. Yet even though each language
    may be for similar tasks, the differences between the two are enough to make them separate
    entities. C++ is a lot like flying an aircraft, whereas Java is like driving a
    car. An aircraft needs more pieces than a car to work.


    ![](images/main-35.jpg)


    Just like an airplane has a lot of moving parts, C++ has many pieces that go into
    making functional code .


    #### The Building Blocks: A Look at C


    It is no secret that technology is constantly building upon itself. Fire led to
    candles; candles led to lanterns; lanterns led to electricity. Much in the same
    way, typewriters led to computers, computers led to programming languages (like
    C), and C led to improved languages. One of those improved languages was C++.
    In fact, many aspects of C++ evolved out of C.'
