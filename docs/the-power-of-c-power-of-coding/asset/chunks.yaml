    当然，`C++` 能够长久生命，很大程度上是因为 Stroustrup 在开发它时兼顾了专家和初学者。他的初衷并不是为了设计代码来解决某个特定问题。相反，他设计
    `C++` 是为了程序员能够根据自己的需求将其造成任何形状。这意味着即使是初学者也能找到 `C++` 的用处。由于其实现跨越了多个行业，`C++` 似乎具备长久存在的要素。


    ## 贾恩·斯特罗斯鲁普 (Bjarne Stroustrup)


    o o o


    ![](img/main-15.jpg)


    Bjarne Stroustrup（左）仍在不懈工作，确保 `C++` 满足用户的需求。


    Bjarne Stroustrup 于 1950 年 12 月 30 日出生于丹麦，他因创建流行的编程语言 `C++` 而闻名。他在奥胡斯大学就读直到 1975
    年，并在那里获得了计算机科学硕士学位。毕业后，由于渴望学习更多分布式系统的知识，他前往英国剑桥大学计算实验室攻读博士，并于 1979 年毕业。在此期间，他遇到了并结了妻子
    Marian，他们并迎来了一个名为 Annemarie 的女儿。在剑桥大学学业结束后，全家移民到了新泽西州。在那里，他加入了贝尔电话实验室（Bell Telephone
    Laboratories）的计算机科学研究中心。


    在贝尔实验室工作期间，Stroustrup 高度专注于 `C++` 的开发并将构想变为现实。在新泽西州梅耶斯维尔（Meyersville）期间，他和妻子生了一个名为
    Nicholas 的儿子。在贝尔实验室经历多次拆分后，Stroustrup 担任大型编程研究部门部门主管直到 2002 年底，随后他加入了德克萨斯 A&M
    大学（Texas A&M University）的计算机科学系。在校期间，他曾任工程学院计算机科学主任。他在该大学担任教授直到 2014 年 1 月；随后搬到纽约担任摩根士丹科技部门的董事总经理。Stroustrup
    指出，学术界往往会分散解决工业问题的注意力，而这正是 `C++` 设计的初衷。这次搬迁也让他能更接近他的女儿和儿子，他们分别担任医生和系统生物学教授。住在纽约也有利于靠近他的孙辈。


    除了多年来担任的各种职业职位外，Stroustrup 还一直忙于许多侧边项目和课外活动。他写了多本书，包括《C++ 的设计与演变》（The Design and
    Evolution of C++）、《C++ 程序语言》（The C++ Programming Language）和《C++ 语言之旅》（A Tour of
    C++）。除了写作项目，他仍然积极参与未来 `C++` 版本的标准化工作。


    Strostrup 在计算机科学行业获得了高度荣誉，包括 1993 年的 Grace Murray Hopper 奖和 2005 年的 Sigma Xi 协会
    William Procter 科学成就奖。最近，在 2011 年 10 月，他被任命为名为 RollApp 的云计算初创公司的董事成员。Stroustrup
    觉得还不够忙，还在哥伦比亚大学获得了一个访问教授职位。他继续发表研究并向社区展示。如今，他关注的是性能和可靠性。


    ![](img/main-17.jpg)

    反之：就像汽车一样，当你了解零件时，学习编程会变得更容易。


    ![](img/main-18.jpg)


    ## 工作原理


    学习编程非常就像开车。新手必须首先学习基础知识。是手动还是自动的？同样，`C++` 也需要被有效地使用。本章将介绍常见的应用，以及 `C++` 可以解决的问题。


    ## 面向对象编程


    `C++` 是一种通用语言，这意味着它可以处理各种类型。`C++` 包含的最盛行的类型是面向对象编程，简称 `OOP`。


    ![](img/image_001.jpg)

    虽然面向对象的设计提供了许多优势，但有几点使其变得更好。首先是数据抽象。数据抽象允许程序员创建类（回想第 1 章中的蛋糕类比）。因此，程序员能够以不同的方式思考。数据抽象是编码时一种更自然的思考方式。它与面向对象编程的下一个优势相辅相成：数据封装。


    数据封装允许控制控制看到的内容。控制访问了对象数据各个方面的安全。通过这种方式，数据封装防止了重要数据的完整性受到破坏。为了完全理解这一概念，想象为新房主盖房子的过程。房主与承包商沟通他们想要房子的样子。然后承包商与他们的工人讨论如何完成任务。承包商了解要求，但这并不意味着房主和工人需要知道一切。工人不需要被正门应该是什么颜色的琐事所困扰，因为他们不是购买材料的人。同样，房主也不需要被告知房子分配了多少位工头，只需要知道他们正在按设定的截止日期完成。数据封装的功能也一样；它保持了“按需知”的原则。


    根据程序中每个类的定义，这种“按需知”原则可以分为三个不同级别的保护。最低级别的保护源于公有类（public class），这意味着对象类中存储的数据可以被程序的任何部分访问。最高级别的安全性可以在私有对象类（private
    object class）中找到。只有在该类执行的方法或计算可以访问这些信息。位于两者之间的是保护对象类（protected object class）。在保护对象类中，对象内部的信息不能被程序的任何部分访问。但是，这些信息可以被继承该类的其他类使用。这引导我们进入面向对象设计的另一个宝贵部分：继承。


