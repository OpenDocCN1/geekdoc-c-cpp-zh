  raw: 'It should come as no surprise that because of the ancestral connection between
    the two, C++ is the only language that is backwards compatible with C. This compatibility
    helped as experienced C programmers transitioned over to the new and improved
    C++ coding language. In its prime, C was one of the more prevalent language options
    due to its easy-to-use Application Programming Interfaces (APIs), as well as its
    extensive compiler support. Due to its compiler support, C could be implemented
    on nearly any machine. While C++ continued this trend of portability, there are
    also a few key qualities that Stroustrup built upon to make C++ better than its
    predecessor.


    ### How Java and C++ Work Together


    o o o


    Even though they are similar, both Java and C++ have their own individual uses
    in the tech world . One of those uses is the programming of various cellular devices
    . Android users can thank Java for their phone''s capabilities . As for iOS users,
    they can thank C++. However, these programming requirements create some issues
    . A lot of companies develop applications for each mobile operating system! It
    requires a lot of money and time to constantly develop apps and their updated
    versions in two different programming languages . Consistency is extremely important
    for user experience, and there should not be any discrepancies between what is
    seen on the Android version versus what is seen on the iOS version of the same app
    . There is a solution: SWIG .


    SWIG stands for the Simplified Wrapper and Interface Generator. It''s what allows
    C++ to be used on a predominantly Java-run system found on any Android device
    . At the most basic level, all core code will be in C++. SWIG is then used to
    "wrap" the Java code around this input file and make it readable to the Android
    operating system. The process is started by running the SWIG command, which will
    separate any C++ classes into individual pieces, and generate a filename to match
    (recall the Java package system discussed earlier) . These wrappers are then used
    to translate the C++ parts into things that Java will understand . Ironically
    enough, there is little functionality to the Java pieces of code . They merely
    serve as a means of translation from C++ into something Android can understand
    . With the help of the Java Native Interface, or JNI, Java code can be used by
    other languages and access their respective libraries .


    ![](images/main-36.jpg)


    At their most basic level, Android devices run on C++.


    Aside from Java, SWIG can be used to connect C++ to other languages including
    Javascript, PERL, PHP, Python, and Ruby. Originally written in 1995, this interface
    compiler has seen many updates and multiple editions, with the most recent one
    being released in 2017\. In addition to serving as an interpreter between C++
    and other languages, it is also useful in prototyping and debugging, systems integration, and
    constructing extension modules . While it is an incredibly useful tool to the
    C and C++ community, one of its weaknesses lies in the fact that it only caters
    to that specific programming language and cannot be used to translate other languages
    .


    At the most basic level, C++ has more features than C. C++ allows users to define
    strings in three different ways, whereas C only allowed for one. C++ also allows
    variables to be declared anywhere within the program, another huge improvement
    that led to a more logical flow in calculations. Another important addition to
    C++ was the ability to overload functions. This meant that there could be multiple
    methods with the same name that would function in a certain way based on what
    type of input it was receiving. C++ also allowed for dynamic memory, with the
    simple addition of the keywords “new” and “delete.” While it still did not have
    automatic garbage collection, like Java, these words could be used in much the
    same fashion


    ![](images/main-38.jpg)


    Knowing all the parts of C++ code allows you to create a strong, protected program
    .


    If a new variable was to be created, it was prefaced with the word “new.” Delete
    worked in the same way. Lastly, C++ incorporated classes and object-oriented programming,
    which allowed for a greater amount of flexibility.


    #### When Should C++ Be Used?


    Considering all that has been discussed in this chapter, the big question remains:
    So when should C++ be used? The answer depends on a few different factors. Based
    on the requirements of the program in question, the answer may change. However,
    at the most basic level, C++ should be used when performance is crucial. Its ability
    to work in close contact with the hardware it is running on allows for efficiency
    that would likely go unmatched if a programmer decided to use another language.
    In addition, the increased flexibility and control that it gives to the programmer
    makes C++ the perfect tool to be shaped into whatever is needed at the time. Another
    factor to consider is if the task at hand has a previous code base. If old versions
    of the program have already been coded using C or C++, it would not make sense
    to waste the time and money on coding it in an entirely new environment. Finally,
    if the programmer leading the project already has extensive experience in C++,
    that should be used to their benefit. C++ is a hard language to grasp, and anyone
    who can fully command its potential should make use of that knowledge. All in
    all, it’s best practice to determine what the client, programmer, and program
    itself bring to the table; evaluate the options; and make the choice that makes
    the most sense for the task in question.


