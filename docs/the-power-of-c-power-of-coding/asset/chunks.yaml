    除了写作之外，担任技术写作职位的人还可以预期研究产品、调查客户，并在各种传递信息的媒介中进行选择。正因如此，技术作家也可以受益于更具创意驱动性质的课程，因为他们被要求通过在线和社交媒体等有趣的方式来交付文本。这些职位通常不需要像开发工作那样花费大量时间，但通常需要配合其他时区的人士工作，这可能导致工作日开始得早或结束得晚。然而，由于压力的减轻，且只需满足全职工作的正常要求，同时结合他们此前积累的
    `coding` 知识，可能让技术写作对那些不想经常进行编程的人来说具有吸引力。有趣的是，希望进入这一领域的人可以像那些倾向于 `C++` 的同类一样获得认证。除了显而易见的写作技能外，技术作家还应该具备良好的想象力、团队合作能力以及技术技能。


    ![](img/main-44.jpg)


    技术写作职业非常适合不想写代码的精通技术的个人。


    ## 使用 C++ 的新技术


    虽然 `C++` 有许多日常应用，但其应用最广泛的行业是视频游戏行业。因此，出乎意料的是，结合 `C++` 的最新技术出现在游戏开发软件和游戏控制台中。


    ### Unreal Engine 4.15


    `Unreal Engine 4.15` 于 2017 年初发布。对于不熟悉游戏开发的人来说，`Unreal Engine` 是由 `Epic Games`
    于 1998 年 7 月 1 日发布的视频游戏引擎。从那时，它经历了三个主要版本，目前的发布是其第四版本的更新。`Unreal Engine 4` 是一套集成工具，允许游戏开发者创建游戏，同时对整个引擎都使用
    `C++` 源代码。


    ## 在办公室外工作：自由职业展望


    o o o


    大多数专业人士坐在办公桌后，每周五天从 9:00 到下午 5:00。然而，对于那些希望在日程和工作环境中获得更多自由的人来说，自由职业是一个很棒的选择。自由职业是指个人从个人或公司承接各种项目，而不是定期地为单家公司工作。对于追求这种职业的人来说，找到稳定的自由职业工作是一项挑战。


    虽然获得自由职业工作可能会面临困难，但有很多资源和技术可以通向成功的职业。第一个资源是互联网：有很多网站推广自由职业工作，并帮助自由职业者与寻求招聘的人联系起来。此外，即使是面向企业职位的招聘板通常经常有关于需要自由职业员工灵活性的合同职位公告。此外，在寻找自由职业工作时，各种自我推销大有用处。拥有一个易于访问的在线作品集以供潜在雇主查看过去的工作并提供联系信息是非常重要的。然而，拥有一个展示技能的网站只赢了一半。为了确保有效，这个网站必须被看到！面对面的社交会有帮助，因为这可以带来知名度。如果一个人的的人脉听说有人在寻找自由职业程序员，他们很有可能会推荐他们认识的人。因此，参加人际网络活动可以开启各种机会。一旦获得工作，来自该雇主的推荐就足以为自由职业者创造稳定的工作流。


    自由职业可以给人们在生活中他们渴望的自由，同时让他们获得可以支付其产生支出的薪水。目前，通过自由职业获得稳定工作的个人每年可以赚取 57,000 到 75,000
    美元。根据 `Glassdoor.com`，有些人人甚至报告在家里工作并安排自己的日程时，收入超过 150,000 美元！在 `Upwork`（许多自由职业网站之一）上列出的当前
    `C++` 程序员，他们的技能每小时收费从 20 美元到近 60 美元不等。自由职业程序员产生的收入取决于程序员与他人联系并产生工作的动力、他们的技能水平以及灵活性。自由职业可以是赚钱并仍保持过精彩生活自由的绝佳方式，但这条职业道路也有缺点。


    ![](img/main-46.jpg)


    自由职业工作为个人提供了许多自由，去做他们最喜欢的事情，但维护客户群仍需要大量工作。


    虽然每周在隔间工作 40 小时可能并不吸引人，但企业生活确实提供一些自由职业无法提供的东西。第一是稳定的收入来源。除非被解雇或裁员，否则他们可以依靠定期存入银行账户的工资。对于自由职业，特别是对于刚起步的人来说，收入潜力会有高低。自由职业者必须投入时间和精力来获取工作并为未来的项目建立客户群。由于收入的起伏，自由职业者通常在不那么忙的期间从事基于社区的项目，以精炼技能并继续创作有市场价值的作品。除了工作不稳定之外，自由职业还缺乏全职工作的标准福利。自由职业者必须提供自己的医疗保险并建立自己的退休计划，而且没有带薪假。这通常导致自由职业者的收费比公司内部程序员高，因为自由职业者必须平衡这些成本并同时获得足够的报酬。尽管如此，对于对对的人来说，通过自由职业追求工作可能会创造出一种极令人满意的生活方式。


    虽然 `Unreal Engine 4` 是对以前版本的巨大改进，但特别是最近的更新为游戏开发者带来了许多期待的新功能。程序的编译时间已大大缩短，在某些情况下缩短了一半。这些更短的时间是由于几个不同的原因。首先，`C++`
    代码中的每个头文件包含了编译所需的信息。它们也包含它们所需的其他头文件。这种“按需包含”（IWYU）方法减少了程序内部开销，使其运行得更快。


