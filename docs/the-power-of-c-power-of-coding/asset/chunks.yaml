    虽然 `C84` 这个名字消除了 `C` 与类（Classes）之间各种混淆，但它因为 `C` 后面的数字又造成了进一步的困惑。在命名编程语言时，通常会包含其标准化的年份。通过这种方式，它现在的名称看起来像是
    `C` 是在 1984 年标准化的。事实并非如此。除了这个逻辑外，`C84` 也不是吸引人的名字。它对普通程序员来说缺乏吸引力，因为听起来太机构化了。最终更名为
    `C++` 是 Rick Mascitti 建议的，并于 1983 年 12 月正式投入使用。Stroustrup 选择这个名字是因为它简单，而且没有任何迹象表明它是“老”
    `C` 语言的新变体。这是因为“加加”（正如编程社区中的称呼）被解释为“继任者”或“下一个”。虽然确定目前的名称经历了一个漫长的过程，但 `C++` 消除了编程社区内的许多困惑。


    ### C++ 解决了什么


    `C++` 为计算机科学领域带来了许多理想的特性。可能驱动 `C++` 语言演进最重要的思想之一，是它受真实问题驱动这一事实。程序员们希望有一种可以根据其需求塑造的工具。这种工具必须能够让他们专注于手头的任务，而不是试图将任务强行塞进现有的资源中。这种需求在
    `C++` 的通用语言设计中得到了体现。作为一种通用语言，`C++` 可以被广泛应用于各种。这种灵活性通常会让语言变得更加复杂，但 Stroustrup 对其语言进行模块化的决定有助于保持简单性。程序员不需要理解
    `C++` 库中的每一个 `class`。


    `C++` 解决的另一个问题是当时其他语言缺乏抽象。抽象的概念是只显示相关数据。因此，任何过度的复杂性都隐藏在表面之下，为新的有趣的实现技术开辟了道路。它还让
    `C++` 拥有消除类型违规的自由，因为用户被允许制定自己的数据结构。虽然这引入了潜在的安全威胁，但 Stroustrup 发现增加的灵活性超过了风险。`Virtual
    functions`（虚函数）允许 `class` 定义对象的通用属性。从这里开始，可以创建更具体的对象。例如，程序员可以创建一个名为 `Vehicle`
    的 `class`，其中存储了有关车辆是否为轿车、卡车或 SUV 的信息。从那里，可以创建一个类型为 `Vehicle` 的更具体的 `class`，例如
    `class` `Truck`，以存储品牌、型号和年份。安全性的增加是因为这些 `classes` 中的大部分将保持公开，或者说对威胁开放。然而，这使得 `C++`
    能够满足更多人的需求，并对各种用户变得越来越具有吸引力。


    ![](img/main-14.jpg)


    `C++` 能够在 IBM 的 PC/AT 计算机上运行，而该计算机的可用内存不足以运行此类程序。这使得 `C++` 对许多人都有用。


    最后，Stroustrup 识别廉价方案需求吸引了用户使用他的编程语言。他致力于设计一种即使是最贫困的研究生也能实现的语言，因为这种语言在创建时考虑了可移植性。Stroustrup
    成功地设计了一种可以在 IBM PC/AT 上运行的语言和编译器。当时，IBM 计算机只有 16 MB 内存。（作为对比，今天平均计算机用户拥有 4 到 6
    GB 不等的可用内存。这增加了 375%！）在创建时，内存限制并不重要，因为当时的技术还不允许普通人进行编程。不幸的是，当时的机器仍然笨重且昂贵。然而，到
    20 世纪 80 年代后期，PC 革命将计算机带入了美国家庭，计算机的广泛采用成为 `C++` 增长的一个重要因素。这种增长甚至引起了商业软件开发者的关注。


    ### 如今的 C++


    我们今天所熟知的 `C++` 与 Stroustrup 在 1983 年的作品几乎不是同一个物种了。这种语言已经经历了许多变化和更新，以适应计算领域的巨大变革。然而，`C++`
    仍然是全球程序员中一种活跃且被广泛使用的语言。


    ### C++ 的影响


    `C++` 产生的最大影响可能是在面向对象编程（OOP）领域。虽然它是作为一种通用编程语言引入的，但它是同类语言中第一个成功适用于面向对象设计的语言。在创建时，`C++`
    挑战了两个通用“真理”：1) OOP 是低效且混乱的；2) OOP 由于其极复杂性，只有专家程序员才能使用。


    由于其克服这些障碍的能力，`C++` 深刻影响了后来的 OOP 语言，迫使编程社区接受面向对象程序作为一种实用工具。在 `Java`、`C#` 以及许多今天使用的流行的语言中都可以找到对
    `C++` 的致敬。除了它帮助塑造的语言外，`C++` 还可以出现在数百万人每天使用的应用程序中。


    由于其极高的普及率，`C++` 影响着各种系统和程序。然而，记录它目前的使用之处通常很困难。这是因为没有一个中央的 `C++` 组织来追踪这些信息。`C++`
    过去和现在都是商业化分发供行业按意愿使用的，这意味着它们的实现不需要公开。尽管它的详细用法通常是的，但 `C++` 可以出现在从电子商务（如亚马逊）到流行的设计软件（如
    Adobe 的 `Photoshop` 和 `Illustrator`）的所有领域。


    在 1998 年首次标准化后，`C++` 巩固了它在编程未来的地位。为此，成立了一个委员会来管理语言的后续版本。该委员会还决定了在新版本中实现哪些新特性。委员会的作用帮助该语言变得更加主流，该组织自此又发布了三个标准。`C++03`、`C++11`
    和 `C++14` 分别于 2003 年、2011 年和 2014 年发布。随着大量待评估未来标准评估的建议扩展，目前初步计划在 2017 年底和 2020
    年发布新版本。一些预期的功能旨在添加数学特殊函数，并允许将对象定义为可选。此外，未来的一个版本将包含移除过时函数的选项。


    虽然与 `C++` 同一时期开发的其他编程语言已经过时，但 `C++` 仍在不断改进并向编程社区证明自己的价值。这种语言快速且高效地适应了现代硬件和技术。而始终坚持用户优先的
    Stroustrup 对 `C++` 的发展方向仍有很大的发言权。他意识到新功能是一项需求。然而，如果没有向后兼容性来使用已经开发的内容，他的编程语言将从一个解决问题的工具变成那些编写旧代码的人的头疼问题。


