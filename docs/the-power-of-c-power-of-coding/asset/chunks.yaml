    # 语法 决定程序中关键字、短语和符号如何协同运行的规则，类似于 `grammar`（语法）控制英语的方式。


    `视频游戏引擎` 用于设计和开发视频游戏的软件软件包。


    `零级抽象` 程序中最低形式的抽象，意味着代码提供的细节细节很少或完全没有。（参见“抽象 .”）


