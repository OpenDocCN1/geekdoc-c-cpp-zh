    由于 `C++` 是当今最主流的编程语言之一，对于寻找职业机会的人来说，有很多职业选择可供选择。虽然在没有某种高等教育的情况下获得入门级工作并非不可能，但大多数职位要求拥有专科或及以上学历才能被考虑。成功获得学位后，有许多职业选择可以考虑。


    ## 软件开发人员


    对于希望在工作中进行编程的人来说，一个热门选择是软件开发人员。软件开发人员负责开发程序的各个部分。这包括编写代码以及探索为了程序运行而需要完成的背景功能。软件开发人员出现在程序开发过程的任何步骤，包括编写、调试、测试和设计。除了创建并确保代码功能正常，软件开发人员还可以创建图形用户界面（`GUIs`）。`GUIs`
    是普通用户看到的简化菜单，例如电脑游戏的启动菜单。根据美国劳工统计局的数据，预计软件开发领域的工作到 2024 年将增长多达 17%，这将在该领域内增加 186,600
    个职位。截至 2016 年，美国的一名软件开发人员预计每小时可赚约 49 美元，或年薪 102,280 美元。根据经验和专业领域，一些软件开发人员的年薪甚至超过
    160,000 美元。


    获得如此薪水的道路始于教育。潜在的软件开发人员应持有计算机科学、软件工程或数学的学士学位。对于更有前景的职位，硕士学位也将有利。除了教育之外，应该在校期间通过实习或其他技术行业内的入门级职位积累经验。从那里开始，软件开发人员应该磨练自己的分析、沟通和人际技巧，以成为该职位的最理想候选人。


    ![](img/main-42.jpg)


    软件开发只是 `C++` 知识可以通往的职业路径之一。


    虽然薪资和其他福利对这类职位来说无疑是积极因素，但潜在申请者在投入这一职业道路之前，也应该注意一些缺点。其中之一是位置的限制。全球范围内都有软件开发工作，但某些区域的就业市场比其他地区更饱和。截至
    2016 年，近 91% 的可用软件开发人员职位位于加利福尼亚州的硅谷附近。这并不令人惊奇，因为硅谷是 `Google`、`Apple` 和 `Cisco
    Inc.` 等公司的所在地。除了加利福尼亚州外，开放职位集中在大型城市，包括西雅图、纽约和达拉斯。除了位置之外，另一个考虑是工作所需的时间。通常，软件开发人员被要求投入长时间，有时每周达到八十
    小时。严格的工作日程源于某些项目周转时间短，需要快速完成，无论开发者需要付出多大努力。尽管这些缺点可能会劝退一些人，但优厚的报酬和工作带来的挑战使其成为一个令人向往的职业。


    ## 游戏开发人员


    对于那些寻找使用 `C++` 职业的人，可以在游戏行业中找到另一个吸引人的选择。虽然游戏开发人员被认为是软件开发人员的一个分支，但游戏开发职位的要求各不相同。游戏开发人员通常被称为应用软件开发人员，其职责比软件开发人员更具创意和互动性。游戏开发人员预计要与作家合作生成故事情和角色传。此外，他们记录游戏设计过程并为团队开发原型。在最基础的，游戏开发人员创建视频游戏的核心功能。与软件开发人员一样，游戏开发人员预计拥有计算机科学、软件工程或类似的学士学位。然而，如果个人在主修专业之外增加基于图形的课程，例如包含
    `Photoshop` 或 3D 设计软件（如 `Maya`）的课程，也将受益。截至 2016 年，游戏开发人员预计年薪约为约 100,000 美元。


    在决定从事游戏开发工作后，有几点需要考虑。第一点是个人想为哪种类型的开发公司工作。行业内最常见的类型是第一方、第二方和第三方开发公司。第一方开发人员是那些制造特定视频游戏主机，然后生产仅在该系统上运行的游戏的公司。一个例子是
    `Nintendo`，因为 `Nintendo` 只为自己的主机生产游戏。第二方开发人员通常只为他们在合同上绑定的某一台主机生产（但他们可以扩展业务）。`Game
    Freak` 及其制作的 `Pokemon` 系列就是一个例子，因为他们通常为基于 `Nintendo` 的产品制作游戏，但并不被阻止完成其他项目。第三方开发项目由主机生产公司之外的公司拥有。这种性质的第一家公司是
    `Activision`，它成立于 1975 年。每种类型都有不同程度的创意和控制权，可能会根据项目增加或减少。


    ![](img/main-43.jpg)


    编写和开发游戏软件对于精通 `C++` 的人来说是一个可行的职业。


    虽然把开发游戏作为职业听起来很酷，但游戏开发也有值得关注的负面影响。这些工作的时间通常很长，压力通常很大，因为有严格的截止日期要遵守。此外，失败的可能性很大，因为可能无法达到预期，或者游戏社区可能会公开批评新游戏的质量。然而，这份工作将允许个人每天开发游戏并让它们变得更好，这是许多人无法做到的。


    ## 技术作家


    人们经常认为一旦个人精通编程语言，他们可以获得的工作只有他们编写代码的工作。这完全不是 true！技术作家并不需要计算机科学的大学学位，但需要某种学位（通常是写作或英语专业）。此外，有抱负的技术作家应该在技术领域有一些先前的经验。至于薪水，技术作家预计每小时可赚约
    33.58 美元，中位年薪约为 70,000 美元。预计工作增长不会像软件开发人员那样飙升，但预计到 2024 年增长 10%，这仍然是一个非常好的入领域！

