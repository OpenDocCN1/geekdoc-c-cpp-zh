- pgno: 74
  md: 'Recall that $g_k$ is defined by the formula


    $$g_k(z) = \frac{1}{(2\pi)^2} \int e^{i\xi\cdot x} \frac{1}{\xi(\xi + k)} \, dm(\xi)$$


    where $z = x_1 + i x_2$, $\xi \cdot x = \xi_1 x_1 + \xi_2 x_2$, $\xi = \xi_1 +
    i \xi_2$, and $\bar{\xi} = \xi_1 - i \xi_2$. By the Hausdorff-Young inequality,
    $g_k \in L^p$ for any $p > 2$. In fact, the estimate


    $$\|g_k\|_p \le C_p |k|^{-2/p}$$


    (see Siltanen [75], Theorem 3.10) holds for any $k \neq 0$. It is important to
    note that


    $$g_k(z) = g_1(kz).$$


    The following large-$x$ asymptotic expansion of $g_1(x)$ is proved in [75], Theorem
    3.11.


    # Lemma A.1. Let $z = x_1 + i x_2$ with $z \neq 0$ and $x_1 > 0$. For any integer
    $N \ge 0$,


    (A.1)

    $$g_1(z) = -\frac{1}{4\pi} \sum_{j=0}^{N} \left[ \frac{j!}{(iz)^{j+1}} - e^{-2
    i x_1} \frac{j!}{(-i \bar{z})^{j+1}} \right] + E_N(z)$$


    where


    (A.2)

    $$|E_N(z)| \le \frac{(N+1)! 2^{(N+1)/2}}{\pi |z|^{N+2}}.$$


    Since $g(-x_1 + i x_2) = \overline{g_1(x_1 + i x_2)}$, similar formulas hold for
    $x_1 < 0$.


    # Remark A.2. Since the error estimate (A.2) does not depend on the condition
    $x_1 > 0$, and since $g_1(z)$ is continuous, we can conclude that the expansion
    (A.1) remains valid for $z \neq 0$ and $\operatorname{Re}(z) = 0$.


    Now consider $g_k(z) = g_1(kz)$. Since $\operatorname{Re}(kz) = \frac{1}{2}(kz
    + \bar{k}\bar{z})$, we immediately obtain:


    # Lemma A.3. Let $z = x_1 + i x_2$ and $k \in \mathbb{C}$. For any integer $N
    \ge 0$, the expansion


    (A.3)

    $$g_k(z) = -\frac{1}{4\pi} \sum_{j=0}^{N} \left[ \frac{j!}{(i k z)^{j+1}} - e^{-i(kz
    + \bar{k}\bar{z})} \frac{j!}{(-i \bar{k}\bar{z})^{j+1}} \right] + E_N(kz)$$


    holds, where


    $$|E_N(kz)| \le C_N |kz|^{-(N+2)}.$$


    # A.2. The Cauchy Transform and the Beurling Operator.


    Following [3], chapter 4, we study the Cauchy transform and the Beurling operator
    through the logarithmic potential associated with Poisson''s equation in two dimensions.
    For $\varphi \in \mathcal{C}_0^\infty(\mathbb{R}^2)$, we may define the logarithmic
    potential


    $$(L\varphi)(z) = \frac{2}{\pi} \int \log|z - z''| \, \varphi(z'') \, dm(z'')$$


    which has the property


    $$\bar{\partial}\bar{\partial}(L\varphi) = \varphi.$$'
