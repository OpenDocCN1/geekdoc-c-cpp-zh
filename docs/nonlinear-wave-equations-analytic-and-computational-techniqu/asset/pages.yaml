    boundary conditions on the gradient of the velocity potential. Note that (18)
    prescribes that the normal derivative of the velocity potential along the free
    surface is given by the function f(x).


    We introduce the operator ℋ(η) such that ℋ(η) maps the normal derivative of φ
    at the free-surface to the tangential derivative of φ at the free-surface. In
    other words,


    ```

    ℋ(η){φ_z - η_x φ_x} = d/dx φ(x, η(x)).

    ```


