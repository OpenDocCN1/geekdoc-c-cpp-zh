    and 4. Shortly after the waves are set in motion, the KdV solution develops high-frequency
    oscillations behind the larger peak that travel left and quickly fill up the computational
    domain with radiation. The solution of the Euler equations remains much smoother.
    The large peak of the KdV solution also travels 3.4% faster, on average, than
    the corresponding peak of the Euler solution, so that at t = 138.399, when the
    taller Euler wave has traversed the domain 6 times, the taller KdV wave has traversed
    it 6.206 times. For our purposes, these discrepancies are much too large for KdV
    to be a useful model, and we conclude that the first example in §4 is well outside
    of the KdV regime.


    In this comparison, timestepping the KdV equation was done with the 8 stage, 5th
    order implicit/explicit Runge-Kutta method of Kennedy and Carpenter [28]. Spatial
    derivatives were computed spectrally using the 36th order filter of Hou and Li
    [25]. We found that 2048 spatial grid points and 96000 timesteps was sufficient
    to reduce the error at t = 138.399 below 5 × 10⁻⁶ near the larger peak and below
    6 × 10⁻⁷ elsewhere, based on comparing the solution to one with 3072 grid points
    and 192000 timesteps. Our solutions of the Euler equations are much more accurate
    since there are no second or third spatial derivative terms present to make the
    equations stiff. Thus, we can use 8th or 15th order explicit timestepping rather
    than 5th order implicit/explicit timestepping. Monitoring energy conservation
    and performing mesh refinement studies suggests that we obtain 13–14 digits of
    accuracy in the solutions of the Euler equations, at which point roundoff error
    prevents further improvement in double-precision arithmetic.


    In Figure 10, we repeat this computation using initial conditions corresponding
    to the superposition of Stokes waves η₀^{B+C}(x), which was used as a starting
    guess for the second example of §4. This time the KdV solution does not develop
    visible high-frequency radiation in the wave troughs, and the solutions of KdV
    and Euler remain close to each other for much longer. However, the interaction
    time for a collision also increases, from T = 138.399 in the first example to
    T = 1108.11 here. In Fig. 10, by t = T/6, the taller KdV and Euler waves have
    visibly separated from each other, and by t = T/2, when the Euler waves have reached
    their minimum approach distance, the KdV solution is well ahead of the Euler solution.
    Thus, while there is good qualitative agreement between the KdV and Euler solutions,'
