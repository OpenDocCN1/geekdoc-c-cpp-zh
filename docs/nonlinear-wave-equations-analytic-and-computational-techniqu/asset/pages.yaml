    we will add h to η and set α = −½ √(g h) instead. In Figure 9, we compare the
    solution of (5.1), with initial condition η(x,0) = η_0^{A+B}(x), defined similarly
    to η_0^{A+C}(x) in (4.1), to the solution of the free-surface Euler equations
