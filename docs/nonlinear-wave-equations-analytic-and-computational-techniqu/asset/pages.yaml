    | Class I (n = 6) | \(\mu = 0, \rho = 0.954\) | 70 | .041305 |

    | Class II (n = 3) | \(\mu = 0, \rho = 0.954\) | 70 | .021491 |

    | Class II (n = 5) | \(\mu = 0, \rho = 0.954\) | 70 | .040446 |


