  md: 'the set of quasi-periodic functions[Boh47]. This leads us to replace (2.5)
    with the more general nonlocal equation


    (3.1) \left\langle\left\langle e^{-i\bar{k}\cdot\mathbf{x}}\left(i(\eta_t - \bar{c}\cdot\nabla\eta)\cosh(\kappa(h+\eta))
    - \frac{\bar{k}\cdot\nabla q}{\kappa}\sinh(\kappa(h+\eta))\right)\right\rangle\right\rangle
    = 0,


    which is valid for all $\bar{k}\in\mathbb{R}_0^2 = \mathbb{R}^2 - \{(0,0)\}$.
    In fact, if we were to consider perturbations of increasingly larger period, the
    set of $\bar{k}$ values to be considered in Equation (2.5) would approach a dense
    subset of the real plane.


    Having generalized the dynamical equations to accommodate the perturbations we
    wish to consider, we briefly discuss the definition of spectral stability. A stationary
    solution of a nonlinear problem is spectrally stable if there are no exponentially
    growing modes of the corresponding linearized problem. To determine the spectral
    stability of the periodic traveling wave solutions, we start by considering a
    one-dimensional traveling wave solution $(\eta_0(x-ct), q_0(x-ct), c)$, which
    solves equation (2.7). In the same traveling coordinate frame, we add a small
    perturbation in both the $x$ and $y$ direction of the form


    $q(x-ct, y, t) = q_0(x-ct) + \epsilon q_1(x-ct, y, t) + \mathcal{O}(\epsilon^2),$

    $\eta(x-ct, y, t) = \eta_0(x-ct) + \epsilon\eta_1(x-ct, y, t) + \mathcal{O}(\epsilon^2),$


    where $\epsilon$ is a small parameter. The perturbation is moving in a traveling
    reference frame with speed $\bar{c} = (c,0)$. Our goal is to determine the time
    dependence of the perturbation in order to determine how the deviation from the
    unperturbed solution evolves.


    We begin with the local equation (2.6). Substituting the above into Equation (2.6)
    and keeping only terms to order $\epsilon$, we obtain


    (3.2) $q_{1,t} - c q_{1,x} + q_{0,x} q_{1,x} + g \eta_1 - f\cdot\left(\eta_{1,t}
    + \eta_{1,x}(q_{0,x} - c) + \eta_{0,x} q_{1,x} - f\cdot\eta_{0,x}\eta_{1,x}\right)
    = 0,$


    where


    $f = \frac{\eta_{0,x}(q_{0,x} - c)}{1 + \eta_{0,x}^2}$


    Since the problem does not depend on $t$ or $y$ explicitly (recall that the functions
    $\eta_0$ and $q_0$ are both independent of $y$ and $t$, and depend only on $x$),
    we can use separation of variables to decompose $\eta_1(x,y,t)$ and $q_1(x,y,t)$
    as


    (3.3a) $\eta_1(x,y,t) = e^{\lambda t} e^{i\rho y} \tilde{\eta}_1(x) + c.c.,$


    (3.3b) $q_1(x,y,t) = e^{\lambda t} e^{i\rho y} \tilde{q}_1(x) + c.c.,$


    without loss of generality. Here $\rho$ is the transverse wave number of the perturbation.
    Substituting into (3.2), we have


    (3.4) $\lambda \tilde{q}_1 - c \tilde{q}_{1,x} + q_{0,x} \tilde{q}_{1,x} + g \tilde{\eta}_1
    - f\cdot\left(\lambda \tilde{\eta}_1 + \tilde{\eta}_{1,x}(q_{0,x} - c) + \eta_{0,x}
    \tilde{q}_{1,x} - \eta_{0,x} f \cdot \tilde{\eta}_{1,x}\right) = 0,$


    which is the same linearization as that obtained in (Ref. [DO]) for the local
    equation with respect to one-dimensional perturbations.


    Now we turn our attention to the nonlocal equation. For the nonlocal equation,
    we substitute the perturbation expansion into (3.1). This gives


    \left\langle\left\langle e^{-i\bar{k}\cdot\mathbf{x}}\left(i\eta_{1,t}\mathcal{C}_{\kappa}
    - i c \eta_{0,x}\kappa\eta_1\mathcal{S}_{\kappa} - i c \eta_{1,x}\mathcal{C}_{\kappa}
    - \frac{1}{\kappa}\left(k_x q_{1,x} + k_y q_{1,y}\right)\mathcal{S}_{\kappa} -
    k_x q_{0,x}\eta_1\mathcal{C}_{\kappa}\right)\right\rangle\right\rangle = 0,$'
