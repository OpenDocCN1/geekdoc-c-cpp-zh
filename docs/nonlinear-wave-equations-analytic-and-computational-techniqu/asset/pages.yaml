  md: '# Semiclassical soliton ensembles for the focusing nonlinear Schrödinger equation:
    Recent developments


    Gregory D. Lyng


    ABSTRACT. We give an overview of the analysis of the semiclassical (zero-dispersion)
    limit of the focusing nonlinear Schrödinger equation via semiclassical soliton
    ensembles, and we describe some recent developments in this direction.


    # 1. Introduction


    # 1.1. The semiclassical limit problem.


    A semiclassical soliton ensemble (SSE) is a particular family of exact, multisoliton
    solutions of the focusing nonlinear Schrödinger (NLS) equation


    (1.1) iε ∂u/∂t + ε²/2 ∂²u/∂x² + |u|²u = 0,  0 < ε ≪ 1.


    Given fixed data


    (1.2) u(x,0) = A₀(x),  x ∈ ℝ;


    where A₀ is an analytic, positive, bell-shaped function which decays rapidly to
    zero as |x| → ∞, the corresponding SSE is generated by adding a distinguished,
    asymptotically negligible (as ε ↓ 0) sequence of perturbations to the data A₀
    and solving the resulting sequence of initial-value problems. These perturbations
    are induced by a formal WKB analysis of the associated spectral problem, and we
    shall denote elements of this family of special solutions, indexed by (a sequence
    of decreasing values of) the real parameter ε > 0, by


    u^(ε)(x, t).


    2010 Mathematics Subject Classification. Primary: 35Q55.


    Figure 3 in this paper is reprinted from Phys. D, 241, no. 21, Long Lee, Gregory
    Lyng, and Irena Vankova, “The Gaussian semiclassical soliton ensemble and numerical
    methods for the focusing nonlinear Schrödinger equation”, 1767–1781, Copyright
    2012, with permission from Elsevier.


    Figure 4 in this paper is reprinted from Phys. Lett A, 377, no. 16–17, Long Lee
    and Gregory D. Lyng, “A second look at the Gaussian semiclassical soliton ensemble
    for the focusing nonlinear Schrödinger equation”, 1179–1188, Copyright 2013, with
    permission from Elsevier.


    Figure 5 in this paper is reprinted with permission from Journal of Mathematical
    Physics, 55, no. 8, Yeongjoh Kim, Long Lee, and Gregory Lyng, “The Wentzel–Kramers–Brillouin
    approximation of semiclassical eigenvalues of the Zakharov–Shabat problem”, Copyright
    2014–2015, AIP Publishing LLC.'
