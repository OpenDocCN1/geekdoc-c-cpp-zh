  md: '# Standing wave


    # Superposition of traveling waves


    ![](img/c92a9d81ba7f671c83a4c600d27389fb_219_0.png)


    FIGURE 18. Comparison of the coefficients in an expansion of the Dirichlet and
    Neumann data in an orthogonalized AFM basis versus a Fourier basis.


    standing wave and traveling waves to around 25 and 30 digits, respectively. The
    black curves give the Fourier modes of the boundary integral solutions, which
    were computed with 212 and 106 bits of precision, respectively. The orange and
    blue curves give the “AFM transform” of the Dirichlet and Neumann data. The observation
    that K cannot be reduced significantly below 2048 for the traveling wave problem
    is seen clearly in the right panel, which shows that \hat{\mathscr{N}}_k does
    not reach roundoff error until just below k = 1024.


    The fact that the AFM coefficients \tilde{\mathscr{D}}_k and \tilde{\mathscr{N}}_k
    decay faster than the Fourier coefficients \hat{\mathscr{D}}_k and \hat{\mathscr{N}}_k
    suggests that the Gram-Schmidt version of the AFM basis is more efficient at representing
    the Dirichlet and Neumann data of many problems of physical interest (such as
    standing and traveling waves) than the Fourier basis. The abrupt change in slope
    of the orange and blue curves in the left panel occurs when the AFM method begins
    to resolve errors in the given Dirichlet data, which is taken to be exact even
    though it only agrees with physical standing waves to 25 digits. While it is interesting
    that the Gram-Schmidt version of the AFM basis is more efficient than a Fourier
    basis for these problems, computing the orthogonal AFM basis is expensive since
    it requires a great deal of additional precision to avoid losing all significant
    digits during the QR factorization process.


    # Conclusions


    We have shown that the Craig-Sulem expansion of the DNO operator, the implicit
    formulation due to Ablowitz, Fokas and Musslimani, and its dual, due to Ablowitz
    and Haut, can all be used to compute spectrally accurate solutions of the Dirichlet-Neumann
    problem. All three methods involve ill-conditioned intermediate calculations when
    the vertical crest-to-trough distance becomes large relative to the inverse of
    the highest-frequency wave numbers involved in a Fourier description of the wave
    profile η(x) and the Dirichlet data \mathscr{D}(x). However, this ill-conditioning
    can be tamed using extended precision arithmetic. Most importantly, η(x) and \mathscr{D}(x)
    need only be specified in double-precision to obtain double-precision results
    for \mathscr{N}(x); extended precision is only required in intermediate calculations.
    While it is undesirable to work in extended precision arithmetic, a spectrally
    accurate method requiring 64 digits of accuracy in intermediate calculations may
    require'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'less work than a more traditional 16-digit calculation using a 2nd or 4th order
    method if high accuracy is desired.


    Nevertheless, our goal in writing the paper was not to advocate the use of these
    methods, but to explore their limits of applicability. We originally thought that
    the AFM and AFM* would break down if the potential φ cannot be extended analytically
    to a strip containing the peak of the wave profile. This was the motivation for
    studying a potential φ with poles on the real axis and a wave profile that dips
    below the poles but also extends above them. It is surprising that the AFM basis
    can still be used to approximate 𝒟 in this case to arbitrary accuracy, and that
    the term-by-term Neumann data turns out to be a good approximation of the correct
    solution. We also did not expect the CS expansion to converge for realistic large-amplitude
    standing waves, but it was able to achieve 25 digits of accuracy at 150th order.
    For the same problem, the AFM and AFM* methods achieved 25 digits of accuracy
    in spite of singular values dropping below 10⁻¹⁰⁰. For waves in shallow water,
    the condition numbers are much more reasonable, making the AFM methods more appealing.


    As noted in [23], the CS expansion suffers from significant cancellations requirements.
    Our numerical investigations confirm this behavior. We note that a suitable rearrangement
    of the series permits one to account for some of these cancellations, though not
    all. One of the goals of the present work was to understand whether this behavior
    is present in the AFM formulation and to what extent as the AFM method may be
    interpreted as a certain summation of the CS expansion [2]. Our investigations
    reveal the AFM method is similarly ill-conditioned. Indeed the rapid decay of
    singular values in the AFM (and AFM*) method mirrors the cancellation properties
    observed in the CS expansion. Given the delicate nature of CS, AFM and AFM* we
    recommend the BIM, especially for two-dimensional flows. The TFE version of the
    CS expansion also performs remarkably well without the need for extended precision
    arithmetic in intermediate calculations.


    Regarding extension to three dimensions, the CS and TFE expansions work with little
    change. Since the latter can be run effectively in double-precision, it is a viable
    method. Although the bulk fluid must be discretized, the system of equations that
    must be solved decouples into many one-dimensional boundary value problems rather
    than a large system of equations such as arise in finite element methods. The
    AFM and AFM* methods will lead to large, highly ill-conditioned linear systems
    that are easy to set up but nearly impossible to solve. Performing the SVD or
    QR factorization of such a large matrix in extended precision arithmetic would
    be extremely costly, and iterative methods such as GMRES will not converge when
    the condition number grows to 10¹⁵ or higher. By contrast, the boundary integral
    method yields condition numbers close to 1; hence, GMRES converges in just a few
    iterations. Although it is difficult to implement boundary integral methods in
    three dimensions due to the slowly decaying lattice sums involved, techniques
    such as Ewald summation [3,13,18] are available to accelerate convergence.


