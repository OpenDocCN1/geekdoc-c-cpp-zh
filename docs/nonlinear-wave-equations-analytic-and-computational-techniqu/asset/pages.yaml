- pgno: 84
  md: 'If we consider real solutions $u(x, y, t)$ and let $f(x, y, t) = v(x, y, t)
    + i\,w(x, y, t)$, the NV equation has an equivalent representation in $(x, y)$-space:


    (1.2) $4\,u_t = -u_{xxx} + 3\,u_{xyy} + 3\,(uv)_x + 3\,(uw)_y$, (1.3) $u_x = v_x
    - w_y$, (1.4) $u_y = -w_x - v_y$.


    This formulation is used throughout the paper since it is useful both for the
    numerics and the stability analysis. If the functions $u, v$ and $w$ are not dependent
    on $y$, the NV equation reduces to a KdV-type equation


    (1.5) $4\,u_t + u_{xxx} - 6\,u\,u_x = 0, \quad u = v, \quad w = 0$


    and admits soliton solutions of the form


    (1.6) $u(x, y, t) = -2\,c\,\operatorname{sech}^2(\sqrt{c}(x - c t))$, (1.7) $v(x,
    y, t) = -2\,c\,\operatorname{sech}^2(\sqrt{c}(x - c t))$, (1.8) $w(x, y, t) =
    0.$


    To facilitate the investigation of the qualitative nature of solutions to the
    NV equation, we present a version of a semi-implicit pseudo-spectral numerical
    scheme introduced by Feng et al [13] that solves the Cauchy problem for the NV
    equation. The method introduced by Feng et al was developed to compute solutions
    of 2-D nonlinear wave equations. It was used in [2] to compute evolutions of the
    modified KP equation with initial conditions chosen to be perturbed solitons.
    We have adapted it to solve systems of equations. We show that this method preserves
    the $L_2$ norm for the KdV type equation (1.5) and is considerably faster and
    requires less computer memory allocation than the finite difference scheme introduced
    in [26] for the solution of the Cauchy problem. The spectral method can be used
    to compute evolutions for a wide variety of initial conditions. Here, we take
    traveling wave solutions with small transverse perturbations as initial conditions
    in the Cauchy problem and compute their numerical evolution to study the nature
    of the instability that is proved in Section 4. The reader is referred to [8,
    22, 23] for other examples of the use of spectral methods in soliton PDE''s.


    The problem of transverse stability of traveling wave solutions has been studied
    for many of the classic soliton equations including the KP equation [2, 4, 7,
    19], the Boussinesq equation [4], the ZK equation [3, 14, 16, 17], and most notably,
    the KdV equation [20]. For the NV equation, we carry out a linear stability analysis
    by considering sinusoidal perturbations with wavefront perpendicular to the direction
    of propagation. In order to draw conclusions about the instability of soliton
    solutions, as well as approximate the growth rate, we apply the K-expansion method
    developed by Rowlands and Infeld. See [18] for an exposition of the method, [3]
    for an application of the method to the linearized Z-K equation, and [6] for an
    application in a soliton system modeling small amplitude long waves traveling
    over the surface of thin current-carrying metal film. The K-expansion method is
    based on the assumption that the nonlinear wave experiences a long-wavelength
    perturbation as well as a periodic change in wavelength [18].


    In [4], the authors state the following conjecture:"It is interesting to speculate
    that when the expansion method introduced by Allen and Rowlands [3] is applied
    to any integrable system it will reveal that self similarity of the eigenfunctions
    will appear at each order, enabling one to write down the form of the exact solution.'
