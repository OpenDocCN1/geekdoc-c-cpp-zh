    The operator $\mathcal{H}(\eta)\{f\}$ may either be numerically determined from
    the above expression or expressed as a Taylor series expansion about $\eta = 0$
    (see [9, 13] for more details). Alternately, one may use standard solvers for
    Laplace’s equation to determine $\mathcal{H}(\eta)\{f\}$. Here we briefly outline
    the Taylor series of the operator expanded about the zero-amplitude solution $\eta
    = 0$.


    To determine a Taylor series expression for $\mathcal{H}(\eta, D)$, we assume
    that $\mathcal{H}(\eta, D)$ has a series representation in $\eta$ of the form


    \(\mathcal{H}(\eta, D)\{f\} = \sum_{j=0}^{\infty} \mathcal{H}_j(\eta, D)\{f\},\)


    where each $\mathcal{H}_j(\eta, D)$ is homogeneous of order $j$ in $\eta$, i.e.
    $\mathcal{H}_j(\lambda \eta, D) = \lambda^j \mathcal{H}_j(\eta, D)$. A calculation
    similar to the one presented in [2] allows us to determine the following recursive
    relationship for $\mathcal{H}_j(\eta, D)$ in terms of lower-order terms:


    (21) \(\int_{0}^{2\pi} e^{-ikx} \mathcal{H}_j(\eta, D)\{f\} dx = i \int_{0}^{2\pi}
    e^{-ikx} \frac{(k\eta)^j}{j!} \left[ \begin{array}{c} \coth(kh); \quad j \text{
