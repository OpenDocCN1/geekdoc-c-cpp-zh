  md: 'we only consider the stability of one-dimensional solutions, we reduce the
    equations of motion by eliminating the y-dependence in (2.5) and (2.6) to determine
    the traveling wave solutions moving in the x-direction with speed c. In Ref. [DO],
    we demonstrated that periodic one-dimensional traveling wave solutions are solutions
    of


    (2.7) $$\int_{0}^{L} e^{-ikx} \sqrt{(1+\eta_x^2)(c^2-2g\eta)}\sinh\left(k(\eta+h)\right)dx
    = 0,$$


    ∀ k ∈ \frac{2π}{L}\mathbb{Z}_0, for the surface elevation η(x). This equation
    provides solutions to the fully nonlinear problem, and is easily solved numerically.
    To determine the velocity potential q(x) at the surface (which is needed when
    examining the stability of traveling waves), we use the relationship


    (2.8) $$q_x = c \pm \sqrt{(1+\eta_x^2)\left(c^2-2g\eta\right)}.$$


    where we work with the negative sign in order to enforce that u − c < 0 within
    the fluid bulk as well as along the free surface for all but the limiting wave.
    One-dimensional solutions are computed using an iterative pseudo-continuation
    approach as outlined in Ref. [DO]. All solutions were calculated using at least
    64 Fourier Modes and a residual error < 10^{−14}.


    # 3. Stability Formulation


    Before we proceed to investigate the stability of the traveling wave profiles,
    we discuss what perturbations we wish to allow. In this paper, we plan to investigate
    the effects of two-dimensional perturbations. It may appear natural to consider
    disturbances of the same period as the underlying stationary wave in the x direction,
    and vary the period of the perturbation in the y direction. However, we wish to
    work with a more general class of disturbances, namely those that are bounded
    on the whole real plane. Specifically, for some disturbance U(x, y), we use the
    notation ||U(x, y)|| < ∞ to mean that sup_{ℝ²} |U(x, y)| < ∞ and that U(x, y)
    is continuous for all (x, y) ∈ ℝ². It is important to realize that this class
    is the largest class of perturbations allowed by the physical problem at hand.
    Indeed, disturbances should be bounded and continuous functions, but there is
    no physical reason to restrict their spatial dependence to be periodic.


    In order to investigate the stability of the traveling wave profiles with respect
    to such perturbations, it is necessary to reformulate the governing equations.
    Equation (2.6) is a local statement and does not require modification. However,
    the current incarnation of the nonlocal equation (2.5) applies specifically to
    waves of period L₁ in the x-direction and L₂ in the y-direction. Let ⟨⟨f⟩⟩ represent
    the average value of a function f(x), f : ℝ² → ℝ by


    $$\langle\langle f\rangle\rangle = \lim_{|A|\to\infty} \frac{1}{|A|} \iint_A f(x,y)
    dA,$$


    where A is a rectangle in ℝ² and |A| denotes its area.


    It is clear that if f(x, y) is periodic in both x and y with period L₁ and L₂
    respectively, then ⟨⟨f⟩⟩ is well defined. However, this two-dimensional spatial
    average is defined for the larger class of so-called almost-periodic functions,
    which contains'
