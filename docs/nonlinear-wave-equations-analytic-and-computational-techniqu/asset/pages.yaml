    # 5. Looking ahead


    In this final section, we briefly indicate a handful of possible directions for
    future research building on this work with SSEs.


    # 5.1. Estimates.


    A natural place to start would be to attempt to establish rigorous estimates for
    the deviation of the true eigenvalues associated with Klaus–Shaw data A0 from
    their WKB approximations given by (2.5). Assuming one could accomplish this, the
    next step would be to incorporate the resulting control over the eigenvalues into
    the overall asymptotic analysis. One immediate question that arises is due to
    the fact that the initial step in the analytic framework of [16] is a coordinate
    change which exchanges a meromorphic RHP for a sectionally holomorphic one. This
    coordinate change is based on exact knowledge of the locations of the poles (eigenvalue
    locations). But, if these are known only approximately, the entire process is
    stymied at the first step. However, assuming these challenges can be overcome,
    the result would be the development of a rigorous theory for semiclassical dynamics
    for an entire family of suitable Klaus–Shaw data. This would be a great extension
    of the current state of the art. Indeed, the corresponding problem for general
    data with nontrivial phase, as in (1.3), remains almost entirely open.


    # 5.2. Higher caustics.


    As discussed in §3.3, relatively little is known about the higher caustics (those
    nonlinear caustic curves that occur—or do not occur as the case may be—after the
    primary caustic). The results of Lyng & Miller suggests that the mathematical
    mechanisms for these features of the semiclassical dynamics may differ from caustic
    to caustic due to the introduction of new variational inequalities. In fact, we
    do not know the answers to seemingly basic questions, like the following.


    +   - How many caustics are there? Infinitely many?

    +   - Can their locations be predicted?

    +   - Under what circumstances can we compute the long-time limit?


    ![](img/c92a9d81ba7f671c83a4c600d27389fb_117_0.png)


    ![](img/c92a9d81ba7f671c83a4c600d27389fb_117_1.png)'
