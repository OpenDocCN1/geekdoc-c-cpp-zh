    in the following section, where it will be used to compute G(η)𝒟 in a case where
    the solution is known.


    # 3.2. Examples illustrating success and failure of the AFM method.


    In this section we present examples which show that even for band-limited wave
    profiles η of arbitrarily small amplitude, the system (2.5-2.6), with the sums
    interpreted as infinite series, may fail to produce the Neumann data for Dirichlet
    data of a certain class, which includes real analytic functions, regardless of
    how many digits of arithmetic are used in the computation.


    Both AFM and AFM* methods involve linear operators acting on the unknown Neumann
    data. In this section, we study the singular value decomposition (SVD) of truncations
    of these linear operators. By over-sampling the columns, we obtain better approximations
    of the SVD of the underlying quasi-matrices A and B in (2.7), whose columns are
    continuous functions. This leads to regularized versions of the AFM/AFM* methods,
    the simplest version (with no pseudo-inverse cutoff) being equivalent to performing
    a Gram-Schmidt orthogonalization of the basis functions e^{ikx} cosh(k(η(x)+h))
    before attempting to represent 𝒟(x) or 𝒩(x) using these functions. The regularized
    approach enables these methods to be used even if no series of the form (2.5)
    exists for 𝒟(x).


    We now construct a function 𝒟(x) for which no such series exists. Consider the
    function


    ```

    (3.23) φ(x, y) = 1/2 Im { cot( (x + i y)/2 ) − cot( (x + i y + 2 i h)/2 ) }

    ```


    which is 2π-periodic in x and harmonic for all x, y outside of the set (2πℤ) ×
    {0, −2h}. Further, φ(x, −h − y) = φ(x, −h + y) and hence φ_y(x, −h) = 0 for all
    x.'
