  md: 'From this simple computation and Theorem 3.11, we can derive an equation of
    motion for the NCGO solutions, and recover (2.19) and (2.20) from a careful calculation
    of asymptotics. Later, we will show by explicit construction that, if q0 is a
    smooth function of conductivity type, then there is a solution q(z,τ) of the NV
    equation so that q(z,τ) is smooth and of conductivity type for each τ.


    # Lemma 3.12. Suppose that q(z,τ) is a solution of the NV equation where, for
    each τ, q(z,τ) is a smooth function of conductivity type. Let u = \overline{∂}^{-1}∂q.
    Then


    ```

    (3.23)      \dot{μ} = i k^3 μ + (∂ + i k)^3 μ + \overline{∂}^3 μ - \frac{3}{4}
    u (∂ + i k) μ - \frac{3}{4} u \overline{∂} μ

    ```


    Proof. Before giving the proof we make several remarks. Since ψ = e^{i k z} μ,
    the evolution equation (3.23) is equivalent to


    ```

    (3.24)      ψ_τ = i k^3 ψ + ∂^3 ψ + \overline{∂}^3 ψ - \frac{3}{4} (u ∂ + \overline{u}
    \overline{∂}) ψ.

    ```


    Next, let φ(z,k,τ) = e^{i S} μ(z,k,τ) with S(z,k,τ) = k z - k^3 t. From the argument
    above we have


    ```

    L(τ) [\dot{φ}(τ) - A(τ) φ(τ)] = 0.

    ```


    To conclude that \dot{φ}(τ) = A(τ) φ(τ), we must show that


    ```

    \lim_{|z|→\infty} (e^{-i k z} [\dot{φ}(τ) - A(τ) φ(τ)]) = 0.

    ```


    Write


    ```

    f ∼_k g

    ```


    if


    ```

    \lim_{|z|→\infty} [e^{-i k z} (f - g)] = 0

    ```


    Noting that μ - 1 and its derivatives in z and \overline{z} vanish as |z| → ∞,
    a simple calculation shows that


    ```

    \dot{φ} - A φ ∼_k e^{i S} \left( -i k^3 μ - (∂ + i k)^3 μ \right) ∼_k 0

    ```


    Hence \dot{φ} = A φ from which (3.24) follows.


    Hence:


    # Lemma 3.13. Suppose that q(z,τ) is a solution of the NV equation where, for
    each τ, q(z,τ) is a smooth function of conductivity type. Let μ(z,k,τ) be the
    corresponding NCGO solution with


    ```

    (3.25)      μ(z,k,τ) ∼ 1 + \frac{1}{4π i k z} s(k,t) - \frac{e_{-k}(z)}{4π i k
    \overline{z}} t(k,t) + O(|z|^{-2}).

    ```


    Then


    ```

    (3.26)      \dot{s}(k,t) = 0,

    ```


    ```

    (3.27)      \dot{t}(k,t) = i \left( k^3 + \overline{k}^3 \right) t(k,t).

    ```'
