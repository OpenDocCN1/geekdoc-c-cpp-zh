    hand, numerical experiments such as the ring soliton, Example 4.3, and analytical
    solutions such as those produced by Taimanov and Tsarev [85–88] strongly suggest
    that supercritical initial data lead to solutions of NV that blow up in finite
    time. It would be very interesting to obtain a rigorous proof that this is the
    case, and to analyze the nature of the blow-ups by inverse scattering methods.


    # Appendix A. Some Useful Analysis


    In the direct scattering problem at zero energy, Faddeev’s Green’s function plays
    a critical role in elucidating properties of the CGO solutions that define the
    scattering transform. Recall that the normalized CGO solutions solve the equation


    ```

    ∂̄(∂ + i k) μ = (1/4) q μ

    ```


    and that Faddeev’s Green’s function is Green’s function for the operator ∂̄(∂
    + i k). On the other hand, the solid Cauchy transform is an inverse for the ∂̄
    operator with range in L^p functions for p > 2, and hence is a fundamental tool
    for solving the ∂̄ problem that defines the inverse scattering transform. Finally,
    the Beurling transform is an integral operator which gives a meaning to the operator
    ∂̄⁻¹ ∂ that occurs in the definition of the nonlinearity in the NV equation. Here
    we collect some useful properties of these transforms and some essential estimates.


    # A.1. Faddeev’s Green’s Function at Zero Energy.


    We recall some key facts about Faddeev’s Green’s function g_k. We refer the reader
    to Siltanen’s thesis [75] for details and references to the literature.'
