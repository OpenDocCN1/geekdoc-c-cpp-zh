  md: 'written in terms of the hyperbolic tangent function. Moreover, the hyperbolic
    tangent function is a solution to the Riccati equation, φ'' = l₀ + φ², for l₀
    < 0 for certain initial conditions. The ubiquity of the hyperbolic functions as
    traveling wave solutions naturally leads to the idea of expansion methods for
    solving soliton equations.


    Solutions in the literature to the NV equation include the solutions from the
    inverse scattering transform [44–46, 64], the classic hyperbolic secant and cnoidal
    solutions [60], and rational solutions derived using Darboux transformations that
    lead to finite time blow-up (see [88] and references therein). In this section
    we present new solutions to the NV equation using Hirota''s bilinear method and
    the Extended Mapping Approach (EMA). New multiple traveling wave solutions using
    the Modified Extended Tanh-Function Method can be found in [14]. This approach
    results in closed-form solutions, most of which contain singularities. We note
    that the solutions found by Hirota''s method are plane-wave solutions, that is,
    KdV-type solutions, while the EMA-derived solutions are not.


    # 4.2.1. Hirota''s Method.


    Following the pioneering work of Hirota [31], multisoliton solutions can be derived
    using Hirota''s bilinear method. This method yields multisoliton solutions as
    a sum of polynomials of exponentials and was used in [94] to find multisoliton
    solutions to the Nizhnik-Novikov-Veselov equation


    ```

    q̇ = −a qₓₓₓ + b qᵧᵧᵧ − 3a(q u₁)ₓ − 3b(q u₂)ᵧ

    qₓ = (u₁)ᵧ

    qᵧ = (u₂)ₓ

    ```


    The main idea is to reduce the nonlinear equation to a bilinear form through a
    transformation involving the logarithmic function. To express the wave velocity
    c in terms of the dispersive coefficients, assume u is a plane wave solution with
    k₁ = k₂ = k, u = e^{k x + k y − c t}, and substitute u into (2.1). This results
    in c = −k³/2. Under the transformations q = R(ln(f))ₓₓ, v = R(ln(f))ₓᵧ, and w
    = R(ln(f))ᵧᵧ where f(x, y, t) = 1 + C e^{k x + k y + k³/2 t} and C is an arbitrary
    constant, one can algebraically solve for R to find a bilinear form (one finds
    R = 2). This method results in the soliton solution


    ```

    (4.5) q(x, y, t) = u₁(x, y, t) = u₂(x, y, t) = \frac{2 C k² e^{k (2 x + 2 y +
    k² t)/2}}{\left(1 + e^{k (2 x + 2 y + k² t)/2}\right)²}.

    ```


    Choosing


    ```

    f(x, y, t) = 1 + e^{θ₁} + e^{θ₂} + a₁₂ e^{θ₁ + θ₂},

    ```


