    \ - π/6),\n```\n\n```\n(3.17)      Example 2:      f(x) = sinh(1) / (cosh(1) -\
    \ cos(x)),\n```\n\n```\n(3.18)      Example 3:      f(x) = Σ_k exp( -3/2 |k|^{2/3}\
    \ ) e^{i k x},\n```\n\nwhich are band-limited, real-analytic, and C^∞, respectively.\
