  md: "![](img/c92a9d81ba7f671c83a4c600d27389fb_87_0.png)\n\nFIGURE 1. Speed profile\
    \ for planar solutions of the Novikov–Veselov equation\n\n+   - Replacing s by\
    \ s + k₁ t (with k₁ = 3β/4 − k₂ 3κ/2) corresponds to observing the KdV solution\
    \ in a moving frame, where the frame moves with velocity −k₁.\n\n# 3. A Pseudo-Spectral\
    \ method for the solution of (2+1) nonlinear wave equations\n\nTo numerically\
    \ solve (1.2)–(1.4) we use a semi-implicit leap-frog spectral method based on\
    \ the method in [13]. We restrict ourselves to a finite spatial domain Ω = [0,Wₓ]\
    \ × [0,Wᵧ] with periodic boundary conditions. Thus we work on a torus topology\
    \ and for the numerical results we have to observe the traveling waves across\
    \ the boundary. We must also choose the domain large enough for the problem at\
    \ hand.\n\nThis method uses the Fast Fourier Transform (FFT) to compute the spatial\
    \ evolution and a leapfrog scheme to compute the time-stepping. The numerical\
    \ scheme can be summarized as follows:\n\nThe Fourier transform of (1.2)–(1.4)\
    \ is\n\n(3.1) 4 ûₜ = i (ξ³ − 3 ξ η²) û + 3 i ξ ℱ[(uv)] + 3 i η ℱ[(uw)],\n(3.2)\
    \ ξ û = ξ v̂ − η ŵ,\n(3.3) η û = −η v̂ − ν ŵ.\n\nAs usual, û refers to the Fourier\
    \ transform ℱ of u and is given by\n\nûₚ,ₙ = ℱ[uₗ,ₘ] = Σₗ₌₀ᴸ⁻¹ Σₘ₌₀ᴹ⁻¹ uₗ,ₘ e⁻ⁱ(ξₚ\
    \ xₗ + ηₙ yₘ),\n uₗ,ₘ = ℱ⁻¹[ûₚ,ₙ] = 1/(L M) Σₚ₌₋L/2ᴸ/²⁻¹ Σₙ₌₋M/2ᴹ/²⁻¹ ûₚ,ₙ eⁱ(ξₚ\
    \ xₗ + ηₙ yₘ).\n\nThe parameters L and M are the number of grid points in [0,Wₓ]\
    \ × [0,Wᵧ], respectively. They need to be powers of two in order to use the standard\
    \ FFT. The spatial grid is defined by (xₗ,yₘ) = (lΔx,mΔy) where l = 0,…,L−1, and"
