- pgno: 169
  md: '# Relationships between the pressure and the free surface independent of the
    wave-speed


    Katie Oliveras and Vishal Vasan


    ABSTRACT. The focus of this paper is the derivation of a direct relationship between
    the surface of an inviscid traveling gravity-wave in two dimensions, and the pressure
    at any point in the fluid. We obtain this relationship without approximation and
    without knowledge of the traveling-wave speed. Using this relationship, we numerically
    generate the pressure at arbitrary depths beneath a traveling wave. We also demonstrate
    that this relationship can be used to determine the correct surface profile from
    pressure measurements inside the fluid domain.


    # 1. Introduction


    In field experiments, the surface elevation is often determined indirectly by
    measuring the pressure along the bottom of the fluid. Using this data, one reconstructs
    the surface elevation employing the classical relationship between the pressure
    p(x), constant depth of the fluid h, and the elevation of the surface from a zero-average
    state η(x) given by


    ```

    (1) p = ρg(h + η),

    ```


    where ρ is density, and g is the acceleration due to gravity. This relationship
    is obtained by linearizing the equations of fluid motion about the trivial solution
    i.e. a flat free surface with no fluid motion. While this simplified relationship
    is accurate on some scales, this model (which we will refer to as the linear model)
    fails to reconstruct the surface elevation accurately under the conditions of
    most interest: nonlinear waves. As discussed in [3] and demonstrated in [14],
    for waves in shallow-water, errors in the relationship between p and η given by
    (1) can easily exceed 20% in terms of the peak amplitude. Thus we must consider
    nonlinear corrections to equation (1).


    Recently several nonlinear relationships between the surface elevation profile
    of a water wave, η(x), and the pressure at the bottom of a fluid (p(x, −h)) have
    been discovered [4, 6, 7, 11, 14]. While these new models are a significant improvement
    over the linear theory, they do require that the pressure be measured at the bottom
    of the fluid domain and preclude any direct relationship between the pressure
    in the bulk of the fluid, and the free-surface. Recently, in [20], the authors
    proposed a'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'method to relate the free surface η with the pressure at any point (x, z) inside
    the fluid domain for a traveling wave with constant vorticity γ. The method proposed
    is equally valid in the irrotational case. Further, the relationship between the
    pressure and the free surface may be inverted for the irrotational case (γ = 0)
    to reconstruct the surface elevation profile given the fluid pressure at some
    vertical height within the fluid [14].


    Even the fully nonlinear relationships given in [4, 14] between the pressure in
    the fluid bulk and the free surface suffers from the same limitation that other
    models suffer from; they all require knowledge of the wave-speed c (or equivalently,
    the Bernoulli constant). In practice, this is a difficult quantity to measure.
    If one were to attempt to measure the wave-speed in field experiments, an array
    of sensors all directly aligned in the direction of the waves propagation would
    be needed.


    For certain physical regimes, knowledge of the wave-speed c is not an absolute
    prerequisite for relating p and η. Evidently, relation (1) states reconstruction
    is possible without the wave-speed for linear waves. As shown in [14] certain
    nonlinear corrections do not depend on the wave-speed and can provide remarkably
    accurate surface-profile reconstructions. Additionally, in the shallow water regime,
    the wave-speed is well approximated by the quantity √g h̄ and is sufficient to
    reconstruct the wave profile from pressure measurements [11,14]. However, as the
    nonlinearity of the wave-profile is increased, these approximations introduce
    error into the reconstruction even in shallow water. If the speed c is eliminated
    from the relationship, then such approximations (i.e. c = √g h̄) would not be
    needed. Thus, errors in the wave-speed would not results in errors for the reconstruction
    of highly nonlinear waves.


    Demonstrating that the wave-speed c could be completely removed from the relationship
    between p and η would yield an interesting improvement on current formulae. Here,
    we demonstrate that this is possible. The new formulation obtained does not yield
    the most efficient reconstruction method in practice (especially when compared
    to the heuristic formulation as given in [14]). However, it does explain the lack
    of sensitivity to the wave-speed c as seen in previous numerical results [11,14].
    In addition to eliminating the wave-speed c, we furthermore demonstrate that it
    is indeed possible to find a relationship between the pressure p at any point
    inside the fluid bulk and the free-surface η that does not involve the wave-speed
    c.


    The content of this paper is outlined as follows. In Section 2, we present the
    relevant equations of fluid motion for an incompressible, irrotational inviscid
    water-wave. In Section 3, the relationship between the pressure at any point in
    the fluid is derived. This follows directly from the work in [20] and yields an
    implicit relationship between η and p that depends on the wave-speed c. In the
    following section, we show the wave-speed may be eliminated by employing an operator
    that maps the normal derivative to the tangential derivative. Finally in Section
    5, we present numerical reconstructions of the free surface using pressure measurements
    made internal to the fluid domain.


    # 2. Equations of motion


    We begin by considering the Euler equations for a traveling wave in an ideal,
    irrotational two-dimensional fluid. The one-dimensional surface profile moves
    with'
  merge: -1
