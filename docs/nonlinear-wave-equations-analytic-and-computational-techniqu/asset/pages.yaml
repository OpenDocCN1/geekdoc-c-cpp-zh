- pgno: 41
  md: 'This boundary value problem is equivalent, under the change of variables $u
    = \sigma^{-1/2}\psi$, to the Schrödinger problem


    $\Delta \psi - q\psi = 0$


    where $q = \sigma^{-1/2}\Delta\left(\sigma^{1/2}\right)$. A potential of this
    form for strictly positive $\sigma \in L^{\infty}$ (and some additional regularity)
    is called a *potential of conductivity type*. More precisely, the class of potentials
    originally studied by Nachman [58] is as follows. We denote by $L^{p}_{\rho}(\mathbb{R}^{2})$
    the space of measurable functions with norm $\|f\|_{L^{p}_{\rho}} = \|\langle
    x\rangle^{\rho} f\|_{p}$.


    # DEFINITION 1.3. Let $p \in (1,2)$ and $\rho > 1$. A real-valued measurable function
    $q \in L^{p}_{\rho}(\mathbb{R}^{2})$ is a potential of conductivity type if there
    is a function $\sigma \in L^{\infty}(\mathbb{R}^{2})$ with $\sigma(x) \geq c_{0}
    > 0$ so that $q = (\Delta(\sigma^{1/2}))/(\sigma^{1/2})$ in the sense of distribution
    derivatives.


    A real-valued potential in $L^{p}_{\rho}(\mathbb{R}^{2})$ is of conductivity type
    if and only if it is critical: the bounded, positive solution to $\Delta \psi
    - q\psi = 0$ is exactly $\psi = \sigma^{1/2}$.


    As shown by Murata [52,53], critical potentials are very unstable: if $w \in \mathcal{C}_{0}^{\infty}(\mathbb{C})$
    is a nonnegative bump function, and $q_{0}$ is a critical potential, the potential
    $q_{\lambda} = q_{0} + \lambda w$ is supercritical for any $\lambda < 0$. This
    means that the set of critical potentials is nowhere dense in any reasonable function
    space! Music, Siltanen, and Perry [56] studied the behavior of the scattering
    transform for families of this type when $q_{0}$ and $w$ are both smooth, compactly
    supported, and radial. The corresponding scattering transforms are mildly singular
    for subcritical potentials, regular for critical potentials, and have circles
    of singularities for supercritical potentials.


    The NV equation may be solved by inverse scattering for subcritical and critical
    potentials, but it is not yet clear how to construct a solution by inverse scattering
    for supercritical potentials.


    In this article, we will focus primarily on the Novikov-Veselov equation at zero
    energy. We will report on recent progress on both the theoretical and the numerical
    analysis of this equation, and pose a number of open problems. In section 2 we
    review the history of the inverse scattering method, the dispersion relation,
    symmetries and scaling properties, and conservation laws for the NV equation.
    In section 3, we give an exposition of the inverse scattering method for the NV
    equation at zero energy from the point of view of the Manakov triple representation,
    treating with full mathematical rigor the case of “smooth potentials of conductivity
    type” (see Definition 3.2). We discuss the numerical implementation of the maps
    $\mathcal{T}$ and $\mathcal{Q}$ in sections 3.2 and 3.3, respectively. In section
    4, we discuss special closed-form solutions of the NV equation including ring
    solitons and breathers. In section 5, the computational inverse scattering method
    is used to study zero-energy exceptional points and the relationship between supercritical,
    critical, and subcritical potentials. Finally, in section 6, we discuss open problems.
    In an appendix, we collect some useful tools for the mathematical analysis of
    the direct and inverse scattering maps.


    *Notation.* In what follows, we use the variable $t$ to denote time except when
    discussing the solution of NV via the inverse scattering method. In this case,
    $\tau$ denotes time in order to distinguish $t$ from $\mathbf{t}$, the scattering
    transform.'
