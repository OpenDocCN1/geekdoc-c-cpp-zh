  md: '# 3. Relationship between pressure and the free surface


    In order to relate the pressure at any point inside the fluid to the free-surface
    η, we first express the Bernoulli condition at z = η in terms of surface variables
    alone. Let q(x) = φ(x, η(x)) represent the velocity potential at the surface.
    Equations (4) and (5) can be combined to obtain


    ```

    (7)      -c q_x + 1/2 q_x^2 + g η - 1/2 (η_x (q_x - c))^2 / (1 + η_x^2) = 0.

    ```


    As shown in [10], (7) can be solved explicitly for q_x to find


    ```

    (8)      q_x - c = -√(c^2 - 2g η) (1 + η_x^2),

    ```


    where we have chosen the negative square root to preserve φ_x - c ≤ 0 throughout
    the fluid and at the free surface.


    # 3.1. Interior to the fluid domain.


    In order to obtain the pressure at any point in the fluid in terms of the free
    surface, we need to determine how φ_x(x, z) and φ_z(x, z), the fluid velocities
    at any point in the fluid domain, depend on the free surface η. We achieve this
    by employing Green’s Theorem in a manner similar to that in [19,20]. We note that
    for irrotational traveling waves, it is possible to extend the fluid domain to
    a rectangle of the form (x, z) ∈ [0, 2π] × [−h, max(η)]. As noted by [4] pg 468,
    this is possible due to the specific decay rate of the Fourier coefficients of
    the traveling wave profile [15].


    Having established the extended harmonic domain we proceed to derive a relation
    for the fluid velocities at any point in the fluid domain. For this we adapt the
    procedure in [1,19] and consider a function E which is given by


    ```

    E = e^{-i k x + l z}.

    ```


    For l = ±k, E is a harmonic function of x and z. It is then straightforward to
    show


    ```

    (9)      (φ_x E_z + φ_z E_x)_x + (-φ_x E_x + φ_z E_z)_z = 0,

    ```


    which can easily be verified by expanding the terms in parentheses [1]. As the
    above equation is identically zero throughout the fluid domain and since our goal
    is to relate information at some depth z = z0 with the free surface at z = η,
    we choose to integrate (9) over the domain (x, z) ∈ [0, 2π] × [z0, η(x)]. Figure
    2 (a)-(b) depicts two possible domains over which we may integrate (9). Hence
    we obtain


    ```

    (10)     ∫_0^{2π} ∫_{z0}^{η(x)} (φ_x E_z + φ_z E_x)_x - (φ_x E_x - φ_z E_z)_z
    dz dx = 0,

    ```


    which is an integral in divergence form. Employing Green’s Theorem in the plane,
    equation (10) becomes


    ```

    (11)     ∫_{∂D} (E (-i k φ_x - l φ_z)) dx + (E (l φ_x - i k φ_z)) dz = 0.

    ```


    If we restrict k to ℤ\{0}, the integral contributions from x = 0 and x = 2π cancel
    by periodicity. Thus we find the relationship given by'
