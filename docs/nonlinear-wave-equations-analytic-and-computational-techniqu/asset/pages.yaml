    K±.


    For later convenience, we write (1.3) in the form


    (2.1) ∂X/∂x (x, k) = A±(k)X(x, k) + (Q(x) − Q±)X(x, k),


    where


    (2.2) A±(k) = −ikσ3 + Q± = ( −ik  q± ; q±*  ik ),   Q± = ( 0  q± ; q±*  0 ).


    Then (1.3) and (2.1) can also be written in the equivalent form


    (2.3) ∂X/∂x (x, k) = A(x, k)X(x, k) + (Q(x) − Qf(x))X(x, k),


    where,


    (2.4) A(x, k) = θ(x)A+(k) + θ(−x)A−(k),   Qf(x) = θ(x)Q+ + θ(−x)Q−,


    and θ(x) denotes the Heaviside function defined as θ(x) = 1 for x ≥ 0 and θ(x)
    = 0 for x < 0. We associate to the ZS system (2.3) the Hamiltonian operator


    (2.5) H = iσ3(d/dx − Q)


    which is selfadjoint on the orthogonal direct sum of two copies of L²(R). It is
    also convenient to introduce the free Hamiltonian


    (2.6) Hf = iσ3( d/dx − Qf ).


    For k ∈ Σ, we define the fundamental eigensolutions Ψ̃(x, k) and Φ̃(x, k) as those
    square matrix solutions to (1.3) satisfying


    (2.7a) Ψ̃(x, k) = e^{xA+(k)}[I2 + o(1)],      x → +∞,

    (2.7b) Φ̃(x, k) = e^{xA−(k)}[I2 + o(1)],      x → −∞.


    We can prove their existence, for k ∈ Σ, as the unique solutions of the Volterra
    integral equations [6, Prop. 1]


    (2.8a) Ψ̃(x, k) = G(x, 0; k) − ∫_x^∞ dy G(x, y; k)[Q(y) − Qf(y)]Ψ̃(y, k),

    (2.8b) Φ̃(x, k) = G(x, 0; k) + ∫_{−∞}^x dy G(x, y; k)[Q(y) − Qf(y)]Φ̃(y, k).


    Here the fundamental matrix G(x, y; k) is given by


    (2.9) G(x, y; k) = { e^{xA+(k)}e^{−yA+(k)},  x, y ≥ 0;  e^{xA+(k)}e^{−yA−(k)},  x
    ≥ 0 ≥ y;  e^{xA−(k)}e^{−yA+(k)},  y ≥ 0 ≥ x;  e^{xA−(k)}e^{−yA−(k)},  x, y ≤ 0.
