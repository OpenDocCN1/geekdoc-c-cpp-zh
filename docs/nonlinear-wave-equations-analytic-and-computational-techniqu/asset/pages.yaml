    Each term in the double infinite sum contains the average value of


    $$E_{jm}=\exp\left[i x\left(\mu - k_x + m + j\right)\right].$$


    This average value is identically zero unless the quantity $\mu - k_x + m + j$
    is zero so that $\langle E_{jm}\rangle = 1$. In other words the contribution from
    the integral is identically zero unless


    $$k_x = \mu + n,$$


    for some integer $n$. Thus, the only contribution in the integral equation occurs
    when $k_x$ is a shift of the original dual lattice. This allows us to collapse
    the double infinite sum to a single infinite sum given by


    (3.14)

    $$\sum_{m=-\infty}^{\infty} \left(\hat{G}_{1,n-m}^{(k(\mu))} + i c\left(i\mu +
    i m\right)\hat{G}_{2,n-m}^{(k(\mu))}\right)\hat{N}_m$$

    $$+ \sum_{j=-\infty}^{\infty} \sum_{m=-\infty}^{\infty} \left(i\mu + i m\right)\hat{G}^{(k(\mu))}(\mu
    + n)_{3,n-m}\hat{Q}_m\right],$$

    $$= i\lambda \sum_{m=-\infty}^{\infty} \hat{G}_{2,n-m}^{(k(\mu))}\hat{N}_m$$


    where $k(\mu)=\mu + n$. The above equation holds for all $n \in \mathbb{Z}$.


    Combining the above equation with (3.12) yields a generalized bi-infinite eigenvalue
    problem for the spectrum of the linearized operator about the stationary traveling
    wave solutions. We define the quantity $\hat{\mathbf{X}}$ as the bi-infinite vector
    of Fourier coefficients $\hat{Q}_j$ and $\hat{N}_j$ for all $j \in \mathbb{Z}$:
    $\hat{\mathbf{X}} = \left[\dots,\hat{N}_{-1},\hat{N}_0,\hat{N}_1,\dots\hat{Q}_{-1},\hat{Q}_0,\hat{Q}_1,\dots\right]^T$.
    With this notation, we rewrite the generalized eigenvalue problem as


    $$\begin{bmatrix} A(\mu) & B(\mu) \\ C(\mu,\rho) & D(\mu,\rho) \end{bmatrix} \hat{\mathbf{X}}
    = \lambda \begin{bmatrix} -I & S(\mu) \\ 0 & V(\mu,\rho) \end{bmatrix} \hat{\mathbf{X}},$$'
