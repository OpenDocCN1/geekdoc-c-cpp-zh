  md: 'Here ζ(α) = α + iη(α) is a parametrization of the free surface and z = x +
    iy is a field point in the fluid. We then use


    − ∂N/∂n_ζ ds = Im{ ζ′(α)/(z − ζ(α)) } dα,    1/2 cot(z/2) = PV ∑_k 1/(z + 2πk)


    to reduce the integral to a period cell, and obtain


    φ(z) = 1/(2π) ∫_0^{2π} Ã(z,α) μ(α) dα,    Ã(z,α) = Im{ ζ′(α)/2 cot((z − ζ(α))/2)
    }.


    Using the Plemelj formula [22], we take the limit as the field point approaches
    the boundary from below to obtain a second kind Fredholm integral equation for
    μ:


    (2.8)    μ(α)/2 + 1/(2π) ∫_0^{2π} A(α,β) μ(β) dβ = 𝒟(α),


    A(α,β) = Im{ ζ′(β)/2 cot((ζ(α) − ζ(β))/2) − 1/2 cot((α − β)/2) }.


    Including 1/2 cot((α−β)/2) in the formula has no effect on A(α,β), but shows that
    A is in fact a smooth function when η is smooth. Indeed, as β → α, the (α − β)^{-1}
    singularities of the terms in braces cancel, yielding A(α,α) = Im{ −ζ″(α)/[2ζ′(α)]
    }. Once μ is known, the Neumann data is readily shown to satisfy


    (2.9)    𝒩(α) = 1/2 H[μ′](α) + 1/(2π) ∫_0^{2π} B(α,β) μ′(β) dβ,


    B(α,β) = Re{ ζ′(α)/2 cot((ζ(α) − ζ(β))/2) − 1/2 cot((α − β)/2) },


    where H is the Hilbert transform, with symbol Ĥ_k = −i sgn(k). To carry this out
    numerically, M collocation points are used to turn the integral equation (2.8)
    into an M × M matrix equation, where integrals are approximated by the trapezoidal
    rule. The derivative and Hilbert transform in (2.9) are easily computed using
    the FFT. The work involved in setting up and solving these integral equations
    is very similar to that of the AFM and AFM* methods. However, the condition number
    is much better in the BIM approach since the underlying infinite dimensional system
    is a second-kind Fredholm integral equation. This makes a big difference in practice
    since intermediate calculations need only be done in double-precision to achieve
    double-precision results, and iterative methods such as GMRES can be employed
    to reduce the work of solving the equations from O(M³) to O(M²). See [4–6,16,19–21,27,32]
    for similar boundary integral methods, including formulations that incorporate
    a bottom boundary and allow the interface to overturn.


    # 2.4. Transformed Field Expansion method.


    The aim of this approach [7,23] is to compute successive terms in the Craig–Sulem
    expansion via formulas that do not suffer from catastrophic cancellation of digits
    in floating point arithmetic. The price we pay for this improvement is that the
    bulk fluid must be discretized. For simplicity, we consider only the finite depth
    case in two dimensions. The three-dimensional case is considered in [23,24], while
    infinite depth is treated in [24] by introducing a fictitious interface coupling
    the unbounded problem on a half-space to the finite-depth problem with a curved
    upper boundary and a flat lower boundary.'
