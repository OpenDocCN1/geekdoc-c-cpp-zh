    # 4.3. Scattering transform of the ring soliton at time zero.


    In this section we compute numerically the scattering transform of the KdV ring
    soliton discussed in example 4.3 and illustrated in Figure 2. Since the initial
    potential is supercritical, we expect the scattering transform to have a singularity.
    Since the initial potential is real-valued and rotationally symmetric in the z-plane,
    also the scattering transform is real-valued and rotationally symmetric in the
    k-plane. See [56, Appendix A] for a proof. Therefore it is enough to compute t(k)
    only for real and positive k.


    We use both the LS and the DN methods described in Section 3.2 and compare the
    results to verify accuracy. The values in the range 0.1 ≤ |k| ≤ 4 are reliable
    as the results of both NV and LS methods closely agree there. However, the DN
    method does not give reliable results for |k| > 4.


    To assure accuracy for |k| > 4, we compare the results of the LS method with two
    different grids in the z-domain. The coarser grid has 4096 × 4096 points, and
    the finer grid has 8192 × 8192 points. The coarser grid is not a subset of the
    finer grid. We remark that both of these grids are significantly finer than those
    we typically use for computing scattering transforms for conductivity-type potentials.
    Due to high memory requirements, we used a liquid-cooled HP Z800 Workstation with
    192 GB of memory. Even with that powerful machine, the evaluation of one point
    value using the finer grid takes more than 11 hours. The LS method gives closely
    matching results in the regions 3 ≤ |k| ≤ 5 and |k| > 9.


    Figure 8 shows the profile of the scattering transform. In the interval 5 < |k|
    < 9 the numerical computation does not converge, resulting either in inaccurate
    evaluation of the point values of the scattering transform or in complete failure
    of the algorithm due to using up all the memory. We suspect that the observed
    numerical divergence arises from the existence of at least one exceptional circle
    in the interval 5 < |k| < 9.'
