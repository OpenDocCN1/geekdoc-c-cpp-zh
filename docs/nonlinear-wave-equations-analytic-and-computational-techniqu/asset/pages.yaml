  md: 'failure of the G = 0 ansatz is due to the pinching off of the gap inequality
    region; this is the primary caustic. They were also able to show that the semiclassical
    dynamics after the primary caustic are described by repairing the ansatz to be
    G = 2, as expected.


    The secondary caustic was studied by Lyng & Miller [22], and the analysis is distinct
    from that used to study the primary caustic. In particular, the dual-interpolant
    method of [24] was used in an essential way, and Lyng & Miller showed that the
    mathematical mechanism for the secondary caustic was also due to a pinch-off event.
    However, in this case, the pinch-off was related to the failure of a different
    variational inequality (for a “different” gap) that arises due to the use of the
    dual-interpolant method. In related work, Belov [2] identified a “catastrophic
    break” after the primary caustic. In his analysis, a relevant level curve collides
    (as t increases, say) with a logarithmic branch point, and this is an obstacle
    to continuing the asymptotic analysis. The relationship between the catastrophic
    break and the failure of the variational inequality of Lyng & Miller is not entirely
    clear. Indeed, we know of no other results for second and higher caustics. However,
    the numerical simulations shown in Figure 2 clearly suggest a tertiary nonlinear
    caustic. The total number of caustics is unknown. Are there infinitely many? Can
    their locations in space-time be predicted? What are the salient features of the
    initial data that determine the location of the caustics? These basic questions
    about the semiclassical limit for the focusing NLS equation remain open.


    # 4. Connection to the true initial-value problem


    # 4.1. Justification of the WKB approximation.


    The outline in §3 above illustrates the advantages of substituting A₀^{(ε)} for
    A₀; powerful mathematical tools can then be brought to bear on the asymptotic
    analysis of the semiclassical limit problem. However, as noted above, the effect
    of the induced perturbations is a priori far from clear. In this section we aim
    to understand the effect of the effect of the perturbation q^{(ε)} on the semiclassical
    dynamics. On the one hand, Miller [24] has shown that the WKB approximation and
    the initial data are asymptotically pointwise close.


    5. THEOREM (Miller [24]). In the situation described above, there is a sequence
    (ε_N)_{N=1}^∞ such that


    (4.1)  lim_{N→∞} ε_N = 0,


    and such that for each x ≠ 0 there exists a constant K (depending on x) such that


    (4.2)  |A₀^{(ε_N)}(x) − A₀(x)| ≤ K ε_N^{1/7−ν},   N = 1,2,3,…


    for all ν > 0.


    However, on the other hand, as noted above and as Miller himself points out, the
    focusing NLS equation has modulational instabilities whose exponential growth
    rates become arbitrarily large as ε ↓ 0. Thus, Theorem 5 does not allow us to
    conclude anything about the size of


    |u^{(ε)}(x,t) − u(x,t;ε)|


    for any t > 0. To investigate this question, we do a series of numerical experiments.
    The results of this section are reported in greater detail in [17,20,21].'
