- pgno: 217
  md: 'It is worth noting that many fewer grid points are needed in the y-direction
    than in the x-direction, so the price of discretizing the bulk fluid is not as
    severe as one might imagine. Moreover, as with the BIM method, intermediate calculations
    can be done in double or quadruple-precision arithmetic to achieve similar levels
    of accuracy in the solution. The overall running times (in seconds) of the various
    methods on this example are given in the following table:


    | method | BIM(d) | BIM(q) | TFE(d) | TFE(q) | CS | AFM | AFM-QR |

    | time | 0.156 | 3.53 | 2.46 | 24.0 | 2762 | 11222 | 920 |


    The code was run on a 3.33 GHz Intel Xeon X5680 system with 12 cores. Here (d)
    and (q) stand for double and quadruple-precision, and the other methods were run
    with 360 bits (108 digits) of precision. The running time of AFM* is nearly identical
    to that of AFM, and the AFM-QR variant will be described below. Clearly, the BIM
    and TFE approaches are superior to the CS and AFM-based methods since arbitrary-precision
    arithmetic is not required.


    We conclude with the results of the AFM and AFM* methods on this example, which
    we selected initially as being relevant to water waves and likely to cause difficulties
    for the AFM and AFM* methods. Our reasoning was that the second wave is large
    enough to require many Fourier modes to resolve its shape, but small enough that
    cosh(kη(x)) is many orders of magnitude larger at the crest of the first wave
    than at the crest of the second (for large k). Thus, substantial cancellation
    must occur near x = 0 in order to resolve the behavior of φ near x = π. However,
    the singular values in the first panel of Figure 17 decay slowly in comparison
    to the infinite-depth standing wave case of Figure 13. This is because the waves
    in these two examples have similar Fourier decay rates for η̂_k and Ĝ_k, but the
    deep-water standing wave has a much larger vertical crest-to-trough height. To
    the extent that this is generally the case for waves in deep versus shallow water,
    the AFM and AFM* methods appear to be better suited for finite depth problems.


    The errors in the AFM and AFM* methods are nearly identical for every choice of
    pseudo-inverse cutoff in the second panel of Figure 17. Thus, the methods are
    equally effective at computing the DNO for this example. Beyond k_cutoff = 970,
    the error in the second panel reaches a plateau of 3 × 10^−28. This is due to
    errors in the “exact” solution. Since this plateau is reached already at k_cutoff
    = 970, it would appear that K and possibly M can be reduced while still achieving
    the target accuracy of 10^−28. However, reducing K leads to worse results (not
    shown). The reason is that the high-index columns of A in


    A_{j0} = 1/M,   (A_{j,2k-1} \ A_{j,2k}) = √2/M * cosh[kη(x_j)+h]/cosh[kη_max+h]
    * (cos k x \ sin k x),   (1 ≤ k < K/2)


    comprise a small but important part of the low-index singular vectors U of the
    singular value decomposition, A = U S V^T. A better way to understand how large
    K needs to be in order to achieve a prescribed accuracy is to perform a QR factorization,
    A = Q R, which is a numerically robust way to perform a Gram-Schmidt orthogonalization
    of the columns of A. We then define the “discrete AFM transform”


    𝒩̃_0 = c_0,   𝒩̃_k = c_{2k-1} + i c_{2k},   {c_k}_{k=0}^{K-2} = 1/√M Q^T {𝒩(x_j)}_{j=0}^{M-1}'
