    ```

    (2)  φ_xx + φ_zz = 0,  (x, z) ∈ D

    (3)  φ_z = 0,  z = −h,

    (4)  η_x (φ_x − c) = φ_z,  z = η(x),

    (5)  −c φ_x + 1/2 (φ_x² + φ_z²) + g η = 0,  z = η(x),

    ```


    where φ(x, z) represents the velocity potential of the fluid, η(x) represents
    the surface elevation, and we have ignored the effects of surface tension. In
    the formulation given by (2-5), the pressure at the free surface of the fluid
    has been normalized to zero.


    ![](img/c92a9d81ba7f671c83a4c600d27389fb_171_0.png)


    # FIGURE 1. The fluid domain.


    The primary goal of this paper is to relate the pressure p(x, z) at any point
    interior to the fluid with the elevation of the fluid surface η(x) subject to
    periodic boundary conditions in x (without loss of generality, we assume that
    the period is 2π). While the pressure does not show up explicitly in the above
    formulation, we know the Bernoulli equation is valid throughout the fluid domain
    for an irrotational fluid. For a traveling wave moving with speed c, we have


    ```

    (6)  −c φ_x + 1/2 (φ_x² + φ_z²) + p(x, z) = B,

    ```


    where B represents the Bernoulli constant, and


    ```

    p(x, z) = g z + P(x, z)/ρ,

    ```


    and represents the non-static portion of the pressure. Thus, if we can find a
    relationship between φ(x, z) inside the fluid domain and the surface elevation
    η, we can directly connect the two quantities of interest. Equation (6) will serve
    as the foundation for relating the pressure at any point in the fluid with the
    free surface.


    > REMARK 1. In the following we set B = 0. This is equivalent to suitably redefining
    the speed of the wave and hence introducing a horizontal current relative to the
    frame of reference [18].'
