    Theorem 6.1 opens up several areas for further investigation.


    First, it would be of considerable interest to determine what additional data
    is needed to reconstruct a potential from t(k) when t(k) has point or line singularities.


    Second, it would be very interesting to know whether singularities are always
    present for supercritical potentials, or whether, on the other hand, singularities
    are generically absent.


    Third, our understanding of the NV equation and its dynamics would be greatly
