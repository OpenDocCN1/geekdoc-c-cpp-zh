    nonlinear wave for h = .5 than for the other two depths.


    We further establish confidence in our numerical approach by investigating its
    Cauchy convergence. Let λ_N represent a particular eigenvalue corresponding to
    a truncation size N (which corresponds to 2N + 1 Fourier coefficients). We define
    the Cauchy error as


    e_N = |λ_N − λ_{N−1}|.


    As we increase the size of our truncated matrix, the calculated eigenvalues should
    be found to converge numerically. We track the approximation of the eigenvalues
    with the largest real part as a function of truncation size for three different
    depths corresponding to traveling wave solutions with a dimensionless amplitude
    ak = 0.1. The Cauchy errors are given in Table 1.


    # 4. Results


    # 4.1. Flat Water.


    Since we use a continuation approach, we start by carefully considering the stability
    of the trivial solution η(x) = 0, q(x) = 0, corresponding to a traveling wave
    of zero amplitude. We can analytically determine the spectrum of this trivial
    traveling wave. We choose the wave speed c corresponding to the starting point
    of the bifurcation branch of periodic solutions to be


    c = √( g tanh(hk) / k ),


    where we choose k = 1 for 2π periodic solutions. Other bifurcation branches start
    elsewhere, but those branches correspond to mere scalings of the branch we consider.
    Their stability properties are identical, and no information is lost by considering
    only the one branch.


