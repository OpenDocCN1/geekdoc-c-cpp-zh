- pgno: 187
  md: '# Comparison of Five Methods of Computing the Dirichlet–Neumann Operator for
    the Water Wave Problem


    Jon Wilkening and Vishal Vasan


    ABSTRACT. We compare the effectiveness of solving Dirichlet–Neumann problems via
    the Craig–Sulem (CS) expansion, the Ablowitz–Fokas–Musslimani (AFM) implicit formulation,
    the dual AFM formulation (AFM*), a boundary integral collocation method (BIM),
    and the transformed field expansion (TFE) method. The first three methods involve
    highly ill-conditioned intermediate calculations that we show can be overcome
    using multiple-precision arithmetic. The latter two methods avoid catastrophic
    cancellation of digits in intermediate results, and are much better suited to
    numerical computation.


    For the Craig–Sulem expansion, we explore the cancellation of terms at each order
    (up to 150th) for three types of wave profiles, namely band-limited, real-analytic,
    or smooth. For the AFM and AFM* methods, we present an example in which representing
    the Dirichlet or Neumann data as a series using the AFM basis functions is impossible,
    causing the methods to fail. The example involves band-limited wave profiles of
    arbitrarily small amplitude, with analytic Dirichlet data. We then show how to
    regularize the AFM and AFM* methods by over-sampling the basis functions and using
    the singular value decomposition or QR-factorization to orthogonalize them. Two
    additional examples are used to compare all five methods in the context of water
    waves, namely a large-amplitude standing wave in deep water, and a pair of interacting
    traveling waves in finite depth.


    # 1. Introduction


    The water wave equations, also known as Euler’s equations for inviscid, irrotational
    waves, describe the motion of the free surface of an ideal fluid. For periodic
    waves in two dimensions over a flat surface in the absence of surface tension,
    they are given as follows [9]:


    ```

    φ_xx + φ_yy = 0,      −h < y < η,

    η_t + φ_x η_x = φ_y,    y = η(x,t),

    φ_t + 1/2 φ_x² + 1/2 φ_y² + g η = 0,    y = η(x,t),

    φ_y = 0,               y = −h.

    ```


    Here φ is the velocity potential (related to the fluid velocity by u = ∇φ), η
    is the graph of the free surface of the water, g is the acceleration of gravity,
    h is the'
