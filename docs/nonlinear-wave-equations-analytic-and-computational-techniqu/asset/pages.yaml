- pgno: 107
  md: 'be identically zero due to the smoothness of A₀, and for simplicity we shall
    largely ignore the role of the norming constants in our exposition here. As noted
    above, Klaus & Shaw [18] have shown that the eigenvalues (for bell-shaped potential
    A₀ in (2.1)) are purely imaginary. The evolution in time of the scattering data
    in the spectral domain is governed by the other half of the Lax pair, a linear
    problem, and is simple and explicit. Finally, the solution at times t > 0 is recovered
    by an inverse scattering map; that is, the solution u(x,t;ε) is recovered from
    the time-evolved scattering data (eigenvalues, norming constants, reflection).
    A complete and detailed description of this methodology for (1.1) can be found,
    for example, in the monographs [1,13].


    # 2.2. WKB analysis.


    In the case of a Klaus–Shaw potential, as in (2.1), one may obtain further, formal
    information about the precise location of the eigenvalues by performing a WKB
    analysis. We only summarize the results here; details may be found in the article
    of Ercolani et al. [12]. We begin with the density function


