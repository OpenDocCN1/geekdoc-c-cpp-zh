    # 4. Special Solutions


    There are various powerful methods to find solutions of nonlinear evolution equations,
    most notably the inverse scattering method. However, the inverse scattering method
    is not readily useful for finding closed-form solutions to the NV equation, and
    so techniques including Hirota’s method and the extended mapping approach (EMA)
    are presented here to construct closed-form solutions of several types of solitons.
    We begin by explaining the close connection between plane-wave solutions to NV
    and solutions to the KdV equation and present evolutions of KdV ring-type solutions.
    Although the KdV ring-type soliton is not of conductivity type, the scattering
    transform is computed in Section 4.3, and the numerical results provide evidence
    of the presence of an exceptional circle.


    # 4.1. KdV-type Solutions.


    Consider the NV equation (3.1) in the form


    ```

    (4.1)  q̇ = -1/4 q_{xxx} + 3/4 q_{xyy} + 3/4 div( (q - E) u ),

    ```


    where u = u₁ + i u₂ and u = (u₁, u₂), and the auxiliary equation ∂̄ u = ∂ q as


    ```

    (4.2)  { (u₁)_x - (u₂)_y = + q_x  (u₂)_x + (u₁)_y = - q_y }

    ```


    As in [13] we use a FFT-based method to solve the equations on the square −L ≤
    x, y ≤ +L with periodic boundary conditions.'
