  md: '# 4.4. SSEs in the spectral domain.


    We used the numerical protocol of Bronski [5, 6] to compute the eigenvalues of
    (2.1) with a Gaussian potential,


    ```

    A₀(x) = e^{-x²}

    ```


    for a variety of values of ε. Our aim was to compute the rate of convergence of
    the approximate (WKB) eigenvalues used in the SSE formulation to the true ones.
    We did this to both to verify directly our expectation of the high-quality of
    the WKB approximation (we merely inferred this from our previously described simulations)
    and to support an eventual proof of the rate which we believe will be a necessary
    ingredient in any rigorous extension of the analysis of Kamvissis et al. [16]
    which accounts for the use of the WKB eigenvalues in the asymptotic analysis for
    (1.1). In summary, we numerically measured the difference directly in the spectral
    plane, and our experiments suggest convergence at a rate of O(ε²) as ε ↓ 0. Details
    of this computation can be found in [17].


    Briefly, we performed a least squares fit of the data in the form of


    ```

    (4.8) D^N = C · N^α

    ```


    for some constants C and α to be determined. Here D denotes the data, a collection
    of computed differences between the WKB eigenvalues used to construct the SSE
    and the (numerically computed) true eigenvalues. Now for each N = 10,⋯,20, we
    have data for k = 0,⋯,N−1, and for N = 21 and 22, we have data for the largest
    (k = 0) eigenvalue. Therefore we have total 167 data points. Figure 5(a) shows
    the least square fit for all 167 data points. The triangles are the computed differences.
    For example, there are 10 eigenvalues for N = 10, and hence there are 10 computed
    differences. The solid line is the computed least square curve, which indicates
    the overall trend of decay of D^N versus N. The rate of decay is α = −2.00848.
    Another way to monitor the rate of decay is to track the differences between the
    largest eigenvalues for each N. That is, we computed


    ```

    (4.9) D_{N,0} = |λ_{N,0}^{app} − λ_{N,0}^{wkb}|,  N = 10,⋯,22

    ```


    and again perform a least squares fit. Figure 5(b) shows the data and the least
    squares curve for this collection of 13 data points. In this case the rate of
    decay is given by α = −2.0135. These experiments support a rate of decay that
    is of the order of the square of the small parameter.


    # 4.5. Summary: A₀ versus A₀^{(ε)}.


    To summarize, the numerical experiments described above strongly support the notion
    that the family of perturbations, q^{(ε)}, used to generate the SSE associated
    to a particular bell-shaped initial condition for (1.1) are particularly well
    suited to the analysis of the semiclassical limit. Indeed, as shown in Figure
    3, the extreme modulational instabilities of the focusing NLS equation (which
    get worse in the semiclassical limit) do not seem to be triggered at all by these
    perturbations, and we are led to conjecture that the semiclassical asymptotics
    for the solutions emanating from A₀ agree with those emanating from the limit
    of A₀^{(ε)}. Presumably, this is due in large part to the fact the these perturbations
    are strongly interlaced with the integrable structure of the equation. Indeed,
    an additional experiment shows that qualitatively similar perturbations which
    have no special link to the integrable structure of the equation are detected
    immediately (Figure 4). Finally, a numerical computation confirms that the approximate
    (WKB) eigenvalues used in the construction of the modified data approach'
