- pgno: 22
  md: '![](img/c92a9d81ba7f671c83a4c600d27389fb_22_0.png)


    FIGURE 5. Evolution of the magnitude of the first Fourier mode of the integrable
    scheme (4.6), with δ = .022, N = 170 and single-mode initial condition (1.5),
    showing repeated, approximate recurrences at regular time intervals.


    of the number of degrees of freedom in the system leads to a complete breakdown
    of recurrence as the number of degrees of freedom falls below a threshold. Hence,
    recurrence can not be attributed to a restriction of the phase space. In the ‘middle’
    range between the breakdown of recurrence (N small) and dynamics dominated by
    the PDE limit (N large), the Zabusky-Kruskal (1.3) and integrable (4.6) lattices
    exhibit their strongest recurrence, due to some as-yet-undetermined property of
    the lattices. We emphasize that the existence of this middle-N region of maximal
    recurrence in the integrable scheme demonstrates that integrability itself is
    not decisive in determining the recurrence behavior of a lattice.


    The representation of the state of the lattice systems by Fourier coefficients
    can be interpreted as an (isometric) change of coordinates. The convention of
    using the Fourier coefficients and the low-mode initial condition to investigate
    recurrence goes back to FPU [15] and is grounded in the fact that the magnitudes
    of these coefficients are the power in the normal modes of the linear part of
    system. However, for the configurations considered here (and previously by Zabusky
    and Kruskal [36]), the linear term is not dominant and the Fourier modes interact
    strongly. Therefore, the Fourier coefficients are not intrinsic to the observed
    dynamics. Instead, the integrable system has a natural set of coordinates, the
    action-angle variables. In action-angle coordinates, the mechanism of recurrence
    may be clearer. However, the development of the action-angle coordinates is probably
    best realized through the development of the semi-discrete Inverse-Scattering
    Transform for the pair (4.2),(4.4), which is beyond the scope of this work.


