    mathcal{L}_2U(x)$\n```\n\nwhere $\\mathcal{L}_1$ and $\\mathcal{L}_1$ are $2\\\
    times2$ matrices of linear operators that depend on $\\rho$, and whose entries\
    \ are easily read off from (3.6) and (3.7).\n\nSince the time dependence of the\
