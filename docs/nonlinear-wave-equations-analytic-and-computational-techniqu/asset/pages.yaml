    f)_k = \int_{0}^{L} e^{-ikx} \frac{\sinh(k(\eta(x) + h))}{i w_k} f(x) \,dx,

    ```


    and the weights w_k are chosen to make A and B bounded from \ell^2(\mathbb{Z})
    to L^2(0,L). Formally, these weights cancel internally in the products (A^*)^{-1}
    B^* and B A^{-1}. Indeed, the results are formally unchanged if both sides of
    (2.4) are multiplied by w_k^{-1}, or if the weights are absorbed into \hat{\Psi}_k
    in (2.5), (2.6). These statements are only formal since A and A^* are not invertible.


    # 2.3. Boundary Integral Method.


    Whereas the AFM* method represents \phi in the fluid as a superposition of basic
    solutions of the Laplace equation of the form e^{ky} e^{ikx}, the boundary integral
    method represents \phi as a superposition of dipoles distributed along the surface,


    ```

    \phi(z) = \int_{-\infty}^{\infty} -\frac{\partial N}{\partial n_\zeta}(z, \zeta(\alpha))
    \mu(\zeta(\alpha)) |\zeta''(\alpha)| \,d\alpha, \qquad N(z, \zeta) = \frac{1}{2\pi}
    \log |z - \zeta|.

    ```'
