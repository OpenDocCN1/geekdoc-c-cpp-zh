    \ with p = −L/2, …, −1, 0, 1, …, L/2, and q = −M/2, …, −1, 0, 1, …, M/2.\n\nEquations\
    \ (3.2) and (3.3) can be solved in terms of û\n\n(3.4)  v̂ = (ξ² − η²)/(ξ² + η²)\
    \ û,      ŵ = (−2ηξ)/(η² + ξ²) û\n\nSpecial attention has to be paid to the case\
    \ ξ² + η² = 0. The corresponding Fourier coefficients represent the average values\
