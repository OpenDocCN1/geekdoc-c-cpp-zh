- pgno: 37
  md: '# The Novikov-Veselov Equation:

    Theory and Computation


    R. Croke, J. L. Mueller, M. Music, P. Perry, S. Siltanen, and A. Stahel


    ABSTRACT. We review recent progress in theory and computation for the Novikov-Veselov
    (NV) equation with potentials decaying at infinity, focusing mainly on the zero-energy
    case. The inverse scattering method for the zero-energy NV equation is presented
    in the context of Manakov triples, treating initial data of conductivity type
    rigorously. Special closed-form solutions are presented, including multisolitons,
    ring solitons, and breathers. The computational inverse scattering method is used
    to study zero-energy exceptional points and the relationship between supercritical,
    critical, and subcritical potentials.


    # CONTENTS


    +   1. Introduction

    +   2. Background for the Zero-Energy NV Equation

    +   3. Inverse Scattering via Manakov Triples

    +   4. Special Solutions

    +   5. Zero-energy exceptional points

    +   6. Open Problems

    +   Appendix A. Some Useful Analysis

    +   References


    # 1. Introduction


    The Novikov-Veselov (NV) equation is the completely integrable, nonlinear dispersive
    equation


    ```

    (1.1)

    q_t = 4 Re (4∂³ q + ∂ (q w) − E ∂ w)

    \bar{∂} w = −3 ∂ q

    ```


    2010 Mathematics Subject Classification. Primary 37K15; Secondary 35Q53, 65M32,
    47J35, 70H06.


    Michael Music supported in part by NSF Grant DMS-1208778.


    Peter Perry supported in part by NSF Grant DMS-1208778.


    Samuli Siltanen supported in part by the Finnish Centre of Excellence in Inverse
    Problems Research 2012-2017 (Academy of Finland CoE-project 250215).'
