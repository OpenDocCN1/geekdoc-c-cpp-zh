- pgno: 133
  md: '# 5. Comparison with KdV


    In the previous section, we observed two types of overtaking collisions for the
    water wave: one in which the larger wave completely subsumes the smaller wave
    for a time, and one where the two waves remain distinct throughout the interaction.
    Similar behavior has of course been observed for the Korteweg-de Vries equation,
    which was part of our motivation for looking for such solutions. Lax [32] classified
    overtaking collisions of two KdV solitons as bimodal, mixed, or unimodal. Unimodal
    and bimodal waves are analogous to the ones we computed above, while mixed mode
    collisions have the larger wave mostly subsume the smaller wave at the beginning
    and end of the interaction, but with a two-peaked structure re-emerging midway
    through the interaction. Lax showed that if 1 < c₁/c₂ < A = (3 + √5)/2, the collision
    is bimodal; if c₁/c₂ > 3, the collision is unimodal; and if A < c₁/c₂ < 3, the
    collision is mixed. Here c₁ and c₂ are the wave speeds of the trailing and leading
    waves, respectively, at t = −∞. LeVeque [33] has studied the asymptotic dynamics
    of the interaction of two solitons of nearly equal amplitude. Zou and Su [53]
    performed a computational study of overtaking water wave collisions, compared
    the results to KdV interactions, and found that the water wave collisions ceased
    to be elastic at third order. Craig et al. [15] also found that solitary water
    waves collide inelastically. This does not conflict with our results since we
    optimize the initial conditions to make the collision elastic. Head on collisions
    have been studied numerically by Su and Mirie [38, 44], experimentally by Maxworthy
    [35], and by a mixture of analysis and computation by Craig et. al. [15].


    Validation of KdV as a model of water waves has also been studied extensively.
    A formal derivation may be found in Ablowitz and Segur [1]. Rigorous justification
    has been given by Bona, Colin and Lannes [9], building on earlier work by Craig
    [14] as well as Schneider and Wayne [43]. According to [9], some gaps still exist
    in the theory in the spatially periodic case. Experimental studies of the validity
    of KdV for describing surface waves have been performed by Zabusky and Galvin
    [52] as well as Hammack and Segur [24]. Recently, Ostrovsky and Stepanyants [40]
    have compared internal solitary waves in laboratory experiments to the predictions
    of various model equations, including KdV, and give a comprehensive overview of
    the literature on this subject [40].


    Our objective in this section is to determine quantitatively whether the solutions
    of the water wave equations that we computed in §4 are well-approximated by the
    KdV equation. Following Ablowitz and Segur [1], we introduce a small parameter
    ε and dimensionless variables


    ```

    $$\hat y=\frac{y}{h},\qquad \hat x=\sqrt{\varepsilon}\frac{x}{h},\qquad \hat t=\sqrt{\frac{\varepsilon
    g}{h}}\,t,\qquad \hat\eta=\frac{\eta}{\varepsilon h},\qquad \hat\phi=\frac{\phi}{\sqrt{\varepsilon
    gh^3}}.$$

    ```


    where h is the fluid depth. We assume the bottom boundary is at y = −h rather
    than 0 in this derivation, so that ŷ runs from −1 to εη̂. The Laplacian becomes
    Δε = h⁻²(εδ²ₓ + ∂²ᵧ), which allows for φ̂ = φ̂₀ + εφ̂₁ + ε²φ̂₂ + ··· to be computed
    order by order, with leading terms satisfying


    ```

    $$\hat\phi_{0,\hat y}=0,\qquad \hat\phi_1=-\frac{1}{2}(1+\hat y)^2\hat\phi_{0,\hat
    x\hat x},\qquad \hat\phi_2=\frac{1}{24}(1+\hat y)^4\hat\phi_{0,\hat x\hat x\hat
    x\hat x}.$$

    ```'
  merge: -1
  img_proc: true
