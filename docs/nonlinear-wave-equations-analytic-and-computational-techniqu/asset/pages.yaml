  md: 'For the special case $c_1 = c_2 = 0$ we find


    $$q(t, n_1 s, n_2 s) = q(t, s) = v\left(\frac{\kappa}{4} t, s\right) + \frac{E}{2}$$


    Thus we can relate all solutions to KdV as planar solutions to NV, with different
    speeds of propagation depending on the direction of the plane wave.


    # EXAMPLE 4.2. Based on the above remark we have an exact solution of the NV equation
    at zero energy given by


    $$q(t, x, y) = -2 c \cosh^{-2}(\sqrt{c}(x - c t)).$$


    This solution is unstable with respect to perturbations periodic in $y$ direction
    with period $\frac{2\pi}{k\sqrt{c}}$ for $0.363 < k < 1$, see [13]. This is confirmed
    by numerical evolution of the NV equation using the above spectral method.


    # EXAMPLE 4.3. A KdV ring initial condition.


    Using $r = \sqrt{x^2 + y^2}$ we choose a radially symmetric initial value


    $$q_0(x, y) = q(0, x, y) = f(r) = -\frac{1}{2} \cosh^{-2}\left(\frac{1}{2}(r -
    20)\right) < 0.$$


    This corresponds to a solution of equation (4.3) in the radial variable $r$, a
    KdV ring with radius 20.


    Using the argument in [56, Appendix B] (based on [53]) we may consider $q_0$ as
    a non-positive deviation from 0, which is a potential of conductivity type. Thus
