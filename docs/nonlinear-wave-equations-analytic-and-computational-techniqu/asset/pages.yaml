    ```


    where we have introduced characteristic coordinates r = ˆx − ˆt, l = ˆx + ˆt as
    well as a slow time scale τ = ε ˆt to eliminate secular growth in the solution
    with respect to r and l at first order in ε; see [1] for details. The notational
    conflict of g(l, τ) with the acceleration of gravity, g, is standard, and will
    not pose difficulty below.


    In our case, the waves travel to the right, so we may set g(l, τ) = 0 in the formulas
    above. Returning to dimensional variables, we then have


    ```

    η(x, t) = h ε f( √ε ( x/h − √(g/h) t ), √(g/h) ε^(3/2) t ),

