- pgno: 104
  md: 'A detailed study of the behavior of $u^{(\epsilon)}(x,t)$ in the limit $\epsilon
    \downarrow 0$ is a key element of one of the principal approaches—pioneered by
    Kamvissis, McLaughlin, & Miller in their groundbreaking monograph [16]—to the
    analysis of the semiclassical (zero-dispersion, $\epsilon \downarrow 0$) limit
    for equation (1.1). In its most basic form, the semiclassical limit problem is
    to provide a complete asymptotic description of the true solutions—indexed by
    $\epsilon > 0$ and here denoted by $u(x,t;\epsilon)$ to distinguish them from
    elements $u^{(\epsilon)}(x,t)$ of the SSE—of (1.1), (1.2). However, as we shall
    describe below, equation (1.1) has modulational instabilities whose exponential
    growth rates increase without bound in the semiclassical limit. Thus, the impact
    of even small perturbations to the initial data on the limiting behavior is far
    from clear. Indeed, one of the remaining open problems in the theory is to determine,
    rigorously, whether or not the semiclassical asymptotics of $u^{(\epsilon)}(\cdot,\cdot)$
    coincide with those of the true solutions $u(\cdot,\cdot;\epsilon)$, say, in a
    neighborhood of fixed values of $x$ and $t$. Our aim here is to give a panoramic
    view of the use of SSEs to study the semiclassical limit problem and, in particular,
    to describe several numerical studies of recent vintage which address the connection
    between the asymptotics of these two families of solutions. These numerical experiments,
    taken together, give very strong support to the claim that the limiting behavior
    of these two families of solutions is the same.


    # 1. REMARK (Data).


    Here, we shall only concern ourselves with bell-shaped real data; we sometimes
    say that this data is of Klaus–Shaw type, after the result of Klaus & Shaw [18]
    that restricts the point spectrum of the related nonselfadjoint Zakharov–Shabat
    eigenvalue problem (equation (2.1) below) with such a bell-shaped potential to
    the imaginary axis. However, it is also desirable to consider complex data in
    amplitude-phase form


    ```

    (1.3) $$u(x,0)=A_0(x)\mathrm{e}^{\mathrm{i}S_0(x)/\epsilon}.$$

    ```


    Moreover, it is natural (from the point of view of applications) to consider data
    which is not analytic. In general, however, the semiclassical limit problem has
    largely resisted a completely rigorous analysis outside of two families of specific
    analytic data (for which the forward scattering problem (2.1) can be solved exactly
    [27,30]); thus, an extension to an entire class of bell-shaped data may be regarded
    as an important first step toward a comprehensive theory for the semiclassical
    limit problem.


    # 1.2. About the problem: modulational instability.


    Equation (1.1) is a universal model equation that arises naturally in multiscale
    analyses of various physical phenomena as an envelope equation governing the evolution
    of nearly monochromatic waves in a weakly dispersive nonlinear medium. In this
    setting, the real parameter $0 < \epsilon \ll 1$ is a measure of the competition
    between dispersion and nonlinearity, and it is precisely this competition—in which
    nonlinear effects amplify waves and dispersive effects pull them apart—that gives
    rise to the behaviors of interest. Indeed, the focusing nonlinearity (“+” sign
    in front of the nonlinear term) in (1.1) arises when the combination of nonlinear
    and dispersive effects destabilizes periodic wavetrains. This instability is known
    to occur, for example, in the theory of finite-amplitude plane waves on deep water
    where it is known as the Benjamin–Feir instability. See, e.g., [28] for a more
    detailed discussion of these points.


    The task of obtaining detailed semiclassical asymptotics for solutions of (1.1),
    (1.2) have long been identified as one of the central challenges in the theory
    of singular asymptotics for integrable nonlinear wave equations (see, e.g., Bronski
    &'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'McLaughlin [7], Forest and Lee [14] for early reports on this problem), and
    this challenge has been the focus of a substantial body of work in recent years
    [2–4, 8, 16, 20–22, 24, 32, 33]. The mathematical interest in this problem has
    been due, in large part, to the aforementioned phenomenon of modulational instability.
    To describe this phenomenon in more detail, we simply note that it is a straightforward
    exercise to verify that a plane wave of the form u(x,t;ε)=U0 exp(i(kx−ωt)) is
    a solution of (1.1) provided that ω=ω(k;ε) satisfies the dispersion relation


    (1.4) ω = ε/2 k² − |U0|²/ε .


    But, a linear stability analysis, perturbing the amplitude and phase slightly,
    shows that all wave numbers are destabilized in the limit of vanishing dispersion
    [28]. This feature of equation (1.1) has a profound effect on the analysis of
    the semiclassical limit. Indeed, modulational instability manifests itself as
    ellipticity of the formal model (known as the Whitham or modulation equations)
    expected to describe the large-scale limiting dynamics. To obtain the Whitham
    system, we make the standard definitions ρ=|u|², μ=−iε/2 (u* ∂u/∂x − u ∂u*/∂x),
    and we obtain exactly—that is, with no approximation at all—from (1.1) the system


    (1.5a) ∂ρ/∂t + ∂μ/∂x = 0,


    (1.5b) ∂μ/∂t + ∂/∂x ( μ²/ρ − ρ/2 ) = ε²/4 ∂/∂x [ ( ∂²/∂x² log(ρ) ) ρ ] .


    The Whitham equations for (1.1) are then obtained from (1.5) simply by neglecting
    the formally small O(ε²) term on the right-hand side of (1.5b). However, a standard
    calculation starting with the resulting first-order system reveals at once that
    the Whitham equations are of elliptic type, and are therefore expected to be generally
    ill-posed as an initial-value problem. This ill-posedness is troubling for several
    reasons. First and foremost, it casts doubt on the utility of the Whitham system
    in the first place; one hopes that the Whitham system should provide a relatively
    simple description of the oscillatory behavior of the semiclassical dynamics.
    Second, since one only expects to be able to solve the elliptic initial-value
    problem for short-time using the Cauchy–Kovalevskaya theorem for analytic data,
    the elliptic nature of the equations suggests the possibility that the limiting
    dynamics are extremely sensitive to the presence (or absence!) of analyticity
    in the data. As noted in Remark 1 above this is particularly troublesome given
    the importance of (1.1) in applications where nonanalytic data is ubiquitous.
    Finally, as indicated above, the formation of a SSE is based on an uncontrolled
    modification of the initial data, and the lack of well-posedness (associated with
    ellipticity) obscures the effect of introducing even small perturbations to the
    initial data.


    # 1.3. Plan.


    In §2, to set the scene, we outline the rudiments of the inverse scattering transform
    (IST) for (1.1), (1.2). In particular, we recall the form of the Zakharov–Shabat
    problem [34] and the WKB analysis of [12] that is the basis for the construction
    of SSEs associated to bell-shaped initial data. For completeness, in §3 we briefly
    describe the asymptotic analysis of the Riemann–Hilbert problem for inverse scattering
    associated with a SSE. This analysis is fundamentally based on the steepest descent
    techniques of Deift & Zhou [9]. Notably, this analysis gives a clear mathematical
    interpretation of the nonlinear caustics in the semiclassical'
