    Here we used Δφ = 0 and φ_y(x, −h) = 0. Note that ˆφ_0 is independent of ˆy, and
    agrees with the velocity potential φ on the bottom boundary, up to rescaling:


    ```

    ˆφ_0(ˆx, ˆt) = (ε g h³)^(-1/2) φ(x, −h, t).

    ```


    From the equations of motion, η_t = φ_y − η_x φ_x and φ_t + ½ φ_x² + ½ φ_y² +
    g η = 0, one finds that


    ```

    ˆη_t + ˆu_x = ε { 1/6 ˆu_xxx − (ˆη ˆu)_x } + O(ε²),

    ˆu_t + ˆη_x = ε { 1/2 ˆu_xxt − 1/2 ∂_x(ˆu)² } + O(ε²),

    ```


    where ˆu(ˆx, ˆt) = ∂_x ˆφ_0(ˆx, ˆt). Expanding ˆη = ˆη_0 + ε ˆη_1 + ⋯, ˆu = ˆu_0
