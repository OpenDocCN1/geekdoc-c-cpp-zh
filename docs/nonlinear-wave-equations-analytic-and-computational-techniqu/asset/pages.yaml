    Thus, $\mathcal{W}(k)-I$ minus the rank two contribution has norm at most $$\frac{2}{\pi}\|q-q_f\|_1\left|\frac{k(k+\lambda)}{2\lambda^2\det
    Z(k)}\right|.$$ By using (4.2), we also verify that the rank two contribution
    to $\mathcal{W}(k)-I$ has norm at most $$\|q-q_f\|_1\sqrt{\left|\frac{k(k+\lambda)}{2\lambda^2}\right|}\left|\frac{k(k+\lambda)}{2\lambda^2\det
    Z(k)}\right|.$$ As a result, $$\|\mathcal{W}(k)-I\|\le\|q-q_f\|_1\left|\frac{k(k+\lambda)}{2\lambda^2\det
    Z(k)}\right|\left\{\frac{2}{\pi}+\sqrt{\left|\frac{k(k+\lambda)}{2\lambda^2}\right|}\right\},$$
    which completes the proof.


    The next theorem sheds light on the case $q_+ = q_-$.


    # THEOREM 4.4. Let $q_+ = q_-$. Then, for $k \in (-q_0, q_0)$, $\mathcal{W}(k)$
    is invertible if the right-hand side of equation (4.13) $$\|\mathcal{W}(k)-I\|
    \le \frac{2}{\pi}\|q-q_f\|_1\left|\frac{k}{\lambda}\right|.$$ is strictly less
    than one. As a consequence, the discrete eigenvalues belong to these neighborhoods
    of $q_0$, $-q_0$ for which the right-hand side of (4.13) is at least one.


    PROOF. Equation (4.13) immediately follows from the second of (4.6) taking into
    account (4.10), (4.11) and (4.12).


    We remark that these results agree with those found in [5, Sec. 4]. Finally, for
    $q_+ \ne q_-$ we prove the existence of a discrete eigenvalue in the spectral
    gap if $\|q-q_f\|_1$ is sufficiently small.


    # THEOREM 4.5. Let $q_+ \ne q_-$ and let $(k_0-\epsilon, k_0+\epsilon) \subseteq
    (-q_0, q_0)$. Put $C_\epsilon = \max_{|k-k_0|=\epsilon}\|(k-H_f)^{-1}\|\|\mathcal{W}^{-1}(k)\|$.
    Then for $$\|q-q_f\|_1 < \frac{1}{\epsilon C_\epsilon}$$ there exists a simple
    discrete eigenvalue $k \in (k_0-\epsilon, k_0+\epsilon)$.


    PROOF. Let $\Gamma(\epsilon)$ be the positively oriented circle with center $k_0$
    and radius $\epsilon$. Using (4.7) and $|||\Delta|^{\frac12}||^2 = \|q-q_f\|_1$
    (where $|\Delta|$ is defined by (4.4)), we estimate $$\left\|\frac{1}{2\pi i}\int_{\Gamma(\epsilon)}
    dk\{(k-H)^{-1}-(k-H_f)^{-1}\}\right\| \le \epsilon\|q-q_f\|_1 C_\epsilon < 1$$
    whenever $\|q-q_f\|_1 < \frac{1}{\epsilon C_\epsilon}$. Now recall that $P = \frac{1}{2\pi
    i}\int_{\Gamma(\epsilon)} dk(k-H)^{-1}$ and $P_f = \frac{1}{2\pi i}\int_{\Gamma(\epsilon)}
    dk(k-H_f)^{-1}$ are the orthogonal projections onto the combined eigenvector subspaces
    of $H$ and $H_f$ corresponding to the eigenvalues in $(k_0-\epsilon, k_0+\epsilon)$.
    We have proved above that $\|P-P_f\| < 1$.'
