  md: 'Similarly, proceeding to higher order, we obtain further terms in the expansion
    of the DNO. For instance,


    $G_1 = D\eta D - G_0\eta G_0,$


    $G_2 = -\frac{1}{2}\left(G_0\eta^2 D^2 - 2G_0\eta G_0\eta G_0 + D^2\eta^2 G_0\right),$


    where $D = -i\partial_x$ and $G_0 = D\tanh(hD)$. Terms such as $\tanh(hD)$ are
    understood as pseudo differential operators, i.e. they are defined through associated
    Fourier multipliers. We remark that higher order terms of the Taylor expansion
    of $G$ involve increasingly higher order derivatives. Although the Taylor series
    of $G$ exists for $\eta$ with a limited (even finite) degree of smoothness, the
    formulas for $G_i(\eta)$ are not valid in such cases, or must be interpreted very
    carefully, as a whole, rather than as a sum of individual operators. Even when
    $\eta$ is real analytic, there is a delicate balance existing among the terms
    that leads to a high degree of cancellation [23]. This causes numerical difficulties
    in finite precision arithmetic. We explore the extent of these cancellations in
    arbitrary precision arithmetic in §3. Of course, many of these problems can be
    avoided by flattening the domain through a change of variables [7, 17, 23], or
    using boundary integral methods to compute the DNO [31, 32]. However, the original
    Craig–Sulem expansion remains of theoretical interest, and is the one most closely
    related to the AFM approach, discussed next.


    # 2.2. AFM Implicit Representation.


    Following [1, 2], we now derive the global relation of the Ablowitz–Fokas–Musslimani
    reformulation of the water-wave problem. The distinguishing feature of this reformulation
    is the implicit nonlocal characterization of the Dirichlet–Neumann operator. Solving
    the resulting integral equation gives the full DNO, effectively summing all the
    terms in the expansion of Craig & Sulem without having to compute them order by
    order.


