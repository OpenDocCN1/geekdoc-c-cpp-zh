- pgno: 45
  md: '# 2.3. Conservation Laws for the NV equation.


    In order to present the conservation laws for (1.1), we need to recall some ideas
    from the inverse scattering method. A rigorous derivation of the conservation
    laws for smooth potentials of conductivity type is given below in section 3.


    Suppose that $q \in L^p(\mathbb{R}^2)$ for some $p \in (1,2)$. The scattering
    data, or scattering transform $\mathbf{t}: \mathbb{C} \to \mathbb{C}$ of $q$ is
    defined via Faddeev''s [18] complex geometric optics (CGO) solutions, which we
    now recall. Let $z = x + iy$ and $k = k_1 + ik_2$. For $k \in \mathbb{C}$ with
    $k \neq 0$, the function $\psi(z,k)$ is the exponentially growing solution of
    the Schrödinger equation


    ```

    (2.8) $(-\Delta + q)\psi(\cdot,k) = 0$

    ```


    with asymptotic behavior $\psi(z,k) \sim e^{ikz}$ in the following sense: for
    $\tilde p$ defined by $\frac{1}{\tilde p} = \frac{1}{p} - \frac{1}{2}$, we have


    ```

    (2.9) $e^{-ikz}\psi(z,k) - 1 \in L^{\tilde p}(\mathbb{R}^2) \cap L^{\infty}(\mathbb{R}^2)$.

    ```


    It is more convenient to work with the normalized complex geometric optics solutions
    (NCGO) $\mu(z,k)$ defined by


    ```

    (2.10) $\mu(z,k) = \psi(z,k)e^{-ikz}$.

    ```


    A straightforward computation shows that $\mu$ obeys the equation


    ```

    (2.11) $\bar\partial(\partial + ik)\mu = \frac{1}{4}q\mu, \qquad \mu(\cdot,k)
    - 1 \in L^{\tilde p} \cap L^{\infty}$.

    ```


    One can reduce the problem (2.11) to an integral equation of Fredholm type (see
    the discussion in section 3). Faddeev''s Green''s function $g_k$ is the fundamental
    solution for the equation


    ```

    $-4\bar\partial(\partial + ik)u = f$

    ```


    (the factor of $-4$ is chosen so that, if $k = 0$, the equation reduces to $-\Delta
    u = f$ whose fundamental solution is the logarithmic potential; see Appendix A.1
    for details). One has


    ```

    (2.12) $\mu = 1 - g_k * (q\mu)$

    ```'
