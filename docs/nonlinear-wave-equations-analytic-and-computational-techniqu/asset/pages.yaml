    # 5. Numerics


    In this section, we numerically test the relationship between the pressure and
    the free-surface for numerically computed traveling wave solutions. We consider
    two separate problems: the forward problem (given η(x), find p(x, z₀)), and the
    inverse problem (given p(x, z₀), find η(x)). In the following sections, we first
    consider this forward problem where we assume that η is known. Using the pressure
    data generated by this forward problem, we demonstrate the inverse relationship
    can be numerically solved. That is, given this pressure data p(x), we can numerically
    solve (28) in order to recover the original free surface η.


    # 5.1. The Forward Problem.


    As mentioned in the previous section, the forward problem is direct. In particular,
    given η, (20) provides a direct map from η → ℋ(η){ηₓ} which then allows us to
    directly map to p. In previous work, the wave-speed c must be known in order to
    compute the fully nonlinear relationship between the surface elevation η(x) and
    the pressure p(x). The ideas presented in the previous sections work both with
    and without knowledge of the wave speed. Here, we outline the numerical procedures
