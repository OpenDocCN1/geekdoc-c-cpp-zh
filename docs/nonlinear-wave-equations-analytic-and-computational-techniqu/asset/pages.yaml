  md: 'traveling waves in the one-dimensional setting[DO]. In addition to recovering
    expected results (i.e. waves in deep water are modulationally unstable with respect
    to long-wave perturbations), we found there are specific classes of quasi-periodic
    perturbations that yield instabilities in shallow water, even for small-amplitude
    waves.


    As stated, the above results are limited to one-dimensional periodic traveling
    waves perturbed by one-dimensional periodic or quasi-periodic disturbances. As
    an intermediate step between investigating the one-dimensional and the two-dimensional
    problem, different researchers have considered the effects of two-dimensional
    perturbations on one-dimensional traveling wave solutions. In other words, they
    have investigated the transverse instabilities of the one-dimensional solutions.
    Early notable work on the transverse instabilities of solutions of the Euler equations
    was conducted by Bryant[Bry78]. Using a set of truncated nonlinear approximations
    to the Euler equations for water of finite depth, he explored the instabilities
    using a small number of wave interactions. Several years later, McLean presented
    the first results on the transverse instabilities of one-dimensional solutions
    to the Euler equations for water of finite depth. McLean et al. (Refs. [McL82a,
    McL82b, MMM⁺81]) considered perturbations of the form


    $$\eta_1=e^{-\sigma t}e^{ipx+iqy}\sum_{j=-\infty}^{\infty}a_je^{ijx},\quad\text{and}$$


    $$\phi_1=e^{-\sigma t}e^{ipx+iqy}\sum_{j=-\infty}^{\infty}b_je^{ijx}\frac{\cosh(\kappa_j(z+h))}{\cosh(\kappa_jh)}.$$


    Here η₁ and ϕ₁ are the perturbations of the surface elevation and the velocity
    potential in the interior of the fluid, respectively. Substituting these expansions
    into the original equations of motion, McLean calculated the growth rates −σ associated
    with the linearized problem for waves in deep water. He found that in deep water,
    small-amplitude one-dimensional waves are most unstable to one-dimensional perturbations.
    However, as the amplitude of the wave is increased, the wave becomes more unstable
    with respect to two-dimensional perturbations. More recently, McLean’s stability
    calculations have been extended to waves of even greater amplitude by Kharif &
    Ramamonjiarisoa[KR90] and to waves in water of shallower depths by Francius &
    Kharif[FK06].


    The purpose of this paper is to demonstrate that we can replicate these transverse
    instability results using the nonlocal formulation of Ablowitz, Fokas, and Musslimani[AFM06]
    with less computational effort. In order to numerically calculate the spectral
    instabilities, we must determine (i) one-dimensional traveling wave solutions,
    and (ii) the growth rates associated with two-dimensional perturbations of these
    one-dimensional traveling waves. We have recently shown that one-dimensional periodic
    traveling wave solutions can be determined by numerically solving the single equation


    $$\int_0^L e^{-ikx}\sqrt{(1+\eta_x^2)(c^2-2g\eta)}\,\sinh\bigl(k(\eta+h)\bigr)\,dx=0,$$


    ∀k ∈ 2π/L ℤ₀, for the surface elevation η(x) moving with wave-speed c, see Ref.
    [DO]. Using the numerical scheme outlined in Deconinck & Oliveras[DO], we determine
    one-dimensional traveling wave solutions for various wave amplitudes and'
