  md: 'We represent the 2π-periodic portion of the eigenfunctions q̄₁ and η̄₁ by their
    Fourier series. In other words,


    ```

    q̄₁(x) = Σ_{m=-∞}^{∞} Q̂_m e^{imx}, η̄₁(x) = Σ_{m=-∞}^{∞} N̂_m e^{imx}.

    ```


    Additionally, we represent the periodic variable coefficient functions by their
    Fourier series as well. Substituting the series representations into the Floquet
    decomposition, we are able to determine a bi-infinite matrix eigenvalue problem,
    where the eigenvectors are the Fourier coefficients Q̂_j and N̂_j for j ∈ {0,
    ±1, ±2, …}. The Fourier decomposition proceeds in a straightforward manner for
    the local equation. Substituting the Fourier expansions into the local equation,
    we obtain


    ```

    λ( Σ_{m=-∞}^{∞} F̂_{3,n-m} N̂_m - Q̂_n ) = -g N̂_n + Σ_{m=-∞}^{∞} (iμ + im) F̂_{1,n-m}
    N̂_m + Σ_{m=-∞}^{∞} F̂_{2,n-m} (iμ + im) Q̂_m, (3.12)

    ```


    for n ∈ ℤ - {0}, where the coefficients F̂_{j,n} are given by the following expressions


    ```

    F̂_{1,n} = ∫₀^{L₁} e^{-2i n π x / L₁} f(η₀, q₀) (q₀,x - c - η₀,x f(η₀, q₀)) dx,

    F̂_{2,n} = ∫₀^{L₁} e^{-2i n π x / L₁} (q₀,x - c - η₀,x f(η₀, q₀)) dx,

    F̂_{3,n} = ∫₀^{L₁} e^{-2i n π x / L₁} f(η₀, q₀) dx.

    ```


    For the nonlocal equation, we employ a similar strategy as used elsewhere[DO].
    There are two slight differences. First, the hyperbolic sine and cosine terms
    depend on κ = √(k_x² + ρ²) instead of k_x directly. Second, there is an additional
    term depending on the perturbation of the velocity potential and on ρ. Substituting
    the Fourier series into the nonlocal equation and representing all variable coefficients
    by their Fourier series representation, we have


    ```

    [ Σ_{j=-∞}^{∞} Σ_{m=-∞}^{∞} ( Ĝ_{1,j}^{(k_x)} + i c (iμ + im) Ĝ_{2,j}^{(k_x)}
    ) N̂_m + Σ_{j=-∞}^{∞} Σ_{m=-∞}^{∞} ( (k_x/κ)(iμ + im) + i ρ²/κ ) Ĝ_{3,j}^{(k_x)}
    Q̂_m ] ⟨E_{jm}⟩ = i λ Σ_{j=-∞}^{∞} Σ_{m=-∞}^{∞} Ĝ_{2,j}^{(k_x)} N̂_m ⟨E_{jm}⟩
    (3.13)

    ```'
