  md: "Here $E$ is a real parameter, the unknown function $q$ is a real-valued function\
    \ of two space variables and time, and the operators $\\partial$ and $\\overline{\\\
    partial}$ are given by\n\n```\n$\\partial = \\frac{1}{2}\\left(\\partial_{x_1}\
    \ - i\\partial_{x_2}\\right)$\n\n$\\overline{\\partial} = \\frac{1}{2}\\left(\\\
    partial_{x_1} + i\\partial_{x_2}\\right).$\n```\n\nAt zero energy ($E = 0$) it\
    \ can also be written (after trivial rescalings) as\n\n```\n(1.2) $q_t = -\\partial_z^3\
    \ q - \\overline{\\partial}^3 q + 3\\partial_z(q\\nu) + 3\\overline{\\partial}_z(q\\\
    bar{\\nu}),\\quad \\text{where } \\overline{\\partial}_z\\nu = \\partial_z q.$\n\
    ```\n\nThe NV equation (1.2) generalizes the celebrated Korteweg-de Vries (KdV)\
    \ equation\n\n```\n$q_t = -6 q q_x - q_{xxx}$\n```\n\nin the sense that, if $q(x_1,t)$\
    \ solves KdV and $\\nu_{x_1}(x_1,t) = -3 q_{x_1}(x_1,t)$, then $q(x_1,t)$ solves\
    \ NV.\n\nThe NV equation was introduced by Novikov and Veselov in [64, 65] as\
    \ one of a hierarchy of completely integrable equations that generate isospectral\
    \ flows for the two-dimensional Schrödinger operator at fixed energy $E$. Indeed,\
    \ the Novikov-Veselov equation (1.1) admits the Manakov Triple Representation\
    \ [48]\n\n```\n(1.3) $\\dot{L} = [A, L] - B L$\n```\n\nwhere\n\n```\n$L = -\\\
    Delta + q - E,$\n\n$A = 8\\left(\\partial^3 + \\overline{\\partial}^3\\right)\
    \ + 2\\left(w\\partial + \\overline{w}\\overline{\\partial}\\right),$ \n\n$B =\
    \ -2\\left(\\partial w + \\overline{\\partial}\\overline{w}\\right).$\n```\n\n\
    Here $B$ is the operator of multiplication by the function $2\\left(\\partial\
    \ w + \\overline{\\partial}\\overline{w}\\right)$. That is, a pair $(q,w)$ solves\
    \ the NV equation if and only if the operator equation (1.3) holds.\n\nThe Manakov\
    \ triple representation implies that the NV equation is, formally at least, a\
    \ completely integrable equation. Thus one expects that, for a suitable notion\
    \ of “scattering data for $L$ at fixed energy $E$, ” the associated scattering\
    \ transform will linearize the flow.\n\nFor nonzero energy $E$ and potentials\
    \ $q$ which vanish at infinity, the scattering transform and inverse scattering\
    \ method was developed by P. Grinevich, R. G. Novikov, and S.-P. Novikov (see\
    \ Kazeykina’s thesis [36] for an excellent survey and see [23, 26–28] for the\
    \ original papers). Roughly and informally, there is a scattering transform $\\\
    mathcal{T}$ which maps the potential $q$ to scattering data that obey a linear\
    \ equation if $q$ obeys the NV equation, and an inverse scattering transform $\\\
    mathcal{Q}$ which inverts $\\mathcal{T}$, so that the function\n\n```\n(1.4) $q(x,\\\
    tau) = \\mathcal{Q}\\left[e^{i\\tau\\left(\\partial^3 + \\overline{\\partial}^3\\\
    right)}\\mathcal{T}(q_0)\\right](x)$\n```"
