  md: '# THE NOVIKOV-VESELOV EQUATION


    To examine the linear contributions we introduce a function


    q(t, x, y) = exp(i (ξ x + η y)).


    Then the ∂̄ equation (4.2) is solved by


    u_1(t, x, y) = \frac{ξ^2 - η^2}{ξ^2 + η^2} exp(i (ξ x + η y))

    u_2(t, x, y) = \frac{-2 ξ η}{ξ^2 + η^2} exp(i (ξ x + η y)),

    and thus the linear part of the NV equation (4.1)

    \dot q = - \frac{1}{4} \frac{\partial^3 q}{\partial x^3} + \frac{3}{4} \frac{\partial^3
    q}{\partial x \partial y^2} + E \frac{3}{4} \nabla \cdot \mathbf{u}

    is transformed into a elementary linear ODE for the Fourier coefficient c(t)

    4 \frac{d}{dt} c(t) = i (ξ^3 - 3 ξ η^2) \left(1 - \frac{3E}{ξ^2 + η^2}\right)
    c(t).


    Assuming a Fourier approximation of the solutions


    q(t, x, y) = \sum_{j,k=0}^{N-1} c_{j,k}(t) exp(i π (k x + j y)/L )


    this leads to a coupled system of ODEs for the Fourier coefficients c_{j,k}(t).
    We use a Crank–Nicolson scheme for the linear part of NV and an explicit method
    for the nonlinear contribution div(q u). For details see [13,14].


    There is a close connection between plane wave solutions to NV and solutions to
    KdV (see [13]):


    REMARK 4.1. Assume the solutions to NV are planar waves


    q(t, s) = q(t, x, y) = q(t, n_1 s, n_2 s)

    u_i(t, s) = u_i(t, x, y) = u_i(t, n_1 s, n_2 s)


    for some direction vector n = (n_1, n_2) = (cos(α), sin(α)). Then the bounded
    solutions to the ∂̄ equation (4.2) are given by


    u_1(t, s) = +(n_1^2 - n_2^2) q(t, s) + c_1


    u_2(t, s) = -(2 n_1 n_2) q(t, s) + c_2


    for arbitrary constants c_1, c_2, and the NV equation (4.1) reduces to an equation
    similar to the KdV equation,


    (4.3) \frac{4}{\kappa} q_t = -q'''''' + 6 q q'' + \frac{3\beta}{\kappa} q''


    with κ = cos(3α) and β = -κ E + c_1 n_1 + c_2 n_2. If v(t, s) denotes a solution
    to the standard KdV equation


    (4.4) \dot v(t, x) = -v''''(t, x) + 6 v(t, x) v''(t, x),


    we obtain explicit solutions to NV by


    q(t, s) = v(\frac{\kappa}{4} t, s + k_1 t) - k_2 = v(\frac{\kappa}{4} t, s + \frac{3}{4}
    (c_1 n_1 + c_2 n_2) t ) + \frac{E}{2}.'
