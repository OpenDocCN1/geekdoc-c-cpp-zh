  md: '# Remark A.6. Note that with s = q in (A.10) we have


    ‖P(vf)‖_p ≤ C_p ‖v‖_2 ‖f‖_p.


    For any f ∈ L^{2p/(p+2)}(ℝ²), Lemma A.4 together with (A.4) imply that u = Pf
    solves ∂̄u = f in distribution sense. Suppose, on the other hand, that u ∈ L^p(ℝ²)
    for some p ∈ [1,∞) and ∂̄u = 0 in distribution sense. It follows that ∂∂̄u = 0
    in distribution sense, so that u ∈ C^∞ by Weyl’s lemma. Thus, u is actually holomorphic,
    so u vanishes identically by Liouville’s Theorem. From this fact and (A.4), we
    deduce:


    # Lemma A.7. Suppose that p ∈ (2,∞), that u ∈ L^p(ℝ²), that f ∈ L^{2p/(p+2)}(ℝ²),
    and that ∂̄u = f in distribution sense. Then u = Pf. Conversely, if f ∈ L^{2p/(p+2)}(ℝ²)
    and u = Pf, then ∂̄u = f in distribution sense.


    The following expansion for solutions of ∂̄u = f when f is rapidly decaying gives
    rise to the large-k asymptotic expansion for μ(z,k).


    # Lemma A.8. Suppose that p ∈ (2,∞), that u ∈ L^p(ℝ²), that f ∈ L^{2p/(p+2),N}(ℝ²),
    and that ∂̄u = f. Then


    z^N [ u(z) - Σ_{j=0}^{N-1} 1/z^{j+1} ∫ ζ^j f(ζ) dm(ζ) ] ∈ L^p(ℝ²).


    # Proof. An immediate consequence of the estimate (A.7), Lemma A.7 and the formula


    1/(z - ζ) = 1/z Σ_{j=0}^{N-1} (ζ/z)^j + 1/z^N ζ^N/(z - ζ).


    # Remark A.9. If f ∈ S(ℝ²) and depends smoothly on parameters, then the asymptotic
    expansion holds pointwise and is differentiable in the parameters.


    The principal value integral (A.6) identifies S as a Calderón-Zygmund type integral
    operator. We have (see, for example, [3], §4.5.2):


    # Lemma A.10. Suppose that p ∈ (1,∞). The operator S extends to a bounded operator
    from L^p(ℝ²) to itself, unitary if p = 2. Moreover, if ∇φ belongs to L^p(ℝ²) for
    p ∈ (1,∞), then S(∂φ) = ∂̄φ.


