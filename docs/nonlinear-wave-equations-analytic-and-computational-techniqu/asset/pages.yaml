    In addition to the convergence rates, we also compared calculated growth rates
    with previously known results. Tables 2 & 3, show comparisons of the calculated
    growth rates with the results from Francius & Kharif[FK06] when h = .3 and h =
    .5. While there are some minor discrepancies between the final calculated growth
    rates for the chosen values of (μ, ρ), these discrepancies are easily explained
    since (1) the amplitudes of the traveling waves are slightly different, and (2)
    the average value of the traveling waves in Francius & Kharif [FK06] are nonzero,
    whereas the average value of the traveling waves using the nonlocal formulation
    are set to be zero. Furthermore, the results demonstrate the same patters of instabilities
    which were found by Francius & Kharif[FK06]. For example, they showed that for
    a = 0.1 and h = 0.3 they dominant instability corresponded to a Class I instability
    (when n = 6). Similarly, we found that the same trend exists for our calculations
    as well (see Table 2).


