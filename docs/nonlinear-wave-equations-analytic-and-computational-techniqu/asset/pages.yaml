    \ about the stability of the underlying traveling wave by determining the solutions\
    \ of this generalized eigenvalue problem. If any solutions $U(x)$ exist for which\
    \ the corresponding $\\lambda$ has a positive real part, the linear approximation\
    \ of the solution grows exponentially in time and the perturbed solution will\
    \ diverge from the stationary solution in the linear approximation. With this\
    \ intuition in mind, the concept of spectral stability, as applicable to the generalized\
    \ eigenvalue problem (3.8) is defined as\n\n# DEFINITION 3.1 (Spectral Stability).\
    \ A one-dimensional periodic traveling wave solution $(\\eta_0(x),q_0(x),c)$ of\
    \ Equations 2.7 and 2.8 (and thus of the Euler equations) is spectrally stable\
    \ with respect to two-dimensional perturbations parameterized by $\\rho$ if no\
    \ element of the spectrum for the generalized eigenvalue problem 3.8 has strictly\
    \ positive real part.\n\nIn order to use this definition, we recall the definition\
    \ of the spectrum of the generalized eigenvalue problem.\n\n# DEFINITION 3.2 (Spectrum\
    \ of the Generalized Eigenvalue Problem). The spectrum of the generalized eigenvalue\
    \ problem $\\lambda\\mathcal{L}_1U(x)=\\mathcal{L}_2U(x)$ is given by\n\n```\n\
    (3.9) $\\sigma(\\mathcal{L}_2,\\mathcal{L}_1)=\\{\\lambda\\in\\mathbb{C}:||U(x)||<\\\
    infty\\}$,\n```\n\nwhere $U(x)$ solves $\\lambda\\mathcal{L}_1U(x)=\\mathcal{L}_2U(x)$.\n\
    \nIn order to examine spectral stability or instability, we need to locate the\
    \ spectrum of the generalized eigenvalue problem 3.8. By definition of the spectrum,\
    \ we determine those values of $\\lambda\\in\\mathbb{C}$ for which Equation 3.8\
    \ has bounded solutions. Since the coefficient functions of Equation (3.8) are\
    \ periodic in $x$ with period $L_1$, we decompose the perturbations further using\
    \ Floquet’s Theorem, see for instance Ref. [DK06]. Thus, both $\\tilde{q}_1(x)$\
    \ and $\\tilde{\\eta}_1(x)$ can be written as\n\n```\n$\\tilde{q}_1(x)=e^{i\\\
    mu x}\\bar{q}_1(x),\\text{and}\\ \\tilde{\\eta}_1(x)=e^{i\\mu x}\\bar{\\eta}_1(x)$,\n\
