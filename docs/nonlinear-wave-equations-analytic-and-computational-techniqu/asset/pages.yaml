- pgno: 189
  md: 'dimensions for periodic problems as the lattice sums involved have an explicit
    analytical representation. However, in three dimensions, boundary integral methods
    are considerably more difficult to implement.


    The overall goal of the present work is to understand the relative effectiveness
    and accuracy of each method for two-dimensional fluids. The CS, AFM and AFM* methods
    involve highly ill-conditioned intermediate calculations, so much of the paper
    focuses on whether accurate results can be obtained if multiple-precision arithmetic
    is employed in these intermediate calculations. In particular, for timestepping
    the water wave, it is important that the methods work if the input data is only
    known with limited accuracy — additional precision in intermediate calculations
    is permissible as long as the output is roughly as accurate as the input. Given
    the care required to obtain high accuracy in the present work, one must be cautious
    about using these methods in double-precision without carefully monitoring condition
    numbers and cancellation of digits.


    An outline of the paper is as follows. In § 2, we briefly introduce the CS operator
    expansion, the AFM and AFM* nonlocal formulations, and the boundary integral and
    TFE representations of the DNO. In §3 we present comparisons of the first four
    of these methods for specific choices of the free surface η. Here we seek to quantify
    how accurate the CS, AFM and AFM* methods are. We assume the exact DNO is obtained
    from the boundary integral method, and, where suitable, perform computations using
    higher precision. Section 3.1 discusses the subtle cancellation properties associated
    with the series representation of Craig & Sulem. In §3.2, we present a specific
    example where the AFM* method (in its usual interpretation as a system of equations
    for the coefficients of a certain series) is guaranteed to fail, and other instances
    where AFM and AFM* successfully converge to the correct Neumann data. The subtle
    cancellation of the CS expansion is mirrored by the rapidly decaying singular
    values associated with the AFM/AFM* methods. This leads us to consider regularized
    versions of AFM/AFM* that involve oversampling the AFM basis functions to accurately
    approximate a Gram-Schmidt orthogonalization procedure via QR factorization or
    the singular value decomposition. In the SVD approach, we also investigate the
    use of a pseudo-inverse cutoff threshold. We find that the AFM basis functions
    can be more efficient at representing solutions than a Fourier basis, but with
    the drawback of poor conditioning. Finally, in §3.3, we discuss the behavior of
    all the methods on examples relevant to water waves.


    # 2. Representations of the Dirichlet–Neumann operator


    As mentioned in the introduction, the Dirichlet–Neumann operator plays an important
    role in the mathematical formulation of the motion of surface gravity waves. To
    efficiently compute the time-dependent motion, we require a fast and efficient
    means to solve Laplace’s equation, or alternatively, a direct method to compute
    the Dirichlet–Neumann operator. In this section, we outline five commonly used
    approaches. The first, due to Craig & Sulem [11], involves expanding the DNO in
    a Taylor series. The second, due to Ablowitz, Fokas and Musslimani [1], involves
    deriving a global relation between the Dirichlet and Neumann data that can be
    used as an integral equation to solve for the Neumann data. The third [2,12,25,28]
    is a dual variant of the second, formulated more directly. The fourth is a boundary
    integral collocation method [5,6,16,19,20,31,32]. And the fifth is the transformed
    field expansion method of Bruno & Reitich [7] and Nicholls & Reitich [23,24].'
