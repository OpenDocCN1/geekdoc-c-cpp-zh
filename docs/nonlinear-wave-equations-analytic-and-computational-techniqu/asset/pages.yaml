- pgno: 83
  md: '# Transverse instability of plane wave soliton solutions of the Novikov-Veselov
    equation


    Ryan Croke, Jennifer L. Mueller, and Andreas Stahel


    ABSTRACT. The Novikov-Veselov (NV) equation is a dispersive (2+1)-dimensional
    nonlinear evolution equation that generalizes the (1+1)-dimensional Korteweg-deVries
    (KdV) equation. This paper considers the instability of plane wave soliton solutions
    of the NV equation to transverse perturbations. To compute time evolutions numerically,
    a hybrid semi-implicit/spectral scheme was developed, applicable to other nonlinear
    PDE systems. Numerical simulations of the evolution of transversely perturbed
    plane wave solutions are presented using the spectral scheme. It is established
    that plane wave soliton solutions are not stable for transverse perturbations.


    # 1. Introduction


    The Novikov-Veselov (NV) equation for u(z,t)=u(x,y,t) was introduced in the periodic
    setting by Novikov and Veselov [28] in the form


    (1.1)    u_t = -∂_z^3 u - ∂̄^3 u + 3∂_z(u f) + 3∂̄_z(u f̄),   where ∂̄_z f = ∂_z
    u,


    with ∂̄_z = ½(∂_x + i∂_y), ∂_z = ½(∂_x - i∂_y). It was derived algebraically from
    a Lax triple, and from this point of view is considered the most natural generalization
    of the KdV equation [5].


    While physical applications of the NV equation are unknown, the dispersionless
    NV equation models the propagation of high frequency electromagnetic waves in
    certain nonlinear media [24,25]. It is also related to two other (2+1)-dimensional
    integrable systems which have been more widely studied, including the Davey-Stewartson
    II equation, which describes the complex amplitude of surface waves in shallow
    water, and was proved in [31] to be completely integrable.


    Novikov and Veselov showed that the equation (1.1) is completely integrable [28].
    Perry [29] gave an implementation of the completely integrable method for the
    Novikov-Veselov equation at zero energy that uses the inverse scattering map for
    the Davey-Stewartson equation together with Bogdanov’s Miura transform.'
