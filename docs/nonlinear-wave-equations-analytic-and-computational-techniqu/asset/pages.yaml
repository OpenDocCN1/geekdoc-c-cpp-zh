  md: 'where


    m(k, τ) = exp(iτ(k³ + \bar{k}³)).


    On the other hand,


    (2.20) s(k, τ) = s(k, 0).


    Here t(k, τ) and s(k, τ) are computed from the solution μ(z, k, τ) of


    (2.21) \bar{∂}_z (∂_z + i k) μ(z, k, τ) = 1/4 q(z, τ) μ(z, k, τ).


    A rigorous proof of (2.19) and (2.20) for smooth potentials of conductivity type
    is given in section 3 below.


    If q is smooth, rapidly decreasing, and either critical or subcritical, the Schrödinger
    potential q can be recovered using the \bar{∂}-method of Beals and Coifman [5]
    (see [44] for the critical case, and [54] for the subcritical case). Both of these
    papers use techniques developed by Nachman [58] in the context of the inverse
    conductivity problem.


    We can now derive a set of conservation laws for the NV equation by using the
    large-k asymptotic expansion of s(k). Since s(k, τ) is conserved we set τ = 0
    and suppress τ-dependence henceforward. We will give a formal derivation of the
    conserved quantities by using a large-k asymptotic expansion of μ(z, k) and inserting
    this expansion into the formula (2.16). Since s(k) is conserved, the coefficients
    of that large-k expansion are also conserved quantities. For the moment, we assume
    that μ(z, k) admits a large-k expansion of the form


    (2.22) μ(z, k) ∼ 1 + Σ_{j=1}^{∞} a_j(z)/k^j.


    We will derive such an expansion for smooth potentials of conductivity type in
    the next section (see Lemma 3.7). It is expected to hold in general.


    Substituting the series (2.22) into (2.21), we may solve the resulting system
    for the coefficients a_j


    (2.23) - Σ_{j=1}^{∞} Δ a_j(z)/k^j - Σ_{j=1}^{∞} 4 i \bar{∂} a_j(z)/k^{j-1} + q
    Σ_{j=1}^{∞} a_j(z)/k^j = -q.


    We find


    a₁ = 1/(4i) \bar{∂}^{-1} q.


    A recursion formula can then be derived,


    (2.24) a_{j+1} = 1/(4i) \bar{∂}^{-1} (-4 \bar{∂} ∂ a_j + q a_j) = i ∂ a_j + 1/(4i)
    \bar{∂}^{-1} (q a_j).


    From this, it is clear that


    s(k) ∼ Σ_{j=0}^{∞} s_j / k^j,   s_j = ∫_{ℝ²} q(z) a_j(z) dz.'
