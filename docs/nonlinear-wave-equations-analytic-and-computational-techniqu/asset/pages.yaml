- pgno: 40
  md: '+   (i) subcritical if and only if Lψ = 0 has a strictly positive solution
    of the form c log(|x|) + d + O(|x|⁻¹) with c ≠ 0,

    +   (ii) critical if Lψ = 0 if and only if Lψ = 0 has a strictly positive bounded
    solution, and

    +   (iii) supercritical if Lψ = 0 has no strictly positive solutions.


    Extending Murata’s result, Gesztesy and Zhao [20] used Brownian motion techniques
    to prove the following optimal result for critical potentials. Suppose that q
    is a real-valued measurable function with


    lim_{α↓0} { sup_{x∈ℝ²} ∫_{|x−y|≤α} ln(|x−y|)⁻¹ |q(y)| dy } = 0


    and


    ∫_{|y|≥1} ln(|y|) |q(y)| dy < ∞.


    Then q is critical if and only if there exists a positive, bounded distributional
    solution ψ of Hψ = 0. These two conditions mean essentially that


    q(x) = O( |x|⁻² (ln(|x|))⁻²⁻ε )


    for some ε > 0. We refer the reader to [20] for further references and history.


    As we will see, corresponding to the trichotomy in Definition 1.1, the scattering
    transform of q is either mildly singular, nonsingular, or highly singular. This
    is illustrated dramatically in the examples studied by Music, Perry, and Siltanen
    [56], described in Section 5 below. One would expect the singularities of the
    scattering transform to be mirrored in the behavior of solutions to the NV equation.
    We will discuss the following conjecture, and some partial results toward its
    resolution, in the last section of this paper:


    # Conjecture 1.2. The Novikov-Veselov equation (1.1) has a global solution for
    critical and subcritical initial data, but its solution may blow up in finite
    time for supercritical initial data.


    To elucidate this conjecture, it is helpful to recall how the scattering transform
    for Schrödinger’s equation is connected with Calderón’s inverse conductivity problem
    [15]. Critical potentials are also known in the literature as “potentials of conductivity
    type” because of their connection with the Calderón inverse conductivity problem:
    suppose one wishes to determine the conductivity σ of a bounded plane region Ω
    by boundary measurements. The potential u of Ω with voltage f on the boundary
    is determined by the equation


    ∇·(σ∇u) = 0

    u|_{∂Ω} = f


    Calderón’s problem is to reconstruct σ from knowledge of the Dirichlet-to-Neumann
    map, defined as follows. If Ω has smooth boundary then the above boundary value
    problem has a unique solution u for given f ∈ H^{1/2}(∂Ω), so that


    Λ_σ f = σ ∂u/∂ν|_{∂Ω}


    is uniquely determined. The map Λ_σ : H^{1/2}(∂Ω) → H^{-1/2}(∂Ω) is the Dirichlet-to-Neumann
    map.'
