    1 + Tkμ. Hence, uniqueness of solutions is equivalent to invertibility of (I −
    Tk), and the exceptional set is exactly the set of points k for which (I − Tk)
    fails to be invertible. It can be shown that Tk is a compact linear operator from
    Lp to itself'
