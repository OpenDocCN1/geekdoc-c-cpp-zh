- pgno: 122
  md: 'with U an N-periodic continuous function, i.e. U ∈ C(T^N), and k̄, ω̄, ᾱ ∈
    ℝ^N. Throughout the manuscript, we will use the phrase “solitary waves” in a broad
    sense to describe waves that, most of the time, remain well-separated from one
    another and propagate with nearly constant speed and shape. “Stokes waves” will
    refer to periodic progressive solutions of the free-surface Euler equations of
    permanent form, or waves that began at t = 0 as a linear superposition of such
    traveling waves. They comprise a special class of solitary waves. “Solitons” will
    refer specifically to superpositions of sech² solutions of the KdV equation on
    the whole line, while “cnoidal solutions” will refer to their spatially periodic,
    multi-phase counterparts; see §5 for elaboration.


    It was found in [49] that decreasing the fluid depth causes standing waves to
    transition from large-scale symmetric sloshing behavior in deep water to pairs
    of counter-propagating solitary waves that collide repeatedly in shallow water.
    In the present work, we consider unidirectional waves of different amplitude that
    collide due to taller waves moving faster than shorter ones. We present two examples
    of solutions of this type: one where the resulting dynamics is fully time-periodic;
    and one where it is relative-periodic, returning to a spatial phase shift of the
    initial condition at a later time. Both examples exhibit behavior typical of collisions
    of KdV solitons. In the first, one wave is significantly larger than the other,
    and completely subsumes it during the interaction. In the second, the waves have
    similar amplitude, with the trailing wave bumping into the leading wave and transferring
    energy without fully merging.


    Despite these similarities, the amplitude of the waves in our examples are too
    large for the assumptions in the derivation of the KdV equation to hold. In particular,
    the larger wave in the first example is more than half the fluid depth in height,
    and there is significant vertical motion of the fluid when the waves pass by.
    A detailed comparison of the Euler and KdV equations for waves with these properties
    is carried out in §5. A review of the literature on water wave collisions and
    the accuracy of the KdV model of water waves is also given in that section.


    Rather than compute such solutions by increasing the amplitude from the linearized
    regime via numerical continuation, as was done for counter-propagating waves in
    [49], we use collisions of right-moving Stokes waves as starting guesses. The
    goal is to minimally “tune” the background radiation generated by the Stokes collisions
    so that the amount coming out of each collision is identical to what went into
    it. In the first example of §4, we find that the tuned background radiation takes
    the form of a train of traveling waves of smaller wavelength moving to the right
    more slowly than either solitary wave. By contrast, in the counter-propagating
    case studied in [49], it consists of an array of smaller-wavelength standing waves
    oscillating rapidly relative to the time between collisions of the primary waves.
    In the second example of §4, the background radiation is essentially absent, which
    is to say that the optimized solution is free from high-frequency, low-amplitude
    disturbances in the trough, and closely resembles a relative-periodic cnoidal
    solution of KdV. We call the collisions in this solution “elastic” as they repeat
    forever, unchanged up to spatial translation, and there are no features to distinguish
    radiation from the waves themselves. This process of tuning parameters to minimize
    or eliminate small-amplitude oscillations in the wave troughs is reminiscent of
    Vanden-Broeck’s work [45] in which oscillations at infinity could be eliminated
    from solitary capillary-gravity waves by choosing the amplitude appropriately.'
