  md: '![](img/c92a9d81ba7f671c83a4c600d27389fb_205_0.png)


    FIGURE 7. Comparison of the series representation (3.27), (3.28), (3.30) of \mathscr{D}
    and \mathscr{N}, (blue curves), to the exact formulas (3.29), (red markers), for
    \eta(x) = -\varepsilon \cos x, \varepsilon = 0.5. The series was truncated at
    |k| = 64, and the results were plotted at 128 grid points. A centered finite difference
    was used to compute the derivative in (3.28). As expected, the series diverges
    for \frac{\pi}{2} \le x \le \frac{3\pi}{2}, where \eta(x) \ge 0.


    where -K/2 < k < K/2, x_j = 2\pi j/M, and M \ge K. We then compute the singular
    value decomposition A = USV*, with S and V square and U of dimension M \times
    (K - 1), and evaluate


    ```

    (3.32) \qquad \mathscr{N} = U \operatorname{pinv}(S) V^* B^* \partial_x \mathscr{D},
    \qquad (AFM),

    ```


    ```

    (3.33) \qquad \mathscr{N} = -\partial_x B V \operatorname{pinv}(S) U^* \mathscr{D},
    \qquad (AFM^*).

    ```


    Here \partial_x is computed spectrally via the FFT (with no filter). The idea
    here is to sample each column of A and B in (2.7) with enough points that computing
    the SVD of the resulting matrix A in (3.31) is equivalent (up to scaling by \sqrt{M}
    in various places) to computing the SVD of the quasi-matrix A in (2.7), whose
    columns are continuous, L^2 functions:


    ```

    (3.34) \quad A = U S V^*, \qquad U : \mathbb{C}^{K-1} \to L^2, \qquad S : \mathbb{C}^n
    \to \mathbb{C}^n, \qquad V : \mathbb{C}^n \to \mathbb{C}^n.

    ```


    Here A has been truncated to have K - 1 columns, U and V are unitary, S is diagonal
    with positive decreasing entries, and L^2 is equipped with the inner product \langle
    f, g \rangle = \frac{1}{2\pi} \int_0^{2\pi} f \bar{g} dx to avoid factors of \sqrt{2\pi}
    elsewhere. The columns of U form an orthonormal basis for the column-span of A.
    Once sufficient grid resolution is reached, approximating \mathscr{D} and \mathscr{N}
    at the M collocation points leads to accurate approximation throughout (0, 2\pi),
    using trigonometric polynomials to interpolate between grid points. The columns
    of the matrix version of U can be thought of as sampled versions of the columns
    of the quasi-matrix U from (3.34), up to a factor of \sqrt{M}. For smaller values
    of M, trigonometric interpolation becomes less accurate, and the errors can be
    amplified significantly on division by small singular values. We remark that if
    the pseudo-inverse in (3.32) and (3.33) is replaced by an inverse, then one can
    use a QR factorization instead of the SVD to obtain an orthonormal basis U for
    the column span of A. This gives up some flexibility in regularizing the AFM/AFM*
    methods, but is cheaper and has the advantage that the leading basis functions
    do not change if K is increased. This QR approach is equivalent to Gram-Schmidt
    orthogonalization when the columns are sampled sufficiently.'
