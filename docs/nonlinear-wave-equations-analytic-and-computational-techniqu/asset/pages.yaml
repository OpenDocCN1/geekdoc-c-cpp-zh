  md: 'true, since θ is a free parameter that we selected by hand to obtain a small
    value of f for the initial guess. Another open question is whether there are analogues
    for the Euler equations of N-phase quasi-periodic solutions of the KdV equation
    with N ≥ 3. We are confident that the methods of this paper could be used to construct
    degenerate cases of N ≥ 3 solitary water waves colliding elastically in a time-periodic
    or relative-periodic fashion, along the lines of what was done for the Benjamin-Ono
    equation in [3]. Computing more general quasi-periodic dynamics of the form η(x,t)=H(κx+ωt+α),
    φ(x,t)=Φ(κx+ωt+α) with H,Φ∈C(T^N) and κ, ω, α∈R^N seems possible in principle
    using a more sophisticated shooting method to determine H, Φ and ω. Existence
    of such solutions for the Euler equations would show that non-integrable equations
    can also support recurrent elastic collisions even if they cannot be represented
    as N-phase superpositions of elliptic functions.


