  md: '![](img/c92a9d81ba7f671c83a4c600d27389fb_112_0.png)


    FIGURE 2. Plots of the square modulus |u(x,t;ε_N)|² for (x,t) ∈ [0,1] × [0,5]
    corresponding to data A₀(x) = 2 sech x for ε_N = 2/N with N = 10,20,40,60. The
    primary and secondary caustics are clearly visible. The tertiary caustic can also
