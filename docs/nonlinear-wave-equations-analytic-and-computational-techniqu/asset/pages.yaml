  md: '![](img/c92a9d81ba7f671c83a4c600d27389fb_159_0.png)


    FIGURE 9. The real part of the spectrum as a function of the transverse wave number
    ρ for depth h = 1.5 and amplitude a = .1. Computed with N = 16 Fourier modes,
    1000 μ values, and 300 ρ values.


    We begin our investigations in shallow water (h = .5) with a solution of moderate
    amplitude (a = .1). We know that for this particular choice of wave height ak
    = .1 and depth h = .5 the wave is unstable with respect to one-dimensional perturbations[DO].
    Further, as expected, we find that this wave is unstable with respect to two-dimensional
    perturbations as demonstrated in the full spectrum given in Figure 4. Likewise,
    the full spectrum for h = 1.5 is shown in Figure 5. It is important to note that
    the largest real part of the spectrum in both cases is much larger than the largest
    real spectral elements when only one-dimensional perturbations are considered
    (see Ref. [DO] for comparison). This demonstrates that the dominant instabilities
    for these waves are the instabilities that arise from transverse or fully two-dimensional
    perturbations. However, this is not always the case. For h = ∞ and a = .3, we
    found that the dominant instabilities were the result of one-dimensional perturbations.


    # 4.2.1. Maximum Growth Rates as a Function of μ and ρ.


    The full spectra demonstrated in Figures 4 and 5 provide a good visualization
    of the growth rates and frequencies present in the instabilities. We may also
    examine the unstable parts of the spectrum as a function of μ and ρ. First, we
    consider the spectrum as a function of μ. In Figures 6 and 7, we display the real
    part of the spectra for h = .5 and h = 1. Additionally, we show the same spectra
    as a function of ρ in Figures 8 and 9.


    It is important to note that as the values of the parameter ρ are increased, bands
    of large instabilities appear (Figure 8 near ρ = .6 and ρ = 1.25). As ρ increases,
    these bands continue to appear. However, the magnitude of the dominant instability
    in these bands decreases with each successive band. Each of these bands corresponds
    to a specific resonant curve for the trivial solution, demonstrated in Figure
    3.'
