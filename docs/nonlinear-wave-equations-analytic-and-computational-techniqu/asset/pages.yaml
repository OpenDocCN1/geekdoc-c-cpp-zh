    partial_y[u_x-\\circledast]+\\partial_x[\\circledast],$\n\n$u_{yy}=\\phi_{yy}+\\\
    Bigl[1-(1+h^{-1}\\eta)^{-2}\\Bigr]u_{yy},$\n\nwhere $\\circledast=(1+h^{-1}y)(1+h^{-1}\\\
    eta)^{-1}\\eta_x u_y$. Since $\\Delta\\phi=0$, we find that\n\n$\\Delta u=\\partial_x(F_1)+\\\
    partial_y(F_2)+F_3,$\n\nwhere\n\n$F_1=(1+h^{-1}y)E\\eta_x u_y,\\qquad E=(1+h^{-1}\\\
    eta)^{-1},$\n\n$F_2=(1+h^{-1}y)E\\eta_x u_x-(1+h^{-1}y)^2E^2\\eta_x^2 u_y+(1-E^2)u_y,$\n\
    \n$F_3=-h^{-1}E\\eta_x u_x+h^{-1}(1+h^{-1}y)E^2\\eta_x^2 u_y.$\n\nNext, we write\
    \ $\\eta(x)=\\varepsilon f(x)$ and expand $E$ and $E^2$ in powers of $\\varepsilon$\
    \ to conclude that the terms of the series $u(x,y)=\\sum_{n=0}^\\infty \\varepsilon^n\
    \ u_n(x,y)$ satisfy\n\n(2.10) $\\Delta u_0=0,\\qquad u_0(x,0)=\\mathscr{D}(x),$\
    \ \n\n(2.11) $\\Delta u_n=\\partial_x(F_1^n)+\\partial_y(F_2^n)+F_3^n,\\qquad\
    \ u_n(x,0)=0,$\n\nas well as $u_{n,y}(x,-h)=0$ and $u_n(x+L,y)=u_n(x,y)$. Here\n\
