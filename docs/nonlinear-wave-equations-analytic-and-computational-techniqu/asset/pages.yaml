- pgno: 75
  md: 'Associated to $L$ are the Cauchy transform,


    $(P\varphi)(z) = \frac{\partial}{\partial z} (L\varphi)(z),


    the transform


    $(\overline{P}\varphi)(z) = \frac{\partial}{\partial \overline{z}} (L\varphi)(z),


    and the Beurling transform


    $(\mathcal{S}\varphi)(z) = \frac{\partial^2}{\partial z^2} (L\varphi)(z).


    From these definitions and (3.2), it is easy to see that


    (A.4) $P \circ \frac{\partial}{\partial \overline{z}} = \frac{\partial}{\partial
    \overline{z}} \circ P = I$


    where $I$ is the identity on $\mathcal{C}_0^\infty(\mathbb{R}^2)$, and


    (A.5) $\mathcal{S}\left(\frac{\partial \varphi}{\partial \overline{z}}\right)
    = \frac{\partial \varphi}{\partial z}.$


    We have


    $(P\varphi)(z) = \frac{1}{\pi} \int \frac{1}{z - z''} \varphi(z'') \, dm(z''),


    $(\overline{P}\varphi)(z) = \frac{1}{\pi} \int \frac{1}{\overline{z - z''}} \varphi(z)
    \, dm(z''),


    and


    (A.6) $(\mathcal{S}\varphi)(z) = -\frac{1}{\pi} \lim_{\varepsilon \downarrow 0}
    \left( \int_{|z - z''|>\varepsilon} \frac{1}{(z - z'')^2} \varphi(z'') \, dm(z'')
    \right).$


    The following estimates on $P$ extend the Cauchy transform to $L^p$ spaces and
    are standard consequences of the Hardy-Littlewood-Sobolev and Hölder inequalities
    (see Vekua [92] or [3], §4.3). They are used to prove existence and uniqueness
    of solutions to the $\overline{\partial}$ problem that defines the inverse problem.


    # Lemma A.4. (i) For any $p \in (2, \infty)$ and $f \in L^{2p/(p+2)}(\mathbb{R}^2)$,


    (A.7) $\|P f\|_p \le C_p \|f\|_{2p/(p+2)}.$


    (ii) For any $p,q$ with $1 < q < 2 < p < \infty$ and any $f \in L^p(\mathbb{R}^2)
    \cap L^q(\mathbb{R}^2)$, the estimate


    (A.8) $\|P f\|_\infty \le C_{p,q} \|f\|_{L^p \cap L^q}$


    holds. Moreover, $P$ is Hölder continuous of order $(p-2)/p$ with


    (A.9) $|(Pf)(z) - (Pf)(w)| \le C_p |z - w|^{(p-2)/p} \|f\|_p.$


    (iii) If $v \in L^s(\mathbb{R}^2)$ and $q > 2$ with $q^{-1} + 1/2 = p^{-1} + s^{-1}$,
    then for any $f \in L^p(\mathbb{R}^2)$,


    (A.10) $\|P(vf)\|_q \le C_{p,q} \|v\|_s \|f\|_p.$


    # Remark A.5. Since $\mathcal{C}_0^\infty(\mathbb{R}^2)$ is dense in $L^p \cap
    L^q$ and $(Pf)(z) = \mathcal{O}(z^{-1})$ as $|z| \to \infty$ for any $f \in \mathcal{C}_0^\infty(\mathbb{R}^2)$,
    it follows from (ii) that if $f \in L^p \cap L^q$ for $1 < p < 2 < q < \infty$,
    then $Pf \in C_0(\mathbb{R}^2)$, the continuous functions that vanish at infinity.'
