    # 4. Eliminating the wave-speed


    The expressions derived in the previous section relate the pressure at any point
    (x, z) inside the fluid to the free surface η by substituting (15 -16) into (6).
    However, the resulting expression for the pressure requires knowledge of the wave-speed
    c. Specifically, on substituting (15 -16) into (6) (and using (8)), equation (6)
    represents a single equation in terms of three unknown quantities: η, p, and c.
    A special case of this equation is obtained as we limit to the free surface where
    p = 0. Thus we have two equations: one involving η, p and c valid in the interior
    of the fluid domain and another involving only η and c valid at the free surface.
    Given these two relations, we show it is possible to eliminate c and obtain a
    relationship between p and η alone.


    The elimination of the wave-speed is possible because the fluid velocities (15
    - 16) are proportional to c. This is a consequence of the tangential velocity
    at the free surface q_x itself being proportional to the wave-speed c. In the
    following, using the methods outlined in [13], we present a relationship between
    q_x and η to explicitly show this fact by employing the operator ℋ(η) that maps
    the normal derivative at the free surface to the derivative of the Dirichlet condition
    at z = η.


    # 4.1. Determining the operator ℋ(η).


    In order to characterize ℋ(η), we consider the solution of the following boundary-value
    problem


    ```

    (17)        φ_xx + φ_zz = 0,                                 (x, z) ∈ D

