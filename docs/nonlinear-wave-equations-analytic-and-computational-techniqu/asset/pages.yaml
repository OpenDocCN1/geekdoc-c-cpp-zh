- pgno: 124
  md: 'for the Laplace equation, with periodic boundary conditions in $x$, Dirichlet
    conditions $(\phi = \varphi)$ on the upper boundary, and Neumann conditions $(\phi_y
    = 0)$ on the lower boundary, assumed flat. We have suppressed $t$ in the notation
    since time is frozen in the Laplace equation. We compute $\mathcal{G}\varphi$
    using a boundary integral collocation method [7, 8, 30, 34, 36] and advance the
    solution in time using an 8th order Runge-Kutta scheme [23] with 36th order filtering
    [25]. See [49] for details.


    # 3. Computation of relative-periodic solutions


    Traveling waves have the symmetry that


    (3.1) $\eta(x,0)$ is even, $\qquad \varphi(x,0)$ is odd.


    This remains true if $x$ is replaced by $x - \pi$. As a starting guess for a new
    class of time-periodic and relative-periodic solutions, we have in mind superposing
    two traveling waves, one centered at $x = 0$ and the other at $x = \pi$. Doing
    so will preserve the property (3.1), but the waves will now interact rather than
    remain pure traveling waves. A solution will be called *relative periodic* if
    there exists a time $T$ and phase shift $\theta$ such that


    (3.2) $\eta(x, t + T) = \eta(x - \theta, t), \qquad \varphi(x, t + T) = \varphi(x
    - \theta, t)$


    for all $t$ and $x$. Time-periodicity is obtained as a special case, with $\theta
    \in 2\pi\mathbb{Z}$. We can save a factor of 2 in computational work by imposing
    the alternative condition


    (3.3) $\eta(x + \theta/2, T/2)$ is even, $\qquad \varphi(x + \theta/2, T/2)$ is
    odd.


    From this, it follows that $\eta(x + \theta/2, T/2) = \eta(-x + \theta/2, T/2)
    = \eta(x - \theta/2, -T/2),$ $\varphi(x + \theta/2, T/2) = -\varphi(-x + \theta/2,
    T/2) = \varphi(x - \theta/2, -T/2).$


    But then both sides of each equation in (3.2) agree at time $t = -T/2$. Thus,
    (3.2) holds for all time.


    In the context of traveling-standing waves in deep water [48], it is natural to
    define $T$ as twice the value above, replacing all factors of $T/2$ by $T/4$.
    That way a pure standing wave returns to its original configuration in time $T$
    instead of shifting in space by $\pi$ in time $T$. In the present work, we consider
    solitary pairs of solitary waves moving to the right at different speeds, so it
    is more natural to define $T$ as the first (rather than the second) time there
    exists a $\theta$ such that (3.2) holds.


    # 3.1. Objective function.


    We adapt the overdetermined shooting method of [47, 49] to compute solutions of
    (3.1)–(3.3). This method employs the Levenberg-Marquardt method [39] with delayed
    Jacobian updates [49] to solve the nonlinear least squares problem described below.


    For (3.1), we build the symmetry into the initial conditions over which the shooting
    method is allowed to search: we choose an integer $n$ and consider initial conditions
    of the form


    (3.4) $\hat{\eta}_k(0) = c_{2|k|-1}, \qquad \hat{\varphi}_k(0) = \pm i c_{2|k|},$


    where $k \in \{\pm1, \pm2, \dots, \pm \tfrac{n}{2}\}$ and $\hat{\eta}_k(t), \hat{\varphi}_k(t)$
    are the Fourier modes of $\eta(x,t), \varphi(x,t)$. The numbers $c_1, \dots, c_n$
    are assumed real and all other Fourier modes (except $\hat{\eta}_0$) are zero.
    We set $\hat{\eta}_0$ to the fluid depth so that $y = 0$ is a symmetry line'
