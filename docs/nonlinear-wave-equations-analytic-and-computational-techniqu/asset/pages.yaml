  md: '![](img/c92a9d81ba7f671c83a4c600d27389fb_18_0.png)


    FIGURE 2. Evolution of the magnitude of the first Fourier mode of ZK (1.3) lattice
    showing repeated, approximate recurrences at regular time intervals. For this
    simulation, δ = .022 and N = 128 with the single-mode initial condition (1.5).


    and then truncate the convolution sum for some maximum |k|. In vector-matrix form,
    the spectral discretization is


    ```

    (3.1) d/dt u = - D_f F^{-1} [ (F u) * (F u) ] - δ² D_f³ u

    ```


    where: D_f = F^{-1} Ω F is the Fourier differentiation matrix; F is the matrix
    form of the discrete Fourier transform; Ω is the (diagonal) matrix of wavenumbers;
    and * is the convolution operation,


    ```

    (u * v)_k = Σ_j u_{k - j} v_j

    ```


    where the subscript is the index label of the component.


    In comparison with the O(h²)-approximation given by the ZK lattice (1.3), the
    spectral discretization is accurate beyond all orders in h [18,21] (and is exponentially
    accurate for spatially analytic data [34]).


    The distinction between the spectral discretization and a pseudo-spectral discretization
    (collocation), in which the convolution term in (3.1) is replaced with a pointwise
    product, should not be overlooked. The pseudospectral discretizations of KdV are
    nonlinearly unstable, even for relatively fine discretizations, due to aliasing.
    Hence, we instead consider the stable numerically spectral method (3.1) as a high-accuracy
    discretization of KdV (1.1).


    The spectral scheme shows repeated, decaying recurrences reminiscent of the result
    for the ZK scheme (1.3). However, for N = 128 (equivalently, 128 Fourier modes)
    the spectral discretization (3.1) evolves like the ZK lattice with a much larger
    N value. (See Figure 4.) As expected, the spectral scheme converges to the common
    continuum limit, KdV (1.1), much faster (in N) than the ZK scheme. As a consequence,
    there is no intermediate lattice scale for which the recurrence is stronger than
    for N large. Instead, as N increases, the scheme has a relatively abrupt transition
    from N values with no discernible recurrence to the limiting recurrence behavior.
    (See Figure 3.) Previous investigation of the spectral method for KdV [1] did
    not reveal recurrence due to the small number of modes used (as limited by computing
    capacity available at that time).'
