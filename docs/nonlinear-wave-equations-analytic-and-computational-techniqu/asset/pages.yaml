    # 5. Conclusion: Recurrence as a Property of the Lattice


    Taken together, the systematic simulations described in the preceding sections
    suggest that recurrence of the low-mode initial condition observed by Zabusky
    and Kruskal [36] is a property of nonlinear lattices and not primarily a manifestation
    of properties of the PDE limit (i.e., KdV (1.1)). On the other hand, a reduction'
