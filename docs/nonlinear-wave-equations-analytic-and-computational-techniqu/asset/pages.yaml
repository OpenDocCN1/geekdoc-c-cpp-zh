  md: 'FIGURE 8. Singular values (A), exact solution (D), and effect of varying M
    and the pseudo-inverse cutoff, k_cutoff, in the AFM and AFM* methods (B,C,E,F).
    Errors were computed relative to the exact solution N given in (3.29). 360 bits
    of precision were used in the AFM and AFM* calculations so that aliasing and truncation
    errors dominate roundoff errors.


    The results of computing N from D in (3.29) are shown in Figure 8. The first panel
    shows the singular values of A with K = 256 and M ∈ {256,320,288,384}. In all
    four cases, the singular values decay very rapidly, with slightly slower decay
    when M is larger. By contrast, the singular values of A in the boundary integral
    approach (BIM) remain nearly constant. Panel B shows the error in N from (3.32),


    ```

    (3.35)    error = sqrt(1/M sum_{j=0}^{M-1} |E_j|^2),    E_j = N(x_j) - [U pinv(S)
    V* B* ∂_x D]_j,

    ```


    where N refers to the exact solution (3.29), plotted in Panel D. The error depends
    on the pseudo-inverse cutoff index, k_cutoff, defined by


    ```

    pinv(S)_ij = { S_ii^{-1}  i = j ≤ k_cutoff; 0  otherwise. }

    ```


    It consists of two parts, one due to how well N is approximated by the leading
    k_cutoff columns of U, and one by how well the coefficients c = U U* N are approximated
    by


    ```

    c ≈ pinv(S) V* B* ∂_x D.

    ```'
