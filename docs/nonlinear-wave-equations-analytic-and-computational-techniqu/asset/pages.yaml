  md: 'or 1.1% of H_B. The relative change in period is (T_Euler − T_KdV)/T_Euler
    = 3.6%. While the left panels of Figures 11 and 12 show close agreement between
    relative-periodic solutions of the Euler and KdV equations at t = 0, it should
    be noted that the wave amplitudes of the cnoidal solutions were chosen to minimize
    the discrepancy in these figures. The change in period by 18% and 3.6%, respectively,
    is perhaps a better measure of agreement.


    A final comparison of the two equations is made in Fig. 13, where we evolve the
    Euler equations with the KdV initial conditions. This requires an initial condition
    for φ(x) = φ(x, η(x)), where we have suppressed t in the notation for this discussion
    since it is held fixed at 0. Based on the derivation presented above, we first
    solve φ_x(x,0) = √g/h [η(x) − h] for φ on the bottom boundary. We then use the
    approximation


    ```

    φ(x) ≈ φ(x,0) − η(x)²/2 φ_xx(x,0) + η(x)⁴/24 φ_xxx(x,0)

    ```


    to evaluate φ on the free surface. In the left panel of Figure 13, the larger
    wave grows and overturns before t = T/400 when evolved under the Euler equations,
    instead of traveling to the right when evolved via KdV. To handle wave breaking,
    we switched to an angle-arclength formulation of the free-surface Euler equations
    [4, 26]. In the small-amplitude example in the right panel, the Euler solution
    develops visible radiation and falls slightly behind the KdV solution, although
    the phases are closer at T/2 than the result of evolving the Stokes waves under
    KdV in Figure 10. We also tried evaluating


    ```

    φ(x,y) = √g/h Σ_{k=1}^∞ 2k^{-1} η̂_k sin(kx) cosh(ky)

    ```


    at y = η(x) to obtain the initial condition for φ(x), where η̂_k are the Fourier
    modes of η(x) at t = 0, but the results were worse for the large-amplitude example
    — the wave breaks more rapidly — and were visually indistinguishable in the small-amplitude
    example from the results plotted in Fig. 13.


    In summary, the large-amplitude time-periodic solution of the Euler equations
    found in §4 is well outside of the KdV regime by any measure, and the small-amplitude
    relative-periodic solution is closer, but not close enough to achieve quantitative
    agreement over the entire time interval of interest.


    # 6. Conclusion


    We have demonstrated that the small amount of background radiation produced when
    two Stokes waves interact in shallow water can often be tuned to obtain time-periodic
    and relative-periodic solutions of the free-surface Euler equations. Just as for
    the Korteweg-de Vries equation, the waves can fully merge when they collide or
    remain well-separated. However, the comparison is only qualitative as the waves
    are too large to be well-approximated by KdV theory.


    In future work, we will study the stability of these solutions using Floquet theory.
    Preliminary results suggest that the first example considered above is unstable
    to harmonic perturbations while the second example is stable. In the stable case,
    an interesting open question is whether the Stokes waves used as a starting guess
    for the minimization algorithm, which have the same energy as the relative-periodic
    solution found, might remain close to it forever, executing almost-periodic oscillations
    around it. Presumably θ would need to be varied slightly for this to be'
