  md: 'Finally, once the solution of RHP 4 is found, one recovers an $N$-soliton solution
    via the formula


    $$u(x,t)=2i\lim_{\lambda\to\infty}\lambda m_{12}(\lambda;x,t),$$


    where $m_{12}$ is the $(1,2)$ entry of $\mathbf{m}$.


    # 3.2.2. Steepest Descent.


    We condense the asymptotic analysis to its most abbreviated form². Roughly, after
    a change of coordinates, the meromorphic RHP can be exchanged for a sectionally
    holomorphic RHP. This allows the study the $N\to\infty$ (equivalently, $\epsilon\downarrow0$)
    problem using the “$g$-function mechanism” [10], a modification of the steepest
    descent method [9]. This method of asymptotic analysis hinges on being able to
    find an appropriate complex phase, or “$g$-function”, which allows the RHP to
    go over to a tractable form in the limit. In the present setting, such a $g$ selects
    certain contours in the complex plane on which the RHP should be posed; the contours
    consist of bands which are fixed and gaps which may lie anywhere a certain inequality
    is satisfied. If $g$ and the appropriate contours (bands & gaps) can be found,
    the solution of the RHP (for small $\epsilon$) can be approximately built from
    Riemann theta functions of the hyperelliptic surface with branch points at the
    band end points. (Note: In [16,22] $g$ and the band/gap contours are found by
    an ansatz about the number of bands and numerical calculation. In contrast to
    direct simulation of (1.1) for small $\epsilon$, these calculations are extremely
    well conditioned; “bad” behavior has been factored out.) The upshot is that the
    semiclassical asymptotics for focusing NLS are described by modulated multiphase
    waves written in terms of theta functions, where the number of phases is related
    to the genus $G$ of the surface. The nonlinear caustics (phase transitions) correspond
    to a change in the genus of the surface. An essential feature of the analysis,
    one that bears on the problems below, is that this global parametrix for the RHP
    (uniformly close to the true solution on all of $\mathbb{C}$) is built by matching
    an “inner” part (near branch points) to an “outer” part (elsewhere).


    The above description outlines the strategy employed by Kamvissis et al. [16].
    This was the first analytic breakthrough in the analysis of the semiclassical
    NLS equation, and variations on this basic scheme has been used in much of the
    subsequent work on this problem; see, e.g., [2,22,31–33].


    # 3.3. Nonlinear Caustics.


    As described in the previous subsection, nonlinear caustics are curves in space-time
    which separate qualitatively different modulated oscillations due to differences
    in the number of phases. The sharpening boundaries are clearly visible in well
    resolved simulations of the initial-value problem; see Figure 2. Certainly, any
    reasonable theory of the semiclassical limit for (1.1) should be able to predict
    the number and location of such important features of the dynamics. However, much
    remains to be done before these phenomena are completely understood (but see the
    interesting recent work of Bertola & Tovbis [3,4]).


    Applying the methodology of Kamvissis et al. [16] described above, the search
    for caustics thus amounts to a search, as parameters $x$ and $t$ vary, for topological
    changes in the region of the complex plane where a certain inequality must be
    satisfied in order for a gap contour to be located there. Using these ideas, Kamvissis
    et al. showed that a $G=0$ ansatz correctly describes the semiclassical behavior
    for $t\neq0$ and for $t$ sufficiently small (but independent of $\epsilon$). They
    also showed that the'
