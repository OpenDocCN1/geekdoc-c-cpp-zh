  md: 'Finally, the WKB eigenvalues λ_{N,k}^{wkb} are defined (there are N of them
    for ε_N) by the formula


    (2.4)  -∫_{λ_{N,k}^{wkb}}^{iA} ρ^0(η) dη = ε_N (k + 1/2) = θ^0(λ_{N,k}^{wkb})/π
    ,  k = 0, …, N - 1.


    Evidently, we may rewrite the left-hand side as -∫_{λ_{N,k}^{wkb}}^{iA} ρ^0(η)
    dη = 2/π ∫_0^{x_+(λ_{N,k}^{wkb})} √{A_0(x)^2 + (λ_{N,k}^{wkb})^2} dx .


    Therefore, writing λ_{N,k}^{wkb} = i τ_{N,k}^{wkb} for τ_{N,k}^{wkb} ∈ (0, A)
    ⊂ ℝ, the eigenvalue locations (important components of the scattering data for
    A_0) are approximately given by solutions to the equations


    (2.5) ∫_0^{x_+(i τ_{N,k}^{wkb})} √{A_0(x)^2 - (τ_{N,k}^{wkb})^2} dx = π ε_N /2
    (k + 1/2) , k = 0,1,2,…, N - 1.


    # 3. Semiclassical soliton ensembles


    # 3.1. Origins.


    We are now in a position to describe precisely the origin of the SSE. As noted
    above, the WKB method applied to (2.1) suggests that the reflection coefficient
    is negligible and the purely imaginary eigenvalues are given by a quantization
    condition of Bohr–Sommerfeld type (2.5). Remarkably, this information is completely
    parallel to the information used by Lax & Levermore [19] in their analysis of
    the zero-dispersion limit of the Korteweg–de Vries (KdV) equation. Lax & Levermore
    neglected reflection and adopted the WKB eigenvalues¹ in place of the true eigenvalues.
    That is, they approximated the initial data by a family of reflectionless potentials
    which, in the limit, approach the true initial data. Since exact information about
    the true scattering data (eigenvalues of (2.1) and the reflection coefficient)
    is not known, the temptation to adopt Lax & Levermore’s strategy is overwhelming,
    and we use the (formal) WKB scattering data in its place. This process, neglecting
    reflection and using the WKB eigenvalues, amounts to replacing the true initial
    data A_0 with some other initial condition, denoted by A_0^{(ε)}, which depends
    on the small parameter ε and for which the WKB data is the true data. Thus, this
    process introduces perturbations to the initial data, and we write


    (3.1) A_0^{(ε)}(x) = A_0(x) + q^{(ε)}(x),


    so that q^{(ε)} is the induced perturbation; see Figure 4 (b) for an example of
    such a perturbed initial condition. Because reflection is neglected, each solution
    of (1.1) with initial data A_0^{(ε)} is an N-soliton with N ∼ ε^{-1}. The collection
    of all these exact N-soliton solutions of (1.1) (with N → ∞ and ε ↓ 0) is the
    semiclassical soliton ensemble associated with the bell-shaped data A_0.


    It is important to note, however, that in the case of the KdV equation, the Whitham
    equation is hyperbolic and is therefore locally well posed. Lax & Levermore appealed
    to this local well-posedness to absorb the asymptotically vanishing family of
    perturbations induced by their reflectionless approximation. As described above,
    we are unable to appeal to the well-posedness of the Whitham system in the


    ¹ In their case, these eigenvalues are associated with the WKB analysis of the
    spectral problem for the stationary Schrödinger operator associated with the solution
    of KdV by IST not with (2.1).'
