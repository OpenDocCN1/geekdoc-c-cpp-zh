- pgno: 166
  md: 'We have obtained results consistent with those of Francius & Kharif. However,
    we have noticed that our instability regions (regions in the (μ, ρ) plane for
    which the spectrum intersects the right-half plane) appear to be smaller than
    those presented in [FK06]. For example, in Figure 16 we demonstrate the stability
    regions obtained in [FK06] along with our own computed for h = .5 and a = .160.
    As shown in Figure 16, the general shape is comparable, but our instability regions
    appear to be smaller than those presented by Francius & Kharif.


    There are several possible explanations for the discrepancy in the size of the
    stability region. Perhaps the most logical is that we are able to calculate the
    underlying traveling wave solution to a high degree of accuracy using far fewer
    Fourier modes than those used in Francius & Kharif[FK06]. This is a benefit of
    the reduced complexity of the nonlocal formulation for the one-dimensional traveling
    wave solutions, and perhaps its amenability to spectral numerical methods. In
    addition, It is important to note that since we incorporated the periodicity with
    respect to μ in our computations of the spectrum, our results are essentially
    tiled versions of the results presented in Francius & Kharif[FK06].


    Summarizing, we have confirmed that for small amplitude waves, the dominant instability
    is two-dimensional (occurring when ρ ≠ 0) with the magnitude of the dominant two-dimensional
    instability was sometimes multiple orders of magnitude greater than the dominant
    one-dimensional instability. The results were found earlier by Bryant [Bry78].
    For h = .5, he found that for four-wave interactions, the dominant instability
    was fully two-dimensional. However, as the perturbations were time-evolved in
    his truncated equations, the two-dimensional instabilities dominated. As mentioned
    in Francius & Kharif[FK06], it would be interesting to explore the time evolution
    of a traveling wave perturbed with both of the dominant one- and two-dimensional
    instabilities to determine how each affects the long-time dynamics. This is an
    interesting possibility for future work since little is know about the time propagation
    of perturbations in shallow water using the fully nonlinear equations. Another
    interesting results is that for h = .5, the dominant instability corresponds to
    μ = 1/2, as also noted in the previous literature[FK06]. This implies that the
    dominant instability is phase-locked with the original solution expanded over
    twice the original period.


