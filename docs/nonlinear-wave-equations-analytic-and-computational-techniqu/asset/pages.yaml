  md: '# 5. Numerical Results on the Instabilities of Plane-Wave Soliton Solutions


    # 5.1. Locating unstable solutions.


    For our numerical test we used M = 5 and for |x| > 5 we know |u0(x)| = 2 cosh⁻²(x)
    ≤ 3.6 · 10⁻⁴ ≪ 2 and |u0''(x)| ≤ 7.3 · 10⁻⁴ ≪ 2. Tests with larger values for
    M did not change the result significantly. We used the numerical ODE solver lsode
    provided by Octave. Based on expression (4.23) we generate plots of the function
    D(k,γ) = det(M(k,γ)) on a domain 0 ≤ k ≤ 1 and 0 ≤ γ ≤ 0.5, leading to Figure
    2. In the corner k ≈ 1 and γ ≈ 0.5 the real part of the function vanishes, but
    a second plot verifies that the imaginary part is different from zero. Thus Figure
    2 indicates that we have a clearly defined solution curve of det(M(k,γ)) = 0,
    away from the origin.


