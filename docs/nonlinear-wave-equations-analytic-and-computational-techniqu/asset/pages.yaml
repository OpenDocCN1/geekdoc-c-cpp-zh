  md: 'We first solved (4.5) to very high precision³. With the numerically computed
    WKB spectral data in hand, we then used the numerical linear algebra routines
    of [26] and [22] to reconstruct various members of the SSE at t = 0 (and later
    times too). We then compared the numerical reconstructions of members of the Gaussian
    SSE at t = 0 to the true initial data A₀ = e^{-x²} and with approximations to
    the evolution for t > 0. We systematically computed the 2-norm difference between
    the square modulus of the SSE solutions (computed by numerical inverse scattering)
    and those of a finite difference method (representing the true evolution of the
    initial data A₀(x) = exp(-x²)) for the ranges of N = 5 to N = 20 and t = 0.0 to
    t = 0.5. Figure 3 shows the data; the markers show the 2-norm differences versus
    N for times t = 0.0, 0.1, 0.2, 0.3, 0.4, and 0.5, respectively. The figure shows
    a remarkable consistency in the decay of the error as N increases (ε decreases).


    *In fact, a least squares fit of the data suggests that the SSE solutions converge
    to the true solutions at a O(ε) rate! Indeed, this rate of convergence persists
    for positive times, even including times after the first caustic.* Figure 4 (panels
    (a) and (b)) show a representative illustration of this phenomenology. Despite
    the presence of acute modulational instabilities, the small oscillations induced
    by the perturbation q^{(ε)} almost immediately disperse, and the large-scale structure
    of the solutions are virtually indistinguishable from each other.


    # 6. REMARK (Numerical methods).


    We used two distinct numerical methods for approximating solutions of (1.1). First,
    to compute multisoliton solutions (elements of the SSE), we adopted the numerical
    inverse scattering approach used previously [22,26]; this method was also used
    to generate the solutions shown in Figure 2. On the other hand, the construction
    of accurate numerical methods for approximating the solution of (1.1) more generally
    when ε is small is a notoriously difficult problem. We refer the interested reader
    to the recent survey of Jin et al. [15] for a comprehensive discussion of the
    various challenges that occur even in the linear case; see also [21] and the references
    therein for additional details about numerical methods for (1.1) when ε is small.
    The results presented here were obtained by the use of a second-order implicit
    finite-difference algorithm developed in [21] and shown there to be a suitable
    numerical method for solving the semiclassical focusing nonlinear Schrödinger
    equation when ε is small.


    # 4.3. “Nearby” Initial data & stability of the semiclassical limit.


    As a kind of control experiment, we next considered the family of functions⁴


    ```

    (4.6) q^ε(x) = 0.3ε cos( x / (0.54ε) ) exp(-x²)

    ```


    indexed by ε > 0. We proposed q^ε as an ε-dependent perturbation of the initial
    data A₀, and we call the members of this family of functions “cosine perturbations.”
    Figure 4 (panel (c)) shows the modification to the initial data using the cosine
    perturbation q^ε in equation (4.6) for ε = 1/(15√π). From a rough, qualitative
    point of view, these data look quite similar to the modified data for the SSE
    in Figure 4 (panel (b)). Indeed, without the Gaussian template, the differences
    are practically indiscernible.


    ³High precision knowledge of the eigenvalue locations is necessary due to fact
    that the solution is obtained by solving a poorly conditioned linear system [26].


    ⁴The values 0.3 and 0.54 that appear in (4.6) are chosen so that the amplitude
    and frequency of the cosine perturbations q^ε track their counterparts q^{(ε)};
    compare Figure 4 (panels (b) and (c)).'
