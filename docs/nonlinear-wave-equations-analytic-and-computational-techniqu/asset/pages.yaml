  md: "and free surface come from solutions of the water-wave equations. The first\
    \ is a standing water wave and the second involves two interacting traveling water\
    \ waves.\n\n# 3.1. Cancellation properties of the DNO expansion.\n\nFor simplicity,\
    \ until §3.3, we restrict to the case of two-dimensional fluids of infinite depth.\
    \ In that case, the DNO expansion takes the form [23]\n\n```\n(3.12)      G₀(f)\
    \ = |D|,\n(3.13)      Gₙ(f) = |D|^{n-1} D (fⁿ / n!) - Σ_{s=0}^{n-1} |D|^{n-s}\
    \ (f^{n-s} / (n-s)!) Gₛ(f),   n = 1,2,3,… ,\n```\n\nwhere the symbols of D and\
    \ |D| are k and |k|, respectively. Note that Gₙ(η) = εⁿ Gₙ(f) when η = ε f. Computationally,\
    \ it is convenient to absorb the s = 0 term into the first term:\n\n```\n(3.14)\
    \      Gₙ(f) = Aₙ(f) - Σ_{s=1}^{n-1} 1/(n-s)! |D|^{n-s} f^{n-s} Gₛ(f),   n = 1,2,3,…\
    \ ,\n```\n\nwhere Aₙ(f) = (1/n!) |D|^{n-1} (D fⁿ D - |D| fⁿ |D|) for n ≥ 1. In\
    \ Fourier space, Aₙ(f) is an infinite matrix with the quadrants containing the\
    \ main diagonal zeroed out:\n\n```\n(3.15)      Aₙ(f)^∧_{kj} = { -2 |k||j|ⁿ /\
    \ n! (fⁿ)^∧_{k-j},  k j < 0,\n                         0,                    \
    \     k j ≥ 0. }\n```\n\nThis already accomplishes a fair amount of cancellation\
    \ since |k - j| > |k| when j k < 0, so the rapid growth of |k|ⁿ / n! is balanced\
    \ by decay of (fⁿ)^∧_{k-j} when f is smooth. Indeed, if f is real analytic, one\
    \ may show that there exist C and ρ such that |(fⁿ)^∧_k| ≤ Cⁿ e^{-ρ|k|}, which\
    \ is enough to guarantee that Aₙ(f)^∧ maps ℓ² sequences φ̂ to exponentially decaying\
    \ sequences:\n\n```\n|(Aₙ(f) φ)^∧_k| ≤ (|C k|ⁿ e^{-ρ|k|} / n!) Σ_{j∈J(k)} 2|j|\
    \ e^{-ρ|j|} |φ̂_j| ≤ (ρ^{-3/2} e^{2ρ} ||φ̂||_{ℓ²}) (|C k|ⁿ / n!) e^{-ρ|k|}.\n\
    ```\n\nHere J(k) is the set of positive integers when k is negative and the set\
    \ of negative integers when k is positive. Thus, if f is real analytic, (3.14)\
    \ implies that Gₙ(f) φ is real analytic for n ≥ 1 when φ is merely L². Also, aside\
    \ from n = 0, Gₙ(f) is bounded on L² when f is real analytic.\n\nNumerical experiments\
    \ reveal that significant additional cancellations occur in (3.14), beyond combining\
    \ D fⁿ D with |D| fⁿ |D|. Indeed, without these cancellations, even when f is\
    \ real analytic, one would expect (|D| f)^{n-1} A₁(f), which is one of the terms\
    \ in (3.14) when the recursion is unrolled, to grow super-exponentially with n.\
