  md: '![](img/c92a9d81ba7f671c83a4c600d27389fb_135_0.png)


    # FIGURE 10. Comparison of the solutions of the KdV and Euler equations, both
    initialized with the superposition of Stokes waves labeled B and C in Figure 1.
