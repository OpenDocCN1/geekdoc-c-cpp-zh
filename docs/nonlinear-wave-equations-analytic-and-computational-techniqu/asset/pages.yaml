- pgno: 25
  md: '# On the Location of the Discrete Eigenvalues for Defocusing Zakharov-Shabat
    Systems having Potentials with Nonvanishing Boundary Conditions


    F. Demontis, C. van der Mee, and F. Vitale


    ABSTRACT. In this article we prove that the discrete eigenvalues of the Zakharov-Shabat
    system belong to certain neighborhoods of the endpoints of the spectral gap and
    the discrete eigenvalue of the free Hamiltonian.


    # 1. Introduction


    The nonlinear Schrödinger (NLS) equation is a well-known physically and mathematically
    significant nonlinear evolution equation extensively studied for over forty years.
    For example, the NLS equation has been derived in the modeling of ocean water
    waves [2,21], Bose-Einstein condensation [18], and optical fibers [10,11].


    In this work we consider the defocusing NLS equation, i.e.,


    ```

    (1.1)  i q_t + q_{xx} - 2 |q|^2 q = 0 ,

    ```


    [subscripts x and t denote partial differentiation throughout] with nonzero boundary
    conditions (NZBCs)


    ```

    (1.2)  q(x,t) → q_±(t) = q_0 e^{2 i q_0^2 t + i θ_±} ,  as x → ±∞ ,

    ```


    where i denotes the complex unit, q_0 > 0 and 0 ≤ θ_± < 2π are arbitrary constants.
    It is well-known that Eq. (1.1) is associated to the so-called Zakharov-Shabat
    (ZS) system:


    ```

    (1.3)  ∂X/∂x (x,k) = (-i k σ_3 + Q(x)) X(x,k),      x ∈ ℝ,

    ```


    where


    ```

    (1.4)  σ_3 = (1 0; 0 -1) ,      Q(x) = (0 q(x); q*(x) 0) ,

    ```


    q(x) is the potential, k is a complex spectral parameter and the asterisk denotes
    the complex conjugate, by means of the inverse scattering transform.


    Recently, the defocusing NLS (1.1) with NZBCs has been the subject of renewed
    interest because of its applications to Bose-Einstein condensates [8,9] and dispersive
    shock waves in optical fibers [19]. This justifies our effort to investigate some
    questions connected with this subject. In particular, we focus our attention on
    some aspects which arise when the Inverse Scattering Transform (IST) (see [1,2,20]
    for'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'a general review of this method) is applied to the equation (1.1) with NZBCs
    (1.2). In fact, the IST for (1.1) with NZBCs (see [3, 4, 7, 12, 13, 17, 22]) is
    much more complicated than for (1.1) with decaying potentials, in particular with
    regard to the analyticity properties of the eigenfunctions of the scattering problem
    (1.3) and the corresponding scattering data. A step forward in that direction
    was recently made in [6] where it was proved that the direct scattering problem
    is well defined for potentials q such that q − q± belongs to the functional class
    L^{1,2}(ℝ±) (L^{1,p}(ℝ±) consists of all functions f(x) satisfying ∫ℝ dx (1 +
    |x|)^p |f(x)| < ∞). For this reason, we will assume that q − q± ∈ L^{1,2}(ℝ±).


    It is also worthwhile to study if an area theorem for the defocusing NLS (1.1)
    with NZBCs can be proved, which means establishing existence and location of discrete
    eigenvalues (see Section 2 for the definition of a discrete eigenvalue) of the
    scattering problem (1.3) as a function of the area of the initial profile of the
    solution of (1.1). It is well known that for the focusing NLS with vanishing boundary
    conditions such a result already exists [2, 14–16]: in fact, there are no discrete
    eigenvalues of (1.3) if the L¹-norm of the potential is smaller than π/2. Only
    recently [5], the non existence of an analogous result for equation (1.1) with
    NZBCs has been proved. In [5], the authors showed that no area theorem is possible
    for the defocusing NLS with NZBCs by providing explicit examples of box-type initial
    conditions where at least one discrete eigenvalue exists. In the present paper,
    we analyze a class of potentials more general than that considered in [5] (we
    only require that q − q± ∈ L^{1,2}(ℝ±)) and establish the conditions (equations
    (4.8) and (4.13) in Section 4) which the potentials have to satisfy in order that
    a particular, but well specified subset of (−q₀, q₀) does not contain any discrete
    eigenvalue.


    The paper is organized as follows. In Section 2 we review the basic facts on the
    direct scattering problem for (1.1) with NZBCs (1.2) and discuss an explicit example
    (different from that considered in [5]) which establishes the presence of at least
    one discrete eigenvalue in (−q₀, q₀). In Section 3 we explicitly construct the
    resolvent of the free hamiltonian of the spectral problem originating from (1.3)
    and, finally, in Section 4, adapting the technique used in the vanishing case
    in [14–16], we state our main results, namely Theorems 4.3 and 4.4.


    # 2. Preliminaries


    In this section we study the direct scattering problem for (1.3) by using the
    same notations adopted in [6] to which we refer the interested reader for details.
    Moreover, we discuss a significant example which shows that in the spectral gap
    (−q₀, q₀) there may exist a discrete eigenvalue if q₊ ≠ q₋.


    To study the direct scattering problem of (1.1) with NZBCs (1.2), a new spectral
    parameter


    λ = √(k² − q₀²)


