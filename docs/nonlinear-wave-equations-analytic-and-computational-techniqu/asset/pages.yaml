  md: 'Then, if $q$ decays rapidly at infinity (say $q \in \mathcal{S}(\mathbb{R}^n)$),
    the function $\mu(z,k)$ obeys the large-$z$ asymptotic formula


    (2.14) $$\mu(z,k) \sim 1 + \frac{1}{4\pi i k z}s(k) - \frac{e_{-k}(z)}{4\pi i
    k \bar{z}}\mathbf{t}(k) + \mathcal{O}\left(|z|^{-2}\right)$$


    where


    (2.15) $$\mathbf{t}(k) = \int e_k(z) q(z) \mu(z,k)\, dz,$$


    (2.16) $$s(k) = \int q(z) \mu(z,k)\, dz.$$


    Note that $s(k)$ and $\mathbf{t}(k)$ are always defined for large $|k|$, whether
    the potential $q$ is subcritical, critical, or supercritical.


    The asymptotic formula (2.14) is a consequence of the following simple lemma.


    # Lemma 2.1. Suppose $k \in \mathbb{C}$ and $k \neq 0$, that $p > 2$ and suppose
    that $u \in C^2(\mathbb{C}) \cap L^p(\mathbb{C})$ satisfies


    $$-4\bar{\partial}(\partial + i k) u = f$$


    for $f \in \mathcal{S}(\mathbb{C})$. Then


    (2.17) $$u(z) \underset{|z|\to\infty}{\sim} \sum_{\ell \ge 0} \frac{a_\ell}{z^{\ell+1}}
    + e_{-k}(z)\frac{b_\ell}{\bar{z}^{\ell+1}}$$


    where


    $$a_0 = \frac{1}{4\pi i k}\int f(z)\, dz,$$


    $$b_0 = \frac{1}{4\pi i k}\int e_k(z) f(z)\, dz.$$


    Proof. The conditions on $u$ imply that $$u = g_k * f$$ so using the asymptotic
    expansion (A.3) for $g_k$ we obtain


    (2.18) $$u(z) = -\frac{1}{4\pi}\sum_{j=0}^{N}\int\left[\frac{j!}{(i k (z - z''))^{j+1}}
    + e^{-i(kz+\bar{k}\bar{z})}\frac{j!}{(-i\bar{k}\, (z - z''))^{j+1}}\right] f(z'')\,
    dz'' + \mathcal{O}\left(|z|^{-N-2}\right)$$


    It is not difficult to see that for $f \in \mathcal{S}(\mathbb{C})$ and any positive
    integer $N$, the expansion $$\int \frac{1}{(z - z'')^{j}} f(z'')\, dz'' = \sum_{\ell=0}^{N}
    c_{\ell,j} z^{-j-\ell} + \mathcal{O}\left(|z|^{-N-1-j}\right)$$ holds, with an
    analogous expansion for the terms involving $\bar{z} - \bar{z}''$. The existence
    of the expansion (2.17) is immediate. The leading terms come from the $j = 0$
    term of (2.18).


    If $q(z,\tau)$ solves the NV equation at zero energy, it can be shown that $\mathbf{t}(\cdot,\tau)$,
    the scattering transform of $q(\cdot,\tau)$, is then given by


    (2.19) $$\mathbf{t}(k,\tau) = \mathbf{m}(k,\tau)\mathbf{t}(k,0),$$'
