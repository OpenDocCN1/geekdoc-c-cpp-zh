  md: 'water depths. These one-dimensional solutions are perturbed with two-dimensional
    (quasi-) periodic disturbances. Substituting the two-dimensional perturbations
    into the equations of motion, we calculate the linear growth rates using a Fourier-Floquet
    decomposition, see for example Ref. [DK06]. We find that our stability results
    are in general agreement with those of Francius & Kharif [FK06] and the other
    sources mentioned above. Although a direct comparison is not possible (see Section
    5), it appears that our method produces more accurate results at a significantly
    reduced computational cost.


    # 2. Equations of Motion


    We consider Euler’s equations describing the dynamics of the surface of an ideal
    fluid in three dimensions. For the periodic problem, this requires us to solve
    Laplace’s equation inside the fluid domain D with periodic boundary conditions
    in both horizontal directions x and y. The fluid domain D is shown in Figure 1.
    The equations of motion are


    (2.1) φ_xx + φ_yy + φ_zz = 0,                          (x, y, z) ∈ D,


    (2.2) φ_z = 0,                                          z = −h,


    (2.3) η_t + φ_x η_x + φ_y η_y = φ_z,                     z = η(x, y, t),


    ![](img/c92a9d81ba7f671c83a4c600d27389fb_145_0.png)


    FIGURE 1. The fluid domain for a water wave surface with periodic boundary conditions.'
