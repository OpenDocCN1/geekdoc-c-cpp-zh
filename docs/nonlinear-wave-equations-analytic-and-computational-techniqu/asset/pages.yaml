  md: 'Recall that the perturbation of the one-dimensional solution is of the form


    \(\eta(x,y,t)=\eta_0(x)+\epsilon e^{\lambda t}e^{i\theta y}e^{i\mu x}\eta_1(x)+c.c.+\mathcal{O}(\epsilon^2)\)


    In addition to the mode corresponding to the complex conjugate eigenvalue, we
    also add those corresponding to the opposite eigenvalue and its complex conjugate.
    We use this to examine the linear time evolution of the traveling wave. For short
    times, before nonlinear effects become important, this demonstrates the dynamics
    of the perturbed wave pattern. Here “short time” should be considered relative
    to the size of the eigenvalue: the important measure is the product \(\lambda
    t\). The time steps are shown in Figures 14 and 15. Since the perturbations are
    unstable, the amplitude of the solutions grow as demonstrated in each of the figures.


    # 5. Conclusions


    We have presented a small sampling of the instabilities of one-dimensional traveling
    wave solutions with respect to two-dimensional perturbations using the AFM formulation.
    By using the nonlocal formulation in combination with Hill’s method, we have determined
    various spectra numerically with high degree of accuracy. Additionally, as demonstrated
    in Figure 2, the error of the approximation of the most unstable eigenvalue converges
    rapidly as a function of the number of Fourier modes used in the truncation.


    When comparing our results to the method presented by Francius & Kharif [FK06],
    our method converges for similar solutions using a smaller number of Fourier modes.
    To quantify this, where 80 Fourier modes are needed in [FK06] to obtain eigenvalues
    with Cauchy error on the order of 10⁻⁸, we only require 48 modes to obtain a comparable
    Cauchy error for the most unstable eigenvalue when h = 0.3 and a ≈ 0.10 (data
    obtained from the appendix of Ref. [FK06], available online only).


    TABLE 2. Comparisons of Results with Francius & Kharif for h = 0.3 for convergence
    to six digits of accuracy. For the results from [FK06], a = .1. However, for our
    results, a = .1003.


