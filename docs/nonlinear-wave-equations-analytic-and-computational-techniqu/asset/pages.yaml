    The integrable scheme (4.6) manifests a recurrence behavior similar to that of
    the ZK lattice (1.3): the strongest and most-persistent recurrence occurs in a
    middle range of N values, the solutions converge to the KdV limit (with weaker
    recurrences) as N gets large and recurrences are weak or non-existent for N below
    a threshold. Moreover, as with ZK (1.3), the time of recurrences, when they do
    occur, does not depend on N. However, the range of N where recurrence is strongest
    and most persistent is not the same as for the ZK scheme. (See Figure 3.) The
    strongest and most persistent recurrence in the integrable scheme is more pronounced
    than that of the ZK scheme (which can be seen by comparison of Figure 2 and Figure
