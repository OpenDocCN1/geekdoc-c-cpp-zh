  md: 'NV which blow up in finite time. In [96,97] Zheng, J.-F. Zhang and Sheng explore
    chaotic and fractal properties of solutions to the NV equation.


    # 2.1. Dispersion, group velocity and phase velocity.


    Solitons form when there is a balance between nonlinearity and dispersion. The
    dispersion relation is the relation that gives the frequency as a function of
    the wave vector (k1, k2). To find the dispersion relation for the NV equation,
    consider the linear part of the equation


    ```

    (2.1) q_t = -1/4 q_xxx + 3/4 q_xyy

    ```


    The plane wave functions q(x,y,t) = e^{i(k1 x + k2 y - ω t)} are solutions to
    (2.1) provided


    ```

    (2.2) ω = -1/4 k1^3 + 3/4 k1 k2^2.

    ```


    Equation (2.2) defines the dispersion relation for the NV equation.


    ![](img/c92a9d81ba7f671c83a4c600d27389fb_43_0.png)


    FIGURE 1. Surface plot (left) and heat map (right) of the NV dispersion relation
    ω(k) = k1^2/4 + 3 k1 k2^2/4


    The phase velocity, c_p, which gives the velocity of the wavefronts, is defined
    by c_p = ω(k)/|k|^2 (k1, k2)^T and for the NV equation is


    ```

    (2.3) c_p = (k1^3 - 3 k1 k2^2)/(4(k1^2 + k2^2)) (k1, k2)^T.

    ```


    The group velocity, which gives the velocity of the wave packet, is


    ```

    c_g ≡ ∇ω = 3/4 (-k1^2 + k2^2, 2 k1 k2)^T.

    ```


    # 2.2. Symmetries and Scaling.


    To understand how scaling of the dependent and independent variables change the
    NV equation, let us first consider the auxiliary ∂̄ equation in equation (1.2)
    in the form


    ```

    ∂̄ν = ∂q,    ν = v + i w.

    ```


    Note that under the transformation r(x,y,t) ≡ γ ν(α t, β x, β y) and s(x,y,t)
    ≡ γ q(α t, β x, β y), the ∂̄ equation remains unchanged, i.e ∂̄ν = ∂q if and only
    if ∂r = ∂s. Then r_x(x,y,t) = β γ ν_x(α t, β x, β y) and r_y(x,y,t) = β γ ν_y(α
    t, β x, β y).


    Now, we examine the main equation as presented in equation (1.2). Note that s_t(x,y,t)
    = α γ q_t(α t, β x, β y), s_xxx(x,y,t) = β^3 γ q_xxx(α t, β x, β y), s_xyy(x,y,t)
