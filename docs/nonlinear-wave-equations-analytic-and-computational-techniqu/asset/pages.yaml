    yN = 0. Functions on the grid are stored as matrices with entries in a column
    indexed by x, holding y fixed. The formulas for Fn(x, y) are evaluated pointwise
    on the grid from the known values of f(x), fx(x), um,x(x, y) and um,y(x, y) for
    m = 0, …, n−1. The FFT of the zeroth order term u0(x, y) is computed from (2.10)
    by expanding D(x) in a Fourier series and evaluating û0(k, y) = Ĝk cosh(k(y +
    h)) sech(kh) at the grid points yj. To obtain u0,x(x, y), we multiply û0(k, y)
    by ik and take the inverse FFT. Similarly, u0,y(x, y) is obtained by taking the
    iFFT of ∂y û0(k, y). This latter function is computed by transforming the rows
    of û0 to their Chebyshev coefficients (also using an FFT), differentiating the
    Chebyshev polynomials, and evaluating the result on the grid using the Clenshaw
    recurrence formula. The differentiation procedure amounts to determining the coefficients
    of ∂y û0 from those of û0:


    û0(k, y) = Σj αj(k)Tj(1 + 2h−1 y),   ∂y û0(k, y) = Σj βj(k)Tj(1 + 2h−1 y)2h−1,

    βN = 0,   βN−1 = NαN,   βj = (j + 1)αj+1 + βj+2,   (j = N − 2 : −1 : 0),

    where Tj(y) is the jth Chebyshev polynomial. Finally, (2.11) is solved using an
    FFT in the x-direction to convert the PDE into a collection of uncoupled boundary
    value problems in y. The kth BVP is


    ∂y² ûn(k, y) − k² ûn(k, y) = ik F̂1n(k, y) + ∂y F̂2n(k, y) + F̂3n(k, y),

    subject to ∂y ûn(k, −h) = 0, ûn(k, 0) = 0. Instead of using the Chebyshev tau
    method [8, 24] to solve this BVP, we multiply by a test function, integrate the
    first term by parts, and proceed as if implementing a finite element method using
    Chebyshev polynomials as the basis functions. Our implementation is similar to
    what was done in [30] to study the projected dynamics of kinetic diffusion equations
    in spaces of orthogonal polynomials. Once ûn(k, y) is known for each k, we compute
    un,x and un,y as described above for u0,x and u0,y.


    The key observation is that the derivatives on F1n and F2n in (2.11), and on un
    at the end of the procedure (to obtain un,x and un,y), are balanced by the inverse
    Laplacian in (2.11). In other words, at the point in the algorithm where large
    numbers enter the computation due to applying derivatives in Fourier space, we
    divide by even larger numbers by applying the inverse Laplacian. By contrast,
    in the CS expansion, Gn(f) is expressed as a sum of several terms, each involving
    n derivatives of products of D with powers of η. Each derivative amplifies roundoff
    error, making it difficult to extract the desired sum, which is often many orders
    of magnitude smaller than the individual terms, as shown below.


    # 3. Comparison of the methods.


    In this section we assess the merits and shortcomings of the CS method and the
    AFM/AFM* methods. In §3.1, we explore the convergence of the CS expansion and
    quantify the delicate cancellation of terms mentioned in [23]. In §3.2, we present
    an example illustrating a circumstance in which the AFM* method (in its usual
    interpretation) is guaranteed to fail. By oversampling the columns of the linear
    operators involved in the AFM/AFM* methods, we are once again able to compute
    the true normal derivative with spectral accuracy. We also report on the performance
    of the CS expansion method for the examples considered for the AFM method. Finally
    in §3.3 we consider the performance of these three methods, as well as the TFE
    and BIM methods, on two examples in which the Dirichlet data'
