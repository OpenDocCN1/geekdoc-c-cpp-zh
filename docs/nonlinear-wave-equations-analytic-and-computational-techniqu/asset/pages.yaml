    # 4. Integrable Discretization


    We construct an integrable discretization of KdV (1.1) by (i) discretizing the
    linear scattering problem of the zero-curvature condition associated wiht KdV
    (1.1) and then (ii) choosing a time-dependence matrix so that the evolution equation
    that results from the discrete compatibility condition has KdV as a continuum
    limit. This approach is an adaptuation of the method used to construct integrable
    discretizations of nonlinear Schrödinger equation [4] as well as matrix and vector
    generalizations [5].'
