- pgno: 17
  md: '![](img/c92a9d81ba7f671c83a4c600d27389fb_17_0.png)


    FIGURE 1. Evolution of ZK lattice (1.3) showing repeated, approximate recurrences
    of the lowest Fourier mode at regular time intervals. For this simulation, δ =
    .022 and N = 128 with the single-mode initial condition (1.5). Legend: circles
    t = 9.956; squares, t = 19.910; diamonds, t = 29.856.


    # 2. Zabusky-Kruskal Lattice


    The approximate recurrence to the low-mode condition (with a phase shift) is plainly
    visible in plots of the simulation (Figure 1). However, the recurrence is more
    striking in Fourier space (Figure 2). Moreover, the Fourier-space view of the
    evolution of (1.3) clearly shows that the regular recurrence of the low-mode state
    is a transient phenomenon.


    The strength and persistence of the recurrence (or, inversely, the decay rate
    of the recurrence peaks) depends strongly on the number of nodes of the lattice
    (inversely proportional to the discretization length, h). Specifically, the recurrences
    are strongest and most persistent for a middle range of N (centered on N ≈ 100)
    values. Notably recurrence weakens as N → ∞ and the lattice approaches KdV. In
    contrast, the time of recurrences, is not observed to be dependent on N. (See
    Figure 3.)


    These simulations suggest, surprisingly, that the mechanism of recurrence is a
    property of the ZK lattice itself, not simply a reflection of the properties of
    the continuum limit, KdV. In other words, recurrence in KdV occurs because KdV
    is “close” to the ZK lattice, and not vice-versa. Given the narrow range (in N)
    of the strongest and most persistent recurrence, it is was a stroke of good luck
    that Zabusky and Kruskal considered simulations in the middle of this set values.


    # 3. Spectral Discretization


    The spectral discretization of KdV (1.1) is obtained by truncation of the Fourier-series
    expansion of the the PDE [2]. That is, we write KdV with periodic boundary conditions
    in terms of the Fourier series (in x) of u to obtain


    d/dt û_k = - i 2πk / L ∑_ℓ û_{k-ℓ} û_ℓ - δ² (i 2πk / L)³ û_k ,


    where


    u = ∑_k û_k e^{i (2πk / L) x} ,'
