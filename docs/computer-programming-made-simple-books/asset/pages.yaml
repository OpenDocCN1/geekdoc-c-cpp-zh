  md: '# 43

    Program Testing Facilities


    One of the most difficult aspects of computer programming is that involved in
    testing a program once it has been written. When a program is to be tested it
    will be compiled and run with specially prepared test data (designed to check
    each path within the program). The output of the test run will be compared with
    the anticipated output to verify that the program is working correctly. Frequently,
    of course, the two differ and the programmer must discover which part of his program
    has been incorrectly coded in order that corrections can be made and the program
    retested. To aid the programmer during testing the COBOL language provides three
    statements which can be incorporated during the testing stage to provide additional
    information about the running of the program.


    # The TRACE Statement


    | Format |

    | --- |

    | READY TRACE RESET |


    Following the occurrence of a READY TRACE statement each paragraph name in the
    program which is executed causes a print-out to be made of that paragraph name.


    The printing of paragraph names in the sequence they will be executed will help
    the programmer trace the path or paths followed by data through his program. The
    RESET TRACE statement terminates the operation of a READY TRACE statement. Any
    number of combinations of READY and RESET TRACE statements may occur within a
    program under test enabling a number of small parts of a program to be examined
    for their logic paths.


    # The EXHIBIT Statement


    The EXHIBIT statement is used to print-out the value of a data item or literal.
    The EXHIBIT NAMED expression is effectively equivalent to a DISPLAY statement
    since it will cause the current value of identifier or literal to be printed out.
    (Note—depending upon the computer system in use the'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# 224 Computer Programming


    | Format |

    | EXHIBIT { NAMED CHANGED } { identifier-1 nonnumeric-literal-1 } |

    | [ identifier-2 nonnumeric-literal-2 ] |


    EXHIBIT statement may cause values to be printed either on the operator''s console
    or on a printer device.) For example, if testing the programmer wished to know
    the value of the item COUNT every time the paragraph LOOP executed he used the
    following:


    LOOP. EXHIBIT NAMED “LOOP NO”, COUNT.


    In this case he has preceded the value of COUNT with a literal to identify the
    meaning of the value to him (this would be, of course, particularly useful when
    a number of data items were to be listed during one test). EXHIBIT CHANGED statement
    causes the value of identifier to be listed only if it is different from the last
    time the EXHIBIT was executed. The values are all considered to have changed when
    the EXHIBIT CHANGED is first executed in a program.


    EXHIBIT CHANGED TOTAL.


    will cause the value of TOTAL to be printed for each execution of the EXHIBIT
    statement for which the value of TOTAL has changed.


    # The DEBUG Statement


    This statement is used to enable the programmer to insert additional coding into
    a paragraph, for use testing, without altering the paragraph itself. The DEBUG
    card specifies the name of the paragraph to contain the additional coding and
    is followed by that coding.


    | Format |

    | DEBUG location |


    For example, suppose we are testing a program containing the following coding:


    LOOP. PERFORM CALL SUB TIMES.

    MOVE 1 TO INDIC.


    During testing the programmer may wish to insert a specific value into SUB before
    the PERFORM in paragraph LOOP is executed. He cannot insert a'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Program Testing Facilities 225


    MOVE statement immediately before the paragraph LOOP since this paragraph is the
    subject of the GO TO statement (and the MOVE would not therefore be executed.
    Instead he can place the following statements at the end of his program.


    ```

    DEBUG LOOP.

    MOVE 1 TO SUB.

    ```


    The statement(s) following the DEBUG card is then executed as if it had been written
    between LOOP and PERFORM, i.e. it is equivalent to rewriting the paragraph LOOP
    thus:


    ```

    LOOP. MOVE 1 TO SUB.

    PERFORM CALC SUB TIMES.

    MOVE 1 TO INDIC.

    ```


