  md: '# Table Handling 203


    The second time all SUB will have the value 3 and so on. Suppose we wish to produce
    the total of all the amounts in TAB1; however not all the elements are necessarily
    used—the first occurrence of spaces in NAME1 will indicate the end of processing.
    We could use the following:


    ```

    PERFORM TABADD VARYING SUB FROM 1 BY I

    UNTIL SUB = 21 OR NAME1 (SUB) = SPACES.

    ```


    Note that we must still test for a terminal value of SUB (in addition to examining
    NAME for places) to cater to the case when all the elements of TAB1 contain a
    definite (non spaces) value.


    Instead of checking for spaces we might have a field containing count of the number
    of elements in TAB1 which are to be totalled:


    ```

    PERFORM TABADD VARYING SUB FROM 1 BY I

    UNTIL SUB IS GREATER THAN TAB-COUNT.

    ```


    In each of these cases the performed paragraph could be:


    ```

    TABADD ADD AMOUNT-I (SUB) TO TOTAL.

    ```


    The PERFORM statement is very useful for printing out details of table contents
    as the following example will demonstrate. Consider a variable length input record,
    read from tape, containing details of transactions carried out by a particular
    customer and having the following format:


    ```

    01 TRANS.

    02 ACCNO PICTURE 9999.

    02 NAME PICTURE X(20).

    02 NO-TRANS PICTURE 99.

    02 TRANS-DETAILS OCCURS 20.

    03 DATE PICTURE X(6).

    03 CODE PICTURE XXX.

    03 AMOUNT PICTURE 9(4)V99.

    ```


    These details are to be printed out with each transaction occupying one line,
    the first line is also to contain the customer account number and name. The number
    of the first transaction to be printed has already been computed and stored in
    the field START.

    The print-line is defined thus:


    ```

    01 PRINT-LINE.

    02 FILLER PICTURE XXX.

    02 P-ACCNO PICTURE 9999.

    02 FILLER PICTURE XX.

    02 P-NAME PICTURE X(20).

    02 FILLER PICTURE XXX.

    02 P-DATE PICTURE XXBXXXX.

    02 FILLER PICTURE XX.

    02 P-CODE PICTURE XXX.

    02 FILLER PICTURE XX.

    02 P-AMOUNT PICTURE £(4)9.99.

    ```


    The following Procedure Division entries could be used to accomplish this printing:


    ```

    PERFORM PRINT THRU PRINT-END VARYING SUB FROM

    START BY 1 UNTIL SUB GREATER THAN NO-TRANS.

    .

    .

    .

    ```'
