    Because of the high speed with which the tape moves on a modern tape-deck it is
    not possible to match the acceleration of the (comparatively heavy) tape reels
    with that of the tape. To overcome this the tape passes through a reservoir either
    side of the tape/ write head assembly. This reservoir consists of a loop of tape
    maintained by a vacuum underneath it. When the tape is accelerated past the read/
    write heads the reservoir is depleted slightly and the supply reel is allowed
    to fill it up again. The take-up reel works completely.


    Typical speeds for tape-deck reading and writing are between 30,000 and 300,000
    characters per second transferred between the deck and core storage. A reel of
    magnetic tape can hold up to 20 million characters of information. However this
    transfer rate and storage capacity can be effectively reduced if the size of the
    blocks of data recorded is not chosen carefully. Each interblock gap on a tape
    will be about ½ long: on a data recording at 800 characters per'
