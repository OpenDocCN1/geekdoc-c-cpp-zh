  md: '# 44

    Eject and Skip


    When a program is compiled the COBOL language compiler will produce what is known
    as a source listing of the input data. In other words it will print out all the
    source source statements comprising the program. The programmer has available
    four compiler directing commands to improve the readability of this listing.


    The EJECT Statement


    | Format |

    | --- |

    | 1 Area B |

    | | EJECT |


    The EJECT statement which, as shown in the format above, can appear anywhere in
    Area B instructs the compiler to advance the source listing to the top of the
    next page.


    Where used the EJECT statement must be the only statement on a line and that line
    must contain no punctuation.


    The SKIP Statement


    | Format |

    | --- |

    | 1 Area B |

    | | SKIP1 |

    | | SKIP2 |

    | | SKIP3 |


    The SKIP statement which again may appear anywhere in Area B, instructs the compiler
    to advance the source listing 1, 2 or 3 lines (i.e. requests single, double, or
    triple spacing). The SKIP statement must be the only statement on a line and that
    line must contain no punctuation.


    It is most important to remember that the EJECT and SKIP statements refer only
    to the listing of the COBOL program produced by the compiler (i.e.)'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'the source listing). They do not affect, in any way, the printed output of
    the program when that program is executed.


    # Exercises


    +   1. Write the statement to advance the source listing two lines.

    2. Write the statement to advance the source listing to the top of the next page.'
  merge: -1
