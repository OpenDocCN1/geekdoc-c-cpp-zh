    is written (Note—a complete set of data blocks on a tape is referred to as a file).
    This end-of-file marker will be detected during the reading process and will inform
    the computer program that the file is finished. If the end-of-file metallic strip
    is detected (automatically) before the file is completely written to the tape
    then continues on another reel (end-of-reel). Conversely, if an end-of-reel marker
    is detected during the reading process the next reel of tape will be called for
    so that reading of the file can continue. Data will be read from the tape, under
    program control, by the issuance of a read instruction (Chapters 32 and 54).


    Initially, when the tape is aligned over the first metallic strip, the read head
    will be positioned over an inter-block gap. When a read instruction is issued
    the read head is switched on and the tape accelerated. By the time the data reaches
    the read head the tape will be travelling at full speed. The data on the tape
    will be identified will be accomplished in a designated area of core storage until
    the inter-block gap is reached. Reading of data blocks can continue until the
    end-of-file marker is identified (Note that the transfer of reels when an end-of-reel
    marker is accomplished automatically and a programmer will not be aware of its
