  md: '# 37


    # Table Handling


    A table (or array) is a collection of ordered items having positional significance
    relative to each other and could be likened to a set of pigeon holes with each
    data element in the table corresponding to a single hole. We have already seen
    (Chapter 22) the use of the OCCURS clause to define tables. To recap consider
    this definition of a table:


    Ø2 TABLE OCCURS 4 TIMES PICTURE 999.


    This table could be pictorially represented thus:


    | TABLE | TABLE | TABLE | TABLE |

    | (1) | (2) | (3) | (4) |


    We have already seen that individual table elements can be referenced by the use
    of literal subscripts:


    ```

    ADD TABLE (1) TO TOTAL

    ```


    Subscripts may also be specified as variables, at execution time the variable
    is evaluated and its current value taken as the element number required. For example,
    suppose the element SUBS had the current value taken of 1 then the following statement
    is equivalent to that shown above:


    ```

    ADD TABLE (SUBS) TO TOTAL.

    ```


    Suppose we wish to add the value of each element in this table to the item TOTAL,
    we could write the four statements:


    ```

    ADD TABLE (1) TO TOTAL.

    ADD TABLE (2) TO TOTAL.

    ADD TABLE (3) TO TOTAL.

    ADD TABLE (4) TO TOTAL.

    ```


    To do this for much larger table would be extremely tedious, to say the least,
    so instead we could use a variable subscript:


    ```

    MOVE 1 TO SUBS.

    LOOP. IF SUBS GREATER THAN 4 GO TO LOOP-END.

    ADD TABLE (SUBS) TO TOTAL.

    ADD 1 TO SUBS.

    ```'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'Computer Programming


    # GO TO LOOP.

    LOOP-END.


    This coding can be improved upon use of the PERFORM statement as shown:


    ```

    MOVE 1 TO SUBS.

    PERFORM LOOP 4 TIMES.

    ```


    ```

    LOOP. ADD TABLE (SUBS) TO TOTAL.

    ADD 1 TO SUBS.

    ```


    This is a simple example of table handling and it is quite acceptable to use the
    type of coding shown. However, the programmer will often find a requirement for
    much more complicated table-handling features needing more coding to set up the
    initial conditions (in the case MOVE 1 TO SUBS), the incrementing of the subscript
    (ADD 1 TO SUBS) and the termination of the loop. In the case above the paragraph
    will always be performed four times; however, instances may exist where the table
    handling is to be terminated if a specific condition arises.


    # PERFORM Varying Option


    An additional format of the PERFORM statement is provided for this more advanced
    table handling.


    | Format 4 |

    | PERFORM procedure-name-1 [THRU procedure-name-2] |

    VARYING identifier-1 FROM {literal-2 identifier-2}

    BY { literal-3 identifier-3 } UNTIL condition-1 |


    The sequence of events for this type of PERFORM statement is as shown below:


    +   1. The value of identifier-1 is set equal to the current value of identifier-2,
    or the value of literal-2 (whichever is specified). This is called the starting
    or initial value of identifier-1.'
