  md: '# The Identification Division


    The Identification Division is used to identify the program and optionally certain
    information about its writing. This division must appear first in the source program
    and is identified by the following entry which must appear in Area A:


    # IDENTIFICATION DIVISION.


    The possible entries that can be given in the Identification Division are shown
    below, and, when used, must appear in the sequence shown:


    ```

    IDENTIFICATION DIVISION.

    ID DIVISION.

    PROGRAM-ID. program-name.

    [AUTHOR. [comment-entry]...]

    [INSTALLATION. [comment-entry]...]

    DATE-WRITTEN. [comment-entry]...]

    DATE-COMPILED. [comment-entry]...

    [SECURITY. [comment-entry]...]

    [REMARKS. [comment-entry]...]

    ```


    Required Entries

    Only the PROGRAM-ID paragraph is mandatory in this division:


    |------------------------------------------------------|

    | Format |

    |------------------------------------------------------|

    | PROGRAM-ID. program-name. |

    |------------------------------------------------------|


    This entry gives the name to the program by which it will be known to the operating
    system. The format which this name takes is usually specific to the particular
    computer system in use. For example, when using IBM System 360 each program''s
    name can be from 1 to 8 characters in length and must begin with an alphabetic
    character.


    # PROGRAM-ID. SAMPLE.


    A program containing the above entry would be known to the operating'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# The Identification Division 229


    system as SAMPLE and once compiled could be executed by giving this name in the
    appropriate command to the operating system. For example, depending on the computer
    system in use, one of the following commands could be given to the operating system
    to execute the program:


    ```

    EXEC SAMPLE

    RUN SAMPLE

    GO SAMPLE

    START SAMPLE

    ```


    Each program written, therefore, must contain an Identification Division with
    a PROGRAM-ID entry to give a name to the program. Each program within an installation
    must have a unique name.


    # Optional Entries


    The other entries in the Identification Division are for documentation purposes
    only. Their normal use is described below:


    +   AUTHOR. The programmer who coded the program can insert his name into the
    source listing by using this paragraph.

    INSTALLATION. The name of the company for whom the programmer is working may be
    inserted in this paragraph. This is, of course, particularly helpful when programs
    are made available to a number of users.

    DATE-WRITTEN. Self-explanatory.

    DATE-COMPILED. When this entry is given the compiler will replace any comment
    entry made with the date on which the program was compiled. This may be different
    on each source listing of the program and can be useful for identifying the latest
    version of a program.

    SECURITY. If the use of a program is in any way to be restricted a comment that
    he wishes. It is common to find this paragraph used to that effect given however,
    that the appearance of an entry here does not restrict the use of the program
    in any way.

    REMARKS. The programmer may insert any additional information here to find this
    paragraph used to give a brief description of the processing performed by the
    program.


    A sample Identification Division is shown below:


    ```

    IDENTIFICATION DIVISION.

    PROGRAM-ID. EXAMPLE.

    AUTHOR. J. MAYNARD

    INSTALLATION. HEINEMANN

    DATE-WRITTEN. 1984

    DATE-COMPILED. THIS COMMENT WILL BE REPLACED BY THE ACTUAL DATE.

    SECURITY. FREELY AVAILABLE.

    REMARKS. THIS IS THE IDENTIFICATION DIVISION

    FOR A SAMPLE PROGRAM TO ILLUSTRATE COMPUTER PROGRAMMING MADE SIMPLE

    ```


    # Exercise


    +   1. Write the Identification Division for a program written by yourself called
    MINE.'
  merge: -1
  pgno: 260
