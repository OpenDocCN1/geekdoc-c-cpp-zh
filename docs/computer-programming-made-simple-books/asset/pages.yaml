  md: '![](img/65765bbbc6edc77d698bfd1cdb00e913_374_0.png)


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_374_1.png)


    A useful analogy is to think of a group of soldiers marching abreast (parallel
    transmission) or in single file (serial transmission). To change the direction
    of a group of soldiers they will stop, turn 90°, left or right, and continue.
    To convert from serial to parallel data transmission (or the reverse) requires
    only a special chip. The chip in question (a serial input/output) interface is
    really beyond the scope of this book and is not something the home computer user
    needs to understand. However, to assist the reader in understanding some of the
    advertising literature relating to home computers, a few of the more popular chips
    are described below (note that most of them are known by their initials):


    # UART


    The Universal Asynchronous Receiver Transmitter acts as a serial to parallel and
    speed converter. It is generally used to interface to slow-speed devices such
    as teletypewriters.


    # FIFO


    The First In First Out is used to expand a CPU register capacity. Data is retrieved
    from the fifo in the order in which it is put.


    # UPC


    A Universal Peripheral Controller is used to control high-speed peripherals. It
    is often programmable and a powerful CPU in its own right.


    # MMU


    A Memory Management Unit takes over the task of memory bus control from the main
    CPU.'
