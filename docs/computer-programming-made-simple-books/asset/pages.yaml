    # Formatting


    When a PRINT statement contains a number of variable names such as this example:


    ```

    PRINT, A, B, C, D

    ```


    the values subsequently printed when the program is executed will be automatically
    tabulated in columns across the page. When the same (or similarly coded) PRINT
    statement is executed several times (in a DO loop for example) the automatic column
    tabulation will be the same each time producing neat columns of figures on print-out.

    Since FORTRAN is a language aimed at solving calculations its tabulation facilities,
    other than those mentioned above, are fairly complicated to master. They are therefore
    beyond the scope of this book; the reader will find the automatic tabulation quite
    adequate while familiarizing himself with FORTRAN.


