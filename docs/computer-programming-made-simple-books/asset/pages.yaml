    Note that since TRANSACTIONS will either be to spaces or it will not be equal
    to spaces one of the statements above can be executed.


    +   4. Suppose a program to transfer END-OUT if the value of SWITCH is 1 and to
    END-IN if the value of SWITCH is not I; the following statement could be used:


    ```

    IF SWITCH = 1 GO END-OUT ELSE GO END-IN.

    ```


    Note that in this case the statements following the IF will only be executed if
    given a name which appears in a GO TO statement.


    +   5. Consider a program validating an input record—if the field ACCNO is not
    numeric then I is to be transferred to an error field whose control is be transferred
    to ACCNO-OK. IF ACCNO is in error the transfer to the print-routine is to be performed
    and control to be transferred to READ-IN:


    ```

    IF ACCNO NOT NUMERIC ADD I TO ERR ELSE GO ACCNO-OK.

    PERFORM ERR-ROUTINE; GO TO READ-IN.

    ```


    Note that if ACCNO is not numeric add I TO ERR executed then control is transferred
    to the next sentence where the PERFORM is executed.


    +   6. The statements in (5) above could be rewritten:


    ```

    IF ACCNO NOT NUMERIC NEXT SENT ELSE GO ACCNO-OK.

    ADD I TO ERR; PERFORM ERR-ROUTINE; GO TO READ-IN.

    ```


    ```

    IF SEX = “M” THEN BONUS = BONUS*2 ELSE BONUS = BONUS*1.5.

    ```


    # Nested If


    Statement-1 or statement-2 in an IF statement may themselves be an IF statement,
    the second being called a nested IF statement. Although there is no limit to the
    number of levels of nesting it is not recommended that more than one IF statement
    be nested within another in order to avoid ambiguity.


    (Note–nested IF statements can be recalculated without the use of nesting)


    Consider the last IF statement example shown above. Suppose that, in addition
    to the test shown, it was desired to differentiate the male bonus rates between
    those under 21 and those over 21. The following nested IF statement could be used:


    ```

    IF SEX = “M” THEN IF AGE < 21 THEN BONUS = BONUS*2

    ELSE BONUS = BONUS*3

    ELSE BONUS = BONUS*1.5.

    ```'
