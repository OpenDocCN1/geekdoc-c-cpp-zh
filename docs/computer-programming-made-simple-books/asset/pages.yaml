  md: '# 3

    Input Devices


    Input devices on computer systems are required to transmit data prepared by or
    readable by humans into the computer memory unit from where they can be processed
    under control of a computer program. It is not the intention of this book to describe
    in detail the electronic workings of computers (the interested reader is referred
    to Electronic Computers Made Simple). However, a little must be said to enable
    the reader to appreciate the need for the various input devices in a computer
    memory, whether they represent the instructions of a program or the name of a
    customer, are likened to a series of electrical pulses each of which can be a
    negative or a positive pulse represented diagrammatically by the digits 0 and
    1). Any character, number, or instruction is therefore represented, in the computer
    memory, as a unique set of pulses (e.g. the letter A might be represented as 11100001).
    A stream of data being input to a computer could be likened to a string of morse-code
    characters, the major difference being that in a computer system each digit or
    character is represented by the same number of pulses.


    As already mentioned, a detailed account of the internal workings of a computer
    is beyond the scope of this book; however, the reader should now appreciate that
    data is understandable to himself as:


    > JOHN SMITH 12 HIGH STREET ANYTOWN


    cannot be understood by a computer. Indeed, as we will see below, this data cannot
    even be understood by an input device.


    An input device is a means of transmitting data into the computer memory as a
    series of electrical pulses. The input device will read (see below) an input media
    coded with the information the human operator wishes to give to the computer and
    will transcribe it somehow into a string of pulses.


    Scientists and engineers are still endeavours to design input devices which read
    human handwriting and translate it into the required string of pulses. Unfortunately,
    the vast variation found in different samples of such writing presents a major
    obstacle and these type of input devices are still very much in the experimental
    stage.


    In order to input data to a computer it is necessary therefore to have an intermediate
    stage during which the handwritten data is mechanically transcribed by a clerk
