  md: '# 20

    Data Classes in COBOL


    We have now reached the stage where we wish to describe the compiler all the data
    items or data fields which the program will process. In order to do this we obviously
    seem to know the type of data each field will hold and the size of each field
    (i.e. the number of characters it will contain). The major problem here would
    be knowing the types of data that occupy a given field. Let us look therefore
    at the classes of data available to the COBOL programmer. The COBOL compiler recognises
    editing is to be undertaken—alphabetic, numeric and alphanumeric. Within the alphanumeric
    class a number of categories is available; however, since editing is fully described
    in Chapter 24 it will be disregarded during the present presentation.


    Every elementary item used within a program will belong to one of the three classes
    of data. The particular class in each case will be identified by the use to which
    the item is to be put or by the content of the item when the program is run. Since
    each of these items has to be defined when the program is first coded it is the
    responsibility of the programmer to identify the class to which each item belongs.
    This may seem to be another problem for the programmer to cope with; however,
    once the data classes have been studied (see below) the reader will appreciate
    that little will be required to determine the class for each item.


    # Alphabetic Class


    A data item defined as being of the alphabetic class is one that will contain
    only the letters A to Z (the alphabet) plus the space character. Valid alphabetic
    data-item values could be as follows:


    ```

    ABCDEFG

    ZXYQ R

    P

    YOUR NAME

    ```


    This class in fact will not be used a great deal since the omission of numeric
    characters is something of a drawback (for example, a name and address would no
    doubt require a number in the address).


    # Numeric Class


    A numeric item is one consisting of the digits 0–9 and optionally a sign (+ or
    –) character. Note, however, that the sign character does not occupy a separate'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Data Classes in COBOL


    location in memory (the manner in which the sign is stored varies from computer
    to computer and will not be described here).


    A numeric item be stored either in decimal or binary form. A decimal number will
    require one storage position for each digit in the number. A binary number will
    require less than one storage position per digit although the exact number of
    digits which can be stored in each location will depend upon the computer use.
    The reader needs only remember that binary numbers are written in the same manner
    as decimal ones and that the correct storage allocation will be made by the compiler.


    In view of the differences between different computers when binary numeric items
    are handled all examples in this part will refer to decimal items. Valid numeric
    data values could be:


    ```

    +1

    -2

    2367

    +0123

    ```


    Note. The method of specifying the location of a decimal point for a numeric item
    is described in Chapter 21. You will remember from Chapter 9 that a numeric constant
    can take the form 27.3 where the period or full-stop represents a decimal point.
    The decimal point is not stored in memory when a numeric constant is moved to
    a data field of numeric class. Instead the compiler ''remembers'' where the decimal
    point is to be kept and ensures that the correct calculations are performed.


    # Alphanumeric Class


    A data field in this class can contain a combination of any of the allowable characters
    for the COBOL compiler (see Chapter 10). An alphanumeric class data item could
    contain a combination of just its numeric digits:


    ```

    7894

    ```


    However this field could not be used for arithmetic calculations; these may only
    be done with data fields defined as being of numeric class. In order that alphanumeric
    (and alphabetic) fields be distinguished from numeric ones they are usually enclosed
    in quotation marks when written in a program (the quotation marks themselves are
    not stored in memory).


    Note. A group item is always treated as an alphanumeric class regardless of the
    class of the elementary items making up the group.


    # Data Description


    A data-description Entry is the clause or clauses that specify the characteristics
    of a particular non-contiguous data item, or of a data item within a record. The
    data description consists of a level number, a data name plus the required data-description
    clauses. A record-description entry is a collection of data-description entries
    arranged in a hierarchical manner to specify the structure of the record.


    A data-description entry defining a non-contiguous item (i.e. using special level
    number 77) can occur in the Working-Storage and Linkage Sections. A record-description
    entry can occur in the File, Working-Storage, and Linkage Sections.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# 124 Computer Programming


    # General Format


    ```

    level number { data-name { FILLER } }

    [REDEFINES Clause]

    [BLANK WHEN ZERO Clause]

    [OCCURS Clause]

    [PICTURE Clause]

    [USAGE Clause]

    [VALUE Clause]

    ```


    General Rules

    This format may be used for record-description entries in the File,

    Working-Storage, and Linkage Sections and for non-contiguous data-item

    descriptions in the Working-Storage Section and the Linkage Section. As we

    have already seen the level number may be in the range 01-49 for record-

    description entries or 77 for non-contiguous data-item descriptions (see

    Chapter 27 and Chapter 21 for special level 88). The optional clauses can be specified
    in

    order except that the REDFINES clause (Chapter 22), if used, must appear

    first. The PICTURE clause (Chapter 21) must be specified for all elementary

    items. Each data description will be terminated with a period although

    semas or colons may be used to separate the clauses.


    # Data-name Clause


    This clause specifies the name of the data item which is to be described. The
    data name is the name which the programmer wishes to give to this particular

    data item. This name refers to the area in memory and not to a particular

    value; the item to which the name refers may assume different values during

    execution of the program.


    ```

    Format

    level number { data-name { FILLER }

    ```


    The keyword FILLER is used to describe data items which will not be

    referenced in the program. For example, a program may read in a file with

    large records but only need to access, say, the first and last fields. The

    intermediate fields must be defined to the compiler in order that the following

    fields are accessed correctly although no reference will be made to the

    intermediate fields.


    Examples

    77 SWITCH

    02 PENSION-FUND'
