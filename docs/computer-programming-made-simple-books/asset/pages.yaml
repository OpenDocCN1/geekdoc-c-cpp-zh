  md: '# 48


    # Introduction


    The name FORTRAN is an acronym of FORula TRANlation which hints at the major use
    for which this language was designed—i.e. the solution of **mathematics based**
    problems. Such is the simplicity of FORTRAN that non-computer personnel with only
    a brief introduction to computing, such as engineers, mathematicians, designers,
    and so forth, can write and run programs to solve the problems they encounter
    in their everyday work. A major problem with programming by non-programmers is
    that they must still learn the intricacies of the computer operating system in
    use and in particular the Job-Control Language required to run their programs
    (see Chapter 8). To circumvent this problem a development utilising facilities
    remote from the main computer is becoming increasingly popular. The **Time-Sharing**
    and a brief description of it is given below prior to the FORTRAN language details.
    Note that the actual coding of FORTRAN programs is the same whether the job is
    to be run on a Time-Sharing System, a personal computer or directly on a mainframe
    computer.


    # Time-Sharing Computer Systems


    A time-sharing system is called so because it involves several separate users
    sharing the time available on a large central computer (in some circumstances
    may simultaneously be running local work). Each user is connected to the computer
    via a telephone line which can be either a permanent wire circuit, or more commonly,
    a dialled connection. The equipment at the users'' end of the telephone line is
    called a **terminal** and is basically an electric typewriter. When any of the
    keys are depressed the relevant character is printed on the terminal and the code
    representing that character is transmitted, via the telephone line, to the computer.
    The computer can send messages back to the terminal as a series of electric pulses,
    along the telephone wire, which are converted into the terminal printed characters.
    The user can therefore communicate with the computer by typing on the terminal.
    He will receive the computer''s reply also on the terminal.


    A typical time-sharing serve may permit thirty different users to be connected
    to the computer at any one time. A smaller time-sharing network is illustrated
    in Fig. 44. The **modem**, shown attached to each **terminal telephone**, is used
    to eliminate the normal voice pick-up of the telephone handset once communication
    is established with the computer. The **multiplexer**, at the'
  merge: -1
