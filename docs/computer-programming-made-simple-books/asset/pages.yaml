    # V Mode


    This may be specified when each record is of variable length but wholly contained
    within one block. As already mentioned variable-length record is preceded by a
    field containing the length of that record; however; since this field requires
    no involvement from the programmer it can be ignored. The range of block sizes
    for variable-length fields is specified with a BLOCK CONTAINS clause. For example
    a file whose blocks can be between 100 and 300 characters could have the clause:


