    **The PERFORM Statement**


    The PERFORM statement is used to depart from the normal sequence of statements
    in order to execute a statement or series of statements, a given number of times;
    or until a specified condition exists. After the statements are executed control
    is returned to the statement following the PERFORM.


    | Format 1 |

    | PERFORM procedure-name-1 [THRU procedure-name-2] |


    | Format 2 |

    | PERFORM procedure-name-1 [THRU procedure-name-2] |

    | { identifier-1 \ integer-1 } TIMES |


    | Format 3 |

    | PERFORM procedure-name-1 [THRU procedure-name-2] |

    | UNTIL condition-1 |


    *General.* Each time a PERFORM statement is executed control is transferred to
    the first statement of the procedure with the name procedure-name-1. Control is
    always returned to the statement following the PERFORM; from the point which this
    control is passed is determined according to the following rules:


    +   1. If procedure-name-2 is not specified—return is made after the execution
    of the last statement of procedure-name-1.

    2. If procedure-name-2 is specified—return is made after the execution of the
    last statement of procedure-name-2.


    Format 1. This statement causes the procedure(s) named to be executed once only.'
