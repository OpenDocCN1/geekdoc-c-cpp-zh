    piece. However, to make paper handling easier it is usual to divide it, with perforations
    across the paper, into pages. A common page size is 15” wide by 11” The paper
    can be advanced, under program control, the next line-printing position corresponds
    with the top of the next page.


    Many personal computers use daisy wheel printers, so called because the characters
    are embossed on the fingers or spokes of a wheel that has the appearance of a
    daisy. A daisy wheel printer has a single hammer that strikes the paper as the
    appropriate character on the revolving wheel passes. Only one character is printed
    at a time. Daisy wheel printers are available at speeds from 10 characters per
    second (cps) to 200 or so c.ps.


    Since the position of the paper on a line printer can be accurately controlled
    it is possible to use stationery which has standard or static information printed
    on it (this pre-printing normally being carried out by the paper manufacturers).
    Typical applications of pre-printed stationery include invoices, statements, gas
    bills and so the pre-printing would include a mixture of text (e.g. gas tariffs)
    and lines (e.g. the box in which name is printed on an invoice). The additional
    program instructions required when controlling the positioning of pre-printed
    stationery are discussed in detail in Part 2.


