  md: '# 60nThe Let Statement


    The LET statement, or assignment statement as it is sometimes known, is used to
    change the value of a variable; it is used to assign a value to a variable. The
    general form of the LET statement is:


    ```

    nnnn LET v = expression

    ```


    where nnnn is the line number, v is a variable name and expression is any valid
    combination of variables, constants and operators that will define the new value
    of v. In its simplest form the LET statement will assign the value of a constant
    to a variable:


    ```

    135 LET ANSWER = 27

    145 LET RATE = 146.2416

    155 LET C$ = "STRING"

    ```


    Note that since the variable in line number 155 (C$) is of string type it must
    be assigned a string value. Similarly, numeric variables must be assigned an expression
    whose value is numeric.


    The next simplest form of the LET statement is where a variable is assigned the
    current value of another variable:


    ```

    215 LET CODE = RATE.NO

    225 LET G = G2

    235 LET NAME$ = CUSTOMERS

    ```


    Note that the value of the variable on the right of the equals sign is not changed
    by the execution of the LET statement. The LET statement is easier to understand
    if the ‘=’ is considered to mean ‘is replaced by’ thus:


    ```

    165 LET AMOUNT = 2

    ```


    can be considered ‘AMOUNT is replaced by 2’.


    # Expressions


    BASIC will allow complex expressions to be written on the right-hand side of a
    LET statement. We have already seen that an expression is a combination of variables,
    constants and operators. The first two of these are already familiar from the
    previous chapter. Operators are simply the arithmetic symbols shown next and brackets:'
