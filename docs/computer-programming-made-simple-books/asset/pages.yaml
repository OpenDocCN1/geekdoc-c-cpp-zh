  md: '# 7 Program Specification Analysis


    ### Program Specifications

    The programmer may on occasion prepare the specification for a program himself.
    However, it is more common for the program specification to be prepared by a Systems
    Analyst and passed to the programming department for coding (see *Computer Programming
    Management* (London: Butterworths, 1972 by the present author)). Many trainee
    programmers, despite being fully conversant with a programming language (see Parts
    2 and 3) stare at a blank sheet of paper for a long time when given their first
    program to code: when asked why they reply ''I don''t know where to start.'' A
    strange response perhaps—but where does one begin?


    This aspect of programming is in fact very difficult to teach to a newcomer; indeed
    little research appears to have been done in producing this industry. The major
    stumbling-block to producing a computer program is the conversion into a flowchart.
    While the flowchart has been produced and verified as representing the logic required
    is a relatively easy task to actually code the processing steps. This chapter
    will assist the reader in producing his flowchart from a first specification.
    With most aspects of programming this becomes less and less of a problem as the
    experience of the practitioner increases. The form of a program specification
    is not something that can be described in standard terms. Some have their own
    individual guide-lines but even here individuals have their own idea of what constitutes
    a complete specification. However, there are a number of minimum requirements
    which the beginner can look for when reading his first specification. These are
    described below.


    ### Introduction

    This section of the program specification serves to outline the basic function
    of the program and to specify the relationships if any that the program has with
    other programs. For example, an introductory paragraph for a simple card validation
    run might read as follows:


    This program reads and validates the weekly payroll amendments, writing accepted
    data to a transaction file. This program is the first in the payroll run and is
    followed by the master file up-date.


    As you can see this is really a brief introduction but is nevertheless an important
    requirement for a program specification.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Input


    All the files which are to be read by the program are described here. Note that
    a file layout description must either be given or referred to here in order that
    the program can code those relevant parts of the program without reference elsewhere.
    The input section of the program specification quoted above could be as follows:


    Card File. Pavroll weekly amendments are read from a punched-card file prior to
    validation (see below). The layout of the cards is as shown in App. 1 to this
    specification.


    # Output


    The files which are to be written by the program are listed here in the same manner
    as for input files above. The sample program specification could contain the following
    files list:


    +   * Tape File. Accepted amendments, read from cards above, are written to a
    magnetic tape file blocked in fours. Record layout is the same as the input file.

    * Print File. All input rejected by the validation routine are listed on standard
    stationery in card image format. Headings, including a page number, should be
    selected to reflect the nature of the printout.


    # Throughput (also called Processing)


    This section is also most important in the program specification since it describes
    the processes which the program is to contain and represents the problem to be
    solved by the program. The manner in which this section specified varies from
    being min detailed to extremely vague depending on the individual who has written
    the specification. The ideal format of a specification is a subject of controversy
    but would seem to be somewhere about the middle of the two extremes mentioned
    above (for a further discussion on the content of program specifications see Computer
    Programming Management by the same author). However, this section of the specification
    must give all the processing steps required and must be unambiguous. In other
    words, it must be sufficiently clear to enable the program to be coded without
    reference to the specification writer. Continuing with our sample specification
    we might have a throughput section within


    throughput. The program will read payroll amendments and validate according to
    the following rules. Each transaction read must be either a type 148 or 150 although
    these may appear in any order. Type 148 contains the employee''s new address and
    clock number; if an address is present it must consist only of alphabetic characters;
    the clock-number if present Type 150 specifies new deductions that may be made
    from an employee''s pay—up to 6 new deductions each consisting of a 2 digit identifier
    and an amount in pence. Spaces in the amount field would indicate the withdrawal
    of a deduction from the employee''s pay. Input records which are accepted as valid
    are written to the amendments file. Invalid records are listed with an appropriate
    comment.'
  merge: -1
