    # File Security


    Most commercial applications will contain what is known as a master file, this
    being the file containing the (more or less) permanent data for the system. For
    example, in a payroll application the master file would contain, for each employee,
    a record showing such details as name, clock-number, department, gross pay, bonus
    and year-to-date accumulations. This master file will need to be amended or updated
    on a regular basis to reflect changes in the basic information it contains. For
    example, in the payroll application the master file will need to have new starters
    added, leaves deleted, and the year-to-date figures brought up to date weekly.


    To update this master file another, containing the amendments, will be created
    in the same sequence as the master file. The two files will be matched and the
    master file records amended according to the details on the amendments file. It
    is rarely possible to overwrite a block on magnetic tape with another block (even
    of the same length) without disturbing the data block which follows. When updating
    a magnetic tape file it is necessary to create a new file that is a copy of the
    original, except for records which have been amended (plus any new records that
    have been created). Note that when processing sequential files every record on
    the file must be processed anyway.


    This creation of a separate updated master file improves the security of that
    file. The new master file is carried forward to the next run of the program when
    it becomes the input master file. The tape containing what is now the old file
    is not overwritten until a new master file has been produced on a'
