  md: '# Backing Store Devices 25


    A hard disc store consists typically of six circular plates, fixed to a central
    spindle, each surface of which is coated with a magnetic medium such as iron oxide.
    Both surfaces of each plate are used to contain data except for the top and bottom
    plates when only the inner surfaces are used. A set of disc plates (called a pack
    or cartridge) can thus have 10 surfaces on which data can be recorded. Disc packs
    can be removed from the disc transport mechanism for storing enabling data to
    be made available to the computer. For each recording there is a read/write head
    assembly, the five assemblies being joined in a comb-like structure (see Fig.
    13) and therefore moving in unison.


    To use a disc-recording device the disc packs are placed on the transport mechanism
    (while the head assembly is retracted to the left in Fig. 13) and the drive engaged.
    The disc pack is rotated at high speed (about 2500 revs per min.) and when the
    full speed is reached the head assembly is automatically moved to the first recording
    position of the outer periphery of the disc surfaces. Each arm of the head assembly
    contains two read/write heads—one for each of the surfaces between which the heads
    are positioned. Note that the heads do not actually touch the disc surfaces but
    float on a minute cushion of air (to avoid the disc surface being scratched).


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_48_0.png)


    Fig. 13. Schematic of magnetic disc unit.


    Each head on the disc drive can be positioned at each of typically 100 concentric
    bands on each surface. Since all the heads move together the same recording band
    is selected on each recording surface at the time. For any single head movement
    the computer canter access 10 bands of information (one per surface). These 10
    bands, or tracks are also called, together form a cylinder. There are therefore
    100 cylinders per disc pack. The dotted line in Fig. 14 shows one particular cylinder
    on a disc pack.


    Data head on a single cylinder can be accessed without any head movement. A large
    number of data blocks recorded would therefore follow the line of a cylinder rather
    than go track to track on a single surface. Only when the cylinder is full will
    the head be moved to another cylinder. In this way the amount of, relatively slow,
    head movement required is reduced to a minimum.


    Each cylinder has a specially recorded home address marker on to identify the
    beginning (in a circular direction) of that cylinder. Data blocks are'
