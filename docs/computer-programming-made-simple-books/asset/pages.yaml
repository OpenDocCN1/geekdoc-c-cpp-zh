  md: '# 62 Inputting Data


    Data for program variables can be input either from the program itself (in the
    form of constants) or read from the user''s keyboard. The method used for loading
    program variables from within is considered first.


    # DATA and READ Statements


    The DATA statement provides raw numbers or strings as constants for the READ statement
    to transfer to variables. The DATA statement stores the list of values in memory
    in form suitable for later Reading. Any number of DATA statements may appear in
    a program, but for the purposes of execution, they can be considered as one long
    joined in order. The READ statement always starts at the head of this list and
    picks up one item each time it is executed.


    ```

    146 DATA "NAME", 2

    148 READ STRING$

    152 READ NUMB

    ```


    The string variable STRING now contains ''NAME'' and the value of NUMB is 2. Note
    that the READ statement must encounter DATA values of the correct type otherwise
    a program error will occur.


    ```

    146 DATA 2,"NAME"

    148 READ STRING$

    152 READ NUMB

    ```


    An error will occur at both statements 148 and 152 because the data type from
    the DATA statement in 146 will be incorrect. After the following sequence of statements
    is executed the DATA list ''pointing'' at the value 7 and this will be input by
    the next READ statement executed:


    ```

    241 DATA 2,"ITEM", 2.14159, 16

    243 DATA "JAN", "FEB", 7

    245 READ A, IS, P, R

    247 READ JS, FS

    ```


    Note that a READ statement can contain a list of variables although the need to
    match variable type with DATA remains.'
