    (Some versions of BASIC allow the printing of quotation marks by differing methods
    but it is best to try and avoid this.)


    Numbers


    but such numbers cannot be used for arithmetic.

    The data examples shown above come into the general category of constants. A constant
    is something that does not change its value during execution of the program. As
    we have seen, constants can be numbers or texts. Although constants are required
    for initial values and factors print layouts, it would be almost impossible to
    write useful programs without something that can have a variable value.


    # Variables


    A variable is an area of memory within a program that can be referred to by a
    name. Any reference to that name is taken by the program as a reference to the
    current value of that area. Just as with constants, BASIC has numeric variables
    and string or text variables.


    # Numeric Variables


    The most important point to note about numeric variables is that they can hold
    a number in integer, real or exponent form. The particular form depends on context.


    Some versions of BASIC provide only 286 simple numeric variables as a standard
    feature. These are in 26 groups represented by the letter of the alphabet and
