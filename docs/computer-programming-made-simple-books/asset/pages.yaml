  md: '# The Assignment Statement


    parentheses are contained within other parentheses the innermost level is evaluated,
    followed by the next level, and so on. The use of parentheses allows us to amend
    the order in which the arithmetic operators are evaluated. For example, suppose
    we wish to multiply together the variables D, E and the difference between G and
    H. If we wrote the expression:


    ```

    D*G-H*E

    ```


    the result would not be as intended but would consist of the result of H multiplied
    by E subtracted from the result of D multiplied by G. The required evaluation
    can be obtained by using parentheses as:


    ```

    D*(G-H)*E

    ```


    In this instance H is first subtracted from G the result being multiplied by D
    and this result being multiplied by E.

    More than one set of parentheses can be used to further modify the sequence of
    evaluation as:


    ```

    ((D-G)*(F-H)-R)*S

    ```


    The innermost parentheses will be evaluated first—giving D—G and F—H, the two
    results obtained being within the outer set of parentheses will be multiplied
    in the third step. From the result of this multiplication will be subtracted R
    and this result will be multiplied by S. (Note—within the outer parentheses can
    be used when not absolutely required in order to clarify the meaning of a complicated
    expression. For example, the expression:


    ```

    D*(G-3)+(E*(2**R))-(18*F***)

    ```


    will be evaluated in exactly the same manner as:

    although the former would be easier to follow.

    When in doubt about the order in which operators will be evaluated use parentheses.
    Remember that it is very easy to misinterpret the way in which a complicated statement
    will be evaluated and such an error can be very difficult to detect when testing
    your program.


    ```

    D*G-3+E*2**R-18*F***

    ```


