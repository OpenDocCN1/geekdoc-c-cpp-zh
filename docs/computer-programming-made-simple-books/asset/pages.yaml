  md: '# 78 Computer Programming


    General Format Notation

    As each element of the COBOL language is introduced it is preceded by the General
    Format showing the basic method of use of the element together with any available
    options. For example the format of the MOVE statement is shown as:


    | Format |

    | MOVE { identifier-1 } TO identifier-2 [identifier-3] ... |

    | literal } | | |


    This format does not itself form part of the COBOL language specification or it
    is used extensively to describe the language. Each format therefore follows the
    same rules which will aid the programmer when writing his own statements. The
    following rules apply only to the general formats in Part 2 of this book.


    +   1. All words printed in upper case are reserved words and have specific meanings
    to the COBOL compiler. In all general formats in upper case represent an actual
    occurrence of those words.

    2. All underlined words are required when coding a statement unless the portion
    containing it is optional (see 6 below). Words underlined are keywords and must
    be spelt exactly as shown in the format. Words not underlined are optional words
    and may be omitted or included at the programmer''s option.

    3. The characters +, -, <, >= = will not be underlined but, when appearing in
    formats, are required when such formats are used.

    4. All punctuation shown in general formats represents an actual occurrence and
    must be used where. Note—additional punctuation can be inserted according to the
    rules already given.

    5. Words printed in lower case represent information to be supplied by the programmer
    as explained in the accompanying text.

    6. Square brackets ([]) indicate that the enclosed item is optional as required
    by the program. When square brackets contain more than one item or may be used
    as required.

    7. Braces ({ }) enclosing a number of items indicate that one of the items must
    be used.

    8. Ellipsis (...) indicates that the preceding unit may be repeated as many times
    as required. Note that if the unit is enclosed in brackets or braces the entire
    unit must be repeated (when repetition is required)

    9. Any comments and full explanations about each format are in the accompanying
    text.


    # Exercises


    +   1. Under what circumstances may the programmer use a reserved word as a name?

    2. Which of the following are valid numeric literals?'
