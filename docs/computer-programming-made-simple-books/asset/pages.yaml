    Data Sets and Numbers


    When designing files and subsequently handling them in a program, it is common
    to organise the data into sets to identify the relationship(s) which exist between
    the different items of data within the set. These organisational methods are of
    two types—arrays and structures although they can be

    combined when necessary.


    Structures


    A structure is merely a hierarchical description of data items, showing individual
    items, individual items arranged in groups, and groups themselves arranged in
    larger groups.


    Every set of data will contain individual items (fields) which will hold particular
    pieces of information and will have unique names to identify them (described in
    detail later). For example, a set of data relating to the name and address of
    an individual may have the following fields:


    +   Given Name

    Surname

    Address Line 1

    Address Line 2

    Address Line 3


    When referring to this data it may be convenient to refer, for example, to the
    Given Name and Surname fields with one collective name as ''Identity''. The word
    ''Identity'' is a group name referring to the two subordinate fields Given Name
    and Surname. Similarly we could allocate the term ''Location'' to be the group
    name for the three address lines. The two groups so far (Identity and Location)
    could themselves be combined into a group (with the name ''Customer'' for example).
    Since now the Customer refers to the group items Identity and Location also refers
    to the five data fields (called elementary items) making up the data set. The
    complete data structure can be represented as a hierarchical tree structure as
    shown in Fig. 24.


    It is more common to represent these structures as a block diagram as shown in
    Fig. 25.'
