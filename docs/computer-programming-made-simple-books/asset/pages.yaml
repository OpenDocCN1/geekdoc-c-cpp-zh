  md: '# 63

    The Print Statement


    The PRINT statement is used, as its name implies, to print information on the
    user''s terminal. It can be used in a variety of ways to print string or numeric
    information and, with, formatting control, can produce tabulations.

    The simplest form of the PRINT statement uses the word PRINT and a single constant
    or variable:


    ```

    142 PRINT "TEST PRINTING"

    144 PRINT NUMB

    146 PRINT COMMENTS

    148 PRINT R*3

    ```


    Execution of line 142 will cause the words PRINTING to appear on the user''s terminal;
    line 144 will print the current value of the numeric variable NUMB; line 146 prints
    the current value of the string variable COMMENTS and line 148 computes the three
    times the current value of the numeric variable R and prints the answer. In each
    of these cases the PRINT statement is terminated either with a carriage return
    and feed so that only a single value is printed per line.

    If you wish to print more than one value on a line then you should separate the
    items with semi-colons or commas. When separated with semicolons the items in
    a PRINT statement will appear without intervening spaces:


    ```

    412 LET LS = "LEFT"

    414 LET RS = "RIGHT"

    416 PRINT "MOVE"; LS, "OR"; RS

    ```


    These statements will cause the following to be displayed:


    # MOVE LEFT OR RIGHT


    (Note the spaces within the string constants.)

    When the last item in the list is followed by a space—as in line 416 above—the
    PRINT statement will terminate with a carriage return and line feed. If, however,
    a semi-colon follows the last item then the terminal print head remains in the
    current print position until the next PRINT statement. Thus the following statements
    will achieve the same result as line 416 above:


    ```

    512 PRINT "MOVE"

    514 PRINT "LEFT", "OR";n516 PRINT "RIGHT"

    ```'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# The PRINT Statement


    Separating the PRINT statement with commas divides BASIC to print in zones. For
    this page width is divided by BASIC into 5 zones of each 14 characters. Thus zone
    1 begins in print position 1, zone 2 in print position 15, zone 3 in print position
    29, zone 4 in print position 43 and zone 5 in print position 57.


    Each comma in a PRINT statement is regarded as an instruction to move to the first
    print position of the next available zone before commencing printing. If the print
    head is centered somewhere in zone 5 then the next comma will move it to 1 of
    the next line. The use of zones for tabulation is illustrated in the following
    coding showing part of a print-out of salesman''s expenses:


    ```

    241 PRINT "MONTH", " JONES", "SMITH", "WOOLLEY"

    243 PRINT, "MANAGER"

    244 PRINT "JAN", J(1), J(2), J(3)

    246 PRINT "FEB", F(1), F(2), F(3)

    ```


    The resultant print-out is shown:


    | MONTH | JONES | SMITH | WOOLLEY |

    | --- | --- | --- | --- |

    | JAN (MANAGER) | 16 | 18 | 14 |

    | FEB | 20 | 24 | 13 |


    Note the use in line 243 of comma as the first item to step the PRINT statement
    on zone 2. PRINT statements can contain both semi-colons and commas. When a semi-colon
    is encountered the next constant or variable is printed immediately; when a comma
    is encountered the print position moves to the beginning of the next zone. As
    an example, suppose pound signs are be added to the expenses program above; lines
    244 and 246 can be amended as follows:


    ```

    244 PRINT "JAN", "£"; J(1), "£"; J(2), "£"; J(3)

    246 PRINT "FEB", "£"; F(1), "£"; F(2), "£"; F(3)

    ```


    The resultant print-out is now as follows:


    | MONTH | JONES | SMITH | WOOLLEY |

    | --- | --- | --- | --- |

    | JAN (MANAGER) | £16 | £18 | £14 |

    | FEB | £20 | £24 | £13 |


    # The TAB Feature


    This enables the next print position to be selected under program control:


    ```

    281 PRINT TAB(10); "TEN"

    ```


    In this statement the expression TAB(10) causes the display position to be set
    at 10 before the constant "TEN" is displayed. (Note the first—left—display position
    is 0, zero).


    The TAB expression may be calculated from a variable:


    ```

    412 PRINT TAB (A); B$

    414 PRINT TAB (C*2 + 1); B$

    ```'
