  md: '# 30

    Data Manipulation—2


    The examination, by program, of individual characters within a data field is possible
    with the knowledge so far acquired of COBOL (for example the field could be redefined
    as several single-character fields and each could then be manipulated on its own).
    However to do so would be cumbersome and possibly difficult for the newcomer.
    Since it is not an uncommon requirement that individual characters be examined
    within a data field the COBOL language provides two powerful statements—EXAMINE
    and TRANSFORM—to make this type of task very simple indeed.


    # The EXAMINE Statement


    The EXAMINE statement is used to count the number of times a particular character
    occurs within a data field and may optionally be used to replace that character
    with another, selected, character.


    | Format |

    | EXAMINE identifier TALLYING UNTIL FIRST ALL LEADING literal-1 |

    | [REPLACING literal-2] |


    Let us first of all consider the use of this statement without the REPLACING option.
    The field called identifier is examined, from left to right, character by character
    and a count is made according to the option specified. In all cases literal-1
    must be a single-character literal with the same data class identifier (i.e. if
    the field name PIC 999 is being examined then literal will be a numeric literal,
    additionally a figurative constant (e.g. ZERO, SPACE) may be used but again the
    data class must correspond with that of identifier.


    # Until First Option


    The data field is examined and a count is made of the number of characters preceding
    the first (from left to right) occurrence of literal. For example suppose we wish
    to know how many characters preceded the character ''S'' in the field defined:'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# 77 ALPHA-LIST PICTURE X(10).


    Then we could use the following statement:


    # EXAMINE ALPHA-LIST TALLYING UNTIL FIRST "S".


    If the content of ALPHA-LIST at the time this statement was executed as "ABEGJSMN7"
    then the result of the EXAMINE statement would be 5 (i.e. 5 characters precede
    the "S" in this field). If the character "S" did not occur at all in the field
    then the result would be 10 (i.e. the total length of the field). Similarly, we
    can examine numeric fields:


    # EXAMINE NUMBER TALLYING UNTIL FIRST ZERO.


    # ALL Option


    In this case the result of the EXAMINE statement is a count of all the specified
    characters occurring in the data field. For example, suppose we wish to discover
    how many times the character ‘.’ (period) occurs in the field:


    # 77 NAME PICTURE X(209).


    then we would write:


    # EXAMINE NAME TALLYING ALL “.”.


    If name contained, at the time this statement was executed, the value ‘A. B. JOHNSON
    AND CO.’ then the result of the EXAMINE statement would be 3. Again we can use
    figurative constants:


    # EXAMINE NAME TALLYING ALL SPACE.


    # EXAMINE NUMBER TALLYING ALL ZERO.


    Or we can count the number of times a particular digit occurs in a numeric item:


    # EXAMINE NUMBER TALLYING ALL 7.


    If NUMBER had value 2467917 then the result of the EXAMINE would be 2. If NUMBER
    contained, say, 1234123 then the result would be zero (i.e. no 7’s are present
    in the number).


    # LEADING Option


    This will count the number of occurrences of a ‘literal’ prior to the occurrence
    of another character, i.e. the number of leading ‘literals’ to discover the number
    of leading zeros in the field PRINT-NO:


    # EXAMINE PRINT-NO TALLYING LEADING ZEROES.


    If the value of PRINT-NO was 000421 at the time this statement was executed then
    the result of the EXAMINE would be 3. Similarly, we might wish to discover how
    many cheque-protect symbols have been edited into a field:


    # EXAMINE AMOUNT TALLYING LEADING “*”.


    # TALLY


    The result (i.e. the count) of an EXAMINE statement is made available to the programmer
    in a special field called TALLY. This field is automatically'
