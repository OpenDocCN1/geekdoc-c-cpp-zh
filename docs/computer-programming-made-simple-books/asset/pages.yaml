- img_proc: true
  md: 'Processing Print Files 195


    Having produced the necessary detail line record descriptions the use of pre-printed
    stationery requires no other special coding except that the line spacing is specific
    for each line (i.e. no heading routine checking is done) and that a line-up routine
    is included in the program.


    # Stationery Line-up


    Each printing output device has a number of adjustments that can be made to the
    positioning of the stationary relative to the print-line. For example, the position
    of the first line on a page (i.e. the position of channel 1) can be moved relative
    to the actual top of the page and the paper can be moved from left to right (thus
    altering the size of the margins). The positioning of text on standard stationery
    is not critical; however pre-printed stationery must be lined up accurately before
    the program commences its data output. Each program that uses preprinted stationery
    must therefore include a line-up routine before any data is printed. This line-up
    routine will print a dummy document (filled with, asterisks) and then ask the
    computer operator if the line-up is satisfactory. This procedure will be repeated
    until the operator responds that the stationery is ready; printing proper can
    then commence. A line-up routine for the stationery shown in Fig. 42 is given
    below:


    ```

    MOVE "1" TO SKIP.

    MOVE ALL "*" TO EMPLOYEE-NAME, TAX-CODE.

    MOVE 999.99 TO NET-PAY, TOTAL EXTRAS.

    LINE-UP. MOVE DETAIL-1 TO PRINT-LINE.

    WRITE PRINT-LINE-1 AFTER ADVANCING SKIP LINES.

    MOVE DETAIL-2 TO PRINT-LINE.

    WRITE PRINT-LINE AFTER ADVANCING 2 LINES.

    DISPLAY "LINE-UP OK?" UPON CONSOLE.

    ACCEPT ANSWER FROM CONSOLE.

    IF ANSWER NOT EQUAL "YES" GO TO LINE-UP.

    ```


    Once the computer operator is satisfied that he has adjusted the stationery to
    the correct positioning he will reply YES to the program’s question and printing
    of pay-slips will commence.


    # Exercises


    There are no exercises for this chapter. Instead, you should now attempt Revision
    Questions, Set 3, on page 236.'
