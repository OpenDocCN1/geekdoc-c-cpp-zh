  md: '# Computer Programming


    MOVE NUM-1 TO NUM-2.


    will replace the original contents of NUM-2 with an exact copy of the contents

    NUM-1.


    # 3 Numeric to Alphanumeric


    A numeric item may not be moved to an alphabetic elementary

    item but may be moved to an alphanumeric item, providing that the decimal

    point, in the numeric elementary item, is at the right-hand end. The absolute

    value of the numeric elementary item is transferred to the alphanumeric item,

    so therefore the result of this type of move is unsigned. For example, consider

    the following definitions:


    ```

    77 NUM PICTURE S999 VALUE -127.

    77 ALP PICTURE XXX.

    ```


    the statement


    MOVE NUM TO ALP.


    would result in ALP containing the characters ''127''—i.e. the numeric value is

    converted to an unsigned character string. Padding, if required, is with spaces

    as in (1) above.


    # 4 Alphanumeric to Numeric


    An alphabetic elementary item cannot be moved to a numeric elementary

    item. A numeric elementary item may receive data from only an alphanumeric

    elementary item providing the sending field contains only numeric digits. If an

    instruction attempts to move non-numeric data to a numeric elementary item

    the results will be unpredictable. This type of MOVE is not recommended.


    When a MOVE statement is encountered with one or more non-elementary

    (i.e. group) items it is treated as if each group item were an alphanumeric

    elementary item and the rules in either (1) or (3) above will apply.


    Examples: The rules specified above may seem daunting at first; however, they

    are quite simple and will soon be second-nature to you. In fact, the rules really

    specify those situations which one would probably have inferred


    +   1. If the sending and receiving fields are of unequal length padding or truncation
    will

    take place.

    2. Numeric fields are aligned on a decimal point.

    3. Moving alphanumeric values to numeric fields may produce odd results.


    In use the MOVE statement will be recognized as one of the simplest statements

    appearing in the COBOL language.

