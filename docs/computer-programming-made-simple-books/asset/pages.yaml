  md: '# Constants and Variables


    # Data


    Programs written in BASIC, like most other programs, handle data. Data can of
    course take many forms:


    +   - stock values

    - employee names

    - length of triangle sides

    - wages total

    - spacecraft velocity

    - your name and address


    and each program must be ready to manipulate the particular data it needs. Despite
    the infinite number of meanings attributable to an item of data there are a very
    few types of data. BASIC is a simple language and keeps its data types simple,
    recognising just numerical and textual items.


    # Numbers


    BASIC deals with three types of number only: integer form, real form and exponent
    form. An integer form number is simply a whole number—that is, a number without
    a decimal or fractional part. The following are examples of BASIC numbers in integer
    form:


    ```

    2846

    16

    999

    ```


    A real form number is one with a decimal part (i.e. the bit after the decimal
    point). The following are examples of BASIC numbers in real form:


    ```

    28.96

    3.141596

    Ø.2

    ```


    Numbers written in exponent form are slightly more complicated at first sight.
    Exponent form numbers are in two parts, the mantissa and the exponent. The mantissa
    gives the numeric part of the number and the exponent gives the order of magnitude.
    For example, the number 1.2E3 means ''1.2 times 10 to the power 3'' (equivalent
    to 1,200). Since exponent form'
