  md: 'The next step is to expand the box labelled ''process card'' to reflect the
    full specification as shown above. The first stage of this is to select paths
    depending on whether the card type is 148 or 150 although note particularly that
    we must specifically test for each type—if the card type is not 148 we cannot
    assume it is 150. Each of the valid card type paths will then contain coding to
    perform the required validation; as (if any) error is found a marker will be set
    to indicate this and it is this marker which is examined in the ''OK'' decision
    box. Note that the marker must be reset to the OK state before each card is examined
    (otherwise all cards after the first rejected will also be rejected). The complete
    flowchart will now be as Fig. 2.


    There, briefly, is a demonstration of the way in which a flowchart can be produced
    from a specification. When actually doing this yourself remember the most important
    points made above:


    +   check the logic of the specification

    query any points not understood before flowcharting

    cater for all possibilities positively

    build up the flowchart gradually

    check the flowchart before commencing to code the program.


    Any errors or omissions in your flowchart will become apparent during the testing
    of the program. It is very rare to write a computer program that works first time.
    Remember however that only by having a correct flowchart can you hope to have
    a correct program. Flowcharting is often derided by some experts—but it is a valuable
    tool the perfection of which (from experience) will be the sign of a truly competent
    programmer.


