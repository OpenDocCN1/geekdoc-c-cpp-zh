    in use, although ½" wide tape is becoming increasingly popular. The actual tape
    is not unlike that used on domestic tape-recorders except that it is of a much
    higher quality. A reel of tape may consist of 1200, 2400, or 3600 feet held on
    a plastic spool.


    The reel of tape on which data are to be recorded is placed on the tape-deck and
    the tape threaded through the read/ write head assembly as to a take-up spool.
    The general layout of a tape-deck, complete with reel of tape, is shown in Fig.
    12—the purpose of the tape reservoirs is explained later in the text. Note that
    separate heads are provided for writing and reading data. Allowing for a length
    of spare tape to be fed through the right-hand reservoir and on to the take-up
    spool special marker is placed on the tape to identify the starting-point of data
    on the tape. This marker usually consists of a piece of self-adhesive metallic
    strip which is detected by a photo-electric cell following the read/ write head
    assembly. This metallic strip acts as a reference point for the start of data
    on the tape. A second metallic strip, which can be detected by a photo-electric
    cell before the read/ write head assembly, will be attached to the tape a few
    feet from the end of the tape. This second strip will inform the computer when
    the reel of tape is almost full. The action taken at that point is described later.


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_45_0.png)


    Fig. 12. Schematic of magnetic tape unit.


    Once a reel of tape has been positioned at its load point (i.e. the point identified
    by the first metallic strip) it can have data recorded on it by the sequence of
    events described below. The computer will first interrogate the tapedeck to verify
    that the tape is at load point and that the deck is ready to commence writing.
    Once this has been done, data can be recorded on (or written to) the tape.


    The data to be written to the tape are in an area of the computer''s core storage
    and will be transferred to the tape-deck when the computer issues the write instruction
    (Chapters 32 and 54). When the write instruction is issued the erase head is switched
    on (to ensure that any previously recorded data are removed from the tape) and
    the tape is set in motion. The speed of the tape at which data are recorded varies
    from deck to deck but can be in the range 30–200 inches per second. During the
    time taken for the tape to accelerate from rest to the recording speed no data
    are being recorded (although the erase head is switched on).


    When the correct tape speed has been reached the data to be written transferred
    character by character from core storage to the tape-write head. Each character
    is recorded as a magnetic pattern across the tape as the'
