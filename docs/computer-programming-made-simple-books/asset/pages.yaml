    # Sign Condition


    This condition is used to determine whether the value of a numeric item is less
    than, equal to, or greater than zero.


    ```

    { identifier arithmetic-expression } IS [NOT] { POSITIVE NEGATIVE ZERO }

    ```


    Note—a value is POSITIVE if it is greater than zero, and NEGATIVE if it is less
    than zero. However, an item with a value of zero is neither positive nor negative.
    The following table will illustrate the result of this conditional test for a
    number of values of the data item defined as PICTURE S999.


    | Value | Condition | Result of Condition |

    |---|---|---||

    | 123 | POSITIVE | true |

    | 123 | NEGATIVE | false |

    | 123 | NOT NUMERIC | true |

    | 123 | ZERO | false |

    | 000 | ZERO | true |

    | 000 | POSITIVE | false |


    Note, in particular, the last example above which demonstrates the aforementioned
    rule.


    # Relation Condition


    A relation condition involves the comparison of two identifiers according to the
    relational-value used. The relational-operator shows the type of comparison made
    between'
