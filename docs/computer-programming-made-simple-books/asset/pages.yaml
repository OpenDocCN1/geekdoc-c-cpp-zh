  md: '# 254 Computer Programming


    A variable can be made equal to the value of another variable in a similar manner:


    # NUMBER = MAJOR


    In this example of NUMBER is replaced by the current value of MAJOR. Note, however,
    the value of MAJOR is unchanged following the execution of this statement. The
    most important use of the assignment statement is the solving of calculations
    (which is basically the purpose of a FORTRAN program). For example, consider part
    of a program used to calculate the properties of pipes. One section of the program
    may be required to calculate the cross-sectional area and then the volume of metal
    in a hollow pipe. The parameters relating to the type of pipe whose data is have
