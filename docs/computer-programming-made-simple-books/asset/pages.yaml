  md: '# 39

    Subroutines


    A routine which is to be used a number of times within one program need only be
    coded once. Each part of the program requiring that coding can then use a PERFORM
    statement (see Chapter 16) to cause one or more named paragraphs to be executed.
    A particular piece of coding may be required in a number of different programs
    within an installation. For example, each program within a sales accounting suite
    of programs may need to verify the check digit on inputted numbers; rather than
    code this routine into each program (thereby introducing additional work) it be
    written once (as a separate routine) and then called up by each program requiring
    it. This system can also be used to access routines written in other programming
    languages (i.e. a mathematical process coded in FORTRAN) and special routines
    supplied by the computer manufacturers (it is normal, for instance, for computer
    manufacturers to supply a routine for calculating PAYE tax.


    # Parameters


    When a routine is written to be used by a number of programs, in the manner described
    above, is obviously not possible for the programmer who is writing this routine
    to know the data names that will be used in the calling program (i.e. the program
    that will use the specially written routine). Additionally, the special routine
    (usually called a sub-program) will be compiled on its and cannot therefore refer
    directly to names in the calling program. It is quite clear, that the sub-program
    must be given access to the data values in the calling program.


    When a sub-program is initiated (the CALL statement below) the data areas, required
    by the sub-program (called parameters), are passed to the sub-program; usually
    group area names (i.e. 01 level entries) are given—in this way every record can
    be passed rather than having to list every field within the routine. Within the
    sub-program(s) are defined the data areas to be received from the calling program(s)
    in the Linkage Section. Such entries are defined in exactly the same manner as
    those in a Working-Storage Section except that the VALUE clause and the area can
    only be referenced if the sub-program has been called (i.e. a sub-program cannot
    run by itself). An area in the Linkage Section must have the same layout as the
    area to which it corresponds in the calling program although it does not necessarily
    have to have the same elementary item names.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# 210 Computer Programming


    The ENTRY Statement

    A sub-program is identified by an ENTRY statement in the procedure division:


    | Format |

    | ENTRY literal [USING] identifier-1 [identifier-2] ... |


    The literal (which must begin with an alphabetic character) identifies the name
    by which the sub-program is to be called. The identifiers following the USING
    option refer to the data areas that are to be passed to the sub-program and each
    entry must correspond to a level 01 or level 77 entry in the Linkage Section of
    the sub-program.


    For example, suppose we wish to code a sub-program to validate an account number.
    The validation checks to be made are (a) number is numeric; (b) if first digit
    of number is 1 remaining 5 digits must be less than 60000; (c) if first digit
    is 2 remaining 5 digits must be greater than 60000—any other range of numbers
    is invalid; if the number is not valid a status flag will be set equal to 1, otherwise
    it will be set equal to zero. The following coding could be used:


    DATA DIVISION.

    LINKAGE SECTION.


    ```

    77 FLAG PICTURE 9.

    01 ACCOUNT-NO.

    02 FIRST PICTURE 9.

    02 REST PICTURE 9(5).

    PROCEDURE DIVISION.

    ENTRY "SUBPROG" USING FLAG, ACCOUNT-NO.

    MOVE 0 TO FLAG.

    IF ACCOUNT-NO NOT NUMERIC THEN GO TO ERROR.

    IF FIRST EQUALS 1 THEN GO TO PARA-A.

    IF FIRST EQUALS 2 THEN GO TO PARA-B.

    GO TO ERROR.

    ```


    ```

    PARA-A. IF REST LESS THAN 60000 GO TO LEAVE.

    GO TO ERROR.

    PARA-B. IF REST GREATER THAN 60000 GO TO LEAVE.

    ERROR. MOVE 1 TO FLAG.

    LEAVE. GOBACK.

    ```


    The statement GOBACK causes control to be returned to the calling program at the
    statement immediately following the calling statement. On some computer systems
    this system is replaced by

    EXIT PROGRAM.


    The effect of these two statements is identical as described above.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Subroutines 211


    # The CALL Statement


    To invoke a sub-program the CALL statement is specified.


    ```

    Format

    CALL literal [USING identifier-1] [identifier-2] ...

    ```


    The sub-program to be called is specified by literal—this name will correspond
    with the name given in the sub-program''s ENTRY statement. The data areas which
    are to be passed to the sub-program are specified following the USING option.
    (Note that in the rare case of a sub-program requiring no parameters the USING
    option is omitted.)nFor example if a programmer wished to use the sub-program
    coded in the example above could write:


    CALL "SUBPROG" USING CUSTOMER-NO, STATUS-FLAG.


    Notice that the names of the parameters do not correspond with the names used
    in the sub-program; however, the definitions of corresponding areas must be identical
    (i.e. CUSTOMER-NO must have the same definition as ACCOUNT-NO above and STATUS-FLAG
    the same as FLAG above) and the list of parameters must be in the same order as
    the CALL statement and the ENTRY statement (i.e. in the example above CUSTOMER-NO
    will always represent the area whose data is passed to ACCOUNT-NO and STATUS-FLAG
    the area data is passed to FLAG).

    The most common use of sub-programs is to gain access to facilities not available
    in COBOL. In these cases the programmer will not necessarily understand the working
    of the sub-program but will have a user description which will describe the function
    of the sub-program and the format of the parameters which must be passed. Knowing
    this the programmer can issue the appropriate CALL statement for ensuring that
    the called sub-programs are made available for execution as they are required.


    The actual workings of CALL statements, etc., is beyond the scope of this book;
    however, the interested reader is referred to Modular Programming (London: Butterworth,
    1971) by the same author.


