  md: '# 11

    Word Types and Constants


    The basic unit of a COBOL program is the **word**. A word is a combination of
    up to 30 characters chosen from the **word set**:


    +   - A to Z

    - Ø to 9

    - (hyphen)


    A word cannot contain a space and it cannot start or terminate with a hyphen.
    A word is terminated with a space, period, right parenthesis, comma, or semicolon
    depending upon it how it is used. Examples of COBOL words are:


    ```

    READ

    MASTER-FILE

    READ-IN-ITEM-TYPE-10

    (SUBSCRIPT)

    ```


    Note that in the last example the left and right parentheses do not form part
    of the word but are shown to illustrate a word terminated by a right parenthesis.


    # Reserved Words


    A number of words are known as **reserved words** and cannot be used as names
    by the programmer. Reserved words identify certain functions to the compiler and
    can be split into three types:


    # Keywords


    A **keyword** is one which must appear in the relevant COBOL statement when used
    in a program. Keywords are identified in the general format entries them in this
    book by appearing underlined and in upper case. Keywords themselves fall into
    three broad categories; these are **verbs** (such as ADD, MOVE, WRITE), **required
    words** which appear in various statements (such as TO in a MOVE statement), and
    words with a **special functional meaning** such as ZERO, DIVISION, and so on.


    # Optional Words


    These are words available in certain statement formats to improve the legibility
    of a statement. For example in the statement


    ```

    READ MASTER-FILE RECORD INTO WORK-AREA

    ```'
