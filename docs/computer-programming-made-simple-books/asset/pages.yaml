    a row of sprocket holes (see Fig. 7) which are offset from the centre to ensure
    that the tape is always the correct way in the paper reader. Data are punched
    into paper tape as a series of holes across the tape, each character having a
    unique set of holes (see Fig. 8). A paper tape reader is illustrated schematically
    in Fig. 4.


    The roll of punched tape is dropped into the input hopper and fed between a single
    pair of rollers through the read-station. A paper tape read-station is'
