    powers of 10 the positional weights for the binary system are expressed as powers
    of 2. To visualise the values of the binary system we will write down the weights
    for the first six positions (to the left of the decimal point). Below each binary
    weight will be shown the equivalent value of that binary position. These values
    are shown in Fig. 28.


