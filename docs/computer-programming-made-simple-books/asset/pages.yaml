    Notice how in this example we have introduced two new statements—STOP and END.
    STOP is used to signify the logical end of our program to the compiler which will
    generate coding to automatically return to the operating system when the statement
    is encountered. END is used to signify the physical end of the program and causes
    compilation to terminate.


    The following program will read in twelve values, representing the monthly stock
