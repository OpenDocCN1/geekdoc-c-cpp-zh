    # Special Level Numbers


    In addition to the level numbers in the range 01–49 discussed above for record
    structure definition two non-contiguous items of data, that are elementary items
    which are not part of a group, are defined with level number 77.


    Level 77. Non-contiguous items of data are provided.


    > 77 NON-CONTIG-AREA ...


    A fuller description of level 77 items will be found in Chapter 21.


    Level 88. It is permissible to associate a particular condition with a data item
    by defining that data item under level 88:


    > 88 CONDITION condition-definition


    Conditions are discussed fully in Chapter 27.

    Level numbers 01 and 77 will appear in Area A, followed by Area B by their associated
    data names and descriptive information. All other level numbers may appear in
    either Area A or Area B followed, in Area B, by their data name and descriptive
    information. All level numbers will be written with two digits (i.e. 01, 07, 09,
    etc.).


