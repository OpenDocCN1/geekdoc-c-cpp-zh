    Backing Store Devices


    **Backing Store Devices**


    During the processing of any application data will have to be input to the computer
    and following the calculations done by the program, data will be output. In addition
    to this input and output data the computer will require, in a number of cases,
    to refer to historical data of some kind. For example in a works payroll application
    the computer would require access to each employee''s year-to-date data to produce
    cumulative totals on pay-slips and so on. Clearly, while it would be impractical
    but extremely slow in relation to the speed of the computer. These historical
    data are stored on a backing store device in the form of a file, in this context
    a file being a collection of related data records. Information can only be written
    to or read from a backing store device by the computer, unless it is done under
    program control. The computer control of backing store devices enables their speed
    of operation to be improved (. Note that when we talk of the computer reading
    historical data from a backing store device we do not necessarily mean data was
    prepared a long time ago. However, it is important to remember that only a computer
    can put data on a backing store device and before data can be read from such a
    device a computer program must have put the data in place.


    A backing store device can hold data that were created some time ago, as in the
    case above where the details of an employee''s past wages are held. However, data
    which are newly created can also be providing the system is equipped with the
    means to transcribe the original data onto the desired medium.


    Two types of backing store devices are in common use—magnetic tapes and magnetic
    disks. Although based on the same basic principle the methods utilised to store
    the data differ between these two types of devices. However, the use of either
    type of device requires much the same type of programming to handle the data.
    Accordingly the physical operation of these devices is described separately followed
    by a discussion on the general programming requirements of backing store devices.


    # **Magnetic Tape Devices**


    Magnetic tape can vary in width according to the particular computer system'
