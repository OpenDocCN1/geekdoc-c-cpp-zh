  md: '# 202 Computer Programming


    Examples: The table coding shown above can be rewritten using this additional

    PERFORM feature:


    ```

    PERFORM LOOP VARYING SUBS FROM 1 BY 1

    UNTIL SUBS EQUALS 5.

    ```


    # LOOP. ADD TABLE (SUBS) TO TOTAL.


    The first thing to note in this example is that the single PERFORM statement includes

    all coding necessary to set up the loop and execute it required number of times.
    The

    sequence of operation for this coding is as follows:


    +   1. SUBS is set to an initial value of 1 (FROM 1).

    2. The condition (SUBS EQUALS 5) is evaluated.

    3. The condition is false so LOOP PERFORM.

    4. SUBS is incremented by 1 (BY 1).

    5. Step 2 is repeated.


    This sequence continues until SUBS is equal to 5 at which control will be passed
    to

    the statement following LOOP will have performed for SUBS

    having the values 1, 2, 3, 4. The reader may like to verify this sequence of operations
    by

    following the flowchart above with the values used in the PERFORM statement

    ample.


    This type of statement will be used more frequently on larger tables or groups
    of

    tables where it can save the programmer a considerable amount of work.

    Consider the following tables:


    ```

    02 TAB1 OCCURS 20.

    03 NAME1 PICTURE X(10).

    03 AMOUNT-1 PICTURE 999.

    02 TAB2 OCCURS 20.

    03 NAME2 PICTURE X(10).

    03 AMOUNT-2 PICTURE 999.

    ```


    To transfer the entire contents of TAB1 to TAB2 we could simply write:


    ```

    MOVE TAB1 TO TAB2

    ```


    However, suppose that we wished to transfer only, the odd-numbered elements of

    TAB1 to TAB2; the following could be used:


    ```

    PERFORM TABMOVE VARYING SUB FROM 1 BY 2

    UNTIL SUB EQUALS 21

    ```


    ```

    TABMOVE. MOVE NAME1 (SUB) TO NAME2 (SUB).

    MOVE AMOUNT-1 (SUB) TO AMOUNT-2 (SUB).

    ```


    Notice how we are now using SUB itself as a subscript for the table elements.
    The first

    time TABMOVE is executed SUB will have the value 1 and the effect will be to execute

    the following:


    ```

    MOVE NAME1 (1) TO NAME2 (1).

    MOVE AMOUNT-1 (1) TO AMOUNT-2 (1).

    ```'
