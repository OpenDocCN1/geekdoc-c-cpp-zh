  md: '# 27

    Conditions


    As already mentioned in Chapter 26 the conditional statements examine the state
    of a condition at the time the conditional statement is executed, and depending
    upon the state of the condition then, will alter the flow of the program. In fact
    the flow of the program will only be altered to proceed to one of two paths. The
    first path will be taken if the condition is true and the second path if the condition
    is false.


    When a conditional statement is encountered during execution the necessary steps
    are taken to determine if the condition is true. A condition is said to be true
    if that condition exists. For example the condition A=B would be true if the values,
    at execution time, of variables A and B were identical; if the values were not
    identical the condition would be false.


    Conditions are examined, and program flow therefore altered, by use of the IF
    statement. This statement is discussed in detail in the following chapter. However,
    in order to fully understand the IF statement it is necessary to be aware of the
    four types of conditions available within the COBOL program. Note that the state
    of a condition can be inverted (i.e. true false and versa) by use of the NOT prefix;
    i.e. if CONDITION is true then NOT CONDITION is false. In the above example (condition
    A=B) if we wished instead to determine if A was not equal to B we could have used
    the condition NOT (A=B).


    # Class Condition


    This condition is used to determine whether an elementary item is numeric or alphabetical.


    | Format |

    |---||

    | Identifier IS [NOT] NUMERIC ALPHABETIC |


    The identifier NUMERIC condition is satisfied if the content of the field identifier
    is made up only of the digits 0 to 9 (plus optionally a sign). The condition identifier
    IS ALPHABETIC is satisfied if it is made up only of the characters A through Z
    and the space character.


    The NUMERIC test cannot be made on an identifier defined with the'
