  md: '# 38

    Table Searching


    Frequently it will be necessary to search a table for a particular entry rather
    than manipulate every entry in the table as in the previous chapter. For example,
    in a payroll program, we might have a table showing, for each department, the
    applicable bonus rate. As each employee''s net pay is calculated the program must
    search the table until the department number corresponding to the employee is
    found and so extract the relevant bonus rate.


    In other words, each department number in the table will be compared with the
    employee''s department number and when a match is achieved the bonus rate will
    be extracted for calculation.


    The table of bonus rates could have been defined like this in the Working-Storage
    Section:


    +   01 DEPARTMENTAL-BONUS.

    02 DEPT1.

    03 DEPTNO-1 PICTURE 9(5) VALUE 12345.

    03 RATE-1 PICTURE V99 VALUE .10.

    02 DEPT2.

    03 DEPTNO-2 PICTURE 9(5) VALUE 24567.

    03 RATE-2 PICTURE V99 VALUE .05.

    02 DEPT3.


    +   02 DEPT20.

    03 DEPTNO-20 PICTURE 9(5) VALUE 72341.

    03 RATE-20 PICTURE V99 VALUE .10.

    01 FILLER REDFINES DEPARTMENTAL-BONUS.

    02 RATES OCCURS 20.

    03 DEPT PICTURE 9(5).

    03 RATE PICTURE V99.


    In order to find the rate required for each employee the following coding could
    be used in the Procedure Division. (Note—the employee''s department number is
    in the field EMP-DEPT).'
