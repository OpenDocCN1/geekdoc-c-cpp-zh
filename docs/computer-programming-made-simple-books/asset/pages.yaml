  md: '# Computer Structure


    3. Memory. As each new pay-slip is to be produced, the clerk will read the various
    items of information about the employee and his wages. The information is then
    held in the man''s memory where it can be referred to instantly or worked on.
    If any employee has very large record in a file which cannot be remembered all
    at once, the clerk will probably deal with each section of the file in turn.


    4. Calculator. The clerk will use some form of de-calculator (machine) as well
    as, perhaps, a scrap pad and a ready-reckoner to perform the various calculations
    involved in producing a pay-slip. This will normally involve calculations using
    information both from the in-tray and from the employee''s file (e.g. overtime
    hours multiplied by rate to give overtime pay).


    5. Out-tray. Once the clerk has calculated the net pay, entering the various details
    on the pay-slip and pay-sheet and updated the file he wish to pass the information
    on either the employee or another department. To do this he will put the various
    items into his out-tray from where it will be distributed as required.


    6. Procedure Manual. Each step to be taken by the clerk in producing a pay-slip
    will be laid down in a procedure manual to which he can refer. This manual must
    also provide information about the procedure in unusual cases—for example the
    clerk must be able to read what to do if a man''s tax code is missing or, due
    to a clerical error, he is shown as having worked overtime while he is away on
    holiday.


    It is easy to visualize the wages clerk sitting at his desk receiving, clock-cards,
    referring to the employee''s file and, after some calculations, producing a pay-slip.
    But is it as easy to visualize a DP system performing similar functions? Surprisingly,
    the answer to this question is yes, as can be seen from the following:


    The computer system performing an identical payroll job would require basically,
    the same six functional units as the wages clerk and would operate in the same
    manner. Figure 1 shows the corresponding units of the computer system:


    # Input Unit


    In order for the computer system to process details of each employee''s weekly
    pay variations these will be converted into a machine-readable format and passed
    through an input device or unit. This unit will transmit the data as a series
    of electrical pulses into the computer''s memory unit where it is available for
    processing. A full description of input devices will be found in Chapter 3.


    # Backing Store


    The file for each employee containing his standing and accumulated information
    will be held on some form of backing store (the various types of which are described
    in detail in Chapter 5). When the computer reads in each employee''s details from
    the input device it will request the backing store to provide the file record
    (sometimes called a history record). After the calculations have been performed
    (see below) the file will be updated by returning the record to its place on the
    backing store.'
