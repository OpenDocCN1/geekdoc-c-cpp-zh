  md: '# 29

    Data Manipulation—1


    The MOVE Statement is used to transfer data from one field in the program to one
    or more other fields.


    ```

    Format

    MOVE {identifier-1} literal TO identifier-2 [identifier-3] ...

    ```


    The data value of identifier-1, or the value of literal, is transferred to the
    items specified by identifier-2 (and then to the item specified by identifier-3
    and so on if this option is used). Note that the contents of identifier-1 remain
    completely unchanged by the execution of this statement. Certain rules govern
    the permitted use of the MOVE verb and these be borne in mind when coding a program—an
    attempt to execute an unpermitted MOVE may, even with any illegal instruction,
    cause the program to terminate abnormally. Even if this does not have the contents
    of the receiving field(s) following an unpermitted MOVE statement are unpredictable.

    An elementary MOVE is one that involves the transfer of data from one elementary
    item to one or more elementary items and is governed by one of the following sets
    of rules depending on the nature of the elementary items involved.


    +   1 Alphanumeric to Alphanumeric

    Any alphanumeric elementary item may be MOved to any other alphanumeric elementary
    item. (Note in this context alphanumeric can be considered to include alphabetic
    class.)


    If the receiving field is larger than the sending field then padding with spaces
    will occur on the right of the receiving field. If the receiving field is smaller
    than the sending field then data are truncated at the right-hand end (after the
    receiving field has been filled). For example, suppose two fields have been defined
    as:


    ```

    77 AREA-1 PICTURE X(6) VALUE "ABCDEF"

    77 AREA-2 PICTURE X(5) VALUE "VWXYZ"

    ```'
