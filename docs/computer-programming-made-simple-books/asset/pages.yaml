    BRANCH-NAME) numbered from 21 to 40, the following coding could

    access the correct name (the number of the branch is held in BRANCH-NO):


    ```

    SUBTRACT 20 FROM BRANCH-NO GIVING SUB.

    MOVE BRANCH-NAME (SUB) TO PRINT-NAME.

