  md: '# Input and Output Statements


    Before a FORTRAN program can process any data and produce the required computations
    it is necessary for data to be input to the program. Similarly the results of
    calculations must be communicated to the programmer by the program itself. When
    a FORTRAN program is run from a time-sharing terminal the data will normally be
    inputted from the typewriter device in use and the results printed (Note that
    a FORTRAN program is run in an environment other than time-sharing the peripheral
    input/output commands discussed in Chapter 55 will be used for the reading and
    printing of data.) The commands described in this chapter apply only to FORTRAN
    programs operated via a time-sharing system. Since these commands do not appear
    in standard FORTRAN the keywords used differ in different systems. Those used
    here (INPUT and PRINT) are the more common ones in the author''s experience; they
    do indicate, however the general format to be used.


    # The Input Statement


    To enable data to be read into your program when it is executed you should use
    the INPUT command. This consists of the word INPUT followed by a comma, followed
    by one or more variable names. When the statement is executed, during program
    running, a question mark will be printed on the user''s terminal and the keyboard
    will be unlocked. The user can then type in a list of values (separated by commas)
    he wishes assigned to the variables in the INPUT statements. If the user does
    not specify enough values a further question mark will be printed; if he specifies
    too many excess values will be ignored.


    The simplest form of the INPUT command is with a single variable:


    # INPUT, A


    When this statement is encountered during program execution the computer will
    print ? on the terminal and will unlock the keyboard; the user may type in his
    value for the variable A followed by a carriage return:


    ```

    ? 27.39 CR

    ```


    The value 27.39 will be assigned to the real variable A. On subsequent executions
    of the above statement different values may be given to the variable A by the
    user. Once the variable has been given a value by the'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# 274 Computer Programming


    operator it may be used for computation:


    ```

    INTEGER X

    INPUT, X

    DO 10 K = 1, X

    A = A + K**2

    10 A = A + K**3

    246

    ```


    The INPUT statement may contain more than one variable name:


    INPUT, R, S, T


    The computer will expect the user to respond to the ? with three values:


    ? 2.09, 4.0, 18.1 CR


    The value 2.09 will be assigned to R, the value 4.0 to S, and the value 18.1 to
    T. If the user gives only two values the computer would respond with a further
    ? which the user would follow with the third value:


    ? 2.09, 4.0 CR


    ? 18.1 CR


    A null value (i.e. zero) may be indicated by the appearance just of a comma:


    ? 3, 4, CR


    would indicate the values 3, 4, and zero.


    ? 3, ,4 CR


    would indicate the values 3, zero and 4.


    An array may be filled by an INPUT statement within a DO loop:


    ```

    DO 10 K = 1, 10

    10 INPUT, A(K)

    ```


    Each time the loop is passed the INPUT statement will request a value for A(K),
    thereby filling the elements 1 to 10 of the array (since the DO statement will
    cause the INPUT statement to be executed 10 times). Note, however that each ?
    must be responded to with a single value—the computer will print 10 question marks;
    one for each execution of the loop.


    If the INPUT statement within the loop contained more than one variable name then
    the user would obviously have more than one value:


    ```

    DO 10 K = 1, 10

    10 INPUT, A(K), B(K)

    ```


    In this case the computer would still print ten question marks, but the user would
    give two values to each of these. The two values would represent one for array
    A and one for array B. For example, in the coding above the two values entered
    during the fourth pass of the loop would be assigned to A(4) and B(4) respectively.'
