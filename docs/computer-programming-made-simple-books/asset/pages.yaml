    # Table Optimization


    The programmer can often restructure tables or table-keys to obtain a more

    efficient means of accessing the table. If a direct method of accessing a table

    element (as shown above) can be utilized it be much more efficient than

    searching a table, with keys included, for the relevant entry. For example,

    pose the sales value for an area is to be added into an area group total. The

    sales numbers are consecutive but the area groups do not contain

    consecutively numbered areas. For example, the areas contained in each group

    might be allocated:


    | Area No. | Group to which area belongs |

    |---|---|

    | 1 | 11 |

    | 2 | 12 |

    | 3 | 11 |

    | 4 | 12 |

    | 5 | 13 |

    | 6 | 11 |

    | 7 | 12 |

    | 8 | 13 |

    | 9 | 11 |

    | 10 | 13 |


    In order to accomplish the requirement to add a value into the correct area

    two tables will be set up. The first will contain the information shown in

    tright-hand column above, i.e. for each area there will be a table entry

    showing the group to which it belongs. (Note that since the area numbers are

    consecutive the area itself will not be held in the table.) Thus, using the

    area number as a search key, the required group number can be selected; this

    group number then can be used as a subscript (suitably adjusted) to access the

    group area table. The two tables would be defined thus:


    ```

    01 GROUP-TABLE.

    02 FILLER PILLER X(20)

    VALUE "111211121312131113"

    01 GROUP-CODE-TABLE REDEFINES GROUP-CODE-TABLE.

    02 GROUP-NO OCCURS 10 PICTURE 99.

    01 GROUP-TOTALS.

    02 GROUP-AMOUNT OCCURS 10 PICTURE 9(5).

    ```


    Note how the group numbers are defined in GROUP-CODE-TABLE; when

    this is redefined each pair of ‘characters’ becomes a two-digit numeric item

    (GROUP-NO) which will become a subscript for the table GROUP-

    TOTALS. The Procedure Division coding to add the area amount to its group

    total could be as shown:'
