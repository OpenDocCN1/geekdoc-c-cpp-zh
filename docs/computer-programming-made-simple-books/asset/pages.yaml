  md: '# 50


    # The Assignment Statement


    The assignment or replacement statement is the most important in the FORTRAN language
    since it is this statement which is used to assign a value to a variable during
    execution of the program. The assignment statement is used for the performance
    of calculations, the result of the calculation being placed in a specified variable.
    The general form of the assignment statement is


    variable = expression


    This is not stating the fact that the variable is equal to the expression but
    is requesting the program to evaluate the expression and place the result of the
    evaluation into the variable named on the left of the equals (replacing the previous
    value of the variable in the process).


    In its simplest form this statement will consist of a variable to the left and
    a constant to the right of the equals. The value of the constant replaces the
    previous value of the variable each time the statement is executed.


    KOUNT = 37


    In this example the constant 37 will be assigned to the variable KOUNT (the previous
    value of KOUNT being destroyed).


    STARTE = 2.34E3


    In this example the variable STARTE assumes the value 2,340 (2.34 × 10³) each
    time the statement is executed. The more normal use of the assignment statement,
    the performance of calculations, will involve an arithmetic expression to the
    right of the equals sign.


    # Arithmetic Expressions


    An arithmetic expression consists of a combination of variables and/or constants
    interspersed with armetic operators and parentheses. The allowable arithmetic
    operators for this type of expression are as shown below.


    +   ** exponentiation (or raised to the power of)

    / division

    * multiplication

    + addition

    - subtraction


    The use of these operators is slightly different from standard mathematical'
