  md: '# Condition Names


    When a particular relational-condition is to be examined a number of times in
    a program the programmer may, to reduce the amount of writing he has to do, assign
    a name to that condition. This he does, in the Data Division, by means of a level
    88 entry.


    ```

    General Format

    88 condition-name VALUE Clause.

    ```


    Suppose a programmer wishes to test frequently in his program to see if the field
    STATUS-CODE is equal to 1. Instead of using the relational-condition


    STATUS-CODE EQUAL 1


    he could assign a name to this condition when defining the elementary item STATUS
    CODE:


    ```

    02 STATUS-CODE PICTURE 9.

    88 OVERDUE VALUE 1.

    ```


    The expression OVERDUE now becomes the name of the relational-condition


    STATUS-CODE EQUAL 1


    and the programmer can replace this expression with

    OVERDUE


    (This condition will be true if STATUS-CODE has a value of 1 otherwise it will
    be false.)


    Several condition names can be assigned to different values of a single elementary
    item:


    ```

    02 STATUS-CODE PICTURE 9.

    88 OVERDUE VALUE 1.

    88 CLOSED VALUE 2.

    88 OK VALUE 3.

    88 REFER VALUE 4.

    ```


    This method of specifying relational-conditions can be quite useful, as shown,
    by giving meaningful names to tests made on a particular value.


    # Compound Conditions


    Several conditions, as described above, can be combined to form a compound condition.
    (Note, however, that it is not recommended that more than two such conditions
    be combined in one statement.)


    Single conditions are combined with each other by using the so-called logical
    operators AND and OR.


    When combined with OR a compound condition is true if either of the single conditions
    is true.

    When combined with AND a compound condition is true only if both of the single
    conditions are true. For example, the compound condition'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# 158 Computer Programming


    A = Z OR C = 3


    will be true if A has a value of 2 or C has a value of 3. However, compound condition


    A = Z AND C = 3


    will only be true if the value of A is 2 and the value of C is 3.


    In addition to AND and OR the operator NOT may be specified in compound conditions
    to negate one or all of the single conditions. For example, the expression:


    NOT A = Z AND C = 3


    will only be true if A has a value other than 2 and C has a value of 3. If NOT
    were to apply to both single conditions then parentheses would be used:


    (A = Z OR C = 3)


    This compound condition would only be true if A did not have the value 2 and C
    did not have the value 3 (i.e. the compound condition within the parentheses was
    false). The various combinations of the logical operators, the compound result
    for the various single condition results, are shown in Table 1:


    Single Condition Compound Condition


    | A | B | AND A AND B | OR A OR B | NOT A | NOT B | NOT (A AND B) | NOT (A OR
    B) |

    |---|---|---|---|---|---|---|--|

    | True | True | True | True | False | False | False | False |

    | False | True | False | True | True | False | True | False |

    | True | False | False | True | False | True | True | False |

    | False | False | False | False | True | True | True | True |


    Table 1. Conditions resulting from compound logical operations


    Note that in this table A and B each represent single conditions (such as COUNT
    = 30, LOOP = 7), and not elementary elements. Thus the expression:


    NOT COUNT = 1 AND STATUS = 3


    will only be true if COUNT = 1 (condition A) is false and STATUS = 3 (condition
