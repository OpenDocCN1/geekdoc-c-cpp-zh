    next consumer. If the account of the transaction does not match that the consumer
    history record will read re-wind further records from the backing store until
    a match is achieved. When the final transaction has processed the program will
    re-wind the magnetic tape and transmit a message to the computer operator stating
    that the program has finished.


    This example makes the business of programming a computer look very simple indeed.
    How then, one might ask, do mistakes occur which result in consumers receiving
    gas bills for thousands of pounds? To answer this, first remember the way we clerks''
    procedure manual had cater for every possible combination of situations. So it
    must be with the computer program. The computer cannot think and if, for example,
    the programmer does not code his program to cater for erroneous input data than
    an incorrect bill could easily be produced. This is often referred to as a GIGO
    system—garbage in, garbage out!


    Incorrect input data and program errors or omissions are two of the main reasons
    why computers produce faulty information. The programmer must cater for every
    possibility in his program. Indeed this, rather than the act of coding, is where
    the art of computer programming lies.


