  md: '# 13


    # Arithmetic Statements


    Some courses in COBOL programming would, at this point, launch straight into the
    details of the Data Division. This division is normally coded before the Procedure
    Division and so learning about it might first seem quite logical. However, without
    knowing what can be done with the data, it can be difficult to understand the
    details of data definition. A further complication is that a full explanation
    of most Procedure Division statements requires a knowledge of the Data Division!
    Something of an egg problem ... The solution adopted in this book is firstly to
    explain some simple Procedure statements, then to examine the Data Division, and
    finally to cover the remaining Procedure Division statements.


    This and the next three chapters will therefore describe some of the basic and
    simplest to understand procedure statements beginning with those used for arithmetic
    computation. The arithmetic statements in COBOL share certain optional additions
    which, having similar effects for each statement, are described first.


    # ROUNDED Option


    After an arithmetic calculation it is possible for the result of that calculation
    to contain more decimal places than the programmer has provided for his result
    field. For example, in the following calculation the result field may only have
    provision for two places:


    ```

    202.13 × 3

    15 = 40.426

    ```


    However, as can be seen, the correct answer requires three decimal places. Alignment
    of arithmetic data items is on the decimal point so therefore the least significant
    digit in the result of the example shown will be lost (or truncated).


    If, however, ROUNDED is specified the least significant digit of the result field
    (in this example the figure 2) will be rounded depending on the value of the digits
    truncated. If the leading truncated digit (in the example the figure 6) is greater
    than or equal to 5 the least significant digit of the result field will be incremented
