  md: '# 56


    # Subroutines


    When writing a large program it is quite likely that a particular set of instructions
    will be required a number of times. For example in a statistical program it may
    be found that the calculation of the mean (average) of a series of values appears
    in different areas of the program logic. It would be wasteful of program space
    and the programmer''s time to code this sequence every time it was required. To
    avoid this FORTRAN provides a facility called subroutineing. This involves the
    writing of a set of instructions as a separate unit that can be executed from
    any part of the program as and when required. The separate unit of instructions
    (called a subroutine) is identified by the word SUBROUTINE which is followed by
    the name the programmer wishes to give it:


    # SUBROUTINE CALC


    This statement indicates that the statements following form part of a subroutine
    to be known by the name CALC. The end of a subroutine is indicated by the word
    RETURN (the additional function of which is discussed later). The following statement
    could therefore be a subroutine to calculate the average of the four variables
    A, B, C, and D.


    ```

    SUBROUTINE MEAN

    M = (A + B + C + D)/4

    RETURN

    ```


    This subroutine assumes that the values to be operated on are always in the same
    variables (i.e. A, B, C, and D). However, it is quite possible, in a large program,
    that the programmer wishes to calculate the average of different sets of variables.
    He could, of course, assign these values to the subroutine variables before passing
    control to the subroutine:


    ```

    A = V1

    B = V2

    C = V3

    D = V4

    ```


    # Passing Parameters


    This method is quite feasible and does have some applications. However, in order
    to avoid the programmer in the additional work (of assigning values to'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Subroutines 283


    the subroutine variables) the compiler provides a simple method of specifying
    the required assignment. The variables which are to be used by the subroutine
    (and which are to be assigned the required variables) are listed in parentheses
    after the subroutine name:


    # SUBROUTINE MEAN (A, B, C, D, M)


    A corresponding list of variables is given in a CALL statement which is used to
    *invoke* (or transfer control) to a subroutine. In its simplest form the CALL
    statement will specify only the subroutine name:


    # CALL SUBA


    This statement will cause control to be transferred to the subroutine defined
    with the name SUBA. When the SUBROUTINE statement has a list of variables then
    the corresponding CALL statement must have an equivalent list of variables. For
    example, to invoke the above-mentioned subroutine MEAN the following CALL statement
    could be used:


    # CALL MEAN (V1, V2, V3, V4, R)


    This will transfer control to the subroutine MEAN and will assign the values of
    the variables named to those variables listed in the statement. In this case A
    will be assigned the value of V1, variable B the value of V2, variable V3, and
    variable D the value of V4; variable R will contain the result of the calculation,
    i.e. the final values of M in the subroutine. The execution of the subroutine
    MEAN will therefore calculate the average of the values of V1, V2, V3, and V4
    and place the result in the variable R.


    The execution of a subroutine is terminated by the RETURN statement which causes
    control to be transferred to the statement following the CALL statement that invoked
    the subroutine.


    The coding below illustrates a program containing two subroutines, each of which
    is invoked from different parts of the program:


    ```

    INTEGER A

    INPUT, A, B, C, D

    CALL SUBA (A, B, R)

    CALL SUBB (R, C, D, S)

    ```


    ```

    CALL SUBA (P, Q, R)

    CALL SUBB (C, D, R, S)

    ```


    ```

    SUBROUTINE SUBA (X, Y, Z)

    INTEGER X

    Z = (X**2 + (Y ** 3)**2)

    RETURN

    ```'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# 284 Computer Programming


    ```

    SUBROUTINE SUBB (F, G, H, J)

    REAL J

    J = F**2 + G**2

    J = (J + H)**2

    STOP

    ```


    (Note that the subroutine type type statements appear within the subroutine itself.)

    It is important to note that not only must the CALL statement specify the same
    number of variables as the SUBROUTINE statement but corresponding variables must
    be of the same type. A variable in the CALL statement list may be replaced with
    a constant value providing the corresponding variable in the SUBROUTINE is not
    the subject of an assignment statement.


    For example, consider the following subroutine that raises a variable to a specified
    power:


    ```

    SUBROUTINE RAISE (A, B, C)

    C = A**B

    RETURN

    ```


    The value for the variable B may be specified, in the CALL statement, as a constant:


    ```

    CALL RAISE (X, 3.0, R)

    ```


    In this case execution of the subroutine RAISE would cause the value of X to be
    raised to the power 3.0 with the resultant values placed in the variable R.


    # Arrays in Subroutines


    When a subroutine is to handle one or more arrays then the list of variables in
    the CALL and SUBROUTINE statements may specify just the array name (i.e. without
    a subscript). The entire array can then be considered to be passed to the subroutine.
    The subroutine must contain any required DIMENSION statements.


    The following illustrates the handling of arrays within a subroutine:


    ```

    DIMENSION X(100), Y(100), W(50), Z(50)

    .

    CALL SWOP (X, Y, 100)

    CALL SWOP (W, Z, 50)

    .

    SUBROUTINE (A, B, N)

    DIMENSION A(100), B(100)

    DO 10 J = 1, N

    A(J) = B(J)

    RETURN

    ```


    The subroutine SWOP is used to transfer the first n elements of one array to another
    (where n is specified in the CALL statement) up to a maximum of 100 elements.
    The first CALL statement shown does in fact transfer the 100


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_315_0.png)'
  merge: -1
  pgno: 315
- img_proc: true
  md: 'elements of Y to the corresponding elements of array X. The second CALL statement,
    by specifying only 50 for the third entry in the variable list, causes only 50
    elements to be transferred from array Z to array W (which happens to be the complete
    array). A single subroutine has therefore been used to manipulate array of different
    sizes merely by amending one of the values transferred to that subroutine at the
    time it was invoked.


    A subroutine which handles only non-array variables can be made to function with
    an array by placing the CALL statement within a DO loop:


    ```

    DIMENSION X(50)

    .

    .

    DO 10 K = 1, 50

    10 CALL SQUARE (X(K))

    .

    .

    .\.

    ```


    ```

    SUBROUTINE SQUARE (A)

    A = A**2

    RETURN

    ```


    This coding, to square each element of an array, is equivalent to the following
    with the array in the subroutine:


    ```

    DIMENSION X(50)

    .

    .

    CALL SQUARE (X)

    .

    .

    SUBROUTINE SQUARE (A)

    DIMENSION A(50)

    DO 10 K = 1, 50

    A(K) = A(K)**2

    RETURN

    ```


    The reader will no doubt appreciate the difference between setting up a loop to
    pass array elements one at a time to a single variable subroutine and passing
    complete arrays to a subroutine with its own looping.


