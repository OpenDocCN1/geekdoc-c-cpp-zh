  md: '# 252 Computer Programming


    notation since an operator cannot be assumed and the mathematical statement (W)(Z)
    is appear consecutively. For example, to indicate the multiplication of W by Z;
    however when using FORTRAN the required operator must be written as:


    ```

    (W)*(Z)

    ```


    The use of two operators, as in ordinary mathematics, as P--Q is not permitted
    in FORTRAN without the use of parameters to separate the two requirements. The
    expression shown would be:


    ```

    P*(-Q)

    ```


    (Note that the expression -P*Q is quite acceptable.) In an expression containing
    a mixture of arithmetic operators such


    ```

    P/Q + 3.0*Z--R

    ```


    a certain precedence of operator evaluation exists in order that the programmer
    may be aware that the expression will always be evaluated in the manner in which
    he intended. The desired calculation in this example is obvious to the reader;
    however, it is equals that a totally different result could be obtained if, say,
    the subtraction were performed before the exponentiation.


    The preferred order of arithmetic operation is as follows:


    +   1. exponentiation

    2. multiplication and division

    3. addition and subtraction


    The sequence of steps undergone to evaluate the expression shown above would be
    as shown below (parentheses indicating here previously calculated values)


    ```

    ***R

    P/Q

    3.0*Z

    (P/Q) + (3.0*Z)) - (***R)

    ```


    As can be seen from this sequence of events on the same level, i.e all additions
    and subtractions, or all multiplications and divisions, are performed from left
    to right. However, if several exponentiations are included in an expression then
    they are evaluated from right to left. This latter rule is most important since
    totally wrong results can be obtained if it is not remembered.


    For example, suppose we wish to evaluate 2***4 (i.e we wish to raise to the third
    power and then raise the result to the fourth), the FORTRAN expression


    ```

    2***4

    ```


    would give an incorrect result since it would be evaluated right to left (i.e.
    ***4 would be the first calculation). The correct method of writing the expression
    would be:


    ```

    (2***4)

    ```


    Operations contained within parentheses are evaluated first. When sets of'
