  md: '# 4 Output Devices


    A number of different output devices are available for use on computer systems
    and various combinations of them will be found in common use. The two original
    input media—punched cards and punched paper tape—may themselves be produced by
    an output device under control of tape—are very slow compared with the speed of
    the computer. However, because of the complicated mechanical component (involved
    in actually cutting the holes) these devices are very slow as the computer itself
    and are rarely used now. The main form of computer output for human use is the
    printed report or hard copy and this chapter will concentrate therefore on the
    output device used to produce it.


    # Printing


    The typewriter discussed in Chapter 3 as a means of inputting data can be used
    also to print results from computer programs. However, since the speed of such
    devices is rarely greater than 30 characters per second they are clearly unsuitable
    for high-volume printing. Instead the main printed output from a computer system
    will be on a Line Printer or a Daisy Wheel Printer.


    # Line Printers


    A number of methods of producing high-speed printing on computer systems have
    been evolved during the past few years. However, the most popular method only
    is described here. This consists of the barrel printer. The main constituent of
    the barrel printer is the print barrel consisting of a metal block, circular in
    cross-section, with a length equal to the required width of printing. The characters
    to be printed are embossed on the surface of this barrel in a way that each character
    appears as a complete row across the barrel. For example, if the printer is designed
    to print lines of 120 characters in width there will be a row of 120 A''s, a row
    of 120 B''s, and so on. This is illustrated in Fig. 9.


