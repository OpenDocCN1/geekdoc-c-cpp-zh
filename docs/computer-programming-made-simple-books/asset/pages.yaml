    field which has not been explicitly or implicitly defined in the program will
    be accepted. (Note—definition of data fields is described fully in Parts 2 and
    3.)


    The output from a compiler can be in two parts: (a) all the statements forming
    the program (i.e. the details making the source program) can be printed out (on
    a line-printer device) with comments generated by the compiler (showing errors
    which have been discovered—these errors are said to be flagged). This source listing,
    as it is called, will be used by the programmer when he wishes to make corrections
    to the original following any tests of the program. (b) A program may be required
    to be edited several times but it is obviously undesirable to compile it each
    time. The compiler can therefore produce the executable program (called an object
    program) as its second output. This can be directed to any output device other
    than the line printer although it is usual to store object programs on a disc
    backing store. From this backing store the program can be retrieved by the Supervisor,
    loaded into memory and executed as the user desires.


    The source listing may be displayed on the VDU screen for a personal or home computer
    system. An interpreter performs a similar function to a compiler but for immediate
    execution. It does not produce an object program. Statements in an interpreted
    program are translated every time they are executed.


    # Operating Systems


    The Supervisor and the Compiler or Interpreter described above are the most important
    of a whole series of systems supplied with a computer and known collectively as
    an Operating System.


    The main aims of an operating system are already given for a Supervisor—to maximise
    the amount of work undertaken by the computer and to minimise the amount of human
    operator intervention. Additional capabilities commonly present in operating systems
    are described below:


    # Library Maintenance


    The programs held on a backing store (called a Library of Programs) have to be
    kept in a tidy condition. If those programs no longer required have to be deleted
    from the backing store and the space allocated to other programs the programmer
    must be to find out what programs are stored in the Library and how much space
    is available for new programs. An Operating System will contain programs to perform
    all these Library functions and produce a Directory listing on demand.


    # Sorting


    It often convenient to have backing store files organised in a particular sequence,
    for example a payroll master file could be organised in ascending clock-number
    order. The Operating System will contain a sort program to accomplish any required
    ordering of backing store files. The program will be generalised and the programmer
    will supply for each particular sort run details about the file to be sorted and
    the way in which it is to be organised (these details are called parameters).


