    # The ACCEPT Statement


    The ACCEPT statement is used to obtain data from the computer operator.


    -------------------------------------------------

    Format

    ACCEPT identifier FROM CONSOLE

    ------------------------------------------------


    When this command is executed the computer will output the message ''AWAITING
    REPLY'' following which the operator may type in his response. The number of characters
    the program will accept from the operator is limited to the length of identifier
    specified in the ACCEPT statement. not until an ACCEPT statement is executed the
    keyboard of the operator''s console remains locked. If the operator keys fewer
    characters than the receiving field can contain then the field will be padded
    with spaces or zeroes (for alphanumeric or numeric fields respectively) as appropriate.


    Example: To allow the operator to input a value for the field DATE:


    ACCEPT DATE FROM CONSOLE.


    Suppose the program requests data for a field defined:


    77 RESULT PICTURE X(6)


    with the statement


    ACCEPT RESULT FROM CONSOLE.


    If the operator replied with YES (note—no quotation-marks are required by the
    operator for an alphabetical reply), the field RESULT would be given a value of
    ''YES    (i.c. 3 blanks would be inserted in the right-hand end as padding). Similarly,
    for a field defined:


    77 MANY PICTURE 999.


    The programmer could code


    ACCEPT MANY FROM CONSOLE.


    If now the operator replied with the single character 7, then the resultant value
    of MANY would be 07 (i.e. zero filled).


    The ACCEPT statement is normally used in conjunction with DISPLAY in order that
    the operator may be told what information is required of him before'
