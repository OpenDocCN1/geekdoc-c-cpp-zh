  md: '# 36

    Qualification


    We have already encountered the case of a program containing two files whose records
    have identical layouts. In order to distinguish the individual fields between
    records we have given the names a unique suffix or prefix. For example, we might
    have the following two sets of data names from a master and a transaction file
    respectively:


    | M-NAME | T-NAME |

    | M-AMOUNT | T-AMOUNT |

    | M-STATUS | T-STATUS |


    It is possible, however, to give identical names to elementary items within record
    descriptions in the same program:


    +   01 MASTER.

    02 NAME PICTURE X(20).

    02 AMOUNT PICTURE 9(6).

    02 STATUS PICTURE X.

    01 TRANS.

    02 NAME PICTURE X(20).

    02 AMOUNT PICTURE 9(6).

    02 STATUS PICTURE X.


    We cannot now refer to one of these elementary items just by its own name since
    to do so would be ambiguous. Instead we qualify each elementary item name with
    the name of the record to which it belongs:


    MOVE NAME OF MASTER TO NAME OF TRANS.


    ADD AMOUNT IN MASTER TO AMOUNT IN TRANS.


    Any number of record descriptions may contain identical elementary item names,
    however, the record names must be unique. Duplicate elementary item names, when
    used, must be qualified with their respective record-description names.


    # CORRESPONDING Option


    When two record descriptions contain a number of identical elementary items'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Qualification 197


    shorthand versions of three COBOL statements are provided to enable these fields
    to be manipulated easily. Consider for example these two record descriptions:


    ```

    IN-REC.

    02 AMOUNT-1 PICTURE 9(5).

    02 AMOUNT-2 PICTURE 9(5).

    02 AMOUNT-3 PICTURE 9(5).

    02 STATUS PICTURE XXX.

    02 NAME PICTURE X(20).

    02 ADDRESS PICTURE X(60).

    01 OUT-REC.

    02 AMOUNT-1 PICTURE 9(5).

    02 AMOUNT-2 PICTURE 9(5).

    02 AMOUNT-3 PICTURE 9(5).

    02 STATUS PICTURE XXX.

    02 NEW-DATA PICTURE XX.

    02 NAME PICTURE X(20).

    02 ADDRESS PICTURE X(60).

    ```


    Suppose we wish to transfer the values of the fields in IN-REC to the like-named
    fields in OUT-REC. We cannot simply say MOVE INREC TO OUTREC because OUT-REC has
    an additional field NEW-DATA which would upset a group. Rather than write out
    the six individual MOVE statements we can use the MOVE statement with the CORRESPONDING
    option:


    Format

    MOVE {CORRESPONDING | CORR} Identifier-1 TO identifier-2


    When this option is specified each elementary item within identifier-1 is moved
    to the elementary item with the identical name in identifier-2. Any elementary
    item in identifier-1 that does not have a corresponding name in identifier-2 is
    ignored.


    For the example above we can move the six elementary items in IN-REC to their
    corresponding positions in OUT-REC using the statement:

    MOVE CORRESPONDING IN-REC TO OUT-REC.


    The other two statements with the CORRESPONDING option are ADD and SUBTRACT.


    Format

    ADD {CORR | CORRESPONDING} Identifier-1 TO identifier-2

    [ROUNDED] (ON SIZE ERROR imperative-statement)'
