    # Optical Character Recognition


    OCR extends at present only to the reading of machine-printed type. Despite many
    years of research the infinite variety of handwriting styles make their reading
    by machine still an engineer''s dream.


    Each character on an OCR document is scanned by a photo-electric device to determine
    its outline or shape. This shape is compared with a sample set to identify the
    particular character whose electronic code then be sent to the computer. Early
    OCR machines were only able to recognise a single font (or type style) although
    the more sophisticated machines can now ''read'' typewritten or computer-printed
    documents.


    OCR techniques are unlikely to be widely used until they can accept handwritten
    documents.


    # Optical Mark Reading


    OMR denotes the use of reading devices which can detect the presence or absence
    of a **mark** (e.g. a pencil crossed). The full forms on some football coupons
    are read by OMR devices where each selection by the punter generates a pulse which
    can be fed to the computer. The heavy black marks sometimes seen on the side of
    such coupons are called **timing lines** and are used by the reading device to
    synchronise the read station with the match entries. Another use for OMR devices
    is in the reading of gas and electricity meters. The meter reader has a form supplied
    to him for each consumer meter he is to read and by making a series of marks with
    a pencil, can record the units of gas or electricity used. Using OMR techniques
    avoids the necessity for a separate data-preparation stage between meter reading
    and computer input.


    # Encoders


    Many large computer installations are now using small computers to transcribe
    data directly from a keyboard to a magnetic device (such as tape or disc). The
    tape or disc is then read at high speed by a unit of the type described in Chapter
    5.


