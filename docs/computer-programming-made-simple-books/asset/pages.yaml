  md: '# 24

    Editing


    Most programs used for commercial data processing will involve some form of printed
    output—e.g. invoices, sales analyses, pay-slips, etc. A file for an output unit
    (which may, as in this case, refer to a printer) is defined, as with any other
    file, by specifying the appropriate FD. We will be looking in Chapter 32 at the
    program instructions to use direct information to an output device. However, while
    still considering the Data Division, it will be useful to examine some other aspects
    of printed reports.


    Suppose the programmer wishes to produce a pay-slip for each employee. He may
    therefore write the necessary statements to output, two lines of print; one giving
    the headings and the second the data. However, if he did this the data would be
    printed as it appears in memory and could therefore look like this:


    | NAME | GROSS | TAX | NET |

    |---|---|---|---|n| JONES B. | 003712 | 0210 | 03502 |


    Clearly, this is unsatisfactory, the gross pay should be printed to indicate that
    it is an amount in sterling—for example like this £37.12 or 37.12; similarly the
    tax and net should be printed in ''legible'' formats (i.e. 2.10 and £35.02). In
    these cases we wish therefore to replace any leading zeros with a £ sign and we
    wish to insert a period to delineate points of pence. This is called editing and
    is specified by means of the PICTURE class in the Data Division. We will look
    firstly at the additional picture string characters that are allowable for the
    specification of editing requirements and then, at the end of the chapter, we
    will some uses of editing.


    Note. The leading zeros have been mentioned once already and will occur frequently
    when editing; so what is exactly by the term? A leading zero (also called a non-significant
    zero) is one that precedes the actual data value and is preceded only by zeros.
    For example, in the field 004206 the first three zeros are leading or non-significant
    zeros and can be removed without altering the value of the item—4206. (Note that
    the length is of course altered but for printing purposes this does not matter.)
    The zero between the 2 and 6 is most significant, however, if it were removed
    the value of the item would be altered to 426.


    # Types of Editing


    Two basic types of editing exist within the COBOL language—insertion'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'editing and suppression and replacement editing. We will first of all look
    at insertion editing which is the easier of the types to understand.


    Simple insertion editing consists of specifying the relevant insertion character(s)
    in the PICTURE string; then when a value is moved to the edited item the insertion
    characters are inserted in the value in the position specified in the PICTURE.
    The simple insertion characters allowable in a COBOL character string are, (comma)
    B (Blank) and Ø (zero). Suppose we have a value 1234567 we wish to print as 1,234,567
    we could move the value to an edited item defined thus:


    # 77 EDIT PICTURE 9,999,999.


    Similarly, we could insert zero characters or blank character into a data item:


    # 77 EDIT PICTURE 99B9B990.


    A data value of 1234567 moved to this item would produce a result of:


    Note that each 9 in the PICTURE character string corresponds to one digit in the
    data value, any insertion character being in addition to this. The total length
    of an edited item therefore includes the insertion characters. The period (full-stop)
    may also be used as an insertion character but may only occur once in the PICTURE
    character string and must correspond with the assumed decimal point in the value
    to be moved to the edited item. For example we wish to edit a data item containing
    the value 346V2 to contain a printed decimal point. We could move the value to
    an item defined thus:


    # 77 EDITOR PICTURE 999.9


    The resulting value of EDITOR would then be 346.2. Note that although V in a PICTURE
    character string is unsigned decimal point and does not occupy any storage, the
    however in an edited PICTURE character string does occupy storage location.


    Fixed-insertion editing involves inserting a sign (+ or -) at either end of the
    data item or inserting a currency symbol (£ or $) at the beginning of the data
    item.


    The characters used to specify these fixed insertions are +, –, and £ respectively.
    (N.B. $ may be substituted for £ as required.)


    If the + character is used to be inserted as part of the value assigned to the
    edited item it is positive, or inserted as—if the value is negative.


    The – character will be replaced by a blank if the assigned value is positive
    or if it is negative. Each of these characters may appear when written either
    end of a PICTURE character string (and will be inserted in the string) but only
    one may appear in any. Examples of fixed-insertion editing (as described above)
    consider the following table showing, in three columns, the PICTURE of an edited
    item, the value moved to the edited item, and the value of the item after editing.


    Notice how in the last example shown we have now managed to insert the £ symbol
    and full-stop into our currency amount, the result is not really satisfactory.
    We would prefer to print the result as £37.12, this could be done by defining
    a PICTURE of £99.99 but now the result field will only hold'
