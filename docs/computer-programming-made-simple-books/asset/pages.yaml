  md: '# Logic and Flowcharting


    calculate a weekly bonus. The value of this bonus could depend on the sex of the
    employee, thus if male path would be followed and if female another path (although
    both paths would return to the same point further down the program). If this were
    the case the master file could contain a field identifying the sex of the employee—i.e.
    it could contain an ''M'' for male and an ''F'' for female. The program would
    then examine this field and decide which path was to be taken upon the value of
    the file.


    Before a program can be written it is necessary to identify every step and path
    making the solution to the problem at hand. It is most important to clearly isolate
    every step and every single condition that can possibly occur during the solving
    of the problem. This is the area in which most mistakes originate during the development
    of a computer program; it is all too easy to be slipshod and not ensure that every
    possibility is catered for. Unfortunately the definition of a computer program''s
    **logic paths** (as they are often called) is not an area which can be readily
    taught to the newcomer—expertise will normally come with experience. However,
    the job is made easy, and in some cases foolproof, by the use of a technique to
    represent the program logic diagrammatically.


    # Flowcharting


    A flowchart is a diagrammatic representation of the logic paths contained within
    a computer program and **flowcharting** is the technique of drawing the flowchart.
    The acts of identifying the logic paths and actually drawing the flowchart are
    difficult to split into separate areas and are normally undertaken as a single
    exercise. Flowcharting is illustrated below but first the symbols used to make
    up a flowchart are described.


    # Flowcharting Symbols


    +   1. PROCESS


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_56_0.png)


    This symbol indicates any complete **process** or **step** which is always executed
    when the path it is in followed. A process, in this context, could include almost
    any simple operation (excluding those shown later as having their own symbol),
    some examples of which are shown overleaf (as a series of processes to be executed
    one after another).


    +   2. DECISION


    A decision box, which is normally entered from the top, represents a point at
    which different process paths may be selected. That is, it represents the occurrence
    of a question—the answer to which will determine the path to be taken.'
