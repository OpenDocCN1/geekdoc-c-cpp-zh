    # Functions


    BASIC includes a range of intrinsic functions that extend the scope of expressions
    in LET and other statements. Most Basics include a wide range of functions which
    are unique to a particular implementation. However, the following 12 functions
    should be available in all versions of the language:


    ABS (X)—returns the absolute value of the variable X. That is, if X is positive
    then ABS (X) = X; if X is negative then ABS (X) = X. For example, in the statement


    ```

    247 LET A = ABS (SUM)

    ```


    if SUM has the value -29 then A will be the value 29.


    EXP(X)—returns the value of e (2.71828) raised to the power.


    INT(X)—returns the largest integer (whole number) that is less than or equal to
    X. For example, the following two statements result in the integral value 412
    assigned to I:


    ```

    66 LET A = 412.76

    68 LET I = INT(A)

    ```


    LOG(X)—calculates the natural logarithm (i.e. to the base e) of the number specified
    in X. Note that the value of X must be greater than zero.


    SGN(X)—produces +1 if the value of X is greater than 0, 0 if the value of X is
    zero and -1 if the value of X is negative. This function is used therefore to
    determine the sign of a number.


    SQR(X)—this function is used to calculate the square root of the value of X (which
    must not be negative). For example, to calculate the length of the side of a right-angled
    triangle, knowing the length of the other two sides and using the formula L² =
    A² + B²:


    ```

    246 LET I = A * 2 + B * 2

    248 LET LENGTH = SQR(I)

    ```


    This statement could have been written on one line:


    ```

