    ```


    If these two values were not equal it is possible for STOCK-LEVEL to become negative
    without ever being equal to zero. If this happens the PERFORM statement would
    be executed endlessly. An alternative would be to code the PERFORM statement thus:


    ```

    PERFORM ALLOCATE UNTIL STOCK-LEVEL LESS THAN 1.

