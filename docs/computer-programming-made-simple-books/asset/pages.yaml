    definitions are required the REDFINES reveals areas are required in which the
    card is validated the amount option could be used on one area; however, in this
    application more than one area may be in preparation at time.


    In addition to the print-line areas are an examination of the program specification
    that areas in which the total amount of cash written to tape can be accumulated.
    Each card contained in the payment or credit field(s) is added to the appropriate
