  md: '# 23 Data Values


    Data-Item Content


    Most of the data items we will define in the Working-Storage Section will have
    values assigned to them during execution of the program. However, it may be required
    to give an item an initial or starting value (which we may use as a *constant*
    throughout the program or which we may overwrite). Any data item could of course
    be given a value in the opening section of the Procedure Division by coding the
    necessary statements. However, this would be wasting time and storage since the
    statements would be executed only once during each run of the program, they would
    occupy storage space throughout execution. It would be far more convenient if
    a value could be given to a data item at the time it was defined and so be allocated
    by the compiler and therefore not require any additional time or storage at the
    time the program was executed. This can be done by means of the VALUE IS clause.


    # The VALUE IS Clause


    This clause is used to give to an elementary item, in the Working-Storage Section,
    an initial or starting value.


    | Format |

    | VALUE IS literal |


    The value specified by literal is given to the data item, the item assuming the
    specified value when program execution starts. Note that if this value is altered
    or amended in any way during program execution it is not restored (unless of course
    the program is reloaded, at which point everything returns to the original state).'
  merge: -1
  pgno: 160
