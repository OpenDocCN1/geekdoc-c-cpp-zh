  md: '# 66


    # Arrays and Subscripts


    Arrays


    An array is a set of like variables arranged in sequence and referred to by a
    single name, qualified as necessary. A simple way to think of an array is as a
    set of pigeon holes. For example, Fig. 50 shows four boxes which could represent
    an array called, say, B. Then the four ''boxes'' would be known as:


    ```

    B(1), B(2), B(3) and B(4)

    ```


    | 1 | 2 | 3 | 4 |

    |---|---|---|---|


    Fig. 50. One-dimensional array B.


    Each element of the array (as the ''boxes'' are known) have the same properties
    as any simple numeric variable in respect of its value:


    ```

    112 LET B(1) = 2.19

    114 LET B(2) = 3.142

    116 LET B(3) = B(2)*2

    118 LET B(4) = B(3) + B(1)

    ```


    The qualifier for an array name—following the name—is known as the subscript.
    The name of an array element is sometimes known as a singly-subscribed variable
    or just a subscribed variable.

    The array discussed thus far is called one-dimensional. It has a single subscript
    to identify each element of the array. A two-dimensional array would need two
    subscripts to identify each element. Fig. 51 shows a two-dimensional array called
    C. This array has three rows of four columns. The individual elements are referenced
    by the row and column number. For example, the top left-hand element is C(1, 1)—row
    one, column one—the bottom-hand element is C(3, 4)—row three, column four. For
    a double-subscribed variable, the row number is specified first and the column
    number second.


    The elements of a two-dimensional array can also hold the same values as simple
    numeric variables:


    ```

    226 LET COUNT(1, 2) = 3.14

    228 LET NAMES(2, 3) = 29.88

    ```'
