  md: '# Preparing Data Files


    Before any file can be accessed an OPEN statement must be specified and it must
    contain either the INPUT or the OUTPUT option. Any attempt to access a file that
    has not been OPENed will result in a program failure, as will an attempt to, OPEN
    INPUT on a file destined for a printer device. Magnetic Tape Files. The other
    options in the OPEN statement general apply only to files on magnetic tape devices.
    In the case above a file is to be created and read back by the same program, it
    is possible to read the tape backwards to avoid rewinding the reel. (Note, that
    of course, the individual records on the file will be read in reverse order.)
    To achieve this following statement could be used:


    # OPEN INPUT WORK-FILE REVERSED.


    The REVERSED option indicating that the file is to be read in reverse order. Similarly,
    if the tape is not to be automatically rewound when it is opened the NO REWIND
    option can be specified:


    OPEN INPUT FILE-A REWIND.

    OPEN OUTPUT FILE-B REWIND.


    The additional options available for magnetic tape files are very rarely used
    and the programmer will normally only be concerned with specifying whether the
    file is INPUT or OUTPUT.


    For example, in the sample program discussed in Chapter 25 the first paragraph
    in the Procedure Division would be to OPEN the files used by the program as shown:


    BEGIN. OPEN INPUT CARD-IN.

    OPEN OUTPUT TAPOUT, PRINT.


    Notice how one statement can be used to OPEN more than one file.

    The programmer must remember to give an OPEN statement before attempting to input
    data from output data to a file.

    When a program has completed the processing of a particular file the operating
    system has to be informed that the device containing the file can be made available
    to other users (e.g. each magnetic tape file is rewound)


    # The CLOSE Statement


    The CLOSE statement is used to inform the operating system that a file is no longer
    required for processing.


    | Format |

    | --- |

    | CLOSE file-name-1 [WITH NO REWIND LOCK] 1 |


    In most cases the programmer simply specifies the file name(s).


    CLOSE MASTER-FILE.

    CLOSE CARDS, PRINT-FILE.


    Following this statement this particular file(s) closed is no longer available
    to the program (unless it is opened again).'
