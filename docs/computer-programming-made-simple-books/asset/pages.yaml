  md: "# Functions\n\nFunctions in Use\nA tremendous number of uses exist for functions\
    \ and precisely where you will encounter them will depend upon your working environment.\
    \ However, to clarify the method of using functions in FORTRAN some examples of\
    \ their use are presented below: \n\nA quadratic equation of the form $ax^2 +\
    \ bx + c = 0$ has two roots given by the formula\n\n```\nx = \\frac{-b \\pm \\\
    sqrt{(b^2 - 4ac)}}{2a}\n```\n\nThe following program will read the values of a,\
    \ b, and c and print the roots of the equation:\n\n```\n10 INPUT, A, B, C\nPRINT,\
    \ (-B + SQRT(B**2 - 4*A*C))/2*A\nPRINT, (-B - SQRT(B**2 - 4*A*C))/2*A\nGO TO 10\n\
    ```\n\nGiven one angle and the length of the opposite side of a right-angled triangle\
    \ the following program will calculate first the lengths of the other two sides\
    \ and then the area of the triangle. (Note—L1 is the length of side opposite angle\
    \ A and so on):\n\n![](img/65765bbbc6edc77d698bfd1cdb00e913_322_0.png)\n\n```\n\
    REAL L1, L2, L3\n10 INPUT, L1, A\nL2 = L1/TAN(A)\nL3 = SQRT(L1**2 + L2**2)\nA\
    \ = L1*L2* 0.5\nPRINT, L1, L2, L3, A\nGO TO 10\n```\n\nWhere the square root is\
    \ to be taken of the difference between two numbers it is useful to use the DIM\
    \ (Positive difference) function to avoid the possibility of supplying a negative\
    \ number to the SQRT function:\n\n```\nF = DIM(A, B)\nS = SQRT(F)\nor S = SQRT(DIM(A,\
    \ B) )\n```\n\nThe trigonometric functions can be used to derive the co-ordinates\
    \ of a variety of curves as shown below. The degree of accuracy of the subsequent\
    \ plotting can be improved by increasing the number of executions of the DO loop.\
    \ The"
