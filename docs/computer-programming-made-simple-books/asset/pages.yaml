    # Printing on Pre-printed Stationery


    Pre-printed stationery is that has been overprinted, prior to use, with standard
    wording or some form of pattern. Pre-printed stationery is used for such things
    as invoices, statements, gas bills, promotional letters, and so on. In this case
    it is not necessary for the programmer to produce heading information (since this
    will already be on the stationery); however, he must ensure that his program prints
    within the format of the pre-printing. When pre-printed stationery is to be used
    the program specification must include a detailed layout of the positioning required
    for the printing. It is no use supplying a sample of the pre-printed stationery
    since this will not show the programmer accuratiled the relative positioning of
    the various boxes on each sheet (which of course could use an accurate ruler to
    measure the character and line spacing but this is considered undesirable). Instead
    the program specification should include a printer layout sheet marked with the
    required printing positions. Figure 42 illustrates the use of a printer layout
    sheet for a pay-slip. The left-hand column indicates the channels in use and as
    be seen the first line to be printed is represented by channel 1 (head of page).
    Given this code the programmer would transcribe the printer layout to a print-line
    definition in his program. The definitions for the sample pay-slip shown could
    appear:


    ```

    01 DETAIL-1.

    02 FILLER PICTURE X(10).

    02 EMPLOYEE-NAME PICTURE X(20).

    02 FILLER PICTURE XX.

    02 DEPARTMENT PICTURE X(6).

    02 FILLER PICTURE XXX.

    02 GROSS-WAGE PICTURE ZZ99.99.

    02 FILLER PICTURE XX.

    02 DEDUCTIONS PICTURE ZZ99.99.

    02 FILLER PICTURE XX.

    02 TAX PICTURE Z99.99.

    02 FILLER PICTURE XX.

