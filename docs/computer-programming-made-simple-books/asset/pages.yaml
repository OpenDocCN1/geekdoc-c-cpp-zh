  md: '# Part 3:

    FORTRAN Programming Language


    FORTRAN had its beginnings in the mid-1950s when computing, as well as programming,
    was very much in its infancy. At this time the number of compilers in development
    was small and little or no co-operation between compiler writers was developed
    as much coincidental as planned. It was not the mid-1950s that any attempt was
    made to formally define an industry wide standard for the FORTRAN programming
    language. FORTRAN and the standards relating to it have developed continuously
    since this time and indeed seem likely to continue doing so for standards for
    FORTRAN are specified by ANSI—the American Standards Institute (formerly USASI
    and ASA), ECMA—the European Computer Manufacturers Association, and ISO—the International
    Standards Organization. ISO further complicated the issue by producing three separate
    levels of ''standard'' FORTRAN; to each these were suggested minor changes or
    amendments by many of the members of ISO.


    Each of the FORTRAN standards mentioned above describes only the minimum level
    that must be contained within particular implementation of the language. Many
    of the computer manufacturers have written compilers containing their own extensions
    on the extensions required to the basic standard language. We can, therefore,
    that while the concept of FORTRAN is internationally standardised its implementation
    varies, in varying degrees, from manufacturer to manufacturer.


    It is clearly undesirable for a book of this to describe a language as implemented
    on a particular computer. The reader must be given a grounding in FORTRAN sufficient
    to enable him to use the language on any modern computer. However, from the foregoing
    it is clear that this could be difficult and extremely lengthy. The content of
    Part 3 describes, therefore, the underlying principles behind FORTRAN, giving
    full details of the common statements available together with some of the more
    common extensions to the languages. These extensions, which are identified in
    every FORTRAN compiler in the manner described but represent a concise overview
    of the more common additions to standard FORTRAN.


    Having studied the following text, and completed the exercises, the reader will
    be prepared to undertake FORTRAN programming on any modern computer. The peculiarities
    of the particular machine chosen (including Job Control—see Part 1—available peripherals
    and language extensions will be'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# 240 Computer Programming


    readily apparent from the detailed reference manuals supplied by the manufacturer.

    A common, and recommended, procedure for familiarising oneself with with a given
    compiler''s implementation details and for learning more about program coding
    techniques is to study some source listings (see Part 1) output from that compiler.
    In doing so the reader may encounter some of the terms mentioned below; while
    these are part of the standard FORTRAN nucleus they represent some advanced and
    complicated procedures which are beyond the scope of this book. The terms are—PAUSE,
    REWIND, BACKSPACE, ENDFILE, COMMON, EQUIVALENCE, EXTERNAL, and BLOCK DATA.'
  merge: -1
