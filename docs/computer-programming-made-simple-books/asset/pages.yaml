  md: '# Area A and B


    Area A (columns 8–11) is reserved for the beginning of division headers, section
    names, paragraph names, and certain level numbers as described below. Area B is
    used for coding COBOL source statements.


    Division Header. The name of the division (e.g. ENVIRONMENT DIVISION), which must
    be the first entry in a division, starts in Area A. A space must separate the
    two words and a period must immediately follow the WORD. No other text may appear
    on a division header.


    Section Header. The section name (e.g. ROOT SECTION see Chapter 26) follows the
    same rules as a division header.


    Paragraph Names. The name of a paragraph (consisting of one or more sentences)
    starts in Area A of any line following the division header and is followed by
    a period followed by at least one space. Each successive line of a paragraph starts
    in Area B.


    Level Number. The level number of a data item (see Chapter 17) may appear anywhere
    in Area A followed by its descriptive information in Area B. Level numbers 02–49,
    66, and 88 may also appear in Area B followed immediately by their descriptive
    information.


    A blank line, as defined by the COBOL compiler, is one containing spaces in columns
    7 to 72 inclusive. A blank line may be used to improve the readability of a program
    and can appear anywhere except immediately preceding a continuation line.


    The use of the COBOL coding form is illustrated in Fig. 34. Do not at at this
    stage attempt to understand the actual coding used in this example—all the expressions
    used will be explained as the book proceeds.


    # Exercises


    +   1. Write down the columns reserved for Area A and Area B.

    2. In which columns does the continuation character appear?

    3. In which areas do the following occur?


    +   (a) Division header

    (b) Paragraph name

    (c) Level 01 entries

    (d) Level 02 entries


    +   4. In which columns does the sequence number appear?

    5. Can a blank line be followed immediately by a continuation line?'
