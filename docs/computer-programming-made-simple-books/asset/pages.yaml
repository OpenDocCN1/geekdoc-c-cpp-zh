  md: '# 31

    Preparing Data Files


    Almost all commercial programs will handle some form of input or output files
    on one or more of the the available storage devices. We have already examined
    the File Description (FD) entries required to define these files in the Data Division.
    So now we come to the problem of accessing the data on our files within the Procedure
    Division.


    Before a file can be manipulated it is necessary for the operating system to make
    certain checks on the file we are about to deal with and on the device containing
    the file. The operating system must verify that the required device is available
    to the system (i.e. that it is switched on) and that the file on the device is
    the correct one (which applies only to magnetic tape and magnetic disc files).
    The methods by which these checks are carried out are not the concern of the programmer,
    however, it is necessary for each COBOL program to issue an instruction requesting
    that the checks be carried out on the file(s) required by the program.


    The OPEN Statement

    OPEN statement prepares a file for processing by the program.


    | | |

    |---|---|

    | OPEN [INPUT { file-name | REVERSED } { ... ] |

    | | WITH NO REWIND |

    | [OUTPUT { file-name [WITH NO REWIND] } ... ] 1 |


    When the FD for a particular file was written no indication was given as to whether
    the file was required for inputting data or for outputting data. This is in fact
    specified in the OPEN statement. Because of this it is possible, if required,
    to create a data file in one part of the program and then (by issuing a new OPEN
    statement) to read the same file in another part of the program. A file can be
    prepared for input processing thus:


    ```

    OPEN INPUT MASTER-FILE.

    or for output thus:

    OPEN OUTPUT PRINT-FILE.

    ```'
