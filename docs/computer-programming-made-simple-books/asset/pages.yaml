  md: '# Constants and Variables


    Constants


    Being a mathematics based programming language FORTRAN makes great use of numbers.
    The numbers, as will be seen below, can be of several different types depending
    upon the type of calculation involved. Any amount specified as an actual quantity—such
    as 3, 10, or 327.4—has a fixed unvarying value throughout the program. Such a
    value is known therefore as a constant. In addition to numeric constants FORTRAN
    has three types of non-numeric constants specified with alphabetic characters.
    The language contains seven types of constants each of which is described below.


    Integer Constant


    An integer constant represents an integral or whole number and is made up of 1
    to about 11 digits* without a decimal point. Integer constants may be preceded
    by a sign indicator (+ for positive, – for negative) although if none is present
    the number is assumed to be positive. When a large number (such as 3,427,691)
    is to be used it must be written without the embedded commas. Examples of valid
    integer constants:


    ```

    3

    +27

    -91

    41638219

    ```


    Examples of invalid integer constants:

    4. (decimal point included)

    2,764 (embedded comma used).


    Real Constant


    A real constant represents an integral number or a number with a decimal position.
    It is written as a string of 1 to about 9 digits* including as a decimal point
    or as a floating-point value (see Chapter 9). When written as a string of numbers
    a real constant may be signed (preceded by + or –) or unsigned in which case it
    is assumed to be positive. When a real constant has an integral value it must
    still be given a decimal point (i.e. 35. or 3).


    > * The actual upper limit will depend upon the computer in use and can be found
    in the manufacturer''s manual.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Computer Programming


    When specified in floating-point format the mantissa must be formatted as the
    first type of real constant (i.e. it must have a decimal point). The mantissa
    is followed by the letter ''E'' which is followed by an integral exponent. This
    exponent may be signed or unsigned; if unsigned the exponent is assumed to be
    positive.


    Examples of real constants:


    +   4.

    27.2196

    2492.3

    4.0E3 (equivalent to 4.0 × 10³ = 4000)

    3.0E-3 (equivalent to 3.0 × 10⁻³ = .003)

    3.47E + 12


    Examples of invalid constants:


    +   6 (no decimal point)

    3,234.0 (embedded comma)

    E6 (no mantissa)

    4.0E (no exponent)


    # Double-precision Constant


    This type of constant is specified in the same manner as a real constant except
    that it must always have an exponent. The letter ''D'' (used instead of ''E''
    to precede the exponent) differentiates a double-precision constant from a real
    constant. The letter ''D'' for double precision is interpreted in the same manner
    as an ''E'' for a real constant, with the exception that more precision is maintained
    within. An example may use up to 17 significant digits (e.g. 1.2456789E10) whereas
    D-type may use 19 (e.g. 7.4672134689123467826). The actual precision permitted
    in these two cases is dependent upon the computer system in use.


    The rules for formatting double-precision constants are the same as for floating-point
    real constants.


    # Complex Constant


    Branches of mathematics require calculations to be performed using the square
    root of -1 as a factor. Since a negative number can never have a real square root
    —i is used, in mathematics, to indicate the imaginary value of √-1. Values involving
    i are often called imaginary numbers although the most usual term is complex numbers.


    A complex constant in FORTRAN is a representation of the value a + b where a and
    b are real values. It is written as two real numbers separated by a comma and
    enclosed in parentheses. These two numbers represent a and b respectively. Note
    the letter i is not written as part of the constant.


    For example the complex constant (4.3, 7) represents the value 4.3 plus 7 times
    √-1. The constant (6.1, 2.7) has the expanded value of 6.1+2.7i. It is most important
    that the parentheses are specified for a complex constant; where, as we shall
    see later, numbers are enclosed in parentheses for other purposes these must be
    in addition to those required for the specification of a complex constant.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Alpha or Literal Constant


    Although FORTRAN is basically a mathematical language it is sometimes necessary
    to use non-numeric constants. For example, if a value were to be printed out with
    a name to identify it an alphabetic literal would be used. Literal constants can
    use any length and are specified either as a character string enclosed in quotation
    marks or in the form nha where n is the number of characters and a... is the character
    string composing the constant.


    Using quotation marks alpha constants could be written as:


    ```

    “TEST" "RUN6" "GO" "ANS”

    ```


    The same alpha constants could be written in the more common alternative format
    thus:


    ```

    4TEST 4RUN6 2HGO 3HANS

    ```


    Note that digits may be stored in an alpha constant although ''1234'' is not a
    number and cannot be used in arithmetic statements. Also some compilers, especially
    in a time-sharing environment, limit the length of a literal (or alpha) constant.


    # File-name Constant


    This type of constant specifies the name of an input/output file to which the
    program will refer. It is composed of 1 to 8 characters enclosed in quotation
    marks. The following, for example, are valid file-name constants:


    ```

    “TESTFILE" "RUNDATA" "ANSWERS”

    ```


    The use of file names will become clearer when the statements used to transmit
    data to and from backing store devices are examined in Chapter 53. This type of
    constant is generally restricted to time-sharing compilers.


    # Logical Constant


    This type is mentioned here for completeness since its use will not become clear
    until later chapters have been studied. Suffice to say that a logical constant
    can have only one of two values:


    ```

    .TRUE. .FALSE.

    ```


    Note that each value is preceded and followed by a period (full-stop).


    # Variables


    Within his FORTRAN program the programmer must have areas in which he can store
    the intermediate and final results of his calculations. Rather than having the
    unchanging values of constants these new areas will have values which vary as
    the program progresses through its various stages. These areas are therefore known
    as variables. A variable is an area of memory which can contain a value and to
    which the programmer can refer in his program by name (rather than value).


    The name by which a variable is identified in a program is composed of alphanumeric
    characters the first of which must be alphabetic The maximum'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# 248 Computer Programming


    length of a variable name is dependent upon the computer system in use it is

    usually set at 6 characters. Examples of valid variable names are:


    # COUNT RESULT A TOTAL7 D432


    A name such as 4AB or 789, however, be be invalid because it did not

    begin with an alphabetical character. When a statement refers to a variable by

    name the execution of that statement refers to the current value of the

    variable. A single statement may be executed several times with a particular

    having a different value each time.


    Just as a constant may be of several different kinds so the value of a variable

    will be of a specific type. Each is allocated a type of value and it

    may hold only this type throughout the execution of the program. There is a

    variable type corresponding to each kind as described above.

    Variables can therefore be of the following types:


    +   integer

    real

    double precision

    complex

    literal

    file-name

    long

    logical


    Before a variable can be used in a program it must be given a type either

    explicitly or implicitly. Explicit typing is done by means of the type statement

    which consists of a type identifier followed by the variable name(s) which are

    to have that type. Explicit typing of the various variables is shown below:


    # INTEGER COUNT, DIVISR, RESULT

    REAL INTEGER, NUMBER


    In these two FORTRAN statements the variables COUNT, DIVISR, and

    RESULT are identified as integer values and can therefore hold integral

    (i.e. whole-number) values during the execution of the program in which the

    type statement appears, while INTER and NUMBER are shown to be real

    variables and can therefore hold real-number values (i.e. values with

    fractional parts.


    # DOUBLE PRECISION LONG

    COMPLEX X, Y


    These statements define one double-precision variable (LONG) and two

    complex variables (X and Y). The values these variables can hold be

    of the same as respect the respective constant types described above. (For

    example, X could have the value (3.0, 4.7) in one part of the program and

    (13.9, 0.43) in a later part.


    A logical variable (which could hold the value .TRUE. or .FALSE.) is

    defined thus:


    # LOGICAL SWITCH


    Literal (Alpha) and File-name variables are similarly typed, when available:


    # ALPHA NAME, CODE

    FILENAME IN, OUT'
