    310 PRINT

    320 PRINT "AREA OF "; S;; " IS \"

    330 GO TO 110

    340 STOP"

    ```


    # The ON ... GO TO Statement


    This is another way of causing the program sequence to change depending on the
    value of a variable or expression. The general form of the statement is:


    ON expression GO TO list of line numbers


    When executed the expression is evaluated to an integer i (rounded if necessary)
    and control passes to the ith line number in the list. For example, consider this
    statement:


    ON SWITCH GO TO 214, 226, 244


    If SWITCH has the value 1 control passes to line 214, for a value of 2 226 and
    for a value of 3 to 244. If the value of SWITCH is less than 1 or more than the
    number of line numbers (3 in this case) execution continues with the next sequential
    line number.'
