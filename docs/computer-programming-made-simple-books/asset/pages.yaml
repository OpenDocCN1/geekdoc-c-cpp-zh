  md: '# 12

    The COBOL Coding Form


    COBOL source programs are usually coded on a COBOL coding form, the format of
    which is shown in Fig. 33. When coding is complete the coding form is transcribed,
    line by line, on to an input medium. The input medium for COBOL compilers can
    be punched cards, magnetic tape or disc, or direct keyboard entry.


    +   - 1-6 contain the sequence number of the coded line

    - 7 may contain the continuation character

    - 8-11 represent Area A

    - 12-72 represent Area B

    - 73-80 may be used to identify the program.


    Coding examples used in this book are, for improved readability, not shown on
    coding forms. However, the rules for spacing described below take precedence over
    any implied rule in the textual examples.


    # Sequence Numbers


    A six-digit sequence number is used to numerically identify each line to be processed
    by the compiler. The use of sequence numbers for any program is optional; however,
    if present sequence numbers must be in ascending sequence. Any out-of-sequence
    lines will be flagged as an input error.(Note that this will not affect the compilation
    of the lines as read.)


    # Continuation of Lines


    When any entry or sentence cannot be coded on a single line (up to column 72)
    it may be continued starting line(s) in Area B. These subsequent, or continuation
    lines, are identified by the appearance of a hyphen in column 7; When a non-numeric
    literal is to be continued, a hyphen is placed in column 7; and a quotation mark
    indicating the continuation of the literal, is placed anywhere in Area B. Note
    that spaces at the end of the initial line and any following the quotation mark
    on the continuation line are considered to be part of the literal. The continuation
    of a word or numeric literal is indicated by a hyphen in column 7, and the first
    non-blank character in Area B of the continuation line follows the last non-blank
    character in the preceding line.


    Any number of continuation lines may be used although readability may be impaired
    by doing so.'
