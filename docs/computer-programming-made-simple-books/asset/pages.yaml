    Chapter 32 is placed in SPACING). It is possible therefore to split groups

    of on a single page, for example, when sub-totaling is required.

    checking for end-of-page routine is done before each line is printed; in this
    way

    the first line on a page can be separated from the last heading by the

    desired spacing.


    PRINT-LINE. IF SPACING EQUALS SPACE THEN ADD 1 TO

