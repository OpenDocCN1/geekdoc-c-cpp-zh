    executed. The statement is written as the words GO TO followed by a list of statement
    numbers in parentheses followed by a variable name. When the statement is executed
    the value of the variable is examined (note—the integral value of this variable
    must be greater than zero and not greater than the number of statement numbers
    in parentheses) and control is transferred to the statement number with the position,
    corresponding to that value.


    This sounds extremely complicated whereas it is a simple statement to understand
