    considerably reduced. If the programmer wished to retain the name PAYMENTS as
    a group name he could code the definitions thus:


    > 02 PAYMENTS USAGE COMPUTATIONAL.

    03 PAY PIC S999 OCCURS 3 TIMES.


    Now the three (identical) fields are called PAY.

    In the Payroll Master File updating program mentioned already in some examples
    of the amendments to the files are supplied on punched cards. Each of these cards
    can contain up to ten amendments; the cards have the following format:


    | Card code | Dept code | Clock number | Amend | Amend |

    |---|---|---|---|---|

    | | | 1 | 2 | 10 |


    Each amendment consists of two fields:

    FIELD-NO 2 numeric characters

    CHANGE 4 characters of amended data


    Although some of the fields on the Payroll Master File are longer than 4 characters
    they can be updated using the 4 character amendment; each field on the master
    file is allocated a number and this is used on the card file to identify the requiring
    amendment. Any field longer than 4 characters is split into 4 character sections
    each of which is a separate field number.

    This technique is useful because it enables the amendment cards to have a simpler,
    more uniform format. In our particular case only five fields on the Payroll Master
    File exceed 4 characters in length—DEPT-NAME, EMPNAME, EMPLOYEE, GROSS-TOTAL,
    CLOCK—these fields are unlikely to be amended frequently so the multiple amendment
    field technique is quite practical in this case. The reader should note, that
    in an application involving a number of large fields requiring frequent amendment
    a more complicated amendment card layout would be required (with a consequent
    increase in the complexity of the update program).

    The record-description entry for the card file could be defined thus:


    +   01 CARDIN.

    02 CARD-CODE PICTURE XXX.

