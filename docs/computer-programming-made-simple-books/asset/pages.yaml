  md: 'The two variables NAME and CODE could each hold up to 4 alphanumeric characters
    while IN and OUT could each hold a file name (1 to 8 characters). (Note the method
    of assigning and subsequently changing the values of variables is discussed in
    Chapter 50.)


    If a statement is not given for a variable then it has an implied use depending
    on the first character of the name given. The FORTRAN compiler assumes that variables
    names starting with the letters I to N inclusive are integer variables and variable
    names starting with any other letters are real. Thus the following are assumed
    to be integer variables:


    INP, NUM, KOUNT, LOOP


    A, B, COUNT, ZOO


    It is important to realise that implied tying of variables is only effective if
    the particular variable name does not appear elsewhere. For example, if the


    # REAL INTEGER


    appears in the program then the implied tying is overridden. Only real and integer
    variables may be given types, all others be explicitly expressed with the appropriate
    type statement as shown above. Only a single type statement (explicit or implicit)
    may appear for any single variable name and the so will apply throughout the entire
    program. The type of a variable cannot be changed during execution of a program.
    Since an explicit typing for a variable must appear before that variable is used
    it is useful to put all the type statements required at the beginning of each
    of your FORTRAN programs. Note that it is not necessary to specify the number
    of storage locations required for a particular variable. The compiler will always
    allocate a sufficient number to hold the maximum value for a particular type of
    variable (which is dependent upon the computer system in use).


    # Initial Value (Time-Sharing)


    At the beginning of your program (i.e. before any calculations have begun) all
    the variables used in the program (explicit and implicit) will be given an initial
    value by the compiler. This value will be zero for the numeric variables, .FALSE.
    For logical values, and spaces for alpha and file-name variables.


    # Initial Value (Non-Time-Sharing)


    The values assigned to variables will, in this case, be unpredictable at the start
    of processing. It is necessary, therefore, to assign such initial values as required.
    For example, one would set zero values thus:


    ```

    A = 0.0

    B = 0.0

    I = 0

    N = 0

    ```


    In the coding examples used in the remainder of Part 3 initial values as for Time-Sharing
    will be assumed for ease of reading.'
