  md: '# 46

    The Environment Division—1


    The features of the COBOL language covered thus far in this book represent those
    areas which are common to the major computer systems currently in use. Some manufacturers
    provide additional facilities, often peculiar to their own machines. A program
    written in COBOL using the specification given in this book so far will be acceptable
    to the popular commercial computers.


    The remaining COBOL division (the Environment Division) which is described in
    the remainder of Part 2 is to run to describe the computer system on which the
    COBOL program is to be run. This description will vary not only from manufacturer
    to manufacturer but also from installation to installation. It is not possible
    therefore to provide sufficient information to enable the reader to fully copy
    this code. However, the division is relatively small and is quite straightforward;
    an outline is given of the type of information required in this division and the
    reader, faced with the task of coding a program for a specific installation, will
    have no difficulty referring to the appropriate computer manual to discover the
    precise format of the entries.


    # The Environment Division


    The Environment Division, which must immediately follow the Identification Division,
    is identified by the heading appearing in Area A:

    ENVIRONMENT DIVISION.


    The Environment Division describes the type of computer on which the program is
    to be run (in the Configuration Section) and the nature of the input/output and
    backing store devices to be used by the program (in the Input-Output Section—see
    Chapter 47).


    # The Configuration Section


    The Configuration Section describes the type of computer on which the program
    is to be compiled, the type of computer on which it is to be run, and permits
    the user to change certain compiler function names.


    The source and object computers are required in a manner such as shown:

    SOURCE-COMPUTER. IBM-360-30

    OBJECT-COMPUTER. IBM-360-50'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'The Environment Division—1 231


    # General Format


    ```

    CONFIGURATION SECTION,

    SOURCE-COMPUTER, source-computer-entry

    OBJECT-COMPUTER, object-computer-entry

    [SPECIAL-NAMES, special-names-entry]

    ```


    # Special Names


    The full use of this paragraph would require a detailed knowledge of the specific
    computer system on which the program was to be run. However, two common features
    of this paragraph are as described below.


    The use of the word CONSOLE in a DISPLAY or ACCEPT statement may be changed by
    this:


    ```

    SPECIAL-NAMES.

    CONSOLE IS OPERATORS-DESK.

    ```


    Messages to and from the computer could now be coded as this:

    DISPLAY MESSAGE UPON OPERATORS-DESK.

    ACCEPT RESPONSE FROM OPERATORS-DESK.


    The functions of the period (decimal point) and comma may be transposed in PICTURE
    character strings by coding the following in the special names paragraph:


    ```

    DECIMAL POINT IS COMMA.

    ```


    However, the use of this last-mentioned option is not recommended because of the
    potential confusion it may cause when another programmer looks at the program
    containing it.


    # Exercise


    +   1. Write the Configuration Section entries for a program compiled on IBM-360-40
    and to be run on an IBM-360-30. Change the name of CONSOLE to DESK.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# The Environment Division—2


    # Input-Output Section


    The Input-Output Section is used to identify the external storage media by each
    file in the program, to assign each file to a particular input/output backing
    store device (File Control paragraph) and optionally to specify special input/output
    techniques in use (in the I-O-Control paragraph). The general format of the INPUT-OUTPUT
    SECTION is as shown:


    | General Format |

    | [INPUT-OUTPUT SECTION, FILE-CONTROL, {file-control-entry} ... I-O-CONTROL, input-output-control-entry]]
    |


    # The FILE-CONTROL Paragraph


    The format of the FILE-CONTROL paragraph is shown below:


    | General Format |

    | FILE-CONTROL. |

    | SELECT Clause |

    | ASSIGN Clause |

    | [RESERVE Clause] |


    Each file used in the program must have a SELECT clause of the form SELECT file
    name which is followed immediately by an ASSIGN clause describing the type of
    device to be used by the file (e.g. tape, printer, card-reader) and the particular
    device of that type.(N.B. an installation may have, say, two printers and the
    appropriate one must be selected.) The nature of these entries is obviously dependent
    on the computer system in use but a typical entry would be:


    ```

    SELECT PRINT-FILE ASSIGN TO SYS03-UR-1403-S.

    SELECT TAPE-IN ASSIGN TO SYS02-UT-2401-S.

    ```'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# The Environment Division—2 233


    Once the programmer has decided the devices he wishes to use it is a very simple
    task to look up the appropriate device-type code to be used in the ASSIGN clause.
    The newcomer to programming should not worry about these names—their selection
    makes no difference to the coding of the Data and Procedure Division which form
    99% of any program. The RESERVE clause can be used to request the compiler not
    reserve two buffers in memory for a file. If this clause is not specified then
    two buffers will automatically be allocated. To specify a single buffer the following
    is specified following the ASSIGN clause for a file:


    RESERVE NO ALTERATE AREA.


    # The I-O-CONTROL Paragraph


    The general format of the I-O-CONTROL paragraph is as shown below:


    | General Format |

    | I-O-CONTROL, [SAME AREA Clause] ... |


    This can be used when the programmer wishes to use the same input/output areas
    in storage for more than one file. This can only be done if, course, the files
    selected will not be in use at the same time. When two or more files are used
    in the program but are open at different times the use of the SAME-AREA clause
    will reduce the overall size of the program (by avoiding the setting up of two
    sets of areas only one of which will ever be in use at time).


    I-O-CONTROL. SAME AREA FOR FILE-1, FILE-2.


    The I-O-Control paragraph is optional. No attempt need be made by the reader to
    learn the Environment Division entries contained in this chapter—suff from him
    to know they are required. However, for completeness a sample Environment Division
    is shown below:


    ```

    ENVIRONMENT DIVISION.

    CONFIGURATION SECTION.

    SOURCE-COMPUTER. IBM-360-30.

    OBJECT-COMPUTER. IBM-360-40.

    INPUT-OUTPUT SECTION.

    FILE-CONTROL.

    SELECT TAPE-IN ASSIGN TO SYS020-UT-2400-S.

    SELECT TAPE-OUT ASSIGN TO SYS030-UT-2400-S.

    RESERVE NO ALTERATE AREA.

    SELECT PRINTER ASSIGN TO SYS025-UR-1403-S.

    SELECT DATA-FILE ASSIGN TO SYS027-UT-2400-S.

    I-O CONTROL.

    SAME AREA FOR TAPE-IN, DATA-FILE.

    ```'
  merge: -1
