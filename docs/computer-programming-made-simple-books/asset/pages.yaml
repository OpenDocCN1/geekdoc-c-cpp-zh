    # User-Defined Functions


    As well as the built-in functions described above the programmer may define his
    own functions for use within any single program. Any function names so defined
    differ from those of the built-in functions and must not be the same as any variable
    name to be used in the program.


    The purpose of user-defined functions is to avoid repetition when a particular
    expression is to appear frequently within a program. A user-defined function is
    identified by the appearance of a function-type expression to the left of an equals
    sign:


    ```

    MYFUNCTION(X) = A**2 + B**3

    ```


    This identifies the user function to be known as MYFUNCTION which has a single
    argument—when encountered in an expression the program the argument will be assigned
    the value of the expression on the right of the equals sign in the function definition.


    For example the statement:


    ```

    Y = MYFUNCTION(X)

    Y = A**2 + B**3

    ```


    (Note that the X in parentheses is a dummy argument and is not actually used unless
    it be present.)


    The user-defined function can be used anywhere that a built-in function can be
    used:


    ```

    R = A**2*(MYFUNCTION(X) + T**2 + Z

    ```


    In each case the appearance of MYFUNCTION(X) will be replaced by A**2 + B**3.
    As with built-in functions the user-defined functions are evaluated first when
    encountered in an arithmetic expression.'
  merge: -1
  pgno: 323
- img_proc: true
  md: 'The type of a user-defined function is identified (and can be altered) in the
    same way as a variable—MYFUNC is therefore an INTEGER function unless specifically
    typed:


    REAL MYFUNC

    MYFUNC(X) = A**2 + B**3


    A futher example of a user-defined function is shown below where the function
