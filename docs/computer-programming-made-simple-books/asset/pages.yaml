  md: '# 22

    Data Description—2


    Further Data-Description Entry Clauses


    In the exercise for the previous chapter the reader was asked to define a group
    containing three identical fields:


    +   Ø2 PAYMENTS USAGE IS COMPUTATIONAL.

    Ø3 PAY-1 PICTURE IS S999.

    Ø3 PAY-2 PICTURE IS S999.

    Ø3 PAY-3 PICTURE IS S999.


    Defining three fields in this way does not present too much of a problem; neither
    would the Procedure Division coding to handle these fields. However, what would
    the situation be with 200 identical fields? Obviously the programmer would not
    wish to write out 200 field definitions. Neither would he wish to write 200 sets
    of statements to the computations with these fields. Instead he would use the
    OCCURS clause in the data-entry descriptions and subscripting in the Procedure
    Division.


    # The OCCURS Clause


    This clause specifies the number of occurrences of identical fields within a record.


    | Format |

    | OCCURS Integer TIMES |


    Perhaps the easiest method of understanding this clause is by example. Consider
    the definition of the group called PAYMENTS above. Rather than define it as shown
    we can use the OCCURS clause to specify the three occurrences.


    Ø2 PAYMENTS USAGE COMP PIC S999 OCCURS 3 TIMES.

    Notice in particular how the three names PAY-1, PAY-2, PAY-3 are no longer used.
    Instead we have said there are three identical fields called PAYMENTS (how to
    refer to an individual field is shown below) each with the attributes USAGE COMP
    PIC S999. The amount of memory required is the same as in the first example but
    obviously the amount of writing is'
