    # Program Divisions


    A COBOL program is written in four separate divisions, each of which can be coded
    separately during program development. When all the divisions are complete they
    must be submitted for compilation in the following order


    +   IDENTIFICATION DIVISION

    ENVIRONMENT DIVISION

    DATA DIVISION

    PROCEDURE DIVISION


    The Identification Division identifies the name and author of the program and
    the date it was written and compiled. A complete description of this division
    is given in Chapter 45.


    The Environment Division describes the configuration of the computers on which
    the program is be compiled and executed. This feature is incorporated since any
    COBOL program may be run on different computers. This division also allows the
    programmer to assign names (called specialnames—see Chapter 46) to particular
    peripheral units attached to the computer to be used for program execution. A
    full description of the Environment Division is given in Chapters 46 and 47.


    The Data Division contains descriptions of all the data areas, constants, and
    input and output files to be used by the program. The Data Division is described
    in Chapters 17 to 25.


    The Procedure Division describes the operations to be performed by the program.
    This division is not related to any specific computer and will refer to those
    items defined in the Data Division. A discussion of the Procedure Division is
    contained in Chapters 13 to 16 and 26 to 45.


    # Exercises


    +   1. What are the two functions of punctuation in a COBOL program?

    2. What is wrong with this expression?

    3. Name the four COBOL divisions.

    4. Where is the programmer''s name specified in a COBOL program?

    5. How can clauses in a long statement be separated?


    ```

    ADD FIELD ,FIELDDB ,TO ANSWER.

    ```'
