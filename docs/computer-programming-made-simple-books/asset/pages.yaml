  md: '# 206 Computer Programming


    MOVE ZEROS TO EMP-RATE.


    PERFORM DEPT-SEARCH VARYING SUB FROM 1 BY 1

    UNTIL SUB = 21 OR EMP-RATE NOT = ZEROES.

    IF EMP-RATE = ZEROES GO TO DEPT-NOT-FOUND.


    COMPUTE BONUS = NET PAY • EMP-RATE.


    DEPT-SEARCH.


    IF EMP-DEPT = DEPT (SUB) MOVE RATE(SUB)

    TO EMP-RATE.


    In this coding the employee''s department number (EMP-DEPT) is compared with each
    entry in the table in turn. (In the paragraph DEPTSEARCH.) If a match is found
    then the corresponding rate is moved to EMPRATE. The paragraph DEPT-SEARCH is
    performed either 20 times (UNTIL SUB = 21) to examine every entry or until EMP-RATE
    is not equal to zeroes (in other words until a match is made). When either of
    these conditions is true the PERFORM is terminated. If EMP-RATE is still equal
    to zeroes the table has been completely searched and no match has occurred this
    may indicate an error (depending upon the program) and DEPT-NOT-FOUND control
    can be transferred to a special routine (i.e. DEPT-NOT-FOUND above).


    Keys in Serial Order


    If key used to identify each table entry (i.e. department number above) is part
    of a consecutive series then it is not necessary to store the key with each table
    entry. For example if a program has to maintain a total of the number and value
    of sales in each of 12 sales areas numbered 1 to 12 the following table could
    be:


    02 SALES-TOTAL OCCURS 12.

    03 SALES-NO PICTURE 9(4).

    03 SALES-VALUE PICTURE 9(6).


    The first entry in the table represents the totals for sales-area1, the second
    for sales-area2, and so on. If each record is processed separately the following
    coding could be used to identify the correct table element in which to add the
    figures (sales-area number is in the field AREACODE).


    ```

    ADD 1 TO SALES-NO (AREA-CODE).

    ADD AMOUNT TO SALES-VALUE (AREA-CODE).

    ```


    The field AREA-CODE is used as a variable to subscribe to the elements required
    in the table. If the key items do not start at one, but are consecutive, this
    method can still be used. Suppose that a table has been set up to hold the names
    of the 20 branches of a company (each branch element called'
