    been copied from core storage to the tape (the data in core storage are not destroyed
    or altered in any way during this writing). The density of recording varies from
    system to system but will be in the range 200 to 1600 characters per inch (each
    inch of tape could contain the magnetic patterns for 1600 separate characters).
    When the last character from the area of core storage has been transferred to
    the write head is switched off and the tape is allowed to come to rest. During
    this deceleration the erase head remains switched. Since the erase head is switched
    on the moment the tape starts to accelerate until it comes to rest each block
    of tape will be preceded and followed by a portion of unmagnetised tape. Thus
