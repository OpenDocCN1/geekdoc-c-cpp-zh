    # Memory Unit


    The data read from an input device or backing store are transmitted to the computer''s
    memory unit where they are available for processing. This processing can consist
    of arithmetic computations subtracting the employee''s deductions from his gross
    pay to produce his net weekly wage or logical operations such as examining the
    employee''s staff-grade to determine his bonus or overtime rate. The data held
    in the memory unit are also available for transmission to output devices.


    # Output Unit


    When the details of an employee''s pay-slip have been computed they must be made
    available in a human readable format. This is the function of an output unit or
    device which transmits data held in memory to an external medium (which will normally
    consist of paper on which the computer''s output is printed). Output devices are
    described in Chapter 4.


    # Program


    The set of instructions (called a program), corresponding to the clerk''s procedure
    manual, tells the computer how each step in the production of the pay-slip is
    to be carried out. The program is held in part of the computer''s memory and is
    acted by the Control Unit or Central Processor. Each instruction is selected (one
    at a time) and decoded by the control unit will instruct which of the other units
    is required to perform a particular function. For example, if the control unit
    selects the next instruction it will instruct the input device to transmit data
    into the computer''s memory.


    The flow of data within the computer system is shown by the lines in Fig. 1. Data
    flow from the input unit to the memory unit where they are held until,'
