    # Punched Cards


    A punched card (or more a card) consists of a thin piece of card punched 7½ x
    3¼ and divided into 80 columns, each of which can contain one character (letter
    or number). A character is represented by a combination of one or more holes punched
    in a particular column.


    For punching in each column the card is divided into 12 rows. Fig. 5. An unpunched
    character showing the rows and columns is illustrated. A particular character
    is represented by a combination of holes according to a certain code. For the
    purpose of this the card is divided into two areas; the rows labeled 0 to 9 are
    the numeric rows and the rows labeled 12, 11, and 0 are the zone rows. Note that
    0 can be both a numeric and a zone row.


    Representation of the rows (e.g. a hole punched in row labeled 3 represents the
    occurrence of a punched hole in the appropriate row to be the number 3). Each
    column on a card can represent a single number. A larger number like 347 would
    be represented by punched holes in three columns. The letters of the alphabet
    and special symbols as ? & are represented by combinations of zone and numeric
    row punching. For example the letter ''A'' is represented by punched holes in
    the 12 row and 1 row, the letter ''B'' is represented by punched holes in the
    12 row and 2 row.


    A unique code exists therefore for each character that can be input to the computer
    although the reader need connect himself with attempting to memorise any code.
    (A card with input data is illustrated in Fig. 6.) Some punch machines, e.g. those
    used in the data-preparation stage to prepare punched cards, print the punched
    character in each column up to the top of the card. For this, obviates the need
    for anyone to memorise the punched code. Since a card contains 80 columns it may
    contain 80 characters of data. It is quite usual to split a card set of data should
    be decided. A field will consist of one or more columns which collectively represent
    a particular data function. For example, in a payroll application, we could decide
    that columns 1 to 20 would contain the employee''s name and columns 21 to 25 his
    clock-number. We would then refer to the name field (meaning columns 1 to 20)
    or the clock-number field (meaning columns 21 to 25). When a card is divided into
    fields a particular item of information will occupy only that field and even if
    it is shorter than the field, no other item will appear in the field. In the example
    above if an employee''s name consisted of 12 characters then these could be punched
    in columns I to 12. However, the man''s clock-number would still be punched in
    columns 21 to 25 with columns 13 to 20 left blank, i.e. unpunched.


    We now have our data punched into a series of cards to be input to the computer.
    In order to transmit this data we will use a card-reader. A card-reader is a device
    for reading packs of cards mechanically and transcribing the pattern of punched
    holes into a series of electric pulses which are then sent to the computer memory.
    A card-reader is shown schematically in Fig. 3 which will be referred to in relation
    to the following text.'
