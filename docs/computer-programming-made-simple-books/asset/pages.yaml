  md: '# 8

    Operating Systems


    A large modern computer has the ability to run a number of different programs
    at the same time. The way this is done is to start the first program and allow
    it to perform its processing until it requests an input or output operation to
    a peripheral device (i.e. say, say, the instruction to read a disk file record
    into memory). While this input/output operation is being performed the program
    that issued the instruction will be idle (note: even with techniques designed
    to speed up the effective data transfer rate—such as double-buffering—the speed
    of any peripheral device is slow relative to the CPU). During this idle time the
    CPU can perform a second program (in another area of memory) to begin execution.
    Ultimately this second program will also request an input/output operation while
    this is is performed, a third program can be executing.


    In this system could be continued for an unlimited number of programs although
    in practice this is not the case. A number of factors limitations on the number
    of programs that can be in memory at one time and the effect of these will vary
    from computer to computer. The number of programs involved in this technique (called
    multi-programming) would typically be three for a medium-sized computer and to
    about 16 for a large computer (small computers are not usually capable of handling
    more than one program at any time).


    The major limiting factor on the number of programs in a multiprogram environment
    is the speed and size of the CPU itself. Obviously the total number of storage
    locations required by all the programs in storage cannot exceed the number available
    within the CPU. Even though an input/output operation is relatively slow it will
    eventually be complete and then the program that requested it was allowed to continue
    from the point the input/output request was issued with the data now available.
    The sequence of events for a CPU with three programs being run is illustrated
    in Fig. 2.


    We can see the points mentioned above in this figure. When execution of program
    1 is suspended for the first input/output operation program 2 is allowed to execute.
    Similarly when program 2 is suspended program 3 is allowed to execute. Two further
    points are illustrated in the diagram. Firstly when input/output request is made
    by program 3 all the programs are waiting for an input/output operation to be
    completed; the CPU is idle for a short time until one of these operations (in
    the example that program 1) is complete. As soon as one is complete the relevant
    program is'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# 50 Computer Programming


    allowed to continue executing. The second point introduced in the diagram is at
    the end of the second input/output operation for program 2.Since at this point
    program 3 is still waiting for input/output completion the next program to be
    allowed to execute program 1.


    | Program 1 | Program 2 | Program 3 |

    |---|---|---|

    | Execution I/O | Execution I/O | Execution I/O Idle |


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_73_0.png)


    To summarise, therefore, we can say that multi-programming is a system to enable
    a number of programs to interleave with each other such that the execution of
    one program is overlapped with the input/output operation(s) of other programs.
    Clearly there are a number of potential problems associated with multi-programming—for
    example if several input/output operations finished simultaneously which would
    be given control? It could be arranged that if things were organised in this manner,
    it would be possible for the first program to issue input/output request, but
    a program started last in a series to be almost completely ignored. It is necessary
    for some system to be initiated to control or schedule the flow of work through
    the CPU. This scheduling will need to control not only multi-programming but also
    things as peripheral device allocation (to make two programs do not attempt to
    use the same printer at the same time for example), computer operator communication
    and so forth. These tasks are undertaken by a routine known as the Supervisor
    or Executive.


    # The Supervisor


    The Supervisor is a program supplied by the computer manufacturer which is designed
    to control the flow of work through the computer. The Supervisor is termed a *permanently
    resident program* since it will be held in memory all the time the computer is
    in use. Note however that it is not part of the computer, it is basically another
    program (although it will of necessity be more complicated than the average commercial
    program). It is normal practice to load the Supervisor into memory each time the
    computer is'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'switched on; it should only be necessary to reload it if a serious error develops
    causing the Supervisor itself to be corrupted (i.e. altered) in memory (although
    this is rare). As will seen below the Supervisor is used to load the normal production
    programs into memory; the Supervisor is loaded by a special facility built into
    the computer.


    Communication with a Supervisor is one of two methods—using the console (for personal
    and home computers particularly) or by means of a Job Control or Job Description
    Language (often referred to as simply JCL or JDL). The programmer will request
    the various functions he wants by of system and the JCL; for example in a system
    using punched cards as the main input media he would precede his program punched-deck
    with the appropriate JCL cards. The Supervisor would read the JCL cards and either
    carry out the requested function or instruct another (manufacturer supplied) program
    to undertake the system and is beyond the scope of this book; however, the format
    of JCL cards varies from system to system and given an understanding of the basic
    facilities offered by a Supervisor is a simple task to select the required JCL
    statements from the computer manufacturer''s manual. The facilities provided by
    a Supervisor in a large system are described below.


    # Program Scheduling


    This is perhaps most important function of a Supervisor since it is designed to
    maximise the utilisation of the CPU by the introduction and control of multi-programming.
    For the purpose of running several programs at one time CPU memory is divided
    into a number of partitions, each of which can contain one program. (Note—the
    boundaries between partitions are conceptual only, there is no physical barrier
    within the CPU, the size of partitions can be changed as required by giving the
    appropriate JCL command to the Supervisor.) For a system running three programs
    the CPU will be divided into four partitions as shown in Fig. 23.


    | Supervisor | Partition 1 |

    |---|---|

    | Memory | Program 1 | Partition 2 |

    | | Program 2 | Partition 3 |

    | | Program 3 | Partition 4 |


    Fig. 23. Division of memory into partitions.


    At the start of operations the Supervisor will load the three programs and then
    pass control to program 1 which will commence executing. When program 1 issues
    an input or output command (see Chapters 32 and 54) control is transferred to
    the Supervisor which will process the command. The Supervisor will verify that
    the device at which the command is directed is not busy (if the device is already
    actioning an early command—i.e. is busy—the current command will be placed in
    a queue for later processing when the device is free). Once an I/O command is
    actioned or queued, control is returned to the program that issued that command
    (remember double-'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# 52 Computer Programming


    buffering). However, the program will shortly need the data from the second buffer
    cannot yet use it because the input/output operation is not complete. It will
    therefore inform the Supervisor that it is waiting and the Supervisor can pass
    control to program 2. Similarly, control will eventually pass to program 3. As
    soon as a particular input/ output operation is complete the CPU is atomically;
    this means that the program executing is temporarily stopped and control is passed
    to the Supervisor. The Supervisor will verify that the input/output operation
    completed successfully (if not it will attempt the same operation again) and will
    return control to the next program to be executed (which one will depend on the
    system of priorities built in to the Supervisor).


    The Supervisor thereafter schedules the execution of all the programs within the
    CPU and within each program schedules the operation of input/output commands.
    The scope of this work is indicated by an experiment conducted by the author who
    demonstrated that a program designed to read a magnetic tape file and print pays-lips
    on a line printer generated over 3000 CPU interruptions every minute.


    # Operator Communication


    The Supervisor will keep the computer operators informed as to the current status
    of the system and the programs running at any time. For example if an input/output
    operation is unsuccessful—perhaps a record on magnetic tape cannot be read—the
    Supervisor will print out a message to that effect on the computer operator''s
    console typewriter. Often in a case like this the operator will be asked what
    he wants—for example the record which cannot be read by-passed or the program
    be terminated.


    The computer operator can request information from the system by pressing his
    ''break'' or ''interrupt'' button. This causes control to be passed to the Supervisor
    who can then read the operator''s request from the console typewriter and print
    out the information he requires.


    The operator will be informed as each program ends and in some systems he can
    instruct the Supervisor to start a new program by typing the appropriate commands.


    # JCL Interpretation


    The Supervisor is responsible for reading, interpreting, and actioning the JCL
    commands supplied to the system. These can be of two types—direct and indirect.
    A direct command is one that the Supervisor itself can act without reference to
    any other procedure. An indirect command is one that requires a procedure not
    normally held within the Supervisor itself (if all such routines were permanently
    resident in core storage no room would be available for ordinary programs!). With
    the Supervisor is a mini-partition area where special routines can be loaded,
    by the Supervisor, to supplement the standard facilities. As far as the user knows
    these two types of commands are the same—it is only the manner in which they are
    acted upon within the Supervisor that is different.


    The major function of the Supervisor under the heading of JCL interpretation is
    the loading of programs. All programs which have been supplied by the computer
    manufacturer and all those user-written programs which have been compiled are
    stored on a backing store device. When'
