  md: '# 51 Program Control Statements


    The normal flow of execution of the statements in your FORTRAN program is sequential.
    In other words each statement is executed in the order in which it appears in
    the source program. It is often desired that the flow of execution is changed
    from this normal route, perhaps to execute a set of statements several times or
    to by-pass certain statements when specific conditions exist. A number of FORTRAN
    control instructions or statements are available to the programmer to change the
    normal flow. These statements are discussed in this and the following chapters.


    # The GO TO Statement


    The GO TO statement causes control to be transferred to the statement whose number
    immediately follows the words GO TO.


    GO TO 17


    This statement will cause control to be transferred to the statement which is
    preceded by the 17. The sequential flow will continue therefore from statement
    17 (until another control statement is executed). The statement number (17 in
    this example) is written thus:


    17 COUNT = TOTAL + 1


    The following section of a FORTRAN program shows the GO TO statement used to repeat
    a set of statements:


    ```

    10 A = B*C + (D-F)

    L = A**2

    ```


    GO TO 10


    # The Computed GO TO Statement


    This statement can be used to transfer control to one of a number of statements
    depending on the value of a variable at the time the statement is'
