  md: '# 65


    # Loops and <> Subroutines


    The FOR and NEXT Statements


    It is often necessary to execute a series of statements repeatedly, perhaps with
    a counter to determine the sequence. For example, the following coding is executed
    up to 6 times depending on the value of COUNT:


    ```

    124 DATA "ONE", "TWO", "THREE", "FOUR", "FIVE", "SIX"

    126 INPUT COUNT

    128 LOOP = ∅

    132 LOOP = L + 1

    134 READ P$

    136 IF LOOP <> COUNT 132

    138 PRINT P$

    ```


    (Note: for clarity it is assumed that the value of COUNT is always in the range
    1 to 6.)


    The instructions on line 132 to 136 inclusive are called a loop and use a ''counter''
    LOOP to control iteration. The same effect can be achieved in a simpler way with
    the FOR and NEXT statements as shown:


    ```

    124 DATA "ONE", "TWO", "THREE", "FOUR", "FIVE", "SIX"

    126 INPUT COUNT

    128 LOOP = 1 TO 6 STEP 1

    132 READ P$

    134 IF LOOP = COUNT THEN 138

    136 NEXT LOOP

    138 PRINT P$

    ```


    The statement in line 128 initiates a FOR/NEXT loop. This says: set the variable
    LOOP by 1 (the initial value) and increase it by 1 (the increment or step value)
    until it reaches 6 (the terminal value).


    For the first iteration, variable LOOP will be given the value 1 and the statements
    following it will be executed. When the NEXT statement is encountered control
    will pass back to the FOR, the value of LOOP will be incremented, and if it is
    not more than the terminal value, the loop will be executed again.


    When the increment or step value is 1 it can be omitted:


    ```

    128 LOOP = 1 TO 6

    ```'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Computer Programming


    The values in a FOR statement can be variables or expressions:


    ```

    142 FOR A = B TO C

    244 FOR RANGE = 2 TO B*3 STEP 10

    472 FOR J = K TO L STEP -1

    566 FOR KOUNT = R*2 TO 12 STEP B/10

    ```


    FOR/NEXT statements can be written within others;FOR/NEXT statements; this is
    called nesting. The following program extracts a series of numbers from a DATA
    list and, for each number that is positive, prints the corresponding number of
    asterisks (i.e. if the READ is 3 then three asterisks are printed:


    ```

    120 FOR J = 1 TO 6

    122 READ A

    124 PRINT A;

    126 IF A <= 0 THEN 136

    128 FOR K = 1 TO A

    132 PRINT ""

    134 NEXT K

    136 PRINT

    138 NEXT J

    142 DATA 6, -1, 0, 2, 4

    ```


    With the DATA values shown this program will give the result:


    ```

    ******

    -1

    0

    2**

    2**

    4****

    ```


    Note that the inner or nested loop (statements 128–134) are only executed if the
    current value of A is positive (greater than 0).


    To ensure correct operation of FOR/NEXT loops the following rules should be adhered
    to:


    +   - Never jump (via a GO TO) into the middle of a loop.

    - Do not assume anything about the value of the loop variable after dropping out
    of the loop.

    - Do not interleave loops.

    - Take care when using expressions in the FOR statement.

    - Never change the value of the loop variable within the loop.


    Further examples of the FOR/NEXT statement are given in the next chapter covering
    arrays.


    # The GSUB Statement


    It is often found that the same sequence of statements is required a number of
    times in the program. Rather than reproduce the sequence each time it is needed
    it can be included as a subroutine. This is a sequence of instructions that can
    be executed or called from any point in the program and which'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'returns control to the statement following that which called it.


    For example, suppose that in a program concerned with printing the following sequence
    of instructions is required each time a page is completed:


    ```

    424 PRINT

    426 PRINT

    428 PRINT "__________"

    429 PRINT

    433 PRINT "PAGE NO"; NUMB

    434 PRINT

    ```


    Rather than repeat it each time it can be converted to a subroutine by the very
    simple process of adding a single line with the expression RETURN:


    ```

    424 PRINT

    426 PRINT

    428 PRINT "__________"

    429 PRINT

    433 PRINT "PAGE NO"; NUMB

    434 PRINT

    435 LET NUMB = NUMB + 1

    436 RETURN

    ```


    Now each time it is necessary to execute the end-of-page sequence the GOSUB statement
    can be used:


    ```

    174 GOSUB 424

    ```


    ```

    212 GOSUB 424

    ```


    ```

    287 GOSUB 424

    ```


    The RETURN statement will pass control back to the statement following that called
    the subroutine. (Note the addition of line 435 LET NUMB=NUMB + 1, which includes
    the page number calculation in the subroutine and further reduces the coding requirements
    in the main line program.)


    Subroutine calls may be nested, i.e. a subroutine may contain another subroutine
    (some BASICs even allow a subroutine to call itself!). Care should be taken to
    ensure that the main line program does not ''fall through'' to a subroutine (in
    which case an error occurs when the RETURN statement is executed).


    If a sequence of statements is found several times in a program using different
    variables it is often beneficial to convert this to a subroutine also. However
    it will be necessary to pass the appropriate values to the subroutine as parameters.
    For example, suppose a program written includes the requirement frequently to
    INPUT a value and check that it is in the range 1–10. Rather than repeat the coding
    each time the following subroutine could be coded:'
  merge: -1
  pgno: 356
