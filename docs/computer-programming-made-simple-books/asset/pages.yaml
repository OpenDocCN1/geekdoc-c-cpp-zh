    5. The user will now type his identity code.

    6. Programming may now proceed.


    Once the connection, or log-in, procedure has been completed the user can proceed
    with his programming. This is very simple and involves only typing in the various
    FORTRAN statements required and one or two simple commands to the system. These
    system commands are much easier to learn than the JCL for a large system. Some
    typical time-sharing system commands are shown below:


    +   RUN requests the computer to compile and then execute the FORTRAN program
    typed in the terminal.

    STOP requests that the currently program be terminated.

    SAVE instructs the computer to file the current program into backing store for
    later retrieval and rerun.

    LOAD (followed by a program name) causes the computer to retrieve the named program
    from its backing store.

    NEW permits the user to establish a new program (prior to using the SAVE command
    for example).

    EXECUTE causes the computer to retrieve a program from its backing store and immediately
    execute it.


    The reader will no doubt appreciate that armed with a terminal and these simple
    commands, it would be a straightforward task to prepare and run his program. This
    of course is the major attraction of time-sharing—it allows easy and simple access
    to a large computer system for the person with a knowledge of FORTRAN.


    # FORTRAN Coding


    FORTRAN statements may be written on a FORTRAN Coding Form although this is not
    absolutely necessary because of the straightforward layout permitted. Each statement
    may be preceded by a statement number in sequence their order does not affect
    the sequence of execution of the statements within a program. Statement numbers
    are used when it is desired to alter the normal flow of execution through the
    program (see Chapter 51). When the FORTRAN program is to be run directly on a
    computer system the statement number if present occupy the first 5 character positions
    of each line with the statement itself commencing in 7. Position 6 should be left
    blank.


    When typing FORTRAN statements on a time-sharing terminal the layout used must
    appear first on the line and be separated from the statement itself by at least
    one space character. However, when no statement number is given it is not necessary
    to leave spaces where it would have appeared.


    When typing FORTRAN statements on a terminal or when writing them on coding sheets
    input to a large computer it is important to differentiate between the letter
    O and the number 0. The code transmitted to the CPU must be different for these
    two characters since they are course logically different. (Note—unlike these typewriters
    a computer terminal will have two distinct keys.)


    It is not always possible to distinguish these two characters by their context'
