    Format 3. When this format is used the paragraph(s) are performed until the UNTIL
    condition is satisfied. If this condition exists when the PERFORM is encountered
    then the paragraph(s) are not executed.


    Examples: A stock-control program may require the procedures allocating items
    held in stock to be performed until the stock-level is zero.


    ```

    PERFORM ALLOCATE UNTIL STOCK-LEVEL EQUALS ZERO.

    ```


    Care be exercised when coding this type of statement to ensure that the specified
    condition will occur every time the PERFORM is executed. Suppose the paragraph
    ALLOCATE in the above example contained the following statement:


    ```

