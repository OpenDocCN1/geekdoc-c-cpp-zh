  md: '#  28

    The IF Statement


    The IF statement is used to evaluate the result of a condition and causes alternate
    program action depending upon whether the condition is true or false.


    | Format |

    | | statement-1 | ELSE | statement-2 |

    | IF condition THEN | NEXT SENTENCE | OTHERWISE | NEXT SENTENCE |


    When an IF statement is executed the condition is evaluated.

    If the condition is true—the statement following the condition, or the word THEN
    (statement-1) is executed. After execution of statement-1 control is transferred
    to the next sentence unless statement-1 was specified as a GO TO statement. If
    the condition is true and NEXT SENTENCE is specified then control is passed to
    the next sentence.

    If the condition is false—statement-2 will be executed if present—if not present
    or if the NEXT SENTENCE option is used then control is passed to the next sentence.


    +   Examples: Let us first of consider some simple examples of the IF statement.

    Suppose that the programmer wishes to transfer control to the paragraph END if
    the elementary item STATUS-CODE had the value of 1—he could write:


    ```

    IF STATUS-CODE = 1 GO TO END.

    ```


    If STATUS-CODE did not have the value 1 then control would be passed to the next
    sentence. You will remember from the previous chapter that STATUS-CODE has been
    given a condition-name:


    ```

    B2 STATUS-CODE PICTURE 9.

    OVERDUE VALUE 1.

    ```


    The above IF statement could therefore be written:

    IF OVERDUE GO TO END.


    +   Note that both these IF statements will produce identical results.

    Suppose a program, when dealing with a particular record, is to keep a count of
    the number of records whose field TRANSACTIONS is equal to spaces. The following
    statement could be used:'
