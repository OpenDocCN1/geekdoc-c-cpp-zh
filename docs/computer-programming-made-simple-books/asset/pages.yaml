  md: '# 308 Computer Programming


    The following trigonometric functions are also available in BASIC:

    ATN(X)—returns the angle (in radians) whose tangent has the value given by X.


    COS(A)—calculates the cosine of the angle, measured in radians, specified by A.


    SIN(A)—returns the sine of the angle (in radians) given by the value of A.


    TAN(A)—calculates the tangent of the angle whose value in radians is given by
    A.


    The use of the trig functions is best illustrated by a few calculations in respect
    of triangle shown in Fig. 49. The area of the triangle (½AB sinK) is calculated
    thus:


    ```

    244 LET AREA = 0.5*A*B* SIN(K)

    ```


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_339_0.png)


    Fig. 49.


    The two unknown angles are calculated:


    ```

    246 LET ANGL = ATN (B*SIN(K))/(A-B*COS(K))

    248 LET ANGM = ATN (A*SIN(K))/(B-A*COS(K))

    ```


    Finally, the length of the third side C can be computed using the formula C =
    A² + B² - 2AB cos K:


    ```

    250 LET SIDEC = SQRT (A² + B² - 2*A*B*COS(K))

    ```


    RND(X)—this is used to produce a ''random'' number between 0 and 1. If the value
    of X is less than 0 then a new sequence of numbers is started. If X is greater
    than 1 RND(X) gives the next random number in the current sequence. A value of
    zero for X returns the last number again. Note that the number sequence is ''pseudo-random'';
    sequences started with the same negative value of X will be the same.


    The RND function can be used to ''throw dice'' for use, in playing a game with
    the computer:


    ```

    561 LET X = 1

    563 LET DIE = INT (1 + 6*RND(X))

    ```'
