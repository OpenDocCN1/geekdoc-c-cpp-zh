  md: '# Word Types and Constants


    the reserved RECORD can be omitted by the programmer if he so desires. However
    only the word RECORD can appear in this position and it cannot be used elsewhere.
    An optional word is shown in the general formats in upper case but is not underlined.


    # Connectives


    These are reserved words used to connect two data names or literals (see below)
    together with some special relationship. For example, the words OF and IN are
    used as qualifier connectives (see Chapter 37) as shown:


    ```

    MOVE NAME OF INPUT-FILE TO NAME IN OUTPUT-FILE.

    ```


    The logical operators (ADD, OR, NOT discussed in Chapter 27) are also reserved
    words used as connectives:


    ```

    IF PAY-CODE IS COBOL IS NOT EQUAL TO BONUS-CHECK ...

    ```


    A complete list of COBOL reserved words will be found in Appendix 2 and the use
    of each will be explained as it is encountered in the text.


    # Names


    The reserved words we have just examined are already built-in to the COBOL compiler
    and cannot be changed or augmented in any way by the programmer. However, all
    names used in a program are unique to that program and are selected for use by
    the programmer as coding procedures. Names will be used to identify items of data,
    ranges of value, and procedures.


    # Data Names


    A data name is a word (formed according to the rules described above) containing
    at least one alphabetic (A to Z) character and identifies an item of data in the
    Data Division. By using this name the programmer can refer to the item of data
    in his Procedure Division coding. Some programmers invent names for data items
    on random basis and use such expressions as FRED, JIM, JOE, etc. This is very
    bad practice and should not be used under any circumstances; all data names should
    be derived from the contents or use of the data item to produce meaningful names
    which will themselves help to identify the use of the data item. For some example
    of the data names used in a payroll file record could be:


    +   PAYGROUP

    CLOCK-NUMBER

    STAFF-GRADE

    BONUS-CODE

    TAX-CODE


    Any statement when manipulating these data items immediately becomes clearer because
    the data names themselves mean something. This is demonstrated by the following
    statement (do not worry at this stage about the verbs used):


    ```

    IF STAFF-GRADE IS EQUAL TO ''W'' MOVE

    CLOCK-NUMBER TO CLOCK-PRINT.

    ```'
