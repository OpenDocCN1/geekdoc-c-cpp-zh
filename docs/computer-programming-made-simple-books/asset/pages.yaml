  md: "# Input and Output Statements\n\n# The PRINT Statement\n\nThis statement allows\
    \ the user to print the value of a variable on his terminal device during execution\
    \ of his program. To use this statement the programmer writes the word PRINT followed\
    \ by a comma, followed by one or more variable names. When the statement is encountered\
    \ during program execution the current value of the variable(s) specified are\
    \ printed on the user time-sharing teletype device.\n\n# PRINT, A\n\nWhen this\
    \ statement is executed the current value of variable A will be printed on the\
    \ terminal. As with the INPUT statement above, this statement may contain several\
    \ variable names:\n\n# PRINT, R, Q, X\n\nThis statement will cause the current\
    \ values of R, Q, and X to be printed on the terminal device. (Note—the three\
    \ values will be automatically spaced out by the compiler.) Since alpha constants\
    \ can be specified in a PRINT statement it is possible to give notations to the\
    \ data being printed:\n\n```\nALPHA = \"R IS\"\nPRINT, ALPHA, R\n```\n\nThe result\
    \ of this PRINT statement will be the printing of \"R IS\" (which is the current\
    \ value of ALPHA) followed by the actual value of R. Using the INPUT and PRINT\
    \ statements it is now possible for us to write complete working FORTRAN programs.\
    \ For example, as a simple start, let us look at the program to input single values\
    \ and print out the square and cube of these numbers:\n\n```\n10 INPUT, R\nS =\
    \ R**2\nT = R**3\nPRINT, S, T\nGO TO 10\n```\n\nWhen this program is run the computer\
    \ will ask for a value of R by typing a question mark. The value typed by the\
    \ user will be assigned to R; the next two statements will calculate the square\
    \ and the cube of R, and the PRINT statement will type out these values. The GO\
    \ statement will cause the above steps to be repeated as long as the user desires.\
    \ \n\n```\n20 DO K = 1, 10\nINPUT, R\nS = R**2\nT = R**3\nA = A + R\n10 PRINT,\
    \ S, T\nS = A**2\nT = A**3\nPRINT, S, T\nSTOP\nEND\n```"
