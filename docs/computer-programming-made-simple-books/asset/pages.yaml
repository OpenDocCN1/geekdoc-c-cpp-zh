  md: '# 33

    Communication with the Computer Operator


    It is often necessary for a program to give a message to the computer operator
    and on some of the occasions receive a reply from the operator. For example, the
    program may wish to ask the operator for the current date, or in the case of some
    type of error, ask what is the next action to be taken. In order to achieve this
    communication it would be possible to define a file for the operator''s console
    (usually a typewriter type device) with an FD and use a READ or WRITE statement
    as appropriate.


    However, rather than involve the programmer in additional coding for a straightforward
    and standard requirement, the COBOL compiler provides two statements which can
    be used to send messages to and receive replies from the computer operator.


    # The DISPLAY Statement


    The DISPLAY statement is used for transmitting data to the computer operator''s
    console.


    | Format |

    |---|---|---||

    | DISPLAY | { literal-1 Identifier-1 } | { literal-2 identifier-2 } | ... |

    | UPON CONSOLE | | |


    The value of the literals or the current value of each identifier used is transmitted
    to the operator''s console. A mixture of literals and identifiers is permitted
    so that a message can be built up by the program.


    Examples: For the program to send a straightforward message to the operator following
    could be coded:


    ```

    DISPLAY "THIS PROGRAM HAS FINISHED" UPON CONSOLE.

    or DISPLAY "UP-DATE BEGINS" UPON CONSOLE.

    ```


    A more complicated message can be output by mixing literals and identifiers:'
