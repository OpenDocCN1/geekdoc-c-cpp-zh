    BASIC also allows the use of text or string variable arrays whose elements hold
    the same type of strings as simple string variables:


    LET MESSAGES(1) = "TEST"

    LET PRINTERS$(2) = "PROGRAM"

    LET FS(3) = FS(1) + FS(2)


    (Two-dimensional string variables are also available if required.)

    The number of dimensions and the number of elements of an array (its size and
    shape) are specified in a DIM statement. The DIM statement (short for ''dimension'')
    gives the array name and the maximum subscript number in each dimension. (Note:
    although only one- and two-dimensional arrays are shown here, some BASICs allow
    many more dimensions.


    448 DIM A(20)


    This specifies an array called A( ) has 20 elements A(1) through A(20): note that
    the variable A is quite distinct from this array.


    124 DIM B(4), C(3, 4)


    In this statement two arrays are dimensioned; array B( ) has 4 elements and array
    C( ) has 12 (3 rows and 4 columns). String arrays are similarly dimensioned:


    126 DIM NAMES$(16), PRIN$(2,4)


    DIM statements should ideally be placed near the beginning of a program and should
    occur before the first reference to each array.


