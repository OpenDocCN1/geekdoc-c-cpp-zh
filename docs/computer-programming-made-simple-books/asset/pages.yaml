  md: '# Program Flow


    # Format 3


    GO TO.


    Format 1. This statement causes program flow to be transferred to the statement
    or group of statements identified by procedure-name-1. If a GO TO appears where
    an imperative-statement is permitted (for example following the SIZE ERROR option)
    it must be the last or only statement in that imperative-statement.


    Examples: To transfer control to the statement called NEXT:


    GO TO NEXT.


    To use the GO in an imperative-statement position the coding would be like this:
    ADD TAX TO DEDUCTIONS SIZE ERROR GO TO OVERFLOW.


    If the size error condition was raised the GO TO would be executed and control
    would be immediately transferred to the statement called OVERFLOW. When this condition
    is raised other imperative proceeding may be executed prior to the control transfer:


    SUBRACT JUMP FROM LINE-COUNT ON SIZE ERROR ADD 1 TO ERROR-COUNT GO TO CHECK-ROUTINE.


    The most usual occurrence of a format 1 GO TO will, however, the straight-forward
    transfer of control to another statement or group of statements:


    TO READ-NEW-RECORD.

    GO TO END-OF-JOB.\NGO TO OVERFLOW.


    Format 2. By using this statement the programmer is able to transfer control to
    one of a number of procedures depending on the value of identifier. If the value
    of identifier, at the time this statement is executed, 1 control will be transferred
    to procedure-name-1; if value 2 will be transferred to procedure-name-2, and so
    on to procedure-name-n (for a value n in identifier). If the value in identifier
    is not a positive number or is not in the range 1 to n (where n is the number
    of procedure names after the words GO TO) the entire statement will be ignored.


    Examples: Consider the statement shown:


    GO TO ONE, TWO, THREE DEPENDING ON CONTROL.


    If, at the time this statement is executed, the value of CONTROL is 3 then control
    will be transferred to the procedure named THREE. If value 2 will be transferred
    to the procedure name TWO. Any value outside the range 1-3 will cause this statement
    to ignored and pass to the next sequential statement. A payroll program may have
    as part of processing a number of routines to calculate the annual staff bonus
    which is different for each of four grades of staff. Each time that part of the
    program dealing with bonus calculation is executed the necessary transfer of control
    could be accomplished by use of a format 2 GO TO as shown below:


    GO TO BONUS-1, BONUS-2, BONUS-3, BONUS-4 DEPENDING ON

    STAFF-GRADE.


