  md: '# Data Manipulation—1 165


    Then the instruction


    MOVE AREA-1 TO AREA-2.


    would result in the value of AREA-2 being set to ''ABCDE''. (Note that the character
    ''F'' has been truncated.) The instruction


    MOVE AREA-2 TO AREA-1.


    would result in the value of AREA-1 being set to ''VWXYZb''. (Note that a space
    has been inserted to fill the area at the right-hand end)


    # 2 Numeric to Numeric


    Any numeric elementary item may be MOVed to any other numeric elementary item.
    In this type of MOVE the data is aligned on the decimal point—PICTURE string V
    on right-hand end) or specified (period in edited numeric item). After decimal-point
    alignment unused character positions are set to zero and additional character
    positions are truncated. Note that because decimal-point alignment zero filling
    or truncation may occur at either end of the receiving field. For example, consider
    the two definitions below:


    +   - 77 NUM-1 PICTURE 99999 VALUE 217.34.

    - 77 NUM-2 PICTURE 99999 VALUE 69.423.


    We can demonstrate truncation and zero filling in the same statement using the
    statement:


    MOVE NUM-2 TO NUM-1.


    The value of NUM-1 after this statement was executed would be 069V42(zero filling
    at the left-hand end and truncation on the right-hand end). When coding numeric
    MOVE statements it is most important to remember that the data items will be aligned
    on the decimal point—if this is forgotten important data may be lost. For example,
    consider these two definitions:


    +   - 77 TOTAL PICTURE S9V99.

    - 77 SAVE PICTURE S9(8).


    If the statement:


    MOVE TOTAL TO SAVE.


    was executed then the decimal portion of TOTAL would not be transferred because
    of decimal-point alignment (the decimal point is assumed to be at the right-hand
    end of SAVE). Note that this occurs despite the fact that TOTAL and SAVE would
    occupy the same number of storage locations. (If it was required to move the eight
    digits in TOTAL to the eight locations in SAVE without decimal-point alignment
    then the REDEFINES clause be used.)


    The programmer can avoid potential trouble-spots by making all his numeric fields
    the same length:


    +   - 77 NUM-1 PICTURE S(6)V99.

    - 77 NUM-2 PICTURE S(6)V99.


    Then any MOVE statements, such as:'
