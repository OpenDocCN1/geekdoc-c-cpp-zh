  md: '# Data Description—2 135


    # 77 POUNDS REDEFINES PENCE PICTURE 99V99.


    The names PENCE and POUNDS refer to the same 4 character location in memory; the
    difference being that POUNDS has an assumed decimal point in the middle. Note
    that the use of a REDEFINES clause does not alter the content of an area in storage
    but only the manner in which it is used.


    The REDEFINES clause can also be used to give different layouts to structures
    or group items. Consider an area, within a record description, that is to contain
    a date in the format dd/mm/yy (for example 19/02/73). The definition for this
    could be:


    ```

    03 DATE PICTURE X(8).

    ```


    If at some stage in the program it was necessary to perform arithmetic calculations
    on all or part of the date (for example to add 1 to the month to arrive at a new
    reminder date) the definition given would be unsatisfactory. This can be overcome
    by redefining this elementary item as a group:


    ```

    03 DATE PICTURE X(8).

    03 NEW-REDEFINES DATE.

    04 DAY PICTURE 99.

    04 FILLER PICTURE X.

    04 MONTH PICTURE 99.

    04 FILLER PICTURE X.

    04 YEAR PICTURE 99.

    ```


    Note the use of FILLER to by-pass the locations containing the two oblique (/)
    characters. The desired calculation can now be performed as:


    ```

    ADD 1 TO MONTH.

    ```


    An area can be given two group item definitions by use of the REDEFINES clause.
    A group may be used to hold both alphabetic and numeric data at different times
    execution of the program.


    ```

    02 ALPHA-HOLD-AREA      PICTURE X(10).

    03 ALPHA-1               PICTURE X(10).

    03 ALPHA-2               PICTURE X(6).

    03 ALPHA-3               PICTURE X(10).

    02 TEMP-TOTAL-AREA      REDEFINES ALPHA-HOLD-AREA.

    03 TOTAL-1             PICTURE X(6).

    03 TOTAL-2             PICTURE X(6).

    03 TOTAL-3             PICTURE X(6).

    03 TOTAL-4             PICTURE X(6).

    03 TOTAL-5             PICTURE X(6).

    ```


    This technique can be particularly useful when the program is large and likely
    to exceed the available memory size. By using one area for different sets of data,
    at different times during program execution, the programmer will reduce the overall
    memory requirement. Note, however, that the two definitions shown above cannot
    both be in the same time (since only one actual block of 30 storage locations
    is reserved by the compiler).


    The REDEFINES clause may be used at any level except 01 in the file section. When
    specifying multiple record descriptions with the DATA RECORDS redefinition is
    automatically implied.'
