  md: 'calculate the total number of gas units consumed and multiply it by the tariff
    code rate indicated on the consumer''s history file in order to arrive at the
    cost of this quarter''s gas used. This amount will be transmitted to the output
    device to be printed. The program will then check to see if the consumer''s history
    record contains any outstanding debts or hire-purchase charges; if so these will
    be sent to the output device to be printed. The last task will be the printing
