  md: '# 52

    Program Decisions and Loops


    Additional Program-Control Statements


    The GO statement discussed in Chapter 51 always cause the program flow to be altered.
    The IF statement allows the programmer to alter the program flow selectively depending
    on the state of a particular condition. It is possible therefore that if a tested
    condition does not exist the program flow will not be altered. An IF statement
    called a conditional statement since its result depends upon the state of a particular
    condition.


    The simplest form of the IF statement transfers control to one of three statements
    depending on the value of an expression. The statement consists of the word IF
    followed by an expression in parentheses followed by three statement numbers.
    If the value of the expression is negative (less than zero) control is transferred
    to the first-numbered statement, if it is zero control is transferred to the second-numbered
    statement, and if it is positive (greater than zero) then control is transferred
    to the third-numbered statement. For example, consider the statement below:


    ```

    IF (A) 10, 20, 30

    ```


    The expression in this case is simply the one variable, A. If the value of A is
    negative then control will be transferred to statement 10, if the value of A is
    zero control will be transferred to statement 30, and if the expression in parentheses
    following the word IF can be anything that is allowable in an assignment statement
    (Chapter 50) except that complex expressions are not permitted. Some further examples
    of IF statements of the form described shown below:


    ```

    IF (A**2-D) 10, 20, 30

    IF (A*B+C*D-R**Y) 1, 2, 7

    IF (A+B+C+D+X-Y) 6, 7, 8

    ```


    In each case the value of the expression will be evaluated and control transferred
    according to whether the value is negative, zero, or positive. The IF statement
    may also be written with a relational expression in parentheses followed by a
    single statement. If the relational expression is true control will be transferred
    to the statement specified, if the expression is false control will be transferred
    to the next sequential statement.'
