  md: '# Computer Programming


    Thus, if statement 414 the value of C was 10, then the display of variable $B$
    would commence at position 21.


    # PRINT USING


    The PRINT USING statement allows the user to specify the format of a display line
    by defining a display image. The user defines the image for each line format he
    requires; then any PRINT USING statement can call upon this image with its own
    variables. Suppose, for example, string variable A$ contains a print format:


    ```

    116 PRINT USING A$; C; B; R$

    ```


    The three variables C, B, and $R$ will be printed across the page according to
    the rules outlined below.


    Consider first numeric fields, represented in the simplest form by a succession
    of # signs:


    ```

    122 LET A$ = "####"

    124 PRINT USING A$; CNT

    ```


    The value of CNT is allowed 4 print spaces. The value of CNT will be rightjustified
    and leading spaces will be inserted as necessary. If a decimal point is specified
    in the print format:


    ```

    122 A$ = "##.##"

    ```


    then the variable value is aligned to the decimal point, rounded if necessary.
    If the value is less than 1 then BASIC will insert a leading zero:


    ```

    122 LET C = 4.5/5

    124 PRINT USING A$, C

    ```


    The printed value of C will be:


    ```

    Ø.9

    ```


    (Note the trailing space inserted by BASIC.).

    Numeric values can be spaced as desired across a page and aligned on their decimal
    points, thus:


    ```

    482 LET A$ = "##.## #### ##"

    484 PRINT USING A$; 27; Ø.0246; 8

    ```


    The resultant print would be:


    ```

    27.0    Ø.0225    8.0

    ```


    (Note the rounding of .0246 to Ø.025.).

    If a plus sign is included in a numeric field format then either a + or will be
    printed to indicate the sign of the value:


    ```

    512 LET B$ = "+## ###++\n514 PRINT USING B$; 29; -18

    ```


    results in the following:


    ```

    +29    18-

    ```'
