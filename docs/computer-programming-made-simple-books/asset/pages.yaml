  md: '# 15

    Program Flow


    The execution of statements, sentences, and paragraphs normally follows a sequential
    pattern. After each one is executed the one immediately following it is executed.
    This is analogous to reading a book; after each sentence is read the reader continues
    with the sentence immediately following, similarly after each page the immediately
    following page is read. It is frequently necessary to divert the flow of a program
    from its sequential operation, for example, a group of instructions may have to
    be by-passed or a group may have to be executed. The procedure branching statements—GO
    TO, ALTER, PERFORM, STOP, and EXIT—allow the programmer to alter the sequential
    flow of a program.


    # Procedure Name


    A procedure name is the name given by the programmer to a statement or group of
    statements and as seen in Chapter 11 is a paragraph name. A procedure name will
    therefore begin in Area A and is terminated by a period. The selection of procedure
    name for a given program is largely a matter of choice—some programmers like to
    allocate these names sequentially (using names as A10, A20, A30, etc.). While
    others prefer to use meaningful names designed to identify the function of the
    procedure (such as READ-INPUT-FILE, CALCULATE-BONUS, TERMINATE). The latter method
    will be followed throughout this part of the book.


    # The GO TO Statement


    The GO TO statement permits the execution flow to be transferred from one part
    of the program to another.


    | Format 1 |

    | GO TO procedure-name-1 |


    | Format 2 |

    | GO TO procedure-name-1 [procedure-name-2] ... |

    | DEPENDING ON identifier |'
