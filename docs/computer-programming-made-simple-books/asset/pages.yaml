  md: '# The PRINT Statement 317


    If a minus sign is used in the format then it will be printed only if the value
    is negative; otherwise a space will appear.


    A value in pounds can be preceded by a £ sign by using the following format:


    ```

    694 LET P$ = "£####"

    696 PRINT USING P$; 27

    698 PRINT USING P$; 4162

    ```


    which produces the:


    ```

    £27

    £4162

    ```


    Note that the £ sign is ''floated'' to the position immediately to the left of
    the leading digit.


    Most BASIC compilers include a range of facilities for PRINT numeric formats including:


    +   - floating asterisks (cheque protection)

    - exponential format

    - comma every third digit


    Specific rules for these formats should be checked in the supplier''s manual.
    String items can be accommodated in print formats either as constants or variables.
    For example:


    ```

    142 LET A$ = "RESULT IS ##."

    144 LET C = 2.746

    146 PRINT USING A$, C

    ```


    results in a printout thus:


    # RESULT IS 275


    String variables are accommodated either by a ! (exclamation mark) for a single
    character or two / (slash marks) for 2 or more characters. Thus / / (2 spaces
    between slash marks) represents a 4-character string variable.


    Print formatting can usually be ignored at first and it only comes into its own
    when printing detailed reports or reprinted stationery.


    # Blank Lines


    Note that to print or display a blank line—for report spacing—use the PRINT statement
    without an operand.


    ```

    224 PRINT

    226 PRINT

    ```


    This will produce two blank lines.


