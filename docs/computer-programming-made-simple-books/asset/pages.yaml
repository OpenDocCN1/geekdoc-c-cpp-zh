  md: '# 2

    Computer Structure


    The computer as we have already seen,, consists of a central control unit and
    the number of peripheral units collectively known as the computer system. The
    work carried out by a computer system is often known as DP (Data Processing) which
    means the use of electronic machines to derive results from data input to by means
    of arithmetic and logic. The DP is most commonly applied to the use of computers
    in business for routine office work but is equally suited for their application
    as scientific calculators. However, the examples used in Part I to describe the
    workings of computer systems will concentrate on business systems although the
    principles discussed apply to scientific work.


    The computer has already been described as a very simple machine whose main advantage
    is speed. How without accuracy, the wages-slips of a large factory payroll each
    week? The computer system will not use any new methods for producing payrolls
    but will beat the human clerk every time by virtue of its speed and accuracy.
    Indeed a computer has been called a very fast, highly competent (unorilingual)
    clerk. In order, therefore, to discover the constituent parts of a computer system
    and the way in which they are used to solve an everyday problem let us first look
    at the methods used by his counterpart.


    Consider, for example, the wages clerk in a factory whose job it each week to
    produce pay-slips for the factory employees. To complete this task the clerk will
    use, at his desk, the following items:


    +   1. In-tray. This will be used by the clerk for receipt of new or changed information
    likely to cause a change in the pay-slip of an employee. For example, the overtime
    worked by each hourly-paid worker must be notified to the clerk every week, as
    must changes in tax code, time off to illness and so.


    +   2. File. Each employee whom the clerk will make a pay-slip, will have a record
    in the file (entered on a filing-card or in a folder) containing such permanent
    or seldom varying information as the man''s name, grade, pay code, and salary.
    The file will also contain various items of accumulated data to be-updated each
    week, such as the employee''s tax to date, gross pay to date, and any other deductions
    to which the man''s pay may be subjected. As each pay-slip is made, the clerk
    will refer to this file for the standing information and will also-date the financial
    information.'
