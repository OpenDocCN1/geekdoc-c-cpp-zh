    Subscribing

    A subscript is used to refer to an individual field within a list that has not
    been assigned individual names (i.e. that has been defined with an OCCURS clause).


    ```

    | Format |

    |data-name (subscript)|

    ```


    The subscript to identify a list entry is enclosed in parentheses, following the
    entry''s data name and separated from it by a space.

    The first element in a list (also called a table) has the subscript number 1,
    the second subscript number 2, and so on. The maximum value of a subscript is
    equal to the number of TIMES the data name OCCURS.

    To refer to the third amendment in the card layout we could therefore use the
    name:


    AMENDMENTS (3)


    or to refer to the two elementary items within this group:'
