  md: '# 10

    Introduction to COBOL


    # Language Structure


    was was designed to be as much like ordinary English language while containing
    those elements required by the computer system in use. Like English, then, COBOL
    has grammar, punctuation, a character set, and words and names. The grammar of
    the language will not be required until later on and is explained, in detail,
    in Chapter 26; the methods used for formulating words and names are described
    in Chapter 11.


    # The COBOL Character Set


    When writing programs in COBOL the programmer must use only the allowable characters
    and symbols. Any other entry on his coding form will not be recognised by the
    COBOL compiler and will cause an error to be flagged. The character which must
    be described below:


    | Character | Meaning |

    | --- | --- |

    | 0 to 9 | The numeric digits |

    | A to Z | The letters of the alphabet |

    | | Blank of space (where it is important to specify its space its occurrence
    will be indicated in this book, for identification purposes only by ) |

    | + | Plus sign—denoting addition (see Chapter 14) or a positive number |

    | — | Negative sign—denoting subtraction (see Chapter 14) or a negative number.
    Also used as a hyphen- (to join two words) |

    | * | Asterisk |

    | / | Slash (also called stroke and oblique) |

    | = | Equal sign |

    | £ | Currency sign |

    | , | Comma |

    | ; | Semi-colon (also called period) used to terminate sentences (see Chapter
    26) and to indicate a decimal point in a number (e.g. 321.3) |

    | “ | Quotation mark |

    | ( | Left parenthesis |'
