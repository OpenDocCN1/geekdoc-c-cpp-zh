    # The DO Statement


    The DO statement enables the programmer to set up and control a loop in a single
    statement. The format of the DO statement is the word DO followed by a statement
    number followed by a variable name and three values. Execution of the statement
    causes the statements between the DO and the numbered statement to be executed
    with the equal value in the first of the numbers. After this first execution the
    value of the specified variable is incremented by the third number and the following
    statements executed again. This incrementing and executing will continue until
    the variable exceeds the value of the second number. This sounds extremely complicated
    but is quite simple and very useful in practice. To clarify the operation of the
    DO statement we will examine the workings of an example:


    ```

    DO 1Ø J = 1, 4

    ```


    ```

    1Ø A = A + 1

    ```


    The statements between the DO and statement number 10 will be executed four times
    by the DO statement. When the DO is first encountered J will be set equal to the
