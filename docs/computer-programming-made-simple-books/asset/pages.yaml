  md: '# 19

    File Descriptions—2


    File Labelling


    When a backing store file is made available to the computer it is important that
    checks can be made to ensure the acceptability of the file. When a file is to
    be read by a program checks must be made to ensure that the correct file has been
    supplied by the operators. When a file is to be written the program must check
    that the data already on the file, which will be overwritten, is no longer required.
    In order that these checks can be made all backing store files will contain a
    label, This label is simply a specially formatted data record which is the first
    record on the file. The type of information held on a magnetic tape label could
    include the following:


    +   - Volume serial number (i.e. the number of the reel of tape)

    - File name of data on tape

    - Generation number (see below)

    - Data created

    - Retention period (i.e. number of days this file is to be retained)


    Before any file is processed the operating system will read the file label and
    check or all of these fields, depending on whether it is to be read or written.


    File to be read—the operating system will verify that the file name and generation
    number are correct.


    File to be written—the operating system will check that the retention period has
    expired [i.e. the current date is greater than (date created + retention period)].


    If any of these checks fail a message will be sent to the computer user requesting
    the correct file. The details against which the file is to be checked are supplied
    to the operating system by the computer operators. Label checking is performed
    automatically by the operating system and requires no action by the programmer
    except that he must specify in each file description whether or not labels are
    present (see LABEL RECORDS clause).


    Generation Numbers


    The generation number of a file is simply a count of the number of times this
    particular file has been created. For example, a Payroll Master File (held on
    magnetic tape) might be updated weekly; this means that each week the file'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# 118 Computer Programming


    would read in, together with amendments to the file read from, say, cards, and
    a new Payroll Master File written out to a new reel of tape.


    If the old Payroll Master File had a generation number of 307 then the new one
    written out by the update program would be generation 308.


    When file generation 308 was itself to be updated, the following week, it would
    be possible to overwrite generation number 307 and create 309. However, for security
    reasons it is normal to operate the ''grandfather-father'' cycle of generation
    numbers. This means that generation number 309 would be created by overwriting
    generation 307. Supposing, then, that a disaster occurred in the computer room
    and generation number 306 and 308 (and the half-309) were destroyed, generation
    number 307 would still exist and the master file would not have been lost.


    # LABEL RECORDS Clause


    This clause specifies whether or not labels are present on a file.


    | RECORD IS | OMITTED |

    | --- | --- |

    | LABEL | STANDARD |

    | RECORDS ARE | data-name-1 [data-name-2] ... |


    This clause is required in every FD coded in your program.

    The OMITTED option specifies that no labels exist on the file being described.
    The OMITTED option must be specified for punched-card files and printer files
    and may, if desired, be specified for magnetic tape files. It is not recommended,
    however, that magnetic tape files be created without standard labels.


    # LABEL RECORDS ARE OMITTED


    The STANDARD option specifies that labels exist for the file and they conform
    to the standard for the labels on the file are checked as the operating system.
    The specification of this option will ensure that the labels on the file are checked
    as described above.


    # LABEL RECORDS ARE STANDARD


    In addition to the system labels the user is permitted to have his own labels
    on the file. These, when present, will physically follow the standard labels.
    User labels are the same length as system labels (usually 80 characters) but may
    contain any information the user wishes.


    To specify one or more labels the third option of this clause is used:


    # LABEL RECORD IS OWN-LABEL


    This clause will ensure that the system labels labels are processed and that the
    user label is made available to the program for any processing desired. More than
    one user label may be present on a file:


    # LABEL RECORDS ARE OWN-LABEL,OWN-LABEL


    # VALUE OF Clause


    This clause identifies the content of particular field(s) in the user label.'
