    # GIVING Option


    A calculation such as A + B = C, which adds A and B into C, would include

    t original value of C in the result. If this is not required the value zero can

    moved into C before the calculation is carried out. The COBOL language

    provides this facility in one statement by use of the GIVING option. When the

    GIVING option is specified the result of the arithmetic calculation is placed
    in

    t identifier specified immediately following the word GIVING. This

    isidentifier is not involved in the calculation. Examples showing the use of

    GIVING option will be shown following the description of each arithmetic

    statement.


    # SIZE ERROR Option


    If, after the decimal-point alignment, the value to be placed in the result field

    exceeds the largest value that field can hold a size error condition is said to

    exist. This applies only to the integer part of the answer and not to the decimal

    position since excess decimal places will be truncated. For example, if a result

    of 1269 is to be placed in a field with only three digits capacity then a size
    error

    condition exists for the calculation. Checking for a size error condition is only

    carried out on the final result of the calculation and is therefore done after

    rounding if the ROUNDED option has been specified.


    If a size error condition exists for a computation that did not specify the

    SIZE ERROR option the value of the result is unpredictable.

    If a size error condition exists and the SIZE ERROR option has been

    specified the statement following the SIZE ERROR option will be executed

    (following the completion of the arithmetic calculation). Note, however, that

    in this case the value of the result is again unpredictable.


    An attempt to divide by zero will always raise a size error condition.

    Examples of size error conditions appear in the following text.


    # The ADD Statement


    The ADD statement allows the programmer to sum two or more numeric

    fields and store the result. The result can be stored in one of the fields being

    summed or in another field.'
