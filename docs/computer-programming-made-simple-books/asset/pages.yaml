  md: '# 61

    Further Functions


    Most BASICS include a range of built-in functions additional to those described
    in Chapter 60. However, before considering some typical extra functions, a method
    for the programmer to define his own functions will be given.


    A user function is specified using the command DEF (short for define) and BASIC
    provides for 26 such functions named FNA, FBN, etc., through FNZ. For example,
    suppose you wish to define a function to convert an angular measurement in degrees
    to the equivalent in radians. The following function can be set up:


    ```

    124 DEF FNR(X) = 3.14159/180*X

    ```


    Then the following statement will convert the angle in degrees held in variable
    A to its equivalent value in radians:


    ```

    332 LET Q = FNR(A)

    ```


    In the definition of FNR (line 124 above) the variable X is called a dummy argument
    and is used only to indicate where a variable will go when the function is later
    evaluated. (The precise rules relating to function definitions vary from BASIC
    to BASIC and should always be checked before a program is written.)


    # More Intrinsic Functions


    Microsoft BASIC includes a comprehensive selection of intrinsic, or built in,
    functions. A few of the most useful of these are described below. Some BASICS
    have slightly different functions.


    ERL—returns the number of the line in which the last error occurred.


    INSTR(X$, Y$)—finds the first occurrence of string Y$ in string variable X$ and
    returns the position. For example, suppose the variable A$ contains the value
    ''XXXXXX''. The statement:


    ```

    212 LET C = INSTR(A$, "Y")

    ```


    will set variable C to the value 5. (If the string Y$ is not found the value of
    C will be zero.)


    LEFT$(X$, I)—returns the leftmost I characters of string variable X$.'
