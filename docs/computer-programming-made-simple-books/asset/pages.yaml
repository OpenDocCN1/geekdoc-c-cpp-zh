  md: '# 17

    The Data Division


    # Data Division—Organisation


    We have now learned some of the basic COBOL statements and can perform simple
    arithmetic statements without too much trouble. However, in the examples used
    in the foregoing chapters it has been assumed that the data to be operated upon
    have already existed in memory and that the data items manipulated did not require
    some form of definition to the compiler. Clearly this will not normally be the
    case in practice—the programmer will find it necessary to input some data to his
    program (via an input unit) and he will need to tell the compiler the way in which
    his fields and data items are structured. Some of the programmer''s data will
    be read in input units and will be defined within the program (constants). In
    addition to data read in or defined the programmer will often require memory space
    to be reserved for intermediate work areas. In the context of the Data Division,
    work areas and constant definition areas can be regarded as the same.


    +   A COBOL program may therefore process two types of data: information created
    externally on data files and information created internally during the execution
    of the program. The purpose of the Data Division is to give the descriptions of
    these two types of data to be processed by the program.


    # Organisation of External Data


    External data are held, as we have seen in Part One, on data files which can be
    input units or backing store units. A file is a collection of records which can
    be of two types—physical records and logical records. A physical record is a group
    of characters which is treated as a single unit when transferred to or from memory.
    For example the complete content of a punched card is a physical record.


    A logical record is a number of related data items (or a structure—see Chapter
    Nine). A logical record may also be a physical record in that each unit of data
    transferred to memory represents a logical. A logical record may also be one of
    several logical records contained within a physical record. Occasionally a logical
    record may be made up of more than one physical record.


    To avoid confusion in the following text physical records will be referred to
    as blocks and logical records simply as records. When more than one record'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# The Data Division 107


    occurs in a block the file is said to be blocked and the number of occurrences
    is called the blocking factor.


    File Blocking is illustrated below:


    | Blocks | Physical records |

    | --- | --- |

    | Single blocked records | Logical records |

    | Multi-blocked records (blocking factor = 3) | Logical records |


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_130_0.png)


    Statements are provided in COBOL for describing the relationship between blocks
    and records on a file. However, once this relationship is established the programmer
    need not concern himself with the physical structures of the file. A COBOL programmer
    only has access to the records on a file, the so-called unblocking (separating
    the logical records from the block) is done by the operating system and makes
    the job of file handling much simpler for the beginner.


    Fig. 35. Schematic of file blocking.


    # Description of External Data


    Before a file can be described in a COBOL program it is necessary to distinguish
    between the external description of the file and the internal contents of the
    file.


    The external description of a file refers to the way in which it is physically
    organised on the input or backing store unit. For example the number of records
    in each block indicates how the data is grouped on the file. These physical aspects
    are described in file-description entries (see below). Each record on a file will
    normally be in the form of a structure and the description of this structure (describing
    the type of data to be held in each field) represents the internal contents of
    the file. The details of each field in a particular type of record are given in
    a Record Description.


    # The DATA DIVISION


    The Data Division is divided into three sections which, when used, must appear
    in the correct order and be identified by their correct headers:


    FILE SECTION.

    WORKING-STORAGE SECTION.

    LINKAGE SECTION.


    The File Section is used to describe all data that is stored externally, to be
    processed by the program. Such data cannot be processed by a COBOL program unless
    it is described in a File Section entry. The File Section header is followed by
    one or more file descriptions. All data to be generated internally by the program
    is described in the Working-Storage Section. Single or noncontiguous items are
    described first, followed by record (or structure) descriptions.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# 108 Computer Programming


    Data to be passed between programs (see Chapter 39) is defined in the Linkage
    Section. Once again non-contiguous items are defined first followed by structure
    definitions.


    The layout of the Data Division will therefore be:


    ```

    DATA DIVISION.

    FILE SECTION.

    file description

    record description(s) ...

    WORKING-STORAGE SECTION.

    non-contiguous item definitions

    record (or structure) definitions

    LINKAGE SECTION.

    non-contiguous item definitions

    record (or structure) definitions

    ```


    Whenever a particular section is not required it may be omitted completely.


    # Data Division Entries


    Each entry in the Data Division is preceded by a level number (see below) except
    the file-description clause which is preceded by a level indicator. The description
    of a file is identified by the level indicator FD (File Description) which appears
    in Area A; the name of the file follows in Area B. Full details of file definitions
    are given in Chapters 18 and 19.


    # Level Numbers


    Level numbers are used to identify the እንደሚ within a record or structure for the
    purpose of data reference. Each level may be likened to a level of division in
    a structure hierarchy as described in Chapter 9. However, note that once a subdivision
    has been established there is no restriction on the programmer further subdividing
    the item to establish a more detailed reference.


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_131_0.png)


    (G = Group, E = Elementary item)


    Fig. 36. Relationship between group and elementary levels.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# The Data Division


    The lowest units within a structure, that those units which are not themselves
    subdivided, are called elementary items. Normally a record will consist of a sequence
    of elementary items, although if the record is not subdivided then the record
    itself is an elementary item. A set of elementary items may be combined to form
    a group item. A group item, which must be named to exist, consists of a sequence
    of elementary items; a number of groups may themselves be combined into a larger
    group. An elementary item may therefore belong to one or more groups. Level numbers
    and grouping are shown diagrammatically in Fig. 36.


    This structure could be defined within the program as shown below. (Note the descriptive
    details of the elementary items have been omitted for clarity.)


    +   01 GROUP1.

    02 GROUP2.

    03 GROUP4.

    04 ELEMENTARY4...

    04 ELEMENTARY5...

    03 ELEMENTARY1...

    02 GROUP3.

    03 ELEMENTARY2...

    03 ELEMENTARY3...


    Note how elementary item ELEMENT4 is a member of groups 4, 2, and 1. This system
    of level numbers indicates the relationship between different items and groups
    of items within a record. The level number 1 (always written as 01) is assigned
    to the highest group which will always be the complete record. Less inclusive
    items are assigned level numbers numerically higher (but not necessarily consecutive)
    than the group to which they belong up to a maximum of level number 49. A group
    is terminated when a level number equal to or higher than the group number is
    encountered.


    As a further example of level numbers used to define record structures, consider
    the data to be read in via punched cards with the following fields:


    | Account | Credit | Name | Street | Town |

    | no | limit | | | |


    Basically there are five fields on this card, however, the program to process
    this file may wish to access individual fields and groups of fields in the format
    shown:'
