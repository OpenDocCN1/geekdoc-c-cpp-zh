    When two numeric items are compared in this way the comparison is done on their
    algebraic value; e.g. the value 0037 is numerically equal to 37. However when
    alphanumeric or alphabetic items of unequal length are compared the shorter item
    is considered to be extended, to the right, with spaces. For example, consider
