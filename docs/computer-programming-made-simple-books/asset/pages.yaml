    Embedded PERFORM Statement

    A PERFORM statement contained within the range of another PERFORM statement is
    said to be embedded or nested. For example, the second PERFORM shown below is
    an embedded PERFORM:


    ```

    PERFORM MAIN-CALC.

    .

    .

    .

    MAIN-CALC. ADD 1 TO LOOP-COUNT.

    PERFORM SMALL-CALC.

    NEXT.

    ```


    The range of an embedded PERFORM statement must be either totally included or
    totally excluded from the range of the original PERFORM statement. In other words
    the exit point for the first PERFORM cannot be within the range of the second
    PERFORM. This is best illustrated by the two examples shown below:


    Totally excluded nested PERFORM:


    ```

    MAIN-PROC. PERFORM CALC-ROUTINE.

    .

