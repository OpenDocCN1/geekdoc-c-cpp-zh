  md: '# 306 Computer Programming


    Thus the following statement

    169 LET A = B*2 + C*3


    is equivalent to


    169 LET A = (B*2) + (C*3)


    and indeed brackets can be used like this to clarify an expression. Brackets can
    also be used to modify the evaluation of an expression because BASIC evaluates
    expressions in brackets first. If brackets ''nested'' then evaluation begins with
    the innermost pair and works outwards.


    Brackets should be used whenever there is a doubt about the likely sequence of
    evaluation. For example, the expression D/E/F could be interpreted as (D/E)/F
    or D/(E/F) by different compilers. Similarly M↑R↑S is ambiguous and could be interpreted
    as (M↑R)↑ or M↑(R↑S)


    The following example illustrates the use and without brackets.


    Example: The monthly repayment of a mortgage loan of £A at an interest rate of
    I% for Y years can be calculated from the formula:


    ```

    M = AP (1 + P)^Y / 12 ((1 + P)^Y - 1) where P = I / 100

    ```


    The BASIC routine to calculate M is as follows:


    ```

    292 LET P = I/100

    295 LET M = A*(1 + P)↑Y/(12*((1 + P)↑Y-1))

    ```


    Note that it is not possible to use implied multiplication; P(1 + P) is illegal—it
    is mandatory to write P*(1 + P) and so on. It is not permitted to put two operators
    (+—*I) together; brackets can be used to overcome this problem:


    ```

    944 LET Z = 3↑(-3)

    ```


    This statement will calculate the value of 3.


