    # The EXIT Statement


    The EXIT statement provides a common exit point or end point for a series of procedures.


    | Format |

    | paragraph-name, EXIT. |


    When a series of procedures is executed by a PERFORM statement it is sometimes
    necessary to transfer control to the end point from within the group of procedures.
    In other words it is necessary to terminate the PERFORM from several points within
    the group being performed.


    Example


    ```

    MAIN-CAL.  PERFORM RATE THRU RATE-EXIT.

    ```'
