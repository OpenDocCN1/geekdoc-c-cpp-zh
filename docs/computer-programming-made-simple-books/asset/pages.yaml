    02 AMENDMENTS OCCURS 10.

    03 FIELD-NO PICTURE 99.

    03 CHANGE PICTURE XXXX.


    Note that the OCCURS clause is written at the group level—this effect defines
    ten groups containing two elementary items (FIELD-NO and CHANGE). It is not possible
