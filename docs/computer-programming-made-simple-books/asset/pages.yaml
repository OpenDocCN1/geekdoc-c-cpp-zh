  md: '# 35


    # Processing Print Files


    The printing of reports is an important facet of computer programming since it
    is only by the production of printed matter that programs can communicate with
    human beings. Because the majority of printed reports will be read by non-technical
    personnel a number of features are provided within the COBOL language to improve
    the readability of such reports. These facilities—editing, line, and page skipping—have
    already been described in detail. However, the purpose of this chapter is to expand
    the knowledge of these features in terms of their use in commercial programs.


    We will look, therefore, at some of the requirements of computer programs which
    produce reports on plain (or standard) stationery and those which produce reports
    on pre-printed stationery.


    # Printing on Plain Stationery


    Reports which are output on to plain stationery are usually confined to those
    which have no circulation outside the computer department or certainly which have
    no circulation outside the computer running the computer. For instance a program
    concerned with payroll might produce an analysis of wage costs for each department
    within a works; this report would be circulated only among the management of the
    company and would not therefore require specially prepared stationery.


    As already mentioned each page of standard stationery can accommodate 64 lines
    of printing although a gap of a few lines is normally flat at the bottom of each
    page. The number of characters that can be printed across one line depends on
    the particular computer in use although it is unlikely to be less than, the popular,
    size of 132 characters.


    The statements required to output a line to a printer device have been described
    in detail (Chapter 32) and do not need to be expanded. However, when dealing with
    standard stationery it is obviously necessary for the program to produce any heading
    information at the top of each page. The normal way of achieving consistent heading
    information is to print each line of text by PERFORMing a print-output. This paragraph
    will output a line to the printer and add 1 (or 2 depending on the line spacing
    used) to a line-count, once this line-count equals a specified value (selected
    as the maximum number of lines required per page) then the routine to advance
    the page to the next page and the headings can be performed. Note that this heading
    routine will reset the line-count to its initial value in order that the'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# 192 Computer Programming


    next page will be correctly spaced. In its simplest form these two routines (line

    print and heading print) could look like this:


    PRINT-LINE. WRITE PRINT-DETAIL AFTER ADVANCING 1

    LINES.


    ADD 1 TO LINE-COUNT.


    IF LINE-COUNT = 58 PERFORM HEADINGS.


    HEADINGS. WRITE PRINT-DETAIL FROM HEAD-1 AFTER

    ADVANCING SKIP LINES.


    WRITE PRINT-DETAIL FROM HEAD-2 AFTER ADVANCING

    2 LINES.


    MOVE ZERO TO LINE-COUNT.


    There are a number of drawbacks to this basic routine: (a) each detail line can

    only be printed on the line immediately following the previous line; (b) the first

    detail line will immediately follow the second heading line; (c) the WRITE

    used three times (for reasons beyond the scope of this book this can be

    inefficient. A more versatile method is shown below. In this routine the

    number of lines to be spaced prior to printing a line is selected before the

