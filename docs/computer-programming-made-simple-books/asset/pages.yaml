  md: '# 53


    # Arrays


    An array, or matrix as its mathematical equivalent is known, is a set of identical
    fields arranged, conceptually, in a row. An element can be considered as the computer''s
    set of pigeon-holes. Each hole, or element, has the same attributes (the method
    of referring to individual elements is discussed below). An array can be used
    to hold a table of information—e.g. a set of parameters—or a series of similar
    results. These uses will become clearer when the examples following are studied.


    The arrays required in a FORTRAN program are defined using the DIMENSION statement.
    This statement specifies the name of the array and the number of elements it is
    to contain. Any number of DIMENSION statements, each of which can define several
    arrays, can appear in your program; however, they must appear before any other
    statements used (except a TYPE statement). To define an array a programmer will
    write the DIMENSION followed by the array name which is itself followed by the
    number of elements to be contained within the array in parentheses. For example,
    to define a twelve-element array called MONTH:


    DIMENSION MONTH(12)


    More than one array may be defined in a single statement:


    DIMENSION DAY(7), WEEK(4), MONTH(12)


    A Twelve-element array consists of 12 identical variables with the same name.
    The type of these variables is specified in the same manner as for non-array variables:


    DIMENSION A(4), K(7), R(6)

    DOUBLE PRECISION R


    The array A consists of 4 real variables, the array K of 7 integer variables,
    and the array R of 6 double precision variables. The initial value of each element
    of an array is zero (except a logical array for which each element has the initial
    value .FALSE.). Any variable name used in a DIMENSION statement may not appear
    in any other DIMENSION statement and can refer only to the array so defined.


    The array TOTAL defined thus:


    DIMENSION TOTAL(4)'
