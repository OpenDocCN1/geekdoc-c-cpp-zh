  md: '# 55

    Backing Store Handling


    The commands described in this chapter enable you to input data from

    output data to a backing store device (normally a magnetic disc). In a non-

    time-sharing environment these statements can also be used in lieu of INPUT

    and PRINT to input data from punched cards (or paper tape) and output data

    to a printer file respectively.


    # File Layout


    It is not necessary to define record or block layouts when reading or writing

    FORTRAN files. The blocking and deblocking is done by coding

    automatically generated by the FORTRAN compiler and each input or

    output statement will specify the layout required in a given record. Note that
    it

    is possible to generate different record layouts with different output

    statements; however, the input statement must specify (before reading

    t data) the expected layout it is recommended that a single layout only be be

    used on any given file.


    # Outputting Data


    Data is written to files by means of the WRITE statement. The WRITE

    statement consists of the word WRITE followed by the name of the file to be

    written to (in parentheses), followed by the names of the variables to be

    written. For example, to transfer the values of the variables R, S, and T to the

    file called OUTLIST the following could be coded:


    ```

    WRITE (“OUTLIST”) R, S, T

    ```


    The three values will be written as a single record to the named file (reading
    the

    data back into a program is discussed below), although the programmer does

    not have to state this within his program. A single variable may be so

    written:


    ```

    WRITE (“OUTFILE”) A

    ```


    ```

    WRITE (“FILE2”) A, R, Q, X, Z, Y, P, D, F, G, H

    ```


    In each case the variable(s) specified in the WRITE statement are grouped into

    a single record. (Note—the blocking factors are automatically determined by

    the compiler.)'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# Backing Store Handling 279


    The name of the file to which data is to be written may be specified by a file-name
    variable, enabling a single WRITE statement to transfer data to more than one
    file during execution of a program:


    ```

    FILENAME F

    INTEGER S

    .

    .

    .

    s = 1

    F = "FILE1"

    GO TO 10

    12 ...

    .

    .

    .

    S = 2

    F = "FILE2"

    GO TO 10

    14 ...

    .

    .

    .

    s = 3

    F = "FILE3"

    GO TO 10

    16 ...

    .

    .

    10 WRITE (F) A, B, C

    GO TO (12, 14, 16) S

    ```


    The records written to the different files will all have the same layout—being
    made up of the three variables A, B, and C.


    # Inputting Data


    Data is inputted, from backing store files, by means of the READ statement. This
    is similar to the WRITE statement except that within the parentheses must be specified
    an end condition. You will recall from Part One that the end of data on an input
    file is indicated by a special record; the program must detect this condition
    since any attempt to read beyond the marker will'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# 280 Computer Programming


    an error condition. The end-of-file condition is tested by means of

    the expression


    ```

    END = nn

    ```


    where nn specifies the line number to which control is to be passed when the

    condition occurs. The statement to input the three variables written in the first

    WRITE statement above could be coded as:


    ```

    READ ("OUTLIST", END = 27) R, S, T

    ```


    In this case the three variable names specified are identical to the ones used
    in

    the WRITE statement. Since the READ and WRITE statements are likely to

    in be different programs the names need not be the same in each case;

    however they must specify variables of the same type. The above READ

    statement could be replaced by


    ```

    READ ("OUTLIST", END = 27) A, B, C

    ```


    In this case variable A must be of the same type as variable R in the file writing

    program. Similarly for S and B and T and C.


    # Arrays and Files


    An array may be written to (and subsequently read from) a file by using the

    appropriate statement within a DO loop:


    ```

    DIMENSION A(10)

    ```


    ```

    DO 10 K = 1, 10

    10 WRITE ("FILE1") A(K)

    ```


    Using this method each element of the array will be the subject of a separate

    WRITE statement and will therefore occupy a separate record. With large

    arrays will clearly be wasteful of file space (remember inter-block gaps).

    an alternative could be found for small arrays thus:


    ```

    WRITE ("FILE2") B(1), B(2), B(3), B(4)

    ```


    but this is clearly unsuitable for large arrays. Instead an implied DO facility

    isprovided within the READ and WRITE statements. This is illustrated by the

    following example:


    ```

    WRITE ("FILE1") (A(K), K = 1, 10)

    ```


    The array to output the file is specified as the array name with a variable

    subscript together with the initial, terminal, and increment values required for

    the subscript. (Note—in the example the increment is assumed to be L.)

    is WRITE statement will cause the ten elements of the array to be written as

    single record. This will save file space and reduce the time required for

    the operation (i.e. one record of ten elements takes less time to write than ten'
