  md: '# 58

    Introduction


    The text that follows the assumption is made that BASIC is being run via some
    form of interactive terminal device. The terminal may be of the visual display
    or printer-keyboard variety. In either case the programmer is in direct contact
    with the BASIC compiler in the computer and can interact with it. The programming
    may be for a time-sharing computer system or a stand-alone microcomputer.

    BASIC can usually be run in either the direct or the indirect mode. In the **direct
    mode** the BASIC compiler will evaluate and execute each statement as it is typed
    (the end of each line or statement being signified by carriage-return). This facility
    can turn BASIC into a calculator to provide immediate computation. For example,
    if the programmer typed

    PRINT (37*2) + (84/21)

    the computer would respond immediately with


    (Don''t worry for the moment about the mechanism of formatting this particular
    statement.)

    In the **indirect mode** the programmer types in all his program statements and
    then requests BASIC to run the complete program. All program examples following
    will be in the indirect mode.


    # Instruction Format


    The fundamental unit of the BASIC program is the line. A line consists of three
    parts—the **line number**, the **BASIC statement** and an **optional comment**:

    nnnn **remark** indicate that it is optional.

    The line number may consist of two, three, four or five digits depending on the
    size of the program. The program will be executed in the order of the line numbers.
    This is a most important point that cannot be overstressed. Suppose a program
    was typed thus (don''t worry about the statements at the moment):


    ```

    300 PRINT A

    200 LET A=P*2

    100 INPUT P.

    ```'
