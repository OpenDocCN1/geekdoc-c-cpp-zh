  md: '# Table Handling 201


    2. Condition-1 is evaluated and if false the specified procedure(s) is executed
    (i.e. performed) once.


    3. The value of identifier-1 is incremented by the value of identifier-3 (or literal-3)
    (the increment) and condition-1 is re-evaluated. (N.B. the value of identifier-1
    may be decremented if identifier-3 (or literal-3) is specified as negative).


    4. Steps 2 and 3 are repeated, as necessary, until condition-1 is true. When this
    condition is true control is passed to the statement following the PERFORM. Note
    that if the condition is true prior to the first time the PERFORM is executed
    then the procedure(s) specified is not executed.


    This sequence of operations is further illustrated by the following flowchart:


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_232_0.png)


    Fig. 43. Sequence of events when PERFORM VARYING is executed.'
