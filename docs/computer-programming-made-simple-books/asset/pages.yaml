  md: '# # Part 5:

    The Microprocessor Explained


    A microprocessor is just another integrated circuit, albeit a complicated one.
    On its own a microprocessor is not very useful; it must be integrated into a complete
    system in order to function.


    This opening paragraph is the expert''s view of the microprocessor but in everyday
    use the term microprocessor has come to mean small computer. Small enough (and
    cheap enough of course) to be used in home, in school or in the small one- or
    two-man business. (Note that it is the ''expert''s microprocessor explained above
    that is used increasingly in washing machines and so on.)


    This confusion over terms can be readily prevented by comparing it with an earlier
    misuse of technical terms. In everyday use a transistor is a small, often battery
    operated, radio that happens to contain, amongst other things, transistors. To
    the technician a transistor is a small electronic switch about the size of a match-head;
    to the layman it is a functioning radio receiver.


    To avoid a similar confusion—at least in this book—between microprocessor (tiny
    integrated circuit) and microprocessor (small computer) the latter will be referred
    to as a home computer.


    # ## Home Computer


    It is important to realise the home computer is built along the same lines as
    the huge mainframe machines costing millions of pounds. The theory of operation
    is the same. Two things are different (apart from the cost).


    First, the home computer is on a much smaller scale. It is not physically smaller
    but it operates more slowly, it can store fewer items of data and it can execute
    smaller programs. Secondly, the home computer is used differently. It is often
    an adult toy (in the widest sense of the word) and is seldom purchased for any
    of the normal commercial (i.e. cost-saving) reasons.


    This second point is, in the author''s view, the most important one in respect
    of home computing and is often missed by other writers on the subject. The home
    computer user wants to enjoy his ''toy''. This means that he wants to know how
    to use it without bothering too much what it does it. This can perhaps be made
    clearer with an analogy.


    A person training to be a garage mechanic or a racing driver needs to know intimately
    the theory and practice of the motorcar. He needs to know every aspect of engines,
    gearboxes, suspension and so on. He must not only'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'understand the theory yet be able to dismantle, repair and rebuild each part.
    The average driver, on the other hand, interested in driving to work each day
    and making the odd pleasure trip to the country, has a different requirement.
    He might like to know which bits are which and he needs to know and understand
    the car controls and how to drive the car.


    Similarly the computer professional will need a detailed knowledge of the theory
    and the mechanics of the computer machine. The home-computer user only needs to
    know how to drive it. In this part of the book the basic building blocks of the
    home computer are explained. The languages for programming computers are explained
    in other parts. This does not of course preclude the home computer user from being
    or becoming an electronic expert and building his system from scratch. Such detail
    is, however, beyond the scope of this work.'
  merge: -1
  pgno: 365
