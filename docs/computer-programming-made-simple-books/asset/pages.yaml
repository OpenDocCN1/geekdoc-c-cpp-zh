    A subscript may, in addition to being specified as an integer value,

    specified as a data name—the value of the data item each the statement is

    executed used as the subscript. The use of so-called variable

    subscripts is a subject in itself and is discussed in detail in Chapter 37.


    # Redefinition


    It is sometimes necessary for a field of data to be given different formats at

    different times during the execution of a program. For example, a 4 character

    field might contain the characters 2179 which at one point in the program are

    to be treated as a number of pence. The definition for the field would then be:


    77 PENCE PICTURE 9999.


    However, later in the program the same value might require to be treated as

    £21.79 which course would require the decimal points (assumed in PENCE)


    77 POUNDS PENCE 99V99.


    It is not possible simply to move the value in PENCE to the value in POUNDS

    since automatic alignment of the decimal points (assumed in PENCE) would

    result in POUNDS having a value of 79.00. The problem is overcome by using

    t REDEFINES clause.


    # The Redefines Clause


    This clause is used to permit the same storage area to contain different data

    items or to provide different descriptions for the same item.


    | Format |

    | level number data-name-1 REDEFINES data-name-2 |


    The level numbers of data names and the data-name-2 must be the same (and

    cannot be level 88). Data-name-2 refers to the previous data-item description

    entry and data-name-1 is an alternative name for this area.

    Example: Take the case above:


    77 PENCE PICTURE 9999.'
