  md: '# 26


    # The Procedure Division


    Organisation


    The Procedure Division is used to specify the set of instructions which the programmer
    wishes to use to solve a given data-processing problem. These instructions are
    specified by the use of COBOL statements, which, may at the discretion of the
    programmer, be combined to form sentences. The programmer may combine sentences,
    paragraphs and paragraphs to form sections.


    The Procedure Division is identified by the header:


    # PROCEDURE DIVISION.


    which must appear in Area A and must immediately follow the last entry in the
    Data Division. Following this header the programmer will code his instructions
    consisting of statements, sentences, paragraphs, and sections at his discretion.
    These instructions must each a valid combination of words and symbols and each
    begin with a COBOL verb; additionally the programmer will attempt to ensure that
    his set of instructions is logically correct (i.e. will solve the problem to hand)
    although the compiler cannot check this aspect of the program.


    The statement is the basic unit of the Procedure Division and will contain one
    instruction specified by a combination of COBOL words and programmer-defined words.
    The following are examples of statements:


    ```

    ADD 1 TO ERROR-COUNT

    MULTIPLY RATE BY BONUS GIVING GRO

    PERFORM PRINT-ROUTINE

    ```


    The three types of statements are discussed optionally below:


    A sentence is a combination of one or more statements optionally separated by
    semi-colons. Each sentence must be terminated by a period which must itself be
    followed by at least one space. Examples of sentences are:


    ```

    ADD 1 TO CARD-COUNT.

    ADD 1 TO LOOP: MULTIPLY RATE BY 2; PERFORM BONUS.

    PERFORM PRINT-ROUTINE; PERFORM HEAD-ROUTINE.

    ```


    Although there is no limit to the number of statements making up a sentence it
    is good practice to limit this; preferably to one statement per sentence line.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# The Procedure Division 151


    If this is done then effort is involved in replacing or correcting individual
    statements at the testing stage.


    A paragraph is a combination of one or more sentences usually related by the procedure
    they are to compute (for example paragraphs could be formed to calculate gross
    pay, print pay-slips, read input files, and so on). Each paragraph must begin
    with a paragraph name (which is followed by a period) which appears in Area A.
    A paragraph is terminated by the occurrence of another paragraph name or a section
    name.


    Examples of paragraphs and paragraph names appear below:


    ```

    COMPUTE-PAY.

    ADD BONUS TO BASIC GIVING GROSS.

    PERFORM TAX-CALCULATION; ADD 1 TO COUNT-3.

    SUBTRACT TAX FROM GROSS NET.

    SALES-ANALYSIS. MULTIPLY NO-SALESMEN BY TARGET.

    DIVIDE TARGET BY 52 GIVING AVERAGE.

    PERFORM PRINT-ROUTINE.

    END-OF-RUN.

    ```


    Notice that statements may appear on the same line as a paragraph name if desired.
    The last paragraph (END-OF-RUN) in the example above is terminated by the physical
    end of the program.


    A section is composed of one or more paragraphs preceded by the section name.
    The section name is formed from a word identifying the use of the section followed
    by the word SECTION:


    ```

    FIRST SECTION.

    PARAGRAPH-I.

    PARAGRAPH-N.

    SECOND SECTION.

    PARAGRAPH-2.

    PARAGRAPH-2N.

    ```


    # Statement Types


    The COBOL statements are classified into three types—conditional statements, imperative
    statements, and compiler-directing statements.


    # Conditional Statements


    Conditional statements are those which can alter the flow of the program depending
    upon the state of a condition. At execution time the specified condition (see
    Chapter 27) is tested and depending upon its state, alternate program paths be
    selected.


    Certain conditional statements (ADD ... ON SIZE ERROR ...) have already been described
    and the remainder follow later in Part 2. However, a complete list is presented
    here for reference:


    Note. If the options in parentheses above are not used then the particular statement
    is no longer a conditional statement. The IF verb always produces a conditional
    statement.'
