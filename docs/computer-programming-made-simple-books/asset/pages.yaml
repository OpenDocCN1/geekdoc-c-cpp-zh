  md: '# 64

    Program Control


    This chapter looks at some of the ways in which you can change the normal flow
    of instructions in your program. Without any program control instructions execution
    will be in ascending sequence of line number. Program control instructions allow
    you to change this sequence either unconditionally (the change always takes place)
    or conditionally (the change only takes place if a particular condition is met).


    # The GO TO Statement


    Unconditional program changes are made with the GO TO statement which instructs
    the program to go immediately to a specified line number:


    ```

    142 GO TO 246

    ```


    When line number 142 is reached the program moves or jumps to line 246, which
    will be the next statement executed. The following small program illustrates the
    use of GO TO (which may also be written GOTO) to create a continuous loop:


    ```

    122 PRINT "INPUT THE RADIUS

    124 INPUT RAD

    126 PRINT "AREA IS; RAD ↑ 2*3.142

    128 GO TO 122

    ```


    The program will repeatedly request a value for a radius of a circle, then compute
    and print out the area of the circle. To stop program execution the terminal ''break''
    key (or equivalent) should be pressed.


    # The IF THEN Statement


    This is used to change the flow of program control only if a specified condition
    is met. This is best illustrated with a simple example:


    ```

    282 IF R = S THEN 288

    ```


    This statement says: if the value of R is equal to the value of S then transfer
    control to line 288, otherwise continue with the next sequential line number.
    The general form of the statement is:


    ```

    IF condition THEN line number

    ```'
  merge: -1
  pgno: 350
- img_proc: true
  md: 'where condition is a combination of numbers or expressions and a conditional
    operator:


    +   = equals

    > greater than

    < is less than

    >= is greater than equal to

    <= is less than equal to

    <> is not equal


    Some examples:


    +   216 IF CODE = 29 THEN 218

    217 IF RATE >= R*2 THEN 226

    218 IF A <> B THEN 224

    220 IF SQR(A+ B) > .35 THEN 226

    222 IF 10 > A*2.5 THEN 226


    The examples given so far relate to numeric variables or expressions. String expressions
    can be used only with the conditional operators = (equals) and <> (not equals):


    +   214 ANSWERS = "YES" THEN 226

    226 IF R$ = S THEN 234


    Using the IF statement the earlier sample program to calculate areas can be improved.
    Now the coding will loop until a zero is entered:


    +   122 PRINT "INPUT THE RADIUS"

    124 INPUT RAD

    126 RAD <> Ø THEN 128

    127 STOP

    128 PRINT "AREA IS"; RAD ↑ 2*3.142

    129 GO TO 122


    Note the use of the STOP statement in line 127. This has the effect of reverting
    control to the system, having terminated program execution.


    Extensions to the IF THEN Statement

    Microsoft BASIC includes some additional forms of the IF THEN statement to provide
    for more complex tests.


    IF CONDITION line number ELSE line number


    For example, the following statement will transfer control to statement 214 if
    A and B are equal and to to statement 464 otherwise:


    112 IF A = B THEN 214 ELSE 464


    A further extension is to allow BASIC statements instead of line numbers:


    414 IF RATE = LIMIT THEN PRINT "EQUAL",


    or even


    414 IF A = B THEN PRINT "EQUAL" ELSE PRINT "NOT EQUAL


    or'
