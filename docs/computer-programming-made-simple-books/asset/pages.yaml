  md: '# 1 Introduction


    The popular conception of a computer sees it as a a most complicated electronic
    machine performing incredibly complex calculations at incomprehensible speeds
    to the accompaniment of hundreds of flashing light bulbs. Any attempt to elicit
    information as to the workings of a computer from a programmer will produce a
    stream of technical jargon interspaced with amazing statistics chosen to fill
    the questioner with awe and admiration.


    The popular press and radio and television have done little to curb the mystique
    surrounding the operation of computers, with their emphasis on the spectacular
    or exciting applications to which computers are being applied. Presumably news
    editors consider their readership figures are more likely to be improved with
    stories of computers playing chess, composing music, or sending gas bills for
    thousands of pounds rather than if they filled the pages with explanations of
    the real benefit society is getting from these machines. Some popular media would
    have believe that computers are giant electronic brains monitoring our every move
    in preparation for the day they take over all our decision-making and many of
    our thought processes.


    The people who work with computers, the programmers, analysts, and operators who
    seem to live by rules of their own and leave their environment, tend to be very
    critical towards the stories of electronic brains. This attitude will appear hardly
    surprising when one eventually learns that the computer is basically a very simple
    device and is as far from an electronic brain as a bicycle is from a spaceship.
    Programmers in particular are the most aware that computers are no substitute
    for the human brain; in fact the preparation of work to be run on a computer can
    be one of the mind-bending exercises encountered in everyday life. No doubt in
    time, as the computer becomes more a daily fact of life, the individualistic computer
    experts will emerge from their shells to enroll us in all the workings of their
    interesting machines. Perhaps when the world at large discovers the truth about
    computers they will recoil at the disillusionment although I hope this will not
    be the case. Indeed the man credited with the invention of the computer—Charles
    Babbage—received as part of a letter about his ''Analytical Engine'' the following
    advice:


    It is desirable to guard against the possibility of exaggerated ideas that might
    arise as from the powers of the Analytical Engine. In considering any new subject,
    there is frequently a tendency, to overrate what we find to be already interesting
    or remarkable; and secondly, by a sort of natural'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Computer Programming


    reaction, to undervalue the true state of the case when we discover that our notions
    have surpassed those that were really tenable. The analytical engine has no pretensions
    whatever to originate anything. It can do whatever we know how to order it to
    perform.


    Considering that it was written more than 100 years ago the last sentence in that
    letter is remarkably profound and provides the key to the whole problem of computers.
    If a computer user does not know the method required to perform a calculation
    or process then he cannot instruct the computer to solve that calculation. It
    is most important to appreciate, at this stage, that a computer cannot tell its
    how to solve a problem but can only perform those calculations which it has been
    instructed to do. The computer is just a tool (albeit a very powerful tool) and,
    with any tool, the benefits gained from it depend upon the skill and experience
    of the people who direct and control the uses to it is.


    The reader with little or no previous knowledge of computing may perhaps feel
    a little cheated at this point—the prospect of controlling a vast electric brain
    has gone forever and with perhaps the desire to learn more about computer programming.
    The effectiveness of the computers and the potential benefit to society lies,
    not in their capacity or ability, but in their versatility and speed. It is the
    ability to relate everyday problems to the language of computers and the ability
    to harness the computer''s speed is the challenge of computer programming. The
    computer is a simple machine, some electronic and some mechanical, whose activities
    are co-ordinated by a central control unit. These machines, when working together,
    are able to perform arithmetic and simple logical processes as comparing two numbers.
    They can also read in information, store this information for later use, and issue
    results in a form understandable by human operators.


    The versatility of the computer lies in the fact that the way in which the central
    control unit controls the activities of the other machines can be changed as often
    as required. The specific activities to be carried out for one job are given to
    the computer in the form of a program. This consists of a series of instructions
    which tell the computer every step it is required to take in order to perform
    the calculations required of it. The purpose of this book is to give the reader
    the knowledge required to write computer programs. In order to do this we must
    understand more than just the language of programming. Part I provides an introduction
    to the structure of computer systems, an outline of the available machines that
    can be attached to the central control unit (these are called peripheral units),
    and a detailed explanation of the methods used to analyze a problem before writing
    a program to solve that problem.


    Once the programmer has analysed the problem to be programmed he must decide which
    programming language is the best to use for the particular problem. A program
    to solve a problem (such as calculating payroll, or maintaining a sales ledger)
    would be written in COBOL (an acronym of Common Business Oriented Language) which
    is described in detail in Part 2. The solution to a more mathematical problem
    (such as working out the lengths of suspended cables) would be written in FORTRAN
    (from Formula Translation) which is explained in Part 3. The reader who has not
