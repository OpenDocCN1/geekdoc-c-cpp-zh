- img_proc: true
  md: '# 220 Computer Programming


    ```

    RECORDING MODE IS F,

    LABEL RECORDS ARE STANDARD,

    DATA RECORD IS OUT-AREA.

    01 OUT-AREA.

    02 ACCOUNT-NO PICTURE 9(6).

    02 NAME PICTURE X(20).

    02 DETAILS OCCURS 10 PICTURE 9(5).

    SD SORTER,

    RECORDING MODE IS F,

    LABEL RECORDS ARE OMITTED,

    DATA RECORD IS SORT-AREA.

    01 SORT-AREA.

    02 KEY-FIELD PICTURE 9(6).

    02 FILLER PICTURE X(70).

    ```


    The input file records will not be individually accessed (since the data is not
    required until it has been sorted) and the record description does not need to
    be detailed. The output file will be used later in the program (after it has been
    sorted) as input and therefore, to have its record-description entry given in
    full. The sort file will only need the key-fields (i.e. those fields of which
    the file is to be sequenced) to be; in this case the file is to be sorted on the
    single field ACCOUNT-NO, and as can be seen, the description of KEY-FIELD in the
    sort file record description corresponds with this item.

    The sort operation is requested in the Procedure Division by means of the SORT
    statement:


    | Format |

    | SORT file-name-1 ON { DESCENDING ASCENDING } KEY {data-name-1} ... |

    | [ON] { DESCENDING ASCENDING } KEY {data-name-2} ... ] ... |

    | USING file-name-2 GIVING file-name-3 |


    A sort operation can be requested on one or more fields although the examples
    which follow only one key-field will be used for simplicity. The sort can be either
    ASCENDING in case the lowest value key-field will be first (on the output file)
    with the remainder in ascending order or DESCENDING in which case the highest
    value key-field will be first with the remainder in descending order.

    The USING option specifies the input file (i.e. the file which is to sorted) and
    the GIVING option specifies the output file (i.e. the file on which the sorted
    input file is to be written.'
  merge: -1
