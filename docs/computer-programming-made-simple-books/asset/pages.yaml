  md: '# Computer Programming


    Condition Names

    This is the name given to a specific value or range of values that a particular
    data item may contain. For example, in the last example the data item STAFF-GRADE
    might have three possible values: W for weekly staff, M for monthly staff, and
    T for temporary staff. It is possible to allocate condition names to these values
    (Chapter 27) such that for example the value M in STAFF-GRADE would have the name
    MONTHLY. This enables more meaningful statements to be coded:


    IF STAFF-GRADE IS WEEKLY MOVE CLOCK-NUMBER TO

    CLOCK-PRINT.


    Condition names must be formed according to the same rules as data names.


    Procedure Names

    A paragraph in the Procedure Division may be given a name in order that the paragraph
    may be referred to another part of a program. A paragraph name may consist of
    numeric characters only. Examples of paragraph names:


    ```

    COMPUTE-GROSS-PAY.

    PRINT-PAYSLIP.

    READ-INPUT-FILE.

    CALCULATE

    212.

    ```


    Note that these names refer only to the paragraph following, they do not themselves
    change. perform the functions they describe.


    Constants

    A constant is a predetermined unit of data, the value of which is not expected
    to change value is made up of the characters composing literal. Constants can
    be literal or figurative.


    Literal Constants

    A literal constant (usually known simply as a literal) is a string of characters
    whose value is made up of the characters composing literal. A literal is either
    numeric or non-numeric. A numeric literal is a string of characters made up of
    the digits 0-9, optionally a plus or minus sign and a decimal point. A numeric
    literal can consist of 1 to 18 characters only one of which may be a sign. If
    the literal does not have a sign character it is assumed to be positive. A numeric
    literal may contain only one decimal point which may appear anywhere except the
    right-hand end. A without a decimal point is assumed to be a whole number. Note
    that the decimal point in a numeric literal is only assumed and not actually occupy
    any storage space. Numeric literals are usually used in arithmetic calculations.
    Some examples are shown below:


    ```

    327

    +21934

    -7

    -70.34279

    1.34

    ```'
