  md: '# 264 Computer Programming


    factorial of a given number (note—factorial N, expressed as N!, is equal to I×2×3×4...(N-1)×N).
    The following coding will calculate the factorial of the number in I, prior to
    entering the loop, leaving the solution in K.


    ```

    A = I

