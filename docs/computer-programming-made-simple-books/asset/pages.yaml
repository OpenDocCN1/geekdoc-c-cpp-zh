    # Order of Evaluation


    Consider now more complex expression. Suppose you wish to calculate the surface
    area of a rod of length L and diameter D (Fig. 48). This is equal to:


    2*3.14*D ↑ 2/4 + 3.14*D*L


    In working out you would need to evaluate the component parts of the expression
    in the correct manner. For instance, you would clearly not begin by working out
    4 + 3.14 = 7.14, nor would you do 2/4 = 0.5, then 0.5 + 3.14 = 3.64.


    Conventionally and to mirror the problem—you would firstly evaluate the exponentiation
    function D ↑ 2. Then you would do the multiplications, then the divisions and
    finally the additions and subtractions. Thus the order in which operators are
    handled is:


    | ↑ | exponentiation |

    | * / | multiplication and division |

    | +- | addition and subtraction |'
