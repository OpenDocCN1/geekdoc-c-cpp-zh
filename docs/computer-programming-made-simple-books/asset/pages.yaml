    | 3 | 279498 |

    | 4 | 456840 |

    | 5 | 364128 |

    | 6 | 667842 |

    | 7 | 372231 |

    | 8 | 123456 |


    Then the sequence after the SORT statement had been executed would be:


    | Record No. | Value of Account-No. |

    | 1 | 123456 |

    | 2 | 278491 |

    | 3 | 279498 |

    | 4 | 279499 |'
