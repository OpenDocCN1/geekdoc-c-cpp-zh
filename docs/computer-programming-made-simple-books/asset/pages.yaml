  md: '# 69


    # The Bus System


    A home computer, as we have already determined, consists of a number of separate
    integrated circuits. In order that data and instructions can be passed as required
    each integrated circuit or chip needs to be connected to every other one in the
    system.


    Fig. 57 shows that six such connections are required for four chips whereas for
    just two more chips a total of 15 connections is required. As the number of chips
    increases the required total of interconnections rises. The simplest home computer
    can contain 20 chips for which no than 190 interconnections are needed.


    Each of these interconnections needs to carry each of the eight bits of the computer
    word on a separate connection. The above figures must be multiplied by 8 to arrive
    at the total number of interconnections. Clearly this method would impose severe
    practical limitations very quickly. An alternative method of interconnection is
    required. The bus system involves all chips being connected in parallel rather
    than directly to each other. Consider an 8-bit ''highway'' running round the chips;
    each chip connected via eight bits to this highway or bus. Fig. 58 shows such
    a method of interconnecting four chips and all bits together. This bus but usually
    the data is only intended for one other chip. So how does this chip know that
    a particular item of data is for it? The chips connected to a second bus for addressing
    as in Fig. 60.


    A chip will now accept data from the bus only when it is addressed via the address
    bus. In practice a control bus of only one or two bits may also be added to prevent
    data acquisition when the bus is changing.

    The bus system overcomes the problem of interconnection between a large number
    of chips but it has another attribute of great benefit to the home computer user.
    Additional chips can be added to the bus at any time. So, for example, home computer
    printed circuit boards invariably have spare integrated circuits for the addition
    of additional RAM or PROM as the user needs (can afford).

    The individual bits of a computer word travel in parallel on a bus. The receiving
    chip accepts all bits together. This form of distribution—called parallel transmission—is
    always used within a computer but is not suitable for some peripheral devices.
    A slower printer, for example, will only accept a single bit at a time. The individual
    bits of a character travel one behind the other. This is known as serial transmission.'
