  md: '# The Home Computer I/O System


    Mainframe computer systems have multiple input/output systems but home computers
    are often lacking in this area. This is largely because of the relatively high
    cost of such things as printers.


    Input

    The simplest and indeed the most popular home computer input mechanism is the
    keyboard. Early systems used a very simple keyboard—which may even have consisted
    of toggle switches rather than keys—with only 16 keys. These represented the hexadecimal
    digits 0-9 and A-F (for a discussion on the hexadecimal system see Chapter 9).
    Using such a keyboard is quite difficult because all entries—must be entered directly
    in machine language.


    Clearly a full typewriter-like keyboard is required for high-level language input
    of the sort shown in Part 4. The home computer market has increased as the availability
    of reasonably priced keyboards has improved. Further cost reductions have been
    possible because of developments in manufacturing techniques that have brought
    in keyboards with few, if any, moving parts. As with many applications the electronic
    keyboard is cheaper (and more reliable) than its mechanical counterpart.


    Output

    Home computing has been noticeable for the absence of the printed output so loved
    by mainframe computer users. This is almost entirely because of the relatively
    high cost of printing devices. The standard home computer output device has become
    the video screen—not, however, a specialised computer-type video or a modified
    television set. The reasoning behind this is that most home computer users would
    already possess a television set and would therefore be spared a major expense.


    54 shows the outlined schematic for a home computer video output. An output adapter
    is connected to the data bus and receives messages and control signals intended
    for the screen. These are converted from parallel to serial form (see next chapter)
    and passed to a UHF modulator. The function of this device is to generate a signal
    which can be fed into the TV aerial socket and which the television will think
    is a normal off-air programme.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '![](img/65765bbbc6edc77d698bfd1cdb00e913_370_0.png)


    Fig. 54. Outputting to a television set.


    # Backing Storage


    Programs developed by the user are stored in RAM; when power is removed from the
    home computer system that data is lost. Even if some form of battery back-up system
    was available, the user is unlikely to have sufficient RAM to save all his programs.
    Some simple and cheap backing storage is required therefore that can be used to
    store and retrieve data and programs.


    This is usually provided with a special interface to a conventional audio cassette
    recorder. The data to be stored is firstly converted from parallel to serial form
    (in the same way as the TV interface previously described). Then each bit of data
    is converted into one of two tones tones on whether it is 0 or 1. The tones are
    recorded on tape.


    To load data from tape to RAM the reverse process is used. Each tone incoming
    to the interface unit is detected by an electronic filter and converted to the
    appropriate bit. Fig. 55 shows the cassette storage system in block form.


    # Other Input/Output


    A number of other input/output mechanisms are available for the home computer
    user. These include floppy disks (so called because they are flexible), which
    are similar in concept to the disc storage discussed in Part I. As floppy disks
    tend to be used only by the more advanced home computer user they are not discussed
    further here.


    To provide for a variety of input/output devices (such as printers, paper tape
    readers, model train controllers and so on) the home computer uses a standard
    interface type RS232 (also known as V24).'
  merge: -1
  pgno: 370
- img_proc: true
  md: '340 Computer Programming


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_371_0.png)


    Fig. 55. Cassette tape backing storage.


    The **standard interface** is a general input, output route consisting of 25 pins.
    Of these each one is for transmitted and received data (apart from a common earth)
    the remainder are control lines. The more important of these control lines, shown
    in Fig. 56, may or may not be used depending on the application. For example,
    a simple home-built model train controller would just accept data whereas a line
