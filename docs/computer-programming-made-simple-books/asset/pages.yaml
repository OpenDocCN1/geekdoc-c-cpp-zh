    # File Section Entries


    The first part of the Data Division to be coded the File Section and we will

    examine the program specification to pick out the files used by the program.

    As can see this program requires three files—card-input file, tape-output

    file, and printer-output file—which can be defined in any order and

    given names chosen by the programmer.


    The card-input file may contain two types of records (identified by 307 or

    308 in the first three columns of the card) although since their layout is

    identical only one DATA RECORD description is given. The record

    descriptions for the other two files do not need to be broken down to

    does to be broken down to

    ellementary fields since no manipulation is carried out in record

    areas. Instead, only complete groups will be moved into these areas prior to

    they being sent to the output device. This will become clearer later in this part

    when the complete program coding is shown.


    The File Section for this program will therefore be coded as:


    ```

    DATA DIVISION.

