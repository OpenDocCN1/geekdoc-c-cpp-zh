  md: '# Preface


    A glance at some of the paperwork in a computer department might easily prompt
    the question: Can computer programming be made simple? The answer is a very definite
    ''yes''.


    The major barrier between computer people and the layman is one of initiation.
    The rows of flashing lights, reams of numbers and the jargon are all part of a
    continuing but unnecessary mystique, and a small amount of carefully planned and
    well-presented instruction can open up new horizons for anyone interested enough
    to pay attention.


    Modern techniques in programming enable anyone to participate in the writing of
    small programs after a brief training, and only by encouraging such participation
    will the benefit of computers be appreciated by everyone. The computer is becoming
    more and more a part of our daily lives and we must learn to live with it. Man
    must be the master not the slave.


    Thus, from the outset, Computer Programming Made Simple, which requires no previous
    knowledge of mathematics or electronics, was planned to be of value and interest
    to a very wide circle of readers: to the man in the street who wishes to satisfy
    his curiosity without becoming enmeshed in technical detail; to the aspiring programmer
    who wants a grounding in the subject before seeking a job; to the line manager
    who has an involvement with computers and wishes to know something of the problems
    encountered in preparing work for them; to the engineer who would like to use
    a computer as a problem-solving tool; and, finally, to school-leavers and undergraduates
    who wish to expand their background knowledge before entering the world of commerce
    or industry.


    In conclusion, I am indebted to Roger Marshallsay and Honeywell Information Systems
    for their assistance in the computerized preparation of the index for the book.


    J. MAYNARD'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# Preface to Second Edition


    The decade of the seventies will be remembered for the tremendous growth that
    took place in computing—not just in the commercial applications of large computers
    (described in Parts One, Two and Three) but in the use of computers in the home.


    The home computer was made possible by the enormous reductions in price and increases
    in power of integrated circuits or chips ''spun off'' from the American space
    programme. Initially seen in pocket calculators and television games, chips soon
    offered the hobbyist the chance to do his own thing. Playing chess, teaching children
    elementary mathematics, playing tunes, decoding morse, keeping personal accounts,
    running small businesses; those and many, many more are the uses of the home computer.
    (In addition, of course, to just playing...)


    The aspiring computer programmer can still gain a good grounding for a future
    career by reading Computer Programming Made Simple. So too can the hobbyist or
    small user learn from this book the fundamentals of the home computer (in Part
    Five) and the ins and outs of a typical BASIC language (in Part Four). The additions
    to the Second Edition are written with an approach that requires no technical
    or other foreknowledge. Computer programming, especially in the home, really can
    be made simple.


    J. MAYNARD'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Preface to Third Edition


    The development of computing across the world has been encouraged by the use of
    and adherence to standards. The fact that a program written in, say, Switzerland
    for an American computer can run on another computer in Australia has fuelled
    a rapid development.


    This development is the more remarkable when considering the changes in hardware
    that have taken place in the last decade or so. The computer on my desk or in
    my home (or even my washing machine!) a few years ago, have been used for commercial
    computing. Despite this exponential growth in computing power the languages of
    programming remain the same.


    COBOL is the standard programming language for business and commercial applications.
    FORTRAN continues its role as the language of the scientist. BASIC, whilst taking
    on the task of personal and home computer programming, has almost become the answer
    to all programming problems. That is not to say that BASIC is the most efficient
    of languages; from it—but the power of modern computers can mask a great deal
    of inefficiency in this area.


    The text of Computer Programming Made Simple remains, therefore, as applicable
    to a wide range of programming problems now as when first written. The third edition
    has been extensively revised and reset to reflect recent changes and improvements.
    As the hardware continues to develop it seems that the software will remain based
    on the languages described herein.


    Increasingly the solution to computing problems lies with software and not hardware.
    Computer Programming Made Simple continues to address those areas.


    J. MAYNARD'
