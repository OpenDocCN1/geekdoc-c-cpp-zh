  md: '# Word Types and Constants 77


    A non-numeric literal can consist of 1 to 120 characters chosen from the entire
    COBOL character set (described in Chapter 10) and is enclosed in quotation marks.
    Any space within the quotation marks is treated as the constant and therefore
    occupies memory space. Examples of non-numeric literals:


    "BONUS THIS WEEK"

    "GRAND TOTAL"

    "ERROR 32—PROGRAM TERMINATED"

    "END OF JOB"

    "ANY MORE?"

    "NO MORE PAPER"


    Figurative values are used frequently in programming and these have been allocated
    specific data names. These data names, which are not enclosed in quotation marks,
    are reserved words.


    A figurative constant is used wherever ''literal'' is shown in a general format.
    The plural values of the figurative constants are identical with the singular
    and may be used interchangeably.


    Figurative Constant | Value

    |---|---|

    |ZERO | The value ø or one more occurrences of the character ∅ depending on the
    context.

    |ZEROES | |

    |ZEROS | |

    |SPACE | Represents one or more blanks or spaces.

    |SPACES | |

    |HIGH-VALUE | Represents one or more occurrences of the character with the highest
    sorting sequence for the computer in use.

    |HIGH-VALUES | |

    |LOW-VALUE | Represents one or more occurrences of the character with the lowest
    sorting sequence for the computer in use.

    |LOW-VALUES | |

    |QUOTE | Represents one or more occurrences of the quotation-mark character. Note
    that the word QUOTE cannot be used in place of the quotation mark to enclose a
    non-numeric literal.

    |QUOTES | |


    ALL literal represents one or more occurrences of the characters composing (non-numeric
    or figurative) literal following the word ALL. When a figurative constant is used
    the word ALL is used for improved readability only. Example:

    MOVE ALL "*" TO LONG-FIELD.

    t receiving field in this MOVE statement (LONG-FIELD) will be filled with asterisks.'
