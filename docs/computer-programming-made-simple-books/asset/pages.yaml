  md: '# Arrays 269


    can be represented diagrammatically thus:


    | Total (1) | Total (2) | Total (3) | Total (4) |

    |---|---|---|---|


    Each of the four elements has the same name, TOTAL, although they all have a unique
    element number. It is this element number that used to distinguish between the
    different elements in an array. For example, to add 1 to the second element in
    the array TOTAL:


    TOTAL(2) = TOTAL(2) + 1


    The number enclosed in parentheses following the array name is called a subscript
    and identifies the particular array element required. A variable name which has
    appeared in a DIMENSION statement must always be followed by a subscript.


    The following will add together the contents of the four elements of TOTAL and
    place the result in SUM:


    SUM = TOTAL(1) + TOTAL(2) + TOTAL(3) + TOTAL(4)


    To add the contents of the array defined thus


    # DIMENSION SETS(4)


    to the array TOTAL (i.e. adding corresponding elements) the following could be
    used:


    TOTAL(1) = TOTAL(1) + SETS(1)

    TOTAL(2) = TOTAL(2) + SETS(2)

    TOTAL(3) = TOTAL(3) + SETS(3)

    TOTAL(4) = TOTAL(4) + SETS(4)


    # Variable Subscripting


    Using constants as subscripts is quite acceptable for arrays with only a small
    number of elements. However, suppose we wished to add together two arrays each
    of 100 elements. Clearly an alternative method must be available. The subscript
    of an array name can be specified as a variable whose integral value is used to
    identify the particular element of the array. Since the value of the variable
    subscript can be different it is possible to refer to every element in an array
    within a small loop of instructions. Before looking at this technique consider
    the following statements and make certain that you understand their implications.


    K = A(1)


    This statement places in K the value of array A whose number is given by the current
    value of I. If the value of I, at the time of execution of the above statement,
    equal 6 then the statement would be equivalent to


    K = A(6)


    Similarly, if the value of I equal 3 the statement would be equivalent to


    K = A(3)'
