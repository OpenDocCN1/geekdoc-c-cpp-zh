  md: '# Part 4:

    Basic Programming Language


    The word BASIC is an acronym of ''Beginners All-purpose Symbolic Instruction Code''
    and although less elegant and less powerful than other programming languages does
    still fulfil its two main objectives. BASIC is for beginners—it can be used quite
    quickly by people who are not, and who do not wish to be, computer professionals.
    BASIC is all-purpose: it can be used for simple computational work, for problem-solving,
    for small business applications and, increasingly, for home computing.


    BASIC began in 1964 at Dartmouth College, America, where it filled a need for
    a simple computer language for beginners. BASIC has proved to be very popular
    since then. This is particularly so in the case of time-sharing computer systems
    and personal, or home, computers where the language has been universally adopted.
    BASIC is also available on most mainframe computer systems.


    The most recent development of the language has been in home-computing. Microprocessor
    based systems (discussed in detail 5) have become very sophisticated in the last
    few years. The later half of the seventies will probably be remembered as the
    microcomputer era. Early computers used machine or assembly language and programming
    required a dedication found only in the most ardent enthusiast. As the systems
    developed and became larger and as the range of potential users widened it became
    necessary to supply a high-level language. BASIC proved to be the ideal choice;
    in its simplest form (see below) it can be implemented on a very small machine
    (unlike, unlike, COBOL) and yet it can provide for the most sophisticated file
    handling and so on. The problem with BASIC is that it has been extended and improved
    by different computer suppliers and users. This means that a program written in
    BASIC for one computer might not run on another machine from a different supplier.


    Attempts have been made to produce an industry standard. The American National
    Standards Institute (ANSI X32J/76-01); the National Computing Centre (U.K.) has
    published Specification for Standard Basic, by Bull, Freeman and Garland.


    The fundamental part of BASIC (basic BASIC?) is reasonably standard throughout
    the computer industry. Programs written using the coding in the first part of
    the section will be ''portable''. They will run on almost any computer supporting
    the BASIC language.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# 296 Computer Programming


    The problem arises when the language is extended. Because there are no agreed
    standards, different computer suppliers have extended the language in different,
    non-compatible, ways. A number of books have tried to overcome this by giving
    an ‘average’ BASIC or by listing the variations of all ‘major’ suppliers. The
    problems with either of these approaches should not be too difficult to work out.


    The BASIC that follows is placed on the de-facto, industry standard of Microsoft
    BASIC. This is implemented, in full or in part, in virtually all personal computers
    and most home computers.


    Only sufficient BASIC commands and statements for general programming are described.
    For a complete discussion of Microsoft BASIC see BASIC by the present author and
    published also by Heinemann.'
