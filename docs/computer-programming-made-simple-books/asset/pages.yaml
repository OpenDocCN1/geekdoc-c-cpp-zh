    # Arithmetic Expressions


    An arithmetic expression is a combination of identifiers, numeric literals, and
    arithmetic operators. As might be expected the arithmetic operators specify the
    arithmetic operations and are as follows:


    +   + addition

    - subtraction

    * multiplication

    / division

    ** exponentiation (or raised to the power of)


    It is therefore possible to specify, in, a complicated arithmetic calculation:


    ```

    COMPUTE RESULT = A + B + C * D

    COMPUTE RESULT = A**B

    COMPUTE RESULT = A/B*3-24*C

    ```


    Obviously in cases the final answer to the calculation could depend on the sequence
    in which the arithmetic operators were evaluated. For example, the statement 3**2*3
    will produce two different results depending on whether the * operator (multiplication)
    or the ** operator (exponentiate) is acted upon first (the results would be 216
    and 24 respectively). To avoid this uncertainty an arithmetic operator hierarchy
    is specified which lays down the order in which the operators are to be evaluated.
    The order is as follows:


    +   1. - (minus sign)

    2. ** /

    3. * and /

    4. + and - (addition and subtraction)


    So in the example already looked at (3**2*3) the exponentiation will be carried
    out first followed by the multiplication. (Giving a result of 24.) Operators on
    the same level are evaluated left to right in the expression used.


    | intermediate stage 1 | 24*3/8 + 6*3 - 12/3 |

    | | 2 | 72/8*6*3 - 12/3 |

    | | 3 | 9+6*3 - 12/3 |

    | | 4 | 9+18 - 12/3 |

    | | 5 | 9+18 - 4 |

    | final stage | 27 - 4 |'
