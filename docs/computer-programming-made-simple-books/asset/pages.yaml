    with data read from the backing store, they are transmitted to the arithmetic
    unit for computations before being transmitted to the output unit. These operations
    are regulated by the control unit obeying instructions in the program stored in
    the memory unit. The arithmetic, memory, and control units are collectively known
    as the Central Processor Unit (usually shortened to CPU). The reader may treat
    the CPU as a single unit since the computer programmer is not able to distinguish
    between the three constituent units when coding his program. (Note the term coding
    which is preferred to writing when referring to a computer program.)


    Before proceeding to a description of the individual items consider the set-up
    of a specific computer system to perform an everyday task. Most consumers now
    receive their gas bills by a computer so us consider the manner in which they
    are produced.


    Figure 2 illustrates the computer system set up to produce consumers'' quarterly
    gas bills. The history file recorded on magnetic tape (see Chapter 5) contains
    for each consumer details such as his name, address, account number, charging
    tariff, outstanding balance, and hire-purchase commitments. This information is
    recorded in sequence (of, say, account number) to make it easier for the computer
    to retrieve any particular record.


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_32_0.png)


    Fig. 2. Schematic of gas-consumer billing.


    The object of this job is to produce, for each consumer, a bill showing the amount
    charged for gas used this quarter plus outstanding debts and hire-purchase charges,
    if any. (Note—the reason for the different-shaped boxes in Fig 2 is explained
    fully in Chapter 6.)


    The amount of gas used by the consumer as recorded by the meter reader is transcribed
    onto an input medium (see Chapter 3) which are sorted into the same sequence as
    the consumer history file. The first stage in running this job is to load the
    program into the CPU (see Chapter 8), the computer operator will press the start
    button and the CPU will begin executing the program.


    The program will begin by reading the first record from the consumer history file
    into the memory unit. It will then instruct the input device to transmit the transaction
    details into memory. The account number will be compared with that of the consumer
    history record. If they are the same the program will proceed to produce a gas
    bill. To do this the computer will'
