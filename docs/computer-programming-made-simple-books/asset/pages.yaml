  md: '# Relational Expressions


    A relational expression consists of two arithmetic expressions separated by a
    relational operator. A relational expression can have only two values—.TRUE, .FALSE.
    The expression is .TRUE if the relation between the arithmetic expressions is
    satisfied and .FALSE if it is not. The relational operators and their meanings
    are shown in Fig. 46.


    | Symbol | Meaning |

    |---|---|

    | .GT | Greater than |

    | .GE | Greater than or equal to |

    | .LT | Less than |

    | .LE | Less than or equal to |

    | .EQ | Equal to |

    | .NE | Not equal to |


    Fig. 46. The FORTRAN relational operators


    Note that only .EQ and .NE. may be used with complex arithmetic expressions but
    all six relational operators may be used with integer, real, double-precision
    and alpha variable expressions.


    The IF statement may therefore be used to evaluate the relationship between variables:


    ```

    IF (A.GT.B) GO TO 10

    ```


    In this case the value of A is greater than the value of B control will be transferred
    to statement number 10. A more complicated expression may be used:


    ```

    IF (A**2-B*X.EQ 7.0) GO TO 22

    ```


    The value of the arithmetic expressions will be evaluated and compared according
    to the relational operator. If the relation is fulfilled or .TRUE. (in this case
    if the values are equal) then the statement GO 22 will be executed and control
    will be transferred. (i.e. if it is .FALSE.) the statement GO 22 will not be executed
    and control will pass to the next sequential statement. The IF statement can be
    used to select different program paths depending on the value of a variable:


    ```

    IF (INDIC.EQ 7) GO TO 20

    IF (INDIC.EQ 12) GO TO 25

    IF (INDIC.EQ 17) GO TO 35

    ```


    Program paths can be selected depending on the relationship existing between variables:'
