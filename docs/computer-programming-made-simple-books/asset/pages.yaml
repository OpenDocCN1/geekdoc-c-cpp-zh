  md: '# Operating Systems


    # Utilities


    A number of simple tasks occur frequently in a computing environment and rather
    than have a special little program written for each one the Operating System contains
    a number of generalised utilities. By supplying the necessary parameters to the
    appropriate program a number of simple jobs can be performed. These jobs can include:


    +   - copying a file from one device to another

    - listing the contents of a file on the line printer

    - counting the number of records or blocks on a file

    - combining two files into one (i.e. merging two files).


    # Error Recovery


    Various types of error can occur while a computer system is running—a program
    can fail (due to an incorrect or illegal instruction)—a backing store device can
    malfunction—the CPU could develop a faulty circuit and so on. The Operating System
    will continue routines and programs to deal with all these types of error (some
    of the routines will effectively form part of the Supervisor by being read into
    the mini-partition). In the case of a peripheral device error the Operating System
    will attempt to correct the fault (by retrying the data transfer) a set of times.
    If the fault cannot be corrected the computer operator will be informed and the
    appropriate action can be taken (i.e. the faulty unit can be replaced).


    When a program fails (frequently during the testing stage!) the Operating System
    will first of all dump the contents of memory—i.e. it will print out or display
    the contents of memory to enable the programmer to investigate the error and make
    the necessary corrections to its source program prior to re-compilation. Secondly
    it will delete the failed program from its current schedule so allowing the next
    program to be read in and executed.


    The most common operating systems for small computers are CP/M, MSDOS and PCDOS.


    # Software


    This term is often used as an alternative to Operating System but strictly speaking
    it refers to all the programs in use at an installation (i.e. Operating programs
    and the user written programs). Software is complementary which refers to the
    electronic and mechanical components of a computer system.


