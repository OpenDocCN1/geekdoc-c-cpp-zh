    ```


    If this clause is present it is treated as a comment and is therefore only used
    as a documentation aid by the programmer.


    VALUE OF LABEL-CODE IS "FILE 7"


    # DATA RECORDS Clause


    This clause identifies the different types of records in the file by name.


    # Format


    ```

    DATA {RECORD IS RECORDS ARE} data-name-1 [data-name-2] ...

    ```


    Any given file may contain records with different layouts (even when they are
    the same length). For example, the Payroll Master File referred to above might
    departmental-summary records and employee records. This would show thus:


    DATA RECORDS ARE DEP-SUMMARY, EMPLOYEE


    It is most important to realise that only one area is reserved in core storage
    for these two records. In the above clause we are merely saying that two formats
    can exist for this one area. This is particularly important when creating a variable-length
    record file, as the compiler will only know the size of the different record types
    by examining the data-record descriptions which follow the FD (see below) and
    are named in the DATA RECORDS clause.


    When a file is defined as being of fixed length the data descriptions given in
    the DATA RECORDS clause must all be of the same length. Data-name-1, data-name-2,
    etc., must be the names of level 01 entries following the FD.


    # Data-Record Descriptions


    Following each FD the programmer will code the layout of each data-record type
    to occur on the file. This is done in the same way as we have already seen for
    structures. The examples which follow the individual field descriptions are omitted
    for clarity.


