    CHANGE (3)


    Suppose in a sales program table has been set up to contain a count of

    number of sales in each area:


    01 SALES-TOTALS.

    02 AREA-TOT OCCURS 20 PICTURE 9999.


    (assuming there are twenty sales).

    To add 1 to the count of the number of sales in area 7:


