  md: '# The Sort Feature 221


    Using the files described above the following SORT statement could be used:


    SORT SORTER ON ASCENDING KEY-FIELD

    USING SORTIN, GIVING SOROUT.


    This will result in the input file SORTIN being read in and transferred to the
    sort file SORTER, sorted and the output (in the desired sequence) written to SORTOUT.


    Using the SORT Statement

    The sequence of events within a program to use the SORT statement could be as
    follows (note that a sort file is not opened):


    ```

    PROCEDURE DIVISION.

    OPEN INPUT SORTIN.

    OPEN OUTPUT SOROUT.

    SORT SORTER ON ASCENDING KEY-FIELD

    USING SORTIN, GIVING SOROUT.

    CLOSE SORTIN, SORTOUT.

    OPEN INPUT SOROUT.

    ```


    (process sorted file)


    ```

    CLOSE SORTOUT.

    STOP RUN.

    ```


    The input to this program (SORTIN) will have been prepared by a previous program,
    it is read into this program, sorted into ascending sequence on the field ACCOUNT-NO
    and is then processed, in this order, by the program. Suppose the sequence of
    the file SORTIN before input to this program was as follows:


    | Record No. | Value of Account-No. |

