    |--- |--- |

    | 100 | 100 |

    | 300 | 250 | 50 |

    | 250 | 100 | 50 | 100 |

    | 300 | 50 | 50 | 50 | 50 | 50 | 50 |

    | 300 | 100 | 100 |


    The variable-length recording mode is indicated with the following clause:


    RECORDING MODE IS V


    # Other Modes


