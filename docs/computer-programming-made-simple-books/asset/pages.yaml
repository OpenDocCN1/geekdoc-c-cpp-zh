  md: "# 42\nThe Sort Feature\n\nSorting\n\nThe COBOL compiler contains facilities\
    \ to enable the programmer to request an input data file be sorted into order\
    \ on one or more key fields. The programmer will specify an input to be sorted,\
    \ a sort file, and an output file for the sorted data. The input and output files\
    \ are defined in the usual way with an FD (see Chapter 18). The sort file must\
    \ be defined in the File Section with an SD entry which is almost identical to\
    \ the FD previously discussed:\n\n| Format |\n| SD sort-file-name |\n| [RECORDING\
    \ MODE is] |\n| [DATA {RECORD IS RECORDS ARE} data-name-1 [data-name-2] ...] |\n\
    | {RECORD CONTAINS {integer-1 TO} integer-2 CHARACTERS} |\n| {LABEL {RECORD IS\
    \ RECORDS ARE} {STANDARD OMITED} ] |\n\nThe description of the sort file, and\
    \ of the data it contains, must be identical to the description given to the input\
    \ and output file associated during the program with the sort.\nThe rules applying\
    \ to the SD entry are as those relating to the FD as given in Chapters 18 and\
    \ 19. The following extract from a Data Division File Section illustrates the\
    \ specification of the three files involved in a sorting procedure:\n\n```\nFD\
    \ SORTIN,\n   RECORDING MODE IS F,\n   LABEL RECORDS ARE STANDARD,\n   DATA RECORD\
    \ IS IN-AREA.\n01 INAREA.\n   02 FILLER PICTURE X(76).\nFD SORTUT,\n```"
  merge: -1
