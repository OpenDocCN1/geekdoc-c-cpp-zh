    # Number Notations


    When a number with a decimal portion (such as 27.34) is held in memory the actual
    decimal point does not exist (since it would require an additional storage location
    to itself). Instead the computer ''remembers'' where the decimal point is meant
    to be and can align the values in a calculation correctly. (Note—coding to achieve
    this is automatically generated by the compiler). Note that a number without a
    decimal point is assumed to be an integer with thus—27V34. The V specifies the
    location of an assumed decimal point. studying Parts 2 and 3 of this book you
    will come across numbers specified by a single V


    Because of the way computers are organised internally they cannot hold very large
    or very small numbers (such as 124,000,000,000,000 and 0.000,000,000,041 respectively)
    as strings of digits. Numbers such as these are held in floating-point format.
    This consists of two parts—a mantissa and an exponent. The mantissa of a floating-point
    number indicates the numeric quality of the number. In the first example the mantissa
    would be 1.24. The exponent gives the order or magnitude of the number and is
    expressed as a power of ten. In the example the exponent could be 10⁴. 1.24 ×
    10⁴ is obviously equivalent to 124,000,000,000,000 but requires far less space.
    A shorthand method is used to write down floating-point numbers when used in programming—1.24E14.
    The letter separates the mantissa (before the E) and the exponent power. Very
    small numbers are represented with a negative exponent (equivalent to dividing
    the mantissa by a positive exponent value). For example 0.000456 could be represented
    by 4.56E-4.


