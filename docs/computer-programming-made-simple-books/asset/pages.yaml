    store device containing the program and will instruct the device to transfer the
    program into memory (the stored program is considered by the backing store to
    be just another set of data). Once the program has been read into memory the Supervisor
    will transfer control to the program which can then begin its processing.


    # Compilers


    The programming languages, COBOL, FORTRAN and BASIC, which we will read about
    Parts 2, 3 and 4 of this work, are known as high-level languages. This name derives
    from the pseudo-English syntax used in these particular languages. In the early
    days programming consisted of writing long strings of numbers representing the
    process to be carried out. These numbers, when read into the CPU, were directly
    understandable and executable by the computer. their very nature made them difficult
    to understand, prone to error, and slow to produce. Computers still function internally
    in the same way—i.e they examine and execute instructions by strings of numbers—however,
    it is no longer necessary to code programs in this basic. As we will see later
    in the book we can now write straightforward English language statements such
    as


    # ADD TRANSACTION-VALUE TO BASIC OR TOTAL = NET + GROSS.


    The computer can read this type of coding but cannot execute the statements in
    this form because it recognises only strings of numbers as a program. The computer
    manufacturers supply with each machine a program written to translate the English-type
    statements of our program into the strings of numbers that the computer can execute.
    This type of program is known as a compiler and a separate one will be supplied
    for each programming language in use (e.g. COBOL, FORTRAN or BASIC).


    # Compiler Functions


    The major function of a compiler is, already mentioned, to translate the statements
    written by the programmer into machine executable number strings. The actual mechanics
    of this translation (or compilation as it is known) is beyond the scope of this
    book, although the reader will appreciate that it is quite a complicated task.


    The compiler will perform additional functions depending on the nature of the
    program being compiled (as the source program). If a program manipulates a blocking
    store file it is necessary for coding to be present in the program to de-block
    the file records as required. It is not, however, necessary for the programmer
    to write the code to do this work. Such coding is automatically inserted into
    a program by a compiler when the description of a blocked file is encountered
    in the source program.


    The compiler will verify as much as is feasible, the program being compiled does
    not contain any logic errors. For example any attempt to add to a field which
    has been defined as containing only alphabetic (i.e. the letters A-Z) characters
    will be identified as an error. Similarly a reference to a wit'
