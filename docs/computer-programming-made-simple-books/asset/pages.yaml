    The pack of cards is loaded into the input hopper which consists of a U-shaped
    metal channel into which the cards are slid down. On command from the computer
    the cards are drawn one by one from the input hopper and are passed by a series
    of rubber wheels through the read-station. The readstation consists of a powerful
    light shining through the punched holes on to a set of twelve photo-electric cells.
    The light falling on a particular photoelectric cell generates an electric pulse.
    The pattern of holes on each card is reproduced, column by column, as a series
    of electric pulses which are transmitted to the computer memory. Once the card
    has passed through the read-station it is sent to an output hopper for later removal
    and storage. The output hopper usually has a spring-loaded base-plate which will
    move down to accommodate an increasing pack of cards. Typical modern card-reading
    equipment can operate at speeds of over 1000 cards per minute resulting in a minimum
    transfer of 80,000 characters per minute into the computer. With speeds of this
    order it is largely important to ensure that each card in a pack is in prime condition.
    A card which has been creased or stapled or has become damp will often be rejected
    by the card-reader or, worse, will cause the read-station to jam. It is important
    therefore to treat cards with respect!


    The end of a pack of cards will be detected by the card-reader which will send
    a special end of pack signal to the computer.


