  md: '# 57

    Functions


    To circumvent the mathematical environment normally associated with the use of
    FORTRAN there is a continuing requirement for a variety of functions to be evaluated.
    These will include such things as square root, logarithm, and the trigonometric
    functions (such as sine, cosine, tangent, etc.). The programming required to compute
    the values of this type of function would clearly be extremely difficult and costly
    in terms of development time (especially since they would be so frequently required).


    To circumvent these problems FORTRAN provides a number of built-in functions whose
    purpose is to specify a complicated or frequently used computation in a concise
    manner. Functions are identified to the FORTRAN compiler by a 3, 4, or 5 character
    abbreviation of the required function in an arithmetic expression. This function
    identifier is followed, in parentheses, by the variable or variables which are
    the subject of the function computation.


    For example, the square root function is identified by SQRT (expression). The
    expression the square root of the variable A will be evaluated and the square
    root calculated. The following statement demonstrates a simple example of the
    use of this function:


    ```

    A = SQRT(B)

    ```


    In the evaluation of this statement the square root of the expression (in this
    case the current value of the variable B) will be assigned to the variable A.
    A more complicated expression may be given:


    ```

    R = SQRT (A**3 + 3*V2)

    ```


    In this case the expression (A**3 + 3*V2) will be evaluated using the current
    values of A and V2 and the square root of the resulting value will be assigned
    to the variable R. A function or functions may be combined with other elements
    or functions to form a larger expression:


    ```

    RESULT = SQRT (P/Q) + SQRT(Z/R)

    ANSWER = SQRT (A/B) + SQRT(C)

    ```


    Since a function may appear anywhere that an expression may be used it can be
    coded into output statements, loops, and control statements as the following examples
    will demonstrate:


    ```

    PRINT, SQRT(A), SQRT(B)

    ```


    This statement will cause the printing of the square roots of the current values
    of the variables A and B is equivalent to the following three statements:'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# 288 Computer Programming


    X = SQRT(A)

    Y = SQRT(B)

    PRINT, X, Y


    It is clearly more efficient to use the functions within the PRINT statement rather
    than perform the calculations prior to that statement. The statements below show
    a function within a loop, which in this case converts each element of an array
    to its square root if the original value was positive and zero if the original
    value was negative. (Note an attempt to take the square root of a negative number
    will generate an error condition):


    ```

    DO 10 K = 1, 20

    IF (A(K).LT. 0.0) GO TO 12

    A(K) = SQRT(A(K))

    GO TO 10

    12 A(K) = 0.0

    CONTINUE

    ```


    It is permissible to take the square root of the zero value (in which case the
    result is also zero) and the above loop could be recoded efficiently thus:


    ```

    DO 20 K = 1, 20

    IF (A(K).LT. 0.0) A(K) = 0.0

    20 A(K) = SQRT(A(K))

    ```


    A function reference is also permissible in a control statement as the following
    examples will show:


    ```

    IF (SQRT(A).LT. 7.2) GO TO 16

    IF (A.EQ. B) Z = SQRT(B + A)

    DO 10 K = 1, SQRT(X)

    ```


    # Built-in Functions


    For illustrating the permitted contexts of function statements only the square
    root function has been shown. however, a considerable number of standard or built-in
    functions available within various FORTRAN compilers and a description of some
    of the more commonly used ones follows. Note—the term argument indicates the value
    of the expression(s) following the function reference. Thus SQRT (arg) indicates
    that a single expression may be in parentheses following the SQRT function, whereas
    MAX (arg 1, 2 ...) indicates that at least two expressions must be present.


    ALOG (arg)


    Generates the natural logarithm (i.e. to the base e) of the expression given as
    the single argument.


    R = ALOG(B)


    This statement causes the natural log of B to be assigned to the variable R. The
    value of the argument must be a real value; the result of the function being real.


    ALOG1 (arg)'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'This function calculates the common (to the base 10) logarithm and is used
    in the same manner as ALOG.


    # ATAN (arg)


    The result of this function is a value giving the angle (in radians) whose tangent
    is equal to the value of (arg). Thus if a tangent value is held in the variable
    T the following statement will assign the size of the corresponding angle to A:


    ```

    A = ATAN(T)

    ```


    # CLK (arg)


    The current time of day will be obtained from the computer''s supervisor as is
    the result of this function. The argument in this case is not evaluated but is
    a ''dummy'' to satisfy the compiler''s requirements that all functions must be
    followed by a parenthesized expression. The result of this function is of format
    HH:MM (i.e. hours and minutes) and needs to be assigned to a FILENAME type variable
    or an ALPHA (literal) variable. The following statements will cause the current
    time to be printed during execution of a program.


    ```

    ALPHA T

    T = CLK(X)

    PRINT, "TIME", T

    ```


    # CONJG (arg)


    Two imaginary numbers are said to be conjugate if they differ only in the sign
    of their imaginary part; i.e. a + bi is conjugate to a - bi. This function will
    generate the conjugate of a complex number. (Both the argument and the result
    are therefore complex.)


    ```

    COMPLEX A, B

    A = (2.0, 3.0)

    B = CONJG(A)

    ```


    The result of third statement above would be B having the value (2.0, -3.0).


    # COS (arg)


    The trigonometric cosine of the argument is computed:


    ```

    C = COS(ANGLE)

    ```


    The cosine of ANGLE will be assigned to the real variable C.


    # DBLE (arg)


    The value of the argument is converted to a double-precision value.


    ```

    DOUBLE PRECISION D

    D = DBLE(A**2 + B)

    ```


    # DIM (arg1, arg2)


    This function generates the positive difference between two real values of the
    arguments, i.e. it subtracts the smaller of the two arguments from the other.
    Thus the two DIM function references shown below would generate the same result
    (+2.0):'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# Computer Programming


    ```

    A = 6.0

    B = 4.0

    C = DIM(A, B)

    A = 4.0

    B = 6.0

    C = DIM(A, B)

    ```


    EXP (arg)


    This is an exponential function -the value e (the base of natural logarithms)
    is raised to the power specified by the evaluation of the real argument. Thus
    the following statements will cause the value of e^2 to be printed:


    ```

    A = 2.0

    PRINT, EXP(A)

    ```


    MAX(arg1, arg2 ...)


    The result of the previous function is the largest of the values of all the arguments
    specified:


    ```

    C = MAX (A, B, D, E)

    ```


    Suppose before execution of the above statement the values of the variables A,
    B, D, and E were 2.0, 16.3, 15.9, and 14.4 respectively. The result of the statement
    would be that the value 16.3 was assigned to the variable C. Note-some FORTRAN
    compilers require that this function be specified as MAX and MAX1 for integer
    and real argument lists respectively.


    MIN(arg1, arg2 ...)


    This is the converse of the previous function, giving the minimum of the values
    of the arguments in the list. Likewise some compilers require that this be specified
    as MIN or MIN1 for integer and real argument lists respectively.


    SIGN (arg1, arg2)


    When used in an assignment statement the result of this function will be the value
    of argument 1 with the sign of argument 2. Thus if the values of A and B were
    2.0 and -3.0 respectively then the result of the statement below would be to give
    C the value -2.0:


    ```

    C = SIGN(A, B)

    ```


    SIN (arg)


    The trigonometric sine of the angle specified by the value of the argument is
    computed and represents the result of this function.


    SQRT (arg)


    The square root of the argument values is computed.


    TAN (arg)


    The trigonometric tangent of the angle specified by the value of the argument
    is computed.'
