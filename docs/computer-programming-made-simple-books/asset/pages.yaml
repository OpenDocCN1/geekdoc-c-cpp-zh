  md: '# 32

    Data Transfer


    The transfer of data from or to an external file is accomplished by means of input
    and output statements, the format of which is discussed below. Since this work
    is intended for the newcomer to computer programming we will only look in detail
    at files organised in a sequential manner. However, the reader should bear in
    mind that files can be organized, on a disc-backing store, in a direct (or random)
    access mode. A file, on a disc backing store, organized in a direct-access manner
    can be accessed in any order the programmer desires; if a file was organized in
    a specific manner the programmer could access a particular record merely by quoting,
    say, a customer account number to his program. The coding for handling direct-access
    files can be quite complicated, and since the use of such files tends to be restricted
    in commercial environments, their use is not described in the coding examples
    used in this book.


    All files referred to in the examples below will be organized in a sequential
    (also called serial) manner. Sequential files have already been described in Part
    I. However, it is important to remember that when inputting a sequential file
    every record on the file is to be read—if the programmer wishes to bypass a number
    of records he must specifically write the necessary instructions to do. If record
    n has just been input then the next accessed will be record number n+1. Similarly,
    if record n has been output to a file then the next record sent to that file must
    be record n+1. However, since the records on a sequential file are accessed one
    after another the programmer does not need to be concerned with the number of
    a particular record on a file.


    # The READ Statement


    The READ statement is used to make available, to the program, the next record
    on the file and take specific action when the end-of-file condition is reached.
    (Note that, as already mentioned, the removal of logical records from physical
    file blocks is handled by the operating system and need not to be the concern
    of the COBOL programmer.)


    Before the first READ statement is executed for any file the file must have been
    prepared for input with an OPEN INPUT statement.


    When a READ statement is executed the next record on the file is input to storage
    and is made available to the program in the record-input area defined'
