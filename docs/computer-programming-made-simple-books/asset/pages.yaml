  md: '# 67

    The Home Computer


    A home computer is defined in the same way as any stored program computer as a
    machine capable of manipulating data according to predefined rules. The rules
    are the instructions; the collection of instructions is the program. The program
    and the data are stored in the memory which is connected to the Central Processing
    Unit (CPU) as shown in Fig. 52. Notice from this that the connection between the
    CPU and memory (the data bus, as explained below) is bi-directional.


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_366_0.png)


    Fig. 52. Stored program computer.


    The CPU encompasses the arithmetic unit, the control unit and the logic unit as
    described in Part 1. The CPU actually does the computing; it will fetch an instruction
    from memory and execute it, often retrieving data from memory to do so. The CPU
    of a home computer will be contained in a single integrated circuit (such as the
    Z80 or 8086).


    Memory consists of one or more integrated circuits each of which can hold a pre-defined
    amount of data. The size of memory is given as so many K, each of which is 1024
    storage units. Thus an 8K memory would hold 8×1024 units. The unit of storage
    varies with the type of system but commonly the word, each word holding 8 or 16
    bits. Each bit can be 0 or 1 and an 8-bit word stores an 8-bit binary number.
    (A detailed discussion on the binary system will be found in Chapter 9.) The home
    computer user is usually interested only in the amount of memory he has as the
    limiting factor for program sizes. Memory is of different types each of which
    has its place in the home computer user''s repertoire and is described below.


    # Random Access Memory—RAM


    This is the ''normal'' type of memory associated with a home or personal computer
    system. RAM is accessible by the user for storage of data and programs. When using
    a high-level language such as BASIC (see Part 4) the'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# 336 Computer Programming


    allocation and subsequent addressing of RAM space (with commands such as

    DATA and READ) is a function of the compiler; the user does not need to

    worry about the physical organisation of the RAM (such as the Z80 assembler) or
    machine

    code the user will need to allocate and address RAM directly. Depending on the

    addressing capability of the CPU, the RAM addresses will consist of 2, 3, or

    f hexadecimal digits (see Chapter 9 for a discussion of the hexadecimal

    system). Typical RAM addresses could be 0010, 0AF2 and so on.

    A home computer will normally have a reset control that sets the program

    location counter to a pre-determined RAM address (as 0000).


    # Read Only Memory–ROM


    This is a memory unit that has been programmed during manufacture with

    data or program or both can only be read. No matter what the program

    currently executing tries to do the data in ROM cannot be overwritten or

    changed.

    ROM is used extensively by home computer manufacturers to provide

    operating systems or compilers. In the case of ROM the user

    alter or program the, only. Systems using

    microprocessors for specific control (such as in a washing machine or

    electric typewriter) will have their controls stored in ROM.


    # Programmable Read Only Memory–PROM


    This is a type of ROM that can be programmed with a special machine after

    mufactufact. Thus a PROM can be set up for a small or one-off application at

    low cost (ROM programming being economical only for large manufacturing

    quantities.

    A number of specialised electronic outlets will program PROMs to a

    customer''s specification for a few pounds. A typical application for a PROM

    would be to identify a machine or terminal with a unique identity or name so

    at it could be identified by a remote computer.


    # Erasable ROM–EPROM


    This is the same as a PROM but the programming can be erased and free

    ubstituted. It requires a special process such as exposure to ultraviolet light

    (often giving rise to the expression UVPROM). EPROM can be used

    where a PROM might be and where a change in program is likely to be

    required.

    The CPU itself often contains a small amount of high-speed memory

    (relative to the bulk of memory). This is often called scratchpad memory or

    working memory or accumulators. This area is usually divided into a number

    of, typically two-word long registers. When a particular function has to

    performed under program control, say an ADD, the data to be manipulated

    brought from memory into a register; the arithmetic is performed in the

    register and the result is returned to RAM. Registers are also used to keep

    track of the current program location (the program counter register) and

    nare are taken care of automatically by high-level

    languages.'
  merge: -1
  pgno: 367
- img_proc: true
  md: 'The relative location of the registers is shown in Fig. 53, which also shows
    that the CPU and Memory are linked (via the data bus) to an input/output unit
    (I/O). This I/O unit provides the interface between the computer system and the
    outside world.


    ![](img/65765bbbc6edc77d698bfd1cdb00e913_368_0.png)


    Fig. 53. Outside world interface.


    A large mainframe computer system such as that described in Part I will interface
    with the real world via a host of devices: paper tape, magnetic tape, visual display
    units, printed forms and so on. The home computer is clearly much more limited
    and yet, without a real world interface, it is quite useless. The typical home
    computer I/O system is discussed in the next chapter.'
