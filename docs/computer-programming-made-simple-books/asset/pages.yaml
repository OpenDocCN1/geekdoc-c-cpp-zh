  md: '# 25

    The Data Division in Use


    We have now looked at the major constituent parts of the Data Division and are
    in a position to code the necessary elements of this division for an average program.
    However, the reader may feel that, although he understands the individual parts,
    he would not be too happy to write a Data Division from a program specification.
    The purpose of this chapter is to present an idea of the way in which a specification
    presented to the programmer would be interpreted in relation to the Data Division.


    The coding of a Data Division for a given program will consist of two parts—firstly
    the programmer will pick out from the program specification all the ‘obvious’
    data entries (such as File Descriptions, accumulator areas, etc.) and secondly
    he will add to the Data Division during the coding of the Procedure Division as
    he discovers new areas or fields required by the program. At the moment we are
    concerned only with this first stage; picking out those Data Division entries
    which are implied by the program specification.


    Let us consider the specification of a simple, but realistic, program for which
    we wish to code the Data Division. The program specification is reproduced below:


    Program Specification

    Card Validate Program


    +   Input Card types 307 and 308 containing respectively details of payments received
    and credits given to customers. (Card layouts are as shown below.)


    +   Output Magnetic tape containing all input records accepted as valid by processing.
    Records are in card-image format blocked in fours.


    +   Output Printout listing all invalid card records, identifying the field in
    error. At end of a job print will be given of the total accepted payments and
    total accepted credits.


    +   Processing Files will be opened and report headings printed. Each card will
    be read and checked for validity against the following rules:


    +   1. Card type can be 307 or 308.


    +   2. Customer number must be numeric and check digit must be correct.


    +   3. For each payment or credit: date must be valid ddmmyy (N.B. check for numeric
    only) payment must be numeric amount (leading spaces)'
