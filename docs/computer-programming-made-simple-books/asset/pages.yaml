    The programmer may specify as many data-record descriptions (Chapter 19) as he
    wishes, and each of them may be of a different length. When a record is to be
    written (WRITE is fully described in Chapter 32) the programmer will quote the
    name of the data record to be written. From the description of this record the
    compiler will have determined its length and can determine whether it can be accommodated
    within the current block. For example, consider the case mentioned above where
