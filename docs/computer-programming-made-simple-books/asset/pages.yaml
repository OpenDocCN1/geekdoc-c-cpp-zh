    The 1F statement may be used to select alternative process paths depending on
    the value of a particular variable. For example, suppose the value of CHOICE determines
    the processing path required for a set of values on which certain calculations
    are to be performed. If the value of CHOICE is ''A'' then the statements beginning
    at 10 are to be executed, if the value is ''D'' the statements beginning at 16
    are to be executed, otherwise the following sequential statement is to be executed:


    # ALPHA CHOICE


