    As a final example consider the program designed to input a series of 20 values
    each of which represents a temperature. The program will convert these figures
    from either Fahrenheit to Centigrade or Centigrade to Fahrenheit depending upon
    the nature of the input values. The program will determine which conversion is
    required by requesting an indicator value from the user. If the value is 1 the
    conversion required is Fahrenheit to Centigrade and if zero Centigrade to Fahrenheit.


