  md: '# 21 Data Description—1


    # PICTURE Clause


    The class of a data item and its size (i.e. the number of characters it can contain)
    is described by means of the PICTURE clause in its data-description entry.


    # Format


    | PICTURE PIC | IS character string |


    The character string following the keyword PICTURE (or its abbreviated form PIC)
    is a combination of one or more of the symbols available for PICTURE descriptions.
    These symbols are described individually below and are followed by detailed examples
    of the use of this clause.


    # Symbols Used in the PICTURE Clause


    A When used this symbol will be the only one used in a PICTURE and it indicates
    the size of a data item of the alphabetic class. With all PICTUREs the size of
    a data item is indicated by the number of symbols. For example, a data item of
    the alphabetic class which was to contain 5 characters would be described thus:


    ```

    PICTURE IS AAAAA.

    ```


    An alphabetic data item of length 3 characters could be described thus:


    ```

    PIC IS AAA.

    ```


    +   9 Each occurrence of a 9 in the character string represents a storage location
    that will contain a numeric digit. The length of the field will be determined
    by the number of 9''s in the PICTURE character string:


    ```

    PICTURE IS 9999.

    ```


    represents the description of a numerica data item, 4 characters in length.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Data Description—1 127


    The character X specifies a data-item position of the alphanumeric class (which
    may therefore hold any character). An alphanumeric data item of length 6 characters
    would be defined:


    PICTURE IS XXXX.


    The letter S is used to indicate that a numeric data item contains a sign. The
    letter S may only occur once in a PICTURE character string and, used, must be
    the first character. As already mentioned this sign does not occupy a storage
    location and not not included in the length of the data item. The definition of
    a 4 character signed numeric data item would therefore appear thus:


    PICTURE IS S9999.


    As mentioned in Chapter 19 a numeric data item may contain an assumed decimal
    point. In other words a numeric data item, of say, 4 characters in length could
    hold the values 207.3, 2073, 2.073, or .2073, depending upon the location of the
    decimal point. Although this decimal point is not actually stored the compiler
    ''remembers'' where it is located by the occurrence of a V in the PICTURE character
    string. For example, if the 4 character numeric item mentioned above were to be
    used as a field with two places of decimal it could be defined:


    PICTURE IS V99V.


    and could hold the value, 37.29. Now to demonstrate the use of assumed decimal
    points lets add this value to a field defined:


    PICTURE IS S999V.


    and containing the value 412.7. Even though these fields are 4 characters in length,
    one will be lost (for the addition) from the first field. This is because the
    numbers are aligned on their decimal points and the final answer can only hold
    four digits (999V). The addition, as performed, would look like this:


    ```

    412.7

    37.2(9)

    449.9

    ```


    If the V character is omitted from the PICTURE of a numeric item it is assumed
    to follow the right-hand 9 (i.e. the item being defined is assumed to be an integer).
    The V character can be used in conjunction with the S character to define a signed
    number with a decimal point:


    PICTURE IS S999V.


    This field could hold a value of, -37.2.


    # Other Combinations of PICTURE Characters


    In addition to the combination of S, V, and 9 already studied, the other characters
    allowable in the PICTURE description X and A, can be combined with 9 or with each
    other. However, if this is done the overall result will be'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# 128 Computer Programming


    equivalent to a definition using all X''s. For example, consider the data item:


    ```

    033 NUM PICTURE IS 999XX,

    ```


    which could hold a value of, say, 12AB7. It is not possible to perform arithmetic
    of this field, because of the alphabetic content, so the definition is effectively
    the same as:


    ```

    033 NUM PICTURE IS XXXX.

    ```


    # Symbol Repetition


    To save the programmer the trouble of writing very long character strings (for,
    say, an alphanumeric field 30 characters in length, the COBOL compiler recognizes
    a repetition factor. The PICTURE characters A, X, and 9 may have following them
    an integer enclosed in parentheses. This integer indicates the number of occurrences
    of the PICTURE character. For example, in the case mentioned above, rather than
    write a PICTURE clause with thirty X''s the programmer could write:


    ```

    PICTURE X(30).

    ```


    Similarly, long numeric fields may be defined easily:


    ```

    PICTURE IS 9(8).

    ```


    When a V character is in use both parts of the number may be defined with the
    repetition factor:


    ```

    PICTURE IS 9(4)V9(5).

    ```


    Similarly, the S character may be prefixed to a definition with a repetition factor:


    ```

    PICTURE IS S9(6).

    ```


    # The PICTURE Clause in Use


    To see the use of the PICTURE clause let us consider once again the Payroll Master
    File seen in an earlier chapter. One of the types of record on this file has the
    following layout:


    | Dept. Code | Dept. Name | Division Code | Number of Employees | Gross Pay |


    The entire record is to be called DEPT-SUMMARY, the first two fields are to have
    the group name DEPT-DETAILS and the remaining fields the group name DEPT-TOTALS.
    Note particularly that group names do not have PICTURE clauses (since their size
    is determined by the total of the sizes of the elementary elements making up the
    group; the class of a group is always alpha-numeric).


    The record in question can be defined thus:


    ```

    01 DEPT-SUMMARY.

    02 DEPT-DETAILS.

    ```'
