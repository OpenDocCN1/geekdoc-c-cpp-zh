  md: '# 18

    File Descriptions—1


    For each file to be used during the execution of a program the programmer must
    code a file description which outlines the characteristics of each file. The file
    description is identified by the level indict FD which is followed by a number
    of independent clauses. The entry for each file is terminated by a period (full-stop).


    | General Format |

    |---|

    | FD file-name |

    | [BLOCK CONTAINS Clause] |

    | [RECORD CONTAINS Clause] |

    | [RECORDING MODE Clause] |

    | LABEL RECORDS Clause |

    | [VALUE OF Clause] |

    | [DATA RECORDS Clause]. |


    The level indicator FD must precede the file description and the FD must be followed
    by the name the programmer wishes to assign to the file. This file name is formed
    according to the rules already given for data names. The clauses which follow
    the file name are in some cases optional and can in any event appear in any order
    between file name and the period.


    The clauses shown in the general format above will mean little to the reader at
    this stage, however, they are all described below (and in Chapter 19), individually
    and where necessary further explanation is given of the properties of files of
    interest to where the COBOL programmer.


    # BLOCK CONTAINS Clause


    This clause is used to specify the size of each block (physical record) on the
    file.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# 112 Computer Programming


    | Format |

    | --- BLOCK CONTAINS [integer-1 TO] integer-2 { CHARACTERS } { RECORDS } |


    This clause need not be specified if each block contains only one record, however,
    it will be used in all other cases.


    The RECORDS option may only be used when each block contains a whole number of
    records and the length of each record is fixed (see below). Since in this case
    the block size is fixed integer-1 is omitted from the clause. Consider the case
    of a file containing blocks each of which holds 3 records:


    | Physical format Rec Rec Rec | Block | Block |

    | --- --- --- --- --- |

    | | 1 2 3 | 1 2 3 |


    the clause describing the block size for this file could be thus:


    # BLOCK CONTAINS 3 RECORDS


    This clause can be rewritten using the CHARACTERS option as shown below (assume
    each record contains 100 characters):


    # BLOCK CONTAINS 300 CHARACTERS


    The CHARACTERS option is mainly used when the block length is variable (see below)
    because the records themselves are of variable length. As will be seen, however,
    the program must given a maximum block size and a minimum block size. For example,
    consider a variable-length file which may have blocks varying from 120 characters
    in length to 316 characters in length; the clause required would be as follows:


    # BLOCK CONTAINS 120 TO 316 CHARACTERS


    The CHARACTERS option is also used for spanned files (see below) when the maximum
    block size is specified for each file. Note that the RECORDS option cannot be
    used for this type of file.


    # BLOCK CONTAINS 200


    This clause specifies a block size of 200 (CHARACTERS being the assumed option).
    A BLOCK CONTAINS clause is required for all files except those of single-blocked
    nature (i.e. those with one record per block).


    # RECORDS CONTAINS Clause


    This clause is used to specify the size of the records on a file.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# File Descriptions—I 13


    | Format |

    | RECORD CONTAINS [integer-1 TO] integer-2 CHARACTERS |


    The size of each record is completely specified when the record description is
    coded (Chapter 19) and this clause is therefore optional. However, when the clause
    is used certain rules.


    When only integer-2 is used the file must contain records which are all the same,
    fixed, length.


    # RECORD CONTAINS 80 CHARACTERS


    This clause indicates a file containing fixed-length records each of 80 characters.
    When a file contains variable-length records the maximum record size and the minimum
    record size are specified using this clause in:


    # RECORD CONTAINS 70 TO 412 CHARACTERS


    Normally the programmer will omit this clause and the compiler will calculate
    the size of each record from the descriptions given following the FD entry.


    # Recording Mode


    We have already seen mention of the existence of fixed-length and variable-length
    records. The COBOL language also recognises Undefined-length records and Spanned-length
    records. These four recording modes are described below:


    # Fixed-length Recording Mode


    Each record on the file will be the same fixed length and each record will be
    wholly contained within a block. A block may contain more than one record; the
    number of records in each block will be constant for each file.


    Since the size of each record is known and fixed it is not necessary to indicate,
    within the record itself, the length of the record.


    # Variable-length Recording Mode


    Each record on the file is of variable length although each must be wholly within
    a block. A block may contain more than one record; however, the length of the
    block will vary (up to a specified maximum—see BLOCK CONTAINS clause) according
    to the lengths of the records it contains.


    In order that the program may determine the length of each variable-length record,
    each record is preceded by a field containing the length of the record. Similarly,
    each block is preceded by a field containing the length of the block. This is
    illustrated below:


    | Length of block | Length of record 1 | Record 1 | Length of record 2 | Record
    2 | Length of record 3 | Record 3 |'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'These length fields do not have to be described, in the Data Division, by the
    programmer and their contents are not available to him. (Note—the compiler will
    automatically reserve the space for the length fields when a file requiring them
    is defined.)


    # Undefined-length Recording Mode


    Each record may be of fixed or variable length and must be wholly contained within
    one block. No length-indicator fields are included and the programmer must therefore
    determine, within the program, the length of each record read. This mode is not
    normally used in general COBOL programming.


    # Spanned-length Recording Mode


    Each record may be of fixed or variable length and may extend over more than one
    block. If a record is larger than the available space in a block then a segment
    of the record is written to fill the block. The remaining portion of the record
    is written in the next block blocks. Each segment (or portion) of a block is preceded
    by a segment-length field (which is not available to the programmer) although
    only complete records are presented to the program. A spanned record (occupying
    2 blocks) is illustrated below:


    | Block length | Segment 1 length | Segment 1 | Block length | Segment 2 length
    | Segment 2 |

    |---|---|---|---|---|---|


    If the program read this file only a single record could be provided:


    | Segment | Segment |

    |---|---|

    | 1 | 2 |


    complete record


    This method again is rarely used; however, if required the splitting into segments
    (and subsequent joining up) will be handled by the operating system.


    # RECORDING MODE Clause


    This clause is used to specify the recording mode used by the file.


    ```

    --------------------------------------------------------------------------------

    Format

    --------------------------------------------------------------------------------

    RECORDING MODE IS mode

    ---------------------------------------------------------------------------------

    ```


