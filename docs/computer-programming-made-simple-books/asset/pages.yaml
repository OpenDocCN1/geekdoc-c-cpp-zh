- img_proc: true
  md: '# 41

    Documentation Aids


    Although a COBOL program is relatively easy to read because of its use of pseudo-English
    language syntax elements and the choice by the programmer of meaningful names,
    it is still useful to be able to annotate a COBOL program with comments. This
    facility is provided with the NOTE statement:


    | Format |

    | NOTE character string |


    If a NOTE statement appears within a paragraph then the comment is terminated
    by the first period:


    ```

    CALC-A. MULTIPLY RATE BY HOURS GIVING GROSS.

    NOTE NEXT LINE DETERMINES SEX.

    IF FLAG-3 EQUALS 7 GO TO RATE-M.

    ```


    When the NOTE statement is the first to appear after a paragraph name then the
    entire paragraph is treated as a comment:


    ```

    COMMENT. NOTE THE INSTRUCTION.

    MOVE A TO B.

    IS NEVER EXECUTED.

    ```


    As the note states the MOVE statement above is not executed because it is treated
    as a comment. The NOTE statement can be used to explain complicated coding, to
    explain special techniques used, and generally to improve the readability of your
    program. The NOTE statement can only appear in the Procedure Division.


    # The COPY Statement


    When a suite of programs is being developed it is almost certain that certain
    of the files used will be required in more than one of the programs in the suite.
    When this is the case the record descriptions for the common files will appear'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# 216 Computer Programming


    in several programs and there is the possibility that mistakes will occur when
    transcribing the descriptions from one program to another. To avoid the possibility
    of such errors and to cut down the amount of work involved in writing the same
    description several times, the programmer may COPY the description into his program.


    ```

    Format

    COPY library-name

    [REPLACING word-1 BY {word-2 literal-1 identifier-1 } {word-3 BY {word-4 literal-2
    identifier-2 } 1 ...].

    ```


    The description to be copied must reside on a library available to the COBOL compiler.
    Knowing the name of the information the programmer can copy it into his program.
    The operating system in use will depend upon the facility to store record descriptions
    on a backing store in one file known as a library. The method by which record
    descriptions are written upon the particular computer system in use and is therefore
    beyond the scope of this book. However, suffice to say that when a record description
    has been prepared it is a simple task to request the operating system to transfer
    it to the library where it can be COPYEd into any program as described.


    For example, supposing the record description for a payroll file is held on the
    library under the name PAYFILE, the programmer can retrieve this into his program
    as shown:


    ```

    DATA RECORD IS PAY.

    01 PAY COPY PAYFILE.

    ```


    Suppose the description held on the library under the name PAYFILE was:


    ```

    01 PAYROLL.

    02 NAME PICTURE X(20).

    02 GROSS PICTURE 9(5).

    02 TAX PICTURE 9(3).

    ```


    The copy statement above (01 PAY COPY PAYFILE) would result in the following definition
    appearing in the program:


    ```

    01 PAY.

    02 NAME PICTURE X(20).

    02 GROSS PICTURE 9(5).

    02 TAX PICTURE 9(3).

    ```


    Note that the 01 entry of the library is replaced by the 01 entry in the program.

    The REPLACING option may be used when general layouts on the library'
  merge: -1
  pgno: 247
