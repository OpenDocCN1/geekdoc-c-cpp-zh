  md: '# 40

    Program Termination


    We have already covered the statements required to terminate programs.

    These being, for sub-programs:


    GOBACK

    or EXIT PROGRAM


    and for programs:


    STOP RUN


    The third statement above can be issued in a sub-program in which case the calling
    program is terminated and that particular RUN job is finished. The other two statements
    however may only be issued in sub-programs. There is more to ending a program
    than just issuing a STOP RUN. When looking at the use of data files we have already
    noticed that each file in use must be closed before the program is ended. In commercial
    programs there will be addional end-of-program processing required immediately
    before the file closing routine to produce the control totals.


    # Program Controls


    As a safeguard against either manual error or computer failure it is usual


    The batch total is punched into a special card which is placed at the end of the
    deck to be input into the program. When this card is read by the program the total
    is compared with the computed figure and if any discrepancy occurs the program
    will be abandoned (when only the unbalanced batch of cards are input to a program
    then only would need be rejected). The code to perform a simple batch check might
    look like this:


    ```

    CARD-READ. CARD-IN AT END GO TO CONTROLS.

    IF CARD-TYPE NOT = “BATCH"

    THEN ADD 1 TO CARD-COUNT GO TO PROCESS.

    ```'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'IF CARD-COUNT = BATCH-COUNT GO TO CONTROLS.

    DISPLAY "BATCH TOTAL UNBALANCED JOB ABANDONED"

    UPON CONSOLE.

    GO TO END-OF-JOB.


    The main purpose of batch totals is to ensure that all the input data has been
    supplied to the computer. It is not unknown for packs of data cards to be dropped
    and some lost!

    Control totals are similar to batch totals except that they occur on the ends
    of tape or disc files. For example, a sales analysis file containing, in its control
    total record, the sales value and total outstanding debt for all the customers
    on the file. These figures again be used to verify that all the data on the file
    has been correctly read (it is possible for a tape to be damaged in some way such
    that the data it contains will be corrupted). These totals are of more use for
    auditing purposes since their provision makes the investigation of cash totals
    a simple operation. When a file containing control totals is updated it is obviously
    important that the control record is also updated. This will normally be accomplished
    by adding the relevant fields from each record into an accumulator at the time
    the record is written to the updated file. When the control record for the input
    file has been verified the new control record for the updated file can be written
    to that file. The values in new control records will be summarised following the
    last page total on the program’s printed report.

    The steps mentioned above can be summarised as a check-list representing the normally
    required end-of-program functions:


    +   - verify batch totals

    - print grand totals for reports

    - verify input control totals

    - print output control totals

    - write output control totals

    - close all files

    - issue STOP RUN statement.


    # Exercises


    +   1. Why are program controls necessary?

    2. Where would batch totals occur?

    3. Where would control totals occur?'
  merge: -1
