  md: '# Data Manipulation—2 171


    If a figurative-constant is specified in either the FROM or TO option then either
    figurative-constant or a single-character non-numeric literal must be specified
    in the other option. If non-numeric literal is specified in both the FROM and
    TO option then they are of equal length.


    Let us consider firstly the case of single-character or figurative literals. Each
    occurrence of the FROM literal in identifier is transformed to the TO literal.
    For example, to change each space in a field ALPHA to an asterisk the following
    could be used:


    ```

    TRANSFORM ALPHA CHARACTERS FROM SPACE TO “*"

    ```


    This would have the same effect on ALPHA as the statement:


    ```

    EXAMINE ALPHA TALLYING ALL SPACE REPLACING BY “*"

    ```


    Suppose, however that we wish to change or transform more than one character;
    for example, we might wish to change all * to X''s. We could change all the spaces
    in a field to zeros and all we do this with two EXAMINE statements, of course;
    however we may do this with a single-transform statement:


    ```

    TRANSFORM ALPHA CHARACTERS FROM “*” to “ØX"

    ```


    In this case any character in ALPHA represented by a character in the FROM is
    changed to the corresponding character in the TO option. As another example consider
    a field ALPHA-NUM containing the alphabetic A-F which we wish to change the numeric
    characters 1-6 (such that A is replaced by 1, B is replaced by 2, and so on).
    We could therefore write the following statement:


    ```

    TRANSFORM ALPHA CHARACTERS FROM “ABCDEF” TO “123456”

    ```


    If the statement to count the number of zeros in the field NUM prior to this statement
    had been “BBACFE” then the content after execution would have been “221365”.


    # Exercises


    +   1. Write the statement to count the number of zeros in the field NUM.

    2. Where would the result of the statement in question 1 be found and what would
    the field''s attributes be?

    3. Write the statement to count the number of leading spaces in the field CHQ
    and replace them with zeros.

    4. Write the statement to count the number of characters before the first 7 in
    the field STATUS (PICTURE 9999).

    5. Write the statement to change the field ALPHA-X such that each A becomes, each
    B becomes 3, and each C becomes 2.'
