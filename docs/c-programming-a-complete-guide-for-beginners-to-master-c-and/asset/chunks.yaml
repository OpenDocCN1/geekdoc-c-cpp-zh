  trans: "\n\n这使得函数模板变得更有用，因为你只需要编写一个可以作用于所有数据类型的单一程序。\n\n模板始终在编译时进行展开。\n\n就像类模板一样，你可以创建一个具有不同参数类型的函数模板。\n\
    \n### 语法\n\n```cpp\nTemplate <class type>\n\nReturn-type function-name (arguments)\n\
    \n{\n    Function body;\n};\n```\n\n在定义函数模板时，必要时你必须在函数体和参数列表中都包含模板类型。\n\n### 示例\
    \ 1：交换交换值的函数\n\n```cpp\nTemplate <class t1>\nVoid swap (t1&num1, t1&num2)\n{\n\
    \    t1 val= num1; num1=num2; num2=val;\n};\n```\n\n调用模板函数的方法与普通函数调用相同。\n\n###\
    \ 示例 2：函数模板的实现\n\n```cpp\nTemplate <class test>\nTest max (test x, test y);\n\
    {\n    test results;\n    results=x>y? x:y;\n    return results;\n};\n\nInt main()\n\
    {\n    int a=5, b=6, c;\n    double l=4, m=6, n;\n    c= max <int> (a,b);\n  \
    \  n=max <double> (l,m);\n    cout<< c<<endl;\n    cout<<n<<endl;\n    return\
    \ 0;\n}\n```\n\n在这个示例中，`test` 是模板参数。函数 `max` 被调用两次使用了不同的参数类型（`int` 和 `double`）。当编译器实例化时，它会根据每次的类型调用函数。\n\
    \n产生的输出对象（使用特定类型实例化模板后）的类型与参数 `x` 和 `y` 的类型相同。\n\n上述程序将根据值的大小对值进行排序。如果使用数字数组，将应用排序算法对数字从小到大进行排序。\n\
    \n### 带有多个参数的函数模板\n\n就像类模板一样，你可以有多个用逗号分隔的泛型数据类型。\n\n![00232.jpeg](img/00232.jpeg)\n\
    \n### 示例：带有多个参数的模板类\n\n```cpp\nTemplate<class temp1,class temp2>\nVoid display(\
    \ temp1 j, temp2 k)\n{\n    cout<<j<<” “<<k<<”\\n\";\n}\n\nInt main()\n{\n   \
    \ J=display1(2019, “edge”);\n    K=display2(18.54, “1854);\n    return 0;\n}\n\
    // output\n2019edge\n18.541854\n```\n\n### 重载模板函数\n\n你可以使用其模板函数或使用其名称的普通函数来重载模板函数。重载可以通过以下方式实现：\n\
    \n1. 调用与模板函数的普通函数。\n2. 调用使用精确函数构建的模板函数。\n3. 在普通函数上使用普通重载函数，并对匹配模板函数的函数进行函数调用。\n\
    \n如果没有找到匹配项，系统将生成错误消息。\n\n### 示例：使用显式函数重载的模板\n\n```cpp\nTemplate <class m>\nvoid\
    \ display(m n)\n{\n    cout<<”display template function:” << n<< “\\n\";\n}\n\n\
    Void display ( int n)\n{\n    cout<<”explicit template display: “<< n<<”\\n\"\
    ;\n}\n\nInt main()\n{\n    display (80); display (15.20);\n    return 0;\n}\n\
    //output\nExplicit template display: 80 display template function: 15.20\n```\n\
    \n函数调用 `display (80)` 调用的是 `display()` 函数的普通版本而不是它的模板版本。\n\n### 成员函数模板\n\n在创建类模板时，所有的成员函数都可以定义在类外部，因为模板类中的成员函数是通过类型参数参数化的。因此，函数模板应该定义这些成员函数。\n\
    \n在类模板内部声明的成员函数（无论是内联还是非内联）隐式为函数模板。如果声明了一个模板类，它继承类模板中定义的所有模板函数。\n\n成员函数模板有三种定义方式：\n\
    \n1. 为用于实例化模板类的所使用的每个返回类型在文件作用域内进行显式定义。\n2. 在模板参数的文件作用域内定义。\n3. 在类内内联。成员函数模板可以实例化未显式生成的函数。如果一个类同时具有成员函数和显式函数，则显式定义的优先级更高。\n\
    \n#### 语法\n\n![00233.jpeg](img/00233.jpeg)\n\n#### 示例：带有成员函数的类\n\n![00234.jpeg](img/00234.jpeg)\n\
    \n### 非类型模板参数\n\n模板可以有单个类型或多个类型参数。除了类型之外，你还可以使用非类型参数。你可以使用字符串、常量、内置类型和函数名创建模板参数。\n\
    \n![00235.jpeg](img/00235.jpeg)\n\n上述模板将数组的大小作为参数传递。编译器只在执行期间才知道数组的大小。参数是在创建模板时确定的。\n\
    \n### 章节总结\n\nC++ 编程语言支持使用模板以支持泛型编程。在本章中，我们能够学习模板如何允许我们创建一个可以处理不同数据类型的类或函数族。你学习了：\n\
    \n- 使用模板通过只需调用模板参数返回类型来避免代码重复。\n- 模板允许我们创建一个可以处理不同数据类型的类或函数族。\n- 重载模板函数：你可以通过使用其模板函数或使用其名称的普通函数来重载模板函数。\n\
    - 成员函数模板：在创建类模板时，所有的成员函数都可以定义在类外部，因为模板类中的成员函数是通过类型参数参数化的。因此，函数模板应该定义这些成员函数。\n\
    - 非类型模板参数：模板可以有单个或多个类型参数。除了类型之外，你还可以使用非类型参数。\n\n"
- fmt: "\nSince streams behave in the same manner, their i/o, functions can operate\
    \ in any device. For example, you can use the same function to write to a file,\
    \ printer, scanner, and display unit.\n\nThe stream is both the source and the\
    \ destination. The source stream supplies data to the program and is commonly\
    \ known as the input stream. On the other hand, a destination stream receives\
    \ information as output and it is called an output stream.\n\n- **Input stream**:\
    \ this involves flow of bytes from an input device like keyboard into the main\
    \ memory for processing.\n- **Output stream**: this is the flow of bytes or processed\
    \ data from the main memory into an output device like the display screen.\n\n\
    C++ has both `cin` and `cout` as the predefined streams in its standard library.\
    \ these streams are automatically triggered when a program begins to execute.\
    \ `cin` stream is an input stream that is connected to the standard input device\
    \ and allows the user to enter new data into the system memory, while the `cout`\
    \ represents the output stream which is connected to an output device to display\
    \ information.\n\n## C++ stream classes\n\nI/o system in c++ consists of a hierarchy\
    \ of classes which define streams for handling the system console unit and disk\
    \ files. stream class hierarchy performs both input and output operations within\
    \ the console unit. the i/o stream classes are declared in the header file of\
    \ `ioostream`. the header file should be inserted in every program that communicates\
    \ with the console.\n\n`ios` acts as the base class for input stream (`istream`)\
    \ and `ostream` (output stream) acts as the base class for `iostream` (input/output\
    \ stream). the `ios` class is declared as a virtual base class and as a result,\
    \ only a single copy of its data members will be inherited by the `iostream` (input/output\
    \ stream.).\n\nThe `ios` class offers basic support for i/o operations on both\
    \ formatted and unformatted streams. it supports handling of both input and output\
    \ stream. the `istream` class is responsible for formatted and unformatted input\
    \ while the `ostream` class is responsible for formatted output through inheritance\
    \ concept.\n\n## Console operation using stream classes\n\n| Class name | Properties\
    \ |\n| :--- | :--- |\n| `ios` (basic input/output stream) | Has basic properties\
    \ that can be used by other input and output classes.<br>Has pointers for buffering\
    \ objects.<br>Declare functions and constants essential for performing formatted\
    \ input and output operations. |\n| `istream` (input stream) | It inherits `ios`\
    \ properties.<br>Used to declare `get()`, `getline()`, and `read()` input functions.<br>Consists\
    \ of overloaded extraction operator `>>` |\n| `ostream` (output stream) | It inherits\
    \ `ios` properties.<br>Allows you to declare output functions like `put()` and\
    \ `write()`.<br>Uses overloaded insertion operator `<<` |\n| `iostream` (input/output\
    \ stream) | Inherits all characteristics of `ios` stream and `ostream` through\
    \ the use of multiple inheritance.<br>It has both input and output functions of\
    \ both classes. |\n| `streambuf` | Provides interface to all physical devices\
    \ via the buffer.<br>It works as the base class of `filebuf` available in `ios`\
    \ files. |\n\n## Unformatted input/output operations\n\nOverloaded operators `>>`\
    \ and `<<`\n\nC++ `cin` and `cout` standard library functions for input and output\
    \ uses overloaded operators `>>` and `<<` respectively. the `>>` operator is overloaded\
    \ in the `istream` class while `<<` operator is overloaded in the `ostream` class.\n\
    \nTo read input data from the keyboard, you use the `>>` operator.\n\n```cpp\n\
    cin >> variable1 >> variable n;\n```\n\nThe input variable `variable1` up to `variable\
    \ n` is a variable name which has already been declared inside the class. the\
    \ `cin` standard tells the computer to search for the input data from the input\
    \ devices like keyboard.\n\nThe data is read character by character and assigned\
    \ to the indicated location by the `>>` operator. inputs are separated by white\
    \ spaces and if compiler encounters the white spaces when reading a variable or\
    \ doesn’t match the destination data type, it terminates. Suppose you have a class\
    \ with a variable declared as an integer, you can use the input device to input\
    \ the data.\n\n```cpp\nint num;\ncin >> num;\n```\n\nThe `cin` statement followed\
    \ by `>>` operator will prompt you to enter any value of integer type keyboard\
    \ like 50. when you enter the input data, the operator reads the value 50 assigned\
    \ to the `num` variable. To display the data on screen, you use the `cout` statement.\n\
    \n```cpp\ncout << data << n;\n```\n\nThe data all the way to, `n` can be a variable\
    \ or constant of any data type.\n\n## Put() and get() functions\n\nThe `istream`\
    \ and `ostream` classes define two types of member functions `get()` and `put()`\
    \ to handle input/output operations of a single character. the `get()` functions\
    \ fetch a new character, a blank space and even a tab in the input data. the `get(char*)`\
    \ type assigns input character to the function while `get()` returns the input\
    \ character. these functions should be invoked using an appropriate object. \n\
    \nExample:\n```cpp\nchar i;\ncin.get(i); // this allows you to get a character\
    \ from the keyboard and assign to variable i\ncout << i; // display the variable\
    \ on the screen\n```\n\nThe above code reads and displays a line of text. the\
    \ `>>` operator in the `cout` statement reads character by character and skips\
    \ any white spaces or new line character. `cin >> i` can be used instead of `cin.get(i)`\n\
    \n```cpp\ni = cin.get();\n```\n\nIn this, the value of the member function `get()`\
    \ is assigned to the variable `i`. `put()` is a member function of `ostream` class\
    \ it outputs a single line of statements or character by character. for example:\n\
    \n```cpp\ncout.put(i);\n```\n\nThis code displays a single character `i` while\
    \ `cout.put(ch)` displays the value to the `ch` variable. you pass any number\
    \ variable as argument to the `put()` member function.\n\nExample:\n```cpp\nchar\
    \ x; cin.get(x); while(x != '\\n') {\n    cout.put(x);\n    cin.get(x);\n}\n```\n\
    \nA program using `get()` and `put()` to represent i/o data.\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    int m = 0;\n    char n;\n\
    \    cout <<\"enter input text\";\n    cin.get(n);\n    while (n != '\\n') {\n\
    \        cout.put(n);\n        m++;\n        cin.get(n);\n    }\n    cout << \"\
    \\n number of characters=\" << m << \"\\n\";\n    return 0;\n}\n```\nInput:\n\
    C++ programming language.\nOutput:\nC++ programming language.\nNumber of characters\
    \ = 22\n\n## Getline() and write() function\n\nThe `getline()` and `write()` functions\
    \ are responsible for reading or displaying a line of text in an effective manner.\
    \ the `getline()` reads a whole line of text which has a new line character `\\\
    n`. when the compiler encounters the new line character, the program is executed.\
    \ a call to the function is made through:\n\n```cpp\ncin.getline(line, size);\n\
    ```\n\nThe function call invokes `getline()` function which reads the characters\
    \ entered to the system via the keyboard. once the `size-1` or `\\n` character\
    \ is encountered, the reading is terminated.\n\nExample:\n```cpp\nchar empname\
    \ [30];\ncin.getline(empname, 30);\n```\n\nExample:\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    int size = 30;\n    char country[30];\n\
    \    cout<<\"enter the name of the country:\\n \";\n    cin >> country;\n    cout<<\"\
    country name is:\"<<country<<\"\\n\\n\"; \n    cout<<\"enter another country name\
    \ again: \\n\";\n    cin.getline(country,size);\n    cout<<\"the current country\
    \ name is:\"<<country<<\"\\n\\n\";\n    return 0;\n}\n```\n//output\nEnter the\
    \ name of the country: kenya\ncountry name is:kenya\n\nenter another country name\
    \ again: uganda\nthe current country name is:uganda\n"
