    \ constructor for base2 class\nDestructor of base2 class\nZero argument constructor\
    \ for a derived class\nDestructor of the derived class\n```\n\n在上述程序中，`base1`\
    \ 和 `base2` 是基类，而 `base3` 是派生类。基类的构造函数在执行派生类之前执行。派生类的析构函数在执行基类之前执行。\n\n你可以在派生类构造函数调用基类构造函数。当你从现有基类创建派生类对象时，基类默认成为构造函数并首先执行，然后执行派生类。\n\
    \n当带有参数的派生类构造函数内部调用带有参数的基类构造函数时，你需要在声明派生类构造函数的参数时显式地提到它。\n\n基类是存在于所有类型类中的默认构造函数。见下面的示例。\n\
    \n## 语法\n\n```cpp\nClass construct\n{\n    Int x;\npublic:\n    construct()\n\
    \    {\n        cout << \"building default constructor\\n\";\n    }\n};\n\nClass\
    \ child : public construct\n{\n    Int y;\npublic:\n    Child()\n    {\n     \
    \   cout << \"default derived constructor\\n\";\n    }\n    // 带参数的构造函数\n    child(int\
    \ z)\n    {\n        cout << \"parameterized derived constructor\\n\";\n    }\n\
    };\n\nInt main()\n{\n    construct c;\n    Child c1;\n    Child c2(10);\n}\n\n\
    // output\nBuilding default constructor\nDefault derived constructor\nBuilding\
    \ default constructor\nParameterized derived constructor\n```\n\n在上面的示例中，基类是默认构造函数类，它与派生/子类对象一起被调用。下面的示例显示了带参数的基类构造函数。\n\
    \n## 语法\n\n```cpp\nClass construct\n{\n    Float x;\npublic:\n    construct(float\
    \ i)\n    {\n        x=i;\n        cout << \"parameterized constructor\\n\";\n\
    \    }\n};\n\nClass child : public construct\n{\n    Float y;\npublic:\n    child(float\
    \ j): construct(j)\n    {\n        y=j;\n        cout << \"parameterized derived\
    \ constructor\\n\";\n    }\n};\n\nInt main()\n{\n    child (10);\n}\n\n// output\n\
    Parameterized constructor\nParameterized derived constructor\n```\n\n对带参数的基构造类的显式调用允许调用带参数的派生类构造函数。基类构造函数在派生类内部调用。这允许构造函数初始化类中的对象。\n\
    \n派生类构造函数只能访问自己的类成员，而派生类对象继承基类的特征和属性。基构造函数初始化基类的成员。\n\n## C++ 中的上转型\n\n使用基类引用或指针指向子类对象被称为**上转型**（upcasting）。即：将子类地址或指针转换为其基类引用。![0028.jpeg](img/0028.jpeg)\n\
    \n## 语法\n\n```cpp\nClass baseclass\n{\n    Int i;\npublic:\n    void base()\n\
    \    {\n        cout << \"this is superclass\";\n    }\n};\n\nClass derived:public\
    \ baseclass\n{\n    Int j;\n};\n\nInt main()\n{\n    Baseclass* ptr; // 指向基类的指针\n\
    \    Derived obj;\n    ptr = &obj; // 基类的引用\n    Baseclass &ref=obj;\n}\n```\n\
    \n在下转型（downcasting）中，基类的引用或指针被转换为派生类的引用或指针。注意：构造函数和析构函数是不继承的。赋值运算符 (=) 可以重载，但不能被子类继承。\n\
    \n## 继承与静态函数\n\n（注：源文件中关于“继承与静态函数”的提供文本不完整/缺少细节，但我根据可用片段维护了其结构。）*\n1. 静态函数可以继承到派生类中。\n\
    2. 如果在派生类中重定义了静态函数，则基类中的其他重载函数会被隐藏。\n3. 所有静态成员函数都不能是虚函数。\n\n## 混合继承与虚类\n\n当一个派生类继承多个一个基类的属性时，就会导致多重继承。见示例。\n\
    \n## 语法\n\n```cpp\nClass basea\n{\n    void print();\n};\n\nClass baseb:public\
    \ basea\n{\n    // derived definition\n};\n\nClass basec:public basea\n{\n   \
    \ // derived definition\n};\n\nClass derived:public baseb, public basec\n{\n \
    \   // class definition\n};\n\nInt main()\n{\n    derived obj;\n    obj.print();\n\
    }\n```\n\n`baseb` 和 `basec` 都继承了 `basea` 的 `print()` 函数。在 `main()` 函数中调用 `obj.print()`\
    \ 会导致，编译器不知道调用哪个 `print()` 函数。为了避免这种情况，使用了虚函数。在类被继承时插入 `virtual` 关键字。\n\n```cpp\n\
    Class basea\n{\n    virtual void print();\n};\n\nClass baseb: virtual basea\n\
    {\n    // derived definition\n};\n\nClass basec: virtual basea\n{\n    // derived\
    \ definition\n};\n\nClass derived:public baseb, public basec\n{\n    // class\
    \ definition\n};\n```\n\n`virtual` 关键字告诉编译器调用两个函数中的一个。\n\n## 管理动态数据\n\nC++ 允许你为程序动态分配内存。最初，程序员可以在程序执行之前通过定义变量确定内存空间。某些情况下，内存只能在运行时确定或基于用户输入。在这种情况下，内存动态分配给程序。动态内存决定了数据的如何处理和存储。\n\
    \n指针也用于内存分配并持有变量的内存地址。当你声明变量时，它包含两个部分：\n- 变量的地址\n- 存储在变量中的值。例如：`int y=200;`\n\n\
    上述示例告诉编译器：\n1. 创建存储值的空间。\n2. 将变量 `y` 与预留内存位置关联。\n3. 在预留内存位置存储值 200。\n\n指针是 C++\
    \ 语言中非常有用的特性之一，一旦在程序中使用，它可以：\n1. 直接访问和操作内存位置。\n2. 为变量分配动态内存。\n3. 提高某些程序的效率。\n\n\
    ## 使用 new 和 delete 运算符分配和释放内存\n\nC++ 程序整合 `new` 和 `delete` 运算符来动态分配内存。`new` 运算符后跟类型指示符动态分配程序的内存。\n\
    \n如果用户输入是一个多个元素的序列，则需要 `new[]` 运算符来分配内存块。\n\n## 语法\n\n```cpp\nPointer = new return-type\n\
    \nor\n\nPointer = new return-type [size]\n```\n\n```cpp\nint *mem;\n```\n\n"
- fmt: "\n```cpp\nmem = new int [4];\n```\n\nWhen you run the program, the system\
    \ dynamically allocates memory space of the 4 elements of integer type and returns\
    \ an array of elements assigned to pointer `mem`. therefore, `mem` points directly\
    \ to a memory block with four elements of integer (`int`) type.\n\nYou can access\
    \ the first element in the array by calling `mem[0]`, while the second element\
    \ is accessed by `mem[1]`.\n\nYou can also initialize the memory with the `new`\
    \ operator, as seen below.\n\n### Syntax\n`pointer-variable = new return-type\
    \ (value);`\n\n### Example:\n\n```cpp\nint *ptr = new int (30);\nfloat *r = new\
    \ float (15)\n```\n\nThere exists a difference between a normal array and a block\
    \ of memory allocated dynamically using the `new` operator. in a normal array,\
    \ the array size is a constant expression which is determined during variable\
    \ declaration (before running the program), whereas the dynamic memory allocation\
    \ is performed using the `new` operator that assigns memory space to a program\
    \ during run time. it uses any variable value as the size for the block of elements.\n\
    \nThe system dynamically allocates memory to a program from the memory heap. non-static\
    \ and local variables are allocated memory on stack.\n\nFor any dynamically allocated\
    \ memory (`int *mem = new int[4]`) the programmer has to deallocate the memory\
    \ after the program execution. otherwise, if the memory space is not deallocated,\
    \ it will result in a memory leak. the memory should be deallocated after the\
    \ program execution terminates.\n\n### Delete Operator\n\nIn c++, the `delete`\
    \ operator deallocates the already allocated memory space to a program. this makes\
    \ the memory available for the next request to dynamically allocate space.\n\n\
    ### Syntax\n`delete pointer-variable;`\n\nor\n\n`delete [] pointer-variable;`\n\
    \nIf you dynamically allocated space to a single element using the `new` operator,\
    \ then use `delete pointer-variable` to free the memory. to free a memory allocated\
    \ to a block of elements, you use `delete []`. the arguments passed to the `delete`\
    \ operator should be either a pointer that points to a block of elements or a\
    \ null pointer. passing a null pointer has no effect to the `delete` operator.\n\
    \nFor example, `delete [] ptr;` or `delete ptr;`\n\n```cpp\n#include <iostream>\n\
    #include <new>\n\nUsing namespace std;\n\nint main ()\n{\n    int l,m;\n    int\
    \ * ptr;\n    cout << \"enter the numbers you want to print:\";\n    cin >> l;\n\
    \    ptr= new (nowrow) int[l];\n    if (ptr == nullptr)\n    {\n        cout <<\
    \ \"error: unsuccessful memory allocation\";\n    }\n    else\n    {\n       \
    \ for (m=0; m<l; m++)\n        {\n            cout << \"enter number: \";\n  \
    \          cin >> ptr[m];\n        }\n        cout << \"the numbers entered are:\
    \ \";\n        for (m=0; m<l; m++)\n        cout << ptr[m] << \", \";\n      \
    \  delete[] ptr;\n    }\n    return 0;\n}\n// // output\nEnter the numbers you\
    \ want to print: 3\nEnter number: 25\nEnter number: 50\nEnter number: 72\nThe\
    \ numbers entered are: 25, 50, 72\n\nIf the system could not allocate the memory\
    \ space requested for example, requesting a large memory allocation then the system\
    \ will return an error message. error: unsuccessful memory allocation. the new\
    \ request will throw a standard `bad_alloc` exception, unless you use the `nowrow`\
    \ with the `new` operator. this exception type handle errors by checking the pointer\
    \ value or through catching exceptions.\n\n### Handling errors with try and catch\n\
    \nComputer memory is a limited resource and sometimes it’s not a guarantee whether\
    \ the request to dynamically allocated memory to a program using the `new` operator\
    \ will be successful. the memory gets exhausted sometimes.\n\nC++ uses two standard\
    \ mechanisms to determine if the memory allocation was successful or not. if memory\
    \ allocation fails, an exception is thrown. the `nowrow` exception is used. the\
    \ `throw` exception is used to handle errors by checking the pointer value or\
    \ catching exceptions.\n\n### Syntax\n`ptr = new (nowrow) int[l];`\n\nTo avoid\
    \ memory leaks when a programmer creates memory, they should use `delete` to free\
    \ it when no longer needed. This is important of how to use `delete` to avoid\
    \ memory leaks.\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nvoid func()\n\
    {\n    int *p = new int(4);\n    delete p;\n}\n\nint main()\n{\n    int *p = new\
    \ int(4);\n    delete p;\n    return 0;\n}\n```\n\n### Chapter Summary\nInheritance\
    \ is one of the important features of object-oriented programming. it allows you\
    \ to reuse code instead of rewriting the same code. in this chapter, you have\
    \ learned:\n\n- how to derive classes from existing classes.\n- how to use both\
    \ base and derived classes.\n- how to specify what properties to be inherited\
    \ by the subclass. this requires you to define the base class before defining\
    \ the subclass.\n- about different types of inheritance.\n- how to use constructors\
    \ and destructors in deriving objects.\n- how to use base and derived constructors.\
    \ when you create a derived object, the base class constructor is by default and\
    \ it is executed first followed by the derived class.\n- how to make a call of\
    \ base class inside the derived class constructor that has parameters like the\
    \ base class constructor.\n- how to use upcasting feature in c++ to allow you\
    \ to reference your base class.\n- how to use a pointer to point directly to a\
    \ subclass.\n- how to dynamically allocate memory space for your program during\
    \ run-time.\n- how to use `new` and `delete` operators to allocate and deallocate\
    \ memory when not needed.\n- how to use `delete` or `delete []` operators to help\
    \ you avoid memory leaks in your program.\n- how to use `try catch` exceptions\
    \ to test whether memory allocation is successful or has failed.\n\nIn the next\
    \ chapter you will learn about polymorphism. at the end of the chapter you will\
    \ know what polymorphism is and how to apply different types of polymorphism during\
    \ compile and runtime.\n"
