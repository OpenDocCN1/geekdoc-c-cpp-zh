    *   Learning ho,w to, wo,rk with c++ o,bjects and initialize them.


    *   Ho,w to, create classes and class definitio,n.


    *   Applying the co,ncept o,f data data abstractio,n and encapsulatio,n to, extend
    the po,wer o,f pro,gramming language.


    *   Learning ho,w pro,grammers can create user-defined data types and ho,w encapsulatio,n
    and abstractio,n wo,rk in o,rder to, pro,vide the needed info,rmatio,n to, the
