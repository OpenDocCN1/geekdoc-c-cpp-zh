    \ print (); // 静态绑定\n}\n```\n在上面的示例中，我们使用基对象和派生对象调用了重写函数。\n\n### 虚函数\n\n虚函数是基类成员函数，在派生类中被重写。函数调用会导致晚期绑定。也就是说，它指示编译器对重写函数执行晚期绑定。\n\
    \n要使基类的成员函数变为虚函数，在声明函数时使用 `virtual` 关键字。\n\n```cpp\nvirtual void function-name()\n\
    ```\n\n"
