    };\n\nint main()\n{\n  clrscr();\n  triangle tri;\n  cout << \"the area of triangle\
    \ is:\" << tri.area() << \"sq.units\\n\";\n  getch();\n}\n```\n\n// 输出 \n`The\
    \ area of triangle is: 155.8 sq.units`\n\n# 构造函数的特点\n\n1. 它们应该始终声明在公共（public）访问修饰符下。\n\
    2. 构造函数没有返回类型，甚至没有空（`void`）返回。\n3. 创建新对象会导致自动调用构造函数。\n4. 派生类不能继承构造函数，但它可以调用基类构造函数。\n\
    5. 构造函数可以像其他函数一样具有默认参数。\n6. 构造函数永远不能作为虚函数（virtual functions）。\n7. 你不能引用构造函数的地址。\n\
    \n# 构造函数的类型\n\nC++ 语言有多种类型的构造函数来扩展其功能。这些构造函数包括：默认、参数化、重载和拷贝。\n\n## 默认构造函数\n\n\
    默认构造函数没有这些参数或参数。见下例。\n\n```cpp\nclass cube\n{\npublic:\n  int x;\n  cube()\n \
    \ {\n    x = 5;\n  }\n};\n\nInt main ()\n{\n  cube c;\n  cout << c.x;\n}\n```\n\
    \n一旦对象被创建，就会立即调用构造函数，从而初始化数据成员。默认构造函数初始化对象成员。如果你没有定义构造函数，编译器会隐式地为类分配一个默认构造函数。\n\
    \n如果编译器返回默认构造函数，它将用默认值初始化对象数据成员，该值初始为 0 或任何随机整数值。\n\n## 参数化构造函数\n\n这是一种带有参数的构造函数。你可以为不同对象的数据成员提供不同的参数或值。\n\
    \n构造函数的初始值在声明构造函数时作为参数传递。这是通过：\n* 显式调用构造函数。\n* 隐式调用构造函数实现的。\n\n见下例。\n\n```cpp\n\
    class cube\n{\npublic:\n  int val;\n  cube( int x)\n  {\n    val = x;\n  }\n};\n\
    \nInt main ()\n{\n  cube c (5);\n  cube c1 (10);\n  cube c2 (15);\n  cout << c.val;\n\
    \  cout << c1.val;\n  cout << c2.val;\n}\n```\n\n## 重载构造函数\n\n构造函数不仅初始化数据成员，它们与其他成员函数没有区别。它们也像多态中一样执行函数重载。默认构造函数和参数化构造函数可以充当重载构造函数，其中其中一个没有参数，而另一个有参数。\n\
    \n重载构造函数允许你在类中有多个构造函数，每个构造都有不同的参数列表。\n\n见下例。\n\n```cpp\n#include <iostream>\n\
    Using namespace std;\n\nclass overload\n{\npublic:\n  double area;\n  overload()\n\
    \  {\n    area = 0;\n  }\n  overload(float num1, float num2)\n  {\n    area =\
    \ num1 * num2;\n  }\n  void display()\n  {\n    cout << area << endl;\n  }\n};\n\
    \nInt main()\n{\n  // 使用相同类名不同参数的构造函数重载\n  overload c1;\n  overload c2(8.6, 6.2);\n\
    \  c1.display();\n  c2.display();\n}\n```\n\n// 输出\n`0`\n`53.32`\n\n## 拷贝构造函数\n\
    \nC++ 提供了一种特殊的构造函数，它将对象作为参数传递给函数，并将数据成员从一个对象拷贝到另一个。拷贝构造函数创建与现有对象特征相同的新对象，因此拷贝构造函数充当重载构造函数，因为它从其他对象声明并初始化对象。\n\
    \n拷贝构造函数有两种：\n* 默认拷贝：如果程序员没有定义拷贝，编译器会自动定义这种类型的拷贝。\n* 用户定义拷贝：程序员定义的拷贝。\n\n语法：`class_name\
    \ (class_name &object_name);`\n\n示例 1：\n```cpp\nclass copy\n{\n  copy (copy &y)\
    \ // 拷贝构造函数\n{\n}\n};\n```\n要调用上述示例中的拷贝构造函数，你必须初始化对象。可以通过以下任何方式完成：\n* `copy c2\
    \ (c1)`\n* `copy c2=c1`\n\n示例 2：\n```cpp\n#include <iostream>\nUsing namespace\
    \ std;\n\nclass copy\n{\nPublic:\n  float i;\n  copy(float x) // 参数化构造函数。\n  {\n\
    \    i=x;\n  }\n  copy(copy &y) // 拷贝构造函数定义\n  {\n    i = y.i;\n  }\n};\n\nInt\
    \ main()\n{\n  copy c1(35); // 调用参数化构造函数。\n  copy c2(c1); // 调用拷贝构造函数。\n  cout<<c2.i;\n\
    \  Return 0;\n}\n```\n\n// 输出\n`35`\n\n当调用构造函数时，会产生两个拷贝：\n* 浅拷贝\n* 深拷贝\n\n###\
    \ 浅拷贝\n\n编译器创建的默认构造函数只能产生浅拷贝。由于是通过拷贝对象的变量来创建对象的，因此它是浅拷贝。\n\n见下例：\n\n```cpp\nclass\
    \ example\n{\n  Int num1;\n  Int num2;\n  Int *ptr;\nPublic:\n  Example()\n  {\n\
    \    ptr=new int;\n  }\n  void setdata(int a,int b,int c)\n  {\n    num1=a;\n\
    \    num2=b;\n    *ptr=c;\n  }\n  void printdata()\n  {\n    cout << \"num1 value\
    \ is : \" << num1 << endl;\n    cout << \"num2 value is : \" << num2 << endl;\n\
    \    cout << \"*ptr value is : \" << *ptr << endl;\n  }\n};\n\nInt main()\n{\n\
    \  example e1;\n  e1.setdata (8, 9, 12);\n  example e2 = e1;\n  e2.printdata();\n\
    \  Return 0;\n}\n```\n\n// 输出\n`Num1 value is: 8`\n`Num2 value is: 9`\n`*ptr value\
    \ is: 12`\n\n在上述示例中，没有定义构造函数，因此编译器通过调用默认拷贝构造分配 `example e2= e1`。在这种情况下，编译器创建现有对象的拷贝。指针\
    \ `ptr` 指向两个对象的内存位置。\n\n如果一个对象的内存被释放，另一个内存也会被释放，因为两个字段指向同一块内存。为了避免这个问题，你可以定义一个使用深拷贝技术的拷贝构造函数（用户定义的构造函数）。\n\
    \n### 深拷贝\n\n深拷贝是一种为拷贝动态分配内存然后拷贝实际值的技术。源和拷贝具有不同的内存。\n\n在深拷贝中，程序员必须编写用户定义的构造函数。\n\
    \n语法：\n```cpp\nclass example\n{\nPublic:\n  Int num1;\n  Int num2;\n  Int *ptr;\n\
    \  Example()\n  {\n    ptr=new int;\n  }\n  Example (example &y)\n  {\n    num1=y.num1;\n\
    \    num2=y.num2;\n    Ptr=new int;\n    *ptr=*(y.ptr);\n  }\n  void setdata(int\
    \ a,int b,int c)\n  {\n    num1=a;\n    num2=b;\n    *ptr=c;\n  }\n  void printdata()\n\
    \  {\n    cout << \"num1 value is : \" << num1 << endl;\n    cout << \"num2 value\
    \ is : \" << num2 << endl;\n    cout << \"*ptr value is : \" << *ptr << endl;\n\
    \  }\n};\n\nInt main()\n{\n  example e1;\n  e1.setdata (5, 7, 9);\n  example e2\
    \ = e1;\n  e2.printdata();\n  Return 0;\n}\n```\n\n# 析构函数\n\n析构函数是一种特殊的成员函数，当在该类对象上调用\
    \ `delete` 操作或当类中的对象离开作用域时执行。\n\n"
- fmt: "\nA destructor will have the same name as the class with a prefix of the tilde\
    \ operator. it has no return values, and you can’t pass any parameters to it.\
    \ Destructor is an important C++ feature which frees memory space when it’s no\
    \ longer needed.\n\nExample: the following example explains how to use constructors\
    \ and destructors in a program.\n\n### Syntax\n\n```cpp\n// constructor & destructor\n\
    \nClass Crectangle\n{\n    Int *len, *wid;\n\nPublic:\n    Crectangle (int, int)\
    \ // constructor\n    ~Crectangle () // destructor\n    Int area()\n    {\n  \
    \      return (len*wid);\n    }\n};\n\nCrectangle::Crectangle (int c, int d)\n\
    {\n    *len=c;\n    *wid=d;\n};\n\n// destructor to free the memory\nCrectangle\
    \ ::Crectangle ()\n{\n    Delete len;\n    Delete wid;\n};\n\nint main()\n{\n\
    \    Crectangle rect a (c,d);\n    Crectangle rect b (c,d);\n    cout << \"area\
    \ of a rectangle is: \" << rect a.area();\n    cout << \"area of a rectangle is:\
    \ \" << rect b.area();\n    cout << endl;\n}\n```\n\n### Special characteristics\
    \ of destructors\n\n1. When an object is destroyed, a constructor is called automatically.\n\
    2. Just like other member functions, destructors follow the same access rules.\n\
    3. A destructor de-initializes an object before it gets out of scope.\n4. Destructors\
    \ don't have a return type and do not even support `void`.\n5. Destructor functions\
    \ can never be inherited.\n6. A destructor doesn't allow the use of static destructors.\n\
    7. A destructor can make calls to member functions of its class.\n8. If an object\
    \ in a class has a destructor, then that object can't be a member of the union.\n\
    \n### summary\n\nIn this chapter, you have learned about constructor, destructor\
    \ and functions overload. constructors are very essential in C++ language since\
    \ they help build values in objects through automatic initialization. specifically,\
    \ you learned:\n\n● how to declare and initialize constructors.\n● how a constructor\
    \ initializes an object of the class type.\n● how a destructor de-initializes\
    \ the object after execution. a destructor helps free the memory space by de-initializing\
    \ the object after it has been destroyed.\n● about parameterized constructors\
    \ with parameters. you will be able to pass different parameters and values to\
    \ the data members on different objects. you also, learned how to make calls to\
    \ the constructor.\n● how to use the overloaded constructor and copy constructor.\n\
    ● to understand the two types of copy constructors: shallow and deep.\n● how to\
    \ create a project with both types of copy constructors and how to make calls\
    \ to the objects created.\n\nIn the next chapter you will learn how to use templates.\
    \ at the end of the chapter you will be able to create class templates, function\
    \ temples and how to create templates with multiple parameters.\n\n## Chapter\
    \ seven: templates\n\n### Introduction to templates\n\nTemplates are an important\
    \ feature in C++ programming language, as it allows functions and classes to use\
    \ generic types. they play an essential role on how functions and classes work\
    \ by allowing them to define different data types without rewriting each other.\n\
    \nUsing templates, you can write a generic code that can be used with any data\
    \ type. all you need is to pass the data types as parameters. templates promote\
    \ code reusability and improve the flexibility of the program. you can create\
    \ a simple class or a function and pass data types as parameters and implement\
    \ the code to be used by any data type. whenever you want to use the function,\
    \ you make a call to the function and specify the return type.\n\nFor example,\
    \ if you use `sort()` function to sort data in, you can pass different data types\
    \ as parameters to the function. based on the data type passed to the algorithm,\
    \ you don't have to write and maintain multiple codes irrespective of that particular\
    \ data type. therefore templates are used in situations where you need code to\
    \ be reusable with more than one data type. Templates are of great importance\
    \ when dealing with multiple inheritance and overloading.\n\n### Types of templates\n\
    \nTemplates are implemented in two ways:\n● using function templates\n● using\
    \ class templates\n\nA template can be defined as a macro, that when you define\
    \ an object of a specific type, the template definition substitutes it with appropriate\
    \ data type. templates are often referred to as parameterized class since a specified\
    \ data type will replace the defined parameter during execution.\n\n#### Class\
    \ templates\n\nSyntax\n\n```cpp\nTemplate <class identifier>\nClass class-name\n\
    {\n    // class member definitions\n};\n```\n\nExample: `images/0231.jpeg`\n\n\
    A class template definition is similar to normal class definition except that\
    \ in templates, you add a prefix `<class m>` where `m` is the type. the template\
    \ prefix tells the compiler that a class template is declared which uses `m` as\
    \ the type name in declaration. in this case, the class is a parameterized class\
    \ that uses `m` as its arguments. type `m` can be replaced by any data type by\
    \ using user-defined data type.\n\nIf a class is derived from class template,\
    \ then it’s called a template class. the objects of the template class are defined\
    \ as follows: `ClassName<type> objectname(arglist);`. Creating a derived class\
    \ from class template you have to debug the template before converting it to a\
    \ class. the compiler checks for errors in a template class after instantiation\
    \ has taken place.\n\nExample: class template\n\n```cpp\nTemplate <class tt>\n\
    Class rectangle\n{\n    tt width;\n    tt height;\nPublic:\n    void setvalues(tt\
    \ num1, tt num2)\n    tt area()\n    {\n        tt a;\n        a=width*height;\n\
    \        return a;\n    }\n};\n\nvoid rectangle <tt> ::setvalues (tt num1, tt\
    \ num2)\n{\n    width=num1;\n    height=num2;\n}\n\nint main()\n{\n    rectangle\
    \ rect a;\n    rectangle <int> rect a (5,6);\n    rectangle rect b;\n    rectangle\
    \ <float> rect b (5.6,4);\n    cout << rect a.setvalues()\n    cout << rect b.setvalues()\n\
    \    return 0;\n}\n// output\nrect a=30\nrect b=22.4\n```\nThe above program creates\
    \ a class of type `tt`. the `<tt>` in the `void rectangle <tt> ::setvalues (tt\
    \ num1, tt num2)` specifies that the function parameter is also a class template\
    \ parameter and should always be included when calling a class.\n\n#### Class\
    \ templates with multiple parameters\n\nYou can also have more than one generic\
    \ data type in a class. you can declare the generic type class with a comma-separated\
    \ list inside the template specification.\n\nSyntax\n\n```cpp\nTemplate <class\
    \ xy, class xyz, …>\nClass class-name\n{\n    // function body;\n};\n```\n\nExample:\
    \ class with two generic types\n\n```cpp\nTemplate<class f1,class f2>\nClass numbers\n\
    {\n    f1 j; f2 k;\nPublic:\n    numbers (f1 x, f2 y)\n    { \n        j=x; k=y;\n\
    \    }\n    void print()\n    {\n        cout<<j<<\"and\"<<k<<\"\\n\";\n    }\n\
    };\n\nint main()\n{\n    Numbers <float, int> numbers1 (2.53, 253);\n    Numbers\
    \ <int, char> numbers2 (50,'z');\n    Numbers1.print();\n    Numbers2.print();\n\
    \    Return 0;\n};\n// output\n1.53 and 253\n50 and z\n```\n\n### Function templates\n\
    \nFunction templates work like a normal function except that the normal function\
    \ works with only a single data type, while templates accommodate multiple data\
    \ types. with templates, you can overload a normal function so as to work with\
    \ different data types.\n"
