  trans: "\n\n```cpp\nmem = new int [4];\n```\n\n当你运行程序时，系统会动态分配一个包含 4 个整数类型元素的内存空间，并返回一个分配给指针\
    \ `mem` 的元素数组。因此，`mem` 直接指向一个包含四个整数（`int`）类型元素的内存块。\n\n你可以通过调用 `mem[0]` 访问数组的第一个元素，而通过\
    \ `mem[1]` 访问第二个元素。\n\n你也可以使用 `new` 运算符初始化内存，如下所示。\n\n### 语法\n`pointer-variable\
    \ = new return-type (value);`\n\n### 示例：\n\n```cpp\nint *ptr = new int (30);\n\
    float *r = new float (15)\n```\n\n普通数组与使用 `new` 运算符动态分配的内存块之间存在差异。在普通数组，数组大小是在变量声明期间（程序运行前）确定的常量表达式；而动态内存分配是使用\
    \ `new` 运算符在运行时为程序分配内存空间的。它可以使用任何变量值作为元素块的大小。\n\n系统从内存堆（heap）为程序动态分配内存。非静态变量和局部变量在栈（stack）上分配内存。\n\
    \n对于任何动态分配的内存（`int *mem = new int[4]`），程序员必须在程序执行后释放内存。否则，如果内存空间没有释放，将导致内存泄漏。内存应该在程序执行结束后释放。\n\
    \n### delete 运算符\n\n在 C++ 中，`delete` 运算符释放程序已分配的内存空间。这使得内存可以供下一次动态分配空间的请求。\n\n\
    ### 语法\n`delete pointer-variable;`\n\n或\n\n`delete [] pointer-variable;`\n\n如果你使用\
    \ `new` 运算符为单个元素动态分配了空间，则使用 `delete pointer-variable` 来释放内存。要释放分配给元素块的内存，你使用 `delete\
    \ []`。传递给 `delete` 运算符的参数应该是指向元素块的指针或空指针（null pointer）。传递空指针对 `delete` 运算符没有影响。\n\
    \n例如，`delete [] ptr;` 或 `delete ptr;`\n\n```cpp\n#include <iostream>\n#include\
    \ <new>\n\nUsing namespace std;\n\nint main ()\n{\n    int l,m;\n    int * ptr;\n\
    \    cout << \"enter the numbers you want to print:\";\n    cin >> l;\n    ptr=\
    \ new (nowrow) int[l];\n    if (ptr == nullptr)\n    {\n        cout << \"error:\
    \ unsuccessful memory allocation\";\n    }\n    else\n    {\n        for (m=0;\
    \ m<l; m++)\n        {\n            cout << \"enter number: \";\n            cin\
    \ >> ptr[m];\n        }\n        cout << \"the numbers entered are: \";\n    \
    \    for (m=0; m<l; m++)\n        cout << ptr[m] << \", \";\n        delete[]\
    \ ptr;\n    }\n    return 0;\n}\n// // output\nEnter the numbers you want to print:\
    \ 3\nEnter number: 25\nEnter number: 50\nEnter number: 72\nThe numbers entered\
    \ are: 25, 50, 72\n```\n\n如果系统无法分配请求的内存空间（例如请求大内存内存分配），系统将返回错误信息：error: unsuccessful\
    \ memory allocation。新的请求将抛出一个标准的 `bad_alloc` 异常，除非你在使用 `new` 运算符时使用了 `nowrow`。这种异常类型通过检查指针值或捕获异常来处理错误。\n\
    \n### 使用 try 和 catch 处理错误\n\n计算机内存是有限的资源，有时无法保证使用 `new` 运算符向程序动态分配内存的请求会成功。内存有时会耗尽。\n\
    \nC++ 使用两种标准机制来确定内存分配是否成功。如果内存分配失败，则会抛出一个异常。使用了 `nowrow` 异常。使用 `throw` 异常通过检查指针值或捕获异常来处理错误。\n\
    \n### 语法\n`ptr = new (nowrow) int[l];`\n\n为了避免程序员在创建内存时发生内存泄漏，他们应该在不再需要时使用 `delete`\
    \ 释放它。这是使用 `delete` 避免内存泄漏的重要点。\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nvoid func()\n{\n    int *p = new int(4);\n    delete p;\n}\n\nint main()\n\
    {\n    int *p = new int(4);\n    delete p;\n    return 0;\n}\n```\n\n### 章节总结\n\
    继承是面向对象编程的重要特性之一。它允许你重用代码而不是重写相同的代码。在本章中，你学习了：\n\n- 如何从现有类派生类。\n- 如何同时使用基类和派生类。\n\
    - 如何指定子类继承哪些属性。这要求你在定义子类之前定义基类。\n- 关于不同类型的继承。\n- 如何在派生对象中使用构造函数和析构函数。\n- 如何使用基类和派生类构造函数。当你创建一个派生对象时，基类构造函数默认首先执行，然后是派生类。\n\
    - 如何在派生类构造函数内部调用带有参数的基类构造函数。\n- 如何使用 C++ 中的上转型（upcasting）特性来允许你引用基类。\n- 如何使用指针直接指向子类。\n\
    - 如何在运行时为你的程序动态分配内存空间。\n- 如何使用 `new` 和 `delete` 运算符在不需要时分配和释放内存。\n- 如何使用 `delete`\
    \ 或 `delete []` 运算符帮助你避免程序中的内存泄漏。\n- 如何使用 `try catch` 异常测试内存分配是否成功或失败。\n\n在下一章中，你将学习多态。在章节结束时，你将了解什么是多态，以及如何在编译和运行时应用不同类型的多态。\n\
    \n"
- fmt: "\n# Polymorphism\n\nPolymorphism is a feature that allows an object to have\
    \ more than one form. if you have multiple classes that relate to each other by\
    \ inheritance, the classes are using the polymorphism concept. when using inheritance,\
    \ polymorphism is executed by use of overriding function. that is, both the superclass\
    \ and subclass have same declared member function but different function definition.\n\
    \nIn our previous chapter, the inheritance feature allowed us to create a new\
    \ derived class that inherited attributes and properties of another class. polymorphism\
    \ uses similar methods to perform different tasks. it allows you to perform a\
    \ single task using different forms. for example, a woman can have different characteristics\
    \ depending on the situation, like being a wife, a mother, and an employee.\n\n\
    Polymorphism is divided in two:\n\n- runtime polymorphism\n- compile time polymorphism\n\
    \n![00229.jpeg](images/00229.jpeg)\n\n## Compile time Polymorphism\n\nCompile\
    \ time polymorphism is also known as static polymorphism, and it indicates the\
    \ existence of an entity in more than one physical form. in static polymorphism,\
    \ functions are bound based on their signature (data type and the number of parameters\
    \ present). the function calls represent an early binding because they’re made\
    \ on the basis of data type and the sequence of parameters passed.\n\nCompile\
    \ time polymorphism is implemented using overriding function and operator overloading.\n\
    \n### Overloading function\n\nFunction overloading is a situation where you have\
    \ multiple functions with the same name but different parameters. these functions\
    \ have parameters with different data types or changes in the number of parameters\
    \ being passed.\n\n#### Syntax\n```\nInt area (int x);\nInt area (int x, int y);\n\
    ```\n\nSee example below.\n\n```cpp\n#include <iostream.h>\n\nusing namespace\
    \ std;\n\nclass addition {\npublic:\n    float sum(float x, float y){\n      \
    \  return x+y;\n    }\n\n    float sum(float x, float y, float z){\n        return\
    \ x+y+z;\n    }\n};\n\nint main() {\n    addition obj;\n    // a call to sum function\
    \ with two parameters\n    cout << \"total sum: \" << obj.sum(8.80, 15.20) <<\
    \ endl;\n    //call to the second function with three parameters\n    cout <<\
    \ \"total sum: \" << obj.sum(18.5, 26.4, 30.0);\n    return 0;\n}\n// output\n\
    // Total sum: 24.0\n// Total sum: 74.9\n```\n\nOverloading functions improve code\
    \ readability as well as code reusability as shown above. you can perform the\
    \ same task to functions with a different parameter list.\n\n### Operator overloading\n\
    \nOperator overloading allows you to overload operators. for example, you can\
    \ use operator (`+` ) to join two strings together. if you use the addition operator\
    \ between two integers, it adds them but when the operator is placed between strings,\
    \ it concatenates or joins them.\n\nTo overload an operator, you have to declare\
    \ a class member function whose name is `operator` and then follow with the operator\
    \ sign you want to use.\n\nType operator-sign (parameters)\nFor example: `xyz\
    \ operator + (xyz)` / using operator overloading\n\n#### Syntax\n```cpp\n#include<iostream.h>\n\
    \nusing namespace std;\n\nclass xyz {\nprivate:\n    int a,b;\npublic:\n    Xyz()\
    \ {}\n    void getvalues() {\n        cout<<\"enter value of a and b\";\n    \
    \    cin>>a>>b;\n    }\n    void setvalues(float x, float y) {\n        x=a;\n\
    \        y=b;\n    }\n    void setvalues(double num1, double num2) {\n       \
    \ num1=a;\n        num2=b;\n    }\n    void display() {\n        cout<<\"the value\
    \ for a is:\"<<a<<\"the value for b is:\"<<b<<endl;\n    }\n    double operator\
    \ +(xyz);\n};\n\ndouble xyz::operator +(xyz) {\n    return (a+b);\n}\n\nint main()\
    \ {\n    xyz x1,x2,x3;\n    x1.getvalues(10,15);\n    x2.setvalues(6,8);\n   \
    \ x3.setvalues(12,8);\n    x1.display();\n    x2.display();\n    x3.display();\n\
    \    return 0;\n}\n```\n\n## Run-time Polymorphism\n\nRun-time polymorphism is\
    \ also called dynamic polymorphism. in this type of polymorphism, functions change\
    \ their form depending on the situation. if a function exists in different forms\
    \ and responds to different function calls made during running time, then it is\
    \ dynamic polymorphism. Runtime polymorphism supports dynamic binding and makes\
    \ programs more flexible when executed. In dynamic binding, a function call is\
    \ made at run-time and it depends on the function content at run-time. if you\
    \ change the contents of the function, you will end up with different functions\
    \ that share the same name but have different body.\n\nDynamic polymorphism changes\
    \ an entity based on the situation. if a function exists in different forms, the\
    \ function calls are made during execution time. Dynamic binding is also known\
    \ as late binding, and it improves the flexibility of a program being executed.\
    \ Static binding is more efficient than dynamic binding in some cases. if you\
    \ have a static function you don’t need a run-time search, while dynamic functions\
    \ for run-time search. most function calls in dynamic binding are resolved at\
    \ execution time. polymorphism is implemented using overriding functions and virtual\
    \ functions.\n\n### Overriding function\n\nFunction overriding allows you to have\
    \ the same function name in the superclass and subclass. the subclass inherits\
    \ the data members and functions in the superclass. you can create an overriding\
    \ function in the subclass by creating the same functions with the same argument\
    \ list. Function overriding is done only in the derived class, and it is achieved\
    \ during run time. Overriding function is redefining a base class inside the derived\
    \ class with the same return type and parameters.\n\n```cpp\nclass super {\npublic:\n\
    \    void print() {\n        cout << \"this is a base class\";\n    }\n};\n\n\
    class subclass : public super {\npublic:\n    void print() {\n        cout <<\
    \ \"this is a derived class\";\n    }\n};\n// The print () in the base class is\
    \ overridden in the derived class.\n```\n\n### How to call overriding function\n\
    \nYou can make a call to the overriding function in the `main()` function. the\
    \ function call and the function body connects through the binding process. if\
    \ the connections occur before runtime it is called early binding, static or compile-time\
    \ binding.\n\n```cpp\nclass super {\npublic:\n    void print() {\n        cout\
    \ << \"this is a base class\";\n    }\n};\n\nclass subclass : public super {\n\
    public:\n    void print() {\n        cout << \"this is a derived class\";\n  \
    \  }\n};\n\nint main () {\n    super b; //creating object for base class\n   \
    \ subclass d; // creating object for derived class\n    b.print(); // static binding\n\
    \    d.print();\n    return 0;\n}\n// output\n// This is a base class\n// This\
    \ is a derived class\n```\n\nSee below for an example of calling the above base\
    \ function using pointers.\n\n```cpp\nint main () {\n    super *b; //creating\
    \ object pointer for base class\n    subclass d; // creating object for derived\
    \ class\n    b = &d;\n    b -> print (); // static binding\n}\n```\nIn the above\
    \ example, we have made a call to the overridden function using base object and\
    \ derived object.\n\n### Virtual functions\n\nA virtual function is a base class\
    \ member function which is overridden in the derived class. the function call\
    \ results in late binding. that is, it instructs the compiler to perform late\
    \ binding on the overridden function.\n\nTo make member functions of the base\
    \ class virtual, a virtual keyword is used when declaring the function.\n\n```cpp\n\
    virtual void function-name()\n```\n"
