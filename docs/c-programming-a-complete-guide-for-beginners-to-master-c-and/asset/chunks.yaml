    # Constructors and Destructors


    During a program execution, the compiler automatically calls for the `constructor`
    and `destructor` variables. `constructors` and `destructors` can be used in the
    base class and also in the derived class. when the constructor is used in the
    derived class, the arguments will be passed to the base class.


    Upcasting is another feature which utilizes the use of base class reference or
    a pointer directly to a subclass. in this chapter, you are able to learn how to
    use upcasting and downcasting features to create a base class.


    # Dynamic Memory Allocation


    C++ allows you to dynamically allocate memory space to programs. you can allocate
    the memory space to a program by initially defining the program variables before
    the program executes. in such a case, the memory is determined during run-time
    or based on the user inputs. Dynamically, allocation is achieved through the use
    of `new` and `delete` operators.


    The `new` operator followed by the data type specifier automatically allocates
    memory space to the file. it allows you to allocate memory to an array of elements
    using the `new[]` operator. the `delete` operator deallocates the memory thus
    making the memory available for other programs when dealing with multiple elements
    the `delete []` operator is used to deallocate memory space. if you create a memory
    and forget to delete it, it creates a memory leak. therefore, any memory created
    on the heap should be freed when no longer in use to avoid creating a memory leak.


    # Polymorphism


    Polymorphism is an op feature that enables you to have an object with more than
    one form. creating multiple inheritance in a class results in polymorphism. polymorphism
    is divided into two: run-time polymorphism and compile time polymorphism. run-time
    polymorphism is achieved by use of overloading functions and virtual functions,
    while compile time polymorphism is achieved via overriding function and operator
    overloading. you now have practical knowledge about how to create virtual functions,
    overloading functions, and overriding functions. you also learned how to access
    the private member function in a derived class using `virtual` keyword and how
    to create abstract classes and pure virtual functions.


    # Review


    In chapter six, we discussed how constructors and destructors work, characteristics
    of constructors, how to define and declare a constructor class, and working with
    different types of constructors. we also discussed in class destructor and how
    to declare a class destructor.


    # Templates


    Templates allows functions and classes to use generic type. this plays an important
    role on how functions and classes work by allowing users to define different data
    types without the need of rewriting the code. a template allows you to create
    a generic class which supports any data type. there are two main types of templates:
    function templates and class templates.


    A class template works like a normal class with a prefix `template` followed by
    the class identifier. class templates accept members with any type of arguments.
    these templates are mostly used in implementing containers.


    you can also create a derived class from the class template through a process
    known as instantiation. the derived class is known as template class. you can
    also pass multiple parameters to a class template. a multiple parameter class
    template supports more than one generic data type. the generic type classes are
    separated by commas.


    Function templates accommodate multiple data types compared to the normal function
    which only accommodates a single data type. templates allow you to overload a
    normal function with different data types. this makes them more useful since you
    only have to write a single program that can work with all data types. in this
    tutorial, you learned to create templates with multiple parameters, how to use
    overloading template functions and how to create member function templates.


    # Input/Output


    This programming language supports a lot of libraries which are used in performing
    the input and output functions. the input/output operations are performed using
    a series of bytes known as streams. this chapter discusses the input/output streams
    used in running the program effectively. a stream acts as a sequence of bytes
    forming the source and destination of input/output data. the source stream supplies
    data to a program through the use of an input device while the destination stream
    is used to receive an output from the program.


    Input/output operations are implemented through the use of stream concepts and
    stream classes. these stream classes are declared in the header file of the `iostream`.
    c++ stream classes act as a logical device that accepts data. these stream classes
    act as a logical device that accepts data. input/output operations are implemented
    through the use of stream concepts and stream classes. these stream classes are
    declared in the header file of `iostream`.


    Stream/output a consists of a hierarchy of stream classes. there are hierarchy
    of stream classes like `istream` and `ostream`. The input/output operations are
    performed using `>>` and `<<`. the `>>` is used for input while `<<` is used for
    output. the `>>` is used to access data while `<<` is used to display.


    Input/output operations are implemented through the use of stream concepts and
    stream classes. these stream classes are declared in the header file of `iostream`.
    c++ stream classes act as a logical device.


    # File Handling


    Each file created has two types of pointers: the input pointer and the output
    pointer. the input pointer reads the contents of the file while the output pointer
    is used to write into the file. whenever an i/o operation takes places, the specific
    file pointer is activated automatically. there are also various functions you
    can use to manipulate file pointers like the `seekg()` function. other functions
    used to manipulate files include `write()` and `read()` which write and read a
    block of binary data while `put()` and `get()` are used to read and write a single
    character.


    Lastly, you learned how to handle errors during file operations and how to handle
    exceptions in a program. the exception handling mechanism involves use of three
    keywords: `try`, `throw` and `catch` exceptions to allow to detect anomalies,
    `throw` exceptions, and come up with appropriate measures to handle the exceptions.

