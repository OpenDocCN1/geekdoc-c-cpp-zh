  trans: "\n\n借助编程范式的帮助，程序员可以轻松地设计、组织和构建解决各种问题的程序。编程范式有两种类型：声明式编程范式和命令式编程范式。`c++`\
    \ 语言是一种命令式编程语言，因为它依赖 OOP 概念来执行函数。\n\n本章的关键元素包括：\n\n- 学习各种内置数据类型以及如何在编写程序中使用它们。\n\
    - 如何使用用户定义类型来执行复杂程序。\n- 如何在 `c++` 中声明变量并为变量分配内存位置。\n- 如何声明数组来存储数据元素、初始化数组、访问数组元素，以及了解如何处理二维数组和多维数组。\n\
    - 使用指针指向特定的存储位置并允许你确定变量的引用地址。\n- 学习如何使用动态空闲运算符为程序分配内存空间。\n- 如何使用 `c++` 函数构建程序并实现代码复用性特性，使复杂程序更高效。\n\
    - 学习函数定义、如何声明函数、如何调用函数以及如何使用函数原型和内联函数。\n- 学习在处理大型对象时使用引用，以减少函数调用中的开销时间。引用将帮助你最小化\
    \ CPU 执行时间并节省内存空间，因为它可以防止在每次函数调用时发生对象的复制。\n- 如何使用结构体和引用访问对象。数据结构允许你在单个单元下处理不同数据类型的变量。\n\
    - 在同一个名称下创建不同返回类型和数据元素的变量以避免代码重复。\n- 调用结构函数并传递不同数据类型的参数。\n\n在下一章中，你将学习面向对象编程的基本概念，包括类、对象的使用、数据抽象与封装、多态和继承特性。\n\
    \n## 第二章：面向对象编程的基本概念\n\n有必要理解面向对象编程中使用的基本概念。见下图。\n\n![00220.jpeg](img/00220.jpeg)\n\
    \n### 类 (Class)\n\n类是数据结构的扩展概念，是 `c++` 编程语言的构建块。它由用于组织结构中数据函数的逻辑方法组成。`class` 关键字表示带有成员函数的数据结构。\n\
    \n一个类由两部分组成：类头和类体。类头定义了类名和基类，而类体定义了每个类支持的类成员。类使用用户定义的数据类型来持有自己的数据成员和成员函数。通过创建类的实例来访问类成员和函数。\n\
    \n- **类成员**：它们代表该类中的数据变量，并指定类对象的表示方式。\n- **成员函数**：描述了用于操作这些数据变量的函数原型。它指定了类操作，这也称为类的实例。\n\
    \n成员函数和数据成员定义了类中对象的属性和行为。\n\n类成员分为三种访问权限：公共（public）、私有（private）和保护（protected）。\n\
    \n- **公共成员**：此类中的数据成员可以被每个类成员访问，只要类可见，即可从任何地方访问。\n- **私有成员**：在此类中，数据成员只能由类成员或同一类的其他成员访问。\n\
    - **保护成员**：这些成员只能在类内部以及来自派生类的其他成员中访问。\n\n#### 语法 (Syntax)\n\n```\nClass classname\n\
    {\nAccess specifier:\n    Member(s);\n\nAccess specifier 2:\n    Members(s);\n\
    \nAccess specifier n:\n    Member(s);\n};\n```\n\n其中，\n\n- `Class` 表示类的关键字。\n\
    - `classname` 是一个名称。\n- `Access specifier` 是授予类的访问权限：公共（public）或保护（protected）。\n\
    - `Members` 定义了类成员和函数。\n\n#### 示例 (Example)\n\n```\nClass cars\n{\nchar carname[30];\n\
    char brand[30];\nfloat speedlimit;\n\npublic:\n    void getdata();\n    void display();\n\
    };\n```\n\n在这个示例中，数据成员将是 `carname`、`brand` 和 `speedlimit`。函数 `getdata()` 用于汽车对象。从上面我们可以推断出类是具有相似属性的对象的蓝图。在\
    \ `c++` 中，对象是一个拥有某些特征的实体，它在运行时创建。\n\n类的实例是一个对象。当你定义一个类时，没有分配内存，但当你创建一个实例时，会为该对象类型分配内存。\n\
    \n#### 语法 (Syntax)\n\n```\nIdentifier.message([arg1, arg2])\n```\n\n其中，\n\n- `identifier`\
    \ 是对象名。\n- `.` 代表成员访问。\n- `message` 是发送的消息类型。\n- `arg` 是用于返回消息的可选参数列表。\n\n标识符和消息之间的点是访问运算符，用于识别数据成员和函数。\n\
    \n#### 示例 (Example)\n\n```\nClass person\n{\nchar fname[25], lname[25];\nint age;\n\
    \npublic:\n    void getdetails();\n    void display();\n};\n\nvoid person::getdetails()\n\
    {\n    cout << \"enter your first name and last name:\";\n    cin >> fname >>\
    \ lname;\n    cout << \"enter your age:\";\n    cin >> age;\n}\n\nvoid person::display()\n\
    {\n    cout << \"your name is:\" << fname << lname << \" aged\" << age;\n}\n\n\
    int main()\n{\n    person p; //p 是一个对象\n    p.getdetails(); //调用输入姓名和年龄的函数\n \
    \   p.display(); //调用显示姓名和年龄的函数\n    return 0;\n}\n```\n\n`p` 是 `person`类的实例。在上面的示例中，`getdetails()`\
    \ 和 `display()` 是 `person` 类的成员函数。要调用这些函数，我们使用点运算符 `.` 后接对象名 `p`。\n\n"
- fmt: '

    The class `person`, has two, private member attributes (names and age), and public
    member functions (`getdetails()` and `display()`). these functions are declared
    within the class as the prototype.


    The function name is followed by a double colon which identifies `getdetails()`
    and `display()` as function member to class `person`.


    If a class is created, the class name defines a new data type called an object
    p.


    From the example above, `person p` is an object created of the class `person`
    where `p` sends a call to the function `p.getdetails();`.


    When you call this function, the compiler prompts you to enter the first name,
    last name and the age of the `person` and store them in the class private members.


    `p.display()` is a call to retrieve the stored data on the names and age of the
    `person`.


    ## Data Abstraction


    Data abstraction is another important feature in c++ programming. data abstraction
    provides needed information without presenting the entire details. it only displays
    the information needed while hiding the background data details.


    Classes helps in implementing abstraction in c++. using access specifiers, you
    can group a class based on member functions and data members. this makes it easy
    to know which data member will be visible to the users and what data remains hidden.


    Abstraction can also be applied on header files. for example, when using `pow()`
    in calculating the power of a certain number you only call the function `pow()`
    from `math.h` header file and pass the parameters to it. you don’t have to know
    how the functions work on the background, you’re only interested in what the function
    does and the results of the calculation.


    ## Data Encapsulation


    Data encapsulation is the process of wrapping data and functions under a single
    unit called a class. that is, wrapping data together with its manipulation methods
    or functions.


    In encapsulation, you can’t access data directly. you can only access it via a
    function inside the class.


    When working with data, encapsulation ensures data is not directly accessible
    and can only be accessed through a function prototype inside a class. this makes
    the concept of data hiding possible.


    For example, if you’re an accountant and want to obtain sales data for a particular
    week, you don’t have access to all data in the sales section. you can contact
    the sales manager in charge of sales section and request him to retrieve sales
    for a specific week. the sales data and sales manager are wrapped under a single
    class called ‘sales section’.


    Encapsulation makes it easy to create the concept of data hiding or data abstraction.
    for example, hiding data that is not required in the sales class.


    ![00221.jpeg](images/00221.jpeg)


    ## Polymorphism


    Polymorphism is representation of data in more than one form. it allows functions
    and variables of different types to be used at different times. that is, a variable
    or function can exhibit a different behavior at different instances.


    When performing an operation, a simple function call can give different results
    depending on the data type of the variables. polymorphism allows operators to
    exhibit different behaviors.


    There are two types of polymorphism:


    - operator overloading

    - function overloading

    - operator overloading: this is where operator show different results in different
    instances.

    - function overloading: this is where a single function name performs different
    types of tasks.


    Example: you can write a function to calculate a sum of numbers with different
    parameters. create function 1 & 2 and pass two parameters of integer type to the
    first function, and supply the second function with three parameters of integer
    type. when you make a call to the function, it will give different instances.
    therefore polymorphism allows you to use the same method and pass different parameters
    to it.


    ![00222.jpeg](images/0222.jpeg)


    ## Inheritance


    This is a concept where you develop a new class from an existing class or from
    a base class. the new class derived will have the characteristics of the base
    class. the base class will act as the parent or super class while the derived
    class will act as the child class or sub-class.


    The sub-class inherits all properties and characteristics of the super class (parent
    class).


    Inheritance supports the concept of code reusability. this is very important as
    it helps in reducing the overall code written to perform a certain task, making
    it a great feature in object programming. if you want to create a new class that
    uses some of the code in another class, you can derive a new class from the existing
    class. this allows you to re-use the variables and methods in the existing class.


    ## Other Features


    ### Dynamic binding


    When you make a call to function, the code to the function is executed at runtime.
    this process is known as dynamic binding. c++ uses virtual functions to support
    dynamic binding.


    ### Message passing


    Message passing is a technique in which objects communicate with one another.
    an object sends a message to another object requesting execution of a certain
    procedure. this triggers a function in the receiving object to send back the desired
    results. When an object is communicating with another object, it has to specify
    its function name, and the message to be sent.


    C++ language supports static message passing, that is when you invoke an object’s
    method, the target object should also have the invoked method. otherwise, the
    compiler will generate an error message. message passing is made through the help
    of vtables. To use dynamic message passing on objects, you should:


    - Declare a global function that will act as a signature to the message being
    passed between objects.

    - Inherit object properties from `d::object`.

    - Create a class constructor and add a single message or more to the object using
    `add_message` method.

    - Use `invoke(signature, ...parameters)` to send a message to an object.


    ### How message passing works


    Each c++ object has `shared_ptr` to a particular map. that is the map’s key act
    as a pointer to the message signature. its value points to an internal message
    structure that holds the pointer of the message method to invoke.


    once the object method is invoked, it retrieves the appropriate message structure
    from the map. as a result, it invokes the object method using this as the object
    target.


    The objects share the message map among themselves to increase efficiency among
    themselves. if the map is not unique, it will be duplicated after modification
    of a message map.


    ## Chapter summary


    In this chapter, you have learned basic concepts of object oriented programming
    including:


    - Learning how to work with c++ objects and initialize them.

    - How to create classes and class definition.

    - Applying the concept of data abstraction and encapsulation to extend the power
    of programming language.

    - Learning how programmers can create user-defined data types and how encapsulation
    and abstraction work in order to provide the needed information to the user without
    the need to present program details.

    - Learning how the concept of data hiding is made possible through encapsulation.

    - How to use polymorphism feature to create objects with more than one data type
    or form.

    - How to use function overloading and overloaded operator in polymorphism.

    - Learning how c++ supports inheritance feature by allowing the properties and
    characteristics of a class (base class) be used in building another class (derived
    class).

