    o,ther features


    Dynamic binding


    When yo,u make a call to, a functio,n, the co,de to, the functio,n is executed
    at runtime. this pro,cess is kno,wn as dynamic binding. c++ uses virtual functio,ns
    to, suppo,rt dynamic binding.


    Message passing


    Message passing is a technique in which o,bjects co,mmunicate with o,ne ano,ther.
    an o,bject sends a message to, ano,ther o,bject requesting executio,n o,f a certain
    pro,cedure. this triggers a functio,n in the receiving o,bject to, send back the
    desired results.


    When an o,bject is co,mmunicating with ano,ther o,bject, it has to, specify its
    name, the functio,n name, and the message to, be sent.


    C++ language suppo,rts static message passing, that is, when yo,u invo,ke an o,bject’s
    metho,d, the target o,bject sho,uld also, have the invo,ked metho,d. o,therwise,
    the co,mpiler will generate an erro,r message. message passing is made thro,ugh
