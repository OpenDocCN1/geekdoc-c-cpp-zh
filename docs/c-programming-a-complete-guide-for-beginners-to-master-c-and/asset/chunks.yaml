    ## Data structures\n\nData structure is the collection of elements and variables\
    \ within a single unit. all data elements of different data types need to be processed\
    \ and stored together under one name. for example, a student’s information file\
    \ should have details about name, school id, contacts, course, class, marks, and\
    \ grading information.\n\nStructures work the same as arrays, and the only difference\
    \ is that structures represent a collection of variables of different data types\
    \ under a single name, while arrays represent a collection of variables of the\
    \ same data type.\n\nTo declare structures, use the keyword `struct` followed\
    \ by the structure name which is also called a “tag”. then define data members\
    \ or variables inside the open and closing braces (`{}`). after the closing braces,\
    \ enter the object name (structure-variables) although this is optional.\n\n###\
    \ Syntax\n\n```cpp\nStruct structurename\n{\n    type membername1;\n    Type membername2;\n\
    \    Type membername3;\n    .\n    .\n} objectname;\n```\n\nThe `struct` keyword\
    \ tells the compiler that a structure is being defined. the `object_name` allows\
    \ a user to directly declare an object of structure type, that is, be able to\
    \ instantiate different objects in a single object.\n\n### Example 1:\n\n```cpp\n\
    Struct person\n{\n    Char fname[15], lname[15];\n    Int age, code;\n    Float\
    \ salary;\n} samuel, anthony, paul;\n```\n\nThe above example defines a structure\
    \ tag called `person`, and stores variables of different data types together with\
    \ objects passed to the structure.\n\n### Example 2: creating a structure with\
    \ an array of 10 objects\n\n```cpp\nStruct products\n{\n    Char prodname [20];\n\
    \    Int weight;\n    Float price;\n} items [10];\n```\n\n### How to access structure\
    \ memories\n\nonce you define and declare structure variables, you can work directly\
    \ with their members. to access structure members, use the dot (`.`) operator\
    \ which is also known as the access operator.\n\nThe access operator is inserted\
    \ between the `object_name` and the `member_name`.\n\n`Mango.price;`\n\n### **Initializing\
    \ structure elements**\n\nYou can initialize the elements of a structure by assigning\
    \ values to them. you can initialize the elements by using separate assignment\
    \ statements or using array notation.\n\nfor example, if you want to assign value\
    \ 50 to the price of mango fruit, this can be done as follows:\n\n```cpp\nMango.price\
    \ = 50;\n```\n\nWhen using an array notation, you can initialize the elements\
    \ as follows:\n\n```cpp\nType student = {10, 15.6, 50.0, ‘b’};\n```\n\nThe array\
    \ type initialization only works if the structure variable is already defined.\
    \ the type in the above statement is the data type specifier of the structure\
    \ `student` which is declared and initialized simultaneously. all the values assigned\
    \ to the structure members should be enclosed with open and closing braces.\n\n\
    ### Example:\n\n```cpp\n#include<io,stream.h>\n#include<conio,.h>\n#include<stdio.h>\n\
    \nStruct student\n{\n    int studno;\n    char studname[30], course [20], class\
    \ [2];\n    float marks[4];\n    char grade;\n}student_var;\n\nVoid main()\n{\n\
    \    float sum = 0;\n    float average;\n    cout<<\"enter student's number: \"\
    ;\n    cin>>student_var.studno;\n    cout<<\"enter student's name: \";\n    cin>>student_var.studname;\n\
    \    cout<<\"enter student’s course: \";\n    cin>>student_var.course;\n    cout<<\"\
    enter student's class: \";\n    cin>>student_var.class;\n    cout<<\"enter student’s\
    \ marks on:\\n\";\n    for(int m=0; m<4; m++)\n    {\n        cout<<m+1<<\": \"\
    ;\n        cin>>student_var.marks[m];\n        sum = sum + student_var.marks[m];\n\
    \    }\n    average = sum / 4;\n    if(average<50)\n    {\n        student_var.grade\
    \ = 'fail';\n    }\n    else if(average<65)\n    {\n        student_var.grade\
    \ = 'pass';\n    }\n    else if(average<80)\n    {\n        student_var.grade\
    \ = 'credit';\n    }\n    else\n    {\n        student_var.grade = 'dist';\n \
    \   }\n    cout<<\"\\nresult:\\n\";\n    cout<<student_var.studno<<\"\\t\\tname:\
    \ \"<<student_var.studname;\n    cout<<\"\\t\\tcourse: \"<<student_var.course<<\"\
    \\t\\tclass: \"<<student_var.class;\n    cout<<\"\\t\\ttotal: \"<<average<<\"\\\
    t\\tgrade: \"<<student_var.grade;\n    return 0;\n}\n```\n\n**Output:**\nenter\
    \ student's number:\nenter student's name:\nenter student’s course:\nenter student's\
    \ class:\nenter student’s marks on:\n1: 50\n2: 60\n3: 70\n4: 80\nresult:\n1\t\t\
    name: John course: C class: A total: 65 grade: pass\n\n## **References in c++**\n\
    \nC++ reference is an alternative name to an existing variable. once you initialize\
    \ a variable with a reference you may use the reference name. There are three\
    \ types supported in c++, they include:\n\n- `value references`: these are simply\
    \ values\n- `const references`: these are not changed\n- `pointer references`:\
    \ these help to, avoid copying\n\nTo declare a reference, use the ampersand (`&`)\
    \ which is also the address operator.\n\n### Example 1:\n\n```cpp\nint prd=5;\n\
    int &x = prd;\n```\n\n### Example 2:\n\n```cpp\n#include<iostream>\nUsing namespace\
    \ std;\n\nInt main()\n{\n    double price = 100;\n    double &ref = price;\n \
    \   // change the price\n    ref = 120;\n    cout << \"price = \" << price <<\
    \ endl;\n    // change the ref\n    price = 150;\n    cout << \"ref = \" << ref\
    \ << endl;\n    return 0;\n}\n```\n\n**Output:**\nprice = 120\nref = 150\n\n###\
    \ Application of references\n\n1. **To, modify the parameters of a function**:\
    \ if you want to change the parameters passed to a function during function call,\
    \ you can reference the variables. in the above example, referencing the variable\
    \ modified the price from 100 to 120.\n2. **To, avoid copying large structures**:\
    \ if you have a function that executes a large number of objects, passing parameters\
    \ to it without referencing creates a copy of objects. to avoid this duplication,\
    \ you can use references.\n\n### Example:\n\ncpp\nStruct employee\n{\n    string\
    \ empnames, address;\n    int empno;\n}\n\nVoid print (const employee &em)\n{\n\
    \    cout << em.empnames << \" \" << em.address << \" \" << em.empno;\n}\n```\n\
    \nIf we remove the reference operator, it will create a new copy of the employee\
    \ object. the `const` keyword prevents any accidental update to the program.\n"
