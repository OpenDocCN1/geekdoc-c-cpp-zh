    ```cpp\n#include<iostream.h>\n\nClass polygon\n{\nProtected:\n    Int width, height;\n\
    Public:\n    void setvalues (int w, int h)\n    {\n        width=w, height=h;\n\
    \    }\n};\n\nClass output\n{\nPublic:\n    void output (int);\n};\n\nvoid output::output\
    \ (int i)\n{\n    cout<<i<<endl;\n}\n\nClass rectangle:public polygon, public\
