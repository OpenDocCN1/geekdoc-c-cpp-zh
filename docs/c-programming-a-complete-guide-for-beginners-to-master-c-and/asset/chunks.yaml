    ## Chapter two,: basic co,ncepts in o,bject o,riented pro,gramming


    It is necessary to, understand the basic co,ncepts used in o,bject-o,riented pro,gramming.
    see figure belo,w.


    ![00220.jpeg](images/00220.jpeg)


    **Class**


    A class is an expanded co,ncept o,f data structure and a building blo,ck fo,r
    c++ pro,gramming language. it co,nsists o,f lo,gical metho,ds fo,r o,rganizing
    data and functio,ns in the structure. the ‘class’ keywo,rd deno,tes the data structure
    with functio,ns represented as members.


    A class co,nsists o,f two, parts: class header and bo,dy. a class header defines
    the class name and the base class, whereas the class bo,dy defines the class members
    suppo,rted by each class. the class uses user-defined data type to, ho,ld its
    o,wn data members and member functio,ns. class members and functio,ns are accessed
    by creating an instance o,f the class.


    Class members: they represent the data variables in that class and specify ho,w
    class o,bjects are represented.


    Member functio,ns: describes the functio,n pro,to,type used in manipulating these
    data variables. it specifies class o,peratio,ns which is also, referred to, as
    the instance o,f the class.


    Bo,th member functio,ns and data members define the pro,perties and behavio,r
    o,f an o,bject in a class.


    Class members fall under three access permissio,ns: public, private and pro,tected.


    Public members: data members in this class are accessible by every class member
    and fro,m anywhere as lo,ng as the class is visible.


    Private members: in this class, data members are o,nly accessible by the class
    members o,r o,ther members o,f the same class.


    Pro,tected members: these are o,nly accessible within the class members and o,ther
    members fro,m a derived class.


    Syntax


    Class classname


    {


    Access specifier:


    Member(s);


    Access specifier 2:


    Members(s);


    Access specifier n:


    Member(s);


    };


    Where,


    *   Class is the keywo,rd that deno,tes class declaratio,n.


    *   Classname is a valid name identifier o,f class.


    *   Access specifier is the access permissio,n granted to, that class: either
    private, public o,r pro,tected.


    *   Members defines the class members and member functio,ns o,f the class.


    Example:


    Class cars


    {


    Char carname[30], brand[30];


    Flo,at speedlimit, mileage;


    Public:


    Vo,id getdata(vo,id);


    Vo,id display(vo,id);


    };


    In this example, the data members will be carname, brand, speedlimit and mileage.
    the member functio,n is getdata, display, a functio,n to, apply breaks o,r even
    a functio,n to, increase the speed o,f the car.


    Fro,m the abo,ve data, we can deduce that a class is the blue-print that defines
    a gro,up o,f o,bjects with similar pro,perties and behavio,rs.


    o,bjects


    In c++, an o,bject is an entity o,r variable which po,ssess so,me characteristics
    and behavio,rs. it represents an instance o,f the class. that is, when yo,u define
    a class, there is no, memo,ry allo,catio,n but if the class is instantiated (declaring
    variables), a memo,ry allo,cated is created and allo,cated to, the specific o,bjects
    created.


    An o,bject can represent a perso,n, a car, o,r bank acco,unt. o,bjects include
    bo,th data members and their asso,ciated member functio,ns, kno,wn as metho,ds.


    When creating a class, yo,u have to, determine the attributes o,f the o,bject
    yo,u’re creating, co,mmo,nly kno,wn as the data members o,f the class. fo,r example,
    class cars (o,bject) has attributes like car mo,del, year o,f manufacturer, engine
    po,wer, and co,lo,r. its asso,ciated member functio,ns o,r metho,ds include; start(),
    sto,p() and mo,ve().


    Yo,u may have mo,re than o,ne instance o,f the o,bject created. the car o,bjects
    include: to,yo,ta, rav4, fielder, land ro,ver, etc.


    An instance is an actual o,bject which is created during run time. fo,r example,
    to,yo,ta is an instance o,f class cars.


    To, determine the behavio,r co,mpo,nents o,f the o,bjects, yo,u have to, determine
    what message the o,bjects can receive and what kind o,f o,peratio,ns need to,
    be perfo,rmed. the behavio,r co,mpo,nent o,f the class type o,bject describes
    a co,llectio,n o,f member functio,ns which send a message to, the o,bject and
    pro,mpt a certain actio,n to, be taken.


    No,te: all messages are sent fro,m o,ne o,bject to, ano,ther by calling o,r invo,king
    member functio,ns.


    Syntax


    Identifier. message ([arg1, arg2])


    Where,


    ●  identifier is the o,bject name.


    ●  do,t represents the member access o,perato,r.


    ●  message is the type o,f message sent.


    ●  arg is an o,ptio,nal list o,f arguments to, be returned o,r the message co,ntent.


    The do,t between the identifier and the message type is the member access o,perato,r
    that identifies the data members and member functio,ns o,f the o,bject.


    Fo,r example:


    Class perso,n


    {


    char fname [25], lname[25];


