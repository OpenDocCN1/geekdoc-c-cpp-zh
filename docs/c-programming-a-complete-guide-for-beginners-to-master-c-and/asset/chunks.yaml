  trans: "\n\n析构函数的名称与类名相同，但前面有一个波浪号运算符 `~`。它没有返回值，且你不能向它传递任何参数。析构函数是 C++ 的一个重要特性，它在内存不再需要时释放内存空间。\n\
    \n示例：下面的示例解释了如何在程序中使用构造函数和析构函数。\n\n### 语法\n\n```cpp\n// 构造函数 & 析构函数\n\nClass Crectangle\n\
    {\n    Int *len, *wid;\n\nPublic:\n    Crectangle (int, int) // 构造函数\n    ~Crectangle\
    \ () // 析构函数\n    Int area()\n    {\n        return (len*wid);\n    }\n};\n\n\
    Crectangle::Crectangle (int c, int d)\n{\n    *len=c;\n    *wid=d;\n};\n\n// 用于释放内存的析构函数\n\
    Crectangle ::Crectangle ()\n{\n    Delete len;\n    Delete wid;\n};\n\nint main()\n\
    {\n    Crectangle rect a (c,d);\n    Crectangle rect b (c,d);\n    cout << \"\
    area of a rectangle is: \" << rect a.area();\n    cout << \"area of a rectangle\
    \ is: \" << rect b.area();\n    cout << endl;\n}\n```\n\n### 析构函数的特殊性质\n\n1. 当对象被销毁时，会自动调用析构函数。\n\
    2. 与其他成员函数一样，析构函数遵循相同的访问规则。\n3. 析构函数在对象超出作用范围之前对其进行去初始化。\n4. 析构函数没有返回类型，甚至不支持\
    \ `void`。\n5. 析构函数永远不能被继承。\n6. 析构函数不允许使用静态析构函数。\n7. 析构函数可以调用其所属类的成员函数。\n8. 如果类中的对象具有析构函数，那么该对象不能是联合体（union）的成员。\n\
    \n### 总结\n\n在本章中，你学习了构造函数、析构函数和函数重载。构造函数在 C++ 语言中非常重要，因为它们帮助通过自动初始化在对象中构建值。具体来说，你学习了：\n\
    \n● 如何声明和初始化构造函数。\n● 构造函数如何初始化类类型的对象。\n● 析构函数在执行后如何对对象进行去初始化。析构函数通过在对象销毁后去初始化来帮助释放内存空间。\n\
    ● 关于带参数的构造函数。你能够为不同对象数据成员传递不同的参数和值。你还学习了如何调用构造函数。\n● 如何使用重载构造函数和拷贝构造函数。\n● 理解两种拷贝构造函数：浅拷贝和深拷贝。\n\
    ● 如何创建一个包含两种拷贝构造函数的项目，以及如何调用创建的对象。\n\n在下一章中，你将学习如何使用模板。在章节结束时，你将能够创建类模板、函数模板以及如何创建带有多个参数的模板。\n\
    \n## 第七章：模板\n\n### 模板简介\n\n模板是 C++ 编程语言中的一项重要特性，因为它允许函数和类使用泛型。它们通过允许定义不同的数据类型而无需相互重写，在函数和类的工作方式上起着至关重要的作用。\n\
    \n使用模板，你可以编写出适用于任何数据类型的通用代码。你只需要将数据类型作为参数传递。模板促进了代码重用性并提高了程序的灵活性。你可以创建一个简单的类或函数，并将数据类型作为参数传递，并实现可供任何数据类型使用的代码。每当你想要使用该函数时，只需调用该函数并指定返回类型。\n\
    \n例如，如果你使用 `sort()` 函数对数据进行排序，可以将不同的数据类型作为参数传递给函数。根据传递给算法的数据类型，你不需要针对特定的数据类型编写和维护多份代码。因此，模板用于代码需要在多个数据类型之间可重用的情况。在处理多重继承和重载时，模板具有巨大的意义。\n\
    \n### 模板的类型\n\n模板通过两种方式实现：\n● 使用函数模板\n● 使用类模板\n\n模板可以定义为宏，当你定义一个特定类型的对象时，模板定义会将其替换为适当的数据类型。模板通常被称为参数化类，因为在执行期间，指定的数据类型将替换定义的参数。\n\
    \n#### 类模板\n\n语法\n\n```cpp\nTemplate <class identifier>\nClass class-name\n{\n\
    \    // 类成员定义\n};\n```\n\n示例：`images/0231.jpeg`\n\n类模板的定义与普通类定义相似，不同之处在模板中你添加了前缀\
    \ `<class m>`，其中 `m` 是类型。模板前缀告诉编译器声明了一个类模板，该模板在声明中使用 `m` 作为类型名。在这种情况下，该类是一个使用\
    \ `m` 作为参数的参数化类。类型 `m` 可以通过用户定义的数据类型替换为任何数据类型。\n\n如果类派生自类模板，则被称为模板类。模板类的对象定义如下：`ClassName<type>\
    \ objectname(arglist);`。从类模板派生派类时，你需要在转换为类之前对模板进行调试。编译器在实例化后检查模板类中的错误。\n\n示例：类模板\n\
    \n```cpp\nTemplate <class tt>\nClass rectangle\n{\n    tt width;\n    tt height;\n\
    Public:\n    void setvalues(tt num1, tt num2)\n    tt area()\n    {\n        tt\
    \ a;\n        a=width*height;\n        return a;\n    }\n};\n\nvoid rectangle\
    \ <tt> ::setvalues (tt num1, tt num2)\n{\n    width=num1;\n    height=num2;\n\
    }\n\nint main()\n{\n    rectangle rect a;\n    rectangle <int> rect a (5,6);\n\
    \    rectangle rect b;\n    rectangle <float> rect b (5.6,4);\n    cout << rect\
    \ a.setvalues()\n    cout << rect b.setvalues()\n    return 0;\n}\n// output\n\
    rect a=30\nrect b=22.4\n```\n上面的程序创建了一个类型 `tt` 的类。`void rectangle <tt> ::setvalues\
    \ (tt num1, tt num2)` 中的 `<tt>` 指定函数参数也是类模板参数，并在调用类时始终包含。\n\n#### 带有多个参数的类模板\n\
    \n你也可以在类拥有多个泛型数据类型。你可以在模板规范中使用逗号分隔的列表声明泛型类型类。\n\n语法\n\n```cpp\nTemplate <class\
    \ xy, class xyz, …>\nClass class-name\n{\n    // 函数体\n};\n```\n\n示例：带有两个泛型类型的类\n\
    \n```cpp\nTemplate<class f1,class f2>\nClass numbers\n{\n    f1 j; f2 k;\nPublic:\n\
    \    numbers (f1 x, f2 y)\n    { \n        j=x; k=y;\n    }\n    void print()\n\
    \    {\n        cout<<j<<\"and\"<<k<<\"\\n\";\n    }\n};\n\nint main()\n{\n  \
    \  Numbers <float, int> numbers1 (2.53, 253);\n    Numbers <int, char> numbers2\
    \ (50,'z');\n    Numbers1.print();\n    Numbers2.print();\n    Return 0;\n};\n\
    // output\n2.53 and 253\n50 and z\n```\n\n### 函数模板\n\n函数模板的工作原理与普通函数相似，不同在于普通函数只处理单一数据类型，而模板可以适应多种数据类型。通过模板，你可以重载普通函数以便处理不同的数据类型。\n\
    \n"
- fmt: "\nThis makes function templates more useful since you only have to write a\
    \ single program that works on all data types.\n\nTemplates are always expanded\
    \ during compile time.\n\nJust like class template, you can create a function\
    \ template with different argument types.\n\n### Syntax\n\n```cpp\nTemplate <class\
    \ type>\n\nReturn-type function-name (arguments)\n\n{\n    Function body;\n};\n\
    ```\n\nWhen defining function templates, you must include the template type in\
    \ both the function body and parameter list when necessary.\n\n### Example 1:\
    \ function to swap values\n\n```cpp\nTemplate <class t1>\nVoid swap (t1&num1,\
    \ t1&num2)\n{\n    t1 val= num1; num1=num2; num2=val;\n};\n```\n\nCalling a template\
    \ function works the same way as the normal function call.\n\n### Example 2: implementation\
    \ of function template\n\n```cpp\nTemplate <class test>\nTest max (test x, test\
    \ y);\n{\n    test results;\n    results=x>y? x:y;\n    return results;\n};\n\n\
    Int main()\n{\n    int a=5, b=6, c;\n    double l=4, m=6, n;\n    c= max <int>\
    \ (a,b);\n    n=max <double> (l,m);\n    cout<< c<<endl;\n    cout<<n<<endl;\n\
    \    return 0;\n}\n```\n\nIn this example, `test` is the template parameter. the\
    \ function `max` is called twice with different argument types (`int` and `double`).\
    \ when the compiler instantiates, it calls the function each time by its type.\n\
    \nThe output object produced (after instantiation of the template with specific\
    \ type) will be of the same type with the parameters `x` and `y`.\n\nThe above\
    \ program will sort values based on which is higher. if using an array of numbers,\
    \ the sorting algorithm will be applied to sort the numbers from the smallest\
    \ to highest.\n\n### Function template with multiple parameters\n\nJust like in\
    \ class templates, you can have more than one generic data type separated by commas.\n\
    \n![00232.jpeg](images/00232.jpeg)\n\n### Example: temple class with multiple\
    \ parameters\n\n```cpp\nTemplate<class temp1,class temp2>\nVoid display( temp1\
    \ j, temp2 k)\n{\n    cout<<j<<” “<<k<<”\\n\";\n}\n\nInt main()\n{\n    J=display1(2019,\
    \ “edge”);\n    K=display2(18.54, “1854);\n    return 0;\n}\n// output\n2019edge\n\
    18.541854\n```\n\n### overloading template functions\n\nYou can overload a template\
    \ function using its template function or using the ordinary function from its\
    \ name. Overloading can be done through:\n\n1. Calling an ordinary function that\
    \ matches the template function.\n2. Calling a template function which is built\
    \ with the exact function.\n3. Use normal overloading function on an ordinary\
    \ function and make a function call to the one that matches the template function.\n\
    \nIf there is no match found, an error message is generated by the system.\n\n\
    ### Example: overloaded template using an explicit function\n\n```cpp\nTemplate\
    \ <class m>\nvoid display(m n)\n{\n    cout<<”display template function:” << n<<\
    \ “\\n\";\n}\n\nVoid display ( int n)\n{\n    cout<<”explicit template display:\
    \ “<< n<<”\\n\";\n}\n\nInt main()\n{\n    display (80); display (15.20);\n   \
    \ return 0;\n}\n//output\nExplicit template display: 80 display template function:\
    \ 15.20\n```\n\nThe function call `display (80)` calls the ordinary version of\
    \ a `display()` function and not its template version.\n\n### Member function\
    \ templates\n\nWhen creating class templates, all member functions can be defined\
    \ outside the class since the member functions in a template class are parameterized\
    \ using type argument. therefore, the function template should define the member\
    \ functions.\n\nMember functions (whether inline or non-inline) declared inside\
    \ a class template are implicitly a function template. if a template class is\
    \ declared, it inherits all the template functions defined in a class template.\n\
    \nMember function templates are defined in three ways:\n\n1. Explicit definition\
    \ in file scope for each return-type used to instantiate a template class.\n2.\
    \ During file scope within the template parameters.\n3. Inclined within the class.\
    \ A member function template can instantiate functions not explicitly generated.\
    \ if a class has both a member function and an explicit function, then the explicit\
    \ definition is given more priority.\n\n#### Syntax\n\n![00233.jpeg](images/00233.jpeg)\n\
    \n#### Example: class with member function\n\n![00234.jpeg](images/00234.jpeg)\n\
    \n### Non-type template arguments\n\nTemplates can have single or multiple type\
    \ arguments. you can also use a non-type argument in addition to the type. you\
    \ can create a template argument using strings, constants, built-in types and\
    \ function names.\n\n![00235.jpeg](images/00235.jpeg)\n\nThe above template passes\
    \ the size of an array as an argument. the compiler will only know the size of\
    \ the array during execution. the arguments are specified during the creation\
    \ of template.\n\n### Chapter summary\n\nC++ programming language supports the\
    \ use of templates in order to support generic programming. in this chapter, we\
    \ are able to learn how templates allow us to create a family of classes or functions\
    \ which can handle different data types. you have learned:\n\n- use of templates\
    \ to avoid duplication of codes by just making a call to the template argument\
    \ return-type. this also makes it easy to manage the program as well as make program\
    \ development easier.\n- creating templates by use multiple parameters for both\
    \ class templates and function templates.\n- how to create a derived class from\
    \ a template which is called a template class. the process used in the creation\
    \ of the template class is known as instantiation.\n- template functions and how\
    \ you can overload the function by either calling the ordinary function that matches\
    \ the template or by calling the template which has an exact match to the function\
    \ template.\n- how to use arguments in class templates. all member functions of\
    \ the class should be defined as function template by using the arguments in a\
    \ class template.\n- how to instantiate member functions which are explicitly\
    \ generated.\n- how to use non-type arguments to define and declare function templates.\n\
    \nIn the next chapter you will learn about the input and output streams and various\
    \ file operation methods. at the end of the chapter, you will be able to use io\
    \ formatting functions, manage output with manipulators, design your manipulators,\
    \ carry out file operations, determine end of file, file opening modes, use `put()`,\
    \ `get()` functions and using file stream classes.\n\n## Chapter eight: c++ input\
    \ and output streams\n\n### Introduction\n\nC++ programming language comes with\
    \ a lot of libraries which helps in performing input output functions. the input\
    \ output concept is performed through a series of bytes which are commonly known\
    \ as streams. it supports two types of input/output streams with one stream inherited\
    \ from the c programming language and the other from the object oriented input\
    \ output system. just like the i/o streams in the c programming language, the\
    \ i/o system in c++ language are fully integrated.\n\nEvery developed program\
    \ takes in data as input, the data is processed then displayed out as an output.\
    \ this is based on the input output processing cycle or fetch and execute cycle.\
    \ c supports all the i/o function found in c language. the i/o methods in c++\
    \ supports oriented programming concept and user defined data types.\n\nImplementation\
    \ of i/o operations in c++ is by use of streams concept and stream classes are\
    \ achieved through the console and disk files. Both input stream and output streams\
    \ are used in class definition.\n\n### C++ streams\n\nA stream acts as a logical\
    \ device which accepts input data and generates information. it is linked to a\
    \ physical device via the i/o system. even though the devices connected to the\
    \ streams work the same, the devices may differ from one another.\n"
