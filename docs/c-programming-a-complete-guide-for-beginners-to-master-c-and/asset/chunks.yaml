- fmt: "\nThis step involves the identification of real world objects and abstract\
    \ objects. these objects can be found in the application and are analyzed by the\
    \ use of data flow diagrams (`dfd`) and textual analysis (`ta`).\n\n### Data flow\
    \ diagrams\n\nA data flow diagram uses various symbols that represent data, and\
    \ they are used to indicate the flow of data from one point to another. the dfd\
    \ has input/output symbols, decision symbol and the process symbol which acts\
    \ as the data store for all objects.\n\n### Textual analysis\n\nThis includes\
    \ a detailed textual description of the problem with one or two paragraphs or\
    \ several sentences based on the complexity of the problem.\n\n1. **Identify object\
    \ services**: once objects are identified, the next step is determine the set\
    \ of services each object is supposed to perform.\n2. **Establish a connection\
    \ between objects**: after determining what services each object will offer, a\
    \ communication is established between objects based on the services each object\
    \ offers and receives. you can use an entity relationship diagram or information\
    \ flow diagram to list information being communicated by each object.\n\n## Object\
    \ oriented design\n\nThe design process involves mapping out objects and creating\
    \ a conceptual model of the system. this uses a bottom-up approach to build the\
    \ system structure, or uses a top-down approach by designing the class member\
    \ function that provides the services to the system.\n\nWhen designing objects,\
    \ it’s important to come up with class hierarchies, identify any abstract class\
    \ and the simply messaging passing process between the objects.\n\nWhen mapping\
    \ out content, put into consideration the reusability of classes if you had previous\
    \ designs, and the classification of the objects into subsystems.\n\n### Steps\
    \ in object oriented design:\n\n1. **Evaluate objects created during the analysis\
    \ phase.**\nEvaluating the objects identified in the problem space enables you\
    \ to refine the objects based on their attributes and their operations. it also\
    \ enables you to identify other objects that can help you obtain more solutions\
    \ to the problem.\n\n2. **Specify class dependencies.**\nAnalysis of the relationship\
    \ between the classes is very important, as it enables you to determine the appropriate\
    \ class to represent the objects and establish relationships between the objects.\
    \ the major relationships necessary in the design stage include:\n\n* **inheritance\
    \ relationship**: this allows a class to inherit the properties and behaviors\
    \ of another class. in this case, an object can inherit some members from another\
    \ class.\n* **containment relationship**: in this type of relationship, an object\
    \ of class a is used as a member of class b.\n* **use relationship**: this type\
    \ of relationship provides information on the various classes a particular class\
    \ uses and how it uses the classes. for example, class a can use class b and c\
    \ in the following ways:\n    * `class a` reads the members of `class b`.\n  \
    \  * `class a` calls the members in `class c`.\n    * `class a` uses new operator\
    \ to create `class b`.\n\nIf you’re planning to override some attributes or functions,\
    \ it is highly recommended to use an inheritance relationship.\n\n3. **organize\
    \ classes into hierarchies.**\nAfter creating an inheritance relationship between\
    \ the objects, you have to re-examine the relationships and create class hierarchies.\
    \ this allows you to reuse data and functions that have been established. identifying\
    \ similar attributes and function within a group of related classes helps in organizing\
    \ the classes into hierarchies. a new class can be formed from the related classes,\
    \ and it’s called the super class. the other classes are subordinate classes.\
    \ if an object is created by combining all the class attributes, then it’s called\
    \ an abstract class.\n\n4. **Design classes.**\nThis step defines the methods\
    \ to be used on the created class to make it more useful. some of the functions\
    \ used in a class include:\n* **management functions**: how to create an object\
    \ and how to destroy an object.\n* **implementation functions**: the operations\
    \ performed on the class data types.\n* **access functions**: this is a function\
    \ of accessing the internal variables of a class.\n* **utility function**: this\
    \ involves how to handle errors and access control.\n\n5. **Design member functions.**\n\
    Member functions define some of the tasks to be performed on an object. these\
    \ functions work like other. top-down approach to design member functions.\n\n\
    6. **Determine the driver program.**\nThe `main()` is the standard C++ driver\
    \ program. all calls are made in `main()`. the driver program is responsible for:\n\
    * receiving users’ input.\n* creating objects from definition.\n* displaying output\
    \ based on the users’ requirements.\n* making calls to the member functions.\n\
    \n### Program implementation\nThis process involves coding and testing the developed\
    \ program. the code is written using member functions and the driver program.\
    \ once you finish coding the program you have to test it for errors and determine\
    \ whether it functions as expected. program testing is an essential feature in\
    \ the software development process. you should come up with a detailed testing\
    \ plan of what to test and how the testing will be carried out. test all class\
    \ dependencies and interfaces for any errors. the ultimate goal of testing is\
    \ to ensure the program performs its functions as intended.\n\n## C++ programming\
    \ building blocks\n\n### Built-in data types in C++\nWhen declaring variables,\
    \ you have to define the data type for each variable. the data type indicates\
    \ what kind of data is stored in the variable. in C++ programming the compiler\
    \ allocates memory space for each variable created based on the data type. different\
    \ data types require different memory sizes.\n\nData types\nThere are three C++\
    \ data types:\n1. Primitive data types\n2. Derived data types\n3. Abstract or\
    \ user defined types\n\n#### Primitive data types/ built-in data types\nA primitive\
    \ data type is a predefined or built-in type that is used directly to declare\
    \ a variable. the most common built-in data types include:\n\n| Data type | Keyword\
    \ | Range |\n| :--- | :--- | :--- |\n| Character | `char` | -127 to 127 and from\
    \ 0 to 255 |\n| Integer | `int` | -2147483648 to 2147483647 |\n| Floating point\
    \ | `float` | +-3.4e+/-38 (7 digits) |\n| Boolean expression | `bool` | Stores\
    \ value as either true or false |\n| Double floating point | `double` | +/-1.7e+-308\
    \ (15 digits) |\n| Valueless | `void` | Indicates no type |\n| Wide character\
    \ | `wchar_t` | 1 wide character |\n\nCharacter and integer data types can be\
    \ modified further using the following C++ modifiers:\n* `signed`\n* `unsigned`\n\
    * `short`\n* `long`\n\nThese modifiers indicate how much memory space is needed\
    \ to store these variables. Specifying the data type for all variables created\
    \ tells the compiler how much space to allocate for each variable. any variable\
    \ definition specifies the data type and the variable list.\n\nSyntax\n```\nDatatype\
    \ variable_list;\n```\n\nExample:\n```\nint a, b, c;\nchar y, n;\nfloat salary;\n\
    ```\n\n#### Derived data type\nAs the name suggests, this data type is derived\
    \ from the built-in data types. they include:\n* arrays\n* pointers\n* functions\n\
    * reference\n\n#### Abstract data types\nThis is a data type defined by the user,\
    \ thus the name user-defined types. these data types include:\n* enumeration\n\
    * structure\n* union\n* class\n\n**Enumerated types**\nEnumerated data types use\
    \ `enum` variable to declare an optional data type and a list of identifiers that\
    \ show the values of the data type.\n\n```\nenum enum_name {list of names}\n```\n\
    \nWhere,\n"
