  trans: "\n\n```cpp\ncout << \"the area of rectangle is: \" << area(3, 5) << \"\\\
    n\";\n\nreturn 0;\n\n}\n```\n\n内联函数可以在类内部使用。一旦你在类内部定义了一个函数，它会自动变成内联函数，内联函数的所有限制也适用于类内部的函数。\n\
    \n在类中定义内联函数时，你必须先在类内部声明该函数，然后使用 `inline` 关键字在类外部进行定义。\n\n```cpp\nClass rectangle\n\
    {\nPublic:\n    Int area (int l, int w)\n};\n\nInline int rectangle:: area(int\
    \ l, int w)\n{\n    return l*w;\n}\n```\n\n## 数据结构\n\n数据结构是单个单元内元素和变量的集合。所有不同类型的数据元素都需要在一个名称下进行处理和存储。例如，一个学生信息文件应该包含姓名、学号、联系方式、课程、班级、成绩和评分信息的详细信息。\n\
    \n结构体的工作方式与数组相同，唯一的区别在于结构体在一个名称下表示不同数据类型变量的集合，而数组表示相同数据类型变量的集合。\n\n要声明结构体，使用关键字\
    \ `struct` 后后跟结构体名称（也称为“标签”）。然后在大括号（`{}`）内部定义数据成员或变量。在闭括号之后，输入对象名称（结构体变量），尽管这是可选的。\n\
    \n### 语法\n\n```cpp\nStruct structurename\n{\n    type membername1;\n    Type membername2;\n\
    \    Type membername3;\n    .\n    .\n} objectname;\n```\n\n`struct` 关键字告诉编译器正在定义一个结构体。`object_name`\
    \ 允许用户直接声明结构体类型的对象，即可以在单个对象中实例化不同的对象。\n\n### 示例 1:\n\n```cpp\nStruct person\n\
    {\n    Char fname[15], lname[15];\n    Int age, code;\n    Float salary;\n} samuel,\
    \ anthony, paul;\n```\n\n上面的示例定义了一个名为 `person` 的结构体标签，并将不同数据类型的变量与传递给结构体的对象存储在一起。\n\
    \n### 示例 2：创建一个包含 10 个对象数组的结构体\n\n```cpp\nStruct products\n{\n    Char prodname\
    \ [20];\n    Int weight;\n    Float price;\n} items [10];\n```\n\n### 如何访问结构体内存\n\
    \n一旦你定义并声明了结构体变量，就可以直接对它们的成员进行操作。要访问结构体成员，使用点（`.`）运算符，也称为访问运算符。\n\n访问运算符插入在 `object_name`\
    \ 和 `member_name` 之间。\n\n`Mango.price;`\n\n### **初始化结构体元素**\n\n你可以通过给结构体元素赋值来初始化它们。你可以使用单独的赋值语句或数组表示法来初始化元素。\n\
    \n例如，如果你想给芒果的价格赋值 50，可以这样做：\n\n```cpp\nMango.price = 50;\n```\n\n使用数组表示法时，你可以如下所示初始化元素：\n\
    \n```cpp\nType student = {10, 15.6, 50.0, ‘b’};\n```\n\n只有当结构体变量已经定义时，数组类型初始化才有效。上述语句中的类型是结构体\
    \ `student` 的类型标识符，它是同时声明和初始化的。赋值给结构体成员的所有值应该包含在大括号内。\n\n### 示例:\n\n```cpp\n#include<io,stream.h>\n\
    #include<conio,.h>\n#include<stdio.h>\n\nStruct student\n{\n    int studno;\n\
    \    char studname[30], course [20], class [2];\n    float marks[4];\n    char\
    \ grade;\n}student_var;\n\nVoid main()\n{\n    float sum = 0;\n    float average;\n\
    \    cout<<\"enter student's number: \";\n    cin>>student_var.studno;\n    cout<<\"\
    enter student's name: \";\n    cin>>student_var.studname;\n    cout<<\"enter student’s\
    \ course: \";\n    cin>>student_var.course;\n    cout<<\"enter student's class:\
    \ \";\n    cin>>student_var.class;\n    cout<<\"enter student’s marks on:\\n\"\
    ;\n    for(int m=0; m<4; m++)\n    {\n        cout<<m+1<<\": \";\n        cin>>student_var.marks[m];\n\
    \        sum = sum + student_var.marks[m];\n    }\n    average = sum / 4;\n  \
    \  if(average<50)\n    {\n        student_var.grade = 'fail';\n    }\n    else\
    \ if(average<65)\n    {\n        student_var.grade = 'pass';\n    }\n    else\
    \ if(average<80)\n    {\n        student_var.grade = 'credit';\n    }\n    else\n\
    \    {\n        student_var.grade = 'dist';\n    }\n    cout<<\"\\nresult:\\n\"\
    ;\n    cout<<student_var.studno<<\"\\t\\tname: \"<<student_var.studname;\n   \
    \ cout<<\"\\t\\tcourse: \"<<student_var.course<<\"\\t\\tclass: \"<<student_var.class;\n\
    \    cout<<\"\\t\\ttotal: \"<<average<<\"\\t\\tgrade: \"<<student_var.grade;\n\
    \    return 0;\n}\n```\n\n**输出:**\nenter student's number:\nenter student's name:\n\
    enter student’s course:\nenter student's class:\nenter student’s marks on:\n1:\
    \ 50\n2: 60\n3: 70\n4: 80\nresult:\n1\t\tname: John course: C class: A total:\
    \ 65 grade: pass\n\n## **C++ 中的引用**\n\nC++ 引用是现有变量的另一种别名。一旦你用引用初始化一个变量，就可以使用该引用名称。C++\
    \ 支持三种类型，包括：\n\n- `值引用`：这些是值\n- `常量引用`：这些不会被修改\n- `指针引用`：这些有助于避免拷贝\n\n要声明引用，使用取地址符（`&`），它也是地址运算符。\n\
    \n### 示例 1:\n\n```cpp\nint prd=5;\nint &x = prd;\n```\n\n### 示例 2:\n\n```cpp\n\
    #include<iostream>\nUsing namespace std;\n\nInt main()\n{\n    double price =\
    \ 100;\n    double &ref = price;\n    // 修改价格\n    ref = 120;\n    cout << \"\
    price = \" << price << endl;\n    // 修改 ref\n    price = 150;\n    cout << \"\
    ref = \" << ref << endl;\n    return 0;\n}\n```\n\n**输出:**\nprice = 120\nref =\
    \ 150\n\n### 引用的应用\n\n1. **修改函数的参数**：如果你想在函数调用期间更改传递给函数的参数，可以引用变量。在上面的示例中，引用变量将价格从\
    \ 100 修改为 120。\n2. **避免拷贝大型结构体**：如果你有一个执行大量对象的函数，在不引用的情况下传递参数会创建对象的副本。为了避免这种重复，可以使用引用。\n\
    \n### 示例:\n\n```cpp\nStruct employee\n{\n    string empnames, address;\n    int\
    \ empno;\n}\n\nVoid print (const employee &em)\n{\n    cout << em.empnames <<\
    \ \" \" << em.address << \" \" << em.empno;\n}\n```\n\n如果我们移除引用运算符，它将创建一个 employee\
    \ 对象的新副本。`const` 关键字防止了对程序的的意外更新。\n\n"
- fmt: "\nWith the help of programming paradigms, programmers can easily design, organize\
    \ and build a program that solves various problems. there are two types of programming\
    \ paradigm; a declarative programming paradigm and an imperative programming paradigm.\
    \ `c++` language is an imperative programming language since it relies on OOP\
    \ concepts to execute functions.\n\nThe major key elements in this chapter included:\n\
    \n- learning various built-in data types and how to use them in writing a program.\n\
    - how to use user-defined types to execute complex programs.\n- how to declare\
    \ variables in `c++` and allocate memory location for the user variables.\n- how\
    \ to declare arrays to hold data elements, initializing arrays, accessing array\
    \ elements as well as know how to work with both two dimensional arrays and multidimensional\
    \ arrays.\n- using pointers to point to a specific storage location and allow\
    \ you to determine the reference address of the variable.\n- learning how to use\
    \ dynamic free store operators to allocate memory space for your programs.\n-\
    \ how to use `c++` functions to build programs and implement code reusability\
    \ features to make complex programs more effective.\n- learn function definitions,\
    \ how to declare functions, make function calls, and how to use function proto\
    \ types and inline functions.\n- learning how to use references when dealing with\
    \ large objects to enable you reduce the overhead time in function calls. references\
    \ will help you minimize cpu execution time and save on memory space since it\
    \ prevents duplication of objects whenever a function call is made.\n- how to\
    \ use structures and references to access objects. data structures allow you to\
    \ work with variables of different data types under a single unit.\n- creating\
    \ variables with different return types and data elements under a single name\
    \ to avoid code repetition.\n- making calls to structure functions and pass arguments\
    \ of different data types.\n\nIn the next chapter, you will learn basic concepts\
    \ of object oriented programming including the use of classes, objects, data abstraction\
    \ and encapsulation, polymorphism and inheritance feature.\n\n## Chapter two:\
    \ basic concepts in object oriented programming\n\nIt is necessary to understand\
    \ the basic concepts used in object-oriented programming. see figure below.\n\n\
    ![00220.jpeg](images/00220.jpeg)\n\n### Class\n\nA class is an expanded concept\
    \ of data structure and a building block for `c++` programming language. it consists\
    \ of logical methods for organizing data and functions in the structure. the `class`\
    \ keyword denotes the data structure with functions represented as members.\n\n\
    A class consists of two parts: class header and body. a class header defines the\
    \ class name and the base class, whereas the class body defines the class members\
    \ supported by each class. the class uses user-defined data type to hold its own\
    \ data members and member functions. class members and functions are accessed\
    \ by creating an instance of the class.\n\n- **Class members**: they represent\
    \ the data variables in that class and specify how class objects are represented.\n\
    - **Member functions**: describes the function proto type used in manipulating\
    \ these data variables. it specifies class operations which is also, referred\
    \ to, as the instance of the class.\n\nBoth member functions and data members\
    \ define the properties and behavior of an object in a class.\n\nClass members\
    \ fall under three access permissions: public, private and protected.\n\n- **Public\
    \ members**: data members in this class are accessible by every class member and\
    \ from anywhere as long as the class is visible.\n- **Private members**: in this\
    \ class, data members are only accessible by the class members or other members\
    \ of the same class.\n- **Protected members**: these are only accessible within\
    \ the class members and other members from a derived class.\n\n#### Syntax\n\n\
    ```\nClass classname\n{\nAccess specifier:\n    Member(s);\n\nAccess specifier\
    \ 2:\n    Members(s);\n\nAccess specifier n:\n    Member(s);\n};\n```\n\nWhere,\n\
    \n- `Class` is the keyword that denotes the class.\n- `classname` is a name.\n\
    - `Access specifier` is the access granted to class: either public or protected.\n\
    - `Members` defines the class members and functions.\n\n#### Example\n\n```\n\
    Class cars\n{\nchar carname[30];\nchar brand[30];\nfloat speedlimit;\n\npublic:\n\
    \    void getdata();\n    void display();\n};\n```\n\nIn this example, the data\
    \ members will be `carname`, `brand`, and `speedlimit`. the function `getdata()`\
    \ is for the car object. From the above, we can deduce that a class is a blueprint\
    \ for objects with similar properties. In `c++`, an object is an entity which\
    \ possesses some characteristics and it is created during runtime.\n\nAn instance\
    \ of a class is an object. When you define a class, there is no memory allocated,\
    \ but when you create an instance, memory is allocated for the object type. An\
    \ object is an instance of the class.\n\n#### Syntax\n\n```\nIdentifier.message([arg1,\
    \ arg2])\n```\n\nWhere,\n\n- `identifier` is the object name.\n- `.` represents\
    \ the member access.\n- `message` is the type of message sent.\n- `arg` is an\
    \ optional list of arguments to be returned the message.\n\nThe dot between the\
    \ identifier and the message is the access operator that identifies the data members\
    \ and functions.\n\n#### Example\n\n```\nClass person\n{\nchar fname[25], lname[25];\n\
    int age;\n\npublic:\n    void getdetails();\n    void display();\n};\n\nvoid person::getdetails()\n\
    {\n    cout << \"enter your first name and last name:\";\n    cin >> fname >>\
    \ lname;\n    cout << \"enter your age:\";\n    cin >> age;\n}\n\nvoid person::display()\n\
    {\n    cout << \"your name is:\" << fname << lname << \" aged\" << age;\n}\n\n\
    int main()\n{\n    person p; //p is an object\n    p.getdetails(); //call to enter\
    \ names and age function\n    p.display(); // call to display your name and age\n\
    \    return 0;\n}\n```\n\n`p` is an instance of the class `person`. In the example\
    \ above, `getdetails()` and `display()` are member functions of the `person` class.\
    \ To call these functions, we use the dot operator `.` followed by the object\
    \ name `p`.\n"
