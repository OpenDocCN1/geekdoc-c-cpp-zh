    fro,m a base class. the new class derived will have the characteristics o,f the
    base class. the base class will act as the parent o,r super class while the derived
    class will act as the child class o,r a sub-class.


    The sub-class inherits all the pro,perties and characteristics o,f the super class
    (parent class).


    Inheritance suppo,rts the co,ncept o,f co,de reusability. this is very impo,rtant
