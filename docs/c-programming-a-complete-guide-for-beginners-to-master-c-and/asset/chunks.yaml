  trans: "\n行参数指示显示的字符串名称，而 `size` 参数显示字符数。如果变量 `size` 大于程序的行宽，则会显示超出行边界的内容。\n\n##\
    \ 格式化控制台输入输出操作\n\nC++ 支持多种功能来帮助进行格式化输出。这些功能包括：\n\n- `ios` 类函数和标志。\n- 用户定义的输出函数。\n\
    - 操纵符（manipulators）。\n\n### ios 格式函数\n\n`ios` 类有大量函数，可以以多种方式对输出进行格式。这些成员函数包括：\n\
    \n| 成员函数 | 操纵符 | 作用 |\n| :--- | :--- | :--- |\n| `Width()` | `Setw()` |此函数表示显示输出值所需的字段宽度。\
    \ |\n| `Fill()` | `Setfill()` | 它指定了填充字段未用部分的必需字符。 |\n| `Precisio()` | `Setprecision()`\
    \ | 指明浮点数值小数点后要显示的位数。 |\n| `Setf()` | `Setioflags()` | 它指定了用于控制输出形式的格式标志。 |\n\
    | `Unsetf()` | `Resetiosflags()` | 它清除任何指定的标志 |\n\n当包含在输入输出语句中时，这些操纵符会更改流的参数格式。要在程序中访问操纵符函数，你必须包含\
    \ `io.manip` 文件。\n\n#### 定义字段宽度\n\n`width()` 函数决定了对象输出所需的宽度字段。你可以通过以下方式调用该函数：\n\
    \n```cpp\ncout.width(w);\n```\n\n其中，\n\n`w` 是宽度字段，它被打印在一个宽 `w` 个字符的字段中。该函数指定了单个对象的字段宽度。在打印完单个对象的输出细节后，它会恢复到默认设置。\n\
    \n例如：\n\n```cpp\ncout<<6543<<12<<\"\\n\"; // 按 6, 5, 4, 3 和 1, 2 的格式打印\n```\n\n\
    这将产生以下输出：\n```\n6\n5\n4\n3\n1\n2\n```\n\n#### 设置精度 (precision ())\n\n在处理浮点数时，它们会在小数点后后打印六位数字。为了避免打印所有这六位数字，你可以指定小数点后打印的位数。这可以通过使用\
    \ `precision()` 成员函数轻松实现。\n\n```cpp\ncout.precision(d);\n```\n\n其中，\n\n`d` 是小数点后要打印的位数。与\
    \ `width()` 不同，该函数会保留其设置直到被重置。\n\n示例：\n```cpp\ncout.precision(3)\n```\n\n####\
    \ 填充与填充\n\n宽宽未用部分总是用空格填充。`fill()` 函数用于用任何所需的字符填充这些未用的空格。\n\n```cpp\ncout.fill(ch);\n\
    ```\n\n其中，\n\n`ch` 是用于填充未用空格的字符。\n\n例如：\n\n```cpp\ncout.fill('*');\n```\n\n在这种情况下，空格将用\
    \ `*` 运算符填充。例如，某些机构（如银行）使用这种形式的填充空白，特别是在打印支票时。\n\n#### 格式标志、位域和 setf()\n\n`setf()`\
    \ 是 `ios` 类用于对齐答案的成员函数。\n\n```cpp\ncout.setf(arg1, arg2);\n```\n\n其中，\n\n`arg1`\
    \ 是 `ios` 类中已有的格式标志。该标志指示了输出的格式要求。`arg2` 是一个 `ios` 常量，指定了格式标志所属的格式组。\n\n示例：\n\
    ```cpp\ncout.setf(ios::left, ios::adjustfield);\ncout.setf(ios::scientific, ios::floatfield);\n\
    ```\n\n上述示例中的第一个语句应该与第二个语句具有组成员。\n\n示例：\n```cpp\ncout.fill (*);\ncout.setf(ios::left,\
    \ ios::adjustfield);\ncout.width (8);\ncout<<\"flag\"<<\"\\n\";\n// 输出\nF\nL\n\
    A\nG\n*\n*\n*\n```\n\n## 使用操纵符管理输出\n\n`io_manip` 头文件包含了一组操纵符函数，用于操纵输出格式。这些操纵符的工作方式与\
    \ `ios` 成员函数和标志相同。你可以在单条语句中使用多个操纵符。\n\n示例：\n```cpp\ncout<<a<<b<<c;\ncout<<a<<item1<<b<<item2;\n\
    ```\n\n当你想以列的形式显示数据时，上述的拼接将非常有用。你可以使用不同类型的操纵符来更改字段。这些操纵符包括：\n\n- 执行系列操作的操纵符集\n\
    - `Setw(int)`：设置字段为 `w` 的函数\n- `Width()`\n- `Setprecision(int)`：用于将浮点数设置为 `d`\
    \ 位的关键函数\n- `Precision()`\n- `Setfill(int)`：用于将填充元素设为 `c`\n- `Fill()`\n- `Setioflags(long\
    \ f)`：用于设置格式标志\n- `Setf()`\n- `Resetiosflags(long f)`：用于清除由 `f` 指定的任何格式\n- `endl()`：帮助你插入新行或刷新流\n\
    \n示例：\n```cpp\ncout<<setw(8)<<1234;\n```\n\n上述语句将在 8 个字符宽的右对齐字段中打印值 1234。该语句的输出可以更改为左对齐：\n\
    \n```cpp\ncout.setf(ios::left, ios::adjustfield);\ncout<<setw(8)<<1234;\n// 输出\n\
    1234    \n```\n\n#### 输出操作\n\n输入输出系统提供了用于处理输出的流类。输出操作以以下方式进行：\n\n```cpp\ncout.setf(ios::left,\
    \ ios::adjustfield);\ncout<<setw(8)<<1234;\n```\n\n输出操作\n\n输入输出系统提供了用于处理输出的流类。输出操作以输入流的方式到文件。在这种情况下，输出操作是：\n\
    \n```cpp\ncout<<1234;\n```\n"
- fmt: "\nTo open any file, you have to create a file stream first and then link it\
    \ to the filename. The file stream is declared using the `ifstream`, `fstream`\
    \ and `fstream` classes which are included in the `fstream` header file.\n\nThe\
    \ file class created depends on the purpose for creation. that is, whether to\
    \ read data or write data into the file.\n\nAfter creation of the file, you can\
    \ open it using:\n\n1. The constructor function in the class.\n2. The member function\
    \ `open()` in the class.\n\nOpening a file using constructor function is only\
    \ applied when one file is being used in the stream, while the `open()` function\
    \ method is used when opening multiple files using a single stream.\n\n### Opening\
    \ files using constructor\n\nIf a constructor is used to open a file, the filename\
    \ initializes the file stream object. this can be achieved through:\n\n1. Creating\
    \ a file stream object in order to manage the stream using an appropriate class.\
    \ in this case, you can use `fstream` class to create output stream while the\
    \ `ifstream` class creates an input stream.\n2. Using a desired filename so as\
    \ to initialize the file object. for example, the following code is used to open\
    \ a file named `performance` as an output:\n\n```cpp\nofstream outfile(\"performance\"\
    ); // to display an output.\n```\n\nThe `outfile` is created as an `fstream` object\
    \ whose main purpose is to manage the output stream.\n\nYou can also create an\
    \ `infile` as an `ifstream` object and associate it with the file data for reading\
    \ file inputs.\n\n```cpp\nifstream infile(\"data\"); // an input file\n```\n\n\
    You can use the same file name to read or write data into a file.\n\nWhen an object\
    \ terminates, it automatically closes the connection to that file. in the above\
    \ example on `performance` file, when the program is terminated, the `performance`\
    \ file will be disconnected from the `outfile` stream. this also happens to the\
    \ `infile` stream.\n\nA filename consists of a string of characters making it\
    \ a valid file name. a filename is divided into two parts: the primary name and\
    \ an extension. for example, `file.doc`, `test.txt`, and `input.cpp` among other\
    \ extensions.\n\n### Example: a program to write and read data from a file\n\n\
    ```cpp\n#include <iostream.h>\n#include <fstream.h>\n\nint main()\n{\n    char\
    \ prodname[20];\n    float price;\n\n    ofstream outfile(\"product\");\n    cout\
    \ << \"enter product's name:\";\n    cin >> prodname; outfile << prodname << \"\
    \\n\";\n    cout << \"enter the product's price:\";\n    cin >> price; outfile\
    \ << price << \"\\n\";\n    outfile.close();\n\n    ifstream infile(\"product\"\
    );\n    infile >> prodname;\n    infile >> price;\n    cout << \"\\n\";\n    cout\
    \ << \"product name is : \" << prodname << \"\\n\";\n    cout << \"product price:\
    \ \" << price << \"\\n\";\n    infile.close();\n\n    return 0;\n}\n```\n\n//\
    \ output\nProduct name is: mango,\nProduct price: 25\n\nThis program gets data\
    \ via the input device like keyword and writes it to a file. after completion\
    \ of the writing process, the file is closed. the file is then opened to read\
    \ the information already written in the file and later displayed on the screen\
    \ for the user to view.\n\n### Example 2: writing to a file.\n\n```cpp\n#include\
    \ <iostream>\n#include <fstream>\nusing namespace std;\n\nint main () {\n    ofstream\
    \ samplefile;\n    samplefile.open (\"sample.doc\");\n    samplefile << \"writing\
    \ data to the sample.doc.\\n\";\n    samplefile.close();\n    return 0;\n}\n```\n\
    \n### Opening files using open() function\n\nThe `open()` function opens multiple\
    \ files that use the same object. if a set of files are to be processed, then\
    \ a single object stream is created to enable opening each file.\n\n#### Syntax\n\
    ```cpp\nvoid open (const char* filename, ios mode);\nor open (filename, mode);\n\
    ```\nThe first argument indicates the name of the file together with its address,\
    \ while the second part of the argument indicates the access mode of the file.\
    \ There are different access modes for opening a file, and they include:\n\n-\
    \ `ios::in`: It is the default mode for `ifstream` files, it opens the file for\
    \ purposes.\n- `ios::out`: This mode is responsible for writing into a file. It\
    \ is the default mode for `fstream`.\n- `ios::binary`: It is used to open a file\
    \ in binary form.\n- `ios::app`: The `app` mode is suitable for opening the file\
    \ and appends the output at the end.\n- `ios::ate`: This mode is responsible for\
    \ opening the file and transferring the control to the end of the file.\n- `ios::trunc`:\
    \ It is used to delete data from an existing file.\n- `ios::no_replace`: It tests\
    \ the existence of a file and opens it if it exists. If a file doesn't exist,\
    \ `no_replace` opens a new file.\n\n#### Example\nTo access the member function\
    \ of `fstream` class, you have to create that class. `example_file` is an object\
    \ of type `fstream`. calling the `open()` function allows you to open the file\
    \ and write data into it. The default open mode for the files are:\n\n- `ifstream::in`\n\
    - `ofstream::out`\n- `fstream::in | ios::out`\n\nThe symbol `|` is used to combine\
    \ different modes. for example:\n```cpp\nexample_file.open(\"example.txt\", ios::out\
    \ | ios::ate);\n```\nThe input mode and control mode are combined to ensure the\
    \ file is opened for writing then transfers the control to the end of the file.\n\
    \nWhen a program terminates, the allocated memory is freed up and all opened files\
    \ are closed. using the `close()` function ensures all the files are closed as\
    \ soon as execution is complete. With the stream insertion operator `<<`, you\
    \ can write information into a file and use the stream extraction operator `>>`\
    \ to read the information from the file.\n\n#### Example: opening a file using\
    \ the open () and writing to the file\n\n```cpp\n#include<iostream>\n#include\
    \ <fstream>\nusing namespace std;\n\nint main()\n{\n    fstream example_file;\n\
    \    example_file.open(\"example.doc\", ios::out);\n    if(!example_file)\n  \
    \  {\n        cout<<\" file creation has failed\";\n    }\n    else\n    {\n \
    \       cout<<\"the new file was successfully created\";\n        example_file<<\
    \ \"this is a new file created\"; // writing to the file\n        example_file.close();\
    \ // close the file to free memory\n    }\n    return 0;\n}\n```\n\n// output\n\
    C:\\users\\faith\\documents>notepad++ example.cpp –o, example.exe\nC:\\users\\\
    faith\\documents\\example.doc\nThe new file was successfully created\n\nIn the\
    \ above program, we have created an object `example_file` to be used in the `fstream`\
    \ class. then we open the object using the `open()` function and create a new\
    \ file named `example` where to write data into. the file is assigned to `ios::out`\
    \ mode which allows writing into the file. `if` statement test whether the file\
    \ exists or not if the file is unavailable “file creation has failed” statement\
    \ is displayed, otherwise “the new file was successfully created” message will\
    \ be displayed on the screen.\n\n### Example 2: reading information from file\n\
    \n```cpp\n#include<iostream>\n#include <fstream>\nusing namespace std;\n\nint\
    \ main()\n{\n    fstream example_file;\n    example_file.open(\"example.doc\"\
    , ios::in);\n    if(!example_file)\n    {\n        cout<<\" the file doesn’t exist\"\
    ;\n    }\n    else\n    {\n        char ch;\n        while (!example_file.eof())\n\
    \        {\n            example_file>>ch;\n            cout<<ch;\n        }\n\
    \    }\n}\n```\n"
