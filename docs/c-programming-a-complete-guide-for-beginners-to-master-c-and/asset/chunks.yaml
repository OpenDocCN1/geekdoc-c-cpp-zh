  trans: "\n\n这一步骤涉及真实世界对象和抽象对象的识别。这些对象可以在应用程序中找到，并通过数据流图 (`dfd`) 和文本分析 (`ta`) 来进行分析。\n\
    \n### 数据流图\n\n数据流图使用各种表示数据的符号，它们用于指示数据从一个点到另一个点的流动。dfd 具有输入/输出符号、决策符号和作为所有对象数据存储的处理符号。\n\
    \n### 文本分析\n\n这包括对问题的详细文本描述，根据问题的复杂性，包含一两个段落或几个句子。\n\n1. **识别对象服务**：一旦识别了对象，下一步是确定每个对象应该执行的服务集。\n\
    2. **建立对象之间的连接**：在确定每个对象将提供哪些服务后，根据每个对象提供和接收的服务建立对象之间的通信。你可以使用实体关系图或信息流图来列出每个对象正在通信的信息。\n\
    \n## 面对象设计\n\n设计过程涉及映射对象并创建系统的概念模型。这使用自下而上的方法来构建系统结构，或者通过设计提供系统服务的类成员函数使用自上而下的方法。\n\
    \n在设计对象时，建立类层次结构、识别任何抽象类以及对象之间简单的消息传递过程是非常重要的。\n\n在映射内容时，如果你有之前的设计，要考虑类的可重用性以及将对象分类到子系统中。\n\
    \n### 面对象设计的步骤：\n\n1. **评估分析阶段创建的对象。**\n   评估在问题空间中识别出的对象使你能够根据它们的属性和操作来完善对象。它还让你识别出其他可以帮助你获得更多解决方案的对象。\n\
    \n2. **指定类依赖。**\n   分析类之间的关系非常重要，因为它能让你确定表示对象的合适类，并建立对象之间的关系。设计阶段阶段所需的关系关系包括：\n\
    \n* **继承关系**：这允许一个类继承另一个类的属性和行为。在这种情况下，对象可以从另一个类继承某些成员。\n* **包含关系**：在这种类关系中，类\
    \ a 的对象被用作类 b 的成员。\n* **使用关系**：这种关系提供了有关特定类所使用的各种类以及它如何使用这些类的信息。例如，类 a 可以通过以下方式使用类\
    \ b 和类 c：\n    * `class a` 读取 `class b` 的成员。\n    * `class a` 调用 `class c` 中的成员。\n\
    \    * `class a` 使用 new 算符创建 `class b`。\n\n如果你计划覆盖某些属性或函数，强烈建议使用继承关系。\n\n3. **将类组织成层次结构。**\n\
    \   在对象之间建立继承关系后，你必须重新检查关系并创建类层次结构。这允许你重用已经建立的数据和函数。在组相关类中识别类似的属性和函数有助于将类组织成层次结构。可以从相关类形成一个新的类，它被称为超类。其他类是子类。如果一个对象是通过组合所有类属性创建的，它被称为抽象类。\n\
    \n4. **设计类。**\n   这一步定义了用于所创建类上的方法，使其更有用。类中使用的某些函数包括：\n* **管理函数**：如何创建对象以及如何销对象。\n\
    * **实现函数**：在类数据类型上执行的操作。\n* **访问函数**：这是一个访问类内部变量的函数。\n* **工具函数**：这涉及处理错误和访问控制。\n\
    \n5. **设计成员函数。**\n   成员函数定义了在对象上执行的一些任务。这些函数的工作方式与其他类似。使用自上而下的方法设计成员函数。\n\n6.\
    \ **确定驱动程序。**\n   `main()` 是标准的 C++ 驱动程序。所有的调用都在 `main()` 中进行。驱动程序负责：\n   * 接收用户的输入。\n\
    \   * 从定义创建对象。\n   * 根据用户的显示输出。\n   * 调用成员函数。\n\n### 程序实现\n这一过程涉及对开发的程序进行编码和测试。代码使用成员函数和驱动程序编写。一旦完成程序编码，你就对其进行错误测试并确定其是否符合预期。程序测试是软件开发过程中本质特性。你应该制定详细的测试计划，说明测试什么以及如何进行测试。测试所有类依赖和接口是否有错误。测试的最终目标是确保程序按预期执行功能。\n\
    \n## C++编程构建模块\n\n### C++内置数据类型\n在声明变量时，你必须为每个变量定义数据类型。数据类型指示变量存储的是什么类型的数据。在 C++\
    \ 编程中，编译器根据数据类型为每个创建的变量分配内存。不同的数据类型需要不同的内存大小。\n\n数据类型\n三种 C++ 数据类型：\n1. 原生数据类型\n\
    2. 派生数据类型\n3. 抽象或用户定义类型\n\n#### 原生数据类型/内置数据类型\n原生数据类型是预定义的或内置的类型，直接用于声明变量。最常见的内置数据类型包括：\n\
    \n| 数据类型 | 关键字 | 范围 |\n| :--- | :--- | :--- |\n| 字符 | `char` | -127 到 127 以及 0\
    \ 到 255 |\n| 整数 | `int` | -2147483648 到 2147483647 |\n| 浮点 | `float` | +-3.4e38\
    \ |\n| 布尔表达式 | `bool` | 存储值为为真或假 |\n| 双精度浮点 | `double` | +/-1.7e308 (15 位) |\n\
    | 空 | `void` | 表示无类型 |\n| 宽字符 | `wchar_t` | 一个宽字符 |\n\n字符和整数数据类型可以使用以下 C++ 修饰符进一步修改：\n\
    * `signed`\n* `unsigned`\n* `short`\n* `long`\n\n这些修饰符指示存储这些变量需要多少内存空间。为所有创建的变量指定数据类型告诉编译器为每个变量分配多少空间。任何变量定义都指定数据类型和变量列表。\n\
    \n语法\n```\n类型 变量列表;\n```\n\n示例：\n```\nint a, b, c;\nchar y, n;\nfloat salary;\n\
    ```\n\n#### 派生数据类型\n正如名称所示，这种数据类型派自内置数据类型。它们包括：\n* 数组\n* 指针\n* 函数\n* 引用\n\n####\
    \ 抽象数据类型\n这是由用户定义的数据，因此称为用户定义类型。这些数据类型包括：\n* 枚举\n* 结构体\n* 联合\n* 类\n\n**枚举类型**\n\
    枚举数据类型使用 `enum` 变量来声明可选的数据类型和一组显示数据类型值的标识符。\n\n```cpp\nenum enum_name {list of\
    \ names}\n```\n\n其中，\n\n"
- fmt: "\nThe `enum_name` is the enumeration data type name. You can have one or more\
    \ lists of names separated by commas.\n\nFor example, we can define an enumeration\
    \ for class `rectangle` and call it `rectangle` and pass variable `l` to be assigned\
    \ to `length`.\n\n```cpp\nEnum rectangle {length, width} l=length;\n```\n\n##\
    \ Variable Scope\n\nA variable is declared either inside a function (local variables)\
    \ or outside a function (global variables).\n\n### Local variables\nDefined variables\
    \ within a block or inside a function are known as local variables. Once declared,\
    \ only statements within the functions can execute or access the variables.\n\n\
    Example:\n\n```cpp\n#include <iostream>\n\nUsing namespace std;\n\nInt main ()\
    \ \n{\n    // declaring local variables:\n    int x, y;\n    int z;\n    // initialization\
    \ of variables\n    x = 20;\n    y = 15;\n    z = x - y;\n    cout << z;\n   \
    \ return 0;\n}\n```\n\n### Global variables\nGlobal variables are declared outside\
    \ the function and can be called or accessed by any function. The variables are\
    \ usually declared at the top of the program after the namespace library thus\
    \ making it accessible throughout the entire program.\n\nExample:\n\n```cpp\n\
    #include <iostream>\n\nUsing namespace std;\n\n// declaring global variables\n\
    Int m;\n\nInt main () \n{\n    // declaring local variables:\n    int x, y;\n\
    \    // initialization of variables\n    x = 5;\n    y = 10;\n    m= x + y;\n\
    \    cout << m;\n    return 0;\n}\n```\n\n## C++ arrays\n\nIf you have multiple\
    \ variables to store values, you can create an array that allows you to declare\
    \ a single variable instead of declaring individual variables for each value.\
    \ An array is a data structure that stores a collection of variables of the same\
    \ data type.\n\nArrays are accessed through the use of an index. Each array element\
    \ is made of contiguous memory allocation with the lowest memory address allocated\
    \ to the first element of the array, and the highest memory address allocated\
    \ to the last element.\n\nWhen declaring an array, you have to specify the data\
    \ type, array variable name, and the number of elements to be stored in that array\
    \ variable.\n\n### Syntax\n`Type arrayname [arraysize]`\n\nThis type of array\
    \ is a single-dimensional array. `type` is the data type of the array element\
    \ and `arraysize` must be an integer number that is greater than 0. For example,\
    \ to declare an array with 3 elements, you can write it as follows:\n\n```cpp\n\
    String cars [3];\n```\n\n### Initializing arrays\nYou can initialize the arrays\
    \ created by allocating values to the array elements. These values are added inside\
    \ braces `{ }` and they shouldn’t be larger than the number of elements declared\
    \ between the square brackets `[ ]`.\n\nSyntax\n`Type arrayname [size] = {values}`\n\
    \nExample:\n\n```cpp\nString cars [3] = {\"bmw\", \"rav4\", \"volvo\"};\n```\n\
    \nIf you want to create an array for integer numbers, you can write:\n\n```cpp\n\
    int num[5] = {5, 10, 25, 20, 35};\n```\n\nDeclaring the array size tells the compiler\
    \ to create a memory allocation to hold 5 elements. If you don’t specify the array\
    \ size, a huge chunk of memory is created to hold the initialized variables.\n\
    \nArrays use index to represent variables with 0 index representing the first\
    \ element. You can represent the above array as follows:\n\n| Index | 0 | 1 |\
    \ 2 | 3 | 4 |\n| --- | --- | --- | --- | --- | --- |\n| Num | 5 | 10 | 25 | 20\
    \ | 35 |\n\n### Accessing arrays\nYou can access array element by indexing the\
    \ array name. This can be done by placing the index number of the element you\
    \ want to access within the square brackets after the array name.\n\nExample:\n\
    \n```cpp\nInt num[5] = {5, 10, 25, 20, 35};\ncout<< num[1]; // output 10\n```\n\
    \n### Using loops in arrays\nYou can use a for loop to execute array elements.\n\
    \nExample:\n\n```cpp\n#include <iostream>\n#include <string>\n\nUsing namespace\
    \ std;\n\nInt main()\n{\n    string cars[3] = {\"bmw\", \"rav4\", \"volvo\"};\n\
    \    for(int a = 0; a < 4; a++)\n    {\n        cout << cars[a] << \"\\n\";\n\
    \    }\n    return 0;\n}\n// output\n// Bmw\n// Rav4\n// Volvo,\n```\n\n## Multi-dimensional\
    \ arrays\n\nMultidimensional is an array of arrays which stores data in the form\
    \ of tables with both rows and columns (rows*columns), also known as the matrix.\
    \ It can be either a two-dimensional or three-dimensional array.\n\n### Syntax\n\
    `Type arrayname [size1] [size2] … [sizen]`\n\nExample:\n\n```cpp\nInt m [5] [12];\n\
    Int n [2] [2] [3];\n```\n\nTo get the number of elements stored in a multidimensional\
    \ array, multiply the size of all array dimension. In the array of `int m [5]\
    \ [12]`, you can store `(5*12) = 60` elements.\n\n### Two-dimensional array\n\
    A two-dimensional array is the simplest array format. This array format uses ‘r’\
