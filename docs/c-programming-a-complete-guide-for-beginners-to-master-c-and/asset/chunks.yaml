  trans: "\n\n*   动态绑定特性以及消息传递的工作原理。\n\n在下一章中，你将学习如何构建基类和派生类，以及如何处理数据成员和成员函数。\n\n\
    # 第三章：类与对象的操作\n\n在上一章中，你学习了类作为一种用户定义的数据类型，它是创建对象的蓝图。类扩展了数据结构的概念，就像数据结构一样，它们拥有数据成员和额外的成员函数。\n\
    \n## 使用类\n\n在处理复杂的类函数时，在类内部定义成员函数会使类的管理变得困难。\n\n### 类头文件与类体\n\nC++ 编程语言允许通过将类定义放在头文件中来实现代码复用。这促进了多个文件或项目之间的代码复用。就像在头文件中声明函数以便在多个项目中使用该函数一样，类定义被放在与类名同名的头文件中。\n\
    \n此类类的成员函数定义在类之外，并存储与类名同名的 `.cpp` 文件中。\n\n类头文件包含类定义、其数据成员以及成员函数的原型声明。\n\n注意：将所有成员函数都放在头文件中可能会导致类定义变得杂乱。在类内部定义的所有函数都是隐式内联的（inline），如果你处理的是一个频繁调用的复杂函数，它将减慢函数代码的执行速度。\n\
    \n如果你更改了头文件中的某些函数代码，你需要在包含该头文件的每个文件中进行相同的更改。否则，这将影响项目的重新编译过程。\n\n但如果你更改了 `.cpp`\
    \ 文件中的某些函数代码，只需要重新编译该 `.cpp` 文件。\n\n### 类的定义与声明\n\n在 C++ 中，类由相关的函数和数据组成。类中的数据和函数组合形成一种数据类型，用于创建该类型的对象。创建的类代表了具有各种数据类型属性和行为（即它们关联的操作）的现实世界实体。\n\
    \n#### 语法\n\n```\nClass 类名 {\n\n  访问修饰符 1:\n    成员 1;\n\n  访问修饰符 2:\n    成员 2;\n\
    \n  …\n} 对象名;\n```\n\n其中，\n\n*   `class` 关键字指示符表示新的数据类型，后面跟着类名，类名是标识该类的特定名称。\n\
    *   类由私有（private）和公共（public）访问修饰符组成。\n\n#### 私有 (Private)\n\n`private` 访问修饰符有助于实现数据隐藏概念。这通过在声明成员值时使用\
    \ `private` 关键字来实现。在 `private` 关键字下声明的数据成员和函数只能从类内部进行访问。\n\n数据隐藏概念是一种安全技术，可以防止未经授权的用户执行任何数据操作，如读/写操作或修改数据。因此，私有数据声明可以向未经授权的用户隐藏数据并防止意外操作。\n\
    \n#### 公共 (Public)\n\n在 `public` 访问修饰符中，数据和函数都可以在类外部访问。类中声明的成员函数通常是公共的，因此，你可以从类外部访问它们。\n\
    \n下面显示了私有和公共成员的类定义。\n\n```\nClass 类名\n{\n  Private: 变量声明（数据成员）；\n    函数声明（成员函数）；\n\
    \n  Public: 变量声明;\n    函数声明;\n\n  Protected: 变量声明;\n    函数声明;\n};\n```\n\n####\
    \ 语法\n\n```\nClass mytest\n{\n  private:\n    int x;\n    double y;\n    string\
    \ *name;\n    void getx () {x=25;}\n    …;\n\n  public:\n    int count;\n    void\
    \ gety () {y=15;}\n    …;\n};\n```\n\n其中，\n\n*   在这个示例中，`x`、`y` 和 `names` 定义在类内部，因此它们是私有成员，可以在该类内部访问。\n\
    *   `count` 是一个公共数据成员，可以在外部访问。\n\n### 数据成员与函数\n\n数据成员是在类中使用标准类型（如 `char`、`int`、`float`\
    \ 等）或派生类型（如指针和结构体）声明的任何变量。\n\n类内部的函数由名称组成并对所有成员具有访问权限。函数定义有两种：\n\n#### 类定义\n\n\
    这描述了数据成员和函数。\n\n#### 方法定义\n\n类的函数的描述代码有两种编写方式：\n\n*   在类内部\n*   在类外部\n\n当你使用内联函数（inline\
    \ functions）时，编译器会将函数代码插入到调用该函数的地方。这确保了函数的快速执行。\n\n示例：\n\n```\nClass rectangle\n\
    {\n  public:\n    float length;\n    float width;\n\n    float getarea() {\n \
    \       return length * width;\n    }\n};\n```\n\n要调用类的函数，必须使用点操作符（`.`）。\n\n**语法：**\n\
    \n```\nClass rectangle\n{\n  public:\n    float length;\n    float width;\n\n\
    \    float getarea();\n};\n\nfloat rectangle::getarea() {\n    return length *\
    \ width;\n}\n```\n\n要在类外部定义函数，必须使用作用域解析运算符（`::`），如上一章所示。\n\n**语法：**\n\n```\nType\
    \ 类名::函数(参数)\n{\n    函数体\n}\n```\n\n`::` 运算符允许你在类外部定义函数，即使该函数的名称与局部变量名称相同。\n\n\
    **示例：**\n\n```cpp\nClass rectangle\n{\n  public:\n    float length;\n    float\
    \ width;\n\n    float getarea();\n};\n\nfloat rectangle::getarea() {\n    return\
    \ length * width;\n}\n```\n\n### 调用类成员函数\n\n要调用对象的函数，你需要使用点操作符（`.`），如上一章所示。\n\n\
    **语法：**\n\n```\nRectangle rect; // 创建一个矩形对象\nRect.getarea(); // 调用对象的函数\n```\n\
    \n**示例：**\n\n```cpp\n#include<iostream>\n#include<string>\n\nusing namespace std;\n\
    \nclass product\n{\n    string prd_name;\n    float weight, price;\n\npublic:\n\
    \    void mgetdata();\n    void mfdisplay();\n};\n\nvoid product::mgetdata() {\n\
    \    cout << \"enter the product name\";\n    cin >> prd_name;\n    cout << \"\
    enter the product weight and price\";\n    cin >> weight >> price;\n}\n\nvoid\
    \ product::mfdisplay() {\n    cout << \"product name is\" << prd_name << \"weight\
    \ is\" << weight << \"and the price\" << price << endl;\n}\n\n//调用类成员函数\nint main()\
    \ {\n    product item;\n    item.mgetdata();\n    item.mfdisplay();\n    return\
    \ 0;\n}\n```\n\n"
- fmt: "\nIn a protected data member function, data members and member functions are\
    \ used by that current class or by the derived class where they are declared.\n\
    \nYou can access protected data members using the dot (`.`) operator within a\
    \ subclass of the current class. just like the public class, you can access protected\
    \ members from a class, friend function, or from a derived class.\n\nIf class\
    \ members are declared as protected then:\n\n* only the member functions of the\
    \ original class that declared it can have access to the variables.\n* only the\
    \ friends of the class that originally declared the members as protected access\
    \ class members.\n* they are accessed directly by a privately derived class that\
    \ has private access to the protected members.\n* only classes derived with either\
    \ public or protected access from a class where the data members were originally\
    \ declared can use them.\n\nWhen using base classes, then the `protected` keyword\
    \ indicates that both the public and protected members of the base class are protected\
    \ data members of the derived class.\n\nThe protected data members are not as\
    \ private as the private data members or more public than the public data members\
    \ which can be accessed from any function.\n\nYou can declare protected data members\
    \ as static, meaning they will be accessible to friend function or member function\
    \ of a derived class. if the members are not static, then they can be accessed\
    \ in the friend function and derived member functions using pointers or references.\n\
    \n### Types of class member functions\n\nThere are several member functions which\
    \ can be utilized to manipulate data members and functions in c++. these special\
    \ member functions include:\n\n1. Simple functions.\n2. Static functions.\n3.\
    \ Const functions.\n4. Inline functions.\n5. Friend functions.\n\n### Simple member\
    \ functions\n\nThese are the basic member functions declared in c++. they don’t\
    \ use any special keywords like `static` as they’re prefix. the general format\
    \ of the basic or simple member functions is shown below.\n\n#### Syntax\n\n```\n\
    Type function_name (arguments)\n{\n    function body;\n}\n```\n\n### Static member\
    \ functions\n\nThese member functions uses keyword `static` and it’s associated\
    \ with both data members and member functions. `static` means something that holds\
    \ the same position.\n\nTo make a function static, use the keyword `static` followed\
    \ by the function name. `static` functions works for the entire class rather than\
    \ for a specific object of the class.\n\nStatic functions are called using object\
    \ and direct member access operator (`.`). you can also call static member function\
    \ using the class name, a scope resolution operator, or by itself.\n\n#### Syntax:\n\
    \n```cpp\nClass s\n{\npublic:\n    static void fxn ()\n    {\n        …\n    }\n\
    };\n\nint main() {\n    // call the member function directly with its class name.\n\
    \    s::fxn ()\n}\n```\n\nThe above function can only access static data members\
    \ and static member functions. the ordinary data members or functions can’t be\
    \ accessed.\n\n### Const member functions\n\n`const` keyword is used to declare\
    \ constant variables. once a variable is defined as constant, its values can’t\
    \ be changed. when `const` is used with member functions, those functions can’t\
    \ modify the data objects or the related data members.\n\n#### Syntax\n\n```\n\
    Void x () const\n{\n    // function body\n}\n```\n\n#### 1. inline functions\n\
    \nWhen you define member functions inside a particular class, the function automatically\
    \ becomes an inline function.\n\n#### 2. friend functions\n\nFriend functions\
    \ provides private access to non-class functions. these functions are not a class\
    \ member function. `friend` function allows you to declare a global function as\
    \ a friend or a member function of another class as a friend.\n\n#### Syntax:\n\
    \n```cpp\nClass friendclass\n{\n    int x;\npublic:\n    friend void fn() //set\
    \ global function as a friend\n    \n    void fn()\n    {\n        friendclass\
    \ fc;\n        // accessing private data member\n        fc.x=10;\n        cout<<fc.x;\n\
    \    }\n};\n\nint main() {\n    fn ()\n}\n```\n\nA friend function will be able\
    \ to access private data members.\n\nExample:\n\n```cpp\nClass anotherclass\n\
    {\n    void fn();\n};\n\nClass friendclass\n{\n    int x;\npublic:\n    friend\
    \ void anotherclass::fn();\n};\n\nvoid anotherclass::fn()\n{\n    friendclass\
    \ fc;\n    fc.x=10;\n    cout<<fc.x;\n}\n```\n\n### Building classes\n\nWhen you\
    \ define member functions inside a particular class, the function automatically\
    \ becomes an inline function.\n\n### Base class and derived\n\nWhen using base\
    \ classes, then the `protected` keyword indicates that both the public and protected\
    \ members of the base class are protected data members of the derived class.\n\
    \nThe protected data members are not as private as the private data members or\
    \ more public than the public data members which can be accessed from any function.\n\
    \nYou can declare protected data members as static, meaning they will be accessible\
    \ to friend function or member function of a derived class. if the members are\
    \ not static, then they can be accessed in the friend function and derived member\
    \ functions using pointers or references.\n\n### Overriding methods\n\nIn a protected\
    \ data member function, data members and member functions are used by that current\
    \ class or by the derived class where they are declared.\n\nYou can access protected\
    \ data members using the dot (`.`) operator within a subclass of the current class.\
    \ just like the public class, you can access protected members from a class, friend\
    \ function, or from a derived class.\n\n### Access Modifiers\n\nIf class members\
    \ are declared as protected then:\n\n* only the member functions of the original\
    \ class that declared it can have access to the variables.\n* only the friends\
    \ of the class that originally declared the members as protected access class\
    \ members.\n* they are accessed directly by a privately derived class that has\
    \ private access to the protected members.\n* only classes derived with either\
    \ public or protected access from a class where the data members were originally\
    \ declared can use them.\n\n### Chapter summary\n\nIn this chapter yo,u learned\
    \ how to, use classes to solve various problems, including:\n\n* how to use class\
    \ headers and class body when defining objects, and how to define and declare\
    \ classes.\n* how to differentiate between data members and member functions.\n\
    * how to declare both data members and member functions, and determine whether\
    \ they should be declared as private, public or protected members.\n* how to access\
    \ the private, public and protected members in a class, as well as make calls\
    \ to the member functions.\n* how to, work with different class member functions\
    \ when invoking specific functions.\n* how to, build classes using the base class\
    \ and derived classes. from the base class or the parent class, you can derive\
    \ a child class which inherits the behavior and properties of the base class.\n\
    \nIn the next chapter yo,u will learn about class inheritance, including how the\
    \ derived class inherits properties.\n"
