  trans: "\n\n由于流的行为方式相同，它们的 i/o 函数可以在任何设备上运行。例如，你可以使用同一个函数向文件、打印机、扫描仪和显示单元写入内容。\n\
    \n流既是源点也是终点。源流向程序提供数据，通常被称为输入流。另一方面，目的流接收信息作为输出，被称为输出流。\n\n- **输入流**：这涉及字节从键盘等输入设备流向主内存进行处理的字节流。\n\
    - **输出流**：这是字节或处理后的数据从主内存流向输出设备（如显示器）的字节流。\n\nC++ 在其标准库中同时拥有 `cin` 和 `cout` 作为预定义流。这些流在程序开始执行时会自动被触发。`cin`\
    \ 流是一个输入流，它连接到标准输入设备，允许用户将新数据输入到系统内存，而 `cout` 代表输出流，它连接到输出设备以显示信息。\n\n## C++ 流类\n\
    \nC++ 中的 i/o 系统由一组类的层次结构组成，这些类定义了用于处理系统控制台单元和磁盘文件的流。流类层次结构在控制台单元内执行输入和输出操作。i/o\
    \ 流类声明在 `ioostream` 头文件中。每个与控制台通信的程序都应该包含该头文件。\n\n`ios` 作为输入流（`istream`）的基类，`ostream`（输出流）作为\
    \ `iostream`（输入输出流）的基类。`ios` 类被声明为虚基类，因此 `iostream`（输入输出流）只会继承其数据成员的一个拷贝。\n\n\
    `ios` 类为格式化和非格式化流的 i/o 操作提供基本支持。它支持对输入和输出流的处理。`istream` 类负责格式化和非格式化的输入，而 `ostream`\
    \ 类通过继承概念负责格式化输出。\n\n## 使用流类进行控制台操作\n\n| 类名 | 属性 |\n| :--- | :--- |\n| `ios` (基础输入输出流)\
    \ | 具有可以被其他输入输出类使用的基本属性。<br>拥有缓冲对象的指针。<br>声明了执行格式化输入输出操作必需的函数和常量。 |\n| `istream`\
    \ (输入流) | 它继承了 `ios` 属性。<br>用于声明 `get()`、`getline()` 和 `read()` 输入函数。<br>由重载的提取运算符\
    \ `>>` 组成。 |\n| `ostream` (输出流) | 它继承了 `ios` 属性。<br>允许你声明如 `put()` 和 `write()`\
    \ 等输出函数。<br>使用重载的插入运算符 `<<` |\n| `iostream` (输入输出流) | 通过多重继承继承了 `ios` 流和 `ostream`\
    \ 的所有特性。<br>它同时拥有这两个类的输入和输出函数。 |\n| `streambuf` | 通过缓冲区提供到所有物理设备的接口。<br>它作为 `ios`\
    \ 文件中 `filebuf` 的基类工作。 |\n\n## 非格式化输入/输出操作\n\n重载运算符 `>>` 和 `<<`\n\nC++ `cin` 和\
    \ `cout` 用于输入和输出的标准库函数分别使用了重载的运算符 `>>` 和 `<<`。`>>` 运算符在 `istream` 类中被重载，而 `<<`\
    \ 运算符在 `ostream` 类中被重载。\n\n若要从键盘读取输入数据，你使用 `>>` 运算符。\n\n```cpp\ncin >> variable1\
    \ >> variable n;\n```\n\n输入变量 `variable1` 直 `variable n` 是已经在类内部声明的变量名。`cin` 标准告诉计算机从键盘等输入设备搜索输入数据。\n\
    \n数据是逐字符读取的，并通过 `>>` 运算符赋值给指定的位置。输入之间由空白符分隔，如果编译器在读取变量时遇到空白符或与目标数据类型不匹配，则会终止。假设你有一个类，其中声明了一个整数类型的变量，你可以使用输入设备输入数据。\n\
    \n```cpp\nint num;\ncin >> num;\n```\n\n跟随 `>>` 运算符的 `cin` 语句将提示你在键盘上输入任何整数类型的值，如\
    \ 50。当你输入输入数据时，该运算符读取值 50 并将其赋值给变量 `num`。若要在屏幕上显示数据，你使用 `cout` 语句。\n\n```cpp\n\
    cout << data << n;\n```\n\n数据一直到 `n` 的所有数据可以是任何数据类型的变量或常量。\n\n## Put() 和 get()\
    \ 函数\n\n`istream` 和 `ostream` 类定义了两种成员函数 `get()` 和 `put()`，用于处理单个字符的输入输出操作。`get()`\
    \ 函数获取输入数据中的新字符、空格，甚至是制表符。`get(char*)` 类型将输入字符分配给函数，而 `get()` 返回输入字符。这些函数应该使用适当的对象进行调用。\n\
    \n示例：\n```cpp\nchar i;\ncin.get(i); // 这允许你从键盘获取一个字符并赋值给变量 i\ncout << i; // 在屏幕上显示该变量\n\
    ```\n\n上述代码读取并显示一行文本。`cout` 语句中的 `>>` 运算符逐字符读取并跳过任何空白符或换行符。`cin >> i` 可以代替 `cin.get(i)`。\n\
    \n```cpp\ni = cin.get();\n```\n\n在此处，成员函数 `get()` 的值被赋值给变量。`put()` 是 `ostream`\
    \ 类的成员函数，它输出单行文本的逐字符输出。例如：\n\n```cpp\nput(i);\n```\n\n`put()` 显示了变量 `ch` 的值。你可以将任何数字变量作为参数传递给\
    \ `put()` 函数。\n\n示例：\n```cpp\nchar x;\ncin.get(x); while(x != '\\n') {\n    cout.put(x);\n\
    \    cin.get(x);\n}\n```\n\n## Getline() 和 write() 函数\n\n`getline()` 和 `write()`\
    \ 函数负责以有效的方式读取或显示一行文本。`getline()` 读取包含换行符 `\\n` 的整行文本。当编译器遇到换行符时，程序执行。通过以下方式调用函数：\n\
    \n```cpp\ncin.getline(line, size);\n```\n\n函数调用触发 `getline()` 函数，它通过键盘读取用户输入的字符。一旦遇到\
    \ `size-1` 或 `\\n` 字符，读取就会终止。\n\n示例：\n```cpp\nchar empname [30];\ncin.getline(empname,\
    \ 30);\n```\n\n使用 `get()` 和 `put()` 表示 i/o 数据的程序示例：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    int m = 0;\n    char n;\n    cout <<\"\
    enter text\";\n    cin.get(n);\n    while (n != '\\n') {\n        cout.put(n);\n\
    \        m++;\n        cin.get(n);\n    }\n    cout << \"\\n number of characters=\"\
    \ << m << \"\\n\";\n    return 0;\n}\n```\n输入：\nC++ programming language.\n输出：\n\
    C++ programming language.\nNumber of characters=22\n\n"
