- fmt: '

    There are different types of paradigms and each fulfils a specific function based
    on the programming language. these paradigms are divided into two: declarative
    programming paradigm; and imperative programming paradigm.


    ![00214.jpeg](images/00214.jpeg)


    ## Declarative programming paradigm


    A declarative programming paradigm is divided into three components: logic; functional;
    and database or data driven. declarative programming expresses program logic without
    focusing on the control flow of the program. the programs developed focus on what
    to do, rather than how to do it. these paradigms emphasize what action needs to
    be done and declares the results to be achieved. for example, expressing computations
    include:


    ### Logic programming paradigm


    This programming paradigm focuses on solving logical computation problems like
    a program to solve a puzzle or series of data. logic programming paradigm relies
    on the knowledge base which is already known and passes it to a machine learning
    tool to, produce results. the logic paradigm relies on artificial intelligence
    and machine learning to solve problems.


    ### Functional programming paradigm


    This is a language independent program and has its roots in mathematical functions.
    the main principle in this paradigm is execution of mathematical functions. data
    is coupled into functions which hides the implementation details. the functions
    can be replaced with values and this doesn’t change the meaning of the program.


    ### Database or data driven programming paradigm


    This programming paradigm focuses on the use of data and movement. all the program
    statements are defined using data. it is event driven and provides data operation
    mechanisms like file creation, writing into files, updating files and databases,
    producing queries and reporting. there are a variety of programs developed for
    database applications, like the structured query language (`sql`), among others.


    ## Imperative programming paradigm


    Imperative programming paradigm uses a step by step process to achieve a specific
    goal. it emphasizes how to do a particular task like how to execute several statements
    and store the results. the paradigm works through change of program state by assigning
    statements.


    ### Advantages:


    * Simple to implement

    * Uses loops, variables, functions, and structures to execute program statements


    ### Disadvantages:


    * Complex programs increase the complexity of this paradigm

    * Parallel programming is not possible in this paradigm

    * Less efficient and productive


    The imperative paradigm has three categories: procedural; parallel processing;
    and oop.


    ### Procedural paradigm


    Just as the name suggests, this paradigm focuses on step by step processes for
    performing specific functions. it allows code reusability and it is very easy
    to implement. it is used to solve simple problems.


    ### Parallel processing paradigm


    In this type of paradigm, program instructions are processed using multiple processors.
    a parallel processing paradigm has several processors aimed at running a program
    in the shortest time possible. some `c++` library functions support this technique.


    ### Object oriented programming (oop)


    This uses a collection of classes and objects to write a program. an object is
    the smallest entity where all computations takes place. the paradigm focuses on
    the use of data rather than procedures to solve real world problems. oop slips
    the problem into a number of entities represented by objects and then builds data
    and functions based on these objects. it can solve complex problems about real
    life scenarios. `c++` is a good example of oop that attempts to eliminate some
    of the disadvantages of conventional programming languages.


    ![00215.jpeg](images/00215.jpeg)


    Each of the objects work independently and they’re encapsulated within modules.
    objects communicate with each other through ‘message passing technique’. these
    objects are organized into several classes in which they can inherit:


    * Security

    * Encapsulation

    * Code reusability

    * Inheritance


    ## Object-oriented design


    An object-oriented paradigm relies heavily on design. an object-oriented paradigm
    focuses on the use of data rather than procedures to solve real world problems.
    an object-oriented paradigm focuses on the data and objects.


    ### Object-oriented analysis


    Object-oriented analysis (`oa`) involves techniques used in determining the software
    requirements. object-oriented programming (`oop`) implements the software using
    languages like `c++`.


    ### Object-oriented design


    The object-oriented design provides us with powerful mechanisms to organize objects.
    the design should state:


    * Instances of objects

    * Communication between objects

    * Hierarchy

    * Client-server architecture

    * Classification


    The object-oriented design is very important in development. object-oriented analysis
    decomposes the software into various parts. it then establishes a logical model
    which evaluates the system.


    #### Steps in object-oriented analysis:


    1. Identifying the project problem.

    2. Creation of requirements for both the user and the software.

    3. Identifying the project objects and their attributes.

    4. Identify what services each object is to perform.

    5. Establishing communication between objects. objects should be able to connect
    with each other and exchange messages.


    ## Problem definition


    This is the first step in the system development cycle. it involves understanding
    the problem the user is facing and writing a problem statement. the problem statement
    should be refined and redefined using computer system engineering. a well-defined
    problem statement enables the programmer to come up with a requirements document.

