    **References in c++**


    C++ reference is an alternative name assigned to, an existing variable. o,nce
    yo,u initialize a variable name with a reference, yo,u may use the variable name
    o,r the reference to, call a variable.


    There are three types o,f references suppo,rted in c++ pro,gramming language.
    they include:


    ●  no,n-co,nstant references: these are simply called references and are declared
    to, no,n-co,nstant values.


    ●  co,nstant references: these co,nsist o,f co,nstant values


    ●  r-value references: these help to, avo,id repetitive co,pying and assist fo,rwarding
    functio,ns.


    In no,n-co,nstant references, variables are declared as references using the ampersand
    (&) o,perato,r which is declared between the variable name and the reference type.


    Int &ref = {value};


    The ampersand o,perato,r in this case will mean ‘reference to,’ and no,t ‘address
    o,f’. these references wo,rk the same as the values their referencing. that is,
