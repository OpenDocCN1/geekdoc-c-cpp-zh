  trans: "\n继承是一种面向对象的编程特性，它允许类借用其他类的成员，而无需重复其成员。它允许一个类（派生类或子类）获取另一个类（基类或超类）的属性和方法。被继承属性的类被称为基类、父类或超类，而继承这些属性的类被称为派生类、子类或子类。\n\
    \n当一个类继承另一个类的属性时，基类的变量和函数对新类可用，从而促进了代码的可重用性。派生类继承所有成员，私有成员除外。\n\n### 继承的重要性：\n\
    1. 支持代码重用\n2. 支持方法重写\n3. 使用 `virtual` 关键字\n\n### 基类和派生类\n在继承另一个类的成员时，超类的公共成员将保持为公共，受保护成员将保持为受保护。在私有继承中，超类的公共和受保护成员在子类中将保持为私有。\n\
    \n#### 语法\n```cpp\nClass subclass: access_mode superclass\n```\n应该先声明超类，即在定义子类之前定义。访问模式（`private`、`public`\
    \ 或 `protected`）指定了子类将继承超类的哪些属性。\n\n例如，假设你有一个 `employee` 类和一个 `manager` 类，其中 `manager`\
    \ 也是一个具有额外职责的 `employee`。你可以应用继承的概念，避免在 `manager` 类中重复 `employee` 类的数据成员和成员函数。\n\
    \n`manager` 类可以如下所示：\n\n```cpp\nClass manager: public employee\n{\nPublic:\n//\
    \ 额外的 manager 成员组件\n…\n};\n```\n继承帮助你声明 manager 类，而无需重复 `employee` 类内部的成员组件。`employee`\
    \ 是基类，而 `manager` 是派生类。\n\n```cpp\nClass student\n{\n    …\n};\n\nclass hod :\
    \ protected student\n{\n    …\n};\n```\n\n---\n\n### 继承的类型\n\n#### 单继承\n单继承是最简单的继承类型之一，一个类派生自一个类。派生类仅从这一个类继承成员组件。例如，类\
    \ `b` 继承了类 `a` 的属性和行为。类 `b` 继承了类 `a` 的所有公共和受保护成员。\n\n![00223.jpeg](img/00223.jpeg)\n\
    \n#### 语法\n```cpp\nClass b: public a {/*…*/};\n```\n或者\n```cpp\nClass b: protected\
    \ a {/*…*/};\n```\n\n#### 多重继承\n在多继承中，一个类可以从两个或多个直接基类继承成员。例如，你可以从类 `a` 和 `b` 基类创建派生类\
    \ `c`。\n\n![00224.jpeg](img/00224.jpeg)\n\n#### 语法\n```cpp\nClass c: public a,\
    \ public b {/*…*/};\n```\n\n#### 示例：\n```cpp\n#include<iostream.h>\n\nClass polygon\n\
    {\nProtected:\n    Int width, height;\nPublic:\n    void setvalues (int w, int\
    \ h)\n    {\n        width=w, height=h;\n    }\n};\n\nClass output\n{\nPublic:\n\
    \    void output (int);\n};\n\nvoid output::output (int i)\n{\n    cout<<i<<endl;\n\
    }\n\nClass rectangle:public polygon, public output\n{\nPublic:\n    Int area()\n\
    \    {\n        return width*height;\n    }\n};\n\nClass triangle: public polygon,\
    \ public output\n{\n    Int area()\n    {\n        return (width*height/2);\n\
    \    }\n};\n\nInt main()\n{\n    Rectangle rect;\n    Triangle tri;\n    Rect.setvalues\
    \ (6,4);\n    Tri.setvalues (6,4);\n    cout<< \"area of rectangle is:\"<<rect.output(rect.area);\n\
    \    cout<< \"area of triangle is:\"<<tri.output (tri.area);\n    Return 0;\n\
    }\n```\n\n#### 多级继承\n这是派生类继承自一个继承了另一个基类属性的类。例如，如果 `a` 是 `b` 的基类，而类 `b` 是 `c` 的基类，那么\
    \ `c` 就是 `b` 的派生类，而 `b` 是 `a` 的派生类。\n\n![00225.jpeg](img/00225.jpeg)\n\n#### 混合继承/虚继承\n\
    混合是几种继承类型的组合。例如，类 `b` 和 `c` 是基类 `a` 的派生类。从派生类 `b` 和 `c`，你可以创建一个新的派生类 `d`。这形成了混合继承，因为它结合了多种继承类型形成了一个新类。\n\
    \n![00226.jpeg](img/00226.jpeg)\n\n#### 层次结构继承\n层级继承有多个子类，它们继承同一个基类的属性。类 `b`、`c`\
    \ 和 `d` 继承单个类 `a` 的属性。\n\n![00227.jpeg](img/00227.jpeg)\n\n---\n"
- fmt: "\n# Inheritance and Destructors\n\nInheritance of destructor objects execute\
    \ in reverse order during execution of a constructor. When the object gets out\
    \ of scope, the destructor is executed. See below for an example of constructor\
    \ and destructor program using multiple inheritance.\n\n## Syntax\n\n```cpp\n\
    #include<iostream.h>\n#include<iostream.h>\n\nClass base1\n{\npublic:\n    base()//\
    \ constructor with zero arguments\n    {\n        cout << \"zero arguments constructor\
    \ \\n\";\n    }\n    ~base()\n    {\n        cout << \"destructor of base1 class\\\
    n\";\n    }\n};\n\nClass base2\n{\npublic:\n    base2()\n    {\n        cout <<\
    \ \"zero argument constructor for base2 class\\n\";\n    }\n    ~base3()\n   \
    \ {\n        cout << \"destructor of base2 class\\n\";\n    }\n};\n\nClass base3:\
    \ public base1, public base2\n{\npublic:\n    base3()\n    {\n        cout <<\
    \ \"zero argument constructor for a derived class \\n\";\n    }\n    ~base3()\n\
    \    {\n        cout << \"destructor of the derived class \\n\";\n    }\n};\n\n\
    Int main ()\n{\n    clrscr ();\n    base3 obj; // declaring object\n    return\
    \ 0;\n}\n\n// output\nZero arguments constructor\nDestructor of base1 class\n\
    Zero argument constructor for base2 class\nDestructor of base2 class\nZero argument\
    \ constructor for a derived class\nDestructor of the derived class\n```\n\nIn\
    \ the above program, `base1` and `base2` are the superclass while `base3` is the\
    \ derived class. The constructors of the superclass are executed first before\
    \ executing the derived class. The destructor of the derived class is executed\
    \ before executing the superclass.\n\nYou can call the superclass constructor\
    \ in a derived class constructor. When you create a derived class object from\
    \ an existing base class, the base class becomes a constructor by default, and\
    \ it is executed first then followed by the derived class.\n\nWhen making a call\
    \ to a base class constructor with parameters inside the derived class constructor\
    \ which also has parameters, then you have to explicitly mention it when declaring\
    \ the parameters of the derived class constructor.\n\nBase class is the default\
    \ constructor which is present in all types of classes. see example below.\n\n\
    ## Syntax\n\n```cpp\nClass construct\n{\n    Int x;\npublic:\n    construct()\n\
    \    {\n        cout << \"building default constructor\\n\";\n    }\n};\n\nClass\
    \ child : public construct\n{\n    Int y;\npublic:\n    Child()\n    {\n     \
    \   cout << \"default derived constructor\\n\";\n    }\n    // constructor with\
    \ parameters\n    child(int z)\n    {\n        cout << \"parameterized derived\
    \ constructor\\n\";\n    }\n};\n\nInt main()\n{\n    construct c;\n    Child c1;\n\
    \    Child c2(10);\n}\n\n// output\nBuilding default constructor\nDefault derived\
    \ constructor\nBuilding default constructor\nParameterized derived constructor\n\
    ```\n\nIn the above example, the base class is the default constructor class which\
    \ is called together with objects from derived/child class. The example below\
    \ shows base class constructor with parameters.\n\n## Syntax\n\n```cpp\nClass\
    \ construct\n{\n    Float x;\npublic:\n    construct(float i)\n    {\n       \
    \ x=i;\n        cout << \"parameterized constructor\\n\";\n    }\n};\n\nClass\
    \ child : public construct\n{\n    Float y;\npublic:\n    child(float j): construct(j)\n\
    \    {\n        y=j;\n        cout << \"parameterized derived constructor\\n\"\
    ;\n    }\n};\n\nInt main()\n{\n    child (10);\n}\n\n// output\nParameterized\
    \ constructor\nParameterized derived constructor\n```\n\nAn explicit call to the\
    \ parameterized base constructor class permits a call to the parameterized derived\
    \ class constructor. a constructor base class is called inside the derived class.\
    \ this allows the constructor to initialize the object in the class.\n\nA derived\
    \ class constructor can only access its own class members while a derived class\
    \ object inherits the characteristics and properties of the base class. a base\
    \ constructor initializes the members of the base class.\n\n## Upcasting in C++\n\
    \nThe use of superclass reference or pointer to a subclass object is known as\
    \ upcasting. that is converting the subclass address or pointer to its superclass\
    \ reference. ![0028.jpeg](images/0028.jpeg)\n\n## Syntax\n\n```cpp\nClass baseclass\n\
    {\n    Int i;\npublic:\n    void base()\n    {\n        cout << \"this is superclass\"\
    ;\n    }\n};\n\nClass derived:public baseclass\n{\n    Int j;\n};\n\nInt main()\n\
    {\n    Baseclass* ptr; // pointer to base class\n    Derived obj;\n    ptr = &obj;\
    \ // baseclass's reference\n    Baseclass &ref=obj;\n}\n```\n\nIn downcasting,\
    \ the base class’s reference or pointer is converted into a derived class reference\
    \ or pointer. Note: constructors and destructors are not inherited. the assignment\
    \ operator (=) can be overloaded but cant be inherited by a subclass.\n\n## Inheritance\
    \ and Static Functions\n\n*(Note: The provided text for \"Inheritance and static\
    \ functions\" was incomplete/missing details in the source, but I have maintained\
    \ the structure based on the available snippets.)*\n1. The static functions can\
    \ be inherited into the derived class.\n2. If static functions are redefined in\
    \ a derived class, then other overloaded functions in the super class are hidden.\n\
    3. All static member functions cannot be virtual.\n\n## Hybrid Inheritance and\
    \ Virtual Class\n\nWhen a derived class inherits properties of more than one base\
    \ class, it results in multiple inheritance. see example.\n\n## Syntax\n\n```cpp\n\
    Class basea\n{\n    void print();\n};\n\nClass baseb:public basea\n{\n    // derived\
    \ definition\n};\n\nClass basec:public basea\n{\n    // derived definition\n};\n\
    \nClass based:public baseb, public basec\n{\n    // class definition\n};\n\nInt\
    \ main()\n{\n    D obj;\n    obj.print();\n}\n```\n\n`baseb` and `basec` inherit\
    \ the `print()` function in `basea`. class `based` inherits two copies of the\
    \ `print()` function. when you call the `print()` in the `main()` function, it\
    \ results in ambiguity since the compiler doesn’t know which `print()` function\
    \ to call. to avoid this, a virtual function is used. this is done by inserting\
    \ the virtual keyword when the class is being inherited.\n\n```cpp\nClass baseb:\
    \ virtual basea\n{\n    // derived definition\n};\n\nClass basec: virtual basea\n\
    {\n    // derived definition\n};\n\nClass based:public baseb, public basec\n{\n\
    \    // class definition\n};\n```\n\nThe virtual keyword tells the compiler to\
    \ call any of the two functions.\n\n## Managing Dynamic Data\n\nC++ allows you\
    \ to dynamically allocate memory space for your program. initially, a programmer\
    \ can determine the memory space of the program by defining the variables before\
    \ the program executes. there are cases where the memory can only be determined\
    \ during run time or is based on user input. in this case, the memory is dynamically\
    \ allocated to programs. dynamic memory determines how the data is processed and\
    \ stored.\n\nPointers are also used for memory allocation and hold the memory\
    \ address of a variable. when you declare a variable it has two components:\n\
    - the address of the variable\n- the value which is stored in the variable. for\
    \ example: `int y=200`.\n\nThe above example tells the compiler to:\n1. Create\
    \ a space in memory to store the value of the variable.\n2. Associate the variable\
    \ `y` with the reserved memory location.\n3. Store value 200 at the reserved memory\
    \ location.\n\nPointer is one of the useful features in c++ language, and once\
    \ utilized in a program, it enables:\n1. Direct access and manipulation of the\
    \ memory location.\n2. Allocation of dynamic memory into a variable.\n3. Improvement\
    \ of efficiency in some routine programs.\n\n## Allocating and deallocating memory\
    \ with new and delete operators\n\nC++ program integrates the `new` and `delete`\
    \ operators to dynamically allocate the memory. the `new` operator followed by\
    \ the data type specifier dynamically allocates the memory of a program.\n\nIf\
    \ the user input has a sequence of more than one element, then the `new[]` operator\
    \ is need to allocate a block of memory.\n\n## Syntax\n\n```cpp\nPointer = new\
    \ return-type\n\nor\n\nPointer = new return-type [size]\n```\n\n```cpp\nint *mem;\n\
    ```\n"
