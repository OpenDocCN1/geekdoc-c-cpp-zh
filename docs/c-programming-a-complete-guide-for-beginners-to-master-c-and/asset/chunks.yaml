    The line argument indicates the string’s name displayed and the size argument
    shows the number of characters. if the variable `size` is greater than the program
    line, then beyond the bound of the line is displayed.


    ## Formatted console i/o operations


    There are various features supported by c++ to help format the output. these features
    include:


    - `ios` class function and flags.

    - user-defined output functions.

    - manipululators.


    ### ios format functions


    The `ios` class has a large number of functions for formatting the output in a
    number of ways. these member functions include:


    | Member function | Manipulators | Action |

    | :--- | :--- | :--- |

    | `Width()` | `Setw()` | This function indicates the required field size needed
    to display an output value. |

    | `Fill()` | `Setfill()` | It specifies the characters essential for filling unused
    portion of the field. |

    | `Precisio()` | `Setprecision()` | Indicates the number of digits which are to
    be displayed after the decimal point of float value. |

    | `Setf()` | `Setioflags()` | It specifies the format flag used to control what
    form of output is to be displayed. |

    | `Unsetf()` | `Resetiosflags()` | It clears any specified flag |


    When included in the i/o statements, these manipulators change the parameter format
    of a stream. to access manipulator functions in a program, you have to include
    `io.manip` file.


    #### Defining field width


    The `width()` function determines the width field needed for the output of an
    object. you can invoke the function through:


    ```cpp

    cout.width(w);

    ```


    Where,


    `w` is the width field and it is printed in a field of `w` characters wide. the
    function specifies the field width for a single object. after printing the output
    details of the single object, it reverts back to default settings.


    For example:


    ```cpp

    cout<<6543<<12<<"\n"; // printing in the format of 6, 5, 4, 3 and 1, 2

    ```


    This will produce the following output:

    ```

    6

    5

    4

    3

    1

    2

    ```


    #### Setting precision (precision ())


    When working with floating point numbers, they’re printed six digits after the
    decimal point. to avoid printing all these six digits, you can specify the number
    of digits to be printed after the decimal point. this can easily be achieved by
    the use of `precision()` member function.


    ```cpp

    cout.precision(d);

    ```


    Where,


    `d` is the number of digits after the decimal point are to be printed. the function
    retains its setting until they’re reset, unlike the `width()`.


    Example:

    ```cpp

    cout.precision(3)

    ```


    #### Filling and padding


    The unused part of field width is always filled up with white spaces. the `fill()`
    function is used to fill these unused white spaces with any desired character.


    ```cpp

    cout.fill(ch);

    ```


    Where,


    `ch` is the character used in filling up the unused white spaces.


    Example:


    ```cpp

    cout.fill(''*'');

    ```


    In this case, the white spaces will be filled with `*` operator. for example,
    some institutions like banks use this form of filling blank spaces, especially
    when printing a cheque.


    #### Formatting flags, bit fields and setf()


    The `setf()` is `ios` class member function for justifying answers.


    ```cpp

    cout.setf(arg1, arg2);

    ```


    Where,


    `arg1` is the already formatting flag in `ios` class. the flag indicates the formatting
    requirements of an output. `arg2` is an `ios` constant which specifies the formatting
    group to which the formatting flag belongs to.


    Example:

    ```cpp

    cout.setf(ios::left, ios::adjustfield);

    cout.setf(ios::scientific, ios::floatfield);

    ```


    The first statement in the above example should have a group member to the second
    statement.


    Example:

    ```cpp

    cout.fill (*);

    cout.setf(ios::left, ios::adjustfield);

    cout.width (8);

    cout<<"flag"<<"\n";

    // output

    F

    L

    A

    G

    *

    *

    *

    ```


    ## Using manipulator to manage output


    The `io_manip` header file has a set of manipulator functions which manipulates
    the output format. these manipulators work the same way as `ios` member functions
    and flags. you can use more than one manipulator in a single statement.


    Example:

    ```cpp

    cout<<a<<b<<c;

    cout<<a<<item1<<b<<item2;

    ```


    The above concatenation is great when you want to display data in column forms.
    There are different types of manipulators you can use to alter fields. these manipulators
    include:


    - Manipulator set of actions performed

    - `Setw(int)`: function for setting field with `w`

    - `Width()`

    - `Setprecision(int)`: essential for setting floating point numbers to `d`

    - `Precision()`

    - `Setfill(int)`: used to set the fill element with `c`

    - `Fill()`

    - `Setioflags(long f)`: used for setting the format flag

    - `Setf()`

    - `Resetiosflags(long f)`: used to clear any format specified by `f`

    - `endl()`: helps you insert a new line or to flush a stream


    Example:

    ```cpp

    cout<<setw(8)<<1234;

    ```


    The above statement will print values 1234 in a right justified field of 8 characters.
    the output of this statement can be altered to be left-justified. you can do this
    in the following way:


    ```cpp

    cout<<setw(8)<<setioflags(ios::left)<<1234;

    ```


    ## File operations


    The i/o system handles file operations similar to the i/o operations. in this
    case, file streams are used as an interface between the specific files and programs.
    files have both input and output streams.


    An input stream is a stream in which data is supplied to the program while an
    output stream is a stream that receives data from the program. the input stream
    extracts data from the file while the output stream enters data into the file.
    any input operation used on the data acts as a link between the program and the
    input file. similarly, output operations consists of an output stream that links
    the program with the output file.


    The input/output system in c++ language provides a set of stream classes essential
    for handling file methods and operations. some of these methods include the use
    of `ifstream`, `fstream`, and `fstream`. File stream classes are derived from
    `fstream` base class which corresponds to the `iostream` class. the class for
    managing disk files should be declared in the `fstream` and the file should be
    included in every program that needs the use of the file.


    ### Steps to file operation


    When using disk files you have to:


    1. Select a suitable name for the file.

    2. Define the data type and structure of the files.

    3. Define the file purpose.

    4. Define method for opening the files.


    ### File stream classes


    | Class | Contents |

    | :--- | :--- |

    | `Filebuf` | This class sets the file buffers for read and write operation. the
    class has `openprot` constant used in opening the file through the `open()` function.
    it also has both `open()` and `close()` member functions. |

    | `fstreambase` | `fstreambase` class offers various file operations common to
    the file streams. the `fstreambase` act as the base or super class for `fstream`,
    `ifstream`, and `ofstream`. it also contains both `open()` and `close()` functions.
    |

    | `ifstream` | It is responsible for input operations and has `open()` as the
    default input mode. `ifstream` inherits `get()`, `getline()`, `read()`, `tellg()`,
    and `seekg()` functions from the `istream` i/o system. |

    | `ofstream` | `ofstream` is responsible for output operation and it uses the
    `open()` with the default output mode. the class inherits function properties
    like `put()`, `write()`, `seekp()`, and `tellp()` from the `ostream`. |

    | `fstream` | It is responsible for offering support for simultaneous i/o operations.
    it uses `open()` with its default input mode. `fstream` inherits properties from
    `istream` and `ostream` classes via the `iostream`. |


    A filename consists of a string of characters making it a valid file name. a filename
    is divided into two, parts: the primary name and an extension. for example, `file.doc`,
    `test.txt`, and `input.cpp` among other extensions.

