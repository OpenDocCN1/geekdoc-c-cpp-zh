  trans: "\n\n```cpp\nExample_file.close(); // 关闭文件，以释放内存，\n\n}\n\nReturn 0;\n\n}\n\
    ```\n\n上程序程序读取了我们在上一个示例中已经创建的 `example.doc` 文件。要读取文件，使用了“输入”模式（`ios::in`）。使用提取运算符\
    \ `>>` 来打印文件的内容。\n\n### 寻找文件末尾\n\n在读取文件时，确定文件的末尾是非常重要的，否则如果没有检测到文件结束，程序将陷入无限循环。程序员应该为程序提供适当的指令，以便检测到文件结束。\n\
    \n一旦确定了文件结束，在读取所有数据后就可以轻松终止数据读取过程。如果确定了文件结束，当文件操作发生错误时，`fin ifstream` 对象将返回零值。\n\
    \n当 `fin` 在到达文件结束后返回 0 时，`while` 循环将终止。你也可以使用 `eof()` 函数检测文件结束。\n\n```cpp\nif(example.eof()!=0)\n\
    {\n    exit file\n}\n```\n\n如果检测到文件结束，则返回非零值；否则，如果没有检测到文件结束，则返回 0 值。程序在到达文件结束后会自动终止。\n\
    \n### 文件指针和操纵符\n\n每个 C++ 文件有两个指针：输入指针和输出指针。输入指针读取特定文件位置的内容，而输出指针将数据写入给定的文件位置。每当发生输入或输出文件操作时，适当的指针就会自动更新。\n\
    \n#### 默认文件操作\n\n当你以只读模式 `open` 一个文件时，输入指针被设置为文件的开头，以便从该文件的开头开始读取。如果以只写模式打开文件，则所有文件内容将被删除，并且输出指针被放置在文件开头。这确保了你从起始点写入文件。\n\
    \n要向现有文件添加更多数据，应以“追加”模式打开文件。这会自动将指针移动到文件的末尾。\n\n#### 文件指针的函数和操作\n\n所有使用指针的动作和文件操作默认都会发生。为了控制文件指针的移动操作，可以使用各种文件流类。其中一些这些文件流类的成员函数包括：\n\
    \n- `seekg()`：此函数将（输入）get 指针移动到特定位置。\n- `seekp()`：此函数将（输出）put 指针移动到特定位置。\n- `tellg()`：此函数指示\
    \ get 指针当前的位置。\n- `tellp()`：它指示 put 指针当前的位置。\n\n**示例：**\n\n```cpp\ninfile.seekg(5);\n\
    ```\n\n此函数将指针移动到标记为 5 的字节数处，因为文件字节是从 0 开始编号的。指针随后指向第 6 个字节，即为文件的当前位置。\n\n**示例\
    \ 2：**\n\n```cpp\nfstream myfile;\n\nmyfile.open(\"welcome\", ios::app);\nint\
    \ ppt=myfile.tellp();\n```\n\n当执行上述语句时，输出指针将移动到文件“welcome”的末尾，`ppt` 值表示文件中的字节数。\n\
    \n### 指定偏移量函数\n\nseek 系列函数（`seekg()` 和 `seekp()`）接受两个参数：\n\n- `seekg (offset,\
    \ refposition)`\n- `seekp (offset, refposition)`\n\n`offset` 参数表示从 `refposition`\
    \ 参数指定的位置开始移动文件指针的字节数。\n\n`refposition` 采用以下形式：\n\n- `ios::beg`：这表示文件的开头。\n- `ios::cur`：表示指针当前的位置。\n\
    - `ios::end`：表示文件的末尾。\n\n`seekg()` 函数移动所有与 get 指针相关的文件。`seekp()` 使用 put 指针移动文件及其相关文件。\n\
    \n### 顺序输入和输出操作\n\n文件流支持许多用于执行输入和输出操作的成员函数。成员函数 `put()` 和 `get()` 每次处理单个字符操作。`write()`\
    \ 和 `read()` 函数则写入和读取一个块二进制数据。\n\n#### put() 和 get() 函数\n\n你可以使用 `put()` 函数向关联的流写入单个字符。`get()`\
    \ 函数从关联的流中读取单个字符。让我们写一个程序来阐明这些函数在程序中是如何工作的。\n\n上程序请求一个字符串，一旦接收到字符串，它就会使用 `put()`\
    \ 函数循环逐个字符地将其写入文件。当字符串长度结束时，循环终止。执行后，程序将使用 `get()` 函数显示在屏幕上。`get()` 函数从文件中逐个字符地获取数据，直到达到文件结束条件。从文件中读取的数据将通过\
    \ `<<` 显示在屏幕上供用户查看。\n\n#### write() 和 read() 函数\n\n`write()` 和 `read()` 函数可以处理二进制形式的数据。数据值存储在磁盘文件中的格式与它们存储在内部内存时使用的格式相同。例如，`char`\
    \ 无论大小，都可以将其 2 个字节的数据存储为二进制形式，而 4 位整数值可以在字符中存储 4 个字节。\n\n二进制输入和输出的形式为：\n\n该函数接收两个参数：变量\
    \ `var` 的地址以及以字节形式表示的变量长度。地址用 `char*`（指向字符类型的指针）表示。\n\n**示例：**\n\n### 文件操作期间错误处理\n\
    \n在执行各种文件操作时，会遇到各种错误。这些这些问题包括：\n\n- 尝试访问的文件不存在。\n- 用于创建新文件的文件已存在。\n- 尝试无效的文件操作，如读取文件之外的数据。\n\
    - 磁盘没有足够的内存存储更多数据。\n- 处理无效的文件名。\n\n这些是在处理和操作文件时可能会遇到的常见文件操作问题。C++ 语言中的文件操作流继承了\
    \ `ios` 类的“stream-state”成员。stream-state 成员记录了当前打开文件的状态。`ios` 类支持许多用于读取流上记录的文件状态的成员函数。\n\
    \n#### 错误处理函数\n\n| 函数 | 含义及其返回值 |\n| :--- | :--- |\n| `eof()` | 如果读取文件时成功检测到文件结束，`eof()`\
    \ 返回真值或非零值；否则，它将返回零值。 |\n| `Fail()` 在输入和输出操作失败后，此函数返回真。 |\n| `Bad()` | 如果遇到无效操作或不可恢复的错误，它返回真。如果错误可以恢复且文件操作继续，则返回假值。\
    \ |\n| `Go,od()` | 如果没有遇到错误，它将返回真。如果 `file.good()` 函数返回真，则你可以继续其他 i/o 操作。如果它返回假，则不再执行进一步的操作。\
    \ |\n\n"
- fmt: "\nInput/output streams are an important feature in c++ programming language.\
    \ The streams help in class definition and provide a set of library functions\
    \ that perform a series of functions. In this chapter, you learned about the c++\
    \ streams concept and how to use input and output stream to execute programs.\
    \ You also learned the various devices you can use when working with various stream\
    \ input and outputs. C++ stream classes will enable you to:\n\n*   Define a hierarchy\
    \ of classes that defines the use of streams console unit and the disk files.\n\
    *   Learn how to declare the i/o stream classes in the header file as well as\
    \ learn the various console operations using the stream classes.\n*   Learn different\
    \ types of class names and their properties and functionalities.\n*   Learn how\
    \ `ios` class provide basic support for i/o operations on both unformatted i/o\
    \ operations and formatted i/o operations.\n*   Use the overloaded operators (`>>`\
    \ and `<<`) used for data inputs and outputs. The `cin` standard library functions\
    \ use the overloaded operators `>>` to read data from an input device. While `cout`\
    \ standard library function operator `<<` is used to display data on the screen\
    \ or output device.\n*   Use unformatted i/o operations like `put()` and `get()`\
    \ functions. The `put()` function is a member of `ostream` class which is used\
    \ to output data character by character, while the `get()` function works as input\
    \ stream.\n*   Learn how to use `getline()` and `write()` functions.\n*   Learn\
    \ various formatted console i/o operations supported by c++ language to format\
    \ the output.\n*   Use `ios` class functions and flags to format data inputs.\n\
    *   How to use user-defined output functions or the use of output manipulators\
    \ and other formatting features of `ios` class functions to format the output.\n\
    *   Learn how to use user-defined functions to format output.\n*   Learn how to\
    \ manage output with manipulators.\n*   Perform various file operations and know\
    \ how to handle stream classes.\n*   Know how to open files using constructors\
    \ and using `open()` function, create new files and how to write into a file.\n\
    *   Use c++ to write a code on how to open a file, write a code of how to write\
    \ into an existing file or creating a new file, as well as write a code of reading\
    \ information from a file.\n*   Use the `close()` member function which is added\
    \ in every file code to close the file.\n*   Learn how to control input output\
    \ streams through the use of classes. Both `istream` and `ostream` control the\
    \ input and output functions.\n*   Using working examples, derive an `iostream`\
    \ class from the `istream` and `ostream` classes. Other classes derived in i/o\
    \ streams include: `istream_withassign`, `ostream_withassign` and `iostream_withassign`.\
    \ These classes are derived from the properties of `istream`, `ostream`, and `iostream`\
    \ classes respectively.\n*   Use `eof()` function to test whether the end of file\
    \ is reached and it returns value 1 if it’s detected. You’re able to write a code\
    \ that determines the end-of-file, how to use the `close()` function to terminate\
    \ a program, and use of pointers to manipulate files.\n*   Use `seekg()` function\
    \ links to the associated file pointer (both input and output file pointer).\n\
    *   Write codes using the `put()` and `get()` functions which reads and writes\
    \ a single character in a file while the `write()` and `read()` are used for writing\
    \ and reading a block of binary data.\n*   Know how to handle errors during file\
    \ operations.\n\nIn the next chapter you will learn about exception handling.\
    \ By the end of the chapter you will understand the concept and principles of\
    \ exception handling, and the use of throw and catch mechanisms.\n\n# Chapter\
    \ nine: exception handling\n\n## Introduction\n\nException handling provides you\
    \ with a way to create and deal with errors that occur during program development\
    \ such as runtime errors. This is achieved by transferring the control of the\
    \ program to a special function called handlers. During program development there\
    \ are cases where the programmer is uncertain whether a piece of code will run\
    \ successfully or not due to runtime errors like resource allocation or out of\
    \ range errors. To solve this problem you have to place the piece of code under\
    \ exception. This is achieved by enclosing the piece of code in a `try` block.\
    \ When an exceptional circumstance arises within that block of code then an exception\
    \ is thrown that transfers the control to the exception handler. If there are\
    \ no exception detected or thrown then the program code continues to execute normally\
    \ and the handlers created are ignored. When the program code encounters an exceptional\
    \ condition it’s important to identify the exception and deal with it effectively.\
    \ An exception is that part of an object that occurs whenever an error is encountered\
    \ on that part of the program.\n\n### Principles of exception handling\n\nException\
    \ handling is a mechanism for detecting and reporting exceptional circumstances\
    \ in a program to ensure appropriate action is implemented. Exception handling\
    \ mechanism involves:\n\n1.  Detecting the exceptions (problem).\n2.  Throwing\
    \ the exception (acknowledge the error has occurred).\n3.  Catching the exception\
    \ (receive information on the error).\n4.  Handling the exceptions (taking corrective\
    \ actions to solve the problem).\n\nAn exception handling mechanism should have\
    \ two segments: one segment to detect the error and throw exceptions while the\
    \ other segment will catch the exceptions and take appropriate measures to handle\
    \ the errors. There are two types of exceptions; synchronous and asynchronous.\
    \ Synchronous exceptions are encountered during program runtime due to program\
    \ anomalies and they include out of range error and overflow error. Recurrence\
    \ of events beyond the program control results in asynchronous exceptions. An\
    \ example of asynchronous exceptions is keyboard interrupts.\n\n### Exception\
    \ handling mechanisms\n\nException handling is built on three keyword operators:\n\
    \n1.  `try`\n2.  `throw`\n3.  `catch`\n\nThe `try` keyword prefaces a block of\
    \ statements in order to generate exceptions. The block of statements is known\
    \ as the `try` block. Once an exception is detected it is thrown using the `throw`\
    \ keyword inside the `try` block statements. Exception handlers are defined by\
    \ the use of the `catch` keyword that catches an exception thrown using the `throw`\
    \ statement in the `try` block. The `catch` block statements must appear immediately\
    \ after the `try` block.\n\n#### Syntax\n\n```\ntry\n{\n    //block of statements\
    \ to be tried\n    throw exception\n}\ncatch (type arguments)\n{\n    Code to\
    \ be executed in case of exception\n}\n```\n\nWhen an exception is thrown in the\
    \ `try` block, the program control is transferred from the `try` block into the\
    \ `catch` statement. If the thrown object type matches the arguments type in the\
    \ `catch` block, then the catch statements to handle exceptions is executed.\n\
    \nIf the object arguments don’t match, the program is aborted using `abort()`\
    \ function. if no exception is detected or thrown, then the control is taken back\
    \ immediately using the `catch` block.\n\n#### Example\n\n```cpp\n#include <iostream.h>\n\
    \nUsing namespace std;\n\nInt main()\n{\n    try\n    {\n        throw 15;\n \
    \   }\n    catch(int a)\n    {\n        cout << \"an exception has occurred\"\
    ; << endl;\n    }\n\n    return 0;\n}\n```\n"
