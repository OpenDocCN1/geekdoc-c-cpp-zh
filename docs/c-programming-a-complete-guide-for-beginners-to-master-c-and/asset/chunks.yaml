  trans: "\n\n`enum_name` 是枚举数据类型的名称。你可以拥有一个或多个由逗号分隔的名称列表。\n\n例如，我们可以为类 `rectangle`\
    \ 定义一个枚举并将其命名为 `rectangle`，并将变量 `l` 赋值给 `length`。\n\n```cpp\nEnum rectangle {length,\
    \ width} l=length;\n```\n\n## 变量作用域\n\n变量声明在函数内部（局部变量）或函数外部（全局变量）。\n\n### 局部变量\n\
    定义在块内部或函数内部变量称为局部变量。一旦声明，只有函数内部的语句可以执行或访问这些变量。\n\n示例：\n\n```cpp\n#include <iostream>\n\
    \nUsing namespace std;\n\nInt main () \n{\n    // declaring local variables:\n\
    \    int x, y;\n    int z;\n    // initialization of variables\n    x = 20;\n\
    \    y = 15;\n    z = x - y;\n    cout << z;\n    return 0;\n}\n```\n\n### 全局变量\n\
    全局变量声明在函数外部，可以被任何函数调用或访问。变量通常声明在程序开头、命名空间库之后，从而使其在整个程序中可访问。\n\n示例：\n\n```cpp\n\
    #include <iostream>\n\nUsing namespace std;\n\n// declaring global variables\n\
    Int m;\n\nInt main () \n{\n    // declaring local variables:\n    int x, y;\n\
    \    // initialization of variables\n    x = 5;\n    y = 10;\n    m= x + y;\n\
    \    cout << m;\n    return 0;\n}\n```\n\n## C++ 数组\n\n如果你有多个变量要存储值，可以创建一个数组，允许你声明单个变量，而不是为每个值声明单独变量。数组是一种存储相同数据类型变量集合的数据结构。\n\
    \n通过索引访问数组。每个数组元素都是连续内存分配，最低内存地址分配给数组的第一个元素，最高内存地址分配给最后一个元素。\n\n在声明数组时，你必须指定数据类型、数组变量名以及在该数组变量中存储的元素数量。\n\
    \n### 语法\n`Type arrayname [arraysize]`\n\n这种数组是单维数组。`type` 是数组元素的数据类型，`arraysize`\
    \ 必须是一个大于 0 的整数。例如，要声明一个具有 3 个元素的数组，你可以如下所示写：\n\n```cpp\nString cars [3];\n```\n\
    \n### 初始化数组\n你可以通过为数组元素分配值来初始化创建的数组。这些值添加在大括号 `{ }` 内部，它们不应大于方括号 `[ ]` 之间声明的元素数量。\n\
    \n语法\n`Type arrayname [size] = {values}`\n\n示例：\n\n```cpp\nString cars [3] = {\"\
    bmw\", \"rav4\", \"volvo\"};\n```\n\n如果你想创建一个整数数组，可以这样写：\n\n```cpp\nint num[5]\
    \ = {5, 10, 25, 20, 35};\n```\n\n声明数组大小告诉编译器创建一个内存分配来持有 5 个元素。如果你不指定数组大小，将创建一个巨大的内存块来持有初始化的变量。\n\
    \n数组使用索引表示变量，索引 0 表示第一个元素。你可以如下表示上述数组：\n\n| Index | 0 | 1 | 2 | 3 | 4 |\n| ---\
    \ | --- | --- | --- | --- | --- |\n| Num | 5 | 10 | 25 | 20 | 35 |\n\n### 访问数组\n\
    可以通过索引数组名来访问数组元素。这可以通过在数组名后的方括号内放置想要访问的元素的索引号来实现。\n\n示例：\n\n```cpp\nInt num[5]\
    \ = {5, 10, 25, 20, 35};\ncout<< num[1]; // output 10\n```\n\n### 在数组中使用循环\n你可以使用\
    \ `for` 循环来执行数组元素。\n\n示例：\n\n```cpp\n#include <iostream>\n#include <string>\n\n\
    Using namespace std;\n\nInt main()\n{\n    string cars[3] = {\"bmw\", \"rav4\"\
    , \"volvo\"};\n    for(int a = 0; a < 4; a++)\n    {\n        cout << cars[a]\
    \ << \"\\n\";\n    }\n    return 0;\n}\n// output\n// Bmw\n// Rav4\n// Volvo,\n\
    ```\n\n## 多维数组\n\n多维数组是数组的数组，以具有行和列的表格形式（行*列）存储数据，称为矩阵矩阵它可以可以是二维数组或三维数组。\n\n###\
    \ 语法\n`Type arrayname [size1] [size2] … [sizen]`\n\n示例：\n\n```cpp\nInt m [5] [12];\n\
    Int n [2] [2] [3];\n```\n\n要获取多维数组中存储的元素数量，请乘以所有数组维度的大小。在数组 `int m [5] [12]` 中，你可以存储\
    \ `(5*12) = 60` 个元素。\n\n### 二维数组\n二维数组是最简单的数组格式。这种数组格式使用 ‘r’ 个行和 ‘s’ 个列来组成一个数组。\n\
    \n`Type arrayname [r][s]`\n\n其中 `r` 是行数，`s` 是列数。\n\n（注：原文中关于二维数组的描述存在大量重复，已根据逻辑进行了精简。）\n\
    \n"
- fmt: "\nThe allocation of free store memory is via the new `new` operator, and it\
    \ is deactivated using the `delete` operator. The `new` and `delete` operators\
    \ are system variables available for manipulation by the programmers.\n\nWhen\
    \ using data structures like lists and trees, dynamic allocation of free store\
    \ memory is essential. The `new` operator is used to request dynamic allocation\
    \ of free store memory.\n\n### Syntax\n\n```\nPointer = new data-type;\n```\n\
    or\n```\nPointer = new data-type [number-of-elements]\n```\n\nWhere,\n\n`Pointer-variable`\
    \ specifies the pointer of type `data type` and `datatype` is any built-in C++\
    \ data type.\n\n`Number-of-elements` is an integer value used when a sequence\
    \ of several elements or an array of elements is needed. Otherwise, if you only\
    \ need to allocate free memory for a single element, use `pointer = new type_expression`.\n\
    \nFree store objects created using the `new` operator are independent within the\
    \ scope and are available until destroyed by the `delete` operator. Classes are\
    \ dynamically allocated free store memory, and they’re accessed through the use\
    \ of pointers and references.\n\n### Example:\n\n```cpp\n// a pointer initialized\
    \ with null values\nfloat *ptr = new float;\n\n// initialize memory using the\
    \ new operator\nint *ptr = new int(15);\n\n// allocation of block memory with\
    \ an array of 5 integers\nint *ptr = new int[5];\n\n// using delete operator for\
    \ single expression\ndelete ptr;\n\n// delete operator for an array of elements\n\
    delete [] ptr;\n```\n\n### C++ Functions\n\nA function or method is a group of\
    \ statements that execute a particular task. C++ functions are divided into two:\n\
    \n1. Library functions\n2. User-defined functions\n\n#### Library functions\n\n\
    These are pre-defined or built-in C++ functions that perform a number of tasks.\
    \ For example, `main()`. You can use the library functions by directly invoking\
    \ them in order to execute an instruction.\n\nExample:\n\n![00218.jpeg](images/00218.jpeg)\n\
    \n```cpp\n// output\nEnter a number to get the square root: 60\nSquare root of\
    \ 60 = 7.74597\n```\n\nThe `sqrt()` is a library function used to calculate the\
    \ square root of a number. While `#include <cmath>` is the header file.\n\nEvery\
    \ C++ program has the `main()` function. For any program to begin its execution,\
    \ it has to make a system call to the `main()`. That is, the execution starts\
    \ from the `main()` function.\n\n#### User-defined functions\n\nC++ program allow\
    \ users to define their own functions. A user can specify a function and write\
    \ a block of statements to be executed once the function is called.\n\n##### Function\
    \ definition and passing arguments\n\nFunction declaration is very important when\
    \ defining functions. It tells the compiler about the function name and how to\
    \ call the function.\n\n**Syntax**\n\n```\nType function_name (arguments)\n{\n\
    \    Function body/statements;\n}\n```\n\nWhere,\n\n`Type` is the data type returned\
    \ by the function. If the function executes without any value to be returned after\
    \ an execution, use `void` as the return type for the function.\n\n`function_name`\
    \ is the actual name of the function executed.\n\n`Arguments` or `parameter` is\
    \ the value passed to the function. The parameters are optional since a function\
    \ can have a list of parameters passed to it or not.\n\n`Statements` or `body`\
    \ of the function is a block of statements that explain what the function does.\n\
    \n**Example:**\n\n```cpp\n// function call\nfloat sum (float a, float b)\n{\n\
    \    float sum;\n    sum = a + b;\n    return sum;\n}\n```\n\nIn the above example,\
    \ two parameters (`float a`, and `float b`) are passed to function when calling\
    \ it.\n\n##### Calling function\n\nWhen declaring a function, you have to state\
    \ what the function will do on the block of statements. To use the declared function,\
    \ you have to make a call to the function. When the program makes a call to the\
    \ function, the full control of the program is transferred to that function. As\
    \ a result, the function executes the defined task under its body until the end\
    \ of the function returns control back to the program. When calling the function,\
    \ you can pass the parameters needed by the function to execute.\n\nExample:\n\
    \n![00219.jpeg](images/00219.jpeg)\n\n```cpp\n// output\nEnter two numbers: 10\
    \ 6\nSum = 16\n```\n\nFunction prototype\n\nIf you want to define your own function\
    \ (user-defined function), you have to do this outside the `main()` otherwise\
    \ the compiler will generate an error. The compiler doesn’t recognize user-defined\
    \ functions and their arguments passed through the main function. To solve this,\
    \ you can declare a function prototype outside the `main()`. Prototype is declared\
    \ without the function body to enable the compiler to know about the user-defined\
    \ function. In the above example, prototype is declared as:\n\n```cpp\nfloat add\
    \ (float, float);\n```\nTherefore it is important to define a function prototype\
    \ if user-defined functions exist in the program and they should be defined before\
    \ the `main()` function.\n\n##### Call by value and call by reference\n\nYou can\
    \ pass data to function using either a call by value or a call by reference. In\
    \ a call by value, the original value of the function argument is not modified\
    \ while in call by reference, its original value is modified.\n\n**Call by value**\n\
    \nIn call by value, the passed value is locally stored in the stack memory. If\
    \ you change the parameters, the changes only apply to the current function. The\
    \ value of the variable inside the `main()` function will not change when you\
    \ call the function. Call by value is the most used method of calling functions,\
    \ and any changes made to the function parameters will not have any effect on\
    \ the call to that function. In call by value, only a copy of the value is passed\
    \ to the function.\n\n**Call by reference**\n\nWhen you pass parameters by reference,\
    \ the original value of the variable changes. Passing arguments by references\
    \ modifies the original address of the variable. The original address of the variable\
    \ is modified with the new variables passed to the function. When you change the\
    \ value of arguments in a function, it changes the value of the variable both\
    \ inside and outside the `main()` function.\n\n##### Inline functions\n\nWhen\
    \ you make a call to a function, the function takes some time to execute a block\
    \ of statements and store the function return values in the predefined memory\
    \ allocation before transferring the control back to the program. The program\
    \ control is switched between the function call and function execution.\n\nSo\
    \ sometimes a function call can take more time than the time it takes to execute\
    \ a task. The switching time between the function call and the function execution\
    \ time can create an overhead. To solve this problem, C++ programming implements\
    \ the use of inline function to reduce the overhead time. Inline functions reduce\
    \ calling time for small functions. Whenever a call is made to the function, the\
    \ compiler expands the function and replaces the function with a corresponding\
    \ code that reduces overhead time on the function call.\n\n**Syntax**\n\n```\n\
    inline return-type function-name (parameters)\n{\n    Function body\n}\n```\n\n\
    When you insert an `inline` keyword before the function, it sends a request to\
    \ the compiler and it's not a command. The compiler can decide to decline the\
    \ request based on the following conditions:\n\n- the function has static variables.\n\
    - you’re using recursive function.\n- the function uses loop control structures\
