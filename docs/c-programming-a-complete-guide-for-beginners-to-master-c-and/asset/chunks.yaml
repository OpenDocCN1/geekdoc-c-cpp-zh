  trans: "\n\n要打开任何文件，你必须先创建一个文件流，然后将其链接到文件名。文件流使用 `ifstream`、`fstream` 和 `ofstream`\
    \ 类来声明，这些类包含在 `fstream` 头文件中。\n\n创建的文件类取决于创建的目的。也就是说，是向文件中读取数据还是向文件中写入数据。\n\n\
    创建文件后，你可以通过以下方式打开它：\n\n1. 类中的构造函数。\n2. 类中的成员函数 `open()`。\n\n使用构造函数打开文件仅适用于流中只使用一个文件的情况，而\
    \ `open()` 方法则用于使用单个流打开多个文件的情况。\n\n### 使用构造函数打开文件\n\n如果使用构造函数打开文件，文件名将初始化文件流对象。这可以通过以下方式实现：\n\
    \n1. 创建文件流对象以使用适当的类管理流。在这种情况下，你可以使用 `fstream` 类创建输出流，而使用 `ifstream` 类创建输入流。\n\
    2. 使用所需的文件名来初始化文件对象。例如，以下代码被用于打开一个名为 `performance` 的文件作为输出：\n\n```cpp\nofstream\
    \ outfile(\"performance\"); // 用于输出。\n```\n\n`outfile` 被创建为一个 `fstream` 对象，其主要目的是管理输出流。\n\
    \n你也可以创建一个作为 `ifstream` 对象的 `infile`，并与文件数据关联以读取文件输入。\n\n```cpp\nifstream infile(\"\
    data\"); // 一个输入文件\n```\n\n你可以使用相同的文件向文件读取或写入数据。\n\n当对象终止时，它会自动关闭与该文件的连接。在上述 `performance`\
    \ 文件的示例中，当程序终止时，`performance` 文件将与 `outfile` 流断开连接。这也会发生在 `infile` 流上。\n\n文件名由一组字符组成，使其成为一个有效的文件名。文件名分为两个部分：主名和扩展名。例如，`file.doc`、`test.txt`\
    \ 和 `input.cpp` 等扩展名。\n\n### 示例：一个从文件中写入和读取数据的程序\n\n```cpp\n#include <iostream.h>\n\
    #include <fstream.h>\n\nint main()\n{\n    char prodname[20];\n    float price;\n\
    \n    ofstream outfile(\"product\");\n    cout << \"enter product's name:\";\n\
    \    cin >> prodname; outfile << prodname << \"\\n\";\n    cout << \"enter the\
    \ product's price:\";\n    cin >> price; outfile << price << \"\\n\";\n    outfile.close();\n\
    \n    ifstream infile(\"product\");\n    infile >> prodname;\n    infile >> price;\n\
    \    cout << \"\\n\";\n    cout << \"product name is : \" << prodname << \"\\\
    n\";\n    cout << \"product price: \" << price << \"\\n\";\n    infile.close();\n\
    \n    return 0;\n}\n```\n\n// 输出\nProduct name is: mango,\nProduct price: 25\n\
    \n此程序通过输入设备（如关键字）获取数据并将其写入文件。写入过程完成后，文件被关闭。然后打开文件以读取已经写入文件的信息，稍后显示在屏幕上供用户查看。\n\
    \n### 示例 2：写入文件。\n\n```cpp\n#include <iostream>\n#include <fstream>\nusing namespace\
    \ std;\n\nint main () {\n    ofstream samplefile;\n    samplefile.open (\"sample.doc\"\
    );\n    samplefile << \"writing data to the sample.doc.\\n\";\n    samplefile.close();\n\
    \    return 0;\n}\n```\n\n### 使用 open() 函数打开文件\n\n`open()` 函数打开使用相同对象的多个文件。如果需要处理一组文件，则会创建一个单一对象流以启用打开每个文件。\n\
    \n#### 语法\n```cpp\nvoid open (const char* filename, ios mode);\nor open (filename,\
    \ mode);\n```\n第一个参数表示文件名连同地址，而参数的第二个部分表示文件的访问模式。打开文件有不同的访问模式，包括：\n\n- `ios::in`：它是\
    \ `ifstream` 文件的默认模式，用于打开文件以读取。\n- `ios::out`：该模式负责向文件写入数据。它是 `fstream` 的默认模式。\n\
    - `ios::binary`：用于以二进制形式打开文件。\n- `ios::app`：`app` 模式适用于打开文件并在末尾追加输出。\n- `ios::ate`：该模式负责打开文件并将控制转移到文件末尾。\n\
    - `ios::trunc`：用于删除现有文件中的数据。\n- `ios::no_replace`：它测试文件是否存在，如果存在则打开它。如果文件不存在，`no_replace`\
    \ 将打开一个新文件。\n\n#### 示例\n要访问 `fstream` 类的成员函数，你必须创建该类。`example_file` 是 `fstream`\
    \ 类型的对象。调用 `open()` 函数允许你打开文件并向其中写入数据。文件的默认打开模式为：\n\n- `ifstream::in`\n- `ofstream::out`\n\
    - `fstream::in | ios::out`\n\n符号 `|` 用于组合不同的模式。例如：\n```cpp\nexample_file.open(\"\
    example.txt\", ios::out | ios::ate);\n```\n输入模式和控制模式组合，以确保文件是为了写入而打开，并将控制转移到文件末尾。\n\
    \n当程序终止时，分配的内存被释放，所有打开的文件都被关闭。使用 `close()` 函数确保在执行完成后关闭文件。通过流插入运算符 `<<`，你可以向文件中写入信息并使用流提取运算符\
    \ `>>` 从文件中读取信息。\n\n#### 示例：使用 open 打开文件并写入文件\n\n```cpp\n#include<iostream>\n\
    #include <fstream>\nusing namespace std;\n\nint main()\n{\n    fstream example_file;\n\
    \    example_file.open(\"example.doc\", ios::out);\n    if(!example_file)\n  \
    \  {\n        cout<<\" file creation has failed\";\n    }\n    else\n    {\n \
    \       cout<<\"the new file was successfully created\";\n        example_file<<\
    \ \"this is a new file created\"; // 写入文件\n        example_file.close(); // 关闭文件释放内存\n\
    \    }\n    return 0;\n}\n```\n\n// 输出\nC:\\users\\faith\\documents>notepad++\
    \ example.cpp –o, example.exe\nC:\\users\\faith\\documents\\example.doc\n新文件创建成功\n\
    \n在上述程序中，我们创建了一个用于 `fstream` 类的对象 `example_file`。然后我们使用 `open()` 函数打开对象并创建一个名为\
    \ `example` 的新文件写入数据。文件被分配给 `ios::out` 模式，允许写入文件。`if` 语句测试文件是否存在，如果文件不可用则显示“文件创建失败”语句，否则屏幕上将显示“新文件创建成功”的消息。\n\
    \n### 示例 2：从文件中读取信息\n\n```cpp\n#include<iostream>\n#include <fstream>\nusing namespace\
    \ std;\n\nint main()\n{\n    fstream example_file;\n    example_file.open(\"example.doc\"\
    , ios::in);\n    if(!example_file)\n    {\n        cout<<\" the file doesn’t exist\"\
    ;\n    }\n    else\n    {\n        char ch;\n        while (!example_file.eof())\n\
    \        {\n            example_file>>ch;\n            cout<<ch;\n        }\n\
    \    }\n}\n```\n\n"
- fmt: "\n```cpp\nExample_file.close(); // close, the file to, free memory,\n\n}\n\
    \nReturn 0;\n\n}\n```\n\nThe above program reads the `example.doc` file we had\
    \ already created in the previous example. to read a file, the ‘in’ mode is used\
    \ (`ios::in`). the extraction operator `>>` is used to print the file content\
    \ of the file.\n\n### Finding end of file\n\nWhen reading a file, it’s important\
    \ to determine the end of file, otherwise the program will be in an infinite loop\
    \ if it doesn’t detect the end of file. the programmer should provide appropriate\
    \ instructions to the program so as to be able to detect the end of file.\n\n\
    When the end of file is determined, the reading data process can easily be terminated\
    \ after all the data has been read. if the end-of-file is determined, the `fin\
    \ ifstream` object will return a zero value if an error occurs in the file operation.\n\
    \nWhen the `fin` returns 0 after reaching the end-of-the-file, the `while` loop\
    \ will terminate. you can also detect the end of file using the `eof()` function.\n\
    \n```cpp\nif(example.eof()!=0)\n{\n    exit file\n}\n```\n\nIf the end-of-file\
    \ is detected, a non-zero value is returned, otherwise if the end-of-file is not\
    \ detected, a 0 value is returned. the program will automatically terminate after\
    \ reaching the end-of-file.\n\n### File pointers and manipululators\n\nEach c++\
    \ file has two, pointers: input pointer and output pointer. the input pointer\
    \ reads the content of a particular file location while the output pointer writes\
    \ data to a given file location. whenever an input or output file operation takes\
    \ place, an appropriate pointer is updated automatically.\n\n#### Default file\
    \ actions\n\nWhen you `open` a file in a read-only mode, the input pointer is\
    \ set at the start of the file so as to enable reading from the start of that\
    \ file. if the file is opened in a write-only mode, all the file content is deleted\
    \ and the output pointer is placed at the start of the file. this ensures that\
    \ you write the file from the beginning point.\n\nTo add more data to an existing\
    \ file, the file should be opened in an ‘append’ mode. this automatically moves\
    \ the pointer to the end of the file.\n\n#### Functions and manipulations of file\
    \ pointer\n\nAll the actions and file operations using pointers take place by\
    \ default. in order to control file pointer movement operations, there are various\
    \ file stream classes you can use. some of these file stream class member functions\
    \ include:\n\n- `seekg()`: this function moves the (input) get pointer to a specific\
    \ location.\n- `seekp()`: the function moves the (output) put pointer to a specific\
    \ location.\n- `tellg()`: this function indicates the get pointer current position.\n\
    - `tellp()`: it indicates the put pointer current position.\n\n**Example:**\n\n\
    ```cpp\ninfile.seekg(5);\n```\n\nThis function will move the pointer to a number\
    \ byte labelled 5 since the file bytes are numbered from 0. the pointer then points\
    \ to the 6^{th} byte which is the current location of the file.\n\n**Example 2:**\n\
    \n```cpp\nfstream myfile;\n\nmyfile.open(\"welcome\", ios::app);\nint ppt=myfile.tellp();\n\
    ```\n\nWhen the above statements are executed, the output pointer moves up to\
    \ the end of file “welcome” and the `ppt` value indicates the number of bytes\
    \ in the file.\n\n### Specifying offset functions\n\nThe seek functions (`seekg()`\
    \ and `seekp()`) take two arguments:\n\n- `seekg (offset, refposition)`\n- `seekp\
    \ (offset, refposition)`\n\nThe `offset` argument indicates the number of bytes\
    \ to move the file pointer from the specified location by the `refposition` argument.\n\
    \nThe `refposition` takes the form of:\n\n- `ios::beg`: this indicates the start\
    \ of file.\n- `ios::cur`: indicates the current position of the pointer.\n- `ios::end`:\
    \ this indicates the end of a file.\n\nThe `seekg()` function moves all associated\
    \ files with the get pointer. the `seekp()` moves the file and its associated\
    \ files using the put pointer.\n\n### Sequential input and output operations\n\
    \nThere are a number of member functions for performing input and output operations\
    \ supported by file stream. the member functions `put()` and `get()` handle single\
    \ character operations at a time. the `write()` and `read()` functions write into,\
    \ and read a block of binary data.\n\n#### Put and get() functions\n\nYou can\
    \ write a single character into an associated stream using the `put()` function.\
    \ the `get()` function reads a single character from associated stream. let’s\
    \ write a program to illustrate how the functions works on a program.\n\nThe above\
    \ program requests for a string and once it receives the string, it writes on\
    \ the file character by character using the `put()` function for loop. when the\
    \ string length ends, the loop is terminated. After the execution, the program\
    \ is displayed on the screen using `get()`. the `get()` function fetches character\
    \ by character data from the file until it reaches the end of file condition.\
    \ the data read from the file is displayed on the screen for users to view using\
    \ `<<`.\n\n#### Write() and read() functions\n\nThe `write()` and `read()` function\
    \ can handle binary forms of data. the data values are stored in the disk file\
    \ the the format used when they’re being stored in an internal memory. for example,\
    \ `char` can store 2 bytes of its data into a binary form regardless of its size,\
    \ while a 4 digit integer value can store 4 bytes in character.\n\nBinary input\
    \ and output takes the form of:\n\nThe function receives two arguments: the address\
    \ of the variable `var`, and the length of the variable in the form of bytes.\
    \ the address of the variable is represented with `char*` (a pointer to a character\
    \ data type).\n\n**Example:**\n\n### Error handling during file operation\n\n\
    When carrying out various file operations, there are various errors encountered.\
    \ some of these problems encountered include:\n\n- non-existence of the file you\
    \ are trying to access.\n- the file name used to create a new file already exists.\n\
    - attempting an invalid file operation like trying to read data past the end of\
    \ file condition.\n- not enough memory in the disk drive to store more data.\n\
    - dealing with an invalid file name.\n\nThese are some of the common file operation\
    \ problems you may face when handling and manipulating files. file operation stream\
    \ in c++ language inherits the ‘stream-state’ member from the `ios` class. the\
    \ stream-state member keeps information on the status of the current opened file.\
    \ the `ios` class support a number of member functions for reading the file status\
    \ recorded on the stream.\n\n#### Error handling functions\n\n| Function | Meaning\
    \ and its return value |\n| :--- | :--- |\n| `eof()` | `eof()` returns a true\
    \ value or a non-zero value if the end of file is successfully detected while\
    \ reading the file, otherwise, it will return a zero value. |\n| `Fail()` | This\
    \ functions returns true after the failure of both input and output operations.\
    \ |\n| `Bad()` | If an attempt of an invalid operation is encountered or unrecoverable\
    \ error, it returns true. if the error can be recovered and file operation continues,\
    \ then it returns false value |\n| `Go,od()` | If no, error has been encountered,\
    \ it will return true. if the `file.good()` function returns true, then you can\
    \ continue with other i/o, operations. If it returns false, there are no, further\
    \ operations are carried out. |\n"
