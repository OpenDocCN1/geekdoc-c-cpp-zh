    To, use dynamic message passing o,n o,bjects, yo,u sho,uld:


    *   Declare a glo,bal functio,n that will act as a signature to, the message being
    passed between o,bjects.


    *   Inherit o,bject pro,perties fro,m dmp::o,bject.


    *   Create a class co,nstructo,r and add a single message o,r mo,re to, the o,bject
    by using add_message metho,d.


    *   Use invo,ke(signature, …parameters) to, send a message to, an o,bject.


    Ho,w message passing wo,rks


    Each c++ o,bject has a shared_ptr to, a particular map. that is the map’s key
    act as a po,inter to, the message signature. its value po,ints to, an internal
