    \ to create a memory allocation to hold 5 elements. If you don’t specify the array\
    \ size, a huge chunk of memory is created to hold the initialized variables.\n\
    \nArrays use index to represent variables with 0 index representing the first\
    \ element. You can represent the above array as follows:\n\n| Index | 0 | 1 |\
    \ 2 | 3 | 4 |\n| --- | --- | --- | --- | --- | --- |\n| Num | 5 | 10 | 25 | 20\
    \ | 35 |\n\n### Accessing arrays\nYou can access array element by indexing the\
    \ array name. This can be done by placing the index number of the element you\
    \ want to access within the square brackets after the array name.\n\nExample:\n\
    \n```cpp\nInt num[5] = {5, 10, 25, 20, 35};\ncout<< num[1]; // output 10\n```\n\
    \n### Using loops in arrays\nYou can use a for loop to execute array elements.\n\
    \nExample:\n\n```cpp\n#include <iostream>\n#include <string>\n\nUsing namespace\
    \ std;\n\nInt main()\n{\n    string cars[3] = {\"bmw\", \"rav4\", \"volvo\"};\n\
    \    for(int a = 0; a < 4; a++)\n    {\n        cout << cars[a] << \"\\n\";\n\
    \    }\n    return 0;\n}\n// output\n// Bmw\n// Rav4\n// Volvo,\n```\n\n## Multi-dimensional\
    \ arrays\n\nMultidimensional is an array of arrays which stores data in the form\
    \ of tables with both rows and columns (rows*columns), also known as the matrix.\
    \ It can be either a two-dimensional or three-dimensional array.\n\n### Syntax\n\
    `Type arrayname [size1] [size2] … [sizen]`\n\nExample:\n\n```cpp\nInt m [5] [12];\n\
    Int n [2] [2] [3];\n```\n\nTo get the number of elements stored in a multidimensional\
    \ array, multiply the size of all array dimension. In the array of `int m [5]\
    \ [12]`, you can store `(5*12) = 60` elements.\n\n### Two-dimensional array\n\
    A two-dimensional array is the simplest array format. This array format uses ‘r’\
    \ number of rows and ‘s’ number of columns to form an array.\n\n`Type arrayname\
    \ [r][s]`\n\nWhere `r` is the number of rows and `s` is the number of columns.\n\
    \n(Note: The input text contained repetitive blocks in the two-dimensional array\
    \ section which have been consolidated for professional documentation standards.)\n"
