    \ the original content provided in the initial prompt.\n\n[content]\nInheritance\
    \ is an object-oriented programming feature that allows a class to borrow the\
    \ members of other classes without repetition of its members. it allows one class\
    \ (derived class or subclass) to acquire the properties and methods of another\
    \ class (base class or superclass). a class whose properties are inherited is\
    \ called the base, parent or superclass while the class that inherits these properties\
    \ is called a derived, subclass or child class.\n\nWhen a class inherits properties\
    \ of another class, the variables and functions of the base class are available\
    \ to the new class, hence promoting code reusability. the derived class inherits\
    \ all members except the private members.\n\n### Importance of inheritance:\n\
    1. Supports code reusability\n2. Support overriding method\n3. Uses `virtual`\
    \ keyword\n\n### Base class and derived class\nWhen inhering members of another\
    \ class, the public members of the superclass will remain public while the protected\
    \ members will remain protected. in a private inheritance, both public and protected\
    \ members of a superclass will remain private in a subclass.\n\n#### Syntax\n\
    ```cpp\nClass subclass: access_mode superclass\n```\nThe superclass should be\
    \ declared first, that is, before you define the subclass. the access mode (`private`,\
    \ `public` or `protected`) specifies what superclass properties are to be inherited\
    \ by subclass.\n\nFor example, assume you have a class `employee` and class `manager`,\
    \ where the manager is also an `employee` who has additional responsibilities.\
    \ you can apply inheritance concept to avoid repeating data members and member\
    \ functions in `employee` class to the `manager` class.\n\nThe manager class can\
    \ be declared as shown below.\n\n```cpp\nClass manager: public employee\n{\nPublic:\n\
    // additional manager member components\n…\n};\n```\nInheritance helps you declare\
    \ manager class without repeating those member components inside the `employee`\
    \ class. `employee` is the base class while `manager` is the derived class.\n\n\
    ```cpp\nClass student\n{\n    char* studname, course;\n    int age;\n    char*\
    \ department;\n    protected:\n    student(char* studname);\n    void display();\n\
    };\n\nclass hod : protected student\n{\n    studentlist students;\n    protected:\n\
    \    hod(char* studname, student* people);\n    void display();\n};\n```\n\n---\n\
    \n### Types of inheritance\n\n#### Single inheritance\nSingle inheritance is one\
    \ of the simplest types of inheritance where a class is derived from a single\
    \ class. the derived class will inherit member components from only a single class.\
    \ for example, class `b` inherits properties and behaviors of class `a`. class\
    \ `b` inherits both the public and protected members of class `a`.\n\n![00223.jpeg](images/00223.jpeg)\n\
    \n#### Syntax\n```cpp\nClass b: public a {/*…*/};\n```\nor\n```cpp\nClass b: protected\
    \ a {/*…*/};\n```\n\n#### Multiple inheritance\nIn multiple inheritance, a class\
    \ can inherit members from two, or more direct base classes. for example, you\
    \ can create derived class `c` from class `a` & `b` base classes.\n\n![00224.jpeg](images/00224.jpeg)\n\
