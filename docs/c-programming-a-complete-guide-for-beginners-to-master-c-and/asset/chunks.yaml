    \    cout<< \"area of rectangle is:\"<<rect.output(rect.area);\n    cout<< \"\
    area of triangle is:\"<<tri.output (tri.area);\n    Return 0;\n}\n```\n\n####\
    \ Multi-level inheritance\nThis is where a derived class inherits from a class\
    \ which also inherited properties of another base class. for example, if `a` is\
    \ the base class of `b` while class `b` is the base class of `c`, then `c` will\
    \ be the derived class of `b` and `b` will be a derived class of `a`.\n\n![00225.jpeg](images/00225.jpeg)\n\
    \n#### Hybrid inheritance/virtual inheritance\nHybrid is a combination of several\
    \ inheritance types. for example, class `b` and `c` are the derived classes of\
    \ base class `a`. from the derived class `b` and `c`, you can create a new derived\
