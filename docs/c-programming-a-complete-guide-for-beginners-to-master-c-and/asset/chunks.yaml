  trans: "\n\n在受保护的数据成员函数中，数据成员和成员函数由其声明的当前类或派生类使用。\n\n你可以在当前类的子类中使用点运算符（`.`）来访问受保护的数据成员。就像公共（public）类一样，你可以从类、友元函数或派生类访问受保护成员。\n\
    \n如果类成员被声明为受保护（protected），那么：\n\n* 只有声明该成员的原始类的成员函数可以访问这些变量。\n* 只有原始声明这些成员为受保护的类的友元可以访问这些类成员。\n\
    * 对受保护成员具有私有访问权限的私有派生类可以直接访问它们。\n* 只有从原始声明数据成员的类以公共（public）或受保护（protected）权限派生的类才能使用它们。\n\
    \n在使用基类时，`protected` 关键字表示基类的公共和受保护成员都是派生类的受保护数据成员。\n\n受保护的数据成员没有私有（private）数据成员那么私有，但比从任何函数都可以访问的公共数据成员更公开。\n\
    \n你可以将受保护的数据成员声明为静态（static），这意味着它们可以被派生类的友元函数或成员函数访问。如果成员不是静态的，则可以通过指针或引用在友元函数和派生成员函数中访问。\n\
    \n### 类成员函数的类型\n\n在 C++ 中，有几种成员函数可以用于操作数据成员和函数。这些特殊的成员函数包括：\n\n1. 简单函数。\n2. 静态函数。\n\
    3. 常量函数（Const functions）。\n4. 内联函数（Inline functions）。\n5. 友元函数。\n\n### 简单成员函数\n\
    \n这些是 C++ 中定义的成员函数。它们没有使用像 `static` 这样的特殊前缀。基本或简单成员函数的通用格式如下。\n\n#### 语法\n\n```\n\
    Type function_name (arguments)\n{\n    function body;\n}\n```\n\n### 静态成员函数\n\n\
    这些成员函数使用 `static` 关键字，它与数据成员和成员函数相关。`static` 意味着保持相同的位置。\n\n要使函数成为静态的，请使用 `static`\
    \ 关键字后跟函数名。静态函数适用于整个类，而不是类的某个特定对象。\n\n使用对象和直接成员访问运算符（`.`）调用静态函数。你也可以使用类名、作用域解析运算符或直接本身调用静态成员函数。\n\
    \n#### 语法：\n\n```cpp\nClass s\n{\npublic:\n    static void fxn ()\n    {\n   \
    \     …\n    }\n};\n\nint main() {\n    // 使用类名直接调用成员函数。\n    s::fxn ()\n}\n```\n\
    \n上述函数只能访问静态数据成员和静态成员函数。普通数据成员或函数无法被访问。\n\n### 常量成员函数\n\n`const` 关键字用于声明常量变量。一旦变量定义为常量，其值就无法更改。当\
    \ `const` 与成员函数一起使用时，这些函数不能修改数据对象或数据成员。\n\n#### 语法\n\n```\nVoid x () const\n{\n\
    \    // function body\n}\n```\n\n#### 1. 内联函数\n\n当你在特定类内部定义成员函数时，该函数会自动成为内联函数。\n\
    \n#### 2. 友元函数\n\n友元函数为非类函数提供了私有访问。这些函数不是类的成员函数。`friend` 函数允许你将全局函数声明为友元，或将另一个类的成员函数声明为友元。\n\
    \n#### 语法：\n\n```cpp\nClass friendclass\n{\n    int x;\npublic:\n    friend void\
    \ fn() //设置全局函数为友元\n    \n    void fn()\n    {\n        friendclass fc;\n    \
    \    // 访问私有数据成员\n        fc.x=10;\n        cout<<fc.x;\n    }\n};\n\nint main()\
    \ {\n    fn ()\n}\n```\n\n友元函数能够访问私有数据成员。\n\n示例：\n\n```cpp\nClass anotherclass\n\
    {\n    void fn();\n};\n\nClass friendclass\n{\n    int x;\npublic:\n    friend\
    \ void anotherclass::fn();\n};\n\nvoid anotherclass::fn()\n{\n    friendclass\
    \ fc;\n    fc.x=10;\n    cout<<fc.x;\n}\n```\n\n### 构建类\n\n当你在特定类内部定义成员函数时，该函数会自动成为内联函数。\n\
    \n### 基类与派生\n\n在使用基类时，`protected` 关键字表示基类的公共和受保护成员都是派生类的受保护数据成员。\n\n受保护的数据成员没有私有数据成员那么私有，但比从任何函数都可以访问的公共数据成员更公开。\n\
    \n你可以将受保护的数据成员声明为静态，这意味着它们可以被派生类的友元函数或成员函数访问。如果成员不是静态的，则可以通过指针或引用在友元函数和派生成员函数中访问。\n\
    \n### 重写方法\n\n在受保护的数据成员函数中，数据成员和成员函数由其声明的当前类或派生类使用。\n\n你可以在当前类的子类中使用点运算符（`.`）来访问受保护的数据成员。就像公共（public）类一样，你可以从类、友元函数或派生类访问受保护成员。\n\
    \n### 访问修饰符\n\n如果类成员被声明为受保护（protected），那么：\n\n* 只有声明该成员的原始类的成员函数可以访问这些变量。\n* 只有原始声明这些成员为受保护的类的友元可以访问这些类成员。\n\
    * 对受保护成员具有私有访问权限的私有派生类可以直接访问它们。\n* 只有从原始声明数据成员的类以公共（public）或受保护（protected）权限派生的类才能使用它们。\n\
    \n### 章节总结\n\n在本章中，你学习了如何使用类来解决各种问题，包括：\n\n* 在定义对象时使用类头和类体，以及定义和声明类。\n* 如何区分数据成员和成员函数。\n\
    * 如何声明数据成员和成员函数，并确定它们应该被声明为私有、公共还是受保护成员。\n* 如何访问类的私有、公共和受保护成员，以及如何调用成员函数。\n* 在调用特定函数时处理不同的类成员函数。\n\
    * 如何使用基类和派生类构建类。从基类或父类，可以派生出一个继承基类行为和属性的类。\n\n在下一章中，你将学习类继承，包括派生类如何继承属性。\n\n"
- fmt: "\nInheritance is an object-oriented programming feature that allows a class\
    \ to borrow the members of other classes without repetition of its members. it\
    \ allows one class (derived class or subclass) to acquire the properties and methods\
    \ of another class (base class or superclass). a class whose properties are inherited\
    \ is called the base, parent or superclass while the class that inherits these\
    \ properties is called a derived, subclass or child class.\n\nWhen a class inherits\
    \ properties of another class, the variables and functions of the base class are\
    \ available to the new class, hence promoting code reusability. the derived class\
    \ inherits all members except the private members.\n\n### Importance of inheritance:\n\
    1. Supports code reusability\n2. Support overriding method\n3. Uses `virtual`\
    \ keyword\n\n### Base class and derived class\nWhen inhering members of another\
    \ class, the public members of the superclass will remain public while the protected\
    \ members will remain protected. in a private inheritance, both public and protected\
    \ members of a superclass will remain private in a subclass.\n\n#### Syntax\n\
    ```cpp\nClass subclass: access_mode superclass\n```\nThe superclass should be\
    \ declared first, that is, before you define the subclass. the access mode (`private`,\
    \ `public` or `protected`) specifies what superclass properties are to be inherited\
    \ by subclass.\n\nFor example, assume you have a class `employee` and class `manager`,\
    \ where the manager is also an `employee` who has additional responsibilities.\
    \ you can apply inheritance concept to avoid repeating data members and member\
    \ functions in `employee` class to the `manager` class.\n\nThe manager class can\
    \ be declared as shown below.\n\n```cpp\nClass manager: public employee\n{\nPublic:\n\
    // additional manager member components\n…\n};\n```\nInheritance helps you declare\
    \ manager class without repeating those member components inside the `employee`\
    \ class. `employee` is the base class while `manager` is the derived class.\n\n\
    ```cpp\nClass student\n{\n    …\n};\n\nclass hod : protected student\n{\n    …\n\
    };\n```\n\n---\n\n### Types of inheritance\n\n#### Single inheritance\nSingle\
    \ inheritance is one of the simplest types of inheritance where a class is derived\
    \ from a single class. the derived class will inherit member components from only\
    \ a single class. for example, class `b` inherits properties and behaviors of\
    \ class `a`. class `b` inherits both the public and protected members of class\
    \ `a`.\n\n![00223.jpeg](images/00223.jpeg)\n\n#### Syntax\n```cpp\nClass b: public\
    \ a {/*…*/};\n```\nor\n```cpp\nClass b: protected a {/*…*/};\n```\n\n#### Multiple\
    \ inheritance\nIn multiple inheritance, a class can inherit members from two,\
    \ or more direct base classes. for example, you can create derived class `c` from\
    \ class `a` & `b` base classes.\n\n![00224.jpeg](images/00224.jpeg)\n\n#### Syntax\n\
    ```cpp\nClass c: public a, public b {/*…*/};\n```\n\n#### Example:\n```cpp\n#include<iostream.h>\n\
    \nClass polygon\n{\nProtected:\n    Int width, height;\nPublic:\n    void setvalues\
    \ (int w, int h)\n    {\n        width=w, height=h;\n    }\n};\n\nClass output\n\
    {\nPublic:\n    void output (int);\n};\n\nvoid output::output (int i)\n{\n   \
    \ cout<<i<<endl;\n}\n\nClass rectangle:public polygon, public output\n{\nPublic:\n\
    \    Int area()\n    {\n        return width*height;\n    }\n};\n\nClass triangle:\
    \ public polygon, public output\n{\n    Int area()\n    {\n        return (width*height/2);\n\
    \    }\n};\n\nInt main()\n{\n    Rectangle rect;\n    Triangle tri;\n    Rect.setvalues\
    \ (6,4);\n    Tri.setvalues (6,4);\n    cout<< \"area of rectangle is:\"<<rect.output(rect.area);\n\
    \    cout<< \"area of triangle is:\"<<tri.output (tri.area);\n    Return 0;\n\
    }\n```\n\n#### Multi-level inheritance\nThis is where a derived class inherits\
    \ from a class which also inherited properties of another base class. for example,\
    \ if `a` is the base class of `b` while class `b` is the base class of `c`, then\
    \ `c` will be the derived class of `b` and `b` will be a derived class of `a`.\n\
    \n![00225.jpeg](images/00225.jpeg)\n\n#### Hybrid inheritance/virtual inheritance\n\
    Hybrid is a combination of several inheritance types. for example, class `b` and\
    \ `c` are the derived classes of base class `a`. from the derived class `b` and\
    \ `c`, you can create a new derived class `d`. this forms a hybrid inheritance\
    \ since it combines multiple inheritance types to form a new class.\n\n![00226.jpeg](images/00226.jpeg)\n\
    \n#### Hierarchical inheritance\nHierarchical inheritance has multiple subclasses\
    \ which inherit properties of a single base class. class `b`, `c`, and `d` inherit\
    \ the properties of single class `a`.\n\n![00227.jpeg](images/00227.jpeg)\n\n\
