  \nA: 你们在哪里工作？\n\nB: 我在西南航空工作。\n\nA: 噢。你的配偶也工作吗？\n\nB: 他/她在一家贸易公司工作。不过，因为我们的女儿还小，他/她只能做半天。\n\
  \nA: 这是我送给你女儿的小礼物。是糖果。没有孩子不喜欢吃糖果！\n\n## 3\nA: 请一下，请问你叫什么名字？你们在哪里工作？\n\nB: 我的名字是\
