  \ 单元第 4 部分），请参阅加分材料。\n\n## 4. 角色扮演练习\n\n### 第 1 单元，第一部分：角色扮演练习\n用中文练习这些角色扮演，提高你的口语流利度。\n\
  \n1. A: 你好吗？\n   B: 你好？\n   A: 你去哪里？\n   B: 我去食堂。你呢？\n   A: 我去图书馆。\n2. A: 你好！\n\
