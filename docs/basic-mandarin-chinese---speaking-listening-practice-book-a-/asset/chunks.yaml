    ## 3. Transformation and Response Drills


    ### Unit 1, Part 1: Transformation and Response Drills


    1.  **Add the final particle `a` to the following greetings and questions to make
    them softer and more colloquial.**


    | Nĭ hăo! | Nĭ hăo a`? |

    | :--- | :--- |

    | “How are you?” | “How are you?” |

    | Wāng Jīngshēng, nĭ hăo! | Wāng Jīngshēng, nĭ hăo a`! |

    | “Wang Jingsheng, how are you?” | “Wang Jingsheng, how are you?” |

    | Nĭ dào năr qù? | Nĭ dào năr qù a`? |

    | “Where are you going?” | “Where are you going?” |

    | Kē Léi’ēn dào năr qù bàn shì? | Kē Léi’ēn dào năr qù bàn shì a`? |

    | “Where is Ke Leien going to take care of things?” | “Where is Ke Leien going
    to take care of things?” |


    2.  **Use `ne` to abbreviate the question about the second person.**


    | Wŏ huí sùshè. Nĭ dào năr qù? | Wŏ huí sùshè. Nĭ ne`? |

    | :--- | :--- |

    | “I’m going back to the dormitory. Where are you going?” | “I’m going back to
    the dormitory. How about you?” |

    | Wŏ qù bàn yìdiănr shì. Nĭ dào năr qù? | Wŏ qù bàn yìdiănr shì. Nĭ ne`? |

    | “I’m going to go take care of some stuff. Where are you going?” | “I’m going
    to go take care of some stuff. And you?” |

    | Wŏ qù shítáng. Nĭ dào năr qù? | Wŏ qù shítáng. Nĭ ne`? |

    | “I’m going to the cafeteria. Where are you going?” | “I’m going to the cafeteria.
    And how about you?” |

    | Wŏ qù túshūguăn. Nĭ dào năr qù? | Wŏ qù túshūguăn. Nĭ ne`? |

    | “I’m going to the library. Where are you going?” | “I’m going to the library.
    And you?” |


    3.  **You will hear a statement about somebody who is going to do something. Repeat
    the statement and, using the adverb `yĕ` “also, too,” add a comment to the effect
    that you are going to do the same thing as the person being talked about.**


    | Kē Léi’ēn huí sùshè. | Kē Léi’ēn huí sùshè, wŏ yĕ huí sùshè. |

    | :--- | :--- |

    | “Ke Leien is returning to the dormitory.” | “Ke Leien is returning to the dormitory,
    and I’m returning to the dormitory, too.” |

    | Wāng Jīngshēng qù shítáng. | Wāng Jīngshēng qù shítáng, wŏ yĕ qù shítáng. |

    | “Wang Jingsheng is going to the cafeteria.” | “Wang Jingsheng is going to the
    cafeteria, and I’m going to the cafeteria, too.” |

    | Nĭ qù túshūguăn. | Nĭ qù túshūguăn, wŏ yĕ qù túshūguăn. |

    | “You’re going to the library.” | “You’re going to the library, and I’m going
    to the library, too.” |

    | Nĭ qù bàn yìdiănr shì. | Nĭ qù bàn yìdiănr shì, wŏ yĕ qù bàn yìdiănr shì. |

    | “You’re going to go take care of some things.” | “You’re going to go take care
    of some things, and I’m going to go take care of some things, too.” |


    ### Unit 1, Part 2: Transformation and Response Drills


    1.  **Add `dōu` to each sentence.**


    | Wŏ bàba, māma hĕn máng. | Wŏ bàba, māma dōu hĕn máng. |

    | :--- | :--- |

    | “My father and mother are busy.” | “My father and mother are both busy.” |

    | Wŏ àiren, háizi qù túshūguăn. | Wŏ àiren, háizi dōu qù túshūguăn. |

    | “My spouse and children go to the library.” | “My spouse and children all go
    to the library.” |

    | Tāmen xiān zŏule. | Tāmen dōu xiān zŏule. |

    | “They left early.” | “They all left early.” |

    | Nĭ bàba, māma hĕn lèi. | Nĭ bàba, māma dōu hĕn lèi. |

    | “Your father and mother are tired.” | “Your father and mother are both tired.”
    |


    2.  **Change the following statements into questions by adding `ma`.**


    | Tāmen hĕn máng. | Tāmen hĕn máng ma`? |

    | :--- | :--- |

    | “They are busy.” | “Are they busy?” |

    | Nĭ lèile. | Nĭ lèile ma`? |

    | “You’ve gotten tired.” | “Have you gotten tired?” |

    | Tāmen qù túshūǎn. | Tāmen qù túshūgu ma`? |

    | “They’re going to the library.” | “Are they going to the library?” |

    | Tā huí sùshè. | Tā huí sùshè ma`? |

    | “She’s going back to the dormitory.” | “Is she going back to the dormitory?”
    |

    | Wŏ àiren xiān zŏule. | Wŏ àiren xiān zŏule ma`? |

    | “My spouse left already.” | “Did my spouse leave?” |

    | Tā hái hăo. | Tā hái hăo ma`? |

    | “He’s O.K.” | “Is he O.K?” |


    3.  **Create stative verb sentences with `hĕn` using the subjects and stative
    verbs.**


    | Nĭmen, lèi. | Nĭmen hĕn lèi. |

    | :--- | :--- |

    | “You (plural), tired.” | “You are very tired.” |

    | Tā, máng. | Tā hĕn máng. |

    | “She, busy.” | “She is very busy.” |

    | Wŏ, hăo. | Wŏ hĕn hăo. |

    | “I, good.” | “I am doing well.” |

    | Nĭ, máng. | Nĭ hĕn máng. |

    | “You, busy.” | “You are very busy.” |

    | Tāmen, lèi. | Tāmen hĕn lèi. |

    | “They, tired.” | “They are very tired.” |


    4.  **Change the pronoun subject `tā` to plural by adding `-men`.**


