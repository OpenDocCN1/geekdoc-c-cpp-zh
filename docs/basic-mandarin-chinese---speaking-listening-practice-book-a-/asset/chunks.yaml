    Grammar


    Directional Verbs: jìnlái “come in,” jìnqu “go in,” chūlái “come out,” chūqu “go
    out,” piāojìnlái “float in,” kànbuchūlái “be unable to know something by looking”


    HĂOXIÀNG...-DE YÀNGZI “seem like...”: Hăoxiàng wù cóng shāchuāng piāojìnláide
    yàngzi. “It seems as though the fog is floating in through the window screen.”


    Noun suffix -FĂ “way of doing something”: bànfă “way of doing something,” kànfă
    “way of looking at things,” xiăngfă “way of thinking,” xiĕfă “way of writing,”
