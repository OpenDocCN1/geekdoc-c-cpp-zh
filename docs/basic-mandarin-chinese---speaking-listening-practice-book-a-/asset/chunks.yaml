    RÚGUŎ...JIÙ... “if...then...”: Rúguŏ xiàyŭde huà, wŏmen jiù bú qù. “If it should
    rain, we (then) won’t go.”


    YÒU...YÒU... “both...and...”: Nèige xuésheng yòu cōngming yòu yònggōng. “That
    student is both smart and diligent.”


