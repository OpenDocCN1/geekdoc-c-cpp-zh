    # A Note to the Learner

    When it comes to learning Chinese, practice is essential, of course. This workbook
    offers you many options for practicing and polishing your language skills, and
    was designed to be used in conjunction with the book `Basic Mandarin Chinese—Speaking
    & Listening`. However, it may be used to hone speaking skills no matter which
    book or course you’re using to learn Chinese.


    There are no Chinese characters to be found here because you don’t need characters
    to learn to speak Chinese. In fact, learning the characters for everything you
    learn to say is an inefficient way to learn Chinese, one that significantly slows
    down your progress.


    To help you learn to speak and understand Chinese as efficiently as possible,
    this workbook gives you the Chinese language portions not via characters, but
    instead through audio featuring native speakers (on the accompanying ![Image](Images/dlogo.jpg)).
    And in the pages of this book, the Chinese is represented in `Hanyu Pinyin`, the
    official Chinese romanization system.

