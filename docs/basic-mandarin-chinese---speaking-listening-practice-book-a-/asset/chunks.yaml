    ## Unit 3, Part 2: Role Play Exercises


    Practice these role plays in Chinese to improve your spoken fluency.


    1. A: Is this your mother? How old is she?

    B: Let me try to think. She’s forty-six this year—no, forty-seven.

    A: Oh. So I suppose this must be your father?

    B: Yes, he’s forty-five years old this year.


    2. A: This is your younger brother, right? He’s cute. How old is he this year?

    B: He’s five years old. Next month he’ll be six.

    A: And this is your younger sister, right? She’s cute too. How old is she?

    B: She’s three years old.


    3. A: Is this your older brother? How old is he?

    B: Let me try to think. He’s twenty-eight this year—no, twenty-nine.

    A: Oh. So I guess this must be your older sister?

    B: Yes, it’s my older sister. She’s twenty-seven years old this year.


    4. A: You’re cute! How old are you?

    B: You try to guess!

    A: Let me try to think… I think you’re seventeen!

    B: That’s not right. I’m thirty-two. Am I still cute?


    5. A: How old are you?

    B: I’ll be twenty-one next month. How old are you?

    A: You try to guess.

    B: Twenty years old?

    A: Not correct!

    B: Nineteen years old?

    A: Also not correct! I was twenty-one last month!


    6. A: I have neither an older brother nor an older sister.

    B: I have neither a younger brother nor a younger sister.

    A: But you have me, right? I’m also very cute, right?

    B: Right. I have you. You also have me. But you’re not cute!


