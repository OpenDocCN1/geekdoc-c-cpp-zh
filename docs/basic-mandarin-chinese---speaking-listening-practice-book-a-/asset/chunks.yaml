    B: Yes, I’m Chinese.


    A: What place in China?


    B: I was born in Tianjin, and then I grew up in Beijing. Where are you from?


    A: I’m from Canada. You look quite young. I guess you’re not yet 20?


    B: I’m 19\. I’ll be 20 next month.


    2. A: How are you? Are you American?


    B: No, I’m German.


    A: What place in Germany?


    B: I was born in Berlin (Bólín), and I grew up in Hamburg (Hànbăo). Where are
    you from?


    A: I’m from Shanghai. You look quite young. I guess you’re not yet 30?


    B: I’m 24\. I’ll be 25 in April.


    3. A: Where were you born?


    B: I was born in New York and then I grew up in San Francisco.


    A: Interesting! I was born in San Francisco and then I grew up in New York.


    4. A: Are you married?


    B: I’m already married.


    A: Do you have kids?


    B: We have three children, one son and two daughters. How about you? Are you married?


    A: I’m a college student. I haven’t yet gotten married.


    5. A: What are you doing sitting there?


    B: May I not sit here?


    A: I didn’t say you may not sit there! I asked you what you are doing sitting
    there.


    6. A: Moving is very tiring! Have you ever moved?


    B: I have moved before; I have moved twice.


    7. A: What is the food in the dining hall like? Does it taste good?


    B: The dining hall food, in looking at it it looks tasty, but in eating it it’s
    not very tasty.


    8. A: Excuse me, what is the meaning of shémme dìfang?


    B: The meaning of shémme dìfang is năr. I suppose now you understand?


