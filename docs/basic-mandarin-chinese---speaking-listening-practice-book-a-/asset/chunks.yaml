    he/she only can work half days.


    A: This is a small present that I am giving your daughter. It’s candy. There are
    no children that don’t like to eat candy!


    3. A: Excuse me, what’s your name? Where do you work?


    B: My name is ___. I teach at a junior high school.


    A: What do you teach?


    B: I teach English.


    4. A: What time every morning does your mother go to work?


    B: She goes to work every morning at 9:00 A.M.


    A: What time every afternoon does she get off from work?


    B: She gets off from work every afternoon at 5:00 P.M.


    5. A: Why do many people say that Chinese is hard to learn?


    B: I think it’s because Chinese characters are too many. Chinese characters are
    also hard to write, right?


    Unit 6, Part 4: Role Play Exercises


    Practice these role plays in Chinese to improve your spoken fluency.


    1. A: Do you have any brothers or sisters?


    B: I have one older brother and one younger brother. How about you?


    A: I have two older sisters and one younger sister.


    B: Oh, it’s already 9:00! Sorry, I have something I have to do, I’ll be going
    first now. In the future, when there’s a chance, why don’t we chat again!


    2. A: Do you have any siblings?


    B: I’m the oldest in our family. I have two younger brothers and two younger sisters.
    How about you? Do you have any brothers or sisters?


    A: I have two older sisters and one younger sister.


    B: Oh, it’s already 10:00\. I have to go to class. I’ve already been late too
    many times! In the future, when there’s a chance, let’s chat again!


    3. A: How many brothers and sisters do you have?


    B: I’m the second oldest in our family. I have an older sister and a younger brother.


    A: Where do your sister and brother live? Do they live in America?


    B: No. My older sister immigrated to England. My little brother is studying abroad
    in China.


    4. A: How many brothers and sisters do you have?


    B: I have one older brother, one younger brother, one older sister, and one younger
    sister.


    A: Do they all live in China?


    B: My parents, older brother, and younger brother live in China. My older sister
    immigrated to Canada; she got married to a Canadian. My younger sister is studying
    abroad in Japan.


    5. A: Oh, sorry. I forgot to introduce myself. My name is ___.


    B: My name is ___. This is my name card, please instruct me much.


    A: Thank you, thank you. Sorry, I forgot to carry name cards.


    B: That’s O.K. Sorry, I have a little something, I have to leave first. In the
    future when there’s a chance, let’s chat again.


    6. A: How are you? This is my name card. My name is ___.


    B: Thank you, thank you. Sorry, I forgot to introduce myself. My name is ___.
    I was born in Beijing and grew up in Shanghai. I also will give you a name card.


    A: You were born in Beijing and grew up in Shanghai? Very interesting! I was born
    in Shanghai and grew up in Beijing.


    B: Right, very interesting. O.K., nice to meet you. Excuse me, I have something
    I have to do. In the future when there’s a chance, let’s chat again! I much enjoy
    chatting with friends.


