    1. When Old Wang died, everybody was very sad.

    2. The east coast of the U.S. is not as dry as the west coast.

    3. This winter I’m going to Beijing. Is Beijing colder than New York?

    4. I’m playing with my computer; Old Sun is sleeping. What are you doing?

    5. Macao is hot every day—both hot and humid, so we seldom go outdoors.

    6. Recently the weather has been cooler and cooler, more and more comfortable.

    7. Starting tomorrow, I’m going to be working at the embassy. I’m so nervous I’m
    going to die.

    8. The weather forecast said that tomorrow the high temperature will be 33° and
    the low temperature 25°.

    9. If it rains tomorrow, then we won’t go out to have fun; but the weather report
    isn’t necessarily accurate.

    10. `A: My friends are neither many nor few. B: I have only one good friend. C:
    I don’t have friends at all.`


    # Praise for the BASIC MANDARIN CHINESE and INTERMEDIATE MANDARIN CHINESE textbooks:


    “Meticulously planned, carefully prepared and patiently tested for over a decade,
    the Basic Chinese series represents the most comprehensive introductory materials
    available now. The eclectic approach, the flexibility in use, the attention to
    authenticity of language in its sociolinguistic context, the myriad of audio and
    visual aids, and the array of rigorously designed exercises makes the Basic Chinese
    the ideal material for any committed learner.”

    — Jun Yang, Senior Lecturer in Chinese, University of Chicago


    “Outstanding for its carefully graduated presentation of material ... and perhaps
    most important of all, its separation of the task of learning to speak the language
    from the very different processes of learning to read and write Chinese … The
    most exciting Chinese language textbook I have seen in many years.”

    — James E. Dew, retired associate professor of Chinese, Univ. of Michigan; former
    Director of the Inter-University Program for Chinese Language Studies in Taipei


    “Revolutionary in its approach … The dream of having engaged and fully-prepared
    students in every class is an easily reachable reality for any program that adopts
    this series.”

    — Cecilia Chang, Department of Asian Studies, Williams College


    “This is one of the best elementary Chinese textbooks, I believe, ever produced
    in the history of teaching Chinese as a second language … A great and unique work
    which will benefit students and teachers for many years to come

    — Shengli Feng, Professor of Chinese Linguistics, Chinese University of Hong Kong


    “A breath of fresh air… Its dual track for spoken and written language finally
    gives American students a chance to develop oral proficiency without being slowed
    down by the character writing… An ideal textbook for any program that seeks to
    advance rapidly in spoken Chinese and to fully prepare the students for their
    encounter with China.”

    — Jingqi Fu, Associate Professor of Chinese, St. Mary’s College of Maryland


    “Contextualized so learners know not only what to say, but why, when, and with
    whom it is appropriate to use such language. …thorough and clear…refreshing.”

    — Matthew Christensen, Professor of Chinese, Brigham Young University


    “Kubler’s books distinguish themselves with natural, culturally-rooted dialogues,
    detailed notes (for both written and spoken language), generous practice activities
    and an amazing care for organization. These books will be valuable tools for both
    students and their teachers.”

    — Eric Pelzl, Wisconsin Lutheran College


    “Professor Kubler in a detailed manner explains the structure of Mandarin sentences
    and does a good job comparing Mandarin sentences with the corresponding English
    ones, highlighting many of the pitfalls faced by the average English speakers
    trying to learn Chinese.”

    — Study More Chinese

