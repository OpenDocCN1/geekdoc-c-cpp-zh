    8. First turn to the east, then turn to the west, and you’ll be there!

    9. I’m sorry, I can’t find my name cards. (don’t use `kéyi` or `néng`)

    10. At home we raise fish. Do you keep any small animals at home?


    # Unit 10: Translation Exercise


    NAME _______________________ COURSE _______________________ DATE _______________________


    Translate the following sentences into Pinyin romanization with correct tone marks.
    If you have forgotten a word, consult the English-Chinese Glossary in the back
