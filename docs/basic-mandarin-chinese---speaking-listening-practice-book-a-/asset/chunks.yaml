    The listening comprehension exercises involve conversations or monologues which
    are available on the accompanying ![Image](Images/dlogo.jpg) only, since it is
    listening that we want to practice, not reading. There are two listening passages
    for each lesson, each approximately the same length as the basic conversations,
    that is, about 6 to 12 lines total. To provide additional practice in listening
    comprehension, the passages reuse, in new contexts, the new vocabulary (including
    the Supplementary Vocabulary) and grammar of the current and previous lessons.


    Each listening passage is followed by two to four multiple choice questions on
    the content of the passage. Based on the recorded passages, you should circle
    the best response—(A), (B), or (C)—to each of the questions that follows.


    > • While you work on the listening comprehension exercises, feel free to listen
    to each passage as many times as needed.

    > • In a classroom setting, the listening comprehension exercises are best done
    as homework which students hand in the next day for the instructor to correct,
    grade, and return. After they have been corrected and returned to students, they
    can be inserted by the student into a binder for future reference.

    > • Independent learners will also find the listening comprehension exercises
    helpful for practice in comprehending new combinations of words and grammar patterns;
    if they have questions, they can ask a tutor or Chinese friend. It may also be
    useful to obtain the Instructor’s Guide, since along with the scripts for the
    listening comprehension exercises it also includes the correct answers.


    ## Dictation Exercises


    The dictation exercises provide practice in listening to and transcribing in Pinyin
    romanization the sounds of Mandarin, as well as listening comprehension practice
    involving the classroom expressions, numbers, ages, money amounts, clock times,
    amounts of time, and dates (days of the week, days of the month, months, and years).


    Dictation exercises are included only for some of the lessons in the textbook.
    The lesson in the textbook that a given dictation exercise is designed to accompany
    is indicated.


    The dictation exercises provide all learners, independent or class-based alike,
    with additional practice to reinforce the content of the lesson. If you’re learning
    Chinese in a classroom setting, your instructor may suggest that you do the dictation
    exercises as homework to reinforce what’s been covered in class.


    > • Like the listening comprehension exercises, the dictation exercises are based
    on audio recordings by native speakers that are available only on the accompanying
    ![Image](Images/dlogo.jpg). Instructions are given in English at the beginning
    of each exercise.

    > • You may listen to each dictation exercise as many times as you wish.

    > • Also like the listening comprehension exercises, the dictation exercises may
    be removed from the workbook for correction by the instructor and then may be
    kept in a binder for reference.


    ## Translation Exercises


    The purpose of the translation exercises is to provide you with additional practice
    in using the grammar patterns and important vocabulary of the unit and to serve
    as a check of mastery over the material. Completing the translation exercises
    will be helpful to students in reviewing for the unit tests.


    It is recommended that the classroom instructor correct and return the translation
    exercises to students before the test on the corresponding unit, so that any remaining
    problems can be identified and addressed in a timely manner. Students should carefully
    study the instructor’s corrections, making sure they understand why any errors
    occurred, and file the corrected exercises for later reference.


    The translation exercises come in two different sets. The first set of translation
    exercises consists of five sentences for each of the four Parts or lessons of
    each Unit in the textbook, while the second set of translation exercises consists
    of ten sentences for each complete Unit of the textbook. Instructors can decide
    whether the students in their classes should complete both sets or only one of
    the two sets. Independent learners would profit from doing both sets of translation
    exercises and can read out their translations to a tutor or native-speaking friend
    for correction and comments.


    > • The sentences should be translated into Pinyin romanization with correct tone
    marks in the blank space that has been left under each sentence.

    > • The English in the translation exercises is in some places purposely somewhat
    stilted, so as to guide the student toward the correct Chinese translation.

    > • In certain cases, additional instructions have been added in parentheses within
    or after the English sentence, for example, to be polite or to use or not use
    certain words or patterns.

    > • If you’ve forgotten the Chinese equivalent for an English word or grammar
    pattern, you can consult the English-Chinese Glossary, Chinese-English Glossary,
    or Index of Grammatical and Cultural Topics in the back of the Basic Mandarin
    Chinese—Speaking & Listening textbook.


    ## Footnotes


    [1](#How_to_use.xhtml_pga1_1). Complete scripts of the listening comprehension
    exercises in Chinese characters are available in the Instructor’s Guide, which
    also includes other exercises for in-class use.


    [2](#How_to_use.xhtml_pga1_2). Scripts of the dictation exercises are also included
    in the Instructor’s Guide.


    ## Abbreviations


    | Word Classes* |

    | :--- | :--- |

    | A | Adverb |

    | AT | Attributive |

    | AV | Auxiliary Verb |

    | BF | Bound Form |

    | CJ | Conjunction |

    | CV | Coverb |

    | EV | Equative Verb |

    | EX | Expression |

    | I | Interjection |

    | IE | Idiomatic Expression |

    | L | Localizer |

    | M | Measure |

    | MA | Moveable Adverb |

    | N | Noun |

    | NU | Number |

    | P | Particle |

    | PH | Phrase |

    | PR | Pronoun |

    | PT | Pattern |

    | PV | Postverb |

    | PW | Place |

