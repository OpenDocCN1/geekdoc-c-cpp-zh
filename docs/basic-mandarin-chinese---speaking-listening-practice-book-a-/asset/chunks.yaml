    # 关于 TUTTLE

    “跨越东西方的书籍”


    Tuttle Publishing 的核心使命是通过每一页书的内容，将人们联系在一起。Tuttle 成立于 1832 年，位于美国新英州佛蒙特州的小镇拉特兰（Rutland）。我们的基本价值观至今仍如从初那样坚定——出版顶级的书籍，向英语世界介绍亚洲的国家和人民。如今世界已经变得更小了，亚洲的经济、文化和政治影响力不断扩大，但对这一多元化地区进行意义对话和获取信息的需求从未如此巨大。自
    1948 年以来，Tuttle 一直一直是亚洲文化、艺术、美食、语言和文学书籍的领导者。我们的作者和摄影师屡获殊荣，Tuttle 出版了数千部涵盖武术到纸艺等各种主题的书。欢迎您访问
