    Chinese very well.” `Tā xiĕ Zhōngguo zì xiĕde hĕn hăokàn.` “He writes Chinese
    characters very attractively.”


    `MA` to indicate an obvious situation: `Nínde Hànyŭ shuōde tĭng bú cuò ma!` “You
    speak Chinese quite well, you know!”


    Names of languages

    Question words used as indefinites: `Wŏ rènshi jĭbăige Zhōngguo zì.` “I know a
    few hundred Chinese characters.” `Wŏ zhĭ yŏu jĭkuài qián.` “I only have a few
    dollars.”


