    Unmarked coordination: `nĭ àiren, háizi` “your spouse and children”


    # Unit 1, Part 3: New Vocabulary and Grammar


    ## Vocabulary


    | ăi | be short [SV] |

    | bù | not [A] |

    | -de | (in tĭng…-de “quite, very”) [P] |

    | èi | hey, hi [I] |

    | Gāo | Gao [SN] |

    | gāo | be tall [SV] |

    | gōngzuò | work [N] |

    | Hé | He [SN] |

    | jĭnzhāng | be intense [SV] |

    | kéyi | be O.K. [SV] |

    | kùn | be sleepy [SV] |

    | lăo | be old [SV] |

    | nán | be difficult [SV] |

    | róngyi | be easy [SV] |

    | shì | be [EQ] |

    | tài | too, excessively [A] |

    | tĭng | quite, very [A] |

    | xiăo | be small [SV] |

    | xuéxí | study, studies [N] |

    | yàngzi | way [N] |

    | Zhōngwén | Chinese language [N] |

    | zuìjìn | recently [TW] |


    ## Grammar


    Affirmative-Negative Questions: `Zhōngwén nán bu nán?` “Is Chinese hard?”


    `BÙ` to negate verbs: `bù máng` “not be busy,” `bù huí sùshè` “not go back to
    the dormitory”


    `LĂO` and `XIĂO` before monosyllabic surnames: `Lăo Gāo` “Old Gao,” `Xiăo Wáng`
    “Little Wang”


    Stative Verbs before nouns as adjectives: `lăo yàngzi` “old way,” `hăo háizi`
    “good child,” `xiăo shìr` “small matter”


    `TῘNG...-DE`: `tĭng jĭnzhāngde` “quite intense,” `tĭng róngyide` “quite easy”


    Tone change of `BÙ` to `BÚ` before Tone Four syllables: `bù + qù` → `bú qù`


    Topic-comment construction: `Nĭ gōngzuò máng bu máng?` “Is your work busy or not
    busy?”


    Vocative Expressions: `Xiăo Liú!` “Little Liu!,” `Bàba!` “Dad!”


    # Unit 1, Part 4: New Vocabulary and Grammar


    ## Vocabulary


    | bú kèqi | you’re welcome [IE] |

    | dĕi | must [AV] |

    | huānyíng | welcome [IE] |

    | jìn | enter [V] |

    | lăoshī | teacher [N] |

    | Lĭ | Li [SN] |

    | Lín | Lin [SN] |

    | màn zŏu | take care [IE] |

    | méi yìsi | not be interesting [PH] |

    | nĭmen | you (plural) [PN] |

    | nín | you (polite) [PN] |

    | qĭng | please [IE] |

    | qĭng jìn | please come in [IE] |

    | qĭng zuò | please sit down [IE] |

    | tàitai | Mrs. [N] |

    | wŏmen | we [PN] |

    | xiānsheng | Mr. [N] |

    | xiáojie | Miss [N] |

    | Xiè | Xie [SN] |

    | xièxie | thank [V] |

    | yŏu yìsi | be interesting [PH] |

    | zuò | sit [V] |


    ## Grammar


    Imperatives: `Qĭng nín dào túshūguăn qù.` “Please go to the library.”


    `LE` to indicate a changed situation: `Nĭ māma hăole ma?` “Has your mom gotten
    well?,” `Wŏ bú qùle.` “I’m no longer going.”


    Pronouns: `wŏ`, `nĭ`, `nín`, `tā`, `wŏmen`, `nĭmen`, `tāmen`


    Titles: `Wáng Xiānsheng` “Mr. Wang,” `Lĭ Taitai` “Mrs. Li,” `Wáng Xiáojie` “Ms.
    Wang,” `Lín Lăoshī` “Teacher Lin”


    # Unit 2, Part 1: New Vocabulary and Grammar


    ## Vocabulary


    | Bái | Bai (lit. “white”) [SN] |

    | Chén | Chen [SN] |

    | Huáyì | person of Chinese descent [N] |

    | Huáyì Mĕiguo rén | Chinese-American [PH] |

    | Jiā’nád | Canada [PW] |

    | jiào | be called or named [EQ] |

    | kĕshi | but [MA] |

    | Mă | Ma (lit. “horse”) [SN] |

    | Măláixī | Malaysia [PW] |

    | Mĕiguo | America [PW] |

    | míngzi | name [N] |

    | nèi- | that [SP] |

    | nèi- | which [QW] |

    | nĕiguó | which country [QW] |

    | qĭng wèn | “excuse me,” “may I ask” [IE] |

    | rén | person [N] |

    | Rìbĕn | Japan [PW] |

    | shémme | what [QW] |

    | Táiān | Taiwan [PW] |

    | tóngxué | classmate [N] |

    | wèi | (polite measure for people) [M] |

    | wèn | ask [V] |


    ## Grammar


    `JIÀO` in equative verb sentences: `Wŏ jiào Béiruì.` “My name is Bai.” `Nĭ jiào
    shémme?` “What’s your name?”


    Nationalities: `Mĕiguo rén` “American,” `Zhōngguo rén` “Chinese,” etc. `SHÌ` in
    equative verb sentences: `Wŏ shi Mĕiguo rén.` “I am (an) American.”


    `ZHÈI-` and `NÈI-` as specifiers with the polite measure `WÈI`: `zhèiwèi lăoshī`
    “this teacher,” `nèiwèi tóngxué` “that classmate”


    # Unit 2, Part 2: New Vocabulary and Grammar


    ## Vocabulary


    | bié | don’t [AV] |

    | búyào | don’t [AV] |

    | chēnghu | address [V] |

    | -de | (indicates possession) [P] |

    | gāoxìng | be happy [SV] |

    | gi | for [CV] |

    | hăo | “all right,” “O.K.” [IE] |

    | huānyíng | welcome [V] |

    | jiào | call (someone a name) [V] |

    | jièshao | introduce [V] |

    | lái | come [V] |

    | nà | in that case [CJ] |

    | nà | that [PN] |

    | ò | “oh” [I] |

    | rènshi | be acquainted with, know [V] |

    | shéi | who, whom [QW] |

    | tóngwū(r) | roommate [N] |

    | xīn | be new [SV] |

    | yīnggāi | should [AV] |

    | zĕmme | how [QW] |

    | zhè | this [PN] |

    | zhèmme | like this, this way, so [A] |


    ## Grammar


    `BIÉ` or `BÚYÀO` to indicate negative imperative: `Qĭng nĭ bié qù!` “Please don’t
    go!” `Búyào jiào wŏ Lăo Wáng!` “Don’t call me old Wang!”


    `DÀO...LÁI`: `Qĭng nĭ dào túshūguăn lái.` “Please come to the library.”


    `-DE` to indicate possession: `wŏde gōngzuò` “my work,” `nĭde xīn tóngxué` “your
    new classmate”


    `...HĂOLE`: `Nĭ hái shi jiào wŏ Xiăo Chén hăole.` “It would be better if you called
    me Little Chen.”


    `YÍXIÀ(R)` after verbs to make them less abrupt: `jièshao yixiar` “introduce,”
    `lá yixia` “come,” `wèn yixia` “ask”


    `ZHÈ` “this” and `NÀ` “that” as pronoun subjects: `Zhè shi Wáng Àihuá, zhè shi
    Chén Lì` “This is Wang Aihua, this is Chen Li,” `Nà shi shéi?` “Who is that?”


    # Unit 2, Part 3: New Vocabulary and Grammar


    ## Vocabulary


    | ba | (indicates supposition) [P] |

    | dàshĭguăn | embassy [PW] |

    | dàxué | university, college [PW] |

    | dānwèi | work unit, organization [PW] |

    | ge | (general measure) [M] |

    | gōngsī | company, firm [PW] |

    | gōngzuò | work [V] |

    | guìxìng | “what’s your honorable surname?” [IE] |

    | jiā | (for companies, factories) [M] |

    | nǚshì | madam, lady [N] |

    | tàitai | wife [N] |

    | tóngshì | colleague [N] |

    | wàijiāobù | foreign ministry [PW] |

    | Wú | Wu [SN] |

    | xiānsheng | husband [N] |

    | Xiānggăng | Hong Kong [PW] |

    | xiàozăng | head of school [N] |

    | xìng | be surnamed [EQ] |

    | xuéxí | learn, study [V] |

    | yī | one, a [NU] |

    | zài | be located at, at [CV] |


    ## Grammar


    `BA` to indicate supposition: `Tā shi Yīngguo ba` “I suppose she’s English.” `Nĭle
    ba?` “You must be tired?”


    `XÌNG` in equative verb sentences: `Wŏ xìng Zhāng.` “My last is Zhang.” `Nĭ xìng
    shémme?` “What’s your name?”


    # Unit 2, Part 4: New Vocabulary and Grammar


    ## Vocabulary


    | à | “oh” [I] |

    | cuò | be wrong [SV] |

    | -cuò | wrong [RE] |

    | dài | take along, bring [V] |

    | -de | (indicates that what precedes describes follows) [P] |

    | găo | get, do [V] |

    | găocuò | get or do wrong [RC] |

    | gēn | and [CJ] |

    | Hóu | Hou [SN] |

    | jīnglĭ | manager [N] |

    | -le | (indicates completed action) [P] |

    | Luó | Luo [SN] |

    | màoyì | trade [N] |

    | màoyì gōngsī | trading company [PH] |

    | méi | (indicates past negative of action verbs) [AV] |

    | méi guānxi | “never mind” [IE] |

    | mípiàn | name card, business card [N] |

    | Shī | Shi [SN] |

    | tàitai | married woman, lady [N] |

    | xiānsheng | gentleman [N] |

    | xiáojie | young lady [N] |

    | Yīngguo | England [PW] |

    | Zhōng-Mĕi | Sino-American [AT] |

    | zŏngjīnglĭ | general manager [N] |


    ## Grammar


    `BÙ DŌU` vs. `DŌU BÙ`: `Wǒmen bù dōu shi Mĕiguo rén.` “We are not all Americans.”
    `Wǒmen dōu bú shi Mĕiguo rén.` “None of us is American.”

