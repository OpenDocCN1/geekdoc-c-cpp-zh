    ## Unit 1, Part 4: Transformation and Response Drills


    ### 1. Add the surname and title of the wife to the husband’s surname and title.


    | Zhào Xiānsheng | Zhào Xiānsheng, Zhào Tàitai |

    | “Mr. Zhao” | “Mr. and Mrs. Zhao” |

    | Gāo Xiānsheng | Gāo Xiānsheng, Gāo Tàitai |

    | “Mr. Gao” | “Mr. and Mrs. Gao” |

    | Wáng Xiānsheng | Wáng Xiānsheng, Wáng Tàitai |

    | “Mr. Wang” | “Mr. and Mrs. Wang” |

    | Kē Xiānsheng | Kē Xiānsheng, Kē Tàitai |

    | “Mr. Ke” | “Mr. and Mrs. Ke” |

    | Lín Xiānsheng | Lín Xiānsheng, Lín Tàitai |

    | “Mr. Lin” | “Mr. and Mrs. Lin” |

    | Xiè Xiānsheng | Xiè Xiānsheng, Xiè Tàitai |

    | “Mr. Xie” | “Mr. and Mrs. Xie” |


    ### 2. Add the title `Xiáojie` to each of the following surnames.


    | Wáng | Wáng Xiáojie |

    | “Wang” | “Miss/Ms. Wang” |

    | Lín | Lín Xiáojie |

    | “Lin” | “Miss/Ms. Lin” |

    | Hé | Hé Xiáojie |

    | “He” | “Miss/Ms. He” |

    | Xiè | Xiè Xiáojie |

    | “Xie” | “Miss/Ms. Xie” |

    | Gāo | Gāo Xiáojie |

    | “Gao” | “Miss/Ms. Gao” |

    | Zhào | Zhào Xiáojie |

    | “Zhao” | “Miss/Ms. Zhao” |


    ### 3. Add the title `Lăoshī` to each of following surnames.


    | Lín | Lín Lăoshī |

    | “Lin” | “Teacher Lin” |

    | Xiè | Xiè Lăoshī |

    | “Xie” | “Teacher Xie” |

    | Gāo | Gāo Lăoshī |

    | “Gao” | “Teacher Gao” |

    | Zhào | Zhào Lăoshī |

    | “Zhao” | “Teacher Zhao” |

    | Hé | Hé Lăoshī |

    | “He” | “Teacher He” |

    | Wáng | Wáng Lăoshī |

    | “Wang” | “Teacher Wang” |


    ### 4. Add `qĭng` to the following sentences to create imperatives.


    | Nĭ qù shítáng. | Qĭng nǐ qù shítáng. |

    | “You go to the cafeteria.” | “Please go to the cafeteria.” |

    | Nǐ qù gōngzuò. | Qĭng nǐ qù gōngzuò. |

    | “You go work.” | “Please go work.” |

    | Tā huí sùè. | Qĭng tā huí sùè. |

    | “He goes back to the dormitory.” | “Ask him to please go back to the dormitory.”
    |

    | Nǐmen qù túshūǎn bàn yìdir shì. | Qĭng nǐmen qù túshūǎn bàn yìdir shì. |

    | “You go to the library and take care of stuff.” | “Please go to the library
    and take care of stuff.” |

    | Tāmen xiān zŏu. | Qĭng tāmen xiān zŏu. |

    | “They leave earlier.” | “Ask them to leave earlier.” |


    ### 5. Add changed status `le` to the following sentences.


    | Wŏ dĕi qù gōngzuò. | Wŏ dĕi qù gōngzuòle. |

    | “I have to go to work.” | “I have to go to work now.” |

    | Tā zĕmmàngàng? | Tā zĕmmàng le? |

    | “How is he?” | “What happened to him?” |

    | Tā xiān zŏu. | Tā xiān zŏule. |

    | “She leaves earlier.” | “She left already.” |

    | Xiăo Lín qù shítáng. | Xiăo Lín qù shítáng le. |

    | “Little Lin goes to the cafeteria.” | “Little Lin went to the cafeteria.” |

    | Shéi bú qù? | Shéi bú qùle? |

    | “Who is not going?” | “Who is not going now?” |

    | Tāmen huí sùè. | Tāmen huí sùè le. |

    | “They go back to the dormitory.” | “They went back to the dormitory.” |


    ### 6. Add changed status `le` to the following questions ending in `ma`.


    | Tā māma hăo ma? | Tā māma hăole ma? |

    | “Is her mother well?” | “Has her mother gotten well?” |

    | Nǐ jǐnzhāng ma? | Nǐ jǐnzhāngle ma? |

    | “Are you nervous?” | “Have you gotten nervous?” |

    | Wŏmen kéyi huí sùè ma? | Wŏmen kéyi huí sùè le ma? |

    | “Can we go back to the dormitory?” | “Can we go back to the dormitory now?”
    |

    | Tā qù túshūǎn bàn shì ma? | Tā qù túshūǎn bàn shì le ma? |

    | “Is he going to the library to take care of stuff?” | “Has he gone to the library
    to take care of stuff?” |

    | Háizi kùn ma? | Háizi kùnle ma? |

    | “Are the kids sleepy?” | “Have the kids gotten sleepy?” |

    | Nǐmen qù shítáng ma? | Nǐmen qù shítáng le ma? |

    | “Are you going to the cafeteria?” | “Have you gone to the cafeteria?” |


    ## Unit 2, Part 1: Transformation and Response Drills


    ### 1. Respond to the following questions with an equative verb sentence beginning
    with `shì`.


    | Tā shi Mĕiguo rén ma? | Shì, tā shi Mĕiguo rén. |

    | “Is she American?” | “Yes, she is American.” |

    | Tā shi Zhōngguo rén ma? | Shì, tā shi Zhōngguo rén. |

    | “Is he Chinese?” | “Yes, he is Chinese.” |

    | Tā shi Wáng Lăoshī ma? | Shì, tā shi Wáng Lăoshī. |

    | “Is she Teacher Wang?” | “Yes, she is Teacher Wang.” |

    | Tā shi nǐ àiren ma? | Shì, tā shi wǒ àiren. |

    | “Is he your spouse?” | “Yes, he is my spouse.” |

    | Nǐ shi tā bàba ma? | Shì, wǒ shi tā bàba. |

    | “Are you her father?” | “Yes, I am her father.” |

    | Nǐ shi tā māma ma? | Shì, wǒ shi tā māma. |

    | “Are you his mother?” | “Yes, I am his mother.” |


    ### 2. Respond to the following questions with a negative equative verb sentence
    beginning with `bú shi`.


    | Nǐ shi Zhōngwén lăoshī ma? | Bú shi, wǒ bú shi Zhōngwén lăoshī. |

    | “Are you a Chinese teacher?” | “No, I am not a Chinese teacher.” |

    | Nǐ shi Lín Xiáojie ma? | Bú shi, wǒ bú shi Lín Xiáojie. |

    | “Are you Ms. Lin?” | “No, I am not Ms. Lin.” |

    | Nǐmen shi Jiā’nádà rén ma? | Bú shi, wǒmen bú shi Jiā’nádà rén. |

    | “Are you Canadian?” | “No, we’re not Canadian.” |

    | Tā shi Wáng Xiānsheng ma? | Bú shi, tā bú shi Wáng Xiānsheng. |

    | “Is he Mr. Wang?” | “No, he’s not Mr. Wang.” |


    ### 3. Respond to the following questions either with an equative verb sentence
    beginning with `Shì` or with a negative equative verb sentence beginning with
    `Bú shi`, depending on the cue provided.


    | Tā shi nǐ bàba ma? (Shì.) | Shì, tā shi wǒ bàba. |

    | “Is he your dad?” | “Yes, he is my dad.” |

    | Tā shi nǐ māma ma? (Bú shi.) | Bú shi, tā bú shi wǒ māma. |

    | “Is she your mom?” | “No, she’s not my mom.” |

    | Qǐng wèn, nǐ shi Bái Lăoshī ma? (Bú shi.) | Bú shi, wǒ bú shi Bái Lăoshī. |

    | “Excuse me, are you Teacher Bai?” | “No, I’m not Teacher Bai.” |

    | Tā shi Huáyì Mĕiguo rén ma? (Shì.) | Shì, tā shi Huáyì Mĕiguo rén. |

    | “Is he an American of Chinese descent?” | “Yes, he’s an American of Chinese
    descent.” |

    | Nǐmen shi Táiwān rén ma? (Bú shi.) | Bú shi, wǒmen bú shi Táiwān rén. |

    | “Are you Taiwanese?” | “No, we’re not Taiwanese.” |

