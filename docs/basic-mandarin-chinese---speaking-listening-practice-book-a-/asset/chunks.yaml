    | “Is Little Wang coming?” | “I’m afraid he’s not coming.” |

    | Nĭ qù bu qù? | Kǒngpà wǒ bú qùle. |

    | “Are you going?” | “I’m afraid I’m not going.” |

    | Tāmen măi bu măi? | Kǒngpà tāmen bù măile. |

