  raw: "Basic Mandarin Chinese—Speaking & Listening Practice Book contains extensive\
    \ drills and exercises for each unit of the textbook Basic Mandarin Chinese—Speaking\
    \ & Listening. The purpose of this workbook is to offer learners various kinds\
    \ of practice activities for both in- and out-of-class use, so as to enable learners\
    \ to reinforce and “activize” their learning of the new vocabulary and grammar\
    \ introduced in the textbook.\n\nNew Vocabulary and Grammar Summaries\n\nThe first\
    \ section of the Practice Book consists of a one-page list of new vocabulary and\
    \ grammar in each Basic Mandarin Chinese—Speaking & Listening lesson, from Unit\
    \ 1, Part 1 through Unit 10, Part 4.\n\nThe lists are divided into a section on\
    \ “Vocabulary” and a section on “Grammar.” In the vocabulary section, each new\
    \ vocabulary item introduced in the corresponding lesson of the textbook is listed\
    \ in alphabetical order of the Pinyin with English translation and indication\
    \ of word class (any Additional Vocabulary is not included). In the grammar section,\
    \ each new grammar pattern introduced in that part of the textbook is listed,\
    \ also in alphabetical order, in most cases with one or more examples in Pinyin\
    \ and English translation.\n\n> • We believe these lists of new vocabulary and\
    \ grammar will be useful for all learners for review purposes. However, learners\
    \ should ideally not learn new vocabulary or grammar from these lists; instead,\
    \ they should always try to learn new vocabulary and grammar in the context of\
    \ the Basic Conversations and Build Ups in the textbook.\n\n> \n\n> • Those learners\
    \ who are using the Practice Book to supplement other textbooks and who do not\
    \ have access to the textbook for Basic Mandarin Chinese—Speaking & Listening,\
    \ will want to pay special attention to these lists, since the various drills\
    \ and exercises in this book assume thorough familiarity with all this material.\n\
    \nThe next two sections consist of drills. Don’t underestimate the value of drills\
    \ as enabling mechanisms that help you, the learner, to attain the ultimate goal\
    \ of communicative competency. The drills are useful for improving your pronunciation,\
    \ developing your fluency, and increasing your confidence in speaking Chinese.\
    \ Although it’s true that some of the drills in this workbook are of necessity\
    \ fairly mechanical, others are more realistic and communicative, in some cases\
    \ even incorporating a certain amount of cultural material.\n\n> • The drills\
    \ are best done out of class in self-study mode, either in a language learning\
    \ laboratory or, working with a computer or your audio player, in some other place\
    \ of your choosing. If you’re learning Chinese in a classroom setting, doing the\
    \ drills out of class also frees up valuable time with the instructor so that\
    \ you can focus on those kinds of interactive learning activities for which the\
    \ instructor’s guidance and active participation are essential.\n\n> \n\n> • You\
    \ should work with the recordings on the accompanying ![Image](Images/dlogo.jpg)\
    \ as actively as possible, speaking loudly and always thinking of the meaning\
    \ of what you are hearing and saying.\n\n> \n\n> • If you’re learning Chinese\
    \ on your own, the drills will be especially important for you and, working with\
    \ the accompanying ![Image](Images/dlogo.jpg), you should try to go through each\
    \ one several times. In addition, it will be to your benefit to seek out a native-speaking\
    \ tutor or mentor who can work with you one or two hours a week for additional\
    \ practice and to answer questions.\n\nSubstitution Drills\n\nIn the substitution\
    \ drills, a model sentence is first said for you to repeat. Next, various vocabulary\
    \ and grammar prompts are given that you’re to substitute into the model sentence,\
    \ creating a related but new sentence.\n\nIn the audio portion, after each prompt\
    \ a pause is provided for the learner to say the new sentence with that substitution.\
    \ A native speaker then provides a confirmation of the correct sentence, followed\
    \ by a pause during which you should repeat the correct sentence. An English translation\
    \ of each sentence is included in the workbook.\n\n> • It’s most effective to\
    \ do each drill at least twice: the first time with the workbook open and the\
    \ second time with the workbook closed.\n\nTransformation and Response Drills\n\
    \nAs the name implies, these drills involve transforming one phrase or sentence\
    \ into another, or responding to a question or other cue. There are also a smaller\
    \ number of politeness drills, translation drills, and drills involving the conversion\
    \ of Bejing-style speech to non-Beijing-style speech and vice versa.\n\nIn the\
    \ audio portion, instructions for each drill are given in English before the drill.\
    \ As with the substitution drills, each of the transformation and response drills\
    \ is followed by a pause for the learner’s response, which is then in turn followed\
    \ by confirmation of the correct response by a native speaker. A pause then allows\
    \ you time to repeat the correct sentence. An English translation of each sentence\
    \ or phrase is included in the workbook.\n\n> • Again, it is best to do each drill\
    \ at least twice—once with the workbook open and once with the workbook closed.\n\
    \n> \n\n> • Though the transformation and response drills are in principle meant\
    \ to be done by students out of class, some instructors may choose to do some\
    \ of the drills in class, or some of the drills could be adapted for in-class\
    \ exercises.\n\nRole Play Exercises\n\nThe role play exercises involve conversations\
    \ between two or more speakers that make use of the new vocabulary, grammar, functions,\
    \ and situations introduced in the lesson.\n\nThere are three to eight role plays\
    \ for each of the four parts of each unit. In many cases, the role plays are based\
    \ roughly on the textbook’s Basic Conversation but with some of the details changed.\
    \ Most of the role plays involve two roles (indicated by A and B), with a few\
    \ involving three roles (A, B, C).\n\nHere in the workbook, the role plays are\
    \ rendered in English, but they’re to be performed in Chinese. The role plays\
    \ are designed to be done as one of the last activities of each lesson.\n\n> •\
    \ While performing the role plays, you may glance at the English but should try\
    \ to look up as much as possible when saying the Chinese.\n\n> \n\n> • The role\
    \ plays should be performed at a fairly rapid clip, so you may wish to practice\
    \ them in advance (making a few notes is fine, but you should not write out complete\
    \ translations). The goal isn’t laboriously translating word-for-word from English\
    \ to Chinese but, rather, producing natural Chinese equivalents based on the English\
    \ cues. The emphasis should be on the performance of the role plays. If you find\
    \ that you’re hesitant and choppy in performing a role play, this most likely\
    \ means you haven’t yet attained sufficient mastery of the material.\n\n> \n\n\
    > • If you’re learning Chinese in a class, after individual students have performed\
    \ a role play, the instructor will probably lead the whole class in repeating\
    \ the lines of the role play one more time together.\n\n> \n\n> • If you’re learning\
    \ Chinese on your own, then the role plays will be especially helpful in giving\
    \ you practice in using the vocabulary and grammar of the lesson in new combinations.\
    \ By playing all the roles in a role play exercise, you as an independent learner\
    \ stand to gain extra benefits for your language skills, enhancing your fluency\
    \ and becoming flexible in swiftly switching perspectives. Of course, if you’re\
    \ learning with a friend or have access to a native-speaking tutor, then each\
    \ of you could take one role.\n\nListening Comprehension Exercises"
