    # 给学习者的说明

    在学习中文时，练习是必不可少的。本练习为你提供了许多练习和提高语言技能的选项，旨在与 `Basic Mandarin Chinese—Speaking &
    Listening` 一书配合使用。然而，无论你使用哪种书籍或课程来学习中文，它都可以用于磨练口语能力。


    书中没有任何汉字，因为学习中文口语不需要汉字。事实上，为你学学会说的每一个词都学习汉字是一种低效的中文学习方法，会显著减慢你的进度。


    为了帮助你尽可能高效地学习说和理解中文，本练习册不是通过汉字提供中文部分，而是通过带有母语者的音频（见随附的 ![图片](img/dlogo.jpg)）来实现。在本书页中，中文由
    `Hanyu Pinyin`（官方汉语罗马字母系统）表示。


