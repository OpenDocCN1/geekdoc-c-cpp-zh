  raw: 'Cornelius C. Kubler is Stanfield Professor of Asian Studies at Williams College,
    where he teaches Chinese and for many years chaired the Department of Asian Studies.
    He was formerly Chinese Language Training Supervisor and Chair of the Department
    of Asian and African Languages at the Foreign Service Institute, U.S. Department
    of State, where he trained American diplomats in Chinese and other languages,
    and he served for six years as Principal of the American Institute in Taiwan Chinese
    Language & Area Studies School. Kubler, who has directed intensive Chinese language
    training programs in the U.S., mainland China, and Taiwan, has been active in
    Chinese language test development and has authored or coauthored 20 books and
    over 50 articles on Chinese language pedagogy and linguistics. He has just completed
    a two-year tour as American Co-Director of the Johns Hopkins University–Nanjing
    University Center for Chinese & American Studies in Nanjing, China.


    Yang Wang, native to Beijing, is Senior Lecturer in Chinese at Brown University,
    where she teaches all levels of modern Chinese language. Before joining the Brown
    faculty, she taught Chinese at The Ohio State University and Williams College.
    She also taught for several years at the Middlebury College Summer Chinese School.
    Wang is interested in the implications of pragmatics in Chinese pedagogical practice,
    teaching materials development, and the integration of technology into the curriculum.


    ![](Images/review.jpg)'
