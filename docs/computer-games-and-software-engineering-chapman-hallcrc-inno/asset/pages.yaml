- pgno: 61
  md: 'as improving enrolment of existing CS and SE courses. Especially many articles
    that describe the use of game development at middle and high schools reported
    that the students got a more positive attitude to CS and SE, and they were more
    likely to chase a carrier in this field.


    # 2.4 RECOMMENDATIONS FOR THE USE OF GDFs


    In this section, we will give some recommendations for how to choose an appropriate
    GDF that will give the best result when teaching CS or SE. The recommendations
    divided into six main factors you should consider when introducing game development
    in a CS or SE course. The recommendations are based on the survey presented in
    this chapter as well as the work of Wu and Wang (2011).


    *Educational goal.* The educational goal of the course will greatly affect the
    choice of GDF. For instance, if the course focuses on a complete development cycle,
    it should be possible to develop a game from scratch according to specified requirements
    and have tools available to specify the design and tools for testing. However,
    if the educational goal focuses only on some parts of the development cycle, such
    as software testing, AI, teamwork, software maintenance, outsourcing, or quality
    assurance, it is possible to use a game editor for an existing game such as *Unreal
    Tournament* or *Warcraft*.


    *Subject constraints.* Most CS or SE subjects put constraints on what you should
    be able to do in the GDF. For example, if you teach a software architecture, it
    is very important for students to have the freedom to design and implement various
    design and architecture patterns in the framework chosen. Another example is that
    if your subject is AI, it is important that the framework or game being used allow
    specifying and implementing AI similar to what is being taught in the textbook.
    Often, additional articles must be used to link the subject to how it is used
    in games.


    *Programming experience.* The programming experience of the students will highly
    affect the choice of GDF. Typically, young students without any programming experience
    should start with visual programming environments such as Scratch or Alice. For
    students with programming experience, one factor that should be considered when
    choosing a GDF is what programming languages the students know. What is most important
    here is whether the students only know'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'procedural programming languages or also know object-oriented programming languages.
    Experiences from articles in the survey showed that, for example, it usually does
    not require too much work for students who know Java to learn C# or vice versa.
    The programming language used by the GDF should not be too far away from the students’
    programming background.


    *Staff expertise.* One thing you have to consider when introducing game development
    into a CS or SE course is the course staff’s knowledge and technical experience
    with a GDF. This is important both to plan the project to fit with the educational
    goals and to provide help to students getting stuck with technical problems. It
    is not necessary for the teacher to know everything about GDF in detail, but it
    is very useful to have at least one in the course staff that knows it fairly well.
    The minimum requirement is to be able to point the students to online resources
    where they can find help.


    *Usability of the GDF.* We do not want the students to get stuck in technical
    problems during the project, as then they will not learn as much about the CS/SE
    topic. Thus, it is important that the GDF be easy to use and let the students
    be productive with relatively small amount of code. This means, in practice, that
    the course staff should, before introducing game development in a course, create
    some simple games in the GDF to get a feeling of how difficult it is to use. The
    GDF should provide high-level APIs, it should be well structured, and it should
    have a logical structure. In addition, it is important that the GDF be well supported
    through documentation, tutorials, example code, and a living development community.
    It is also a good thing if all resources are free for the students to use.


    *Technical environment.* Technical considerations should also be taken into account
    when choosing a GDF. One very important consideration is the software and hardware
    requirements of the GDF. For example, if XNA is chosen, Microsoft Windows is required
    to run both the development platform and the resulting executables. This could
    be a challenge if many students have PCs running Mac OSX or Linux, or if the lab
    computers run other operating systems than Microsoft Windows. Hardware requirements
    are also important, as some GDFs can have some tough requirements in terms of
    CPU,'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'GPU, and memory. A problem could be that an existing computer lab does not
    have powerful enough PCs to run the GDF or the resulting games. Finally, it is
    important to consider licenses and cost of the GDF.


    # ## 2.5 CONCLUSION


    This chapter focused on describing how game development has been and can be used
    to teach and promote SE and CS. We shared our own experiences from introducing
    game development in a software architecture course. Further, we presented a literature
    survey with articles between 2004 and 2012 on game development in CS and SE. Finally,
    based on our own experiences and the survey, we gave some recommendations on how
    to choose a GDF to be used in a SE/CS course.


    The goal of the chapter was to give answers to three research questions. The first
    research question was about finding the contexts and topics game development is
    used in CS/SE education (RQ1). We found that game development is being used to
    teach a variety of subjects, but the most common subject is programming and more
    specifically introduction to programming. Other major CS/SE topics are AI, software
    architecture, object-oriented design, and software testing. We also found that
    the majority of articles (81%) are studies from colleges or universities, whereas
    the remaining (19%) are from elementary, middle, and high schools. There is also
    a great difference in how and how much game development is used in various courses.
    Some courses simply use game development in a few short assignments, whereas others
    wrap the course around a large game development project.


    The second research question was about what GDFs are being used for developing
    games in CS/SE courses (RQ2). The results of the literature study revealed use
    of a wide variety of tools and frameworks where the most frequent ones were own
    frameworks developed by the authors/researchers, Java, XNA, Android SDK, Alice,
    C++, GameMaker, Flash, and Scratch. In terms of programming languages, the three
    largest categories were visual programming frameworks (e.g., Alice, Scratch, etc.),
    C#, and Java. We foresee that the GDFs and programming languages used for this
    purpose will change significantly in the time to come. For example, Microsoft
    has stopped further development and support of XNA. At many universities, there
    has been a shift from Java programming courses to Python and HTML5/JavaScript.


    The third research question focused on experiences from using game development-based
    learning (RQ3). The main conclusion here is that'
  merge: -1
  img_proc: true
