- pgno: 31
  md: 'study provides a strong foundation for the community to build upon in the investigation
    of adapting serious games, with respect to research methodologies and the results
    reported.


    A scalable architecture for MMOGs is presented by Thomas Debeauvais, Arthur Valadares,
    and Cristina V. Lopes in Chapter 7. The research considers how to harmonize the
    representational state transfer principles, which have been used very successfully
    for scaling web applications, with the architecture-level design of MMOGs. The
    proposed architecture, restful client–server architecture (RCAT), consists of
    four tiers: proxies, game servers, caches, and database. Proxies handle the communication
    with clients, game servers handle the computation of the game logic, and the database
    ensures data persistence. RCAT supports the scalability of MMOGs through the addition
    of servers that provide the same functionality. The authors developed a reference
    implementation of RCAT as a middleware solution, and then conducted experiments
    to characterize the performance and identify bottlenecks.


    Two quantitative performance studies are reported. The first uses a simple MMOG
    to analyze the impact of the number of clients on the bandwidth: from the proxy
    to the clients and from the server to the database, with and without caching.
    The experiments show that the bandwidth from the proxy to the clients increases
    quadratically; the database can be a central bottleneck, although caching can
    be an effective strategy for this component. The second experiment evaluates the
    performance impact of scaling up the number of players using an RCAT reference
    application, which is a multiplayer online jigsaw puzzle game. These experiments
    are designed to quantify how the number of proxies and the number of game servers
    scale with the number of players (bots) for different message frequencies. The
    quantitative results summarize (1) the behavior of CPU utilization and round trip
    time (latency) as the number of clients increases, (2) CPU utilization and context
    switches per second as the number of clients increases, (3) the maximum number
    of clients supported under alternative core/machine scenarios and message frequencies,
    and (4) CPU utilization when the maximum capacity is reached.


    The authors'' proposal of the RCAT architecture, the development of a reference
    implementation, the development of a reference application, and a quantitative
    performance study provides the community with a scalable architectural solution
    with a rigorous validation. The game-agnostic approach to the RCAT architecture,
    modularizing the game logic in one tier, means that it can be applied broadly,
    supporting the development of diverse MMOGs.'
