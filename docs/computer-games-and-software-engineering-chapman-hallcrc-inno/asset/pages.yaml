    # ## 7.1 INTRODUCTION


    Massively multiuser online games (MMOs) such as *World of Warcraft*, *EVE Online*,
    and *Second Life* are virtual 3D environments in which players interact in real
    time with each other inside a virtual world. However, interactions in current
    MMOs are not truly massive: designers craft the games so that users can only interact
    with at most around a hundred other users at the same time. When more than the
    expected number of players gather together, the game usually crashes.^7


    The demand for high user concurrency is now going well beyond games. Applications
    such as Facebook and Twitter distribute massive numbers of events among massive
    numbers of users. Although these applications are not exactly real time, the updates
    are relatively fast paced, and therefore present similar challenges to those seen
    in online games. As web technologies become more capable of supporting rich 2D
    and 3D media, the line between online games and (serious) web applications will
    become fuzzier. The goal of our work is to be able to support the next generation
    of cloud-based massively multiuser online environments, such as massive online
    open courses [1], and social environments for medical applications [2].


    Looking at how MMOs have approached scalability can provide insights to scale
    other types of multiuser applications. MMO players are generally seen as event
    producers and consumers: each player generates a stream of events that other players
    are interested in. For example, if a player orders his or her character to move
    forward, other players should be notified or the character’s movement, update
    their local state of the world, and render the updated state. If all the players
    subscribe to all the other players, the number of event messages to deliver increases
    quadratically with the number of players [3]. Quickly, the system is overwhelmed
    by the number of events, and the latency (i.e., the time taken to forward an event)
    increases. The game becomes much less responsive. Thus, there is a trade-off between
    scalability and responsiveness. That is, as the number of users increases, so
    does the latency.


    > > † See a virtual flash mob in *World of Warcraft* at http://www.youtube.com/watch?v=m7FW0BK2fUo.'
