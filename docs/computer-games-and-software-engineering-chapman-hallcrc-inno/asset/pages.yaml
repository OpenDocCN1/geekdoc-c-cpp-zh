    **Abstract:** Learning is associated with a lot of effort and perseverance. In
    learning theories, motivation can be observed as a key factor for successful learning.
    Serious games can increase motivation because they involve use of a variety of
    elements, such as visual environments, storylines, challenges, and interactions
    with nonplayer characters. This makes serious'
