- pgno: 196
  md: 'originally considered a space partitioning scheme for the jigsaw puzzle MMO:
    cutting the board into square regions and assigning a server per region. We quickly
    realized that this approach would be very inefficient, because users would move
    pieces between regions as often as within regions. This would cause data handovers
    too often and result in poor performance.


    Thus, we opted for a pair (client, puzzle piece) for load balancing. Whenever
    a client attempts to move a piece, the piece is relocated to the server treating
    the client''s request. This way, the data for the piece is always located where
    the client''s request is being treated. Another successful approach may have been
    to move the clients'' messages to the application server where the jigsaw piece
    is cached.


    The implementation of RCAT is in active development. Although some parts are application
    independent, the game developer needs to write the application-specific parts.
    We use Python for the mapper, and therefore also for the game logic, as the persistence
    and object managers only provide a Python API. As the middleware development progresses,
    different implementations of the object manager and persistence manager will provide
    more flexibility and choice for a wider range of applications.


    Currently, each game server instantiates its own object manager. However, game
    servers running on the same machine could use the same object manager. Implementing
    this feature may require game servers to be able to tell whether other game servers
    are local or remote, or to slightly change our architecture.


    We noted throughout our experiments that a bottleneck may hide another. Context
    switches on the proxies may be the limiting factor to scale, and not the proxies''
    CPU. Moreover, the number of voluntary context switches seems to spike right before
    the latency starts spiking. Thus, context switches may prove to be a more adequate
    indicator than the CPU to gauge whether the current load on the system actually
    impacts the players'' experience. It may also prove to be a useful metric for
    provisioning.


    More generally, our work informs the provisioning of massively multiuser online
    environments. For an application to support twice more users, the operator needs
    to deploy 4 times more hardware. In the case of the jigsaw puzzle, and assuming
    the test conditions of our experiment (i.e., all users moving pieces all the time),
    we estimate that we would be able to support nearly 1000 users with 256 cores.
    Being able to do these upfront estimations is a major engineering feat with business
    implications.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'Operators may also need to provide a sufficient network infrastructure to support
    the client connections as well as communication between proxies and application
    servers. In our experiments, a single 1-Gbps switch was sufficient. Thus, network
    provisioning may only be a concern well after the 200-user mark.


    # ## 7.8 CONCLUSION


    In this chapter, we have presented RCAT, a scalable and adaptable three-tiered
    architecture for MMOs. RCAT aims at delivering the flexibility of choosing the
    individual trade-offs found in the extensive variety of MMOs, while providing
    a solid infrastructural middleware that abstracts the complexities of scaling
    through a distributed system. It also provides a common platform for developers
    and researchers to develop applications and compare results of different partitioning
    schemes.


    We have demonstrated the potential of the architecture by presenting a multiplayer
    jigsaw puzzle, featuring full broadcasting of events, data locality, and massive
    number of users. Despite the unavoidable and essential quadratic event distribution,
    we can support 229 concurrent clients sending 2.5 messages per second and 125
    clients sending 10 messages per second, using commodity servers with 16 cores
    total. Scaling to higher numbers of clients is possible simply by deploying more
    proxies and game servers such that a target of twice the number of users requires
    4 times the number of cores.


    As the web becomes more supportive of rich interactive applications, we believe
    that our work can be the foundation for a variety of massively multiuser online
    applications.


