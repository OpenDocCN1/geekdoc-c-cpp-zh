    # ## 6.8 OUTLOOK


    Adaptivity provides a great potential for the future of serious games. Even with
    the simple adjustments to the learners in our games, we already could observe
    some great results. However, during the two studies described here, we merely
    focus on skill-and-action games. We already identified huge differences between
    adaptivity for ITS and our serious games. More complex serious games, which include
    story line, strategy, or sandbox elements, probably require an evergrowing set
    of strategies for adaptivity.


    In reference [17], we already started to explore some aspects of adaptivity in
    connection with a story line, which is intertwined with learning contents. However,
    we feel that more interesting types of serious games could be achieved by researching
    different types of adaptivity.


    # ## 6.9 SUMMARY AND CONCLUSION


    In the literature review, we found an explanation of the role of human tutors
    in theories such as Vygotsky''s social development theory, Piaget''s stages of
    cognitive development, and Erikson''s developmental stages. We focused on answering
    the question how the serious game itself can be adaptive, based on these learning
    theories that already exist and that explain why the phenomenon occurred.


    When we researched the *observations of learners by tutors* in the first study,
    we found that for characterizing the learner, human tutors observe game environments.
    By observing elements, we include *game elements* in the learning content of a
    serious game. Therefore, we argue that the *adaptive serious game* should be able
    to observe both game elements and learning content.'
