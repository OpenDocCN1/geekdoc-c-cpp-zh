  md: '# Understanding User Behavior at Three Scales


    # *The AGoogleADay Story*


    Daniel M. Russell


    # CONTENTS


    +   - 9.1 Introduction 200

    +   - 9.2 Background 201

    +   - 9.3 Our Game: AGAD 201

    +   - 9.4 Three Views of the User: Micro, Meso, and Macro 203

    +   - 9.4.1 Micro Level: How Players Behave over Short Timescales 204

    +   - 9.4.2 Meso Level: How Humans Behave Minute by Minute 206

    +   - 9.4.3 Macro Level: How Humans Behave over Days and in the Large 208

    +   - 9.4.4 Integrating Research and Design across the Three Levels 210

    +   - 9.5 Summary 212

    +   - References 212


    **Abstract:** How people behave is the central question for data analytics, and
    a single approach to understanding user behavior is often limiting. The way people
    play, the way they interact, and the kinds of behaviors they bring to the game
    are factors that ultimately drive how our systems perform and what we can understand
    about why users do what they do. I suggest that looking at user data at three
    different scales of time and sampling'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'resolution shows us how looking at behavior data at the micro, meso, and macro
    levels is a superb way to understand what people are doing in our systems and
    why. Knowing this lets you not just understand what is going on, but also how
    to improve the user experience for the next design cycle.


    # ## 9.1 INTRODUCTION


    Although there are many motivations for creating games, *serious games* are usually
    vehicles for teaching and learning. Although serious games are important in many
    educational settings, they sometimes suffer from a lack of attention to the details
    of game design. Although the goal is to teach and instruct, the *game* experience
    sometimes suffers. Face it, some of those serious games are not so much fun to
    play. How is it possible that a game can be created and deployed without anyone
    noticing that it has some playability issues?


    Many people have reported on ways to instrument and monitor a game. We have found
    that a particularly useful approach to understand the overall user experience
    has been to analyze game player behavior at three different timescales of behavior,
    from very short millisecond-by-millisecond behaviors, up to the timescale of millions
    of players as they use the game to learn over weeks and months.


    The AGOADay.com (AGAD) game had a simple goal. We simply wanted to show the public
    some more sophisticated ways to use the Google search engine. Although Google
    is simple to use, there are many features within Google that are not widely used.
    By building a "trivia question" style game where the use of Google was *required*
    (and not prohibited, as in most such games), we hoped to introduce new features
    to the players by creating questions that were difficult (and obscure) enough
    to motivate their use.


    Originally planned as a 3-month experiment, the AGAD game continues to run more
    than 2 years after its launch, serving millions of game players each month and
    improving players'' ability to seek out answers to questions by searching.


    Here we describe some of the analyses we did to understand what was happening
    with the players—what they did and what effect changes to the game would have.


    Although this chapter is about AGAD, the game, the approach of understanding complex
    user behavior at these three different timescales, and using three different kinds
    of studies, is applicable to software systems with complex user interfaces (UIs)
    in general.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# ## 9.2 BACKGROUND


    There has been a practice of developing games with an eye toward testing and analysis
    (Pinelle 2008; Nacke 2009; Koefel 2010). Typically, the analysis of games has
    followed traditional usability analysis methods or logging player behavior.


    Human computer interaction (HCI) researchers have grown increasingly interested
    in studying the design and experience of online games, creating methods to evaluate
    their user experience (Bernhaupt 2010), "playability" heuristics for their design
    (Schaffer 2008), and models for the components of games (Schaffer 2008) and game
    experience (Sweetser and Wyeth 2005). Each of these approaches, although useful,
    is primarily situated within a single scale of analysis—playability heuristics
    are defined at the microscale, whereas game experience is primarily studied at
    the mesoscale. Likewise, the work of Bell et al. (2006) is definitely a macroscale
    study (by means of diaries), but does not take into account the behavior of players
    across the scales.


    However, in an age when online games are played by a large number of gamers, from
    potentially many places around the world, a more comprehensive method for understanding
    game use early on in the design process is often fruitful. This desire to bridge
    the gap between the lowest levels of use and the behavior of players in the very
    large led us to apply a broad-spectrum analysis to our game.


    # ## 9.3 OUR GAME: AGAD


    The AGAD game was originally developed with a dual purpose in mind: (1) to be
    a serious game to teach people more advanced search skills, such as how to use
    the **filetype:** or **site:** or **filter-by-color** search methods, and (2)
    to also be a marketing presence for Google search in new markets in which we wanted
    to experiment. Although Google has a good deal of experience in advertising, this
    was the first attempt at creating an engaging experience with such a dual purpose.


    The goal from the outset was to create a very visual game that would be "sticky,"
    but not all consuming. In other words, it had to be the kind of game one would
    play for a relatively short amount of time, be exposed to the message, and learn
    a bit along the way.


    We designed a "trivia question" game that would be significantly more difficult
    than ordinary trivia answering games. Typical trivia games walk a delicate balance
    between being too difficult to answer (except by a small'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'fraction of the game-playing population) and being too easy (and therefore
    unsuitable for competitive play). For AGAD, we selected questions that are purposely
    unlikely to be known by even a small fraction of the gamers, yet answers that
    are discoverable with a few Google searches. The questions also had to be of some
    intrinsic interest—truly trivial questions, such as what is the 23rd digit in
    the decimal expansion of pi?—are unsuitable for game play.


    AGAD is a fairly simple game to construct. The UI presents a few questions each
    day, with daily updates to the set. Players work through the questions, doing
    Google searches in a separate iframe that allows the search engine to be visible
    alongside the question. Each question has a simple answer that can be recognized
    by a regular expression. Writing the regexp is slightly tricky, as most questions
    have multiple variants on an answer (e.g., “three,” “3,” or “the number 3”).


    As shown in Figure 9.1, the questions are presented in a frame at the bottom of
    the page, with typical game mechanics such as unlocking subsequent questions,
    buttons to let the player skip a question, and ways to compare your score (and
    time to answer the question) with friends via the Google+ social network.


    As we developed AGAD, it quickly became clear that user testing would have to
    be an important part of the design cycle. This is true for


    ![](img/8edd7838aa9e4a0d883fcf44f4b667a0_221_0.png)


    FIGURE 9.1 (See color insert.) The AGAD game shows a search question (3), then
    lets you search for the answer with Google (1). You work through the questions
    (2) scoring points as you unlock and solve additional questions.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'all games, but as we proceeded, it became clear that we actually had to do
    more than standard usability testing in the lab. One large bias was that in the
    lab setting, people are highly motivated to perform to the best of their ability.
    As a consequence, we were seeing a divergence between the lab testing and what
    we anecdotally observed when watching people in the wild. How could we improve
    the accuracy of our design-driven testing?


    To make our understanding of the players more accurate, we needed to understand
    what they are doing when they started up the game, how they played the game, and
    what happened over a broad population. This is what led to the idea that the studies
    should encompass three different approaches. We needed to not just understand
    the low-level usability issues but also verify that the game was fun to play and
    would leave people with a positive attitude about Google.


    Thus, the goal of our design testing strategy became to observe the players in
    three different ways in order to create a fully rounded picture of what they are
    doing in (and how they are enjoying) the game.


    # ## 9.4 THREE VIEWS OF THE USER: MICRO, MESO, AND MACRO


    After a bit of iteration, we settled on three different analyses of player behavior.
    We wanted to understand the play behavior at a second-to-second timescale. As
    useful as that is for usability issues (e.g., why do players sometimes never click
    on a particular game option), this level of analysis is too detailed for understanding
    user reactions to the game and does not provide any information about their affective
    responses. To provide that kind of information, we ended up doing analyses of
    game play over the period of minutes to hours. And similarly, that level of analysis
    (while useful) would not provide the kind of large population data we also wanted
    to collect and understand—data that would tell us from weeks to months what was
    happening.


    We realized that our three scales of analysis were very similar to Newell''s timescales
    of human behavior (Newell 1994). Newell''s analysis framework has four bands:
    neural (1–10 ms), cognitive (10 ms–10 seconds), rational (minutes to hours), and
    social (days to months). His division of cognitive behaviors along different timescales
    was to emphasize that different kinds of effects can be explained by fundamentally
    different mechanisms. I take a similar approach here.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '+   1. *Microscale* measures the behaviors from milliseconds up to minutes
    of behavior, usually with a small number of people, usually in a lab setting.
    With these studies, we want to gain insight into the mechanics of the game—where
    players look, how they perceive the game elements, and what is left unnoticed
    and unexplored.

    +   2. *Mesoscale* measures the behaviors from minutes to hours. This is the realm
    of field studies, watching people play the game in natural settings (e.g., at
    home or in the coffee shop). The mesoscale provides insights into why people choose
    to play and why they end up stopping their play, as well as understanding about
    what makes the game interesting (or not).

    +   3. *Macroscale* measures the behaviors from days to weeks and months. Typically,
    this involves large numbers of players and is usually an analysis of the logs
    of many people playing the game.


    Logs of user behavior have been a standard practice for some time. Traces of behavior
    have been gathered in psychology studies since the 1930s (Skinner 1938), and with
    the advent of web- and computer-based applications, it became common to capture
    a number of interactions and save them to log files for later analysis. More recently,
    the rise of web-based computing platforms has made it possible to capture human
    interactions with web services on a large scale. Log data let us observe how to
    compare different interfaces for supporting e-mail uptake and sustained use patterns
    (Dumais et al. 2003; Rodden and Leggett 2010).


    Let us look at each of these timescale analysis methods in more detail.


    # ### 9.4.1 Micro Level: How Players Behave over Short Timescales


    Although there are many methods to study human behavior over short periods of
    time, the simplest and most practical method for usability studies is eye tracking
    (also known as *eye gaze*) studies (Bergstrom et al. 2014).


    Eye tracking studies require bringing a subject into the lab to use a special
    monitor that has an eye tracking system built into the bezel of the monitor (there
    are many companies that sell such systems, e.g., Tobii, or Senso Motoric Instruments[SMI]).
    These systems calibrate the player''s eye movements on the monitor and output
    where the eye moves on the screen at time resolutions down to the milliseconds.
    Essentially, they create *X*, *Y*, and *T* data streams (*X* and *Y* positions
    of the gaze focus on the display, where *T* is the amount of time the eye dwells
    on those *X* and *Y* locations), along with any user actions taken (such as a
    click, typing, or scroll event).'
  merge: -1
  img_proc: true
