    # 5.2.2 CloudCoder


    CloudCoder [17] (http://cloudcoder.org/) and CodeWrite [18] (http://code-write.cs.auckland.ac.nz/)
    are two systems closely related to CodingBat. CloudCoder is an open-source web-based
    programming exercise system with exercises in C/C++, Java, Python, and Ruby. CloudCoder
    provides similar mechanisms as CodingBat’s for students to solve problems based
    on the testing results against a predefined set of test cases. However, CodeWrite
    allows a student to construct an exercise problem along with the test cases for
    the problem so that other peer students can solve the exercise problem (in the
    same way as solving an exercise problem in CodingBat or CloudCoder). Note that
    in CodingBat or CloudCoder, only teachers or platform providers (not students)
    are supposed to construct exercises.


    # 5.2.3 Practice-It


    Practice-It (http://practiceit.cs.washington.edu/) is an online platform for students
    to practice solving Java programming problems. Many of the problems were drawn
    from the University of Washington’s introductory programming courses. A student
    can select a problem from the list of problems organized by chapter topics of
    a programming textbook or section topics of the University of Washington’s introductory
    programming courses. Once granted permission by the platform administrators, users
    of the platform can also create and upload a problem. If the problem creator defines
    some constraints for the problem, Practice-It first checks the student’s code
    against such constraints and reports constraint violation errors such as the following:
    Error: Your solution doesn’t meet one or more constraints required by this problem.
    Your solution must use a static method. (must appear 2 times in your solution).
    If the student’s code does not compile, Practice-It reports repairing hints based
    on the compilation errors. After the student’s code compiles, Practice-It runs
    a predefined set'
