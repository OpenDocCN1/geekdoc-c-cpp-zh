- pgno: 50
  md: 'The screening process of relevant articles was carried out in two steps. First,
    the abstracts were checked, and those articles that did not describe use of game
    development to learn or motivate for CS or SE were rejected. Articles rejected
    were typically about game theory or business games, or articles with words such
    as game, learning, and development but focused on something else. The second step
    was to read through the whole text of the remaining articles and exclude those
    that were too vague or outside the scope of the survey. Sixty-six articles relevant
    to game development and CS/SE education were found from the period 2004–2012.
    We noticed that there has been an increase in the number of articles published
    on this topic since the year 2004 up to 2009. Between 2009 and 2012, on average,
    12 articles per year have been published on this topic. Further, out of the 66
    articles, 65% were published by ACM, 26% by IEEE, and the remaining 9% equally
    divided between Springer, Elsevier, and Hindawi. Another interesting fact is that
    59% of the relevant articles were U.S. studies, 24% were European studies, 12%
    were Asian studies, and 5% were international studies, that is, involving studies
    across continents and countries.


    # ### 2.3.1 Answer to RQ1: In What Context/Topics Is Game Development Used in
    CS/SE Education?


    To answer RQ1, we carried out an analysis of the 66 relevant articles. The first
    step of the analysis was to group the articles into the three main categories:
    SE, CS, and applied CS. Articles that ended up in the applied CS category were
    articles where CS was applied (e.g., using computer tools such as Alice or Scratch)
    but the main focus of the course was something else (e.g., art). Of the 66 articles,
    55% of the articles were about game development in CS subjects, 26% in SE subjects,
    and 19% in applied CS subjects. Another interesting finding was that 81% of the
    articles described the use of game development at colleges and universities, 9%
    in high schools, 9% in middle schools, and 1% in an elementary school (one article).


    The second step of the analysis was to identify the specific topics or domains
    where game development was used as a teaching aid. The following subsections describe
    the results from this analysis grouped according to CS, SE, and applied CS.


    # #### 2.3.1.1 CS Topics/Subjects Where Game Development Is Being Used


    Figure 2.2 shows the distribution of topics/subjects found in the articles where
    game development was used to teach CS. The figure clearly illustrates that for
    CS, game development is mainly used to teach programming (77%).'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/8edd7838aa9e4a0d883fcf44f4b667a0_51_0.png)


    FIGURE 2.2  Distribution of topics taught using game development in CS.


    Most of the articles within this category describe how game development was used
    as an introduction to CS and programming. There were few articles that described
    game development used for advanced programming courses. The second largest topic
    was found to be artificial intelligence (AI) (11%). In these articles, students
    were typically asked to program AI for nonplayable characters in a game or create
    or change the AI in a strategy game. Other topics in CS where game development
    has been used are algorithm, parallel computing, data structures, and Boolean
    logic.


    Table 2.1 gives an overview of the articles in which game development was used
    in CS education at a college/university level. The table describes the main topics/subjects
    taught and briefly how game development was used in the course.


    Table 2.1 shows that most articles are about programming courses using game development
    to motivate students. However, there is a great variety in how game development
    is used in different studies. In some studies, game development was only used
    in one or a few student assignments. Other articles describe approaches where
    the whole course was designed around a large game development project. The typical
    games developed in these projects and assignments are simple classical 2D games
    such as *Pacman*, *Bomberman*, or board games.'
  merge: -1
  img_proc: true
