    easier, and a better match with the educational goals. C# is also being used frequently
    due to the XNA GDF.


    The articles in the survey also describe how the GDFs are used as well as the
    experiences from using them. Visual programming in Alice, Scratch, and StarLogo
    TNG works well for introducing programming, learning programming concepts as well
    as object-oriented programming, and promoting CS. Many conclude that visual programming
    is a fun and engaging way of learning logic and sequences. Experiences from using
    Scratch show that visual programming can boost students’ confidence in programming,
    which allows them to explore and improve their skills and knowledge significantly.
    Articles also show that mobile development platforms such as Android SDK or iOS
    SDK engage and motivate students through being able to play their own games on
    their own devices and share them with friends.


    The use of graphic and game libraries or APIs is important to reduce the required
    effort and complexity to develop software that is fun to interact with. In most
    articles in the survey, the students are asked to create simple 2D games from
    ground up. Another approach is to use *game modding*, which means changing or
    modifying the existing code to change the behavior and looks of a game. Some articles
    have proved that game modding in Unreal, Warcraft, and Wu’s Castle works well
    to introduce programming and programming concepts without the need to implement
    the whole game. A motivating factor for doing so is that the game being modified
    can be a highly rated commercial game with impressive graphics and game play.
    Several articles have emphasized the importance of using high-level APIs to accelerate
    the development enabling a stronger focus on learning other things than game development
    such as programming, software architecture, and AI. Finally, in studies from K-12,
    visual programming environments such as Scratch and Alice are most commonly used.
    There are also several studies where visual programming environments are used
    to introduce university students to programming with good results. The main benefit
    for the latter is a better understanding of programming concepts such as sequences
    and how different parts of a program interact.'
