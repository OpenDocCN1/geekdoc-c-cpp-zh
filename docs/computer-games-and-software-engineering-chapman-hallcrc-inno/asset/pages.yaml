    # 10.2 BACKGROUND AND RELATED WORK


    AI in modern computer games focuses upon controlling NPCs such that they exhibit
    behaviors fulfilling that character''s role in the game. This type of AI is referred
    to as *computational behavior*, distinguishing it from classical AI approaches.
    In the context of game development, efficiency and testability are paramount,
    strongly constraining design approaches. The easiest approach is to employ an
    arbitrary code expressed through a custom scripting context [4,5] or a relatively
    simple tree or graph structure, such as a decision tree.


    Industrial research into AI reuse focuses on modularizing code artifacts [6] or
    on modifying an existing AI system [7,8] with incremental improvements rather
    than modularizing and porting behaviors to a fundamentally new context. Our approach
    aims to shed light on this relatively unexplored space, by demonstrating how behaviors
    themselves can be modularized and reused in new game contexts.


    Finite state machines (FSMs) are the oldest and most commonly used formalism to
    model game AIs, wherein states represent behaviors and transitions are triggered
    to change the behavior exhibited [9,10]. Hierarchical FSMs (HFSMs) incorporate
    aspects of statecharts [11] by allowing states to contain substates with internal
    transitions. In the context of reuse, superstates in HFSMs can be treated as modules
    and exported to new AIs [12]. This approach is valuable, but omits important details
    such as code portability and has no provision for interaction with internal states.
    The strict hierarchical nature of HFSMs can be limiting, as they place restrictions
    on how transitions between states can be modeled. This limitation is shared by
    behavior trees [13], which, although they more clearly delineate how the system
    chooses behaviors, are strongly hierarchical, and further suffer from a lack of
    modal states encapsulating different behavioral groupings. Modularizing behavioral
    components is based upon pruning and reusing branches, an idea that has been previously
    explored [14]. In a practical sense, the extent of reuse in behavior trees is
    limited as individual tree nodes are often highly game- or AI-specific—code actions
    and abstract, high-level behavior are intimately entwined in behavior tree models.


    In theory, planning approaches seem ideal for reuse. Goal-oriented action planners,
    popularized by the game F.E.A.R. [15], choose behaviors'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'using a heuristic search through a library of behavior modules with pre- and
    postconditions. In practice, getting the planner to select appropriate behaviors
    requires a proliferation of variables encapsulating the basic knowledge, along
    with considerable tweaking of weights and heuristics. As a result, the modules
    become highly customized to the game context and the general-purpose reuse becomes
    more difficult as a result.


    Behavior trees offer a reuse model based on pruning and reusing branches [14].
    In a practical sense, however, the extent of reuse is limited as individual tree
    nodes are often highly game- or AI-specific—code actions and abstract, high-level
    behavior are intimately entwined in behavior tree models. Although behavior trees
    delineate clearly how the system chooses behaviors, they suffer from a lack of
    modal states encapsulating different behavioral groupings. Reuse, in practice,
    has been demonstrated primarily in terms of modifying an existing AI [7] with
    incremental improvements rather than porting AI logic to a fundamentally new context.


    # 10.2.1 Layered Statechart-Based AI


    Our work adopts the formalism developed by Kienzle et al. [3], who introduce an
    AI based on an abstract layering of statecharts. This approach is inspired by
    the *sense-plan-act architecture* common in robotics. Here, each statechart implements
    a single behavioral concern, such as sensing the game state, memorizing data,
    making high-level decisions, and so on. Due to the clear demarcation of duties,
    the statecharts are ideal for reuse. An AI is built from multiple statecharts,
    each embodying a specific concept, with the exhibited behavior being a function
    of the superposition of states. Importantly, communication can occur at lower
    levels without involving higher levels, meaning the formalism employs a subsumption
    architecture [16]. This allows for improved modularity; higher levels of abstraction
    do not require a full set of knowledge to make decisions, which also reduces crosscutting
    concerns.


    Under this model, the lowest layer contains sensors, which read the game state
    typically through *listeners* or observers that generate events as changes are
    detected. Events are passed up to *analyzers* that interpret and combine sensing
    data to form a coherent picture of the game state. The next layer contains *memorizers*,
    which store the analyzed data and complex state information for later reference.
    The highest layer is the *strategic decider*, most typically a single statechart,
    which reacts to analyzed and memorized data to decide upon a high-level goal.
    Becoming less abstract, the goal triggers a *tactical decider* to determine how
    it will be executed.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '![](img/8edd7838aa9e4a0d883fcf44f4b667a0_239_0.png)


    FIGURE 10.1  A Sample AI statechart governing the pickup behavior.


    The next layer provides *executors* that enact execution decisions, translating
    goals into actions. Depending on the current state of the NPC, certain commands
    can cause conflicts or suboptimal courses of action, which are corrected by *coordinators*.
    The final layer contains *actuators*, which execute actions by modifying the game
    state.


    In Figure 10.1, a sample Pickup Executor statechart is presented. It reacts to
    `pick_up_item_request` events by determining if the item is reachable. The guard
    condition `[this.isTargetReachable()]` only allows the guarded transition to fire
    when the guard evaluates to true. The transition then fires the event to either
    pick up the item or first move to the appropriate location and then pick up the
    item. Statecharts have become of interest relatively recently to the game development
    industry, with initial designs focusing on low-level issues such as efficient
    interpretation within a game context [17].


    # *10.2.1.1 Sample AI for a Squirrel NPC*


    We first introduce an existing AI created in the layered statechart formalism.
    This will help clarify AI structure and provide us with a set of modules available
    for reuse. We describe here a layered statechart-based AI for a squirrel, a simple
    background NPC. For game purposes, a high level of abstraction is sufficient in
    modeling the squirrel behaviors—a detailed simulation would overshoot the mark
    for the typical game AI.'
