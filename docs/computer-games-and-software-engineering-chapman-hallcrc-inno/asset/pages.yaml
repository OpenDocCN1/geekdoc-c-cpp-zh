  md: 'social aspect; games can also be organized in a series of worlds, sectors,
    and levels, which become increasingly challenging. Pex4Fun has been adopted as
    a major platform for assignments in a graduate SE course, and a coding-duel contest
    has recently been held at the ICSE 2011 for engaging conference attendees to solve
    coding duels in a dynamic social contest. The response from the broader community
    using the Pex4Fun system has been positive and enthusiastic, indicating the gamification
    of online programming exercise systems holds great promise as a tool in SE.


    An exploratory study on how human tutors interact with learners playing serious
    games is presented by Barbara Reichart, Damir Ismailović, Dennis Pagano, and Bernd
    Brügge in Chapter 6. In traditional educational settings, a professional human
    tutor observes a student’s skills and uses those observations to select learning
    content, adapting the material as needed. Moving into a serious game educational
    setting, this study investigates how players can be characterized and how to provide
    them with help in this new environment. The study uses four small serious games
    with focus on elementary-school mathematics. The authors created these over a
    span of 2 years; the new games were needed to retain very high control over the
    game elements (content, difficulty level, and game speed), which would not be
    possible with games already available. Interviews with experts and observing children
    at play provided qualitative data for the first part of the study. Here, the results
    reveal that the human tutor observes the correct and incorrect execution of the
    tasks in the game as well as the motorical execution (hand–eye coordination, timing);
    tutors rate the skills of the learners in a fuzzy way. In the second part of the
    study, interviews with experts provided qualitative data; here, experts observed
    the recordings of children playing. The experts defined different levels of difficulty
    that they considered reasonable for each game. To provide the different levels
    of difficulty, a detailed description of the data (content) that can be changed
    in each of the developed serious games was defined. In addition to changes in
    the content, changes to some properties of the game elements are identified to
    affect specific skills. For example, adapting the speed of a game element has
    a direct effect on some skills necessary for mathematics, such as counting. Therefore,
    adapting the game element properties to change the level of difficulty is an option—a
    change in the learning content is not always necessary. Using the results of these
    studies, the authors also propose a definition for the adaptivity process in a
    serious game consisting of four stages: monitoring players (A1), learner characterization
    (A2), assessment generation (B1), and adaptive intervention (B2). This thorough,
    extensive'
