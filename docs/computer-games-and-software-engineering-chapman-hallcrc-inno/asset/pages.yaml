  img_proc: true
- pgno: 174
  md: 'To give the illusion that players can interact with thousands of other players,
    MMOs use interest management techniques [4]. They assume that players are only
    interested in events happening near them in the virtual world. The world is therefore
    partitioned in self-contained regions (e.g., a city or a forest), and each region
    is handled by a different process. Systems implementing space partitioning assume
    that players are interested in events generated in their current region, and maybe
    also in the adjacent regions, but never in the entire world. Using this partitioning
    strategy, MMOs have been able to support hundreds of users while keeping the latency
    relatively low.


    Space partitioning works well until too many players decide to meet in the same
    region. For example, the maximum number of directly interacting users ever achieved
    in a commercial MMO is around 3000 in the game *EVE Online*. This record was achieved
    thanks to very expensive hardware infrastructure, a tiered software architecture,
    and a game design solution called *time dilation*. Time dilation compensates for
    the server load by slowing down the region’s time. Regions may support more players,
    but some have found time dilation “absolutely unplayable.” MMOs that cannot afford
    this kind of infrastructure, architecture, or game design tricks have much lower
    player limits: *World of Warcraft* supports around 120 users per region⁴ and *Second
    Life* up to 100⁵.


    Research has tried to dynamically adapt the shape and size of regions to the distribution
    of players. However, solutions such as dynamic binary space partitioning suffer
    from a high overhead due to synchronization and data handover between regions
    [5]. In fact, the CAP theorem (for Consistency, Availability, and Partitioning)
    states that a partitioned system cannot be both highly available (i.e., responsive)
    and strongly consistent [6,7]. Because a scalable MMO system involves multiple
    partitioned processes, the MMO developer inherently has to trade some consistency
    to stay responsive.


    In the past two decades, the number of MMO players has tremendously increased,
    but so as the number of web users. To scale, web applications follow a very constrained
    architectural style called representational state transfer (REST) [8]. One of
    the pillars supporting REST is the statelessness of the Hypertext Transfer Protocol
    (HTTP) protocol: web servers do'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'not remember any client data between two requests. This way, it is easy to
    scale a web application by adding more machines running the exact same application
    code.


    In this work, we explore how REST could be applied to scale MMOs. Even though
    some game developers doubt that REST could be applied to MMOs [9], the suitability
    of REST for MMOs remains an open question. Moreover, recent web technologies such
    as HTML5 WebSockets or WebGL show serious opportunities for browser-based MMOs.


    Although scalability is our main concern, we keep in mind the trade-off with consistency
    and responsiveness. Other requirements such as fault tolerance (if a machine falls,
    it is at minimal cost for the system) or resilience (recovering quickly from peaks
    or crashes) are desirable, but they are not the main focus of this chapter.


    The contributions of this work are as follows:


    +   - We make a first attempt at conceptually harmonizing REST principles with
    MMOs.

    +   - We develop an architecture (RCAT) and its reference implementation, which
    is based on those principles.

    +   - We report performance characteristics of a prototypical RCAT application
    that allow us to estimate upfront the resources necessary to deploy these applications
    on the cloud given specific concurrency targets.


    In the rest of this chapter, we first cover the current techniques used to scale
    MMOs to large numbers of users. Then we introduce RCAT, our own architecture designed
    to scale large number of users without being bound to a particular type of application.
    We then detail the reference implementation and an application based on this architecture.
    Finally, we report our laboratory experiments, discuss the implications, and conclude
    the chapter.


    # 7.2 OVERVIEW OF TECHNIQUES FOR SCALING UP MULTIUSER GAMES


    A large body of academic literature, and several practical techniques seen in
    the industry, focuses on scalability, consistency, and responsiveness for MMOs.
    These techniques are scattered in various fields of computer science and target
    different parts of the scalability problem. This section revisits some of the
    most well-known techniques for scaling up these systems.'
