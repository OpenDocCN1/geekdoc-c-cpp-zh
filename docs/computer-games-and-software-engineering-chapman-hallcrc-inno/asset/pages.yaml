    # ### 8.2.1 *iTron*


    *iTron* [3] is a real-world “snake” game. Essentially, players must move around
    in the real world; while doing so, they leave a trail of “walls” in the virtual
    world (Figure 8.1). Players must avoid running into walls by moving so that their
    represented position crosses a wall on the display. Figure 8.1 shows real-world
    and virtual-world views of a three-person *iTron* game in progress. One player
    has crashed into the tail of another early on, whereas one is in danger of hitting
    the area boundary. The object is to be the last one remaining after all others
    have crashed. The game is both a strategy game in which one tries to surround
    and cut off one''s opponents from territory and an athletic game involving running
    fast enough and accurately enough to carry out these strategies.


    Note also the player using an inexpensive Kyle Wrist Mount to convert the smart
    phone into a hands-free wearable, a key innovation that reduces risk to the device
    and allows more freedom for the athletic activities of the game.


    This game was played in a relatively small, clear area like a parking lot or football
    field. *iTron* can also be played in larger areas having complex terrain, such
    that climbing and terrain traversal become a significant part of the planning
    and athleticism. This style of *iTron* game is termed *iTron/Parkour*. The final
    state of such a game is shown in Figure 8.2.


