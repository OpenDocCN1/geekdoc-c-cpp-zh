  md: 'can or should a system delve to reconstruct what would have happened had the
    newly discovered information been known earlier? In aggregate, I group all these
    issues under the term the *distributed joint state problem*. Specifically, can
    we come up with a design methodology that allows a coherent creature behavior
    to be implemented on top of a fully distributed architecture subject to sporadic
    communication? The Butterflies game is an initial experiment in RRC and distributed
    joint state management, but there is still room for future research in this area.


    # ### 8.3.3 Coding


    Pursuing our goal of appealing to (and thereby benefiting) as large a cross section
    of the population as possible, we cannot provide our games on merely one brand
    or model of smart phone. Therefore, we must seek abstractions and tool support
    in cross-platform development that not only helps with cross-compilation of source
    code, but can help the developer compensate for differences in hardware performance,
    sensor capabilities, communications systems differences, and operating system
    and language differences.


    Cross-platform code development frameworks such as Cocos2d-x [5] for iOS, Android,
    Windows, and Blackberry smart phones are a promising start in this area.


    # ### 8.3.4 Requirements


    It is clear that not every possible game semantics that is implementable in a
    central server architecture is achievable in a fully distributed outdoor gaming
    context. This is simply because of the sporadic communications problem: if I capture
    a creature at time *t*, but there is no way for your device to hear about this
    for a delay Δ > 0, from your viewpoint, the creature is still available to be
    captured prior to *t* + Δ. If my game requirements included the notion that all
    players shall have a consistent description of which creatures are captured and
    which are not at every instant of time, it would simply not be implementable in
    this architecture. I term this the *(outdoor games) requirements restriction problem*.
    Specifically, we need to develop a domain-specific set of *meta-requirements*
    applicable to outdoor game design. Such meta-requirements would comprise guidelines
    and constraints on requirements models to help developers better understand when
    they are posing impossible or impractical requirements for new games. Prior work
    on tolerating inconsistency [6] would seem relevant here.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'As an example, a hypothetical requirements tool could notice when a requirement
    statement implied global consistency in the joint state at all times, flag this
    as unrealizable, and even suggest replacing it with an RRC-based criterion.


    # ### 8.3.5 Validation


    Testing and formal validation of distributed systems is well known to be difficult;
    however, fully distributed smart phone games exacerbate this difficulty. The requirements
    one is validating are often relative to the distributed joint state of the system,
    so validating means to understand the relaxed semantics of systems designed and
    specified to allow temporary network partitions leading to inconsistent state
    views. For example, two devices disagreeing on who captured a creature due to
    being out of network contact is no longer indicative of a validation failure unless
    the condition remains well after the devices have reestablished network contact.
    How can one express such a notion of correctness and test for it, or formally
    validate compliance with it? I term this the (outdoor games) semantic validation
    problem.


    On a more pragmatic level, tests will often involve many to tens of devices. Simply
    gathering, merging, synchronizing, and cleaning test data in order to even start
    analyzing a run is now quite complex, because it would seem to need a substantial
    tool infrastructure to gather and analyze the data from the devices and the wireless
    medium. The Capture Calculus Toolset (CCT) [7] is one such tool suite that can
    capture, transform, combine, analyze, and animate real-world test data.


    Scale and load testing requires even more devices, seemingly requiring some sophisticated
    tool support or else an army of willing helpers. I term this the (outdoor games)
    pragmatic testing problem. Just maintaining a lab with tens of devices involves
    a lot of charging, app loading, configuring, and tracking of devices. The CCT
    provides combinators for combining and enlarging captured test run data with procedurally
    generated scenarios to increase the scale of the data. This can then be animated,
    analyzed, and simulated. However, one future work problem is a tool capable of
    taking such synthesized large-scale scenarios and actually executing them on real
    devices automatically.


    # ## 8.4 THE GGA


    In my previous work, I have documented my approach to implementing outdoor smart
    phone games. The three games discussed in Section 8.2 are all built using the
    GGA [2]. I recap here its three principles.'
