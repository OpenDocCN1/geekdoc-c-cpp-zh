  md: 'A model-driven SE approach to the development of serious educational games
    (SEGs) is presented in Chapter 3 by Kendra Cooper and Shaun Longstreet. SEGs are
    complex applications; developing new ones has been time consuming and expensive,
    and has required substantial expertise from diverse stakeholders: game developers,
    software developers, educators, and players. To improve the development of SEGs,
    the authors present a model-driven engineering (MDE)-based approach that uniquely
    integrates elements of traditional game design, pedagogical content, and SE. In
    the SE community, MDE is an established approach for systematically developing
    complex applications, where models of the application are created, analyzed (validated/verified),
    and subsequently transformed to lower levels of abstraction.


    The MDE-based approach consists of three main steps to systematically develop
    the SEGs:


    +   - The first step is to create an informal model of the SEG captured as a storyboard
    with preliminary descriptions of the learning objectives, game play, and user
    interface concepts. The learning objectives cover specific topics (e.g., design
    patterns, grade 4 reading) as well as transferable skills (e.g., problem solving,
    analysis, critical thinking). Storyboards are an established, informal approach
    used in diverse creative endeavors to capture the flow of events over time using
    a combination of graphics and text. The SimSYS storyboard is tailored to explicitly
    include the learning objectives for the game.

    +   - The second step is to transform the informal model into a semi-formal, tailored
    unified modeling language (UML) use case model (visual and tabular, template-based
    specification). Here, the preliminary description is refined to organize it into
    acts, scenes, screens, and challenges; each of these has a tabular template to
    assist in the game development. The templates include places for the learning
    objectives; they can be traced from the highest level (game template) down to
    specific challenges. More detailed descriptions of the game play narrative, graphics,
    animation, music and sound effects, and challenge content are defined.

    +   - The third step is to transform the semiformal model into formal, executable
    models in statecharts and extensible markup language (XML). A statechart can undergo
    comprehensive simulation or animation to verify the model’s behavior using existing
    tool support; errors can be identified and corrected in both the statechart model'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'and the semiformal model as needed. XML is the game specification, which can
    be loaded, played, and tested using the SimSYS game play engine; the XML schema
    definition for the game is defined.


    A key feature of the MDE approach is the meta-model foundation, which explicitly
    represents traditional game elements (e.g., narrative, characters), educational
    elements (e.g., learning objectives, learning taxonomy), and their relationships.
    The approach supports the wide adoption across curricula, as domain-specific knowledge
    can be plugged in across multiple disciplines (e.g., science, technology, engineering
    and mathematics [STEM], humanities) and the thorough integration of learning objectives.
    This approach is flexible, as it can be applied in an agile, iterative development
    process by describing a part of the game informally, semi-formally, and formally
    (executable), allowing earlier assessment and feedback on a running (partial)
    game.


    In Chapter 4, Swapneel Sheth, Jonathan Bell, and Gail Kaiser present an experience
    report describing their efforts in using game play motifs, inspired from online
    RPGs, and competitive game tournaments to introduce students to software testing
    and design principles. The authors draw upon the reported success of gamifying
    another topic in SE (formal verification) by proposing a social approach to introduce
    students to software testing using their game-like environment HALO (highly addictive,
    socially optimized) SE. HALO can make the software development process, and in
    particular, the testing process, more fun and social by using themes from popular
    CGs. HALO represents SE tasks as quests; a storyline binds multiple quests together.
    Quests can be individual, requiring a developer to work alone, or in groups, requiring
    a developer to form a team and work collaboratively toward an objective. Social
    rewards in HALO can include titles—prefixes or suffixes of players'' names—and
    levels, both of which showcase players'' successes in the game world. These social
    rewards harness a model, operant conditioning, which rewards players for good
    behavior and encourages repeating good behavior.


    HALO was introduced into the course as an optional part of two assignments and
    as a bonus question in a third assignment. The student evaluations on using HALO
    in their assignments revealed that the approach may be more effective if the HALO
    quests had a stronger alignment with all the students doing well in the assignment,
    not as an optional or bonus question that may only appeal to some of the students.
    The ability to embrace a broader range of students, perhaps by providing some
    adaptability to adjust the level of difficulty based on what the students would
    find it most'
