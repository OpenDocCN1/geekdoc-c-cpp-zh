- pgno: 231
  md: '# 9.5 SUMMARY


    A useful way to look at user behavior is at three different cognitive levels—first,
    the fast/rapid/millisecond level; second, the minute-to-minute behavior; and third,
    the effect of long/slow cognition over days/weeks. Each timescale reveals substantially
    different kinds of information about how the user/player uses, thinks about, and
    responds to the game.


    Examining user behavior across these three levels is as productive for understanding
    applications as it is for games. The same underlying user experience research
    methods apply and can be immensely useful when developing a game.


    The design space for a complex game is huge. User experience research, seen from
    a multiscale perspective, gives insights into what opportunities and issues will
    arise in the game. What is more, looking at insights found at one scale often
    gives insights into behaviors at another.


    In general, a good software engineering practice is to tightly weave together
    not just great software engineering but also great attention to the user experience
    moment to moment as well as play experience over an extended period.


    Great games have these characteristics, performing on all of these levels of design
    simultaneously. They have great visuals; they have great audio; they have great
    backend engineering, interactions, controllers, and stories. Great games go on
    to have multiple editions and last for years. You can see how analyzing the game
    at multiple levels, with attention to different kinds of user interactions, will
    lead to improved design and user enjoyment overall.


