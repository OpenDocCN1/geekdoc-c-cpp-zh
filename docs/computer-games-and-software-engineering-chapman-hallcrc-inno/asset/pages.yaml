- pgno: 203
  md: '# 8.1 MOTIVATION


    Video games are extremely popular in today’s world. People who spend too much
    time with video games, however, are prone to many health and cognitive risks,
    including obesity, poor socialization, and repetitive stress injuries. Children
    are particularly sensitive to these problems and developmental delays as well.
    To combat these problems, our goal in the Geocast Games Project [1] is to build
    attractive games that inherently incorporate vigorous physical activity outdoors
    and encourage multiplayer interactions.


    In pursuance of this goal, if the games we build were to require additional equipment
    that must be bought and brought solely to support the game experience, it could
    harm our ability to reach a broad segment of the population. Moreover, we wish
    to allow as unrestricted an experience outdoors as possible; having to leave one’s
    laptop, for example, unattended in the dirt while running off into a public park,
    has obvious risks and disincentives. Moreover, such supernumerary devices would
    need to be powered and administered, further increasing the burden and reducing
    the constituency for our games.


    Instead, we wish to provide the games solely on equipment people are likely to
    carry anyway for other purposes, namely smart phones, iPods, and so on. In this
    way, people can play spontaneously whenever and wherever a willing group is present.
    More specifically, we want devices that are location aware and capable of 802.11
    wireless communications (or other wireless communications technologies as may
    become available). Richer experiences are possible when devices have other features
    that are becoming prevalent today, such as azimuth sensors, accelerometers, wide
    area wireless (e.g., 4G [4th Generation], LTE [Long Term Evaluation], GSM [Global
    System for Mobility]), cameras, and rich audio capabilities. For this chapter,
    we will term this class smart phones, even though not all of them necessarily
    have telephone capability. The decision to restrict to smart phones has major
    consequences for the architecture and software engineering of the games.


    # 8.2 THREE GEOCAST GAMES


    The GC1 prototype [1,2] is a smart phone application that includes three multiplayer
    outdoor smart phone games. All of these Geocast Games combine real-world action
    and movement with virtual elements implemented in a distributed fashion on smart
    phones. I describe them briefly here to provide context for what follows.'
  merge: -1
  img_proc: true
