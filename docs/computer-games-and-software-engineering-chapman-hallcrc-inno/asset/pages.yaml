  md: 'to the modifications made by the player on the player implementation. The games
    should have a clear winning criterion. There should be no or few opportunities
    for the player to cheat the games (e.g., by adding very complicated code portions
    in the player implementation to pose difficulties for the underlying test generation
    engine).


    # 5.3.3 Social Dynamics in Pex4Fun


    To add more fun to Pex4Fun, we have developed a number of features related to
    social dynamics, making games in Pex4Fun a type of social games. For example,
    Pex4Fun allows a player to learn what coding duels other people were already able
    to win (or not). For a given coding duel opened by a player, the description text
    box above the working area shows some statistics such as the following: Can you
    write code that matches a secret implementation? Other people have already won
    this Duel 322 times! (see Figure 5.1).


    # 5.3.3.1 Ranking of Players and Coding Duels


    Initially, when only a relatively small number of coding duels were provided by
    us in Pex4Fun, we provided a mechanism of earning medals to encourage users to
    play coding duels. After signing in, a user could earn virtual medals for winning
    coding duels. The first medal for winning any five of the coding duels that were
    built into Pex4Fun. The user got the second medal for winning another 20 of the
    built-in coding duels.


    Furthermore, a user can click the Community link on the Pex4Fun main page to see
    how the user’s coding duel skills compare with other users. In the community area
    (http://www.pexforfun.com/Community.aspx), there are two ranked lists of all users
    (one based on the number of points earned by a user and the other one based on
    the number of coding duels won by a user), as well as coding duels that other
    users have published. Figure 5.2 shows the ranked list of all users based on their
    earned points. A user can earn points by winning a coding duel, rating a coding
    duel that the user won, registering in a course, creating a coding duel that somebody
    else attempts to win, creating a coding duel that somebody else wins, and so on.
    Note that a user can rate any coding duel that the user wins as Fun, Boring, or
    Fishy. All ratings are shared with the community.


    # 5.3.3.2 Live Feeds


    A player can click the Live Feed link on the Pex4Fun main page to see what coding
    duels other players are winning (or not) right now (http://www.pexforfun.com/Livefeed.aspx).
    Maybe someone else is trying to win'
