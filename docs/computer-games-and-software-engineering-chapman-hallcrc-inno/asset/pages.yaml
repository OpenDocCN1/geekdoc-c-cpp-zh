  md: 'The proxy communication is performed by Tornado, a nonblocking, single-threaded
    web server supporting WebSockets. The proxy has two URL access points: /client
    and /server. Clients connect to /client, where the client handler component generates
    a session user ID. The game handler then forwards client messages to a game server.
    Servers reply to the clients through the /server URL access point of the proxy.
    Messages sent to /server are treated by the game handler component, which determines
    the clients that should receive the message.


    In the game server, the game logic and mapper components are the game-specific
    modules of the game server. The game logic contains the game rules. The mapper
    provides data services to the game logic through an application programming interface
    (API). Both are plugged into the RCAT''s middleware and interface with components
    from the proxy layer (the proxy connector) and the data layer (the persistence
    manager and the object manager).


    The proxy connector provides two abstractions to the game logic. First, it demultiplexes
    the WebSocket connections from the game server to the proxies into a single one.
    Second, it hides from the game logic the location of proxies and clients. If the
    game logic component wishes to message users, it simply sends the message and
    the set of recipients (i.e., a set of user IDs). The proxy connector parses the
    set, checks which proxies those users are connected to, and forwards the message
    to the appropriate proxies.


    The persistence and object managers abstract away the database-specific protocols
    and the handling of objects in local and remote caches. Each provides an API to
    the mapper. Both are implemented in Python. Any database supported by SQLAlchemy
    can be used, but for our implementation, we only tried MySQL.


    The persistence manager provides a centralized, available, and consistent data
    access through SQLAlchemy,¹ a database object-relational mapper.


    The object manager provides a distributed data access and the tools for managing
    data availability or consistency. The object manager was implemented by us and
    provides an API to (1) manipulate data stored in local or remote caches and (2)
    relocate data stored in remote caches to the local cache.


    ¹ Tornado has been used extensively in real-time web applications such as FriendFeed
    and Facebook''s timeline. See http://www.tornadoweb.org.


    ² See http://www.sqlalchemy.org/.'
