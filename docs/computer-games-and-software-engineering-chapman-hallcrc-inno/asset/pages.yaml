    Computer Science Exam).


    In Spring 2012, the class enrolment was 129, which consisted largely of freshmen
    and sophomores (first- and second-year undergraduates, respectively). The list
    of topics covered was object-oriented design, design patterns, interfaces, graphics
    programming, inheritance and abstract classes, networking, and multithreading
    and synchronization. There were five roughly biweekly assignments, which contained
    both theory and programming, one midterm exam, and one final exam.


    As explained above, HALO uses game elements and motifs from popular games such
    as *World of Warcraft* [8] to make the whole software engineering process and,
    in particular, the software testing process more engaging and social. HALO is
    not a game; it leverages game mechanics and applies them to the software development
    process. We now describe how we used HALO in our class.


    # 4.3.3 A Case Study with HALO


    In this class, we used HALO for three assignments. In the first two cases, HALO
    was not a required part of the assignment; students could optionally use it if
    they wanted to. For the last case, students could earn extra credit (10 points
    for the assignment, accounting for 0.8% of the overall course grade) by completing
    the HALO quests.


    The final course assignment allowed students to design their own projects, making
    it difficult for us to predefine HALO quests, because each project was different.
    Instead, students were offered extra credit in exchange for creating HALO quests
    for their projects, thus emphasizing the *learning by example* pedagogy. Out of
    the 124 students who submitted Assignment 5, 77 students (62.1%) attempted the
    extra credit, and 71 out of these 77 students (92.21%) got a perfect score for
    the HALO quests that they had created.


