    # ## 1.5 INTRODUCING THE CHAPTERS AND RESEARCH CONTRIBUTIONS


    A comprehensive literature review of CG in software education is presented in
    Chapter 2 by Alf Inge Wang and Bian Wu. They explore how CG development is being
    integrated into computer science and SE coursework. The survey is organized around
    three research questions:


    +   - The first question focuses on discovering the topics where game development
    has been used as a teaching method. These results are presented in three categories:
    computer science (37 articles), SE (16 articles), and applied computer science
    (13 articles). For computer science, a variety of topics (e.g., programming, AI,
    algorithms) are being taught at different levels (university and elementary, middle,
    and high school). Game development approaches in university courses on programming
    dominate the findings, followed by AI. For SE, a variety of topics (e.g., architecture,
    object-oriented analysis and design, and testing) are being taught in university
    courses. Game development approaches in design topics (architecture and'
