  md: 'of test cases (prepared by the problem creator) against the student''s code.
    Then Practice-It reports a table that includes testing information for each test
    case: the test input, expected output, actual output (produced by the student''s
    code), and result (pass or fail). When the expected output is different from the
    actual output, the result is fail; the different outcomes of the actual output
    and the expected output are also reported.


    # ### 5.2.4 CodeLab


    *CodeLab* (http://www.turingscraft.com/), providing paid access of full exercises
    to students, is a web-based programming exercise system with exercises in Python,
    Java, C++, C, JavaScript, C#, VB, and SQL. CodeLab provides short exercises, each
    of which typically focuses on a programming concept or language construct. Different
    from other related systems, CodeLab does not report any explicit test cases (i.e.,
    input/output pairs) to a student after the student submits code for a given exercise
    problem. Instead, CodeLab informs the student whether his or her submitted code
    is correct (the correctness judgment of the code seems to be based on running
    a predefined set of test cases, without considering code elegance or efficiency).
    If incorrect, CodeLab additionally informs the student of repairing hints such
    as likely locations of faulty code portions and hint sentences, for example, “You
    almost certainly should be using: ].” These repairing hints seem to be identified
    based on syntactic comparison of the submitted code and the solution code. CodeLab
    provides no feedback to the student in terms of specific correct (or incorrect)
    input/output behaviors of the submitted code. CodeLab organizes exercises in a
    sequence related to a programming concept or language construct (typically 3–10
    exercises in a sequence). The exercises included in a sequence are of gradually
    increasing sophistication. The teacher of a class is suggested to allocate 5%–10%
    of a student''s class grade to be correct completion of the CodeLab exercises.
    Besides leveraging the existing exercises in CodeLab, a teacher can create additional
    exercises in CodeLab for his or her class to use.


    # ### 5.2.5 Codecademy


    *Codecademy* (http://www.codecademy.com/) is an online interactive platform that
    offers free programming classes in Python, PHP, jQuery, JavaScript, Ruby, HTML,
    and CSS. In a browser, on the left-hand side, a student is provided short texts
    that illustrate a programming knowledge point and instructions for the student
    to carry out a related programming exercise in the online code editor displayed
    in the middle of the browser.'
