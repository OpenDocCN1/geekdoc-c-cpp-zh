- pgno: 153
  md: 'games ideal learning environments as the learning experience becomes so intrinsically
    satisfying and rewarding that external pressures or rewards for learning are of
    secondary importance. Even though games have such motivational power, several
    studies have shown that there are no known forms of education as effective as
    a professional human tutor, because tutors select learning content based on the
    learners’ skills, thus adapting to the learner every step along the way. This
    chapter explores the interaction between human tutors and learners in serious-game
    development with the focus on social development theory. It presents results that
    show how human tutors observe players in executing learning tasks and interacting
    with the game environment in serious games. Based on the results of these studies,
    we provide a definition of adaptivity for serious games.


    # 6.1 INTRODUCTION


    Serious games can engage the learner in a way most traditional teaching methods
    cannot. They provide a platform where the two points, motivation and interactive
    learning, can be perfectly put together.


    This chapter describes studies that explore the effects of human tutors in serious
    games. Observations by developing serious games showed that without help, children
    require more time to learn how to play the game than adults, although both groups
    could reach the same time with help [1]. Learning theories such as Vygotsky’s
    social development theory [2], Piaget’s stages of cognitive development [3], and
    Erikson’s developmental stages [4] explain this phenomenon based on the social
    context of learners during the learning process.


    The reason why learning progresses faster with human tutors than with other tools
    is the higher *adaptivity* to the learner. The problem is that serious games of
    the current state of the art do not adapt to the learner [5–8]. Consequently,
    a major goal in modern serious-game development and research is to make the game
    adapt to the learner and provide intelligent actions in order to achieve higher
    individuality [1,9].


    Although one could argue that techniques to realize adaptivity have already been
    developed for e-learning systems, the *intelligent tutoring systems* (ITSs) usually
    foster very different activities than those seen in a game. The aim of this chapter
    is therefore, to explore the ways of adaptivity that are specific to serious games
    and to build a foundation for software frameworks for adaptivity in serious games.


    The contribution of this chapter is twofold. First, we provide two studies that
    explore the role of human tutors in serious games. Second, based on the'
