- pgno: 246
  md: '# 10.4.1 Event Renaming


    For event-based connections, modules communicate by pairing an input event and
    an output event. Under a broadcast model, event renaming allows connections to
    be formed by renaming the output event, so that it matches the input event (or
    vice versa). Mechanically, this means modifying the source of the statechart to
    use the new event names.


    To ensure correctness, existing connections should be respected. If a new module
    uses event names that are already present in the new system, and no connection
    is intended, then events in the new module should be renamed to prevent the formation
    of unintended connections.


    As a rule, private events are not appropriate for use in forming connections.
    By definition, a private event is used internally by a statechart, and encapsulation
    implies that the event should be invisible to the rest of the system. Generation
    of the event may depend on the internal logic of the statechart in a nonobvious
    fashion, meaning that the generation of the private event by another statechart
    may break that internal logic.


    Technically speaking, the consumption of a private event by another statechart
    cannot break the internal logic. Because this breaks notions of encapsulation,
    such a connection would complicate future reuse and modification. However, it
    could be the case that an event intended as output merely happens to be consumed
    by an orthogonal region in the same statechart. Here, the designer should classify
    that event as output, so that it is clear that the event can indeed be used as
    a connection point.


    In the special case where multiple statecharts are connected using the same event,
    renaming may create unintended connections. Consider Figure 10.6, where a statechart
    A outputs event α that is received by


    ![](img/8edd7838aa9e4a0d883fcf44f4b667a0_246_0.png)


    FIGURE 10.6  Reuse scenario with unintended connections.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'statechart B. New statecharts C and D are added to AI with a preexisting communication
    that also uses α. Because broadcast communication is name based, A will connect
    to D and C will connect to B on the event α. If these new connections are not
    intended, then renaming could be applied, by modifying C and D to communicate
    on β instead of α, for instance.


    Renaming can break the existing connections and can fail entirely in certain corner
    cases. Continuing our example in Figure 10.6, imagine only one of the two cross
    connections is desired. For example, A should connect to D on α but C should not
    connect to B. If C outputs β, breaking the connection to B, then D will also lose
    connection. Renaming the input in D would break the intended connection to A.
    There is no broadcasting renaming solution in this scenario. As a rule, multiple
    statecharts cannot connect to different subsets of receivers using the same event.
    Renaming is unable to resolve this. Such situations should be avoided.


    As an alternative to broadcasting with event renaming, narrowcasting can be employed.
    This means that each event generation specifies target statecharts, and only the
    targets receive the event. Although this would resolve the event-renaming corner
    cases, it adds additional complexity at the design level by forcing developers
    to specify targets for each transition. Reuse of a module would force the respecification
    of all event targets to match the modules in the new AI. In our experience, corner
    cases are quite rare and easily avoided during design, and thus do not justify
    the extra effort required to model event targets. Broadcast communication is more
    appropriate in the context of AI module reuse.


    # 10.4.2 Associated-Class Connection


    Integration relating to the associated class is less forgiving, as an unsatisfied
    import or synchronous method call will prevent compilation or cause run-time errors.
    In the case of unsatisfied method calls, either the target AI module must be included
    or the associated class must be modified to point to a new implementing module.


    In general, synchronous calls are more restrictive than event passing, and limiting
    the number of synchronous calls simplifies integration. Event passing occurs at
    the modeling level and is easily addressed there using renaming. The following
    guideline helps to clarify when each approach should be used: when a module receives
    an event and takes action immediately, that event should include relevant information
    as payload. When a module needs complex and dynamic state information'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'at some undetermined point in the future, then a synchronous call is appropriate.


    Module reuse across different games is constrained by imports and implementation
    language. The simplest case is when an AI module is purely behavior driven and
    has no imports (aside from core libraries supplied with the language). Such modules
    are *game agnostic* and may be freely moved between games. If a module has noncore
    imports, then reuse in a new game will require updating all imports, copying libraries,
    and other more drastic rewrites. This may not always be trivial or possible, and
    thus designing for reuse implies that modules be made game agnostic whenever possible.
    The process is much more complicated if the target game is coded in a different
    programming language. In that case, only the statechart could be reused, whereas
    the associated class would require a total rewrite.


    # 10.4.3 Functional Groups


    Reuse of AI modules allows for behavioral aspects of an AI to be exported, but
    the typical module is too fine-grained to fully capture a higher level behavior.
    For example, a fleeing behavior would encompass spotting enemies with a sensor,
    analyzing threat, deciding on a fleeing tactic, and moving using an actuator.
    These modules are connected, and through their cooperative actions, realize a
    behavioral goal.


    To allow the reuse of module connections, and provide a way to modularize high-level
    behaviors, we introduce *functional groups*. A functional group comprises at least
    two AI modules that are connected either by an input-output event pairing or through
    synchronous calls.


    A functional group interface can be built from the AI module interfaces of the
    contained modules. Input events that pair with output events can be reclassified
    as private to protect logic internal to the group. Unpaired events are copied
    to the new interface without change and act as the connection points when the
    group is reused. Synchronous calls, parameters, and game calls can all be added
    to the group interface. The end result is that member interfaces are subsumed,
    giving a single interface for the functional group.


    Importantly, the resulting interface is identical in form to the interface for
    individual modules, and thus can be used interchangeably. Thus, a functional group
    interface is simply a special case of an AI module interface, and wherever an
    AI module can be reused, a functional group could instead be employed.'
  merge: -1
  img_proc: true
