  md: 'are represented in XML using two kinds of tags to define lists of topics (`<domainKnowledgeList>`,
    `<transferableKnowledgeList>`). The next tags define the assessment approach for
    the question, How is the knowledge being assessed? The question with four answer
    options—evaluation, hints, rewards, and feedback—follow in the XML file. Although
    the file is quite long, it is straightforward to read; the manual mapping from
    the semiformal tabular model to the XML is time consuming, but not too difficult.


    # ## 3.4 CONCLUSIONS AND FUTURE WORK


    The SimSYS approach to engineering SEGs is an iterative, three-step approach that
    is model based and integrates learning objectives from the earliest stages in
    the game development. The approach begins with an informal narrative, like a storyboard,
    which is subsequently transformed into a tailored semiformal UML use case model
    (with visual and tabular specifications) and finally into formal models. Our first
    formal model uses XML; the XML is the game specification that can be loaded and
    tested in the SimSYS Game Play Engine. In applying the three-step approach to
    engineering a collection of test games, we have found it to be straightforward,
    but labor intensive. In particular, the formal XML model required a significant
    amount of time to create; manually testing the games was also time consuming.


    An Intelligent Automated Game Generation module is currently under investigation
    to alleviate the effort in populating the informal narrative and semiformal models
    (template instantiation) and automatically generate the XML models. We also plan
    to explore the transformation of the semiformal model into a statechart representation
    that can be loaded, animated, or simulated with the existing commercial tool support
    (e.g. IBM 2012), providing a complementary verification approach.


    We recognize that the validation of the approach is limited to our preliminary
    prototyping work (symbolic test games, software engineering test games). Additional
    validation is needed, both by continuing our own project and by external educational
    game researchers and educators to explore issues such as the scalability of the
    approach to larger games and collections of related games.'
