  img_proc: true
- pgno: 214
  md: "+   1. *Fully distributed architecture*: This is motivated by the reasons given\
    \ above. All games shall be designed without central controller running only on\
    \ the devices worn or carried by players.\n+   \n+   2. *Geographic communications*:\
    \ The GGA defines that communications among devices will use scalable geographic\
    \ addressing framework (SGAF) [8], with the *Scalable Ad Hoc Geocast Protocol\
    \ (SAGP)* [9] used, where applicable, within the ad hoc field communications tier.\
    \ SAGP is *ad hoc*, in that it propagates from peer device to peer, not requiring\
    \ base stations or infrastructure support. It is a geographic addressing protocol,\
    \ meaning that the application addresses network messages *geographically*, by\
    \ the area of space to which they should be transferred, rather than by device\
    \ identifier, IP address, cell phone number, or anything else. This allows it\
    \ to avoid the scalability and robustness pitfalls of traditional IP networking.\
    \ It is scalable in the sense that its overhead is low and does not increase dramatically\
    \ with device density in an area. This allows game playing in crowded venues as\
    \ well as outdoor venues.\n+   \n+   3. *Optional long-range extension*: If devices\
    \ do have access to infrastructure networks, such as wide area networking such\
    \ as 4G/LTE/GSM service, geographically addressed communications can exploit this\
    \ via the *Tiered Geocast Protocol* [10], the long-range framework part of SGAF,\
    \ to allow long-range communications efficiently. For example, it allows iTESS\
    \ play between people on opposite coasts, a scenario that has been enacted on\
    \ multiple occasions.\n\n# ### 8.4.1 Variants\n\nThe above definition is a bit\
    \ of an idealization in that there can be situations where one needs or desires\
    \ to alter the GGA somewhat to accommodate restrictions or changed requirements.\
    \ For example, one may wish to incorporate devices that do not have a compatible\
    \ 802.11 (WiFi) capability; such could be incorporated as a separate, non-*ad\
    \ hoc* tier within the SGAF. Similarly, one may wish to interface to low-cost\
    \ networked sensors that do not have their own location sensing capabilities or\
    \ may have low memory or CPU resources. In such cases, we may compromise the ideal\
    \ of *full* distribution and allow some devices to offload computation, sensing,\
    \ and/or storage to other devices.\n\nExtensive testing and trial experience (over\
    \ 175 users have played at least one of the three geocast games) show that the\
    \ GGA-based games meet our goals"
