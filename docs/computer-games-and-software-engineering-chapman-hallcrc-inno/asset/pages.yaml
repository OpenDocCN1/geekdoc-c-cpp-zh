  md: 'The challenges in developing multiplayer outdoor smart phone games are presented
    in five core areas of SE (requirements, architecture, design, implementation,
    and testing) by Robert Hall in Chapter 8. The games, part of the Geocast Games
    Project, incorporate vigorous physical activity outdoors and encourage multiplayer
    interactions, contributing to worthwhile social goals. Given the outdoor environment
    these games are played in, such as parks or beaches, the games need to be deployed
    solely on equipment people are likely to carry anyway for other purposes, namely,
    smart phones and iPods, and they need to rely on device-to-device communication,
    as network access may not be available. These two characteristics have profound
    impacts on SE activities. One challenge in the requirements engineering area is
    the definition of domain-specific set of meta-requirements applicable to outdoor
    game design, providing domain-specific guidelines and constraints on requirements
    models to help developers better understand when they are posing impossible or
    impractical requirements for new games. The architectural challenges include defining
    solutions that support full distribution (no central server) and long-range play
    (seamless integration with networks when they are available). The design challenges
    include the need to allow coherent game behavior to be implemented at the top
    of a fully distributed architecture, subject to sporadic device communication.
    A collection of design issues falls under this distributed joint state problem:
    when devices have been out of communication, they need to resynchronize in a rapid
    and fair way when they reestablish a connection. The implementation challenges
    include the need to run the games on a broad range of smart phone brands and models;
    cross-platform code development frameworks are needed to provide cross-compilation
    of source code and help the developer compensate for differences in hardware performance,
    sensor capabilities, communications systems, operating system, and programming
    languages. Testing challenges include validating requirements relative to the
    distributed joint state of the system, which allows temporary network partitions
    that lead to inconsistent state views and the need to involve many to tens of
    different devices.


    The author has implemented three multiplayer games promoting outdoor activity
    and social interactions; these have allowed experimentation with the concepts
    and provided initial trials of a Geocast Games Architecture and rapid reengineering
    design.


    Multilevel data analytic studies are used to support user experience assessments
    during the development of a serious game, *AGoogleADay.com*, by Daniel Russell
    in Chapter 9. The game is a *trivia* question-style game'
