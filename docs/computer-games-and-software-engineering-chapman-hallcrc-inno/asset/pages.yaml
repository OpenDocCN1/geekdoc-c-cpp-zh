- pgno: 17
  md: 'induce fun or hedonic experiences (Fullerton et al, 2004; Meigs 2003; Rogers
    2010; Salen and Zimmerman 2004; Schell 2008). This points to another gap, as many
    students interested in making CG choose to focus their attention toward a playful
    user experience, while ignoring whether SE can help produce better quality CG
    at lower costs with greater productivity. That is part of the challenge that motivates
    new research and practice in CGSE.


    # ### 1.3 TOPICS IN COMPUTER GAMES AND SOFTWARE ENGINEERING


    This book collects 11 chapters that systematically explore the CGSE space. The
    chapters that follow draw attention to topics such as CG and SE education (SEE),
    game software requirements engineering, game software architecture and design
    approaches, game software testing and usability assessment, game development frameworks
    and reusability techniques, and game scalability infrastructure, including support
    for mobile devices and web-based services. Here, a sample of earlier research
    efforts in CGSE that help inform these contemporary studies is presented in the
    following subsections.


    # #### 1.3.1 Computer Games and SEE


    Swartout and van Lent (2003) were among the earliest to recognize the potential
    of bringing CG and game-based virtual worlds into mainstream computer science
    education and system development expertise. Zyda (2006) followed by further bringing
    attention to the challenge of how best to educate a new generation of CG developers.
    He observes something of a conflict between programs that stress CG as interactive
    media created by artists and storytellers (therefore somewhat analogous to feature
    film production) and programs that would stress the expertise in computer science
    required of game software developers or infrastructural systems engineers. These
    pioneers in computer science research recognized the practical utility of CG beyond
    entertainment that could be marshaled and directed to support serious game development
    for training and educational applications. However, for both of these visions
    for undergraduate computer science education, SE has little role to play in their
    respective framings. In contrast, SE faculty who teach project-oriented SE courses
    increasingly have sought to better motivate and engage students through game software
    development projects, as most computer science students worldwide are literate
    in CG and game play. Building from this insight, Oh Navarro and van der Hoek (2005,
    2009), the Claypools (Claypool and'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Claypool 2005), and Wang and students (Wang 2011; Wang et al. 2008) were among
    the earliest to call out the opportunity for focusing on the incorporation of
    CG deep into SEE coursework.


    Oh Navarro and van der Hoek started in the late 1990s exploring the innovative
    idea of teaching SE project dynamics through a simulation-based SE RPG, called
    *SimSE*. Such a game spans the worlds of software process modeling and simulation,
    team-based SE, and SE project management, so that students can play, study, and
    manipulate different SE tasking scenarios along with simulated encounters with
    common problems in SE projects (e.g., developers falling behind schedule, thus
    disrupting development plans and inter-role coordination). In this way, SE students
    could play the game before they undertook the software development project, and
    thus be better informed about some of the challenges of working together as a
    team, rather than just as skilled individual software engineers.


    The Claypools highlight how SE project or capstone courses can focus on student
    teams conducting game development projects, which seek to demonstrate their skill
    in SE, as well as their frequent enthusiastic interest in CG culture and technology.
    The popularity of encouraging game development projects for SE capstone project
    courses is now widespread. However, the tension between CG design proffered in
    texts that mostly ignore modern SE principles and practices (Fullerton et al.
    2004; Meigs 2003; Rogers 2010; Salen and Zimmerman 2004; Schell 2008) may sometimes
    lead to projects that produce interesting, playful games but do so with minimal
    demonstration of SE skill or expertise.


    Wang et al. (2008) have demonstrated how other CG and game play experiences can
    be introduced into computer science or SEE coursework through gamifying course
    lectures that facilitate faculty–student interactions and feedback. Wang (2011)
    along with Cooper and Linstroth (2012) (and in Chapter 3) expand their visions
    for SEE by incorporating contemporary SE practices such as software architecture
    and model-driven development. More broadly, Chapters 2 through 6 all discuss different
    ways and means for advancing SEE through CG.


    Finally, readers who teach SEE project courses would find it valuable to have
    their students learn CGSE through their exposure to the history of CG software
    development, including a review of some of the pioneering papers or reports cited
    earlier in this introductory chapter. Similarly, whether to structure the SEE
    coursework projects as massively open online courses or around competitive, inter-team
    game jams also merits consideration. Such competitions can serve as test beds
    for empirical'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'SE (or SEE) studies, for example, when project teams are composed by students
    who take on different development roles and each team engages members with comparable
    roles and prior experience. Such ideas are discussed in Chapter 12.


    # ### 1.3.2 Game Software Requirements Engineering


    Understanding how best to elicit and engineer the requirements for CG is unsurprisingly
    a fertile area for CGSE research and practice (Ampatzoglou and Stamelos 2010;
    Callele et al. 2005), much like it has been for main-stream SE. However, there
    are still relatively few game development approaches that employ SE requirements
    development methods such as use cases and scenario-based design (Walker 2003).


    Many game developers in industry have reviewed the informal game “postmortems”
    that first began to be published in Game Developer magazine in the 1990s (Grossman
    2003), and more recently on the Gamastura.com online portal. Grossman’s (2003)
    collection of nearly 50 postmortems best reveals common problems that recur in
    game development projects, which cluster around project software and content development
    scheduling, budget shifts (generally development budget cuts), and other non-functional
    requirements that drift or shift in importance during game development projects
    (Alspaugh and Scacchi 2013; Petrillo et al. 2009). None of this should be surprising
    to experienced SE practitioners or project managers, though it may be “new knowledge”
    to SE students and new self-taught game developers. Similarly, software functional
    requirements for CG most often come from the game producers or developers, rather
    than from end users. However, nonfunctional requirements (e.g., the game should
    be fun to play but hard to master and it should be compatible with mobile devices
    and the web) dominate CG development efforts, and thus marginalize the systematic
    engineering of functional game requirements. Nonetheless, the practice of openly
    publishing and sharing postproject descriptions and hindsight rationalizations
    may prove valuable as another kind of empirical SE data for further study, as
    well as something to teach and practice within SEE project courses.


    # ### 1.3.3 Game Software Architecture Design


    CGs as complex software applications often represent configurations of multiple
    software components, libraries, and network services. As such, CG software must
    have an architecture, and ideally such an architecture is explicitly represented
    and documented as such. Although such'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'architecture may be proprietary and thus protected by its developers as intellectual
    property covered by trade secrets and end-user license agreements, there is substantial
    educational value in having access to such architectural renderings as a means
    for quickly grasping key system design decisions and participating modules in
    game play event processing. This is one reason for interest in games that are
    open to modding (Seif El-Nasr and Smith 2006; Scacchi 2010). However, other software
    architecture concerns exist. For instance, there are at least four kinds of CG
    software architecture that arise in networked multiplayer games: (1) the static
    and dynamic run-time architectures for a game engine; (2) the architecture of
    the game development frameworks or SDKs that embed a game''s development architecture
    together with its game engine (Wang 2011); (3) the architectural distribution
    of software functionality and data processing services for networked multiplayer
    games; and (4) the informational and geographical architecture of the game levels
    as designed play spaces. For example, for (3) there are four common alternative
    system configurations: single server for multiple interacting or turn-taking players,
    peer-to-peer networking, client-server networking for end-user clients and playspace
    data exchange servers, and distributed, replicated servers for segmented user
    community play sessions (via sharding) (Alexander 2003; Bartle 1990; Berglund
    and Cheriton 1985; Bishop et al. 1998; Gautier and Dior 1998; Hall 1992; Sweeney
    1998).


    In contrast, the focus on CG as interactive media often seems little or no software
    architecture as being relevant to game design, especially for games that assume
    a single server architecture or PC game run-time environment, or in a distributed
    environment that networking system specialists, it is assumed, will design and
    provide (Fullerton et al. 2004; Meigs 2003; Rogers 2010; Salen and Zimmerman 2004;
    Schell 2008). Ultimately, our point is not to focus on the gap between game design
    and game software (architecture) design as alternative views but to draw attention
    to the need for CGSE to find ways to span the gap.


    # #### 1.3.4 Game Software Playtesting and User Experience


    CGs as complex software applications for potentially millions of end users will
    consistently and routinely manifest bugs (Lewis 2010). Again, this is part of
    the puzzle of any complex SE effort, so games are no exception. However, as user
    experience and thus user satisfaction may be key to driving viral social media
    that helps promote retail game sales and adoption, paying close attention to bugs
    and features in CG development and'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'usability (Pinelle et al. 2008) may be key to the economic viability of a game
    development studio. Further, on the basis of decades of experience in developing
    large-scale software applications, we believe that most end users cannot articulate
    their needs or requirements in advance but can assess what is provided in terms
    of whether or not it meets their needs. This in turn may drive the development
    of large-scale, high-cost CGs that take calendars to produce and person-decades
    (or person-centuries) of developer effort away from monolithic product development
    life cycles to ones that are much more incremental and driven by user feedback
    based on progressively refined or enhanced game version (or prototype) releases.
    Early and ongoing game playtesting will likely come to be a central facet of CGSE,
    as will tools and techniques for collecting, analyzing, and visualizing game playtesting
    data (Drachen and Canossa 2009; Zoeller 2013). This is one activity where CGSE
    efforts going forward may substantially diverge from early CG software development
    approaches, much like agile methods often displace *waterfall* software life cycle
    development approaches. Therefore, CG developers, much like mainstream software
    engineers, are moving toward incremental development, rapid release, and user
    playtesting to drive new product release versions.


    # ### 1.3.5 Game Software Reuse


    Systematic software reuse could be considered within multiple SE activities (requirements,
    architecture, design, code, build and release, test cases) for a single game or
    a product line of games (Furtado et al. 2011). For example, many successful CGs
    are made into *franchise brands* through the production and release of extension
    packs (that provide new game content or play levels) or product line sequels (e.g.,
    *Quake*, *Quake II*, and *Quake III*; *Unreal*, *Unreal Tournament 2003*, and
    *Unreal Tournament 2007*). Whether or how the concepts and methods of software
    product lines can be employed in widespread CG business models is unclear and
    underexplored. A new successful CG product may have been developed and released
    in ways that sought to minimize software production costs, thus avoiding the necessary
    investment to make the software architecture reusable and extensible and the component
    modules replaceable or upgradable without discarding much of the software developed
    up to that point. This means that SE approaches to CG product lines may be recognized
    in hindsight as missed opportunities, at least for a given game franchise.


    Reuse has the potential to reduce CG development costs and improve quality and
    productivity, as it often does in mainstream SE. Commercial'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'CG development relies often on software components (e.g., game engines) or
    middleware products provided by third parties (AI libraries for non-player characters
    [NPCs]) as perhaps its most visible form of software reuse practice. Game SDKs,
    game engines, procedural game content generation tools, and game middleware services
    all undergo active R&D within industry and academia. Game engines are perhaps
    the best success story for CG software reuse, but it is often the case that commercial
    game development studios and independent game developers avoid adoption of such
    game engines when they are perceived to overly constrain game development patterns
    or choice of game play mechanics to those characteristic of the engine. This means
    that game players may recognize such games as offering derivative play experience
    rather than original play experience. However, moving to catalogs of pattern or
    antipatterns for game requirements, architecture and design patterns for game
    software product lines (Furtado et al. 2011), and online repositories of reusable
    game assets organized by standardized ontologies may be part of the future of
    reusable game development techniques. As noted earlier, such topics are explored
    in Chapters 10 and 11.


    Other approaches to software reuse may be found in free or open source software
    for CG development (Scacchi 2004), and also in AI or computational intelligence
    methods for semiautomated or automated content generation and level design (IEEE
    2014).


    # 1.3.6 Game Services and Scalability Infrastructure


    CGs range from small-scale, stand-alone applications for smart phones (e.g., app
    games) to large-scale, distributed, real-time MMOGs. CGs are sometimes played
    by millions of end users, so that large-scale, big data approaches to game play
    analytics and data visualization become essential techniques for engineering sustained
    game play and deployment support (Drachen and Canossa 2009; Zoeller 2013). Prior
    knowledge of the development of multiplayer game software systems and networking
    services (cf. Alexander 2003; Berglund and Cheriton 1985; Gautier and Dior 1998;
    Sweeney 1998) may be essential for CGSE students focusing on development of social
    or mobile MMOGs. In order to engage the users and promote the adoption and ongoing
    use of such large and upward or downward scalable applications, CGSE techniques
    have significant potential but require further articulation and refinement. Questions
    on the integration of game playtesting and end-user play analytic techniques together
    with large-scale, big-data applications are just beginning to emerge. Similarly,
    how best to design back-end game data management capabilities or'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'remote middleware game play services also points to SE challenges for networked
    software systems engineering, as has been recognized within the history of networked
    game software development (Alexander 2003, Bartle 1990, Berglund and Cheriton
    1985; Gautier and Dior 1998; Sweeney 1998). Whether or how cloud services or cloud-based
    gaming has a role in CGSE may benefit by review of the chapters that follow.


    The ongoing emphasis on CGs that realize playful, fun, social, or learning game
    experiences across different game play platforms leads naturally to interdisciplinary
    approaches to CGSE, where psychologists, sociologists, anthropologists, and economists
    could provide expertise on defining new game play requirements and experimental
    designs to assess the quality of user play experiences. Further, the emergence
    of online fantasy sports, along with eSports (e.g., team/player vs. team/player
    competitions for prizes or championship rankings) and commercial endeavors such
    as the National Gaming League for professional-level game play tournaments, points
    to other CGSE challenges such as cheat prevention, latency equalization, statistical
    scoring systems, complex data analytics (DsC09), and play data visualizations
    (Zoeller 2013), all of which support game systems that are balanced and perform
    (monitoring) equalized for professional-level tournaments. The social sciences
    could provide insight into how to attract, engage, and retain players across demographic
    groups (e.g., age, gender, geographic location), much like recent advances in
    the Cooperative and Human Aspects in Software Engineering workshop and ethnographic
    studies of users in contemporary SE research.


    With this background in mind, we turn to explain the motivating events that gave
    rise to the production of this book on CGSE.


    # 1.4 EMERGENCE OF A COMMUNITY OF INTEREST IN CGSE


    At the core of CGs are complex human-software platform interactions leading to
    emergent game play behaviors. This complexity creates difficulties architecting
    game software components, predicting their behaviors, and testing the results.
    SE has not yet been able to meet the demands of the CG software development industry,
    an industry that works at the forefront of technology and creativity, where creating
    a fun experience is the most important metric of success. In recognition of this
    gap, the first games and software engineering workshop (GAS 2011) was held at
    the International Conference on Software Engineering (ICSE 2011), initiated through
    the efforts of Chris Lewis and E. James Whitehead (both from UC Santa Cruz). Together
    with a committee of like-minded others'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'within the SE community, Lewis and Whitehead sought to bring together SE researchers
    interested in exploring the demands of game creation and ascertain how the SE
    community can contribute to this important creative domain. GAS 2011 participants
    were also challenged to investigate how games can help aid the SE process or improve
    SEE. Research in these areas have been exciting and interesting, and GAS 2011
    was envisioned to be the first time practitioners from these fields would have
    the opportunity to come together at ICSE to investigate the possibilities of this
    innovative research area. The content of Chapters 4 and 8 was originally presented
    at GAS 2011, in simpler form.


    The GAS 2012 workshop explored issues that crosscut the SE and the game engineering
    communities. Advances in game engineering techniques can be adopted by the SE
    community to develop more engaging applications across diverse domains: education,
    health care, fitness, sustainable activities (e.g., recycling awareness), and
    so on. Successful CGs feature properties that are not always found in traditional
    software: they are highly engaging, they are playful, and they can be fun to play
    for extended periods of time. Engaging games enthrall players and result in users
    willing to spend increasing amounts of time and money playing them. ICSE 2012
    sought to provide a forum for advances in SE for developing more sustainable (*greener*)
    software, so GAS 2012 encouraged presentation and discussion of ways and means
    through green game applications. For example, approaches that support adapting
    software to trade off power consumption and video quality would benefit the game
    community. SE techniques spanning patterns (requirements, design), middleware,
    testing techniques, development environments, and processes for building sustainable
