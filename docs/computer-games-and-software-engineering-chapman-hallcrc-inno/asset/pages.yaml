    # 10.1 INTRODUCTION


    Complex and ubiquitous artificial intelligence (AI) has become a staple of modern
    computer games; players expect nonplayer characters (NPCs) to intelligently react
    to player actions while exhibiting appropriate behaviors depending on their role
    within the game context. Developing a good AI for a real-time game environment,
    however, is a difficult task. Although a variety of formalisms are employed, practical
    AI designs typically resort to strongly customized approaches closely connected
    to the underlying game architecture and the NPC type. This results in a relative
    lack of reuse in game AI, increasing development costs and requiring the repetitive
    development of often quite similar AI behaviors.


    The narrow game-by-game focus is a source of consternation for game developers.
    At GDC 2011, Kevin Dill raised this issue, arguing that the lack of behavioral
    modularity is stymieing the development of high-quality AI [1]. Previous work
    has argued that the fundamental cause for this lies within the formalisms employed
    [2]. The applicability of software engineering practices becomes limited due to
    the use of nonmodular custom approaches. As an alternative, the layered statechart-based
    approach [3] provides inherent modularity with nesting capabilities.


    Our approach to AI reuse builds from layered statechart-based AI. Here, we provide
    a formalism and structure that encapsulates behaviors; we are able to define a
    development strategy that allows the extensive reuse of different AI components,
    including both high- and low-level elements. Partial behavioral composition is
    enabled by the introduction of functional groups, providing an efficient way to
    reuse groups of related behaviors. Clear identification of code dependencies further
    permits analysis and the tool-based presentation required to ensure proper integration
    into the actual game code. This yields a faster development process with the ability'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'to employ a library of AI behaviors to construct complex AIs, while at the
    same time simplifying adaptation of the AI to an actual game context.


    We illustrate our approach by creating a garbage collector NPC through the reuse
    of large portions of the AI designed for a squirrel NPC. These are different game
    AI contexts, and would typically be approached as unique development tasks. By
    treating the AI as a collection of interacting modules, many behavioral similarities
    emerge. By expressing and reusing AI behaviors at a suitable level of abstraction,
    our approach is able to capture many of these commonalities: fully two-thirds
    of the *AI modules* in the garbage collector are reused from the squirrel.


    Our development and reuse approach is made practical through our tool *Scythe
    AI*. This software framework directs and facilitates the development workflow,
    taking in statecharts and associated classes, providing an interface for producing
    novel AIs from a library of behaviors, and exporting code that can be directly
    incorporated into a game. By formally representing and understanding the game
    code associated with specific behaviors, Scythe AI is able to perform basic analysis
    of the constructed AI, ensuring code and functional group dependencies are properly
    satisfied and thus the AI is well constructed. Scythe AI represents a useful illustration
    of the practical value and general feasibility of our approach.


    Major contributions of our work include the following:


    +   - Extending the reuse strategy for developing game AIs based on statecharts
    presented by Dragert et al. [2]. The work further demonstrates the feasibility
    of statecharts for game AIs [3], by defining efficient development, component
    definition, and porting strategies.

    +   - A demonstration of reuse by reusing AI modules from a squirrel NPC to build
    a new AI for a garbage collector NPC.

    +   - Concretizing the approach through the design of a software tool, *Scythe
    AI*. As part of a practical workflow for AI generation, it simplifies component
    reuse and allows for nontrivial analysis, helping to ensure that AI components
    are properly composed and integrated.


    We begin the next section with a basic background to our approach, as well as
    appropriate related work. Section 10.3 then describes our general design, whereas
    Section 10.4 presents our reuse strategy. Section 10.5 details a case study of
    reuse. Section 10.6 discusses the tool we developed'
  merge: -1
