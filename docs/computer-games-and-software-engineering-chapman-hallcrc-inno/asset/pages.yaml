    rigorous treatment of object-oriented concepts using Java as an example language
    and Development of sound programming and design skills, problem solving and modeling
    of real world problems from science, engineering, and economics using the object-oriented
    paradigm [17]. The prerequisite for the course was familiarity with programming
    and Java (demonstrated through a successful completion of


