  md: '# # 12.1 OVERVIEW


    There are many possible future directions for research in computer games and software
    engineering (CGSE). Computer games may well be the quintessential domain for computer
    science (CS) and SE R&D. Why? Modern multiplayer online games must address core
    issues in just about every major area of CS research and education. Such games
    entail the development, integration, and balancing of software capabilities drawn
    from algorithm design and complexity, artificial intelligence (AI), computer graphics,
    computer-supported cooperative work/play, database management systems, human-computer
    interaction and interface design, operating systems and resource/storage management,
    networking, programming/scripting language design and interpretation, performance
    monitoring, and more. Few other software system application arenas demand such
    technical mastery and integration skill. Yet, game development is expected to
    rely on such mastery, still provide a game play experience that most users find
    satisfying, fun, and engaging. Computer games are thus an excellent domain for
    research and development of new ways and means for (game) software engineering.


    This chapter highlights future R&D opportunities in CGSE. Some are found in Chapters
    2 through 11, while others are emerging research trends at the intersection of
    computer games (CG) and SE with each other, and with other disciplines. A starting
    question to ask is, “how CG development is different from SE?” (Murphy-Hill et
    al. 2014) More broadly, an overall question for the student or professional reading
    this book is “how will future computer games succeed/fail with/without SE tools,
    techniques, and concepts?” For example, if SE is mostly irrelevant to the successful
    development, deployment, and sustained evolution of computer games, then how or
    why is SE irrelevant? Is (1) traditional SE no longer relevant overall to the
    upcoming generations of game software developers, or is (2) there something about
    the ways and means by which computer games, game development projects, and game
    development organizations operate and engage players that eludes recognition and
    comprehension by SE researchers and educators? Although the former (1) seems unlikely
    and unpopular to contemplate, the latter (2) points to opportunities for future
    research in SE. The challenges are thus yours to consider and address.


    The mainstream CG industry is a global endeavor with multibillion dollar game
    development companies, as well as untold numbers of independent small-to-mid-sized
    game studios that make games for commercial markets or specialty applications
    (e.g., game-based training).'
