  md: '# ### 7.4.1 WebSockets


    The RCAT reference implementation uses WebSockets in order for the clients to
    receive messages from the servers. Here, we give a brief description of WebSockets.


    A WebSocket is a standard TCP connection initiated over HTTP and growing in popularity
    for real-time web applications. The use of TCP in MMOs is a controversial debate
    in both research and industry. Some game developers would even rather implement
    a reliable protocol on top of the User Datagram Protocol (UDP) rather than using
    TCP. We opt for TCP for three reasons:


    +   1. TCP removes the effort of controlling packet ordering and retransmission.
    Adequately configuring the TCP retransmission rate can greatly reduce the latency
    [38].

    +   2. MMOs generally use TCP, probably because clients send only between 1 and
    10 messages per second [21,38]. Using TCP makes our approach more valid and applicable.

    +   3. TCP has many congestion control mechanisms, such as Nagle’s algorithm,
    that may help on the server side when broadcasting the same message to many connections.
    Such solutions generally trade latency for bandwidth or vice versa. They are yet
    another illustration of the scalability-responsiveness trade-off in MMOs.


