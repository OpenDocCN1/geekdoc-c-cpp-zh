- pgno: 287
  md: 'Engineering scalable software systems is often bracketed as its own family
    of challenges, and these challenges similarly appear in the development of computer
    games such as MMORPG, where millions of players are anticipated, with thousands
    playing concurrently. The CGSE challenges for massively scalable games include
    how best to (1) design and organize team-work processes for game development,
    playtesting, and postdeployment support; (2) divide the CGSE work among developers
    with different skills across different development sites; (3) organize and enact
    multisite software project management; (4) design scalable game services and supporting
    infrastructures that may host multiple server sites; (5) manage concurrent system
    configurations and product release versions for multiple end-user platforms; (6)
    manage and secure game-based intellectual property (IP) assets and user-created
    content; and so forth. Conversely, for MMORPG clients, how are remote game-based
    middleware services to scale down or simplified for delivery of real-time game
    play experience that can fit within the game''s client software deployment? In
    short, research that informs large-scale CGSE projects, as well as scalable game
    system architectures for integrating remote services, represents an interesting
    set of challenges likely to be of great interest to game development firms.


    Beyond scalability, the world of SE is frequently characterized in modern textbooks
    as a series of engineering tasks. These SE tasks must be performed systematically,
    with care, and perhaps even monitored and measured as a continuously improvable
    set of processes. That''s what we teach and what we encourage students and industrial
    professionals to learn and practice. But many hard and difficult problems arise
    along the way in many SE projects while performing such tasks, and thus the mainstream
    SE research community focuses much research attention to advancing knowledge about
    tools and techniques for addressing or resolving the challenges that arise. As
    such, we turn to briefly explore other grand challenges of SE, along with modest
    enumerations of CGSE research opportunities that may follow. The interested reader
    can undoubtedly identify other R&D opportunities as well.


    # 12.3.2 Game Software Requirements Engineering


    Software requirements engineering has been a long-term challenge in SE. It has
    its own international research conferences and dedicated journals, both of which
    are intended to complement mainstream research in the field of SE. The existence
    of both the conferences and journals suggests that international interest in the
    research and practice of how best to elicit'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'and articulate software functional requirements that may be formalized, as
    well as what to do with nonfunctional software requirements, is wide-spread. However,
    with computer game software, it appears that the practice of game development
    primarily focuses on creating and satisfying nonfunctional requirements (NFRs)
    for the game as product, versus the game software''s functional requirements that
    are often tacit and undocumented, or specified in hindsight (Alspaugh and Scacchi
    2013). NFRs such as the game *must be fun to play* by a target audience of users/players
    (e.g., played by males 18–35 years old or gender neutral) on a target platform
    (for play on Microsoft Xbox One consoles, browser based, integrated with social
    media sites such as Facebook or mobile devices running iOS or Android operating
    systems) at some retail price point or monetization scheme (*free to play, with
    game-based microtransactions using prepaid user debit accounts or monthly subscriptions
    for user accounts*) are much more common (Callele et al. 2005). The SE challenge
    that appears is determining what to do during game software development to address
    or satisfy such NFRs. Alternatively, challenges also exist for finding how best
    to gamify the requirements engineering and other SE activities (Cooper et al.
    2014; Fernandes et al. 2012).


    Game developers have learned that merely providing a game whose software functions
    as intended (i.e., meets its functional requirements) is much less relevant than
    providing a game that game playtesting (Fullerton et al. 2004) empirically demonstrates
    satisfying diverse game player focus groups, rather than in-house game developers.
    In this regard, NFRs for games are testable, but not in the ways clearly aligned
    with the interests of SE testing research. Instead, it is not surprising to see
    the industry shifting its focus from large multimillion dollar budget AAA games
    to games that can be incrementally developed and released with a minimum set of
    game play features. Early success of a new minimal game with players (e.g., online
    player reviews, user-created game play videos, and game microtransaction rates
    of return) will determine whether more features will be added or integrated, thereby
    realizing that the game system is being developed as an online interactive game
    play service, rather than just as a software product. Whether such game development
    prescribes *features* as subject to functional or NFRs is at present an open problem
    in CGSE, as is the overall game development process that is driven by features
    that follow from the incremental deployment of testable game feature sets. This
    is not the same as Scrum or agile development methods, at least, as they have
    been prescribed in textbooks, but they may represent some linkages'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'to such practices. Therefore, investigating and better understanding the virtues
    and vices of new game development practices is an open area for future CGSE research.


    Another observation on requirements for game development arises with recognition
    that some game developers are committed end users of the games they play (Scacchi
    2011). In such situations, the elicitation of functional requirements can be less
    complicated compared to traditional SE project situations, where developers and
    users are distinct groups (Alspaugh and Scacchi 2013). This is primarily the situation
    for *game modders*, people who intentionally act to modify an existing game, where
    the released game includes access to a software development kit (SDK) that is
    pre-configured to afford certain types of changes to the game''s appearance, rules
    of play, play experience, or game purpose (Scacchi 2010b). As modders act as both
    the developer of (new) game functionality and an end user to be satisfied, there
    may be no communication/interest gap between developers and users. Thus, there
    may be no need for traditional requirements elicitation or specification, and
    instead the developer-user can iteratively explore, try out, and rapidly adapt
    their needs to what they can accomplish. Therefore, *what is the role or value
    of requirements engineering in support of game modding as a development modality*,
    is a question for further investigation and empirical exploration.


    # ### 12.3.3 Game Software Design


    Another classic challenge for SE is determining how best to design a software
    system to satisfy its requirements or specifications. As noted, computer game
    requirements may be dominated by NFRs, rather than functional specifications that
    can be formalized, verified, and validated. Thus, game software design may need
    to account for such a bias or focus.


    For students and would-be game developers, many textbooks and practitioner guides
    target *game design* (e.g., Fullerton et al. 2004; Meigs 2003; Rogers 2010; Schell
    2008), rather than *game software design*. Whether such texts should be considered
    relevant to game software design may hinge on the expectation as to whether prior
    software design concepts, tools, and techniques are employed or ignored. For example,
    game design texts often focus attention on how to address NFRs for the appearance
    and animated emotional behavior of in-game characters, choice of game play mechanics
    well suited for the game''s genre, the look and feel of game level or world design,
    user interface design and overlay, and so forth. As such, these texts say little
    about the game''s software functional requirements.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'This, in turn, means that alternatives about game software architecture are
    unclear, and thus the architectural design of games, and how to make trade-offs
    therein, remains an open challenge in CGSE. Instead, game designers are assumed
    or directed to employ a game SDK or development framework (e.g., Construct 2,
    GameMaker: Studio, GameSalad, Microsoft XNA Game Studio, Project Spark, PyGame,
    Steam, Unity, and Unreal Development Kit) to realize their game design. However,
    as many have observed, the selection of a game development environment constrains
    or predetermines what kind of computer game may be more readily developed. For
    example, many SDKs primarily support the development of 2D games, but not 3D games;
    some SDKs feature drag-and-drop game development with little ability to include
    new source code. Thus, the game development environment encroaches into the functional
    requirements or NFRs space. This sidesteps the engineering of game software design,
    and instead replaces it with a development paradigm focused on game design as
    found in textbooks, rather than on software system design, as found in SE textbooks.
    Similarly, if an envisioned game to be developed requires unfamiliar or unprecedented
    game functionality, it may be necessary to develop a game run-time environment
    (a game engine as a software system application) as well as one or more instances
    of games that operate with the new game engine.


    Next, as multiplayer online games are complex software systems, we can consider
    how the underlying software architecture facilitates or constrains how the game
    can be initially designed and configured, built from the existing components,
    as well as further developed, modded, or evolved. Games are often configured using
    different middleware libraries or external service components that must be integrated
    with new game software functions, features, or capabilities. Dragert and colleagues
    provide a scheme for this in Chapter 10. However, commercial multiplayer games
    may incorporate 20 or more libraries of external services, including user registration,
    microtransaction payment, anti-cheating security, in-game or around-game online
    chat, behavioral character and NPC AI, database management, and others. Further,
    as some of these capabilities become further specialized, their software give
    rise to their own autonomous architectural representation. Thus, the challenge
    arises for how best to mix, match, or reuse heterogeneous game software subsystem
    architectures in ways that are open to component replacement, architectural reconfiguration,
    multiversion run-time platforms, and even IP license changes (Scacchi and Alspaugh
    2012).'
