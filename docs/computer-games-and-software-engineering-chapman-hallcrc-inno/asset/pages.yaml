    # ## 10.6 SCYTHE AI TOOL


    With a formal AI module interface, it becomes possible to add tool support to
    the reuse process. Our tool, Scythe AI, allows a user to grow and manage a library
    of AI modules, and create new AIs through the described reuse approach. The tool
    includes a streamlined importing process to introduce new modules, library management
    of modules, an error and warning system to assist in new AI construction, and
    can export directly to a defined target game.


    At a high level, Scythe AI allows users to build a library of AI modules by importing
    statecharts and associated classes. These modules are then reused to build new
    AIs. Like a standard IDE, warnings and errors are generated to guide users through
    the process of connecting modules to ensure proper interaction. When an AI is
    completed, it can be exported directly from Scythe AI into a target game. The
    workflow is illustrated in Figure 10.10.


    # ### 10.6.1 Workflow and Key Features


    # #### *10.6.1.1 Importing Modules*


    Importing an AI module into Scythe AI consists of building the AI interface by
    working through a highly guided process. Event-based communication details are
    recovered directly from the statechart itself, supplied in the SCXML format. Scythe
    AI scans the statechart for all events that are generated or transitioned upon
    and suggests these as output or input events, respectively. Any event that is
    both created and consumed is an internal event, and is inappropriate for any type
    of connection.


    The remainder of the AI module interface comes from the associated class. Currently,
    Scythe AI supports Java files and could be extended to support C++. When importing,
    the associated class is parsed and information relevant to reuse is extracted.
    The user is given the list of class imports, where the user determines which imports
    come from, and thus link the module to, the source game. As well, any parameters
    in the'
