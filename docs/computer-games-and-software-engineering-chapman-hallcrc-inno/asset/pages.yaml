    After the delivery and retirement of the CBA game, about two years later, we received
    a new challenge from a large statewide government agency in California responsible
    for deploying state-mandated annual training for state employees in recognizing,
    avoiding, and reporting sexual harassment in public workplaces. Once again, our
    game prototyping budget and demonstration schedule were extremely limited, so
    this called for a game design and demonstration that could be done *quick and
    dirty*.


    Our choice was to repurpose the role-playing CBA game through the substitution
    of in-game characters dialog while also providing support for the *Rashomon* effect
    (Heider 1988), but through in-game characters and nonplayer characters. The substitution
    of character dialog and situations as the basis for a new/adapted story is a common
    practice found in the literature, cinema, and game-based machinima. For example,
    the Shakespearean story of *The Tempest* was repurposed into the cinematic science-fiction
    story of the *Forbidden Planet*, whereas the popular *Red vs. Blue* machinima
    series represent the substitution of human voices over in-game character dialogs/taunts
    from various *HALO* FPS games. The *Rashomon* effect refers to the situation where
    multiple actors in a common situation or interaction provide differing, sometimes
    conflicting, interpretations of what they perceive (cf. the allegory of the blind
    men feeling the elephant). This exploration of characters acting in different
    roles encountering a common situation also appears in interactive game-based worlds,
    where players can switch between characters to reinterpret and reexperience a
    recent game play situation, as a play mechanic, appears in games such as *The
    Residents: Bad Day at the Midway* released in 1996 (Residents 2014). Our new game
    play experience was thus designed to demonstrate how to provide scenario-based
    character encounters that feature innocent, ambiguous, or abusive verbal interactions
    different/competing perspectives of in-game characters regarding whether or not
    they perceived multicharacter dialog or interactions as engendering sexual harassment
    activities. A screenshot of the repurposed CBA-into-sexual harassment game is
    shown in Figure 11.6.


    To be clear, this game is not envisioned as a game to play to win, but instead
    to provide a sufficiently engaging experience, so that state employees would play
    through dozens of different possible sexual harassment scenarios to fulfill the
    state-mandated training requirement. The state''s harassment liability insurance
    provider eventually argued against the development and deployment of the game
    in part because it was *a game*,'
