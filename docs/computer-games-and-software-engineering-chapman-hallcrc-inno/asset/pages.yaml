  md: '# 4.5 FEEDBACK AND RETROSPECTIVES


    In this section, we describe the feedback about the course structure given by
    the students and our thoughts and retrospectives on using gameful approaches for
    CS education.


    # 4.5.1 Student Feedback


    The student feedback comes from various sources such as midterm and end of semester
    surveys, public reviews of the class, and e-mail sent to the first author.


    HALO received mixed reviews—many students found that it was very useful; other
    students found that it was not beneficial. Figure 4.2 shows the students’ reasons
    on why HALO was beneficial. Figure 4.3 shows why students thought that it was
    not beneficial. The main take-away for us with HALO was the following: because
    it was either completely optional or only for extra credit, typically only students
    who are doing really well in the class will use it. Students who are having a
    hard time in the class will not want to do something that is optional. In an analogous
    manner, students will only do the extra credit if they have managed to complete
    the assignment early enough and sufficiently well. Thus, HALO quests needed to
    be more oriented toward the students


