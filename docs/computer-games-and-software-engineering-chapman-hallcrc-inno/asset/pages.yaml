    scoresIncreasing({1, 1, 4}) → true

    ```


    Then the code editor in the middle of the web page includes an empty method body
    for `public boolean scoresIncreasing(int[] scores)` (note that when a problem
    creator creates a problem, the method, such as `scoresIncreasing` in the problem,
    should return a value). A student who tries to solve the problem is expected to
    fill in code in the empty method body to solve the given programming problem.
    After the student fills in code and clicks the Go button, CodingBat displays compilation
    issues, if any, that are encountered when the code is compiled; otherwise, CodingBat
    runs a predefined set of test cases (prepared by the problem creator) against
    the code and reports these test cases being labeled as failing test cases or passing
    test cases. Note that these test cases are reported in the form of the preceding
    example expected input/output pairs. Based on the feedback (i.e., the reported
    test cases and their failing/passing statuses), the student can further attempt
    to improve his or her code to make all test cases as passing test cases.


    Because the predefined set of test cases is visible to the student, the student
    can “fool” CodingBat by writing code that includes a conditional statement for
    each reported test case so that the conditional in the conditional statement checks
    whether the method arguments are the same as the input in a reported test case
    and then the true branch of the conditional statement simply returns the expected
    output in the reported test case. Apparently, the code written in this way to
    overfit the reported test cases is not the correct code for the exercise problem.
    However, CodingBat would still report All Correct because all the predefined test
    cases are indeed passing test cases.


    CodingBat allows the student to view the progress graph for a problem, showing
    the problem-solving history (e.g., the percentage of passing test cases and percentage
    of failing test cases) for each version of the code written and submitted by the
    student for the problem over time. The student can also view graphs from some
    random users just for fun. A student can earn *code badges* by solving problems
    across all of the fundamental sections (which include very common code patterns
