    # 11.1 OVERVIEW


    This chapter examines the concept and practice of repurposing game play mechanics
    as a game design technique. Section 11.2 begins with a review of related research
    that informs this view of repurposing as a game design technique that may be adopted
    and practiced by new game developers or game players who want to engage in end-user
    game software development. Next, the chapter describes five game design case studies
    where different forms of repurposing are employed. These case studies include
    the identification of the example games and play mechanics that served to inform
    the resulting game designs from each. Each case study also categorizes the kinds
    of repurposing methods that were employed in reusing and adapting the source game
    mechanics into those employed in the new game design. Finally, the chapter includes
    a simple comparative analysis and a summary of these repurposing methods, as a
    basis for generalizing the method as a reusable and adaptive game design technique.


    # 11.2 RELATED RESEARCH ON THE WHAT AND HOW OF REPURPOSING GAME PLAY MECHANICS


    Designing computer games or game-based virtual worlds is a challenging problem
    (Bartle 2004). Such a problem has the complexity of both software systems design
    and designing the fun interactive play experiences (Fullerton et al. 2004; Howard
    2008; Schell 2008). For the software engineering specialist new to game development,
    a clean-sheet game design can be a daunting challenge. Therefore, developers are
    wise to first start by examining the existing games and game play experiences
    as a basis for designing future games. Such an approach relies on some form of
    informal domain analysis (Pietro-Diaz and Arango 1991) to identify recognizable
    game features and capabilities, and game objects; functional operations; game
    play rules; and relationships between objects, operations, rules, features, and
    capabilities, as game play mechanics (Sicart 2008).


    A formal domain analysis might have the potential to give rise to a persistent
    set of reusable game components, play mechanics, and eventually a meta-design
    theory for games (cf. Koehne et al. 2011) that could enable the'
