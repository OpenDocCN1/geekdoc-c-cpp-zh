    class are extracted, so that values can be specified when that AI module is reused.
    Synchronous calls are addressed next, covering calls made to other classes, and
    calls made available for other classes to utilize. When this guided process is
    complete, the new AI module is added to Scythe AI’s module library, and copies
    of the associated class and statechart are made and stored.


    # 10.6.1.2 AI Construction


    The building process consists of adding modules from the library to the new AI.
    Assuming that a module’s logic is internally correct, that is, the statechart
    correctly does what it claims to do, the task for the user is to coordinate module
    communication such that the modules in the new AI will cooperate as desired. Most
    frequently, this means ensuring that events sent by a statechart are correctly
    received by target statecharts, while not being incidentally received by nontarget
    statecharts. This is done by event renaming as described in Section 10.4.1. Once
    a module is added, values for parameters should be specified.


    A number of issues can arise while constructing a new AI. These are classified
    as errors if they will prevent the AI from running (e.g., a synchronous call is
    not satisfied), and must be corrected before completion.'
