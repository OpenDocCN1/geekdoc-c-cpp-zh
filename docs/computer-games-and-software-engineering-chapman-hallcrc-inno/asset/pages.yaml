  md: 'even software practitioners. In particular, in a coding duel game, a major
    game type in Pex4Fun, a student needs to write the code to implement the functionalities
    of a secret specification (in the form of sample solution code not visible to
    the student). Based on an automated test generation tool, Pex4Fun finds any discrepancies
    in behavior between the student''s code and the secret specification. Such discrepancies
    are given as feedback to the student to guide how to fix the student''s code to
    match the behavior of the secret specification.


    We next illustrate Pex4Fun by focusing on its underlying software engineering
    technologies (Section 5.3.1), its gaming (Section 5.3.2), social dynamics (Section
    5.3.3), and educational usage (Section 5.3.4), which are the four common aspects
    of a typical project on educational software engineering. Finally, we describe
    Code Hunt (Section 5.3.5), which is a recent gaming platform evolved from Pex4Fun.


    # ### 5.3.1 Software Engineering Technologies Underlying Pex4Fun


    Behind the scenes on the server in the cloud, the Pex4Fun website leverages dynamic
    symbolic execution (DSE) [21] implemented by Pex [22,23], in order to (1) determine
    whether the code submitted by a student is correct, (2) check the code''s correctness
    and game progress of the player, and (3) compute customized feedback [24]. Pex
    is an automatic white box test generation tool for .NET. It has been integrated
    into Microsoft Visual Studio as an add-in. Besides being used in the industry,
    Pex was also used in classroom teaching at different universities [25].


    In particular, DSE [21] is a variation of symbolic execution [26,27] and leverages
    run-time information from concrete executions. DSE is often conducted in iterations
    to systematically increase code coverage such as block or branch coverage. In
    each iteration, DSE executes the program under test with a test input, which can
    be a default or randomly generated input in the first iteration or an input generated
    in one of the previous iterations. During the execution of the program under test,
    DSE performs symbolic execution in parallel to collecting symbolic constraints
    on program inputs obtained from predicates in branch statements along the execution.
    Then DSE flips a branching node in the executed path to construct a new path that
    shares the prefix to the node with the executed path, but then deviates and takes
    a different branch. Finally, DSE relies on a constraint solver to compute a satisfying
    assignment (if possible), which forms a new test input whose execution will follow
    the flipped path.'
