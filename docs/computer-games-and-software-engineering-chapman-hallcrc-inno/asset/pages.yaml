    # ### 7.3.1 Representational State Transfer


    Before the web established itself as the main platform for Internet applications
    at the global scale, many other platforms had been proposed during the 1980s and
    the 1990s [49,50]. The web has given us two very important advantages over the
    competition at the time:


    +   1. It created a common foundation for the development of a variety of applications.
    Web developers can create many applications in many different domains using many
    different frameworks, languages, and tools, but the architectural foundations
    are all the same.

    +   2. It allowed web applications to start small (one web server) and gracefully
    grow to server farms if the businesses are so demand.


    We would like MMOs to have these same properties. As such, RCAT is inspired by
    the architecture of web applications, in particular REST [8]. REST stipulates
    five main architectural constraints that we adapt to the context of MMOs:


    +   1. *Client-server*: The state of the system is stored on the server side,
    not on the client side. Client-server architectures are commonplace in MMOs.

    +   2. *Tiers*: Hardware proxies, load balancers, and software-level intermediaries
    are recommended to decouple clients from servers. Tiered architectures are not
    a new topic in the MMO architecture [51].'
