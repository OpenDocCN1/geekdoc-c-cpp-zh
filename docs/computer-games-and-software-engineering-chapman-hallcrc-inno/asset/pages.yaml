    # 10.5 CASE STUDY: SQUIRREL TO TRASH COLLECTOR


    To demonstrate the validity and usefulness of the presented approach, this section
    gives a concrete example of AI reuse. Here, we take the AI developed for the squirrel
    and reuse its components to create a new AI for a trash collector. Using the described
    reuse techniques coupled with good modular design practices, we find that many
    elements of the squirrel can easily be repurposed, greatly simplifying the development
    of the new AI. This process is greatly streamlined by the fact that the source
    and target game are the same. Thus, the associated classes can be reused without
    modification, as the implementation language is the same and all game imports
    are valid.


    # 10.5.1 Trash Collector Specification


    The purpose of the trash collector NPC is to clean up the Mammoth game world.
    This is done by collecting pieces of rubbish left by other players, then depositing
    the trash into garbage bins. The requirements for the NPC'
