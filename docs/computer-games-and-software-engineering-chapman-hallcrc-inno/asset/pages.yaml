    # ## 10.4 REUSE AND COMPONENT INTEGRATION


    Integrating modules correctly and easily is fundamental to effective AI reuse.
    Each reused module must be *connected* to the other modules in the new AI, through
    either an event-based communication or a synchronous communication. Here we describe
    how modules can be reused and correctly connected in a new context.'
