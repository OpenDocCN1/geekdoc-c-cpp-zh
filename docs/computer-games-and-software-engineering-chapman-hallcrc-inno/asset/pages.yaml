- pgno: 296
  md: 'services. Similarly, accommodating game development competitions that elicit
    submissions from international or globally dispersed SEE student project teams
    might, therefore, also focus comparative assessment on how well student teams
    practice and demonstrate GSD concepts and techniques through their CG development
    efforts. Finally, all other areas of SE research and practice, such as configuration
    management, build and release management, reverse engineering, FOSS development,
    and agile development, may be seen as potential candidates for gamification in
    ways that may be engaged through SEE coursework and team projects.


    # ## 12.4 OTHER RESEARCH OPPORTUNITY AREAS FOR CGSE


    One area of CGSE research interest not addressed in this book focuses on the creation
    of new technologies for (semi)automated generation of computer games (cf. Scacchi
    2012b). This kind of research may focus on the invention of new concepts, techniques,
    and tools for the generation of ready-to-play games based on specifications of
    game play narrative (such as movie scripts or screenplays), emergent agent-based
    interaction rules, and functional game software specifications. Such efforts represent
    a reconstitution of automatic programming or knowledge-based software development
    approaches once avidly explored in SE research, but now displaced by more conventional
    programming-centric approaches that average programmers can perform. Although
    there is an active community of researchers working on computational intelligence,
    agent-based systems, and procedurally generated worlds for games, much of these
    efforts are not (yet) being well addressed from a CGSE perspective. For example,
    current efforts at the procedural generation of game worlds often focuses attention
    to the generation of visual in-game object models or composed levels, such as
    automatically generated trees/vegetation, buildings, building interiors, cityscapes,
    waterways, and geographic/conceptual terrains (Smelik et al. 2014; Smith et al.
    2011). However, these efforts do not yet generate in-game characters with complex
    social behaviors in different roles, nor sociopolitical cultural systems that
    may/may not feature emergent competitive or combative dynamics, nor utilize engines
    that provide complex physical or ecosystem simulations (e.g., processes such as
    digestion, reproduction, speciation, and ecosystem evolution) at different physical
    scales (from nano to human, or from human to cosmological) (Bartle 2004; Scacchi
    2012b). So much innovation is possible in this area of future CGSE research.


    In other research, currently outside of CGSE, there is a growing interest in determining
    whether, or how best, to employ and engineer'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'cloud-based computing infrastructure and services to support online games (Huang
    et al. 2014; Mishra et al. 2014). Cloud-based software system architectures are
    recognized to offer scalable services, especially for remote storage, file sharing
    and content distribution, commercial (purchase) transactions, and remote computation,
    among others. These architectures may inform the deployment of CG where such scalability
    is relevant to game publishing business ventures. However, one nagging challenge
    for CGSE is how best to develop games that can exploit such capabilities, rather
    than supporting current/legacy games that were developed without the dependence
    or integration of cloud-based services. For example, cloud-based CG R&D efforts
    are seeking to host game play computations in the cloud, while streaming visual
    and audio content updates to remote player clients. This resembles a *fat server,
    thin client* architectural model that contrasts to the currently *thin server,
    fat client* model that is more common in networked multiplayer games. Both models,
    along with others such as massively scaled peer-to-peer or hypergrid architectures
    (Lopes 2011), represent different assumptions about preferred business models,
    financial investments, IP protection, network bandwidth and latency quality of
    service, and anticipated advances in computing technology. Streaming game content
    is being actively pursued by large IT firms, perhaps inspired by the success of
    (asynchronous, on-demand) streaming video/audio distribution ventures that are
    displacing traditional (synchronous, on schedule) media content broadcasters.
    But game play is interactive and experiential in ways that passive media (films,
    recorded music, and television programs) are not. Therefore, it is not surprising
    to see that game play streaming services often provide reduced visual display
    resolution (to reduce bandwidth and latency) with game content that can be more
    easily cached (e.g., prerecorded game video content), because wide-area network
    protocols are not yet developed to meet the performance and *quality of experience*
    (QoE) requirements that game players expect (Mishra et al. 2014). Thus, the CGSE
    challenges here include in identifying how best to design games for cloud-based
    deployment infrastructure, as well as how to design the software infrastructure
    (including new game networking protocols) for cloud-based games (Huang et al.
    2014).


    Next, serious games intended specifically for crowdsourced play [sometimes called,
    *games with a purpose*—GWAP (von Ahn 2006)] are themselves a relatively new capability
    of interest from a CGSE perspective. In many such games, play is often strongly
    limited to play mechanics such as 2D/3D puzzle solving, which means these are
    but one genre of serious games. Many of these *citizen science* games primarily
    engage puzzle gamers who'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'may or may not care about the underlying purpose or domain for the game. Therefore,
    it is unclear whether little/no engagement of the game players with the underlying
    problem domain is a relevant UX factor in game play, or in user satisfaction with
    a fun and playful game. But the development of GWAP, game-based virtual worlds
    (Bartle 2004; Scacchi 2010c), or other kinds of serious games in nongame play
    domains such as proteomics via the Foldit game (Cooper et al. 2010), RNA sequencing
    via the EteRNA game (Lee et al. 2014), and mapping the retina or brain connectome
    via the EyeWire game (Frank 2013) may itself represent a new avenue for CGSE research
    to address—for example, how best to design and software engineer games for different
    scientific research problem domains (Scacchi 2012b).


    The areas identified throughout this chapter for future research in CGSE is a
    small sample rather than a comprehensive set. CGSE itself represents a new arena
    for SE research and development. Other CGSE challenges may be found in how best
    to: (1) engineer cybersecurity software capabilities for multiplayer games, where
    financial services, user privacy, and anti-cheating requirements must be addressed
    while insuring online socialization and convivial/competitive game play; (2) integrate
    CG with social media services and other cloud-based services; (3) develop frameworks
    or SDKs for implementing games that incorporate heterogeneous devices arising
    within an Internet of Things; (4) develop automated or semiautomated game production
    tools that allow nongineers to rapidly produce and deploy serious games for nonentertainment
    and scientific research applications (Cooper et al. 2010); (5) engineer remote
    game client services for display update management and run-time monitoring to
    improve game QoE; (6) investigate software architectural alternatives for orthogonal,
    multi-tier middleware services (for game character AI, data analytics, financial
    payment services, user account management, etc.) developed by independent game
    service providers; (7) design rapid, iterative, and incremental approaches to
    minimum playable games (or game feature sets) that allow remote user play to help
    drive subsequent game play features and functionality, as well as how to adapt
    such an approach to nongame applications; (8) articulate techniques that combine
    playtesting with play analytics and visualizations; (9) develop games, game engines,
    or game development frameworks for educational games in other CS subdisciplines
    (e.g., serious games for network protocol design, database management, compiler
    construction, and operating system configuration); and (10) investigate the roles
    of FOSS tools and techniques for game development in enabling SEE, global knowledge
    transfer, and socioeconomic development of local game development enterprises.'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'Last, the concept and the initiative of using games to explore new ways and
    means for solving long-standing problems in SE is profound, bold, and ambitious.
    Whether it succeeds is an open issue for now. But whether it can and will be adopted
    to explore other challenges in SE is, therefore, an opportunity at hand. Similarly,
    whether such effort can be mobilized and deployed on a regional, national, or
    global scale without a large government research investment is also a challenge
    to be addressed. However, we should look for (and perhaps encourage) such efforts
    to address challenges in CGSE, whereby game development serves game play whose
    purpose is to inform new ways to develop games.


    # 12.5 FUTURE INVESTMENT OPPORTUNITIES

    IN CGSE R&D PROGRAMS


    It may well be the situation that the mainstream computer game industry has little
    interest in the pursuit of research in CGSE, as being somehow central to their
    game product business models or revenue streams. This is not to say that such
    research may not be beneficial to such business efforts. Instead, such an industry
    position may instead seek to exploit the spillover benefits that arise from academic
    research in CGSE that may be supported by government agencies or corporate underwriters.
    However, Chapters 8, 9, and 5 in this book by Robert Hall, from AT&T Labs, Dan
    Russell, from Google, and Tao Xie and others, from Microsoft, demonstrate real
    academic-industrial research interest arising in the arena of CGSE, so perhaps
    other corporate partners will follow. Similarly, as noted earlier, the DARPA Verigames
    research initiative in the United States Verigames (2014) is another multiyear
    effort that essentially is a large investment in the future of CGSE R&D. In contrast,
    in the United States, the European Union, and elsewhere, (inter)national research
    programs arise that may represent new opportunities for the collaboration of CGSE
    researchers and game development students, with domain specialists working in
    other areas of study.


    New distinct research programs are being established (as of 2014) in robotics
    and brain sciences (e.g., EU Human Brain Project, U.S. BRAIN Initiative). Although
    both areas have long-standing traditions of R&D, future efforts are focused on
    producing scientific discoveries, technological breakthroughs, and workforce development.
    Computer games for teaching robotics, augmented reality games that interact with
    or employ robots, and game jams that incorporate robotic devices are just a sample
    of possible avenues for research and study. Similarly, in neuroscience, how best
    to design and engineer brain games (for neurogaming studies) and how to engineer'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'multiplayer games for players wearing immersive head-mounted displays or brain-computer
    interfaces are other examples. Next, how to engineer software systems and infrastructural
    services that could enable people with limited abilities to control assistive
    robots through neurotechnologies is yet another example of what such programs
    may be interested in exploring.


    Last, one additional question is how might global CGSE R&D projects develop the
    software services and playful games that might stimulate scientific discovery
    (Cooper et al. 2010; Frank 2013; Lee et al. 2014; Scacchi 2012b), workforce development,
    and knowledge transfer? In particular, how might this occur within domains that
    are not yet perceived to involve or realize the potential benefits of interdisciplinary
    research efforts that can be supported and advanced through CGSE? The entertainment-focused
    game industry is centered in the United States, the European Union, and Asia (principally
    Japan and South Korea), whereas countries such as Brazil, Russia, India, China,
    and Singapore are looking for ways to participate in the global game development,
    services, and publishing business, especially for their domestic markets and emerging
    skilled workforces. In contrast, the role of such industry in countries in the
    Middle East, Africa, and Polynesia is unclear and perhaps clouded by other cultural
    issues. Accordingly, we anticipate and encourage students and researchers to consider
    opportunities in CGSE research and development within or across these emerging
    global CGSE R&D markets.


    # ## 12.6 CONCLUSIONS


    Overall, the future of CGSE is filled with many diverse opportunities for research
    studies and technology development. These opportunities may be of some interest
    to the extant computer game industry, but the likelihood of interest for the near-term
    research funds may be found outside of the entertainment-focused computer game
    studios (Scacchi 2012b). Whether government agencies and corporate sponsors who
    support high-risk research projects will embrace CGSE as a new opportunity area
    is an open question, but one that readers of this book may be compelled to advocate
    and pursue.


    Finally, we do not expect the world of SE to suddenly pivot around the emerging
    area of CGSE, though it might be interesting to see and experience such a transformation.
    Similarly, it will take time for our colleagues in mainstream computer science
    to come to recognize how computer games are engaging a new generation of students
    and researchers, though the emergence of new academic research centers and degree
    programs for'
