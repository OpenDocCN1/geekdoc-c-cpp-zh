- pgno: 78
  md: '# ### 3.2.1 External Entities


    Our meta-model considers two primary external entities. First, the game engages
    student players who function as the game protagonist. An introduction to the game
    requires the player to choose his or her character as part of an orientation to
    the game environment and the game play fundamentals. Depending on the parameters
    of the game set by the instructor, the student player may have some input as to
    his or her character''s abilities (e.g., strength or agility). Otherwise, he or
    she will be able to adjust specific physical characteristics and the name of the
    player avatar. The benefit of customizing the player avatar is the unique investment
    the player has while inside the game world. Afterward, the player must navigate
    a series of game challenges that, if completed successfully, will allow his or
    her to defeat computer-played nonplayer character (NPC) rivals and progress into
    the next faculty-designed challenge. The specific challenges within the game are
    designed to reinforce and demonstrate content knowledge, application, analysis,
    and evaluation. As a game modeled with real-world parameters, the challenges will
    develop transferable skills required by programs and/or international accreditation
    agencies while providing continual, immediate feedback to the student player.


    The second external entity is the instructor and/or game developer. Instructors/developers
    establish the game parameters: by toggling contexts, characters, and challenges,
    they create a learning environment for the student through the use of proposed
    templates and draw from an established asset repository. Templates support the
    modularization of game specifications; they are an established best practice in
    SE/systems engineering processes. Game designers can instantiate the templates
    using a WYSIWYG UI. Although the student player receives feedback during game
    play, the instructor will also receive feedback on the student player''s or players''
    progress and abilities. This can allow the instructor to more accurately adjust
    future class session and/or continuing game content. At the same time, aggregate
    player information can inform assessment and accreditation reports and address
    progress toward program learning outcomes.


    # ### 3.2.2 Traditional Game Elements


    The external entities interface with the SimSYS game and their interaction functions
    through traditional video game components. These game components draw upon reusable
    base forms and functional processes; for the instructor/developer, the components
    are toggled as part of the curriculum/game development process. Subsequently,
    the player engages the'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'game that has been set out by the instructor. We contend that separating the
    functional game components from the rapidly changeable educational elements is
    key to developing flexible, scalable, and adaptable educational games. In SimSYS,
    the various game components, traditional and educational, are categorized into
    functionally determined classes. The primary entry point into the game for the
    player entity is the character that he or she takes on when entering the game.
    The character class is the set of actors within the game; every game must include
    the protagonist (student player), but then can contain a variety of NPCs. For
    example, a secondary NPC likely to be ubiquitous is the antagonist, who provides
    personified adversity for the player in a more interactive manner. Each NPC has
    a profile and a set of variable attributes consisting of name and title, function
    type (e.g., Protagonist, Antagonist, Director, Constructor, Interlocutor), role
    (e.g., employer, client, colleague, friend, lab partner), relevant technical skills
    (i.e., degrees, talents), years of experience (i.e., strength or effectiveness),
    communication skill (i.e., intelligence), leadership skill (i.e., charisma), and
    teamwork skill (i.e., dexterity). In addition, NPCs can have pertinent demographic
    information for encouraging students’ thought about studying and working in a
    diverse social environment (e.g., gender/ethnicity/nationality). NPCs may be assigned
    a frequency of presence to the student player to encourage or limit the level
    of assistance/challenge that the NPC offers. Finally, there are two kinds of character
    behavior: autonomous or autonomous.


    The Context class establishes the simulation environment for the player/protagonist.
    It provides a grammar for the simulation environment and game play. The Context
    class contains the elements that create an immersive world within which students
    can interface. It includes the scenario (e.g., an office, a hospital), the game
    situation (e.g., a mission briefing or a confrontation), a place within the game’s
    story arc and transitions and goals (e.g., moving from junior to senior staff,
    graduating from college), and provides the framework for the challenges in the
    game (e.g., final exam, a company project, or a roadblock). The interplay between
    the player/protagonist within the plot context and the NPCs is designed to help
    students better understand the course content from multiple perspectives, as well
    as reinforcing the effects of good and bad decision making.


    The last class within the traditional game elements is Mechanics. The Mechanics
    class provides the fundamental, low-level game functions and coordinates reusable
    assets such as character interactions, music, and graphics. It also supports maintaining
    the state of the game, including'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'the players'' progress (where they are in the game) and the track of their
    assessment (how well they are doing in the game, e.g., points). This class supports
    the Context class and the Challenge class.


    # ### 3.2.3 Educational Game Elements


    To facilitate the pedagogical base for rapid development of simulation games across
    curricula and training programs, we have separated the game functionality (i.e.,
    the raw simulation components) from the knowledge content and student assessment
    via specific modalities of game challenges. This allows faculty and trainer designers
    to input and switch out content quickly from course to course, and depending on
    student progress, from class to class. That is, instructor designers could toggle
    a laboratory or a crime scene environment for the game Context, and then input
    chemistry- or forensic-specific content in the game challenges that can vary from
    course section to course section.


    Practically every discipline or subject matter consists of a knowledge and skills
    base that determines competency. This is the case for fourth-grade reading, for
    human resources'' compliance training, and for software engineering. We structure
    the current SimSYS Knowledge class in such a way that users can identify, prioritize,
    and select information that can be invoked for game scenarios and assessment.
    Along similar lines as the software engineering education knowledge (Abran et
    al. 2004), content information in SimSYS is divided into subdisciplinary areas,
    with each area divided into smaller units and topics. Although not all levels
    of the Knowledge class are necessary for every game, it does provide flexibility
    for greater variety and scalability.


    To align game challenges with different types of mastery over the BOK, the student
    player''s knowledge in SimSYS is categorized through a learning taxonomy. This
    allows for knowledge and skills assessment at different levels and through varied
    forms of assessment. The Learning class represents the skills and abilities reflected
    in the game learning objectives. In developing SimSYS, we use Bloom''s taxonomy
    as the types of skills that student players must demonstrate a level of competency
    in the educational game challenges (Anderson and Krathwohl 2001). For each knowledge
    base topic, one or several of Bloom taxonomy levels can be assigned, indicating
    what skill level graduates should possess. The six skills we draw from Bloom''s
    taxonomy are knowledge (remembering learned material), comprehension (understanding
    information and the meaning of course content), application (ability to use the
    learned material in new'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'and concrete situations), synthesis and analysis (seeing the connections and
    components of larger systems), and evaluation (being able to assess the value
    of varied and variable information within specific contexts and requirements).
    Different challenges are designed to pull from different levels of thought. For
    example, if content retention is the desired type of learning that needs assessment,
    then the instructor can toggle a Dialog challenge asking students to demonstrate
    knowing a term’s definition in a conversation with an inquisitive NPC. Likewise,
    more complex challenges would require demonstrating higher skill sets within the
    simulation game, thereby providing opportunities for increased knowledge and skills
    building.


    The Challenge class holds different formative educational activities that are
    tied to specific, faculty-defined learning outcomes. As it is the linchpin of
    the educational simulation game, we developed additional modalities onto the Challenge
    class to allow for a wider range of possible learning opportunities. Challenges
    represent traditional, formative educational opportunities. Challenges are populated
    by NPCs who function in a variety of roles to communicate, assist, or complicate
    the challenge for the student protagonist. The challenges are situated in a plotline
    wherein the student is seeking to advance. It is this narrative context, and possible
    competition against player and nonplayer adversaries, that makes the challenge
    fun and imaginative rather than a text-based multiple-choice test or written assignment.


    To enable different levels of learning and difficulty, the Challenge class is
    divided into two subcategories: Expression and Conditions. There are three Expression
    forms by which the game’s assessment takes place: Dialog, Deliberation, and Composition.
    There are five Conditions forms that affect limitations and motivations for student
    players in their engaging with the Challenges: Timed, Limited Resources, Rewards/Punishment,
    Competition and Collaboration with the NPC Antagonist character. In the dialog
    Challenge, an Interlocutor NPC asks the student player a line of questions, which
    require content knowledge at first but embedded follow-up questions require both
    understanding and appropriate applications of that knowledge. This encourages
    a Socratic approach to learning in the game and encourages student players to
    demonstrate their mastery of course content in a more engaged manner. Primarily,
    the Dialog Challenge appeals to lower levels of a learning taxonomy such as Bloom’s
    (i.e., knowledge, understanding, application). For example, an Interlocutor NPC
    in the role of a Staff Sargent can ask the student player'
