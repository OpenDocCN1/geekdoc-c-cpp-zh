    # ### 5.4 DISCUSSION


    Educational software engineering is closely related to the field of educational
    games [30] (i.e., games for education), with example conferences such as the Games+Learning+Society
    Conference (http://www.gameslearning-society.org/conference) and example initiatives
    such as the MacArthur Digital Media and Learning initiative (http://www.macfound.org/programs/learning).
    The field of educational games typically focuses on gaming technologies for supporting
    educational purposes, whereas educational software engineering typically focuses
    on software engineering technologies for supporting educational purposes. In the
    context of Pex4Fun and Code Hunt, the field of educational games would focus more
    on the aspect of gaming (Section 5.3) whereas the field of educational software
    engineering would focus more on the aspect of software engineering technologies
    (Section 5.3.1). Note that educational software engineering deals with not only
    educational games but also other educational tools not being games.


    In addition, it is reasonable to consider that software engineering for developing
    educational games or generally educational tools (such as software quality assurance
    for educational game software) would be part of educational software engineering.
    In other words, educational software engineering'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'is not limited to software engineering technologies as infrastructure support
    for educational tools (as exemplified by Pex4Fun and Code Hunt) and can also include
    software engineering tools or processes to assist the development of educational
    tools.


    We advocate educational software engineering to be within software engineering
    research and to contribute to software engineering research in three example ways:


    +   1. First, when targeting educational tasks, researchers may be able to leverage
    or develop software engineering technologies (to be effective for such tasks),
    which generally may not be effective or mature enough to deal with tasks related
    to software industry. An example case would be developing program synthesis technologies
    for educational tasks [5–7]. Another example case would be developing test generation
    technologies for Pex4Fun and Code Hunt, because secret implementations created
    for coding duels tend to be simpler than real-world code implementations.

    +   2. Second, targeting at educational tasks may pose unique requirements for
    software engineering technologies. For example, test generation for software engineering
    tasks such as achieving code coverage aims at generating and reporting test inputs
    that can achieve new code coverage. However, test generation for Pex4Fun and Code
    Hunt aims at generating and reporting test inputs that can serve as feedback to
    achieve effective learning purposes.

    +   3. Some educational tasks (such as intelligent tutoring [14] and problem generation
    [5–7]) call for creation of new software engineering technologies, which may not
    exist in traditional software engineering (because there are no counterparts in
    the software engineering domain for such tasks in the education domain).


    # 5.5 CONCLUSION


    In this chapter, we have defined and advocated educational software engineering
    as an emerging subfield of software engineering. Educational software engineering
    develops software engineering technologies for general educational tasks. In this
    subfield, gaming technologies often play an important role together with software
    engineering technologies. We have presented Pex4Fun (along with Code Hunt), one
    of our recent examples on leveraging software'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'engineering and gaming technologies for teaching and learning programming and
    software engineering skills. Pex4Fun and Code Hunt can also be used in the context
    of MOOCs to address issues such as automatic grading.


