    # 6.6 THREATS TO VALIDITY


    The discussion of validity is based on the *qualitative validity* criteria described
    in reference [19].


    We spent sufficient time (2 years) on developing the four serious games. During
    these two years, we observed and iteratively interviewed participants from different
    domains such as developers, game designers, players, learners, tutors, psychologists,
    and pedagogues. We also worked together with developers, other professionals,
    and researchers.


    We worked with developers coming from different contexts and cultures. We also
    used a variety of development techniques and processes for different iterations
    and different games. We worked on the same questions at different points of time
    with the same developers. Additionally, a different researcher worked on analyzing
    the data.


    We also examined different cases where the adaptivity method would contradict
    our assumptions and results. In one of these cases, for example, we developed
    a prototype that was adapting too fast to the player’s answering speed. We conducted
    postproject interviews using retrospective interviewing methods to let participants
    reflect on the findings.


    External audits were conducted to foster the accuracy and validity of the study.
    We let researchers and developers not involved in the research process examine
    both the process of the study and the results of the interviews and resulting
    games.


    Transferability is described by Lincoln and Guba [19] as a way of achieving a
    type of external validity. We are confident that our results are applicable to
    a wide variety of domains. However, learning with serious games may differ for
    different domains.


