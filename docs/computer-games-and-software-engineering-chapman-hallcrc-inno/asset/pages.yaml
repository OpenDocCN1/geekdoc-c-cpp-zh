    motorical skills and the skills related to learning content determined by tutors.


    Additionally, we observed that changes in game elements are well suited to change
    the difficulty of the game. A change of learning content is not necessary in all
    cases. This is especially true for skills, where quick retrieval is crucial. Therefore,
