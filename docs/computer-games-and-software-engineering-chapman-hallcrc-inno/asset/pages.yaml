    study participant. Although it seems like a small thing, in fact, questions and
    behaviors that are natural to ask the participant may never arise in a lab setting
    (Grimes and Russell 2007). Researchers can learn a good deal about participants
    and their motivations in this way, but the observed behavior happens in a controlled
    and artificial setting and may not be representative of behavior that would be
    observed “in the wild.”


    In the lab setting study, a person may invest more time to complete a task in
    the lab than he or she might otherwise to please the investigator (Dell et al.
    2012). In addition, laboratory studies are often expensive in terms of the time
    required to collect the data and the number of different people and systems that
    can be studied.


    The micro level of study is useful, but does not answer all of the questions one
    might have about game play in a more ordinary setting.


    # 9.4.2 Meso Level: How Humans Behave Minute by Minute


    At the meso level of study, research is done to determine how system users perform
    tasks of interest (play the game) and to collect information that cannot be gathered
    in any other way (e.g., direct observation of affective responses to a computer
    game).


    The meso-level research approach is primarily to perform field studies of user
    behavior, that is, to collect data from participants in their natural'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'environments as they go about their activities. Data collected in this manner
    tend to be less artificial than in lab studies, but also less controlled, in both
    positive ways (as when the participant does something completely unexpected) and
    negative ways (as when the presence of the researchers influences their natural
    behaviors).


    In particular, we were interested in natural use phenomena (the full complex of
    interactions, ads, distractions, multitasking, etc.) in the AGAD game. Unlike
    a more deeply engaging game such as quest game, AGAD was always intended to be
    a short-duration, low-overhead, small-investment game play. Therefore, we wanted
    to understand how people would play the game, that is, what would cause them to
    start the game, why would they stop playing, what did they find engaging about
    the game, what was disruptive during game play, and what were the drivers for
    returning to the game?


    In a series of studies, we would interview AGAD players as they used the game
    for the first time (to identify initial reactions and learnability questions),
    and later we interviewed repeat players to identify reasons for returning to the
    game.


    The 15 interviews (fortunately) identified almost no learnability issues—the game
    was simple enough that the design was straightforward.


    However, the interviews also asked various AGAD questions of varying degrees of
    difficulty. One question we asked was as follows: This member of the *Lepidoptera*
    increases its weight nearly 10,000-fold in a fortnight. What is its name?


    As we watched, we learned quickly that this question (as it was for many others)
    had challenging vocabulary and concepts. People did not know what a *Lepidoptera*
    was or what a fortnight was. This led to interesting misreadings and varying reactions.
    This, we learned, is a problem for all such “question asking/trivia question”
    games.


    In this particular case, the term *Lepidoptera* led many people to highly technical
    articles (e.g., from entomology journals), which in turn use words such as *instar*
    and *mitochondrial transformation*. However, highly motivated game players would
    work through these issues and get to the answer, feeling a distinct sense of victory.


    Other more casual players would simply give up at that point, causing us to add
    in the Skip question feature and Clue feature, which would show the number of
    letters in the answer with one or two letters shown. (There was a Hint button
    from the original design, but given that so many of our observations were about
    people getting frustrated, this suggested the Clue'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'modification to help people who were having difficulty, but not to disclose
    anything to players who really wanted to solve the full challenge.)


    From a game design perspective, this kind of mesoscale user behavior in a natural
    setting was invaluable. It is the kind of information that can deeply influence
    a system design by providing feedback during the course of play. It is the kind
    of player behavior that is impossible to abstract from microscale behaviors and
    difficult to infer from the macro level.


    # 9.4.3 Macro Level: How Humans Behave over Days and in the Large


    Although mesoscale studies are very natural, macro studies collect the most natural
    observations of people as they use systems in large quantities over longer periods
    of time. This is generally done by logging behavior from in situ, naturalistic
    behaviors that are uninfluenced by the presence experimenters or observers. As
    the amount of log data collected increases, log studies increasingly include many
    different kinds of people, from all over the world, doing many different kinds
    of tasks. However, because of the way log data are gathered, much less is known
    about the people being observed or the context in which the observed behaviors
    occur than in field or lab studies.


    Games also have begun using analytics over logs, especially in age of web-based
    games. Thawornmas (2008) used logs analysis to find bot players in massively-multiplayer
    online role-playing games (MMORPGs), whereas Itsuki et al. (2010) looked for “real-time
    money trading” in games. Dow et al. (2010) used a mesoscale interview approach
