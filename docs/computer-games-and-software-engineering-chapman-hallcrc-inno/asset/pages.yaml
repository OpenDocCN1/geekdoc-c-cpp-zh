    # ## 8.5 SUMMARY


    I have briefly overviewed the motivation for healthy outdoor multiplayer smart
    phone games and the challenges they bring for software engineering. I have also
    provided overviews of three implemented games that have allowed experimentation
    with the concepts and provided initial trials of the GGA and RRC.


    In scratching the surface of the many challenges brought by this game domain,
    I have touched on five facets of software engineering:


    +   1. Architecture—Communications and full distribution problems

    +   2. Design—Distributed joint state problem and RRC

    +   3. Coding—Cross-platform coding problem

    +   4. Requirements—Requirements restriction problem

    +   5. Validation—Semantic validation and pragmatic testing problems


    In short, this is a rich and challenging area that is ripe for research that can
    contribute toward worthwhile social goals.


