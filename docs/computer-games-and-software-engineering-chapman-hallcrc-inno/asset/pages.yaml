    game elements according to (C) the student''s individual ZPD as necessary and
    using the principles of (D) MKO, where adaptivity is an MKO for the learner according
    to the social development theory.


    According to this definition, the adaptivity process in a serious game consists
    of four stages: monitoring players (A1), learner characterization (A2), assessment
    generation (B1), and adaptive intervention (B2). We note here that adaptivity
    describes in this definition the following four factors: A, B, C, and D.


    Factor (A): The adaptive serious game monitors the learner using possible sensors
    and the state-of-the-art technology. All observations are used for collecting
    user data and characterizing the user (e.g., rating his or her mathematical skills).


    Factor (B): The adaptive serious game adapts both game elements and learning content.
    There are game elements that affect the ability to solve the tasks related to
    learning content (e.g., the speed of a car that moves fast over the screen, where
    something is written on the car, and where the goal of the learner is to interpret
    the content). Those *adaptable* properties can provide powerful tools to adapt
    to a specific learner more fluently, although changes in learning content very
    often lead to discreet big jumps in the level of difficulty.


    Factor (C): The adaptive serious game always individually challenges each learner.


    Factor (D): The adaptive serious game takes the role of the MKO in the social
    development theory, where the following statement can be applied: Every function
    in the child''s cultural development appears twice—first, on the social level,
    and second, on the individual level. The social level can be an interaction with
    the serious game or with peers in the serious game.


    *An adaptive serious game is a serious game that implements the adaptivity approach.*


    We can then map adaptation approaches as used in e-learning and ITS [20,21] to
    the definition of adaptivity in serious games:


    +   - Micro adaptive approach—Adaptivity with adjustments made in the game on
