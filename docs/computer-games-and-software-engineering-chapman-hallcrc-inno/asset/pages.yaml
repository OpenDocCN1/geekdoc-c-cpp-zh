  md: '+   3.4  Conclusions and Future Work　　　　　　　　　　　　　83

    +   References　　　　　　　　　　　　　　　　　　　　　　　　　84

    +   Appendix 3A: Semiformal Model—Tabular, Tailored Use Case

    +   for Challenge 1　　　　　　　　　　　　　　　　　　　　　　87


    **Abstract:** Educational infrastructure faces significant challenges, including
    the need to rapidly, widely, and cost-effectively introduce new or revised course
    material; encourage the broad participation of students; and address changing
    student motivations and attitudes. The course material needs to address learning
    objectives, which span standardized subject-specific content and transferable
    skills, such as collaboration, critical thinking, creative thinking, problem solving,
    reasoning abilities, learning to learn, and decision making that span diverse
    domains. Serious educational games have significant pedagogical potential as they
    provide immersive, engaging, and fun environments for students. To improve their
    development, our research project SimSYS provides a model-driven engineering-based
    approach that uniquely integrates elements of traditional entertainment game design,
    pedagogical content, and software engineering methodologies. Our approach has
    three main steps: (1) create an informal model of the game (captured like a storyboard
    with textual descriptions of the learning objectives and game play in addition
    to user interface concepts, e.g., graphics and audio); (2) transform the informal
    model into a semiformal, tailored Unified Modeling Language use case model (visual
    and tabular, template-based specifications); and (3) transform the semiformal
    model into formal, executable models (e.g., extensible markup language [XML],
    which can be loaded and played in the game engine). Our approach can be applied
    in an agile, iterative development process, for example, by describing a part
    of the game informally, semiformaly, and formally (executable), allowing earlier
    assessment and feedback on a running (partial) game. A key feature of our approach
    is the thorough integration of learning objectives, for both topic-specific subject
    matter and transferable skills.


    **Keywords:** Serious educational game engineering, model-driven engineering,
    learning objectives, transferable skills


    # 3.1  INTRODUCTION


    Educational infrastructure from elementary to higher education to corporate training
    faces significant challenges with increasingly limited resources. Course materials
    need to address concrete learning objectives,'
  merge: -1
  img_proc: true
