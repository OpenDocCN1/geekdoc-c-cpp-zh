  md: '# ### 11.3.1 Case 1—Producing Functionally Similar Games


    One of the first game R&D projects focused on producing games for young students
    in grades K–6 that focused on informal life science education (Scacchi et al.
    2008). These games were envisioned as part of a science learning game environment
    called *DinoQuest Online* for free-to-play, web-based deployment. It was designed
    to complement and interoperate with an on-site interactive, hands-on science exhibit
    called *DinoQuest*, located at the Discovery Science Center (a family-friendly
    science museum) in Santa Ana, California (Scacchi et al. 2008). Our starting point
    was to develop games for learning life sciences appropriate for primary/elementary
    school students, focusing on dinosaurs as prehistoric living creatures. Such creatures,
    like other living animals or humans, have basic body systems (e.g., skeletal,
    nervous, digestive, reproductive, cardiopulmonary), and an understanding of what
    these systems are, what they do, and how they do it; interrelationships of these
    body systems is fundamental, as is the understanding of the ecologies in which
    these creatures thrive, survive, and die. The ecologies include relationships
    among creatures of different species, such as relationships indicating prey–predator,
    food chains, and *circle of life*, all of which are foundational to contemporary
    life science in the worlds in which people and animals live. So how might we design
    a game or a play mechanic that would highlight these ecological relationships?
    Our inspiration came from the core play mechanics of *Tetris* and *Dr. Mario*,
    displayed in Figure 11.1.


    *Tetris* and *Dr. Mario* are tile-matching puzzle games, where sets of geometric
    colored tile patterns (sometimes called, *tetrominoes* in homage to dominoes)
    arrive/fall into the game play space (the playing field), and


    ![](img/8edd7838aa9e4a0d883fcf44f4b667a0_263_0.png)'
