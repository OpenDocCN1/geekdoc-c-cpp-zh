    From this kind of information, we learned that it is difficult to write questions
    that would be engaging without being intimidating. Player reactions are crucial.
    As a side effect of the meso-level data analysis, we decided to add a Feedback
    button on the UI so players could connect directly with the design team. Although
    it generates a fair number of empty messages (when people click on the button
    but do not enter any commentary), we found that complaints about mistakes in the
    questions/answers could be fixed rapidly, once we knew about the issue. In effect,
    the Feedback button became a meso-level data feed that helped to improve the game''s
    quality overall, as well as providing a base-line sense for how the game was performing.


    Macro-level data tell the story of how the game is performing in the large and
    in the wild. With macro-level data, we knew that the game began performing well
    almost immediately. We understood the ways in which players returned to the site,
    how often they returned, and how long they would engage. As shown in Figure 9.7,
