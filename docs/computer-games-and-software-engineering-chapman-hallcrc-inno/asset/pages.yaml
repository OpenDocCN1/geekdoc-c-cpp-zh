    # 10.6.1.3  Outputting the AI


    Once the AI is complete, the final step is to output the AI. For a typical game,
    this will be in the form of a class or .xml file defining the AI. Scythe AI automatically
    builds this file from the constructed AI. Output also includes both the .scxml
    statechart and the source Java file for each AI module. Scythe AI will modify
    output.scxml files to account for any event renaming that has occurred. The source
    game must be able to accept these files as input.


    In our experimentation, we output to the game Mammoth, an massively multiplayer
    online (MMO) research framework. Importantly, Mammoth allows NPCs to be defined
    externally using XML files, written in Java, and has an SCXML execution environment.
    Thus, our output profile for Mammoth writes the external XML definition, which
    delineates the exact SCXML/Java pairings and provides specific values for parameters.


    # 10.7  CONCLUSIONS AND FUTURE WORK


    There is strong commonality within game AIs, even between apparently different
    character classes—certainly at a high level, NPCs have many similar behaviors.
    Historically, however, reuse has been complicated by a focus on context-dependent
    reactive behavior, and the need to express'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'the AI in terms of strong code dependencies. As we have shown here, a statechart-based
    approach greatly helps in exposing the reuse opportunities, encapsulating the
    reuse at an appropriate level that encompasses not just a specific mechanic, but
    the high-level, behavioral abstraction. By composing functional groups of behaviors,
    novel AIs can then be directly constructed from a library of AI modules, a very
    practical strategy we demonstrate in the design of the Scythe AI development tool.


    A primary benefit of formalizing reuse as we have done is in further being able
    to validate and perhaps even procedurally generate new AIs. Our design facilitates
    model checking and verification, and as part of future work, we are developing
    analyses that help in identifying and avoiding some of the more intricate logical
    errors that may arise in combining larger and more complex AI modules. Implicit
    state or message dependencies, for example, are a potential concern that may be
    addressed through deeper analysis of functional group behaviors, as well as through
    more formal means of specifying statechart interactions, such as found in protocol
    state machines.


    Application of this reuse approach to more complex AIs is certainly possible.
    For example, NPCs in first-person shooter games employ tactical movement and cover,
    squad behaviors, and extensive combat behaviors such as ranged and melee weapons,
    vehicle-based combat, and fleeing. The *HALO* AI, taken from the successful *HALO*
    line of games, was reworked into the layered-statechart approach [19], and found
    to require 48 statecharts. This granularity affords considerable flexibility to
    the developer practicing reuse and provides an excellent start to any reuse library.


