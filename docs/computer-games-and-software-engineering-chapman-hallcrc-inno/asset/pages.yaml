- pgno: 77
  md: 'rigorous, state machine-based foundation, but may be more difficult for some
    stakeholders to use. Game designers with experience working with storyboards,
    for example, may find a tabular use case specification format easy to learn and
    use. Storyboards are often presented as a sequence of cells in a tabular format.
    Tabular specifications are well established in requirements engineering (Pollack
    et al. 1971; Heitmeyer et al. 1996). They are considered straightforward to define,
    understand, and maintain.


    The remainder of this chapter is structured as follows. Section 3.2 presents an
    outline of the semantic building blocks that serves as a meta-model for SimSYS
    development. Section 3.3 presents an overview of the SimSYS MDE-based approach,
    including the informal model, semiformal model, and formal models; a test game
    example is discussed for illustration. Section 3.4 conclusions and recommendations
    for future work.


    # ### 3.2 HOLISTIC APPROACH TO SEGs


    As noted above, aligning game design with pedagogical goals in mind poses a challenge
    for creating SEGs. Likewise, scalability, economics, and contextual flexibility
    prove to be a consistent difficulty. To address this, we outline a holistic view
    to gaming and learning by outlining a semantic construct that defines the elemental
    building blocks with rules to govern their interplay (Figure 3.2). These blocks
    and the rules that affect them provide a structure upon which similar categories
    of game play components may be designed across a greater variety of contexts.
    The result can provide myriad opportunities of player experiences within a pedagogically
    sound learning environment. Our initial meta-model approach establishes that educational
    games are immersive, entertaining environments that embed specific learning objectives
    into challenges that require proficiency of particular skills as classified by
    a learning taxonomy.


    ![](img/8edd7838aa9e4a0d883fcf44f4b667a0_77_0.png)


    FIGURE 3.2 Educational game elements.'
