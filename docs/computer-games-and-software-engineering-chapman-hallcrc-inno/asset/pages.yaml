  md: '# 8.3 ENGINEERING CHALLENGES


    Outdoor multiplayer games as discussed earlier bring challenges to software engineering
    in at least five phases: architecture, design, coding, validation, and requirements.


    # 8.3.1 Architecture


    Outdoor play in natural environments such as parks, beaches, and remote camps
    will often involve play without or with weak network coverage, with no WiFi hot
    spots or even 3G coverage available. The devices, however, are capable of device-to-device
    *ad hoc* networking. This will generally mean that communications between distant
    players will become disconnected unpredictably and for extended periods. For example,
    two iTESS players might run off into a valley while continuing to shoot at each
    other, yet still be out of network contact with the other players due to terrain.
    Similarly, subsets of iTron or Butterflies players can move apart, to opposite
    sides of a building, for example. Because to be successful the game experience
    must continue (to the extent physically possible) even when out of infrastructure
    coverage areas and even when partitioned from distant players, I term this first
    major problem in architecting an outdoor smart phone game the *communication problem*.


    Following from this first problem is the fact that any two devices can become
    unpredictably partitioned from one another for extended periods. This means that
    *game experience must not require a central controller*. That is, for games intended
    for play in remote areas, not only can we not require a console or Internet game
    server in the architecture of the game, but also we cannot even designate one
    of the smart phones as the controller. If we did so, any time devices become partitioned
    away from it, they lose game experience until contact is reestablished. I term
    this the *full distribution problem*.


    Finally, another architecture issue, the *long-range play problem* concerns games
    playable at long distances. It makes perfect sense for a group in California to
    play iTESS against groups in New Jersey, the United Kingdom, and Tokyo. Obviously,
    this requires Internet connectivity, because device-to-device relaying is clearly
    inadequate. If we assume that enough players have devices that are in coverage
    of an Internet access point (e.g., receiving 3G/GSM coverage), we would like our
    game architecture to support the communications necessary as seamlessly as possible.


    My initial progress on attacking these problems is captured in the *Geocast Games
    Architecture* (GGA) (see Section 8.4).'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# ### 8.3.2 Design


    When designing games involving virtual structures, objects, or creatures that
    can have evolving states, there is a need for the game system to manage state
    evolution in a way that yields the desired game experience to all players. As
    an example, consider virtual creature control. A butterfly that reacts to human
    proximity by flying away changes state in response to environment events. But
    how do players located away from this butterfly''s location, maybe even network
    partitioned from the area, gain a coherent view of its state? The problem is compounded
    when events from *multiple* different devices cause state changes, as we must
    be concerned with how the different players view the creature, given that different
    subsets of players will have been made aware of different subsets of the events.
    Figure 8.6 shows screen captures from two Butterflies players at nearly the same
    time; the two players have been out of network contact due to being on opposite
    sides of a building. Consequently, their devices have different views of what
    the butterflies have been doing. Positions of butterflies and even positions of
    other players are significantly different. This


