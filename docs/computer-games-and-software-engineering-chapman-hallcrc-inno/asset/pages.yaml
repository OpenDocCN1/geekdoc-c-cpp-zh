    In the context of serious games based on the technology that is available today,
    we can base the adaptivity definitions without restrictions on the social development
    theory.


    The definition of *adaptivity* in serious game is based on the definition of ZPD.
    We define adaptivity in the following way:


    Adaptivity in Serious Games is an approach that enables a serious game to (A)
    learn from learner’s behavior by (AI) intelligently monitoring and'
