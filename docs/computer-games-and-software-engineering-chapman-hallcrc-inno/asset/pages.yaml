    seek to support or provide such capabilities.


    In Chapter 8, Hall, from AT&T Labs, describes advances in the provision and geocast
    sharing of game players and play object locations for use in outdoor mobile environments.
    Future augmented reality games that support visualization overlay capabilities
    on a player''s viewport (e.g., via Google Glass or similar device) may be able
    to take advantage of these capabilities. Similarly, alternate or mixed reality
    games that support multiple heterogeneous devices (mobile health accessories,
    networked watches, smart cars, etc.) that can locally network with mobile devices
    may also be opportunity areas for geocasting system designs. Hall''s work also
    demonstrates ways to tie back geo-located mobile games development to traditional
    SE concerns, which could, therefore, also be employed for future geocasting game
    software systems.


    In Chapter 9, Russell describes how multilevel data analytics can be employed
    to support UX assessments during the development of the serious game, AGoogleADay,
    for research and experimental studies of end-user search practices with the Google
    search service. The role of UX, as a key factor driving the ongoing development
    and refinement of a serious game, points toward a future where such studies are
    part of the skills and capabilities of CGSE practitioners and may need to support
    the cost-effective development of large-scale web-based games. In particular,
    user play experiences studied by Russell at micro-, meso-, and macro-level point
    to the opportunity for future CGSE research in the use of data analytics to drive
    the continuous design and playtesting the UX of scalable cloud-based game development.


    In Chapter 10, Dragert, Kienzle, and Verbrugge from McGill University focus their
    attention to a scheme on how to reuse AI behaviors for different in-game nonplayer
    characters (NPCs). Such reuse more readily enables the verification and model
    checking of game software modules that can be reused within and across games.
    This, in turn, can help reduce unexpected logical errors that may arise when diverse
    AI behaviors are incorporated into different game characters, whose interactions
    may be triggered by unusual or unexplored game play events. How best to design,
    assess, package, and tailor game software modules of different types (for in-game
    characters or other behavioral objects, for the generation of game levels populated
    with NPCs, etc.) for different patterns of reuse thus appear as promising new
    directions for future CGSE research.


    In Chapter 11, Scacchi takes a complementary view of reuse, but at the level of
    repurposing game play mechanics found in the existing games.'
