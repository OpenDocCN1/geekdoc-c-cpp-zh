    Interestingly, the proxies are only using half of their CPU capacity when this
    happens. Clearly, the proxies’ CPU capacity is not a sufficient metric by itself
    to assess the quality of experience of the players, or even the load on the system.


    Figure 7.8 plots the maximum capacities for various scenarios. Simply put, to
    be able to handle twice more players, the system needs 4 times more cores. And
    this is independent of the message frequency. It is not because a game is slower
    paced that it scales more linearly. Yet slower paced games can handle more players
    per core.


    Finally, Figure 7.9 illustrates that message frequencies can result in different
    bottlenecks. We take the scenario with eight proxies and eight game servers as
