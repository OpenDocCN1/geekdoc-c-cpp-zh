    RRC. The two displays differ only in that the dot representing one’s own position
    is different for the two devices.


    This issue goes beyond the question of rapidity into how to recohere in a way
    that seems fair to players: for example, if one works hard to gain points, can
    points be taken away just because someone far away did something in the past of
    which one was unaware? Similarly, if the process of recoherence involves retracting
