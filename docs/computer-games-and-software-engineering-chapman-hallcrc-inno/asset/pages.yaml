  img_proc: true
- pgno: 141
  md: '# 5.3.2 Gaming in Pex4Fun


    The core type of Pex4Fun games is a *coding duel* where the player has to solve
    a particular programming problem. A coding duel created by a game creator (who
    could be any user of Pex4Fun) consists of two methods with the same method signature
    and return type.¹ One of these two methods is the secret (golden) implementation,
    which is not visible to the player. The other is the player implementation, which
    is visible to the player and can be an empty implementation or a faulty implementation
    of the secret implementation. The player implementation can include optional comments
    to give the player some hints in order to reduce the difficulty level of gaming.


    After a player selects a coding duel game to play, the player''s winning goal
    is to modify the player implementation (visible to the player, shown in the upper
    part of Figure 5.1) to make its behavior (in terms of the method inputs and results)
    to be the same as the secret implementation (not visible to the player). Apparently,
    without any feedback or help, the player has no way to guess how the secret implementation
    would behave. The player can get some feedback by clicking the button Ask Pex!
    (shown in the middle-left part of Figure 5.1) to request the following two types
    of feedback: (1) under what sample method input(s), the player implementation
    and the secret implementation have the same method result and (2) under what sample
    method input(s), the player implementation and the secret implementation have
    different method results. An example feedback is shown in the table near the bottom
    of Figure 5.1. In the table, the first line prefixed indicates the first type
    of feedback, and the second and third lines indicate the second type of feedback.


    As described in Section 5.3.1, Pex4Fun leverages the underlying test generation
    engine called Pex [22,23] to generate such feedback and determine whether the
    player wins the game: the player wins the game if the test generation engine cannot
    generate any method input to cause the player implementation and the secret implementation
    to have different method results.


    The design of coding duel games and the gaming platform follows a number of design
    principles [13]. For example, the games need to be interactive, and the interactions
    need to be iterative and involve multiple rounds. The feedback given to the player
    should be adaptive and personalized.


    ¹ The method signature of a coding duel must have at least one input parameter.
    The return type of a coding duel must not be void.'
  merge: -1
  img_proc: true
