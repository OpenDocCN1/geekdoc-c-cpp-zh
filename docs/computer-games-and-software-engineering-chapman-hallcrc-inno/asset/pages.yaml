    # ### 11.3.4 Case 4—Recognizing Resource Allocation Challenges with Uncertainty
    in Problem Domain


    A different repurposing opportunity emerged during a research project engagement
    with a different corporate sponsor, and later with a government sponsor. The challenge
    was to design and prototype a multiplayer virtual world, where different users
    could engage in *mission planning* problem-solving tasks found in military and
    civilian command and control systems. Mission planning refers to the activity
    of identifying and allocating available resources to remote parties who need the
    resources to complete their assigned mission (e.g., the search and rescue of victims
    in a remote location following a natural disaster). Mission planning is difficult
    in situations that are dynamic and constantly changing, as resource availability
    is characterized by uncertainty, as is the information about'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'what is the most pressing conditions or mission variables to manage at a given
    time.


    Mission planning is a kind of multiparty resource allocation with uncertainty
    problem in classical game theory. Few people are particularly adept at mission
    planning, and the consequences of allocation decisions may be very high. Subsequently,
    there is a widespread R&D effort focused on identifying *optimal* solutions to
    such allocation decisions, but little in the way of training simulators that situate
    new players in planning contexts, where they must make resource allocation decisions
    in the presence of private/shared information that is dynamic and uncertain.


    We developed and demonstrated a game-based virtual world for conducting experiments
    in a multiplayer game-based mission planning that we called *DECENT* (Scacchi
    et al. 2012). Our world building efforts were based on the user-extensible open
    source software (OSS) virtual world server and *Second Life* work-alike platform,
    *OpenSim* http://opensimulator.org/. *OpenSim* operates on a scalable massively
    multiplayer online (MMO) and a federated wide-area network environment linking
    multiple interoperable virtual worlds via the *Hypergrid* (Lopes 2011; Scacchi
    2012a). Once again, as in Case 2 for the FabLab game, we start by investigating
    and analyzing information about mission planning activities and facilities, as
    the basis for modeling and simulating the world of mission planning. Figure 11.7
    displays a collage showing a large physical facility for mission planning; adjacent
    to scenes of the virtual world we modeled to simulate it (in-world agents are
    not shown in these scenes, but they can be seen elsewhere (Scacchi et al. 2012)).
    The virtual world for experimental studies for mission planning in a decentralized
    command and control setting is called *DECENT*.


    In further brainstorming with our project sponsors based on early demonstrations
    of the *DECENT* world, our sponsors asked what kind of mission planning game play
    would be possible in such a virtual world. *OpenSim*, much like *Second Life*,
    is not a game development environment, but is an open-ended, user-extensible virtual
    world environment. Therefore, it lacks game play primitives, score keeping, and
    domain-specific scripting facilities designed for game play. However, it is open
    to user extension. After considering and debating a number of alternatives, we
    decided that the popular seven-card poker tournament game, *Texas Holdem*, would
    be our candidate for supporting mission planning game play. Accordingly, we extended
    our *DECENT* world to support this game, but utilizing the in-world user display
    screens to show both each user’s card holdings, along with the table'
