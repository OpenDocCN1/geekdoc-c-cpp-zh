    # 4.1 INTRODUCTION


    Introductory computer science courses traditionally focus on exposing students
    to basic programming and computer science theory, leaving little or no time to
    teach students about software testing [1,2,3]. A great deal of students'' mental
    model when they start learning programming is that “if it compiles and runs without
    crashing, it must work fine.” Thus, exposure to testing, even at a very basic
    level, can be very beneficial to the students [4,5]. In the short term, they will
    do better on their assignments as testing before submission might help them discover
    bugs in their implementation that they had not realized. In the long term, they
    will appreciate the importance of testing as part of the software development
    life cycle.


    However, testing can be tedious and boring, especially for students who just want
    their programs to work. Although there have been a number of approaches to bring
    testing to students early in the curriculum [3,4,5], there have been significant
    setbacks due to low student engagement and interest in testing [1]. Past efforts
    to teach students the introductory testing practices have focused on formal testing
    practices, including approaches using test-driven development [1,4].


    Kiniry and Zimmerman [6] propose a different approach to teaching another topic
    that students are often uninterested in—formal methods for verification. Their
    approach, which they call *secret ninja formal methods*, aims to teach students
    formal methods without their realizing it (in a sneaky way). We combine this *secret
    ninja* methodology with a social environment and apply it to testing in order
    to expose students to testing while avoiding any negative preconceptions about
    it.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'We propose a social approach to expose students to software testing using our
    game-like environment Highly Addictive, sociaLly Optimized (HALO) software engineering
    [7]. HALO uses massively multiplayer online role-playing game (MMORPG) motifs
    to create an engaging and collaborative development environment. It can make the
    software development process and, in particular, the testing process more fun
    and social by using themes from popular computer games such as *World of Warcraft*
    [8]. By hiding testing behind a short story and a series of quests, HALO shields
    students from discovering that they are learning testing practices. We feel that
    the engaging and social nature of HALO will make it easier to expose students
    to software testing at an early stage. We believe that this approach can encourage
    a solid foundation of testing habits, leading to future willingness to test in
    both coursework and industry.


    In addition to testing, we also want to inculcate good software design principles
    in early CS classes. We used a competitive tournament for this purpose—participation
    in the tournament for the students would be contingent upon their following good
    software design principles for their assignment. We describe our experiences on
    using these approaches in a CS2 class taught by the first author at Columbia University.


    # ## 4.2 BACKGROUND AND MOTIVATION


    # ### 4.2.1 Student Software Testing


    We have anecdotally observed many occasions in which students do not sufficiently
    test their assignments prior to submission and conducted a brief study to support
    our observations. We looked at a sampling of student performance in the second-level
    computer science course at Columbia University, COMS 1007: Object Oriented Programming
    and Design in Java during the summer of 2008. This course focuses on honing design
    and problem-solving skills, building upon students’ existing base of Java programming
    knowledge. The assignments are not typically intended to be difficult to get to
    ‘work’—the intention is to encourage students to use proper coding practices.


    With its design-oriented nature, we believe that this course presents an ideal
    opportunity to demonstrate students’ testing habits. Our assumption is that in
    this class, students who were missing (or had incorrect) functionality did so
    by accident (and did not test for it) rather than due to technical inability to
    implement the assignment. We reviewed the aggregate performance of the class (15
    students) across four assignments to gauge the opportunities for better testing.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'We found that 33% of the students had at least one “major” functionality flaw
    (defined as omitting a major requirement from the assignment) and over 85% of
    all students had multiple “minor” functionality flaws (defined as omitting individual
    parts of requirements from assignments) in at least one assignment. We believe
    that this data shows that students were not testing appropriately and suggests
    that student performance could increase from a greater focus on testing. Similar
    student testing habits have also been observed at other institutions [9].


    # ### 4.2.2 HALO Software Engineering


    HALO software engineering represents a new and social approach to software engineering.
    Using various engaging and addictive properties of collaborative computer games
    such as *World of Warcraft* [7], HALO’s goal is to make all aspects of software
    engineering more fun, increasing developer productivity and satisfaction. It represents
    software engineering tasks as *quests* and uses a storyline to bind multiple quests
    together—users must complete quests in order to advance the plot. Quests can be
    either individual, requiring a developer to work alone, or group, requiring a
    developer to form a team and work collaboratively toward their objective.


    This approach follows a growing trend to “gamify” everyday life (i.e., bring gamelike
    qualities to it) and has been popularized by alternate reality game proponents
    such as Jane McGonigal [10]. These engaging qualities can be found in even the
    simplest games, from chess to *Tetris*, and result in deep levels of player immersion
    [10]. Gamification has also been studied in education, where teachers use the
    engaging properties of games to help students focus [11].


    We leverage the inherently competitive–collaborative nature of software engineering
    in HALO by providing developers with social rewards. These social rewards harness
    operant conditioning—a model that rewards players for good behavior and encourages
    repeat behavior. Operant conditioning is a technique commonly harnessed in games
    to retain players [12,13]. Multiuser games typically use peer recognition as the
    highest reward for successful players [13].


    Simple social rewards in HALO can include titles—prefixes or suffixes for players’
    names—and levels, both of which showcase players’ successes in the game world.
    For instance, a developer who successfully closes over 500 bugs may receive the
    suffix *The Bugslayer*. For completing quests, players also receive experience
    points that accumulate, causing them to *level up* in recognition of their ongoing
    work. HALO is also designed to create an immersive'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'environment that helps developers to achieve a flow state, a technique that
    has been found to lead to increased engagement and addiction [14]. Although typically
    viewed as negative behavior, controlled addiction can be beneficial, when the
    behavior is productive, as in the case of software testing addiction. These methods
    try to motivate players similar to what is suggested in Reference [15].


    # ### 4.2.3 Software Design


    In our experience, students in early computer science classes do not understand
    or appreciate software design. We believe that this is largely because all the
    early programming they have done focuses on “getting it working.” Further, typical
    early CS assignments are a few hundred lines of Java code. Finally, most introductory
    CS courses at Columbia University (and other universities [16]) typically have
    only individual assignments and allow no collaboration on the assignments. When
    programs become larger and when you have to work in large teams, software design
    becomes a lot more critical.


    Our goal was to inculcate good software design principles via a competitive tournament
    where participation would be contingent based on the students’ code adhering to
    good design principles.


    # ## 4.3 GAMEFUL TESTING USING HALO


    As we have found that students do not test as thoroughly as they ought to, we
    use HALO to make software testing more enjoyable and fun. For example, students
    are given a number of “quests” that they need to complete. These quests are used
    to disguise standard software testing techniques such as white and black box testing,
    unit testing, and boundary value analysis. Upon completing these quests, the students
    get social rewards in the form of achievements, titles, and experience points.
    They can see how they are doing compared to other students in the class. Although
    the students think they are competing just for points and achievements, the primary
    benefit of such a system is that the students’ code gets tested a lot better than
    it normally would have. Our current prototype implementation of HALO is a plug-in
    for Eclipse and a screenshot is shown in Figure 4.1.


    # ### 4.3.1 HALO Plug-In for Eclipse


    We used HALO in a class taught at Columbia University: COMS 1007—Object-Oriented
    Programming and Design with Java. The rest of this section describes some background
    about the class, how HALO was used, and the results of our case study.'
  merge: -1
  img_proc: true
