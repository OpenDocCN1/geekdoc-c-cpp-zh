- pgno: 73
  md: 'Walker and Shelton 2008; Westera et al. 2008; Nadolski et al. 2010). In the
    end, a simulation is primarily task oriented and repetitive; it is not a game
    in that it lacks typical game trappings as described below.


    In addition to the LMS and simulation, two other recent variations of e-learning
    are currently in play in education circles. *Edutainment* is typically a rote
    exercise situated in an entertainment setting, for example, a math exercise on
    a tablet PC that requires the player to add and subtract when a game character
    levels up. Little or no learning occurs in edutainment, only the practice of previously
    acquired knowledge and skills. The concept of *gamification* has muddied the waters
    of e-learning. The term *gamification* can be described as the process of adopting
    game technology, thinking, mechanics, and game design methods outside of the gaming
    industry to solve problems and engage users (Deterding et al. 2011). Whereas gamification
    incorporates elements of games (Brathwaite and Schreiber 2008; Deterding et al.
    2011), we have determined that serious educational game development, not gamification,
    is the more productive path for effective education. Studies have already indicated
    the effectiveness of game-based learning (Prensky 2001; Gee 2003), whereas there
    are significant questions concerning the impact of gamification (Deterding et
    al. 2011).


    Refocusing now on educational computer games, let us clarify our understanding
    of games and gaming. There are different approaches to defining a game, and we
    follow traditional definitions that describe games as stated rule systems motivated
    by player competition or adversity toward particular goals or outcomes (Dempsey
    et al. 2002; Salen and Zimmerman 2004; Juul 2005). Consequently, unlike simulations
    and edutainment, inserting games into a curriculum can create a highly motivating
    learning environment; it draws on students’ sense of fantasy and amusement; it
    is self-directed, appealing to an individual student’s curiosity; and it is a
    continuous challenge wherein any existing tasks or knowledge that appears incomplete,
    inconsistent, or incorrect motivates a student to foster deeper levels of learning.
    It is necessary, however, to ensure that the game goals are in alignment with
    desired learning outcomes. And in that necessity lies the challenge for developing
    serious educational games (SEGs): creating a sophisticated pedagogically motivated
    experience using game design in which a player learns desired learning outcomes
    while playing (Malone 1980). At the same time, game development is costly and
    difficult to scale, and specific games are difficult to transfer contextually.
    These factors have typically limited the rollout and subsequent research on the
    impact of gaming in education.'
