  md: '# 4.5.2 Thoughts on CS Education a Year Later


    Our experience with using gameful elements in a classroom has been largely positive.
    The first author taught COMS 1007 again, which is now an honors CS1 class, in
    spring 2013. For that semester, we made a few changes based on our experiences
    from the previous year. We now describe our decisions and rationale behind these
    changes.


    # 4.5.2.1 Reflections on HALO


    First, we decided not to use HALO in the class. Our decision was largely based
    on two aspects: resource constraints and research challenges.


    4.5.2.1.1 Constraints  The second author developed the HALO eclipse plug-in and
    helped students set it up during the first iteration of COMS 1007. For use in
    future semesters, the plug-in would need to be updated and maintained. Creating
    student accounts and having them install and use the plug-in is straightforward
    albeit very time consuming, especially for a class with over 100 students. Note
    that the students in our classes are typically freshmen and sophomores with very
    little experience with Java and Eclipse. One option would be to get an extra TA,
    if possible, for future courses if we want to use HALO.


    4.5.2.1.2 Assignment and Quest Design  A big advantage with HALO is that there
    are no constraints with assignment creation and design. However, there are a few
    implications as far as quest design is concerned. First, creating good and fun
    quests takes a significant amount of time. In our experience, quest creation took
    about 30% of the time that it takes to create an assignment. In other words, creating
    quests for three to four assignments is about the same time as creating an entire
    new assignment. This needs to be factored in with the other time constraints that
    an instructor might have. Second, quest creation is much easier and faster if
    the same person creates both the assignment and the quests for it. In our case,
    there were a few assignments that were designed or conceived by TAs, and unfortunately,
    they could not create the quests themselves as they had not taken a software engineering
    or software testing class yet. This meant that quest creation had to be done by
    the first author, and hence needed much more time.


    4.5.2.1.3 Adaptive Quests  As the student feedback shows, we need HALO quests
    that can target both, struggling students and students who are doing well. One
    option would be to create specific sets of quests for the different'
