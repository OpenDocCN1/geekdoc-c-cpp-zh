    Now, we cannot hope to defeat the Physics of the situation; given the presence
    of communications partitions due to terrain, there is no way to keep all devices
    having identical states at all times. Fortunately, we do not need this to provide
    playable and fun game experiences. Instead, we can demand that once devices come
    back together (i.e., reestablish contact), they come to agree as quickly as possible
