- pgno: 76
  md: 'specifications); transform the semiformal model into formal, executable models
    (statechart for comprehensive simulation and XML, which can be loaded and played
    in the game engine). Our MDE-based approach can be applied in an agile, iterative
    development process, for example, by describing a part of the game informally,
    semiformaly, and formally (executable), allowing earlier assessment and feedback
    on a running (partial) game. A key feature of our approach is the thorough integration
    of learning objectives, for both topic-specific subject matter and transferable
    skills.


    In a previous work, we presented the underlying meta-model for the approach (Longstreet
    and Cooper 2012), in addition to preliminary work on the MDE-based approach (Cooper
    and Longstreet 2012a, 2012b; Cooper et al. 2014). The meta-model facilitates the
    development of high-quality, engaging educational games because it explicitly
    ties knowledge requirements, transferable skills, and course outcomes to game
    production. The key features of our meta-model are the modularization of domain-specific
    bodies of knowledge (BOKs), a learning taxonomy (e.g., Bloom’s), and skill-based
    challenges. This supports the wide adoption across curricula, as domain-specific
    knowledge can be plugged-in across multiple disciplines (e.g., STEM, humanities).
    In addition, our model situates learning opportunities in a plotline wherein the
    student player advances by succeeding against time, nonplayer adversaries, and
    his or her own best scores. Knowledge-based challenges framed by a learning taxonomy
    develop the transferable skills required by accreditation standards that also
    provide feedback to both the player and the faculty member. Situating assessment
    challenges in an immersive game environment makes them more engaging and imaginative
    than typical online tests or assignments.


    Here, we present the model refinements within the context of the overall three-step,
    iterative approach. The approach is illustrated with part of an example test game.
    Currently, our transformations are done manually; we plan to automate the transformations
    as future work and provide an intelligent, semiautomated wizard to assist in the
    creation of SEGs. Related work is available indicating that the automated transformation
    from use cases to formal models is feasible (Riebisch and Hübner 2004); prototypes
    are under way for the game generation wizard. The goal is to significantly reduce
    the effort needed to define the games and support their comprehensive verification
    with simulation tools.


    To the best of our knowledge, SimSYS is the first MDE-based approach for SEGs.
    Previous work on UML-based game specifications (e.g., Hausmann et al. 2001) has
    focused on tailoring statecharts (Harel 1987); they offer a'
