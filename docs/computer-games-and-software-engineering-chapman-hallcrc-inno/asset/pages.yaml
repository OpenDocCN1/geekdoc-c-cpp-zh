  md: '# ### 4.4 BETTER SOFTWARE DESIGN VIA A BATTLESHIP TOURNAMENT


    The second assignment for the class focused on design principles and, in particular,
    using interfaces in Java. For the assignment, which constituted 8% of the overall
    course grade, the students had to implement a battleship game. Battleship is a
    two-player board game where each player has a 10 × 10 grid to place five ships
    of different lengths at the start of the game. Each player''s grid is not visible
    to the other player, and the player needs to guess the location of the other player''s
    ships. Thus, by alternating turns, each player calls out "shots," which are grid
    locations for the other player. If a ship is present at that location, the player
    says "hit"; else it is a "miss." The game ends when one of the players has hit
    all the parts of all the opponent''s ships.


    The students needed to implement this game in Java with an emphasis on good design
    and none on the graphical aspects; the students could create any sort of user
    interface they wanted—a simple command line–based user interface would suffice
    as far as the assignment was concerned. To emphasize good design, we provided
    the students with three interfaces as a starting point for the assignment. The
    three interfaces, Game, Location, and Player, are shown in Listings 1.1, 1.2,
    and 1.3.


    To reinforce the notion of “programming to an interface, not to an implementation”
    [19], there was a tournament after the assignment submission deadline. For the
    tournament, the teaching staff would provide implementations of the Game and Location
    interfaces and use each student’s Player implementation. (In particular, the students
    were told to provide two implementations of the Player—a human player who is interactive
    and can ask the user for input and a computer player that can play automatically;
    this latter player would be used for the tournament.) As long as the students’
    code respected the interfaces, they would be able to take part in the tournament.


    The tournament logistics were as follows. First, all student players played 1000
    games against a simple AI written by the teaching staff. From these results, we
    seeded a single-elimination bracket for the student players to compete directly.
    Thus, players with good strategies would progress through the rounds and defeat
    players with weaker strategies. As an added extra incentive, there were extra
    credit points awarded to students based on how well they performed in the tournament.


    Even though the extra credit was not a lot (accounting for only 0.8% of the total
    course grade), the combination of the extra credit and the competitive aspect
    made almost the entire class participate in the tournament.'
