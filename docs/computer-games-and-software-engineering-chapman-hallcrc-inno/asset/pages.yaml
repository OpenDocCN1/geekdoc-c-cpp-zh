  md: 'software engineering curriculum, applying test-driven development to all programming
    assignments, requiring students to submit complete test cases with each of their
    assignments. Our approach is similar to these in that we also propose early and
    broad exposure to testing.


    Goldwasser proposed a highly social, competitive means to integrate software testing
    where students provided test cases that were used in each other’s code [20]. Elbaum
    et al. [1] presented Bug Hunt—a tool to teach software testing in a self-paced,
    web-driven environment. With Bug Hunt, students progress through a set of predefined
    lessons, creating test cases for sample code. Both of these approaches introduce
    testing directly into the curriculum; with HALO, we aim to introduce testing surreptitiously.


    Kiniry and Zimmerman [6] proposed teaching formal verification through secret
    ninja formal methods—an approach that avoids students’ apprehension to use complex
    mathematics by hiding it from them. The secret ninja approach differs from those
    mentioned earlier in that it exposes students to new areas without them realizing
    it. They implemented this technique at multiple institutions, receiving positive
    student responses (based on qualitative evaluations). We adapted their secret
    ninja method for HALO.


    Much work has also been done to create games to teach software engineering concepts.
    Horning and Norman [21] created Software Hut, turning the course project itself
    into a game, played out by all of the students together. SimSE and card game were
    games created to teach students software engineering through a game environment
    [22,23]. Eagle and Barnes [24] introduced a game to help students learn basic
    programming techniques: basic loops, arrays, and nested for loops. However, none
    of these games focused specifically on testing practices. There has been research
    into teaching aspects such as global software development [25] in a classroom,
    but these do not focus on software testing.


    TankBrains [26] is a collaborative and competitive game used in a CS course where
    students competed to develop better AIs. Bug Wars [27] is a classroom exercise
    where students seed bugs in code, swap examples, and compete to find the most
    bugs (in each other’s code). Although TankBrains and Bug Wars are specific programming
    activities, we present a general approach to teaching introductory computer science
    that is both cooperative and competitive.


    There have been several approaches toward integrating games into CS curricula.
    One of the earliest such attempts was Software Hut, where the authors formulated
    their project-based software engineering course as a game [21]. Groups competed
    to be the most “profitable”—where performance'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'was tracked by “program engineering dollars” (a fictional currency). This technique
    is similar to ours in that we both tracked student performance with points and
    added in other game concepts, such as quests and achievements. KommGame is an
    interface that encapsulates many collaborative software development activities
    such as creating documentation or reporting and resolving bugs and tracks each
    student with karma points [28]. This social and collaborative environment represented
    real-world open-source development environments.


    *SimSE* [23] and *Problems and Programmers* [22] are two simulation-oriented games
    that give students a “real-world” software engineering experience. Somewhat similar,
    *Wu’s Castle* [24] is a game to teach students basic programming constructs such
    as loops. These three projects are games, whereas we have built a game layer on
    top of the regular course environment.


    # ### 4.7 CONCLUSION


    In this chapter, we described how we incorporated gameful elements for teaching
    software testing and software design in a CS2 class. Students learnt software
    testing using a social learning environment. We described our HALO prototype,
    an assignment, and the accompanying quests for HALO to enhance teaching of software
    testing in a CS2 class. Students learnt software design via a competitive tournament,
    and we described details of our assignment and on how the tournament was run.
    The feedback from the students for both these aspects was largely positive.


    We believe that our approach will make testing and design more engaging and fun
    for students, leading to better systems. We also feel that this will inculcate
    good software engineering habits at an early stage.


    # ### ACKNOWLEDGMENTS


    We thank Joey J. Lee of Teachers College’s Games Research Lab and Jessica Hammer
    of Carnegie Mellon University’s Human-Computer Interaction Institute, for their
    assistance with the pedagogical aspects of this work. We thank all the students
    who participated in the COMS 1007 class. We thank the teaching assistants, Lakshya
    Bhagat, Amrita Mazumdar, Paul Palen, Laura Wilson, and Don Yu, for helping with
    the class.


    The authors are members of the Programming Systems Laboratory (PSL) at Columbia
    University. PSL is funded in part by NSF CCF-1302269, NSF CCF-1161079, NSF CNS-0905246,
    and NIH U54 CA121852.'
