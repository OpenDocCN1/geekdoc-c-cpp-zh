- pgno: 74
  md: 'In spite of the development challenges, SEGs have significant potential because
    they can provide immersive, engaging, and fun environments that require deep thinking
    and complex problem solving within a construct of overcoming obstacles and challenges
    (Gee 2003; Hämäläinen 2008; Walker and Shelton 2008; Sanchez and Olivares 2011).
    They create interactive student-centered environments rather than a passive content-centered
    classroom environment. This allows students to generate a personalized learning
    experience, progressively incorporating new knowledge and scaffolding it into
    what they already know. The possible variability within this interactive environment
    permits students to work on lower-level tasks repeatedly as they develop broader
    analytical skills and progress to complete the game objectives. Because each student
    is able to engage course-based material at his or her own pace, underprepared
    or at-risk students can focus on needed skills at their convenience. Moreover,
    feedback is frequent and immediate, thereby reinforcing mastery of fundamental
    skills that is required for advancing further into the game.


    So, if there are so many potential benefits to adopting games into curricula,
    then where do we find these games? As with other software applications, we can
    consider acquiring them off the shelf (e.g., Sanford 2006), modifying an existing
    game (Lopes and Bidarra 2011; Scacchi 2011), or developing new games. The problem
    with the first option is that off-the-shelf games are purposed with entertainment
    in mind and a curricula needs to develop around the game rather than develop through
    the game. Modifying an existing game requires specialized software development
    knowledge, and the game itself still retains a limited functional scope. Games
    are complex applications; developing new ones has been time consuming and expensive
    and has required substantial expertise from diverse stakeholders: game developers,
    software developers, educators, and players. Established game development approaches
    are document centric. Two kinds of documents are often used to specify games:
    preproduction game design document (GDD) and production game software requirements
    specification (SRS) (Rollings and Adams 2003; Oxland 2004; Gregory 2009; Adams
    2010). Although systematic, the traditional approaches have some limitations with
    respect to creating SEGs. They do not focus on developing executable versions
    of the game early on; feedback on a running game may take many months. The documents
    are developed by different stakeholders (game designers, game software developers),
    likely captured using different notations. For example, storyboard and comic-style
    representations are well suited'
