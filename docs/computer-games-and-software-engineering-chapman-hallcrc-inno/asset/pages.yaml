    # 3.3.3 Formal Model


    # 3.3.3.1 XML


    XML is a formal, textual, document markup language originally designed to easily
    distribute information across the World Wide Web (WWWC 2006). XML has been selected
    for use in this work for the following reasons:


    +   - *XML is formal and concise.* The specification for XML includes a formal
    grammar specification using Extended Backus–Naur Form notation. The grammar gives
    a comprehensive syntax for XML and provides a means for all XML documents to be
    checked for well-formedness. A well-formed XML document allows a parser that conforms
    to the XML grammar specification to parse and manipulate data from the document
    without error.'
