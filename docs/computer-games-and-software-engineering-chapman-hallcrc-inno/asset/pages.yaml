- pgno: 294
  md: 'SE processes, and technologies (e.g., Musil et al. 2010; Zook and Riedl 2013)
    can be comparatively investigated, following empirical SE approaches introduced
    30 years ago (cf. Bendifallah and Scacchi 1989; Boehm et al. 1984). Such field
    sites allow for a careful empirical study of teams using a new game SDK or development
    technique (e.g., SCRUM, agile development, game modding) versus those who do not,
    or those who produce traditional SE documents (requirements specifications, architectural
    designs, and test plans) and follow SE processes for their game versus those who
    just focus on game design methods. These game jams may, therefore, be better suited
    for longer durations (e.g., 1–2 weeks). Inter-mural or open-participation game
    jams may not be so readily structured or balanced at little cost, but instead
    may address other CGSE questions that better match their natural field organization.
    These jams may stress short duration and co-location, along with targeted game
    production on a single randomly chosen topic that is announced at the beginning
    of the competition.


    More generally, game jams offer the opportunity to organize, design, and conduct
    empirical studies in CGSE that, in turn, may inform both new game design practices
    or processes and new SE practices and technologies (Dorling and McCaffery 2012).
    These jams can be used to address CGSE research questions in ways not previously
    utilized in SE research. Ultimately, this can mean that SE can be viewed as a
    competitive team-based sport activity that can be fun for students, as well as
    structured to support a careful empirical study (Sacchi 2012a), rather than SE
    being a business endeavor to produce application systems hosted on back-end infrastructures
    accompanied by documents that few will ever read. It also suggests that game jams
    may be designed as a kind of *meta-game*, so as to structure the outcomes (i.e.,
    the games produced) to embody certain functional features, or the game production
    process to reward accumulative levels of progress achieved or skills mastered
    by different teams (*leveling up*), rather than leading to winning and losing
    teams.


    # ### 12.3.6 GSD and Global CGSE


    GSD focuses attention to challenges that arise when large software development
    projects are distributed in geographic space across many time zones. GSD often
    involves software development tasks being performed by teams that are culturally
    diverse, so that many will not share a first native language, but often may rely
    on local SE teamwork activities conducted in one’s native language, whereas inter-site
    development activities and project management may be conducted and coordinated
    in another language'
  merge: -1
  img_proc: true
- pgno: 295
  md: <!-- no content -->
  merge: -1
