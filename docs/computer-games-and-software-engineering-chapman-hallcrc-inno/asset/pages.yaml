- pgno: 176
  md: 'Probably the most popular current technique for scaling MMOs is space partitioning.
    We detail space partitioning in the next subsection. We also describe other game-specific
    techniques that help scaling while maintaining consistency and responsiveness.
    Then we look at scaling techniques applicable to MMOs from the database community
    and finish with approaches from the network and systems communities.


    # 7.2.1 Space Partitioning


    *Space partitioning* consists of splitting the game world into multiple regions
    and assigning each region to a process of the MMO system. In client–server architectures,
    the processes in charge of regions are game servers, whereas in peer-to-peer architectures,
    each peer is in charge of one region. Even though the practical feasibility of
    peer-to-peer architectures is subject to debate (e.g., Miller and Crowcroft [10]
    say “not feasible” and Hu et al. [11] say “feasible”), client–server and peer-to-peer
    really are two sides of the same coin: they both partition a game state over multiple
    machines.


    The assumption behind space partitioning dates back from the seminal virtual world
    of the early 1990s called *DIVE* [12]. In the Distributed Interactive Virtual
    Environment (DIVE), users can transfer from region to region, but they only need
    to know what happens in their current region. DIVE follows a client–server architecture.
    Each server is in charge of processing the client requests concerning the virtual
    objects in its region, as well as the handover of users from and to other regions.
    This model works well until a server has to handle too many users or objects in
    its region. There has been a lot of academic work on space partitioning [13,14].
    Most current commercial MMOs use this static space partitioning model. To prevent
    server crashes, game operators have resolved to *instancing*: they instantiate
    replicas of a particularly popular region and cap the number of players in the
    region. *The World of Warcraft* dungeon raids are a current example of instancing.


    However, instancing replicas of a region does not make that region scale. Moreover,
    in virtual worlds such as *Second Life*, where users can create objects at run
    time, the distribution of objects and users is nonuniform, and the behavior of
    objects and users is hard to predict [15]. Dynamic space partitioning aims at
    solving this problem by adapting the size and shape of regions to the object and
    user distribution so as to balance the computational and bandwidth load across
    peers (in peer-to-peer architecture) or servers (in client–server architecture).
    There are several approaches'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'to dynamic space partitioning. One approach treats regions as cells of a Voronoi
    diagram in either peer-to-peer [16] or client-server architecture [17]. Another
    approach treats regions as a set of adjacent microcells [18–20]. Yet recent work
    suggests that the amount of interactions between two regions can result in a high
    load for the two regions, thereby making spatial partitioning not suitable for
    all object or player distributions and behaviors [21]. In short, space partitioning
    is an optimization that is only efficient in certain MMO use cases, but not all.


    # ### 7.2.2 Other Game-Specific Techniques


    *Interest management* consists of notifying users and objects only about the users,
    objects, locations, or events they are interested in. For example, an avatar could
    be interested in only avatars and objects within 100 m or in chat messages directly
    addressed to that avatar. In academia, interest management has often involved
    publish-subscribe infrastructures [4], through spatial queries in peer-to-peer
    infrastructure [22], communication channels maintained by a centralized server
    [23], or a cloud-based infrastructure [24]. Commercially, interest management
    is central in EVE Online, a futuristic MMO. EVE’s servers conceptually group nearby
    spaceships in self-contained and isolated spheres. Each sphere has a particular
    channel, to which all players in the sphere subscribe to. This is an improvement
    over the traditional space partitioning, as region servers now only need to compute
    spheres and broadcast messages within spheres rather than to the entire region
    [25]. Sirikata [26] uses a twist on interest management: rather than computing
    it spatially, they compute it based on the avatar’s view of the world. Thus, clients
    receive more updates concerning objects in their frustum than updates concerning
    hidden objects. Once again, not all MMOs may be able to use interest management,
    visibility, or publish-subscribe techniques efficiently due to their design.


    *Data prioritization* is a mechanism frequently used in MMOs to reduce the bandwidth
    between peers or from the server(s) to the clients. It assumes that some messages
    are critical, whereas others are not. When bandwidth or computational resources
    become scarce, only critical messages need to be forwarded. This has been abundantly
    studied in peer-to-peer academic research [27,28].


