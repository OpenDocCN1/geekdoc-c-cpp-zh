    # 10.3 AI MODULE


    Layered statechart-based AI is built around combining individual statecharts to
    produce the overall behavior. This implies that the fundamental module is the
    statechart itself. We define an AI module as a statechart along with its associated
    class and will use this as our fundamental module in the reuse process. This is
    similar to game graphics, wherein models built from texture-mapped triangles form
    the basic reusable component. Models can easily be reused in new contexts, and
    by clearly defining the reusable component, we provide a method for AI modules
    to be just as reusable when building new game AIs.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'The pairing of statechart and the associated class is a highly appropriate
    choice for two reasons. First, statecharts act independently, and only cooperate
    due to higher level coordination. This means that the statechart itself has a
    contained execution environment, allowing for execution in any context. Second,
    each statechart has a link to an individual associated class, providing an elegant
    approach to the inclusion of source code. This pairing is advantageous as we can
    now reason at a high level about AI behavior without neglecting the implementing
    code.


    # 10.3.1 AI Module Interaction


    As modules are reused, they are removed from one context and placed into another.
    For reuse to be successful, the new context must be able to interact with the
    reused AI module. To enable reuse, there needs to be a clear description of how
    modules interact. Having this will allow us to build up an interaction profile
    for each module, supplying the information needed to correctly insert an AI module
    into a new context.


    # 10.3.1.1 Event-Based Interaction


    The statechart portion of an AI module communicates using an event-based message
    passing. Using the cooperative approach, statecharts generate events that are
    broadcast to all other statecharts in the system.


    Events generated by a statechart and consumed by other statecharts are classified
    as *output* events from the perspective of the generating statechart. These same
    events become *input* events when viewed by the consuming statechart. If an event
    is neither generated nor consumed by a statechart, then that event is irrelevant
    to that statechart and is ignored.


    In some rare cases, a statechart may both generate and consume an event, or the
    associated class may generate an event (such as the health sensor in the *HALO*
    AI) that is intended only for the statechart in the module. These self-communication
    events express logic internal to a single statechart, and so these are classified
    as *private*.


    # 10.3.1.2 Synchronous Communication


    Associated classes in AI modules communicate through synchronous method calls
    directly between modules. When reusing a module that makes synchronous method
    calls to other classes, any target modules must also be reused, or the associated
    class edited to update the call with a valid target.'
  merge: -1
  img_proc: true
- pgno: 243
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 244
  md: 'context or referenced classes must also be reused such that the associated
    class can compile correctly. If an AI module has no game imports, then it is *game
    agnostic* and can be safely reused in a different game without issue.


    The final property relates to nonmodal properties of the AI module. Such properties,
    stored as variables in the associated class, allow for customization as the module
    is reused. An example comes in the form of the `KeyItemMemorizer` module, found
    in the definition of the squirrel AI. The associated class has a type parameter.
    If a spotted item is of the same type as the type parameter, then it is a key
    item (type Acorn, in the case of the squirrel). A game implementing several important
    items (such as flowers, shirts, and boxes) could have a `KeyItemMemorizer` for
    each item relevant to the AI. When a `KeyItemMemorizer` receives an item _spotted
    event from a sensor, the payload would be inspected and compared against the key
    item parameter, and then memorized if it is a matching type. By exposing parameters
    in the interface, it makes it possible to modify them at time of reuse, and thus
    customize the module to the new context.


    # ### 10.3.2 AI Module Interface


    The motivation behind an AI module interface is to collect information relevant
    to reuse in a single location. This is similar to the Application Programming
    Interface (API) for an application or library. Proper use of a library requires
    that the API be followed; proper reuse of an AI module demands that the module
    interface be followed.


    The interface for an AI module collects and presents information on events, synchronous
    calls, parameters, and any imports. Pertinent information, such as a name for
    the module, an outline of the behavior, and the intended layer, can optionally
    be added to the interface. This means that all the information relating to the
    reuse of a module is found in a single location, making the usage of module interfaces
    a valuable tool when performing reuse. A straightforward depiction of a generic
    interface is given in Figure 10.4.


    By filling in descriptions and additional information, the interface effectively
    communicates the functionality of the module. Figure 10.5 presents the AI module
    interface for the `KeyItemMemorizer` presented in the squirrel AI, and clearly
    describes how the module works, and how it communicates.'
  merge: -1
  img_proc: true
