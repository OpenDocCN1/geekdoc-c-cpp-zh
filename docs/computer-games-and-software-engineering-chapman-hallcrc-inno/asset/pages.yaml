  md: 'concern, such as sensing data. The individual statecharts are used to cre-ate
    more complex, higher level groups of intelligent behavior; the exhib-ited behavior
    is a function of the superposition of states. Under this model, the lowest layer
    contains sensors, which read events created as the game state changes. Events
    are passed up to analyzers that interpret and com-bine diverse data from sensors
    to form a coherent view of the game state. The next layer contains memorizers
    that store analyzed data and complex state information. The highest layer is the
    strategic decider, which reacts to analyzed and memorized data and chooses a high-level
    goal. The high-level goal triggers a tactical decider to determine how it will
    be executed. Ultimately, executors contained in another layer enact decisions
    in order to translate goals into actions. Depending on the current state of the
    NPC, certain commands can cause conflicts or suboptimal courses of action, which
    are corrected by coordinators. The final layer contains actuators, which modify
    the game state.


    The reuse approach is illustrated by creating a garbage collector NPC through
    the reuse of large portions of the AI designed for a squirrel NPC. By treating
    the AI as a collection of interacting modules, many behavioral similarities emerge;
    two-thirds of the AI modules in the garbage collector are reused from the squirrel.
    The authors have also created tool support to demonstrate the practical potential
    of their approach. The tool directs and facilitates the development process, taking
    in statecharts and associated classes, providing an interface for producing novel
    AIs from a library of behaviors, and exporting code that can be directly incorporated
    into a game. By formally representing and understanding the game code associated
    with specific behaviors, the constructed AI can be rigorously analyzed, ensuring
    that code and functional group dependencies are properly satisfied.


    A collection of five case studies exploring the issue of reuse in game play mechanics
    from a repurposing perspective on the design of CGs and game-based virtual worlds
    is presented by Walt Scacchi in Chapter 11. The case studies are research and
    development projects that have been created with diverse purposes, target audiences,
    and external collaborators over an extended period of time. The projects include
    a K-6 educational game on informal life science education; training for technicians
    in advanced, semiconductor manufacturing; training for newly hired personnel on
    business processes; training for state employees on sexual harassment; multiplayer
    mission planning; and games on science mission research projects. In their creation,
    designers have drawn upon design-level, game play mechanics to reuse from the
    existing games; here the collection of'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'case studies is analyzed from this repurposing perspective. For example, the
    first case study focuses on games for students in grade K-6 on informal life science
    education. The games were on dinosaurs and their ecology, encompassing fundamental
    relationships that evolve over time including prey–predator food chains and the
    circle of life (mulk contributes to the plants, plants to herbivores, herbivores
    to carnivores, and carnivores to mulch). The design of the game play mechanics
    to highlight these relationships was drawn from tile-matching puzzle games, Tetris
    and Dr. Mario, where game play is motivated by time: the patterns fall into and
    progress across the playing field at a certain pace. In the new game, tiles for
    mulch, plants, herbivores, and carnivores are used. When carnivores (predators)
    align with herbivores (prey), they form a simple food chain, allowing the survival
    of the carnivores and the consumption of the prey.


    The analysis of these case studies identifies five ways to repurpose game play
    mechanics: (1) appropriating play mechanics from functional similar games, as
    briefly described above; (2) modding game play levels, characters, and weapons
    through a game-specific SDK; (3) substituting in-game character/NPC dialogs along
    with adopting multiplayer role-playing scenarios; (4) employing play mechanisms
    for resource allocation with uncertainty that reenact classic game theory problems;
    and (5) identifying game design patterns (quests, multiplayer role-playing) that
    can be used to develop families of games across science research problem-solving
    domains.


    This study provides the community with a foundation to systematically observe,
    identify, conceptually extract, generalize, and then specialize or tailor game
    play mechanics that are provided in the existing games. Such study can also inform
    how best to design or generate game content assets (e.g., NPCs, behavioral objects,
    extensible rule sets for modifying game play mechanics) for modding or repurposing,
    along with how software domain analysis and modeling techniques can support them.


    Finally, in Chapter 12, Walt Scacchi and Kendra Cooper review the follow-on ideas
    and suggestions identified in the preceding chapters to serve as an outline for
    identifying an agenda for the future of research in CGSE.


    # 1.6 SUMMARY


    This chapter serves as an introduction to this collection of research papers in
    the area of CGs and SE—a first. It starts with a brief recapitulation of the history
    of CG software development that helps set the stage for the introduction of the
    research contributions in the chapters that follow. Chapters 2 through 11 are
    the core of this book, which is followed by a brief outlook'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'on the future of research in CG and SE, as both are identified within the contributing
    chapters, as well as with respect to some of the grand challenges in SE, and other
    complementary R&D opportunities for CGSE.


