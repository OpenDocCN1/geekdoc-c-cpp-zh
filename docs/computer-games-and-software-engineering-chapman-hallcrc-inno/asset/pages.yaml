    **Abstract:** This chapter presents the results of a literature survey on the
    use of game development in software engineering (SE) and computer science (CS)
    education. Games and game development have been used in recent years to increase
    motivation, engagement, and learning, and to promote careers in software and computers.
    The authors present a bird’s eye perspective on how game development has been
    used in recent years to teach other things than just game development.


    The literature survey includes research articles from the period 2004 to 2012,
    and it investigates among other things in what context game development has been
    used, the subjects and topics taught through game development, and what tools
    and frameworks are being used for game development to learn SE and CS. Further,
    this chapter includes a description of how game development was used in our software
    architecture course at the Norwegian University of Science and Technology (NTNU)
    and the experiences gained from running this course. Finally, we provide our recommendations
    for choosing an appropriate game development framework for teaching SE and CS.


    # 2.1 INTRODUCTION


    Games are increasingly being used in education to improve academic achievement,
    motivation, and classroom dynamics (Rosas et al. 2003). Games are not only used
    to teach young school children, but also used to improve the quality of university
    education (Sharples 2000). There are many good examples of SE and CS education
    benefiting from use of games and game development for teaching (Baker et al. 2003;
    Natvig et al. 2004; Navarro and Hoek 2004; El-Nasr and Smith 2006; Foss and Eikaas
    2006; Distasio and Way 2007; Sindre et al. 2009). Over the years, several papers
    have been published that describe how game development has been used to promote,
    motivate, or teach SE and CS. The goal of this chapter is to present results from
    this research through a literature study ranging from the years 2004 to 2012.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Further, some of our own experiences from teaching software architecture through
    game development from 2008 to 2013 have been included. One very important factor
    when incorporating game development into a CS/SE course is the choice of an appropriate
    game development framework (GDF) and tools. We have included six recommendations
    that should be considered when choosing a GDF for a CS/SE course have been included.


    This chapter answers the following research questions:


    +   - *RQ1: In what context/topics is game development used in CS/SE education?*
    The focus of this research question is to find the topics or domains where game
    development has been used as a teaching method documented in the research literature.

    +   - *RQ2: What GDFs are used in CS/SE education?* The focus of this research
    question is to find the most common tools used, and possibly see if there are
    any shared experiences from using these tools.

    +   - *RQ3: What are the experiences from using game development in CS/SE education?*
    The focus here is to see if there are any common experiences from using game development
    to teach CS/SE subjects.


    The rest of the chapter is organized as follows: Section 2.2 describes experiences
    from using game development in a software architecture course, Section 2.3 presents
    a literature survey on how game development has been used in CS/SE education,
    and Section 2.4 discusses recommendations for how to select an appropriate GDF;
    Section 2.5 concludes this chapter.


    # 2.2 EXPERIENCES FROM USING GAME DEVELOPMENT IN A SOFTWARE ARCHITECTURE COURSE


    To demonstrate how game development can be used in SE education, we included a
    section that describes how game development was introduced in a software architecture
    course and the results of doing so.


    # 2.2.1 Software Architecture Course


    The software architecture course at the NTNU is for postgraduate CS and SE students
    where the workload is 12 hours per week for one semester. About 70–130 students
    attend the course every spring. Most of the students are Norwegian students, but
    about 20% come from EU countries and other continents. The textbook used is *Software
    Architecture in Practice* (Clements and Kazman 2003) and additional articles are
    used to cover topics such as'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'design patterns (Coplien (1998), software architecture documentation standards
    (Maier et al. 2004), and view models (Kruchten 1995). The learning outcomes from
    the course are as follows:


    The students should be able to *define* and *explain* central concepts in software
    architecture literature, and be able to *use* and *describe* design/architectural
    patterns, methods to design software architectures, methods/techniques to achieve
    software qualities, methods to document software architecture, and methods to
    evaluate software architecture.


    The course is mainly taught in three ways:


    +   1. Ordinary lectures (in English)

    +   2. Invited guest lectures from professionals in the software industry

    +   3. A software development project that focuses on software architecture


    The software architecture course at the NTNU is taught differently than at most
    other universities, as the students also have to implement their designed architecture
    in groups of four to six. The motivation for doing so is to make the students
    understand the relationship between the architecture and the implementation, and
    to be able to perform real evaluation of whether the architecture and the resulting
    implementation fulfill the quality requirements specified for the application.
    In the first phase of the project, the students get familiar with the commercial-of-the-shelf
    (COTS) to be used through developing some simple applications. In the second phase,
    the students are asked to implement a selection of design and architectural patterns
    in the chosen COTS. The third phase focuses on producing a complete requirement
    specification, including quality requirements, as well as designing and documenting
    the architecture according to the specified quality requirements and architectural
    drivers. In the fourth phase, the groups evaluate each other’s software architectures
    against the described quality requirements using the architecture tradeoff analysis
    method (Kazman et al. 1998). In the fifth phase, the students carry out a detailed
    design, implement the application according to the software architecture, and
    finally test the application. The sixth and final phase involves a postmortem
    analysis of the whole project to learn from successes and mistakes (Bjørnson et
    al. 2009). The student groups deliver reports from all'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'the phases, and the code and the executable for the first, second, and fifth
    phases. The grade awarded is based on the grading of the project (30%) and a final
    written examination (70%). The project will not be graded until the final delivery
    in the sixth phase, and the students are encouraged to improve and update deliveries
    during the whole project cycle.


    # ### 2.2.2 How Game Development Was Introduced in the Software Architecture Course


    Before 2008, the project in software architecture course at the NTNU asked the
    students to develop an autonomous robot controller for the Khepera robot simulator
    in Java. The reason a robot controller was chosen for the project was that this
    domain had many well-documented architectural patterns with described software
    qualities (Elfes 1990; Lumia et al. 1990; Simmons 1992; Toal et al. 2005). Many
    students, however, found the robot domain difficult and not very interesting.


    In 2009, the course staff decided to add video game as a domain to the software
    architecture project to boost motivation and interest in the course. To be able
    to do this, we had to do four changes to the course to be able to provide a game
    development project with emphasis on software architecture (Wang and Wu 2011).


    +   1. *First*, we had to do some *course preparations* that involved choosing
    a GDF and making the necessary preparation to use it in the project. To do this,
    we searched for existing GDFs and evaluated how well they were suited for teaching
    software architecture, what GDF resources (manuals, guides, examples, tutorials,
    etc.) were available, and how to introduce the GDF to the students. Our choice
    landed on XNA from Microsoft due to its good documentation, its tutorials and
    examples, its high-level application programming interface (API), a programming
    language that was close to Java (C#), as well as the motivating factor of deploying
    games on PCs, Xbox, and mobile devices. Although XNA provides a high-level API,
    we decided to develop the XQUEST framework to make it even easier to create games
    in XNA (Wu et al. 2009). The reason for doing this was to allow the students to
    focus more on software architecture than on technical and game-specific matters.

    +   2. *Second*, we had to change the *syllabus*. For the students to be able
    to create software architectures for the game domain, they needed some theoretical
    backing on design and architectural patterns for'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'the game domain, how to design game architectures, and how to specify quality
    attributes for games. It turned out that this task was rather difficult. In contrast
    to the autonomous robot domain, there was not much mature literature on game architecture
    or patterns. The result was that we added some chapters from the book *Game Architecture
    and Design* (Rollings and Morris 2004) to the syllabus, which was supported by
    a set of own composed slides with descriptions of relevant design and architectural
    patterns for games and how to specify quality attributes for games.


    +   3. Third, changes to the project were made. The course staff decided to let
    the student teams themselves choose between the robot and the game project. The
    main structure of the project had to remain the same, but we had to support two
    domains and two different COTSs. One major difference between the two domains
    was that for the robot controller project, the variation in what you could do
    with the application was limited, whereas for the game project we wanted to encourage
    creativity. Thus, the functional requirements for the robot version of the project
    were fixed, although they were not fixed for the game version. Another thing we
    had to change was how to grade the project. The grading of the project has emphasis
    on quality and completeness of documentation and code, and the relationship between
    the code and the architecture. The main difference in grading the two variants
    was that to get the top grade (A) in the robot version, the robot had to solve
    its task efficiently and elegantly, whereas for the game version it was required
    to be impressive in some way. It was also a requirement that both the robot controller
    and the game had to have a certain level of complexity in terms of the number
    of classes and its structure of components.


    +   4. Fourth, changes were made to the schedule and the staff. The change of
    course staff was basically that we had to hire one extra teaching assistant (TA)
    to provide technical support on the XNA framework. The main changes in the schedule
    were to add an extra 2-hour COTS introduction lecture to give an introduction
    of both the robot controller and C# and XNA (in parallel), changing and extending
    a lecture on design and architectural patterns to include the game domain, and
    to add one more lecture on software architecture in games.


    All in all, the changes were not major, but it required quite a lot of effort
    from the course staff. Most of the effort went into getting familiar with'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'the XNA framework, adapting the project, and creating and finding the theoretical
    foundation to be used in lectures on game architectures.


    # 2.2.3 Experiences Gained


    Since 2009, we have collected data on the game development project in the software
    architecture course at the NTNU. Most of the experiences we have gained are positive,
    but we have also identified some challenges. One clear indication that the students
    welcomed a game project was that 73% of the students chose the game project whereas
    27% chose the robot project. Since 2009, the percentage of students choosing the
    robot project has further decreased. Further, the amount of students attending
    the course has increased from around 70 students in 2008 to over 150 in 2013.
    The course evaluations between 2009 and 2013 clearly show that game development
    is popular among the students and motivates and engages the students to learn
    software architecture. The four most popular game genres developed by students
    in these projects are shooter (38%), strategy (25%), board (13%), and platform
    games (12%). All the games developed so far have been 2D games. The course staff
    recommend the development of 2D games to avoid too much focus on technical challenges.
    Some students groups admit that they focus too much on the game itself and less
    on the software architecture. Another comment from the students is that they spend
    way too much time on the game project, so it hurts their effort in other courses.
    Figure 2.1 shows screenshots from the game *BlueRose* developed by one student
    group in XNA.


    ![](img/8edd7838aa9e4a0d883fcf44f4b667a0_48_0.png)


    FIGURE 2.1 (**See color insert.**) Screenshots from the *BlueRose* XNA game.'
  merge: -1
  img_proc: true
