    # 7.3.2 RCAT Architecture


    RCAT consists of four tiers: proxies, game servers, caches, and database. We first
    introduced this architecture in Reference [52]. RCAT is very similar to the architecture
    shown in Figure 7.1. Proxies handle communication with clients, game servers handle
    computation of the game logic or simulation, and the database ensures persistence.
    Each tier isolates a different performance requirement, and therefore a potential
    bottleneck. This architecture aims at being game agnostic, that is, it does not
    embed any notion of a virtual space in it.


    Proxies isolate the quadratic broadcast problem from the game servers. As mentioned
    before, proxies are common components in MMO architectures and on the web. Clients
    and game servers hold permanent connections with the proxies. Their role is simply
    to forward messages between clients and game servers. The game operator or developer
    can decide how the proxy forwards client requests to the servers: round-robin,
    fixed (a given proxy always forwards messages to the same game


    ![](img/8edd7838aa9e4a0d883fcf44f4b667a0_183_0.png)


    FIGURE 7.1  (See color insert.) A tiered architecture.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'server), or per-client/"sticky" (all the messages from a given client are sent
    to the same server). Besides message forwarding, proxies can prioritize, bucket,
    piggyback, or filter messages based on certain network heuristics (e.g., upload
    rate or Transmission Control Protocol [TCP] window size). However, they do not
    have any knowledge whatsoever about the game (e.g., areas of interest or friend
    lists). Proxies can also help mitigating denial of service attacks against game
    servers.


    Game servers receive and process client requests according to the game logic.
    When a server receives a request from a client (through a proxy), it computes
    which clients have to be notified and broadcasts to all the proxies the response
    to forward as well as the concerned clients. Servers can perform any game logic
    treatment, from low-latency state updates (e.g., avatar movement) to more reliable
    bulk transfer content delivery (e.g., textures or streaming the world state when
    a client first logs in). Servers can be added on the fly to the server tier at
    no synchronization cost. They only have to notify the proxies when they join in,
    and retrieve data from their cache.


    Caches live on the same machines as the game servers so as to provide for the
    game servers a quick access to the data and to alleviate the load on the database.
    Determining which object lives in which cache, so as to optimize data accesses,
    is the concern of the developer. For example, in space partitioning, two objects
    that are close to each other in the game world would live in the same cache. Other
    types of partitioning include by users, as is currently done by Zynga [53], or
    by data types.


    Caches are only a temporary storage to improve performance; it is up to the developer
    to specify which objects can be cached, the delay for cached objects to become
    stale, and whether replicas should be instantiated on other machines for faster
    reads. Basically, the cache tier is the place where the developer specifies the
    degrees of latency and consistency he or she needs for which objects.


    Finally, the bottom tier is the database. It ensures persistence and may still
    be directly accessed by the game server for transactional operations that must
    be atomic, consistent, isolated, and durable. When a cached object expires, the
    cache may retrieve the object''s state from the database. If an object living
    in the cache must be strongly consistent, all the writes performed on the object
    should also be forwarded to the database. However, if latency is important, the
    object''s state can be flushed to the database only periodically.'
