    with game objects. Half of the articles describe the use of game development at
    a precollege/university level.


    # 2.3.2 Answer to RQ2: What GDFs Are Used in CS/SE Education?


    To answer RQ2, we analyzed the 66 relevant articles with respect to the tools,
    frameworks, and programming languages used to develop games. Figure 2.5 shows
    the distribution of GDFs used for game development in the articles in the survey.
    The Others category (15%) includes development frameworks or tools such as CeeBot
    series, Maya, Neverwinter Nights 2 editor, OpenGL, OpenSceneGraph, Photoshop,
    processing, robot simulation framework (unspecified), Scala, StarLogo TNG, Torque,
    VPython 3D, and Windows binary. Figure 2.5 shows that many uses their own frameworks
    for developing games in their courses. Many of these frameworks were developed
    in Java. One reason for using their own frameworks is to adapt the development
    to fit the educational goals'
  merge: -1
  img_proc: true
