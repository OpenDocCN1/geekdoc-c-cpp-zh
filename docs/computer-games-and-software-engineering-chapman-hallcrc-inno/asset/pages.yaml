    # 5.1 INTRODUCTION


    Among various subfields of software engineering, software engineering education
    [1] has been an important one, focusing on educational topics for software engineering
    (e.g., how to better teach and train software engineering skills). In general,
    research work on software engineering education does not appear in research tracks
    of major software engineering conferences but appears in their education tracks
    or conferences with focus on software engineering education. For example, the
    International Conference on Software Engineering (ICSE; http://www.icse-conferences.org)
    generally has a track on software engineering education. The ACM SIGPLAN Conference
    on Object-Oriented Programming, Systems, Languages, and Applications has also
    recently included a colocated Educator’s Symposium (http://www.splashcon.org/history).
    The Conference on Software Engineering Education and Training (http://conferences.computer.org/cseet)
    has focused on software engineering education and training since 1987. Indeed,
    research work on software engineering education sometimes also appears in meetings
    on computer science education, such as the SIGCSE Technical Symposium (http://www.sigcse.org/events/symposia)
    and the Annual Conference on Innovation and Technology in Computer Science Education
    (http://www.sigcse.org/events/iticse).


    In this chapter, we define and advocate the subfield of educational software engineering
    (i.e., software engineering for education) within the domain of software engineering
    research. This subfield develops software engineering technologies (e.g., software
    testing and analysis [2], software analytics [3,4]) for general educational tasks
    going beyond educational tasks for software engineering. For example, general
    educational tasks can even be on teaching math [5–7]. As an analogy, data mining
    for software engineering [8] (also called mining software repositories [9]) leverages
    data mining technologies (which typically come from the data mining community)
    to address tasks in software engineering, whereas educational software engineering
    leverages software engineering technologies (which comes usually from the software
    engineering community) to address tasks in education. In addition, in the solution
    space, gaming technologies often play an important role together with software
    engineering technologies.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'We expect that researchers in educational software engineering would be among
    the key players in the education domain and in the coming age of massively open
    online courses (MOOCs) [10,11], which have recently gained high popularity among
    various universities and even in global societies. Educational software engineering
    can and will contribute significant solutions to address various critical challenges
    in education, especially MOOCs, such as automatic grading [12,13], intelligent
    tutoring [14], problem generation [5–7], and plagiarism detection [15,16].


    To provide a concrete example of educational software engineering, in this chapter,
    we first lay out the background on online programming exercise systems by describing
    a number of existing representative systems. As a concrete example of gamificating
    an online programming exercise system, we will illustrate Pex for Fun [13] (Pex4Fun,
    for short), which leverages software engineering and gaming technologies to address
    educational tasks on teaching and learning programming and software engineering
    skills. In particular, our illustration of Pex4Fun focuses on its underlying software
    engineering technologies (Section 5.3.1), its gaming (Section 5.3.2), social dynamics
    (Section 5.3.3), and educational usage (Section 5.3.4), which are the four common
    aspects of a typical project on educational software engineering. We also describe
    Code Hunt (Section 5.3.5), which is a recent gaming platform evolved from Pex4Fun.


    # 5.2 BACKGROUND: ONLINE PROGRAMMING EXERCISE SYSTEMS


    # 5.2.1 CodingBat


    *CodingBat* (http://codingbat.com/), created by Nick Parlante, is an online platform
    for providing a set of programming exercises in Java and Python. Note that some
    of the exercises in CodingBat are equipped with hint text and/or the solution
    code. We next use an example (http://codingbat.com/prob/p146974) to illustrate
    how a student can solve an exercise problem in CodingBat. In this example, the
    web page for the exercise problem includes a short natural language problem statement:
    “Given an array of scores, return true if each score is equal or greater than
    the one before.


    * This chapter significantly extends a previous short article [31] presented in
    the 3rd International Workshop on Games and Software Engineering (2013). This
    new extension in this chapter primarily includes surveying-related online programming
    exercise systems (Section 5.2); restructuring and enriching the description of
    Pex4Fun as an example for gamificating an online programming exercise system;
    adding the description of Code Hunt (Section 5.3.5), a recent gaming platform
    evolved from Pex4Fun; and discussing additional more recent related work.'
