    - `Insert()`†, `erase()`† and `emplace()`† (they are fast in node-based containers
    and slow in (middle of) contiguous‑ memory containers); and

    - Constructors (usually, the composition of classes or

    - Their default constructors have constant complexity, but all other constructors
    and destructors may have linear complexity).


    Note:

    a) The `forward list` and `unordered associative containers` use forward iterators
    so they do not have the reverse iterator operations: `emplace back()`, `rbegin()`,
    `rend()`, `crbegin()` and `crend()`.

    b) The associative containers support reverse iterators, but they do not support
    `emplace back`. This is so because the associative containers keep their elements
    in a sorted order, so it does not accept the command `emplace back ()`, which
    insist on placing the new element at the back of the container.†


    ### The forward list:


    1. Does not support the operator `size()`;

    2. Instead of `insert()`, `erase()` and `emplace()`, it provides `insert after()`,
    `erase after()` and `emplace after()`;

    3. Has special iterators before `begin()`, `cbefore begin()`, such that:


    - an operation in `forward list`:

    ```

    my_fwd_list.insert_after(my_fwd_list.before_begin(), inv_data.gold);

    ```

    - is equivalent to the following operation in `list`:

    ```

    my_list.insert(my_list.begin(), inv_data.gold);

    ```

    - Note:

    - None of the containers can write or read beyond `end()`, i.e, `my_fwd_list.insert_after(my_fwd_list.end(),
    inv_data.gold)` is an error!


    ‡ `shrink to fit ()` requests the removal of unused memory capacity and it is
    applicable only to `vector`, `deque` and `string`.†† The unorder containers do
    not support the relational operators: `<`, `<=`, `>`, and `>=`.![](Image00011.jpg)


    In the above list of operators, and `O` stand for the complexity, In short, though
    complexity means the time and/or space complexity of the function, in containers
    it is the time complexity;


    - `O(1)` stands for constant-time complexity;

    - `O(log n)` stands for logarithm-time complexity;

    - `O(n)` stands for linear-time complexity;

