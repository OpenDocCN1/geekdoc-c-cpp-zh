  trans: "\n- `Cin.read` 函数的接口与 `cin.get` 相同，但它不会在输入后附加空空字符。它不是设计用于键盘输入的，而是用于二进制格式的文件。\n\
    - 对于 C++，三个使用 `get`，两个使用 `getline`，其他使用 `>>`；\n- `cin.get(char)` 和 `int = cin.get()`\
    \ 的区别：\n  1. `while(cin.get(c))`\n  2. `// 在读取循环中使用 cin.get(char)`\n  3. `cin.get()\
    \ != '\\n'`\n  4. `// 使用 cin.get() 返回字符来测试某些内容`\n  5. `cin.get() EOF`\n第 7 行：当用于\
    \ `EOF` 时，你必须使用 `int`，因为 `EOF` 可能无法用 `char` 类型表示。\n- 混淆的函数：`cin.get` 和 `cin.getline`\
    \ 几乎是一样的。\n  `Cin.get( char* s, streamsize n, char delim );`\n  `Cin.getline (char*\
    \ s, streamsize n, char delim );`\n  `Istream& getline (istream& is, string& str);`\n\
    \  1. 对于每一行，如果你不知道最大长度，直接使用 `getline(cin, string)`。你不需要输入任何长度（如果你想避免内存分配，可以预留\
    \ `string` 的长度）。\n  2. `cin.get()` 不从输入流中丢弃 `delim`。然而，`cin.getline()` 会读取并丢弃换行符。（这很容易记忆，因为行是由换行符定义的）\n\
    \  3. 在 `cin.getline(char* s, int n)` 中，如果函数没有提取到字符（换行符也是字符），或者在已经写入 `s` 的 `(n-1)`\
    \ 个字符后没有找到分隔符 `delim`，则设置 `failbit` 位。注意，如果输入序列中这些 `(n-1)` 个字符之后的字符恰好是分隔符 `delim`，它也会被提取，且不会设置\
    \ `failbit` 标志。\n  4. 在 `cin.get(char* s , int n)` 中。只有当函数没有提取到字符时，才会设置 `failbit`\
    \ 标志。\n  5. `cin.get(char* s, n)` 比 `cin.getline` 更灵活。因为当读取到数组满界时，它不会设置 `failbit`。此时你可以使用\
    \ `gcount()` 或 `peek()` 查看下一个字符是否是新行。它比 `cin.getline()` 更具定制性。\n\n### 输入模式\n-\
    \ 在外部测试流，然后在条件/循环语句的体内部对其进行读/写是一个坏主意。这是因为读取操作可能会导致流状态错误（bad）。通常将读取作为测试的一部分更好。\n\
    ```cpp\nwhile(!cin.fail()){  //这是糟糕的编程风格\ncin>>i;  //这里可能会导致流 fail()......   \
    \  //然后 i 不是有效值\n}\n```\n- 如果你只想输入，不想知道 `eof` 或处理 `failbit`。你可以使用以下方法：\n```cpp\n\
    while(scanf(\"%d\",&i) != 1)\nwhile((int c = getchar())!=EOF)\nwhile( fgets(line,\
    \ sizeof(line), fp) != NULL )//在 C 语言中，使用这些退出循环！\nwhile(cin>>input)\nwhile(cin.get(p,\
    \ 20) )\nwhile(getline(ifstream, string));//在 C++ 语言中，使用 bool 运算符退出循环。//做一些用的操作。//输入是正确的。}\n\
    ```\n- 如果你想知道 `eof` 或处理错误。你可以使用以下代码。当你按下回车时，读取将结束。当你输入字母时，它会忽略该字母，直到你输入数字。\n```cpp\n\
    while(true) //使用 break 退出循环;\n{\n  cin>>i//或 getline(ifstream, string);\n  If(cin.eof()){\
    \   //如果是 EOF\n    cout<<\"EOF␣ encountered\"<<endl\n    //break;\n  }\n  If(cin.fail())\
    \ //处理无效输入\n  {\n    cin.clear(); //重要。清除状态和缓冲区\n    while(cin.get()!=’\\n’) \
    \ //get 行的剩余部分，\n    continue ;\n    cout<<\"please␣ input␣a␣ number\"<<endl;\n\
    \    continue;\n  }\n  ...  //输入是正确的。做一些用的操作。\n}\n```\n- 在上一个示例中，为什么我们需要区分 `eof`\
    \ 和 `fail`？当发生 `fail` 时，缓冲区中可能存在无效字符。清理缓冲区后，我可以继续从输入缓冲区读取输入。清理缓冲区中无效字符的三种方法：\n\
    ```cpp\ncin.clear();   //重要。清除状态和缓冲区\nwhile(cin.get()!=’\\n’)continue ;      //方法\
    \ 1\nwhile(!issapce(cin.get()))continue;  //方法 2\nbasic_istream& ignore(streamsize\
    \ _Count = 1, \\int_type _Delim = traits_type::eof());  //方法 3\ncin.ignore(5,\
    \ ’a’);\ncin.ignore(numeric_limits<streamsize>::max(), ’\\n’);\n```\n- 你可以使用 `istream_iterator`，它可以节省你判断\
    \ `EOF` 的麻烦。\n```cpp\nClass A{\nPrivate:\n  Int,y;\n  Friend istream& operator>>(istream&\
    \ in, A&);\n  Friend ostream& operator<<(ostream& in, const A&);\n};\nistream&\
    \ operator>>(istream& in, A&){\n  in>>x>>y;\n  return in;\n}\nOstream& operator<<(ostream&\
    \ out, const A& a){\n  out<<x<< \" <<y;\n  return out;\n}\nVector<A> v;\nCopy(istream_iterator<A>(cin),\
    \ istream_iterator<A>(), Back_inserter(v));\nCopy(v.begin(), v.end(),ostream_iterator<A>(cout,\"\
    \\n\"));\n```\n- 总结，最好使用判断来退出循环。如果你需要不同的操作来处理 `EOF` 或错误。使用 `while(true)`，然后使用\
    \ C++ 中的 `eof()` 或 `clear()` 函数。\n\n### 输出：\n- 对于 `cout`，它可以自动识别类型，并且具有扩展性，你可以重载\
    \ `<<` 运算符让 `cout` 能够识别数据类型。\n```cpp\nClass Foo{\n  Friend ostream& operator<<(ostream&\
    \ s,const Foo &r);\n};\nOstream& operator<<(ostream& s, const Foo &r){\n  s<<a<<b<<endl;\n\
    }\n```\n- 在 C 和 C++ 中如何打印地址？\n```cpp\nchar* amount = \"dozen\";\ncout<< amount\
    \ ; //打印 \"dozen\" 字符串\ncout<<(void*) amount;//打印指针地址\nprintf(\"%p\", (void*)\
    \ p);\n```\n- 格式是输出的关键点。你需要了解常用的操作符来控制输出。\n- 数字进制操作符：`hex`, `dec`；字段宽度：`Width`,\
    \ `fill`, `Setf()`。\n- 你不需要了解细节，只需要名称。当你想要使用它们时，请参考文档。格式操作符可以在 C++ 入门书中看到，你需要包含\
    \ `<iomanip>`。`<<` 在 C 语言中是位移运算符，但在 C++ 中我们在 `ostream` 类中重载了它，`cout` 是一个 `ostream`\
    \ 对象。\n- 你可以使用 `cout<<flush` 强制刷新输出缓冲区。\n- `cout.write` 可以输出字符串；它会输出特定长度的字符串，即使到达字符串结尾。\n\
    \n### 其他流\n- 当你熟悉 `cin` 和 `cout` 后，你会发现文件操作非常简单。只需将 `cin` 或 `cout` 替换为你的 `ifstream`,\
    \ `ofstream` 对象即可。\n```cpp\nstd::fstream ifs;\nifs.open (\"test.txt\", ios_base::in|\
    \ ios_base::binary);\nif(!ifs.is_open())exit(1);\nchar c = ifs.get();//使用之前所有的输入\n\
    ifs.close();\n```\n- 只读 `ifstream`；只写 `ofstream`；读写使用 `fstream`。\n- 对于 `ios_base::binary`\
    \ 模式，使用 `write()` 和 `read()` 函数。\n- 对于写入，注意 `ios_base::trunc` 和 `ios_base::app`\
    \ 的区别。\n- 随机访问主要用于二进制文件。因为位置可以精确定位。对于输入使用 `seekg()`，对于输出使用 `seekp()`。（p 代表 put，g\
    \ 代表 get）。移动指针。`tellp()` 和 `tellg()` 函数会告诉你指针的位置。\n\n### 缓冲区和字符串\n- `String` 是像独立的\
    \ I/O 设备一样操作字符串的方便方法。有时使用 `stringstream` 在字符串和其他数值类型之间转换非常方便。`stringstream` 的用法非常相似，所以学习起来负担。\n\
    - 你需要从字符串创建一个 `stringstream`，或者将 `stringstream` 转换回字符串。\n```cpp\nstringstream\
    \ outstr;\noutstr<<\"salary value\"<<123333.00<<endl;\nstring str = outstr.str()\
    \ //转换为字符串\nistringstream Instr(str);\nwhile(instr>>number)\n  cout<<number<<endl;\n\
    char sentence []=\"Yan is 41 old\";\nchar str [20];\nint i;\nsscanf (sentence,\"\
    %s %*s % %d\", str, &i);\nsprintf(...);\n```\n第 1 到 3 行：将数字转换为文本。\n第 5 到 7 行：将文本转换为数字。\n\
    第 9 行到结束：C 语言方法。在第 12 行，你可以看到 \"*s\"，这意味着输入会被忽略。所以 `str = Yan`, `i = 41`。\n操作流\n"
- fmt: "\n## Input Stream Operations\n\n1. `Peek` return the next character from input\
    \ without extracting from the input stream. For example, you want to read input\
    \ up to the first newline or period.\n\n```cpp\nchar input[80];\nint i = 0;\n\
    while( (ch=cin.peek()) != ’.’ && ch != ’\\n’)cin.get(input[i++];)\ninput[i] =\
    \ ’\\0’;\n```\n\n2. `Gcount()` method returns the number of characters read by\
    \ the last unformatted extraction method. That means character read by the `get()`,\
    \ `getline()`, `ignore()`, or `read()`, but not extraction operator.\n\n3. `Putback()`\
    \ function inserts a character back in the input buffer.\n\n# Chapter 10. Memory\
    \ and Resources\n\n## Memory Management\n\nC++ programming language provides a\
    \ lot of options to users when it comes to managing the memory used by an executing\
    \ program. In this chapter, we shall be exploring some of these frequently used\
    \ options. We would also introduce some modern techniques aimed at reducing the\
    \ memory management problems that have plagued C++ projects in the past.\n\n###\
    \ Memory Available to C++ Programs\n\nModern operating systems usually reserve\
    \ a section of its memory for executing a program that allows the operating system\
    \ to manage multiple program executions simultaneously. There are different operating\
    \ systems which layout the memory of executing the program in different ways.\
    \ However, the layout would include the following four sections.\n\n* **Code**:\
    \ The program's compiled executable instructions are held in the code section\
    \ memory. While the program executes, the contents of the code section should\
    \ never change. Also, during the program's executions, the code segment does not\
    \ change as well.\n* **Data**: Persistent variables and global variables are held\
    \ in the data section of the memory as in static locals. Throughout the life span\
    \ of the executing program is the variables of the data would exist. However,\
    \ unless the data is a constant, the executing program may freely change their\
    \ values. Although the values stored in the variables found in the data segment\
    \ may change during the program's execution, the size of the data segment wouldn't\
    \ change while the program is executing. It is so because the program's source\
    \ code precisely defines the numbers of global and static local variables. It\
    \ is also possible for the compiler to compute the exact size of the data segment.\n\
    * **Heap**: The section where the executing program obtains dynamic memory is\
    \ called the heap. Using the `new` operator gets the memory from the heap, and\
    \ the `delete` operator returns the previously allocated memory back to the heap.\
    \ The size of the heap shrinks and fries during the program's execution as the\
    \ program deallocates and allocates dynamic memory using the `delete` and `new`.\n\
    * **Stack**: Function parameters and local variables are always stored in the\
    \ stack. Function parameters and local variables disappear when the function returns\
    \ and appears when a function is called. The size of the stack also shrinks and\
    \ grows during the program's execution as various functions execute.\n\nGenerally,\
    \ operating systems limit the size of the stack. Deep recursion can consume a\
    \ considerable amount of stack space. For example, let's consider an improperly\
    \ written recursive function of one that omits the base case and thus exhibits\
    \ an \"infinite\" recursion that would consume all the space that is available\
    \ on the stack. A situation such as this is known as a stack overflow. Modern\
    \ operating systems terminate any process that consumes a lot of the stack space.\
    \ However, on some embedded systems, this stack overflow may go undetected. Typically,\
    \ heap space is plentiful, and operating systems can use virtual memory to provide\
    \ more space than it's available in real memory for an executing program. The\
    \ extra space for the virtual memory comes from a disk drive, and the operating\
    \ system shuttles data from the disk to real memory as needed by the executing\
    \ program. Programs that make use of a virtual memory run a lot more slowly than\
    \ programs that make use of little virtual memory.\n\n### Manual Memory Management\n\
    \nFrequent memory management issues with `delete` and `new` are the majorly difficult\
    \ to find and fix the source of the logic error. Programmers have to adhere strictly\
    \ to the following tenets:\n\n* Everything you call `new`, it should always have\
    \ an associated call to `delete` provided the allocated memory isn't longer needed.\
    \ It may sound simple, but it isn't always clear when `delete` should be used,\
    \ but the function below shows a memory leak:\n\n```cpp\nvoid calc(int n) {\n\
    // ...\n// Do some stuff\n// ...\nint *x = new int[n];\n// ...\n// Do some stuff\
    \ with x\n// ...\n// Exit function without deleting x's memory\n}\n```\nProvided\
    \ a program calls on the `calc` function enough times, the program will eventually\
    \ run out of memory. In the `calc` function, `x` is a local variable. In that\
    \ light, `x` lives on the stack. So when a user uses a particular call to `calc`\
    \ completes, the function’s clean up code automatically releases the space helped\
    \ by the variable `x`. Because all functions automatically manage the memory for\
    \ their local and parameter variables. The problem with `x` is assigned via `new`\
    \ to point to memory allocated from the heap and not the stack. Function executions\
    \ manage to which `x` pointed is no deallocated automatically.\n\n* Then `delete`\
    \ operator should never be used to free up memory that has not been allocated\
    \ from its previous call to `new`. The code fragment below illustrates one such\
    \ example:\n\n```cpp\nint list[10], *x = list; // x points to list\n// ...\n//\
    \ Do some stuff \n// ... delete [ ] x; // Logic error, attempt to deallocate x's\
    \ memory\n```\nThe space references by the pointer `x` were not allocated by the\
    \ operator `new`, so the operator `delete` should not be used to attempt to free\
    \ the memory. When you attempt to delete a memory that is not allocated with `new`,\
    \ it results in an undefined behavior that proves a logic error.\n\n* The operator\
    \ `delete` must not be used to deallocate the same memory more than once. This\
    \ case is common when two pointers refer to the same memory. Pointers like this\
    \ are called aliases. The following code fragment below illustrates this situation\
    \ better:\n\n```cpp\nint *p = new int[10], *y = x; // y aliases x\n// ...\n//\
    \ Do some stuff with x and/or y\n// ...\ndelete [ ] x; // Free up x's memory\n\
    // ...\n// Do some other stuff\n// ...\ndelete [ ] y; // Logic error, y's memory\
    \ already freed!\n```\nSince the pointer `x` and pointer `y` point to the same\
    \ memory, then `x` and `y` are aliases of each other. If you deallocate a memory\
    \ that is referenced by one of them, then the other memory is also deallocated\
    \ since it is the same memory.\n\n* When you deallocating previous memory with\
    \ `delete`, they should never accessed. When you attempt to access deleted memory\
    \ result, it would result in the undefined behaviors which represent a logical\
    \ error.\n"
