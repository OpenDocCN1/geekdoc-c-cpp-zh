  trans: "\nRestrict：被 `restricting` 限定的指针在初始状态下是访问其指向的对象的唯一手段。\n\n# 第 2 章：基础设施\n\n\
    ## 数组\n数组是一种存储相同数据类型元素顺序集合的数据结构。例如，在下面的代码中，我声明了两个不同数据类型的数组：一个字符数组和一个整数数组：\n\n\
    ```cpp\n#include \"stdafx.h\"\n#include <iostream>\nint main(int argc, char* argv[]){\n\
    \    int i;\n    int length;\n    int sum = 0;\n    char char_array[10] = { 'p',\
    \ 's', 'y', 'c', 'h', 'o', 'l', 'o', 'g', 'y' };\n    // 为该数组分配的字节总数\n    // 一个\
    \ char 是一个字节：元素个数 = 字节数\n    length = sizeof(char_array);\n    std::cout << \"\
    Size of array of characters is \" << length << std::endl;\n    for (i = 0; i<length;\
    \ i++)\n    std::cout << char_array[i];\n    std::cout << '\\n';\n    std::cout\
    \ << '\\n';\n    std::cout << '\\n';\n    int numbers[10] = { 1, 5, 9, 4, 2, 7,\
    \ 6, 3, 8, 0 };\n    // 为该数组分配的字节总数。\n    length = sizeof(numbers);\n    std::cout\
    \ << \"Size of numbers array=\" << length << std::endl;\n    // 为数组分配的字节总数/每个元素分配的字节数\n\
    \    length = sizeof(numbers) / sizeof(numbers[0]);\n    std::cout << \"Numbers\
    \ of elements=\" << length << std::endl;\n    for (i = 0; i<length; i++){\n  \
    \      sum = sum + numbers[i];\n        std::cout << \"Sum of numbers=\" << sum\
    \ << std::endl;\n    }\n    int *p = numbers;\n    std::cout << \"Address of the\
    \ first element is \" << p << std::endl;\n    std::cout << \"The value in the\
    \ address is \" << *p << std::endl;\n    p++; //将指针移动到下一个元素\n    std::cout <<\
    \ \"Address of the second element is \" << p << std::endl;\n    std::cout << \"\
    The value in the address is \" << *p << std::endl;\n    int hold = 1;\n    std::cin\
    \ >> hold;\n    return 0;\n}\n```\n\n`sizeof` 函数返回为数组分配的字节数。由于 `char` 数据类型占用 1\
    \ 个字节，`sizeof` 函数返回的字节数等于 `char` 数组的元素个数。\n\n整数数据类型在内存中占用 4 个字节，一个包含 10 个整数的数组存储在\
    \ 40 个字节中。因此，`sizeof` 数组函数对于包含 10 个元素的整数数组会返回 40 字节。\n\n要计算数组中存储了多少个元素，我们可以将整个数组分配的字节数除以数组中单个元素分配的字节数：\n\
    `length=sizeof(numbers) / sizeof(numbers[0]);`\n`40 / 4 = 10`\n\n要访问单个元素的值，必须使用数组索引。C++\
    \ 中的数组索引从 0 开始。第一个元素的索引是 0，第二个元素的索引是 1，依此类推。\n\n要访问数组的所有元素，必须使用 `for` 循环：\n`for(i=0;\
    \ i<length; i++)cout<<char_array[i];`\n\n如果我们声明一个指针并将数组赋值给该指针，该指针将持有数组第一个元素的地址：\n\
    `int *p =numbers;`\n`cout<<\"Address of the first element is \"<<p<<endl;`\n该行代码的输出是：`Address\
    \ of the first element is 0059F710`\n\n要使用指针访问数组第一个元素地址中存储的值，请运行以下代码：\n`cout<<\"\
    The value in the address is \"<<*p<<endl;`\n代码的输出是：`The value in the address is\
    \ 1.`\n\n要移动到数组的下一个元素，必须增加 `p` 值：\n`p++;`\n现在它将指向数组的第二个元素：\n`cout<<\"Address of\
    \ the second element is \" <<p<<endl;`\n`cout<<\"The value in the address is\"\
    <<*p<<endl;`\n输出是：`The address of the second element of the numbers array on my\
    \ PC is 0059F714. The value in the address of the second element is 5.`\n\n![](img/Image00002.jpg)\n\
    图 数组程序的输出。\n\n## 字符串\n字符串函数我将向你展示如何使用一些字符串函数：\n- `strcpy_s()` - 将字符串的内容复制到另一个字符串。\n\
    - `strcat_s()` - 将源字符串的副本添加到目标字符串。\n- `strlen()` - 返回字符串的长度。\n\n我们的应用程序将从用户输入读取字符串，将其复制到另一个字符串，然后按反序将原始字符串字符复制到临时字符串中，并将副本和反转后的副本合并成一个字符串。例如，如果用户输入字符串‘Concatenation’，则应用程序将输出‘ConcatenationnoetacC’。\n\
    \n`main.cpp` 文件必须包含以下头文件：\n```cpp\n#include \"stdafx.h\"\n#include <stdio.h>\n\
    #include <cctype>\n#include <iostream>\n#include <cstring>\n```\n`<cstring>` 头文件用于字符串函数：`strcpy_s()`、`strcat_s()`\
    \ 和 `strlen()`。`cctype` 头文件用于 `toupper()` 函数。\n\n我想解释我是如何反序将字符从原始字符串复制到临时字符串的。首先，使用\
    \ `strlen()` 函数获取原始字符串的长度：`length=strlen(aWord);`。\n\n然后在循环中，我将原始字符串的最后一个字符复制到第一个位置，依此类推：\n\
    `for(i=0; i <length; i++)temp[i]=aWord[length-(i+1)];`\n如果用户输入单词‘Concatenation’，长度为\
    \ 13。字符串第一个字符的索引是 0，最后一个字符的索引是 12。这意味着最后一个字符是 `length - 1`。\n\n当 `i = 0` 时，`temp[i]`\
    \ 指向临时字符串的第一个字符。同时（当 `i =0` 时）`aWord[length-(0 + 1)]` 指向最后一个字符。当 `i=1` 时，`temp[1]`\
    \ 指向临时字符串的第二个字符，而 `aWord[length-(1+1)]` 指向倒数第二个字符。通过这种方式，我们可以顺序复制所有字符。当我们把所有字符从原始字符串复制到临时字符串后，我们需要在临时字符串末尾添加空字符，因为\
    \ C++ 字符串必须以 null 结尾。`temp[length]='\\0';` 这行代码将完成工作。整个代码包含在 `visual_studio_2017.zip`\
    \ 中。\n\n```cpp\n#include \"stdafx.h\" \n#include <stdio.h>\n#include <cctype>\n\
    #include <iostream>\nint main(){\n    char more = 'Y';\n    char prompt1[] = \"\
    \\nEnter a word not than 20 characters and press enter.\\n\";\n    char prompt3[]\
    \ = \"\\nDo you want to continue? Y/N\\n\";\n    char aWord[20];\n    char aCopy[40];\n\
    \    int length = 0;\n    char temp[20];\n    int i;\n    while (toupper(more)\
    \ == 'Y'){\n        std::cout << prompt1;\n        std::cin >> aWord;\n      \
    \  std::cout << \"aWord=\" << aWord << std::endl;\n        strcpy_s(aCopy, aWord);\n\
    \        std::cout << \"aCopy=\" << aCopy << std::endl;\n        length = strlen(aWord);\n\
    \        std::cout << \"length=\" << length << std::endl;\n        //反序填充 temp[]\
    \ 数组\n        for (i = 0; i <length; i++)\n            temp[i] = aWord[length\
    \ - (i + 1)];\n        temp[length] = '\\0';\n        std::cout << \"Temp=\" <<\
    \ temp << std::endl;\n        strcat_s(aCopy, temp);\n        std::cout << \"\
    aCopy after concatenation of temp=\" << aCopy << std::endl;\n        std::cout\
    \ << prompt3;\n        std::cin >> more;\n    }\n    return 0;\n}\n```\n输出：\n\
    ![](img/Image00003.jpg)\n图 字符串操作。\n\n## 列表\n让我们想象一个谜。有一排盒子。每个盒子包含一个字母卡片。你需要找出字母的顺序，使字母组成一个单词。\n\
    \n![](img/Image00004.jpg)\n图 链表\n\n在上面的表中，你可以看到每个盒子都有一个数字。你可能猜这些数字是谜题的关键。第一个盒子内部有一个字母\
    \ T，正面是数字 5。取出字母 T 卡片并将其放在旁边。数字 5 可能指向下一个字母。数盒子。第五个盒子有字母‘E’。取出字母 E 卡片并放在 T 旁边。你会得到“TE”。字母\
    \ E 的盒子侧面有数字 2。所以，从第 2 个盒子取出卡片并放在“TE” 旁边。你会得到“TEC”。字母 C 的盒子数字是 10，所以从第 10 个盒子取出卡片。你会得到“TECH”。字母\
    \ H 的盒子数字是 4，所以从第 4 个盒子取出卡片。你得到了“TECHN”。继续跟随数字，你将得到整个单词：TECHNOLOGY。这就是链表的工作原理。它由节点组成。每个节点至少有一个变量存储数据（文本、数字或对象）以及一个变量（指针）存储下一个节点的地址。这个系统像你在谜题中做的那样遍历节点列表。最后一个节点的指针具有空值，或者它可能指向第一个节点。这时我们就有了闭链表。\n\
    \n### 添加节点\n如果你想在链表的末尾添加一个新节点，必须创建一个新节点。然后将最后一个节点的指针指向新节点的地址，并将新节点指针赋值为空值。\n\n\
    ![](img/Image00005.jpg)\n图 在链表末尾添加节点。\n\n如果你想在链表的开头添加一个新节点，必须创建一个新节点。将新节点的指针指向第一个节点，就完成了。\n\
    \n![](img/Image00006.jpg)\n图 在链表的头部添加节点。\n\n如果你需要在链表的中间添加一个节点，必须创建一个新节点，然后打破链条：重定向节点（断开之前的节点）指向新节点，并将新节点的指针指向下一个节点（断开之后的节点）。\n\
    \n![](img/Image00007.jpg)\n图 在链表中间添加节点。\n\n### 删除节点\n\n# 第 3 章：二叉树\n二叉树是所有基础数据结构中最实用的之一，而且到目前为止是最有趣的。它们是如何使用递归和指针来实现非常有用事情的完美示例。\n\
    \n"
