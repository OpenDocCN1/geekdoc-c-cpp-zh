  trans: "\n相比之下，`O(n) > O(log n) > O(1)`，这意味着 `O(1)` 是最快的操作；注意：这些是预期复杂度或平均复杂度，而标准库文档对某些运算符引用了最坏情况复杂度。少数容器不支持迭代器，它们是：容器适配器、`bitset`\
    \ 和 `valarray`。注意：C++11 为 `valarray` 定义了迭代器 `begin()` 和 `end()`。\n\n# STL 迭代器\n\
    \n迭代器、容器和算法是由于 Alexander Stepanov 等人在 20 世纪 90 年代初在惠普公司编写的标准模板库的组成部分，随后在标准库中进行了合并和改进。\n\
    \n迭代器是特化指针的抽象，它用于对给定容器（如 `vector`、`map` 和自定义容器类）中的元素进行解引用。每个容器类都包含用于生成迭代器的成员函数，例如，成员\
    \ `begin()` 和 `end()` 分别返回第一个元素的迭代器和最后一个元素之后元素的迭代器。\n\n下图展示了迭代器 `*it` 及其其容器 `vector<int>data\
    \ {1111, 1134, 1134, 1124, 1124, 1134, 1111, 1176, 1124, 1134, 1176}` 之间的关系。，迭代器可以在算法操作（如\
    \ `sort`、`accumulate` 和自定义算法函数）中使用容器的元素。换句话说，迭代器将容器与算法关联起来。\n\n最常用的迭代器来自 `begin()`\
    \ 和 `end()`。如下所示：`data[0]` 和 `data.begin()` 表示同一个元素，即 elem 1，但 `data[N]` 和 `data.end()`\
    \ 代表“真空”，访问它会导致运行时错误。然而，成员函数 `end()` 在迭代语句构造条件时非常有用。\n\n以下代码说明了迭代器的这一基本属性：\n\n\
    ```cpp\n// iterators.cpp\n#include \"..\\..\\my_essentials.hpp\"\nvoid illustrate_iterators(){\n\
    \    int arr[] = {1111, 1134, 1134, 1124, 1124, 1134, 1111, 1176, 1124, 1134,\
    \ 1176};\n    vector<int>data(arr, arr+ sizeof(arr)/sizeof(arr[0]) );\n    //\
    \ vector<int>data2{1111, 1134, 1134, 1124, 1124, 1134, 1111, 1176, 1124, 1134,\
    \ 1176}; // fine with gcc4.7.0\n    cout << \"\\n Illustration of iterators: \\\
    n\" << \"\\n Given vector: data =\\n\\t( \";\n    for(auto element: data) // 'the\
    \ range-based for' do not work with VC10.\n        cout << element << \"; \";\n\
    \    cout << \")\\n\\n Let us define an iterator, say *it for this vector.\\n\"\
    ;\n    vector<int>::iterator it = data.begin();\n    /*Note:在 STL 容器中，每个容器模板类都定义了自己的迭代器成员类，所以\
    \ vector<int>::iterator 不同于 list <int>::iterator.*/\n    cout << \" Thus,\\t\\\
    t*it = \" << *it << \" that is data[0]\\n 迭代器可以递增，即，++it;\\n\";\n    ++it;\n \
    \   cout << \" After ++\\t*it = \" << *it << \" that is data[1]\\n 因此, 迭代器 *it\
    \ 遍历了 vector data。\\n 所以, 让我们使用迭代器表示整个 vector：  \\n\\t( \";\n    for(auto it =\
    \ data.begin(); it!=data.end(); ++it)\n        cout << *it << \"; \";\n    cout\
    \ << \")\\n\";\n    cout << \"\\n Task: 由于这个 vector 有重复数字，\\n 我们可以只保留每个数字的一个副本并删除重复吗？\\\
    n 是的，我们可以！\\n 为此，我们将迭代器通过三种类型的 STL 算法，如下所示:\\n\";\n    cout << \"\\n Step.1 升序排序:\\\
    n\";\n    sort(data.begin(), data.end());\n    cout << \" After the iterator has\
    \ passed through sort(): \\n\\t( \";\n    for(auto element: data)\n        cout\
    \ << element << \"; \";\n    cout << \")\\n\\n Step.2 将相邻的重复元素移动到左侧:\\n\";\n \
    \   auto my_unique = unique(data.begin(), data.end());\n    cout << \" After the\
    \ iterator has passed through unique(): \\n\\t( \";\n    for(auto element: data)\n\
    \        cout << element << \"; /*/*unique() 函数返回了一个指向标识符“my_unique”的迭代器，从该位置开始，重复元素被推到\
    \ end() 之前。注意：STL 算法可以移动元素但不能删除它们，但是每个 stl 容器模板类都有一个名为“erase()”的成员函数用于删除指定的元素。换句话说，迭代器可以修改容器中的元素但不能修改容器本身。因此，为了删除重复，我们从迭代器“my_unique”到\
    \ end() 应用 erase 操作*/\n    cout << \")\\n\\n Step.3 删除这些重复元素:\\n\";\n    data.erase(my_unique,\
    \ data.end());\n    cout << \" After the iterator has passed through erase() i.e.,\
    \ \\n Final:\\t( \";\n    for(auto element: data)\n        cout << element <<\
    \ \"; \";\n    cout << \")\\n\";\n}\nint main(){\n    illustrate_iterators();\n\
    \    just_pause();\n}输出:\n迭代器演示：\n给定 vector: data =(1111; 1134; 1134; 1124; 1124;\
    \ 1134; 1111; 1176; 1124; 1134; 1176; )\n让我们为这个 vector 定义一个迭代器，假设为 *it。\n因此,*it\
    \ = 1111 是 data[0]迭代器可以递增，即，++it。\n++ *it = 1134 是 data[1]\n因此，迭代器 *it 遍历了 vector\
    \ data。\n所以，让我们用迭代器表示整个 vector： (1111; 1134; 1134; 1124; 1124; 1134; 1111; 1176;\
    \ 1124; 1134; 1176; )\n任务：由于这个 vector 有重复数字，\n我们可以只保留每个数字的一个副本并删除重复吗？\n是的，我们可以！\n\
    为此，我们将迭代器通过三种类型的 STL 算法，如下所示：\n步骤.1 升序排序：\n迭代器通过 sort() 之后： (1111; 1111; 1124;\
    \ 1124; 1124; 1134; 1134; 1134; 1134; 1176; 1176; )\n步骤.2 将相邻的重复元素移动到左侧：\n迭代器通过\
    \ unique() 之后： (1111; 1111; 1124; 1124; 1124; 1134; 1134; 1134; 1134; 1176; 1176;\
    \ ) /*unique() 函数返回了一个指向标识符“my_unique”的迭代器，从该位置开始，重复元素被推到 end() 之前。注意：STL 算法可以移动元素但不能删除它们，但是每个\
    \ stl 容器模板类都有一个名为“erase()”的成员函数用于删除指定的元素。换句话说，迭代器可以修改容器中的元素但不能修改容器本身。因此，为了删除重复，我们从迭代器“my_unique”到\
    \ end() 应用 erase 操作\n步骤.3 删除这些重复元素：\n迭代器通过 erase() 之后，即，\n最终：(1111; 1124; 1134;\
    \ 1176; )\n[/content] \n\n```cpp\n// 容器无关代码\n// 单类型容器\ntemplate<typename container>\n\
    void cout_container(const std::string& message, const container& data) {\n   \
    \ cout << message << \"{\";\n    if(data.empty()){\n        cout << \"NULL}\"\
    \ << std::endl;\n        return;\n    }\n    auto start = data.begin();\n    auto\
    \ end = data.end();\n    while(true){\n        cout << *start;\n        ++start;\n\
    \        if(start != end)\n            cout << \", \";\n        else\n       \
    \     cout << '}' << std::endl;\n            break;\n    }\n}\n```\n\n```cpp\n\
    // cout_containers.cpp\n#include \"..\\..\\my_essentials.hpp\"\n#include <array>\n\
    #include <vector>\n#include <unordered_set>\n#include <forward_list>\n#include\
    \ <set>\nint main() {\n    // 定义定义\n    // 固定大小数组\n    array<int,6> arr = {1,3,5,1,2,4};\n\
    \    cout_container(\"my array\\t = \", arr);\n    // 一个 vector\n    vector<int>\
    \ vec(arr.begin(), arr.end());\n    cout_container(\"my vector\\t = \", vec);\n\
    \    // 一个 forward_list\n    forward_list<int> f_lis(arr.begin(), arr.end());\n\
    \    cout_container(\"my forward_list\\t = \",f_lis);\n    // 一个 unordered_set\n\
    \    unordered_set<int> u_set(arr.begin(), arr.end());\n    cout_container(\"\
    my unordered_set = \", u_set);\n    // 一个 set\n    set<int> se(arr.begin(), arr.end());\n\
    \    cout_container(\"my set\\t\\t = \", se);\n    just_pause();\n}\n```\n\n输出是：\n\
    my array = {1, 3, 5, 1, 2, 4}\nmy vector = {1, 3, 5, 1, 2, 4}\nmy forward_list\
    \ = {1, 3, 5, 1, 2, 4}\nmy unordered_set = {1, 3, 5, 2, 4}\nmy set = {1, 2, 3,\
    \ 4, 5}\n\n# 第 7 章 STL 算法\n\nSTL 算法位于 `<algorithms>` 头文件中，因此我们需要在程序中包含它。这些算法可以分类为："
- fmt: "\n*   Non-modifying algorithms: e.g. `for each`, `count`, `search` etc.\n\
    *   Modifying algorithms: e.g. `copy`, `transform`, etc.\n*   Removing algorithms:\
    \ `remove`, `remove if`, etc.\n*   Mutating algorithms: `reverse`, `rotate`, etc.\n\
    *   Sorting algorithms: `sort`, `partial sort`, etc.\n*   Sorted range algorithms:\
    \ `binary search`, `merge`, etc.\n*   Numeric algorithms: `accumulate`, `partial\
    \ sum`, `inner product`, etc.\n\nThe following example shows how `sort()` function\
    \ works on arrays.\n\nProgram 13.11: sorting of array using `sort` algorithm\n\
    ```cpp\n#include <iostream>\n#include <algorithm>\nusing namespace std;\nint main(){\n\
    \    int a[ ] = {3,5,7,2,9};\n    sort(a, a + 5);\n    cout << \"Sorted Array:\"\
    \ << endl;\n    for (int i = 0; i <5; i++)\n    cout << a[i] << \" \";\n    return\
    \ 0;\n}\n```\nOutput:Sorted Array:2 3 5 7 9\n\nIn the example above, when we pass\
    \ array name `a` as an argument, we are telling the function, to sort at the beginning\
    \ of the array. If we wanted it to start the sort at the third element of the\
    \ array, we can use, `sort(a+3, a+5);`. We have used `a+5` for the second argument,\
    \ which specifies that we want to sort to the last element in the array.\n\nNow\
    \ similar `sort()` function can work with `vector` container as shown in following\
    \ program. This shows that STL algorithms are generic.\n\nProgram 13.12: Sorting\
    \ of vector using `sort` algorithm\n```cpp\n#include <iostream>\n#include <algorithm>\n\
    #include <vector>\nusing namespace std;\nint main(){\n    int a[ ] = {5,3,7,6,2,9};\n\
    \    vector<int> v(a, a+6) ;\n    sort(v.begin(), v.end());\n    for (int i =\
    \ 0; i != v.size(); i++)\n    cout << v[i] << \" \";\n    cout << endl;\n    return\
    \ 0;\n}\n```\nOutput: 2 3 5 6 7 9\n\nAs you can see, the sorting function works\
    \ almost the same as on an array. The first parameter in `sort()` accepts an iterator\
    \ to the first element using `begin()` as it returns a iterator to the first element.\
    \ So it will start sorting at the first element in the vector. Same way `end()`\
    \ returns an iterator that points to 1 past the last element in the container.\
    \ Note that `sort` function sorts up to but not including what we pass as the\
    \ second parameter.\n\n`find()` and `count()` algorithm\n`find()` algorithm is\
    \ helpful to find particular value from the container. `count()` is used to count\
    \ how many times a particular value appears in container.\n\nProgram 13.13: Finding\
    \ value from vector using `find` algorithm\n```cpp\n#include <iostream>\n#include\
    \ <algorithm>\n#include <vector>\nusing namespace std;\nint main(){\n    vector<int>\
    \ v;\n    for(int i = 0; i < 10; i++)v.push_back(i);\n    int a = 5;\n    vector<int>::iterator\
    \ it;\n    it = find(v.begin(),v.end(),a);\n    if(it != v.end()) {\n        cout\
    \ << \"found \" << a<< endl;\n    }else {\n        cout << \"could not find \"\
    \ << a << endl;\n    }\n    int c = count(v.begin(), v.end(), 6);\n    cout<<\"\
    Number of 6 stored in vector:\" << c;\n    return 0;\n}\n```\nOutput: found 5Number\
    \ of 6 stored in vector: 1\n\n*   For `each()`\n\nThis algorithm applies a specified\
    \ function object to each element in a container. Original values in container\
    \ will not change, but it is used for display modified elements. It takes the\
    \ first two arguments as the start and end range. The third argument is an address\
    \ of a function object.\nFor example, for `each()` algorithm squares all elements\
    \ of the array and displays them.\n\nProgram 13.14: To square all elements of\
    \ array using `for each` algorithm\n```cpp\n#include <iostream>\n#include <vector>\n\
    #include <algorithm>\nusing namespace std;\nvoid square(int a){\n    cout<<a*a<<endl;\n\
    }\nint main(){\n    int s[ ]={1,2,3,4};\n    for_each(s, s+4, square);\n    return\
    \ 0;\n}\n```\nOutput:14916\n\n# Chapter 8. Library Functions\n\n## Library functions\
    \ and user-defined functions in C++\n\n### Learning objective\nAfter completing\
    \ this topic, you should be able to give a brief account of library functions\
    \ and user-defined functions in C++.\n\n### 1. Incorporation of library functions\n\
    The C++ programmer has access to a large selection of library functions. You can\
    \ use any function in the library by simply including the name of the header file\
    \ that contains the appropriate function prototype.\n\nGenerally, library functions\
    \ are specified in a pair of files.\nThe function definition is contained in a\
    \ source file that usually has a `.c` or `.cpp` file extension.\n**Note**: Usually,\
    \ you are not supplied with the source code for library functions with a compiler.\
    \ Instead, you are supplied with precompiled object files that can be linked to\
    \ your program.\nThe function prototype is contained in a header file, which may\
    \ be distinguished by an `.h`, `.hpp`, or `.hxx` file extension.\n**Note**: Header\
    \ files also contain definitions of various data types and constants needed by\
    \ those functions.\n\nThough not mandatory, it's a good idea to organize your\
    \ own functions in the same way as supplied library functions. This allows you\
    \ to use the functions in more than one program without having to respecify the\
    \ code.\n\nIn order to call library functions in a program, you must specify the\
    \ header file that contains the appropriate function prototype. This is usually\
    \ done at the beginning of a source file. But it must be done before the function\
    \ is used by the program.\n\nHeader files can be included in a program by using\
    \ the `#include` preprocessor directive. This tells the preprocessor to open the\
    \ named header file and insert its contents where the `#include` statement appears.\n\
    \n```cpp\n#include <string>\n#include \"myfuncs.h\"\n```\n\nYou can name files\
    \ in an `#include` statement in two ways, that is in double quotes or in angle\
    \ brackets (`<>`). Filenames in angle brackets tell the preprocessor to look through\
    \ a search path specified in the environment.\n\n```cpp\n#include <string>\n#include\
    \ \"myfuncs.h\"\n```\n\nFilenames in double quotes tell the preprocessor to search\
    \ the current directory first, then the specified search path. An error is reported\
    \ if a file cannot be found.\n\n```cpp\n#include <string>\n#include \"myfuncs.h\"\
    \n```\n\nThe linker always searches for the compiled versions of any functions\
    \ specified in an included header file.\n\n### Available files\nThe C standard\
    \ library provides a collection of functions for performing common tasks such\
    \ as:\n*   String handling\n*   Character and type conversion\n*   Mathematics\n\
