  trans: "\n\n*   非修改算法：例如 `for each`、`count`、`search` 等。\n*   修改算法：例如 `copy`、`transform`\
    \ 等。\n*   删除算法：`remove`、`remove if` 等。\n*   变异算法：`reverse`、`rotate` 等。\n*   排序算法：`sort`、`partial\
    \ sort` 等。\n*   有序范围算法：`binary search`（二分查找）、`merge` 等。\n*   数值算法：`accumulate`（累加）、`partial\
    \ sum`、`inner product`（内积）等。\n\n以下示例展示了 `sort()` 函数是如何在数组上工作的。\n\n程序 13.11：使用\
    \ `sort` 算法对数组\n```cpp\n#include <iostream>\n#include <algorithm>\nusing namespace\
    \ std;\nint main(){\n    int a[ ] = {3,5,7,2,9};\n    sort(a, a + 5);\n    cout\
    \ << \"Sorted Array:\" << endl;\n    for (int i = 0; i <5; i++)\n    cout << a[i]\
    \ << \" \";\n    return 0;\n}\n```\n输出：Sorted Array:2 3 5 7 9\n\n在上面的示例中，当我们把数组名\
    \ `a` 作为参数传递时，我们是在告诉函数从数组的开头开始排序。如果我们想让它从数组的第三个元素开始排序，可以使用 `sort(a+3, a+5);`。我们在第二个参数中使用了\
    \ `a+5`，它指定了我们要排序到数组的最后一个元素。\n\n现在，类似的 `sort()` 函数也可以作用于 `vector` 容器，如下面的程序所示。这表明\
    \ STL 算法是泛型的。\n\n程序 13.12：使用 `sort` 算法对 vector 进行排序\n```cpp\n#include <iostream>\n\
    #include <algorithm>\n#include <vector>\nusing namespace std;\nint main(){\n \
    \   int a[ ] = {5,3,7,6,2,9};\n    vector<int> v(a, a+6) ;\n    sort(v.begin(),\
    \ v.end());\n    for (int i = 0; i != v.size(); i++)\n    cout << v[i] << \" \"\
    ;\n    cout << endl;\n    return 0;\n}\n```\n输出：2 3 5 6 7 9\n\n如你所示，排序函数的工作方式几乎与数组上相同。`sort()`\
    \ 中的第一个参数接受使用 `begin()` 指向第一个元素的迭代器，因为它返回一个指向第一个元素的迭代器。因此，它将从 vector 的第一个元素开始排序。同样，`end()`\
    \ 返回一个指向容器中最后一个元素之后的迭代器。请注意，`sort` 函数排序到我们传递的第二个参数所的位置，但**不包含**该位置元素。\n\n`find()`\
    \ 和 `count()` 算法\n`find()` 算法有助于从容器中查找特定值。`count()` 用于统计某个特定值在容器中出现的次数。\n\n程序\
    \ 13.13：使用 `find` 算法从 vector 中查找值\n```cpp\n#include <iostream>\n#include <algorithm>\n\
    #include <vector>\nusing namespace std;\nint main(){\n    vector<int> v;\n   \
    \ for(int i = 0; i < 10; i++)v.push_back(i);\n    int a = 5;\n    vector<int>::iterator\
    \ it;\n    it = find(v.begin(),v.end(),a);\n    if(it != v.end()) {\n        cout\
    \ << \"found \" << a<< endl;\n    }else {\n        cout << \"could not find \"\
    \ << a << endl;\n    }\n    int c = count(v.begin(), v.end(), 6);\n    cout<<\"\
    Number of 6 stored in vector:\" << c;\n    return 0;\n}\n```\n输出：found 5\nNumber\
    \ of 6 stored in vector:1\n\n"
