    *   你正在开发一款 MMORPG 游戏，玩家需要快速登录——这涉及到快速查找玩家信息。

    *   你正在开发一款处理信用卡的软件，每小时需要处理数百万笔交易——需要非常快速找到信用卡余额。

    *   你正在使用低功耗设备（如平板电脑或智能手机）向用户展示通讯录。你不希望用户因为你的数据结构太慢而导致一直卡顿。

