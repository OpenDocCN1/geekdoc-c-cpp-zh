    ## 类 (Classes)

    这些是你语言的组织工具。它们可以被看作是存放或存储对象的盒子，并对相似的对象进行分类。你可以为类命名任何你喜欢的，但将以某种方式具有相似特征的对象放在同一个类中是一个良好的编码习惯。


    ## 对象 (Object)

    对象是你代码中具有状态和行为的实体。这些可以是颜色、纹理、形状等东西。你通常会将这些对象分类到具有相似对象的类中。因此，如果你有一个关于狗的类，你可以将不同类型的狗放在同一个类中。


    ## 方法 (Method)

    这是编码中用于描述行为的术语。你可以根据需要使用任意数量的方法。这就是你操作数据的方式，并且操作将根据你正在处理或使用的方法执行。如果不使用正确的方法，你的程序将不知道确切应该做什么。


    ## 实例变量 (Instant variable)

    这些指的是你正在处理的个体。每个对象都使用一组唯一的变量进行分类，这些变量就像指纹一样用于识别你的对象。你可以在创建对象时使用某些值为对象分配正确的变量。这就是在
    C++ 中编写代码的基础。你应该花些时间在编译器中写出上面的代码，通过练习来理解你在这里应该做什么。我们稍后会查看这些代码可以进行的一些事情，但这是一个很好的开始点。


    ### C++ 数据类型

    就像你在在此过程中可能想要使用的其他编码语言一样，在 C++ 代码中也会出现很多数据点。你通常会经常处理变量，例如，变量只是你在计算机内存中预留的区域，以确保代码的不同部分保持安全。在处理
    C++ 语言时，我们有很多可以关注的数据点，这些包括：


    1. 布尔 (Boolean)

    2. 双精度浮点 (Double floating point)

    3. 浮点 (Floating point)

    4. 整数 (Integer)

    5. 字符 (Character)

    6. 空值 (Valueless)

    7. 宽字符 (Wide character)


    ### C++ 函数

    我们还需要看看在使用 C++ 语言时会遇到的一些函数。函数非常简单，它只是为了执行任务而的一组顺序语句。你在 C++ 中编写的每个程序至少都会有一个函数，被称为
    `main()` 函数，但你可能需要添加更多函数以便使其代码按照我们想要的方式运行。你可以通过多种不同的方式实现这一点。首先，我们可以选择根据我们希望运行的方式将代码拆分成几个函数。你决定如何拆分代码以及使用多少个函数取决于你以及你试图在代码中编写的内容。但大多数程序员会以这种方式拆分，使每个函数都能独立完成自己的任务。


    函数声明将告诉编译器函数名、随之来的参数以及我们将看到的返回类型。但请记住，我们看到的函数定义将位于函数的实际体中。我们在 C++ 库中看到的标准库将为我们提供许多已经内置在程序中的函数，我们也可以随时根据需要调用它们。例如，如果我们正在使用
    `strcat()` 函数，它可以帮助我们连接两个字符串。然后我们可以使用 `memcpy()` 来帮助我们将内存的某一个位置的内容复制到另一个位置。这些只是你能够使用的不同类型的函数，你会发现每一个它们的工作方式都是相似的。


    考虑到这一点，我们需要更进一步，实际上看看我们如何在 C++ 中应用函数。你将能够用于定义泛的代码将包括：


    ```

    返回类型 函数名 (参数列表) {函数体}

    ```


    这些函数定义将由函数头和函数体组成。函数的各个部分包括以下内容：


    - **返回类型 (Return type)**：你正在处理的函数可能会返回一个值，你将使用返回类型的值来在这里返回某些内容。某些函数可以执行你的操作而不向你返回值。使用我们上面使用的语法，你最终将得到
    `void` 的答案。

    - **函数名 (Function name)**：这是你给函数起的名字。当你把函数名和参数放在一起时，你就得到了所谓的“函数签名”。

    - **参数 (Parameters)**：参数是一个占位符。当你调用函数时，你是将一个值传递给参数。这个值将被称为实际参数或参数。参数列表将能够引用参数的数量、顺序和类型。编写一个完全没有参数的函数也是可能的。

    - **函数体 (Function body)**：最后，函数体将包含一组能够定义函数作用的语句。


    很多时候，我们将使用函数来帮助完成代码的某些部分，并确保所有内容都准备就绪。请确保练习这些函数，看看它们是如何满足我们的需求的。


    ### 修饰符类型 (Types of Modifiers)

    每当你要在 C++ 中执行某些代码时，你会发现可以使用 `char`、`double` 和 `int`，以便让其前面的修饰符生效。我们在这里讨论的修饰符将帮助我们改变该基本类型的含义，使其适应我们试图创建的任何程序或情况。我们可以处理的数据有很多类型的修饰符。这些包括
    `signed`（有符号）、`unsigned`（无符号）、`long`（长）和 `short`（短）。


    这四种修饰符适用于任何整数基本类型。你可以使用 `signed` 和 `unsigned` 来处理 `char`，然后 `long` 可以用于 `double`（例如）。C++
    还将让我们更方便地使用缩写表示法来处理这些整数。这意味着你可以直接使用这些单词，而不需要添加 `int` 部分，因为这在编码中是隐含的。


    我们还有不同类型的限定符（qualifiers）来让你的 C++ 代码正常工作。以下是你可以使用的一些限定符类型，用于为其先前的变量提供一些额外信息：


    - **常量 (Const)**：具有 `const` 的对象在程序执行期间无法被更改。

    - **易变 (Volatile)**：易变性修饰符会告诉编译器你可以更改值，但这些更改可能不是由程序显式指定的。


