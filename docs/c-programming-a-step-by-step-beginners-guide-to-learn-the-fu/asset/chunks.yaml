- fmt: "\nIn comparison, `O(n) > O(log n) > O(1)`, which means `O(1)` is the fastest\
    \ operation; and caution: These are expected, or average complexity, and the Standard\
    \ Library document quotes worst‑case complexities for some of the operators. There\
    \ are a few containers which do not support iterators, and they are: container\
    \ adapters, `bitset`, and `valarray`. Note: C++11 defines iterators `begin()`\
    \ and `end()` for the `valarray`.\n\n# STL Iterators\n\nIterators, containers,\
    \ and algorithms are components of the Standard Template Library written by Alexander\
    \ Stepanov et al., of Hewlett-Packard in the early 1990s and subsequently merged\
    \ and advanced in the Standard Library.\n\nAn iterator is an abstraction of a\
    \ specialized pointer that dereferences over elements of a given container (such\
    \ as `vector`, `map`, and user made container classes). Each container class would\
    \ contain member functions for generating iterators, for example, members `begin()`\
    \ and `end()` would return iterator for the first element, and for one after its\
    \ last element, respectively.\n\nThe following figure depicts the relation between\
    \ an iterator `*it` and its container `vector<int>data {1111, 1134, 1134, 1124,\
    \ 1124, 1134, 1111, 1176, 1124, 1134, 1176}`. Then, the iterator can incorporate\
    \ those elements of the container in algorithmic operations (such as `sort`, `accumulate`,\
    \ and user made algorithm functions). In other words, an iterator associates a\
    \ container with an algorithm.\n\nThe most frequently used iterators are from\
    \ `begin()` and `end()`. This is illustrated in the figure below: As shown in\
    \ the figure, both `data[0]` and `data.begin()` represent the same element, i.e,\
    \ elem 1, but `data[N]` and `data.end()` represent a “no man land” and accessing\
    \ this can cause a runtime error. However, the member function `end()` is very\
    \ useful in making conditions in iterative statements.\n\nThe following code illustrates\
    \ this fundamental property of iterators:\n\n```cpp\n// iterators.cpp\n#include\
    \ \"..\\..\\my_essentials.hpp\"\nvoid illustrate_iterators(){\n    int arr[] =\
    \ {1111, 1134, 1134, 1124, 1124, 1134, 1111, 1176, 1124, 1134, 1176};\n    vector<int>data(arr,\
    \ arr+ sizeof(arr)/sizeof(arr[0]) );\n    // vector<int>data2{1111, 1134, 1134,\
    \ 1124, 1124, 1134, 1111, 1176, 1124, 1134, 1176}; // fine with gcc4.7.0\n   \
    \ cout << \"\\n Illustration of iterators: \\n\" << \"\\n Given vector: data =\\\
    n\\t( \";\n    for(auto element: data) // 'the range-based for' do not work with\
    \ VC10.\n        cout << element << \"; \";\n    cout << \")\\n\\n Let us define\
    \ an iterator, say *it for this vector.\\n\";\n    vector<int>::iterator it =\
    \ data.begin();\n    /*Note:In STL containers, each container template classdefines\
    \ its own iterator member class, so thatvector<int>::iterator is different from\
    \ thelist <int>::iterator.*/\n    cout << \" Thus,\\t\\t*it = \" << *it << \"\
    \ that is data[0]\\n Iterators can be incremented, i.e, ++it;\\n\";\n    ++it;\n\
    \    cout << \" After ++\\t*it = \" << *it << \" that is data[1]\\n Therefore,\
    \ iterator *it dereferences through vector data.\\n So, let us express the entire\
    \ vector using the iterator:  \\n\\t( \";\n    for(auto it = data.begin(); it!=data.end();\
    \ ++it)\n        cout << *it << \"; \";\n    cout << \")\\n\";\n    cout << \"\
    \\n Task: Since, this vector has repeated numbers,\\n Can we keep only one copy\
    \ of each number and remove the duplicates?\\n Yes, we can!\\n For that, we pass\
    \ the iterator through three type of STL algorithms as shown below:\\n\";\n  \
    \  cout << \"\\n Step.1 Sort in ascending order:\\n\";\n    sort(data.begin(),\
    \ data.end());\n    cout << \" After the iterator has passed through sort(): \\\
    n\\t( \";\n    for(auto element: data)\n        cout << element << \"; \";\n \
    \   cout << \")\\n\\n Step.2 Move the adjacent repeated elements to the left hand\
    \ side:\\n\";\n    auto my_unique = unique(data.begin(), data.end());\n    cout\
    \ << \" After the iterator has passed through unique(): \\n\\t( \";\n    for(auto\
    \ element: data)\n        cout << element << \"; /*/*The function unique() has\
    \ returned an iterator tothe identifier “my_unique” starting from which therepeated\
    \ elements are pushed up to one before theend().Note: The STL algorithms can displace\
    \ the elementsbut it cannot erase them, however each stl containertemplate class\
    \ has a member function called“erase()” operation for erasing the specifiedelements.In\
    \ other words, iterators can modify elements in containers but not the containers\
    \ themselves.Therefore, to remove the duplicates, we apply theoperation erase()\
    \ from the iterator “my unique” tillthe end().*/\n    cout << \")\\n\\n Step.3\
    \ Erase out those repeated elements:\\n\";\n    data.erase(my_unique, data.end());\n\
    \    cout << \" After the iterator has passed through erase() i.e., \\n Final:\\\
    t( \";\n    for(auto element: data)\n        cout << element << \"; \";\n    cout\
    \ << \")\\n\";\n}\nint main(){\n    illustrate_iterators();\n    just_pause();\n\
    }\n```\n\nOutput:\nIllustration of iterators:\nGiven vector: data =( 1111; 1134;\
    \ 1134; 1124; 1124; 1134; 1111; 1176; 1124; 1134; 1176; )Let us define an iterator,\
    \ say `*it` for this vector.\nThus, `*it = 1111` that is `data[0]`Iterators can\
    \ be incremented, i.e, `++it`.\nAfter ++ `*it = 1134` that is `data[1]`\nTherefore,\
    \ iterator `*it` dereferences through vector data.\nSo, let us express the entire\
    \ vector using the iterator: ( 1111; 1134; 1134; 1124; 1124; 1134; 1111; 1176;\
    \ 1124; 1134; 1176; )\nTask: Since, this vector has repeated numbers,\nCan we\
    \ keep only one copy of each number and remove the duplicates?\nYes, we can!\n\
    For that, we pass the iterator through three types of STL algorithms as shown\
    \ below:\nStep.1 Sort in ascending order:\nAfter the iterator has passed through\
    \ `sort()`: ( 1111; 1111; 1124; 1124; 1124; 1134; 1134; 1134; 1134; 1176; 1176;\
    \ )\nStep.2 Move the adjacent repeated elements to the left hand side:\nAfter\
    \ the iterator has passed through `unique()`: ( 1111; 1111; 1124; 1124; 1124;\
    \ 1134; 1134; 1134; 1134; 1176; 1176; )\nStep.3 Erase out those repeated elements:\n\
    After the iterator has passed through `erase()` i.e.,\nFinal: ( 1111; 1124; 1134;\
    \ 1176; )\n\n```cpp\n// Container independent code for printing out\n// container\
    \ with one type\ntemplate<typename container>\nvoid cout_container(const std::string&\
    \ message, const container& data) {\n    cout << message << \"{\";\n    if(data.empty()){\n\
    \        cout << \"NULL}\" << std::endl;\n        return;\n    }\n    auto start\
    \ = data.begin();\n    auto end = data.end();\n    while(true){\n        cout\
    \ << *start;\n        ++start;\n        if(start != end)\n            cout <<\
    \ \", \";\n        else\n            cout << '}' << std::endl;\n            break;\n\
    \    }\n}\n```\n\n```cpp\n// cout_containers.cpp\n#include \"..\\..\\my_essentials.hpp\"\
    \n#include <array>\n#include <vector>\n#include <unordered_set>\n#include <forward_list>\n\
    #include <set>\nint main() {\n    // Let us define,\n    // a fixed-size array\n\
    \    array<int,6> arr = {1,3,5,1,2,4};\n    cout_container(\"my array\\t = \"\
    , arr);\n    // a vector\n    vector<int> vec(arr.begin(), arr.end());\n    cout_container(\"\
    my vector\\t = \", vec);\n    // a forward_list\n    forward_list<int> f_lis(arr.begin(),\
    \ arr.end());\n    cout_container(\"my forward_list\\t = \",f_lis);\n    // an\
    \ unordered_set\n    unordered_set<int> u_set(arr.begin(), arr.end());\n    cout_container(\"\
    my unordered_set = \", u_set);\n    // a set\n    set<int> se(arr.begin(), arr.end());\n\
    \    cout_container(\"my set\\t\\t = \", se);\n    just_pause();\n}\n```\n\nThe\
    \ output is:\nmy array = {1, 3, 5, 1, 2, 4}\nmy vector = {1, 3, 5, 1, 2, 4}\n\
    my forward_list = {1, 3, 5, 1, 2, 4}\nmy unordered_set = {1, 3, 5, 2, 4}\nmy set\
    \ = {1, 2, 3, 4, 5}\n\nThe program presented above demonstrates the usefulness\
    \ of iterators incorporating container data in algorithms. As we saw, the iterators\
    \ can be used for printing the contents of a container, so let us code a container\
    \ independent code in our header file \"my_essentials.hpp\". This is for easy\
    \ printing of containers of one type such as `vector<T>`, `list<T>`, `set<T>`,\
    \ `multiset<T>`, and `deque<T>` and fixed-size `array<T,N>`, but not for containers\
    \ with two type names such as `map<T1,T2>` and `unordered_multimap<T1,T2>`.\n\n\
    (Note: The provided text contained some repetitive sections and overlapping logic\
    \ in the comments which have been cleaned up for readability while preserving\
    \ the original source logic.)\n\nAs we experimented with some applications of\
    \ iterators, now we summarize their operations in the following table. Iterators\
    \ do not have a single definition, so not all iterators can support every operation\
    \ mentioned above. Iterators are categorized into five kinds, viz.\n\nThus, with\
    \ this primary discussion, we found that pointers and their property of dereferencing\
    \ over different objects play a vital role to iterators and STL operations.\n\n\
    # Chapter 7. STL Algorithm\n\nThe STL algorithms are found in `<algorithms>` header\
    \ file, so we need to include it in our program. The algorithms can be classified\
    \ as:\n"
