    # C++ 编程

    一份面向初者的分步指南，帮助你学习多范式编程语言的基础知识，并开始管理数据，包括如何编写你的第一个程序。


    ## 引言

    可能有很多不同的编程语言，当我们谈论容易上手的编程语言时，C++ 通常不会出现在名单上。我们可能会发现使用这种语言有许多优势，但与其他一些语言相比，它通常被认为更难上手。正如我们在本指南中将要探索的那样，你会发现这实际上是一种非常棒的语言。它将为我们提供所需的一些最佳技巧和方法，并向我们展示如何实际编写所需的各种代码。如果你正在寻找一种强大的、可以帮助
    Web 应用、游戏等领域的编程语言，并且想学习如何使用它，那么本指南就是为你准备的。在内部，我们将学习关于 `C++` 编程所需的所有知识。我们将从使用这种语言的一些基础知识开始，例如这种语言的本质，以及它与许多其他语言相比的优点。一旦我们掌握了
    `C++` 语言的基础，你就可以开始探索其他我们需要了解的内容。我们将深入研究语法和该语言的基础知识。它与其他一些编程语言略有不同，因此学习如何实现这些并进行操作至关重要。我们还将探索一些流行的且与
    `C++` 良好配合的不同库，这些库可以扩展我们看到的功能。到此时，我们已经掌握了 `C++` 编程的基础，并对这种语言整体有了更多了解。现在是时候真正进入关于如何编写我们想要的代码的信息了。有许多不同类型的代码我们可以关注，也有许多我们可以操作的领域，我们将查看与它们相关的代码以及更多内容。我们将通过介绍如何进行这种语言所需的简单调试来结束本指南。有时，特别是作为这种语言的初学者，代码并不一定能按照你喜欢的方式运行，或者会有你需要修复的错误。这对于初学者来说可能是困难的，因为他们想要处理这些代码并让程序运行，但他们可能感到不确定。


    ## 什么是 C++？

    许多初学者将 `C++` 分类为一种复杂的编程语言。无论原因如何，`C++` 并不是复杂的语言，而是一种为初学者提供了良好资源的计算机语言。这是因为这种编程语言在过去的几十年是从另一种主要的编程语言（C
    语言）演变而来的。`C++` 是 `C` 语言的衍生语言，增加了继承和多态等面向对象的原则。`C++` 是 `C` 的子集，并演变成了一个比预期大得实例。


    ## C++ 历史

    在早期，`C++` 仅被用作 `C` 的一种分支语言，并且在没有直接编译器的情况下，在编译之前会被转换回 `C`。一个名为 `Cfront` 的编译器因执行这项工作而闻名。然而，几年后，使用
    `C++` 的人们发现没有实际编译器的语言中编写代码太困难了。因此某些开发者开始开发编译器，这项任务最终由 `Bjarne Stroustrup` 通过研究
    `C++` 完成。通过在几年内实现严格的语法结构，`C++` 在 1998 年被 `ISO`（国际标准组织）认可。第一个更新版本在同年发布，人们对 `C++`
    开始提供的新附加功能感到惊讶。它开始使用高级技术来缩短编译时间，并在第一个版本中引入了模板（templates）。所有强健的新功能帮助 `C++` 开发了支持系统编程的复杂软件。在几年内，`C++`
    有了巨大的进步，并包含了许多可以用于创建通用应用程序的高级功能。非常感谢微软让 `C++` 作为一种编程语言突然兴起。微软开始使用 `C++` 开发其软件
    Visual C++。许多为微软系统开发应用程序的程序员开始发现使用 `C++` 是多么可靠和舒适。到 2009 年，`C++` 标准库已经更新了各种复杂的系统、数学和时间函数。


    ## 为什么 C++ 会成功？

    `C++` 的成功主要归功于它的面向对象特性。在 20 世纪 80 年代初，面向对象的编程范式席卷了科技世界。人们对其提供的适应性和简单性留下了深刻印象。当时的许多内置库可以很容易转换为
    `C++` 功能库。所有这些因素的结合帮助 `C++` 成为这十年最流行的高级编程语言之一。估计到 2025 年，15% 的机器人应用将使用 `C++` 作为开发其资源的主要语言。


    ## 为不同的操作系统设置 C++ 环境

    所有用于创建 `C++` 软件的软件都由代码编辑器和一个用于显示可能错误的内置调试器组成。如果你是一个老派的人，你可以简单地使用文本编辑器并使用命令行环境运行程序。它仍然运行得很好。但对于本节，我们将讨论用于创建
    `C++` 程序的的高级集成开发环境软件。


    ## IDE 是如何工作的？

    `IDE` 使用编辑程序、编译器链机制和调试的结合来创建高效的程序。

    注意：记住，如果你尝试在命令行中执行程序，`C++` 不提供解释器。


    ## 新版 C++ 有什么特别之处？

    较新版本的 `C++` 是为了支持试图实现复杂现实世界项目的开发者而开发的。以下是 `C++` 提供的一些著名的高级特性。


    ### a) 高级数据结构实现

    简单的数据结构，如树（Trees）和链表（Linked lists），可以通过基础 `C++` 版本轻松实现。然而，使用旧版本无法实现图和二叉树等高级数据结构。相反，较新的
    `C++` 版本提供了帮助我们的标准库。


    ### b) 加密特性

    较新版本的 `C++` 为安全提供了高级加密特性。


    ### c) Lambda 实现

    较新版本的 `C++` 支持用于函数式编程的 Lambda 实现。


    ### d) 高级对象特性

    较新版本的 `C++` 包含了高级对象特性。


