    void main(void){\n    cout <<\"The absolute value of -55 is \"<<abs(-55)<< \"\\\
    n\";\n    cout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\n\";\n    cout\
    \ <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\nThe first thing\
    \ to decide when writing this program is which header files to include. To call\
    \ `abs()`, `sqrt()`, and `pow()`, you need to include the header file `cmath`\
    \ in a preprocessor directive. You also need to include the header file `iostream`\
    \ so that `cin` and `cout` statements can be used.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n#include <cmath>\nvoid main(void){\n    cout <<\"The absolute\
    \ value of -55 is \"<<abs(-55)<< \"\\n\";\n    cout <<\"The square root of 100\
    \ is \"<<sqrt(100.0)<< \"\\n\";\n    cout <<\"10 to the power of 5 is \"<<pow(10,5)<<\
    \ \"\\n\";\n}\n```\n\n**Note**: The function `abs()` is also included in the `stdlib.h`\
    \ header file. Once you've completed the preprocessor directives, you can begin\
    \ coding `main()`.\n\n```cpp\n#include <iostream>\nusing namespace std;\n#include\
    \ <cmath>\nvoid main(void){\n    cout <<\"The absolute value of -55 is \"<<abs(-55)<<\
    \ \"\\n\";\n    cout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\n\";\n\
    \    cout <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\nThe\
    \ return value of each of the three functions is displayed directly on screen\
    \ by three separate `cout` statements. You can display a combination of constants,\
    \ data types, and expression values in a `cout` statement, provided that each\
    \ unique item is separated by the insertion operator (`<<`).\n\nIn the first `cout`\
    \ statement, the first value displayed is a constant string. Then the return value\
    \ of the math library function `abs()` is displayed through a call to the function\
    \ `abs()`.\n\nThe `abs()` function calculates the absolute value of the integer\
    \ passed as its function parameter. And the function returns a value of type `int`.\
    \ In this example the argument is a constant, instead of a variable of type `int`.\n\
    \nWhen the `cout` statement is executed, the function is called, and the number\
    \ 55 is displayed on screen.\n\nThe next two lines of code perform function calls\
    \ in the same way as the first line. The function `sqrt()` accepts a single argument\
    \ of type `double` and returns a value of type `double`. In this example, the\
    \ number 10 is displayed on screen.\n\n**Note**: A domain error occurs if the\
    \ argument is a negative number. The library function `pow()` accepts two arguments\
    \ of type `double` and returns a value of type `double`. When the `cout` statement\
    \ executes, the number 50 is displayed.\n\n# I/O Basic Knowledge\n\nNeither C++\
    \ nor C has built input and output in the language. They use functions (C) or\
    \ other I/O objects (C++).\n\n## C++ I/O Class and Header Files\n\nC++ I/O classes\
    \ use header files like `<iostream>`, `<fstream>`, and `<sstream>`.\n\n1. `<iostream>`\
    \ includes `cin`, `cout`, and `cerr`. You should include this in your C++ application.\n\
    2. Classes: `iostream` (streambuf), `fstream` (filebuf), `stringstream` (stringbuf).\n\
    3. `cout` is like `cerr`, but it buffers its output.\n4. C++ normally flushes\
    \ the input buffer when you press enter.\n5. `>>` and `<<` don’t need format string,\
    \ C++ will automatically convert it, it’s better than `printf` and `scanf` in\
    \ C language.\n6. Through inheritance, `fstream` and `cin` share the same usage.\n\
    \n## Input\n\nFor Input, you need to master one basic idea, two languages, and\
    \ three data types. To make continuously input, you need to use `while`. When\
    \ two things happen:\n1. User want to end input (`ctrl+D`) or read the end of\
    \ File (EOF);\n2. Read fail (for example, `cin >> int`, but input letter 'a');\
    \ will return false. Then you need to use some flag or status to tell the difference\
    \ between `EOF` and error inside `while` loop.\n\nTwo languages are C and C++,\
    \ they use different input methods. Three data types are:\n- Number (no space\
    \ in middle)\n- Character (including white-character)\n- String (include space\
    \ in middle)\n\n## Common Input Methods\n\n| Language | Method | \n| :--- | :---\
    \ |\n| **C** | `scanf(\"%d %f %c %s\", &i, &f, &c);` |\n| | `int a = getchar();`\
    \ |\n| | `fgets(char*p, n, stdin);` |\n| **C++** | `cin >> i >> f >> c >> w;`\
    \ |\n| | `cin.get(char &c);` |\n| | `cin.get();` |\n| | `cin.getline(char *p,\
    \ n);` |\n| | `getline(cin, str);` |\n\n### Scanf Specifiers\n\nIn `scanf`, you\
    \ need to specify exact data type when you read:\n1. `H`: `short int` or `short\
    \ unsigned`. Example: `%hd` or `%hu`.\n2. `I`: `long int` or `long unsigned`,\
    \ or `double` (for `%f` conversions). Example: `%ld`, `%lu`, or `%lf`.\n3. `L`:\
    \ The value to be parsed is a `long` for integer types or `long double` for float\
    \ types. Example: `%ld`, `%Lu`, or `%Lf`.\n4. `*`: Tells `scanf()` to do the conversion\
    \ specified, but not store it anywhere. This is what you use if you want `scanf()`\
    \ to eat some data, but you don’t want to store it; you don’t give `scanf()` an\
    \ argument for this conversion. Example: `%*d`.\n\n`scanf(\"%c\", &c)` will read\
    \ any character, including whitespace character. If you want `scanf` skip any\
    \ whitespace, you can use space before `%c`.\n\n```c\nwhile(true) {\n    scanf(\"\
    %c\", &c);\n    //scanf(\" %c\", &c);\n    printf(\"you input: %d\", c);\n}\n\
    ```\nWhen you input `a` (enter), output will be like `you input: 97` (a value),\
    \ `you input: 10` (enter value).\n\n`cin >> c` will not read white character (tab,\
    \ space, newline). If you want to read them from input buffer, you should use\
    \ `getchar()` or `cin.get()`. If you want the user to input his or her name:\n\
    \n```cpp\nwhile(true) {\n    cin >> c;\n    cout << \"you input:\" << c << endl;\n\
    }\n```\nWhen you input `\" a\"` (enter), output will be like `you input: a`, then\
    \ cursor wait for here.\n\n## Read Word and Line\n\nUsing `cin >>` or `scanf`\
    \ will terminate the string after it reads the first space. The best way to handle\
    \ this situation is to use the function to read a line.\n\n| Language | Method\
    \ |\n| :--- | :--- |\n| **C** | `scanf(\"%s\", char_array);` |\n| | `gets(char_array)`\
    \ (not recommended) |\n| | `fgets(char_array, n, stdin);` |\n| **C++** | `cin\
    \ >> char_array;` |\n| | `cin >> str;` |\n| | `cin.getline(char *p, n);` |\n|\
    \ | `cin.get(char *p, n);` |\n| | `getline(cin, str);` |\n\n- `cin >>`: Read a\
    \ word until reach white character.\n- `cin.getline(char *p, n)`: Read a line;\
    \ recommended to use for safety.\n- `getline(cin, str)`: C++ read and discard\
    \ newline.\n"
