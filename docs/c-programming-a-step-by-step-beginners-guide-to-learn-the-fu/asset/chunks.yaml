  trans: "\n\n## 输入流操作\n\n1. `Peek` 返回输入流中的下一个字符，但不从输入流中提取它。例如，你想读取输入直到第一个换行符或句号为止。\n\
    \n```cpp\nchar input[80];\nint i = 0;\nwhile( (ch=cin.peek()) != ’.’ && ch !=\
    \ ’\\n’)cin.get(input[i++];)\ninput[i] = ’\\0’;\n```\n\n2. `Gcount()` 方法返回上一次未格式化提取方法读取的字符数。这意味着通过\
    \ `get()`、`getline()`、`ignore()` 或 `read()` 读取的字符，但不包括通过提取运算符读取的字符。\n\n3. `Putback()`\
    \ 函数将一个字符放回输入缓冲区。\n\n# 第 10 节 内存与资源\n\n## 内存管理\n\nC++ 编程语言在管理执行程序所使用的内存方面，为用户提供了许多选项。在本章中，我们将探索其中一些常用的选项。我们还将介绍一些旨在减少过去困扰\
    \ C++ 项目的内存管理问题的现代技术。\n\n### C++ 程序可用的内存\n\n现代操作系统通常会为程序执行留留一段内存区域，允许操作系统同时管理多个程序的运行。不同的操作系统以不同的方式布局执行程序的内存。然而，这种布局通常包含以下四个部分。\n\
    \n* **代码段 (Code)**：程序编译后的可执行指令存储在代码段内存中。在程序执行期间，代码段的内容永远不会改变。同样，在程序执行过程中，代码段也不会改变。\n\
    * **数据段 (Data)**：持久变量、全局变量以及静态局部变量存储在内存的数据段中。在执行程序的整个寿命期间，数据段的变量一直存在。然而，除非数据是常量，否则执行程序可以自由更改它们的值。虽然存储在数据段变量的值在程序执行过程中可能会改变，但在程序执行时数据段的大小不会改变。这是因为程序的源代码精确地定义了全局变量和静态局部变量的数量。编译器也可能计算出数据段的精确大小。\n\
    * **堆 (Heap)**：执行程序获取动态内存的区域称为堆。使用 `new` 操作符从堆中获取内存，而使用 `delete` 操作符将之前分配的内存还给堆。随着程序使用\
    \ `delete` 和 `new` 释放和分配动态内存，堆的大小在程序执行过程中会收缩和扩张。\n* **栈 (Stack)**：函数参数和局部变量始终存储在栈中。函数参数和局部变量在函数返回时消失，在函数调用时出现。随着各种函数的执行，栈的大小在程序执行过程中也会收缩和增长。\n\
    \n通常，操作系统限制栈的大小。深度递归会消耗大量的栈空间。例如，考虑一个编写不当的递归函数，它忽略了基准情况，导致出现“无限”递归，从而消耗栈上的所有可用空间。这种情况被称为栈溢出。现代操作系统会终止消耗大量栈空间的进程。然而，在某些嵌入式系统中，这种栈溢出可能无法被检测。通常堆空间是充足的，操作系统可以使用虚拟内存为执行程序提供比实际内存中更多的空间。虚拟内存的额外空间来自磁盘驱动器，操作系统根据执行程序的需要将数据从磁盘调到实际内存。使用虚拟内存的程序运行速度比使用少量虚拟内存的程序慢得多。\n\
    \n### 手动内存管理\n\n使用 `delete` 和 `new` 时频繁出现的内存管理问题是寻找和修复逻辑错误源的主要困难。程序员必须严格遵守以下原则：\n\
    \n* 对于你调用 `new` 的每一个对象，只要分配的内存不再需要，就应该始终有一个对应的 `delete` 调用。这听起来很简单，但何时使用 `delete`\
    \ 并不总是很清晰，下面的函数展示了内存泄漏：\n\n```cpp\nvoid calc(int n) {\n// ...\n// 执行一些事情\n// ...\n\
    int *x = new int[n];\n// ...\n// 对 x 执行一些操作\n// ...\n// 退出函数时没有删除 x 的内存\n}\n```\n\
    如果程序调用 `calc` 函数的次数足够，程序最终将耗尽内存。在 `calc` 函数中，`x` 是一个局部变量。从这个来看，`x` 存在栈上。因此，当用户完成特定的\
    \ `calc` 调用时，函数的清理代码会自动释放变量 `x` 帮助的空间。因为所有函数都会自动管理其局部和参数变量的内存。`x` 的问题在于通过 `new`\
    \ 分配指向从堆中分配的内存而非栈。函数执行时，`x` 指向的内容没有被自动释放。\n\n* 绝不应使用 `delete` 操作符来释放未从之前的 `new`\
    \ 调用中分配的内存。下面的代码片段说明了这样一个例子：\n\n```cpp\nint list[10], *x = list; // x 指向 list\n\
    // ...\n// 执行一些事情 \n// ... delete [ ] x; // 逻辑错误，尝试释放 x 的内存\n```\n指针 `x` 所引用的空间不是由\
    \ `new` 操作符分配的，因此不应使用 `delete` 操作符尝试释放该内存。当你尝试删除未用 `new` 分配的内存时，会导致未定义行为，这证明了逻辑错误。\n\
    \n* `delete` 操作符不能被多次用于释放同一块内存。这种情况在两个指针指向同一块内存时很常见。这种指针被称为别名（aliases）。下面的代码片段能更好地说明这种情况：\n\
    \n```cpp\nint *p = new int[10], *y = x; // y 是 x 的别名\n// ...\n// 对 x 和/或 y 执行一些事情\n\
    // ...\ndelete [ ] x; // 释放 x 的内存\n// ...\n// 执行其他事情\n// ...\ndelete [ ] y; //\
    \ 逻辑错误，y 的内存已经释放！\n```\n由于指针 `x` 和 `y` 指向同一块内存，因此 `x` 和 `y` 是彼此的别名。如果你释放了其中一个引用的内存，那么另一块内存也会被释放，因为它们是同一块内存。\n\
    \n* 当你通过 `delete` 释放之前的内存时，不应再次访问它们。当你尝试访问已删除的内存时，会导致未定义行为，这代表了逻辑错误。\n\n"
- fmt: "\n```cpp\nint *list = new int[10]; // ... // Use list, then // ... delete\
    \ [ ] list; // Deallocate list's memory // ... // Sometime later // ... int x\
    \ = list[2]; // Logic error, but sometimes works!\n```\nThe code fragment above\
    \ illustrates how such a situation could arise. For the purpose of efficiency,\
    \ the `delete` operator makes heap space as available without modifying the contents\
    \ in the memory.\n\n## Resource Management\n\nIt is essential that programmers\
    \ call `clear` internationally when they finish with a linked list object. Take\
    \ a look at the following definition:\n\n```cpp\nvoid x() {\n  IntList1 my_list;\
    \ // Constructor called here\n  // Add some numbers to the list\n  my_list.insert(12);\n\
    \  my_list.insert(7);\n  my_list.insert(-14);\n  // Print the list\n  my_list.print();\n\
    } // Oops! Forgot to call my_list.clear!\n```\n\nIn the code above, the variable\
    \ `my_list` is local to function `x`. When the function `x` finishes executing\
    \ the variable `my_list`, it will go out of scope. At this stage, the space on\
    \ the stack-allocated for the local `IntList1` variable named `my_list` is reclaimed.\
    \ Although the list’s head-allocated elements space remains, the only access the\
    \ program can have to the memory is through `my_list.head`, but `my_list` no longer\
    \ exists. This is a classic example of a memory leak.\n\nObserve that none of\
    \ the classes we have designed so far apart from the `IntList1` have this problem.\
    \ However, C++ offers a way out for class designers to specify actions that have\
    \ to occur at the end of an object’s lifespan. A constructor that executes a code\
    \ at the beginning of an object’s existence is known as a destructor. A destructor\
    \ is a special method that executes immediately before the object stops existing.\
    \ A destructor can also have the same name as its class with a tilde `~` prefix.\
    \ Additionally, a destructor does not accept arguments. Code 9.2 shows how to\
    \ add a destructor to a code and also ass the previously suggested optimization\
    \ of the length and clear methods.\n\n### Code 9.2\n\n```cpp\nclass Code9.2 {\n\
    \  // The nested private Node class from before\n  struct Node {\n    int data;\
    \ // A data element of the list\n    Node *next; // The node that follows this\
    \ one in the list\n    Node(int d); // Constructor\n  };\n  Node *head; // Points\
    \ to the first item in the list\n  Node *tail; // Points to the last item in the\
    \ list\n  int len; // The number of elements in the list\npublic:\n    // The\
    \ constructor makes an initially empty list\n    IntList2();\n    // The destructor\
    \ that reclaims the list's memory\n    ~Code9.2(); // Inserts n onto the back\
    \ of the list.\n    void insert(int n);\n    // Prints the contents of the linked\
    \ list of integers.\n    void print() const;\n    // Returns the length of the\
    \ linked list.\n    int length() const;\n    // Removes all the elements in the\
    \ linked list.\n    void clear();\n};\n```\n\n## Conclusion\n\nAfter taking you\
    \ on a guide on ten of the must-know topics in C++, it is left to you now to develop\
    \ your skills. And one thing with languages, be in English, French, or programming\
    \ languages, practice makes perfect. The knowledge we’ve thought you in this book\
    \ can be likened to learning the alphabet and some basic words in English. So,\
    \ we’d advise you to practice with it more. Focus your mind on understanding why\
    \ we use some statements; the result we want to obtain.\n\nGo online, download\
    \ all the necessary application that you find easy to work with, and if you’d\
    \ have to pay for it, purchase it. And when you have everything all set and ready,\
    \ pick up a project and learn. You could build your own little project, or you\
    \ could pick an already made project and try to replicate it. If you ever get\
    \ stuck anywhere, you can always go back, and view and the programmer made the\
    \ project and proceeded. But always try to push yourself to your limit, think\
    \ deep about it before checking.\n\nIt would also help you a great deal to pick\
    \ up other really good books to get different perceptions about a section in C++\
    \ to broaden your understanding of it. Even though we can assure you of the quality\
    \ of this book is sufficient to set you on the right path to becoming a success\
    \ in C++, we would recommend you also read out other books on the programming\
    \ language.\n\nAlso, you could consider picking a different language other than\
    \ C++ to learn side by side with C++. Leaning a new language is an efficient way\
    \ to get a more in-depth understanding of C++. A new language brings in better\
    \ comprehension of the programming language in general. It also broadens your\
    \ mentality of solving problems, which brings out the specificities of the main\
    \ C++ language. And even though you may not use this new language codes in C++,\
    \ it would expose you to proven ideas that you can transpose into C++. A programming\
    \ language we would advise you to study alongside C++ is `Haskell`. You can also\
    \ study `Java` because it is way closer to our everyday English than C++, and\
    \ it would be easier for you to understand. You can also check out our book on\
    \ `Java`.\n\nAdditionally, always try to stay up to date. Catch up with the modern\
    \ C++ features like `C++11`, `C++14`, `C++17`, and a host of other new features\
    \ in the standard library. Some of its latest features, like lambdas, is easy\
