    * We have a class called `Student` which has 2 members, one is `studentID` and
    the other is called `studentName`.

    * We then define a member function called `Display()` which outputs the `studentID`
    and `studentName` to the console.

    * We can then call the member function from the object in the main program.


    With this program, the output is as follows:

    Student ID 1

    Student Name John


    ## So What is Inheritance?


    Inheritance is a concept wherein we can define a class to inherit the properties
    and methods of another class. This helps in not having the need to define the
    class again or having the properties and methods defined again. Let’s say that
    we had a class called `Person`, which had a property of `Name` and a method of
    `Display`. Then through inheritance, we can define a class called `Student`, which
    could inherit the `Person` class. The `Student` class would automatically get
    the ID member and the `Display` function. The `Student` class could then define
    its own additional members if required.


    To define an inherited class, we use the following syntax.


    `Derived class:Base class`


    Here the `Derived class` is the class that will inherit the properties of the
    other class, known as the `Base class`.


    So if we had a base class with a property and a function as shown below.


    `Base class`

    `{Public or protected:Property1;}`


    Then when we define the derived class from the base class, the derived class will
    have access to the property. Note that the property and function need to have
    the access modifier as `public` or `protected`. We will look at access modifiers
    in greater detail later on.


    `Derived class: Base Class`

    `{// No need to define property1, it will automatically inherit these.}`


    Now let’s look at a simple example of inheritance via code.

    **Example 2**: The following program is used to showcase how to use a simple inherited
    class.


    ```cpp

    #include <iostream>

    using namespace std;

    // Defining a simple Person class with a property of Name

    class Person{

    public:

    string Name;

    };

    // Here we have the derived class. It defines another property of ID

    class Student:public Person{

    public:intint ID;

    // Function to display both ID and Name. Since Name is available from the base
    class of Person, we are able to access it here.

    void Display(){cout<<"Student ID "<<ID<<endl;cout<<"Student Name "<<Name;}}

    };

    int main () {

    Student stud1;

    stud1.ID=1;

    stud1.Name="John";

    stud1.Display();

    return 0;

    }

    ```


    With the above program:

    * We are defining a class called `Person` that has one member called `Name`.

    * We then use inheritance to define the `Student` class. Notice that we now define
    another property called `ID`.

    * In the `Display` function, note that we can use the `Name` property without
    the need for defining it in the `Student` class again.


    With this program, the output is as follows:

    Student ID 1

    Student Name John


    Now we have seen how to use derived and base classes, which is also known as inheritance.


    ## 1.2 Functions in Derived Classes


    We can also define functions that can be inherited from base classes. Let’s see
    how we can achieve this.

    If we, for instance, had a base class with a property and a function as shown
    below.


    `Base class`

    `{Public or protected:Property1;Fucntion1;}`


    When we define the derived class from the base class, the derived class will have
    access to the property and the function as well. Note that the property and function
    need to have the access modifier as either `public` or `protected`.


    `Derived class: Base Class`

    `{// No need to define property1 and Function1, it will automatically inherit
    these.}`


    Let’s now look at an example where we can use functions in derived classes.

    **Example 3**: The following program is used to showcase how to use an inherited
    class with functions.


    ```cpp

    #include <iostream>

    using namespace std;

    // Defining a simple Person class with a property of Name, ID, and also a function
    called Display.

    class Person{

    public:

    string Name;

    int ID;

    void Display(){cout<<"ID "<<ID<<endl;cout<<"Name "<<Name;}}

    };

    // The Student class simply derives itself from the Person base class

    class Student:public Person {};

    int main () {

    // Since the derived class has access to the properties and functions of the base
    class , these can be accessed via the Student object

    Student stud1;

    stud1.ID=1;

    stud1.Name="John";

    stud1.Display();

    return 0;

    }

    ```


    With this program, the output is as follows:

    ID 1

    Name John


    We can also redefine the `Display` function in the `Student` class. But if you
    look at the above example, you will notice that the `Display` function in the
    `Person` class has the display text as ID and Name. But suppose we wanted to have
    the display name as Student ID and Student name in the student class, we can redefine
    the `Display` function. Let’s look at an example of this.

    **Example 4**: The following program shows how to use an inherited class with
    redefined functions.


    ```cpp

    #include <iostream>

    using namespace std;

    class Person{

    public:

    string Name;

    int ID;

    void Display(){cout<<"ID "<<ID<<endl;cout<<"Name "<<Name;}};

    };

    class Student:public Person {

    public:

    // Here we are redefining the Display function

    void Display(){cout<<"Student ID "<<ID<<endl;cout<<"Student Name "<<Name;}};

    };

    int main () {

    Student stud1;

    stud1.ID=1;

    stud1.Name="John";

    stud1.Display();

    return 0;

    }

    ```


    With this program, the output is as follows:

    Student ID 1

    Student Name John


    ## 1.3 Multiple Inheritance


    We can also make the derived class inherit from multiple base classes. This helps
    in getting more functionality out of multiple classes all at once.


    `Derived class: base class1, base class2… base classN`


    Here you just need to separate the base classes with a comma.

    So if we had a base class with a property and a function as shown below.


    `Base class1`

    `{Public or protected:Property1;Fuction1;}`

    And another base class as follows.


    `Base class2`

    `{Public or protected:Property2;Fucntion2;}`


    Then when we define the derived class from both of the base classes, the derived
    class will have access to the property and function of both classes.


    `Derived class: Base Class1, Base Class2`

    `{// No need to define property1, property2, and Function1, Fuction2 it will automatically
    inherit these.}`


    Again note that the property and function need to have the access modifier as
    either `public` or `protected`. Let’s look at an example of multiple derived classes.

    **Example 5**: The following program is used to showcase how to use multiple derived
    classes.


    ```cpp

    #include <iostream>

    using namespace std;

    // Defining the first base class of Person

    class Person{

    public:

    string Name;

    int ID;

    void Display(){cout<<"ID "<<ID<<endl;cout<<"Name "<<Name;}}

    };

    // Defining the second base class of Marks

    class Marks{

    public:int marks1,marks2;

    void Sum(){cout<<marks1+marks2;}}

    };

    // The derived class inherits from both the Person and Marks base class.

    class Student:public Person,public Marks {

    public:

    void Display(){cout<<"Student ID "<<ID<<endl;cout<<"Student Name "<<Name<<endl;}};

    };

    int main () {

    Student stud1;

    stud1.ID=1;

    stud1.Name="John";

    stud1.Display();

    stud1.marks1=5;

    stud1.marks2=10;

    stud1.Sum();

    return 0;

    }

    ```


    With the above program:

    * We are defining 2 base classes, one is called `Person`, and the other is called
    `Marks`.

    * The derived class `Student` derives both classes and is able to use the members
    from both classes.


    With this program, the output is as follows:

    Student ID 1

    Student Name John

    15


    ## 1.4 Access Control


    Class modifiers can be used to define the visibility of properties and methods
    in a class. Below are the various modifiers available.


    * `private`: With `private`, the properties and methods are only available to
    the class itself.

    * `protected`: With `protected`, the properties and methods are only available
    to the class itself and subclasses derived from that class.

    * `public`: With `public`, the properties and methods are available to all classes.

