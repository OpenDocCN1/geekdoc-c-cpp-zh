    \ cin.get() return character to test sth.`\n  5. `cin.get() != EOF`\nLine 7: When\
    \ used in `EOF`, you have to use `int`. because `EOF` may not be expressed by\
    \ `char` type.\n- Confused functions: `cin.get` and `cin.getline` are almost the\
    \ same things.\n  `Cin.get( char* s, streamsize n, char delim );`\n  `Cin.getline\
    \ (char* s, streamsize n, char delim );`\n  `Istream& getline (istream& is, string&\
    \ str);`\n  1. For each line, if you don’t know the max length, just use `getline(cin,\
    \ string)`. You don’t need to input any length (you can reserve length of `string`\
    \ if you want to avoid allocation of memory).\n  2. `cin.get()` doesn’t discard\
    \ `delim` from input stream. However, `cin.getline()` will read and discard newline.\
    \ (It’s easy for you to remember, because, line is defined by newline character)\n\
    \  3. In `cin.getline(char* s, int n)` The `failbit` flag is set if the function\
    \ extracts no characters(newline is a character), Or if the `delimiting` character\
    \ is not found once (`n-1`) characters have already been written to `s`. Note\
    \ that if the character that follows those `(n-1)` characters in the input sequence\
    \ is precisely the `delimiting` character, it is also extracted and the `failbit`\
    \ flag is not set.\n  4. In.`cin.get(char* s , int n)`. The `failbit` flag is\
    \ set only if the function extracts no characters.\n  5. `cin.get(char* s, n)`\
    \ is more flexible than `cin.getline`. Because when it read to the array is full,\
    \ It doesn’t set `failbit`. At this time you can use `gcount()` or `peek()` to\
    \ see if the next character is a new line. It’s more customized than `cin.getline()`.\n\
    \n### Input Pattern\n- It is a bad idea to test the stream on the outside and\
    \ then read/write to it inside the body of the conditional/loop statement. This\
    \ is because the act of reading may make the stream bad. It is usually better\
    \ to do the read as part of the test.\n```cpp\nwhile(!cin.fail()){  // that is\
    \ bad programming style\ncin>>i;  //here may make stream fail()......     //then\
    \ i is not valid value\n}\n```\n- If you just want to input, you don’t want to\
    \ know `eof` or deal with `failbit`. You can use below:\n```cpp\nwhile(scanf(\"\
    %d\",&i) != 1)\nwhile((int c = getchar())!=EOF)\nwhile( fgets(line, sizeof(line),\
    \ fp) != NULL )//in c language, use these to exit loop!\nwhile(cin>>input)\nwhile(cin.get(p,\
    \ 20) )\nwhile(getline(ifstream, string)) {//in C++ language, use bool operator\
    \ to exit loop.//do some useful things.  //input is right.}\n```\n- If you want\
    \ to know `eof` or deal with the error. You can use the below code. When you press\
    \ enter, the read will end. When you input letter, it will get rid of this letter\
    \ until you input number.\n```cpp\nwhile(true) //use break to exit loop;\n{\n\
    \  cin>>i//or getline(ifstream, string);\n  If(cin.eof()){   //If it’s EOF\n \
    \   cout<<\"EOF␣ encountered\"<<endl\n    //break;\n  }\n  If(cin.fail()) //deal\
    \ with Invalide input\n  {\n    cin.clear(); //Important. clear state and buffer\n\
    \    while(cin.get()!=’\\n’)  //get rid rest of line,\n    continue ;\n    cout<<\"\
    please␣ input␣a␣ number\"<<endl;\n    continue;\n  }\n  ...  // input is right.do\
    \ some useful things.\n}\n```\n- In the previous example, why do we need to distinguish\
    \ `eof` and `fail`? When `fail` happen, maybe there are invalid character in buffer.\
    \ After clean the buffer, I can continue to read input from input buffer. Three\
    \ methods to clean invalid character in the buffer.\n```cpp\ncin.clear();   //Important.\
    \ clear state and buffer\nwhile(cin.get()!=’\\n’)continue ;      // method 1\n\
    while(!issapce(cin.get()))continue;  //method 2\nbasic_istream& ignore(streamsize\
    \ _Count = 1, \\int_type _Delim = traits_type::eof());  //method 3\ncin.ignore(5,\
    \ ’a’);\ncin.ignore(numeric_limits<streamsize>::max(), ’\\n’);\n```\n- You can\
    \ use `istream_iterator`, It can save you some trouble to judge `EOF`.\n```cpp\n\
    Class A{\nPrivate:\n  Int,y;\n  Friend istream& operator>>(istream& in, A&);\n\
    \  Friend ostream& operator<<(ostream& in, const A&);\n};\nistream& operator>>(istream&\
    \ in, A&){\n  in>>x>>y;\n  return in;\n}\nOstream& operator<<(ostream& out, const\
    \ A& a){\n  out<<a.x<< \" <<a.y;\n  return out;\n}\nVector<A> v;\nCopy(istream_iterator<A>(cin),\
    \ istream_iterator<A>(), Back_inserter(v));\nCopy(v.begin(), v.end(),ostream_iterator<A>(cout,\"\
    \\n\"));\n```\n- In summary, its better just use judgment to exit loop. If you\
    \ need different action to take to deal with `EOF` or error. Use `while(true)`,\
    \ then use `eof()` `fail()` or `clear()` functions in C++.\n\n### Output:\n- For\
    \ `cout`, It can recognize type automatically, and It is extensible, you can redefine\
    \ `<<` operator so that `cout` can recognize data type.\n```cpp\nClass Foo{\n\
    \  Friend ostream& operator<<(ostream& s,const Foo &r);\n};\nOstream& operator<<(ostream&\
    \ s, const Foo &r){\n  s<<a<<Foo.b<<endl;\n}\n```\n- How to print address in C\
    \ and C++?\n```cpp\nchar* amount = \"dozen\";\ncout<< amount ; //print \"dozen\"\
    \ string\ncout<<(void*) amount;//prints the address of pointer\nprintf(\"%p\"\
    , (void*) p);\n```\n- Format is key point for Output. You need to know the common\
    \ manipulator to control the output.\n- Number base manipulators: `hex`, `dec`;\
    \ Field widths: `Width`, `fill`, `Setf()`\n- You don’t need to know the details,\
    \ just name of them. When you want to use them, go to reference to look. A format\
    \ manipulators can be seen on C++ primer you need to include `<iomanip>`\n- `<<`\
    \ is a bitwise left-shift operator in C language, but in C++, we overloaded it\
    \ in `ostream` class, `cout` is an object of ostream\n- You can use `cout<<flush`\
    \ to force flushing the output buffer\n- `cout.write` can be used to output a\
    \ string; It will output certain length string, even reach the end of string.\n\
    \n### Other stream\n- When you studied `cin` and `cout` well, you will find that\
    \ file operation is easy. Just change `cin` or `cout` to your `ifstream` , `ofstream`\
    \ object.\n```cpp\nstd::fstream ifs;\nifs.open (\"test.txt\", ios_base::in| ios_base::binary);\n\
    if(!ifs.is_open())exit(1);\nchar c = ifs.get();// use all previous input\nifs.close();\n\
    ```\n- Only read `ifstream`; only write `ofstream`; write and read `fstream`.\n\
    - For `ios_base::binary` mode, use `write()` and `read()` function.\n- For writing,\
    \ pay attention to the difference between `ios_base::trunc` and `ios_base::app`.\n\
    - Random access is used mostly on binary file. Because the position can be pinpointed\
    \ exactly. For `seekg()` for input, and `seekp()` for output.(p is put, g is get)\
    \ It moves the pointer. `tellp()` and `tellg()` function. It tells the position\
    \ of pointer.\n\n### Buffer and string buffer\n- `String` is a convenient way\
    \ to manipulate strings like an independent I/O device. Sometimes it is very convenient\
    \ to use `stringstream` to convert between strings and other numerical types.\
    \ The usage of `stringstream` are much the same with `iostream`, so it not a burden\
    \ to learn.\n- You need to build a `stringstream` from a string, or convert a\
    \ `stringstream` back to a string.\n```cpp\nstringstream outstr;\noutstr<<\"salary\
    \ value\"<<123333.00<<endl;\nstring str = outstr.str() //change to string\nistringstream\
    \ Instr(str);\nwhile(instr>>number)\n  cout<<number<<endl;\nchar sentence []=\"\
    Yan is 41 years old\";\nchar str [20];\nint i;\nsscanf (sentence,\"%s %*s % %d\"\
    , str, &i);\nsprintf(...);\n```\nLine 1 to 3: Change number to a text.\nLine 5\
    \ to 7: Change text to a number.\nLine 9 to end: C language method. In line 12,\
    \ you can see \"*s\", it means input will be ignored. So `str = Yan`, `i = 41`.\n\
    Manipulate stream\n"
