- fmt: "\nLet’s say we had the following structure for a class.\n\n```cpp\nClass classname{\n\
    Private:\nProperty1;\nFucntion1;\n}\n```\nBoth `property1` and `function1` would\
    \ not be accessible anywhere else except the class it is defined in. If you try\
    \ to access any of these properties or functions from the main program, you will\
    \ get a compile-time error.\n\nNow let’s define the class below, but this time\
    \ we’ll use the protected access modifier.\n\n```cpp\nClass classname1{\nProtected:\n\
    Property1;\nFucntion1;\n}\n```\nNow `property1` and `function1` are accessible\
    \ from both the above class and any other class that derives from it. So if we\
    \ had the below-derived class definition, we would be able to access both `property1`\
    \ and `fucntion1` in the derived class. But note that we will not be able to use\
    \ these properties in any other non-derived class.\n\n```cpp\nClass derivedclassname:\
    \ classname1{}\n```\n\nLet’s look at another example of access modifiers. \n\n\
    ### Example 6: The following program is used to showcase how to use access modifiers.\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nclass Person{\npublic:\n\
    int ID;\nprotected:\n// Note that we are defining the Name property as protected\n\
    string Name;\nvoid Display(){\n    cout<<\"ID \"<<ID<<endl;\n    cout<<\"Name\
    \ \"<<Name;\n}\n// Note that we have defined the city property as private\nprivate:\n\
    string city;\n};\nclass Student:public Person {\npublic:\nvoid Display(){\n  \
    \  cout<<\"Student ID \"<<ID<<endl;\n    cout<<\"Student Name \"<<Name<<endl;\n\
    }\n}};\nint main () {\n    Student stud1;\n    stud1.ID=1;\n    stud1.Name=\"\
    John\";\n    stud1.Display();\n    return 0;\n}\n```\n\nWith this program, the\
    \ output is as follows:\n`error: 'std::__cxx11::string Person::Name' is protected`\n\
    \nWhy are we getting this error? The `person` class has 2 properties called `ID`\
    \ and `Name`. The `name` has the protected access modifier, which means that it\
    \ can only be accessed in the derived class. But we are trying to access it in\
    \ the main class, which is wrong. Hence the correct way to implement this is as\
    \ follows.\n\n### Example 7: The following program shows how to use access modifiers\
    \ in the proper way.\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass\
    \ Person{\npublic:\nint ID;\nprotected:\nstring Name;\nvoid Display(){\n    cout<<\"\
    ID \"<<ID<<endl;\n    cout<<\"Name \"<<Name;\n}\nprivate:\nstring city;\n};\n\
    class Student:public Person {\npublic:\n// We have now defined a function which\
    \ can set the value of the protected property accordingly.\nvoid InputName(string\
    \ pName){\n    Name=pName;\n}\nvoid Display(){\n    cout<<\"Student ID \"<<ID<<endl;\n\
    \    cout<<\"Student Name \"<<Name<<endl;\n}\n}};\nint main () {\n    Student\
    \ stud1;\n    stud1.ID=1;\n    stud1.InputName(\"John\");\n    stud1.Display();\n\
    \    return 0;\n}\n```\n\nIn the above program, we now correctly define a method\
    \ called `InputName` in the `Student` class, which can access the protected `Name`\
    \ member. With this program, the output is as follows:\n`Student ID 1`\n`Student\
    \ Name John`\n\nNow let’s look at the same example and try to display the property\
    \ called `City,’ which is defined in the `Person` class.\n\n### Example 8: The\
    \ following program shows a second example of how to use access modifiers the\
    \ wrong way.\n\n```cpp\n#include <iostream>\nusing namespace std;\nclass Person{\n\
    public:\nint ID;\nprotected:\nstring Name;\nvoid Display(){\n    cout<<\"ID \"\
    <<ID<<endl;\n    cout<<\"Name \"<<Name;\n}\nprivate:\nstring city;\n};\nclass\
    \ Student:public Person {\npublic:\nvoid InputName(string pName){\n    Name=pName;\n\
    }\nvoid Display(){\n    cout<<\"Student ID \"<<ID<<endl;\n    // Note that we\
    \ are trying to use the private property in the derived class.\n    cout<<\"Student\
    \ city \"<<city<<endl;\n    cout<<\"Student Name \"<<Name<<endl;\n}\n}};\nint\
    \ main () {\n    Student stud1;\n    stud1.ID=1;\n    stud1.InputName(\"John\"\
    );\n    stud1.Display();\n    return 0;\n}\n```\n\nWith this program, the output\
    \ is as follows:\n`error: 'std::__cxx11::string Person::city' is private`\n\n\
    Since the `City` property is private, it cannot even be used in the derived class.\
    \ We can only work with this property in the `Person` class.\n\n# Chapter 5. Advanced\
    \ Basics\n\n## Pointers\n\nPointers have been mentioned previously, and they are\
    \ the memory address of a variable, this is much like a house address for a person.\
    \ These can be passed around a parameter and allow the effects of passing by reference\
    \ mentioned previously.\n\nThe program below will show the address of a variable:\n\
    \n```cpp\n#include <stdio.h>\nint main(){\n    int var;\n    printf(\"The address\
    \ is: %x\\n\", &var);\n    return 0;\n}\n```\nOutput: `> The address is: 10ffa2c`\n\
    \nNote: This will be different almost every time you run. Note the highlighted\
    \ statement, the `&` (Reference Operator) is used to return the memory location\
    \ of the variable and allows certain statements to access the data in that location.\
    \ The `%x` is used because a memory location is in hexadecimal.\n\nTo create a\
    \ pointer, we use the dereferencing operator `*`, this will create a pointer variable\
    \ that is designed to hold a memory locations address. Below is a program that\
    \ creates a pointer and uses reference operator `&` to store another regular variable’s\
    \ address in the newly created pointer. The dereferencing operator `*` is also\
    \ used to access or change the actual data in that memory location.\n\n*   Dereferencing\
    \ operator `*` is used to create a pointer, it is also used when changing the\
    \ actual value\n*   Referencing operator `&` is used when obtaining the memory\
    \ location of a pointer \n"
