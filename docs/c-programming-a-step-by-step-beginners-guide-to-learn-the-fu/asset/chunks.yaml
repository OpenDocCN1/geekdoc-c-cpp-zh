    Student{public:int studentID;string studentName;// Function to display the members
    of the classvoid Display(){cout<<"Student ID "<<studentID<<endl;cout<<"Student
    Name "<<studentName;}};int main () {Student stud1;//Assigning values to the properties
    of the classstud1.studentID=1;stud1.studentName="John";stud1.Display();return
    0;}With the above program:'
