                           STL Containers and IteratorsContainersContainers are the
    primary contribution of the STL, and they are for holding and accessing a sequence
    of objects. The STL provides different types of containers, such as vector, list,
    map, and hash tables. However, based on the characteristics of data arrangement,
    the STL containers are categorized into three major sections:


    1.  Sequence containers such as vector, fixed‑ size array, list, forward_list,
    and deque;


    2.  Associative containers:


    a)    Ordered (sorted) associative containers  such as set, multiset, map, and
    multimap;b)    Unordered (unsorted) associative containers such as unordered_set,
    unordered_multiset, unordered_map and unordered_multimap; and


    3.  Container adapters such as stack, queue, and priority_queue.


    In addition to these fully qualified containers, C++ provides three almost qualified
    containers, viz., string, built-in-array and valarray.Each of the containers are
    sophisticated template classes with the default constructor, constructor from
    arguments, copy constructor, assignment operator, and definite destructor. Apart
    from that, most of the containers define its own iterator, and every container
    has its own operation member functions. Container iteratorsFrom those sections,
    we know that each container provides its own iterator and using that iterator
    operations are performed on the elements of the container.Among the five categories
    of iterators, each container defines any one of the three categories, viz.,Forward
    iterators:


    *   Can read;


    *   Can write;


    *   Can be repeated read/write at a single location;


    *   Can move forward (++), but cannot move backwards, thus the name forward iterator;
    and


    *   Is used in: unordered associative containers and forward list, which are for
    the best space-efficient storage.


    *   Bidirectional iterator:


    *   Is same as the forward iterator, but it can also move backwards (so, ++ as
    well as --), thus is named bidirectional; and


    *   Is used in containers: list, set, map, multiset, and multimap.


    *   Random access iterator:


    *   Is the same as the bidirectional iterator, but it can jump (+=N or –=N, where
    N is a whole number) instead of (+=1 or -=1, where +=1 is ++ and -=1 is --), thus
    is named random access iterator(jump iterator); and


    *   Is used in containers: vector, string, deque and array<T,N>.


    Apart from helping the operations of STL algorithms in the containers, the iterators
    also help in executing internal operations (member functions) of the containers.Some
    internal operations are common to all the sequence and associative containers,
    and they are:O(1):begin(), end(),         cbegin(), cend(),      rbegin()*, rend()*,     crbegin()*,
    crend()*,     empty(), swap(),         size()†, max_size(), shrink_to_fit()‡,
    emplace() and emplace_back()*;O(n):Assignment operator: =,Relational operators:!=,
    ==, <††, <=††, >†† and >=††, and clear();O (variable):'
