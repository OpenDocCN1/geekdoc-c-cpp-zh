    n )C++ ​ cin>>i>>f>>c>>w; ​ cin.get(char & c);Ch = cin.get(); ​ cin.get( char
    *p, n);cin.getline(char *p, n);getline(cin, string);


    *   In scanf, you need to specify exact data type when you read.


    1.  H: short int or short unsigned. Example: %hd or %hu.


    2.  I: a long int or long unsigned, or double (for %f conversions.) Example: %ld,
    %lu, or %lf.


    3.  L: The value to be parsed is a long for integer types or long double for float
    types. Example: %Ld, %Lu, or %Lf.


    4.  *: Tells scanf() do to the conversion specified, but not store it anywhere.
    This is what you use if you want scanf() to eat some data, but you don’t want
    to store it anywhere; you don’t give scanf() an argument for this conversion.
    Example: %*d.


