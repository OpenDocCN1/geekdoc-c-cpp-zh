  trans: "\n\n# pow()\n\n```cpp\n#include <iostream>\nusing namespace std;\n#include\
    \ <cmath>\nvoid main(void){\n    cout <<\"The absolute value of -55 is \"<<abs(-55)<<\
    \ \"\\n\";\n    cout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\n\";\n\
    \    cout <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n编写此程序时首先要决定的是包含哪些头文件。为了调用\
    \ `abs()`、`sqrt()` 和 `pow()`，你需要在预处理器指令中包含头文件 `cmath`。你还需要包含头文件 `iostream`，以便使用\
    \ `cin` 和 `cout` 语句。\n\n```cpp\n#include <iostream>\nusing namespace std;\n#include\
    \ <cmath>\nvoid main(void){\n    cout <<\"The absolute value of -55 is \"<<abs(-55)<<\
    \ \"\\n\";\n    cout <<\"The square root of 100 is \"<<sqrt(100.0)<< \"\\n\";\n\
    \    cout <<\"10 to the power of 5 is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n**注意**：`abs()`\
    \ 函数也包含在 `stdlib.h` 头文件中。一旦你完成了预处理器指令，就可以开始编写 `main()` 代码了。\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n#include <cmath>\nvoid main(void){\n    cout\
    \ <<\"The absolute value of -55 is \"<<abs(-55)<< \"\\n\";\n    cout <<\"The square\
    \ root of 100 is \"<<sqrt(100.0)<< \"\\n\";\n    cout <<\"10 to the power of 5\
    \ is \"<<pow(10,5)<< \"\\n\";\n}\n```\n\n这三个函数的每个返回值都通过三个独立的 `cout` 语句直接显示在屏幕上。你可以在\
    \ `cout` 语句中显示常量、数据类型和表达式值的组合，只要每个唯一项目都用插入运算符（`<<`）分隔即可。\n\n在第一个 `cout` 语句中，显示的第一个值是一个常量字符串。然后，通过调用函数\
    \ `abs()` 显示数学库函数 `abs()` 的返回值。\n\n`abs()` 函数计算作为函数参数传递的整数的绝对值。该函数返回 `int` 类型的值。在这个示例中，参数是一个常量，而不是\
    \ `int` 类型的变量。\n\n当执行 `cout` 语句时，函数被调用，屏幕上显示数字 55。\n\n接下来的两行代码执行函数调用的方式与第一行相同。函数\
    \ `sqrt()` 接受一个 `double` 类型参数并返回一个 `double` 类型的值。在这个示例中，屏幕上显示数字 10。\n\n**注意**：如果参数是负数，会发生域错误。库函数\
    \ `pow()` 接受两个 `double` 类型参数并返回一个 `double` 类型的值。当执行 `cout` 语句时，屏幕显示数字 50。\n\n\
    # I/O 基础知识\n\nC++ 和 C 语言本身都没有内置输入输出。它们使用函数（C）或其他 I/O 对象（C++）。\n\n## C++ I/O 类和头文件\n\
    \nC++ I/O 类使用 `<iostream>`、`<fstream>` 和 `<sstream>` 等头文件。\n\n1. `<iostream>`\
    \ 包含 `cin`、`cout` 和 `cerr`。你应该在 C++ 中包含它。\n2. 类：`iostream` (streambuf), `fstream`\
    \ (filebuf), `stringstream` (stringbuf)。\n3. `cout` 像 `cerr`，但它对输出进行缓冲。\n4. C++\
    \ 通常在你按下回车键时刷新输入缓冲区。\n5. `>>` 和 `<<` 不需要格式字符串，C++ 会自动转换，它比 C 语言中的 `printf` 和 `scanf`\
    \ 好。\n6. 通过继承，`fstream` 和 `cin` 共享相同的用法。\n\n## 输入\n\n对于输入，你需要掌握一个基本思想、两种语言和三种数据类型。为了实现连续输入，你需要使用\
    \ `while`。当发生两种情况时：\n1. 用户想要结束输入（`ctrl+D`）或读取文件末尾（EOF）；\n2. 读取失败（例如 `cin >> int`\
    \ 但输入了字母 'a'）；将返回 `false`。这时你需要使用某些标志或状态在 `while` 循环内部区分 `EOF` 和内部错误。\n\n两种语言是\
    \ C 和 C++，它们使用不同的输入方法。三种数据类型是：\n- 数字（中间没有空格）\n- 字符（包括空白字符）\n- 字符串（中间包含空格）\n\n\
    ## 普通输入方法\n\n| 语言 | 方法 |\n| :--- | :--- |\n| **C** | `scanf(\"%d %f %c %s\", &i,\
    \ &f, &c);` |\n| | `int a = getchar();` |\n| | `fgets(char*p, n, stdin);` |\n\
    | **C++** | `cin >> i >> f >> c >> w;` |\n| | `cin.get(char &c);` |\n| | `cin.get();`\
    \ |\n| | `cin.getline(char *p, n);` |\n| | `getline(cin, str);` |\n\n### Scanf\
    \ 格式符\n\n在 `scanf` 中，读取时需要指定精确的数据类型：\n1. `H`: `short int` 或 `short unsigned`。示例：`%hd`\
    \ 或 `%hu`。\n2. `I`: `long int` 或 `long unsigned` 或 `double`（对于 `%f`）。示例：`%ld`,\
    \ `%lu` 或 `%lf`。\n3. `L`: 解析的值是 `long` 整数类型或 `long double` 类型。示例：`%ld`, `%Lu`\
    \ 或 `%Lf`。\n4. `*`: 告诉 `scanf()` 执行指定的转换但不存储在任何地方。示例：`%*d`。\n\n`scanf(\"%c\",\
    \ &c)` 会读取任何字符，包括空白字符。如果你想让 `scanf` 跳过任何空白字符，可以在 `%c` 前加一个空格。\n\n```c\nwhile(true)\
    \ {\n    scanf(\"%c\", &c);\n    //scanf(\" %c\", &c);\n    printf(\"you input:\
    \ %d\", c);\n}\n```\n当你输入 `a`（回车）时，输出为 `you input: 97`（a 的值），`you input: 10`（回车的值）。\n\
    \n`cin >> c` 不读取空白字符（制表符、空格、换行）。如果你想从输入缓冲区读取，可以使用 `getchar()` 或 `cin.get()`。如果你想让用户输入名字：\n\
    \n```cpp\nwhile(true) {\n    cin >> c;\n    cout << \"you input:\" << c << endl;\n\
    }\n```\n当你输入 `\" a\"`（回车）时，输出为 `you input: a`，然后光标等待。\n\n## 读取单词和行\n\n使用 `cin\
    \ >>` 或 `scanf` 会在读取第一个空格后终止字符串。处理这种情况的最好方法是使用读取行的函数。\n\n| 语言 | 方法 |\n| :--- |\
    \ :--- |\n| **C** | `scanf(\"%s\", char_array);` |\n| | `gets(char_array)`（不推荐）\
    \ |\n| | `fgets(char_array, n, stdin);` |\n| **C++** | `cin >> char_array;` |\n\
    | | `cin >> str;` |\n| | `cin.getline(char *p, n);` |\n| | `cin.get(char *p, n);`\
    \ |\n| | `getline(cin, str);` |\n\n- `cin >>`: 读取单词直到遇到空白字符。\n- `cin.getline(char\
    \ *p, n)`: 读取行；为了安全建议使用。\n- `getline(cin, str)`: C++ 读取并丢弃换行符。\n\n"
- fmt: "\n- `Cin.read` function has the same interface with `cin.get`, but it doesn’t\
    \ append a null character to input, It’s not intend for keyboard input, but for\
    \ binary format of file.\n- For C++, three `get`, two `getline`, other use `>>`;\n\
    - Difference between `cin.get(char)` and `int = cin.get()`:\n  1. `while(cin.get(c))`\n\
    \  2. `// use cin.get(char) in reading loop`\n  3. `cin.get() != '\\n'`\n  4.\
    \ `//use cin.get() return character to test sth.`\n  5. `cin.get()!= EOF`\nLine\
    \ 7: When used in `EOF`, you have to use `int`. because `EOF` may not be expressed\
    \ by `char` type.\n- Confused functions: `cin.get` and `cin.getline` are almost\
    \ the same things.\n  `Cin.get( char* s, streamsize n, char delim );`\n  `Cin.getline\
    \ (char* s, streamsize n, char delim );`\n  `Istream& getline (istream& is, string&\
    \ str);`\n  1. For each line, if you don’t know the max length, just use `getline(cin,\
    \ string)`. You don’t need to input any length (you can reserve length of `string`\
    \ if you want to avoid allocation of memory).\n  2. `cin.get()` doesn’t discard\
    \ `delim` from input stream. However, `cin.getline()` will read and discard newline.\
    \ (It’s easy for you to remember, because, line is defined by newline character)\n\
    \  3. In `cin.getline(char* s, int n)` The `failbit` flag is set if the function\
    \ extracts no characters(newline is a character), Or if the `delimiting` character\
    \ is not found once (`n-1`) characters have already been written to `s`. Note\
    \ that if the character that follows those `(n-1)` characters in the input sequence\
    \ is precisely the `delimiting` character, it is also extracted and the `failbit`\
    \ flag is not set.\n  4. In.`cin.get(char* s , int n)`. The `failbit` flag is\
    \ set only if the function extracts no characters.\n  5. `cin.get(char* s, n)`\
    \ is more flexible than `cin.getline`. Because when it read to the array is full,\
    \ It doesn’t set `failbit`. At this time you can use `gcount()` or `peek()` to\
    \ see if the next character is a new line. It’s more customized than `cin.getline()`.\n\
    \n### Input Pattern\n- It is a bad idea to test the stream on the outside and\
    \ then read/write to it inside the body of the conditional/loop statement. This\
    \ is because the act of reading may make the stream bad. It is usually better\
    \ to do the read as part of the test.\n```cpp\nwhile(!cin.fail()){  // that is\
    \ bad programming style\ncin>>i;  //here may make stream fail()......     //then\
    \ i is not valid value\n}\n```\n- If you just want to input, you don’t want to\
    \ know `eof` or deal with `failbit`. You can use below:\n```cpp\nwhile(scanf(\"\
    %d\",&i) != 1)\nwhile((int c = getchar())!=EOF)\nwhile( fgets(line, sizeof(line),\
    \ fp) != NULL )//in c language, use these to exit loop!\nwhile(cin>>input)\nwhile(cin.get(p,\
    \ 20) )\nwhile(getline(ifstream, string)) {//in C++ language, use bool operator\
    \ to exit loop.//do some useful things.  //input is right.}\n```\n- If you want\
    \ to know `eof` or deal with the error. You can use the below code. When you press\
    \ enter, the read will end. When you input letter, it will get rid of this letter\
    \ until you input number.\n```cpp\nwhile(true) //use break to exit loop;\n{\n\
    \  cin>>i//or getline(ifstream, string);\n  If(cin.eof()){   //If it’s EOF\n \
    \   cout<<\"EOF␣ encountered\"<<endl\n    //break;\n  }\n  If(cin.fail()) //deal\
    \ with Invalide input\n  {\n    cin.clear(); //Important. clear state and buffer\n\
    \    while(cin.get()!=’\\n’)  //get rid rest of line,\n    continue ;\n    cout<<\"\
    please␣ input␣a␣ number\"<<endl;\n    continue;\n  }\n  ...  // input is right.do\
    \ some useful things.\n}\n```\n- In the previous example, why do we need to distinguish\
    \ `eof` and `fail`? When `fail` happen, maybe there are invalid character in buffer.\
    \ After clean the buffer, I can continue to read input from input buffer. Three\
    \ methods to clean invalid character in the buffer.\n```cpp\ncin.clear();   //Important.\
    \ clear state and buffer\nwhile(cin.get()!=’\\n’)continue ;      // method 1\n\
    while(!issapce(cin.get()))continue;  //method 2\nbasic_istream& ignore(streamsize\
    \ _Count = 1, \\int_type _Delim = traits_type::eof());  //method 3\ncin.ignore(5,\
    \ ’a’);\ncin.ignore(numeric_limits<streamsize>::max(), ’\\n’);\n```\n- You can\
    \ use `istream_iterator`, It can save you some trouble to judge `EOF`.\n```cpp\n\
    Class A{\nPrivate:\n  Int,y;\n  Friend istream& operator>>(istream& in, A&);\n\
    \  Friend ostream& operator<<(ostream& in, const A&);\n};\nistream& operator>>(istream&\
    \ in, A&){\n  in>>x>>y;\n  return in;\n}\nOstream& operator<<(ostream& out, const\
    \ A& a){\n  out<<a.x<< \" <<a.y;\n  return out;\n}\nVector<A> v;\nCopy(istream_iterator<A>(cin),\
    \ istream_iterator<A>(), Back_inserter(v));\nCopy(v.begin(), v.end(),ostream_iterator<A>(cout,\"\
    ));\n```\n- In summary, its better use judgment to exit loop. If you need different\
    \ action to take to deal with `EOF` or error. Use `while(true)`, then use `eof()`\
    \ `fail()` or `clear()` functions in C++.\n\nFor `cout`, It can recognize type\
    \ automatically, and It is extensible, you can redefine `<<` operator so that\
    \ `cout` can recognize data type.\n```cpp\nClass Foo{\n  Friend ostream& operator<<(ostream&\
    \ s,const Foo &r);\n};\nOstream& operator<<(ostream& s, const Foo &r){\n  s<<a<<Foo.b<<endl;\n\
    }\n```\n- How to print address in C and C++?\n```cpp\nchar* amount = \"dozen\"\
    ;\ncout<< amount ; //print \"dozen\" string\ncout<<(void*) amount;//prints the\
    \ address of pointer\nprintf(\"%p\", (void*) p);\n```\n- Format is key point for\
    \ Output. You need to know the common manipulator to control the output.\n- Number\
    \ base manipulators: `hex`, `dec`; Field widths: `Width`, `fill`, `Setf()`\n-\
    \ You don’t need to know the details, just name of them. When you want to use\
    \ them, go to reference to look. A format manipulators can be seen on C++ primer\
    \ you need to include `<iomanip>`\n- `<<` is a bitwise left-shift operator in\
    \ C language, but in C++, we overloaded it in `ostream` class, `cout` is an object\
    \ of ostream\n- You can use `cout<<flush` to force flushing the output buffer\n\
    - `cout.write` can be used to output a string; It will output certain length string,\
    \ even reach the end of string.\n\n### Other stream\n- When you studied `cin`\
    \ and `cout` well, you will find that file operation is easy. Just change `cin`\
    \ or `cout` to your `ifstream` , `ofstream` object.\n```cpp\nstd::fstream ifs;\n\
    ifs.open (\"test.txt\", ios_base::in| ios_base::binary);\nif(!ifs.is_open())exit(1);\n\
    char c = ifs.get();// use all previous input\nifs.close();\n```\n- Only read `ifstream`;\
    \ only write `ofstream`; write and read `fstream`.\n- For `ios_base::binary` mode,\
    \ use `write()` and `read()` function.\n- For writing, pay attention to the difference\
    \ between `ios_base::trunc` and `ios_base::app`.\n- Random access is used mostly\
    \ on binary file. Because the position can be pinpointed exactly. For `seekg()`\
    \ for input, and `seekp()` for output.(p is put, g is get) It moves the pointer.\
    \ `tellp()` and `tellg()` function. It tells the position of pointer.\n\n### Buffer\
    \ and string buffer\n- `String` is a convenient way to manipulate strings like\
    \ an independent I/O device. Sometimes it is very convenient to use `stringstream`\
    \ to convert between strings and other numerical types. The usage of `stringstream`\
    \ are much the same with `iostream`, so it not a burden to learn.\n- You need\
    \ to build a `stringstream` from a string, or convert a `stringstream` back to\
    \ a string.\n```cpp\nstringstream outstr;\noutstr<<\"salary value\"<<123333.00<<endl;\n\
    string str = outstr.str() //change to string\nistringstream Instr(str);\nwhile(instr>>number)\n\
    \  cout<<number<<endl;\nchar sentence []=\"Yan is 41 years old\";\nchar str [20];\n\
    int i;\nsscanf (sentence,\"%s %*s % %d\", str, &i);\nsprintf(...);\n```\nLine\
    \ 1 to 3: Change number to a text.\nLine 5 to 7: Change text to a number.\nLine\
    \ 9 to end: C language method. In line 12, you can see \"*s\", it means input\
    \ will be ignored. So `str = Yan`, `i = 41`.\nManipulate stream\n[/content]_\n\
