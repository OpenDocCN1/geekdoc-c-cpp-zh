  trans: "\n\n本节将讨论克服这些问题及更多问题所需的工具。解决方案的思路是能够在像链表这样的结构中存储元素，使用指针来帮助组织内存，但方法比链表更简单。这要求内存具有比简单列表更复杂的结构。那么，数据结构意味着什么呢？当我们开始这段旅程时，我们只有数组，但这些数组从未真正让我们能够使用顺序列表以外的数据结构。链表使用指针来增量地扩展顺序列表，但没有利用指针的灵活性来构建更复杂的结构。内存中这些更复杂的结构是什么？在任何给定时刻持有比单个“下一个节点”更多节点的结构就是一个很好的例子。但你为什么想要这样做呢？很简单。如果你有两个“下一个节点”，其中一个可以用来表示当前元素之外的元素。这被称为**二叉树**。之所以这样命名，是因为每个节点都有一或两个分支。每个下一个节点都是子节点，而连接到子节点的节点就是父节点。二叉树可能像这样：\n\
    \n```\n106 145 8 11 18\n```\n\n在树中，每个元素的左子节点小于该元素，而右子节点大于该元素。`10` 是整棵树的父节点，而 `6`\
    \ 和 `14` 的子节点都是各自小树的父节点，这些小树被称为子树。二叉树有一个非常重要的属性：每个子节点都是一整棵树。结合左子节点小、右子节点大的规则，你就有了一种简单的方法来定义在树中定位特定节点的算法。\n\
    \n首先，查看当前节点的值。如果它等于搜索目标，则完成。如果它大于搜索目标，则向左走；否则，向右走。这之所以有效，是因为树左侧的每个节点都小于当前节点的值，右侧的每个节点都更大。在理想的世界里，你的二叉树是平衡的，两边的节点数量完全相同。在这种情况下，每个子树大约各占整棵树的\
    \ 50%，当你在树中搜索一个值时，每次到达子节点时都可以排除 50% 的结果。所以，如果你有一棵拥有 1000 个元素的树，500 个将立即被排除。再次搜索这棵树（现在它只有\
    \ 50 个元素了），你可以再次削减大约 50%。这样找到你想要的值就不需要很长时间。\n\n那么，在得到一个元素之前，树必须被划分多少次？答案是 `log2n`（`n`\
    \ 是树拥有的元素数量）。即使你的树很大，这个值也很小——假设你的树有 320 亿个元素，该值也只有 `32`；这比搜索包含 40 亿元素的链表快了近 1\
    \ 亿倍，而在后者中每一个元素都必须经过评估。\n\n如果树不是平衡的，你就无法排除大约一半的元素；最坏的情况下，每个节点只有一个子节点，这使得树无非带有几个额外指针的链表，因此需要你搜索所有元素。所以，当树大致平衡时，搜索节点比在链表上相同的搜索要快且容易得多。这是因为你可以按照你想要的方式组织内存。\n\
    \n### 实现二叉树\n\n要实现二叉树，从声明节点结构开始：\n\n```cpp\nStruct node{\n    int key_value;\n\
    \    node *p_left;\n    node *p_right;\n};\n```\n\n节点可以作为简单的整数 `key_value` 存储值，并有两个子树——`p_left`\
    \ 和 `p_right`。你的二叉树上需要一些常用函数：插入、搜索、删除和销毁：\n\n```cpp\nnode* insert (node* p_tree,\
    \ int key);\nnode *search (node* p_tree, int key);\nvoid destroyTree (node* p_tree);\n\
    node *remove (node* p_tree, int key);\n```\n\n#### 插入\n\n我们将使用递归算法将其插入树中。递归对于树来说是极的，因为每个树都有两个小树；这使得整棵树在本质上是递归的。该函数接收一个键和一个已经存在的树（即使是空树），并返回一个包含插入值的新树。\n\
    \n```cpp\nnode* insert (node *p_tree, int key) {\n    // 基础情况——我们到达了一棵空树，我们的新节点\n\
    \    // 需要插入在这里\n    if ( p_tree == NULL ) {\n        node* p_new_tree = new node;\n\
    \        p_new_tree->p_left = NULL;\n        p_new_tree->p_right = NULL;\n   \
    \     p_new_tree->key_value = key;\n        return p_new_tree;\n    }\n    //\
    \ 决定——根据节点的值\n    // 插入到左子树还是右子树\n    if( key < p_tree->key_value ) {\n      \
    \  // 从 p_tree->left 构建一个新树，并添加键\n        // 将现有的 p_tree->left 指针替换为指向\n     \
    \   // 新树的指针。设置 p_tree->p_left 指针\n        // 以防 p_tree->left 为空。（如果它不为空，\n  \
    \      // p_tree->p_left 不会改变，但我们设置它\n        // 是为了万防一失。）\n        p_tree->p_left\
    \ = insert( p_tree->p_left, key );\n    } else {\n        // 插入\n        p_tree->p_right\
    \ = insert( p_tree->p_right, key );\n    }\n    return p_tree;\n}\n```\n\n"
