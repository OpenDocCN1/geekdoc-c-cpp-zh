  trans: "\n\n```cpp\nint *list = new int[10]; // ... // Use list, then // ... delete\
    \ [ ] list; // Deallocate list's memory // ... // Sometime later // ... int x\
    \ = list[2]; // Logic error, but sometimes works!\n```\n上面的代码段说明了这种情况是如何产生的。为了提高效率，`delete`\
    \ 算符会将堆空间标记为可用，而不修改内存中的内容。\n\n## 资源管理\n\n程序员在完成链表对象的操作后，必须在国际范围内调用 `clear`。请看以下定义：\n\
    \n```cpp\nvoid x() {\n  IntList1 my_list; // 在此处调用构造函数\n  // 向列表添加一些数字\n  my_list.insert(12);\n\
    \  my_list.insert(7);\n  my_list.insert(-14);\n  // 打印列表\n  my_list.print();\n\
    } // 哎！忘记调用 my_list.clear()！\n```\n\n在上面的代码中，变量 `my_list` 是函数 `x` 的局部变量。当函数 `x`\
    \ 执行结束时，变量 `my_list` 将超出作用域。此时，栈上分配给名为 `my_list` 的局部变量 `IntList1` 的空间将被回收。虽然头节点元素空间仍然存在，但程序对内存的唯一访问方式是通过\
    \ `my_list.head`，而 `my_list` 已不再存在。这是一个内存泄漏的经典示例。\n\n请注意，除了 `IntList1` 之外，我们目前设计的类类都没有这个问题。然而，C++\
    \ 为类设计者提供了一种方法，指定对象生命周期结束时必须执行的操作。在对象存在开始时执行代码的函数被称为析构函数。析构函数是在对象停止之前立即执行的特殊方法。析构函数的名字可以与其类名相同，但带有一个波浪号\
    \ `~`。此外，析构函数不接受参数。代码 9.2 显示了如何在代码中添加析构函数，并添加之前建议的 `length` 和 `clear` 方法的优化。\n\
    \n### 代码 9.2\n\n```cpp\nclass Code9.2 {\n  // 之前的嵌套私有 Node 类\n  struct Node {\n\
    \    int data; // 列表的数据元素\n    Node *next; // 列表中紧随其后的节点\n    Node(int d); //\
    \ 构造函数\n  };\n  Node *head; // 指向列表的第一个项目\n  Node *tail; // 指向列表的最后一个项目\n  int\
    \ len; // 列表中的元素个数\npublic:\n    // 构造函数创建一个初始空列表\n    IntList2();\n    // 回收列表内存的析构函数\n\
    \    ~Code9.2(); // 将 n 插入列表末尾。\n    void insert(int n);\n    // 打印整数链表的内容。\n\
    \    void print() const;\n    // 返回链表的长度。\n    int length() const;\n    // 移除链表中的所有元素。\n\
    \    void clear();\n};\n```\n\n## 结论\n\n在带你了解了 C++ 中十个必须掌握的话题后，现在轮到你开发自己的技能了。关于语言有一点是，无论是英语、法语还是编程语言，熟能生巧。我们在本书书中教给你的知识可以类比为学习英语的字母表和一些基础单词。因此，我们建议你多练习。将精力集中在理解为什么要使用某些语句，以及我们想要获得的结果。\n\
    \n去网上下载所有你觉得易于使用的应用程序，如果需要付费，就购买它们。当你一切准备就绪并准备好后，拿起一个项目开始学习。你可以构建自己的自己的小项目，也可以选择一个现成的项目并尝试复制它。如果你在任何地方卡住了，你可以随时回去，查看程序员是如何制作该项目并继续的。但始终要尝试将自己推向极限，在检查之前深深思考。\n\
    \n选择其他非常好的书籍也将大有帮助，可以让你对 C++ 的某个部分产生不同的感知，从而拓宽你的理解。尽管我们可以向你保证本书的足以让你走上成为 C++ 成功的正确道路，但我们建议你也阅读其他关于该编程语言的书。\n\
    \n此外，你也可以考虑学习一种 C++ 以外的语言来与 C++ 并行学习。学习新语言是深入理解 C++ 的有效方法。新语言会带来对通用编程语言的更好的理解。它还能拓宽你解决问题的思维，从而引出\
    \ C++ 语言的特殊特性。尽管你可能不会在 C++ 中使用这种新语言的代码，但它会让你接触到可以转换到 C++ 中的成熟思想。我们建议你与 C++ 一起学习的编程语言是\
    \ `Haskell`。你也可以学习 `Java`，因为它比 C++ 更接近我们的日常英语，对你来说更容易理解。你也可以查看我们关于 `Java` 的书。\n\
    \n此外，始终保持更新。跟上现代 C++ 特性，如 `C++11`、`C++14`、`C++17` 以及标准库中的许多其他新特性。它的一些最新特性（如 lambdas）很容易掌握的。你只需要良好的资源和时间，很快，你就会发现自己成为了这些技术的大师。所以，为什么不去喝杯茶，找一个你觉得容易集中精力并开始的放松的地方呢？正如著名的谚言所，“千里之行，始于足下。”所以，今天就出那一步吧，让我们成为引导你走上正确道路的行会。\n\
    \n"
