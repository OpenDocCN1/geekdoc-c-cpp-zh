    \    for (i = 0; i<length; i++)\n    std::cout << char_array[i];\n    std::cout\
    \ << '\\n';\n    std::cout << '\\n';\n    std::cout << '\\n';\n    int numbers[10]\
    \ = { 1, 5, 9, 4, 2, 7, 6, 3, 8, 0 };\n    // the total number of bytes allocated\
    \ for that array.\n    length = sizeof(numbers);\n    std::cout << \"Size of numbers\
    \ array=\" << length << std::endl;\n    // the total number of bytes allocated\
    \ for array/number of bytes allocated for one element\n    length = sizeof(numbers)\
    \ / sizeof(numbers[0]);\n    std::cout << \"Numbers of elements=\" << length <<\
    \ std::endl;\n    for (i = 0; i<length; i++){\n        sum = sum + numbers[i];\n\
    \        std::cout << \"Sum of numbers=\" << sum << std::endl;\n    }\n    int\
    \ *p = numbers;\n    std::cout << \"Address of the first element is \" << p <<\
    \ std::endl;\n    std::cout << \"The value in the address is \" << *p << std::endl;\n\
    \    p++; //move pointer to the next element\n    std::cout << \"Address of the\
    \ second element is \" << p << std::endl;\n    std::cout << \"The value in the\
    \ address is \" << *p << std::endl;\n    int hold = 1;\n    std::cin >> hold;\n\
    \    return 0;\n}\n```\n\nThe function `sizeof` returns the number of bytes allocated\
    \ for the array. Since `char` data type occupies one byte, the number of bytes\
    \ returned by the `sizeof` function equals to the number of elements of the `char`\
    \ array.\n\nThe integer data type occupies 4 bytes in the memory, and an array\
    \ of 10 integers is stored in 40 bytes. As a result, the `sizeof` the array function\
    \ returns 40 bytes for the integer array of 10 elements.\n\nTo calculate how many\
    \ elements are stored in an array we can divide the number of bytes allocated\
    \ for the whole array by the number of bytes allocated to one element of the array:\n\
    `length=sizeof(numbers) / sizeof(numbers[0]);`\n`40 / 4 = 10`\n\nTo access the\
    \ value of a single element, we have to use the array index. The index of array\
    \ in C++ starts from 0. The index of the first element is 0, the index of the\
    \ second element is 1, and so on.\n\nTo access all elements of an array, we have\
    \ to use `for` loop:\n`for(i=0; i<length; i++)cout<<char_array[i];`\n\nIf we declare\
    \ a pointer and assign the array to the pointer, the pointer will hold the address\
    \ of the first element of the array:\n`int *p =numbers;`\n`cout<<\"Address of\
    \ the first element is \"<<p<<endl;`\nThe output of that line of code is: `Address\
    \ of the first element is 0059F710`\n\nTo access the value stored in the address\
    \ of the first element of the array using the pointer, run the following line\
    \ of code:\n`cout<<\"The value in the address is \"<<*p<<endl;`\nThe output of\
    \ the code is: `The value in the address is 1.`\n\nTo move to the next element\
    \ of the array, you have to increase `p`-value:\n`p++;`\nNow it will point to\
    \ the second element of the array:\n`cout<<\"Address of the second element is\
    \ \" <<p<<endl;`\n`cout<<\"The value in the address is\"<<*p<<endl;`\nThe output\
    \ is: `The address of the second element of the numbers array on my PC is 0059F714.\
    \ The value in the address of the second element is 5.`\n\n![](Image00002.jpg)\n\
    Figure The array program output.\n\n## String\nString functions I will show you\
    \ how to use some of the string functions:\n- `strcpy_s()` - copies the content\
    \ of a string to another.\n- `strcat_s()` - appends a copy of the source string\
    \ to the destination string.\n- `strlen()` - returns the length of a string.\n\
    \nOur application will read the string from user input, copy it to another string,\
    \ then copy the original string characters in the reverse sequence to the temporary\
    \ string and concatenate the copy and the reversed copy in one string. For example,\
    \ if user enters string ‘Concatenation’ then the application will output ‘ConcatenationnoitanetacnoC’.\n\
    \nThe following header files must be included in the `main.cpp` file:\n```cpp\n\
    #include \"stdafx.h\"\n#include <stdio.h>\n#include <cctype>\n#include <iostream>\n\
    #include <cstring>\n```\nThe `<cstring>` header is needed for the string functions:\
    \ `strcpy_s()`, `strcat_s()` and `strlen()`. The `cctype` header file is needed\
    \ for the `toupper()` function.\n\nI want to explain how I copied characters from\
    \ the original string to a temporary string in reversed order. First, I got the\
    \ length of the original string using the `strlen()` function: `length=strlen(aWord);`.\n\
    \nThen in the loop, I copied the last character of the original string to the\
    \ first place and so on. Let us examine the code in the loop:\n`for(i=0; i <length;\
    \ i++)temp[i]=aWord[length-(i+1)];`\nIf user enters the word ‘Concatenation’ then\
    \ the word length will be 13. The index of the first character in a string is\
    \ 0, then the index of the last character will be 12. It means that the last character\
    \ is `length - 1`.\n\nWhen `i = 0`, `temp[i]` will refer to the first character\
    \ of the temp string. At the same time (when `i =0`) `aWord[length-(0 + 1)]` will\
    \ refer to the 12 character and will be the last character. When `i=1`, `temp[1]`\
    \ will refer to the second character of the temp string and `aWord[length-(1+1)]`\
    \ will refer to the second from the end. That way, we can copy all characters\
    \ in order. When we have copied all the characters from the original string to\
    \ the temp string, we need to add null to the end of the temp string because a\
    \ string in C++ must be terminated with null. The line of code `temp[length]='\\\
    0';` will do the job. The whole code is included in `visual_studio_2017.zip`.\n\
    \n```cpp\n#include \"stdafx.h\" \n#include <stdio.h>\n#include <cctype>\n#include\
    \ <cstring>\n#include <iostream>\nint main(){\n    char more = 'Y';\n    char\
    \ prompt1[] = \"\\nEnter a word not than 20 characters and press enter.\\n\";\n\
    \    char prompt3[] = \"\\nDo you want to continue? Y/N\\n\";\n    char aWord[20];\n\
    \    char aCopy[40];\n    int length = 0;\n    char temp[20];\n    int i;\n  \
    \  while (toupper(more) == 'Y'){\n        std::cout << prompt1;\n        std::cin\
    \ >> aWord;\n        std::cout << \"aWord=\" << aWord << std::endl;\n        strcpy_s(aCopy,\
    \ aWord);\n        std::cout << \"aCopy=\" << aCopy << std::endl;\n        length\
    \ = strlen(aWord);\n        std::cout << \"length=\" << length << std::endl;\n\
    \        //fill temp[] array with the word in opposite order.\n        for (i\
    \ = 0; i <length; i++)\n            temp[i] = aWord[length - (i + 1)];\n     \
    \   temp[length] = '\\0';\n        std::cout << \"Temp=\" << temp << std::endl;\n\
    \        strcat_s(aCopy, temp);\n        std::cout << \"aCopy after concatenation\
    \ of temp=\" << aCopy << std::endl;\n        std::cout << prompt3;\n        std::cin\
    \ >> more;\n    }\n    return 0;\n}\n```\nOutput:\n![](Image00003.jpg)\nFigure\
    \ String manipulation.\n\n## Lists\nLet us imagine a puzzle. You have a row of\
    \ boxes. Each box contains a card with one letter. You have to figure out the\
    \ sequence of the letters so that the letters compose a word.\n\n![](Image00004.jpg)\n\
    Figure A linked list\n\nIn the table above, you can see that each box has a number.\
    \ You may guess that these numbers are the key to the puzzle. The first box has\
    \ a letter T inside and number 5 on the front side. Take a card with the letter\
    \ T and put it aside. The number 5 may point to the next letter. Count boxes.\
    \ The fifth box has the letter ‘E.’ Take the card with the ‘E’ letter and place\
    \ it next to T. You will get \"TE.\" The box with the letter ‘E’ has number 2\
    \ on its side. So, take the card from the 2nd box and place it next to \"TE.\"\
    \ You will get \"TEC.\" The box with the letter ‘C’ has the number 10, so take\
    \ the card from the 10th box. You will get \"TECH.\" The box with the letter ‘H’\
    \ has number 4, so take the card from the 4th box. You got \"TECHN.\" Continue\
    \ following the numbers, and you will get the whole word: TECHNOLOGY. That is\
    \ how a linked list works. It is made of nodes. Each node has at least one variable\
    \ that holds data (a text or number or object) and one variable (pointer) that\
    \ holds the address of the next node. This system walks through the node list\
    \ as you did in the puzzle. The pointer of the last node has null value, or it\
    \ may point to the first node. Then we have a closed linked list.\n\n### ADD A\
    \ NODE\nIf you want to add a new node to the end of the linked list, you have\
    \ to create a new node. Then point the pointer of the last node to the address\
    \ of the new node and assign null to the new node pointer.\n\n![](Image00005.jpg)\n\
    Figure Adding a node to the end of the linked list.\n\nIf you want to add a new\
    \ node to the beginning of the linked list, you have to create a new node. Point\
    \ the pointer of the new node to the first node, and that is it.\n\n![](Image00006.jpg)\n\
    Figure Adding a node to the head of the linked list.\n\nIf you need to add a node\
    \ in the middle of the linked list, you have to create a new node, and then break\
    \ the chain: redirect the node (previous to the break), to a new node and point\
    \ the pointer of the new node to the next node (the one after the break).\n\n\
    ![](Image00007.jpg)\nFigure Adding a node in the middle of the linked list.\n\n\
    ### DELETE NODE\n\n# Chapter 3. Binary trees\nBinary trees are one of the most\
    \ useful of all the basic data structures and are by far the most interesting.\
    \ They are the perfect example of how recursion and pointers can be used to do\
    \ some very useful things.\n"
