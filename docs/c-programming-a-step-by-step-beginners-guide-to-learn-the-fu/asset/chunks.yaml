  trans: "\n假设我们有如下的类结构。\n\n```cpp\nClass classname{\nPrivate:\nProperty1;\nFucntion1;\n\
    }\n```\n`property1` 和 `function1` 在定义它们的类之外，在任何地方都无法被访问。如果你尝试从主程序访问这些属性或函数的任何一个，将得到编译时错误。\n\
    \n现在让我们定义下面的类，但这次我们将改使用 `protected`（保护）访问修饰符。\n\n```cpp\nClass classname1{\nProtected:\n\
    Property1;\nFucntion1;\n}\n```\n现在，`property1` 和 `function1` 可以在上述类以及任何派生自该类的类中被访问。因此，如果我们有下面的派生类定义，我们就可以在派生类中访问\
    \ `property1` 和 `fucntion1`。但请注意，我们无法在任何其他非派生类中使用这些属性。\n\n```cpp\nClass derivedclassname:\
    \ classname1{}\n```\n\n让我们来看另一个关于访问修饰符的例子。\n\n### 示例 6：以下程序用于演示如何使用访问修饰符。\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nclass Person{\npublic:\nint\
    \ ID;\nprotected:\n// 注意我们我们将 Name 属性定义为 protected\nstring Name;\nvoid Display(){\n\
    \    cout<<\"ID \"<<ID<<endl;\n    cout<<\"Name \"<<Name;\n}\n// 注意我们将 city 属性定义为\
    \ private\nprivate:\nstring city;\n};\nclass Student:public Person {\npublic:\n\
    void Display(){\n    cout<<\"Student ID \"<<ID<<endl;\n    cout<<\"Student Name\
    \ \"<<Name<<endl;\n}\n}};\nint main () {\n    Student stud1;\n    stud1.ID=1;\n\
    \    stud1.Name=\"John\";\n    stud1.Display();\n    return 0;\n}\n```\n\n运行此程序，输出如下：\n\
    `error: 'std::__cxx11::string Person::Name' is protected`\n\n为什么我们会得到这个错误？`person`\
    \ 类有两个属性，分别为 `ID` 和 `Name`。`name` 具有 `protected` 访问修饰符，这意味着它只能在派生类中被访问。但我们正尝试在主类中访问它，这是错误的。因此，实现此点的正确方法如下。\n\
    \n### 示例 7：以下程序展示了如何正确使用访问修饰符。\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nclass Person{\npublic:\nint ID;\nprotected:\nstring Name;\nvoid Display(){\n\
    \    cout<<\"ID \"<<ID<<endl;\n    cout<<\"Name \"<<Name;\n}\nprivate:\nstring\
    \ city;\n};\nclass Student:public Person {\npublic:\n// 我们现在定义了一个函数，可以相应地设置 protected\
    \ 属性的值。\nvoid InputName(string pName){\n    Name=pName;\n}\nvoid Display(){\n\
    \    cout<<\"Student ID \"<<ID<<endl;\n    cout<<\"Student Name \"<<Name<<endl;\n\
    }\n}};\nint main () {\n    Student stud1;\n    stud1.ID=1;\n    stud1.InputName(\"\
    John\");\n    stud1.Display();\n    return 0;\n}\n```\n\n在上面的程序中，我们现在 `Student`\
    \ 类中正确地定义了一个名为 `InputName` 的方法，它可以访问受保护的 `Name` 成员。运行此程序，输出如下：\n`Student ID 1`\n\
    `Student Name John`\n\n现在让我们来看同一个例子，并尝试显示在 `Person` 类中定义的 `City` 属性。\n\n### 示例\
    \ 8：以下程序展示了错误使用访问修饰符的第二个例子。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    class Person{\npublic:\nint ID;\nprotected:\nstring Name;\nvoid Display(){\n \
    \   cout<<\"ID \"<<ID<<endl;\n    cout<<\"Name \"<<Name;\n}\nprivate:\nstring\
    \ city;\n};\nclass Student:public Person {\npublic:\nvoid InputName(string pName){\n\
    \    Name=pName;\n}\nvoid Display(){\n    cout<<\"Student ID \"<<ID<<endl;\n \
    \   // 注意我们正尝试在派生类中使用 private 属性。\n    cout<<\"Student city \"<<city<<endl;\n\
    \    cout<<\"Student Name \"<<Name<<endl;\n}\n}};\nint main () {\n    Student\
    \ stud1;\n    stud1.ID=1;\n    stud1.InputName(\"John\");\n    stud1.Display();\n\
    \    return 0;\n}\n```\n\n运行此程序，输出如下：\n`error: 'std::__cxx11::string Person::city'\
    \ is private`\n\n由于 `City` 属性是 `private` 的，它甚至无法在派生类中运行。我们只能在 `Person` 类中处理此属性。\n\
    \n# 第 5 章 高级基础\n\n## 指针\n\n之前提到过指针，它们是变量的内存地址，这就像人的家庭地址一样。这些可以作为参数传递，并允许之前提到的按引用传递的效果。\n\
    \n下面的程序将显示变量的地址：\n\n```cpp\n#include <stdio.h>\nint main(){\n    int var;\n  \
    \  printf(\"The address is: %x\\n\", &var);\n    return 0;\n}\n```\n输出：`> The\
    \ address is: 10ffa2c`\n\n注意：这几乎每次运行结果都会不同。注意高亮显示的语句，`&`（引用运算符）用于返回变量的内存位置，并允许某些语句访问该位置的数据。使用\
    \ `%x` 是因为内存位置是十六进制的。\n\n要创建指针，我们使用解引用运算符 `*`，这将创建一个专门用于存储内存地址的指针变量。下面的程序创建了一个指针并使用引用运算符\
    \ `&` 将另一个普通变量的地址存储在新创建的指针中。解引用运算符 `*` 也用于访问或更改该内存位置中的实际数据。\n\n"
