  md: '# CHAPTER 4


    # Digital Twin Shop-Floor


    One of the specific challenges to achieve smart manufacturing is to converge the
    manufacturing physical space and the virtual space, for realizing smart operations
    in the manufacturing process. In this context, the shop-floor, as a basic unit
    of manufacturing, should achieve the interaction and fusion between physical and
    virtual spaces, which is not only the imperative demand of smart manufacturing
    but also an evolving trend. Accordingly, the novel concept of digital twin shop-floor
    (DTS) based on digital twin (DT) is introduced. In this chapter, the evolution
    path of shop-floor is analyzed first, then the concept of DTS and its four key
    components are discussed, including physical shop-floor (PS), virtual shop-floor
    (VS), shop-floor service system (SSS), and shop-floor digital twin data (SDTD).
    The operation process and interaction mechanism for DTS are studied and the characteristics,
    key technologies, as well as challenges ahead are investigated.


    # 4.1 EVOLUTION PATH OF SHOP-FLOOR


    Nowadays, various countries have proposed different manufacturing strategies (e.g.,
    Industry 4.0, Industrial Internet, Made in China 2025, service-oriented manufacturing
    [1,2], and cloud manufacturing [3]) to prepare for the next industrial revolution.
    Although these strategies are under different environments, their common objective
    is to achieve smart manufacturing that satisfies the demands of socialization
    [4], personalization, servitization, intelligence, and greenization. They put
    forward requirements for reaching smart interconnection and interoperability between
    the physical space and the virtual space. To meet these requirements, realizing
    seamless integration and fusion of the two spaces is crucial. Since the shop-floor
    is the basic unit of manufacturing, which generates finished products for customers,
    achieving integration and fusion of the shop-floor becomes an imperative [6].


    From the perspective of development, achieving the integration and fusion of the
    physical and virtual spaces also conforms to the evolution trend of the shop-floor
    itself. As shown in Fig. 4.1, the evolution path of'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Figure 4.1 Evolution path of the shop-floor [5].


    the shop-floor can be classified into four stages. In the first stage, due to
    the lack of effective information means, the production activities on the shop-floor
    depended on the physical space completely, leading to low efficiency, accuracy,
    and transparency. Then with the developments of information technologies, computer-aided
    systems began to be applied in production. But as the connection methods were
    unavailable, there was little interaction between the virtual space and the physical
    one. Nowadays, the shop-floor has moved into the third stage, where interaction
    is enabled by advanced communication technologies. In the future, with the developments
    of new generation information technologies (New IT), the virtual space will gradually
    play an equally important role with the physical one, while the continuous two-way
    interaction and the fusion of data from both the physical and virtual spaces will
    also be enhanced [6].


    The evolution path can be illustrated by the development processes of production
    resource management, production activity planning, and production process control
    on the shop-floor, which have been researched by the authors in their previous
    work [5].


    # 4.1.1 Production Resource Management


    Production resources mainly include the personnel, equipment, materials, semifinished
    products and end products, etc. Production resource'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'management is the process of allocating, organizing, and coordinating the production
    resources reasonably through collecting, processing, and analyzing their information
    to finally ensure they operate as planned. In the beginning, it mainly relied
    on manual operations. Related data were recorded manually and stored in paper
    form, which made it difficult for information delivery and analysis. At that time,
    only manual means in the physical space existed. With the development of information
    technologies, various information systems were introduced into the virtual space
    for the management of human resources, equipment, inventories, tools, and products.
    It brought the shop-floor to the second stage and greatly improved management
    efficiency. However, as data for these systems could only be input by hand, the
    real-time states of the production resources could not be captured and the error
    rate of data was high. Nowadays, with the development of the Internet of Things
    (IoT), radio frequency identification (RFID) labels, smart sensory devices, and
    bar codes are deployed on the tools, materials, and work-in-process for real-time
    data collection and online data entry. Benefiting from this, the shop-floor has
    evolved into the third stage, where accurate data synchronization between the
    production resources and information systems are implemented and interactions
    exist. However, the continuous interactions are still insufficient in this stage
    and the fused data, which can provide more abundant information on the production
    resources, seldom attracts attention.


    # 4.1.2 Production Activity Planning


    Production activity refers to the process of combining the production resources
    in accordance with certain relationships and rules for jointly accomplishing a
    production task. Production activity planning refers to the process of organizing,
    planning, and arranging production activities with comprehensive consideration
    of the limits of all the resources and their capacities, under the premise that
    the plan satisfies the requirements and constraints on time, cost, quality, etc.
    In the first stage, when the information technology was not available, production
    activity planning was developed manually based on personal experience. The drawbacks
    were low efficiency and accuracy as well as high dependence on competence and
    experience of the plan makers. In the second stage, information technologies were
    introduced, making it possible to implement a production activity plan on computers
    based on mathematical models. Relying on the powerful processing capacity of the
    computer, this new way could'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'consider different factors at the same time and planned production activity
    by integrating multiple schemes, and thus could obtain a more scientific and optimized
    plan. It can greatly improve efficiency and decrease dependence on humans, and
    is adaptable to the increasingly expanded production scale. However, production
    activity planning was usually limited to the preproduction stage and the static
    plan tended to neglect the disturbance factors in actual production. In recent
    years, with the emergence of interaction between the virtual space and the physical
    space, production activity planning has been performed in a dynamic way and has
    entered the third stage. This stage can dynamically track the implementation of
    the plan through real-time collection of data of the personnel, equipment, and
    materials and can adjust the original plan in a timely manner in reaction to the
    disturbance. Although the production activity plan has better ability to resist
    disturbance, it is still insufficient in foreseeability and robustness due to
    the lack of high-fidelity prediction and fused data that can depict the activity
    comprehensively from different perspectives.


    # 4.1.3 Production Process Control


    Production process control refers to monitoring and controlling the production
    resources and the derived production activities during the production process
    to satisfy the quality demand (e.g., precision), customer demand (e.g., delivery
    date), and company demand (e.g., profit), etc. In the early stage, the monitoring
    usually relied on human senses and the problems or deficiencies occurring in the
    production process were judged by personal experience. This approach was too subjective
    and could not identify problems in a timely manner, which resulted in consequences
    such as inferior control, low precision, and large deviation. In the second stage,
    with the development of information technology, the above problems were partially
    solved. First, the digital instruments and apparatus were adopted to greatly improve
    the detection precision. Then computers were used for statistics, data analysis,
    and decision making based on the detected data, making the control strategies
    more scientific and accurate. Meanwhile, automatic actuators could improve the
    control precision compared with the manual operations. However, in this stage,
    due to the lack of interaction between the physical and virtual spaces, there
    were severe delays in the process control. With the development of IoT and other
    advanced communication technologies, the ability to collect real-time data in
    the production process has been enhanced significantly and'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'the manufacturing execution system can deal with real-time events in a timely
    manner in combination with real-time data. Based on this, real-time control is
    realized in practice and hence the abovementioned problem has been solved to some
    extent. Nevertheless, due to the lack of accurate simulation and validation in
    the virtual space as well as the fused data, the current production process control
    is still insufficient in accuracy, overall optimization, and intelligence.


    In summary, the shop-floor has moved into the third stage to date, and the integration
    and fusion between the physical and virtual spaces are imperative for the future.
    In the third stage, the function of virtual space is still limited. It mainly
    works as a container and processor for the data from the physical space, lacking
    its own data and evolution, as well as continuous interactions with the physical
    space. Meanwhile, the existing works in shop-floor mainly focus on the collection,
    storage, testing, processing, and control of the data obtained from entities,
    but not those data generated by virtual models, especially the fused data converging
    both the physical and virtual sides. Therefore, for the further fusion in the
    fourth stage, stronger capacities in the virtual space, continuous interactions
    between the physical and virtual spaces, and fused data are still required [6].


    Recently, digital twin (DT) as an efficient method for cyber-physical fusion has
    attracted increasing attention. On the other hand, New IT has been developed considerably,
    which enables DT to be applied on the shop-floor to generate a new paradigm for
    the future. For example, IoT can provide ubiquitous sensing ability to collect
    data from different elements, businesses, and processes of the shop-floor. Cloud
    computing can provide powerful computing capability, which lays the foundation
    for building and operating sophisticated models. With big data and artificial
    intelligence (AI) technology, large amounts of data can be fused and mined, and
    intelligence can be given to entities, models, and systems that can support autonomous
    negotiation and cooperation between the physical and virtual spaces [6].


    In this situation, based on the DT, the concept of digital twin shop-floor (DTS)
    [5,6] is proposed to achieve cyber-physical fusion for the shop-floor. The DTS
    presents the shop-floor in dual visions, the physical and the virtual. It keeps
    these two sides consistent with and optimized by each other. Data from either
    the physical or the virtual side as well as the fused data are provided to drive
    the production [6]. In this chapter, the evolution path of the shop-floor is explored
