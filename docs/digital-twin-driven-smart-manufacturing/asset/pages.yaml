    # ## 1.3 CONCEPT OF DIGITAL TWIN


    # ### 1.3.1 Theoretical Definition of Digital Twin


    The concept of DT dates back to 2003 when Grieves first presented it in his PLM
    course. However, at that time, the DT only had a three- dimensional conceptual
    framework, including a physical object, a virtual counterpart, and a connection,
    without concrete description and explanation. In 2010, NASA released a detailed
    definition of DT for a space vehicle as “an integrated multiphysics, multiscale
    simulation of a vehicle or system that uses the best available physical models,
    sensor updates, fleet history, etc., to mirror the life of its corresponding flying
    twin” [10]. This definition was well received and accepted. Based on it, researchers
    from different universities and institutes also proposed their own understanding
    of the DT. The concepts in different research fields are diverse in details, as
    shown in Table 1.1.


    In most definitions, the DT is considered as a virtual representation that interacts
    with the physical object throughout its lifecycle and provides intelligence for
    evaluation, optimization, prediction, etc. They focus on both the physical and
    virtual sides as well as the connection, which are the essential elements in the
    DT three-dimension framework [7].


    Recently, Tao et al. from Beihang University proposed an extended five-dimension
    definition for the DT, adding DT data and services to the three-dimension version
    [46]. Compared with the previous concepts, besides the physical–virtual interaction,
    the newly proposed definition can fuse data from both the physical and virtual
    aspects using DT data for more comprehensive and accurate information capture.
    It can also encapsulate the functions of the DT (e.g., detection, judgment, and
    prediction)'
