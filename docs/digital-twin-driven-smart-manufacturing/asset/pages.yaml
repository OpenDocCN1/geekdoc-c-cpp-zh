    # 4.5 CHARACTERISTICS OF DIGITAL TWIN SHOP-FLOOR


    The characteristics of the DTS mainly include the cyber—physical fusion, data
    driving, integration, and fusion of data from the entire elements, processes and
    businesses, and iterative optimization [5].


    # 4.5.1 Cyber—Physical Fusion


    Cyber—physical fusion can be reflected in three aspects.


    +   1. **Bidirectional mapping between PS and VS.** With the technologies of VR,
    AR, modeling, and simulation, the VS can provide a highly realistic description
    for the PS and records the operation process of PS. Whereas, the PS strictly follows
    the orders from the virtual space and tries to faithfully reproduce the production
    predefined by the VS. Entities in the PS and models in the VS are in one-to-one
    correspondence. They operate simultaneously and evolve together.

    2. **Real-time interaction between PS and VS.** During the operation, when the
    PS starts the production, the VS also simulates the production in the virtual
    space synchronously. On one side, data from the PS can be perceived in real-time
    and transmitted to the VS for model updating and simulation. On the other side,
    the VS feeds back control orders to the PS in real-time based on the simulation
    results to optimize the production. Through the real-time interaction, the PS
    and the VS can grasp the dynamic changes of each other and make in-time responses.

    3. **Fusion of data from physical and virtual spaces.** Data from the physical
    space (e.g., PS) and the virtual space (e.g., VS and SSS) can be transformed into
    a unified form and fused seamlessly. It makes the data for production more comprehensive
    as both the physical and virtual aspects are considered.'
