  md: 'inconsistency between models and entities appears, it is difficult to identify
    and utilize them wisely. Third, as the continuous physical space and the discrete
    virtual space are in different scales, it is a challenge to figure out how to
    transcend the divergence to realize the seamless integration of the two sides.
    With the virtual space evolving with the physical one along the lifecycle, data
    from entities, models, and systems are generated continuously. In this situation,
    how to integrate and converge the increasing data is worth exploring. Security
    is another focus that ensures the normal operation of the physical and virtual
    spaces against malicious attacks. To guarantee the interests of the enterprises,
    the equilibrium between the costs and benefits of the DTS should be considered
    [6].


    # 4.8 SUMMARY


    As New IT is being developed and applied continuously, developing DTS to start
    a new paradigm of shop-floor becomes imperative. To support the seamless integration
    and further fusion on the shop-floor, DTS provides evolved models with high fidelity,
    continuous interactions between physical and virtual spaces, and fused data convergence
    of those two spaces [6]. This chapter provides an insight into DTS and a guideline
    for future work.


    The main contributions are concluded as follows:


    +   - The concept and operation process of DTS are explored.

    - The interaction mechanism and implementing methods for the four components of
    DTS are illustrated.

    - The characteristics, key technologies, and challenges ahead are discussed.


    Future work will focus on the following aspects [6]:


    +   - Smart interconnection and interaction in the PS.

    - Adequate two-way connection between physical and virtual spaces.

    - High-fidelity models for the VS.

    - Service management and precise service-demand matching.

    - Applications of DTS in smart manufacturing.


