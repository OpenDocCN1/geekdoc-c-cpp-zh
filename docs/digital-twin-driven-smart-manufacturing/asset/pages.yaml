    # ### 3.5.1 Key Technologies for Physical Entity Modeling


    To build and maintain the PE, besides technologies in design, manufacturing, PHM,
    etc., real-time data collection is also essential as it enables state capture
    for the PE during its lifetime. Some relevant technologies are listed as follows:


    +   • _RFID_: It can be used to track and identify the PE.


    +   • _WSN_: It consists of spatially distributed autonomous sensors, which can
    collect the PE’s operational states and working conditions, and organize the collected
    data at a central location.


    +   • _Soft sensor_: It uses knowledge and algorithms to calculate the PE’s partial
    parameters, which are difficult to measure with hardware, thus reducing measurement
    cost and enlarging measurable scope.


    +   • _Embedded system_: It can be embedded as a part of the PE for monitoring
    and control.


    +   • _Distributed sensor layout optimization_: It can reduce redundant information,
    improve utilization rate of sensors, and keep the stability of collected data.


    # ### 3.5.2 Key Technologies for Virtual Entity Modeling


    Since models in the VE should be built in different aspects, and then integrated
    to form a complete mirror of the PE, key technologies for VE modeling mainly include
    the following aspects.'
