  md: '# CHAPTER 5


    # Equipment Energy Consumption Management in Digital Twin Shop-Floor


    As equipment energy consumption (EC) accounts for a large proportion of total
    consumption in manufacturing, it is imperative to realize efficient equipment
    energy consumption management (EECM) to reduce EC and improve energy efficiency.
    Recently, with the developments of digital twin (DT), fused data and high-fidelity
    models can be enriched greatly and a physical–virtual fusion environment can be
    built in the shop-floor, which provides new opportunities to the existing EECM
    systems, to improve performances of EC monitoring, analysis, and optimization.
    In this context, the chapter introduces a framework of EECM in the digital twin
    shop-floor (DTS) first, then explores implementation methods for the framework,
    and finally discusses the potential advantages.


    # 5.1 INTRODUCTION


    Manufacturing is a sector with a large amount of EC, which leads to serious environment
    problems, such as toxic smog, global warming, and acid rain pollution. Energy
    consumed by the equipment on the shop-floor occupies the largest proportion of
    EC in manufacturing [1]. However, as this part of EC can vary dramatically in
    different conditions during production, there is great potential to save energy.
    Therefore, research on EECM is abundant and has been devoted to reducing EC and
    improving energy efficiency for the equipment through EC monitoring, analysis,
    and optimization [2]. The related research, which has been studied in the authors''
    previous work [2], is introduced as follows.


    In EC monitoring, different sensory devices are attached to the equipment to measure
    the EC (e.g., the consumption of electricity, water, and gas) and EC-related parameters
    (e.g., speed, vibration, load) for the sake of further meaningful analysis. For
    example, Lu et al. [3] built a distributed real-time energy monitoring platform
    for the shop-floor based on a'
  merge: -1
  img_proc: true
