    # 11.2.3 VR in Service


    With the aid of VR, services can be simulated and optimized in an immersive virtual
    environment before actual execution, avoiding potential risks to the operators
    as well as equipment. Meanwhile, VR can enhance the operators’ abilities and thus
    improve the quality of related activities. Some works on VR in maintenance, logistics,
    and training are introduced in the following sections.


    In maintenance simulation, Lecakes et al. [34] developed a VR system to visualize
    multiple sensor measurements for the health management of rocket engines. The
    system can display various forms of data coupling with graphics for operators.
    Liu and Hao [35] presented a virtual maintenance simulation-based maintainability
    analysis framework, which includes a virtual maintenance prototyping module, a
    maintenance simulation module, a maintainability analysis module, and a system
    management module. Peng et al. [36] built a desktop VR-based approach for complex
    product maintainability design and verification. The efficiency of the approach
    was verified on a mobile robot system.'
