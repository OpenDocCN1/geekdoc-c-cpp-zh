  md: '# CHAPTER 6


    # Cyber—Physical Fusion in Digital Twin Shop-Floor


    As an efficient way to realize seamless interaction, integration, and fusion between
    the physical space and the virtual space for manufacturing, the concept of digital
    twin shop-floor (DTS) was proposed in Chapter 4, Digital Twin Shop-Floor. In this
    chapter, cyber–physical fusion in the DTS is studied from four aspects, including
    fusion of physical elements in physical shop-floor (PS), model fusion in virtual
    shop-floor (VS), data fusion in shop-floor digital twin data (SDTD), and fusion
    of services in shop-floor service systems (SSS). Related criteria and key technologies
    for these fusions are also discussed.


    # 6.1 INTRODUCTION


    To adapt to the manufacturing needs and trends such as socialization, personalization,
    servitization, intelligence, and greenization, various countries have proposed
    different national-level manufacturing development strategies as mentioned in
    Chapter 4, Digital Twin Shop-Floor. One of the common goals of these strategies
    is to realize cyber–physical fusion, and consequently to achieve smart manufacturing.
    On the shop-floor, which is the basic “playground” of manufacturing activities,
    digital twin shop-floor (DTS) has been proposed. For the DTS, cyber–physical fusion
    is not only the goal, but also one of the core challenges in practice [1]. To
    realize this fusion, it is essential to implement fusion in the major components
    of the DTS, respectively. These four processes include fusion of heterogeneous
    physical elements on the physical shop-floor (PS), fusion of multidimensional
    models on the virtual shop-floor (VS), cyber–physical data fusion on the shop-floor
    digital twin data (SDTD), and services fusion on the shop-floor service system
    (SSS).


    Some existing works have laid foundations for the above fusions, including connection
    and interconnection on the shop-floor [2,3], digital/virtual shop-floor modeling
    [4,5], shop-floor data and information integration [6,7], shop-floor optimal operations
    and precision management [8,9],'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'etc. Based on this, many valuable theories and technologies have been developed
    to solve the problem of fusion at the shop-floor level from different perspectives.
    However, to realize the fusion completely, there are still some limitations and
    deficiencies, which are outlined as follows.


    # 1. Connection and Interconnection on the Shop-Floor


    Previous researchers have mainly focused on theoretical, technical, and methodological
    studies for a single physical element (e.g., a person, a machine, a product) on
    the shop-floor, such as works on data collection, data transmission and processing,
    state monitoring and health management, etc. Commercially available devices have
    also been developed to implement the related functions. Based on this, the smart
    operations for a single element can be realized to some extent. However, there
    has been insufficient attention paid to the interconnection between the heterogeneous
    physical elements (e.g., machine–machine, man–machine, machine–environment, human–machine–environment)
    on the shop-floor. Particularly, the connection and interconnection of all the
    heterogeneous physical elements, including persons, machines, materials, and environment
    are lacking. As a result, theories and universal devices for full interconnection
    and fusion of the heterogeneous physical elements on the shop-floor would need
    to be pursued.


    # 2. Digital/Virtual Shop-Floor Modeling/Simulation


    Previous researchers mainly focused on the construction and simulation of geometry
    models or system models for the physical elements on the shop-floor, while models
    that can depict the actual behaviors, rules, and constraints are relatively rare;
    as a result, a complete mapping from physical elements to virtual models cannot
    be achieved. In addition, with respect to the shop-floor simulation, previous
    research mainly relies on the existing data-driven models, and lacks sufficient
    explorations into the precise relations among shop-floor behaviors, rules, and
    constraints, as well as their integration methods. Little attention is paid to
    multidimension fused models that can describe the shop-floor accurately and thoroughly
    from various aspects such as geometry, physics, behaviors, and rules.


    # 3. Shop-Floor Data/Information Integration


    Based on information systems or platforms such as manufacturing execution systems
    (MES), enterprise resource planning (ERP), and computer-aided'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'process planning (CAPP), the information and data involved in the shop-floor
    can be integrated and shared. Although the integration scope covers the existing
    data from information systems deployed on the shop-floor and part of the collected
    real-time data from production, data from the upstream business (e.g., market
    demand and product design), and downstream business (e.g., product maintenance
    and disposal) are seldom considered. In addition, simulated data from the virtual
    models and fused data from both the physical elements and virtual models have
    attracted little attention. In summary, seamless integration and fusion for data
    from all of the elements, processes, and businesses on the shop-floor are insufficient.


    # 4. Shop-Floor Optimal Operations and Precision Management


    The traditional method for optimal operations and precision management is mainly
    based on the process of problem analysis—model construction—algorithm design—optimization
    analysis and control. With Internet of Things (IoT) and big data applied to the
    shop-floor, researchers around the world have proposed a new idea, which transforms
    the traditional process to data association mining—dynamic evolution—simulation/prediction—intelligent
    control based on shop-floor big data. Both methods rely on models and data from
    the shop-floor. However, owing to the lack of multidimension fused models and
    data, the current shop-floor still has various deficiencies in operations and
    management, such as poor consistency between the physical and virtual spaces,
    low intelligence, and low accuracy. Therefore, to solve these problems, it is
    urgent to develop reliable services and service fusion that are driven by data
    and models.


    All the deficiencies mentioned above can be summed up as one scientific problem,
    that is, cyber—physical fusion on the shop-floor. To solve the problem, digital
    twin (DT) technology is introduced to the shop-floor and the concept of DTS is
    proposed. In the DTS, through constructing fully interconnected PS, high-fidelity
    VS, fully integrated and fused SDTD, and highly precise SSS, it becomes possible
    to realize the cyber—physical fusion on the shop-floor, thus providing a new solution
    for enterprises to carry out optimal operations and precision management [1].


    # 6.2 REFERENCE ARCHITECTURE FOR DIGITAL TWIN SHOP-FLOOR


    To provide references for enterprises to realize the DTS in the future, a five-layer
    reference architecture for the DTS is designed, as shown in'
