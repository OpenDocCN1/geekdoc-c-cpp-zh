  md: 'all the processes and the resources for performing production tasks are integrated
    together for analysis and planning. Combining with big data analysis, the virtual
    space of the DT simulates and evaluates the different production strategies and
    planning until a satisfactory production planning is obtained. After acquiring
    the best production plan, it is delivered to the physical space to guide the actual
    production. If all the processes in the production conform to the plan, production
    can be carried out smoothly. Otherwise, faults and errors may occur from time
    to time. In this situation, real-time data is collected directly from the manufacturing
    resources to drive the virtual models to simulate the production process. The
    actual production results and plans are evaluated in the virtual space of the
    DT. If there are differences, big data analysis is used to find out the reasons
    and develop solutions, such as adjusting the equipment conditions or revising
    the plan. In the iterative interaction, the DT with big data ensures that the
    production can be fully implemented in accordance with the optimal plan. Besides,
    once the design changes, the production process can be easily updated in the virtual
    space of the DT, including updating the bill of materials, processes, and assigning
    new resources. After adjusting the production plans, the entire production process
    is simulated again to further optimize and maximize utilization of all resources.
    As a result, using the DT in combination with big data technologies, production
    planning and implementation can be understood and monitored better to achieve
    smart production [9].


    # 9.6.3 PHM Driven by Fusion of Digital Twin and Big Data


    In the daily operation of a product, through interaction between the physical
    product and the virtual model, problems can be identified quickly, which improves
    the efficiency of PHM. First, the virtual model in the virtual space is synchronized
    with the physical product through real-time data collected by sensors. The working
    status of the product and healthy conditions of the components are grasped in
    real-time. In addition, as complementary to the sensors data, the DT also integrates
    the historical maintenance data and the data derived from big data mining (e.g.,
    the features and patterns of behaviors, operation rules, features of energy consumption,
    etc.). Through big data analysis of the above data, the DT can continually predict
    the health conditions and remaining life of the product. The DT with big data
    can also reveal unknown problems by comparing the actual product responses and
    expected product responses in a specific scenario. Once the hidden product problems
    are found, or faults'
