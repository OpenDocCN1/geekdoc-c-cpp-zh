- pgno: 68
  md: '# ## CHAPTER 3


    # ## Five-Dimension Digital Twin Modeling and Its Key Technologies


    Digital twin (DT) modeling is the basis for implementing DT in practice. As the
    concept of DT becomes better developed, many researchers and practitioners have
    been working on the construction of a DT. However, the initial three-dimension
    DT proposed by Grieves, including the physical entity, virtual entity, and connection,
    cannot accommodate the new requirements from applications, technology, modeling
    objects, etc. In this situation, an extended five-dimension DT, adding DT data
    and services, is proposed and explored in this chapter to meet the new demands.
    Based on this, the DT is further classified into three levels toward different
    applications: unit level, system level, and system of systems (SoS) level. Key
    technologies for the five-dimension DT are also discussed. Finally, eight rules
    for guiding future modeling works on the DT are proposed.


    # ### 3.1 TRADITIONAL THREE-DIMENSION DIGITAL TWIN


    The traditional three-dimension DT was first proposed in 2003 by Grieves in his
    product lifecycle management (PLM) course at the University of Michigan [1]. This
    can be considered as the origin of the DT. In this section, the three-dimension
    model is introduced and existing works on its modeling are reviewed.


    # ### 3.1.1 Three-Dimension Digital Twin


    As shown in Fig. 3.1, the three-dimension DT contains three parts [1]: (1) a physical
    entity in physical space, (2) a virtual entity in virtual space, and (3) a connection
    of data and information that ties the physical and virtual entities together.


    The physical entity, such as an aircraft, radar, and related infrastructure, exists
    substantially with real functions and capabilities. It can complete specific missions
    in the physical space and produce actual outputs. The'
  merge: -1
  img_proc: true
- pgno: 69
  md: '![](img/5042607b423be4a5ee3f15dae22cc5bb_69_0.png)


    virtual entity consists of a set of models to describe the physical counterpart
    from different perspectives, including geometrical dimensions, physical properties
    and behaviors, etc. It is a digital mirror that accompanies the physical entity
    during its lifetime, characterized by real-time synchronization, faithful mapping,
    and high fidelity. Interactions between the two parts are enabled via the connection.
    On one side, real-time data from the physical entity are collected and transmitted
    to the virtual replica for model updating and calibration, and on the other side,
    valuable information generated from virtual simulations is fed back to the physical
    space to guide and optimize the corresponding physical entity. The DT forms a
    closed loop from the physical space to the virtual space and back to the physical
    space again.


    # 3.1.2 Existing Works on Digital Twin Modeling


    Existing works that can support the modeling of the three-dimension DT are briefly
    reviewed in the following respects:


    +   1. _With respect to physical entity_: To build and maintain the physical entity,
    works that cover the entire lifespan of the entity, from design to disposal, are
    needed. In the early stage, these works are mainly conducted via human activity,
    with low accuracy and efficiency. With technical improvements in computers, communication,
    automation, mechatronics, etc., activities such as product design [2,3], production
    [4,5], and prognostics and health management (PHM) [6] are optimized and improved
    greatly, which enables the construction of more complicated and precise entities.
    In addition, with the developments of Internet of Things (IoT) technology, smart
    devices such as wireless sensor'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'networks (WSNs) [7], radio frequency identification (RFID) [8], embedded systems
    [9], etc. are becoming more widely available for the physical entities for real-time
    sensing and control.


    +   2. _With respect to virtual entity:_ To reproduce the physical entity, different
    types of models are built in the virtual space. With respect to geometric models,
    parameters including shapes, sizes, and assembly relations are modeled to simulate
    assembly processes [10], machining processes [11], logistics [12] and spatial
    layouts [13], etc. Combined with virtual reality (VR) and augmented reality (AR),
    these models can create an immersive environment similar to the physical space
    for simulation. Based on the geometric models, some researchers further explore
    the modeling of physical factors (e.g., force, temperature, and vibration), and
    then conduct a physical parameters changing simulation [14], process plan evaluation
    [15], and reliability evaluation [16], etc. Through adding the physical parameters,
    the virtual entity approximates the physical counterpart not only in sense, but
    also in actual properties. To mimic behaviors of the physical entity under different
    conditions, methods such as neural network [17], Bayesian [18], finite state machine
    [19], and Markov chain [20] can be used to build linear or nonlinear relationships
    between the parameters and the behaviors. Via the behavior models, internal structures
    of the physical entity can be grasped and some performances can be predicted in
    advance. Models for rules can also be constructed through processing a large amount
    of historical data of the physical entity, based on machine learning algorithms
    [21]. The rule models provide criteria and rules for the physical entity optimization.


    +   3. _With respect to connection:_ It is critical to build a connection between
    the physical and virtual entities for data exchange. Related research mainly covers
    the real-time communication mechanism [22,23], protocol standardization [24],
    integration with intranet [25,26], etc. Standardized technologies and devices,
    such as MTConnect [27], middleware technology [28], and Industrial Internet Hub
    are also discussed to shield the heterogeneity of protocols and interfaces [29].

    Based on the existing modeling foundations and works, some researchers have tried
    to construct the three-dimension DT. For examples, Majumdar et al. [30] studied
    synergistic material behaviors for DT modeling based on a multiphysical modeling
    framework. Smarslok et al. [31] proposed a DT framework for error quantification
    and confidence assessment, which also included a set of metrics to measure the
    fidelity of DT'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'models. DebRoy et al. [32] outlined the technical requirements for building
    a DT for a 3D printing machine, including the process of heat transfer modeling,
    solidification modeling, property prediction, residual stress modeling, and distortion
    modeling. Yun et al. [33] proposed a universal DT platform adopting international
    standards, which would support the functions of communication, cosimulation, and
    gateway. Schroeder et al. [34] used a three-stage method based on AutomationML
    to model attributes related to the DT and enable data exchange between different
    systems.


    The above works have contributed much to the construction of three- dimension
    DT. However, with the rapid developments of technologies and the increasing growth
    of demands from applications, new requirements have been put forward on the DT,
    which are analyzed in the following sections.


    # ## 3.2 NEW REQUIREMENTS ON DIGITAL TWIN


    New requirements on the DT are mainly reflected in the following four aspects:
    application, technology, modeling object, and modeling method.


    # ### 3.2.1 From Application Aspect: Requiring Wider Application


    When the DT was first introduced, it mainly focused on military products in aerospace
    engineering, which is a particularly closed industry with restricted access to
    the Internet. In this situation, the three-dimension DT can basically deal with
    demands from aerospace.


    However, in recent years, as the DT has been introduced to wider application fields,
    such as automotive, construction, agriculture, healthcare, and medicine, it becomes
    more acceptable in daily products, which are developed in an open and user-oriented
    environment. Accordingly, new requirements are put forward on the DT, such as
    high-quality service, user demand mining, and short time to market. Therefore,
    to adapt to the needs from wider applications, a more general model for the DT
    has to be built.


    # ### 3.2.2 From Technology Aspect: Requiring to Embrace New IT


    New generation information technologies (New IT), such as IoT, cloud computing,
    big data, and artificial intelligence (AI), play important roles in industry,
    enabling smart interconnections and operations. Specifically,'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'data generated in the physical space can be first accessed and transferred
    to the virtual space using IoT, then stored and processed via cloud, and finally
    transformed into valuable information with big data and AI. The information will
    be encapsulated into services that are then given back to the physical space for
    on-demand use. It can be seen that New IT has built a closed loop between the
    physical and virtual spaces.


    On the other hand, the DT aims at realizing greater cyber–physical fusion between
    the two spaces, thus achieving better performances in various industrial applications.
    Since it is obvious that the closed loop enabled by the New IT lays a major foundation
    for the fusion, embracing the New IT is an essential step for the implementation
    of DT. However, due to deficiencies of the traditional three-dimension model,
    the DT cannot fully take advantage of the New IT to serve itself to the best extent.
    Therefore, requirements for the seamless integration with New IT are put forward.


    # ## 3.2.3 From Modeling Object Aspect: Requiring Data and Services


    At present, data is an extremely important element for the modeling object, as
    it contains abundant information that is useful for modeling, simulation, optimization,
    and prediction. With the developments of New IT, there will be tremendous increases
    in the volume, richness, and fidelity of data from both the physical and virtual
    spaces. To obtain more accurate and comprehensive information, the modeling object
    requires the DT to integrate and fuse the data from the different spaces, such
    as operational data and environmental data from the physical space, and simulated
    results and predictive states from the virtual space. However, the three-dimension
    DT cannot satisfy this requirement.


    Service is another important element for the modeling object. Since current users
    of the DT come from various industries with different technical levels, most of
    them do not have enough professional knowledge to work with the DT, which becomes
    an obstacle to the effective interactions between the DT and users. To solve the
    problem, it is imperative to encapsulate functions of the DT into standardized
    services with friendly interfaces for easy and on-demand usage, which enables
    convenient user operations. However, the three-dimension DT does not pay enough
    attention to servitization of its functions.


    Therefore, from the modeling object aspect, requirements on data and services
    are put forward on the DT.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# ### 3.2.4 From Modeling Method Aspect: Requiring High-Fidelity Virtual Modeling


    In the DT, to describe the physical entity accurately, a virtual entity that can
    synchronously integrate multiple variables, scales, and abilities to reproduce
    a complete mirror for the physical counterpart is required. Although different
    types of models have been built, as reviewed in Section 3.1.2, some issues still
    exist. Compared with the works on geometrical modeling and physical modeling,
    there are relatively few works on behavior modeling and rules modeling. Different
    types of models need to be integrated and fused to describe the physical entity
    from multiple perspectives comprehensively. Therefore, a modeling method to produce
    a complete high-fidelity virtual mirror for the physical entity is required.


    # ## 3.3 EXTENDED FIVE-DIMENSION DIGITAL TWIN


    To satisfy these new requirements on DT modeling, an extended five- dimension
    DT [35] is proposed, adding DT data and services. It is designed for a wider range
    of applications and to support data fusion and on-demand usage. Besides, a high-fidelity
    modeling method is developed to reproduce geometries, physical properties, behaviors,
    and rules of the physical entity completely and thoroughly.


    # ### 3.3.1 Five-Dimension Digital Twin


    The traditional three-dimension DT defined by Grieves [1] is extended to a five-dimension
    model, as shown in expression (3.1) [35],


    [M_{DT} = (PE, VE, Ss, DD, CN)] (3.1)


    where PE refers to the physical entity, actually existing in the physical space;
    VE represents the virtual entity, consisting of a set of models; Ss stands for
    the services for both PE and VE; DD is the DT data; and CN is the connection that
    ties different parts of the DT together. According to expression (3.1), the five-dimension
    DT concept model is built as shown in Fig. 3.2 [35].


    Compared with the previous three-dimension definition, the proposed one is more
    efficient to embrace the broader perspectives of the DT. The newly added “DT data”
    (i.e., DD) can fuse all related data from both physical and virtual aspects, and
    then provide more accurate and comprehensive information through data processing.
    It can be considered as the'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'driver of the DT [36]. The “services” (i.e., Ss) enables the various functions
    in the DT to be standardized and encapsulated, which can help implement easy and
    on-demand usage. In addition, the Ss also improves the utilization of the functions
    of the DT, as the corresponding services can be reused individually or in combination
    with others for different demands.


    If the five-dimension DT is compared to a person, its components (i.e., PE, VE,
    Ss, DD, and CN) can be considered as important tissues or organs. PE plays a role
    as the “skeleton,” which forms the supporting structure of the DT. VE is the “heart,”
    as it “pumps” simulation results/ strategies to other components. Ss is the “sense
    organ,” which interacts with users directly. DD is the “blood,” which feeds the
    DT with valuable information continuously. Accordingly, CN is the “blood vessel,”
    carrying the data to different components of the DT. Specific modeling methods
    for each component are described in the following sections.


    # ## 3.3.2 Physical Entity


    Generally, PE consists of various subsystems and sensory devices. The subsystems
    include the dynamic system, control system, hydraulic system, etc., which can
    be combined to complete specific tasks. The sensors collect real-time states of
    the subsystems (e.g., vibration, force, torque, and speed) and their working conditions
    (e.g., environment parameters, loads, and control orders). To construct and maintain
    the PE, besides works on design, manufacturing, PHM, etc., real-time data collection
    based on advanced sensory technologies is also required [35].


    ![](img/5042607b423be4a5ee3f15dae22cc5bb_74_0.png)'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# ## 3.3.3 Virtual Entity


    As a faithful mirror image of the PE, VE is represented by expression (3.2), where
    \( G_v \), \( P_v \), \( B_v \), and \( R_v \) stand for the geometry model, physics
    model, behavior model, and rule model, respectively [35].


    ```

    VE = (G_v, P_v, B_v, R_v) (3.2)

    ```


    G_v is stereoscopic and describes the geometric parameters of the physical entity,
    such as shapes, sizes, and assembly relations. G_v can be considered as a basis,
    providing a geometric container for the other models. The common CAD tools for
    G_v include SolidWorks, 3D MAX, ProE, AutoCAD, etc.


    P_v is given the physical properties (e.g., speed, wear, and force) based on G_v
    and can reflect the physical phenomena of the entity, such as deformation, delamination,
    fracture, and corrosion. The finite element method (FEM) is widely applied in
    this level.


    B_v describes the responding mechanisms and behaviors of the entity, such as the
    state transition, performance degradation and coordination, under the driving
    factors (e.g., control orders) or disturbances (e.g., human interferences) from
    the external world. Methods such as the finite state machine, Markov chain, and
    ontology-based models can be applied to describing the responsive processes.


    R_v is a set of rules extracted from the historical data of the PE. These rules
    (e.g., associations, constraints, and deductions) enable the VE to have the abilities
    of judgment, evaluation, optimization, and/or prediction. To build R_v, machine
    learning algorithms such as neural networks, support vector regression, and random
    forests can be used.


    After modeling, with model integration technologies, G_v, P_v, B_v, and R_v are
    coupled in both functions and structures to form a complete mapping (i.e., VE)
    for the PE. Then the accuracy and sensitivity of the VE can be tested using verification,
    validation, and accreditation (VV&A). Although the VE has the ability to mirror
    the PE faithfully, the degree of fidelity can be adjusted in different applications.
    For example, for the collision test of the PE, the VE can be built just in the
    geometric level and physical properties level, and other properties can be omitted.


    # ## 3.3.4 Services


    Ss includes services for both the PE and the VE. It tries to make the PE work
    as expected through real-time regulation, and sustains high fidelity'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'of the VE with the PE through model parameters calibration [35]. For the PE,
    the Ss mainly includes the monitoring service, PHM service, state prediction service,
    energy consumption optimization service, etc. For the VE, the Ss mainly consists
    of construction service, calibration service, and test service for models. Each
    service in the Ss is encapsulated as a quintuple model as in expression (3.3)
    [35], describing the function, input, output, quality, and state, respectively.


    ```

    Ss = (Function, Input, Output, Quality, State)    (3.3)

    ```


    # 3.3.5 Digital Twin Data


    Digital twin data (DD) is denoted as expression (3.4) [35] with five parts. Dp
    is the data from the PE, mainly including the operation states and working conditions.
    Dv refers to the data from the VE and consists of model parameters and model operation
    data. Ds is the data from the Ss, describing the services encapsulation, combination,
    invocation, etc. Dk represents the domain knowledge, which is mined from the collected
    data or obtained from the existing databases and systems. Df denotes the fusion
    of Dp, Dv, Ds, and Dk, which can be obtained through data fusion algorithms, such
    as neural network, D–S algorithm, and Kalman filter.


    ```

    DD = (Dp, Dv, Ds, Dk, Df)    (3.4)

    ```


    # 3.3.6 Connection


    Connection (CN) includes six parts expressed as follows [35]:


    ```

    CN = (CN_SD, CN_PD, CN_VD, CN_PS, CN_VS, CN_PV)    (3.5)

    ```


    where CN_SD, CN_PD, CN_VD, CN_PS, CN_VS, and CN_PV denote the connection between
    Ss and DD, PE and DD, VE, and DD, PE and Ss, VE and Ss, and PE and VE, respectively.
    Each of them is bidirectional and the delivered data of each connection (denoted
    as CN_XX) are modeled as follows [35]:


    ```

    CN_XX = (Data sources, Unit, Value, Scope, Sampling interval)    (3.6)

    ```


    # 3.4 APPLICATION-ORIENTED THREE-LEVEL DIGITAL TWINS


    In the physical space, entities can be classified into three levels: a unit, a
    system, and a system of systems (SoS). Taking a shop-floor as an'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'example, a single person, a machine, a tool, or a product in it can be seen
    as a unit, which is the smallest element participating in production. These units
    can work together to form a system, that is, a production line, in which the units
    interact with each other and share a common production goal. The entire shop-floor
    can be considered as a SoS, which is a more complex system, consisting of multiple
    production lines and different flows (e.g., information flow, energy flow, and
    material flow). Accordingly, to describe the above entities in different levels,
    the DTs fall into three types, including the unit-level DT, system-level DT, and
    SoS- level DT [38].


    From the perspective of DT applications, the classification of DTs is also necessary.
    For example, for the monitoring, fault prediction, and maintenance of a single
    piece of equipment, the unit-level DT is enough to address the corresponding issues.
    But for applications that need to deal with different units, such as scheduling,
    progress control, and product quality control, the system-level DT is required.
    Furthermore, if the optimization and coordination of the entire shop-floor is
    required, the SoS-level DT needs to be used to cope with the complex relations,
    combinations, and associations.


    Therefore, in the following sections, the authors discuss the three levels of
    the DT, respectively, that is, the unit-level DT, system-level DT, and SoS-level
    DT.


    # ## 3.4.1 Unit-Level Digital Twin


    A unit-level DT is a minimum but independent individual, which cannot be further
    divided. It contains a basic closed loop of data between the physical and virtual
    spaces. With the abilities of sensing and computing, the unit-level DT supports
    state perception, computational analysis, and selfcontrol.


    The unit-level DT can be built based on the five-dimension DT, involving the PE,
    VE, Ss, DD, and CN. In the unit cell, the PE refers to a single entity (e.g.,
    a person, a machine, or a product). The VE consists of models with geometry, physical
    properties, behaviors, and rules to describe the single entity thoroughly. The
    Ss mainly provides services for the unit-level PE and VE, such as the monitoring
    service and maintenance service for a single machine. The DD only contains data
    of the unit, involving both physical and virtual aspects. The CN connects the
    above components together.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# ## 3.4.2 System-Level Digital Twin


    The unit-level DT can be connected with each other through certain relationships
    to form a system-level DT, which is a regularly interactive or interdependent
    group of units. The system-level DT is characterized by selforganization, selfconfiguration,
    selfdetermination, and selfoptimization through interconnection of units, data
    interoperation, collaborative control, etc.


    In the system-level DT, connections between different PEs, VEs, Ss, and DD in
    unit-level DTs need to be created to enable the data exchange processes, and thus
    form a collaborative network with functionality and capacity. Meanwhile, besides
    existing services for the units, new services will be added to serve the entire
    system, such as scheduling service, progress control service, and process optimization
    service toward multiple units. Data from different units should also be integrated
    to create a bigger data set, which can fully fill the information gaps among the
    units.


    # ## 3.4.3 System of Systems-Level Digital Twin


    The system-level DTs can be combined to create a SoS-level DT, which offers stronger
    functionality and performance than a simple sum of the constituent systems. The
    SoS-level DT is characterized by comprehensive information perception, in-depth
    analysis, precise decision-making and global optimization, and is driven by data
    aggregation, distributed computing, model interoperation, etc.


    The SoS-level DT can be constructed through linking key unit-level DTs in each
    system level, thus forming a more complex system that allows for synergism of
    data and intelligence. As the SoS-level DT enables the integration and interoperability
    of system-level DTs, it can pursue optimizations and predictions from a global
    perspective, given global resources and constraints. In this level, both services
    and data are much more abundant than that of the system-level DT, due to the increasing
    physical and virtual entities, as well as a large amount of dependencies, relationships,
    and interactions among them.


    # ## 3.5 KEY TECHNOLOGIES FOR DIGITAL TWIN MODELING


    As shown in Fig. 3.3, based on the five-dimension DT, key technologies for modeling
    of each dimension (i.e., PE, VE, Ss, DD, and CN) are presented.'
  merge: -1
  img_proc: true
