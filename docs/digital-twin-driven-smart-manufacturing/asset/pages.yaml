  md: '# CHAPTER 9


    # Digital Twin and Big Data


    Smart manufacturing is becoming the focus of global manufacturing. As intelligence
    comes from data, manufacturing big data is beneficial to all aspects of manufacturing.
    It can accurately predict requirements, and quickly identify errors and bottlenecks,
    thus innovating products and services, and improving manufacturing processes.
    Achieving the communication and interaction between the physical and virtual spaces
    of manufacturing is also an important bottleneck in smart manufacturing. Digital
    twin (DT) paves the way to solve the above bottlenecks. In this chapter, the similarities
    and differences between big data and DT and how the two concepts can be integrated
    to promote smart manufacturing are discussed.


    # 9.1 INTRODUCTION


    As shown in Fig. 9.1, an increasing number of devices are being connected to the
    Internet. Gartner predicted that more than 20 billion devices (most from the manufacturing
    industry) would be connected to the Internet of Things (IoT) by 2020 [1]. As a
    result, a large volume of various data is being generated, which will be over
    40 zettabytes (ZB) by 2020 [2], including structured, semistructured, and unstructured
    data. With powerful storage and computing capability of cloud computing, big data
    analysis models and algorithms are running to organize, analyze, and mine these
    raw data [3,4], and hereby obtain valuable knowledge. Meanwhile, artificial intelligence
    (AI) with selflearning ability is becoming increasingly more intelligent through
    data analytics [9].


    In manufacturing, big data involves a large volume of structured, semistructured,
    and unstructured data generated from the product lifecycle. The increasing digitalization
    of manufacturing is opening up opportunities for smart manufacturing [5]. The
    manufacturing data are collected in real-time and automatically using IoT [6].
    Through big data analysis based on cloud computing, manufacturers can find the
    bottlenecks of'
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/5042607b423be4a5ee3f15dae22cc5bb_183_0.png)


    # Figure 9.1 New IT and their applications [9].


    manufacturing processes, recognize the causes and impacts of problems, and find
    solutions. Therefore, manufacturing processes are improved to enhance production
    efficiency, making manufacturing leaner and more competitive. All the valuable
    information from manufacturing big data is fed back to support product design,
    manufacturing, and prognostics and health management (PHM). This can help traditional
    manufacturing transform into smart manufacturing [9].


    In addition, the interaction and convergence between the physical space and the
    virtual space of manufacturing is getting more and more attention. The digital
    twin (DT) paves the way for cyber–physical fusion. The DT is used to create virtual
    models for physical objects to digitally simulate their behaviors [7]. The virtual
    models can understand the state of the physical entities through sensing data,
    so as to predict, estimate, and analyze the dynamic changes. And the physical
    objects can respond to the changes according to the optimized scheme obtained
    from the simulation [5]. Through the cyber–physical closed loop, the DT could
    achieve the optimization of the entire manufacturing process [8–9].


    In conclusion, collecting and analyzing a large volume of manufacturing data to
    find laws and knowledge has become the key for smart manufacturing; meanwhile,
    the DT breaks the barriers between the physical space and the virtual space. However,
    are there any similarities and differences between big data and the DT? What are
    their respective advantages? Is it possible to structure a bridge to bring big
    data and the DT together? How can they be merged together? These questions are
    all worth deeply thinking about and exploring [9]. Therefore, this chapter reviews
    the concepts of big data and the DT, as well as their applications in manufacturing.
    On this basis, they are compared with each other from different aspects. In addition,
    big data and the DT are combined together to promote smart manufacturing.'
