  md: 'has an important meaning in the entire product lifecycle. A good design not
    only can show advantages in planning, but also has good manufacturability. To
    improve the traditional design method, current research introduces the DT in the
    design stage. Some related works are reviewed in this section.


    Tao et al. [1] believed the emergence of the DT would change the entire current
    product design paradigm, including conceptual design, detailed design, and virtual
    verification. At present, there exist some weaknesses in big data-driven product
    design processes, cloud manufacturing-based processes, and some other design processes.
    The DT is expected to overcome these weaknesses, because it can reflect as-designed
    and as-built products at the same time and eliminate their differences.


    Liu et al. [2] proposed a DT-driven methodology for rapid individualized design
    of an automated flow-shop manufacturing system, which applies physics-based system
    modeling and distributed semiphysical simulation to generate a digital design
    of the system at preproduction stage. The authors also proposed an iterative design
    framework based on the DT for the iterative optimization between static design
    and dynamic execution, and explored key enabling technologies for the framework
    [3]. Based on this work, how the production would perform in the real world could
    be simulated in advance and optimization guides for the design could be provided.


    Ferguson et al. [4] demonstrated how the US-based Mechanical Solutions, Inc. (MSI)
    used a simulation package from Siemens Product


