    +   - Validation: As the virtual machine tool can be adjusted with little cost,
    the machine tool operations can be validated in the cyber environment first, and
    then performed on the physical one, which reduces the risk involved in actual
    production processes.


    The virtual machine tool can be constructed through building and integrating geometry,
    physics, behavior, and rule models. As in Fig. 5.3, the geometry model represents
    the shapes, sizes, and assembly relations of components in the machine, including
    the main body, chuck, axis, tool, etc. The physical properties, such as the functions
    (e.g., turning, milling, and grinding), capacities (e.g., workload, working stroke
    and accuracy), and key parameters (e.g., speed, force, torque) are described by
    the physics model. The behavior model is constructed to simulate the EC in different
    stages (e.g., machining stage, idle stage, and overload stage) and levels (e.g.,
    part level, subsystem level, and entire machine level), as well as simulate the
    related parameters (e.g., cutting force). The simulated data can be compared with
    the actual ones for further analysis. Finally, the rule model concludes the relations
    among the EC-related parameters to support the EC evaluation and prediction.


    # 5.3.3 EECM Services


    In the EECM, the specific functions are realized by their corresponding services.
    There are two kinds of EECM services. The first mainly works for the physical
    machine tool for EC monitoring, analysis, and optimization. The second serves
    for the virtual machine tool, for example, model test and calibration services,
    ensuring the virtual mirror always keeps up with the physical entity [2].


