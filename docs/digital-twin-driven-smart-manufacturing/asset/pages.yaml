- pgno: 267
  md: '# Digital Twin Driven Smart Manufacturing


    Fei Tao, Meng Zhang, A.Y.C. Nee


    This book provides the ideal entry point to this subject for readers in industry
    and academia, answering questions such as “What is a digital twin, and how is
    it constructed?” “How can a digital twin be used to improve manufacturing efficiency?”
    “What are the essential activities in the implementation of a digital twin?”,
    “What are the most important obstacles to overcome for the successful deployment
    of a digital twin?” “What are the relations between digital twin and new technologies?”
    and “How to combine digital twin with the new technologies to achieve high efficiency
    and smartness in manufacturing?”


    Following an introduction to the background, concept and applications of the digital
    twin, initial chapters discuss the five-dimensional digital twin modeling and
    its key technologies, digital twin shop-floor, the equipment energy consumption
    management involved, and cyber-physical fusion in digital twin shop-floor. The
    book then proceeds with the relationships between digital twin and cloud, fog
    and edge computing, big data, services, virtual and augmented/mixed reality, as
    well as cyber-physical system, concluding with how an Internet of Things is applied
    to the physical and cyber worlds.


    Digital Twin-Driven Smart Manufacturing enables both engineers and academics with
    an interest in smart manufacturing to make the best use of digital twin technology,
    and analyze differences, synergies, and possibilities for integration between
    digital twin technology and other technologies such as Internet of Things and
    big data.


    Fei Tao is a professor at the School of Automation Science and Electrical Engineering,
    Beihang University, China. His research interests are service-oriented smart manufacturing,
    manufacturing service management and optimization, digital twin-driven product
    design/manufacturing/service, green and sustainable manufacturing.


    Meng Zhang is a PhD student at the School of Automation Science and Electrical
    Engineering, Beihang University, China. Her research is focused on digital twin
    technology in manufacturing and sustainable manufacturing.


    A.Y.C. Nee is an emeritus professor in manufacturing engineering at the National
    University of Singapore, Singapore. His research interests include the use of
    artificial intelligence, virtual and augmented reality applications in manufacturing,
    sustainable product design and life cycle engineering, and computer-aided manufacturing
    design. He is a fellow of the International Academy for Production Engineering
    (CIRP), fellow of Society of Manufacturing Engineers (SME), and fellow of the
    Academy of Engineering Singapore.


