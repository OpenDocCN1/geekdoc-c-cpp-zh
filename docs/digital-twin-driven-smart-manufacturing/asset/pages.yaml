    optimization, and predictive states to support decision making in the physical
    space.

    3. The data layer mainly refers to the data in SDTD. It can provide data to drive
    the operations of PS, VS, and SSS, and to implement data lifecycle management,
    such as data processing, integration, and fusion.

    4. The service layer mainly provides the shop-floor with production services including
    smart production scheduling, collaborative process planning, product quality management,
    production process management and control, equipment health management, and energy
    efficiency optimization analysis.


