    precision (e.g., roughness, deflection), parts processing (e.g., gear, plate),
    size (e.g., height, width, coordinates). Status can be overloaded, idle, in maintenance,
    etc. With respect to input and output, the input of the NC machine tool can be
    materials, such as steel, aluminum alloy, etc. And the output can be a part, or
    a small product. They can be formulized as (10.2)–(10.5) [30]:


    ```

    Basic = {type, name, ID, address, color, delivery_time, ...}  (10.2)

    ```


    ```

    QoS = {cost, time, reliability, trust, Fun_similarity, ...}  (10.3)

    ```


    ```

    Cap = {shape_cap, precision_cap, parts_cap, size_cap,...}  (10.4)

    ```


    ```

    Status = {load, health, ...}  (10.5)

    ```


    # 10.4.2 Virtual Entity Servitization


    Similarly, the virtual entity, which is composed of a set of virtual models, can
    also be described by the information template. Different from the physical entity,
    the virtual entity can be used by multiple users at the same'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'time, and can be copied without repetitive creation for the same or equal physical
    entity. Therefore, when the virtual entity is encapsulated into services that
    can be shared by users, not only can the creators of the virtual models receive
    benefits, but the users can also reduce costs and time. The information templates
    of the virtual entity (i.e., VE) can be described as in (10.6) [30].


    ```

    VE = { Ori_phy, Creator, Ori_ID, Cur_ID, Owner, QoS, Online_site, Input, Output,
    ... } (10.6)

    ```


    wherein, Ori_phy denotes the original physical entity corresponding to the virtual
    entity. Creator is the one who builds the virtual entity based on his specialized
    knowledge. Ori_ID is the original identifying number when the virtual entity is
    first created. Cur_ID represents the identifying number of the current copy. Owner
    is the one who possesses the virtual entity. The owner has copyright or may be
    the creator, and can earn profits through renting out the models or selling copies.
    Similar to the physical entity, QoS denotes the evaluation of the performance
    of the virtual entity, including cost, reliability, functions, etc. Online_site
    denotes the online address where users can access or download the models. Input
    and Output may vary according to the specific models [30].


    # 10.4.3 Data Servitization


    In addition, data are very important for smart manufacturing [33]. However, because
    of the various standards and communication protocols/interfaces, data are often
    difficult to acquire and understand. Through using the unified templates to describe
    the data, users can conveniently use the data. In general, data information includes
    the data provider who owns the data, data sources where the data is collected,
    data ID used to identify the data, data type (which denotes the kind of the data),
    and data abstract, which is a brief introduction to data value. Therefore, data
    (i.e., DD) can be described as in (10.7) [30].


    ```

    DD = { D_prov, D_source, D_ID, D_type, D_abstract, ... } (10.7)

    ```


    The information templates describe most of the information that users want to
    know and have to know. After the information templates are established, various
    kinds of physical entities, virtual entities, and data are encapsulated into services
    based on the service description language, such as XML. As an example, the information
    template of a punching machine'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'and a programmable logic controller (PLC) is encapsulated by a service based
    on XML, as shown in Fig. 10.3 [30]. The information template includes basic information,
    processing capability, process parameters, and axes information of the punching
    machine and PLC [30].


    # 10.5 DIGITAL TWIN SERVICE MANAGEMENT


    The circulation, transaction, and sharing of DT services depend on efficient management.
    As shown in Fig. 10.4 [30], after DT service generation, the services are published
    in the service pool and management platform, where they are managed to be shared
    by various users. Management for these services covers three stages, that is,
    the beginning of life (BOL), middle of life (MOL), and end of life (EOL), which
    are described as follows [18].


    The BOL covers the process from the various physical manufacturing resources and
    capabilities to the virtualized services. It contains the perception and connection
    of resources, transmission of perception data, data filtering and processing,
    resource virtualization, service modeling, and digital description. After more
    services are generated, service aggregation will emerge gradually. As a result
    all the services are gathered and integrated by various abstract correlations
    and relations (i.e., the functions, a variety of attributes, characteristics,
    and invocation histories) along with the continuous operation of the service platform.
    The MOL is the stage driven by demands from the service generation to be put in
    use. The operations are service searching and matching, service evaluation, service
    selection and service composition, service scheduling, and service transaction.
    The MOL consists of service execution and monitoring, fault tolerance, and logistics
    service for task implementation. Among these items, the logistics services [34]
    serve for the specific processes and results of some kinds of services. According
    to the different requirements of task implementation, the logistics could be the
    transportation of the results after service execution, as well as the transportation
    of the materials in the process of service execution. Finally, the services are
    released and disaggregated after execution in EOL [18].


    # 10.6 DIGITAL TWIN SERVICE APPLICATION


    The DT services can be applied in product design, production planning, manufacturing
    execution, prognostics and health management (PHM),'
