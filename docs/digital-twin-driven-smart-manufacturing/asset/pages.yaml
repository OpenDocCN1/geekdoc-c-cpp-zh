  md: 'occur, the maintenance programs are simulated and optimized in the virtual
    space of the DT to facilitate the actual maintenance. In this way, according to
    the real-time product status and the historical records, whether the product needs
    maintenance can be assessed. Similarly, the resources, capabilities, tools, and
    algorithms are used in the form of services. Therefore, the DT with big data prolongs
    the product life span and improves PHM efficiency [9].


    # 9.7 SUMMARY


    In spite of their differences, DT and big data play complementary roles in the
    manufacturing industry. Big data can be considered as an important part of the
    DT. Without big data, most functions of the DT will be castles in the air. Without
    the DT, the big data analysis and actual manufacturing process will not be in
    parallel. The DT, cooperating with big data, breaks the barriers between the different
    phases of the product lifecycle, and shortens the development and verification
    cycle. Combined with the accurate analysis and prediction capabilities of big
    data, the DT can implement precise management in many aspects, from product design
    to verification, and from manufacturing to PHM, etc., resulting in improved production
    planning and more precise production control. The DT and big data should ideally
    be used together and complement each other, jointly promoting the development
    of smart manufacturing [9].


