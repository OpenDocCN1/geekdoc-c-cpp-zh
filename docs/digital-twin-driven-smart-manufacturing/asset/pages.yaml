  md: '# CHAPTER 8


    # Digital Twin and Cloud, Fog, Edge Computing


    Digital twin (DT) is the preferred means to achieve the interoperability and integration
    between the physical and virtual spaces. From a hierarchical perspective, DTs
    can be divided into unit level, system level, and system of systems (SoS) level.
    To meet the practical requirements on smart manufacturing, three complementary
    technologies, that is, edge computing, fog computing, and cloud computing, are
    introduced to combine with DTs in different levels for function enhancement. In
    this chapter, the three-level DTs in manufacturing are described first, then the
    perspectives of unit-level DT, system-level DT, and SoS-level DT respectively
    supported by edge computing, fog computing, and cloud computing are discussed.


    # 8.1 INTRODUCTION


    From the manufacturing development perspective, a fusion process between the physical
    and virtual spaces of manufacturing is evolving over time. First, before the advent
    of information technologies, manufacturing only involved the physical space. Specifically,
    all manufacturing activities were done by humans and/or machines. The lack of
    information limited manufacturing efficiency and production capacities. In the
    second stage, the virtual space appeared. A variety of manufacturing-related software
    products were developed and applied in production. However, due to technological
    limitations, the advantages and potential applications of virtual space had not
    been fully exploited. In the third stage, the physical space and the virtual space
    began to interact with each other. The virtual space has strengthened the management
    of the manufacturing process, optimizing the logistics, capital flow, and information
    flow. However, during this stage, the physical and virtual spaces of manufacturing
    were not synchronized. At present, with the continuous developments of new generation
    information technologies (New IT), real-time interaction and'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'further integration between the physical and virtual spaces is becoming an
    inevitable trend in smart manufacturing [16].


    According to the horizontal analysis on various manufacturing strategies and vertical
    analysis on manufacturing development, the cyber–physical fusion of manufacturing
    is gaining increasing importance. To this end, digital twin (DT) has become the
    preferred technology. The DT creates virtual models for physical objects in a
    digital way to simulate their behaviors, serving as a bridge between the physical
    and virtual spaces [1]. Through the cyber–physical closed loop, the DT could promote
    smartness of all manufacturing processes [16].


    Smart manufacturing is a value creation process in which multiple subjects participate.
    Depending upon different magnitudes of the data in smart manufacturing and different
    time-sensitivities of smart applications, the DTs can be divided into three different
    levels, that is, the unit level, system level, and system of systems (SoS) level
    [2]. Each level has a data closed loop, including status perception, data analysis,
    decision making, and execution. However, as various levels have different roles
    and infrastructures, how to build various levels of DTs toward smart manufacturing
    becomes a central issue [16].


    Edge computing, fog computing, and cloud computing may offer solutions to the
    abovementioned issues. Cloud computing enables ubiquitous, convenient, on-demand
    network access to the shared resources pool [3]. Because of on-demand resource
    sharing, high computing and storage capabilities, as well as low costs, cloud
    computing is a perfect technological means for the SoS-level DT. Fog computing
    shifts the computing, storage, and networking capabilities of cloud to the edge
    network [4]. By directly processing data on the network (e.g., network routers,
    various information systems, etc.), fog computing can help implement the system-level
    DT. Edge computing allows data processing to be performed at closer proximity
    to the data sources [5]. The edge can be defined as the end points with both data
    producers and data consumers. For the unit-level DT, edge computing will be very
    beneficial [16].


    In this chapter, edge computing, fog computing, and cloud computing are introduced
    for implementing the unit-level, system-level, and SoS-level DTs, respectively,
    toward smart manufacturing. The three-level DTs in manufacturing are described
    first, then edge computing, fog computing and could computing are briefly reviewed.
    Finally, a framework of the three-level DTs based on these technologies is discussed.'
