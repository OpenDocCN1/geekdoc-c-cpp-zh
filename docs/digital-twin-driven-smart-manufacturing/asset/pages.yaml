  md: '# CHAPTER 11


    # Digital Twin and Virtual Reality and Augmented Reality/Mixed Reality


    Virtual reality (VR) and augmented reality (AR)/mixed reality (MR) are becoming
    more mature with the development of related technologies, such as the advanced
    sensors, computer graphics, real-time registration and tracking, etc. The VR and
    AR/MR technologies play important roles in the seamless integration and fusion
    of the physical and virtual worlds, which is crucial for digital twin (DT) implementation.
    In this chapter, the DT is combined with these technologies. Based on the existing
    and potential applications of VR and AR/MR in the DT, a general framework is proposed
    to integrate these technologies with the DT to provide more immersive and interactive
    services to users. According to the proposed framework, an assembly process is
    then discussed.


    # 11.1 INTRODUCTION


    The history of virtual reality (VR) began in 1962, when a device called the Sensorama
    Simulator was invented and patented to create a virtual environment that could
    provide users with multisensory experiences in terms of sound, scent, wind, vibration,
    etc. [1]. However, the environment enabled by the Sensorama Simulator was not
    interactive [2]. To solve this problem, Sutherland developed the first head-mounted
    display (HMD) system several years later, which could generate an interactive
    view in accordance with users’ head position sensing [3]. Krueger also created
    a VR interactive environment, in which the computer could perceive a participant’s
    actions and respond in real-time with visual and auditory displays [4]. In the
    1980s, the Virtual Programming Languages (VPL) Company produced the popular DataGlove
    and the Eyephone HMD, which were the first commercially available VR devices [2].
    In 1992, CAVE automatic virtual environment appeared [2]. Instead of using an
    HMD, it projected stereoscopic images on the walls of a room, thus'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'improving users’ immersive feelings. In 1995, the VR modeling language was
    developed by Silicon Graphics, allowing people to create and interact with various
    virtual models conveniently and rapidly [5]. In the 21st century, VR has been
    applied to different fields, including entertainment [6], education [7], health
    care [8], manufacturing [9], etc.


    Augmented reality (AR) can be viewed as a variation of VR [5]. In contrast to
    VR, which creates a completely virtual environment, AR overlays virtual information
    on the real world to augment the reality rather than replace it. The term augmented
    reality was proposed by Caudell and Mizell in 1990 [10]. In 1993, Rosenberg invented
    the first functioning AR system, that is, virtual fixtures, which could overlay
    computer-generated percepts on a real workspace to enhance human performance [11].
    Feiner et al. developed a system to generate maintenance and repair instructions
    for a user wearing an experimental head-mounted, see-through display [12]. The
    system enables the user to interact with both the real surroundings and virtual
    information, and can be also considered as one of the early prototypes of AR.
    In 1998, Raskar et al. introduced the spatially augmented reality (SAR), with
    which virtual objects could be integrated directly within the physical space [13].
    In 1999, ARToolKit was developed by Kato to provide an efficient and rapid method
    for AR system construction [10]. ARQuake was invented by Thomas et al. to convert
    the traditional desktop first-person perspective application to an outdoor/indoor
    mobile AR application for the first time [11]. In 2008, the Wikitude AR travel
    guide was launched for the Android phone, which added navigation data to real-time
    streetview [5]. In recent years, with the technical development of related hardware
    and software, AR has become an effective tool in activities such as planning,
    guiding, and training in different fields.


    Mixed reality (MR) is another form of AR. In 1994, Milgram and Kishino [14] first
    proposed the concept of the “virtuality continuum” and specified that MR could
    provide a hybrid and continuous space that extends from a completely real environment
    to a completely virtual environment. MR is essentially the same as AR, and both
    of them focus on the fusion of physical and virtual elements. However, AR is a
    more commonly used term in related research and MR is less mentioned than AR.
    Therefore, in the remainder of this chapter, AR is used to denote AR/MR for short.


    In recent years, VR and AR have been closely coupled and have mutually complemented
    each other. As they have shown potential for'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'seamless integration and fusion of the physical and virtual spaces, great importance
    has been attached to their development. In this chapter, VR and AR are combined
    with the digital twin (DT) to augment the two spaces of the DT and further enhance
    the fusion, thus helping the DT to achieve more efficient applications. In the
    following sections, VR and AR in design, manufacturing, and service are reviewed
    and then compared from different aspects. Based on the existing and potential
    applications of these technologies in the DT, a general application framework
    is proposed and then discussed in terms of an assembly process.


    # 11.2 VR IN DESIGN, MANUFACTURING, AND SERVICE


    VR can provide an immersive, interactive, computer-mediated experience in which
    a person perceives an artificial environment by means of human–computer interaction
    equipment, such as computers, HMDs, headphones, and data gloves [1,15]. Related
    technologies of VR include human–computer interaction, computer graphics, haptic
    feedback, dynamic environment modeling, solid vision, etc. As the VR is characterized
    by immersion, presence, interactivity, and navigation [16], many researchers have
    explored VR applications in the design, manufacturing, and service fields.


    # 11.2.1 VR in Design


    VR provides a completely virtual environment for designers to develop prototyping,
    interact with product models, evaluate alternate designs, etc. It can improve
    visualization of the product, provide intuitive model manipulation, and realize
    collaborative design. Some related studies on factory layout design and product
    design are introduced as follows.


    In factory layout design, Iqbal and Hashmi [17] discussed how to design and analyze
    a factory layout in a 3D virtual environment by means of VR and developed a new
    aisle system to reduce the material handling distance. Menck et al. [18] proposed
    a collaborative platform based on VR for factory layout design. Users in different
    places can cooperate, explore, and analyze within the same immersive system in
    real-time. Gebhardt et al. [19] proposed a holistic VR application, called the
    Factory Layout Planning Assistant, which not only serves as a platform for realistic
    virtual walk through simulation, but also provides insights for decision making.
    Ebner et al. [20] developed a VR-based multitouch table, which allows the users
    to select necessary items from an object library and place'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'them on a layout with the touch of a finger. Errors or information can be evaluated
    and shown on the table in real-time.


    In product design, Ryken and Vance [21] combined VR with finite element analysis,
    sensitivity analysis, collision detection, etc., to create an interactive environment,
    where designers can modify part shape, evaluate stress, and check for interference
    for new parts. Bruno et al. [22] used an interprocess communication library to
    link a VR environment and a numerical simulation environment together. In this
    way, product behaviors can be simulated and predicted using numerical simulation
    software and then visualized in the VR environment. Sung et al. [23] proposed
    a VR-based cable harness design system, which can automatically capture design
    knowledge embedded within log files, and transmit the knowledge to users during
    a design task.


    # 11.2.2 VR in Manufacturing


    VR can be applied in manufacturing for process planning, simulation, inspection,
    verification, etc., which can help operators better understand the manufacturing
    process and improve manufacturability, durability, and profitability of the final
    product. VR applications in computerized numerical control (CNC), virtual assembly,
    and robotics are mainly introduced.


    In CNC simulation, Luo et al. [24] proposed a hierarchy structure of NC behavior
    simulation based on VR and developed a prototype system. Lin and Fu [25] presented
    a virtual modeling method to generate structures of machine tools in response
    to the functional and structural requirements from users. A virtual machine tool
    is developed for designing, testing, optimizing, controlling, and machining in
    a virtual environment. Kao et al. [26] built a virtual controller for the CNC
    milling machine based on VR software and Microsoft visual basic programming environment.
    The virtual controller can parse users’ NC codes, simulate tool paths, and drive
    the virtual CNC according to the tool path.


    In assembly verification, Seth et al. [27] developed a low-cost VR application
