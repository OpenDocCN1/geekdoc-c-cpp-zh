    - _VV&A:_ It conducts verification, validation, and accreditation activities for
    the models, which keeps precision, sensitivity, and robustness of the VE.


    # 3.5.3 Key Technologies for Services Modeling


    Key technologies to create and maintain services in the Ss mainly include the
    following aspects. Technical details have been explored in the books _Theory and
    Practice: Optimal Resource Service Allocation in Manufacturing Grid_ [36] and
    _Resource Services Management in Manufacturing Grid System_ [37].


    +   - _Resource management:_ It efficiently collects, classifies, and organizes
    resources in the DT, such as model resources, algorithm resources, data resources,
    and tool resources.

    - _Service description:_ It transforms resources into services through digital
    descriptions, which describe the basic information, functionality, and nonfunctionality
    of the services.

    - _Service encapsulation:_ It encapsulates services with standard inputs and outputs.

    - _Service visualization:_ It creates a software-based representation of services,
    with a high-quality visual display.

    - _Service search and matching:_ It searches for suitable services based on similarity
    matching algorithms.'
