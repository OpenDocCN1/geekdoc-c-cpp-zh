  md: '![](img/5042607b423be4a5ee3f15dae22cc5bb_185_0.png)


    Figure 9.2 Brief history of big data [24].


    Wikipedia illustrates that big data is a term for any collection of large and
    complex data sets that are difficult to analyze using traditional data processing
    methods. In a more straightforward definition, big data means data that is too
    big, too fast, or too hard for existing tools to process [25].


    # 9.2.3 Characteristics of Big Data


    The properties of big data have been summarized as the five Vs, with the three
    most famous Vs being volume, variety, and velocity, as introduced by Laney, a
    Gartner analyst, in 2001 [19].


    +   - *Volume* refers to a large amount of data. The data storage unit in big
    data has reached the terabyte (TB) and petabyte (PB).

    - *Variety* refers to a great number of types of data including weblog, music,
    video, picture, geographical position, etc.

    - *Velocity* refers to the high speed of data processing, which is the most distinct
    feature from the traditional database. Nowadays, another two Vs have been added
    to the model as follows.

    - *Variability* refers to the expansion in the range of values of data. Because
    it can cover the full range of human experience, big data always shows more variance
    than traditional data sets.

    - *Value* refers to the low density and the high overall value of big data. Among
    the large quantity of data, only a very small part of this information is useful
    and there is a need to evaluate it. Through data analytics methods, valued information
    can always be obtained and used in business operations.


    According to the five Vs model, both the sheer amount of data and other characteristics
    of big data can bring challenges to big data'
