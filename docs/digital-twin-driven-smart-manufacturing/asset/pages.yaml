    # 7.3 DIGITAL TWIN-DRIVEN PHM METHOD


    The constructed DT is then applied to create the DT-driven PHM method. In this
    method, faults are classified into two types: gradual fault and abrupt fault [27].
    The former can be predicted as caused by the gradual degradation of the components,
    such as wear, aging, and fatigue. The latter is unpredictable and can happen suddenly
    due to random disturbances unknown to VE, such as human interference, environmental
    change, and incorrect installation. To deal with the two types of faults, the
    DT-driven PHM method, including the framework, procedure, and coevolution mechanism
    are studied as follows.


    # 7.3.1 Framework


