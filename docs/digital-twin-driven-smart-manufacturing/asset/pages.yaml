    # 9.3.3 Data Storage


    The large volume of collected data from manufacturing processes must be securely
    stored and effectively integrated. Generally speaking, the various types of manufacturing
    data can be classified into structured (e.g., digit, symbols, tables, etc.), semistructured
    (e.g., trees, graphs, XML documents, etc.), and unstructured data (e.g., logs,
    audios, videos, images, etc.) [35]. Traditionally, manufacturing enterprises focused
    heavily on structured data storage, since it was difficult to directly manage
    unstructured data within enterprise databases. Object-based storage architecture
    enables collections of data to be stored and managed as objects, which provides
    a more flexible solution for integrating semistructured and unstructured data
    [36]. Also, through cloud computing [37], data storage can be achieved in a highly
    cost effective, energy efficient, and flexible fashion. In addition, by virtue
    of cloud services, the distribution and heterogeneity of data are shielded, enabling
    a highly scalable and sharable mode of data storage [31].


    # 9.3.4 Data Processing


