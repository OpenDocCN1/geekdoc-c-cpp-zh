    The brief history, concept and characteristics of big data have been explored
    in the authors’ previous work [24], and they are introduced in this section.


    # 9.2.1 Brief History of Big Data


    The story of how data became big started many years before the current fervent
    interest in “Big Data.” 50 years ago, a rapid increase in the volume of data and
    information appeared, known as the “information explosion” [10]. Since then, papers
    related to information collection [11], storage [12], and processing [13] have
    greatly contributed to the boom of big data. The first article in the Association
    for Computing Machinery (ACM) Digital Library to use the term “Big Data” is “Application
    controlled demand paging for out of core visualization” [14] in the Proceedings
    of the IEEE 8th Conference on Visualization in 1997. From then on, the concept
    of big data has gradually become accepted by scientists and researchers. In 1989,
    Dresner, a Gartner Group analyst, proposed “business intelligence” as “concepts
    and methods to improve business decision making by using fact-based support systems”
    [15]. Business intelligence and analytics (BI&A) has emerged as an important area
    of study for both practitioners and researchers [16] who are dedicated to data
    analytics problems. In 2011, the paper entitled “Big Data: The next frontier for
    innovation, competition, and productivity” [17] by McKinsey Global Institute truly
    brought big data into the public eye. In the same year, Science published a special
    online collection, “Dealing with Data,” which discussed issues of big data in
    scientific research. The academic milestones [14,17–23] in the brief history of
    big data since 1997 are illustrated in Fig. 9.2.


    # 9.2.2 Concept of Big Data


    The concept of big data has not been precisely defined, as there is a lot of buzz
    around it [25]. It has been declared as a new kind of economic asset that is strongly
    competitive in economics, like currency or gold [26]. The creator of the “Day
    in the Life” photography series even suggested that big data was an intelligent
    tool to combat poverty, crime, and pollution [26]. A convincing definition of
    big data focuses not only on the size of data in storage but also on other important
    attributes of big data, such as data variety and data velocity [27]. For example,
    the definition from'
