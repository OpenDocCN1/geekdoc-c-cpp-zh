    # 10.6.1 Digital Twin Service Application in Product Design


    In product design, it is the process of back-and-forth interactions among expected
    space, interpreted space, and physical space [36]. DT-driven design aims to turn
    the expected product in the designer’s mind into the digital representation in
    the interpreted space based on the existing physical products. To innovate a product,
    designers have to study plenty of data to acquire valuable knowledge [37]. However,
    the data concerning the product is one of the most important assets, and is not
    easy to access. Besides, the designers do not have the professional abilities
    to process massive data. Service is an answer to these problems. The designers
    just simply submit their needs to the services management platform. The service
    managers will match the data services that the designers need with the model services
    and algorithm services used to process the data. Through invoking and combining
    these services, the needed results will be returned'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'to the designers. As a result, the designers can acquire what they want in
    a “pay-as-you-go” manner [38]. Moreover, after the function structures and components
    of the product are designed, the design quality and feasibility need to be tested.
    In virtue of the DT, the designers can quickly and easily forecast product behaviors
    through verification of the virtual product without waiting until the product
    prototype is produced [39]. But the virtual verification needs the models of the
    manufacturing site (e.g., production line or shop-floor), which the designers
    do not have. After services encapsulation, the model services can be invoked and
    easily applied in product design, which makes product design more effective to
    reduce the inconsistencies between expected behaviors and designed behaviors,
    and greatly shorten design cycles and reduce costs.


    # 10.6.2 Digital Twin Service Application in Production


    In general, production is the entire process from the input of raw materials to
    the output of finished products, which is performed on the shop-floor. In the
    phase of production planning and production execution, the DT provides an effective
    method to draw up the plan and optimize the execution process [40]. First, a production
    task is submitted to the services management platform, and resource services of
    supply–demand matching and scheduling are carried out to find available resources.
    Then, based on the real-time status of the physical resources (e.g., machine tools,
    robot arms, materials), a production plan is drawn up. Digital twin shop-floor
    (DTS) can simulate the plan in virtual space and identify the potential conflicts
    even before the actual production [41]. However, building the DTS is a complex
    and specialized work, especially the models describing physical properties, rules,
    behaviors, etc. With the help of services, these models do not have to be created
    by manufacturers themselves. For physical equipment and pervasive rules, their
    models, which have been established by other manufacturers, can be bought to use
    in the form of services. Current manufacturers only need to create special models,
    which are private for themselves. Besides, during the operation of the shop-floor,
    some services, such as data processing and shop-floor management, would need to
    be invoked from the service system of the DTS.


    # 10.6.3 Digital Twin Service Application in PHM


    The degradation of performance is inevitable during operation of the physical
    equipment. Equipment malfunction will result in high'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'maintenance costs and postponement of tasks. PHM is essential to monitor the
    equipment’s condition, and predict and diagnose equipment faults and component
    lifetimes. In DT-driven PHM, the virtual models of the physical equipment are
    synchronized with the real states of the equipment. The operation status of the
    equipment and the healthy conditions of the components are grasped in real-time.
    A high-fidelity digital mirror for the equipment provides access to the equipment
    even out of physical proximity. Besides, the interaction of the DT can reduce
    the disturbances from the external environment, thus improving accuracy. Similar
    to product design, production planning, and production execution, the models can
    be accessed through services. Moreover, when failures occur, maintenance services
    will be invoked to repair or replace the worn components of the equipment.


    # 10.7 SUMMARY


    DT has provided a promising opportunity to implement smart manufacturing by integrating
    the virtual and physical spaces in manufacturing. With services, functions of
    the DT can be extended and enhanced. In addition, the construction of the DT can
    be further standardized and simplified. In this chapter, through combining the
    DT with services, DT service generation, management, and application are discussed,
    respectively, and methods for servitization of DT components are provided. At
    present, the DT research is only in its infant stage. More studies need to be
    carried out to improve and enrich the methods of DT modeling and servitization
    with consideration of other factors and practical situations.


