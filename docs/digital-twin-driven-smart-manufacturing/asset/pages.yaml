  md: '# 9.6 FUSION OF DIGITAL TWIN AND BIG DATA IN MANUFACTURING


    # 9.6.1 Product Design Driven by Fusion of Digital Twin and Big Data


    In the design phase, product innovation relies on the accurate interpretation
    of market preferences and customer demands, and the capacity to translate customer
    voices to product features and quality requirements. Big data enables designers
    to promote product innovations, and develop more customized products. After the
    product concept is confirmed based on big data, the function structure and components
    of the product can be designed in virtue of the DT. In the traditional design
    pattern, after completing the design, some key components must be first manufactured
    to allow the manufacturers to assess the design quality and feasibility. However,
    by taking advantage of the DT and big data, vivid simulation scenarios can be
    created to predict the finished quality of the designed product, and identify
    the design defects in the virtual space. The components are manufactured and assembled
    using virtual models simulating the actual production process. In this case, whether
    the designed parts can be manufactured, whether the parts can be assembled, whether
    the parts interfere with each other, and whether the design scheme meets the relevant
    specifications and functions requirements, can be quickly verified. If the design
    scheme cannot pass the simulation testing, the product must be redesigned in real-time.
    When the product is redesigned, the big data technologies will be used to identify
    problems to improve the design scheme. In the process of product design, the required
    tools and algorithms are used in the form of services. As a result, the DT in
    combination with big data shortens the design cycle, thus reducing the cost of
    time and money [9].


    # 9.6.2 Production Driven by Fusion of Digital Twin and Big Data


    In the production stage, the DT with big data can enable optimization of the production
    planning and real-time adjustment of the production process. Before the production
    begins, it is necessary to improve the production planning through confirming
    whether every requisite resource is available. First of all, hypernetwork-based
    manufacturing resource services of supply–demand matching and scheduling [47]
    are carried out by the services part in Fig. 9.4, to quickly find available resources.
    On this basis,'
  merge: -1
  img_proc: true
