    it is an ideal option to develop the DT in combination with big data.


    # 9.5 COMPLEMENTARITY BETWEEN BIG DATA AND DIGITAL TWIN


    There are many visible and invisible problems in smart manufacturing, which can
    be reflected by the data. Big data brings more efficient, sharper insight and
    more intelligence to manufacturing. However, as manufacturing processes become
    more complex, it is difficult to quickly identify problems arising in the myriad
    of processes. In the general manufacturing process, designers and manufacturing
    staff are affiliated with different departments or systems, and work independently.
    The designers submit product concepts and design schemes to the manufacturing
    department. The manufacturing department then reflects on how to implement them.
    This can easily lead to product information loss. Once the design changes, it
    is difficult to achieve synchronous updates in the manufacturing process. Besides,
    due to processing and assembly errors and other factors, real manufacturing implementation
    and production planning may not be completely consistent, hence limiting the manufacturing
    effectiveness. It is also possible that the manufacturing process cannot meet
    all the design requirements. Moreover, common product maintenance methods are
    often passive rather than proactive and are often based on heuristic experience.
    Many faults can only be diagnosed in the situation where the product is used.
    Therefore, the questions become: how to feed back the effective information collected
    from the manufacturing process to the'
