  md: '# 7.3.3 Coevolution Mechanism


    During DT-driven PHM, the PE, VE, and Ss evolve with each other continuously,
    as shown in Fig. 7.9. For PEi, VEi, and Ssi, i represents the i th interaction
    among the three parts.


    The PE and the VE always make an effort to keep consistent with each other. Assume
    that PEi and VEi are consistent in the beginning. To distinguish the current “consistency”
    with others, it is labeled as “consistencyi.” However, since the states of PEi
    (denoted as pai) are continuous and variable, the states of VEi (denoted as pei)
    may appear to have deviated due to defects and limitations in the models. In this
    situation, model calibration service will be performed to calibrate the VEi to
    keep up with the PEi. After that, the new consistency (i.e., consistencyi+1) is
    reached. From consistencyi to consistencyi+1, the VE evolves to better understand
    the PE, which makes the VE provide more accurate data and models for the PHM.
    As to the other aspect, if random disturbances from the external environment (always
    unknown to VEi) exist on PEi, the deviation between pai and pei will also appear.
    The disturbances will be captured by the inconsistency cause judgment service
    and eliminated by the maintenance service to achieve new consistency. By this
    process, the disturbance sources are reduced gradually and the PE is more likely
    to operate as the expected process provided by the VE, which makes the faults
    of the PE more predictable.


