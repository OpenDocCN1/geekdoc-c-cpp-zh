    # 4.2 RELATED WORKS


    Current research on the shop-floor has made significant efforts to enhance the
    interactions between the physical and virtual spaces, and strengthen the abilities
    of the virtual space. However, some deficiencies still exist in the following
    aspects, which have been studied in the authors'' previous work [6]: (1) data
    collection, (2) data processing, (3) information system construction, (4) virtual
    model construction, and (5) exploration for new modes of production.


    # 4.2.1 Data Collection


    Fieldbus and Industrial Ethernet are prevalently employed on the shop-floor for
    the wired connection of sensors, actuators, and controllers. Research mainly covers
    the real-time communication mechanism [7,8], protocol standardization [9], integration
    with intranet [10,11], etc. With the development of IoT, wireless sensor networks
    (WSNs) and RFID are applied on the shop-floor to collect the real-time states
    wirelessly, which increases the flexibility of data acquisition [12–14]. Meanwhile,
    standardized technologies and devices are discussed to shield the heterogeneity
    of protocols and interfaces, such as MTConnect [15], middleware technology [16],
    and coherent and semantic encapsulation [17]. Although these works enable real-time
    data collection, they are mainly designed for the data from the actual production
    in the physical space, seldom focusing on the simulated data from the virtual
    space.


    # 4.2.2 Data Processing


    Various data processing methods have been applied on the shop-floor to transform
    raw data into valuable information for further analysis and decision making. The
    common processing methods include data regression [18,19], data filtering [20],
    multisensor data fusion [21], data dimension reduction [22,23], data classification
    [24], etc. However, the methods'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'mainly process data from the physical space, and few methods focus on the fusion
    of data from both the physical and virtual spaces, which may generate a more comprehensive
    and accurate result.


    # 4.2.3 Information System Construction


    Various information systems have been built to serve the production process. For
    instance, Zhong et al. [25] built an RFID-enabled real-time manufacturing execution
    system, which provides more practical planning and scheduling decisions for the
    shop-floor. Luo and Kuo [26] implemented a robot arm system to realize the proper
    grasping of target objects. Fang et al. [27] explored an event-driven shop-floor
    work-in-progress management platform to monitor and control the dynamic production.
    A real-time discrete event-based monitoring system was developed for the event
    construction, state prediction, and disturbance detection for the RFID-enabled
    shop-floor [28]. Benefiting by the real-time data, these systems can make in-time
    reactions to the events occurring on the shop-floor and generate real-time strategies
    for optimization. However, these systems are mainly fed by the data from the physical
    space; the simulated data and the fused data are seldom considered.


    # 4.2.4 Virtual Model Construction


    With the development of virtual manufacturing, a virtual environment in which
    models replace the physical entities for evaluation, verification, and optimization
    is established. For the shop-floor, a quantity of research has focused on geometry
    modeling of the production resources for the layout optimization [29], machining
    process control [30], and logistics planning [31]. Based on this, some other research
    has further explored the modeling of physical properties (e.g., wear, force, and
    torque), then simulated the physical parameter change process [32], and evaluated
    the process plan [33]. However, there is a lack of models that can describe the
    behaviors and rules of the shop-floor, especially models that could seamlessly
    fuse the geometric parameters, physical properties, behaviors, and rules to form
    a complete digital mirror of the shop-floor.


    # 4.2.5 Exploration of New Modes for Production


    With the development of New IT, some researchers have introduced these technologies
    onto the shop-floor to explore new production modes. For examples, Monostori [34]
    discussed the concept of cyber–physical'
