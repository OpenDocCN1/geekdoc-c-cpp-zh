    # 11.5 DIGITAL TWIN AND VR AND AR


    # 11.5.1 Existing Studies and Applications of VR and AR in Digital Twin


    As VR and AR can create an interactive and immersive environment to augment the
    seamless integration between the physical and virtual worlds, some researchers
    and organizations (especially some reputable companies) have attempted to apply
    them in the DT. To date, the existing and potential applications of these technologies
    in the DT mainly focus on visualization, physical—virtual integration, user experience
    improvement, remote collaboration, etc., as presented below:


    +   1. *VR in DT.* Rockwell Automation attempted to employ the DT to build a safer
    and more immersive environment for training, and to leverage VR and AR to enhance
    visualization for the DT [81]. Siemens has developed realistic virtual substitutes
    for gas turbines, which are visualized with VR goggles [82]. In the VR environment,
    sensor data is translated into colors to express the temperature distribution,
    which facilitates maintenance. Alibaba Cloud focuses on how to use the DT to generate
    an integrated data model to improve the existing VR systems [83]. Huawei has combined
    the DT with VR for'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'virtual assembly [84]. It has constructed DTs for products and assembly stations,
    with which designers can simulate different assembly scenes wearing VR glasses
    and gloves. Oracle enables users to visit and work in the DT-based virtual plant
    via Gear VR [85].


    2. AR in DT. PTC has combined the DT with AR and VR to guide maintenance for a
    physical machine [86]. GE applied a Microsoft HoloLens into the DT to superimpose
    a virtual steam turbine over the actual one, allowing users to look inside the
    turbine to identify the damaged parts [87]. Peaxy believed that data visualization
    enabled by AR is essential for the DT to solve real business problems [88]. Microsoft
    has applied MR into a process DT that encompasses the entire production environment.
    With MR, holograms of the production line overlaid with real-time data and information
    were developed, which permits users to work remotely and to collaborate with teams
    in disparate locations [89]. Besides these companies, other researchers have also
    carried out related studies. For examples, Kritzler et al. [90] proposed the concept
    of virtual twin based on AR, which is an interactive virtual representation of
    the corresponding physical object. Schroeder et al. [91] retrieved data from the
    DT via web services and displayed the data to users in real-time via an AR system.
    Peuhkurinen and Mikkonen [92] researched how to use the existing web technologies
    to develop DT applications in an MR environment. In future, by combining with
    technologies such as VR, AR, artificial intelligence (AI), and the Internet of
    Things (IoT), the DT can be created in a cost-efficient way and enable users to
    work with the digital substitute remotely, eliminating or reducing the need to
    check the real object on site [93,94].


    In view of the above works, it is clear that combining VR and AR with the DT has
    become an inevitable and beneficial trend. However, a general application framework
    that can introduce VR and AR into the five-dimension DT and enable these technologies
    to be coupled with each DT component is still lacking. To solve the problem, such
    a framework is discussed in the following section.


    # 11.5.2 Application Framework of VR and AR in Digital Twin


    Based on the existing and potential applications of VR and AR in the DT, a framework
    that applies these technologies to the DT is proposed, as shown in Fig. 11.1.
    In the DT, the physical entities (PEs), virtual'
