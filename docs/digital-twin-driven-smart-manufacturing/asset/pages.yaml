    model calibration and test, data mining, etc., to support the model operation
    and evolution. These demands can be decomposed into subdemands that usually focus
    on problems like what data should be used, which model is most suitable, and which
    algorithm provides the best solution. According to the subdemands, the SSS selects
    suitable subservices from the candidates, and then combines them under certain
    rules to form the composite services for the PS or the VS under the constraints
    on time, cost, quality, etc. The services are monitored at runtime and will be
    recomposed if working improperly. For the VS, the composite services are transmitted
