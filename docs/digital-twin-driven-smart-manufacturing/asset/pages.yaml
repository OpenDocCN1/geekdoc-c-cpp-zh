  md: '# 10.2.2 Framework of Service-Oriented Smart Manufacturing


    As shown in Fig. 10.1, the abstract framework of service-oriented smart manufacturing
    (SoSM) consists of two parts, the physical space and the virtual space. The physical
    space comprises manufacturing resources and human resources. Manufacturing resources
    include materials, machine tools, machining centers, robots, products, and software
    resources. Human resources refer to workers on the shop-floor, managers in enterprise,
    and users in the product’s lifecycle. In addition, to interact with the virtual
    space, the physical space also includes sensor systems and actuator systems. The
    sensor systems are responsible for collecting various data of manufacturing resources
    and processes from the physical space. The actuators receive instructions from
    the virtual space and drive the manufacturing resources to achieve tasks according
    to smart decisions. All the manufacturing activities are accomplished collaboratively
    by humans, machines, and other entities in the physical space eventually [26].


    The virtual space is composed of two important components. One of them is the
    virtual mapping of the physical space. Through real-time data acquisition, data
    integration, and analysis, it can dynamically track and monitor the status and
    progresses of the physical space, based on the virtual models from physical entities.
    This component consists of data,


    ![](img/5042607b423be4a5ee3f15dae22cc5bb_204_0.png)


    Figure 10.1 An abstract framework of SoSM [26].'
  merge: -1
  img_proc: true
