- pgno: 36
  md: 'Lifecycle Management (PLM) Software (i.e., STAR-CCM + software) to build DT
    models for water pumps and to address design challenges. Via this software’s powerful
    simulation capabilities, designers could easily and efficiently predict the performance
    of the pumps and avoid damaging effects.


    Stark et al. [5] introduced a new architecture based on the DT for modularized
    design of cyber–physical production systems (CPPS). Through integrating existing
    production resources in a construction kit, an evaluation method for new manufacturing
    processes was developed to help identify needs for new machines and cyber–physical
    system (CPS) units. Furthermore, with a virtual prototype, the architecture of
    the CPPS was validated and optimized.


    Damiani et al. [6] applied DT-based simulation to design a real plant that produces
    anchoring plates for electric motor brake discs. AnyLogic software, which describes
    layouts, products, operators, machines, and packaging workings, was used to construct
    the plant and to simulate the operation process. It aims at achieving the lowest
    level of work in process (WIP), thus reducing the cost of storing.


    Mavris et al. [7] explored a design method for an aircraft based on the DT and
    digital thread, which could efficiently deal with challenges in traditional design
    methods, including lacking physical data, uncertainty, integrating of multiple
    disciplines, and data and knowledge management.


    With high-fidelity simulation provided by the DT, the design for a product or
    a production system can be validated to eliminate the potential failures before
    actual execution. What is more, as the DT can reflect as-designed and as-built
    products synchronously, it can eliminate differences between the two.


    # ## 2.1.2 Digital Twin in Production Stage


    Production is a complex process, during which material, energy, and information
    flow exist synchronously and interact with each other. At this stage, researchers
    have made a lot of efforts, including increasing flexibility of production processes,
    reducing energy consumption, improving product quality, etc. Recently, some related
    research has combined the DT with production and obtained performance improvement.


    Rosen et al. [8] discussed how the DT could be applied in supporting autonomous
    production systems. As the DT integrates all available data and knowledge seamlessly,
    it could combine related data to perform'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'accurate simulation-based forecasting for the production, which allows

    high-level flexibility and automaticity.


    Tao et al. [9] proposed the concept of digital twin shop-floor (DTS),

    and explored the conceptual model, interaction mechanism, characteris-

    tics, and key technologies for the DTS. Moreover, they discussed the

    operation mechanism and fusion method for each composition of the

    DTS to give more insights [10,11]. Based on the above work, an applica-

    tion on equipment energy consumption management in the DTS was

    presented and potential advantages were analyzed [12].


    Coronado et al. [13] designed a framework of a shop-floor DT for

    production control and optimization. In the framework, raw data col-

    lection for physical assets is enabled using MTConnect, a mobile device

    application, and hypertext transfer protocol. Based on the collected data,

    the shop-floor DT in virtual space was created to serve the managers, prov-

    ers, and clients, who take actions that affect the factory. The proposed

    framework was finally validated in a manufacturing research center,

    achieving good performance.


    Sun et al. [14] proposed two DT models for an assembly line to

    improve its throughput. A throughput improvement DT model was

    designed to analyze real-time status of the line and provide optimized

    schemes for improving the line throughput, while a throughput predic-

    tion DT model was developed to predict the future throughput with low

    model simplicity and high accuracy.


    Uhlemann et al. [15] explored the modeling method of the DT for a

    CPPS, mainly focusing on the concept. Collection and integration of

    multimodal data were discussed, and a concept for the realization of the

    CPPS by the DT was presented. Furthermore, they compared the tradi-

    tional value stream mapping using manual data with the DT combining

    real-time data to illustrate the advantages of the DT in production [16].


    Zhang et al. [17] discussed an architecture of DT-driven smart shop-

    floor, which included a physical shop-floor layer, network layer, data

    layer, cyber layer, and application layer. Then in the architecture, a

    dynamic resource allocation optimization method was designed to reduce

    the task completion time.


    Senington et al. [18] proposed a linked data approach to link raw data

    from machines to simulation models of the DT for the purposes of analysis

    and optimization of the manufacturing process. The authors believed

    that the proposed approach would play an important role in Industry 4.0,

    as it could support decentralized data storage and processing, modularity

    time.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'of software for smart factories, interoperability of heterogeneous data sources,
    and virtualization of factories.


    Leng et al. [19] presented a DT-driven manufacturing cyber–physical system (MCPS)
    for parallel control of shop-floors. By establishing cyber–physical connection
    via decentralized DT models, various manufacturing resources could be formed as
    a dynamic autonomous system to create personalized products. The framework, key
    technologies, and implementation of the MCPS were discussed, respectively.


    Vachálek et al. [20] optimized a physical production line based on the DT. As
    the DT collected real-time data from the actual production process, it could evaluate
    the production in real-time and satisfy the real-time requirements to simulation
    parameters. In addition, it has the ability to keep the actual process working
    as expected.


    Banerjee and coworkers [21] described a mechanism to extract and infer knowledge
    from large-scale production line data based on the DT, which enhances manufacturing
    process management with reasoning capabilities. As the DT integrates data from
    manufacturing, maintenance, operations, and operating environments, it could reflect
    the key behaviors of each asset, system, or process, thus providing intelligence
    for the mechanism.


    Weyer et al. [22] predicted that the DT would represent the next generation simulation,
    and it would play a critical role in developing CPPS. As the DT was characterized
    by the synchronization between physical and virtual spaces, it enables human operators
    to monitor the production process and to make timely adjustments. The methods
    about how to work with the DT were also discussed.


    Parrott and Warshaw [23] discussed the DT model of a manufacturing process from
    an integrated and holistic aspect and described the DT-enabled closed loop from
    physical space to virtual space and back to the physical space again.


    Ameri and Sabbagh [24] considered the DT as a digital factory that could represent
    the technological capabilities of manufacturing facilities. The authors described
    the creation method for the digital factory, including capability extraction,
    supply chain configuration, and factory digitalization, and applied it to a machine
    shop.


    Brenner and Hummel [25] reported that the DT would lead to a new paradigm of creating
    a digital shop-floor. They analyzed the hardware and software requirements for
    implementing the DT in the European School of Business (ESB) Logistics Learning
    Factory to realize smooth interactions among person, machine, and product.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Zhuang et al. [26] explored a DT-based smart production management and control
    framework for the complex product assembly shop- floor and discussed the related
    technologies. The proposed framework was applied to a satellite assembly shop-floor.


    Knapp et al. [27] developed a DT for the additive manufacturing process to predict
    cooling rate, temperature gradient, microhardness, velocity distribution, and
    solidification parameters. It was shown that the usage of the DT has led to more
    accurate predictions of cooling and melting rate than the level set method, volume
    of fluid, and heat conduction models on the basis of the finite element method
    (FEM).


    From these studies, it can be seen that as the DT offers a bridge to link the
    physical and virtual spaces together, it can make the virtual space mirror the
    physical practical situations in a timely manner and control behaviors of the
    physical objects in real-time. Based on these findings, the DT has the abilities
    to optimize and elevate the production process to a higher level of effectiveness
    and flexibility.


    # ## 2.1.3 Digital Twin in Service Stage


    In the service stage, PHM is a crucial step that is used to monitor the health
    of a product, perform diagnosis and prognosis, and provide design rules for maintenance
    strategies. However, traditional works on the PHM are primarily driven by the
    physical product and its data, with little connection to its virtual model, which
    affects the efficiency of the PHM. To change this situation, some researchers
    have introduced the DT into this field.


    Glaessgen and Stargel [28] introduced a DT-based prognosis method for future National
    Aeronautics and Space Administration (NASA) and U. S. Air Force vehicles, which
    could tightly combine historical data, fleet data, and sensor data to generate
    insights for fault prediction. It has the ability to improve conventional methods
    that are inadequate to meet the increasing needs for real-time monitoring and
    accurate prediction.


    Tuegel et al. [29] applied the DT to predicting the remaining structural life
    of an aircraft considering multiphysics modeling, multiscale damage modeling,
    integration of structural FEM and damage models, uncertainty quantification, big
    database manipulation, and high-resolution structural analysis. They claimed that
    the DT could enable better management of the aircraft service life.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Zakrajsek and Mall [30] built a DT model to predict the touchdown wear and
    the probability of failure for aircraft tires. It was shown that the DT model
    could demonstrate certain superiorities over the traditional models in predicting
    the probability of failure for the varying sink rate, yaw angle, and speed.


    Li et al. [31,32] built a DT model based on a dynamic Bayesian network for the
    diagnosis and prognosis of an aircraft wing fatigue crack growth. The method integrates
    physics models and various aleatory and epistemic uncertainty sources in crack
    growth prediction, and has produced accurate prediction results.


    Gockel et al. [33] discussed challenges for implementing an ultrarealistic and
    cradle-to-grave DT model for an airframe to forecast its structural life. They
    concluded seven technology gaps that need to be addressed in the future for realizing
    this envisioned process.


    Reifsnider and Majumdar [34] introduced a method to build high- fidelity DT models
    for fleet management. The method was superior to the traditional methods because
    it no longer requires damage initiations to perform the fault diagnosis and shows
    a high sensitivity to fracture development.


    Seshadri and Krishnamurthy [35] developed a damage characterization structural
    health management method for damage diagnostics and prognostics for aircraft structures.
    The method uses a genetic algorithm-based optimization procedure to predict damage
    location, size, and orientation and shows high efficiency and accuracy.


    Kraft and Kuntzagk [36] built DT models with three layers to support deterioration
    and failure analysis for engines, and to predict remaining life for their critical
    parts. The authors validated the method in CFM56-5C, a mature commercial two-spool
    high bypass engine installed on the Airbus A340-300 and the experiment results
    presented major improvements.


    Lee et al. [37,38] built twin models for manufacturing machines to integrate sensory
    data, record historical data, and manage hundreds of similar physical machines,
    to further assess machine conditions, identify the failure mode, and provide selfawareness
    and selfprediction through simulation.


    Tao et al. [39] explored a DT-driven PHM method for complex equipment. A five-dimension
    modeling method for the DT of the equipment was constructed, and then based on
    the model, a three-stage workflow was developed to guide the PHM activities. The
    method was finally validated on a wind turbine.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Bitterwolf et al. [40] trained and evaluated a supervised machine learning
    method based on the DT for the automated fault detection. The method was validated
    with a motor control model and could reduce costs associated with unnecessary
    maintenance or premature breakdowns.


    Motivated by the DT concept, Cerrone et al. [41] presented the as- manufactured
    geometry to predict crack paths on a material test specimen. A specimen DT was
    modeled and simulated in a commercial finite element software package to deal
    with the ambiguity problem of the crack paths.


    Magargle et al. [42] used a simulation-based DT combining with physics-based modeling
    techniques for heat monitoring and predictive maintenance for an automotive braking
    system. The method displayed immense superiority in collecting sensor information
    to train learning algorithms, which could contribute to accurate diagnosis of
    the controller in the system and failure detection of the tone ring, a speed sensor
    for wheel speed measurement.


    Liu et al. [43] proposed a system architecture of DT ecosystem, in which the DT
    fused multisource data, including historical information, technical data, maintenance
    report, manufacturing report, asset features, etc. to generate knowledge for the
    proactive maintenance, thus reducing costs and downtimes.


    Cai et al. [44] constructed a DT virtual machine based on sensor data integration
    and information fusion to help engineers conduct diagnosis and prognosis through
    checking the DT model when a machine breaks down.


    Hochhalter et al. [45] combined the DT with sensory materials to overcome shortcomings
    of traditional methods, which are overly dependent on the empirical data and hence
    could not respond to uncertainties in a timely manner. Using a nonstandard test
    specimen as an example, it was proven that the new approach could result in more
    accurate predictions of repair, inspection, and replacement.


    Gabor et al. [46] developed a DT-based architecture that includes four tiers:
    physical necessity, machine—environment interface, immediate reaction, and planned
    reaction, to predict the behaviors of CPS during its operation.


    Yun et al. [47] proposed a novel architecture of large-scale DT platform including
    distributed DT cooperation framework, flexible data- centric communication middleware,
    and a platform-based DT application to develop a reliable advanced driver assistance
    system.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'For these works, on one hand, the DT-based simulation can provide more insights
    for diagnosis and prognosis. On the other hand, abundant models and simulated
    data can be obtained and integrated with physical data to generate more comprehensive
    and valuable information for health condition detection and analysis. Therefore,
    combined with the DT, the PHM has the potential to be improved to achieve higher
    efficiency and accuracy.


    # ## 2.1.4 Digital Twin Across Multiple Stages


    In the PLM, due to different processes and characteristics, data from different
    stages are always isolated, fragmented, and stagnant, which hinders the efficient
    management of the entire lifecycle. As the DT can integrate data from the lifetime
    of a product seamlessly, it has been applied into the PLM by some researchers.


    Tuegel [48] proposed an airframe DT concept for airframe designing and maintenance,
    which can reduce model uncertainty with increasing service experience. As modeling
    of the DT is a core step in the method, some technical challenges in developing
    the DT model were discussed in detail.


    Tao et al. [49] put forward a DT-driven product design, manufacturing, and service
    method to support the product across its lifetime. The frameworks for the DT applications
    in the three stages were presented and further validated in bicycle design, drive
    shaft manufacturing, and power transformer service, respectively. Tao et al. [50]
    also explored potential applications of the DT in different stages across the
    product lifetime.


    Liau et al. [51] introduced the DT into the injection molding industry, including
    mold design, mold making, and the injection molding process. The DT helped the
    entire injection molding process move toward real-time process optimization, process
    monitoring, and prediction of quality defects through building a closed loop between
    physical and virtual spaces.


    Söderberg et al. [52] developed a DT to secure good geometrical quality in final
