    validated in the VS before execution. The VS will feed back strategies to modify
    and optimize the services until they can fully pass the validation. Whereas, the
    SSS provides services to ensure the high fidelity of the VS through parameter
    calibration to sustain its performance with the PS, which makes the VS optimized
    continuously during its running to provide more accurate simulation results.


    +   3. *Iterative optimization between PS and VS.* The PS constantly generates
    real-time data, and transmits them to the VS to update the status of the corresponding
    models. At the same time, the VS can feed back real-time control orders to trim
    and optimize the actual operations in the PS iteratively.


    # 4.6 KEY TECHNOLOGIES FOR DIGITAL TWIN SHOP-FLOOR


    As shown in Fig. 4.10, the key technologies for implementing DTS are summarized
    as follows [5].


    +   1. *Interconnection and interaction in PS.* Related technologies include the
    perception and access, communication protocol analysis, data encapsulation and
    publication, multiagent technology, etc.


    +   2. *Modeling, operation, and verification of VS.* Technologies including high-fidelity
    modeling, model integration and model verification, etc. need to be addressed.'
