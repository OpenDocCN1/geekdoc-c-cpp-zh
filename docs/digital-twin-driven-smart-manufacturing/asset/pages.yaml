  md: '# 4.4.4 Shop-Floor Digital Twin Data


    SDTD mainly consists of PS data, VS data, SSS data, and fused data of the three
    parts, as well as knowledge for modeling, data processing, and standards. The
    PS data mainly include production resource data, production process data, environment
    data, etc. The PS data are directly generated by entities in the physical space
    without further processing and considered as physical data. The VS data refer
    to model parameters and data of simulation, evaluation, optimization, and prediction,
    while the SSS data mainly involve data of various services. The latter two types
    of data are generated from the virtual space and defined as virtual data. The
    fused data are the integration and fusion of the physical and virtual data through
    data comparison, association, combination, and clustering. For example, for a
    tool, wear data from the physical space can be combined with both the simulated
    data about stress, deformation, and strength, and service data about maintenance
    records from the virtual space to form the fused data. It presents a tool correlating
    both the physical and virtual information, providing a more consistent, accurate,
    and comprehensive representation compared with the data from a single aspect.


    The construction of SDTD is described as shown in Fig. 4.9 [6]. First, data from
    PS, VS, and SSS with various formats, types, structures, and encapsulations are
    transformed into a unified form. Second, the data are cleaned to remove the “dirty”
    data (e.g., errors, duplicate data, invalid data) and replenish the missing data
    through clustering, regression, and filtering. The related data can be associated
    and combined based on certain rules. Third, to achieve consistent and comprehensive
    interpretation, the physical data and the virtual data can be converged to form
    the fused data through data fusion algorithms, such as Kalman filter, neural network,
    and Bayesian inference.


