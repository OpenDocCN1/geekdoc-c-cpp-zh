    # 7.4 CASE STUDY


    # 7.4.1 Problem Description


    A WT is complex equipment that transforms wind energy to mechanical and electrical
    energy. Since the WT usually works over decades and its working conditions are
    characterized by stochastic loading, rapidly varying torque, and a dusty environment,
    most components may fail and the failure rates are shown in Table 7.1 [31]. Hence,
    PHM is crucial to keep the WT operating reliably. However, some problems still
    exist as follows. Because of the harsh environment, it is not practical to access
    the WT all the time for prognosis and maintenance. The features extracted from
    the physical aspects are mainly used for fault cause identification or prediction,
    but features from the virtual side are ignored. Since signals from the physical
    aspect (e.g., the vibration signals) are easily interfered with by other sources,
    the diagnostic results can be affected [27]. To address the above issues, the
    DT-driven PHM is applied in the case study.


    The gearbox and the yaw system are among the top three components that are prone
    to malfunctioning. The gearbox is used to transform the low speed drive from the
    wind power into high speed for the generator, and its failures are mainly caused
    by the gradual degradation of gears in it. The yaw system can align the nacelle
    with the wind direction to make the WT obtain the maximum wind energy. Failures
    of the yaw system


