  md: '# CHAPTER 1


    # Background and Concept of Digital Twin


    With the developments of new generation information technologies (New IT), such
    as cloud computing, Internet of the Industrial Internet, manufacturing based on
    cyber-physical system(CPS), and Made in China 2025. It is clear that achieving
    cyber-physical fusion is a crucial step for the implementation of smart manufacturing.
    Although CPS provides the framework and mechanism for seamless interaction between
    physical and cyber components, it mainly belongs to the academic category and
    focuses on the verification of scientific principles rather than the practical
    optimization of engineering applications. Therefore, digital twin (DT) is introduced
    as a pragmatic way for cyber-physical fusion. In this chapter, the background
    and history of DT are introduced. The different understandings of the DT concept
    from researchers in academia and practitioners in industry are next reviewed.
    Some concepts related to DT are also introduced to provide a deeper insight. Finally,
    the potential benefits of DT are concluded.


    # 1.1 BACKGROUND OF THE DEVELOPMENT OF DIGITAL TWIN


    In the past, physical space played the main role in industry. In those days, physical
    assets close in distance were organized by humans to handle design and manufacturing
    tasks. However, due to limited personal capabilities and geographical constraints,
    high efficiency was hard to achieve. Until the 20th century, technologies such
    as computers, simulation tools, the Internet, and wireless networks have helped
    to create a parallel virtual space that could virtualize physical assets, organize
    them with the aid of computing facilities, and enable the cooperation with assets
    remotely. This has provided a possibility to conduct plans and operations more'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'efficiently and effectively. Nowadays, along with the developments of new generation
    information technologies (New IT), such as cloud computing, the Internet of Things
    (IoT), big data, and artificial intelligence (AI), the roles of the virtual space
    are becoming increasingly important and interactions between the physical and
    virtual spaces are more active than ever before. Therefore, seamless integration
    and fusion between the two spaces will be an inevitable trend, which will create
    a new potential to improve the current situations and technologies in the fields
    of design, manufacturing, service, etc.


    Various countries are converging on this trend as the next industrial revolution
    and have proposed related national strategies, such as Industry 4.0, the Industrial
    Internet, and Made in China 2025. Although the strategies are proposed under different
    environments, their common objective is to capture the great opportunity brought
    by the seamless integration and fusion of the physical and virtual spaces for
    improving the national industry. As cyber-physical system (CPS) is an architecture
    to converge the physical and virtual spaces, they have attracted a large amount
    of attention from industrialists, researchers, and practitioners in recent years.
    CPS aims at embedding communication and computing capacities into physical assets
    to allow the physical space to be monitored, coordinated, and controlled by the
    virtual side in real-time to realize a seamless coupling. Many systems related
    to CPS have emerged rapidly in different fields, such as the cyber-physical production
    system (CPPS) [1], cloud-based CPS [2], cyber-physical-social system [3], and
    CPS-based smart agent system [4]. Just as the Internet has transformed how humans
    interact with each other through interconnecting computer networks, CPS will transform
    how humans interact with entities through integrating the physical and virtual
    spaces [5].


    Although CPS provides the framework and mechanism for the integration between
    physical and virtual spaces, it is mainly conceptual aiming at inspiring new scientific
    foundations and technologies, rather than practical solutions to directly guide
    the development of engineered systems. As digital twin (DT) is a focused application
    of the CPS and provides more practical values and implementation details, it is
    introduced as a pragmatic way for seamless integration and fusion. With respect
    to the DT, for each physical object, there exists a virtual mirror model with
    abilities of analyzing, evaluating, optimizing and predicting, etc. The two parts
    interact with each other and remain synchronous in forming a closed loop. In addition,
    data from both the physical and virtual sides can be'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'obtained and fused to generate more comprehensive information. In fact, the
    DT can be considered as a paradigm of CPS, as it consists of the most important
    components of CPS (i.e., the physical object, the virtual counterpart, and the
    connection of the two parts) and becomes more concrete. To date, an increasing
    number of organizations and companies are aware of the values of the DT, investing
    a large amount of resources into relevant research and deployment. In future,
    greater capabilities of the DT will be explored and it will play a growing role
    in industry for the integration and fusion between the physical and virtual spaces.


    # ## 1.2 HISTORY OF DIGITAL TWIN


    The concept of “twin” was generated from NASA’s Apollo program, which built two
    real identical space vehicles. One of them was launched into the air space to
    perform the mission, while the other stayed on Earth, allowing engineers to mirror
    the conditions of the launched one [6]. According to the Whitepaper written by
    Grieves [7], the DT was first proposed at his executive course on product lifecycle
    management (PLM). With technical improvements, the DT was introduced into the
    aerospace industry by National Aeronautics and Space Administration (NASA) and
    U.S. Air Force [8]. Accordingly, the space vehicle remaining on Earth could be
    replaced by a digital mirror model to provide more insights through high-fidelity
    simulation. Nowadays, the DT has been applied to more fields and has become a
    much pursued topic.


    As shown in Fig. 1.1, the short development history of DT can be divided into
    three stages.


    In the first stage, the concept of DT was proposed by Grieves in 2003 according
    to the Whitepaper written by him [7]. It was defined in three dimensions, including
    a physical entity, a digital counterpart, and a connection that ties the two parts
    together [7]. In 2005, Grieves put forward


    ![](img/5042607b423be4a5ee3f15dae22cc5bb_10_0.png)'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'another idea that the DT could be classified into three subtypes, including
    DT prototype, DT instance, and DT aggregate [9]. However, due to technical and
    cognitive limitations, there were very few related reports in the following 5
    years. Fortunately, during this period, the New IT has emerged and developed,
    which laid the foundations for the future development of the DT.


    In 2010, NASA illustrated the definition and function of DT for space vehicles
    in detail in the _Draft Modeling, Simulation, Information Technology and Processing
    Roadmap_ [10]. In 2011, the U.S. Air Force explored the application of DT in the
    structural health management of aircrafts [11]. In 2012, NASA and the U.S. Air
    Force jointly published a paper about the DT, which stated the DT was the key
    technology for future vehicles [8]. After that, the number of research studies
    on the DT in aerospace has increased steadily. For example, Tuegel proposed the
    Airframe DT for design and maintenance, and discussed the challenges for its development
    [12]. Allaire et al. researched a dynamic data-driven application system, which
    was described as the implementation foundation of the DT for aerospace vehicles
    [13]. Reifsnider and Majumdar presented a multidisciplinary physics-based methodology
    for the DT in fleet management [14].


    In 2014, the Whitepaper [7] on DT was published and the three-dimensional structure
    of DT was widely publicized. Subsequently, the DT was introduced into more fields
    beyond the aerospace industry, such as automotive [15], oil and gas [16], and
    healthcare and medicine [17]. In recent years, many established organizations
    have attached great importance to the DT. Both in 2017 and 2018, Gartner regarded
    the DT as one of the top 10 most promising technological trends in the next decade
    [18,19]. In 2017, Lockheed Martin Space Systems Company listed the DT as the top
    of six prominent technologies for future defense and aerospace [20]. Smart Manufacturing
    Association of China Association for Science and Technology stated that the DT
    was one of the top 10 scientific and technological advances for smart manufacturing
    in the world [21]. Based on the current trend, it can be expected that the DT
    will experience a rapid development in the next few years.


    In China, the DT has attracted wide attention. The authors of this book published
    the first paper on digital twin shop-floor (DTS) [22] in January 2017 in the _Chinese
    Journal of Computer Integrated Manufacturing Systems_, and further explored the
    key technologies, mechanisms, implementation methods, cyber–physical fusion, etc.,
    for the DTS [23,24]. They also published a paper [25] to discuss the DT-driven
    product design, manufacturing, and'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'service in PLM, which was first online in March 2017 in the _International
    Journal of Advanced Manufacturing Technology_. Then in July 2017, the first conference
    on “Digital Twin and Smart Manufacturing Services” was held at Beihang University,
    Beijing, China. Over 70 experts and scholars from more than 20 universities in
    China have participated. Based on discussions at the conference, the participants
    afterwards published a paper “Digital twin and its potential application exploration”
    [26] together in the _Chinese Journal of Computer Integrated Manufacturing Systems_,
    which has generated wide public interest in China. The second conference, which
