    # ## 2.1.5 Observations


    Based on the above papers, the following observations are obtained:


    # ### 2.1.5.1 Production and PHM Are the Most Popular Applied Fields for the DT


    As shown in Fig. 2.2, papers on the production and service (mainly referring to
    PHM) stages account for the largest proportion, while papers on the design stage
    are relatively few. It is clear that production and PHM are the most popular applied
    fields for the DT. There are two reasons to explain the phenomenon.


    ![](img/5042607b423be4a5ee3f15dae22cc5bb_44_0.png)'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'First, for PHM, as it was the earliest field in which the DT was applied, related
    works and technologies have been developed over a longer period of time and some
    exciting results have been obtained, which has inspired more researchers to work
    in the field. Besides, as NASA and the U.S. Air Force have introduced the DT into
    the PHM for future aircrafts, the DT is considered as one of the most promising
    technologies in the field, and thereby has attracted a lot of attention. However,
    current research on the PHM still has some limitations. For example, the application
    areas mainly focus on high-value equipment because of the DT’s high costs. There
    will be broader applications as DT technology matures.


    Second, for production, as the era of smart manufacturing is coming, many researchers
    are concentrating on how to realize smart operations in the production process.
    As the DT has the ability to bridge physical and virtual spaces seamlessly and
    maintain the two spaces consistently and synchronously, it shows a great potential
    in real-time process control and optimization, as well as accurate prediction.
    Hence, researchers focusing on production feel excited about the DT and have been
    making efforts to deploy it in their research. In the future, with the advancement
    of technologies and infrastructures in factories, the DT will be further popularized
    and adopted in production.


    # ## 2.1.5.2 DT Has Attracted the Most Attention in the United States, China,
    and Europe


    In Fig. 2.3, the first authors of DT related papers from different countries are
    cited. It can be seen that authors from the United States, China, and Europe represent
    the largest proportion. This observation can be explained as follows.


    The United States, China, and Europe are the world powerhouses in manufacturing.
    They have proposed strategies at their respective national levels, including Industrial
    Internet, CPS or CyberManufacturing, Made in China 2025, and Industry 4.0, to
    encourage and support related researchers and practitioners to explore implementation
    ways of smart manufacturing. As the DT appears as a pragmatic technology for seamless
    cyber–physical fusion, which is the core of future manufacturing, researchers
    in the United States, China, and Europe have enthusiastically placed great emphasis
    on DT-related studies ahead of other countries. They are currently in the leading
    position in DT literature.'
