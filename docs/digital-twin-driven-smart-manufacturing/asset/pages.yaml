- pgno: 58
  md: '# ## 2.3 FUTURE MARKET FOR DIGITAL TWIN


    As DT represents the next surge of digitalization and can be considered as the
    bridge between physical and virtual spaces in Industry 4.0, it has promising commercial
    prospects in the future. Some organizations have conducted market research for
    it and provided related data support. Gartner predicted that “by 2021, half of
    the large industrial companies would use DTs which would result in a 10% improvement
    in effectiveness for those organizations” [100]. “Markets and Markets” reported
    that “the DT market was valued at USD1.82 billion in 2016 and is expected to reach
    USD15.66 billion by 2023, at a compound annual growth rate (CAGR) of 37.87% during
    the forecast period” [101]. International Data Corporation (IDC) predicted that
    “by 2020, 30% of G2000 companies would be using data from DTs of IoT-connected
    products and assets to improve product innovation success rates and organizational
    productivity, achieving gains of up to 25%” [102]. “Global market insights” pointed
    out that “as the DT can offer a virtual outlook of any product, at any stage of
    lifetime, it is expected to be adopted at a significant rate over the forecast
    period” [103].


    The DT market will cover increasingly more fields in the future and penetrate
    every aspect of society, involving education, transportation, environment, healthcare,
    food, etc. Hence, companies in various domains have chances to gain benefits from
    the DT. They can combine the DT with their products to complete product upgrading,
    and provide better services for customers. The DT can also be applied to company
    management for better operation through optimizing businesses, conserving energy,
    reducing time to market, sparking innovation, etc. In each respect, the DT can
    bring huge economic benefits for the companies and further raise their competition
    capability.


    From the above analysis and data, the authors believe that the DT market will
    be promising in the coming years and companies that follow the DT trend in a timely
    fashion can seize the opportunity for rapid development in their fields and reach
    a favorable position in the market.


    # ## 2.4 CHALLENGES OF DIGITAL TWIN APPLICATIONS


    Challenges of DT applications are summarized in the following seven aspects.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'First, as the DT is an emerging technology, most people lack a comprehensive
    understanding and cannot identify its values clearly, which leads to an oversight
    of the DT. Second, due to psychological and cultural boundaries, people may be
    limited by old stereotypes and prefer to stay in comfort zones with familiar ways
    than to be challenged by new approaches. Third, considering the differences in
    technical levels of operators, some of them do not have sufficient skills (e.g.,
    modeling, simulation and data fusion) to work with the DT.


    # 2.4.2 Technology and Infrastructure


    To realize DT applications, many technologies will be involved, such as high-fidelity
    modeling and simulation, real-time data collection and fusion, flexible data architecture
    construction, continuous two-way interaction, etc. Some of the technologies have
    not yet been fully developed and related commercial products are lacking, which
    has put up barriers to the popularization and application of the DT. In addition,
    infrastructure (e.g., Internet connectivity, broadband speed, and sensor performance)
    also need to be improved to serve the corresponding technologies efficiently.


    # 2.4.3 Support Tools


    Although many researchers and practitioners feel excited about the DT, when it
    comes to DT applications, they are not clear about related support tools. Although
    some big companies (e.g., Siemens, PTC and GE, Microsoft) have launched their
    respective software and hardware to support the DT applications, these tools are
    still fragmented and isolated, and have not been adopted widely. Hence, for users,
    a set of integrated and universal tools are urgently needed.


    # 2.4.4 Standards and Specifications


    For DT applications, there is a lack of standard specifications, which should
    be jointly developed by related researchers, suppliers, and users and should formally
    describe the standards for models, interfaces, protocols, data, etc. For example,
    heterogeneous data from different sources need to be involved and processed, but
    as a standardized format for the data is lacking, it is difficult to complete
    the data exchange, integration, and fusion to further feed the DT with valuable
    information.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# ## 2.4.5 Cost Control and Management


    At present, constructing a complete DT is a costly project. On the one side, building
    high-fidelity models to precisely and thoroughly simulate entities or processes
    will be a time-consuming and labor-intensive process. On the other side, realizing
    real-time collection and processing for a large amount of data needs the support
    of high-performance hardware and software. Therefore, in most situations, the
    DT will play an important role in the management of high-value, major products,
    equipment, or processes. For users, before deploying the DT, taking full consideration
    of the balance between costs and benefits brought by the DT is necessary but challenging.


    # ## 2.4.6 Cyber Security and Intellectual Property Rights


    Assets and businesses of enterprises can be digitalized and virtualized via the
    DT. Hence, cyber security is important to protect sensitive information and ensure
    the success of DT applications. Ample measures must be taken to ensure security,
    including improving security systems to deal with emerging threats, protecting
    networked systems in production and office space, and resisting malicious attacks
    on sensory devices. In addition, with developments of the DT, a set of innovative
    invention patents will be generated predictably. To establish a fair and orderly
    investment environment and market for the DT, protecting intellectual property
    rights efficiently is mandatory but challenging.


    # ## 2.4.7 Insufficient Development of Digital Twin


    As the DT is an emerging technology with a short history, it is still in the infant
    stage and has many issues, such as confusion in concepts, insufficiency in tools
    and technologies, and shortage of talents, which bring difficulties to the DT
    applications. In addition, as a new technology, the DT has uncertainties in its
    future development and may bring risks in multiple aspects, such as products,
    markets, businesses, investments, etc. The insufficient development of DT has
    thus far hindered its progress to some extent.


    # ## 2.5 SUMMARY


    This chapter reviews the DT applications from both academic and industrial perspectives.
    The conclusion can be drawn easily that the DT can be'
  merge: -1
  img_proc: true
