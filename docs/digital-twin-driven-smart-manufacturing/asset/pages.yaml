    For the above studies, the immersive virtual environment enabled by the VR technology
    can plan, inspect, simulate, optimize, and validate the activities in design,
    manufacturing, and service before actual execution. However, as VR provides a
    completely virtual environment, the users are isolated from the familiar physical
    environment and do not have a realistic experience, which decreases the fidelity
    and credibility of the constructed scenes [42]. Building a completely virtual
    environment also imposes a heavy burden on modeling and computation processes,
    and presents challenges to real-time performance. Given the aforesaid shortcomings
    of VR, AR is thus introduced into design, manufacturing, and service.


    # 11.3 AR IN DESIGN, MANUFACTURING, AND SERVICE


    AR (including MR) contains a set of innovative techniques (e.g., real-time data
    acquisition, human–computer interaction, scene capture, real-time tracking and
    registration, etc.), and can augment the view of the physical world by embedding
    computer-generated elements or objects [10,42]. It enables people to work in a
    physical environment that is fed with valuable and abundant virtual information
    and models. In this way, the high cost of constructing a fully virtual environment
    can be reduced, and users are allowed to interact with both the physical and virtual
    objects in an intuitive and natural manner [42]. To date, AR has been widely researched
    in the design, manufacturing, and service fields.'
