    integrates both the physical and virtual elements to perform assembly activities.
    In this way, the assembly process can be optimized through making full use of
    physical and virtual elements to improve the planning, guidance, and training.


    # 11.7 SUMMARY


    In this chapter, VR and AR (including MR) are applied in the DT to enhance the
    fusion of the physical and virtual worlds, thus further improving the efficiency
    of the DT. The applications of VR and AR in design, manufacturing, and service
    are introduced, and the differences and similarities of these technologies are
    compared from multiple aspects. Based on the existing and potential applications
    of VR and AR in the DT, a general framework is proposed to efficiently integrate
    these technologies into the five-dimension DT to provide users with more interactive
    and immersive services. Based on this framework, an assembly process is discussed.
    Given the benefits brought by VR and AR, combining with these technologies will
    be a prevalent and beneficial trend for the DT.


