- pgno: 124
  md: '*Multilevel and multistage analysis.* Considering the costs of sensory devices,
    it is impractical to deploy many sensors on the physical machine tool to collect
    all the EC data at multiple levels (e.g., part level, subsystem level, and entire
    machine level) and multiple stages (e.g., machining stage, idle stage, and overload
    stage). Hence, soft sensing has been introduced by some researchers [21]. In the
    EECM, large quantities of models and data from both the physical and virtual spaces
    can be obtained, so that clearer relations between the EC data and related parameters
    can be captured. Therefore, it becomes achievable to build more accurate soft
    sensing models to calculate the EC at multiple levels and stages, thus reducing
    high costs from installation and maintenance of the physical sensory devices.


    *Behavior analysis.* The machine tool behavior (e.g., normal, overload, failure)
    can be analyzed through fusing features from both the physical and virtual machine
    tools. From the physical aspect, the features can be extracted from the EC data
    and related parameters in the time domain or frequency domain. From the virtual
    aspect, features can be extracted from further analysis and prediction. As the
    features can be obtained from both the physical and virtual machine tools, the
    behavior analysis can be conducted in a more comprehensive way.


    *Statistical analysis.* It is often necessary to obtain the EC analysis results
    with statistical significance. As the virtual machine tool operates in the cyber
    environment with no costs or limits, large amounts of accurate simulated data
    can be obtained to satisfy the data quantity requirements.


    # 5.4.3 Advantages in Energy Consumption Optimization


    In EC optimization, based on the proposed EECM framework, parameter optimization,
    scheduling optimization, and machine tool upgrading are introduced.


    Parameter optimization is a complex optimization problem that not only aims at
    minimizing the machine tool EC, but also considers a set of constraints, such
    as the product quality, productivity, delivery time, etc. Searching for the optimal
    solution to this problem is always difficult with mathematical modeling. However,
    as the virtual machine tool provides a digital mirror in high fidelity with the
    physical one, the optimization can be performed in the cyber environment through
    parameter testing and modifying. In addition, as the virtual machine tool records
    the operations of the physical machine tool, the historical parameter settings
    under the same condition can be used as references.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Scheduling optimization. During production, task completion time of the physical
    machine tool can be accurately predicted by the virtual counterpart. Based on
    the predicted time, scheduling of the physical machine in the subsequent time
    can be adjusted in advance, thus shortening the machine idle time to reduce the
    EC generated in the idle period.


    Machine tool upgrading. In the proposed EECM, interactions between the designer
    and the physical machine tool can be enabled during the machine upgrading process.
    First, based on the real-time data collected from the physical side, the virtual
    machine tool that can analyze and reflect the actual EC performance of the physical
    one can be provided through the Internet to the designer, who will be encouraged
    to generate new design ideas to pursue lower EC. Then the ideas can be fed back
    to the virtual machine tool to reflect the expected performances from the designer.
    Deviation between the actual and expected performances can be analyzed through
    comparison, and the corresponding upgrading strategies can be generated and validated
    by the virtual machine tool. Finally, the validated strategies will be performed
    on the physical machine tool to realize the upgrade.


    # 5.5 SUMMARY


    The proposed EECM is an effective way to reduce the EC and improve energy efficiency
    of the equipment. With the developments of DT and DTS, the data and models are
    enriched greatly, which provides possibilities to improve and optimize the EECM
    on the shop-floor. In this context, this chapter has explored the application
    of EECM in DTS and discusses the framework, implementation methods, and potential
    advantages in detail. Future works will concentrate on the following aspects [2]:


    +   - further perfection of the models,

    - multisource data fusion and management,

    - EECM system establishment in DTS.


