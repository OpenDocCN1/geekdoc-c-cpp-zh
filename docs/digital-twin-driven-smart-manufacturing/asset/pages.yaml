    an inevitable trend. Achieving the interaction and integration of the physical
    space and the virtual space of manufacturing through using state-of-the-art technologies,
    constitutes an important prerequisite for implementing smart manufacturing. To
    this end, DT is the preferred technology. The DT can be applied to the entire
    manufacturing process, the entire supply chain, and the entire product lifecycle.
    Depending on the scope of resource allocation, the DT can be stratified to the
    unit level, system level, and SoS level. Because the data generated in different
    levels have different requirements at time scales, edge computing, fog computing,
    and cloud computing offer ideal technical solutions for different levels of cyber-physical
    systems (CPSs) and DTs. The cooperation among edge computing, fog computing, and
    cloud computing can better meet the requirements of each level of the DT [16].


