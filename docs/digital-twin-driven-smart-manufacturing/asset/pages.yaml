    # 5.4.1 Advantages in Energy Consumption Monitoring


    EC monitoring can be performed in two ways: real-time to historical monitoring,
    and physical to virtual monitoring. In this way, both gradual and abrupt changes
    in the EC can be detected accurately.


    Real-time to historical monitoring compares the real-time EC data collected from
    the physical machine tool with the historical data that have been recorded in
    the virtual machine tool. Since the EC may increase gradually with time due to
    the degradation of machine tool components (e.g., wear, corrosion, and misalignment),
    the monitoring can reflect the increase of the EC, and can thus present the current
    states of the machine. Based on the proposed EECM framework, as the historical
    data can be corrected through fusing historical sensory data from the physical
    machine tool and simulated data from the virtual machine tool, they will be more
    accurate than the initial historical data, thus supporting more precise monitoring.


    Physical to virtual monitoring compares the actual EC from the physical machine
    tool with the simulated EC from the virtual machine tool. In a normal situation,
    as working conditions of the physical and virtual machine tools are set as the
    same, data from the two parts are always consistent. However, inconsistency may
    appear when some sudden disturbances from the physical world (e.g., power grid
    fluctuation, power leakage, and short circuit) occur. In this situation, data
    from the virtual machine tool will be taken as the reference to detect the abrupt
    change of the EC in the physical machine tool. As the virtual machine tool evolves
    simultaneously with the physical one, the reference data are also updated with
    time, which makes the monitoring of EC changes more accurate, compared with the
    traditional EC monitoring method using static references.


    # 5.4.2 Advantages in Energy Consumption Analysis


    In the proposed EECM framework, as data from both the physical and virtual machine
    tools are available, the EC analysis can be fed with sufficient data sources,
    which enables high-quality analysis. Its advantages in this aspect are introduced
    mainly in multilevel and multistage analysis, behavior analysis, and statistical
    analysis.'
