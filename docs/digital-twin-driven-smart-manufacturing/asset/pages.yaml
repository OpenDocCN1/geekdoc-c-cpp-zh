  md: '# CHAPTER 7


    # Digital Twin-Driven Prognostics and Health Management


    Prognostics and health management (PHM) is critical to improve reliability and
    decrease downtime cost for complex equipment working in harsh environments. With
    the development of cyber–physical system (CPS), realizing cyber–physical fusion
    to optimize traditional PHM is an important breakthrough. In this chapter, digital
    twin (DT), an emerging technology for cyber–physical fusion, is introduced to
    improve the efficiency and reliability of PHM. A five-dimension DT is constructed
    to emulate physical equipment thoroughly with high fidelity. Based on the constructed
    DT, a PHM method consisting of the framework, procedure, and coevolution mechanism
    that makes efficient use of digital mirroring, continuous interactions, and fused
    data in DT is presented in detail. The proposed method is applied to the yaw system
    and the gearbox of a wind turbine (WT).


    # 7.1 INTRODUCTION


    Complex equipment, such as aircrafts, ships, and wind turbines, usually work over
    decades in harsh environments that are full of randomness and uncertainty [1].
    Hence, degradation and failure of the equipment are inevitable during the operation,
    which leads to downtimes, increased maintenance costs, and postponement of tasks.
    To address these problems, prognostics and health management (PHM) is introduced
    as an effective way to support the reliable operation of complex equipment [27].


    PHM is developed based on maintenance methodologies and diagnostic techniques
    [2]. The earliest maintenance practice is breakdown maintenance, which replaces
    or repairs failed components when the equipment appears to have obvious malfunctions.
    As this type of maintenance is unplanned, it always upsets the initial plan and
    affects the completion time of the task. To improve this situation, scheduled
    maintenance or planned maintenance is introduced. It can be preplanned according
    to the experts’ recommendations and periodically performed to keep the'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'equipment in good condition through cleaning, maintaining, repairing, calibrating,
    and inspecting. But as this maintenance is carried out based on predefined intervals,
    it lacks flexibility and cannot deal with unexpected failures. More recently,
    condition-based maintenance can analyze the equipment conditions in real-time
    and acts only when the maintenance is actually needed. It can detect and eliminate
    both the expected and unexpected faults efficiently in time, and thus decreases
    the maintenance cost. PHM has evolved from condition-based maintenance, and now
    has become a more integrated and mature approach that enables health management
    related to the lifecycle of the equipment [2,3].


    Generally, PHM can be classified into three stages, as shown in Fig. 7.1, including
    observation, analysis, and decision [4]. In the observation stage, real-time data
    from the complex equipment need to be collected and processed. The real-time data
    are then compared with expected values in the analysis stage to monitor the current
    health conditions of the equipment. When the equipment has degraded, prognosis
    and diagnosis are performed to isolate and identify the fault cause, and predict
    the remaining useful life (RUL). According to the analysis results, while considering
    constraints on different aspects, the decision creates maintenance strategies
    that are presented to persons through the human–machine interface and conducted
    to ensure the equipment can complete the task.


    Related works on these three stages are reviewed as follows:


    ![](img/5042607b423be4a5ee3f15dae22cc5bb_144_0.png)


    Figure 7.1 The process of PHM for complex equipment.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '+   1. In the observation, sensory devices such as current sensors, torque
    transducers, and force sensors [5–7] are mounted on the equipment for ubiquitous
    data collection. Based on the collected data, the conditions of the equipment
    can be estimated through signals in the time domain [8], frequency domain [9],
    and time–frequency domain [10].

    2. In the analysis, there are three main methods: data-driven, model-based, and
    hybrid methods [2]. The data-driven method trains the diagnostic or prognostic
    models based on features directly extracted from the collected data and neglects
    the complex internal relations among various variables [11]. The model-based method
    aims at building precise mathematical models to present the physical processes
    based on the fundamental understanding of the equipment [12]. The hybrid method
    is the combination of the above two methods and its function can be enhanced through
    learning from the two sides [13].

    3. In the decision, according to the analysis results, maintenance plans are generated
    to decide the maintenance time, tools and technicians, etc., considering constraints
    such as the maintenance cost, spare part inventory, and equipment reliability
    [14,15]. In addition, human–machine interfaces can provide valuable information
    in various virtual forms [2].


    The above works explore the methods in different stages for the PHM. In recent
    years, more researchers have made an effort to improve the PHM with the new generation
    information technologies (New IT). Deutsch and He used a deep learning-based approach
    to predict RUL of rotating components with big data on vibration signals, which
    enabled automatic feature extraction and RUL prediction without human intervention
    [16]. Gao et al. discussed the cloud-enabled prognosis in manufacturing, where
    data across the manufacturing hierarchy are integrated in the cloud environment
    to improve efficiency [17]. Combining with a cloud platform and the Internet of
    Things (IoT), a remote monitoring system for a motor was built, providing on-demand
    monitoring services and allowing quick and accurate decision making [18]. Zaluski
    et al. developed a data mining-based prognostic model for C-18 aircraft driven
    by a variety of data, such as the flight data from sensors, built-in test equipment
    data, and maintenance data [19]. Nabati and Thoben studied the characteristics
    of data collected from offshore wind turbines to decide whether these data were
    suitable to be used in big data analytics for maintenance of the turbines [20].
    An IoT-embedded cloud architecture was built by Lee to detect and analyze manufacturing
    equipment status considering overall manufacturing processes [21].'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'Existing works have contributed much to PHM. However, there is a common deficiency
    for most of them as they are primarily driven by the equipment in its physical
    space, with little connection to its virtual model, which affects the efficiency
    and reliability of PHM. Currently, with the development of cyber–physical system
    (CPS), attaching importance to the virtual space and implementing the seamless
    cyber–physical fusion to improve PHM are inevitable trends. Therefore, some researchers
    have tried to introduce digital mirrors of the equipment from the virtual space
    to work with the real entities to better support PHM. For example, Lee et al.
    proposed to build a digital twin model that managed hundreds of similar physical
    equipment with integrated data from multiple sources, to assess the equipment
    condition and identify the failure mode through simulation [22,23]. Liu and Xu
    investigated the concept of a cyber–physical machine tool (CPMT), which integrates
    the machine tool with its cyber twin that has the ability to transform the data
    into valuable information for PHM [24]. Zinnikus et al. presented a framework
    for the fault analysis of a cyber–physical production system, which compares the
    observations of the physical equipment with the behaviors of the models for anomaly
    detection and fault diagnosis [25]. Penna et al. proposed a visualization tool
    for a cyber–physical maintenance environment, which relates the physical elements
    with virtual ones and makes remote access possible via a web browser [26].


    Although these works have attempted to introduce the digital models of complex
    equipment into PHM, to implement PHM driven by both physical and virtual spaces,
    some common problems still exist. They include (1) how to build the models to
    describe the complex equipment thoroughly and accurately, (2) how to establish
    the interaction mechanism between the equipment and its digital mirror model to
    make them evolve jointly and support PHM together, and (3) how to fuse the data
    from both physical and virtual spaces and generate valuable information for PHM.
    However, few studies have been focused on these problems [27].


    As DT has the potential to realize cyber–physical fusion, this chapter proposes
    a DT-driven PHM method. First, the DT for the complex equipment is built, including
    the physical equipment (PE), virtual equipment (VE), services (Ss), connection
    (CN), and DT data (DD). Second, the DT-driven PHM method, including the framework,
    the three-stage procedure, and the coevolution mechanism is explored. The framework
    defines the inputs, outputs, and roles of the DT in the proposed method; then
    the procedure is designed to deal with two types of faults (the'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'gradual fault and abrupt fault) with different workflows; and the coevolution
    mechanism illustrates the evolution process for different parts in the DT during
    PHM. Finally, to verify the efficiency and advantages of the proposed DT modeling
    and DT-driven PHM methods, the yaw system and the gearbox of a wind turbine (WT)
    are taken as examples in the case study. Based on the DT, the above three common
    problems existing in the current work of PHM can be solved as follows: (1) According
    to the construction of the DT, a five-dimension DT for the equipment can be built,
    which describes the real equipment in multiple aspects and provides access to
    the equipment even out of physical proximity. (2) Utilizing the interaction mechanism
    in the DT, the difference between the physical equipment and the digital mirror
    can be used to detect the disturbances from the external environment, potential
    faults in the equipment, and defects in the virtual models. It is a coupled optimization
    for both the equipment and its digital mirror to better serve PHM. (3) Since the
    DT generates data from the equipment, the digital mirror, and the fused data,
    data for PHM activities (e.g., condition assessment, feature extraction, and prognostics)
    are enriched greatly, which can provide more comprehensive and accurate information
    [27].


    # 7.2 DIGITAL TWIN FOR COMPLEX EQUIPMENT


    # 7.2.1 Five-Dimension Digital Twin for Complex Equipment


    According to the proposed five-dimension definition of the DT in Chapter 3, Five-Dimension
    Digital Twin Modeling and Its Key Technologies, a DT concept model for complex
    equipment is built as shown in Fig. 7.2 [27].


    ![](img/5042607b423be4a5ee3f15dae22cc5bb_147_0.png)


    Figure 7.2 Five-dimension DT concept model for complex equipment [27].'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'The DT includes five components, that is, PE, VE, Ss, DD, and CN. PE refers
    to the physical equipment, operating in the real environment and completing prescribed
    tasks. VE represents the virtual equipment, which is the high-fidelity digital
    counterpart of the PE. It is composed of a set of models in multiple dimensions
    to describe the PE thoroughly. Ss stands for the services for both PE and VE.
    It optimizes the operations of the PE, and ensures the high fidelity of the VE
    through calibrating the VE parameters during its operation. DD is the DT data,
    including data from PE, VE, Ss, and domain knowledge, as well as the fused data.
    As the DD includes data from both physical and virtual aspects as well as their
    fusion, it can provide more comprehensive and accurate information. CN is the
    connection that ties different parts of the DT together [27].


    # 7.2.2 Modeling for Each Dimension of Digital Twin


    Then, specific models of the five-dimension DT are built according to the DT modeling
    methods explored in Chapter 3, Five-Dimension Digital Twin Modeling and Its Key
    Technologies. To illustrate the models, a WT is taken as an example of complex
