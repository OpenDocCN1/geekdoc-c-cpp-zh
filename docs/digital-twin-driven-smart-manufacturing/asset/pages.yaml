    # 4.7 CHALLENGES FOR DIGITAL TWIN SHOP-FLOOR


    Challenges exist when it comes to full realization of the DTS. First, it is necessary
    to keep an adequate two-way connection between the physical and virtual spaces
    to support real-time interaction. This mainly addresses challenges in terms of
    the technologies of sensors, communication, database and data processing, etc.
    Second, due to the variability, uncertainty, and fuzziness of the physical space,
    building models in the virtual space to mirror entities with high fidelity is
    a fundamental issue. In addition, when'
