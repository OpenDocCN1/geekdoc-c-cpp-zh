    provide services. The physical space can be more efficient to implement manufacturing
    activities, utilizing the potential of SoSM as a cyber-physical system [26].


    # 10.3 SERVICES IN DIGITAL TWIN


    All manufacturing resources and capabilities in the product lifecycle can be virtualized
    and then encapsulated into services. According to different existence forms and
    usage patterns, services can be mainly divided into resource services and information
    resources. The former is developed from hardware resources in manufacturing, such
    as manufacturing equipment, computing equipment, and materials, while the latter
    is from software resources, such as professional software, experience models,
    domain knowledge, and algorithms [27]. In addition, in a specific manufacturing
    activity, the resources can be extended to certain capabilities, such as in design,
    simulation, production, and maintenance [27-29].


    For the DT, services can be secured from two perspectives. On one hand, services
    form a crucial component of the five-dimension DT. For example, when a production
    task is input, the service system can invoke corresponding services to complete
    the task through service scheduling and combination. On the other hand, the other
    components of the five-dimension DT (i.e., physical entity, virtual entity, data,
    and connection)'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'can also be encapsulated into services. Benefiting from comprehensive servitization,
    the DT can be uniformly managed in a service platform. When a task is submitted
    to the platform, the suitable services among all the candidates are invoked and
    combined to form a complete DT first, and then perform the task collaboratively.


    # 10.4 DIGITAL TWIN SERVICE GENERATION


    Models and data are the cores of the DT. However, the creation of virtual models
    and fusion of data are complex and specialized projects. For users who do not
    have relevant knowledge, it is difficult to build and use the DT. Therefore, it
    is imperative that the models can be shared by users and data analysis can be
    outsourced to third-party professional organizations. Moreover, in the context
    of manufacturing socialization, the physical resources involved in manufacturing
    are geographically distributed. With the characteristics of on-demand use, dynamic
    reconfiguration, and platform independence, services pave way for the problems
    mentioned above [30]. In the following sections, servitization of physical entities,
    virtual entities, and data in the DT [33] is mainly discussed.


    # 10.4.1 Physical Entity Servitization


    Service encapsulation translates various components of the DT into services with
    uniform description [31]. As shown in Fig. 10.2 [30], the first and most important
    step of service encapsulation is to establish the information template, which
    consists of rich information [32]. For the physical entity, the information includes
    basic attributes (e.g., name, ID, address), quality of service (QoS) (e.g., time,
    cost, reliabilities, satisfaction), capacities (e.g., precision, size, process),
    real-time status (e.g., overload, idle, in maintenance), as well as input and
    output. The information templates of the physical entity (i.e., PE) can be described
    as (10.1) [30].


    ```

    PE = {Basic, QoS, Cap, Status, Input, Output}    (10.1)

    ```


    wherein, Basic refers to the basic attributes for identifying the physical entity.
    QoS denotes the evaluation for the performance of the physical entity in conducting
    the user selection. Cap represents the functions of the physical entity. Status
    indicates whether the physical entity is available. Taking an NC machine tool
    as an example, the production capacity includes the capacities for shape processing
    (e.g., plane, hole, thread),'
  merge: -1
  img_proc: true
