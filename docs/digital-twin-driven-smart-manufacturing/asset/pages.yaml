    # ### 3.5.4 Key Technologies for Digital Twin Data Modeling


    As the DD includes data from both physical and virtual sides, it has characteristics
    of multisources, heterogeneity, and massiveness. According to the characteristics
    of the data, the following key technologies are mainly involved for DD modeling.


    +   • _Data storage:_ It stores data from the PE, VE, and Ss in distributed nodes,
    and keeps the data available and accessible.


    • _Data modeling:_ It builds an abstract framework to describe the data structures,
    operations, and constraints.


    • _Data cleaning:_ It deals with “dirty” data, such as duplicate data, incorrect
    data, incomplete data, and delayed data.


    • _Data transformation:_ It transforms different data formats (e.g., text, table,
    picture, video) into a unified form.


    • _Data integration and fusion:_ Data from the PE, VE, and Ss are integrated and
    fused to generate more consistent, accurate, and comprehensive information.


    • _Data analysis and visualization:_ Based on the integrated and fused data, data
    analysis can be conducted in different dimensions (e.g., time- domain analysis
    and frequency-domain analysis) and the analysis result can be visualized.


    • _Data mining:_ It can discover patterns in large data sets through statistical
    methods or machine learning algorithms.


    • _Data interaction:_ It allows data to be shared between the PE, VE, and Ss.


    • _Data integrity check:_ It keeps data consistent, correct, effective, and compatible.


    • _Data security:_ It protects privacy data and prevents unauthorized access to
    the DD.'
