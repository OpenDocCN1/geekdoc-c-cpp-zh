    resources, including status, properties, qualities, and other data from the manufacturing
    resources. Some data are generated from the interaction between the physical space
    and the virtual space. Besides the virtual models from physical entities, there
    are some mathematical models, computing models, and others. The algorithms include
    data processing algorithms, intelligent optimization algorithms, and data mining
    algorithms. After data analysis and mining, some knowledge and rules are generated.
    In addition, some expert knowledge and physical rules are also stored in the virtual
    space for the users. Another component of the virtual space includes the digital
    services. These services are encapsulated through a service-oriented approach,
    such as SoA. Some are resource services, which are encapsulated from the physical
    manufacturing resources and capabilities based on data from the physical space.
    Some other services are encapsulated from information elements (i.e., data as
    services, models as services, algorithms as services, knowledge as services, and
    rules as services). It should be noted that the physical resources (e.g., material,
    machines, products) and information elements (e.g., production data and algorithms)
    can be shared and used remotely by global customers because of service availability
    [26].


    With the comprehensive analysis and processing capabilities for data and the interoperability
    characteristics of services in the virtual space, SoSM can cope with complex changes
    in the physical space through effective decision-making processes. In this process,
    there are four basic functions, that is, smart perception, smart analysis, autonomous
    decision making, and precise control and execution. First of all, various data
    from humans, materials, equipment, products, and systems in the physical space
    are accurately sensed through advanced sensing technologies. Then, the data acquired
    through perception are identified, processed, and analyzed quickly and accurately
    in the virtual space, as well as other data operations. According to the results
    of the analysis, decisions and choices are made autonomously in accordance with
    the rules and knowledge. Manufacturing resources are invoked in the form of services.
    Finally, on the basis of the decision making, the physical space is adjusted according
    to dynamic changes [26].


