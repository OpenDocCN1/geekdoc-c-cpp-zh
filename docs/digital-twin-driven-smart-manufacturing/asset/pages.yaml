    them are compared from different aspects, as depicted in Table 11.1.


    Some aspects in Table 11.1 are discussed as follows:


    +   - Environment: VR provides a fully virtual environment, which mainly consists
    of virtual graphics, images, models, etc. In such an artificial space, users can
    build their own worlds and customize their experiences. AR creates an augmented
    physical environment through superimposing the virtual elements on the physical
    ones to display'
