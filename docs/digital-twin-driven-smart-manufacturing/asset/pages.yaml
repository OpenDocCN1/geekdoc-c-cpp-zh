  md: '# 8.2 THREE-LEVEL DIGITAL TWINS IN MANUFACTURING


    By building a DT system that integrates data from different objects, activities,
    and processes, the innovation and efficiency of product design, production planning,
    and implementation can be enhanced effectively. The DT is an important supporting
    technology for smart manufacturing. To better understand the DT, a systematic
    and hierarchical view should be established. For smart manufacturing, both small
    objects such as a piece of equipment or a production line, and large objects such
    as a shop-floor or an entire factory, can be considered as DTs. Therefore, the
    DTs need to be divided into different levels, including unit level, system level,
    and SoS level, to adapt to objects in different granularity [6]. The DT in each
    level is a systematic model that is comprised of a previous level or levels. The
    system-level DT can be considered as an integration of multiple unit-level DTs
    that cooperate with each other. The multiple unit-level DTs or multiple system-level
    DTs constitute the SoS-level DT, that is, a complex system including complicated
    relations, associations, and combinations. As shown in Fig. 8.1, the unit-level
    DT mainly serves for a single object (e.g., a piece of equipment), which is the
    smallest unit participating in manufacturing activities. The optimization of manufacturing
    can be achieved through the adjustment of the equipment. With respect to the system-level
    DT, a smart production line comprised of machine tools, robot arms, automated
    guided vehicles (AGVs), etc. can be considered as a system with specific production
    capacities. For the unit-level and system-level DTs, the virtual models are ultrahigh-fidelity
    mappings through digital descriptions of the equipment and production line from
    the perspectives of geometric shape, function, and operating status. Basic attributes,
    real-time status, and other data are transmitted to the virtual models to drive
    simulation and prediction. Meanwhile, parameters of the virtual models are fed
    back to optimize the physical entities. By the closed-loop interaction process,
    the physical entities and virtual models evolve simultaneously. For the SoS-level
    (e.g., a shop-floor), accurate shop-floor management and reliable operations,
    which are inseparable from services, are especially crucial. As shown in Fig.
    8.1, (1) physical entities are a set of objective entities that have specific
    functions to complete manufacturing tasks according to inputs and outputs; (2)
    virtual models are the digital images of the physical entities and can completely
    and truly reflect the lifecycle of the physical counterparts; (3) services integrate
    various functions such as control, optimization, and prediction to'
