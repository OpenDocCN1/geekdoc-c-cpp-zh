  md: '# ### 1.3.2 Digital Twin in the Views of Enterprises


    Recently, many enterprises have also been attracted by the DT. In their views,
    the DT has a series of benefits, such as providing visibility of business, accelerating
    product development, optimizing the operation process, and improving service quality.
    Hence, they have actively combined the DT with their companies and products to
    grasp the great opportunity for promotion of their businesses. The understanding
    of the DT from enterprises is presented in Table 1.2 and some products/tools related
    to the DT concept are also presented.


    # ### 1.3.3 Cores of Digital Twin: Models, Data, Connections, and Services


    Although there are various understandings of the DT among academic researchers
    and industrial practitioners, models, data, connections, and services always play
    the most important roles in the DT. The four parts can be considered as the core
    of the DT, and their roles are introduced, respectively.


    +   1. _Models._An important characteristic of the DT is that for each physical
    object, a digital companion exists in the virtual world to work with it together
    across the lifecycle. In essence, the digital companion is composed of a set of
    models that allow the digitalized physical object to be viewed in three dimensions
    on the computer. The models are very critical in the DT, since they developed
    the initial concept “twin” into “digital twin” and provided more deep insights
    through simulation. Combined with data from sensors, information systems, persons,
    etc., the models mainly have the following four kinds of functions. First, they
    can reproduce the real properties, behaviors, and rules of the physical counterpart
    with high fidelity and thus form an exact digital duplicate that records all changes
    of the physical one. Second, they can operate autonomously in the virtual space
    to generate a series of simulated behaviors, which can be considered as the “ideal
    behaviors” to guide the operation of the physical object. Third, they have the
    abilities to predict problems on the physical side even before the occurrence
    of these problems and to develop preventive strategies. Lastly, the models can
    validate the performances of a product or a system before they are completed.


    +   2. _Data._Since big data analytics are available for dealing with large and
    diverse data sets, valuable information can be mined efficiently from'
