  md: '# CHAPTER 10


    # Digital Twin and Services


    Digital twin (DT) provides an effective way for the cyber-physical fusion of manufacturing.
    Meanwhile, services can make all the business processes and operation procedures
    in manufacturing realize servitization and standardization, to achieve higher
    efficiency. Combined with the services, the DT will be easier for usage and will
    generate more acceptable analysis and evaluation results on product design, manufacturing,
    usage, prognostics and health management (PHM), and other processes. This chapter
    specifies and highlights what manufacturing services are, how manufacturing services
    and the DT converge, and how various components of the DT are used by manufacturers
    in the form of services.


    # 10.1 INTRODUCTION


    As manufacturing evolves toward socialization and servitization, service plays
    an increasingly more important role in manufacturing [1]. More manufacturers are
    adopting service logic for their businesses to cope with intense competition and
    gain more revenue [2]. Services can shield the heterogeneities of resources, which
    are conducted by different vendors using various standards and communication protocols/interfaces,
    and enable interaction and integration [3]. With the characteristics of on-demand
    use, dynamic reconfiguration, and platform independence [4], services endow manufacturing
    with the advancement of large-scale sharing and collaboration [30].


    In view of the concept of everything as a service (XaaS), services can fully release
    the potential of the digital twin (DT). Through services, each component of the
    DT, especially virtual models, which are not easy to create rapidly, can be shared
    and used in a convenient “pay-as-you-go” manner [5]. Moreover, services are an
    integral part in the working process of the DT, and many actions require the support
    of third-party services. For example, multisource data fusion requires algorithms,
    and computing and storage services [30]. Therefore, in this chapter, the DT and
    services are combined, and DT service generation, management, and application
    are specified.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# 10.2 SERVICES IN MANUFACTURING


    # 10.2.1 Concept of Servitization in Manufacturing


    The concept of servitization in manufacturing, which has been studied by the authors
    in their previous work [26], is introduced in this section. The term servitization
    was coined by Vandermerwe et al. in 1988 to describe the phenomenon wherein more
    companies were adding value to their core products through services driven by
    customer demand [6]. In fact, servitization was conceptualized as an innovation
    of organizational capabilities and processes [7]. More companies have already
    expanded the scope of their services to enhance market competitiveness and gain
    more revenue [8]. In this context, service-oriented architecture (SoA) [9] provides
    an effective technique for servitization, and has been applied in various advanced
    manufacturing modes and systems, such as application service providers (ASPs)
    [10], manufacturing grids (MGrid) [11,12], product service systems (PSS)/industrial
    PSS (IPS2) [13,14], and cloud manufacturing (CMfg) [15,5]. For instance, distributed
    and heterogeneous manufacturing resource services in MGrid can be aggregated for
    collaborative operations with high efficiency [16]. Moreover, as a cloud-based,
    service-oriented manufacturing model embracing the concept of manufacturing as
    a service (MaaS) [17], CMfg can enable sharing of manufacturing resources and
    capabilities and cooperation in a convenient pay-as-you-go manner through services
    [18], to maximize the benefits of the manufacturing industry. CMfg has the characteristics
    of customer centricity, dynamic reconfiguration, on-demand mode, and sharing [19].
    Services endow manufacturing enterprises with the advantage of coping with the
    challenges such as fierce global competition, increasing labor costs, and other
    kinds of pressures [2,20]. Because services have the characteristics of interoperability
    and platform independence, they pave the way for large-scale enterprise collaboration,
    leading to manufacturing socialization [21,22]. A complex manufacturing task can
    be accomplished collaboratively by many services from different companies [23,24].
    In addition, many smart applications such as remote monitoring and diagnosis,
    predictive maintenance, operational analysis, and product usage (e.g., training,
    assistance, and interaction) are made possible through services [25]. Services
    bridge the gap between real production activities and logical collaboration [4],
    which can promote smart manufacturing applications.'
  merge: -1
  img_proc: true
