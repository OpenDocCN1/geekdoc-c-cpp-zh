    the consistency of the multisource data, which helps to simulate and deduce the
    manufacturing process. The inconsistency of the data will lead to conflicts. Therefore,
    big data is more suitable for greater varieties of data.


    Besides, given that the massive data cannot be processed using regular data tools
    within a reasonable amount of time, big data processing has its own advanced tools,
    algorithms, and platforms. Whereas, the data processing methods of the DT are
    not specified. Therefore, the velocity of data processing in big data, which is
    more professional, is more efficient than in the DT.


    In conclusion, big data is more professional and efficient than the DT in terms
    of volume, value, variety, and velocity of data, which are consistent with the
    characteristics of big data. This further deepens the role of big data in serving
    the DT.


    # 9.4.2.2 Advantages of Digital Twin Over Big Data


    As the DT is composed of three components, the data sources of the DT are different
    from those of big data. The data in big data are from physical entities, information
    systems, and the Internet, which are all generated by activities in the physical
    space. The data in the DT are not only from physical space, but also from virtual
    models. In addition, some data are derived from fusion operations, such as synthesis,
    statistics, association, clustering, evolution, regression, and generalization.
    In accordance with the different data sources, the data acquisition tools are
    also different. In addition to the tools they share for data from the physical
    space (e.g., sensors, RFID, etc.), the DT also needs model data interfaces to
    collect data from the virtual space, which are not required by big data in manufacturing.
    Therefore, the DT has more comprehensive data for use.


    Furthermore, the data fusion of big data is the fusion of various objects data
    in a single phase of the product lifecycle, due to the barriers between different
    phases. Whereas, the data fusion of the DT involves entire elements, processes,
    and businesses. The DT can achieve data sharing and integration between different
    phases of the product lifecycle. Therefore, the DT extends the range of application
    of manufacturing data, and thus avoids duplication and waste.'
