    entities (VEs), DT data (DD), and services (Ss) are connected with each other.
    The PEs (e.g., physical machine tool, robot, and materials) and VEs (e.g., virtual
    machine tool, robot, and materials) are kept synchronous and interactive through
    advanced sensory devices. The DD can store and fuse data from both the PEs and
    VEs to provide valuable information for services. Based on this, the introduction
