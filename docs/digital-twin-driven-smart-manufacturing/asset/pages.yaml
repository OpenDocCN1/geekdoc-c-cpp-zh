  md: 'technologies, real data from the PEs (e.g., position, orientation, and motion)
    can be captured by devices such as gloves, cameras, handles, and RFID s. Based
    on the data, the VEs in the assembly process will behave flexibly and provide
    multimodal feedback (e.g., visual, auditory, and tactile). In the process, VR
    enables the VEs to operate in an artificial and immersive environment, which is
    conducive to iterative and high-quality assembly planning, verification, and operator
    training, thus eliminating costly errors in the practical assembly process. AR
    can overlay graphical elements and insights from the VEs and DD on the PEs to
    provide just-in-time information rendering for assembly design, guidance, and
    training. AR helps to achieve more natural interaction and better user experience,
    such as manipulating virtual models in assembly via natural spoken language and
    operations.


    # 11.6.2 Application of VR and AR in Assembly Based on Digital Twin


    The assembly process for a complex aerospace product is taken as an example to
    illustrate the combination of five-dimension DT and VR and AR, as shown in Fig.
    11.2, which is being researched by Liu. Some key elements in the assembly process
    are introduced as follows:


    +   1. *Physical assembly scene of the complex aerospace product:* It contains
    the real assembly machines, tools, operators, parts, and products, which are organized
    in an orderly fashion.

    2. *Articulated arm and industrial personal computer (IPC):* The articulated arm
    can scan medium or small parts to measure their geometric dimensions and tolerances.
    The obtained point cloud data will be transmitted to the IPC to support virtual
    modeling.

    3. *Laser tracker and IPC:* The laser tracker can track a part and measure the
    part’s three-dimension coordinates and key features in real-time to capture assembly
    details. The collected data will be stored in the IPC for virtual modeling, assembly
    accuracy prediction, and process control.

    4. *Laser projector and IPC:* The laser projector can display outlines of the
    parts based on CAD data to guide assembly and support precise positioning.

    5. *VR and AR devices and IPC:* Devices such as HMDs, gloves, and handles can
    capture data from the physical assembly scene and obtain feedback from the virtual
    world. The IPC can perform simulation,'
