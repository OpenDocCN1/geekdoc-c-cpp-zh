  md: 'used in the entire product lifecycle and various industries, showing highly
    promising values in monitoring, control, optimization, and prediction of any operations.
    However, as the DT is an emerging technology, there remain many challenges on
    technologies, tools, infrastructures, standards, etc. Hence, substantial development
    is still required for the adoption and application of the DT.


