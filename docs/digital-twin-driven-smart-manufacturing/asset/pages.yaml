    # 6.3 PHYSICAL ELEMENTS FUSION


    To realize smart connection and interconnection of the physical elements on the
    shop-floor, researchers around the world have made substantial studies, such as
    data collection and monitoring based on radio frequency identification (RFID)
    [11], wireless sensor networks (WSN) [12], and intelligent instruments [2]; shop-floor
    interconnection based on manufacturing service bus [13], Profinet [14], OPC UA
    [15], AutomationML [16], and IoT [17]; and devices for manufacturing resource
    perception and access based on Industrial Internet hub solutions [18]. However,
    in these works, there are still deficiencies such as insufficient interconnection
    and interaction among the physical elements and incomplete collection of data.
    Hence, this section puts forward the scientific problem of “person–machine–material–environment
    interaction and fusion” (i.e., physical elements fusion).


    As shown in Fig. 6.2 [1], the physical elements fusion can be achieved from four
    levels, including the smart connection and interconnection, efficient data communication
    and integration, real-time control and interaction, and smart cooperation and
    convergence. Realizing the four-level fusion needs to achieve massive data collection
    for the heterogeneous physical elements, reliable real-time data transmission
    to the information layer, multisource multimodal heterogeneous data integration,
    and precise control of behavior coordination in the hybrid dynamic environment.


    The goal of physical elements fusion is to provide real-time data support for
    realizing models fusion, data fusion, and services fusion in the DTS, completing
    physical elements smart connection and interconnection, and integrating multisource
    heterogeneous data. Based on this, physical elements fusion can further realize
    the following goals.'
