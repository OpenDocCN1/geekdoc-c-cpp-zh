  md: '+   3. _Connections._Seamless connections are critical to enable every element
    in the DT (e.g., entity, model, and information system/tool) interacts with each
    other. The connections can be classified into three categories: connections within
    physical space, connections within virtual space, and connections across physical
    and virtual spaces. Through these connections, entities in the physical space
    can be interconnected for data exchange, while models and information systems
    would be linked to form an integrated information flow. In addition, the entities
    can be deeply intertwined with the corresponding virtual components to achieve
    a stable closed loop for both sensing and control, which keeps the physical and
    virtual spaces synchronous and consistent. Based on the connections, interactions
    among elements in the DT are enabled that can support collaboration to achieve
    iterative optimizations.


    +   4. _Services._As users of the DT may have little professional knowledge of
    related fields, it is essential to encapsulate functions provided by the DT (e.g.,
    evaluation, optimization, prediction, and validation) into standard services for
    easy and convenient usage. The services are the final presentations of the DT,
    which are generally expressed in standard formats to describe their inputs, outputs,
    basic information, function, and quality with user-friendly interfaces. They can
    be invoked individually or in combination with others according to the demands.
    For the users, the services are black boxes that can be used without any knowledge
    of internal mechanisms. They only need to offer the input parameters and demands
    (e.g., cost, time, quality) to the services and will obtain the results that require
    (e.g., evaluation results, optimized parameters, and predictive states). This
    simplifies the usage process significantly, which is beneficial to expand the
    application of the DT toward different user groups.


    # ## 1.4 DIGITAL TWIN AND RELATED CONCEPTS


    # ### 1.4.1 Digital Twin and Physical/Virtual Space


    The DT goes across two spaces, that is, the physical space and the virtual space.
    It can bridge the two spaces and blurs the boundary between them.


    The physical space is a three-dimension space and exists in substance. It contains
    many entities (e.g., persons, apparatus, infrastructures, and hardware) with physical
    existence properties such as shape, size, color, structure, mass, speed, etc.
    Each entity occupies a location, behaves'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'according to physical laws, and deals with an uncertain environment. The entities
    have practical functions and can be organized in an orderly way to complete certain
    tasks considering constraints on time, cost, quality, etc. Data from the entities
    are analog data with smoothly varying values.


    With the development of information technologies, such as the computer technology,
    modeling and simulation, communication technology, the Internet, cloud computing,
    IoT, etc., the virtual space has developed and plays a growing role in people’s
    life. It converts analog data from the physical space into discrete digital signals
    that can be easily stored, processed, and displayed. For each entity, the virtual
    space builds a three- dimension digital mirror model, which is similar to the
    physical counterpart not only in geometric appearance, but also in physical properties
    and behaviors. With virtual reality (VR) and augmented reality (AR), the virtual
    space becomes immersive, which means it can simulate the physical space through
    senses and perception, thus realizing full body immersion. Through integrating
    data from multiple sources, such as human experience, sensor data, and domain
    knowledge, the virtual space can provide simulation, prediction, optimization,
    and verification for the physical entities during their lifecycles.


    The DT contains both the entity from the physical space and the digital mirror
    model from the virtual space. Each entity in the DT has a virtual companion that
    operates and evolves with it all the time. On one hand, the model is built and
    calibrated to accurately reproduce the properties and behaviors of the entity
    during its running. On the other hand, the entity is controlled to approximate
    the predefinitions of the model to the maximum extent. It forms the bidirectional
    maps between the physical and virtual spaces, which makes the two spaces synchronous
    and consistent. In addition, as the DT can obtain data from the entity and the
    virtual counterpart, it can fuse the data from both the physical and virtual spaces
    to capture more comprehensive and accurate information. The DT can be considered
    as an efficient way to bridge the two spaces and further achieve cyber–physical
    fusion.


    # ## 1.4.2 Digital Twin and Virtual Prototype


    A virtual prototype is a three-dimension virtual model that replaces a physical
    prototype to test and evaluate a product in a computational environment via computer-aided
    tools, such as CAD and CAE [67]. The virtual prototype can be used as a virtual
    substitute to detect faults and'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'predict performances of the physical product early in the design stage, and
    allows easy modification and manipulation once mistakes or faults are captured.
    When the virtual prototype is finished, it can be sent to customers to obtain
    feedback before the physical product is available. Therefore, the virtual prototype
    can help avoid costly mistakes during production, shorten the design cycle of
    products, and improve customer involvement, thus leading to fast and cost-effective
    product development.


    The virtual prototype can be considered as the foundation of the DT. They have
    some similarities as follows: (1) Both of them construct three- dimension virtual
    models to replace the corresponding physical products, e.g., product test, evaluation,
    and validation) are performed in the virtual space to reduce costs in both time
    and money. (2) Compared with traditional design methods using a physical- physical
    prototype, their virtual models can produce more insights in different scales
    to optimize the product in the design stage in the design stage to provide experience
    and comments for product optimization through interacting with the models.


    However, the virtual prototype is not identical to the DT. The DT has advantages
    over the virtual prototype as follows: (1) The virtual prototype mainly serves
    the product design stage for evaluation and validation. Whereas, the virtual model
    in the DT accompanies the physical counterpart throughout its lifecycle, from
    creation to disposal. As the DT integrates abundant actual data of the product
    in different stages (e.g., manufacturing, sale, and maintenance), it can take
    into account all that may happen in the physical space and conduct a more comprehensive
    proofing in the design stage to eliminate potential failures. Furthermore, with
    the product lifecycle data, the DT has the ability to spark innovation in design.
    (2) There is little connection between the virtual prototype and the physical
    product. Whereas, the virtual model in the DT always stays connected with the
    product during the lifecycle to reflect the actual states and essential insights
    in real-time, which can feed designers valuable information to improve the product
    in time for a quick adaptation to the market. (3) The virtual prototype only provides
    the ideal product that is expected, but the DT can present both the ideal and
    the actual products. In the DT, the ideal product model is constructed in the
    design stage, and the actual product model is formed gradually after the design
    stage through integrating the actual product data generated in the manufacturing,
    operation, maintenance, disposal, etc. Through comparing and analyzing the two
    kinds of product models, their differences can be found intuitively and eliminated.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# ## 1.4.3 Digital Twin and PLM


    PLM is “managing products across their lifecycles,” and it was defined by Stark
    as “the business activity of managing, in the most effective way, a company’s
    products all the way across their lifecycles; from the very first idea for a product
    all the way through until it is retired and disposed of” [68]. It enables a company
    to grow revenues by improving innovation, reducing time-to-market for new products,
    and providing superb service for existing products [68].


    In PLM, managing big data generated from the product lifecycle is the most crucial
    step, which can offer insights and spark creation of fresh products, and provide
    valuable information to guide the product manufacturing and service. As mentioned
    in a PLM special report published by Raconteur, if PLM is the lifeblood of innovation,
    then data is the lifeblood of PLM [69]. Nowadays, although vast amounts of data
    throughout a product’s lifecycle can be obtained with the aid of advanced sensory
    technologies, data in different stages is still isolated, fragmented, and stagnant,
    which leads to low data-use efficiency. Hence, many companies aim at turning PLM
    data into meaningful insights and potential new revenue streams [69].


    The DT can tightly integrate data in the product lifecycle and continuously produce
    meaningful information for companies. That is one of the reasons why the industry
    is excited about it. The DT constructs a high-fidelity digital mirror model to
    run with the physical product together. In different stages of the lifecycle,
    the virtual duplicate is used to record and combine the real-time data with different
    natures of the physical product (e.g., picture, tabular, web, video, etc.), and
    transforms the data into a unified view continuously to eliminate information
    silos. With the integrated data, the virtual model can present a 360-degree view
    of the product, and accurately simulate, optimize, predict, and validate the manufacturing
    processes, usage scenarios, environmental conditions, and other variables for
    the product in its lifetime. In addition, with the aid of the DT, the companies
    will be more likely to integrate data into different projects, and motivate innovation
    and knowledge-sharing.


    # ## 1.4.4 Digital Twin and Digital Asset/Enterprise/Industry


    The DT can be applied to different levels, including single asset, entire enterprise,
    and even industry, to enhance the existing functions.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'A digital asset is a virtual representation in binary formats for the corresponding
    physical asset (e.g., product, machine, and infrastructure), including digital
    reports, audible contents, motion pictures, and other relevant digital data. The
    digital asset is introduced to manage the physical asset in a more efficient way
    and the appearance of the DT can further enhance the function. (1) With the DT,
    each physical asset owns one unique digital replica in highly realistic three-dimension
    form to describe and analyze its performance thoroughly, which can provide real-time
    insights, early warnings, predictions, and ideas for optimization. (2) The DT
    can help validate operations of the asset even before it starts to perform, which
    reduces the potential failures in the actual execution. (3) The DT can integrate
    data throughout the lifecycle of the asset and spark innovations.


    In the digital age, enterprise has moved toward virtual environments, and thus
    the term “digital enterprise” has appeared. It transforms the enterprises to digital
    structures by means of information and communication technologies to give a unique
    opportunity for planning and controlling the businesses [70]. The DT can be applied
    to all lines of business in digital enterprise and the advantages include (1)
    enhancing the ability to make proactive and data-driven decisions, increasing
    efficiency, and avoiding potential issues [71]; (2) shortening new product development
    cycles and reducing the time to market; and (3) making collaboration between different
    departments more efficient and effective through providing digital mirror models
    that can integrate heterogeneous data.


    The entire industry, covering the value chain from the product design to production
    and then to retail, has been gradually digitalized. With the DT, a large amount
    of data produced in the industry will have an increasing share. As the DT can
    provide virtual models with unified data and encapsulated services with standardized
    functions, it can also support the industry convergence, which will redefine industry
    boundaries by shifting the focus from individual products to cross-industry value
    experiences [72]. In addition, it can help save natural resources in design, manufacturing,
    logistics, and usage through better addressing the customers’ needs.


    # ## 1.4.5 Digital Twin and Digital Thread


    “Digital thread” originated in the aircraft industry and was defined by Kraft
    from the U.S. Air Force as “an extensible, configurable and agency enterprise-level
    analytical framework that seamlessly expedites the'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'controlled interplay of authoritative data, information, and knowledge in the
    enterprise data–information–knowledge systems, based on the Digital System Model
    template, to inform decision makers throughout a system’s lifecycle by providing
    the capability to access, integrate and transform disparate data into actionable
    information.” Herein the “Digital System Model” refers to a digital representation
    of a weapons system [73]. The primal motivation of the digital thread is improving
    the performance of the future military programs by means of digital technologies.


    The DT was developed from early airframe models preserved in the digital thread,
    aiming at applying the high-fidelity modeling to the manufacturing, operation,
    and maintenance of the aircraft structural elements to reduce the military spending
    [74]. The DT is enabled by the digital thread, since all data used in the DT (e.g.,
    models, sensor data, and knowledge) for assessment, analysis, update, etc., are
    captured from the thread [74].


    In recent years, the DT and the digital thread have been gaining attention beyond
    the aerospace industry. They have been introduced to the product lifecycle management
    in the civil field to provide the best possible information for design, manufacturing,
    and service. Toward wider industrial applications, a widespread definition of
    the digital thread is “a communication framework that allows a connected data
    flow and integrated view of the product’s data throughout its lifecycle across
    traditionally siloed functional perspectives” [75]. It can converge the digital
    connectivity goals into a single framework and can deliver the right information
    to the right place at the right time. Therefore, many large companies are focusing
    on the digital thread and trying to apply it to fully digitize their supply chain,
    manufacturing process, and service for dealing with the increasingly competitive
    pressure. For example, Siemens holds that creating the digital thread can closely
    integrate each step of the product lifecycle, which dramatically lowers production
    costs and manufacturing timelines and improves the quality of the product [76].
    At GE, the digital thread is considered as a seamless digital connection that
    bridges the gap between data from different systems and stages for closed-loop
    optimization [77]. STEP Tools. Inc. tends to build the digital thread for manufacturing
    to make everyone in the enterprise see how they affect each other in real-time
    for better decision making, operation, and maintenance [78].


    Combined with the digital thread, the DT can obtain the best available data from
    the entire lifecycle for high-quality mirror and simulation.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# ## 1.4.6 Digital Twin and Digital Shadow


    Digital shadow is a data profile that couples with the corresponding entity throughout
    its lifecycle, and carries all the data and knowledge to reflect the individual’s
    shape and historical, current, and expected future status [43]. Data in the digital
    shadow are not scattered but stored together in a single electronic document and
    are actively handled by a dedicated software service or software agent [80]. That
    makes the data integrated and processed uniformly and efficiently to generate
    meaningful information. The primary purpose of the digital shadow is supporting
    decision making to increase the utilization and efficiency of physical resources
    for a more


    ![](img/5042607b423be4a5ee3f15dae22cc5bb_26_0.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'sustainable world [80]. In the digital shadow, digital security and digital
    risks are always crucial problems.


    As the DT is a virtual representation carrying data of the physical counterpart
    throughout the entire lifecycle, it is similar to the concept of the digital shadow.
    However, the two terms still have differences and the DT is superior to the digital
    shadow on the following aspects: (1) The DT can provide a high-fidelity digital
    mirror model to describe the entity intuitively and thoroughly. (2) Based on the
    model, the physical processes and activities can be validated before execution,
    which reduces the risk of failure. (3) The model operates in synchronization with
    the entity and can provide a comparison between the actual and the simulated performances
    to capture their difference, which is valuable for evaluation, optimization, and
    prediction. (4) The data in the DT are not only from the physical world, but also
    from the virtual models, and some data are derived from fusion of data from the
    two worlds, such as synthesis, statistics, association, clustering, evolution,
    regression, and generalization. Hence, in the DT, the data is more abundant to
    generate more accurate and comprehensive information.


    # ## 1.5 VALUE OF DIGITAL TWIN


    DT’s value is summarized as follows:


    # ### 1.5.1 Increasing Visibility


    The DT offers high-fidelity three-dimension models, which are updated in real-time
    to keep consistent with the corresponding physical counterparts. It allows personnel
    to monitor products or systems in a more direct and clear way, and thus increases
    visibility.


    # ### 1.5.2 Reducing Time to Market


    As the market changes rapidly, users are always eager for new products. To deal
    with the market demand, on one hand, the DT can provide designers with a chance
    to develop insights about how a product behaves even before it is completed thereby
    eliminating potential failures, and can thus reduce the time to market. On the
    other hand, the DT can generate a highly realistic virtual substitute before the
    physical product is finished, which enables the user experience in advance.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# ## 1.5.3 Keeping Optimal Operation


    Virtual models in the DT are kept connected to the physical counterparts in the
    physical world. This physical–virtual connection offers a possibility to analyze
    how the physical entity performs under different conditions in real-time, and
    thus makes in-time adjustments to ensure it works exactly as planned to keep optimal
    operation.


    # ## 1.5.4 Reducing Energy Consumption


    In a single DT, as the states of the physical asset can be analyzed in real- time,
    the degraded components can be replaced in a timely manner to avoid additional
    energy consumption. In addition, multiple DTs can be connected to enable each
    DT to negotiate with one another. It makes the corresponding physical counterpart
    start or close at different periods in an orderly way to pursue a lower total
    energy consumption.


    # ## 1.5.5 Reducing Maintenance Cost


    Modern assets generate a mass of data that can be studied and assessed to determine
    when a future problem might occur. The DT can take advantage of these data, and
    combine data coming from both the physical asset and virtual model to predict
    a breakdown or maintenance event in advance to largely reduce downtime and maintenance
    costs.


    # ## 1.5.6 Increasing User Engagement


    For new product design, the users can interact with the high-fidelity virtual
    models and feedback comments to optimize the design schemes. For existing products,
    the DT can record and analyze product behaviors in real-time, which can reflect
    the users’ habits to some extent. Based on the data, improvement and innovation
    on products can be inspired to better serve the users.


    # ## 1.5.7 Fusing Information Technologies


    The DT can fuse different information technologies, including machine learning,
    simulation, modeling, IoT, cloud computing, big data, etc., to accomplish complex
    tasks better. For example, the DT possesses the ability to predict what is going
    to occur through fusing sensor data, simulation results, machine learning algorithms,
    etc., and the DT can carry out simulations in real-time in combination with cloud
    computing to obtain powerful computing capacity.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# ## 1.6 SUMMARY


    As DT is an emerging pragmatic technology for the seamless integration and fusion
    between the physical and virtual spaces, it has attracted much attention recently.
    This chapter introduces the background of the DT and explains its importance.
    The historical development of the DT from 2003 to today is reviewed and the various
    concepts of the DT from both academia and industry are presented. Based on this,
    the cores of the DT are concluded as models, data, connections, and services,
    which play the most significant roles in the DT. Then the related concepts of
    the DT are introduced, including the physical/virtual space, virtual prototype,
    PLM, digital asset/enterprise/industry, digital thread, and digital shadow. Finally,
    the benefits of the DT are discussed. In summary, this chapter intends to help
    the readers gain a preliminary understanding of the DT, and is the foundation
    for the study of the following chapters.


