  md: 'Fig. 6.1 [1]. These layers include the physical layer, model layer, data layer,
    service layer, and application layer. Each layer is introduced as follows [1]:


    +   1. The physical layer mainly refers to entities such as persons, machines,
    and materials, and a set of production activities and processes in the PS. It
    is mainly responsible for production in the physical space, and has capabilities
    such as data collection and transmission, interconnection, interaction, and cooperation,
    etc.

    2. The model layer mainly includes various virtual models combined with real-time
