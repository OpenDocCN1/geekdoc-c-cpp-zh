    can simulate the conditions of the equipment accurately to mimic what is exactly
    happening and what will happen, to optimize decision making. With the DT, the
    security of the equipment and related staff can be guaranteed.


    In the future, with the DT, the security of physical assets, information, and
    even human beings will be further enhanced, and the emergency measures will also
    be optimized.


    # 2.2.12 Observations


    At present, the DT has been introduced to various industries. Among them, applications
    of the DT in aerospace are relatively mature. The reasons mainly include three
    aspects.


    +   1. Aerospace employs and integrates the most advanced technologies in industry
    (e.g., high-fidelity modeling and simulation, lifecycle data integration and fusion,
    and connection and interconnection), which makes it a good candidate for the introduction
    of DT.


    +   2. As DT applications in aerospace have been developed over a longer period
    of time than other industries, more researchers and practitioners have dedicated
    their efforts to the domain, leading to substantial improvements and progress.


    +   3. Aerospace engineering is a special sector. As it is closely related to
    national defense, it has a high requirement for security and confidentiality,
    but a relatively low requirement for services. Hence, the initial three-dimension
    DT concept can exactly satisfy the requirements of this sector. However, for other
    sectors, it is a crucial step to encapsulate functions provided by the DT into
    standard services for easy and convenient use, as well as for a more enjoyable
    user experience. For the new demand, the initial DT concept shows shortcomings
    that could hinder its acceptance.


    As the DT is an emerging technology, developments on related models, technologies,
    tools, infrastructures, and standards are still lacking. In the future, with the
    continuous improvement and perfection of the DT, more mature applications can
    be realized in different industries.'
