    # ## 3.6 EIGHT RULES FOR DIGITAL TWIN MODELING


    # ### 3.6.1 Data and Knowledge Based


    Data and knowledge are foundations for the DT modeling. On one side, the existing
    knowledge provides basic rules that should be followed during the modeling process.
    On the other side, real-time data need to be injected into the DT continuously,
    to feed the DT with new knowledge and to calibrate the initial virtual models,
    services, and data structures continuously.


    # ### 3.6.2 Modularization


    DT modeling is a complex project, which involves heterogeneous hardware, multifunctional
    models, multisource data, various services, etc. To improve the modeling efficiency,
    modularization is effective as it can separate and recombine compositions of the
    DT with benefits of flexibility and reusability. For example, dividing the DT
    into three levels (i.e., unit-, system-, and SoS-level) is a kind of method for
    modularization, which makes the DT decomposable and recomposable toward different
    applications.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# ## 3.6.3 Light Weight


    To keep high fidelity with the physical entity and provide previous services,
    the DT consists of multiple models with complicated structures and mechanisms,
    which creates an obstacle for real-time operation and simulation. Therefore, a
    light weight model is essential for the DT to achieve a shorter transmission time,
    faster running speed, and better real-time performance.


    # ## 3.6.4 Hierarchy


    In the DT, if all the resources including data, knowledge, models, services, etc.
    are centrally stored and processed, it will cause a large burden to the transmission,
    computation usage, and maintenance. Accordingly, a hierarchical structure should
    be introduced to the DT. By using the edge-fog cloud structure, resources with
    different characteristics in the DT can be distributed in different layers for
    processing and analysis, thus satisfying the requirements on timeliness and efficiency.


    # ## 3.6.5 Standardization


    Service software, databases, and models in the DT may use different encoding strategies,
    interfaces, and communication protocols, which leads to difficulties in module
    integration, unified data exchange, information identification and maintenance,
    etc. It also hinders stable interaction and cooperation among different entities
    in the DT. Therefore, standardization should be focused on solving the above problems.


    # ## 3.6.6 Servitization


    As users of the DT may have little professional knowledge in the related fields,
    such as modeling, simulation, data integration, and fusion, it is essential to
    encapsulate functions provided by the DT (e.g., evaluation, optimization, prediction,
    and validation) into standard services for easy and convenient usage. To realize
    that, servitization is an essential step in the DT modeling.


    # ## 3.6.7 Openness and Scalability


    The DT should be open to integrate with various resources (e.g., models, services,
    and tools) from the external environment, which makes the DT have better compatibility
    to work with different systems, and enhance functions of the DT through taking
    advantage of capabilities from other'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'platforms. Besides, the DT should also be scalable, which enables functional
    extension through adding new models.


    # 3.6.8 Robustness


    As the DT is mainly applied to the industrial environment, which is characterized
    by uncertainty, dynamism, and complexity, it should be built with good robustness
    to deal with unpredictable changes. For example, when the working conditions of
    the physical equipment vary, the DT should have the ability to alter its initial
    configuration to adapt to the current situation.


    # 3.7 SUMMARY


    With growing social demands and unceasing technical developments, new requirements
    are put forward for the traditional three-dimension DT, including requirements
    from applications, technologies, modeling objects, and modeling methods. To meet
    the new needs, this chapter proposes an innovative DT model that extends the traditional
    three-dimension DT to the five-dimension DT, and discusses modeling methods for
    each dimension. Based on this, the DT is further classified into three levels
    toward different applications, that is, unit level, system level, and SoS level,
    respectively. Key technologies and eight rules are also proposed to provide guidelines
    for future works on DT modeling.


