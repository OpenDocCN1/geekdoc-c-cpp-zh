- pgno: 240
  md: '# CHAPTER 12


    # Digital Twin, Cyber—Physical System, and Internet of Things


    Cyber—physical system (CPS) and digital twin (DT) share the same goal, that is,
    achieving seamless integration between the physical and cyber worlds. CPS provides
    an integrated and compatible framework with a comprehensive perspective, and DT
    can be considered as a focused application of it. The DT carries characteristics
    of CPS, such as cyber—physical mapping, closed-loop control, and three-level structure,
    while its elements (e.g., high-fidelity models, fused data, and on-demand services)
    can further enhance the cyber—physical integration based on CPS. In this chapter,
    according to relations between the two concepts, an implementation framework of
    DT-based CPS is proposed to efficiently couple the physical and cyber worlds.
    Further, the Internet of Things (IoT) is applied to the framework to realize the
    connections within and across the physical world and cyber world, thus keeping
    each element connected interactively with each other.


    # 12.1 INTRODUCTION


    Cyber—physical system (CPS) embeds computing, communication, and control capabilities
    into physical devices (e.g., cars, medical devices, and manufacturing equipment)
    to monitor, control, and coordinate the corresponding physical activities [1].
    It couples cyber capabilities tightly with dynamics and physics of the physical
    space through technologies such as advanced sensors and actuators, embedded systems,
    computing, communication, networking, etc. The intimate coupling can be reflected
    in different scales, from a unit to a system and even to a system of systems (SoS)
    [2]. CPS is superior to the regular control or embedded system in that the combination
    of physical and cyber elements brings unprecedented improvements on interactivity,
    reconfigurability, scalability, and intelligence [3]. It is expected to yield
    revolutionary advances in different fields, such as health care, transportation,
    manufacturing, aerospace, defense, and buildings [4].'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'In CPS, the physical world includes physical objects that need to be controlled,
    while cyber systems conduct data analysis and decision making [5]. As the CPS
    is about the intersection, not the union, of the physical and cyber elements,
    interaction is therefore of great significance [6,7]. To realize the interaction,
    data from the physical objects can be collected using sensors in real time and
    transmitted to the cyber systems for processing and analysis, while real-time
    orders will be fed back to the actuators to regulate operations of the physical
    objects. CPS forms a closed loop between the physical world and cyber world, aiming
    at integrating the two words seamlessly.


    Digital twin (DT) is another concept that can support cyber–physical integration.
    The DT creates high-fidelity virtual models for physical entities to simulate
    their states and behaviors and provide more insights. It keeps virtual models
    behaving realistically and allows physical processes to be detected and predicted
    efficiently, which can implement the coupled optimization for both physical and
    virtual objects.


    Both CPS and DT aim to realize the seamless integration of the physical and cyber
    worlds. However, what is their relationship? How can they realize cyber–physical
    integration based on CPS and DT? To address these issues, this chapter examines
    CPS and DT from several aspects and proposes a DT-based CPS framework to tightly
    couple the physical and cyber worlds. As Internet of Things (IoT) technology is
    of key importance for connections in the DT-based CPS, the roles of IoT in the
    framework are also discussed.


    # 12.2 CPS IN MANUFACTURING


    # 12.2.1 Brief History and Concept of CPS


    The term “CPS” stems from cybernetics [8], which was proposed by Wiener, an American
    mathematician who contributed greatly to the field of control theory. Although
    computer technology was not available at that time, the principles involved in
    Wiener’s research are similar to today’s computer-based feedback control systems
    [9]. Cybernetics could be considered as the combination of physical processes
    and capacities of computing and communication in the early days. Around 2006,
    the term CPS was coined by Gill at the National Science Foundation (NSF) in the
    United States to deeply synthesize the physical and cyber elements [10]. Since
    then, the NSF has awarded a large number of projects to support universities and
    institutes in conducting transformative research on CPS'
  merge: -1
  img_proc: true
- pgno: 242
  md: '[1]. In 2007, the US President’s Council of Advisors on Science and Technology
    (PCAST) released a report to change the center of gravity in networking and information
    technology (NIT) and listed the development of CPS at the top [11]. Aware of the
    significance of CPS, researchers from other countries also paid substantial attention
    to it. In recent years, CPS has been regarded as key to supporting the smart manufacturing
    strategies proposed by different countries, such as Industrial Internet, Industry
    4.0, Made in China 2025, cybermanufacturing, etc. Nowadays, CPS is a strong and
    growing area, and shows great potential in the near future.


    There is no universal definition for CPS. For example, Lee described CPS as “integrations
    of computation with physical processes” [12]. Rajkumar defined CPS as “physical
    and engineered systems whose operations are monitored, coordinated, controlled,
    and integrated by a computing and communication core” [4]. Poovendran proposed
    that CPS is “a promising new class of systems that deeply embed cyber capabilities
    in the physical world, either on humans, infrastructure or platforms, to transform
    interactions with the physical world” [3]. Gunes et al. considered that CPS is
    “a term describing a broad range of complex, multidisciplinary, physically-aware
    next generation engineered system that integrates embedded computing technologies
    (cyber part) into the physical world” [5]. Although researchers define CPS differently,
    the core of these definitions is the tight coupling of cyber capabilities and
    physical processes.


    # 12.2.2 CPS-Based Manufacturing


    To date, CPS has attracted a great deal of attention from many different fields,
    especially the manufacturing field. Based on the CPS concept, cyber capabilities
    (i.e., computing, control, and communication) are expected to be embedded into
    manufacturing assets to form an intelligent distributed network, which can facilitate
    asset management, production optimization, and product quality control. The integration
    enabled by CPS is important for the implementation of smart manufacturing. The
    related research about "CPS-based manufacturing" has been explored in the authors''
    previous work [13], which is introduced as follows.


    Monostori [14] introduced cyber—physical production systems (CPPS) into manufacturing
    to change the traditional hierarchical structure, including five levels from field
    to enterprise resource planning, to a distributed network for a more decentralized
    way of functioning. Setty et al. [15]'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'proposed a unified framework to design and deploy a CPS-based manufacturing
    system composed of networked embedded controllers and mechatronic devices, which
    provides a smart automation solution for production. Weyer et al. [16] presented
    a three-tier framework for seamless connection and interaction between CPS models
    and multidisciplinary simulation along the production lifecycle. The framework
    was validated in automotive production. Lee et al. [17] proposed a 5C architecture
    for the implementation of CPS and explored related applications and techniques.
    Based on the architecture, a prognostics and health management (PHM) approach
    for a machine tool was proposed to perform analytics at the cyber level and conduct
    just-in-time maintenance. Iarovyi et al. [18] created an open knowledge-driven
    manufacturing execution system (MES) based on CPS. As the shop-floor devices have
    increasing computing and communication capabilities, they can provide enhanced
    functions in the forms of data, services, and descriptions, so that higher-level
    knowledge can be obtained to support the MES. Leitão et al. [19] described four
    prototype implementations for industrial automation based on CPS and discussed
    the challenges. Besides, cloud technology is also applied to the CPS to provide
    powerful computing capability and on-demand services. For example, Wang et al.
    [20] designed an integrated CPS architecture including control tier, model tier,
    and view tier. Functionalities for remote monitoring and control, process planning,
    and remote assembly are supported by data, knowledge, and models stored in servers
    in the cloud and related services are provided to users through web browsers.
    Yue et al. [21] presented a cloud-based industrial CPS framework that took all
    infrastructures, platforms, and applications as services. Tao and Qi [22] proposed
    a service-oriented smart manufacturing (SoSM) framework integrating with the cloud,
    big data, IoT, and services based on CPS architecture.


    In existing research on CPS-based manufacturing, there are many discussions on
    its concepts and frameworks, while few implementations have been reported. This
    is probably for two main reasons: (1) since manufacturing has high requirements
    on near real-time response, precision, and safety, applications of CPS-based manufacturing
    face enormous challenges and more technical details still need to be explored;
    and (2) current CPS is mainly conceptual aiming at inspiring new scientific foundations
    and technologies, rather than practical solutions to directly guide the development
    of engineered systems.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 12.3 IOT IN MANUFACTURING


    # 12.3.1 Brief History and Concept of IoT


    IoT is an important driver for CPS. It can connect physical and cyber elements
    together to form a hybrid communication network where elements interact with each
    other in real-time, thus enabling the direct integration of the physical and cyber
    worlds. The brief history and concept of IoT have been studied by authors in their
    work [23], and the study is introduced as follows.


    The origin of IoT can be traced back several decades ago. As early as 1982, students
    in Carnegie–Mellon’s Computer Science Department connected a Coca Cola vending
    machine to the Internet, which allowed customers to check the status of the drinks
    remotely [24]. It was the earliest prototype of the IoT system. In 1995, Gates
    mentioned that things and people could connect with each other in the future in
    the book The Road Ahead [25]. In 1999, the term IoT was originally proposed by
    Ashton at the Auto-ID center at the Massachusetts Institute of Technology (MIT).
    The center proposed to offer a unique e-tag to each product and connect the product
    to the Internet [23]. From then on, the IoT concept gradually came into view.
    In 2003, Walmart asked its 100 top suppliers to attach radio frequency identification
    (RFID) chips on products to support efficient supply chain management [26]. Having
    recognized the benefits brought by IoT technology, some reputable companies, for
    example, IBM, Tesco, Microsoft, and Philips, began to apply RFID tags in their
    businesses [27]. In 2005, the International Telecommunication Union (ITU) released
    the report “ITU Internet Reports 2005: The Internet of Things” [28] to introduce
    the characteristics, technologies, and challenges of IoT. In 2008, IBM launched
    “Smarter Planet” based on IoT to build smarter systems for health care, the power
    grid, water, public safety, traffic, and food [29]. Nowadays, IoT as global infrastructure
    for the information society has been widely introduced to logistics, manufacturing,
    health care, agriculture, smart cities, etc.


    In the academic community, IoT has been defined from different perspectives and
    numerous definitions for IoT exist in the literature. These definitions have come
    along with the development of IoT. Ashton considered IoT as a technology mainly
    based on RFID to realize the interconnection of objects [23]. ITU proposed that
    IoT allows new forms of communication among people and things at any time and
    any place by'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'embedding short-distance mobile transceivers into parts and daily objects [28].
    The European Technology Platform on Smart Systems Integration (EPOSS) defined
    IoT as “things having identities and virtual personalities operating in smart
    spaces using intelligent interfaces to connect and communicate within social,
    environmental, and user contexts” [30]. Up to now, although there is no unified
    definition for IoT, existing definitions generally focus on both object identification
    and communication. For example, Miragliotta et al. [31] illustrated that IoT is
    a paradigm realizing the interplay of smart objects and of smart communication
    networks. Atzori et al. [32] defined IoT as a pervasive presence of a variety
    of things or objects, such as RFID tags, sensors, actuators, and mobile phones,
    which are able to interact with each other through unique addressing schemes.


    # 12.3.2 Applications of IoT Toward Smart Manufacturing


    The authors have investigated the applications of IoT towards smart manufacturing
    in their work [33]. And the related investigations are introduced in this section.
    As IoT could provide a promising opportunity to build powerful manufacturing systems
    and applications by leveraging RFID, wireless and mobile sensory devices, embedded
    objects, ad hoc networks, and Internet-based information infrastructure, it has
    been applied to different fields toward smart manufacturing.


    For example, in the field of aerospace industry, the application of IoT can effectively
    improve product safety and reliability by identifying the faulty and counterfeit
    parts or products. An investigation published by US Aviation declared that at
    least 28% of air accidents or incidents are caused by counterfeit products [34].
    After employing IoT technology to identify and single out the subquality parts/products,
    the safety and operational reliability of aircrafts have been improved significantly.
    In the automotive industry, IoT is widely used in the production line, product
    quality monitor and control, assembly line, logistics, and product (or part) tracking.
    Among these procedures, intelligent labels are pasted on the components of every
    object, carrying the associated attribute information such as the manufacturer’s
    name, serial number, product type, product code, as well as the exact location
    of the product [35,36]. The application of IoT can also help integrate different
    communication technologies used in manufacturing systems, such as global systems
    for mobile communications (GSM), near-field communication (NFC), low-power Bluetooth,
    ZigBee,'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'wireless local area networks (LANs), multilevel networks, and sensor network
    technology [37]. In addition, Xu et al. [38–41] have reviewed the advances of
    IoT in enterprise systems and industries. He et al. [42] have researched the application
    of IoT in the development of vehicular data cloud service. Tao et al. [33,43,44]
    explored methods to apply IoT to manufacturing resource intelligent perception
    and access to support energy consumption evaluation and analysis. They also reviewed
    the applications of IoT in product lifecycle energy management and discussed the
    potential applications and challenges [23].


    With respect to IoT in manufacturing, much effort still needs to be made in the
    future, including design, production, and deployment of specific perception devices,
    equipment, and sensors, standards, protocols, safety and security, reliability
    and management technologies of applying IoT; and effective and reliable technologies
    and devices for mining and processing the data collected using IoT, etc. Nevertheless,
    IoT has shown great potential in device communication and networking, connections,
    and data collection, which has laid important foundations for cyber–physical integration.


    # 12.4 DIGITAL TWIN AND CPS


    # 12.4.1 Digital Twin and CPS


    CPS involves a holistic and compatible architecture that can contain different
    technologies and spark innovations, while DT can be merged into the architecture
    and considered as a focused application of the CPS. Characteristics of CPS (e.g.,
    cyber–physical mapping, closed-loop control, and three-level structure) can also
    be reflected in the DT.


    +   1. Cyber–physical mapping. In CPS, each physical entity is linked with a cyber
    unit that is capable of computing, communication, and control, and deployed in
    different environments such as an embedded system or a cloud platform. As the
    cyber unit could include various algorithms, models, and rules to describe and
    analyze states and behaviors of the physical counterpart, a cyber–physical mapping
    exists between them. With respect to the DT, it emphasizes creating a high-fidelity
    virtual model for each physical entity to provide deeper insights. The model can
    operate synchronously with the corresponding physical one and perform judgment,
    analysis, evaluation, and prediction, thus forming an intuitive mapping to the
    physical entity.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '2. Closed-loop control. For CPS, its essence is to construct a closed-loop
    control between the physical and cyber worlds to monitor and coordinate the physical
    processes efficiently. Through using multiple sensors mounted on physical devices
    and in the environment, large-scale distributed data acquisition can be enabled.
    After data processing and analysis, control orders can be generated and fed back
    to the actuators for execution. For the DT, the high-fidelity models in the cyber
    world can provide intuitive evaluation and prediction, then the fused data can
    capture comprehensive information to support more accurate decision making, and
    finally services will invoke functions of the DT based on demands to control corresponding
    physical processes.


    3. Three-level structure. CPSs can be classified into three levels, including
    the unit level (e.g., a single machine), system level (e.g., a production line),
    and SoS level (e.g., a shop-floor) [2]. The front level is the implementation
    foundation for the latter. At each level, the CPS is deployed with sensors, actuators,
    and embedded systems and supports communication, computing, and control. DTs also
    include the three levels as stated in Chapter 8, Digital Twin and Cloud, Fog,
    Edge Computing. For DT in each level, besides physical entities with sensors,
    actuators, and embedded systems, it also requires high-fidelity virtual models,
    fused data, on-demand services as well as connections among these elements. The
    DTs attach great importance on models and data, and are easy to use.


    DT carries the characteristics of CPS, and DT elements (e.g., high-fidelity models,
    fused data, and on-demand services) also make the DT have its own advantages.
    Combining with these elements, the CPS can be implemented in a more intuitive
    and efficient way. Therefore, in the next section, an implementation framework
    of DT-based CPS is proposed.


    # 12.4.2 Implementation of Digital Twin-Based CPS


    As shown in Fig. 12.1, in the CPS framework, a closed loop can be formed between
    the physical and cyber worlds through data collection, management and analysis,
    decision making, and control order execution. Elements of DT such as the physical
    entities (PEs), virtual entities (VEs), services (Ss), and DT data (DD) are merged
    with the CPS framework and enhance the functions of CPS, especially on the cyber
    side.


    The physical world mainly consists of PEs, which refer to the physical entities
    with sensory devices, RFID tags, embedded systems, and'
  merge: -1
  img_proc: true
- pgno: 248
  md: '![](img/5042607b423be4a5ee3f15dae22cc5bb_248_0.png)


    # Figure 12.1 Implementation of DT-based CPS.


    actuators. The PEs can be connected with each other to form a distributed network.
    Data from the network can be collected and transmitted to the cyber side for analysis,
    while orders will be fed back to control and coordinate the operations of the
    PEs.


    In the cyber world, the main aim of the DT is to create virtual mirrors (i.e.,
    VEs) to simulate states and behaviors of the corresponding PEs. The VEs operate
    synchronously with the physical counterparts, record real-time data, and generate
    a large amount of simulated data on the geometric and physical properties, behaviors,
    and rules. With VEs, insights into the PEs can be obtained without disturbing
    the normal operations, and data from different stages (e.g., design, manufacturing,
    and maintenance) can be integrated. Simulated data from VEs and real data from
    PEs are stored in DD and managed by the database tools. Besides, the DD also includes
    data from services and domain knowledge. These data are fused and analyzed with
    different algorithms, such as machine learning, principal component analysis,
    and statistics. Combining with data from multiple sources, data analysis can be
    performed to capture more accurate and comprehensive information. Based on the
    analysis results, decision making will be made for process control, scheduling,
    maintenance, etc. Before actual execution, VEs can be used to validate the decisions
    in an intuitive way and provide optimization advice through simulation to avoid
    costly mistakes. Finally, control orders can be generated and provided to the
    physical world to guide the operations of PEs. Services supported by DD and VEs
    can be deployed on computers, tablets, and mobile phones, while encapsulating
    related functions into standard forms with user-friendly interfaces.'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'By using the services, operators can monitor the physical processes in real-time,
    obtain relevant engineering information and knowledge, and make necessary judgments
    through manual intervention.


    With the DT, CPS can be enhanced using realistic simulation, fused data, and services,
    which could bring efficiency improvements and economic benefits. In the DT-based
    CPS framework, connections exist within the physical world and cyber world, and
    even across the two worlds. Realization of the ubiquitous connections for the
    framework is a key issue. In the following section, IoT is introduced to address
    this.


    # 12.5 IOT IN DIGITAL TWIN-BASED CPS


    As shown in Fig. 12.2, IoT connects PEs in the physical world, and VEs, DD, and
    Ss in the cyber world, while coupling the physical and cyber elements tightly.


    In the physical world, sensors and actuators deployed on different PEs are connected.
    Data from machine tools, robots, materials, and the environment can be collected
    in real-time by sensory devices, such as RFID tags, temperature and humidity sensors,
    electric current meters, flow meters, cameras, etc. As the data are transmitted
    with different communication protocols (e.g., RS232/485, ZigBee, Wi-Fi, and Bluetooth),
    data exchange is difficult. To address this problem, gateway devices are deployed
    to analyze the communication protocols, transform the data into standard encapsulation,
    and support standard data exchange. Besides, gateway devices such as Industrial
    IoT Hub (II-hub) developed by Tao et al. [45] can also perform data computing,
    so that conditions of different PEs can be converged and analyzed in real-time,
    and the corresponding control orders will be generated according to the analysis
    results. The orders can be transmitted to computers, tablets, or phones through
    Wi-Fi, thus guiding operators to carry out adjustments on the PEs, or be directly
    transmitted to the actuators of the equipment to control their operations. For
    example, according to the collected machining speeds of different machine tools,
    the transport time, frequency, and path of automated guided vehicles (AGVs) can
    be regulated accordingly.


    However, as data processing and analysis performed in the physical world are relatively
    limited, large-scale computing and simulation still need to be carried out in
    the cloud environment deployed in the cyber world. In this world, cyber elements
    of DT (i.e., DD, VEs, and Ss) exist and connect with each other. VEs operate in
    professional software such as'
  merge: -1
  img_proc: true
- pgno: 250
  md: '![](img/5042607b423be4a5ee3f15dae22cc5bb_250_0.png)


    # Figure 12.2 IoT in DT-based CPS.


    Auto CAD, ADAMS, and MATLAB, and Ss mainly consists of application software developed
    using standard programming languages such as Java and C. The two elements can
    build connections with databases and excel spreadsheets in DD through ready-made
    encapsulated interfaces, such as Open Database Connectivity (ODBC). Based on the
    connections, data in DD can be read to support the operations of VEs and Ss, while
    simulated data and service data can be injected into DD continuously. Connections
    between VEs and Ss can be implemented in different ways, such as building shared
    documents or realizing bidirectional communication via socket technology. Through
    the connections, VEs can be provided to Ss to make services more intuitive and
    interactive, and services in Ss can be invoked to evaluate and calibrate the VEs.


    Connections between the physical and cyber worlds enable the closed-loop control.
    Through conversion in the gateway devices, real-time data from PEs are transformed
    into a unified format and transmitted'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'to the cloud through wired (e.g., Ethernet) or wireless (e.g., 2G, 3G, and
    4G) access modes. The data can be stored in DD and fused with data from VEs and
    Ss. Based on DD, VEs will perform accurate analysis and prediction of the physical
    counterparts, and Ss can provide encapsulated services. The simulation results
    and services can be presented to operators in the physical world through human–machine
    interfaces or transformed into control orders and then delivered to actuators
    of the physical equipment directly.


    With IoT technology, physical and cyber elements in DT-based CPS form a hybrid
    communication network that enables the elements to connect and exchange data with
    each other. In the network, interactions within the physical and cyber worlds
    are enabled, which allows the physical world to be monitored and controlled by
    the computer-based cyber systems.


    # 12.6 SUMMARY


    DT can be considered as a focused application of CPS. On one side, the DT inherits
    characteristics of CPS such as cyber–physical mapping and closed-loop control
    to make the physical and cyber worlds interactive and integrated. On the other
    side, elements of DT can be combined with the CPS framework to support the high-fidelity
    simulation, data fusion, and service invocation, thus providing the CPS with more
    efficient data analysis and decision making. In this chapter, the DT and CPS are
    viewed from several aspects and a framework of DT-based CPS is proposed. IoT technology
    is applied to the framework to realize the ubiquitous connections within and across
    the physical and cyber worlds.


