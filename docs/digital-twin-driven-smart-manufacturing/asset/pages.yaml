    # 5.2 FRAMEWORK OF EECM IN DIGITAL TWIN SHOP-FLOOR


    In this section, a machine tool is taken as an example to illustrate the framework
    of EECM in DTS. As shown in Fig. 5.1 [2], the framework describes the EECM compositions,
