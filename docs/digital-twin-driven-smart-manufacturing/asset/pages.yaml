  md: '# PREFACE


    With the rapid developments of new technologies, such as cloud computing, Internet
    of Things (IoT), big data analytics, and artificial intelligence (AI), the smart
    manufacturing era has arrived. Accordingly, various national manufacturing development
    strategies have been put forward, such as Industry 4.0, Industrial Internet, manufacturing
    based on cyber-physical system (CPS), and Made in China 2025. It is clear that
    achieving cyber-physical fusion is a crucial step for the implementation of smart
    manufacturing. Digital twin (DT) is introduced as a pragmatic way for the cyber-physical
    fusion. It helps to develop a smarter manufacturing system with higher efficiency
    and reliability.


    In this book, the authors apply the DT to build high-fidelity digital mirror models
    for manufacturing resources, enhance cyber-physical interactions, and fuse data
    from both the cyber and physical worlds. The DT is also combined with the new
    technologies to better accomplish complex tasks. It is expected that this research
    work could contribute to the pervasive applications of smart manufacturing.


    This book is a summary of the authors’ studies on DT and its applications in manufacturing.
    It has 12 chapters, which are classified into three parts. Part 1 includes Chapter
    1, Background and Concept of Digital Twin; Chapter 2, Applications of Digital
    Twin; and Chapter 3, Five-Dimension Digital Twin Modeling and Its Key Technologies;
    mainly introducing the background and connotation of the DT. Chapter 1 investigates
    the development background and concept of the DT, then discusses its values from
    seven aspects. Chapter 2 reviews the state-of-the-art for the DT in both academia
    and industry, and describes observations from these works. Chapter 3 analyzes
    new requirements for the DT and proposes an innovative five-dimension DT model.
    The modeling methods and key technologies are also researched. Based on this,
    part 2, including Chapter 4, Digital Twin Shop-Floor; Chapter 5, Equipment Energy
    Consumption Management in Digital Twin Shop-Floor; Chapter 6, Cyber-Physical Fusion
    in Digital Twin Shop-Floor; and Chapter 7, Digital Twin Driven Prognostics and
    Health Management; is developed to integrate the DT with manufacturing activities
    seamlessly. Chapter 4 puts forward the concept of digital twin shop-floor (DTS)
    and studies its implementation methods and key technologies. Chapter 5 explores
    the energy consumption'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'management of equipment in the DTS and highlights potential advantages. Chapter
    6 discusses cyber–physical fusion in the DTS from four aspects and studies the
    related criteria and technologies. Chapter 7 proposes a DT driven prognostics
    and health management method for complex equipment. In part 3, the DT is fused
    with the new technologies to achieve greater efficiency in manufacturing operations.
    Chapter 8, Digital Twin and Cloud, Fog, Edge Computing, describes the combination
    of the DT with cloud, fog, and edge computing to form a hierarchical structure.
    Chapter 9, Digital Twin and Big Data, compares the DT with big data and integrates
