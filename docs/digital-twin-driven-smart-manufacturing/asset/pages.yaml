  md: '# 6.6 SERVICES FUSION


    The SDTD that fuses the physical and virtual data not only can reflect the states
    of the PS and the VS, but also drive their operations. The actual demands during
    the operation of the DTS, such as energy consumption management, precise control,
    and predictive maintenance, involve a series of complex and dynamic smart decision-making
    problems. The complexity and dynamism are due to the dynamic and uncertain environment,
    uncertain states of physical elements, dynamic changes of production tasks, and
    diverse objectives and constraints. Services can be used to build an important
    bridge between the manufacturing physical space and the virtual space, which helps
    to realize smart interconnections and operations [30,31]. The ultimate goal of
    the physical elements fusion, models fusion, and data fusion in the DTS is to
    provide various services required in the production based on the SDTD in combination
    with the existing information systems (e.g., MES). The services herein include
    production scheduling, product quality management, collaborative process planning
    [32], production process control, equipment health management, and energy efficiency
    optimization analysis [33]. Accordingly, smart production and management on the
    shop-floor can be achieved through fusion and collaboration of the services through
    dynamic service invocation, scheduling, and combination. The above process is
    defined as the scientific problem of data-driven services fusion (i.e., services
    fusion). The shop-floor service fusion and application mainly involve the following
    criteria and technologies [1].


    # 1. Data-Driven Service Generation


    This includes conversion methods from data to services; multilevel mapping mechanisms
    among physical elements, virtual models, data, and services; digital description
    and encapsulation for services; and services aggregation.


    # 2. Service Smart Management and Optimization


    This includes construction of shop-floor service models, comprehensive assessment
    of quality of service (QoS), service online monitoring, supply–demand matching
    mechanisms [34,35], as well as service optimization configurations.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 3. Service Fusion and Application


    This includes demand analysis for shop-floor complex coupling application, dynamic
    supply-demand matching mechanisms, service dynamic scheduling, service collaboration
    and fusion based on service combinations [36,37], and reliability assessments
    and improvement strategies for service collaboration.


    # 6.7 SUMMARY


    Cyber-physical fusion is a common challenge for advanced manufacturing strategies,
    and also a key scientific problem that needs to be solved for the deployment of
    the DTS. At present, the DTS has the following shortcomings in production and
    operation processes: (1) data collection on the shop-floor is incomplete; (2)
    virtual/digital models are difficult to establish and simulation analysis lacks
    systematism; (3) bidirectional dynamic mapping and fusion for the physical and
    virtual data are insufficient; and (4) dynamic and flexible combinations of services
    toward specific demands are lacking.


    Based on research on the concept, composition, operating mechanisms, characteristics,
    and key technologies of the DTS, this chapter designs a reference framework for
    the DTS and further proposes the scientific problem, that is, the cyber-physical
    fusion in the DTS. With respect to the composition of the DTS, cyber-physical
    fusion is divided into four different perspectives, including the physical elements
    fusion in PS, models fusion in VS, data fusion in SDTD, and services fusion in
    SSS. The corresponding criteria and key technologies for these fusions are also
    discussed. This chapter aims at providing a theoretical and technical reference
    for researchers to carry out studies on the cyber-physical fusion for the DTS.


