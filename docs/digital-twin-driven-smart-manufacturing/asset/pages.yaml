    # 7.5 SUMMARY


    In this chapter, the methods of DT modeling and DT-driven PHM are proposed for
    complex equipment. The aim of the chapter is to give an insight into PHM driven
    by DT and provide a guideline for future works. The contributions of the chapter
    are summarized as follows. First, it extends the previous three-dimension definition
    of the DT to a five-dimension definition for complex equipment, which expresses
    the properties and characteristics of the DT in a more comprehensive and realistic
    aspect. Second, the DT-driven PHM method, including the framework, the three-stage
    procedure, and the coevolution mechanism are presented in detail, which takes
    advantages of the digital mirror models, physical–virtual interaction, and data
    fusion in the DT. Third, based on the above works, a case study introduces the
    DT-driven PHM method in the yaw system and the gearbox of the WT to deal with
    different fault types. It is verified that the proposed method can predict the
    fault cause and the maintenance procedures without accessing the WT first, and
    improve the prediction accuracy of fault cause benefiting from the cyber–physical
    fusion.


    Considering the implementation costs and complexity of the DT, the proposed DT-driven
    PHM method will be useful for monitoring high-value and major equipment in a plant,
    and there must be sufficient data for DT modeling. To scale up the PHM application,
