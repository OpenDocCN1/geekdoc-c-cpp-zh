  md: 'provided to fuse them and to generate consistent and valuable information for
    planning. Driven by the fused data, the production plan service produces a plan,
    which is then given to the VS for verification. The VS finds potential conflicts
    in the plan before actual production and feeds back modification strategies to
    the service. After revision, the plan is transmitted to the resource allocation
    service, which guides the preparation for production in the PS. If the real-time
    states of resources change, modification advice can also be given back to the
    production plan service [6].


    During production, the verified plan is transmitted to the VS to predefine the
    production in virtual space. Then control orders from the VS are given to the
    PS to start the actual production process and keep it synchronized with the predefined
    one. On one hand, the real-time data generated by the PS are recorded in the VS,
    and on the other hand, simulation, evaluation, and optimization, etc. based on
    models are carried out in real time to generate orders to regulate the production
    in the PS whenever necessary. During this process, the predefined data from the
    VS are compared with the real-time data from the PS continuously. If the two parts
    are not consistent, meaning their difference exceeds the predefined threshold,
    the evaluation service driven by the fused data will be given. It judges whether
    the inconsistency is caused by the disturbances in the PS (e.g., equipment failure,
    material shortage, and emergency order) or by the inaccuracy of models in the
    VS (e.g., unreasonable setting on boundary and initial condition). If the disturbances
    exist in the PS, corresponding services, such as scheduling service, quality service,
    and congress service, will be invoked to eliminate them. These services are given
    to the VS first for verification, then transformed into control orders to regulate
    the PS. Otherwise, the inconsistency may be caused by the VS. In this case, services
    for model calibration are scheduled and implemented on the VS. The production
    plan verified by the previous models shall be regulated based on the calibrated
    ones, while the production process will be adjusted accordingly [6].


    After production, the finished products are output and transported to the warehouses.
    At the same time, the history production data are achieved from the records in
    the models. Based on these data, a data mining service extracts new knowledge
    for model building and calibration. With the adjustable timeline, the VS can play
    back the historical situations, which is an effective way to identify the defects
    in previous productions as well as the corresponding solutions [6].


    Thus, DTS involves a constant evolution process along with different rounds of
    production.'
