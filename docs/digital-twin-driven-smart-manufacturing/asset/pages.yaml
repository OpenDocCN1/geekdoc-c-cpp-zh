    As the DT is constructed, the roles of different DT components are presented as
    follows [27]:


    +   1. PE is the target of PHM. Malfunctioning of any part in the PE may cause
    faults. Data of PE can reflect its current states. It mainly includes the operation
    states and the working conditions, denoted as X = {x_i | 1 ≤ i ≤ n} and C = {c_j
    | 1 ≤ j ≤ m}, respectively, where x_i is the i th actual state parameter (e.g.,
    speed, force, torque), c_j is the j th condition (e.g., environmental parameter,
    load, control order), while n and m are the numbers of parameters.


    +   2. C and X are loaded to VE, which makes the VE operate under the same working
    conditions with the PE. On one hand, the VE operates synchronously with the PE
    and generates simulated operation states, denoted as Y = {y_i | 1 ≤ i ≤ n}, where
    y_i is the mapping to x_i, representing the i th simulated state parameter, and
    n is the parameters number. On the other hand, since the VE can perform further
    analysis (e.g., stress analysis, deformation analysis, and state prediction),
    data from the VE are more abundant than those from the PE. Hence, other data from
    the VE are represented as Z = {z_k | 1 ≤ k ≤ l}, where z_k denotes the k th analysis
    parameter and l is the parameters number.'
