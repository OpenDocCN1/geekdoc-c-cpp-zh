    the cleaned data can be compared, associated, and combined to obtain fused data
    through data fusion algorithms. For example, the features of EC (e.g., trend,
    cycle, and frequency) from different data sources can be extracted through algorithms,
    such as the principal component analysis (PCA), wavelet analysis, and Fourier
    transformation, and then fused using a neural network to present a more comprehensive
    description of the EC.


