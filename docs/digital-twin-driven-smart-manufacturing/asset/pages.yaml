    # 7.3.2 Procedure


    As shown in Fig. 7.5, the procedure of the DT-driven PHM method is classified
    into three stages, that is, observation (steps 1–3), analysis (steps 4–6), and
    decision (step 7). These steps, which have been studied in the authors’ work [27],
    are described as follows.


    Step 1: DT Modeling and calibration. Establish DT for the complex equipment according
    to Section 7.2. During the operation in the following steps, if the VE deviates
    from the PE due to defects in modeling, perform calibration according to Section
    7.3.2.1.'
