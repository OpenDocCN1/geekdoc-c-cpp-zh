    [4] presented a real-time remote monitoring method using the MTConnect standard
    protocol to collect acoustic data and vibration of an air compressor. Tristo et
    al. [5] built a power consumption monitoring system for the main subsystems of
    a machine tool and the collected data are transmitted via Wi-Fi. Tao et al. [6]
    proposed a five-layer framework for resources intelligent perception and access
