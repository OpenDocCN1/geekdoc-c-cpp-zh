    6. Virtual models, data and services: Based on the data collected from the physical
    assembly scene, high-fidelity virtual models can be built to describe and support
    the assembly process, including the assembly design model, process model, demonstration
    model, and scene model. Simulated data from the models and real data from the
    physical entities can be fused to generate valuable information for virtual model
    calibration and physical assembly optimization. The models and data are stored
    in the data center and can be invoked to support pure virtual or physical–virtual
    mixed assembly scenes enabled by the VR and AR technologies. Benefiting from these
    technologies, interactive and immersive services can be provided to assembly operators
    to improve the assembly efficiency.


    In combination with VR and AR, the DT-based assembly process can be augmented
    in physical–virtual fusion. Assembly operators can be either'
