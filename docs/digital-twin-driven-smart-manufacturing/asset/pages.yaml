    of DT with virtual reality and augmented reality/mixed reality to provide more
    immersive and interactive services to the users. Finally, the DT is discussed
    as a focused application of the CPS in Chapter 12, Digital Twin, Cyber–Physical
    System and Internet of Things, and the roles of IoT in the DT are highlighted.


