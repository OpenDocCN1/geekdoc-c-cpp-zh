  md: '# 7.4.3 Digital Twin-Driven PHM for the Gearbox


    The gearbox is part ② of the physical WT in Fig. 7.3. In this case study, the
    fault causes of the gearbox include gear tooth wear, fatigue, and breakage, which
    are caused by gradual degradation. Related symbols are listed in Table 7.3 [27].


    According to step 3, the states of the gearbox in the physical and virtual WTs
    are denoted as p_a = (T_ai, T_ao) and p_e = (T_ei, T_eo), respectively. T_ai and
    T_ao are collected from the torque sensors mounted on the input and output shafts
    (i.e., part ⑦ in the physical WT in Fig. 7.3), while T_ei and T_eo are simulated
    by the virtual WT according to the transmission relations among the wind wheel,
    gearbox, and generator rotor [33]. The deviation is calculated according to Eq.
    (7.2) [27]. As ||p_e - p_a|| ≤ T_p is satisfied, the gearboxes of the physical
    and virtual WTs are considered consistent.


    ```

    ||p_e - p_a|| = sqrt((T_ei - T_ai)^2 + (T_eo - T_ao)^2) / sqrt((T_ai)^2 + (T_ao)^2)
    (7.2)

    ```


    According to step 4, to detect the degradation, the vibration signals of the gearbox
    in the physical WT are collected from the accelerometers deployed at the low speed
    stage, medium speed stage, and high speed stage of the gearbox. The energy for
    every n samples of vibration time series is calculated according to Eq. (7.3)
    [27], where a_i is the amplitude for the i th sample. Since E_v exceeds the upper
    threshold, the gearbox is considered to have degraded.


    ```

    E_v = sum_{i=1}^{n} |a_i|^2 (7.3)

    ```


