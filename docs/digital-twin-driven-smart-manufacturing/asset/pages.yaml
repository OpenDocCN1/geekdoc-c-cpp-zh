    torque, and wear) are given to the geometry models to form the physics models,
    which can analyze the physical phenomena, such as deformation, cracking, and corrosion.
    The finite element method (FEM) can be used for simulation at this level. Then
    behavior models are built to describe the machine responsive mechanisms under
    driving factors such as NC programs and disturbing factors such as manual interferences.
