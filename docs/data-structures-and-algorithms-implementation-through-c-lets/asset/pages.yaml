  md: '# CHAPTER 9

    Linked List


    # 9.1 Introduction


    If memory is allocated at compile time then it is fixed and it is not changeable.
    If our data is smaller than memory size that means some memory get waste. Linked
    list is a special type of data structure which provides easy storage. Linked list
    provide a storage at run time. It depends on user how ver much memory should be
    created.


    Linked list is a special type of list through which elements are logically connected.
    Each and every element are called node. The logically connected means one node
    is having an address of another node. The node is having two-part, data part and
    address part. The data part contains the value of element and the address part
    contains the address of next node. The address part is called next part and it
    is a pointer field.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_202_0.png)


    # Advantages'
  merge: -1
  pgno: 202
- img_proc: true
  md: '![](img/cbd38072d10706a376a60fc30bd31ea8_203_0.png)


    Fig. 9.2: Doubly linked list node


    There are following advantages of linked list.


    +   - Linked list is a dynamic data structure. It can be grown and shrink at run
    time.

    - It provides efficient memory utilization because it can allocate and deallocate
    memory at time.

    - It is easy to insert and delete element because nodes are logically connected.
    Moreover, insertion and deletion of a node is easier by shifting of address.


    # Disadvantages


    +   - A node contains more memory because a node contains more number of fields.
    Moreover, it consumes more memory.

    - The data accessing is a typical task because nodes are logically connected and
    for a specific node, it has to reach one by one.


    # 9.2 Terminology


    There are various terminologies in linked list.


    **Data field:** The data field is a value fields. Each every node contains a data
    field. All nodes are logically connected and for accessing a data field it has
    to visit one by one to each and every node.


    **Address fields:** This field stores an address of next node. Moreover, one node
    is logically connected to other node means one node is having an address of next
    node. The address field of last node is NULL. The NULL represents the end of linked
    list.'
