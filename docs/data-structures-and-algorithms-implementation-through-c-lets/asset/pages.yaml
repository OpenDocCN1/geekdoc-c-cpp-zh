  md: '# CHAPTER 7

    Stacks


    # 7.1 Introduction to Stack


    Stack is non-primitive linear data structure. This is in the form of ordered list.
    In this data structure, the insertion and deletion are performing only at one
    end. The index which is performing. The stack follows Last In First Out (LIFO)
    property, the data item inserted at the last position it will deleted first. Real
    life example of stack are: arrangements of plates in a party, arrangements of
    grain packets in warehouse etc.,


    When stack is created then the base is fixed and increment the data elements being
    incremented and it depends on the top. We increment the top one by one.


    # 7.2 Definition


    Stack is a special type of data structure which follow LIFO property. The insertion
    and deletion are perform at only one end that is top.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_128_0.png)'
  merge: -1
