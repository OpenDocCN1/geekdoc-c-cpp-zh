    mixed graph.


    +   - End Vertices or Endpoints: The two vertices joined by an edge are called
    the end vertices (or endpoints) of the edge.


    +   - Origin: If an edge is directed, its first endpoint is said to be origin
    of it.


    +   - Destination: If an edge is directed, its first endpoint is said to be the
    destination of it and the other endpoint is said to be the destination of the
    edge.


    +   - Adjacent: If there is an edge between vertices A and B then both A and B
    are said to be adjacent. In other words, Two vertices A and B are said to be adjacent
    if there is an edge whose start and end vertices are A and B.


    +   - Incident: An edge is said to be incident on a vertex if the vertex is one
    of the endpoints of that edge.


    +   - Outgoing Edge: A directed edge is said to be outgoing edge on its origin
    vertex.


    +   - Incoming Edge: A directed edge is said to be incoming edge on its destination
    vertex.


    +   - Degree: Total number of edges connected to a vertex is said to be degree
    of that vertex.


    +   - Indegree: Total number of incoming edges connected to a vertex is said to
    be indegree of that vertex.


    +   - Outdegree: Total number of outgoing edges connected to a vertex is said
    to be outdegree of that vertex.


    +   - Parallel edges or Multiple edges: If there are two undirected edges to have
    the same end vertices, and for two directed edges to have the same origin and
    the same destination. Such edges are called parallel edges or multiple edges.


    +   - Self-loop: An edge (undirected or directed) is a self-loop if its, is two
    endpoints coincide.


    +   - Simple Graph: A graph is said to be simple if there are no parallel and
    self-loop edges.


    +   - Path: A path is a sequence of alternating vertices and edges that starts
    at a vertex and ends at a vertex such that each edge is incident to its predecessor
    and successor vertex.


