    # 2. Quadratic Probing


    ```

    h(key, 0) = (h(key) + 0 + 0^2) Mod M

    h(key, 1) = (h(key) + 1 + 1^2) Mod M

    h(key, 2) = (h(key) + 2 + 2^2) Mod M

    h(key, m - 1) = (h(key) + m - 1 + (m - 1)^2) Mod M

    ...

    h(key, i) = (h(key) + c1i + c2i^2) Mod M

    i = {0, 1, 2-m - 1} and c1, c1 are constants

    ```


