    # # 11.5.1 General Properties of Spanning Tree


    We now understand that one graph can have more than one spanning tree. Following
    are a few properties of the spanning tree connected to graph G.


    +   1. A connected graph G can have more than one spanning tree.

    2. All possible spanning trees of graph G, have the same number of edges and vertices.

    3. The spanning tree does not have any cycle (loops).

    4. Removing one edge from the spanning tree will make the graph disconnected,
    i.e. the spanning tree is minimally connected.

    5. Adding one edge to the spanning tree will create a circuit or loop, i.e. the
    spanning tree is maximally acyclic.


    # # 11.5.2 Application of Spanning Tree


    There are various applications of spanning tree such as:


    +   1. Civil Network Planning

    2. Computer Network Routing Protocol

    3. Cluster Analysis


