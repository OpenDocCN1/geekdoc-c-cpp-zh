    # # 11.2 Basic Terminology of a Graph


    **Vertex:** An individual data element of a graph is called as Vertex. Vertex
    is also known as node. In the above example, 1,2,3,4 & 5 are known as vertices.


    **Edge:** An edge is a connecting link between two vertices. Edge is also known
    as Arc. An edge is represented as (startingVertex, endingVertex). For example,
    in above graph, the link between vertices 1 and 2 is represented as (1,2). In
    above Fig.11.1, there are 6 edges (i.e., (1,2), (2,3), (3,4), (4,5), (1,5), (2,4)).
    Edges are of three types.


    +   1. **Undirected Edge:** An undirected edge is a bidirectional edge. If there
    is an undirected edge between vertices A and B then edge (1,2) is equal to edge
    (2,1).

    2. **Directed Edge:** A directed edge is a unidirectional edge. If there is a
    directed edge between vertices A and B then edge (1,2) is not equal to edge (2,1).

    3. **Weighted Edge:** A weighted edge is an edge with cost on it.


    **Undirected Graph:** A graph with only undirected edges is said to be undirected
    graph.


    **Directed Graph:** A graph with only directed edges is said to be directed graph.'
