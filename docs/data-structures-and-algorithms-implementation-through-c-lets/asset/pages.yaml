- img_proc: true
  md: '# 10.2 Tree Terminology


    +   - Path: Path refers to the sequence of nodes along the edges of a tree. Fig.10.1,
    path from A to J is A-B-F-J.


    +   - Root: The node at the top of the tree is called root. There is only one
    root per tree and one path from root to any node. Fig.10.1, A is a root of the
    tree.


    +   - Parent: Any node except the root node has one edge upward to a node parent.
    In Fig.10.1, the node B, C, D, F, and I are the parents.


    +   - Child: The node below a given node connected by its edge downward is called
    child node. In Fig.10.1, there are three Childs of I such as K, L and M.


    +   - Leaf: The node which does not have any child node is called the leaf node.
    In Fig.10.1, nodes E, J, G, H, K, L and M are all leaf nodes.


    +   - Subtrees: Subtree represents the descendants of a node.


    +   - Visiting: Visiting refers to checking the value of a node when control is
    on the node.


    +   - Traversing: Traversing means passing through nodes in a specific order.


    +   - Levels: Level of a node represents the generation of a node. If the root
    node is at level 0, then its next child node is at level 1, its grandchild is
    at level 2, and so on.


    +   - Keys: Keys represent a value of a node based on which a search operation
    is to be carried out for a node.


    +   - Degree of a tree: Number of subtrees of a node.


    +   - Degree of a node: Maximum degree of a node.


    +   - Siblings: The child nodes of a same parent node.


    +   - Depth: This is maximum depth of the tree from root node to leaf node. If
    the level of the root is 0 then the depth of the tree is maximum level+1. If the
    depth of root is 1 then depth of the tree is maximum level.


    # 10.3 Binary Tree


    Binary tree is a special type of tree in which every node can have a maximum of
    2 children. One is known as left child and the other is known as right child.'
