    # Transitive Property


    f(n) = O (g(n)) & g(n) = O (h(n)) then

    f(n) = O (h(n))

    f(n) = Ω (g(n)) & g(n) = Ω (h(n)) then

    f(n) = Ω (h(n))

    f(n) = Θ (g(n)) & g(n) = Θ (h(n)) then

    f(n) = Θ (h(n))


    # Some Other Properties


    f(n) = O (f(n/2))

