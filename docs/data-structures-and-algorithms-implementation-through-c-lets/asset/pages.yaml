  md: '# ## 4.6 Fundamental Need of Recursion


    There are some important points for implementing a good program


    +   i. Base case: This is the position to terminate the recursion. First, we must
    identify the terminating condition for breaking a recursive code. This is very
    important and mandatory condition.

    ii. Condition: This is a condition where a recursion will be terminated.

    iii. Any recursive code creates a memory that is why recursive call is very challenging
    task.

    iv. The variables involved in a recursion are stored in the form of stack.


    # ## 4.7 Iteration and Recursion


    Iteration is the repetition of a function or process in a computer program. Iterations
    of functions allow multiple blocks of data to be processed in sequence. This is
    typically done by using a “while loop” or “for loop”. These loops will repeat
    a process until a certain number or case is reached. Recursive functions also
    use iteration, though instead of repeating a process, the entire function repeats
    itself.


    # Difference between Iteration and Recursion


    | Iteration | Recursion |

    |---|---|n| The statements run repetitively until the condition is not satisfied.
    | In this technique, function is called within the definition of function. |

    | There are four cases in iteration: initialization,condition, execution and updating
    | There is terminating statement within if condition. |

    | The recursive problem can be solved with the help of recursion | The solutions
    of all problems are not possible with the help of recursion. |

    | Memory utilization is easier. | This is not good way for simple and easy problems.
    |


    Table. 4.1: Iteration versus Recursion


