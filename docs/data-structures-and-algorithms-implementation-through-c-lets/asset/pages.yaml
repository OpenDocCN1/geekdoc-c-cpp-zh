    # Algorithm for In-order Traversal


    +   Step 1. Check if the current node is empty / null.

    Step 2. Traverse the left subtree by recursively calling the in-order function.

    Step 3. Display the data part of the root (or current node).

    Step 4. Traverse the right subtree by recursively calling the in-order function.

    Step 5. In a search tree, in-order traversal retrieves data in sorted order.


    # Algorithm for Post-order Traversal


    +   Step 1. Check if the current node is empty / null.

    Step 2. Traverse the left subtree by recursively calling the post-order function.

    Step 3. Traverse the right subtree by recursively calling the post-order function.

    Step 4. Display the data part of the root (or current node).


