    A priority queue is a collection of elements where elements are stored according
    to their priority levels. The insertion and deletion can be done through priority
    of elements. There are following important points about the priority queue. The
    element having higher priority is processed before any element of lower priority.
    If elements having same priority are there then the element will be inserted first
    in the queue.


    The application of priority queue is for job scheduling in the operating system.
    The job having higher priority would get processed first.


