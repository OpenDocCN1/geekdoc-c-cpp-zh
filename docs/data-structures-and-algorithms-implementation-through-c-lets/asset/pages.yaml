    # # 8.4.1 Some Important Points about Circular Queue


    +   1. Front always points to first element.

    2. If front=rear circular queue will be empty.

    3. When insert a new element then the value of rear is increment by one

    i.e. rear=rear+1.

    4. When delete a new element then the value of front is increment by one

    i.e. front=front+1.


    # # 8.4.2 Insertion in Circular Queue


    The insertion process is similar to linear queue but it emphasize on front and
    rear.'
