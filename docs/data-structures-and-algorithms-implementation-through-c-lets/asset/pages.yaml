  md: 'In a weighted graph, a minimum spanning tree is a tree that has minimum weight
    than all other spanning trees of the same graph. In real-world situations, this
    weight can be measured as distance, congestion, traffic load or any arbitrary
    value denoted to the edges.


    # 11.6.1 Minimum Spanning-Tree Algorithm


    There are two types of algorithms for minimum spanning tree.


    +   1. Kruskal''s Algorithm

    2. Prim''s Algorithm


    # 11.6.1.1 Kruskal''s Algorithm


    Kruskal''s algorithm is used to find the minimum cost spanning tree and uses the
    greedy approach. This algorithm treats the graph as a forest and every node has
    as an individual tree. A tree connects to another only and only if, it has the
    least cost among all available options and does not violate MST properties.


    There are following steps for Kruskal''s algorithm.


    +   MST-KRUSKAL(G, w)

    1. A ← ∅

    2. for each vertex v - V[G]

    3. do MAKE-SET(v)

    4. sort the edges of E into non-decreasing order by weight

    5. for each edge (u, v) E, taken in nondecreasing order by weight

    6. do if FIND-SET(u) ≠ FIND-SET(v)

    7. then A ← {(u, v)}

    8. UNION(u, v)

    9. return A


