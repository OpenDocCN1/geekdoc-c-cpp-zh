    # # 2. Open Addressing


    In this method, we are trying to store key within a table itself.

    There are following properties of open addressing:


    +   1. No extra storage is required in the form of linked list

    2. If we hash to a particular slot but if it already occupied a slot then it will
    hash again, with different hash function until an empty slot is found. This process
    will continue until m times.


