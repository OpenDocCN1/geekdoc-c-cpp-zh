    # # Steps for Implementing Binary Search


    There are following steps for implementing binary search Step 1. Start Step 2.
    Give a search element from the user Step 3. Sort the list of elements Step 4.
    Get the middle element in the sorted list


    Step 5. Compare, the search element with middle element in the sorted list.


    Step 6. If both are matching, then display “Element Found” and stop Step 7. If
    both are not matching, then check whether the search element is smaller or larger
    than middle element.


    Step 8. If the search element is smaller than middle element, then repeat steps
    3, 4 and 5 for the left sublist of the middle element.


    Step 9. If the search element is larger than middle element, then repeat steps
    3, 4 and 5 for the right sublist of the middle element.


    Step 10. Repeat the same process until we find the search element in the list
    or until sublist contains only one element.


    Step 11. If that element also does not match with the search element, display
    “Element not found” and stop.


