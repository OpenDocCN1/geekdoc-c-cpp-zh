- img_proc: true
  md: 'Algorithm is a combination of sequence of finite number of steps defined to
    solve a particular problem. It is a well defined procedure which will take input
    and produce output. The input and output may be some data or values.


    # Properties of an algorithm:


    +   - **Input**: Zero or more input but is be finite.

    - **Output**: It must contain at least one output and it should also be finite.

    - It should produce the output within the time.

    - It should be deterministic or we can say each every step should be unambiguous.

    - **Simplicity**: Every step in an algorithm should perform at least task.

    - It should be independent of programming languages or be generic to all programming
    languages.


    # 2.4 Steps to Construct an Algorithm


    There are following steps for constructing an algorithm:


    +   - **Problem Definition**: Know the problem clearly

    - **Constraint to be satisfied**: Requirement needed to satisfy the problem

    - **Design the problem**: Gather information to solve the problem

    - **Draw the flow chart**: Diagram for understanding the problem

    - **Validation or Testing**: Track an algorithm for different inputs

    - **Implementation**: Convert algorithm to programming languages

    - **Analysis**: Tracing and debugging the code, posteriori analysis required.


    Algorithms are used to convert our problem into one by statement. These statements
