    # 11.7 Shortest Path


    An edge-weighted digraph is a digraph where we associate weights or costs with
    each edge. A shortest path from vertex s to vertex t is a directed path from s
    to t with the property that no other such path has a lower weight.

    There are following properties of shortest path.


    +   1. Paths are directed. A shortest path must represent the direction of its
    edges.

    2. The weights are not necessarily distances. Geometric intuition can be helpful,
    but the edge weights might represent time or cost.

    3. Not all vertices will be reachable. If t is not reachable from s, there is
    no path at all, and therefore there is no shortest path from s to t.

    4. Negative weights introduce complications. For the moment, we assume that edge
    weights are positive (or zero).

    5. Shortest paths are normally simple. Our algorithms ignore zero-weight edges
    that form cycles, so that the shortest paths they find no cycles.

    6. Shortest paths are not necessarily unique. There may be multiple paths of the
    lowest weight from one vertex to another; we are content to find any one of them.

    7. Parallel edges and self-loops may be present. In the text, we assume that parallel
    edges are not present and we use the notation v->w to refer to the edge from v
    to w, but our code handles them without difficulty.


    There are two types of algorithm for getting shortest path.


    +   1. Dijkstra''s Algorithm

    2. Bellman Ford''s Algorithm'
