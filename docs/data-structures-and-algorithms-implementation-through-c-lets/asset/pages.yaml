    # ## 11.1 Introduction to Graphs


    Graph is a collection of vertices and arcs which connects vertices in the graph.
    Moreover, a graph is a collection of nodes and edges which connects nodes in the
    graph. Generally, a graph G is represented as G = (V, E), where V is set of vertices
    and E is set of edges.


    There are two components that consist of a graph.


    +   1. A finite set of vertices also called as nodes.

    2. A finite set of ordered pair of the form (u, v) called as edge. The pair is
    ordered because (u, v) is not same as (v, u) in case of directed graph (di-graph).
    The pair of form (u, v) indicates that there is an edge from vertex u to vertex
    v. The edges may contain weight/value/cost.


    There are various real-life applications of graph:


    +   1. Graphs are used to represent networks.

    2. The networks may include paths in a city or telephone network or circuit network.

    3. Graphs are also used in social networks like Facebook, twitter, etc.

    4. Graphs are also used in airlines and satellite. Following is the representation
    of a graph with 5 vertices'
