    # # 10.16 M-way Tree


    In the previous topic we have also studied binary search trees as special case
    of binary trees where key values of the left child of a node is always less than
    the key value of the node itself and key values of right child of a node is always
    greater than the key value of the node itself. Such an arrangement'
