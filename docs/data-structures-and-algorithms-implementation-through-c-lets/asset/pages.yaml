    # ## 12.1 Introduction


    Search is a technique of finding a specific element from a list of elements. Moreover,
    searching is the process of locating given value position in a list of values.


    # ## 12.2 Types of Searching


    There are two types of searching technique:


    +   1. Linear Search

    2. Binary Search


    # ### 1. Linear Search


    Linear search means to find an element from list of elements, it is also called
    sequential search. In this searching technique, the element search from a list
    by one by one. The worst case time complexity of linear search is O(n), where
    n is total number of elements in the list.


    This search process starts comparing the search element with the first element
    in the list. If both are matching then results with element found otherwise search
    element is compared with next element in the list. If both matched, then the result
    is “element found”. Otherwise, repeat the with the next element in the list until
    search element is compared with last element in the list, if that last element
    also doesn''t match, the result is “Element not found in the list” display. That
    means, the search element is compared with element by element in the list.


    # ## Steps for Implementing Linear Search


    There are following steps for implementing linear search.'
