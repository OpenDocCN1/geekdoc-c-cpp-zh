- img_proc: true
  md: '# # 7.3 Stack Implementation


    There are two types of implementing a stack.


    +   1. Static Implementation


    +   2. Dynamic Implementation


    **Static Implementation:** It use array for static implementation. This is very
    easy implementation but the creation of stack is not an easy task because first
    of all it has to mention a size of stack. This implementation is very efficient
    for utilizing a memory.


    **Dynamic Implementation:** It uses pointer or linked list for dynamic implementation.
    In dynamic implementation, we use pointers and nodes are created at run time.
    There is no overflow condition for dynamic implementation.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_129_0.png)


    # # 7.4 Operations of Stack


    **Push Operation**


    When new element is inserted into the stack, it is called push operation. When
    we push element in stack then it has to increment the value of top.


    **Pop Operation**


    When element is deleted from the stack, it is called pop operation. When we pop
    element from stack then it has to decrement the value of top.'
