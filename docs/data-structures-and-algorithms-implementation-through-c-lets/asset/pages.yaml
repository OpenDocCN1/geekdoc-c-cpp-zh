  md: '# # CHAPTER 8

    # Queues


    # ## 8.1 Introduction to Queue


    Queue is non-primitive linear data structure. This is in the form of ordered list.
    In this data structure, the insertion and deletion are done at two ends called
    front end and rear end. In the front end, we delete the data form queue and rear
    end is used for inserting data into the queue. The queue follows First In First
    Out (FIFO) property, the data item inserted at the first position will be deleted
    first. There are various real life example where queue is used, such as making
    a queue for getting tickets in railway stations, cinema hall etc.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_163_0.png)


