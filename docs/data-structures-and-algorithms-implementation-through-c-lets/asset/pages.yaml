    # 8.4 Circular Queue


    In linear queue, when we delete an element from front pointer then the front pointer
    will increment by one. Suppose there are 5 elements present in linear queue and
    we delete 3 elements from front. After deleting we want to insert one more element
    but we can''t insert because insertion can be done through rear and rear pointer
    is already pointing to last element. Moreover the vacant space can''t be utilized
    in linear queue as shown in Fig. 8.8. To overcome this problem, we create a circular
    queue.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_177_0.png)


    Fig. 8.8: Deletion from linear queue


    Circular queue utilize the memory and the rear reaches the max value then it will
    point to first vacant space. In fig.8.8 the rear is pointing 50 and suppose 60
    is inserted then with the linear queue we can''t do with the circular queue we
    can. Because in circular the rear will point to first block and it can insert
    three elements. The representation of circular queue is shown in Fig. 8.9.'
