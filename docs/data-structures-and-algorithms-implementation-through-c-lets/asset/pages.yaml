    speed and organized storage of information. If our data or information is properly
    organized then searching process will take less amount of time and get the desired
    result faster.


    The organization of data directly depends on the execution time. If information
    is well organized then the process gives fast result. Here process is nothing
    but a set of instruction. This set of instruction is termed as program.


    # 2.2 Why to Study an Algorithm?


    The study of algorithms, gives us a language to express performance as a function
    of problem size. If there is a software company and some people have created the
    particular software of that company. After some time, if there is some change
    in that software and some members of that technical team has switched the companies,
    this task will be very complicated for the new members as they will not understand
    the coding. But if the proper documentation is available or an algorithm of the
    code is available then it is easy to understand the software. That is why algorithm
    plays an important role for constructing the software.


    # 2.3 Definition of an Algorithm'
  merge: -1
