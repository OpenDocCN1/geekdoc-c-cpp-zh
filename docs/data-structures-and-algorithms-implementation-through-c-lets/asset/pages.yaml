    # 10.7 Tree Traversal


    Tree traversal is a process to visit all the nodes of a tree. Because, all nodes
    are connected through edges we always start from the root node. That is, we cannot
    randomly access a node in a tree.


    There are three types of tree traversals.


    +   1. In-order Traversal

    2. Pre-order Traversal

    3. Post-order Traversal


    Generally, we traverse a tree to search or locate a given item or key in the tree
    or to display all the values it contains.


