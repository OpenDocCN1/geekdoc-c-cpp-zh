  md: '# Traverse Operation


    When elements have to display on the screen or visit all element, this operations
    is called traverse operation. The traversing operations depends on the top value.


    # Algorithm for push, pop and traverse operation in stack


    # Push


    +   Push(stack [MAX SIZE], item)

    Step. 1. Initialize

    Step. 2. Set top=-1

    Step. 3. Repeat step 3 to 5 until top< max size-1

    Step. 4. Read, Item

    Step. 5. Set top=top+1;

    Step. 6. set stack[top]=item

    Step. 7. Print “stack Overflow”,


    # Pop


    +   Pop(Stack[MAX SIZE], item)

    Step. 1. Repeat step 2 to 4 until>=0

    Step. 2. item=stack[top]=top+1;

    Step. 3. set top=top-1

    Step. 4. Print “No item is deleted"

    Step. 5. Print “Stack is underflow”


    # Traverse


    +   Traverse(stack [MAX SIZE], item)

    Step. 1. Initialize

    Step. 2. Set i=top

    Step. 3. Repeat step 3 to 5 until top< max size-1 Step. 4. Print, Item

    Step. 5. Set i=i+1;


    # 7.5 Applications of Stack


    There are various types of applications of stack:


    +   1. Recursion

    2. Reverse polish notation (Infix to postfix notation]'
