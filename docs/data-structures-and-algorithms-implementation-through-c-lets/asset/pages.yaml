  md: '$2n^2 + 3n - 1 = O(n^2)$


    # Solution:


    We need to find $c$ and $n_0$ such that:


    $2n^2 + 3n - 1 \le cn^2$ for all $n \ge n_0$.


    Divide both sides by $n^2$, getting:


    $2 + 3/n - 1/n^2 \le c$ for all $n \ge n_0$.


    If we choose $n_0$ equal to 1, then we need a value of $c$ such that:


    $2 + 3 - 1 \le c$


    We can set $c$ equal to 5. Now we have:


    $2n^2 + 3n - 1 \le 5n^2$ for all $n \ge 1$.


    # Example 26: Show that $n^4 \neq O(n^3)$.


    # Solution:


    Let''s assume to the contrary that


    $n^4 = O(n^3)$


    Then there must exist constants $c$ and $n_0$ such that


    $n^4 \le cn^3$ for all $n \ge n_0$.


    Dividing by $n^3$, we get:


    $n \le c$ for all $n \ge n_0$.


    But this is not possible; we can never choose a constant $c$ large enough that
    $n$ will never exceed it, since $n$ can grow without bound. Thus, the original
    assumption, that $n^4 = O(n^3)$, must be wrong so $n^4 \neq O(n^3)$.


    # 2.7.1 Properties of Asymptotic Notation


    There are various types of properties of asymptotic notation. Some of the properties
    are:


    # Reflexive property


    +   - f(n) = O(f(n))


    +   - f(n) = \Omega(f(n))


    +   - f(n) = \Theta(f(n))'
