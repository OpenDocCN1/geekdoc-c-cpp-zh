  md: '# Inserting a Node at the Beginning Algorithm


    An Algorithm to insert a new node at the beginning of a doubly linked list is
    given below:


    +   1. Allocate memory for the new node.

    2. Assign value to the data field of the new node.

    3. Assign LEFT and RIGT links to NULL

    4. Make the Right link of the new node to point to the head of the list. And make
    LEFT link of the head to point to the new node.

    5. Finally reset the head pointers. That is, make it to point to the new node
    which has inserted at the beginning


    ![](img/cbd38072d10706a376a60fc30bd31ea8_233_0.png)


    An algorithm to insert a node at the end of a doubly linked list is given below:


    +   1. Allocate memory for the new node

    2. Assign value to the data field of the new node

    3. Set the LEFT and RIGHT links to the node


    If the list is not empty traverse the list till the last and made the RIGHT link
    of the last node to point to the new node and LEFT link of the new node to point
    to the last node'
