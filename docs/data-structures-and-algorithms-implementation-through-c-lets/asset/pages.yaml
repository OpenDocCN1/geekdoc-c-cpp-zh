  md: '# CHAPTER 1


    # Algorithms and Flowcharts


    # 1.1 Introduction of Algorithm


    First of all, before making any program or software, we have to make the documentation
    of it. This documentation provides the information about that entire software.
    This program or software can be deployed in any programming language, but if it
    is necessary to change something later in that program or software then its algorithm
    or documentation is very important.


    By studying the documentation, you get complete information about the software
    and make some changes in it too easily. So, we can say that the understanding
    of the software increases through algorithms.


    Let us take an example, if the software is being created for a shopping complex
    and its documentation is being prepared. Now, if we have to make some changes
    to the software according to the needs of the customer, it is very important to
    be aware of the outline. If the software needs to extend and we have proper documentation
    of it, then the software developer will not depend on the developer who develop
    that software.


    # 1.2 What is an algorithm?


    Let''s take the problem for making a tea. For making a tea, there are following
    steps:


    +   - Set a metallic saucepan on the stove top or hob.

    - Add the piece of freshly crushed ginger.

    - Add tea leaves in it.

    - Add milk according to choice.

    - Filter a solution with the help tea strainer.

    - Put the filtered solution into cups.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '7. Serve it.


    What we are doing for making a tea which is our problem. We are writing step by
    step procedure for solving it. Therefore, the definition of an algorithm is “It
    is a step by step procedure to solve a given problem. Moreover, an algorithm accepts
    an input list of data and creates an output list of data.” Fig. 1.1 shows the
    basis concept of an algorithm.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_16_0.png)


    Fig 1.1: Basic structure of algorithm


    We can also analysis an algorithm in time of and space complexity. The analysis
    of an algorithm has discussed in next chapter.


    # 1.3 Flowcharts


    Sometimes an algorithm can be a difficult to understand. For improving understandability
    of an algorithm, the developer makes a flowchart.


    Suppose, if you visit a university and you have to go to a specific department
    then you go through a flowchart. Moreover, via map a person can easily reach to
    destination place. A flowchart is a pictorial of graphical representation of an
    algorithm.


    # 1.3.1 Reason to Use Flowcharts


    There are various reasons to use a flowchart.


    +   1. **Documentation and training**: Flowcharts are ideal for documentation
    and training purposes. Flowcharts are also very beneficial for training materials
    because they''re visually stimulating while being easy to understand. Ultimately,
    this keeps the reader''s attention, so they learn faster.


    +   2. **Workflow management**: Flow chart is used for continuous improvement
    of business process all times. This decides when we meet to customer improvement.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '+   3. Programming: In the world of algorithms, you will find complexity of
    algorithm. Information Technology (IT) demands flowcharts for programming, and
    makes the process faster and smoother. Flowcharts will lead to faster, more efficient
    coding with fewer errors along the way.


    +   4. Troubleshooting: Multiple problems and solutions can be presented, which
    makes algorithms large in size. When created properly, a flowchart for troubleshooting
    of the module takes less time.


    +   5. Quality assurance: Modules mapped with flowcharts ensure that regulatory
    requirements are followed all times. It is an essential process, and is made easier
    with the use of flowcharts.


    +   6. Process flow management services: It increases business efficiency through
    flowchart.


    # 1.4 Advantages


    +   1. Communication: Flow Charts are better way of communicating the logic of
    a system.


    +   2. Effective Analysis: Problem can be effectively analysed with the help of
    flowchart


    +   3. Proper Documentation: Flow charts serve as a good program documentation,
    which is needed for various purposes.


    +   4. Efficient Coding: The flow charts act as a guide or blueprint during the
    systems analysis and program development phase.


    +   5. Proper Debugging: The flow chart helps in debugging process.


    +   6. Efficient Program Maintenance: The maintenance of operating program becomes
    easy with the help of flow chart. It helps the programmer to put efforts more
    efficiently on that part.


