    # ## 2.6 Complexity of an Algorithm


    It is very suitable to classify an algorithm based on the relative amount of time
    and relative amount of space. The growth of the function requires time, space
    and function input size. There are two types of complexity.


    +   - Time complexity


    +   - Space complexity


    # ## 2.6.1 Time Complexity


    The time complexity of an algorithm is the amount of time which computer needs
    for completion of task. This is the sum of compilation time and running time.
    Suppose the time complexity of an algorithm is T(A), compilation time C(A) running
    time R(A). Then the total time is T(A) = C(A)+ R(A). Generally, running time of
    an algorithm depends upon:


    +   - Whether it is running on Single processor machine or Multi processor machine
    32-bit machine or 64 bit machine

    - Read and Write speed of the machine.

    - The time it takes to perform Arithmetic operations, logical operations, return
    value and assignment operations etc.,

    - Input data


    Note: When we calculate time complexity of an algorithm, we consider only input
    data and ignore the remaining things, as they are machine dependent. We check
    only, how our program is behaving for the different input values to'
  - '[PAGE 39]


    perform all the operations like Arithmetic, Logical, Return value and Assignment
    etc.


    # ## 2.6.2 Space Complexity


    The space complexity of an algorithm is the amount of memory it needs to run to
    completion. This means how much space required to store a code. Here code storage
    means information or variables occupied in memory. Generally, when a program is
    under execution it uses the computer memory for various reasons. They are as follows.


    +   - Instruction Space: It is the amount of memory used to store compiled version
    of instructions.

    - Environmental Stack: It is the amount of memory used to store partially executed
    functions at the time of function call.

    - Data Space: It is the amount of memory used to store all the variables and constants.


    **Note:** When we want to perform analysis of an algorithm based on its Space
    complexity, we consider only Data Space and ignore Instruction Space as well as
    Environmental Stack. That means we calculate only the memory required to store
    Variables, Constants, Structures, etc.


    # ## 2.7 Asymptotic Notation


    It is the mathematical notations to represent the time complexity. There are three
    types of asymptotic notations.


    +   1. Big-Oh Notation (O Notation)

    2. Omega Notation (W Notation)

    3. Theta Notation (Q Notation)


    # ### 1. Big-Oh Notation (O Notation)


    It is a method to express the upper bound of an algorithm''s running time. It
    is the measure of longest amount of time for completion of task. Suppose there
    are two non negative functions f(n) and g(n), the Big-oh notation f(n) = O(g (n))
    if and only if there exist two constants c > 0 & n₀ > 0. Such'
