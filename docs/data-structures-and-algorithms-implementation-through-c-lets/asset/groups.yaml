    # #10.18 B+ Tree


    B+ trees is an linked to B trees. There are following advantages of B+ tree. It
    is similar to B trees, with few differences.


    +   1. The B + -Tree consists of two types of nodes (1) internal nodes and (2)
    leaf nodes

    2. Internal nodes point to other nodes in the tree.

    3. Leaf nodes point to data in the database by using data pointers. The data is
    stored in the leaf nodes and all other nodes store in the indexes.

    4. Leaf nodes are linked to each other by using sibling in sequential manner to
    form a linked list.

    5. Only leaf nodes needs to be traversed to scan the entire tree as data is present
    only in the leaf nodes without visiting the higher nodes at all reducing the block
    accesses to a great extent.

    6. Traversal is faster as compared to B trees in which the data is present in
    all the nodes which in turn would require more number if block accesses.

    7. Just like B trees, B+ trees are also balanced trees (every path from root to
    leaf node has same length) and every node except the root must be at least half
    full. Root may contain a minimum of two entries.

    8. Keys may be duplicated; every key to the right of a particular key is > to
    that key and every key is to the left is <= key.

    9. Used for the purpose of indexing in relational databases.


    **Example:** Construct a B-tree for degree is 3 and following keys: 10, 20, 30,
    1,2,3,11, 21, 31.


    **Solution:**

    Max. Child = 3

    Min. Child = 2

    Max. Key = 2

    Min. Key = 1'
