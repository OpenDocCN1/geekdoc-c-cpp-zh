    In this type of recursion, there is recursive function inside another recursive
    function. This type of recursion uses Ackerman''s recurrence relation. There is
    following equation of Ackerman''s recurrence relation.


    ```

    n + 1 if m = 0

    A (m, n) = A (m-1, 1) if m = 0

    A (m-1, A (m, n-1)) otherwise

    ```


    For the above Ackerman''s recurrence relation let we assume m=1 and n=3.


    ```

    A (1, 3) = A (0, 1,2)

    A (0A(1,1))

    A (0,A(1,0))

    A (0, 1)

    ```


    # 4.5.2.2 Indirect Recursion


    In this type of recursion, Suppose there are two functions A() and B(). The definition
    of B()call A() and the definition of A() call B(). This is an example of indirect
