    \ that is called threads.\n- 2. We need to know if a pointer is an actual link\
    \ or a thread, so we keep a boolean for each pointer.\n\nWe use threaded binary\
    \ tree because binary trees have a lot of wasted space: the leaf nodes each have\
    \ 2 null pointers. We can use these pointers to help us in inorder traversals.\
    \ Threaded binary tree makes the tree traversal faster since we do not need stack\
    \ or recursion for\n\n# 10.12.1 Types of Threaded Binary Trees\n\n**Single Threaded:**\
