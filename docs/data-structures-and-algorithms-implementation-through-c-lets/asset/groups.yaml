    element is compared with next element in the list. If both matched, then the result
    is “element found”. Otherwise, repeat the with the next element in the list until
    search element is compared with last element in the list, if that last element
    also doesn''t match, the result is “Element not found in the list” display. That
    means, the search element is compared with element by element in the list.


