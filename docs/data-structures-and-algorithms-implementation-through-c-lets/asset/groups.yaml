    \ If terminating condition is there in recursion that means the code is properly\
    \ working but if the terminating condition is not there that means the recursive\
    \ code is going to run infinite times.\n\n## 4.5.2 Types of Recursion\n\nThere\
    \ are two types of recursion:\n\n- 1. Direct Recursion\n- 2. Indirect Recursion\n\
    \n### 4.5.2.1 Direct Recursion\n\nIn this recursion, the function called itself\
