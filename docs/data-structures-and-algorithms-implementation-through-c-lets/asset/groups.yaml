    # Preface


    This is an era of computer science and we emphasize on the fundamental concepts
    of data structures which are more efficient from time and space point of view.
    This book clears detail concepts about various data structure and algorithms such
    as stacks, queues, linked lists, trees and graphs. This book is also encouraging
    about construct novel data structures which are more efficient to existing data
    structures.


    This book is useful for efficient organization of data due to this various operations
    can be performs on data. It is also useful for constructing and analyzing an algorithm
    of data structures. This book is written for DCA, PGDCA, B.Tech./B.E., BCA, BSc
    M.Tech. /M.E., MCA, MSc students. The book is organized in 14 chapters and brief
    content is as follows:


    +   Chapter 1 provides the basics of algorithms and their charts


    +   Chapter 2 describes the concept about algorithm analysis and complexity of
    an algorithm.


    +   Chapter 3 introduces a data structure and brief description about various
    data structures.


    +   Chapter 4 provides the basics of concepts of functions and recursions.


    +   Chapter 5 & 6 provides the basics of arrays, pointers and strings.


    +   Chapter 7 explains the stack data structure and their implementation.


    +   Chapter 8 introduces queue data structure and their types.


    +   Chapter 9 explains linked lists and its various types with implementation.


    +   Chapter 10 covers tree data structure its various types with examples.


    +   Chapter 11 graphs data structures contains various real-life problems.


    +   Chapter 12 & 13 covers searching and sorting of data.


    +   Chapter 14 cover detail description about hashing, its various types and techniques
    with examples.


    All the basic concepts have been discussed in above chapters. For practice session
    students may follow chapter wise exercises. Although the content has been supervised
    by many senior educationists, there may be'
