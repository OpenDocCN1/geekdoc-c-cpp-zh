    assumed the variable address is 1000. If we want to see the actual address of
    variable then it has to use & (ampersand) sign in printf function. This & sign
    indicate the address of a variable. An array is also a variable and it has a capability
    to hold large number of homogeneous element.


    # # 3.4.1 Declaration and Initialization of an Array


    Suppose we have to declare an array of 5 integer number then the declaration is:
    int a[5];


    We have to put a value in subscript. This value indicates the size of an array.
    The size shows the total elements in an array. By default, the value of'
