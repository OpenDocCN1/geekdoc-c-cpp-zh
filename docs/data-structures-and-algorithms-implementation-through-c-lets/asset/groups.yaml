    # 13.3.6 Heap Sort


    Heap Sort is one of the efficient sorting methods. It is inplace sorting technique.
    There are following properties of heap sort.


    +   1. First of all, it creates a Heap of the unsorted list.

    2. Then a sorted array is created by repeatedly removing the largest or smallest
    element from the heap, and inserting it into the array.

    3. The heap is reconstructed after each removal.

    4. Heap Property: If the parent nodes are greater than their child nodes, heap
    is called a Max-Heap, and if the parent nodes are smaller than their child nodes,
    heap is called Min-Heap.


