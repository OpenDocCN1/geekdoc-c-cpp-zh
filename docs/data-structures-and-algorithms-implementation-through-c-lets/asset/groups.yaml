    as Dictionary, Telephone Directory etc.


    # 13.2 Types of sorting


    +   - In-place Sorting: In this sorting technique, the elements are sorted within
    an array. There is no extra space required for sorting an element.


    +   - Not-in-place Sorting: In this sorting technique, the elements are sorted
    but extra array is required. There is extra space required for sorting an element.


    +   - Stable Sorting: If a sorting algorithm, after sorting the contents, does
    not change the sequence of similar content in which they appear, it is called
    stable sorting.


    +   - Unstable Sorting: If a sorting algorithm, after sorting the contents, changes
    the sequence of similar content in which they appear, it is called unstable sorting.


