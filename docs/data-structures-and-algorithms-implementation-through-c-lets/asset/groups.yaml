    # 10.13 AVL Tree


    AVL tree is a binary search tree in which the difference of heights of left and
    right sub trees of any node is less than or equal to one. This difference is called
    the Balance Factor. The technique of balancing the height of binary trees was
    developed by Adelson, Velskii and Landis and hence given the short form as AVL
    tree or Balanced Binary Tree.


    The drawback of Binary search Tree (BST) is that if our BST is skewed then the
    worst case searching time is O(n) rather than Log(n). In this example we take
    two types of skewed tree.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_283_1.png)'
  - '[PAGE 284]


    ![](img/cbd38072d10706a376a60fc30bd31ea8_284_0.png)


    In the above left right skewed binary search tree, the searching element 50 or
    10 will take O(n) time because it will have to scan n number of time. Both the
    trees are unbalanced that is why it will take linear time rather than logarithmic
    time. The AVL tree overcomes these types of problems.


    There are following properties about AVL tree.


    +   1. Searching BST is efficient when height of both left and right subtree is
    equal.

    2. Height of both left and right subtree is not equal then it takes more time
    to insert and delete element.

    3. Searching of element is fast when our left subtree and right subtree are balanced.

    4. That tree is called balance binary tree.


    # 10.14 Balance Factor


    Balance Factor (BF) is the difference between height of Left Subtree (LST) and
    height of Right Subtree (RST).


    Balance Factor = Mod [Height (LST) - Height (RST)] Moreoverover a Binary Search
    Tree is said to be AVL tree if and only if every node has the balance factor 0
    or 1.


    Let''s take an example for calculating a balance factor'
