    ```

    A ()

    {

    _\_\_\_

    _\_\_\_

    B ( ) // B() is calling

    }

    ```


    ```

    B ()

    {

    _\_\_\_

    _\_\_\_

    A ( ) // A() is calling

    }

    ```'
