    ![](img/cbd3072d1070a376a0fc30bd1ea8_164_1)\n\nFig. 8.4: Process of deleting element\
    \ from queue\n\nSimilarly, we can delete the element one by one from queue. When\
    \ the front is pointing to rear that means our queue is empty as show in Fig.8.5.\n\
    \n![](img/cbd3072d1070a376a0fc30bd1ea8_165_0)\n\n## 8.3 Queue Implementation\n\
    \nThere are two types of implementing a queue.\n\n1. Static Implementation\n2.\
    \ Dynamic Implementation\n\n## 1. Static Implementation\nIt uses array for static\
    \ implementation. This is very easy implementation but the creation of queue is\
    \ not easy task because first of all it has to mention a size of queue. This implementation\
    \ is very efficient for utilizing a memory.\n\n## 2. Dynamic Implementation\n\
    It uses pointer or linked list for dynamic implementation. In dynamic implementation,\
    \ we use pointers and nodes which are created at run time. There is no overflow\
    \ condition for dynamic implementation.\n\n## Operations of Queue\n\n## Insert\
    \ Operation\nWhen new element is inserted into the queue through rear end then\
    \ it is called insert operation. When we insert element in queue then it has to\
    \ increment the value of rear.\n\n## Delete Operation\n\nWhen element is deleted\
    \ from the queue than it is called delete operation. When we delete element from\
    \ queue then it has to increment the value of front.\n\n## Traverse Operation\n\
    \nWhen elements have to display on the screen or visit all element then that operations\
    \ is called traverse operation. The traversing operation depends on the front\
    \ pointer.\n\n# Algorithm for Insert and Delete Operation in Queue\n\n# Insert\n\
    \n- Step 1. Initialization\n    Set front =-1\n    Set rear =-1\n- Step 2. Repeat\
    \ step 3 to until rear<maxsize-1\n    - Step 3. read item\n    - Step 4. if front==-1\
    \ then\n        Front=0\n        Rear=0\n    else\n        Rear = rear+1\n   \
    \ Endif\n    - Step 5. Set Queue[rear]=item\n    - Step 6. Step 6: Print, Queue\
    \ overflow.\n\n# Delete\n\n- Step 1. Repeat 2 to 4 until front>=0\n    - Step\
