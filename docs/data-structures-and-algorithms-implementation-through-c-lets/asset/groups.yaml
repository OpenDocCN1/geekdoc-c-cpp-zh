    # # 3.5 Stacks


    Stack is very important data structure and it is a collection of homogeneous types
    of element. We can access data elements in sequential manner of stack. Insertion
    and deletion operation is possible form one ended top of the stack. In stack,
    the insertion operation is called push and the deletion'
