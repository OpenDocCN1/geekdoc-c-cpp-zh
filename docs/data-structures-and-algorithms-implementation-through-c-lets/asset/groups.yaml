    ## Algorithms and Flowcharts


    ## 1.1 Introduction of Algorithm


    First of all, before making any program or software, we have to make the documentation
    of it. This documentation provides the information about that entire software.
    This program or software can be deployed in any programming language, but if it
    is necessary to change something later in that program or software then its algorithm
    or documentation is very important.


    By studying the documentation, you get complete information about the software
    and make some changes in it too easily. So, we can say that the understanding
    of the software increases through algorithms.


    Let us take an example, if the software is being created for a shopping complex
    and its documentation is being prepared. Now, if we have to make some changes
    to the software according to the needs of the customer, it is very important to
    be aware of the outline. If the software needs to extend and we have proper documentation
    of it, then the software developer will not depend on the developer who develop
    that software.


    ## 1.2 What is an algorithm?


    Let''s take the problem for making a tea. For making a tea, there are following
    steps:


    - Set a metallic saucepan on the stove top or hob.

    - Add the piece of freshly crushed ginger.

    - Add tea leaves in it.

    - Add milk according to choice.

    - Filter a solution with the help tea strainer.

    - Put the filtered solution into cups.

    - 7. Serve it.


    What we are doing for making a tea which is our problem. We are writing step by
    step procedure for solving it. Therefore, the definition of an algorithm is “It
    is a step by step procedure to solve a given problem. Moreover, an algorithm accepts
    an input list of data and creates an output list of data.” Fig. 1.1 shows the
    basis concept of an algorithm.


    ![](img/cbd38072d10706a376a60fc30bd730)


    ## 1.3 Flowcharts


    Sometimes an algorithm can be difficult to understand. Flowcharts are very helpful.


    ### 1.3.1 Reason to Use Flowcharts


    There are various reasons to use:


    - 1. **Documentation and training**: Flowcharts are ideal for training.

    - 2. **Workflow management**: It increases business process.

    - 3. **Programming**: In the world of algorithms, you will find complexity.

    - 4. **Troubleshooting**: Multiple problems can be presented.

    - 5. **Quality assurance**: Modules ensure that regulatory requirements are followed.

    - 6. **Process flow**: It increases business efficiency.


    ## 1.4 Advantages


    - 1. **Communication**: Flow Charts are better way of communicating a system.

    - 2. **Effective Analysis**: Problem can be effectively analysed with the help
    of flowchart

    - 3. **Proper Documentation**: Flow charts serve as good program documentation.

    - 4. **Efficient Coding**: The flow charts act as a guide during systems analysis
    and development phase.

    - 5. **Proper Debugging**: The flow chart helps in debugging process.

    - 6. **Efficient Program Maintenance**: The maintenance of operating program becomes
    easy with the help of flow chart.


    ## 1.5 Symbols Used for Making Flowcharts


    There are various types of symbols used for making a flowchart (Fig. 1.2):


    - 1. Start/End

    - 2. Input / Output

    - 3. Process / Instruction / Computation

    - 4. Decision Box

    - 5. Connector

    - 6. Flow lines


    Fig 1.2: Flow chart


    ## 1.6 Pseudocode


    Pseudocode is a complete description about computer program algorithm. It is expressed
    in a natural language rather than in a programming language. Pseudocode is sometimes
    used as a detailed step in the process of developing a program. Moreover pseudocode
    is one of the method that could be used to represent an algorithm. It is not written
    in a specific syntax which is used by a programming language and therefore cannot
    be executed in a computer.


    ## 1.7 Difference between Algorithm and Pseudocode


    There are various types of difference between algorithm and pseudocode. Some differences
    are shown in Table 1.1.


    | S-No | Algorithm | Pseudocode |

    |---|---|---|

    | 1 | Set of well-defined sequence of steps. | It is a method to represent an
    algorithm. |

