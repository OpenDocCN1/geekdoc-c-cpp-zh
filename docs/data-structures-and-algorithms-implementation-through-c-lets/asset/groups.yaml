    # 14.6 Perfect Hashing


    The goal of perfect hashing is worst case search time is O (1).

    There are following properties of perfect hashing


    +   1. Instead of making linked list the keys hashing to the same slot.

    2. We will use small secondary hash function hj with associated hash table mj.

    3. This process is known as perfect hashing.

    4. Total number of collision in second level hashing is maximum 1/2 means NO collision
    at all.

    5. The worst case time complexity of perfect hashing is O (1)


