    This function uses allocating memory at run time. In this function, memory will
    create according to user''s need. The advantage of this function is that, the
    memory will not be waste. The allocation of memory is in contiguous format that
    means, suppose the pointer holds an address of first block then we can retrieve
    all the data from that allocation. We can also resize the memory block.


    ```

    malloc (n * size of (Data type))

    ```


    Here n the number of block and size of statement shows which type of data you
    want to insert. This function returns the base address (starting address) of the
    block.


    ```

    int * P;

    ```'
