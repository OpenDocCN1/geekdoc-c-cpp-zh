    ## Theta Notation (Θ Notation)


    It is a method to express the lower bound of an algorithm''s running time. Suppose
    there are two non-negative functions f(n) and g(n) then the Omega notation is
    f(n) = \Theta(g(n)), if and only if there exist two constants c > 0 & n_0 > 0.
    Such that c_1·g(n) ≤ f(n) ≥ c_2·g(n), for all n, n ≥ n_0. This notation is used
