    # An Algorithm for Inserting a Node at the Beginning


    +   1. Allocate the memory for new node.

    2. Assign value to its data field.

    3. Make the RIGHT Link of the head node to point to the new node and LEFT Link
    of the new node to point to the head node. Simply make the RIGHT Link of the new
    node to point to the node immediately appearing after the head node and LEFT Link
    of this node back to the new node.


