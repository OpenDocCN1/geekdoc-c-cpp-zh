    |---|---|---|---|---|

    | 1000 | 1002 | 1004 | 1006 | 1008 |


    **Fig. 3.3: Memory allocation of an array**


    The first index of an array is starting from zero and that address is called base
    address of an array. The total size of array is maximum index -1 because the index
    is zero. When we provide a value of an array then it is called initialization
    of an array, we can initialize an array:


