    There are various advantages and disadvantages of doubly linked list.


    # Advantages


    +   1. The node is easily inserted and deleted in doubly linked list.

    2. Efficient memory utilization

    3. Forward and backward traversing is possible in doubly linked list.


    # Disadvantages


    There are two null fields in doubly linked list. The first null field mentioned
    in first node and the second null field in the last node. To overcome this problem,
    use circular doubly linked list. In this circular doubly linked list, the null
    field is occupied with the address of first node and last node.


    # 9.11 Circular Doubly Linked List


    It is doubly linked list in circular manner. In the circular doubly linked list
    the NULL value occupied with the address of first and last address.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_245_0.png)


    Following is the representation of circular doubly linked list.


