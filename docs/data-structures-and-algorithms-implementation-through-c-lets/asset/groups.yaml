    | 0 - 2 | = 2，这意味着上面的树是不平衡的。同样，BF (2) = | 高度 (2 的 LST) - 高度 (2 的 RST) | = | 0-1
    | = 1。BF (3) = | 高度 (3 的 LST) - 高度 (3 的 RST) | = | 0-0 | = 0。最后，上面的树是不平衡的，因为 1
    的平衡因子是 2。以下是具有平衡因子的树：


