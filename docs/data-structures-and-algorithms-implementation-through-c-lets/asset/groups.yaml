    # Singly Linked List


    In this linked list, all the nodes are linked in a sequential manner. It is also
    called linear linked list. There are two ends in this linked list beginning and
    end. The problem in singly linked list is that, it cannot reach predecessor from
    current node. Through doubly linked list solve this. problem.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_206_0.png)


    # Doubly Linked List


    In this linked list, all the nodes are linked from each other. In this list, it
    can access the successor and predecessor nodes from any nodes. Moreover, it can
    traverse forward and backward directions.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_206_1.png)


    # Circular Linked List


    In this linked list, there is no beginning and end part. Singly linked list can
    be converted into circular linked list. It assigns the address of first node into
    last node.'
