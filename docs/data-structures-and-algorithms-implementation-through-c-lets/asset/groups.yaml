    \ n 是列表中元素的总数。\n\n搜索过程从列表的第一个元素开始比较。如果不匹配，则与下一个元素比较。如果匹配，则结果找到元素。\n\n## 实现线性搜索的步骤\n\
    实现线性搜索的步骤如下：\n\n1. 开始\n2. 从用户处输入搜索元素\n3. 将搜索元素与列表的第一个元素比较。\n4. 如果两个都匹配，则显示“找到元素”。\n\
