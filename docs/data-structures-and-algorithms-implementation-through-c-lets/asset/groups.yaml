    \n# 10.12 Threaded Binary Tree\n\nA binary tree is threaded by making all right\
    \ child pointers that would normally be null to the inorder successor of the node,\
    \ and all left child pointers that normally be point to the inorder predecessor\
    \ of the node. There are two important points about the threaded binary tree.\n\
