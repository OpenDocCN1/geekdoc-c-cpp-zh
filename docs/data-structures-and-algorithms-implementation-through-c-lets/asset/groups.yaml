    \n第 11 步。\n\n![](img/cbd38072d10706a376a60fc30bd31ea8_301_6.png)\n\n## #10.18\
    \ B+ 树\n\nB+树与B树相关联。B+树具有以下优势。它与B树相似，仅有少数区别。\n\n- 1. B+树由两种节点组成：(1)内部节点和(2)叶子节点。\n\
    - 2. 内部指向树中的其他节点。\n- 3. 叶子节点通过数据指针指向数据库中的数据。数据存储在叶子节点中，所有其他节点存储在索引中。\n- 4. 叶子节点通过兄弟节点按顺序相互连接，形成链表。\n\
    - 5. 扫描整个树时只需要遍历叶子节点，因为数据仅存在于叶子节点，完全不需要访问高节点，这极大地减少了块访问的次数。\n- 6. 与B树相比，遍历速度更快，因为B树的数据存在于所有节点，这反过来需要更多的块访问。\n\
    - 7. 与B树一样，B+树也是平衡树（从根节点到叶子节点的每条路径长度相同），且根节点外的每个节点必须至少半满。根节点可以包含至少两个条目。\n- 8.\
    \ 键可以重复；特定键右侧每个键大于该键，左侧每个键小于或等于该键。\n- 9. 用于关系型数据库的索引。\n\n**示例：** 构建一个阶数为 3 且键序列为\
    \ 10, 20, 30, 1, 2, 3, 11, 21, 31 的 B 树。\n\n**解：**\n最大子节点 = 3\n最小子节点 = 2\n最大键\
    \ = 2\n最小键 = 1\n\n第 1 步。\n\n![](img/cbd38072d10706a376a60fc30bd31ea8_303_0.png)\n\
