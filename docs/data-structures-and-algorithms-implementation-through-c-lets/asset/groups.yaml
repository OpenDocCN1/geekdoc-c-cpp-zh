    # 13.3.4 Quick Sort


    Quick sort is efficient sorting algorithm because it is based on partition of
    array. It uses a divide and conquer approach and divide an array into smaller
    parts. First of all, it picks the pivot element from an array and applies a partition
    technique. The result of partition approach is to locate the pivot element into
    its actual position.


    In this technique, there are two types of partitions.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_376_0.png)


    Let us take an example of quick sort. The key elements are: 45, 26, 177, 14, 68,
    61, 97, 39, 99, 90


    First of all, we chose an element as pivot or key value. Suppose 45 is a key value.
    After that it uses two indexes low and high. The elements in the low index are
    those elements whose values are less than key value. The elements in the high
    index are those elements whose values are less than key value.'
