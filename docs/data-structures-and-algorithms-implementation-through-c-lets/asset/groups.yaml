    8. 根据找到与否终止函数。\n9. 停止\n\n让我们通过一个例子理解线性搜索过程。\n\n| 13 | 19 | 3 | 32 | 53 | 17 |\
    \ 27 | 55 | 84 | 29 |\n\n图 12.1：线性列表\n\n假设我们需要从图 12.1 中搜索元素 27。对于 27 的搜索，必须将 27\
    \ 与 13 比较，如果匹配则返回位置。如果不匹配则与 19 比较。同样，与所有元素比较。在这种情况下，如果 7 匹配，则返回位置。\n\n# 线性搜索的实现\n\
    程序1：线性搜索的 C 语言程序。\n\n```c\n#include<stdio.h>\n#include<conio.h>\nvoid main(){\n\
