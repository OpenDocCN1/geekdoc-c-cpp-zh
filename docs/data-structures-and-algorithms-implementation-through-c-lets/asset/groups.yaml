    # ## 4.1 Introduction


    We can understand a function through real life example, suppose there are 50 students
    in a class and the whole class wants to organize a program. There are 5 different
    tasks to organize a program like decoration, food, entertainment, prize distribution
    and Speech-anchoring. There are two ways to organize a program first, to accomplish
    the task one by one and the second is to divide the equal number of groups of
    students and accomplish the task to each group. Obviously the second way is very
    easy and time efficient. Similarly, function means you divide your task or problem
    in different module and make a code for each and every module. If you use a function
    then your code is automatically reduced because function uses the rule call many
    time but define one time.


    # ## 4.2 Definition


    Function is self-contained block of statements for performing a specific task.


    There are two parts for making a function, function calling and function definition.
    In function calling, we call a function and control jump to function definition.


    # ## 4.3 Types of Functions


    There are two types of functions in C (Fig. 4.1).


    +   1. Predefined function

    2. User defined functions'
