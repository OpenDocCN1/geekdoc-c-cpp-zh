    # # 8.3 Queue Implementation


    There are two types of implementing a queue.


    +   1. Static Implementation

    2. Dynamic Implementation


    ## 1. Static Implementation

    It uses array for static implementation. This is very easy implementation but
    the creation of queue is not easy task because first of all it has to mention
    a size of queue. This implementation is very efficient for utilizing a memory.


    ## 2. Dynamic Implementation

    It uses pointer or linked list for dynamic implementation. In dynamic implementation,
    we use pointers and nodes which are created at run time. There is no overflow
    condition for dynamic implementation.


    # # Operations of Queue


    ## Insert Operation

    When new element is inserted into the queue through rear end than it is called
    insert operation. When we insert element in queue then it has to increment the
    value of rear.'
