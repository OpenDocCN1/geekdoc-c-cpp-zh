    # CHAPTER 2

    Algorithm Analysis


    # 2.1 Introduction


    Generally, people can think that a computer can do anything but it is difficult
    to make people understand a computer can do anything without instruction, programs
    or software. If people want to search anything in computer they enter the information
    and after few seconds they get the desired result. But during this searching process
    a program is being executing in background and this process depends on the execution
    speed and organized storage of information. If our data or information is properly
    organized then searching process will take less amount of time and get the desired
    result faster.


    The organization of data directly depends on the execution time. If information
    is well organized then the process gives fast result. Here process is nothing
    but a set of instruction. This set of instruction is termed as program.


    # 2.2 Why to Study an Algorithm?


    The study of algorithms, gives us a language to express performance as a function
    of problem size. If there is a software company and some people have created the
    particular software of that company. After some time, if there is some change
    in that software and some members of that technical team has switched the companies,
    this task will be very complicated for the new members as they will not understand
    the coding. But if the proper documentation is available or an algorithm of the
    code is available then it is easy to understand the software. That is why algorithm
    plays an important role for constructing the software.


    # 2.3 Definition of an Algorithm'
  - '[PAGE 31]


    Algorithm is a combination of sequence of finite number of steps defined to solve
    a particular problem. It is a well defined procedure which will take input and
    produce output. The input and output may be some data or values.


    # Properties of an algorithm:


    +   - **Input**: Zero or more input but is be finite.

    - **Output**: It must contain at least one output and it should also be finite.

    - It should produce the output within the time.

    - It should be deterministic or we can say each every step should be unambiguous.

    - **Simplicity**: Every step in an algorithm should perform at least task.

    - It should be independent of programming languages or be generic to all programming
    languages.


    # 2.4 Steps to Construct an Algorithm


    There are following steps for constructing an algorithm:


    +   - **Problem Definition**: Know the problem clearly

    - **Constraint to be satisfied**: Requirement needed to satisfy the problem

    - **Design the problem**: Gather information to solve the problem

    - **Draw the flow chart**: Diagram for understanding the problem

    - **Validation or Testing**: Track an algorithm for different inputs

    - **Implementation**: Convert algorithm to programming languages

    - **Analysis**: Tracing and debugging the code, posteriori analysis required.


    Algorithms are used to convert our problem into one by statement. These statements
    can be converted into computer programming instructions which form a program.
    This program is executed by computer to produce solution. Program takes input
    and processes the data according to the program instructions and finally produces
    output. We can understand the following process from following figure.'
