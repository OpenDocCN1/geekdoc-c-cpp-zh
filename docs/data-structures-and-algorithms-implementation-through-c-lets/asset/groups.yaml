    # Solution:


    +   i. The formula of log of log is log_b^n = nlog_b^a. According to this formula
    the value of n2 2log2^n = n^3 log2^2 = n2 n^3 = n^5. Hence n^5 = Θ(n^5) then statement
    i) is true.


    +   ii. The simplification of 4^n/2^n = 2^2n-n = 2^n. Hence 2^n = Θ(2^n).


    +   iii. The simplification of 2log2^n = nlog2^2 = n1. Then n1 = Θ(n^2) is not
    correct. Hence 2log2^n = Θ(n^2) is false.


