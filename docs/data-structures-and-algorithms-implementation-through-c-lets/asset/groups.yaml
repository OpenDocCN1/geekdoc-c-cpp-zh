    # CHAPTER 5


    # Arrays and Pointers


    # 5.1 Introduction


    Array is a most important concept of any programming languages. This is very efficient
    for any complex data types like stack, queue etc. Suppose we have to make a program
    for addition of two numbers then we will have to take two variables. If we want
    to add 100 numbers then we will have to take 100 variables similarly for 1000
    numbers 1000 variables are required. This is very inefficient way to declare 1000
    variables and the programming will be very large and inefficient. To overcome
    this problem we have to take only one variable and it has capacity to hold 1000
    numbers that is why we use an array.


    # 5.2 Definition


    An array is collection of similar types of data element or it is homogeneous collection
    of elements. It can be a collection of integer, float, character or any data types.


    There are following important points about an array:


    +   1. In an array, the data is stored in a contiguous memory location.

    2. It has a capacity to hold large values.

    3. The declaration of an array is same as normal variable.

    4. In the subscript of an array, we put size of an array that is why array is
    called subscript variable.

    5. The first index of an array is starting from zero.

    6. The address of first index is called base address.

    7. There is no bound of an array checking in C that means it can add more elements
    beyond the size.'
  - '[PAGE 86]


    # 5.3 One Dimensional Array


    In these types of array, a single subscript is present. The declaration of one
    dimensional array is


    ```

    Data_type variable_name[size];

    ```


    Here data means the data is going to store in an array, name of variable means
    array name, size means number of element store in array. The size should always
    be in integer form. The value inside in subscript should be starting from zero.
    Suppose we want to declare an array of 10 integer elements. The declaration is:


    ```

    int num [10];

    ```


    When we have to store five elements then there are following representation:


    +   - arr[0] 10

    - arr[1] 20

    - arr[2] 30

    - arr[3] 40

    - arr[4] 40


    The subscript is starting from zero. Suppose we want to access 30, the position
    is 3rd but the index is 2. So, the following formula is used for getting a size
    of an array:


    ```

    Size = (Upper Bound - lower Bound) +1

    ```


    For the example the size is:


    ```

    Size = (4 - 0) + 1

    ```


    ```

    = 5

    ```


    Suppose we want the total bytes occupied in an array then we simply multiply the
    array size and data types. For the above example the total size is:


    ```

    Total size = 5 × 2

    ```


    ```

    = 10 bytes

    ```


    Here 5 is an array size and 2 is a base type of an integer.


