    # # Adjacency Matrix


    Adjacency Matrix is a 2D array of size V x V where V is the number of vertices
    in a graph. Let the 2D array be adj[][][], a slot adj[i][j] = 1 indicates that
    there is an edge from vertex i to vertex j. Adjacency matrix for undirected graph
    is always symmetric. Adjacency Matrix is also used to represent weighted graphs.
    If adj[i][j] = w, then there is an edge from vertex i to vertex j with weight
    w.


    The adjacency matrix for the above example graph


    | 0 | 1 | 2 | 3 | 4 |

    |---|---|---|---|---||

    | 0 | 0 | 1 | 0 | 0 | 1 |

    | 1 | 1 | 0 | 1 | 1 | 1 |

    | 2 | 0 | 1 | 0 | 1 | 0 |

    | 3 | 0 | 1 | 1 | 0 | 1 |

    | 4 | 1 | 1 | 0 | 1 | 0 |


    ![](img/cbd38072d10706a376a60fc30bd31ea8_328_1.png)


    There are following advantages and disadvantages of Adjacency Matrix.


    # # Advantages'
  - '[PAGE 329]


    The representation is easier to implement and follow. Removing an edge takes O(1)
    time. Queries like whether there is an edge from vertex ‘u’ to vertex ‘v’ are
    efficient and can be done O(1).


    # Disadvantages


    Consumes more space O(V2). Even if the graph is sparse (contains less number of
    edges), it consumes the same space. Adding a vertex is O(V2) time.


    # Adjacency List


    An array of linked lists is used. Size of the array is equal to the number of
    vertices. Let the array array[]. An entry array[i] represents the linked list
    of vertices adjacent to the ith vertex. This representation can also be used to
    represent a weighted graph. The weights of edges can be stored in nodes of linked
    lists. Following is adjacency list representation of the above graph.


