    (c) f(n) = 16n^3 + 14n + 37\n(d) f(n) = n^5 + 61n^3 + 12\n\n# 第 3 章\n数据结构引论\n\n\
    ## 3.1 引言\n\n通常情况下，数据的组织是必要的，因为数据组织良好后才能于访问。数据结构在我们的日常生活中起着非常重要的角色。在任何商店、商场里，所有商品都放置在合适的位置，这样搜索商品变得更容易。如果任何物品都能得到管理，访问所需的时间就会减少。数据结构也是以适当的方式对数据进行组织。\n\
    \n## 3.2 定义\n\n数据结构表示数据之间的逻辑关系。此外，它是以高效方式组织数据。数据结构主要用于四个功能：\n\n+   1. 数据组织\n \
    \ 2. 数据访问方法\n  3. 关联程度\n  4. 信息处理\n\n## 3.3 数据结构的分类\n\n数据结构通常分为两部分。\n\n+   1.\
    \ 基础型数据结构\n  2. 非基础型数据结构\n\n### 3.3.1 基础型数据结构\n\n这是一种基本数据结构，直接在机器指令中操作。例如整数、字符、浮点、指针等。\n\
    \n### 3.3.2 非基础型数据结构\n\n这是一种由预测复合工具派生的复杂数据结构。非基础型数据结构引入了同构类型和异构类型。例如数组和结构。\n\n\
    通常，数据结构可以分为四类：\n\n+   1. 创建\n  2. 删除\n  3. 访问\n  4. 修改\n\n#### 创建\n该操作保留内存。此操作在声明时执行。\n\
    \n#### 删除\n该操作销毁内存。占用内存使用 `malloc()` 和 `calloc()` 函数。但如果要销毁内存使用 `free()` 函数。\n\
    \n#### 访问\n该操作用于访问数据。如果数据存在数据结构中则操作成功，否则失败。\n\n#### 修改\n该操作用于更新数据结构的数据。执行修改操作后，之前的数据会被销毁。（图\
    \ 3.1）\n\n![](img/cbd38072d10706a376a0fc30bd31ea8_54_0)3.4 数组\n\n数组是相同类型元素的集合。它是最重要的数据结构之一，以连续格式存储数据。也被称为线性或同构数据结构，因为它是顺序访问的。当我们声明变量时，关于变量有三个重要点：变量名、变量值和变量地址，如图\
    \ 3.2 所示。\n\n![](img/cbd38072d10706a376a0fc30bd31ea8_54_1.png3.4.1 数组的声明和初始化\n\
    \n假设我们要声明一个长度为 5 的整数数组，声明为：`int a[5];`\n\n我们需要在下标中放入值。该值表示数组的大小。显示数组中的总元素。默认情况下，数组的值是垃圾值，如图\
    \ 3.3 所示。\n\n| a[0] | a[1] | a[2] | a[3] | a[4] |\n|---|---|---|---|---|\n| 1000\
    \ | 1002 | 1004 | 1006 | 1008 |\n\n**图 3.3：数组的内存分配**\n\n数组的第一个索引从零开始，该地址被称为数组的基地址。数组的总大小是最大索引减1，因为索引是从零开始。当我们提供数组的值时，被称为数组的初始化，我们可以初始化数组：\n\
    \n+   1. 在声明数组时。\n  2. 逐个初始化或使用输入函数 (`scanf()`)\n\n```\nint a[5] = {1, 2, 6, 4,\
    \ 5}\na[0] = 1;\na[1] = 2;\na[2] = 6;\na[3] = 4;\na[4] = 5;\n```\n\n当我们初始化数组时，垃圾值被替换为我们提供的值。可以通过图\
    \ 3.4 理解该过程。\n\n| a[0] | a[1] | a[2] | a[3] | a[4] |\n|---|---|---|---|---|\n\
    | 1 | 2 | 3 | 4 | 5 |\n| 1000 | 1002 | 1004 | 1006 | 1008 |\n\n**图 3.4：数组的初始化**\n\
    \n## 3.5 栈\n\n栈是非常重要的数据结构，它是同类型元素的集合。我们可以按顺序访问数据。插入和删除从栈的一个端——栈顶。在栈中，插入操作称为 `push`，删除操作称为\
    \ `pop`。栈遵循后进先出（LIFO）属性，最后插入的元素将第一个被访问。因此，栈推需要常数时间，而在最坏情况下需要线性时间。实现栈数据结构有两种方法，一种是编译时实现，另一种是运行时实现。我们可以通过图\
    \ 3.5 和图 3.6 理解整个过程。\n\n![](img/cbd38072d10706a376a0fc30bd31ea8_56_0.png)图 3.5：编译时的栈实现。\n\
    \n## 3.6 队列\n\n队列是插入和删除从两个不同端进行的数据结构。插入操作在一个称为队尾（rear）的端进行，删除在另一个队头（front）的端进行。队列数据结构遵循先进先出（FIFO）属性，即先插入的元素将先被删除。现实生活中有很多队列的例子，如火车预订、电影院的票务柜台队列。实现队列数据结构有两种方法，一种是编译时实现，另一种是运行时（动态）实现。对于编译时实现队列，我们使用数组；对于运行时实现，我们可以通过图\
