    # 3.10.2.3 The free() Function


    This free() function de-allocates a memory which is previously allocated by malloc()
    and calloc() function. The free() function de-allocate memory at run time. The
    syntax of free() function:


    ```

    free(void *ptr);

    ```


    We have to pass one argument in free() function. The function de-allocates the
    whole block but we have to pass the base address of a block.


    # 3.10.2.4 The realloc() Function


    This realloc() function use for resizing the previously allocated memory by malloc()
    and calloc() at run time. The syntax of realloc() is


    ```

    void * realloc(void *ptr, size)

    ```


    Example 3:


    ```

    #include <stdio.h>

    #include <conio.h>

    int main()

    {

    int *p1,*p2;

    p1 = (int*)calloc(5,size of (int));

    p2 = (int *)realloc(p1,size of (int));

    if (p2 = NULL)

    {

    free(p1);

    return(0);

    }

    else

    {

    free(p2);

    }

    return(0);

    }

    ```


