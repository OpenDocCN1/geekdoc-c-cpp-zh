    # # 3.4 Array


    An array is a collection of similar types of element. This is one of the most
    important data structures which store the data in contiguous format. It is also
    called linear or homogeneous data structure because it is access sequentially.
    When we declare a variable there are three important things about variable, which
    are: variable name, variable value and variable address, which is shown in [Fig,
    3.2](Fig, 3.2).


