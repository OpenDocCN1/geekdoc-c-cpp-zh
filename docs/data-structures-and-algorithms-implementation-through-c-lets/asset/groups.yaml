    # 11.5 Spanning Tree


    A connected subgraph H of a graph G(V, E) is said is a spanning tree if and only
    if


    +   - H should contain V vertices.

    - It should contain |V|-1 edges.


    A graph may have many spanning trees; for instance, the complete graph on four
    vertices


