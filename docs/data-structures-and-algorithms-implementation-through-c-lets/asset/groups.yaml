    When we similar group of integers then it has to take array on integer and similar
    group of float then it has to take array of float variable. Similarly, if we want
    similar group of character then has to take array of character. For example, if
    you want to store your name in memory then you need a variable that can hold your
    name. But name is collection characters such that you need an array of character.
    This array of character is nothing but a string.


    # ## 6.2 Definition


    String is collection of similar types of character element. Moreover, it is an
    array of characters. There are following important points about strings:


    +   1. In a string, the data stored in contiguous memory location.

    2. It has a capacity to hold large character values.

    3. The declaration of string is same as normal arrays.

    4. In the subscript of a string, we put size of strings.

    5. The first index of a string is starting from zero.

    6. The string will be end of null character (''\0'').

    7. The address of first index of string is called base address.

    8. There is no bound of strings checking in c that means it can be more elements
    beyond the size.


    There are following declaration of string.


    char str [6];


    The initialization of a string is


    ```

    str [6] = {''M'', ''I'', ''S'', ''T'', ''H'', ''I'', ''\0''}

