    # # 3.6 Queue


    Queue is the data structures where insertion and deletion operation perform from
    two different ends. Insertion operation is done at one end called rear and deletion
    is done at another called front. Queue data structure follow First in First Out
    (FIFO) property that when we insert an element first it will be deleted first.
    There are several examples of queue in real life like railway reservation, line
    of ticket counter in cinema hall etc. There are two ways to implement queue data
    structure, the first is compile time implementation and the second is run-time
    (Dynamic) implementation. For implementing a queue at compile time, we use array
    and run-time implementation we can understand the whole process from Fig. 3.7
    and Fig. 3.8.'
