    # CHAPTER 7

    Stacks


    # 7.1 Introduction to Stack


    Stack is non-primitive linear data structure. This is in the form of ordered list.
    In this data structure, the insertion and deletion are performing only at one
    end. The index which is performing. The stack follows Last In First Out (LIFO)
    property, the data item inserted at the last position it will deleted first. Real
    life example of stack are: arrangements of plates in a party, arrangements of
    grain packets in warehouse etc.,


    When stack is created then the base is fixed and increment the data elements being
    incremented and it depends on the top. We increment the top one by one.


    # 7.2 Definition


    Stack is a special type of data structure which follow LIFO property. The insertion
    and deletion are perform at only one end that is top.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_128_0.png)'
  - '[PAGE 129]


    # # 7.3 Stack Implementation


    There are two types of implementing a stack.


    +   1. Static Implementation


    +   2. Dynamic Implementation


    **Static Implementation:** It use array for static implementation. This is very
    easy implementation but the creation of stack is not an easy task because first
    of all it has to mention a size of stack. This implementation is very efficient
    for utilizing a memory.


    **Dynamic Implementation:** It uses pointer or linked list for dynamic implementation.
    In dynamic implementation, we use pointers and nodes are created at run time.
    There is no overflow condition for dynamic implementation.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_129_0.png)


    # # 7.4 Operations of Stack


    **Push Operation**


    When new element is inserted into the stack, it is called push operation. When
    we push element in stack then it has to increment the value of top.


    **Pop Operation**


    When element is deleted from the stack, it is called pop operation. When we pop
    element from stack then it has to decrement the value of top.'
  - '[PAGE 130]


    # Traverse Operation


    When elements have to display on the screen or visit all element, this operations
    is called traverse operation. The traversing operations depends on the top value.


    # Algorithm for push, pop and traverse operation in stack


    # Push


    +   Push(stack [MAX SIZE], item)

    Step. 1. Initialize

    Step. 2. Set top=-1

    Step. 3. Repeat step 3 to 5 until top< max size-1

    Step. 4. Read, Item

    Step. 5. Set top=top+1;

    Step. 6. set stack[top]=item

    Step. 7. Print “stack Overflow”,


    # Pop


    +   Pop(Stack[MAX SIZE], item)

    Step. 1. Repeat step 2 to 4 until>=0

    Step. 2. item=stack[top]=top+1;

    Step. 3. set top=top-1

    Step. 4. Print “No item is deleted"

    Step. 5. Print “Stack is underflow”


    # Traverse


    +   Traverse(stack [MAX SIZE], item)

    Step. 1. Initialize

    Step. 2. Set i=top

    Step. 3. Repeat step 3 to 5 until top< max size-1 Step. 4. Print, Item

    Step. 5. Set i=i+1;


    # 7.5 Applications of Stack


    There are various types of applications of stack:


    +   1. Recursion

    2. Reverse polish notation (Infix to postfix notation]'
