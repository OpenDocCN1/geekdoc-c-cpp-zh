    # 10.12 Threaded Binary Tree


    A binary tree is threaded by making all right child pointers that would normally
    be null to the inorder successor of the node, and all left child pointers that
    normally be null point to the inorder predecessor of the node. There are two important
    points about the threaded binary tree.


    +   1. We have the pointers reference to the next node in an inorder traversal
    that is called threads.

    2. We need to know if a pointer is an actual link or a thread, so we keep a boolean
    for each pointer.


    We use threaded binary tree because binary trees have a lot of wasted space: the
    leaf nodes each have 2 null pointers. We can use these pointers to help us in
    inorder traversals. Threaded binary tree makes the tree traversal faster since
    we do not need stack or recursion for


    # 10.12.1 Types of Threaded Binary Trees


    **Single Threaded:** Each node is threaded towards either the inorder predecessor
    or successor means all right null pointers will point to inorder successor or
    all left null pointers will point to inorder predecessor.


    **Double Threaded:** each node is threaded towards both the inorder predecessor
    and successor means all right null pointers will point to inorder successor and
    all left null pointers will point to inorder predecessor.


