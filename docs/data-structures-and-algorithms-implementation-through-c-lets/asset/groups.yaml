    element which is inserting at last it will be the first to access. Therefore,
    stack takes constant time to push the data but it takes linear time in worst case.
    There are two ways to implement stack data structure, the first is compile time
    implementation and the second is run-time implementation. We can understand the
    whole process from Fig. 3.5 and Fig. 3.6.


