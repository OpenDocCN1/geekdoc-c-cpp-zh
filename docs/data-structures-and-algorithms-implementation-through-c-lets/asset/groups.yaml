    # 14.5 Collision Resolution Technique (CRT)


    There are two types of collision resolution technique.


    +   1. Chaining

    2. Open Addressing


    # 1. Chaining


    Chaining is one of the techniques for resolving a collision. As we know collision
    means multiple key values are located in same hash address. Let''s take an example
    for understanding chaining.


    ```

    M = 10

    Keys = 15, 28, 38, 26, 48, 55, 71, 92, 98, 33.

    ```


    Hash function


    ```

    h(x) = x Mod M

    ```


    The longest chain possible with the n keys in chaining is O(n).

    There are following properties for chaining


    +   1. In the worst case searching time is O(n).

    2. In chaining, we are taking extra space in the form of linked list.

    3. Deletion is easier by using chaining.'
