    # 11.4 Graph Traversals


    Graph traversal is a technique used for searching a vertex in a graph. The graph
    traversal is also used to decide the order of vertices to visit in the search
    process. A graph traversal finds the edges to be used in the search process without
    creating loops means using graph traversal, we visit all vertices of graph without
    getting into looping path.


    There are two graph traversal techniques and they are:'
  - '[PAGE 330]


    +   1. DFS (Depth First Search)

    2. BFS (Breadth First Search)


    # # 11.4.1 DFS (Depth First Search)


    DFS traversal of a graph, produces a spanning tree as final result. Spanning Tree
    is a graph without any loops. We use Stack data structure with maximum size of
    total number of vertices in the graph to implement DFS traversal of a graph.


    We use the following steps to implement DFS traversal.


    Step 1. Define a Stack of size total number of vertices in the graph.


    Step 2. Select any vertex as starting point for traversal. Visit that vertex and
    push it on to the Stack.


    Step 3. Visit any one of the adjacent vertex of the vertex which is at the top
    of the stack which is not visited and push it on to the stack.


    Step 4. Repeat step 3 until there are no new vertex to visit from the vertex on
    top of the stack.


    Step 5. When there is no new vertex to visit then use back tracking and pop one
    vertex from the stack.


    Step 6. Repeat steps 3, 4 and 5 until stack becomes Empty.


    Step 7. When stack becomes Empty, then produce final spanning tree by removing
    unused edges from the graph.


    Step 8. Back tracking (coming back to the vertex from which we came to current
    vertex) is coming back to the vertex from which we came to current vertex.


    Following is the example of DFS traversal.


    ![](img/cbd38072d10706a376a60fc30bd31ea8_330_0.png)'
