    ![](img/cbd38072d10706a376a60fc30bd31ea8_41_0.png)


    Solution:

    f(n) = 1² + 2² + 3² + ... + n² = (n + 1)(2n + 1)/6 = O(n³)


    ## Example 21: Find the complexity of the following function.

    f(n) = \sum_{i=1}^{n} x^i


    Solution:

    f(n) = x¹ + x² + x³ + ... + xⁿ = x(xⁿ - 1)/(x - 1) = O(xⁿ)


    ## Example 22: Find the complexity of the following function.

    f(n) = n


    Solution:

    f(n) = n (n - 1) (n - 1) - ... - (n - 1) = n × n × n × n = n⁴=O(n)


    ## Example 23: Find the complexity of the following function.

    f(n) = n² + n log n


    Solution:

    n² + n log n = O(n²) or n + n log n = O(n²)

    Therefore n² + n log n = O(n²))


    ## Example 24: Find the complexity of the following function.

    f(n) = n³ + 1


    Solution:

    The greatest power of given function is n³. Therefore, the complexity of n³ +
    1n² = O(n³)


    ## Example 25: Show that f(n) = n² + 3n - 1 = O(n²)


    Solution:

    We need to find c and n₀ such that: n² + 3n - 1 ≤ cn² for all n ≥ n₀. Divide both
    sides by n², getting: 1 + 3/n - 1/n² ≤ c for all n ≥ n₀. If we choose n₀ equal
    to 1, then we need a value of c such that: 1 + 3 - 1 ≤ c. We can set c equal to
    5. Now we have: n² + 3n - 1 ≤ 5n² for all n ≥ 1.


    ## Example 26: Show that n⁴ ≠ O(n³).


    Solution:

    Let''s assume the contrary that n⁴ = O(n³). Then there must exist constants c
    and n₀ such that n⁴ ≤ cn³ for all n ≥ n₀. Dividing by n³, we get: n ≤ c for all
    n ≥ n₀. But this is not possible; we can never choose a constant c large enough
    that n will exceed it, since n can grow without bound. Thus, the original assumption,
    that n⁴ = O(n³), must be wrong so n⁴ ≠ O(n³).


    ## 2.7.1 Properties of Asymptotic Notation


    There are various types of properties of asymptotic notation. Some of the properties
    are:


    ### Reflexive property

    - f(n) = O(f(n))

    - f(n) = \Omega(f(n))

    - f(n) = \Theta(f(n))


    ### Symmetric Property

    - f(n) = O(g(n)) then g(n) ≠ O(f(n))

    - f(n) = \Omega(g(n)) then g(n) ≠ \Theta(f(n))

    - f(n) = \Omega(g(n)) then g(n) ≠ \Omega(f(n))


    ### Transitive Property

    - f(n) = O(g(n)) & g(n) = O(h(n)) then f(n) = O(h(n))

    - f(n) = \Omega(g(n)) & g(n) = \Omega(h(n)) then f(n) = \Omega(h(n))

    - f(n) = \Theta(g(n)) & g(n) = \Theta(h(n)) then f(n) = \Theta(h(n))


    ### Some Other Properties

    - f(n) = O(f(n/2))

    - If f(n) = O(g(n)) then log(f(n)) = O(log(g(n))

    - If f(n) = O(g(n)) then 2f(n) = O(2g(n))

    - If f(n) = O(g(n)) then h(n).f(n) = O(h(n)g(n))

    - f(n) = O(g(n))^2

    - If f(n) = O(d(n)) & g(n) = O(h(n)) then f(n) + g(n) = O(d(n) + h(n))

    - If f(n) = O(d(n)) & g(n) = O(h(n)) then f(n) × g(n) = O(d(n) ×h(n))


    ## Example 27: Suppose T₁(n) = O(f(n)) & T₂(n) = O(f(n)) then which of the is
    true?


    - (a) T₁(n) + T₁(n) = O(f(n))

    - (b) T₁(n) = O(T₂(n))

    - (c) T₂(n) = O (T₁(n))

    - (d) T₁(n)/ T₁(n) = O(1)


    **Solution:** As per the property statement a) is true because the property is,

    f(n) = O(d(n)) & g(n) = O(h(n)) then f(n) + g(n) = O (d(n) + h(n))

