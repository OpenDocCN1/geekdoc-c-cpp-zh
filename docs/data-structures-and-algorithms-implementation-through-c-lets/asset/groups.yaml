    - 2. Prim's Algorithm\n\n### 11.6.1.1 Kruskal's Algorithm\n\nKruskal's algorithm\
    \ is used to find the minimum cost spanning tree and uses the greedy approach.\
    \ This algorithm treats the graph as a forest and every node has as an individual\
    \ tree. A tree connects to another only and only if, it has the least cost among\
