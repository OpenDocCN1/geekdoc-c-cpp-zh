    ## Weakness of Hashing


    For any choice of hash function there exist bad set of keys that hash to same
    slot. The solution of these types of problem is to pick hash function randomly.
    This type of hashing is known as universal hashing.


    ## 3. Double Hashing


    h(k,i) = (h1(k) + i * h2(k)) Mod M


    ```

    i = {0, 1, 2, ..., m - 1}

    h1(k) = k Mod M

    h2(k) = 1 + (k Mod(m - 1))

    ```


    Example 3:

    M = 13

    h1(k) = k Mod M

    h2(k) = 1 + k Mod (m - 1)

    Keys: 79, 69, 72, 98, 14, 50, 66

    CRT = Double Hashing

    h(k, i) = (h1(k) + i * h2(k)) Mod 13


    ## 14.6 Perfect Hashing


    The goal of perfect hashing is O(1).

    There are following properties of perfect hashing:

    - Instead of making keys to the same slot.

    - We use small hash function with associated table.

    - This process is known as perfect hashing.

    - Collision at all.


