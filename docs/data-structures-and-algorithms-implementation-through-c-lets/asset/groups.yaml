    # # CHAPTER 3

    Introduction to Data Structure


    # ## 3.1 Introduction


    Generally, an organization of data is necessary because the data properly organized
    then it can be easily accessible. Data structure plays very important role in
    our daily life. In any shops, malls all the commodities are placed in proper position
    due to the searching of commodities becomes easier. If all the stuffs are managed
    at anywhere it will take less time to access. The data structure is also an organization
    of data in a proper manner.


    # ## 3.2 Definition


    Data Structure represents logical relationship between data. Moreover, it is the
    way to organize data in efficient manner. Data structure is mainly used in four
    functions.


    +   1. Organization of data

    2. Accessibility method of data

    3. Degree of Associativity

    4. Processing of information


    # ## 3.3 Classification of Data Structure


    The data structure is generally classified into two parts.


    +   1. Primitive Data Structure

    2. Non-primitive data structure


    # ### 3.3.1 Primitive Data Structure


    This is a basic data structure and is operated directly in the machine instruction.
    Just like integer, character, float, pointer etc.'
  - '[PAGE 53]


    # ### 3.3.2 Non-Primitive Data Structure


    This is a complex data structure that is derived from the predictive composite
    instrument. Non-primitive data structure imposes Homogenous Type and Heterogeneous
    Type. Like arrays and structures


    Generally, data structure can be divided into four types


    +   1. Creation

    2. Deletion

    3. Accessing

    4. Modification


    # #### Creation


    This operation reserves memory. This operation is perform at the time of declare
    statement.


    # #### Deletion


    This operation is for destroying a memory. To occupy a memory we use malloc()
    and calloc() function. But if we have to destroy a memory we use free() function.


    # #### Selection


    This operation is use for an accessing a data. If data is presented in data structure
    then operation is successful otherwise operation is unsuccessful.


    # #### Modification


    This operation is use for updating a data from data structure. The modification
    operation is performed then previous data has destroyed automatically. (Fig. 3.1)'
