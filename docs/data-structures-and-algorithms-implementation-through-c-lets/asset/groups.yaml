    # # 10.16 M-way Tree


    In the previous topic we have also studied binary search trees as special case
    of binary trees where key values of the left child of a node is always less than
    the key value of the node itself and key values of right child of a node is always
    greater than the key value of the node itself. Such an arrangement'
  - '[PAGE 299]


    maintains the order of the keys which is helpful in fast searching and updating
    operations.


    Such link also exists between M-way trees and M-way search trees. In M-way search
    trees an order is maintained for the key values of the node, M-way search trees
    are also used for their fast searching and updating operation.


    There are following properties of M-way tree:


    +   1. Multi-way search trees generalize binary search tree by allowing more than
    one key to be stored in a given node.

    2. There will always be one more pointer than key.

    3. So, if a node has two keys, it would have three pointers, with three children.

    4. If a tree has more than two children, you can decrease the height of the tree
    with the same number of nodes.

    5. The keys in a node are maintained in order.


    The minimum child is 2 and it has many keys $k_i k_{i+1} k_{i+2} \dots k_j$


    ![](img/cbd38072d10706a376a60fc30bd31ea8_299_0.png)


    Fig. 10.2: M-way Tree


    For all $k_a \le k_i, k_i \le k_b, k_b \le k_{i+1}, k_{i+1} \le k_c, k_c \le k_{i+2},
    k_{i+2} \le k_d, k_d \le k_e, k_e \le k_j$ and $k_j \le k_f$:


    The one of M-way search tree is B-tree.


