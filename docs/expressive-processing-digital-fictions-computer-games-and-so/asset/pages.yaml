- pgno: 28
  md: '# Terms for Thinking about Processes


    The idea of operational logics is my way of talking about aspects of digital media
    with which other authors and designers are also concerned. Given this, it should
    be no surprise that operational logics are related to some of the ideas others
    have proposed for thinking about digital media systems. Ian Bogost’s Persuasive
    Games (2007), for example, positions my notion of operational logics as the “tropes”
    of procedural rhetoric (which seems appropriate, at least for those logics that
    clearly structure audience experience). The concept of operational logic is also
    not unrelated to Bogost’s figure of the “unit operation”—though Bogost’s aim is
    in some ways more general in that his work creates a foundation for “any medium—poetic,
    literary, cinematic, computational” to “read as a configurative system, an arrangement
    of discrete, interlocking units of expressive meaning” (2006, ix). At the same
    time, Bogost’s aims are also more specific. For example, he writes, “Unit operations
    are modes of meaning-making that privilege discrete, disconnected actions over
    deterministic, progressive systems.... In software technology, object technology
    exploits unit operations; structured programming exhibits system operations” (3).
    In my current thinking, I use the concept of operational logics only in reference
    to computational systems (not, for instance, traditional cinema) and in a manner
    that encompasses both what Bogost calls unit operations and system operations.


    Game design is certainly one area for which it is particularly important to consider
    the parts of a system that operate and connect, and that can be combined and adjusted
    to create successful audience experiences. One influential framework for thinking
    in these terms is called MDA, standing for Mechanics, Dynamics, and Aesthetics
    (Hunicke, LeBlanc, and Zubek 2004). In the language of game design, especially
    for those familiar with the MDA framework, what I call operational logics might
    often be termed mechanics—except that MDA mechanics are framed as being limited
    to operational logics experienced by the audience. As Robin Hunicke, Marc LeBlanc,
    and Robert Zubek write, “Mechanics are the various actions, behaviors and control
    mechanisms afforded to the player within a game context.”


    Coming from a rather different direction, computer science has also thought quite
    a bit about the question of system operations. A general computer science term
    for a more abstract level of consideration of the operations of process and data
    is algorithms. This concept certainly shares the relatively implementation-independent
    nature of operational logics (an introduction to algorithms class may implement
    the “bubble sort” algorithm in many languages and on many platforms). Yet, for
    an operational logic to be useful in interpretation, it need not have the characteristics
    that D. E. Knuth requires of algorithms (1968). For example, it need not be definite
    (the terms employed can require human knowledge rather than being specified at
    a computable level of detail). More fundamentally there is little emphasis in
    computer science education on considering algorithms and their relationships critically
    or aesthetically—rather than in terms such as efficiency.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Looking Forward


    If I am successful, *Expressive Processing* is two books in one. One book makes
    an argument that we need to pay more attention to the processes of digital media.
    This book is an example of the expanding area of software studies (discussed in
    more detail in chapter 5). It makes its case on authorial, critical, and political
    levels. It outlines my two primary meanings for *expressive processing* along
    with the three general effects I have identified in the relationship between system
    processes and audience experiences. It presents a way of thinking about software
    and media that grows from my interactions with writers, artists, game designers,
    computer scientists, and humanities scholars—and I hope it will be of use to members
    of all these groups. A book like this must be supported with examples, but I believe
    that such a book could have been written by an author with a passion for any one
    of a variety of types of digital media, from computer music to generative visual
    art.


    The other book within these covers is the one shaped by my passion for digital
    fictions and games. It tells a history of process-oriented innovations in these
    areas—a history that can provide inspiration (and cautionary guidance) as we create
    the projects that will shape the future of storytelling and play. We are in the
    midst of a creative explosion in these areas, and that is an exciting place to
    be. As our work moves forward, we are also coming to see that the exciting possibilities
    aren''t necessarily those assumed earlier. We aren''t finding greater authorial
    power in closer approximations of everyday reality. Rather, we''re finding it
    in models that are deliberately artificial, emphasizing elements that capture
    the imaginations of'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'authors, expressing a view of the world that can matter to audiences—just as
    traditional fictions have left out most of their characters’ lives in favor of
    those elements central to that particular world. Similarly, we aren’t finding
    greater potential in obviously “natural,” “immersive,” or “invisible” interfaces.
    It is instead those that expose the evolving state of the underlying system and
    the opportunities for audience action in connection with their fictions that are
    creating exciting new roles for us (no longer simply visual “viewers,” textual
    “readers,” or formal system “players”) as well as helping us develop new modes
    of understanding for fictional worlds. This in turn provides the strongest connection
    for the two books between these covers. Coming to understand fictional worlds
    as systems—and exploring their potential through play—is also a powerful means
    of coming to understand our evolving society, in which (often hidden) software
    models structure much of how we live now.


    I assume most readers are drawn to *Expressive Processing* primarily for one of
    these two intertwined books. My hope is that whatever your starting interests,
    you will come away having found something of value in both.'
