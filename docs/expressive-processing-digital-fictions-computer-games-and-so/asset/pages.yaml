    linguistics, and information visualization to create software for interacting
    with very large-scale conversations (VLSCs). Examples of these VLSCs are messages
    sent to Internet newsgroups and mailing lists. The Conversation Map analyzes a
    VLSC to discover which participants are responding to others, possible themes
    of the conversation, and “semantic network” mappings of terms that are used similarly.


    Just as Regime Change and News Reader make a first step from batch mode to play,
    Sack’s Agonistics (2004) uses techniques much like those of Conversation Map but
    moves in the direction of play. Specifically, rather than focusing on the presentation
