    reality. And statistical techniques don’t just help computers recognize what words
    people speak; they can also analyze patterns of words. The most successful email
    spam filters, for example, are built using statistical AI techniques.


    The rise of statistical AI presents a significant challenge to those who believe
    that AI systems should be structured based on theories of human intelligence.
