- pgno: 55
  md: '# Computer and Tabletop Role-Playing Games


    Many computer RPGs trace their origins to tabletop RPGs—and sometimes the distance
    traced is quite short. Games such as BioWare''s *Neverwinter Nights* computer
    RPG (Oster et al. 2002) are licensed versions of the tabletop RPG *Dungeons &
    Dragons* (Gygax and Arneson 1974). Further, the more abstract underlying "d20
    system" developed for the third edition of *Dungeons & Dragons*—but then adopted
    for many tabletop RPGs, from *D&D* publisher Wizards of the Coast (WotC) and others—has
    also been used by computer RPGs such as *KotOR* (Falkner et al. 2003), as pointed
    out by Jason Rohdy in the blog-based peer review of this book. It is also interesting
    to note that WotC publishes a tabletop RPG based on the d20 system and set in
    the Star Wars universe, for which there is a campaign guide for *KotOR* (Thompson
    et al. 2008)—presenting a rare opportunity to compare two different implementations
    of the same fictional world in the same basic game system, one computer and one
    tabletop.


    At the same time, it is also worth noting that computer games developed in parallel
    with tabletop RPGs, so the larger genre of computer RPGs might be seen as a convergence
    of the two traditions—rather than a translation of the tabletop genre into computer
    form. In the blog-based peer review for this book, Dennis G. Jerz pointed particularly
    to early computer games such as *Hunt the Wumpus* (Yob 1973) and *Maze War* (Colley
    and Thompson 1973–1974). Certainly these are important to consider. Still, as
    Matt Barton recounts in *Dungeons and Desktops*, "There really is no doubt that
    *D&D* played a vital role in the development of the first CRPG. Richard Garriott,
    creator of *Akalabeth* and *Ultima*, was himself a dedicated fan of the game"
    (2008, 13). That said, Barton also argues that the importance of a number of other
    influences on the computer RPG should be recognized, including the computer game
    *Adventure* (Crowther and Woods 1976), sports simulation games, tabletop war games
    (the tradition from which *D&D* emerged), and the writings of J. R. R. Tolkien.


    The history we trace by this method is definitely a Western one, however. The
    history of the flourishing form of the Japanese RPG is rather different. As William
    Huber writes:


    > The Japanese reception of role-playing games includes a discontinuity; there
    is little sign of a culture of tabletop fantasy role-playing games in Japan before
    the production of computer-based games. *Dungeons & Dragons* was translated into
    Japanese in 1985, the same year that *Dragon Quest* was released: The Ultima and
    *Wizardry* games were already in widespread Japanese distribution by this time
    ... . Thus the temporal framework for the RPG in Japan has been primarily computer-based
    from the outset: the evolution of RPG mechanics as a practice performed by a collaborating
    group of players does not exist in Japan. The "roles" of role-playing are categories
    of character function, and the player-driven theatrical aspects of pen-and-paper
    role-playing are instead replaced by story practices that owe as much to cinema
    and television as they do to military simulation. (2009)'
