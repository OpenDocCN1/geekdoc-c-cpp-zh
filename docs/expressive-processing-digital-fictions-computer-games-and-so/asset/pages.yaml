    # Critiques of Strips and F.E.A.R.


    In his dissertation’s discussion of Tale-Spin, Meehan addresses Strips as an important
    piece of prior work in AI. But he also critiques it severely, contending that
    it is an unlikely model for human cognition. For example, Meehan points to the
    way that Strips stores information about the world using first-order predicate
    calculus. This represents all facts about the world as formal logical expressions,
    with “reasoning” about those facts performed using theorem-proving techniques.
    Meehan and other scruffy researchers argued strongly—with some experimental data
    for support—that humans don’t remember all facts about the world in the same way
    or reason about them all using the same approach. Instead, scruffy researchers
    maintained that human intelligence operates in different ways within'
