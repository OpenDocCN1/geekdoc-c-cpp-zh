    # Statistical AI


    We can see, in *Minstrel*, symptoms of a much larger

    problem—one that Turner alone could have done little

    to address. By the late 1980s, it was clear that AI systems

    in general were not living up to the expectations that

    had been created over the three previous decades. Many

    successful systems had been built—by both neats and

    scruffies—but all of these worked on small sets of

    data. Based on these successes, significant funding had

    been dedicated to attempting to scale up to larger, more

    real-world amounts of data. But these attempts failed,

    perhaps most spectacularly in the once high-flying area

    of “expert systems.” The methods of AI had produced,

    rather than operational simulations of intelligence,

    a panoply of idiosyncratic encodings of researchers’ beliefs

    about parts of human intelligence without any means of

    compensating for the nonsimulation of the rest of human

    intelligence. Guy Steele and Richard Gabriel (1993, 30),

    in their history of the Lisp programming language, note

    that by 1988, the term “AI winter” had been introduced

    to describe the growing backlash and resulting loss of

    funding for many AI projects. In this vacuum, assisted by

    steadily increasing processing power, a new form of AI

    began to rise in prominence.


    As some readers of this book no doubt remember,'
