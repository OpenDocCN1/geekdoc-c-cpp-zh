    experience defined in terms of the number and types of narrative phrases that
    can be employed at a given stage. Each audience call is scanned for keywords,
    which are used to select the theme domains blended in each system response. His
    early examples focused on textual output, but his framework supports a broader
    definition of text that includes output in multiple modalities—for instance, a
    type of visual poetry described in this section.


    At the heart of the Griot system is his Alloy blending algorithm. This algorithm
    takes as input two algebraically represented concepts to be blended: a base concept
    that represents the shared structure between those concepts, and mappings between
    the base concept and other input concepts. It finds all of the possible ways to
    combine those concepts using a set of principles based on how the concepts are
    structured, how they map to each other, how much of the input concepts are preserved
    in the blend, and whether data types change or not as they are blended. Griot
    uses a subset of the full power of the Alloy approach—for example, often just
    outputting the most optimal blend—and Harrell continues to develop ways to use
    the generative power of blending to allow texts to create new, thematically constrained
    meanings on the fly (Goguen and Harrell forthcoming).


    We can see specific examples of this in Harrell''s variable narrative poem The
    Girl with Skin of Haints and Seraphs (2007). The narrative structure dictates
    that each poem begins with an abstract phrase and an orientation phrase. Possible
    opening phrases include “She begins her days (verb-clause)” and “Each morning
    foes called her (singular-noun).” The domains include Africa, Europe, angels,
    demons, skin, and whiteness. The demons keywords'
