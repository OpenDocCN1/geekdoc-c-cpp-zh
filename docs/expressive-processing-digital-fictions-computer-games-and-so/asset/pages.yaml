    # Griot: Call and Response Narrative


    Deikto could be seen as one example of a widespread mode of playful linguistic
    interaction: “call and response.” Harrell pursues a different form of call and
    response in a strand of his digital media work. He relates this work’s form of
    play to turn-taking traditions ranging from signifyin(g) and Capoeira Angola songs
    to Japanese linked poetry and Oulipian language games. In each of his works in
    this area, the system and audience co-create short texts—with the audience’s contributions
    brief, and indeed often only a word. Such “calls” serve not only as part of the
    surface experience but also shape the operations of the underlying system, after
    which the system responds with another text, and frequently another invitation
    for the audience to make a call in turn.


    The underlying system that Harrell uses to support these experiences is called
    Griot. It is designed to make it possible for authors to craft interactive computational
    narratives and new forms of what he terms “polymorphic discourse” based on the
    blending of thematically important concepts specified using Joseph Goguen’s theory
    of algebraic semiotics. An author specifies theme domains as sets of axioms, phrase
    templates as possible output texts with open slots for the results of conceptual
    blends, and a narrative structure as a sequence for the'
