    # Oz Limitations


    Hap is a powerful tool for defining character behavior. Oz characters such as
    the Woggles were able to move around, engage in solo behaviors, interact with
    each other, and interact with the audience. In some ways they were quite successful,
    widely exhibited and discussed—even if Bates, remarkably candidly, also reports
    that one of their most memorable behaviors occurred as an outgrowth of system
    errors.15


    In this first attempt to use Hap to create a graphical experience, though, a larger
