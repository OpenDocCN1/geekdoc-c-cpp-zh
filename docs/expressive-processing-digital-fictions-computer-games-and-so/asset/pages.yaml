    # Possible Worlds


    A shorthand definition of *fiction* might be a listing of its most familiar forms:
    “novels and short stories,” or perhaps “novels, short stories, theater, television,
    and movies.” Yet such definitions won’t be much help to us if we are interested
    in to this, a number of digital media theorists have begun to work with definitions
    of fiction emerging from possible worlds theory and modal logic. These are among
    a wider group of literary approaches derived from philosophy and linguistics,
    and this particular strand began to establish its own identity in the 1970s. In
    *Possible Worlds, Artificial Intelligence, and Narrative Theory*, Marie-Laure
    Ryan (1992) traces the lineage of this work to the late-1970s essays of a number
    of writers.¹⁰


    In philosophy the notion of possible worlds is often traced back to Gottfried
    Wilhelm Leibniz, whose position is perhaps most widely remembered as that devoutly
    held by Dr. Pangloss in Voltaire’s *Candide*. Leibniz argued that there are an
    infinity of possible worlds in the mind of God—and that one of them, the best
    possible, is the one in which we live. Leibniz’s position is engaged with the
    most elevated concerns of philosophy and theology, but that is not the only place
    we find possible worlds. Closer to home, we imagine possible worlds when we speculate
    (“I wonder if the lunch special will be Lemongrass Tofu”), when we wish (“I hope
