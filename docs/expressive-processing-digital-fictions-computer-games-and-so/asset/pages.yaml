- pgno: 86
  md: 'an Eliza conversation, is that the number of potential outcomes is huge. Unfortunately,
    there is a mismatch between the great variety of situations in which KatOR is
    expected to perform a fiction and the simple model of fiction and character embodied
    in KatOR''s processes—just as there is a massive mismatch between the complexity
    of human language to which Eliza must respond and its extremely simple model of
    conversation (as a series of transformations). The result, in both cases, is a
    tendency toward breakdown that takes a shape determined by the underlying processes.
    And, as with Eliza, the processes of KatOR are of a basically uninteresting shape.


    To put it succinctly, the practices of the mainstream game industry present authors
    of digital fictions with two bad options for going forward. One is to “design
    around” breakdown, as PoP does, and essentially forfeit the processing power of
    digital media at the level of the fiction. The other option is to attempt to layer
    a semiflexible story—organized as a set of ordered milestone progressions—over
    a much more flexible game world. This creates a space of play that, if embraced
    by players, leads to unsatisfying breakdown.


    In short, the time is ripe for a new approach to game fiction. But just as Doom
    could not be built on the approach to graphics in Myst, this will require an approach
    to fiction and character that is fundamentally different, that is more expressive
    and flexible than quest flags and dialogue trees. Luckily, this work does not
    need to begin from scratch. It can start instead by building on a history that
    has been present as a strand of practice within the artificial intelligence community
    since the time of Eliza. The coming chapters explore this history.'
