    # Missing Characters


    In her book, Murray discusses Tale-Spin in the context of an argument that “for
    authors to create rich and satisfying stories that exploit the characteristic
    properties of digital environments . . . [w]riters would need a concrete way to
    structure a coherent story not as a single sequence of events but as a multifold
    plot” (1997, 185). We might expect, given this, Murray would criticize Tale-Spin
    for organizing its operations at the level of character, rather than at the level
