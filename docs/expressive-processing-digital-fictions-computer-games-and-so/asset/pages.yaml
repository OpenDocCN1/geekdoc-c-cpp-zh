    The typical conception of a beat is provided by Robert McKee: “an exchange of
    behavior in action/reaction. . . . [T]hese changing behaviors shape the turning
    of a scene” (1997, 37). Mateas and Stern cite a famous beat from _Casablanca_:
    “Rick: ‘Why’d you come back?’ To tell me why you ran out on me at the railway
