  md: '# Understanding Simulations


    The concerns about work such as Wright’s get to the heart of what is involved
    when we use computer models to make nonabstract media. As Ian Bogost observes
    in Unit Operations, “The relationship or feedback loop between the simulation
    game and its player are bound up with a set of values; no simulation can escape
    some ideological context” (2006, 99). Or as Ted Nelson put it succinctly two years
    before SimCity’s release, “All simulations are political” (1987, CL 149).


    In the case of SimCity, Wright’s inspirations include some decidedly political
    simulations: the “system dynamics” work of MIT’s Forrester. When applied to urban
    planning in the late 1960s, these simulations produced anger from many quarters.
    As Forrester reports in “The Beginning of System Dynamics,” his conclusions included
    the idea that “low-cost housing was a double-edged sword for making urban conditions
    worse. Such housing used up space where jobs could be created, while drawing in
    people who needed jobs. Constructing low-cost housing was a powerful process for
    creating poverty, not alleviating it” (1989). Forrester’s criticisms were quick
    to point out that his models were based on assumptions far from verifiable (e.g.,
    that housing is a stronger attraction than jobs) and that the workings of his
    simulated city were not like those of contemporary U.S. urban centers (e.g., Forrester’s
    city was of a fixed size, and commuting to or from the city was impossible).


    Of course, any simulation requires simplifying assumptions. A map as large and
    detailed as the territory is no map at all. And for many things one might like
    to simulate—such as human behavior—no one knows'
