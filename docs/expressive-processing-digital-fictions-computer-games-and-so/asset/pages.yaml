  md: 'in the early 1990s the World Wide Web was largely organized by humans. The
    “What’s New” page at the National Center for Supercomputing Applications provided
    regular links to new Web resources (much like one of today’s blogs), and Yahoo!—still
    on servers at Stanford University—maintained a growing hierarchical directory
    to which pages were added by hand. Many individuals maintained hotlists (or pages
    of links) that were the definitive sources for finding the Web’s best information
    on certain topics. Much as pre-Dewey librarians had done before, and AI researchers
    more recently, these editors of Web resources organized knowledge according to
    their own ideas (often no more than intuitions) of what belonged with what. Web
    page “meta tags” helped authors express what they felt were the relevant keywords
    for their contributions, and page titles were an important factor in determining
    which results came back from a search. Generally, finding resources with “cool
    shades” next to them in the Yahoo! directory was a better route to information
    than using the clumsy search engines.


    But this began to change, and quickly, as search engines improved. This improvement
    came not by engines coming to better “understand” the pages they indexed—or to
    put it another way, not by better interpreting document contents as traditional
    AI researchers had attempted— but by counting. For example, the “PageRank” algorithm
    that rocketed Google to success operates by counting the links that interconnect
    web pages. As the Google web site explains:


    PageRank relies on the uniquely democratic nature of the web by using its vast
    link structure as an'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'indicator of an individual page’s value. In essence, Google interprets a link
    from page A to page B as a vote, by page A, for page B. But, Google looks at more
    than the sheer volume of votes, or links a page receives; it also analyzes the
    page that casts the vote. Votes cast by pages that are themselves “important”
    weigh more heavily and help to make other pages “important.” (n.d.)


    Of course, describing this process as “democratic” is a rhetorical choice on the
    part of Google’s marketing department. When the Web’s most “important” pages are
    almost all owned by media and technology conglomerates, the power to bless viewpoints
    on widely discussed topics (e.g., national politics) with attention via PageRank
    lies in much the same hands as the power to grant attention does in non-Web media.
    If democracy was the goal, one can imagine weighting Google’s statistical model
    somewhat differently. Nevertheless, even if it is possible to debate whether PageRank
    is democratic, there is no contesting that it is statistical. It is based on counting
    information about pages (links in and out) and interpreting the resulting numbers.
    We now take for granted the ability of a computer program to find useful documents
    on a subject that interests us—though it would have seemed an amazing feat of
    AI not that many years ago.


    The success of another high-profile Web business is also partially tied to a statistical
    AI technique: in this case, Amazon’s recommendation system. Amazon doesn’t decide
    which books and movies to recommend to its customers by deeply analyzing the content
    of each item it sells and “noticing” similarities between them. Nor does it simply
    follow rules that dictate recommending, for instance, other books by the same
    author. Instead, it looks at the'
