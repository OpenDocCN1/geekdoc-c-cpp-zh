    be a Charles Dickens or Charlotte Brontë of the digital medium, then Will Wright
    is surely one of his or her key antecedents” (2004, 4). The question is: Can we
    find similar success with characters more complex than eight mood meters, and
    fictions more well formed than *The Sims*’ implied progression through possessions
    and careers?


