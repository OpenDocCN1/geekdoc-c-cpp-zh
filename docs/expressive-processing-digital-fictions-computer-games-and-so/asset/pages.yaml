  md: '# Politics and Processes


    In 1974, the cover of Ted Nelson''s *Computer Lib/Dream Machines* proclaimed,
    “You can and must understand computers NOW!”


    Nelson''s book (mentioned earlier in this book''s discussion of expressive AI)
    wasn''t a response to TIA-style proposals or even the ubiquity of computers. In
    fact, Nelson''s book was published the year before the first personal computer
    kit—the Altair—became available, and long before governments began contemplating
    large-scale data mining. At that time the number of computers was tiny by comparison
    with our present moment. Those that existed were carefully tended by teams of
    professionals (what Nelson called the computer “priesthood”), and determining
    their uses was considered the province of specialists. It seemed a long way from
    everyday life.


    But as Nelson''s book set out to expose, computing was already woven into the
    fabric of society. He pointed to the signs in everyday life (from computer-generated
    junk mail to the soon-to-arrive phenomenon of bar codes on consumer products)
    as well as the less obvious changes as every large organization switched to computer
    record keeping (often restructuring it according to the ideas of, and leaving
    it accessible only to, the computing priesthood), computer simulation began to
    arise as a decision-making aid, and so on. Further, Nelson could already see in
    the field of computer graphics that computers would revolutionize our media—and
    understand that this, too, had political stakes. He wrote, “It matters because
    we live in media, as fish live in water.... But today, at this moment, we can
    and must design the media, design the molecules of our new water, and I believe
    the details of'
