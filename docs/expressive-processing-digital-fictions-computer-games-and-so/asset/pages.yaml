    a miniature philosophy of language in its universe of interpretation or expression.
    When such a system is incorporated into a work of digital media—such as *Tale-Spin*—its
    structures and operations are invoked whenever the work is experienced. This invocation
    selects, as it were, a particular constellation from among the system’s universe
    of possibilities. In a natural-language generation system, this might be a particular
    sentence to be shown to the audience in the system output. From the output sentence
    it is not possible to see where the individual elements (e.g., words, phrases,
    sentence templates, conceptual dependency structures, or statistical language
    models) once resided in the larger system. It is not possible to see how the movements
    of the model universe resulted in this constellation becoming possible—and becoming
    more apparent than other possible ones.


    To put it another way, I hope that this chapter’s examination of *Tale-Spin/Mumble*
    demonstrates that in the world of digital media, and perhaps especially for digital
    fictions, we have as much to learn by examining the model that drives the figurative
    planetarium as by looking at a particular image of stars (or even the animation
    of their movement). This is because the model universes of digital fictions are
    built of rules for character behavior, structures for virtual worlds, techniques
    for assembling human language, and so on. They express the meanings of their fictional
    worlds through the design of every structure, the arc of every internal movement,
    and the elegance or difficulty with which the elements interact'
