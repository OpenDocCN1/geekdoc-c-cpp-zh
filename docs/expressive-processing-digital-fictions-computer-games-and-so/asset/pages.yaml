    # The Author of Brutus''s Stories


    If one accepts Brutus as research into the creation of reusable story components,
    which can be interestingly combined with elements at other levels of abstraction,
    I can actually see much of value in it—though this requires disposing entirely
    with the rhetoric of creativity. However, taking this perspective brings up another
    issue. In discussions of Brutus one particular level of component is privileged:
    the mathematized description of literary themes. But thinking back over the different
    components presented for the Brutus, story outlined in Bringsjord and Ferrucci’s
    book, it becomes apparent that this is the one unnecessary component. It is not
    used in creating characters, relationships, events, or language. All the elements
    of the story are defined independently of the formal account of betrayal. It is
    used only to match elements already in the knowledge base, which could be found
    by any number of other procedures (e.g., choosing a character at random, who will
    already be specified in all the events for his story, which in turn will already
    specify'
