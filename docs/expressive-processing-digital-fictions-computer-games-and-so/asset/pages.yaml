  md: '# Notes


    1. During the blog-based peer review of this book''s manuscript on Grand Text
    Auto (discussed in the afterword), Mark Marino suggested that the ability of computers
    to simulate movie projectors and tape players is “the result of a set of cultural,
    consumer, and producer priorities.” Certainly this is true. While I am writing
    here about what makes this simulation possible, we shouldn’t lose sight of how
    the actual is selected from the possible.


    2. For more on this project, Screen, see chapter 9.


    3. Though the concepts of data and process seem clear enough as ideas, in practice
    any element of a system may be a mixture between the two. For example, the text
    handled by a Web application is generally thought of as data. However, this textual
    data is often a mixture of plain text and markup language tags (from an early
    version of HTML or an XML-defined markup language). These markup language tags,
    in turn, may define or invoke processes, either on the server or in the web browsers
    of the site’s audience. This blurring occurs, in part, because the creation of
    content for the Web can be thought of as one of the most widespread examples of
    declarative programming. In this model, authors focus on what is to be done (e.g.,
    a dynamically-generated menu appearing at a particular location on the page) rather
    than how it will be carried out. Taken further, in a language like Prolog, much
    of an author’s work becomes the expression of logical statements (which may seem
    like data about the world), with “running” the program depending on processes
    (such as search) that are part of the underlying support for Prolog. On the other
    hand, the logical statements provided by Prolog authors are crafted to invoke
    complex reasoning processes, rather than to serve as the final output of the system
    (unlike, say, the data that makes up the video file for a computer game’s cut
    scene). In chapter 6, note 5 discusses the importance of declarative information
    in crafting flexible processes, while chapter 7 contains a section on Brutus,
    a system supported by Prolog. There are also less complex cases, as when a process
    is used to generate data that might as easily have been stored in the system initially,
    producing a tradeoff between storage and computation. Luckily, none of these diminish
    the basic usefulness of the concepts of data and process as a starting point.


