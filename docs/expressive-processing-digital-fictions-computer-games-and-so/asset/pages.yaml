    Suchman presents one of Garfinkel''s experiments as a demonstration of the idea
    that people tend to “take appearances as evidence for, or the document of, an
    ascribed underlying reality, while taking the reality so ascribed as a resource
    for the interpretation of the appearance” (23). In this experiment student subjects
    were introduced to a new kind of therapy in which they asked yes/no questions
