  md: 'Any type of statistical analysis inevitably results in some number of false
    positives—in this case incorrectly labeling someone as a potential terrorist.
    As the entire population would be subjected to TIA surveillance, even a small
    percentage of false positives would result in a large number of law-abiding Americans
    being mistakenly labeled.


    For example, suppose the system has a 99.9% accuracy rate. We believe that having
    only 0.1% of records being misclassified as belonging to potential terrorists
    would be an unachievable goal in practice. However, if records for everyone in
    the U.S. were processed monthly, even this unlikely low rate of false positives
    could result in as many as 3 million citizens being wrongly identified each year.
    More realistic assumptions about the percentage of false positives would drive
    the number even higher. (Simons and Spafford 2003)


    False positives are fine in Google link lists and Amazon purchase recommendations,
    but in other areas their cost is much too high. In the area of surveillance, not
    only would they improperly cast suspicion on many people; the number of false
    leads would also be so high as to overwhelm any group tasked with investigating
    them. Further, the problem of false positives is only one of the serious limitations
    of statistical techniques. Another is the need for large amounts of well-defined
    data in order to develop the system’s model. The amount of information available
    on terrorist activity is small by comparison with that used to build effective
    statistical systems (e.g., Google’s collection of web pages containing links—and
    the patterns sought (e.g., determining whether a conversation is somehow “suspicious”)
    are extremely ill defined compared with statistical AI’s success stories (e.g.,
