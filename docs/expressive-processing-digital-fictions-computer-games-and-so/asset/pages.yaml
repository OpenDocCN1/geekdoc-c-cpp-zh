  md: 'its own FSM, of a much more manageable size than an FSM for controlling the
    character''s entire behavior, and the rules for transitioning between these goal-specific
    FSMs are decoupled from the FSMs themselves—instead those rules are handled at
    the level that determines the current highest-priority goal). Orkin describes
