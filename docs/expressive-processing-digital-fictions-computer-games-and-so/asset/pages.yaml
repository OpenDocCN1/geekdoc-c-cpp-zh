- pgno: 25
  md: 'operational logic can be implemented in a wide variety of ways on a continually
    expanding set of platforms. Once we have identified a logic, it can be informative
    to make comparisons between different instances. These comparisons can delve deep
    into the specifics of how the logic is implemented for different works or operate
    at a higher level, looking at how the same logic can contribute quite differently
    to the experience of a set of works. This is true not only of spatial logics but
    also of many operational elements of systems. Later chapters in this book will
    consider operational logics ranging from the quest logics implemented in many
    computer games to the assertion and inference logics implemented in many symbolic
    AI systems.


    Although operational logics will, I hope, prove powerful for comparative studies,
    in this book they are primarily used within the examination of individual works.
    More specifically, while an operational logic can be seen as a pattern that arises
    in the interplay of the elements of a digital media system, I am interested in
    the examination of the interplay of a system’s operational logics—and in this
    as a starting point for critical interpretation. I pursue this method most explicitly
    in this book’s chapter on Tale-Spin, which identifies planbox-based planning as
    the work’s dominant logic, driving the others (a fact invisible when examining
    only the work’s surface). Though not as explicit in other chapters, this approach
    underlies much of this book’s analysis—and it is my hope that these examples will
    encourage others to further develop their own approaches of this sort (see sidebar,
    “Terms for Thinking about Processes”).'
