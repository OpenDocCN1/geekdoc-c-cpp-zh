    # Oz


    The Oz Project at Carnegie Mellon University—led by Joe Bates from its inception
    in the late 1980s—has an unusual distinction. While *Tale-Spin* and *Universe*
    could be considered outliers among software systems for the fact that both are
    widely credited with outputs they did not produce, the Oz Project may be the only
    computer science research project most famous for an experiment that did not require
    computers. This was an experiment in *interactive drama*, carried out with a human
    director and actors, but aimed at understanding the requirements for software-driven
    systems (Kelso, Weyhrauch, and Bates 1993).


    The dream of interactive drama is often traced back to Brenda Laurel’s 1986 dissertation—which
    in turn draws on a series of memos and articles she wrote, starting in 1981, while
    working at Atari (first as a software marketing manager and then as a research
    scientist).12 After the dramatic rise of Atari’s research lab, only to be disbanded
    after the 1980s crash of the video game market, Laurel’s'
