    # **Authoring Stories**


    When story-generation systems are thought of as media rather than simulations
    of human intelligence, issues of authoring come to the fore. Creating a successful
    story-generation system requires thinking in terms of the audience''s surface
    experience and also in terms of the structures presented for authoring the elements
    of that experience—what Michael Mateas calls the system''s authorial and interpretive
    *affordances*. This chapter examines three influential story-generation systems
    both as authored artifacts and systems for authoring, as well as related concepts
    such as Mateas''s.


    Like any digital media system, a story-generation system has one simple requirement:
    along some dimension(s), the system should offer an advantage over other solutions.
    For example, Infocom sought to create interactive story experiences for broad
    audiences. Implementing a software system had the advantage of making this possible,
    given that it was impossible for Infocom authors to make personal visits to the
    homes and workplaces of thousands of simultaneous players. On a more serious note,
    implementing a virtual machine made it easier for Infocom titles to reach audiences
    playing on the wide variety of 1980s-era personal computing platforms, as compared
    with “porting” the games to each operating system.


    Beyond this simple litmus test, the sorts of story'
