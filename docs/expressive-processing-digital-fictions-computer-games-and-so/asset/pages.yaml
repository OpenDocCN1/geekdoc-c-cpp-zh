  md: "# # Chapter 1\nIntroduction\n\n# ## Media Machines\n\nA computer is a strange\
    \ type of machine. While most machines are developed for particular purposes—washing\
    \ machines, forklifts, movie projectors, typewriters—modern computers are designed\
    \ specifically to be able to *simulate* the operations of many different types\
    \ of machines, depending on the computer’s current instructions (and its available\
    \ peripherals).\n\nThis is why a computer can simulate a movie projector: showing\
    \ a set of image frames in quick succession. It’s also why a computer can act\
    \ like a tape player: reading and amplifying a stream of sound data.¹\n\nAnd it\
    \ is for this same reason that computers can be instructed to act like previously\
    \ impossible types of machines. A computer can simulate a typewriter—getting input\
    \ from the keyboard and arranging pixels on the screen to shape the corresponding\
    \ letters—but it can also go far beyond a typewriter, offering many fonts, automatic\
    \ spelling correction, the painless movement of manuscript sections (through simulations\
    \ of “cut” and “paste”), programmable transformations (such as “find and replace”),\
    \ and even collaborative authoring by large, dispersed groups (as with projects\
    \ like Wikipedia). This is what modern computers (more lengthily called “stored-program\
    \ electronic digital computers”) are designed to make possible: the continual\
    \ creation of new machines, opening new possibilities, through the definition\
    \ of new sets of computational processes.\n\n> 1. During the blog-based peer review\
    \ of this book’s manuscript on Grand Text Auto (discussed in the afterword) Mark\
    \ Marino suggested that the ability of computers to simulate movie players and\
    \ tape players is “the result of a set of cultural ...\n> \n> Notes continued\
    \ at end of this chapter."
  merge: -1
  img_proc: true
- pgno: 13
  md: '“Digital media” are the media enabled by this possibility. This includes Web
    projects like Wikipedia and also all computer games. The first modern computer
    games were created on early stored-program computers, and since then we have seen
    a major cultural impact from the fact that a computer can not only simulate a
    pinball machine but also act like game machines never seen before: a Tetris machine,
    a Doom machine, a SimCity machine, and more.


    Personally, I am fascinated by the possibilities that digital media open for fiction.
    A blossoming of new models of character, story, and language is being enabled
    by computational processes. From computer games with epic structures to experimental
    interactive films, digital fictions are providing diverse experiences for a wide
    range of audiences. From ambitious artificial intelligence (AI) experiments to
    straightforward uses of weblogs and email, authors are creating digital fictions
    at a wide range of technical complexity. The field is already too vast to cover
    in a single book.


    Luckily, quite a number of books have already been written about digital literature,
    and many more have been written about digital media more generally. Almost all
    of these, however, have focused on what the machines of digital media look like
    from the outside: their output. Sometimes the output is considered as an artifact
    and interpreted in ways we associate with literary scholarship and art history.
    Sometimes the output is seen in relation to the audience and the wider culture,
    using approaches from fields like education and sociology. And there are, of course,
    a variety of other perspectives. But regardless of perspective, writings on digital
    media almost all'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'ignore something crucial: the actual processes that make digital media work,
    the computational machines that make digital media possible.


    On the one hand, there is nothing wrong with this. Output-focused approaches have
    brought many valuable insights for those who seek to understand and create digital
    media. Yet, on the other hand, it leaves a big gap.


    This book is my attempt to help bridge the gap. As far as I know, it is the first
    book focused on computational processes that comes from the perspective of media,
    games, and fiction (rather than software engineering or computer science). It
    is a first passage across the gap, and we will want to move much more weight across
    over time. But hopefully it demonstrates that there is something to be gained
    by being able to move between the gap''s two sides, being able to see the inside
    and outside of digital media''s machines.


    # Expressive Processing


    Bridging the gap requires talking about processes in new ways and connecting them
    with broader issues. In this book I work to do this through a notion of expressive
    processing. This term is meant to evoke, in the forthcoming discussions, two important
    things about processes.


    First, computational processes are an increasingly significant means of expression
    for authors. Rather than defining the sequence of words for a book or images for
    a film, today''s authors are increasingly defining the rules for system behavior.
    When I play a computer role-playing game (RPG), author-crafted processes determine
    how I can speak with the non-player characters (NPCs). When I play a simulation
    game, author-crafted processes'
  merge: -1
  img_proc: true
- pgno: 15
  md: '2. For more on this project, Screen, see chapter 9.


    determine the operations of the virtual economy. There is authorial expression
    in what these rules make possible— and also in what they leave out, as compared
    with what we see in the everyday world of human conversation and economic transactions.


    Computational processes can also be used to craft possibilities that aren''t simplified
    models of phenomena from our everyday world. For example, in my own collaborative
    work I take advantage of processes supporting room-size virtual reality displays
    in order to create the illusion of words (from short fictions about memory) peeling
    loose from paragraphs, flocking around the audience, and flying back (or breaking
    apart) when hit by an audience member''s hand. The exact details of this experience
    are different every time, but it always unfolds within parameters determined by
    authored processes, and we can see authorial expression in these processes as
    surely as in those meant to evoke elements of the everyday world.


    Second, I use the term expressive processing to talk about what processes express
    in their design—which may not be visible to audiences. Just as when opening the
    back of a watch from the 1970s one might see a distinctive Swiss mechanism or
    Japanese quartz assembly, so the shapes of computational processes are distinctive—and
    connected to histories, economies, and schools of thought. Further, because digital
    media''s processes often engage subjects more complex than timekeeping (such as
    human language and motivation), they can be seen as “operationalized” models of
    these subjects, expressing a position through their shapes and workings. Processes,
    when examined, may also express a very different set of priorities or'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'capabilities than one might assume from authorial or scholarly descriptions
    of the system.


    These possibilities are explored further in the coming pages, in discussing particular
    works of digital media. This second sense of *expressive processing*—what processes
    express through their designs and histories—is important to me because I think
    it is central to understanding digital media. I also believe that, from this perspective,
    digital media provides particularly legible examples of things that we need to
    understand about software in general. For instance, when we understand the capabilities
    and histories of AI techniques in the context of a relatively easy to evaluate
    area such as computer games (in which, say, NPCs may act in obviously inappropriate
    manners), we can use that understanding to judge proposals for using similar techniques
    in higher-stakes social contexts (e.g., areas such as surveillance).


    The main body of *Expressive Processing* discusses these issues in more detail.
    Rather than theoretical discussion, though, most of the rest of this book is dedicated
    to a close examination of a set of influential examples. These examples are key
    to the history of process-oriented innovation in fiction and games. I find it
    a fascinating history, which I hope will prove thought provoking for fiction writers,
    game designers, AI researchers, and anyone with an interest in the history of
    technology or the future of fiction.


    It is also a history almost never told. Despite increasing interest in computer
    games, digital fictions, and digital media more generally, only bits and pieces
    of the movements traced in this book have appeared elsewhere. Instead, most books
    on related topics have focused on'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'other traditions—ones with relatively stable processes that have served as
    platforms for the creativity of writers and game designers, who have used these
    relatively stable forms to produce a compelling variety of output for audiences.
    Good examples of such work include Nick Montfort’s book on interactive fiction
    (_Twisty Little Passages_, 2003) and Matt Barton’s book on computer RPGs (_Dungeons
    & Desktops_, 2008). There is also a significant body of work that specifically
    looks at what writers can accomplish with digital media, useful introductions
    to which are _Electronic Literature: New Horizons for the Literary_ by N. Katherine
    Hayles (2008) and _Les Basiques: La Littérature numérique_ by Philippe Bootz (2006).
    And of course there are helpful practice-oriented guides to what can be accomplished
    with the game industry’s common processes, such as Lee Sheldon’s _Character Development
    and Storytelling for Games_ (2004) and Chris Bateman’s _Game Writing: Narrative
    Skills for Videogames_ (2006).


    I do write about some of the work considered by these authors in _Expressive Processing_,
    but largely as a way of talking about where we are today. Most of my attention,
    instead, is on the past and the future. I draw many of my examples from AI research
    projects because this is where some of the most revealing processes for character
    and fiction have been created. A number of these are quite famous within certain
    circles, such as the simulated therapist _Eliza_; the first story-generation program,
    _Tale-Spin_; and the widely discussed experimental game _Façade_. Others are less
    well-known. In this book I move along a conceptual trail that connects them—and
    also compare them with mainstream games such as _Star Wars: Knights of the Old
    Republic_, _F.E.A.R._, and _The Sims_. In doing so,'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'I hope to provide a parallel history and set of concepts focused on the development
    of processes that can complement the ongoing discussion that concentrates on the
    nonprocess work of writers and designers.


    Tracing this history, and making these connections, I also draw out a number of
    ideas that may be of use for digital authors, scholars, and members of the public.
    For instance, I consider projects from this history as iconic examples of three
    “effects” that appear throughout digital media, including in today’s systems,
    and from which we can learn important design lessons. I will say more about them
    toward the end of this chapter. First, however, it will be useful to introduce
    the perspective on digital media that underlies my work here.


