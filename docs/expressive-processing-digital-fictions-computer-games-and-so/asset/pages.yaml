    # N-gram Opacity


    Unfortunately, now that they have been encountered by audiences, I can see that
    for Regime Change and News Reader are problematic tools for developing understanding
    of the operational logic of n-grams—in ways that also make them less successful
    in terms of all of our goals for the projects. In fact, one critic, Marie-Laure
    Ryan, explicitly cites them as an example of “anti-WYSIWYG aesthetics” (2005).
    For Ryan, what is interesting about them cannot be seen on the surface.


    The audience members, like Osman, who understand these projects deeply have not
    generally developed the understanding through play with their surfaces. Rather,
    they have also read what we’ve written, perhaps talked with us about them, and
    maybe even teased out telling differences between our systems and others. I can
    see in retrospect that the opacity of the project to most audience members arises
    because we did not go far enough with our two initial design decisions.


    First, we chose to have our n-gram play happen in a textual context (that of an
    existing document) rather than in a blank text buffer. But we sacrificed most
