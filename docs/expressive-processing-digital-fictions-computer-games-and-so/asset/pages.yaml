  img_proc: true
- pgno: 22
  md: 'buttons, lights, and perhaps vibrations.4 The audience experience of digital
    media is that of being connected to, and in some cases through, the surface.


    I find this a more satisfying view of digital media. Yet this figure, like my
    discussion so far, doesn''t account for something quite important about digital
    media processes: the fact that they generally don''t operate on their own. From
    Web-based knowledge repositories to console-based video games, the operations
    of digital media are, in crucial ways, only truly realized in contact with audiences.
    A wiki''s processes mean little if the audience doesn''t use them to add data,
    edit it, and follow the connections embedded in it. Similarly, many of a game''s
    processes never come into operation if the game has no player.5


    None of this is any surprise. But as I discussed earlier, we generally understand
    this situation from the audience''s perspective, looking at both the audience''s
    actions and the work''s behavior as though the work is a proverbial black box.
    I believe it is also essential to understand this situation more reciprocally:
    to think about the relationship between the audience''s experience and the system''s
    internal operations.


