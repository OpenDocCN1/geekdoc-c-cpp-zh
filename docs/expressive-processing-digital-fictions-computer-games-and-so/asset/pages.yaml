    Another way of putting this is that both _Eliza_ and Abelson’s system, if perhaps
    unintentionally, provide a critique of their subjects (Rogerian therapy and right-wing
    Cold War ideology) through a combination of their data and processes. At the foundations
    of AI in the United States, we find systems that, on examination of their components,
    it is nearly impossible to view as straight-faced science. Rather, they are expressive
    media. And this is a primary reason that they, and the systems that followed in
    the scruffy branch of AI, remain of interest today.


    Encoding large amounts of human knowledge into the design of a system’s data and
    processes may not have been good cognitive science, but it was a powerful authoring
    technique. One result was compelling interactive characters, such as _Eliza_/_Doctor_
    and the Goldwater-infused ideology machine. Another result was a set of the most
    important early experiments in story generation, which the coming chapters will
    explore.


    # Authoring Processes


