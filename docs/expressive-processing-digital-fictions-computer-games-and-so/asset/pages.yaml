    ```

    S_FC V_forget_PERF being awake,

    it V_be_S night, or predawn morning, and moonless,

    S_FC PN V_be_S on a sandy strand extending

    north and south from D_HERE,

    the sea V_be_S before O_FC_PN to the east (119)

    ```


    Each of the capitalized elements is one that may be manipulated by nn, subjects
    beginning “S_” verbs with “V_,” and objects with “O_.” The first of these, “S_FC,”
    refers to the subject who is the focalizing character. While this is certainly
    not a style of writing that seems likely to come naturally to many writers, it
    would certainly be easier to reverse-engineer traditional writing into this form
    (as Montfort does in this example) than into that employed in Panline or Brutus,
    and the results are significantly more flexible (though along a different dimension)
    than those in most of Terminal Time’s text. In which cases the trade-off is worthwhile
    is open to question.


