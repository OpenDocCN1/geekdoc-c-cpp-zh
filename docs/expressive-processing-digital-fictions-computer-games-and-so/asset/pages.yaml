- pgno: 287
  md: '# NLG Templates


    Structure-oriented NLG systems fall between the extremes outlined above. The simplest
    systems, perhaps too simple to be considered true NLG, are template-driven ones.
    These systems have a structure, a template, in which certain pieces of content
    are left to be determined (they are “open slots” in the template). Also, aspects
    of the template may vary in simple ways.


    The best-known template systems in everyday life are letter-generating ones. These
    are used for everything from broad-based political fund-raising for specifically
    individual (and yet consistently structured) professional communications of doctors
    and lawyers. These systems may simply fill in the name of the recipient and send
    otherwise-identical letters to every address receiving a certain type of letter,
    or they may insert or omit a wide variety of paragraphs, sentences, and even words
    to match the data that the system knows about a recipient.


    As with the chunks-of-text approach, most of the linguistic structure in a template
    system comes from human authoring that is expressed as completed text, rather
    than as structures expressed in computable form. This makes template-driven systems
    easier to construct than more complicated NLG systems, but it also provides less
    flexibility. Changing a text’s tense, for example, would probably be accomplished
    through providing an alternate version of the template. Many NLG systems of the
    more complex varieties, on the other hand, would have little trouble generating
    past or present tense messages based on encoded knowledge of how tense functions
    in the language in question.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Departing from Writing


    Moving away from template-driven approaches into the area of “true” structure-oriented
    NLG, one is also moving further from writing. This is true in two senses. The
    information one supplies to the system is further from writing. Also, given the
    difference in the information one supplies, it becomes harder to employ the techniques
    traditionally used by authors to shape the surface output of the system—revision
    becomes something quite different from traditional textual editing. These facts
    are likely part of the reason that NLG techniques more complicated than templates
    have rarely been used by writers.


    In their article “Building Applied Natural Language Generation Systems,” Ehud
    Reiter and Robert Dale (1997) outline six basic kinds of activity for NLG systems,
    using the example of a system that answers questions about rail travel. Content
    determination is the process of getting the semantic information that the NLG
    system will turn into text and creating a set of messages that will be used by
    the further steps (in the example, the next train on the route, when it leaves,
    and how many trains a day travel that route). Discourse planning structures the
    messages, usually into one of computer science’s ubiquitous trees (in the example,
    the identity of the next train and its time of departure become the leaves of
    a “next train information” node—with an “elaboration” relation between them—which
    is linked to the “number of trains” information by a “sequence” relationship expressed
    at the root of the tree). Sentence aggregation, in turn, is the process of deciding
    which messages should be grouped into sentences, often leaning on the tree data
    (in the example, it is pointed out that the two leaves might be combined so that
    the next'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'train''s name and departure time would be in one sentence). Lexicalization
    is the activity that determines the words and phrases that will be used to express
    particular concepts and relations. Lexicalization is particularly important for
    systems that output in multiple languages, but can also be a good place to explicitly
    provide variation (to prevent monotony in output) or make choices about word usage
    (in the example, it is suggested that depart is perhaps more formal than leave).
    Referring expression generation is in some ways closely related to lexicalization,
    in that it is the selection of words or phrases to refer to entities in the messages.
    It is more focused on context, however, particularly the context of text generated
    thus far (in the example, this is the question of when expressions like "it,"
    "this train," and "the Glasgow train" are appropriate for referring to a previously
    mentioned train). Linguistic realization is the application of rules of grammar
    to form the output from the previous processes into text that is correct syntactically,
    morphologically, and orthographically. (In the example, the system produces the
    sentence "There are 20 trains each day from Aberdeen to Glasgow." The syntactic
    component of the realizer added "from" and "to" in order to mark the train''s
    source and destination, the morphological component produced the plural "trains"
    from the root "train," and the orthographic component capitalized the initial
    word and added a period at the end.)


    As a practical matter, NLG systems do not generally have six different components
    for these six different activities. Reiter and Dale suggest that the most common
    architecture actually consists of a three-stage pipeline: text planning (content
    determination and discourse'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'planning), sentence planning (sentence aggregation, lexicalization, and referring
    expression generation), and linguistic realization (syntactic, morphological,
    and orthographic processing). Reiter and Dale''s account here is in agreement
    with that of other NLG authorities, such as Eduard Hovy, whose summary in the
    The MIT Encyclopedia of the Cognitive Sciences names these terms using the almost-identical
    terms text planning, sentence planning, and sentence realization (Wilson and Keil
    1999).


    This overview underscores another likely reason that few writers—and in fact,
    few digital media practitioners from any background—have made use of traditional
    NLG techniques. As one sees in the design of systems from Tale-Spin/Mumble to
    the present, these systems are generally constructed with the assumption that
    messages precede language. Their architectures are developed so that well-defined
    messages can be “realized” as texts. And yet creative writing, for many writers,
    is the practice of what could not be said any other way. Its messages do not precede
    its text but rather emerge through the specifics of its language.


    This authoring dilemma is approached in different manners by Terminal Time, Brutus,
    and systems that engage more directly with the NLG tradition.


    # Terminal Time Templates


    Looking at the NLG approach of Terminal Time, one can see that the system succeeded
    at producing satisfying media experiences in part because it is a flexible container
    for text that can be crafted with traditional writing skills. Its approach is
    essentially that of template-oriented NLG, though the design of the underlying
    system is a more'
