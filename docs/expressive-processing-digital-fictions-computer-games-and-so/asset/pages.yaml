  md: 'with information provided by Böhlen (2006b), further elements become apparent.
    First, through slots in Amy and Klara’s boxes, two cameras look at each other.
    Second, each robot also houses noise-reducing microphones. The robots of Amy and
    Klara, in other words, not only “speak”; they also “see” and “listen.”


    In addition, the robots of Amy and Klara “read.” Each performs a statistical evaluation
    of the contents of Salon.com. This is the starting point for their dialogues,
    as the Amy robot chooses a topic identified by her reading of Salon.com on which
    to offer a comment. A text-to-speech system turns Amy’s comment (assembled by
    an agent architecture in part based on AIML) into sounds sent through her speaker.
    Because the robots do not share data, the Klara robot only “hears” Amy’s comment
    through her microphone and must use automatic speech-recognition technology to
    turn it into text. Given the limitations of software systems for text-to-speech
