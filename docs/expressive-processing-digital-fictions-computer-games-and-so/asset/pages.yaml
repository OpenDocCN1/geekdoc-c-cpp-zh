    high school student. Companies like Amazon build such statistical models not only
    in an attempt to improve the sales of these items but also because this type of
    information about products and their purchasers is a salable commodity in itself.


    Looking beyond applications such as Amazon’s, statistical AI techniques can also
    engage with human expressions, not just recognize what correlates with them. Statistical
    techniques have improved computer speech recognition to the point where automatic
