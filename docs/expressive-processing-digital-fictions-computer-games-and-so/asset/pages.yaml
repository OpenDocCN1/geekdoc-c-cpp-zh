    # The Tale-Spin Effect


    In Italo Calvino''s Invisible Cities (Calvino and Weaver 1974), two characters
    named Kublai Khan and Marco Polo sit in a garden. Polo tells Khan—sometimes in
    words, sometimes through symbols, and sometimes through the relation of pieces
    on a chessboard—of cities he has visited within the vast empire. Here are a few.
    In the middle of Fedora is a metal building with a crystal globe in every room,
    each containing a model of the city as it might have been in a possible future,
    constructed at a different stage of its history. At every solstice and equinox,
    around the fires of the marketplace of Euphemia, there is trade not in goods but
    in memories. In Ersilia, the inhabitants stretch strings between all the houses—marking
    relationships of blood, trade, authority, and agency—until one can no longer pass,
    all but the strings are taken down, and Ersilia is built again elsewhere. Thekla
