    # Pregenerated Variations


    While much of this chapter''s emphasis is on systems that dynamically alter or
    produce text based on the state of an underlying system, expressive NLG might
    also be used to reduce the burden on authors working to create large bodies of
    text that will not change during the audience experience. For example, at the
    2008 Artificial Intelligence and Interactive Digital Entertainment conference,
    Eric Grundstrom talked about the textual authoring challenge presented by the
    space exploration phase of the game *Spore* (Wright, Bradshaw, Hutchinson, et
    al. 2008). At one point the team had wanted to combine the vast variety of alien
    race appearances (many created by *Spore* players) with a large combinatorial
    variety of personalities that would determine how these groups addressed the player.


    The team had two primary variables in mind. First, an alien group’s focus might
    be *scientific* or *warlike* or one of a number of other possibilities. Second,
    the alien group’s approach to self expression might be *flowery* or *meek* or
    a number of others. The team wanted each alien group to consistently express itself
    in a manner that represented its particular combination, so that a warlike group
    would respond to the player in a manner reflecting their focus (proposing aggressive
    actions) but do so using its particular style of expression, which might be surprisingly
    meek in some cases.


    The team’s initial approach was to create small segments of text that could be
    combined. For example, a sentence communicating a warlike disposition would then
    be followed by one displaying a meek use of language. This turned out to be unsatisfying,
    of course, because such features should shape every sentence.


    So the *Spore* team abandoned this ambition. When the game shipped it contained
    only nine stereotypical communication modes—a huge mismatch with the massive variety
    of physical appearance. Without time for research into expressive NLG, this was
    probably the only option.


    Yet techniques such as those presented in this chapter might have made the problem
    tractable. A system might have been designed to produce a variety of candidate
    texts for each of the alien races. An author’s time could then have been invested
    in supplying the initial data, selecting between the outputs, and doing any necessary
    editing—potentially requiring no greater number of hours than that invested in
    *Spore’s* existing nine modes. But until more research and media creation is undertaken
    in this area of NLG, such systems will remain speculative.'
