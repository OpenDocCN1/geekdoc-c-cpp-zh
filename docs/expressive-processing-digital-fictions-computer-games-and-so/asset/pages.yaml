    the emergence of both software studies and platform studies.


    Both Manovich''s and Kirschenbaum''s comments gesture toward the importance of
    treating the products of computer science with the careful, critical attention
    given to other parts of culture—while also remaining appropriately aware that
    the field of digital media is built on the research, results, and tools of computer
