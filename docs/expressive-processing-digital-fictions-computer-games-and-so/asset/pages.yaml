    # Agency Reconsidered


    The concept of agency or intention, discussed in this chapter primarily in connection
    with Façade, is central to thinking about gameplay and interaction in general.
    In short, agency is a term for the audience''s ability to form intentions, take
    actions, and see satisfying results. It is a widely-used concept, but also one
    in need of reconsideration along a number of dimensions.


    First, discussions of agency can fall into potentially misleading formulations
    in which player goals and plans appear to determine player actions. As discussed
    in chapter 5, such formulations have been severely criticized in cognitive science
    and artificial intelligence by researchers such as Lucy Suchman and Philip Agre.
    As outlined in that context, it is important to remember that goals and plans
    are resources for action—which is fundamentally situated and improvisational.
    Reflecting back on personal experiences of playing a challenging game, in which
    things rarely go exactly as one plans, is another good reminder. In this vein,
    perhaps the best antidote to such misleading constructions of agency is Pilgrim
    in the Microworld by David Sudnow (1983), an account of learning to play Breakout
    for the Atari VCS.


    On a different front, discussions of agency also commonly bracket a fundamental
    issue. This is apparent in Murray''s primary example of game world navigation
    as well as in Church''s discussion of design strategies that work (e.g., simple
    and consistent controls, abilities, and physics behavior make planning possible).
    The fundamental issue is the motivation that players have to move, or plan to
    move, to particular places. Put another way: What creates the desire that agency
    satisfies?


    The first part of an answer is the fundamental contribution of Mateas''s formulation
    of agency as a balance between material and formal constraints. This moves agency
    from an amorphous ability to plan and carry out actions, which captures only part
    of the picture, to a phenomenon in which the actions motivated by a game or other'
