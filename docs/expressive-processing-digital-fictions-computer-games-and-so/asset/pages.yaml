- pgno: 58
  md: '5. I will not attempt to define quests here or present an exhaustive discussion
    of the types of possible quests. A good overview and proposed definition are offered
    by Susana Tosca (2003). Jeff Howard''s Quests (2008) makes a detailed ...


    Notes continued at end of this chapter.


    world exploration for its own sake can be situated.5


    Despite the variety of experiences that players can have with quests, it is commonly
    observed by both players and authors that there are a limited number of types
    of quests—perhaps three, or even one. As Lee Sheldon points out in Character Development
    and Storytelling for Games, this observation is correct, as far as it goes, given
    that “the mechanism of tracking progress by the game engine is virtually identical
    in every quest” (2004, 227). This mechanism is the setting and checking of a collection
    of small pieces of data—often called “tokens” or “flags,” but sometimes known
    by the more formal term “variables”—as the player progresses through the world.
    These data flags represent the state of the world as it relates to quests of varying
    scope. They are generally checked and set by relatively simple “scripts” that
    can be edited by game designers and writers (without recompiling the entire code
    of the game). The state of quest flags is often explicitly presented to players
    in the form of a personal “journal” or “notebook” that scripts update with helpful
    reminder texts about the current state of each quest (at the same time that flags
    are updated). Other quests are, while frequently signaled equally directly, instead
    organized around the possession and use of game world objects without messages
    in the journal.


    Overall, this approach is notable for its simplicity of structure. In fact, it
    is so simple that game companies have worked to open its authoring to players
    who are not software developers. For example, when game developer BioWare published
    the game Neverwinter Nights (Oster, Holmes, Greig, et al. 2002), it also released
    the Aurora toolset for creating new spaces, objects, NPCs, and quests.'
