    # Time Inflexibility


    Like many people, the demands on my time fluctuate over the course of weeks and
    months. I hit periods during the Expressive Processing review when I barely had
    time to read the incoming comments—and certainly couldn''t respond to them in
    a timely manner. For anonymous reviews this generally isn''t an issue. When one
    is required to respond to such reviews, and one isn''t always, it is generally
    possible to ask for some additional time. It isn''t a problem if a busy period
    takes one''s attention away from the review process entirely.


    But the flow of blog conversation is mercilessly driven by time. While it is possible
    to try to pick up threads of conversation after they have been quiet for a few
    days, the results are generally much less successful than when one responds within
    a day or, better yet, an hour. I hadn''t anticipated or planned for this.


