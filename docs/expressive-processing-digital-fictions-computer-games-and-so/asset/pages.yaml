    if occasionally rather circuitously.


    In other words, somewhat like the graphical logics

    of games, the logics of dialogue trees and quest flags are

    about _location_ in a given space. But while the visual spaces

    of games are often simulated in a manner that supports

    almost innumerable possible locations, the milestones of

    quest flags and graphs of dialogue trees mark out all the

    possible positions (and transitions between them) ahead

    of time. This mismatch proves problematic.


    # An Example: Star Wars: Knights of

    the Old Republic


    The Game Developers Choice Awards are the Oscars of

    the game industry—the award with which members of a

    creative industry recognize achievements of their own. In

    2004, game studio BioWare walked away with three awards

    that are of particular note for this discussion: Game of

    the Year, Original Game Character of the Year, and Excellence

    in Writing. All of these were awarded for BioWare''s RPG

    _Star Wars: Knights of the Old Republic_ (_KotOR_), which also

    won game of the year awards from a slew of industry

    publications. While certainly not the most recent major

    RPG, it provides a good example of the strengths and

    weaknesses of the quest flag and dialogue tree logics.


    # KotOR''s Successes


    _KotOR_ uses quest flags and dialogue trees to reward and

    sustain engagement with its fictional world; establish

    patterns that, when altered, produce small moments of

    surprise and pleasure; and direct the audience''s attention

    to a series of things that must be accomplished through'
