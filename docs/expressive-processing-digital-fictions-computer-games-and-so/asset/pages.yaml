    # **Creating Stories from Stories**


    Minstrel begins storytelling much as some human authors might: with a theme to
    be illustrated. The audience can request a particular theme, or Minstrel can be
    “reminded” of a story with a similar theme. Minstrel is reminded by being given
    a pool of fragments structured according to the internal schema representations
    it uses for characters and scenes. Matching fragments against stories in memory
    will result in one story being selected, and then Minstrel will have the goal
    of telling a story on the same theme.


    Minstrel uses CBR to meet its goals, including this one. But goals also need to
    be organized. Rather than running a simulation of character behavior through time,
    as Tale-Spin does, Minstrel’s goals are organized as an internal agenda. Planning
    proceeds in cycles, with each cycle'
