- pgno: 276
  md: 'As Mateas, Vanouse, and Domike point out, this is not any sort of general test
    for finding all instances of thinkers being persecuted by religion. For example,
    it assumes executions are the only type of persecution. Similarly, Terminal Time''s
    representation of the Giordano Bruno story is not the only possible one. The Terminal
    Time authors note that in other circumstances, it might be desirable to represent
    Bruno''s writings and execution as separate events, rather than one compound event.


    But again, Terminal Time is not trying to create a realistic simulation of the
    behavior of historians or create a system that “really understands” history, or
    itself be a creative system. It is instead an authored artwork.


    If the authors desired—at some point—for the system to be able to identify instances
    of religious groups persecuting thinkers that do not involve executions, in order
    to employ these events in its stories, then the test could be broadened to match
    the new class of events. As of 2000, the authors report that the system includes
    “134 historical events and 1568 knowledge base assertions” (beyond those assertions
    in the Upper Cyc Ontology). Given that all the possible examples of events involving
    religious persecution of thinkers (among that 134) also include executions, a
    broader test is not needed. But anyone involved in authoring historical event
    data for Terminal Time must do so with an awareness of the tests that will evaluate
    them later. In fact, it would make no sense to author historical events except
    in relation to the tests currently in the Terminal Time system, as events matching
    no tests would never be employed in stories. The authoring of events is thus tightly
    coupled to the authoring of tests.'
