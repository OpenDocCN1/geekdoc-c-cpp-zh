  md: '# A Tale-Spin Story


    Tale-Spin, as described in Meehan''s dissertation, has three storytelling modes.
    Two modes are interactive, asking the audience to make decisions about features
    of the story world, while one mode “fixes” the world to assure the production
    of particular stories.3 Chapter 11 of Meehan''s dissertation gives a detailed
    account of an interactive story, about a hungry bear named Arthur, that I will
    use to illustrate Tale-Spin''s operations and their backgrounds.


    5. For the third mode, Meehan worked particularly on versions of Aesop''s fables
    such as “The Fox and the Crow” and “The Ant and the Dove.”


    # Creating a World


    Tale-Spin asks what characters to use for the story, and the reader chooses a
    bear and bird. Each choice results in a “picture procedure,” creating the basic
    set of facts for that character that will be used to make up the simulation but
    won''t necessarily appear in the final story told to the audience. For example,
    the procedure for the bear creates a bear, chooses the bear''s gender, gives the
    bear a name, adds the bear''s name to the list of story characters, chooses a
    height and weight for the bear, creates a cave, creates a mountain in which the
    cave exists, marks the cave as being the home of the bear, and lets both the bear
