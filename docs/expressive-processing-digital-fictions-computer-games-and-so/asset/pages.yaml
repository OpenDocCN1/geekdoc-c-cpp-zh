    In other words, the problem with Minstrel lies in trying to simulate one part
    of human intelligence—a particular kind of creativity—but not the rest. This is
    a recurring problem in AI systems designed around models of human cognition. Its
    most widely discussed manifestation is the “common-sense reasoning problem,” which
    Murray Shanahan has called “the nemesis of artificial intelligence” (Mueller 2006,
    xvii). This problem is an umbrella for all that normal human beings know and infer
    about the world: water makes things wet; if I pick up my water glass and leave
    the room, it leaves too; if I refill the water glass, I probably intend to drink
    more water, and my throat might be dry. Both scrubby AI’s scripts and cases can
    be seen as attempts to encode commonsense knowledge—but the problem is so daunting
    that in decades of effort no one has succeeded in developing a robust solution.13


    In 2007, thirteen years after the publication of his book, Turner put it this
