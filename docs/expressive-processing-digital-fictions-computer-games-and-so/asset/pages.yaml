- pgno: 229
  md: '# ## Beyond Anthropomorphic Intelligence


    Given the history of AI, it is no surprise that systems such as Tale-Spin and
    Minstrel were built to embody models of human cognition. The assumption that human
    and machine processes should—or must—resemble each other runs deep in AI. It continues
    to this day, despite the counterexample of statistical AI.


    With Tale-Spin and Minstrel both emerging from the scruffy end of symbolic AI,
    we might assume that this area of AI was particularly given to building its systems
    on human models. And perhaps it is true that a near researcher would not have
    made Turner’s opening assumption from his description of Minstrel: “To build a
    computer program to tell stories, we must understand and model the processes an
    author uses to achieve his goals” (1994, 3). As discussed earlier in connection
    with Strips, scruffy researchers sought to claim for their approach greater fidelity
    with the way that humans approach problems, arguing that people think differently
    in different problem domains. Riesbeck and Schank put it this way:


    > > The problem that general problem solver programs have is that each and every
    problem presented to them has to be handled the same way. Each problem must be
    reduced to first principles and logical deductions made from those principles.
    Even mathematicians do not really behave this way. (1989, 9)


    But to view the issue in these terms is to consider only one level. At another
    level, both scruffy and neat AI are based on the assumptions of cognitive science—especially
    that effective problem solving for machines should be based on the same model
    of “symbolic processing” assumed to be at'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'work in humans. As Paul N. Edwards explains in *The Closed World*, “Cognitive
    science views problems of thinking, reasoning, and perception as general issues
    of symbolic processing, transcending distinctions between humans and computers,
    humans and animals, and living and nonliving systems” (1997, 19). To put it another
    way, whatever their differences, scruffy and neat researchers still speak of their
    computer systems in terms of human-derived symbolic formulations such as beliefs,
    goals, plans, rules, and so on.


    And it is on the basis of these formulations that both scruffy and neat AI researchers
    have been extensively critiqued by more recent thinkers—resulting in their work
    becoming lumped together using terms such as “classical AI” or “Good Old-Fashioned
    AI” (GOFAI). Yet many of the critics who locate themselves within AI view the
    problem with symbolic techniques as a lack of accuracy regarding how humans operate.
    For example, Agre, whose critique of *Strips* was discussed earlier, characterizes
    symbolic AI’s problems by saying, “Mistaken ideas about human nature lead to recurring
    patterns of technical difficulty” (1997, xii). His alternative approach to AI
    is founded on a different view of human activity (7) rather than abandoning the
    anthropomorphic model for AI processes.


    A more radical critique may appear to emerge from the current head of MIT’s venerable
    AI laboratory, Rodney Brooks. In his widely cited “Elephants Don’t Play Chess,”
    Brooks writes: “In this paper we argue that the *symbol system hypothesis* on
    which *classical AI* is based is fundamentally flawed, and as such imposes severe
    limitations on the fitness of its progeny” (1990, 3). The alternative championed
    by Brooks is focused on an AI that operates through combinations of simple mechanisms
    embodied robots in'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'real-world contexts (and concentrates on interaction within these contexts).
    Nevertheless, after building a number of insectlike robots based on this research
    agenda, Brooks turned—inevitably?—to the creation of humanoid robots meant to
    eventually exhibit humanoid intelligence. The banner headline on the web page
    for the most famous of these projects, Cog, reads, “The motivation behind creating
    Cog is the hypothesis that Human intelligence requires humanoid interactions with
    the world” (MIT Humanoid Robotics Group 2003). The anthropomorphic view of AI
    asserts itself again.


    # Models and Authorship


    From the point of view of authoring, there is something quite puzzling about all
    this. To a writer it is obvious that people in stories do not talk the way people
    do in everyday life, that people’s lives as reported in stories contain only a
    tiny subset of what would go on if they had real lives, and so on. A system that
    operated largely like a real person thinks might not be much help in telling a
    story, since most real people aren’t that good at storytelling (so simulating
    an author is out) and characters shouldn’t act like real people (real people don’t
    take the stylized, coordinated actions that dramatic characters perform).


    Accurate modeling is simply not what authors are after. This is true even in areas
    such as computer game physics. While first-person 3-D games (such as Half-Life
    2) may incorporate natural-seeming models of space, movement, gravity, friction,
    and so forth, each of these elements have been (along with each of the environments
    in which they are active) carefully shaped for the game experience. Half-Life
    2 may be more like the real world'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'than is a game like Super Mario Brothers, but a deep model of the world, operating
    just like the real world, is (in addition to not being achievable) not an important
    step along the path to either one. In fact, a game like Portal, constructed using
    the engine developed for Half-Life 2, would probably be much less fun if it employed
    an exact model of real-world physics.


    The question is which models are useful for authoring. The answers are not always
    obvious. For instance, while simple generation from a statistical model—as with
    Shannon''s bigram-produced sentence—is a limited approach to linguistic behavior,
    it is also not the only possible approach to authoring that uses such models.
    Nitrogen, for example, was an ambitious research project (developed by Eduard
    Hovy''s group at the University of Southern California) aimed at using n-gram
    models in combination with logical and syntactic models for generating language
    (Langkilde and Knight 1998). Given a logical message to translate into text, it
    would promiscuously produce a lattice of grammatical structures. Then an n-gram
    model was used to rate pathways through the lattice. This experiment in combining
    traditional and statistical AI produced quite promising early results.


    Similarly, the game Black & White (Molyneux, Webley, Barnes, et al. 2001) employs
    a hybrid architecture to create one of the most successful character experiences
    in modern gaming. Each Black & White player is a god, made more powerful by the
    allegiance of human followers—but with a much closer relationship with a nonhuman
    “creature” who can be a powerful ally and focus of empathy, but must be properly
    trained. In designing the AI to drive these creatures, Richard Evans'
