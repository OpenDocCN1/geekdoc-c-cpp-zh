    # Two N-gram Instruments


    This book''s discussion of _The Restaurant Game_ includes a description of one
    of the most commonly used statistical models for work with human language: the
    Markov chain or n-gram. It is a way of predicting (or generating) future behavior,
    based on patterns in past behavior. For example, a model of this sort could predict
    that in written English, “q” is more likely to be followed by “u” than “o” (because
    the two-letter digram “qu” is likely to be found repeatedly in any significant
    body of English text, whereas the other is unlikely to be found at all).


    Models of this type work well for serially ordered data, leading to their application
    with not only text and spoken language but also areas as diverse as musical performance
    and human behavior over time. _The Restaurant Game_ illuminates some of the potential
    and pitfalls of the last of these applications—an interesting area of research
    for computer gaming, but a startling mismatch with real human behavior, and a
    good illustration of the problems inherent in proposals for massive surveillance
    on the model of the Total Information Awareness (TIA) program.


    The earlier discussion left aside some of the potential in using such models for
    creative, generative purposes.'
