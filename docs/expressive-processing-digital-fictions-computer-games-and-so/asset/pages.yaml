  md: 'Terminal Time represent the crafting of these ideological models as authoring,
    as the creation of an artwork. But this is not always the way that their work
    is understood in the AI community. As Mateas reports:


    The first time I presented Terminal Time to a technical audience, there were several
    questions about whether I was modeling the way that real historians work. The
    implicit assumption was that the value of such a system lies in its veridical
    model of human behavior. In fact, the architectural structure of Terminal Time
    is part of the concept of the piece, not as a realist portrait of human behavior,
    but rather as a caricature of certain institutionalized processes of documentary
    film making, (2002, 57–58)


    This reception of Terminal Time should perhaps come as no surprise, given my earlier
    discussion of anthropomorphized models within AI. And for understanding Terminal
    Time and the ideas that motivate it, one does need to consider how human models
    of history and ideology interact with the system. Yet the place to look for human
    models is not within the system itself. Rather, Terminal Time depends on the existence
    of these models in a very anthropomorphic location: within the audience.


    # Event Knowledge


