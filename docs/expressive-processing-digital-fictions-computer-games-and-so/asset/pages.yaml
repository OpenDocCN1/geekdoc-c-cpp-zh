  md: '# Chapter 7 Authoring Systems


    # Writing Software


    My early experiences of digital media were as an audience member. I remember playing
    text-only games like *Hunt the Wumpus* on mainframe terminals at my mother’s university
    as well as interactive fictions like *Zork I* on my father’s early portable computers
    (a Kaypro and an Osborne). I remember playing graphical games like *Combat* on
    a first-generation Atari console that belonged to my cousins as well as *Star
    Trek: Strategic Operations Simulator* on my friend Brion’s first-generation Atari
    home computer. Brion would later guide me in more arcane explorations of computer
    code as we attempted to creatively alter the binary files of games we played,
    saving them back to the Atari’s tape deck. But I think it was earlier, when I
    was ten years old, that I first sat down to program at a “blank slate.”


    This was at my elementary school, on pre-Macintosh computers from Apple. I used
    the built-in Apple version of the Basic programming language to create a simple
    piece of media of my own: a low-resolution star and sky, independently cycling
    through colors, beeping as each new combination appeared. On the playground I
    daydreamed about how to create more complex media along the lines of Infocom’s
    *Zork I* (Anderson, Blank, Daniels, et al. 1980). But I couldn’t figure out how
    to scale up from the simple Basic commands I knew (e.g., “GOTO”) to a complex
    software system like *Zork’s*.


    Decades later, I now see a piece of the puzzle that eluded me: the authors of
    *Zork* didn’t work in Basic, and it'
