  md: '# Chapter 8

    The SimCity Effect


    # Eliza and SimCity


    In the early 1980s, Will Wright (1984) was working on his first game: Raid on
    Bungeling Bay. He was crafting an attack helicopter simulation, focused on flying
    over islands and open water, attempting to destroy a set of factories working
    toward the creation of an unstoppable war machine. Then, reflecting on the landscape
    editor he created for authoring the game, Wright had a realization: “I was having
    more fun making the places than I was blowing them up” (2004). From this the idea
    for Wright’s genre-defining game SimCity (1989) was born.


    SimCity is a simulation game. Like a terrain editor, it is an interactive tool
    for defining spaces, specifically cities.¹ Unlike a terrain editor, SimCity doesn’t
    simply wait for a user to do something. Time begins passing the moment a new city
    is founded. A status bar tells the player what’s needed next—starting with basic
    needs like a residential zone and a power plant, and if play succeeds for any
    period, ramping up to railroads, police stations, stadiums, and so on. A budding
    city planner can lay out spaces, but it’s up to the city’s virtual inhabitants
    to occupy them, build and rebuild, and pay the taxes that allow the city to continue
    to grow.


    As cities grow, areas respond differently. Some may be bustling while others empty
    out or never attract much interest at all. SimCity provides different map views
    that can help diagnose problems with less successful areas. Is it too much pollution?
    Too much crime? Too much


    1. Though an expansion focused on crafting the underlying terrain on which the
    city rests.'
