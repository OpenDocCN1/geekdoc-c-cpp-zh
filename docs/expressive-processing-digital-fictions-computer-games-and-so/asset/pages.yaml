  md: '# Basis for the Model


    The breakthrough that allowed Meehan to see a path forward through the metanovel
    was exposure to the scruffy artificial intelligence (AI) ideas of Roger Schank
    and Robert Abelson. Schank had just arrived at Yale in fall 1974, and Meehan enrolled
    in his natural language processing seminar—which Meehan described as “a weekly
    battle of ideas” featuring favorite “guest speaker/victims” such as Abelson (1976,
    iv).


    Many of Schank''s theories were developed in the field of computational linguistics,
    where he argued that previous work was fundamentally flawed in its approach. For
    example, in the area of computer translation from one language to another, projects
    based on syntactic parsing and dictionary-style substitution had largely failed.
    Schank instead proposed a language-independent representation of semantic meaning,
    which he called *conceptual dependency* expressions. As Schank (1975a) describes
    them in *Conceptual Information Processing*, such semantic representations could
    serve as an *interlingua*, so that the translation of a statement from any one
    language to another could be accomplished by translating that statement to and
    from the semantic representation. Such a representation could also serve as an
    internal meaning representation—or data format—for AI projects, helping in processes
    such as paraphrasing and inference making, as demonstrated in systems built by
    Schank and his students (see sidebar: Yale AI). *Tale-Spin* followed this lead,
    operating in terms of conceptual dependency expressions.


    But understanding the meaning of sentences, rather than simply their structure,
    requires understanding their context. “Mary hit John” probably means different
    things'
