- pgno: 71
  md: 'In addition to all these activities, there are also others embedded in the
    fictional world—ranging from the pleasures of exploration and spatial mastery
    to “minigames” of card playing and racing. Some of the minigames, in turn, can
    unlock additional quests and NPC interactions as well as provide resources useful
    in completing parts of the game to which they are less directly connected.


    Given all this, conventional wisdom has it that playing a major RPG takes experienced
    gamers something like forty hours. But fans of the genre often spend longer, indulging
    in many optional activities. In addition, many play through the same game multiple
    times. This is particularly true for games, like KaOR, that provide different
    gameplay options to characters that approach the world with different ethical
    stances.


    What drives players to spend forty, eighty, or more hours with a computer RPG?
    If we look only at the quest journal, where the operations of quest flag logics
    are exposed to the player, the appearance is of a massive indulgence in the pleasures
    of the to-do list. And certainly there is some of that. But, more centrally, KaOR
