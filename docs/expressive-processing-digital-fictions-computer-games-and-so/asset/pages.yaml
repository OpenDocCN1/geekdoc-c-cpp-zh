    As this comment reveals, the goal of a simulation game is quite different from
    that of a system like Eliza / Doctor, which plays on our expectations in order
    to disguise the simplicity of its operations. At the same time, a version of the
    Eliza effect is a necessary starting point, as Wright explains:


    You''ve got this elaborate system with thousands of variables, and you can''t
    just dump it on the user or else they''re totally lost. So we usually try to think
    in terms of, what''s a simpler metaphor that somebody approach this with? What''s
    the simplest mental model that you can walk up to one of these games [with] and
    start playing it, and at least understand the basics? Now it might be the wrong
    model, but it still has to bootstrap into your learning process. So for most of
    our games, there''s some overt metaphor that allows you [to] approach the simulation.
    (ibid.)


    To put it another way, what I will call the SimCity effect begins much the same
    way as the Eliza effect. The system initially functions as a procedural representation
    of the expectations—or as Weizenbaum and Suchman might phrase it, the work—of
    the audience. We come with many expectations of therapists and cities. Similarly,
    with both types of systems, the modes of interaction made available through their
    surfaces encourage a process of play. In Eliza / Doctor this is a series of linguistic
    exchanges, while in SimCity this is the animated representation of the city and
    the iconic tools available for altering it. Through these interaction surfaces,
    play begins to reveal the shape of the underlying systems—which differs from the
    audience''s mental model.'
