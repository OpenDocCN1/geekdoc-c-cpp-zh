    authorial goals in a manner that acknowledges their limitations. The next chapter
    considers systems with this more pragmatic approach to story generation.


    For our culture more generally, the lesson is rather different. *Minsrel* and
    *The Restaurant Game* are legible cases of the limitations inherent in both symbolic
    and statistical approaches to AI. The problems they exhibit in relatively constrained
    microworlds become much greater in our massively complicated, evolving, and contingent
    everyday world. When considering public proposals for the use of AI systems, we
    would do better to remember fictional worlds in which knights eat princesses and
    restaurants fill with pies, rather than listen to the science fictions used to
    support proposals for TIA and warrantless wiretapping.'
