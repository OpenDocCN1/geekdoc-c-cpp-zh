  md: '# ## Creating a Story


    In order to tell a story about betrayal, Brutus needs to fill the roles of the
    Betrayer and the Betrayed. One might imagine the two characters being created
    on the fly, using some method akin to those of Universe or Tale-Spin—but constrained
    to ensure that each character will be appropriate for their role. Or alternately,
    one might imagine a situation in which the system begins with a set of automatically
    generated characters. The system might then begin storytelling by choosing a character
    from this set with a goal that can be thwarted. It might then make that character
    the Betrayed, and then either create or assign a character to be the Betrayer.


    But neither of these is what happens. Instead, the system searches its “domain
    knowledge-base”—its collection of authored data—to see if two characters exist
    that already meet the criteria for the relationship of betrayal. That is to say,
    it looks for a character who already has what it takes to be the Betrayer (a goal,
    a lie, and an evil action) and who takes part in appropriate events for betrayal,
    and where those events also include a character who has what it takes to be the
    Betrayed.


    The only way for the characters to get into the knowledge base is for them to
    be hand-crafted by authors. This means that someone must write the FLEX code to
    represent a character who meets the criteria for being the Betrayer and another
    who meets the criteria for being the Betrayed. Bringsjord and Ferrucci, however,
    assure readers this sort of thing will change in a future version of the system:


    In Brutus, thematic instantiation requires that the domain knowledge-base include
    many of the'
