    # Playing Text in Virtual Reality


    After my initial engagement with the discussion of textual instruments, my first
    playable media project was Screen (Wardrip-Fruin, McClain, Greenlee, et al. 2003–present).
    This project combines familiar game mechanics with virtual reality technology
    to create an experience of bodily interaction with text. At the same time, the
    language of the text, together with the uncanny experience of touching words,
    creates an experience that doesn’t settle easily into the usual ways of thinking
    about gameplay or virtual reality. Screen began in 2002 as one of the initial
    “finger exercises” performed by an interdisciplinary group—masterminded by novelist
    and digital media pioneer Robert Coover—that came together to explore the literary
    possibilities of Brown University’s room-size virtual reality display. This display,
    the “Cave,” is similar to the University of Illinois’s CAVE: a virtual environment
    that'
