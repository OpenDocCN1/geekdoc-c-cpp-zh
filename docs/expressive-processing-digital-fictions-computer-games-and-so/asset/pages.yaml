- pgno: 174
  md: 'choice and properties of materials used for the parts of a mechanism. Studying
    processes, on the other hand, focuses on the design and operation of the parts
    of the mechanism. These activities are not mutually exclusive, nor does one subsume
    the other. Rather, they complement one another—and some investigations may require
    undertaking both simultaneously. Both can be routes to what this book seeks: an
    understanding of expressive processing.


    In this chapter, my investigations bring me to see the processing of Tale-Spin
    as expressive in two ways. It is an authorial expression, an act of media making
    that creates fictional worlds through its processes, which are only partially
    visible on its surface. It also expresses a relationship with histories of AI
    and cognitive science through the very design of its processes and data structures,
    which are completely invisible on its surface. Through the first of these, it
    demonstrates the fundamental approach of story generation (moving beyond the assembly
    of fiction through precreated and explicitly connected chunks) as well as the
    difficulties of the Tale-Spin effect. Through the second type of expression, it
    also provides a legible example of the limits of simulations of human behavior
    based on hand-authored rules. Altogether, it demonstrates that understanding processes
    in both these ways is important for the development of digital media and software
    studies—for creators and for scholars.'
