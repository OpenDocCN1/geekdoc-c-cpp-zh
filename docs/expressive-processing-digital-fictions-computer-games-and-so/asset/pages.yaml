  md: 'peels, and then another, at an increasing pace, flocking around the reader.


    The reader can intervene in this process by batting at words with her hand. When
    a word is hit a sound is heard, and the word flies back toward a wall. If only
    one word is loose, it will, when hit, return to the space it left empty. But when
