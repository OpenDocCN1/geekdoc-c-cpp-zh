    as being authored almost entirely in terms of processes rather than data. An e-book,"
    on the other hand, might be just the opposite—a digital media artifact authored
    almost completely by the arrangement of precoded text and image data. In an influential
    article, game designer and digital media theorist Crawford (1987) coined the phrase
    "process intensity" to describe a work''s balance between process and data (what
    he called its "crunch per bits ratio").


