  md: 'procedural representation of what is presented on the surface (such as a fictional
    world). This begins much as the Eliza effect, as an outgrowth of audience expectation.
    But rather than the breakthrough produced by interaction in the Eliza effect,
    in which it is revealed that there is a significant disconnect between initial
    expectation and system operations, the connection between the elements presented
    on the surface and those present in the system processes and data allows a different
    outcome. Through the SimCity effect the audience can use observation and experimentation
    to transition from an understanding based on expectation to one that corresponds
    more with the underlying system. This not only creates compelling media experiences
    but also is a powerful way for the public to come to understand complex software
    systems. Interestingly, relatively complex cases of the SimCity effect appear
    to be on the rise. It can be seen not only in relatively obvious locations (e.g.,
    real-time strategy games) but also, in somewhat different form, in the best cases
    of the spread of simulation mechanics to new game genres (e.g., the example of
    Oblivion, discussed earlier). As this happens, we are coming to better understand
    the design challenge of crafting an experience that is both enjoyable and allows
    an audience to come to understand what Will Wright refers to as an “elaborate
    system” with thousands of variables.” This knowledge sets the necessary groundwork
    for computer games to come into their own, taking the next step away from the
    expectations of other forms of media and opening a new range of possibilities
