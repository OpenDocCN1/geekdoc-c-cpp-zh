  md: 'Just as free-form textual input allows players to be expressive, the human
    expression embodied in *Façade*''s strong voice acting is part of what makes the
    experience so effective. The nuances of line performance make things by turns
    funnier and more uncomfortable—and overall, more engaging. On the other hand,
    *Façade* also required significant authoring effort to appropriately funnel a
    vast number of possible system states into a much smaller number of possible prerecorded
    utterances.


    If the system had used plain text as output, many more system states have been
    experienced meaningfully on the work''s surface. This would have been true for
    two reasons. First, the mixing of prerewritten segments could have been more fine
    grained. *Façade* already sounds strange when it mixes recordings of the player
    character''s name into lines that were specially recorded for the purpose, and
    going further in this direction would have greatly reduced what the experience
    gains from its voice acting. Second, plain text output would have opened the door
    to another interesting research area: the construction of systems like the literary
    augmented grammars of *Brutus*. These have the potential to adjust the nuance
    of text, by applying hand-authored rules, depending on the current system state.
    Yet for performance-oriented systems (such as *Façade* and many modern computer
    games), this too is best regarded as an area of research. Though speech-generation
    systems are rapidly improving, for many purposes voice acting will remain the
    more powerful approach. But for systems such as massively multiplayer online games,
    in which most NPC dialogue takes place through text, such research could have
    immediate application.'
