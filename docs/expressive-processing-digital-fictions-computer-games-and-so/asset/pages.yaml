- pgno: 253
  md: 'system for presenting the work’s surface—that almost any model can be effectively
    presented in the desired manner. Perhaps this is true, but it is strongly reminiscent
    of a position that has proven problematic in the field of human-computer interaction.


    In this field it is relatively common to suggest that a software system’s interaction
    surface can be abstracted from the underlying processes. The processes can be
    specified up front and implemented in a “waterfall” fashion, working linearly
    from a detailed initial specification, which may be efficient from an engineering
    standpoint. Meanwhile, the interface can be developed iteratively, perhaps with
    participation from those who will actually use it. Finally, another software layer
    can be used to map between the waterfall-produced processes and the iteratively
    developed interface.


    It is here, however, that we see the limitations of the model of authoring systems
    introduced at the start of this chapter. While it is theoretically true that layers
    of software abstraction make it possible to create software systems that relatively
    arbitrarily make some tasks easy and others difficult, it is also true that the
    underlying layers inevitably exert their influence. In the field of software development,
    Bonnie E. John and Len Bass have called this “We can’t Change That!” (2001–2004).
    If the model of the underlying activity embedded in the software processes is
    too far from the imagined interface, then the amount of work required to support
    that interface is simply not entertained. In the field of digital media, Nick
    Montfort and Ian Bogost (2009) have coined the phrase “platform studies” to name
    scholarly work that takes such specifics of underlying hardware and software layers
    into account.'
