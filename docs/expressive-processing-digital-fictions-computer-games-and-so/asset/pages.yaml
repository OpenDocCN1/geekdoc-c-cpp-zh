    choice—between severely restricted interaction and the boom/bust of illusion followed
    by breakdown—presents no good options to those with an interest in creating digital
    fictions.12 So while some have argued that it is best to capitalize on the Eliza
    effect, depending on temporary illusion and the willful suspension of disbelief
    to carry the day, most digital fiction authors employ a different approach: exposing
    important elements of the structures of their processes to the audience from the
    outset. This allows for interaction that matches the process employed, and avoids
    the Eliza effect and breakdown. Still, as I will discuss next, the most common
    of these approaches suffer from limitations of their own.


    Finally, I should mention that some authors—such as Jeremy Douglass (2007)—assert
    that breakdown can be an interesting mode for digital fictions. And certainly
    breakdowns can be fascinating. On a linguistic level, for example, we''re attracted
    to study every form of breakdown from occasional slips of the tongue to hemorrhage-induced
    aphasia.


    What breakdowns can do—in the case of Eliza/Doctor, linguistic slips, and neurological
    problems alike—is give us some insight into the shape of the underlying system
    processes. This fact points to the reason why I still talk with people online
    (even if I no longer dial in to a BBS to do so) but I no longer play with Eliza
    in my spare time: a system prone to breakdown is only as interesting as the shape
    of the processes that the breakdowns partially reveal. And as shown earlier in
    this chapter, the Eliza system processes are mostly a relatively uninteresting
    set of substitutions. We can do better.'
