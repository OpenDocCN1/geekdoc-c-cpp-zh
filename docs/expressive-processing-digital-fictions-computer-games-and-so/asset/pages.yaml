  md: '4. This article is not only a good, clear source of explanation for Eliza''s
    processes (and the most-cited publication about Eliza in the computer science
    literature). It also served as the basis for many homegrown versions of Eliza
    created at ...


    5. While the original script text is in all capitals, I am regularizing it here.
    Also, this description focuses on the core processes at work in Eliza to describe
    them all would make this section as long as Weizenbaum''s paper. Notes continued
