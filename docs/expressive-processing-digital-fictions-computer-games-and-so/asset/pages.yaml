- pgno: 270
  md: 'The ideological model derived from audience responses is always an exaggerated
    one. It is a representation of the positions for which the audience has applauded,
    but taken to an untenable extreme. As it drives the selection of events to be
    recounted and the “spin” with which each will be presented, it inevitably creates
    an ironic distance between the words being uttered and the message being conveyed
    (rather than reinforcing audience belief in these ideological positions).


    Yet Terminal Time stories aren’t the result of a mathematized account of irony.
    They are the product of careful authoring. This authoring effort included the
    creation of a computational account of ideology—but while the system “knows” about
    ideology, the irony layered on top of the ideology is not represented in the system.
    Only the authors and the audience get the joke.


    And here one sees what may be the most significant move Terminal Time makes, relative
    to the other story generators I have discussed. It reintroduces the author(s)
    and audience as essential elements of fiction through its emphasis on the context
    of reception (rather than only the generated text) and through interactions with
    the audience that generate the ideological model used in each presentation of
    Terminal Time. I’ll discuss the implications of this further while describing
    the specifics of Terminal Time’s operations.


    # Computational Ideology


    Each Terminal Time performance is divided into four sections. Section one is a
    two-minute introduction that sets the audience’s expectations—combining a Masterpiece
    Theater-style of delivery with the information that a'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'historical narrative will be produced for that audience by Terminal Time’s
    mechanisms. This is followed by the first question period, in which “an initial
    ideological theme (from the set of gender, race, technology, class, religion)
    and a narrative arc (e.g. is this a progress or decline narrative) are established”
    (Mateas, Vanouse, and Domike 2000). The next stage is the generation and presentation
    of the part of story covering the years 1000-1750 CE, which takes six minutes.
    Following this, a second set of questions refines the ideological theme chosen
    in the first set and may introduce a subtheme (e.g., race with a subtheme of class,
    or technology with religion). The next section of the story is then generated
    and presented, covering roughly 1750–1950 CE, and again taking six minutes. This
    is followed by a final set of questions that further refines theme(s) and introduces
    the possibility for a reversal (e.g., a decline narrative may become a progress
    one). This is followed by the generation and presentation of the last phase of
    the story, covering roughly 1950 CE to the end of the millennium.


    As each phase of storytelling takes place, the ideological models not only become
    further shaped by the audience responses but also more blunt in their operations.
    This, combined with audiences’ greater familiarity with more recent history, causes
    the exaggerated ideological spin of the story to become steadily more apparent
    over the twenty minutes of a Terminal Time performance. Toward the end of performances
    this culminates in story fragments such as the glowing description of the Chinese
    invasion of Tibet quoted above. In that particular case, the ideological goals
    at work were those that Terminal Time’s creators refer to as belonging to the
    “anti-religious rationalist.”


