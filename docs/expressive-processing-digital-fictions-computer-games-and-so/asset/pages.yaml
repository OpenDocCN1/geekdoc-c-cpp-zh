  md: '# Chapter 3 Computer Game Fictions


    # Digital Fictions and the Eliza Effect


    Imagine you’ve checked out your books and walked, through the damp twilight, to
    the bus shelter across the street. Its fluorescent tubes have flickered on—you
    can read the schedules and advertisements behind the Plexiglas, as well as the
    stickers scattered over them.


    One rectangular sticker catches your eye. It has the name of no band, the number
    of no locksmith, the logo of no corporation, and no image of Andre the Giant.
    It’s just a block of text. The first words read, “Why bomb libraries?”


    The text is a passage from Implementation, a novel written in small chunks formatted
    to fit on mailing labels that can be fed through a standard laser printer. Implementation
    is a sticker novel, in one sense, and also a kind of digital novel. Its authors,
    Nick Montfort and Scott Rettberg (2004), don’t primarily distribute stickers.
    Instead, they distribute digital files, which others print on stickers and post
    in provocative locations. Readers sometimes encounter these stickers. But, like
    most stickers, they tend to be removed pretty quickly from the benches, doors,
    bathroom stalls, statue plaques, lampposts, bumpers, and other locations where
    they’re placed. What lasts longer are the photographs that people take of Implementation
    stickers in interesting positions, and it is through these images that most people
    experience Implementation, the files for these images dwarfing the other contents
    of the Implementation web site.


    Encountering Implementation can be a mysterious experience. Finding a disconnected
    sticker of text, especially if well-placed, can border on disconcerting. And the
    images of placed'
