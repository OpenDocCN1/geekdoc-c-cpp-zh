  md: 'words, sounds, or images), so critics of digital media have an opportunity
    to take their analysis further by turning their attention to the processes that
    enable such works to operate. The interpretation of processes, however, will require
    a new set of conceptual frameworks. Most models for digital media do not make
    a place for processes.


    The major exception for digital fictions—Espen Aarseth''s traversal function model—takes
    processes into account, but positions all of them as means of converting strings
    in the system into text experienced by audiences. This variety of textual transformations
    could be seen as a family of operational logics. My proposal is that, rather than
    assume these logics are central to all digital media, critical engagement should
    begin by identifying the actual logics operating in a particular work and the
