    Research on human planning in cognitive science continues to this day, long after
    Meehan''s dissertation, and hasn''t always agreed with scruffy accounts (Hayes-Roth
    and Hayes-Roth 1979; Rattermann, Spector, Grafman, et al. 2001). But even if some
    might disagree with Meehan''s critique of Strips, few would argue that F.E.A.R.''s
    planning uses a model that matches human memory. For example, F.E.A.R.''s fixed-size
    array used to check preconditions allows for efficient operation, but has no psychological
    credibility.


    Well after Meehan''s work, the 1980s and 1990s brought fundamental critiques of
    the Strips approach from new directions. Phil Agre (1997) in Computation and Human
    Experience provides a careful overview of the functions of (and relationship between)
    Strips and Planex before launching into a discussion of the recurring patterns
    of technical difficulty that will plague systems of this sort. The problems arise
    from the fundamental distinction between making plans and following them—a recapitulation
    of the mind/body split of René Descartes, and another kind of action compartmentalization—which
    is reified in the distinction between Strips and Planex, but in the background
    of almost all work on planning.


    Agre points to David Chapman''s work in the 1980s demonstrating that “plan construction
    is technically tractable in simple, deterministic worlds, but any nontrivial form
    of complexity or uncertainty in the world will require an impractical search”
    (156). In other words, traditional planning only works in microworlds, such as
    the Aesop’s fables world of Tale-Spin or the simple geometric spaces of Shakey.
