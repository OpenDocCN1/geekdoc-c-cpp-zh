    ...


    Notes continued at end of this chapter.


    Games employ fiction in many ways.1 The most story-ambitious genre of computer
    fiction is probably the computer RPG—a form that traces its roots back to a noncomputer
    form of gaming: the tabletop RPG (see sidebar: Computer and Tabletop Role-Playing
    Games).


    The first tabletop RPG was Dungeons & Dragons, created by Gary Gygax and Dave
    Arneson and published in 1974 (Mona 2007). It grew out of a tabletop war-gaming
    tradition in which maps were used to represent battlefields and miniatures representing
    units or individual combatants were placed on the maps. Players would then move
    figures and engage in battles by following sets of rules and consulting tables
    of numbers (the process and data of the system) with a random element at times
    introduced using dice. Dungeons & Dragons departed from this model by suggesting
    that each player take on a single character, that play sessions connect with one
    another in an ongoing campaign during which each character would develop, and
    that the game encompass much more of the characters’ lives (and the fictional
    world in which they live) than raw combat.2


    The result was the birth of a genre that is, when well played, undoubtedly the
    most successful combination of game and fiction now in existence. RPG systems
    have been created for a wide variety of fictional settings (some inspired by authors
    ranging from H. P. Lovecraft to William S. Burroughs), are played both as tabletop
    games and live performances, and embody a diversity of aesthetic goals (the design
    goals of Greg Costikyan’s games alone range from reproducing the wacky physical
    comedy of classic cartoons to evoking the alienation of Brechtian'
