    # AI, Neat and Scruffy


    A name that does appear in Weizenbaum’s book, however, is that of Roger Schank,
    Abelson’s most famous collaborator. When Schank arrived from Stanford University
    to join Abelson at Yale University, together they represented the most identifiable
    center for a particular approach to AI what would later (in the early 1980s) come
    to be known as the “scruffy” approach. Meanwhile, perhaps the most identifiable
    proponent of what would later be called the “neat” approach, John McCarthy, remained
    at Stanford.


    McCarthy had coined the term “artificial intelligence” in the application for
    the field-defining workshop he'
