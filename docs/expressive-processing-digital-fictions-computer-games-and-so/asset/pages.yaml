- pgno: 388
  md: 'players move their paddles to intersect with the path of a ball, which bounces
    back into the playfield—and also bounces off the walls. When a player misses the
    ball, the other player scores a point.


    In terms of the activity being simulated, this has almost nothing to do with another
    early, influential game: Spacewar! (Russell, Samson, Edwards, et al. 1962). Created
    on a PDP-1 at MIT in the early years of the 1960s, Spacewar! is widely considered
    the first modern video game. Using custom-made controllers, two players control
    the flight of a virtual spacecraft on the PDP-1’s CRT. The spacecraft are pulled
    toward the star at the center of the screen by simulated gravity, and can fire
    projectiles at one another. A spacecraft hit by the central star or a projectile
    is damaged.


    Though these simulations of table tennis and space warfare present different fictional
    worlds, if we look at the operational logics at work we see important points of
    similarity. One of these is the logic of collision detection—noted briefly in
    this book’s introduction. This is the simulation of one virtual object colliding
    with another. This comes into play when a ball bounces off paddles and walls in
    Pong as well as when spacecraft intersect with projectiles and the central star
    in Spacewar! Both games also offer a logic of navigation—Pong along a line, and
    Spacewar! across a plane. Both provide a simulation of basic elements of physics
    too, though the gravity that is central to Spacewar! plays no role in the bouncing
    trajectory of a Pong ball.


    This small collection of logics still forms the foundation of much modern computer
    gaming. From the playful Mario games to the gritty Grand Theft Auto franchise,
    collision detection, navigation, simulated physics, and the firing of projectiles
    are central to the system. Interestingly, these'
