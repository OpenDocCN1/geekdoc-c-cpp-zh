    architectural structure of *Terminal Time* is part of the concept of the piece.”
    This is an interesting artistic move, familiar from figures such as John Cage.
    It also defines a particular vision of authoring, in which the creation of new
    events and new inference tests are isolated from one another. On the other hand,
    it is also a prime example of the *Tale-Spin* effect—something that is present
    even more strongly for noninteractive story generators such as *Minstrel* and
    *Universe*.


    # **Terminal Time''s Surface**


    Considering this from another direction, the extent to which audiences can engage
    the specifics of *Terminal Time*’s processes—either for critical reflection or
    aesthetic appreciation—is limited by the surface it presents to its audiences.
    *Terminal Time*’s interaction mode (discrete questions interspersed by story generation)
