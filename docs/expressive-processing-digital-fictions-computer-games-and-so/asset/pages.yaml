    Potentially, an Eliza that could accept scripts of this imagined sort would embody
    a more powerful model— not just transforming the audience’s most recent statement
    based on keywords but also able to draw on the history of the conversation and
    a developing structure of information (presumably stored in concept-predicate
    pairs) to offer a wider variety of responses. Of course, the authoring effort
    involved in creating such a script would be greater as well, but so might be the
    opportunities for insightful construction (as we see in the original Eliza script,
    which can transform a statement such as “Everybody hates me” into the reply “Can
    you think of anyone in particular”).


    In other words, such a system could be seen as an important, if limited, step
    beyond the simple transformation logic of Eliza and the directed graph logic of
    dialogue trees. Like Eliza, it would generate things to say by following rules.
    Like a dialogue tree, it would maintain a state of the conversation. But, crucially,
    the state would not be one of a set of predetermined possible points—instead,
    it would be an interconnected, evolving data structure—and the rules would employ
    this structure, rather than just prewritten sentence templates for decomposition
    and reassembly. This points toward the power of employing models when making media.


