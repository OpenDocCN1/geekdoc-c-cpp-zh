  md: '# Digital Media Research and The Restaurant Game


    While this chapter critiques The Restaurant Game, Orkin''s project is an ambitious
    piece of research in a direction that may prove fruitful. In the blog-based review
    of this manuscript, Richard Evans observed:


    > I find The Restaurant Game fascinating because it is at a different level of
    ambition from other work in game AI.


    In terms of modeling the background social practices which make everyday stories
    intelligible (e.g. Schank''s restaurant), there are various levels of simulation:
    (1) Hand-code a few social practices; the system cheats and tells the agents what
    the practice is (in consequently there is no room for divergence between the different
    agents'' conception of the state of the practice), (2) Data-drive a number of
    social practices and let the agents themselves work out what state the social
    practices are in (this is what Rob Zubek does in his dissertation, using Markov
    models to make a best guess about the current state of the practice), (3) Let
    the system auto-generate practices from statistical analysis of lots of player
    data. The Restaurant Game is the only project I am aware of which allows for the
    possibilities of new practices to emerge, which were not defined by the author
    at design-time.


    Certainly this is a noble goal, and in this chapter I speculate that the model
    developed through The Restaurant Game may well form the core of an engaging playable
    experience in the future. In the blog-based review of this book''s manuscript,
    Orkin suggested that another future direction could be to “combine statistical
    and human-authored approaches, to get the best of both worlds.” He continued:


    > I agree with everything you''ve written, based on what we have published so
    far, but our long term goal is a semi-automated system where the statistical model
    forms the scaffolding, facilitating human authoring of the less typical behavior.
    The Restaurant Game is an ongoing project that will continue to keep me busy for
    the foreseeable future.


    The only way games and digital media generally will grow in some of the most interesting
    potential directions is through long-term research. Orkin''s project may, at the
    moment, be most compelling in terms of the lessons it teaches us about the software
    approaches he is employing. But it would be foolish to discount the future possibilities
    of The Restaurant Game and the successor systems that may employ its data or be
    inspired by its approach. More generally, it is important that we encourage exploratory,
    interdisciplinary research focused on the questions raised by digital media, rather
    than simply viewing media as an application area of results from other research.'
