    # Traversal Functions


    While much work on digital literature in the 1990s was focused on the audience
    experience of works—often with the project of comparing this experience to that
    of postmodern fiction or other lauded nondigital forms—Aarseth’s Cybertext takes
    the unusual step of considering such works as machines. In the book’s opening
    chapter, Aarseth writes that the concept of cybertext “focuses on the mechanical
    organization of the text, by positing the intricacies of the medium as an integral
    part of the literary exchange” (1997, 1). His “traversal function” model for understanding
    such intricacies of literary media, and the audience’s role in operating them,
    has been widely influential.


    In this model, Aarseth refers to texts visible on the work surface as “scripts,”
    textual data as “textons,” and the mechanisms by which scriptons are revealed
    or generated from textons and presented to the user as “traversal functions.”
    Aarseth’s model includes seven'
