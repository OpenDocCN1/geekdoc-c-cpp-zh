  md: '# Assembling the Storyboard


    Events that make good candidates for the story are placed on the system’s “storyboard.”
    Before being placed on the storyboard, however, events are spun by means of rhetorical
    plans. These select a subset of information available that relates to the event
    and lay out an order for its description. So, for example, the rhetorical plan
    for the goal “show-religion-causes-war” (which can satisfy “show-religion-is-bad”)
    is:


    +   - Describe the individual who called for the war, mentioning their religious
    belief

    +   - Describe the religious goal of the war

    +   - Describe some event happening during the war

    +   - Describe the outcome

    +   - (ibid.)


    A spin contains all the elements specified by a rhetorical plan as well as information
    about the rhetorical goal being satisfied (and all its parent goals). This information
    about rhetorical goals is necessary because the selection of events for each section
    of the story is performed via constraints, some of which handle events in terms
    of the rhetorical goals they serve. A number of these constraints come from the
    current Terminal Time ideology. For example, here are the storyboard constraints
    for the antireligious rationalist during the first six-minute section:


    ```

    (%rhet-goal :show-religion-is-bad)

    (%rhet-goal :show-religion-is-bad)

    (%rhet-goal :show-religion-is-bad)

    (%rhet-goal :show-religion-is-bad)

    ```'
