  img_proc: true
- pgno: 52
  md: 'stickers can offer up their own mysteries: Where is that? What is that? But,
    despite the importance of digital technology for Implementation, the mystery is
    never about software. Implementation depends on digital processes—but ones we
    use every day, such that the processes of file downloading, laser printing, and
    photo sharing no longer attract our attention.


    One might even argue that Implementation is not appropriate to discuss as a “digital”
    novel but rather one that is distributed and documented digitally. Regardless,
    in its use of digital processes, Implementation stands as a relatively extreme
    example of something true of many digital fictions: they avoid the dilemma of
    the Eliza effect by employing processes that are conceptually simple and familiar,
    and that are clearly exposed to the audience.


    Different fictions approach this general strategy in different ways. Some, in
    a manner relatively close to Implementation, embed themselves in familiar digital
    contexts. An email novel, such as Blue Company by Rob Wittig (2001, 2002), depends
    on processes of email transmission and reading—but, like the processes of laser
    printing, these have become completely naturalized for many with computer access.
    Similarly, the familiar link-following functions of web browsers and web servers
    makes it possible to construct fictions from interconnected networks of web pages,
    as with The Unknown by William Gillespie, Scott Rettberg, Dirk Stratton, and Frank
    Marquardt (1999). Familiar processes are also the primary digital components of
    hybrid works such as the alternate reality game by Elan Lee, Sean Stewart, Jim
    Stewartson, and Jane McGonigal (2004) titled I Love Bees, which brought players
    into a fictional world composed of web'
