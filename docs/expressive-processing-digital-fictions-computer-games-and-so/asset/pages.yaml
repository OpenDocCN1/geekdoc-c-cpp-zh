- pgno: 70
  md: '13. This is generally done quite artfully. Even an exceptionally awkward-seeming
    opening exposition is later given deeper resonances as players progress through
    the main quest. It is revealed that the characters surrounding the player ...
    Notes continued at end of this chapter.


    play—which, like a magician’s misdirection, keeps audience attention away from
    larger story developments until the moment they are revealed.13 A main quest provides
    the spine of the story. It represents a massive undertaking on the part of the
    player character to—what else?—intervene in events that will shape the history
    of the galaxy. In a manner typical of multistage quest design, the desired intervention
    requires learning the location at which these events are taking place, which requires
    gathering data from partial maps on several planets, which requires getting to
    the locations of these partial maps, which in each case can be accomplished in
    multiple ways, with each approach having multiple steps that may have smaller
    quests as prerequisites, and so on.


    Against this epic backdrop (with its many components, some rather mundane) other,
    optional quests are presented. Some involve developing the relationships between
    the main player character and her or his traveling companions. Others involve
    taking a role in the events happening on particular planets, often with a decidedly
    interpersonal element (e.g, a wife begs you to find evidence to clear her husband
    of murder charges, which soon leads to revelations of his infidelity, which you
    must choose whether to discuss with them). Some are quite small, such as discovering
    your ship has smuggled cargo aboard, being given the code for the container, and
    being offered good payment for the goods by a crime syndicate representative.
    In cases such as this last one, the player need only decide what the characters
    will do with the one-stage quest—and then enact the decision in the game’s fictional
    world (travel to the places, interact with the objects, and talk with the appropriate
    NPCs).'
