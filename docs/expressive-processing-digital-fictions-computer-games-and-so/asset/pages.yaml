    # Terminal Time and Audiences


    Terminal Time is always presented in a theater, before a live audience. Usually
    it is presented twice for the same group, with each performance followed by a
    brief discussion with one or more of Terminal Time’s authors—resulting in an overall
    audience experience of roughly one hour. At each performance, Terminal Time generates
    two quite different narratives of the same millennium. In doing so, it makes clear
    that it is (in the terminology of Mateas’s expressive AI) both a “message from”
    and “messenger for” the author. It not only presents the possible world in which
    there is a machine that creates historical documentaries (which could be accomplished
    by a traditional fiction) and two different narratives created by this machine
    (possible worlds within worlds are certainly a feature of traditional fiction)
    but makes it apparent that this machine actually exists and operates, and could
    produce a larger number of fictions than that audience could possibly sit through.
    This maneuver—this establishment of the fact that Terminal Time is not only a
    message but an operating messenger—'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'could be compared to the difference between writing Jose Luis Borges''s story
    “The Garden of Forking Paths” and actually constructing the labyrinth novel described
    within it. Conceptually they are both very much the same and widely distinct.
    The method of Terminal Time’s presentation brings home this distinction.


    Another impact of dual presentations of Terminal Time is that it allows the audience
    to change their relationship with its interface. Jay David Bolter and Diane Gromala,
    in their book Windows and Mirrors, point out that even in one viewing, Terminal
    Time provides its audience with a dual experience:


    As spectators, we experience a more or less transparent movie . . . As participants
    in the voting process, however, we are very conscious of the interface, and we
    are meant to reflect on our participation in the vote—in particular, on the notion
    that our ideology is being tested. The experience is reflective. (2003, 134-155)


    Presenting Terminal Time twice creates a dual reflection. During the first showing,
    audience members can reflect on the voting process, the resulting story, and Terminal
    Time’s simultaneous performance and parody of the notion of highly customized
    media. But only after the first showing is complete does it become possible for
    the audience to fully reflect on their own complicity in the very structure of
    market-research-style polling that provides the only means of interaction with
    Terminal Time—and decide to stop “playing along with” and instead start “playing
    against” this expectation. Both the reports of the Terminal Time authors and my
    own experiences as a Terminal Time audience member (at the 1999 Narrative Intelligence
    symposium, SIGGRAPH 2000, and the University of'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'California at Irvine in 2007) point to the importance of this shift between
    showings. As the Terminal Time authors write in the book Narrative Intelligence.


    Typically, during the first performance, audiences respond to the questions truthfully,
    that is, actively trying to reflect their true beliefs in their answers to the
    questions. During the second performance they tend to respond playfully to the
    questions, essentially trying on different belief systems to see how this will
    effect the resulting history. (Domike, Mateas, and Vanouse, 2003)


    Of course, the dual showings also serve to allow the audience to begin to form
    a mental image of how the Terminal Time model of ideology drives the documentary-creation
    process. From there it becomes possible for the audience to reflect on the gap
    between this and how (in their view) ideology shapes the documentary-creation
    process of human filmmakers. This can be seen as another of Terminal Time''s inversions
    of the history of AI: a gap in its simulation of human behavior that is not a
    failure or an opportunity for future work but an opportunity for reflection and
    debate.


    # Terminal Time and Interaction


    Little of the sort of reflection discussed above is likely with noninteractive
    story-generation systems. In a sense, it is the interactive nature of Terminal
    Time that actually warrants the use of computational processes. This separates
    it, for example, from the public presentation of Brutus. A human author could
    easily write a Brutus story for posting on a web site or printing in a newspaper.
    The same is true of Universe. A human author could (and many human authors do)
    produce plot outlines'
