  md: '# # Role-Playing Games


    +   1. Some games, of course, can hardly be said to engage fiction at all. No
    one wants a story with their *Tetris*—and its “fictional world” of falling blocks
    barely supports the phrases. Given the sometimes-contentious nature of critical
