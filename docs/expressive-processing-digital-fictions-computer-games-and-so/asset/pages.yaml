    # Procedural Rhetoric


    My work here, in turn, is a complement to the exploration of another intersection
    of politics and processes: the use of computational processes as persuasive speech.
    While figures like Sherry Turkle (1995) and Nelson have discussed this for several
    decades, often in the context of environmental and urban planning simulations,
    the first detailed, full-length study is *Persuasive Games: The Expressive Power
    of Videogames* by Ian Bogost (2007). As the title indicates, Bogost’s book is
    about computer games—especially those designed for use in politics, education,
    and advertising. But the book’s implications are'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'wider. Bogost uses games as a specific set of examples for the development
    of a larger argument about what he terms “procedural rhetoric,” the art of persuasion
    through rule-based representations and interactions rather than spoken word, writing,
    images, or moving pictures” (x).


    In particular, Bogost points to the ways that digital media can make powerful
    assertions about how things work. Games and other procedural systems can use processes
    to create a representation of something that happens in our world—from the growth
    of cities, to the marketing of cereal, to the mechanisms of long-term debt. Playing
    the game involves interacting with this representation, which uses its internal
    processes to exhibit different behaviors, making it possible to explore the particular
    model of how things work.


    As educators including James Paul Gee (2004) have observed, successfully playing
    games involves learning Prominent game designer Raph Koster (2004) has maintained
    that such learning is central to our experience of fun in games. Bogost draws
    our attention to how this learning develops some understanding of the structure
    of the procedural representation at work—but not necessarily any critical approach
    to the model or the way it is presented. Addressing this is one of the primary
    goals of procedural rhetoric. Just as oral rhetoric aims to help people persuade
    through speech as well as aid audiences to understand and think critically about
    oral arguments, procedural rhetoric strives to help authors and audiences of process-based
    arguments. As is no doubt clear by this point, I consider this a much more appropriate
    goal for computational models than attempting to reproduce the processes of human
    thought.'
