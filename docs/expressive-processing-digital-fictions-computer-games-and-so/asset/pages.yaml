- pgno: 183
  md: 'Playing The Sims is lots of fun, but one thing conspicuously lacking from the
    experience is any compelling feeling that the characters are real. Much of this
    lack comes from The Sims'' reliance on sequences of linear animation to convey
    behavior of its characters. For example, if the player indicates to a Sims character
    that the character should feed her baby, then the character will run a canned
    animation to walk over to the baby''s bassinet, pick up the baby, and make feeding
    movements. If the player then tells her to play with the baby, she will put the
    baby down, return to a previous position, then begin the animation to approach
    the bassinet, again pick up the baby, and start to play. One result of this mechanical
    behavior is that there is no real possibility of willing suspension of disbelief
    on the part of the player as to the reality of the character. (Perlin 2004, 16)


