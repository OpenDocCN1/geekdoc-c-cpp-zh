    # Simulation, Language, and Fiction


    I believe that computational processes are our most exciting tool for exploring
    the future of fiction. One future direction—explored in most of this book—is that
    of simulating fictional events, characters, and so on, in a manner analogous to
    the simplified, expressive ways that games (and other forms of playable media)
    simulate space. But as the electronic literature community has convincingly demonstrated,
    there are many interesting new fictional forms enabled by digital media that do
    not involve variability in story events. I believe this is also true for work
    that is more process intensive than most created by e-lit authors thus far.


    I am interested in textual instruments in part because'
