    The SimCity effect is one way to build the experience of agency. Façade''s procedural
    script seeks another. Mateas argues that in general, “a player will experience
    agency when there is a balance between the material and formal constraints” (2004,
    125). The formal constraints are present in the shape of the fictional world,
    motivating some actions and not others. The material constraints, on the other
    hand, are the resources available for action. Many contemporary games for children
    and adults create a sense of agency by presenting a fictional world in which one
    would want to move across space (e.g., to rescue a princess or find necessary
    information) and fight enemies (e.g., who are mean animals or are zombies/aliens/robots/Nazis),
    and providing exactly the tools necessary (well-developed mechanics for spatial
    movement and combat).


    Given this, achieving agency is relatively well understood for game worlds with
    simple fictional worlds and simple available actions, because it is easy for players
