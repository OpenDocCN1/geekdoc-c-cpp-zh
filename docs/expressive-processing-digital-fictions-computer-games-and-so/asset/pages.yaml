    very process-intensive when considered in light of two popular conceptions of
    process intensity:


    +   (1) the ratio of processing to data (this is a number of operations per second
    divided by a number of bits), and (2) the ratio of program-code to data (this
    is unit-less, as the numerator and denominator are both expressed in numbers of
    bits). Now The Sims is more process-intensive than many other games in terms of
    the second interpretation (2), because there are hundreds of different scripts,
    detailing how the Sim runs each type of interaction, but it is not particularly
    process-intensive in terms of the first: there is actually very little behavioral
    processing going on while a Sim is running an interaction. It is only when the
    Sim has finished running an interaction, and is trying to decide what to do next,
    that there is intensive behavioral processing. But it is questionable whether
    this FindBestAction algorithm (which is run infrequently) is particularly process-intensive,
    too. Your revised notion of process-intensity (the amount of processing using
    on behavior) still doesn’t truly capture the intention—to give just one counter-example,
    consider two different chess-playing AIs, both of which searched the same search-space,
    but one does some clever pruning (alpha-beta etc) to reduce how much it searches.
    The unoptimized chess program does more processing, sure, but we wouldn’t really
    want to say that it is more process-intensive. (Or if we do, we would have to
    give up the idea that process-intensity is something to be aimed for). In fact,
    I think a much more interesting ratio than process-intensity is the ratio of dynamically-generated
    data (that is used in decision-making) to the amount of statically-defined data.
    What makes the unoptimized chessplaying program weak is that it doesn’t build
    up interesting dynamic data structures which it can use to optimize the search.
    In terms of this ratio of dynamic-data to static-data, The Sims 3 is more dynamic
    than previous Sims games—much more dynamic data is generated on the fly to decide
    what is appropriate to do.


    As I replied to Evans, I actually agree with his argument, for the most part.
    However, my revised conception of process intensity is not a clear-cut ratio of
    processing used for behavior to processing used for other purposes. The question
    also isn’t something broader along the same lines, such as: “How much effort—in
    design, production, and operation—goes into determining behavior, and how much
    goes into other things?”


    Rather, my revised conception is one it no longer makes sense to express as a
    ratio. Its question might be: “How much is dynamic behavior the focus of the design
    and experience?” If we have two chess programs, one which focuses more on figuring
    out the next move and the other which focuses more on playing re-ordained animations
    of the pieces fighting after each move, clearly the one emphasizing dynamic behavior
    (choosing the moves) rather than canned behavior (playing the animations) is more
    process intensive. And there’s no confusion when we do the pruning—it doesn’t
    lessen the amount that dynamic behavior is the focus.


    This approach to the concept is significantly less clear-cut than a Crawford-style
    ratio. It is my suspicion, however, that any version of the concept based on a
    simple ratio would be troubled by issues such as those raised earlier in this
    chapter. That said, Evans’s revised ratio (of dynamic to static data) seems stronger
    than many alternatives.'
