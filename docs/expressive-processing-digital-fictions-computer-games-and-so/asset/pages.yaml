  md: '15. I pick out Mateas because of his particular interest in fiction and games.
    But similar shifts have been undertaken by a number of other prominent young researchers
    with artificial intelligence backgrounds, such as Phoebe Sengers and Warren Sack.


    Abelson''s work that is also visible in much of AI: in trying to capture the structure
    of the world or the way reasoning works, it always captures someone’s idea of
    how things are rather than any transcendental truth. Of course, this isn’t a problem
    in all contexts, but it is when trying to understand human intelligence (the overlap
    of AI and cognitive science) or when trying to create a software system that acts
    intelligently in a real-world context (most other uses of AI). This, in part,
    is why the most prominent AI efforts of recent years have been statistically driven
    approaches to focused problems (e.g., Google’s search results, or Amazon’s recommendation
    system) rather than hand-authored approaches to large problems (e.g., general-purpose
    reasoning).


    Still, when it comes to media, the goals are no longer general-purpose. The authoring
    of media is instead precisely the presentation of “someone’s idea” of something.
    For fiction, it’s someone’s idea of people, stories, language, and what it means
    to be alive.


