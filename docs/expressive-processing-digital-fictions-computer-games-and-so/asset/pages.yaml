    # The Expressivator


    For Sengers, the problem with Hap characters grows out of their continuities with
    traditional AI. The issue is not that a behavior-based architecture is inappropriate.
    Rather, it is that behaviors tend to be authored from the character''s point of
    view (what should the character be able to do) and selected from the character''s
    point of view (what is the right thing to do in this situation). This may sound
    like a computer model for what the live human actors provided in the Oz Project''s
    bus stop experiment. But the work of an actor is to take actions that will communicate,
    not those that are correct. The difference turns out to be crucial. Responding
