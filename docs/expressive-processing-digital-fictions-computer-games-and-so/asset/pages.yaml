  md: 'matched. An architecture should be “crafted in such a way as to enable just
    those authoritative affordances that allow the artist to manipulate the interpretive
    affordances dictated by the concept of the piece” (127). Given that the concept
    of Terminal Time is for a complex, evolving model of ideology to be interpretable
    from clips of preexisting video combined with textual descriptions of historical
    events, systems like Terminal Time need a model for generating text that both
    captures authorial intention and is flexibly manipulatable by the system. Creating
    such systems is a huge challenge.


    # Expressive Language Generation


    From one perspective, the challenge faced by Terminal Time is the primary focus
    of the entire computer science research area of NLG. This work focuses on how
    to take a set of material (such as a story structure, a weather summary, or current
    traffic information) and communicate it to an audience in a human language such
    as English. On the other hand, little NLG research has taken on the specific version
    of this challenge relevant for Terminal Time (and digital media more generally):
    shaping this communication so that the specific language chosen has the appropriate
    tone and nuance, in addition to communicating the correct information. Given this,
    digital media (such as games) have generally chosen different approaches from
    NLG researchers for the central task of getting linguistic competence into software
    systems.


    The approach of most games, as I discussed earlier in the context of dialogue
    trees, is to simply have a human author write large chunks of text—these chunks'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'then embody the author’s linguistic competence. At this extreme, the computer
    need not know anything about the content of what the author has written, because
    the computer will never need to do anything but output one of these chunks at
    the appropriate moment. In games the human-written chunks of text are often read
    aloud by voice actors and the resulting sound files are triggered by the system
    at the appropriate moment determined by nonlinguistic processes within the game.


    The opposite extreme would be to attempt to put all the linguistic competence
    into the software. Using AI techniques, the software would determine (at the level
    of meaning) what messages need to be conveyed to the audience. Then, using general
    knowledge about human language, a body of knowledge about the specific language
    in which the messages are to be conveyed, topic-specific knowledge of how ideas
    in this domain are typically expressed, and some sort of mechanism for defining
    and choosing between the different options deducible from this knowledge, the
    software would produce a chunk of text fully customized for that situation. No
    trace of a message, except as abstract knowledge, would exist before it was assembled.
    No operational system such as this exists, because many nontrivial research questions
    would need to be answered before one could be constructed. But this kind of ambition
    is part of what motivated, for example, the work on translating conceptual dependency
    expressions to natural-language sentences in Schank’s lab, which formed the basis
    for James Meehan’s Mumble—a more ambitious version of which was Neil Goldman’s
    earlier Babel (Goldman 1975).'
