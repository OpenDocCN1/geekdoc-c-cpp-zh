    # Employing Logics


    Successful combinations of spatial logics and game rules are repackaged repeatedly.
    Games such as Pac-Man and Tetris have had many authorized and unauthorized versions
    “skinned” with different surface graphics and spatial arrangements, but with the
    essential logics of spatial movement and gameplay preserved. Such combinations,
    within a larger range of variation, are also the basis for our identifications
    of game genres such as “side-scrollers” and “first-person shooters.”


    On the other hand, while a set of spatial logics often works satisfyingly with
    many different sets of graphics, the same is not true of textual content. It is
    for this reason that Text Rain, Pax, and Screen are each carefully arranged combinations
    of spatial logic with textual material, creating a connection between the text’s
    themes and the operations of the spatial logics. Certainly, it is technically
    true that a project such as Screen would operate with arbitrary textual material,
    but only a limited set of texts would resonate with the form created by its spatial
    logics.³


