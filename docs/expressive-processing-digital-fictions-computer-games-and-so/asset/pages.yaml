    much larger and more complex, in effect operating as miniature scene structures
    embedded within the larger drama, built to be intermixed with other elements.


    A primary goal of the beats that Stern and Mateas created for _Façade_ is to embroil
    the player in a series of what they call “social games.” The first section of
    the drama has Grace and Trip setting up zero-sum affinity games, in which the
