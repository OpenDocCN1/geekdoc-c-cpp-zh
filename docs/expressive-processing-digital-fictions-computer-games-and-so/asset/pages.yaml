    additional controllers such as dance mats, simulated musical instruments, or cameras.
    And digital fictions and games more generally may have more complex surfaces,
    selected or crafted by their authors. These may repurpose everyday objects, employ
    augmented or virtual reality displays, infiltrate and incorporate portions of
