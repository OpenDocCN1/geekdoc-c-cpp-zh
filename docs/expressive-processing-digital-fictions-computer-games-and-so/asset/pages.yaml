- pgno: 57
  md: '# Quest Flags


    Modern computer RPGs use many of the same technologies and techniques for representing
    their fictional worlds as other games. A character (or group) moving through an
    explorable three-dimensional world—with objects to pick up, NPCs to engage, and
    combat to resolve—is present in first-person shooters (e.g., the Doom series),
    platformers (e.g., the Prince of Persia series), and RPGs (e.g., the Knights of
    the Old Republic series). What changes is the emphasis in play. As the name would
    suggest, first-person shooters are focused on combat as the main form of play.
    It becomes both the primary challenge and main motivation for players moving through
    the world. Platformers, on the other hand, make movement itself (sometimes through
    a puzzling space of platforms of varying shapes and heights) the main challenge
    and motivation for players. RPGs, however, often work to motivate players to engage
    in a variety of types of play (e.g., exploration, combat, and intellectual puzzle
    solving) via character development set in a larger story. In particular, many
    RPGs give the sense that the story itself is playable by offering the player freedom
    to roam across a world infused with quests that operate at many scales, can sometimes
    be completed in different ways, and are often optional or available for partial
    completion. As each player chooses which quests to accept—as well as how, whether,
    and when to complete them—this creates a different story structure for each playing.
    Some of the player’s nonquest activities may be directly related to this structure
    (e.g., taking on tasks in the world that earn money, in order to acquire enough
    to purchase an item needed for a quest), but the structure also provides one context
    in which even'
