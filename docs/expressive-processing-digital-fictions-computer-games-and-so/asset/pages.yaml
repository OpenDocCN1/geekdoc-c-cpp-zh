- pgno: 252
  md: 'significant difference lies in the predefined pathways that structure a *Choose
    Your Own Adventure*. This is a close parallel to a difference described earlier,
    between character actions driven by finite-state machines and the *Strips*-derived
    planning processes of *F.E.A.R.* In all these operational logics, the possible
    action fragments are hand created by human authors. In one set, though, the connections
    between fragments are predetermined during the same authoring process, while in
    the other set actions are dynamically sequenced, according to rules, based on
    the current state of the fictional world. This produces a vast difference in both
    the tractability of the authoring process and the dynamism of the audience experience.


    Still, when systems are designed this way, a risk presents itself. A system designed
    to dynamically sequence hand-authored elements of a fiction may embody a flexible,
    powerful approach to generating a variety of fictions—or it may simply be an elaborate
    manner of breaking a particular story into chunks and providing a means for a
    computer to reassemble them. The only way to be sure that a software author hasn''t
    created an inflexible system (while fooling herself or himself into thinking it
    is a general, flexible one) is to have enough data to produce a variety of complete
    audience experiences. *Universe* seems like a powerful and flexible model, but
    only further development of its data could have demonstrated this convincingly.


    Similarly, given the lack of attention paid to surface generation in *Universe*,
    it is impossible to know how well its model serves the challenge of expressing
    its underlying model for the audience. Some might argue that meeting this challenge
    is entirely a matter of the design of the'
