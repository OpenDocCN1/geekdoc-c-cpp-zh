    # ## Eliza Today


    Eliza—or more properly, Eliza/Doctor—is a ground breaking system created by computer
    science researcher Joseph Weizenbaum at MIT in the mid-1960s. In the two decades
    between when Weizenbaum created the system and I experienced it at my friend’s
    house, it had become one of the world’s most famous demonstrations of the potential
    of computing. First unveiled two years before HAL 9000’s screen debut in 2001:
    A Space Odyssey, it seemed that Eliza made it possible to have a real conversation
    with a computer.²


    In the computer science literature, under the name Eliza, Weizenbaum’s system
    is a contribution to the field of natural language processing. On the other hand
    when Eliza plays Doctor it is a well-known computer character, famous far beyond
    computer science, often also known'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'by the name Eliza. And Eliza has a third common usage in the computer world
    as well: the Eliza effect. This has generally been a term used to describe the
    not-uncommon illusion that an intelligent computer system is more “intelligent”
    (or substantially more complex and capable) than it actually is. One of my purposes
    in this chapter is to revisit the Eliza effect and give it a further nuance so
    that it names not only this initial illusion but also the authorial choice that
    comes with it: severely restricted interaction (on the one hand) or eventual breakdown
    that takes a form based on the actual underlying processes (on the other).


    In the next chapter, with an examination of the Eliza effect as background, I
    will look at the options selected by today’s authors of digital fictions—particularly
    for computer games. These generally put aside the Eliza effect in favor of systems
    that more clearly communicate their structures to audiences. Yet there are two
    problems with these that I will consider. Some of them employ processes that,
    while legible, tend toward a non-Eliza form of breakdown. Others, while avoiding
    breakdown, have low ambitions in their use of computational processes. More ambitious
    routes will be the focus of the remaining chapters of this book.


    But for now I’ll start with the illusion.


