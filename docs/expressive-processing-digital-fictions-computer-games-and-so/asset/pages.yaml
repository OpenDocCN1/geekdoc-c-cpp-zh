    # Universe’s Characters


    A Universe story starts with the creation of characters, much as happens in Tale-Spin.
    But rather than a small number of characters who seem to come into existence at
    the moment the story begins, Universe creates an interconnected group of characters
    with somewhat detailed histories. This is accomplished through a character-creation
    cycle. As outlined in Lebowitz’s 1984 paper, the cycle begins with a few characters
    in a queue, soon to become the universe’s (m/p)atriarchs, who need the details
    of their lives fleshed out. One character at a time is removed from the queue,
    and a simple simulation of that character’s life is carried out—focusing on the
    gaining and losing of spouses, the births of children, and the possibility of
    death—until the present is reached. Any new characters created through this process
    are added to the queue. New characters aren’t created for each marriage, however,
    because the system may select'
