  md: 'Tale-Spin was essentially a planning engine, so it seemed reasonable to build
    a better storytelling program by simply augmenting the Tale-Spin model with a
    “meta” level of goals and plans representing what the author was trying to achieve
    with his storytelling. And, in fact, the first versions of Minstrel operated just
    this way.


    One problem became immediately obvious with this approach: the stories weren''t
    original. (2007)


    The problem of originality, of creativity, became increasingly central to Turner''s
    research. As he puts it, “Storytelling went from being an end in itself to being
    the domain in which Minstrel demonstrated creativity” (ibid.). At the same time,
    the account of intelligence in the scruffy AI community was shifting. Particularly,
    in Schank''s lab the model of dynamic memory and its adaptations was extended
    into the idea of “case-based reasoning” (CBR). The basic idea of CBR is in some
    ways quite close to that of scripts: in the main people do not decide what to
    do in each situation by reasoning from first principles but instead draw on previous
    knowledge. However, rather than suggesting that each of us has a “restaurant script,”
    a “sports event script,” and so on, CBR assumes that we remember many cases, and
    reason from them—much as the learning of previous cases is formalized in legal
    and business education.


    According to CBR theory, humans have three major types of cases we work with.
    There are “ossified cases” that have been abstracted to the point where they are
    essentially rules, such as proverbs. There are “paradigmatic cases,” each of which
    turns out to be the only experience we have that is relevant to a particular current
    situation, and that we adapt in order to understand the new situation.'
