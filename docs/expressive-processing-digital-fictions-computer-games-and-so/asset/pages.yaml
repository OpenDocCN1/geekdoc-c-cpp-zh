    # Denial and Rationalization


    The foundation of the ideology machine is created by the combination of interconnected
    structured pairs, evaluations of the elements of those pairs, and the credibility-testing
    processes. Interaction is particularly strongly shaped by the evaluations of elements.
    Recall that interaction begins with a pair made up of a source and a compound
    predicate (constructed as a familiar concept-predicate pair) that is input into
    the system. If a source with a positive evaluation (a “favorable source”) makes
    the claim that a concept with a positive evaluation (a “good actor”) is connected
    to a predicate with a positive evaluation (“a good action”) then, as Abelson and
    Carroll put it, “there is not much left for the system to do . . . except to express
    joy” (1965, 28). This is not entirely true, in that the system also stores this
    assertion in its belief data. Similarly, when a favorable source claims that a
    bad actor is engaged in a bad action, the system simply expresses regret and stores
    the data. But in other cases, the ideology machine engages one of the two primary
    types of processes that it carries out in response to interaction: denial and
    rationalization.


