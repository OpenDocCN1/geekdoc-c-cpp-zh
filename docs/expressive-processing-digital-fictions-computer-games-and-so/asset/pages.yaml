  md: 'shows 3-D images while allowing users to continue to see their own bodies,
    and that does not require users to wear encumbering equipment—unlike head-mounted
    displays, which are essentially blindfolds with televisions mounted in front of
    the wearer’s eyes (Cruz-Neira, Sandin, and DeFanti 1993). Brown’s Cave is an eight-foot
    cube, missing its top and one side, and its walls and floor are screens. Projectors
    are pointed at each screen, and they alternately project streams of images meant
    for the user’s left and right eyes. The user wears shutter glasses that alternately
    occlude the left and right eyes, in synchronization with the projectors. The result
    is stereo virtual reality—a 3-D vision of computer-generated imagery—combined
    with the physical presence of the people and objects in the Cave.


