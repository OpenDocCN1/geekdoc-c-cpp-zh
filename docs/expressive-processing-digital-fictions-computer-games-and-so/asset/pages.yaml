    Learning to interpret computer models critically is a vitally important ability
    for us to foster. Contributing to it is a major goal of this book—and an important
    motivation for the field of software studies as a whole. But as Bogost and Turkle
    both agree, having an understanding of how software operates is the essential
    foundation for developing this ability. This, I believe, is the major unacknowledged
    contribution of systems like SimCity.


    # Types of Systems


    Of course, all games operate using some kind of system—even Pong contains a simple
    spatial simulation—and the player must learn something of this system in order
    to play. More complex, multifaceted systems often take longer to understand—and
    games that include these systems may require greater mastery as play progresses.
    This is part of what lies behind Lev Manovich''s widely cited observation that
    “as the player proceeds through the game, she gradually discovers the rules that
    operate in the universe constructed by this game. She learns its hidden logic—in
    short, its algorithm” (2001, 222).


    Of course, different sorts of games employ different algorithms—and understanding
    them has different roles in gameplay. For example, new players of interactive
    fiction (IF) games pass through a period of experimentation in which they come
    to understand something of the types of utterances such games accept. A simple
    parser, such as that shipped with the early home computer adventure games from
    Scott Adams, can only understand two-word commands such as “go east.” A more complex
    parser,'
