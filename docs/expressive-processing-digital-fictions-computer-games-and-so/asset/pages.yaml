    # N-grams


    A statistical model used in a system for understanding or generating human language
    is often called a “language model.” As with most statistical models, the primary
    use of a language model is to predict the future (linguistic) behavior of a system
    based on a sample of its past (linguistic) behavior. Constructing such a model
    requires two efforts. The first is deciding what to pay attention to: what “features”
    of the past behavior will be treated statistically. The second is deciding how
    to make those features part of an operating statistical model.


    One of the most popular approaches for building a language model is the concept
    of n-grams (also known as Markov chains). An n-gram language model is built by
    looking at a body of language data and seeing what elements follow other elements.
    If looking at the letters in a body of English, q would quite often be followed
    by u. Looking at the word level, you would more frequently be followed by are
    than by banana. Looking at sets of two elements is examining bigrams and sets
    of three are trigrams.


    As this probably makes clear, in an n-gram model, the features are often the word
    or two that appear before the current one. A simple model employing these features
    would be: the different following words are assigned likelihoods based on how
    frequently they appear after the preceding ones within the sample data. In actuality,
    the models tend to be somewhat more complicated. This is in part because even
    after training on millions of words, new pairs and triplets of words will appear
    regularly even in'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'data from the same source (say, the same newspaper from which the model was
    developed). This requires that the model be “smoothed” so that newly appearing
    digrams and trigrams won’t be assigned zero probabilities.


    Such models have many potential uses. For example, dictation software may find
    certain words in a sentence ambiguous. But an n-gram model can use the words that
    precede and follow ambiguous words to improve the chances of correct recognition.
    Certainly “ate the banana” is a much more likely trigram than “ate the bandana.”


    On the other hand, an n-gram collection doesn’t “understand” anything about the
    language it models. It would work just the same way on a collection of musical
    notes or any other serially ordered data. And while as a model it does well at
    capturing coherence from word to word, it does poorly at capturing any higher-level
    structure. This becomes quite apparent in the various attempts to use n-grams
    to generate language, rather than simply understand it. The foundational example
    here is Claude Shannon’s n-gram-generated sentence from his field-defining essay
    “A Mathematical Theory of Communication”:


    > THE HEAD AND IN FRONTAL ATTACK ON AN ENGLISH WRITER THAT THE CHARACTER OF THIS
    POINT IS THEREFORE ANOTHER METHOD FOR THE LETTERS THAT THE TIME OF WHO EVER TOLD
    THE PROBLEM FOR AN UNEXPECTED. (1948, 388)


    This passage is more coherent than a random series of words, because each word
    follows quite naturally from the one preceding it. This is no surprise, given
    that it was produced by flipping through a book, writing down a word, flipping
    through until that word was found again,'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'writing down the word immediately following it, then flipping through until
    the just-written word was found, and so on—a word-level bigram. Longer chain lengths,
    of course, create longer stretches of local coherence. But the structure of sentences,
    paragraphs, and ideas is completely absent from the n-gram model.


    In other words, despite the impressive results from many statistical AI systems,
    a statistical model is nothing magical. Like Google’s capturing of links from
    Web pages, statistical models such as n-grams must be focused on well-defined
    features in consistent pools of data. Then, even once millions of patterns are
    captured, in any activity with significant variety (like human language) the model
    must be smoothed to account for the fact that previously unseen patterns will
    continually appear. Even once this is accomplished, the model will only be appropriate
    for limited tasks. Given this, we must bear both the strengths and limitations
    of statistical approaches in mind. Whether we are listening to intelligence agency
    officials or singularity-seeking science fiction writers, we should not be fooled
    by impressive results in certain areas into thinking anyone has developed (or
    knows how to develop) robust AI able to predict, identify, generate, and otherwise
    stand in for human knowledge of a complex domain.


    # The Restaurant Game


    After moving to MIT, Orkin, who led the AI development for F.E.A.R., launched
    a project with an interesting goal: pursuing an idea from scruffy, symbolic AI
    using the tools of statistical AI. Specifically, his The Restaurant Game seeks
    to develop what he characterizes as a modern version of the scruffy idea of a
    “restaurant script” (Orkin 2007,'
  merge: -1
  img_proc: true
- pgno: 216
  md: '22). His method is to statistically analyze the behavior of thousands of players
    in a free-form restaurant environment and thereby learn a much more flexible and
    detailed script of restaurant behavior than it would be possible to author by
    hand.


    Orkin calls his effort a game—a term that resonates in two ways. First, he plans
    to use the results of his work to develop a game, and all those who interact with
    the free-form environment will be credited as designers of the eventual game.
    Second, by presenting the experience as a game, he is placing The Restaurant Game
    in the same category as a number of successful efforts to use simple game structures
    to encourage large numbers of people online to collaboratively develop data that
    is intractable for machines and too laborious for individual humans.


    The best known of these data-collection games is The ESP Game, developed by Luis
    von Ahn and collaborators (2005) at Carnegie Mellon University. This game shows
    the same image, simultaneously, to two audience members who don’t know the other’s
    identity and cannot directly communicate. These two people each type words as
    quickly as they can that might describe the contents of the image, avoiding any
    forbidden words listed. As soon as one player types a word that the other player
    has already typed—creating a match in their descriptions—they score points and
    the next image appears, until the game time expires.


    People find The ESP Game surprisingly fun, with some experiencing an exciting
    feeling of connection at the moments when they choose the same word as a partner.
    This has provided the motivation for people to generate quite a bit of data through
    such games—more than one hundred million image labels from The ESP Game alone'
  merge: -1
  img_proc: true
- pgno: 217
  md: '(Saini 2008)—and for Google to license the approach for its Image Labeler.
    Such data may be used to label online images (to increase accessibility for the
    visually impaired) or toward more computationally challenging ends (e.g., as well-formed
    training data for statistical approaches to computer vision). Quite a few other
    games along these lines exist, and they differ in their particulars, but all of
    them use simple scenarios to generate specific data points.


    By comparison, The Restaurant Game is immensely free-form and ambitious. Each
    person who signs in plays a male customer or female waitress. Players can chat
    freely with each other—not trying to guess the same word or taking part in any
    other gamelike activity, but simply playing their roles (figure 6.3).15 The environment
    has many objects with which the players can interact, including food and drink
    that can be consumed, a register that can be used to pay bills (but can also be
    picked up and perhaps stolen), menus, furniture, flowers on the tables, a variety
    of kitchen implements, and so on (figure 6.4). There are also two NPCs: a bartender
    who provides drinks, and a cook who supplies food.


