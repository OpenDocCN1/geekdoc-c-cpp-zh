  md: 'with one another.


    Trying to interpret a work of digital media by looking only at the output is like
    interpreting a model solar system by looking only at the planets. If the accuracy
    of the texture of the surface of Mars is in question, this is fine. But it won’t
    suffice if we want to know if the model embodies and carries out a Copernican
    theory—or instead places Earth at the center of its simulated solar system. Both
    types of theories could produce models that currently place the planets in appropriate
    locations, but examining the models’ wires and gears will reveal critical differences,
    probably the most telling differences.


    As we see in Tale-Spin/Mumble, the surface of a work of digital media is not transparent—it
    does not allow for direct observation of the data and process elements created
    and selected by the work’s author(s), or the technical foundations on which they
    rest. Given this, adopting only the audience’s perspective makes full engagement
    with the work’s processes impossible. Some systems, through interaction, may make
    it possible to develop a relatively accurate hypothesis of how the internal systems
    operate (in fact, some works require this on the part of the audience). But this
    is a complement to critical engagement with the operations of the work’s processes,
    rather than a substitute. Failing to appreciate this leads to missed opportunities
    such as those of Aarseth and Murray with Tale-Spin.


