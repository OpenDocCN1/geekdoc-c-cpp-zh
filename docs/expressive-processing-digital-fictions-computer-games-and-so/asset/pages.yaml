- pgno: 429
  md: 'among academics and others to refer to the examples I find most compelling
    as “not games” or “border cases” (as I have discussed elsewhere; see Wardrip-Fruin
    2005). SimCity and other simulations are considered toys, not games. Role-playing
    games, especially of the tabletop and online varieties, are considered borderline
    because they don’t reach a quantifiable end. Experiences like Façade are interactive
    dramas, not games. And so on.


    Perhaps the worst thing about such discussions is that it turns attention to a
    truly boring question: “Is this a game?” This is one of the reasons that I have
    begun to use a different term when I want to be especially clear that I am speaking
    broadly, including many “not games” and “border cases”: playable media. I like
    it because it turns our attention to more interesting questions—such as, “How
    is this played?” Also, while it is broader than the word game, it is more specific
    than terms like interactive. And while we might debate whether a love letter or
    SimCity is more interactive (believe me, some have), we’re unlikely to argue over
    which is more playable. From there we can move on to the interesting work of interpretation.


    # Citizens


    In our society we are surrounded by software—from everyday Google searches to
    the high stakes of Diebold voting machines. We need to be prepared to engage software
    critically, accustomed to interpreting descriptions of processes, able to understand
    common pitfalls, and aware of what observing software’s output reveals and conceals
    about its inner workings. With this in mind, in Expressive Processing I have tried
    to address the politics of processes in a few ways.'
