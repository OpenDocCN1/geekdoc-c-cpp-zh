    # Spatial Logics


    Thinking in terms of operational logics has run through the course of this book—at
    first explicitly developed, and then increasingly taken for granted in later chapters.
    But it is worth making the notation explicit again here.


    Most logics discussed in this book have been considered in terms of what they
    simulate. Some of the simulations are tellingly odd, as with Eliza’s use of a
    textual-transformation logic to simulate conversational responses and Tale-Spin’s
    use of a planbox-based planning logic to simulate all the behavior of anthropomorphized
    animals.


    Most computer games rely on a different type of simulation: that of space. In
    fact, a common set of spatial logics is central to the operation of many games.
    Consider the early, iconic game Pong. In this game, each player controls a paddle,
    one on each side of the screen. The top and bottom of the screen are walls. The'
