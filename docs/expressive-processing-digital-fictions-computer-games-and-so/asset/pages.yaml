- pgno: 361
  md: '# Chapter 9 Playable Language and Nonsimulative Processes


    # Opaque Processes


    If the thinking for this book has an origin point, I would track it back to my
    senior year of high school. I was working on my biggest programming project to
    date: a poetry generator written in Turbo Pascal, which I moved between school
    and home computers on a 5¼-inch floppy disk. Its main operational logic was simple,
    but pleasing to me.


    I had defined certain words as key connection points in sentences—words as simple
    as “he,” “she,” and “it.” I had already typed in files of text for the program
    to employ, with certain indirect connections in their phrasings—such as a description
    of a whirling witch (from Robert Coover’s retelling of Hansel and Gretel) and
    a description of orbiting planetary bodies (from the novel of 2001: A Space Odyssey).
    The program dove into a random point in a body of text, initially selecting the
    beginning of a sentence. It would read until it encountered one of my specially
    selected words and then it might depart, choosing a random point in another body
    of text and searching until it encountered the same word. Then it would start
    reading again, until it encountered either another of my words (in which case
    it could move to another file again, seeking that word) or the end of a sentence.
    The connection words made parts of sentences like Lego bricks, able to be recombined
    at their connection points, and I felt I’d chosen a set of texts with complementary
    colors and shapes.


    Beyond that, the program also had procedures'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'dedicated to creating poetry-like formatting and so on, but the heart of it
    was the sentence-building process. I''m afraid it produced poems that (at best)
    flitted along the boundary of coherence and pretentious nonsense, as adolescent
    poetry of a certain type tends to do. A friend successfully passed a couple off
    as her own work, as a sort of unscientific experiment, before she revealed the
    hoax to her teachers. But the poems weren''t really the point.


    Personally, I was fascinated with building the system at first and then with a
    kind of “looking through” the surface output to see the construction process at
    work, especially when it produced sentences and phrases that were evocative and
    surprising. I was also frustrated that the results were—for readers outside my
    little circle of initiates—probably no better than the output of a process I would
    have considered much less pleasing. In this, though I didn’t know it, I was actually
    experiencing an adolescent version of something with a long history in the arts.
    While a small circle of experimental writers, artists, or composers (or a larger
    circle that includes some interested audience members who learn about the context
    of the work) may understand the clever structures that help produce process-driven
    work and the reasons those structures are employed, in general the audience only
    experiences the output. Given this, it should be no surprise that such work is
    often rejected as opaque (potentially senseless) or uninteresting (bad). People
    like to be in on the joke—and they judge work by the parts they perceive, not
    what is hidden—yet the work itself frequently provides no inroad.


    In my late teens I couldn’t see any way around the opacity problem. But I also
    felt certain that I wanted to explore the possibilities of computers, and do so
    as a writer.'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'So for most of college I shied away from process-driven work, instead using
    computers to do things like create short fictions as text-and-image collages (using
    snappy new programs like Aldus PageMaker). At the same time, I was also taking
    computer science classes, learning more about the construction and power of computational
    processes. Yet I couldn''t see a way to bring the two together.


    In the terms of this book, what I experienced with my poetry generator was a small
    version of the Tale-Spin effect. There wasn''t much of a model at work, but it
    was still more interesting than it seemed from the output. What I was missing,
    of course, was the concept of the SimCity effect. I was missing that playing with
    language might not only be fun for an author, or an interesting thing to design
    into a system, but also an engaging experience for an audience that (if it bootstrapped
    from useful assumptions) could help them understand something of the processes
    at work in the system.


    Even if the processes of my high school poetry generator had been immediately
    visible on the surface, audience members certainly would have understood something
    quite different from most of the processes described in this book. My sentence-assembly
    process wasn''t an attempt to simulate anything. It didn''t attempt to determine
    the events of a fictional world—as with most of the story-generation systems I
    have discussed—or even do a more poetic version of simulation (e.g., of a string
    of themes moving through a simulated author''s psyche). What it did wasn''t as
    interesting as either of these possibilities, but it did represent another direction
    for the combination of writing and process. In this it connected with another
    tradition that I didn''t yet know about: Tristan Tzara''s poetic'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'cut-up, John Cage''s mesostics, and digital poets such as Charles O. Hartman
    and John Cayley. As I moved further with this work I found myself trying to think
    through the role of process in digital fictions for which the sequence of events
    is not variable—when process is not used for the purposes of event simulation.


    In this chapter, then, I try to draw some lessons from my own creative work that
    preceded this book as well as the work of those who inspired me. I consider the
    possibilities of play with language, “textual instruments,” and playable media
    more generally. I also consider what role process may have in digital fictions
    beyond simulation.


    # Legible Data


    After college, when I was a visiting artist at New York University in 1994–1995,
    I found a new interest in combining writing and computation—seeking ways to write
    fiction specific to the context of the emerging phenomenon of the World Wide Web.
    I created a “network fiction” called The Book of Endings, designed so that readers
    could drop in at any page, stop at any page, and follow connections to and from
    the larger Web. (I was quite pleased to be written up in “What’s New at NCSA Mosaic.”)
    I later became a research scientist at the same lab. Shortly after starting work,
    I began collaborating with Michael Crumpton, Chris Spain, and Kirstin Allio to
    create a complex network of fictions embedded in a body-shaped collage of images
    from Gray’s Anatomy called Gray Matters (Wardrip-Fruin, Crumpton, Spain, et al.
    1995–1997) that could be explored using the lab’s newly developed zooming user
    interface.


    When I finally returned to process-oriented work, in'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'early 1998, my first major project focused on the potential of employing more
    legible data. I had been able to see what was going on in my high school poetry
    generator, in part, because I knew the contents of its text files. This helped
    me identify the connection points between the parts of sentences drawn from different
    contexts, making it possible to glimpse a process-defined pattern through the
    text of any given poem. Broadening this experience to the audience was one of
    the strategies of my next major project: The Impermanence Agent (Wardrip-Fruin,
    Chapman, Moss, et al. 1998–2002).


    # The Impermanence Agent


    The Agent project began as a discussion with Brion Moss over a Vietnamese dinner
    in San Francisco, and we soon added Adam Chapman and Duane Whitehurst as collaborators.
    We created something specific to that technohistorical moment, as the Web went
    through its first years of broad public awareness in the United States. At the
    time, web sites like Hotwired''s Newsbot, the Mining Company (later renamed About.com),
    and Ask Jeeves used “agent” metaphors to describe their services. These anthropomorphized
    web sites were presented as solutions to the emerging Web’s supposed problems,
    especially a potentially overwhelming flood of information without the gatekeeping
    or permanence of large-scale commercial publishing.


    Instead of a web site, we created something much more engaged with our audience’s
    ongoing experience across multiple sites: a set of processes that were closer
    to the computer science conception of an agent. The Impermanence Agent monitored
    all browsing for its audience members,'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'routing their traffic through its proxy. But rather than try to steer people
    toward specific sites and away from the Web’s troubles, the agent used the experience
    of browsing to provide an opportunity to reflect on the supposed problems of impermanence.
    It did this in three ways.


    First, it would alter web pages as they passed through its proxy server, changing
    and inserting elements. It was common, say, for the Agent to “decay” advertising
    images (using the scriptable ImageMagick tool, running on the server). This would
    make illegible and sometimes aesthetically interesting images out of what most
    in our audience saw as the junk mail equivalent for the emerging commercial Web.


