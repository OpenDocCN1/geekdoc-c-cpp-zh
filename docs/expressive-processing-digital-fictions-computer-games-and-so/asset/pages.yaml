    simple behavior of sand demons, who attack on sight and never retreat, as found
    in *PoP*.


    The end result, for *PoP*, is an experience elegantly designed to compensate for
    the crippling limitations of the processes used to represent story and character
    in today''s computer games. And this opens up the next question.


