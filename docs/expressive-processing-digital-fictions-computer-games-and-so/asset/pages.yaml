  md: 'dissertation was positioned as a feasibility study for a particular version
    of one of the “grand ideas” that motivated the lab’s work under the leadership
    of computer pioneer Alan Kay. Writ large, the idea is of a fantasy amplifier.
    Laurel’s more focused version was cast as a system for first-person interaction
    (as a “user-character”) with system characters and a world model, both under the
    control of a “playwright” expert system. In Laurel’s dissertation she writes:
    “An ‘interactive drama,’ then, is a first-person experience within a fantasy world,
    in which the user may create, enact, and observe a character whose choices and
    actions affect the course of events just as they might in a play” (1986, 7).


    Though the screenwriters of Star Trek: The Next Generation would later provide
    vivid dramatizations of interaction with such a system—in the form of the “holodeck”—the
    Oz Project experiment is famous because it offers some potential insight into
    what it might be like to experience unscripted interaction with such a system.
    The experiment’s setting was far from the lush renderings of the holodeck, taking
    place in a studio theater, with boxes, chairs, and a table as the only set. These
    were meant to suggest a bus station, which was populated by three characters,
    each played by trained actors wearing wireless headphones: an unhelpful clerk,
    a nearly blind passenger, and a larcenous young man (described as a “punk”). The
    headphones allowed an offstage director, assisted by a “plot graph” of possible
    events, to give directions to the actors in order to maintain the overall flow
    of the drama.


    In each run of the experiment, an interactor was given the instruction to buy
    a bus ticket to attend a relative’s'
