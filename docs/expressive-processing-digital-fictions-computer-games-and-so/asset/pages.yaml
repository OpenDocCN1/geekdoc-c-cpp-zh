- pgno: 170
  md: 'traversal functions, which are present for any work, and each of which can
    have a number of values. These functions and values range from the specific (e.g.,
    whether the work includes explicit links) to the broad (e.g., whether the audience
    is somehow involved in selecting or creating surface texts).


    Cybertext has influenced thinking about digital literature in a number of positive
    ways. Most important, it has made it commonplace to consider such works in terms
    of their mechanisms. In addition, because Aarseth''s traversal functions are crafted
    so as to be applicable to both digital and nondigital works, Cybertext has encouraged
    comparisons that reach back toward the history of process-oriented literary works
    (including many works created or researched by the Oulipo, a group of writers
    and mathematicians whose membership includes Raymond Queneau, George Perec, and
    Italo Calvino). With the breadth of possibilities taken by the traversal function
    model, Cybertext also has encouraged attention to areas of digital literature
    other than those most widely discussed (especially those with innovative processes)
    and presented something of a productive challenge to authors of digital literature
    (given that only a small fraction of the possible types of work described by the
    model have yet been created). Finally, Aarseth''s outline of the traversal function
    model, and Cybertext as a whole, considers things most literary scholars were
    at that time content to ignore: computer games. Besides rather obviously literary
    games, such as Infocom''s interactive fiction Deadline, Aarseth also went so far
    as to consider largely text-free games, such as Psygnosis''s animated puzzle-solving
    game Lemmings. Altogether, the result of Cybertext''s influence has been to help
