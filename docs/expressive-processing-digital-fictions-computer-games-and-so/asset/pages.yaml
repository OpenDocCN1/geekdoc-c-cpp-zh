  md: '# Chapter 5

    The Tale-Spin Effect


    # The “Metanovel”


    In fall 1974, James Meehan was a graduate student at Yale University. He had an
    idea in mind for his dissertation topic, but didn’t know how to pursue it. The
    topic had been suggested to him by Alan Perlis—one of the most famous figures
    in U.S. computer science, who had been named chair of Yale’s department a few
    years before—on the first day they met. But Perlis didn’t know how to move forward
    with the idea, either. In the preface to his dissertation, Meehan describes the
    idea this way:


    A metanovel is a computer program that tells stories that only a computer could
    tell, stories of such complexity of detail that only a computer could handle,
    stories with more flexibility—even reversibility—of events and characters than
    a human could manage. A metanovel time-sharing system tells a story to many people
    at once, no two of whom read the same thing, because they have each expressed
    different interests in the events and characters they want to hear about, and
    because they may each desire a different style of storytelling. And yet, among
    all these readers, there is but one story—the Metanovel itself—and each reader
    is only following those threads of the story that interest him. (1976, ii)


    Meehan’s dissertation didn’t set out to create a metanovel but rather to make
    progress toward the possibility. As he notes, “If I’ve been successful, we’re
    a little closer than we were.” In the decades since, his work has become a landmark—the
    first project cited in nearly every discussion of story generation.'
