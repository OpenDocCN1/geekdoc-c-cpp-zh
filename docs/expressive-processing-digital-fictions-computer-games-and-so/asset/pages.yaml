    # Authoring Universe


    It is precisely the elements that make Universe an important early model of pursuing
    story generation from an authorial perspective that also open it up to questions
    as to its significance. The system is explicitly limited to combining and sequencing
    hand-authored story data, rather than attempting to somehow generate new data.
    This means that important human knowledge about stories can be encoded into the
    data. It provides a role for authors and a route to shaping the audience experience.
    But the same can be said of a Choose Your Own Adventure book, each of which is
    structured as a set of pathways through plot fragments.


    One difference, of course, is that a Choose Your Own Adventure book provides even
    greater opportunities for encoding authorial knowledge—down to the level of language,
    not just the comparatively abstract level of character stereotypes and plot fragments.
    But the more'
