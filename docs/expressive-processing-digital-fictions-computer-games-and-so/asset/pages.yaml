- pgno: 411
  md: 'to interpret this, based on the current context, as one of a set number of
    discourse acts, which alter the state of the underlying system in particular ways.
    This opens up opportunities for a wide variety of player performance, but it also
    results in two types of failures. First, the system can fail to appropriately
    map player utterances to discourse acts. Second, the system may not be able to
    offer any meaningful response to even accurately recognized utterances, with results
    that are as unsatisfying as those from recognition failure. Crawford was determined
    to avoid failures of both sorts.


    His alternative, Deikto, is a simplified language, with sentences built by players
    as their way of making moves in the game. Building such sentences creates a much
    larger possibility space for expression than what is found in standard games,
    even if the space of what can be said (made to appear on-screen) is smaller than
    that experienced when playing Façade or chatting with Eliza/Doctor. More important
    for Crawford, the options presented to a player building a sentence are those
    that have meaning in terms of the underlying system. This prevents unsatisfying
    failures and also provides a way for authors to guide players toward the actions
    that will produce meaningful system responses—in a much more subtle way than the
    techniques used in most games (e.g., graphical highlighting of particular objects
    or hints embedded in quest journal descriptions).


    The original design of Deikto was diagrammatic, with lines representing connections
    between major elements and each utterance capable of expanding into a complex
    branching structure. This could produce sentences that were quite difficult to
    read.'
