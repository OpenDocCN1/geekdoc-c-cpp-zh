    # Process Intensity


    In this book''s introduction I presented a diagrammatic sketch of the elements
    we should consider when thinking about digital media (figure 1.4). The two internal
    components—data and processes—have since returned to this discussion in many forms,
    with Weizenbaum''s scripts for ELIZA and Abelson''s belief structures for the
    ideology machine as two clear examples of data. But data is not central to all
