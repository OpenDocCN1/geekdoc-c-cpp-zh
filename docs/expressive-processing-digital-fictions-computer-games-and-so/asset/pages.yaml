    # Eliza and the Turing Test


    While Eliza is the first well-known digital character, its roots trace back to
    a highly influential proposal for computer-driven conversation (less than two
    decades earlier) from the father of general-purpose computing: Alan Turing. Writing
    for the philosophy journal Mind, Turing initially proposed to consider the question,
    “Can machines think?” (1950). Finding this question hopelessly ambiguous, however,
    he instead replaced it with a set of questions involving an “imitation game.”


    The human version of this game has three participants: “a man (A), a woman (B),
    and an interrogator (C) who may be of either sex.” During the course of the game
    the interrogator asks questions of A and B, trying to determine which of them
    is a woman. A and B do their best to convince C to see it their way—the woman
    by telling the truth, and the man by “imitation” of a woman. The proposed game
    is played over a teletype, so that nothing physical (the tone of voice or the
    shape of handwriting) can enter into C’s attempt to discern the gender of the
    other players based on their performances.


    Turing then asks, “What will happen when the machine takes the part of A in this
    game?” How will the interrogator’s results compare to when the game is played
    based on gender? These questions are proposed as a closely related replacement
    for the question, “Can machines think?”


    The ideas in Turing’s essay have been widely discussed—the imitation game is now
    commonly called the Turing test—and vigorously debated.1 For my purposes, though,
    the key element of Turing’s game is that it is based purely on surface behavior.
    In part this is no'
