    Critiques of *SimCity* and similar games have tended to focus on the fact that
    players seem to be required to become part of the “somebody” that buys into their
    simulation models. After all, successful play is impossible without coming to
    understand—and act in accordance with—the model. In general, this is tied to a
    wider tendency to accept the veracity of simulation rules and results when, instead,
    they should be questioned. Paul Starr, a professor of sociology and public affairs
