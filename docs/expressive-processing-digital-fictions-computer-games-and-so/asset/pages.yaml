  md: 'many people, I was also left feeling frustrated and angry after many encounters
    with news. Introducing something playful into the experience of the news was one
    of my motivations.


    It might seem that the playfulness of a project like News Reader is purely destructive,
    leaving nothing but incoherence in its wake—something our group may have unintentionally
    suggested by characterizing play with our instruments as a way to perform William
    Burroughs’s injunction to “cut word lines.” Yet I think Jena Osman (2007) gets
    at something crucial when she describes News Reader as a “poetical” response to
    the political and linguistic environment of the United States in the early twenty-first
    century. She compares the project to John Cage’s work with mesostics and reaches
    a revealing conclusion:


    > Both Newsreader and Cage’s mesostics make use of what we now easily recognize
    as forms of datamining. Both show readership (and authorship) to be an act of
    sampling, transforming, altering and physically handling text; the act of reading
    is literally performative.


    But perhaps most importantly, both are functioning on metatextual or metaphorical
    levels, allegorizing our methods of attention, our methods of processing information,
    and the ways those forms of processing mirror (or improve) the forms of life we
    actually live in and with. Rather than the destructive act of cutting word lines
    that the Textual Instruments home page proclaims as its goal, I would argue that
    both Newsreader and Cage’s mesostics actually encourage construction of meaning
    along new lines.


    But as much as I want to make the case that these procedures are two parts of
