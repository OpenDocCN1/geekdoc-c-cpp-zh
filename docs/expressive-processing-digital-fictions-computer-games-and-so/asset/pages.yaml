  md: '# Yale AI


    James Meehan''s Tale-Spin is the only project I discuss in detail that was developed
    at Yale University''s Artificial Intelligence (AI) laboratory. However, the Yale
    AI Project and the worldwide of Roger Schank, its charismatic leader, were central
    to the development of the strand of work that connects a number of my central
    examples. This is especially true of Tale-Spin, Michael Lebowitz''s Universe,
    Scott Turner''s Minstrel, and the ideology model for Michael Mateas et al''s Terminal
    Time.


    In 1987 Stephen Slade published an article looking back on a dozen years of projects
    following Schank''s arrival at Yale. In reviewing the largest body of work, that
    described as “cognitive modeling.” Slade notes how it largely continued in the
    mold set by the Margie system, developed by Schank and his students during his
    time at Stanford University (before Yale). Specifically, Slade notes Margie’s:


    > Task Orientation. An AI program should address a specific, real-world task.
    The program should model something that a person actually does, rather than an
    artificial abstraction of intelligent behavior. Margie’s tasks included reading,
    paraphrase, and translation. ...


    Psychological Process Model. The Margie program was a cognitive simulation. Not
    only did it try to perform tasks that people perform, but it tried to simulate
    the manner in which the human mind works. By comparison, a computer chess program
    which exhaustively searches ahead several moves may be able to play a fine game
    of chess, but it is unrealistic to consider such a program a model of the way
    in which a person plays chess. ...


    Canonical Representation of Knowledge. The heart of the Margie system was the
    conceptual dependency knowledge representation system. CD provided a means of
    representing actions and states in a canonical, language independent fashion.
    A concept represented using the dozen CD primitives might be expressed in any
    number of ways in any number of languages. ... (68)


    All three of these Schank-driven priorities are clearly evident in Tale-Spin,
    as this chapter’s discussion makes clear. They also deeply inform the background
    of the other Yale-related projects I consider, as well as influencing and reflecting
    the broader AI research of the era, especially that which could be termed “scruffy.”
    With these goals in mind, the motivations for certain system-design choices should
    be easier to understand as I discuss them in the pages ahead.'
