    # Deikto: A Language for Interactive Storytelling


    Crawford, whose concept of “process intensity” has been a touchstone for this
    volume, is a towering figure in the field of computer game design. He authored
    one of the first books on the subject (Crawford 1984) and founded the field’s
    most significant conference. But in the 1990s he abandoned the field of computer
    games, instead turning his full attention to the pursuit of interactive storytelling.
    The basis of his current approach is a new language, designed for play.


    This language, Deikto, is meant as a response to the limited number of “verbs”
    presented in most interactive experiences. For example, in many graphical games,
    the only available verbs are “move” (accomplished by the means of navigation)
    and “attack” (carried out using the available weapon, toward whatever is in its
    path). Given that Crawford believes that interactivity is the essence of what
    computation makes possible for media, and that being able to act as a story’s
    protagonist is the fundamental experience that interactive storytelling should
    offer, it was necessary for him to find a way for players to express much more
    complex, nuanced verbs.


    The designers of Façade, as discussed earlier, sought to address a similar problem
    by allowing players to type whatever they please. The Façade system then attempts'
