    In the field of digital media, such losses are unfortunately common. Even for
    the most influential projects, we depend on the authors to retrieve them. Only
    once libraries and museums get serious about the preservation of software systems—rather
    than just the paper that comes with or documents them—will this situation change.
    (In the meantime, Nick Montfort and Ian [2004] have written a pamphlet for the
    Electronic Literature Organization titled Acid-Free Bits offering some things
    that authors can do to make their work more likely to survive.)


    As a result of these disappointments, for some time I believed that we would never
    again learn from Tale-Spin through direct interaction, as we can with Eliza/Doctor.
    But I still held that we could learn important lessons from looking at Tale-Spin''s
