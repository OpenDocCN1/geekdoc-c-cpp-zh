  md: '# DOES THAT HAVE ANYTHING TO DO WITH THE FACT THAT YOUR BOYFRIEND MADE YOU
    COME HERE (Weizenbaum 1966, 37)


    As you might imagine, I was impressed. And I certainly wasn''t the first. Weizenbaum''s
    employers at MIT had seized on Eliza as an accessible demonstration of the potential
    of computing, exciting to those without the specialized knowledge needed to appreciate
    much of the ongoing research. The computer world agreed. In fact, when the first
    demonstrations of the ARPANET (the predecessor of the Internet) were carried out,
    some of the terminals ran Eliza from a remote location (Leonard 1997, 52). Given
    the excitement produced by Eliza astronomer and science popularizer Carl Sagan
    suggested that the future might hold “a network of computer psychotherapeutic
    terminals, something like arrays of large telephone booths” (Weizenbaum 1976,
    5).


    Originally Eliza ran on a computer less powerful than the one in my mobile phone,
    though at the time it was one of the most advanced at MIT. Rather than being hooked
    up to a monitor, keyboard, and mouse—or HAL’s microphone, speaker, and camera—Eliza
    was experienced through something like a typewriter, allowing the computer to
    type to the user and the user to type back. People could type anything they wanted
    to Eliza, and the software would respond in different ways depending on the currently
    active script.


    This last word, “script,” is important. There is nothing magical about Eliza—it
    is simply a bundle of data and processes, and pretty simple processes at that.
    Each time that Eliza runs, it uses a particular script to guide its behavior.
    The example conversation given was created


