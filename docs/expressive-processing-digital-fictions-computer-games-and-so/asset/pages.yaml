- pgno: 80
  md: '# Individual Fictions in Shared Worlds


    The mismatch between a simulated, explorable spatial world and fictional progression
    implemented in inflexible milestones can become even more pronounced in massively
    multiplayer online games. The typical design for such games requires that objects
    be present in the world for all players. This means they can be encountered by
    players who have not yet received quests to give them context—and they must reappear
    to be available for other players even if they have been removed by one particular
    player.


    I experienced these things from the outset of playing *EverQuest II* (Blakley
    et al. 2004). I began in the Queen''s Colony, the new player area for the city
    of Qeynos. I received my initial quest and then went exploring, encountering monsters,
    quest givers, and other players. Often I would kill a number of some type of monster
    (such as a Morak Devourer) in a particular area and then, a few minutes later,
    be given a quest to do exactly what I had just done, with no option to reply that
    I''d already done it.


    This helped prepare me for my experience in the Abandoned Village area. There
    I fought some monsters and found a strange statue. I clicked on the statue, but
    it wouldn''t respond. In a corner of the area I met Sorcerer Oofala, but he had
    nothing to say to me. Only later, after my character died, did I end up back in
    the starting area and talk again to the initial quest giver, Murrar Shar. He sent
    me to Cleric Mara''Vaen, who also had not been interested in talking when I encountered
    her earlier. But this time she had a quest, I completed it, and then she sent
    me to find Oofala (again), who sent me to destroy the strange statues I hadn''t
    been able to get a response from earlier. At this point I could click to destroy
    them, if not interrupted by combat during the work.


    After I destroyed the last of the statues, an enemy called the Dark Blademaster
    appeared. I defeated him, took his shield, and spent a few moments shifting things
    around in my inventory so that I was using the shield. As I did this, the Dark
    Blademaster reappeared! Already wounded, I decided to run back to Oofala, whereupon
    the Blademaster stopped following. He reappeared, of course, so that other players
    on the same server could also complete the quest that Oofala then gave me: to
    defeat the Blademaster. The only way to progress was to go back and fight the
    Blademaster again, this time wearing the shield I''d acquired from the time before
    last I had fought him.'
