    # riverisland


    Cayley’s work often employs a technique he calls “transliteral morphing.” This
    is a letter-by-letter morphing that transitions from one text to another, much
    as graphical morphing moves points in space so as to transition from one image
    to another. In transliteral morphing the in-between letters are determined by
    movement along a loop on which Cayley has arranged Roman characters according
    to their sounds, as he explains:


    If texts are laid out in a regular grid, as a table of letters, one table for
    the source and one table for the target, to morph transliterally from one text
    (one table of letters) to another, is to work out, letter-by-letter, how the source
    letters will become the target ones. Assume your alphabet (including “space” and
    apostrophe, 28 letters in all) is arranged in a special loop where letters considered
    to be similar in sound are clustered together. The aim is to work out the shortest
    distance round the loop (clockwise or anti-clockwise) from each source to each
    target. (2002c)


    Once the movement for each letter is worked out, the text then moves through fourteen
    steps (the largest number that might be necessary for any one letter—movement
    to the opposite side of the twenty-eight-character loop). Some letters go through
    many more transitions than others. Changes are “reluctant” at the beginning of
    the process and then “anxious” for completion at the end—so that both the early
    and final stages are close to readable texts.


    A number of Cayley’s pieces, such as his well-known windsoound (1999), employ
    transliteral morphing in a manner that is performative on the part of the program.
