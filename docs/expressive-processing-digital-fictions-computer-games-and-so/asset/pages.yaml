  md: 'Tale-Spin and Mumble, most of the burden must fall to the processes that create
    the work’s surface. The most interesting elements of the system must be those
    selected for presentation in the output, and the generation system must have enough
    nuance and flexibility to communicate them to the audience. In other words, a
    system like Terminal Time can create an interesting model of an audience-selected
    ideology, combining a number of biases and strategies, but this matters little
    if the audience cannot understand this from the documentary produced.


    A concern along these lines is part of Mateas’s larger project of expressive AI,
    which he describes using the terms “authorial affordance” and “interpretive affordance.”
    The concept of affordance, as applied by Mateas, is one brought into the discussion
    of human-computer interaction by Donald Norman (though it originated with psychologist
    J. J. Gibson). In introducing the term in his book The Psychology of Everyday
    Things, Norman writes: “When used in this sense, the term affordance refers to
    the perceived and actual properties of the thing, primarily those fundamental
    properties that determine just how the thing could possibly be used” (1988, 9).
    Similarly, according to Mateas, the “authorial affordances of an AI architecture
    are the ‘hooks’ that an architecture provides for an artist to inscribe their
    authorial intention in the machine” (2002, 125–126). Interpretive affordances,
    naturally, are the other side of the coin. They are the hooks that the system
    makes available to an audience to aid in the interpretation of the system, its
    actions, and its possibilities.


    Along with these pieces of vocabulary Mateas also offers a poetics: a recommendation
    that authorial and interpretive affordances be considered together and closely'
