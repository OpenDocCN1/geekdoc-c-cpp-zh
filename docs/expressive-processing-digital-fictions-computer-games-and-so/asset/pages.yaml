- pgno: 392
  md: 'For example, n-grams have also been used in assembling language for electronic
    literature, perhaps most extensively by Caley. At least seven of his works employ
    “collocational” word-level digram procedures, including Book Unbound (1995, as
    discussed in Aarseth’s Cybertext). This approach has also been the primary basis
    of textual toys such as the DOS program Babble!, the emacs “Dissociated Press”
    command, Hugh Kenner and Joseph P. O’Rourke’s Travesty, Andrew Plotkin’s chao,
    and Brion Moss’s prate—which have themselves at times been used in the generation
    processes for (nonplayable) literature.


    Both the elit and toys based on n-grams, however, have operated entirely in “batch
    mode.” That is to say, the interactor requests a body of text, and then that text
    is produced—following which the text can be read and another text can be requested,
    but no interaction with the texts (or interaction during generation) is possible.
    Given this limited nature of play with n-gram texts, there is also limited context
    for play—usually a blank text buffer for the program to write text into. After
    I’d seen how audiences interacted with Screen, a conversation with Moss (with
    whom I’d collaborated on The Impermanence Agent) kicked off a consideration of
    n-grams, and we began to imagine possibilities for linguistic play with this model
    that was less batch oriented and took place within a textual context.


    Moss and I approached Turbulence, an organization that supports digital media
    art, and it commissioned us to create two pieces. These pieces would be inspired
    by the idea of textual instruments and operate using the logic of n-grams. After
    a false start with different collaborators, Moss and I connected with document
    researcher David Durand (best known for his work in formulating a number of document'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'markup standards, including XML) and designer Elaine Froehlich (principal of
    Active Surface Design). From there, the project''s conceptualization and execution
    were a team effort, with the initial technical work happening on top of Moss''s
    Java prate, and later development built on top of work done by Durand in Tcl/Tk.


    Two major design decisions were made early on. The first was that rather than
    build an n-gram text into an empty text buffer, play would always begin within
    the context of a precoded document and consist of a progressive alteration of
    that document. This was motivated in part by the fact that although the text produced
    by n-gram algorithms has microstructures that are recognizable from its source
    texts, the larger structures of n-gram texts tend to be similar regardless of
    the starting material. Some have tried to address this by looking at larger structures
    in the source texts statistically, but unless the texts in question have been
    marked up by a human author or editor, this process involves a series of assumptions
    about the text (e.g., that a period marks that end of a sentence, as it does not
    in the case of “e.g.”) that are sometimes inaccurate and on some level aesthetically
    displeasing. These assumptions are displeasing because they depart from the purity
    of the simple n-gram alphabet, which in its basic form would work with starting
    texts in Japanese or Braille characters as easily as Roman alphabet ones. There
    was also another motivation, though. In many n-gram texts, especially those based
    on short chains, part of the pleasure is based on play between coherence and incoherence—and
    we found something more interesting and potentially more meaningful in such borderline
    coherence occurring within the context of traditionally created texts.'
