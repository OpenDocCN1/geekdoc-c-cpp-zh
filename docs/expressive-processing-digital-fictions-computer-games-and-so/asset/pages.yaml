  md: 'succeed in finding episodes to adapt to new circumstances. But the nature of
    this adaptation is, precisely, that it exceeds the bounds of the knowledge already
    available about the microworld. (If the knowledge were already present, it could
    have been accessed by TRAM:Standard-Problem-Solving, and creativity would not
