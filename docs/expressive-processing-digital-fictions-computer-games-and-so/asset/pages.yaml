  md: 'that both of the previous two event spins occur in the First World and satisfy
    the rhetorical goal of showing that religion is good. The “postscope” test requires
    that the immediately following event also satisfy the rhetorical goal of showing
    that religion is good, but take place somewhere other than the First World. When
