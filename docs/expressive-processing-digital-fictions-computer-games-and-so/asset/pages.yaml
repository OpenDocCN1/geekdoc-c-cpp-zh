  md: 'this design matter very deeply” (DM 2).


    His response was a program of education, enacted through his book, in what we
    might today call “procedural literacy.” He sought to teach people to understand
    how computing works and what its processes make possible. Computer scientists
    such as Alan Kay and Seymour Papert pursued similar goals by developing new programming
    languages, designed to make the authoring of computer processes more accessible
    (especially for children). Nelson’s book, aimed at adults, instead attempted an
    ambitious survey of then-current programming languages, computing hardware, data
    structures, input devices, and more. All of this was couched in an argument that
    the modern computer shouldn’t be thought of as a mathematical device but rather
    as the mathematician and computing pioneer Alan Turing had it, “a single special
    machine” that “can be made to do the work of all” (2004, 383).


    Nelson’s goal, in part, was to encourage readers to grasp hold of the creative
    potential of computing toward their own ends. But just as crucially, the goal
    was to urge readers to rise up against the computing priesthood, to stop accepting
    that there are “ways of doing things that computers now make necessary” (1974,
    8). In the preface to the second edition of _Computer Lib/Dream Machines_, Stuart
    Brand called Nelson “the Tom Paine of the personal computer revolution” (Nelson
    1987). One difference is that the revolutionary program for which Nelson agitated—“Computer
    power to the people! Down with cybercrud!” (1974, 3)—remains largely unrealized,
    though groups of agitators continue to push for it today.


    A form of such agitation is, in fact, part of this book’s program. We live in
    a world in which the politics of


