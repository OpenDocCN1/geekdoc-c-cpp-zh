- pgno: 257
  md: '# Mathematized Betrayal


    Bringsjord and Ferrucci see a need for “mathematizing” literary themes because
    they approach story generation from the neat AI perspective. As they write: “We
    approach story generation through logic; in more specific terms, this means that
    we conceive of story generation as theorem proving” (42). To my knowledge, Bringsjord
    and Ferrucci are the first to create a major story-generation system that primarily
    employs the tools of theorem-proving AI (though some are also put to use in the
    contemporary Terminal Time, as discussed in the next section). Specifically, Brutus
    is built using a logic-programming system called FLEX, which is based on the programming
    language Prolog


    The first step in Brutus’s story-generation procedure is to instantiate a theme.
    As mentioned earlier, the literary theme that is the focus of the Brutus system
    is betrayal. In order to help readers understand the system, Bringsjord and Ferrucci
    provide some “actual FLEX code” that is the mathematized expression of betrayal
    they have authored (box 7.2). This specifies two characters: the Betrayer,


    ```

    Box 7.2. Brutus''s Ideal Representation of Betrayal

    relation betrayal_p

    If Evil is some goal whose plan is an EvilPlan

    and whose agent is a Betrayer

    and Saying is included in the EvilPlan

    and Saying is some say

    and Thwarting is included in the EvilPlan

    and Thwarting is some thwart

    and Betrayeds_Goal is the prevented goal of Thwarting

    and Betrayers_Lie is some support of the Betrayeds Goal

    and Betrayed is some person

    whose goal is the Betrayeds_Goal

    and whose beliefs include the Betrayers_Lie

    (Bringsjord and Ferrucci 2000, 173)

    ```'
