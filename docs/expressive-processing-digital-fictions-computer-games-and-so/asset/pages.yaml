    linear, semicinematic story, with a sense of inevitability artfully fused with
    a context for player struggle. The struggle, specifically consists of innovative
    platforming action and acrobatic combat. For games such as PoP, the question is
    how to make this kind of combination, between audience-controlled gameplay and
    linear story, most productive.


    The typical structure for such combinations, in the computer game industry, is
    simple alternation. The audience is given moments and spaces of play that, when
    completed, yield scripted sequences that tell the story.19 Because this model
    involves so little connection between story and gameplay, game writers are often
    employed only at the end of game production. The game’s play mechanics, spaces,
    and even characters are designed before the writer arrives (Bateman, Boon, Buckley,
    et al. 2003). The writer’s task is to create a set of scripted sequences that
    will tie them together and provide an overall context. The results are frequently
    unsatisfying and can feel, for good reason, quite arbitrary. Mechner’s games—like
    those of other designer/writers such as Tim Schafer (the creator of Grim Fandango
    [1998], Psychonauts [2005], and other well-regarded titles)—instead work to conceive
    the story and gameplay as integrated entities.


    The story of PoP begins with a war of aggression fought for reasons of greed.
