    > Unlike some notions of goals in artificial intelligence, Hap goals have no meaning
    in and of themselves. They are not planned for, and there is no grammar or logic
    in which the system can reason about them. Instead they are given meaning through
    the agent builder''s vision of what they mean, and the behaviors written to express
