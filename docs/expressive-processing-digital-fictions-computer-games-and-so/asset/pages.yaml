    Beats are also key to Façade''s approach to the incredibly difficult problem of
    natural-language understanding. No computer system can actually “understand” arbitrary
    human language—or even, less ambitiously, consistently map human language statements
    to a logical model. What Façade does instead is attempt to map each player statement
    to a limited set of “discourse acts,” such as agreement,.


    Finally, all of Trip and Grace''s joint behavior, in turn, is mixed with individual
    behaviors. Trip may go on fixing drinks over the boundaries of several beats and
    mix-ins. Consuming drinks, playing with a magic eight ball, and other individual
    behaviors take place in parallel with joint beats and mix-ins. Each JDB is written
    so that it can be performed when the characters are in different physical locations
    in the room, carrying out other individual behaviors, and so forth. There is a
    profound result that arises from these individual behaviors, the reactions of
    handlers, and the prevalence of mix-ins. While character behavior in Façade is
    largely driven by a procedural script, it doesn’t feel as though it takes place
    in a series of scripted segments but rather as a continuity.'
