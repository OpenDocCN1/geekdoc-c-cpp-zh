    the baby, rather than returning to a neutral state (which involves putting down
    the very same baby), the planbox would check memory, see that the precondition
    was already met, and move on to the next step.


    Tale-Spin was far from alone in employing planning based on actions, with preconditions
    checked against a current memory, intended to move the world from the current
    state to a goal state. This was already a widely practiced AI technique in the
    1970s—one that scruffy AI took in a particular direction, rather than an approach
    initiated by Schank and Abelson. An earlier form, developed at the Stanford Research
    Institute (SRI), formed the basis for Orkin''s response to the character behavior
