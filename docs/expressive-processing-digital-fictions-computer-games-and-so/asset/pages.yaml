  md: '+   3. The most famously Lovercraft-inspired game is Call of Cthulhu (Petersen
    1981), while Over the Edge (Tweet 1992) is a game inspired by both Burroughs and
    Philip K. Dick. At the same time, as Jose Zagal reminded me in the blog-based
    peer ...


    +   4. Though many massively multiplayer online play groups, including some in
    which I have participated, include face-to-face interaction between some players.
    And there are a variety of other hybrid forms that combine elements of in-person
    and ...


    Notes continued at end of this chapter.


    theater).3 Most retain a role for one of the players as the “game master.” This
    player undertakes the advance planning for the current campaign, plays the roles
    of the non-player characters (NPCs), shapes events to ensure the type of story
    desired, and executes most of the rule processes. This leaves other players free
    to concentrate on the defining features of RPGs: playing their characters and
    collaboratively developing the fiction.


    Of course, with computer RPGs the situation is somewhat different. Many computer
    RPGs are single-player experiences. In these cases, if there is a group of characters
    played in the game, the same player controls them all. Or if multiple players
    work together (as in massively multiplayer online RPGs such as World of Warcraft),
    the game is structured for players to communicate over a network rather than face-to-face.4
    Crucially, no player has the part of the game master. The execution of the rules,
    presentation of the fictional world, portrayal of the NPCs, and shaping of the
    story is left to computational processes and data.


    When brought to the computer, then, the core experience of story and character
    in RPGs shifts. In tabletop and live-action RPGs, story and character are experienced
    primarily through collaborative human performance. But for computer RPGs, especially
    single-player ones, story and character become media experiences—made interactive
    via computational processes. In particular, two operational logics have come to
    prominence in the story and NPC presentations of computer RPGs. These are quest
    flags and dialogue trees.'
