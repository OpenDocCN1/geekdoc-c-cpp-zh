    Instead of Strips-style reasoning, in a manner similar to the planboxes of Tale-Spin,
    each goal has an author-defined set of possible behaviors that may satisfy it.
    These behaviors may be made up of sequential steps or steps that can be pursued
    in any order (including in parallel). For example, the steps in a “wink” behavior
    are sequential—an exaggerated close in the eye and then a pause, followed by opening
    the eye. But the steps in a “gather what I need before leaving the house” behavior
    can be ordered depending on circumstances—the car keys can be picked up before
