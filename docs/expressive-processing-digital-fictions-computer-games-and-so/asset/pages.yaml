    The kind of replanning done by F.E.A.R.—when actions fail, when cover is invalidated,
    and so on—is important for how the system works as media. Replanning happens after
    events that the audience can perceive, and this motivates the character’s change
    in behavior. Plan execution has access to the same working memory that plan formulation
    uses for checking preconditions, so if a plan is invalidated, characters don’t
    keep doing further stages of a compound action that the planner would reject.
    Recording reasons for plan failure, rather than the simple fact of failure, prevents
    the system from continually switching between plans that should be the best (according
    to what the planner knows) but will fail in execution. F.E.A.R. can do this—and
    do it in real time, even with most of the available computational power claimed
    by game graphics—precisely because its game world is a microworld. The approach
    wouldn’t work in our everyday world of complexity and contingency. But of course,
    all games are authored microworlds.


