  md: 'characters, then it becomes a useful touchstone for views such as Murray’s.
    If we choose to emphasize its complicated strangeness, its computational specificity,
    then it becomes an important early example for views such as Aarseth’s. Either
    way, a close examination of the system’s operations reveals something much more
    intriguing than either author assumed—making a clear case for the necessity of
    developing an approach to reading what processes express. As readers may recall,
    this is my second meaning for expressive processing. With the example of Tale-Spin
    in mind, I will now expand this sense of the term, which itself has two elements.


    First, it encompasses the fact that the internal processes of digital media are
    designed artifacts, like buildings, transportation systems, or music players.
    As with other designed mechanisms, processes can be seen in terms of their efficiency,
    aesthetics, points of failure, or (lack of) suitability for particular purposes.
    Their design can be typical, or unusual, for their era and context. The parts
    and their arrangement may express kinship with, as well as points of divergence
    from, design movements and schools of thought. They can be progressively redesigned,
    repurposed, or used as the foundation for new systems—by their original designers
    or others—all while retaining traces and characteristics from prior uses. In fact,
    the traces may remain even when direct reuse is not possible. Meehan was unable,
    due to system limitations, to directly reuse Goldman’s Babel. But the traces of
    such work are clearly visible in his design of Mumble.


    Second, unlike many other designed mechanisms, the processes of digital media
    operate both on and in terms of humanly meaningful elements and structures. This
    is'
