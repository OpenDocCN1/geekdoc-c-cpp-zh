  md: '# Agency in Façade


    Finally, there is also an element of Façade that communicates clearly to players,
    and when natural language understanding is successful, operates much as they expect.
    This is the combination of drama management, beat goals, joint behaviors, handlers,
    and mix-ins—which I have called Façade''s procedural script. This combination
    creates a performed story that progresses in a way the audience understands, during
    which players can direct conversation toward a range of topics, and which can
    take a variety of shapes that culminate in an appropriate ending.


    This experience is not simply that of the SimCity effect, because it is not designed
    to foreground the nature of Façade as a system. Rather, as Mateas and Stern indicate,
    their goal is an experience in interactive media commonly termed “agency” or “intention.”
    Façade''s authors point to Janet Murray''s formulation of the concept, which has
    been particularly influential in academic circles: “Agency is the satisfying power
    to take meaningful action and see the results of our decisions and choices” (1997,
    126). In the field of game design the idea is often associated with Doug Church,
    who writes of “allowing and encouraging players to do things intentionally” (1999)—understanding
    the game world well enough to make and execute a plan of action, then seeing a
    clear reaction from the game world. At the same time, it is also worth noting
    that a version of this concept can be seen from the earliest full-length writing
