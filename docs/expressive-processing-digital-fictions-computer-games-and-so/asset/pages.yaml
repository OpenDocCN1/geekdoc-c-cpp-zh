  md: '2. During the review of this book''s draft manuscript on Grand Text Auto, Dennis
    G. Jerz offered a telling series of observations—including that the graphic user
    interface (GUI) of SimCity is already a much more restricted interaction channel...
    Notes continued at end of this chapter.


    It is at this point that the two effects diverge. The *Eliza* effect breaks down.
    The initial impression encouraged at the work''s surface is revealed as utterly
    removed from the internal system model. As this happens, the system''s processes
    and data cease to operate as a representation of the ideas first presented on
    the surface. *Eliza* / *Doctor* stops seeming like a simulated therapist and instead
    seems like a textual transformation device. The only alternative is to severely
    limit interaction with the system—as in Garfinkel''s yes/no therapy experiment—so
    that its underlying shape is not revealed.


    The *SimCity* effect leads in a different direction. The underlying model in *SimCity*
    is designed as a representation of a dynamic city—inspired in part by Jay Forrester''s
    work on urban dynamics (further discussed in the next section). While initial
    engagement with *SimCity* is based on the *Eliza* effect, the elements presented
    on the surface have analogies within the internal processes and data. Successful
    play requires understanding how initial expectation differs from system operation,
    incrementally building a model of the system''s internal processes based on experimentation.
    Most players don''t end up with a sufficiently detailed understanding to allow
    them to reimplement the *SimCity* system, but to get far with the game they must
    develop a working understanding of the underlying model of city operations. Wright''s
    groundbreaking design has made it possible for many players to not only develop
    this understanding of *SimCity*''s software processes but also enjoy the learning
    involved. This success has also opened his work to some critique.'
