- pgno: 301
  md: 'In addition, the system required information about how to translate this logical
    information into text that would have the appropriate nuance (e.g., “MTRANS indexes
    to a great many verbs and phrases, among which are ‘give permission’, ‘allow’,
    ‘announce’, and ‘say’ ” [703]). This was a nontrivial authoring effort, in a form
    quite removed from traditional writing, for generating variations on a story only
    one paragraph in length.


    But the variations are quite impressive. More than a hundred are possible, each
    seeking to express a different model of the pragmatic situation—such as whether
    the speaker agrees or disagrees with the audience, is trying to slant the account
    in favor of one group or another, is communicating in haste or deliberately, and
    so on. These can influence what topics are included in the story, how the discussion
    of the topics is organized, and what phrases and words are used. For example,
    if the situation is one in which the speaker wishes to decrease interpersonal
    distance with the audience, choosing an appropriate level of informality is important.
    Hovy provides this instance of using clause position, verb formality, ellipsis,
    adjective inclusion, and conjunction to communicate the same portions of the story
    in a “highfalutin” and “colloquial” manner:


    In early April a shantytown—named Winnie Mandela City—was erected by several students
    on Beinecke Plaza, so that Yale University would divest from companies doing business
    in South Africa.


    Students put a shantytown, Winnie Mandela City, up on Beinecke Plaza in early
