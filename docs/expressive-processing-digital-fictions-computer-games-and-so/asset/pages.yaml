    did.16


    Which is to say that problems such as these spring from a poor fit between the
    simple, brittle structures of quest flags and dialogue trees, and the ambitious,
    flexible game design they are being used to support. Those of us familiar with
    the logic of milestone-based progression—from business plans, grant proposals,
    employee evaluations, and so on—know that any detailed set of milestones will
    generally meet one of two possible fates. First, as the situation evolves, it
    can become clear that the milestones will be revised for one or more reasons:
    the steps may not be what one originally thought, may not happen in the order
    originally thought, or might need to be divided up differently. Second, an alternative
    fate is that the milestones themselves become a fetish, irrationally driving behavior
    in a situation that they clearly no longer reflect. Even in a world simulated
    as partially as that of KatOR, precreated milestones still become an uneasy fit
    with the evolving situation. Unfortunately, only the second of these two fates
    is possible for KatOR’s milestones, which cannot be revised by the system.


    Given this situation, the prospects for fiction in games may seem grim (perhaps
    particularly for multiplayer online games, see sidebar: Individual Fictions in
    Shared Worlds).'
