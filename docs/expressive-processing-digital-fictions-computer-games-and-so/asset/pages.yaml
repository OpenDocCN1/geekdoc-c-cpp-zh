  img_proc: true
- pgno: 201
  md: '“transform-recall-adapt methods” (TRAMs). TRAMs are a way of finding cases
    in the system memory that are related to the current situation and adapting elements
    of these previous cases for new uses. In this way, stories can be generated that
    illustrate a particular theme without reusing previous stories verbatim. The approach
    is based on transforming the problem repeatedly, in carefully crafted ways, rather
    than doing an exhaustive search through all the possible solutions.


    One TRAM example that Turner provides shows Minsrel trying to instantiate a scene
    of a knight committing suicide. Minsrel''s first TRAM is always TRAM:Standard-Problem-Solving,
    which attempts to use a solution that already exists in memory. This TRAM can
    fail in two ways. First, it is possible that there is no case in memory that matches.
    Second, it is possible that the matching cases in memory have already been used
    twice, thereby resulting in them being assessed as “boring” by the system—so a
    new solution must be found. For either type of failure, the next step is to transform
    the problem and look for a case matching the transformed problem.


    In Turner''s example, Minsrel''s memory only contains the schemata for two episodes.
    In the first a knight fights a troll with his sword, killing the troll and being
    injured in the process. In the second a princess drinks a potion and makes herself
    ill. Neither of these is a direct match for suicide, so Minsrel must transform
    the problem.


    One possible transformation is TRAM:Generalize-Constraint. This can be used to
    relax one of the constraints in a schema. In this case, it is used to relax the
    requirement of a knight killing himself. This is the transform step in a TRAM,
    and it is followed by the recall step. Here the'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'system searches for a scene of a knight killing anything— not just himself—and
    succeeds in finding the scene of the knight killing a troll. Since this was successful,
    the next step is to attempt to adapt this solution to the new situation, by reinstating
    the constraint that was relaxed. The result is then assessed and deemed appropriate,
    so Minstrel determines that the knight can kill himself with his sword. Here we
    can see Minstrel—on some level—producing something that wasn''t already present
    in the system''s data. This is the key to how Minstrel''s model of story generation
    not only goes beyond shuffling prewritten elements but also goes beyond simulation
    via previously encoded actions, as found in Tale-Spin and F.E.A.R.


    Further, the example above is only the simplest use of Minstrel''s TRAMs. The
    system finds other methods of suicide by a more complex route. For instance, there
    is also TRAM:Similar-Outcomes-Partial-Change. This TRAM “recognizes that being
    killed is similar to being injured” (Turner 1994, 49) and transforms the schema
    to one in which a knight purposefully injures himself. This, however, returns
    no matching cases. The knight fighting the troll is not retrieved, because the
    injury was accidental. The princess drinking the potion was not retrieved, because
    the actor was not a knight. But this does not cause Minstrel to simply give up
    on the direction proposed by TRAM:Similar-Outcomes-Partial-Change. Instead the
    TRAM process begins again, recursively, using the already transformed problem
    and applying a different TRAM to it. In this next stage, by applying TRAM:Generalize-Constraint
    to the actor, it is able to find the princess drinking a potion to injure herself.
    It adapts by reapplying the generalized constraint to create'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'a schema for a knight drinking a potion to injure himself and then returns
    to the original TRAM. This adapts by changing from injuring to killing, and the
    result is an event of a knight drinking a potion to kill himself. This is assessed
    as successful, added to the story, and added to memory so that it can become a
    case retrieved by other TRAM processes.


    And that''s not all—the TRAM:Similar-Outcomes-Partial-Change also helps generate
    another plan for suicide when used as a second-level TRAM. In this case the first-level
    transformation is TRAM:Intention-Switch, which changes the schema from a knight
    purposefully killing himself to accidentally killing himself. When this, at the
    next level, is transformed from death to injury, the fight with the troll is found
    in memory. Minstrel then produces a story of a knight going into battle in order
    to die. With three different suicide methods found for the knight, Turner''s example
    comes to an end as well.


    # Minstrel''s Trouble


    Through various series of small, recursive transformations such as those outlined
    above, Minstrel is able to produce story events significantly different from any
    in its memory. While it can only elaborate as many themes as it has hard-coded
    PATs, with a large enough schema library it could presumably fill out the structures
    of those themes with a wide variety of events, creating many different stories.
    But enabling a wide variety of storytelling is not actually Turner''s goal. He
    writes “Minstrel begins with a small amount of knowledge about the King Arthur
    domain, as if it had read one or two short stories about King Arthur. Using this
    knowledge, Minstrel is able to tell more than ten'
