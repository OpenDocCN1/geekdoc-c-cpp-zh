  md: '8. As Dominic Arsenault pointed out during the blog-based peer review of this
    book, dialogue trees can provide a variety of interaction experiences for similar
    underlying structures. Games such as *KotOR* present the player with a selection
    of possible ... Notes continued at end of this chapter...


    of such an exchange (or even come close to an ability to understand free-form
    human language) so computer RPGs has been forced to take a different approach.
    As with the quest flag approach to story, the computer RPG approach to dialogue
    is simple both in terms of software implementation and audience comprehension.
    This approach is the dialogue tree.


    Like the *Eliza* system, the dialogue tree model of conversation is founded on
    turn-taking. But what happens at each turn is utterly different. During the audience''s
    turn, dialogue trees do not allow for the free-form textual input of *Eliza*.
    Instead, when interacting with a dialogue tree, the player is generally presented
    with a small number of options (usually ranging from one to five) for what the
    player''s character can say. After a selection is made, the system performs the
    response of the NPC(s) to which the player''s character is speaking. Conversation
    continues in this manner until the player selects a conversation-ending option
    (which may or may not be explicitly presented as such).


    Rather than NPC responses being generated by applying rules to the audience''s
    last statement, as with *Eliza*, each NPC response is selected by traversing a
    hierarchically organized data structure. This is what gives the dialogue tree
    its name.


    Figure 3.2, an image of Aurora''s Conversation Editor tool for authoring dialogue
    trees, makes this more specific. It looks quite similar at first glance to the
    tool for quest journal entries. One difference, however, is that while the journal
    contained quest stages in an order likely to be encountered by players, the ordering
    of the text in the conversation editor seems rather odd:'
