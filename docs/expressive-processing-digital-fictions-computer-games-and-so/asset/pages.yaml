  md: 'of the mark they place in this largely unexplored landscape. Playful interaction
    through textual logics is one possible avenue for future fiction, poetry, and
    drama that employs computational processes to enable new audience experiences.
    But again, this is only one possible direction.


    Part of what has surprised me in the years since *The Impermanence Agent* is that
    I have seen so little work along similar lines. The *Agent* is a fiction that
    uses processes not to model the development of its events but rather some aspect
    of its theme, which the processes then enact during the audience experience. As
    with *Regime Change* and *News Reader*, it is only a first, crude attempt. Yet
    it sets another marker in the ground of the vast possibility space of nonsimulative,
    process-intensive literary work.


    As this chapter outlines, I think one of the major limitations of my projects
    in these instances is that they do not go far enough to make their processes legible.
    This is why I hope that others exploring this space will not turn away from games—as
    those with literary interests unfortunately often do with popular media—but rather
    closely investigate the possibilities they present for play. Nonsimulative literary
    possibilities will offer meaningful new experiences to their audiences only if
    they are understood on some level, and play is clearly one of the most powerful
    approaches for making processes legible, along with being a great pleasure for
    other reasons.


    I am certainly not the only one involved in this exploration. A number of noteworthy
    projects are developing new modes of textual play. Three I have found particularly
