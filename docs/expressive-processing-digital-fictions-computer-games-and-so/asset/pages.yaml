    # Façade''s Procedural Script


    Façade’s characters perform together on what Stern and Mateas call “joint dialogue
    behaviors” (JDBs). Each beat is a structured collection of ten to one hundred
    JDBs. Each JDB, in turn, is a set of one to five lines of dialogue between Grace
    and Trip, consisting not simply of recordings of the words but also fifty to two
    hundred lines of ABL code. This code supports the various ways that the JDB can
    be performed as well as the ways that JDB alters Façade’s internal counters for
    the affinity game, character self-realization, overall tension, or other elements
    of story and character state. Part of the reason that beats contain so many JDBs
    is related to this. Most JDBs are actually authored with three to five alternate
    versions, with multiple takes of the recordings for each, so that an appropriate
    one can be selected based on current measures of affinity and tension (and repetitions
    between playthroughs can be lessened).


    Another reason that beats contain a large number of JDBs is in order to support
    special metalevel controls (called “handlers”) that provide appropriate reactions
    to player statements and actions in the context of the beat. Each beat has a default
    way it will play out in the absence of interaction, but Mateas and Stern are hoping
    for another outcome—given that the point of Façade is to pursue interactive drama.


    So, for example, the JDBs in the beat about fixing drinks include a basic sequence.
    This sequence is expressed


