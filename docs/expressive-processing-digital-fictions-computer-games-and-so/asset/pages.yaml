  img_proc: true
- pgno: 430
  md: '# Conclusion


    A small part of my discussion has focused on explicitly political systems. Most
    notably, I looked at a system created by Robert Abelson and his students designed
    as a simulation of political ideology. While the system processes were intended
    to be ideologically neutral, with each ideology only represented as data, a close
    examination revealed specific forms of ideological reasoning encoded into the
    operational logics as well. Data could make Abelson’s system a “Goldwater machine,”
    but not a “Stevenson machine.” Learning to understand the ideologies encoded in
    models and processes, especially when unacknowledged by system authors, is an
    important future pursuit for software studies.


    In this book I have also used fictions and games to provide specific grounding
    for politically significant software concepts that are often described only in
    the abstract. In particular, I discussed how the problems of false positives and
    false negatives make certain forms of government surveillance unworkable, but
    this can be difficult to grasp in the abstract. The problem is more easily understood
    (and more amusing to think about) in the context of The Restaurant Game, in which
    similar techniques fail to detect anything unusual as a simulated customer and
    waitress fill a restaurant with orders for pie and beer.


    For the most part, however, I have largely concentrated on the ability to think
    critically about software and providing specific grounding for particular types
    of understanding that I view as crucial. For example, while it is a truism that
    software can initially appear to act with more intelligence than is present in
    its internal models, it is more vivid and helpful to see the specifics of how
    Eliza/Doctor plays on our expectations to create its illusion.'
  merge: -1
  img_proc: true
- pgno: 431
  md: 'Similarly, while we might say, abstractly, that problems of commonsense knowledge
    limit the possibilities for artificial intelligence systems meant to emulate human
    thought, it is more memorable to examine the storytelling program *Minstrel* as
    it portrays a hungry knight eating a princess. In other words, I view the understandings
    of software important to the critic as also important to the citizen. And perhaps
    this is one of the main reasons to do critical work on digital media (and train
    students to do it).


    To be better citizens we need to understand software critically. I believe examining
    digital fictions and computer games is a powerful way to gain that understanding—provided,
    of course, they are examined with an eye toward expressive processing.'
  merge: -1
  img_proc: true
