    # A View of Digital Media


    Let me return to my first conception of expressive processing: the possibility
    of creating new simulated machines, of defining new computational behaviors, as
    the great authoring opportunity that digital media offers. Seizing this opportunity
    requires a bit of a shift. It is common to think of the work of authoring, the
    work of creating media, as the work of writing text, composing images, arranging
    sound, and so on. But now one must think of authoring new processes as an important
    element of media creation.


    In undertaking this shift, it may be helpful to think of the creation of a piece
    of digital media as being organized like figure 1.1. The work is made up of data
    and process, with a somewhat fuzzy line between them.” The data elements are mostly
    prerecorded media (text, still images, video and animation, and sound and music)
    and the sorts'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/571e2222d616de5351050acc809ee663_19_0.png)


    Figure 1.1. Authoring data and process.


    of things that are stored in spreadsheets (lists and tables of information, with
    varying degrees of structure).


    The processes, on the other hand, are the working parts of the simulated machine.
    Some are dedicated to tasks with simple structures, such as displaying a series
    of video images on a screen. But many of digital media''s tasks are more complex
    in structure, requiring processes capable of performing in a range of different
    ways. Even a simple piece of digital media such as Pong (figure 1.2) has processes
    that define behaviors much more complex than showing a series of images in quick
    succession. The processes of Pong define and calculate simple rules of physics
    (how the ball bounces off the paddles and walls) as well as simple game rules
    (who receives each serve, how points are scored, and how winning is achieved)
    that, when well tuned, can combine to create a compelling experience of gameplay—even
    in the face of remarkably primitive graphics.


    Of course, the idea of creating media through the authoring of novel processes
    is not new. Tristan Tzara''s Dada cut-up technique was presented in the wake of
    World War I as a process for turning a chosen newspaper'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/571e2222d616de5351050acc809ee663_20_0.png)


    Figure 1.2. The iconic early video game Pong gives players a simple goal: to use
    their simulated paddles to knock back a simulated ball—keeping it in play until
    one player misses, causing the other player to score.


    article into a poem. On a more technological level, the pioneers of early cinema
    had to develop novel processes (embodied in physical machinery) to capture and
    display their sets of image data. And on a longer-term level, the creation of
    board and card games has always primarily been the development of process definitions—embodied
    in game rules—that determine how play moves forward.


    In important ways these noncomputational media processes are like the processes
    of digital media: they are defined previously, but (at least in part) carried
    out during the time of audience experience. This is true as Tzara pulls a paper
    scrap from his sack, as the Zoetrope image flickers, as the poker hand goes through
    another round of betting, and as the image of a Pong ball bounces off the image
    of a Pong paddle. The processes of digital media, however, are separated from
    noncomputational media processes by their potential numerousness, repetition,
    and complexity. For example, we might play a game of tennis using the rules of
    Pong—since they’re simpler than the'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'normal rules of tennis. But we wouldn''t want to play Pong as a board game,
    having to hand execute all the processes involved even in its (extremely simplified)
    modeling of physics. It is the computer''s ability to carry out processes of significant
    magnitude (at least in part during the time of audience experience) that enables
    digital media that create a wide variety of possible experiences, respond to context,
    evolve over time, and interact with audiences.


    Given the importance of such audience experiences, the author''s view is not the
    only one I consider in this book. To reflect that, here is a slightly more complex
    figure (1.3) that adds a layer called “surface” over the initial data and process.
    In this book, the surface of a work of digital media is what the audience experiences:
    the output of the processes operating on the data, in the context of the physical
    hardware and setting, through which any audience interaction takes place. When
    playing a console game, for example, the surface includes the console and any
    indicator lights or other information it provides, the television or monitor and
    any image it displays, the sound hardware (e.g., television speakers, stereo,
    or headphones) and any sound produced, and the controller(s) with their


    ![](img/571e2222d616de5351050acc809ee663_21_0.png)


    Figure 1.3. Adding surface to data and process.'
