- pgno: 108
  md: 'organized at Dartmouth College in 1956. Howard Gardner, in his influential
    reflection on the field, The Mind''s New Science, characterized McCarthy''s neat
    approach this way: “McCarthy believes that the route to making machines intelligent
    is through a rigorous formal approach in which the acts that make up intelligence
    are reduced to a set of logical relationships or axioms that can be expressed
    precisely in mathematical terms” (1985, 154).


    This sort of approach lent itself well to problems easily cast in formal and mathematical
    terms. But the scruffy branch of AI, growing out of fields such as linguistics
    and psychology, wanted to tackle problems of a different nature. Scruffy AI built
    systems for tasks as diverse as rephrasing newspaper reports, generating fictions,
    translating between languages, and (as we have seen) modeling ideological reasoning.
    In order to accomplish this, Abelson, Schank, and their collaborators developed
    an approach quite unlike formal reasoning from first principles. One foundation
    for their work was Schank’s “conceptual dependency” structure for language-independent
    semantic representation. Another foundation was the notion of scripts (later case),
    an embryonic form of which could be seen in the calling sequence of the ideology
    machine’s executive. Both of these will be considered in more detail in the next
    chapter.


    Scruffy AI got attention because it achieved results in areas that seemed much
    more “real world” than those of other approaches. For comparison’s sake, consider
    that the MIT AI lab at the time of Schank’s move to Yale was celebrating success
    at building systems that could understand the relationships in stacks of children’s
    wooden blocks. But scruffy AI was also critiqued—both'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'within and outside the AI field—for its “unscientific” ad hoc approach. Weizenbaum
    was unimpressed, in particular, with the conceptual dependency structures underlying
