    using Eliza''s most famous script, Doctor, which causes the software to parody
    the conversational patterns of a nondirective therapist during an initial visit.
    All of this is described in Weizenbaum''s 1966 article in Communications of the
    ACM.4


    # How Eliza Works


    A session with Eliza can begin with a greeting. Weizenbaum''s Doctor script starts
    with: “How do you do. Please tell me your problem.” After this point Eliza will
    not take the initiative again—only respond.


    Each time an audience member types something, Eliza examines it, looking for words
    that have entries in the currently active script. Some of the words are keywords,
    which I will discuss further below. Some of the words are marked for simple substitution.
    For example, when Eliza runs the Doctor script, these substitutions switch all
    the first-person pronouns for second-person pronouns (“I” becomes “you”) and vice
    versa (“yourself” becomes “myself”). “Well, I am very helpful,” for instance,
    would become “Well, I am very helpful.” A word can be both substituted and used
    as a keyword.


    Periods and commas are treated as delimiters. If a period or comma is encountered,
    Eliza checks to see if a keyword has already been found. If one has, then everything
