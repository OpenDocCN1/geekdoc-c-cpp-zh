- pgno: 394
  md: 'The second design decision was the identification of our basic method for making
    n-gram generation playably interactive rather than oriented toward large batches.
    We decided that in addition to the starting document (within which play takes
    place), we would have a body of text used for producing the alterations to the
    starting document. (We call this second body of text the “alteration text” or
    “alteration corpus.”) When the starting document was displayed, certain words
    would be highlighted. We chose this as a convention familiar from hyperlinks on
    web pages, letting interactors know that a click will elicit a response. Nevertheless,
    these words are not highlighted as the result of author-specified links. They
    are instead highlighted because a string of n-gram text (of a length specified
    by the piece’s author) appears in both the starting document and the alteration
    text. We decided that such “bridges” between the two bodies of text would offer
    interactors the opportunity to open up the starting document and insert text generated
    from the alteration corpus. More than one generated text would be offered for
    possible insertion, allowing the interactor to choose one or none (this last leaving
    the text unaltered). The texts offered would themselves be generated from the
    alteration text through the use of n-gram techniques. The number of texts offered
    and the n-gram length used in their production would, again, be determined by
    the piece’s author.


    Once these decisions were made, we sketched, mocked up, and eventually tried to
    make operational a number of interaction designs. Some didn’t give the kinds of
    results we’d hoped for, and others were too computationally expensive to work,
    but in time we settled on one that—as a first attempt—we found satisfying in terms
    of the feel of'
