    among academic readers, amusingly enough, there is a tendency to seek all the
    relevant writing about a particular topic—and then strategically read the sections
    that relate to one’s own project. I believe it is critical for books to hold up
    to both kinds of reading (I hope this book manages it) and I'
  merge: -1
  img_proc: true
- pgno: 443
  md: 'see the dual-peer-review process as a good way of getting responses from both
    kinds of readers.


    # Generosity with Expertise


    It may sound strange to say, but my final surprise is that I find myself with
    so many people to thank—and so much indebted to a number of them. Undertaking
    the anonymous, press-solicited review of a book manuscript is already a generous
    act. (My press-solicited reviewers were particularly generous, offering thoughtful
    and helpful comments it must have been time-consuming to produce.) But at least
    the system is designed to provide some acknowledgment for such reviewers: perhaps
    free books or an honorarium, a curriculum vitae line indicating that one reviews
    for the press (a recognition of expertise), and the completion of some widely
    understood service to the field (which is an expectation of most academic jobs).


    Participants in the blog-based review of Expressive Proessing, on the other hand,
    received no such acknowledgment. And yet their comments contributed a huge amount
    to improving the manuscript and my understanding of the field. Further, they contributed
    things that it would have been nearly impossible to get from press-solicited reviews.


    This isn''t because presses choose poor reviewers or because the reviewers don''t
    work hard. Rather, it is because the number of manuscripts that require review
    dictates that only a few reviewers should consider each manuscript. Otherwise,
    the burden of manuscript review would impede the completion of other work.


    When only a few reviewers look at each manuscript, each will have some areas of
    relevant expertise. But'
  merge: -1
  img_proc: true
- pgno: 444
  md: 'for many manuscripts, especially interdisciplinary ones, there will be many
    topics discussed for which none of the reviewers possess particular expertise.
    "There''s no real way around this."


    Blog-based review, for me, created a different experience. Early in the review
    when I posted a section about *Prince of Persia: The Sands of Time*, a topic on
    which none of my press-solicited reviewers commented, commentary and conversation
    quickly developed involving three scholars who had written about it (Barry Atkins,
    Drew Davidson, and Jason Rhody) as well as other blog readers who had played and
    thought about the game. This happened repeatedly, with humanities and social science
    scholars, digital media designers, computer science researchers, game players,
    and others offering helpful thoughts and information about everything from dialogue
    system interface specifics to statistical artificial intelligence models.


    As the review progressed, deep expertise also showed itself on another level,
    as the manuscript began to get comments and host conversation involving people
    who rarely review academic manuscripts: the creators of the projects being discussed.
    This led to some of the best exchanges in the review process, including people
    like Scott Turner (*Minstrel*), Jeff Orkin (*F.E.A.R.* and *The Restaurant Game*),
    and Andrew Stern (*Façade*). The last person mentioned in the previous sentence,
    as some readers of this afterword may realize, is also a Grand Text Auto blogger.
    The mix between blog reader and blog coauthor comments was also present for the
    creators of examples I touched on more briefly, as with reader Richard Evans (*Black
    & White*) and coauthor Nick Montfort (*nf*).


    Some have asked me if the involvement of project'
  merge: -1
  img_proc: true
- pgno: 445
  md: 'authors in the review is likely idiosyncratic, possible only for someone writing
    on a topic like mine. Certainly on this front, I feel that digital media is a
    lucky area in which to work because so many of the authors of field-defining projects
    are still alive (and online). Yet I think the same sort of blog-based review involving
    project creators could happen for authors in many other areas. For example during
    the 2007 Writers Guild of America strike, a light was shown on the involvement
    of many movie and television writers in blog communities. I would not be at all
    surprised if such writers, already engaged in reading and writing on blogs, took
    an interest in academic writing that discusses their work—especially as part of
    a blog-based peer review that might generate revisions before the text is put
    into print. But only further experimentation will reveal if I am correct in this.


    1. This connects to my main critique of the Gamer Theory project: starting a new
    site for each manuscript reviewed, and gathering a new community to that site,
    is not a sustainable model for review, and not likely to result in the best possible
    ...


    Notes continued at end of this chapter.


    Another question, posed in response to the same “meta” post mentioned earlier,
    is whether this form of review only works because I have already developed some
    reputation in my field (e.g., from editing other books). My belief is that my
    personal reputation is not the primary issue. Rather, it is Grand Text Auto’s
    reputation that matters. It makes sense to do a blog-based review because we have,
    in blogs, already-existing online communities that attract university-based experts,
    industry-based experts, and interested members of the public. The way we use blogs
    also already encourages discussion and questioning.¹ Of course, widely read blogs
    won’t want to be completely taken over by manuscript review, but I can imagine
    them hosting two or three a year, selected for their level of interest or because
    they are written by one of the blog’s authors.


    It is possible that the interest of blog readers would flag'
  merge: -1
  img_proc: true
- pgno: 446
  md: under such circumstances. But nothing in my experience points to that. I think
    there is a hunger, on both sides, to connect the kinds of inquiry and expertise
    that exist inside universities and outside of them. Blogs are one of our most
    promising connection points—and blog-based peer review offers one simple way for
    the two groups to contribute to common work. If my experience is any guide, this
    can elicit remarkably generous responses. Especially given that I am a public
    employee (I work for the University of California at Santa Cruz), I look forward
    to pursuing this type of public connection further in the future.
  merge: -1
  img_proc: true
- pgno: 447
  md: '**Note**


    1. This connects to my main critique of the Gamer Theory project starting a new
    site for each manuscript reviewed, and gathering a new community to that site,
    is not a sustainable model for review, and not likely to result in the best possible
    signal-to-noise ratio. Inserting a new form of review into the ongoing flow of
    conversation on an existing blog can address these issues.'
