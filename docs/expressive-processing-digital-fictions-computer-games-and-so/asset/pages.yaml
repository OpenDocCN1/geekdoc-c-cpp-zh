- pgno: 26
  md: '# Three Effects


    At a higher conceptual level, this book also identifies three effects that can
    arise in the relationship between system processes and audience experiences, which
    may occur with a wide variety of operational logics. These will serve as the major
    waypoints for the remainder of this volume. The first—the Eliza effect—is the
    well-known phenomenon in which audience expectations allow a digital media system
    to appear much more complex on its surface than is supported by its underlying
    structure.


    I will also consider what most authors have ignored, however: during playful interaction
    with the simulated therapist for which the Eliza effect is named, the illusion
    breaks down rapidly. One alternative to breakdown with a system of this sort is
    to severely restrict interaction. Another is the one pursued by many modern games:
    never building up the Eliza illusion and instead clearly representing the operations
    of a simple system on the work’s surface. But these simple systems prove too limited
    for the fictional experiences that games seek to make available to their players,
    resulting in breakdowns of a different type. This leaves only one option for those
    seeking to create ambitious playable fictions: more developed system models of
    story and character.


    Expressive Processing’s next waypoint is an effect named for the first major story-generation
    system, Tale-Spin. Though created decades before modern games, it represents an
    initial step toward a more flexible model of fiction. Its characters have goals,
    make plans to satisfy them, examine their relationships with other characters,
    speculate about the plans of others, and so on. But little of this is visible
    to audiences in the resulting story, and'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'little can even be deduced through repeated interaction. It is this that leads
    me to coin a new term—the Tale-Spin effect—for works that fail to represent their
    internal system richness on their surfaces, in an inversion of the Eliza effect
    that is not uncommon in digital media. From there Expressive Processing looks
    at a different model of character planning (in the first-person shooter game F.E.A.R.),
    the alternative of statistical AI approaches, and the development of systems for
    story generation over the next several decades. While the examined story-generation
    systems demonstrate a variety of interesting models of fiction, most focus on
    this to the exclusion of a rich audience experience, resulting in the continued
    presence of the Tale-Spin effect in even the most advanced work in this area.


    The book''s third viewpoint is named after a work famous for making a relatively
    complex system into a rich, enjoyable experience of play: the city planning game
    SimCity. The SimCity effect is my term for systems that shape their surface experience
    to enable the audience to build up an understanding of their internal structure,
    especially a relatively complex one. This approach underlies the most popular
    and influential game built around simulated human characters: The Sims. It also
    provides a way of understanding the development of systems for believable animated
    characters and interactive drama, which eschew the most direct representations
    of internal system state. Finally, the SimCity effect provides an important design
    guideline for those who seek to make another powerful technology for fiction—language—playable
    in new ways.'
