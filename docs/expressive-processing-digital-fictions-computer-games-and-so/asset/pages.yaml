- pgno: 53
  md: 'pages, email messages, phone calls, physical settings and elements, and live
    performance—but defined its novel processes as rules to be carried out by human
    participants (rather than by digital computation).


    Another approach to digital fiction is more common than this sort of piggybacking
    on the processes of everyday information life, though. In this more common approach,
    digital fictions define their own versions of digital media processes in widespread
    use—or employ versions of these processes defined for use with digital media authoring
    tools. Such authoring tools range from Adobe''s Flash software (for interactive
    animations) to game engines (used repeatedly by the same developer or made available
    for commercial license) to tools identified with particular artistic communities
    (such as the Storyspace hypertext authoring system).


    The most widespread fiction taking this approach are computer games. They tend
    to avoid the Eliza effect by employing versions of simple processes, familiar
    to those who play computer games within the same genre, and following conventions
    to expose the structure and actions of the underlying processes to their audiences.
    This chapter will look at two particularly well-crafted examples of computer game
    fiction—Star Wars: Knights of the Old Republic (Falkner, Gilmour, Hudson, et al.
    2003), or KotOR, and Prince of Persia: The Sands of Time (Mechner, Mallat, Désilets,
    et al. 2003), or PoP—as well as two commonly employed operational logics that
    enable the fictions of computer role-playing games (RPGs). But, to understand
    all this, it is important to begin with a wider view of RPGs.'
