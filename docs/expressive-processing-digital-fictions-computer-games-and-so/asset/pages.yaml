  md: 'without paying and convince the waitress to come home with him. On the other
    hand, the system also responded in the same way to any conversation containing
    unusual vocabulary, even in games that humans rated as typical. As discussed earlier,
    this is the classic problem of false positives. Orkin also provides examples of
    sequences of physical actions—such as ordering beer and pie until they fill the
    restaurant, or sitting down, playfully refusing to order, and leaving—that the
    current version of the plan network is unable to detect as unusual, but are immediately
    strange to any human evaluator. This is the classic problem of false negatives.


    Orkin had originally announced that a game created using the results from The
    Restaurant Game would be entered into the 2008 Independent Games Festival. But
    he had to let the deadline pass. In his thesis he writes that this provided a
    lesson in the “danger of promising the public a deliverable based on novel research
    by a specific date” (42). More generally, it offers a lesson about statistical
    AI. As an authoring tool, it requires large amounts of data that may not be available.
    If the significant effort is expended to collect this data—as Orkin undertook
    with The Restaurant Game—for phenomena with wide variation, the results will be
    unpredictable and incomplete. Nevertheless, perhaps Orkin’s next step will find
    a way to make interacting with this model a fun, playful experience (see sidebar:
    Digital Media Research and The Restaurant Game). The most significant contribution
    of The Restaurant Game in the meantime is how it demonstrates that even in a microworld,
    stripped of most of the complexity of our own, statistical models produce many
    more false positives and false negatives than a TIA-style system could tolerate.'
