  md: 'computing are more important than ever, and where some of the highest-stakes
    processes—from those that generate terrorist watch lists to those that operate
    black-box voting machines—are kept in the hands of even more secretive priesthoods.
    In such a situation, what are we to do?


    One answer is to continue down the path of procedural literacy. I fully support
    such efforts. But this book follows a different path, as this chapter seeks to
    make clear.


    # Legible Examples


    One of the great difficulties in this area is that computer processes are often
    presented as essentially magical. This deceptive practice ranges from government
    agencies (as with TIA) to popular television shows (such as the many crime and
    terrorism dramas that portray facial recognition software as a reliable tool rather
    than an unsolved research question). We need a way to displace the idea of computational
    processes as magic and replace it with a basis for thinking critically about these
    issues. Procedural literacy only gets us part of the way. It may help more people
    understand how computationally processes are authored, but few people will ever
    personally write a system that employs techniques similar to those in a terrorist
    watch list generator.


    In my experience, however, people are able to reason about computational processes
    by analogy. For example, once one understands the strengths and limitations of
    a set of computational techniques—in whatever context that understanding was gained—it
    is possible to use that knowledge to understand something of the potential for
    those techniques in other circumstances. This is true for most technology. As
    a child I learned that the technology of the wheel, when employed by my little
    wagon, worked'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'better on hard, smooth surfaces than muddy, uneven ones.

    It was easy to generalize this knowledge to cars.


    Our problem now is, in part, that processes such as those that generate terrorist
    watch lists are kept secret, making them difficult to evaluate critically. But
    the deeper problem is that many in our society do not understand a single example
    of a process anything like those involved and, further, have no experience in
    interpreting and evaluating computational processes whatsoever. It is my hope
    that the field of digital media, by providing a set of engaging and legible instances
    of computational processes, can be a starting point for changing this situation.


    Consider the example of watch list generation. The specific processes may be secret,
    but it can be no secret that these systems rely on the techniques of AI. We also
    know that the AI field''s practical toolkit consists of hand-authored rules and
    knowledge structures on the one hand and large-scale statistical operations on
    the other.


    This provides us with some knowledge, but another route to knowing is cut off.
    In addition to the specific processes being kept secret, the output of these systems
    is highly illegible. For the most part (for obvious reasons) the contents of the
    lists are kept from the public. For those few suspects made public (apart from
    a few obviously ridiculous errors) it is hard to say which are and aren''t correctly
    identified. If the suspect is lucky enough to get a trial (rather than being held
    in an inaccessible detention facility or secretly transported to another country
    for torture), even that may not clarify whether that person''s classification
    as a suspected terrorist was appropriate.


    But many processes that employ AI techniques are much more legible, such as those
    used for media'
