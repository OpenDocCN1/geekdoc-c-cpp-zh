    > When STRIPS finds an acceptable plan, it has computed the world model anticipated
    before and after each action in the plan, has proven that the preconditions of
    each action in the plan are true in the model anticipated at the time of the action''s
    execution, and has proven that the task statement is satisfied in the model anticipated
    after completion of the plan''s execution. (1971, 2)


