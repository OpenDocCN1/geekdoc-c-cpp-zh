    system-controlled actors also express their storyworld actions in Deikto, so the
    time needed for audience members to interpret Deikto determines some of the pacing
    of the story experience. Crawford’s team provides an example of linear Deikto,
    presumably constructed as part of the work on an updated version of his landmark
    game Balance of Power (the new version is being developed using the Storytronics
