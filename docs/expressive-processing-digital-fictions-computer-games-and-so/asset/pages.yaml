    # **Two Other Approaches**


    Eduard Hovy''s system *Pauline* is undoubtedly a high-water mark for expressing
    an underlying model through variations in surface text. This project emerges clearly
    from the scruffy tradition, developed as Hovy''s dissertation work at Yale (defended
    in 1987) with Schank as his adviser and Abelson as a committee member. Given this
    context, it should be no surprise that *Pauline* uses something similar to Schank''s
    conceptual dependency expressions as its underlying representation structure.


    *Pauline* doesn''t generate stories but instead can tell many variations of the
    same story, based on a model of the situation''s “pragmatic constraints.” While
    the system was employed to generate texts recounting a hypothetical primary election
    between Jimmy Carter and John F Kennedy, as well as differing versions of the
    output of a program modeling judicial sentencing, it is best known for its variations
    on a story about a moment in the student/administration conflict over Yale''s
    investments in apartheid-era South Africa. Authoring the data for this story required
    representing “about 75 elements denoting the events, actors, locations and props,
    and ... about 50 elements denoting the relationships (temporal, intergoal, causal,
    etc.) that hold among them” (Hovy 1987, 696).'
