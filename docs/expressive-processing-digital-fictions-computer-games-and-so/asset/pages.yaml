  img_proc: true
- pgno: 126
  md: '1. This is one aspect of Meehan''s critique, of other aspects of which focus
    on the mismatch between the behavior of Klein''s system and theories of the behavior
    of human storytellers.


    Computer systems had certainly produced stories as output before. The most famous
    of these was the “automatic novel writer” produced by Sheldon Klein and his collaborators
    (1971) at the University of Wisconsin at Madison. But the field has generally
    followed Meehan’s critique of Klein’s system: it was made up of explicit chunks
    of action, with a path through these chunks chosen randomly.1 So, for example,
    Klein’s system includes a “rule for people arriving at George’s living room” (27).
    Meehan’s system, on the other hand, contains general rules for character movement
    (and reasons for movement) that operate no matter which spaces are available—living
    rooms, bedrooms, caves, or meadows.


    More broadly, this points to the two main types of systems for creating variable
    fictions. Klein’s system, like quest flags and Choose Your Own Adventure books,
    is composed of explicit chunks of story content. If one of these is changed or
    removed, not much else changes. At most, if some story chunks are only accessible
    by passing through others, when a chunk is removed other chunks may become impossible
    to reach. Meehan’s system, on the other hand, models story as a relatively fine-grained
    set of processes and data that are used to generate story events. In the case
    of Tale-Spin, this is accomplished by creating a simulated world, processes for
    behavior in and of the world, and characters and objects that populate the world.
    As a result, changing one aspect of the simulation (such as a rule for character
    movement or the existence of a particular object) can lead to wildly different
    Tale-Spin fictions. This kind of flexible model has become a defining characteristic
    for the pursuit of story generation.'
