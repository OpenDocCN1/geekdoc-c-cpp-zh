  md: '# Afterword


    # An Experiment in Peer Review


    When I completed the first draft of this book (in early 2008) things took an unusual
    turn. I had raced the time in traditional academic publishing when the press sends
    the manuscript out for peer review: anonymous commentary by a few scholars that
    guides the final revisions (and decisions). But we decided to do something different
    with *Expressive Processing*: we asked the community around an academic blog—Grand
    Text Auto—to participate in an open, blog-based peer review at the same time as
    the anonymous review.


    Blogging had already changed how I worked as a scholar and creator of digital
    media. Reading blogs started out as a way to keep up with the field between conferences,
    and I soon realized that blogs also contain raw research, early results, and other
    useful information that never gets presented at conferences. Of course, that is
    just the beginning. I cofounded Grand Text Auto, in 2003, for an even more important
    reason: blogs can foster community. And the communities around blogs can be more
    open and welcoming than those at conferences and festivals, drawing in people
    from industry, universities, the arts, and the general public. Interdisciplinary
    conversations happen on blogs that are more diverse and sustained than any I’ve
    seen in person.


    Given that digital media is a field in which major expertise is located outside
    the academy (like many other fields, from noir cinema to Civil War history), the
    Grand Text Auto community has been invaluable for my work. In'
