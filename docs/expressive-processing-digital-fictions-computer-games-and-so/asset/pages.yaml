    To me the results feel arbitrary, though I have enjoyed the work of these writers
    in other contexts—no different than if the graphics in *Pong* or *Spacewar!* were
    opened to replacement by arbitrary text.


    On the other hand, Cayley has used his transliteral morphing logic in a number
    of pieces, both interactive and not. The results do not feel arbitrary but rather
    fitting. As I suggested above, I believe this is because transliteral morphing
    is a textual logic instead of a spatial one. Just as spatial logics work well
    with a wide variety of graphics, textual logics work well with a wide variety
    of texts. Cayley is far from the first to work with textual logics. We encounter
    textually specific forms of play every day—such as the newspaper crossword puzzle.
    It is a feature of alphabetic characters that they can simultaneously play roles
    in two intersecting words. On a different level, a number of writers and artists
    working before Cayley have invented textual transformation procedures, such as
    the famous “n + 7” method of dictionary substitution popularized by the writers
    and mathematicians of the Oulipo.


