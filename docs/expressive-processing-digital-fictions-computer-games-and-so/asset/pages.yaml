  md: 'quest, starting by finding the ring (jumping straight to the second stage)
    seems unlikely to produce any problem with the flags or journal. Setting lookingForRing
    to false when it is already false makes no difference, and starting with the second
    stage of the quest works with the journal entries as written. But, to determine
    such things, the game author has to carefully think through every possibility—and
    the more freedom given to the player (as to when, how, and whether to take on
    and complete quests), the more the events of different quest strands need to be
    considered in relation to one another.


    This, in turn, brings us back to the idea of simplicity. The quest flag structure
    is a simple one in a variety of ways. It’s easy for software developers to implement,
    it doesn’t require much in the way of computational resources (leaving both programming
    and processing resources free for areas of the game such as graphics, which is
    something most game companies value), and it can be exposed to the audience quite
    straightforwardly. Yet given the goal of the audience feeling able to *play* within
    the fictional world—not just in areas such as combat but also in terms of the
    stories being told—the quest flag structure quickly brings game authors to a limit
    point of complexity, holding back the future development of the form. I’ll consider
    this further in my discussion below of BioWare’s widely lauded single-player RPG,
    *KotOR*. First, however, a brief discussion of dialogue trees is in order.


