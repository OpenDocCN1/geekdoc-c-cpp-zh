    surface representation and the underlying simulation. I believe that we can form
    emotional attachments to Sims in part because they don''t speak English. They
    speak Simlish, made up of symbols representing aspects of the underlying model
    of interests for Sims. Their graphical representations are actually rather simple,
    and their animation sequencing can be problematic, but they appear genuinely responsive
    to changing circumstance—within a limited range that is continually telegraphed
    to the audience by the design of the system—and this is highly engaging.


    The emotion engine view of characters in digital media is the opposite. It is
    focused on giving characters more expressive faces, body models, and movements.
    A mildly enlightened cousin of this view also wants to give characters more compelling
    things to say. But there is little said about the underlying models driving these
    characters, and the assumption generally seems to be of models simpler than those
    in The Sims. As a result, developing these more expressive faces is just creating
    a larger and larger gap between the surface and the underlying model, between
    the appearance of response and the actual ability to respond. Even if this vision
    succeeded completely at its aims, the eloquent lines expressively performed by
    these characters would have less meaning in the system of the resulting game than
    the iconographic Simlish of the Sims.


