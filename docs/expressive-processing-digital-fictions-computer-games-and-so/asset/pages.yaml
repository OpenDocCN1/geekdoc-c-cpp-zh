    up caught in level geometry, failing at pathfinding when presented with objects
    as simple as ramps and so on. The specific breakdowns are shaped by the underlying
    systems of spatial simulation and character navigation. They could be avoided
    in a game that wanted to simplify space and movement sufficiently (obviously,
    they couldn''t exist in a game like *Myst*), but relatively free-form interaction
    is also often important to creating the initial illusion. Luckily, in many games
