  md: '# Notes


    1. Some games, of course, can hardly be said to engage fiction at all. No one
    wants a story with their Tetris—and its “fictional world” of falling blocks barely
    supports the phrase. Given the sometimes-contentious nature of critical discussion
    around the relationship between games and fiction, I should perhaps also make
    it clear that I do not believe any games “are” stories or narratives in a classic
    narratorial sense. Rather, following Espen Aarseth’s call for discussion of “quest
    games” (2004), I propose here to give careful attention to the specific operational
    logics of quests and dialogue trees in computer RPGs. For readers interested in
    a more detailed discussion of games and narratology, I suggest chapter 8 of Avatars
    of Story by Marie-Laure Ryan (2006).


    2. As tabletop RPGs have come to encompass much broader areas of life than combat,
    different games (and player groups) have diverged in their treatment of these
    other elements. One movement is toward a generalization of the statistical models
    used for war game combat. They have been employed for many additional elements
    of character progression and play. The other movement is toward an emphasis on
    creative expression that may resist quantification, or at least be decided by
    the logic of character and fiction rather than chance, leading to “diceless” RPGs.
    Players who prefer each emphasis are sometimes called “roll players” and “role
    players,” respectively.


    3. The most famously Lovecraft-inspired game is Call of Cthulhu (Petersen 1981),
    while Over the Edge (Tweet 1992) is a game inspired by both Burroughs and Philip
    K. Dick. At the same time, as Jose Zagal reminded me in the blog-based peer review
    of this book, some RPG systems—such as GURPS (Jackson 1986)—are designed to be
    “generic,” rather than rooted in a specific fictional world or even a specific
    type of fictional world. Finally, the games of CthulhuX that I’m referring to
    are Toon (1984) and Bestial Acts (1993), respectively. Together with the innovative
    RPGs The Extraordinary Adventures of Baron Munchausen by James Wallis (1998) and
    Puppetland by John Tynes (1999), Bestial Acts is reprised in Second Person (2007),
    a book I edited with Pat Harrigan.


    4. Though many massively multiplayer online play groups, including some in which
    I have participated, include face-to-face interaction between some players. And
    there are a variety of other hybrid forms that combine elements of in-person and
