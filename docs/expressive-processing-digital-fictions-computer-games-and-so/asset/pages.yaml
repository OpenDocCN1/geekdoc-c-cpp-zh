- pgno: 243
  md: 'systems considered in this chapter also have two further requirements. First,
    they must be expressive and controllable, so that their underlying models effectively
    shape the audience experience. Without this, much of the effort involved in developing
    their fictional models is arguably wasted. At the same time, these systems must
    also be *authorable*—not departing so far from the skills and expectations of
    traditional authors that developing material for them is unrealistically onerous
    and unable to draw on our vast body of experience in media authoring. Balancing
    these two requirements can be a challenge.


    Looking at this chapter''s example systems also foregrounds another key difference
    between the practices of artificial intelligence (AI) and digital media. In AI,
    as in many areas of computer science, a system does not need to be completed in
    order to be influential. Computer science rewards the creation of innovative processes
    and mostly considers data the province of other fields. This results in a significant
    incentive against actually completing the authoring work for story-generation
    systems. Completing the data is time-consuming work with little direct reward,
    especially for systems that are not well designed for authorability.


    Unfortunately, unfinished systems provide substantially less valuable results
    for both fields, because neither their processes for story generation nor their
    support for authoring are fully tested. Yet unfinished systems remain worth examining,
    because it is the only way to gain insight from the creative work performed in
    many computer science projects. This is visible in two of the systems discussed
