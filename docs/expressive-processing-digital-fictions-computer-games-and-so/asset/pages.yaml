  md: '# Chapter 2

    The Eliza Effect


    # Meeting Eliza


    When I was a teenager—in the 1980s—my mother bought a personal computer. It was
    an impressive machine for the day, decked out with two floppy drives, a dot matrix
    printer, a Hayes modem, and a monochrome amber display.


    At first I only used the machine for some minor programming experiments (in Basic
    and later Pascal), writing for school (in WordStar), and a few games. But that
    mysterious modem sat there. Probably intended to let my mother exchange data with
    the big Digital Equipment Corporation machines she had in her university lab,
    I knew modems could also be used for other things.


    This was about a decade before the Internet began to make its way into homes like
    ours, and I had no interest in the manicured gardens of services like the Source
    or CompuServe. Rather than any long-distance journey, I wanted to use the modem
    to explore the local wilderness, to visit the untutly bulletin board system (BBS)
    scene sprouting in the dens and basements of my neighbors'' homes.


    While largely forgotten today, a BBS was the online destination of choice for
    1980s teenagers,¹ Most were run by individuals out of their homes: computer enthusiasts
    with machines much more powerful than ours, hooked to one or more dedicated phone
    lines. A user like me could call into a BBS, read messages, leave messages, download
    and upload files, play text-based games, and (if


    1. For more on BBS culture, I highly recommend Jason Scott''s BBS The Documentary
    (2005):'
