    play. Romeo kills himself and never knows that Juliet was not actually dead—much
    less regrets his decision. That it is represented this way is an artifact of the
    larger system design. Only character plans, not author plans, are represented
    in a manner that Minstrel can transform.12


    In any case, once a theme has been selected, this adds a set of goals to the agenda:
    instantiating examples of the decision, connection, consequence, and context of
    the PAT. Once transformation plans succeed in creating the sequence of story events
    that accomplish these goals, other goals can come into play. “Drama goals,” for
    instance, include suspense, tragedy, foreshadowing, and characterization. To illustrate,
    a characterization goal would add a story scene showing that a character has an
    important personality element (e.g., makes decisions in haste) before the section
    of the story that embodies the PAT. As mentioned, another set of goals, “consistency
    goals,” fill out elements that aren’t the bare-bones embodiments of the PAT. If
    a knight kills another person, for example, consistency goals make sure that he
    is near the person first and that he has an emotional reaction after. Finally,
    presentation goals make the final selection of the scenes that will be in the
    story, their ordering, and how they will be expressed in English. But all of this,
    while it represents a fuller method of story generation than Tale-Spin, is only
    the enabling machinery around Minstrel’s primary operational logic: TRAMs.


    # Minstrel’s TRAMs


    At the heart of Minstrel’s approach to generating stories is the implementation
    of Turner’s theory of creativity:'
