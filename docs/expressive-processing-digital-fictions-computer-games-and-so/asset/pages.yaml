  md: 'can be shielded from breakdown by severely restricting interaction. The experiment
    allowed the subjects to maintain the illusion that something much more complex
    was going on inside the system (a human considering her problems seriously and
    answering questions thoughtfully, rather than random yes/no answers) because the
    scope of possible responses was so limited. If it had been expanded only slightly—say,
    to random choice between the responses available in a “magic eight ball”—almost
    any period of sustained interaction would have shattered the illusion through
    too many inappropriate responses.


    When breakdown in the Eliza effect occurs, its shape is often determined by that
    of the underlying processes. If the output is of a legible form, the audience
    can then begin to develop a model of the processes. This is what Turkle observes
    in those interacting with Eliza/Doctor: from the shape of the breakdown they begin
    to understand something of the processes of the system—and then employ that knowledge
    to help maintain or further compromise the illusion.


    In this context, it is interesting to note that most systems of control that are
    meant to appear intelligent have extremely restricted methods of interaction.
    In some cases the reasons for this are quite obvious. If the public were allowed
    playful interaction with software that identifies possible targets for financial
    surveillance, the shape of the underlying system would become relatively apparent,
    making it possible to “game” the system. At the same time, this restricted interaction
    also serves to maintain the Eliza effect for software that is not nearly as intelligent
    as the public has been asked to believe.


