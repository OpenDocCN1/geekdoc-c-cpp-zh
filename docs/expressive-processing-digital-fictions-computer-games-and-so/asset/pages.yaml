- pgno: 24
  md: '# Operational Logics


    The primary goal of the model of digital media developed above is not found in
    its individual components. My main hope is not that readers will come away with
    an understanding of every nuance of what I mean by *data* or *surface*. Rather,
    my hope is that a basic understanding of these components will provide the foundation
    for a new approach to thinking about digital media (and computational systems
    more generally). I use the term _operational logics_, described further below,
    to name a new type of element specific to procedural systems that this type of
    thinking can help identify and analyze.


    When a work of digital media operates, this can be seen as an interplay between
    the elements of the model discussed so far: data, process, surface, interaction,
    author, and audience. Observing the specifics of this interplay can be informative.
    Is the system actually doing what it is described as doing? What unspoken assumptions
    are built into the ways in which operations proceed?


    At a higher level of abstraction, however, we can also notice patterns in this
    interplay. I call these patterns _operational logics_. In my first discussion
    of them (Wardrip-Fruin 2005), I talked about common spatial or graphical logics,
    such as _collision detection_. This is a term for when a system notes the virtual
    “touch” of two simulated objects. When the _Pong_ ball bounces off the paddles
    and walls, this is collision detection. It is also collision detection when the
    _Doom_ engine prevents players from walking through walls—and when it determines
    that a bullet (or chain saw) has hit a target.⁶


    From these examples it is probably clear that the same


    6. I will return to the discussion of spatial logics in chapter 9.'
