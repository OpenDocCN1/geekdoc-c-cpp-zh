    To summarize, Terminal Time assembles the storyboard for each section of its story
    as follows:


    First, it finds the events that can be spun to support the current ideology’s
    rhetorical goals and makes them into spins.


    Next, spins are added to the storyboard (as an unordered collection, only some
    of which will be used). Constraints on the storyboard (such as those from the
    current ideologue) determine how many events, and serving what rhetorical goals,
    will actually be used in each section of the generated story.


    Finally, Terminal Time identifies a set of rhetorical devices that can connect
    the right number and type of events (to meet the storyboard constraints) searching
    using the events currently available on the board (and needing to meet the internal
    constraints imposed by each device’s prescope and postscope tests).


