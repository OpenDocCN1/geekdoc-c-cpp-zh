  md: '# Chapter 4 Making Models


    # Implementable Models


    Games are systems—and these systems have varying relationships with the everyday
    world. Hopscotch, for example, is made up of a small number of rules that structure
    full-body actions in the everyday world. Most of the challenge of play comes from
    the way that the game’s space is demarcated on the ground, the properties of balance
    of the human body, and the physics of planet Earth. Scrabble, on the other hand,
    is challenging because of the rules for what happens on the board (rather than
    being a physical challenge, as we can see by the fact that it would be permissible
    for another player to arrange my tiles on the board for me, under my direction),
    but the nature of this challenge is shaped by our knowledge of the English language.
    And Monopoly relates to our everyday world not, primarily, through the motion
    of our bodies or our knowledge of facts outside the game, but instead by being
    a representation—a model—of the economic system under which it was produced: capitalism.


    Like traditional games, computer games are also systems. Some are quite close
    to traditional games—like Dance Dance Revolution, which requires quick movement
    over a pressure-sensitive surface in time with on-screen instructions, essentially
    creating a computer-driven version of the traditional sort of full body play found
    in Hopscotch, Simon Says, and Red Light/Green Light. But most computer games are
    closer to Monopoly; the game play challenges, while they may require physical
    dexterity,'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'are represented on the work’s surface within a world modeled by the game’s
    systems.


    In constructing the models that make up game worlds, certain approaches are common.
    As discussed in the introduction, collision detection is a common operational
    logic for the models of space in games. Similarly, as discussed in the previous
    chapter, finite-state machines are a common operational logic for non-player character
    (NPC) behavior.


    These models aren’t selected and constructed in an attempt to capture all the
    nuance and detail of their counterparts in the everyday world. Rather than fidelity,
    these models are selected for a number of overlapping practical reasons. First,
    the models employed must be specific enough to be implemented computationally.
    Second, the implemented models must operate with acceptable efficiency on the
    platform(s) targeted by the development team. Third, the development resources
    (especially programmer time) must be available to perform this implementation.
    Finally, the overall goal is defined by the fact that the game is attempting to
    reach an audience; the model must serve the experience of gameplay sought by the
    game’s authors.


    As Philip Agre (1997) explains in Computation and Human Experience, artificial
    intelligence (AI) researchers are also deeply engaged in making systems—but as
    a way of knowing. This changes a number of things. For example, it is fine for
    an AI research system to require a massive computer cluster in order to function,
    rather than a standard game console. It is also fine if the results of an AI research
    project can only be understood by specialists, rather than appreciated by a mainstream
    audience. But one'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'fundamental thing does not change: AI researchers and game creators are interested
    in models of the world, and behavior within it, that can be implemented. They
    require models that can be operationalized computationally, and this creates a
    bridge between the two groups.


    At the same time, AI research also has close connections to other disciplines—those
    that seek to understand, with their own tools, the same topics it investigates
    with its way of knowing. These include psychology, linguistics, and cognitive
    science. In this context, the question for AI (and those other disciplines in
    their connections with AI) is, “What do we hope to learn by making models?”


    This question is immense, of course, as is the question to which it leads: How
    do we evaluate these computational models? This chapter will not attempt large-scale
    answers. Rather, the questions will be addressed, partially, through the pursuit
    of a more focused question: Faced with the dilemmas of the Eliza effect, what
    could be a next step? This, in turn, will be considered through the examination
    of another influential AI system, one that Weizenbaum saw as representing a possible
    future direction for Eliza: Robert Abelson’s “ideology machine.”


    This leads back to one of the meanings of expressive processing at the heart of
    this book, that focused on authorial expression. An understanding of the work
    of making computational models as an act of authoring is furthered by a consideration
    of Chris Crawford’s notion of “process intensity” and Michael Mateas’s concept
    of “expressive AI.” But first, before making these steps beyond the Eliza effect,
    it is important to understand the view of computational models that Weizenbaum
    was reacting against.'
