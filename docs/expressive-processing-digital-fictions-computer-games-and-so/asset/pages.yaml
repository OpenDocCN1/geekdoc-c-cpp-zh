  md: '# Chapter 10

    Conclusion


    This book is certainly about the topics named in the subtitle—digital fictions,
    computer games, and software studies—but most of all it is about *expressive processing*.


    Over the course of this book I have approached this topic from three perspectives.
    One perspective is oriented toward digital media creation, focused on the potential
    of understanding computational processes as a powerful tool for authorial expression.
    Another is oriented toward the critical study of digital media, focused on understanding
    the aspects of works that aren''t apparent on the surface. Finally, I have also
    taken a political perspective, oriented toward the political stakes in some works
    and the political lessons to be learned from others. Here, in the conclusion of
    *Expressive Processing*, I will revisit each of these perspectives, bringing together
    ideas from throughout the book and suggesting some future directions.


    # Authors


    We have reason to discuss digital media because of the already demonstrated ability
    of computational processes to define compelling new media forms—from the first-person
    shooter to the collaborative wiki. The specifics of the processes used to craft
    such media can shape the audience''s experience as fundamentally as the specifics
    of the images used in a motion picture, if not more so. The harnessing of such
    specifics for authorial expression is one of the senses in which I mean the term
    *expressive processing*.'
  merge: -1
  img_proc: true
- pgno: 419
  md: 'I am particularly interested in the potential of expressive processing within
    the realm of fiction: in creating flexible models of story events, producing a
    wide variety of language for characters and narration, and also for nonsimulative
    experiences that make language itself playable or enact procedural transformations
    that amplify fictional themes. As a fan of computer games, which have greatly
    developed the expressive simulation of space, I''m particularly interested in
    the possibilities of flexible models of fiction in this area.


    Consider the open world computer role-playing game. In a game like The Elder Scrolls
    IV: Oblivion (Rolston, Howard, Cheng, et al. 2006) the world is simulated spatially,
    as in many other games. But it is also simulated in other senses. As I move through
    the world I collect ingredients I can use to make potions. As I make potions my
    skill in this area improves. As my skill increases I learn more about the possible
    effects of different ingredients. I can use the resulting potions or sell them
    into a simulated economy. What I get for selling them is connected to my abilities
    as a merchant (which get better the more I use them) and the simulated feelings
    other characters have about me (which can be altered by a conversation-simulation
    minigame as well as my faction affiliation, whether I''m holding my weapon unsheathed,
    and so on). And this is only one slice through the types of intersecting activities
    supported throughout the many spaces of Oblivion. In contrast to this vast, explorable
    world—through which players may move in many ways, with many different goals and
    paths toward them—the structure of the game''s story is rigid.


    As Ken Rolston, Oblivion''s lead designer, writes:


    > Exploring has more genuine suspense than following quest stages. There are so
    many'
