- pgno: 267
  md: 'the other characters involved). In other words, in Brutus the system''s encoded
    knowledge about the structure of literary themes makes no contribution to creative
    distance. Instead, this distance is entirely created—to whatever extent it exists—by
    the shape of the pieces into which Bringsjord and Ferrucci decided to cut the
    story for which the formalized account would produce the logical match.


    This, in turn, might make us uncomfortable with reports, such as that from the
    New York Times, that “Bringsjord said Brutus.1 spit out its story in seconds.”
    In fact, Bringsjord and Ferrucci spent much longer than a few seconds authoring
    exactly the elements, the versions of those elements, and the order of those elements
    that would make up the story “Brutus,” produced.


    Frankly, presenting the Brutus system as a story author simply seems unwarranted,
    having examined its operations. Certainly, most high-level descriptions of Brutus
    suggest an operational logic for which its internal model of betrayal is central
    to the selection, development, and assembly of story elements. But the actual
    operational logic of Brutus, is that, of a child’s picture puzzle. Each piece
    can only fit one place, in a manner determined by the authors before the system
    is set running, and no internal model of betrayal (or any other literary concept)
    could possibly influence the process. With this in mind, the Brutus project takes
    on the rough shape of a literary hoax—though I suspect the system’s authors are
    among those who were taken in by the illusion. In this regard it is a memorable
    example of the misconceptions to which even the technically knowledgeable can
    fall prey without an approach for critical reading of computational systems.


    It is my hope that a version of software studies (by this'
