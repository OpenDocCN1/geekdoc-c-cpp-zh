- pgno: 179
  md: '# Chapter 6

    Character and Author Intelligence


    # After Tale-Spin


    As the previous chapter described, James Meehan''s Tale-Spin—built on a simulation
    embodying the scruffy artificial intelligence (AI) theories of Roger Schank and
    Robert Abelson—generated coherent accounts of character actions and interactions
    in a fictional world. This set the foundation for the field of story generation.
    Considered today, it also raises an inevitable question: What next?


    This chapter considers two different responses. From the perspective of today''s
    media authors, the question of how to generate appropriate character behavior
    is important. In my discussion of Prince of Persia: The Sands of Time, I described
    the basic design of a common, problematic approach to character behavior: the
    finite-state machine (FSM). As it turns out, an approach somewhat similar to Tale-Spin''s
    has been used to address some of the limitations of authoring behavior with FSMs—specifically
    in the computer game F.E.A.R.—offering one response to “what next” for characters.


    But within the history of story generation a rather different answer emerges.
    As I mentioned in the previous chapter, a primary critique of Tale-Spin within
    the AI community is that stories are not simply an account of character behavior.
    To answer “what next” for story generation requires a system attuned to the overall
    shape of a fiction, rather than just local rules for character action. Scott Turner''s
    work on Minstrel is an ambitious example of this next stage for story generation.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '1. The basic FSM structure can be implemented in a number of ways, some more
    efficient than others, in a manner that embodies the same operational logic.


    Through different routes, these two cases also bring this book to central topics
    for AI, media authoring, games, and fiction. First, a familiar question: Should
    AI attempt to build systems that operate the way people do? Second, a new topic:
    The rise of statistical techniques and their implications for approaches built
    with hand-authored processes and data. The second of these also provides an appropriate
    opportunity for a more detailed consideration of another of this book’s goals:
    using digital media projects as legible examples that can help inform our thinking
    about software’s role in our society more broadly.


    # Beyond Compartmentalized Actions


    The FSM is much like the quest flag or dialogue tree. Each is conceptually simple,
    easy to implement, places low demands on system resources, and—over a certain
    level of complexity—becomes difficult to author and prone to breakdown. A quick
    look at the structure of FSMs shows the reasons for this.¹


    An FSM is composed of states and rules for transitioning between states. For instance,
    an FSM could describe how to handle a telephone. In the initial state, the phone
    is sitting on the table. When the phone rings, the FSM rules dictate a transition
    to picking up the phone and saying “Hello.” If the caller asks for the character
    who answered, the rules could say to transition to a conversation state. If the
    caller asks for the character’s sister, the transition could be to calling the
    sister’s name aloud. When the conversation is over (if the call is for the character
    who answered the phone) or when the sister says “I’m coming” (if the call is for
    her), the phone goes back on the table.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'As promised, all of this is quite simple. But what happens when the situation
    becomes more complex? We might add caller ID, after which the character needs
    to check who the call is from before answering (and sometimes not answer). We
    might add call waiting, transitioning to the “Hello” state from the conversation
    state (rather than from the phone on the table state), and then running a second
    conversation that, when it ends, returns to the previous conversation state (rather
    than putting the phone down on the table). We might add a check to see if the
    building is on fire, in which case the character asks for help from anyone who
    calls (or perhaps only from local callers). We might add a check to see if the
    character is deep in conversation with another physically present character, in
    which case the ringing phone leads them to say, “Let ’em leave a message” (rather
    than transitioning to the “Hello” state or the caller ID check). Now imagine all
    of the character’s behavior organized into a giant, interconnected mass—covering
    phone conversations, in-person conversations, eating and drinking, sleeping, working,
    playing games, reading, visiting museums, getting into traffic accidents, all
    the possible transitions between them, and all the possible combinations (e.g.,
    playing a game while drinking or getting into an accident while talking). While
    authoring such an FSM would be possible, in practice the complexity would be a
    huge challenge to manage, and any change would threaten to produce unexpected
    results.


    For this reason, game behavior authors have sought to manage FSM complexity in
    different ways. Jeff Orkin, in his work on the game No One Lives Forever 2 (Hubbard,
    Ryan, Pendleton, et al. 2002), gave characters sets of goals that compete for
    activation (Orkin 2006). Each goal has'
  merge: -1
