- pgno: 6
  md: '# Series Foreword


    Software is deeply woven into contemporary life—economically, culturally, creatively,
    politically—in manners both obvious and nearly invisible. Yet while much is written
    about how software is used, and the activities that it supports and shapes, thinking
    about software itself has remained largely technical for much of its history.
    Increasingly, however, artists, scientists, engineers, hackers, designers, and
    scholars in the humanities and social sciences are finding that for the questions
    they face, and the things they need to build, an expanded understanding of software
    is necessary. For such understanding they can call upon a strand of texts in the
    history of computing and new media, they can take part in the rich implicit culture
    of software, and they also can take part in the development of an emerging, fundamentally
    transdisciplinary, computational literacy. These provide the foundation for Software
    Studies.


    Software Studies uses and develops cultural, theoretical, and practice-oriented
    approaches to make critical, historical, and experimental accounts of (and interventions
    via) the objects and processes of software. The field engages and contributes
    to the research of computer scientists, the work of software designers and engineers,
    and the creations of software artists. It tracks how software is substantially
    integrated into the processes of contemporary culture and society, reformulating
    processes, ideas, institutions, and cultural objects around their closeness to
    algorithmic and formal description and action. Software Studies proposes histories
    of computational cultures and works with the intellectual resources of computing
    to develop reflexive thinking about its entanglements and possibilities. It does
    this both in the scholarly modes of the humanities and social sciences and in
    the software creation/research modes of computer science, the arts, and design.


    The Software Studies book series, published by the MIT Press, aims to publish
    the best new work in a critical and experimental field that is at once culturally
    and technically literate, reflecting the reality of today’s software culture.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# # Preface


    # ## Expressive Processing


    This book demonstrates a new approach to understanding digital media—and uses
    it to shed light on two of my favorite kinds of media: digital fictions and computer
    games. This new approach assumes that it isn’t just the external appearance and
    audience experience of digital media that matter. It is also essential to understand
    the computational processes that make digital media function.


    Computational processes are a powerful new tool in the hands of authors. Shaping
    these processes enables the finely honed commercial entertainments of the computer
    game industry. Inventing new processes is at the heart of the radical media experiments
    of artificial intelligence (AI) and other areas of computer science. Finding unexpected
    uses for processes is common in the fusion of concept and craft that defines the
    work of independent artists, writers, designers, and studios. Such authoritative
    expression through processes is one of the central topics of this book and one
    of the meanings of the term *expressive processing*. I hope the projects examined
    in this book can help authors think productively about the future of fiction,
    games, and digital media more generally;


    For critics seeking to understand process-intensive work, finding an appropriate
    way to grapple with processes themselves can be puzzling. While some authors focus
    on the potential of interpreting each work’s source code, this level of detail
    is not necessarily telling (for most works, the textual style of the code is not
    central), and for many works the code itself is not available. Instead, this book’s
    approach looks at what I call the *operational logics* at work within a variety
    of examples. My focus is on interpreting what processes do—the ideas expressed
    through the design of their movements—and the relationships that processes express
    with schools of thought and communities of practice. Looking at what processes
    express in this manner, enabling critics to interpret elements'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'of works not visible on the surface, is the other main element of what I mean
    by expressive processing.


    Beyond digital media specifically, I also believe it is essential for our political
    future that people develop the ability to think critically about software systems.
    Coming to understand the processes of digital media can contribute to this. Many
    general concepts about software are more easily understood when tied to specific,
    legible examples, which digital media can provide. I explore a number of the examples
    in this book in terms of their wider lessons about software and the potential
    political implications of these lessons.


