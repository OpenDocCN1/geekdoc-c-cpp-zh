  md: '# # Software Studies


    Most studies of software (from outside the disciplines of engineering and mathematics)
    have considered software in terms of what it emulates and extends—a typewriter,
    a television, mail delivery—and how that is experienced from outside the system.
    But a minority of authors have instead consistently written about software as
    software. This includes considering software’s internal operations (as this book
    does), examining its constituent elements (e.g., the different levels, modules,
    and even lines of code at work), studying its context and material traces of production
    (e.g., how the workings of money, labor, technology, and the market can be traced
    through white papers, specification documents, source code management system archives,
    beta tests, patches, and so on), observing the transformations of work and its
    results (from celebrated cases such as architecture to the everyday ordering and
    movement of auto parts), and, as the foregoing implies, a broadening of the types
    of software considered worthy of study (not just media software, but also design
    software, logistics software, databases, office tools, and so on).


    These investigations form a part of the larger field of software studies—which
    includes all work that examines contemporary society through the lens of the specifics
    of software. For example, while there are many perspectives from which one might
    look at the phenomena of Wal-Mart, those who interpret the retail giant with attention
    to the specifics of the software that provides the foundation for many of its
    operations (from store restocking to relations with far-flung supplier networks)
    are engaged in software studies. On the other hand, those who study Microsoft'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'without any attention to the specifics of software are not part of the software
    studies field.


    The phrase software studies was coined by Lev Manovich (2001, 48), in his widely
    read book The Language of New Media. Manovich characterized software studies as
    a “turn to computer science”—perhaps analogous to the “linguistic turn” of an
    earlier era.15 In his book, software studies takes the form of a turn toward analysis
    that operates in terms of the structures and concepts of computer science, toward
    analysis founded in terms of programmability (rather than, say, in terms of significance).16
    In this way, Manovich’s book also helped create the conditions of possibility
    for this book, which I see as an example of software studies.


    To avoid confusion, however, I should point out that this book is not an instance
    of one particular area of software studies: code studies. A number of software
    studies scholars are interested in interpreting programming language code17, but
    examining code and examining processes are not the same thing. This chapter provides
    an illustration of the difference. While my understanding of the processes of
    Tale-Spin/Mumble is in part built on an exploration of uncompiled source code,
    my interpretation is of the processes of, of the operations of this software,
    rather than of any specifics of the language (MLISP’s peculiarities) or the code’s
    textual specifics (e.g., the use of “SENTIENT rather than, say, “ALIVE to mark
    which elements of a conceptual dependency expression will be translated into English
    in a particular way).


    If we think of software as like a simulated machine, interpreting the specific
    text of code is like studying the


