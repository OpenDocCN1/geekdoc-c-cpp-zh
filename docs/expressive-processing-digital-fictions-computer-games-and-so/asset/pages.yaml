    waiting for a cue from the director—dramatically fell to the ground.


    Interactors felt that the experience was incredibly engaging, with one reporting
    that it “escalate[d] from normal, to annoying, to out of control in a matter of
    seconds.” Those observing the experiment from the outside, on the other hand,
    felt that the action lagged—and even reported boredom to the point of losing track
    of events. From this Bates and his colleagues concluded two things. First, most
    obviously, that engaging pacing for an interactor, immersed in an experience,
    is quite different from what it would be in a traditional media experience. Second,
    more theoretically, they took the success at engaging their interactors as a confirmation
    of their basic design philosophy for interactive drama: placing the audience member
    as an interacting character within the drama (an interactor), creating expressive
    and relatively independent non-player characters (NPCs) within the same environment,
    and guiding the higher-level actions of the NPCs through the interventions of
    a drama manager tasked with adjusting pacing for the interactor and guiding the
    story to a successful conclusion.'
