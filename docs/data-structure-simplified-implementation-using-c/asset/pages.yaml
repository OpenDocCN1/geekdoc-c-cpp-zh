    # 5.6 APPLICATION OF STACK


    Stack is applied in variety of applications. In majority of applications, usage
    of stack is either explicit or implicit. For instance, in non-recursive traversal
    of a tree this data structure is explicitly used. In the recursion, it is implicitly
    used by the program. Stack is widely utilized in the application such as parenthesis
    matching, infix to postfix conversion, evaluation of complex expression etc. Applications
    utilizing stack have been discussed in the upcoming sub-section.'
