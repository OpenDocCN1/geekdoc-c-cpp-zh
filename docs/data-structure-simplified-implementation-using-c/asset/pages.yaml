    us to place the item at appropriate location within an array, thereby entails
    us to search in minimum time, in the event of searching from an array. Although,
    various functions exist that entail us to create the unique address, however,
    we have limited ourselves upto prominent hashing functions, and same has been
    discussed in the upcoming section.


