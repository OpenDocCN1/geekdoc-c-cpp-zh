    madam, Malayalam, nitin, pop etc. is widely used string palindrome.


    To determine whether the string is palindrome or not first element is compared
    with the last element, second element with the penultimate element, so on and
    so forth, till we don’t reach to the mid element. If all these elements are same
    then the given string is known as palindrome otherwise it is not a palindrome.
    Function to determine the palindrome has been given below.


    ```

    ```c

    // Program to determine the string is palindrome, (// creating

    function palindrome and accepting one argument of string type)


    int palindrome(char str[])

    {

    int l=length(str);       // finding out length of the string


    int i=0, flag=1;


    while(i<=l) // executing the loop upto center element

    {


    if(str[i]!=str[l])

    {

    flag=0;                 // setting the flag value to false and breaking

    the loop

    break

    }

    i--;

    l--;

    }


    return flag;            // returning the value of flag to the calling

    function

    }

    ```

