    # 7.5 DELETION OF A NODE


    Data inserted in the BST is required to be deleted in the event when it is no
    longer needed. Deletion of a node in a BST is more cumbersome relative to the
    insertion of the node. The node to be deleted is termed as target node. During
    deletion of a target node, followings are the various cases that have been considered:


    +   - Target node does not have any child node (leaf node).

    +   - Target node has only one child (may be left or right).

    +   - Target node has both the children.


    Deletion of a node for all the above cases has been discussed as follows:


    Case a): To delete a node that does not have any child, we need to determine its
    parent. Once the parent is known, simply make the child pointer of this parent
    node as NULL, since it will not have any other node.


    Case b): In this case, we have considered that the node to be deleted has only
    one child. This child node may be at the left or the right branch of the target
    node of a BST. In this case, we need to determine the parent node of the node
    to be deleted. Once, the parent node is determined, we have to find out whether
    the node to be deleted is left of the parent or the right node. Connect the parent
    node of the target node (node to be deleted) to the child node of the node to
    be deleted. Same has been illustrated in the figure 7.15 (a).'
