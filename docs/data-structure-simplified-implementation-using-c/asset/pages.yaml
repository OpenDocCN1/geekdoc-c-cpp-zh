  md: 'Efficiency of shortest path algorithm is determined with the help of


    +   - Accuracy of algorithm

    +   - Efficiency of the path selected.


    The principal objective is to figure out the shortest path in order to minimize
    the latency.


    In the Dijkshstra’s algorithm other than the source, we consider all the nodes
    are at the infinite distance. Consequently, infinity is assigned to all nodes.
    Consider the figure of 13.19; we have to determine the shortest path from the
    source A to the destination H. Complete procedure has been depicted as follows:


    +   i. Find out all the adjacent nodes from the source.

    +   ii. Figure out the instance from source to the other adjacent node and select
    the one with minimum value. Consider it as B. Mark this node as visited and the
    distance value will be 1.

    +   iii. Find out the total distances of all the open nodes. Here, open nodes
    from B are C and D, with total distance would be 5 and 4 respectively. Similarly
    open nodes from A are D and E. Total distance from D and E is 5, 7 respectively.

    +   iv. Among the available options, smallest is 4 therefore next milestone D
    will be selected. Value of D will be 4.

    +   v. Now the backward path, i.e. from A to D will not be considered since, shortest
    path from A to D is already known.

    +   vi. Now the open path is C, F, E.


