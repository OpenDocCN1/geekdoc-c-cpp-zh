    # 3.12 CIRCULAR LINK LIST


    In the link list, user can traverse only in one direction that is from the first
    node towards the last node. Once the last node is reached, there is no way to
    traverse backwards towards the first node, since link list allows to traverse
    only in one direction as it maintains the pointer of next node only. To overcome
    this limitation, a modification is suggested and same can be incorporated in the
    link list by connecting the last node pointer to the first node. List in which
    last node is connected to the first node is termed as circular link list.


    # 3.12.1 Creating Circular link list


    Creation of node in a circular link list is similar to linear link list. However,
    special attention is needed on the first node during the creation step. First
    node’s next pointer in a circular link list will not be pointed to the NULL, instead
    it will be connected to itself as illustrated in the figure 3.17. When the circular
    list grows, new node is to be placed after this first node. Here again, next pointer
    of the newnode is to be pointed to the first node. This is accomplished by replacing
    the pointer of first node to the pointer of new node. Detail steps are illustrated
    in the following figures.


    ![](img/9b7c80a1312a664ae505ba138aa3306b_93_0.png)'
