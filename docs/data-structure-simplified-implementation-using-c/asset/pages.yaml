  md: '# Function template using two arguments


    Similar to one argument type template function, we can create two argument type
    template functions. Thereby, it will enable us to pass two arguments of different
    data types.


    Consider the case that we are aiming to print the first argument based on the
    value of second argument i.e. the number of times the value of second variable.
    First argument may be any data type. Same has been illustrated with the help of
    following example:


    ```

    // Function template type, accepting two different types of arguments

    template<class type1, class type2>

    void display (type1 one, type2 two)

    {

    int i=0;

    while (i<two) {

    cout<<one<<"\t";

    i++;

    } //end of while

    }//end of function

    int main ()

    {

    clrscr ();

    display ("jitendra", 5);

    display (58, 3);

    getch ();

    return 0;

    }

    Output

    jitendra    jitendra    jitendra    jitendra    jitendra

    58    58    58

    }

    ```


    In the above program, first we pass the string and the number of times passed
    string is to be printed. Consequently, at the time of called function display
    ("jitendra", 5), it will display the name ''jitendra 5'' times. In the second
    call we pass the integer type by display (58, 3), therefore, 58 is printed 3 times.'
