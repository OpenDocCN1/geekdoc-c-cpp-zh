    # B. Insertion other than the first position


    In this case, we have assumed that the node is to be inserted other than the first
    position in a doubly link list. It means that the position any value ranging from
    the second onwards including last. Whenever, we will insert the node at any other
    position after first node i.e. in the middle position or at the last position
    of the given link list, we need to create the space for positioning the new node
    and attaching this new node with the previous and the forward node. We will follow
    the following steps:


    +   - Create a new node.

    +   - Traverse to the position, where the node is to be inserted.

    +   - Connect the next pointer of the newnode node to the forward node.

    +   - Connect the previous pointer of the newnode to the current node.

    +   - Finally, connect the next pointer of the reached node to this newnode.


