    of the code but also increases the effort of re-writing the code. In addition,
    error may creep in during the re-writing of the code.


    # USE OF A TEMPLATE


    Template enable us to write the code once that is applicable for all the data
    types provided the number of parameters are same. Template has been discussed
    in detail in the upcoming section. Broadly, templates can be categorized into


    +   - Class template

    +   - Function template


    Class templates are used in the cases where we need to send the data type for
    the entire class as with the above example. Similarly, function templates can
    be used as a function that accept the argument of any type and perform the function
    needed. Eventually, function template terminates with the return type and capable
    of returning any type of value similar to other functions.


    # CLASS TEMPLATE


    Class template is used in cases where the data type is to be created that need
    to be accessed by many members of the class. To create the template we have to
    use the syntax


    # Class template with single argument type


    template<class type>


    Here the type may be the build-in type or the user defined type. In our case,
    we have represented it with the small ‘t’, consequently, the statement will be


    template<class t>


    we can define more than one type in the arguments, if needed. Correspondingly,
    class can accept more than one data type. Syntax for more than one data types
    is:


    template< class t1, class t2,......., class tn>


    In the above template, upto ‘n’ types of arguments have been passed, however,
    we will be restricted upto two argument types.'
