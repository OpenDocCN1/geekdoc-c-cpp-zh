    to the tree definition.


    As illustrated in the figure 7.6, first the root node is created and it is having
    the value of 20 and its left and right node will be pointing to the NULL. The
    other elements are compared with this node. Element with greater to its parent
    node, they will be attached to the right, otherwise'
