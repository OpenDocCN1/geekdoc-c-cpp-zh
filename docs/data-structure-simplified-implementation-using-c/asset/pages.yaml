    # Function template


    Function template is used to create the generic function. Consequently, same function
    can be used for wide variety of data types. To declare that the function is template
    type, we define the function with the keyword template similar to that of class
    type. Syntax for declaring the generic function can be written as follows:


    ```

    template<class t>

    return-type function_name (class t);

