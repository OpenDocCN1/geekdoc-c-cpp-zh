- pgno: 185
  md: "In a circular queue, items are still inserted from the rear. Insertion operation\
    \ remains continue till front is not encountered. In a circular queue, value of\
    \ rear moves between '0' to the 'size - 1'. When rear attends the maximum value,\
    \ its next value is reinitialized with zero. This is accomplished with the usage\
    \ of mod operator. We are aware of that the mod is widely used in calculating\
    \ the remainder and this remainder will not go beyond the value of its right side\
    \ number. For instance, if the size of the queue is 4 then due to the usage of\
    \ remainder method, the potential values will lie in the range of 0 to 3 only.\n\
    \nTo insert the element in the queue, we have created the 'insert' function. This\
    \ function accepts one argument as integer type and does not return a value. To\
    \ insert the values, we have increment the rear. Once rear is incremented, it\
    \ is always examined with the front; so that it should not overlap the front (does\
    \ not insert the value more than the capacity of the queue). Complete function\
    \ has been enumerated in the following example.\n\n```\n// Program to insert the\
    \ item in a circular queue.\nvoid insert (int &n)\n{\n    if ((rear+1) %size!=front)\n\
    \    {\n        rear= (rear+1) %size;\n        queue [rear] =n;\n        if (front<0)\n\
