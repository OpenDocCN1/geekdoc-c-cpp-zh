    # 3.9.4　Shift based method


    In the shift based method, node accessed is shifted one position toward the beginning
    side. This method is fairly similar with the count based method. Working of shift
    based method has


    ![](img/9b7c80a1312a664ae505ba138aa3306b_82_0.png)


    **Figure 3-15:** Organizing of link list based on FCFS


    been demonstrated in the figure 3.16. However, in count based method, position
    is primarily decided by the count method, but in the shift based method, it is
    decided by the last accessibility. For instance the node which is available at
    the first position might have been accessed 5 times that’s why it has been placed
    at first position whereas the second node might have not been accessed even once
    then also it is in the second position. As soon as second node is accessed it
    will replaced with the first node irrespective of the time it has been accessed
    previously.


    # 3.9.5　Skip List


    To significantly improve the performance a new type of list known as skip list
    has been devised. Skip list is the special case of orderly link list in which
    while organizing and traversing we are skipping some of the nodes. In this type
    of list, instead of traversing node by node, a number of nodes are skipped to
    improve the performance during traversal or searching of a node. This type of
    link list has substantial advantages over other types of link list described earlier.
    Two widely used skip lists are :


    +   - Even skip list

    +   - Random skip list'
