    # 6.2.1 Static Queue


    If the size of the queue is declared at the time of creation, then such type of
    queue is known as static queue. In this queue, elements are inserted from the
    end known as rear, once the items are inserted, corresponding to that rear pointer
    moves from the front towards the rear end. Once the rear has reached to the extreme
    end (threshold of the queue) then more items cannot be inserted. If we attempt
    to insert more items in a queue that is already full then it is known as overflow.


    Insertion of the items inside the queue is also known as enqueue. Initially, front
    and rear has


    ![](img/9b7c80a1312a664ae505ba138aa3306b_170_0.png)


    been initialized with -1. Therefore, they are not pointing to any of the index
    of a queue and denoting the empty condition. Once the first item is inserted than
    first is initialize with 0, correspondingly, rear is also incremented. Enqueue
    of item governs the position/movement of rear index of a queue. During insertion,
    maximum value of rear can reached equal to the size of the queue. Once rear is
    reached to the last position, insertion of any further elements will leads to
    overflow.


    Complete working of a queue during insertion phase has been illustrated in the
    figure 6.3.


    ![](img/9b7c80a1312a664ae505ba138aa3306b_170_1.png)


    In the static queue, first and foremost requirement is to define the size of the
    queue in order to ensure that the size needed for the queue can be allocated at
    the compile time itself.'
