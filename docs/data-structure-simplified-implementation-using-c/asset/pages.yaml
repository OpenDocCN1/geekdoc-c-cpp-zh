  md: '# Chapter 13


    # Elementary Graphs


    # Chapter Objective


    +   - Defining the graph and its terminology.

    +   - Discussing the various types of graph

    +   - Representing the graph

    +   - Traversal in a graph

    +   - Minimum spanning tree in a graph

    +   - Shortest path in a graph


    # 13.1 INTRODUCTION


    Previous chapters were entirely dedicated to linear data structure or the tree
    data structure. Tree forms one-to-many relationship from parent to the child.
    At the same time, it does not form the cycle. Even though, tree is one of the
    widely used data structures, yet does not fulfills many of the objective. For
    instance, consider the case if the data need to be send to the shortest path,
    at the same time, acknowledge of success or failure need to be returned. In such
    requirement, there is a specific need of a path that should have multiple connections.
    At the same time, should have way for the return. To fulfill this objective, we
    use a new data structure known as Graph.


    # 13.2 BASIC DEFINITIONS


    A graph consist of vertex (similar to node of a tree), various vertices are connected
    together with the help of edges. In any graph, we have collection of vertices
    and edges.


    # A. Graph


    A graph ‘G’ can be defined as a data structure encompassing of finite set of non-empty
    vertices (V) and set of edges ‘E’. Graph ‘G’ is represented by a tuple (V, E).
    In a graph, vertices have names and can represent the other properties. In graph,
    edges are used to represent the relationship between two objects. For instance,
    distance between the two vertices. Figure 13.1 consist of 08 vertices namely ‘a’,
    ‘b’, ‘c’,‘d’, ‘e’, ‘f’, ‘g’, ‘h’. Each vertex is connected with pair of vertices.'
  merge: -1
  img_proc: true
