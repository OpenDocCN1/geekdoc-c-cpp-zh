    cout<<endl;\n}\n```\n\n# 4.5 INSERTING ITEM (NODE) IN A DOUBLY LINK LIST\n\nIn\
    \ a doubly link list, a new node can be inserted at any position including first,\
    \ middle or at last position. In a doubly link list insertion of the node is less\
    \ cumbersome relative to the singly link list. Complexity is reduced due to the\
    \ availability of two pointers that exist in the doubly link list. During insertion\
    \ of a node in a doubly link list, following sequence of steps need to be followed:\n\
    \n+   - Accept the position where new node is to be inserted.\n+   - Intending\
    \ position where node is to be inserted should be less than or equal to length\
    \ of the doubly link list, if it is more than total number of nodes, in that case\
    \ node cannot be inserted.\n+   - If the above condition is fulfilled, then traverse\
    \ upto the node that is just before which the node is to be inserted. Assume that\
    \ this node is termed as previous node.\n+   - Find out the next pointer of the\
    \ current node.\n+   - Connect the new node with the forward node and the node\
    \ lies before this current node i.e. previous node.\n+   - If the node is to be\
    \ inserted at the first position in that case the pointer of the first node should\
    \ be changed to this new node.\n+   - Similarly, if the node to be inserted is\
    \ the last node, change the pointer of the last node to this new node.\n\nAll\
    \ the above cases have been discussed in forthcoming sub-sections.\n\n# A. Insertion\
    \ at the beginning\n\nIn a doubly link list, node can be inserted at the beginning\
    \ of a link list but in that case the first pointer will be shifted to this new\
    \ node that is attached at the first position. Complete process has been defined\
    \ as follows:\n\n+   - Create the new node.\n+   - Connect its next pointer to\
    \ the already existing first pointer.\n+   - Change the exisiting first node’s\
    \ pointer to the pointer of the node that has been just inserted."
