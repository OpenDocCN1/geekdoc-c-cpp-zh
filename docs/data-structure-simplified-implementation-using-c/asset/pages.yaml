  md: '# Salient Features


    Data structure is an extremely important subject in computer science. A number
    of books on this subject are available and are enriching the students based on
    their own methodology. However, this book is written in a manner so that readers
    can learn data structure with the help of this book itself. Other features of
    this book are:


    +   > Use of simple language for coding.

    +   > Major focus on link list, tree, stack, and queue.

    +   > Special emphasis on recursion.

    +   > In majority of the cases, both recursive and non-recursive functions have
    been used for single operation.

    +   > Object oriented approach using C++ to code the program.

    +   > Objective of each chapter discussed in the beginning.

    +   > Code is substantiated with ample of figures and description.

    +   > All the written codes are tested and executed.

    +   > Equally beneficial for the novice as well as experts.

    +   > Each chapter is followed by case study.

    +   > Inclusion of exercise at the end of the chapter to enable readers to evaluate
    themselves.'
