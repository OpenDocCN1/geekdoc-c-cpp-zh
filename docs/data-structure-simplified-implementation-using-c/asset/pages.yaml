    # 8.4 INSERTING THE NODE(S) IN A THREADED TREE


    Insertion of an item/node in a threaded tree is a complex procedure and precautions
    need to be exercised due to the following reasons:


    +   - Identifying the location where node is to be inserted in a threaded tree.

    +   - Adjusting the left and right side pointer of this new node.

    +   - Adjusting the pointers and thread of a node acting as a parent node of a
    new node.

    +   - Consider a case that only root node exists in the in-order threaded tree,
    in this case the left and right node will not have the node. Consequently, it''s
    left and right thread will point to the NULL.

    +   - In all other cases left thread is connected to the in-order predecessor
    and right thread is connected to the in-order successor. In the event of no predecessor
    or successor exist. In these cases, the thread will be connected to the root node.'
