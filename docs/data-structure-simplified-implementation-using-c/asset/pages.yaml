- pgno: 7
  md: '# Preface


    This book has been written to develop the necessary skill needed to understand
    the data structure concept and programming. Important topics of data structure
    are extensively covered. We have started our book from Abstract data type and
    algorithm. In abstract data type, we have discussed about the significance of
    Abstract data type in data structure. The second focus of this chapter is to highlight
    the significance of algorithm in designing and solving the computer problems.
    We believe that understanding of this topic before the implementation of other
    topics will enable the readers in effective reading as well as writing of code.
    Mere writing the algorithm is not enough, instead writing an efficient algorithm
    is the need of an hour. This can be accomplished with the help of an efficient
    and effective algorithm writing and same has been highlighted in the remaining
    chapters.


    Arrays and pointers are one of the most important topics in data structure. Familiarization
    with these topics at early stage of learning will facilitates readers in comprehensive
    learning of complex code that is written using pointers and array. This chapter
    covers the usage of array and pointers. To ensure that the students have grasped
    the concept completely, enough exercises along with their answers have been included
    within the chapter as well as at the end of the chapter. Strong understanding
    of arrays and pointers will be extremely helpful in understanding the advance
    topics, including the link list, stack, trees among others.


    In areas where access of one item after another is needed, link list is most appropriate
    for such type of requirements. Usage of link list allows the linear traversal.
    In link list, user can traverse with the help of next pointer that is stored in
    each node of a link list. Various aspects of link list including insertion of
    the node at any position and deletion of any node is discussed in detail. Majority
    of the topics related to the link list are extensively covered. This topic is
    discussed before the stack to highlight the concept of dynamic memory allocation
    and organizing the element in a dynamic data structure. This will also assist
    readers in the creation of dynamic stack that is widely used in subsequent chapters
    of the book.


    The next two chapters are related to the arrangement and accessing of the item.
    We have started it from the data structure that is opened from one end. This data
    structure is termed as stack. The second data structure is also related to the
    arrangement of item(s). However, it is equipped with two ends and knows as queue.
    One end is utilized for insertion whereas the other one is utilized for the removal
    of items. We will be widely utilizing this data structure in the other chapters
    of this book wherever we need to store the element and access them in the order
    of insertion.


    Linear data structure is followed by non-linear data structure and started with
    definition of trees and the need of the tree. Heading further, we have discussed
    the special case of a tree known as a binary search tree (BST). Major concepts
    pertaining to BST including insertion of a node, traversal in a BST, deletion
    of the node have been extensively covered. In addition, we have also covered the
    programming of tree in detail. All the programs written in this chapter and the
    subsequent chapters are adequately tested (Turboc compiler) before including them
    in this text book.


    Further extending the topic of tree, we have considered the advance tree in which
    the major limitations'
