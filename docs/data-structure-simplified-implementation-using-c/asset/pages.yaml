  md: '# 7.9.2 Recursive Approach for Mirroring


    In the recursive method, we follow the bottom up approach thereby nodes at the
    highest level (bottommost) is transposed first. This is followed by the nodes
    above it. Complete program to demonstrate the mirroring has been depicted below:


    ```

    Problem: Recursive function for the mirroring

    void bst:: mirror(bnode *root)

    {

    if(root==NULL)

    return;

    else

    {

    bnode *temp;

    mirror(root->left);

    mirror(root->right);

    temp=root->left;

    root->left=root->right;

    root->right=temp;

    }

    }

    ```


    To understand the functioning of mirroring using recursive function, consider
    the tree illustrated in the figure 7.19. Recursive function mirror(root->left)
    will enable us to reach the left most node of a tree. It will be followed by right
    side traversal. Since, it does not have the right node. Consequently, node with
    the value 20 will act as root. Since, it does not consist of any children therefore
    no changes will be visible.


    It is followed by the node 30, since node with the value 30 doesn’t have the right
    node, therefore, no rightward movement will take place. Now 30 is acting as the
    root node. Following statements such as temp=root->left will hold the address
    of the left node, since it does have the NULL node at the right. Consequently,
    20 will be attached to the right and NULL will be attached to the left of the
    root node(30).


    Afterwards, 50 will be returned, it is followed by one step right that is 90.
    Followed by reaching to the extreme left. In the given tree it is 70. Since 70
    doesn’t have the right and left child consequently, no change will be visible.
    Next node accessed will be 90, it is followed by shifting one step right i.e.
    node 120 and followed by extreme left. In the given case it is 105. Since, 105
    doesn’t have any child therefore, changes made by left and right attachment(swap)
    will not be visible. It is followed by the node just above i.e. 120. Node 105
    will result as right node of 120.'
