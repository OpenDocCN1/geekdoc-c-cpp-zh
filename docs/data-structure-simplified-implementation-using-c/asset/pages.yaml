    # 11.3.2 Knuth Morris Pratt (KMP)


    Brute force algorithm is suffering from the major limitation that it is evaluating
    the string from the beginning and continues to match till mismatch does not occurs
    or the string is not exhausted. In case of mismatch, it will start checking the
    1st index (or the next address from where the last time it has started). It never
    consider that possibility of pattern existence will be less from the 1st index
    once the matching already taken place upto 4th or 5th character. Consequently,
    it is termed that brute force algorithm never applies any intelligence. For instance,
    consider a case that we have started comparison from the beginning, first character
    of the string and the given pattern is matching, second is also matching, and
    third is also matching. However, mismatch has occurred at the fourth location.
    In this case there is no probability of string existence from the second element.
    Any probability of matching will start from the 5th character only. However, this
    case has not been considered by the Brute force, instead it will start searching
    from the next (here in this case second) character.


    The above limitation has been addressed by the Knuth Morris Pratt or (KMP). In
    this algorithm, we start from the beginning and compare the pattern with the string
