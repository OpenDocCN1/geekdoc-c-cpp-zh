    # 1.4 COMPLEXITY ANALYSIS


    A number of methods can be applied to solve a problem. Programmers solve the problem(s)
    as per their perceptions and understandings. Due to the existence of variety of
    solutions, it becomes extremely challenging to select the solution that yields
    the best performance.


    Selection of an optimum solution is governed by various factors, for instance,
    computation cycle needed to solve a problem, space requirement in memory, storage
    requirement etc. Solution that needs minimum time to compute, minimum space in
    memory is considered as the optimum solution.


    Algorithms which are selected based on time and space requirement are known as
    asymptotic. In such type of algorithms, we compute the complexity in account of
    best or worst cases. Analysis is one of the major components of any algorithm
    written. In best cases, an algorithm can solve the given problem in few iteration
    or in best case even in one iteration. However, in worst case it can solve the
    considered problem in last step or penultimate step.


    Other method to compute the efficiency is termed as amortized method. In the amortized
    method, we do not compute the efficiency of an algorithm in best or worst cases
    instead in terms of average time. However, in asymptotic, complexity efficiency
    is determined in terms of:


    +   - Maximum time needed.

    +   - Minimum time needed.

    +   - Equal time needed.


    Accordingly, they are categorized into lower bound, upper bound, equal bound etc.
    In this book, we have considered big (O) that represent the upper bound.


    # 1.4.1 Big-Oh


    Big Oh for a function with ''n'' numbers can be defined as f (n) <=c*g (n) for
    all n, n>=n0;Big (Oh) acts as an upper bound that means it represent the complexity
    in the maximum terms. However, algorithm in real time may need lesser time than
    the one denoted by the Big (O).


    Mastering big ''O'' complexity is the major challenge to the students who have
    left the mathematics or could not remember many of the formulae. In big Oh, major
