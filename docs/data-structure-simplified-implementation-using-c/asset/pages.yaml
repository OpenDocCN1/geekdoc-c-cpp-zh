  md: 'Prior to exploring the conversion methods, it is worth to understand that any
    expression is consist of two components namely operator and operand. Operators
    denotes the operations to be performed on operand. Consider the following expressions


    3+6*5-56/28


    We can classify them as


    Operator: +, *, -, /


    Operand: 3, 6, 5, 56, 28


    During the conversion phase, priority of the expression operators aligning with
    the one BODMAS is taken into account. During the scanning phase, operators are
    pushed into the stack one by one. As soon as operator with lower priority from
    the one available at the top of the stack is encountered, previously pushed operators
    are popped from the stack. In the expression 3+6*5-56/28, first + will be pushed
    into the stack, this is followed by ''*''. When – is encountered in that case,
    all the operators pushed earlier will be popped from the stack, since operator
    with lower priority from the top i.e. (*) of stack is encountered. Consequently,
    the expression will appear as


    3,6,5 *+


    Afterwards, push operation will commence again and rest of the operators will
    be pushed. Since, no operator with the lower priority is encountered but the expression
    is exhausted therefore, all the operators pushed into the stack will be popped.
