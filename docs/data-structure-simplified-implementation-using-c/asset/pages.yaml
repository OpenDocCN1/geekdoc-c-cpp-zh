  md: 'Based on our day today experience, we know that in a given list some items
    are more frequently used relative to others. Self-organizing list draws the advantage
    of this trend and organizes the node according to the accessibility. Possible
    method by which list can be organized are:


    +   - Ordered based.

    +   - FCFS based.

    +   - Count method.

    +   - Shift based method.


    # 3.9.1 Ordered List


    In the ordered list, items are arranged based on their values. This signifies
    that items are arranged in ascending or descending order. In the event of arrival
    of a new item, it is inserted in the existing link list based on its value. This
    position can be at the beginning, at the center or at the end. We have already
    discussed the orderly link list in detail in earlier section. However, differences
    has been discussed herein, and same is again illustrated in figure 3.13.


    ![](img/9b7c80a1312a664ae505ba138aa3306b_80_0.png)


    Ordered link list has the following advantages over the ordinary link list.


    +   - During insertion of the node, we traverse till a node with greater value
    is not encountered or the list is not exhausted.

    +   - During removal again traversal is taking place till the node comprising
    of the target value is not found or nodes are less than the node to be searched,
    after which searching terminates.'
