    # G. Path


    Path in a graph is a set of vertices used to reach from the source to the destination.
    For instance, consider the graph of figure 13.2 the path between the sources ‘a’
    to the destination ‘f’ is ‘ac-> ce-> ef’.


    The graphs in which the path encompasses of all the vertices of a graph then it
    is known as Hamiltonian path.


    # H. Cycle


    In any graph, if we start from the source vertex and return to the vertex from
    where we have started(source vertex), then we term that the cycle is formed. In
    the directed graph, we may have a path from source to destination that may not
    form the cycle. However, in the undirected graph probability that the cycle is
    formed is increasingly higher, since, undirected graph does not involve the direction.


