  md: '# Advance Tree


    # Chapter Objective


    +   - Defining the limitation of a BST

    +   - Defining the threaded tree

    +   - Defining the various types of threaded tree

    +   - Defining the limitation of BST related to the height

    +   - Defining the AVL tree

    +   - Inserting the node in an AVL tree

    +   - Discuss various types of rotation in an AVL tree

    +   - Adjusting the balancing factor of an AVL tree.


    # 8.1 ADVANCE TREE


    BST that is discussed in the previous chapter suffers from various limitations
    which include inability of backward traversal, existence of many NULL nodes etc.
    Another major limitation of the BST is that it acts as a link list, if BST is
    to be created from the series that is in ascending or descending order. To overcome
    these limitations, advance tree such as threaded tree and AVL tree can be used.
    Threaded tree is useful in addressing the number of NULL nodes in a BST, at the
    same time facilitates the backward traversal. AVL addresses the BST behavior of
    skewing in one direction. Both of these topics have been described in the rest
    of the chapter.


    # 8.2 THREADED TREE


    Threaded tree is a special case of a BST, correspondingly, it requires additional
    component to represent thread. Variety of threaded trees are existing, these threaded
    tree can be used for their specific scenario. Major types of threaded tree that
    exist include:


    +   - Left threaded tree

    +   - Right threaded tree

    +   - In-order threaded


    BST in which only left pointer (having NULL) of a node is acting as a thread such
    tree is known as Left-in threaded tree. Similarly, BST in which only right pointer
    (having NULL) of a node is acting as thread, such BST is known as right-in threaded
    tree. Tree in which both left and right pointers of a node are acting as thread
    then it is known as in-threaded tree. Considering the complexity of in-threaded
    tree, we have described this (in-threaded)'
