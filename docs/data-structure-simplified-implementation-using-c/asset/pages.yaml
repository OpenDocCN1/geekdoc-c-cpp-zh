  md: '# D. Quick Sort


    Quick sort is a widely used technique to sort series. In each pass, series is
    divided into parts. Pivot element governs the place from where the series is to
    be divided. Pivot element can be defined as the first element of the series that
    need to be placed at appropriate place. All the elements left to it are smaller
    than the pivot element whereas all the element greater than the pivot elements
    are placed to its right.


    Placing the pivot element at appropriate place need number of iterations. Movement
    terminates as soon as item encountered is greater than the pivot element. Index
    of this element is stored and termed as lower index. After that pivot element
    is moved from the extreme right towards the left till the elements is greater
    than the pivot element. As soon as the item less than the pivot element is encountered
    than we terminate here. This place is termed as upper index. If lower index is
    less than the upper index than both the items are swapped. This is followed by
    comparing the elements from the left side where we have left (left index) and
    applying the procedure from the right as one already discussed. After the complete
    process, the pivot element is placed at exact position. Items to the left of the
    pivot will be less and the items right of the pivot elements will be greater.
    Consider the series of


    ![](img/9b7c80a1312a664ae505ba138aa3306b_286_0.png)


    figure 10.4.


    In this series there are total 09 elements. Therefore, lower index will be 0,
    whereas the upper index will be 07. In the given series, the first element is
    34, this element is known as pivot element. This element is compared with the
    other elements of the series (starting from the left side of the series) one by
    one. This comparison starts from left; in our case we have considered the left
    hand side as starting point. During movement towards the right, we ensure that
    the element encountered is less than the pivot element. If the element is not
    smaller, our traversal terminates and we have to check starting from the right
    most position. From right side, we continue to move towards the left till elements
    encountered are less than the pivot element is encountered. The moment element
    that is smaller than the pivot is encountered, we terminate the movement, and
    here we exchange both the elements (greater of the left side to the smaller of
    right side) that are items at lower index with the item at upper index.'
