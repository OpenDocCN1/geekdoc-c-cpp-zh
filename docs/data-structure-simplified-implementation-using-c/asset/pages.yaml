    As mentioned earlier, queue suffers with a limitation due to the movement of front
    towards rear. Consequently, empty space created due to the movement of front is
    not utilized. Even though shifting has been suggested as one of the methods to
    remove the empty space at the front of a queue, however, overhead caused due to
