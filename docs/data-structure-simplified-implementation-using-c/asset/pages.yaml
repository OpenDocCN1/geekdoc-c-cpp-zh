    # 3.9 SELF-ORGANIZING LIST


    Link list is the linear data structure,as a reslt, whenever user needs to carry
    out any operation, he has to start from the first node and traverse the subsequent
    node one after another node till target node is not reached or list is exhausted.
    Therefore, efficiency of a list is dependent on the size of a list. If the list
    is large in that case, efficiency of the link list drops. To overcome this limitation,
    a new version of link list known as self-organizing list is devised. Self-organizing
    list is capable of reorganizing the node based on its usage criterian. Consequently,
    it yields better performance relative to the normal link list.'
