    # 14.1 RECURSION


    Computer programs are used to solve the problem undertaken. Program comprise of
    functions, which are set of statements that need to be executed. To execute the
    set of statements in function various methods exist. Broadly, the statements executed
    falls into the following categories:


    +   - Iterative

    +   - Recursive


    In the iterative method, loops are used to execute the statement(s) more than
    once. Another approach to execute the group of statements is profoundly popular
    and known as recursion. It is equally significant and widely used.


    # 14.2 DEFINING RECURSION


    In recursion, function calls to itself number of times. In other terms, function
    solves the problems in its own terms. Recursion like other function accepts the
    parameters, compute the value of variables (or complete the task undertaken) and
    return the computed value to the caller. As the definition of recursion suggests
    that function calls itself more than once, therefore, we need to regulate the
    call in order to avoid the infinite calling. This is achieved with the help of
    base condition.


    User need to learn few basic terms for the deep understanding of recursion. This
    will greatly enhance the users capability of writing effective recursive functions.
    These basic terms include:'
