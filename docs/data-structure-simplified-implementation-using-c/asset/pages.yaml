    {

    j=0;

    index=i;

    {

    while ((st[i]!=''\0'')&& (pattern[j]!=''\0''))

    {

    if (st[i]==pattern[j])

    {

    i++;

    j++;

    }

    } // end of inner while loop

    ```'
