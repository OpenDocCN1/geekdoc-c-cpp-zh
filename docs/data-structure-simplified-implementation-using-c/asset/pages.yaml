  md: '![](img/9b7c80a1312a664ae505ba138aa3306b_325_0.png)


    Figure 13-9: Weighted graph


    # 13.4.1 Kruskal''s Algorithm


    In the Kruskal''s algorithm, to determine the minimum spanning tree, weight are
    considered in the increasing order. A graph having ''n'' vertex will have a forest
    of ''n'' tree. In each step, one edge is considered that is minimum from all available
    edges. Minimum edge is considered only if it is not forming the cycle in a tree.


    In the graph of figure 13.9, the edge that will have minimum weight will be selected.
    In the considered graph the edge of vertex V3,5 is having the minimum weight,
    i.e. 4. Consequently, it will be selected first. Same has been illustrated in
    the figure 13.10 (b).


    In the next step, the other minimum edge is considered from the available edges.
    Now, the minimum node among the available set is 7, that is the edge connecting
    the vertex V1,2. Resultant spanning tree will be as illustrated in the figure
    13.11. Similarly, other edges are considered in the increasing order. The other
    edge that will be considered is E1,3, weight associated with this vertex is 15.
    After selection of 15, the next edge is E2,4 which is 19, but if this edge will
    be selected the cycle will be formed, therefore, this edge will be dropped. The
    next weight is 20 that is related to the edge "e5,6" is selected. Even though,
    other edges are left but they cannot be selected as they will result in the cycle.
    Finally, weight associated with this graph (MST) can be computed by adding all
    the weight of the MST thus obtained.


    Total weight = 4+7+12+15+20

    =58'
