  md: '# 13.4 MINIMUM SPANNING TREE


    A graph “G” has been illustrated in the figure 13.8, this graph is forming the
    cycle. Graphs have drawn lot of attention in recent time. Many times it is compared
    with the tree due to the parent child relationship. But there is significant difference
    between the graph and tree. One significant difference between graph and tree
    is pertaining to the cycle. In graph, cycle may be formed; however, cycle cannot
    be formed in case of tree. Consider the graph of figure 13.8 (a), corresponding
    tree has been drawn in the figure 13.8(b). Tree of the figure 13.8(b) is similar
    to that of the tree that has been discussed in the earlier chapters. But the major
    difference is that it does not have explicit root. In the undirected graph, parent
    child relationship is also not apparent. Consequently, we can term tree as a graph
    which does not have a cycle.


    A sub-graph of figure 13.8(a) that comprises of all the vertex and not forming
    the cycle has been illustrated in the figure 13.8 (b).


    A minimum spanning tree is the sub-graph (tree) of a graph that forms a tree by
    selecting the minimum weight of a sub-graph. There are various algorithm existing
    that can be used in creating minimum spanning tree. Each of them create the minimum
    spanning tree in their own way. Some of the prominent algorithms have been discussed
    in the upcoming sub-section.


    ![](img/9b7c80a1312a664ae505ba138aa3306b_324_0.png)


    Figure 13-8: Graph to tree conversion'
