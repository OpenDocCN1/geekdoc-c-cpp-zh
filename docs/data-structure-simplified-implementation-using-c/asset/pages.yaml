    \ our discussion with non-recursive approach.\n\n# 7.9.1 Non-recursive method\n\
    \nIn the non-recursive method of mirroring, we will traverse level by level and\
    \ transpose the child attached to right and left side. In our approach, we have\
    \ inserted the node into the queue, we examine the queue in each iteration to\
    \ determine whether queue is exhausted or not. If the queue is empty then it signifies\
    \ that all the nodes have been traversed and the considered tree is transposed.\n\
    \nFrom the queue, we remove the node one by one which is followed by the exchange\
    \ of its left and right child. After that we have to examine the availability\
    \ of left and right node, if any one of them is available it is inserted into\
    \ the queue. In our discussed approach, we have followed the top down approach,\
    \ which means the mirroring has been started from the top and continued upto the\
    \ bottom. Step by step method has been illustrated in the figure 7.19"
