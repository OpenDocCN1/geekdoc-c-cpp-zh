    # 10.1 INTRODUCTION


    Sorting and searching are the basic operations for any collection of records maintained
    by any business entity. Query or record requested should be accessed in the minimum
    time. Delay in the accessibility result in poor experience. Sorted data facilitates
    in fast accessibility/searching of records. These two operations are complement
    to each other. The upcoming sections highlight the many of the prominent searching
    and sorting techniques that have significance for this topic.


    # 10.2 SEARCHING


    Sorting and searching are profoundly significant in data structure. In case of
    query, we need to search the record from the existing database. Searching time
    will be minimum in sorted list, relative to the list that is unsorted. In additions,
    accessing all the nodes or escaping some of them have great impact on the performance.
    According, searching is categorized into the following types.


    # 10.2.1 Linear Search


    In the linear search, data are randomly placed based on their arrival and no rule
    is applicable. In this method, each elements of the list is matched with the item
    to be searched. This process continues till element is not found or the list is
    not exhausted. Linear search is a simple method to implement but performance is
    low. Performance further degrades upon increasing the size of the list.


    ```

