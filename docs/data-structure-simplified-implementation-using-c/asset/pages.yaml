    # 13.6  SHORTEST PATH ALGORITHM


    Shortest path algorithm determines the shortest path in a graph from the selected
    source to any given destination. Many a time, we need to learn the shortest distance
    from the source to the destination to minimize the cost of traversing or to reduce
    the latency.


    To determine the shortest path from source to destination numerous algorithms
    exist. These algorithm can be significantly useful in reducing the overhead/cost
    associated in traversal from given source to the destination. Some of the prominent
    algorithm has been described in the following sub-sections.


    # 13.6.1  Dijkstra’s Algorithm


    Dijkstra’s algorithm is profoundly popular and widely used to determine the shortest
    path from the given source. This algorithm is applied in wide applications. For
    instance, in networking where we need to select the shortest path among the available
    list of paths.'
