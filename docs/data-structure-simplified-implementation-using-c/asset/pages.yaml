    # Class template with two arguments


    In many cases, we need to create the template for more than two data types. This
    can be accomplished in the class data type with the help passing two arguments.
    To achieve the above cited requirement, we can use the following syntax.


    template<class t1, class t2>


    Consider the following example in which programmer is aiming to accept two different
    types of arguments. In this case, we can use the template that can accept two
    arguments instead of one. Complete program for the above objective can be written
    as:


    ```

    // Program to enumerate the use of two argument type in the class

    template<class type1, class type2>

    class one

    {

    type1 first;

    type2 second;

    public:

    one (type1 o, type2 t);

    void display ();

    };

    template<class type1, class type2>

    one<type1, type2>:: one (type1 o, type2 t)

    {

    first=o;

    second=t;

    }

    template<class type1, class type2>

    void one<type1, type2>:: display ()

    ```'
