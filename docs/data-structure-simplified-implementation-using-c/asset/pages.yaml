    # 14.4.6 Indirect Recursion


    Indirect recursion is the special case of recursion in which function call to
    itself but after calling some of the other functions. For instance, if rec1 ()
    is the recursion function, it will call function A (), which may call some other
    function and finally the recursive function rec1 () will be called. Example of
    the indirect recursion has been depicted below:


    rec1()->A()->B()->C()->D()->rec1()


    In the above function, first recursive function rec1 () is called. It is followed
    by A (), and A () calls B (), followed by C (), followed by D (), Eventually,
    D () calls rec1 (). In such type of function calls where the cycle is formed is
    known as Indirect recursion. Figure 14.2 highlights the cycle that is formed by
    the Indirect recursion.


