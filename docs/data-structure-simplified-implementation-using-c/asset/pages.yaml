  md: '# Link List


    # Chapter Objective


    +   - Describe and create link list

    +   - Display/Traversal in a link list

    +   - Inserting a node at various position

    +   - Deletion of any node in a link list

    +   - Reversing the link list

    +   - Operator overloading in a link list

    +   - Application of a link list

    +   - Limitation of a link list and defining circular link list

    +   - Benefits of circular link list .


    # 3.1 INTRODUCTION


    Array suffers from the size limitations, specifically, if the number of elements
    to be stored in the array is not known in advance. In such cases usage of array
    is inefficient. Consider a case in which array size allocated is more but items
    to be inserted are less. This will lead to wastage of array space. On the other
    hand, if size of an array defined is less and elements to be stored in the array
    are more, in that case many elements would not be placed inside an array. To address
    the variable need of data storage, a new data structure known as link list has
    been envisioned.


    This chapter highlights many significant features of the link list that includes:


    +   - Creating the link list.

    +   - Display of the link list.

    +   - Inserting the node in a link list.

    +   - Deleting the node from a link list.

    +   - Usage of operator overloading in a link list( +operator)

    +   - Searching an item from a link list.

    +   - Orderly link list

    +   - Reversing the link list.

    +   - Circular Link list'
