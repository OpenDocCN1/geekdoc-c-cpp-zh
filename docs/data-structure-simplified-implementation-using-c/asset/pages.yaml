  md: 'Completely Balanced Binary tree: A binary tree can be termed as completely
    balance binary tree, if all its nodes, other than the leaf nodes are having both
    the nodes. In addition, all the leaf nodes must be at the same level. This property
    makes the completely balanced tree different from the almost balanced binary tree.


    ![](img/9b7c80a1312a664ae505ba138aa3306b_200_0.png)


    # 7.3 BINARY SEARCH TREE


    Binary search tree (BST) is the special case of a binary tree in which nodes are
    iplaced depending upon their values. BST has to follow additional restrictions
    that are applicable to the binary tree:


    +   - All the right nodes are more than the parent node.

    +   - All the left nodes are less than the parent node.

    +   - Comparison begin from the root, and continues upto leaf node is not encountered.
    i.e left pointer or the right pointer is not NULL.


    Therefore, while creating the BST special attention is to be paid, as explained
    in the upcoming section.


