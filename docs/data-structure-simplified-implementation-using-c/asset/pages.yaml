  md: '# 10.3 SORTING


    Items arranged in a list are in random order and yields lower performance during
    searching. Although, once we compute the complexity of sorted or unsorted array,
    it gives the same result; however, practically sorted array gives better performance
    relative to the unsorted array. Sorting can be broadly categorized into two:


    +   - External sorting

    +   - Internal sorting


    Sorting in which all the elements are not loaded into memory instead are available
    in secondary storage then such type of sorting is known as external sorting.


    The other type of sorting is known as internal sorting in which elements are stored
    in the memory for sorting. Due to availability of items in primary memory, internal
    sorting is faster relative to the external sorting. Sorting techniques that are
    discussed in this book are example of internal sorting.


    # A. Bubble Sort


    Bubble sort functions similar to the bubble that has the characteristics of rising
    to the upper surface due to light weight, in other words heavier elements settles
    downwards. Bubble sort uses the aforesaid technique. In the first pass, the heaviest
    element is arranged at the right most position. In the second pass, second highest
    element is arranged at the penultimate location of the list and so forth. Working
    of the bubble sort has been illustrated in the figure 10.1.


    ![](img/9b7c80a1312a664ae505ba138aa3306b_279_0.png)'
