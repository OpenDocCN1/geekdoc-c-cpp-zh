    non presence of the pattern should be flashed. Popular string matching algorithms
    are discussed in the upcoming sub-section.


    # 11.3.1 Brute force string matching


    In the brute force string matching algorithm, we try to recognize the presence
    of a pattern in the given string. In this method, string is examined for the presence
    of a pattern from the starting index ''0'', if the first character of the string
    and the pattern matches then we compare the next character, if any of the character
    of string and pattern is not matching in that case further examination is terminated.
    Afterwards, examination starts from 1st index of the string with 0th index of
    the pattern to examine the presence of pattern. We continue till pattern is not
    exhausted or the string is not exhausted. If the pattern is exhausted it indicates
    that the pattern exist in the given string. Program for the brute force has been
    described as follows.


    ```

    // Program to find out the pattern based on brute force algorithm

    int bforce(char st[], char pattern[])

