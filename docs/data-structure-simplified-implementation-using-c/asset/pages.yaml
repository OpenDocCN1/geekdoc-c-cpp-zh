  md: '# 3.2 CREATION OF LINK LIST


    The complex part of the link list is its creation. It can be accomplished by creating
    the nodes and then connecting them immediately after creation. In a link list,
    the smallest entity is node and is created dynamically. Each node consists of
    two parts


    +   - Data Part

    +   - Address part


    Data part is capable to hold the data in a node. This data may be simple type
    or complex type like structure or any other data type created by the user. Whereas,
    address part represent the address of next node. Initially, there is only one
    node therefore, it’s next pointer holds NULL. Structure of a node is illustrated
    in the figure 3.1.


    ![](img/9b7c80a1312a664ae505ba138aa3306b_60_0.png)


    In the figure 3.1, data part will hold the user’s data, whereas address part points
    to the address of a next node. Structure of a node can be defined as:


    ```

    // Creating the template for the node

    class node

    {

    public:

    int data;

    node *next;

    };

    ```


    During the dynamic creation of first node ‘new’ operator is used for allocation
    of address of next node. It is introduced in C++, since it was lacking in ‘C’
    language. New operator is an improvement over the earlier malloc function of ‘C’.
    For instance, no casting is needed in ‘new’ operator, whereas it was needed in
    malloc function. To create a node, we can use the syntax as given below:


    ```

    node *one;

    one=new node;// node created

    one->data=10;

    one->next=NULL;

    ```


    # A. Creation type


    During the creation of a link list, it can grow in forward or the backward direction.
    This is entirely governed by the method of insertion of a new node either:'
