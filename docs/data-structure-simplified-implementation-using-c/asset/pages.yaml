    # 3.9.2  Count based link list


    In the count based link list, in each node an additional data member named ‘count’
    is provisioned. Value of the count is assigned based on the accessibility of the
    node. On every access, value of the count is increased by 1. During arrangement,
    node with the maximum count is placed at the first position whereas, the node
    with minimum count is placed at the end.


    In the 3.14 a, structure of the list has been demonstrated. In the figure 3.14
    b, nodes are organized based on their count. Node with the maximum count is placed
    at the first position. In the 3.14 c, if the count changes, consequently, the
    nodes are rearranged based on their count. Same has been illustrated in figure
    3.14 c.


    # 3.9.3    First come first serve (FCFS)


    In the first come first serve method, nodes are arranged on the order of their
    arrival. Nodes


    ![](img/9b7c80a1312a664ae505ba138aa3306b_81_0.png)


    arrived late are placed at the end. Creation of a link list based on the FCFS
    has been illustrated in the figure 3.15. Initially, 500 is arrived, since there
    is no element therefore, it is placed at the first position. It is followed by
    400, correspondingly, it is placed after the existing nodes, here it is 500, refer
    figure 3.15 b. Eventually, 12 is arrived at last, correspondingly, a new node
    is created and attached at the last of existing link list, refer figure 3.15 c.
    Same procedure will be applicable for other elements.


    It is apparent from the above description that the FCFS follows the sequence similar
    to that of insertion at the end. FCFS based algorithms are immensely useful in
    the scenarios where we'
