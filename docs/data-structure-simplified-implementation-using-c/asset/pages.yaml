  md: '```

    int info;

    // for the balancing factor

    int bfactor;

    AVLnode *left, *right; // left and right node of the AVL

    };

    ```


    To understand, how the AVL tree will grow, let''s understand it with the help
    of an example. Consider the series, 80, 25, 66, 90, 32, 60, 11 while inserting/creating
    80 in the AVL tree, there are no node that are existing, therefore, root is to
    be created and the balance factor of this node will be 0. Consider another number
    25, this node will be attached to the left side of the 80 and its balance factor
    will be 0. Whenever a new node is attached to the AVL, its balance factor is always
    equal to zero. However, the balance factor of its predecessor(s) needs to be changed.
    This balance factor will propagate upwards upto the grand parent, if exist. In
    case the balancing factor of the grandparent is violated, AVL need to be suitably
    rotated so that it can continue to qualify the definition of AVL tree. Creation
    of an AVL tree has been illustrated in the following figure 8.6.


    Initially, 80 is inserted and its balance factor is changed to ''0''. Since, it
    is the root node, consequently balancing cannot propagate upwards.


    After 80, another number 25 is being inserted in figure 8.6 (b), since, it is
    less than 80, it will be directed towards the left hand side and get attached
    with 80. Balancing factor of this new node will be ''0''. Balancing factor will
    be propagate upwards, Since only one node exist above 25, therefore its balancing
    factor can be determined as


    ```

    New balancing factor=old balancing factor + 1

    New balancing factor=0 + 1=1

    ```


    Therefore, new balancing factor of 80 will be 1.


    Take another case (figure c), in which 90 is being inserted. This node will move
    towards the right side of the root. Balancing factor of this new node (90) will
    be 0. Upon insertion of this node, balancing factor will propagate towards updirection
    and its parent''s balancing factor will be increased by 1. Since, node is attached
    to the right therefore increment will be -1. New balancing factor can be computed
    by:


    ```

    New balancing factor =old balancing factor + (-1)

    New balancing factor =1-1

    =0

    ```


    This propagation will not terminate here, instead will reach towards the left
    side of the root. New balancing factor of any node can be computed with the help
    of formula already given above. Therefore, it is apparent that balancing an AVL
    tree is a complex procedure and need promising algorithm inorder to balance the
    current node and subsequent nodes. However, once the AVL is created, it gives
    performance which is better than the BST, since the tree remain height balanced.'
