    # 3.4 SEARCHING THE ELEMENT IN A LINK LIST


    Link list is a linear data structure; consequently elements need to be searched
    from the beginning. In the list, elements is to be searched at first node. This
    is followed by visiting the subsequent nodes till elements is not found or the
    list is not exhausted. In the best case, element to be searched may be found at
    first position itself. In worst case, element to be searched may be found at last
    position. Therefore, in best case, complexity will be O(1). If the number of nodes
    are ‘n’ then in the worst case the complexity will be O(n). Chances of in-between
    also exist. However, in asymptotic notation, only best and worst cases are only
