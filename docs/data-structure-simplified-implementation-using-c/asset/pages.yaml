    # 13.5 TRAVERSAL IN A GRAPH


    Visiting each and every node once in a graph is termed as traversal. In the graph
    traversal, none of the node should be visited more than once and none of the node
    should remain unvisited. In graphs, there are two prominent traversal techniques
    that are widely used. Each of them has been discussed in the upcoming section.


    # 13.5.1 Depth first search


    In the depth first search method, we start from the one vertex and continue to
    traverse up-to the deepest level. At a time, only side is selected for the traversal
    and reaches to the deepest level. This allows to access vertex based on their
    depth.


    Consider the case of the figure 13.18, in this graph, we can start from any of
    the vertex, however, we are starting from the vertex-1. This is followed by all
    the nodes at the next level of this node. In this case, they are 2, 5, 6. Afterwards,
    we would like to traverse all the vertex of the other vertex directly to the vertex
    2. In the figure 13.18, it is 3, since; visit to 6 is already accomplished. Afterwards,
    we again consider, the other vertex directly connected to vertex-1. In the considered
    figure, it is 4. We would not consider the node 6, since; it is already marked
    as visited. Therefore, the entire depth first traversal is 1, 2, 5, 6, 3, 4. Readers
    are requested'
