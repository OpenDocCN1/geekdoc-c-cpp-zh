  md: 'that the factorial is obtained by multiplying the number from n to 1 i.e. n*(n-1)*(n-2)*(n*3)........-1.
    Therefore, factorial can be defined as:


    f(n) = {1  if n = 0

    else n * f(n − 1)


    From the above depicted equation, recursive function can easily be written. Here
    If (n==0) will act as the base condition, once base condition is met it will return
    to the caller. Complete program to determine the factorial is depicted below:


    ```

    // Program to determine the factorial of a number n.

    int factorial (int n)

    {

    if (n==0)

    return 1;

    else

    return n*factorial (n-1);

    }

    ```


    Above function facilitates in determining the factorial of a given number that
    is passed as an argument. Recursively, this function will be called by decrementing
    the variable ‘n’. Once ‘n’ reaches to ‘0’, it will return 1 to the caller i.e.
    factorial (2). This in turn return 2 to the function called it i.e. factorial
    (3). This process will continue till all the calls that are saved in stack are
    not exhausted.


    # 14.4.2 Tail recursion


    Tail recursion is the other category of recursive function that is widely used.
    In the tail recursion, recursive call is placed at the end of all the statements.
    Statement before the recursive function is executed similar to the loops. Once
    the base condition is satisfied, recursive call will be terminated.


    ```

    Program to print the number from 10 to 1

    void print (int x)// value of x passed is 10

    {

    if(x! =0)        //base condition

    {

    cout<<"x="<<x;

    print(x-1); //decrementing call

    }

    }

    ```'
