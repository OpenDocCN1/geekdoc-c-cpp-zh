    related to the Nop is to determine the top of the stack element, in which top
    element is to be returned without moving the top pointer.


    # 5.4 IMPLEMENTATIONS OF STACK


    Stack is widely used data structure in computer science, usage of stack improves
    the overall performance, at the same time simplifies the code. In stack, many
    times we know in advance the maximum number of elements that need to be inserted.
    However, many times the number of items to be inserted cannot be predicted accurately.
    Correspondingly, to cater these needs, stacks are categorized into:


    +   - Static stack

    +   - Dynamic stack


    In stack, if total number of items that can be inserted is predicted in advance,
    then such type of stack can be implemented with the help of an array and termed
    as **static stack**. Such stacks give better performance relative to any other
    type of stack.


    In cases, if the total number of items to be inserted is not known or variation
    of minimum number of items to be inserted to the maximum number of items to be
    inserted is huge, in such cases, we use another type of stack known as **dynamic
    stack**. But this stack involves the performance overhead related to memory allocation
    and de-allocation.


