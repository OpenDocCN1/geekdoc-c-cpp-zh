- pgno: 133
  md: 'The syntax `IQ|SES|PARENT` is shorthand for all possible interactions and lower-order
    terms among the three variables. Because I wasn’t interested in the 3-way interaction,
    I added the `@2` option, which restricts the model to 2-way interactions and main
    effects. In Output 4.10 we see that none of the 2-way interactions is statistically
    significant.


    # **Output 4.10 Tests for Main Effects and Two-Way Interactions**


    | Effect | DF | Wald Chi-Square | Pr > ChiSq |

    |---|---:|---:|---:|

    | iq | 3 | 25.7986 | <.0001 |

    | ses | 3 | 3.6215 | 0.3053 |

    | iq*ses | 9 | 12.4348 | 0.1899 |

    | parent | 1 | 83.0971 | <.0001 |

    | parent*iq | 3 | 2.9139 | 0.4051 |

    | parent*ses | 3 | 2.2394 | 0.5242 |


    Given the large sample size, the “no interactions” model fits the data impressively
    well. Now we can feel confident that the main-effects model in Output 4.9 is a
    reasonably good fit to the data. From the Type 3 table in Output 4.9, we see that
    each of the three variables is highly significant, with parental encouragement
    having the strongest effect, followed by IQ and then SES. One nice thing about
    these Type 3 chi-squares is that they don’t depend on the choice of the reference
    category. In fact, they are invariant to any choice among the several PARAM options.


    Turning to the parameter estimates, the easiest one to interpret is the effect
    of PARENT because it only has two values. Although PARENT has values of 1 for
    low encouragement and 2 for high encouragement, the coefficient (and odds ratio)
    are identical to what they would be if the values of PARENT were 0 for low and
    1 for high. The odds ratio of 11.65 says that students whose parents gave high
    levels of encouragement are nearly 12 times as likely to plan to attend college
    as students whose parents gave low levels of encouragement. Because the sample
    size is large, this adjusted odds ratio is estimated with good precision: the
    95% confidence interval is 9.5 to 14.2.


    For IQ and SES, the odds ratio estimates in Output 4.9 make it clear that each
    is a comparison between a particular category and the reference category (level
    4 for IQ or SES). For example, the odds ratio for IQ 1 vs. 4 is .14, indicating
    that the odds of college plans'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'among the low IQ group are about one seventh the odds in the high IQ group.
    For IQ 2 vs. 4, we have an odds ratio of .25. This tells us that students in the
    lower-middle IQ group have odds that are only about one-fourth the odds for the
    high group. Finally, comparing upper-middle and high groups, we get an odds ratio
    of .53. Thus, the highest group has about double the odds of college plans as
    the upper-middle group. From the chi-square column (in the “Analysis of Maximum
    Likelihood Estimates” table in Output 4.9), we see that each of these contrasts
    with the reference category is statistically significant at well beyond the .001
    level.


    For SES, each of the odds ratios is a contrast with the high SES category. Each
    SES level is significantly different from the highest category and, as you might
    expect, the odds of college plans goes up with each increase in SES. But what
    about comparisons between other categories? Suppose we want to know if there’s
    a significant difference between lower-middle (SES 2) and upper-middle (SES 3)
    groups with respect to college plans. The magnitude of the difference is found
    by taking the difference in coefficients: −.7516 − (−1.058) = .3064. Exponentiating
    yields 1.36, indicating that the odds of college plans are about 36% higher in
    the upper-middle than in the lower-middle group. To test for significance of the
    difference, we could use either a CONTRAST statement or a TEST statement after
    the MODEL statement. I’ll use CONTRAST because it can also produce estimates of
    the coefficient difference and the odds ratio:


    ```

    CONTRAST ''um vs. lm'' ses 0 1 -1 0 / ESTIMATE=BOTH;

    ```


    The text within quotes is a label; a label is mandatory but it can be any text
    you want. The four numbers after SES tell LOGISTIC to multiply the SES 1 coefficient
    by 0, SES 2 by 1, SES 3 by −1, and SES 4 by 0. LOGISTIC then sums the results
    and does a chi-square test of the null hypothesis that the sum is equal to 0.
    Of course, this is equivalent to testing whether the difference between SES 2
    and SES 3 is 0. The ESTIMATE=BOTH option requests both the difference between
    the coefficients and the corresponding odds ratio. The output clearly indicates
    that the difference is significant, and it also produces the estimates that we
    just got by hand calculation, along with 95 percent confidence intervals.'
  merge: -1
  img_proc: true
