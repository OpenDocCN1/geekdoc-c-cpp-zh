    Notice that this data set does not contain any variables describing the persons
    in the study. Even if variables like gender, education, or race were available
    in the data, they could not be included as variables in the model. Because a person’s
    gender is the same for all eight chocolate bars, gender cannot help predict why
    a person chooses one bar rather than another. On the other hand, it would be possible
    to include interactions between gender and the other variables in the model. For
    example, we could test whether a soft center is more important for men than for
    women. We’ll see an example of such interaction terms in Section 7.4.


    # 7.3 Model and Estimation


    Now that we’ve seen how to do a discrete choice analysis, let’s take a closer
    look at the model being estimated. Suppose we have *i*=1, …, *n* individuals and
    each individual is presented with *j*=1, …, *J_i* options. We write the number
    of possible choices as *J_i* to indicate that different individuals may have different
    sets of options. That wasn’t true for the chocolate example, but it’s an important
    feature of the model that distinguishes it from the multinomial logit model of
    Chapter 5. Let *y_ij*=1 if individual *i* chooses option *j*, otherwise 0, and
    let **x**_ij be a vector of explanatory variables describing option *j* for person
    *i*. This set of explanatory variables may include dummy variables for the various
    options as well as'
