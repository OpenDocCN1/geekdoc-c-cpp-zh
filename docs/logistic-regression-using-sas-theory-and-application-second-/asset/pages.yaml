    \ | No |\n| White | Female | 371 | 49 | 74 |\n|  | Male | 250 | 45 | 71 |\n| Black\
    \ | Female | 64 | 9 | 15 |\n|  | Male | 25 | 5 | 13 |\n\nThe dependent variable—belief\
    \ in an afterlife—has three categories, which we’ll treat as unordered. Here’s\
