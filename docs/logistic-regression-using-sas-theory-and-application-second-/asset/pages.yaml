    # 8.5 Mixed Models with PROC GLIMMIX


    As we have seen, the principal attraction of GEE is the fact that it produces
    efficient coefficient estimates that have minimum sampling variability. Mixed
    modeling has the same attraction, but also offers a number of additional features.
    In this approach, clustering is treated as a random effect in a mixed model—so
    named because it includes both fixed and random effects. Although mixed models
    are quite similar to GEE, they have two potential advantages. First, much more
    complex models are possible, with multiple levels of clustering, overlapping clusters,
    and random coefficients. Second, estimation of mixed models can correct for heterogeneity
    shrinkage discussed in Section 3.12. In other words, mixed models are subject
    specific rather than population averaged like the models estimated by GEE (McCulloch
    1997, Rodriguez and Goldman 1995).


    Mixed models differ from GEE models in that dependence between repeated measurements
    is directly built into the model. In its simplest form, the mixed logit model
    can be written as follows:


    ```

    log( p_it / (1 - p_it) ) = α_i + β x_it .   (8.2)

    ```'
