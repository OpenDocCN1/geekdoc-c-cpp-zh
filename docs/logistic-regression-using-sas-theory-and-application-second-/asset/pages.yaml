  md: "for every adjacent pair, there is only one set for the lot of them. So our\
    \ adjacent categories model becomes\n\n```\nlog(p_{i,j+1} / p_{ij}) = α_j + β\
    \ x_i      j = 1,...,J-1      (6.7)\n```\n\nNotice that the right-hand side is\
    \ identical to equation (6.1), which defines the cumulative model, but the left-hand\
    \ side compares individual categories rather than grouped, cumulative categories.\n\
    \nAlthough the adjacent categories model is a special case of the multinomial\
    \ logit model, PROC LOGISTIC doesn’t allow the imposition of the appropriate constraints.\
    \ The model can be estimated with PROC CATMOD if the data can be grouped into\
    \ a contingency table. However, CATMOD uses the method of weighted least squares\
    \ rather than maximum likelihood. Here’s how to do it for the happiness data that\
    \ we analyzed in the previous section:\n\n```\nPROC CATMOD DATA=happy;\n    WEIGHT\
    \ count;\n    RESPONSE ALOGIT;\n    MODEL happy = _RESPONSE_ married year / PARAM=REF;\n\
    RUN;\n```\n\nCATMOD doesn’t have a FREQ statement, but the WEIGHT statement performs\
    \ the same function. The RESPONSE statement with the ALOGIT option invokes the\
    \ adjacent categories function for the dependent variable, as in equation (6.6).\
    \ Putting _RESPONSE_ in the MODEL statement tells CATMOD to estimate a single\
    \ set of coefficients, as in equation (6.7), rather than a different set for each\
    \ pair of categories. By default CATMOD treats all predictor variables as CLASS\
    \ variables. But like LOGISTIC, CATMOD also codes those variables by using “effect\
    \ parameterization.” The PARAM=REF option overrides that default to produce indicator\
    \ variable coding. Results are shown in Output 6.10.\n\nThe first thing to notice\
    \ is that the residual chi-square test indicates that the model doesn’t fit. In\
