- pgno: 122
  md: "# 4.3 A Three-Way Table\n\nAs we’ve just seen, using LOGISTIC to estimate a\
    \ logit model for a 2 × 2 table doesn’t tell you much more than you would get\
    \ with PROC FREQ. But with a 3-way table, things get more interesting.\n\nConsider\
    \ Table 4.2, which shows the cross classification of race, gender, and occurrence\
    \ of sexual intercourse for a national sample of 15- and 16-year-olds, reported\
    \ by Morgan and Teachman (1988).\n\n# Table 4.2 Race by Gender by Sexual Intercourse\n\
    \n|  |  | Intercourse |  |\n| Race | Gender | Yes | No |\n| White | Male | 43\
    \ | 134 |\n|  | Female | 26 | 149 |\n| Black | Male | 29 | 23 |\n|  | Female |\
    \ 22 | 36 |\n\nLet’s analyze Table 4.2 as a logit model, with intercourse as the\
    \ dependent variable and race and sex as independent variables. Using the events/trials\
    \ syntax in LOGISTIC, we have:\n\n```\nDATA interco;\n    INPUT white male yes\
    \ no;\n    total=yes+no;\n    DATALINES;\n1 1 43 134\n1 0 26 149\n0 1 29 23\n\
    0 0 22 36\n;\nPROC LOGISTIC DATA=interco;\n    MODEL yes/total=white male / SCALE=NONE;\n\
    RUN;\n```\n\nThe SCALE=NONE option is included so that we can get the deviance\
    \ and Pearson chi-square tests for goodness of fit. When you use the events/trials\
    \ syntax, the AGGREGATE option is not needed because the data are already in aggregated\
    \ form."
  merge: -1
  img_proc: true
- pgno: 123
  md: "# Output 4.3 PROC LOGISTIC Output for Analysis of Three-Way Table\n\n| Deviance\
    \ and Pearson Goodness-of-Fit Statistics |\n| Criterion | Value | DF | Value/DF\
    \ | Pr > ChiSq |\n| Deviance | 0.0583 | 1 | 0.0583 | 0.8091 |\n| Pearson | 0.0583\
    \ | 1 | 0.0583 | 0.8092 |\n\n| Analysis of Maximum Likelihood Estimates |\n| Parameter\
    \ | DF | Estimate | Standard Error | Wald Chi-Square | Pr > ChiSq |\n| Intercept\
    \ | 1 | -0.4555 | 0.2221 | 4.2045 | 0.0403 |\n| white | 1 | -1.3135 | 0.2378 |\
    \ 30.5132 | <.0001 |\n| male | 1 | 0.6478 | 0.2250 | 8.2872 | 0.0040 |\n\n| Odds\
    \ Ratio Estimates |\n| Effect | Point Estimate | 95% Wald Confidence Limits |\n\
    | white | 0.269 | 0.169 | 0.429 |\n| male | 1.911 | 1.230 | 2.971 |\n\nSelected\
    \ results are shown in Output 4.3. The first thing to notice is that the deviance\
    \ and Pearson chi-square statistics are both only .058 with 1 degree of freedom,\
    \ yielding a p-value of .81. Because this is a goodness-of-fit test, a high p-value\
    \ means that the model fits well. Clearly this model fits the data extremely well.\n\
    \nBut what is the deviance testing? Remember that the deviance always compares\
    \ the fitted model with a saturated model. For a 2 × 2 × 2 table, the saturated\
    \ logit model includes an interaction between the two explanatory variables in\
    \ their effects on the dependent variable. There’s one coefficient for this interaction,\
    \ corresponding to the single degree of freedom for the deviance. So, in this\
    \ case, the deviance is testing the null hypothesis that the interaction coefficient\
    \ is 0. We conclude that there’s no evidence for an interaction.\n\nTo see this\
    \ more explicitly, let’s actually fit the model with the interaction:\n\n```\n\
    PROC LOGISTIC DATA=interco;\n    MODEL yes/total=white male white*male/ SCALE=NONE\
    \ ;\nRUN;\n```\n\nIn Output 4.4 we see that the deviance is 0, as it should be\
    \ for a saturated model. The interaction term has a chi-square of .0583 with a\
    \ p-value of .8092, identical to what we got"
  merge: -1
  img_proc: true
