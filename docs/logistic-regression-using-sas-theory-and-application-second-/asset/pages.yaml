    # 10.8 GENMOD versus CATMOD


    I’ve used PROC GENMOD exclusively in this chapter, but you can also estimate loglinear
    models with PROC CATMOD. I prefer GENMOD for several reasons:


    +   - PROC GENMOD can fit a wider range of loglinear models than PROC CATMOD.
    For example, PROC CATMOD does not allow the device of treating a variable as both
    quantitative and qualitative in the same loglinear model.

    +   - PROC GENMOD can correct for overdispersion when appropriate.

    +   - PROC GENMOD can optionally produce likelihood-ratio hypothesis tests, while
    PROC CATMOD only produces Wald tests.


    There is one other noteworthy difference: PROC CATMOD can take individual-level
    data as input. It then constructs the necessary contingency table required for
    each model it estimates. PROC GENMOD requires the contingency table as input,
    although this is easily produced with PROC FREQ by using the OUT= option in the
    TABLES statement.'
