- pgno: 66
  md: "introduced by Firth (1993) and, hence, often known as the Firth method. It’s\
    \ well known that conventional maximum likelihood estimates may suffer from bias\
    \ in small samples. The penalized likelihood method is designed to reduce this\
    \ bias for a wide range of applications of maximum likelihood. Heinze and Schemper\
    \ (2002) showed that this method is particularly effective in dealing with cases\
    \ of quasi-complete separation.\n\nHere’s how it works. In the Newton-Raphson\
    \ algorithm (equation 3.7), the vector of first derivatives U(β) is modified as\
    \ follows:\n\nU(β) = ∂log L / ∂β = Σ_i x_i y_i − Σ_i x_i ŷ_i − Σ_i h_i x_i (.5\
    \ − ŷ_i)\n\nwhere h_i is the i’th diagonal element of the “hat” matrix\n\nH =\
    \ W^{1/2} X(X'WX)^{-1} X'W^{1/2} and W = diag{ŷ_i(1 − ŷ_i)}.\n\nOnce this replacement\
    \ is made, the Newton-Raphson algorithm can proceed as usual.\n\nIn PROC LOGISTIC,\
    \ the method is implemented with the FIRTH option on the MODEL statement. Here\
    \ is the code for the death penalty example:\n\n```\nPROC LOGISTIC DATA=penalty;\n\
    WHERE blackd=0;\nCLASS culp /PARAM=REF;\nMODEL death(EVENT='1') = culp serious\
    \ / FIRTH\n    CLPARM=PL;\nRUN;\n```\n\nNotice that I have requested profile likelihood\
    \ confidence intervals using the CLPARM option. You should always do this when\
    \ using the Firth method to deal with quasi-complete separation. That’s because\
    \ conventional Wald confidence intervals can be seriously inaccurate in such situations.\
    \ Wald p-values can also be inaccurate for the problematic parameters, so inference\
    \ should be focused instead on the confidence intervals."
  merge: -1
  img_proc: true
