  md: "father’s status and son’s status. That is, if the son doesn’t have the same\
    \ status as the father, then father’s status doesn’t tell us anything about son’s\
    \ status.\n\nThere are two ways to fit the quasi-independence model. One way is\
    \ to include a separate parameter for each of the main diagonal cells. The other,\
    \ equivalent way (which we will take) is to simply delete the main diagonal cells\
    \ from the data being fitted. Here’s how:\n\n```\nPROC GENMOD DATA=mobility;\n\
    \    WHERE dad NE son;\n    CLASS dad son;\n    MODEL n = dad son /D=P;\nRUN;\n\
    ```\n\nIn the WHERE statement, NE means “not equal to.”\n\nAlthough the quasi-independence\
    \ model fits much better than the independence model, the fit is still bad. With\
    \ 11 d.f., the deviance is 249.4 and the Pearson chi-square is 328.7. We conclude:\
    \ although 69% of the original deviance is attributable to the main diagonal cells,\
    \ there is something else going on in the table besides status inheritance.\n\n\
    To represent that something else, Goodman proposed 21 other models as possible\
    \ candidates. Let’s consider two of them. His QPN model is based on the ordering\
    \ of occupational status. In Table 10.2, the upper triangle represents downward\
    \ mobility, while the lower triangle represents upward mobility. The QPN model\
    \ says that, besides ignoring the main diagonal cells, there is independence within\
    \ each of these two triangles. To fit the model, we create a new variable distinguishing\
    \ the two portions of the table:\n\n```\nDATA b;\n    SET mobility;\n    up=son\
    \ GT dad;\nPROC GENMOD DATA=b;\n    WHERE dad NE son;\n    CLASS dad son;\n  \
    \  MODEL n = dad son son*up dad*up / D=P;\nRUN;\n```\n\nWe get a considerable\
    \ improvement in fit from this model (output not shown). With 6 d.f., the deviance\
    \ is 14.0 (p=.03) and the Pearson chi-square is 9.9 (p=.13). While the p-value\
    \ for the deviance is below the .05 criterion, keep in mind that we are working\
    \ with a rather large sample and even minor deviations from the model are likely\
    \ to be statistically significant.\n\nWhat is the substantive interpretation of\
    \ this model? In addition to allowing for status"
