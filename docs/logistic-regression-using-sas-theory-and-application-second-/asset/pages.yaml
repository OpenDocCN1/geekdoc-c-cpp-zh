- pgno: 281
  md: "restricted to clustered data. For Poisson regression, it’s *always* a potential\
    \ problem, and often quite a serious one.\n\nBasically the problem arises because\
    \ equation (9.2) says that, for a given set of values on the explanatory variables,\
    \ the variance of the dependent variable is equal to its mean. In fact, the variance\
    \ is often much higher than that. Equivalently, we can say that overdispersion\
    \ occurs because there’s no random disturbance term in equation (9.3) that would\
    \ allow for omitted explanatory variables. (A disturbance term would produce a\
    \ larger variance in *y*.) While overdispersion doesn’t bias the coefficients,\
    \ it does lead to underestimates of the standard errors and overestimates of chi-square\
    \ statistics. Overdispersion also implies that conventional maximum likelihood\
    \ estimates are not efficient, meaning that other methods can produce coefficients\
    \ with less sampling variability.\n\nWhat can be done about overdispersion? If\
    \ you’re willing to ignore the lack of efficiency of conventional estimates, it’s\
    \ a simple matter to correct the standard errors and chi-squares (Agresti 2002).\
    \ The correction is the same as for the grouped binomial case that we discussed\
    \ in Chapter 4: take the ratio of the goodness-of-fit chi-square to its degrees\
    \ of freedom, and call the result *C*. Divide the chi-square statistic for each\
    \ coefficient by *C*. Multiply the standard error of each coefficient by the square\
    \ root of *C*. The only ambiguity is that we have two goodness-of-fit chi-squares,\
    \ the deviance and the Pearson chi-square. Which one should we use? Most of the\
    \ time they’ll be fairly close, but the theory of quasi-likelihood estimation\
    \ suggests the use of the Pearson chi-square (McCullagh and Nelder 1989).\n\n\
    In GENMOD, the corrections just described can be automatically invoked by putting\
    \ either SCALE=P (for Pearson) or SCALE=D (for deviance) as options in the MODEL\
    \ statement. For our biochemist example, the full code using the SCALE=P option\
    \ is\n\n```\nPROC GENMOD DATA=postdoc;\n    MODEL arts = age mar doc ag und /\
    \ D=P SCALE=P;\nPROC GENMOD DATA=postdoc;\n    MODEL cits = age mar doc ag und\
    \ / D=P SCALE=P;\nRUN;\n```\n\nResults are shown in Output 9.5 and Output 9.6.\
    \ Each output now includes a scale parameter which, as noted, is just the square\
    \ root of the Pearson chi-square divided by the degrees of freedom. For articles,\
    \ the chi-squares for the coefficients are all reduced by about 40%, with the\
    \ result that none of the coefficients is statistically significant. For citations,\
    \ the chi-square"
