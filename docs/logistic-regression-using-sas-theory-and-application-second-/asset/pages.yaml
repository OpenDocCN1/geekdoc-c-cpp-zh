- pgno: 299
  md: '# Chapter 10


    # Loglinear Analysis of Contingency Tables


    10.1 Introduction 291


    10.2 A Loglinear Model for a 2 × 2 Table 292


    10.3 Loglinear Models for a Four-Way Table 298


    10.4 Fitting the Adjacent Categories Model as a Loglinear Model 304


    10.5 Loglinear Models for Square, Ordered Tables 310


    10.6 Marginal Tables 317


    10.7 The Problem of Zeros 319


    10.8 GENMOD versus CATMOD 324


    # 10.1 Introduction


    In Chapter 4, we saw how to analyze contingency tables that included a dichotomous
    variable treated as dependent on the other variables. The strategy was to directly
    estimate a logit model in PROC LOGISTIC. We extended that approach in Chapter
    5 to handle dependent variables with more than two categories by estimating a
    multinomial logit model with PROC LOGISTIC. In this chapter, we see how to estimate
    loglinear models for contingency tables. What distinguishes loglinear models from
    logit models is that loglinear models do not have an explicit dependent variable,
    at least not one that corresponds to any conceptual variable. As I’ve mentioned
    previously, every logit model for a contingency table has a loglinear model that
    is exactly equivalent. But the class of loglinear models also includes models
    that do not correspond to any logit models, so we are dealing with a much wider
    class of models.'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'Why do we need loglinear models? When loglinear analysis was first developed
    in the late 1960s and early 1970s, there wasn’t much software available for logistic
    regression. And what was available wasn’t very suitable for analyzing contingency
    tables. By contrast, loglinear models were easily estimated with widely available
    software. Nowadays, however, you’re usually better off estimating a logit model
    directly. Logit models are simpler and correspond more directly to substantive
    theory. However, there are some situations when a logit model just won’t do the
    job. For example, you might want to explore the relationships among several attitude
    measures that have no obvious causal ordering. But a logit model requires that
    you choose one variable as the dependent variable and the others as independent
    variables.


    Even if you do have a clear-cut dependent variable, the particular logit model
    you want to estimate may be awkward for conventional software. For example, the
    adjacent-categories model described in Chapter 6 is a special case of the multinomial
    logit model. But the maximum likelihood algorithm used in PROC LOGISTIC will not
    impose the necessary constraints to get this model. As we shall see, the adjacent-categories
    model is easily estimated as a loglinear model when the data come in the form
    of a contingency table. Loglinear models are particularly well suited to the analysis
    of two-way tables in which the row variable has the same categories as the column
    variables (a square table). For example, there is a large literature on loglinear
    models for mobility tables in which the row variable represents parent’s occupation
    and the column variable represents child’s occupation (for example, Hout 1983).


    The treatment of loglinear analysis in this book is far from comprehensive. The
    topic is so vast that I can do no more than scratch the surface here. My goals
    are, first, to give you some idea of what loglinear models are like and how they
    are related to logit models. Second, I will show you how to estimate some fairly
    conventional loglinear models by using the GENMOD procedure. Third, I will present
    some examples in which a loglinear model has significant advantages over a logit
    model.


    # 10.2 A Loglinear Model for a 2 × 2 Table


    Let’s start with the 2 × 2 table we analyzed in Chapter 4 (reproduced here as
    Table 10.1), which shows sentence by race for 147 death penalty cases. How can
    we represent this by a loglinear model?'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# **Table 10.1  Death Sentence by Race of Defendant**


    |  | Blacks | Nonblacks | Total |

    |---|---:|---:|---:|

    | Death | 28 | 22 | 50 |

    | Life | 45 | 52 | 97 |

    | **Total** | **73** | **74** | **147** |


    Let’s consider the table in more general form as


    | $m_{11}$ | $m_{12}$ |

    |---|---|

    | $m_{21}$ | $m_{22}$ |


    where $m_{ij}$ is the *expected number* of cases falling into row $i$ and column
    $j$. What I mean by this is that if $n$ is the sample size and $p_{ij}$ is the
    probability of falling into cell $(i,j)$, then


    $$m_{ij}=np_{ij}.$$


    There are a couple of different but equivalent ways of writing a loglinear model
    for these four frequency counts. The way I’m going to do it is consistent with
    how PROC GENMOD estimates the model. Let $R_i$ be a dummy variable for the rows,
    having a value of 1 if $i=1$ and 0 if $i=2$. Similarly, let $C_j$ be a dummy variable
    for the columns with a value of 1 if $j=1$ and 0 if $j=2$. We can then write the
    “saturated” loglinear model for this $2\times2$ table of frequency counts as


    ```

    $$\log m_{ij}=\beta_0+\beta_1R_i+\beta_2C_j+\beta_3R_iC_j \qquad i,j=1,2. \tag{10.1}$$

    ```


    Note that $R_iC_j$ is the product (interaction) of $R_i$ and $C_j$. Equation (10.1)
    actually represents four different equations:


    ```

    $$\begin{aligned}

    \log m_{11}&=\beta_0+\beta_1+\beta_2+\beta_3\\

    \log m_{12}&=\beta_0+\beta_1\\

    \log m_{21}&=\beta_0+\beta_2\\

    \log m_{22}&=\beta_0.

    \end{aligned} \tag{10.2}$$

    ```


    In a moment, we’ll see how to estimate the four $\beta$ parameters using PROC
    GENMOD. But before doing that, let’s talk about why we might be interested in
    these parameters at all. All we’ve done in equation (10.2) is transform the four
    expected frequencies into four different quantities. The reason for doing this
    is that the $\beta$’s show us things about the table that aren’t so easily seen
    by looking at the frequency counts.'
  merge: -1
  img_proc: true
- pgno: 302
  md: "We are particularly interested in β₃, which is the coefficient for the interaction\
    \ term.\n\nIf we solve equations (10.2) for β₃, we get:\n\nβ₃ = log( (m₁₁ m₂₂)\
    \ / (m₁₂ m₂₁) )  (10.3)\n\nThe quantity in parenthesis is the cross-product ratio.\
    \ In Chapter 2, we saw that the cross-product ratio is equal to the odds ratio.\
    \ In this case, it’s the ratio of the odds of a death sentence for blacks to the\
    \ odds of a death sentence for nonblacks. Recall that an odds ratio of 1.0 corresponds\
    \ to independence between the two variables. Because the logarithm of 1 is 0,\
    \ independence of the row and column variables is equivalent to β₃=0. So, we can\
    \ test whether the two variables are independent by testing whether β₃=0.\n\n\
    All this has been expressed in terms of expected frequency counts, the mᵢⱼ. What\
    \ about the observed frequency counts, which I’ll denote by nᵢⱼ? For the model\
    \ we’ve just been considering, the maximum likelihood estimator of β₃ has the\
    \ same form as equation (10.3) except that expected frequencies are replaced by\
    \ observed frequencies:\n\nβ̂₃ = log( (n₁₁ n₂₂) / (n₁₂ n₂₁) )  (10.4)\n\nFor the\
    \ data in Table 10.1, β̂₃ = log[(28×52)/(45×22)] = .3857. Similar expressions\
    \ can readily be obtained for the other β parameters in the model, but we’re usually\
    \ not very interested in them.\n\nAlthough it’s simple enough in this case to\
    \ get all the maximum likelihood estimates by hand calculations, we can also do\
    \ it with PROC GENMOD. Here is the SAS code:\n\n```\nDATA penalty;\n    INPUT\
    \ n death black;\n    DATALINES;\n28 1 1\n22 1 0\n45 0 1\n52 0 0\n;\nPROC GENMOD\
    \ DATA=penalty;\n    MODEL n = death black death*black / DIST=POISSON;\nRUN;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 303
  md: 'Each cell in the table is a separate record in the data set. DEATH is a dummy
    variable for a death sentence, and BLACK is a dummy variable for race. The MODEL
    statement includes the main effects of row and column, as well as their interaction.
    The DIST option in the MODEL statement says that each frequency count has a Poisson
    distribution whose expected value m_ij is given by equation (10.2). For frequency
    counts in contingency tables, the Poisson distribution is appropriate for a variety
    of different sampling designs. As we saw in Chapter 9, the default in GENMOD for
    a Poisson distribution is LINK=LOG. That means that the logarithm of the expected
    value of the dependent variable is assumed to be a linear function of the explanatory
    variables, which is exactly what equation (10.1) says.


    # Output 10.1 PROC GENMOD Output for Loglinear Model for a 2 × 2 Table


    | Criteria For Assessing Goodness Of Fit |

    | Criterion | DF | Value | Value/DF |

    | Deviance | 0 | 0.0000 | . |

    | Scaled Deviance | 0 | 0.0000 | . |

