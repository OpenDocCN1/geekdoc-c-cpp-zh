    | EXPLAIN | −1.60** | −.80* | −.80 |


    *p<.05, **p<.01


    Examining the first column, we see that all the variables have significant effects
    on keeping both vs. returning both. The corresponding odds ratios (in Output 5.1)
    may be interpreted just like odds ratios in a binary logit model, except that
    they describe conditional odds. For example, the odds ratio for MALE is 3.56.
    We can then say that the odds that a male will keep both rather than return both
    (conditional on not keeping just the money) are about 3.5 times the odds for females.
    Similarly, the odds ratio for BUSINESS is 3.25. So we may say that students in
    the business school have an odds of keeping both vs. returning both that is about
    3.25 times the odds for those in other schools, again conditional on not keeping
    just the money. For PUNISH we have an odds ratio of 2.95, implying that each 1-level
    increase in that variable multiplies the odds of keeping both vs. returning both
    by about 3. Finally, students whose parents explained their punishments had odds
    of keeping both vs. returning both that were only one-fifth the odds for those
    parents who did not explain.


    The coefficients in the second column have the same sign as those in the first
    but are generally much smaller. That’s not surprising because the behaviors being
    compared are less extreme. We still see a big effect of gender. The odds that
    a male will keep the money vs. returning both are more than three times the odds
    for females (conditional on not keeping both). While the coefficient for EXPLAIN
    has been cut in half, the odds for those whose parents did not explain are still
    more than double the odds for those whose parents did explain.'
