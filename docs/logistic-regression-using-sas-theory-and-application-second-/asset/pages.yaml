  md: '# Chapter 9


    # Regression for Count Data


    9.1 Introduction 265


    9.2 The Poisson Regression Model 266


    9.3 Scientific Productivity Example 267


    9.4 Overdispersion 272


    9.5 Negative Binomial Regression 275


    9.6 Adjustment for Varying Time Spans 278


    9.7 Zero-Inflated Models 283


    # 9.1 Introduction


    In this chapter, we examine Poisson regression and negative binomial regression,
    which are two methods that are appropriate for dependent variables that have only
    non-negative integer values: 0, 1, 2, 3, etc. Usually these numbers represent
    counts of something, like number of people in an organization, number of visits
    to a physician, or number of arrests in the past year. While such data are fairly
    common in the social sciences, there is another reason why Poisson regression
    is important: it is a fundamental building block for loglinear analysis of contingency
    tables, which is a topic we will cover in some detail in the next chapter.


    For years, people analyzed count data by ordinary linear regression and, for many
    applications, that method was adequate for the task. But Poisson and negative
    binomial regression have the advantage of being precisely tailored to the discrete,
    often highly skewed distribution of the dependent variable. On the downside, Poisson
    regression has the disadvantage of being susceptible to problems of overdispersion
    that do not affect ordinary'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'linear regression. Overdispersion, discussed in detail later, can produce severe
    underestimates of standard errors and overestimates of test statistics. While
    there are some simple corrections for overdispersion, negative binomial regression
    is generally the preferred method whenever there is evidence for overdispersion.


    # 9.2  The Poisson Regression Model


    The Poisson regression model gets its name from the assumption that the dependent
    variable has a Poisson distribution, defined as follows. Let $y$ be a variable
    that can have only non-negative integer values. We assume that the probability
    that $y$ is equal to some number $r$ is given by


    $$\Pr(y=r)=\frac{\lambda^r e^{-\lambda}}{r!}, \qquad r=0,1,2,\ldots \tag{9.1}$$


    where $\lambda$ is the expected value (mean) of $y$ and $r! = r(r-1)(r-2)\ldots(1)$.
    Although $y$ can only take on integer values, $\lambda$ can be any positive number.
    For $\lambda=1.5$, the probabilities for the Poisson distribution are graphed
    in Figure 9.1.


    ![](img/bbec4f484c16475caccf067e8da3ac57_274_0.png)


    As $\lambda$ gets larger, the mode moves away from 0 and the distribution looks
    more and more like a normal distribution. An unusual property of the Poisson distribution
    is that the mean and variance are equal,


    $$\mathrm{E}(y)=\mathrm{var}(y)=\lambda \tag{9.2}$$'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'which turns out to be problematic in many applications.


    Next we need to specify how the parameter λ depends on the explanatory variables.
    First, we write λi with a subscript i to allow the parameter to vary across individuals
    (i= 1, ..., n). Then, because λ can’t be less than 0, it is standard to let λ
    be a loglinear function of the x variables:


    ```

    log λi = β0 + β1 xi1 + β2 xi2 + ... + βk xik. (9.3)

    ```


    This ensures that λ will be greater than 0 for any values of the x’s or the β’s.


    That’s all there is to the model. Note that the model does not say that the marginal
    distribution of y will necessarily be Poisson. (The marginal distribution is what
    you get when you ignore any explanatory variables. Outputs 9.1 and 9.2 are realizations
    of marginal distributions.) Instead, y has a Poisson distribution conditional
    on the values of the explanatory variables. If the x variables have large coefficients
    and large variances, the marginal distribution of y may look very different from
    a Poisson distribution.


    As usual, we’ll estimate the model by maximum likelihood. This is easily accomplished
    with PROC GENMOD.


    # 9.3 Scientific Productivity Example


    In Chapter 8, we studied a sample of 554 biochemists who got their doctorates
    in the late 1950s and early 1960s. Two of the variables in the data set are good
    candidates for Poisson regression: ARTS—the number of articles published by the
    biochemists before they received their degrees (counted in Chemical Abstracts),
    and CITS—the number of citations to those articles (counted in Science Citation
    Index). Output 9.1 and Output 9.2 show the marginal frequency distributions for
    these two variables.'
  merge: -1
  img_proc: true
