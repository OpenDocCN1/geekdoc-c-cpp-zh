- pgno: 238
  md: 'correlation structure, are then used in constructing confidence intervals and
    the z-statistics. The model-based standard errors ought to be better estimates
    if the assumed model for the correlation structure is correct, but worse if the
    assumed model is incorrect. It’s certainly safer to stick with the robust estimates.
    On the other hand, the robust standard errors may have less power in small samples,
    especially as the number of time points gets larger.


    The exchangeable structure is often too restrictive, because it doesn’t allow
    for a pattern that is very common in longitudinal data: measurements that are
    close together in time tend to have higher correlations than measurements that
    are farther apart. This sort of pattern can be modeled by specifying TYPE=AR,
    which invokes a first-order autoregressive structure. But this typically makes
    the correlations decline too rapidly with distance; specifically, if r is the
    correlation between measurements that are one time unit apart, then the correlation
    between measures that are two time units apart must be r², the correlation between
    measurements that are three time units apart must be r³, and so on.


    My favorite correlation structure for longitudinal data is TYPE=MDEP(n), where
    n can be any number less than the number of time points. I recommend choosing
    n to be one less than the number of time points. So for our example, that would
    be TYPE=MDEP(2). Output 8.8 shows the results from fitting the MDEP model. This
    correlation structure says that there is one correlation for measurements that
    are one time unit apart (here .2849), another correlation for measurements that
    are two time units apart (here .2547), and another correlation for measurements
    are three time units apart (which doesn’t apply here).


