    | culp 1 | 1 | -4.8670 | 0.8251 | 34.7926 | <.0001 |

    | culp 2 | 1 | -3.0547 | 0.7754 | 15.5185 | <.0001 |

    | culp 3 | 1 | -1.5294 | 0.8400 | 3.3153 | 0.0686 |

    | culp 4 | 1 | -0.3610 | 0.8857 | 0.1662 | 0.6835 |


    Because the variable CULP has five possible values, LOGISTIC has created four
    dummy variables, one for each of the values 1 through 4. As in other procedures
    that have CLASS variables, the default is to take the highest value as the omitted
    category. We’ll see how to change that in a moment. Thus, each of the four coefficients
    for CULP is a comparison between that particular value and the highest value.
    More specifically, each coefficient can be interpreted as the log-odds of the
    death penalty for that particular value of CULP minus the log-odds for CULP=5,
    controlling for other variables in the model.


    When you have a CLASS variable in a model, LOGISTIC provides an additional table,
    labeled “Type 3 Analysis of Effects.” For variables that are not CLASS variables,
    this table is completely redundant with the standard table below it—the chi-squares
    and p-values are exactly the same. For CLASS variables, on the other hand, it
    gives us something very useful: a test of the null hypothesis that all of the
    coefficients pertaining to this variable are 0. In other words, it gives us a
    test of whether CULP has any impact on the probability of the death penalty. In
    this case, we clearly have strong evidence that CULP makes a difference. What’s
    particularly attractive about this test is that it is invariant to the choice
    of the omitted category, or even to the choice among very different methods for
    constructing design variables (which I’ll discuss in a moment).


    The pattern for the four coefficients is just what one might expect. Defendants
    with CULP=1 are much less likely to get the death sentence than those with CULP=5.
    Each increase of CULP is associated with an increase in the probability of a death
    sentence. Notice also that when CULP is included in the model, the coefficient
    for BLACKD (black defendant) is much larger than it was in Output 2.3 and is now
    statistically significant.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'If you don’t like the default reference category (5 in this example), how do
    you change it? If you want it to be the lowest value of CULP rather than the highest
    value, just use


    ```

    CLASS culp / PARAM=REF DESCENDING;

    ```


    If you want it to be some particular value, say 3, use


    ```

    CLASS culp(REF=''3'') / PARAM=REF;

    ```


    Suppose you want to compare two categories of a CLASS variable, such as CULP=2
    and CULP=3. You could always accomplish this by rerunning the model, and making
    one of those values the reference category. But it’s usually easier to use a TEST
    statement or a CONTRAST statement, and you can have as many of those as you want.
    The following two statements test the same null hypothesis, that there is no difference
    in the coefficients for CULP=2 and CULP=3:


    ```

    CONTRAST ''Culp2 vs. Culp3'' culp 0 1 -1 0;

    TEST culp2=culp3;

    ```


    The CONTRAST statement requires a label, which can be any text enclosed by quotes.
    This is annoying if you only have a single CONTRAST, but very useful if you have
    more than one because the label helps you distinguish the different tests in the
    output. Here’s how the CONTRAST statement works: we know that CULP has four coefficients.
    The code “CULP 0 1 -1 0” tells SAS to multiply the first coefficient by 0, the
    second coefficient by 1, the third coefficient by -1, and the fourth coefficient
    by 0, add up the results, and test whether the sum is equal to 0. Of course, this
    is equivalent to testing whether there is a difference between the second and
    third coefficients.


    The TEST statement is a little more straightforward. To refer to a coefficient,
    you just append the value of the variable to the variable name itself. A TEST
    statement may optionally have a label, but the label comes before TEST and cannot
    have any spaces. Thus, we could have written


    ```

    Culp2_vs_Culp3: TEST culp2=culp3;

    ```'
  merge: -1
  img_proc: true
