- pgno: 75
  md: 'number of cases in the interval. These expected frequencies are compared with
    observed frequencies by the conventional Pearson chi-square statistic. The degrees
    of freedom is the number of intervals minus 2. A high *p*-value, as in this example,
    indicates that the fitted model cannot be rejected and leads to the conclusion
    that the model fits well. That is, it can’t be significantly improved by adding
    non-linearities and/or interactions.


    The HL statistic has become popular because it fills a major need and has no serious
    competition. But it’s a rather *ad hoc* statistic, and its behavior has not been
    extensively investigated. Hosmer and Lemeshow (2000) reported simulations showing
    that the statistic has approximately a chi-square distribution under the null
    hypothesis that the fitted model is correct. That may be true, but my own simulations
    suggest that it is not a very powerful test.


    I generated 100 samples of 500 cases each. The model used to produce the data
    had two explanatory variables and included main effects and an interaction term,


    ```

    $$\log\left(\frac{p}{1-p}\right)=\beta_0+\beta_1x+\beta_2z+\beta_3xz,$$

    ```


    with β₀ = 0, β₁ = 1, β₂ = 1, and β₃ = .5. The variables *x* and *z* were drawn
    from standard normal distributions with a correlation of .50. In each sample,
    I estimated a logistic model *without* the interaction term and applied the HL
    test. The model was rejected at the .05 level in only 25% of the samples. In other
    words, in 75% of the samples the HL test failed to reject a model known to be
    incorrect. I then fitted a logistic model *with* an interaction term in each of
    the 100 samples. The Wald test for the interaction was significant at the .05
    level in 75% of the samples. While this hardly constitutes a definitive study,
    it suggests caution in concluding that a model is okay just because the HL test
    is not significant.


    There are other potential problems with the HL test. The choice of 10 groups is
    completely arbitrary, and some statistical packages (e.g., Stata) allow specification
    of different numbers of groups. I have seen many examples where slight changes
    in the number of groups result in radically different *p*-values. I’ve also seen
    many cases where the inclusion of an interaction that is highly significant by
    a likelihood ratio test results in a HL statistic that is substantially worse
    than one for the model without the interaction. That is *not* appropriate behavior.
    Similarly, I’ve seen many examples where the inclusion of an interaction that
    is clearly not significant (again, by a likelihood ratio test) results in a substantial
    improvement in fit as evaluated by the HL statistic.'
  merge: -1
  img_proc: true
