- pgno: 106
  md: 'practical implications? First, in interpreting the results of a logistic regression,
    we should keep in mind that the magnitudes of the coefficients and the corresponding
    odds ratios are likely to be conservative to some degree. Second, to keep such
    shrinkage to a minimum, it’s always desirable to include important explanatory
    variables in the model—even if we think those variables are not correlated with
    the variables already in the model. This advice is especially relevant to randomized
    experiments where there is a tendency to ignore covariates and look only at the
    effect of the treatment on the response. That may be okay for linear models, but
    logit models yield superior estimates of the treatment effect when all relevant
    covariates are included.


    A third problem is that differential heterogeneity can confound comparisons of
    logit coefficients across different groups. If, for example, you want to compare
    logit coefficients estimated separately for men and women, you must implicitly
    assume that the degree of unobserved heterogeneity is the same in both groups.
    Elsewhere, I have proposed a method of adjusting for differential heterogeneity
    (Allison 1999) using a SAS macro called GLOGIT. That macro is no longer necessary,
    however, because the method can now be easily implemented using PROC QLIM with
    its HETERO statement.


    Here’s the example I discussed in my 1999 paper. We will estimate logistic regressions
    predicting the probability of promotion to associate professor for samples of
    301 male and 177 female biochemists. These scientists received their doctorates
    in the late 1950s and early 1960s and were assistant professors at graduate departments
    in U.S. universities at some time during their careers (Long, Allison, and McGinnis
    1993). The units of analysis are person-years rather than persons, with 1,741
    person-years for men and 1,056 person-years for women. As shown in Allison (1982),
    the likelihood function for this sort of data factors in such a way that the multiple
    observations per person are effectively independent. Hence, it is entirely appropriate
    to use ordinary logistic regression without any correction for dependence.


    The explanatory variables used in these regressions are a greatly reduced subset
    of the variables considered in Long et al. (1993), and the results reported here
    differ somewhat from those in the original article. The dependent variable PROMO
    is coded 1 if a person was promoted in a given year, otherwise 0. Independent
    variables are


    | Variable | Description |

    |---|---|

    | FEMALE | 1 for female, 0 for male. |

    | DUR | Number of years since job began. |'
