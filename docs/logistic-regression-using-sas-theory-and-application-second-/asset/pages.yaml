- pgno: 259
  md: 'confounding variables. Now, most researchers use some kind of regression procedure,
    primarily because of the difficulty of matching on several variables. However,
    with the development of the *propensity score* method, that objection to matching
    is largely obsolete (Rosenbaum and Rubin 1983, Smith 1997).


    Here’s a typical application of the propensity score method. Imagine that your
    goal is to compare academic achievement of students in public and private schools,
    controlling for several measures of family background. You have measures on all
    the relevant variables for a large sample of eighth grade students, 10% of whom
    are in private schools. The first step in a propensity score analysis is to do
    a logistic regression in which the dependent variable is the type of school and
    the independent variables are the family background characteristics. Based on
    that regression, the propensity score is the predicted probability of being in
    a private school. Each private school student is then matched to one or more public
    school students according to their closeness on the propensity score. In most
    cases, this method produces two groups that have nearly equal means on all the
    variables in the propensity score regression. One can then do a simple bivariate
    analysis of achievement versus school type. Alternatively, other variables not
    in the propensity score regression could be included in some kind of regression
    analysis. In many situations, this method could have important advantages over
    conventional regression analysis in reducing both bias and sampling variability
    (Smith 1997).


    The propensity score method is an example of *treatment-control* matching. In
    this kind of matching, the individuals within each match group necessarily differ
    on the explanatory variable of central interest. Another sort of matching is *case-control*
    matching in which individuals within each match group necessarily differ on the
    *dependent* variable. Case-control studies have long been popular in the biomedical
    sciences for reasons I explained in Section 3.13. In a case-control study, the
    aim is to model the determinants of some dichotomous outcome, for instance, a
    disease condition. People who have the condition are called cases; people who
    do not have the condition are called controls. In Section 3.13, we saw that it’s
    legitimate to take all the available cases and a random subsample of the controls,
    pool the two groups into a single sample, and do a conventional logit analysis
    for the dichotomous outcome. Although not an essential feature of the method,
    each case is often matched to one or more controls on variables—such as age—that
    are known to affect the outcome but are not of direct interest.'
  merge: -1
  img_proc: true
- pgno: 260
  md: "Although it’s usually desirable to adjust for matching in the analysis, the\
    \ appropriate adjustment methods are quite different for treatment-control and\
    \ case-control matching. In brief, there are several ways to do it for treatment-control\
    \ matching, but there is only one way for case-control matching. Let’s begin with\
    \ a treatment-control example. Metraux and Culhane (1999) constructed a data set\
    \ of 8,402 women who stayed in family shelters in New York City for at least one\
    \ 7-day period during 1992. The data contained information on several pre-stay\
    \ characteristics, events that occurred during the stay, and housing type subsequent\
    \ to the stay. As our dependent variable, we’ll focus on whether or not the woman\
    \ exited to public housing (PUBHOUSE), which was the destination for 48% of the\
    \ sample. Our principal independent variable is STAYBABY, equal to 1 if a woman\
    \ gave birth during her stay at the shelter, and 0 otherwise. Nine percent of\
    \ the sample had a birth during the stay. Other independent variables are\n\n\
    +   BLACK — 1=black race, 0=nonblack\n+   \n+   KIDS — Number of children in the\
    \ household\n+   \n+   DOUBLEUP — 1=living with another family prior to shelter\
    \ stay, 0 otherwise\n+   \n+   AGE — Age of woman at beginning of shelter stay\n\
    +   \n+   DAYS — Number of days in shelter stay\n\nThe conventional approach to\
    \ analysis would be to estimate a logistic regression model for the entire sample\
    \ of 8,402 women. Results for doing that with PROC LOGISTIC are shown in Output\
    \ 8.19. We see that although the odds of exiting to public housing increase with\
    \ the number of children in the household, a birth during the stay reduces the\
    \ odds by about 33 percent. Both of these effects are overshadowed by the enormous\
    \ impact of the length of stay. Each additional day increases the odds of exiting\
    \ to public housing by about 1%. (Not surprisingly, DAYS also has a correlation\
    \ of .25 with STAYBABY—the longer a woman’s stay, the more likely it is that she\
    \ gave birth during the stay.)"
