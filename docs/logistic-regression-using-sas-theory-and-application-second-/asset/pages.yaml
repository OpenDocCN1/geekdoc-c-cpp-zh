    \    sonq=son;\n    dadq=dad;\nPROC GENMOD DATA=d;\n    WHERE dad NE son;\n  \
    \  CLASS dad son;\n    MODEL n = dad son sonq*dadq /D=P;\n    OUTPUT OUT=a PRED=pred\
