- pgno: 252
  md: 'what factors explain why they happened at these particular times and not at
    other times?" Clearly, variables that are constant over time cannot explain why
    events happened at some times and not others. That doesn’t mean that the time-constant
    variables aren’t controlled. As I noted earlier, the method actually controls
    for all time constant variables, not just those we happen to have measured. Or
    as it’s sometimes stated, each individual serves as his or her own control.


    The main reason the chi-squares are small is that the standard errors are substantially
    larger than they were for GEE and mixed model estimation. If you compare the coefficients,
    they’re not all that different from those in, say, Output 8.10. So why are the
    standard errors larger? Because fixed-effects estimation discards a lot of data
    that’s used by GEE or mixed models. As I just explained, any person whose PTSD
    values didn’t change over the three periods is automatically excluded from the
    likelihood function. Even those who did have PTSD symptoms at some times and not
    at other times don’t contribute as much information as they did in the GEE or
    mixed models. Only within-person variation is used, not between-person variation.
    The result is standard errors that are about twice as large as in the GEE or mixed
    models.


    The contrast between fixed-effects and random-effects (mixed model) estimation
    is a classic trade-off between bias and inefficiency. Fixed-effects estimates
    are much less prone to bias because the conditional likelihood discards information
    that is potentially contaminated by confounding variables. On the other hand,
    if confounding variables are not a problem, then the fixed-effects approach can
    discard much potentially useful information. That seems to be the case in the
    PTSD example where the fixed-effects coefficients differ only slightly from the
    GEE or mixed model coefficients.


