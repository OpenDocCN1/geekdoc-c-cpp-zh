    up to .032, but further powers didn’t bring any improvement. (I tried up to the
    7th power.) In short, any polynomial model with enough terms to fit would be so
    complicated that it would have little appeal over the saturated model.


    However, it’s quite possible that the lack of fit is due not to departures from
    linearity in the effect NIH funding but to a lack of independence in the observations.
    There are many characteristics of biochemistry departments besides NIH funding
    that may have some impact on whether their graduates seek and get postdoctoral
    training. Possibilities include the prestige of the department, whether the department
    is in an agricultural school or a medical school, and the age of the department.
    Omitting these variables from the model could induce a residual correlation among
    the observations: People from the same department tend to have the same outcome
    because they share a common environment. This lack of independence will produce
    what is called extra-binomial variation—the variance of the dependent variable
    will be greater than what is expected under the assumption of a binomial distribution.
    Besides producing a large deviance, extra-binomial variation can result in underestimates
    of the standard errors and overestimates of the chi-square statistics.


    One approach to this problem is to adjust the chi-squares and test statistics,
    leaving the coefficient estimates unchanged. The adjustment is quite simple: Take
    the ratio of the goodness-of-fit chi-square to its degrees of freedom, and then
    divide all the individual chi-squares by that ratio. Equivalently, take the square
    root of the ratio and multiply all the'
