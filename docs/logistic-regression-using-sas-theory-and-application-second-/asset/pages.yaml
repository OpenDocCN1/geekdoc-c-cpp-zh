    Comparing Output 8.2 with Output 8.3, we see that the coefficients are identical.


    What *has* changed are the standard errors, which are somewhat larger in Output
    8.3 for the first four variables. And since the chi-squares are calculated by
    dividing the parameter estimates by their standard errors, the chi-squares are
    somewhat lower than they were before. This doesn’t make a noticeable difference
    in the *p*-values, however, because they were so low to begin with.


    The exceptions to this pattern are the robust standard errors for the two indicator
    variables for TIME, which are smaller than the conventional standard errors. But
    that’s consistent with a more general pattern: with robust standard errors, you
    tend to see the biggest percentage increase for variables that don’t change over
    time (like COHES) and somewhat smaller increases for variables that do change
    over time (like CONTROL, PROBLEMS, and SEVENT). For variables that change over
    time but do not vary across persons (like TIME itself), the robust standard errors
    are often smaller than conventional standard errors.


    Now let’s see how to get the same results with PROC GENMOD, which is designed
    to estimate generalized linear models. These include linear models, logistic models,
    and the models for count data that we will examine in the next chapter. Here’s
    the GENMOD code for the PTSD data:'
  merge: -1
  img_proc: true
- pgno: 232
  md: "```\n```sas\nPROC GENMOD DATA=ptsd DESC;\n    CLASS subjid time;\n    MODEL\
    \ ptsd = control problems sevent coches time /\n        DIST=BINOMIAL TYPE3;\n\
    \    REPEATED SUBJECT=subjid;\nRUN;\n```\n```\n\nLike PROC LOGISTIC, GENMOD models\
    \ the *lower* value of the dependent variable by default. Unlike LOGISTIC, GENMOD\
    \ does not accept the options EVENT='1' or DESCENDING on the MODEL statement.\
    \ Instead, the DESCENDING option (here abbreviated DESC) must be placed on the\
    \ PROC statement. Because GENMOD can estimate models for many different kinds\
    \ of response variables, we need to specify the distribution of PTSD by using\
    \ the option DIST=BINOMIAL, which can be abbreviated D=B. As with PROC LOGISTIC,\
    \ the default link function for the binomial distribution is the logit link, but\
    \ that can be overridden by choosing LINK=PROBIT or LINK=CLOGLOG. I’ve also included\
    \ the very useful TYPE3 option because it gives overall tests for CLASS variables,\
    \ tests that don’t depend on the parameterization of those variables.\n\nThe REPEATED\
    \ statement plays the same role as the CLUSTER statement in PROC SURVEYLOGISTIC.\
    \ Without it, we would get maximum likelihood estimates with conventional standard\
    \ errors. Unlike SURVEYLOGISTIC, however, the SUBJID variable must be specified\
    \ not only on the REPEATED statement but also on the CLASS statement. If you forget\
    \ and leave it off the CLASS statement (which I’ve done many times), you’ll get\
    \ an error message.\n\n# Output 8.4  PROC GENMOD Output with Robust Standard Errors\n\
    \n| Parameter | Estimate | Standard Error | 95% Confidence Limits | Z | Pr > \\\
    |Z\\| |\n|---|---:|---:|---:|---:|---:|\n| Intercept | 1.4246 | 0.9022 | -0.3438,\
    \ 3.1929 | 1.58 | 0.1143 |\n| control | -0.9594 | 0.2270 | -1.4044, -0.5144 |\
    \ -4.23 | <.0001 |\n| problems | 0.2956 | 0.0515 | 0.1947, 0.3964 | 5.74 | <.0001\
    \ |\n| sevent | 0.3557 | 0.0900 | 0.1793, 0.5321 | 3.95 | <.0001 |\n| coches |\
    \ -0.1782 | 0.0466 | -0.2696, -0.0868 | -3.82 | 0.0001 |\n| time | 0.3566 | 0.1838\
    \ | -0.0037, 0.7169 | 1.94 | 0.0524 |"
