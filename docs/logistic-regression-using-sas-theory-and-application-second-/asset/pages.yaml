- pgno: 60
  md: "variables from the model until you make the problem go away. It’s also very\
    \ helpful to look at cross-classifications of any categorical independent variables\
    \ with the dependent variable, as we did in Table 3.1. If you find a cell frequency\
    \ of 0 in any of these tables, you’ve pinpointed a cause of quasi-complete separation.\n\
    \nAfter you’ve found the problem variables, what do you do about them? The answer\
    \ depends on whether you have complete or quasi-complete separation. If separation\
    \ is complete, there’s no way to get estimates for the coefficients of the other\
    \ variables as long as the problem variables are in the model. Because the problem\
    \ variables completely account for the variation in the dependent variable, nothing\
    \ is left for additional variables to explain. On the other hand, excluding the\
    \ problem variables from the model isn’t very appealing either. The reason they’re\
    \ problematic is that they’re too good at predicting the dependent variable. Leaving\
    \ out the strongest predictors can misleadingly suggest that they are unimportant\
    \ and can also bias the coefficients for remaining variables. If you decide to\
    \ present results for a model without the problem variables, you should also report\
    \ that the problem variables perfectly predicted the dependent variable.\n\nIf\
    \ the problem is quasi-complete separation, there are additional options to consider.\n\
    \n**Recode the problem variables.** Consider the model that has quasi-complete\
    \ separation as shown in Output 3.5. The problem occurred because all persons\
    \ with CULP=1 got life sentences. One way to eliminate this problem is to take\
    \ CULP out of the CLASS statement and treat it as a quantitative variable. Of\
    \ course, this assumes that the effect of CULP is linear, an assumption that may\
    \ be too restrictive for the data. Another method is to collapse categories 1\
    \ and 2 of CULP so that the combined category has 2 death sentences and 44 life\
    \ sentences:\n\n```\nDATA;\n    SET penalty;\n    IF culp=1 THEN culp=2;\nPROC\
    \ LOGISTIC;\n    WHERE blackd=0;\n    CLASS culp / PARAM=REF;\n    MODEL death(EVENT='1')=culp\
    \ serious;\nRUN;\n```\n\nThis produced the estimates shown in Output 3.6. Now\
    \ we get a reasonable estimate for the combined category (CULP 2), one that is\
    \ highly significant. All warning messages have disappeared."
  merge: -1
