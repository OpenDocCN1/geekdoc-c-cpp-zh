  md: '# Table 5.1 Reorganized Output from PROC LOGISTIC


    | | Keep Both vs. Return Both | Keep One vs. Return Both | Keep Both vs. Keep
    One |

    |---|---|---|---|

    | INTERCEPT | −3.47** | −1.29* | −2.18* |

