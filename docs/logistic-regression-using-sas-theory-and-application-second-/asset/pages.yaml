    The problem with this analysis is that it assumes that the three observations
    for each person are independent. That’s unlikely at face value and contradicted
    by the data. As Table 8.1 shows, the association between PTSD at time 1 and time
    2 is quite strong, and even stronger between time 2 and time 3.


    # Table 8.1 Association between Symptoms of PTSD at Adjacent Time Points


    | PTSD at Time 1 | %With PTSD at Time 2 | | PTSD at Time 2 | %With PTSD at Time
    3 |

    | Yes | 47% | | Yes | 51% |

    | No | 18% | | No | 10% |


    Of course, the real question is whether this association persists after controlling
    for the explanatory variables in the model. To answer that question, I included
    PTSD at time 1 in a logistic model predicting PTSD at time 2, along with the other
    explanatory variables that are in Output 8.2. The coefficient for PTSD at time
    1 was highly significant, indicating dependence over time (output not shown).


    What are the consequences? Even with dependence among the observations, the coefficients
    in Output 8.2 should be consistent estimates of the true coefficients, and, therefore,
    approximately unbiased. They are not efficient, however. That means that there
    are other ways of estimating the coefficients that make better use of the data,
    thereby producing'
  merge: -1
  img_proc: true
- pgno: 230
  md: "estimates with less sampling variability. A more serious problem is that the\
    \ standard errors are likely to be underestimates of the true standard errors.\
    \ And because the formula for the Wald chi-squares has the standard error in the\
    \ denominator, the chi-squares likely to be overestimates. So, maybe the p-values\
    \ aren’t as small as they appear.\n\n# 8.3 Robust Standard Errors\n\nFor the moment,\
    \ let’s ignore the lack of efficiency in the coefficient estimates and focus on\
    \ the more serious problem of biased estimates of the standard errors. SAS has\
    \ two procedures, SURVEYLOGISTIC and GENMOD, that can estimate a logistic regression\
    \ model with “robust” standard errors that correct for dependence among the repeated\
    \ measurements.\n\nThese two procedures use a method that is variously known as\
    \ the Huber-White method, the sandwich method, or the Taylor series expansion\
    \ method. For some SAS procedures (e.g., GENMOD and GLIMMIX), robust standard\
    \ errors are described in program code and output as empirical standard errors.\
    \ Without going into the technical details, the basic idea is to calculate correlations\
    \ among the Pearson residuals for the response variable within individuals, and\
    \ then use those correlations to appropriately adjust the standard errors.\n\n\
    I’ll first consider PROC SURVEYLOGISTIC, which is designed to handle complex sample\
    \ surveys with stratification, clustering, and weighting. Repeated measures can\
    \ be regarded as just a form of clustering (of the repeated measures within each\
    \ individual), so we’ll use the CLUSTER statement to request the robust standard\
    \ errors.\n\nBoth the syntax and output of SURVEYLOGISTIC are quite similar to\
    \ what we have previously seen for PROC LOGISTIC. Here is the code for estimating\
    \ the logistic model for the PTSD data:\n\n```\nPROC SURVEYLOGISTIC DATA=ptsd;\n\
    \    CLASS time / PARAM=GLM;\n    MODEL ptsd(EVENT='1') = control problems sevent\
    \ cohes time;\n    CLUSTER subjid;\nRUN;\n```\n\nOn the CLUSTER statement, we\
    \ simply name the variable that contains the ID numbers for the persons (which\
    \ are the clusters in this case). If the CLUSTER statement were omitted, we would\
    \ get the same results that we just saw in Output 8.2. Results with the CLUSTER\
    \ statement are shown in Output 8.3."
  merge: -1
  img_proc: true
- pgno: 231
