    Before going any further, I need to make a brief technical digression. The predicted
    probabilities used in the calculations reported in Output 3.17 are not the usual
    predicted values that you might produce using the OUTPUT statement in PROC LOGISTIC.
    Instead, they are “bias corrected” predicted values. The rationale is that if
    you include a particular observation in the sample used to estimate the logistic
    regression coefficients, you artificially make it more likely that the model will
    correctly predict that observation. A better method would be to delete the observation
    from the sample, re-estimate the logistic regression, and then use the results
    of that regression to generate a predicted probability for deleted observation.
    PROC LOGISTIC doesn’t actually do that because it would have to run a separate
    logistic regression for every case in the sample. But what it does is a very close
    approximation.


    Returning to Output 3.17, one might ask, “What’s the best cutpoint value?” Some
    authors recommend choosing a cutpoint that produces approximately equal values
    of sensitivity and specificity. For Output 3.17, that result occurs with a cutpoint
    around .25. But, ideally, the choice would depend on your assessment of the relative
    costs of the two'
