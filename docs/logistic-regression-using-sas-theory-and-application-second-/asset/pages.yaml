- pgno: 57
  md: "Complete separation is relatively uncommon. Much more common is something called\
    \ *quasi-complete separation*. We can illustrate this by adding a single observation\
    \ to the previous data set.\n\n```\nDATA quas isep;\n    INPUT x y;\n    DATALINES;\n\
    1 0\n2 0\n3 0\n4 0\n4 1\n5 1\n6 1\n;\nPROC LOGISTIC;\n    MODEL y(EVENT='1') =\
    \ x;\nRUN;\n```\n\nThe only difference between this and the earlier example is\
    \ that when *x*=4, there is one observation that has *y*=0 and another observation\
    \ that has *y*=1. In general, quasi-complete separation occurs whenever there\
    \ is complete separation except for a single value of the predictor for which\
    \ both values of the dependent variable occur.\n\nResults in Output 3.4 are quite\
    \ similar to those in Output 3.3 for complete separation. We again get warning\
    \ messages, although LOGISTIC tells us that the maximum likelihood *may* not exist\
    \ rather than *does* not exist. Again, we see a big disparity in the three chi-square\
    \ statistics for testing the “global null hypothesis.” And we get a very large\
    \ coefficient with a much larger standard error. One difference with complete\
    \ separation is that the log-likelihood does not go all the way to zero. A graph\
    \ of the log-likelihood function would look very much like the one in Figure 3.1,\
    \ but the asymptote for the curve would be something lower than zero."
  merge: -1
  img_proc: true
