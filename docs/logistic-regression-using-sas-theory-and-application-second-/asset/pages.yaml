    \ × 5 table, but one of those 20 combinations has no cases, leaving us with 19\
    \ “unique profiles.” For each of those 19 profiles, the observed and expected\
    \ frequencies for each of the two outcomes of the dependent variable are calculated\
    \ based on the fitted model. The deviance is then computed as"
