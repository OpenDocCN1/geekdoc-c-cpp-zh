  md: '# 3.12  Unobserved Heterogeneity


    In Section 3.10, I explained how the logit model could be derived from a dichotomized
    linear model with a disturbance term that has a logistic distribution. There we
    saw that the logit coefficients were related to the coefficients in the underlying
    linear model by the formula $\beta_j=\alpha_j/\sigma$, where $\beta_j$ is the
    logit coefficient for $x_j$, $\alpha_j$ is the corresponding coefficient in the
    linear model, and $\sigma$ is the coefficient of the disturbance term $\varepsilon$.
    This random disturbance term can be seen as representing all omitted explanatory
    variables that are independent of the measured $x$ variables, commonly referred
    to as *unobserved heterogeneity*. Because $\sigma$ controls the variance of the
    disturbance, we conclude that greater unobserved heterogeneity leads to logit
    coefficients that are attenuated toward 0. I’ll refer to this attenuation as *heterogeneity
    shrinkage*.


    This assessment doesn’t depend on the plausibility of the latent variable model.
    Suppose we take an ordinary logit model and put a disturbance term in the equation:


    $$\log\left[\frac{\Pr(y=1\mid\varepsilon)}{\Pr(y=0\mid\varepsilon)}\right]=\beta_0+\beta_1x_1+\beta_2x_2+\cdots+\beta_kx_k+\sigma\varepsilon.
    \tag{3.20}$$


    We assume that $\varepsilon$ is independent of the $x$’s and has a standard logistic
    distribution, as in equation (3.12). Notice that the probabilities on the left-hand
    side are expressed conditionally on $\varepsilon$. If we then express the model
    unconditionally, it can be shown (Allison 1987) that the result is closely approximated
    by


    $$\log\left[\frac{\Pr(y=1)}{\Pr(y=0)}\right]=\beta_0^*+\beta_1^*x_1+\beta_2^*x_2+\cdots+\beta_k^*x_k.
    \tag{3.21}$$


    where


    $$\beta_j^*=\frac{\beta_j}{\sqrt{1+\sigma^2}}.$$


    If we start with a probit model (and a standard normal disturbance) instead of
    a logit model, this result is exact rather than approximate. Again, we see that
    as the disturbance variance gets larger, the logit (or probit) coefficients get
    smaller.


    Obviously, we can never measure and include all the variables that affect the
    dependent variable, so there will always be some heterogeneity shrinkage. What
    are the'
  merge: -1
