    *1=grammar school, 2=some high school, 3=high school graduate, 4=not available.


    We could, of course, estimate a cumulative logit or an adjacent categories model
    for this table. We could also ignore the ordinality altogether and estimate a
    multinomial logit model. But let’s think about how the attainment process works
    in this case. The first step is to get past grammar school. We could estimate
    a binary logit model with the dependent variable equal to 1 if the person went
    past grammar school and 0 if he didn’t, essentially collapsing the two higher
    categories. The next step is to graduate from high school, given *that you started
    high school*. For this step, we could eliminate all the men who never started
    high school (those in the first column of frequency counts) and estimate a logit
    model with the dependent variable equal to 1 if the person graduated and 0 if
    he didn’t.


    Now, suppose we believe that the effects of the explanatory variables are the
    same at each step. It would make sense, then, to constrain the coefficients to
    be equal across steps'
