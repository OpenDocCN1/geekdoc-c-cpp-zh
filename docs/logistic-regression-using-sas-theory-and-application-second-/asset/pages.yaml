    \ seems unlikely.\n\n# Output 5.4 Type 3 Table for Two-Way Interaction Model\n\
    \n| Type 3 Analysis of Effects |  |  |  |\n| Effect | DF | Wald Chi-Square | Pr\
    \ > ChiSq |\n| male | 2 | 0.7625 | 0.6830 |\n| business | 2 | 0.9113 | 0.6340\
    \ |\n| male*business | 2 | 2.4937 | 0.2874 |\n| punish | 2 | 3.3584 | 0.1865 |\n\
    | male*punish | 2 | 0.3392 | 0.8440 |\n| business*punish | 2 | 0.9822 | 0.6119\
    \ |\n| explain | 2 | 0.1815 | 0.9133 |\n| male*explain | 2 | 1.2697 | 0.5300 |\n\
    | business*explain | 2 | 0.8757 | 0.6454 |\n| punish*explain | 2 | 2.9969 | 0.2235\
    \ |\n\nThe other issue is whether it’s appropriate to treat PUNISH as a quantitative\
    \ variable with a linear effect on the log of the odds. There are two ways to\
    \ address that question. One way is to include the square of PUNISH in the model\
    \ (by putting PUNISH*PUNISH on the MODEL statement). Since PUNISH only has three\
    \ values, that exhausts all the degrees of freedom for this variable. The squared\
    \ term has a p-value of .98 (table not shown), giving no evidence for departure\
    \ from linearity. The other method is to refit the model with PUNISH as CLASS\
    \ variable. Then take the difference between the likelihood ratio chi-squares\
    \ for this model and for the model with PUNISH as a quantitative variable. That\
    \ produces a chi-square of only .03 with two degrees of freedom, which is far\
    \ from statistically significant. So all our tests lead to the conclusion that\
    \ our original model (in Output 5.1) is consistent with the data."
  merge: -1
