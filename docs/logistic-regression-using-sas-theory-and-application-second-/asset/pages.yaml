  md: 'Results are shown in Output 7.13. The *p*-values for TTME and TIME are about
    the same as those for the conditional logit and HEV models, but the *p*-value
    for COST is quite a bit higher. Because the coefficients are based on a probit
    model, they should not be directly compared those in the conditional logit or
    HEV models, and they cannot be exponentiated to produce odds ratios. STD_1 and
    STD_2 are the estimated standard deviations of the errors for choice 1 and choice
    2, with those for 3 and 4 set to 1. The *p*-values for these estimates show that
    they are significantly different from 0, but what we really want to know is if
    they are significantly different from 1, the standard deviation for choices 3
    and 4. The 95% confidence intervals for these estimates do include 1, suggesting
    that we do not have evidence for heteroscedasticity.


    The correlation between the error for choice 4 and those for the other choices
    has been set to 0. The correlation between the error for choice 1 and choice 2
    is estimated to be -.96, but it’s still not significantly different from 0. The
    other two correlations were converging toward a number less than -1. But since
    a correlation less than -1 is not possible, they were restricted at that boundary
    value. The next two lines for RESTRICT1 and RESTRICT2 give tests for whether the
    data are consistent with restricting those correlations to -1. The high *p*-values
    suggest that there is no problem with these restrictions, although it’s not clear
    how correlations of -1 should be interpreted in this case.


