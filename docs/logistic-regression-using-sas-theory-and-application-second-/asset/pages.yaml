    Given the known superiority of the negative binomial model to the Poisson model
    for cases of overdispersion, and given the frequency with which overdispersion
    occurs, why not always use the negative binomial model? It used to be the case
    that the negative binomial model was either unavailable or difficult to implement.
    But now that it’s readily available and easy to implement, I don’t see any compelling
    reason for using Poisson regression.


    # 9.6 Adjustment for Varying Time Spans


    The Poisson distribution (or its generalization to the negative binomial) is well
    suited for describing counts of events that occur in some interval of time. In
    the preceding example, articles and citations were counted over a certain period
    of time. Other examples include the number of arrests in a five-year period, the
    number of colds that occur in one year, or the number of arguments between spouses
    in one month. If the length of the time interval is the same for every individual
    in the sample, the methods already described work just fine. But if events are
    counted over different lengths of time for different individuals, there is clearly
    a need for some kind of standardization. For ordinary regression analysis, we
    could simply divide each individual’s event count by the length of the interval
    and regress the resulting ratio on the independent variables. However, that won’t
    work for Poisson regression because the division by time implies that the resulting
    variable no longer has a Poisson distribution.


    Instead, we incorporate time into the model. If t_i is the length of the observation
    interval for individual i, the number of events (y_i) that occur during that interval
    is assumed to have the Poisson distribution'
