- pgno: 34
  md: 'statistics are labeled “Wald Chi-Square.” They are calculated by dividing each
    coefficient by its standard error and squaring the result. If we omitted the squaring
    operation (as many software packages do), we could call them z statistics, and
    they would have a standard normal distribution under the null hypothesis. In that
    case, the p-values calculated from a normal table would be exactly the same as
    the chi-square p-values reported here.


    We see that the variable SERIOUS has a highly significant coefficient, while the
    coefficient for the variable WHITVIC is clearly not significant. With a p-value
    of .13, BLACKD is approaching conventional significance levels but doesn’t quite
    make it. Now compare these p-values with those in Output 2.1 for an ordinary linear
    regression analysis. While not identical, they are remarkably similar. In this
    case at least, logistic regression and OLS regression lead us to exactly the same
    qualitative conclusions. It’s more difficult to compare coefficient estimates
    across the two methods, however, and I won’t attempt that in this chapter.


    The odds ratios in the next table are obtained by simply exponentiating the coefficients
    in the first column, that is, calculating exp(β). They are very important in the
    interpretation of logistic regression coefficients, and we will discuss that interpretation
    in the next section. The 95 percent confidence intervals are obtained as follows.
    First, we get 95 percent confidence intervals around the original β coefficients
    in the usual way. That is, we add and subtract 1.96 standard errors. To get confidence
    intervals around the odds ratios, we exponentiate those upper and lower confidence
    limits.


    The last section of Output 2.3, labeled “Association of Predicted Probabilities
    and Observed Responses,” is an attempt to measure the explanatory power of the
    model. I’ll discuss these statistics in Section 3.7.


    # 2.8 Interpreting Coefficients


    When logistic regression first became popular, a major complaint by those who
    resisted its advance was that the coefficients had no intuitive meaning. Admittedly,
    they’re not as easy to interpret as coefficients in the linear probability model.
    For the linear probability model, a coefficient of .25 tells you that the predicted
    probability of the event increases by .25 for every 1-unit increase in the explanatory
    variable. By contrast, a logit coefficient of .25 tells you that the log-odds
    increases by .25 for every 1-unit increase in the explanatory variable. But who
    knows what a .25 increase in the log-odds means?'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'The basic problem is that the logistic model assumes a nonlinear relationship
    between the probability and the explanatory variables, as shown in Figure 2.1.
    The change in the probability for a 1-unit increase in an independent variable
    varies according to where you start. Things become much simpler, however, if we
    think in terms of odds rather than probabilities.


    In Output 2.3, we saw the estimated β coefficients and their associated statistics
    in the “Analysis of Maximum Likelihood Estimates” table. Except for their sign,
    they are hard to interpret. Let’s look instead at the numbers in the “Odds Ratio
    Estimates” table which, in this example, are obtained from the parameter estimates
    by computing e^β. (When there are CLASS variables in the model, the odds ratios
    may be computed differently, depending on the parameterization). These might be
    better described as adjusted odds ratios because they control for other variables
    in the model. Recall that BLACKD has a value of 1 for black defendants and 0 for
    everyone else. The odds ratio of 1.813 tells us that the predicted odds of a death
    sentence for black defendants are 1.813 times the odds for nonblack defendants.
    In other words, the odds of a death sentence for black defendants are 81% higher
    than the odds for other defendants. This compares with an unadjusted odds ratio
    of 1.47 found in Table 2.2. Although the adjusted odds ratio for BLACKD is not
    statistically significant (the 95% confidence interval includes 1, corresponding
    to no effect), it is still our best estimate of the effect of this variable.


    For the dummy variable WHITVIC, which indicates white victim, the odds ratio is
    1.292. This implies that the predicted odds of death are about 29% higher when
    the victim is white compared to the odds when the victim is not white. Of course,
    the coefficient is far from statistically significant so we wouldn’t want to put
    much confidence in this value. What about the coefficient for the variable SERIOUS,
    which is statistically significant at the .01 level? Recall that this variable
    is measured on a 15-point scale. For quantitative variables, it’s helpful to subtract
    1 from the odds ratio and multiply by 100, that is, calculate 100(e^β−1). This
    tells us the percent change in the odds for each 1-unit increase in the independent
    variable. In this case, we find that a 1-unit increase in the SERIOUS scale is
    associated with a 21% increase in the predicted odds of a death sentence. Note
    that if a β coefficient is significantly different from 0, then the corresponding
    odds ratio is significantly different from 1. There is no need for a separate
    test for the odds ratio.


    Interpretation of coefficients in terms of odds ratios is certainly the easiest
    way to approach the logistic model. On the other hand, odds ratios can sometimes
    be misleading if'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'the probabilities are near 1 or 0. Suppose that in a wealthy suburban high
    school, the probability of graduation is .99, which corresponds to odds of 99.
    When financial aid is increased for needy students, the probability of graduation
    goes up to .995, which implies odds of 199. Apparently, the odds of graduation
    have more than *doubled* under the new program even though only half a percent
    more students are graduating. Is this a meaningful increase? That depends on many
    nonstatistical issues.


    For those who insist on interpreting logistic models in terms of probabilities,
    there are several graphical and tabular methods available (Long 1997). Perhaps
    the simplest approach is to make use of equation (2.6):


    $$\frac{\partial p_i}{\partial x_i}=\beta p_i(1-p_i).$$


    This equation says that the change in the probability for a 1-unit increase in
    $x$ depends on the logistic regression coefficient for $x$, as well as on the
    value of the probability itself. For this to be practically useful, we need to
    know what probability we are starting from. If we have to choose one value, the
    most natural is the overall proportion of cases that have the event. In our example,
    50 out of 147 defendants got the death penalty, so the overall proportion is .34.
    Taking .34 times 1−.34, we get .224. We can multiply each of the coefficients
    in Output 2.3 by .224, and we get:


    | Variable | Value |

    |---|---:|

    | BLACKD | .133 |

    | WHITVIC | .057 |

    | SERIOUS | .046 |


    We can then say that, on average, the probability of a death sentence is .133
    higher if the defendant is black compared with nonblacks, .057 higher if the victim
    is white compared with non-white, and .046 higher for a 1-unit increase on the
    SERIOUS scale. These are sometimes called “marginal effects,” and they are of
    considerable interest in some fields. Of course, these numbers only give a rough
    indication of what actually happens for a given change in the $x$ variable. Note,
    however, that they are very similar to the coefficients obtained with the OLS
    regression in Output 2.1.


    Instead of choosing a single value for $p_i$, we can calculate a predicted probability
    for each individual, using equation (2.5). Then we can use the derivative formula
    to generate marginal effects for each individual. You can easily get them with
    PROC QLIM (part of the'
