  md: "# 6.5  Cumulative Logit Model: Contingency Tables\n\nThe cumulative logit model\
    \ can be very useful in analyzing contingency tables. Consider Table 6.1, which\
    \ was tabulated by Sloane and Morgan (1996) from the General Social Survey. Our\
    \ goal is to estimate a model for the dependence of happiness on year and marital\
    \ status.\n\n**Table 6.1  General Happiness by Marital Status and Year**\n\n|\
    \ Year | Marital Status | Very Happy | Pretty Happy | Not Too Happy |\n|---|---|---:|---:|---:|\n\
    | 1974 | Married | 473 | 493 | 93 |\n|  | Unmarried | 84 | 231 | 99 |\n| 1984\
    \ | Married | 332 | 387 | 62 |\n|  | Unmarried | 150 | 347 | 117 |\n| 1994 | Married\
    \ | 571 | 793 | 112 |\n|  | Unmarried | 257 | 889 | 234 |\n\nHere’s the SAS program\
    \ to read the table:\n\n```\nDATA happy;\n    INPUT year married happy count;\n\
    \    DATALINES;\n1 1 1 473\n1 1 2 493\n1 1 3 93\n1 0 1 84\n1 0 2 231\n1 0 3 99\n\
    2 1 1 332\n2 1 2 387\n2 1 3 62\n2 0 1 150\n2 0 2 347\n2 0 3 117\n3 1 1 571\n3\
    \ 1 2 793\n3 1 3 112\n3 0 1 257\n3 0 2 889\n3 0 3 234\n;\n```"
