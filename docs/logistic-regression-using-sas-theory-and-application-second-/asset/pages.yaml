    The standardized estimates are again calculated from the formula


    $\beta_j^* = \beta_j\left(\frac{\sigma_j}{\sigma_d}\right), \quad j=1,\ldots,k,$


    but now $\sigma_d=1$, the standard deviation of a standard normal distribution.
    So the standardized estimates are just the original coefficients multiplied by
    the standard deviations of the independent variables.


    Is there any reason to choose a probit model over a logit model? Not really, as
    long as the goal is to estimate a model for a single binary dependent variable.
    The two models are very close and rarely lead to different qualitative conclusions.
    It would take very large samples to reliably discriminate between them. The logit
    model does have the advantage that its coefficients, when exponentiated, can be
    interpreted as odds ratios, something you can’t do with probit coefficients. On
    the other hand, the probit model is more easily generalized to applications that
    have multiple dichotomous outcome variables. Good examples include factor analysis
    with dichotomous observed variables (Muthén 1984) or simultaneous equation models
    for dichotomous endogenous variables (Heckman 1978). Probit is attractive in these
    settings because the models can be based on the multivariate normal distribution,
    for which there is a well-developed theory and efficient computational algorithms.
    Multivariate logistic distributions have received much less attention.


    The third model for binary data is the complementary log-log. Although not so
    widely known as the other two, the complementary log-log model has an important
    application in the area of survival analysis. The model says that


    $\log[-\log(1-p_i)] = \beta_0 + \beta_1x_{i1} + \beta_2x_{i2} + \ldots + \beta_kx_{ik}$  (3.17)'
