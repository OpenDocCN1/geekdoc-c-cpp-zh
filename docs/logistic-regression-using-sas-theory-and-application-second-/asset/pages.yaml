- pgno: 324
  md: 'As in some earlier examples, we define new versions of the row and column variables
    so that we can treat those variables as both categorical and quantitative. The
    model includes the main effects of SON and DAD as categorical, thereby ensuring
    that the marginal frequencies are fitted exactly. The relationship between the
    two variables is specified by an interaction between the quantitative versions
    of the two variables. The OUTPUT statement requests predicted values with confidence
    intervals. PROC PRINT writes them to the output window, as shown in Output 10.10.


    With 10 d.f., the quasi-uniform association model has a deviance of 19.3 (p=.04)
    and a Pearson chi-square of 16.2 (p=.094) (output not shown). While not quite
    as good a fit as the QPN model, it’s still decent for a sample of this size, and
    it has the virtue of providing a single number to describe the association between
    father’s status and son’s status in the off-diagonal cells: .3374. Exponentiating,
    we find that the estimated odds ratio in any 2 × 2 subtable is 1.40. Thus for
    adjacent categories, being in the higher category for DAD increases the odds of
    being in the higher category for SON by 40%.


    Comparing the observed and predicted frequencies in Output 10.10, we find that
    the numbers are close for most of the cells. (For the three lines shown in italics,
    the observed frequency lies outside the 95% confidence interval based on the fitted
