    | 0.0025 |

    | um vs. lm | EXP | 1 | 0.7361 | 0.0747 | 0.05 | 0.6032 – 0.8981 | 9.1100 | 0.0025
    |


    The pattern of coefficients for IQ and SES suggests that SES and IQ might be treated
    as quantitative variables, thereby obtaining a more parsimonious representation
    of the data. This is easily accomplished by removing those variables from the
    CLASS statement. I estimated two models, one removing IQ from the CLASS statement
    and the other removing SES from the CLASS statement. When IQ is treated as a quantitative
    variable, the deviance is 25.84 with 26 degrees of freedom and a *p*-value of
    .47. When SES is treated as quantitative, the deviance is 35.24 with 26 degrees
    of freedom and a *p*-value of .11. While this is still an acceptable fit, it suggests
    that perhaps the effect of SES is not quite linear. To get a more sensitive test,
    we can take the difference in deviances between the model with SES as categorical
    (25.24) and the model with SES as quantitative (35.24), yielding a chi-square
    of 10 with 2 degrees of freedom (the difference in degrees of freedom for the
    two models). This test has a *p*-value of .0067, telling us that the model with
    SES as categorical fits significantly better than the model with SES as quantitative.
    (Note: It’s not legitimate to compare models by taking differences in the *Pearson*
    chi-square; you must use differences in deviance.)


    Output 4.12 gives the parameter estimates and odds ratios for the model with SES
    as categorical and IQ as quantitative. By removing IQ from the CLASS statement,
    we impose the restriction that each one-level jump in IQ has the same effect on
    the odds of planning to go to college. The odds ratio of 1.95 tells us that each
    one-level increase in IQ approximately doubles the odds (controlling for SES and
    parental encouragement). Consequently, moving three steps (from IQ 1 to IQ 4)
    multiplies the odds by 1.95³ = 7.4.'
