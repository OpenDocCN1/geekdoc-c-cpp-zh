    \ | Z=0 | Z=1 | Z=0 |\n| 1 | 20  | 5  | 4   | 0  |\n| 0 | 5   | 5  | 11  | 0 \
    \ |\n| Total | 25 | 10 | 15 | 0 |\n\nConsidering the two-way marginal tables,\
    \ neither the XY table nor the YZ table has any zeros. But the XZ table clearly\
    \ has one random zero, producing two random zeros in the three-way table.\n\n\
    Now suppose we want to estimate a logit model for Y dependent on X and Z. We can\
    \ read the table into SAS as follows:\n\n```\nDATA zero;\n    INPUT x y z f;\n\
