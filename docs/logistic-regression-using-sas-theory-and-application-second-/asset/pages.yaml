    RUN;\n```\n\nThe AGGREGATE option tells LOGISTIC to aggregate the data over the\
    \ various levels of the predictor variables. The SCALE option requests goodness-of-fit\
    \ statistics, but specifying SCALE=NONE tells LOGISTIC not to adjust the goodness-of-fit\
    \ statistics for overdispersion, a topic we’ll examine in Chapter 4.\n\nThese\
    \ options don’t change any of the standard output—all they do is produce the new\
