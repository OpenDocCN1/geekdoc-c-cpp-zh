- pgno: 27
  md: '# Figure 2.1 Graph of Logistic Model for a Single Explanatory Variable


    ![](img/bbec4f484c16475caccf067e8da3ac57_27_0.png)


    # 2.6 Estimation of the Logistic Model: General Principles


    Now that we have a model for dichotomous dependent variables, the next step is
    to use sample data to estimate the coefficients. How that’s done depends on the
    type of data you’re working with. If you have grouped data, there are three readily
    available methods: ordinary least squares, weighted least squares, and maximum
    likelihood.


    Grouped data occurs when the explanatory variables are all discrete and the data
    is arrayed in the form of a contingency table. We’ll see several examples of grouped
    data in Chapter 4. Grouped data can also occur when data are collected from naturally
    occurring groups. For example, suppose that the units of analysis are business
    firms and the dependent variable is the probability that an employee is a full-time
    worker. Let P_i be the observed proportion of employees who work full-time in
    firm i. To estimate a logistic model by OLS, we could simply take the logit transformation
    of P, which is log[P/(1-P)], and regress the result on characteristics of the
    firm and on the average characteristics of the employees. A weighted least squares
    (WLS) analysis would be similar, except that the data would be'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'weighted to adjust for heteroscedasticity. The SAS procedure CATMOD does WLS
    estimation for grouped data (in addition to maximum likelihood).


    Maximum likelihood (ML) is the third method for estimating the logistic model
    for grouped data and the *only* method in general use for *individual-level* data.
    With individual-level data, we simply observe a dichotomous dependent variable
    for each individual along with measured characteristics of the individual. OLS
    and WLS can’t be used with this kind of data unless the data can be grouped in
    some way. If $y_i$ can only have values of 1 and 0, it’s impossible to apply the
    logit transformation—you get either minus infinity or plus infinity. To put it
    another way, any transformation of a dichotomy is still a dichotomy.


    Maximum likelihood is a very general approach to estimation that is widely used
    for all sorts of statistical models. You may have encountered it before with loglinear
    models, latent variable models, or event history models. There are two reasons
    for this popularity. First, ML estimators are known to have good properties in
    large samples. Under fairly general conditions, ML estimators are consistent,
    asymptotically efficient, and asymptotically normal. Consistency means that as
    the sample size gets larger the probability that the estimate is within some small
    distance of the true value also gets larger. No matter how small the distance
    or how high the specified probability, there is always a sample size that yields
    an even higher probability that the estimator is within that distance of the true
    value. One implication of consistency is that the ML estimator is approximately
    unbiased in large samples. Asymptotic efficiency means that, in large samples,
    the estimates will have standard errors that are, approximately, at least as small
    as those for any other estimation method. And, finally, the sampling distribution
    of the estimates will be approximately normal in large samples, which means that
    you can use the normal and chi-square distributions to compute confidence intervals
    and *p*-values.


    All these approximations get better as the sample size gets larger. The fact that
    these desirable properties have only been proven for large samples does *not*
    mean that ML has bad properties for small samples. It simply means that we usually
    don’t *know* exactly what the small-sample properties are. And in the absence
    of attractive alternatives, researchers routinely use ML estimation for both large
    and small samples. Although I won’t argue against that practice, I do urge caution
    in interpreting *p*-values and confidence intervals when samples are small. Despite
    the temptation to accept *larger p*-values as evidence against the null hypothesis
    in small samples, it is actually more reasonable to demand *smaller* values to'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'compensate for the fact that the approximation to the normal or chi-square
    distributions may be poor.


    The other reason for ML’s popularity is that it is often straightforward to derive
    ML estimators when there are no other obvious candidates. One case that ML handles
    very nicely is data with categorical dependent variables.


    The basic principle of ML is to choose as estimates those parameter values that,
    if true, would maximize the probability of observing what we have, in fact, observed.
    There are two steps to this: (1) write down an expression for the probability
    of the data as a function of the unknown parameters, and (2) find the values of
    the unknown parameters that make the value of this expression as large as possible.


    The first step is known as constructing the *likelihood function*. To accomplish
    this you must specify a model, which amounts to choosing a probability distribution
    for the dependent variable and choosing a functional form that relates the parameters
    of this distribution to the values of the explanatory variables. In the case of
    the logistic model, the dichotomous dependent variable is presumed to have a binomial
    distribution with a single “trial” and a probability of “success” given by $p_i$.
    Then $p_i$ is assumed to depend on the explanatory variables according to equation
    (2.3), which is the logistic model. Finally, we assume that the observations are
    independent across individuals.


    The second step—maximization—typically requires an iterative numerical method,
    which means that it involves successive approximations. Such methods are usually
    more computationally demanding than a non-iterative method like ordinary least
    squares. For those who are interested, I will work through the basic mathematics
    of constructing and maximizing the likelihood function in Chapter 3. Here I focus
    on some of the practical aspects of ML estimation with SAS.


    # 2.7  Maximum Likelihood Estimation with PROC LOGISTIC


    The most popular SAS procedure for doing ML estimation of the logistic regression
    model is PROC LOGISTIC. SAS has several other procedures that will also do this,
    and we will meet some of them in later chapters. But LOGISTIC has been around
    the longest, and it has the largest set of features that are likely to be used
    by most data analysts.


    Let’s estimate a logistic model analogous to the linear probability model that
    we examined in Section 2.2. Minimal SAS code for this model is'
  merge: -1
  img_proc: true
- pgno: 30
  md: "```\nPROC LOGISTIC DATA=penalty;\n    MODEL death(EVENT='1')=blackd whitvic\
    \ serious;\nRUN;\n```\n\nOf course, there are also numerous options and special\
    \ features that we’ll consider later.\n\nOne option that I’ve specified in the\
    \ MODEL statement is EVENT='1', after the dependent variable. The default in LOGISTIC\
    \ is to estimate a model predicting the lowest value of the dependent variable.\
    \ Consequently, if I had omitted EVENT='1', the result would be a logistic model\
    \ predicting the probability that the dependent variable DEATH is equal to 0.\
    \ The EVENT='1' option reverses this so that the model predicts the probability\
    \ that the dependent variable is equal to 1. (The single quotes around 1 are necessary\
    \ because PROC LOGISTIC treats the dependent variable as a character variable\
    \ rather than as a numeric variable.)\n\nAn equivalent (and popular) way to accomplish\
    \ this is to use the option DEATH(DESCENDING), which tells LOGISTIC to model the\
    \ “higher” value of DEATH rather than the lower. But what is considered higher\
    \ rather than lower can depend on other options that are chosen, so it’s safer\
    \ to be explicit about which value of the dependent variable is to be modeled.\
    \ If you forget the EVENT='1' option, the only consequence is to change the signs\
    \ of the coefficients. As long as you realize what you’ve done, you shouldn’t\
    \ need to rerun the model.\n\nResults are shown in Output 2.3. The “Model Information”\
    \ table is pretty straightforward, except for the “Optimization Technique,” which\
    \ is reported as Fisher’s scoring. This is the numerical method used to maximize\
    \ the likelihood function, and we will see how it works in Chapter 3. After the\
    \ “Response Profile” table, we see the message “Probability modeled is death=1.”\
    \ If we had not used the EVENT='1' option, this would have said “death=0”, so\
    \ it’s important to check this so that you correctly interpret the signs of the\
    \ coefficients. Next we are told that the convergence criterion was satisfied,\
    \ which is a good thing. Iterative methods don’t always converge, and we’ll talk\
    \ about why that happens and how to deal with it in Chapter 3.\n\nThe next table\
    \ reports three different “Model Fit Statistics:” AIC, SC, and -2 Log L. Values\
    \ of these fit statistics are displayed for two different models, a model with\
    \ an intercept but no covariates (predictors), and a model that includes all the\
    \ specified predictors (covariates). Usually, we can ignore the INTERCEPT ONLY\
    \ column. The most fundamental of the fit statistics, -2 Log L, is simply the\
    \ maximized value of the logarithm of the likelihood"
