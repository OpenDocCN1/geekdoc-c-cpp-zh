    \ |\n| dsevent |  | 0.1946 | 0.1538 | 626 | 1.27 | 0.2062 |\n| mcontrol |  | -1.1438\
    \ | 0.4210 | 626 | -2.72 | 0.0068 |\n| mproblem |  | 0.4913 | 0.09908 | 626 |\
    \ 4.96 | <.0001 |\n| msevent |  | 0.8033 | 0.1966 | 626 | 4.09 | <.0001 |\n| cohe\
    \ s |  | -0.2345 | 0.06373 | 626 | -3.68 | 0.0003 |\n| time | 1 | 0.8433 | 0.2873\
    \ | 626 | 2.94 | 0.0035 |\n| time | 2 | 0.4433 | 0.2324 | 626 | 1.91 | 0.0569\
    \ |\n| time | 3 | 0 | . | . | . | . |\n\nWhile the deviation coefficients can\
    \ be interpreted in the same way as the conditional logit coefficients, the coefficients\
    \ for the mean variables are usually difficult to interpret causally. Under the\
    \ assumptions of the conventional random intercept model of Section 8.5, the coefficients\
    \ for the mean variables and the corresponding deviation variables should be identical.\
    \ Hence, the degree to which they differ can be the basis of a specification test\
    \ for the conventional model. We can test the null hypothesis that the coefficients\
    \ are the same by including a CONTRAST statement in the hybrid model program:\n\
    \n```\nCONTRAST 'spec test' dcontrol 1 mcontrol -1,\n    dproblem 1 mproblem -1,\
    \ dsevent 1 msevent -1;\n```\n\nThis produced an F-statistic of 4.25 with 3 and\
    \ 626 degrees of freedom, yielding a p-value of .0055. Apparently, at least one\
    \ pair of coefficients is different, suggesting that the conventional mixed model\
    \ could lead to biased estimates of the coefficients."
