    \ there are two intercepts instead of just one. In general, the number of intercepts\
    \ for all the ordinal models in this chapter is one less than the number of categories\
    \ on the dependent variable. But like the intercept in a linear model, these rarely\
    \ have any substantive interest.\n\n# Output 6.1 PROC LOGISTIC Output for Cumulative\
