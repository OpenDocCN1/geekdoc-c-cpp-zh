  md: 'Because the scale parameter σ is not identified, we can’t recover the underlying
    coefficients. But if we test the null hypothesis that an observed coefficient
    is 0, this is equivalent to testing whether the underlying coefficient is 0.


    The remarkable thing about this model is that the β coefficients don’t depend
    on the placement of the thresholds. That means that some of the τ’s may be close
    together while others may be far apart, but the effects of the explanatory variables
    stay the same. The position of the τ’s does, of course, affect the intercepts
    and the relative numbers of cases that fall into the different categories. But
    there is a sense in which the cumulative logit model makes no assumptions about
    the distances between observed categories.


    In the latent variable interpretation of the binary logit model, we saw that if
    ε had a standard normal distribution, we got a probit model. And if ε had a standard
    extreme-value distribution, we got a complementary log-log model. The same results
    generalize to the cumulative model, although I won’t discuss these models further.
    As in the binary case, you can invoke these models in LOGISTIC with the LINK=PROBIT
    or LINK=CLOGLOG options in the MODEL statement.


    # 6.4 Cumulative Logit Model: Practical Considerations


    Now we’re ready to interpret the coefficients in Output 6.1. Because I didn’t
    use the DESCENDING option, the model predicts the probability of being in a lower
    category and, in this case, that means less ethical behavior. Each reported odds
    ratio can be interpreted as the effect of the variable on the odds of being in
    a lower rather than in a higher category, without regard to how you dichotomize
    the outcome. For example, the adjusted odds ratio for males is 2.897. We can say,
    then, that the odds of a male being in a lower category (rather than a higher
    category) are nearly three times the odds for a female. Among those in the business
    school, the odds of being in a lower category are a little more than twice the
    odds for those in other schools. For PUNISH, the adjusted odds ratio of 1.99 tells
    us that each one-level increase in PUNISH doubles the odds of being in a lower
    category rather than a higher category. Finally, those students whose parents
    explained their punishments have odds of being in a lower category that’s only
    about 35% of the odds for those parents who did not explain.'
  merge: -1
  img_proc: true
