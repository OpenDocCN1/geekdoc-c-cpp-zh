  md: "The EFFECTPLOT statement can be very helpful in visualizing the effect of a\
    \ variable in a multinomial logit model. The following program shows how to get\
    \ a plot of the predicted probabilities of falling into each of the three outcome\
    \ categories as a function of PUNISH:\n\n```\n```sas\nPROC LOGISTIC DATA=wallet;\n\
    \    MODEL wallet = male business punish explain / LINK=GLOGIT;\n    EFFECTPLOT\
    \ FIT(x=punish) / NOOBS NOLIMITS GRIDSIZE=3;\nRUN;\n```\n```\n\nFor this plot,\
    \ the other three variables are held at their means. The NOOBS option suppresses\
    \ the inclusion of the data point markers in the graph. The NOLIMITS option suppresses\
    \ the 95% confidence bands around the plots. The GRIDSIZE=3 option is included\
    \ because PUNISH has only three equally spaced values (1, 2, 3). Without this\
    \ option, the graphs would consist of smooth curves rather than the more appropriate\
    \ broken lines that are shown Output 5.5.\n\n# **Output 5.5  Plot of Predicted\
