- pgno: 171
  md: "Comparing Output 6.1 with the multinomial logit results for the same data (Output\
    \ 5.1), we find a few major differences. The most obvious is that the multinomial\
    \ model has two coefficients for every explanatory variable while the cumulative\
    \ model has only one. This makes the cumulative model much simpler to present\
    \ and interpret. A less apparent difference is that the p-values for the tests\
    \ of whether each variable has an effect on the dependent variable are all lower\
    \ in the cumulative model. This is crucial for BUSINESS, which has a p-value of\
    \ .10 in the multinomial model (with the 2 degrees of freedom Type 3 test) but\
    \ .036 in the cumulative model. The differences in p-values illustrate the claim\
    \ I made earlier, that hypothesis tests in the cumulative logit model are more\
    \ powerful.\n\n# 6.3 Cumulative Logit Model: Explanation\n\nI'll explain the cumulative\
    \ logit model in three different ways. I begin with an intuitive, nonmathematical\
    \ description. Then I present a formal definition of the model in terms of cumulative\
    \ probabilities. Finally, I explain how the model can be derived from a latent\
    \ variable model.\n\nHere's the nonmathematical explanation. Suppose you wanted\
    \ to analyze the WALLET data, but all you had was a binary logit program. One\
    \ solution to that dilemma is to group two of the three categories together so\
    \ that you have a dichotomy. Of course, to respect the ordering of the variable,\
    \ you would only want to combine categories 1 and 2 or 2 and 3, but not 1 and\
    \ 3. To get as equal a split as possible on the dependent variable, the best grouping\
    \ is to combine categories 1 and 2 together and leave 3 by itself. That way, there\
    \ are 74 cases in the (1, 2) category and 121 cases in category 3. Here's the\
    \ SAS code for doing that:\n\n```\nDATA a;\n    SET wallet;\n    IF wallet=1 THEN\
    \ wallet=2;\nPROC LOGISTIC DATA=a;\n    MODEL wallet = male business punish explain;\n\
    RUN;\n```"
  merge: -1
  img_proc: true
- pgno: 172
  md: "The results are shown in Output 6.2.\n\n# Output 6.2 Logistic Results for Dichotomized\
    \ Wallet Data\n\n| Analysis of Maximum Likelihood Estimates |\n| Parameter | DF\
    \ | Estimate | Standard Error | Wald Chi-Square | Pr > ChiSq |\n| Intercept |\
    \ 1 | -1.3189 | 0.5465 | 5.8243 | 0.0158 |\n| male | 1 | 1.1845 | 0.3408 | 12.0824\
    \ | 0.0005 |\n| business | 1 | 0.6357 | 0.3812 | 2.7808 | 0.0954 |\n| punish |\
    \ 1 | 0.5071 | 0.2474 | 4.2030 | 0.0404 |\n| explain | 1 | -1.0200 | 0.3662 |\
