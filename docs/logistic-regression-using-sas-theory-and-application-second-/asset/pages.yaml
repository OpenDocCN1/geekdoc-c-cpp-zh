  md: 'than 3.5, y is equal to 0. So we can perfectly predict y from x. If you examine
    the iteration history for these data (which you can do by putting the ITPRINT
    option in the MODEL statement), you’ll find that the coefficient for x gets larger
    at every iteration. After eight iterations, LOGISTIC detects complete separation
    and calls a halt to the iterations. The results at this iteration are reported
    in the “Analysis of Maximum Likelihood Estimates” table. There we see that the
    coefficient for x is 12.63, which is an extremely large value. The estimated standard
    error is much larger, leading to a tiny chi-square and a high p-value.


    In the “Model Fit Statistics” table, we see that -2 log L for this model (Intercept
    and Covariates) is .007, very close to 0 which is its lower bound. Figure 3.1
    is a graph of the log-likelihood function for coefficient values between 0 and
    10. We see that the log-likelihood is always increasing as β increases, approaching
    zero as an asymptote. Thus, the likelihood function has no maximum, which implies
    that the maximum likelihood estimate does not exist.


    # Figure 3.1 Log-Likelihood as a Function of the Slope under Complete Separation


    ![](img/bbec4f484c16475caccf067e8da3ac57_56_0.png)


    Another peculiarity in Output 3.4 is the disparity in the chi-square statistics
    for “Testing Global Null Hypothesis: BETA=0.” The likelihood ratio chi-square
    is large (8.3) with a p-value less than .01. The Wald chi-square, on the other
    hand, is quite small with a p-value of .70. The score statistic is in between.
    In general, Wald chi-squares tend to be very inaccurate when there is separation
    in the data, or something approaching separation.'
