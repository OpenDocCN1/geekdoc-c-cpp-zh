    Now let’s estimate the effect of STAYBABY in a matched sample. I compared all
    791 women who had a baby during the stay with an equal number of women who did
    not. To control for the effect of DAYS, I matched each woman who had a baby with
    a random draw from among those women whose length of stay was identical (or as
    close as possible). In this subsample, then, the correlation between STAYBABY
    and DAYS is necessarily .00.


    Rosenbaum and Rubin (1983) argue that adjustment by matching is “usually more
    robust to departures from the assumed form of the underlying model than model-based
    adjustment on random samples . . . primarily because of reduced reliance on the
    model’s extrapolations.”


    Despite the fact that 6,820 cases are discarded in the matched analysis, we’ll
    see that very little precision is lost in the estimation of the STAYBABY coefficient.
    I could have used the propensity score method to control for all the variables
    in Output 8.19, but I wanted to keep things simple, and the adjustment for DAYS
    would have dominated anyway.


