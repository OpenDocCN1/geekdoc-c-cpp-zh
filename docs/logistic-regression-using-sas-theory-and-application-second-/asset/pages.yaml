    # 3.8 ROC Curves


    Another approach to evaluating the predictive power of models for binary outcomes
    is the ROC curve. ROC is short for *Receiver Operating Characteristic*. That name
    stems from the fact that the methodology was first developed during World War
    II to evaluate the performance of radar receivers in the detection of enemy aircraft.


    To understand the ROC curve, you must first understand classification tables.
    As usual, our dependent variable $y$ has values of 1 or 0. Let $\hat{p}_i$ be
    the predicted probability that $y_i=1$ for individual $i$, based on some model
    that we have estimated. If we want to use the predicted probabilities to generate
    actual predictions of whether or not $y=1$, we need some cutpoint value. A natural
    choice would be .5. If $\hat{p}_i\ge.5$, we predict $y_i=1$. If $\hat{p}_i<.5$,
    we predict $y_i=0$.


    For the logistic regression model that we estimated in the last section (with
    DEATH as the dependent variable and CULP, BLACKD, and WHITVIC as predictors),
    we can then construct the following classification table:


    |  | $\hat{p}_i\ge .5$ | $\hat{p}_i<.5$ | Total |

    |---|---:|---:|---:|

    | $y_i=1$ | 35 | 15 | 50 |

    | $y_i=0$ | 10 | 87 | 97 |


    Thus, 35 persons who got the death penalty are correctly predicted but 15 are
    not. Of those who did not get the death penalty, 87 are correctly predicted but
    10 are not. This seems pretty accurate, but we want a more precise way of quantifying
    that accuracy. One way is to compute the overall proportion of predictions that
    are correct: (35+87)/(50+97) = .83. So 83 percent of our predictions are correct
    which, again, seems quite good. But the overall proportion correct can be quite
    misleading. Suppose that a data set has 100 events and 900 non-events. A model
    with *no* predictors will generate predicted values that are all .10, and thus
    all the cases would be predicted as non-events. This model would be right 90 percent
    of the time, but clearly that’s not a good indication of the model’s predictive
    accuracy.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'To do better, we first define *sensitivity* and *specificity*. Sensitivity
    is the proportion of events that are correctly predicted, in this case 35/50 =
    .70. Specificity is the proportion of *non-events* that are correctly predicted,
    i.e., 87/97 = .90. The ideal is for both of these proportions to be high. In our
    hypothetical example with 100 events, 900 non-events and no predictors, the specificity
    would be 1.00 but the sensitivity would be 0, which is a clearly unacceptable
    result. Keep in mind that, in many applications, the choice of which of the two
    outcomes gets labeled as an event is completely arbitrary. And that implies that
    which of the two proportions gets labeled as sensitivity and which is labeled
    as specificity is also arbitrary.


    I produced the numbers in the classification table above with PROC LOGISTIC by
    including the options CTABLE and PPROB=.5 on the MODEL statement. Although .5
    might seem like the most natural cutpoint for prediction, we could certainly try
    others. In fact, if you use the CTABLE option without the PPROB option, you get
    classification tables for a wide range of possible cutpoint values, as shown in
    Output 3.17 where the cutpoint probabilities (in the first column) range from
    0 to .98, incrementing by .02 for each table. Each row corresponds to a different
    2 × 2 table. The two frequencies under the “Correct” heading should be unambiguous.
    Under the “Incorrect” heading, an incorrect “Event” is an observation that is
    predicted to be an event but was actually a non-event. And similarly, an incorrect
    “Non-Event” is an observation that is predicted to be a non-event but actually
    was an event. The column labeled “Correct” is the overall percentage of predictions
    that were correct. Interestingly, this reaches its highest value of 84.4 percent
    for cutpoints that range from .28 to .34.


    The next two columns report the sensitivity and specificity for each cutpoint,
    reported as percentages. The most striking thing about these columns is the inverse
    relationship between specificity and sensitivity. The closer the cutpoint is to
    zero, the higher probability that an observation will be predicted to be an event.
    So most events will be predicted to be events, and sensitivity will be high. But
    most non-events will also be predicted to be events, and specificity will be low.
    When the cutpoint is high, you get the opposite pattern. A much larger fraction
    of the observations are predicted to be non-events, so sensitivity is low but
    specificity is high.'
  merge: -1
  img_proc: true
