- pgno: 117
  md: "# Chapter 4\n\n# Logit Analysis of Contingency Tables\n\n+   4.1  Introduction\
    \  109\n+   \n+   4.2  A Logit Model for a 2 × 2 Table  110\n+   \n+   4.3  A\
    \ Three-Way Table  114\n+   \n+   4.4  A Four-Way Table  116\n+   \n+   4.5  A\
    \ Four-Way Table with Ordinal Explanatory Variables  122\n+   \n+   4.6  Overdispersion\
    \  129\n\n# 4.1  Introduction\n\nTo many people, categorical data analysis means\
    \ the analysis of contingency tables, also known as cross tabulations. For decades,\
    \ the mainstay of contingency table analysis was the chi-square test introduced\
    \ by Karl Pearson in 1900. However, things changed dramatically with the development\
    \ of the loglinear model in the late 1960s and early 1970s. Loglinear analysis\
    \ made it possible to analyze multi-way contingency tables, testing both simple\
    \ and complex hypotheses in an elegant statistical framework. In Chapter 10, we’ll\
    \ see how to estimate loglinear models using the GENMOD procedure.\n\nAlthough\
    \ loglinear analysis is still a popular approach to the analysis of contingency\
    \ tables, logit analysis (logistic regression) can often do a better job. In fact,\
    \ there is an intimate relationship between the two approaches. For a contingency\
    \ table, every logit model has a loglinear model that is its exact equivalent.\
    \ The converse doesn’t hold—there are loglinear models that don’t correspond to\
    \ any logit models—but in most cases, such models have little substantive interest."
  merge: -1
  img_proc: true
- pgno: 118
  md: 'If logit and loglinear models are equivalent, why use the logit model? Here
    are three reasons:


    +   - The logit model makes a clear distinction between the dependent variable
    and the independent variables. The loglinear model makes no such distinction—all
    the conceptual variables are on the right-hand side of the equation.

    +   - The loglinear model has many more parameters than the corresponding logit
    model. Most of these are nuisance parameters that have no substantive interest,
    and their inclusion in the model can be confusing (and potentially misleading).

    +   - With larger tables, loglinear models are much more prone to convergence
    failures because of cell frequencies of 0.


    In short, logit analysis can be much simpler than loglinear analysis even when
    estimating equivalent models. As we shall see, logit analysis of contingency tables
    has more in common with ordinary multiple regression than it does with traditional
    chi-square tests. In the remainder of this chapter, we’ll see how to analyze contingency
    tables using the LOGISTIC procedure. In this chapter, we’ll look only at tables
    where the dependent variable is dichotomous, but later chapters will consider
    tabular data with dependent variables having more than two categories. Much of
    what we do in this chapter will involve the application of tools already developed
    in preceding chapters.


    # 4.2 A Logit Model for a 2 × 2 Table


    Let’s begin with the simplest case—a dichotomous dependent variable and a single
    dichotomous independent variable. That leads to a 2 × 2 table like the one in
    Table 2.2, reproduced here as Table 4.1.


    # Table 4.1 Death Sentence by Race of Defendant


    |  | Blacks | Nonblacks | Total |

    |---|---|---|---|

    | Death | 28 | 22 | 50 |

    | Life | 45 | 52 | 97 |

    | Total | 73 | 74 | 147 |'
  merge: -1
