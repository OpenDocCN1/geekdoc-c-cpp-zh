- pgno: 177
  md: 'Many of the issues and options discussed in Chapters 2 and 3 for the binary
    logit model also apply to the cumulative logit model. For example, everything
    I said about confidence intervals is true for the cumulative logit model. Multicollinearity
    is a comparable problem in the cumulative model, and the approach to diagnosis
    is the same. Problems of non-convergence and infinite parameter estimates can
    occur in the cumulative model, although with somewhat reduced frequency. That’s
    because, as the number of categories on the dependent variable increases, it’s
    harder to find explanatory variables that perfectly predict the dependent variable.
    The generalized R² is available for the cumulative logit model, and its formula
    is identical to equation (3.10).


    One difference between binary and cumulative models in LOGISTIC is that many regression
    diagnostics are not available for the cumulative model. For example, you can’t
    produce any of the diagnostic plots discussed in Chapter 3. Using the OUTPUT statement,
    you can’t get any of the residuals or influence statistics. However, you can produce
    predicted probabilities for each individual and each category, together with upper
    and lower confidence limits if you wish. And you can plot the predicted values
    against the explanatory variables with the EFFECTPLOT statement.


    There are two methods for getting predicted values for the model in Output 6.1.
    I’ll first explain the traditional method, which is a little tricky. Then I’ll
    describe a newer, more straightforward method. The traditional method is implemented
    by including the statement


    ```

    OUTPUT OUT=a PRED=p;

    ```


    after the MODEL statement. For each observation in the original data set, there
    are two records in the OUTPUT data set, one for each of the first two categories
    on the dependent variable. (With J categories on the dependent variable, there
    will be J−1 predicted values for each observation.) The first 10 records in data
    set A (corresponding to the first five cases in the original data set) are shown
    in Output 6.4. The first two records are for the first person in the original
    data set. The first record gives a predicted probability of .13076 that WALLET
    has a value of 1. The second line gives the predicted probability that WALLET
    will have a value less than or equal to 2. To get the predicted probability that
    WALLET is actually equal to 2, we must subtract the preceding probability, i.e.,
    .47092−.13076=.34016. To get the predicted probability that WALLET=3, we must
    subtract the predicted probability that WALLET=2 from 1, that is, 1−.47092=.52908.
    Following this method, the predicted probabilities for the next person in the
    output (observations 3 and 4) are .05024, .18812, and'
