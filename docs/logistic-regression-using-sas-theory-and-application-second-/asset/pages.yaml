    # 3.6  Goodness-of-Fit Statistics


    The LOGISTIC procedure can produce many different statistics to help you evaluate
    your models. We’ve already examined some of the default statistics, notably the
    global chi-square tests produced by LOGISTIC and the AIC and SC measures of relative
    fit (Section 2.7). In this section, we’ll look at some of the optional statistics.


    It’s essential to keep in mind that there are many ways of approaching model evaluation,
    and statistics that appear to be similar may actually answer quite different questions.
    For example, LOGISTIC’s global chi-square addresses the question, “Is this model
    better than nothing?” A significant chi-square signals a “yes” answer, suggesting
    that the model is acceptable. By contrast, in this section we will examine the
    deviance chi-square, which answers the question, “Is there a better model than
    this one?” Again, a significant chi-square corresponds to a “yes” answer, but
    that leads to rejection of the model.


    The deviance is often described as a goodness-of-fit statistic. Such statistics
    implicitly involve a comparison between the model of interest and a “maximal”
    model that is more complex. The maximal model always fits better than the model
    of interest—the question is whether the difference in fit could be explained by
    chance.


    In calculating the deviance for a logistic model, the maximal model is often referred
    to as the saturated model. A saturated model has one parameter for every predicted
    probability and therefore produces a perfect fit to the data. As a likelihood
    ratio statistic, the deviance is equal to twice the positive difference between
    the log-likelihood for the fitted model and the log-likelihood for the saturated
    model. With individual-level data, the log-likelihood for the saturated model
    is necessarily 0, so the deviance is just −2 times the log-likelihood for the
    fitted model.


    Unfortunately, with individual-level data the deviance doesn’t have a chi-square
    distribution, for two reasons:


    +   - The number of parameters in the saturated models increase with sample size,
    thereby violating a condition of asymptotic theory.

    +   - The predicted frequencies for each observation are small (between 0 and
    1).'
