    In the U.S. (FRANCE=0), the odds ratio for FAMANUAL is .684, meaning that men
    whose fathers had manual occupations had a 32 percent lower odds of identifying
    with the working class. But this odds ratio is not significantly different from
    1, as indicated by the 95 percent confidence interval that easily includes 1.
    On the other hand, for men in France the odds ratio for FAMANUAL is 3.083 with
    a 95 percent confidence interval that clearly does not include 1. So in France,
    men whose fathers held manual occupations had an odds of working class identification
    that was about triple the odds of men whose fathers held non-manual jobs.


    While this is the most natural way of interpreting the interaction, there’s also
    a different view. The next two lines of Output 4.8 tell us how the effect of being
    in France rather than the U.S. varies by father’s occupation. For men whose fathers
    had non-manual jobs, the odds of identifying with the working class among Frenchmen
    was 3.245 times the odds among Americans. Judging from the confidence interval,
    this is a highly significant effect. But the country effect is much larger among
    men whose fathers had manual jobs: the odds ratio increases to 14.633, which is
    an effect that is more than four times larger. We know that these two odds ratios
    are significantly different because the interaction is significant.


    To sum up our analysis, manual workers and Frenchmen are more likely to identify
    with the working class. In France, men whose fathers had a manual occupation are
    also more likely to identify with the working class, an effect that is independent
    of one’s own occupation. In the U.S., however, a father’s occupation makes little,
    if any, difference.'
