    For these data, then, the constrained continuation ratio model is a failure, its
    attractive parsimony apparently spurious. Nevertheless, even when a single equation
    model is inappropriate, there can be conceptual advantages in viewing the process
    in terms of stages. Output 6.14 is probably more meaningfully interpreted than
    a multinomial logit model with an equal number of coefficients. Another potential
    advantage of the continuation ratio approach—one not applicable to the data in
    Table 6.2—is the possibility of stage-dependent explanatory variables. Variables
    like parental income, number of persons in the household, and presence of the
    father are likely to vary over time, and this variation can be easily incorporated
    into the modeling process. In constructing the working data set, you simply redefine
    the variables to have different values at each of the stages.'
