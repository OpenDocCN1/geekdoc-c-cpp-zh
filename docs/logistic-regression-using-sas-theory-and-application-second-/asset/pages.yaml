- pgno: 160
  md: "# 5.5  Estimation with a Binary Logit Procedure\n\nAs we’ve just seen, the\
    \ multinomial logit model can be interpreted as a set of binary logit equations,\
    \ each equation corresponding to a comparison between two of the categories of\
    \ the dependent variable. It turns out that you can legitimately estimate the\
    \ multinomial logit model by running a set of binary logit models (Begg and Gray\
    \ 1984). For each two-category contrast, observations that fall into other categories\
    \ are excluded. Here’s how to do it for the three columns of Table 5.1:\n\n```\n\
    PROC LOGISTIC DATA=wallet;\n    WHERE wallet NE 2;\n    MODEL wallet=male business\
    \ punish explain;\nPROC LOGISTIC DATA=wallet;\n    WHERE wallet NE 1;\n    MODEL\
    \ wallet=male business punish explain;\nPROC LOGISTIC DATA=wallet;\n    WHERE\
    \ wallet NE 3;\n    MODEL wallet=male business punish explain;\nRUN;\n```\n\n\
    In the WHERE statements, NE means “not equal to.” Because WALLET has only three\
    \ categories, removing any one of them reduces the model to a binary logit model.\
    \ By default, the reference category of the dependent variable in each logit model\
    \ is the higher value. So the first model predicts a 1 rather than a 3, the second\
    \ model predicts a 2 rather than a 3, and the third model predicts a 1 rather\
    \ than a 2.\n\nResults are shown in Table 5.2. Comparing this with Table 5.1,\
    \ we see that the coefficients are very similar but not identical. The significance\
    \ levels are also pretty much the same, although the *p*-value for BUSINESS in\
    \ the KEEP BOTH VS. RETURN BOTH column is slightly below .05 in Table 5.1 and\
    \ slightly above in Table 5.2.\n\n**Table 5.2  Multinomial Estimates by Using\
    \ Binary Logits**\n\n|  | Keep Both vs. Return Both | Keep One vs. Return Both\
    \ | Keep Both vs. Keep One |\n|---|---:|---:|---:|\n| INTERCEPT | −3.53** | −1.33*\
    \ | −2.28* |\n| MALE | 1.42* | 1.14* | .18 |\n| BUSINESS | 1.07 | .38 | .79 |\n\
    | PUNISH | 1.09** | .23 | .87* |\n| EXPLAIN | −1.63** | −.77* | −.68 |\n\n*p*<.05,\
    \ **p**<.01"
  merge: -1
  img_proc: true
- pgno: 161
  md: 'The coefficients in Table 5.2 have no more bias than the ones in Table 5.1
    (in technical terms, they have the same probability limit). But the binary estimates
    in Table 5.2 are less efficient—they have somewhat larger true standard errors.
    Furthermore, unlike Table 5.1, the third column of Table 5.2 is *not* exactly
    equal to the difference between the first two columns. Finally, estimation by
    binary logits won’t give you a global test of whether *all* the coefficients for
    a particular variable are equal to 0, as do the tests in the Type 3 table of Output
    5.1.


    What’s the point of this exercise? Well, occasionally you may find yourself in
    a situation where it’s more convenient to do binary estimation than multinomial
    estimation. One possible advantage in doing it this way is that you can have different
    sets of variables in different equations. Another advantage is that there many
    options (like the Firth method described in Chapter 3) that are available for
    binary logit but not for multinomial logit. But I think the main payoff is conceptual.
    When I first learned this equivalence, it really helped me understand that the
    multinomial model is built up of binomial models. The simultaneous estimation
    procedure is just a technical refinement.


    # 5.6 General Form of the Model


    To this point, we’ve been dealing with just three categories for the dependent
    variable. Now let’s generalize the model to $J$ categories, with the running index
    $j=1,...,J$. Let $p_{ij}$ be the probability that individual $i$ falls into category
    $j$. The model is then


    $$\log\left(\frac{p_{ij}}{p_{iJ}}\right)=\boldsymbol{\beta}_j\mathbf{x}_i \qquad
    j=1,...,J-1 \tag{5.1}$$


    where $\mathbf{x}_i$ is a column vector of variables describing individual $i$,
    and $\boldsymbol{\beta}_j$ is a row vector of coefficients for category $j$. Note
    that each category is compared with the highest category $J$. These equations
    can be solved to yield


    $$p_{ij}=\frac{e^{\boldsymbol{\beta}_j\mathbf{x}_i}}{1+\sum_{k=1}^{J-1}e^{\boldsymbol{\beta}_k\mathbf{x}_i}}
    \qquad j=1,...,J-1 \tag{5.2}$$


    Because the probabilities for all $J$ categories must sum to 1, we have


    $$p_{iJ}=\frac{1}{1+\sum_{k=1}^{J-1}e^{\boldsymbol{\beta}_k\mathbf{x}_i}}$$'
  merge: -1
  img_proc: true
- pgno: 162
