    | year 2 vs 3 | 1.127 | 0.994 | 1.278 |


    The first thing we see in Output 6.6 is that the score test for the proportional
    odds assumption indicates fairly decisive rejection of the model. This is corroborated
    by the overall goodness-of-fit tests (obtained with the AGGREGATE and SCALE=NONE
    options), both of which have p-values less than .0001. The score test has 3 degrees
    of freedom corresponding to the constraints imposed on the three coefficients
    in the model. Roughly speaking, the score test (chi-square=26.5) can be thought
    of as one component of the overall deviance (chi-square=31). So we can say that
    approximately 85% of the deviance stems from the constraints imposed by the cumulative
    logit model. The remaining 15% (and 4 degrees of freedom) comes from possible
    interactions between year and marital status that have been excluded from the
    model.


    Should we reject the model? Keep in mind that the sample size is quite large (5,724
    cases), so it may be hard to find any parsimonious model with a p-value above
    .05. But let’s postpone a decision until we examine more evidence. Turning to
    the lower part of the output, we see strong evidence that married people report
    greater happiness than the unmarried people, but little evidence for change over
    time. Neither of the individual year coefficients is statistically significant.
    The Type 3 test that both coefficients are 0 is also nonsignificant. So let’s
    try deleting the year variables and see what happens (Output 6.7).'
