    # 7.5 Other Applications


    The two discrete choice examples that we examined in the previous sections had
    two features in common:


    +   - Each person had the same set of options.

    +   - Each person could choose one and only one option.


    Neither of these features is essential to the discrete choice methodology. In
    the chocolate bar example, instead of receiving all eight chocolate bars, each
    person could have been given two chocolate bars and asked to decide which was
    better. Or some people could get two chocolate bars while others get three or
    four chocolate bars. In studies of travel mode choice, some cities might not have
    train service, which removes that option from the choice set of persons traveling
    to those cities. This creates no special difficulty for data processing and analysis.
    Each person has a distinct record for every available option—some people may have
    more records, others may have fewer. The only limitation is that if you want to
    include dummy variables for each option there has to be a substantial amount of
    overlap in people’s option sets.


    If the principal aim is to estimate the effects of the characteristics of the
    options on each person’s choice, there’s no need for the option sets to have any
    items in common. For example, one well-known study examined the factors affecting
    students’ choices of where to attend graduate school (Punj and Staelin 1978).
    Each person’s option set consisted of the schools to which he or she had been
    accepted. Obviously, this set varied enormously in size and composition. Explanatory
    variables included such things as student body size, tuition, financial aid, academic
    reputation, and distance from the applicant. While there was'
