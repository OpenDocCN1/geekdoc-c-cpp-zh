    When the two nonsignificant interactions are deleted, the deviance goes up but
    the degrees of freedom goes up even more, giving us an improved p-value of about
    .15.


    Moreover, the difference in deviance between the models in Output 4.6 and Output
    4.7 is only 2.22 with 2 degrees of freedom, far from significant. So deleting
    the two interactions does not significantly worsen the fit.


    Let’s interpret the estimates in Output 4.7. The estimate for MANUAL is the most
    straightforward because it’s not involved in the interaction. With an odd ratio
    of 12.373, we can say that manual workers have an odds of identification with
    the working class that is more than 12 times the odds for non-manual workers.


    No odds ratios are reported, however, for the two variables with an interaction
    effect, FRANCE and FAMANUAL. By default, PROC LOGISTIC does not report odds ratios
    for variables that are involved in interactions. In the previous edition of this
    book, I showed how to get the desired odds ratios by doing some tedious hand calculations.
    But now it’s much easier to let SAS do it, using the ODDSRATIO statement.


    As with any 2-way interaction, we can view the results in two different ways.
    The model says that the effect of FAMANUAL depends on the value of FRANCE, but
    it also says that the effect of FRANCE depends on the value of FAMANUAL. Both
    views can be examined by including the following two statements in our LOGISTIC
    program:


    ```

    ODDSRATIO famanual / AT(france=0 1);

    ODDSRATIO france / AT(famanual=0 1);

    ```


    which produces Output 4.8.'
