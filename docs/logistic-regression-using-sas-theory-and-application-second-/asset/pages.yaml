    How do you decide which is the right correlation structure? Well, as I said before,
    if the number of time points is relatively small (say, four or less), I would
    definitely choose the unstructured matrix. If the number of time points is larger,
    I would first try to fit the unstructured matrix. If it works (and sometimes it
    won’t), I would examine the correlations to see if there’s a trend toward correlations
    that decline with the time between measurements. If there is such a trend, I’d
    be inclined to go with the MDEP structure. If not, the exchangeable structure
    might be fine. Incidentally, if you’re using GEE to handle other kinds of clustering,
    like students within schools or people within neighborhoods, the exchangeable
    structure is usually the only way to go because there’s no natural ordering of
    the people within clusters. The first-order autoregressive (AR) structure is rarely
    appropriate unless the correlations are all quite high.


    One can also use the QIC statistic, shown in the three preceding outputs, to compare
    the empirical fit for different correlation structures. This statistic was introduced
    by Pan (2001) as the GEE equivalent of the AIC statistic, which is often used
    to compare models estimated by maximum likelihood. As with the AIC statistic,
    models with lower values of QIC are preferred. The other fit statistic (QICu)
    is an approximation to the QIC that is recommended only for comparing models with
    different sets of predictors, not for comparing correlation structures. For the
    three correlation structures that we have examined here, the QIC statistics are
    all about the same. So it’s not very helpful for this example. In general, my
    experience with this statistic has not been encouraging. It sometimes indicates
    a preference for structures that are clearly inconsistent with the unstructured
    correlation matrix. Hin and'
