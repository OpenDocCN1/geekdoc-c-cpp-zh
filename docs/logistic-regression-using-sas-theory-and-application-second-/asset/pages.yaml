    In the “Model Information” table, we see that out of 316 strata (one for each
    person), 181 were deemed “uninformative.” And since each of these 181 persons
    had three records, 543 of the observations were uninformative. To understand what
    this means, we must go to the “Strata Summary” table. There we find that 144 people
    did not have PTSD at any of the three time points, and another 37 people had PTSD
    at all three time points. These add up to the 181 uninformative strata, fully
    57 percent of the sample. Why are they uninformative? Well, the conditional likelihood
    is trying to explain why a person with a certain number of occasions with PTSD
    symptoms had them at some times and not at other times. But if we know that a
    person had symptoms at all three interviews or at none of the interviews, there’s
    no variation in timing to explain.


    Several other things are evident in the LOGISTIC output: there’s no intercept,
    there’s no coefficient for COHES, and the p-values are a lot higher than those
    we have seen in previous regression output for these data. The reason we don’t
    get a COHES coefficient is that COHES is constant over time. This is a quite general
    and often maddening characteristic of fixed-effects models: they can’t produce
    coefficients for variables that don’t vary within clusters. The explanation is
    both simple and intuitive. In constructing the conditional likelihood, we essentially
    pose the question, “Given that k events happened to this individual,'
  merge: -1
