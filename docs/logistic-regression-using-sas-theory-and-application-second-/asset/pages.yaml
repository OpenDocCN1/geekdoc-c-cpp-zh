  md: 'control for all stable characteristics of persons, regardless of whether those
    characteristics can be measured. Needless to say, this is an extremely attractive
    possibility, and one that is easily implemented with the LOGISTIC procedure. Unfortunately,
    as we shall see, there are significant limitations that keep this approach from
    being the universally preferred method.


    The equation for the model is exactly the same as equation (8.2) for the random
    intercepts model:


    log( p_it / (1 - p_it) ) = α_i + β x_it .


    As before, the α_i term represents all unobserved differences among individuals
    that are stable over time. Because α_i is the same for a given person at all three
    time points, a positive correlation is induced among the observed outcomes.


    In the mixed model approach, we treated α_i as a random variable with a specified
    probability distribution: normal with mean 0, variance σ², and independent of
    x_it. In this section, we treat α_i as a set of fixed constants, one for each
    individual in the sample, an approach that is sometimes referred to as a fixed-effects
    model. But how can we estimate it? If the response variable were continuous, we
    could use ordinary least squares, with a dummy variable for each individual i
    (less one) (Allison 2005). For example, if the dependent variable were CONTROL
    instead of PTSD, we could fit a model to the 948 observations with 316 dummy variables.
    That may seem like an outrageous number of variables in the model, but it’s perfectly
    legitimate. An equivalent method that is more computationally tractable is to
    transform all variables so that they are expressed as deviations from each individual’s
    means. Then, the model is run on the transformed variables. PROC GLM can accomplish
    this automatically by using the ABSORB statement.


    Unfortunately, the dummy variable or mean deviation methods aren’t satisfactory
    for logistic regression, unless the number of clusters (dummy variables) is small
    and the number of observations per cluster is relatively large. It certainly wouldn’t
    be appropriate for the PTSD example. The difficulty is caused by the “incidental
    parameters problem” (Kalbfleisch and Sprott 1970). In the asymptotic theory of
    maximum likelihood estimation, it is usually assumed that the number of observations
    gets large while the number of parameters to be estimated remains constant. However,
    when equation (8.2) is applied to longitudinal data,'
  merge: -1
  img_proc: true
- pgno: 250
  md: "each additional individual adds an additional parameter to the model. This\
    \ can lead to substantial overestimates of the coefficients for other variables.\n\
    \nOne solution to the incidental parameters problem is called conditional likelihood\
    \ estimation (Chamberlain 1980). In constructing the likelihood function, we condition\
    \ on the number of 1’s and 0’s that are observed for each individual. For example,\
    \ if a person had PTSD symptoms at time 1 but not at time 2 and time 3, we ask,\
    \ “Given that this person had only one occasion with PTSD symptoms, what’s the\
    \ probability that it occurred at time 1 and not at time 2 or time 3?” We write\
    \ an expression for this probability as a function of the explanatory variables\
    \ and the β parameters, and we multiply these probabilities together for all individuals\
    \ to get the overall likelihood. When this is done, the αi parameters cancel from\
    \ the likelihood function. We say that they have been conditioned out of the likelihood.\
    \ Presto, no more incidental parameters problem.\n\nHow can we implement this\
    \ method? The conditional likelihood function for the fixed-effects model has\
    \ a form that’s identical to the conditional logit model that we examined for\
    \ discrete choice models in Chapter 7. And as we saw there, the conditional logit\
    \ model can be implemented with the STRATA statement in PROC LOGISTIC. Here’s\
    \ the code for estimating the fixed-effects model for the PTSD data:\n\n```\n\
    PROC LOGISTIC DATA=ptsd ;\n    CLASS time / PARAM=GLM;\n    MODEL ptsd(EVENT='1')\
    \ = control problems sevent cohes time;\n    STRATA subjid;\nRUN;\n```\n\nSelected\
    \ results are shown in Output 8.13.\n\n# Output 8.13 PROC LOGISTIC Output for\
    \ Fixed-Effects Logit Model\n\n| Model Information |\n|---|---| \n| Data Set |\
    \ MY.PTSD |\n| Response Variable | ptsd |\n| Number of Response Levels | 2 |\n\
    | Number of Strata | 316 |\n| Number of Uninformative Strata | 181 |\n| Frequency\
    \ Uninformative | 543 |\n| Model | binary logit |\n| Optimization Technique |\
    \ Newton-Raphson ridge |"
