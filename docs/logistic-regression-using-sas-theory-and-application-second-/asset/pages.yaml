- pgno: 63
  md: "For CULP 1, the missing lower confidence limit should be read as minus infinity.\
    \ Since the 99 percent confidence interval for this variable does not include\
    \ 0, we can easily reject the null hypothesis that the coefficient is 0 at the\
    \ .01 level. By contrast, a Wald confidence interval for this variable ranges\
    \ from -398.3 to 367.2.\n\n# Use exact methods.\n\nAll the models we have estimated\
    \ so far with PROC LOGISTIC have used maximum likelihood. Although maximum likelihood\
    \ has many attractive properties, it’s important to keep in mind that the standard\
    \ errors and p-values produced by maximum likelihood are large-sample approximations.\
    \ In small samples, or in cases with separation, the accuracy may not be as good\
    \ as we would like.\n\nAn alternative estimation method that has good small-sample\
    \ properties is “exact logistic regression.” This method can be viewed as a generalization\
    \ of Fisher’s exact test for two-way contingency tables. In this approach, p-values\
    \ are calculated by enumerating all the possible sample outcomes under the null\
    \ hypothesis. The exact method produces valid p-values even in cases of complete\
    \ or quasi-complete separation. You can implement the method in PROC LOGISTIC\
    \ with the EXACT statement, as in the following program:\n\n```\nPROC LOGISTIC\
    \ DATA=penalty;\n    WHERE blackd=0;\n    CLASS culp /PARAM=REF;\n    MODEL death(EVENT='1')\
    \ = culp serious;\n    EXACT culp serious / ESTIMATE=BOTH;\nRUN;\n```\n\nHere\
    \ the EXACT statement requests exact results for both CULP and SERIOUS. The ESTIMATE=BOTH\
    \ option requests both parameter estimates and odds ratios. Results are shown\
    \ in Output 3.9 (not shown are the usual ML estimates that precede these results).\n\
    \n# Output 3.9 EXACT Estimates with Quasi-Complete Separation\n\n| Conditional\
    \ Exact Tests |\n| Effect | Test | Statistic | p-Value | |\n|  |  |  | Exact |\
    \ Mid |\n| culp | Score | 31.8119 | <.0001 | <.0001 |\n|  | Probability | 4.53E-10\
    \ | <.0001 | <.0001 |\n| serious | Score | 1.4073 | 0.2403 | 0.2397 |\n|  | Probability\
    \ | 0.00116 | 0.6723 | 0.6718 |"
