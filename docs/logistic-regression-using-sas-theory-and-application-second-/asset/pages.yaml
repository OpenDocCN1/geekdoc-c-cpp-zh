- pgno: 240
  md: 'Wang (2009) have proposed an alternative statistic that seems to perform much
    better, at least according to their simulations. But that statistic (which they
    call CIC) is not currently available in SAS.


    One potential criticism of the GEE models we have seen so far is that they are
    based on Pearson correlations for the residuals of a dichotomous response. Those
    correlations should vary, in part, as a function of the predicted value of the
    dichotomous variable. Predicted values near 0 or 1 should lead to lower correlations.
    It might be preferable to specify the model in terms of measures of association
    that do not depend on the predicted values.


    GENMOD offers a solution to that problem by parameterizing the over-time associations
    in terms of odds ratios rather than correlations. The method is called “alternating
    logistic regression” because the iterative algorithm alternates between (1) a
    GEE step for the main model and (2) a conventional logistic regression for the
    odds ratios that describe the relationships among the repeated measures. GENMOD
    allows for some fairly complex models for these odds ratios, such as different
    values for different subgroups, and odds ratios that depend on other explanatory
    variables. Here, we’ll look at two of the simpler models that are analogs of the
    TYPE=UN and TYPE=EXCH.


    To do the odds-ratio equivalent of the unstructured model for the PTSD data, we
    change the REPEATED statement to read


    ```

    REPEATED SUBJECT=subjid / WITHIN=time LOGOR=FULLCLUST;

    ```


    LOGOR refers to the logarithm of the odds ratio, and FULLCLUST says that there
    is a full set of odds ratios within each cluster. So this option allows for a
    different (partial) odds ratio for each pair of repeated outcome measurements.
    Results are shown in Output 8.9.


    # Output 8.9 GEE Results for an Unstructured Odds Ratio Model


    | Log Odds Ratio Parameter Information |

    |---|---|

    | Parameter | Group |

    | Alpha1 | (1, 2) |

    | Alpha2 | (1, 3) |

    | Alpha3 | (2, 3) |'
