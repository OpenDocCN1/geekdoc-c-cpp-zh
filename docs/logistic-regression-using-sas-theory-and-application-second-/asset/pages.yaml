- pgno: 65
  md: 'conservative because of the discreteness of the distribution. In this example,
    that correction makes little difference.


    The title of the next table in Output 3.9, “Exact Parameter Estimates,” is somewhat
    misleading because these estimates are no more exact than conventional maximum
    likelihood estimates. For variables that do not cause separation, the parameter
    estimates are “conditional” maximum likelihood estimates. That is, they are estimates
    that maximize a conditional likelihood that eliminates all other parameters by
    conditioning on their sufficient statistics. For variables causing separation,
    the estimates are “median unbiased estimates,” which have reasonably good properties
    in such situations. The “Exact Odds Ratios” in the next table are just the exponentiated
    values of the parameter estimates. Here we see that the adjusted odds of getting
    the death penalty at culpability level 1 are estimated to be less than 1 percent
    of the odds at culpability level 5, the omitted category. With conventional maximum
    likelihood, we were unable to get a point estimate for this odds ratio.


    The *p*-values reported in the tables for parameter estimates and odds ratios
    are based on likelihood ratio tests. However, the calculation uses the exact distributions
    of these statistics rather than the usual chi-square approximation. The confidence
    intervals are also based on the exact distributions. Notice that for the CULP
    level associated with quasi-complete separation, the lower confidence limit for
    the parameter estimate is negative infinity and the lower limit for the odds ratio
    is 0.


    Although we have focused on the use of the EXACT statement to handle quasi-complete
    separation, it’s generally useful when sample sizes are small enough to raise
    doubts about the accuracy of the chi-square approximation. Keep in mind also that
    when considering sample size, what’s important is the number of cases in *the
    less frequent category* of the dependent variable. Of course, the downside of
    exact methods is that they can be very computationally demanding. For our death
    penalty example, conventional maximum likelihood took about a tenth of a second
    on my laptop. By contrast, exact estimation took about 3.5 *minutes*. Although
    the theory behind exact methods was developed more than 40 years ago (Cox 1970),
    it’s only in the last decade that these methods have become practical due to improved
    algorithms and faster computers. PROC LOGISTIC actually has two alternative algorithms
    that can be chosen with an option on the PROC statement. And there are several
    additional options that control some of the details of these algorithms.


    **Use penalized likelihood.** One of the easiest and most effective ways of dealing
    with quasi-complete separation is a method known as penalized likelihood estimation,'
  merge: -1
