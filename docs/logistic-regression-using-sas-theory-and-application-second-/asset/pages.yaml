    \ | 1 | 0.0396 |\n| Wald | 0.0338 | 1 | 0.8542 |\n\n| Analysis of Maximum Likelihood\
    \ Estimates | | | | | |\n|---|---|---|---|---|---|\n| Parameter | DF | Estimate\
