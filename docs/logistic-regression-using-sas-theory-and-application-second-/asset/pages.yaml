    As we’ll see in the next section, the coefficients can be interpreted as effects
    on the log odds of choosing a bar of that particular kind relative to other kinds.
    As usual, these coefficients are exponentiated to produce odds ratio estimates.
    We see, for example, that the odds of choosing a dark chocolate bar are four times
    the odds of choosing a milk chocolate bar. The odds of choosing a soft bar are
    only about one-ninth the odds of choosing a hard bar. People were twice as likely
