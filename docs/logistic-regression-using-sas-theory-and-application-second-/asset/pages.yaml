- pgno: 16
  md: 'linear regression that makes dichotomous variables problematic, and they may
    have only a vague notion of why other methods are superior.


    In this chapter, we focus on logistic regression (a.k.a. logit analysis) as an
    optimal method for the regression analysis of dichotomous (binary) dependent variables.
    Along the way, we’ll see that logistic regression has many similarities to ordinary
    linear regression analysis. To understand and appreciate the logistic model, we
    first need to see why ordinary linear regression runs into problems when the dependent
    variable is dichotomous.


    # 2.2  Dichotomous Dependent Variables: Example


    To make things tangible, let’s start with an example. Throughout this chapter,
    we’ll be examining a data set consisting of 147 death penalty cases in the state
    of New Jersey. In all of these cases, the defendant was convicted of first-degree
    murder with a recommendation by the prosecutor that a death sentence be imposed.
    Then a penalty trial was conducted to determine whether the defendant would receive
    a sentence of death or life imprisonment. Our dependent variable DEATH is coded
    1 for a death sentence, and 0 for a life sentence. The aim is to determine how
    this outcome was influenced by various characteristics of the defendant and the
    crime.


    Many potential independent variables are available in the data set, but let’s
    consider three of special interest:


    +   - **BLACKD** — Coded 1 if the defendant was black, otherwise 0.

    +   - **WHITVIC** — Coded 1 if the victim was white, otherwise 0.

    +   - **SERIOUS** — A rating of the seriousness of the crime, as evaluated by
    a panel of judges.


    The variable SERIOUS was developed in an auxiliary study in which panels of trial
    judges were given written descriptions of each of the crimes in the original data
    set. These descriptions did not mention the race of the defendant or the victim.
    Each judge evaluated 14 or 15 cases and ranked them from least serious to most
    serious. Each case was ranked by four to six judges. As used in this chapter,
    the SERIOUS score is the average ranking given to each case, ranging from 1 (least
    serious) to 15 (most serious).'
  merge: -1
  img_proc: true
- pgno: 17
  md: "Using the REG procedure in SAS, I estimated a linear regression model that\
    \ uses DEATH as the dependent variable and the other three as independent variables.\
    \ The SAS code is\n\n```\n```sas\nPROC REG DATA=penalty;\n   MODEL death=blackd\
    \ whitic serious;\nRUN;\n```\n```\n\nResults are shown in Output 2.1. Neither\
    \ of the two racial variables have coefficients that are significantly different\
    \ from 0. Not surprisingly, the coefficient for SERIOUS is highly significant—more\
    \ serious crimes are more likely to get the death penalty.\n\nShould we trust\
    \ these results, or should we ignore them because the statistical technique is\
    \ incorrect? To answer that question we need to see *why* linear regression is\
    \ regarded as inappropriate when the dependent variable is a dichotomy. That’s\
    \ the task of the next section.\n\n# Output 2.1  Linear Regression of Death Penalty\
    \ on Selected Independent Variables\n\n|  |  |\n|---|---:|\n| **Number of Observations\
