  md: 'The expression on the left-hand side is called the complementary log-log transformation.
    Like the logit and the probit transformation, the complementary log-log transformation
    takes a number restricted to the (0, 1) interval and converts it into something
    with no upper or lower bound. Note that the log of 1−p is always a negative number.
    This is changed to a positive number before taking the log a second time. Solving
    for p, we can also write the model as


    $$p_i = 1 - \exp\{-\exp[\beta_0 + \beta_1x_{i1} + \beta_2x_{i2} + \cdots + \beta_kx_{ik}]\}.$$
    (3.18)


    The complementary log-log model has one major difference from the logit and probit
    models. As shown in Table 3.2, while the logit and probit transformations are
    symmetrical around $p=.50$, the complementary log-log transformation is *asymmetrical*.
    This is also apparent from Figure 3.3 which graphs the function in equation (3.18)
    for a single $x$ variable with $\beta_0=0$ and $\beta_1=1$. It’s an S-shaped curve
    all right, but it approaches 1 much more rapidly than it approaches 0.


    # Figure 3.3 Plot of Complementary Log-Log Model


    ![](img/bbec4f484c16475caccf067e8da3ac57_102_0.png)


    Why would you ever want an asymmetrical model? Because the complementary log-log
    model is closely related to continuous-time models for the occurrence of events.
    The most popular method of survival analysis is the *Cox regression* method, which
    is based on a model called the *proportional hazards model* (Cox 1972). Special
    cases of this model include the Weibull regression model and the exponential regression
    model. The proportional hazards model can be written as'
  merge: -1
  img_proc: true
- pgno: 103
  md: '\[\log h(t)=\alpha(t)+\beta_1x_{i1}+\beta_2x_{i2}+\cdots+\beta_kx_{ik}\tag{3.19}\]


    where \(h(t)\) is something called the *hazard* of an event at time \(t\) and
    \(\alpha(t)\) is an unspecified function of time. While this is not the place
    to discuss hazards in any detail, you can think of the hazard as the instantaneous
    propensity for the occurrence of events.


    If you have data that contain the exact times at which events occur, you can estimate
    this model by a method known as *partial likelihood*. But suppose the only information
    you have about an event (say, a death) is whether or not it occurred in a particular
    year. In that case, what model should you use for the dichotomous outcome? It
    turns out that if events are generated by an underlying proportional hazards model
    (equation 3.19), then the probability of an event in some specific interval of
    time is given by the complementary log-log model (equation 3.18). Furthermore,
    the \(\beta\) coefficients in these models are identical. That doesn’t mean you’ll
    get the same results regardless of whether you use Cox regression for continuous
    data or complementary log-log analysis for discrete data. It does mean that both
    methods are estimating the same underlying coefficients and, therefore, have the
    same interpretation. For more detailed information, see Chapter 7 of my 2010 book,
    *Survival Analysis Using SAS: A Practical Guide, Second Edition*.


    To estimate a complementary log-log model in PROC LOGISTIC, you simply put LINK=CLOGLOG
    as an option in the MODEL statement. Output 3.30 shows the results of doing this
    in LOGISTIC for a model comparable to the one in Output 3.29. With regard to qualitative
    conclusions, the results are quite similar to those for the logit and probit models.
    Moreover, all the coefficients in Output 3.30 are bracketed by the logit and the
    probit coefficients. In most applications I’ve seen, results from the complementary
    log-log model are not very different from logit or probit. But occasionally you’ll
    find results that suggest qualitatively different conclusions. The standardized
    estimates are again calculated from equation 3.15, but now \(\sigma_d=\pi/\sqrt{6}=1.28\),
    the standard deviation of the standard extreme value distribution.'
