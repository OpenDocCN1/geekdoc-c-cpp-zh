    | whitvic | 1 | 0.7040 | 0.3954 | 3.1698 | 0.0750 | 0.2700 |


    For the death penalty data, the interpretation of the complementary log-log model
    in terms of an underlying proportional hazards model is really not plausible.
    The model isn’t predicting whether an event occurs in some interval of time. Rather,
    given that a penalty trial takes place, it’s predicting which of two kinds of
    outcomes occur. In cases where the model is plausible, we can calculate exp(β)
    for each coefficient to get an adjusted hazard ratio. For example, if we take
    the coefficient for BLACKD and exponentiate it, we get exp(1.0975)= 3.00. We could
    then say that the estimated hazard of a death sentence for a black defendant was
    three times the hazard for a white defendant.


    Unfortunately, PROC LOGISTIC does not report the exponentiated coefficients for
    the complementary log-log model unless you specifically request them. And to do
    that, you need a separate statement for each predictor variable. For example,
    you can get the exponentiated coefficient (with confidence limits) for CULP with
    the statement:


    ```

    ESTIMATE ''culp'' culp 1 / EXP CL;

    ```


    One final point about the complementary log-log model: because logit and probit
    models are symmetrical, reversing the coding of the dependent variable (from 0,1
    to 1,0) only changes the signs of the coefficients. For the complementary log-log
    model, on the other hand, reversing the coding can give you completely different
    results. It’s crucial, then, to set up the model to predict the probability of
    an event, not the absence of the event. If the distinction between an event and
    a non-event isn’t obvious, then the complementary log-log model is probably not
    appropriate anyway.'
