    \ Ratio |\n|---|---:|---:|---:|---:|---:|---:|\n| BLACKD | 1 | 0.11951 | 0.09713\
    \ | 1.5140 | 0.2185 | 1.127 |\n| WHITVIC | 1 | 0.23698 | 0.10458 | 5.1346 | 0.0235\
    \ | 1.267 |\n| DEATH | 1 | -0.18181 | 0.13766 | 1.7443 | 0.1866 | 0.834 |\n| CULP\
    \ | 1 | 0.25858 | 0.04233 | 37.3245 | <.0001 | 1.295 |\n\nThis approach to the\
    \ analysis of ranked data can also be used with partial rankings.\n\nFor example,\
    \ a ranker may be asked to choose the three best items out of a list of 10 and\
    \ give them ranks of 1, 2, and 3. If all of the rest are coded as 4, the problem\
    \ is equivalent to tied ranks, which we already discussed. The PHREG syntax needs\
    \ no modification.\n\n# 7.7  More Advanced Models with PROC MDC\n\nAnother SAS\
    \ procedure that can estimate conditional logit models for discrete choice is\
    \ PROC MDC (for multinomial discrete choice). Compared to PROC LOGISTIC, PROC\
    \ MDC has a couple of disadvantages: people are not allowed to choose more than\
    \ one item, and MDC doesn’t report odds ratios. But the upside is that MDC can\
    \ estimate several more advanced models that relax some of the assumptions of\
    \ the conditional logit model. This section provides only a brief introduction\
    \ to these models and is not intended to be a thorough treatment.\n\nLet’s first\
    \ see how to duplicate the models for the travel data in Section 7.4. Although\
    \ PROC MDC in SAS 9.3 supports the CLASS statement, the construction of the design\
    \ variables and the calculation of the *p*-values is very different than what\
    \ we have previously seen in PROC LOGISTIC. To avoid difficulties in interpretation,\
    \ instead of using the CLASS statement, I created three indicator variables to\
    \ represent the different modes of travel.\n\n```\nDATA travel2;\n    SET travel;\n\
    \    air = mode EQ 1;\n    train = mode EQ 2;\n    bus = mode EQ 3;\nRUN;\n```"
