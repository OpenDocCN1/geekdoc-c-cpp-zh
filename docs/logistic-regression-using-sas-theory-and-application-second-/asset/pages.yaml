- pgno: 165
  md: '# 5.8 Problems of Interpretation


    When the dependent variable has only three categories, the multinomial logit model
    is reasonably easy to interpret. But as the number of categories increases, it
    becomes more and more difficult to tell a simple story about the results. As we’ve
    seen, the model is most naturally interpreted in terms of effects on contrasts
    between pairs of categories for the dependent variable. But with a 5-category
    dependent variable, there are 10 different possible pairs of categories. With
    a 10-category dependent variable, the number of pairs shoots up to 45. There’s
    no simple solution to this problem, but Long (1997) has proposed a graphical method
    of interpreting the coefficients that can be very helpful for a moderate number
    of categories.


    There’s still another interpretational problem that even experienced users of
    multinomial logit analysis may overlook. In binary logit analysis, if a variable
    x has a positive coefficient, you know that every increase in x results in an
    increase in the probability of the designated outcome. That’s not always true
    in the multinomial model.


    Consider the following hypothetical example. Suppose the dependent variable y
    has three categories (1, 2, and 3) and there is a single independent variable
    x. When we estimate a multinomial logit model, let’s suppose that we get the following
    two equations:


    ```

    log(p₁/p₃) = 1.0 − 2.0x

    log(p₂/p₃) = 1.0 − 1.0x.

    ```


    How can we describe the effect of x on p₂? Because the coefficient of x in the
    second equation is negative, it’s tempting to say that increases in x produce
    decreases in the probability of being in category 2. But if we graph the probabilities,
    as in Output 5.7, we see that the effect of x on p₂ is not monotonic. (This graph
    was produced with simulated data using the EFFECTPLOT statement.) When x is below
    .5, an increase in x produces an increase in p₂. When x is above .5, increases
    in x produce decreases in p₂.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Output 5.7  Effect of x on the Probability of Being in Each of the Three
    Categories


    ![](img/bbec4f484c16475caccf067e8da3ac57_166_0.png)


    What’s going on here? The diagram in Figure 5.1 helps explain this situation.
    The structure of the model is such that increases in x tend to move individuals
    from category 2 to category 3. But increases in x also tend to move individuals
    from category 1 to category 2. When x is very low, most of the cases are in category
    1, so most of the movement is from 1 to 2 and the proportion of cases in 2 goes
    up. Eventually, however, there are few cases left in 1 so most of the movement
    is from 2 to 3, and the proportion remaining in 2 declines.


    # Figure 5.1  Movement of Individuals as x Increases


    ![](img/bbec4f484c16475caccf067e8da3ac57_166_1.png)


    The upshot of this phenomenon is that multinomial logit coefficients must always
    be interpreted as effects on contrasts between pairs of categories, never on the
    probability of being in a particular category.'
  merge: -1
  img_proc: true
