    # 2.3 Problems with Ordinary Linear Regression


    Not so long ago, it was common to see published research that used ordinary least
    squares (OLS) linear regression to analyze dichotomous dependent variables. Some
    people didn’t know any better. Others knew better, but didn’t have access to good
    software for alternative methods. Now, every major statistical package includes
    a procedure for logistic regression, so there’s no excuse for applying inferior
    methods. No reputable social science journal would publish an article that used
    OLS regression with a dichotomous dependent variable.


    Should all the earlier literature that violated this prohibition be dismissed?
    Actually, most applications of OLS regression to dichotomous variables give results
    that are qualitatively quite similar to results obtained using logistic regression.
    There are exceptions, of course, so I certainly wouldn’t claim that there’s no
    need for logistic regression. But as an approximate method, OLS linear regression
    does a surprisingly good job with dichotomous variables, despite clear-cut violations
    of assumptions.


    What are the assumptions that underlie OLS regression? While there’s no single
    set of assumptions that justifies linear regression, the list in the box below
    is fairly standard. To keep things simple, I’ve included only a single independent
    variable *x*, and I’ve presumed that *x* is “fixed” across repeated samples (which
    means that every sample has the same set of *x* values). The *i* subscript distinguishes
    different members of the sample.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Assumptions of the Linear Regression Model


    +   1. $y_i = \alpha + \beta x_i + \varepsilon_i$

    +   2. $E(\varepsilon_i) = 0$

    +   3. $\text{var}(\varepsilon_i) = \sigma^2$

    +   4. $\text{cov}(\varepsilon_i, \varepsilon_j) = 0$

    +   5. $\varepsilon_i \sim \text{Normal}$


    Assumption 1 says that $y$ is a linear function of $x$ plus a random disturbance
    term $\varepsilon$, for all members of the sample. The remaining assumptions all
    say something about the distribution of $\varepsilon$. What’s important about
    assumption 2 is that $E(\varepsilon)$ (the expected value of $\varepsilon$) does
    *not* vary with $x$, implying that $x$ and $\varepsilon$ are uncorrelated. Assumption
    3, often called the *homoscedasticity* assumption, says that the variance of $\varepsilon$
    is the same for all observations. Assumption 4 says that the random disturbance
    for one observation is uncorrelated with the random disturbance for any other
    observation. Finally, assumption 5 says that the random disturbance is normally
    distributed. If all five assumptions are satisfied, ordinary least squares estimates
    of $\alpha$ and $\beta$ are unbiased and have minimum sampling variance (minimum
    variability across repeated samples).


    Now suppose that $y$ is a dichotomy with possible values of 1 or 0. It’s still
    reasonable to claim that assumptions 1, 2, and 4 are true. But if 1 and 2 are
    true for a dichotomy, then 3 and 5 are *necessarily* false. First, let’s consider
    assumption 5. Suppose that $y_i$=1. Then assumption 1 implies that $\varepsilon_i$=1$-$\alpha$-$\beta
    x_i$. On the other hand, if $y_i$=0, we have $\varepsilon_i$=$-$\alpha$-$\beta
    x_i$. Because $\varepsilon_i$ can only take on two values, it’s impossible for
    it to have a normal distribution (which has a continuum of values and no upper
    or lower bound). So assumption 5 must be rejected.


    To evaluate assumption 3, it’s helpful to do a little preliminary algebra. The
    expected value of $y_i$ is, by definition,


    $E(y_i) = 1 \times \Pr(y_i = 1) + 0 \times \Pr(y_i = 0)$.


    If we define $p_i = \Pr(y_i=1)$, this reduces to


    $E(y_i) = p_i$'
  merge: -1
  img_proc: true
- pgno: 20
  md: "In general, for any dummy variable, its expected value is just the probability\
    \ that it is equal to 1. But assumptions 1 and 2 also imply another expression\
    \ for this expectation. Taking the expected values of both sides of the equation\
    \ in assumption 1, we get\n\n```\nE(y_i) = E(α + βx_i + ε_i)\n      = E(α) + E(βx_i)\
    \ + E(ε_i)\n      = α + βx_i.\n```\n\nPutting these two results together, we get\n\
    \n```\np_i = α + βx_i,  (2.1)\n```\n\nwhich is sometimes called the *linear probability\
    \ model*. As the name suggests, this model says that the probability that y=1\
    \ is a linear function of x. Regression coefficients have a straightforward interpretation\
    \ under this model. A 1-unit change in x produces a change of β in the probability\
    \ that y=1. In Output 2.1, the coefficient for SERIOUS was .038. So we can say\
    \ that each 1-point increase in the SERIOUS scale (which ranges from 1 to 15)\
    \ is associated with an increase of .038 in the probability of a death sentence,\
    \ controlling for the other variables in the model. The BLACKD coefficient of\
    \ .12 tells us that the estimated probability of a death sentence for black defendants\
    \ is .12 higher than for nonblack defendants, controlling for other variables.\n\
    \nNow let’s consider the variance of ε_i. Because x is treated as fixed, the variance\
    \ of ε_i is the same as the variance of y_i. In general, the variance of a dummy\
    \ variable is p_i(1−p_i). Therefore, we have\n\n```\nvar(ε_i) = p_i(1 − p_i) =\
    \ (α + βx_i)(1 − α − βx_i).\n```\n\nWe see, then, that the variance of ε_i must\
    \ be different for different observations and, in particular, it varies as a function\
    \ of x. The disturbance variance is at a maximum when p_i=.5 and gets small when\
    \ p_i is near 1 or 0.\n\nWe’ve just shown that a dichotomous dependent variable\
    \ in a linear regression model necessarily violates assumptions of homoscedasticity\
    \ (assumption 3) and normality (assumption 5) of the error term. What are the\
    \ consequences? Not as serious as you might think. First of all, we don’t need\
    \ these assumptions to get *unbiased* estimates. If just assumptions 1 and 2 hold,\
    \ ordinary least squares will produce unbiased estimates of α and β. Second, the\
    \ normality assumption is not needed if the sample is reasonably large. The central\
    \ limit theorem assures us that coefficient estimates will have a distribution\
    \ that is"
  merge: -1
  img_proc: true
- pgno: 21
  md: "approximately normal even when \\(\\varepsilon\\) is *not* normally distributed.\
    \ That means that we can still use a normal table to calculate *p*-values and\
    \ confidence intervals. If the sample is small, however, these approximations\
    \ could be poor.\n\nViolation of the homoscedasticity assumption has two undesirable\
    \ consequences.\n\nFirst, the coefficient estimates are no longer *efficient*.\
    \ In statistical terminology, this means that there are alternative methods of\
    \ estimation with smaller standard errors. Second, and more serious, the standard\
    \ error estimates are no longer *consistent* estimates of the true standard errors.\
    \ That means that the estimated standard errors could be biased (either upward\
    \ or downward) to unknown degrees. And because the standard errors are used in\
    \ calculating test statistics, the test statistics could also be problematic.\n\
    \nFortunately, the potential problems with standard errors and test statistics\
    \ are easily fixed. Beginning with SAS 9.2, PROC REG offers a *heteroscedasticity\
    \ consistent covariance estimator* that uses the method of Huber (1967) and White\
    \ (1980), sometimes known as the “sandwich” method because of the structure of\
    \ the matrix formula. This method produces consistent estimates of the standard\
    \ errors even when the homoscedasticity assumption is violated. To implement the\
    \ method in PROC REG, simply put the option HCC on the MODEL statement:\n\n```\n\
    ```sas\nPROC REG DATA=penalty;\n    MODEL death=blackd whitvic serious / HCC;\n\
    RUN;\n```\n```\n\nNow, in addition to the output in Output 2.1, we get the corrected\
    \ standard errors, *t*-statistics, and *p*-values shown in Output 2.2. In this\
    \ case, the correction for heteroscedasticity makes almost no difference in the\
    \ results."
  merge: -1
  img_proc: true
- pgno: 22
