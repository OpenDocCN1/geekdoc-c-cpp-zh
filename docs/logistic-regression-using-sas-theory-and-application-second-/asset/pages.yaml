    What makes the doctorate example different from the earlier examples in this chapter
    is that the individuals are grouped into naturally occurring clusters, in this
    case, university departments. It’s reasonable to suppose that individuals in the
    same department are *not* independent—not only can they influence each other,
    but they are also exposed to many common factors that may produce the same outcome.
    In most contingency table analyses, on the other hand, individuals are grouped
    together merely because they have the same values on some discrete variable. In
    such cases, there is usually no reason to think that the observations within groups
    are anything other than independent.


    When independence is presumed, the correct strategy for dealing with overdispersion
    is to elaborate the model until you find a version that does fit the data, not
    to casually invoke the overdispersion options. If, after diligent investigation,
    you cannot come up with a reasonably parsimonious model with an acceptable fit
    to the data, then there may be some value in correcting the standard errors and
    test statistics for any remaining overdispersion. But be aware that the correction
    for overdispersion always produces chi-square statistics that are lower than they
    would be without the correction.


    Note also that overdispersion does *not* arise from heterogeneity *within* groups.
    The problem stems from differences *between* groups, differences that are not
    fully described by the measured variables. Another way to deal with overdispersion
    is to postulate a random effect for departments that accounts for the overdispersion.
    This can be done with PROC GLIMMIX or PROC NLMIXED. In Chapter 8, we’ll see how
    to use these procedures to analyze individual-level data when there is clustering
    and a lack of independence within clusters. See Allison (1987) for still other
    ways to approach the overdispersion problem for these data.


    It’s also worth noting that the “badness of fit” for the NIH data comes primarily
    from a small number of observations. The graph in Output 4.17 shows the change
    in the deviance'
