  md: 'interactions between option characteristics and individual characteristics.
    However, it does not include an intercept term.


    The conditional logit model introduced by McFadden (1974) is


    ```

    Pr(y_ij = 1) = e^{βx_ij} / (e^{βx_i1} + e^{βx_i2} + ... + e^{βx_iJ}). (7.1)

    ```


    This equation is quite similar to equation (5.2) for the multinomial logit model.
    In that model, however, there was one x vector for each individual and separate
    coefficient vectors β_j for each of the possible outcomes. For the conditional
    logit model, there is only one coefficient vector but different x vectors for
    each outcome. Despite these apparent differences, the standard multinomial logit
    model can be shown to be a special case of the conditional logit model by appropriate
    coding of the explanatory variables, as illustrated below in Output 7.6 and 7.7.


    From equation (7.1) we can see why there is no intercept term in the conditional
    logit model. Suppose we insisted on including an intercept by writing each of
    the terms in the numerator and denominator as e^{β0+βx_ij}. This, of course, is
    equal to e^{β0} e^{βx_ij}. But because e^{β0} appears in every term, this quantity
    cancels out of the fraction.


    Equation (7.1) implies that the logit for comparing any two options j and k is
    given by


    ```

    log( Pr(y_ij = 1) / Pr(y_ik = 1) ) = β(x_ij - x_ik).

    ```


    Equivalently, the odds that person i will choose j over k is given by exp{β(x_ij
    - x_ik)}.


    We estimate the model by maximum likelihood. The likelihood function is the product
    of n factors, each having the form of equation (7.1) for the particular option
    that is chosen.


    Is this a reasonable model for individual choice? One justification is that the
    model can be derived from a latent variable model called the random utility model.
    Suppose that each individual i has a stable preference for option j, denoted by
    μ_ij. But suppose the actual utility U_ij for a particular option varies randomly
    around μ_ij so that


    ```

    U_ij = μ_ij + ε_ij (7.2)

    ```


    where ε_ij is a random variable having a standard extreme value distribution with
    constant variance. Assume further that the ε_ij''s are independent across the
    different options. If people choose the option with the highest utility U_ij,
    and if the logarithm of μ_ij is a linear function of'
