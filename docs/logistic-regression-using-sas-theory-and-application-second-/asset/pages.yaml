- pgno: 313
  md: "Despite these difficulties, there are situations in which it is easy to fit\
    \ the loglinear model but difficult to fit the corresponding logit model. One\
    \ such model is the adjacent-categories model that we considered in Chapter 6.\
    \ Recall that the adjacent-categories model is one of three alternative logit\
    \ models for dependent variables with multiple, ordered categories. If the dependent\
    \ variable has J ordered categories, the model says that for individual i:\n\n\
    log(p_ij / p_i,j+1) = α_j + βx_i      j = 1,...,J − 1\n\nIn other words, if we\
    \ contrast adjacent categories of the dependent variable, the effect of the independent\
    \ variables on their relative odds is the same regardless of which pair we consider.\n\
    \nThis model is a special case of the multinomial logit model that does not impose\
    \ any ordering on the categories of the dependent variable. (We get the general\
    \ model by putting a j subscript on the β coefficient.) In Chapter 6, we saw how\
    \ we could estimate the adjacent categories model in PROC CATMOD by the method\
    \ of weighted least squares. But the maximum likelihood algorithm in CATMOD cannot\
    \ impose the necessary constraints on the multinomial model.\n\nNow, we’ll see\
    \ how to easily estimate the adjacent categories model as a loglinear model by\
    \ maximum likelihood. In Chapter 6, we looked at the effect of calendar year (1974,\
    \ 1984, 1994) and marital status (married, unmarried) on reported happiness (very\
    \ happy=1, pretty happy=2, not too happy=3). Section 6.1 displays the contingency\
    \ table and the SAS code for reading in the data. But we need to modify the data\
    \ set as follows:\n\n```\nDATA happy2;\n    SET happy;\n    happyq=happy;\nRUN;\n\
    ```\n\nIn this DATA step, I defined a new variable HAPPYQ to be identical to HAPPY,\
    \ the three-category dependent variable. By defining two versions of the dependent\
    \ variable, we can treat it as both quantitative and qualitative in the same model.\
    \ The model is specified as follows:\n\n```\nPROC GENMOD DATA=happy2;\n    CLASS\
    \ year happy;\n    MODEL count=year|married happy year*happyq married*happyq /\n\
    \        D=P;\nRUN;\n```"
  merge: -1
  img_proc: true
- pgno: 314
  md: 'HAPPY and YEAR are declared as CLASS variables, but HAPPYQ is treated as a
    quantitative variable. Because MARRIED has only two categories, it doesn’t need
    to be a CLASS variable. The term YEAR|MARRIED ensures that the model is equivalent
    to a logit model by fitting all possible terms pertaining to the two independent
    variables. The effects of YEAR and MARRIED on happiness are specified by the terms
    YEAR*HAPPYQ and MARRIED*HAPPYQ. By also including HAPPY in the model as a CLASS
    variable, we allow for different intercepts for the two adjacent pairs of categories.
    Results are shown in Output 10.6. As in Output 10.5, those parameters that correspond
    to the equivalent logit model are shown in italics.


