    This model has a deviance of 9.66 with 8 d.f. for a p-value of .29, which is certainly
    an acceptable fit. The relevant parameter estimates are shown in Output 10.8.
    The coefficient for MARRIED is about what it was in the original adjacent categories
    model and has the same interpretation: for any contrast of adjacent categories,
    married people have about twice the odds of being in the happier category as unmarried
    people. The YEARQ*PRETTY coefficient can be interpreted as follows: with each
    additional decade, the odds of being in the middle category (as compared to the
    two extremes) rises by about 18%=100[exp(.1722)−1].


    We have achieved the parsimony of this final model by carefully adjusting it to
    fit observed patterns that might have arisen from random variation. So, we should
    not feel extremely confident that this is the correct model. Nevertheless, this
    exercise should give you some idea of the range of possibilities for models like
    this. While the loglinear approach can be cumbersome, it is also remarkably flexible.


    # 10.5 Loglinear Models for Square, Ordered Tables


    Loglinear models have been particularly popular for the analysis of mobility tables
    like the one shown in Table 10.2, which is based on data collected in Britain
    by Glass (1954) and his collaborators. The column variable is the respondent’s
    occupational status, classified into five categories with 1 being the highest
    and 5 the lowest. The same classification was used for the father’s occupation,
    the row variable in the table. For obvious reasons, we call this a square table.
    Our aim is to fit loglinear models that describe the relationship between father’s
    status and son’s status. In the process, we’ll see how to estimate some models
    proposed by Leo Goodman (1970), one of the pioneers of loglinear analysis.'
  merge: -1
  img_proc: true
- pgno: 319
  md: "# Table 10.2 Cross-Classification of Respondent’s Occupational Status by Father’s\
    \ Occupational Status, 3,497 British Males\n\n|  | Son’s Status |  |  |  |  |\n\
    |  | 1 | 2 | 3 | 4 | 5 |\n| Father’s Status | 1 | 50 | 45 | 8 | 18 | 8 |\n|  |\
    \ 2 | 28 | 174 | 84 | 154 | 55 |\n|  | 3 | 11 | 78 | 110 | 223 | 96 |\n|  | 4\
    \ | 14 | 150 | 185 | 714 | 447 |\n|  | 5 | 0 | 42 | 72 | 320 | 411 |\n\nOne model\
    \ that nearly every researcher knows how to fit (but may not realize it) is the\
    \ independence model, which asserts that the two variables are independent. Here\
    \ is SAS code to fit the independence model:\n\n```\nDATA mobility;\n    INPUT\
