    # Output 3.29  LOGISTIC Output for a Probit Model


    | Parameter | DF | Estimate | Standard Error | Wald Chi-Square | Pr > ChiSq |
    Standardized Estimate |

    |---|---:|---:|---:|---:|---:|---:|

    | Intercept | 1 | -2.9932 | 0.4745 | 39.7904 | <.0001 | |

