    Error | t Value | Pr > |t| |

    | Intercept | 1 | -0.05492 | 0.12499 | -0.44 | 0.6610 | 0.11959 | -0.46 | 0.6468
    |

    | blackd | 1 | 0.12197 | 0.08224 | 1.48 | 0.1403 | 0.08197 | 1.49 | 0.1390 |

    | whitvic | 1 | 0.05331 | 0.08411 | 0.63 | 0.5272 | 0.08315 | 0.64 | 0.5224 |

    | serious | 1 | 0.03840 | 0.01200 | 3.20 | 0.0017 | 0.01140 | 3.37 | 0.0010 |


    Although the HCCC standard errors are an easy fix, be aware that they have inherently
    more sampling variability than conventional standard errors (Kauermann and Carroll
    2001), and may be especially unreliable in small samples. For large samples, however,
    they should be quite satisfactory.


    In addition to these technical difficulties, there is a more fundamental problem
    with the assumptions of the linear model. We’ve seen that when the dependent variable
    is a dichotomy, assumptions 1 and 2 imply the linear probability model


    ```

    p_i = α + β x_i

    ```


    While there’s nothing intrinsically wrong with this model, it’s a bit implausible,
    especially if x is measured on a continuum. If x has no upper or lower bound,
    then for any value of β there are values of x for which p_i is either greater
    than 1 or less than 0. In fact, when estimating a linear probability model by
    OLS, it’s quite common for predicted values generated by the model to be outside
    the (0, 1) interval. (That wasn’t a problem with the regression in Output 2.1,
    which implied predicted probabilities ranging from .03 to .65.) Of course, it’s
    impossible for the true values (which are probabilities) to be greater than 1
    or less than 0. So the only way the model could be true is if a ceiling and floor
    are somehow imposed on p_i, leading to considerable awkwardness both theoretically
    and computationally.


    These problems with the linear model led statisticians to develop alternative
    approaches that make more sense conceptually and also have better statistical
    properties. The most popular of these approaches is the logistic model, which
    is estimated by maximum likelihood. Before considering the full model, let’s examine
    one of its key components—the odds of an event.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 2.4 Odds and Odds Ratios


    To appreciate the logistic model, it’s helpful to have an understanding of odds
    and odds ratios. Most people regard probability as the “natural” way to quantify
    the chances that an event will occur. We automatically think in terms of numbers
    ranging from 0 to 1, with a 0 meaning that the event will certainly not occur
    and a 1 meaning that the event certainly will occur. But there are other ways
    of representing the chances of event, one of which—the odds—has a nearly equal
    claim to being “natural.”


    Widely used by professional gamblers, the odds of an event is the ratio of the
    expected number of times that an event will occur to the expected number of times
    it will not occur. An odds of 4 means we expect 4 times as many occurrences as
    non-occurrences. An odds of 1/5 means that we expect only one-fifth as many occurrences
    as non-occurrences. In gambling circles, odds are sometimes expressed as, say,
    “5 to 2,” but that corresponds to the single number 5/2.


    There is a simple relationship between probabilities and odds. If p is the probability
    of an event and O is the odds of the event, then


    O = p / (1 - p) = probability of event / probability of no event


    p = O / (1 + O).  (2.2)


    This functional relationship is illustrated in Table 2.1.


    # Table 2.1 Relationship between Odds and Probability


    | Probability | Odds |

    |---|---|

    |.1|.11|

    |.2|.25|

    |.3|.43|

    |.4|.67|

    |.5|1.00|

    |.6|1.50|

    |.7|2.33|

    |.8|4.00|

    |.9|9.00|'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Note that odds less than 1 correspond to probabilities below .5, while odds
    greater than 1 correspond to probabilities greater than .5. Like probabilities,
    odds have a lower bound of 0. But unlike probabilities, there is no upper bound
    on the odds.


    Why do we need the odds? Because it’s a more sensible scale for multiplicative
    comparisons. If I have a probability of .30 of voting in the next election, and
    your probability of voting is .60, it’s meaningful to claim that your probability
    is twice as great as mine. But if my probability is .60, it’s impossible for your
    probability to be twice as great. There’s no problem on the odds scale, however.
    A probability of .60 corresponds to odds of .60/.40=1.5. Doubling that yields
    odds of 3. Converting back to probabilities gives us 3/(1+3)=.75.


    This leads us to the odds ratio, which is a widely used measure of the relationship
    between two dichotomous variables. Consider Table 2.2, which shows the cross-tabulation
    of race of defendant by death sentence for the 147 penalty-trial cases. The numbers
    in the table are the actual numbers of cases that have the stated characteristics.


    # Table 2.2 Death Sentence by Race of Defendant for 147 Penalty Trials


    |  | Blacks | Non-blacks | Total |

    |---|---|---|---|

    | Death | 28 | 22 | 50 |

    | Life | 45 | 52 | 97 |

    | Total | 73 | 74 | 147 |


    Overall, the estimated odds of a death sentence are 50/97=.52. For blacks, the
    odds are 28/45=.62. For nonblacks, the odds are 22/52=.42. The ratio of the black
    odds to the nonblack odds is 1.47. We may say, then, that the odds of a death
    sentence for blacks are 47% greater than for nonblacks. Note that the odds ratio
    in a 2×2 table is also equal to the cross-product ratio, which is the product
    of the two main-diagonal frequencies divided by the product of the two off-diagonal
    frequencies. In this case, we have (52×28)/(22×45)=1.47.


    Of course, we can also say that the odds of a death sentence for nonblacks are
    1/1.47=.63 times the odds of a death sentence for blacks. Similarly, the odds
    of a life sentence for blacks are .63 times the odds for nonblacks. So, depending
    on which categories we’re comparing, we either get an odds ratio greater than
    1 or its reciprocal, which is less than 1.'
