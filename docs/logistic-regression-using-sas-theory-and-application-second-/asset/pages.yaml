  md: 'All in all, I can’t say that I have a lot of confidence in the HL test. So
    what can you do to evaluate goodness of fit if you’re working with individual-level
    data that cannot be aggregated? Remember that what the deviance, Pearson chi-square,
    and HL tests are evaluating is whether you can improve the model by including
    interactions and non-linearities. In my judgment, there’s no good substitute for
    directly testing those possible interactions and non-linearities. Of course, for
    many models, there will simply be too many potential interactions and non-linearities
    to test all the possibilities. So you’ll have to be selective, focusing on those
    variables in which you have the greatest interest, or the greatest suspicion that
    something more might be needed.


    # 3.7 Statistics Measuring Predictive Power


    Another class of statistics describes how well you can predict the dependent variable
    based on the values of the independent variables. This is a very different criterion
    from the goodness-of-fit measures that we’ve just been considering. It’s entirely
    possible to have a model that predicts the dependent variable very well, yet has
    a terrible fit as evaluated by the deviance or the HL statistic. Nor is it uncommon
    to have a model that fits well, as judged by either of those goodness-of-fit statistics,
    yet has very low predictive power.


    For least squares linear regression, predictive power is usually measured by the
    coefficient of determination, commonly known as R². Many different R² measures
    have been proposed for logistic regression (for a review, see Veall and Zimmerman
    (1996) or Tjur (2009)), but LOGISTIC only calculates one of them (as well as an
    adjusted version). Fortunately, it’s the one I like best. It’s based on the likelihood
    ratio chi-square for testing the null hypothesis that all the coefficients are
    0 (Cox and Snell 1989), which is the statistic reported by LOGISTIC under the
    heading “Testing Global Null Hypothesis: BETA=0.” If we denote that statistic
    by L² and let n be the sample size, the generalized R² is


    R² = 1 − exp{ − L² / n }   (3.10)


    Although this is easy to compute with a hand calculator, LOGISTIC will do it for
    you if you put the RSQ option on the MODEL statement.


    Here’s the rationale for the generalized R². For an ordinary linear regression
    model, it’s possible to calculate a likelihood-ratio chi-square for the hypothesis
    that all coefficients are 0. That statistic is related to the conventional R²
    by the formula (3.10). In other words,'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'the formula used for logistic regression is identical to the formula that applies
    to linear regression. In fact, this formula can be used for any regression model
    estimated by maximum likelihood, including the probit model, the Poisson regression
    model, and the Cox regression model.


    In addition to its appeal as a generalization of the conventional $R^2$, the generalized
    $R^2$ has several things going for it:


    +   - It’s based on the quantity being maximized, namely the log-likelihood.

    +   - It’s invariant to grouping. You get the same $R^2$ whether you’re working
    with grouped or individual-level data (as long as cases are only grouped together
    if they’re identical on all the independent variables).

    +   - It’s readily obtained with virtually all computer programs because the log-likelihood
    is nearly always reported by default.

    +   - It never diminishes when you add variables to a model.

    +   - The calculated values are usually quite similar to the $R^2$ obtained from
    fitting a linear probability model to dichotomous data by ordinary least squares.


    As an example of the last point, the generalized $R^2$ for the model that has
    CULP, WHITVIC, and BLACKD is .41. When I fit a linear probability model to these
    data, the $R^2$ was .47.


    Keep in mind that while the generalized $R^2$ may behave quite similarly to the
    linear model $R^2$, it *cannot* be interpreted as a proportion of variance “explained”
    by the independent variables.


    A possible drawback of the generalized $R^2$ is that its upper bound is less than
    1 because the dependent variable is discrete. To fix this, LOGISTIC also reports
    something labeled the “Max-rescaled R square,” which divides the original $R^2$
    by its upper bound (Nagelkerke 1991). For the model just considered, the rescaled
    $R^2$ is .57.


    The generalized $R^2$ is *not* the same as McFadden’s (1974) $R^2$ which is popular
    in econometric literature and used in several software packages. McFadden’s $R^2$
    is also based on the log-likelihood but with a somewhat different formula. As
    in formula (3.10), let $L^2$ be the likelihood ratio chi-square for test the null
    hypothesis that all the coefficient are 0, and let $\ell_0$ be the log-likelihood
    for a model with no covariates. Then


    $$R^2_{McF}=\frac{L^2}{-2\log \ell_0}$$'
