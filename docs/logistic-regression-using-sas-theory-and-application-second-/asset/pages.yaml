  md: "# ### 4.5 A Four-Way Table with Ordinal Explanatory Variables\n\nNext we consider\
    \ a 2 × 2 × 4 × 4 table, reported by Sewell and Shah (1968), for a sample of 4,991\
    \ high school seniors in Wisconsin. The dependent variable was whether or not\
    \ they planned to attend college in the following year. The three independent\
    \ variables were coded as follows:\n\n+   - IQ: 1=low, 2=lower middle, 3=upper\
    \ middle, 4=high\n+   - SES: 1=low, 2=lower middle, 3=upper middle, 4=high\n+\
    \   - PARENT: 1=low parental encouragement, 2=high encouragement\n\nFollowing\
    \ is a DATA step to read in the table, in a form suitable for the *events/trials*\
    \ syntax. There is one record for each combination of the independent variables.\
    \ The fourth variable TOTAL is the number of students who had each set of values\
    \ for the independent variables, and the last variable COLL is the number of students\
    \ who planned to attend college. Thus, on the first line, we see that there were\
    \ 353 students who were low on all three independent variables; of those, only\
    \ four planned to attend college.\n\n```\n```sas\nDATA wisc;\n  INPUT iq parent\
    \ ses total coll;\nDATALINES;\n1   1   1   353     4\n1   1   2   234     2\n\
    1   1   3   174     8\n1   1   4   52      4\n1   2   1   77      13\n1   2  \
    \ 2   111     27\n1   2   3   138     47\n1   2   4   96      39\n2   1   1  \
    \ 216     9\n2   1   2   208     7\n2   1   3   126     6\n2   1   4   52    \
    \  5\n2   2   1   105     33\n2   2   2   159     64\n2   2   3   184     74\n\
    2   2   4   213     123\n3   1   1   138     12\n3   1   2   127     12\n3   1\
    \   3   109     17\n3   1   4   50      9\n3   2   1   92      38\n```\n```"
