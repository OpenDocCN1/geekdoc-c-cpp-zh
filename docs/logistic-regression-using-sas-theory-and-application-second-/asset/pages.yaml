    | Scaled Pearson X2 | . | 0.0000 | . |

    | Log Likelihood |  | 391.0691 |  |

    | Full Log Likelihood |  | -10.7765 |  |

    | AIC (smaller is better) |  | 29.5531 |  |

    | AICC (smaller is better) |  | . |  |

    | BIC (smaller is better) |  | 27.0983 |  |


    | Analysis Of Maximum Likelihood Parameter Estimates |

    | Parameter | DF | Estimate | Standard Error | Wald 95% Confidence Limits | Wald
    Chi-Square | Pr > ChiSq |

    | Intercept | 1 | 3.9512 | 0.1387 | 3.6794 4.2230 | 811.84 | <.0001 |

    | death | 1 | -0.8602 | 0.2543 | -1.3587 -0.3617 | 11.44 | 0.0007 |

    | black | 1 | -0.1446 | 0.2036 | -0.5436 0.2545 | 0.50 | 0.4776 |

    | death*black | 1 | 0.3857 | 0.3502 | -0.3006 1.0721 | 1.21 | 0.2706 |

    | Scale | 0 | 1.0000 | 0.0000 | 1.0000 1.0000 |  |  |


    Examining Output 10.1, we see that the deviance for this model is 0. That’s because
    it’s a saturated model; there are four estimated parameters for the four cells
    in the table, so the model perfectly reproduces the frequency counts. The estimate
    for the interaction is .3857, which is the same value obtained from hand calculation
    of equation (10.4). This'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'estimate has an associated Wald chi-square of 1.214, which is nearly identical
    to the traditional Pearson chi-square (1.218) for testing whether the two variables
    are independent (obtained with PROC FREQ). That’s not surprising because both
    statistics are testing the same null hypothesis.


    Instead of a loglinear model, we could estimate a logit model for this table,
    taking death sentence as the dependent variable:


    ```

    PROC GENMOD DATA=penalty DESC;

    FREQ n;

    MODEL death=black / D=BINOMIAL LINK=LOGIT AGGREGATE;

    RUN;

    ```


    This produces Output 10.2.


    # Output 10.2 PROC GENMOD Output for Logit Model for a 2 ×2 Table


    |  |  |  |  |  |  |  |

    |---|---|---|---|---|---|---|

    | Analysis Of Maximum Likelihood Parameter Estimates |  |  |  |  |  |  |

    | Parameter | DF | Estimate | Standard Error | Wald 95% Confidence Limits | Wald
    Chi-Square | Pr > ChiSq |

    | Intercept | 1 | -0.8602 | 0.2543 | -1.3587 | -0.3617 | 11.44 | 0.0007 |

    | black | 1 | 0.3857 | 0.3502 | -0.3006 | 1.0721 | 1.21 | 0.2706 |

    | Scale | 0 | 1.0000 | 0.0000 | 1.0000 | 1.0000 |  |  |


    Remarkably, the estimates in Output 10.2 are identical to some of the estimates
    in Output 10.1. The coefficient for BLACK in the logit model is the same as the
    BLACK*DEATH coefficient in the loglinear model, along with identical standard
    errors and chi-squares. Similarly, the intercept (and associated statistics) in
    the logit model is the same as the DEATH coefficient in the loglinear model. This
    is a general phenomenon. As I’ve said before, every logit model for a contingency
    table has a corresponding loglinear model. But the main effects in the logit model
    become 2-way interactions (with the dependent variable) in the loglinear model.
    The intercept in the logit model becomes a main effect of the dependent variable
    in the loglinear model.


    Now let’s do something peculiar just to emphasize the point. We’ll estimate another
    logit model, but we’ll switch the variables around and make BLACK the dependent
    variable and DEATH the independent variable:'
  merge: -1
  img_proc: true
- pgno: 305
  md: "```\nPROC GENMOD DATA=penalty DESC;\n    FREQ n;\n    MODEL black=death / D=BINOMIAL\
    \ LINK=LOGIT AGGREGATE;\nRUN;\n```\n\n# Output 10.3 PROC GENMOD Output for Logit\
    \ Model for a 2 ×2 Table with Variables Reversed\n\n| Analysis Of Maximum Likelihood\
    \ Parameter Estimates |\n| Parameter | DF | Estimate | Standard Error | Wald 95%\
    \ Confidence Limits | Wald Chi-Square | Pr > ChiSq |\n| Intercept | 1 | -0.1446\
    \ | 0.2036 | -0.5436 0.2545 | 0.50 | 0.4776 |\n| death | 1 | 0.3857 | 0.3502 |\
    \ -0.3006 1.0721 | 1.21 | 0.2706 |\n| Scale | 0 | 1.0000 | 0.0000 | 1.0000 1.0000\
    \ |  |  |\n\nIn Output 10.3, we see again that the slope coefficient (along with\
    \ its standard error and chi-square) is identical to the two-way interaction in\
    \ the loglinear model. Unlike bivariate linear regression, where the regression\
    \ line changes when you reverse the dependent and independent variables, the bivariate\
    \ logit model is symmetrical with respect to the two variables. We also see that\
    \ the intercept term corresponds to the main effect of BLACK in the loglinear\
    \ model.\n\nWhy do the logit models share parameters with the loglinear model?\
    \ The algebra that demonstrates this is really quite simple. The dependent variable\
    \ in the logit model is the logarithm of the odds. As explained in chapter 2,\
    \ the odds can be defined as the expected number of events divided by the expected\
    \ number of non-events. For example, the log-odds of a death sentence for racial\
    \ group j is log(m1j/m2j). Substituting from the loglinear model in equation (10.1),\
    \ we get:\n\nlog(m1j/m2j) = log(m1j) − log(m2j)\n= (β0 + β1R1 + β2Cj + β3R1Cj)\
    \ − (β0 + β1R2 + β2Cj + β3R2Cj).\n\nBut because R1=1 and R2=0, this reduces to:\n\
    \nlog(m1j/m2j) = β1 + β3Cj."
  merge: -1
  img_proc: true
- pgno: 306
  md: "Similarly, if we reverse the independent and dependent variables, we obtain:\n\
    \nlog(m_{i1} / m_{i2}) = β₂ + β₃ R_i.\n\nThese results show that the loglinear\
    \ model for the 2 × 2 table implies two logit models, one for the row variable\
    \ as dependent on the column variable and the other for the column variable as\
    \ dependent on the row variable.\n\n# 10.3 Loglinear Models for a Four-Way Table\n\
    \nNow let’s look at a much more complicated table, the 2 × 2 × 4 × 4 table that\
    \ we previously analyzed by way of a logit model in Section 4.5. Our main goal\
    \ will be to duplicate the results of the logit model with a loglinear model.\
    \ To refresh your memory, the sample consisted of 4,991 high school seniors in\
    \ Wisconsin. The dependent variable was whether or not they planned to attend\
    \ college in the following year. The three independent variables were coded as\
    \ follows:\n\n+   IQ        1=low, 2=lower middle, 3=upper middle, 4=high\n+ \
    \  SES       1=low, 2=lower middle, 3=upper middle, 4=high\n+   PARENT    1=low\
    \ parental encouragement, 2= high encouragement\n\nIn Section 4.5, the data were\
    \ read in as 32 records, each record containing a unique combination of values\
    \ of the independent variables, along with the number of seniors who had those\
    \ values and the number of those seniors who planned to attend college. Unfortunately,\
    \ that’s not the format we need for a loglinear analysis. Instead, we need 64\
    \ records, one for each cell in the four-way table, with values for all the variables\
    \ and the frequency count in that cell. Here’s a DATA step that inputs the previous\
    \ data set (WISC) and outputs the new data set in the appropriate format (WISCTAB).\n\
    \n```\nDATA wisctab;\n  SET wisc;\n  college=1;\n  freq=coll;\n  OUTPUT;\n  college=0;\n\
    \  freq=total-coll;\n  OUTPUT;\n  DROP total coll;\nPROC PRINT;\nRUN;\n```"
