- pgno: 204
  md: 'the explanatory variables, it follows that the probability that person i chooses
    option j is given by equation (7.1).


    If these assumptions are credible, then the conditional logit model is reasonable.


    There has been some concern, however, about the assumption of independence of
    the random variables εj. This assumption (together with the extreme-value distributional
    assumption) implies a condition that is known as independence of irrelevant alternatives,
    frequently denoted IIA (read i-i-a, not 2a). This condition means that the odds
    of choosing option j rather than option k are not affected by what other options
    are available.


    It’s not hard to come up with counter examples to the IIA assumption. A classic
    example is the blue-bus/red-bus dilemma. Suppose I have two ways of getting to
    work, by car or by blue bus. My probability of taking the car is .8, which gives
    a car/blue bus odds of .8/.2=4. Now suppose another bus is introduced, identical
    in every way to the blue bus except that it’s red, so I now have three options.
    Because I’m indifferent to bus color, it’s reasonable to suppose that my probability
    of taking the car will still be .8 and that the remaining .2 will be equally divided
    between the two colors of buses. But then the conditional odds of choosing a car
    rather than a blue bus are .8/.1=8, a violation of the IIA condition.


    The IIA assumption can only be empirically tested when some sample members have
    different choice sets. That suggests that when everyone in the sample is presented
    with the same choice set, the IIA assumption may not be a serious problem. Here’s
    a simple model that illustrates that claim. Suppose that the potential choice
    set contains only three alternatives, labeled 1, 2, and 3. When people are presented
    with alternatives 1 and 2 only, their relative odds are given by log(p1 / p2)
    = α + βx , where x is a vector of explanatory variables. When people are presented
    with alternatives 1, 2, and 3, the relative odds of 1 versus 2 are given by log(p1
    / p2) = α + μ + βx . Clearly, this violates the IIA condition because of the additional
    μ term. But as long as everyone in the sample is presented with the same set of
    alternatives, conventional logit analysis will produce consistent and efficient
    estimates of β .


    Efforts to relax the IIA assumption have focused on introducing correlations among
    the εj’s in the random utility model, allowing them to be heteroscedastic and
    allowing for alternative distributional shapes. In the last section of this chapter,
    we’ll take a look at some of these more advanced discrete choice methods which
    are available in PROC MDC.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# ### 7.4 Travel Example


    Now let’s look at a more complicated application of the conditional logit model.
    In a survey of transportation usage between three Australian cities, 210 people
    were asked which of four options they used on their most recent trip: air, train,
    bus, or car (Hensher and Bradley 1993). They were also asked about certain characteristics
    of all four travel options, regardless of whether they used them. As in the previous
    example, a separate observation is constructed for each option for each person,
    giving a total of 840 observations. The variables are


    | Variable | Description |

    |---|---|

    | ID | A unique identifier for each person |

    | MODE | 1=air, 2=train, 3=bus, 4=car |

    | CHOICE | 1=chose that mode, 0=didn’t choose |

    | TTME | Estimated terminal waiting time |

    | COST | Estimated total cost for all stages |

    | TIME | Estimated total time in vehicle for all stages |

    | HINC | Household income in thousands |

    | PSIZE | Traveling party size |


    Output 7.2 displays the data for the first 20 observations (five persons). For
    each person, the last two variables are the same across all four options. The
    preceding three variables—TTME, COST, and TIME—describe relationships between
    the person and the option. For each person, they vary over options; and for each
    option, they vary over persons.


