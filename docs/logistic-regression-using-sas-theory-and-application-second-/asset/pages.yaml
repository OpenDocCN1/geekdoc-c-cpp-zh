  img_proc: true
- pgno: 243
  md: "This equation differs from equation (8.1) by the presence of αᵢ, which can\
    \ be thought of as representing the combined effects of all unobserved variables\
    \ that affect the outcome but which are stable over time. This is sometimes called\
    \ the *random intercepts* model. And αᵢ is often said to represent unobserved\
    \ heterogeneity. We shall assume that each αᵢ is a random variable with a specified\
    \ probability distribution. Specifically, the αᵢ’s are assumed to be independent\
    \ of the xᵢₜ and to have a normal distribution with a mean of 0. In the simpler\
    \ models, they are also assumed to be independent of each other and to have a\
    \ constant variance of σ².\n\nThe presence of αᵢ in equation (8.2) *induces* a\
    \ correlation between the repeated measurements of the outcome variable. If αᵢ\
    \ is high for particular individual, then many of that individual’s responses\
    \ will tend to be 1. On the other hand, if αᵢ is low, then many of the individual’s\
    \ responses will tend to be 0. The greater the variance of αᵢ, the higher the\
    \ within-individual correlations in the responses. This model implies a form of\
    \ exchangeability: the association between repeated measurements at any two time\
    \ points is the same for any pair of time points. Thus, it does not allow the\
    \ association to diminish with the length of time between measurements.\n\nSAS\
    \ has two procedures that can estimate mixed logistic regression models, PROC\
    \ NLMIXED and PROC GLIMMIX. Previously, I strongly preferred NLMIXED because it\
    \ did true maximum likelihood estimation, while early versions of GLIMMIX only\
    \ did something called pseudo-maximum likelihood. Pseudo ML is known to be inaccurate\
    \ for dichotomous outcomes, especially when the number of observations per cluster\
    \ is small (McCulloch 1997, Rodriguez and Goldman 1995). But now GLIMMIX can do\
    \ true maximum likelihood, using the same methods for integrating the likelihood\
    \ function that are found in PROC NLMIXED. We’ll focus on GLIMMIX here because\
    \ it has a much simpler syntax than NLMIXED. Here’s a program for estimating the\
    \ random intercepts model for the PTSD data:\n\n```\nPROC GLIMMIX DATA=ptsd METHOD=QUAD;\n\
    \    CLASS subj id time;\n    MODEL ptsd = control problems sevent cohes time\
    \ / D=B\n        SOLUTION;\n    RANDOM INTERCEPT / SUBJECT=subjid;\n    COVTEST\
    \ 0;\nRUN;\n```"
  merge: -1
  img_proc: true
- pgno: 244
  md: 'The syntax for GLIMMIX combines many of the features of PROC GENMOD and PROC
    MIXED (which does linear mixed models). The option METHOD=QUAD is essential for
    getting maximum likelihood estimates rather than pseudo likelihood estimates.
    QUAD refers to Gaussian quadrature, which is the method used to integrate the
    likelihood function over the distribution of the random intercept. The D=B option
    on the MODEL statement specifies a binomial distribution for the dependent variable,
    with a default logit link function. Note that, unlike LOGISTIC, SURVEYLOGISTIC,
    or GENMOD, PROC GLIMMIX does not require the DESCENDING option or the EVENT=''1''
    option. With D=B, GLIMMIX models the probability of a 1 rather than a 0. The SOLUTION
    option (which can be abbreviated as just S) requests that coefficient estimates
    be reported, in addition to the usual hypothesis tests.


    The RANDOM statement (which is much like the RANDOM statement in PROC MIXED),
    declares that the intercept will be treated as a random variable. The SUBJECT
    option says that this random variable will be different for each value of the
    SUBJID variable, but will be the same for observations with the same value of
    SUBJID. The COVTEST statement provides a test of the null hypothesis that the
    variance of α is 0. Output 8.11 gives the results.


    Note that I’ve included SUBJID in the CLASS statement. Unlike GENMOD, GLIMMIX
    does not require that the subject variable be in the CLASS statement, but it’s
    usually a good idea to do so. If the data are sorted by the subject variable,
    you’ll get the same results whether that variable is or is not in the CLASS statement.
    But if the data are not sorted by the subject variable, leaving it out of the
    CLASS statement will yield completely erroneous results.'
  merge: -1
  img_proc: true
