- pgno: 48
  md: "# 3.1 **Introduction**\n\nIn this chapter, we continue with the binary logit\
    \ model and its implementation in PROC LOGISTIC. We’ll examine several optional\
    \ features of this procedure, consider some potential problems that might arise,\
    \ and pursue the details of the estimation process in greater depth. You might\
    \ get by without this chapter, but you’d miss some useful and enlightening stuff.\n\
    \n# 3.2 **Confidence Intervals**\n\nIt’s standard practice in social science journals\
    \ to report only *point estimates* and hypothesis tests for the coefficients.\
    \ Most statisticians, on the other hand, hold that *confidence intervals* give\
    \ a better picture of the sampling variability of the estimates. PROC LOGISTIC\
    \ automatically produces 95% confidence intervals for the odds ratios, but you\
    \ may also want them for the regression coefficients.\n\nConventional confidence\
    \ intervals for the coefficients are easily computed by hand. For an approximate\
    \ 95% confidence interval around a coefficient, you simply add and subtract the\
    \ standard error multiplied by 1.96. But you can save yourself the trouble by\
    \ asking LOGISTIC to do it for you. In LOGISTIC, the option in the MODEL statement\
    \ for conventional (Wald) confidence intervals is CLPARM=WALD. To change that\
    \ to a 90% interval, put the option ALPHA=.10 on the MODEL statement.\n\nLOGISTIC\
    \ has another method, called *profile likelihood confidence intervals*, that may\
    \ produce better approximations especially in smaller samples. This method involves\
    \ an iterative evaluation of the likelihood function. In LOGISTIC, the model option\
    \ is CLPARM=PL (for profile likelihood). The profile likelihood method is computationally\
    \ intensive so you may need to use it sparingly for large samples.\n\nHere’s an\
    \ example of both kinds of confidence intervals using LOGISTIC with the death\
    \ penalty data set:\n\n```\nPROC LOGISTIC DATA=penalty;\n    MODEL death(EVENT='1')\
    \ = blackd whitvic culp / CLPARM=BOTH;\nRUN;\n```\n\nBesides the usual results,\
    \ we get the numbers shown in Output 3.1. The intervals produced by the two methods\
    \ are very similar but not identical."
  merge: -1
  img_proc: true
