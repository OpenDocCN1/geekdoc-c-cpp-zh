    It’s possible to have more than one random slope, but when I tried to introduce
    random slopes for each of the other variables, the algorithm failed to converge.
    The default is to assume that the all random effects are uncorrelated. But you
    can allow for correlations by specifying TYPE=UNR as an option on the RANDOM statement.
