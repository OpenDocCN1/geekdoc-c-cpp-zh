    What exactly are those effects? In Output 4.3, the odds ratio for MALE is 1.91.
    We can say, then, that the estimated odds of having had sexual intercourse by
    age 15 are nearly twice as large for males as for females, after adjusting for
    racial differences. It would probably be a mistake to put too much faith in the
    exact value 1.91, however. The 95% confidence interval is between 1.23 and 2.97.


    For WHITE, the highly significant adjusted odds ratio is .269, indicating that
    the odds of intercourse for whites is a little more than one-fourth the odds for
    blacks. It may be easier to interpret the reciprocal 1/.269 = 3.72, which says
    that the odds for blacks are nearly four times the odds for whites, controlling
    for gender differences. This has a 95% confidence interval of 2.3 to 5.9 (obtained
    by taking the reciprocal of the confidence limits in Output 4.3). That’s about
    all we can usefully do with this table. We could examine residuals but because
    the model fits so well, there’s little point.


