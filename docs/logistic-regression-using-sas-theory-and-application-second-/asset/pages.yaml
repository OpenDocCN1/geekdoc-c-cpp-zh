- pgno: 50
  md: '![](img/bbec4f484c16475caccf067e8da3ac57_50_0.png)


    If you want odds ratios for different increments, you could certainly calculate
    them by hand. If O is the odds ratio for a 1-unit increment, O^k is the odds ratio
    for a k-unit increment. But it’s easier to use the UNITS statement to produce
    “customized” odds ratios. For example, to get the odds ratio for a 2-unit increase
    in CULP, include the following statement in the LOGISTIC procedure:


    ```

    UNITS culp=2 / DEFAULT=1;

    ```


    The DEFAULT option tells SAS to print odds ratios and their confidence intervals
    for a 1-unit increase in each of the other variables in the model.


    # 3.3 Details of Maximum Likelihood Estimation


    In Section 2.6, I discussed some general properties of maximum likelihood estimators.
    Here, we consider the details of the construction and maximization of the likelihood
    function. Although this section can be skipped without loss of continuity, I strongly
    encourage you to work through it to the best of your ability. A basic understanding
    of maximum likelihood for the logistic model can help to remove much of the mystery
    of the technique. It can also help you understand how and why things sometimes
    go wrong.'
  merge: -1
  img_proc: true
- pgno: 51
  md: "Let’s start with some notation and assumptions. We have data for $n$ individuals\
    \ $(i=1,...,n)$ who are assumed to be statistically independent. For each individual\
    \ $i$, the data consists of $y_i$ and $\\mathbf{x}_i$, where $y_i$ is a random\
    \ variable with possible values of 0 and 1, and $\\mathbf{x}_i=[1\\ x_{i1}\\ ...\\\
    \ x_{ik}]'$ is a vector of explanatory variables (the 1 is for the intercept).\
    \ Vector notation is helpful here; otherwise, the equations get messy. For simplicity,\
    \ we treat $\\mathbf{x}_i$ as a set of fixed constants for each individual rather\
    \ than as random variables. (We could get equivalent results with $\\mathbf{x}_i$\
    \ treated as random and $y_i$ expressed conditional on the values of $\\mathbf{x}_i$,\
    \ but that would just complicate the notation.)\n\nLetting $p_i$ be the probability\
    \ that $y_i=1$, we assume that the data is generated by a logistic model, which\
    \ says that\n\n$$p_i = \\frac{1}{1+e^{-\\mathbf{\\beta x}_i}} \\ ,\\tag{3.1}$$\
    \ \n\nwhich is equivalent to equation (2.5).\n\nWe now construct the likelihood\
    \ function, which expresses the probability of observing the data in hand as a\
    \ function of the unknown parameters. The likelihood of observing the values of\
    \ $y$ for all the observations can be written as\n\n$$L = \\Pr(y_1, y_2, ...,\
    \ y_n).$$\n\nBecause we are assuming that observations are independent, the overall\
    \ probability of observing all the $y_i$'s can be factored into the product of\
    \ the individual probabilities:\n\n$$L = \\Pr(y_1)\\Pr(y_2)...\\Pr(y_n) = \\prod_{i=1}^{n}\\\
    Pr(y_i),\\tag{3.2}$$\n\nwhere $\\Pi$ indicates repeated multiplication.\n\nBy\
    \ definition, $\\Pr(y_i=1)=p_i$ and $\\Pr(y_i=0)=1-p_i$. That implies that we\
    \ can write\n\n$$\\Pr(y_i)=p_i^{y_i}(1-p_i)^{1-y_i}.\\tag{3.3}$$\n\nIn this equation,\
    \ $y_i$ acts like a switch, turning parts of the formula on or off. When $y_i=1$,\
    \ $p_i$ raised to the $y_i$ power is just $p_i$. But $1-y_i$ is then 0, and $(1-p_i)$\
    \ raised to the 0 power is 1. Things are reversed when $y_i=0$. Substituting equation\
    \ (3.3) into equation (3.2) and doing a little algebra yields\n\n$$L = \\prod_{i=1}^{n}p_i^{y_i}(1-p_i)^{1-y_i}\
    \ = \\prod_{i=1}^{n}\\left(\\frac{p_i}{1-p_i}\\right)^{y_i}(1-p_i).$$"
  merge: -1
  img_proc: true
- pgno: 52
  md: 'At this point we take the logarithm of both sides of the equation to get


    ```

    $$\log L = \sum_{i} y_i \log\left(\frac{p_i}{1-p_i}\right) + \sum_{i} \log(1-p_i).
    \tag{3.4}$$

    ```


    It is generally easier to work with the logarithm of the likelihood function because
    products get converted into sums and exponents become coefficients. Because the
    logarithm is an increasing function, whatever maximizes the logarithm of a function
    will also maximize the original function.


    Substituting our expression for the logit model (equation 3.1) into equation (3.4),
    we get


    ```

    $$\log L = \sum_{i} \mathbf{\beta x}_i y_i - \sum_{i} \log(1 + e^{\mathbf{\beta
    x}_i}) , \tag{3.5}$$

    ```


    which is about as far as we can go in simplifying the likelihood function.


    This brings us to step 2, choosing values of $\mathbf{\beta}$ that make the log-likelihood
    in equation (3.5) as large as possible. There are many different methods for maximizing
    functions like this. One well-known approach is to find the derivative of the
    function with respect to $\mathbf{\beta}$, set the derivative equal to 0, and
    then solve for $\mathbf{\beta}$. Taking the derivative of equation (3.5) and setting
    it equal to 0 gives us:


    ```

    $$\frac{\partial \log L}{\partial \mathbf{\beta}} = \sum_{i} \mathbf{x}_i y_i
    - \sum_{i} \mathbf{x}_i (1 + e^{-\mathbf{\beta x}_i})^{-1}

    = \sum_{i} \mathbf{x}_i y_i - \sum_{i} \mathbf{x}_i \hat{y}_i = 0 \tag{3.6}$$

    ```


    where


    ```

    $$\hat{y}_i = \frac{1}{1 + e^{-\mathbf{\beta x}_i}},$$

    ```


    the predicted probability of $y$ for a given value of $\mathbf{x}_i$. Because
    $\mathbf{x}_i$ is a vector, equation (3.6) is actually a system of $k+1$ equations,
    one for each element of $\mathbf{\beta}$.


    Those familiar with OLS theory may recognize the second line of equation (3.6)
    as identical to the *normal equations* for the linear model. The difference is
    that $\hat{y}$ is a linear function of $\mathbf{\beta}$ in the linear model but
    a nonlinear function of $\mathbf{\beta}$ in the logit model.


    Consequently, except in special cases like a single dichotomous $x$ variable,
    there is no explicit solution to equation (3.6). Instead, we must rely on iterative
    methods, which amount to successive approximations to the solution until the approximations
    “converge” to the'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'correct value. Again, there are many different methods for doing this. All
    produce the same solution, but they differ in such factors as speed of convergence,
    sensitivity to starting values, and computational difficulty at each iteration.


    One of the most widely used iterative methods is the Newton-Raphson algorithm,
    which can be described as follows: Let **U(β)** be the vector of first derivatives
    of log L with respect to **β** and let **I(β)** be the matrix of second derivatives
    of log L with respect to **β**.


    That is,


    **U(β)** = ∂log L / ∂β = Σᵢ **x**ᵢ yᵢ − Σᵢ **x**ᵢ ŷᵢ


    **I(β)** = ∂²log L / ∂β∂β′ = − Σᵢ **x**ᵢ **x**′ᵢ ŷᵢ (1 − ŷᵢ)


    The vector of first derivatives **U(β)** is sometimes called the *gradient* or
    *score*. The matrix of second derivatives **I(β)** is called the *Hessian*. The
    Newton-Raphson algorithm is then


    **β**₍ⱼ₊₁₎ = **β**ⱼ − **I**⁻¹(**β**ⱼ) **U(β**ⱼ)  (3.7)


    where **I**⁻¹ is the inverse of **I**. To operationalize this algorithm, we need
    a set of starting values **β**₀. PROC LOGISTIC starts by setting all the slope
    coefficients equal to 0. The intercept is set equal to log[p/(1-p)] where p is
    the overall proportion of events. These starting values are substituted into the
    right-hand side of equation (3.7), which yields the result for the first iteration,
    **β**₁. These values are then substituted back into the right-hand side, the first
    and second derivatives are recomputed, and the result is **β**₂. This process
    is repeated until you get “convergence,” which means that what you plug in on
    the right-hand side is what you get out on the left. In practice, you never get
    *exactly* the same thing, so it’s necessary to have a convergence criterion to
    judge how close is close enough.


    The default criterion in LOGISTIC is somewhat complicated and perhaps not worth
    our attention. But since every successful run of PROC LOGISTIC reports “Convergence
    criterion (GCONV=1E-8) satisfied,” we should probably consider what that means.
    Recall that the maximum of the likelihood function is obtained when the first
    derivative of the log-likelihood, **U(β)**, is equal to 0. To test whether that
    has actually been accomplished, LOGISTIC computes the following quantity at each
    iteration j:'
  merge: -1
  img_proc: true
- pgno: 54
  md: "$$\\frac{\\mathbf{U}(\\boldsymbol{\\beta}_j)'\\mathbf{I}^{-1}(\\boldsymbol{\\\
    beta}_j)\\mathbf{U}(\\boldsymbol{\\beta}_j)}{|\\log L(\\boldsymbol{\\beta}_j)|+.000001}$$\n\
    \nIf that number is less than .00000001, convergence is declared and the algorithm\
    \ stops.\n\nAfter the solution $\\hat{\\boldsymbol{\\beta}}$ is found, a byproduct\
    \ of the Newton-Raphson algorithm is an estimate of the covariance matrix of the\
    \ coefficients, which is just $-\\mathbf{I}^{-1}(\\hat{\\boldsymbol{\\beta}})$.\
    \ This matrix, which can be printed by putting COVB as an option in the MODEL\
    \ statement, is often useful for constructing hypothesis tests about linear combinations\
    \ of coefficients. Estimates of the standard errors of the coefficients are obtained\
    \ by taking the square roots of the main diagonal elements of this matrix.\n\n\
    # 3.4 Convergence Problems\n\nAs explained in the previous section, maximum likelihood\
    \ estimation of the logistic model is an iterative process of successive approximations.\
    \ Usually the process goes smoothly with no special attention needed. Only rarely\
    \ does it take more than 10 iterations to achieve convergence. However, sometimes\
    \ the iterative process breaks down so that convergence is not achieved. Dealing\
    \ with convergence failures can be one of the more frustrating problems encountered\
    \ by users of logistic regression.\n\nLOGISTIC has a default limit of 25 iterations.\
    \ If the algorithm hasn’t converged by this limit, LOGISTIC issues a warning message\
    \ and prints out the results at the last iteration. While it’s possible to raise\
    \ the iteration limit (with the MAXITER= option in the MODEL statement), this\
    \ rarely solves the problem. Models that haven’t converged in 25 iterations will\
    \ usually never converge.\n\nIn most cases of convergence failure, the maximum\
    \ likelihood estimates simply do not exist. Consider the following SAS program,\
    \ which inputs six observations on $x$ and $y$ and then performs a logistic regression\
    \ of $y$ on $x$:\n\n```\nDATA compsep;\n    INPUT x y;\n    DATALINES;\n1 0\n\
    2 0\n3 0\n4 1\n5 1\n```"
  merge: -1
  img_proc: true
