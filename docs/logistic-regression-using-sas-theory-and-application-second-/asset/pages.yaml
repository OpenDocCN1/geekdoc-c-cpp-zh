- pgno: 322
  md: 'inheritance (by deleting the main diagonal), it seems to be saying that the
    father’s status could affect whether the son moves up or down but does not determine
    the exact destination.


    Another of Goodman’s models is the *diagonals parameter model*. This model is
    motivated by the observation that the cells in Table 10.2 that are farther away
    from the main diagonal tend to have smaller frequencies. To represent this, we
    include a distinct parameter corresponding to each absolute difference between
    father’s status and son’s status:


    ```

    DATA c;

    SET mobility;

    band=ABS(dad-son);

    PROC GENMOD DATA=c;

    WHERE dad NE son;

    CLASS dad son band;

    MODEL n = dad son band /D=P;

    RUN;

    ```


    The results are shown in Output 10.9. The fit is not terrible, but it’s not great
    either—the *p*-value for the deviance is .014. The only parameters of interest
    to us are those for BAND. We see that cells that are directly adjacent to the
    main diagonal (BAND=1) have frequencies that are estimated to be exp(2.4824)=12
    times those in the off-diagonal corners. For BAND=2 and BAND=3, the frequency
    counts are estimated to be 7 times and 3 times those in the corners.


