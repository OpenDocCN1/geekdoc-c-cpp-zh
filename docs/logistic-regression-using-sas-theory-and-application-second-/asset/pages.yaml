    MI: P-value based on a mixture of chi-squares.


    The first thing we see in the output is an estimate of the variance of the random
    intercept: 2.1242. If this were 0, we’d be back to an ordinary logistic regression
    model. At the bottom of the output, we get a likelihood ratio chi-square test
    of the null hypothesis that this variance is 0. Clearly, that hypothesis can be
    rejected. Incidentally, there are serious technical difficulties that arise in
    the calculation of the p-value for a likelihood ratio test that a variance is
    equal to 0. But GLIMMIX solves those problems by calculating p-values “based on
    a mixture of chi-squares.”


    In the “Solutions for Fixed Effects” table, we find the coefficients, standard
    errors, t-statistics and p-values. Let’s compare these results in with those in
    Output 8.10 for the GEE exchangeable odds ratio model, which is the GEE model
    that’s most similar to the random intercepts model. The t-statistics in Output
    8.11 are all pretty close to the z-statistics in Output 8.10 (both are just ratios
    of the coefficients to their standard errors). But the'
