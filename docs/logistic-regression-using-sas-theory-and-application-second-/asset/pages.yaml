  md: "# Chapter 1\n\n# Introduction\n\n+   1.1  What This Book Is About  1\n+   \n\
    +   1.2  What This Book Is Not About  3\n+   \n+   1.3  What You Need to Know\
    \  3\n+   \n+   1.4  Computing  4\n+   \n+   1.5  References  4\n\n# 1.1  What\
    \ This Book Is About\n\nWhen I began graduate study at the University of Wisconsin\
    \ in 1970, categorical data analysis consisted of chi-square tests for cross-tabulated\
    \ data, a technique introduced around 1900 by the great Karl Pearson. This methodology\
    \ was viewed with scorn by most of my quantitatively oriented cohorts. It was\
    \ the province of old fogies who hadn’t bothered to learn about REGRESSION ANALYSIS,\
    \ the new universal tool for social science data analysis. Little did we realize\
    \ that another revolution was taking place under our noses. By the time I left\
    \ Wisconsin in 1975, the insanely great new thing was LOGLINEAR ANALYSIS, which\
    \ made it possible to analyze complicated contingency tables in ways that Karl\
    \ Pearson never dreamed of. But loglinear analysis was a rather different animal\
    \ from linear regression and I, for one, never felt entirely comfortable working\
    \ in the loglinear mode.\n\nIn the years after I left Wisconsin, these dissimilar\
    \ approaches to data analysis came together in the form of LOGIT ANALYSIS, also\
    \ known as logistic regression analysis. The logit model is essentially a regression\
    \ model that is tailored to fit a categorical dependent variable. In its most\
    \ widely used form, the dependent variable is a simple dichotomy, and the independent\
    \ variables can be either quantitative or categorical. As we shall see, the logit"
  merge: -1
  img_proc: true
- pgno: 10
  md: 'model can be generalized to dependent variables that have more than two categories,
    both ordered and unordered. Using the method of conditional logit analysis, it
    can also be extended to handle specialized kinds of data such as discrete-choice
    applications, matched-pair analysis, and longitudinal data. Logit models for longitudinal
    data can also be estimated with such methods as generalized estimating equations
    and logistic regression with random effects.


    This book is an introduction to the logit model and its various extensions. Unlike
    most introductory texts, however, this one is heavily focused on the use of SAS
    to estimate logit and related models. In my judgment, you can’t fully understand
    and appreciate a new statistical technique without carefully considering the practical
    details of estimation. To accomplish that, it’s necessary to choose a particular
    software system to carry out the computations. Although there are many good statistical
    packages for doing logistic regression, SAS is certainly among the best in terms
    of the range of estimation methods, available features and options, efficiency
    and stability of the algorithms, and quality of the documentation. I find I can
    do almost anything I want to do in SAS and, in the process, I encounter few of
    the annoying software problems that seem to crop up frequently in other packages.


    In addition to the logit model, I also write briefly about two alternatives for
    binary data, the probit model and the complementary log-log model. The last chapter
    is about loglinear analysis, which is a close cousin to logit analysis. Because
    some kinds of contingency table analysis are awkward to handle with the logit
    model, the loglinear model can be a useful alternative. I don’t pretend to give
    a comprehensive treatment of loglinear analysis, however. The emphasis is on how
    to do it with the GENMOD procedure, and to show examples of the types of applications
    where a loglinear analysis might be particularly useful. The penultimate chapter
    is about Poisson regression models for count data. I’ve included this topic partly
    for its intrinsic interest, but also because it’s a useful preparation for the
    loglinear chapter. In PROC GENMOD, loglinear analysis is accomplished by way of
    Poisson regression.


    Besides GENMOD, this book includes discussions of the following SAS procedures:
    LOGISTIC, SURVEYLOGISTIC, GLIMMIX, NLMIXED, QLIM, and MDC. However, this book
    is not intended to be a comprehensive guide to these SAS procedures. I discuss
    only those features that are most widely used, most potentially useful, and most
    likely to cause'
