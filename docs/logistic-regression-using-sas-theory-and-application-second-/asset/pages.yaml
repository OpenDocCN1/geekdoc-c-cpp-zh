- pgno: 218
  md: "The reference category is travel by car (MODE = 4). Now here’s the MDC code\
    \ for the model that produced Output 7.5, which included the MODE dummies and\
    \ the mode/person characteristics:\n\n```\n```sas\nPROC MDC DATA=travel2;\n  \
    \ MODEL choice = air train bus ttme time cost / CHOICE=(mode)\n      TYPE=clogit;\n\
    \   ID id;\nRUN;\n```\n```\n\nThe ID statement plays the same role as the STRATA\
    \ statement in PROC LOGISTIC.\n\nTYPE=CLOGIT specifies the conditional logit model.\
    \ We’ll try other models in a moment.\n\nThe CHOICE option specifies the variable\
    \ containing integer values that distinguish different choices. For the basic\
    \ conditional logit model, it’s not obvious why this option is needed. But it\
    \ plays an important role in the more complex models. The main portion of the\
    \ output is shown in Output 7.11.\n\n# Output 7.11  A Conditional Logit Model\
    \ with PROC MDC\n\n| Parameter | DF | Estimate | Standard Error | t Value | Approx\
    \ Pr > \\|t\\| |\n|---|---:|---:|---:|---:|---:|\n| air | 1 | 4.7399 | 0.8675\
    \ | 5.46 | <.0001 |\n| train | 1 | 3.9532 | 0.4686 | 8.44 | <.0001 |\n| bus |\
    \ 1 | 3.3062 | 0.4583 | 7.21 | <.0001 |\n| TTME | 1 | -0.0969 | 0.0103 | -9.37\
    \ | <.0001 |\n| TIME | 1 | -0.003995 | 0.000849 | -4.70 | <.0001 |\n| COST | 1\
    \ | -0.0139 | 0.006651 | -2.09 | 0.0365 |\n\nResults in Output 7.11 are essentially\
    \ the same as those in Output 7.5 produced by PROC LOGISTIC, except that *t*-statistics\
    \ rather than chi-squares are reported.\n\nNow let’s try relaxing some of the\
    \ assumptions of the conditional logit model. We saw earlier that the conditional\
    \ logit model can be derived by assuming that choices arise from underlying random\
    \ utilities, as expressed in equation (7.2). One assumption of that model was\
    \ that the random variables εᵢⱼ all had the same variance. Now let’s allow the\
    \ variances to differ for each choice option *j*. This is sometimes called the\
    \ heteroscedastic extreme value (HEV) model because the εᵢⱼ’s are assumed to have\
    \ standard extreme value"
