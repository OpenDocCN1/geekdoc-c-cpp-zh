- pgno: 268
  md: "The best method to use depends greatly on the design, the data, and the goals\
    \ of the analysis. In randomized experiments, there is little danger of spuriousness,\
    \ so conditional logit is relatively unattractive. With observational (non-experimental)\
    \ data, on the other hand, spuriousness is nearly always a serious concern, making\
    \ conditional logit analysis especially attractive. I typically use both conditional\
    \ logit and GEE analysis (or a mixed model) to get greater insight into the data.\
    \ But as we saw in the matching section, some designs make GEE impossible while\
    \ others make conditional logit analysis unappealing.\n\n# 8.10 A Hybrid Method\n\
    \nThe four methods just considered are now fairly well known and understood. There’s\
    \ also a fifth approach that combines the virtues of the conditional logit method\
    \ with those of GEE or the mixed model. Neuhaus and Kalbfleisch (1998) have the\
    \ most explicit discussion of the method for binary data, but the general strategy\
    \ was previously considered by Bryk and Raudenbusch (1992) and applied to a study\
    \ of criminal recidivism by Horney et al. (1995). The method can be summarized\
    \ in four steps:\n\n+   1. Calculate the means of the time-varying explanatory\
    \ variables for each individual.\n+   2. Calculate the deviations of the time-varying\
    \ explanatory variables from the individual-specific means.\n+   3. Estimate the\
    \ model with variables created in steps 1 and 2, along with any additional time-constant\
    \ explanatory variables.\n+   4. Use GEE or a mixed model to adjust for residual\
    \ dependence.\n\nThe coefficients and standard errors for the deviation variables\
    \ are typically very similar to those obtained with conditional logit analysis.\
    \ But unlike conditional logit analysis, this method also allows for the inclusion\
    \ of explanatory variables that are constant over time.\n\nBefore estimating the\
    \ model, one must calculate the individual-specific means and the deviations from\
    \ those means. Here’s how to do it for the PTSD data:\n\n```\nPROC SUMMARY DATA=ptsd\
    \ NWAY;\n  CLASS subjid;\n  VAR control problems sevent;\n  OUTPUT OUT=means MEAN=mcontrol\
    \ mproblem msevent;\nDATA combine;\n  MERGE ptsd means;\n  BY subjid;\n```"
  merge: -1
  img_proc: true
- pgno: 269
  md: "```\n```sas\ndcontrol=control-mcontrol;\ndproblem=problems-mproblem;\ndsevent=sevent-msevent;\n\
    RUN;\n```\n```\n\nPROC SUMMARY produces a data set called MEANS, which contains\
    \ 316 observations. Each of these observations has four variables: the individual’s\
    \ ID number and the individual’s means for the three time-varying explanatory\
    \ variables (CONTROL, PROBLEMS, and SEVENT). The DATA step merges the MEANS data\
    \ set with the original data set and computes the deviation variables. The new\
    \ data set (COMBINE) has 948 observations, with the means replicated across the\
    \ three observations for each individual.\n\nWe can now estimate a logistic model\
    \ that includes both the mean and the deviations from the means. Because there\
    \ may still be residual dependence in the dependent variable, this should be accommodated\
    \ with either GEE or a mixed model. The SAS code for a mixed model using PROC\
    \ GLIMMIX is:\n\n```\n```sas\nPROC GLIMMIX DATA=combine METHOD=QUAD EMPIRICAL;\n\
    \    CLASS subjid time;\n    MODEL ptsd = dcontrol dproblem vsevent mcontrol mproblem\n\
    \                 msevent cohes time / D=B S;\n    RANDOM INTERCEPT / SUBJECT=subjid;\n\
    RUN;\n```\n```\n\nI’ve included the EMPIRICAL option to produce robust standard\
    \ errors which protect against violation of the exchangeability assumption that\
    \ is implicit in the random intercept model. The results are shown in Output 8.26.\
    \ As expected, the coefficients and p-values for the three deviation variables\
    \ are quite close to those in Output 8.13 for the conditional logit model. In\
    \ this example, coefficients for the three mean variables are also somewhat similar\
    \ to those for the deviation variables, but this will not always be the case.\
    \ In fact, I’ve seen examples in which the deviation variables and the mean variables\
    \ have highly significant coefficients that are opposite in sign."
  merge: -1
  img_proc: true
- pgno: 270
