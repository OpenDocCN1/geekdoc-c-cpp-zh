    # 6.6 Adjacent Categories Model


    Another general model for ordered categorical data is the adjacent categories
    model. As before, we let p_ij be the probability that individual i falls into
    category j of the dependent variable, and we assume that the categories are ordered
    in the sequence j=1, ..., J. Now take any pair of categories that are adjacent,
    such as j and j+1. We can write a logit model for the contrast between these two
    categories as a function of explanatory variables:


    log( p_{i,j+1} / p_{ij} ) = α_j + β_j x_i      j = 1,...,J-1,      (6.6)


    where β_j x_i = β_{j1} x_{i1} + ... + β_{jk} x_{ik}. There are J-1 of these paired
    contrasts. It turns out that this is just another way of writing the multinomial
    logit model for unordered categories. In other words, equation (6.6) is equivalent
    to equation (5.1). To get the adjacent categories model for ordered data, we impose
    a constraint on this set of equations. Specifically, we assume that β_j = β for
    all j. In other words, instead of having a different set of coefficients'
  merge: -1
