  md: "and interpreted. Either of the two zero-inflated models starts with the assumption\
    \ that the population consists of two groups:\n\n+   1. For the *regression group*,\
    \ a conventional Poisson or negative binomial regression model applies. Individuals\
    \ in this group may or may not have count values of 0.\n+   2. For the *zero group*,\
    \ it’s impossible to have a count other than 0. For these individuals, the covariates\
    \ have no effect on the outcome.\n\nAn individual whose count is greater than\
    \ zero is necessarily in the regression group. But an individual with an observed\
    \ count of zero could be in either of the two groups.\n\nThis sort of model is\
    \ sometimes called a finite mixture model. It can be estimated by maximum likelihood,\
    \ even though we can’t distinguish with certainty whether individuals with counts\
    \ of zero are in one group or the other. In addition to the usual regression coefficients\
    \ (for the individuals in the regression group), we can get an estimate of the\
    \ probability that an individual is in the zero group. And we can elaborate the\
    \ models further by allowing the probability of being in the zero group to be\
    \ a function of covariates, usually via logistic regression.\n\nLet’s try these\
    \ models on the patient visit data that we analyzed in the last section. Here’s\
    \ the GENMOD code for the basic zero-inflated Poisson model:\n\n```\nPROC GENMOD\
    \ DATA=prog2;\n    MODEL lengthpx=ptage ptsex ezcompt mdlikept surgeon claims\
    \ /\n        OFFSET=lmin D=ZIP;\n    ZEROMODEL;\nRUN;\n```\n\nAs in the previous\
    \ section, the OFFSET option is used to adjust for the varying lengths of the\
    \ patient visits. To get the ZIP model, two changes are needed: D=ZIP on the MODEL\
    \ statement, and a ZEROMODEL statement. As we’ll see later, this statement allows\
    \ one to specify covariates for the logistic regression part of the model. But\
    \ it’s required even when you don’t want covariates.\n\nResults are shown in Output\
    \ 9.13. Although this model fits better than the conventional Poisson model in\
    \ Output 9.11, the fit is still pretty bad, with a Pearson chi-square more than\
    \ three times its degrees of freedom. Notice the new table at the end titled “Analysis\
    \ of Maximum Likelihood Zero Inflation Parameter Estimates.” For a model with\
    \ no covariates in the ZEROMODEL statement, the value reported in this table (-.4839)\
    \ is the"
