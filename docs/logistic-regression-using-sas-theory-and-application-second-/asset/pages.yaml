    \ As a matter of fact, the results for all the coefficients besides CULP 1 are\
    \ identical in Output 3.7 (which excluded cases) and in Output 3.5 (which yielded\
    \ quasi-complete separation). Of course, the coefficient for CULP 1 in Output\
    \ 3.5 is useless; in research reports, I suggest listing it as ∞. The reported\
    \ standard error and Wald chi-square for this variable are also useless. Nevertheless,\
    \ it is still possible to get valid likelihood-ratio tests. PROC GENMOD (which\
    \ we’ll discuss in later chapters) has some easy options for getting likelihood-ratio\
    \ tests for individual coefficients. PROC LOGISTIC doesn’t have those options,\
    \ but it has a close equivalent—the profile likelihood confidence intervals that\
    \ we discussed in Section 3.1.\n\nConsider the following program which, as we\
    \ saw earlier, produced the quasi-complete separation for CULP 1 in Output 3.5:\n\
    \n```\nPROC LOGISTIC DATA=penalty;\n    WHERE blackcd=0;\n    CLASS culp /PARAM=REF;\n\
