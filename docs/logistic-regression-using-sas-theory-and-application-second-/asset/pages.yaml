- pgno: 68
  md: '# 3.5 Multicollinearity


    One of the nice things about logistic regression is that it’s so much like ordinary
    linear regression analysis. Unfortunately, some of the less pleasant features
    of linear regression analysis also carry over to logistic regression. One of these
    is multicollinearity, which occurs when there are strong linear dependencies among
    the explanatory variables.


    For the most part, everything you know about multicollinearity for ordinary regression
    also applies to logistic regression. The basic point is that, if two or more variables
    are highly correlated with one another, it’s hard to get good estimates of their
    distinct effects on some dependent variable. Although multicollinearity doesn’t
    bias the coefficients, it does make them more unstable. Standard errors may get
    large, and variables that appear to have weak effects, individually, may actually
    have quite strong effects as a group. Fortunately, the consequences of multicollinearity
    only apply to those variables that are collinear.


    How do you diagnose multicollinearity? Examining the correlation matrix produced
    by PROC CORR may be helpful but is not sufficient. It’s quite possible to have
    data in which no pair of variables has a high correlation, but several variables
    together may be highly interdependent. Much better diagnostics are produced by
    PROC REG with the options TOL, VIF, and COLLINOINT. But PROC LOGISTIC doesn’t
    have these options, so what can you do? The thing to remember is that multicollinearity
    is a property of the explanatory variables, not the dependent variable. So whenever
    you suspect multicollinearity in a logit model, just estimate the equivalent model
