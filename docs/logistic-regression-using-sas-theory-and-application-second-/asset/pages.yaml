- pgno: 309
  md: 'As before, we are fitting a Poisson regression model for the frequency counts,
    with the default logarithmic link. The first term on the right-hand side of the
    MODEL equation—IQ|SES|PARENT—is shorthand for IQ*SES*PARENT IQ*SES IQ*PARENT SES*PARENT
    IQ SES PARENT. In other words, we fit the 3-way interaction, the three 2-way interactions,
    and the main effects of each of the independent variables. These parameters pertain
    only to the relationships among the independent variables in the logit model,
    not to the effects of the independent variables on the dependent variable (college
    choice). We include them in the model because to do otherwise would assert that
    they are 0. Because we cannot force these parameters to be 0 in a logit model,
    neither do we do it in the corresponding loglinear model. The general principle
    is this: *Whenever you want a loglinear model to be equivalent to some logit model,
    you must include all possible interactions among the predictor variables in the
    logit model.* Even though we include these interactions, they rarely have any
    substantive interest because they describe relationships among the predictor variables
    *conditional on the values of the dependent variable*. Ordinarily, these parameters
    have no useful causal interpretation.


    The parameters that do have a useful interpretation are specified in the MODEL
    statement as COLLEGE IQ*COLLEGE SES*COLLEGE PARENT*COLLEGE. These correspond to
    the intercept and the three main effects of the independent variables on the dependent
    variable in the logit model. So, all the parameters in the corresponding logit
    model involve the dependent variable when specified in the loglinear model. Notice
    that IQ and SES are listed as CLASS variables so that, for each variable, three
    dummy variables will be constructed to represent the four categories. This is
    unnecessary for COLLEGE and PARENT because they are dichotomous.


    Results are shown in Output 10.5. Values that are the same as those in Output
    4.10, obtained by direct fitting of the logit model, are shown in italics. The
    numbers to the right of the parameter names correspond to the values of the CLASS
    variables. Apparently, the loglinear model contains many more parameters than
    the logit model, but the parameters that matter are identical in the two models.
    Notice also that the deviance and Pearson chi-squares are identical for the logit
    and loglinear models. The Type 3 chi-squares are not identical in the two outputs
    because PROC LOGISTIC reports Wald chi-squares while PROC GENMOD reports likelihood
    ratio chi-squares. But the values are similar.'
  merge: -1
  img_proc: true
