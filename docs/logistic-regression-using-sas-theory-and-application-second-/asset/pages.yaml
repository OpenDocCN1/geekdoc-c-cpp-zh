- pgno: 119
  md: "If we have access to the individual-level data, we can simply estimate a logit\
    \ model directly, as with the following LOGISTIC program:\n\n```\nPROC LOGISTIC\
    \ DATA=penalty;\n    MODEL death(EVENT='1') = blackd;\nRUN;\n```\n\nResults are\
    \ shown in Output 4.1. The odds ratio is identical to what we got in Section 2.4\
    \ by hand calculation. It is not statistically significant.\n\n# Output 4.1 PROC\
    \ LOGISTIC Output for a 2 x 2 Table\n\n| Testing Global Null Hypothesis: BETA=0\
    \ |\n|---|---|---|---|\n| Test | Chi-Square | DF | Pr > ChiSq |\n| Likelihood\
    \ Ratio | 1.2205 | 1 | 0.2693 |\n| Score | 1.2184 | 1 | 0.2697 |\n| Wald | 1.2134\
    \ | 1 | 0.2707 |\n\n| Analysis of Maximum Likelihood Estimates |\n|---|---|---|---|---|---|\n\
    | Parameter | DF | Estimate | Standard Error | Wald Chi-Square | Pr > ChiSq |\n\
    | Intercept | 1 | -0.8602 | 0.2543 | 11.4390 | 0.0007 |\n| blackd | 1 | 0.3857\
    \ | 0.3502 | 1.2134 | 0.2707 |\n\n| Odds Ratio Estimates |\n|---|---|---|---|\n\
    | Effect | Point Estimate | 95% Wald Confidence Limits | |\n| blackd | 1.471 |\
    \ 0.740 | 2.921 |\n\nNow, suppose we don’t have the individual-level data. All\
    \ we have is Table 4.1. There are two different ways to get the tabular data into\
    \ PROC LOGISTIC. The first method is to create a data set that has one record\
    \ for each of the four cell frequencies in the table, together with appropriately\
    \ coded variables that represent the defendant’s race and sentence:"
  merge: -1
  img_proc: true
- pgno: 120
  md: "```\nDATA tab4_1a;\n    INPUT f blackd death;\n    DATALINES;\n22 0 1\n28 1\
    \ 1\n52 0 0\n45 1 0\n;\n```\n\nThen we use the FREQ statement in LOGISTIC to specify\
    \ that each of these data lines is to be replicated, using the number of replications\
    \ given by the variable F:\n\n```\nPROC LOGISTIC DATA=tab4_1a;\n    FREQ f;\n\
    \    MODEL death(EVENT='1') = blackd\nRUN;\n```\n\nResults are identical to those\
    \ in Output 4.1.\n\nThe other way to handle tabular data is to use the events/trials\
    \ syntax. Instead of inputting all four internal cell counts in the table, we\
    \ input the cell frequencies for death sentences along with the column totals,\
    \ i.e., the number of black defendants and the number of non-black defendants:\n\
    \n```\nDATA tab4_1b;\n    INPUT death total blackd;\n    DATALINES;\n22 74 0\n\
    28 73 1\n;\n```\n\nWe can describe this data set as follows: among 74 non-black\
    \ defendants, 22 got the death penalty; among 73 black defendants, 28 got the\
    \ death penalty.\n\nNext we specify a dependent variable that has two parts, separated\
    \ by a slash:\n\n```\nPROC LOGISTIC DATA=tab4_1b;\n    MODEL death/total = blackd;\n\
    RUN;\n```\n\nInstead of replicating the observations, LOGISTIC treats the variable\
    \ DEATH as having a binomial distribution with the number of trials (an apt term\
    \ for these data) given by the variable TOTAL. Note that with this syntax, you\
    \ do not need the EVENT='1' option in the MODEL statement. That’s because using\
    \ DEATH as the number of events directly specifies"
  merge: -1
  img_proc: true
- pgno: 121
  md: "death penalty (rather than life sentence) as the event of interest. Again,\
    \ results are identical to those in Output 4.1.\n\nFor a 2 × 2 table, we can also\
    \ produce many of these results with PROC FREQ:\n\n```\nPROC FREQ DATA=tab4_1a;\n\
    \    WEIGHT f;\n    TABLES blackd*death / CHISQ RELRISK;\nRUN;\n```\n\nSelected\
    \ results are shown in Output 4.2.\n\n# Output 4.2 PROC FREQ Results\n\nStatistics\
    \ for Table of blackd by death\n\n| Statistic | DF | Value | Prob |\n|---|---|---|---|\n\
    | Chi-Square | 1 | 1.2184 | 0.2697 |\n| Likelihood Ratio Chi-Square | 1 | 1.2205\
    \ | 0.2693 |\n| Continuity Adj. Chi-Square | 1 | 0.8644 | 0.3525 |\n| Mantel-Haenszel\
    \ Chi-Square | 1 | 1.2101 | 0.2713 |\n| Phi Coefficient |  | 0.0910 |  |\n| Contingency\
    \ Coefficient |  | 0.0907 |  |\n| Cramer's V |  | 0.0910 |  |\n\nEstimates of\
    \ the Relative Risk (Row1/Row2)\n\n| Type of Study | Value | 95% Confidence Limits\
    \ |\n|---|---|---|\n| Case-Control (Odds Ratio) | 1.4707 | 0.7404 | 2.9214 |\n\
    \nThe CHISQ option gives us several statistics for testing the null hypothesis\
    \ that the two variables are independent, which is equivalent to the hypothesis\
    \ that the slope is 0 in the logit model. Notice that Pearson’s chi-square (labeled\
    \ simply chi-square in Output 4.2) is identical to the score statistic in the\
    \ PROC LOGISTIC Output 4.1. The likelihood ratio chi-square in Output 4.2 is identical\
    \ to the chi-square labeled −2LOG L in Output 4.1. The RELRISK option gives us\
    \ the odds ratio, which is identical to the odds ratio in the PROC LOGISTIC output."
  merge: -1
