- pgno: 317
  md: "To save space, Output 10.7 has been edited to display only those parameter\
    \ estimates that correspond to the multinomial logit model. Of course, those parameters\
    \ include all model terms that contain HAPPY. In the first two coefficients for\
    \ MARRIED, we see that the coefficient for category 1 (versus category 3) is 1.5725,\
    \ which is about twice as large as the coefficient of .7092 for category 2. That’s\
    \ what we would expect from the adjacent categories model, so apparently the problem\
    \ is not with this variable. However, things aren’t quite so simple with YEAR.\
    \ In the previous model, we found no evidence for any effect of year on happiness,\
    \ but now we see that the 1974 contrast between categories 2 and 3 of HAPPY is\
    \ highly significant, and the 1984 contrast between categories 2 and 3 is marginally\
    \ significant. But the contrasts between categories 1 and 3 of HAPPY are both\
    \ far from significant. Clearly, there is some kind of effect of year on happiness,\
    \ but it doesn’t conform to the adjacent categories assumption. What appears to\
    \ be happening is that each 10-year increment in time is associated with an increase\
    \ in the odds of being in the middle category (pretty happy) and a corresponding\
    \ reduction of the odds of being in either of the two extreme categories.\n\n\
    We can represent this interpretation by a more parsimonious model that (a) treats\
    \ happiness as quantitative in its association with marital status and (b) linearizes\
    \ the effect of year on a dichotomous version of happiness—pretty happy versus\
    \ the two extreme responses:\n\n```\nDATA happy3;\n    SET happy2;\n    yearq=year;\n\
    \    pretty=happy eq 2;\nPROC GENMOD DATA=happy3;\n    CLASS year happy;\n   \
    \ MODEL count=year|married happy yearq*pretty married*happyq\n        / D=P;\n\
    RUN;\n```\n\n# Output 10.8 Selected Parameter Estimates for the Parsimonious Model\n\
    \n| Analysis Of Maximum Likelihood Parameter Estimates |\n| Parameter | DF | Estimate\
    \ | Standard Error | Wald 95% Confidence Limits | Wald Chi-Square | Pr > ChiSq\
    \ |\n| happy | 1 | 1 | 0.0852 | 0.0645 | -0.0412 | 0.2116 | 1.75 | 0.1865 |\n\
    | happy | 2 | 1 | 0.7303 | 0.0845 | 0.5646 | 0.8959 | 74.64 | <.0001 |\n| happy\
    \ | 3 | 0 | 0.0000 | 0.0000 | 0.0000 | 0.0000 | . | . |\n| yearq*pretty |  | 1\
    \ | 0.1722 | 0.0320 | 0.1095 | 0.2349 | 28.98 | <.0001 |"
  merge: -1
  img_proc: true
