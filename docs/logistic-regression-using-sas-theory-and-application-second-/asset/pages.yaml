  md: 'likelihood" and a "full log likelihood." What’s the difference? The "full log
    likelihood" is the true logarithm of the likelihood function. The BIC, AIC, and
    AICC statistics are based on this number. In earlier releases of GENMOD, however,
    only the "log likelihood" was reported. This statistic differs from the "full
    log likelihood" by a constant that depends on the data but not on the unknown
    parameters, and therefore it is sufficient to find parameter values that maximize
    the "log likelihood." While the "log likelihood" may be positive due to the omission
    of the unnecessary constant, the "full log likelihood" is always negative.


