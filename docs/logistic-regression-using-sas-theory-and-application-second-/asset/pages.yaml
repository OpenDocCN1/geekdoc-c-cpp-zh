- pgno: 222
  md: "Because of the normality assumption, the HEV and conditional logit models are\
    \ not special cases of the multinomial probit model. However, we can compare these\
    \ models with the BIC (Schwartz) criterion reported in the output. Here are the\
    \ figures: conditional logit 509.8, HEV 482.8, and multivariate probit 496.5.\
    \ So the best fitting model (with the lowest BIC) is the HEV model, although the\
    \ convergence status of that model is questionable.\n\nNow let’s consider one\
    \ other model in MDC that allows for departures from the IIA assumption, the nested\
    \ logit model. This model presumes that choice options can be nested into groups,\
    \ with random utilities that are correlated within groups and uncorrelated between\
    \ groups. For the travel data, for example, we might suppose that all the public\
    \ choices (train, bus, plane) fall into one group and the private choice (automobile)\
    \ is in its own group. In other words, the public choices would tend to share\
    \ unobserved characteristics that are not shared by the private choice.\n\nHere’s\
    \ how to specify such a model in PROC MDC:\n\n```\nPROC MDC DATA=travel2;\n  \
    \  MODEL choice = ttme time cost / CHOICE=(mode)\n        TYPE=NLOGIT;\n    UTILITY\
    \ U(1,)=ttme time cost;\n    NEST LEVEL(1)=(1 2 3 @1, 4@2),\n        LEVEL(2)=(1\
    \ 2@1);\n    ID id;\nRUN;\n```\n\nObviously, TYPE=NLOGIT requests the nested logit\
    \ model. Such models require both a NEST statement and a UTILITY statement. When\
    \ the predictor variables are the same for all choice options, the UTILITY statement\
    \ takes the simple form shown here, with U(1,)= followed by a list of predictors\
    \ in the model. The NEST statement must have at least two LEVELS. The LEVEL(1)\
    \ option says that group 1 is composed of CHOICE values 1, 2, and 3, and group\
    \ 2 is composed of CHOICE value 4. The LEVEL(2) option says that group 1 and group\
    \ 2 are members of a single higher level group.\n\nResults are shown in Output\
    \ 7.14. As in the multivariate probit model, the p-value for COST is well above\
    \ any conventional level of significance. TTME and TIME have p-values and coefficients\
    \ that are similar to those in earlier models, although the coefficient for TTME\
    \ is about twice as large as the one reported for the conditional logit model\
    \ (Output 7.3)."
  merge: -1
