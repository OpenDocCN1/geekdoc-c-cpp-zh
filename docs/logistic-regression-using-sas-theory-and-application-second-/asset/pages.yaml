    differences in how the formulas adjust for the number of parameters relative to
    the number of cases. Note that GENMOD reports z-statistics rather than chi-square
    statistics. But if you square them, you get chi-square statistics, and the p-values
    are the same either way.


    One downside of PROC GENMOD is that it doesn’t report odds ratios. You can request
    them with an ESTIMATE statement, but you’ll need a different statement for each
    odds ratio. For example, to get the odds ratio for SEVENT in Output 8.4, include
    the following statement after the MODEL statement:


    ```

    ESTIMATE ''sevent'' sevent 1 / EXP;

    ```


    The ESTIMATE statement requires a label, which can be any text enclosed by quotes.
    This statement says to take the coefficient of SEVENT, multiply it by 1, and then
    exponentiate it. Results are shown in Output 8.5. The odds ratio of 1.4272 is
    shown on the second line of the column “L’Beta Estimate”. We can interpret this
    by saying that “each additional stressful'
