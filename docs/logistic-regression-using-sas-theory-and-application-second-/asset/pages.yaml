    In Output 9.3, we see that two variables are significant predictors of publication
    counts, age and the selectivity of the undergraduate institution. Because the
    dependent variable is logged, we can interpret the coefficients much like logistic
    regression coefficients. Specifically, if we calculate 100(e^β−1), we get the
    percent change in the expected number of publications with each 1-unit increase
    in the independent variable. For AGE, a one-year increase in age is associated
    with a 3.1% decrease in the expected number of publications. For the 7-point UND
    scale, the increase in the expected number of publications for each 1-point increase
    is about 7.2%.


    Note that the deviance is almost twice as large as the degrees of freedom in Output
    9.3. It’s probably not appropriate to calculate a p-value for this statistic because
    the predicted number of articles is quite small for many of the biochemists. As
    we saw in fitting logistic regression models with individual level data, when
    predicted values are small, the deviance is not well approximated by a chi-square
    distribution. Nevertheless, the large ratio of deviance to degrees of freedom
    does suggest a problem with the model, one that we’ll pursue in the next section.
    The problem is even more severe in Output 9.4 for citation counts, where the deviance
    is more than seven times the degrees of freedom. In this regression, all the variables
    are highly significant. Older students at agricultural schools have lower average
    citation counts, while married students at prestigious institutions and from selective
    undergraduate institutions have higher average citation counts. More precisely,
    the expected citation count for those in agricultural schools is 36% lower than
    for those in medical schools (calculated as 100(exp(-.4469)-1)=-36). Married students
    have citation counts that are 100(exp(.29)-1)=34% higher, on average, than those
    for unmarried students. Before we take these results too seriously, however, we
    need to consider the problem of overdispersion, exemplified by the large deviance
    relative to the degrees of freedom.


