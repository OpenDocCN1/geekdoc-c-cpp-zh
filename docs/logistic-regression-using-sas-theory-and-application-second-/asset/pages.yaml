    What can you do about complete or quasi-complete separation? The first task is
    to figure out which variable (or variables) is causing the problem. As we’ve seen,
    they’re likely to be the variables with large coefficients and even larger standard
    errors. To be sure of which variables are causing the problem, you should delete
    individual variables or sets of'
