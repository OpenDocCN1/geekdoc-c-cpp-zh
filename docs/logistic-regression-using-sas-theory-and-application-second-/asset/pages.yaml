  md: 'so that we only get a single set of coefficients. That’s the essential idea
    of the continuation ratio model.


    Let’s formalize the model for $J$ categories on the dependent variable. As usual
    we assume that the categories are ordered in the sequence $j=1,\ldots,J$. Let
    $y_i$ be the dependent variable that can take on one of these $J$ values. Define
    $A_{ij}$ as the probability that individual $i$ advances to stage $j+1$, given
    that he made it to stage $j$. More formally,


    $$A_{ij}=\Pr(y_i>j\mid y_i\ge j).$$


    We then specify $J-1$ logit equations,


    $$\log\left(\frac{A_{ij}}{1-A_{ij}}\right)=\alpha_j+\boldsymbol{\beta}\mathbf{x}_i\qquad
    j=1,\ldots,J-1 \tag{6.8}$$


    where $\boldsymbol{\beta}\mathbf{x}_i=\beta_1x_{i1}+\ldots+\beta_kx_{ik}$. Again,
    the right-hand side of equation (6.8) is just like the cumulative logit model
    and the adjacent categories model, with a separate intercept for each stage but
    a single set of coefficients. The left-hand side can also be rewritten in terms
    of the original probabilities, $p_{ij}$:


    $$\log\left(\frac{A_{ij}}{1-A_{ij}}\right)=\log\left[\frac{\displaystyle\sum_{m=j+1}^{J}p_{im}}{p_{ij}}\right]$$


    How can this model be estimated? Surprisingly, we can do it with an ordinary binary
    logit procedure. The trick is in the construction of the data set. Again, imagine
    doing a sequence of binary logit analyses. For each stage, you construct a data
    set that excludes all individuals who didn’t make it to that stage, with a dummy
    dependent variable indicating whether or not the individual advanced to the next
    stage. Now, instead of doing separate analyses, we combine these data sets into
    a single set, including a variable indicating which stage the data came from.
    Finally, we estimate a single binary logit model on the combined data.


    Here’s how to do it for the data in Table 6.2. First, we read in the data as a
    contingency table, with each record corresponding to one of the cells. (To save
    space, two records are placed on each data line, which is accommodated by the
    @@ on the INPUT statement).'
