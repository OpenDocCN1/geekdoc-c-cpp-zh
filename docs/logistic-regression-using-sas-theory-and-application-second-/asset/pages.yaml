  md: "unemployed persons was $p_u$ and the sampling fraction for employed persons\
    \ was $p_e$. Then, the corrected intercept is $b_o - \\log(p_u/p_e)$.\n\nThe other\
    \ application of sampling on the dependent variable is the case-control study,\
    \ widely used in the biomedical sciences (Breslow and Day 1980) but occasionally\
    \ found in the social sciences as well. Here’s how it works. You want to study\
    \ the determinants of some rare disease. By surveying doctors and hospitals, you\
    \ manage to identify all 75 persons diagnosed with that disease (the cases) in\
    \ your metropolitan area. To get a comparison group, you recruit a 1 percent simple\
    \ random sample of healthy persons in the general population of the metropolitan\
    \ area (the controls). You pool the cases and the controls into a single sample\
    \ and do a logistic regression predicting case vs. control, based on various background\
    \ characteristics. If done correctly, this should yield approximately unbiased\
    \ estimates of the population logistic regression coefficients. Often the controls\
    \ are matched to the cases on one or more criteria, but that’s not an essential\
    \ feature of the design. In Chapter 8, we’ll see how to analyze matched case-control\
    \ data.\n\n# 3.14 Plotting Effects of Predictor Variables\n\nBecause of the inherent\
    \ nonlinearity of the logistic regression model, it’s often difficult to visualize\
    \ the effect of a predictor variable on the probability of an event. The EFFECTPLOT\
    \ statement provides an elegant solution to that problem. It’s particularly useful\
    \ in examining interaction effects and polynomial functions.\n\nI will use the\
    \ academic promotion data of Section 3.12 to illustrate some of the many graphs\
    \ that can be produced by the EFFECTPLOT statement. Let’s begin with a model that\
    \ contains no interactions or polynomial functions:\n\n```\nPROC LOGISTIC DATA=promo;\n\
    \    MODEL promo(EVENT='1') = female dur select arts;\n    EFFECTPLOT FIT(X=arts);\n\
    run;\n```\n\nThe EFFECTPLOT statement requests a plot of the predicted probabilities\
    \ of promotion as a function of ARTS (number of published articles), while setting\
    \ all the other variables at their mean values. If there were any CLASS variables\
    \ in the model, they would be set to their reference levels."
