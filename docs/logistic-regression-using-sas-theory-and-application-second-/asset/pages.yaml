  md: "```\n```sas\nPROC LOGISTIC DATA=wallet;\n    MODEL wallet = male business punish\
    \ explain / LINK=GLOGIT\n        AGGREGATE SCALE=NONE;\n    OUTPUT OUT=predicted\
    \ PREDPROBS=I;\nRUN;\n```\n```\n\nI’ll discuss the OUTPUT statement in a moment.\
    \ The deviance and Pearson chi-square statistics, shown in Output 5.2, have very\
    \ high *p*-values, suggesting that the model fits the data well.\n\n# Output 5.2\
    \  Goodness-of-Fit Statistics for Multinomial Logit Model\n\n| Criterion | Value\
    \ | DF | Value/DF | Pr > ChiSq |\n|---|---:|---:|---:|---:|\n| Deviance | 31.9450\
    \ | 36 | 0.8874 | 0.6619 |\n| Pearson | 26.4726 | 36 | 0.7353 | 0.8770 |\n\n**Deviance\
    \ and Pearson Goodness-of-Fit Statistics**\n\n**Number of unique profiles: 23**\n\
    \nNotice that there are 23 “unique profiles,” which is the number of unique combinations\
    \ of the values of the predictor variables. With 195 total cases, we have an average\
    \ of 8.5 cases per profile, which is reassuring. These tests tend to produce inaccurate\
    \ *p*-values when the number of cases per profile gets too small. But to really\
    \ evaluate the accuracy of these *p*-values, we need to examine the expected frequencies\
    \ in each cell of the multiway contingency table.\n\nThat’s where the OUTPUT statement\
    \ comes in. It produces a data set (named PREDICTED) containing the predicted\
    \ probabilities of being in each category of the dependent variable. The data\
    \ set has one record for each of the 195 cases. The PREDPROBS=I option requests\
    \ that three new variables be generated: IP_1 is the predicted probability of\
    \ being in category 1, IP_2 is the predicted probability of being in category\
    \ 2, and IP_3 is the predicted probability of being in category 3. If we sum these\
    \ predicted probabilities within each profile, we get the expected frequencies.\
    \ We can accomplish that with PROC TABULATE. Here’s the code:\n\n```\n```sas\n\
    PROC TABULATE DATA=predicted;\n    CLASS male business punish explain;\n    VAR\
    \ IP_1 IP_2 IP_3;\n    TABLE male*business*punish*explain, IP_1 IP_2 IP_3;\nRUN;\n\
    ```\n```"
