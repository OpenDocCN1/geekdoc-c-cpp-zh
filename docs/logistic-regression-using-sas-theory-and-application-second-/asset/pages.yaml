  md: '# 3.11 Probit and Complementary Log-Log Models


    The logistic model is not the only model appropriate for binary dependent variables.
    PROC LOGISTIC can also estimate two other widely used models, the probit model
    and the complementary log-log model. In this section, I’ll briefly discuss each
    of these models, with an emphasis on how they compare with the logistic model.


    The latent variable model we examined in the last section should help to motivate
    these models. The equation for the continuous latent variable z was


    z = α₀ + α₁x₁ + α₂x₂ + ... + αₖxₖ + σε


    The observed variable y was equal to 1 or 0 depending on whether z was above or
    below some threshold value μ. We saw that if ε has a standard logistic distribution,
    the dependence of y on the x’s is given by a logit model. Now suppose that ε has
    a standard normal distribution. That implies that y depends on the x’s by way
    of a probit model. And if ε has a standard extreme-value distribution (also known
    as a Gumbel or double-exponential distribution), we get the complementary log-log
    model.


    Now for the details. Both models can be seen as ways of transforming a probability
    into something that has no upper or lower bound. The probit model is often written
    as


    Φ⁻¹(pᵢ) = β₀ + β₁xᵢ₁ + β₂xᵢ₂ + ... + βₖxᵢₖ , (3.16)


    where pᵢ is the probability that yᵢ=1 and Φ⁻¹(pᵢ) is the inverse of the cumulative
    distribution function of a standard normal variable. This function is called the
    probit function.


    Obviously, the probit function needs a little explanation. Recall that a standard
    normal variable has a normal distribution with a mean of 0 and a standard deviation
    of 1. Like every random variable, a standard normal variable has a cumulative
    distribution function (c.d.f.). For every possible value of the variable, the
    c.d.f. gives the probability that the variable is less than that value. For example,
    the probability that a standard normal variable is less than 1.96 is .975. You’ve
    certainly encountered the standard normal c.d.f. before—the “normal table” in
    the back of every introductory statistics text is either the standard normal c.d.f.
    or some simple variation on that function.


    The inverse of the c.d.f. simply reverses this function. For a given probability
    of .90, the inverse of the c.d.f. tells you which standard normal value corresponds
    to a probability of .90, such that the probability of getting a number below that
    value is .90. In this case, the'
