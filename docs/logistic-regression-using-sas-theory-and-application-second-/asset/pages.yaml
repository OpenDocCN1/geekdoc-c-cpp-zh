- pgno: 73
  md: 'Deviance = 2 Σ_j O_j log(O_j / E_j) (3.8)


    where O_j is the observed frequency and E_j is the expected frequency in cell
    j. In this example, the sum is taken over all 38 cells (19 profiles by 2 categories
    of the dependent variable). The 15 degrees of freedom come from the 19 profiles
    minus the 4 estimated parameters in the model.


    What is this statistic testing? As noted earlier, the deviance is implicitly contrasting
    the fitted model with a saturated model. Here the saturated model has one parameter
    for each of the 19 profiles, not one parameter for each of the 147 cases. We could
    fit the saturated model by using the following program:


    ```

    PROC LOGISTIC DATA=penalty;

    CLASS culp;

    MODEL death(EVENT=''1'') = blackd whitvic culp blackd*whitvic blackd*culp whitvic*culp
    blackd*whitvic*culp ;

    RUN;

    ```


    The MODEL statement could also be abbreviated:


    ```

    MODEL death(EVENT=''1'') = blackd|whitvic|culp;

    ```


    The saturated model treats CULP as a categorical variable and includes all possible
    interactions among the explanatory variables. If we take the positive difference
    between the -2 log L for this model and the -2 log L for the model with only main
    effects and with CULP treated as a quantitative variable, we would get the deviance
    shown in Output 3.13. Hence, that deviance can be interpreted as a test of the
    null hypothesis that (a) the effect of CULP is linear and (b) all the interactions
    among the three explanatory variables are 0. It is not testing whether the inclusion
    of other variables could improve the fit.


    What about the Pearson chi-square? It’s an alternative test of the same null hypothesis,
    calculated by the following well-known formula:


    X² = Σ_j (O_j - E_j)² / E_j (3.9)


    As with the deviance, Pearson’s chi-square does not have a chi-square distribution
    when applied to individual-level data.


    While the SCALE and AGGREGATE options are often useful, they don’t help if there
    are many explanatory variables or if some of them are measured on a continuum—'
