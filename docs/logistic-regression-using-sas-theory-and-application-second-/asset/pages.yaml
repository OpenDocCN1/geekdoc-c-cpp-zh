- pgno: 89
  md: '# 3.9 Predicted Values, Residuals, and Influence Statistics


    Next, we turn to diagnostic statistics that are computed for each individual observation.
    PROC LOGISTIC can produce a large number of case-wise statistics with the OUTPUT
    statement, which writes selected diagnostic statistics to a SAS data set. Here
    are some of the statistics that can be selected:


    +   - **Linear predictor**—Predicted log-odds for each case. In matrix notation,
    this is xβ, so it’s commonly referred to as XBETA.

    +   - **Standard error of linear predictor**—Used in generating confidence intervals.

    +   - **Predicted values**—Predicted probability of the event, based on the estimated
    model and values of the explanatory variables. For grouped data, this is the expected
    number of events.

    +   - **Confidence intervals for predicted values**—Confidence intervals are first
    calculated for the linear predictor by adding and subtracting an appropriate multiple
    of the standard error. Then, to get confidence intervals around the predicted
    values, the upper and lower bounds on the linear predictor are substituted into
    1/(1+ e^(-x)), where x is either an upper or a lower bound.

    +   - **Deviance residuals**—Contribution of each observation to the deviance
    chi-square.

    +   - **Pearson residuals**—Contribution of each observation to the Pearson chi-square.


    For the last two statistics, standardized versions are available in SAS 9.3 and
    later.


    Obviously, the residuals may be useful in determining which observations are poorly
    fit by the model. But since the dependent variable can only take on values of
    0 or 1, the utility of residuals is somewhat limited. A high residual would mean
    that the individual had the event, even though the predicted probability of the
    event was low. But we know that low probability events do happen sometimes, so
    this doesn’t necessarily mean a failure of the model, or that something is amiss
    with that individual. For example, using the model for the death penalty data
    with CULP, WHITVIC, and BLACKD as predictors, person 10 had both the largest deviance
    residual (-2.38) and the largest Pearson residual (-4.00). That person did not
    get the death penalty even though his predicted probability was .95.


    The OUTPUT statement can also produce several statistics that are designed to
    measure the influence of each observation. Basically, influence statistics tell
    you how much'
  merge: -1
  img_proc: true
- pgno: 90
  md: "some feature of the model changes when a particular observation is deleted\
    \ from the data set. For linear models estimated with PROC REG, influence statistics\
    \ are exact. Exact computations in logistic models would be very intensive, however,\
    \ so only approximations are used. The available influence statistics in LOGISTIC\
    \ are\n\n+   - **DFBETAS**—These statistics tell you how much each regression\
    \ coefficient changes when a particular observation is deleted. The actual change\
    \ is divided by the standard error of the coefficient.\n\n+   - **DIFDEV**—Change\
    \ in deviance with deletion of the observation.\n\n+   - **DIFCHISQ**—Change in\
    \ Pearson chi-square with deletion of the observation.\n\n+   - **C and CBAR**—Measures\
    \ of overall change in regression coefficients, analogous to Cook’s distance in\
    \ linear regression.\n\n+   - **LEVERAGE**—Measures how extreme the observation\
    \ is in the space of the explanatory variables. The leverage is the diagonal of\
    \ the “hat” matrix.\n\nYou can get any of these statistics by specifying the appropriate\
    \ option on the OUTPUT statement. But you may find it more informative to request\
    \ ODS graphics using the PLOTS option on the PROC statement. The many plots produced\
    \ by this option come in three varieties that differ according to which variable\
    \ is plotted on the horizontal axis. For INFLUENCE and DFBETAS plots, the horizontal\
    \ axis is just the case number. For PHAT and DPC plots, the horizontal axis is\
    \ the predicted probability. For LEVERAGE plots, the horizontal axis is the leverage.\
    \ Here’s an example:\n\n```\nPROC LOGISTIC DATA=penalty PLOTS(UNPACK LABEL)=\n\
    \    (INFLUENCE DFBETAS PHAT DPC LEVERAGE);\n    MODEL death(EVENT='1')=blackd\
    \ whitvic culp ;\nRUN;\n```\n\nThis program produces a total of 17 plots, only\
    \ a few of which will be shown here. The UNPACK option produces a separate graph\
    \ for each plot, rather than “paneling” several of them into a single graphic.\
    \ The LABEL option requests that the case number be used as the data point marker\
    \ in each graph, making it easier to identify which cases are problematic.\n\n\
    Output 3.23 displays one of the seven plots produced by the INFLUENCE option,\
    \ the change in deviance that would result from the deletion of each of the observations.\
    \ We see that the largest changes come from observations 10 and 122. Person 10\
    \ is the same one that we identified above as having one of the largest deviance\
    \ and Pearson residuals."
