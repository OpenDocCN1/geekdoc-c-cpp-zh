- pgno: 223
  md: '# Output 7.14 A Nested Logit Model with PROC MDC


    | Parameter | DF | Estimate | Standard Error | t Value | Approx Pr > |t| |

    |---|---:|---:|---:|---:|---:|

    | TTME_L1 | 1 | -0.0748 | 0.0101 | -7.39 | <.0001 |

    | TIME_L1 | 1 | -0.003952 | 0.000719 | -5.50 | <.0001 |

    | COST_L1 | 1 | -0.004363 | 0.005341 | -0.82 | 0.4140 |

    | INC_L2G1C1 | 1 | 0.5601 | 0.1695 | 3.30 | 0.0010 |

    | INC_L2G1C2 | 1 | 1.3043 | 0.3507 | 3.72 | 0.0002 |


    The two additional parameters allow for within-group correlations. Ideally, these
    parameters will be between 0 and 1, with 1 implying no correlation and 0 implying
    the highest correlation. When both parameters are equal to 1, the model reduces
    to the conditional logit model. The *t*-statistics for these parameters are not
    very helpful since they are tests of whether the parameters are equal to 0. What
    we really want are tests that the parameters are equal to 1. For INC_L2G1C1, which
    refers to the public transportation group, a 95 percent confidence interval does
    not include 1, which is evidence that there is a within-group correlation. The
    INC_L2G1C2 estimate is greater than 1, which is not consistent with the assumptions
    of the nested logit model. On the other hand, a 95 percent confidence interval
    easily includes 1, so the problematic estimate could certainly be attributable
    to sampling error.


    Since the conditional logit model is a special case of the nested logit model,
    we can compare them by way of a likelihood ratio test. The log-likelihood for
    the nested model is -219.38 while the log-likelihood for the conditional model
    is -246.86. Twice the positive difference gives a chi-square of 54.96 with 2 d.f.
    (for the two additional parameters), which is highly significant. So we can reject
    the conditional model in favor of the nested model, which allows for departures
    from the IIA assumption. Also, the BIC (Schwartz) criterion for the nested model
    is 460, which is a better fit than the HEV model (BIC=483).


    The nested logit model can get a lot more complicated, with multiple levels of
    nesting and predictors that describe different levels. A word of warning, however:
    Silberhorn et al. (2008) pointed out that there are actually two different versions
    of the nested logit model: the utility maximization nested logit and the non-normalized
    nested logit. PROC'
  merge: -1
  img_proc: true
