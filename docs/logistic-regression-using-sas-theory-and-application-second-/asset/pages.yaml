- pgno: 215
  md: "where y_ij is the probability that judge i chooses case j, and x_j is a vector\
    \ of characteristics describing case j. After removing the chosen case from the\
    \ option set, each judge then chooses the most serious case from among the remaining\
    \ 14. Again, the choice is governed by the conditional logit model, except that\
    \ now there are only 14 terms in the denominator. This process continues until\
    \ the last choice is made from among the two that are left. The likelihood for\
    \ each judge’s set of rankings is formed as the product of all the terms that\
    \ are like the one in equation (7.3). And the overall likelihood is just the product\
    \ of all the judges’ likelihoods. Although the model can be derived in other ways\
    \ that do not assume sequential choices, this is certainly the most intuitive\
    \ way to think about it.\n\nHow can we estimate this model? It turns out that\
    \ the likelihood function I just described is identical to the likelihood function\
    \ for a stratified Cox regression analysis. So we can use PROC PHREG (which does\
    \ Cox regression) with the dependent variable consisting of ranks (1 through 15).\
    \ For the penalty trial data, I constructed a data set in which each of 736 records\
    \ corresponded to a ranking of one murder case by one judge. The data included\
    \ characteristics of each case and an ID number for the judge. To do the analysis\
    \ I used the following program:\n\n```\nPROC PHREG DATA=judgernk NOSUMMARY;\n\
    \    MODEL rank=blackd whitvic death / TIES=DISCRETE;\n    STRATA judgid;\nRUN;\n\
    ```\n\nThe NOSUMMARY option suppresses a large quantity of output that is irrelevant\
    \ to this application. If every judge had given unique ranks to all cases, the\
    \ TIES=DISCRETE option would be unnecessary. But in quite a few cases, a judge\
    \ assigned tied ranks to several of the cases being ranked. Fortunately, PHREG\
    \ is one of the few Cox regression programs that can handle tied ranks in an appropriate\
    \ manner. Results are shown in Output 7.9. The column labeled “Hazard Ratio” should\
    \ actually be interpreted as an odds ratio."
  merge: -1
  img_proc: true
