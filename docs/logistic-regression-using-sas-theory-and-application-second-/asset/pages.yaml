- pgno: 43
  md: 'As can be seen in the “Type 3 Analysis of Effects” table in Output 2.7, this
    alternative coding has no effect on the overall test for CULP. And skipping down
    to the “Odds Ratio Effects” table, it also has no effect here either. Just as
    when we use PARAM=REF, each odds ratio compares a particular category with category
    5. But there are certainly major changes in the CULP coefficients reported in
    the “Analysis of Maximum Likelihood Estimates” table, along with their standard
    errors and p-values. What’s important to understand is that these coefficients
    are not comparisons between each of the first four values of CULP and value 5.
    Rather they are comparisons between each category of CULP and the overall average
    (roughly speaking) of the log-odds of getting the death penalty, adjusting for
    other variables in the model. Thus, if you are in category 1 of CULP, your log-odds
    of getting the death penalty is 2.9046 below average. If you are in category 4,
    your log-odds is 1.6014 above average.


    What about category 5? How does it differ from the average? To get that value,
    you must add together the coefficients for values 1 through 4 and then change
    the sign. That ensures that all five coefficients sum to zero. You could do that
    by hand calculation, but it’s a lot easier to let SAS do it with the ESTIMATE
    statement:


    ```

    ESTIMATE ''coeff for 5'' culp -1 -1 -1 -1;

    ```


    This says to take the four coefficients for CULP, multiply each by -1, and then
    add them together. Results are shown in Output 2.8. We see that those with value
    5 of CULP have a death penalty log-odds that is 1.9624 higher than average. We
    also get a standard error and a z-test of the null hypothesis that this effect
    is 0.


    # Output 2.8 Results from ESTIMATE Statement


    |  | Estimate |  |  |  |

    |---|---|---|---|---|

    | Label | Estimate | Standard Error | z Value | Pr > |z| |

    | coeff for 5 | 1.9624 | 0.5264 | 3.73 | 0.0002 |


    Some people like this approach to creating design variables, but I’m not a fan.
    I prefer comparisons with an explicit reference category. PROC LOGISTIC also offers
    several other methods for creating design variables, including ordinal, polynomial,
    and orthogonalized versions of all the methods.'
  merge: -1
  img_proc: true
- pgno: 44
  md: "# 2.10 Multiplicative Terms in the MODEL Statement\n\nRegression analysts often\
    \ want to build models that have *interactions* in which the effect of one variable\
    \ depends on the level of another variable. The most popular way of doing this\
    \ is to include a new explanatory variable in the model, one that is the product\
    \ of the two original variables. With PROC LOGISTIC, rather than creating a new\
    \ variable in a DATA step, you can specify the product directly in the MODEL statement.\
    \ For example, some criminologists have argued that black defendants who kill\
    \ white victims may be especially likely to receive a death sentence. We can test\
    \ that hypothesis for the New Jersey data with this program:\n\n```\nPROC LOGISTIC\
    \ DATA=penalty;\n  MODEL death(EVENT='1') = blackd whitvic culp blackd*whitvic;\n\
    RUN;\n```\n\nThis produces the table in Output 2.9.\n\n# Output 2.9 Multiplicative\
    \ Variables in PROC LOGISTIC\n\n| Analysis of Maximum Likelihood Estimates |\n\
    | Parameter | DF | Estimate | Standard Error | Wald Chi-Square | Pr > ChiSq |\n\
    | Intercept | 1 | -5.4042 | 1.1626 | 21.6066 | <.0001 |\n| blackd | 1 | 1.8720\
    \ | 1.0463 | 3.2013 | 0.0736 |\n| whitvic | 1 | 1.0725 | 0.9877 | 1.1790 | 0.2776\
    \ |\n| culp | 1 | 1.2703 | 0.1967 | 41.6883 | <.0001 |\n| blackd*whitvic | 1 |\
    \ -0.3272 | 1.1781 | 0.0771 | 0.7812 |\n\nWith a *p*-value of .78, the product\
    \ term is clearly not significant and can be excluded from the model. The MODEL\
    \ statement also has a short-hand notation that allows you specify both the interaction\
    \ and the two main effects:\n\n```\nMODEL death(EVENT='1') = culp blackd|whitvic;\n\
    ```\n\nThe product syntax in LOGISTIC also makes it easy to construct polynomial\
    \ functions. For example, to estimate a *cubic* equation you can specify a model\
    \ of the form\n\n```\nMODEL y = x x*x x*x*x;\n```"
  merge: -1
  img_proc: true
