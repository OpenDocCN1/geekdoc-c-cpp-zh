    0  0  1  11\n0  1  0  0\n0  0  0  0\n;\n```\n\nWe can estimate the logit model\
    \ directly with\n\n```\nPROC GENMOD DATA=zero DESC;\n    FREQ f;\n    MODEL y\
    \ = x z / D=B AGGREGATE;\nRUN;\n```\n\nThe AGGREGATE option requests the deviance\
    \ and Pearson chi-squares. This program produces the results in Output 10.11.\
