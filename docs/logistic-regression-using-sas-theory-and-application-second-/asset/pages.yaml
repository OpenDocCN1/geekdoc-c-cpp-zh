    | Criterion | Value | DF | Value/DF | Pr > ChiSq |\n| Deviance | 10.0834 | 15\
    \ | 0.6722 | 0.8145 |\n| Pearson | 8.4674 | 15 | 0.5645 | 0.9037 |\n\nHow is this\
    \ deviance calculated? Under the AGGREGATE option, LOGISTIC forms the cross-classification\
