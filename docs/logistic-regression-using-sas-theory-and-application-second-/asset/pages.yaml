  img_proc: true
- pgno: 31
  md: 'function multiplied by −2. We’ll see how this number is obtained in Chapter
    3. Higher values of -2 Log L mean a worse fit to the data. But keep in mind that
    the overall magnitude of this statistic is heavily dependent on the number of
    observations. Furthermore, there is no absolute standard for what’s a good fit,
    so one can only use this statistic to compare different models fit to the same
    data set.


    The problem with -2 Log L is that models with more covariates tend to fit better
    by chance alone. The other two fit statistics avoid this problem by penalizing
    models that have more covariates. Akaike’s Information Criterion (AIC) is calculated
    as


    $AIC = -2 \log L + 2k$


    where $k$ is the number of parameters (including the intercept). So, in this example,
    there are four parameters, which adds 8 to the -2 Log L.


    The Schwarz Criterion (SC), also known as the Bayesian Information Criterion (BIC),
    gives a more severe penalization for additional parameters:


    $SC = -2 \log L + k \log n$


    where $n$ is the sample size. In this example, $n = 147$ and $\log n = 4.99$.
    So, to get the SC value, we add 4 times 4.99 = 19.96 to the -2 Log L.


    Both of the penalized statistics can be used to compare models with different
    sets of covariates. The models being compared do not have to be nested in the
    sense of one model being a special case of another. However, these statistics
    cannot be used to construct a formal hypothesis test, so the comparison is only
    informal.


    The next table is “Testing Global Null Hypothesis: BETA=0.” Within this table
    there are three chi-square statistics with values of 12.206, 11.656, and 10.8211.
    All three statistics are testing the same null hypothesis—that all the explanatory
    variables have coefficients of 0. (In a linear regression, this hypothesis is
    usually tested by means of an overall $F$-test.) The three degrees of freedom
    for each statistic correspond to the three coefficients for the independent variables.
    In this case, the associated $p$-values are around .01, so we can reject the null
    hypothesis and conclude that at least one of the coefficients is not 0.'
