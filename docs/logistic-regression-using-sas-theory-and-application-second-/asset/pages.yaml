    \ But I’ll also show how to estimate more general models using PROC PHREG and\
    \ PROC MDC.\n\n# 7.2 Chocolate Example\n\nThe discrete choice model has often\
    \ been used in studies of consumer preference. Consider the following experiment\
    \ (SAS Institute 1995). Ten people were each given eight chocolate bars with varying\
    \ characteristics. After eating the bars, they were asked to choose the one they\
