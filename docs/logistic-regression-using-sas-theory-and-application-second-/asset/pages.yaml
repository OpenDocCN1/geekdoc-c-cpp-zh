    # 8.4 GEE Estimation with PROC GENMOD


    Robust standard errors solve the biggest problem that arises from repeated observations
    on the same individual. But the coefficient estimates are still not efficient,
    which implies that their true standard errors are higher than they need to be.
    In principle, one ought to be able to get better estimates, in the sense of having
    less sampling variability. One way to accomplish this is the method of generalized
    estimating equations (Diggle et al. 1994).


    Here’s a brief, nontechnical explanation of this method. In ordinary logistic
    regression, the maximum likelihood estimates can be obtained by an algorithm known
    as iteratively reweighted least squares. What that means is that each step in
    the algorithm is accomplished by weighted least squares, with both the weights
    and the constructed dependent variable changing at each iteration as functions
    of the results at the last iteration. In the matrix formulation of weighted least
    squares, there is an N ×N weight matrix W, which has off-diagonal elements equal
    to 0 and diagonal elements equal to p_i(1−p_i), where p_i is the predicted probability
    from the previous iteration. The GEE algorithm extends this approach to do iterative
    generalized least squares. In this method, the matrix W has nonzero off-diagonal
    elements that are functions of the correlations among the observations. These
    correlations are re-estimated at each iteration based on correlations among the
    Pearson residuals.'
  merge: -1
  img_proc: true
