    The first table in Output 3.9 gives *p*-values for “Conditional Exact Tests.”
    These tests are conditional in the sense that they are based on the conditional
    distribution of the sufficient statistic for each parameter, conditioning on the
    sufficient statistics for all the other parameters. (The sufficient statistics
    are the sums of cross products for each *x* and the binary dependent variable
    *y*.) The tests are exact in the same sense that *t*-statistics are exact in normal-theory
    linear regression. That is, they are not large sample approximations, and they
    give the correct probability of getting a result that is at least as extreme as
    the one observed in the sample, under the null hypothesis that a variable has
    no effect. However, there are different ways of defining what is extreme or not
    extreme. Because of this, we see four different *p*-values reported for each variable
    (or for each set of design variables in the case of CLASS variables like CULP).
    We get a “score” test and a “probability” test. And for each of these, we get
    an “exact” value and a “mid” value. The score test is generally preferred over
    the probability test because it is more robust to skewness in the distribution
    of the sufficient statistics. “Mid” is short for “mid-p”. It’s a correction that
    is designed to make the test less'
