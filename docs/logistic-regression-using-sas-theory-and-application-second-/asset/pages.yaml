  md: 'choice of category, then the discrete-choice model of Chapter 7 is probably
    what you need. In this chapter we consider models for unordered categories where
    the predictor variables are characteristics of the individual, and possibly the
    individual’s environment. For example, we could estimate a model predicting party
    choice of newly registered voters based on information about the voter’s age,
    income, and years of schooling. We might also include information about the precinct
    in which the voter is registering.


    The model is called the multinomial logit model because the probability distribution
    for the outcome variable is assumed to be a multinomial rather than a binomial
    distribution. In SAS documentation, it’s often referred to as the generalized
    logit model. Because the multinomial logit model can be rather complicated to
    interpret when the outcome variable has many categories, I’ll begin with the relatively
    simple case of a three-category outcome.


    # 5.2 Example


    As in the binomial case, let’s start with a real example. Several years ago, I
    did a survey of 195 undergraduates at the University of Pennsylvania in order
    to study the effects of parenting styles on altruistic behavior. One of the questions
    was, “If you found a wallet on the street, would you (1) keep the wallet and the
    money, (2) keep the money and return the wallet, or (3) return both the wallet
    and the money.” The distribution of responses for the WALLET variable was


    | Value | Frequency | |

    |---|---|---|

    | 1 | 24 | keep both |

    | 2 | 50 | keep the money |

    | 3 | 121 | return both |


    Possible explanatory variables are


    +   MALE 1= male, 0 = female

    +   BUSINESS 1=enrolled in business school, 0=otherwise

    +   PUNISH A variable describing whether the student was physically punished by
    parents at various ages:

    +   1 = punished in elementary school but not middle or high school

    +   2 = punished in elementary and middle school but not high school

    +   3 = punished at all three levels'
