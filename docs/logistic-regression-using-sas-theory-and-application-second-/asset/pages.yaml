- pgno: 97
  md: '```

    $$\beta_0 = \frac{\alpha_0-\mu}{\sigma}$$


    $$\beta_j = \frac{\alpha_j}{\sigma}, \qquad j=1,\ldots,k.$$

    ```


    Because we don’t know what $\sigma$ is and have no way of estimating it, we can’t
    directly estimate the $\alpha$’s. But since $\beta_j=0$ implies $\alpha_j=0$ (except
    for the intercept), testing whether the $\beta$ coefficients are 0 is equivalent
    to testing whether the $\alpha$ coefficients are 0. So the usual chi-square tests
    apply equally to the manifest (3.13) and latent versions (3.11) of the model.


    That brings us to standardized coefficients. These can be requested with the STB
    option on the MODEL statement of PROC LOGISTIC. Standardized coefficients are
    designed to measure the relative importance of the explanatory variables in a
    regression model. In both linear and logistic regression, ordinary coefficients
    cannot generally be compared across different variables because the coefficients
    depend directly on the metrics in which the variables are measured. If $x$ is
    measured in years, for example, its coefficient will be 12 times as large as if
    it were measured in months.


