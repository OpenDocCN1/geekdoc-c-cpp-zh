    different from 0.


    By default, the standard errors reported by GLIMMIX are model-based rather than
    robust. This means that they are based on the exchangeability assumption, an assumption
    that is not easily relaxed in the mixed model framework. It’s easy to switch to
    robust standard errors, however, by putting the option EMPIRICAL on the PROC statement.
    That’s generally a good idea unless the sample size is small. (For smaller samples,
    the empirical standard errors can be somewhat improved by specifying EMPIRICAL=MBN.)
    For this example, switching to robust standard errors made very little difference.


    # 8.6  Fixed-Effects with Conditional Logistic Regression


    Although GEE and mixed models are wonderful tools, they don’t correct for bias
    resulting from omitted explanatory variables at the cluster level. To be more
    specific, when you have multiple observations per person—as in the PTSD example—it
    is possible to statistically'
