- pgno: 196
  md: 'There are several other points worth noting about the continuation ratio method.
    First, you may have observed that in the combined data set, the same people may
    appear more than once. For the education example, everyone who had some high school
    contributed two observations to the combined data set. Usually this raises red
    flags because of possible dependence among the multiple observations. While there
    isn’t space here to go into the details, there is absolutely no problem of dependence.
    For each individual, the probability of a particular outcome is factored into
    a set of conditional probabilities that have the same structure as independent
    observations.


    Second, the continuation ratio approach is closely related to discrete-time methods
    for survival analysis. In that setting, the aim is to model the length of time
    until some event occurs, and time is measured in discrete units like years. Each
    year is treated as a stage and “advancement” means getting to the next year without
    experiencing the event. For further details, see Chapter 7 of my book, *Survival
    Analysis Using SAS: A Practical Guide, Second Edition* (2010).


    Third, just as there are cumulative probit and cumulative complementary log-log
    models, one can easily estimate continuation ratio models using the probit or
    complementary log-log functions. The complementary log-log model is particularly
    attractive for event history applications because it is the discrete-time equivalent
    of the proportional hazards model used in Cox regression. I’ll close this chapter
    with a statistical curiosity: the complementary log-log continuation ratio model
    is mathematically equivalent to the cumulative complementary log-log model (McCullagh
    1980).'
  merge: -1
  img_proc: true
