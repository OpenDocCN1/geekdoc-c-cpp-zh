    \ two categories j and k of the dependent variable can be obtained from\n\nlog(p_ij\
    \ / p_ik) = (β_j - β_k) x_i .\n\n# 5.7 Contingency Table Analysis\n\nAs with binary\
    \ logit analysis, the multinomial logit model can be easily applied to the analysis\
    \ of contingency tables. Consider Table 5.3, which was tabulated from the 1991\
    \ General Social Survey (Agresti 2002).\n\nTable 5.3 Belief in an Afterlife, by\
