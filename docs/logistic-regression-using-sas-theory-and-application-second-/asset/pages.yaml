    # 10.6 Marginal Tables


    To understand the literature on loglinear models, it’s helpful to have some appreciation
    of *marginal tables* and their relationship to the parameters in the loglinear
    model and to the maximum likelihood estimates. A marginal table is just a contingency
    table that is obtained by summing the frequencies in some larger contingency table
    over one or more of the variables. For example, if we have a three-way table for
    variables X, Y, and Z, there are several possible marginal tables:


    +   - the X × Y table, obtained by summing over Z

    +   - the X × Z table, obtained by summing over Y

    +   - the Y × Z table, obtained by summing over X

    +   - the X table, obtained by summing over both Y and Z

    +   - the Y table, obtained by summing over both X and Z

    +   - the Z table, obtained by summing over both Y and X


    Why are these tables important? Because every term in a loglinear model has a
    corresponding marginal table. For example, to fit a saturated model for the X
    × Y × Z table in GENMOD, we specify:


    ```

    MODEL f = x y z x*y x*z y*z x*y*z / D=P;

    ```


    Each term in this model corresponds to a specific table or subtable, with the
    three-way interaction corresponding to the full three-way table. Because this
    is a saturated model, the predicted cell frequencies are identical to the observed
    cell frequencies in the full table. In the notation of Section 10.2 (with i representing
    a value of variable X, j representing a value of Y, and k representing a value
    of Z), we have m̂ijk = nij k for all i, j, and k. Clearly, this must also be true
    for any marginal table: the summed predicted frequencies will be equal to the
    summed observed frequencies.'
  merge: -1
  img_proc: true
- pgno: 326
  md: "Now consider an unsaturated model that deletes the three-way interaction:\n\
    \n```\nMODEL f = x y z x*y x*z y*z / D=P;\n```\n\nFor this model, the maximum\
    \ likelihood estimates of the expected frequencies in the three-way table will\
    \ not, in general, be equal to the observed frequencies: m̂_ijk ≠ n_ijk. However,\
    \ for all the marginal tables corresponding to the terms in the model, the summed\
    \ predicted frequencies will equal the summed observed frequencies. (The + signs\
    \ in the following subscripts indicate that the frequencies are summed over that\
    \ variable.)\n\nm̂_ij+ = n_ij+\n m̂_i+k = n_i+k\n m̂_+jk = n_+jk      for all\
    \ i, j, and k\n m̂_i++ = n_i++\n m̂_+j+ = n_+j+\n m̂_++k = n_++k\n\nYou can readily\
    \ see this with the independence model for a 2 × 2 table. Table 10.3 displays\
    \ observed and predicted frequencies for the independence model applied to Table\
    \ 10.1. Clearly, both the observed and predicted frequencies sum to the one-way\
    \ marginal totals.\n\n# Table 10.3 Observed (and Predicted) Frequencies for the\
    \ Independence Model\n\n|  | Blacks | Nonblacks | Total |\n|---|---|---|---|\n\
    | Death | 28 (24.8) | 22 (25.2) | 50 |\n| Life | 45 (48.2) | 52 (48.8) | 97 |\n\
    | Total | 73 | 74 | 147 |\n\nOne final property of marginal tables is this: the\
    \ marginal tables that correspond to the terms in the loglinear model are the\
    \ sufficient statistics for that model. That means that the maximum likelihood\
    \ estimates can be calculated using only the information in the appropriate marginal\
    \ tables. For example, in Table 10.3 the maximum likelihood estimate of the expected\
    \ frequency in each cell is obtained by multiplying the row total times the column\
    \ total and dividing by the grand total (147). The parameter estimates can then\
    \ be obtained from the estimated expected frequencies. So we only need the marginal\
    \ tables to fit the independence model. Of course, to calculate a goodness-of-fit\
    \ chi-square, we need the full table so that we can compare the expected frequencies\
    \ with the observed frequencies."
  merge: -1
  img_proc: true
- pgno: 327
  md: 'For all these reasons, the estimation of a loglinear model is often referred
    to as a process of *fitting marginal tables*. Many journal articles that report
    results of a loglinear analysis describe the fitted models by specifying the fitted
    marginal tables for each model, not by specifying the parameters included in the
    model.


    # 10.7 The Problem of Zeros


    Contingency tables sometimes have cells with frequency counts of zero. These may
    cause problems or require special treatment. There are two kinds of zeros:


    +   - *Structural zeros*: These are cells for which a nonzero count is impossible
    because of the nature of the phenomenon or the design of the study. The classic
    example is a cross-tabulation of sex by type of surgery in which structural zeros
    occur for male hysterectomies and female vasectomies.

    +   - *Random zeros*: In these cells, nonzero counts are possible (at least as
    far we know), but a zero occurs because of random variation. Random zeros are
    especially likely to arise when the sample is small and the contingency table
    has many cells.


    Structural zeros are easily accommodated with PROC GENMOD. Simply delete the structural
    zeros from the data set before estimating the model. Random zeros can be a little
    trickier. Most of the time they don’t cause any difficulty, except that the expected
    cell counts may be very small, thereby degrading the chi-square approximation
    to the deviance and Pearson’s statistic. However, more serious problems arise
    when random zeros show up in fitted marginal tables. *When a fitted marginal table
    contains a frequency count of zero, at least one ML parameter estimate is infinite
    and the fitting algorithm will not converge.* We already encountered this problem
    in Section 3.4 for the binary logit model. There, we saw that if there is a 0
    in the 2 × 2 table describing the relationship between the dependent variable
    and any dichotomous independent variable, the coefficient for that variable is
    infinite (more accurately, the ML estimate does not exist) and the algorithm will
    not converge. The identical problem arises when fitting a logit model by means
    of its equivalent loglinear model, and the potential solutions are the same. However,
    problems arise more frequently when fitting loglinear models because it’s necessary
    to fit the full marginal table describing the relationships among all the independent
    variables. As we’ve seen, loglinear models'
  merge: -1
  img_proc: true
