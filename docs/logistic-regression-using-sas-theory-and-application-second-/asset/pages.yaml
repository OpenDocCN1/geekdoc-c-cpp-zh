    | band 4 | 0 | 0.0000 | 0.0000 | 0.0000, 0.0000 | . | . |\n\nBefore concluding\
    \ our analysis, let’s consider one additional model that was not discussed in\
    \ Goodman’s article, the *quasi-uniform association model*. This model incorporates\
    \ the ordering of the occupational statuses in a very explicit manner. The conventional\
    \ uniform association model says that if the cells in the table are properly ordered,\
    \ then the odds ratio (cross-product ratio) in every 2 × 2 subtable of adjacent\
    \ cells is exactly the same. Our modification of that model is to delete the main\
