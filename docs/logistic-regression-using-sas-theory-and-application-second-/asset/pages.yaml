  md: '# Chapter 8


    # Logit Analysis of Longitudinal and Other Clustered Data


    8.1 Introduction 217


    8.2 Longitudinal Example 218


    8.3 Robust Standard Errors 222


    8.4 GEE Estimation with PROC GENMOD 226


    8.5 Mixed Models with GLIMMIX 234


    8.6 Fixed-Effects with Conditional Logistic Regression 240


    8.7 Postdoctoral Training Example 244


    8.8 Matching 250


    8.9 Comparison of Methods 259


    8.10 A Hybrid Method 260


    # 8.1 Introduction


    In previous chapters, we assumed that all observations are independent—that is,
    the outcome for each observation is completely unrelated to the outcome for every
    other observation. While that assumption is quite appropriate for most data sets,
    there are many applications where the data can be grouped into natural or imposed
    clusters with observations in the same cluster tending to be more alike than observations
    in different clusters. Longitudinal data is, perhaps, the most common example
    of clustering. If we record an individual’s responses at'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'multiple points in time, we ordinarily expect those observations to be positively
    correlated.

    But there are many other applications in which the data have a cluster structure.
    For example, husbands and wives are clustered in families, and students are clustered
    in classrooms. In studies involving matching, each match group is a cluster. And,
    of course, cluster sampling naturally produces clustered observations.


    There are several reasons why logistic regression should take clustering into
    account:


    +   - Ignoring the clustering and treating the observations as though they are
    independent usually produces standard errors that are underestimated and test
    statistics that are overestimated. All methods for dealing with clustered data
    are designed to correct this problem.

    +   - Conventional logistic regression applied to clustered data produces coefficient
    estimates that are not efficient. That means that there are, in principle, other
    methods whose coefficients have smaller true standard errors.

    +   - In addition to these problems, clustered data also presents opportunities
    to correct for biases that may occur with any application of binary regression.
    One method for clustered data can correct for heterogeneity shrinkage. Another
    method can correct for bias due to omitted explanatory variables.


    In this chapter, I’ll discuss five different methods for clustered data that can
    be implemented in SAS:


    +   - Robust standard errors with PROC GENMOD and PROC SURVEYLOGISTIC

    +   - Generalized estimating equations (GEE) with PROC GENMOD

    +   - Conditional logit (fixed-effects) models with PROC LOGISTIC

    +   - Mixed models (random effects) with PROC GLIMMIX

    +   - A hybrid method that combines fixed-effects with mixed models


    # 8.2  Longitudinal Example


    Let’s begin with an example of longitudinal data, also known as panel data. The
    sample consisted of 316 people who survived residential fires in the Philadelphia
    area (Keane et al. 1996). They were interviewed at 3 months, 6 months, and 12
    months after the fire. For each interview, the outcome variable PTSD is coded
    1 if the person had symptoms of post-traumatic stress disorder, and 0 otherwise.
    The explanatory variables measured at each interview are'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'CONTROL　　A scale of a person’s perceived control over several areas of life.

    PROBLEMS　　The total number of problems reported in several areas of life.

    SEVENT　　　The number of stressful events reported since the last interview.


    In addition, there is one variable that was measured only at the initial interview:


    COHES　　　A scale of family cohesion.


    These are only a small fraction of the variables in the original study, and they
    were chosen solely for the sake of example. We shall ignore difficult questions
    of causal ordering here and simply assume that the dependent variable PTSD does
    not have any effect on the other four variables. For the moment, we’ll also assume
    that any effects are contemporaneous so we don’t have to worry about lags and
    leads.


    Let’s formulate a simple model. Let *pᵢₜ* be the probability that person *i* had
    PTSD symptoms at time *t*. Let **xᵢₜ** be a vector of explanatory variables for
    person *i* at time *t*. This vector can contain variables that differ at each
    interview and variables that are constant over interviews. It may also contain
    dummy variables to differentiate the three different interview times. Our initial
    model is just an ordinary logistic regression model with subscripts added for
    time.


    $$\log\left(\frac{p_{it}}{1-p_{it}}\right)=\boldsymbol{\beta}\mathbf{x}_{it}.$$
    \tag{8.1}


    We’ll first estimate this model *without* any special treatment for dependence
    among the observations. To accomplish this, the data is structured with a separate
    record for each person at each of the three time points, for a total of 948 records.
    Each record contains the variables described above, with COHES duplicated across
    the three records for each person. There is also a variable TIME equal to 1, 2,
    or 3 depending on whether the interview occurred at 3, 6, or 12 months after the
    fire. Finally, there is a variable called SUBJID, which contains a unique identification
    number for each *person*. We won’t use that variable now, but it will be essential
    for the methods introduced later. The first 15 cases from the data set are shown
    in Output 8.1.'
  merge: -1
  img_proc: true
