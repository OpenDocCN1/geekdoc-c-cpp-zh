    Despite clear-cut differences in the formulation and interpretation of the cumulative
    logit model and the adjacent categories model, the two models tend to yield very
    similar conclusions in practice. I generally prefer the cumulative model, both
    for its appealing latent variable interpretation and for its ready availability
    in software. But the adjacent categories model has one advantage, at least in
    principle: it’s easy to formulate models with selective constraints on coefficients
    (although such models can’t be estimated in CATMOD). For example, we could force
    the MARRIED coefficient to be the same for all category pairs, but allow the year
    coefficients to be different. In fact, we’ll see how to do that in Chapter 10,
    when we estimate the adjacent categories model by using the equivalent loglinear
    model.


    # 6.7 Continuation Ratio Model


    The cumulative logit and adjacent categories models are reasonable candidates
    for almost any ordered categorical variable. Our third model—the continuation
    ratio model—is more specialized. It’s most appropriate when the ordered categories
    represent a progression through stages, so that individuals must pass through
    each lower stage before they go on to higher stages. In those situations, the
    continuation ratio model is more attractive than the other two.'
