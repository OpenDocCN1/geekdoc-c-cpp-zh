- pgno: 134
  md: '# 112 Genome Annotation


    same statistical model. Despite these caveats, protein domain matches still tend
    to provide more sensitive, less redundant and often better-annotated results from
    the output of pairwise search methods, such as BLAST.


    A large database notably absent from InterPro is the Conserved Domain Database
    (CDD) (Marchler-Bau et al., 2011), with its accompanying CD-Search software. Although
    this database partially overlaps in its sources with InterPro, it includes two
    unique and significant sources: Clusters of Orthologous Groups of proteins (COGs)
    (Tatusov et al., 2003) and the NCBI Protein Clusters (Sayers et al., 2010). As
    such, any thorough genome annotation system should make use of CDD as well as
    InterPro to obtain a complete picture of protein domains.


    # 7.4 SIMILARITY SEARCHES


    By the most common method for functional annotation is based on similarity searches.
    The premise of this method is that a high degree of pairwise nucleic acid and/or
    amino acid conservation between an already characterized and annotated gene sequence
    and a query sequence also implies conservation of the function, which was determined
    for the first gene sequence. This simple premise is complicated to implement in
    practice, because similarity is in many cases or less a continuum, rather than
    a yes-no trait. While each piece of software will use its own e-value guidelines
    on homology detection for functional annotation (see Chapter 8), the definition
    of homologous sequences is based on the origin of the related genes and not on
    simple sequence similarity. Key types of homologs are described according to these
    origins.


    # 7.4.1 Paralogs


    Any organism may contain several similar genes that originate from a single instance
    of the gene, which has undergone one or more duplication events during evolution.
    Over time, these genes tend to specialize in their function, might be expressed
    in specific tissues or might show ligand specificity (Guillén et al., 2010). If
    one instance of such a gene sequence has been already characterized, it is usually
    reasonable to infer a similar function for the other members of the gene family
    based on very strong amino acid level pairwise similarity (e.g, e-value < 10⁻⁵).
    In terms of nomenclature, typically paralogs constitute a gene family with similar
    gene symbols, such as *hox1*, *hox2*, and *hox3*. HOX in particular is a large,
    ancient paralog family, predating modern chordate evolution, and it is therefore
    challenging to trace the duplication sequence precisely (Hughes'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'et al., 2001). Naturally, the nearer a duplication event is to the leaves of
    the evolutionary tree, the stronger the degree of nucleotide similarity between
    the paralogous sequences should be.


    Ohnogs are a special case of paralogs, as they are thought to be derived at the
    same time from a double whole-genome duplication event in the common chordate
    ancestor (Leveagle et al., 2003). This common origin means all of these gene families
    have roughly the same evolutionary distance. Yeast geneticists have also adopted
    the term oholog, as several yeast species have undergone whole genome duplication,
    but evolution rates of ohnogs are not equivalent in these lower species (Bu et
    al., 2011).


    # 7.4.2 Orthologs


    Strictly speaking, two genes from different species are called orthologs if they
    are each other''s best hit in a pairwise comparison of the two (reciprocal hit),
    possibly supported by maximum likelihood distance in the case of confounding paralogs
    (Wall et al., 2003). The nearer are more closely related to each other than anything
    else, therefore they will likely share a common evolutionary origin. In general,
    orthologs will have the same major biological function, meaning that an existing
    annotation can be reused at a coarse level. Gene symbols for orthologs are often
    shared among species, so that, for example, the ING1 gene in the human genome
    is the equivalent of the ING1 gene in the Drosophila genome.


    It should be noted that there are several exceptions to the afore-mentioned principles.
    Orthologs can have different names and numbers depending on when they were originally
    annotated, for example, ING1''s ortholog in yeast is called YNG1, and ING2 is
    ING1''s ortholog (Gordon et al., 2008). It is also possible that orthologs may
    play a functionally critical role in one organism but not another. For example,
    20% of the human orthologs that have been determined to play a critical role in
    the mouse do not have the same function in humans (Liao and Zhang, 2008). Orthologous
    transcription factors in bacteria may differ recognition sites (Price et al.,
    2007). Even the one-to-one relationship between orthologs may not always be universal.
    In Figure 7.3, the tree-based gene comparison of eukaryotic VNNI genes from Ensembl
    (Flicek et al., 2010) shows that a recent gene duplication event occurred in the
    African elephant (Loxodont africana) genome. Due to the very high degree of sequence
    similarity, both of these genes could be considered orthologs of the human VNNI
    gene.'
