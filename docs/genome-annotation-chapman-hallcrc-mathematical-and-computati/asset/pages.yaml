    While using a genome viewer, biologists are often interested in visualizing only
    a small portion of a much larger genome. Navigating within a large genome to focus
    on the small region of interest usually involves many scrolling and zooming operations,
    until the desired part is in view at a proper zoom scale. This requires the user
    to go through several manipulations within the respective viewing environment
    to focus on the desired part. Another way is to type in the nucleotide position
    as a number to change the focus to center on position. In this case, the user
    has to know or memorize the position of the desired section within the genome.
    This is not very user friendly, and makes navigating among specific parts of a
    genome a tedious task.


    Navigation within a genome is made significantly more convenient in Bluejay by
    introducing the concept of a waypoint, which is roughly defined as a coordinate
    that identifies a point in 2D or 3D space. In global positioning system (GPS)
    applications, waypoints correspond to coordinates of locations of interest on
    the earth’s surface. Similarly, waypoints in Bluejay'
