- pgno: 91
  md: '# Characterization of Gene Function through Bioinformatics


    The Early Days


    # 5.1 OVERVIEW


    The characterization of gene sequences began with the invention of protein sequencing
    techniques (Edman, 1949) and intensified after DNA sequencing became a reality
    (Gilbert and Maxam, 1973; Sanger et al., 1973). In the early days of sequence
    production, computation was in its infancy, with punch cards and primitive mainframe
    computers as the only means to perform bioinformatics tasks. Despite these rudimentary
    environments, researchers began to develop tools that allowed the comparison of
    sequences (Doolittle, 1981). The next phase of computer development introduced
    the command line terminals and large-scale data storage on disk drives. Still,
    the Web did not exist and computing was only accessible to a select minority.
    With the creation of early personal computers, especially the IBM PC, the Apple
    Ile, and the Atari 520, this changed dramatically, as all of a sudden access to
    computers became a possibility for most scientists. At the same time, the programming
    tools evolved rapidly, that it was possible for many to create scripts and programs
    to assist in the analysis of sequence information. To this day, some of the bioinformatics'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 70 Genome Annotation


    tools developed early on are still in use and students at the university level
    are still learning how to use a command line interface (now of course on UNIX
    machines).


    It was recognized early on that the newly created protein and DNA sequences needed
    to be stored in a public repository, similar to books and other works in libraries;
    therefore GenBank, the European Molecular Biology Laboratory (EMBL) Data library,
    and Japanese International Protein Information Database (JIPID) were founded (Benson
    et al., 1993; Kneale and Kennard, 1984). As the Internet really not yet exist
    as a commodity in these early days, the data were initially distributed on tapes
    and floppy disks at a cost. Smith and Waterman created the original exhaustive
    search algorithm for sequence data in 1984 (Lipman et al., 1984). It turned out
    that with the computer infrastructure of the time, this algorithm took too long
    to be useful; therefore the first “workable” tools to emerge in bioinformatics
    were the heuristic database search algorithms FASTA (Pearson and Lyman, 1988)
    and thereafter BLAST (Altschul et al., 1990). They could be used to see a new
    sequence after the sequences in the databases. Specialized search algorithms emerged,
    were capable of identifying motifs within protein sequences (as PowerShell) (Kolakowski
    et al., 1992) or finding restriction sites within DNA sequences (as REBASE) (Roberts
    and Macelis, 1993). Tools for the analysis of physicochemical parameters of protein
    sequences were created. For instance, it became very popular to publish hydrophobicity
    analyses (Bigelow, 1967) for newly sequenced proteins in the scientific literature.
    Hydrophobicity plots can also be considered one of the first graphical visualizations
    used in bioinformatics.


    Eventually, the early-standalone bioinformatics tools were bundled into sequence
    analysis suites, which were commercially marketed. As emerging fields, initially
    quite a variety of analysis suites existed, from Pustust (Pustell and Kafatos,
    1984) for PC/GENE (Moore et al., 1988) to UW GCG (Devereux et al., 1984). While
    the first two examples worked on personal computers, the last (which over time
    was renamed to “GCG”) worked originally on the Digital Equipment (DEC) VMS platform.
    GCG grew into a fairly large suite over time and became one of the most used toolkits
    in bioinformatics, for example, the EMBnet nodes (http://embnet.org), which provided
    access to bioinformatics resources, standardized on this package worldwide for
    some time.


    Initially, the sequences created in the laboratories were only a few acids long,
    and even the early DNA sequences almost never exceeded'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Characterization of Gene Function through Bioinformatics ■ 71


    1000 bp. One should not forget that it took several months to create even a 1000
    bp sequence in the early days of DNA sequencing. As the main memory on personal
    computers, and even mainframes, were very limited initially (640 kilobytes was
    considered very large), the bioinformatics tool developers universally restricted
    the maximum size of a sequence that could be handled at once. For example, sequences
    in the GCG package were limited to 100,000 amino acids or base pairs. These very
    restrictions were unfortunately hardcoded, making it very difficult to modify
    these applications later on to enable the handling of complete genomes, which,
    in the case of complete microbial genomes, were of course much larger than this
    artificial cutoff. When the first microbial genomes were first presented in the
    year 1995, the only tools to handle the complete sequence were word processors,
    such as Microsoft Word or Wordstar. Once complete genome sequences existed, this
    limitation was overcome quickly through patches to existing programs and the creation
    of new software tools.


    # 5.2 STAND-ALONE TOOLS TOOLS FOR THE INTERNET


    Bioinformatics began with the creation of individual tools and evolved into the
    provision of complete packages, which could be used to analyze DNA and protein
    sequences. Several of the original stand-alone tools were so essential in bioinformatics
    that they are still used as individual tools today. We cannot make any attempt
    to list all of them, some, which were important for the creation of genome analysis
    pipelines, are discussed next.


    The FASTA and BLAST tools really opened up the ability to efficiently search the
    databases to almost anyone, as these tools allowed rapid searches on benign hardware
    and gave reasonable approximate answers within a short period of time.


    Two alignment tools really shine, and both were created by Des Higgins: Clustal
    (in its various incarnations up to the most recent ClustX) (Thompson et al., 1994)
    and T-Coffee (Notredame et al., 1998). The original publication describing Clustal
    remains one of the most cited bioinformatics publications of all time and both
    tools are still in use in many laboratories. Figure 5.1 shows an example of using
    Clustal to perform multiple sequence alignment.


    One problem, which began to haunt researchers early on, was the large number of
    different file formats, which were developed without coordination'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# 72 Genome Annotation


    ![](img/7da802df4d7c0829a4a41adf9acaf30d_94_0.png)


    FIGURE 5.1 Command line screenshots of ClustaW performing multiple sequence alignment.
    Multiple sequence FASTA format file is entered (top), ClustaW processes to produce
    an alignment format file containing the results of the multiple sequence alignment
    (bottom, initial part shown).


    to store sequence information. Some of these formats, especially the FASTA and
    multiple FASTA file formats, are popular to this day. Don Gilbert from Indiana
    University solved this problem through the creation of a tool called Readseq (2003),
    which can be used to convert many different file formats each other. Readseq was
    one of the first public domain and open source bioinformatics tools and Gilbert
    can be credited as one of the early bioinformatics leaders who introduced this
    policy in the field.


    Initially, users could only use local installations of bioinformatics tools, but
    even before the existence of the World Wide Web, developers began to make their
    tools accessible over the Internet. E-mail was used as a vehicle for the use of
    remote bioinformatics tools. The FASTA and BLAST e-mail servers, as well as some
    "exotic" database search e-mail servers were commonly used. The major advantage
    that they provided accessibility from any computer, including PC-type machines
    and the'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Characterization of Gene Function through Bioinformatics ■ 73


    provision of up-to-date databases, unlike many local installations of the same
    search tools. Specialist tools, such as the BLOCKS server (Hennikoff and Hennikoff,
    1991) emerged, which allowed the identification of protein motifs, and they were
    coming online. Still, e-mail servers could be easily overloaded, especially when
    the first automated tools began “talking” to them and were ultimately replaced
    by Web interfaces.


    One last toolkit, which is well worth mentioning, the PHYLIP package (Felsenstein,
    1989), which was created and is still being maintained by Joe Felsenstein and
    his colleagues. The ideas, which formed the base for the creation of PHYLIP, are
    becoming more important in the age of environmental genomics, by the binning of
    sequences into operational taxonomic units (OTUs) is an essential task in this
    research field.


    # 5.3 PACKAGES


    It became early on in bioinformatics that a large gap existed between the tool
    developers and the end users. The installation and maintenance of programs proved
    to be very for many and software packages emerged, which tried to address this
    gap through a unified software environment. Although today the computational platform
    for bioinformatics is usually an UNIX-based system, many different operating systems
    were initially explored in this context, as can be seen from the descriptions
    of some of the more prominent early bioinformatics packages.


    # 5.3.1 IBI/Pustell


    One of the early software packages for sequence analysis is IBI/Pustell, written
    by John Pustell at Harvard University (Pustell and Kafatos, 1984). It was essentially
    created to handle manual sequencing and database searches. The package ran on
    MS-DOS computers and could be bought from IRL Press Software. As IRL Press was
    also distributing copies of the GenBank database at the time, the package could
    be used to manually enter data from autoradiagrams and perform similarity searches
    against the included datbanks.


    # 5.3.2 PC/GENE


    Users without access to a VMS or UNIX computer also demanded access to bioinformatics
    tools. Quite a number of software packages emerged early, from IBI-Pustell to
    what could probably be called one of the most useful MS-DOS-based suite of tools,
    PC/GENE (Moore et al., 1988), which was initially created by Amos Bairoch. The
    range of applications within PC/'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Genome Annotation


    GENE was similar to that of GCG/EGCG, but the package had the advantage that it
    could be used on any personal computer running MS-DOS and was also capable of
    printing on the printers directly to these machines. This was especially important
    for the graphics that PC/GENE created. Databank updates were available on floppy
    disks, which were subscribed to, similar to the software updates for the program.
    Similar to GCG, memory restrictions made it difficult to impossible to handle
    large sequences. Workflows were not supported, thus users needed to store an output
    from one program and use it as input in one subsequently.


    # 5.3.3 GCG


    As computers were initially not connected to any networks, they were considered
    quite secure and in many customers purchased a software package as GCG, which
    was initially written for VAX-VMS and later recompiled for UNIX, together with
    the source code, which was then freely accessible for modifications. Within GCG,
    many of the early-alone bioinformatics applications, such as FASTA, BLAST, and
    others, were bundled. The system was command-line driven and the graphical outputs
    consisted of pixel graphics, mostly black-and-white line drawings. Early on, database
    updates for the databank searches were performed from tapes, which were physically
    mailed by the databank providers. As the Internet emerged, this was replaced by
    updates, which could be downloaded via anonymous FTP. In the case of GCG, the
    open source architecture, which allowed access, led to many additions to the toolkit,
    the most prominent being the EGCG package, which was created by Peter Rice (Fuchs
    et al., 1990). All executables within the package could only be used through a
    command-line interface (on monochrome text monitors). Over time, this became limiting
    and the GCG team added Steve Smith, the creator of early bioinformatics interface
    named GDE (Smith et al., 1994), to their roster and began using an adapted version
    of GDE as the interface to the GCG toolkit. The creation of workflows was only
    possible for experts with programming experience and certainly not a simple task
    for the average user of GCG.


    # 5.3.4 From EGCG to EMBOSS


    As said before, early versions of the GCG package included the source code, which
    allowed users to modify the code and recompile the GCG package. This was necessary
    in order to adapt the package to certain machine specifications, such as the available
    memory footprint. As these were the'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Characterization of Gene Function through Bioinformatics ■ 75


    days of what was later dubbed "bioinformatics," users also wanted features that
    were not included in the GCG distribution. Some of the larger organizations, which
    had copies of GCG, began to add software components to the core distribution.
    Especially Peter Rice at EMBL Heidelberg (this division has since relocated to
    Cambridge, England) was developing tools for GCG (Fuchs et al., 1990), which he
    distributed as the so-called ECG (enhanced GCG package). For a while, this was
    not only tolerated by the company owning the rights to GCG but even encouraged.
    Unfortunately the company distributing GCG eventually took a different route for
    the packaging of GCG, initially stopping the distribution of the source code and
    subsequently discouraging others from contributing to the code.


    At this point in time, Rice and his team began a new, open source development,
    which led to the creation of the EMBOSS package (Mullan and Bleasby, 2002). This
    package, which has now replaced GCG, is being adopted and supported by a large
    community of contributors, and is now the de facto standard for a stand-alone,
    command-line driven bioinformatics package. EMBOSS is truly open source, therefore
    many contributors have added components to this toolkit over time. The use of
    EMBOSS is highly recommended for anyone looking for a solution to their basic
    bioinformatics needs. Several graphical and Web interfaces exist, which facilitate
    easy access to the EMBOSS tools.


    # 5.3.5 The Staden Package


    Eventually, automated DNA sequencing with fluorescent dyes, which are detected
    by photo cells and transformed automatically into "peaks," representing the base
    pairs of the DNA sequence, triggered the development of tools that could be used
    to handle this kind of information in a semutomated fashion. Automated DNA sequencing
    naturally also led to an exponential increase in the number of sequences that
    could be generated, thus the completely manual, yet efficient handling of DNA
    sequences became less or impossible.


    One of the most prominent software packages that were used in this context was
    the Staden Package (Staden, 1986), which was created by Roger Staden and his team
    and maintained for many years. Roger Staden was the driving force before the creation
    of trace data files. He created the original ABI trace data format (Staden, 1980)
    and later the SCF, Staden Chromatogram Format (Dear and Staden, 1992). The main
    purpose of the Staden Package was the extraction of sequence information from
    the trace'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# 76 Genome Annotation


    ![](img/7da802df4d7c0829a4a41adf9acaf30d_98_0.png)


    5.2 Viewing and editing contigs with the Staden Package. After sequence assembly
    from multiple trace files by the Gap4 package, contigs are shown in Contig Selector
    (top). Upon selecting a contig (the leftmost one in this case), Cont Editor shows
    the contig information including the reads used in constructing the consensus
    (middle), which can be manually edited. The trace around a base of a particular
    region can be viewed to aid in the editing process (bottom).


    file, the trimming of the files to extract the useful information (after the removal
    of vector sequences, contaminating host DNA sequence, etc.) and the assembly of
    this information into contiguous sequences (i.e., contigs). In addition, the package
    provided many other tools, which were developed over time to assist with special
    tasks. Figure 5.2 shows an example of running Staden packages to build contigs
    from multiple trace files.


    The Staden Package was built in a modular fashion, therefore other tools could
    be added to the data processing pipeline. Notable here are the Phred and Phrap
    tools (Ewing and Green, 1998; Ewing et al., 1998), which were created by Phil
    Green at the University of Washington. Phred allowed the creation of quality assessments
    for trace data and became more or less the facto standard in this field until
    next-generation automated DNA sequencing over.


    The major tools in the Staden Package (pregap, the tool to manipulate trace data;
    and gap, the genome assembly program) gained graphical'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Characterization of Gene Function through Bioinformatics ■ 77


    interfaces over time. This was essential, as the sequence assembly could be linked
    back to the trace data to verify sequence information and resolve any ambiguities
    through visual inspection.


    # 5.3.6 GeneSkipper


    The early sequencing efforts needed tools that were capable of analyzing larger
    contiguous sequence files (contigs) and providing additional information and graphical
    representations, which reflected the sequencing progress. EMBL Heidelberg was
    one of the sites involved in the Saccharomyces Yeast Genome Project and therefore
    Christian Schwager and his team at EMBL created a Windows-based software tool
    GeneSkipper, which was one of the first tools to graphically represent an analysis
    of sequenced contigs (i.e., the six protein translation frames and potentially
    coding regions).


    # 5.3.7 Sequencer


    Apple Macintosh computers have always been considered to provide one of the most
    user-friendly interfaces in the computer industry. Eventually, Howard Cash founded
    a company called GeneCodes, which created a sequence assembly system for the Macintosh
    environment, called Sequencer (www.sequencer.com). Over time, Windows platform
    support has been added. This system is still being sold to this date and in use
    many laboratories around the world.


    # 5.4 FROM FAST FILES TO ANNOTATED GENOMES


    The Staden Package, GeneSkipper, and Sequencer all included very limited provisions
    for the genome annotation task. Essentially, they took raw sequence files in,
    and produced assembled sequence in FAST format (or some other format) as output.
    Therefore, dedicated tools were developed over time, initially to collect the
    annotation information, which was being created in a manual or semiautomated fashion
    (such as the ACeDB family of tools) and later on fully automated tools.


    # 5.4.1 ACDeDB


    The Arabidopsis thaliana and Caenorhabditis elegans sequencing projects yielded
    AtDB (an Arabidopsis thaliana database) (Cherry et al., 1992) and ACDeDB (a Caenorhabditis
    elegans database) (Cherry and Cartinhour, 1994), which collected the information
    related to the genome annotation and'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'graphically represented this information. Like GeneSkipper, these systems were
    created at the dawn of widespread Internet access. The genome nota-tions created
    with the ACeDB system could be downloaded and installed on UNIX machines (others
    might have been supported early on as well). The maintenance of this system was
    complicated and therefore creating a data-base for other genomes was undertaken
    in only a few cases, such as some human chromosomes and Schizosomyces pombe. Especially,
    ACeDB handled genomic information best, as there was no notion of changing sequence
    states (from the first assembly to the finished genome) built into the workflow.
    ACeDB was retrofitted with Web capability later, but the success of this development
    was rather limited. Still, the systems have a presence to this day and a collection
    of these is currently main-tained at the Sanger Center in the United Kingdom (www.acedb.org).


    # 5.4.2 One Genome Project, the Beginning

    of Three Genome Annotation Systems


    In the early days of complete genome sequencing, researchers usu-ally kept the
    DNA sequence under wraps until it had been published. This, of course, prevented
    the community at large from access to these sequences and hence there was very
    little sequence information to go around, which could be used as an example while
    building bioinform-atics could be used to analyze and annotate large stretches
    of genomic sequence. There were a few notable differences, including the Myoplasma
    capriculum sequencing project (Dolan et al., 1995). The investigators opened access
    to early versions of the sequence in draft-mat. This eventually led to the creation
    of at least three software pack-ages that played a role in the automated genome
    analysis and annotation field.


    To this day, two of the systems, PEDANT (Frishman et al., 2001) and MAGPIE (Gaaster
    and Sensen, 1996), are still in use, while the third, which was a commercial product
    called Bioscout, disappeared with the demise of LION Biosciences. PEDANT is now
    part of the offerings of Biomatik AG in Munich, Germany, where MAGPIE is an open
    source system, which can be downloaded freely from Sourceforge. All three systems
    initially produced tabular HTML-based output of the func-tional assignments to
    genomic regions. Over time, the systems evolved and also added graphical representations
    of the analysis results. Some of the latest versions of the graphics-based tools
    will be introduced in more detail in subsequent chapters.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Characterization of Gene Function through Bioinformatics ■ 79


    # 5.5 CONCLUSION


    Bioinformatics as a research field is less than 40 years old. Within this timeframe,
    many useful stand-alone tools were developed, which can be used to characterize
    sequence information. Over time, they were combined into analysis pipelines, which
    can provide automated genome analysis and annotation for sequences. Initially,
    the annotations were listed in tabular format, but over time it became evident
    that graphical representations were more useful for most users of the annotation
    pipelines. Bioinformatics has truly adopted the Internet as the vehicle that is
    used to share the results of genome annotations. Almost every technological approach,
    from the early HTML-based annotation engines to the latest XML-based systems,
    has been tried over time. Today, we have efficient tools for the analysis and
    annotation of even the largest genomes, and systems for comparative approaches
    of even hundreds of thousands of genomes the size of the human genome are under
    development, as discussed in subsequent chapters of this book.


