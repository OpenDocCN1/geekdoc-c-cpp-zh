    # 9.2.2 Ensembl Genome Browser


    The Ensembl Genome Browser (Flicek et al., 2011) is the main visualization tool
    for the Ensembl project, which generates databases for vertebrates and other eukaryotic
    genomes. As of Release 59 (August 2010), the Ensembl database holds 56 species,
    most of which are vertebrates.


    The Ensembl Browser''s individual pages contain statistical information, including
    the known protein-coding genes, protein-coding genes, pseudogenes, microRNA (miRNA)
    genes, rRNA, small nuclear RNA (snRNA), small molecular RNA (snoRNA), and other
    RNA genes as well as single nucleotide polymorphisms (SNPs). RNA gene annotation
    in Ensembl is accomplished by making use of partial cDNA or EST and protein-coding
    genes found in other organisms. Non-coding RNA (ncRNA) determination is achieved
    through the collaboration with the RNA family database (Rfam) alignments of the
    Welcome Trust Sanger Institute (<www.sanger.ac.uk/Software/Rfam>). In'
