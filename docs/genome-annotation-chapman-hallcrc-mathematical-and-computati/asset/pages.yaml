    DNase sequencing

    - Epigenomic modifications—Histone, transcription factors, RNAPolIII, DNA methylation,
    data from the ENCODE project

    - Regulatory motifs

    - MicroRNA (miRNA) targets


    # 8.6 SUMMARY


    Functional annotation is essential to understanding emerging genomes. Functional
    annotation is of predicated on good structural annotation. Genome annotation pipelines
    exist for handling these two stages and automating the collection of bioinformatics
    evidence. A variety of pipeline implementations exist in order to target prokaryotic
    versus eukaryotic genomes, and simple versus complex eukaryotic genomes. Some
    of the pipelines are stand-alone, whereas others are meant to be used in conjunction
    with other components for editing or viewing the automated annotation results.
    Chapter 9 explores several examples of these annotation data display and editing
    environments.'
