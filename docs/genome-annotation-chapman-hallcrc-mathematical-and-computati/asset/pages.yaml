    genomes at all waypoints labeled with the identical name, in multiple genomes.


    Bluejay also allows the user to view a genome at various levels of detail, from
    the complete genome to the nucleotide text level. In the view mode, the genome
    can be set not only on a whole genome but also on any individual base position
