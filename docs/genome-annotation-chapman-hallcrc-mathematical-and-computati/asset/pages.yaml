    # Between the Genes


    3.1 INTRODUCTION

    For much of the history of genome research, most of the sequence that was not
    protein coding in the human and other genomes was labeled “junk DNA.” Besides
    the obvious exceptions of structural RNA genes, such as tRNA coding regions, as
    well as transcription factor binding sites, no function could be assigned these
    vast stretches of genomic information untlatable into protein, it is also highly
    repetitive, lowering its information potential even more. Nevertheless, as the
    human genome was elucidated, it became clear that higher animals did not have
    many more genes phylogenetically lower organisms, such as plants. The discovery
    of new classes of RNAs in the regions fibres labelled “junk DNA” helped unravel
    new gene regulatory mechanisms. Today, we know that the genomic complexity in
    higher organisms is not based solely on gene structure, but on the intricate interactions
    between transcription factors, splicing factors, regulatory RNAs, DNA methylation,
    and chromatin rearrangements, as well as potentially other mechanisms, which have
    not yet been discovered. As such, genome annotation cannot be considered comprehensive
    without a thorough characterization of the genomic regions “between the genes.”


    3.2 TRANSCRIPTION FACTORS

    Transcription factors (TFs) are usually regulatory proteins that bind to the genomic
    DNA alone or in conjunction with other proteins in order to enhance or suppress
    the rate of gene transcription. These enhancement or repression activities can
    also work in cascades to greatly amplify or eliminate transcription of specific
    gene sets, or to strictly'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'maintain transcriptional stasis, respectively. The binding of transcription
    factors to genomic DNA is complex, dependent on the three-dimensional structure
    of the protein complex, as well as the steric and biochemical characteristics
    of the genomic transcription factor binding site (TFBS, also known as response
    element). The electrostatic and der Waals forces that dominate these interactions
    tend to allow TF recognition of several DNA sequence variants, and the general
    scheme of recognized sequences is known as a TFBS motif. More importantly, the
    presence of a TFBS motif by itself is insufficient to conclude that a gene is
    regulated by specific transcription factor. To reduce the number of false positive
    TFS calls, the scoring of the match, the location of the putative TFBS, the sequence
    neighborhood, and TFBS conservation across species should all be considered.


    # 3.2.1 Transcription Factor Binding Site (TFBS) Motifs


    Because any TF can bind to a number of similar DNA sequences, recognition motifs
    are generally represented computationally as a position-specific weighting matrix.
    Given set of experimentally confirmed TFBSs for a particular TF, these sequences
    are aligned to bind a matrix weighted towards conserved nucleotide positions.
    As an example, Figure 3.1 shows the alignment of known binding sites for the CREBI
    transcription factor (Bartsch et al., 1998). Underneath is the position-specific
    weighting of the matrix, based on column totals from the weighted matrix, known
    as a WebLogo (Crooks et al., 2004). Intuitively, the height of the labels is proportional
    to their importance in achieving a motif match in a scanned genomic sequence.


    The validated TFBS sequences, their alignment, and the selection of columns to
    retain have any impact on the final matrix. Figure 3.1 represents these choices
    for the CREBI TF in the JASPAR database (Sandelin and Wasserman, 2004). JASPAR
    is the most popular, fully public database of TF-weighted scoring matrices for
    eukaryotes. Many TFBSs are drawn from the Eukaryotic Promoter Database (Schmid
    et al., 2006), which documents experimentally validated elements. The PAZER web
    site (Portales-Casmar et al., 2007) also acts as an aggregate portal for TF information.
    The TransFac database (Matys et al., 2006) has both public (not updated since
    2005) and commercial versions, with the latter including many more matrices, which
    are mostly based on literature mining. MatBase (Genomatix Software GmbH, Munich,
    Germany) is a commercial database that also contains many TF scoring matrices,
