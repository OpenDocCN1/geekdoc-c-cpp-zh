    # 11.4 NEXT-GENERATION GENOME BROWSING


    # 11.4.1 Integration of Different Types of Genomic Data


    Most browsers described up to this point can only display genomic sequences and
    their various annotations from multiple sources. Although these browsers can visualize
    multiple tracks of information, there is an ever-increasing need to visualize
    different types of data simultaneously to gain intuitive understanding. For example,
    with the generation of large data sets from microarray experiments, there is an
    increasing need to generate views of both genomic and expression data within a
    common visual context'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# 206 ■ Genome Annotation


    and perform a visually guided interpretation of the data. Traditional gene expression
    visualization tools normally display expression values as a heat map using color
    gradients to represent the strengths or weaknesses of expression. For example,
    the TIGR MultiExperiment Viewer (MeV) (Saeed et al., 2003) is a publicly available
    gene expression analysis and visualization tool. With this type of visualization,
    however, it is difficult for the researcher to see and interpret the gene expression
    profile within a genomic context, as each gene is represented as a text symbol.


    In a similar vein, cancer genomics entails searching for the genes and their mutations
    that contribute to the development of a cancer cell in order to analyze the alterations
    that occur in the genome of a patient’s cells. Tumor samples are analyzed using
    microarray and high-throughput DNA sequencing technologies to generate genomic
    data with clinical significance, such as insertions, deletions, and the copy numbers
    of genes. Large clinical trials of this kind produce a huge amount of different
    types of molecular data that needs to be organized to provide a unified view for
    integrating genomic data with clinical data, especially gene expression data and
    cancer genomics data. These browsers are capable of simultaneously displaying
    genome-scale clinical measurement values for sets of samples in reference to genomic
    coordinates.


    For example, TIGR MeV has been integrated into Bluejay (Soh et al., 2012; Soh
    et al., 2008) at the source in order to extend its functionality to enable the
    display of gene expression levels within the genomic context. Bluejay internally
    represents the genomic data, along with gene expression values, as a document
    object model. The results of the gene cluster analysis performed by TIGR MeV can
    also be displayed on the whole genome, with each cluster represented in a unique
    color.


    Figure 11.4 illustrates the interplay between visualizing genome sequence data
    and gene expression data simultaneously. Microarray data integration in Bluejay
    adds the capability of showing gene expression values and genes side by side within
    a whole genome, so that the association between genes and their expression values
    is visually evident. For a biologist, it becomes much easier to interpret gene
    expression analysis results than when the results were displayed outside of the
    genomic context, as in expression images, heat maps, or tables of numeric values.


    The University of California, Santa Cruz (UCSC) Cancer Genomics Browser (Zhu et
