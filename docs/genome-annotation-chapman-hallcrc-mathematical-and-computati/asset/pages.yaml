    regions with high ChIP sequencing depth (i.e., lack of chromatin) and account
    for interdependencies of clustered motifs. ChIPMunk (Kulakovskiy et al., 2010)
    uses ChIP-Seq data, plus novel motif heuristics, to dramatically cut the computational
    time but produces similar results to the performance of HMS. From a genome-wide
    perspective, this compares favorably to motif searches (Conlon et al., 2003),
    where the added predictive power is limited to the TFs correlated to the given
    experimental condition.


    *De novo* sequence prediction using conservation between species is referred to
    as phylogenetic footprinting. Sandelin et al., 2004) is one of the major tools
    in which cross-species TFBS filtering is implemented. Most tools, including ConSite,
    rely on the user providing an accurate mapping of orthologous genes as input,
    therefore accurate gene structure modeling (see Chapter 2) is a prerequisite for
    this type of analysis.


    # 3.3 RNA


    Ribosomal nucleic acid (RNA) was for many years considered DNA’s cousin. Whereas
    genomic DNA held the blueprints to life, RNA was thought of as a single messenger
    and structural component of the cell. Beyond these traditional roles, measurements
    of sequence-specific interactions between RNA-RNA and RNA-DNA have revealed complex
    genetic regulatory mechanisms in eukaryotes and to a lesser extent in archaea.
    Although our knowledge of the partners in the RNA interaction is currently incomplete,
    the computational tools described next should remain largely applicable for the
    prediction of the specific RNA sequences involved. A relatively comprehensive
    database of known noncoding RNAs covering most of the categories is Ramam (Gardner
    et al., 2011).'
