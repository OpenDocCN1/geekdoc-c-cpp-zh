    more than a thousand genomes, many of them of very good quality (1 error per 10,000
    bp or less). These early complete genomes provide the templates for today’s sequencing
    experiments.


    # 1.3 NEXT-GENERATION SEQUENCING


    The latest DNA sequencing technologies currently influence the current DNA sequencing
    strategy and lead to new approaches in biochemistry and biotechnology. Two major
    types of next-generation DNA sequencing technology are being developed: short-read
    systems, with read lengths up to approximately 100 bp DNA fragment, and long-read
    systems, with average read lengths of at least 300 bp and potential read lengths
    of several kilobase pairs per fragment. There are many different technologies
    that are currently being explored for next-generation sequencing, with the Illumina,
    ABI SOLiD, and Roche 454 sequencing approaches being in the lead at present. The
    latest sequencing technologies do not require cloned DNA as a prerequisite, thus
    sequencing can be accelerated tremendously. A single machine run can yield several
    million reads, which is sufficient for the shotgun assembly of a microbial genome.'
