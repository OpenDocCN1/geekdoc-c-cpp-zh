- pgno: 127
  md: '# Functional Annotation


    7.1 INTRODUCTION

    For those genes that are translatable into proteins, and their surrounding neighborhoods,
    a number of analyses can be performed to link the proposed messenger RNA (mRNA)
    constructs (see Chapter 2) to their predicted biological functionality. As these
    annotations are mostly one-time assignments (such as the predicted gene function
    of a certain locus within the genome), they are usually performed by using “static”
    annotation tools (see Chapter 8). We define static annotation tools as those that
    create a mapping of features to genomic regions, with tables, spreadsheets, or
    HTML-based Web pages as the final output. Typically, users can interfere little
    or not at all with the final output of these systems and have to take the mappings
    created by the static annotation tools at face value. This may be problematic,
    as the public data repositories contain a large number of erroneous entries, which
    might lead to incorrect functional assignments.

    Primarily, functional predictions are based on similarity searches of the nucleic
    acid data and the resulting amino acid translations of the open reading frames,
    against public data, which are stored in repositories such as the EMBL database,
    GenBank, or more specialized data collections as outlined in this chapter.


    7.2 PHYSICAL AND BIOCHEMICALnATURE PREDICTION


    7.2.1 Physical Chemistry Features

    The distribution of hydrophobic (i.e., water-hating) amino acids in the predicted
    protein can indicate whether a protein segment is likely to be'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 106 ■ Genome Annotation


    naturally located in solution next to or within a (fatty) membrane. For example,
    the EMBOSS (Rice et al., 2000) Pepwheel program calculates a so-called helical
    wheel to check the periodicity of hydrophobic residues. With the proper periodicity,
    one side of a protein alpha helix is hydrophobic and the other hydrophilic (i.e.,
    water-loving). This would indicate that the protein might be a transmembrane (TM)
    transporter, or some other protein interacting with fatty membranes and aqueous
    molecules. More generally, the prediction of transmembrane protein segments is
    done using amino acid distribution models based on known transmembrane genes.
    Early success in transmembrane prediction was achieved using hidden Markov models
    (HMMs) (Sonnhammer et al., 1998). Subsequently, methods were developed to refine
    this technique. Current best practice is to combine multiple TM predictions. For
    example, the results of six different transmembrane predictors are combined in
    MetaTM (Klammer et al., 2009) using a statistical method known as support vector
    machines (Burges, 1998). These methods may also indicate whether the N- or C-terminus
    of the protein is expected to be outside of the membrane. A protein may contain
    multiple transmembrane domains in which case the inner-outer prediction is made
    for each nonmembrane segment.


    # 7.2.2 Sequence Motif Prediction


    Small amino acid sequence patterns, known as motifs, may not have biochemical
    functions themselves in the cell but may indicate that a protein is the target
    of various biochemical or transport processes in the cell.


    # 7.2.2.1 Protein Modification


    Amino acids in a protein may undergo chemical modification to change or regulate
    their biological function. More than 750 types of posttranslational modifications
    (PTMs) have thus been documented (Montecchi-Palazzi et al., 2008). Some of the
    most common PTMs are the addition of an acetyl group (CH3 acetylation), formic
    acid (HCOOH, formylation), a phosphate group (PO4^3-, phosphorylation), a polysaccharide
    (glycosylation), or an ubiquitin protein (ubiquitination) (Parker et al., 2010).
    Among other things, phosphorylation is important for the activation of proteins
    involved in cell signaling (Krebs and Beavo, 1979). Glycosylation affects protein
    solubility, stability, protein half-life, and immunogenicity (Dennis et al., 1999).
    Ubiquitination has several roles, including a key role in protein recycling in
    eukaryotes (Komander, 2009). Simple amino acid motifs'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Functional Annotation ■ 107


    for common sites, such as those found in PROSITE database, Hulo et al., 2007),
    can generate many false positives and false negatives. Another approach is to
    build tools specifically for a particular class of PTM, for example, kinase phosphorylation
    (Xue et al., 2006). PHOSPHIDA (Gnad et al., 2011) provides a comprehensive database
    and prediction tools for the three modifications already mentioned and therefore
    is more generally useful. The dbPTM database (Lee et al., 2006) uses achieved
    PTM sites to build HMMs for more than 20 common PTM classes. These HMMs can be
    downloaded for local use. AutoMotifServer (Basu and Plewczynski, 2010) provides
    an integrated platform with machine learning to predict the most common modifications
    with confidence, and it can be used either online or installed locally.


    Prediction of PTMs can also be important to help explain the observation of unusual
    peptides when mass spectrometry (MS) data are being mapped to an annotated genome.
    It is computationally expensive to incorporate every possible modification into
    an MS search, therefore prior annotation of PTM predictions with a high confidence
    level can speed up such searches considerably.


    # 7.2.2.2 Protein Localization


    Motifs in the amino acid sequence can cause a protein to be directed towards specific
    parts of the cell. These motifs are known as localization signals. Signal peptides
    that direct proteins to secreted from the cell can be identified SignalP (Petersen
    et al., 2011) for all organisms and Phobius (Käll et al., 2007) for eukaryotes
    only. These tools can be used to match the N-terminus of the protein to a sequence
    model, which was derived using known secreted proteins. predict membrane-anchored
    proteins. TargetP (Emanuelsson et al., 2007) augments SignalP to allow predictions
    of the presence of N-terminal motifs for chloroplast transit peptides and mitochondrial-targeting
    peptides.


    Programs that combine multiple predictions and inspect both the N- and C-terminus
    achieve more comprehensive localization analysis for prokaryotes. PSORTb (Yu et
    al., 2010) is a prime example, combining information on signal peptides, targeting
    motifs, and transmembrane topologies. LocateP (Zhou et al., 2008) is another combination
    predictor with accuracy in the vicinity of 90%. In prokaryotes LocateP''s options
    for primary localizations are C-terminally anchored, intracellular, lipid anchored,
    LPxTG cell-anchored, transmembrane, N-terminally anchored, via minor pathways
    (bacteriocin), and secretory (released).'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 108 ■ Genome Annotation


    LOCTree (Nair and Rost, 2005) is based on separate decision trees specific to
    plants, nonplant eukaryotes, and prokaryotes. In prokaryotes it can be used to
    classify secreted, periplasmic, and cytoplasmic proteins. In eukaryotes proteins
    are assigned to one of six localizations: extracellular, nuclear, cytoplasmic,
    chloroplastic, mitochondrial, or other organelles. BaCello (Pierleoni et al.,
    2006) implements different predictors for the three main eukaryotic domains: animals,
    plants, and fungi. The composition of sequence profiles derived from lineage-specific
    multiple sequence alignments can strongly affect the scoring. Proteins are designated
    as one of secreted, nuclear, cytoplasmic, mitochondrial, or chloroplast origin.


    The annotation of localization signals can be gain valuable insights into cell
    adaptation. For example, a localization signal may be contained within an exon
    that is missing in some splice variants (Section 2.6). This would indicate differential
    trafficking of a protein based on external factors. Localization can also provide
    support to other forms of functional annotation. For example, genes annotated
    as carbohydrate degradation enzymes in fungal genomes should generally contain
    signal peptides, since these enzymes are known to be secreted (Braaksma et al.,
    2010).


    # 7.3 PROTEIN DOMAINS


    The functionality of a protein is largely determined by its three-dimensional
    structure, which itself can be broken down into functional subunits, also known
    as protein domains. These protein domains conserve three-dimensional structure
    and charge distributions. Protein domains facilitate diverse biochemical functions,
    such as metal binding or luminescence. Proteins can contain several domains, for
    example, a carbohydrate binding domain to juxtapose a complex (the ligand) next
    to the protein and a carbohydrate degradation domain to subsequently cleave the
    ligand. Tens of thousands of conserved domains are known to exist, based on the
    size of the InterProt catalog (Hunter et al., 2011). The restrictions on structure
    and charge to maintain functionality are reflected in the rate of amino acid substitution
    in each position of the secondary (linear amino acid) sequence. Position-specific
    scoring models (PSSMs) are used to capture these domain constraints and are referred
    as protein domain models. The most commonly used model is an HMM (Krogh et al.,
    1994). As illustrated in Figure 7.1, the model represents the totality of positive
    examples given in the aligned input. This allows more sensitive matching of a
    query to the model than any particular positive example.'
  merge: -1
  img_proc: true
