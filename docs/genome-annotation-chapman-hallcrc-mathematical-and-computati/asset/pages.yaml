- pgno: 77
  md: '# Genome-Associated Data


    4.1 INTRODUCTION


    Determining the location of genes alone is of course not sufficient to get a comprehensive
    picture of the dynamic process called life. If genes are the program for an organism''s
    life, then gene expression is the equivalent of the running software process.
    Transcription factor analysis (see Chapter 3) is just the beginning of the process
    used to determine how genes work together and how a functioning organism works
    overall. In prokaryotes, expression in neighboring genes can be coordinated (through
    cotranscription in operons, for instance). In higher eukaryotes, the burgeoning
    field of epigenetics attests to the additional levels of gene expression control
    implemented in these organisms by its name: means "outside" or "above" in the
    Greek language. Adding another level of complexity, the concept of "the" genome
    for a "species" is becoming more or obsolete. High-throughput sequencing has facilitated
    the elucidation of many individual human genomes. At the same time, sequencing
    uncultured prokaryotes has revealed that delineating genes by sequence data is
    nontrivial, due to factors as widespread lateral gene transfer (Boucher et al.,
    2003). While the tools for analyzing genomic data are quickly evolving, this chapter
    provides a brief introduction to these new data annotation complexes and extant
    tools.


    4.2 OPERONS


    In prokaryotes, multiple neighboring genes on the same strand can be cotranscribed;
    such a genomic region is called an operon. The genes in an operon are normally
    involved in the same biological process, such as'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# 56 Genome Annotation


    a metabolic pathway. If all one of the genes coding for a reaction cascade are
    in an operon and a gene with unknown function is also found in the same operon,
    this location information can be used as circumstantial evidence that the gene
    with unknown function may perform the missing reaction. This can be a lead for
    follow-up biochemical validation. This form of functional annotation is independent
    of the other annotation techniques described in Chapter 7.


    Prediction of operon structure has traditionally been based on observing smaller-than-normal
    intergenic gaps. Cotranscription also implies only one ribosomal binding site
    (Shine-Dalgarno pattern from Chapter 2) with the most 5’ gene, and often a stem-loop
    structure to terminate at the 3’ end. Relatively high false-positive and false-negative
    rates for these signals (which are very short patterns) mean other techniques
    need to be used to improve the accuracy of operon prediction. Predictions can
    be measured against data such as coexpression analysis (e.g., microarrays) or
    RNA sequencing. The most accurate extant operon prediction software (~94%), called
    STRING (Tabaeda et al., 2010), use intrinsic data, functional clustering of genes
    based on protein interaction.


    # 4.3 METAGENOMICS


    Metagenomics is the study of genomic DNA extracted from a mixed population of
    microbial species, typically directly from the environment rather than cultured
    in a media in a lab. The principal purpose of such a data collection is to gain
    an understanding of the dynamics of microbial ecosystems in nature. For this reason,
    this technique is also known as ecogenomics (Oourg and Vriezen, 2007). The analysis
    and annotation of this mixed data requires several considerations: population
    statistics, data size, phylogenetic sorting, and quality of the assembly.


    # 4.3.1 Population Statistics


    Many of the sample mixture models used in metagenomics data analysis are naturally
    borrowed from are reshaping ecology, which has an established tradition of population
    statistics (Waples and Gaggiotti, 2006). Building on multiple existing programs,
    one of the most comprehensive tools for analyzing genetic data in ecology is mothur
    (Schloss et al., 2009). A fundamental concept for sequence-based analysis of microbial
    populations is setting aside the strict idea of distinct species, and instead
    clustering variable (but closely related) genomic data into so-called operational'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Genome-Associated Data ■ 57


    taxonomic units (OTUs). Typically the 16S ribosomal RNA is selected for OTU analysis,
    since universal primers targeting highly conserved regions of the rRNA can be
    used to amplify this gene across the entire microbial population in the sample.
    After sequence generation and clustering, each OTU is normally assigned to all
    sequences with either less than 3% or 5% variance. The methods for calculating
    this variance (i.e., distance) are traditionally based on initially performing
    a multiple sequence alignment of the whole data set. This ensures that variance
    measures are consistent across all possible pairs of sequences. This is the method
    used by mothour. An alternative would be to perform pairwise alignments instead
    of the multiple alignment, but this typically leads to an underestimate of the
    variance among all of the sequences in an OTU. A compromise is to perform global
    (i.e., full-length query and target) pairwise alignments. This approach has been
    reported with favorable results by the authors of the 16S rRNA analysis tool ESPRIT
    (Sun et al., 2009).


    Once a distance measure is established, the clustering of sequences using the
    calculated distances can be done. From least to most robust, common clustering
    methods are:


    +   * Single linkage—If sequence A is close to B, and B is close to C, then assume
    A and C are also close enough to be in the same OTU.

    * Centroid linkage—If sequence T from an OTU is roughly equidistant from all others
    in the OTU (i.e., it is the centroid) and sequence A is close to T, then assume
    A is close enough to all others in the OTU to belong. The “average linkage” method
    uses a similar process but calculates a statistical average among cluster members
    instead of using a specific centroid.

    * Complete linkage—Sequence A is only included in an OTU if it is close to all
    members already in the OTU.


    For an overview of clustering techniques, consult Felsenstein (2004). Once OTUs
    for a sample are established, many statistical tests can be applied to the OTU
    frequency data. For example, within a sample, the saturation of the data set can
    be estimated (i.e., will generating more sequence depth through additional DNA
    sequencing help to uncover more OTUs?). The diversity of the sample can also be
    evaluated using classic information theory techniques such as Shannon entropy
    (disorder) (Lin, 1991).'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Intra-sample comparisons of OTU distribution can be made to evaluate the similarity
    of multiple microbial environments.


    # 4.3.2 Data Size


    With the advent of high-throughput metagenomics, the traditional and robust methods
    for 16S distance and OTU calculation can prove too computationally costly for
    even large bioinformatics facilities. At the cost of some accuracy, QIIME (Caporoso
    et al., 2010) can be used to rapidly cluster OTUs based on pairwise alignments
    and single linkage. Removing exact duplicates and shorter subsequences from the
    initial data set can simplify the OTU creation task, as long as measures are in
    place to include these initially removed data in the final OTU frequency counts
    (through a mapping step, which links these data with the overall set of clusters).
    Another approach is to divide the initial sequence data into large superclusters
    (e.g., sequences within 30% distance), using a tool intended for transcript-sequence
    clustering such as CD-HIT (Niu et al., 2010). These superclusters can subsequently
    be processed with robust methods (and in parallel) without the risk of significantly
    affecting the final OTU assignments. A case study in metagenomics analysis methodology
    is presented in Chapter 11.


    It is worth noting that the 16S RNA sequencing stringent quality control (e.g.,
    clipping) should be applied to the incoming data set, because the individual reads
    cannot be assembled together and need to be analyzed individually. With large
    data sets in particular, there is also a significant risk that chimeric sequences
    (i.e., sequences artificially created by coligation of disparate sequence fragments)
    are likely to inflate the total number of OTUs detected. Chimeric sequence checking
    algorithms, such as UCHIME (Edgar et al., 2011), can be used to filter these out.


    # 4.3.3 Phylogenetic Sorting


    Once OTUs are established and population statistics calculated, insight into the
    possible ecological roles of the constituent organisms can be roughly inferred
    by linking the OTUs to the phylogenetic tree. Once the taxonomic distribution
    is available, one might see, for example, that families of sulfur-reducing microbes
    are prevalent in a particular sample. Traditionally, a phylogenetic tree would
    be constructed for related sequences, for example, using distance, parsimony,
    or maximum likelihood methods in the MEGA software (Tamura et al., 2011). Unfortunately,
    metagenomic data sets are too large to use in regular tree construction methods.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Genome-Associated Data ■ 59


    Specific computational methods for assigning OTUs taxonomy labels are varied,
    with the popular methods listed roughly from fastest to slowest:


    +   - Bayesian classifiers trained on a reference set—The Ribosomal Database Project
    (RDP) (Wang et al., 2007).


    +   - Alignment to reference 16S multiple sequence alignment—Greengenes (DeSantis
    et al., 2006) or Silva (Prusse et al., 2007) reference, using the ARB taxonomy
    software (Ludwig et al., 2004).


    +   - Parsimonious tree insertion—Also available from ARB (Ludwig et al., 2004).


    Reporting of the taxonomy to the user can be useful at different levels, depending
    on their interest: phylum, class, order, family, or genus. A caveat about such
    assignments is that different taxonomy databases exist within all of the aforementioned
    software, and therefore the resulting labels can differ, even when the same sequence
    data is used. Another caveat is that a growing proportion of the reference 16S
    RNA sequence data sets possesses (e.g., “uncultured Sulfolobales”), as metagenomic
    data sets are submitted to the public databases with very little annotation.


    Although not accurate, a method applicable to both 16S RNA and whole-genome metagenomic
    taxonomy assignments is pairwise alignment (e.g., BLAST) to a reference database.
    Strong alignments can be analyzed for their taxonomic distribution, and a consensus
    label can be inferred. This method is used for example by the MEGAN software (Huson
    et al., 2007).


    # 3.4.4 Assembly Quality


    Whole metagenomic samples pose some additional challenges to genome annotation.
    In many cases, only genomic fragments can be assembled, ranging from single reads
    to fragments with a size of a few hundred base pairs. Coding sequence prediction
    should be done using tools that do not require training sets, since the different
    OTUs in the sample may not have the same coding sequence model; they belong to
    a large number of species, possibly belonging to different parts of the phylogenetic
    tree. Another option is to put the contigs into taxonomic “bins” in a manner akin
    to OTU assignment. This can be done using BLAST searches or statistical techniques,
    such as classifiers based on N-mer frequency'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 60 ■ Genome Annotation


    distributions (McHardy et al., 2007). When 16S data for the same sample is available,
    concurrence of the genomic bin and the 16S OTU distributions can be used as a
    form of assembly quality control.


    It is also quite likely that a metagenomic analysis will contain at least some
    chimeric contigs. While phylogenetic analysis of the coding genes may indicate
    a taxonomic boundary in the contig, for smaller contigs this is difficult to distinguish
    from an instance of lateral gene transfer. One of the more complete genome annotation
    pipelines dedicated to metagenomic data is the Joint Genome Institute''s IMG/M
    (Markowitz et al., 2008).


    # 4.4 INDIVIDUAL GENOMES


    # 4.4.1 Epigenetics


    # 4.4.1.1 DNA Methylation


    Methylation of cytosine bases in the genome occurs mainly at CpG islands (Chapter
    3). These islands overlap frequently with transcription factor binding sites,
    and methylation has the net effect of suppressing gene expression. While methylation
    patterns may vary even between genetically identical siblings (Petronis, 2006)
    and between different cell types (which require different levels of transcriptional
    activity) in an individual (Illsworth et al., 2008). Sequencing of bisulfite-treated
    DNA yields dense read over methylation sites (Ku et al., 2011), and various statistics-intensive
    computational methods can be used to infer the methylation patterns. While there
    is not yet a standard file representation for DNA methylation data, tools such
    as the BDCP Web server (Rohde et al., 2008) can be used to generate data files
    in GFF3 format (www.sequenceontology.org/gff3.html). These can be used as custom
    tracks in the University of California, Santa Cruz (UCSC) genome browser (Chapter
    9) and also many other genome viewing tools. Due to the nature of the methylation
    phenomenon, public databases for methylation data (e.g., Negre and Grunau, 2006)
    are broken down by species, tissues, cell lines, and phenotypes.


    # 4.4.1.2 Histone Modification


    Various histone heterodimerize in order to form the nucleosome (Park and Luger,
    2006). Approximately 142 to 152 bases of genomic DNA wrap around the nucleosome,
    and nucleosomes are separated by about 50 bases of free DNA bound only to histone
    H1. Histone proteins'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Genome-Associated Data 61


    ![](img/7da802df4d7c0829a4a41adf9acaf30d_83_0.png)


    Figure 4.1 Visualization of quantitative epigenetic evidence in the UCSC Genome
    Browser. Peaks represent areas that are likely to be regulated by histone modification.


    subject to many chemical modifications, which either promote or suppress transcription.
    The genome portion, where the histone modifications make it “open” and transcriptionally
    active, is called euchromatin (Babu and Verma, 1987). Suppressing modifications
    cause the formation of tightly packed histone arrays, which are called heterochromatin
    (Babu and Verma, 1987). Euchromatic profiling for whole genomes is a relatively
    new field and poses many computational challenges. These features are largely
    large and discrete (on/off), the widely supported BigW and BigBED formats (Kent
    et al., 2010) are common representations for this type of data. These data are
    also available from public databases such as GEO (Barrett et al., 2011). The ENCODE
    Project Consortium (2011) has made available large amounts of quantitative epigenetic
    data, as well as postanalysis to call discrete peak regions. These data include
    mapped sequencing depth of chromatin immunoprecitated sequence (ChIP-Seq), as
    in Figure 4.1.


    # 4.4.1.3 Nucleosome Positioning


    The position of nucleosomes in a coding region can affect transcription levels
    via interference with transcription initiators (positions near the start site)
    and transcription elongation factors (positions downstream) (Pokholok et al.,
    2005). Large-scale physical elucidation of nucleosome positioning and modification
    in smaller eukaryotic genomes has been published (Pokholok et al., 2005; Westberger
    et al., 2009), including changes during organism life cycle. Bioinformatics approaches
    to nucleosome position prediction (e.g., Segal et al., 2006) generally revolve
    around the ease with which a given DNA sequence bends, since this correlates with
    propensity to wrap around a nucleosome. Results are typically stored as GFF3 files.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 62 Genome Annotation


    #  4.4.2 Single Nucleotide Polymorphisms


    #  4.4.2.1 Nomenclature


    Single nucleotide polymorphisms (SNPs, pronounced "snips") are single bases that
    differ in an individual relative to a reference genome. For any individual human,
    0.1% of the genome constitutes SNPs (Pushkarev et al., 2009), a relatively low
    number compared to most species. Within the coding regions, this drops to 0.0488%,
    with roughly 37% of those SNPs being homozygous (Pelak et al., 2010). Reporting
    an individual sequence is highly redundant, because of the relatively small number
    differences from the known reference. It is therefore more relevant to annotate
    the variants, using a common syntax. Variant calling software tools typically
    report in the Variant Call Format (VCF) devised by the 1000 Genomes Project (Danecek
    et al., 2001). These files are succinct but fairly imperceptible for human consumption.


    For reporting, the Human Genetic Variation Society has devised a standardized
    annotation shorthand (HGVS syntax) for describing SNPs and other sequence variants
    (den Dunnen and Antarakakis). In a coding region, a SNP can be described relative
    to the start of the coding sequence. For example, BRCA1:100A>G indicates that
    100 of the coding sequence for the BRCA1 gene has A as the reference base, and
    the called variant in an individual genome is G. When the gene context is clear,
    the gene symbol from the HUGO Gene Nomenclature Committee (Seal et al., 2011)
    can be omitted. Variants in the 5'' untranslated region (UTR) are described using
    negative positions; c.-15T>G indicates a SNP 15 bases upstream of the start codon
    (there is no position 0). Variants after the stop codon are indicated with an
    asterisk;*22T>C indicates a SNP 22 bases downstream of the third base in the stop
    codon. Variants in introns are indicated as downstream of the donor site position
    (e.g., c.256+2T>C is a variant in the second base of the donor site) or upstream
    of the acceptor site (e.g., c.257-20G>T is a variant 20 bases upstream of the
    acceptor site, or 18 bases upstream of the "AG" acceptor sequence.


    #  4.4.2.2 Effects


    The coding sequence effect of a SNP can generally be classified as:


    +   - Silent/synonymous—In a coding region, the base change does not affect the
    amino acid translation of the gene. While these changes are generally ignored,
    it has been noted in prokaryotes that either translation efficiency can be affected
    by codon usage (Plotkin and Kudla, 2011).'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Genome-Associated Data ■ 63


    +   - Missense/nonsynonymous—The amino acid translation will be different from
    that in the reference genome.


    +   - Nonsense—The SNP introduces an in-frame stop codon.


    +   - Read through—The SNP removes the reference stop codon.


    The HGVS syntax allows for the description of the variant at the protein level
    as well. A change of glutamine to arginine at residue position 488 would be “p.Gln488Arg”.
    Single amino acid IUPAC codes (LiBecq,1992) can also be used. SNPs can affect
    the protein translation in other ways as well. A SNP introducing a premature stop
    codon would be noted as “p.Gln488Ter”. Read through has the syntax “p.Ter797Cys*25”
    if the change creates a cysteine and the next in-frame stop is 25 residues (i.e.,
    75 bases) downstream.


    Some variants located in exons may create new (“cryptic”) acceptor or donor slice
    sites (e.g., Dunn et al., 2002). SNP variants in introns may also disrupt the
    donor or acceptor site. They may also, in rare instances, create a small novel
    exon inside of what would normally be an intron (also known as a cryptic exon).
    In the 5’ UTR, a SNP may disrupt the donor of a transcription factor or create
    a new preferred codon. In the 3’ UTR a SNP may disrupt the polyadenylation signal
    for a gene, also disrupt a microRNA suppression mechanism, and these are starting
    to be catalued (Bruno et al., 2012). All of these possibilities point to the importance
    of correct annotation of genes and associated control elements.


    VCF files from the 1000 Genomes Project SNP variants and small insertions or deletions
    (indels) reported in the literature are available from the NCBI’s dbSNP database
    (Day, 2010), with links to other resources such as information about related diseases.


    # 4.4.3 Insertions and Deletions


    # 4.4.3.1 Nomenclature


    Insertions are extra bases (as opposed to base substitutions) that exist in the
    individual but not in the reference genome. These are also reportable in VCF files.
    The HGVS syntax is “c.22_23insTTG” for the insertion of TTG between bases 22 and
    23 of the coding sequence. Deletions are the removal of bases in the individual,
    relative to the reference genome. The HGVS syntax is “c.22_26del” for the deletion
    of five (end–start+1) bases, or in the case of a single-base deletion the syntax
    “c.22del” is allowed. The sequence, which is deleted in comparison to the reference
    sequence, can optionally be appended to this syntax (e.g., c.11delT).'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 64 Genome Annotation


    Complex variants composed of simultaneous insertion deletion events are often
    referred to as indels. The HGVS syntax is “c.345_347delinsTTTG” for the replacement
    of three bases in the reference sequence by the four bases TTTG. A special case
    of an indel is an inversion, where the insertion sequence is of the same length
    as the deletion, and the two sequences are reverse complement. The HGVS syntax
    for this case is “c.665_670inv” for a six-base inversion.


    Because they span multiple base positions, insertions and deletions can be quite
    complex in their nomenclature. For example, “c.344_347+2del” is a six-base deletion,
    removing four coding bases and the (presumable) intron donor GT. The syntax “c.89-7*_89delinsGAA”
    is a five-base indel, just before the acceptor site of a 3’ UTR exon. A special
    case of insertions is duplication of short sequences from the reference genome,
    with the syntax “c.345_348dup.


    # 4.4.3.2 Effects


    In addition to the case effects as SNPs, insertions and deletions may cause the
    insertion or deletion of amino acids in the protein region. If the variant lengths
    are not multiples of three, translation frameshifts will also occur. For an example,
    the HGVS syntax is “p.Cys254Trps*” if the frameshift causes an amino acid change
    from cysteine to tryptophan, and the in-frame stop is 39 residues away. Listing
    the new stop location, making “p.Cys254Trps” also valid.


    # 4.4.4 Copy Number Variation


    In polyploid genomes, variants in the number of copies of a chromosomal segment
    occur in individuals (Freeman et al., 2006). These copy number variants (CNVs)
    may affect the genome via gene dosage effects and can lead to disease (Alman and
    Path, 2012). Methods for high-throughput sequencing of CNV calls are nascent,
    with most CNV data generated using comparative genomic hybridization (CGH) microglia
    (Alkan et al., 2011). These methods can be used to generate a relative copy number
    estimate (e.g., -1 or 1) over a region defined by the density of probes on the
    microarray.


    Where high-resolution sequence data is available, the Wiggle file format (Kent
    et al., 2010) is suitable for storing and subsequently plotting the data in the
    UCSC genome browser and others (see Chapter 9). Where CNV data is coarse-grained,
    the BedGraph file format (Kent et al., 2010) can succinctly represent the information
    and is accepted by many of the same browsers.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Genome-Associated Data ■65


    Public repositories for CNVs, large insertions and deletions, and trans-locations
    (i.e., structural variants), called dVAR and DGva, now being coordinated by an
    international consortium (Church et al., 2010). Cancer is generally the product
    of de novo mutations in particular genes, or the gain or loss of larger chromosomal
    segments. An excellent public resource for CGH information focused on cancer-related
    structural changes is Progenetix (Baudis, 2006).


