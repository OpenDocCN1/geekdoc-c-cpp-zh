- pgno: 137
  md: 'Because Ensembl’s tree-based method is computationally expensive, other techniques
    and data sets for the comprehensive determination of orthologous sequences have
    been developed. The InParano ortholog database (Ostland et al., 2010) includes
    over 100 species and bases orthology on a two-pass BLAST approach while using
    special scoring matrices. OrthoMCL (Chen et al., 2006) includes nearly as many
    species, but uses a Markov clustering algorithm. High-throughput computation of
    orthologs can be achieved using OrthoMCL or Orthologuge (Fulton et al., 2006).
    The latter uses a pairwise-comparison, supplemented by statistical analysis relative
    to remotely related (“outgroup”) genes.


    # 7.4.3 Xenologs


    Genes are not necessarily related via a common ancestor or a shared gene duplication
    event. In many instances, genes can also be acquired by an organism from another
    species via a horizontal or lateral gene transfer (HGT or LGT) event, which is
    most frequently observed in prokaryotes and protists (Andersson, 2005). Although
    the gene will evolve independently in the new host, a strong sequence similarity
    will exist between the genes in the donor and the recipient organisms. Famously,
    archaeal genes are the best match for almost 11% of the bacterial Thermot marit
    genome (Nelson et al., 1999), suggesting that a significant portion of the genome
    has been laterally acquired. HGT is known to occur almost all branches of life,
    with varying frequency. Annotation of xenologs can be important to determine such
    instances, because newly acquired genes will conflict with most assumptions that
    an annotator has in terms of homology-based annotation, as such orthology in related
    species.


    A database of precomputed xenologs for many species is available (Garcia-Valle
    et al., 2003). Methods for the detection of xenologs are primarily based on nucleotide
    sequence identity and relics of the old organization, such as codon usage. These
    are supplemented by various statistical approaches, such as Bayesian networks
    (Needham et al., 2007) and support vector machines (Burges, 1998). During the
    identification of genes that might have been introduced into an organism by lateral
    gene transfer, every method used must make a trade-off between false positives
    and false negatives. A promising recent development is a “multithreshold” approach
    (Azad and Lawrence, 2011), which first filters clearly atypical alien genes and
    clearly native genes, using conservative thresholds for parameters such as the
    base composition. Ambiguous gene sequences'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'are subsequently classified with less strict thresholds, after an examination
    of the nature of their flanking genes (native or alien).


    # 7.4.4 Analogs


    Analogs are genes that do not share a common evolutionary origin but perform similar
    biological functions, sometimes in a host–pathogen relationship (Sawitzke and
    Stahl, 1992). These gene sequences may contain similar protein domains based on
    the principle of convergent functional evolution (which of course leads to similar
    three-dimensional structures for similar gene function and thus requires similar
    amino acid distributions). In some cases where a gene has not been characterized,
    an analog may show up as the best match with a functional description.


    # 7.5 PAWISE ALIGNMENT METHODS


    Determination of homologs requires the use of pairwise sequence alignment methods.
    The available methods vary in their utility depending on many factors, such as
    uniqueness of the species under study and sequence quality. There are two measures
    of the successful of an alignment-search:


    +   1. Sensitivity (i.e., recall)—What proportion of the real hits are reported?
    (More sensitive means more real hits.)


    +   2. Selectivity (i.e., precision)—What proportion of the reported hits are
    real? (More selective means less false positives.)


    The classic trade-off in alignment searches is speed versus thoroughness. The
    speed and thoroughness of common alignment methods are examined.


    # 7.5.1 Canonical Methods


    The Needleman–Wunsch algorithm (Needleman and Wunsch, 1970) was the first theoretically
    optimal method to align two DNA sequences. Matches receive positive scores, while
    gaps receive negative scores. The method produces a global alignment, that is,
    from the first to last base of both the query and target. A global alignment tends
    to introduce numerous gaps between truly homologous sequences, lowering the alignment
    score significantly, for example, when the gene length has changed (i.e., inserting
    terminal gaps). Smith and Waterman (1981)'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Functional Annotation ■ 117


    produced an algorithm to find the best local alignment by adjusting the scoring
    of gaps in the optimal sequence derivation. This method produces alignment scores
    (and related statistics such as Z scores) suitable for comparing more distantly
    homologous sequences. The Smith-Waterman method was further refined by others
    (Altschul and Erickson, 1986) to match protein evolution more closely; inserting
    a gap in a sequence is costly, extending the gap is less so. This is known as
    affine gap alignment. Computing the optimal alignment solution, using a technique
    known as dynamic programming (Eddy, 2004), requires large-scale computation. Recently,
    specialized software implementations (Rognes, 2011) of the Smith-Waterman algorithm
    take advantage of the extended instruction sets of modern CPUs. This allows the
    execution of Smith–Waterman searches in roughly the same amount of time as heuristic
    methods that have traditionally been used for alignment practicality.


    # 7.5.2 Heuristic Methods


    Pairwise alignment methods like BLAST are called “heuristic,” because they achieve
    a speedup in database search through assumptions about what the final alignments
    will look like. The bias is generally towards moderately well-conserved sequences
    without shifts and with gaps that do not greatly affect the overall alignment
    length. When searching for strong homologs, these assumptions are very reasonable,
    but because many shortcuts are there actually more parameters to BLAST than the
    canonical Smith–Waterman method. To make the least number of assumptions about
    what the matches will look like, the Smith-Waterman method searches through a
    lot more data, being an exhaustive method. Tweaking the parameters of the BLAST
    tools can increase their sensitivity. This naturally lestens the runtime of the
    searches.


    Key parameters to BLAST for finding weak homologs are the word size, step size,
    gap score, and X drop-off score. The word size determines the exact match length
    that must be present to “anchor” the initial alignment. For DNA, the default minimum
    is 11 base pairs, while amino acid alignments are a “neighborhood score,” which
    defines how conservative amino acid substitutions should be tried in the anchors
    as well. The higher the neighborhood score, the more remote matches will be found.
    The step size parameter determines what fraction of possible anchors are examined.
    For example, setting the step size to 1 ensures every 11-mer in the query is tried
    (if the default word size of 11 is used), and setting'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 118 Genome Annotation


    the step size to 2 checks every second anchor. The sum of the word size and the
    step size determines the lower boundary; alignments with longest exact match smaller
    than this may not be found.


    Once initial alignments are found, ungapped extension of the alignment occurs.
    The X drop-off score determines how much this extension tolerates mismatches:
    the higher the value, the longer extensions will be. The final phase of the alignment
    allow extension and recalculation of the ungapped alignment using a method much
    akin to the canonical Smith-Waterman algorithm. Setting the gap open and gap extension
    penalties lower the default, particularly for DNA alignments, will allow longer
    sequences with more distant relationships between the sequences to be properly
    aligned.


    Conversely, any or all of these parameters may be tightened in order to reduce
    BLAST runtime. Other popular heuristic methods such as BLAT (Kent, 2002) and SSAHA
    (Ning et al., 2001) can be used to speed up BLAST-like alignments for single genome
    targets by concentrating further on primarily identifying highly homologous sequences.


    # 7.5. Scoring Matrices


    Regardless of whether canonical or heuristic methods are used to pair-wise alignment,
    every method requires a scoring matrix to determine the match and mismatch values
    to be applied to the sequences. For amino acid alignments in particular, the scoring
    matrix determines which amino acid substitutions are considered conservative (and
    hence highly) and are considered deleterious to function (and hence scored negatively).
    Two matrix series commonly used in bioinformatics are BLOSUM (Henikoff and Henikoff,
    1992) and PAM (Schwartz and Dayhoff, 1978). The matrices in these series are numbered;
    for example, BLOSUM62 is the default scoring matrix for BLAST amino searches.
    The BLOSUM series of matrices was constructed by looking at substitution rates
    of amino acids in ungapped blocks, which are contained within multiple sequence
    alignments of many protein proteins. The number of the matrix (e.g., 62 in BLOSUM62)
    indicates the percentage identity that was required in the block to consider it.
    As such, BLOSUM matrices with higher model substitutions in closely related proteins
    benefit. For example, BLOSUM90 is based on ungapped blocks from proteins with
    at least 90% identity. In the PAM matrix, the number indicates the number of random
    mutations introduced into every 100 residues of test sequences before net effects
    on amino acid substitution were calculated. In'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Functional Annotation ■ 119


    this case, smaller numbers model substitutions in closely related proteins better
    (i.e., PAM100 is more conservative than PAM200).


    The matrix used for pairwise alignment affects the raw alignment score, which
    in turn determines the e-value of the alignment. In cases where homology is being
    detected between closely related species (e.g., human and chimpanzee), more conservative
    substitution matrices will yield a more accurate alignment e-value. Specialty
    matrices can also be applicable in particular cases. In the case of distant homology,
    the OPTIMA (Kann et al., 2000) matrix provides improved alignment sensitivity,
    PHAT (Ng et al., 2000) and SLIM (Müller et al., 2001) provide better modeling
    of transmembrane protein substitution rates. This is because BLOSUM and PAM series
    are derived from globular protein data sets, which by their nature contain fewer
    hydrophobic residues than membrane proteins (which reside in a lipid environment).


    # 7.6 CONCLUSION


    Functional annotation is somewhat based on biochemical features of the predicted
    amino acid sequences of genes, and largely based on similarity to other proteins.
    Similarity can be based on overall alignment or domain features. Pairwise alignments
    and HMMs are normally used to make these determinations, respectively. The choice
    of method and scoring mechanism for pairwise alignment can affect the sensitivity
    of homology detection and enhance the quality of functional annotation.


