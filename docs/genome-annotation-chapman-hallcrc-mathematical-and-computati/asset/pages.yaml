    # 8.5 ENSEMBL


    The Ensembl Web site of annotated public genomes (Flice et al., 2010) is a well-used
    resource for genome biology, provided by the European Bioinformatics Institute.
    GMOD and Ensembl have some crossover; they both export their annotation information
    to the jointly developed BioMart software (Zhang et al., 2011). BioMart provides
    fast, intuitive queries over these genome-scale data sets. The Ensembl annotation
    tools can be downloaded for local installation, but GMOD remains the more common
    toolset by species-specific communities with emerging genomes. The key strengths
    of Ensembl lies in its scalability, variety of integrated analyses, and user interface.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 8.5.1 Analysis Management


    Ensembl''s codebase contains a set of Perl modules (Potter et al., 2004) that
    coordinate analysis tasks across machines, known as Hive. Hive interfaces to the
    commercial cloud computing tools Load Sharing Facility and Sun Grid Engine to
    execute analyses. Input and results from command-line analyses are shuffled between
    files and a MySQL database (www.mysql.com). The database has a particular data
    schema shared by all Ensembl instances. Given that the public Ensembl Web site
    manages a huge number of genomes and query traffic, load management of Web-based
    access is controlled at the server level using commercial information technology
    (IT) software (e.g., the Amazon Elastic Compute environment). For individual genomes
    though, the database setup and interface are engineered to serve a larger eukaryotic
    genome on a single computer.


    # 8.5.2 Structural Annotation


    Ensembl has two methods for providing structural annotation: for high- and low-quality
    genome assemblies. In the case of emerging (low coverage) genomes, genes may span
    multiple assembly contigs and may contain a significant number of sequencing errors.
    In order to predict gene structures, a BLAST-like search tool for very long alignments
    (Schwartz et al., 2003) is employed against the human genome. These alignments
    are fed to a reference scaffold (Kent et al., 2003) and custom scripts to ensure
    nonredundancy of exon assignments. Putative frameshifts in the exons are corrected
    using the human reference. As such, low-coverage structural annotation is done
    completely by homology.


    Structural annotation of high-quality assemblies employs many more steps. Before
    annotation begins, the genome is uploaded to a MySQL database according to the
    Ensembl database schema. Repeat masking and (species-dependent) ab initio gene
    predictors are then run. The ab initio predictions are not used as part of the
    structure determination steps that follow but provide an additional source of
    information for manual curation.


    Of primary importance to structural annotation is protein homology. The first
    stage of the structural annotation process is referred to as the targeted stage.
    When available, known protein sequences from the organism under study are aligned
    to genome using the intron-spanning GeneWise alignment algorithm (Birney et al.,
    2004) with strict identity'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'parameters. The next stage, called the similarity stage, applies the same alignment
    technique with somewhat less stringent parameters to the regions of the genome
    not mapped by the targeted stage. The relative contribution of the two stages
    is dependent on the amount of existing public data available for the species and
    its close relatives.


    The second part of structural prediction is cDNA alignment. Species-specific cDNA
    (assembled) and EST (single-pass) transcript sequences are aligned to the genome.
    If a cDNA alignment overlaps gene regions predicted in the protein-based stages,
    the nonoverlapping region from the cDNA alignment is annotated as predicted 5''
    or 3'' UTR. EST alignments have considerably less weight as supporting evidence
    in the annotation process due to their low quality.


    Finally, a nonredundant set of transcript models for a gene is produced by merging
    identical transcripts derived from different mapped proteins. All of the final
    transcript models are presented to the user in the final interface, some or all
    of which may represent actual biological transcripts.


    # 8.5.3 Functional Annotation


    A number of postprocessing steps filter and annotate the predicted genes. Ensembl
    accumulates evidence from tools mentioned in Chapter 7, such as SignalP and related
    tools (Emanuelsson et al., 2007), and InterPro (Hunter et al., 2011). These data
    are displayed in the product protein summary page, as shown in Figure 8.


    Noncoding RNA annotation is done using Rfsam (Gardner et al., 2011). A check is
    done for a starting methionine residue and a trailing polyadenylation signal (see
    Chapter 2). In eukaryotes, pseudogenes can be tricky to distinguish. Ensembl''s
    pseudogene prediction is based on matching one of the following:


