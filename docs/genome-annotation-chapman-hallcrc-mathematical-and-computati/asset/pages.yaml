    FIGURE 10.4 Galaxy graphical editor of the workflow extracted from Figure 10.3.
    New tools can be added from the left pane and existing steps/connections edited
    on the diagram. Labels can be edited in the right pane.


    The workflow, which was saved by the user in Galaxy, can be executed or edited
    graphically as in Figure 10.4. It is recommended to edit the workflow to include
    meaningful names for the workflow steps and free annotations (right side of the
    figure), which can contain additional documentation. This maximizes the usefulness
    of the workflow, revisited later, or by users with whom it is subsequently shared.
    The workflow can be edited later, for example, to reflect changing analysis needs.
    The layout of the steps, as well as the tool connection in the dataflow, can be
    directly manipulated by the workflow diagram. Workflow elements can be removed
    from the diagram and new ones can be added using the tool selection pane in the
    left-hand pane of the Galaxy interface (Figure 10.4).


    It should be noted that running sequence-based workflows on the public Galaxy
    server can quickly exceed the allotted disk quotas. Therefore, workflows can be
    exported and executed on a local installation of Galaxy, but one must ensure that
    the local installation has the same set of tools enabled as the public portal.


    # 10.3.3 Component Repository


    Creating a local installation of Galaxy requires at a minimum level of comfort
    with the command line, a multi-CPU computer, and significant available disk space
    to store reference databases and user analyses. Beyond avoiding quota limitations,
    a local installation allows the technically savvy user to deploy new file types
    and tools in the walled garden. The Galaxy Tool Shed (http://toolshed.g2.bx.psu.edu)
    is a repository of user-contributed noncommutative extensions to Galaxy. If maintained
    properly, a local Galaxy installation can'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Web-Based Workflows ■ 179


    stay better abreast of recent developments in sequence analysis techniques using
    Shed tools, rather than relying on updates to the main public portal.


    # 10.4 TAVERNA


    Taverna (Oinn et al., 2004) is a popular workflow editing and execution environment
    that focuses on choreographing Web-based resources, as opposed to Galaxy’s ability
    to use a fixed set of local analysis tools. The programming of Taverna workflows
    is done by explicitly building a graphical diagram. In particular, Taverna focuses
    on a particular set of Web-based resources, called Web services, which are formally
    described and easily accessed programmatically. At this point in time, most popular
    bioinformatics sites also provide access to a Web Services mode of their analysis
    tools. This avoids the user having to write “screen scraper” code to parse the
    human-readable versions of the information served by the site. A registry of bioinformatics-related
    Web services is maintained on the Web BioCatalogue.org (Bhagat et al., 2010).


    A Taverna Web workflow consists of four main component types:


    +   Workflows—This is typically a list of some sort, such as a spreadsheet of
    values (e.g., text file or Microsoft Excel file) or manually recorded values.


    +   Processors—These are the functions that transform data, such as running BLAST,
    or BioMart query, a BeanShell script (Java code snippet), an R script, or a call
    to a local command-line tool. Constant values are a type of processor too, usually
    shown in blue. A processor type that was recently added to Taverna is the REST
    API (Fielding and Taylor, 2002), which can be used to retrieve data by calling
    a carefully crafted Web address. For example, a particular Web address template
    can be used to retrieve a formatted database entry from UniProt, when given the
    UniProt ID (www.uniprot.org/uniprot/UNIPROTID.txt, where UNIPROTID is replaced
    with a real UniProt ID, e.g., P68431).


    +   Data links—These are arrows that direct the flow of data from the output of
    one processor to become the input of another.


    +   Workflow outputs—These are the results that users are interested in obtaining.
    Intermediate results from each stage of the workflow can be listed as well, but
    require more work to access.'
  merge: -1
