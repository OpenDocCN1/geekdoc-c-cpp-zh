    # 9.4 COMPARATIVE VISUALIZATION OF GENOMES


    Once a genome is annotated, it is often necessary to compare it to similar genomes.
    Comparing multiple genomes is a commonly used method for studying organisms, to
    elucidate the functions and evolutionary backlog of homologous genomes. Comparative
    genomics created the need for visualization tools that can display the synteny
    between two or more genomes. Genome browsers with facilities for comparative genomics
    built in are similar to traditional genome browsers in their user interface and
    display appearance, but generally have two additional key capabilities built in:
    a display feature for more than one genome in the display area, and means to visually
    express the relationship between the displayed genomes or genomic features. Genome
    browsers with comparative features can be roughly classified into three groups,
    according to how relationships between compared genomes are visually depicted:
    tools capable of displaying plots, linear representations, or circular representations.


    # 9.4.1 Dot Plots


    Two-dimensional dot plots have traditionally been used to visualize the relationship
    between two data sets, where one set is represented along the horizontal axis
    and the other set along the vertical axis. The horizontal and vertical axes represent
    a different genome or species, with the dots in the plot representing similar
    genomic elements. This display scheme is useful for showing the alignment of only
    two genomes, which can be a severe limitation. It is implemented in tools such
    as SyncMap (Lyons et al., 2008), VISTA (http://pipeline.lbl.gov), MEDEA (www.broadinstitute.org/annotation/medea),
    and GenomeMatcher (Ohtsubo et al., 2008). Gene duplication or rearrangement can
    be easily identified by local groups of dots, where each group forms a certain
    clustered pattern such as a straight line. Zooming and panning are all possible
    with these tools, allowing the user to navigate through different parts of the
    displayed genomes.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 9.4.2 Linear Representation


    Traditional Web-based genome browsers usually use the concept of a track to show
    a specific type of a genomic feature at single or multiple genomic locations.
    As a consequence, the vast majority of comparative genome browsers also rely on
    multiple linear tracks to represent multiple genomes and their features. Three
    genome browsers based on GBrowse allow all of these browsers to display additional
    genomes for comparison in a linear track representation. GBrowse_syn (http://gmod.org/wiki/GBrowse_syn),
    or the Generic Synteny Browser, can be used to display multiple genomes with a
    reference genome. The reference genome is displayed at the center, with additional
    genomes displayed above and below. Multiple sequence alignment, synteny, or collinearity
    data from other sources can be viewed via GBrowse-produced genome annotations.
    Users can change the central genome (i.e, the reference genome) as well the unit
    size for comparison display, meaning that genomes can be compared at the sequence
    level, gene level, or larger block level. The current standard GBrowse package
    includes GBrowse_syn tool kit.


    SynBrowse (Brendel et al., 2007) is a software tool within the GBrowse family
    for generic sequence comparison. This is achieved by visualizing genome alignments
    between different species and within the same species, if desired. The design
    goal of SynBrowse is to help biologists analyze synteny, gene homology, and other
    kinds of conservation across genomes, which makes it useful for studying gene
    duplication and the evolution of genomes. Data for SynBrowse are created in standard
    GFF2 format (http://gmod.org/wiki/GFF2), where target tags are used to denote
    the correspondence of a region in one region to another genome. The relationship
    between genomic features can be displayed at multiple levels, including "synteny
    block," "coding gene," and "coding exon.\ SynBrowse runs on top of BioPerl (Stajich
    et al., 2002) modules and also uses the configuration and utility modules of GBrowse.


    SynView (Wang et al., 2006) is another comparative genome browser that made possible
    by the use of the standard GBrowse distribution and a sophisticated standard GBrowse
    configuration file. Perl callbacks are used to draw a comparison view on the GBrowse
    details panel, based on the synteny data stored in standard GFF3 format. SynView
    is included in the GBrowse distribution. SynView is used in PlasmoDB (www.plasmod.org).'
