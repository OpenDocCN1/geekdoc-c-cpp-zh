    even those that might be separated from each other by a large number of bases.
    For example, in the "horizontal sequencing" view mode of Bluejay, a genome is
    displayed as an elongated string of base characters.


    Bluejay is written in Java and can be run on any computer with a Java installation
    (version 1.5 or later). It is a free package downloadable from the Bluejay Web
    site (http://bluejay.ucgary.ca). There are three options for download: (1) full
    application (2) Java Web Start can be run from a Web browser with Java plugin
