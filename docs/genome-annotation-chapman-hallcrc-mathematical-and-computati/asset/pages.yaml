  md: '# Dynamic Annotation Systems ■ 147


    9.2.1 University of California, Santa Cruz (UCSC) Genome Browser

    The University of California, Santa Cruz (UCSC) Genome Browser

    (Kent et al., 2002) was initially developed to make up-to-date versions

    of the human genome sequences available to the public as of the

    Human Genome Project (www.genome.gov/11006939) (International

    H Genome Sequencing Consortium, 2001). The UCSC browser

    ow utilizes a MySQL-based database to catalog the genomic informa-

    but earlier as a small script in the C programming language,

    which was initially intended to view splicing diagrams for gene predic-

    t in the nematode Caenorhabditis elegans (Kamath et al., 2003).

    The move to use MySQL was born out of the need to maintain program

    response times, while viewing significantly larger amounts of data in

    the human genome, the latest assembly of which is Genome Reference

    Consortium Human Build 37 (GRCh37, also known as hg19), released

    in February 2009.


    Over the years, the UCSC Genome Browser database (Dresler et al.,n2012) has been
    providing access to genome annotations from

    many external sources as well as from UCSC. Updates on the database in

    terms of new genome assemblies and annotations are provided annually

    the Database site of the journal Nucleic Acids Research (http://nar.

    oxfordjournals.org). These sequences and annotations have been gener-

    t from a variety of sources, including the UCSC annotation pipeline

    and collaborators from research centers worldwide. UCSC manages the

    oficial repository of sequence-related data from the Encyclopedia of DNA

    Elements (ENCODE) consortium (2004, Rosenbloom et al., 2012) and supports the

    ordination of data submission, storage, retrieval, and visualization.

    ENCODE started in September 2003 with the goal of identifying func-

    t elements in the human genome sequence.


    A unique feature of the UCSC browser is the main graph repres-

    t nucleotide sequences with the ability to load and display vari-

    ous annotations, referred to as “tracks.” The many tracks are

    separated into eight categories: mapping and sequencing, phenotype and

    disease associations, gene and gene prediction, messenger RNA (mRNA)\mand expressed
    sequence tag (EST), expression, regulation, compara-

    tive genomics, and repeats. The UCSC browser allows for

    visualization of the many tracks available on the database. mRNA and

    EST data can be obtained from GenBank, with alignment to the genomic'
  merge: -1
  img_proc: true
