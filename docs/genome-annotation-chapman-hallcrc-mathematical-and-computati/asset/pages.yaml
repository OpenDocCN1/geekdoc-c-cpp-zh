    # 3.4 PSEUDOGENES


    During the course of genome evolution, some genes were duplicated. Subsequently
    some of the copies encountered mutations, which often rendered them nonfunctional.
    The mutation events may lead over time to significant truncation of the protein
    product through the introduction of in-frame stop codons. Alternatively, mutations
    in the regulatory regions that control gene transcription or splicing can render
    a protein effectively untranslatable. In either case, the result is referred to
    as a pseudogene. Pseudogenes are a pervasive feature in many prokaryotes, appearing
    and disappearing quickly through genome evolution (based on the low number of
    pseudogenes that are shared across taxa). The exact reasons for prokaryotic pseudogenes
    to be retained are not known, but a higher number are found in recently evolved
    pathogens (Lerat and Ochman, 2005).


    In eukaryotes, pseudogenes can exhibit influence on gene expression, and play
    a role in the generation of genetic (e.g., immunological) diversity (Balakriev
    and Ayala, 2003). Functional roles for pseudogenes are implied by the fact that
    sequence divergence from the functional genes is lower than expected, and single
    nucleotide polymorphisms are biased toward synonymous versus nonsynonymous. Pseudogenes
    may no longer translate into protein, but may still affect their parent protein
    in some way. For example, makorin-p1 pseudogene exhibit severe developmental abnormalities
    (Yano et al., 2004), because makorin-p1 is expressed and confers stability to
    the protein-coding mRNA for makor1. This case gives credence to the idea that
    annotation of eukaryotic pseudogenes is important, because in some cases sequence
    variants of pseudogenes can cause phenotypic or other changes.


    Detection of inactivated, but otherwise intact, genes requires a thorough knowledge
    and annotation of the transcribed gene products and the'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Between the Genes ■ 45


    regulatory regions of a gene. For accuracy, this is primarily a manual task that
    requires judging evidence such as the disappearance of CpG islands or known TFSBs
    for a gene. Systematic detection of all other types of pseudo-genes is done using
    pairwise homology search of annotated genes against the genome. In order to properly
    identify pseudogenes, it is important to understand how they come about and consequently
    the structures they may have relative to their source gene. Pseudogenes may fundamentally
    be duplicates of genomic segments, or processed mRNAs, which were integrated into
    the genome via a reverse transcriptase. In case of genomic duplicates, the original
    exon segmentation is often fairly conserved. Searching for these pseudogenes requires
    either searching known protein-coding DNA sequences against the genome with an
    intron-tolerant alignment program or searching known exons against the genome
    with a regular BLAST-type search. Some paralogs are turned into pseudogenes by
    stop codons, which were introduced by point mutations. The older these pseudogenes,
    the more likely it is that pseudogene exons will have lost. In other instances,
    the gene duplication is only partial. In either case, the search algorithm should
    only expect conservation across part of the total length of the source gene.


    Processed pseudogenes on the other hand, which were derived from mRNA, have introns.
    Initially, truncation of the gene in this case is more likely at the 5'' end of
    the gene, because reverse transcription starts at the 3'' end of the mRNA. The
    mRNAs poly-A tail and polyadenylation signal are in fact sometimes retained in
    these pseudogenes as well. As pseudogenes age, 3'' sections are also potentially
    lost through genetic drift or recombination. The search for processed pseudogenes
    requires only a BLAST-type search of known genes against the genomic DNA. The
    set of known genes to search against depends on the level of analysis and available
    compute resources. The set of all annotated full-length genes is a clear starting
    point for a systematic revelation of gene duplicates (with the variations earlier)
    and processed pseudogenes. It is also possible that no intact source gene remains
    in the genome, in which case the inclusion of genes from related species may be
    used as the alignment template. The fact that protein-level conservation is often
    higher than DNA conservation in pseudogenes makes protein-level alignment to the
    genomic sequence desirable. The percentage identity cutoff for the correct annotation
    of a pseudogene is also an issue; as the percentage drops below about 70%, only
    the source gene family, not the particular source gene, may be evident without
    thorough phylogenetic analysis. Also, if only a'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'small portion of a source gene remains, it is unlikely to have any remaining
    biological function. Setting a minimum threshold for the percentage of source
    gene limits the annotation task, but in some species it can still be a daunting
    task; for example, in humans there are over 2000 ribosomal protein pseudogenes
    alone, with greater than 70% of the source gene length (Zhang et al., 2002).


    An additional complication for any type of pseudogene search is the potential
    for retrotransposon insertion in the middle of the pseudogene. This insertion
    may be the original cause of the gene disablement or a subsequent event. In either
    case, the result is two pseudogene fragments.


    # 3.4.1 Transposable Elements


    Transposable elements are relatively short genetic sequences, which are copied
    or moved around a genome. The two major groupings, based on whether the copying
    mechanism requires intermediate RNA or not, are retrotransposons and DNA transposons,
    respectively. DNA transposon sequences that have been characterized are typically
    labeled as “IS (insertion sequence) elements. Structurally, most IS elements contain
    a transposase gene, and flanking inverted repeats. These sequences are found throughout
    the tree of life. In eukaryotes, many transposase genes are inactive, due to nonsense
    mutations. Inactivation mutation can be reversed in some instances to create “domesticated”
    transposase genes used by the host genome (Volff, 2006). Retrotransposon activation
    can be linked to disruption of normal genomic function and is often linked to
    disease (Kazazian, 1998). On the other hand, IS elements can be quite active and
    constitute an important mechanism for prokaryotic evolution (Blot, 1994). In eukaryotes,
    DNA-transposons are linked to large-scale structural changes and epigenetic modifications
    (Feschotte and Pritham, 2007).


    # 3.4.2 DNA Transposons


    Identification of DNA transposons can be achieved by homology search against known
    transposase genes. Where the transposase has not been active for some time, protein
    similarity may be weak. In this, better sensitivity can be achieved using PSI-BLAST,
    an iterative form of the BLAST protein alignment algorithm. The Transposon PSI
    software (http://transposonpsi.sourceforge.net) identifies many types of transposable
    elements in this way. Identification of degraded DNA transposons can also be done
    using hidden Markov models, though care should be taken by the training of these
    models using special statistical techniques. This helps to'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'ensure that the model is not too tied to the training set (Edelfsen and Liu,
    2010). While most DNA transposons are so-called cut-and-paste elements based on
    their transposase-mediated relocation mechanism during cell division, two other
    types of DNA transposons also exist: helitrons and polintons (Jurka et al., 2007).
    Helitrons are structurally related to bacterial IS97 with a helicase gene and
    are therefore believed to transpose via the same mechanism, the so-called rolling
    circle. Helitrons are found in various eukaryotes and are particularly known to
    be active in plants such as maize, where helatron-derived sequences compose approximately
    2% of the genome (Feschotte and Pritham, 2009). Helitrons have a preference for
    transposing into other helitron copies, near but not within genes. Homology search
    and structural annotation can help identify these transposable elements.


    The third type of DNA transposon, polintons, is found throughout eukaryotes (Kapitonov
    and Jurka, 2006). Polintons contain all of the genes required for their transposition
    and are therefore also cis-synthesizing transposons. The set of genes includes
    a protein-primed DNA polymerase B, a retro intron, a cysteine protease, and an
    ATPase. This sequence is likely derived from an ancient plasmid, but the unique
    combination of cis-genes makes it relatively straightforward to detect by using
    protein-homology methods. Additionally, polinton flanking inverted repeats are
    typically several hundred nucleotides long, capped 5’ by AG and 3’ by TC.


    # 3.4.3 Retransposons


    Many transposable elements are mobile based on transcription back to DNA and insertion
    back into the genome; these are called reverse transcription or retransposons
    (Jurka et al., 2007). Because this action is copy and paste, rather than DNA cut
    and paste, the elements tend to proliferate and enlarge the genome. The main distinction
    between various retransposons is whether they are of retroviral origin.


    Retransposons of retroviral origin are typified by the presence of non-protein-coding
    terminal repeats (LTRs) flanking protein-coding genes. In fully active retroviruses,
    the 5’ flank consists of four regions: R, U5, PBS, and L. The R region is a short
    repeat found at both ends of the virus, used as a checkpoint during polymerization.
    The U5 sequence that follows is unique. This is followed by a primer-binding site
    (PBS), which is complementary to the 3’ end of a tRNA primer in the viral host.
    Sometimes the corresponding tRNA name is used in the nomenclature'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# 48 ■ Genome Annotation


    naming the virus. Finally, the 5'' leader region (L) contains a signal important
    for the packaging of the genomic RNA. The viral 3'' flank includes a polyuridine
    tract (PPT; i.e., polyA/G), which primes DNA synthesis during reverse transcription.
    This is followed by the proviral transcriptional primer U3 and finally R.


    The genes of any retrovirus are referred to as gag, pol, and env (Jurka et al.,
    2007), and are always found in this order. Gag proteins are cleaved, typically
    by a viral protease, into “mature” peptides forming essential virus particle structures:
    the matrix, capsid, and nucleocapsid. Pol proteins nucleic acid processing enzymes
    covering important roles in the life cycle of the virus, such as reverse transcription
    (polymerase), genome integration (integrase), and RNase H activity. The Env protein
    encodes the viral envelope protein.


    Integrated retroviruses that can be referred to as endogenous retroviruses (ERVs),
    with the integrated DNA referred to as a provirus (Gifford and Tristem, 2003).
    Retransposons near genes can affect their transcription. ERVs expression has also
    been linked to chronic diseases, their annotation is of more than academic interest.
    Depending on how long the retrovirus has been integrated into the genome, many
    parts of the original retroviral structure may be missing or mutated too to be
    easily detectable using a BLAST-based method. LTR_STRUC (McCarthy and McDonald,
    2003) can be used to detect retroviral-like elements, which are flanked by long
    terminal repeats (LTRs). Retrosceptor (Sperber et al., 2007) uses less stringent
    criteria, therefore false positives must be taken into account. A combination
    of all three methods may be the best choice to find a balance between sensitivity
    and specificity. The nonviral Penelope of retrotransposons also contains a distinct
    LTR that likely reflects its lack of integration and dependence on hostomerase.


    Retrotransposons with LTRs are either LINEs or SINEs (Jurka et al., 2007). Long-spersed
    nuclear elements (LINEs) in eukaryotes over 5 kb or greater genomic regions (Gogvaze
    and Buzdin, 2009), with a RNA polymerase 2 binding site 5'' of a high-specificity
    reverse transcription gene. Inactivated LINEs are often truncated at the 5'' end.
    The LINE may also contain an endonuclease with site-specific integration activity.
    The 3'' end contains a polyadenylation signal (AATAAA), usually followed by a
    G/T-rich region. There are three families of LINEs, based on their origin: in
    humans, only LINE1 elements are actively transposable, with LINE2 and CR1/LINE3
    elements mostly degraded (Gogvaze and Buzdin, 2009).'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Between the Genes ■ 49


    Short-interspersed nuclear elements (SINEs) are typically up to 500 bases long
    (Gogvadze and Buzdin, 2009), and are lineage specific. They do not have a protein-coding
    payload. The most famous of these are the primate-specific Alu SINE, which comprises
    over 10% of the human genome. This SINE is derived from the 7SL RNA, and most
    SINEs are a source of recombination events in genome evolution. Because SINE elements
    are lineage specific, homology search against databases of known SINEs is important.
    REPBASE (Jurka et al., 2005) is a database with the largest source of repetitive
    elements, submitted by researchers and derived from combing the literature. RepeatMasker
    (www.repeatmasker.org) allows one to use various alignment methods to match such
    repeat sequence databases. REPBASE''s maintainers also provide a repeat identifying
    system, Censor (Kohany et al., 2006). In either case, sensitivity thresholds play
    an important role in determining how sensitive repeat masking will be, especially
    when the organism being masked is distantly related to the well-characterized
    species from which REPBASE entries are derived. A database of known repeats is
    particularly useful for masking sequences during transcript or genome assembly,
    where there is no sequence information available to do de novo identification
    of repeats.


    # 3.5 OTHER REPEATS


    *de novo* methods for repeat identification are also essential, because the databases
    of known elements are not complete. The task of finding approximate substrings
    of length n or longer, with less than x% mismatch is computationally expensive
    on a genome-wide scale. EulerAlign (Zhang and Waterman, 2005) uses a data structure
    known as a de Bruijn graph to make the task time approximately linear to the sequence
    length. REPeter (Kurt et al., 2001) is able to handle errors or degeneracy in
    a repeat sequence based on a specialized algorithm, with runtime increasing significantly
    on the number of errors to allow. The RepeatModel software, available from the
    RepeatMasker Web site (www.repeatmasker.org), uses two different methods of *de
    novo* prediction and subsequently combines the results. In general, each method
    has strengths and weaknesses based on the most important factor to the software
    author (e.g., sensitivity, accuracy). It is preferable therefore annotate repeat
    elements in a genome based on the concurrence of two or more methods.


    Another popular tool for *de novo* repeat detection is PILER (Edgar and Myers,
    2005), which uses a unique filtering method for long local alignments. PILER can
    be used to annotate four types of repeats: dispersed'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 50 Genome Annotation


    family, tandem array, pseudosatellite, and LTRs. Dispersed families have three
    or more copies throughout the genome, flanked by unique sequences in each case.
    Although these are typically genetically mobile elements, they may also be from
    paralogous genes. A tandem array is a contiguous series of three or more copies
    of a motif within a chosen distance threshold. A pseudo-satellite has copies,
    but the copies do not meet the distance threshold for tandem repeats. Short repeats
    of 1 to 6 base motifs (also known as microsatellites) are most sensitively detected
    by dedicated software such as SciRoCo (Kofler et al., 2007).


    The overall diversity of repetitive elements is reflected in the fact that of
    2011, there are 75 “repeat” related terms in the Sequence Ontology (Eilbek et
    al., 2005). The TEclass can help annotate the de novo repeat analyses at the top
    level of DNA transposon/SINE/LINE/LTR. REPBASE provides a rough classification
    system for known repeats as well. Beyond these high-level annotations, more refined
    classification of repetitive elements is not well automated to.


