- pgno: 253
  md: '# Chapman & Hall/CRC

    Mathematical and Computational Biology Series


    The success of individualized medicine, advanced crops, and sustainable energy
    sources requires thoroughly annotated genomic information and the integration
    of this information into a coherent model. A detailed overview of this field,
    Genome Annotation explores automated genome analysis and annotation from its origins
    to the challenges of next-generation sequencing data analysis.


    The book initially takes you through the last 16 years since the sequencing of
    the first complete microbial genome. It explains how current analysis strategies
    were developed, including sequencing strategies, statistical models, and early
    annotation systems. The authors then present visualization techniques for displaying
    integrated results as well as state-of-the-art annotation tools, including MAGPIE,
    Ensembl, Bluejay, and Galaxy. They also discuss the pipelines for the analysis
    and annotation of complex, next-generation DNA sequencing data. Each chapter includes
    references and pointers to relevant tools.


    As very few genome annotation pipelines are capable of dealing with the staggering
    amount of DNA sequence information, new strategies must be developed to accommodate
    the needs of today''s genome researchers. Covering this topic in detail, Genome
    Annotation provides you with the foundation and tools to tackle this challenging
    and evolving area. Suitable for both students new to the field and professionals
    who deal with genomic information in their work, the book offers two genome annotation
    systems on an accompanying CD-ROM.


    ![](img/7da802df4d7c0829a4a41adf9acaf30d_253_0.png)'
  merge: -1
  img_proc: true
