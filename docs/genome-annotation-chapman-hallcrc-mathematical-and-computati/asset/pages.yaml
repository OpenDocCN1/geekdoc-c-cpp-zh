    sequenced on a single DNA strand (most likely also due to cloning arti-facts).
    This increased the error rate in the finished genome, as multiple instances of
    a single base occurring in sequence are generally best resolved by the sequencing
    of both DNA strands. The redundancy of a shotgun-sequenced genome is typically
    much higher than that of one sequenced by primer walking, with 8- to 10-fold,
    but sometimes more than 20-fold reported for the finished product.


    Ultimately, all groups attempting to sequence complete genomes settled on a mixed
    strategy, the bulk of the genome sequencing was accomplished through shotgun sequencing
    and the gaps were closed through primer walking on a set of large-insert clones.
    Figure 1.3 shows an overview of the mixed sequencing strategy.


    This approach yields genomic sequences at a much lower cost than the genomes finished
    entirely by primer walking, as only very few dedicated DNA sequencing primers
    are required with almost the same ultimate DNA sequence accuracy. Typically, in
    the case of a microbial genome with a size of 2 to 3 mega bp, between 200 and
    up to 500 gaps need to be closed by primer walking, primer-walking technology
    using large-insert libraries, such as cosmids, fosmids, or lambda clones were
    developed, which can be used to efficiently complement the shotgun sequencing
    results. Today,'
