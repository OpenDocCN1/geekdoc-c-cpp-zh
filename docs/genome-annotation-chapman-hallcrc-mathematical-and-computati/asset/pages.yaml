    file format-garden) automatically, and thus the nature of its contents. Galaxy
    uses a "walled-garden" approach to analysis; a specific set of file formats are
    accepted, and analysis options can only run with compatible files. These restrictions
    ensure that the analysis will always proceed smoothly, with the trade-off of making
    the integration of new tools and data types somewhat onerous (see Section 10.3.3),
    especially for nonprogrammers.


    Specifically in a genomics context, uploaded files are often implicitly tied to
    a particular genomic reference sequence. For example, when BAM short-read alignment
    file is generated by comparing next-generation sequencing outputs (ABI SOLID or
    Illumina) to a longer reference sequence, Galaxy requests this information (“Genome”
    at the bottom of Figure 10.1 in order to provide more appropriate options for
    the visualization and database cross-linking in subsequent steps.)


    Once an upload is complete, the corresponding history item in the right panel
    turns green. If a Galaxy tool (left pane) is selected and accepts the uploaded
    file type, a tool configuration form is displayed, as shown in the center pane
    of Figure 10.2.


    If the tool was not compatible with the uploaded data, the second dropdown box
    (BAM file) would be empty, and hence the tool (“pileup” in this example) could
    not be executed. After pileup is run, the user can employ other tools, which take
    a BAM file as input, and those that can take pileup-generated files as output.
    By default, the results of an analysis are not displayed. To visualize particular
    results, the user must press the eye icon in the upper right hand corner of the
    history pane of the desired step.'
