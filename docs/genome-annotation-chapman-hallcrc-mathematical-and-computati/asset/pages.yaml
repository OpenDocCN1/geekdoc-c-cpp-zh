- pgno: 105
  md: '# Visualization Techniques and Tools for Genomic Data


    # 6.1 INTRODUCTION


    Starting with the sequencing step, there are several stages involved in genome
    annotation including genome assembly, sequence alignment, phylogenetic analysis,
    and gene expression profiling, where the researcher might want to acquire a holistic,
    as well as detailed understanding of the genomic data that is currently being
    processed. Since human cognition capacity of any data presented in a textual format
    is relatively small, each stage in this sequence-annotation pipeline would undoubtedly
    benefit from the use of suitable visualization, which allows one to quickly receive
    a wealth of information, which is presented in a limited space (such as a computer
    screen). This is particularly true when one needs to compare and contrast multiple
    related sets or streams of data in a unifying context with valuable insight into
    the nature of the genomic data, a commonly required at all stages of gene annotation.


    Prior to discussing individual visualization techniques and tools available, we
    would like to note two overarching characteristics of genomic data that are highly
    relevant to their visualization. First, huge quantities of data need to be dealt
    with, as visualization tools are often deployed in large-scale genomic analysis.
    For example, high-throughput DNA sequencing produces large amounts of sequence
    data in a relatively short time. We also'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# 84 Genome Annotation


    need to access and utilize ever-increasing quantities of existing public data
    accessible from online data repositories, ranging from the DNA sequence files
    themselves to genome annotations, including taxonomic classifications. As a rule,
    some sort of semantic zooming mechanism (Loraine and Helt, 2002) is required to
    enable the user to explore the genome data in its entirety, as well as in specific
    detail. This in turn requires an underlying multiscale, or scalable representation
    of a complex data set, to accommodate the appropriate display at several levels
    of detail.


    Second, integration of heterogeneous types of genomic data is required, including
    (but not limited to) sequences, gene expression data, hierarchical ontologies
    and taxonomies, and textual annotation. This requirement directly influences several
    key design choices, with respect to data handling (loading and unloading), layout
    of visual elements, and data normalization for meaningful integration. In many
    cases, new visual metaphors and associated graphical representations are developed
    to visualize new types of data or to facilitate new kinds of analyses. However,
    due to the lack of standardized visual representations for these different data
    types (O''Donoghue et al., 2010), it is not a trivial task for users to learn
    when how to use a new integrative visualization tool.


    # 6.2 VISUALIZATION OF SEQUENCING DATA


    After base calling and quality value calculations by a sequencing machine, automated
    sequencing data processing begins. In de novo genome sequencing, sequence assembly
    is performed. In the case of resequencing projects, the reads need to be mapped
    to a reference genome. In either case, visual inspection of the contigs are aligned
    and assembled into larger structures (e.g., contigs and scaffolds) is beneficial
    in the interpretation and validation of the outputs, which were generated by automated
    read alignment and assembly programs. Recent advances in sequencing technology
    have resulted in unprecedented volumes of sequence reads, especially when dealing
    with the large numbers of short reads, which are now possible at a relatively
    low cost. With the emergence of these types of large-scale sequencing data, visualization
    plays a more important role than ever before. Existing alignment and assembly
    viewer programs have been expanded, and completely new visualization tools (e.g.,
    for next-generation sequencing [NGS] data) have been developed to cope with the
    computational challenges that this has posed (Nielsen et al., 2010).'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Visualization Techniques and Tools for Genomic Data ■ 85


    In the case of sequence assemblies, the basic function of read alignment and assembly
    viewers is to show the arrangement of the assembled sequence reads themselves,
    their alignment, and the resulting consensus sequence. In many of these viewers,
    sequence reads are shown as horizontally oriented strings of letters, which are
    stacked vertically to show their alignment. Thus the bases that constitute a column
    would contribute to the resulting consensus base, and strings of these consensus
    bases are shown at the top or bottom of the sequence reads. Sequence read viewers
    generally offer special display features to aid the user in analyzing the alignment
    results, such as hiding or ghosting the bases in a column to reduce visual clutter,
    highlighting the bases that are disagreeing with the consensus base using a different
    color, and representing quality values of the bases using gray scales.


    The option of viewing original trace data for base calling is usually available
    in most tools developed before NGS. For example, in popular read alignment and
    assembly viewers Gap4 (Bonfield et al., 1995) and Consed (Gordon et al., 1998),
    the trace viewing window can be launched from the usual alignment view by clicking
    the bases. Synchronization of cursor movement between the base view and the guiding
    line in the trace makes it easy to see how ambiguity in the primary data causes
    uncertainty in base calling and consensus bases. See Chapter 5 (Figure 5.2) for
    a screenshot from the Gap4 program showing a read alignment along with the trace
    data window.


    With the emergence of NGS, the primary DNA sequencing data is analyzed changed
    considerably. In the case of sequencing data generated by the Illumina Solexa
    Genome Analyzer (www.illumina.com) and the Applied Biosystems SoliD system (www.appliedbiosystems.com),
    there are only image data saved and no trace data exists. Traditional read alignment
    viewers cannot be used to display these images, partly due to storage and display
    speed considerations. Moreover, inspection of a single read trace is less significant
    for NGS, due to the typically highly redundant sequence coverage of NGS experiments,
    which means that a base in question can be compared to a large number of other
    bases at the same position in all of the aligned sequence reads. Some alignment
    viewers also offer editing capability, which allows a user to change bases that
    influence the consensus. In addition, the breaking or joining of contigs is supported.
    These tools are also known as “finishing” programs, the most widely used ones
    being Gap4 (http://staden.sourceforge.net) (Bonfield et al., 1995) and Consed
    (www.phrap.org/consed/coned.html) (Gordon et al., 1998),'
  merge: -1
  img_proc: true
