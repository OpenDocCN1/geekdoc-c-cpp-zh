    > Figure 7.1 An example of how a hidden Markov model (HMM) is built and how the
    matching is not pairwise (the first query instance matches even though VAST does
    not appear in the training set) as well as being position specific (the second
    instance does not match, because the LAST and VERY are mutually exclusive in the
    training set).


    Protein sequences can be compared to an HMM using the HMMer software (Finn et
    al., 2011) or a hardware accelerator such as the TimeLogic DeCypher system (Active
    Motif, Carlsbad, California). Version 3 of HMMer forgets the exhaustive Viterbi
    algorithm (Forney, 1973) used to optimally match the HMM and instead opts for
    a few assumptions to achieve 100-fold speedup in search time. A caveat of HMM3
    (Eddy, 2011) is that the heuristics that allow this speedup can'
