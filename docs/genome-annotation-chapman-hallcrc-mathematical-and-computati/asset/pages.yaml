  md: '# 128 ■ Genome Annotation


    # 8.2.2 Structural Annotation


    Before starting annotation, a genome can be run through a repeat masking (see
    Chapter 3) to clean up repetitive and possibly misassembled genome regions. After
    importing the genome sequence file, the first step in genome annotation is predicting
    the protein coding sequence (CDS) (see Chapter 2). For prokaryotes with high guanine
    (G) and cytosine (C) (G+C) content, simple open-reading frame (ORF) finding is
    sufficient due to the low false-positive rate (stop codons are rich in adenine
    (A) and thymine (T) [A+T]). For other prokaryotes, imported Glimmer (Delcher et
    al., 2007) CDS predictions are sufficient. Intergenic regions are subsequently
    scanned to determine if any small ORFs with strong homologs were overlooked.


    For eukaryotes, potential protein coding regions are initially determined by searching
    a public protein database (configurable) against the genome with a double-affine
    (intron-spanning) search. Each region''s segments are spliced together to find
    a putative messenger RNA (mRNA), which is subjected to functional analysis. A
    search is done for mRNAs that have a length that is a multiple of three, quality
    protein evidence, an in-frame stop codon, and an in-frame stop upstream of the
    first start codon of the best protein-level evidence (i.e., the start codon is
    unambiguous). The search for starts and stops can creep outside the original mRNA
    prediction into the genome if necessary. These “confident genes” are used to train
    ESTScan (Isel et al., 1999) (CDS only and UTRs) and then AUGUSTUS (Stanke et al.,
    2006) data files are then used to generate a final gene prediction. Figure 8.2
    the MAGPIE genome overview diagram, where each gene is the protein coding sequence
    extent (box arrow) and the mRNA extent (with terminal bars, with blanks in the
    introns.


    The overview diagram quickly indicates several important pieces of information
    about each gene predicted in the 1.02 Mb sequence, with a legend at the top of
    the image. First, the color of the box arrows indicates the degree of confidence
    MAGPIE has in the automated annotation. MAGPIE ranks evidence at level 1 (strong
    domains or likely orthologs found), 2 (other homolog found), or 3 (marginal evidence).
    Genes assigned to these levels are colored, cyan, or gray respectively. Second,
    whether start and stop codons are determined yet is indicated by the outline of
    the box arrow. Predicted genes with in-frame start'
