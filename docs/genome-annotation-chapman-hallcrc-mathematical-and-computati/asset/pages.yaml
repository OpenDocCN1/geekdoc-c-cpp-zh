- pgno: 217
  md: '# Analysis Pipelines for Next-Generation Sequencing Data


    # 11.1 INTRODUCTION


    The recent advance in high-throughput sequencing technologies and the availability
    of next-generation sequencing (NGS) machines have resulted in the creation of
    massive amounts of sequencing data in a relatively short period of time. As of
    early 2012, the three most widely used sequencing platforms were Roche 454 Life
    Sciences Genome Sequencer (www.454.com), the Illumina Solexa Genome Analyzer (GA)
    (www.illumina.com), and the Applied Biosystems (ABI) SOLID system (www.appliedbiosystems.com).
    There are also newer platforms, such as Polonator G007 (www.polonator.org), Helicos
    Biosciences Heliscope (www.helicosbio.com) and the Pacific Biosciences RS (www.pacificbiosciences.com),
    that are gaining popularity as yet another group of massively parallel sequencing
    machines. The sequencing methods of these in terms of their biochemistry, cost
    per base, processing speed, strengths, and weaknesses have been recently reviewed
    and compared (Mardis, 2008; Metzker 2010; Petterson et al., 2009; Sheure and Ji,
    2008).


    There are several features of these new sequencing technologies that have significant
    implications in data analysis, starting with genome reconstruction. Most importantly,
    short reads are produced in the range of around 400 base pairs from 454 sequencers,
    and 100 base pairs or less'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# 196 Genome Annotation


    from Solexa and SOLID machines. These short reads provide little information per
    read, causing difficulty in assembly, especially in handling those reads coming
    from repeat regions within the genome. To compensate for this shortfall, the NGS
    sequence reads requires a high degree of coverage over the size of the genome
    to be assembled, which results in a tremendous increase in read numbers that are
    produced for any particular genome. A single machine run can now yield 500 million
    individual sequence reads!


    Some of the new technologies are known to produce some characteristic systemic
    errors, such as difficulty estimating the length of homopolymer regions (i.e.,
    single base repeats) and increasing base call errors toward the 3'' ends of reads.
    All of the aforementioned sequencing technologies include an estimate of the confidence
    in each base call as a quality value. These characteristics of NGS data, which
    can be summarized as escalated ambiguity during assembly and exponential increase
    in the sheer amount of information to be processed downstream, pose computational
    challenges for NGS data analysis pipelines. More computationally intensive algorithms
    to cope with the ambiguity are needed, together with more computing power and
    ample storage space to accommodate sequence and other types of genomic data. The
    computational challenges of NGS analysis have been recently reviewed (Li et al.,
    2011; Pop, 2009).


    # 11.2 GENOME RECONSTRUCTION


    The first task in most NGS data analysis workflows is the reconstruction of as
    complete a genomic sequence as possible, beginning from the short individual reads,
    which by themselves are hardly meaningful. When it is known which organism the
    sequencing reads came from, they can be aligned to a previously sequenced and
    annotated reference genome, if one of the same or very closely related species
    is available. The goal of the alignment process is to determine for each read
    most likely source location within the reference genome sequence from which the
    read could have originated. The alignment approach is only appropriate for resequencing
    or comparing genetic profiles of closely organisms within specific species. For
    example, a study on genetic variation between Arabidopsis thaliana strains has
    been performed by NGS read alignment (Ossowski et al., 2008).


    When the organism being sequenced is not similar to any existing sequenced genomes,
    its genome sequence must be reconstructed from the collection of reads de novo.
    Although not computationally intractable, de'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Analysis Pipelines for Next-Generation Sequencing Data ■ 197


    novo genome assembly is much more demanding than alignment, with regard to algorithm
    complexity and computing resources. Because of this difficulty, novo assembly
    of short reads has mostly been applied to the reconstruction of bacterial genomes
    (Butler et al., 2008; Chaisson and Pevner, 2008; Warren et al., 2007) or mammalian
    artificial chromosomes (Zerbino and Birney, 2008). It should also be noted that
    alignment and assembly approaches are not always used in a mutually exclusive
    way. If certain regions of the new genome do not align to anywhere in the reference
    genome, those regions need to be assembled de novo.


    # 11.2.1 Alignment to the Reference Genome


    Although earlier alignment tools such as BLAST (Altschul et al., 1990), Clustal
    (Chenna et al., 2003), and T-Coffee (Notredame et al., 2000) have been popular
    for many years and are still in widespread use, their primary purpose is to search
    for relatively small homologous sequences in large databases or to align a given
    set of sequences for consequent of their evolutionary relationships. In contrast,
    short read alignment for NGS data requires mapping of these reads to the reference
    genomic of the same or very closely related species, with the goal of detecting
    structural variation or guiding genome reconstruction. Therefore, unlike classic
    alignment algorithms, most short-read alignment algorithms assume nonmatching
    bases stems from variation within a particular series rather than evolutionary
    substitutions. This subtle but important difference in underlying assumptions
    allows for implementations of relatively fast alignment algorithms for NGS reads,
    as fewer mismatches are normally permitted and initial candidate locations in
    the reference sequence can be quickly narrowed to a manageable number.


    Most short-read alignment seek seek to a balance between processing speed and
    alignment accuracy. As result, these algorithms generally adopt a two-step strategy,
    where the first step is devoted to finding a reasonably small number of potential
    locations in the reference genome to map each read by employing simple heuristics,
    such as exact match in a preset number of bases in the beginning of a read. Once
    the candidate mapping locations are identified, a more accurate but slow alignment
    algorithm, such as a variant of the Smith–Waterman algorithm (Smith and Waterman,
    1981), is applied on the set of sequences in a second step. The stringency of
    the heuristics applied in the first step can normally'
  merge: -1
  img_proc: true
- pgno: 220
  md: "# 198 ⁣ Genome Annotation\n\nbe\t  controlled by the users via a set of parameters,\
    \ such as the number of the bases to match and the number of mismatches allowed\
    \ in those bases.\n\nRecently, there has been proliferation of new software tools\
    \ for NGS short-read alignment. This wave of development was mainly motivated\
    \ by the inadequacy of traditional alignment algorithms to efficiently handle\
    \ the massive amounts of short reads, as well as increasing genome sizes for which\
    \ sequencing projects are undertaken. The previous generation of tools, for the\
    \ most part, have been designed to deal with smaller numbers of reads. Some of\
    \ the most widely used NGS alignment tools Bowtie (Langmead et al., 2009), SOAP\
    \ (Lin et al., 2009), BWA (Li and Durbin, 2009), SHRiMP (Rumble et al., 2009),\
    \ mrFAST (Alkan et al., 2009), mrfFAST (Hach et al., 2010), ZOOM (Lin et al.,\
    \ 2008), SSAHA2 (https://www.sager.uk/resources/software/ssaha2) (Ning et al.,\
    \ 2001), and Mosaik (http://bioinformatics.bc.edu/Mosaik). The performance of\
    \ several of these algorithms was recently compared, with respect to accuracy\
    \ based on numbers of correctly and incorrectly mapped reads and unmapped reads,\
    \ as well as runtime (Ruffalo et al., 2011).\n\n# 11.2.2 De Novo Assembly\n\n\
    One of the biggest challenges in reconstructing a genome sequence from short reads\
    \ without a reference genome is the need to resolve repeats, especially when the\
    \ reads are shorter than the overall repeat length or paired ends are not available.\
    \ Increasing the read coverage by oversampling has been the main strategy to cope\
    \ with this difficulty, which has resulted in very large numbers of reads that\
    \ assembly algorithms have to deal with in a single assembly. The degrees of coverage\
    \ over different genomic regions are not uniform, as systematic variability specific\
    \ to local genomic exists, depending on the sequencing technology used. For example,\
    \ a 100-fold difference in per-base coverage over Roche 454, Illumina GA, and\
    \ the ABI SOLID technologies for the same human genomic regions was reported (Harisimendy\
    \ et al., 2009). Because these variable coverage patterns are specific to the\
    \ respective sequencing technologies, studies of combining read data from multiple\
    \ sequencing technologies have been performed and reported to yield improved *de\
    \ novo* assembly results in comparison to those using only the data from a single\
    \ sequencing technology (Aury et al., 2008; Reinhardt et al., 2009). As a general\
    \ rule, it is always advisable to combine long- and short-read NGS technologies\
    \ for *de novo* sequencing projects."
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Analysis Pipelines for Next-Generation Sequencing Data ■ 199


    NGS assembly algorithms use a computational strategy to cope with the overwhelming
    complexity of processing large numbers of reads, especially in the usual first
    step of calculating overlaps among the reads. In the case of exhaustive overlap
    comparison, each read needs to be compared with all other reads, resulting in
    combinatorial explosion. For efficiency, most de novo assembly algorithms utilize
    the notion of k-mer to a certain extent. Instead of finding overlaps between reads,
    a set of reads sharing a same k-mer is found and only those reads that share the
    same k-mer are compared against one another to identify overlaps. This strategy
    drastically reduces the computational requirement when compared to all-to-all
    calculation of reads. However, the value of k should be carefully chosen, such
    that true overlaps are not missed and false-positive overlaps are minimized. In
    addition, most assembly algorithms also use compact mathematical graphs as underlying
    representation of reads, contigs, and their relationships.


    A number of de novo assembly software tools have been released during the last
    few years. The first group of assembly tools used are called “greedy algorithms,"
    where a given read is extended by adding the next highest-scoring overlap, and
    this basic operation is applied to joining contigs as well. Tools in this category
    include SSAKE (Warren et al., 2007), SHARCGS (Dohm et al., 2007), and VKACE (Jeck
    et al., 2007). The next major assembly strategy is layout–consensus (OLC), which
    works in three steps: (1) overlaps among all reads are calculated, (2) which are
    then laid out on a graph, where overlapping read nodes are connected, and (3)
    finally the consensus sequence is generated by analyzing the graph. For example,
    Newbler (Margulies et al., 2005), Celera Assembly (Myers et al., 2000) and its
    extension for 454 data called CABOG (Miller et al., 2008), ARACHNE (Batzoglou
    et al., 2002), and Edena (Hernandez et al., 2008) are assembly tools based on
    De Bruijn graphs (DBGs), where reads are first cut into k-mers, a DBG is formed
    using the k-mers, and then the genome sequence is inferred from the DBG. Assembly
    software such as EULER-USR (Chaisson et al., 2009), Velvet (Zerardino and Binney,
    2008), AByss (Simpson et al., 2009), ALLPATHS-LG (Gnerrea et al., 2011), and SOAPdenovo
    (Li et al., 2010) belong to this last category. Several reviews of assembly algorithms
    and tools have been published (Flicek and Binney, 2009); Li et al., 2011; Miller
    et al., 2010; Sheendure and Ji, 2008).'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 200 ■ Genome Annotation


    # 11.3 ANALYSIS PIPELINES: CASE STUDIES


    Over the few years, the Visual Genomics Centre at the University of Calgary has
    developed several pipelines for NGS data analysis. These pipelines, which are
    essentially tool integration systems tailored to specific genome projects and
    their analysis needs, exemplify different genome analysis applications for problems
    of high socio-economical impact that require NGS data to be solved.


    # 11.3.1 16S rRNA Analysis


    A small subunit ribosomal RNA (SSU rRNA) data analysis pipeline was developed
    to perform microbial community analysis in oil and sands coal beds. This pipeline
    follows the metagenomics analysis principles outlined in Section 4.3. Figure 11.1
    shows the flow of data in the pipeline. Raw 454 reads of 16S rRNA are subjected
    to stringent systematic checks in order to remove quality reads and minimize the
    effect of sequencing errors (Huse et al., 2007). Filtered sequences includes that
    (1) do not perfectly match the adaptor and primer sequences, (2) contain ambiguous
    bases, (3) have an average quality score below 27, (4) contain homopolymers of
    a length greater than 8, and (5) are shorter than 200 base pairs after clipping
    off the primers.


    ![](img/7da802df4d7c0829a4a41adf9acaf30d_222_0.png)


    FIGURE 11.1 16S rRNA analysis pipeline developed at the Visual Genomics Centre,
    University of Calgary. 16S rRNA samples are quality checked, partitions are created
    from unique sequences, OTUs are generated by clustering, and several diversity
    indices and taxonomic annotations are generated. (Courtesy of Xiaoli Dong.)'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Analysis Pipelines for Next-Generation Sequencing Data ■ 201


    The subsequent microbial community analysis is based mainly on Mothur (Schloss
    et al., 2009), a widely used 16S rRNA data analysis package. As Mothur in itself
    is not capable of handling NGS data, two major steps have been developed for the
    pipeline to handle larger data sets. In the first step, the data set is collated
    prior to sequence alignment to include only unique sequences. The clustering of
    redundant overlapping sequences is done by the CD-HIT-EST program (Li and Godzik,
    2006), at a 99% identity threshold. The representative sequences generated by
    the CD-HIT-EST program in each cluster are included in the final alignment. In
    the second step, the remaining unique sequences are preclustered by CD-HIT-EST
    again using 80% identity threshold to partition the data set into a series of
    smaller subsets. Then the distance calculation and clustering is performed in
    parallel over the smaller data sets instead of the entire data set, because this
    step forms the main processing bottleneck in Mothur.


    The pipeline then uses Mothur to generate operational taxonomic units (OTUs) at
    3% and 5% distances using the average linkage algorithm (Schloss and Westcott,
    2011). After grouping sequences into OTUs, several alpha diversity indices (Whitaker,
    1972) as well as the total numbers of OTUS are calculated for each sample. To
    explore potential relationships between microbial communities from different environments,
    similarities are calculated and a tree is built, which can subsequently be visualized.
    Differences and similarities are also explored by an ordination analysis, which
    reduces the dimensionality of the data to be compared from the number of OTUs
    generated to a small number that can be easily visualized. Nonmetric multidimensional
    scaling (Prentice, 1977) and principal component analysis (Wold et al., 1987)
    are the two methods that are being used in the pipeline for this purpose.


    Finally, the OTUs are given taxonomic annotation using three methods. A BLAST
    search against the nonredundant SSU reference data set of SILVA102 (Pruesse et
    al., 2007) using the Tera-BLAST algorithm on a TimeLogic DeCipher system (Active
    Motif, Inc.) is performed to identify similar sequences. The sequences are also
    searched against the RDP database and the SILVA reference database (www.mur.org/wiki/Taxonomy_outline),
    respectively, using RDP classifier, which is implemented as part of Mothur. The
    results of these taxonomic classification methods are provided as plain-text files
    and also as MEGAN-compatible files for visualization using MEGAN (Huson et al.,
    2007).'
