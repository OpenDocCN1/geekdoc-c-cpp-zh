  md: '# 210 ■ Genome Annotation


    established methods to analyze various types of data on their own, but the challenge
    is to unify these into a coherent model of an organism. For example, Bluejay offers
    a visually guided data exploration environment that can operate with other computational
    tools as well as integrate heterogeneous types of biological information using
    its unified visual representations. Seahawk is an application that provides access
    to Mobi-compliant Web services (Gordon and Sensen, 2007), which was described
    in greater detail in Chapter 10. Seahawk is incorporated into Bluejay as a single
    Java Archive file without requiring the use of specifically designed API for launching
    it from Bluejay to access Web Services. When a new release of Seahawk becomes
    available, the JAR file can be replaced. This approach makes effective use of
    distributed computational resources on demand rather than centrally installing
    all the services on a genome server browser.


