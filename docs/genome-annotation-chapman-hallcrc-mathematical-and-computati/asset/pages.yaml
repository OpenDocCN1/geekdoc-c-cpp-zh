    regulation and evolution (where gene expression data exist). Rich provision for
    personalization is available in Bluejay, including numerous display customization
    features and GPS-style waypoints for tagging multiple positions of interest within
    a genome for quick navigation to genomic features. Bluejay also embeds the Seahawk
    browser (Gordon and Sens, 2007) for the Moby protocol (BioMoby Consortium et al.,
    2008), enabling users to seamlessly invoke hundreds of Web services on various
    types of genomic data without any changes to the Bluejay code. Bluejay offers
    a unique set of customizable genome-browsing features, with the goal of allowing
    biologists to quickly focus on, analyze, compare, and retrieve related information
    on the parts of the genomic data in which they are most interested.


    Genome sequence data needs to be analyzed using an annotation pipeline, such as
    MAGPIE (Turinsky et al., 2005), in order to obtain meaningful visualization in
    Bluejay, as Bluejay requires a XML file with the genome annotation as the basis
