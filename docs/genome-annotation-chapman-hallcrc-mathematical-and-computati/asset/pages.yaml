  md: '# Coding Sequence Prediction ■ 17


    acid is highly correlated with the codon immediately to its 5'' end. for reasons
    that are not completely understood, certain synonymous pairs of codons are more
    common than others, and frequency is inversely correlated with translation efficiency.


    Given a training set of well-characterized and ideally confirmed coding sequences,
    gene prediction tools can be used to choose in new sequence the reading frame
    that best fits the training sequence composition and codon statistical models.
    It is important that, for prokaryotes, the training set comes from throughout
    the genome, a strong GC skew [C+G]/(C–G) usually, which corresponds with the origin(s)
    of replication.


    With any statistical model, false-positive and false-negative hits occur. The
    more representative the training set, the better the results become. Additionally
    the number of pseudogenes falsely being identified as CDSs can be quite high.
    It is for these reasons that usually multiple signal features are weighted and
    used to make the predictions, rather than relying on sequence statistics alone.


    # 2.3.8 Donor Splice Site


    The canonical intron starts with GT and ends with AG. Depending on the organism,
    1% to 2% of the splice sites may vary from this model, typically showing the sequence
    GC–AG or more rarely AT–AC (Clark and Thanaraj, 2002). Most software packages
    assume that the intron donor is GT, and therefore will not report noncanonical
    splice sites. An alternative, or so-called cryptic splice donor site, can be identified
    by mapping short reads or mRNA sequences to the genomic sequence. Compositional
    bias immediately surrounding the donor and acceptor sites occurs (Hertel, 2008).
    Gene prediction software may take this into account, based on the initial gene
    model training data provided.


    # 2.3.9 Intron Sequence


    The region upstream of the intron acceptor is typically CT-rich (the so-called
    polypyrimidine tract), that is preceded by an adenine (the intron’s branch point)
    somewhere 20 to 50 bases before the acceptor. In general, most of the introns
    will not have a base composition or codon usage that fits the CDS model. The correct
    identification of introns in the training data set for CDSs is critical for the
    correct intron prediction. In the case of retained introns, or cryptic splice
    sites, the compositions of the intron may be atypical, reducing the likelihood
    that it is automatically detected by codon usage or composition analysis alone.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# 2.3.10 Acceptor Splice Site


    The acceptor site for introns is almost invariably AG (with the rare AC exception
    noted earlier), and cryptic splice acceptor sites are roughly as common as cryptic
    donors. Consensus in the exon immediately following the acceptor is less common
    than at the donor site.


    # 2.3.11 Stop Codon


    The three "nonsense" or stop codons are TGA, TAG, and TAA. This signal is very
    straightforward to detect once the frame reading is established. A rare exception
    to this is programmatic frameshifting in the CDS (generally occurring in polyT
    areas), which must be detected with frameshift-compensating software such as ESTScan
    (Iseli et al., 1999). Another exception occurs in mitochondria, where TGA is used
    as a codon for tryptophan. Annotation of mitochondrial and chloroplast genomes
    must also consider that RNA editing (generally C→U) may occur, causing a disparity
    between the standard genomic sequence and the actual mRNA translated. There is
    growing evidence from 1000 Genome Project Consortium, 2010 and others that RNA
    editing is more widespread than originally thought across the eukaryotes, and
    not only in organelle genomes as previously thought. As no software tools exist
    that can be used to predict RNA-edited bases in eukaryotes, such determinations
    must be made using a combination of genomic and transcript data.


    # 2.3.12 3’ Untranslated Region


    Many gene prediction tools can be trained on 3’ untranslated region (3’ UTR) data
    sets to improve their accuracy, especially by avoiding the creation of "chimeric"
    gene predictions that merge neighboring genes into a single gene model. The 3’
    UTR sequence is definitely not random, nor should it be treated as an intron or
    intergenic region. Besides terminator signals, in eukaryotes the 3’ UTR is known
    to be important as a target for RNA silencing. 3’ UTRs may also direct subcellular
    localization of the protein, even when the translation is identical (An et al.,
    2008).


    # 2.3.13 Terminator


    In prokaryotes, the primary mechanism for intrinsic transcription termination
    is the presence of a G+C-rich sequence, which forms a stem with a small loop (also
    known as a hairpin) as single-stranded RNA.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Coding Sequence Prediction ■ 19


    Programs such as TransTerm (Jacobs et al., 2009) and GeSTer (Unniraman et al.,
    2002) can be used to automatically identify these structures, with the latter
    more sensitive to divergent structure and position of the terminator. The other
    prevalent termination method is rho dependent because of the protein involved
    in facilitating termination. Rho appears to bind C-rich sequence with little secondary
    structure, but otherwise consensus is known.


    Three different RNA polymerases (I, II, and III) are known to function in eukaryotes.
    Although no specific sequence is associated with termination for the first polymerase
    types, transcripts generated by RNA polymerase III are terminated in a manner
    similar to that of prokaryotes. For or more T''s in a GC-rich region are required
    as the termination signal, but the region does not form a stem-loop structure.


    Most MRAs in eukaryotes are polyadenylated, with notable exceptions, such as the
    histone genes. In this process the 3'' end of the transcript is replaced with
    20 or more adenosines. This replacement site is a consensus of AAAAA with 3''
    variation (Beauding et al., 2000) and can be used to boost the confidence that
    a prediction tool correctly identifies the last exon of the gene.


    # 2.4 CROSS-SPECIES METHODS


    The determination of gene structure through validation using existing genes and
    genomes falls somewhat between transcript modeling (empirical) and *ab initio*
    modeling (statistical). Homology modeling requires both empirical data, in the
    form of existing homologous data sets, and statistical data, in the form of phylogenetic
    inference. Cross-species validation can be based on either nucleotide sequence
    conservation or protein homology.


    # 2.4.1 Nucleotide Homology


    If a well-annotated genome from a closely related species is available, it is
    possible to essentially utilize the gene models from that organism and the functional
    annotations to assist in the annotation of most regions of the new genome. This
    process is essentially similar to that of the mRNA mapping process discussed earlier.
    This automatic annotation allows a focus on the traits that make the new organism
    interesting or unique (there must be something different in the new genome, otherwise
    why is it being sequenced?). Beyond point mutations that can be captured by mRNA-style
    mapping, the differences tend to include chromosomal'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 20 Genome Annotation


    rearrangements, gene duplications or deletions, inversions, and insertions of
    unique genes or stretches of genomic DNA. All of these variations from the already
    characterized genome require the calculation and visualization of large-scale
    genomic similarity (synteny).


    Some synteny-based gene structure predictors such as NGENE (Arumagam et al., 2006)
    do not rely on preexisting accurate genome models in related species. Instead,
    they leverage the data that most nucleotide substitutions occur in the third codon
    position, because such substitutions tend to not affect the amino-acid translation.
    In this way, gene structure alignment can be distinguished from overall genomic
    synteny because of the relatively high selective pressure on exons.


    The ratio of nonsonymous to synonymous codon rates for nucleotides (dN/DS) has
    also been used for the detection of pseudogenes. Pseudogenes are nonfunctional
    remnants of old genes in the genome that occur regularly in higher eukaryotes,
    and therefore their detection is important for proper gene annotation. Pseudogene
    identification is also supported by the lack of proper stop codons, frameshifts
    within the gene model, and lack of transcripts, when gene expression information
    is available.


    Using of both the nucleotide sequence conservation and protein homology methods
    of cross-species comparison, respectively, is the Pseudogene Inference from Loss
    of Constraint (PSILC) software (Coin and Durbin, 2004). When the pseudogene characterizes
    a Pfam (http://pfam.sanger.ac.uk) domain, PSILC calculates the probability that
    the nucleotide and amino acid substitutions are neutral with respect to the domain
    model. This is a more complex measure than just synonymous nonsonymous


    # 2.4.2 Protein Homology


    Pure protein-homology-based methods are very popular for gene prediction if only
    because of the wealth of protein data available in the public domain. Even when
    closely related species has a full genome available, one can expect the majority
    of genes in a new organism to have some homology to known genes. These may be
    from closely related species in the case of parallel evolution or distantly related
    organisms in the case of horizontal gene transfer (also known as lateral gene
    transfer or LGT). For prokaryotic genomes, this homology-based gene prediction
    is done using a standard sequence alignment algorithm such as BLASTP (Altschul
    et al., 1997) to identify the core of the protein, followed by a search for an'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Coding Sequence Prediction ■ 21


    in-frame stop codon choice can be supported by the same technique as *ab initio*
    prediction: the absence of rare codons, as well as the presence of -35 and -10
    signals.


    In Eukarya, a double-affine search is necessary. Parameterization of a double-affine
    protein-versus-genome search is more subtle than art mRNA-to-genomic alignment.
    This is because the protein alignment inevitably has small gaps due to protein
    evolution, and larger gaps representing introns. The number and size of these
    will depend on the evolutionary distance of the homolog and the characteristic
    intron size for the organism. Smart aligners will attempt to introduce long (not
    penalized) gaps at acceptor and donor sites in the genomic sequence. One aligner
    that takes this step further is GeneWise (Birney et al., 2004). GeneWise combines
    a pairwise matching algorithm with a Markov model not unlike *ab initio* predictors
    to help correctly align the introns into the alignment. This is especially helpful
    when the protein homology is weak, creating ambiguous choices for long gap insertion.


    Some aligners, including GeneWise, will provide the option of either global or
    local alignment. If the only source for determining gene structure will be the
    protein homology, a global alignment ensures that the whole protein is being correctly
    modeled. If there are other sources for exon structure (e.g., short reads), a
    local alignment can assist in transferring over protein domain information than
    just the stricter gene ortholog information from frameshifts to the public databases.
    Protein alignment tools, which compensate for genomic assembly errors, will also
    perform better when elucidating gene structures.


    Another consideration is the similarity matrix used for protein-level matches.
    By default, most search methods use BLOSUM62 matrix (Henikoff and Henikoff, 1992),
    which is lenient on substitutions between various amino acids to be considered
    a "match." If the database contains closely related species, better alignments
    and statistics can be generated using the BLOSUM80 or the BLOSUM90 matrices. Higher
    numbers are stricter on amino acid substitutions, as explained further in Chapter
    7.


    Another caveat about protein homology searches is the quality of the protein database
    used. The explosion in the number of species sequenced using next-generation DNA
    sequencing technology has inevitably led to poorer quality gene models being submitted
    to and accepted by databases and especially public data repositories such as GenBank
    (the submitter is all responsible for the quality of the database submission),'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Genome Annotation


    since less time or even no time is spent to manually examine the evidence for
    each gene predicted by automated methods within the sequence. While this caveat
    is well known for functional genome annotation (discussed later in this chapter),
    the number of chimeric eukaryotic genes due to false assembly is less known, when
    two or more neighboring genes are fused into a single gene model in the annotation.
    This problem can be especially caused by the misconfiguration of genome assembly
    pipelines. Another reason might be the statistical differentiation between splice
    sites and start-stop patterns in many genomic regions. To counteract the risk
    of carrying some gene structure into a related genome, it is important to consider
    the entire set of significant protein matches rather than just the top one presented
    in the output of the database search tools.


    # 2.4.3 Domain Homology


    Related to the overall field of protein homology searches is a more subtle technique
    known as domain search. The results of these searches provide better statistical
    matches than protein homology searches, when the gene query is only distantly
    related to known genes. In a domain search, the database that it is searched against
    a set of hidden Markov models (HMMs) such as Pfam or the contents of the entire
    InterPro database (Hunter et al., 2009). In these models, a protein family is
    represented by a matrix, with separate amino acid substitution rates for each
    position in the domain. This is in contrast to pairwise protein searches using
    BLOSUM matrices, which are based on the assumption that the substitution rate
    is the same across the whole protein. The advantage of position-specific searching
    is that it more accurately reflects the evolutionary history of a particular protein
    family, and match statistics will be better than a pairwise search against each
    individual member of the family. Of course, a double affine search is required
    when searching through eukaryotic sequences.


    Two caveats regarding domain searches are partial matching and spurious hints.
    Partial matching means that the whole structure of a gene is unlikely to be elucidated
    by a domain search in eukaryotes, because most protein domains cover only a portion
    of the total gene length. For example, the ATP-binding cassette (ABC) protein
    domain match from Pfam typically covers only 60% of a gene, making it likely that
    the alignment misses exons, which exclusively cover the remaining 40% of the sequence.
    As such, domain matches supplement, rather than replace,'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Coding Sequence Prediction ■ 23


    protein level searches. Spurious matches can also occur if small portions of the
    genome match highly conserved regions of a protein domain, overall similarity
    is low. It is therefore advisable to judge domain hits not just by using the E-value
    (expected value), but also the percentage coverage of the domain length.


    # 2.5 COMBINING GENE PREDICTIONS


    Another class of gene prediction programs is those that combine evidence from
    multiple prediction tools into one consensus result. These are mostly eukaryotic
    prediction tools, which can be subdivided into two main categories: explicit scoring
    and automatic scoring. For explicit scoring, the user provides their preferences
    in order to weigh/rank evidence as input, coming from multiple sources, such as
    manual curation, *ab initio* prediction tools, promoter searches, and information
    such as ESTs. Examples include AUGUSTUS (Stanke et al., 2006), JIGSAW (Allen and
    Salzburg, 2005), Eugene (Foissac et al., 2008), and Gene(Blanc and April, 2009).
    These programs generally require a training phase, during which a voting system,
    decision tree, or weight matrix is created. The advantage of this method is that
    the scoring system is relatively transparent and can be tweaked by the engine.
    On the other hand, automatic scoring systems generally require little to no training,
    relying on machine learning techniques to optimize weighting via dynamic programming
    or support vector machines and the like. The trade-off in using these tools is
    that the scoring systems to not be relatively opaque to the user end, making the
    tweaking of the results, if not as expected, more difficult. Examples of such
    programs include mGene (Schweikert et al., 2009), GeneMark (Ter-Hovhanniyan et
    al., 2008), Evigan (Liu et al., 2008), and fgene (www.software.com).


    In general, consensus prediction approaches, which employ multiple tools, produce
    more accurate any individual gene prediction program used. The main measures for
    accuracy cited in the literature are Sn (sensitivity, or 1 – False negative rate)
    and Sp (specificity, or 1 – False positive rate), often averaged out to an overall
    measure of accuracy. Tables comparing performance of prediction tools can be confusing,
    as these measures can be calculated (in descending order of accuracy) at the nucleotide,
    exon, gene, and transcript levels. Although almost every tool can claim excellent
    performance in at least one of these categories, none is accurate enough to be
    taken as-is for complete gene structure prediction. Manual curation of gene models
    is still necessary to obtain optimal results, as it is quite difficult impossible
    to capture the underlying biological knowledge that an expert'
