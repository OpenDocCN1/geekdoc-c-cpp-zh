    FIGURE 10.12 Input dialog for a Tavern workflow generated by Seahawk. With the
    spreadsheet format in the “Port description” box is expected.


    The ability to import spreadsheets also provides an opportunity for users to apply
    whatever spreadsheets programming knowledge they have. This can be used to supplement
    the analysis data in the demonstration or workflow. This spreadsheet plus demonstration
    hybrid approach to analysis automation provides an avenue for end-users to learn
    automation of genomic analyses in a practical way.


    # 10.6 CONCLUSION


    Genome annotation tools tend to produce a fairly fixed set of analysis outputs.
    Depending on the research question at hand, the available data may be insufficient
    to properly answer the research question. The custom analysis of genomic scale
    data by nonprogrammers is becoming viable through the evolution of workflow and
    workflow-by-example tools. Web-based workflow tools can be used by anyone without
    requiring a large local informatics infrastructure, though local installation
    options are available for some tools. This can increase the efficiency (Taverna)
    and allow for the inclusion of additional tools (Galaxy) that might not be available
    in the publicly accessible versions of the tools. Workflows provide several advantages
    over manual analyses: efficiency, research communication, process documentation,
    reproducibility, keeping results up to date, and the potential reuse and modification
    of components for related tasks.'
