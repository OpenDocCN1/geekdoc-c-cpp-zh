  md: '# Web-Based Workflows ■ 191


    as many output ports in a workflow as there are open Seahawk tabs. In the example,
    the workflow preview would contain one output instead of two. To fix this, the
    user could go back and launch the cross-reference search in a new tab instead.
    This would achieve a workflow with both expected outputs. Once the user is satisfied
    with the workflow, it can be saved and subsequently loaded into Taverna.


    Large-scale genomic data analysis is often somewhat trial-and-error; therefore
    making it easy to modify parameters in Taverna would be very useful to the novice
    user. These parameters, for example, might affect behaviors such as data filtering
    and decomposition. To this end, behavior parameters are clearly marked as external
    constants in Seahawk flows. Minimizing processor redundancy can help alleviate
    workflow crowding. This involves Seahawk tracking: (1) when an input has been
    used more than once; (2) when a filter is applied multiple times; (3) when the
    same object method is extracted for further processing multiple times; and (4)
    for filter negations (if-else).


    Since the data are semantically tied, Seahawk can generate meaningful labels for
    otherwise anonymous nodes in a workflow, such as inputs and outputs. Output values
    gleaned from the demonstration are also added as metadata to the workflow. By
    providing fields for additional metadata in the workflow preview (e.g., Figure
    10.9), Seahawk promotes readability and reusability of the generated workflows.


    The actual extent of the workflow is largely but not entirely out the control
    of Seahawk, because the workflow is eventually running using Taverna. Since Taverna
    is large-data agnostic, a user''s inability to input data into the generated workflow
    can be a serious barrier to success. To address this barrier, Seahawk includes
    extra processors in the workflows, simplifying data input. For example, a spreadsheet
    importer (visible at the top of Figure 10.12) allows users to specify their input
    lists within the familiar environment of rows and columns in Excel.


    Hints are provided in the Taverna “Port description” to tell the user what data
    to put in which columns (Figure 10.12). Without this importer, the workflow would
    require Mobi XML as input, sometimes users are unlikely to have on hand for their
    data of interest. A spreadsheet may contain a list of GI identifiers, to which
    the workflow will be applied. For example, this input list may be the result of
    a BioMart query on the Ensembl genome annotation page for the human genome. The
    Taverna workflow would allow the user to augment the Ensembl annotation for a
    large number of genes, without manually running each GI through a series of Web
    forms.'
