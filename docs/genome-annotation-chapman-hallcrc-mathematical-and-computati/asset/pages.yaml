    # 10.4.3 Workflow Repository


    In general, reusing and modifying an existing workflow as a basis for further
    genome annotation is as daunting task than developing a new workflow from scratch.
    The myExperiment.org Web site (Goble and De Roure, 2007) is a repository for bioinformatics-related
    workflows, including those written for Taverna and Galaxy. The repository can
    be searched by keywords, as the service provider needs to be accessed for a particular
    analysis step, or of an analysis tool, the free text descriptions of the workflows,
    which are provided by the authors. Users may wish to see if an existing workflow
    may do the task they seek to perform, avoid having to do any novo workflow programming.
    Alternatively, a workflow that performs a related task may exist that only require
    some minor modifications using the Galaxy or Taverna editor to achieve the desired
    results. In either case, the repository includes licensing and attribution information
    for each available workflow.


    # 10.5 SEAHAWK


    Seahawk combines the usability of Galaxy''s walled-garden portal approach with
    the flexibility and power of Taverna''s open Web service approach. This combination
    is achieved in Seahawk by using a Web Service called Moby (BioMoby Consortium
    et al., 2008). Moby consists of an open ontology of domain-specific data types,
    as shown in Figure 10.7, and a format (XML) to communicate these domain-specific
    inputs and outputs between Web services. These specialized Web services are called
    Moby Web services (BioMoby Consortium et al., 2008).


