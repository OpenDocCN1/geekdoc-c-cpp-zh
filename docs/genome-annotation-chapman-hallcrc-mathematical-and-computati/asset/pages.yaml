    focus by positioning them toward the center of the circle, while the nodes that
    are out of focus are placed off the center toward the circle boundary. The edge
    lengths are scaled exponentially based on their distances from the circle center.
    By providing a panning mechanism, hyperbolic tree viewers allow the user to bring
    different branches of a tree into the central focused area for a closer examination,
    while at the same time maintaining the context of the whole tree.


    # 6.4.2 Tree Visualization Tools


    There is no official standard file format for describing a tree. However, there
    exists a widely used format supported by most tree visualization tools: the Newick
    format. Also known as the New Hampshire format, the Newick format uses characters
    to name nodes, pairs of parentheses to represent the children of a node, and commas
    to separate rate nodes. A number can be attached to any node to indicate its distance
    from the parent node. A detailed description and examples can be found from (Felsenstein,
    1989), who was instrumental in popularizing the Newick format (http://evolution.genetics.washington.edu/phylip/newicktree.html).
    The Nexus format is another commonly used format, which includes a Newick-formatted
    tree together with meta-data support. This format was initially introduced by
    the Phylogenetic Analysis Using Parsimony (PAUP) (Swofford, 2002), a widely used
    package for the inference of phylogenetic trees.


    TreeView (Page, 1996) is a classic program for displaying phylogenies on Apple
    Macintosh and Windows PCs. It provides a simple way to view the contents of a
    tree in tree file formats, with the ability to read trees up to 1000 taxa. Supports
    are provided for native graphics formats (i.e., PICT on Macintosh and Windows
    Metafile on Windows) to copy tree images into other applications and to save trees
    as image files. Printing multiple trees on a page or a single tree over multiple
    pages is possible. Trees can also be edited. TreeView is not under active development
    anymore, but it was one of the earliest programs to use for quick tree visualization.
    TreeView X (http://darwin.zoology.gl.ac.uk/~rpage/treeview) was developed later
    as a version of TreeView to support the display of phylogenetic trees on Linux
    and other Unix systems.


    Dendrogramscope (Huson et al., 2007) can be used to visualize large phylogenetic
    trees and networks, often involving hundreds of thousands of taxa. It allows the
    user to manipulate and edit trees interactively, with'
  merge: -1
  img_proc: true
