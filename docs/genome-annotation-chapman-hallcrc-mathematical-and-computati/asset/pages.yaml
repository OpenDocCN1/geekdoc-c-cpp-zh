    and changed without writing any additional Java code.


    Building a type-safe workflow is not sufficient; the workflow must also be able
    to visually represent the story of the analysis. This can help users understand
    the correspondence between their demonstration actions and the resulting components
    of the workflow. This may in turn help learn the use of Taverna. Seahawk leverages
    the semantic information provided by Moby Web services; these domain-centric labels
    are attached to the various processors of the workflow. In Figure 10.9 each output
    port is named after its data type (e.g., String) and corresponding Web output
    field name (e.g., taxname). This is in contrast to the Galaxy examples, where
    data may be simply labeled "Output from Step 2."


    Seahorse also takes advantage of Taverna’s T2 language support for several types
    of annotations. Titles and free text descriptions can be added to a workflow when
    exported from Seahawk (Figure 10.9). Semiformal annotations are also provided;
    in case a user does not know what to use in the workflow, Seahawk provides an
    example value. The example annotation uses the value from the demonstration strategy.


    # 10.5.4 Taverna Enactment of Seahawk-Generated Workflows


    A unique feature of Seahawk among programming-by-demonstration systems is that
    it generates a preview of the workflow before saving it. The workflow preview
    image is currently generated by an automated call to a remote server. Without
    downloading and running Taverna, the preview allows users to quickly go back to
    adjust their Seahawk browsing or filtering if the workflow does not capture their
    intent.


    For example, a user examining Figure 10.9 would quickly realize his mistake if
    all of the analysis was done in one tab. As a rule, there are'
