- pgno: 132
  md: 'also generate matches to partial domains with significant e-values. As these
    domains are incomplete, they are most likely nonfunctional. Older HMMer searches
    and Viterbi alignments, such as those found in the toolkit included in the DeCipher
    system, will not report partial model traversals. In some situations, the partial
    matching may be useful, as the the identification of truncated gene prediction.
    For example, if the C-terminus of a predicted protein contained a strong partial
    match to the N-terminal domain of glycerol kinase, it is likely that the predicted
    and stop codon of the gene are incorrect or the genomic DNA sequence has been
    misassembled.


    Alternative methods for modeling domain constraints have also been implemented.
    RPS-BLAST (Altschul et al., 1997) can be used to search specially formatted position-specific
    scoring matrices, which are created from PSI-BLAST-derived models of protein domains.
    PROSITE (Hulo et al., 2007) provides both Gribkov profiles similar to HMMs but
    less probabilistic and regular expressions to smaller protein domains. The PRINTS
    database (Attwood et al., 2003) employs a search for multiple, closely spaced
    areas of high conservation, ignoring areas a larger HMM might loosely.


    The construction of domain models, regardless of the representation used, typically
    involves the automated detection of potential positive examples, followed by the
    manual curation of these examples. The model statistics are then calibrated as
    necessary to reduce false positives, minimizing negatives. Annotation of the function
    of the protein domain is also generally a manual process. Many different models
    could be derived for the same protein domain, depending on the source for positive
    examples, the underlying PM mechanism used, and the subsequent manual curation
    steps. Several domain databases exist, and large such as Pfam (Finn et al., 2010)
    and PANTHER (Thomas et al., 2003) have somewhat overlap deunify and somewhat distinct
    model sets.


    In order to unify these data collections, the InterPro Consortium (www.ebi.ac.uk/interpro)
    was created to correlate models from all of the main providers, assigning related
    models to named families and using a common identifier system. It is important
    to note that InterPro does not contain any domain models, rather it points to
    the models of the individual providers. As illustrated in Figure 7.2, InterProScan
    (Zdobnov and Apweiler, 2001) simplifies analysis by providing a unified search
    result from the various HMM, RPS-BLAST, and PRINTS searches.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Functional Annotation 111


    ![](img/7da802df4d7c0829a4a41adf9acaf30d_133_0.png)


    FIGURE 7.2 Unified, protein domain output from InterProScan, showing the different
    ways in which the same domain can be modeled.


    In the example shown in Figure 7.2, two models are grouped together in each of
    three categories. The identifiers on each match line identify the source database
    of the model. For instance, in the InterPro Match IPR005999 (Glycerol kinase),
    PTHR01096:SF9 is from the PANTHER database (Thomes et al., 2003), while the similar
    TIGR01311 is from TIGRFAM (Haft et al., 2003). The interpretation of these InterProScan
    results requires some observations. First, clearly different domain models provide
    different coverage of the 501 amino acid query sequence. In cases, the N- and
    C-termini are modeled separately. In other cases (PROSITE motifs PS00445 and PS00933
    in IPR018483), only a very small and highly conserved region is modeled. Second,
    it is not necessarily obvious that all of the InterPro categories (noted by IPR
    numbers) are interrelated. This is a possibly multifunctional gene? Good background
    knowledge or traversal of the IPR ID hierarchy is necessary to discover that all
    IPR terms fall into a tight branch of the protein domain hierarchy. Third, which
    is the most functional description that can be reasonably assigned to the query
    gene? Examining the text output from InterProScan is necessary, as it lists the
    expectations (e-values) for the domain matches. Glycerol kinase is the most specific
    term in the hierarchy, and the e-value for its functional assignment is 0, indicating
    that this is a strong match: glycerol kinase is therefore a reasonable annotation
    for the query protein. In cases where e-values are closer to 1, the interpretation
    is more difficult, especially because the different model sources do not necessarily
    share'
  merge: -1
