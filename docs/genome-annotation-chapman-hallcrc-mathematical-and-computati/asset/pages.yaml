  md: '![](img/7da802df4d7c0829a4a41adf9acaf30d_47_0.png)


    FIGURE 2.2 GBrowse view of spliced reads mapped to a genome. AUGUSTUS predicts
    an extra 3'' exon, supported by reads, but GeneMark also has some reads supporting
    an early gene termination in the intron (skipped exon).


    The *ab initio* predictors picked up strong acceptor (C) and donor (D) sites,
    but failed to determine that they belonged to different splice variants. Should
    the longer form of *z* be considered a splice variant with a skipped exon *y*,
    or is it a retained intron? The distinction is just a question of labeling.


    Retained introns occur when the splicing mechanism fails to remove the intronic
    sequence by design. These introns are generally of a length that is a multiple
    of three, so that the reading frame of subsequent exons is not disturbed by the
    translation of the retained intron. Figure 2.4 displays a case where both variants
    are about equally expressed, but only one is predicted by the *ab initio* modelers
    AUGUSTUS and GeneMark.


    The distinction between novel and retained introns is mostly one of perspective.
    If the most abundant mRNA includes the intron, other versions are retained. If
    it is more common to see the sequence as part of the mRNA, its skipping qualifies
    it as a novel intron.'
