    # 3.2.2 TFBS Location


    Transcription factors effect transcriptional regulation based on their interaction
    with the transcription machinery of the cell. This means that TFBSs are generally
    located either near the transcriptional start site in the genome (proximal TFBSs),
    or they are brought near the start site through the three-dimensional folding
    of the genomic DNA (distal TFBSs). In most proximal TFBS a number of "location-based
    clues" are available, which can be used to aid in their correct identification.
    First, the transcriptional start site (TSS) may be known through the mapping of
    mRNA data to the genome (see Chapter 2). This is especially true where deep short-read
    next-generation sequencing has been performed. Most proximal TFBSs tend to be
    within 100 bases (upstream or downstream) of this site (Xie et al., 2005). In
    addition, with widespread DNA methylation, TFBSs tend to be rich in cytosines
    and guanines. Therefore, the actual location of the TSS is unknown, proximity
    to guanine and cytosine (G+C)-retches of around 200 bp (also called CpG islands)
    can be a clue that a matrix match has found the true TFBS. CpG islands are hotbeds
    for DNA methylation, another layer of transcriptional control (see Chapter 4).


    The location of CpG islands is usually within 1000 bp of the start codon (Shimizu
    et al., 1997), however correct start codon prediction (see Chapter 2) can also
    be important to putative TFBS annotation. Consequently, genes with multiple real
    start codons (gene isoforms) may also have multiple sets of TFBS predictions.


    # 3.2.3 TFBS Neighborhood


    A transcription factor may act in concert with transcriptional cofactors to achieve
    specific activation or suppression of the transcription of certain genes. In this
    case, it can be expected to find particular combinations of'
