  md: '# Coding Sequence Prediction


    # 2.1 INTRODUCTION


    Gene structure prediction is the primary task in genome annotations, therefore
    much work has been put into developing methods to accurately make these predictions.
    Methods for the prediction of protein coding sequence (CDS) are tremendously varied,
    and their suitability depends on many factors such as biophysical parameters,
    for instance gu-cytosine (G+C) content of the DNA, the phylogenetic position of
    the organism, the types and quality of sequence available, and the number of novel
    genes expected. In prokaryotes and eukaryotes, the three broad approaches to coding
    sequence are largely supplanted, sta-tistical modeling of gene structure, and
    homology modeling. In eukary-otes, an additional consideration is the prediction
    of alternative splicing instances for the predicted CDSs. Each approach is addressed
    here from a perspective of the algorithmic design or sequence feature in order
    to provide knowledge applicable to many types of genomics data. The reader is
    encouraged to explore the citations of the original literature for details of
    how software implement these methods.


    # 2.2 MAPPING MESSENGER RNA (mRNA)


    Since CDSs are defined by the proteins they encode and the proteins are translated
    from messenger RNAs (mRNAs), mRNA transcripts are con-sidered the gold standard
    for gene sequence elucidation. In the past mostly involved Sanger sequencing of
    cDNA generated from mRNA, so-called expressed sequence tags (ESTs). This has largely
    been by the use of 454 (pyro-) sequencing. Sequence data generated by 454'
  merge: -1
  img_proc: true
