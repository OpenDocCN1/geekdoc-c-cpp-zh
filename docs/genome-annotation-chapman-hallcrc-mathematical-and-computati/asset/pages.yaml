    # 8.4 AGeS


    As sequencing bacterial genomes has become routine, the need for fast, automated
    annotations has spurred the development of many tools for their analysis. AGeS
    (Kumar et al., 2011) is a typical example of a prokaryotic-focused genome annotation
    tool.


    # 8.4.1 Analysis Management


    AGeS uses the OpenMPI library (www.open-mpi.org) to achieve parallelization of
    compute-intensive tasks, and manages the scheduling of tasks'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 138 Genome Annotation


    via the PBS (www.pbworks.com) queuing system. The state of analysis tasks and
    their results are stored in an embedded relational database management system
    (RDBMS) Apache Derby (http://db.apache.org), which requires little manual administration.
    This database works in conjunction with the Web server to provide a graphical
    interface for the job monitoring and results of the genome annotation process.


    # 8.4.2 Structural Annotation


    AGes builds on an existing annotation pipeline DIYA (Stewart et al., 2009), DIYA
    was customized to predict gene locations using Glimmer (Delcher et al., 2007),
    ribosomal RNAs via RNamer (Lagesen et al., 2007), and transfer RNAs using tRNAScan-SE
    (Lowe and Eddy, 1997). The simplicity of gene detection in prokaryotes means that
    a single method of structural prediction can be sufficient for most purposes.


    # 8.4.3 Functional Annotation


    The functional annotation part of AGes is PIPA. An automated ontology mapping
    generation algorithm maps various classification schemes into the GO. PIPA predicts
    protein functions by mapping GO terms to the disparate results of multiple programs
    and databases, such as InterPro and the NCBI''s Conserved Domains Database discussed
    in Chapter 7. A protein profile generation algorithm creates customized databases
    to predict specific protein functions, in order to improve annotation specificity.
    The algorithm was employed to construct the built-in enzyme profile database CatFam
    (Yu et al., 2009), which predicts catalytic functions described by EC numbers.


    The consensus annotation is based on an automated reconciliation of the integrated
    programs and databases. Calculating the agreement between various prokaryotic
    annotation pipelines can be done at multiple levels. A common method is to compare
    the EC or GO term mappings. Using this methodology, AGes annotations agree highly
    with those generated by popular Web-based systems such as IMG (Markowitz et al.,
    2010). The major differences between prokaryotic annotation systems tend to be
    in the functional description text and the degree of linking to external data
    sources.


