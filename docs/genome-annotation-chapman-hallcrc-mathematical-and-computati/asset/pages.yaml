    C/D box snoRNAs, when compared to their H/ACA cousins. The original C/D box snoRNA
    prediction tool was snoscan (Lowe and Eddy, 1999), which is still widely used.
    It is based on a probabilistic sequence model. The PLEX software (Kehr et al.,
    2011) rapidly predicts C/D box snoRNAs on a genomic scale, using a dynamic programming
    algorithm. The rate of false positives for this tool is very low.


