- pgno: 110
  md: '# 6.3 VISUALIZATION OF MULTIPLE SEQUENCE ALIGNMENTS


    A multiple sequence alignment (MSA) is an alignment of more than two biological
    sequences, where the sequences are in most cases presumed to have an evolutionary
    relationship. MSAs are computationally more complex than pairwise alignments,
    since finding the optimal alignment of a relatively small number of sequences
    of even moderate length quickly becomes computationally hard. That optimization
    is performed by employing various heuristics to reduce the computational complexity
    of calculating an alignment.


    An MSA is most often represented as a matrix of rows of sequences, in which each
    row is a sequence, and columns indicate positions that are equivalent across all
    of the compared sequences. A number of tools for visualizing MSAs have been developed,
    most of which use some variation on the basic display scheme of letters, with
    some visual elements (e.g., coloring or shading) to highlight aligned nucleotides
    or acids within the overall alignment (Procter et al., 2010). Different visualization
    techniques can be used, depending on the number of sequences being compared (i.e.,
    versus multiple). Some tools allow users to edit and annotate the alignment results.


    # 6.3.1 Pairwise Alignment Viewers


    When two sequences are aligned, two-dimensional plots can be used to represent
    their degrees and locations of similarity intuitively. Dot plots show the comparison
    of two sequences by placing one sequence along the horizontal axis and the other
    one along the vertical axis, and visualizing their relationships using dots on
    the two-dimensional space thus formed. When a base or residue of one sequence
    matches the other sequence, a dot is drawn at the corresponding point. In the
    idealized case of comparing two sequences that are identical over the two ranges
    plotted, a continuous diagonal line will be formed from one corner of the plot
    to the diagonally opposite corner. In general, a number of diagonal line segments
    (or isolated dots) of various lengths will be drawn, representing the locations
    of the matches. Dot plots can only be used for comparing exactly two sequences.
    An early description of the use of dot plots in comparing two sequences can be
    found in Maizel and Lenk (1981).


    One limitation of dot plots is their inability to express the difference between
    two segments of sequences, unless an additional visual cue (e.g., color) is used
    to differentiate between different levels of similarity. Percent identity plots
    (PIPs) show one sequence on the horizontal axis, while'
  merge: -1
  img_proc: true
