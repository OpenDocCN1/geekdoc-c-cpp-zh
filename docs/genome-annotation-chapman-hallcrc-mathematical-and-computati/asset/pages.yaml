    # 11.3.3 Gene Prediction


    To search for better enzymes to decompose plant material into biofuel, there is
    a need to predict the accurate locations, exon structure, and functions of protein-coding
    genes in a newly sequenced as well as previously published fungal genomes. A gene
    prediction pipeline integrating ab initio prediction tools with RNA-Seq and homology
    evidence was developed to predict gene models in fungal genomes. The design of
    the pipeline results from individual prediction tools or evidence sources to be
    easily added or removed. By testing several possible combinations, a minimal set
    of components was selected that works together and produces high-quality gene
    models within a week, a genomic sequence and RNA-Seq reads.


    Two ab initio prediction tools with demonstrated good results for fungal genomes,
    GeneMark ES (Ter-Hhovanyan et al., 2008) and AUGUSTUS (Stanke et al., 2008), are
    used as the main tools in the gene prediction pipeline. These two tools are mutually
    complementary in GeneMark ES does not need a training set of genes from the target
    genome, whereas AUGUSTUS requires training models for genes from the target genome
    or a closely related genome. GeneMark ES uses an iterative training strategy on
    the genomic sequence to predict a set of gene models. The AUGUSTUS training set
    can be used to optimize the transition and emission probabilities of the HMM as
    well as several other parameters of the prediction tool. Experimental hints about
    gene locations can also be used in AUGUSTUS to improve its prediction accuracy,
    as as those from protein, EST, or RNA-Seq alignments. In fact, RNA-Seq information
    is used at several steps of the pipeline. It is used for the generation of the
    initial models, which are used for the training of the HMM in AUGUSTUS, as well
    as for providing additional hints to AUGUSTUS while creating a set of predicted
    gene models. The final step of the pipeline, where the output models are scored
    and the best ones are selected, also uses this information.


    Figure 11.3 shows the data flow in the pipeline. The pipeline uses full-length
    transcripts, which were assembled into contigs from RNA-Seq reads using Velvet
    (Zerbino and Birney, 2008) to generate a set of initial gene models (contig training
    set) for training the HMM-based gene predictor AUGUSTUS (Stanke and Waack, 2003).
    AUGUSTUS is trained using the alignment of RNA-Seq contigs to the genome by exonerate
    (Slater and Birney, 2005). A consensus set of predicted gene models is generated
    from'
