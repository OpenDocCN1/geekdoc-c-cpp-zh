    # 11.4.2 Decentralization


    Most Web-based genome browsers are based on a centralized server model, in which
    primarily the server-side processing is used for database access and image rendering.
    At the request of the user, information flows from the genome browser, which generates
    the display as images and transmits them to the user for viewing. As the size
    of the data set increases and the browser functionality advances, this communication
    between the server side and the client side can become the bottleneck in the whole
    genome browsing experience as well as lead to the overloading of the server. There
    are two ways to tackle this problem: more client-side processing and use of distributed
    resources.


    The amount of client-side processing can be increased to reduce the computational
    burden of the server as well as minimize network traffic. An example for this
    is increasing the Asynchronous JavaScript and XML (AJAX; http://ajax.org) technologies,
    a collection of interconnected client-side Web development techniques. AJAX allows
    genome browsers to distribute the workload by allowing Web applications to retrieve
    data from the server asynchronously, without disrupting the behavior of the client-side
    display. This usually results in smoother navigation of a genome. JBrowse (Skinner
    et al., 2009) is an AJAX-based version of GBrowse. JBrowse uses AJAX to reduce
    the server load, smooth scrolling, and intuitive zooming. JBrowse contains all
    the features of GBrowse, while using the client-side Web browser to do most of
    the image rendering and display. Other genome browsers, including Annotation (www.annoj.org),
    X:map (Yates et al., 2008), and Genome Projector (Arakawa et al., 2009), use similar
    technologies to improve server response times and allow smooth navigation through
    genomes.


    Biologists have access to numerous distributed resources, such as biological databanks,
    software applications, and Web services. Nevertheless, when they need to investigate
    a particular organism or a set of related organisms, these resources will prove
    useful only if they are integrated and linked together in a way that is conducive
    to the study. There are'
  merge: -1
  img_proc: true
