    trawling the mailing list archives for the tools, most of the tool suitability
    and parameterization questions can be rapidly answered.


    Once contiguous sequences representing mRNAs have been assembled, they can be
    aligned to an already existing reference genome. The intron-exon structure of
    the genes can be revealed through the use of a double-affine, also known as intron-tolerant,
    alignment algorithm (Garber et al., 2011). Double-affine searches have a high
    penalty for small gaps (insertions, deletions, or sequencing errors) and a smaller
    one for large gaps (introns). This promotes the correct alignment of cDNA sequences.


    Aligning across introns can lead to slight misalignments. For example, given alignment
    of the form:


    ```

    CATCTTGGTACACGCTGCTGGAGAATGCATCCACTAGAAGCAACATCAGGATC

    |||||||||||||||||||||||||||||||||||||||||||||||||||||||

    CATCTTGGTACACGGCGTGC---------------------------------------

    ACATTCAAAAAAAAAAAAAAAAAAAAGAGAAGAAGAATTAGCAAGAAAGGCGTATGC

    |||||||||||||||||||||||||||||||||||||||||||||||||||||||

    ----------------GCAAGAGGCGTATGC

    ```


    The read could have just as easily aligned with the G at the start of the second
    exon of the first exon without disturbing the protein translation. This would
    have maintained the splice acceptor AG that is almost universal in the species
    being studied. Good software should take preferred splice sites for a species
    into account in order to provide accurate alignment.


    Alternatively, the short reads can be mapped back to the genome using a fast short-read
    alignment tool. While many alignment tools exist, of particular note are those
    that are consistently updated and support the popular SAM (Sequence Alignment/Map)
    file format for read mapping, especially BFAST (Homer et al., 2009), BowTie (Meaghed
    et al., 2009), and MosaicAligner (http://code.google.com/pmosaik-aligner). A subcategory
    of short-read alignment tools, important for mapping multiple genes, are gapped
    alignment tools such the Burrows-Wheeler Aligner (Li and Durbin, 2010), GEM split-mapper
    (http://gemlibrary.sf-net), Karma (http://genome.sph.umich.edu/wiki/Karma), and
    TopHat'
