  img_proc: true
- pgno: 38
  md: '# Genome Annotation


    # 2.3.6 Start Codon


    In eukaryotes, this sequence is almost universally ATG. In prokaryotes, ATG is
    in most instances the dominant start codon (approximately 80%), but GTG and TTG
    can also be used in descending order of frequency. Although there are exceptions
    or substitutions to these start codons in some species, they are so infrequent
    that no automated gene prediction system considers them a priori. Evidence for
    alternative start codons usually comes from mass spectrometry data or de novo
    peptide sequencing and has to be entered manually when the genome analysis pipeline
    is being configured.


    # 2.3.7 Protein Coding Sequencing


    The determination of the protein coding sequence (CDS) is of course at the heart
    of every gene-prediction system. Because the sequence is constrained by the codon-usage
    table and the protein to be produced, strong signals exist that can be predictive
    of CDS regions in a genome. Different feature sets of the CDS are used in the
    statistical models underlying various prediction programs, but they roughly fall
    into two categories: sequence base composition and codon usage bias. Sequence
    base composition in many prokaryotes can be used to predict the coding strand
    in the genome, where the strand containing greater than 50% A+G is usually the
    protein-coding instance (to our knowledge only with the exception of retroviruses).
    Unusual G+C composition can be used to filter genes, which might be horizontally
    transferred from another species, and transposable elements. None of these sequences
    will follow the general statistical distributions for the reading sequences in
    a given species.


    For eukaryotes, it is also suggested to separate the coding sequence sets into
    bins, based on their G+C content. The reason is that sequences in these bins can
    show subtle differences in their other sequence statistics, leading to systematic
    underreporting of some CDSs, if not explicitly modeled. This percentage G+C bins
    (called isochores) can be defined manually or automatically by some programs,
    such as IsoFinder (Oliver et al., 2004).


    Even without comparison to databases of known proteins, it is possible to some
    degree to predict the coding sequence based on the low occurrence of rare codons.
    This is particularly useful for the determination of the correct start codon for
    the CDS, which is species specific. The codon adaptation index (Sharp and Li,
    1987) is another statistical measure of codon usage that captures the fact that
    the codon used to encode an amino'
