- pgno: 119
  md: '# Visualization Techniques and Tools for Genomic Data ■ 97


    measurement method. The general goal of gene expression profile analysis is to
    find a set of genes that are overoverexpressed or underexpressed under some conditions,
    for example, in a disease model or in response to a prescribed treatment. The
    difficulty with accurate detection of these target genes arises from overwhelming
    amounts of data to be analyzed simultaneously. It is not uncommon for a single
    data set to contain profiles of more than 10,000 genes. The same kind of data
    set could be generated under different experimental conditions or at certain time
    intervals over a period of time, thereby further increasing data sizes. Clustering
    analysis and visualization are two key approaches to tackle this data interpretation
    problem. A review of gene expression data analysis and visualization can be found
    in Quackenbush (2001).


    # 6.5.1 Expression Data Visualization Techniques


    Gene expression studies usually produce multivariate data, which require efficient
    use of the two-dimensional space to visualize the results. There are many visualization
    techniques, three of which are frequently used in gene expression data visualization:
    heat maps, profile plots, and scatter plots. Of these the generation of heat maps
    is the most commonly used gene expression visualization method mainly because
    it is relatively easy and straightforward from raw data. Clustering is usually
    the first analysis applied to most kinds of gene expression data in order to detect
    groups of genes that behave in similar ways under multiple experimental conditions.
    A comprehensive list of visualization tools for multivariate data, including gene
    expression data, is available from Gehlenberg et al. (2010).


    Heat maps are created by first defining a color gradient to represent expression
    levels and subsequently drawing a small grid for each gene under the experimental
    condition or at a time point. Essentially a heat map is a matrix of grids, where
    each row corresponds to a gene and each column corresponds to an experimental
    observation, be a tissue, disease condition, or a time point. Thus the size of
    the heat map increases quickly, proportional to the number of genes being observed
    at the same time. Rows of a heat map can be reordered to reflect the similarity
    between groups of genes, for example, to show genes clustering together as a result
    of hierarchical clustering. It is also simple to add annotations regarding gene
    names and experiments using the space around the matrix. Despite these advantages,
    heat maps are not really the most intuitive visualization method, since grid colors
    always need to be mentally'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# 98 Genome Annotation


    to the direction of regulation (i.e., up or down) and magnitude of expression
    levels for any interpretation of observations to occur, and there is no agreed-upon
    standard coloring scheme at this point in time.


    Profile plots are a common way to visualize high-dimensional data in a two-dimensional
    space. To plot n-dimensional data points, n vertical and equally spaced lines
    are drawn. A point in an n-dimensional space is represented as a line graph, connecting
    n vertices on the n parallel lines, where the vertex positions correspond to the
    n coordinates of the point. This visualization method enables the user to perceive
    the expression trends of many genes at the same time, as the vertical positions
    on the parallel lines can be easily compared. This method facilitates the comparison
    of expression levels of a set of genes under different experimental conditions
    (e.g., normal versus diseased tissue) or over a course of time. It is also possible
    to quickly find a set of genes that are upregulated or downregulated at certain
    experimental conditions of time points. The biggest limitation of profile plots
    is that the line graphs tend to severely overlap, creating visual clutter, which
    may make it hard to visualize expression levels of even a moderate number of genes
    at the same time. As a solution to this problem, coloring schemes can be adopted
    to help distinguish graph lines. Figure 6.7 shows expression profile plots generated
    after clustering genes in the TIGR MultiExpression Viewer (MeV) (Saeed et al.,
    2003).


    In a scatter plot'
