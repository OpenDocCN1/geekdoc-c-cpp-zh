    # 9.2.4 Generic Genome Browser


    The Generic Genome Browser (GBrowse) (Stein et al., 2002) is one of the most widely
    used software tools among developed from the Generic Model Organization Database
    Project (GMOD) (http://gmod.org). At the time of writing, according to the GMOD
    Users page (http://gmod.org/wiki/GMOD_Users), there are more than one hundred
    databases or organizations that use GBrowse in one form or another. Some examples
    of the users are *Saccharomyces* Genome Database (SGD; http://yeastgenome.org),
    WormBase (http://wormbase.org), FlyBase (http://flybase.org), Informatics HapMap
    Project (http://mipmap.org), Mouse Genome Informatics (MGI; http://informatics.jax.org).
    The *Arabidopsis* Information Resource (TAIR; http://arabidopsis.org), Gramene
    (http://gramene.org), and Sea Uchin Genome Database (SpBase; http://spbase.org).


    Genomic data is displayed at three different levels: overview, region, and details.
    At each level, annotation data can be horizontally organized into tracks. Various
    genomic features can be easily represented on the tracks using a variety of premade
    and customizable glyphs, which are graphic symbols that differ in color, shape,
    and size to represent different objects. The vertical arrangement and appearance
    of the tracks can be customized via the user interface. Searches through the features
    can be performed by annotation ID, keyword, or comment. Users can also upload
    custom tracks onto GBrowse, which includes third-party feature annotations. Arbitrary
    URLs can be attached to an annotation to link to external information resources.
    GBrowse also provides a session-management function through browser cookies, so
    that configuration settings persist across sessions (as long as the cookies are
    not deleted, of course) and the browser resumes from where the user left off in
    the previous browsing session. Unlike the UCSC Genome Browser, the Ensembl Genome
    Browser, or the NCBI Map Viewer, GBrowse is not tied to particular genomic databases;
    instead the system is designed to be portable and extensible. This allows the
    deployment of GBrowse as a customized genome browser interface for the use in
    the annotation of model organisms and other'
