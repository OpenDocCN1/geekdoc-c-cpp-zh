    that has a flexible plug-in architecture, which allows developers to add new functionality
    without modifying the software source code. This is achieved by incorporating
    plug-ins through the plug-in API. The GBrowse comes with many standard plugins,
    and installing custom plugins is as simple as copying a Perl module (.pm file)
    into a separate directory and setting a GBrowse variable to indicate the directory
    where all of the plugins reside. Some examples of the use of plugins include running
    BLAST, dumping to and importing from many different formats, finding oligonucleotides,
    designing primers, and creating restriction maps.


    # 9.3 STAND-ALONE GENOME ANNOTATION BROWSERS


    Stand-alone genome browsers, as opposed to Web-based ones, are not necessarily
    tied to a specific genome database but instead mostly built as general-purpose
    browsers that can be downloaded and installed as an application on a local computer.
    These applications respond faster to user requests than Web-based browsers, since
    there is no need to communicate with a centralized server once the required genome
    annotation data is stored on the local disk. In addition, the ability to edit
    and save genome annotations is frequently available in these types of browsers.
    Most of these browsers are written in the Java programming language, as it enables
