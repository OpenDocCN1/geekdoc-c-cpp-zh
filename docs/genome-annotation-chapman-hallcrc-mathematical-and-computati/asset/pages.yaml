  md: '# Authors


    ![](img/7da802df4d7c0829a4a41adf9acaf30d_19_0.png)


    Jung Soh is a research associate at the University of Calgary, in Alberta, Canada.
    He was born in Seoul, Korea, and received a Ph.D. in computer science from the
    University at Buffalo, State University of New York, where he worked at the Center
    of Excellence for Document Analysis and Recognition (CEDAR). From 1992 to 2004,
    he worked as a principal research scientist at the Electronics and Telecommunications
    Research Institute (ETRI), Daejeon, Korea, in areas such as biometrics, robotics,
    video analysis, pattern recognition, and document analysis. Dr. Soh moved to Calgary
    in 2005. His current research interests include bioinformatics, machine learning,
    and bio-medical data visualization.


    Paul Gordon is the bioinformatics support specialist for the Alberta Children''s
    Hospital Research Institute at the University of Calgary. He was born in Halifax,
    Nova Scotia, Canada. He received his bachelor of science (first class honors)
    and master''s of computer science from Dalhousie University (Halifax). He worked
    at the Canadian National Research Council''s Institute for Information Technology
    and at its Institute for Marine Biosciences


