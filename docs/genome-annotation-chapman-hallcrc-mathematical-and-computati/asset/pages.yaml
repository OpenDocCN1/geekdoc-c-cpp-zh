    # 10.3.2 Workflows


    The history pane accumulates a list of the tools that have already been used and
    which outputs were as inputs for other tools, respectively. This history can be
    revised using the pencil and X icons, which are displayed in the upper right corner
    of each recorded history step. The analysis history can also be exported as a
    workflow by selecting the “Extract workflow” item from the Galaxy’s “Options”
    drop-down box, as shown in Figure 10.3. This constitutes what is called workflow-by-example
    functionality, where a workflow is generated without the user explicitly performing
    programming; the program is inferred by the Galaxy system rather than written
    by a user and then added to Galaxy.'
