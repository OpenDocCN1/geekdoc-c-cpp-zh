    resource that provides annotated genome files in a compatible format) can also
    be loaded into Bluejay. In either case, the resulting annotated sequence is loaded
    into Bluejay in either XML or non-XML format by requesting a URL or opening a
    local file. Bluejay has built-in bookmarks to load public genomes available from
    the MAGPIE home page (http://magpie.ucalgary.ca). Any non-XML data are converted
