    In terms of user interactions, left-clicking selects interface components, as
    expected. Right-clicking reveals (for most components) the options that are available,
    either in the workflow component list, or the processor list. These options may
    include, for example, the renaming of a component, the setting of a parameter
    value, or the linking of processors. Left-drawing from an output to an input port
    in the workflow diagram also creates a data link between the two elements. Although
    any port can be linked with another one, not every combination of ports will yield
    a reasonable result. For example, if the output of a service is a DNA sequence,
    the next stage of the analysis takes an NCBI identifier as input, Taverna will
    allow the connection of these ports, even though the downstream analysis will
    naturally fail. The data-type nature of Taverna provides great flexibility, fosters
    the inclusion of various Web resources in the workflow, at the cost of guaranteed
    service compatibility. It is also possible to use local compute grid services
    as processors in a workflow, an attractive option when the analysis tasks are
    computationally intensive.


