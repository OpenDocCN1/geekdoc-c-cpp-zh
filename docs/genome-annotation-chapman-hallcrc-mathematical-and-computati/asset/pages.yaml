- pgno: 23
  md: '# DNA Sequencing Strategies


    # 1.1 THE EVOLUTION OF DNA SEQUENCING TECHNOLOGIES


    Methods for DNA sequencing were invented multiple times, first by chemical means
    (Maxam and Gilbert, 1977) and later using biochemical approaches (Sanger and Coulson,
    1975). Initially, radioactive compounds were used to make the DNA bands, which
    represent base pairs (bp), detectable by autoradiography after an electrophoretic
    separation. A major step forward was the switch to fluorescent labels in the 1980s,
    which could be detected during the electrophoretic separation and automatically
    recorded by computers, instead of humans reading autoradiograms, which were then
    manually converted to computer files. Naturally, the manual editing necessary
    for the creation of the early DNA sequences led to a high error rate, which should
    be kept in mind when comparing DNA sequences downloaded from public repositories,
    such as GenBank.


    The early automated DNA sequencing machines allowed for the production of a few
    kilobase pairs of DNA sequence per day and machine. Today, this has increased
    tremendously through the invention of the next-generation DNA sequencing technologies
    and the integration of robotic workstations into the DNA sequencing workflow.
    It is now possible to produce millions of reads per day and device. While the
    still read length obtained in 2012, with few exceptions, does not reach that of
    the first-generation automated DNA sequencing machines, which peaked at about
    1200 bp. The Roche 454-type systems (www.454.com), which are currently the mainstream
    long-read machines, generate an average read length of around 450 bp at most.
    Finally, this limit is to'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 2 Genome Annotation


    broken by yet another generation of DNA sequencing devices, which are expected
    to produce read lengths of at least kilobase pairs per read. The new system from
    Pacific Biosciences, called PacBio RS (www.pacificbiosciences.com), can already
    reach this level of longer read lengths but currently with trade-offs in sequence
    accuracy.


    Regardless of the DNA sequencing technology used for automated DNA sequencing,
    all approaches ultimately lead to the creation of a so-called trace file, which
    captures essentially a sequence of base pairs, which represents more than a fraction
    of the genome. The trace files are essentially graphical representations of the
    DNA sequencing progress, either represented as a succession of DNA fragments throughout
    a separation by size or the representation of a DNA synthesis on a chip or in
    a flow cell over time. The DNA sequence can be extracted from the trace file as
    a character file. Typically, the character file is formatted as a “FASTA”-format
    file, which essentially contains the DNA sequence (usually 60 characters per line)
    and a single description line, which is preceded by a “-” character on the first
    line. Multiple sequence files can be combined into a single file with multiple
    pairs of description line and sequence, each corresponding to one sequence and
    preceded by a “>” character, which leads to a so-called multiple FASTA file.


    # 1.2 DNA SEQUENCE ASSEMBLY STRATEGIES


    Until now, there is no DNA sequencing technology that directly leads to a complete
    genome with a single sequencing run. In all cases, the complete contiguous sequences
    (i.t., contigs) has to be constructed from small individual sequence reads, which
    range from 30 to a few hundred base pairs. The necessary sequence assembly can
    be done using three fundamental assembly strategies: primer walking, shotgun assembly,
    or a mixed strategy.


    Initially, much of the DNA sequence production was done by so-called primer walking
    (Voss et al., 1993). This essentially meant that after each sequence run, once
    the new DNA sequences were integrated into the assembly project, a set of oligonucleotides
    was calculated (to obtain the next DNA sequencing primers), which could extend
    the existing contigs. This approach was quite slow, as the new primers needed
    to be synthesized before every new sequencing run and could fail for a number
    of reasons, and it was also expensive, as dedicated primers needed to be synthesized
    for each individual sequencing run. First and foremost, problems arose from repetitive
    elements within the clone that was being sequenced, which were not yet known to
    the researcher and therefore not taken into account during the primer calculation,
    and resulted in DNA sequencing errors.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# DNA Sequencing Strategies ■ 3


    This was especially true for single-stranded DNA sequences, where the usual sequencing
    errors led to the calculation of primers that were not priming correctly due to
    built-in mistakes. An advantage of the primer-walking strategy was the low coverage
    necessary, even when both DNA strands were sequenced completely. In many cases,
    the final coverage was between three and four times the genome equivalent. Figure
    1.1 shows an overview of the primer-walking sequencing strategy.


    Craig Venter, at The Institute for Genomic Research (TIGR), and his team can be
    credited for the invention of the "shotgun sequencing" approach (Venter et al.,
    1996). In the early version of this DNA sequencing strategy, which was still based
    on cloned fragments, only universal primers were used to sequence the cloned DNA
    inserts with much higher redundancy (6–10-fold genome coverage) than in the primer-walking
    approach. Once enough end sequences were obtained, they were assembled into contigs.
    Figure 1.2 shows an overview of the shotgun sequencing strategy.


    If all regions of a genome were equally cloneable, this strategy could have rapidly
    yielded genome sequences as only standard components, such as universal primers,
    were required during sequence production, but this was rarely the case. Applying
    this strategy in its pure form led to almost completely sequenced genomes, but
    in the case of microbial genomes as an example, many gaps remained, often numbering
    several hundred gaps 2 to 3 mega bp of genomic sequence. In addition, in most
    cases many regions within the genome were only


