    and stop codons have a black outline. A start or stop codon may be missing because
    of misassembly of the genome or a poor statistical model for parts of the gene,
    in which case the outline is not black.


    A type of evidence that can be displayed in the overview is transcriptional evidence.
    Transcript data such as next-generation sequencing of mRNA can be mapped to the
    genome and stored in the SAM/BAM format (Li et al., 2009). When such a mapping
    file is available, MAGPIE displays the depth of mapped transcript data by the
    color of centerline around positive and negative strand genes. A brighter red
    indicates higher read depth. Taken all together, the overview quickly lets a human
    annotator who sees genes have strong evidence (protein or transcript), and which
    have unexpectedly long or short mRNAs. This information can guide any effort that
    needs to be put into the manual adjustment of the gene structure. As shown in
    Figure 8.2, setting the mouse over a gene reveals a tooltip with the calculated
    functional description for the gene (here “protein disulfide isomerase”). Clicking
    the gene takes the user to the the functional annotation display and confirmation
    form, described in Section 8.2.3.


