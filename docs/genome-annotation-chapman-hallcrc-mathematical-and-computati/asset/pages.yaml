- pgno: 122
  md: '# 100 ■ Genome Annotation


    ![](img/7da802df4d7c0829a4a41adf9acaf30d_122_0.png)


    FIGURE 6.8 Bluejay of gene expression data along a genome. The red and green bars
    along the inner circle represent upregulated and downregulated genes, with the
    bar heights indicating gene expression levels. The bars are aligned to the radial
    positions of the corresponding genes shown in the outer circle.(See color insert.)


    Most traditional visualization techniques for gene expression data do not currently
    have at this point in time a provision of linking the observed data to the genomes
    of the organism from which the expression levels were measured. Visualization
    of gene expression levels along a genome is useful for providing the context of
    the genome in interpreting expression values. For example, the Bluejay genome
    browser (Soh et al., 2012; Soh et al., 2008) can be used to display expression
    levels as bars directly alongside the genome, by integrating the TIGR Mev gene
    expression viewer and adding a new display feature to the Bluejay system. Figure
    6.8 shows a section of a genome with corresponding gene expression levels plotted
    as red and green bars, facilitating direct association of expression levels and
    the genes for which they were measured. Combined with the existing annotation
    visualization capability of the genome browser, this can help the user to gain
    more insight about the particular expression profiles being visualized such as
    an operon structure (see Section 4.2). This is a major advantage of the Bluejay
    system when compared to the usual display of expression values in isolation.'
  merge: -1
