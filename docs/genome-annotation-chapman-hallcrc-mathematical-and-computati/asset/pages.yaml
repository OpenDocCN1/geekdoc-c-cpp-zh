    # 3.3.5 Other Types of RNAs


    Another class of RNAs found in animals is known to interact with the Piwi protein
    (also known as piRNAs). These molecules are typically 25 to 30 bp long and were
    first discovered to be active in germline cells, playing a role in the representation
    of retrotransposon activity. Thousands of piRNA species have been found in insects,
    fish, and mammals. These sequences map back to the genome clusters of ~10 kb,
    which suggests that small number of common precursor mRNAs are initially created
    to form them. A database of piRNAs is available (Sai Lakshmi and Agrawal, 2008),
    but piRNAs are not highly conserved across species (Ro et al., 2007), the annotation
    of piRNAs in new species is primarily based on sequencing experiments. The precursors
    are typically found in repetitive intergenic sequences in the genome. PiRNA-like
    sequences are found throughout nonggerm cells (Yan et al., 2011) and are now believed
    to play a role in epigenetic regulation, positive regulation of translation, and
    improved mRNA stability.


    An mRNA may contain self-regulatory elements. Although these are most commonly
    found in bacteria, they are also present to some degree in archaea and eukaryotes.
    Cis-acting elements, which can be computationally identified, selenocysteine signals
    (Chaudhuri and Yeates, 2005) and programmed translational shifts –1 (Theis et
    al., 2008) as well as +1 (Liao et al., 2009). In the 5'' and 3'' UTRs of genes,
    the RNA can bind small molecules and regulate the mRNA expression. These are known
    as ribozitches. For example, the SAM-1 ribozwitch controls protein levels of genes
    involved in methionine synthesis based on concentration of S-adenomethionine (SAM)
    in the cell. These patterns can be found using a Riboswitch Finder Web server
    or the standard software (Bengert and Dandekar, 2004).


    Many long noncoding RNAs (lncRNAs) regulate genes in eukaryotes. These lncRNA
    genes are transcribed but not translated into proteins, hence they should be named
    long non-coding RNAs to be precise. Antisense RNAs are widespread, with most of
    them down-regulating gene activity. Antisense RNA can bind to complementary mRNA,
    which results'
