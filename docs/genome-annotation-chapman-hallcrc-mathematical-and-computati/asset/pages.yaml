  md: '# 10 ■ Genome Annotation


    sequencing can be assembled using similar assembly algorithms to Sanger sequences,
    since both are usually of similar length (between 300 and 500 bp). Due to the
    shear volume though, specialized assembly software packages exist better handle
    the large volume of reads involved. Popular packages include the traditional Phrap
    (www.phrap.org) and CAP3 (Huang and Madan, 1999), the high-volume MIRA (Chevreux
    et al., 2004) and SeqMan (www.dnastar.com) assembly packages, as well as the assembler
    provided by the manufacturer of the 454 machine (www.454.com), Newbler. Another
    commercial assembler, known for its tremendous speed, is the CLE Bio assembler
    (www.cldcenovo.com).


    More recently, the ease of sample preparation and low cost of short-read transcript
    sequencing (e.g., Illumina RNA-Seq) have made it possible to effectively reveal
    the transcriptome of any organism. The depth of coverage obtained through RNA-Seq
    data has greatly enhanced prokaryotic and eukaryotic transcriptomics, demonstrating
    that loci are differentially expressed and in the case of eukaryotes they can
    be alternatively spliced far beyond what was known from the results obtained by
    the generation of ESTs. Short reads can be assembled into transcripts using computationally
    intensive software such as ALLPATHS (Butler et al., 2008), PEACE (Rao et al.,
    2010), Trans-Abyss (Robertson et al., 2010), or SOAPDenovo (soap.genomics.org.cn)
    and Velvet/Oases (Zerbino and Birney, 2008) assembly packages. Although some of
    these packages were originally designed for genomic assembly, they have been enhanced
    to deal with the variable coverage of transcriptomes (which is generally not an
    issue in shotgun genome sequencing), and as described next.


    The process of assembling short transcripts into accurate full-length coding sequences
    is not yet a standardized process. Variation in read coverage along a transcript
    due to various factors, and large variation in transcript abundance mean that
    de novo assemblies require trial and error and the combining of multiple runs,
    using various parameter values to capture both abundant and low-coverage genes
    at a reasonable computational cost. The value provided by doing de novo assembly
    is that it can even be done in the absence of a genome sequence and that splice
    variants can be automatically identified. Boundaries of exons become clear if
    the transcript consensus can be mapped back to the genomic sequence.


    The list of genome/transcriptome assemblers is continually growing, therefore
    it is best to refer to on-line forums to learn about the latest tools. One of
    the most popular forums is SEQanswers.com. Combined with'
