    # 6.5 VISUALIZATION OF GENE EXPRESSION DATA


    High-throughput gene expression profiling methods, such as DNA microarrays, made
    it possible to acquire a snapshot of hundreds or even thousands of genes expressed
    in the organism. Visualization techniques have become indispensable for the analysis
    and interpretation of the enormous amounts of data produced by gene expression
    studies, irrespective of using gene chips or high-throughput DNA sequencing as
    the'
