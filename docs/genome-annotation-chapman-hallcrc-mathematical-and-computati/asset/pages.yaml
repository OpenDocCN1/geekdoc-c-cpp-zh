  md: '# Between the Genes ■ 37


    # 3.3.1 Ribosomal RNA


    The ribosomal RNA (rRNA) genes are structural constituents of the ribosome. They
    may be encoded more than once in a genome from any branch of life. Typically,
    the rRNA sequences show a high G+C content (approximately 65%). The distribution
    and total number of RNA genes depend on the branch of life being examined. They
    are named according to their sedimentation properties (S or Svedberg units). In
    prokaryotes, the three rRNA (5S, 16S, and 23S) are usually organized in an operon
    (cotranscribed). Identification of the 16S rRNA sequences is important to determine
    the ribosomal binding site structure prediction (see Chapter 2). In eukaryotes,
    the four rRNAs (5S, 8S, 18S, and 28S) are typically present in many copies per
    genome. The 5S location is transcribed by RNA polymerase III. It is located separate
    from the other RNA genes, which are cotranscribed by RNA polymerase I. 5S, 18S,
    and 28S are separated by so-called internally transcribed spacers (ITS). ITS sequences
    are often used for phylogenetic fingerprint of closely related species and are
    therefore of interest to researchers. Almost all eukaryotes also contain two mitochondrial
    RNA genes. rRNA sequences do not necessarily reflect the final organization of
    the structural element in the ribosome, as the precursor molecules undergo cleavage
    and various nucleotide modifications after transcription. RNAmer (Lagesen et al.,
    2007) provides a sensitive hidden Markov model search against a preprint set of
    rRNA models. Alternatively, rRNA genes can be identified using nucleotide sequence
    homology to reference rRNA sequences from Rfam (Gardner et al., 2011).


    # 3.3.2 Transfer RNA


    A transfer RNA (tRNA) is an approximately 76-bp RNA molecule, responsible for
    connecting an amino acid to the terminus of a peptide chain in protein synthesis.
    Each DNA codon has its own tRNA, but "wobble" in the third codon base allows that
    organism to have less (and of many need less) than the 61 (–3 stop codons) tRNAs.
    In prokaryotes there is generally one copy of each tRNA, whereas hundreds of copies
    can exist in some higher eukaryotes. tRNAs have a canonical-like secondary structure
    as shown in Figure 3.2, therefore tRNA prediction algorithms are mostly based
    on finding sequence segments that fold into this secondary structure.


    Free energy calculation of folding is a common approach to predicting these structures
    but is complicated by possible noncanonical base pairing'
