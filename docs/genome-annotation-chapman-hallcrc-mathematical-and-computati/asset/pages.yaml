- pgno: 112
  md: '# 90 ■ Genome Annotation


    # 6.3.2 Multiple Alignment Viewers


    Visualization of multiple alignment results usually takes the form of a matrix
    representing bases or residues. Two widely used multiple alignment programs are
    ClustalW (Thompson et al., 2002) and T-Coffee (Notredame et al., 2000), both of
    which were originally text based. ClustalW also offers a user-friendly graphical
    version called ClustalX (Thompson et al., 2002). This type of graphical interface
    allows a user to adjust visualization elements such as color and shading to produce
    different visual representation of alignment, and also figures for use in publications.
    ClustalW is currently available through the Web servers of European Bioinformatics
    Institute (www.ebi.ac.uk/Tools/clustalw2) and Swiss Institute of Bioinformatics
    (www.chembnet.org/ClustalW.html). T-Coffee and its variants, such as M-Coffee
    (Wallace et al., 2006) for combining results from popular alignment tools, can
    be accessed at the T-Coffee Web site (www.tcoffee.org) and its mirror sites.


    Coloration is frequently used in multiple alignment visualization to highlight
    the dominance of specific properties in a region and to indicate sequence variation
    at the same time. The most frequently used coloring method is to adopt a fixed
    color-mapping scheme, where each nucleotide or amino acid is assigned a unique
    color. There is no universal coloring standard, and each viewer defines its own
    coloring scheme, with some allowing user-defined schemata as well.


    Most alignment viewers generate some type of annotation. The most common one is
    the consensus row at the top or bottom of the alignment matrix, which is used
    to summarize the sequence alignment results. The calculated alignment score at
    each column can also be represented in a separate line as a bar plot, where the
    bar heights correspond to the qualities of the columns. For example, Figure 6.4
    shows a screenshot of the Jalview tool (Waterhouse et al., 2009), showing alignment
    of multiple sequences along with a bar plot as consensus plot. These plots are
    collectively known as summary plots and can contain additional information, the
    dominant symbol at each aligned position. A set of symbols can also be shown at
    each position, where the relative sizes of the symbols would indicate the dominance
    of the pattern.


    Multiple alignment algorithms are designed to allow users to find the best solution
    for a biological problem that has been mathematically formulated. As such, even
    the most sophisticated alignment algorithms generate alignments that are not biologically
    meaningful. In addition,'
  merge: -1
  img_proc: true
