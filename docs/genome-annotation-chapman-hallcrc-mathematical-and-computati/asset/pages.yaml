    Model,” adding three exons, then clicking “Create New Gene Model” again, and adding
    the remaining exons. The coordinates of each exon are populated by clicking the
    thin red evidence bars or manually entering them. Setting the mouse over an evidence
    bar shows a tooltip summarizing the evidence (lower right corner of the figure).


    So-called chimeric genes, where two protein products are predicted as one, can
    be caused by relying on poorly constructed protein models in the public databases.
    As high-throughput genomics yields more information in the public databases, it
    is important to look at the totality of public protein evidence rather than the
    top pairwise hit. This is where structural and functional annotation is intertwined.
    While mRNAs must be manually split, in “confident” CDS extraction, MAGPIE examines
    all the top protein hits to determine if, minus one or two, the hits fall into
    sets with nonoverlapping locations. If this is the case, separate coding sequences
    are predicted, with the suffixes .1, .2, and so on.


    # 8.2.3 Functional Annotation


    Predicted coding sequences under functional analysis as described in Chapter 7.
    The results are combined to generate a functional evidence summary report that
    can be used to confirm or adjust the automated functional assignment. These data
    are typical of the sorts of information shown in other functional annotation systems.
    The elements in the summary will be explained top to bottom.


    The first line (“MAGPIE Suggestion”) indicates the synthesized functional description
    MAGPIE generates from the totality of evidence collected. Many other annotation
    systems simply use the BLAST or protein domain hit description, but this can be
    uninformative'
