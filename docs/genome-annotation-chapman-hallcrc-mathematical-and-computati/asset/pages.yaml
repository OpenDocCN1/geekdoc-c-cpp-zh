    # 3.2.4 TFBS Conservation


    Given the importance of transcription factors for the proper regulation of gene
    expression, it stands to reason that TFBSs should be conserved across closely
    related species. Although sequence variability in the recognition sites may complicate
    the task, the conservation rate is still above the general 5’ UTR conservation
    rate. EEL (Hallikas et al., 2006) is a popular CRM scanner that takes advantage
    of this rate differential, by aligning species only the sequence fragments (in
    genomic order) that contain TFBS motifs. oPOSSUM (Ho Sui et al., 2007) can also
    take advantage of cross-species conservation for detecting precalulated species
    pairs, such as Caenorhabditis elegans and Caenorhabditis brigascae, or the human
    and mouse genomes.


    The novo detection of TFBSs can be divided into two main categories: within-species
    mining and cross-species mining. Within-species mining relies on the fact that
    a transcription factor may be used to regulate more than one gene, and therefore
    similar TFBSs might be found upstream of multiple genes. The classic software
    for detecting recurring motifs is the MEME suite (Bailey et al., 2009). The basic
    technique of motif discovery requires the generation of a set of sequences, which
    are assumed'
