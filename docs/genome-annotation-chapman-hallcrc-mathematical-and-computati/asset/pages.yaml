    # 2.6 SPLICE VARIANTS


    For many eukaryotic genes, there is in fact not just one correct gene structure,
    but multiple versions are true, at least due to splice variants. The general categories
    of splicing events include (in descending order of frequency) skipped exons, alternative
    donors and acceptors, retained introns, and novel introns. Many gene prediction
    programs can be utilized to generate models of alternate transcripts, at least
    some of which will respond to actual splice variants. The validation of alternate
    models, like that of the primary models, involves the mapping of mRNA data to
    the genome. Traditionally this was done using EST sequences elucidated by Sanger
    sequencing. To improve the depth of transcript coverage to find rare splice events,
    ESTs from related species can be mapped to the target genome, when genes were
    highly conserved. This resolution of variants can now be greatly enhanced by the
    mapping of short next-generation sequencing mRNA data to the genome.


    Skipped exons fall into two general categories: inner and outer. Skipped exons
    lead to proteins that are truncated at the N- or C-terminus, or sometimes the
    protein translation is unchanged and only the UTRs are affected. Figure 2.2 illustrates
    how two programs disagree on the gene structure, but both are likely correct.
    GeneMark captures the form of the gene that skips the exon (the stop codon is
    just what is normally the intron). AUGUSTUS identifies the more common form that
    donors include the exon.


    Alternative splice donors and acceptors yield shorter or longer versions of a
    protein, and sometimes dramatically so, because of changes in the reading frame
    caused by different splice sites. The same holds for skipped inner exons, if their
    length is not a multiple of three. Alternate acceptors and donors are caused by
    the presence of valid intron structures, which the spliceosome can excise. While
    splice repressor proteins are known, the complete mechanisms behind the preferential
    splicing of one form or another under various environmental conditions are not
    completely understood. Sometimes the distinction between alternatively spliced
    exons and skipped exons can be difficult. In Figure 2.3 there are two forms of
    the gene. One consists of exon x with donor site A, followed by exon y, but exon
    starts at splice C. The other consists of x, followed by y, which spans splice
    sites B to D, then exon z starting at site E.'
