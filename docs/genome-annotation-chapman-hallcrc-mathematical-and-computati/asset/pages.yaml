    Ensembl does not synthesize a gene description but rather cross-links information
    available from existing protein annotation data sources such as UniProt, the NCBI
    Gene databases (www.ncbi.nih.gov/gene). Manual structural and functional correlation
    of Ensembl genes can be done using Apollo (Lewis et al., 2002). Unique among genome
