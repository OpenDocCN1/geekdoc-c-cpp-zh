    # 10.5.2 The Search Widget


    Often users will want to retain only part of the output of the analysis for further
    processing, especially when they filter large data sets down to subsets, which
    are likely to be relevant to their particular research question. In Seahawk, a
    conditional service execution is implemented via a new search/filter widget. Visually,
    the behavior is a hybrid of a highlighting search and a gray-out. Filtering is
    essential, so that users not use data that do not meet the search criteria; these
    data will not be available downstream in the equivalent Tavern workflow. To avoid
    an inconsistent state, filtering is updated as each letter is typed into the search
    box. The three types of conditions are conditionally supported in Seahawk:


    ```

    if (cond(x)) {f(x)} else {g(x)}

    if (cond(x.member1)) {f(x.member2)} else {g(x.member2)}

    if (cond(f(x))) {g(x)}

    ```


    The search condition can be in the format of either a plain string or a regular
    expression (a powerful pattern matching syntax with wildcards).'
