- pgno: 28
  md: '# 6 Genome Annotation


    As several hundred genomes, including the human genome, have been completely sequenced
    to date and thousands more have been completed with various grades of quality,
    it is now often of little interest to complete genomes entirely. As the cost for
    DNA sequence production has been lowered considerably, when compared to the older
    capillary DNA sequencing technology (a human genome equivalent can be generated
    for less than $10,000 in 2012 and might be possible to be generated for less than
    $1,000 shortly), sequence redundancy can be increased considerably to factors
    of 30-40-fold or even higher coverages. This often leaves only 20 to 50 gaps in
    the genomic sequence of a microbial genome, which might or might not be closed
    through traditional primer-priming strategies. Often, the new genomic sequence
    is close enough in similarity to an existing complete genome that the fully completed
    genome can be used as a “scaffold” to align the newly generated sequence in a
    meaningful way. The low number of gaps means in a microbial genome less than 1%
    of the genes are not fully characterized. This is sufficient for almost all genome
    research needs.


    New analysis strategies are being developed, supersede older molecular biological
    techniques, including PCR experiments, DNA mapping technologies, and gene chips.
    Complete sequencing of the “total genome” of an organism is now possible. In the
    human case, this means not only the generation of the DNA sequence of the human
    chromosomes, but also the sequencing of all DNA-containing organisms and viruses
    in the body fluids, such as blood and also those in the gut. The total DNA content
    of a human being at least a thousand times larger than the DNA content of the
    chromosomes, posing major challenges for the annotation of this congrate of DNA
    molecules.


    # SEQUENCING BIAS AND ERROR RATES


    In our opinion, to date, there is no “complete and error free” genome sequence
    that was ever characterized by humans. Many sources of error exist, leading to
    certain error rates in all DNA sequences, which have been submitted to the public
    repositories. Typically, the generation of a new sequence involves a large number
    of individual steps, from the isolation of the original DNA, to the preparation
    for DNA sequencing using various kits, to the actual operation of the DNA sequencing
    equipment, and finally to the assembly and annotation. In most steps, direct human
    involvement is still necessary. Errors are manifold in nature, from single-base
    pair differences (Meacham et al., 2011), which can lead to frameshifts in the
    sequence, to different assemblies of the same sequence which lead to a false'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# DNA Sequencing Strategies ■ 7


    representation of the genomic arrangement and gene order (for example, two assemblies
    of the bovine genome currently exist, which are based on the same data, but differ
    considerably) (Florea et al., 2011), to “missing” genes or regions based on the
    erroneous assembly of repetitive regions (for example, in the human genome) (Semple
    et al., 2002) in a genome. Though already the input into the genome annotation
    process is not without flaws. The goal should be to use the best possible input
    sequence. This can be achieved by using at least two sequencing techniques simultaneously
    while generating the final sequence. This also helps to iron out the bias, which
    is introduced by every sequencing technology. Some machines cannot deal with high-GC
    (guanine-cytosine) content DNA fragments the same way they deal with low-GC content
    fragments, some machines bulk at homopolymer stretches in the DNA sequence, and
    some machines lose accuracy during the sequencing process to a large degree, calling
    the final bases in the sequencing run with no more than 70% accuracy.


    In the future, the combination of short reads (around 100 bp), reads generated
    at both ends of the DNA fragment (paired-sequencing) and very long reads (over
    1000 bp) will probably prevail for *de novo* sequencing, while short reads will
    be used if a more or less complete template already exists (for example, in the
    case of the human genome).


