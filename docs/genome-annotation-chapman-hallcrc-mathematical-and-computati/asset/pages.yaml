    # 11.3.2 Targeted EST Assembly


    In order to analyze the genetic material of plants to determine specific gene
    sequences and select candidate or targeted genes that play a key role in their
    metabolic pathways, a targeted expressed sequence tag (EST) assembly has been
    developed. ESTs are reads of sequences obtained from sequencing cDNA libraries
    (Nagaraj et al., 2006). As cDNA is complementary to mRNA, ESTs characterize the
    expressed genes in specific tissues at certain developmental stages. ESTs have
    become an essential tool to study gene expressions in tissues with regard to different
    developmental stages and a variety of environmental factors. They have been used
    in large-scale transcriptomic studies to aid gene discovery, enhance genome annotation,
    determine the structure of genes, and discover splicing patterns (Wang et al.,
    2009).


    The general transcriptomic analysis pipeline when using EST sequences consists
    of mRNA preparation, cDNA library construction, reread from sequencer, quality
    trimming and filtering, read clustering, assembly, and annotation of the contigs
    generated by the assembly program. Because of the large quantities of the reads,
    it is still a big challenge to assemble the reads to produce a complete representation
    of all expressed genes. In order to increase the computing efficiency in EST analysis,
    target-restricted assembly methods have been used to reconstruct sequence ortholog
    regions in low-coverage sequences (Brainbridge et al., 2007) and a single lane
    of Illumina sequences for genes of relevance to phylogeny reconstruction (Johnson
    et al., 2010). In target-restricted assembly pipelines, the target protein-coding
    sequences of interest are first identified and built into a database. Then BLAST-based
    algorithms are normally used to retrieve all of the reads closely related to the
    protein-coding targets of interest. These reads are then reassembled to generate
    complete full-length coding sequences of genes of interest.


    In addition to BLAST-based search tools, searching algorithms based on hidden
    Markov models (HMMs) also have been widely used in sequence alignment and gene
    discovery. HMMER (http://hmmer.janelia.org) (Finn et al., 2011), an HMM-based
    sequence homology tool, has been used for searching homologs of protein sequences
    and aligning protein sequences. Compared to BLAST, HMMER can detect remote homologs
    more accurately (Finn et al., 2011). By combining BLAST and HMMER, a computationally
    inexpensive assembly pipeline was developed to recognize and assemble targeted'
