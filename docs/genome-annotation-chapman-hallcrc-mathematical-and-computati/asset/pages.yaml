    Although mapping of short reads or assembled mRNAs back to the genome can be very
    helpful in determining correct intron and exon boundaries, it is only one component
    of the overall gene prediction process. This is because (1) it is unlikely that
    full-length mRNA sequences can be obtained for all genes; (2) in some species
    transcripts may encode operons of more than one gene; and (3) start stop codons
    cannot be determined from the mRNA alone due to multiple translation frames and
    factors affecting translation. As such, transcript information is therefore supplemented
    in most gene prediction software by statistical models of gene feature sequences.


    # 2.3 STATISTICAL MODELS


    Most initio gene predict models are based on a data structure known as a generalized
    hidden Markov model (GHMM). Conceptually, it can be thought of as a graph where
    the nodes represent events in the gene''s expression, and arrows connecting the
    nodes represent the scanning of the sequence, as shown in Figure 2.1. It should
    be noted that the actual GHMMs used in prediction programs have many more states
    (nodes) and transitions (arrows) than in this example.


    Each gene model is calculated by progressively scanning each base of the genomic
    sequence, looking for signals to transition from one state to the next. In the
    case of a transcription start, the signal being searched for is not necessarily
    the exact string GCCCTA but perhaps a pattern such as (G/C) CCXTA. (Note: G, guanine;
    C, cytosine; T, thymine; A, adenine; X, any


    ![](img/7da802df4d7c0829a4a41adf9acaf30d_35_0.png)


    Figure 2.1 A simple generalized hidden Markov model, as used by gene prediction
    algorithms. DNA sequence is consumed by the first node of the model until an expected
    sequence is found, the next node in the graph consumes the sequence, and this
    process continues. A gene''s boundaries and features are defined by these transition
    points.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Genome Annotation


    single nucleotide.) The configuration of these search patterns is achieved by
    providing a training set of known transcription start sites to the pre-diction
    tool. Likewise, the real codon is not necessarily the first ATG encountered, so
    a training set of known full-length coding sequences can greatly assist in building
    a model of what the DNA sequence around the real start codons looks like. The
    sequence between the transcription start and the translation start may also have
    some statistical characteristics, as may be the sequence between the GT and AG
    in an intron. The probabilities derived from the training data sets are what determine
    the accuracy of the subsequent predictions.


    Gene features are often referred to by their acronyms in gene prediction systems.
    It is worthwhile remembering these as they are introduced here. Statistical models
    may include the features described next, roughly in genomic order.


    # 2.3.1 5’ Untranslated Region


    The 5’ untranslated region (5’ UTR) is the region between the transcription start
    site and the translation start codon. Many eukaryotic gene predictors can take
    advantage of user-identified 5’ UTR sequences to train their statistical models.
    When sufficient aligned mRNAs or mapped short reads are available, and the start
    codon is known via protein homology, the identification of 5’ UTR can be based
    on empirical evidence for training purposes. The 5’ UTR region contains several
    translation signals, as detailed next. The identification of transcription-factor
    binding sites is a complex issue. In the general transcription-factor binding
    sites locations are not often used to assist in the prediction of gene structures.
    Their discovery and potential usage is discussed later in Chapter 3.


    # 2.3.2 –35 Signal


    The –35 signal is located approximately 35 base pairs upstream of the start codon
    in prokaryotes. It can be used to aid identification of the proper binding site
    for the initiation complex during transcription. This signal has a consensus sequence
    of TTGACA (Rosenberg and Court, 1979), but is relatively weak compared to the
    other prokaryotic UTR signals, therefore multiple candidates often exist for a
    single gene.


    # 2.3.3 B Recognition Element


    The B recognition element (BRE) is found in many archaeal and eukaryotic genes
    (Qureshi and Jackson, 1998), just upstream of the TATA box,'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Coding Sequence Prediction ■ 15


    and consists of seven nucleotides. The first two nucleotides of the BRE sequence
    are either G or C, followed by either G or A. The last four nucleotides are CGCC.
    Transcription factor IIB (TIIB) binds in the major groove of the DNA at the BRE.


    # 2.3.4 TATA Box


    In prokaryotes, the TATA box is known as the Pribnow box, or the -10 signal, because
    it is usually centered 10 bases upstream of the start codon. Although there is
    TATAAT consensus (Pribnow, 1975), it is not universal. More important is that
    the region is rich in adenine and threonine bonds. Together with the -35 signal,
    these patterns provide suitability for transcription initiation. It is common
    to observe multiple candidate start initiation sites, due to the short length
    and variability of the -10 and -35 signals, therefore the predicted patterns and
    their putative locations are mostly used to support rather than define the start
    of the coding sequence.


    In eukaryotes, the TATA box is only one of possible initiation factors. Core promoters,
    such as the initiator element (Inr), the GC box, or the CAAT box can replace or
    augment the eukaryotic TATA box. Other initiation elements specific to particular
    genes and tissue types are not generally used for statistical prediction of genes
    due to their rarity.


    # 2.3.5 Ribosomal Binding Site


    The Shine–Dalgarno sequence (Shine and Dalgarno, 1975) represents the ribosomal
    binding site (RBS) in prokaryotes and hence the start of translation. It is usually
    situated within eight pairs of the start codon. It is specific, determined by
    the reverse complement of the 16S RNA''s 3'' end, and may contain mismatches (Schurr
    et al., 1993). Not every gene necessarily starts with an RBS, but each transcript
    should. This means that scores for genes in the middle of an operon (also known
    as polycistronic transcripts) should not be penalized for having one.


    In eukaryotes, the ribosomal binding site is referred to as the Kozak sequence
    (Kozak, 1986). This site does not have as strong a consensus as in prokaryotes
    (is not derived from the 18S rRNA), and it overlaps rather than precedes the start
    codon. Because of this overlap, the start codon begins at +1, and the immediate
    5'' base position is -1. The consensus sequence varies from species to species;
    therefore proper detection requires a training data set.'
