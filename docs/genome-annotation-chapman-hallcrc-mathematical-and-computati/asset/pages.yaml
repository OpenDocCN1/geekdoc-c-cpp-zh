    # 6.4 VISUALIZATION OF HIERARCHICAL STRUCTURES


    Many counts or findings in biological studies are best described as a hierarchy,
    often represented in the form of a tree. For example, phylogenetic analysis generates
    phylogenetic trees, which are tree representations'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 92 ■ Genome Annotation


    of inferred evolutionary relationships among the respective organisms being studied.
    Another example is the Gene Ontology project (Ashburner et al., 2000), whose goal
    is to provide a controlled vocabulary of terms for describing instance gene and
    gene product attributes and annotation across all species. Biological ontologies
    may contain a large number of terms that are best organized in hierarchical structures
    represented as trees or graphs. Clustering is an analysis method applied to a
    wide variety of biological studies, such as microarray experiments, sequence analysis,
    and sometimes phylogenetic analysis, with the goal of grouping and partitioning
    data based on their distances or similarities. Commonly used clustering algorithms,
    for example, hierarchical clustering, frequently show the relationships among
    the clusters as a tree, as clusters are generated and joined to form bigger clusters.
    Hierarchical structures are natural representations in many biological analyses,
    with many tools for their visualization have been developed (Pavlopoulos et al.,
    2010).


    # 6.4.1 Tree Visualization Styles


    Most visualization tools have built-in functions to display a tree using Euclidean
    geometry, often using several different styles, especially when displaying phylogenetic
    trees. A phylogenetic tree can be visualized as either a phylogram or a cladogram.
    In a phylogram, branch lengths are thought to be in proportion to the degree of
    evolutionary change, whereas in a cladogram, the branching order represents the
    inferred phylogeny. In addition, each tree may be rooted or unrooted, depending
    on the positioning of the species with respect to an out-group sequence. A phylogram
    or cladogram with a hypothetical common ancestor (i.e., the root) is therefore
    considered to be a rooted tree, and one without such ancestor is considered an
    unrooted tree.


    In terms of the spatial layout, the shape of a tree may be rectangular, slanted,
    or circular. In a rectangular tree, the nodes are laid out along the horizontal
    or vertical axis, and the branches are drawn along the other axis to show the
    hierarchical structure. Hundreds of nodes can be visualized in a rectangular tree,
    often in association with other rectangle-displays, such as heat maps, but visual
    navigation by the user following the branches can quickly become difficult. A
    slanted tree has essentially the same layout as the rectangular version, except
    that it uses slanted lines to draw branches to make the hierarchy stand out. A
    circular tree has its root at the center of a circular space, with branches radiating
    out in all directions from the center. This layout is more space efficient than
    the'
  merge: -1
  img_proc: true
