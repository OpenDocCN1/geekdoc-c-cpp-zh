    ## About the Author, David Haskins


    I was born in 1950 in Chelsea, London, but grew up in New Zealand returning to
    England in 1966. I have worked in the computer industry since 1975 after a couple
    of years as a professional drummer.


    My first experience was five years as a mainframe hardware engineer for Sperry
    Univac (now Unisys) followed by 14 years as an analyst programmer with British
    Telecom in London.


    While engaged in a complex task of converting large quantities of geographical
    data (map coordinate references) I discovered the joys of C – its speed and efficiency.
    That was in 1985 and I have been a fan of C ever since.


    Since 1994 I have been a senior lecturer at the Faculty of Computing, Information
    Systems and Mathematics at Kingston University, London. This is a mostly technical
    university that evolved from a former polytechnic college with a long tradition
    of aeronautical engineering.


    I am engaged mainly in teaching many computer languages and internet systems design
    to a large and multicultural student body.


    Most of my academic research and commercial consultancy has been involved with
    spatial systems design and the large data volumes and necessary processing efficiency
    concerns has led me to concentrate on C and C++. My teaching web site is at [www.ubiubi.org](http://www.ubiubi.org)
    which shows some of this material.


    A keen Open Systems enthusiast, I have exclusively centred all my teaching on
    the Linux platform since 2002 and Kingston University is well advanced in delivering
    dual boot facilities for all its student labs.


    ![](img/ad23766cfc9c69ba4f733f8b935cc3d8_5_0.png)


    I am a keen swimmer and in 2009 completed the annual Lorne *Pier-to-Pub* race
    in Victoria, Australia which is the largest open-sea swimming race in the world
    where 4,500 people of all ages swim each January as the shark-spotting planes
    fly overhead.


    When not teaching I am a keen vegetable gardener and amateur musician, playing
    in jazz groups and in Scottish bagpipe bands. I play the drums, the great highland
    bagpipe, the clarinet, the guitar and the piano.


    ## Introduction


    ### Why learn the C language?


    Because the C language is like Latin – it is finite and has not changed for years.
    C is tight and spare, and in the current economic climate we will need a host
    of young people who know C to keep existing critical systems running.


    C is built right into the core of Linux and Unix. The design idea behind Unix
    was to write an operating system in C so all you needed to port it to a new architecture
    was a C compiler. Linux is essentially the success story of a series of earlier
    attempts to make a PC version of Unix.


    A knowledge of C is now and has been for years a pre-requisite for serious software
    professionals and with the recent popularity and maturity of Open Systems this
    is even more true. The terseness and perceived difficulty of C saw it being ousted
    from university teaching during the late 1990s in favour of Java but there is
    a growing feeling amongst some teaching communities that Java really is not such
    a good place to start beginners.


    Students paradoxically arrive at colleges knowing less about computing than they
    did ten years ago as programming is seen as too difficult for schools to teach.
    Meanwhile the body of knowledge expected of a competent IT professional inexorably
    doubles every few years.


    Java is commonly taught as a first language but can cause student confusion as
    it is in constant flux, is very abstract and powerful, and has become too big
    with too many different ways to do the same thing. It also is a bit “safe” and
    insulates students from scary experiences, like driving with air-bags and listening
    to headphones so you take less care. The core activity of writing procedural code
    within methods seems impenetrable to those who start from classes and objects.


    So where do we start? A sensible place is “at the beginning” and C is as close
    as most of us will ever need to go unless we are becoming hardware designers.
    Even for these students to start at C and go further down into the machine is
    a good idea.


    C is like having a very sharp knife which can be dangerous, but if you were learning
    to be a chef you would need one and probably cut yourself discovering what it
    can do. Similarly C expects you to know what you are doing, and if you don’t it
    will not warn before it crashes.


    A knowledge of C will give you deep knowledge of what is going on beneath the
    surface of higher-level languages like Java. The syntax of C pretty-well guarantees
    you will easily understand other languages that came afterwards like C++, Java,
    Javascript, and C#.


    C gives you access to the heart of the machine and all its resources at a fine-grained
    bit-level.


    C has been described as like “driving a Porsche with no brakes” – and because
    it is fast as well this can be exhilarating. C is often the only option when speed
    and efficiency is crucial.


    C has been called “dangerous” in that it allows low-level access to the machine
    but this scariness is exactly what you need to understand as it gives you respect
    for the higher-level languages you will use.


    Many embedded miniaturised systems are all still written in C and the machine-to-machine
    world of the invisible internet for monitoring and process control often uses
    C.


    Hopefully this list of reasons will start you to the growing complexity of modern
    Integrated Development Environments (IDEs) such as Developer Studio, Netbeans
    and Eclipse which give students an illusion that they know what they are doing
    but generate obfuscation.


    My aim is to get students confident and up to speed quickly without all the nightmare
    associated with configuring complex tool chains. It is also essentially a license-free
    approach and runs on anything.


    With this fundamental understanding about what is really going on you can progress
    on to use and actually understand whatever tools you need in your career.


    In order to give a sense of doing something real and useful and up to date, the
    focus is on developing visible and effectively professional-quality web-server
    and client projects to put on-line, using:


    - Apache Web server and development libraries.

    - C language CGI programs (C programming using the “make” utility).

