    \n## 7 Apache C 模块\n\n### 7.1 更安全的 C Web 应用程序\n\n在现实生活中，很少有Web管理员会愿意让任何人把C程序作为CGI内容生成器来运行，因为存在崩溃和核心转储的风险。然而，Apache服务器本身就是用C编写的，并且其开发工具附带了一些简单的实用程序，允许你创建代码存根，将你的C程序放入其中，并在它们作为服务器的一部分加载、在一种“沙箱”中安全管理时，以Apache模块的形式运行。这里我们将采用之前的一个示例，将其转化为一个Apache模块。\n\
