  - '[PAGE 46]


    A **space** character has become a **+** and ! has become **%21**.


    This encoding occurs because certain characters are explicitly used in the transmission
    protocol itself. The **&** for example is used to separate portions of the `QUERY_STRING`
    and the space cannot be sent at all as it is.


    Any program wishing to use information from the HTML form must be able to decode
    all this stuff which will now attempt to do.


    The program `chapter4_2.c` accomplishes what we see so far. It has a main function
    and a `decode_value` function all in the same file.


    The `decode_value` function takes three arguments:


    +   - the name of the value we are looking for “`ITEM1=`” or “`ITEM2=`”.

    +   - the address of the variable into which we are going to put the value if
    found

    +   - the maximum number of characters to copy


    The function looks for the start and end positions in the `QUERY_STRING` of the
    value and then copies the characters found one by one to the value variable, adding
    a `NULL` character to terminate the string.'
