    # ### 4.3 LOGIC, LOOPS AND FLOW CONCLUSION


    The most important part of controlling the flow of your program is to have a clear
    idea about what it is you are trying to do. We have also learned to break our
    code up into manageable lumps, and started to build and use a library and header
    file of our own.


    Being able to express a process in normal words or **pseudocode** is useful and
    helps you to break the code into steps.


    +   - Use **for loops** to explicitly count through things you know have an ending
    point.

    +   - Use **while** and **do…while** loops to do things until some condition changes.

    +   - Use **switch** statements to when integers or single characters determine
    what happens next.

    +   - Use **if** and **else if** and **else** when mutually exclusive things can
    be tested in a sequence.

    +   - Complex sets of **if** and **else** and **not (!)** conditionals can end
    up unreadable.

    +   - Use braces ({ }) to break it all up into chunks.


    # **Exercise:**


    A useful **task** now would be to **complete the function decode_value** so you
    have a useful tool to grab web content from HTML forms decoding all the non alpha-numeric
    keys on your keyboard.

    You will use this exercise again and again so it is worth getting it right.'
