  mdcn: "\n### 7.3 Apache 模块结论\n\n虽然编写和调试起来很棘手，但这可能是最有回报且最晦涩的领域之一，你可以在此进行真正、具有商业价值且可安全部署的网页内容生成。可以很容易看出，这个示例可以通过添加颜色和字体参数来扩展，从而制作出有用的网页内容工具。\n\
    \n关于 Apache 模块的清晰、简单的资料很少，但可以从在线文档开始：[http://httpd.apache.org/docs/2.2/developer/](http://httpd.apache.org/docs/2.2/developer/)\n\
    \n值得一看的近期书籍是 *《Apache 模块书》*，作者 Nick Kew，Prentice Hall 出版。\n\n## 8 Ghost 项目\n\n\
    ### 8.1 一个 PHP 网站生成器项目\n\n能够用 C 语言编写简短程序来自动化繁琐任务，或完成否则需要花费数小时用笨重的工具（如邮件合并）来折腾的事情，是你会最庆幸学会的事情之一。这个项目就是这样一个省时工具。Ghost\
    \ 是一个轻量级的 PHP 生成器，供你自定义。\n\n如果你发现自己总是在构建 PHP 网站，那么一种能够一步生成所有参数传递、解码、表单构建和数据库管理代码的快速方法会很有用。像\
    \ Ruby on Rails 这样的工具提供了此类功能，但设置和运行起来复杂得多，而且你最终需要学习另一种语言才能更进一步。\n\n使用此工具的最佳入门方式可能是编译并运行它。将\
    \ `ghost.zip` 源码解压到你的 `public_html` 文件夹中，这会创建一个名为 `ghost` 的文件夹。Makefile 包含一个目标\
    \ `g1`，用于编译和链接 `ghost`。因此进入 `public_html/ghost` 并输入：`make g1`。\n\n运行站点生成器，输入：\n\
    \n- `./ghost testwebsite data1 data2 data1 data3 data4 data6 data6`\n- 这将创建：\n\
    \  - 一个文件夹 `public_html/testwebsite`\n  - 一个名为 `testwebsite` 的 MySQL 数据库表，包含文本字段\
    \ `data1 data2 data1 data3 data4 data6 data6`\n  - 一个 `testwebsite.css` 文件\n \
    \ - 空的 `header.html` 和 `footer.html` 页面\n  - `index.php`，演示了对指定数据项的数据库表进行表单处理、录入、编辑、更新和删除。\n\
    \n在浏览器中，你在 [http://localhost/~yourname/testwebsite](http://localhost/~yourname/testwebsite)\
    \ 看到的内容如下\n\n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_72_0.png)\n\n其背后的想法是，创建和管理表单内容的所有机械性部分都已完成并且可以自定义。此截图显示了提交一条记录后的结果。顶部行用于输入新数据，下方行允许编辑或删除记录。它是一个框架，允许你将部分内容取用并用于自己的网站设计。\n\
    \n让我们分段检查这段代码。\n\n第一部分声明所需数据并创建文件夹和 CSS 文件。\n\n```c\nint main(int argc, char *argv[])\n\
    {\n    FILE *out = NULL;\n    MYSQL *conn = NULL;\n    MYSQL_RES *result = NULL;\n\
    \    MYSQL_ROW row;\n    MYSQL_FIELD *field;\n    char SQL[STRINGSIZE]=\"\";\n\
    \    char BIT[STRINGSIZE]=\"\";\n    char SQLINSERT[STRINGSIZE]=\"\";\n    char\
    \ SQLUPDATE[STRINGSIZE]=\"\";\n    char SQLDELETE[STRINGSIZE]=\"\";\n    int rc=0,\
    \ i=0, num_fields=0;\n\n    //CREATE DIRECTORY////////////////////\n    sprintf(BIT,\"\
    mkdir -p ./public_html/%s\", argv[1]);\n    system(BIT);\n    //BUILD CSS////////////////////////////\n\
    \    sprintf(BIT,\"./public_html/%s/%s.css\", argv[1],argv[1]);\n    out = fopen(BIT,\"\
    w\");\n    fprintf(out,\"table {width:800;vertical-align:top;}\\n\");\n    fprintf(out,\"\
    th {font-size:80%;color:#ffd208;vertical-align:bottom;text-align:left;}\\n\");\n\
    \    fprintf(out,\"td {font-size:80%;color:#ffd208;vertical-align:bottom;text-align:left;}\\\
    n\");\n    fprintf(out,\"input {font-size:80%;color:#196419;}\\n\");\n    fprintf(out,\"\
    a {font-size:65%;color:#000000;}\\n\");\n    fclose(out);\n```\n\n接下来生成 `header.html`\
    \ 和 `footer.html` 文件。这些文件由 PHP 文件加载，可用作通用的公共页眉和页脚。CSS 文件在 `header.html` 文件中引用。\n\
    \n```c\n//BUILD HEADER HTML////////////////////////\nsprintf(BIT,\"./public_html/%s/header.html\"\
    ,argv[1]);\nout = fopen(BIT,\"w\");\nfprintf(out,\"<html>\\n\");\nfprintf(out,\"\
    <head>\\n\");\nfprintf(out,\"<link rel=\\\"stylesheet\\\" type=\\\"text/css\\\"\
    \ href=\\\"%s.css\\\" />\\n\",argv[1]);\nfprintf(out,\"<title>%s</title>\\n\"\
    ,argv[1]);\nfprintf(out,\"</head>\\n\");\nfprintf(out,\"<body>\\n\");\nfprintf(out,\"\
    <center>\\n\");\nfprintf(out,\"<table><tr><td>\\n\");\nfprintf(out,\"<td><tr><table>\\\
    n\");\nfclose(out);\n//BUILD FOOT HTML//////////////////////////\nsprintf(BIT,\"\
    ./public_html/%s/footer.html\",argv[1]);\nout = fopen(BIT,\"w\");\nfprintf(out,\"\
    </body></html>\\n\");\nfclose(out);\n```\n\n接下来我们创建数据库。\n\n```c\n//OPEN DATABASE///////////////////////////\n\
    conn = mysql_init((MYSQL *)0);\nmysql_options(conn,MYSQL_READ_DEFAULT_GROUP,\"\
    mysqlcapi\");\nmysql_real_connect(conn,\"localhost\",\"\",\"\",\"test\",0,NULL,0);\n\
    //CREATE TABLE///////////////////////////\nsprintf(SQL,\"drop table if exists\
    \ %s\",argv[1]);\nrc = mysql_query(conn,SQL);\nsprintf(SQL,\"create table %s (ID\
    \ varchar(255)\",argv[1]);\nfor(i=2; i < argc; i++)\n{\n    sprintf(BIT,\" %s\
    \ varchar(255)\",argv[i]);\n    strcat(SQL,BIT);\n}\nstrcat(SQL,\")\");\nrc =\
    \ mysql_query(conn,SQL);\n```\n\n现在开始复杂的部分：生成 PHP 脚本。理解它的最佳方式是在浏览器中查看页面源代码时检查程序的实际输出。\n\
    \n顶部行是一个表单，为 ghost 程序生成的表中定义的每一列提供一个文本框。\n\n```html\n<tr>\n<form><input type='hidden'\
    \ name='MODE' value='INSERT'>\n<td><input type='hidden' name='ID' value='1'></td>\n\
    <td><input type='text' name='data1'></td>\n<td><input type='text' name='data2'></td>\n\
    <td><input type='text' name='data3'></td>\n<td><input type='text' name='data4'></td>\n\
    <td><input type='text' name='data5'></td>\n<td><input type='text' name='data6'></td>\n\
    <td><input type='submit' value='post'></td>\n</form>\n</tr>\n```\n\n对于表中的每一行，我们现在生成一个表单以允许编辑数据，并提供一个锚链接来执行删除操作。\n\
    \n```html\n<tr>\n<form><input type='hidden' name='MODE' value='UPDATE'>\n<td><input\
    \ type='hidden' name='ID' value='0'></td>\n<td><input type='text' name='data1'\
    \ value='aaaaaaaaaa'></td>\n<td><input type='text' name='data2' value='aaaaaaaaaaaa'></td>\n\
    <td><input type='text' name='data3' value='aaaaaaaaaaaaa'></td>\n<td><input type='text'\
    \ name='data4' value='aaaaaaaaaaaa'></td>\n<td><input type='text' name='data5'\
    \ value='aaaaaaaaaaaaa'></td>\n<td><input type='text' name='data6' value='aaaaaaaaaaaa'></td>\n\
    <td><input type='submit' value='edit'></form>\n<a href='?ID=0&MODE=DELETE'>delete</a></td>\n\
    </tr>\n```\n\n仔细检查文件 `index.php` 将使你能够看到所有这些发生的位置，并倒推在 `ghost.c` 源码中的哪个位置生成了此\
    \ PHP 代码。一个好主意是在打印件上使用荧光笔，因为我们将一种语言（HTML）嵌入到另一种语言（PHP）中，而 PHP 又嵌入到另一种语言中，因此对转义字符\
    \ `\\'` 的使用非常、非常谨慎，以在必要时表达单引号和双引号，使其全部正常工作。这看起来可能很复杂——但 ghost 允许的快速原型设计使得花时间自定义\
    \ C 代码是值得的，这样你想要的 PHP 和你想要的数据库就能按你想要的方式生成。\n\n以下是 PHP 文件 `index.php` 中生成编辑或删除行的部分。静态\
    \ HTML 已高亮显示，其他部分由 MySQL PHP 函数调用插入。\n\n```php\n$result = mysql_query(\"select\
    \ * from testwebsite\");\nwhile($row = mysql_fetch_array($result))\n{\n    echo\
    \ \"<tr>\";\n    echo \"<form><input type='hidden' name='MODE' value='UPDATE'>\"\
    ;\n    for($i=0;$i < mysql_num_fields($result); $i++)\n    if($i==0)\n       \
    \ echo \"<td><input type='hidden' name='\".mysql_field_name($result,$i).\"' value='\"\
    .\n        $row[ mysql_field_name($result,$i)] .\n        \"'>\";\n        $row[\
    \ mysql_field_name($result,$i)] .\n        \"</td>\";\n    else\n        echo\
    \ \"<td><input type='text' name='\".mysql_field_name($result,$i).\"' value='\"\
    .\n        $row[ mysql_field_name($result,$i)] .\n        \"'>\";\n        \"\
    </td>\";\n    echo \"<td><input type='submit' value='edit'></form>\";\n    echo\
    \ \"<a href='?ID=\".$row[ mysql_field_name($result,0)] . \"&MODE=DELETE'>delete</a>\"\
    ;\n    echo \"</td></tr>\";\n}\nmysql_free_result($result);\nmysql_close($con);\n\
    ```\n\n正如你所见，大量的繁琐重复工作已被自动化。你可以通过修改 PHP 代码继续进行，或深入自定义生成所有内容的 C 程序。\n\n我个人经常使用\
    \ ghost 来节省建站时间，这也是我编写它的原因。我厌倦了在编写几乎相同的代码来解码 HTML 表单并填充或更新数据库时犯错。\n"
