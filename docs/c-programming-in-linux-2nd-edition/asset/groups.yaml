    \ to the screen\n\nThis will give you experience with finding things out, looking\
    \ for suitable library functions, and finding examples on-line or from a book.\n\
    \n## 4 LOGIC, LOOPS AND FLOW CONTROL\n\n### 4.1 SYNTAX OF C FLOW OF CONTROL\n\n\
