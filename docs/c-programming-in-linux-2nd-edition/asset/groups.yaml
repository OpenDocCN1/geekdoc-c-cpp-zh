    as CGI content generators because of the risk of crashes and core dumps. However
    the Apache server is itself written in C and there are simple utilities that come
    with its development tools that permit you to create code stubs into which you
    can place your C programs and run them as Apache modules when they are loaded
    as part of the server and managed safely in a kind of “sand-box”. Here we will
    take an earlier example and turn it into an Apache module.


    A utility called apxs2 is included in the Apache2 development libraries which
    can be invoked to generate a code stub for a program which can be compiled into
    a module that is loaded and managed by the Apache web server. These modules can
    be used to perform a huge variety of tasks but in our case we will do something
    which is akin the an ISAPI DLL found in the IIS server. The exact location of
    the apxs2 utility will change according to the Linux distribution you are using
    but with OpenSuse it runs like this.


    In a terminal type: `apxs2 -n labelmaker -g`


    ![](img/ad23766cfc9c69ba4f733f8b935cc3d8_66_0.png)


    This creates a folder of the name you give it (labelmaker) and a **Makefile**,
    a **modules.mk** file which can be used by the Make utility, and a file called
    **mod_labelmaker.c**.


    The C file generated is kind of like a Hello World for Apache. It may look like
    a complex thing but it does supply a long explanatory comment header which is
    worth reading. The idea is that when Apache starts any modules in a specified
    location which are configured as needing to be loaded in the server configuration
    files, will be loaded. The `*_register_hooks` function lists the names and signatures
    of functions that can be called at specific stages in the Apache server process.
    In this case if the name http://localhost/labelmaker is called this module will
    be asked to handle whatever happens in the `*_handler` function.'
