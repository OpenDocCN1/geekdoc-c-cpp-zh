    \                *\n *****************************************/\n#include <stdio.h>\n\
    \nint main(int argc, char *argv[], char *env[])\n{\n    int i=0;\n\n    printf(\"\
    Content-type:text/plain\\n\\n\");\n    printf(\"Hello, you are still learning\
    \ C!\\n\");\n    printf(\"Number of arguments to the main function:%d\\n\", argc);\n\
    \    for(i=0;i<argc;i++)\n    {\n        printf(\"argument number %d is %s\\n\"\
    , i, argv[i]);\n    }\n    i = 0;\n    printf(\"Environment variables:\\n\");\n\
    \    while(env[i])\n    {\n        printf(\"env[%d] = %s\\n\", i, env[i]);\n \
    \       i++;\n    }\n    return 0;\n}\n```\n\n使用 `gcc -o hello4 chapter1_4.c`\
    \ 编译，并以超级用户身份将程序复制到 `/srv/www/cgi-bin`（openSUSE）或 `/usr/lib/cgi-bin`（Ubuntu）。你可以在编译它的终端中使用\
    \ `./hello4` 运行它，你会看到一长串环境变量。在浏览器中输入 http://localhost/cgi-bin/hello4 时，你会看到完全不同的一组环境变量。\n\
    \n> 维基百科这样定义**环境变量**：\n> \n> “在所有 Unix 和类 Unix 系统中，每个进程都有自己私有的环境变量集合。默认情况下，当一个进程被创建时，它会继承其父进程环境的副本，除非父进程在创建子进程时做出了显式更改……所有\
    \ Unix 操作系统变体以及 DOS 和 Microsoft Windows 都有环境变量；不过，它们并不都使用相同的变量名。运行中的程序可以访问环境变量的值，用于配置目的。环境变量的示例包括……PATH、HOME……”\n\
    \n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_20_0.png)\n\n我们很快就会明白，**QUERY_STRING**\
    \ 是我们在与程序通信时一个重要的环境变量，在这个例子中，我们看到它的值为“david+haskins”，也就是我们输入的 URL 中“?”之后的所有内容。这是向像\
    \ hello4 这样的**公共网关接口**（CGI）程序发送信息的一种有效方式，但我们应该将其限制为仅一个字符串。在我们的例子中，我们使用“+”连接了两个字符串。如果我们输入：“david\
    \ haskins”，浏览器会对其进行转换，因此我们会看到：\n\n```c\nQUERY_STRING=david%20haskins\n```\n\n\
    稍后我们将学习如何将复杂的输入值集合传输到我们的程序。\n\n### 1.5 HELLO WORLD 结论\n\n我们已经看到，一个只有少量输入和一些输出的简单程序实际上极其强大，因为它揭示并暴露了我们计算机中大量内部运作机制。\n\
    \n尽管我们才刚刚开始，但已经遇到了许多我们将反复使用的关键概念：\n\n- 函数和参数\n- 作为数据类型的数字（整数）和字符串\n- 列表或数组\n-\
    \ 使用“for”和“while”的循环\n\n我们有意迈出了一大步：从编写一个只在“终端屏幕”中运行的程序，转向编写一个可在互联网浏览器中看到的程序。\n\
    \n原因在于，在 Windows、Gnome 或 KDE 等窗口系统中编写与用户交互的程序的过程极其复杂，而且这并不是你经常会被要求做的事情。\n\n如今，互联网浏览器几乎已成为我们做任何事情时事实上的界面模式，因此我们不妨从一开始就理解如何使用它。\n\
    \n在所有后续章节中，我们都将遵循这一模式：先介绍一些基本技术，然后将其应用到基于 Web 的系统中。\n\n在实践中，现实世界中的 C 公共网关接口编程并不多，但有大量基于\
    \ C 和 C++ 的代码作为 Apache 模块和 Microsoft IIS ISAPI DLL 运行。也许没有多少人知道 eBay 的许多部分是用 C/C++\
    \ 编写的。\n\n为什么？它已经快到极致，而他们在全球实时市场中与抢购者打交道的业务需要这种闪电般快速的核心，因此没有其他办法可以获得那样的性能。\n\n\
    ## 2 数据与内存\n\n### 2.1 简单数据类型？\n\n当我们编写程序时，在声明和描述变量以表示我们希望在信息处理中纳入的事物类型时，我们必须对世界的本质做出决定或断言。\n\
    \n这个过程具有深刻的哲学性；我们做出本体论断言，认为这种或那种事物存在；当我们选择特定的数据类型或数据类型集合来描述这些事物的属性时，我们做出认识论断言。这是沉重的内容，责任重大，不可轻率对待。\n\
    \n作为一个实际示例，我们可能会声明一些看起来像是地理数据库记录开头的内容。\n\n```c\n/*.......................................................\n\
    C Programming in Linux (c) David Haskins 2008\nchapter2_1.c\n.......................................................*/\n\
    \n#include <stdio.h>\n#define STRINGSIZE 256\n\nint main(int argc, char *argv[])\n\
    {\n    char town[STRINGSIZE] = \"Guildford\";\n    char county[STRINGSIZE] = \"\
    Surrey\";\n    char country[STRINGSIZE] = \"Great Britain\";\n    int population\
    \ = 66773;\n    float latitude = 51.238599;\n    float longitude = -0.566257;\n\
    \    printf(\"Town name: %s population:%d\\n\",town,population);\n    printf(\"\
    County: %s\\n\",county);\n    printf(\"Country: %s\\n\",country);\n    printf(\"\
    Location latitude: %f longitude: %f\\n\",latitude,longitude);\n    printf(\"char\
    \ = %d byte int = %d bytes float = %d bytes\\n\",\n    sizeof(char),sizeof(int),sizeof(float));\n\
    \    printf(\"memory used:%d bytes\\n\",\n        ((STRINGSIZE * 3) * sizeof(char))\
    \ + sizeof(int) + (2 * sizeof(float)));\n    return 0;\n}\n```\n\n"
