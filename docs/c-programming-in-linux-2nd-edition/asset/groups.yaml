  md: "\n### 3.4 DATA STRUCTURES\n\nSometimes we wish to manage a set of variables\
    \ as a group, perhaps taking all the values from a database record and passing\
    \ the whole record around our program to process it. To do this we can group data\
    \ into structures.\n\nThis program uses a struct to define a set of properties\
    \ for something called a player. The main function contains a declaration and\
    \ instantiation of an array of 5 players. We pass a pointer to each array member\
    \ in turn to a function to rank each one. This uses a switch statement to examine\
    \ the first letter of each player name to make an arbitrary ranking. Then we pass\
    \ a pointer to each array member in turn to a function that prints out the details.\n\
    \n```\n/* **************************************************************\n * C\
    \ Programming in Linux (c) David Haskins 2008\n * chapter3_3.c\n * **************************************************************/\n\
    #include <stdio.h>\n#include <string.h>\nstruct player\n{\n    char name[255];\n\
    \    char role[255];\n    int ranking;\n};\nvoid rank(struct player *p)\n{\n \
    \   switch(p->name[0])\n    {\n        case 'P': p->ranking = 4;break;\n     \
    \   case 'H': p->ranking = 1;break;\n        case 'R': p->ranking = 2;break;\n\
    \        case 'J': p->ranking = 5;break;\n        case 'B': p->ranking = 3;break;\n\
    \    }\n}\nvoid show(struct player *p)\n{\n    printf(\"Name:%s Role:%s Ranking:%d<br>\\\
    n\", p->name,p->role,p->ranking);\n}\nint main(int argc, char *argv[], char *env[])\n\
    {\n    struct player myteam[5] = { {\"Pele\",\"striker\",0},\n        {\"Beckham\"\
    ,\"male model\",0},\n        {\"Roddick\",\"tennis man\",0},\n        {\"Haskins\"\
    ,\"swimmer\",0},\n        {\"Jagger\",\"singer\",0}};\n    int i=0;\n    printf(\"\
    Content-type:text/html\\n\\n\");\n    for(i=0;i<5;i++) rank ( &myteam[i] );\n\
    \    for(i=0;i<5;i++) show ( myteam[i] );\n    return 0;\n}\n```\n\nThe results\
    \ are shown here, as usual in a browser:\n\n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_40_0.png)\n\
    \nThis is a very powerful technique that is quite advanced but you will need to\
    \ be aware of it. The idea of structures leads directly to the idea of classes\
    \ and objects.\n\nWe can see that using a struct greatly simplifies the business\
    \ task of passing the data elements around the program to have different work\
    \ done. If we make a change to the definition of the struct it will still work\
    \ and we simply have to add code to handle new properties rather than having to\
    \ change the argument lists or signatures of the functions doing the work.\n\n\
    The definition of the structure does not actually create any data, but just sets\
    \ out the formal shape of what we can instantiate. In the main function we can\
    \ express this instantiation in the form shown creating a list of sequences of\
    \ data elements that conform to the definition we have made.\n\nYou can probably\
    \ see that a struct with additional functions or methods is essentially what a\
    \ class is in Java, and this is also the case in C++. Object Oriented languages\
    \ start here and in fact many early systems described as \"object oriented\" were\
    \ in fact just built using C language structs.\n\nIf you take a look for example,\
    \ at the Apache server development header files you will see a lot of structs\
    \ for example in this fragment of httpd.h:\n\n```c\nstruct server_addr_rec {\n\
    \    /** The next server in the list */\n    server_addr_rec *next;\n    /** The\
    \ bound address, for this server */\n    apr_sockaddr_t *host_addr;\n    /** The\
    \ bound port, for this server */\n    apr_port_t host_port;\n    /** The name\
    \ given in <VirtualHost> */\n    char *vhost;\n};\n```\n\nDon't worry about what\
    \ this all means – just notice that this is a very common and very powerful technique,\
    \ and the design of data structures, just like the design of database tables to\
    \ which it is closely related are the core, key, vital task for you to understand\
    \ as a programmer.\n\nYou make the philosophical decisions that the **world is\
    \ like this** and can be modelled in this way. A heavy responsibility – in philosophy\
    \ this work is called **ontology** (what exists?) and **epistemology** (how we\
    \ can know about it?). I bet you never thought that this was what you were doing!\n\
    \n### 3.5 FUNCTIONS, POINTERS AND STRUCTURES – CONCLUSION\n\nWe have used some\
    \ simple data types to represent some information and transmit input to a program\
    \ and to organise and display some visual output.\n\nWe have used HTML embedded\
    \ in output strings to make output visible in a web browser.\n\nWe have learned\
    \ about creating libraries of functions for reuse.\n\nWe have learned about data\
    \ structures and the use of pointers to pass them around a program.\n\n## Exercise:\n\
