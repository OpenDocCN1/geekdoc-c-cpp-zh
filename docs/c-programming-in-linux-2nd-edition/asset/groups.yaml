    \ 库函数会以整数形式返回该大小。在这种情况下，有 3 × 256 个字符、一个整数和两个浮点数。确切大小取决于机器，但很可能为 780 字节。\n\n在声明数据的函数之外，该数据是不可访问的——这就是声明的**作用域**。如果我们是在\
    \ main() 函数之外声明的，那么它的作用域将是**全局**的，其他函数也可以访问它。如果你愿意，C 允许你做这种危险的事情，所以要小心。\n\n通常我们会密切关注数据的作用域，并向程序中可能需要对数据进行处理甚至修改的部分传递**只读副本**或数据的**带标签的内存地址**。这些带标签的内存地址称为**指针**。\n\
    \n我们使用 **printf** 库函数族进行输出（**sprintf** 用于创建字符串，**fprintf** 用于写入文件等），它们都使用一个共同的**格式字符串**参数来指定数据的表示方式。\n\
    \n- %c 字符\n- %s 字符串\n- %d 整数\n- %f 浮点数等\n\n参数中其余的一系列变量会按照指定顺序依次放入格式字符串中。\n\n在\
    \ C 语言中，最好对你声明的任何数据进行初始化，因为分配给它们的内存内容不会被清除，可能包含任何旧的垃圾数据。\n\n使用以下命令编译： `gcc -o\
    \ data1 chapter2_1.c -lc`\n\n使用 ./data1 调用程序时的输出：\n\n> 城镇名称：Guildford 人口：66773\n\
    > 县：Surrey\n> 国家：Great Britain\n> 位置纬度：51.238598 经度：-0.566257\n> char = 1 字节 int\
    \ = 4 字节 float = 4 字节\n> 内存使用：780 字节\n\n## 关于 **make** 这一实用工具的说明\n\n到目前为止，你可能已经厌倦了输入所有这些编译器命令，因此有一个名为\
    \ **make** 的实用工具，它会在代码所在文件夹中运行一个名为 **Makefile** 的文件。以下是到目前为止示例的 Makefile：\n\n\
    ```makefile\n#Makefile\nall:chap1 chap2\nchap1: 1-1 1-2 1-3 1-4\n1-1:\n\tgcc -o\
    \ hello1 chapter1_1.c -lc\n1-2:\n\tgcc -o hello2 chapter1_2.c -lc\n1-3:\n\tgcc\
    \ -o hello3 chapter1_3.c -lc\n1-4:\n\tgcc -o hello4 chapter1_4.c -lc\nchap2: 2-1\
    \ 2-2\n2-1:\n\tgcc -o data1 chapter2_1.c -lc\n2-2:\n\tgcc -o data2 chapter2_2.c\
    \ -lc\nclean:\n\trm hello* data* *~\n```\n\n要编译所有内容，请键入 **make all**  \n要编译 chapter2_1.c\
    \ 的目标 2-1，请键入 **make 2-1**  \n每个 make 目标后面的制表符对 make 的语法至关重要\n\n在代码包中，有一份针对整本书的\
    \ Makefile。\n\n### 2.2 什么是字符串？\n\n一些编程语言（如 Java 和 C++）具有**字符串数据类型**，它隐藏了在看似简单的事物之下的一些复杂性。\n\
    \n字符串的一个基本属性是：它是一系列长度不确定的单个字符元素。\n\n我们通过键盘输入的大多数单个字符都由简单的数字 ASCII 码表示，C 语言数据类型\
    \ **char** 用于存储字符数据。\n\n字符串以字符**数组**的形式存储，并以 NULL 结尾，因此数组必须足够大，以容纳字符序列加一个结束符。请记住，数组成员始终从零开始计数。\n\
    \n在这个例子中，我们可以看到 5 个单独的字符被声明并初始化为值，以及一个被设置为“”的空字符数组。\n\n请注意字符周围使用的单引号‘和字符串周围使用的双引号“之间的区别。\n\
    \n```c\n/************************************************\n* C Programming in\
    \ Linux (c) David Haskins 2008\n* chapter2_2.c                               \
    \  *\n************************************************/\n#include <stdio.h>\n\n\
    int main(int argc, char *argv[], char *env[])\n{\n        char c1 = 'd';\n   \
    \     char c2 = 'a';\n        char c3 = 'v';\n        char c4 = 'i';\n       \
    \ char c5 = 'd';\n        char name[6] = \"\";\n\n        sprintf(name,\"%c%c%c%c%c\"\
    ,c1,c2,c3,c4,c5);\n        printf(\"%s\\n\",name);\n        return 0;\n}\n```\n\
    \n使用以下命令编译： `gcc -o data2 chapter2_2.c -lc`\n\n使用 ./data2 调用程序时的输出：\n\n> david\n\
    \n### 2.3 字符串可能“意味着”什么\n\n什么都可以——赋予变量的名称及其含义或用途完全取决于观察者的想法。试试这个\n\n```c\n/*------------------------------------------------------------\n\
    * C Programming in Linux (c) David Haskins 2008\n* chapter2_3.c\n*------------------------------------------------------------*/\n\
    #include <stdio.h>\n#include <string.h>\n\nint main(int argc, char *argv[], char\
    \ *env[])\n{\n    printf(\"Content-type:text/html\\n\\n\");\n    printf(\"<html>\\\
    n\");\n    printf(\"<body bgcolor=\\\"%s\\\">\\n\",argv[1]);\n    printf(\"<body>\\\
    n\");\n    printf(\"</html>\\n\");\n    return 0;\n}\n```\n\n使用以下命令编译： gcc -o\
    \ data3 chapter2_3.c -lc\n\n以超级用户身份将程序复制到你的 public_html/cgi-bin 目录（或 /srv/www/cgi-bin（OpenSuse）或\
    \ /usr/lib/cgi-bin（Ubuntu））。\n\n在浏览器中输入：http://localhost/cgi-bin/data3?red  \n\
    你应该看到的是：\n\n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_28_0.png)\n\n或者，如果你发送任何参数，你会得到令人惊讶的结果：\n\
    \n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_28_1.png)\n\n我们在这里所做的是**使用**字符串参数**argv[1]**作为\
    \ **HTML** body 标签内的背景颜色代码。我们将 Content-type 规范更改为 text/html，于是奇迹般地，我们的程序现在正在生成\
    \ HTML 内容。一种语言在另一种语言中表达。Web 浏览器理解有限的颜色术语，颜色也可以通过十六进制代码定义，例如 #FFFFFF（白色）、#FF0000（红色）、#00FF00（绿色）、#0000FF（蓝色）。\n\
    \n这个有趣的练习不仅仅是一个小技巧，一个程序可以用另一种语言生成另一个程序的想法非常强大，并且是整个互联网力量背后的关键。当我们从这样一个**公共网关接口程序**生成\
    \ HTML（或 XML 或其他任何东西）时，我们是在创建**动态内容**，它可以链接到实时的、变化的数据，而不是**静态**的预编辑网页。实际上，大多数网站都混合了动态和静态内容，但在这里我们看到了如何在非常简单的层面上实现这一点。\n\
    \n在整本书中，我们将浏览器作为程序的首选界面，因此我们将生成 HTML 和二进制图像流 Web 内容，纯粹是为了即时展示程序的能力。在终端屏幕上查看代码并不令人印象深刻，而编写窗口类型的应用程序也不是那么简单直接。\n\
    \n实际上，你可能被要求编写的大多数软件都会在 Web 上运行，所以我们不妨马上从这个想法开始。大多数 Web 应用程序也涉及**多种语言**，如 CSS、(X)HTML、XML、JavaScript、PHP、JAVA、JSP、ASP、.NET、SQL。如果这听起来令人恐惧，请不要惊慌。对\
    \ C 的了解将向你展示，这些执行不同功能的语言中，有许多在语法上都是以 C 为基础的。\n\n### 2.4 解析字符串\n\n从某种输入字符串中提取含义或有价值信息的工作称为“解析”。现在，我们将构建另一个有趣的、可通过互联网调用的\
    \ CGI 程序，以展示我们手中的力量。\n\n"
