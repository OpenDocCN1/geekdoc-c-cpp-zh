    \n- **time.h**\n  - 时间函数 例如：\n    - `asctime` `clock` `difftime` `time`\n\n在你发现需要做某事然后才去寻找为此目的编写的函数或函数库之前，学习库函数是没有意义的。你需要理解函数签名——即参数列表的含义以及如何使用它，以及函数将返回什么或对作为指针传递给函数的变量执行什么操作。\n"
