    ## 12 结论


    现在你已经完成了这些简单的示例，我希望你能明白为什么掌握 C 语言始终是一项有用且持续实用的技能。


    25 年过去了，我仍然经常编写 C 程序来快速有效地完成日常工作；一旦写成，它们就成为一套耐用工具的一部分，适合我使用，而且可移植。


    这本小书包含多年来我学到的一些“技巧”，关于这些技巧几乎没有明确的文档资料；而且坦率地说，它预设了读者熟悉 Linux。在让经验水平各异的学生测试这些材料之后，我相信，一个专注细心的学生能让所有这些材料运行起来，并能从那里开始发现
    C 的乐趣。我的许多学生说：“这比 Java 有趣多了，我能看到真正发生了什么！”这令人非常欣慰，也让我相信你会发现这些材料很有用。


    有兴趣的人可以请出版商委托我写一本配套书：


    *Linux 下的 C++ 标准模板库编程*


    祝你好运，编程愉快。


    大卫

    2009 年 3 月 31 日

