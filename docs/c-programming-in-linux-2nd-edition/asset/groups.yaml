    \ Giant which are adequate for simple labelling but you can also use TrueType\
    \ fonts for more attractive output.\n\nGeometric drawing with lines or certain\
    \ styles, filled and open polygons, and circles, arcs can be created. The main\
    \ thing to remember is that the origin of an image is the **TOP left hand corner**\
    \ which might seem unintuitive to anyone who has studied mathematics – quite why\
    \ this is I have never discovered but can only imagine that the first programmer\
    \ to do anything in this area happened to not know about graphs in which we think\
