    \n正如我们之前学到的，数据的 **作用域** 限制在声明它的 **函数** 中，因此我们使用 **指针** 来指向数据和数据块，以便将它们传递给函数，以便对数据进行一些操作。我们已经看到字符串被处理为以\
    \ NULL 字符结尾的单个字符数组的指针。\n\n```c\n/**************************************************************\n\
    * C Programming in Linux (c) David Haskins 2008\n* chapter3_1.c              \
    \                             *\n**************************************************************/\n\
    \n#include <stdio.h>\n#include <string.h>\n#include <math.h>\n\ndouble doit(int\
    \ number1, int number2)\n{\n    return sqrt((double)(number1 + number2) );\n}\n\
    \nint main(int argc, char *argv[], char *env[])\n{\n    int n1 = 0, n2 = 0, i=0;\n\
    \    n1 = atoi((char *) strtok(argv[1],\":\"));\n    n2 = atoi((char *) strtok(NULL,\"\
    :\"));\n    printf(\"Content-type:text/html\\n\\n<html><body>\\n\");\n    for(i=1;i<=100;i++)\n\
    \        printf(\"%f \",doit(n1,n2));\n    printf(\"</body></html>\\n\");\n  \
    \  return 0;\n}\n```\n\n在此示例中，我们可以重复调用函数“doit”，它接受两个整数参数并返回某些数学计算的结果。\n\n**编译：**\
