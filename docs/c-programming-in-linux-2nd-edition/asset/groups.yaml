  mdcn: "\n### 3.4 数据结构\n\n有时我们希望将一组变量作为一个整体来管理，也许是从数据库记录中取出所有值，并将整条记录在程序中传递以进行处理。为此，我们可以将数据分组到结构体中。\n\
    \n这个程序使用一个结构体为称为 player 的对象定义一组属性。main 函数包含一个由 5 个 player 组成的数组的声明和实例化。我们依次将指向每个数组成员的指针传递给一个函数，以便为每个成员排名。该函数使用\
    \ switch 语句检查每个 player 名字的首字母，以进行任意排名。然后我们依次将指向每个数组成员的指针传递给一个打印详细信息的函数。\n\n```\n\
    /* **************************************************************\n * C Programming\
    \ in Linux (c) David Haskins 2008\n * chapter3_3.c\n * **************************************************************/\n\
    #include <stdio.h>\n#include <string.h>\nstruct player\n{\n    char name[255];\n\
    \    char role[255];\n    int ranking;\n};\nvoid rank(struct player *p)\n{\n \
    \   switch(p->name[0])\n    {\n        case 'P': p->ranking = 4;break;\n     \
    \   case 'H': p->ranking = 1;break;\n        case 'R': p->ranking = 2;break;\n\
    \        case 'J': p->ranking = 5;break;\n        case 'B': p->ranking = 3;break;\n\
    \    }\n}\nvoid show(struct player *p)\n{\n    printf(\"Name:%s Role:%s Ranking:%d<br>\\\
    n\", p->name,p->role,p->ranking);\n}\nint main(int argc, char *argv[], char *env[])\n\
    {\n    struct player myteam[5] = { {\"Pele\",\"striker\",0},\n        {\"Beckham\"\
    ,\"male model\",0},\n        {\"Roddick\",\"tennis man\",0},\n        {\"Haskins\"\
    ,\"swimmer\",0},\n        {\"Jagger\",\"singer\",0}};\n    int i=0;\n    printf(\"\
    Content-type:text/html\\n\\n\");\n    for(i=0;i<5;i++) rank ( &myteam[i] );\n\
    \    for(i=0;i<5;i++) show ( myteam[i] );\n    return 0;\n}\n```\n\n结果如下所示，一如既往地显示在浏览器中：\n\
    \n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_40_0.png)\n\n这是一种非常强大且相当高级的技术，但你需要了解它。结构体的思想直接引出了类和对象的思想。\n\
    \n我们可以看到，使用结构体极大地简化了在程序中传递数据元素以完成不同工作的业务任务。如果我们更改结构体的定义，它仍然可以工作，我们只需添加代码来处理新属性，而不必更改执行工作的函数的参数列表或签名。\n\
    \n结构体的定义实际上并不创建任何数据，而只是规定我们可以实例化的内容的形式结构。在 main 函数中，我们可以用所示的形式表达这种实例化：创建一个由符合我们所做定义的数据元素序列组成的列表。\n\
    \n你大概可以看出，带有附加函数或方法的结构体本质上就是 Java 中的类，C++ 中也是如此。面向对象语言从这里开始；事实上，许多早期被称为“面向对象”的系统实际上只是用\
    \ C 语言结构体构建的。\n\n例如，如果你看一下 Apache 服务器开发的头文件，你会看到很多结构体，例如在 httpd.h 的这个片段中：\n\n\
    ```c\nstruct server_addr_rec {\n    /** The next server in the list */\n    server_addr_rec\
    \ *next;\n    /** The bound address, for this server */\n    apr_sockaddr_t *host_addr;\n\
    \    /** The bound port, for this server */\n    apr_port_t host_port;\n    /**\
    \ The name given in <VirtualHost> */\n    char *vhost;\n};\n```\n\n不必担心这一切意味着什么——只需注意，这是一种非常常见且非常强大的技术；而数据结构的设计，就像与之密切相关的数据库表设计一样，是作为程序员的你需要理解的核心、关键且至关重要的任务。\n\
    \n你要做出哲学上的决定：**世界就是这样**，并且可以用这种方式建模。这是一项沉重的责任——在哲学中，这项工作被称为**本体论**（存在什么？）和**认识论**（我们如何认识它？）。我敢打赌，你从未想过自己正在做的就是这件事！\n\
    \n### 3.5 函数、指针与结构体——结论\n\n我们已经使用一些简单的数据类型来表示某些信息、向程序传递输入，并组织和显示某些可视化输出。\n\n我们已经使用嵌入在输出字符串中的\
    \ HTML，使输出能在 Web 浏览器中显示。\n\n我们已经学习了如何创建可复用的函数库。\n\n我们已经学习了数据结构，以及使用指针在程序中传递它们。\n\
    \n## 练习：\n\n使用 C 库函数创建一个程序，该程序：\n\n- 以写模式打开文件，\n- 将命令行参数写入该文件\n- 关闭文件\n- 以读模式打开文件\n\
    - 读取内容\n- 关闭文件\n- 将其打印到屏幕上\n\n这将让你获得查找信息、寻找合适的库函数，以及从网上或书中查找示例的经验。\n\n## 4 逻辑、循环与流程控制\n\
    \n### 4.1 C 流程控制的语法\n\n我们可以使用以下 C 构造来控制程序执行。\n\n当我们可以按计数方式遍历一个序列或一系列内容时：\n\n```\n\
    for( initial value; keep on until ; incremental change )\n{ do this; and this;\
    \ and this; }\n```\n\n当我们等待某个条件发生变化时：\n\n```\nwhile( this is true )\n{ do this;\
    \ and this; and this; }\n```\n\n或者如果我们想至少做一次再测试：\n\n```\ndo { do this; and this;\
    \ and this; }\nwhile( this is true )\n```\n\n当我们只有一个选项要测试时：\n\n```\nif( this is\
    \ true )\n{ do this; and this; and this; }\nelse\n{ do this; and this; and this;\
    \ }\n```\n\n当我们有更多选项要测试时：\n\n```\nif( this is true )\n{ do this; and this; and\
    \ this; }\nelse if ( this is true )\n{ do this; and this; and this; }\nelse\n\
    { do this; and this; and this; }\n```\n\n当我们有更多基于整数或单个字符值要测试的选项时：\n\n```\nswitch(\
    \ on an integer or character value )\n{\n    case 0: do this; and this; and this;\
    \ break;\n    case n: do this; and this; and this; break;\n    default:do this;\
    \ and this; and this; break;\n}\n```\n\n### 4.2 控制发生什么以及以何种顺序发生\n\n这一部分全都围绕 if、then、else\
    \ 以及 true 和 false——即我们如何表达和控制程序执行的基本构件。这可能是一份非常枯燥乏味的材料，因此为了让它更易懂，我们将解决一个你在做任何有一定复杂度的交互式\
    \ Web 工作时都需要解决的问题。\n\n我们将构建一个可供使用的东西，以提供类似于 Java servlet 中典型的 getParameter(\"\
    ITEM1\") 方法或 PHP 中 $_REQUEST[\"ITEM1\"] 函数所能获得的功能。\n\n在第 1 章中我们看到，可以通过 main 函数的隐式参数访问环境变量。我们还可以使用库函数\
    \ getenv() 来请求任何指定名称的环境变量的值。\n\n```\n/* ********************************************************\n\
    \ * C Programming in Linux (c) David Haskins 2008\n * chapter4_1.c\n ********************************************************\
    \ */\n#include <stdio.h>\n#include <string.h>\n\nint main(int argc, char *argv[],\
    \ char *env[])\n{\n    printf(\"Content-type:text/html\\n\\n<html><body bgcolor=#23abe2>\\\
    n\");\n    char value[256] = \"\";\n    strncpy(value,(char *) getenv(\"QUERY_STRING\"\
    ),255);\n    printf(\"QUERY_STRING : %s<BR>\\n\", value );\n    printf(\"<form>\\\
    n\");\n    printf(\"<input type='TEXT' name='ITEM1'\\n\");\n    printf(\"<input\
    \ type='TEXT' name='ITEM2'\\n\");\n    printf(\"<input type='SUBMIT'>\\n\");\n\
    \    printf(\"</form></body></html>\\n\");\n    return 0;\n}\n```\n\n可能需要一遍又一遍地做，因此有一段可以反复调用的代码是合理的。\n\
    \n在下一个示例中，我们添加这个函数，输出中一个明显的区别是：在解析提取出的值之后，我们可以将这些值插入 HTML 输入框。我们似乎已经成功创建了类似 Java\
    \ getParameter() 函数的东西——但真是这样吗？\n\n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_45_0.png)\n\
    \n好好仔细看看 chapter4_2.c，并用 A-Z、a-z 或数字之外的字符试一试，你就会发现有些地方不太对劲。这里发生了某种编码！\n\n如果我在第一个字段中输入\
    \ **DAVID !!!**：\n\n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_45_1.png)\n\n我得到这样的结果：\n\
    \n![](img/ad23766cfc9c69ba4f733f8b935cc3d8_45_2.png)\n"
