    \n## 3 函数、指针和结构体\n\n### 3.1 函数\n\n我们所有程序的入口点称为 main()，这是一个 **函数**，或一段 **代码片段**，它执行某些操作，通常会返回某个值。我们将程序结构化为函数，以防止它们变成长而不可读的代码块，无法在一屏或一页中显示，同时确保不会在各处重复相同的代码片段。我们可以调用\
