    The program produces this output when called with **cgi-bin/gdgraph1?TEXT=DavidHaskins**


    ![](img/ad23766cfc9c69ba4f733f8b935cc3d8_59_0.png)


    While this is not the most fancy or attractive exercise but does at least demonstrate
    the key principles involved in generating graphical output. With the GD library
    you can load existing images and generate them in many formats such as **GIF,
    JPEG, PNG, WMBP** and even create **animated GIFS**.


    If you have used PHP development tools you will recognise the GD library functions
    as they are pretty well identical showing that PHP is a wrapper in this case around
    the same C library.


    The text displayed here is using one of the internal fonts, Tiny, Small, Medium
    Bold, Large and Giant which are adequate for simple labelling but you can also
    use TrueType fonts for more attractive output.


    Geometric drawing with lines or certain styles, filled and open polygons, and
    circles, arcs can be created. The main thing to remember is that the origin of
    an image is the **TOP left hand corner** which might seem unintuitive to anyone
    who has studied mathematics – quite why this is I have never discovered but can
    only imagine that the first programmer to do anything in this area happened to
    not know about graphs in which we think of the origin x=0, y=0 as being at the
    bottom left hand.


    Colours are specified as RGB values in the range 0 to 255 so that white is 255,255,255
    and red is 255,0,0. To work out fine-grained hues use a graphics tool like GNU
    GIMP which has colour pickers so you can find out subtle RGB values. Palettes
    of colours from one image can be used in another and the closest colour in a palette
    requested or created if there is space for it to be allocated.'
