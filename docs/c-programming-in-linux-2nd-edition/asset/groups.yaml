    \ 命令前加上“sudo”并提供密码，如下例所示：\n\n```\nsudo cp hello3 /srv/www/cgi-bin/hello3\n```\n\
    \n该命令将文件“hello3”复制到 Apache 服务器存放公共网关接口（cgi）程序的区域。\n\n在 KDE 中，“kdesu konqueror”会以超级用户身份打开文件管理器。\n\
    \n在 Gnome 中，“gnomesu nautilus”会以超级用户身份打开文件管理器。\n\n你需要安装以下软件包：\n\n| 软件包 | Ubuntu\
    \ | Open Suse |\n|---|---|---|\n| C 开发库 | build-essential | Base Development (pattern)\
    \ |\n| Apache Web 服务器 | apache2 | Web and LAMP Server (pattern) |\n| Apache 开发库\
    \ | apache2-prefork-dev | apache2-devel |\n| MySQL 服务器、客户端和开发库 | mysql-server\
    \ libmysqlclient-dev | libmysqlclient-devel |\n| GD 及开发库 | libgd2-xpm libgd2-xpm-dev\
    \ | gd gd-devel |\n\n在全文你会看到对文件夹 **cgi-bin** 的引用。该文件夹的位置因 Linux 发行版而异。默认情况下，用于\
    \ Web 程序的该文件夹是：\n\n- OpenSuse：**/srv/www/cgi-bin**\n- Ubuntu：**/usr/lib/cgi-bin**\n\
    \n要将程序放到那里，你需要超级用户权限，因此更好的做法可能是在你自己的 `home/*******/public_html/cgi-bin` 目录中创建一个文件夹，并修改\
    \ Apache 配置文件（OpenSuse）**/etc/apache2/default-server.conf** 或（Ubuntu）**/etc/apache2/sites-available/default.**\
    \ 中的 **ScriptAlias** 及相关 **Directory** 引用。\n\n## 1 你好，世界\n\n### 1.1 HELLO 程序 1\n\
    \n使用文件管理器（KDE 中为 Konqueror，Gnome 中为 Nautilus）在主目录中的某个位置创建一个新目录，名称要适合本书中的所有示例，或许可以叫“Programming_In_Linux”，名称中不要有任何空格。\n\
    \n打开一个编辑器（KDE 中为 kate，Gnome 中为 gedit），输入（或从提供的源代码 zip 包中复制）以下内容：\n\n```c\n/************************************************\n\
    C Programming in Linux (c) David Haskins 2008\nchapter1_1.c\n************************************************/\n\
    \n#include <stdio.h>\n\nint main(int argc, char *argv[])\n{\n    printf(\"Hello,\
    \ you are learning C!\\n\");\n    return 0;\n}\n```\n\n将文本保存为 **chapter1_1.c**，放在你在主目录中创建的新文件夹里。\n\
    \n打开终端窗口并输入：**gcc -o hello chapter1_1.c**，将程序编译成可执行形式。\n\n现在输入“ls -l”列出该目录中所有文件的详细信息。你应该会看到\
    \ chapter1_1.c 在那里，还有一个名为“hello”的文件，它就是刚刚编写的 C 程序编译后的结果。\n\n现在输入：**./hello** 来执行或运行该程序，它应返回以下文本：\n\
    \n> “你好，你正在学习 C!!”。\n\n如果这成功了，恭喜你，你现在是一名程序员了！\n\n### 程序剖析：\n\n/*... ...*/ 中的部分是注释，不会被编译，仅供信息和参考。\n\
    \n“#include...”部分告诉编译器需要哪些系统库，以及此程序引用了哪些头文件。在我们的例子中使用了“printf”，它定义在 stdio.h 头文件中。\n\
    \n“int main(int argc, char \\*argv[])”部分是实际程序的开始。这是一个入口点，大多数 C 程序都有一个 main 函数。\n\
    \n“int argc”是函数“main”的一个参数，它是一个整数，表示在“char \\*argv[]”（一个指向字符串的指针列表）中传入的字符串参数数量，这些参数可能是在命令行运行程序时传入的。\n\
    \n指向某物的指针是赋予此类数据类型的内存地址的名称。我们可以有指向整数的指针：int \\*ptr，或指向浮点数的指针：float \\*fPtr。任何事物列表都用\
    \ [] 描述，如果我们确切知道列表有多大，可以将其声明为 [200]。在本例中，我们知道第二个参数是一个指向字符串的指针列表。\n\n花括号内的其他所有内容都是\
    \ main 函数，在本例中就是按行表达的整个程序。\n\n每一行或每条语句都以分号“;”结束。\n\n我们有像“printf(...)”这样的函数调用，它是对定义在头文件\
    \ stdio.h 中的标准输入/输出库的调用。\n\n在程序末尾，“return 0”通过向系统返回零来结束程序。\n\n返回值通常用于在程序未能正确运行时指示成功或状态。\n\
    \n### 1.2 HELLO 程序 2\n\n把这个示例再推进一步，检查程序开头处入口点函数的声明：int main(int argc, char \\\
    *argv[])。用通俗的话说，这意味着：名为“main”的函数返回一个整数，接受两个参数：一个名为“argc”的整数，它是命令行参数数量的计数；然后是 \\\
    *argv[]，它是一个指向字符串的指针列表或数组，这些字符串是你在命令行运行程序时实际输入的参数。\n\n### 一些定义：\n\n- **函数**：一段程序代码块，具有**返回数据类型**、一个名称、一些由逗号分隔的不同数据类型的参数，这些参数括在**括号**中，然后是括在**花括号**中的函数体，每条语句以**分号**结尾。\n\
    - **整数符号 int**：像 0,1,2,3,4,5 这样的计数数字。\n- **列表、数组符号 []**：按编号顺序排列的同类事物的序列。\n- **指针符号\
    \ \\***：定位某一类型数据起始位置的内存地址。\n- **字符串或 char \\***：指向字符序列的指针，例如由 'c'、'a'、't' 组成的“cat”。字符串以特殊字符\
    \ NULL 或 `'\\0'`（ASCII 值 0 或十六进制 00）结尾。\n\n在我们开始慌乱之前，让我们重写这个程序，看看这一切意味着什么。\n\n\
    ```c\n/**********************************************************************\n\
    C Programming in Linux (c) David Haskins 2008\nchapter1_2.c\n**********************************************************************/\n\
    #include <stdio.h>\n\nint main(int argc, char *argv[])\n{\n    int i=0;\n    printf(\"\
    Hello, you are learning C!\\n\");\n    printf(\"Number of arguments to the main\
    \ function:%d\\n\", argc);\n    for(i=0; i<argc; i++)\n    {\n        printf(\"\
    argument number %d is %s\\n\", i, argv[i]);\n    }\n    return 0;\n}\n```\n\n\
    将文本保存为 **chapter1_2.c**，放在同一文件夹中。\n\n打开终端窗口并输入：**gcc -o hello2 chapter1_2.c**，将程序编译成可执行形式。\n\
    \n现在输入 **ls -l** 列出该目录中所有文件的详细信息。你应该会看到 chapter1_2.c 在那里，还有一个名为 **hello2** 的文件，它就是刚刚编写的\
    \ C 程序编译后的结果。\n\n现在输入 **./hello2** 来执行或运行该程序，它应返回以下文本：\n\n```\nHello, you are\
    \ still learning C!!\nNumber of arguments to the main function:1\nargument number\
    \ 0 is ./hello2\n```\n\n我们可以看到，程序本身的名称也被计为一个命令行参数，而且参数列表或数组中事物的计数从零开始，而不是从一开始。\n\
    \n现在输入 **./hello2 my name is David** 来执行该程序，它应返回以下文本：\n\n```\nHello, you are still\
    \ learning C!!\nNumber of arguments to the main function:5\nargument number 0\
    \ is ./hello2\nargument number 1 is my\nargument number 2 is name\nargument number\
    \ 3 is is\nargument number 4 is David\n```\n\n那么，这里发生了什么？看起来我们正在回读为运行程序而输入的每个字符串（单词）。\n\
    \n"
