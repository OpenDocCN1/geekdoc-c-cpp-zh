  md: '# readonly


    The readonly method causes ActiveRecord:Resource to return Active Record objects
    that cannot be stored back into the database.


    If we use joins or select methods, objects will automatically be marked read-only.


    # group


    The group method adds a group clause to the SQL generated by find:


    ```

    summary = LineItem.select("sku, sum(amount) as amount")ngroup("sku")

    ```


    # lock


    The lock method takes an optional string as a parameter. If we pass a string,
    it should be a SQL fragment in our database''s syntax that specifies a kind of
    lock. With MySQL, for example, a share mode lock gives us the latest data in our
    row and guarantees that no one else can alter that while we hold the lock. We
    could write code that debits an account only if there are sufficient funds something
    like the following:


    ```

    Account.transaction do ac = Account.where(:id=>id).lock("LOCK IN SHARE MODE").first
    ac.balance -= amount if ac.balance > amount ac.save end

    ```


    If we don''t specify a string value, or give lock a value of true, the database''s
    default exclusive lock is obtained (normally this is for ''update''). We can often
    eliminate the need for this kind of locking using transactions (discussed starting
    on page 308).


    Databases can do more than simply find and reliably retrieve data, they can also
    do a bit of data reduction analysis. Rails provides access to these methods too.


    # Getting Column Statistics


    Rails has the ability to perform statistics on the values in a column. For example,
    given a table of orders, we can calculate the following:


    ```

    average = Order.average(:amount) # number of orders max = Order.maximum(:amount)
    min = Order.minimum(:amount) total = Order.sum(:amount) number = Order.count

    ```


    These all correspond to aggregate functions in the underlying database, but they
    work in a database-independent manner.'
