  md: "we'll get to that in a minute). If the save succeeds, we do two things. First,\
    \ we ready ourselves for this customer's next order by deleting the cart from\
    \ the session. Then, we redraw the catalog using the redirect_to method to display\
    \ a cheerful message. If, instead, the save fails, we redirect the checkout form.\n\
    \nIn the create action we assumed the order object contains the method add_line_items_from_cart,\
    \ so we let that method now:\n\n```\nDownload depot_pi_pop/app/models/order.rb\n\
    class Order < ActiveRecord::Base\n  # ...\n  def add_line_items_from_cart(cart)\n\
    \    cart.line_items.each do |item|\n      item.cart_id = nil\n      line_items\
    \ << item\n    end\n  end\nend\n```\n\nFor each item that we transfer from the\
    \ cart to the order we need to do two things. First we set the cart_id to nil\
    \ in order to prevent the item from going poof when we destroy the cart.\n\nThen\
    \ we add the item itself we didn't have to do anything special with the various\
    \ foreign key fields, such as setting the order_id column in the line item rows\
    \ to reference the newly created order row. Rails does that for us using the has_many\
    \ and belongs_to declarations we added to the Order and Lineitem models. Appending\
    \ each new line item to the line_items collection handles the responsibility for\
    \ key management over Rails.\n\nWe will also need to modify the test to reflect\
    \ the new redirect:\n\n```\nDownload depot_pi/test/functional/orders_controller_test.rb\n\
    require 'test_helper'\nclass OrdersControllerTest < ActionController::TestCase\n\
    \  # ...\n  test 'should create order' do\n    assert_difference('Order.count')\
    \ do\n      post :create, :order => @order.attributes\n    end\n\n    assert_redirected_to\
    \ :store_path\n  end\n  # ...\n```\n\nAnd we modify the test fixture to make one\
    \ product be in the first order (leaving one product in the first cart for using\
    \ in the cart tests):"
