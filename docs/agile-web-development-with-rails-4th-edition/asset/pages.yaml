  md: 'Just think: all of that was made possible by the addition of a single line
    to your Gemfile.


    As we stated at the beginning of this chapter, adding gems to your Gemfile is
    the preferred way to extend Rails 3.0. The advantages of doing so are numerous:
    all of your dependencies are tracked by Bundle, are preloaded for immediate use
    of your application, and can be packed for early deployment.


    At the time of this writing, the instructions for installing ActiveMerchant have
    not been updated on their website; they describe three ways to install this function,
    depending on the version of Rails you are using. What we have described above
    is the method you should use whenever possible.


    Next, we will cover an extension which is not made available as a gem.


    # 26.2 Saving Bandwidth with Asset Packager


    Inside your Depot you now have multiple CSS files. These files are not as compact
    as they could possibly be: instead they are written in a way that makes your development
    and maintenance easier. However, if your site gets significant traffic, it might
    make sense to deliver this same content in fewer requests, and to have those requests
    serve fewer bytes.


    This is the function that the Asset Packager plugin provides. Unlike Active Merchant,
    Asset Packager is not currently available as a gem. The disadvantages of non-gem
    plugins vs gem plugins is that you don''t get any dependency tracking, a way to
    verify that the plugin is compatible with the version of other gems you have installed
    or any convenient to check for updates.


    As this function has no dependencies other than Rails itself, it has no need for
    dependency tracking. Also unlike Active Merchant, Asset Packager - actually extends
    Rails functionality, which is why we are covering it now.


    To install Asset Packager, use the rails install command:


    ```

    $ rails plugin install git://github.com/sbecker/asset_packager.git

    ```


    This causes file to be placed into your vendor/plugins directory. These files
    can be checked into git and deployed using Capistrano.


    What the Asset Packager plugin does is to add new rake tasks that you can use.
    You already know how to list rake tasks, and that is by using the -T option:


    ```

    $ rake -T asset

    (in /home/rubies/work/depot)

    rake asset:packager:build_all # Merge and compress assets

    ```


    +   2. http://synthesis.sbecker.net/pages/asset_packager'
