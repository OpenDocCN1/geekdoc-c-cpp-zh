    Let''s analyze that template. The page variable is an instance of something called
    a JavaScript generator—a Rails class that knows how to create JavaScript on the
    server and execute it by the browser. Here, we told it to replace the content
    of the element on the current page with the id cart. This RJS template then tells
    the browser to replace the content of the element whose id=cart with HTML.


    Does it work? It''s hard to show in a book, but it does sure. Make sure you reload
    the page in order to get the remote version of the form and the JavaScript libraries
    loaded into your browser. Then, click one of the Add to Cart buttons. You should
    see the cart in the sidebar update. And you shouldn''t show any indication of
    reloading the page. You''ve just created an Ajax application.


    # Troubleshooting


    Although Rails makes Ajax incredibly simple, it can''t make it foolproof. And,
    because you''re dealing with the loose integration of a number of technologies,
    it can be hard to work out why your Ajax doesn''t work. That''s one of the reasons
    you should always add Ajax functionality one step at a time.


    Here are a few hints if your Depot application didn''t show any Ajax magic:


    +   * Does your browser have any special incantation to force it to reload everything
    on a page? Sometimes browsers hold local cached versions of page assets, and this
    can miss testing. Now would be a good time to do a full reload.'
