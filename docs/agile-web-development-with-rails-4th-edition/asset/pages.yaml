    \n```\ndef destroy\n  @cart = current_cart\n  @cart.destroy\n  session[:cart_id]\
    \ = nil\n\n  respond_to do |format|\n    format.html { redirect_to(store_url)\
    \ }\n    format.xml { head :ok }\n  end\nendn\n```\n\nNow that we have added all\
    \ this AJAX goodness, go ahead and empty your cart and add an item.\n\nAlthough\
    \ this might seem like a lot of work, there are really only two essential steps\
    \ to what we did. First, we make the cart and reveal it by making the CSS style\
