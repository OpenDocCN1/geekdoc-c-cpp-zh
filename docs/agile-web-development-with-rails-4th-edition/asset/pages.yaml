    template contained in the file store.html.erb or store.xml.erb in the directory
    app/views/layouts.


    All these conventions are shown in Figure 18.3.


    There''s one extra twist. In normal Ruby code you have to use the require keyword
    to include Ruby source files before you reference the classes and modules in those
    files. Because Rails knows the relationship between filenames and class names,
    require is normally not necessary in a Rails application. Instead, the first time
    you reference a class or module that isn''t known, Rails uses the naming conventions
    to convert the class name to a filename and try to load that file behind the scenes.
    The net effect is that you can typically reference (say) the name of a model class,
    and that model will be automatically loaded into your application.'
