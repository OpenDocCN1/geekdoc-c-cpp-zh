  md: '# Iteration K1: Deploying with Phusion Passenger and MySQL


    In a third iteration, we will cover various administrative and cleanup tasks.

    Let''s get started!


    So far, we''ve been developing a Rails application on our local machine, we''ve
    probably been using WEBrick or Mongel when we run our server. For the most part,
    it doesn''t matter. The rails server command will sort out the most appropriate
    way to get your application running in development mode on port 3000. However,
    a deployed Rails application works a bit differently. We can''t just fire up a
    single Rails server process and let it all the way. Well, we could, but it''s
    far from ideal. The reason for this is that Rails is single-threaded. It can work
    on only one request at a time.


    The web, however, is an extremely concurrent environment. Production web servers,
    such as Apache, Lighttpd, and Zeus, can work on several requests—tens or hundreds
    of requests—at the same time. A single-process, single-threaded Ruby-based web
    server cannot possibly keep up. Luckily, it doesn''t have to. The way we deploy
    a Rails application into production is to use a front-end server, such as Apache,
    to handle requests from the client. Then, you use the HTTP proxying of Passenger
    to send requests that should be handled by Rails to one of any number of back-end
    application processes.


    # Installing Passenger


    The first step is to ensure that the Apache server is installed. For Mac OS X
    users, and many Linux users, it is already installed with the operating system.
    Windows users can find instructions on installing this product on the Apache website.\¹


    The next step is to install Passenger:


    ```

    $ sudo install passenger

    $ sudo passenger-install-apache2-module

    ```


    If the necessary dependencies are not met, the latter command will tell you what
    you need to do. For example, on a Ubuntu 10.04 (Lucid Lynx) Linux, you will find
    that you need to install build-essential, apache2-prefork-dev, libapr1-dev, and
    libaprutil1-dev. If this happens, follow the instructions provided, and the passenger
    install command again.


    Once the dependencies are satisfied, this causes a manner of sources to be compiled
    and the configuration files to be updated. During the process, it will ask you
    to update your Apache configuration. The first will be to enable your freshly
    built module and involve adding lines such as the following


    +   1. http://apache.org/docs/2.2/platform/windows.html#install'
  merge: -1
