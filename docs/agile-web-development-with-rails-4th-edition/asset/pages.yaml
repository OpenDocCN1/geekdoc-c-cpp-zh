    +   - Rescuable: eases exception handling.


    +   - SecureRandom: generates random numbers suitable for generating session keys
    in HTTP cookies.


    +   - StringInquirer: provides a prettier way to test for equality.


    +   - TestCase: testing framework independent interface to test cases.


