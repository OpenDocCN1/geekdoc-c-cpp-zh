  md: 'As always, thanks for all the wonderful feedback via the errata, forums, and
    other venues. At this time I would like to specifically thank Kim Shrier, Don
    Smith, mltsy, and Jason Catena.


    # Beta 6—July 27


    The big news is that the release candidate for Rails has officially shipped. The
    better news is that no API changes were made to Rails that affect the book. Hopefully
    at this point releases of Rails will be made more quickly, and the API will remain
    stable.


    New with this beta is a chapter on Action Dispatch and Action Controller, which
    covers both dispatching of requests to controllers, as well as controllers themselves.
    At this point, two of the three parts on the Model/View/Controller architecture
    are complete. Next up will be a chapter on Views.


    Once again, thanks for all of the wonderful feedback via the errata, forums, and
    other venues — keep it coming!


    # Beta 5—June 28


    As I write this, the release candidate which was originally due on June 8th has
    still not shipped, and we have decided to release a beta anyway. At the current
    time, the contents of the book work with beta 4 and with the latest version of
    Rails from github, but things could change between now and when the release candidate
    ships.


    The changes to Rails that affected this book in beta 4 were the requirement to
    specify the keyword ''new'' when creating a new application with the ''rails''
    command, and the fact that Rails 3.0 no longer works on Ruby 1.9.1. Ruby 1.9.2
    preview, however, has come out and Rails 3.0 works just fine on it. This beta
    has been updated to reflect these changes.


    This beta also adds a chapter dedicated to Active Record, a topic which covered
    three chapters in edition 3. The content has been updated to Rails 3 APIs, and
    in particular Arel functionality. The content has been streamlined to focus only
    on APIs that everybody needs to know, as well as content that was adequately covered
    in Part II. It also reads less like a reference manual, and more like a guide.
    Feedback welcome. In particular, please let me know if something you feel essential
    was not covered.


    Again, thanks for all of the excellent errata. At this point, we are up to 300
    errata comments from over 80 individuals. I''d like to specifically thank Seth
    Arnold, David Hadley, Will Bowlin, Victor Marius Costan, Kristian Rietbergen,
    John Straitiff, and Andy Brice.'
  merge: -1
