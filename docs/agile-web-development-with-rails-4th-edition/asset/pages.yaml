- img_proc: true
  md: 'a framework that delivers working software early in the development cycle.
    This software may be rough around the edges, but it lets the users start to get
    a glimpse of what you''ll be delivering.


    In this way, Rails encourages customer collaboration. When customers see how quickly
    a Rails project can respond to change, they start to trust the team can deliver
    what''s required, not just what has been requested. Confrontations are replaced
    by "What if" sessions.


    That''s all tied to the idea of being able to respond to change. The strong, almost
    obsessive, way that Rails honors the DRY principle means that changes to Rails
    applications a lot less code than the same changes would have in other frameworks.
    And since Rails applications are written in Ruby, where concepts can be expressed
    accurately and concisely, changes tend to be localized and easy to write. The
    deep emphasis on both unit and functional testing, along with support for test
    fixtures and stubs during testing, gives developers the safety net they need when
    making those changes. With a good set of tests in place, changes are less nerve-wracking.


    Rather than trying to tie Rails processes to the agile processes, we''ve decided
    to let the framework speak for itself. As you read through the tutorial chapters,
    try to imagine yourself developing web applications this: working alongside your
    customers and jointly determining priorities and solutions to problems. Then,
    as you read the more advanced concepts that follow in Part III, see how the underlying
    structure of Rails can enable you to meet your customers'' needs faster and with
    less ceremony.


    One last point about agility and Rails: although it''s probably unprofessional
    to mention this, think how much fun the coding will be.


    # Who This Book Is For


    Programmers looking to build and deploy web-based applications. This includes
    application programmers who are new to Rails (and perhaps even new to Ruby) and
    ones who are familiar with the basics but want a more in-depth-understanding of
    Rails.


    We presume some familiarity with HTML, Cascading Style Sheets (CSS), and JavaScript
    – in other words, the ability to view-source on web pages. You do not need to
    be an expert on these subjects, the most you will ever be expected to do is to
    copy and paste material from the book, all which can be downloaded.


    # How To Read This Book


    The first part of this book makes sure that you are ready: by the time you are
    done with it, you will have been introduced to Ruby (the language), have been'
