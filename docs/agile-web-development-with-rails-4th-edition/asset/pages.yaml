  md: '# Sending E-mail


    Now that we''ve got everything configured, let''s write some code to send e-mails.


    By now you shouldn''t be surprised that Rails has a generator script to create
    mailers. What might be surprising is it creates them. In Rails, a mailer is a
    class that is stored in the app/mailers directory. It contains one or more methods,
    with each method corresponding to an e-mail template. To create the body of the
    e-mail, these methods use turn views (in the same way that controller actions
    use views to create HTML and XML). So, let''s create a mailer for our store application.
    We will use it to send two types of e-mail: when one order is placed and a second
    when the order ships. The rails generate command takes the name of the mailer
    class, along with the names of the e-mail actions:


    ```

    depot> rails generate mail notifier order_received_shipped

    create app/mailers/notifier.rb

    invoke erb

    create app/views/notifier

    create app/views/notifier/order_received.text.erb

    create app/views/notifier/order_shipped.text.erb

    invoke test_unit

    create test/functional/notifier.test.rb

    ```


    Notice that we''ve created a Notifier class in app/mailer and two template files,
    for each e-mail type, in app/views/notifier (We also created a test file—we''ll
    look into this later in Section 13.1, Function Testing E-mail, on page 192.)


    Each method in the mailer is responsible for setting up the environment for sending
    a particular e-mail. Let''s look at an example before going into the details.
    Here''s the code that was generated for our Notifier class, with one default changed:


    ```

    Download depot_p/app/mailers/notifier.rb

    class Notifier < ActionMailer::Base

