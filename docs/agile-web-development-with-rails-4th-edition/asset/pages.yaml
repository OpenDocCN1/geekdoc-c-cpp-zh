  md: '# Introduction


    Ruby on Rails is a framework that makes it easier to develop, deploy, and maintain
    web applications. During the months that followed its initial release, Rails went
    from being an unknown toy to be a worldwide phenomenon and, more important, it
    has become the framework of choice for the implementation of a wide range of so-called
    Web 2.0 applications.


    Why is that?


    # Rails Simply Feels Right


    First, a large number of developers were frustrated with the technologies they
    were using to create web applications. It didn''t seem to matter whether they
    were using Java, PHP, or .NET—there was a growing sense that their job was just
    too damn hard. And then, suddenly, came Rails, and Rails was easier.


    But on its own doesn''t cut it. We''re talking about professional developers writing
    real-world websites. They wanted to feel that the applications they were developing
    would stand the test of time—that they were designed and implemented using modern,
    professional techniques. So, these developers dug into Rails and discovered it
    wasnt a just a tool for hacking sites.


    For example, all Rails applications are implemented using the Model-View-Controller
    (MVC) architecture. Java developers are used to frameworks such as Tapestry and
    Struts, which are based on MVC. But Rails takes MVC further: when you develop
    in Rails, you start with a working application, there''s a place for each piece
    of code, and all the pieces of your application in a standard way.


    Professional programmers write tests. And again, Rails delivers. All Rails applications
    have testing support baked right in. As you add functionality to the code, Rails
    automatically creates test stubs for that functionality. The framework makes it
    easy to test applications, and as a result, Rails applications tend to get tested.'
  merge: -1
  pgno: 18
- img_proc: true
  md: "Rails applications are written in Ruby, a modern, object-oriented scripting\
    \ language. Ruby is concise without unintelligibly terse—yet you can express ideas\
    \ naturally and cleanly in Ruby code. This leads to programs that are easy to\
    \ write and (just as important) as easy to read months later.\n\nRails takes Ruby\
    \ to the limit, extending it in novel ways that make a programmer's life easier.\
    \ This makes our programs shorter and more readable. It also allows us to perform\
    \ tasks that normally would be done in external configuration files inside the\
    \ codebase. This makes it far easier to see what's happening. The following code\
    \ defines the model for a project. Don't worry about the details for now. Instead,\
    \ just think about how much information is being expressed in a few lines of code.\n\
    \n```\nclass Project < ActiveRecord::Base\n  belongs_to :portfolio\n  has_one\
    \ :project_manager\n  has_many :milestones\n  has_many :deliverables, :through\
    \ => :milestones\n```\n\n```\nvalidates :name, :description, :presence => true\n\
    validates :non_disclosure_agreement, :acceptance => true\nvalidates :short_name,\
    \ :uniqueness => true\n```\n\nTwo philosophical underpinnings keep Rails code\
    \ short and readable: DRY and convention over configuration. DRY stands for *don't\
    \ repeat yourself*; every piece of knowledge in a system should be expressed in\
    \ just one place. Rails uses the power of Ruby to bring that to life. In a Rails\
    \ application: you say what you need to say in one place—a place often suggested\
    \ by the conventions of the MVC architecture—and then move on. For programmers\
    \ used to other web frameworks, where a simple change to the schema could involve\
    \ in half a dozen or more changes, this was a revelation.\n\n*Convention over\
    \ configuration* is crucial, too. It means Rails has sensible defaults for just\
    \ every aspect of knitting together your application. Follow the conventions,\
    \ and you can write a Rails application using less code than a typical Java web\
    \ application uses in XML. If you need to override them, Rails makes that easy,\
    \ too.\n\nDevelopers coming to Rails found something else, too. Rails isn't playing\
    \ catch with the new de facto standards; it's helping define them. And Rails makes\
    \ it easy for developers to integrate features such as Ajax and RESTful interfaces\
    \ into their code, because support is built in. (If you're not familiar with Ajax\
    \ and REST interfaces, never fear—we'll explain them later in the book.)"
