  md: "# Making Development Easier\n\nYou might have noticed something about the development\
    \ we've been doing so far. As we've been adding code to our application, we haven't\
    \ had to restart the running application. It has been happily chugging away in\
    \ the background. And yet each change we make is available whenever we access\
    \ the application through a browser. What gives?\n\nIt turns out that the Rails\
    \ dispatcher is pretty clever. In development mode (as opposed to testing), it\
    \ automatically reloads source files when a new request comes in. That way, when\
    \ we edit our application, the dispatcher makes sure it's running the most recent\
    \ changes. This is great for development.\n\nHowever, this flexibility comes at\
    \ a cost—if it causes a short pause after you enter a URL before the application\
    \ responds. That's caused by the dispatcher setup. For development, it's a price\
    \ worth paying, but in production it would be unacceptable. Because of this, this\
    \ feature is disabled for production deployment (see Chapter 16, Task K: Deployment\
    \ and Production, on page 241).\n\nof displaying. We'll change our action method\
    \ in the controller to set the time value into an instance variable called @time:\n\
    \n```\nDownload work/demo3/app/controllers/say_controller.rb\nclass SayController\
    \ < ApplicationController\n  def hello\n    @hello = Time.now\n  end\n\n  def\
    \ goodbye\n  end\n```\n\nIn the .html.erb template we'll use this instance variable\
    \ to substitute the time into the output:\n\n```\nDownload work/demo3/app/views/say/hello.html.erb\n\
    <h1>Hello from Rails!</h1>\n<p>\n  It is now <%= @time %>\n</p>\n```\n\nWhen we\
    \ refresh our browser window, we will again see the current time, showing the\
