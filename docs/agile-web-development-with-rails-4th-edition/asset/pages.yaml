  md: '# Grouping Controllers into Modules


    So far, all our controllers have lived in the app/controllers directory. It is
    some-time convenient to add more structure to this arrangement. For example, our
    store might end up with a number of performing related but disjoint administration
    functions. Rather than pollute the top-level namespace, we might choose to group
    them into a single admin namespace.


    Rails does this using a simple naming convention. If an incoming request has a
    controller named (say) admin/book, Rails will look for the controller called book_controller
    in the directory app/controllers/admin. That is, the final part of the controller
    name will always resolve to a file called name_controller.rb, and any leading
    path information will be used to navigate through subdirectories, starting in
    the app/controllers directory.


    Imagine that our program has two groups of controllers (say, admin/xxx and content/xxx)
    that both groups define a controller. There''d be a file called book_controller.rb
    in both the admin and content subdirectories of app/controllers. Both of these
    controllers would define a class named BookController. If Rails took no further
    steps, these two classes would clash.


    To deal with this, Rails assumes that controllers in subdirectories of the directory-app/controllers
    are in Ruby modules named after the subdirectory. Thus, the book controller in
    the admin subdirectory would be declared like this:


    ```

    class Admin::BookController < ActionController::Base

    #...

    end

    ```


    The book controller in the content subdirectory would be in the Content-module:


    ```

    class Content::BookController < ActionController::Base

    #...

    end

    ```


    The two controllers are therefore kept separate inside your application.


    The templates for these controllers appear in subdirectories of app/views. Thus,
    the view template corresponding to this request:


    ```

    http://my.app/admin/book/edit/1234

    ```


    will be in this file:


    ```

    app/views/admin/book/edit.erb

    ```


    You''ll be pleased to know that the controller generator understands the concept
    of controllers in modules and lets you create them with commands as this:


    ```

    myapp> rails generate controller Admin::Book action1 action2 ...

    ```'
