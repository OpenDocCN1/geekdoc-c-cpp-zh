  md: "want to keep using InnoDB if you're using MySQL, because this engine gives\
    \ you transaction support. You might need transaction support in your application,\
    \ and you'll definitely need it in your tests if you're using the default of transactional\
    \ test fixtures.\n\n# Renaming tables\n\nIf refactoring leads us to renaming variables\
