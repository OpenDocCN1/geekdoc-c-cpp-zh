  md: "# Creating the Database\n\nFor this application, we'll use the open source\
    \ SQLite database (which'll need too if you're following along with the code).\
    \ We're using SQLite version 3 here.\n\nSQLite 3 is the default database for Rails\
    \ development, and was installed along with Rails itself in Chapter 1, Installing\
    \ Rails, on page 27. With SQLite 3 there are no steps required to create a database,\
    \ and there are no special user accounts or passwords to deal with. So, now you\
    \ get to experience one of the benefits of going with the flow (Or, convention\
    \ over configuration, as Rails folks say nauseam).\n\nIf, however, it is important\
    \ to use a database server other than SQLite 3, the commands you'll need to create\
    \ the database and grant permissions will be different. You will find some helpful\
    \ hints in the Getting Started Rails Guide¹\n\n# Generating the Scaffold\n\nBack\
    \ in Figure 5.3, on page 78, we sketched out the basic content of the products\
    \ table. Now let's turn that into reality. We need to create a database table\
    \ and a Rails model that lets our application use that table, a number of views\
    \ to make up the user interface, and a controller to orchestrate the application.\n\
    \nSo, let's go ahead and create the model, view, controller and migration for\
    \ our products table. With Rails, you can do all with one command by asking Rails\
    \ to generate what is a scaffold for a given model. Note that the command line²\
    \ that follows, we use the singular form, Product. In Rails, a model is automatically\
    \ mapped to a database table which is the plural form of the model's class. In\
    \ our case, we asked for a model called Product, so Rails associated with the\
    \ table products (And how will it find that? The development entry in config/database.yml\
    \ tells Rails where to look for it). For SQLite 3 users, this will be a file in\
    \ the directory.\n\n```\ndepot rails generate scaffold products \\\n  title:string\
    \ description:text image_url:string precision:decimal\n  invoke active_record\n\
    \  create db/migrate/20121021000001_create_products.rb\n  create app/models/product.rb\n\
    \  invoke test_unit\n  create test/unit/product_test.rb\n  create test/fixtures/products.yml\n\
    route resources :products\n```\n\n+   1. http://guides.rubyanrails.org/getting_started.html\n\
    2. This command is too wide to fit comfortably on the page. To enter a command\
    \ on multiple lines, simply put a backslash as the last character on all but the\
    \ last line, and you will be prompted for more input. Windows users will need\
    \ to substitute a caret (^) for the backslash."
