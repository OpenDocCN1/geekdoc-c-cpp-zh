  md: '# Beta Book

    Agile publishing for agile developers


    **Under Construction** The book you''re reading is still under development. As
    part of our Beta book program, we''re releasing this copy well before a normal
    book will be released. That way you will be able to get this a couple of months
    before it''s available in finished form, and we''ll get feedback to make the book
    even better. The idea is that everyone wins!


    Be warned. The book has not had a full technical edit, so it will contain errors.
    It has not been copiedited, so it will be full of typos and other weird-ness.
    And there''s no effort spent doing layout, so you''ll find bad page breaks, over-long
    lines with little black rectangles, incorrect hyphenations, and all the other
    ugly things that you wouldn''t expect to see in a finished book. We can''t be
    held liable if you use this book to try to create a spiffy application and you
    somehow end up with a strangely shaped farm implementation. Despite this all,
    we think you''ll enjoy it!


    **Download Updates** Throughout this process you''ll be able to download updated
    ebooks from your account at http://prprog.com. When the book is finally ready,
    you''ll get the final version (and subsequent updates) from the same address.


    **Send us your feedback** In the meantime, we''d appreciate sending you your feedback
    on this book at http://prprog.com/titles/rails4/errata, or by using the links
    at the bottom of each page.


    Thank you for being part of the Pragmatic community!


    +   - Andy & Dave'
