- img_proc: true
  md: 'There are times you want to ensure you always have a model object to work with.
    If there isn''t one in the database, you want to create one. Dynamic finders can
    handle this. Calling a method whose name starts find_or_initialize_by_ or find_or_create_by
    will either return or create the model if the finder would otherwise return nil.
    The new object will be initialized so that its attributes corresponding to the
    finder criteria have the values passed to the finder method, and it will have
    been saved to the database if the create variant is used.


    ```

    cart = Cart.find_or_initialize_by_user_id(user.id)

    cart.items << new_item

    cart.save

    ```


    And, no, there is not a find_by_form that lets you use _or_ rather than _and_
    between column records


    # SQL and Active Record


    To illustrate how Active Record works with SQL, let''s pass a simple string to
    the where method call corresponding to a SQL clause. For example, to return a
    list of all orders Dave with a payment type of ''po'', we could use this:


    ```

    pos = Order.where("name = ''Dave'' and pay_type = ''po'')

    ```


    The result will be an ActiveRecord::Relation object containing all the matching
    rows, each neatly wrapped in an Order object.


    That''s fine if our condition is predefined, what if the name of the customer
    is set externally (perhaps coming from a web form)? One way is to substitute the
    value of that variable into the condition string:


    ```

    # get the name from the form

    name = params[:name]

    # DON''T DO THIS!!!

    pos = Order.where("name = ''#{name}'' and pay_type = ''po'')

    ```


    As the comment suggests, this really isn''t a good idea. Why? It leaves the database
    wide open to something called SQL injection attack, which we describe in more
    detail in the Rails guides that you generated on page 266. For now, take it as
    if substituting a string from an external source into a SQL statement is effectively
    the same as publishing your entire database to the whole online world.


    Instead, the safe way to generate dynamic SQL is to let Active Record handle it.
    Doing this allows Active Record to create properly escaped SQL, which is immune
    from SQL injection attacks. Let''s see how this works.'
