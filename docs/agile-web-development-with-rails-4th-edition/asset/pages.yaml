- img_proc: true
  md: "The final reason for views is that code embedded in views is hard to test,\
    \ whereas code split out into helper modules can be isolated and tested as individual\
    \ units.\n\nRails provides a nice compromise in the form of helpers. A helper\
    \ is simply a module containing methods that assist a view. Helper methods are\
    \ output-centric. They exist to generate HTML (or XML, or JavaScript)—a helper\
    \ extends the behavior of a template.\n\n# Your own helpers\n\nBy default, each\
    \ controller gets its own helper module. Additionally, there is an application\
    \ view named `application_helper.rb`. It won't be surprising to learn that Rails\
    \ makes certain assumptions to link the helpers into the controller and its views.\
    \ While all helper are available to all controllers, it is often a good practice\
    \ to organize helpers views associated with the ProductController to be placed\
    \ in a helper module called `ProductHelper` in the file `product_helper.rb` in\
    \ the `app/helpers` directory. You don't have to remember all these details—Rails\
    \ generate controller script create a stub helper module automatically.\n\nIn\
    \ Section 11.4, Iteration F4: Hiding an Empty Cart, on page 154 we created such\
    \ a helper method named `hidden_div_` which enabled us to hide the cart under\
    \ specified conditions.\n\n```\n<h3><%= @page_title || \"Pragmatic Store\" %></h3>\n\
    <!-- ... -->\n```\n\nWe'd like to remove the duplication between templates. If\
    \ the default name of the store changes, we don't want to edit each view. So,\
    \ let's move the code that works out the page title into a helper method. Because\
    \ we's in the store controller, we edit the file `store_helper.rb` in `app/helpers`\
    \ (as shown on the next page).\n\n```\nmodule StoreHelper\n  def page_title\n\
    \    @page_title || \"Pragmatic Store\"\n  end\nend\n```\n\nNow the view code\
    \ simply calls the helper method:\n\n```\n<h3><%= @page_title %></h3>\n<!-- ...\
    \ -->\n```\n\n(We might want to eliminate even duplication by moving the rendering\
    \ of the entire title into a separate partial template, shared by all the controllers\
    \ views, but we don't talk about them until Section 21.6, Partial-Page Templates,\
    \ on page 366.)"
  merge: -1
