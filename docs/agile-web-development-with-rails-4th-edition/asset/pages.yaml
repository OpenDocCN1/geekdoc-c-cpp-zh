  md: 'The final step is to restart our Apache server:


    ```

    $ sudo apachectl restart

    ```


    You will now need to configure your client so that it maps the host name you chose
    to the correct machine. This is done in a file named /etc/hosts. On Windows machines,
    this file can be found in C:\system32\drivers\etc\. In order to edit this file,
    you will need to open the file as an administrator.


    A typical /etc/hosts line will look like the following:


    ```

    127.0.0.1 depot.yourhost.com

    ```


    That''s it! We can now access our application using the host (or virtual host)
    we specified. Unless we use a port number other than 80, there is no longer any
    need for us to specify a port number on our URL.


    There are a few things to be aware of:


    +   - If restarting your server you see a message that The address or port is
    invalid, this means that the NameVirtualHost line is already present, happens
    in another configuration file in the same directory. If so, remove the line you
    added as this directive only needs to be present once.


    +   - If we want to run in an environment other than production, we can include
    a RailsEnv directive in each VirtualHost in your Apache configuration:

    RailsEnv development


    +   - We can restart our application without restarting Apache at any time by
    creating a file named restart.txt in the tmp of our application:

    $ touch restart.txt


    +   - The output of the passengerager-install-apache2-module command will tell
    us where we can find additional documentation.


    # Using MySQL for the Database


    The SQLite site is refreshingly honest when it comes to describing what this database
    is good at and what it is not good at. In particular, SQLite is not recommended
    for high-volume, high concurrency web sites with large datasets. And, of course,
    we can write our web site to be a web site.


    There are plenty of alternatives to SQLite, both free and commercial. We will
    go with MySQL. It is already included in OSX. It is available via your native
    packaging tool in Linux, and an installer is provided for Microsoft Windows on
    the MySQL Website.


    +   1. http://www.sqlite.org/whentouse.html

    2. http://www.mysql.com/downloads/mysql/#downloads'
