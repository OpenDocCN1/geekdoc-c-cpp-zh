    and create the source for our application from scratch? We, could just hack. After
    all, a Rails application is just Ruby code. But Rails also does a lot of magic
    behind the curtain to get our applications to work with a minimum of explicit
    configuration. To get this magic to work, Rails needs to find all the various
    components of your application. As we''ll see later (in Section 18.1 Where things
