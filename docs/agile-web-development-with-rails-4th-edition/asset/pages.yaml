- img_proc: true
  md: 'others, like rails_wss⁷ backport essential functionality from future versions
    of Rails in order to help with migration.


    +   * Some plugins actually implement significant application logic and even user
    interface. The devise⁸ and the authogic⁹ plugins implement user authentication
    and session management. We implemented these functions ourselves in Depot, but
    this is generally something we don''t recommend. We found that laziness pays:
    if somebody else has written a plugin for a function that you need to implement,
    then all the more time you can spend on your application.


    +   * Some plugins replace large portions of Rails. The combination of cucumber,¹¹rspec,¹²
    and webrat¹³ can be used separately or to replace test scripts with plain text
    stories, specifications, and browser simulation.


    +   * hoptad_notifier¹⁴ and exception_notification¹⁵ will help you monitor errors
    in your deployed servers.


    Of course, this is a small fraction of the set of plugins that are available.
    And this list is continually growing; there undoubtedly be many more available
    by the time you read this.


    Finally, you can obviously create your own. While doing so is beyond the scope
    of this book, you can find out more in the Rails Guides¹⁶ and documentation.¹⁷


    # What We Just Did


    Strictly speaking, this chapter only exposed you to new Rails commands: rails
    plugin install, and in many cases the need for that command is being consumed
    by bundler and Gemfile. While this chapter covered a few plugins, the purpose
    of this chapter was not to cover any particular plugin in depth, but to introduce
    you to some of the capabilities that plugins can provide.


