    The first line specifies where to find gems and new versions of existing gems.
    Feel free to repeat this line in order to list your own gem repositories.


    The next line lists what version of Rails to load. Note that it specifies a specific
    version. After this is a comment that you could use as an alternative in order
    to run the latest version of Rails.


    The remaining lines list a few gems you are using, and a few gems you might consider
    using. Some are placed in groups named :development, :test, or :production and
    will only be available in those environments. Others include an optional :require
    parameter which specifies the name to use on a require statement for cases where
    it differs from the gem name.


    On the line where :pg you specify a version specifier by a comparison operator.
    While Gemfiles support a number of such operators, only two are commonly used.
    >= is for the unfortunately all too rare condition where the author of the gemfile
    can be trusted to maintain strict backwards compatibility so that all that needs
    to be specified is a minimum version number.


    -> is more widely recommended. Essentially all of the parts, with the exception
    of the last part, must be matched exactly, and the last part specifies a minimum.
    So ->3.1.4 matches any version that starts with a 3.1 and is not less than 3.1.4.
    Similarly ->3.0 means any version string that starts with a 3..


    A Gemfile has a companion file, named Gemfile.lock. This second file is generally
    updated by one of two commands: bundle install and bundle update. The difference
    between the two is subtle.


    Before proceeding, it is helpful to look at a Gemfile.lock file. Below is a small
    excerpt:


