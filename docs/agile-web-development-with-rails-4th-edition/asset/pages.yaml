- img_proc: true
  md: 'First, the formalities of RESTful approach make that network designers know
    when and where they cache responses to requests. This enables load to be pushed
    out through the network, increasing performance and resilience while reducing
    latency.


    Second, the constraints imposed by REST can lead to easier-to-write (and maintain)
    applications. RESTful applications don''t worry about implementing remotely accessible
    services. Instead, they provide a regular (and simple) interface to a set of resources.
    Your application implements a way of listing, creating, editing, and deleting
    each resource, and your clients do the rest.


    Let''s make this concrete. In REST, we use a simple set of verbs to operate on
    a rich set of nouns. If we''re using HTTP, the verbs correspond to HTTP methods
    (GET, PUT, POST, and DELETE, typically). The nouns are the resources in our application.
    We name those resources using URLs.


    The Depot application that we produced a set of products. There implicitly two
    resources here. First, there are the individual products. Each constitutes a resource.
    There''s also a second resource: the collection of products.


    To fetch a list of all the products, we could issue an HTTP GET request against
    this collection, on the path /products. To fetch the contents of an individual
    resource, we have to identify it. The Rails way would be to give its primary key
    value (that is, its id). Again we issue a GET request, this time against the URL
    /products/1.


    To create a new product in our collection we use an HTTP POST directed at the
    /products path, with the post data containing the product to add. Yes, that''s
    the same path we used to get a list of products. If you issue a GET to it, it
    responds with list, and if you do a POST to it, it adds a new product to the collection.


    Take this step further. We''ve already seen that you can retrieve the content
    of a product—you just issue a GET request against the /products/1. To update that
    product, you''d issue an HTTP PUT request against the same URL. To delete it,
    you could issue an HTTP DELETE request, again using the same URL.


    Take this further. Maybe our system also tracks users. Again, REST tells us to
    use the same set of verbs (GET, POST, PUT, and DELETE) against a similar-looking
    set of URLs (/users, /user/1..).


    Now we see how of the power of the constraints imposed by REST. We''re already
    familiar with the way Rails constrains us to structure our applications a certain
    way. The REST philosophy tells us to structure the interface to our applications
    too. Suddenly our world gets a lot simpler.'
