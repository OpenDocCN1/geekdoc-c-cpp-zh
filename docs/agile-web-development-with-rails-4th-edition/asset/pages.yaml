  md: "# Joe Asks...\nWhy Atom?\n\nThere are a number of different feed formats, most\
    \ notably RSS 1.0, RSS 2.0, and Atom, standardized in 2000, 2002, and 2005 respectively.\
    \ These three are all widely supported. To aid with the transition, a number of\
    \ sites provide multiple feeds for the same site, but this is no longer necessary,\
    \ increases user confusion, and generally is not recommended.\n\nThe Ruby provides\
    \ a low level library which can produce any of these formats, as well as a number\
    \ of less common versions of RSS. For best results, stick with one of the three\
    \ main versions.\n\nThe Rails framework is all about picking reasonable defaults,\
    \ and has chosen Atom as the default for feed formats. It is specified as an Internet\
    \ standards protocol for the internet community by the IETF, and Rails provides\
    \ a higher level helper named atom_feed that takes care of a number of details\
    \ based on knowledge of Rails naming conventions for things like ids and.\n\n\
    provides as well as the knowledge of the Atom feed format that the atom_feed helper\
