    # Pulling It All Together


    Although ActiveResource at first seems like a bit of magic, it simply relies heavily
    on the concepts described earlier in this book. Here are a few pointers:


    +   - Authentication the underlying authentication mechanism that your website
    already supports and doesn''t go against the grain of the Web, like some other
    protocols tend to. In any case, nobody can do anything with ActiveResource that
    they couldn''t already do.


    Be aware that if you are using basic authentication, you might want to use Transport
    Layer Security (TLS), also known as Secure Sockets Layer (SSL) or HTTPS, to ensure
    that passwords can''t be sniffed.


    +   - Active Resource doesn''t make effective use of sessions or cookies, this
    doesn''t mean that your server isn''t continuing to produce them Either you want
    to turn off sessions for the interfaces used by Active Resource or you want to
    make sure that you use cookie-based sessions. Otherwise, the server will end up
    managing a lot of sessions that are never needed. See Section 20.3, Rails Sessions,
    on page 335 for more details.


    +   - In Section 20.1, Adding Additional Actions, on page 320, we described collections
    and members. ActiveResource defines four class methods for dealing with collections
    and four instance methods for dealing with members. The names of these methods
    are get, post, put, and delete. The method names determine the underlying HTTP
    method used.


    The first parameter in each of these methods is the name of the collection or
    member. This information is simply used to construct the URL. You may specify
    additional params, which either will match values in the self.site or will be
    added as query parameters.


    You will likely end up using this a lot more than you would expect. Instead of
    fetching all orders, you might want to provide an interface that fetches only
    the orders that are recent or are overdue. What you can do in any of these methods
    is limited only by your imagination.


    +   - ActiveResource maps HTTP status codes into exceptions:


    301, 302 ActiveResource::Redirection

    400 ActiveResource::BadRequest

    401 ActiveResource::UnauthorizedAccess'
