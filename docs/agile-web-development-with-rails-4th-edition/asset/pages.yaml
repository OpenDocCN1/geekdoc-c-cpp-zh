  md: "# ITERATION 14: ADDING A SIDEBAR, MORE ADMINISTRATION\n\nFortunately, we can\
    \ quickly add a user to the database from the command line. If you invoke the\
    \ rails console, Rails invokes Ruby's it utility, but it does so in the context\
    \ of the Rails application. That means you can interact with your application's\
    \ code by typing Rails statements and liking the values they return. We can use\
    \ this to invoke our model directly, having it added to the database for us:\n\
    \n```\nrails rails console\nLoading development environment.\n>> User.create(name\
    \ => 'dave', :password => 'secret', :password_confirmation => 'secret')\n=> #<User:0x2933060\
    \ @attributes={}>\n>> User.count\n=> 1\n```\n\nThe sequences are prompts. After\
    \ the first, we call the User class to indeed create a new user, and after the\
    \ second, we call it again to show that we have a single user in our database.\
    \ After each command we enter, rails console displays the value returned by the\
    \ code (in the first case, it's the model object, and in the second case, it's\
    \ the count).\n\nPanic over. We can now log back to the application. But how can\
    \ we stop this from happening again? There are several ways. For example, we could\
    \ write code that prevents you from deleting your own user. That doesn't work—in\
    \ theory, A code delete B at the same time that deletes A. Instead, let's try\
    \ a different approach. We'll delete the user inside a database transaction. If\
    \ after we've deleted the user there are no users left in the database, we will\
    \ roll the transaction back, restoring the user we just deleted.\n\nTo do this,\
    \ we will use an Active Record hook. We've already seen one of these: the validate\
    \ hook is called by Active Record to validate an object's state. It turns out\
    \ that Active Record defines twenty or so hooks, each called at a particular point\
    \ in an object's life cycle. We use the after_destroy hook, which is called after\
    \ the SQL delete is executed. If a method by this name is publicly visible, it\
    \ will conveniently be called in the same transaction as the delete, if it so\
    \ raises an exception, the transaction will be rolled back. The hook method looks\
    \ like this:\n\n```\nDownload depot/s/app/models/user.rb\n```\n\n```\ndef ensure_an_admin_remains\n\
