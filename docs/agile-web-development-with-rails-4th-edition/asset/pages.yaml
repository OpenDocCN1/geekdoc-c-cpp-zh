  md: 'Over time, folks have worked out ways of reconciling the relational and OO
    views of their corporate data. Let''s look at the way that Rails chooses to map
    relational data onto objects.


    # Object-Relational Mapping


    ORM libraries map database tables to classes. If a database has a table called
    orders, our program will have a class Order. Rows in this table correspond to
    objects of the class—a particular order is represented as an object of class Order.
    Within that object, attributes are used to get and set the individual columns.
    Our Order object has methods to get and set the sales, tax, and so on.


    In addition, the Rails classes that wrap our database tables provide a set of
    class-level methods to perform operations. For example, we might need to find
    the order with a particular id. This is implemented as a class method that returns
    the corresponding Order object. In Ruby, this might look like this:


    Sometimes these class-level methods return collections of objects:


    ```

    Order.where(:name => "dave").each do |order|

    puts order.amount

    end

    ```


    Finally, the objects corresponding to individual rows in a table have methods
    that operate on that. The most widely used is save, the operation that saves the
    row to the database:


    ```

    Order.where(:name => "dave").each do |order|

    order.pay_type = "Purchase order"

    order.save

    end

    ```


    So, an ORM layer maps tables to classes, rows to objects, and columns to attributes
    of those objects. Class methods are used to perform table-level operations, and
    instance methods perform operations on the individual rows.


    In a typical ORM library, you supply configuration data to specify the mappings
    between entities in the database and entities in the program. Programmers using
    these ORM tools often find themselves creating and maintaining a boatload of XML
    configuration files.


    # Active Record


    Active Record is the ORM supplied by Rails. It closely follows the standard ORM
    model: maps tables to classes, rows to objects, and columns to attributes. It
    differs from other ORM libraries in the way it is configured.'
