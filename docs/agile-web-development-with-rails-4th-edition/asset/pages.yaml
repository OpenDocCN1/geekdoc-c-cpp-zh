- img_proc: true
  md: '# Acknowledgements


    You''d think that producing a new edition of a book would be easy. After all,
    you already have all the text. It''s just a tweak to some code here and a minor
    wording change, and you''re done. You''d think....


    It''s difficult to tell exactly, but our impression is that each edition of Agile
    Web Development with Rails took about as much effort as the first edition. Rails
    is constantly evolving, and as it does, so this book has. Parts of the Depot application
    were rewritten several times, and all of the narrative was updated. The emphasis
    on REST and the avoidance of features as they became deprecated repeatedly changed
    the structure of the book as what was once hot became just lukewarm.


    So, this book would not exist without a massive amount of help from the Ruby and
    Rails communities. To start with, we had a number of incredibly helpful formal
    reviewers of drafts of this book:


    +   Jeremy Anderson, Ken Coar, Jeff Cohen, Joel Clermont, Geoff Drake, Pavan Gorakai,
    Michael Jurewitz, Mika Lindsaar, Paul Rainer, Martijn Revers, Doug Houghton, Gary
    Sherman, Davanum Srinivas, Stefan Turaliski, and José Valim


    Additionally, each edition of this book has been released as a book: early versions
    were posted as PDFs, and people made comments online. And comment they did: more
    than 800 suggestions and bug reports were posted for this edition alone. The vast
    majority ended up being inmeasurably more useful than it would have been. Making
    this book thanks to out of all for supporting the book program and for contributing
    so much valuable feedback, a number of contributors went well beyond the call
    of duty:


    +   Manuel E Vidaurre Arenas, Steve Arnold, Will Bollen, Andy Brice, Jason Catena,
    Victor Marius Cost, David Hadley, Jason Holloway, David Kapp, True LE, Kristian
    Siber Mandrup, mltsy, Steve Nicholson, Jim Puls, Johnathan Ritzi, Leonel S, Kim
    Shrier, Don Smith, Joe Straitiff, and Martin Zoller'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Finally, The Rails core team has been incredibly helpful, answering questions,
    checking out code fragments, and fixing bugs. A big thank you to the following:


