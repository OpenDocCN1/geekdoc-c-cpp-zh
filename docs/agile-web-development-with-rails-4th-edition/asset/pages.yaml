    # 16.3 Iteration K3: Checking Up on a Deployed Application


    Once we have our application deployed, we''ll no doubt to check up on how it''s
    running from time. We can do this in two primary ways. The first is to monitor
    the various log files output by both our front-end web server and the Apache server
    running our application. The second is to connect to our application using rails
    console.


    # Looking at Log Files


    To get a quick look at what''s happening in our application, we can use the tail
    command to examine log files as requests are made against our application. The
    most interesting data will usually be in the log files of the application itself.
    Even if Apache is running multiple applications, the logged output for each application
    is placed in the production.log file for that application.


    Assuming that our application is deployed in the location we showed earlier, here''s
    how we look at our running log:


    ```

    # On your server

    $ cd /home/rubys/work/depot/

    $ tail -f log/production.log

    ```


    Sometimes we need lower-level information—what''s going on with the data in our
    application? When this is the case, it''s to break out of the most useful live
    server debugging tool.


    # Using Console to Look at a Live Application


    We''ve already created a large amount of functionality in our application''s model
