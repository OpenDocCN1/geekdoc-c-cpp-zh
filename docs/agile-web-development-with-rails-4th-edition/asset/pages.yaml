- img_proc: true
  md: 'We created validations for presence, inclusion, numericity, range, uniqueness,
    format, and confirmation. (And length too, if you completed the exercises). We
    created custom validations for ensuring that deleted products are not referenced
    by any line item. We used an Active Record hook to ensure that an administrator
    always remains, and a transaction to roll back incomplete updates on failure.


    We also created logic to add to a cart, add line items from a cart to an order,
    encrypt and authenticate a password, and to compute various totals.


    Finally, we created a default sort order for products for display purposes.


    # View


    Views control the way our application presents itself to the external world. By
    default, Rails scaffolding provides edit, index, new, and show, as well as a partial
    named form that is shared between edit and new. We modified a number of these,
    as well as creating new partials for carts and line items.


    In addition to the model backed resource views, we created entirely new views
    for admin, sessions, and the store itself.


    We updated an overall layout to establish a common look and feel for the entire
    site. We made use of RJS templates to generate JavaScript that takes advantage
    of Web 2.0 technologies to make our web site more interactive.


    We made use of a helper to determine when to hide the cart from the main view.


    We localized the customer views for both in English and Spanish.


    While we focused primarily on HTML views, we also created plain text views and
    Atom views. Not all of the views were designed for browsers: we created views
    for email too, and those views were able to share partials for displaying line
    items.


    # Controller


    By the time we were done, we created eight controllers: one for the five models,
    and the three additional ones in order to support the views for admin, sessions,
    and the store itself.


    These controllers interacted with the models in a number of ways: finding and
    fetching data and putting it into instance variables to updating models and saving
    data entered via forms. When done, we redirected to another action or rendered
    a view. We rendered views in HTML, JSON, and Atom.'
