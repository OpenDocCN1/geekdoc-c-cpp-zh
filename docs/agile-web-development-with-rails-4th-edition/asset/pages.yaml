    ndef self.down\n  drop_table :products\nend\n```\n\nNow that we are done with\
    \ our changes, we need to Rails to apply this migration to our development database.\
    \ We do this using the rake command. Rake is like having a reliable assistant\
    \ all the time: you tell it to do some task, and that task gets done. In this\
    \ case, we'll tell Rake to apply any unapplied migrations to our database:\n\n\
    ```\ndepot> rake db:migrate\n(/users/rubys/work/depot)\n== CreateProducts: migrating\
    \ ====================================\n-- create_table(:products)\n-> 0.0027s\n\
    == CreateProducts: migrated (0.0023s) =====================================\n\
    ```\n\nAnd that's it. Rails looks for all the migrations not yet applied to the\
    \ database and applies them. In our case, the products table is added to the database\
    \ defined by the development section of the database.yml file.\n\nOK, all the\
    \ groundwork has done. We set our Depot application as a Rails project. We created\
