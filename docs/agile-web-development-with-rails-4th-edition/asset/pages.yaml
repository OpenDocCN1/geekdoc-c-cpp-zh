  md: 'to output a cheery banner if there isn''t another, more pressing note. It dont
    need that message be passed to the next action—it''s for the current request only.
    Only to do this, it could use flash.now, which updates the flash but does not
    add to the session data.


    While flash.now creates a transient entry, flash.keep does the opposite, making
    entries that are currently in the flash stick around for another request cycle.
    If you pass no parameters to flash.keep, all flash contents are pre-served.


    Flashes can store more than text messages—you can use them to pass all kinds of
    information between actions. Obviously, for longer-term information you''d want
    to use the session (probably in conjunction with your database) to store the data,
    but the flash is great if you want to pass parameters from one request to the
    next.


    Because the flash data is stored in the session, all the usual rules apply. In
    particular, every object must be serializable. We strongly recommend passing only
    simple objects in the flash.


    # Filters


    Filters enable you to write code in your controllers that wrap the processing
    performed by actions—you can write a chunk of code and have it called before or
    after any number of actions in your controller (for your controller''s subclasses).
    This turns out to be a powerful facility. Using filters, we can implement authentication
    schemes, logging, response compression, and even response customization.


    Rails supports three types of filter: before, after, and around. Filters are called
    just prior to/or after the execution of actions. Depending on how you define them,
    they either run as methods inside the controller or are passed the controller
    object when they are run. Either way, they get access to details of the request
    and response objects, along with the other controller attributes.


    # Before and After Filters


    As their names suggest, before and after filters are invoked before or after an
    action. Rails maintains two chains of filters for each controller. When a controller
    is about to run an action, it executes all the filters on the before chain. It
    executes the action running before the filters on the after chain.


    Filters can be passive, monitoring activity performed by a controller. They can
    also take a more active part in request handling. If a filter returns false, processing
    of the filter chain terminates, and the action is not run. A filter may also render
    output or redirect requests, in which case the original action never gets invoked.'
