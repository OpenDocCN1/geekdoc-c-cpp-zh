    # David Says...


    Why Plurals for Tables?


    Because it sounds good in conversation. Really. "Select a Product from products,"
    and "Order has many:line_items."


    The intent is to bridge programming and conversation by creating a domain language
    that can be shared by both. Having such a language cutting down on the mental
    translation that otherwise confuses the discussion of a product description with
    the client when it''s really implemented as merchant body. These communications
    gaps are bound to lead to errors.


    Rails sweets the deal by giving you most of the configuration for free if you
    follow the standard conventions. Developers are thus rewarded for doing the right
    thing, so if it''s less about giving up "your ways" and more about getting productivity
    for free.


