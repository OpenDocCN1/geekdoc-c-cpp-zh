    In cryptography, salts are used to make it harder to crack the password. We create
    a salt string by concatenating a random number and the object id of the user object.
    It doesn''t matter much what the salt is as long as it''s unpredictable (using
    the time as a salt, for example, has lower entropy than a random salt). We store
    this new salt into the model''s salt attribute. Again, this is a private method,
    so place it after the private keyword in the source:


    Download depot_r/app/salt


    ```

    def generate_salt

    self.salt = self.object_id_to_s + rand.to_s

    end

    ```


    There''s a subtlety in this code we''ve never seen before. Note that we wrote
    salt= .... This forces the assignment to the salt= accessor method—we''re saying
    "call the method salt= in the current object." Without the self., Ruby would have
    thought we were assigning to a local variable, and our code would have no effect.


    Although using the instance variable directly would achieve the correct results,
    it would also tie you to a representation that may not always be the same. The
    attribute salt=salt is the "official" interface to the underlying model attributes,
    so it is better to use them rather than instance variables.


    Another way of looking at it is that the attributes form part of the public interface
    of the class, the class should eat its own dog food and use that interface. If
    you use @@xx internally and xx externally, the door is wide open for some kind
    of mismatch down the row.


    Now we need to write some code that whenever a new plain-text password is stored
    into a user object automatically create a hashed version (which will get stored
