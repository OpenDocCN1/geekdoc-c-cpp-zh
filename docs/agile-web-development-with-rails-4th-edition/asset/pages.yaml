    # 17.1 Rails Concepts


    In Chapter 3, The Architecture of Rails Applications, on page 51 we introduced
    these concepts, views, and controllers. Now let''s see how we applied each of
    these in the Depot application. Let''s explore how we used configuration, testing,
    and deployment.


    # Model


    Models are where all the persistent data retained by your application are managed.
    In Developing the Depot application, we created five models: Cart, Lineitem, Order,
    Product, and User.


    By default, all models have id, created_at, and updated_at attributes. To our
    models, we added attributes of type string (examples: title, name), integer (quantity),
    text (description, address), decimal (price), and foreign keys (product_id, cart_id).
    We created a virtual attribute that is never stored in the database: namely a
    password.


    We created has_many and belongs_to relationships that we can use to navigate between
    our model objects, as from Cart to Lineitems to Products.


    We employed migrations to update the databases, not only to introduce new schema
    information, but also to modify existing data. We demonstrated that they can be
    applied in a fully reversible manner.


    The models we created were not merely passive receptacles for our data. For starters,
    they actively validate the data, preventing errors from propagating'
