  md: '+   * The controller can return a string directly to the browser without invoking
    the view. This is fairly rare but can be used to send error notifications.


    +   * The controller can return nothing to the browser. It is sometimes used when
    responding to an Ajax request. In all cases, however, the controller returns a
    set of HTTP headers, because some kind of response is expected.


    +   * The controller can send other data to the client (something other than HTML).
    This is typically a download of some kind (perhaps a PDF document or a file''s
    contents).


    A controller always responds to the user exactly one time per request. This means
    that you should just call one to render, redirect_to, or send_xxx method in the
    processing of any request. (A DoubleRenderError exception is thrown on the second
    render). The undocumented method erase_render_results discards the effect of a
    previous render in the current request, permitting a second render to take place.
    Use at your own risk.


    Because the controller must respond exactly once, it checks whether a response
    has been generated just before it finishes handling a request. If not, the controller
    looks for a template named after the controller and action and automatically renders
    it. This is the most common way that rendering takes place. You may have noticed
    that in most of the actions in our shopping cart tutorial we explicitly rendered
    anything. Instead, our action methods set up the context for the view and return.
    The controller notices that no rendering has taken place and automatically invokes
    the appropriate template.


    You can have multiple templates with the same name but different extensions (for
    example, html.erb, xml.builder, and js.js). If you don''t specify an extension
    in a render request, Rails assumes html.erb.


    # Rendering Templates


    A template is a file that defines the content of our response for our application.
    Rails supports three template formats out of the box: erb, which is embedded Ruby
    code (typically with HTML); builder, a more programmatic way of constructing XML
    content, and R/JS, which generates JavaScript. We''ll talk about the contents
    of these files starting on page 345.


    By convention, the template for action action controller will be in the file app/views/controller/action.type
    (where type is the file type, such as html, atom or js; and one of erb, builder,
    or rjs). The app/views part of the name is the default. You can override this
    for an entire application by setting this:


    ```

    ActionController.prepend_view_path dir_path

    ```'
