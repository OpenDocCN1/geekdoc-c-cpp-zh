  md: '# David Says...


    # Picking Good Fixture Names


    Like the names of variables in general, you want to keep the names of fixtures
    as self-explanatory as possible. This increases the readability of the tests when
    you''re asserting that product:valid_order_for_fred is indeed Fred''s order. or
    use fred. It makes it a lot easier to remember which fixture you''re supposed
    to test against without having to look up pl or order4. The more fixtures you
    get, the more important it is to pick good fixture names. So, starting early keeps
    you happy later.


    But what do we do with fixtures that can''t easily get a self-explanatory name
    like valid_order_for_fred? Pick natural names that you have an easier time associating
    to a role. For example, instead of order1, use christmas_order. Instead of customer1,
    Once you get into the habit of natural names, you''ll be weaving a nice little
    story about how fred is paying for his christmas_order with invalid_credit_card
    first, then paying with his valid_credit_card, and finally choosing to ship it
    all off to aunt_mary.


    Association-based stories are key to remembering large worlds of fixtures with
    ease.


    end


    The fixtures directive load the fixture data corresponding to the given model
    name into the corresponding database table before each test method in the test
    case is run. The name of the fixture file determines the table that is loaded,
    so using :products will cause the products.yml fixture file to be used.


    Let''s say again another way. In the case of Productfirst class, adding the fixtures
    directive means that the products table will be emptied out and then populated
    with the three rows defined in the fixture before each test method is run.


    Note that most of the scaffolding in Rails generates doesn''t contain calls to
    the fixtures method. That''s because the default for tests is to load all fixtures
    before running the test. As that default is generally the one you want, usually
    isn''t any need to change it. Once again, conventions are used to eliminate the
    need for unnecessary configuration.


    The products method indexes into that table. We need to change the index used
    to match the name we gave in the fixture.'
