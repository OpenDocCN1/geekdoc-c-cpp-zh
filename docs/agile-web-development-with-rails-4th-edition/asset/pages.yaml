  md: '# David Says...


    # The Wonders of a Cookie-Based Session


    The default Rails session store sounds like a crazy idea when you hear it first.
    You''re going to actually store the values on the client?! But what if I want
    to store the nuclear launch codes in the session and I can''t have the client
    actually knowing those?


    Yes, the default store is not suitable for storing secrets you need to keep from
    the client. That''s actually a valuable constraint that''ll lead you to avoid
    the perils of keeping complex objects that can go out of date in the session.
    And the paper dragon of the nuclear launch codes is just about never a real, relevant
    concern.


    Neither is the session constraint. Cookies can be only about 4KB big, so you can''t
    stuff them with all sorts of malware. That fits the best practices of storing
    only references, like a cart_id, not the actual cart itself.


    The security concern you should be worried about whether the client is actually
    able to change the session. You want to ensure the integrity of the values that
    you put. It''d be no good if the client could change his cart_id from a 5 to 8
    and get someone else''s. Frankly, Rails protects against exactly this case by
    signing the session and raising an exception that warns of the tampering if it
    doesn''t match.


    The benefits get back that there is no load on the database from fetching and
    saving the session on every request and there''s no cleanup duties either. If
    you keep your session on the filesystem or in the database, you''ll have to deal
    with how to clean up sessions, which is a real hassle. No one likes to be a cleanup
    duty. The cookie-based sessions know how to clean up after themselves. What''s
    not to love that?


    And that leads to an interesting question: exactly where does this data stay around
    requests? One choice is for the server to send it down to the client as a cookie.
    This is the default for Rails 3.0. It places limitations on the size and increases
    means that there is less for the server to manage and clean up. Note that the
    contents are cryptographically signed by (but default) encrypted, which means
    that users can see but not tamper with the contents.


    The other option is to store the data on the server. There are two parts to this.
    First, Rails has to keep track of sessions. It does this by creating (by default)
    a 32-hex character key (which means there are 1632 possible combinations). This
    key calls the session id, and it''s effectively random. Rails arranges to


