  md: "![](img/79be11dd96f63a00f9795e2dfe232ef5_381_0.png)\n\nFigure 22.1: Refreshing\
    \ a page with cached and noncached data\n\nThe key concept here is that the stuff\
    \ that's cached is the fragment generated in the view. If we constructed the article\
    \ list in the controller and passed that to the list, the future access to the\
    \ page would not have to reender the list, but the database request would be accessed\
    \ on every request. Moving the database request to the view means it won't be\
    \ called once the output is cached.\n\nOK, you say, but that just broke the rule\
    \ about putting application-level code into view templates. We can't avoid how.\
    \ We can, but it makes caching just a little less transparent than it would otherwise\
    \ be. The trick is to have the action for the presence of a cached fragment. If\
    \ one exists, the action bypasses the expensive database operation, knowing that\
    \ the fragment will be used.\n\nDownload `e1/views/app/controllers/blog1_controller.rb`\n\
    \n```\nclass BlogController < ApplicationController\n  def list\n    @dynamic_content\
    \ = Time.now.to_s\n    unless read_fragment(:action => 'list')\n      logger.info(\"\
    Creating fragment\")\n    @articles = Article.find_recent\n  end\n```"
