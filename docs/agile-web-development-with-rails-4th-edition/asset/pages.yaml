  md: "Here's our Article class. It simulates a model class that in normal circumstances\
    \ would fetch articles from the database. We've arranged for the first article\
    \ in our list to display the time at which it was created.\n\nDownload e1/views/app/models/article.rb\n\
    \n```\nclass Article\n  attr_reader :body\n\n  def initialize(body)\n    @body\
    \ = body\n  end\n\n  def self_find_recent\n    new(\"It is now #{Time.now.to_s}\"\
    ),\n    new(\"Today I had pizza\")\n    new(\"Yesterday I watched Spongebob\"\
    ),\n    new(\"Did nothing on Saturday\")\n  end\nend\n```\n\nNow we'd like to\
    \ set up a template that uses a cached version of the rendered articles but still\
    \ updates the dynamic data. It turns out to be trivial.\n\nDownload e1/views/app/views/list.html.erb\n\
    \n```\n<%= @dynamic_content %> <!-- Here's dynamic content. -->\n<% cache do %>\
    \ <!-- Here's the cache we ---->\n<ul>\n  <% for article in Article.find_recent\
    \ %>\n    <li><p><%= h(article.body) %></p></li>\n  <% end %>\n</ul>\n<% end %>><!--\
    \ End of cached content -->\n<%= @dynamic_content %> <!-- More dynamic content.\
    \ ---->\n```\n\nThe magic is the cache method. All output generated in the block\
    \ associated with this method is cached. The next time page is accessed, the dynamic\
    \ content will still be rendered, but the stuff inside the block will come straight\
    \ from the cache—it won't be regenerated. We can see this if we bring up our skeletal\
    \ application and hit Refresh after a few seconds, as we see in Figure 22.1, on\
    \ the following page. The times at the top and bottom of the page—the dynamic\
    \ portion of our data—change on the refresh. The time in the center section remains\
    \ the same, because it is being served from the cache. (If you're trying this\
    \ and see all three time changes, you're running your application in development\
    \ mode. Caching is enabled by default only in production. If you're testing using\
    \ WEBrick, the -e production option will do the trick.)"
