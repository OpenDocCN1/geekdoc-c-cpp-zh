  md: "Now that all the pieces are in place, we can go to the store page and hit the\
    \ Add to Cart button for a product that is already in the cart. What are we likely\
    \ to see a mixture of individual products listed separately, and a single product\
    \ listed with a quantity of two. This is because we added a quantity of one to\
    \ existing columns instead of collapsing multiple rows when possible. What we\
    \ need to do next is migrate the data.\n\nWe start by creating a migration.\n\n\
    ```\n```depot> rails generate migration combine_items_in_cart\n\nThis time. Rails\
    \ can't infer what we are trying to do, so it is entirely up to us to fill in\
    \ the self.up method.\n\nDownload depot/db/migrate/20110211000005_combine_items_in_cart.rb\n\
    def self.up\n  # replace items for a single product in a cart with a single item\n\
    \  Cart.all.each do |cart|\n    # count the number of each product in the cart\n\
    \    sums = cart.line_items.group(:product_id).sum(:quantity)\n\n    sums.each\
    \ do |product_id, quantity|\n      if quantity > 1\n        # remove individual\
    \ items\n        cart.line_items.where(:product_id=>product_id).delete_all\n\n\
    \        # replace with a single item\n        cart.line_items.create(:product_id=>product_id,\
    \ :quantity=>quantity)\n      end\n    end\n  end\nend\n```\n```\n\nThis is easily\
    \ the most extensive code we've seen so far. Let's look at it small pieces.\n\n\
    +   * We start by iterating over each cart.\n* For each cart, we get a sum of\
    \ the quantity fields for the line items associated with this cart, grouped by\
    \ product_id. The resulting sums will be a list of ordered pairs of product_ids\
    \ and quantity.\n* We iterate over these sums, extracting the product_id and quantity\
    \ from each.\n* In cases where the quantity is greater than one, we will delete\
    \ all of the individual line items associated with this cart and this product,\
    \ and replace them with a single line item with the correct quantity.\n\nNote\
    \ how easily and elegantly Rails enables us to express this algorithm.\nWith this\
    \ code in place, we apply this migration just like any other migration."
