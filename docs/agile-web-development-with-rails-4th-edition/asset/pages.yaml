  md: '# Making it Work


    # Manage It!


    Manage It! is an award-winning, risk-based guide to making good decisions about
    how to plan and guide your projects. Author Johanna Rothman shows you how to beg,
    borrow, and steal from the best methodologies to fit your particular project.
    You''ll find what works for you.


    +   * Learn all about different project lifecycles • See how to organize a project
    • Compare sample dashboards • See how to staff a project • Know when you''re done—and
    what that matters.


    Manage It! Your Guide to Modern, Pragmatic Project Management


    Johanna Rothman

    (360 pages) ISBN: 0-9787392-4-8. 834.95

    http://prprog.com/titles/rjpm


    ![](img/79be11dd96f63a00f9795e2dfe232ef5_469_0.png)


    # Manage Your Project Portfolio


    Too many projects? Want to organize them and evaluate them without getting buried
    under a mountain of statistics? You''ll see how to determine the really important
    projects (which might not be what you think) and as the projects you should never
    do. You''ll learn how to tie your work to your organization''s mission and show
    your board, your managers, and your staff what you can accomplish and when. You''ll
    get a better view of the work you have, and learn how to make those difficult
    decisions, ensuring that all your strength is focused where it needs to be.


    Manage Your Project Portfolio: Increase Capacity and Finish More Projects


    Johanna Rothman

    (200 pages) ISBN: 978-19343562-9-6. 832.95

    http://prprog.com/titles/rjport


    ![](img/79be11dd96f63a00f9795e2dfe232ef5_469_1.png)'
