    \ p.update_attribute :price, p.lookup_master_price\n  end\nend\n```\n\nsay_with_time\
    \ prints the string passed before the block is executed, and the benchmark after\
    \ the block completes.\n\n# 23.5 When Migrations Go Bad\n\nMigrations suffer from\
    \ one serious problem. The underlying DDL statements that update the database\
    \ schema are not transactional. This isn't a failing in Rails—most databases don't\
    \ support the rolling back of create table, after table, and other DDL statements.\n\
    \nLet's look at a migration that tries to add two tables to a database:\n\n```\n\
    class ExampleMigration < ActiveRecord::Migration\ndef self.up\n  create_table\
    \ :one do ...\n  end\n  create_table :two do ...\n  end\nend\n```\n\n```\ndef\
    \ self.down\n  drop_table :two\n  drop_table :one\nend\n```\n\nIn the normal course\
    \ of events, the up method adds tables one and two, and the down method removes\
    \ them.\n\nBut what happens if there's a problem creating the second table? We'll\
    \ end up with a database containing one table but not two. We can fix whatever\
    \ the problem is in the migration, but now we can't apply it—if we try, it will\
    \ fail because table one already exists.\n\n+   - http://wiki.rubyonrails.org/rails/pages/AvailableGenerators"
