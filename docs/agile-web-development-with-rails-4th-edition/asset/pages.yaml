    # Chapter 5


    # The Depot Application


    We could mess around all hacking together simple test applications, but that won''t
    help us pay the bills. So, let''s get our teeth into something meatier. Let''s
    create a web-based shopping cart application called Depot.


    Does the world need another shopping cart application? Nope, but that has stopped
    hundreds of developers from writing one. Why should we be different?


    More seriously, it turns out that our shopping cart will illustrate many of the
    features of Rails development. We''ll see how to create simple maintenance pages,
    link database tables, handle sessions, and create forms. Over the next twelve
    chapters, we''ll also touch on peripheral topics such as unit testing, security,
    and page layout.


    # 5.1 Incremental Development


    We''ll be developing this application incrementally. We won''t attempt to specify
    everything before we start coding. Instead, we''ll work out enough of a specification
    to let us start and immediately create some functionality. We''ll try ideas, gather
    feedback, and continue with another cycle of mini-design and development.


    This style of coding isn''t always applicable. It requires close cooperation with
    the application''s users, because we want to gather feedback as we go along. We
    might make mistakes, or the client might discover they asked for one thing but
    really wanted something different. It doesn''t matter what the reason—the earlier
    we discover we''ve made a mistake, the less expensive it will be to fix that mistake.
    All in all, with this style of development there''s a lot of change as we go along.


    Because of this, we need to use a toolset that doesn''t penalize us for changing
    our minds. If we decide we need to add a new column to a database table or change
    the navigation between pages, we need to be able to get in'
