- img_proc: true
  md: 'The first question that springs to mind is, how does the application know what
    to do with the incoming request? A shopping cart application will receive requests
    to display a catalog, add items to a cart, create an order, and so on. How does
    it route these requests to the appropriate code?


    It turns out that Rails provides two ways to define a request: a comprehensive
    way that you will use when you need to and a convenient way that you generally
    use whenever you can.


    The comprehensive way lets you define a direct mapping of URLs to actions based
    on pattern matching, requirements, and conditions. The convenient way lets you
    define routes based on resources, such as the models that you define. And because
    the convenient way is built on the comprehensive way, you can freely mix and match
    the approaches.


    In both cases, Rails encodes information in the request URL and uses a system
    called *Action Dispatch* to determine what should be done with that request. The
    actual process is very flexible, but at the end of it Rails determines the name
    of the *controller* that handles this particular request, along with a list of
    any other request parameters. In the process, either of these additional parameters
    or the HTTP method itself is used to identify the *action* to be invoked in the
    target controller.


    Rails routes support the mapping between URLs and actions based on the contents
    of the URL and the HTTP method used to invoke the request. We''ve seen how to
    do this on a URL-by-URL using anonymous or named routes. Rails also supports a
    higher-level way of creating groups of related routes. To understand the motivation
    for this, we need to take a little diversion into the world of Representational
    State Transfer.


    # REST: Representational State Transfer


    The ideas behind REST were formalized in Chapter 5 of Roy Fielding''s 2000 PhD
    dissertation.¹ In a REST approach, servers communicate with clients using stateless
    connections. All the information about the state of the interaction between the
    two is encoded in the requests and responses between them. Long-term state is
    kept on the server as a set of *identifiable resources*. Clients access these
    resources using a well-defined (and severely constrained) set of resource identifiers
    (URLs in our context). REST distinguishes the content of resources from the presentation
    of that content. REST is designed to support highly scalable computing while constructing
    application architectures to be decoupled by nature.


    There''s a lot of abstract stuff in this description. What does REST mean in practice?


    +   1. http://www.ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm'
