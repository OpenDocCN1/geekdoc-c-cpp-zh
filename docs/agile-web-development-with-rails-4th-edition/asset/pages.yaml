    We plainly that, in fact, changed a lot. Look at the cart in the sidebar. See?
    When we add something, the quantity changes from 4 to 5.


    "Oh," she says, "I didn''t notice that." And, if she didn''t notice the page update,
    it''s likely our customers won''t either. It''s time for some user-interface handling.


    # 11.3 Iteration F3: Highlighting Changes


    Included with Rails is a number of JavaScript libraries. One of those libraries,
    effects.js, lets you decorate your web pages with a number of visually interesting
    effects.¹ One of these effects is the (now) infamous Yellow Fade Technique. This
    highlights an element in a browser: flashes the background yellow and gradually
    fades back to white. We can see the Yellow Technique being applied to our cart
    in Figure 11.2, on the next page; the image at back shows the original cart. The
    user clicks the Add to Cart


    ¹ effects.js is part of Script.aculo library. Take a look at the visual effects
    page at https://github.com/madobby/scriptaculous/wiki to see the cool things you
    can do with.'
