  md: "```\nexpire_page :action => \"public_content\"\n```\n\n```\nelse\n  # ...\n\
    end\n```\n\n```\ndef update_article\n  article = Article.find(params[:id])\n \
    \ if article.update_attributes(params[:article])\n    expire_action :action =>\
    \ \"premium_content\", :id => article\n  else\n    #\n  end\nend\n```\n\nThe method\
    \ that deletes an article does a bit more work—it has to both invalidate the public\
    \ index page and remove the specific article page:\n\n```\ndef delete_article\n\
    \  Article.destroy(params[:id])\n  expire_page :action => \"public_content\"\n\
    \  expire_action :action => \"premium_content\", :id => params[:id]\nend\n```\n\
    \n# Picking a Caching Strategy\n\nCaching, like sessions, features a number of\
    \ storage options. You can keep the fragments in a database, in a DB server, or\
    \ in memcached servers. But whereas sessions usually contain small amounts of\
    \ data and require one row per user, fragment caching can easily create sizeable\
    \ amounts of data, and you can have many users per user. This makes database store\
    \ a poor fit.\n\nFor many setups, it's easiest to keep cache files on the filesystem.\
    \ But you can't keep these files locally on each server, because expiring a cache\
    \ on one server would not expire it on the rest. You therefore need to set up\
    \ a network drive that all the servers can share for their caching.\n\nAs session\
    \ configuration, you can configure a file-based caching store globally in environment.rb\
    \ or in a specific environment's file:\n\n```\nActionController::Base.cache_store\
    \ = :file_store, \"#{RAILS_ROOT}/cache\"\n```\n\nThis configuration assumes a\
    \ directory named cache is available in the root of the application and that the\
    \ web server has full read and write access to it. This directory can easily be\
    \ symlinked to the path on the server that represents the network drive.\n\nRegardless\
    \ of which store you pick for caching fragments, you should be aware that network\
    \ bottlenecks can quickly become a problem. If your site depends"
  merge: -1
