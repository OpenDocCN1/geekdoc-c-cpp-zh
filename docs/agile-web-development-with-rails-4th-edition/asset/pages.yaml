  md: 'There''s one more caveat, and it''s a big one. If you store an object in session
    data, the next time you come back to that browser, your application will end up
    retrieving that object. However, if in the meantime you''ve updated your application,
    the object in session data may not agree with the definition of that object''s
    class in your application, and the application will fail while processing the
    request. There are three options here. One is to store the object in the database
    using conventional models and keep just the id of the row in the session. Model
    objects are far more forgiving of schema changes than the Ruby marshaling library.
    The second option is to manually delete all the session data stored on your server
    whenever you change the definition of a class stored in that data.


    The third option is slightly more complex. If you add a number to your session
    keys and change that number whenever you update the stored data, you''ll only
    ever load data that corresponds with the current version of the application. You
    can potentially version the classes whose objects are stored in the session and
    use the appropriate classes depending on the session keys associated with each
    request. This last idea can be a lot of work, so you''ll need to decide whether
    it''s worth the effort.


    Because the session store is hash-like, you can save multiple objects in it, each
    with its own key.


    There is no need to disable sessions for particular applications. As sessions
    are lazily loaded, simply don''t reference a session in any action in which you
    don''t need a session.


