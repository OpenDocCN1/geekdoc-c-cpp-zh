    User.where("name like ''?%", params[:name])


    Rails doesn''t parse the SQL inside a condition and so doesn''t know that the
    name is substituted into a string. As a result, it will go ahead and add extra
    quotes around the value of the name parameter. The correct way to do this is to
    construct the full parameter to the like clause and pass that parameter into the
    condition:


    ```

    User.where("name like ?", params[:name]+"%%")

