- img_proc: true
  md: 'In Rails, dynamic content is generated by templates, which come in three flavors.
    The most common templating scheme, called Embedded Ruby (ERB), embeds snippets
    of Ruby code within a view document, with many ways similar to the way it is done
    in other frameworks, such as PHP or JSP. This approach is very flexible, some
    are concerned that it violates the spirit of MVC. By embedding code in the view,
    we risk adding logic that should be in the model or the controller. As with everything,
    with judicious use in moderation is healthy, maintaining a clean separation of
    concerns is part of the job of the developer. (We look at HTML templates in Section
    25.2. Generating HTML with ERB, on page 418.)


    XML Builder can also be used to construct XML documents using Ruby code—the structure
    of the generated XML will automatically follow the structure of the document.
    We discuss xml.builder templates starting on page 416.


    Rails also provides JS views. These allow you to create JavaScript fragments on
    the server that are then executed on the browser. This is great for creating dynamic
    Ajax interfaces. We talk about these starting on page 149.


    # And the Controller


    The controller is the logical center of your application. It coordinates the interaction
    between the user, the views, and the model. However, Rails handles most of this
    interaction behind the scenes; the code you write on application-level functionality.
    This makes Rails code remarkably easy to develop and maintain.


    The controller is also home to a number of important ancillary services:


    +   - It is responsible for routing external requests to actions. It handles people-friendly
    URLs extremely well.


    +   - It manages caching, which can give applications orders-of-magnitude performance
    boosts.


    +   - It manages modules, which extend the capabilities of the view templates
    without building up their code.


    +   - It manages sessions, giving users the impression of ongoing interaction
    with our applications.


    You''ve already seen and modified a controller in Section 2.2. Hello, Rails!,
    on page 40, and will be seeing and modifying a number of controllers in the development
    of a sample application, starting with the Product Controller in Section 8.1,
    Iteration C1: Creating the Catalog Listing, on page 109.


    There''s a lot to Rails. But before going further let''s have a brief refresher—and
    for some of you, the Ruby language itself.'
