  md: "There is one more type worth mentioning—the regular expression.\n\n# Regular\
    \ Expressions\n\nA regular expression lets you specify a pattern of characters\
    \ to be matched in a string. In Ruby, you typically create a regular expression\
    \ by writing /pattern/ or %(pattern).\n\nFor example, you could write a pattern\
    \ that matches a string containing the text Perl or the text Python using the\
    \ regular expression /Perl|Python/.\n\nThe forward slashes delimit the pattern,\
    \ which consists of the two things we're matching, by a vertical bar (|). This\
    \ bar character means \"either the thing on the left or on the right.\" In this\
    \ case either Perl or Python. You can use parentheses within patterns, just as\
    \ you can also write this pattern as /(Perly|python)/. Programs typically test\
    \ strings against regular expressions using the -= match operator:\n\n```\nif\
    \ line =~ /(Perl|python)/\n  puts \"There seems to be another scripting language\
    \ here\"\n```\n\nYou can specify repetition within patterns. /ab+c/ matches a\
    \ string containing an a followed by one or more b's, by a c. Change the pattern\
    \ to an asterisk, and /ab*c/ creates a regular expression that matches one a,\
    \ zero or more b's, and one c.\n\nBackward slashes start special sequences, most\
    \ notably \\d matches any digit, \\s matches any whitespace character, and \\\
    w matches any alphanumeric (\"word\") character.\n\nRuby's regular expressions\
    \ are a deep and complex subject; this section barely skims the surface. See in\
    \ the PickAxe book for a full discussion.\n\nThis book will make light use of\
    \ regular expressions.\nWith that brief introduction to data, let's move on to\
    \ logic.\n\n# 4.3 Logic\n\nMethod calls are statements. Ruby also provides a number\
    \ of ways to make decisions that affect the repetition and order in which methods\
