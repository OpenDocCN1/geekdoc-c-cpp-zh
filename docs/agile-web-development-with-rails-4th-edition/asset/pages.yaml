  md: 'Implementing this expiration depends on the storage mechanism being used.


    For Store-based sessions, the easiest approach is to run a sweeper task periodically
    (for example using cron(1) under Unix-like systems). This task should inspect
    the last modification times of the files in the session data directory, deleting
    those older than a given time.


    For Active Record-based session storage, the updated_at columns in the sessions
    table. You can delete all sessions that have not been modified in the last hour
    (ignoring daylight saving time changes) by having your sweeper task issue SQL
    such as:


    ```

    delete from sessions

    where updated_at < 3600;

    ```


    For DRB-based solutions, expiry takes place within the DRB server process. You''ll
    probably want to record timestamps alongside the entries in the session data hash.
    You can run a separate thread (or even a separate process) that periodically deletes
    the entries in this hash.


    In all cases, your application can help this process by calling reset_session
    to delete sessions when they are no longer needed (for example, when a user logs
    out).


    # Flash: Communicating Between Actions


    When we use redirect_to to transfer control to another action, the browser generates
    a separate request to invoke that action. That request will be handled by our
    application in a fresh instance of a controller object—instance variables that
    were set in the original action are not available to the code handling the redirected
    action. But sometimes we need to communicate between these two instances. We can
    do this using a facility called the flash.


    The flash is a temporary scratchpad for values. It is organized like a hash and
    stored in the session data, so you can store values with keys and retrieve them.
    It has one special property. By default, values stored into the flash during the
    processing of a request will be available during the processing of the immediately
    following request. Once that second request has been processed, those values are
    removed from the flash.


    Probably the most common use of the flash is to pass error and informational strings
    from one action to the next. The intent here is that the first action notices
    some condition, creates a message describing that condition, and redirects to
    a separate action. By storing the message in the flash, the second action is able
    to access the message text and use it in view.


    It is sometimes convenient to use the flash as a way of passing messages into
    a template in the current action. For example, our display method might want'
