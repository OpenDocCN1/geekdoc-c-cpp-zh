  md: '# Managing Dependencies with Bundler


    These templating engines are just two of the many gems that Rails depends on.
    At this point it makes sense to talk about how such dependencies are managed.


    Dependency management is a deceptively hard problem. During development, you may
    choose to install updated versions of gems that you depend on. Once you do this
    you may find yourself not being able to reproduce problems that occur in production
    as your runs are picking up versions of the gems your application depends on.
    Or perhaps you see some that don''t exist in production.


    It turns out that dependencies are every bit as important as manage your application
    source code or database schemas. If you are developing as part of a team, you
    want every member of the team to be using the same version of the dependencies.
    When you deploy, you want to ensure that the version of the dependencies that
    you tested are installed on the target machine and are the ones actually used
    in production.


    Bundler takes care of this, a file named Gemfile that is placed in the top of
    your application directory. In this file, you list the dependencies of your application.
    Let''s take a closer look at the Gemfile for the Depot application.


    ```

    source ''http://rubygems.org''


    gem ''rails'', ''3.0.3''


    # Bundle edge Rails instead:

    gem ''rails'', :git => ''git://github.com/rails/rails.git''


    gem ''sqlite3-ruby'', :require => ''sqlite3''

    group :production do

    gem ''mysql''

    end


    # Use unicorn as the web server

    gem ''unicorn''


    # Deploy with Capistrano

    gem ''capistrano''


    # To use debugger (ruby-debug) for Ruby 1.8.7+, ruby-debug19 for Ruby 1.9.2+)

    gem ''ruby-debug''

    gem ''ruby-debug19''

    ```


    Bundle the extra gems:


    +   2. http://bundler.com/'
