- img_proc: true
  md: "Layouts are controller-specific. If the current request is being handled by\
    \ a controller called store, Rails will by default look for a layout called store\
    \ (with the usual .html.erb or .xml builder extension) in the app/views/layouts\
    \ directory. If you create a layout called in the layouts directory, it will be\
    \ applied to all controllers that don't have a layout defined for them.\n\nYou\
    \ can override this using the layout declaration inside a controller. At its simplest,\
    \ the declaration takes the name of the layout as a string. The declaration will\
    \ make the template in the file standard .html.erb or standard .xml.builder for\
    \ the store controller. The layout file will be looked for in the app/views/layouts\
    \ directory.\n\n```\nclass StoreController < ApplicationController\n\n  layout\
    \ \"standard\"\n\n# ...\nend\n```\n\nYou can qualify which actions will have the\
    \ layout applied to them using :only and :except qualifiers:\n\n```\nclass StoreController\
    \ < ApplicationController\n\n  layout \"standard\", :except => [ :rss, :atom ]\n\
    \n# ...\nend\n```\n\nSpecifying a nil layout turns off layouts for a controller.\n\
    \nSometimes you need to change the appearance of a set of pages at runtime. For\
    \ example, a blogging site might offer a different-looking side menu if the user\
    \ is logged in for maintenance, or a store site might have different-looking pages\
    \ if the site is down for maintenance. Rails supports this with dynamic layouts.\
    \ If the parameter to the layout declaration is a symbol, it's taken to be the\
    \ name of the layout to be used:\n\n```\nclass StoreController < ApplicationController\n\
    \n  layout :determine_layout\n\n  private\n\n  def determine_layout\n    if Store.is_closed?\n\
    \      \"store_down\"\n    else\n      \"standard\"\n    end\n```"
  merge: -1
  pgno: 363
- img_proc: true
  md: "end\n\nSubclasses of a controller will use the parent's layout unless they\
    \ override it using the layout directive.\n\nFinally, individual actions can choose\
    \ to render using specific layout (or with no layout at all) by passing the :layout\
    \ option:\n\n```\ndef rss\n  render(:layout => false) # never use a layout\nend\n\
    ```\n\n```\ndef checkout\n  render(:layout => \"layouts/simple\")\nend\n```\n\n\
    # Passing Data to Layouts\n\nLayouts have access to all the same data that's available\
    \ to conventional templates. In addition, instance variables set in the normal\
    \ template will be available in the layout (because the regular template is rendered\
    \ before the layout is invoked). This might be used to parameterize headers or\
    \ menus in the layout. For example, the layout might contain this:\n\n```\n<html>\n\
    <head>\n  <title><%= @title %></title>\n  <%= stylesheet_link_tag 'scaffold' %>\n\
    </head>\n<body>\n  <h1><%= @title %></h1>\n  <%= yield :layout %>\n</body>\n</html>\n\
    ```\n\nAn individual template could set the title by assigning it to the @title\
    \ variable:\n\n```\n<% @title = \"My Wonderful Life\" %>\n```\n\n```\n<p>\nDear\
    \ Diary:\n</p>\n```\n\n```\n<p>\nYesterday I had pizza for dinner. It was nice.\n\
    </p>\n```\n\nIn fact, we can take this further. The same mechanism lets us use\
    \ yield :layout to embed the rendering of a template into the layout also lets\
    \ you generate arbitrary content in a template, which can be embedded into any\
    \ other template."
