    # Subsetting the Records Returned


    Now we know how to specify conditions, let''s turn our attention to the various
    methods supported by ActiveRecord::Relation, starting with first and all.

    As you have guessed, first returns the first row in the relation. It returns nil
    if the relation is empty. Similarly, all returns all the rows as an array. ActiveRecord::Relation
    also supports many of the methods of Array objects, such as each and map. It does
    so implicitly by calling the all.


    It''s important to understand that the query is not evaluated until one of these
    methods is used. This enables us to modify the query in any of ways, by calling
    additional methods, prior to making this call. Let''s look at these methods now.


    # order


    SQL doesn''t guarantee that rows will be returned in any particular order unless
    we explicitly add an order by clause to the query. The order method lets us specify
    the criteria we''d normally add after the order by keywords. For example, the
    following query would return all of Dave''s orders, sorted by payment type and
    then by shipping date (the latter in descending order):


    ```

    orders = Order.where(:name => ''Dave'')

    order("pay_type, shipped_at DESC")

    ```


    # limit


    We can limit the number of rows returned by calling the .limit method. If we use
    the limit method, we''ll probably also want to sort the order to ensure consistent
    results. For example, the following returns the first ten matching orders:'
  merge: -1
  pgno: 291
- img_proc: true
  md: '```

    orders = Order.where(:name => ''Dave'').

    order("pay_type, shipped_at DESC")

    limit(10)

    ```


    # offset


    The offset method gets hand in hand with the limit method. It allows us to specify
    the offset of the first row in the result set that will be returned.


    +   # The view wants to display ordered groups pages,

    # where each page shows page_size orders at a time.

    # This method returns the orders on page_num (starting # at zero),


    ```

    def Order.find_on_page(page_num, page_size)

    order(:id).limit(page_size).offset(page_num=page_size)

    end

    ```


    We use offset in conjunction with limit to step through the results of a query
    n rows at time.


    # select


    By default, ActiveRecord::Relation fetches all the columns from the underlying
    database table—it issues a select * from to the database. Override this with the
    select method, which takes a string that will appear in place of the * in the
    select statement.


    This method allows us to limit the values returned in cases where we need only
    a subset of the data in a table. For example, our table of podcasts might contain
    information on the title, speaker, and date might also contain a large BLOB containing
    the MP3 for the talk. If you wanted to create a list of talks, it would be inefficient
    to also load the sound data for each row. The select method lets us choose which
    columns to load.


    ```

    list = Talk.select("title, speaker, recorded_on")

    ```


    # joins


    The joins method lets us specify a list of additional tables to be joined to the
    default table. This parameter is inserted into the SQL immediately after the name
    of the model and before any conditions specified by the first parameter. The join
    syntax is database-specific. The following code returns a list of all items for
    the book called Programming Ruby:


    ```

    ListItem.select(''li.quantity'').

    where("pr.title = ''Programming Ruby 1.9''")

    joins("as inner join products as pr on li.product_id = pr.id")

    ```'
