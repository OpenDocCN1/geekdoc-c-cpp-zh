    # The Customer Is Never Satisfied


    We''re feeling pretty pleased with ourselves. We changed a handful of lines of
    code, and our boring old Web 1.0 application now sports Web 2.0 Ajax speed stripes.
    We breathlessly call the client to come over look. Without saying anything, we
    proudly press Add to Cart and look at her, eager for the praise we know. Inside,
