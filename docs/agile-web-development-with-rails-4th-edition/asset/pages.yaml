  md: 'By relying on convention and starting with sensible defaults. Active Record
    minimizes the amount of configuration that developers perform. To illustrate this,
    here''s a program that uses Active Record to wrap our orders table:


    ```

    require ''active_record''

    ```


    ```

    class Order < ActiveRecord::Base

    end


    order = Order.find(1)

    order.pay_type = "Purchase order"

    save

    ```


    This code uses the new Order class to fetch the order with an id of 1 and modify
    the pay_type. (We omitted the code that creates a database connection for now.)
    Active Record relieves us of the hassles of dealing with the underlying database,
    leaving us free to work on business logic.


    But Active Record does more than that. As you''ll see when we develop our shopping
    cart application, starting on page 74, Active Record integrates seamlessly with
    the rest of the Rails framework. If a web form sends the data to a business object,
    Active Record can extract it into our model. Active Record supports sophisticated
    validation of model data, and if the form fails validations, the Rails views can
    extract and format errors.


    Active Record is the solid foundation of the Rails MVC architecture.


    # 3.3 Action Pack: The View and Controller


    When you think about it, the view and controller parts of MVC are pretty intimate.
    The controller supplies data to the view, and the controller receives events from
    the pages generated by the views. Because of these interactions, support for views
    and controllers in Rails is bundled into a single component, Action Pack.


    Don''t be fooled into thinking that your application''s view code and controller
    code will be bundled up just because Action Pack is a single component. Quite
    the contrary; Rails gives you the separation to write web applications with clearly
    demarcated code for control and presentation logic.


    # View Support


    In Rails, the view is responsible for creating either all or part of a response
    to be displayed in a browser, processed by an application or sent as an email.
    At its simplest, a view is a chunk of HTML that displays fixed text. More typically
    you''ll want to include dynamic content created by the action method in the controller.'
