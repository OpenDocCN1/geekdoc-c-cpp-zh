    We will start with a brief survey of some of the most important of these, and
    along the way they can be made available to your application.


    # Core Extensions (core-ex)


    Active Support extends some of Ruby''s built-in classes in interesting, useful,
    and sometimes whimsical ways. In this section, we''ll quickly list the most popular
    of these core extensions.


    +   *Array*: second, third, fourth, fifth and forty-two. These complement the
    first and last methods provided by Ruby itself.

    * *CGI*: escape_skipping_slashes. As the name implies, it differs from escape
    in that it doesn''t escape slashes.

    * *Class*: access for class attributes, inherited readers and writers, and descendants
    (a.k.a., subclasses). These methods are too numerous to enumerate, see the documentation
    for details.

    * *Date*: yesterday, future?, next_month, and many. more.

    * *Enumerable*: group_by, sum, each_with_object, index_by, many?, and exclude?

    * *File*: atomic_write, and path.

    * *Float*: adds an optional precision argument to round.

    * *Hash*: diff, deep_merge, except, stringify_keys, symbolize_keys, reverse_merge,
    and slice. Many of these methods have variants ending in an exclamation.

    * *Integer*: ordinal, multiple_of?, months, years. See also Numeric below.

    * *Kernel*: debugger, breakpoint, silence_warnings, enable_warnings.

    * *Module*: accessors for module attributes, aliasing support, delegation, deprecation,
    readers and writers, synchronization, and parent-age.

    * *Numeric*: bytes, kilobytes, megabytes, etc.; minutes, hours, etc.:

    * *Object*: blank?, present?, duplicate?, instance_values, instance_variable_names,
    returning, and try.

    * *String*: exclude?, pluralize, singularize, camelize, underline, underscore,
    dasherize, demodulate, parameterize, tableize, classify, humanize, foreign_key,
    constantize, squish, mb_chars, at?, from, to, first, last, to_time, to_date, and
    try.'
