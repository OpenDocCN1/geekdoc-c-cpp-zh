    bundle will use the Gemfile.lock as a starting point, and install only the versions
    of the various gems as specified in this file. For this reason, it is important
    that this file gets checked into your version control system, as this will ensure
    that your colleagues and deployment targets will all be using the exact same configuration.


    bundle update (unsurprisingly) update one or more named gems, and will update
    the Gemfile.lock accordingly. If you want to use a specific version of particular
    gem the workflow will be to edit the Gemfile to express your constraints, and
    then run bundle update listing the gems that you want to update. If you don''t
    specify a list of gems, Bundler will attempt to update all gems—this is generally
    not recommended, particular when to deployment.


    Bundler also has a runtime component which is used to ensure that your application
    strictly loads the versions of the Gems listed in Gemfile.lock. We will explore
    further by looking into how the server operates.


    # 25.4 Interfacing with the web server with Rack


    Rails runs your application in the context of a web server. So far, we have used
    two separate web servers: WeBrick, which comes built into the Ruby language itself;
    and Phusion Passanger, which integrates with the Apache http web server. There
    are a number of other choices available, including Mongrel, Lightpd, and Unicorn.


    Based on this, you might come to the conclusion that Rails has code that allows
    it to plug into each of these web servers. In earlier releases of Rails, this
    was true, as of Rails 2.3 this delegation was delegated to a name Rack.


    So, Rails integrates with Rack, and Rack integrates with (for example) Passenger,
    and Passanger integrates with Apache http.


    While generally this is invisible, and taken care of for when you run the command
    rails server, a file named config.ru is provided which allows you to directly
    start your application under Rack:


    ```

    Download depot_u/config.ru

    ```


    # This file is used by Rack-based servers to start the application.'
