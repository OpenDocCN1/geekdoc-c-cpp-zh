    #  Chapter 9


    # # Task D: Cart Creation


    Now that we have the ability to display a catalog containing all our wonderful
    products, it would be nice to be able to sell them. Our customer agrees, so we''ve
    jointly decided to implement the shopping cart functionality next. This is going
    to involve a number of new concepts, including sessions, relationships between
    models, and adding a button to the view, so let''s get started.


    # ## 9.1 Iteration D1: Finding a Cart


    As users browse our online catalog, they will (we hope) select products to buy.
    The convention is that each item selected will be added to a virtual shopping
    cart, held in our store. At some point, our buyers will have everything they need
    and will proceed to our site''s checkout, where they''ll pay for the stuff in
    the carts.


    This means that our application will need to keep track of all the items added
    by the buyer. To do that we will keep a cart in the database and store its unique
    identifier, `cart_id`, in the session. Every time a request comes in, we can recover
    the identity from the session and use it to find the cart in the database.


