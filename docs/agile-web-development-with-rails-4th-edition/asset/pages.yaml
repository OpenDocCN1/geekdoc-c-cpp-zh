    # What We Just Did


    It has been a busy, productive day so far. We''ve added a shopping cart to our
    store, and along the way we''ve dipped our toes into some Rails features:


    +   - We created a Cart object in one request and were able to successfully locate
    the same Cart in subsequent requests using a session object,

    - we added a private method in the base class for all of our controllers, making
    it accessible to all of our controllers.

    - we created relationships between Carts and Line Items, relationships between
    Line Items and Products, and were able to navigate using these relationships,
    and

    - we added a button which caused a product to be POSTed to a cart, causing a new
    Lineitem to be created.


    # Playtime


    Here''s some stuff to try on your own:


    +   - Change the action so that clicking a book''s image will also invoke the
    `create` action. The first parameter to `link_to` is placed in the generated `<a>`
    call and the Rails helper `image_tag` constructs an HTML `<img>` tag. Include
    a call to it as the first parameter to a `link_to`. Be sure to include `:method=>post`
    in your `html_options` on your call to `link_to`.

    - Add a new variable to the session to record how many times the user has accessed
    the store controller''s `index` action. The first time this page is accessed your
    count won''t be in the session. You can test for this with code like:

    ```

    if session[:counter].nil?

    ```

    - If the session variable isn''t there, you''ll need to initialize it. Then you''ll
    be able to increment it.

    - Pass this counter to your template, and display it at the top of the catalog
    page. Hint: the `pluralize` helper (described on page 358) might be useful when
    formatting the message you display.

    - Reset the counter to zero whenever the user adds something to the cart.

    - Change the template to display the counter only if it is greater than five.

    - (You''ll find more at http://pragprog.com/wikis/wiki/RailsPlayTime).'
