  md: '# # Testing and Security on Rails


    # # The RSpec Book


    RSpec, Ruby''s leading Behaviour Driven Development tool, helps you do TDD right
    by embracing the design and documentation aspects of TDD. It encourages readable,
    maintainable suites of code examples that not only test your code, document it
    as well. The RSpec Book will teach you how to use RSpec, Cucumber, and other Ruby
    tools to develop truly agile software that gets you to market quickly and maintains
    its value as evolving market trends drive


    The RSpec Book: Behaviour Driven Development with RSpec, Cucumber, and Friends

    David Cheminsky, Dave Astels, Zach Ennis, Aslan Hellesay, Bryan Helkamp, Dan North

    (450 pages) isbn: 978-1-9343563-7-1, $42.95

    http://prprog.com/titles/achrba


    ![](img/79be11dd96f63a00f9795e2dfe232ef5_467_0.png)


    # # Security on Rails


    Security on Rails provides you with the tools and techniques to defend your Rails
    applications against attackers. With this book, you can conquer the bad guys who
    are trying to exploit your application. You''ll see the very techniques that hackers
    use, and then journey through this full-fledged guide for writing secure Rails
    applications.


    Security on Rails

    Ben Poweski and David Raphael

    (304 pages) ISBN: 978-19343564-8-7, $34.95

    http://prprog.com/titles/fr-secure


    ![](img/79be11dd96f63a00f9795e2dfe232ef5_467_1.png)'
  merge: -1
