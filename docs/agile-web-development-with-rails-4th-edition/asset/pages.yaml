- img_proc: true
  md: "```\nnumber:\ncurrency:\nformat: \"$US\nunit:\nprecision: 2\nseparator: \"\
    ,\"\ndelimiter: \",\"\nformat: \"%n&nbsp;%u\"\n```\n\nWe specified the unit, precision,\
    \ separator, and delimiter for number.currency.format. That is much pretty self-explanatory.\
    \ The format is a bit more involved: %n is a placeholder for the number itself;\
