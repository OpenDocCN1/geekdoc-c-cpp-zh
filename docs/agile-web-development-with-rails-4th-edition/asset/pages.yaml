    # Test Fixtures


    In the world of testing, a fixture is an environment in which you can run a test.
    If you''re testing a circuit board, for example, you might mount it in a test
    fixture that provides it with the power and inputs needed to drive the function
    to be tested.


    In the world of Rails, a test fixture is simply a specification of the initial
    contents of a model (or models) under test. If, we want to ensure that our products
    start off with known data at the start of every unit test, we specify those contents
    in a fixture, and Rails will take care of the rest.


    You specify fixture data in files in the test/fixtures directory. These files
    contain test data in either comma-separated (CSV) or YAML format. For our tests,
    we use YAML, the preferred format. Each fixture contains the data for a single
    model. The name of the fixture file must match the name of a database table. Because
    we need some data for a Product model, which is stored in the products table,
    we''ll add it to the file products.yml. Rails already created this fixture when
    we first created the model:


    ```

    Download depot_b/test/fixtures/products.yml

    # Read about fixtures at http://api.rubyonrails.org/classes/Fixtures.html

    ```'
