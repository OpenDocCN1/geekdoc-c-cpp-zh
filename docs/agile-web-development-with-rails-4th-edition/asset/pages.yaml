- img_proc: true
  md: 'Developers are worried about deployment, too. They found that Rails you can
    deploy successive releases of your application to any number of servers with a
    single command (and roll them back equally easily should the release prove to
    be somewhat less than perfect).


    Rails was extracted from a real-world, commercial application. It turns out the
    best way to create a framework is to find the central themes in a specific application
    and then bottle them up in a generic function of code. When you''re developing
    your Rails application, you''re starting with half of a really good application
    in place.


    But there''s something else to Rails—something that''s hard to describe. Of course,
    you''ll have to take our word for until you write Rails applications for yourself
    (which should be in the next 45 minutes or so...). That''s what this book is all
    about.


    # Rails Is Agile


    The title of this book is Agile Web Development with Rails. You may be surprised
    to discover that we don''t have explicit sections on applying agile practices
    X, Y, and Z to Rails coding.


    The reason is so simple: Agility is the fabric of Rails.


    Let''s look at the values expressed in the Agile Manifesto as a set of four preferences¹


    +   - Individuals and interactions over processes and tools

    - Working software over comprehensive documentation

    - Customer collaboration over contract negotiation

    - Responding to change over following a plan


    Rails is all about individuals and interactions. There are no heavy toolsets,
    no complex configurations, and no elaborate processes. There are just small groups
    of developers, their favorite editors, and chunks of Ruby code. This leads to
    transparency; what the developers do is reflected immediately in what the customer
    sees. It''s an intrinsically interactive process.


    Rails doesn''t denounce documentation. Rails makes trivially easy to create HTML
    documentation for your entire codebase. But the Rails development process isn''t
    driven by documents. You won''t find 500-page specifications at the heart of a
    Rails project. Instead, you''ll find a group of developers jointly exploring their
    need and the possible ways of answering that need. You''ll find solutions that
    change as both the developers and the users become more experienced with the problems
    they''re trying to solve.


    +   1. http://agilemanifesto.org/. Dave Thomas was one of the authors of this
    document.'
