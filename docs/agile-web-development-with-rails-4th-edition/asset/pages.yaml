  md: "# Joe Asks...\nWhere's the Credit-Card Processing?\n\nIn the real world, we'd\
    \ probably want our application to handle the commercial side of checkout. We\
    \ might even want to integrate credit-card processing-however, integrating with\
    \ back-payment-processing systems requires a fair amount of paperwork and jumping\
    \ through hoops. And this would distract us looking from Rails, so we're going\
    \ to punt on this particular detail for the moment.\n\nWe will come back to this\
    \ in Section 26.1, Credit Card Processing with Active Merchant, on page 431 where\
    \ we will explore a plugin that can help us with this function.\n\n```\n-- AddOrderIdToLineItem:\
    \ migrated (0.0009s) ==========================\n```\n\nThe database did not have\
    \ entries for these two migrations in the schema_migrations table, the db:migrate\
    \ task asked both migrations to the database. We, of course, have applied them\
    \ separately by running the migration task after creating the individual migrations.\n\
    \n# Creating the Order Capture Form\n\nNow that we have our tables and models\
    \ as we need them, we can start the checkout process. First, we need to add a\
    \ Checkout button to the shopping cart. As it will create a new order, we'll link\
    \ it back to a new action in our order controller:\n\n```\nDownload depot_p/app/views/carts/cart.html.erb\n\
    <div class=\"cart_title\">Your Cart</div>\n<table>\n  <%= render(cart.total_line)\
    \ %>\n  <tr class=\"total_line\">\n    <td colspan=\"2\">Total</td></td>\n   \
    \ <td class=\"total_cell\"><%= number_to_currency(cart.total_price) %></td>\n\
    \  </tr>\n</table>\n<%= button_to \"Checkout\", new_order_path, :method => :get\
    \ %>\n<%= button_to \"Empty cart\", cart, :method => :delete, \n:confirm => \"\
    Are you sure?\" %>\n```\n\nThe first thing we want to check is if there is something\
    \ in the cart. If there is nothing, we redirect the user back to the store-front,\
    \ provide a notice of what we did, and return immediately. This prevents"
