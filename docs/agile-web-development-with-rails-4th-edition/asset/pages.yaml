  md: "# Iteration A1: Creating the PRODUCTS MAINTENANCE APPLICATION\n\n```\ninvoke\
    \ scaffold_controller\ncreate app/controllers/products_controller.rb\ninv erb\n\
    create app/views/products\ncreate app/views/products/index.html.erb\ncreate app/views/products/edit.html.erb\n\
    create app/views/products/show.html.erb\ncreate app/views/products/new.html.erb\n\
    create app/views/products/_form.html.erb\ninvoke test_unit\ncreate test/functional/products_controller_test.rb\n\
    inv helper\ncreate app/helpers/products_helper.rb\ninv test_unit\ncreate test/unit/helpers/products_helper_test.rb\n\
    inv stylesheets\ncreate public/stylesheets/scaffold.css\n```\n\nThe generator\
    \ creates a bunch of files. The one we're interested in is first the migration\
    \ one, name 2011021100001_create_products.rb.\n\nA migration represents a change\
    \ we want to make to the data, expressed in a source file in database-independent\
    \ terms. These changes can update both the database schema and the data in the\
    \ database tables. We apply migrations to update our database, and we can undo\
    \ them to roll our database back. We have a whole section on migrations starting\
    \ on page 386. For now, we'll just use them without too much more.\n\nThe migration\
    \ has a UTC-based timestamp prefix (20110211000001, name (create_products)), and\
    \ a file extension (.rb, because it's a Ruby program).\n\nThe timestamp prefix\
    \ you will see will be different. In fact, the timestamps used in this book are\
    \ clearly fictitious. Typically the timestamps will not be consecutive, instead\
    \ they will reflect the time the migration was created.\n\n# Applying the Migration\n\
    \nWhile we have already told Rails about the basic data types of each property,\
    \ let's go ahead and refine the definition of the property to have eight digits\
    \ of significance, and these two digits after the decimal point.\n\n```\nDownload\
    \ depot_at/db/migrate/20110211000001_create_products.rb\nclass CreateProducts\
    \ < ActiveRecord::Migration\n  def self.up\n    create_table :products do |t|\n\
    \      t.string :title\n      t.text :description\n      t.string :image_url\n\
    \      t.decimal :price, :precision => 8, :scale => 2\n      t.timestamps\n  \
    \  end\n  end\nend\n```"
