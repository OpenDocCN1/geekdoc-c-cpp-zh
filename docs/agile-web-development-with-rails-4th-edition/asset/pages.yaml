  md: 'Looking at this page, we spot a minor problem with how prices are displayed.
    The database stores the price as a number, but we would like to show it as dollars
    and cents. A price of 12.34 should be shown as $12.34, and 13 should be displayed
    as $13.00. We''ll tackle that next.


    # 8.3 Iteration C3: Using a Helper to Format the Price


    Ruby uses a sprintf function which can be used to format prices. We could place
    logic which makes of this function directly in the view. For example, we could
    say this:


    ```

    <span class="price">%= sprintf("$0.02f", product.price) %></span>

    ```


    This work, but it embeds knowledge of currency formatting into the view. We should
    need to internationalize the application layer, this would be a maintenance problem.


    Instead, let''s use a helper method to format the price as a currency. Rails has
    an appropriate one built in—it''s called number_to_currency.


    Using our helper in the view is simple: in the index template, we change this:


    ```

    <span class="price">%= product.price %></span>

    ```


    to the:


    ```

    <span class="price">%= number_to_currency(product.price) %></span>

    ```


    Sure enough, when we Refresh, we see a nicely formatted price:


    ![](img/79be11dd96f63a00f9795e2dfe232ef5_115_0.png)


    While it looks nice enough, we are starting to get a nagging feeling that we really
    should be running and writing tests for all this functionality. Particularly after
    our experience after adding logic to our model.


