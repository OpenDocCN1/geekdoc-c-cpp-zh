  md: "# Marshaling Objects\n\nRuby can take an object and convert it into a stream\
    \ of bytes that can be stored outside the application. This process is called\
    \ marshaling. This saved object can later later by another instance of the application\
    \ (or by a totally separate application), and a copy of the originally saved object\
    \ can be reconstituted.\n\nThere are two potential issues when you use marshaling.\
    \ Some objects cannot be dumped. If the objects you dumped include bindings, procedure\
    \ or method objects, instances of class IO, singleton objects, or if you try to\
    \ dump anonymous classes or modules, a τρέΕгоρ will be raised.\n\nSecond, when\
    \ you load a marshaled object, Ruby needs to know the definition of the class\
    \ of that object (and of all the objects it contains).\n\nRails uses marshaling\
    \ to store session data. If you rely on Rails that a particular class may not\
    \ have been defined at the point it reconstitutes session data. For that reason,\
    \ you'll use the model declaration in your controller to list all models that\
    \ are marshaled. This preemptively loads the necessary classes to make marshaling\
    \ work.\n\nNow that you have the Ruby basics down, let's give what we have learned\
    \ a slightly larger, annotated example that pulls together a number of concepts.\
    \ We'll follow that with a walkthrough of special features that will help you\
    \ with your Rails coding.\n\n# Pulling It All Together\n\nLet's look at an example\
    \ of how Rails applies a number of Ruby features to make the code you need to\
    \ maintain more declarative. You will see this example in Section 6.1, Generating\
    \ the Scaffold, on page 82. For now, we will focus on the Ruby language aspects\
    \ of the example.\n\n```\nclass CreateProducts < ActiveRecord::Migration\n  def\
    \ up\n    create_table :products do |t|\n      t.string :title\n      t.text :description\n\
    \      t.string :image_url\n      t.decimal :price, :precision => 8, :scale =>\
    \ 2\n\n      t.timestamps\n    end\n  end\n\n  def self.down\n    drop_table :products\n\
    \  end\n```"
