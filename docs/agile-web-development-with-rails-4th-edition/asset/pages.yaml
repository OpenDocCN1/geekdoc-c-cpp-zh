  md: '+   - We wrote a test which verifies not only the creation of a line item but
    the content of the response that is returned from such a request.


    The key point to take away is the incremental style of Ajax development. Start
    with a conventional application, then add Ajax features, one by one. Ajax can
    be hard to debug: by adding it slowly to an application, it makes it easier to
    track down what changed if your application stops working. And as we saw, starting
    with a conventional application makes it easier to support both Ajax and non-Ajax
    behavior in the same codebase.


    Finally, we''ll give you a couple of hints. First, if you plan to do lot of Ajax
    development, you''ll probably need to get familiar with your browser''s-Script
    debugging facilities and with its DOM inspectors, such as Firefox''s Debug, Internet
    Explorer 8''s Developer Tools, Google Chrome''s Developer Tools, Safari''s Web
    Inspector, or Opera''s Dragindi. And, the NoScript-plugin in Firefox makes checking
    JavaScript/no JavaScript a one-click breeze. Others find it useful to run two
    different browsers when they are developing—have Ajax enabled in one, disabled
    in the other. Then, as new features are added, poking it with both browsers will
    make your application works regardless of the state of JavaScript.


    # Playtime


    Here''s some to try on your own:


    +   - In Section 9.3, Playtime, on page 129, one of the activities was to make
    clicking the image add the item to the cart. Change this to use:remote==true and
    image_submit_tag.


    +   - The cart is currently hidden when the user enters it by redrawing the entire
    catalog. Can you change the application to use the Script.aculo.blind_up effect
    instead?


