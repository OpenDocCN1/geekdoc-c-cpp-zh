  md: "# balance = 200\n\nHowever, there's a trap waiting for you here. The transaction\
    \ protected the database from becoming inconsistent, but what about our model\
    \ objects? To see what happened to them, we have to arrange to intercept the exception\
    \ to allow the program to continue running:\n\n```\npeter = Account.create(:balance\
    \ => 100, :number => \"12345\")\npaul = Account.create(:balance => 200, :number\
    \ => \"54321\")\n```\n\n```\nbegin\n  Account.transaction do\n    paul.deposit(350)\n\
    \    peter.withdraw(350)\n  end\nrescue\n  puts \"Transfer aborted\"\n  puts \"\
    Paul has #{paul.balance}\"\n  puts \"Peter has #{peter.balance}\"\n```\n\nWhat\
    \ we see is a little surprising:\n\nTransfer aborted\nPaul has 550.0\nPeter has\
    \ -250.0\n\nAlthough the database was left unscathed, our model objects were updated.\
    \ This is because Active Record wasn't keeping track of the before and after states\
    \ of the various objects—in fact it couldn't, because it had no way of knowing\
    \ which models were involved in the transactions.\n\n# Built-in Transactions\n\
    \nWhen we discussed parent and child tables in Section 19.2, Specifying Relationships\
    \ in Models, on page 283, we said that Active Record takes care of saving all\
    \ the dependent child rows when you save a parent row. This means multiple SQL\
    \ statement executions (one for the parent and one for each any changed or new\
    \ children). Clearly, this change should be atomic, but until now we haven't been\
    \ using transactions when saving these interrelated objects. Have we been negligent?\n\
    \nFortunately, Active Record is smart enough to wrap all the updates and inserts\
    \ related to a particular save (and also the deletes related to destroy) in a\
    \ transaction; either they all succeed or no data is written permanently to the\
    \ database. You need explicit transactions when you manage multiple SQL statements\
    \ yourself."
