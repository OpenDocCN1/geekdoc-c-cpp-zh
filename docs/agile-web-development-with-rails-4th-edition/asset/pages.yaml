  md: "The change is pretty simple: at the end of the create action, we simply redirect\
    \ the browser back to the index:\n\n```\ndef create\n  @cart = current_cart\n\
    \  product = Product.find(params[:product_id])\n  @line_item = @cart.add_product(product.id)\n\
    \n  respond_to do |format|\n    if @line_item.save\n      format.html { redirect_to(@store_url)\
    \ }\n      format.xml { render xml => @line_item, status: :created, location =>\
    \ @line_item }\n    else\n      format.html { render action => \"new\" }\n   \
    \   format.xml { render xml => @line_item.errors, status: :unprocessable_entity\
    \ }\n    end\n  end\n```\n\nNow, we have a store with a cart in the sidebar. When\
    \ we click to add an item to the cart, the page is redisplayed with an updated\
    \ cart. However, if our catalog is large, redisplay might take a while. It uses\
    \ bandwidth, and it uses server resources. Fortunately, we can use Ajax to make\
    \ this better.\n\n# 11.2 Iteration F2: Creating an Ajax-Based Cart\n\nAjax lets\
    \ us write code that runs in the browser with server-based application. In our\
