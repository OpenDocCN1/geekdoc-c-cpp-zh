  md: "# Primary Keys\n\nRails assumes that every table has a numeric primary key\
    \ (normally called id).\nRails ensures the value of this column is unique for\
    \ each new row added to the table.\n\nWe'll rephrase that.\n\nRails really doesn't\
    \ work too well unless each table has a numeric primary key. It is less fussy\
    \ about the name of the column. So, for your average Rails application, our strong\
    \ advice is to go with the flow and let Rails have its id column.\n\nIf you decide\
    \ to be adventurous, you can start by using a different name for the primary key\
    \ column (keeping it as an incrementing integer). You do this by specifying a\
    \ :primary_key option on the create_table block:\n\n```\ncreate_table :tickets,\
    \ :primary_key => :number do |t|\n  t.text :description\n  t.timestamps\nend\n\
    ```\n\nThis adds the number column to the table and sets it up as the primary\
    \ key:\n\n```\n$ sqlite3 db/development.sqlite3 \"schema tickets\"\nCREATE TABLE\
    \ tickets (\"number\") INTEGER PRIMARY KEY AUTOINCREMENT\nNOT NULL, \"description\"\
    \ text DEFAULT NULL, \"created_at\" datetime\nDEFAULT NULL, \"updated_at\" datetime\
    \ DEFAULT NULL;\n```\n\nThe next step in the adventure might be to create a primary\
    \ key that isn't an integer. Here's a catch that the Rails developers don't think\
    \ this is a good idea: migrations don't let you do this (at least not directly).\n\
    \n# Tables with No Primary Key\n\nSometimes we need to define a table that has\
    \ no primary key. The most common case in Rails is for join tables—tables with\
    \ two columns where each column is a foreign key to another table. To create a\
    \ table using migrations, we have to tell Rails not to automatically add an id\
    \ column:\n\n```\ncreate_table :authors_books, :id => false do |t|\n  t.integer\
    \ :author_id, :null => false\n  t.integer :book_id, :null => false\nend\n```\n\
    \nIn this case, you might investigate creating one or more indices on this table\
    \ to speed navigation between books and authors.\n\n# 23.4 Advanced Migrations\n\
    \nMost Rails developers use the basic facilities of migrations to maintain their\
    \ database schema. However, ever now and then it's useful to push"
  merge: -1
  pgno: 396
- img_proc: true
  md: "migrations just a bit further. This section covers some more advanced migra\
    \ tion usage.\n\n# Using Native SQL\n\nMigrations give you a database-independent\
    \ way of maintaining your application's schema. However, if migrations don't contain\
    \ the methods you need to be able to do what you need to do, you'll need to drop\
    \ down to database-specific code. Rails provides two ways to do this: one with\
    \ options arguments to methods like `add_column`. The second is the execute method.\n\
    \nA common example in our migrations is the addition of foreign key constraints\
    \ to a child table.\n\nWhen you use options or execute, you might well be tying\
    \ your migration to a specific database engine, because any SQL you provide in\
    \ these two locations uses your database's native syntax.\n\nAn optional second\
    \ parameter to the execute method specifies a string which will be prepended to\
    \ log messages produced during the execution of this SQL.\n\n# Extending Migrations\n\
    \nIf you look at the line item migration in the preceding section, you might wonder\
    \ about the duplication between the two option parameters. It would be nice to\
    \ abstract the creation of foreign key constraints into a helper method.\n\nWe\
    \ could do this by adding a method such as the following to your migration source\
    \ file:\n\n```\ndef self.foreign_key(from_table, column, to_table)\nconstraint_name\
    \ = \"fk#{from_table}_#{to_table}\",\n```\n\n```\nexecute %\n  CREATE TRIGGER\
