  md: '# Redesign Your Career


    # The Passionate Programmer


    This book is about creating a remarkable career in software development. Remarkable
    careers don''t come by chance. They require thought, intention, action, and a
    willingness to chase control when you''ve made mistakes. Most of us have stumbling
    letting our careers take where they may. It''s time to take control.


    This revised and updated edition lays out a strategy for planning and creating
    a radically successful life in software was released as My Job Went to India:
    52 Ways To Save Your Job.


    The Passionate Programmer: Creating a Remarkable Career in Software Development


    Chad Fowler

    (232 pages) ISBN: 978-1934356-34-0, $823.95

    http://prog.com/titles/cfcar2


    ![](img/79be11dd96f63a00f9795e2dfe232ef5_470_0.png)


    # Pragmatic Thinking and Learning


    Software development happens in your head. Not in an editor, IDE, or design tool.
    In this book by Pragmatic Programmer Andy Hunt, you will learn how our brains
    are wired, and how to take advantage of your brain''s architecture. You''ll master
    new tricks and tips to learn faster, and retain more of what you learn.


    +   * Use the Dreyfus Model of Skill Acquisition to become more expert

    * Leverage the architecture of the brain to strengthen thinking modes

    * Avoid common "known bugs" in your mind

    * Learn more deliberately and more effectively

    * Manage knowledge more efficiently


    Pragmatic Thinking and Learning:

    Refactor Your Wet


    Andy Hunt

    (288 pages) ISBN: 978-1934356-5-0, $84.95

    http://prog.com/titles/ahptf


    ![](img/79be11dd96f63a00f9795e2dfe232ef5_470_1.png)'
