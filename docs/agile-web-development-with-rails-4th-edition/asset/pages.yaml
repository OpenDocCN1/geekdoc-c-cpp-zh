  md: "# David Says...\n\n# Battle of the routes: product_path vs product_url\n\n\
    It can seem hard in the beginning to know when to use product_path and when to\
    \ use product_url when you want to link or redirect to a given route. In reality,\
    \ it's quite simple, though.\n\nWhen you use product_url, you'll get the full\
    \ enchilada with protocol and domain name, like http://example.com/products/1.\
    \ That's the thing to use when you're redirecting to because the HTTP spec requires\
    \ a fully qualified URL when doing 302 Redirect and friends. You also need the\
    \ full URL if you're reclaiming from one domain to another, ala product_url(domain=>\
    \ \"example2.com\", :product=> product).\n\nThe rest of the time, you can happily\
    \ use product_path. This will only generate the /products/1 and that's all you\
    \ need when linking or pointing forms. Like link_to=\"My product\", product_path(product).\n\
    \nNow the continuing part is that the two are interchangeable because of lenient\
    \ browsers. You can do a redirect_to with a product_path and it'll probably work,\
    \ but it won't be valid according to spec. And you can link_to a product_url,\
    \ but then you're littering your HTML with needless characters and that's a bad\
    \ idea too.\n\nNow when we view our cart and click the Empty Cart button, we get\
    \ back to the catalog page, and a nice little message says this:\n\n![](img/79be11dd96f63a00f9795e2dfe232ef5_138_0.png)\n\
