  md: "(or the default template named after the action if you don't explicitly render\
    \ anything). Rails also tries to find and render a layout template (we'll talk\
    \ about how it finds the layout in a second). If it finds the layout, it inserts\
    \ the action-specific output into the HTML produced by the layout.\n\nLet's look\
    \ at a layout template:\n\n```\n<html>\n<head>\n  <title>Form: <%= controller.action_name\
    \ %></title>\n  <%%= stylesheet_link_tag 'scaffold' %>\n</head>\n<body>\n  <%=\
    \ yield :layout %>\n</body>\n</html>\n```\n\nThe layout sets up a standard HTML\
    \ page, with the head and body sections. It uses the current action name as the\
    \ page title and includes a CSS file. In the body, there's a call to yield. This\
    \ is where the magic takes place. When the template for the action was rendered,\
    \ Rails stored its content, labeling it :layout. Inside the layout template, calling\
    \ yield retrieves this text. In fact, :layout is the default content returned\
    \ when rendering, so you can write yield instead of yield layout. We personally\
    \ prefer the slightly more explicit version.\n\nIf the my_action.erb template\
    \ contained this:\n\n```\n<html>\n<head>\n  <title>Form: my_action</title>\n \
    \ <link href=\"stylesheets/scaffold.css\" media=\"screen\" rel=\"Stylesheet\"\
    \ type=\"text/css\" />\n</head>\n<body>\n  <h1>Hello, World!</h1>\n</body>\n</html>\n\
    ```\n\nthe browser will show the following:\n\n```\n<html>\n<head>\n  <title>Form:\
    \ my_action</title>\n  <link href=\"stylesheets/scaffold.css\" media=\"screen\"\
    \ rel=\"Stylesheet\" type=\"text/css\" />\n</head>\n<body>\n  <h1>Hello, World!</h1>\n\
    </body>\n</html>\n```\n\n# Locating Layout Files\n\nAs you've probably come to\
    \ expect, Rails does a good job of providing defaults for layout file locations,\
    \ but you can override the defaults if you need something different."
