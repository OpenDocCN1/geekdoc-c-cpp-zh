  md: "# Joe Asks...\nAren't You Duplicating Orders?\n\nJoe is concerned to see our\
    \ controller creating Order model objects in two actions: new and create. He's\
    \ wondering why this doesn't lead to duplicate orders in the database.\n\nThe\
    \ answer is simple: the checkout action creates an Order object in memory to simplify\
    \ the template code something to work. Once the response is sent to the browser,\
    \ particular object gets abandoned, and it will eventually be reaped by Ruby's\
    \ garbage collector. It never gets close to the database.\n\nThe create action\
    \ also creates an Order object, populating it from the form fields. This object\
    \ does saved in the database.\n\nSo, model objects perform two roles: they map\
    \ data into and out of the database, but they are also regular objects that hold\
    \ business data. They affect the database only when you tell them, typically by\
    \ calling saving.\n\n```\n@order = Order.new(params[:order])\norder.add_line_items_from_cart(current_cart)\n\
    \nrespond_to do |format|\n  if order.save\n    Cart.destroy(session[:cart_id])\n\
    \    session[:cart_id] = nil\n    format.html { redirect_to(store_url, :notice\
    \ =>\n      'Thank you for your order.') }\n    format.xml { render => @order,\
    \ :status => :created,\n      :location => @order }\n  else\n    format.html {\
    \ render :action => \"new\" }\n    format.xml { render :xml => @order.errors,\n\
    \      :status => :unprocessable_entity }\n  end\nend\n```\n\nWe start by creating\
    \ a new Order object and initialize it from the form data. In this case, we want\
    \ all the form data related to order objects, so we select the :order hash from\
    \ the parameters (this is the name we passed as the first parameter to form_for).\
    \ The next line adds into the order items that are already stored in the cart—we'll\
    \ write the actual method to do this in a minute.\n\nNext we tell the order to\
    \ save itself (and its children, the line items) to the database. the order object\
    \ will perform validation (but)"
  merge: -1
