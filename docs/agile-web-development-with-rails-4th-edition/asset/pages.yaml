  md: '# Editors


    We write our Rails programs using a programmer''s editor. We''ve found over the
    years that different editors work best with different languages and environments.
    Dave originally wrote this chapter using Emacs, because he thinks that its Fillad
    mode is unsurpassed when it comes to nearly formatting XML as types. Sam updated
    the chapter using Vim. But many think that neither Emacs nor Vim is ideal for
    Rails development and prefer to use TextMate. Although the choice of editor is
    a personal one, here are some suggestions of features to look for in a Rails editor:


    +   - Support for syntax highlighting of Ruby and HTML. Ideally support for .erb
    files (a Rails file format that embeds Ruby snippets within HTML).

    - Support of automatic indentation and reindentation of Ruby source. This is more
    than an aesthetic feature: having an editor indent your program as you type is
    the best way of spotting bad nesting in your code. Being able to indent is important
    when you refactor your code and move stuff (TextMate''s ability to reindent when
    it pastes code from the clipboard is very convenient).

    - Support for insertion of Ruby and Rails constructs. You''ll be writing lots
    of short methods, and if the IDE creates method skeletons with a keystroke or
    two, you can concentrate on the interesting stuff inside.

    - Good file navigation. As you''ll see, Rails applications are spread across many
    files: a newly created Rails application enters the world containing forty-six
    files spread across thirty-four directories. Before you''ve written a thin...

    eed an environment that helps you navigate quickly between these. You''ll add
    a line to a controller to load up a value, switch to the view to display it, and
    then switch to the test to verify you did all right. Something like Notepad, where
    you traverse a File Open dialog box to select each file to edit, just won''t cut
    it. We prefer a combination of a tree view of files in a sidebar, small set of
    keystrokes that help us find a file (or files) in a directory tree by name, and
    built-in smarts that know how to navigate (say) from a controller action and the
    corresponding view.

    - Name completion. Names in Rails tend to be long. A nice editor will you type
    the first few characters and then suggest possible completions to the touch of
    a key.


    We hesitate to recommend specific editors because we''ve used only a few in earnest
    and we''d undoubtedly leave someone''s favorite editor off the list. Nevertheless,
    to help you get started with something other than Notepad, here are some suggestions:'
