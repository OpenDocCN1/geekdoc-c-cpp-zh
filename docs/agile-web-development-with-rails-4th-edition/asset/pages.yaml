  md: '# Joe Asks...


    Can I also receive e-mail?


    Action Mailer makes it easy to receive Rails applications that handle incoming
    e-mail. Unfortunately, you need to find a way to retrieve appropriate e-mails
    from your server environment and inject them into the application; this requires
    a bit more work.


    The easy part is handling an e-mail within your application. In your Action Mailer
    class, write an instance method called receive that takes a single parameter.
    This parameter will be a Mail::Message object corresponding to the incoming e-mail.
    You can extract fields, the body text, and/or attachments and use them in your
    application.


    All of the normal techniques for intercepting incoming e-mail end up running a
    command, passing that the content of the e-mail as standard input. If we make
    a Rails runner script that invokes whenever an e-mail arrives, we can arrange
    to pass that e-mail into our application''s e-mail handler. For example, using
    procmail-based interception, we could write a rule that looks something like the
    following. Using the arcane syntax of postfix, this rule copies any incoming e-mail
    whose subject line contains Bug Report through your runner script:


    ```

    RUBY=/opt/local/bin/ruby

    TICKET_APP_DIR=/users/ave/Work/depot

    HANDLER=`IncomingTicketHandler.receive(STDIN.read)`


    : c

    + ^Subject:.*Bug.*\| cd $TICKET_APP_DIR && $RUBY runner HANDLER

    ```


    The receive class method is available to all Action Mailer classes. It takes the
    e-mail, parses it into a Mail object, creates a new instance of the receiver''s
    class, and passes the Mail object to the receive method in that class.


