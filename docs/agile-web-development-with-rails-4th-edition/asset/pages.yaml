  md: 'Prior to running your application. Rails loads and executes config/environment.rb
    and config/application.rb. The standard environment these files set up automatically
    includes the following directories (relative to your application''s base directory)
    in your application''s load path:


    +   - The app/controllers directory and its subdirectories.

    - The app/models directory and all of its subdirectories whose names start with
    an underscore or a lowercase letter.

    - The vendor directory and the lib contained in each plugin subdirectory.

    - The directories app, app/helpers, app/mailers, app/services, config, and lib.


    Each of these directories, Rails will added to the load path only if it exists.


    In addition, Rails will load a per environment configuration file. This file lives
    in the environments directory and is where you place configuration options that
    vary depending on the environment. This is because Rails recognizes your needs,
    as a developer, are very different when writing code, testing code, and creating
    code in production. When writing code, you want lots of logging, convenient reloading
    of changed source files, in-your-face notification of errors, and so on. In testing,
    you want a system that stays in isolation so you can have repeatable results.
    In production, your system should be tuned for performance, and users should be
    kept away from errors.


    The switch that dictates the runtime environment is external to your application.
    This means that no application code needs to be changed as you move from development
    through testing to production. In Chapter 16, Task K: Deployment and Production,
    on page 241, you specified the environment on the rake command using a RAILS_ENV
    parameter, and to Fusion Passenger using a RailsEnv line in your Apache file.
    When using WebBrick with the rails command, you use the option:


    ```

    depot> rails server -e development

    depot> rails server -e test

    depot> rails server -e production

