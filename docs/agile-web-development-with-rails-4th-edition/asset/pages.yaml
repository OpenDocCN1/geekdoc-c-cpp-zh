    # Additional Active Support classes


    In addition to extending the base objects provided by Ruby. Active Support provides
    plenty of additional functionality. More so that with the core extensions, these
    classes tend to support specific needs of other Rails components, but you are
    welcome to make use of these functions directly.


    +   * BasicObject: A back-port of Ruby 1.9''s class of the same name to Ruby 1.8.


    +   * Benchmarkable: measures the execution time of a block in a template and
    records the results to the log.


    +   * Cache::Store: various implementations of caches, based on files or memory;
    with synchronized or compressed as options.


    +   * Callbacks: provide hooks into the lifecycle of an object


    +   * Concern and Dependencies: helps manage dependencies in a modular way


    +   * Configurable: provides a config Hash class variable


    +   * Deprecation: provides behavior, reporting and wrapping to support deprecation
    of methods.


    +   * Duration: additional methods such as ago and since


    +   * HashWithIndifferentAccess: allows both params[:key] and params[''key'']


    +   * I18n: internationalization support.


    +   * Inflections: handles English''s inconsistent rules for pluralization.


    +   * JSON: JavaScript Object encoding and decoding methods.


    +   * LazyLoadHooks: support for deferred initialization of modules.


    +   * Memizable: caches the result of a method call.


    +   * MessageEncryptor: encrypts values which are to be stored somewhere untrustworthy.


    +   * MessageVerifier: generate and verify signed messages (prevents tampering).


    +   * MultiByte: encoding support (primarily for Ruby 1.8.7).


    +   * Notifications: instrumentation API.'
