    - If you can connect to the command line, can you create a dummy table? (This
    tests that the database user has sufficient access rights to the database.)

    mysql> create table dummy(i int);

    mysql> drop table dummy;

    - If you can create tables from the command line but `rake db:migrate` fails,
    double-check the database.yml file. If there are socket: directives in the file,
    commenting them out by putting a hash character (#) in front of each.

    - If you see an error saying No such file or directory... and the filename in
    the error is mysql.sock, Ruby MySQL libraries can''t find your MySQL database.
