  md: '# # Going Further on Rails


    # ## Advanced Rails Recipes


    A collection of practical recipes for spicing up your web application without
    a lot of rep cleanup. You''ll learn how the pros solve the tough problems using
    the most-to-date Rails techniques (including Rails 2.0 features).


    # ### Advanced Rails Recipes


    Mike Clark

    (464 pages) ISBN: 978-0-9787392-2-5, $38.95


    http://pragprog.com/titles/frr


    ![](img/79be11dd96f63a00f9795e2dfe232ef5_466_0.png)


    # ## Enterprise Recipes with Ruby and Rails


    The 50+ recipes in this book not only show you how to integrate legacy material
    using Ruby and Ruby on Rails, but also how to create and highly functional applications
    in an enterprise environment.


    +   * Work with XML, CSV, fixed length records, and JSON

    * Use sockets, SOA, REST and SOAP * Learn about payment gateways, e-commerce,
    privacy and security

    * Automate tedious enterprise maintenance tasks


    # ### Enterprise Recipes with Ruby and Rails


    Maik Schmidt

    (425 pages) ISBN: 978-1-9343562-3-4, $38.95


    http://pragprog.com/titles/msenr


    ![](img/79be11dd96f63a00f9795e2dfe232ef5_466_1.png)'
