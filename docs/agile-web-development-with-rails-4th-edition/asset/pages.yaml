  md: "# 21.4 Uploading Files to Rails\n\nYour application may allow users to upload\
    \ files. For example, a bug-reporting system let users attach log files and code\
    \ samples to a problem ticket, or a blogging application could let users upload\
    \ a small image to appear next to their articles.\n\nIn HTTP, files are uploaded\
    \ as a `multipart/form-data` POST message. As the name suggests, forms are used\
    \ to generate this type of message. Within that, you'll use one or more `<input>`\
    \ tags with `type=\"file\"`. When rendered by a browser, this tag allows the user\
    \ to select a file by name. When the form is subsequently submitted, the file\
    \ or files will be sent along with the rest of the form data.\n\nTo illustrate\
    \ the file upload process, we will show some code that allows a user to upload\
    \ an image and display that alongside content. To do this, we first need a table\
    \ to store the data:\n\n![](img/79be11dd96f63a00f9795e2dfe232ef5_351_0.png)\n\n\
    ```\nclass CreatePictures < ActiveRecord::Migration\n  def self.up\n    create_table\
    \ :pictures do |t|\n      t.string :comment\n      t.string :name\n      t.string\
    \ :content_type\n      # If using MySQL, blobs default to 64k, so we have to give\n\
    \      # an explicit size to extend them\n      t.binary :data, :limit => 1.megabyte\n\
    \    end\n  end\n\n  def self.down\n    drop_table :pictures\n  end\nend\n```\n\
    \nWe will create a simple artificial upload controller to demonstrate the process.\
    \ The get action is pretty conventional: it simply creates a picture object and\
    \ renders a form:\n\n![](img/79be11dd96f63a00f9795e2dfe232ef5_351_1.png)\n\n```\n\
    class UploadController < ApplicationController\n  def get\n    @picture = Picture.new\n\
    \    # ...\n  end\nend\n```"
