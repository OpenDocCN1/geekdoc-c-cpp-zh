  md: "delivers these pages at the same speed that the server can deliver any other\
    \ static content.\n\nSometimes, though, our application needs to be at least involved\
    \ in handling these requests. For example, your store might display details of\
    \ certain products only to a subset of users (perhaps premium customers get earlier\
    \ access to new products). In this case, the page you display will have the same\
    \ content, but you don't want to display it to anyone—you need to filter access\
    \ to the cached content. Rails provides action caching for this purpose. With\
    \ action caching, your application is still invoked, and it's invoked before filters\
    \ are. However, the action itself is not called if there's an existing cached\
    \ page.\n\nLet's look at this in the context of a site that has public content\
    \ and premium, members-only content. We have two controllers: an admin controller\
    \ that verifies someone is a member and a content controller with actions to show\
    \ both public and premium content. The public content consists of a single page\
    \ with links to premium articles. If someone requests premium content and theyre\
    \ not a member, we redirect them to an action in the admin controller that signs\
    \ them up.\n\nIgnoring caching for a minute, we can implement the content side\
    \ of this application using a filter to verify the user's status and a couple\
    \ of methods for the two kinds of content:\n\n```\nDownload e/controllers/app/controllers/content_controller.rb\n\
    ```\n\n```\nclass ContentController < ApplicationController\n  before_filter :verify_premium_user,\
    \ :except => :public_content\n\n  def public_content\n    @articles = Article.list_public\n\
    \  end\n\n  def premium_content\n    @articles = Article.list_premium\n  end\n\
    \n  private\n\n  def verify_premium_user\n    user = session[:user_id]\n    user\
    \ = User.find(user) if user\n    unless user && user.active?\n      redirect_to:\
    \ :controller => \"login\", :action => \"signup_new\"\n  end\nend\n```"
