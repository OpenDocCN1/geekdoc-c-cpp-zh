    \ class—we put it there because that's the callback executed.\n\n# Active Record\
    \ Observers\n\nAn Active Record observer is an object that transparently links\
    \ itself into a model class, registering itself for callbacks as if it were part\
    \ of the model but without requiring any changes in the model itself. Here's our\
    \ previous logging using an observer:\n\nDownload app/observer.rb\n\n```\nclass\
    \ OrderObserver < ActiveRecord::Observer\n  def after_save(an_order)\n    an_order.logger.info(\"\
    Order #{an_order.id} created\")\n  end\nend\n```\n\nWhen ActiveRecord is subclassed,\
    \ it looks at the name of the new class, strips the word Observer from the end,\
    \ and assumes what is left is the name of the model class to be observed. In our\
    \ example, we called our observer class OrderObserver, so it automatically hooks\
    \ itself into the model.\n\nSometimes this convention breaks down. When it does,\
    \ the observer class can explicitly list the model or models it wants to observe\
    \ using the observe method:\n\nDownload app/observer.rb\n\n```\nclass AuditObserver\
    \ < ActiveRecord::Observer\n  observe Order, Payment, Refund\n  def after_save(model)\n\
    \    model.logger.info(\"[Audit] #{model.class.name} #{model.id} created\")\n\
    \  end\nend\n```\n\nBy convention, observer source files live in app/models."
