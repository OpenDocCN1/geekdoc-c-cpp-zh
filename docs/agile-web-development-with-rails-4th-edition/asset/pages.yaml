  md: '# David Says...

    Why Extending Base Classes Doesn''t Lead to the Apocalypse —


    The awe that seeing 5.months +30minutes for the first time generates usually replaced
    by a state of panic shortly thereafter. If everyone can just change how integers
    work, won''t that lead to an utterly unmaintainable spaghetti land hell? If everyone
    did that all the time, it would. But they don''t, so it doesn''t.


    Don''t think of Active Support as a collection of random extensions to the Ruby
    language that invites everyone and their brother to add their own petty feature
    to the string class. Think of it as a dialect of the first Ruby spoken universally
    by all Rails programmers. Because Active Support is a required part of Rails,
    you can always rely on the fact that 5.months will work in any Rails application.
    That negates the problem of having a thousand dialects of Ruby.


    Active Support gives us the best of both worlds when it comes to language extensions.
    It''s contextual standardization.


    +   * Time: yesterday, future?, advance, and many, many more.


    As you can see, this is a fairly long list. These methods tend to be fairly small,
    many are only a single line of code. While you will probably ever use a small
    percentage of these, all of them are available for your use in your Rails application.


    As you also see, there is a lot there. Most of you won''t ever directly use. You''ll
    quickly find yourself adopting a small portion of these additional methods as
    if they were part of the Ruby language itself. While all of these methods are
    documented online, the best way to learn is often to experiment directly by using
    rails console. A few things to try:


    +   * 2.years.ago

    * [1,2,3].sum

    * 5.gigabytes

    * "man".pluralize

    * String.methods.sort


    As there is no best way to identify what subset works for you, simply be aware
    that these methods exist, and check the documentation when you find


    +   1. http://as.rubyonrails.org/'
