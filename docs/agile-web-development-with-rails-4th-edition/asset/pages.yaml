  md: '# Instantiating Observers


    So far we''ve defined our observers. However, we also need to instantiate them—nif
    we don''t, they simply won''t fire. How we instantiate observers depends

    whether we''re using them inside or outside the context of a Rails application.


    If you''re using observers within a Rails application, you need to list them in

    your application''s environment.rb file (in the config directory):


    ```

    config.active_record.observers = :order_observer, :audit_observer

    ```


    If you''re using your Active Record objects in a stand-alone application

    (that is, you''re not running Active Record within a Rails application), you need

    to instances of the observers manually using instance:


    ```

    OrderObserver.instance

    AuditObserver.instance

    ```


    In a way, observers bring to Rails much the benefits of first-generation

    aspect-oriented programming in languages such as Java. They allow you to

    inject behavior into model classes without changing any of the code in them

    classes.


    # 19.5 Transactions


    A database transaction groups a series of changes together in such a way

    that either the database applies all of the changes or it applies none of the\changes.
    The classic example of the need for transactions (and one used in

    Active Record''s owner documentation) is transferring money between two bank

    accounts. The basic logic is simple:


    ```

    account1.deposit(100)

    account2.withdraw(100)

    ```


    However, we have to be careful. What happens if the deposit succeeds but

    for some reason the withdrawal fails (perhaps the customer is overdrafted)?

    We''ve added $100 to the balance in account1 without a corresponding

    deduction from account2. In effect, we''ve created $100 out of thin air.


    Transactions to rescue: A transaction is something like the Three Mus-

    keteers with their motto "All for one and one for all." Within the scope of

    transaction, every SQL statement succeeds or they all have no effect.

    Putting that another way, if any statement fails, the transaction has no

    effect on the database.


    In Active Record use the transaction method to execute a block in the context

    of a particular database transaction. At the end of the block, the transaction

    is committed, updating the database, unless an exception is raised within the

    block, in which case the database rolls back all of the changes. Because trans'
