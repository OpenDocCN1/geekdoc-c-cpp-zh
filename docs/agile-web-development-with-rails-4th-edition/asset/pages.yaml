  md: '# David Says...


    But Isn''t SQL Dirty?


    Since developers first wrapped relational databases with an object-oriented layer,
    we''ve debated the question of how deep to run the abstraction. Some object-relational
    mappers seeking to eliminate the use of SQL entirely, hoping for object-oriented
    purity by forcing all queries through an OO layer.


    Active Record does not. It was built on the notion that SQL is neither dirty nor
    bad, just verbose in the trivial cases. The focus is on removing the need to deal
    with the verbosity in those trivial cases (writing a ten-attribute insert by hand
    will leave any programmer tired) but keeping the expressiveness around for the
    hard queries—the type SQL was created to deal with elegantly.


    Therefore, you won''t feel guilty when you use find_by_sql to handle performance
    bottlenecks or hard queries. Start out using the object-oriented interface for
    productivity and pleasure, then dip beneath the surface for close-to-the-metal
    experience when you need to do so.


    ```

    loop do

    puts "Price = #{stock.price}"

    sleep 60

    stock.reload

    end

    ```


    In practice, reload is rarely used outside the context of unit tests.


    # Updating Existing Rows


    After a long discussion of finder methods, you''ll be pleased to know that there''s
    not much to say about updating records with Active Record.


    If you have an Active Record object (perhaps representing a row from our orders
    table), you can write it to the database by calling its save method. If this object
    had previously been read from the database, this save will update the existing
    row; otherwise, the will insert a new row.


    If an existing row is updated, Active Record will use its primary key column to
    match it with the in-memory object. The attributes contained in the Active Record
    object determine the columns that will be updated—a column will only be updated
    in the database if its value has changed. In the following example, all the values
    in the row for order 123 can be updated in the database table:


    ```

    order = Order.find(123)

    ```'
