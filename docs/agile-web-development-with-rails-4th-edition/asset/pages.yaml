    To do that with Rails, we use an extension to the resources call:


    ```

    Depot::Application.routes.draw \n  resources :products do\n    get :who_bought,
    on: :member\n  end

    ```


    That syntax is straightforward. It says "we want to add a new action named who_bought


    Instead of specifying :member, if we instead :collection, then the route would
    apply to the collection as a whole. This is often used for scoping, for example
    you may have collections of products on clearance or products that have been discontinued.


    # Nested Resources


    Often resources themselves contain additional collections of resources. For example,
    we may want to allow folks to review our products. Each review would be a resource,
