  md: "# Iteration F4: Hiding An Empty Cart 157\n\nDownload depot_n/app/views/layouts/application.html.erb\n\
    \n```\n<%= hidden_div_if(@cart.line_items.empty?, :id => \"cart\") do %>n  <%=\
    \ render @cart %%\n<% end %>\n```\n\nWe'll write our helper so that it is local\
    \ to the store controller by adding it to application_helper.rb in the app/helpers\
    \ directory:\n\nDownload depot_n/app/helpers/application_helper.rb\n\n```\nmodule\
    \ ApplicationHelper\n  def hidden_div_if(condition, attributes = {}, &block)\n\
    \    if condition\n      attributes[\"style\"] = \"display: none\"\n    end\n\
    \    content_tag(\"div\", attributes, &block)\n  end\n\n```\n\nThis code uses\
    \ the Rails standard helper, content_tag, which can be used to wrap the output\
    \ created by a block in a tag. By using the &block notation, we will get Ruby\
    \ to parse the block that was given by hidden_div_if down to content_tag.\n\n\
    And, finally, we need to stop setting the message in the flash that we used to\
