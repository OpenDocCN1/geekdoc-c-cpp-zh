  md: "# Expiring Pages\n\n+   - Pages generated from data that you don't control.\
    \ For example, a page displaying information from our database might not be cacheable\
    \ if non-Rails applications update that database too. Our cached page would become\
    \ out-of-date without our application knowing.\n\nHowever, caching can cope with\
    \ pages generated from volatile content that's under your control. As we'll see\
    \ in the next section, it's simply a question of removing the cached pages when\
    \ they become outdated.\n\nCreating cached pages is only one half of the equation.\
    \ If the content initially used to create these pages changes, the cached versions\
    \ will become out-of-date, and we'll need a way of expiring them.\n\nThe trick\
    \ is to code the application to notice when the data used to create a dynamic\
    \ page has changed and then to remove the cached version. The next time a request\
    \ comes for that URL, the cached page will be regenerated based on the new content.\n\
    \n# Expiring Pages Explicitly\n\nThe low-level way to remove cached pages is with\
    \ the methods expire_page and expire_action, These take the same parameters as\
    \ uri_for and expire the cached page that matches the generated URL.\n\nFor example,\
    \ our content controller might have an action that allows us to create an article\
    \ and another action that updates an existing article. When we create an article,\
    \ the list of articles on the public page will become obsolete, we call expire_page,\
    \ passing in the action name that displays the public page. When we update an\
    \ existing article, the public index remains unchanged (at least, in our application),\
    \ but any version of this article should be deleted. Because this cache was created\
    \ using caches_action, we need to expire the page using expire_action, in the\
    \ action name and the article id.\n\n```\nDownload /cookies/app/controllers/content_controller.rb\n\
    ```\n\n```\ndef create_article\n  article = Article.new(params[:article])\n  if\
    \ article.save\n```"
