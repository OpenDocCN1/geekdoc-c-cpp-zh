    # 1.6 Rails and Databases


    The examples in this book were written using SQLite 3 (version 3.6.16 or thereafter).
    If you want to follow along with our code, it''s probably simplest if you use
    SQLite 3 too. If you decide to use something else, it won''t be a major problem.
    You may have to make minor adjustments to any explicit SQL in your code, but Rails
    eliminates database-specific SQL from applications.


    If you want to connect to a database other than SQLite 3, Rails also works with
    DB2, MySQL, Postgres, Firebird, and SQL Server. For all SQLite 3, you''ll need
    to install a database driver, a library that Rails can use to connect and use
    your database engine. This section contains links to instructions to get that
    done.


    The database drivers are all written in C and are primarily distributed in source
    form. If you don''t want to building a driver from source, take a careful look
    at the driver''s website. Many times you''ll find that the author distributes
    binary versions.'
