- img_proc: true
  md: "heavily on fragment caching, every request will need a lot of data transferring\
    \ from the network drive to the specific server before it's again sent on to the\
    \ user. To use this on a high-profile site, you really need to have a high-bandwidth\
    \ internal network between your servers, or you will see slowdown.\n\nThe caching\
    \ store system is available only for caching actions and fragments. Full-page\
    \ caches need to be kept on the filesystem in the public directory. In this case,\
    \ you will have to go to the network drive route if you want to use paging across\
    \ multiple servers. You can then symlink the entire public directory (but that\
    \ will also cause your images, stylesheets, and JavaScript to be passed over the\
    \ network, which might be a problem) or just the individual directories that are\
    \ needed for your page caches. In the latter case, you would, for example, symlink\
    \ public/products to your network drive to keep page caches for your projects\
    \ controller\n\n# Expiring Pages Implicitly\n\nThe expire_xxx works well, but\
    \ they also couple the caching function to the code in controllers. Every time\
    \ you change something in the database, you also have to work out which cached\
    \ pages this affect this. Although this is easy for smaller applications, this\
    \ gets more difficult as the application grows. A change made in one controller\
    \ might affect pages cached in another. Business logic in helper methods, which\
    \ really shouldn't have to know about HTML pages, now needs to worry about expiring\
    \ cached pages.\n\nFortunately, Rails sweepers can simplify some of this coupling.\
    \ A sweeper is a special kind of observer on your model objects. When something\
    \ significant happens in the model, the sweeper expires the cached pages that\
    \ depend on that model's data.\n\nYour application can have as many sweepers as\
    \ it needs. You'll typically create a separate sweeper to manage the caching for\
    \ each controller. Put your sweeper code in app/sweepers:\n\n```\nDownload edit/app/sweepers/article_sweeper.rb\n\
    class ArticleSweeper < ActionController::Caching::Sweeper\n\nobserve Article\n\
    \n  # If we create a new article, the public list of articles must be regenerated\n\
    \  def after_create(article)\n    expire_public_page\n  end\n\n  # If we update\
    \ an existing article, the cached version of that article is stale\n  def after_update(article)\n\
    \    expire_article_page(article.id)\n  end\n```"
