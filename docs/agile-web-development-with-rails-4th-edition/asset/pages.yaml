  md: "```\npage[:notice].hide\n```\n\n```\n# rest as before...\n```\n\nHowever, this\
    \ doesn't work. If we come to the store for the first time, there is nothing in\
    \ the flash, so the paragraph with an id of notice is not displayed. And, if there's\
    \ no tag with the id of notice, the JavaScript generated by the RJS template that\
    \ it hides bombs out, and the rest of the template gets run. As a result, you\
    \ never see the cart update in the sidebar.\n\nThe solution is a little hack.\
    \ We want to run the hide only if the notice is present, but RJS doesn't give\
    \ us the ability to generate JavaScript for individual ids. It does, however,\
