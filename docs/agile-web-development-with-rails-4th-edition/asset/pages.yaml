  md: 'Once we have a console session open, we can poke and prod all the various methods
    on our models. We can create, inspect and delete records. In a way, it''s like
    having a root console to your application.


    Once you put an application in production, we need to take care of a few chores
    to keep your application running smoothly. These chores aren''t auto-matically
    taken care for us, but luckily, we can automate them.


    # Dealing with Log Files


    As an application runs, it will constantly add data to its log file. Eventually,
    the log files can grow extremely large. To overcome this, logging sessions can
    roll over log files to create a progressive set of log files of increasing age.
    This will break up our log files into manageable chunks that can be archived or
    even deleted after a certain amount of time has passed.


    The Logger supports rollout. We need to specify how many (or how often) log we
    want and the size of each, using a line like one of the following to the file
    `config/environments/production.rb`:


    ```

    config.logger = Logger.new(config.paths.log.first, ''daily'')

    ```


    Or perhaps:

    ``````require ''active_support/core_ext/numeric/bytes''

    config.logger = Logger.new(config.paths.log.first, 10, 10.megabytes)\```


    Note that in this case require of active_support is needed as active support has
    not been configured yet. Yet, one of the configuration options that rails provides
    is to not include Active Support libraries at all:


    ```

    config.active_support.bare = true

    ```


    Alternately, we can direct our logs to the system logs for our machine:


    ```

    config.logger = SyslogLogger.new

    ```


    Find more options at http://wiki.rubyonrails.com/rails/pages/DeploymentTips.


    # Moving On Launch and Beyond


    Once we''ve set up our initial deployment, we''re ready to finish the development
    of our application and launch it into production. We''ll likely set up additional
    servers, and the lessons we learn from our first deployment will tell us a lot
    about how we structure later deployments. For example, we''ll likely find that
    most of the request time will be spent in Rails in waiting on the database or
    filesystem. This indicates that the way to scale up is to add machines to split
    up the Rails load across.


    However, we might find that the bulk of the time requests is in the database.
    If this is the case, we''ll want to look at how to optimize our database'
