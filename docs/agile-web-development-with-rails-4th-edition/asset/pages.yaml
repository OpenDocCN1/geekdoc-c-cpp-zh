- img_proc: true
  md: "# Shared Templates\n\nIf the option or partial parameter to render a call is\
    \ a simple name, Rails assumes that the target template is in the current controller's\
    \ view directory. However, if the name contains one or more characters, Rails\
    \ assumes the part up to the last slash is a directory name and the rest is the\
    \ template name. The directory is assumed to be under app/views. This makes it\
    \ easy to share partials and subtemplates across controllers.\n\nThe convention\
    \ in Rails applications is to store these shared partials in a subdirectory of\
    \ app/views called shared. Render shared partials using state-methods such as:\n\
    \n```\n<%= render(\"shared/header\", :title => @article.title) %>\n<%= render(:partial\
    \ => \"shared/post\", :object => @article) %>\n```\n\nIn this example, the @article\
    \ object will be assigned to the local variable post within the template.\n\n\
    # Partials with Layouts\n\nPartials can be rendered with a layout, and you can\
    \ apply a layout to a block within any template:\n\n```\n<%= render :partial =>\
    \ \"user\", :layout => \"administrator\" %>\n<%= render :layout => \"administrator\"\
    \ do %>\n  # ...\n\n<% end %>\n```\n\nPartial layouts are to be found directly\
    \ in the app/views directory associated with the controller, along the customary\
    \ underbar prefix, for example, app/views/users/_administrator.html.erb.\n\n#\
    \ Partials and Controllers\n\nIt isn't just view templates that use partials.\
    \ Controllers also get in on the act. Partials give controllers the ability to\
    \ generate fragments from a page using the same partial template as the view itself.\
    \ This is particularly important when you use Ajax support to update just part\
    \ of a page from the controller—use partials, and you know your formatting for\
    \ the table row or line that you're updating will be compatible with that used\
    \ to generate its brethren initially.\n\nTaken together, partials and layouts\
    \ provide an effective way to make sure that the user interface portion of your\
    \ application is maintainable. But being maintainable is only part of the story:\
    \ doing so in a way that also performs well is also crucial."
  merge: -1
