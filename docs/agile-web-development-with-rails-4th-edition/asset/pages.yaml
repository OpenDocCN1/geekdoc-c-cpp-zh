  md: '# Changes in the Beta Releases


    # Beta 11—November 24


    This beta incorporates a substantial amount of feedback from a number of sources
    including errata, formal reviews, and from the wonderful editor of this book.
    For the first time since putting this book out beta, I am going to suggest that
    if you are well under way with Depot using a previous beta, consider keeping on
    with that beta. While there have been no major changes, there have been enough
    minor changes that those who wish to use this book are encouraged to start over.


    This draft has also been tested against the Rails 3.0.3 release. No changes were
    needed to make the code in this book work against that release.


    As always, thanks for all of the wonderful feedback via the errata, forums, and
    other venues. At this time I would like to specifically thank Johnathan Ritzi,
    David Kapp and Jason Holloway. If you spot something, it is not too late to make
    a comment: there will be at least one errata sweep before final printing.


    # Beta 10—October 28


    This beta introduces a chapter on plugins and completes the first draft. Plugins
    are not merely an afterthought or an advanced feature of Rails, with Rails 3.0
    it is a fully architected way to augment or replace base Rails functionality.


    This also completes the first draft. If you spot something missing, now would
    be an excellent time to report it via an errata. After a few weeks of addressing
    comments it will be onto production where formatting and typographical and indexing
    glitches will be resolved.


    This draft has also been tested against the Rails 3.0.1 release. No changes were
    needed to make the code in this book work against that release.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Beta 9—October 6


    With these betas comes a new chapter on Rails'' dependencies. Understanding these
    dependencies are as important as understanding Rails itself. Introducing this
    chapter has produced a minor shifting of context: some that originally was present
    in the rather large chapter on Action View has moved into this one. Additional
    shifts are expected in the next beta: all will be noted here.


    While running with edge betas from git is not recommended at this time, those
    that run such may spot that csrf_meta_tag has been renamed to csrf_meta_tags in
    the book.


    As always, thanks for all the wonderful feedback via the errata, forums, and other
    venues. At this time I would like to specifically thank Leonel S, Martin Zoller,
    and Jim Puls.


    # Beta 8—September 9


    Rails 3.0 final has shipped! Even better news: no APIs that affect the beta were
    introduced in the process. In one case, namely in the use of an Action View helper
    from a standalone library, you will want to be using the final release instead
    of any previous beta or release candidate, so please do upgrade now if you haven''t
    already.


    New with this beta are three chapters completing the coverage of the externals
    of Rails. Caching covers how to effectively optimize your application by eliminating
    the overhead of re-computing results that rarely change. Migrations covers how
    to maintain your schemas. Finally, No-Browser Applications shows you how to access
    some or all of Rails functions either locally or remotely.


    As we enter the home stretch, your feedback becomes all the more important. There
    is a Report Erratum link at the bottom right of every page. Use it when you spot
    something, even if you aren''t sure! if you would like to start a discussion,
    the forum is a better place for that.


    # Beta 7—August 25


    We have a new release candidate of Rails, as well as an official release of Ruby
    1.9.2. I''m pleased to report that once again, no changes were made to any Rails
    API that affect the book. Furthermore, the regression in the first release candidate
    which brought the ability to build guides has been addressed.


    New with this beta is a chapter on Action View, which covers templates, layouts,
    and partials. At this point, all three parts of the Model/View/Controller architecture
    are covered. Next up will be a chapter on accessing implementations from outside
    of a server, either directly via APIs or as a web service.'
  merge: -1
