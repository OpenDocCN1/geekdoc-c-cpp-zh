  md: '# Pragmatic Books Online Store


    ![](img/79be11dd96f63a00f9795e2dfe232ef5_436_0.png)


    Figure 26.1: Store front using Haml


    An important thing to note is that indentation is important in Haml. Returning
    to the same level of indentation closes the statement, loop, or tag that is currently
    open. In this example, the paragraph is closed before the h1, the h1 is closed
    before the first div, but the div elements next, with the first containing an
    h3 element and the second containing a span and a button_to.


    As you can also see, all of your familiar helpers are available, like t, image_tag,
    and button_to. In every meaningful way, Haml is integrated into your application
    as ERB. You can mix and match: have some templates using ERB and others using
    Haml.


    As you have already installed the ham gem, there is truly nothing you need to
    do. To see this in action, all you need to do is to visit your store front. What
    you should see match Figure 26.1.


    If that looks unremarkable, that''s because it should look exactly like it did
    before. Which, if you think about it is all the more remarkable as the application
    layout continues to be implemented as an ERB template and the index itself is
    implemented using Haml. Despite this, everything integrates seamlessly and effortlessly.


    While this clearly is a deeper level of integration than simply adding a task
    or a helper, it is still an addition. Next, lets explore a further true replacement.'
