  md: "In addition to installing the MySQL database, you will also need to add the\
    \ mysql gem to the Gemfile:\n\n```\ngroup :production do\n  gem 'mysql'\nend\n\
    ```\n\nBy putting this gem in group production, it will not be loaded when running\
    \ in development or test. If you like, you can put sqlite3 gem into (separate)\
    \ development and test groups.\n\nInstall the gem using bundle install. You may\
    \ need to install and locate the MySQL database development files for your operating\
    \ system. On Ubuntu, for example, you will need to install libmysqlclient-dev.\n\
    \nYou can use the mysql command-client to create your database, or if you're more\
    \ comfortable with tools like\n\n```\ndepot> mysql -u root\nmysql> CREATE DATABASE\
    \ depot_production;\nm> GRANT ALL PRIVILEGES ON depot_production.*\n-> TO 'username@localhost'\
    \ IDENTIFIED BY 'password';\nmysql> EXIT;\n```\n\nIf you picked a different database\
    \ name, remember it, because you will need to adjust the configuration file to\
    \ match the name you picked. Let's look at that configuration file name.\n\nThe\
    \ databaseyml contains information on database connections. It contains three\
    \ sections, one for the development, test, and production databases. The current\
    \ production section contains the following:\n\n```\nproduction:\nadapter: sqlite3\n\
    database: db/production.sqlite3\npool: 5\ntimeout: 5000\n```\n\nWe replace that\
    \ section with something like the following:\n\n```\nproduction:\nadapter: mysql\n\
    encoding: utf8\nconnect: false\ndatabase: depot_production\npool: 5\nusername:\
    \ username\npassword: password\nhost: localhost\n```\n\nChange the username, password,\
    \ and database fields as necessary."
