    If we fetched this row into an Active Record object, object would have seven attributes.
    The id attribute would be 1 (Fixnum), the name attribute would be the string "Dave
    Thomas", and so on.


    We access these attributes using accessor methods. Rails automatically constructs
    both reader and writer when it reflects on the schema:


    ```

    o = Order.find(1)

    puts o.name #=> "Dave Thomas"

    o.name = "Fred Smith" # set the name

    ```


    Setting the value of an attribute does not change anything in the database—we
    must save the object for this change to become permanent.


    The value returned by the attribute readers is cast by Active Record to an appropriate
    Ruby type (if so, for example, if the database column is a timestamp, a Time object
    will be returned). If we want to get the raw value of an attribute, we append
    _before_type_cast to its name, as shown in the following code:


    ```

    product.price_before_type_cast #=> "29.95", a string

    product.updated_at_before_type_cast #=> "2008-05-13 10:13:14"

    ```


    Inside the code of the model, we can use the read_attribute and write_attribute
    private methods. These take the attribute name as a string parameter.'
