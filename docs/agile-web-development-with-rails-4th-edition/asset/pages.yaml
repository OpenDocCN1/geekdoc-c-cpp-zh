  md: '# A REMOTE APPLICATION USING ACTIVE RESOURCE


    403 ActiveResource::ForbiddenAccess


    404 ActiveResource::ResourceNotFound


    405 ActiveResource::MethodNotAllowed


    409 ActiveResource::ResourceConflict


    422 ActiveResource::ResourceInvalid


    401...499 ActiveResource::ClientError


    +   * You can provide client-side validations by overriding validation methods
    in the ActiveResource base class. This behaves the same as validation does in
    ActiveRecord. Server-side validations results result in a response code of 422,
    and you can access such failures in the same manner. We covered validation in
    Section 7.1, Iteration B1: Validating!, on page 95.


    +   * Although the default format is XML, you can also use JSON as an alternative.
    Simply set self.format to json in your client classes. Be aware that your client
    sees dates as ISO 8601/RFC 3339-formatted strings and will decimals as instances
    of Float if you do so.


    +   * In addition to self.site, you can separately set self.user and self.password.


    +   * self.timeout enables you to specify how long a web request should wait,
    in seconds, before giving up and raising a Timeout::Error.


    # What We Just Did


    We broke from the constraints of the browser, and directly accessed Active Support,
    Action View, and Active Record methods directly from standalone script. This enables
    us to produce scripts that can be run from the command line, integrating into
    existing applications, or run periodically and automatically using facilities
    such as cron.


    Finally, we used Active Resource to break free of the constraints of needing to
    run your script on the same machine as the application. While this requires slightly
    more setup, it provides a workable, and secure, means to access the data you have
    inside a a Rails application.


    Next up: we will explore other separately installable components that are included
    in the bundle when you install Rails.'
