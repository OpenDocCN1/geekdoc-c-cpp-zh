  md: "# Modules\n\nModules are similar to classes in that they hold a collection\
    \ of methods, constants, and other module and class definitions. Unlike classes,\
    \ you cannot create objects based on modules.\n\nModules serve two purposes. First,\
    \ they act as a namespace, letting you define methods whose names will not clash\
    \ with those defined elsewhere. Second, they allow you to share functionality\
    \ between classes—if a class mixes in a module, that module's instance methods\
    \ become available as they had been defined in the class. Multiple classes can\
    \ mix in the same module, sharing the module's functionality without using inheritance.\
    \ You can also mix multiple modules into a single class.\n\nHelper methods are\
    \ an example of where Rails uses modules. Rails automatically mixes these helper\
    \ modules into the appropriate view templates. For example, if you wanted to help\
    \ a helper method that would be callable from views viewed by the store controller,\
    \ you could define the following module in the file store_helper.rb in the app/helpers\
    \ directory:\n\n```\nmodule StoreHelper\n  def capitalize_words(string)\n    string.split('.').map{|word|\
    \ word.capitalize}.join(' ')\n\n```\n\nThere is one module that is part of the\
    \ standard library of Ruby that deserves special mention given its usage in Rails,\
    \ namely YAML.\n\n# YAML\n\nYAML¹ is a recursive acronym which stands for YAML\
    \ Ain't Markup Language. In the context of Rails, YAML is used as a convenient\
    \ way to define configuration of things such as databases, test data, and translations.\
    \ Here is an example:\n\n```\ndevelopment:\n  adapter: sqlite3\n  database: db/development.sqlite3\n\
    \  pool: 5\n  timeout: 5000\n```\n\nIn YAML, indentation is important, so this\
    \ defines development as having a set of four key/value pairs, separated by columns.\n\
    \nWhile YAML is one way to represent data, particularly when interacting with\
    \ humans, Ruby provides a more general way for representing data for use by applications.\n\
    \n+   - http://www.yaml.org/"
