  md: "The testing is great for unit and functional testing, which we will make use\
    \ of Section 13.1, Function Testing E-mail, on page 192. E-mail will not be delivered,\
    \ it will be appended to an array (accessible via the attribute ActionMailer::Base.deliveries).\
    \ This is the default delivery method in the test environment. Interestingly,\
    \ though the development mode is :smtp. If you want Rails to deliver e-mail during\
    \ the development of your application, this is good. If you'd rather disable e-mail\
    \ in development mode, edit the development.rb in the directory config/environments,\
    \ and add the following lines:\n\n```\nDept::Application.configure do\n  config.action_mailer.delivery_method\
    \ = :test\nend\n```\n\nThe sendmail setting delegates delivery to your local system's\
    \ sendmail program, which is assumed to be in /usr/bin. This delivery mechanism\
    \ is not particularly portable, because sendmail is not always installed in this\
    \ directory on different operating systems. It relies on your local sendmail supporting\
    \ the -i and -t commands.\n\nYou achieve more portability by leaving this option\
    \ at its default value of :smtp. If you do, you'll need to specify some additional\
    \ configuration to tell Action Mailer where to find an SMTP server to handle your\
    \ outgoing e-mail. This may be the machine running your web application, or it\
    \ may be a separate box (perhaps at your ISP if you're running Rails in a nonprofit\
    \ environment). Your system administrator will be able to give you the settings\
    \ for these parameters. You may also be able to determine them from your own mail\
    \ client's configuration.\n\nFollowing are typical settings for Gmail. Adapt as\
    \ you need to.\n\n```\nDept::Application.configure do\n  config.action_mailer.delivery_method\
    \ = :smtp\n  config.action_mailer.smtp_settings = {\n    :address => \"smtp.gmail.com\"\
    ,\n    :port => 587,\n    :domain => \"domain.of.sender.net\",\n    :authentication\
    \ => \"plain\",\n    :user_name => \"dave\",\n    :password => \"secret\",\n \
    \   :enable_starttls_auto => true\n  }\nend\n```\n\nAs with all configuration\
    \ changes, you'll need to restart your application if you make any changes to\
    \ the environment files."
