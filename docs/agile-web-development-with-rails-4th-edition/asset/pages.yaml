  md: '# General Recovery Advice


    Everything in this book has been tested. If you follow along with this scenario
    precisely, using the recommended version of Rails and SQLite3 on Linux, Mac OS
    X, or Windows, everything should work as described. However, deviations from this
    path may occur. Typos to the best of us, and side explorations are not only possible,
    but they are positively encouraged. Be aware that this might lead you to strange
    places. Don''t be afraid; specific recovery actions for common problems appear
    in the specific sections where problems often occur. A few additional general
    suggestions are included here.


    You should only ever need to restart the server in the few places where doing
    so is noted in the book. But if you ever get truly stumped, restarting the server
    might be worth trying.


    A “magic” command worth knowing, explained in detail in part III, rake db:migrate:redo.
    It will undo and reapply the migration.


    If your server won''t accept some input on a form, refresh the form on your browser,
    and resubmit it.


    Inside the cart''s box in the diagram. We''re assuming this uncertainty will resolved
    as we implement Depot.


    Coming up with the high-level data also raised the question of what information
    should go into order. Again, we chose to leave this fairly open for now—we’ll
    refine this further as we start showing the customer our early iterations.


    Finally, you might have noticed we''ve duplicated the product''s price in the
    line item data. We''re breaking the “initially, keep it simple” rule slightly,
    but it''s a transgression based on experience. If a product of changes, that price
    should not be reflected in the line item price of currently open orders, so each
    line item needs to reflect the price of the product at the time order was made.


    Again, at this point we''ll double-check with the customer that we''re still on
    the right track. (The customer was most likely sitting in the room with us while
    we drew these three diagrams.)


    # 5.3 Let''s Code


    So, after sitting down with the customer and doing some preliminary analysis,
    we''re ready to start using a computer for development! We''ll be working from
    our original diagrams, but the chances are pretty good that we''ll be throwing
    them away quickly—they''ll become outdated as we gather feed-'
