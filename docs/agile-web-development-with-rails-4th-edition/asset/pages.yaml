  md: 'Even if you didn''t know Ruby, you would probably be able to decipher that
    up creates a table named products and drops that table. The fields when creating
    this table include title, description, image_url, and price as well as a few timestamps
    (we''ll describe these on page 386).


    Now let''s at the same example from a Ruby perspective. CreateProducts is defined,
    which inherits from the Migration class from the ActiveRecord record. Two class
    methods are defined, one named up, and the other named down. Each calls a single
    class method (defined in ActiveRecord:Migration), passing the name of the table
    in the form of a symbol.


    The call to up also passes a block which is evaluated before the table is created.
    This block, when called, is passed an object t which is used to accumulate a list
    of fields. Rails defines a number of methods on this object, methods with names
    which are after common data types. Methods, when called, simply add a field definition
    to the ever accumulating set of names.


    The definition of the decimal also accepts a number of optional parameters, expressed
    as a hash.


    To someone new to Ruby, this is a lot of machinery thrown at solving such simple
    problem. To someone familiar with Ruby, none of this machinery is particularly
    heavy. Rails makes extensive use of the facilities provided by Ruby to make defining
    operations (for example, migration tasks) as simple and declarative as possible.
    Even small features of the language, like optional parentheses and braces, contribute
    to the overall readability and ease of authoring.


    Finally, there are a number of small features, or rather idiomatic combinations
    of features that are not immediately obvious to new people to the Ruby language.
    We close this chapter with them.


