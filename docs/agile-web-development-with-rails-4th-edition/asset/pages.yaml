    # Chapter 13


    #  Task H: Sending Mail


    At this point, we have a website that will respond to requests, and will provide
    feeds that allow sales of individual titles to be checked periodically. At times
    it makes sense to have something more than that. For those times, what we need
    is the ability to actively target a message to somebody specific when an event
    occurs. It could be worth notifying a system administrator when an exception occurs.
    It could be a user feedback form. In this chapter, we will opt to simply send
    confirmation e-mails to people who have placed orders. Once we complete that,
    we will create tests that not only for the main support that we just added, but
    the entire user scenario we have created so far.


    # 13.1 Iteration H1: Sending Confirmation E-mails


    There are three basic parts to sending e-mail in rails: configuring how e-mail
    is to be sent, determining when to send the e-mail, and specifying what you want
    to say. We will cover each of these three in turn.


    # E-mail Configuration


    E-mail configuration is part of a Rails application''s environment, and involves
    a Depot:Application.config block. If you want to use the same configuration for
    development, testing, and production, add the configuration to environment.rb
    in the config directory; otherwise, add different configurations to the appropriate
    files in the config/environments directory.


    Inside the block, you will need one or more statements. You first have to decide
    how you want mail delivered:


    ```

    config.action_mailer.delivery_method = :smtp | :sendmail | :test

    ```


    The :smtp and :sendmail options are used when you want Action Mailer to attempt
    to deliver e-mail. You''ll clearly want to use one of these methods in production.'
