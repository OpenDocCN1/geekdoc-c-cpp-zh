  md: "# Iteration D2: CONNECTING PRODUCTS TO CARTS\n\nThat has_line_items part of\
    \ the directive is fairly self-explanatory: a cart (potentially) has many associated\
    \ line items. These are linked to the cart because each line item contains a reference\
    \ to its cart's id. The dependent=>destroy path indicates that the existence of\
    \ line items is dependent on the existence of the cart. If we destroy a cart,\
    \ deleting it from the database, will Rails also destroy any line items that are\
    \ associated with that cart.\n\nNext, we'll specify links in the opposite direction,\
    \ from the line item to the carts and products tables. To do this, we use the\
    \ belongs_to declaration twice in the line_item.rb:\n\nDownload depot/f/app/models/line_item.rb\n\
    \n```\nclass LineItem < ActiveRecord::Base\n  belongs_to :product\n  belongs_to\
    \ :cart\nend\n```\n\nbelongs_to Rails that rows in the line_items table are children\
    \ of rows in the carts and products tables. No line item can exist unless the\
    \ corresponding cart and product rows exist. There's an easy way to remember where\
    \ to put belongs_to:declarations: if a table has foreign keys, the corresponding\
    \ model should have a belongs_to for each.\n\nJust what do these various declarations\
    \ do? Basically, they add navigation capabilities to the model objects. Because\
    \ we added the belongs_to declaration to Lineitem, we can now retrieve its Product\
    \ and display the book's title:\n\n```\nli = LineItem.find(...)\nputs \"This line\
    \ item is for #{li.product.title}\"\n```\n\nAnd because Cart is declared to have\
