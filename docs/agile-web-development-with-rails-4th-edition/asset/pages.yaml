- img_proc: true
  md: "The version number itself is the Coordinated Universal Time (UTC) timestamp\
    \ at the time the migration was created. These numbers contain the four-digit\
    \ year, followed by two digits for the month, day, hour, minute, and second, all\
    \ based on the solar time at the Royal Observatory in Greenwich, London. Because\
    \ migrations tend to be created relatively infrequently and the accuracy is recorded\
    \ to the second, the chances of any two people getting the same timestamp are\
    \ vanishing small. And the benefit of having timestamps to be deterministically\
    \ ordered far outweighs the miniscule risk of this occurring.\n\nHere's what the\
    \ db/migrate directory of our Depot looks like:\n\n```\ndepot> ls db/migrate\n\
    20110211000001_create_products.rb\n20110211000002_create_carts.rb\n20110211000003_create_items.rb\n\
    20110211000004_add_quantity_to_line_item.rb\n20110211000005_combine_items_in_cart.rb\n\
    20110211000006_price_to_line_item.rb\n20110211000007_create_orders.rb\n20110211000008_add_order_id_to_line_item.rb\n\
    20110211000009_create_users.rb\n```\n\nAlthough you could create these migrations\
    \ by hand, it's easier (and less error prone) to use a generator. As we saw, there\
    \ are actually two generators that create migration files:\n\n+   * The model\
    \ generator creates a migration to turn the table associated with the model (unless\
    \ you specify the --skip-migration option). The example that follows, showing\
    \ a model discount also creates a migration called yuyymMddhmmss_create_discounts.rb:\n\
    \n```\ndepot> rails generate model discount discount\n  exists app/models/\n \
    \ exists test/unit/\n  exists test/fixtures/\n  create app/models/discount_test.rb\n\
    \  create test/fixtures/discounts.yml\n  exists db/migrate\n  create db/migrate/201102110000010_create_discounts.rb\n\
    ```\n\n+   * You can also generate a migration on its own:\n\n```\ndepot> rails\
    \ generate migration add_price_column\n  exists db/migrate\n  create db/migrate/201102110000011_add_price_column.rb\n\
    ```\n\nLater, starting in Anatomy of a Migration, we'll see what goes in the migration\
    \ files. But for now, let's jump ahead a little in the workflow and see how to\
    \ run migrations."
