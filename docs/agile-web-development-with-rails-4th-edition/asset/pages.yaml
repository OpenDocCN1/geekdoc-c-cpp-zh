    # 3.2 Rails Model Support


    In general, we''ll want our web applications to keep their information in a relational
    database. Order-entry systems will store orders, line items, and order details
    in database tables. Applications that use unstructured text, such as weblogs and
    news sites, often use databases as their back-end store.


    Although it might not be immediately apparent from the SQL¹ you use to access
    them, relational databases are actually designed around mathematical set theory.
    Although this is good from a conceptual point of view, it makes it difficult to
    combine relational databases with object-oriented (OO) programming languages.
    Objects are all about data and operations, and databases are all about sets of
    values. Operations that are easy to express in relational terms are sometimes
