  md: "something to the cart and suddenly create the cart HTML, we see a flicker in\
    \ the browser as the cart is first displayed and then hidden and slowly revealed\
    \ by the blind_down effect.\n\nA better way to handle the problem is to create\
    \ the cart HTML but the CSS style to display: none if the cart is empty. To do\
    \ that, we need to change the application.html layout in app/views/layouts. Our\
    \ first attempt was something like this:\n\n```\n<div id=\"cart\">\n  <% if @cart.line_items.empty?\
    \ %>\n    style=\"display: none\"\n  <% end %>\n  <%= render(@cart) %>\n</div>\n\
    ```\n\nThis code adds the CSS style= attribute to the <div> tag, but only if the\
    \ cart is empty. It works fine, but it's really ugly. That dangling> character\
    \ looks misplaced (even though it isn't), and the logic is injected into the middle\
    \ of a tag is the kind of thing that taints languages a bad name. Let's not let\
    \ that of ugliness litter our code. Instead, let's create an abstraction that\
    \ hides it—we'll write a helper method.\n\n# Helper Methods\n\nWhenever we want\
    \ to abstract some processing out of a view (any kind of view), we should write\
    \ a helper method.\n\nIf you look in the app directory, you will find five subdirectories:\n\
    \n```\ndepot ls -p app\ncontrollers/ helpers/ mailers/ models/ views/\n```\n\n\
    Not surprisingly, our helper method gets in the helpers directory. If you look\
    \ in that directory, you will find it contains some files:\n\n```\ndepot ls -p\
    \ app\napplication_helper.rb line_items_helper.rb store_helper.rb\ncarts_helper.rb\
    \ products_helper.rb\n```\n\nThe Rails generators automatically create a helper\
    \ file for each of our controllers (products and store). The Rails command itself\
    \ (the one that created the application initially) created the file application_helper.rb.\
    \ If you like, you can organize your methods into controller-specific helpers,\
    \ but as this method will be used in the application layout, put it in the application\
    \ helper.\n\nLet's write a helper method called hidden_div_if. It takes a condition,\
    \ an optional set of attributes, and a block. It wraps the output generated by\
    \ the block in a <div> tag, adding the display: none if the condition is true.\
    \ Use it in the store layout like this:"
