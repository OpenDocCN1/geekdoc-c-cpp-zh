    # Delivering Multiple Content Types


    Some prefer receiving e-mail in plain-text format, while others like the look
    of an HTML e-mail. Rails makes it easy to send e-mail messages that contain alternate
    content formats, allowing the user (or their e-mail client) to decide what they''d
