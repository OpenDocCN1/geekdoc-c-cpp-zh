  md: "people from navigating directly to the checkout option and creating empty orders.\
    \ The return statement is important here, without it you will get a double-render\
    \ error as your controller will attempt to both redirect and render output.\n\n\
    ```\ndepot p/app/controllers/orders_controller.rb\n```\n\n```\ndef new\n  @cart\
    \ = current_cart\n  if @cart.line_items.empty?\n    redirect_to_store_url, :notice\
    \ => \"Your cart is empty\"\n    return\n  end\n\n  @order = Order.new\n\n  respond_to\
    \ do |\n    format.html # new.html.erb\n    format.xml { render :xml => @order\
    \ }\n  end\n```\n\nAnd we add a test for \"requires item in cart\", and modify\
    \ the existing test for \"should get new\" to ensure there is an item in the cart.\n\
    \n```\ndepot p/test/functional/orders_controller.rb\n```\n\n```\ntest \"requires\
    \ item in cart\" do\n  get :new\n  assert_redirected_to_store_path\n  assert_equal\
    \ flash[:notice], 'Your cart is empty'\nend\n```\n\n```\ntest \"should get new\"\
    \ do\n  cart = Cart.create\n  session[:cart_id] = cart.id\n  LineItem.create(:cart\
    \ => cart, :product => products(:ruby))\n\n  get :new\n  assert_response :success\n\
    end\n```\n\nNow we write the new action to present our user with a form, prompting\
    \ them to enter the information in the orders table: name, address, e-mail address,\
    \ and payment type. This means that we will need to display a Rails order template\
    \ containing a form. The input fields on this form will link to the corresponding\
    \ attributes in a Rails model object, we will need to create an empty order object\
    \ in the new action to give these fields something to work with."
  merge: -1
