    \ We complete this chapter with a description of a tool you can use to orchestrate\
    \ the execution of tasks.\n\n# 25.5 Automating Tasks with Rake\n\nRake is a program\
    \ that is often taken for granted. It is used to automate tasks, particularly\
    \ tasks that may have a number of dependencies. The set of tasks are defined by\
    \ the Rakefile that you will find in your application's root directory.\n\ndb:setup\
    \ is an example of such a task. To see which subtasks are involved, run rake with\
    \ --trace and --dry-run options:\n\n```\n$ rake --trace --dry-run db:setup\n(in\
    \ /home/ruby/depot)\n** Invoke db:setup (first_time)\n** Invoke db:create (first_time)\n\
    ** Invoke db:load_config (first_time)\n** Invoke rails_env (first_time)\n** Execute\
    \ (dry run) rails_env\n** Execute (dry run) db:load_config\n** Execute (dry run)\
    \ db:create\n** Invoke db:schema:load (first_time)\n** Invoke environment (first_time)\n\
    ** Execute (dry run) environment\n** Execute (dry run) db:schema:load\n** Invoke\
    \ db:seed (first_time)\n** Invoke db:abort_if_pending_migrations (first_time)\n\
    ** Invoke environment\n** Execute (dry run) db:abort_if_pending_migrations\n**\
