    # Chapter 17


    # Depot Retrospective


    Congratulations! By making it this far you have obtained a solid understanding-of
    the basics of every Rails application. There is much more to learn, which we will
    pick back up again in Part III. For now, relax, and let''s recap what we''ve seen
