    Meanwhile, let''s explore how the data forms is processed.


    # 21.3 Processing Forms


    In Model 21.2, on the following page, we can see how the various attributes in
    the model pass through the controller to the view, on the HTML page, and back
    again into the model. The model object has attributes such as name, country, and
    password. The template uses helper methods to construct an HTML form to let the
    user edit the data in model. Note how the form fields are named. The country attribute,
    for example, maps to an HTML input field with the name user[country].


    When the user submits the form, the raw POST data is sent back to our application.
    Rails extracts the fields from the form and constructs the params hash. Simple
    values (such as the id field, extracted by routing from the form action) are stored
    as scalars in the hash. but, if a parameter name has brackets in it, Rails assumes
    it is part of more structured data and constructs a hash to hold the values. Inside
    this hash, the string inside the brackets acts as the key. This process can repeat
    if a parameter name has multiple sets of brackets in.


    | parameters | params |

    |---|---|

    | id=123 | { id => "123" } |

    | user(name)=Dave | { user => {:name => "Dave" } |

    | user(address)[city]=Wien | { user => {:address => {:city => "Wien"}} } |


