    # Chapter 18


    # # Finding Your Way Around Rails


    Having survived the Depot project, you are now prepared to dive deeper into Rails.
    For the rest of the book, we''ll go through Rails topic by topic (which pretty
    much means module by module). You have seen some of these modules in action before.
    We will cover not only what each module does, but also how to extend or even replace
