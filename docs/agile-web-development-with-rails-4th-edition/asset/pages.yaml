  md: "For example, different templates may need to add their own template-specific\
    \ items to the standard page sidebar. We'll use the content_for mechanism in those\
    \ templates to define content and use yield in the layout to embed this content\
    \ into the sidebar.\n\nIn each regular template, use a content_for to give a name\
    \ to the content rendered inside a block. This will be stored inside Rails and\
    \ will not contribute to the output generated by the template.\n\n# <h1>Regular\
    \ Template</h1>\n\n```\n% content_for(:sidebar) %>\n<ul>\n<li>this text will be\
    \ rendered</li>\n<li>and saved for later</li>\n<li>it may contain <%= \"dynamic\"\
    \ stuff</li>\n</ul>\n<% end %>\n```\n\n<p>Here's the regular stuff that will appear\
