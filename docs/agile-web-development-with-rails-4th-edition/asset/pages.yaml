    Figure 10.3: our application spills its guts.


    @cart = Cart.find(params[:id])


    If the cart cannot be found, ActiveRecord raises a RecordNotFound exception, which
    we clearly need to handle. The question arises—how?


    We could simply ignore it. From a security standpoint, this is probably the best
    move, because it gives no information to a potential attacker. However, it also
    means that should we have a bug in our code that generates bad cart ids, our application
    will appear to the outside world to be unresponsive—no one will know there has
    an error.


    Instead, we will take two actions when an exception is raised. First, we''ll log
    the fact to an internal log file using Rails'' logger facility. And second, we''ll
    redirect the catalog page, along with a short message to the user (something along
    the lines of "Invalid cart”), that they can continue to use our site.


    Rails has a convenient way of dealing with errors and error reporting. It defines
    a structure called Flash. Flash is a bucket (actually closer to a Hash) in which
    you can store stuff as you process a request. The contents of the flash are available
    to the next request in this session before being deleted automatically. Typically
    the flash is used to collect error messages. For example, when our show method
    detects that it passed an invalid cart id, it can store that error message in
    the flash area and redirect to the index action to redisplay the catalog. The
    view for the index action can extract and display it at the top of the catalog
    page. The flash information is accessible within the views by using the flash
    accessor.


    +   2. http://guides.rubyonrails.org/debugging_rails_applications.html#the-logger'
