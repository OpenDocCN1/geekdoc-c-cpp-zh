  md: "Because the content pages are fixed, they can be cached. We can cache the public\
    \ content at the page level, but we have to restrict access to the cached content\
    \ to members, so we need to use action-level caching for it. We added two declarations\
    \ to our class:\n\n```\nDownload e1/app/controllers/content_controller.rb\n```\n\
    \n```\nclass ContentController < ApplicationController\n  before_filter :verify_premium_user,\
    \ :except => :public_content\n\n  caches_page :public_content\n  caches_action\
    \ :premium_content\n```\n\nThe caches_page directive tells Rails to cache the\
    \ output of public_content the first time it is produced. Thereafter, this page\
    \ will be delivered directly from the web server.\n\nThe second directive, caches_action,\
    \ tells Rails to cache the results of executing-premium_content but still to execute\
    \ the filters. This means we'll still validate that the person requesting it is\
    \ allowed to do, but we won't actually execute the action more than once.\n\n\
    Action caching is a good example of an around filter, described on page 342. The\
    \ before part of the filter checks to whether the cached item exists. If it does,\
    \ it renders it to the user, preventing the real action from running. The after\
    \ part of the filter saves the results of running the action in the cache.\n\n\
    caches_action can accept a number of options. :cache_path allows you to modify\
    \ the action cache path. This can be useful for actions that handle a different\
    \ number of conditions with different cache needs. :if and :unless allow you to\
    \ pass a Proc that control when an action should be passed. Finally, a :layout\
    \ option, if false, will cause Rails to cache only your action content. This is\
    \ useful when your layout has dynamic information.\n\nCaching is, by default,\
    \ enabled only in production environments. You can turn it on or off manually\
    \ by setting this:\n\n```\nActionController::Base.perform_caching = true | false\n\
    ```\n\nYou can make this change in your application's environment files (config/environments),\
    \ although the preferred syntax is lightly different:\n\n```\nconfig.action_controller.perform_caching\
    \ = true\n```\n\nNote that both Rails page and action caching are strictly URL\
    \ based. A page is cached according to the content of the URL that it first generated,\
    \ and subsequent requests to that same URL will return the saved content.\n\n\
    This means that dynamic pages that depend on information not in URL are poor candidates\
    \ for caching. These include the following:"
