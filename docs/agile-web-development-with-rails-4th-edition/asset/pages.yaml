- img_proc: true
  md: "The timestamps method creates the created_at and updated_columns, with the\
    \ correct timestamp data type. Although there is no requirement to add these columns\
    \ to any particular table, this is yet another example of Rails making it easy\
    \ for a convention to be implemented easily and consistently.\n\n# Options for\
    \ Creating Tables\n\nYou can pass hash of options as a second parameter to create_table.\n\
    \nIf you specify :force => true, the migration will drop an existing table of\
    \ the same name before creating the new one. This is a useful option if you want\
    \ to create a migration that forces a database into a known state, but there's\
    \ clearly a potential for data loss.\n\nThe :temporary => true option creates\
    \ a temporary table—one that goes away when the application disconnects from the\
    \ database. This is clearly pointless in the context of a migration, but as we\
    \ will see later, it does have its uses elsewhere.\n\nThe :options => 'xxx' parameter\
    \ lets you specify options to your underlying database. These are added to the\
    \ end of the CREATE TABLE statement, right after the closing parenthesis. Although\
    \ this is rarely necessary with SQLite 3, or at times with other database servers.\
    \ For example, some versions of MySQL allow you to specify the initial value of\
    \ the autoincrementing id column. We can pass this through in a migration as follows:\n\
    \n```\ncreate_table :tickets, :options => \"auto_increment = 10000\" do |\n  t.text\
    \ :description\n  t.timestamps\nend\n```\n\nBehind the scenes, migrations will\
    \ generate the following DDL from this table description when configured for MySQL:\n\
    \n```\nCREATE TABLE \"tickets\" (\n  \"id\" int(11) default null auto_increment\
    \ primary key,\n  \"description\" text,\n  \"created_at\" datetime,\n  \"updated_at\"\
    \ datetime\n) auto_increment = 10000;\n```\n\nBe careful when using the :options\
    \ parameter with MySQL. The Rails database adapter sets a default option of ENGINE=InnoDB.\
    \ This overrides any local defaults you may have and forces migrations to use\
    \ the InnoDB engine for new tables. But if you override :options, you'll lose\
    \ this setting; new tables will be created using whatever database engine is configured\
    \ as the default for your site. You may want to add an explicit ENGINE=InnoDB\
    \ to the options string to force the standard behavior in this case. You"
  merge: -1
