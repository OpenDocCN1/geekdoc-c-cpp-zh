  md: '# Beta 4—May 26


    This beta adds two chapters. The first recaps what was learned in part 2: model,
    view, controller, configuration, testing, and deployment. It continues with an
    explanation on how to generate documentation for your application.


    Chapter 18 is also new with this beta: it goes directory through your Rails application,
    describing what goes into each. You will see how to generate documentation for
    Rails itself, how to build a Rake task, more information on configuration options
    and naming conventions. This all sets the stage for the chapters that follow.


    The Rails team is in the process of deprecating config.log_path, but at the present
    time has not settled on its replacement. Furthermore this property is broken in
    Rails 3 beta 3. What you will see in Section 16.3, Dealing with Log Files, on
    page 255 reflects what currently works, which may not necessarily be supported
    in the final release.


