    # # Chapter 21


    # # Action View


    We''ve seen how the routing component determines which controller to use and how
    the controller chooses an action. We''ve also seen how the controller and action
    between them decide what to render to the user. Normally rendering takes place
    at the end of the action, and typically involves a template. That''s what this
    chapter is all about. ActionView encapsulates all the functionality needed to
    render templates, most commonly generating HTML, XML, or JavaScript back to the
    user. As its name suggests, ActionView is the part of our MVC trilogy.


    In this chapter, we will start with templates, for which Rails provides a range
    of options. We will then cover a number of different ways in which users provide
    input: forms, file uploads, and links. We will complete this chapter by looking
    at a number of ways to maintain using using helpers, layouts, and partials.


    # ## 21.1 Using Templates


    When you write a view, you''re writing a template: something that will expand
    to generate the final result. To understand how these templates work, we need
    to look at three areas:


    +   - Where the templates go

    - The environment they run in

    - What goes inside them


    # ### Where Templates Go


    The render method expects to find templates in the app/views directory of the
    current application. Within this directory, the convention is to have a subdirectory
    for the views of each controller. Our Depot application, for instance, includes
    products and store controllers. As a result, we have templates in app/views/products
    and app/views/store. Each directory typically contains templates named after the
    actions in the corresponding controller.'
  merge: -1
