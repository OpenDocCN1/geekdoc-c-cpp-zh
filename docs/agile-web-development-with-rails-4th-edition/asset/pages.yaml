- img_proc: true
  md: 'You can also have templates that aren''t named after actions. You render such
    templates from the controller using calls such as:


    ```

    render(:action) => ''fake_action_name''

    render(:template) => ''controller/name''

    render(:file) => ''dir/template''

    ```


    The last of these allows you to store templates anywhere on a filesystem.

    This is useful if you want to share templates across applications.


    # The Template Environment


    Templates contain a mixture of fixed text and code. The code in the template adds
    dynamic content to the response. That code runs in an environment that gives it
    access to the information set up by the controller.


    +   * All instance variables of the controller are also available in the template.

    This is how actions communicate data to the templates.

    * The controller object''s flash, headers, logger, params, request, response,
    and session are available as accessor methods in the view. Apart from the flash,
    view code probably should not use these directly, because the responsibility for
    handling them should rest with the controller. However, we do find this useful
    when debugging. For example, the following html template uses the debug method
    to display the contents of the session, the details of the parameters, and the
    current response:


    ```

    <h1>Session</h1> <%= debug(session) %>

    <h1>Parameters</h1> <%= debug(params) %>

    <h1>Response</h1> <%= debug(response) %>

    ```


    +   * The current controller object is accessible using the attribute controller.
    This allows the template to call any public method in the controller (including
    the methods in ViewController).

    * The path to the base directory of the templates is stored in the attribute base_path.


    # What Gets in a Template


    Out of the box. Rails supports three types of template:


    +   * Builder templates use the Builder library to construct XML responses. We
    talk more about Builder in Section 25.1, Generating XML with Builder, on page
    416.

    * ERB templates are a mixture of content and embedded Ruby. They are typically
    used to generate HTML pages. We talk more about ERB in Section 25.2, Generating
    HTML with ERB, on page 418.'
