    # Chapter 23


    # Migrations


    Rails encourages an agile, iterative style of development. We don''t expect to
    get everything the first time. Instead, we write tests and interact with our customers
    to refine our understanding as we go.


    For that to work, we need a supporting set of practices. We write tests to help
    us design our interfaces and act as a safety net when we change things, and we
    use version control to store our application''s source files, allowing us to undo
    mistakes and monitor what changes day to day.


    But there''s another area of the application that changes, an area that we can''t
    directly manage using version control. The database schema in a Rails application
    constantly evolves as we progress through the development: we add a table here,
    rename a column there, and so on. The database changes in step with the application''s
    code.


    With Rails, each of steps is made possible through the use of a migration. You
    will see this in throughout the development of the Depot application, starting
    when we created the first products in Section 6.1. Generating the Scaffold, on
    page 82 and when we performed tasks as adding a quantity to the line_items in
    Section 10.1. Iteration E1: Creating a Smarter Cart, on page 130. Now it is time
    to dive deeper into how migrations work and what else you can do with them.


    # 23.1 Creating and Running Migrations


    A migration is simply Ruby source file in your application''s db/migrate directory.
    Each migration file''s name starts with a number of digits (typically fourteen)
    and an underscore. These digits are the key to migrations, because they define
    the sequence in which the migrations are applied—they are the individual migration''s
    version number.'
