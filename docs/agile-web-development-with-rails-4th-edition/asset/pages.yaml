  md: '# # Tools and Frameworks


    # ## Pragmatic Git


    There''s a change in the air. High-profile projects such as the Linux Kernel,
    Mozilla, Gnome, and Ruby on Rails are now using Version Control Systems (DVCS)
    instead of the old-stans of CVS or Subversion. This book will get you started
    using Git in this new distributed world.


    **Pragmatic Version Control Using Git**


    Travis Stergewood

    (200 pages) ISBN: 978-1-93435-15-9, $34.95

    http://progprog.com/titles/tsgit


    ![](img/79be11dd96f63a00f9795e2dfe232ef5_468_0.png)


    # ## Prototype and script.aculo.us


    Tired of getting swamped in the nitty gritty of cross-browser. Web 2.0-grade JavaScript?
    Get back in the game with Prototype and script.aculo.us, two extremely popular
    JavaScript libraries that make it a walk in the park. Be it Ajax, drag and drop,
    autocompletion, advanced visual effects, or many other great features, all you
    need is to write one or two lines of script that so good they could pass for Ruby!


    **Prototype and script.aculo.us: You Never Knew JavaScript Could Do This!**


    Christophe Porteneuve

    (330 pages) ISBN: 978-1-93435-01-8, $34.95

    http://progprog.com/titles/cppsu


    ![](img/79be11dd96f63a00f9795e2dfe232ef5_468_1.png)'
