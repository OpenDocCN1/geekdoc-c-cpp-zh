    Because of this change, create finishes handling the Ajax request, Rails will
    look for a create template to render.


    Rails supports RJS templates—the JS stands for JavaScript. A .jsrs template is
    a way of getting JavaScript on the browser to do what you want, all by writing
    server-side Ruby code. Let''s write our first: create.js. It goes in the app/views/line_items/directory,
    which just has other view for line items:


    ```

    Download page.replace_html(''cart'', render(cart))

