  md: "# 15.1 Iteration J1: Selecting the locale\n\nWe start by creating a new configuration\
    \ file that encapsulates our knowledge of what locales are available and which\
    \ one is to be the default.\n\n```\nload depot_s/config/initializers/i18n.rb\n\
    ```\n\n```\n#encoding: utf-8\ni18n.default_locale = :en\n\nLANGUAGES = [\n  ['English',\
    \ 'en'],\n  \"Espan&tilde;ol\".html_safe, 'es'\n]\n```\n\nThis code is doing two\
    \ things.\n\nThe first thing it does is use the i18n module to set the default\
    \ locale. i18n is a funny name, but it bears typing out internationalization all\
    \ the time. Internationalization, after all, it starts with an i, ends with an\
    \ n, and has 18 letters in between.\n\nThen it defines a list of associations\
    \ between display names and locale names. Unfortunately, all we have at the moment\
    \ is a U.S. keyboard, and Español has a character that can't be directly entered\
    \ via our keyboard. Different operating systems have different ways of dealing\
    \ with this, and often the easiest is to simply copy and paste the correct text\
    \ from a website. If you do this, just make sure your editor is configured for\
    \ UTF-8. Meanwhile, we've opted to use the html equivalent of \"n contilde\" in\
    \ Spanish. If we didn't do anything, the markup itself would be shown. By calling\
    \ html_safe we inform Rails that the string is safe to be interpreted as HTML.\n\
    \nIn order to get Rails to pick up this configuration change, the server needs\
    \ to be restarted.\n\nSince each page that is translated will have an en and es\
    \ version (for now, more will be added later), it makes sense to include this\
    \ in the URL front, make it optional, and have it default to the current locale,\
    \ which in turn will default to English.\n\nTo implement this cunning plan, lets\
    \ start with modifying config/routes.rb:\n\n```\nload depot_s/config/routes.rb\n\
    ```\n\n```\nDepot::Application.routes.draw\n  get 'admin' => 'admin#index'\n \
    \ controller :sessions do\n    get 'login' => :new\n    post 'login' => :create\n\
    \    delete 'logout' => :destroy\n  end\n```"
  merge: -1
  pgno: 221
- img_proc: true
  md: "```\nscope `:locale` do\n  resources :users\n  resources :orders\n  resources\
    \ :line_items\n  resources :carts\n  resources :products => :member\n    get :who_bought,\
    \ :on => :index, :as => 'store'\nend\n```\n\nand\nWhat we have nested our resources\
    \ and root declarations inside a scope declaration for `:locale`.\n\nFurthermore,\
    \ `:locale` is in parenthesis, which is the way to say it is optional. Note that\
    \ we did not choose to pick the administrative and session functions inside this\
    \ scope, as it is not our intent to translate them at this time.\n\nWhat this\
    \ means is that both http://localhost:3000/ will use the default locale, namely\
    \ English, and be routed exactly the same as http://localhost:3000/en, http://localhost:3000/es\
    \ will route to the same controller and action, but we will want to set the locale\
    \ to be default.\n\nIn order to do this, we need to create a `_filter` and set\
    \ the `default_url_options`. The logical place is to do both in the common base\
    \ class for all of our controllers, which is `ApplicationController`:\n\n![](img/79be11dd96f63a00f9795e2dfe232ef5_222_0.png)\n\
    \n```\nclass ApplicationController < ActionController::Base\n  before_filter :set_i18n_locale_from_params\n\
    \  protected\n  def set_i18n_locale_from_params\n    if params[:locale]\n    \
    \  if I18n.available_locales.include?(params[:locale].to_sym)\n        I18n.locale\
    \ = params[:locale]\n      else\n        flash.now[:notice] = \"#{params[:locale]}\
    \ translation not available\"\n        logger.error flash.now[:notice]\n     \
    \ end\n    end\n  end\n\n  def default_url_options\n    { :locale => I18n.locale\
    \ }\n  end\nend\n```\n\nThis `set_i18n_locale_from_params` does pretty much what\
    \ it says: it sets the locale in the session from the params, but only if there\
    \ is a locale in the params."
