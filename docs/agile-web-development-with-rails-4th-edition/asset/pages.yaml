  md: '# 25.2 Generating HTML with ERb


    At its simplest, an ERb template is just a regular HTML file. If a template contains
    no dynamic content, it is simply sent as is to the user''s browser. The following
    is a perfectly valid html.erb template:


    ```

    <h1>Hello, Dave!</h1>

    <p>

    How are you, today?

    </p>

    ```


    However, applications that use static templates tend to be a bit boring to use.
    We can spice them up using dynamic content:


    ```

    <h1>Hello, Dave!</h1>

    <p>

    It''s <%= Time.now %>

    </p>

    ```


    If you''re a JSP programmer, you''ll recognize this as an inline expression. Erb
    evaluates any code between <%= and %>, converts the results into a string to_s,
    and finally substitutes that string into the resulting page. The expression can
    be arbitrary code:


    ```

    <h1>Hello, Dave!</h1>

    <p>

    It''s <%= require ''date''

    DAY_NAMES = %w{ Sunday Monday Tuesday Wednesday

    Thursday Friday Saturday }

    today = Date.today

    DAY_NAMES[today.day]

    </p>

    ```


    Putting lots of business logic into a template is generally considered to be a
    Very Bad Thing, and you''ll risk incurring the wrath of the coding police should
    you get caught. We discussed a much better way of handling this with helpers on
    page 355.


    Sometimes you need code in a template that doesn''t directly generate any output.
    If you leave the equals sign off the opening tag, the contents are executed, but
    nothing is inserted into the template. We could have written the previous example
    as follows:


    ```

    <%= require ''date''

    DAY_NAMES = %w{ Sunday Monday Tuesday Wednesday

    Thursday Friday Saturday }

    today = Date.today

    %>

    <h1>Hello, Dave!</h1>

    <p>

    It''s <%= DAY_NAMES[today.day] %>.

    Tomorrow is <%= DAY_NAMES[today + 1].day %>.

    ```'
