  md: 'store this session id as a cookie (with the key _session_id) on the user''s
    browser. Because subsequent requests come into the application from this browser.
    Rails can recover the session id.


    Second, Rails keeps a persistent store of session data on the server, indexed
    by the session id. When a request comes in, Rails looks up the data using the
    session id. The data that it finds is a serialized Ruby object. It deserializes
    this and stores the result in the controller''s session attribute, where the data
    is available to our application code. The application can add and modify this
    data to its heart''s content. When it finishes processing each request, Rails
    writes the session data back into the data store. It sits until the next request
    from this browser comes along.


    What should you store in a session? You can store anything, subject to a few restrictions
    and caveats:


    +   - There are some restrictions on what kinds of object you can store in a session.
    The details depend on the storage mechanism you choose (which we''ll look at shortly).
    In the general case, objects in a session must be serializable (using Ruby''s
    Marshal functions). This means, for example, that you cannot store an I/O object
    in a session.


    +   - You probably don''t want to store massive objects in session data—put them
    in the database, and reference them from the session. This is particularly true
    for cookie-based sessions, where the overall limit is 4KB.


    +   - You probably don''t want to store volatile objects in session data. For
    example, you might want to keep a tally of the number of articles in a blog and
    store that in the session for performance reasons. But, if you do, the count won''t
    get updated if some other user adds an article.


    It is tempting to store objects representing the currently logged-in in session
    data. This might not be wise if your application needs to be able to invalidate
    users. Even if a user is disabled in the database, their session data will still
    reflect a valid status.


    Store volatile data in the database, and reference it from the session instead.


    +   - You probably don''t want to store critical information solely in session
    data. For example, if your application generates an order confirmation number
    in one request and stores it in session data so that it can be saved to the database
    when the next request is handled, losing that number if the user deletes the cookie
    from their browser. Critical information needs to be in the database.


