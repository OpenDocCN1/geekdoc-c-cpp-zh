  md: "# Iteration 14: Adding a Sidebar. More Administration Exception\n\ninside a\
    \ transaction, it causes an automatic rollback. By raising the exception if the\
    \ users table is empty after the deletion, we undo the delete and restore that\
    \ last user.\n\nSecond, the exception signals the error back to the controller,\
    \ we use a begin/end block to handle it and report the error to the user in the\
    \ flash. If you want to only abort the transaction but not otherwise signal an\
    \ exception, raise an ActiveRecord::Rollback exception instead, because that is\
    \ the only exception that wasn't passed on ActiveRecord::Base.transaction.\n\n\
    ```\nDownload deploy s/spp/controllers/users_controller.rb\n```\n\n```\ndef destroy\n\
    \  user = User.find(params[:id])\n  begin\n    user.destroy\n    flash[:notice]\
    \ = \"User #{user.name} deleted\"\n  rescue Exception => e\n    flash[:notice]\
    \ = e.message\n  end\n\n  respond_to do |format|\n    format.html { redirect_to(users_url)\
    \ }\n    format.xml { head :ok }\n  end\n```\n\nThis code has still a potential\
    \ timing issue—it is possible for two administrators to delete the last two users\
    \ if their timing is risky. Fixing this would require more database wizard than\
    \ we have space for.\n\nIn fact, the login system described in this chapter is\
    \ rather rudimentary. Most applications use a plugin to do this. A number of plugins\
    \ are available ready-made solutions which are not more comprehensive than the\
    \ authentication shown here, but generally require less code and effort on your\
    \ part to use. See Section 26.5, Finding more on RailsPlugins.org on page 440\
    \ for a couple of examples.\n\n# What We Just Did\n\nBy the end of this iteration,\
    \ we've done the following:\n\n+   - We created a virtual attribute representing\
    \ the plain-text password and coded it to create the hashed version whenever the\
    \ plain-text version is updated.\n- We controlled access to the administration\
    \ functions before filters to invoke an authorize method.\n- We saw how to use\
    \ rails console to interact directly with a model (and dig us out of a hole after\
    \ we deleted the last user).\n- We saw how a transaction can help prevent deleting\
    \ the last user."
