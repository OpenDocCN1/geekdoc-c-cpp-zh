  md: '# Iteration B2: Unit Testing OF MODELS


    important one, because it lets us see that all the testing infrastructure is in
    place.


    # A Real Unit Test


    Let''s get onto the business of testing validation. First, if we create a product
    with no attributes set, we''ll expect it to be invalid and for there to be an
    error associated with each field. We can use the model''s `valid?` and `invalid`
    methods to see whether it validates, and we can use the error list to see whether
    or not there is an error associated with a particular attribute.


    Now that we know `what` to test, we need to know `how` to tell the test framework
    whether our code passes or fails. We do that using `assertions`. An assertion
    is a simple method that tells the framework what we expect to be true. The simplest
    assertion is the method `assert`, which expects its argument to be true. If it
    is not, nothing special happens. However, if the argument to assert fails, the
    assertion fails. The framework will output a message and stop executing the test
    method containing the failure. In our case, we expect that an empty Product will
    not pass validation, so we can express that expectation by asserting that it''s
    not valid.


    ```

    assert product.invalid?

    ```


    Let''s write the full test:


    ```

    Download depot_c/test/unit/product_test.rb

    ```


    ```

    test "Product attributes must not be empty" do

    product = Product.new

    assert product.invalid?

    assert product.errors[:title].any?

    assert product.errors[:description].any?

    assert product.errors[:price].any?

    assert product.errors[:image url].any?

    end

    ```


    We can rerun the test units by using the command rake test:units. When we do so,
    we now see two tests executed (the original truth test and our new test):


    ```

    depot> rake test:units

    Loaded suite lib/rake/rake_test_loader

    Started


    Finished in 0.092314 seconds.

    1 tests, 5 assertions, 0 failures, 0 errors

    ```


    Sure enough, the validation kicked in, and all our assertions passed.


    Clearly at this point we can dig deeper and exercise individual validations.

    Let''s look at three of the many possible tests.'
