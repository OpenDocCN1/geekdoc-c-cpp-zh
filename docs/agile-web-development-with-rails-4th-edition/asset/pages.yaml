  md: "Rails, however, eliminates this duplication with the *partial-page* templates\
    \ (more frequently called *partials*). You can think of a partial as a kind of\
    \ subtitle. You invoke it one or more times from within another template, potentially\
    \ passing objects to it as parameters. When the partial template finishes rendering,\
    \ it returns control to the calling template.\n\nInternally, a partial template\
    \ looks like any other template. Externally, there's a slight difference. The\
    \ name of the file containing the partial code must start with an underscore character,\
    \ differentiating the source of partial templates from their more complete brothers\
    \ and sisters.\n\n```\n<div class=\"article\">\n  <div class=\"articleheader\"\
    >\n    <h3>% article.title %></h3>\n  </div>\n  <div class=\"articlebody\">\n\
    \    <%= article.body %>\n  </div>\n</div>\n```\n\nOther templates use the `render(:partial\
    \ => ...)` method to invoke this:\n\n```\n<%= :partial => \"article\", :object\
    \ => @an_article %>\n<h3>Add Comment</h3>\n```\n\nThe *partial* parameter to render\
    \ is the name of the template to render (without the leading underscore). This\
    \ name must be a both filename and a valid Ruby identifier (so a-b and 200425\
    \ are not valid names for partials). The *object* parameter identifies an object\
    \ to be passed into the partial. This object will be available within the template\
    \ via a local variable with the same name as the template. In this example, the\
    \ `@an_article` object will be passed to the template, and the template can access\
    \ it using the local variable `article`. That's why you could write things as\
    \ `article.title` in the partial.\n\nIdiomatic Rails developers use a variable\
    \ named after the template (`article` in this instance). In fact, it's normal\
    \ to take a step further. If the object is to be passed to the partial in a controller\
    \ instance variable with the same name as the partial, you can use the `object`\
    \ parameter. If, in the previous example, our controller had set up the article\
    \ variable in the instance variable `@article`, the view could have rendered the\
    \ partial using just this:\n\n```\n<%= render(:partial => 'article') %>\n<h3>Add\
    \ Comment</h3>\n```"
  merge: -1
  pgno: 366
- img_proc: true
  md: "You can set additional local variables in the template by passing a locals\
    \ parameter. This takes a hash where the entries represent the names and values\
    \ of the locals variables to set.\n\n```\nrender(:partial => 'article',\n  object\
    \ => @article,\n  locals => { :authorized_by => session[:user_name],\n       \
    \     :from_ip => request.remote_ip })\n```\n\n# Partials and Collections\n\n\
    Applications commonly need to display collections of formatted entries. A blog\
    \ might show series of articles, each with text, author, date, and so on. A store\
    \ might display entries in a catalog, where each has an image, a description,\
    \ and a price.\n\nThe :collection parameter to render works in conjunction with\
    \ the :partial parameter. The :partial parameter lets us use a partial to define\
    \ the format of an individual entry, and the :collection parameter applies this\
    \ template to each member of previously defined _article. To display a list of\
    \ model objects using our _article.html.erb partial, could write this:\n\n```\n\
    <%= render(:partial => 'article', :collection => @article_list) %>\n```\n\nInside\
    \ the partial, the local variable will be set to the current article from the\
    \ collection—the variable is named after the template. In addition, the variable\
    \ article_counter will be set to the index of the current article in the collection.\n\
    \nThe optional :spacer_template parameter lets you specify a template that will\
    \ be rendered between each of the elements in the collection. For example, a view\
    \ might contain the following:\n\n```\nDownload e1/views/app/views/partial/list.html.erb\n\
    <%= render(:partial => \"animal\",\n  :collection => @ant bee cat dog elk j,\n\
    \  :spacer_template => \"spacer\") %>\n```\n\nThis uses _animal.html.erb to render\
    \ each animal in the list, rendering the _spacer.html.erb between each. If _animal.html.erb\
    \ contains:\n\n```\nDownload e1/views/app/views/partial/animal.html.erb\n<p>The\
    \ animal is <%= animal %></p>\n```\n\nand_spacer.html.erb contains this:\n\n```\n\
    Download e1/views/app/views/partial/spacer.html.erb\n<hr />\n```\n\nyour users\
    \ would see a list of animal names with a line between each."
