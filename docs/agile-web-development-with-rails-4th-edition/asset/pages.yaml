  md: 'In this chapter, we''ll see


    +   - reviewing Rails concepts: model, view, controller, configuration, testing,
    and deployment.

    - links to places for further exploration.


    #  Chapter 27


    # # Where to Go From Here


    Congratulations! We''ve covered a lot of ground together.


    In part I, you installed Rails, verified the installation using a simple application,
    exposed to the architecture of rails, and got acquainted (reacquainted) with the
    Ruby language.


    In part II, you iteratively built an application, building up test cases along
    the way, and ultimately deploying it using Capistrano. We designed this application
    to touch on all of the aspects of Rails that every developer needs to be aware
    of.


    Whereas Parts I and II of this book served a single purpose, part III of this
    book served a dual role.


    For some of you, Part III methodically filled in the gaps and covered enough for
    you to get real work done. For others, this will be the first steps of a much
    longer journey.


    For most of you, the real value is a bit of both. A firm foundation is required
    in order for you to be able to explore further. And that''s why we started this
    part with a chapter which not only covered the convention and configuration of
    rails, but also with the generation of documentation.


    Then we proceeded to devote a chapter to Model, Views, and Controller which are
    the backbone of the Rails architecture. We covered topics ranging from database
    relationships to the REST architecture to HTML forms and helpers.


    We covered migration and caching as essential maintenance and tuning aspects of
    a deployed application.


    Finally, we split Rails apart and explored the concept of gems from a number of
    different perspectives: from making use of individual Rails components sep-'
  merge: -1
  pgno: 442
- img_proc: true
  md: 'arately, to making full use of the foundation upon which Rails is built, and
    finally to building out and extending the framework to suit your needs.


    At this point, you have the necessary context and background to explore deeper
    into whatever cases suit your fancy or are needed to solve that vexing problem
    you face. We recommend that you start by visiting the rubyonrails site.¹ and exploring
    each of the links across the top of that page. Some of these will be quick refreshers
    of materials presented in this book, but you will also find plenty of links to
    current information on how report problems, learn more, and keep up to date.


    Additionally, please continue to contribute to the wiki and forums mentioned in
    the book''s Introduction.


    Pragmatic Bookshelf has more books on Ruby and Rails subjects.² There also are
    plenty of related categories that go beyond Ruby and Rails, such as *Agile Practices,
    Testing, Design, and Cloud Computing,* and *Tools. Frameworks, Languages.* You
    can find these and other categories at http://www.prprog.com/categories.


    We hope you have enjoyed learning about Ruby on Rails as much as we have in producing
    this book!


    +   1. http://rubyonrails.org/


    +   2. http://www.prprog.com/categories/ruby_and_rails'
