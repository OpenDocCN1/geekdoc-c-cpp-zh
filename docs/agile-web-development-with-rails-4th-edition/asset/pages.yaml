  md: "But if our application has taken to storing data like 'new' in this column,\
    \ the down migration will lose it—'new' can't be converted to an integer. If that's\
    \ acceptable, then the migration is acceptable as it is. However, if we want to\
    \ create a one-way migration—one that cannot be reversed—we'll want to stop the\
    \ down migration from being applied. In this case, Rails provides a special exception\
    \ that we can throw:\n\n```\nclass OrderObjectType < ActiveRecord::Migration\n\
    \  def self.up\n    change_column :orders, :order_type, :string, :null => false\n\
    \  end\n```\n\n```\n  def self.down\n    raise ActiveRecord::IrreversibleMigration\n\
    \  end\n```\n\n# ## 23.3 Managing Tables\n\nSo we've been using migrations to\
    \ manipulate the columns in existing tables. Now let's look at creating and dropping\
    \ tables:\n\n```\nclass CreateOrderHistories < ActiveRecord::Migration\n  def\
    \ self.up\n    create_table :order_histories do |t|\n      t.integer :order_id,\
    \ :null => false\n      t.text :notes\n      t.timestamps\n    end\n```\n\n```\n\
    \  def self.down\n    drop_table :order_histories\n  end\n```\n\ncreate_table\
    \ takes the name of a table (remember, table names are plural) and a block.\n\n\
    The calls to the various table definition methods should look familiar—they are\
    \ similar to the add_column method we used previously except these methods don't\
    \ take the name of the table as the first parameter and the name of the method\
    \ is the data type desired. This reduces repetition.\n\nNote that we don't define\
    \ the id column for our new table. Unless we say otherwise, Rails automatically\
    \ adds a primary key to all tables it create. For a deeper discussion of this,\
    \ see Section 23.3 Primary Keys, on page 397."
