  md: '# David Says...


    To Raise, or Not Raise?


    When you use a finder driven by primary keys, you''re looking for a particular
    record. Expect it to exist. A call to Person.find(5) is based on our knowledge
    of the people. We want the row with an id of 5. If this call is unsuccessful—if
    the record with the id of 5 has been destroyed—we''re in an exceptional situation.
    This mandates the raising of an exception. Rails raises RecordNotFound.


    On the other hand, finders use criteria to search for a match. So, Person.where(name=
    ''Dave'') is the equivalent of telling the database (as a black box) "Give me
    the first person that has the name Dave." exhibits a distinctly different approach
    to retrieval; we''re not certain until we''ll get a result. It''s entirely possible
    the result set be empty, returning nil in the case of finders that search for
    one row and an empty array for finders that search for many rows is the natural,
    exceptional response.


    # Reading Existing Rows


    Reading from a database involves specifying which particular rows of data you
    are interested in—you''ll give Active Record some kind of criteria, and it will
    return objects containing data from the row(s) matching the criteria.


    The simplest way of finding a row in a table is by specifying its primary key.
    Every model class supports the find method, which takes one or more key values.
    If given just one primary key, it returns an object containing data for the corresponding
    row (or throws a RecordNotFound exception). If multiple primary key values, it
    returns an array of the corresponding objects. Note that in this case a RecordNotFound
    exception is raised if any of the ids cannot be found (or if the method returns
    without raising an error, the length of the resulting array will be equal to the
    number of ids passed as parameters)


    ```

    an_order = Order.find(27) # find the order if id = 27

    ```


    ```

    # Get a list of ids from a form, then

    # sum the total price

    product_list = params[:product_ids]

    total = Product.find(product_list).sum(:price)

    ```


    Often, you need to read in rows based on criteria other than their primary key.
    Active Record provides a range of options for performing these queries. We''ll
    start looking at an alternate way to express simple queries where clauses, and
    then look at ways to modify the queries Rails generates for you.


    ![](img/79be11dd96f63a00f9795e2dfe232ef5_287_0.png)'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Dynamic Finders


    Probably the most common search performed on databases is to return row or rows
    where a column matches a given value. A query might return all the orders for
    Dave or get all the blog posts with a search of "Rails Rocks." In many other languages
    and frameworks, you construct SQL queries to perform these searches. Active Record
    uses Ruby''s dynamic power to do this for you.


    For example, an Order model has attributes such as name, email, and address. We
    can use these names in finder methods to return rows where the corresponding columns
    match value:


    ```

    order = Order.find_by_name("Dave Thomas")\orders = Order.find_all_by_name("Dave
    Thomas")\orders = Order.find_all_by_email(params[''email''])"

    ```


    If you invoke a class method where the method name starts with by_, last_by_,
    or find_all_by_, Active Record converts it to a finder, using the rest of the
    method''s name to determine the column to be checked. Thus, the case to this:


    ```

    order = Order.find_by_name("Dave Thomas")

    ```


    (is) effectively converted by Active Record into this:


    ```

    order = Order.where(:name => "Dave Thomas").first

    ```


    Similarly, to find_all_by_xxx and find_last_by_xxx substitute calls to all and
    last respectively for the implicit call to first.


    Appending a bang (!) character to the find_by_ call will raise an ActiveRecord::RecordNotFound
    exception instead of returning nil if it can''t find a matching record:


    ```

    order = Order.find_by_name("Dave Thomas")

    ```


    The magic doesn''t stop. Active Record will create finders that search on multiple
    columns. For example, you could write this:


    ```

    user = User.find_by_name_and_password(name, pw)

    ```


    This is equivalent to following:


    ```

    user = User.where(:name => name, :password => pw).first

    ```


    To determine the names of the columns to check, Active Record simply simplifies
    the name that follows the find_by_ or find_all_by_ around the string _and_. This
    is good enough most of the time but breaks down if you have a column name such
    as tax_and_shipping. In these cases, you''ll have to use other methods to construct
    the clause.'
