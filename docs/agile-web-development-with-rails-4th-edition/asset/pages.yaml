  md: "In this chapter, we'll see\n\n+   - linking tables with foreign keys.\n- using\
    \ belongs_to, has_many, :through.\n- creating forms based on models (form_for),\n\
    - linking forms, models, and views,\n- installing and using plugins,\n- generating\
    \ a feed using atom_helper on model objects.\n\n# Chapter 12\n\n# Task G: Check\
    \ Out!\n\nLet's take stock. So far, we've put together a basic product administration\
    \ system, we've implemented a catalog, and we have a pretty spiffy-shopping cart.\
    \ So, now we need to let the buyer actually purchase the contents of that cart.\
    \ Let's implement the checkout function.\n\nWe're not going to go overboard here.\
    \ For now, all we'll do is capture the customer's contact details and payment\
    \ option. Using these we will construct an order in the database. Along the way,\
    \ we'll be looking a bit more at models, validation, and form handling.\n\n# 12.1\
    \ Iteration G1: Capturing an Order\n\nAn order is a set of line items, along with\
    \ details of the purchase transaction. Our cart already contains line_items all\
    \ we need is to add an order_id column to the line_items table, and create an\
    \ orders table based on the diagram on page 78, combined with a brief chat with\
    \ our customer.\n\nFirst we create the order model and update the line_items table:\n\
    \n```\ndepot> rails generate scaffold order name:string address:text \\\nemail:string\
    \ pay_type:string\n---\n```\n\n```\ndepot> rails migration add_order_id_to_line_item\
    \ \\\norder_id:integer\n```\n\nNow that we've created the migrations, we can apply\
    \ them:\n\n```\ndepot> rake db:migrate\n== CreateOrders: migrating ====================================\n\
    -- create_table(:orders)\n  -> 0.0014s\n== CreateOrders: migrated (0.0015s) =========================================\n\
    ```\n\n```\n== AddOrderIdToLineItem: migrating ======================================\n\
    -- add_column(:line_items, :order_id, :integer)\n  -> 0.0008s\n```"
