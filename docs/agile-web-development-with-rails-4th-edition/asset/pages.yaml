  md: "You can also redo one or more migrations:\ndepot> rake db:migrate:redo STEP=3\n\
    \nBy default, redo will roll back one migration and rerun it. To roll back multiple\
    \ migrations, pass the STEP= parameter.\n\n# 23.2 Anatomy of a Migration\n\nMigrations\
    \ are subclasses of the Rails class ActiveRecord::Migration. The class you should\
    \ create contains at least the two class methods up and down:\n\n```\nclass SomeMeaningfulName\
    \ < ActiveRecord::Migration\n  def self.up\n    # ...\n  end\n```\n\n```\n  def\
    \ self.down\n    # ...\n  end\n```\n\nThe name of the class, after all uppercase\
    \ letters are downcased and preceded by an underscore, must match the portion\
    \ of the filename after the version number. For example, the previous class could\
    \ be found in a file named 2011021100017_some_meaningful_name.rb. No two migrations\
    \ can contain classes with the same name.\n\nThe up method is responsible for\
    \ applying the schema changes for this migration, while the down method undoes\
    \ those changes. Let's make this more concrete. Here is a migration that adds\
    \ an e_mail column to the orders table:\n\n```\nclass AddEmailToOrders < ActiveRecord::Migration\n\
    \  def self.up\n    add_column :orders, :e_mail, :string\n  end\n```\n\n```\n\
    \  def self.down\n    remove_column :orders, :e_mail\n  end\n```\n\nSee how the\
    \ down method undoes the effect of the up method?\n\n# Column Types\n\nThe third\
    \ parameter to add_column specifies the type of the database column. In the previous\
    \ example, we specified that the e_mail column has a type of string. But just\
    \ what does this mean? Databases typically don't have column types of :string."
