  md: "# 11.1 Iteration F1: Moving the Cart\n\nCurrently, our cart is rendered by\
    \ the show action in the CartController and the corresponding .html.erb template.\
    \ What we'd like to do is to move rendering into the sidebar. This means it will\
    \ no longer be in its own page. Instead, we'll render it in the layout that displays\
    \ the overall catalog. And that's easy, using partial templates.\n\n# Partial\
    \ Templates\n\nProgramming languages let you define methods. A method is a chunk\
    \ of code with a name: you invoke the method by name, and the corresponding chunk\
    \ of code runs. And, of course, you can pass parameters to a method, which lets\
    \ you write just one piece of code that can be used in many different circumstances.\n\
    \nYou can think of Rails partial templates (partials for short) as a kind of method\
    \ for views. A partial is simply a chunk of a view in its own separate file. You\
    \ can invoke (render) from another partial or from a controller, and the partial\
    \ will render itself and return the results of that rendering. And, just as with\
    \ methods, you can pass parameters to a partial, so that same partial can render\
    \ different results.\n\nWe'll use partials in this iteration. First, let's look\
    \ at the cart display itself:\n\n```\n<div class=\"cart-title\">Your Cart</div>\n\
    <table>\n  <% for item in @cart.line_items %>\n  <tr>\n    <td><%= item.quantity\
    \ %>&amp;times;</td>\n    <td><%= item.product.title %></td>\n    <td><td class=\"\
    item-price\"><%= number_to_currency(item.total_price) %></td></td></td></td>\n\
    \  </tr>\n  <% end %>\n\n  <tr class=\"total_line\">\n    <td colspan=\"2\">Total</td>\n\
    \    <td class=\"total_cell\"><%= number_to_currency(@cart.total_price) %></td>\n\
    \  </tr>\n</table>\n```\n\n```\n<%= button_to 'Empty cart', @cart, :method =>\
    \ :delete, :confirm => 'Are you sure?' %>\n```\n\nIt creates a list of rows, one\
    \ for each item in the cart. When you find yourself iterating like this, you might\
    \ want to stop and ask yourself, is this too much logic in a template? It turns\
    \ out we can avoid the loop using partials (and, as we'll see, this also sets\
    \ the stage for Ajax may later)."
