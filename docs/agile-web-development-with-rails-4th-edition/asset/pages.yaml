  md: 'In this chapter, we''ll see


    +   - caching full pages statically,

    - caching the results of an action,

    - expiring pages from the cache,

    - caching a part of a page.


    # Chapter 22


    # Caching


    Many applications seem to spend a lot of their time doing the same task over and
    over. A blog application renders the list of current articles for every visitor.
    A store application will display the same page of product information for everyone
    who requests it.


    All this repetition costs us resources and time on the server. Rendering the front
    page of your site may require half a dozen database queries, and may end up running
    through a number of Ruby methods and Rails templates. It''s not a big deal for
    an individual request, but multiply by several thousand hits an hour, and suddenly
    your server is starting to glow a dull red. Your users will see this as a slower
    response times.


    In situations such as these, we can use caching to greatly reduce the load on
    our servers and increase the responsiveness of our applications. Rather than generate
    the old content from scratch time after time, we create once and remember the
    result. The next time a request arrives for that same page, we deliver it from
    the cache rather than create it.


    Rails offers three approaches to caching: page caching, action caching and fragment
    caching.


    # 22.1 Page Caching


    Page caching is the simplest and most efficient form of Rails caching. The first
    time a user requests a particular URL, our application gets invoked and generates
    a page of HTML. The contents of that page are stored in the cache. The next time
    a request containing that URL is received, the HTML of the page will be delivered
    straight from the cache. Your application never sees the request. In fact, Rails
    is not involved at all. The web server itself handles the entire request, which
    makes page caching very, very efficient. Your application'
