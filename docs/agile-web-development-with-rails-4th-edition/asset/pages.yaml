    mechanism—set this to a class that implements the storage strategy. This class
    must be defined in CGI::Session module. You use symbols to name the session storage
    strategy; the symbol is converted into a CamelCase name.


    ```

    session_store = :cookie_store

    ```


    This is the default session store mechanism used by Rails, starting with version
    2.0. This format represents objects in their marshaled format, which allows any
    serializable data to be stored in sessions but is limited to 4KB total. This is
    the option we used in the Depot application.


    ```

    session_store = :p_store

    ```


    Data for each session is stored in a flat file in PStore format. This format'
