    # # Active Record


    Active Record is the object-relational mapping (ORM) layer supplied with Rails.
    It is the part of Rails that implements your application’s model.


    In this chapter, we''ll build on the mapping data to rows and columns that we
    did in Depot. Then we''ll look at Active Record to manage table relationships
    and in the process create, read, update, and delete operations (commonly referred
    to in the industry as CRUD methods). Finally, we will dig into the Active Record
    object life cycle (including callbacks and transactions).


    # ## 19.1 Defining your Data


    In Depot, we defined a number of models, including one for an Order. This particular
    model has a number of attributes, such as an email address of type String. In
    addition to the attributes that we defined, Rails provides an attribute named
    id that contains the primary key for the record. Rails also provides several additional
    attributes, including attributes that track when each row was updated. Rails supports
    relationships between models, such as the relationship between Orders and Line
    Items.


    When you think about it, Rails provides a lot of support for models. Lets examine
    each in turn.


    # ### Organizing Tables and Columns


    Each subclass of ActiveRecord::Base, such as our Order class, wraps a separate
    database table. By default, Active Record assumes that the name of the table associated
    with a given class is the plural form of the class. If the class name contains
    capitalized words, the table name is assumed to have underscores between these
    words.'
