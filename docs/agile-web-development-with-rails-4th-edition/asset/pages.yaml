    # # The Architecture of Rails Applications


    One of the interesting features of Rails is that it imposes some fairly serious
    constraints on how you structure your web applications. Surprisingly, these constraints
    make it easier to create applications—a lot easier. Let''s see why.


    # ## 3.1 Models, Views, and Controllers


    Back in 1979, Tryve Reenskaug came up with a new architecture for developing interactive
    applications. In his design, applications were broken into three types of components:
    models, views, and controllers.


    **The model** is responsible for maintaining the state of the application. Sometimes
    this state is transient, lasting for just a couple of interactions with the user.
    Sometimes the state is permanent and will be stored outside the application, often
    in a database.


    A model is more than just data; it enforces all the rules that apply to that data.
    For example, if a discount shouldn''t be applied to orders less than $20, the
    model will enforce the constraint. This makes sense; by putting the implementation
    of these business rules in the model, we make sure that nothing in the application
    can make our data invalid. The model acts as both a gatekeeper and a data store.


    *The view* is responsible for generating a user interface, normally based on data
    in the model. For example, an online store will have a list of products to be
    displayed on a catalog screen. This list will be accessible via the view that
    accesses the list from the model and formats it for the end user. Although the
    view may present the user with various ways of inputting data, the view itself
    never handles incoming data. The view''s work is done once the data is displayed.
    There may be many views that access the same model data, often for different purposes.
    In the online store, there''ll'
