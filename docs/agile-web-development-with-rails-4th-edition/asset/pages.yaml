  md: "Ideal to place for books — like this one — where some knowledge of HTML may\
    \ be presumed, by many of the readers are to Rails and to Ruby itself. The last\
    \ thing you would want to do in that situation is to introduce yet another language.\n\
    \nBut now that you past that learning curve, lets go ahead and explore a new language—one\
    \ that more closely integrates the production of markup with Ruby code, namely\
    \ HTML Abstraction Markup Language (Haml).\n\nTo start with, let's refresh the\
    \ file we just looked at:\n\n```\n$ rm ap app/views/store/index.html.erb\n\nIn\
    \ its place, create a new file:\n```haml\ndep_v/app/views/store/index.html.haml\n\
    \nif notice\n  %p#notice= notice\n\n%h1 t=('.title_html')\n\n@products.each do\
    \ |entry|\n  = image_tag(product.image_url)\n  %h3 product.title\n  = sanitize(product.description)\n\
    \  %price_line\n    %span.price= number_to_currency(product.price)\n    = button_to(t('.add_html'),\
    \ line_items_path(:product_id => product.id),\n      :remote => true)\n```\n```\n\
    \nThe new extension: html.haml. This indicates that the template is a Haml template\
    \ instead of an ERB template.\n\nThe first thing you should notice is that the\
    \ file is considerably smaller. Here's a quick overview of what is going on, based\
    \ on what the first character is on each line:\n\n+   - dashes indicate a Ruby\
    \ statement that does not produce any output\n- percent signs (%) indicate an\
    \ HTML element.\n- equals signs (=) indicate a Ruby expression that does produce\
    \ output to be displayed. This can be used on either lines by themselves or following\
    \ HTML elements.\n- dots and hash (#) characters can be used to define class and\
    \ attributes respectively. This can be combined with percent signs, or used standalone.\
    \ When used by itself, a div is implied.\n- A comma at the end of a line containing\
    \ an expression implies a continuation. In the example above, the button_to call\
    \ is continued across two lines"
