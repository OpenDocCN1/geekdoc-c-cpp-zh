- img_proc: true
  md: 'We created filters which were run before selected actions to authorise requests.


    We placed logic common to a number of controllers in the common base class for
    all controllers, namely ApplicationController.


    We managed sessions, keeping track of the logged in user (for administrators)
    and carts (for customers). We kept track of the current locale used for inter-national-ization
    of our output. We captured errors, logged them, and informed the user via notices.
    We paginated orders through the use of the will_paginate plugin.


    We also sent confirmation emails on receipt of an order.


    # Configuration


    While conventions keep to a minimum the amount of configuration required for a
    Rails application, we did do a bit of customization.


    We modified our database configuration in order to use MySQL in production.


    We defined routes for our resources, our admin and session controllers, as well
    as the root of our website, namely our storefront. We defined a who_bought member
    of our products resource in order to access Atom feeds which contain this information.


    We created an initializer for i18n purposes, and updated the locales informa-tion
    for both English (en) and Spanish (es).


    We created seed data for our database.


    We created a Capistrano script for deployment, including the definition of a few
    custom tasks.


    # Testing


    We maintained and enhanced tests throughout.


    We employed unit tests to validation methods. We also tested increasing the quantity
    on a given line item.


    Rails provided basic tests for all of our scaffolded controllers, we main-tained
    as we changes. We added tests along the way for things such as AJAX and ensuring
    that a cart has items before we create an order.


    We used fixtures to test data to fuel our tests.


    Finally, we created an integration test to test an end-to-end scenario involving
    a user adding a product to a cart, entering an order, and receiving a confirma-tion
    email.'
