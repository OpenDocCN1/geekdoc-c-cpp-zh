    Forms and uploads are just two examples of helpers that Rails provides. Next we
    will show how you can provide your own helpers, and introduce to you a number
    of other helpers that code with Rails.


    # 21.5 Using Helpers


    Earlier we said that it’s OK to put code in templates. Now we’re going to modify
    that statement. It’s perfectly acceptable to put some code in templates—that’s
    what makes them dynamic. However, it’s poor style to put too much code in templates.


    There are three main reasons for this. The first, the code you put in the view
    side of your application, the easier it is to let discipline slip and start adding
    application-level functionality to the template code. This is definitely poor;
    you want to put application stuff in the controller and model layers so that it
    is available everywhere. This will pay off with adding new ways of viewing the
    application.


    The second reason is that `erb` is basically HTML. When you edit it, you’re editing
    an HTML file. If you have the luxury of having professional designers create your
    layouts, they’ll want to work with HTML. Putting a bunch of code in just there
    makes it hard to work with.'
