  md: 'and do it without a bunch of coding or configuration hassle. As you''ll see,
    Ruby on Rails shines when it comes to dealing with change—it''s an ideal agile
    programming environment.


    Along the way we will be building and maintaining a corpus of tests. These tests
    will ensure that the application is always doing what we intend to do. Rails not
    only enables the creation of such tests, it actually provides you with an initial
    set of tests each time you define a new controller.


    With the application.


    # 5.2 What Depot Does


    Let''s start by jotting down an outline specification for the Depot application.
    We''ll look at the high-level use cases and sketch out the flow through the web
    pages. We''ll also try working out what data the application needs (acknowledging
    that our initial guesses will likely be wrong).


    # Use Cases


    A case is simply a statement about how some entity uses a system. Consultants
    invent these kinds of phrases to label things we''ve known all along—it''s a perversion
    of business life that fancy words cost more than plain ones, even though the plain
    ones are more valuable.


    Depot''s use cases are simple (some would say tragically). We start off by identifying
    two different roles as actors: the buyer and the seller.


    The user buys products to the browse we have to sell, select some to purchase,
    and supply the information needed to create an order.


    The seller users maintain a list of products to sell, to determine the orders
    that are awaiting shipping, and to mark orders as shipped. (The seller also uses
    Depot to make deals of money and retire to a tropical island, but that''s the
    subject of another book.)


    For now, that''s all the detail we need. We could go excavating detail about what
    it means to maintain products and what constitutes an order ready to ship, but
    why bother? If there are details that aren''t obvious, we''ll discover them soon
    enough as we reveal successive iterations of our work to the customer.


    Talking of getting feedback, let''s not forget to get some right now—let''s sure
    our initial (admittedly sketchy) use cases are on the mark by asking our user.
    Assuming the use cases pass muster, let''s work out how the application will work
    from the perspectives of its various users.'
