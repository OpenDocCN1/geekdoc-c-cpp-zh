  md: "# ITERATION 12: AUTHENTICATING USERS\n\n```\n<= form_tag %>\n<fieldset>\n \
    \ <legend>Please Log In</legend>\n  <div>\n    <label for=\"name\">Name:</label>\n\
    \    <%= text_field_tag :name, params[:name] %>\n  </div>\n  <div>\n    <label\
    \ for=\"password\">Password:</label>\n    <%= password_field_tag :password, params[:password]\
    \ %>\n  </div>\n  <div>\n    <%= submit_tag \"Login\" %>\n  </div>\n</fieldset>\n\
    <% end %>\n```\n\nThis form is different from others we saw earlier. Rather than\
    \ using form_for, it uses form_tag, which simply builds a regular HTML <form>.\
    \ Inside that form, it uses text_field_tag and password_field_tag, two helpers\
    \ to create HTML input tags. Each takes two parameters. The first is the name\
    \ to give to the field, and the second is the value with which to populate the\
    \ field. This style of form allows us to associate values in the params structure\
    \ directly with fields no model object is required. In our case, we chose to use\
    \ the params object directly in the form. An alternative would be to have the\
    \ controller set instance variables.\n\nSee Figure 14.2, on the next page. Note\
    \ how the value of the form field is communicated between the controller and the\
    \ view using the params hash: the view gets the value to display in the field\
    \ from params[:name], and when the user submits the form, the new field value\
    \ is available to the controller the same way.\n\nIf the user successfully logs\
    \ in, we store the id of the user record in the session data. We'll use the presence\
    \ of that value in the session as a flag to indicate that an admin user is logged\
    \ in.\n\nAs you might expect, the controller actions for logging out are considerably\
    \ simpler:\n\n```\nDownload depot_r/app/controllers/sessions_controller.rb\ndef\
    \ destroy\n  session[:user_id] = nil\n  redirect_to_store_url, :notice => \"Logged\
    \ out\"\nend\n```\n\nReport erratum this copy is (B11.0 printing, November 24,\
    \ 2010)."
