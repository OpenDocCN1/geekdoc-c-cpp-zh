  md: "The get template contains the form that uploads the picture (along with a comment).\
    \ Note how we override the encoding to allow data to be sent back with the response:\n\
    \n```\nDownload  el/app/views/upload/get.html.erb\n```\n\n```\n<%= error_messages_for(\"\
    picture\") %>\n<%= form_for(:picture, \n  url => { action => 'save' },\n  html\
    \ => { multipart => true } ) do |form| %>\n\nComment:\n<%= form.text_field(\"\
    comment\") %>\nUpload your picture: <%= form.file_field(\"uploaded_picture\")\
    \ %>\n<%= submit_tag(\"Upload file\") %>\n<% end %>\n```\n\nThe form has one subtle\
    \ pretty. However, the database table doesn't contain an attribute named uploaded_picture.\
    \ That means that there must be some magic happening in the model.\n\n```\nDownload\
    \  el/views/app/models/picture.rb\n```\n\n```\nclass Picture < ActiveRecord::Base\n\
    \  validates_format_of :content_type,\n    with => /image/,\n    message => \"\
    --- you can only upload pictures\"\n\n  def uploaded_picture(picture_field)\n\
    \    self.name = base_part_of(picture_field.original_filename)\n    self.content_type\
    \ = picture_field.content_type.chomp\n    self.data = picture_field.read\n  end\n\
    \n  def base_part_of(file_name)\n    File.basename(file_name).gsub(/^\\w\\-]/,\
    \ '')\n  end\n```\n\nWe define an accessor uploaded_picture=(picture) to receive\
    \ the file uploaded by the form. The object returned by the form is an interesting\
    \ hybrid. It is fileike, so we can read its contents with the read method; that's\
    \ how we get the image data into the data column. It also has the attributes content_type\
    \ and original_filename, which let us get to the uploaded file's metadata. Accessor\
    \ methods pick all this part, resulting in a single object stored as separate\
    \ attributes in the database.\n\nNote that we also add a simple validation to\
    \ check that the content type is of the image. We don't want someone uploading\
    \ JavaScript.\n\nThe save action in the controller is totally conventional:"
