    \ :sidebar to include this block into the page's sidebar:\n\n```\n<!DOCTYPE ....\
    \ >\n<html>\n<body>\n  <div class=\"sidebar\">\n    <p>\n      Regular sidebar\
    \ stuff\n    </p>\n    <div class=\"page-specific-sidebar\">\n      <%= yield\
    \ :sidebar %>\n    </div>\n  </div>\n</body>\n</html>\n```\n\nThis technique can\
    \ be used to add page-specific JavaScript functions into the <head> section of\
    \ a layout, create specialized menu bars, and so on.\n\n# Partial-Page Templates\n\
    \nWeb applications commonly display information about the application object or\
    \ objects on multiple pages. A shopping cart might display an order line item\
    \ on the shopping cart page and again on the order summary page. A blog application\
    \ might display the contents of an article on the main index page and again at\
    \ the top of a page soliciting comments. Typically this would involve copying\
    \ snippets of code between different template pages."
