    # 12.3 Iteration G3: Pagination


    At the moment, we have a few products, a few carts at any time, a few line items
    for cart or order, but we can essentially an unlimited number of Orders, and we
    hope to have many. Enough so that displaying all of them on orders page will quickly
    become unwieldy. The will_paginate plugin. This plugin extends rails to provide
    this much needed function.


    Why a plugin? Back in Rails 1.0, this functionality was a part of Rails itself.
    But there were competing ideas on how this could be implemented and the function
    was broken out in order to enable innovation to thrive.


    The first thing we need to do is to inform Rails of our intent to use the plugin.
    We do that by modifying the Gemfile. We need to specify that we want a version
