  md: "Rails filters allow you to intercept calls to action methods, adding your processing\
    \ before they are invoked, after return, or both. In our case, we use a `before_filter`\
    \ to intercept all calls to the actions in our admin controller. The interceptor\
    \ can check `session[:user_id]`. If set and it corresponds to a user in the database,\
    \ the application knows an administrator is logged in, and the call can proceed.\
    \ If it's not set, the interceptor can issue a redirect, in this case to our login\
    \ page.\n\nWhere should we put this method? It could sit directly the admin controller,\
    \ but for reasons that will clearly appear shortly, let's put it instead in ApplicationController,\
    \ the parent class of all our controllers. This is in the file `application_controller.rb`\
    \ in the directory `app/controllers`. Note too that we chose to restrict access\
    \ to this method. This prevents it from ever being exposed to end users as an\
    \ actor.\n\n```\ndepot r/app/controllers/application_controller.rb\nclass ApplicationController\
    \ < ActionController::Base\n  before_filter :authorize\n  protect_from_forgery\n\
    \n  private\n\n  def current_cart\n    Cart.find(session[:cart_id])\n  rescue\
    \ ActiveRecord::RecordNotFound\n    cart = Cart.create\n    session[:cart_id]\
    \ = cart.id\n    cart\n  end\n\n# ...\n```\n\n```\nprotected\n\n  def authorize\n\
    \    unless User.find_by_id(session[:user_id])\n      redirect_to login_url, :notice\
    \ => \"Please log in\"\n    end\n  end\n```\n\nThe `before_filter` line calls\
    \ the authorization to be invoked before every action in our application.\n\n\
    This is going too far. We have just limited access to the store itself to administrators.\
    \ That's not good. We could go back and change things so that we mark only those\
    \ methods that specifically need authorization. Such an approach is called `blacklisting`\
    \ and is prone to error of omission. A much better approach is to \"whitelist\"\
    \ or"
  merge: -1
  pgno: 213
- img_proc: true
  md: "list methods or controllers for which authorization is not required. We do\
    \ simply by inserting a skip_before_filter call within the StoreController:\n\n\
    ```\nclass StoreController < ApplicationController\n  skip_before_filter :authorize\n\
    ```\n\nAnd again for the SessionsController:\n\n```\nclass SessionsController\
    \ < ApplicationController\n  skip_before_filter :authorize\n```\n\nWe're not done\
    \ yet, now we need to allow people to create, update, and delete carts:\n\n```\n\
    class CartsController < ApplicationController\n  skip_before_filter :authorize,\
    \ :only => [:create, :destroy]\n```\n\nCreate line items:\n\n```\nclass LineItemsController\
    \ < ApplicationController\n  skip_before_filter :authorize, :only => :create\n\
    ```\n\nAnd create orders (which includes access to the new form):\n\n```\nclass\
    \ OrdersController < ApplicationController\n  skip_before_filter :authorize, :only\
    \ => [:new, :create]\n```\n\nWith the authorization logic in place, we can now\
    \ navigate to http://localhost:3000/products. The filter method intercepts us\
    \ on the way to the product listing and shows us the login screen instead.\n\n\
    Unfortunately, this change pretty much invalidates most of our functional tests\
    \ as operations we desired. Fortunately, we can address this globally by creating\
    \ a setup method in the test_helper. While we are there, we also define some helper\
    \ methods to login_as and logout a user.\n\n```\nclass ActiveSupport::TestCase\n\
    \  # ...\n\n  # Add more helper methods to be used by all tests here...\n  def\
    \ login_as(user)\n```"
