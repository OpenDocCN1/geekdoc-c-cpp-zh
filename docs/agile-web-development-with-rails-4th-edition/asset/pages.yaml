    \ the unit, functional, and integration tests that Rails generates\nwith the scaffolding.\
    \ They are minimal at this point, but simply knowing\nt are there and that they\
    \ pass should give you confidence. As you proceed\nthrough these chapters in Part\
    \ II, you are encouraged to run this command\nfrequently as it will help you spot\
    \ and track down errors. We will cover this\nmore in Section 7.2, Iteration B2:\
    \ Unit Testing of Models, on page 100.\n\nNote: if you've used a database other\
    \ than SQLite3, this step may have failed.\nCheck your database.yml file and see\
    \ notes 404.\n\n# 6.2 Iteration A2: Making Prettier Lists\n\nOur customer has\
    \ one more request (customers always seem to have one more\nrequest). The listing\
    \ of all the products is ugly. Can we \"pretty it up\" a bit\nAnd, while we're\
    \ in there, can we also display the product image along with\nt image URL?\n\n\
    We're faced with a dilemma here. As developers, we're trained to respond to\n\
    these kinds of requests with a sharp intake of breath, a knowing shake of the\n\
    head, and a murmured \"You want what?\" At the same time, we also like to\\show\
    \ off a bit. In the end, the fact that it's fun to make these kinds of changes\n\
    \ Rails wins out, and we fire up our trusty editor.\n\nBefore we get too far,\
    \ though, it would be nice if we had a consistent set\ndata to work with. We could\
    \ use scaffold-generated interface and type\ndata in from the browser. However,\
    \ if we did this, future developers working\non our codebase would have to do\
    \ the same. And, if we were working as part\na team on this project, each member\
