    \ magnitude at RailsPlugins.org,⁴ which at the current time includes over 500\
    \ plugins listed, most – but not all – of which works with Rails 3.\n\nHere's\
    \ a few more to explore, grouped by categories:\n\n+   * Some plugins implement\
    \ behavior which was previously in the core of Rails, and has been moved out.\
    \ For an example, pagination was originally a core function of Rails, was subsequently\
    \ moved out to a plugin named classic_pagination,⁵ It has all but been replaced\
    \ by the will_paginate that we use in Section 12.3, Iteration 3: Pagination, on\
    \ page 181. Others, like acts_as_tree,⁶ have thrived as plugins. And and still\n\
    \n+   4. http://www.railsplugins.org/plugins\n5. https://github.com/masterclass/classic_pagination/readme\n\
    6. https://github.com/rails/acts_as_tree/readme\n\nReport erratum\nthis copy is\
