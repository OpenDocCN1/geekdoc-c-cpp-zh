  md: '# Prepping Your Deployment Server


    Although putting our software under version control is a really, really, good
    idea during development, not putting our software under version control when it
    comes to deployment is downright foolish—enough so that the soft-ware that we
    have selected to manage your deployment, namely Capistrano, all but requires it.


    Plenty of software configuration management (SCM) systems are available. Subversion,
    for example, is a particularly good one. But if you haven''t chosen one, go with
    Git, which is easy to set up and doesn''t require a separate server process. The
    examples that will be based on Git, but if you picked a different SCM system,
    don''t worry. Capistrano doesn''t much care which one you pick, so as long as
    you pick one.


    The first step is to create an empty repository on a machine accessible by your
    deployment servers. In fact, if we have only one deployment server, there is no
    reason that it can''t double duty as your Git server. So, log onto that server,
