  md: '![](img/79be11dd96f63a00f9795e2dfe232ef5_241_0.png)


    At the moment, we''ve been doing all of our work on one machine, though interaction
    with our web server *could* be done on a separate machine. In the figure, the
    user''s machine is in the center, and the WEBrick web server is on the left. This
    server makes of SQLite3, various gems you have installed, and your application
    code. Your code may or may not have been placed in git by this point; either way,
    it will be the end of the chapter, as will be the gems you are using.


    This repository itself will be replicated on the production server which again
    could be another machine, but need not. This server will be running a combination
    of Apache httpd and Phusion Passenger. This code will access a MySQL database
    on what may yet be a *fourth* machine.


    Capistrano will be the tool we use to update the deployment server(s) remotely,
    safely, and repeatedly from the comfort of our development machine.


    That''s a lot of moving parts!


    Instead of doing it all at once, we will do it in three iterations. Iteration
    K1 will get the Depot application up and running with Apache, MySQL, and Passenger
    — a truly production quality web server environment.


    We will leave Git, Bundler and Capistrano to a second iteration. These tools will
    enable us to separate out our development activities from our deployment environment.
    This means that by the time we are done, we will deploy twice; but that only this
    first time, and to ensure that each of the parts are working independently. It
    also allows us to focus on a smaller set of variables at any one time, which will
    simplify the process of untangling any problems that we might encounter.


