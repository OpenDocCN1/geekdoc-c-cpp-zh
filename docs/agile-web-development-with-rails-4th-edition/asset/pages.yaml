  md: '# What We Just Did


    Views are the public face of Rails applications, and we have seen that Rails delivers
    extensive support for what you need to build robust and maintainable user and
    application programming interfaces.


    We started with templates, of which Rails provides built in for three types: erb,
    builder, and rs. Templates make it easy for you to provide HTML XML, and JavaScript
    responses to any request. We will discuss adding another option in Section 26.3,
    Beautifying our Markup with Haml, on page 435.


    We dove into forms, which are the primary means by which users interact with your
    application. Along the way, we covered uploading files.


    We continued with helpers, which enable us to factor out complex application logic,
    allowing our views to focus on the presentation aspects. We explored a number
    of helpers that Rails provides, ranging from simple formatting to hypertext links,
    which are the final way in which users interact with HTML pages.


    We completed our tour of Action View by covering two related ways of factoring
    out large chunks of content for reuse. We use layouts to factor out the outer-layers
    of a view, and provide a common look and feel. We use partials to factor out common
    inner components, such as a single form or table.


    That covers how a user with a browser will access our Rails application. Next
    up: covering how we can use caching techniques to reduce or even eliminate the
    computational overhead of rendering a view when the underlying data in the database
    has not changed between requests.'
