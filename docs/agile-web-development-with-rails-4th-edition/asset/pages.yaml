  md: 'We saw an example of using filters for authorization in the administration
    part of our store example on page 213. We defined an authorization method redirected
    to a login screen if the current session didn''t have a logged-in user. We then
    made this method a before filter for all the actions in the administration controller.


    Filter declarations here also accept blocks and the names of classes. If a block
    is specified, it will be called with the current controller as a parameter. If
    a class is given, its filter class method will be called with the controller as
    a parameter.


    By default, filters apply to all actions in a controller (and any subclasses of
    that controller). You can modify this with the only option, which takes one or
    more actions to be filtered, and the except option, which lists actions to be
    excluded from filtering.


    The before_filter and after_filter declarations prepend to the controller''s chain
    of filters. Use the variant_before_filter and prepend_after_filter to put filters
    at the front of the chain.


    After filters can be used to modify the outbound response, changing the headers
    and content if required. Some applications use this technique to perform global
    replacements in the content generated by the controller''s templates (for example,
    substituting a customer''s name for the string <customer/> in the response body).
    Another use might be compressing the response if the user''s browser supports
    it.


    Around filters wrap the execution of the actions. You can write an around filter
    in two different styles. In the first, the filter is a single chunk of code. That
    code is called before the action is executed. If the filter code invokes yield,
    the action is executed. When the action completes, the filter continues executing.


    Thus, the code after yield is like a before filter, and the code after the yield
    is the after filter. If the filter code never invokes yield, the action is not
    run—this is the same as having a before filter return false.


    The benefit of around filters is that they can retain context across the invocation
    of the action.


    As well as passing around_filter the name of a method, you can pass it a block
    or a filter class.


    If you use a block as a filter, it will be passed two parameters: the controller
    object and a proxy for the action. Use call on this second parameter to invoke
    the original action.


    A second form allows you to pass an object as a filter. This object should implement
    a method called filter. This method will be passed the controller object. It yields
    to invoke the action.'
