  md: '# Time-Based Expiry of Cached Pages


    Consider a site that shows fairly volatile information such as stock quotes or
    news headlines. If we did the style of caching where we expired a page when- the
    underlying information changed, we''d be expiring pages constantly. The cache
    would rarely get used, and we''d lose the benefit of having it.


    In these circumstances, you might want to consider switching to time-based caching,
    where you build the cache pages exactly as we did previously but don''t expire
    them when their content becomes obsolete.


    You run a separate background process that periodically goes into the cache directory
    and deletes the cache files. You choose which deletion occurs—you could simply
    remove all files, the files created more than so many minutes ago, or the files
    whose match some pattern. That is application-specific.


    The next time a request comes for one of these pages, it won''t be satisfied from
    the cache. In the process, it''ll automatically repopulate that particular page
    in the cache, lightening the load for subsequent fetches of this page.


    Where do you find the cache files to delete? Not surprisingly, this is configured.
    Cache files are by default stored in the public directory of your application.
    They''ll be named after the URL they are caching, with an .html extension. For
    example, the page file for content/show/1 will be:


    ```

    app/public/content/show/1.html

    ```


    This naming is no coincidence; it allows the web server to find the cache files
    automatically. You can, however, override the defaults using:


    ```

    config.action_controller.page_cache_directory = "dir/name"

    config.action_controller.page_cache_extension = ".html"

    ```


    Action cache files are not by default stored in the regular filesystem directory
    structure and cannot be expired using this technique.


    # Playing Nice with Client Caches


    When we said earlier that creating cached pages is only one half of the equation,
    failed to mention that there are three halves. Oops.


    Clients (generally, but not always, browsers) often have caches too. Intermediaries
    between your server and the client may also provide caching services. You can
    optimize these caches (and reduce load on your server) by providing HTTP headers.
    Doing so is entirely optional and won''t always result in a bandwidth reduction,
    but on the other hand, the savings can be quite significant.'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# Expiration Headers


    The most efficient request is the request that is never made. Many pages (particularly
    images, scripts, and stylesheets) change very rarely may be referenced fairly.
    One way to ensure that re-retrievals are optimized before they get to your server
    is to provide an Expires header.


    Although an Expires header may provide a number of different options, the most
    common usage is to indicate how long the given response is be considered "good
    for," suggesting that the client need not re-request this data in the interim.
    The expires_in method in your controller achieves this result:


    ```

    expires_in 20.minutes

    expires_in 1.year

    ```


    A server should not provide a date more than one year in the future on Expires
    headers.


    An alternate for the Expires header is to indicate that the response is not be
    cached at all. This can be accomplished with the expires_now method, which understandably
    takes no parameters.


    You can find additional information on more expiration options in the HTTP specification.¹


    Be aware that if you are using page-level caching, requests that are cached at
    the server won''t get to your application, this mechanism needs to be implemented
    at the server level to be effective. Here''s an example for the Apache server:


    # LastModified and ETag Support


    The next best to eliminating requests entirely is to respond immediately with
    an HTTP 304 Not Modified. This will instruct user agents and intermediaries to
    use the version of this page that they already have in their cache. At a minimum,
    such responses will save on bandwidth. This will enable you to eliminate the server
    load associated with producing a more complete response.


    If you are already doing page-level caching with Apache, the server will will
    generally take care of this for you, based on the timestamp associated with the
    disk cache.


    +   http://www.w3.org/Protocols/rfc2616/rfc2616-sec14.html#sec14.9.3'
  merge: -1
  pgno: 378
- img_proc: true
  md: "For all other requests, Rails will produce the necessary HTTP headers for you,\
    \ if you call the stale? or fresh_when methods.\n\nBoth methods accept both last_modified\
    \ timestamp (in UTC) and an etag. The latter is an object on which the response\
    \ depends or an array of such objects. Such objects need to respond to either\
    \ cache_key or to_param. ActiveRecord takes care of this for you.\n\nstale? is\
    \ typically used in statements when rendering is involved:\n\n```\ndef show\n\
    \  Article = Article.find(params[:id])\n\n  if stale?(etag=>@article, :last_modified=>@article.created_at)\n\
    \    # ...\n  end\nend\n```\n\nfresh_when is often more convenient when you are\
    \ making use of default rendering as it will produce 304 Not Modified response\
    \ for you:\n\n```\ndef fresh_when(etag=>@article, :last_modified=>@article.created_at)\n\
    end\n```\n\nIn addition to the ability to cache a full page, Rails also provides\
    \ support for caching parts of a page. We cover why this is useful and how to\
    \ integrate it into your application next.\n\n# 22.3 Fragment Caching\n\nCaching\
    \ parts of a page turns out to be remarkably useful in dynamic sites. Perhaps\
    \ you customize the greeting and the sidebar on your blog application for each\
    \ individual user. In this case you can't use page caching, because the overall\
    \ page is different for each user. But because the list of articles doesn't change\
    \ between users, you can use fragment caching—you construct the HTML that displays\
    \ the articles just once and include it in customized pages delivered to individual\
    \ users.\n\nJust to illustrate fragment caching, let's set up a pretend blog application.\
    \ Here's the controller. It sets up @dynamic_content, representing content that\
    \ should change each time the page is viewed. For your fake blog, we use the current\
    \ time as this content.\n\n```\nload|views/app/controllers/blog_controller.rb\n\
    ```\n\n```\nclass BlogController < ApplicationController\n  def list\n    @dynamic_content\
    \ = Time.now.to_s\nend\n```"
