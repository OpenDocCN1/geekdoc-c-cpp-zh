- img_proc: true
  md: "As always with HTML forms, the trick is populating any initial values into\
    \ the form fields and then extracting those values back into our application when\
    \ the user hits the submit button.\n\nIn the controller, the @order instance variable\
    \ is set to reference a new Order model object. This is done because the view\
    \ populates the form from the data in this object. As it stands, that's not particularly\
    \ interesting. Because it's a new model object, all the fields will be empty.\
    \ However, consider the general case. Maybe we want to edit an existing order.\
    \ Or maybe the user has tried to enter an order but their data has failed validation.\
    \ In these cases, we want any existing data in the model shown to the user when\
    \ the form is displayed. Passing in the empty model object at this stage makes\
    \ all these cases consistent—the view can always assume it has a model object\
    \ available.\n\nThen, when the user hits the submit button, we'd like the new\
    \ data from the form to be extracted into a model object back in the controller.\n\
    \nFortunately, Rails makes this relatively painless. It provides us with a bunch\
    \ of form helper methods. These helpers interact with the controller and with\
    \ the models to implement an integrated solution for form handling. Before we\
    \ start on our first, let's look at a simple example:\n\n```\nform_for @order\
    \ do |f| %>n  <p>\n    <%= f.label :name, \"Name:\" %>\n    <%= f.text_field :name,\
    \ :size => 40 %>\n  </p>\n<% end\n```\n\nThere are two interesting things in this\
    \ code. First, the form_for helper on line 1 sets up a standard HTML form. But\
    \ it does more. The first parameter, @order, tells the helper the instance variable\
    \ to use when naming fields and arranging for the field values to be passed back\
    \ to the controller.\n\nYou'll see that form_for sets up a Ruby block element.\
    \ Within this block, you can put normal template stuff (such as the <p> tag).\
    \ You can also use the block's parameter (f in this case) to reference a form\
    \ context. We use this context on line 4 to add the field to the form. Because\
    \ the text field is constructed in the context of the form_for, it is automatically\
    \ associated with the data in the @order object.\n\nAll these relationships can\
    \ be confusing. It's important to remember that Rails needs to know the names\
    \ and the values for the fields associated with a model. The combination of form_for\
    \ and the various field-level helpers (such as f.text_field) give it this information.\
    \ We can see this process in Figure 12.1, on the next page."
