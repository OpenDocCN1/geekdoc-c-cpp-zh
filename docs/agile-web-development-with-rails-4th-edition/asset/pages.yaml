    # Rinse, Wash, Repeat


    Once we''ve got this far, our server is ready to have new versions of our application
    deployed it anytime. All we need is to check our changes into the repository and
    redeploy. At this point, we have two Capistrano files that haven''t been checked
    in. Although they aren''t needed by the app server, we can still use them to test
    out the deployment process:


    ```

    $ git add.

    $ git commit -m "add cap files"

    $ git push

    $ cap deploy

    ```


    The first three commands will update the SCM server. Once you become more familiar
    with Git, you may want to have finer control over when and which files are added,
    you may want to incrementally commit multiple changes before deployment, and so
    on. It is only the final command that will update our app, web, and database servers.


    If some reason we need to step back in time and go back to a previous version
    of our application, we can use this:


    ```

