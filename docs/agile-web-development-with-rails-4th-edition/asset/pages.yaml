  md: 'declarations to your models:has_one, has_many, belongs_to, and the wonderfully
    named has_and_belongs_to_many.


    # One-to-one Relationships


    A one-to-one association (or, more accurately, a one-to-zero-or-one relationship)
    is implemented using a foreign key in one row in another table to reference at
    most a single row. A one-to-one relationship might exist between orders and invoices:
    for each order there''s at most one invoice.


    | invoices |

    | id |

    | order_id |

    | ... |


    | orders |

    | id |

    | name |

    | ... |


    ```

    class Invoice < ActiveRecord::Base

    nbelongs_to :order

    # ...

    end

    ```


    ```

    class Order < ActiveRecord::Base

    has_one :invoice

    # # ...

    end

    ```


    As the example shows, we declare this in Rails by adding a has_one declaration
    to the Order model and by adding a belongs_to declaration to the Invoice model.


    There''s an important rule illustrated here: the model for the table that contains
    the foreign key always has the belongs_to declaration.


    # One-to-many Relationships


    A one-to-many association allows you to represent a collection of objects. For
    example, an order might have any number of associated line items. In the database,
    all line item rows for a particular order contain a foreign key referring to that
    order.


    | line_items |

    | id |

    | order_id |

    | ... |


    | orders |

    | id |

    | name |

    | ... |


    ```

    class LineItem < ActiveRecord::Base

    belongs_to :order

    # #...

    end

    ```


    ```

    class Order < ActiveRecord::Base

    has_many :line_items

    # # ...

    end

    ```


    In Active Record, the parent object (the one that logically contains a collection
    of child objects) uses has_many to declare its relationship to the child table,
    and the child table uses belongs_to to indicate its parent. In example, class
    LineItem belongs_to :order, and the orders table has_many :line_items.'
