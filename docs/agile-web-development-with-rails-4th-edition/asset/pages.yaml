    # Chapter 14


    # Task I: Logging In


    We have a happy customer—in a very short time we''ve jointly put together a basic
    shopping cart that she can start showing to her users. There''s just one change
    that she''d like to see. Right now, anyone can access the administrative functions.
    We''d like to add a basic user administration system that would force you to log
    in to get into the administration parts of the site.


    We''re happy to do that, because it gives us a chance to look at virtual attributes
    and filters, and it lets us tidy up the administration somewhat.


    Chatting with our customer, it seems as if we don''t need a particularly sophisticated
    security system for our application. We just need to recognize a number of people
    based on usernames and passwords. Once recognized, these folks can use all of
    the administration functions.


    # 14.1 Iteration II: Adding Users


    Let''s start by creating a model and database table to hold our administrators''
    usernames and passwords. Rather than storing in plain text, we will store a 256-bit
    SHA2 digest hash of the password and a second value, called a salt in cryptographic
    circles.


    This serves a number of purposes: even if our database is compromised, the hash
    won''t reveal the original password, so it can''t be used to log in using the
    forms, nor can it be used elsewhere in the all-to-common case where a single user
    uses a password in multiple places.


    ```

    depot> rails generate scaffold user \

    name:string hashed_password:string salt:string

    ```


    Now run the migration as usual:


    ```

    depot> rake db:migrate

    ```'
