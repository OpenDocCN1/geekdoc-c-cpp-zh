    ```


    Ruby hashes are similar to arrays. A hash literal uses braces rather than square
    brackets. The literal must supply two objects for every entry: one for the key,
    the other for the value. For example, you may want to map musical instruments
    to orchestral sections:


    ```

    inst_section = {

    :cello => ''string'',

    :clarinet => ''woodwind'',

    :drum => ''percussion'',

    :oboe => ''woodwind'',

    :trumpet => ''brass'',

    :violin => ''string''

    }

    ```


    The thing to the left of => is the key, and that on the right is the corresponding
    value. Keys in a particular hash must be unique—you can''t have two entries for
    drum. The keys and values in a hash can be arbitrary objects—you can have hashes
    where the values are arrays, other hashes, and so on. In Rails, hashes typically
    use symbols as keys. Many hashes have been modified so that you can use either
    a string or a symbol interchangeably as a key when inserting and looking up values.


    Hashes are indexed using the same square bracket notation as:


    ```

    inst_section[:oboe] == ''woodwind''

    inst_section[:cello] == ''string''

    inst_section[:bassoon] == nil

    ```


    As the last example shows, a hash returns nil when a key doesn''t contain. Normally
    this is convenient, nil means false when used in conditional expressions.


    You can pass hashes as parameters on method calls. Ruby allows you to omit the
    braces, but only if the hash is the last parameter of the call. Rails makes extensive
    use of this feature. The following code fragment shows a two-element hash passed
    to the redirect_to method. In effect, though, you can ignore the fact that it''s
    a hash and pretend that Ruby has keyword arguments.


    ```

    redirect_to :action => ''show'', :id => product.id

