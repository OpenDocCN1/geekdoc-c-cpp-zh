    \ :price => 1,\n  :image_url => \"fred.gif\")\n\nassert product.save\nassert_equal\
    \ \"has already been taken\", product.errors[:title].join(' ')\nend\n```\n\nThe\
    \ test asserts that the database already includes a row for the Ruby book.\nIt\
    \ gets the title of that existing row using this:\nproducts(:ruby).title"
