  md: "# Pragmatic Books Online Store\n\n![](img/79be11dd96f63a00f9795e2dfe232ef5_229_0.png)\n\
    \nAt this point, we notice our first problem. Languages are not the only that\
    \ varies from locale to locale; currencies do too. And the customary way that\
    \ numbers are presented varies too.\n\nSo, first we check with our customer, and\
    \ we verify that we are not worrying about exchange rates at the moment (whew!),\
    \ because that will be taken care of by the credit card and/or wire companies,\
    \ but we do need to display the string \"USD\" or \"$US\" after the value when\
    \ we are showing the result in Spanish.\n\nAnother variation is the way that numbers\
    \ themselves are displayed. Decimal values are delimited by a comma, and separators\
    \ for the thousands place are indicated by a dot.\n\nCurrency is a lot more complicated\
    \ than it first appears, and there's a lot of decisions to be made. Fortunately,\
    \ Rails knows to look in your translations file for this information; all we need\
    \ to do is supply it. For en en:\n\n```\nDownload depot_s/config/locales/en.yml\n\
    nnumber:\n  currency:\n    format: \"$\"\n    unit:\n    precision: 2\n    separator:\
    \ \",\"\n    delimiter: \",\"\n    format: \"%%u%n\"\n```\n\nAnd then for es:\n\
    \n```\nDownload depot_s/config/locales/es.yml\n```"
  merge: -1
