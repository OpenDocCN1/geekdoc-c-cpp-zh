- img_proc: true
  md: '# Running Migrations


    Migrations are run using the db:migrate Rake task:


    ```

    depot> rake db:migrate

    ```


    To see what happens next, let''s dive down into the internals of Rails.


    The migration code maintains a table schema_migrations inside every Rails database.
    This table has just one column, called version, and it will have one row per successfully
    applied migration.


    When you run db:migrate, the first task looks for the schema_migrations table.
    If it doesn''t exist yet, it will be created.


    The migration code then looks at all the migration files in db/migrate, and skips
    from consideration any that has a version number (the leading digits in the filename)
    that is already in the database. It then proceeds to apply the remainder of the
    migrations, creating a row in the schema_migrations table for each.


    If we were to run migrations again this point, nothing would happen. Each of the
    version numbers of the migration files would match with a row in the database,
    so there''d be no migrations to apply.


    However, if we subsequently create a new migration file, it will have a version
    number not in the database. This is true even if the version number before one
    or more of the already applied migrations. This can happen when multiple users
    are using a version control system to store the migration files. If we then run
    migrations, this new migration file—and only this migration file—will be executed.
    This may mean that migrations are out of order, so you might want to take care
    and ensure that these migrations are independent. Or you might want to revert
    your database to a previous state and then apply the migrations in order.


    You can force the database to a specific version by supplying the VERSION= parameter
    to the rake db:migrate command:


    ```

    depot> rake db:migrate VERSION=20110211000009

    ```


    If the version is greater than any of the migrations that have yet to be applied,
    these migrations will be applied.


    However, if the version number on the command line is less than one or more versions
    listed in the schema_migrations table, something different happens. In these circumstances,
    Rails looks for the migration file whose number matches the database version and
    undoes it. It repeats this process until there are no more versions listed in
    the schema_migrations table you specified on the command line. That is, the migrations
    are unapplied in reverse order to take the schema back to the version you specify.'
