- img_proc: true
  md: "We could try to roll the migration back, but that won't work. Because the original\
    \ migration failed, the schema version in the database wasn't updated, so Rails\
    \ won't try to roll it back.\n\nAt this point, you could mess around and manually\
    \ change the schema information and drop table one. But it probably isn't worth\
    \ it. Our recommendation in these circumstances is simply to drop the entire database,\
    \ re-create it, and apply migrations to bring it back up-to-date. You'll have\
    \ lost nothing, and you'll know you have a consistent schema.\n\nAll this discussion\
    \ suggests that migrations are dangerous to use production databases. Should you\
    \ run them? We really can't say. If you have database administrators in your organization,\
    \ it will be their call. If it's up to you, you'll have to weigh the risks. But,\
    \ if you decide to go for it, you must really back up your database first. Then,\
    \ you can apply the migrations by going to your application's directory on the\
    \ machine with the database role on your production servers and executing this\
    \ command:\n\n```\nRAILS_ENV=production rake db:migrate\n```\n\nThis is one of\
    \ those times where the legal notice at the start of this book kicks in. We're\
    \ not liable if this deletes your data.\n\n#  23.6 Schema Manipulation Outside\
    \ Migrations\n\nAll the migrations described so far in this chapter are also available\
    \ as methods on Active Record connection objects and are so accessible within\
    \ the models, views, and controllers of a Rails application.\n\nFor example, you\
    \ might have discovered that a particular long-running report runs faster if the\
    \ orders table has an index on the city column. However, that index isn't needed\
    \ during the day-to-day running of the application, and tests have shown that\
    \ maintaining it slows the application appropriately.\n\nLet's write a method\
    \ that creates the index, runs a block of code, and then drops the index. This\
    \ could be a private method in the model or could be implemented in a library.\n\
    \n```\ndef run_with_index(column)\n  connection.add_index(:orders, column)\n \
    \ begin\n    yield\n  ensure\n    connection.remove_index(:orders, column)\nend\n\
    ```"
