    # Comparing Session Storage Options


    With all these session options to choose from, which should you use in your application?
    As always, the answer is "It depends."


    There are few absolutes when it comes to performance, and everyone''s context
    is different. Your hardware, network latencies, database choices, and possibly
    even the weather will impact how all components of session storage interact. Our
    best advice is to start with the simplest solution and then monitor it. If it
    starts to slow you down, find why before jumping out of the frying pan.


    If you''re a high-volume site, keeping the size of the session data small and
    going with cookie_store is the way to go.


    If we rule memory storage as being too simplistic, file store as too restrictive,
    and memcached as the server-side choices boil down to PStore, Active Record store,
    and DRB-based storage. You should need to store more in a session than with cookies,
    we recommend you start with an Active Record solution. If your application grows,
    you will find this becoming a bottleneck, and then you can migrate to a DRB-based
    solution.


    # Session Expiry and Cleanup


    One problem with all the server-side session storage solutions is that each new
    session adds something to the session store. This means you''ll eventually need
    to do some housekeeping, or you''ll run out of resources.


    There''s another reason to tidy up sessions. Many applications don''t want a session
    to last forever. Once a user has logged in from a particular browser, the application
    might want to enforce a rule that the user stays logged in as long as they are
    active; when they log out or some fixed time after they use the application, their
    session should be terminated.


    You sometimes achieve this effect by expiring the cookie id. However, this is
    open to end-user abuse. Worse, it is hard to synchronize the expiry of a cookie
    on the browser with the tidying up of the session data on the server.


    We therefore suggest that you expire sessions by simply removing their server-side
    session data. A browser request subsequently arriving containing a session id
    for data that has been deleted, the application will receive no session data;
    the session will effectively be not there.'
