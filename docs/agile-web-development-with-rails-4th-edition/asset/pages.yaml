  md: "do this, we'll make use of the fact that you can pass a collection to the method\
    \ that renders templates, and that method will automatically invoke the partial\
    \ once for each item in this feature. Let's rewrite our cart view to see this\
    \ feature:\n\nDownload deploy j/app/views/carts/show.html.erb\n\n```\n<div class=\"\
    cart_title\">Your Cart </div>\n<table>\n  <%= render(@cart.line_items) %>\n  <tr\
    \ class=\"total_line\">\n    <td colspan=\"2\">Total</td>\n    <td class=\"total_cell\"\
    ><%= number_to_currency(@cart.total_price) %></td>\n  </tr>\n</table>\n```\n\n\
    ```\n<%= button_to 'Empty cart', @cart, :method => :delete, :confirm => 'Are you\
    \ sure?' %>\n```\n\nThat's simpler. The render method will iterate over any collection\
    \ that is passed to it. The partial template itself is simply another template\
    \ file (by default in the same directory as the object being rendered and with\
    \ the name of the table as the name). To keep the names of partials distinct from\
    \ regular templates, Rails automatically adds an underscore to the partial name\
    \ when looking for it. That means we need to name our partial _line_item.html.erb\
    \ and place it in the /app/views/line/_line_item/ directory.\n\nDownload deploy\
    \ j/app/views/line/_line_item.html.erb\n\n```\n<tr>\n  <td><%= line_item.quantity&times;\
    \ %></td>\n  <td><%= line_item.product.title %></td>\n  <td class=\"item_price\"\
    ><%= number_to_currency(line_item.total_price) %></td>\n</tr>\n```\n\nThere's\
    \ something subtle going on here. Inside the partial template, we refer to the\
    \ current object using the variable that matches the name of the template. In\
    \ this case, the partial is named line_item, so inside the partial we expect to\
    \ have a variable called line_item.\n\nSo now we've tidied the cart display\n\n\
    But how would the partial know where to find the cart object? One way would be\
