    Google countered it was no different different than a card catalog in a library'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'ered a brief summary of the book. Google and the publishers eventually reached
    a compromise. Google would pay $125 million in exchange for the right to provide
    full text versions of out-of-print books.


    Later in 2006, Page and Brin acquired other types of online technology. Google
    paid $1.6 billion to buy YouTube, a site on which people post homemade videos.
    YouTube''s owners sold their site to Google because they couldn''t keep up with
    the online traffic. The site had grown quickly, attracting millions of users.
    Page and Brin''s users could now search keywords, images, videos, and music.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_87_0.png)


    Larry Page and Sergey Brin appearing in a video link on the YouTube Web site.
    Google has acquired the online video sharing company.'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'Although many people still saw Google as a likable growing company, others
    disliked how Google ate into their markets. Advertising companies lost money when
    clients turned to Google. Telephone companies worried about Google entering the
    rapidly changing cell phone business.


    In June 2007, Apple had introduced its iPhone, a product that revolutionized the
    cell phone and Internet industry. Apple’s iPhone was the first cell phone with
    e-mail and Web browsing capability. Users could talk and text messages, listen
    to music, and talk—all by using a touch screen and virtual keyboard. The iPhone
    suddenly made Internet mobile, no longer tied to their computers. In three months,
    Apple sold more than 1.4 million iPhones, becoming the most valuable tech company
    in the world.


    Many people awaited the unveiling of the gPhone, Google’s answer to the iPhone.
    Instead of a phone, Page and Brin introduced a free cell phone operating system
    called Android. The software could run on millions of devices around the world.
    With Android, Google sparked greater use of Internet-ready phones called smartphones.
    “This Google proposal can do to cell phones what the Internet did for the personal
    computer,” said David Weinberger, a researcher at Harvard. “The Internet created
    a new public space, and the opening of cell phones will do the same thing, but
    extend that space beyond the time that we spend tapping at a keyboard.” Soon 160,000
    new Android-enabled phones were being activated each day. Google had made a giant
    leap and taken their search capabilities mobile.'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'The year 2007 was eventful for Page and Brin in other ways. In May, Brin married
    Anne Wojcicki. The two met through Wojcicki’s sister, Susan, who had rented her
    garage to Page and Brin in 1998. Both adventurous and outgoing, Brin and Wojcicki
    liked yoga, scuba diving, and kite surfing. She had attended Yale University and
    graduated with a degree in biology.


    Brin and Wojcicki were married in the Bahamas on Musha Cay, an exclusive, private
    island ringed by sugar-white sand beaches and clear turquoise-blue waters. Wedding
    guests were flown in by private jet and ferried to a sandbar. Brin wore a tuxedo-black
    swimsuit and Wojcicki wore a wedding dress-white swimsuit. The two swam out to
    a sandbar where friends married them.


    In December 2007, Page also wed. He married Lucy Southworth, a former model who
    was earning a PhD from Stanford. She had earned her master’s degree in science
    from Oxford University and done medical social work in South Africa. The two had
    begun dating in 2006. Like Page, she was intelligent and quiet. Page and Southworth
    married on exotic, luxurious Necker Island in the Caribbean Sea.


    Page and Brin strove to keep their personal lives private and rarely gave interviews.
    Despite their recent marriages, they continued to work long hours to develop new
    services. In addition to going mobile, the Internet was swiftly evolving in other
    ways. People increasingly went online for social interaction. In 2004, Mark Zuckerberg
    developed a site called'
  merge: -1
  pgno: 89
- img_proc: true
  md: '![](img/4289fd47e3baffa20ad5d74d4233a641_90_0.png)


    In 2011, Barack Obama speaks to Mark Zuckerberg before a private meeting where
    Obama dined with technology business leaders.


    Facebook to help users communicate with their friends, family, and co-workers.
    Facebook users have home pages with news feeds of status updates from friends.
    By 2008, Facebook had 100 million users.


    People also flocked to Twitter, a social networking and blogging site, launched
    in 2006. Twitter users post and read brief text-based messages, called tweets,
    about their activities. Like Facebook, Twitter use had increased by leaps and
    bounds.


    For many years, people had gone to Google for answers to their questions. Now,
    increasingly popular social media sites encroached on Google’s market. Instead
    of turning to Google'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'to decide what bicycle to buy, people could ask friends on Facebook or Twitter.
    Or, they might visit the Web site Groupon, which offers coupons to groups, to
    find a bargain on, say, bikes or restaurants or spas.


    Google’s investors worried about the company’s ability to keep up with the changing
    Internet. “It’s a growing chink in their armor,” said a former Googler. “They
    know that. The question is, what can they do about it?” Page and Brin continued
    to search for ways to create their own social media approaches, such as Google
    sites, a Web site dedicated to bringing users with common interests together.


    Now with seventy offices throughout the world—from Texas to Turkey, Google had
    more than 23,000 employees and revenue of $20 billion a year. Google’s services
    stretched like


    ![](img/4289fd47e3baffa20ad5d74d4233a641_91_0.png)


    The Google Engineering Center in Zurich, Switzerland'
  merge: -1
  pgno: 91
- img_proc: true
  md: a web across the planet. The word Google even appeared in dictionaries. The
    British newspaper the Guardian named Page and Brin the two most influential individuals
    in the media. Others called them the “princes of high technology,” and the “lords
    of all information.” The business Page and Brin had started in a garage was now
    the world’s second most valuable technology company after Microsoft.
