- img_proc: true
  md: 'When a private company becomes public, the primary owners can no longer make
    independent decisions. The share-holders, or investors who purchased stock, now
    own a portion of the company, although they aren’t involved in the day-to-day
    operations. SEC regulations require shareholder meetings and approval for certain
    decisions. Investors want the value of their stock to increase. If it decreases,
    they may sell their stock, which could impact the overall value of the company
    and drive it out of business.


    Months of planning go into the IPO process. The cast of characters includes accountants,
    advisors, and investment bankers, called underwriters, who help set the initial
    offering price for the stock. The underwriter creates a prospectus, a document
    describing the company in detail to potential investors. On the day of the IPO,
    usually 80 percent of the stock is sold to large firms, investment banks, and
    high-profile investors. The stock price increases and decreases depending on the
    confidence in the company and the stock market.


    Google’s IPO caused a media sensation. The company’s financial growth in the previous
    few years astounded people. Google’s profits now equaled more than $100 million.
    Just as Page and Brin ran their company differently, they wanted their IPO to
    be different. They called their prospectus the Letter from the Founders: An Owner’s
    Manual for Google’s Shareholders. “Google is not a conventional company,” wrote
    Page and Brin to investors. “We do not intend to become one.” According to the
    prospectus, Page, Brin, and Schmidt would continue making all major decisions,
    not shareholders. Instead of allocating 80 percent of their stocks to be sold
    to large banking institutions, Page and Brin held an auction, in which'
  merge: -1
