    Guys decided to start offering their users an e-mail service.


    Page and Brin wanted their e-mail to be the best on the Internet. They identified
    flaws in services offered by Microsoft, Yahoo!, and AOL. One problem with other
    services was that users often had difficulty finding older e-mails. Unable to
    store mountains of messages, AOL automatically deleted e-mails after thirty days.


    Page and Brin launched Gmail in April 2004. With each e-mail account, they gave
    away one free giga-byte of storage on Google’s network. Users also had the capability
    to search their old e-mails. At first, Page and Brin provided Gmail accounts'
