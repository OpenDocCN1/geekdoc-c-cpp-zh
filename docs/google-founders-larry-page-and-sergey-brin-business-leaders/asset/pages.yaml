- img_proc: true
  md: 'To make clear that advertising didn’t impact the results of the search, Page
    and Brin kept Google’s homepage free of ads and instituted strict guidelines.
    All ads were brief and identical in appearance. Each contained a headline, a two-sentence
    description, and a link to the site. They didn’t pop up ads or flashing graphics.
    A vertical line separated the search results from the ads, which appeared to the
    right of the screen and were clearly labeled sponsored links.


    The queries Google users entered certain ads. If a person typed into the word
    guitar, Google returned search results along with a list of sponsored links related
    to guitars. Just as PageRank listed sites in relevant order, Google’s ads functioned
    the same way. Page and Brin ranked ads, not by which advertiser spent the most
    money, but by how frequently users clicked on those ads. Popular ads rose to the
    top of the sponsored links.


    In October 2000, Page and Brin launched AdWords, their self-service advertising
    program. Advertisers signed up online, activating their account with a credit
    card. Ads could be up and running within minutes. The system cut costs for Google,
    and gave all businesses—small and large—equal opportunities to place ads.


    Using an automated, online system, advertisers made bids to have their ads appear
    next to specific search terms. For example, the swimwear company Speed might be
    run next to the keywords swimsuit or goggles. Page and Brin set the minimum bid
    at five cents. Companies spent anywhere from ten dollars to thousands of dollars
    in auctions.


    Page and Brin’s AdWords program revolutionized online advertising. In the science
    of marketing, companies study how'
