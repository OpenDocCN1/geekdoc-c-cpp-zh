- img_proc: true
  md: '# 7


    To the Moon and Beyond


    In April 2011, Page replaced Eric Schmidt as the company’s CEO. Schmidt, set to
    continue as the chairman of the board of directors and ready to serve Google’s
    executive chairman, tweeted of the change: “Day-to-day adult supervision no longer
    needed!” In an official Google blog, he added, “Larry, in my clear opinion, is
    ready to lead.”


    Both Page and Brin want to keep inventing and to see how much more they can change
    the world. Their base remains the Googleplex—home to scientists, engineers, statisticians,
    product marketers, and former CEOs. Employees thread their way between the main
    buildings on cobbled paths and use a zipline between two buildings separated by
    a small creek. Massive stone statues of explorers like Jacques Cousteau dot the
    pathways. On sunny days, Googlers enjoy their healthy, free meals at outside tables.
    They stroll through the vegetable garden or stop by the Hiveplex, an area with
    four beehives painted in Google’s


    ![](img/4289fd47e3baffa20ad5d74d4233a641_94_0.png)'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'colors, where the company harvests its own honey. A bronze replica of a Tyrannosaurus
    Rex, nicknamed Stan, guards the main building. Although the Googleplex resembles
    a playground, Googlers are dedicated to their work. “Ambition is a very important
    part of our culture,” said Brin, “and the depth of science you can do at Google
    is [like] nowhere else in the world.”


    Google’s innovation continues to change the world, evolved far beyond simple,
    better search. Early in 2011, people turned to Google’s new PeopleFinder service
    to search for missing family members and friends following a devastating earthquake
    and tsunami in Japan. Users also can now explore services like Google Earth, Google
    Maps, Google Finance, Google Calendar, Google Desktop, Gmail, Google Documents,
    and Google’s new lightening-fast browser called Chrome. The company handles more
    than 1 billion online queries involve Google’s search engine. Their index contains
    an estimated 25.2 billion Web pages. Android phones hold 26 percent of the market
    and Google is developing its own library of apps, or mini programs ranging from
    translators and flashlights to entertaining.


    Page’s and Brin’s innovative approaches still bring criticism through their privacy
    and uses others’ intellectual property both on Google News and by digitizing books.
    “We do run into a lot of areas where our innovation bumps up against laws that
    were not designed for the world we now live in,” said David Drummond, a Google
    lawyer. “Sometimes others don’t share our commitment [to change].” However, Google
    continues the process of'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'digitizing millions of books hoping to tear down the physical limits of libraries.


    Page and Brin had hoped to break down the walls of censorship in China. However,
    when they learned of Chinese leaders ordering attempts to hack into Google''s
    networks, they threatened to leave China unless the government allowed them to
    run an uncensored search engine. When officials refused, Google pulled out of
    China, redirecting search traffic to their uncensored site in Hong Kong.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_96_0.png)


    Google''s China headquarters in Tsinghua Science Park, Beijing, China'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'Recently, Page and Brin have turned their attention to another critical issue—their
    energy consumption. Google uses massive amounts of energy to maintain its super
    network of “server farms” that are scattered from Atlanta to Zurich. Although
    the number of computers Google uses is kept secret, experts estimate the number
    to be more than 1 million. Page and Brin have begun using clean, renewable energy.
    They installed solar panels on the roofs of the buildings in the Googleplex and
    invested $39 million in wind power. When dry brush in the fields near their headquarters
    became a fire hazard, they rented goats to help trim the grass in a low-carbon
    way.


    Page and Brin also installed solar-powered stations in their company’s parking
    lots to charge their fleet of hybrid cars. Both Page and Brin drive electric cars
    produced by Tesla Motors. Named after the scientist Tesla, the company builds
    the world’s fastest and most energy-efficient cars. A Tesla sports car can travel
    up to 130 miles per hour and go 250 miles on a single battery charge.


    The 2009 Tesla Roadster


    ![](img/4289fd47e3baffa20ad5d74d4233a641_97_0.png)'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'Page and Brin also are looking to the moon as a stepping stone to the rest
    of the universe. By exploring the moon, scientists can study the clean, solar
    energy in space could be used on Earth. Page and Brin have announced their plans
    for the Google Lunar X PRIZE. The program offers $30 million in prizes, challenging
    teams of engineers and entrepreneurs from around the world to design the best
    robotic moon rovers. Google’s founders hope the technological advances the prize
    inspires one day improve life on Earth. Brin has also invested in Space Adventures,
    a company offering opportunities for private spaceflight. Brin’s investment helped
    fund the program and reserved him a spot on a future mission orbiting the moon.


    Page and Brin have also started using Google’s resources to pioneer breakthroughs
    in medicine and health. Genetics research especially interests Brin, who discovered
    he has a 50 percent risk of developing Parkinson’s disease. He has begun spending
    millions to research the disease, from which his mother Eugenia suffers.


    Parkinson’s is is an incurable brain condition that progressively worsens. People
    with Parkinson’s disease experience tremors, slowness and stiffness when moving,
    and impaired balance. The disease is caused by the death of brain cells that are
    responsible for making


    ![](img/4289fd47e3baffa20ad5d74d4233a641_98_0.png)'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# # XPRIZE

    FOUNDATION


    ![](img/4289fd47e3baffa20ad5d74d4233a641_99_0.png)'
