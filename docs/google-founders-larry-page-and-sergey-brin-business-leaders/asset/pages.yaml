    third party. In 1709, Queen Anne of England decreed the Statute of Anne, one of
    the first copyright laws. It granted the exclusive right of publication to authors
    for twenty-one years. Today, copyright laws vary depending on when the work was
    produced. Page and Brin promised to respect copy-right laws and to reimburse the
    libraries for any lawsuits digitizing the books.


