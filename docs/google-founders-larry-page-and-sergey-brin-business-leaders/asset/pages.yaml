  md: '# 1


    # The Boys Who Loved Computers


    Sergey Brin was born in the drab, concrete landscape of Communist Russia while
    Larry Page grew up on the green treelined streets of a Michigan university town.
    It is difficult to imagine two more different beginnings for the founders of Google.
    However, both boys loved to tinker with computers and to puzzle out complex mathematical
    problems, and both had academic parents who encouraged their interests. Despite
    cultural differences, it was their similar intellectual backgrounds that brought
    them together to create a revolutionary Internet company. One that today places
    almost limitless information at the fingertips of people around the world.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_12_0.png)'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Google, a search engine, answers more than 1 billion online queries each day,
    and is available in 117 languages—from Latin to Pig Latin. From students to teachers,
    actors to CIA agents, athletes to chefs, all turn to Google to answer their questions.
    Cartoonist Gary Trudeau calls Google “the Swiss Army knife of information retrieval.”


    With millions of computers running day and night in data centers across the globe,
    Page and Brin control one of the world’s most massive computer systems. Through
    groundbreaking-technology, they have changed the lives of millions of people by
    providing free, instant access to information, maps, images, and art.


    The invention of Google made Larry and Sergey billionaires. Despite their wealth,
    they continue to focus on the company they created. To them, Google has more to
    offer than just information. They plan to use Google as a stepping stone to greater
    achievements, bettering the world, and improving people’s lives.


    Before reaching the age of forty, Larry and Sergey accomplished more than most
    inventors do in a lifetime. Known as the “Google Guys,” they hope to develop other
    technological advancements in areas like medical research and climate change.
    “I think it [Google] was the smallest of accomplishments that we hope to make
    over the next twenty years,” said Brin.


    Lawrence (Larry) Edward Page was born on March 26, 1973 in East Lansing, Michigan.
    Larry’s parents, Carl and Gloria Page, had one other child at the time, nine-year-old
    Carl Victor Jr. The Pages lived in a middle-class neighborhood near'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Michigan State University, where both of Page’s parents were professors. Carl
    taught computer science and Gloria computer programming.


    Larry came from a family devoted to education, hard work, and equality. They proudly
    remembered Larry’s grandfather’s role in the 1937 Flint Sit-Down Strike, Michigan,
    when autoworkers took over a car manufacturing facility in Flint, Michigan, in
    protest of dangerous working conditions. Larry’s father, Carl Victor Page, had
    survived childhood polio to become the first person in his family to graduate
    from high school. In 1965, he earned his PhD in computer science from the University
    of Michigan. Carl was one of the few to hold a degree in the new field.


    Larry’s foundation in perseverance and dedication also came from his mother’s
    side of the family. Larry’s maternal grandfather was Jewish. After immigrating
    to Israel, he settled in the desert town of Arad near the Dead Sea and eked out
    a living as a diemaker, despite the scarcity of water and resources.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_14_0.png)


    Beaumont Tower at Michigan State University'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Like her husband, Gloria was fascinated by technology. She earned her master’s
    degree in computer science and worked as a database consultant. Larry’s parents
    used computers at home and at work. Inside their house, computer parts and Popular
    Science magazines surrounded Larry.


    Five months after Larry’s birth, Google’s co-founder, Sergey Mikhailovich Brin,
    was born on August 21, 1973, in Moscow, Russia. Sergey’s parents, Mikhail and
    Eugenia Brin, shared the same passion for technology and education as Page’s parents.
    Mikhail received his PhD in mathematics from Moscow State University. He worked
    as an economist for Gosplan, a government agency that oversaw economic planning
    for the Soviet Union. Eugenia, who also held a degree in mathematics, was employed
    as a civil engineer.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_15_0.png)


    The main building at Moscow State University'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'The love of numbers ran deep in Sergey’s family. He came from a long line of
    mathematicians and scientists. Sergey’s great grandfather had been a math professor
    in Moscow. His great grandmother had left Russia to study microbiology at the
    University of Chicago, returning to Moscow in 1921 to help create Russia’s Communist
    framework.


    For seventy years, the Communist party ruled the Russian government, industry,
    and way of life. Communism is an economic system in which the government controls
    all goods and services. It differs from capitalism, the economic doctrine of the
    United States, in which citizens can own property and businesses. These differences
    made the United States and Russia bitter enemies for many years.


    Although the Soviet Union seemed prosperous and technologically advanced, these
    appearances came at the cost of Russian citizens who suffered under the repressive
    regime. People were forbidden to travel without permission. They couldn’t talk
    freely about the government for fear of being arrested by the KGB, the secret
    police. Food and other goods were often scarce. A Soviet citizen waited nearly
    four hundred hours a year in long lines outside stores to purchase items.


    Mikhail and Eugenia earned little money and shared a cramped apartment with Sergey’s
    grandmother. A concrete courtyard served as Sergey’s playground, where he played
    for two hours each day, regardless of the weather.


    The Brins’ religious beliefs worsened their situation. Like Larry’s family, they
    were Jewish. On the streets and at work, they faced harsh anti-Semitism and discrimination.
    The Communist party banned Jewish people from certain occupations. Mikhail had
    planned to study astrophysics at'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Moscow State University, in hopes of becoming an astronomer. However, officials
    barred him from the astrophysics program because it shared a university department
    with nuclear physics. The Soviet government deemed Jewish people too untrustworthy
    to have access to nuclear secrets. Instead, Mikhail pursued a career in mathematics.
    The university required him to take entrance examinations specific to Jewish students.
    Although Mikhail was forbidden to continue his education after graduating, he
    studied on his own—sneaking into classes and writing research papers. Sergey’s
    mother suffered the same discrimination when she earned her degree in mathematics.


    Sergey’s parents longed to be free from the oppressive Communist regime. They
    wanted opportunities for themselves and their son. In 1977, Mikhail attended an
    international conference, where he met many foreign researchers. When Mikhail
    returned home, he told his wife they needed to get to America. “He said he wouldn’t
    stay,” said Eugenia, “now that he’d seen what life could be about” The Brins applied
    for visas, documents granting entry to the United States, in hopes of escaping
    the Soviet Union. When they submitted their visa applications, Mikhail’s employers
    fired him. Fearing the same retaliation, Eugenia resigned from her job. While
    officials reviewed their paperwork, Sergey’s parents struggled for money, taking
    temporary jobs wherever they could find work.


    Two years later, in 1979, officials granted them their visas. The Brins were lucky
    to escape; soon after, the Soviet Union closed all emigration. Sergey, his parents,
    and his grandmother were forced to leave most of their possessions behind when
    they left their native country. Mikhail explained the journey'
  merge: -1
  pgno: 17
- img_proc: true
  md: '![](img/4289fd47e3baffa20ad5d74d4233a641_18_0.png)


    # The State Historic Museum in Red Square in Moscow


    to his son, sadly telling Sergey that the love of one’s country isn’t always mutual.
    Six-year-old Sergey would remember the journey as a blur. They traveled from Moscow
    to Vienna to Paris to America. “We were in different places from day to day,”
    Sergey said.


    Upon arriving in the United States, the Brins rented a small cinder block house
    in the suburbs of Washington, D.C., not far from the University of Maryland. They
    received support from local Jewish people who had left Russia. “The U.S. was very
    good to us,” “It was a great place, but we started with nothing. We were poor
    . . . When we first moved to the States we rented a little house, and my parents
    didn’t have a proper room to sleep in. They had to wall off the kitchen. It was
    a very humble beginning.”'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'A friend of Mikhail’s helped land a teaching position as a math professor at
    the University of Maryland. Eugenia found work nearby as a scientist at NASA’s
    Goddard Flight Center. Sergey began attending a Montessori school. His teachers
    followed methods developed in the 1920s by Maria Montessori, an Italian physician,
    who believed children learn by playing. Sergey gravitated to math puzzles, science
    projects, and maps. He disliked school at first, as he spoke little English and
    was in a strange country. As Sergey grew accustomed to his new world, he soon
    excelled and discovered his love of learning.


    More than five hundred miles away, in a small university town, six-year-old Larry
    also attended a Montessori school. For Larry, reading soon became like breathing.
    On a vacation to Oregon he took an empty suitcase, planning to fill it with books
    from Powell’s Books, a famous store in Portland, Oregon.


    In 1979, the Sergey’s family came to the United States, Larry’s father obtained
    an early home computer called the Exidy Sorcerer. Using a homemade typing program,
    Larry typed entire books on the computer one at a time. His favorite was the book
    Frog and Toad Together. Not long after, Larry began using the computer for school
    assignments. None of his teachers had ever seen schoolwork created on a home computer.


    In the early 1980s, only eight out of 100 people in the United States had computers
    in their homes. For many years, computers had functioned solely as calculators.
    A major breakthrough occurred in 1946 with the Electrical Numerical Integrator
    and Calculator (ENIAC), nicknamed the “Giant Brain.”'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'The massive machine occupied an entire room and weighed thirty tons. Highly
    trained operators hooked up cables and flipped the machine’s 6,000 switches. The
    ENIAC performed mathematical calculations at blinding speed; problems previously
    taking twelve hours to solve were answered in thirty seconds. The U.S. military
    drove many technological advances, relying on computers to make calculations for
    the hydrogen bomb and in the space program.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_20_0.png)


    The Electrical Numerical Integrator and Calculator (ENIAC) in Philadelphia, Pennsylvania,
    circa the late 1940s to early 1950s'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'In 1976, Steve Wozniak and Steve Jobs, co-founders of the Apple computer company,
    revolutionized personal computers. Their Apple Apple II became one of the first
    mass-produced computers. More companies followed and computers rapidly became
    more advanced and easier to use.


    Like many families, the Pages and Brins were excited by the potential offered
    by the personal computer. Growing up amidst computer parts, Larry especially wanted
    to figure out how things worked. Armed with a set of screwdrivers, a present from
    his older brother, Larry dismantled all the power tools around the house. He excelled
    at taking things apart but often


    ![](img/4289fd47e3baffa20ad5d74d4233a641_21_0.png)'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'didn’t put them back together, aggravating his parents. Soon though, Larry
    built a working printer—out of Legos.


    When Larry was eight years old, his parents divorced. At the same time, his brother
    left home to study computer science at the University of Michigan. Despite the
    changes, Larry was still surrounded by family members who loved him and spent
    time with him. Larry’s father especially enjoyed taking his son to Grateful Dead
    rock concerts.


    Larry loved music and played the saxophone. Quiet, shy, and a bit of a loner,
    he often turned to music, math, and reading. At twelve years old, Larry read a
    biography about Nikola Tesla, one of the greatest scientific inventors of the
    1800s and early 1900s. The book changed Larry’s life and sparked his dream of
    becoming an inventor.


    According to legend, Nikola Tesla was born in Croatia in 1856 at the stroke of
    midnight during an electrical storm. After immigrating to the United States, Tesla
    worked for Thomas Edison, quitting after an argument about wages. Tesla focused
    on his own inventions, working in New York and in Colorado Springs, near the fierce
    electrical storms common in the Rocky Mountains. His own man-made lightning often
    surrounded him in his lab.


    Despite his brilliance, Tesla led a tragic life. Plagued by obsessive-compulsive
    disorder, he was a fanatic about cleanliness and about the number three. Tesla
    circled a block three times before entering a building, using three napkins at
    meals, and refused to stay in a hotel room unless the room number was divisible
    by three. By middle age, Tesla’s obsessive impulses controlled him. He spent the
    last years of his life attempting to contact the planet Mars. He died deeply in
    debt,'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'not receiving recognition for his innovations until years after his death.


    Larry quietly absorbed lessons from Tesla’s successes and failures, realizing
    Tesla unwittingly gave away many of his innovations. In the future, Larry would
    zealously guard his new inventions, keeping them secret until the last moment.
    “It’s a very sad story,” Larry said. “I realized Tesla was the greatest inventor,
    but he didn’t accomplish as much as he should have. I realized I wanted to invent
    things, but I also wanted to change the world. I wanted to get them out there,
    get them into people’s hands so they can use them, because that’s what really
    matters.”


    As Larry dreamed of inventing, Sergey also discovered his talents. Unlike Larry,
    he was rebellious and boisterous, and not especially interested in music or reading.
    “Sergey was a good boy,” his father joked, “when he was asleep.” Once, on a trip
    back to Russia, Sergey threw pebbles at a Soviet policeman. His parents had to
    promise the irate policeman they would severely punish their son at home. The
    Brins never forgot their reasons for leaving the Soviet Union. Sergey’s parents
    raised his son in the Jewish faith. For a few years, he attended Hebrew school,
    but he disliked it so much that his parents allowed him to stop going. As an adult,
    Sergey would choose not to practice his parents’ religion. Larry would make the
    same decision.


    Sergey loved to question his teachers and to prove them wrong. They soon recognized
    his mathematical genius and brought in special teachers to challenge him. “He
    was a brash young man,” said one of Sergey’s teachers. “But he was so smart. It
    just oozed out of him.” For Sergey’s ninth birthday,


    ![](img/4289fd47e3baffa20ad5d74d4233a641_23_0.png)'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# The Boys Who Loved Computers


    his parents bought him a Commodore 64 computer. Sergey began to see ways to apply
    his skill in math and his scientific mind to computers.


    Sergey loved to debate with his parents, who often challenged him more than his
    teachers. His father was tough and demanding, as a parent and professor. “Almost
    half the statistics class he taught dropped out after the first session because
    they couldn’t handle his assault and battery on their sense of self,” said one
    student.


    When Sergey was nine years old, he overheard his father talking to some colleagues.
    Mikhail complained that none of his students could solve a complex math problem
    he assigned. After listening to the conversation, Sergey offered the correct solution
    to the problem.


    The large and clunky Commodore 64 keyboard and mouse


    ![](img/4289fd47e3baffa20ad5d74d4233a641_24_0.png)'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'At fifteen years old, and still in high school, Sergey enrolled in math and
    computer science classes at the University of Maryland. That same year, 1988,
    his brother Sam was born. Sam soon excelled at basketball and dreamed of becoming
    a professional athlete. Because the Brins treasured scholarship, Sam grew up believing
    advanced degrees were necessary for any career. He asked his father, “Is it true
    that before you play in the NBA you have to get a PhD?” Mikhail answered, “Yes,
    Sam, that’s it.”


    Sergey graduated from high school a year early and began taking graduate-level
    classes at the university. At age nineteen, he received his degree from the University
    of Maryland. After graduation, Sergey joked about running off and joining the
    circus. He loved gymnastics and had trained on the trapeze for many years. Sergey’s
    path ahead was clear though. He received a National Science Foundation scholarship
    and soon enrolled at Stanford University to pursue a PhD. Within two years, Larry
    would join him there.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_25_0.png)


    Like Sergey, Larry excelled in high school. He followed in his family’s footsteps
    and studied computer engineering at the University of Michigan.


    The National Science Foundation logo'
  merge: -1
  pgno: 25
- img_proc: true
  md: When Larry used a handheld computer in his classes, no one knew what it was.
    In Larry’s free time, he worked at a dough-nut stand and helped the school’s solar
    car team build a car that won a national championship. When Larry graduated in
    1995, he too was accepted at Stanford University. Neither he nor Sergey, knew
    what was in store for them at Stanford.
  merge: -1
  pgno: 26
- img_proc: true
  md: '![](img/4289fd47e3baffa20ad5d74d4233a641_27_0.png)'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# 2


    "LarryandSergey"


    As soon as he set foot on Stanford University’s campus in 1995, Larry Page met
    Sergey Brin. Brin served as a tour guide, walking Page and other new graduate
    students around Stanford’s sprawling campus.


    Located between San Francisco and San Jose, California, Stanford’s campus is fringed
    with palm trees and eucalyptus. Students attend classes in rectangular cream-colored
    buildings, lined with arches and topped with red-tiled roofs, in classic Spanish
    style. More than seventy sculptures dot the neatly trimmed green lawns. Some of
    the 15,000 students enjoy fountain hopping, leaping into the blue waters of the
    many fountains on campus, and steam tunneling, exploring the university’s underground
    steam tunnels.


    More than just the beautiful, sunny campus attracted Page and Brin to Stanford.
    They were lured by the school’s reputation. Since the school opened in 1891, it
    has evolved into one of the world’s top universities,'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'recognized for its excellence in science, technology, and math. Stanford is
    home to scholars who have won Nobel and Pulitzer Prizes and Presidential Medals
    of Freedom. Stanford graduates founded Yahoo! and Hewlett-Packard, a leading technology
    company.


    The chance to take part in cutting-edge computer science research excited both
    Page and Brin. However, when the future co-founders met that day, they argued
    nonstop about random issues. “We both found each other obnoxious,” said Brin.
    “But we said it a bit jokingly. Obviously we spent a lot of time talking to each
    other, so there was something there. We had a kind of bantering thing going.”


    Brin and Page differed in personality. Confident and social, Brin was spontaneous
    and intense. Page was a shy midwesternner who worried about being sent home for
    not meeting the school’s rigorous standards. “They were both brilliant, some of
    the smartest people I have ever met,” said Stanford professor Rajeev Motwani.
    “But they were brilliant in different ways. . . . If there was a group meeting
    of twenty people, Sergey was holding court. You wouldn’t notice [Larry] if he
    was in a crowd, but then afterward he would say, ‘Hey, what do you think of this
    idea?’”


    Despite their initial squabbling, Page and Brin had more similarities than differences.
    Math and science framed their respective childhoods. Soon they became nearly inseparable.
    Friends called them “LarryAndSergey.” As they delved into research projects together,
    each brought different abilities to their work. They were like “two swords sharpening
    each other,” said one professor.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'As Brin had already mastered graduate-level coursework at the University of
    Maryland, he aced all ten of Stanford’s required doctoral exams on the first try.
    Most students didn’t pass all of the exams until their third year. Brin didn’t
    need to take any classes to earn his PhD; his remaining requirement was to write
    his thesis.


    Brin explored many subjects at Stanford. “I expected him to get his PhD and to
    become somebody, maybe a professor,” said Brin’s father. “I asked him if he was
    taking any advanced courses one semester. He said, ‘Yes, advanced swimming.’”
    Brin studied everything from genetics and molecular biology—the make up of molecules
    in living cells—to developing an individualized online movie rating system. “I
    tried so many different things in grad school,” he said. “The more you stumble
    around, the more likely you are to stumble across something valuable.


    Page’s first year at Stanford was rough. Not long after he settled into life on
    campus, his father became critically ill. Carl Page suffered from complications
    following pneumonia. His health declined rapidly, and his ability to breathe deteriorated.
    Within weeks, at only fifty-eight years old, Carl passed away. He would be remembered
    as a pioneering scholar and teacher who loved a heated debate. Carl Page’s sudden
    death left a hole in his son’s life. Fortunately, Larry’s brother, Carl Jr., lived
    and worked near Stanford. The two brothers shared memories of their father and
    supported each other during the difficult time.


    Despite the traumatic loss, Page continued his studies, burying himself in his
    work. At the time, Silicon Valley was buzzing about Netscape, a technical start-up
    company'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'with a product called a browser. Browsers enable users to navigate the Internet.
    Founded only sixteen months before, the company had swiftly become worth more
    than $3 billion. Wall Street investors grew ever hungry to finance other cutting-edge
    Internet companies in hopes of getting rich fast. Netscape’s success launched
    an Internet era in Silicon Valley.


    Situated south of San Francisco Bay’s choppy waters, Silicon Valley is framed
    by the sun-baked rolling mountains of the Diablo Range and the ancient redwoods
    of the Santa Cruz Mountains. Until the 1940s, sprawling orchards, filled with
    peaches, lemons, apricots, and almonds, blanketed the valley. During World War
    II, the U.S. Navy located a research facility in the area. Other technology firms
    soon followed.


    Journalist Don Hoefler coined the term “Silicon Valley” in 1972. At the time,
    many of the companies in the valley were researching semiconductors, a component
    of electrical devices. Most semiconductors are created with silicon, a common
    element contained in sand and quartz. The name stuck. Today, hundreds of high-tech
    companies, such as Apple, Yahoo!,


    A view of Silicon Valley. The southern tip of San Francisco Bay is just out of
    sight around the knoll to the right.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_31_0.png)'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'eBay boom Silicon Valley their home. The valley has more millionaires per capita
    than anywhere else in the United States.

    Stanford University’s nearby science and engineering schools serve as incubators
    for the region’s high-tech companies. The environment fosters student entrepreneurs
    to develop commercial projects spun out from university research. The Internet
    boom in the 1990s made it difficult to stay in school; Stanford students often
    received received lucrative job offers. But Page and Brin weren’t looking to get
    rich. Instead they devoted themselves to their research.


    In January of 1996, Stanford’s computer science students and faculty moved into
    a new four-story building with the words William Gates Computer Science chiseled
    on the front. Although Bill Gates, co-founder of the Microsoft Corporation, hadn’t
    attended Stanford, he donated $6 million towards the construction of the building.
    Microsoft hired many Stanford graduates, and Gates hoped to help entice new talent
    to his company.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_32_0.png)'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'Page and other graduate students set up an office in Gates 360. Although Brin
    had another office, he spent long hours in Gates 360. The office became home for
    all of them. The students often stayed up late, studying and debating technology.
    They once argued whether it was possible to assemble a building-size structure
    entirely out of lime beans. Technology ruled the office. A bucket of water with
