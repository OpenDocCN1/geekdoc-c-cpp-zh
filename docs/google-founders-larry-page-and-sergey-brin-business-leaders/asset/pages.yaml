  md: 'Brin’s early, loyal employees could turn their stock, or shares in the company,
    into money; Page and Brin would become billionaires.


    When a private company becomes a public company, its stock is sold to public investors
    during an initial public offering (IPO). Companies have many reasons for going
    public. An IPO can raise money to expand the business, pay debts, and make owners
    rich. Imagine a bakery losing money. Many people have stopped shopping there because
    they are allergic to nuts, and all cookies and cakes made at the bakery contain
    nuts or were made on equipment that processes nuts. The bakery’s owners might
    hold an IPO to raise money for equipment and ingredients to make nut-free products.


    Often a company’s founders issue stock to early employees and private investors
    who funded the company as a reward for helping lay the foundation of the business.
    However, the shares have little value at first because the stock isn’t publicly
    traded. After the IPO, shares can increase in value, sometimes by huge amounts.
    People who own many early shares can become very wealthy by selling their shares.
    Sometimes business owners want to get the company going, make it profitable, and
    then sell their shares and move on. Some don’t want to run the business. Others
    just enjoy starting new companies.


    IPOs also have drawbacks. Companies can spend thousands of dollars in fees associated
    with registering an IPO. They often hire experts to help them navigate the paperwork
    and complex rules of the Securities & Exchange Commission (SEC), the federal agency
    that regulates the U.S. stock market to prevent fraud.'
