  pgno: 99
- img_proc: true
  md: '![](img/4289fd47e3baffa20ad5d74d4233a641_100_0.png)


    Dr. Buzz Aldrin, right, an Apollo astronaut, responds to a question during a presentation
    of the $30 million Lunar X PRIZE. Also pictured are Bob Weiss, left, vice-chairman
    of the X PRIZE Foundation, Larry Page, second from left, and Dr. Peter Diamondis,
    the chairman and chief executive officer of X PRIZE Foundation.'
  merge: -1
