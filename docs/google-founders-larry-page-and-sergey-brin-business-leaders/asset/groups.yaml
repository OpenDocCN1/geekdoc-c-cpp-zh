    their employees. In the future, if the company is successful, employees can sell
    their stock and make money.


    To keep Google up and running, Page and Brin needed more money. Nearby Sand Hill
    Road in Menlo Park was home to many venture capital firms that invest money in
    start-up companies in exchange for stock. They take high risks by investing in
    the early stages of a company, in hopes of big returns and financial success.


