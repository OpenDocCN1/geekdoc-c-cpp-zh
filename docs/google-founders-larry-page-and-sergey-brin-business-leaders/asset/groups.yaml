    Moscow State University, in hopes of becoming an astronomer. However, officials
    barred him from the astrophysics program because it shared a university department
    with nuclear physics. The Soviet government deemed Jewish people too untrustworthy
    to have access to nuclear secrets. Instead, Mikhail pursued a career in mathematics.
    The university required him to take entrance examinations specific to Jewish students.
    Although Mikhail was forbidden to continue his education after graduating, he
    studied on his own—sneaking into classes and writing research papers. Sergey’s
    mother suffered the same discrimination when she earned her degree in mathematics.


    Sergey’s parents longed to be free from the oppressive Communist regime. They
    wanted opportunities for themselves and their son. In 1977, Mikhail attended an
    international conference, where he met many foreign researchers. When Mikhail
    returned home, he told his wife they needed to get to America. “He said he wouldn’t
    stay,” said Eugenia, “now that he’d seen what life could be about.” The Brins
    applied for visas, documents granting entry to the United States, in hopes of
    escaping the Soviet Union. When they submitted their visa applications, Mikhail’s
    employers fired him. Fearing the same retaliation, Eugenia resigned from her job.
    While officials reviewed their paperwork, Sergey’s parents struggled for money,
    taking temporary jobs wherever they could find work.


    Two years later, in 1979, officials granted them their visas. The Brins were lucky
    to escape; soon after, the Soviet Union closed all emigration. Sergey, his parents,
    and his grandmother were forced to leave most of their possessions behind when
    they left their native country. Mikhail explained the journey


    ![](img/4289fd47e3baffa20ad5d74d4233a641_18_0.png)


    # The State Historic Museum in Red Square in Moscow


    to his son, sadly telling Sergey that the love of one’s country isn’t always mutual.
    Six-year-old Sergey would remember the journey as a blur. They traveled from Moscow
    to Vienna to Paris to America. “We were in different places from day to day,”
    Sergey said.


    Upon arriving in the United States, the Brins rented a small cinder block house
    in the suburbs of Washington, D.C., not far from the University of Maryland. They
    received support from local Jewish people who had left Russia. “The U.S. was very
    good to us,” “It was a great place, but we started with nothing. We were poor...
    When we first moved to the States we rented a little house, and my parents didn’t
    have a proper room to sleep in. They had to wall off the kitchen. It was a very
    humble beginning.”


    A friend of Mikhail’s helped land a teaching position as a math professor at the
    University of Maryland. Eugenia found work nearby as a scientist at NASA’s Goddard
    Flight Center. Sergey began attending a Montessori school. His teachers followed
    methods developed in the 1920s by Maria Montessori, an Italian physician, who
    believed children learn by playing. Sergey gravity to math puzzles, science projects,
    and maps. He disliked school at first, as he spoke little English and was in a
    strange country. As Sergey grew accustomed to his new world, he soon excelled
    and discovered his love of learning.


    More than five hundred miles away, in a small university town, six-year-old Larry
    also attended a Montessori school. For Larry, reading soon became like breathing.
    On a vacation to Oregon he took an empty suitcase, planning to fill it with books
    from Powell’s Books, a famous store in Portland, Oregon.


    In 1979, the Sergey’s family came to the United States, Larry’s father obtained
    an early home computer called the Exidy Sorcerer. Using a homemade typing program,
    Larry typed entire books on the computer one at a time. His favorite was the book
    Frog and Toad Together. Not long after, Larry began using the computer for school
    assignments. None of his teachers had ever seen schoolwork created on a home computer.


    In the early 1980s, only eight out of 100 people in the United States had computers
    in their homes. For many years, computers had functioned solely as calculators.
    A major breakthrough occurred in 1946 with the Electrical Numerical Integrator
    and Calculator (ENIAC), nicknamed the “Giant Brain.”


    The massive machine occupied an entire room and weighed thirty tons. Highly trained
    operators hooked up cables and flipped the machine’s 6,000 switches. The ENIAC
    performed mathematical calculations at blinding speed; problems previously taking
    twelve hours to solve were answered in thirty seconds. The U.S. military drove
    many technological advances, relying on computers to make calculations for the
    hydrogen bomb and in the space program.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_20_0.png)


    The Electrical Numerical Integrator and Calculator (ENIAC) in Philadelphia, Pennsylvania,
    circa the late 1940s to early 1950s


    In 1976, Steve Wozniak and Steve Jobs, co-founders of the Apple computer company,
    revolutionized personal computers. Their Apple II became one of the first mass-produced
    computers. More companies followed and computers rapidly became more advanced
    and easier to use.


    Like many families, the Pages and Brins were excited by the potential offered
    by the personal computer. Growing up amidst computer parts, Larry especially wanted
    to figure out how things worked. Armed with a set of screwdrivers, a present from
    his older brother, Larry dismantled all the power tools around the house. He excelled
    at taking things apart but often


    ![](img/4289fd47e3baffa20ad5d74d4233a641_21_0.png)


    didn’t put them back together, aggravating his parents. Soon though, Larry built
    a working printer—out of Legos.


    When Larry was eight years old, his parents divorced. At the same time, his brother
    left home to study computer science at the University of Michigan. Despite the
    changes, Larry was still surrounded by family members who loved him and spent
    time with him. Larry’s father especially enjoyed taking his son to Grateful Dead
    rock concerts.


    Larry loved music and played the saxophone. Quiet, shy, and a bit of a loner,
    he often turned to music, math, and reading. At twelve years old, Larry read a
    biography about Nikola Tesla, one of the greatest scientific inventors of the
    1800s and early 1900s. The book changed Larry’s life and sparked his dream of
    becoming an inventor.


    According to legend, Nikola Tesla was born in Croatia in 1856 at the stroke of
    midnight during an electrical storm. After immigrating to the United States, Tesla
    worked for Thomas Edison, quitting after an argument about wages. Tesla focused
    on his own inventions, working in New York and in Colorado Springs, near the fierce
    electrical storms common in the Rocky Mountains. His own man-made lightning often
    surrounded him in his lab.


    Despite his brilliance, Tesla led a tragic life. Plagued by obsessive-compulsive
    disorder, he was a fanatic about cleanliness and about the number of three. Tesla
    circled a block three times before entering a building, using three napkins at
    meals, and refused to stay in a hotel room unless the room number was divisible
    by three. By middle age, Tesla’s obsessive impulses controlled him. He spent the
    last years of his life attempting to contact the planet Mars. He died deeply in
    debt,


    not receiving recognition for his innovations until years after his death.


    Larry quietly absorbed lessons from Tesla’s successes and failures, realizing
    Tesla unwittingly gave away many of his innovations. In the future, Larry would
    zealously guard his new inventions, keeping them secret until the last moment.
    “It’s a very sad story,” Larry said. “I realized Tesla was the greatest inventor,
    but he didn’t accomplish as much as he should have. I realized I wanted to invent
    things, but I also wanted to change the world. I wanted to get them out there,
    get them into people’s hands so they can use them, because that’s what really
    matters.”


    As Larry dreamed of inventing, Sergey also discovered his talents. Unlike Larry,
    he was rebellious and boisterous, and not especially interested in music or reading.
    “Sergey was a good boy,” his father joked, “when he was asleep.” Once, on a trip
    back to Russia, Sergey threw pebbles at a Soviet policeman. His parents had to
    promise the irate policeman they would severely punish their son at home. The
    Brins never forgot their reasons for leaving the Soviet Union. Sergey’s parents
    raised his son in the Jewish faith. For a few years, he attended Hebrew school,
    but he disliked it so much that his parents allowed him to stop going. As an adult,
    Sergey would choose not to practice his parents’ religion. Larry would make the
    same decision.


    Sergey loved to question his teachers and to prove them wrong. They soon recognized
    his mathematical genius and brought in special teachers to challenge him. “He
    was a brash young man,” said one of Sergey’s teachers. “But he was so smart. It
    just oozed out of him.” For Sergey’s ninth birthday,


