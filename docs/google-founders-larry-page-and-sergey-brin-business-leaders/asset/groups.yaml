    # “LarryAndSergey"


    Alto, they met Paul Flaherty, the architect of AltaVista. More than half of the
    people searching the Internet used AltaVista. Although people considered it one
    of the best search engines, it didn’t rank information. Page and Brin explained
    to Flaherty how Google was better than AltaVista. ‘They were excited by what they
    were able to do,’ said Dennis Allison, the Stanford professor who arranged the
    meeting. ‘They were very anxious to share it. They were basically saying in a
    polite way, ‘AltaVista is dead meat. We have PageRank.’ Page and Brin offered
    to set PageRank to Flaherty for $1 million. Flaherty declined their offer, as
    did other companies. Companies wanted users to come to their sites to shop and
    spend money, not just ask questions.


    Page and Brin realized they had a wall. Without more funding, they couldn’t buy
    the computer parts they needed to keep expanding Google. David Filo, the Stanford
    student who co-founded Yahoo!, advised Page and Brin to start their own business.


    One of their professors, David Cheriton, knew Andy Bechtolsheim, a legendary investor
    in successful start-up companies. Cheriton suggested Page and Brin to discuss
    Google. Although the two students disliked getting up early, Cheriton arranged
    the appointment for eight in the morning on his front porch, which Bechtolsheim
    passed each morning on his way to work.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_38_0.png)

    David Filo, co-founder of Yahoo!


    At their meeting, Page and Brin told Bechtolsheim how they could download, index,
    and rapidly search the Internet, using a network of inexpensive personal computers.
    They explained that they needed money to buy more machines. Bechtolsheim realized
    Page and Brin''s idea solved a real problem. He liked that they didn''t plan to
    waste money on advertising or equipment. “Other Web sites took a good chunk of
    venture funding and spent it on advertising,” Bechtolsheim said. “They [Page and
    Brin] believed in word of mouth. This was the opposite-approach. Build something
    of value and deliver a service compelling enough that people would just use it.”


    Bechtolsheim told the pair it was one of the best ideas he''d heard in years and
    wrote them a check for $100,000, twice the amount they had suggested. He made
    the check out to Google, Inc., a company that didn''t exist yet. Afterwards, Page
    and Brin celebrated by going to Burger King.


    Back in Page’s dorm room, Page and Brin put Bechtolsheim’s check in a desk drawer—because
    there was no bank account and no place to deposit the money. The two of them filled
    out the legal paperwork to create their company. On September 7, 1998, Google,
    Inc. became an official company.


    Too busy with their new company to continue their studies, Page and Brin took
    leaves of absence from Stanford. The decision made their parents unhappy. “We
    were definitely upset,” said Brin’s mother. “We thought everybody in their right
    mind ought to get a PhD.” With grim looks on their faces, Page and Brin took empty
    boxes that contained the remnants of their lives as graduate students. Page and
    Brin were now business owners, unsure whether their path held success or failure.


    ## From Garage to Googleplex


    After launching Google, Page and Brin set up shop in a small garage in Menlo Park,
    close to Palo Alto. For $1,700 a month, they rented a few rooms in the garage
    where they kept their computers and gadgets. Page and Brin flipped a coin to decide
    who would be Google’s president. Brin won. Page became chief executive officer,
    or CEO. They hired their first employee, Craig Silverstein, a friend and fellow
    graduate student. Their sparse office hardly looked like a successful company.
    Page, Brin, and Silverstein sat at desks made from old doors, a few rickety tables
    and chairs, a washer and dryer, and a tiny refrigerator on top of the worn shag
    carpet. Page and Brin worked in the garage nearly twenty-four hours a day. They
    were driven but knew little about running a business. Successful companies often
    have humble beginnings.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_41_0.png)

    The house where Google co-founders Larry Page and Sergey Brin first set up in
    Menlo Park


    The sum of their business experience was a few months. That year, a journalist
    asked Bill Gates about the biggest threats. Instead of listing well-known adversaries,
    like Apple or Netscape, Gates responded, “I fear someone in a garage who is devising
    something new.” Innovative companies, such as Google, could grow to challenge
    established companies like Microsoft. By the doorbell of their apartment, they
    tapped up a handwritten sign: Google’s World Headquarters.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_43_0.png)

    Through a friend, Page and Brin met Ruth Kedar, a graphic designer and assistant
    professor at Stanford. They decided to hire her to design Google’s logo. They
    wanted something basic but playful, representing the values of their company.
    “It was important for them to tell me what they believe in, where they see themselves
    in the future...” Kedar said. “At the time, many people were afraid to use the
    Internet, and it was important to broadcast something user-friendly on the home
    page. Kedar presented several sketches to Page and Brin. In one drawing, Google’s
    o looked like magnifying glasses; in another, they looked like a target. After
    many revisions, she settled on the typeface “Catull” to write the word Google
    in colorful letters, with slightly tilted o’s, on a white background. The uncluttered
    logo remains in place today, representing simple, free Internet searching.


    Page and Brin fanatically kept the number of words on their homepage to a minimum,
    just twenty words, so it looked clean and quick to read at a glance. Nothing about
    Google was slow. At the click of a mouse, a query was sent to Google’s machines
    and compared with all the documents stored in the index. In a quarter of a second
    (an eyeball is one tenth of a second), the system prepared a list of the most
    relevant pages.


    By the end of their first year in business, Page and Brin were attracting attention.
    In December, PC Magazine listed Google.com as one of the Top 100 Web sites for
    1998. Making the list put Google on the radar for thousands of people. Other companies
    were focusing less on search and more on providing all-purpose sites. These changes
    drove people to Google’s free, quality search.


    As Google’s popularity spread by word of mouth, the number of searches soared.
    Google was now receiving 500,000 queries a day. Page and Brin struggled to keep
    up with demand. They had eight employees, and soon hired more, one of whom brought
    Google’s first company dog, Yoshka, to work. In need of more computers, they began
    ordering them in packs of twenty-one.


    After only five months of working out of the garage, Page and Brin ran out of
    room. In early 1999, they rented an office above a bike shop in downtown Palo
    Alto. They stocked their office with plenty of coffee, coolers of fruit juice,
    and chewy red Swedish Fish candies. They used their ping-pong table as a conference
    table and kept hockey sticks and rollerblades on hand, for when they took rare
    breaks.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_45_0.png)

    Page and Brin wanted their company to have a creative, free-spirit atmosphere.


    > To just invent something and have a great idea is a lot of work, but it is not
    enough,” said Page. “You have to get it out in the world. At Google, it is a combination
    of scientific and mathematical skills, and computer skills, and also very strong
    skills about how to get people excited about their work.” The pair wrote a list
