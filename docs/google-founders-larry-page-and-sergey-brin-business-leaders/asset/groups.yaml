    # Business Leaders


    # Google Founders: Larry Page and Sergey Brin


    Computers were Larry Page and Sergey Brin''s childhood toys. At a young age, Brill
    could solve complex mathematical equations, and Page could build working printers
    out of Legos. Both from brilliant academic families, they grew to love learning,
    logic, and technology. Although from different countries, Page and Brin met at
    Stanford University. In a rundown garage in Palo Alto, California, they founded
    Google, an Internet company that changed the world. Today, Google places information,
    news, maps, images, videos, blogs, e-mail, and more at the fingertips of millions
    of people.


    With the creation of Google, Page and Brin became the world''s youngest self-made
    billionaires. Despite their fame and wealth, they continue to develop innovative
    services and aim to live Google''s “Don''t Be Evil” motto. Using creative, cutting-edge
    technology, Page and Brin are helping to find solutions to environmental, educational,
    and health issues affecting people around the world.


    Kerrily Sapet is the author of a number of books for Morgan Reynolds, including
    Jimmy Choo, Cleopatra, Elizabeth I, Eleanor of Aquitaine, Michael Phelps, and
    Zora Neale Hurston, as well as four titles in the Political Profiles series.


