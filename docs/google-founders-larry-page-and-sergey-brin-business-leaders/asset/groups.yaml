    以放弃对 Google 的控制权来换取回报。这对组合很难说服严肃的投资者为一家提供提供服务的公司融资。


    在被拒绝几次后，佩奇（Page）和布林（Brin）与风险投资家约翰·多尔（John Doerr）和迈克尔·莫里茨（Michael Moritz）见面。与其他投资者不同，多尔和莫里茨被吸引了。他们喜欢佩奇和布林的组合，并意识到随着互联网的演变，像
    Google 这样的公司具有增长和变化的潜力。


    多尔和莫里茨都决定给 Google 一个机会。然而，他们拒绝共同投资，不想向对方让出任何控制权。尽管佩奇和布林急需资金来维持 Google 的运营，但大胆地告诉多尔和莫里茨，如果这两个投资者无法达成共识，他们将离开。几天之内，他们四个人敲定了交易细节。两位金融家都同意各向
    Google 投资 1250 万美元，条件是佩奇和布林要聘请一位专家高管来帮助将 Google 转变为一家盈利的企业。


    投资交易达成后，佩奇和布林进行了急需的假期，参加了内华达州黑岩沙漠的火人节。在漫长的节日期间，人们聚集在沙漠中一个由帐篷和营地建成的城镇。由于没有食物和水，参与者自自带所有的物资。这个免费的艺术社交聚会由高大的木人形象象征，木人在周末结束时焚烧。在佩奇和布林离开之前，Google
    员工丹尼斯·黄（Dennis Hwang）在 Google 首页的 Logo 上创作了一个涂鸦（Doodle）。第二个字母“o”中的一根火柴画告诉 Google
    用户佩奇和布林将参加火人节。著名的 Google 涂鸦由此诞生了。


    不久后，布林在 Google 首页上创建了一个万圣节标志，在两个字母“o”上画有两个南瓜。Google 用户非常喜欢这些设计。佩奇和布林开始每个月推出几个艺术涂鸦，庆祝新年和奥运会等节日和活动。很快，名单就扩大了。Google
    涂鸦纪念了艺术家、娱乐人员和科学家的生日，并向莱特兄弟的首次飞行和马丁·路德·金日等重要事件致敬。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_47_0.png)


    有了扩张公司的资金，佩奇和布林决定 Google 需要额外的计算机和内存。


    他们从在线公司订购了 80 包电脑。他们还访问了 Fry''s，一家大型电子产品连锁店。佩奇和布林储备了物资，回到办公室，开始拆解电脑，移除任何耗电的部件。他们重新构建了机器，通过自定义软件和布线共同创建了精简的计算机。一位作者说，这些被称为“Googleware”（Google硬件）的电脑是“打了类固醇的平普通版
    PC”。佩奇和布林每花费1 美元，平均获得的计算能力和内存比竞争对手多三倍。


    然而，由于使用强度大，Google 的电脑在了一两年内就烧坏了。每天都有几台机器损坏。佩奇和布林使用的计算机足够，以至于如果一个集群宕机，共享互联网副本和数据的计算机会自动接管。


    佩奇和布林将数据和任务分布在多个地点的大量计算机上，以便整个系统能够处理问题而不崩溃。他们运行了三个离线数据中心——两个在加利福尼亚，一个在华盛顿特区——很快在全国范围内增加了更多，所有由单一地点进行监控。计算机放置在冷却的仓库里，以防止设备过热。仓库公司按使用的空间面积收费，因此佩奇和布林在冰箱大小的架子上尽可能地堆叠了大量的机器。其中一个数据中心发生的火灾测试了
    Google 计算机系统的性能。尽管用了 6 辆消防车才控制住火势，但大多数 Google 用户从未知道出问题。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_49_0.png)


    *Google 的第一个生产服务器。拉开“头发”（电线）露出了一排廉价的网络化 PC。*


    有一天，佩奇和布林将拥有数十万台定制机器。“它们运行着世界上最大的计算机系统，”斯坦福大学校长约翰·亨内西说道，“我认为布林甚至谈不上它的边。”


    佩奇和布林现在被称为“Google 兄弟”，他们发现自己的办公室又太小了。他们决定租赁山景镇一栋建筑的二楼，距离斯坦福大学骑车十分钟。很快，他们扩展到了一楼。接着，他们租赁了隔壁建筑。人们称之为
    Googleplex。


    Googleplex 内部的文化反映了佩奇和布林的个性，有小摆件、气足球桌、熔岩灯、咖啡机，以及大型健身球和椅子上的豆袋。因为员工每天工作时间很长，佩奇和布林试图让他们的工作氛围既舒适又方便。他们开始了店内洗衣服务，并租赁了带有互联网的班车，以便他们的员工在从附近旧金山的通勤路上工作。


    1999 年 11 月，佩奇和布林决定为公司食堂聘请一名厨师。他们举行了厨艺大赛……（注：此处原文存在大量重复的乱码文本，已按要求忽略无意义的重复部分）。

