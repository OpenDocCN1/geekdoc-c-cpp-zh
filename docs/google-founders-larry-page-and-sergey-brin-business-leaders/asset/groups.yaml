    ![](img/4289fd47e3baffa20ad5d74d4233a641_49_0.png)


    *Google’s first production server. Pulled back “hair” (cords) reveals a rack of
    cheap networked PCs.'
  - '[PAGE 50]


    One day Page and Brin would have hundreds of thousands of custom-built machines.
    “They run the largest computer system in the world,” said Stanford president John
    Hennessy. “I don’t think Brin is even anything close.”


    Page and Brin, now nicknamed the Google Guys, found they had outgrown their offices
    again. They decided to lease the second floor of a building in the town of Mountain
    View, a ten-minute bike ride from Stanford. Soon they expanded to the first floor.
    Next, they leased the building next door. People called it the Googleplex.


    The culture inside the Googleplex reflected Page’s and Brin’s personalities, with
    gadgets, foobsall tables, lava lamps, espresso machines, and large exercise balls
    and beanbags on chairs. Because employees worked long hours each day, Page and
    Brin tried to make their working atmosphere pleasant and convenient. They started
    an on-site laundry service and chartered buses with Internet, so their employees
    could work during their commutes from nearby San Francisco.


    In November of 1999, Page and Brin decided to hire a chef for a company cafeteria.
    They held a cook-off, won by Charlie Ayers, a former chef for the Greatful Deaf.
    Soon Google employees, or Googlers, dined on foods like sushi, sweet potato jalapeno
    soup, and chocolate fondue. Page and Brin instituted Seafood Fridays with a smorgasbord
    of seafood—from oysters to lobster.


    People recognized that Google wasn’t an average company, and Page and Brin weren’t
    typical business owners. Young and enthusiastic, they made information free and
    accessible for everyone. Google stood in stark contrast to other big companies
    like Microsoft. In 2000, Microsoft violated anti-trust'
  - '[PAGE 51]


    ![](img/4289fd47e3baffa20ad5d74d4233a641_51_0.png)'
  - '[PAGE 52]


    ![](img/4289fd47e3baffa20ad5d74d4233a641_52_0.png)'
  - '[PAGE 53]


    laws, or laws that prohibit unfair business practices. The trial, which Microsoft
    lost, depicted Bill Gates as the head of a corporate monster. Google benefited
    from the negative publicity Microsoft received. “Competition is a good thing,”
    Gates responded. “On the other hand, nobody’s doing a very good job of competing
    with Google right now.”


    Soon, Google was named the leading Internet search engine, with 99 percent of
    users ranking it better than its competition. Page and Br began translating their
    site into other languages. They started up Web sites in France, Germany, Denmark,
    Portugal, and other European countries. As Google continued to expand and hire
    new, nicknamed Nooglers, other Internet companies collapsed.


    For many years, investors had been pouring money into Internet start-up companies.
    A mania for Internet stocks caused prices to rise to an all-time high on NASDAQ,
    the electronic stock market where shares in most Internet companies are traded.
    In 2000, 457 private Internet companies became public companies by allowing investors
    to buy their stock. Many of the companies doubled in value on the first day. People
    called it “dot com bubble,” as the phrase .com was a suffix in many Web sites’
    names. However, investors soon realized that few of these businesses had plans
    for making money. Most had been financed by venture capitalists. The companies
    gave away services, in hopes of building a customer base, while figuring out ways
    to make money from users. Although some of the businesses became successful, many
    failed. In March 2000, the bubble burst and Internet stocks plummeted in value.
    High-tech firms across Silicon Valley went bankrupt.'
  - '[PAGE 54]


    Google resembled the failing Internet companies in some ways. They too existed
    on venture capital funds and provided free services, without generating revenue.
    However, being a private company, not controlled by the stock market, helped Google
    stay afloat as others sank around them. Page and Brin held the reins to one of
    the only Internet companies hiring in the wake of the stock market crash. They
    attracted many of the bright individuals who had recently lost their jobs.


    The press raved about Page and Brin''s company. Google was free, easy to use,
    and practical. Users appreciated the site''s creativity and humor. Page and Brin
    soon started another yearly tradition of issuing an April Fool''s Day joke. In
    2000, Page and Brin told the site''s users to try MentalPlex, a faster way to
    search. They advised users to peer into a swirling circle on the screen, project
    a mental image of what they wanted to search, and visualize clicking the circle.
    Google''s followers loved it. Another year Page and Brin announced a free Internet
    service called TiSP, the Toilet Internet Service Provider, suggesting people obtain
    a connection by flushing one end of a fiber optic cable down the toilet. Page
    and Brin began people obtain hiding jokes, called Easter eggs, on their site.
    During the World Cup in 2000, when users entered soccer-related search terms,
    Google''s homepage changed to read “Goooo....al!” instead of Google.


    That year, Google won its first Webby Award. The Webby Awards are the Oscars of
    the Internet. Just as the Oscars, Academy Awards, honor the finest actors and
    films of the year, the Webby Awards recognize the best of the Internet.


    Started in 1996, the Webby Awards are presented by the International Academy of
    Digital Arts and Sciences,'
- md: '

    whose members include Web and business experts, writers, and talented artists.
    There are four awards categories: Web sites, interactive advertising, online film
    and video, and mobile and apps. Each category has two honors: the Webby Award—selected
    by the Academy—and the People’s Voice Award—selected by online voters. The Academy
    receives tens of thousands of entries from countries around the world. Winners
    have included eBay, Wikipedia, and Amazon.com.


    In 2000, the Webby Awards were held at the Masonic Center in San Francisco''s
    posh Nob Hill neighborhood. Inside the large, modern auditorium, Google swept
    the Technical Achievements category, winning the Webby Award and the People’s
    Voice Award as voted by 134,000 users. Google’s team members accepted the award
    by skating onto the stage on roller skates and wearing Google hockey jerseys.
    Webby winners are limited to acceptance speeches of five words or less. “We love
    you, Google users,” said Brin. In Google’s press release, Brin continued his speech.
    “We want to thank all our loyal Google fans who voted for us,” he said. “They
    are the most fun and spirited in all of cyberspace. Their continued support and
    enthusiasm has helped to fuel Google’s phenomenal month over month traffic growth.


    In just two years, Page and Brin’s company had become the largest, fastest search
    engine in the world, with more than 1 billion Web pages in its index. “Google’s
    new gigantic index means that you can search the equivalent of a stack of paper
    more than 70 miles high in less than half a second,” said Page. “This unprecedented
    power enables millions of Google users worldwide to communicate, learn and entertain
    like never before.”


    With their success, Page and Brin faced critical questions. Their operating costs
    now exceeded $500,000 a month, rapidly devouring their venture capital funds.
    Their expenses mounted with their need to meet rising user demand. Page and Brin
    realized once again that they needed more money and more computers. The Google
    Guys had to figure out how to make money before they ran out of it.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_57_0.png)


    More and more people started using Google to search the Web.


    # 4 Google Grows


    By 2000, Page and Brin struggled to keep up with the costs of running a business
    on Google’s scale. Some people figured that the Google Guys would start charging
    their hooked users to search Google’s massive index. But Page and Brin liked offering
    Google for free and planned to keep it that way.


    Neither Page nor Brin liked the idea of advertising on Google. Instead they had
    focused on licensing their search technology to others. However, with the crunch
    to stay in business, they decided to sell ad space on Google.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_58_0.png)


    To make clear that advertising didn’t impact the results of the search, Page and
    Brin kept Google’s homepage free of ads and instituted strict guidelines. All
    ads were brief and identical in appearance. Each contained a headline, a two-sentence
    description, and a link to the site. They didn’t pop up ads or flashing graphics.
    A vertical line separated the search results from the ads, which appeared to the
    right of the screen and were clearly labeled sponsored links.


    The queries Google users entered certain ads. If a person typed into the word
    guitar, Google returned search results along with a list of sponsored links related
    to guitars. Just as PageRank listed sites in relevant order, Google’s ads functioned
    the same way. Page and Brin ranked ads, not by which advertiser spent the most
    money, but by how frequently users clicked on those ads. Popular ads rose to the
    top of the sponsored links.


    In October 2000, Page and Brin launched AdWords, their self-service advertising
    program. Advertisers signed up online, activating their account with a credit
    card. Ads could be up and running within minutes. The system cut costs for Google,
    and gave all businesses—small and large—equal opportunities to place ads.


    Using an automated, online system, advertisers made bids to have their ads appear
    next to specific search terms. For example, the swimwear company Speed might be
    run next to the keywords swimsuit or goggles. Page and Brin set the minimum bid
    at five cents. Companies spent anywhere from ten dollars to thousands of dollars
    in auctions.


    Page and Brin’s AdWords program revolutionized online advertising. In the science
    of marketing, companies study how to target ads to the people most likely to buy
    their products. For many years, advertisers just bought space on billboards, in
    newspapers and magazines, and on television. Now, more businesses were marketing
    their products and services to online users. AdWords gave advertisers instant
    access to users who were matching themselves to ads by going online and typing
    in search terms.


    AdWords solved the mystery of how Page and Brin could make money from searches.
    The small, targeted ads soon turned Google into a moneymaking machine. Page and
    Brin were operating a twenty-four-hour advertising store, in which thousands of
    keywords and phrases could be sold.


    Although Google was becoming an incredibly successful company, the two men running
    it, both still in their twenties, had minimal business experience. When Page and
    Brin received their funding, Doerr and Moritz had stipulated they hire an experienced
    executive to help run Google. Not wanting to give up any control of their company,
    Page and Brin had found excuses to reject each candidate Doerr and Moritz proposed.
    They met with about fifteen candidates who were invited to join Page and Brin
    for a meal in the cafeteria and to attend staff meetings. “They thought everyone
    they talked to was a clown,” said one Google employee. “The candidates didn’t
    understand technology.” But “day-to-day adult supervision” and threatened to revoke
    their $25 million in funding.


    In March 2001, Page and Brin met with candidate Eric Emerson Schmidt. With a PhD
    in computer science, Schmidt had the technical background Page and Brin required.
    Schmidt also possessed the experience Google’s investors wanted,


    ![](img/4289fd47e3baffa20ad5d74d4233a641_61_0.png)


    having held top positions at multinational computer companies, such as Sun Microsystems.
    When Page and Brin sat down with Schmidt, they peppered him with questions and
    argued with him. The Google Guys respected Schmidt’s ability to hold his own in
    the debate and agreed to hire him as their chief executive officer. Titles switched.
    Page became the president of products and Brin, the president of technology. Doerr
    and Moritz realized Page and Brin had made the right decision by waiting. “They
    resisted hiring ordinary people, and that’s a wonderful tribute to them,” said
    Moritz. “One of the many lessons I learned from the Google investment is the importance
    of hiring spectacular people. Sometimes it frustrated us, but they were spot on.”


    Schmidt worked on improving Google’s financial record keeping, payroll systems,
    and business dealings. Page and Brin had been using Quicken, a personal finance
    software program unequipped to handle a company with two hundred employees and
    large amounts of advertising revenue. Although Page and Brin played practical
    jokes on Schmidt at first, they came to value his experience.


    For the first time in the span of Google’s existence, Page and Brin turned a profit.
    Due to AdWords, by the end of 2001 Google had made $7 million. Although the program
    started with only 350 advertisers, big companies like Walmart, one of America’s
    largest retailers, had begun advertising on Google. Although more than half of
    Google’s searches come from users outside of the United States, only 5 percent
    of the ads originated in other countries. Page and Brin opened offices in London,
    Hamburg, Tokyo, and Toronto. Google now had more than 3 billion Web pages in its
    index and offered search services in sixty-six languages, including invented languages
    such as Klingon.


    With the increase in profit, Page and Brin had the time and resources to devote
    to inventing other Google services. They soon launched Google Images, a searchable
    database containing approximately 250 million images and photographs. Google Images
    became an instant hit; nothing else it existed. Page and Brin also introduced
    Google Maps. Users could view interactive maps, based on satellite imagery, and
    get detailed directions between destinations. A hidden joke on the site instructed
    people to kayak across the Pacific Ocean when they asked for directions to a location
    near a body of water.

