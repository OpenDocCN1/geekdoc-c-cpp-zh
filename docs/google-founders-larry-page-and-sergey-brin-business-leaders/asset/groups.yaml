    # “Larry 和 Sergey”


    在阿尔托市，他们见到了 AltaVista 的架构师保罗·弗拉赫蒂。超过一半搜索互联网的人在使用 AltaVista。尽管人们认为它是最好的搜索引擎之一，但它并不对信息进行排名。Page
    和 Brin 向 Flaherty 解释了 Google 为什么比 AltaVista 更好。“他们对自己能做到的事情感到非常兴奋，”安排这次会议的斯坦福教授丹尼斯·艾利森（Dennis
    Allison）说道，“他们非常渴望分享它。他们基本上是在礼貌地说：AltaVista 死了。我们有 PageRank。”Page 和 Brin 以 100
    万美元向 Flaherty 出售 PageRank。Flaherty 拒绝了他们的提议，其他公司也是如此。公司希望用户来到自己的网站购物和消费，而不仅仅是提问。


    Page 和 Brin 意识到他们面临着瓶颈。如果没有更多的资金，他们就无法购买扩展 Google 所需的电脑配件。Yahoo 的联合创始人、斯坦福学生大卫·菲洛（David
    Filo）建议 Page 和 Brin 出来创业。


    他们的教授之一大卫·切里顿（David Cheriton）认识传奇投资人安迪·贝托尔海姆（Andy Bechtolsheim）。切里顿建议 Page 和 Brin
    讨论一下 Google。尽管这两个学生不喜欢早起，但切里顿安排在早上八点在他在前门前会面，而贝托尔海姆每天上班路上都会经过那里。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_38_0.png)

    Yahoo! 的联合创始人大卫·菲洛


    在会议期间，Page 和 Brin 向 Bechtolsheim 解释了他们如何利用由廉价个人电脑组成的网络来下载、索引并快速搜索互联网。他们解释说需要资金来购买更多机器。Bechtolsheim
    意识到 Page 和 Brin 的想法解决了一个真实的问题。他喜欢他们没有计划把钱花在广告或设备上。“其他网站获取了大量的风险资金并将其花在广告上，”Bechtolsheim
    说，“而他们（Page 和 Brin）相信口碑。这是一种反其而道的方法。建立有价值的东西并提供足够吸引力的服务，让人们自然而然地使用它。”


    Bechtolsheim 告诉这对组合这是他多年年来听过的最好的想法之一，并给他们开了一张 10 万美元的支票，是他们建议金额的两倍。他把支票抬头写的是 Google,
    Inc. 这是一家还不存在的公司。之后，Page 和 Brin 去汉堡王庆祝了胜利。


    回到 Page 的宿舍房间，Page 和 Brin 把 Bechtolsheim 的支票放在了抽屉里——因为他们没有银行账户，也没有地方存钱。他们填写了创建公司的法律文件。1998
    年 9 月 7 日，Google, Inc. 正式成为一家公司。


    由于忙于新公司而无法继续学业，Page 和 Brin 从斯坦福大学请了假。这个决定让他们的父母很不开心。“我们非常难过，”Brin 的母亲说，“我们认为任何神智正常的人都应该读博士学位。”Page
    和 Brin 面色凝峻地搬走了空箱，里面装着他们作为研究生生活的遗留。Page 和 Brin 现在是企业所有者，不确定自己的道路通向成功还是失败。


    ## 从车库到 Googleplex


    在推出 Google 之后，Page 和 Brin 在位于帕洛阿尔托附近的梅洛公园的一个小车库里设立了办公室。他们每月支付 1700 美元在车库里租了几个房间，存放他们的电脑和设备。Page
    和 Brin 通过抛硬币来决定谁担任 Google 的总裁。Brin 赢了。Page 成为首席执行官（CEO）。他们雇用了第一位员工克雷格·西尔弗斯坦（Craig
    Silverstein），一位朋友兼研究生同学。他们简陋的办公室看起来不像一家成功的公司。Page、Brin 和 Silverstein 坐在由旧门制成的桌子、几张摇摇欲坠的桌椅、一台洗衣机和烘干机，以及一台放在破旧地毯上的小冰箱旁。Page
    和 Brin 每天在车库里工作近 24 小时。他们充满动力，但对经营业务知之甚少。成功的公司往往都有平凡的起点。


