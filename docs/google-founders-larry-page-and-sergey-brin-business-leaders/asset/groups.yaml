    # The Boys Who Loved Computers


    His parents bought him a Commodore 64 computer. Sergey began to see ways to apply
    his skill in math and his scientific mind to computers.


    Sergey loved to debate with his parents, who often challenged him more than his
    teachers. His father was tough and demanding, as a parent and professor. “Almost
    half the statistics class he taught dropped out after the first session because
    they couldn’t handle his assault and battery on their sense of self,” said one
    student.


    When Sergey was nine years old, he overheard his father talking to some colleagues.
    Mikhail complained that none of his students could solve a complex math problem
    he assigned. After listening to the conversation, Sergey offered the correct solution
    to the problem.


    The large and clunky Commodore 64 keyboard and mouse


    ![](img/4289fd47e3baffa20ad5d74d4233a641_24_0.png)


    At fifteen years old, and still in high school, Sergey enrolled in math and computer
    science classes at the University of Maryland. That same year, 1988, his brother
    Sam was born. Sam soon excelled at basketball and dreamed of becoming a professional
    athlete. Because the Brins treasured scholarship, Sam grew up believing advanced
    degrees were necessary for any career. He asked his father, “Is it true that before
    you play in the NBA you have to get a PhD?” Mikhail answered, “Yes, Sam, that’s
    it.”


    Sergey graduated from high school a year early and began taking graduate-level
    classes at the university. At age nineteen, he received his degree from the University
    of Maryland. After graduation, Sergey joked about running off and joining the
    circus. He loved gymnastics and had trained on the trapeze for many years. Sergey’s
    path ahead was clear though. He received a National Science Foundation scholarship
    and soon enrolled at Stanford University to pursue a PhD. Within two years, Larry
    would join him there.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_25_0.png)


    Like Sergey, Larry excelled in high school. He followed in his family’s footsteps
    and studied computer engineering at the University of Michigan.


    The National Science Foundation logo


    When Larry used a handheld computer in his classes, no one knew what it was. In
    Larry’s free time, he worked at a dough-nut stand and helped the school’s solar
    car team build a car that won a national championship. When Larry graduated in
    1995, he too was accepted at Stanford University. Neither he nor Sergey, knew
    what was in store for them at Stanford.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_27_0.png)


    # 2


    "Larry and Sergey"


    As soon as he set foot on Stanford University’s campus in 1995, Larry Page met
    Sergey Brin. Brin served as a tour guide, walking Page and other new graduate
    students around Stanford’s sprawling campus.


    Located between San Francisco and San Jose, California, Stanford’s campus is fringed
    with palm trees and eucalyptus. Students attend classes in rectangular cream-colored
    buildings, lined with arches and topped with red-tiled roofs, in classic Spanish
    style. More than seventy sculptures dot the neatly trimmed green lawns. Some of
    the 15,000 students enjoy fountain hopping, leaping into the blue waters of the
    many fountains on campus, and steam tunneling, exploring the university’s underground
    steam tunnels.


    More than just the beautiful, sunny campus attracted Page and Brin to Stanford.
    They were lured by the school’s reputation. Since the school opened in 1891, it
    has evolved into one of the world’s top universities, recognized for its excellence
    in science, technology, and math. Stanford is home to scholars who have won Nobel
    and Pulitzer Prizes and Presidential Medals of Freedom. Stanford graduates founded
    Yahoo! and Hewlett-Packard, a leading technology company.


    The chance to take part in cutting-edge computer science research excited both
    Page and Brin. However, when the future co-founders met that day, they argued
    nonstop about random issues. “We both found each other obnoxious,” said Brin.
    “But we said it a bit jokingly. Obviously we spent a lot of time talking to each
    other, so there was something there. We had a kind of bantering thing going.”


    Brin and Page differed in personality. Confident and social, Brin was spontaneous
    and intense. Page was a shy midwesternner who worried about being sent home for
    not meeting the school’s rigorous standards. “They were both brilliant, some of
    the smartest people I have ever met,” said Stanford professor Rajeev Motwani.
    “But they were brilliant in different ways. . . . If there was a group meeting
    of twenty people, Sergey was holding court. You wouldn’t notice [Larry] if he
    was in a crowd, but then afterward he would say, ‘Hey, what do you think of this
    idea?’”


    Despite their initial squabbling, Page and Brin had more similarities than differences.
    Math and science framed their respective childhoods. Soon they became nearly inseparable.
    Friends called them “LarryAndSergey.” As they delved into research projects together,
    each brought different abilities to their work. They were like “two swords sharpening
    each other,” said one professor.


    As Brin had already mastered graduate-level coursework at the University of Maryland,
    he aced all ten of Stanford’s required doctoral exams on the first try. Most students
    didn’t pass all of the exams until their third year. Brin didn’t need to take
    any classes to earn his PhD; his remaining requirement was to write his thesis.


    Brin explored many subjects at Stanford. “I expected him to get somebody, maybe
    a professor,” said Brin’s father. “I asked him if he was taking any advanced courses
    one semester. He said, ‘Yes, I tried many different things.’” The more you stumble
    around, the more likely you are to stumble across something valuable.


    Page’s first year at Stanford was rough. Not long after he settled into life on
    campus, his father became critically ill. Carl Page suffered from complications
    following pneumonia. His health declined rapidly, and his ability to breathe deteriorated.
    Within weeks, at only fifty-eight years old, Carl passed away. He would be remembered
    as a pioneering scholar and teacher who loved debate. Carl Page’s sudden death
    left a hole in his son’s life. Fortunately, Larry’s brother, Carl Jr., lived and
    worked near Stanford. The two brothers shared memories of their father and supported
    each other during the difficult time.


    Despite the traumatic loss, Page continued his studies, burying himself in his
    work. At the time, Silicon Valley was buzzing about Netscape, a technical start-up
    company with a product called a browser. Browsers enable users to navigate the
    Internet. Founded only sixteen months before, the company had swiftly become more
    than $3 billion. Wall Street investors grew ever hungry to finance other cutting-edge
    Internet companies in hopes of getting rich fast. Netscape’s success launched
    an Internet era in Silicon Valley.


    Situated south of San Francisco Bay’s choppy waters, Silicon Valley is framed
    by the sun-baked rolling mountains of the Diablo Range and the ancient redwoods
    of the Santa Cruz Mountains. Until the 1940s, sprawling orchards, filled with
    peaches, lemons, apricots, and almonds, blanketed the valley. During World War
    II, the U.S. Navy located a research facility in the area. Other technology firms
    soon followed.


    Journalist Don Hoefler coined the term “Silicon Valley” in 1972. At the time,
    many of the companies in the valley were researching semiconductors, a component
    of electrical devices. Most semiconductors are created with silicon, a common
    element contained in sand and quartz. The name stuck. Today, hundreds of high-tech
    companies, such as Apple, Yahoo!,


    A view of Silicon Valley. The southern tip of San Francisco Bay is just out of
    sight around the knoll to the right.


