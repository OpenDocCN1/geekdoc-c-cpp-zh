    Google的投资者担心公司跟上不断变化的互联网的能力。“这是他们盔甲上一个日益巨大的漏洞，”一位前Google员工说，“他们很清楚这一点。问题是，他们能为此做什么？”佩奇（Page）和布林（Brin）继续寻找创建自己的社交媒体方案的方法，例如
    Google Sites，这是一个专门将具有共同兴趣的用户聚集在一起的网站。


    现在，Google在全球设有70处办公室——从德克萨斯到土耳其——拥有超过2.3万员工，年收入达200亿美元。Google的服务像网一样遍布全球。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_91_0.png)


    位于瑞士苏黎的Google 工程中心


    “Google”这个词甚至出现在了字典中。英国《卫卫报》将佩奇和布林评为媒体界影响力最大的两个个人。其他人称他们为“高科技王子”和“所有信息之主”。佩奇和布林在车库里创立的业务现在已成为仅次于微软的世界第二大科技公司。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_93_0.png)


    Larry Page于2007年9月在洛杉矶的WIRED Nextfest上演讲，展示了 Google 月球 X 大奖。


    # 7


    ## 登球及远方


    2011年4月，佩奇接替里克·施密特（Eric Schmidt）担任公司CEO。施密特将继续担任董事会主席，并准备担任Google的执行主席，他对这一变化发推道：“不再需要日常成年人监督了！”在Google官方博客中，他补充道：“在我显然看来，Larry已经准备好领导了。”


    佩奇和布林都希望继续发明，并看看他们还能改变世界什么程度。他们的基地仍然是 Googleplex（Google总部）——科学家、工程师、统计学家、产品营销人员和前CEO的所在地。员工们在铺着卵石的小径上主建筑间穿行，并使用一条横跨过小溪的两座建筑之间的滑索。像雅克·库斯特（Jacques
    Cousteau）这样的探险家的巨型石像点缀在路径旁。在晴朗的日子里，Google员工在户外桌旁享受健康的免费午餐。他们漫步于蔬菜花园，或者停留在Hiveplex，那里有四个涂成Google颜色的蜂巢区域，公司在那里在那里收获自己的蜂蜜。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_94_0.png)


    一个名为“斯坦坦（Stan）”的霸王龙青铜复制品守护着主大楼。尽管Googleplex看起来像一个游乐场，但Google员工致力于他们的工作。“雄心心是我们文化中非常重要的一部分，”布林说，“在Google可以从事的科学深度在世界上其他地方是无比拟的。”


    Google的创新继续改变世界，其演变已远超简单的、更好的搜索。2011年初，在遭受遭遇了毁灭性的地震和海啸后，人们转向Google新的PeopleFinder服务，以寻找失踪的家人和朋友。用户现在还可以探索诸如Google
    Earth、Google Maps、Google Finance、Google Calendar、Google Desktop、Gmail、Google Documents以及Google新的极速浏览器Chrome。该公司每天处理超过10亿次涉及Google搜索引擎的在线查询。他们的索引包含估计252亿个网页。Android手机占据了26%的市场份额，Google正在开发自己的应用库（或小程序），涵盖了从翻译器、手电筒到娱乐的各种内容。


    佩奇和布林的创新方法在隐私问题上以及对他人知识产权的使用上（包括通过Google新闻和通过书籍数字化）仍然面临批评。“我们确实会遇到很多领域，在那里，我们的创新撞击了并非为我们现在所处的世界而设计的法律，”Google律师大卫·德鲁蒙（David
    Drummond）说，“有时其他人并不认同我们改变的承诺。”然而，Google继续着数百万书籍数字化的过程，希望打破图书馆的物理限制。


    佩奇和布林曾希望打破中国的审查墙。然而，当他们得知中国领导人下试图入侵Google的网络时，他们威胁说除非政府允许他们运行搜索引擎，否则离开中国。当官员拒绝后，Google退出了中国，将搜索流量重定向到香港。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_96_0.png)


    Google位于北京清华科技园的中国总部


    最近，佩奇和布林也将注意力转向另一个关键问题——能源消耗。Google消耗大量的能量来维持分布从亚特兰大到苏黎世的“服务器场”。尽管Google使用的计算机数量保密，但专家估计数量超过100万台。佩奇和布林开始使用清洁的可再生能源。他们在建筑屋顶安装了太阳能电池板，并向风能投资了3900万美元。当总部附近的干草变成火灾隐时，他们租赁了羊以低碳的方式修剪草坪。


    佩奇和布林还在公司停车场安装了太阳能充电站，为他们的车队充电。佩奇和布林都驾驶特斯拉生产的电动汽车。这家以科学家特斯拉命名的公司制造世界上最快、最高效的汽车。一辆特斯拉跑车的时速可达每小时130英里，充电一次可行驶250英里。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_97_0.png)


    2009年的特斯拉


    佩奇和布林还将月球视为通往宇宙其他部分的踏脚石。通过探索月球，科学家可以研究如何在地球上使用清洁太阳能。佩奇和布林宣布了他们的Google 月球 X 大奖计划。该计划提供了3000万美元奖金，挑战全球工程师和企业家团队设计出最好的机器人月球车。Google的创始人希望该奖赛激发的技术进步有一天改善地球的生活。布林还投资了Space
    Adventures，这是一家提供私人太空旅行机会的公司。布林的投资资助了该计划，并为预留了未来绕月任务的席位。


    佩奇和布林还开始利用Google的资源在医学和健康领域开辟突破。遗传学研究特别令布林感兴趣，他发现自己患帕金森病的风险为50%。他开始花费数百万美元研究这种疾病，他的母亲尤金尼亚（Eugenia）就患有此病。帕金森病是一种无法治愈的逐渐恶化的脑疾病。帕金森病患者在移动时会出现震颤、动作缓慢和僵硬以及平衡功能障碍。这种疾病是由负责制造的脑细胞死亡引起的。'
