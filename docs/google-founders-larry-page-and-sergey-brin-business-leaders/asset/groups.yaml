    any control of Google in exchange for it. The duo had difficulty persuading serious
    investors to fund a company that only offered search services.


    After several rejections, Page and Brin met with venture capitalists John Doerr
    and Michael Moritz. Unlike other investors, Doerr and Moritz were intrigued. They
    liked Page and Brin as a team and realized a company like Google had the potential
    to grow and change as the Internet evolved.


    Both Doerr and Moritz decided to take a chance on Google. However, they refused
    to invest jointly, not wanting to cede any control to the other. Although Page
    and Brin needed quickly to keep Google in business, they boldly told Doerr and
    Moritz they would walk away if the two investors couldn''t reach a compromise.
    Within days, the four of them ironed out the details of the deal. Both financiers
    agreed to invest $12.5 million each in Google, with the requirement that Page
    and Brin hire an expert executive to help transform Google into a profitable business.


    Soon after the investment deal, Page and Brin took a much needed vacation and
    attended the Burning Man Festival in Nevada’s Black Rock Desert. During the long
    festival, people flock to a constructed town of tents and campsites in the middle
    of the desert. With no food or water available, participants bring all their supplies.
    The free artistic and social gathering is symbolized by a tall wooden figure of
    a man, that is burned at the end of the week. Before Page and Brin left, Google
    employee Dennis Hwang created a doodle on Google’s homepage logo. The drawing
    of a stick in the second letter-o told Google users Page and Brin would be at
    the Burning Man Festival. The famous Google Doodle was born.


    Not long after, Brin created a Halloween logo on Google’s homepage with two pumpkins
    on the letter o’s. Google users loved the designs. Page and Brin began to feature
    a few artistic doodles each month, celebrating holidays and events such as New
    Year’s Day and the Olympics. Soon the list expanded. Google Doodles have commemorated
    the birthdays of artists, entertainers, and scientists, and paid tributes to important
    events like the Wright Brothers’ first flight and Martin Luther King Jr. Day.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_47_0.png)


    With the money to expand the company, Page and Brin decided Google needed additional
    computers and memory.


    They ordered computers in eighty packs from online companies. They also visited
    Fry’s, a chain of large electronics stores. Page and Brin stocked up, returned
    to their office, and began to rip the computers apart, removing any parts that
    ate up power. They rebuilt the machines, creating streamlined computers together
    with custom software and wiring. The computers, dubbed Googleware, were “garden-variety
    PCs on steroids,” said one author. For every one dollar Page and Brin spent, they
    averaged three more computer power and memory than their competitors.


    However, Google’s computers burned out within one or two years, due to the use
    they received. Several machines died each day. Page and Brin used enough computers
    that if one cluster went down, other computers, that shared copies of the Internet
    and data, automatically took over.


    Page and Brin spread data and tasks over a vast number of computers in multiple
    locations so the entire system could handle problems without crashing. They ran
    three off-site data centers—two in California and one in Washington, D.C.—and
    soon added more across the country, all monitored by a single location. The computers
    were housed in chilled warehouses to prevent the equipment from overheating. The
    warehouse companies charged by the foot of space used, so Page and Brin crammed
    as many machines as possible on top of each other on refrigerator-sized racks.
    A fire at one of their data centers put Google’s computer system to the test.
    Although it took six fire trucks to control the blaze, most Google users never
    knew there was a problem.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_49_0.png)


    *Google’s first production server. Pulled back “hair” (cords) reveals a rack of
    cheap networked PCs.*


    One day Page and Brin would have hundreds of thousands of custom-built machines.
    “They run the largest computer system in the world,” said Stanford president John
    Hennessy. “I don’t think Brin is even anything close.”


    Page and Brin, now nicknamed the Google Guys, found they had outgrown their offices
    again. They decided to lease the second floor of a building in the town of Mountain
    View, a ten-minute bike ride from Stanford. Soon they expanded to the first floor.
    Next, they leased the building next door. People called it the Googleplex.


    The culture inside the Googleplex reflected Page’s and Brin’s personalities, with
    gadgets, foobsall tables, lava lamps, espresso machines, and large exercise balls
    and beanbags on chairs. Because employees worked long hours each day, Page and
    Brin tried to make their working atmosphere pleasant and convenient. They started
    an on-site laundry service and chartered buses with Internet, so their employees
    could work during their commutes from nearby San Francisco.


    In November of 1999, Page and Brin decided to hire a chef for a company cafeteria.
    They held a cook-off, won by Charlie Ayers, a former chef for the Greatful Deaf.
    Soon Google employees, or Googlers, dined on foods like sushi, sweet potato jalapeno
    soup, and chocolate fondue. Page and Brin instituted Seafood Fridays with a smorgasbord
    of seafood—from oysters to lobster.


