    ![](img/4289fd47e3baffa20ad5d74d4233a641_83_0.png)


    Page and Brin wanted Google.org to focus on technology-driven philanthropy to
    do good across the planet—from preventing disease to developing more efficient,
    cheaper electric cars. The organization offered scholarships to students interested
    in technological fields and provided funding for innovative projects.


    Larry Brilliant


    Google.org funded researchers who were attempting to better predict and prevent
    natural disasters. They also organized studies that examined factors impacting
    the spread of disease, such as climate change, international travel, and contact
    with animals. “What if we could have been there when the HIV [human immunodeficiency
    virus] moved from animal to chimp to human and [we] could have averted that risk?”
    said Brilliant. “To prevent or abort or slow a pandemic saves tens of millions
    of lives.” In its first three years, Google.org spent up to $175 million.


    One day, Page and Brin would institute the Project 10 to the 100th prize. They
    offered $10 million in prize money, to be divided among five organizations with
    the best world-changing ideas. Google received more than 150,000 suggestions and
    asked the public to vote for the top five ideas. It took 3,000 Googlers to review
    the ideas and one year to award the prize money. One of the winners was the group
    FIRST, an organization that works to get children and teenagers excited about
    science and technology though competitions like robot and Lego building.


    Soon Page and Brin started another project. Hoping to combat the sea of incorrect
    information on the Internet, they wanted to make millions of books available online.
    “There is fantastic information in books,” said Brin. “Often when I do a search,
    what is in a book is miles ahead of what I find on a Web site.” Page and Brin
    dreamed of computer users—from kindergartners to college professors—being able
    to access full textbooks. Page and Brin hoped the project would provide people
    in developing countries with access to literature and information. “Google’s mission
    is to organize the world’s information and make it universally accessible and
    useful,” Brin said. “The tremendous wealth of knowledge that lies within the books
    of the world will now be at your fingertips.”


    However, there were many hurdles to the project. Page and Brin needed to develop
    the technology to digitize books efficiently and accurately on a giant scale and
    to find libraries interested in the project. They also needed to address potential
    copyright issues.


    Page traveled to the University of Michigan, where he offered that Google would
    foot the bill for scanning every book, nearly 7 million volumes, in the university’s
    library.


    Soon Stanford, Harvard, and Oxford also expressed interest in the digital book
    project. Google would be digitizing miles and miles of books and adding the information
    to its index. The database could potentially contain many millions of books.


    Page and Brin looked into developing new scanning devices that would treat books
    gently. Flatbed scanner technology allowed people to scan one item at a time.
    A few years earlier, Page and Marissa Mayer, an early employee, had experimented
    with scanning books. The two turned the pages of a hundred-page book one page
    at a time, ticking off the rhythm with a metronome. It took forty minutes. Now,
    Page and Br tested robotic devices, using mechanical arms and suction to turn
    the pages. They decided to use an army of trained personnel and digital cameras
    that could snap images in a fraction of a second. But it wasn''t technology that
    presented the biggest stumbling block to the project. It was copyright laws.


    Copyright laws protect books, music, movies, video games, art work, computer programs,
    and other published works—whether online or in print. Laws protect the material
    from being copied and spread without the consent of the author, publisher, or
    third party. In 1709, Queen Anne of England decreed the Statute of Anne, one of
    the first copyright laws. It granted the exclusive right of publication to authors
    for twenty-one years. Today, copyright laws vary depending on when the work was
    produced. Page and Brin promised to respect copyright laws and to reimburse the
    libraries for any lawsuits digitizing the books.


    Soon Page and Brin unveiled Google Print. It covered the costs of digitizing the
    books in return for the right to display a snippet of text matching a query. Users
    would be unable to copy or print the information, but Google would provide links
    to Web sites selling the books. Page and Brin met with large publishing companies
    about supplying books to the project. Publishers could run ads on the pages with
    the displayed text. Like any other advertiser, they would pay based on the number
    of clicks the ads generated, and Google would share the ad revenue.


    The Author’s Guild and the Association of American Publishers sued Google over
    the project, arguing it was illegal to show portions of material still under copyright.
    Google countered it was no different than a card catalog in a library which offered
    a brief summary of the book. Google and the publishers eventually reached a compromise.
    Google would pay $125 million in exchange for the right to provide full text versions
    of out-of-print books.


    Later in 2006, Page and Brin acquired other types of.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_86_0.png)

    Sergey Brin, left, and Larry Page at the Book Fair in Frankfurt, Germany, in October
    2004


    Google paid 1.6 billion to buy YouTube, a site on which people post. ![](img/4289fd47e3baffa20ad5d74d4233a641_87_0.png)

    Sergey Brin, left, and Larry Page at the Book Fair in Frankfurt, Germany, in October
    2004


    Google acquired video.


    The year 2007 was eventful for Page and Brin in other ways. In May, Brin married
    Anne Wojcicki. The two met through Wojcicki’s sister, Susan, who had rented her
    garage to Page and Brin in 1998. Both adventurous and outgoing, Brin and Wojcicki
    liked yoga, scuba diving, and kite surfing. She had attended Yale University and
    graduated with a degree in biology.


    Brin and Wojcicki were married in the Bahamas on Musha Cay, an exclusive, private
    island ringed by sugar-white sand beaches and clear turquoise-blue waters. Wedding
    guests were flown in by private jet and ferried to a sandbar. Brin wore a tuxedo
    and Wojcicki wore a wedding dress. The two swam out to a sandbar where friends
    married them.


    In December 2007, Page also wed. He married Lucy Southworth, a former model who
    was earning a PhD from Stanford. She had earned her master’s degree in science
    from Oxford University and done medical social work in South Africa. The two had
