    # XPRIZE FOUNDATION


    ![](img/4289fd47e3baffa20ad5d74d4233a641_99_0.png)


    ![](img/4289fd47e3baffa20ad5d74d4233a641_100_0.png)


    Dr. Buzz Aldrin, right, an Apollo astronaut, responds to a question during a presentation
