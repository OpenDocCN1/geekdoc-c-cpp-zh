    they asked for a spare. They “snarfed a bunch of machines of all different types,”
    said Brin. They also bought parts and built their own machines, assembling and
    stringing inexpensive personal computers, or PCs. Page and Brin spent $15,000
    of their own money, using three credit cards, to buy hard drives that could store
    a terabyte of data. They crammed the computers into Gates 360—their data center.


