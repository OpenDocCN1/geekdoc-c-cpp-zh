    # 第 1 章


    # 爱上电脑的男孩们


    谢尔盖·布林出生在苏联那单调的混凝土景观中，而拉里·佩奇则在密歇根州一所大学镇上绿树成荫的街道上长大。很难想象 Google 创始人的起点会有如此截然不同。然而，这两个男孩都热于摆弄电脑并解决复杂的数学问题，而且他们的父母都是知识分子，一直鼓励他们的兴趣。尽管存在文化差异，但正是相似的学术背景让他们聚在一起，创立了一家革命性的互联网公司。这家公司如今让世界各地的人触手可及几乎无尽的信息。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_12_0.png)


    Google 是搜索引擎，每天回答超过 10 亿次在线查询，支持 117 种语言——从拉丁语到猪拉丁语（Pig Latin）。从学生到教师，从演员到 CIA
    特工，从运动员到厨师，所有人都会向 Google 寻求问题的答案。漫画家加里·特鲁道将 Google 誉为“信息检索的瑞士军刀”。


    随着全球各地数据中心有数百万台电脑日夜不停运行，佩奇和布林控制着世界上最大的计算机系统之一。通过突破性技术，他们通过提供免费、即时的服务改变了数百万人的生活。如今，佩奇和布林控制着世界上最大的计算机系统之一。通过突破性技术，他们通过提供免费、即时的服务改变了数百万人的生活。如今，佩奇和布林控制着世界上最大的计算机系统之一。通过突破性技术，他们通过提供免费、即时的服务改变了数百万人的生活。如今，佩奇和布林控制着世界上最大的计算机系统之一。通过突破性技术，他们通过提供免费、即时的服务改变了数百万人的生活。如今，佩奇和布林控制着世界上最大的计算机系统之一。通过突破性技术，他们通过提供免费、即时的服务改变了数百万人的生活。如今，佩奇和布林控制着世界上最大的计算机系统之一。通过突破性技术，他们通过提供免费、即时的服务改变了数百万人的生活。如今，佩奇和布林控制着世界上最大的计算机系统之一。通过突破性技术，他们通过提供免费、即时的服务改变了数百万人的生活。如今，佩奇和布林控制着世界上最大的计算机系统之一。通过突破性技术，他们通过提供免费、即时的服务改变了数百万人的生活。如今，佩奇和布林控制着世界上最大的计算机系统之一。通过突破性技术，他们通过提供免费、即时的服务改变了数百万人的生活。如今，佩奇和布林控制着世界上最大的计算机系统之一。通过突破性技术，他们通过提供免费、即时的服务改变了数百万人的生活。如今，佩奇和布林控制着世界上最大的计算机系统之一。通过突破性技术，他们通过提供免费、即时的服务改变了数百万人的生活。如今，佩奇和布林控制着世界上最大的计算机系统之一。通过突破性技术，他们通过提供免费、即时的服务改变了数百万人的生活。


