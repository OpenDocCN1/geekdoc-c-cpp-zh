    ![](img/4289fd47e3baffa20ad5d74d4233a641_83_0.png)


    佩奇（Page）和布林（Brin）希望 Google.org 专注于技术驱动的慈善，在全球范围内贡献——从预防疾病到开发更高效、更廉价的电动汽车。该机构对科技领域的学生提供奖学金，并为创新项目提供资金。


    拉里·布里利恩（Larry Brilliant）


    Google.org 资助了那些试图更好地预测和预防自然灾害的研究人员。他们还组织了研究，调查影响疾病传播的因素，例如气候变化、国际旅行以及与动物的接触。“如果在艾滋病毒（人类免疫缺陷病毒）从动物转移到黑猩再转移到人类时，我们能够在现场并规避那种风险该怎样？”布里利恩说，“预防、终止或减缓流行病可以拯救数千万人的生命。”在成立的前三年里，Google.org
    支出了高达 1.75 亿美元。


    有一天，佩奇和布林设立了“10 到 100 项目”奖金。他们提供了 1000 万美元奖金，分配给五个拥有最佳改变世界想法的组织。Google 收收了超过 15
    万条建议，并请公众对前五个想法进行投票。3000 名 Google 员工（Googlers）审阅了这些想法，并花费了一年时间发放了奖金。获奖者之一是 FIRST
    组，这是一个通过机器人和乐高搭建等比赛激发儿童和青少年对科学技术兴趣的组织。


    很快，佩奇和布林开始了另一个项目。为了对抗互联网上海量的错误信息，他们希望让数百万书籍实现在线化。“书里有极好的信息，”布林说，“通常当我进行搜索时，书中的内容往往比我在网站上找到的内容领先出许多里。”佩奇和布林梦想计算机用户——从幼儿园儿童到大学教授——能够获取完整的教材。佩奇和布林希望该项目能让发展中国家的人获得文学和信息的机会。“Google
    的使命是整合世界上的信息，使其在全球范围内可用并受益于用，”布林说，“世界书籍中蕴含的巨大知识财富现在将触手可及。”


    然而，该项目面临着许多重重障碍。佩奇和布林需要开发相关技术，在大规模范围内高效准确地将书籍数字化，并找到对该项目感兴趣的图书馆。他们还需要解决潜在的版权问题。


    佩奇访问了密歇根大学，在那里他承诺 Google 将承担扫描大学图书馆内每本书（近 700 万册）的费用。


    很快，斯坦福大学、哈佛大学和牛津大学对数字书籍项目表示兴趣。Google 将数字化数英里的书籍，并将这些信息加入其索引中。该数据库可能包含数百万册书籍。


    佩奇和布林研究开发能够轻柔处理书籍的新型扫描设备。平板扫描仪技术允许人们一次扫描一个物品。几年前，佩奇和早期员工玛丽莎·梅耶（Marissa Mayer）曾尝试过扫描书籍。两人按照节拍器的节奏，一页一页地翻动一本百页书的纸页并进行计数。这花费了
    40 分钟。现在，佩奇和布林测试了使用机械臂和吸盘来翻页的机器人设备。他们决定使用一群经过训练的人员和可以在几分之一内捕捉图像的数码相机。但面临项目最大障碍并不是技术，而是版权法。


    版权法保护书籍、音乐、电影、视频游戏、艺术作品和其他出版物——无论是在线还是纸质。法律保护材料不被未经作者、出版者或第三方同意的情况下被复制和传播。1709
    年，英国的安妮女王颁布了《安妮法案》，这是最早的版权法之一。它授予了作者二十一一年的独家出版权。如今，版权法根据作品产生的时间而异。佩奇和布林承诺尊重版权法，并为图书馆因数字化书籍而产生的任何诉讼承担费用。


    很快，佩奇和布林发布了 Google Print（谷歌图书）。它涵盖了书籍数字化的费用，以换取显示查询匹配片段的权利。用户无法复制或打印这些信息，但 Google
    会提供销售这些书籍的网站链接。佩奇和布林与大型出版社会面，讨论为项目提供书籍。出版社可以在显示文本的页面投放广告。像任何其他广告主一样，他们将根据广告产生的点击次数付费，Google
    将分享广告收益。


    作者协会（The Author’s Guild）和美国出版协会（Association of American Publishers）就该项目起诉 Google，认为显示仍受版权保护的部分材料是违法的。Google
    反驳说，这与图书馆提供书籍简要摘要的分类索引无区别。Google 和出版社最终达成了妥协。Google 将支付 1.25 亿美元，以换取提供绝版书籍全文版本的权利。


    随后在 2006 年，佩奇和布林收购了其他类型的[content]


