    # 1


    # The Boys Who Loved Computers


    Sergey Brin was born in the drab, concrete landscape of Communist Russia while
    Larry Page grew up on the green tree-elined streets of a Michigan university town.
    It is difficult to imagine two more different beginnings for the founders of Google.
    However, both boys loved to tinker with computers and to puzzle out complex mathematical
    problems, and both had academic parents who encouraged their interests. Despite
    cultural differences, it was their similar intellectual backgrounds that brought
    them together to create a revolutionary Internet company. One that today places
    almost limitless information at the fingertips of people around the world.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_12_0.png)


    Google, a search engine, answers more than 1 billion online queries each day,
    and is available in 117 languages—from Latin to Pig Latin. From students to teachers,
    actors to CIA agents, athletes to chefs, all turn to Google to answer their questions.
    Cartoonist Gary Trudeau calls Google “the Swiss Army knife of information retrieval.”


    With millions of computers running day and night in data centers across the globe,
    Page and Brin control one of the world’s most massive computer systems. Through
    groundbreaking technology, they have changed the lives of millions of people by
    providing free, instant access to information, maps, images, and art.


    The invention of Google made Larry and Sergey billionaires. Despite their wealth,
    they continue to focus on the company they created. To them, Google has more to
    offer than just information. They plan to use Google as a stepping stone to greater
    achievements, bettering the world, and improving people’s lives.


    Before reaching the age of forty, Larry and Sergey accomplished more than most
    inventors do in a lifetime. Known as the “Google Guys,” they hope to develop other
    technological advancements in areas like medical research and climate change.
    “I think it [Google] was the smallest of accomplishments that we hope to make
    over the next twenty years,” said Brin.


    Lawrence (Larry) Edward Page was born on March 26, 1973 in East Lansing, Michigan.
    Larry’s parents, Carl and Gloria Page, had one other child at the time, nine-year-old
    Carl Victor Jr. The Pages lived in a middle-class neighborhood near Michigan State
    University, where both of Page’s parents were professors. Carl taught computer
    science and Gloria computer programming.


    Larry came from a family devoted to education, hard work, and equality. They proudly
    remembered Larry’s grandfather’s role in the 1937 Flint Sit-Down Strike, Michigan,
    when autoworkers took over a car manufacturing facility in Flint, Michigan, in
    protest of dangerous working conditions. Larry’s father, Carl Victor Page, had
    survived childhood polio to become the first person in his family to graduate
    from high school. In 1965, he earned his PhD in computer science from the University
    of Michigan. Carl was one of the few to hold a degree in the new field.


    Larry’s foundation in perseverance and dedication also came from his mother’s
    side of the family. Larry’s maternal grandfather was Jewish. After immigrating
    to Israel, he settled in the desert town of Arad near the Dead Sea and eked out
    a living as a diemaker, despite the scarcity of water and resources.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_14_0.png)


    Beaumont Tower at Michigan State University


    Like her husband, Gloria was fascinated by technology. She earned her master’s
    degree in computer science and worked as a database consultant. Larry’s parents
    used computers at home and at work. Inside their house, computer parts and Popular
    Science magazines surrounded Larry.


    Five months after Larry’s birth, Google’s co-founder, Sergey Mikhailovich Brin,
    was born on August 21, 1973, in Moscow, Russia. Sergey’s parents, Mikhail and
    Eugenia Brin, shared the same passion for technology and education as Page’s parents.
    Mikhail received his PhD in mathematics from Moscow State University. He worked
    as an economist for Gosplan, a government agency that oversaw economic planning
    for the Soviet Union. Eugenia, who also held a degree in mathematics, was employed
    as a civil engineer.


    ![](img/4289fd47e3baffa20ad5d74d4233a641_15_0.png)


    The main building at Moscow State University


    The love of numbers ran deep in Sergey’s family. He came from a long line of mathematicians
    and scientists. Sergey’s great grandfather had been a math professor in Moscow.
    His great grandmother had left Russia to study microbiology at the University
    of Chicago, returning to Moscow in 1921 to help create Russia’s Communist framework.


    For seventy years, the Communist party ruled the Russian government, industry,
    and way of life. Communism is an economic system in which the government controls
    all goods and services. It differs from capitalism, the economic doctrine of the
    United States, in which citizens can own property and businesses. These differences
    made the United States and Russia bitter enemies for many years.


    Although the Soviet Union seemed prosperous and technologically advanced, these
    appearances came at the cost of Russian citizens who suffered under the repressive
    regime. People were forbidden to travel without permission. They couldn’t talk
    freely about the government for fear of being arrested by the KGB, the secret
    police. Food and other goods were often scarce. A Soviet citizen waited four hundred
    hours a year in long lines outside stores to purchase items.


    Mikhail and Eugenia earned little money and shared a cramped apartment with Sergey’s
    grandmother. A concrete courtyard served as Sergey’s playground, where he played
    for two hours each day, regardless of the weather.


    The Brins’ religious beliefs worsened their situation. Like Larry’s family, they
    were Jewish. On the streets and at work, they faced harsh anti-Semitism and discrimination.
