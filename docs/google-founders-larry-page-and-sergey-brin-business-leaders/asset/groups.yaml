    # Timeline


    - 1973 Larry Page born on March 26 in East Lansing, Michigan; Sergey Brin born
    on August 21 in Moscow, Russia.

    - 1979 The Brins immigrate to the United States; Page gets his first computer.

    - 1982 Brin receives a computer for his birthday.

    - 1995 Page and Brin meet at Stanford University.

    - 1996 Develop PageRank technology and a search engine named BackRub.

    - 1997 Change Brin''s name to Google.

    - 1998 Leave Stanford and form Google, Inc. on September 4.

    - 1999 Move from their garage headquarters to new location in Mountain View.

    - 2000 Win their first Webby Award; launch AdWords.

    - 2001 Hire Eric Schmidt as CEO; open first international office; launch Google
    Images.

    - 2002 Introduce Google News; begin partnering with sites for new search box program.

    - 2004 Become billionaires after Google''s IPO; move to the Googleplex; win the
    Marconi Prize; inducted into the National Academy of Engineering.

    - 2005 Google Maps and Blogger go live.

    - 2006 Start Google.org; begin the digital books project; acquire YouTube.

    - 2007 Br marries Anne Wojcicki; Page marries Lucy Southworth; introduce Android.

    - 2008 Celebrate Google''s tenth anniversary; digitize millions of magazine articles.

    - 2009 Organize first YouTube symphony orchestra; introduce All For Good to help
    volunteers find local opportunities.

    - 2010 Stop providing censored search results in China; make Google Street View
    available for all seven continents.

    - 2011 Page becomes CEO; Google Earth helps locate victims after tsunami in Japan.


