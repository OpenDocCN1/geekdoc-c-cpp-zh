    “We were confused about how to spell this, and so we actually spelled it incorrectly,”
    said Page. “It is a mathematical term and it is spelled g-o-o-g-o-l. So that is
    the right way Google is spelled.” Brin and Page liked their misspelling though
    and registered Google as their domain name or Web address.


    In August 1996, Page and Brin released the first version of Google on Stanford’s
    Web site, making it available for students and faculty. Soon Google had hundreds
    of satisfied users. Its popularity spread by word of mouth. Google was at maximum
    capacity, handling 10,000 searches a day from Stanford. The system required an
    enormous amount of memory. Instead of using one megacomputer to store data, Page
    and Brin linked smaller computers to their network. Still, it wasn’t. “We sat
    around the room and looked at the machines and said, ‘This is about how many searches
    we can do, and we need more computers.’ Our whole history has been like that,”
    said Page. “We always need more computers.”


    Short on cash, Page and Brin scroung for computers at the university’s receiving
