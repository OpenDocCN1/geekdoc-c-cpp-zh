    布林（Brin）启动了一项计划，通过其妻子的基因研究公司 23andMe 为帕金森患者提供 DNA 分析机会。这些信息可用于研究遗传和环境因素，以推进治疗。布林说：“就个人而言，我们的基因和经历在统计噪声的海洋中消失了；但合在一起，它们就成了观察我们内部机制的高倍镜镜。”


    Google 继续主导互联网和移动手机世界。用户可以在他们的 Google Android 手机上设置闹钟醒来，在 Google 新闻上阅读世界事件，检查
    Gmail 的新邮件，使用 Google Maps 前往商店，访问 Google Groups 或 Blogger 查看朋友在做什么，通过 Google 日历保持条理清晰，并在
    YouTube 上观看有趣的视频。


    有些人将 Google 的创立与 15 世纪 40 年代约翰内·古登堡（Johannes Gutenberg）发明的印刷机相提。古登堡是第一个创造出用于印刷机的活字金属字的人。他的字母字可以组合和拆卸，以打印不同的单词。古登堡的发明开启了现代印刷术时代，使书籍更加廉价并供大众使用。就像古登堡的发明一样，Google
    提供了更广泛的信息获取途径。


    尽管这些“谷歌男士”面临着批评，但他们继续突破边界，开发创新技术来改善世界。在获得名声和财富后，他们处于一家公司的顶部，这家公司已获得至少二十项 Webby
    奖以及来自报纸、杂志、大学和其他机构的一百多项奖励。


    作者珍特·洛（Janet Lowe）说：“他们从小就为在计算机领域的伟大做好了准备；他们前往圣地（斯坦福大学和硅谷）证明自己的战斗能力。他们杀掉了一整个龙穴，并带着胜利之旗从探险中归来。他们的故事是一个经典的英雄之旅。”


    1998 年，拉里·佩奇和谢尔盖·布林在离开斯坦福时，遗憾地收拾好了行李。从大学附近那个狭小、破旧的车库里，两人很难预料到他们的公司会成为一种国际现象。


    佩奇说：“有两种类型的疯狂孩子因为互联网的力量、分发的力量以及软件和计算机的力量对世界产生了巨大影响。世界上有很多这样的事情。有很多机会可以让你利用科学科技的杠杆对世界产生巨大影响。”


    ![](img/4289fd47e3baffa20ad5d74d4233a641_103_0.png)


    # 时间线


    - 1973年拉里·佩奇于3月26日出生于密歇根州东兰斯辛；谢尔盖·布林于8月21日出生于俄罗斯莫斯科。

    - 1979年布林夫妇移民美国；佩奇得到了他的第一台电脑。

    - 1982年布林生日时收到了一台电脑。

    - 1995年佩奇和布林在斯坦福大学相遇。

    - 1996年开发了 PageRank 技术和名为 BackRub 的搜索引擎。

    - 1997年将布林的名字改为 Google。

    - 1998年离开斯坦福，并于9月4日成立 Google, Inc.。

    - 1999年从他们的车库总部搬到山景城（Mountain View）的新地点。

    - 2000年获得他们的第一个 Webby 奖；推出 AdWords。

    - 2001年聘请埃里克·施密特（Eric Schmidt）担任 CEO；开设首个国际办公室；推出 Google 图片。

    - 2002年推出 Google 新闻；开始与网站合作开展新的搜索框计划。

    - 2004年在 Google IPO 后成为亿万富；搬到 Google 园区（Googleplex）；获得马可尼奖；入选国家工程学院。

    - 2005年Google Maps 和 Blogger 上线。

    - 2006年成立 Google.org；启动数字书籍项目；收购 YouTube。

    - 2007年布林结婚安妮·沃西斯基（Anne Wojcicki）；佩奇结婚露西·南斯沃思（Lucy Southworth）；推出 Android。

    - 2008年庆祝 Google 十周年；将数百万杂志文章数字化。

    - 2009年组织了首个 YouTube 交响乐团；推出“全人类共享”（All For Good）帮助志愿者寻找当地机会。

    - 2010年停止在中国提供经过审查的搜索结果；Google 地图覆盖所有七大洲。

    - 2011年佩奇成为 CEO；Google 地球帮助在日本海啸后定位受害者。


