    and releasing a chemical in the brain called dopamine. What starts the process
    is unknown. Medications can help relieve the symptoms, but no known cure exists.


    Brin has started a program that offers Parkinson''s patients the opportunity to
    have their DNA analyzed through his wife''s genetic research company 23andMe.
    The information can be used to investigate genetic and environmental factors in
    the hopes of advancing treatment. “Individually, our genes and experiences are
    lost in a sea of statistical noise,” Brin said. “But, taken together they become
    a high power lens on our inner workings.”


    Google continues to dominate the Internet and mobile phone world. Users can wake
    up with an alarm set on their Google Android phone, read about world events on
    Google News, check Gmail for new e-mails, use Google Maps to get to a store, visit
    Google Groups or Blogger to see what friends are doing, stay organized on their
    Google Calendars, and watch entertaining videos on YouTube.


    Some people compare the creation of Google to the invention of the printing press
    in the 1440s by Johannes Gutenberg. Gutenberg was the first to create movable
    metal type pieces to use in a printing press. His lettered pieces could be assembled
    and disassembled to print different words. Gutenberg’s invention launched the
    modern printing press, making books more affordable and available to the masses.
    Like Gutenberg’s invention, Google provides greater access to information.


    Despite the criticism the Google Guys have faced, they continue pushing the edge
    of the envelope and developing innovative technologies to improve the world. Having
    earned fame and fortune, they stand at the head of a company that has won at least
    twenty-two Webby Awards and more than one hundred awards from newspapers, magazines,
    universities, and other institutions.


    “They were groomed for greatness in the computer field from infancy; they traveled
    to a holy land (Stanford University and Silicon Valley) to prove their mettle
    in battle,” said author Janet Lowe. “They slew a whole den of dragons and emerged
    from the quest with flags of victory flying. Their story is a classic hero’s journey.”


    In 1998, Larry Page and Sergey Brin had sadly packed up their things when they
    left Stanford. From that small, dilapidated garage near the university, the two
    could hardly foreseen their company becoming an international phenomenon.


    “Two kind of crazy kids have had a big impact on the world because of the power
    of the Internet, the power of the distribution, and the power of software and
    computers,” Page said. “And there are so many things like that out there. There
    are so many opportunities where you can have a huge impact on the world by using
    the leverage of science and technology.”


