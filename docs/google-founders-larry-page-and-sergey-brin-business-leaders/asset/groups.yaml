    As Brin researched data mining, Page studied the search engine AltaVista. A search
    engine is a software program designed to locate items on the Internet. Page noticed
    the search results included links that highlighted words from the query. The creator
    of a Web site often provides links to other sites that offer valuable, related
    information. Computer users wanting to learn more click on a link that yielded
    them to a different Web page. To Page, the essence of the Web was the links joining
    pages to each other. When Page visited a site, he could see the backlinks, or
    sites linking it to others. He realized that the number of backlinks offered a
    way to rank sites.


    Page wanted a big database in order to do more research on backlinks. He decided
    to download the entire World Wide Web onto his computer. Others scoffed at the
    idea. But Brin, with his interest in data mining, the idea made sense.


    Page and Brin teamed up to download the Web and analyze links. They created a
    computer program called a crawler or spider. A spider crawls the Web, retrieving
    Web pages and documents. It visits Web sites, summarizes their content, and feeds
