    布林早期忠诚的员工可以将他们的股票（即公司的股份）变现；佩奇和布林也成为了亿万富翁。


    当一家私有公司变为上市公司时，其股票会在首次公开募股（IPO）期间向公众投资者出售。公司上市有许多原因。IPO 可以募集资金来扩大业务、偿还债务并让所有者变得富有。想象一家正在亏损的面包店。由于很多人对坚果过敏，他们已经停止了在那里的购物，而该面包店制作的所有饼干和蛋糕都含有坚果，或者是在处理过坚果的设备上制作的。面包店的所有者可能会举行
    IPO，募集资金购买设备和原料来制作无坚果产品。


    通常，公司的创始人会向早期员工和为公司提供资金的私人发行发行，作为对他们帮助奠业务基础的奖励。然而，这些股份在最初价值很低，因为股票尚未进行公开交易。IPO
    之后，股份价值可能会增加，有时甚至是巨额增长。拥有许多早期股份的人可以通过出售股票变得非常富有。有时企业主想让公司运转起来，使其盈利，然后卖掉股份并离开。有些人不想继续经营业务，另一些人只是喜欢创立新公司。


    IPO 也有缺点。公司可能会在注册 IPO 相关的费用上花费数千美元。他们通常会聘佣专家来帮助他们应对证券交易委员会（SEC）的文书和复杂规则，SEC 是监管美国股票市场以防止欺诈的联邦机构。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_74_0.png)

    华尔街的纽约证券交易所


    当一家私有公司变为上市公司后，主要所有者不能再做出独立决策。股东（即购买股票的投资者）现在拥有公司的一部分股份，尽管他们并不参与日常运营。SEC 的规定要求召开股东会议，并对某些决策进行批准。投资者希望他们的股票价值增加。如果价值下跌，他们可能会出售股票，这可能会影响公司的整体价值并导致其破闭。


    IPO 过程耗费数月的规划。参与人员包括会计师、顾问和被称为承销商的投资银行家，他们帮助设定股票的初始发行价格。承销商编写招股说明书，这是一份向潜在投资者详细描述公司的文件。在
    IPO 当天，通常 80% 的股票出售给大公司、投资银行和高知名投资者。股票价格根据对公司和股市的信心而波动。


    Google 的 IPO 引起了媒体的轰动。该公司在过去几年的财务增长令人们震惊。Google 的利润现在已达到 1 亿亿美元。正如佩奇和布林以不同的方式经营他们的公司一样，他们希望他们的
    IPO 也是与众不同的。他们将招股说明书命名为《创始人致信：Google 股东手册》。佩奇和布林向投资者写道：“Google 不是一家传统的公司。我们并不打算变成那样。”根据招股说明书，佩奇、布林和施密特将继续做出所有决策，而不是股东。与其将其
    80% 的股票分配出售给大型银行机构，佩奇和布林举行了一场拍卖，任何想要获得 Google 股票的人都可以竞价。这为所有投资者（无论大小）提供了投资 Google
    的相同机会。竞价决定了每个人获得股份的初始价格。Google 的股票于 2004 年 8 月 19 日以每股 85 美元首次发行。第一天结束时，股价已上涨到每股
    100 美元。几个月内，股价翻了一番，一年内就达到了每股超过 300 美元。


    Google 的 IPO 是史上规模最大、最成功的科技 IPO，为公司募集了近 30 亿美元。这次 IPO 让 1000 多名拥有期权的 Google 员工瞬间成为百万富翁。佩奇和布林成为了世界上最年轻的自创亿万富翁，每个人估计价值在
    70 亿到 100 亿美元之间。《时尚闲》杂志将他们评为信息时代最有权的领导者。尽管如此他们并没有退休计划。佩奇说：“如果我们受金钱驱动，我们早就就把公司卖了，现在躺在海滩上了。”


    然而，在佩奇和布林利润丰厚的 IPO 之后，保险公司 Geico 起诉了 Google。Geico 反对 Google 向保险公司的竞争对手出售广告获利的方式，即使用了与
    Geico 注册商标名称相关的关键词。其他保险公司可以对 *Geico* 或 *Geico Direct* 等词进行竞价。Geico 声称他们正在失去业务，因为当用户输入搜索词
    *Geico* 时，竞争对手的广告可能会出现。虽然竞争公司可以对注册商标进行竞价，但 Google 的政策禁止他们在广告标题中使用这些名称。当法官裁定 Geico
    没有提供足够的证据证明其主张时，佩奇和布林赢得了这场纠纷。


    在这张 2004 年的照片中，在互联网搜索巨头股份开始交易后，一名摄影师将镜头对准了纽约 Nasdaq 大厦的公告板。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_78_0.png)


    2004 年以佩奇和布林的几次个人胜利告终。他们都荣得了马可尼奖，该奖每年授予继续完成古列埃莫·马可尼工作的人（马可尼是无线技术成就的先驱）。协会表彰了他们在信息技术对人类进步做出的贡献。


    佩奇还被选入美国工程科学院。他因帮助开发技术和工程领域的创新进展而获得这一殊荣荣誉。不久之后，布林也成为了该学院的成员。


    2004 年 12 月底，在海啸引发了高 50 英尺、以喷气式飞机速度移动的海后，佩奇和布林的公司履行了一项重要的公共服务。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_79_0.png)

    在 2004 年 12 月袭击该地区并摧毁了东南亚的海啸后，印度尼西亚班达亚市中心街道的垃圾和废墟中立着一座部分被毁的孤独房屋。在短短一天内，就有超过 15
    万人死亡，11 个国家的超过 100 万人无家可归。佩奇和布林利用 Google 首页传达重要信息，并提供国际救援行动的链接。


    Google 在全球拥有用户和狂热粉丝。甚至有一夫妇给他们的孩子起中间名叫 Google。不久，佩奇和布林扩展了 Google 的服务。2005 年底，该公司与中国政府达成协议，为超过
    10 亿中国公民提供服务。然而，Google 同意仅提供受限制政府批准的搜索结果。对于诸如 1989 年中国起义（中国政府屠杀了数百名亲民主活动人士）等话题，不会出现任何信息。许多人对
    Google 的决定表示质疑。但尽管受到审查，佩奇和布林喜欢 Google 的搜索结果为中国人民提供了此前无法获得的丰富信息。


    佩奇和布林继续扩张 Google 的边界。许多人好奇他们会将公司带向何方。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_81_0.png)


    # 改变世界


    - 2006 年，佩奇和布林站在美国富公司之一的顶端。这对 Google 男子想利用公司巨大的财务资源和员工的创意与才华去做更多事情。为了让 Google
    不仅仅是一个搜索引擎，他们创立了 Google.org 来解决全球性问题。“显然，每个人都想获得成功、受信任并符合道德，我希望最终被看作是对世界做出了巨大改变，”布林说。他从佩奇聘请了世界健康专家拉里·布利安担任
    Google.org 负责人。作为一名医生，布利安曾在 20 世纪 70 年代帮助消灭了印度的天花。布利安说：“Google 不想成为问题的一部分；我们想成为解决方案的一部分。”

