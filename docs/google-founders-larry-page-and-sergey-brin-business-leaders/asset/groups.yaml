  - '[PAGE 75]


    When a private company becomes public, the primary owners can no longer make independent
    decisions. The share-holders, or investors who purchased stock, now own a portion
    of the company, although they aren’t involved in the day-to-day operations. SEC
    regulations require shareholder meetings and approval for certain decisions. Investors
    want the value of their stock to increase. If it decreases, they may sell their
    stock, which could impact the overall value of the company and drive it out of
    business.


    Months of planning go into the IPO process. The cast of characters includes accountants,
    advisors, and investment bankers, called underwriters, who help set the initial
    offering price for the stock. The underwriter creates a prospectus, a document
    describing the company in detail to potential investors. On the day of the IPO,
    usually 80 percent of the stock is sold to large firms, investment banks, and
    high-profile investors. The stock price increases and decreases depending on the
    confidence in the company and the stock market.


    Google’s IPO caused a media sensation. The company’s financial growth in the previous
    few years astounded people. Google’s profits now equaled more than $100 million.
    Just as Page and Brin ran their company differently, they wanted their IPO to
    be different. They called their prospectus the Letter from the Founders: An Owner’s
    Manual for Google’s Shareholders. “Google is not a conventional company,” wrote
    Page and Brin to investors. “We do not intend to become one.” According to the
    prospectus, Page, Brin, and Schmidt would continue making all major decisions,
    not shareholders. Instead of allocating 80 percent of their stocks to be sold
    to large banking institutions, Page and Brin held an auction, in which'
  - '[PAGE 76]


    anyone who wanted a share of Google stock could place a bid. It gave all investors—big
    and small—the same opportunity to invest in Google. The bids determined the initial
    price at which everyone got their shares. Google’s stock was initially offered
    at eighty-five dollars per share on August 19, 2004. By the end of the first day,
    the stock had risen to one hundred dollars per share. Within months it doubled
    and within a year it stood at more than three hundred dollars per share.


    Google’s IPO, the largest and most successful technology IPO ever, raised almost
    $3 billion for the company. The IPO made instant millionaires of more than 1,000
    Google employees who owned stock options. Page and Brin became the world’s youngest
    self-made billionaires, each with an estimated worth of $7 to $10 billion. *Vanity
    Fair* magazine ranked them the most powerful leaders of the information age. They
    had no plans to retire though. “If we were motivated by money, we would sell the
    company a long time ago and ended up on a beach,” said Page.


    However, on the heels of Page and Brin’s lucrative IPO, Geico, an insurance company,
    sued Google. Geico objected to the way Google profited by selling ads to the insurance
    company’s competition, using keywords linked to names trademarked by Geico. Other
    insurance companies could bid on the words *Geico* or *Geico Direct*. Geico claimed
    they were losing business because a competitor’s ad could appear when a user typed
    the search word *Geico*. Although rival companies could bid on the trademarked
    names, Google’s policies prohibited them from using those names in the headlines
    of their ads. Page and Brin won the dispute when a judge ruled that Geico hadn’t
    offered enough evidence to prove their case.'
