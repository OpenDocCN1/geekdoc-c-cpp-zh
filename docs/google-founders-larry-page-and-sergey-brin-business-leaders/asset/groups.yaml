    # 热爱计算机的男孩


    他的父母为他买了一台 Commodore 64 电脑。谢格（Sergey）开始思考如何将他的数学特长和科学思维应用于计算机。


    谢格喜欢和父母辩论，他的父母对他的挑战往往比老师还要多。作为父亲和教授，他的父亲非常严厉且要求严格。“他教的统计学课程几乎有一半的学生在第一节课后就退课了，因为他们无法承受他对他们自尊心的‘攻击，”一名学生说道。


    当谢格九岁时，他无意听到父亲在和同事聊天。米哈伊尔（Mikhail）抱怨说没有一个学生能解决他布置的一道复杂的数学题。听完对话后，谢格给出了该问题的正确答案。


    巨大而笨拙的 Commodore 64 键盘和鼠标


    ![](img/4289fd47e3baffa20ad5d74d4233a641_24_0.png)


    十五岁时，仍在读高中的谢格，在马里兰大学选修了数学和计算机科学课程。同年（1988年），他的弟弟萨姆（Sam）出生。萨姆很快在篮球方面脱颖而出，梦想成为职业运动员。因为布林斯夫妇非常重视学业，萨姆长大后认为任何职业都需要高级学位。他问父亲：“真的要在在打
    NBA 比赛之前必须先获得博士学位吗？”米哈伊尔回答道：“是的，萨姆，就是这样。”


    谢格提前一年高中毕业，开始在大学上研究生课程。十九岁时，他获得了马里兰大学的学位。毕业后，谢格开玩笑说要跑去加入马团。他热爱体操，并在秋千上训练了多年。尽管如此，谢格未来的道路是清晰的。他获得了美国科学基金会的奖学金，很快入读斯坦福大学攻读博士学位。在两年内，拉里（Larry）也来到了那里汇合。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_25_0.png)


    和谢格一样，拉里在高中也表现优。他遵循家族足迹，在密歇根大学学习计算机工程。


    美国科学基金会标志


    当拉里在课上使用手电脑时，没有人知道那是什么。在拉里的空闲时间，他在甜甜圈摊工作，帮助学校的太阳能赛车队制造了一辆获得全国冠军的赛车。当拉里在1995年毕业时，他也被斯坦福大学录取。他和谢格都不知道斯坦福大学正等待着他们。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_27_0.png)


    # 2


    “拉里和谢格”


    1995年，拉里·佩奇一踏上斯坦福大学的校园，就结识了谢格·布林。布林担任导游，带着佩奇和其他新生研究生在斯坦福广阔的校园里游。


    斯坦福校园位于加利福尼亚州的旧山和圣何塞之间，四周环着棕榈树和桉树。学生在矩形的奶油色建筑里上课，这些建筑排列着拱门，顶端着红瓦屋顶，是经典的西班牙风格。十多座雕塑点缀在修剪整齐的绿坪上。15,000名学生中，有人喜欢跳喷泉，跳入校园内许多喷泉的蓝水中，并进行“蒸汽隧道险”，探索大学地下的蒸汽隧道。


    不仅仅是美丽阳光的校园吸引了佩奇和布林来到斯坦福。他们被学校的名声所吸引。自学校1891年开校以来，它已发展为世界顶尖大学之一，以在科学、技术和数学方面的卓越成就而闻名。斯坦福是获得过诺贝尔奖、普利策奖和总统自由勋章的学者的所在地。斯坦福毕业生创立了
    Yahoo! 和领先科技公司惠普（Hewlett-Packard）。


    参与尖端计算机科学研究的机会佩奇和布林都感到兴奋。然而，当这对未来的联合创始人在那天相遇时，他们没不停地为随机问题争论。“我们都觉得对方很讨厌，”布林说，“但我们说话带点开玩笑的意思。显然，我们花了很多时间交流，所以彼此之间有些火花。我们当时有一种打趣的模式。”


    布林和佩奇的性格有所不同。布林自信且社交，随性且强烈。佩奇是一个害羞的中西部人，担心自己会因为达不到学校严苛的标准而被送回家。“他们都非常聪明，是我见过的最聪明的人之一，”斯坦福教授拉吉维夫·莫特瓦尼（Rajeev
    Motwani）说，“但他们的才华方式不同。……如果有一个二十人的小组会议，谢格在主局面。如果你在人群中，你可能注意不到[拉里]，但之后他会说：‘嘿，你觉得这个想法怎么样？’”


    尽管最初有争吵，佩奇和布林的相似之处多于差异。数学和科学构成了各自的童年。很快，他们变得几乎形影不离。朋友们叫他们“拉里和谢格”。随着他们一起深入研究项目，每个人都为工作带来了不同的能力。一位教授说，他们就像“两把互相磨砺的剑”。


    由于布林已经掌握了马里兰大学的研究生课程，他第一次尝试就通过了斯坦福大学全部十项博士资格考试。大多数学生直到第三年才能通过所有考试。布林不需要上任何课程就能获得博士学位；他剩下的要求就是写他的论文。


    布林在斯坦福探索了许多学科。“我预计他会找个导师，也许是个教授，”布林的父亲说，“我问他一个学期是否在修任何高级课程。他说：‘是的，我尝试了许多不同的东西。’你越是乱撞，就越可能撞到有价值的东西。”


    佩奇在斯坦福的第一年过得很艰辛。在他适应校园生活不久后，他的父亲病重了。卡尔·佩奇（Carl Page）遭受了肺炎后的并发症。他的健康迅速恶化，呼吸能力变差。几周内，年仅五十八岁的卡尔去世了。他被铭记为一个热爱辩论的先驱学者和老师。卡尔·佩奇的去世在他儿子的人生中留下了一个空白。幸运的是，拉里的弟弟卡尔小乔（Carl
    Jr.）在斯坦福附近生活和工作。兄弟俩分享了父亲的记忆，并在艰难时期互相支持。


    尽管遭受了创伤性的损失，佩奇继续了他的学业，埋头于工作。当时，硅谷正热论网景（Netscape），这是一家拥有浏览器产品的技术初创公司。浏览器让用户能够浏览互联网。这家公司成立仅十六个月，价值就迅速超过了30亿美元。华尔街的投资者越来越渴望资助其他尖端互联网公司，以期快速致富。网景的成功开启了硅谷的互联网时代。


    位于旧山湾波涌的水域南方，硅谷被迪亚布洛山脉阳光照射的山丘和圣克鲁斯山脉的古老红杉所环绕。直到上世纪40年代，种满桃、柠檬、杏和杏仁的巨大果园覆盖了整个山谷。第二次世界大战期间，美国海军在该地区设立了一个研究设施。其他科技公司相继而至。


    记者唐·霍夫勒（Don Hoefler）在1972年创造了“硅谷”一词。当时，山里的许多公司都在研究半导体，这是电子装置的组件。大多数半导体是用硅制成的，硅是沙子和石英中常见的元素。这个名字留了下来。今天，数百家高科技公司，如苹果、Yahoo!，


    硅谷的景观。旧山湾的南端在右侧的小丘之后转不可见。


