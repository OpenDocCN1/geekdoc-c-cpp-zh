    entirely out of lime beans. Technology ruled the office. A bucket of water with
    a computer-controlled pump watered the plants that climbed to the ceiling. A piano
    plugged into a computer provided music. A computer rack made out of Legos stood
    in one corner. Both Page and Brin loved to build with Legos. Later years, Brin
    would even fiddle with Legos during an interview, jokingly telling the reporter,
    “I was hoping to build a Lego nuclear reactor, but I think I have a bazooka-wielding
    robot."


    From Gates 360, Brin and Page carried out their research. Brin focused mainly
