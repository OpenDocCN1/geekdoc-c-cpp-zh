    他们的商业经验总加只有几个月。那年，一位记者询问比尔·盖茨（Bill Gates）最大的威胁。盖茨没有列出 Apple 或 Netscape 等知名对手，而是回答道：“我担心车库里的某人正在发明新东西。”像
    Google 这样的创新型公司可以成长并挑战微软这样的老牌公司。在他们公寓的门铃旁，他们贴了一张手写的牌子：Google 世界总部。


    ![](img/4289fd47e3baffa20ad5d74d4233a641_43_0.png)

    通过一个朋友，Page 和 Brin 认识鲁丝·凯达（Ruth Kedar），斯坦福大学的平面设计师兼助理教授。他们决定雇佣她设计 Google 的标志。他们想要一些基础但俏皮的东西，代表他们公司的价值观。“对他们来说，告诉我他们相信什么、未来如何看待自己是很重要的……”Kedar
