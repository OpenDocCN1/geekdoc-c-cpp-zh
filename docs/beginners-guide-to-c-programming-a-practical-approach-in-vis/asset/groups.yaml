    \n图 11.6. 程序的初始视图\n\n当单击 Reading mode Button 时，我们的方法将执行并更改 Label 的颜色：\n\n7. 生成并运行项目。当单击\
    \ Show Button 时，将出现一个消息框，如下所示：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_289_0.png)\n\
    \n图 11.9. 显示 myString 初始值的消息框\n\n当我们在此消息框中单击 OK 时，将调用我们的 `CallByValue()` 方法，然后再次显示\
