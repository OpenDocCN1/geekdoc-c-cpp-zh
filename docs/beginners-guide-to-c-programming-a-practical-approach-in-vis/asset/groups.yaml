    \n```\nprivate void fontButton_Click(object sender, EventArgs e)\n{\n}\n```\n\n\
    代码 6.9\n\n- 5. 与 ColorDialog 相同，我们将使用 `ShowDialog()` 方法按如下方式显示 FontDialog：\n\n\
    ```\nDialogResult fontResult = selectFontDialog.ShowDialog();\n```\n\n代码 6.10\n\
    \n当用户从 FontDialog 中选择字体属性并点击 OK 时，fontResult 对象将被设置为 OK。现在我们将 Button 文本的字体属性设置为\
    \ selectFontDialog 控件的 Font 属性：\n\n```\nfontButton.Font = selectFontDialog.Font;\n\
    ```\n\n代码 6.11\n\n- 6. 让我们将这些代码行插入到按钮的事件处理方法中：\n\n```\nprivate void fontButton_Click(object\
    \ sender, EventArgs e)\n{\n    DialogResult fontResult = selectFontDialog.ShowDialog();\n\
    \    fontButton.Font = selectFontDialog.Font;\n}\n```\n\n代码 6.12\n\n- 7. 构建并运行项目。程序将如\
    \ 图 6.29 所示出现。点击 Select font properties 按钮，FontDialog 将如 图 6.30 所示显示。我在 FontDialog\
    \ 中选择了粗体和下划线。当点击 OK 按钮时，此对话框将关闭，Button 的文本将相应更改，如 图 6.31 所示。\n\n![](img/41d82527c4e41cdb7e56259564306ddc_154_0.png)\n\
    \n图 6.29. 带有 FontDialog 的示例程序\n\n![](img/41d82527c4e41cdb7e56259564306ddc_154_1.png)\n\
    \n图 6.30. FontDialog 窗口\n\n![](img/41d82527c4e41cdb7e56259564306ddc_154_2.png)\n\
    \n图 6.31. Button 的字体属性设置为在 FontDialog 中选择的设置\n\n![](img/41d82527c4e41cdb7e56259564306ddc_156_0.png)\n\
    \n图 6.33. 窗体的布局\n\n- 5. 双击按钮以创建其 Click 事件处理程序：\n\n```\nprivate void fbdButton_Click(object\
    \ sender, EventArgs e)\n{\n}\n```\n\n代码 6.13\n\n- 6. 为了显示 FolderBrowserDialog，我们将对其应用\
    \ `ShowDialog()`。返回值将为 `DialogResult` 类型，如之前的对话框示例中所示：`DialogResult fbdResult\
    \ = selectFolderBrowserDialog.ShowDialog();`\n\n- 7. 我们将使用以下代码更新 Label 的 Text\
    \ 以显示所选文件夹：`selectedFolderLabel.Text = selectFolderBrowserDialog.SelectedPath;`。我们取\
    \ FolderBrowserDialog 的 `SelectedPath` 属性并将其分配给 Label 的 Text 属性。我们将按如下方式将这些代码行插入到按钮的\
    \ Click 事件处理方法中：\n\n```\nprivate void fbdButton_Click(object sender, EventArgs\
    \ e)\n{\n    DialogResult fbdResult =\n        selectFolderBrowserDialog.ShowDialog();\n\
    \    selectedFolderLabel.Text =\n        selectFolderBrowserDialog.SelectedPath;\n\
    }\n```\n\n代码 6.14\n\n- 8. 构建并运行项目。以下程序将会出现：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_157_0.png)\n\
    \n图 6.34. 程序窗口\n\n点击 Select a folder 按钮，FolderBrowserDialog 将启动：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_157_1.png)\n\
    \n图 6.35. FolderBrowserDialog 等待文件夹选择\n\n当我们从对话框中选择一个文件夹并点击 OK 按钮时，所选文件夹的完整路径将显示在\
    \ Label 中，如 图 6.36 所示。\n\n- 3. 在窗体上添加一个 Button，用于启动 OpenFileDialog。将 Button 的\
    \ Name 和 Text 属性分别设置为 `openFileButton` 和 `Click to open a text file`。\n- 4. 在窗体上\
    \ Button 下方添加一个 RichTextBox。我们将在此控件中显示所选文本文件的内容。将其 Name 设置为 `fileRichTextBox`。完成这些步骤后，窗体将如下所示：\n\
    \n![](img/41d82527c4e41cdb7e56259564306ddc_159_0.png)\n\n图 6.38. 窗体的布局\n\n- 5.\
    \ 我们只想打开文本文件，因为大多数其他文件类型（如图像、视频和格式化的文本文件）的内容无法在 RichTextBox 中显示。我们需要为 OpenFileDialog\
    \ 设置一个筛选器，仅打开扩展名为 .txt 的文件。为此，选择 `textFileOpenFileDialog` 并将其 Filter 属性设置为 `Text\
    \ Files | *.txt`，如 图 6.39 所示。\n\n- 6. 当点击 Button 时，OpenFileDialog 窗口将会出现。因此，双击窗体上的\
    \ Button 以生成其默认事件处理方法，如 代码 6.15 所示。\n\n![](img/41d82527c4e41cdb7e56259564306ddc_160_0.png)\n\
    \n图 6.39. 设置 OpenFileDialog 的 Filter 属性\n\n```\nprivate void openFileButton_Click(object\
    \ sender, EventArgs e)\n{\n}\n```\n\n代码 6.15\n\n- 7. 首先，我们将添加代码行 `DialogResult\
    \ openFileResult = textFileOpenFileDialog.ShowDialog();`，它将启动文件打开对话框。\n- 8. 当用户在文件打开对话框中选择一个文本文件并点击\
    \ OK 时，OpenFileDialog 的 FileName 属性将被分配给所选文件名。我们将取此 FileName 并使用代码行 `string fileName\
    \ = textFileOpenFileDialog.FileName;` 将其分配给一个新的字符串。变量 fileName 然后将包含所选文件的名称。\n\
    - 9. 然后，我们将使用特殊方法 `ReadAllText()` 来读取文本文件的内容。此方法读取文本文件并将文本文件的内容分配给字符串变量。代码行 `string\
    \ text = File.ReadAllText(fileName);` 将完成此工作。请注意，方法 `ReadAllText()` 未包含在 Form1.cs\
    \ 文件中已有的默认库中。因此我们需要在源代码顶部添加包含此方法的库，使用行：`using System.IO;`\n- 10. 最后，我们将使用代码行：`fileRichTextBox.Text\
    \ = text;` 将 RichTextBox 的 Text 设置为从文件中读取的文本。完成这些步骤后，Form1.cs 文件将如下所示：\n\n```\n\
    using System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\n\
    using System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\nusing System.Windows.Forms;\nusing System.IO;\n\
    \nnamespace OpenFileDialog\n{\n    public partial class Form1 : Form\n    {\n\
    \        public Form1()\n        {\n            InitializeComponent();\n     \
    \   }\n\n        private void openFileButton_Click(object sender, EventArgs e)\n\
    \        {\n            DialogResult openFileResult = textFileOpenFileDialog.ShowDialog();\n\
    \            string fileName = textFileOpenFileDialog.FileName;\n            string\
    \ text = File.ReadAllText(fileName);\n            fileRichTextBox.Text = text;\n\
    \        }\n    }\n}\n```\n\n代码 6.16\n\n- 11. 构建并运行项目。图 6.40 所示的程序窗口将被启动。我们需要一个用于读取的文本文件。为此目的，您可以使用计算机上已有的文本文件。我为此示例在记事本中创建了一个新的文本文件\
    \ `test.txt`。当点击 `Click to open a text file...` 按钮时，它将显示文本文件，如 图 6.41 所示。\n"
