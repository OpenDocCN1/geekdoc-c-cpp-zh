    # 2.1. Downloading and Installing Visual Studio


    Please navigate to https://www.visualstudio.com/downloads/ in your web browser.
    You''ll see the download page shown in Figure 2.1.


    ![](img/41d82527c4e41cdb7e56259564306ddc_17_0.png)


    Figure 2.1. Visual Studio download options


    Click on the Free download button of the Visual Studio Community edition. This
    will initiate the download of the online installer having the size of a few megabytes.
    Double click on the downloaded file and then you''ll get the following message:


    ![](img/41d82527c4e41cdb7e56259564306ddc_17_1.png)


    Figure 2.2. Visual Studio installation – first message


    Please click Continue in this message if you agree to the terms so that the installer
    will start preparing the installation:


    ![](img/41d82527c4e41cdb7e56259564306ddc_17_2.png)


    Figure 2.3. Visual Studio installation – second message'
  - '[PAGE 18]


    Visual Studio installation options window will appear in a few minutes as follows:


    ![](img/41d82527c4e41cdb7e56259564306ddc_18_0.png)


    Figure 2.4. Visual Studio installation options


    We''ll develop C# desktop applications therefore we need to select **Universal
    Windows Platform Development** and **.NET desktop development** options. You can
    of course install other development tools also if you''re interested but we''ll
    only cover visual C# in this book and installing **Universal Windows Platform
    Development** and **.NET desktop development** options are enough for this as
    indicated by the arrows in Figure 2.5.


    I didn''t change the default installation location shown inside the rectangular
    box in the bottom left this figure. In the bottom right, the installation informs
    us that this installation will take around 8GB of hard disk space. If you''re
    OK with these settings, please click the **Install** button at the bottom right
    corner and then Visual Studio installation will begin. Please note that this is
    an online installer therefore it will download the actual installation files and
    install them. This will take some time depending on your Internet connection speed
    (around 30 minutes with an ADSL and 5 minutes with a fibre connection). The installation
    window shown in Figure 2.6 will appear during this process.'
