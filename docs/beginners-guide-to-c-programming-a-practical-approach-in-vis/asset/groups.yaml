    \n图 5.26. 窗体的当前状态\n\n5. 当用户单击按钮时，消息框将显示所选日期。为此，双击按钮以创建其默认事件处理程序 **Click**，如我们在\
    \ 5.1 小节中所学的：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_77_1.png)\n\n图 5.27.\
    \ 按钮的默认事件处理程序\n\n6. 为了在消息框中显示所选日期，我们将在按钮的事件处理程序中按如下方式获取 DateTimePicker 的 Value\
    \ 属性：\n\n```\nprivate void showDateButton_Click(object sender, EventArgs e)\n\
    {\n    MessageBox.Show(dateTimePicker1.Value.ToLongDateString());\n}\n```\n\n\
    代码 5.6\n\n由于 DateTimePicker 控件的 Name 属性默认为 dateTimePicker1，我们获取其 Value 属性并使用方法\
    \ `ToLongDateString()` 将其转换为字符串，以便在消息框中显示。\n\n7. 现在，构建并运行项目：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_78_0.png)\n\
    \n图 5.28. DateTimePicker 示例\n\nDateTimePicker 默认显示当前日期。我们可以通过单击 DateTimePicker\
    \ 右侧的箭头从列表中选择另一个日期，如图 5.29 所示。\n\n![](img/41d82527c4e41cdb7e56259564306ddc_79_0.png)\n\
    \n图 5.29. 选择不同的日期\n\n现在我们可以单击 Show Selected Date 按钮以在消息框中显示所选日期，如图 5.30 所示。\n\n\
    ![](img/41d82527c4e41cdb7e56259564306ddc_79_1.png)\n\n图 5.30. 在消息框中显示所选日期\n\n\
    ## 5.6. Label\n\n标签只是窗体上的静态文本。标签不能由用户编辑，但可以通过编程添加、删除或更改。标签的重要属性如下：\n\n- **Text**:\
    \ 标签上写入的文本。\n- **AutoSize**: 根据文本长度按比例调整 Label 大小。\n- **TextAlign**: 将文本对齐到 Label\
    \ 的左侧、中心或右侧。\n\n一个简单的 Label 示例：在本示例中，我们将一起使用 Label、Button 和 CheckBox。\n\n1. 在\
    \ Visual Studio 中创建一个新的 C# 项目。\n2. 将 Label、Button 和 CheckBox 放置在窗体上，如下所示：\n\n\
    ![](img/41d82527c4e41cdb7e56259564306ddc_80_0.png)\n\n图 5.31. 窗体的布局\n\n3. 将按钮的\
    \ Name 改为 changeLabelButton，Text 改为 Change the Label。\n4. 同样，将 CheckBox 的 Name\
    \ 和 Text 属性分别设置为 changeLabelCheckBox 和 Change the Label。\n5. 将 Label 的 Name 和\
    \ Text 分别设置为 changingLabel 和 Default。\n\n进行这些更改后，窗体应如下所示：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_80_1.png)\n\
    \n图 5.32. 更改后的窗体外观\n\n6. 我们现在将为 CheckBox 和 Button 创建事件处理程序，以更改 Label 的 Text 属性。为此，双击\
    \ Button 并添加代码行 `changingLabel.Text = \"Button clicked\";`，这将把 Label 的 Text 设置为\
    \ Button clicked。\n\n7. 现在，双击 CheckBox 以创建其默认事件处理程序方法，并在该方法体中添加 `changingLabel.Text\
    \ = \"Checkbox checked/unchecked\";`。进行这些更改后，这些事件处理程序将如下所示：\n\n```\nprivate void\
    \ changeLabelButton_Click(object sender, EventArgs e)\n{\n    changingLabel.Text\
    \ = \"Button clicked\";\n}\n\nprivate void changeLabelCheckBox_CheckedChanged(object\
    \ sender, EventArgs e)\n{\n    changingLabel.Text = \"Checkbox checked/unchecked\"\
    ;\n}\n```\n\n代码 5.7\n\n8. 当我们构建并运行项目时，Label 将显示 Default，然后在我们单击 Button 或选中 CheckBox\
    \ 时会更改，如下所示：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_81_0.png)\n\n图 5.33.\
    \ Label 示例\n\n## 5.7. LinkLabel\n\nLinkLabel 是具有超链接功能的类似 Label 的控件，即用户可以单击 LinkLabel\
    \ 以打开位置（通常是网页）。\n\nLinkLabel 的主要属性如下：\n\n- **LinkColor**: 设置 LinkLabel 的文本颜色。\n\
    - **VisitedLinkColor**: 用户访问链接后 LinkLabel 的颜色。\n- **LinkBehavior**: 设置链接是否下划线。\n\
    \n### 一个 LinkLabel 示例：\n\n1. 在 Visual Studio 中创建一个新的 C# 项目。\n2. 将 LinkLabel 放置在窗体上，如下所示：\n\
    \n![](img/41d82527c4e41cdb7e56259564306ddc_82_0.png)\n\n图 5.34. 窗体上的 LinkLabel\n\
    \n3. 将 LinkLabel 的 Text 属性设置为 **访问主页**。\n4. 将 LinkLabel 的 Name 属性从 linkLabel1\
    \ 改为 **visitHomepageLinkLabel**。窗体应如图 5.35 所示。\n5. 现在，双击 LinkLabel 以创建其默认事件 **LinkClicked**。\n\
    6. 在事件处理程序方法体中插入以下代码：`System.Diagnostics.Process.Start(\"www.msdn.com\");` 此代码行用于打开括号内给出的链接。当用户单击\
    \ LinkLabel 时，Web 浏览器将打开 Microsoft Developer Network（MSDN）网站。事件处理方法 `visitHomepageLinkLabel_LinkClicked()`\
    \ 将如下所示：\n\n## 5.8. ListBox\n\nListBox 显示项目列表。它用于向用户显示项目并让用户从中选择项目。项目可以在开发期间以可视方式添加到\
    \ ListBox，也可以在运行时以编程方式添加。\n\nListBox 常用属性和方法如下：\n\n> 我们到目前为止多次提到过 **methods**。如您所注意到的，它们用于执行功能。请注意，方法在其后使用括号，如下所示。\n\
    \n- **Items**: 用于访问 ListBox 中的项目。\n- **Add()**: 用于添加新项目。\n- **Remove()**: 删除一个项目。\n\
    - **SelectedItem**: 返回所选项目的名称。\n- **SelectedIndex**: 返回所选项目的索引。\n- **Count**:\
    \ 返回 ListBox 中项目的数量。\n- **Clear()**: 从 ListBox 中删除所有项目。\n\n让我们开发一个包含 ListBox 的项目。我们将使用\
    \ Buttons 向 ListBox 添加/删除项目并在消息框中显示用户选择的项目。\n\n1. 在 Visual Studio 中创建一个新的 C# 项目。\n\
    2. 将 ListBox 和三个 Buttons 放置在窗体上，如图 5.37 所示。\n\n![](img/41d82527c4e41cdb7e56259564306ddc_84_0.png)\n\
    \n图 5.37. 窗体的布局\n\n每次用户单击 Add random 按钮时，因此会向 ListBox 添加不同的随机数。\n\n7. 同样，双击 Remove\
    \ selected 按钮以创建其事件处理程序，并添加必要的代码以使用以下代码删除所选项目：\n\n```\nprivate void removeSelectedButton_Click(object\
    \ sender, EventArgs e)\n{\n    listBox1.Items.Remove(listBox1.SelectedItem);\n\
    }\n```\n\n代码 5.10\n\nRemove() 方法删除括号内写入的项目。在此代码中，我们将所选项目作为 Remove(listBox1.SelectedItem)\
    \ 传递给方法，以便该方法删除用户选择的项目。\n\n8. 最后，双击 Show item count 按钮以生成其事件处理程序，并在其中放置以下代码，以便消息框显示\
    \ ListBox 中的项目数量：\n\n```\nprivate void itemCountButton_Click(object sender, EventArgs\
    \ e)\n{\n    MessageBox.Show(\"Number of items: \"+listBox1.Items.Count.ToString());\n\
    }\n```\n\n代码 5.11\n\n在此代码中，listBox1.Items.Count.ToString() 以文本形式返回（给出）ListBox\
    \ 的项目数量。与其只在消息框中显示一个数字，我们使用 + 运算符将其与文本 \"Number of items: \" 合并。因此，如果 ListBox\
    \ 中的项目数为 5，消息框将显示：The number of items: 5。\n\n9. 构建并运行项目后，ListBox 将为空，如图 5.39 所示。多次单击\
    \ Add random 按钮后，ListBox 将填充随机数，如图 5.40 所示。\n"
