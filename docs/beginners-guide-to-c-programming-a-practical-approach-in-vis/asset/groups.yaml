    \n图 6.70. SplitContainer 的任务对话框\n\n- 4. 当我们点击 Horizontal Splitter Orientation\
    \ 时，SplitContainer 将水平分割窗体：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_182_0.png)\n\
    \n图 6.71. SplitContainer 水平分割窗体\n\n- 5. 此外，我们可以通过在任务对话框中点击 Undock in Parent Container\
    \ 来取消停靠 SplitContainer，这意味着它可能不会覆盖整个窗体：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_182_1.png)\n\
    \n图 6.72. 从窗体取消停靠的 SplitContainer\n\n值得注意的是，我们也可以通过拖放分隔线来调整 SplitContainers 的面板大小。\n\
    \n- 5. 分别将这些按钮的 Text 属性设置为 **LeftToRight**、**TopDown**、**RightToLeft** 和 **BottomUp**。\n\
    \n- 6. 通过双击每个按钮创建它们的默认 Click 事件，如下所示：\n\n```\nprivate void lrButton_Click(object\
    \ sender, EventArgs e)\n{\n}\n\nprivate void tdButton_Click(object sender, EventArgs\
    \ e)\n{\n}\n\nprivate void rlButton_Click(object sender, EventArgs e)\n{\n}\n\n\
    private void buButton_Click(object sender, EventArgs e)\n{\n}\n```\n\n代码 6.19\n\
    \n- 7. 当点击 **LeftToRight** 按钮时，**changeFlowLayoutPanel** 的 **FlowDirection** 属性将通过代码行\
    \ changeFlowLayoutPanel.FlowDirection = FlowDirection.LeftToRight; 设置为 **LeftToRight**。对于其他三个按钮，我们以类似的行设置\
    \ FlowLayoutPanel 的 FlowDirection 属性。插入相应的代码行后，按钮的事件处理程序如下所示：\n\n```\nprivate\
    \ void lrButton_Click(object sender, EventArgs e)\n{\n    changeFlowLayoutPanel.FlowDirection\
