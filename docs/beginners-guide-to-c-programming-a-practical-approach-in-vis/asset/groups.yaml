    I''ll not introduce complicated subjects until I''m sure that you understand the
    basics because it is very easy to get lost while learning a new programming language.
    You''ll not be in such a situation with this book. I''ll try to teach new concepts
    in the simplest way possible. Please don''t forget that learning a programming
    language is a non-stop process, it never ends and this book will help you get
    started easily.


    Now, you know the aims and the method of this book. We will continue with installation
    of Visual Studio integrated development environment on our PC in the following
    chapter.


    Please note that you can download complete project files and colour figures contained
    in this book from the book''s website at www.yamaclis.com/csharp.'
