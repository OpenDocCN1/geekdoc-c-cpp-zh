    \n在这段代码中，entries 指数据库中的数据。如你所见，代码行数将变得难以处理。相反，我们可以使用循环以更优雅、更简单的方式完成同样的工作：\n\n\
    ```csharp\nfor(each entry in the database)\n{\nMessageBox.Show(current entry);\n\
    }\n```\n\n代码 9.2\n\nC# 中有四种循环结构：for、foreach、while 和 do-while。在本章中，我们将通过在小型项目中使用它们来学习这些结构：\n\
