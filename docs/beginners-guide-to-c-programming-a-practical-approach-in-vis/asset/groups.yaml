  mdcn: "\n## 第7章：变量和常量\n\n![](img/41d82527c4e41cdb7e56259564306ddc_188_0.png)\n\n\
    我们将在本章系统地学习 C# 编程语言。我们的第一个主题是编程中的一个基本概念：变量和常量。\n\n### 7.1. 变量\n\n变量用于在程序执行期间临时保存数据。我们可以将变量视为存储在随机访问内存（RAM）中的临时数据的地址（或指针）。在某些编程语言中，编译器理解变量的类型并为其在\
    \ RAM 中分配所需的空间。这些称为动态类型语言。另一方面，在 C# 等静态类型语言中，变量的类型必须在能够存储数据之前明确定义。在 C# 中，当变量的类型声明时，C#\
    \ 编译器会在内存中为该变量分配所需的空间。\n\n#### 7.1.1. 声明变量\n\n变量以其类型和名称按以下形式定义：\n\n```\nvariable_type\
    \ variable_name;\n```\n\nC# 中有几种变量类型，每种都有特定的长度。当变量按上述方式声明时，为变量分配内存空间但尚未填充。因为变量尚未被赋予值。下面是一个整数类型变量的定义：\n\
    \n```\nint a;\n```\n\n代码 7.1\n\n在这一行代码中，我们请求 C# 编译器“在内存中分配空间以存储一个整数，并且该数字将在程序中以后被称为\
    \ a”。编译器用这一行分配空间，换句话说变量 a 被创建了。然而它仍然是空的。如果我们尝试在程序中使用这个变量，程序会大喊大叫，对不起，它会给出一个错误，提示变量\
    \ a 已声明但未赋值。变量的值使用 = 运算符赋值。是的，它就是通常的等号，但在 C# 中有一个时尚的名字：赋值运算符。我们可以按如下方式将数字 3 赋给变量\
    \ a：\n\n```\na=3;\n```\n\n代码 7.2\n\n值也可以在声明期间赋值。这称为变量的初始化：\n\n```\nint a=3;\n\
    ```\n\n代码 7.3\n\n因此，这行代码与代码 7.1 和 7.2 的组合做同样的事情：声明一个整数变量 a 并将 3 赋给这个变量。\n\n我们可以在一行中按如下方式声明同一类型的多个变量：\n\
    \n```\nint a, b, c;\n```\n\n代码 7.4\n\n我们使用逗号之间声明了三个整数变量 a、b 和 c。同样，我们也可以在一行中初始化这些变量：\n\
    \n```\nint a=3, b=4, c=8;\n```\n\n代码 7.5\n\n除了 int 之外还有几种变量类型，我们稍后会看到。但在此之前，让我们研究一下关于变量名称需要遵循的规则。\n\
    \n#### 7.1.2. 变量命名规则\n\n我们不能随意使用任何名称作为变量名。以下是变量命名的基本规则：\n\n- 变量名不能包含空格。例如，声明：\n\
    \n  ```\n  int my integer;\n  ```\n\n  代码 7.6\n\n  由于变量名中 y 和 i 字符之间存在空格，因此是非法的。如果我们想使用这样的名称，我们可以使用连字符\
