    TreeView control is used for displaying items in a hierarchical manner.


    TreeView has the following important properties:


    +   - **CheckBoxes**: Sets if checkboxes will appear next to the items for selection.

    +   - **ShowLines**: Sets if a line connecting the nodes will be displayed or
    not.

    +   - **ShowPlusMinus**: Used for setting if + and – symbols will appear for opening/closing
    node list.

    +   - **GetNodeCount**: Returns the number of nodes in a TreeView.'
