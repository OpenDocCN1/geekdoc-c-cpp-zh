  mdcn: "\n\n5. 将 Button 的 FontSize 属性设置为 12 磅。\n\n这些步骤完成后，我们的窗体将如下所示：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_61_0.png)\n\
    \n图 5.2. 窗体上的按钮\n\n6. 双击 Button，创建其默认的 Click 事件方法。\n\nVisual Studio 中将出现代码编辑器：\n\
    \n![](img/41d82527c4e41cdb7e56259564306ddc_61_1.png)\n\n图 5.3. 代码文件中的按钮 Click\
    \ 事件方法\n\n如你所见，编辑器中已经有几行 C# 代码。我们将逐步解释每一行。不过现在，让我们重点关注矩形内显示的按钮事件处理程序方法。当我们双击窗体上的按钮时，会自动创建此方法。我们可以在此方法的大括号之间编写任意\
    \ C# 代码，这些代码将在用户单击按钮时（即按钮的 Click 事件被调用时）执行。\n\n7. 让我们在 changeButton_Click(...)\
    \ 方法中添加以下代码行：\n\n```\nchangeButton.Text = \"Clicked!\";\nthis.BackColor = Color.White;\n\
    ```\n\n代码 5.1\n\n首先，你会注意到，在键入这些代码行时，Visual Studio 会尝试理解你想要编写的内容并进行补全，如下所示。你可以按键盘上的\
    \ Tab 键，让 Visual Studio 补全你的代码行。这被称为“IntelliSense 技术”。\n\n![](img/41d82527c4e41cdb7e56259564306ddc_62_0.png)\n\
    \n图 5.4. Visual Studio 代码编辑器中的代码补全\n\n现在让我们试着理解这些代码行的含义。第一行 `changeButton.Text\
    \ = \"Clicked!\";` 的意思是“将名为 changeButton 的控件的 Text 属性设置为 \"Clicked!\" ”。可以看到，在\
    \ C# 中，文本写在双引号内。此外，每一行代码都应以分号结尾。这些是重要的规则。\n\n第二行 `this.BackColor = Color.White;`\
    \ 的意思是“将 this 的背景颜色设置为白色”。这里，`this` 指的是窗体本身。因此，当按钮的 Click 事件发生时，这两行代码会将按钮的文本改为“Clicked!”，并将窗体的背景颜色改为白色。\n\
    \n为方便起见，下面还给出了完整的 Form1.cs 代码：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing\
    \ System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\
    \nnamespace Button\n{\n    public partial class Form1 : Form\n    {\n        public\
    \ Form1()\n        {\n            InitializeComponent();\n        }\n\n      \
    \  private void changeButton_Click(object sender, EventArgs e)\n        {\n  \
    \          changeButton.Text = \"Clicked!\";\n            this.BackColor = Color.White;\n\
    \        }\n    }\n}\n```\n\n代码 5.2\n\n6. 现在让我们双击窗体上的 CheckBox，创建其默认事件处理程序 CheckedChanged。该事件在\
    \ CheckBox 被选中或取消选中时触发：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_66_0.png)\n\
    \n图 5.8. 在 Form1.cs 文件中创建的 CheckedChanged 事件处理程序方法\n\n就像我们在 Button 示例中所做的那样，我们将把代码写在大括号内。让我们添加一行\
    \ `this.BackColor = Color.White;`，这样 `changeBackColourCheckBox_CheckedChanged(...)`\
    \ 事件处理程序方法将如下所示：\n\n```\nchangeBackColourCheckBox_CheckedChanged(object sender,\n\
    EventArgs e)\n{\n    this.BackColor = Color.White;\n}\n```\n\n代码 5.3\n\n添加完代码后，我们可以生成并运行项目。当我们勾选\
    \ CheckBox 时，窗体的背景颜色将变为白色，如图 5.9 和图 5.10 所示。\n\n![](img/41d82527c4e41cdb7e56259564306ddc_67_0.png)\n\
    \n图 5.9. 勾选 CheckBox 之前的程序\n\n![](img/41d82527c4e41cdb7e56259564306ddc_67_1.png)\n\
    \n图 5.10. 勾选 CheckBox 之后背景颜色发生变化\n\n在此示例中，代码行 `this.BackColor = Color.White;`\
    \ 的执行与 CheckBox 的状态无关。换句话说，我们无法判断 CheckBox 是否被选中；`this.BackColor = Color.White;`\
    \ 在两种情况下都会执行。为了做出这种区分，我们需要在 C# 中使用条件语句。因此，我们将在学习条件语句之后，在接下来的章节中再来处理这个问题。\n\n>\
    \ 值得注意的是，一个窗体可以包含多个可独立选择的 CheckBox，也就是说，可以同时选中多个 CheckBox。\n\n### 5.3. CheckedListBox\n\
    \n这是一个包含多个条目的列表，这些条目可以独立勾选/取消勾选。CheckedListBox 中的条目可以在开发期间添加，也可以在运行期间以编程方式添加。\n\
    \n像往常一样，让我们在 Visual Studio 中创建 CheckedListBox 示例：\n\n1. 在 Visual Studio 中创建一个新的\
    \ C# 项目。\n2. 在窗体中间放置一个 CheckedListBox。\n3. 将此控件的 Name 属性设置为 pcCheckedListBox（这里的\
    \ *pc* 代表 *编程概念*）。\n4. 放置 CheckedListBox 后，默认情况下它没有任何条目。若要添加条目，请单击 CheckedListBox\
    \ 顶部的小箭头，如下方圆圈内所示：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_68_0.png)\n\n图\
    \ 5.11. 用于向 CheckedListBox 添加条目的箭头\n\n5. 单击那个小箭头时，将出现一个小菜单，如图 5.12 所示。单击其中的**编辑条目**，打开一个用于添加条目的窗口。\n\
