    # 5.11. MonthCalendar


    This control shows calendar in month format so that the user can pick a date from
    it. MonthCalendar is similar to DateTimePicker. Their difference is that MonthCalendar''s
    calendar view is always open for selecting a date, while the user needs to click
    on the DateTimePicker to open the view to select date.'
  - '[PAGE 98]


    The properties of MonthCalendar are as follows:


    +   - **MinDate**: The minimum date the MonthCalendar will show.

    +   - **MaxDate**: Maximum date the MonthCalendar will show.

    +   - **BoldedDates**: Used for showing special dates in bold.

    +   - **ShowToday**: Sets if today''s date will be shown at the bottom of the
    calendar or not.

    +   - **SelectionStart**: Holds the selected starting date.

    +   - **SelectionEnds**: Holds the selected ending date.

    +   - **SelectionRange**: Holds the range of days between the selected starting
    date and ending date.


