    \ they resize automatically as new elements are added or removed. Since the length\
    \ of an ArrayList is dynamic, their length is not specified during declaration.\
    \ Another advantage of ArrayLists is that there are various useful methods enabling\
    \ us to alter the ordering of the structure dynamically.\n\nArrayLists have integer\
    \ indices which start from 0 as in usual arrays.\n\nLet’s declare and use an ArrayList\
