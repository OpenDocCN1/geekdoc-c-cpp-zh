    # LOOPS


    Loops are used when a code line or code block has to be executed multiple times
    depending on a condition. For example, consider a database with name entries in
    it. If we want to display all the names one by one, we would do it in the following
    way:


    ```

    MessageBox.Show(entry 1);

    MessageBox.Show(entry 2);

    MessageBox.Show(entry 3);

    .

    MessageBox.Show(entry n-1);

    MessageBox.Show(entry n);

