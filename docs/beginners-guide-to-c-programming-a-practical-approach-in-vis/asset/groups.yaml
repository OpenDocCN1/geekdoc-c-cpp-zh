    \ will show.\n- **BoldedDates**: Used for showing special dates in bold.\n- **ShowToday**:\
    \ Sets if today's date will be shown at the bottom of the calendar or not.\n-\
    \ **SelectionStart**: Holds the selected starting date.\n- **SelectionEnd**: Holds\
    \ the selected ending date.\n- **SelectionRange**: Holds the range of days between\
    \ the selected starting date and ending date.\n\n### A MonthCalendar Example:\
    \ Let's show the range of days between the selected starting and ending dates\
    \ of a MonthCalendar on a Label in this example.\n\n- 1. Create a new C# project\
    \ in Visual Studio.\n- 2. Place a MonthCalendar and a Label on the form as follows:\n\
    \n![](img/41d82527c4e41cdb7e56259564306ddc_98_0.png)\n\nFigure 5.59. Layout of\
    \ the form\n\n- 3. Set the Name of the Label as **rangeLabel** and its Text as\
    \ **SelectionRange:**.\n- 4. Set the Name of the MonthCalendar as **selectDates**.\n\
    - 5. The default event for the MonthCalendar is the **DateChanged** event, which\
    \ fires when the selected date(s) change. Therefore, double-click the MonthCalendar\
    \ to create its default event handler method `selectDates_DateChanged(...)`.\n\
    \n- 6. Add the following code line to display the SelectionRange when the user\
    \ selects date range on the calendar: `rangeLabel.Text = selectDates.SelectionRange.ToString();`.\
    \ After this addition, the default event handler method will be as follows:\n\n\
    ```csharp\nprivate void selectDates_DateChanged(object sender,\nDateRangeEventArgs\
    \ e)\n{\n    rangeLabel.Text = selectDates.SelectionRange.ToString();\n}\n```\n\
    \nCode 5.17\n\n- 7. Let’s build and run the project. Today’s date will be automatically\
    \ selected on the MonthCalendar control by default and the Label will display\
    \ its default text:\n\n![](img/41d82527c4e41cdb7e56259564306ddc_99_0.png)\n\n\
    Figure 5.60. The initial view of the program\n\nWe can now select dates from the\
    \ calendar. For this, click on a starting date, hold down the mouse button, and\
    \ drag the mouse pointer to the ending date. The selected dates will then be shown\
    \ by a grey background while the Label will display the selection range as in\
    \ Figure 5.61.\n\nIt is worth noting that the maximum selection range is 7 days\
    \ by default. You can change it by setting the MaxSelectionCount property of the\
    \ MonthCalendar control.\n\n![](img/41d82527c4e41cdb7e56259564306ddc_100_0.png)\n\
    \nFigure 5.61. Label showing the selected range\n\n### 5.12. NotifyIcon\n\nThis\
    \ control is used for displaying an icon in the notification area of Windows.\
    \ Notification area is at the right of the taskbar as shown below:\n\n![](img/41d82527c4e41cdb7e56259564306ddc_100_1.png)\n\
    \nFigure 5.62. The notification area\n\nThe important properties of the NotifyIcon\
    \ are as follows:\n\n- **Icon:** The Icon property of the NotifyIcon specifies\
    \ which icon file (*.ico) is to be used as the application icon in the notification\
    \ area.\n- **ContextMenuStrip:** Specifies the right-click menu of the NotifyIcon.\n\
    \n> ContextMenuStrip is a menu component which is used for specifying a menu for\
    \ the right-click as mentioned in the previous chapter. NotifyIcon control is\
    \ generally used together with the ContextMenuStrip.\n\nLet's see how we can use\
    \ NotifyIcon in conjunction with the ContextMenuStrip in an example:\n\n- 1. Create\
    \ a new C# project in Visual Studio.\n- 2. Place a NotifyIcon and a ContextMenuStrip\
    \ on the form. As you drag&drop these elements on the form, you will see that\
    \ they do not appear on the form. It is because these elements operate in the\
    \ background and not displayed to the user. After drag&drop operations, you will\
    \ see these elements below the form design pane:\n\n![](img/41d82527c4e41cdb7e56259564306ddc_101_0.png)\n\
    \nFigure 5.63. NotifyIcon and ContextMenuStrip elements of the form\n\n- 3. Click\
    \ on the contextMenuStrip1 menu (as shown in Figure 5.63) and then it will temporarily\
    \ appear on the form for entering a right-click menu as in Figure 5.64. Let's\
    \ insert an Exit item for this example as shown in Figure 5.65.\n\n- 4. We will\
    \ now set the action the Exit menu will perform. For this, double-click on the\
    \ Exit item so that its event handler method `exitToolStripMenuItem_Click(...)`\
    \ will be created in the editor as shown in Figure 5.66.\n\n- 5. Add the code\
    \ line `Application.Exit();` inside this event handler, which will cause the application\
    \ to quit when executed:\n\n```csharp\nprivate void exitToolStripMenuItem_Click(object\
    \ sender,\nEventArgs e)\n{\n    Application.Exit();\n}\n```\n\nCode 5.18\n"
