    ## C# 编程初学者指南


    ![](img/41d82527c4e41cdb7e56259564306ddc_399_0.png)


    图 16.23. RobotBoy 角色的默认参数


    ![](img/41d82527c4e41cdb7e56259564306ddc_399_1.png)


