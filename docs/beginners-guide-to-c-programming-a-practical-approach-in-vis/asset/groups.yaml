    \n## 11.6. 向方法传递数组\n\n当编程时参数（输入）的数量未知时，这些参数将以数组的形式传递。关键字 `params` 用于此操作。让我们在一个简单的项目中使用这个特性。我们将声明一个乘法方法，它将乘以用户输入的任何数量的数字。\n\
    \n- 1. 创建一个新的 C# 项目。\n- 2. 向项目添加一个 TextBox 和一个 Button。\n- 3. 将 TextBox 的 Name\
