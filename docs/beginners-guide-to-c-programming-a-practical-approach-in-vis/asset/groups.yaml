    That's all about arrays and collections for now; we will use these data structures\
    \ in our upcoming projects. In the next chapter, we will see how we can shorten\
    \ our programs by using repeating code in methods.\n\n## 11.2. Accessibility Modifiers\n\
    \nAs we have stated above, the place where a method can be called is specified\
    \ by its accessibility modifier. An accessibility modifier can take one of the\
    \ following values:\n\n- 1. **The private keyword**: If the method's accessibility\
    \ modifier is set as private, then this method can only be available for calling\
    \ from the class it belongs to. For example, if the method is declared inside\
    \ a Click event handler, it can only be called inside this event handler and cannot\
    \ be called from another method such as Form's default Load event handler.\n-\
    \ 2. **The public keyword**: In this case, the method can be called from anywhere\
    \ in the program.\n- 3. **The protected keyword**: If the method's accessibility\
    \ specifier is protected, then this method can also be called from the child classes\
    \ (derived classes, sub classes) of its own class.\n- 4. **The internal keyword**:\
    \ In this case, this method can be called from its own assembly, i.e. the .exe\
    \ or .dll file.\n\n## 11.3. Value Returning Method Example\n\nLet's declare a\
