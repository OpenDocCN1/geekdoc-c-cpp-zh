    强烈建议从本书网站 www.yamaclis.com/csharp 下载本章的彩色图并配合这些图阅读本章。因为印刷版的黑白图不易跟随；有些对象根本看不到。抱歉，但我不得不将本书印成黑白以提供合理的价格标签。


    ### 16.3. 向项目添加资源


    Unity 为我们在游戏中提供现成的资源。我们可以使用它们或创建自己的资源。对于我们的平台游戏，最好添加提供的免费 2D 资源，然后按需对其进行操作。为此，点击
    Assets → Import Package → 2D，如下所示：


    ![](img/41d82527c4e41cdb7e56259564306ddc_394_1.png)


    图 16.16. 导入 2D 资源


    将显示一个用于选择导入资源的对话框。默认情况下所有资源都被选中。点击 **导入** 按钮将这些资源导入到我们的项目中：


    ![](img/41d82527c4e41cdb7e56259564306ddc_395_0.png)


    图 16.17. 导入所有 2D 资源


    导入的资源将被放置在 **标准资源** 文件夹中并显示在项目浏览器中：


    ![](img/41d82527c4e41cdb7e56259564306ddc_395_1.png)


    图 16.18. 标准资源文件夹中的资源


    我们可以通过点击圆圈内指示的 Play 按钮来测试项目。Game 视图将出现，我们的角色会迅速从视图中掉落：


    ![](img/41d82527c4e41cdb7e56259564306ddc_398_0.png)


    图 16.22. 游戏视图


    当我们点击 Play 按钮时，我们的项目将被构建，并且 Game 视图（椭圆内显示的标签）将显示在中间窗格中。默认情况下，重力作用于我们的角色，因此他立即掉落。这是因为此角色来自标准资源，被定义为
    **刚体 2D**，其默认的 **重力缩放** 为 3。我们可以通过选择角色并打开右侧窗格中的 **检视器** 标签来查看和更改它，如图 16.23 所示。


    我们可以通过检视器查看/更改游戏对象的全部属性。例如，如果我们将 RoboBoy 的重力缩放更改为 0，那么再次运行游戏时它将保持在原地，如图 16.24
    和 16.25 所示。


