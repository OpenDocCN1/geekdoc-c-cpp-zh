    # 5.21. WebBrowser


    WebBrowser control enables to display web pages in an application. It has the
    following frequently used properties and methods:


    +   - **Url**: Returns the address of the currently displayed web page.

    +   - **ScrollBarsEnabled**: Sets if the scrollbars will be visible by default.

    +   - **GoBack()**: Navigates to the previous web page.

    +   - **GoForward()**: Navigates to the next web page.

    +   - **Navigate()**: Loads the web page at the specified address.

    +   - **Stop()**: Stops loading the webpage.

    +   - **GoHome()**: Navigates to the home page.


