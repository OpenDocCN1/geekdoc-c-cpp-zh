    \ 左侧窗格中显示的Table1\n\n- 7. 双击Table1打开其内容。由于我们尚未向此表添加任何数据，它将显示为空：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_357_0.png)\n\
    \n图15.12 空表\n\n- 8. 我们可以像在Excel中一样在表的列中添加/删除数据。让我们向这张表添加一些随机数据：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_357_1.png)\n\
