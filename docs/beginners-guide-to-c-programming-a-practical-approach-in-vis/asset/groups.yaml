    # 5.8. ListBox


    ListBox displays a list of items. It is used to display items to the user and
    let the user to select items from. Items can be added to the ListBox visually
    during the development or programmatically during runtime.


    Commonly used properties and methods of ListBoxes are as follows:


    > We have mentioned **methods** several times until this point. As you may have
    noticed, they are used to perform a function. Please note that methods are used
    with parentheses next to them as shown below.


    +   - **Items**: Used for accessing the items in a ListBox.

    +   - **Add()**: Used for adding new items.

    +   - **Remove()**: Removes an item.

    +   - **SelectedItem**: Returns the name of the selected item.

    +   - **SelectedIndex**: Returns the index of the selected item.

    +   - **Count**: Returns the number of the items in the ListBox.

    +   - **Clear()**: Removes all items from the ListBox.


    Let''s develop a project that includes a ListBox. We''ll use Buttons to add/remove
    items to the ListBox and to show the user-selected item in a message box.


    +   1. Create a new C# project in Visual Studio.

    +   2. Place a ListBox and three Buttons on the form as shown in Figure 5.37.


    ![](img/41d82527c4e41cdb7e56259564306ddc_84_0.png)


    Figure 5.37. Layout of the form'
