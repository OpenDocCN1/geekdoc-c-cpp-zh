    where an integer number will be stored and this number will be referred as a in
    the program later”. The compiler allocates the space with this line, in other
    words the variable a is created. However it is still empty. If we try to use this
    variable in our program, the program will shout at us, sorry it will give an error
    saying that the variable a is declared but not assigned a value. The values of
    variables are assigned using the = operator. Yes, it is the usual equal sign but
    having a stylish name in C#: assignment operator. We can assign the number 3 to
    the variable a as follows:


    ```

    a=3;

    Code 7.2

    ```


    A value can also be assigned during the declaration. This is called as the initialization
    of the variable:


    ```

    int a=3;

    Code 7.3

    ```


    Therefore, this code line does the same job as the combination of Code 7.1 and
    7.2: declaring an integer variable a and assigning 3 to this variable.


    We can declare multiple variables of the same type in a single line as follows:


    ```

    int a, b, c;

    Code 7.4

    ```


    We have declared three integer variables a, b and c using commas between them.
    Similarly, we can also initialize these variables in a single line:


    ```

    int a=3, b=4, c=8;

