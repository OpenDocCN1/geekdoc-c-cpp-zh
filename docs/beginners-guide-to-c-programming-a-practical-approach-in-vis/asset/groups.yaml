    \ EventArgs e)\n{\n    changeFlowLayoutPanel.FlowDirection = FlowDirection.TopDown;\n\
    }\n```\n\n![](img/41d82527c4e41cdb7e56259564306ddc_186_0.png)\n\n图 6.76. 点击 TopDown\
