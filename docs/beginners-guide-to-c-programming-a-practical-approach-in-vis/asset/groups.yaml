    \ int number2)\n```\n\nCode 11.2\n\nSince the method will output an integer value,\
    \ its return type is set as int just after the public keyword. Then write the\
    \ name of the method: FindGreater. After the name, the parameters (inputs) of\
    \ the method are declared, number1 and number2, which are both integer type variables.\
    \ We’ll write the contents of the method inside curly brackets to form the method\
    \ body:\n\n```csharp\npublic int FindGreater(int number1, int number2)\n{\n  \
