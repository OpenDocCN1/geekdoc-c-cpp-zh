    Please click the Save button. We have now created our sample database and added
    some data into it in Access itself. It is now time to connect to this database
    from our own C# program.


    # 15.2. Reading Database Entries from our C# Program


    Our programs can connect to Access databases via Access Database Engine. If you
    have an Office suite newer than 2007, Access Database Engine is already installed
    on your computer. If not, you can download this tool from https://www.microsoft.com/en-us/download/details.aspx?id=13255
    (or just Google for "Access Database Engine") and install on your PC.


    Databases are accessed using database commands from C# .NET programs. Firstly,
    a connection to the database is opened. Then, a read or write operation is performed
    on the database table using database commands. After finishing our job with the
    database, the connection is closed.


    We can use the following objects for accessing and manipulating Access databases:


    +   - **OleDBConnection**: Used for opening or closing a connection to the database.
    Its constructor method accepts the path to the file and the connection string
    regarding to the database type.

    +   - **OleDBCommand**: Used for sending queries to the database for selecting
    and manipulating data.

    +   - **DataReader**: Used for reading data from the database. It is used in conjunction
    with the OleDBCommand object.

    +   - **OleDBDataAdapter**: Transfers data to a DataSet object.

    +   - **DataSet**: Temporarily stores the data for displaying and manipulating
    purposes.


    Let’s see how we can connect to our firstDatabase.accdb using these objects in
    a typical example.


    +   1. Create a new C# project.

    +   2. Add two Buttons and a ListBox on the form.'
