    # 5.16. RadioButton


    RadioButtons are used for selecting among different options.


    > RadioButtons are similar to CheckBoxes however only one RadioButton can be selected
    in a form or group at a time.


    The frequently used properties of RadioButtons are as follows:


    +   - **Checked:** Sets if the RadioButton will be checked initially.

    +   - **AutoCheck:** Sets if the RadioButton will automatically be selected when
    clicked.

    +   - **Enabled:** Sets if the RadioButton will be available for checking.


    The following simple example demonstrates the usage of RadioButtons in a project.
    The user will select the background colour of the form using RadioButtons. Since
    it is not possible to set the background colour to multiple colours at the same
    time, it is meaningful to use RadioButtons for this example.


    +   1. Create a new C# project in Visual Studio.

    +   2. Add five RadioButtons on the form as shown below:'
