    \        i++;\n    }\n}\n```\n\n代码 9.25（续）\n\n- 2. 让我们使用 continue 关键字在循环变量为 3\
    \ 时跳到开头：\n\n```csharp\nprivate void populateButton_Click(object sender, EventArgs\
    \ e)\n{\n    int stopValueInt = Convert.ToInt32(stopValue.Text);\n    int i =\
    \ 0;\n    while (i <= stopValueInt)\n    {\n        if (i==3)\n        {\n   \
    \         continue;\n        }\n        numbersComboBox.Items.Add(i);\n      \
    \  i++;\n    }\n}\n```\n\n代码 9.26\n\n- 3. 构建并运行项目。在 TextBox 中输入一个大于 3 的数字，例如 10，然后单击\
    \ Populate 按钮。你会注意到程序停止响应，因为出现了无限循环！：\n\nStops responding...\n\n![](img/41d82527c4e41cdb7e56259564306ddc_249_0.png)\n\
    \n图 9.14. 程序处于无限循环中\n\n我们无法通过单击其右上角的关闭按钮退出程序，因为形成了一个无限循环。我们可以从 Windows 的任务管理器中关闭程序，或单击\
    \ Visual Studio 中的停止按钮：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_250_0.png)\n\
    \n图 9.15. 在无限循环中停止程序\n\n### 为什么程序会进入无限循环？\n\n当 i=3 时，if 条件得到满足并执行 continue 命令。程序跳到循环开始处，i=3，if\
    \ 条件再次以 i=3 得到满足，continue 关键字再次执行，将程序跳回循环开始处，i=3... 此过程反复进行导致无限循环。我们只需在 if 块内在\
    \ continue 命令之前更新循环变量即可消除此编程错误，如下所示\n\n```csharp\nprivate void populateButton_Click(object\
    \ sender, EventArgs e)\n{\n    int stopValueInt = Convert.ToInt32(stopValue.Text);\n\
    \    int i = 0;\n    while (i <= stopValueInt)\n    {\n        if (i==3)\n   \
    \     {\n            i++;\n            continue;\n        }\n        numbersComboBox.Items.Add(i);\n\
    \        i++;\n    }\n}\n```\n\n代码 9.27（续）\n\n经过此修改后，我们可以运行程序，它工作正常。当 i=3 时，if\
    \ 语句的条件得到满足，循环变量增加到 4，然后程序跳到循环开始处，使用此新的循环变量值。值 3 没有添加到 ComboBox，因为程序在 i=3 时跳到循环开始处，而没有执行\
    \ if 语句下面的代码行：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_251_0.png)\n\n如果我们将此程序中的\
