    \n图 7.3. 使用 Convert.ToDouble() 方法的乘法程序\n\n### 7.1.5.2. 其他类型到字符串\n\n正如我们在乘法程序中所使用的，ToString()\
    \ 方法可以轻松地将数值数据类型转换为字符串。我们按如下方式对要转换的变量应用此方法：\n\n```\nint myInteger = 3;\noutputTextBox.Text\
    \ = myInteger.ToString();\n```\n\n代码 7.36\n\n在第一行，我们声明了一个整数变量 myInteger 并将其初始化为\
    \ 3。在第二行，ToString() 方法应用于此变量以将其转换为字符串，然后将其分配为 outputTextBox 的 Text。\n\n### 7.2.\
    \ 常量\n\n常量是仅分配一次值的数据类型。常量在声明时初始化。我们可以把它们看作特殊的“非变化”变量，其值在代码中保持不变。它们是通过在变量声明前使用\
    \ const 关键字来声明的，如下所示：\n\n```\nconst variable_type variable_name = initial_value;\n\
    ```\n\n代码 7.37\n\n让我们在一个小型项目中使用常量，我们将在其中计算圆的面积。我们将在全局区域中将 pi 数字定义为常量，并在按钮的事件处理程序中使用它：\n\
    \n- 1. 创建一个 C# 项目。\n- 2. 在窗体上添加一个 TextBox，我们将在其中输入圆的半径。将其 Name 和 Text 分别设置为 radiusInput\
    \ 和 Enter radius here...。\n- 3. 在 radiusInput TextBox 下方添加一个 Button。将其 Name 和\
    \ Text 分别设置为 calculateButton 和 Calculate the area。\n- 4. 在按钮下方添加另一个 TextBox，我们将在其中显示面积。将其\
    \ Name 和 Text 分别设置为 areaTextBox 和 Area appears here...。窗体将如下图 7.4 所示。\n\n![](img/41d82527c4e41cdb7e56259564306ddc_204_0.png)\n\
    \n图 7.4. 表单的布局\n\n- 5. 双击按钮以创建其 Click 事件处理程序。Form1.cs 文件将如下所示：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_204_1.png)\n\
    \n图 7.5. Form1.cs 文件中的全局区域\n\n- 6. 我们通常在方法内部创建和使用变量和常量。但是，如果我们计划在各种方法内部使用相同的变量或常量，我们需要在图\
    \ 7.5 所示的全局区域中定义它。由于 pi 数字是一个常量，将其声明在全局区域中是良好的做法。由于它将作为常量而不是变量定义，因此不会因编程错误而在方法内部意外更改它的风险。我们可以按如下方式将其定义为常量\
    \ double：\n\n```csharp\nconst double pi = 3.14;\n```\n\n代码 7.38\n\n- 7. 让我们在 calculateButton_Click\
    \ 处理程序方法中实现公式 Area=pi*radius²：\n\n```csharp\nprivate void calculateButton_Click(object\
    \ sender, EventArgs e)\n{\n    double radius = Convert.ToDouble(radiusInput.Text);\n\
    \    areaTextBox.Text = (pi * radius * radius).ToString();\n}\n```\n\n代码 7.39\n\
    \n在第一行，我们将 radiusInput TextBox 的 Text 转换为 double 类型并将其分配给名为 radius 的 double 类型变量。在第二行，根据上述公式计算面积，将其转换为字符串并分配为\
    \ areaTextBox 的 Text。\n\n请注意，pi 数字已在全局区域中声明，因此我们不需要在此方法内部声明 pi 数字。完整的 Form1.cs\
    \ 文件如下所示：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing\
    \ System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\
    \nnamespace Calculate_area\n{\npublic partial class Form1 : Form\n{\n    public\
    \ Form1()\n    {\n        InitializeComponent();\n    }\n    const double pi =\
    \ 3.14;\n    private void calculateButton_Click(object sender, EventArgs e)\n\
    \    {\n        double radius = Convert.ToDouble(radiusInput.Text);\n        areaTextBox.Text\
    \ = (pi * radius * radius).ToString();\n    }\n}\n}\n```\n\n代码 7.40（续）\n\n- 8.\
