    \n图 5.14. 带有我们输入条目的 CheckedListBox\n\n表达式 pcCheckedListBox.SelectedItem.ToString()\
    \ 表示“获取 pcCheckedListBox 控件中选中项的 Text，并将其转换为字符串格式”。因此，当我们从 CheckedListBox 中选择一个条目时，它的文本将显示在消息框中。\n\
    \n现在我们可以生成并运行程序。它将如下所示：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_71_0.png)\n\
    \n图 5.16. 用于演示 CheckedListBox 的示例程序\n\n当我们单击其中一个条目时，例如 C# programming 条目，将出现如下消息框：\n\
    \n![](img/41d82527c4e41cdb7e56259564306ddc_71_1.png)\n\n图 5.17. 显示我们在 CheckedListBox\
    \ 中所单击条目的消息框\n\n该消息框只有一个“确定”按钮，单击此按钮后，消息框就会消失。消息框是一种**对话框**，稍后我们会更详细地研究。\n\n你可能已经注意到，单击条目时，它并没有被勾选。这是因为对于\
    \ CheckedListBox，**CheckOnClick** 属性的默认值为 False。我们可以按如下方式将该属性设置为 True：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_72_0.png)\n\
    \n图 5.18. 将 CheckOnClick 属性设置为 True\n\n如果我们再次生成并运行程序，当我们单击条目时，条目将被勾选，同时会弹出消息框，如图\
    \ 5.19 所示。\n\n与 CheckBox 的情况一样，一个窗体可以包含多个可独立选择的 CheckedListBox。\n\n6. 双击 ComboBox\
    \ 控件，创建其默认事件处理程序 SelectedIndexChanged()，当用户更改所选条目时，会执行该事件处理程序。\n\n7. 将以下代码添加到\
    \ genderComboBox_SelectedIndexChanged() 方法体（大括号之间的部分）中，以显示一个消息框：`MessageBox.Show(genderComboBox.SelectedItem.ToString());`，如下所示：\n\
    \n```\nprivate void genderComboBox_SelectedIndexChanged(object sender, EventArgs\
    \ e)\n{\n    MessageBox.Show(genderComboBox.SelectedItem.ToString());\n}\n```\n\
    \n代码 5.5\n\n8. 现在我们可以生成并运行项目：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_75_0.png)\n\
    \n图 5.23. ComboBox 示例\n\n当我们从 ComboBox 中选择一个值时，它会显示在消息框中，如图 5.24 所示。\n\n我们可以通过\
    \ ComboBox 的 DropDownStyle 属性来设置用户是否可以向 ComboBox 输入新值。如果将此属性设置为 Simple，则允许向 ComboBox\
    \ 输入额外值。此外，我们还可以通过 Add() 和 Remove() 方法以编程方式向 ComboBox 添加或删除条目。\n\n"
