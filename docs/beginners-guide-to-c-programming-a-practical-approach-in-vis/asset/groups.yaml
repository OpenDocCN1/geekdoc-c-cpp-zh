    # 8.1.2. Arithmetic Operators


    Arithmetic operators operate on numeric operands and produce numeric results.
    Below are the frequently used arithmetic operators in C#:


    Table 8.2. Arithmetic operators


    | Operator | Operation |

    |---|---|

    | + | Adds its operands |

    | - | Subtracts its second operand from the first one |

    | * | Multiplies its operands |

    | / | Divides its first operand by the second one |

    | % | The mod operator: gives the remainder when the first operand is divided
    by the second one |


    > Usual mathematical operation precedence rules apply: * and / are the first operations
    to be carried where + and - are the second in order. We can change the operation
    order using parentheses easily as we do in usual arithmetic operations.


    Let''s build a simple calculator to show the utilization of these operators in
    a project:


    +   1. Create a C# project.

    +   2. Add two TextBoxes where the user will enter numbers. Set their Names as
    **input1TextBox** and **input2TextBox**.

    +   3. Add five buttons which will perform the arithmetic operations when clicked.
    Set their Text properties as +, -, *, / and %. Set their Names as **addButton**,
    **subtractButton**, **multiplyButton**, **divideButton** and **modButton**, respectively.

    +   4. Add another TextBox which will show the result. Set its name as **resultTextBox**.
    The form layout may look similar to the one shown in Figure 8.5.

    +   5. Double-click the buttons to create their event handlers.

    +   6. We''ll firstly write the code for the addButton''s Click event handler.
    First of all, we''ll convert the Text inputs of **input1TextBox** and **input2TextBox**
    to double type variables as we did in the previous example and add these variables
    to produce the adding result. Then display this result in the **resultTextBox**
    after converting to string by the **toString()** method. These code lines are
    shown in the event handler shown in Code 8.8.'
