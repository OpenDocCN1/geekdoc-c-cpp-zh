    ![](img/41d82527c4e41cdb7e56259564306ddc_344_0.png)\n\nFigure 14.4. The exception\
    \ (error) caught and displayed\n\nNote that the program continues running normally\
    \ after an error is caught. New numbers can be entered for multiplication.\n\n\
    ## 14.2. The Try-Catch-Finally Structure\n\nIn the try-catch-finally statements,\
    \ there is a finally block in addition to the try and catch blocks. The code inside\
    \ the finally block executes regardless of the error. In other words, the code\
    \ lines in the finally block runs in both error-free or erroneous execution cases\
    \ of our main code written inside the try block. The template of the try-catch-finally\
    \ block is as follows:\n\n```\ntry\n{\n    //Code with possible error source\n\
    }\ncatch (Exception)\n{\n    //Code to be executed when an error occurs above\n\
    }\nfinally\n{\n    //Code to be executed regardless of the error\n}\n```\n\n>\
    \ The try-catch-finally statements are used in cases where we have code lines\
    \ to execute in the end of the program independent of errors. These cases include\
    \ closing databases or closing opened files.\n\nLet's modify our try-catch example\
    \ and add the finally statement as follows:\n\n```\nprivate void multiplyButton_Click(object\
    \ sender,\nEventArgs e)\n{\n    try\n    {\n        int inputNum = Convert.ToInt32(input.Text);\n\
    \        int result = 2 * inputNum;\n        output.Text = result.ToString();\n\
    \    }\n    catch (Exception exceptionObject)\n    {\n        MessageBox.Show(exceptionObject.ToString());\n\
    \    }\n    finally\n    {\n        input.Clear();\n        output.Clear();\n\
    \        MessageBox.Show(\"TextBoxes are cleared.\");\n    }\n}\n```\n\nCode 14.5\n\
