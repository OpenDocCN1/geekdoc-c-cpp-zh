  - "[PAGE 222]\n\n# 8.2. If-Else Statement Types\n\nCode lines execute from top to\
    \ down in a C# program. However, it is sometimes needed that the program to skip\
    \ some code lines or jump to specific lines depending on the states of the variables\
    \ or inputs. For example, imagine that the user will need to enter a username\
    \ and a password to access a database in a program. When the user enters his/her\
    \ username and password and clicks the Login button, the program will compare\
    \ the entered username/password against the ones in its own records. If the username/password\
    \ combination is correct then it will display the database to the user. Else,\
    \ the program will display an error message and will tell the user to try again.\
    \ We do these comparison and branching operations using two types of statements\
    \ in C#: if-else and switch-case.\n\nIn this subsection, we will learn how if-else\
    \ structures are used for condition checking and branching. If-else statements\
    \ have three variants: if, if-else and if-elseif-else.\n\n# 8.2.1. The If Statement\n\
    \nThe if statement is used for checking if a condition is satisfied. If the condition\
    \ is met, then the code lines inside the if block are executed:\n\n```\nif(condition)\n\
    {\n    Here is the if block between the curly brackets. The code written here\
    \ is executed if the condition is satisfied.\n}\nCode 8.14\n```\n\nLet’s use an\
    \ if statement in an example where the user will enter a username and a password.\
    \ Our program will check if they are valid:\n\n+   1. Create a C# project.\n+\
