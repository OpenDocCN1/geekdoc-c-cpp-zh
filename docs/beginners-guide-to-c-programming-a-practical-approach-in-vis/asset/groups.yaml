    \n图 7.7. 面积计算成功\n\n目前关于变量和常量的内容就这些。我们将在下一章学习条件语句，它们用于分支。\n\n## 第 8 章\n\n![](img/41d82527c4e41cdb7e56259564306ddc_208_0.png)\n\
    \n### 条件语句\n\n条件语句使程序能够根据给定条件进行分支。在学习实际的条件语句和关键字之前，最好先概述在条件语句中使用的运算符\n\n### 8.1.\
    \ 运算符\n\n运算符对操作数进行操作，操作数存在于操作数的左侧和右侧。事实上，我们在之前的章节中进行加法和乘法时就已经使用了操作数。那些是算术运算符。C#\
    \ 是一种灵活的语言，提供比较、算术和增量/减量类别的运算符。\n\n### 8.1.1. 比较运算符\n\n逻辑运算符比较其两个操作数并生成逻辑结果。由于逻辑结果只能为\
    \ true 或 false，因此逻辑运算符的结果始终是布尔类型变量。C# 中的比较运算符显示在下表中：\n\n| 运算符 | 比较 |\n|---|---|\n\
    | == | 检查其操作数是否相等 |\n| != | 检查其操作数是否不相等 |\n| > | 检查第一个操作数是否大于第二个操作数 |\n| < | 检查第一个操作数是否小于第二个操作数\
    \ |\n| >= | 检查第一个操作数是否大于或等于第二个操作数 |\n| <= | 检查第一个操作数是否小于或等于第二个操作数 |\n\n表 8.1.\
    \ 比较运算符\n\n- 6. 我们将从上面创建的每个事件处理程序中的 TextBoxes 读取输入并将其转换为数值类型变量。考虑到用户可能输入小数，将其转换为\
    \ double 类型更好：\n\n```\ndouble input1 = Convert.ToDouble(input1TextBox.Text);\n\
    double input2 = Convert.ToDouble(input2TextBox.Text);\n```\n\n代码 8.2\n\n- 7. 我们将在\
