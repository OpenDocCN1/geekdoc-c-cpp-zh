  mdcn: "\n我们将创建一个新的方形精灵来构成地面精灵。为此，请点击 **Project** 选项卡正下方的 **创建** 按钮：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_414_0.png)\n\
    \n图 16.55. 创建菜单\n\n然后，从创建菜单中选择 **精灵 → 方形**：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_414_1.png)\n\
    \n图 16.56. 创建一个方形精灵\n\n新的方形精灵将被添加到当前项目文件夹中。如图 16.57 所示，将其重命名为 ground。然后，如图 16.58\
    \ 所示，将其拖放到场景中平台的下方。\n\n![](img/41d82527c4e41cdb7e56259564306ddc_415_0.png)\n\n\
    图 16.57. 新添加的精灵被重命名为 ground\n\n![](img/41d82527c4e41cdb7e56259564306ddc_415_1.png)\n\
    \n图 16.58. 将地面精灵添加到场景中\n\n现在，通过拖动边缘来拉伸 ground 精灵，使其覆盖场景底部，如图 16.59 中矩形内所示。\n\n\
    现在，我们将为 ground 精灵添加一个标签。如果尚未选中 ground 精灵，请将其选中，然后像我们在第 410 页所做的那样，从检查器中找到标签菜单。添加一个名为\
    \ ground 的新标签，然后将 ground 精灵的标签设置为 ground，如图 16.60 所示。请记住，我们需要标签才能从 C# 代码中访问这些对象。\n\
    \nground 精灵默认显示为白色。让我们将其颜色改为红色，以区别于普通平台。我们可以从检查器窗格的 Sprite Renderer 部分更改其颜色。点击\
    \ Color 属性以打开颜色选择对话框：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_417_0.png)\n\
    \n图 16.62. 将 ground 的颜色设置为红色\n\n现在，我们将放置终点精灵（终点旗）。当 RobotBoy 触碰到该精灵时，关卡将被完成。像创建\
    \ ground 一样创建一个方形精灵，并将其命名为 finish。将它放在场景的末端：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_417_1.png)\n\
    \n图 16.63. 添加终点精灵\n\n通过拖动其边缘使其更长，并将其颜色设置为绿色：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_418_0.png)\n\
    \n图 16.64. 将 finish 精灵拉长并将其颜色设置为绿色\n\n最后，像之前一样在检查器中添加一个名为 finish 的新标签，并将 finish\
    \ 精灵的标签设置为 finish：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_418_1.png)\n\n\
    图 16.65. 设置 finish 精灵的标签\n\n不要忘记为 finish 精灵添加 Box Collider 2D 组件，以便我们的 RobotBoy\
    \ 能够与它碰撞。\n\n现在我们可以测试我们这款简单平台游戏的视觉界面了。当 RobotBoy 撞到红色怪物或黄色金币时，它们会以有趣的方式散开。然而，我们的目标是避开怪物并收集金币。当\
    \ RobotBoy 碰到怪物时，怪物将消失，并且分数将随机减少。类似地，当他收集到一枚金币时，金币将消失，并且分数将随机增加。此外，当 RobotBoy\
    \ 掉落在红色地面上时，关卡将重新开始。我们将使用我们的 C# 技能来实现这个逻辑。\n\n## 16.4. 使用 C# 实现游戏逻辑\n\n我们将在 Unity\
    \ 中使用 C# 来实现游戏逻辑。幸运的是，Unity 为此提供了各种有用的类和方法。当我们考虑游戏的目标和逻辑时，很容易看出游戏玩法实际上将基于触碰（碰撞）：\n\
    \n-   如果我们的主角 RobotBoy **与怪物碰撞**，分数将减少，怪物将消失。\n-   如果 RobotBoy **与金币碰撞**，分数将增加，金币将消失。\n\
    -   如果 RobotBoy **与红色地面精灵碰撞**，关卡将重新开始。\n-   如果 RobotBoy **与绿色终点精灵碰撞**，关卡将被完成。\n\
    \n正如你可能已经猜到的那样，我们将使用几个条件语句（if-else 或 switch-case 结构）来检查这些碰撞。\n\n现在，我们将为项目创建一个新的\
    \ C# 文件，并在此文件中编写必要的碰撞检测代码。为此，请点击项目窗格中的 **创建** 按钮：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_419_0.png)\n\
    \n图 16.66. 项目窗格中的创建按钮\n\n然后，从菜单中选择 **C# 脚本**：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_419_1.png)\n\
    \n图 16.67. 创建一个新的 C# 脚本\n\n将新 C# 文件命名为 GameScript：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_420_0.png)\n\
    \n图 16.68. 新的 C# 文件命名为 GameScript\n\n现在，在项目资源管理器中双击打开这个 C# 文件。你会看到它已在 Visual Studio\
    \ 中打开：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_420_1.png)\n\n图 16.69. GameScript.cs\
    \ 已在 Visual Studio 中打开\n\n> 请注意，我们不会在 Visual Studio 中构建项目；我们将使用 Visual Studio\
    \ 作为编辑器来编写和管理 C# 代码。游戏项目将在 Unity 中构建。\n\n如上图所示，GameScript.cs 文件默认包含两个方法：Start()\
    \ 和 Update()。我们可以在需要时在这些方法内部编写有关初始化和更新操作的代码。\n\nUnity 中有一些用于实现游戏机制的特殊方法。其中之一是\
    \ OnCollisionEnter2D 方法，当游戏过程中发生碰撞时，它会自动被调用。现在，让我们在 Update() 方法下方实现这个方法。当我们让 Visual\
    \ Studio 自动补全 OnCollisionEnter2D 方法时，它还会将其参数添加为 (Collision2D collision)：\n\n```csharp\n\
    using System.Collections;\nusing System.Collections.Generic;\nusing UnityEngine;\n\
    \npublic class GameScript : MonoBehaviour {\n\n    // Use this for initialization\n\
    \    void Start () {\n    }\n\n    // Update is called once per frame\n    void\
    \ Update () {\n    }\n\n    void OnCollisionEnter2D(Collision2D collision)\n \
    \   {\n        // Collision code will be written here\n    }\n}\n```\n\n代码 16.1\n\
    \n我们需要声明一个变量来保存分数。我们可以将此声明放在新方法之前，以便在需要时可以从其他方法访问它：\n\n```csharp\nusing System.Collections;\n\
    using System.Collections.Generic;\nusing UnityEngine;\n\npublic class GameScript\
    \ : MonoBehaviour {\n\n    // Use this for initialization\n    void Start () {\n\
    \    }\n\n    // Update is called once per frame\n    void Update () {\n    }\n\
    ```\n\n需要检查。为此，将 GameScript.cs 从项目资源管理器拖放到层级窗格中的 CharacterRobotBoy 上：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_423_0.png)\n\
    \n图 16.70. 将 GameScript.cs 附加到 RobotBoy\n\n我们现在已经准备好测试我们的代码了。首先，点击项目窗格中“创建”按钮旁边的“控制台”选项卡，打开控制台。通过\
    \ print(score) 代码行，我们将在控制台窗口中看到收集金币时更新的分数：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_423_1.png)\n\
    \n图 16.71. 在 Unity 中打开控制台\n\n现在，点击 Unity 中的“播放”按钮，开始在此阶段测试我们的游戏。当你收集金币时，你会看到控制台中显示的分数将随机增加，并且被收集的金币将消失：\n\
    \n![](img/41d82527c4e41cdb7e56259564306ddc_424_0.png)\n\n图 16.72. RobotBoy 收集金币时分数随机增加\n\
    \n类似地，当 RobotBoy 与红色怪物碰撞时，我们将减少分数。我们将检查标签，看看它是否是 red_monster，并且分数将随机减少 1 到 10\
    \ 之间的一个数字：\n\n```csharp\nif (objectTag == \"red_monster\")\n{\n    int randomDecrement\
    \ = UnityEngine.Random.Range(1, 10);\n    score = score - randomDecrement;\n \
    \   print(score);\n    Destroy(collision.collider.gameObject);\n}\n```\n\n代码 16.5\n\
    \n在我们的 GameScript.cs 文件中添加这些条件语句后，点击“播放”按钮重新启动游戏。不要忘记打开“控制台”选项卡。当 RobotBoy 碰到怪物时，分数将随机减少\
    \ 1 到 10 之间的数量。\n"
