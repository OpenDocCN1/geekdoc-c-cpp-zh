    ## 第 16 章


    ![](img/41d82527c4e41cdb7e56259564306ddc_386_0.png)


    ## 使用 C# 在 Unity 中开发 2D 游戏


    我们现在已经具备了开发各种程序的 C# 背景。我们将在本章中投入我们的知识和精力来开发一个平台游戏。


    游戏是最受欢迎的应用之一。一旦玩家对游戏上瘾，游戏开发者就能赚到好钱。然而，开发游戏并不是一项简单的任务，因为一个好的游戏应该有一个激动人心的故事、良好的图形、逼真的物理规则以及将所有这些粘合在一起的高效代码。幸运的是，游戏开发框架使这项任务变得更容易。有许多使用各种编程语言的游戏开发工具。Unity
    是最受欢迎的游戏开发工具之一，我们可以在其中使用 C# 编程。Unity 让我们可以开发 2 维（2D）和 3 维（3D）游戏。我们将在本章中使用 Unity
    和 C# 开发一个简单的 2D 平台游戏。


    我们将要开发的游戏的名字是 **Random Platformer**。想法很简单：主角将在平台上行走。他将在尝试完成关卡的同时收集 **黄色硬币** 并避开
    **红色怪物**。当他收集到一枚硬币时，该物品会消失并且 **分数将增加一个介于 0 和 5 之间的随机数**。当用户不小心触碰到怪物时，分数将 **减少一个介于
    0 和 10 之间的数字**。正如你可能猜到的那样，我们将使用 C# 中著名的 Random 类来生成这些随机的分数增量或减量。当角色从平台上掉落时，关卡将重新开始，分数重置。


    ### 16.1. 下载和安装 Unity


    首先，我们需要下载和安装 Unity。为此，请导航到他们的官方网站 https://store.unity.com。你将看到以下选项：


    ![](img/41d82527c4e41cdb7e56259564306ddc_387_0.png)


    图 16.1. Unity 下载选项


    由于我们是初学者，选择个人版是可以的。因此，点击 Try Personal 链接导航到以下页面：


    ![](img/41d82527c4e41cdb7e56259564306ddc_387_1.png)


    图 16.2. 安装程序的下载页面


    点击 Download Installer 链接下载将管理安装的小程序。名为 UnityDownloadAssistant-5.6.1f1.exe 的可执行文件将被下载（请注意，随着你阅读本文，文件名可能已更改）。在计算机上下载后点击此可执行文件。下载助手将被启动：


    ![](img/41d82527c4e41cdb7e56259564306ddc_388_0.png)


    图 16.3. Unity 下载助手


    当你点击 Next 时，安装程序将连接到他们的服务器并显示最新的许可协议。如果你接受协议条款，请勾选相应的框并点击 Next：


    ![](img/41d82527c4e41cdb7e56259564306ddc_388_1.png)


    图 16.4. 许可协议窗口


    选择 64 位选项并点击 Next：


    development. 当然，如果你想将游戏安装到手机或平板电脑上，你也可以安装对移动平台的支持。安装程序显示下载量为 2.5GB，具体等待时间取决于你的连接速度。点击
    Next 选择安装路径：


    ![](img/41d82527c4e41cdb7e56259564306ddc_390_0.png)


