    \n图 9.11. 程序窗口\n\n当我们输入一个大于 2 的数字并单击 Populate 按钮时，ComboBox 将从 2 填充到该数字：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_247_1.png)\n\
    \n图 9.12. 由值填充的 ComboBox\n\n程序的操作与在 TextBox 中输入大于或等于 2 的 while 循环示例相同。但是，如果我们输入一个小于\
    \ 2 的数字，例如 2，则 do-while 循环的差异就会显现出来：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_248_0.png)\n\
    \n图 9.13. 输入数字为 1 时程序的输出\n\n根据循环条件 i <= stopValueInt，循环条件从未得到满足（开始时 i=2 且 stopValueInt=1）。然而，由于\
    \ do-while 块中的代码行在检查此条件之前执行一次，因此 ComboBox 被 2 填充，代码行 numbersComboBox.Items.Add(i);\
    \ 中的 i=2 为循环变量的起始值。\n\n## 9.5. Break 和 Continue 关键字\n\n我们已在条件语句中使用过 break 关键字。它也可以以相同的方式用于循环中。当\
    \ break 关键字在循环块内部执行时，循环立即结束，即 break 关键字中断循环。\n\n循环中还有另一个关键字：continue。continue\
    \ 关键字的工作与 break 关键字类似。它停止当前循环块的执行并跳到循环开始处。break 和 continue 关键字都与循环中的条件语句一起使用。\n\
    \n让我们在我们的 while 循环示例中使用这些关键字。\n\n- 1. 打开 while 循环项目并找到 populateButton_Click(...)\
    \ 方法，如代码 9.25 所示。\n\n```csharp\nprivate void populateButton_Click(object sender,\
    \ EventArgs e)\n{\n    int stopValueInt = Convert.ToInt32(stopValue.Text);\n \
