    # ARRAYS AND COLLECTIONS


    Arrays are data structures which are used for holding multiple data of the same
    type while collections enable to store different type variables together.


    # 10.1. Arrays


    Arrays make our lives easier by enabling to save same type data in a list format
    so that we can access them easily using an index. We can imagine the structure
    of an array as follows:


    | Index | 0 | 1 | 2 | 3 | 4 | ... | n-1 |

    | Element | 1st element | 2nd element | 3rd element | 4th element | 5th element
    | ... | nth element |


    Table 10.1. Typical array structure


    As you can see, each element of an array has an index starting from 0. This is
    a rule, therefore for an n element array, the indices of its elements will take
    the values of 0, 1, 2, ..., n-1.


    # 10.1.1. Declaring Arrays


    An array is easily defined similar to variables. Square brackets near the variable
    type tell the C# compiler that we are declaring an array:


    ```

    variable_type[] newArray;

