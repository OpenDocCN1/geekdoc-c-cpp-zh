    \n图 11.15. 使用我们的 `Multiply()` 方法计算两个数字的乘积\n\n然后让我们再输入一个数字并再次单击 Multiply 按钮。\n\
    我们的方法将如预期那样将所有输入相乘：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_295_1.png)\n\n\
