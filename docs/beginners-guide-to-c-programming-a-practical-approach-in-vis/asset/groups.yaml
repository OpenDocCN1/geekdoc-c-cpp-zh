    EventArgs e)\n{\n}\n```\n\nCode 6.5\n\n- 5. When the user clicks the button, we\
    \ want the ColorDialog to appear. We use the method `ShowDialog()` to fire the\
    \ ColorDialog. We use this method in the following way:\n\n```\nDialogResult colourResult\
    \ = selectColourDialog.ShowDialog();\n```\n\nCode 6.6\n\nIn this code line, the\
    \ dialog box of selectColourDialog is opened with the `ShowDialog()` method. When\
    \ the user selects a colour from the ColorDialog and clicks OK, the colourResult\
    \ object is set to OK. We now need to apply the selected colour to the background\
    \ colour as we did before:\n\n```\nthis.BackColor = selectColourDialog.Color;\n\
    ```\n\nCode 6.7\n\nWith this code, the background colour is set to the colour\
    \ existing in the Color property of the ColorDialog control. We need to insert\
    \ these code lines into the Button's event handler:\n\n```\nprivate void selectColourButton_Click(object\
    \ sender,\nEventArgs e)\n{\n    DialogResult colourResult = selectColourDialog.ShowDialog();\n\
    \    this.BackColor = selectColourDialog.Color;\n}\n```\n\nCode 6.8\n\n- 6. Build\
    \ and run the project. The program window shown in Figure 6.25 will appear.\n\n\
    ![](img/41d82527c4e41cdb7e56259564306ddc_152_0.png)\n\nFigure 6.27. The background\
    \ colour changed to white after selecting white on the ColorDialog\n\n## 6.2.2.\
    \ Font Dialog\n\nFontDialog works with the same principles of the ColorDialog\
    \ and is used for selecting Font properties from a dialog window. Its properties\
    \ are similar to those of the ColorDialog.\n\nLet's select the Font properties\
    \ of a Button's Text using a FontDialog in an example:\n\n- 1. Create a C# project\
    \ in Visual Studio.\n- 2. Add a FontDialog to the form. Set the Name property\
    \ of the FontDialog as `selectFontDialog`.\n- 3. Add a Button in the middle of\
    \ the form. Set the Name and Text properties of the Button as `fontButton` and\
    \ `Select font properties`.\n\nThe form should look as follows:\n\n![](img/41d82527c4e41cdb7e56259564306ddc_152_1.png)\n\
    \nFigure 6.28. FontDialog example\n\n- 4. We will now create the Click event handler\
    \ method of the Button. For this, double-click the button and the following method\
    \ will be created:\n\n```\nprivate void fontButton_Click(object sender, EventArgs\
    \ e)\n{\n}\n```\n\nCode 6.9\n\n- 5. As in the ColorDialog, we will use the `ShowDialog()`\
    \ method to display the FontDialog as follows:\n\n```\nDialogResult fontResult\
    \ = selectFontDialog.ShowDialog();\n```\n\nCode 6.10\n\nWhen the user selects\
    \ the Font properties from the FontDialog and clicks OK, the fontResult object\
    \ will be set as OK. We'll now set the Button's Text's Font properties to the\
    \ Font property of the selectFontDialog control:\n\n```\nfontButton.Font = selectFontDialog.Font;\n\
    ```\n\nCode 6.11\n\n- 6. Let's insert these code lines into the button's event\
    \ handler method:\n\n```\nprivate void fontButton_Click(object sender, EventArgs\
    \ e)\n{\n    DialogResult fontResult = selectFontDialog.ShowDialog();\n    fontButton.Font\
    \ = selectFontDialog.Font;\n}\n```\n\nCode 6.12\n\n- 7. Build and run the project.\
    \ The program will appear as in Figure 6.29. Click the Select font properties\
    \ button and the FontDialog will be displayed as shown in Figure 6.30. I've selected\
    \ bold and underlined in the FontDialog. When the OK button is clicked, this dialog\
    \ will be closed and the Button's Text will be changed accordingly as in Figure\
    \ 6.31.\n\n![](img/41d82527c4e41cdb7e56259564306ddc_154_0.png)\n\nFigure 6.29.\
    \ The example program with a FontDialog\n\n![](img/41d82527c4e41cdb7e56259564306ddc_154_1.png)\n\
    \nFigure 6.30. The FontDialog window\n\n![](img/41d82527c4e41cdb7e56259564306ddc_154_2.png)\n\
    \nFigure 6.31. The Button's font properties set as selected in the FontDialog\n\
    \n![](img/41d82527c4e41cdb7e56259564306ddc_156_0.png)\n\nFigure 6.33. The layout\
    \ of the form\n\n- 5. Double-click the button to create its Click event handler:\n\
    \n```\nprivate void fbdButton_Click(object sender, EventArgs e)\n{\n}\n```\n\n\
    Code 6.13\n\n- 6. In order to show the FolderBrowserDialog, we will apply the\
    \ `ShowDialog()` to it. The return value will be of the `DialogResult` type as\
    \ in the previous dialog examples: `DialogResult fbdResult = selectFolderBrowserDialog.ShowDialog();`\n\
    \n- 7. We will update the Text of the Label with the selected folder with the\
    \ following code: `selectedFolderLabel.Text = selectFolderBrowserDialog.SelectedPath;`.\
    \ We take the `SelectedPath` property of the FolderBrowserDialog and assign it\
    \ to the Text property of the Label. We will insert these code lines into the\
    \ Click event handler method of the button as follows:\n\n```\nprivate void fbdButton_Click(object\
    \ sender, EventArgs e)\n{\n    DialogResult fbdResult =\n        selectFolderBrowserDialog.ShowDialog();\n\
    \    selectedFolderLabel.Text =\n        selectFolderBrowserDialog.SelectedPath;\n\
    }\n```\n\nCode 6.14\n\n- 8. Build and run the project. The following program will\
    \ appear:\n\n![](img/41d82527c4e41cdb7e56259564306ddc_157_0.png)\n\nFigure 6.34.\
    \ The program window\n\nClick the Select a folder button and the FolderBrowserDialog\
    \ will be launched:\n\n![](img/41d82527c4e41cdb7e56259564306ddc_157_1.png)\n\n\
    Figure 6.35. The FolderBrowserDialog waiting for a folder selection\n\nWhen we\
    \ select a folder from the dialog and click OK button, the full path to the selected\
    \ folder will be shown in the Label as shown in Figure 6.36.\n\n- 3. Add a Button\
    \ on the form which will initiate the OpenFileDialog. Set the Name and Text properties\
    \ of the Button as `openFileButton` and `Click to open a text file`, respectively.\n\
    \n- 4. Add a RichTextBox on the form below the Button. We will display the contents\
    \ of the selected text file in this control. Set its Name as `fileRichTextBox`.\
    \ The form will look as follows after these steps:\n\n![](img/41d82527c4e41cdb7e56259564306ddc_159_0.png)\n\
    \nFigure 6.38. Layout of the form\n\n- 5. We want to open text files only because,\
    \ the contents of most of other file types (such as images, videos and formatted\
    \ text files) cannot be displayed in a RichTextBox. We need to set a filter to\
    \ the OpenFileDialog to open files with .txt extension only. For this, select\
    \ the `textFileOpenFileDialog` and set its Filter property as `Text Files | *.txt`\
    \ as shown in Figure 6.39.\n\n- 6. When the Button is clicked, the OpenFileDialog\
    \ window will appear. Therefore, double-click the Button on the form to generate\
    \ its default event handler method as in Code 6.15.\n\n![](img/41d82527c4e41cdb7e56259564306ddc_160_0.png)\n\
    \nFigure 6.39. Setting the Filter property of the OpenFileDialog\n\n```\nprivate\
    \ void openFileButton_Click(object sender, EventArgs e)\n{\n}\n```\n\nCode 6.15\n\
    \n- 7. Firstly, we will add the code line `DialogResult openFileResult = textFileOpenFileDialog.ShowDialog();`\
    \ which will launch the file opening dialog box.\n- 8. When the user selects a\
    \ text file and clicks OK in the file opening dialog, the FileName property of\
    \ the OpenFileDialog will be assigned to the selected filename. We will take this\
    \ FileName and assign it to a new string with the code line `string fileName =\
    \ textFileOpenFileDialog.FileName;`. The variable fileName will then contain the\
    \ selected file's name.\n- 9. Then, we will use a special method `ReadAllText()`\
    \ to read the contents of the text file. This method reads a text file and assigns\
    \ the contents of the text file to a string variable. The code line `string text\
    \ = File.ReadAllText(fileName);` will do this job. Note that the method `ReadAllText()`\
    \ is not included in the default libraries existing in the Form1.cs file. Therefore\
    \ we need to add the library containing this method to the top of our source code\
    \ with the line: `using System.IO;`\n- 10. Finally, we will set the Text of the\
    \ RichTextBox to the text read from the file with the code line: `fileRichTextBox.Text\
    \ = text;`. After these steps, the Form1.cs file will be as follows:\n\n```\n\
    using System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\n\
    using System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\nusing System.Windows.Forms;\nusing System.IO;\n\
    \nnamespace OpenFileDialog\n{\n    public partial class Form1 : Form\n    {\n\
    \        public Form1()\n        {\n            InitializeComponent();\n     \
    \   }\n\n        private void openFileButton_Click(object sender, EventArgs e)\n\
    \        {\n            DialogResult openFileResult = textFileOpenFileDialog.ShowDialog();\n\
    \            string fileName = textFileOpenFileDialog.FileName;\n            string\
    \ text = File.ReadAllText(fileName);\n            fileRichTextBox.Text = text;\n\
    \        }\n    }\n}\n```\n\nCode 6.16\n\n- 11. Build and run the project. The\
    \ program window shown in Figure 6.40 will be launched. We need a text file to\
    \ read from. For this aim, you can use a text file existing on your computer.\
    \ I created a new text file, `test.txt`, in Notepad for this example. When `Click\
    \ to open a text file...` button is clicked, it will display Text files as shown\
    \ in Figure 6.41.\n"
