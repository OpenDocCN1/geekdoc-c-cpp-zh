    # FREQUENTLY USED CLASSES IN C#


    We have been using various methods in our projects since the beginning of this
    book related to events, variables and operations. We also learned creating our
    custom methods and classes in previous chapters. In this chapter, we will study
    frequently used methods of popular built-in classes that are very useful for shortening
    programming time in C# application development.


    # 13.1. The String Class


    As we have learned before, strings are the collections consisting of unicode characters.
    There are basically two classes that enable us to manipulate strings: the String
    Class and the StringBuilder class.


    The first class we will use for manipulating string objects is the String class.
    String class is located under the System namespace of .NET framework therefore
    ready for use in our code when we create a new C# project. In other words, we
    do not need to add a new namespace to use the methods provided by the String class.
    Frequently used methods of the String class are summarized in Table 13.1:


    | Method | Template | Explanation |

    |---|---|---|

    | Copy() | new_string=String.Copy(string_to_be_copied) | Copies the string to
    another one |

    | Empty() | string_to_be_cleared.Empty() | Clears the contents of the string |

    | Join() | string_to_be_populated =String.Join(separator, array) | Copies the
    elements of the array into the string using the specified separator character
    |'
  - '[PAGE 323]


    | Method | Template | Explanation |

    |---|---|---|

    | Split() | string_to_be_split.Split(separator) | Splits the string according
    to the separator character |

    | IndexOf() | string_name.IndexOf(searched_character) | Returns the index of the
    searched character in the string |

    | SubString() | string_name.Substring(start, length) | Returns the substring specified
    by the start index and length |

    | ToString() | variable.ToString() | Converts the variable to string |

    | Concat() | String.Concat(string1, string2) | Combines string1 and string2 |


