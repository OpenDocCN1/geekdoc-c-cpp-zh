  mdcn: "\n- 3. 在 TabPage 集合编辑器中将选项卡的 Text 属性设置为 **输入** 和 **输出**：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_173_0.png)\n\
    \n图 6.55. 设置第一个选项卡的 Text 属性\n\n![](img/41d82527c4e41cdb7e56259564306ddc_173_1.png)\n\
    \n图 6.56. 设置第二个选项卡的 Text 属性\n\n- 4. 在第一个选项卡中添加一个 TextBox。将 TextBox 的 Name 设置为\
    \ **inputTextBox**。\n\n- 5. 在第二个选项卡中添加一个 Label。将 Label 的 Name 设置为 **outputLabel**。\n\
    \n- 6. 我们将在 inputTextBox 的 Text 发生变化时触发使用转换后的文本更新 Label。为此我们将使用名为 **TextChanged**\
    \ 的事件。选择 TextBox 并通过点击事件（⚡）按钮在右下窗格中导航以检查其事件，如下所示：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_174_0.png)\n\
    \n图 6.57. 选择 TextBox 的事件\n\n- 7. 如上图所示双击 **TextChanged** 事件。TextChanged 事件处理程序将在\
    \ Form1.cs 文件中生成，如下所示：\n\n```\nprivate void inputTextBox_TextChanged(object sender,\n\
    EventArgs e)\n{\n}\n```\n\n代码 6.17\n\n- 8. 当 inputTextBox 的 Text 发生变化时，outputLabel\
    \ 的 Text 将会被更新。代码行 outputLabel.Text = inputTextBox.Text.ToUpper(); 完成了所需的工作。它获取\
    \ inputTextBox 的 Text，通过 ToUpper() 方法将其转换为全大写，然后将结果赋给 outputLabel 的 Text。我们将把这行代码写入\
    \ inputTextBox_TextChanged() 方法中，如下所示：\n\n```\nprivate void inputTextBox_TextChanged(object\
    \ sender,\nEventArgs e)\n{\n    outputLabel.Text = inputTextBox.Text.ToUpper();\n\
    }\n```\n\n代码 6.18\n\n- 9. 构建并运行项目。以下带有选项卡的程序窗口将会出现：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_175_0.png)\n\
    \n图 6.58. 带有 TabControl 的程序\n\n当我们在 Input 选项卡的 TextBox 中输入文本时，该文本将被转换为大写，然后分别如\
    \ 图 6.59 和 6.60 所示写入 Output 选项卡的 Label 上。请注意，我们不需要放置一个按钮来触发转换过程，因为只要更改 inputTextBox\
    \ 的文本，inputTextBox_TextChanged() 方法就会自动执行。\n\n- 2. 在窗体上添加一个 TableLayoutPanel。TableLayoutPanel\
    \ 默认有两个行和两列。\n\n- 3. 点击 TableLayoutPanel 顶部的箭头打开任务窗口，在此我们可以添加/删除行和列，如下所示：\n\n\
    ![](img/41d82527c4e41cdb7e56259564306ddc_177_0.png)\n\n图 6.61. TableLayoutPanel\
    \ 任务窗口\n\n- 4. 各点击一次 Add Column 和 Add Row 按钮，使我们的 TableLayoutPanel 拥有 3 行 3 列。执行这些操作后，TableLayoutPanel\
    \ 将具有不对称的行和列：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_177_1.png)\n\n图 6.62.\
    \ 具有不对称单元格的 TableLayoutPanel\n\n- 5. 打开 TableLayoutPanel 的任务对话框并选择 编辑行和列... 如下所示：\n\
    \n![](img/41d82527c4e41cdb7e56259564306ddc_178_0.png)\n\n图 6.63. 打开 编辑行和列 对话框\n\
    \n- 6. 当选择 Columns 时，将 Column1、Column2 和 Column3 的 Size Types 设置为 Per cent，并分别将它们的百分比设置为\
    \ 33%、33% 和 34%，如 图 6.64 所示，以便我们几乎均等地划分它们。\n\n![](img/41d82527c4e41cdb7e56259564306ddc_178_1.png)\n\
    \n图 6.64. 设置列大小\n\n## C# 编程初学者指南\n\n- 7. 同样地，选择 Rows，然后将 Row1、Row2 和 Row3 的大小分别设置为\
    \ 33%、33% 和 34%，如图 6.65 所示。\n- 8. 现在我们可以调整窗体上的 TableLayoutPanel 大小，列和行大小的百分比将保持不变，如\
    \ 图 6.66 所示。\n\n![](img/41d82527c4e41cdb7e56259564306ddc_179_0.png)\n\n图 6.65.\
    \ 设置行大小\n\n![](img/41d82527c4e41cdb7e56259564306ddc_179_1.png)\n\n图 6.66. 调整大小后的\
    \ TableLayoutPanel\n\n- 9. 让我们构建并运行项目。程序将如下所示出现：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_180_0.png)\n\
    \n图 6.67. TableLayoutPanel 默认不可见\n\n正如我们从此窗口可以看到的，TableLayoutPanel 默认没有边框。由于我们尚未在\
    \ TableLayoutPanel 内添加任何控件，整个窗体看起来是空的。我们可以通过其 CellBorderStyle 属性更改 TableLayoutPanel\
    \ 的边框样式。例如，如果我们将此属性设置为 Single，边框将显示为单线，如下所示：\n\n![](img/41d82527c4e41cdb7e56259564306ddc_180_1.png)\n\
    \n图 6.68. 将 CellBorderStyle 设置为 Single 后的 TableLayoutPanel\n\n### 6.3.5. SplitContainer\n\
    \nSplitContainer 用于将窗体分为两个垂直或水平的面板。这些分隔面板的大小可调整。\n\n让我们使用一个 SplitContainer 在示例中将窗体分开：\n\
    \n- 1. 创建一个 C# 项目。\n- 2. 向窗体添加一个 SplitContainer。SplitContainer 将按如下方式将窗体分为两个面板：\n\
    \n![](img/41d82527c4e41cdb7e56259564306ddc_181_0.png)\n\n图 6.69. SplitContainer\
    \ 默认将窗体分为两个垂直面板\n\n- 3. SplitContainer 默认将整个窗体分为两个垂直面板。我们可以通过点击 SplitContainer\
