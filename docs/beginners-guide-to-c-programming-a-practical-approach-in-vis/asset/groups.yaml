    \nFigure 11.2. Opening the code view\n\nThe method will be declared inside the\
    \ Form1() method as indicated below:\n\n![](img/41d82527c4e41cdb7e56259564306ddc_278_1.png)\n\
    \nFigure 11.3. The place where our method will be declared\n\n- 6. We can declare\
    \ our method as public or private as this method will be used inside this form\
