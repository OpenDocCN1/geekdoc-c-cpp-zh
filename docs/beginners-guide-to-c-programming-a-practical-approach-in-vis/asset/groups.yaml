    # Chapter 7


    ![](img/41d82527c4e41cdb7e56259564306ddc_188_0.png)


    # VARIABLES AND CONSTANTS


    We will start studying C# programming language systematically in this chapter.
    Our first subject is a basic concept in programming: variables and constants.


    # 7.1. Variables


    Variables are used for holding data temporarily during the program execution.
    We can think variables as the addresses (or pointers) of temporary data stored
    in the random access memory (RAM). In some programming languages, the compiler
    understands the type of the variable and allocates the required space in the RAM
    for it. These are called dynamically typed languages. On the other hand, in statically
    typed languages like C#, the type of the variable should explicitly be defined
    before being able to store data in it. In C#, when the type of the variable is
    declared, the C# compiler assigns the required space to that variable in the memory.


    # 7.1.1. Declaring Variables


    Variables are defined with their types and names in the following form:


    ```

    variable_type variable_name;

    ```


    There are several variable types in C# each having a specific length. When a variable
    is declared as shown above, the memory space for the variable is allocated but
    not filled yet. It is because the variable hasn’t been assigned a value. Here’s
    an integer type variable definition:


    ```

    int a;

    ```


    Code 7.1'
