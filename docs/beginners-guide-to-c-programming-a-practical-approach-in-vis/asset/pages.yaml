    ![](img/41d82527c4e41cdb7e56259564306ddc_28_0.png)


    Figure 3.6. Various modes of the Properties window


    Alphabetical view lists the properties in an alphabetical order from A to Z. Categorized
    view shows the related properties together. Another view is the **Events** view
    which shows the events related to the selected form component. Events are the
    actions related to a form component such as clicking on a button.


    There are also three more windows which are currently hidden at the left side
    as shown inside the ellipse in Figure 3.7. These are Server Explorer, Toolbox
    and the Data Source windows.


    +   - The **Server Explorer** is the server management section that enables us
    to log on to servers and use their databases in our project.

    +   - The **Toolbox** window is the place that contains the form controls and
    components we can use on the forms. These will be explained in detail in the next
    chapter.'
