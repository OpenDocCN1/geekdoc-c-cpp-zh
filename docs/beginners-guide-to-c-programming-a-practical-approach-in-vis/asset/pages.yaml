    +   - **Text**: The text written on the label.

    +   - **AutoSize**: Resizes the Label proportional to its text length.

    +   - **TextAlign**: Aligns the text on the left, centre or right side of the
    Label.


    A simple Label example: We will use a Label, a Button and a CheckBox together
    in this example.'
