- pgno: 419
  md: '+   - If our main character, the RobotBoy, **collides with a monster**, the
    score will decrease and the monster will disappear,

    +   - If the RobotBoy **collides with a coin**, the score will increase and the
    coin will disappear,

    +   - If the RobotBoy **collides with the red ground sprite**, the level will
    restart and,

    +   - If the RobotBoy **collides with the green finish sprite**, the level will
    be completed.


    As you may have guessed, we will utilize several conditional statements (if-else
    or switch-case structures) to check these collisions.


