  md: '# 6.3. Containers


    Containers are used for grouping other controls and laying out the form in a robust
    and nicer way. It has six types as will be studied in this subsection.


    # 6.3.1. Panel


    Panel control is used for grouping and editing other controls. The controls included
    in a Panel can be moved to another location on the form together without changing
    their relative positions. Furthermore, common properties of these controls can
    be edited together. Panels are also used for grouping RadioButtons. Therefore
    we can use Panels to group RadioButtons on a form where we can select one RadioButton
    from each Panel.


    Let''s add three Panels on a form each of them containing three RadioButtons in
    our example:


    +   1. Create a C# project.

    +   2. Add three Panels on the form and divide the form among these Panels vertically
    as follows:


    ![](img/41d82527c4e41cdb7e56259564306ddc_168_0.png)


    Figure 6.48. Adding three Panels on the form'
