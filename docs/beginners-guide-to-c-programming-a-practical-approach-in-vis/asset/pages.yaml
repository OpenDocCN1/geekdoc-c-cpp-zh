- pgno: 403
  md: 'We now have our main character, platform, yellow coin and red monster sprites
    and ready to design our level visually and write the required C# code in Unity.
    I''ll design a sample short level here to show how to complete a game project
    but after you grasp these basics, you can design your own complete level and game
    bounded only with your imagination.


    First of all, let''s use the platform template to place various platforms to our
    scene. We can just copy-paste the platform we placed in our scene. Our RobotBoy
    will walk on these platforms and will have to jump when there is a gap between
    them:


    ![](img/41d82527c4e41cdb7e56259564306ddc_403_0.png)


    Figure 16.30. Positioning of the platforms


    You can of course position the platforms differently or resize as you wish. When
    we test the project now, we will a scene similar to the following:


