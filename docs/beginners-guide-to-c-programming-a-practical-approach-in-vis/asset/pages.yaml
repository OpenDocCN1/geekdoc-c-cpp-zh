- pgno: 232
  md: "6. Double-click the Button to create its Click event handler method. We will\
    \ insert our code inside this method as usual. Let's first take the Text of the\
    \ checkTextBox and then assign it to a string type variable named input as follows:\n\
    \n```\n```\nstring input = usernameTextBox.Text;\n```\nCode 8.24\n```\n\n7. We'll\
    \ switch the input variable against the usernames we decide in this example. Let\
    \ us use the strings John and James as the reference usernames in the switch statements\
    \ as follows:\n\n```\n```\nswitch (input)\n{\n    case \"John\":\n        MessageBox.Show(\"\
    Successful entry\");\n        break;\n    case \"James\":\n        MessageBox.Show(\"\
    Successful entry\");\n        break;\n    default:\n        MessageBox.Show(\"\
    Username not found\");\n        break;\n}\n```\nCode 8.25\n```\n\n> Note that\
    \ the switch-case structure is automatically formed in Visual Studio when we write\
    \ switch and then press the Tab key twice on the keyboard.\n\nIn this code, we\
    \ compare the input variable against two cases. If input is \"John\", then the\
    \ block inside the case \"John\": statement is executed. Note that the case statements\
    \ do not have curly brackets but just use semicolons to state the blocks. Also\
    \ note the usage of the break keyword in each of the case blocks. They indicate\
    \ a break, i.e. exit when the respective case is satisfied. We need to use the\
    \ break keyword in case blocks, otherwise the compiler would give an error. If\
