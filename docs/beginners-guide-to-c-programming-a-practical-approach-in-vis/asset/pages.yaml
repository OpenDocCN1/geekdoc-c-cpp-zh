    Don’t forget to add the Box Collider 2D property to the finish sprite to be able
    to make our RobotBoy to collide with it.


    We can now test the visual interface of our simple platformer. When our RobotBoy
    hits the red monsters or yellow coins, they will scatter around in a funny way.
    However, our aim will be to avoid the monsters and collect the coins. When the
    RobotBoy touches a monster, the monster will disappear and the score will randomly
    decrease. Similarly, when he collects a coin, the coin will disappear and the
    score will randomly increase. Furthermore, when the RobotBoy falls on the red
    ground, the level will restart. We will use our C# skills to implement this logic.


    # 16.4. Using C# to Implement Game Logic


    We will use C# in Unity to implement the game logic. Fortunately, Unity provides
    various useful classes and methods to do this. When we consider the aim and logic
    of our game, it is easy to see that the gameplay will be in fact based on touches
    (collisions):'
