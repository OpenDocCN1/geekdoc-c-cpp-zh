    +   4. Set the Name and Text of the Button as **showButton** and **Show in MessageBox**.

    +   5. Double-click the Button to create its event handler method **showButton_Click()**.

    +   6. Add the code `MessageBox.Show(inputRichTextBox.Text);` into this method.'
