  md: '# Chapter 8


    ![](img/41d82527c4e41cdb7e56259564306ddc_208_0.png)


    # CONDITIONAL STATEMENTS


    Conditional statements enable the programs to branch depending on given conditions.
    Before studying actual conditional statements and keywords, it is better to overview
    operators which are utilized in conditional statements


    # 8.1. Operators


    Operators operate on the operands, which exist at the left and right hand side
    of the operand. In fact we did use operands before, when we did addition and multiplication
    in the previous chapters. Those were the arithmetic operators. C# is a flexible
    language and provides operators in comparison, arithmetic and increment/decrement
    categories.


    # 8.1.1. Comparison Operators


    Logical operators compare its two operands and generate a logical result. Since
    a logical result can only be true or false, the result of a logical operator is
    always a Boolean type variable. Comparison operators in C# are shown in the following
    table:


    | Operator | Comparison |

    |---|---|

    | == | Checks if its operands are equal |

    | != | Checks if its operands are not equal |

    | > | Checks if the first operand is greater than the second one |

    | < | Checks if the first operand is lower than the second one |

    | >= | Checks if the first operand is greater or equal to the second one |

    | <= | Checks if the first operand is lower or equal to the second one |


    Table 8.1. Comparison operators'
