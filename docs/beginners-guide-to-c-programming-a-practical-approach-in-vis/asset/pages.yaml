    | 2 | BackgroundImageChanged | the background image is changed | ControlName_BackgroundImageChanged(...)
    |

    | 3 | CursorChanged | the cursor type is changed | ControlName_CursorChanged(...)
    |

    | 4 | KeyPressed | a key on the keyboard is pressed when the control is active
    | ControlName_KeyPressed(...) |

    | 5 | Load | the form is loaded (at the beginning of the execution of the program)
    | FormName_Load(...) |'
