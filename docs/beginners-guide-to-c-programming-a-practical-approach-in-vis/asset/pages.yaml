    +   - **string**: This is a character string. Used for storing more than one character.
    The string type is a **reference type** variable meaning that the variable in
    fact stores the reference to its content. Contrary to the other variable types
    which are **value types**, **reference types** may refer to the same content in
    the memory meaning that a change in a variable may result the change of the other
    variable too. If this confuses you, don’t worry. We’ll use these concepts in our
    projects soon. Here’s a string variable declaration:


