  md: '![](img/41d82527c4e41cdb7e56259564306ddc_60_0.png)


    # Chapter 5


    # COMMON CONTROLS


    In this chapter, we will study commonly used controls in detail because they are
    the backbones of GUI (form) design. We will use them in small projects where their
    properties and events will be programmed. This will be a gentle beginning of our
    C# coding journey.


    # 5.1. Button


    Buttons are used for triggering actions.


    ![](img/41d82527c4e41cdb7e56259564306ddc_60_1.png)


    Figure 5.1. A button


    Buttons have the following properties:


    +   - **Image**: The foreground image of the button.

    +   - **TextAlign**: The alignment of the text on the button.

    +   - **FlatStyle**: Sets the appearance of the button.


    > Please note that the properties discussed here are the ones additional to the
    common properties discussed in the previous chapter.


    A simple Button example: Let''s create a small project incorporating a Button
    step-by-step:


    +   1. Create a new C# project in Visual Studio.

    +   2. Place a Button on the form.

    +   3. Set the Text property of the Button as Change.

    +   4. Set the Name property of the Button as changeButton.'
  merge: -1
  img_proc: true
- pgno: 61
