- pgno: 54
  md: 'Properties of controls and other form elements can also be changed programmatically
    in real time during runtime.


    ![](img/41d82527c4e41cdb7e56259564306ddc_54_0.png)


    Figure 4.11. Short explanation for the selected property appears at the bottom
    of the properties window


    # 4.6. Events of Controls


    Events take care of the things happening on the form. Clicking a button or selecting
    an option from a drop-down box are examples of events. The code that will be executed
    when an event happens are written in the .cs file of the project.


    Each control type has a default event that can be created in the code just by
    double-clicking the control. For example, let''s place a CheckBox on the form
    by drag&drop as in Figure 4.12. Form1 is in [Design] mode as it is shown inside
    the ellipse. When we double-click checkBox1 on this form, code view of Form1 opens
    in the editor as shown in Figure 4.13.


    The default event for a CheckBox is the CheckChanged event which fires (executes)
    when the check of the CheckBox changes, i.e. when it is checked or unchecked.
    This default event handling method named checkBox1_CheckChanged(...) is created
    when checkBox1 is double clicked on the form as shown inside the rectangle in
    Figure 4.13.'
  merge: -1
  img_proc: true
