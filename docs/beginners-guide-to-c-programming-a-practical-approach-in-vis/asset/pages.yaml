- pgno: 196
  md: '# 7.1.4. General Type Conversions


    We sometimes need to convert data types. Type conversion is in fact taking the
    data contained in a variable and then placing this data to another variable which
    has a different amount of allocated space on the memory.


    **A type conversion example:** If the user enters some numbers in a TextBox, it
    is read as a string in C#. If we need to do mathematical operations on this input,
    **we firstly convert it to a numeric data type** and then perform the required
    operation. And then again **the result should be converted to a string** before
    displaying on a Label or a TextBox.


    There are two types of conversions in C#: **implicit** and **explicit** conversions:


    +   - **Implicit conversions:** In this type of conversion, the contents of a
    variable type can be converted to another type which has a bigger amount of allocated
    space. Assume that we have an int type variable. It has a 4 bytes of allocated
    space. This means that we can convert the int type to any type which has 4 bytes
    or more allocated space so that we will not lose information. For instance, an
    int type variable can be converted to a long type variable. However, we cannot
    implicitly convert an int to a byte type variable because byte has only 1 byte
    of allocated space and the contents of an int variable cannot be fit into this
    1 byte space. If we try to do this, C# compiler will issue an error and will not
    build the executable file. The permitted implicit conversions are given in Table
    7.4. Here''s an example of implicit conversion:


    ```

    int myInteger = 4500;

    long myLong = myInteger;

    Code 7.25

    ```


    In the first line, we declared an int type variable called myInteger and initialized
    it as 4500. In the second line, we declared a long type variable called myLong
    and assigned myInteger''s value to myLong. Note that myInteger will not be wiped
    out, both variables will co-exist in the end.'
