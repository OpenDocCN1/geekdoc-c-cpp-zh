  md: "The program crashed and Visual Studio has shown the error in the code editor\
    \ saying that \"Input string was not in a correct format\". Since the program\
    \ has crashed, we cannot quit it by clicking the cross button at its top right.\
    \ Instead, we have to close using the usual stop button in Visual Studio. It is\
    \ good that Visual Studio shows the error and we can quit the crashed program\
    \ from it. However if the user runs this program by double-clicking on it outside\
    \ of Visual Studio, he/she will not have these opportunities. He/she will have\
    \ to go to the task manager and manually try to close the program. Moreover, the\
    \ program will not show any clue about the reason of the error. This is where\
    \ try-catch statement comes into play.\n\n8. We will cover our code lines inside\
    \ the try-catch block by modifying the event handler method of Code 14.3 as follows:\n\
    \n```\n```csharp\nprivate void multiplyButton_Click(object sender, EventArgs e)\n\
    {\n    try\n    {\n        int inputNum = Convert.ToInt32(input.Text);\n     \
    \   int result = 2 * inputNum;\n        output.Text = result.ToString();\n   \
    \ }\n    catch (Exception exceptionObject)\n    {\n        MessageBox.Show(exceptionObject.ToString());\n\
    \    }\n}\n```\n```\n\nCode 14.4\n\nWhen we type try and press Tab key twice on\
    \ the keyboard, the try-catch structure is formed automatically.\n\nIn this code,\
    \ the program will try to do the required operation. If something fails, the error\
    \ will be caught in the catch block. The argument of the catch keyword is the\
    \ exceptionObject which is an instance of Exception. The information regarding\
    \ the error is recorded in this object. Thanks to this, we can display the contents\
    \ the error by the code line MessageBox.Show(exceptionObject.ToString());"
