    # 5.19. ToolTip


    ToolTips are used for adding tips (small information) about the controls on a
    form. When the mouse pointer is over the associated control, its ToolTip is activated
    and displays the related information.


    The commonly used properties of ToolTips are as follows:


    +   - **InitialDelay**: The time required for the mouse pointer stay on the control
    for the ToolTip to show the information.

    +   - **ToolTipIcon**: Specifies the icon that will be shown with the information.

    +   - **IsBalloon**: Sets if the information will be shown inside a balloon.'
