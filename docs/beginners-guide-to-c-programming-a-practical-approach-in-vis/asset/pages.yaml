- pgno: 234
  md: '# Chapter 9


    ![](img/41d82527c4e41cdb7e56259564306ddc_234_0.png)


    # LOOPS


    Loops are used when a code line or code block has to be executed multiple times
    depending on a condition. For example, consider a database with name entries in
    it. If we want to display all the names one by one, we would do it in the following
    way:


    ```

    MessageBox.Show(entry 1);

    MessageBox.Show(entry 2);

    MessageBox.Show(entry 3);

    .

    MessageBox.Show(entry n-1);

    MessageBox.Show(entry n);

    ```


    Code 9.1


    In this code, entries refer to the data in the database. As you can see, the number
    of code lines would be intractable. Instead, we can do the same job using a loop
    in a more elegant and easier way:


    ```

    for(each entry in the database)

    {

    MessageBox.Show(current entry);

    }

    ```


    Code 9.2


    There are four types of looping structures in C#: for, foreach, while and do-while.
    We''ll study these in this chapter by using them in small projects:


    # 9.1. The For Loop


    The general structure of the for loop is shown in Code 9.3. Code lines inside
    the for block are executed as long as the looping condition written inside the
    parentheses next to the for keyword is true (satisfied).'
  merge: -1
  img_proc: true
