- pgno: 41
  md: '![](img/41d82527c4e41cdb7e56259564306ddc_41_0.png)


    # Figure 3.29. Opening the solution file Hello World.sln


    That''s all for this chapter. We have learned how to create a new project. place
    a Label control on the form, setting basic properties of the Label visually and
    aligning it in the middle. And then we built the project and created the executable
    file.


    As you may have noticed from the Toolbox, there are a lot of controls that can
    be used on Windows forms. Since our aim is to learn both GUI design and C# coding,
    it is required to know how we can use other control types like a Button or a TextBox.
    In the next two chapters, we''ll learn working with commonly used form controls
    together with the associated basic C# coding before moving on to actual coding
    lectures in the following chapters.'
  merge: -1
