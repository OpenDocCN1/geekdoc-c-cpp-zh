  md: "Classes can be declared and used in C# in one of the following three ways:\n\
    \n+   - Declaration inside the same source code file of the program such as in\
    \ Form1.cs\n+   - A separate .cs file can be added to the project. The new class\
    \ is then declared and coded in this file.\n+   - A completely separate library\
    \ file can be created in Visual Studio where the class is declared. This library\
    \ file is then saved as a .dll file available for distribution and use in any\
    \ C# project.\n\nThe general template of a class structure is as follows:\n\n\
    ```\nclass name_of_the_class\n{\n    variable_type variable_1;\n    variable_type\
    \ variable_2;\n    .\n    .\n    variable_type variable_n;\n\n    return_type\
    \ method_1(params_1)\n    {\n        method_1 code here\n    }\n    return_type\
    \ method_2(params_2)\n    {\n        method_2 code here\n    }\n    .\n    .\n\
    \    .\n    return_type method_m(params_m)\n    {\n        method_n code here\n\
    \    }\n}\n```\n\nCode 12.1\n\nIn this template, the class has several variables\
    \ (member variables) and methods inside."
