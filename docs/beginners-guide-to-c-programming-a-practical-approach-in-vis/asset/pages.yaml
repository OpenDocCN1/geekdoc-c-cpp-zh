- pgno: 24
  md: '# Chapter 3


    ![](img/41d82527c4e41cdb7e56259564306ddc_24_0.png)


    # TEST DRIVE: THE HELLO WORLD PROJECT


    A good convention to start learning a programming language and a development environment
    is to try a Hello World example. It is just displaying the “Hello World” expression
    on the screen. OK, I know it is not a program that you’d be proud of showing to
    your family or friends but its usefulness stems from testing whether your programming
    environment is working normally and to see if you’re ready to go for real projects.
    In our very first Visual C# project, we will write **Hello, World!** text in the
    middle of the program window in any colour and font we like.


    # 3.1. Creating a New Project


    When Visual Studio is running, please select **File → New → Project** as shown
    below:


    ![](img/41d82527c4e41cdb7e56259564306ddc_24_1.png)


    Figure 3.1. Creating a new project


    A window showing the possible project types will appear. First of all, select
    **Visual C#** from the left pane:'
  merge: -1
  img_proc: true
