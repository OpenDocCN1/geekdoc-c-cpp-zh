  md: "# 8.2.2. The If-Else Statement\n\nIf-else statements operate the same way as\
    \ the if statements. However they have the else block which is executed when the\
    \ condition is not satisfied. The template of the if-else statement is given below:\n\
    \n```\nif(condition)\n{\n    Here is the if block between the curly brackets.\
    \ The code written here is executed if the condition is satisfied.\n}\nelse\n\
    {\n    Here is the else block between the curly brackets. The code written here\
    \ is executed if the condition is NOT satisfied.\n}\n```\n\nCode 8.17\n\nLet’s\
    \ modify the previous if example (remember that you can copy-paste the whole project\
    \ folder to create a new project for modifying) by adding an else block as follows:\n\
    \n```\nif (usernameTextBox.Text == \"csharpprogrammer\" && passwordTextBox.Text\
    \ == \"abc456\")\n{\n    MessageBox.Show(\"Login successful\");\n}\nelse\n{\n\
    \    MessageBox.Show(\"Username/password incorrect\");\n    usernameTextBox.Clear();\n\
    \    passwordTextBox.Clear();\n}\n```\n\nCode 8.18\n\nWhen the user enters a wrong\
    \ username/password combination, the condition of the if statement will be true.\
    \ In this case, the else block will be executed. It will display the message Username/password\
    \ incorrect and then clear the username and password TextBoxes using the Clear()\
    \ methods as in Figure 8.22\n\n> Note that the else block does not have a separate\
    \ condition. It is also dependent on the condition of the if statement."
  merge: -1
  img_proc: true
