    # 12.4. Constructor Methods


    Constructor methods are special methods which are executed when an instance of
    a class (i.e. an object) is created. All classes have their own default constructor
    in the background even if we don’t declare one. The constructor method of a class
    is executed only once when an object is created. The primary duties of constructor
    classes are the allocation of the memory for member variables and initialization
    of these variables.


    The name of constructor classes should have the same name as the class. Consider
    how we have created the firstObject object from the MessageClass in the previous
    example (from Code 12.13):


    ```

    MessageClass firstObject = new MessageClass();


    Code 12.15

    ```


    In this code line, we created an instance of the MessageClass: the object named
    firstObject. We used the new keyword followed by the constructor method MessageClass()
    for this aim.


    Although all classes have default invisible constructor methods automatically
    as in this example, we can also explicitly declare a constructor method primarily
    for passing parameters to member variables.'
