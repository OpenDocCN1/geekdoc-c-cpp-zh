    # 8.3. The Switch-Case Statement


    Switch-case structures operate similar to if - else if - else statements. The
    main difference is that we can only check a variable against exact values in a
    switch-case statement; we cannot use comparison statements as conditions. The
    template of the switch-case statements is shown below:'
  merge: -1
