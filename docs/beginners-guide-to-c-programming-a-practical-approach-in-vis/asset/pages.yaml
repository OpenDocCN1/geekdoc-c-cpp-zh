- pgno: 231
  md: "```\nswitch(variable)\n{\n    case x:\n        The code written here is executed\
    \ if the variable is equal to x.\n    case y:\n        The code written here is\
    \ executed if the variable is equal to y.\n    .\n    .\n    default:\n      \
    \  The code written here is executed if the variable is NOT equal to either of\
    \ x, y and other conditions written above (as in the else statements).\n}\n```\n\
    \nCode 8.23\n\nLet's create a new example where we will switch the string given\
    \ in a TextBox against two usernames and display a message box if the username\
    \ is matched:\n\n+   1. Create a new C# project.\n+   2. Add a Label, a TextBox\
    \ and a Button to the project.\n+   3. Set the Text of the Label as Username.\n\
    +   4. Set the Name of the TextBox as usernameTextBox.\n+   5. Set the Name and\
    \ Text of the Button as checkButton and Check, respectively. The form will look\
    \ as follows:\n\n![](img/41d82527c4e41cdb7e56259564306ddc_231_0.png)\n\nFigure\
    \ 8.27. The layout of the form"
