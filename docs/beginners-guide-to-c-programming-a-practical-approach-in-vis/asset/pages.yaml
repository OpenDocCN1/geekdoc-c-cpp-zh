- pgno: 386
  md: '# Chapter 16


    ![](img/41d82527c4e41cdb7e56259564306ddc_386_0.png)


    # DEVELOPING A 2D GAME IN UNITY USING C#


    We now have the C# background for developing a wide range of programs. We will
    put our knowledge and effort to develop a platform game in this chapter.


    Games are among the most popular apps. Game developers earn good money once the
    gamers get addicted to their games. However, developing a game is not a simple
    task since a good game should have an exciting story, good graphics, realistic
    physics rules and efficient code to glue all these together. Fortunately, game
    development frameworks make this task easier. There are many game development
    tools using various programming languages. Unity is one of the most popular game
    development tools in which we can use C# programming. Unity lets us to develop
    both 2-dimensional (2D) and 3-dimensional (3D) games. We will develop a simple
    2D platform game using Unity and C# in this chapter.


    The name of the game we will develop is **Random Platformer**. The idea is simple:
    the main character will walk on platforms. He will try to collect **yellow coins**
    and avoid **red monsters** while he''s trying to complete the level. When he collects
    a coin, the item will disappear and **the score will increase by a random number
    between 0 and 5**. When the user accidentally touches a monster, the score will
    **decrease by a number between 0 and 10**. As you may have guessed, we will use
    our famous Random class in C# to generate these random score increments or decrements.
    When the character falls down the platform, the level will restart with the score
    reset.'
  merge: -1
  img_proc: true
