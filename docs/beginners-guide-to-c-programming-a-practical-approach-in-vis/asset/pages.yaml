  md: '# 5.18. TextBox


    TextBoxes are probably the most frequently used controls after the Button in Windows
    Forms applications. TextBoxes are simply used to gather text input from the user.
    It has the following important properties:


    +   - **MultiLine**: Sets if the text input may span multiple lines.

    +   - **WordWrap**: If the text overflows single line, it will automatically be
    wrapped to the next line.

    +   - **ScrollBars**: Sets if the text scrolling bars will be visible.


    In our example, we''ll gather text from multiple TextBoxes and merge them before
    adding to a ListBox.


    +   1. Create a new C# project in Visual Studio.

    +   2. Place three Labels, three TextBoxes, one Button and one ListBox on the
    form as shown below:


    ![](img/41d82527c4e41cdb7e56259564306ddc_121_0.png)


    Figure 5.92. Layout of the form


    +   3. Set the Texts of the Labels from top to down as **Name:**, **Lesson:**
    and **Grade:**.

    +   4. Set the Name properties of the TextBoxes from top to down as **nameTextBox**,
    **lessonTextBox** and **gradeTextBox**.

    +   5. Set the Text and Name of the Button as **Add Info** and **addInfoButton**,
    respectively.

    +   6. Set the Name of the ListBox as **infoListBox**. After these changes, the
    form will look as follows:'
  merge: -1
  img_proc: true
- pgno: 122
  md: "![](img/41d82527c4e41cdb7e56259564306ddc_122_0.png)\n\nFigure 5.93. Layout\
    \ of the form after changes\n\n7. When the Add Info Button is clicked, the Texts\
    \ of the TextBoxes will be read, merged and added to the ListBox. For this, create\
    \ the default event handler of the button, addInfoButton_Click(…), by double-clicking\
    \ on it and add the following code:\n\n```\nprivate void addInfoButton_Click(object\
    \ sender, EventArgs e)\n{\n    infoListBox.Items.Add(nameTextBox.Text + \"-\"\
    \ + lessonTextBox.Text + \"-\" + gradeTextBox.Text);\n    nameTextBox.Clear();\n\
    \    lessonTextBox.Clear();\n    gradeTextBox.Clear();\n}\n```\n\nCode 5.26\n\n\
    In the first line, merged texts are passed to the Add() method for performing\
    \ addition to the ListBox. In this operation, the + operators merge texts. Moreover,\
    \ hyphens (-) are placed between the texts. It is worth noting that hyphens are\
    \ written inside double quotes to tell Visual Studio that hyphens should be considered\
    \ as texts.\n\nAfter adding merged texts to the ListBox, TextBoxes are cleared\
    \ by applying the method Clear(). Therefore, all TextBoxes are cleared without\
    \ user intervention making them ready for entering new inputs."
  merge: -1
  img_proc: true
