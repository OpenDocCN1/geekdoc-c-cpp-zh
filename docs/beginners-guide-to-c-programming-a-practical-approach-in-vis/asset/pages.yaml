- pgno: 63
  md: "Let's now try to understand what these code lines mean. The first line changeButton.Text\
    \ = \"Clicked!\"; means “Set the Text property of the control named changeButton\
    \ to \"Clicked!\" ”. You can see that the texts are written inside double quotes\
    \ in C#. Moreover, each code line should be terminated by a semicolon. These are\
    \ important rules.\n\nThe second line, this.BackColor = Color.White; means that\
    \ “Set the background colour of this to white.” Here, this refers to the form\
    \ itself. Therefore, these two lines will change the text of the button to “Clicked!”\
    \ and the background colour of the form to white when the button's Click event\
    \ happens.\n\nThe complete Form1.cs code is also given below for your convenience:\n\
    \n```\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\n\
    using System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\nusing System.Windows.Forms;\n\nnamespace Button\n\
    {\n    public partial class Form1 : Form\n    {\n        public Form1()\n    \
    \    {\n            InitializeComponent();\n        }\n\n        private void\
    \ changeButton_Click(object sender, EventArgs e)\n        {\n            changeButton.Text\
    \ = \"Clicked!\";\n            this.BackColor = Color.White;\n        }\n    }\n\
    }\n```\n```\n\nCode 5.2"
