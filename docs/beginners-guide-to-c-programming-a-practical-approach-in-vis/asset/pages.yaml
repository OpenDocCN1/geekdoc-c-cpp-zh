  md: '# 15.1. Creating an Access Database


    Microsoft Access comes inside the Microsoft Office suite. Access provides a relational
    database which is basically saved in an Access file. Access files can be read/written
    using both the Microsoft Access program itself and an external program written
    in C# or another language which supports Access databases. The performance of
    Access is great for our application scale.


    We must have the Access software installed on our computer to create an Access
    database for use in our C# program. After the development phase, we will have
    the standalone program and the database file. We can then use our standalone program
    and the database file on a computer which doesn’t have the Access software.


    If you don’t have the Access software on your computer at the moment, you can
    download a time-limited trial version of Microsoft Office from their official
    website at https://products.office.com/en/try for being able to create Access
    databases used in this chapter.


    Let’s now create our first Access database.


    +   1. Select a folder where you want to create your Access database. I created
