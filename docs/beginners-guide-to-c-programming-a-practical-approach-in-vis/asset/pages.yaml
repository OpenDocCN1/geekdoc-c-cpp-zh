    respectively.

    +   4. Set the Name of the ProgressBar as **incrementProgressBar**.

    +   5. Set the Name of the ListBox as **currentValueListBox**.

    +   6. As we click the button, the value of the ProgressBar will increase and
    the current value of the ProgressBar will be added to the ListBox. Before the
    actual code, let’s set the Minimum, Maximum and Step properties of the ProgressBar
    as 0, 100 and 1, respectively. In this case, the value of the ProgressBar will
    start from 0 and increase by 1 until 100. ProgressBar will display this progress
    visually. We will set these properties of the ProgressBar inside Form1’s Load
    method so that they will be set at the start of the program. For this, double-click
    the empty space of the form to create its default Load method. Then add the following
    code lines:'
