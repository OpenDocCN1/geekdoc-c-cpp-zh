    +   - **DateTime**: This type is used for holding date and time data between 1/1/0001
    12:00:00 and 31/12/9999 23:59:59. 8 bytes of memory space is allocated for each
    DateTime variable. In the following code line, the date-time data of the moment
    is assigned to a DateTime type variable named currentDateTime:


    ```

    DateTime currentDateTime = DateTime.Now;

    ```


