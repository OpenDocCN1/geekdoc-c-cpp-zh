  md: '# 13.3. The Math Class


    The Math class provides the necessary methods for performing mathematical operations.
    Frequently used methods of this class are shown as follows:


    | Method | Template | Explanation |

    |---|---|---|

    | Abs() | Math.Abs(number) | Returns the absolute value of the given number |

    | Ceiling() | Math.Ceiling(number) | Returns the smallest integer greater or equal
    to the given number |

    | Cos() | Math.Cos(number) | Returns the cosine of the given number |

    | Exp() | Math.Exp(number) | Returns e^number where e is the base of the natural
    logarithm (e=2.71...) |

    | Floor() | Math.Floor(number) | Returns the largest integer lower or equal to
    the given number |

    | Log() | Math.Log(number) | Returns the natural logarithm of the given number
    |

    | Log10() | Math.Log10(number) | Returns the base-10 logarithm of the given number
    |

    | Max() | Math.Max(number1, number2) | Returns the greater of number1 and number2
    |

    | Min() | Math.Min(number1, number2) | Returns the smaller of number1 and number2
    |

    | Pow() | Math.Pow(number1, number2) | Returns number1^number2 |

    | Round() | Math.Round(number) | Rounds the given number to the closest integer
    |

    | Sign() | Math.Sign(number) | Returns the sign of the given number |

    | Sin() | Math.Sin(number) | Returns the sine of the given number |

    | Sqrt() | Math.Sqrt(number) | Returns the square root of the given number |

    | Tan() | Math.Tan(number) | Returns the tangent of the given number |


    Table 13.3. Frequently used methods of the Math class


    We''ll now develop a small project in which we will use some of these methods.


