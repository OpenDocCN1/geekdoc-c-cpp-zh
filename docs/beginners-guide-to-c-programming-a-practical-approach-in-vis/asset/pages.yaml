    \ after an error is caught. New numbers can be entered for multiplication.\n\n\
    # 14.2. The Try-Catch-Finally Structure\n\nIn the try-catch-finally statements,\
    \ there is a finally block in addition to the try and catch blocks. The code inside\
    \ the finally block executes regardless of the error. In other words, the code\
    \ lines in the finally block runs in both error-free or erroneous execution cases\
    \ of our main code written inside the try block. The template of the try-catch-finally\
    \ block is as follows:\n\n```\ntry\n{\n    //Code with possible error source\n\
    }\ncatch (Exception)\n{\n    //Code to be executed when an error occurs above\n\
    }\nfinally\n{\n    //Code to be executed regardless of the error\n}\n```"
  merge: -1
