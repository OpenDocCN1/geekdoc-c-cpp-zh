    variable_type[] newArray = new variable_type[number_of_elements]

    ```


    Code 10.2


    For example, the following code line creates a three element array having integer
    type of elements:


    ```

    int[] myIntArray = new int[3];

    ```


    Code 10.2


    We can also initialize an array during its declaration. For example, let''s create
    an integer array with elements 4, 55, 102:


    ```

    int[] myNewArray = {4, 55, 102};

