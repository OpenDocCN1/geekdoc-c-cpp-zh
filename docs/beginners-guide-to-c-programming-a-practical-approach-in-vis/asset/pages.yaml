    There are several other types but the following two are widely the used ones:


    +   - **bool**: This variable type is used to store only one of the two different
    values: true or false. We can think them as the answers to a yes-no question.
    The following is a bool type variable declaration:


    ```

    bool isBackgroundWhite = true;

    ```


