  \n7. 编写一个程序找到摄氏度和华氏相同的温度。从摄氏度转换为华氏度的公式是 `Fahrenheit = (9 * Celsius /5) + 32`。\n\n\
  # 编程项目\n\n编程项目比练习程序需要更多的解决解决，通常有多种解决方法。访问 [www.programminglab.com](http://www.programminglab.com)\
  \ 在线完成许多项目并获得即时反馈。\n\n1. 编写一个程序计算远程电话的费用。费用根据以下费率表确定：\n\n    - 周一至周五上午 `8:00` 到下午\
  \ `6:00` 之间的任何通话每分钟收取 `$0.40`。\n    - 周一至周五上午 `8:00` 之前或下午 `6:00` 之后的通话每分钟收取 `$0.25`。\n\
  \    - 周六或周日的任何通话每分钟收取 `$0.15`。\n\n输入包括星期几、通话开始时间和通话时长（分钟）。输出将是通话费用。时间要以 24 小时制输入，因此下午\
  \ 1:30 输入为\n\n```\n13:30\n```\n\n星期几将读入以下字符对之一，存储在两个类型为 `char` 的变量中：\n\n```\nMo\
  \ Tu We Th Fr Sa Su\n```\n\n确保允许用户使用大写或小写字母或两者的组合。分钟数将作为 `int` 类型的值输入。（你可以假设用户会将输入四舍五入到整数分钟数。）你的程序应包含一个循环，让用户重复此计算，直到用户表示完成。\n\
  \n2. （此项目需要你了解一些关于复数的基础知识，因此它只在你数学课上学过复数时才适用。）\n\n\n\n\n编写一个 C++ 程序来求解二次方程并以找到它的根。二次方程的根\n\
  \n```\nax2  + bx + c = 0\n```\n\n（其中 `a` 不为 0）由公式给出：\n\n```\n(−b ± sqrt(b2 − 4ac))\
  \ / 2a\n```\n\n判别式（`b² − 4ac`）的值决定了根的性质。如果判别式的值为零，则方程有一个实根。如果判别式的值为正，则方程有两个实根。如果判别式的值为负，则方程有两个复根。\n\
  \n该程序接受 `a`、`b` 和 `c` 的值作为输入并输出根。在输出复根时要尽可能有创意。包含一个循环，允许用户针对新的输入值重复此计算，直到用户表示她或他想结束程序。\n\
  \n### 3. 编写一个程序，接受一个四位阿拉伯（普通）数字表示的年份，并以罗马数字输出该年份。重要的罗马数字有：`V` 代表 5，`X` 代表 10，`L`\
  \ 代表 50，`C` 代表 100，`D` 代表 500，`M` 代表 1,000。记住，某些数字是通过使用一种罗马“数字”的减法形成的；例如，`IV` 是\
  \ 4，通过 `V` 减 `I` 产生，`XL` 是 40，`CM` 是 900，等等。几个示例年份：`MCM` 是 1900，`MCML` 是 1950，`MCMLX`\
  \ 是 1960，`MCMXL` 是 1940，`MCMLXXXIX` 是 1989。假设年份在 1000 到 3000 之间。你的程序应该包含一个循环，让用户重复此计算，直到用户表示她或他完成。\n\
  \n### 4. 编写一个给黑杰牌手打分的程序。在黑杰牌中，玩家接收两到五张牌。2 到 10 的牌每张得 2 到 10 分。面牌——J、Q、K——每张 10 分。目标是尽可能接近\
  \ 21 分而不超过 21 分。因此，任何超过 21 分的分被称为“爆牌（busted）”。王可以算作 1 或 11，以对用户更有利为准。例如，一个王和一张 10\
  \ 可以得 11 分或 21 分。由于 21 是更好的分，这手牌得 21 分。一个王和两个 8 可以得 17 分或 27 分。由于 27 是“爆牌”分，这手牌得\
  \ 17 分。\n\n用户被询问她或他有多少张牌，用户用整数 `2`、`3`、`4` 或 `5` 之一回答。然后用户被询问牌面值。牌值为 2 到 10、J、Q、K\
  \ 和 A。处理输入的一种好方法是使用 `char` 类型，这样输入牌 2 将读取为字符 `'2'`，而不是数字 `2`。将从 2 到 9 的值输入为字符 `'2'`\
  \ 到 `'9'`。将值 10、J、Q、K 和 A 的值输入为字符 `'t'`、`'j'`、`'q'`、`'k'` 和 `''a'`。（当然，用户不需要输入单引号内容）。确保允许大写和小写字母作为输入。\n\
  \n在读取这些值后，程序应将它们从字符值转换为数值牌分，并对王进行特殊处理。输出是 2 到 21（包含在内）之间的数字或单词 Busted。你可能会有一个或多个长的多路分支，使用\
  \ `switch` 语句或嵌套的 `if-else` 语句。你的程序应该包含一个循环，让用户重复此计算，直到用户表示她或他完成。\n\n### 5. 贷款利息按递减余额支付，因此利率为例如\
  \ 14% 的贷款成本可能远低于余额的 14%。编写一个程序接受贷款金额和利率作为输入，然后输出每月还款额和贷款余额，直到贷款还清。假设每月还款额为原始贷款金额的二十分，任何超过利息的金额都用于减少应还余额。因此，对于\
  \ 20,000 美元的贷款，每月还款额为 $1,000。如果利率为 10%，则每个月的利息是剩余余额的 10% 的十二分之一。第一个月（$20,000 的 10%)/12，即\
  \ $166.67 将作为利息，剩余的 $833.33 将余额减少到 $19,166.67。下个月的利息将是（$19,166.67 的 10%)/12，依此类推。还要让程序输出贷款期限内支付的总利息。\n\
  \n最后，确定原始贷款余额的简单年化百分比利息为多少。例如，如果 10,000 美元的贷款支付了 1,000 美元的利息，并且花费了 2 年，那么年化金额为 500\
  \ 美元。你的程序应该允许用户重复此计算，直到完成。\n\n### 6. 斐波那契数 F[n] 定义如下。F[0] 是 1，F[1] 是 1，且\n\n```\n\
  Fi+2 = Fi + Fi+1\n```\n\ni = 0, 1, 2 ... 也就是说，每个数字都是前两个数字之和。假设斐波那契数以这种率增长。如果没有死亡，则序列显示每个周期的数量。它需要两个周期才能成熟，然后每个周期繁殖一次。假设种群以这种率增长且周期为\
  \ 5 天。因此，如果种群初始大小为 10，那么 5 天后还是 10；10 天后是 20，15 天后是 30。编写一个程序接受初始种群大小（磅）和天数作为输入，并输出该天数后的数量。你的程序允许用户重复此计算。\n\
  \n### 7. e^x 的值可以通过以下和来近似\n\n```\n1 + x + x2/2! + x3/3! + ... + xn/n!\n```\n\n编写一个程序接受值\
  \ *x* 作为输入，并输出 n 取 1 到 100 时的和。程序还应该输出使用预定义函数 `exp` 计算的 e^x。`exp` 是预定义函数，使得 `exp`(x)\
  \ 返回 e^x 的近似值。`exp` 函数位于头文件 `cmath` 库中。你的程序应对新的 *x* 值重复计算，直到用户表示她或他完成。\n\n使用 `double`\
  \ 类型的变量来存储阶乘，否则可能会产生整数溢出（或安排你的计算以避免直接计算阶乘）。100 行输出可能无法舒适地显示在屏幕上。以一种能够在屏幕上显示所有 100\
  \ 个值的格式输出这些输出值。例如，你可能每行输出 10 个值。\n\n### 8. pi 的近似值可以使用下面的级数计算：\n\n```\npi = 4 [\
  \ 1 – 1/3 + 1/5 – 1/7 + 1/9 ... + ((–1)n)/(2n + 1) ]\n```\n\n编写一个 C++ 程序使用该级数计算\
  \ pi 的近似值。程序接受输入 `n` 来决定近似 pi 值的项数并输出近似值。包含一个循环，允许用户针对新值 `n` 重复此计算，直到用户表示她或他想结束程序。\n\
  \n\n\n\n## 9. 以下这个问题有时被称为“蒙提霍尔游戏节目问题”。你是一个电视游戏节目的参赛者，获得了一个赢得大奖的机会。你面前有三扇关闭的门。其中一门后面是一辆新汽车，另外两扇门后面是安慰奖。奖品的位置是随机选择的。节目主持人要求你选择一扇门，你选了一个。然而，在揭开你选择的门后的内容之前，主持人揭开了另外一扇带有安慰奖的门。此时，节目主持人问你是想坚持原来的选择，还是切换到另一扇关闭的门。为了最大化赢得汽车的概率，你应该做出哪种选择？坚持原来的选择还是切换门会有什么影响吗？\n\
  \n编写一个模拟程序来解决这个游戏节目问题。你的程序应该对该问题进行 10,000 次模拟运行，随机选择奖品的位置，并统计坚持原始选择赢得汽车的次数，以及切换门时赢得汽车的次数。输出两种策略的估计获胜概率。确保你的程序完全模拟了选择门、揭示其中扇然后切换的过程。不要对实际解决方案做出任何假设（例如，简单地假设获得奖品的概率是\
  \ 1/3 或 1/2）。\n\n附录 4。\n\n## 10. 重复第 2 章中的编程项目 13，但额外询问用户其属于以下哪类：\n\n1. 久坐不动\n2.\
