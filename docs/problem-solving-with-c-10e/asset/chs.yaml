  20. 这条指令的意思是什么？\n\n```cpp\n#include <iostream>\n```\n\n21. 以下 `#include` 指令是否有任何错误？\n\
  \n```\na.\t#include <iostream >\nb.\t#include < iostream>\nc.\t#include <iostream>\n\
  ```\n\n\n\n程序中的错误通常被称为 `bug`，而消除错误的过程被称为 `debugging`（调试）。这个术语的起源有一段丰富的历史。它出现在计算机的早期，当时计算机硬件极其敏感，且占据了整个房间。格蕾斯·默雷·霍珀（Grace\
  \ Murray Hopper，1906–1992）海军少将是“世界上第一台大型数字计算机的第三位程序员”（Denise W. Gurer, “Pioneering\
  \ women in computer science” CACM 38(1):45–54, January 1995）。当霍珀在哈佛大学教授霍华德·H·艾肯（Howard\
  \ H. Aiken）的指挥下操作哈佛 Mark I 时，一只不幸的蛾子导致继电器故障。霍珀和其他程序员将这只死的蛾子贴在日志中，并附上注释：“首次发现 bug\
  \ 的实际案例”。这本日志目前展列于弗吉尼亚州达尔格伦的海军博物馆。这是第一个有记录的案的计算机错误。艾肯教授会在空闲时间进入实验室，询问是否正在计算某些数字。程序员们会回答他们正在调试计算机。有关霍珀少将及计算领域其他人士的更多信息，请参见\
  \ Robert Slater 的 *Portraits in Silicon*（MIT Press, 1987）。今天，bug 指程序中的错误。在本节中，我们将描述三种主要的编程错误，并就如何纠正这些错误提供一些提示。\n\
  \n### 程序错误的种类\n\n编译器会捕获某些类型的错误，并在发现错误时写出错误信息。它能检测出所谓的 `syntax errors`（语法错误），因为这些错误在很大程度上是对编程语言语法（即文法规则）的违反，例如漏掉分号。\n\
  \n如果编译器发现你的程序包含语法错误，它会告知你错误可能发生在哪里，以及可能是什么类型的错误。当编译器说你的程序包含语法错误时，你可以确信它确实包含。然而，编译器在错误的位置或性质上可能是不正确的。它在确定错误位置（精确到一两行内）方面比在确定错误源头方面表现得更好。这是因为编译器在猜测你想要写下的内容，而且很容易猜错。毕竟，编译器无法读懂你的心思。第一个错误信息之后的后续信息在位置或性质上出现错误的概率更高。同样，这是因为编译器必须猜测你的意图。如果编译器的第一次猜测是错误的，这将影响它对后续错误的分析，因为该分析将基于一个错误的假设。\n\
  \n如果你的程序包含了直接违反你所用语言语法规则的内容，编译器会给你一个 `error message`（错误信息）。然而，有时编译器只会给你一个 `warning\
  \ message`（警告信息），这表示你所做的事情从技术上讲并没有违反编程语言的语法规则，但它足够反常，足以表明可能存在错误。当你收到警告信息时，编译器在说：“你确定你的意思是这个吗？”在在开发的这个阶段，你应该将每一个警告都视为错误，直到你的导师批准忽略该警告为止。\n\
  \n某些类型的错误计算机系统只有在程序运行时才能检测到。恰恰其妙的是，这些错误被称为 `run-time errors`（运行时错误）。大多数计算机系统会检测某些运行时错误并输出适当的错误信息。许多运行时错误与数值计算有关。例如，如果计算机尝试将一个数字除以零，通常就是一个运行时错误。\n\
  \n如果编译器通过了你的程序，且程序运行一次后没有出现运行时错误信息，这并不能保证你的程序是正确的。记住，编译器只会告诉你是否写了一个语法上（即文法上）正确的\
  \ C++ 程序。它不会告诉你程序是否执行了你想要它执行的操作。底层算法或将算法转换为 C++ 语言过程中的错误被称为 `logic errors`（逻辑错误）。例如，如果你在\
  \ Display 1.8 中的程序中错误地使用了加号 `+` 而不是乘号 `*`，那么就是一个逻辑错误。程序将正常编译并运行，但会给出错误的答案。如果编译器通过了你的程序且没有运行时错误，但程序运行不正常，那么你的程序无疑包含逻辑错误。逻辑错误是最难诊断的一种错误，因为计算机没有提供任何错误信息来帮助发现错误。不能合理要求它提供任何错误信息。对于计算机而言，你可能确实就是你所写的那样。\n\
  \n### 自测练习\n\n22. 三种主要的程序错误是什么？\n\n23. 编译器发现了哪些类型的错误？\n\n24. 如果你在程序中省略了一个标点符号（如分号），就会产生错误。这是哪种错误？\n\
