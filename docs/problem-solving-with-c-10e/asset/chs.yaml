  \ 是否返回正确的值。你的测试用例集应包含至少两个无效输入。\n\n### 9. 编写一个程序玩简化的骰子版二十点牌。不是从牌组中选择，而是通过掷掷 14 面骰子来代表一张牌。与房屋对战单回合游戏规则如下：\n\
