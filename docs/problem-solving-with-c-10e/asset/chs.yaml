  }\n```\n\n15. \n\n```cpp\nvoid BankAccount::update(int years)\n{     for (int count\
  \ = 1; count <= years; count++)\n        update( );\n}\n```\n\n# 练习题\n\n练习题通常可以通过直接应用本章介绍原理的短程序来解决。\n\
