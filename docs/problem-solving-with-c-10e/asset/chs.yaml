  \n`10 posts = 100 feet of fence / 10 feet between posts`\n\n当然，这会导致最后 10 英尺的栏没有柱子。你需要\
  \ `11 posts` 来提供 10 个柱子之间每个 10 英尺的间距，从而得到 100 英尺的栏杆。\n\n# 练习程序\n\n练习程序通常可以通过直接应用本章介绍的编程原理的短程序来解决。\n\
  \n1. 编写一个程序为剪刀石头布游戏评分。两个用户中的每一个都输入 `P`、`R` 或 `S`。程序宣布胜者以及判定胜者的依据：`纸压石头`、`石头破剪刀`、`剪刀剪纸`或`无人胜`。确保允许用户使用小写和大写字母。你的程序应包含一个循环，让用户继续玩，直到用户表示完成。\n\
  \n2. 编写一个程序计算循环信用账户的应付利息、总欠金额和最低还款。程序接受账户余额作为输入，然后加上利息得到总欠金额。费率表如下：前 `$1,000` 的利息为\
  \ 1.5%，超过该部分的任何金额为 1%。如果总金额为 `$10` 或更少，则最低还款为总金额；否则，为 `$10` 或总欠金额的 10%，以较大者为准。你的程序应包含一个循环，让用户重复此计算，直到用户表示完成。\n\
  \n3. 编写一个占星程序。用户输入生日，程序返回该生日的星座和星运。月份可以以 `1` 到 `12` 之间的数字输入。然后增强你的程序，如果生日距离相邻星座仅有一天或两天，程序宣布该生日处于“交界点”（cusp），并输出该最临近相邻星座的星运。这个程序将有一个很长的多路分支。为每个星座编写一段星运。你的程序应包含一个循环，让用户重复此计算，直到用户表示完成。\n\
  \n星座和日期如下：\n\n| 白羊座 | 3 月 21 日–4 月 19 日 |\n| 金牛座 | 4 月 20 日–5 月 20 日 |\n| 双子座 |\
  \ 5 月 21 日–6 月 21 日 |\n| 巨蟹座 | 6 月 22 日–7 月 22 日 |\n| 狮子座 | 7 月 23 日–8 月 22 日 |\n\
  | 处女座 | 8 月 23 日–9 月 22 日 |\n| 天秤座 | 9 月 23 日–10 月 22 日 |\n| 天蝎座 | 10 月 23 日–11\
  \ 月 21 日 |\n| 射手座 | 11 月 22 日–12 月 21 日 |\n| 摩羯座 | 12 月 22 日–1 月 19 日 |\n| 水瓶座 |\
  \ 1 月 20 日–2 月 18 日 |\n| 双鱼座 | 2 月 19 日–3 月 20 日 |\n\n4. 同元素的星座最兼容。占星术中有 4 种元素，每个元素有\
  \ 3 个星座：火（白羊、狮子、射手）、土（金牛、处女、摩羯）、风（双子、天秤、水瓶）、水（巨蟹、天蝎、双鱼）。\n\n根据某些占星术的说法，你与自己的星座以及所在元素中的另外两个星座最合。例如，白羊座与其他白羊座以及另外两个火元素星座（狮子和射手）最合。\n\
