  \ 23 根牙签堆开始。玩家轮流每次抽取 1、2 或 3 根牙签。取走最后一根牙签的人输掉游戏。编写一个人机对战程序来玩“23”游戏。人类总是先手。当轮到电脑时，它应该根据以下规则进行：\n\
  \n* 如果剩余超过 4 根牙签，则电脑应该抽取 `4 - X` 根牙签，其中 `X` 是人类上一回合抽取的牙签数量。\n* 如果剩余 2 到 4 根牙签，则电脑应该抽取足够的牙签以只留\
