  \n\n\n\n\n### 3. 这项练习程序要求你阅读关于指针算术的可选章节。完成函数 `isPalindrome`，使得当字符串 `cstr` 是回文（正读反读都相同）时返回\
  \ `true`，如果不是则返回 `false`。该函数使用了 `cstring` 库。\n\n```cpp\nbool isPalindrome(char*\
  \ cstr)\n{\n   char* front = cstr;\n   char* back = cstr + strlen(cstr)−1;\n   while\
  \ (front < back)\n   {\n      // 在此处补全代码\n   }\n   return true;\n}\n```\n\n这是一个用于快速简单测试的\
  \ `main` 函数示例：\n\n```cpp\nint main()\n{\n    char s1[50] = \"neveroddoreven\";\n\
  \    char s2[50] = \"not a palindrome\";\n    cout << isPalindrome(s1) << endl;\
  \ // true\n    cout << isPalindrome(s2) << endl; // false\n    return 0;\n}\n```\n\
