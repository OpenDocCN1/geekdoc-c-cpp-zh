  \ > 0)\n{\n    cout << x << endl;\n    x = x + 3;\n}\n```\n\n34. 编写一个完整的 C++ 程序，输出\
  \ 1 到 20 的数字，每行一个。该程序不执行其他操作。\n\n## 2.5 程序风格\n\n> 在极其重要的事情上，风格而非诚意才是至关重要的。\n\n>\
  \ 奥斯卡·威尔尔，《不可易事的认的风华》\n\n我们示例程序中的所有变量名都是为了暗示它们的用途而选择的。示例程序按照特定的格式布局。例如，声明和语句的缩进程度都是相同的。这些以及其他风格问题不仅仅具有美学意义。一个编写时仔细注意风格的程序更容易阅读、更容易纠正、更容易修改。\n\
  \n### 缩进\n\n程序的布局应该使得那些在自然上被视为一组的元素看起来也像一组。这样做的一种方法是在逻辑上被视为独立的部分之间空出一行。缩进还可以帮助使程序的结构更加清晰。语句内部语句应该缩进。特别是\
  \ `if-else` 语句、`while` 循环和 `do-while` 循环应该像我们的示例程序那样或以类似的方式进行缩进。\n\n大括号 `{}` 决定了程序结构的大部分。将每个大括号单独放在一行（正如我们一直这样做的那样），很容易找到匹配的对。注意我们对某些大括号进行了缩进。当一对大括号嵌套在另一对括号内部时，嵌套的大括号比外层的大括号缩进更多。回看显示\
  \ 2.16 中的程序。`while` 循环体的大括号比程序 `main` 部分的大括号缩进更多。\n\n关于应该在何处放置大括号至少有两种学派。第一种（我们在本书中使用的）是为每个大括号留出单独的一行。这种形式最易读。第二种观点认为，一对括号的起始括号不需要单独占一行。如果使用得当，这种方法可以节省空间。重点是使用一种能够清晰展示程序的风格。\n\
  \n### 注释\n\n为了使程序易于理解，你应该在关键位置包含说明。这些说明被称为注释。C++ 和大多数其他语言都有包含注释的规定。使用 `//` 符号指示开始。编译器简单地忽略\
  \ `//` 之后的任何内容。如果你想要覆盖多行的注释，请在每行都放置 `//`。（实际上，C++ 支持多行注释）。\n\n具体在注释中包含什么取决于你的具体情况。我们将在书中不再包含如此长的注释，但你应该始终在程序开始处使用类似的注释。\n\
  \nC++ 中还有另一种插入注释的方法。`/*` 和 `*/` 之间的任何内容都被视为注释并被编译器忽略。与需要额外行的 `//` 注释不同，`/* */` 注释可以跨多行，如下：\n\
  \n```cpp\n/*这是一个跨三行的注释。\n注意第二行没有注释*/\n```\n\n`/* */` 类型可以插入到程序的任何位置。然而，不应将其放在会干扰布局的地方。通常，注释只放在行尾或单独成行。\n\
  \n对于最好使用哪种类型的注释存在不同意见。任何一种类型（`//` 类型或 `/* */` 类型）只要使用得当，都是有效的。我们在书中将使用 `//` 类型。\n\
  \n等等，很难说一个程序应该包含多少注释。唯一的正确答案是“恰好足够”，这对于初学者来说显然传达的信息有限。需要一些经验来感受何时最好包含注释。每当某些内容重要且直而易见时，它值得注释。然而，注释过多和注释过少一样糟糕。一个每行都有注释的程序会被注释淹没，从而隐藏了程序的结构。像这样的注释对理解没有任何帮助，不应出现在程序中：\n\
  \n```cpp\ndistance = speed * time; //计算行驶的距离\n```\n\n\n\n\n\n# 显示 2.17 注释与命名常量\n\
  \n图 2.17 完整备用文本\n\n### 常量的命名\n\n计算机程序中的数字有两个问题。第一个问题是它们没有携带助记值。例如，当程序中遇到数字 `10`\
  \ 时，它没有提供关于其意义的提示。如果该程序是一个银行程序，它可能代表分机构的数量，也可能是总行柜员窗口的数量。为了理解程序，你需要知道每个常量的意义。第二个问题是，当程序需要更改某些数字时，更改往往会引入错误。假设\
  \ `10` 在银行程序中出现了 12 次，其中 4 次代表分机构的数量，8 次代表总行柜员窗口的数量。当银行开辟一家新分机构且需要更新程序时，很有可能导致某些本应该改为\
  \ `11` 的 `10` 没有被修改，或者某些不该被修改的 `10` 却被修改了。避免这些问题的方法是给每个数字命名，并在程序中使用名称而不是数字。例如，一个银行程序可能有两个名为\
  \ `BRANCH_COUNT` 和 `WINDOW_COUNT` 的常量。这两个数字的值可能都是 `10`，但当银行开辟新分机构时，你更新程序只需要更改 `BRANCH_COUNT`\
  \ 的定义即可。\n\n在 C++ 程序中如何为数字命名？一种方法是将变量初始化为该数字值，如下例：\n\n```\nint BRANCH_COUNT = 10;\n\
  int WINDOW_COUNT = 10;\n```\n\n然而，这种命名数字常量的方法有一个问题：你可能会无意中改变其中一个变量的值。C++ 提供了一种标记已初始化变量的方法，使其无法被更改。如果你的程序尝试更改这些变量之一，就会产生错误条件。要标记变量声明以使其变量值不可更改，请在声明前加上\
  \ `const` 单词（它是 *constant* 的缩写）。例如：\n\n```cpp\nconst int BRANCH_COUNT = 10;\nconst\
  \ int WINDOW_COUNT = 10;\n```\n\n如果变量的类型相同，可以将上述几行合并为一个声明，如下：\n\n```cpp\nconst int\
  \ BRANCH_COUNT = 10, WINDOW_COUNT = 10;\n```\n\n但是，大多数程序员发现将每个名称定义放在单独的一行更清晰。`const`\
  \ 单词通常被称为**修饰符**，因为它修改（限制）了正在声明的变量。\n\n使用 `const` 修饰符声明的变量通常被称为**命名常量**。C++ 语言并不要求用全大写字母命名常量，但这是\
  \ C++ 程序员的标准做法。实际的常量值（上述示例中的 10）被称为**字面量常量**。\n\n一旦以这种方式命名了数字，该名称就可以用于任何允许数字的地方，它的意义与它所命名的数字完全相同。要更改命名常量，你只需要更改\
  \ `const` 变量声明中的初始化值。例如，`BRANCH_COUNT` 所有出现处的含义，只需通过更改 `BRANCH_COUNT` 声明中 `10` 的初始化值，轻而易举地从\
  \ `10` 更改为 `11`。\n\n虽然程序允许使用未命名的数字常量，但你应该少使用它们。对于众知的、易于识别且不可更改的数量，使用未命名的数字常量是有意义的，例如用\
  \ 100 表示一米中的厘米数。然而，所有其他数字常量都应该按照我们刚刚描述的方式命名。这会使你的程序更易读、更易更改。\n\n显示 2.17 包含一个说明声明修饰符\
  \ `const` 用法的简单程序。\n\n### 自练习\n\n35. 下述 `if-else` 语句可以编译并运行，没有任何问题。然而，它的布局与我们在程序使用的其他\
