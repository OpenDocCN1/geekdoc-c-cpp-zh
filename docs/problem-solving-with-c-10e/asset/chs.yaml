  \ `do-while` 循环的程序见显示 2.15 在在那个 `do-while` 循环中，与任何 `do-while` 循环一样，首先发生的情况是执行循环体中的语句。在循环体的第一次迭代之后，`do-while`\
  \ 语句的行为与 `while` 循环相同。检查布尔表达式。如果布尔表达式为真，则再次执行循环体；再次检查布尔表达式，以此此类推。\n\n## 增自减运算符\n\
  \n`while` 语句执行时首先发生的情况是检查布尔表达式。如果当 `while` 语句开始时布尔表达式为假，则循环体将永远不会执行。这正是显示 2.12 中示例对话\
  \ 3 中发生的情况。在许多编程场景中，你可能希望循环体有零次执行。例如，如果你的 `while` 循环正在读取一个包含考试中所有不及格分的列表，而没有人不及格，那么你就希望循环体执行零次。\n\
  \n正如我们刚刚注意到的，`while` 循环可能会执行零次循环体，这通常是你想要的。反相反，如果你知道在*所有情况下*你的循环体都应该至少执行一次，那么你可以使用\
  \ `do-while` 语句。`do-while` 语句与 `while` 语句类似，但循环体始终至少执行一次。`do-while` 语句的语法见显示 2.14。一个带有示例\
  \ `do-while` 循环的程序见显示 2.15。在那个 `do-while` 循环中，与任何 `do-while` 循环一样，首先发生的情况是执行循环体中的语句。在循环体的第一次迭代之后，`do-while`\
  \ 语句的行为与 `while` 循环相同。检查布尔表达式。如果布尔表达式为真，则再次执行循环体；再次检查布尔表达式，以此此类推。\n\n二元运算符有两个操作数。一元运算符只有一个操作数。`++`\
  \ 运算符称为增运算符，`--` 运算符称为减运算符。\n\n## 编程示例 余额\n\n假设你有一张余额为 $50 的银行卡，假设银行每月收取你 2% 的利息。在不还款的情况下，经过多少个月你的余额会超过\
  \ $100？解决这个问题的一种方法是简单地读取每月语句并计算流逝的月份。一个月后，余额为 $50 加上 $50 的 2%，即 $51。两个月后，余额为 $51\
  \ 加上 $51 的 2%，即 $52.02。三个月后，余额为 $52.02 加上 $52.02 的 2%，以此此类推。通常情况下，每个月余额增加 2%。程序可以通过存储在名为\
  \ `balance` 的变量中跟踪余额。每月 `balance` 值的变化计算如下：\n\n```\nbalance = balance + 0.02 * balance\
  \ ;\n```\n\n如果我们重复此操作直到 `balance` 的值达到（或超过）`100.00` 并计算重复次数，我们就知道余额达到 `100.00` 需要的时间。为了这样做，我们需要另一个变量来计算余额更改的次数。让我们这个新变量命名为\
  \ `count`。因此，我们的 `while` 循环最终体将包含以下语句：\n\n```\nbalance = balance + 0.02 * balance;\n\
  count++;\n```\n\n为了让这个循环运行正常，我们必须在执行循环之前给变量 `balance` 和 `count` 赋予适当的值。在这种情况下，我们可以在声明变量时对其初始化。完整程序见显示\
  \ 2.16。\n\n然而，大多数丰富的程序员会使用自减运算符而不是赋值语句，因此 `while` 循环将如下：\n\n```\nwhile (countDown\
  \ > 0)\n{\n    cout << \"Hello \";\n    countDown--;\n}\n```\n\n\n\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint main( )\n{\n    double  balance = 50.00;\n\
  \    int  count = 0;\n    cout << \"This program tells you how long it takes\\n\"\
  \n         << \"to accumulate a debt of $100, starting with\\n\"\n         << \"\
  an initial balance of $50 owed.\\n\"\n         << \"The interest rate is 2% per\
  \ month.\\n\";\n\n    while (balance < 100.00)\n    {\n        balance = balance\
  \ + 0.02 * balance;\n        count++;\n    }\n\n    cout << \"After \" << count\
  \ << \" months,\\n\";\n    cout.setf(ios::fixed);\n    cout.setf(ios::showpoint);\n\
  \    cout.precision(2);\n    cout << \"your balance due will be $\" << balance <<\
  \ endl;\n    return 0;\n}\n```\n\n### 示例对话\n\n```\nThis program tells you how long\
  \ it takes\nto accumulate a debt of $100, starting with\nan initial balance of $50\
  \ owed.\nThe interest rate is 2% per month.\nAfter 36 months,\nyour balance due\
  \ will be $101.99\n```\n\n# 显示 2.16 信用卡收费程序\n\n### 自测练习\n\n28. 下列代码（嵌入在一个正确的程序中且\
