  \ );\n    return 0;\n}\n```\n\n# 作为函数参数的流\n\n流可以作为函数的参数。唯一的限制是函数的形式参数必须是引用传递（call-by-reference）。流参数不能是值传递参数。例如，Display\
  \ 6.6 中的 `makeNeat` 函数有两个流参数：一个是 `ifstream` 类型，用于连接到输入文件的流；另一个是 `ofstream` 类型，用于连接到输出文件的流。我们将在接下来的两个节中讨论该程序的\
  \ Display 6.6 中的其他特性。\n\n![插图展示了一个说明输出格式化指令的代码段。](img/ch6_p29.png)\n\n# Display\
  \ 6.6 输出格式化\n\n图 6.6 完整替代文本\n\n\n\n\n在文件开头放置单个 `using` 指令是解决我们问题的最简单的方法，但许多专家并不认为这是最佳解决方案，因为它不允许使用两个具有相同名的命名空间，而这正是命名空间的全部目的。在此时，我们只使用了\
  \ `std` 命名空间⁶，所以这没有问题。在第 12 章中，我们将教你另一种通过参数和命名空间解决此问题的方法。这种其他方法允许你使用任何类型的多个命名空间。\n\
  \n许多程序员倾向于在程序文件的开头放置 `using` 指令。例如，考虑以下 `using` 指令：\n\n```\nusing namespace std;\n\
  ```\n\n书中的许多程序并没有在程序文件的开头放置这个 `using` 指令。相反，这个 `using` 指令被放在每个需要 `std` 命名空间的函数定义开头（紧跟在左大括号之后）。这种示例可以在显示\
  \ 6.3 所示。一个更好的例子在显示 5.11 所示。书中到为止出现的所有程序，以及后续几乎所有的程序，如果只为 `std` 命名空间有一个 `using`\
  \ 指令，并且该 `using` 指令紧跟在 `include` 指令之后，它们的行为将完全相同，就像显示 6.6 所示。对于 `std` 命名空间，`using`\
  \ 指令可以安全地放置在文件的开头（在几乎所有情况下）。对于其他某些命名空间，单个 `using` 指令并不总是足够，但你在一段时间内不会看到这些情况。\n\n\
  我们主张将 `using` 指令放在函数定义内部（或某些其他较小的代码单元内部），这样它就不会干扰任何其他可能的 `using` 指令。这训练了你正确使用命名空间，以便在你编程生涯的后期编写更复杂的代码做准备。与此同时，当我们发现遵循该规则对于我们正在讨论的其他问题来说过于负担重时，我们有时也会违反这条规则。如果你正在上某门课程，请按照老师的要求操作。否则，你可以在放置\
  \ `using` 指令的位置上具有一定的自由度。\n\n# 编程示例：清理文件格式\n\n显示 6.6 中的程序从文件 `rawdata.dat` 获取输入，并以整洁的格式将其输出写到屏幕和文件\
  \ `neat.dat`。该程序从 `rawdata.dat` 文件复制数字到 `neat.dat` 文件，但它使用格式化指令以一种整洁的方式写入它们。数字每行一个，写入一个宽度为\
  \ 12 的字段中，这意味着每个数字前面都有足够的空格，使得空格加上数字占据 12 个空间。数字是以普通计数法写入的；也就是说，它们不是以 `e-` 科学计数法写入的。每个数字小数点后保留五位数字，并带有正号或负号。屏幕的输出与文件\
  \ `neat.dat` 的输出相同，不同是屏幕输出多了一行宣布程序正在结束。该程序使用名为 `makeNeat` 的函数，该函数为输入文件流和输出文件流带有形式参数。\n\
