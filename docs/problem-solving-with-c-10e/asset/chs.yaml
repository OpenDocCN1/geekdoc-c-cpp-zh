  \ 第 10 章 中讨论。关于 `string` 类的更多细节在 第 8 章 中讨论。\n\n### 类型兼容性\n\n作为一般规则，你不能将一种类型的值存储在另一种类型的变量中。例如，大多数编译器会反对以下内容：\n\
  \n```cpp\nint intVariable;\nintVariable = 2.99;\n```\n\n问题在于类型不匹配。常量 `2.99` 是 `double`\
  \ 类型，而变量 `intVariable` 是 `int` 类型。不幸的是，并不是所有的编译器对上述赋值语句的反应都是相同的。有些会发出错误消息，有些只会给出警告消息，而有些编译器完全不会反对。但即使编译器允许你使用这种赋值，它可能也会给\
  \ `intVariable` 赋予 *int* 值 `2`，而不是 `3`。\n\n如果你使用 `double` 类型的变量代替常量 `2.99`，就会出现同样的问题。大多数编译器也会反对以下内容：\n\
  \n```cpp\nint intVariable;\ndouble doubleVariable;\ndoubleVariable = 2.00;\nintVariable\
  \ = doubleVariable;\n```\n\n\n\n\n\n值 `2.00` “恰好相等”这一事实并没有区别。值 `2.00` 的类型是 `double`，而不是\
  \ `int` 类型。正如你很快将看到的，你可以在前面对变量 `doubleVariable` 的赋值中将 `2.00` 替换为 `2`，但即使那样也不足以让该赋值变得合法。变量\
  \ `intVariable` 和 `doubleVariable` 的类型不同，这正是问题的根源。\n\n即使编译器允许你在赋值语句中混合类型，在大多数情况下，你不应该这样做。这样做会使你的程序的可移植性变差，并且可能会引起困惑。例如，如果你的编译器允许你将\
  \ `2.99` 赋值给一个 `int` 类型的变量，该变量将接收到值 `2` 而不是 `2.99`，这可能会引起困惑，因为程序似乎说值将是 `2.99`。\n\
  \n在某些特殊情况下，允许将一种类型的值赋值给另一种类型的变量。将 `int` 类型的值赋值给 `double` 类型的变量是可以接受的。例如，以下代码既是合法的，也符合良好的风格：\n\
  \n```\ndouble doubleVariable;\ndoubleVariable = 2;\n```\n\n上述代码将把名为 `doubleVariable`\
  \ 的变量的值设置为 `2.0`。\n\n虽然通常这样做是个坏主意，但你可以将像 `65` 这样的 `int` 值存储在 `char` 类型的变量中，也可以将像\
  \ `'Z'` 这样的字母存储在 `int` 类型的变量中。对于许多用途来说，C 语言将字符视为小整数；可能遗憾的是，C++ 继承了 C 的这一点。允许这样做的原因是\
  \ `char` 类型变量消耗的内存比 `int` 类型变量少，因此通过对 `char` 类型的变量进行算术运算可以节省一些内存。然而，当你处理整数时，使用 `int`\
  \ 类型更为清晰；当你处理字符时，使用 `char` 类型则更为清晰。\n\n通用规则是，你不能将一种类型的值放在另一种类型的变量中——尽管看起来违反规则的例外似乎比遵守规则的情况还要多。即使编译器并不严格强制执行这一规则，它也是一个值得遵循的良好规则。将一种类型的数据放在另一种类型的变量中会导致问题，因为值必须被转换为相应类型的值，而该值可能不是你预期的。\n\
