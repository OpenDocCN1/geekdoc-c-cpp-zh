  \ `double` 参数并返回其中最大的值。\n\n# 编程项目\n\n编程项目比练习程序需要更多的问题解决能力，通常有多种解决方法。访问 www.myprogramminglab.com\
  \ 在线完成许多编程项目并获得即时反馈。\n\n1. 编写一个程序，计算新房在所有权第一年的年度税后成本。成本计算为年度贷款成本减去税收节省。输入应为房屋价格和首付款。年度贷款成本可以估算为初始贷款余额的\
  \ 3% 用于还本，加上初始贷款余额的 6% 利息。初始贷款余额为价格减首付款。假设边际税率为 35%，并假设利息支出可以抵税。因此，税收节省是利息支付的 35%。你的程序应至少使用两个函数定义，并允许用户根据意愿重复此计算。\n\
  \n2. 编写一个程序询问用户身高、体重和年龄，然后根据以下公式计算服装尺码：\n\n    *   帽子尺寸 = 体重（磅）除以身高（英寸），并将结果乘以 2.9。\n\
  \n\n\n\n\n*   外套尺寸（胸围，英寸） = 高乘以体重除以 288，然后根据年龄超过 30 岁每 10 年增加 1/8 英寸。（注意：调整仅在满 10\
  \ 年后发生。因此，30 到 39 岁之间没有调整，但 40 岁时增加 1/8 英寸。）\n*   腰围（英寸） = 体除以 5.7，然后根据年龄超过 28 岁每\
  \ 2 年增加 1/10 英寸。（注意：调整仅在满 2 年后发生。因此，29 岁没有调整，但 30 岁时增加 1/10 英寸。）\n\n为每个计算编写函数。你的程序应允许用户根据其意愿重复此计算。\n\
  \n3.  修改你的编程项目 2 程序，使其也能计算用户 10 年后的外套尺寸和腰围尺寸。\n\n4.  编写一个程序输出歌曲《墙上有九十九瓶啤酒》的歌词。你的程序应该用英文打印瓶子的数量，而不是数字。例如：\n\
