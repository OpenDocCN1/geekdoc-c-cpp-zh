  \n* 四位数字各不\n* 千位数字是十位数字的三倍\n* 该数字是奇数\n* 数字之和为 27\n\n编写一个使用循环来寻找该地址的程序。\n\n## 14.\
  \ 你玩有一种增强现实游戏，可以捕捉并获取糖果。你需要 12 颗糖果来进化。进化会让你获得糖果。每次进化还会让你获得 500 分。为了支持该游戏，编写一个程序输入你拥有的糖果数量和进化次数。你可以假设初始数量为\
  \ 0。程序应该输出通过转移可以获得的最大经验值。\n\n例如，如果你从 71 颗糖果和 53 次进化开始，程序可以输出以下内容（注意：还有许多转移和进化的序列，最终数字可能不同，但总经验应该是相同的）：\n\
  \n```\nTransfer 37 and 0 resulting in 108, 16, and 0\nEvolve 9 to get 4500 points\
  \ and resulting in 9, 7, and 9\nTransfer 0 and 9 resulting in 18, 7, and 0\nEvolve\
  \ 1 to get 500 points and resulting in 7, 6, and 1\nTransfer 4 and 1 resulting in\
  \ 12, 2, and 1\nTotal experience points = 5500\n```\n\n\n\n\n记住，编写程序的方法是首先设计程序将使用的方法，并用英文写出该方法，就像这些指令是给人类办事员遵循的一样。正如我们在第\
  \ 1 章中提到的，这组指令被称为算法。设计算法的良好攻击计划是将要完成的任务分解为几个子任务，将这些子任务中的每一个都分解为更小的子任务，依此类推。最终，子任务变得非常小，在`C++`中实现起来轻而易举。这种方法被称为`自顶向下设计`（top-down\
  \ design）。该方法有时也被称为`逐步细化`（stepwise refinement），或者形象地被称为`分治法`（divide and conquer）。\n\
  \n使用自顶向下的方法，你通过将程序的任务分解为子任务并通过子算法解决这些子任务来设计程序。在你的`C++`程序中保留这种自顶向下的结构可以使程序更容易理解，在需要时更容易修改，而且正如将变得明显的，它也更容易编写、测试和调试。`C++`与大多数编程语言一样，具有在程序内部包含独立部分的功能。在其他编程语言中，这些子部分被称为`子程序`（subprograms）、`过程`（procedures）或`方法`（methods）。在`C++`中，这些子部分被称为`函数`（functions）。\n\
  \n使用函数将编程任务划分为子任务的优点是程序变得更容易理解、测试、调试和维护。此外，划分任务允许不同的人处理不同的子任务。在制作非常大的程序（例如编译器或办公管理系统）时，如果要在合理的时间内完成，就需要这种团队合作。我们将通过向你展示如何使用他人编写的函数开始对函数的讨论。\n\
  \n# 4.2 预定义函数\n\n`C++` 自带了预定义函数库，你可以在程序中使用这些函数。在我们向你展示如何定义函数之前，我们先首先向你展示如何使用一些已经为你定义的函数。\n\
  \n# 使用预定义函数\n\n我们将使用 `sqrt` 函数来阐明如何使用预定义函数。`sqrt` 函数计算一个数字的平方根。（一个数的平方根是该数乘以自身后产生你最初开始的那个数字。例如，9\
  \ 的平方根是 3，因为 `3²` 等于 9。）函数 `sqrt`从一个数字（例如 `9.0`）开始，并计算其平方根，在本例中为 `3.0`。函数开始时的值被称为它的`参数`（argument）。它计算的值被称为`返回值`（value\
  \ returned）。某些函数可能有多个参数，但没有一个函数的返回值超过一个值。如果你把函数看作一个小程序，那么参数就类比于输入，而返回值则类比于输出。\n\n\
  在程序中使用函数的语法非常简单。要将名为 `theRoot` 的变量设置为 `9.0` 的平方根，你可以使用以下赋值语句：\n\n```\ntheRoot =\
  \ sqrt(9.0);\n```\n\n表达式 `sqrt(9.0)` 称为`函数调用`（function call）（或者如果你想表现得更专业一点，你也可以称它为`函数调用`（function\
  \ invocation））。函数调用中的参数可以是常量（如 `9.0`）、变量或更复杂的表达式。函数调用是一个表达式，可以像任何其他表达式一样使用。只要在允许使用函数返回值指定类型表达式的地方，你就可以使用函数调用。例如，`sqrt`的返回值类型为\
  \ `double`。因此，以下写法是合法的（尽管可能有些浪费）：\n\n```\nbonus = sqrt(sales)/10;\n```\n\n`sales`\
  \ 和 `bonus` 是通常为 `double` 类型的变量。函数调用 `sqrt(sales)` 是一个整体，就像被包含在括号中一样。因此，这条赋值语句等同于\n\
  \n```\nbonus = (sqrt(sales))/10;\n```\n\n你也可以直接在 `cout` 语句中使用函数调用，如下所示：\n\n```\n\
  cout << \"The side of a square with area \" << area\n     << \" is \" << sqrt(area);\n\
  ```\n\n显示 4.1\n 8    {\n 9        const double COST_PER_FT = 2.50;\n 10       double\
  \ budget, area, length_side;\n 11       cout << \"Enter the budget for dog house:\
  \ \";\n 12       cin >> budget;\n 13       area = budget / COST_PER_FT;\n 14\n 15\
  \       length_side = sqrt(area);\n 16       cout << \"The side of a square with\
  \ area \" << area\n 17            << \" is \" << length_side << endl;\n 18     \
  \  return 0;\n 19   }\n```\n\n***示例对话***\n```\nEnter the budget for dog house: 150\n\
  The side of a square with area 60 is 8\n```\n\n# 显示 4.1 函数调用\n\n注意，显示 4.1 中的程序还有另一个新元素：\n\
  \n```\n#include <cmath>\n```\n\n这一行看起来非常像\n\n```\n#include <iostream>\n```\n\n而且，事实上，这两行是相同类型的内容。正如我们之前提到的，`#include\
  \ <iostream>` 指令要求同时也使用以下 `using` 指令：\n\n```\nusing namespace std;\n```\n\n\n\n\
  这是因为 `cin` 和 `cout` 等名称的定义是在 `iostream` 中提供的，这些名称被定义为 `std` 命名空间的一部分。大多数标准库都是如此。如果你有一个标准库的\
  \ `include` 指令，例如：\n\n```cpp\n#include <cmath>\n```\n\n那么你可能需要 `using` 指令：\n\n```cpp\n\
  using namespace std;\n```\n\n当你有多个 `include` 指令时，不需要使用多次此 `using` 指令。\n\n通常情况下，使用库只需要在你的程序文件中放置一个该库的\
  \ `include` 指令和一个 `using` 指令即可。如果仅通过 `include` 指令和 `using` 指令就能运行，你就不需要担心其他事情。然而，对于某些系统上的库，你可能需要向编译器提供额外的指令，或者显式运行链接器程序来链接该库。早期的\
  \ C 和 C++ 编译器不会自动搜索所有库进行链接。细节因系统而异，因此你必须检查你的手册或咨询本地专家，以确定具体需要什么。\n\n有些人会告诉你，`include`\
  \ 指令不是由编译器处理的，而是由`preprocessor`（预处理器）处理的。他们是对的，但这种区别更多是文字游戏，而不是你需要担心的问题。在几乎所有的编译器上，预处理器会在你编译程序时被自动调用。\n\
  \n一些预定义函数在显示 4.2 中描述；更多预定义函数在附录 4 中。注意绝对值函数 `abs` 和 `labs` 在头文件为 `cstdlib` 的库中，因此任何使用其中任一个函数的程序必须包含以下指令：\n\
  \n```cpp\n#include <cstdlib>\n```\n\n列出的所有其他函数都在头文件为 `cmath` 的库中，就像 `sqrt` 一样。\n\
  \n| `Name` | `Description` | `Type of Arguments` | `Type of Value Returned` | `Example`\
  \ | `Value` | `Library Header` |\n| --- | --- | --- | --- | --- | --- | --- |\n\
  | `sqrt` | `平方根` | `double` | `double` | `sqrt(4.0)` | `2.0` | `cmath` |\n| `pow`\
  \ | `幂` | `double` | `double` | `pow(2.0,3.0)` | `8.0` | `cmath` |\n| `abs` | `int\
  \ 的绝对值` | `int` | `int` | `abs(-7)`, `abs(7)` | `7`, `7` | `cstdlib` |\n| `labs`\
  \ | `long 的绝对值` | `long` | `long` | `labs(-70000)`, `labs(70000)` | `70000`, `70000`\
  \ | `cstdlib` |\n| `fabs` | `double 的绝对值` | `double` | `double` | `fabs(-7.5)`,\
  \ `fabs(7.5)` | `7.5`, `7.5` | `cmath` |\n| `ceil` | `进位（向上取整）` | `double` | `double`\
  \ | `ceil(3.2)`, `ceil(3.9)` | `4.0`, `4.0` | `cmath` |\n| `floor` | `舍入（向下取）` |\
  \ `double` | `double` | `floor(3.2)`, `floor(3.9)` | `3.0`, `3.0` | `cmath` |\n\
  | `srand` | `随机数生成器种子` | `none` | `none` | `srand()` | `none` | `cstdlib` |\n| `rand`\
  \ | `随机数` | `none` | `int` | `rand()` | `0-RAND_MAX` | `cstdlib` |\n\n# 显示 4.2 预定义函数\n\
  \n注意还有三个绝对值函数。如果你想得到 `int` 类型数字的绝对值，使用 `abs`；如果你想得到 `long` 类型数字的绝对值，使用 `labs`；如果你想得到\
  \ `double` 类型数字的绝对值，使用 `fabs`。更令事情复杂的是，`abs` 和 `labs` 在头文件为 `cstdlib` 的库中，而 `fabs`\
  \ 在头文件为 `cmath` 的库中。`fabs` 是 `floating-point absolute value`（浮点绝对值）的缩写。记住，带有小数部分的数字（例如\
  \ `double` 类型数字）通常被称为浮点数。\n\n另一个预定义函数的示例是 `pow`，它在头文件为 `cmath` 的库中。`pow` 函数可以用于幂运算。\n\
  \n# 随机数生成\n\n游戏和模拟通常需要随机数。C++ 的随机数生成器取决于库的实现，但它与我们简单生成器的基本原理相同，通过了一些增强来实现随机均匀分布。\n\
  \n¹ 大多数系统自 1970 年 1 月 1 日以来经过的秒数。\n\n\n\n\n```cpp\n#include <cstdlib>\n#include\
  \ <ctime>\n...\nsrand(time(0));\n```\n\n我们可以通过调用函数 `rand` 来获取随机数，它会返回一个 0 到 `RAND_MAX`\
  \ 之间的整数。`RAND_MAX` 是在 `cstdlib` 中定义的常量，保证至少为 32767 或更高。通常，0 到 `RAND_MAX` 之间的数字并不是我们需要的，在这种情况下可以通过取模和加法对随机数进行缩放。例如，为了模拟掷六面骰子，可以使用以下代码：\n\
  \n```cpp\nint die = (rand() % 6) + 1;\n```\n\n随机数对模 6 得到一个 0 到 5 之间的数字。加 1 后得到一个在\
  \ 1 到 6 之间的随机整数。\n\n只初始化一次随机数生成器是非常重要的。常见的错误是每次生成随机数时都调用 `srand`。如果将 `srand` 和 `rand`\
  \ 都放在循环中，那么可能的结果是一系列完全相同的数字，因为计算机运行速度足够快，在重复调用 `srand` 时，时间值可能不会发生变化。\n\n# 类型强制转换\n\
  \n记住 `9/2` 是整数除法，其结果为 `4`，而不是 `4.5`。如果你希望除法产生一个 `double` 类型的答案（即包含小数点点后的小数部分），那么除法中的两个数字中至少有一个必须是\
  \ `double` 类型。例如，`9/2.0` 的求值结果为 `4.5`。如果两个数字中的一个是常量，你只需要在其中一个（或两个）数字后面添加一个小数点和一个零，那么除法就会产生一个包含小数点后数字的数值。\n\
  \n但如果除法中的两个操作数都是变量，如下所示呢？\n\n```cpp\nint totalCandy, numberOfPeople;\n double candyPerPerson;\n\
  <程序以某种方式将 totalCandy 的值设置为 9\n    并将 numberOfPeople 的值设置为 2。\n    程序是如何做到的并不重要。>\n\
  candyPerPerson = totalCandy/numberOfPeople;\n```\n\n除非你将变量 `totalCandy` 或 `numberOfPeople`\
  \ 其中一个的值转换为 `double` 类型的值，否则除法的结果将是是 `4`，而不是应有的 `4.5`。变量 `candyPerPerson` 是 `double`\
  \ 类型这一事实并没有帮助。除法得到的值 `4` 在存储到变量 `candyPerPerson` 之前会被转换为 `double` 类型的值，但那时已经晚了。`4`\
  \ 将被转换为 `4.0`，`candyPerPerson` 的最终值将是 `4.0` 而不是 `4.5`。如果除法中的数量之一是常量，你可以通过添加小数点和小将常量转换为\
  \ `double` 类型，但在这种情况下，两个数量都是变量。幸运的是，有一种从 `int` 类型转换为 `double` 类型的方法，你可以将其用于常量或变量。\n\
  \n在 C++ 中，你可以告诉计算机将 `int` 类型的值转换为 `double` 类型的值。编写“将值 `9` 转换为 `double` 类型的值”的方式是：\n\
  \n```cpp\nstatic_cast<double>(9)\n```\n\n符号 `static_cast<double>(9)` 是一种预定义的函数，它将某种其他类型（如\
  \ `9`）的值转换为 `double` 类型的值（在本例中为 `9.0`）。像 `static_cast<double>(9)` 这样的表达式被称为类型转换。你可以用变量或其他表达式来代替\
  \ `9`。你可以使用 `double` 以外的类型名称来获取到 `double` 其他类型的类型转换，但我们将该主题推迟以后。\n\n例如，在下面我们使用类型转换将\
  \ `9` 的类型从 `int` 变为 `double`，从而将 `answer` 的值设置为 `4.5`：\n\n```cpp\ndouble answer;\n\
  \    answer =  static_cast<double>(9)/2;\n```\n\n对常量（如 `9`）应用类型强制转换可以让你的代码更易读，因为它让你的意图更加清晰。但对\
  \ `int` 类型常量的类型转换并没有提供任何额外的功能。当你想要将 `9` 转换为 `double` 类型时，可以使用 `9.0` 代替 `static_cast<double>(9)`。然而，如果除法只涉及变量，那么类型转换可能是你唯一的合理选择。通过类型转换，我们可以重写之前的示例，使得变量\
  \ `candyPerPerson` 获得正确的值 `4.5` 而不是 `4.0`；为了实现这一点，我们唯一需要的更改是将 `totalCandy` 替换为 `static_cast<double>(totalCandy)`，如下所示：\n\
