  \   day = \"04\";\n    year = \"06\";\n    date = month + day + year;\n    cout\
  \ << date << endl;\n    ```\n\n### 赋值语句\n\n有一种简写将赋值运算符（`=`）和算术运算符结合，使得给定变量可以通过加、减、乘或除以指定值来改变其值。通用形式为：\n\
  \n```\nVariable Op = Expression\n```\n\n`Op` 是如 `+`、`*` 或 `*` 这样的运算符。`Expression`\
  \ 可以是另一个变量、常量或更复杂的算术表达式。以下是示例：\n\n| 示例 | 等于： |\n| --- | --- |\n| `count += 2;` |\
  \ `count = count + 2;` |\n| `total −= discount;` | `total = total – discount;` |\n\
  | `bonus *= 2;` | `bonus = bonus * 2;` |\n| `time /= rushFactor;` | `time = time\
  \ / rushFactor;` |\n| `change %= 100;` | `change = change % 100;` |\n| `amount *=\
  \ cnt1 + cnt2;` | `amount = amount * (cnt1 + cnt2);` |\n\n## 2.4 简单控制流\n\n> “如果你认为我们是蜡人，”他说，“你应该付钱的，你知道的。蜡人不是为了……”\n\
  \n（此处省略原文重复的乱码文本，已按要求不重复输出）\n\n语句执行的顺序通常被称为**控制流**（flow of control）。在本节中，我们将添加一些**分支机制**（branching\
  \ mechanism）。\n\n### 分支机制\n\n有时程序需要选择两个动作中的一个。例如，假设你想为员工设计一个程序，我们需要判断是否超过 40 小小时。\n\
  \n如果 `hours > 40` 为真，执行以下语句：\n\n```\nrate * hours\n```\n\n如果不是，则执行以下语句：\n\n```cpp\n\
  if (condition) {\n    // 如果真执行动作\n} else {\n    // 如果假执行动作\n}\n```\n\n等一下，`if-else`\
  \ 语句的写法如下：\n\n```\nif (condition) {\n    // 如果真执行动作\n} else {\n    // 如果假执行动作\n\
  }\n```\n\n在我们的示例中，代码看起来如下：\n\n```cpp\nif (hours > 40) {\n    grossPay = rate * 40\
  \ + 1.5 * rate * (hours - 40);\n} else {\n    grossPay = rate * hours;\n}\n```\n\
  \n`condition` 是一个求值为真或假的表达式。如果 `condition` 为真，则执行 `if` 块中的代码。如果 `condition` 为假，则执行\
  \ `else` 块中的代码。\n\n`if-else` 语句可以使用 `else if` 语句扩展以处理两个以上的条件：\n\n```cpp\nif (condition1)\
  \ {\n    // 如果 condition1 为真执行动作\n} else if (condition2) {\n    // 如果 condition2\
  \ 为真执行动作\n} else {\n    // 如果所有条件都为假执行动作\n}\n```\n\n这允许程序处理多种可能的路径。例如，假设我们要根据收入计算税率：\n\
  \n```cpp\nif (income < 10000) {\n    taxRate = 0.10;\n} else if (income < 20000)\
  \ {\n    taxRate = 0.20;\n} else {\n    taxRate = 0.30;\n}\n```\n\n另一种处理多种条件的方法是\
  \ `switch` 语句，它通常用于与一组常量进行比较：\n\n```cpp\nswitch (expression) {\n    case value1:\n\
  \        // expression 等于 value1\n        break;\n    case value2:\n        // expression\
  \ 等于 value2\n        break;\n    default:\n        // 如果都不匹配\n}\n```\n\n`break`\
  \ 语句是重要的，因为它在执行动作后退出 `switch` 块。如果没有 `break`，程序将继续执行后续的情况。\n\n### 循环\n\n循环是一种多次执行代码块的控制结构。C++\
  \ 中有多种循环，包括 `while` 循环、`do-while` 循环和 `for` 循环。\n\n### `while` 循环\n\n`while` 循环在条件为真时重复执行代码块。\n\
  \n```\nwhile (condition) {\n    // 重复代码\n}\n```\n\n条件在每次执行之前检查。如果条件从开始就为假，则不会执行代码块。\n\
  \n```cpp\nint i = 0;\nwhile (i < 5) {\n    cout << i << endl;\n    i++;\n}\n```\n\
  \n### `do-while` 循环\n\n`do-while` 循环与 `while` 循环相似，但在检查条件之前，代码块会至少执行一次。\n\n```\n\
  do {\n    // 重复代码\n} while (condition);\n```\n\n```cpp\nint i = 0;\ndo {\n    cout\
  \ << i << endl;\n    i++;\n} while (i < 5);\n```\n\n### `for` 循环\n\n`for` 循环通常用于预先知道重复执行代码块次数的情况。它由三部分组成：初始化、条件和递增。\n\
  \n```\nfor (initialization; condition; increment) {\n    // 重复代码\n}\n```\n\n```cpp\n\
  for (int i = 0; i < 5; i++) {\n    cout << i << endl;\n}\n```\n\n在使用循环计数器时，`for`\
  \ 循环是编写 `while` 循环的一种简洁方式。\n\n### 循环总结\n\n循环是自动化任务的工具。它们允许你编写处理大型数据集的简洁高效的代码。理解\
  \ `while`、`do-while` 和 `for` 循环之间的区别对于任何 C++ 程序员来说都是关重要的。\n\n\n\n\n\n`if-else` 语句有两种形式，如显示\
  \ 2.9 所示。第一种是 `if-else` 语句的简单形式；第二种形式将在名为“复合语句”的小节中讨论。在所示的第一种形式中，两个语句可以是任何可执行的语句。`Boolean_Expression`（布尔表达式）是一个测试，可以通过检查它来判断其为真还是假，即判断它是否满足条件。例如，在前面的\
  \ `if-else` 语句中`Boolean_Expression` 为：\n\n```\nhours > 40\n```\n\n当程序运行到 `if-else`\
  \ 语句时，嵌入的两个语句中恰好会执行一个。如果 `Boolean_Expression` 为真（即满足条件），则执行 `Yes_Statement`（是语句）；如果\
  \ `Boolean_Expression` 为假（即不满足条件），则执行 `No_Statement`（否语句）。注意，`Boolean_Expression`\
  \ 必须用括号起来（这是 C++ 中 `if-else` 语句语法规则的要求）。同样注意，`if-else` 语句内部嵌入了两个较小的语句。\n\n### 每个备选分支单一语句\n\
  \n```\n 1    if (Boolean_Expression)\n 2        Yes_Statement\n 3    else\n 4  \
  \      No_Statement\n```\n\n### 每个备选分支语句序列\n\n```\n 5    if (Boolean_Expression)\n\
   6    {\n 7        Yes_Statement_1\n 8        Yes_Statement_2\n 9          ...\n\
  10        Yes_Statement_Last\n11    }\n 12    else\n 13    {\n 14        No_Statement_1\n\
  15        No_Statement_2\n 16          ...\n17        No_Statement_Last\n18    }\n\
  ```\n\n# 显示 2.9 `if-else` 语句语法\n\n`Boolean expression`（布尔表达式）是任何为真或假的表达式。`if-else`\
  \ 语句始终包含一个 `Boolean_Expression`。`Boolean_Expression` 最简单的形式由两个表达式（如数字或变量）组成，通过显示\
  \ 2.10 && (x < 7)\n```\n\n当两个比较使用 `&&` 连接时，只要两个比较都为真，整个表达式就为真（即两个都满足条件）；否则整个表达式为假。\n\
  \n你也可以使用“或”（or）运算符组合两个比较，在 C++ 中拼写为 `||`。例如，如果 `y` 小于 `0` 或 `y` 大于 `12`，则以下表达式为真：\n\
  \n```\n(y < 0) || (y > 12)\n```\n\n当两个比较使用 `||` 连接时，只要其中一个比较为真，整个表达式就为真；否则整个表达式为假。\n\
  \n记住，当你使用 `if-else` 语句时，布尔表达式必须包含在括号内。例如，当你使用 `&&` 连接两个比较时：\n\n```\nif (x > 2 &&\
  \ x < 7)\n```\n\n如果你想对布尔表达式取反，在它前面加上 `!` 运算符。例如，`!(x < y)` 表示 `x` 不小于 `y`。\n\n```\n\
  if (!(x < y))\n```\n\n### 复合语句\n\n你通常希望 `if-else` 语句的分支执行多条语句。为了实现这一点，请像显示 2.9 所示，用一对括号\
  \ `{` 和 `}` 将分支语句括起来。位于括号内的语句列表被称为**复合语句**。C++ 将复合语句视为单个语句，并可以用任何可以使用单一语句的地方。\n\n\
  有时你希望 `if-else` 语句中的一个备选分支什么都不做。在 C++ 中可以通过省略 `else` 部分来实现。这类语句被称为 `if` 语句，以区别于\
  \ `if-else` 语句。例如，以下是一个 `if` 语句：\n\n```\nif (sales >= minimum)\n    salary = salary\
  \ + bonus;\n```\n\n如果 `sales` 的值大于或等于 `minimum` 的值，则执行赋值语句。另一方面，如果 `sales` 的值小于\
  \ `minimum`，则嵌入的赋值语句不执行，程序直接跳到下一语句。\n\n# 显示 2.11 用于 if-else 的复合语句\n\n[显示 2.11] 包含两个复合语句，嵌入在一个\
  \ `if-else` 语句中。\n\n```\n 1    if (my_score > your_score)\n 2    {\n 3        cout\
  \ << \"I win!\\n\";\n 4        wager = wager + 100;\n 5    }\n 6    else\n 7   \
  \ {\n 8        cout << \"I wish these were golf scores.\\n\";\n 9        wager =\
  \ 0;\n 10   }\n```\n\n\n\n\n`if-else` 的语法规则要求“是”语句和“否”语句必须恰好是一条语句。如果某个分支需要多个语句，则必须将这些语句封装在大括号中以将其转换为一个复合语句。如果在\
  \ `if` 和 `else` 之间放置了两个或多个未加括号的语句，编译器将给出错误信息。\n\n### 自测练习\n\n21. 编写一个 `if-else`\
