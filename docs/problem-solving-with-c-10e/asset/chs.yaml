  \ 函数应该将标题插入名称中。无需考虑 `#include` 指令或命名空间细节。\n\n# 15.2 继承细节\n\n> 细节决定成败。\n\n俗语。本节介绍了关于继承的某些更为微妙的细节。大多数主题仅与使用动态数组或指针或其他动态数据的类相关。\n\
  \n# 不被继承的函数\n\n通常规则是，如果 `Derived` 是基类为 `Base` 的派生类，那么 `Base` 类中的所有“普通”函数都是 `Derived`\
  \ 类的继承成员。然而，有一些特殊函数在实际操作中是不被继承的。我们已经看到，从实际角度来看，构造函数是不被继承的，私有成员函数是不被继承的。析构函数实际上也不被继承的。\n\
  \n在拷贝构造函数的情况下，它是不被继承的，但如果你不在派生类中（或任何类中）定义拷贝构造函数，C++ 会自动为你生成一个拷贝构造函数。然而，这个默认拷贝构造函数只是简单地复制成员变量的内容，对于成员变量中包含指针或动态数据的类，它无法正常工作。因此，如果你的类成员变量涉及指针、动态数组或其他动态数据，那么你应该为该类定义一个拷贝构造函数。无论该类是否为派生类，这一点都适用。\n\
  \n赋值运算符 `=` 也不被继承的。如果基类 `Base` 定义了赋值运算符，但派生类 `Derived` 没有定义赋值运算符，那么 `Derived` 类将拥有一个赋值运算符，但它将是\
  \ C++ 创建的默认赋值运算符（当你没有定义 `=` 时创建）；它与在 `Base` 中定义的基类赋值运算符没有任何关系。\n\n构造函数、析构函数和赋值运算符不被继承是自然现象。为了正确执行它们的任务，它们需要基类不具备的信息。为了正确执行其功能，它们需要知道派生类中引入的新成员变量。\n\
  \n# 派生类中的赋值运算符和拷贝构造函数\n\n重载的赋值运算符和构造函数不被继承。然而，它们可以在派生类的重载赋值运算符和拷贝构造函数的定义中使用，并且在几乎所有情况下都必须使用。\n\
  \n在派生类中重载赋值运算符时，你通常会使用来自基类的重载赋值运算符。我们将展示如何编写此类操作的代码大纲。为了帮助理解代码大纲，请记住重载的赋值运算符必须定义为类的成员函数。\n\
  \n如果 `Derived` 是派生自 `Base` 的类，那么 `Derived` 类重载赋值运算符的定义通常将如下所示开始：\n\n```cpp\nDerived&\
  \ Derived::operator =(const Derived& rightSide)\n{\n    Base::operator =(rightSide);\n\
  ```\n\n定义体内的第一行代码是对 `Base` 类重载赋值运算符的调用。这处理了继承的成员变量及其数据。随后，重载赋值运算符的定义将继续设置在类 `Derived`\
  \ 定义中引入的新成员变量。\n\n在派生类中定义拷贝构造函数也有类似的情况。如果 `Derived` 是派生自 `Base` 的类，那么 `Derived`\
  \ 类拷贝构造函数的定义通常会使用 `Base` 类的拷贝构造函数来设置继承的成员变量及其数据。代码通常如下所示：\n\n```cpp\nDerived::Derived(const\
  \ Derived& object)\n               : Base(object), <可能还有更多初始化>\n{\n```\n\n调用基类拷贝构造函数\
  \ `Base(object)` 设置了正在创建的 `Derived` 类对象的继承成员变量。注意，由于 `object` 的类型是 `Derived`，它也是\
  \ `Base` 类型；因此，`object` 是 `Base` 类拷贝构造函数的合法参数。\n\n当然，除非基类拥有功能正确的赋值运算符和拷贝构造函数，否则这些技术是无法运作的。这意味着基类的定义必须包含一个拷贝构造函数，并且默认创建的赋值运算符对基类有效，或者基类必须有一个适当的重载赋值运算符。\n\
  \n# 派生类中的析构函数\n\n如果基类有一个功能正确的析构函数，那么在派生自基类的类中定义一个功能正确的析构函数是容易的。当派生类的析构函数被调用时，它会自动调用基类的析构函数，因此不需要显式编写对基类析构函数的调用；这总是会自动发生。因此，派生类只需要担心对派生类中添加的成员变量（以及它们指向的任何数据）使用\
  \ `delete`。处理继承成员变量是基类析构函数的工作。\n\n如果类 B 派生自类 A，类 C 派生自类 B，那么当类 C 对象超出范围时，首先调用类 C\
  \ 的析构函数，然后调用类 B 的析构函数，最后调用类 A 的析构函数。注意析构函数的调用顺序与构造函数的调用的顺序相反。\n\n### 自测练习题\n\n7.\
  \ 你知道重载的赋值运算符和拷贝构造函数不被继承。这是否意味着如果你不在派生类中定义重载赋值运算符或拷贝构造函数，那么该派生类将没有任何赋值运算符和拷贝构造函数？\n\
