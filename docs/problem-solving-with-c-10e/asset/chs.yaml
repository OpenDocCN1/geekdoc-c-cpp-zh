  \ `49193` 登录了实验室 `3` 的 `2` 号工作站，用户 `99577` 登录了实验室 `4` 的 `1` 号工作站，那么你的系统可能会显示如下内容：\n\
  \n```\n实验室编号 计算机工作站\n1          1: empty 2: empty 3: empty 4: empty 5: empty\n2\
  \          1: empty 2: empty 3: empty 4: empty 5: empty 6: empty\n3          1:\
  \ empty 2: 49193 3: empty 4: empty\n4          1: 99577 2: empty 3: empty\n```\n\
  \n创建一个菜单，允许用户登录、注销并显示状态。程序持续直到用户选择退出。\n\n6. 动态数组的一个问题是数组一旦创建，大小无法更改。例如，你可能想从数组中添加或删除元素。这个项目要求你模拟\
  \ `vector` 的行为。\n\n首先，编写以下函数：\n\n```cpp\nstring* addEntry(string *dynamicArray,\
  \ int &size, string newEntry);\n```\n\n该函数应创建一个比 `dynamicArray` 大一个数组，将 `dynamicArray`\
  \ 中的所有元素复制到新数组中，在数组末尾添加新元素，增加 `size`删除 `dynamicArray` 并返回新数组。\n\n```cpp\nstring*\
  \ deleteEntry(string *dynamicArray, int &size, string entryToDelete);\n```\n\n该函数应在\
  \ `dynamicArray` 中搜索 `entryToDelete`。如果没有找到，忽略请求并返回未修改的 `dynamicArray`。如果找到，创建一个比\
  \ `dynamicArray` 小一个数组。将除 `entryToDelete` 外的所有元素复制到新数组，删除 `dynamicArray`，递减 `size`\
  \ 并返回新数组。\n\n通过向数组添加和删除多个名称并输出数组内容来测试你的函数。你需要将返回的数组赋值回 `main` 函数中的动态数组变量。\n\n7.\
  \ 如果 C++ 没有内置二维数组的功能呢？可以使用一维数组的封装函数来模拟它们。基本思想所示。考虑以下二维数组：\n\n```cpp\nint matrix[2][3];\n\
  ```\n\n它可以可视化为表格：\n\n| `matrix[0][0]` | `matrix[0][1]` | `matrix[0][2]` |\n| `matrix[1][0]`\
  \ | `matrix[1][1]` | `matrix[1][2]` |\n\n二维数组可以映射到一维数组的存储中，每行存储在连续的内存位置（你的编译器实际上使用类似的方法将二维数组映射到内存）。\n\
  \n```cpp\nint matrix1D[6];\n```\n\n| `matrix[0][0]` | `matrix1D[0][1]` | `matrix1D[0][2]`\
  \ | `matrix1D[1][0]` | `matrix1D[1][1]` | `matrix1D[1][2]` |\n\n在这里，映射如下：\n\n```\n\
  `matrix[0][0]` 将存储在 `matrix1D[0]`\n`matrix[0][1]` 将存储在 `matrix1D[1]`\n`matrix[0][2]`\
  \ 将存储在 `matrix1D[2]`\n`matrix[1][0]` 将存储在 `matrix1D[3]`\n`matrix[1][1]` 将存储在 `matrix1D[4]`\n\
  `matrix[1][2]` 将存储在 `matrix1D[5]`\n```\n\n基于这个思想，完成以下函数的定义：\n\n```cpp\nint* create2DArray(int\
  \ rows, int columns);\n```\n\n\n\n\n\n这创建了一个一维动态数组来模拟二维数组，并返回该一维动态数组的指针。\n\n*  \
  \ `rows` 是二维数组中所需的行数。\n*   `columns` 是二维数组中所需的列数。\n*   返回值：一个指向一维动态数组的指针，该数组的大小足够容纳一个大小为\
  \ `rows * columns` 的二维数组。\n\n注意，`int ptr = create2DArray(2,3);` 创建的数组类似于 `int ptr[2][3];`\
  \ 创建的数组。\n\n```cpp\nvoid set(int *arr, int rows, int columns,\n         int desired_row,\
  \ int desired_column, int val);\n```\n\n这会将 `val` 存储在模拟二维数组中位置 `desired_row`, `desired_column`\
  \ 处。如果所需的索引无效，函数应打印错误消息并退出。\n\n*   `arr` 是用于模拟二维数组的一维数组。。\n*   `rows` 是二维数组的总行数。\n\
  *   `columns` 是二维数组的总列数。\n*   `desired_row` 是调用者想要访问的行的索引（从 0 开始）。\n*   `desired_column`\
  \ 是调用者想要访问的列的索引（从 0 开始）。\n*   `val` 是存储在 `desired_row` 和 `desired_column` 处的值。\n\
  \n```cpp\nint get(int *arr, int rows, int columns,\n        int desired_row, int\
  \ desired_column);\n```\n\n这返回模拟二维数组中位置 `desired_row`, `desired_column` 处的值。如果所需的索引无效，函数应打印错误消息并退出。\n\
  \n*   `arr` 是用于模拟二维数组的一维数组。\n*   `rows` 是二维数组的总行数。\n*   `columns` 是二维数组的总列数。\n*\
  \   `desired_row` 是调用者想要访问的行的索引（从 0 开始）。\n*   `desired_column` 是调用者想要访问的列的索引（从 0\
  \ 开始）。\n\n创建一个合适的测试程序，调用所有三个函数。\n\n8. 编写一个程序，输出作业学生成绩的直方图。该程序以整数形式输入每个学生的成绩，并存储在\
  \ `vector` 中（在[第 8 章]中介绍）。持续输入成绩，直到用户输入 `-1` 为止。然后程序扫描 vector 并计算直方图。在计算直方图时，成绩的最小值为\
  \ `0`，但你的程序应该确定用户输入的值。使用动态数组存储直方图，并将直方图输出到控制台。例如，如果输入是：\n\n```\n20\n30\n4\n20\n\
  30\n30\n-1\n```\n\n那么输出应该是：\n\n```\nNumber of 4's:   1\nNumber of 20's:  2\nNumber\
  \ of 30's:  3\n```\n\n# 10 定义类\n\n> “时间到了，”海象说，\n>\n> “谈论许多事情：\n>\n> 鞋——和船——和密封蜡——\n\
  >\n> 卷菜——和国王——”\n> 刘易斯·卡罗尔，《爱丽镜游》\n\n## 引言\n\n在[第 6 章]中，你学习了如何使用类和对象，但还没有学习如何定义类。在本章中我们将向你展示如何定义自己的类。类是一种数据类型。你可以像使用预定义数据类型（如\
  \ `int`、`char` 和 `ifstream`）一样使用你定义的类。然而，除非你正确地定义类，否则它们不会像预定义数据类型那样表现良好。因此，我们花费大量时间解释什么是良好的类定义，并提供一些技术，帮助你以符合现代编程规范的方式来定义类。\n\
  \n在介绍类之前，我们将首先介绍 `structures`（也称为 `structs`）。当我们像这里介绍的那样使用结构时，结构是一种简化的类，结构将被证明是理解类的基石。\n\
  \n### 前提条件\n\n本章使用了从[第 2 章]到[第 6 章]的内容。\n\n# 10.1 结构\n\n正如我们所说，对象是一个变量，而类是一种数据类型。因此，类的定义应该告诉你\
  \ (1) 可以包含哪些变量 (2) 成员函数。我们将分两步处理类的定义。\n\n# 用于多样化数据的结构\n\n有时，拥有一不同类型的值并将该集合视为单个项目是有用的。例如，考虑一个银行存款，它通常被称为\
  \ `CD`。`CD` 自然具有三部分数据：账户余额、利率和期限。前两项可以用 `double` 表示，月份数可以用 `int` 表示。\n\n\n\n\n\n\
  ```\nEnter account balance: $100.00\nEnter account interest rate: 10.0\nEnter the\
  \ number of months until maturity\n(must be 12 or fewer months): 6\nWhen your CD\
  \ matures in 6 months,\nit will have a balance of $105.00\n```\n\n# 显示 10.1 结构定义\n\
  \n结构定义如下：\n\n```\nstruct CDAccount\n{\n    double balance;\n    double interestRate;\n\
  \    int term; // 到到期的月数\n};\n```\n\n关键字 `struct` 表明这是一个结构体类型定义。标识符 `CDAccount`\
  \ 是该结构类型的名称。结构类型的名称被称为**结构标签（structure tag）**。该标签可以是任何合标识符（但不是关键字）。虽然 C++ 语言并不强制要求这种约定，但结构标签通常使用大小写字母混合编写，并以大写字母开头。在大括号\
  \ `{}` 内部声明的标识符被称为**成员名（member names）**。如示例所示，结构类型定义以大括号 `}` 和分号结束。\n\n结构定义通常放置在任何函数定义之外（方式与全局常量声明放在所有函数定义之外相同）。该结构类型对于结构定义之后的所有代码都是可用的。\n\
  \n一旦给出了结构类型定义，就可以像使用预定义类型 `int`、`char` 等一样使用该结构类型。例如，以下代码将声明两个名为 `myAccount` 和 `yourAccount`\
  \ 的变量，它们的类型均为 `CDAccount`：\n\n```\nCDAccount myAccount, yourAccount;\n```\n\n结构变量可以像任何其他变量一样存储值。一个**结构值（structure\
  \ value）**是一组被称为**成员值（member values）**的较小值的集合。在结构定义中声明的每个成员名都对应一个成员值。例如，一个 `CDAccount`\
  \ 类型的值由三个成员值集合组成：两个 `double` 类型的值和一个 `int` 类型的值。共同组成结构值的成员值存储在*成员变量（member variables）*中，我们将在下文中讨论它们。\n\
  \n每个结构类型都指定了一个成员名列表。在显示 10.1 中，结构 `CDAccount` 有三个成员名 `balance`、`interestRate` 和\
  \ `term`。这些成员名中的每一个都可以用于提取作为较大结构变量一部分的较小变量。这些较小的变量被称为**成员变量**。成员变量的指定是通过给出结构变量名后跟一个点（即句号），然后是成员名来实现的。例如，如果\
  \ `account` 是一个 `CDAccount` 结构变量（如在显示 10.1)中声明），那么结构变量 `account` 以下三个成员变量：\n\n```\n\
  account.balance\naccount.interestRate\naccount.term\n```\n\n前两个成员变量的类型为 `double`，最后一个类型为\
  \ `int`。这些成员变量可以像任何其他相同类型的变量一样被使用。例如，可以使用以下三个赋值语句为上述成员变量赋值：\n\n```\naccount.balance\
  \ = 1000.00;\naccount.interestRate = 4.7;\naccount.term = 11;\n```\n\n这三条语句的结果在显示\
  \ 10.2 中进行了图示。成员变量可以使用普通变量的所有使用方式。例如，显示 10.1 中程序中的以下这行代码会将成员变量 `account.balance`\
  \ 中的值与普通变量 `interest` 中的值相加，然后将结果放在成员变量 `account.balance` 中：\n\n![一张插图显示了代码段和“成员值”的分配。](img/p548-1.png)\n\
  \n# 显示 10.2 成员值\n\n图 10.2 完整替代文本\n\n```\naccount.balance = account.balance + interest;\n\
  ```\n\n注意，你通过使用点运算符来指定结构变量的成员变量，与你在第 6 章中使用它的方式相同。\n\n# 作为函数参数的结构\n\n函数可以拥有结构类型的值传递参数和/或结构类型的引用传递参数。例如，显示\
  \ 10.1 中的程序包含一个名为 `getData` 的函数，该函数具有一个 `CDAccount` 结构类型的引用传递参数。\n\n结构类型也可以作为函数返回值的类型。例如，以下代码定义了一个接受适当参数并返回\
  \ `CDAccount` 类型值的函数：\n\n```\nCDAccount shrinkWrap(double theBalance,\n        \
  \             double theRate, int theTerm)\n{\n    CDAccount temp;\n    temp.balance\
  \ = theBalance;\n    temp.interestRate = theRate;\n    temp.term = theTerm;\n  \
  \  return temp;\n}\n```\n\n注意类型为 `CDAccount` 的局部变量 `temp`；`temp` 用于构建一个完整的结构值，然后由函数返回。一旦定义了函数\
  \ `shrinkWrap`，你就可以如下所示为 `CDAccount` 类型的变量赋值：\n\n```\nCDAccount newAccount;\nnewAccount\
  \ = shrinkWrap(10000.00, 5.1, 11);\n```\n\n# 编程提示 使用分级结构\n\n有时，拥有成员本身是较小结构的结构是合理的。例如，一个名为\
  \ `PersonInfo` 的结构类型可以用于存储人的身高、体重和出生日期，其定义如下：\n\n\n\n\n\n```\nstruct Date\n{\n \
  \    int month;\n     int day;\n     int year;\n};\nstruct PersonInfo\n{\n    double\
  \ height; //in inches\n    int weight; //in pounds\n    Date birthday;\n};\n```\n\
  \n按照通常的方法声明了一个类型为 `PersonInfo` 的结构体变量：\n\n```\nPersonInfo person1;\n```\n\n如果结构体变量\
  \ `person1` 的值已设置为某人的出生日期，则可以如下所示将该人的出生年份输出到屏幕：\n\n```\ncout << person1.birthday.year;\n\
  ```\n\n读取此类表达式的方法是从左到右的，并且非常仔细。从左端开始，`person1` 是一个类型为 `PersonInfo` 的结构体变量。要获取名为\
  \ `birthday` 的成员变量，如下所示使用点运算符：\n\n```\nperson1.birthday\n```\n\n该成员变量本身是一个类型为 `Date`\
  \ 的结构体变量。因此，该成员变量也拥有成员变量。通过添加点符号和成员变量名（如 `year`），可以获取结构体变量 `person1.birthday` 的成员变量，从而产生之前所示的表达式\
  \ `person1.birthday.year`。\n\n# 初始化结构体\n\n你可以在声明结构体时对其进行初始化。要给结构体变量赋值，可以在它后面跟随一个等号和一组括在大括号中的成员值列表。例如，在前面的小节中给出了日期的结构类型定义：\n\
  \n```\nstruct Date\n{\n    int month;\n    int day;\n    int year;\n};\n```\n\n\
  一旦定义了类型 `Date`，你就可以如下声明并初始化名为 `dueDate` 的结构体变量：\n\n```\nDate dueDate = {12, 31,\
  \ 2004};\n```\n\n务必注意，初始化值的顺序必须与结构类型定义中成员变量的顺序对应。在这个示例中，`dueDate.month` 接收第一个初始化值\
  \ `12`，`dueDate.day` 接收第二个值 `31`，`dueDate.year` 接收第三个值 `2004`。\n\n如果初始化值多于 `struct`\
  \ 成员，则是一个错误。如果初始化值少于 `struct` 成员，则按顺序使用提供的值初始化数据成员。每个没有初始化值的数据成员将被初始化为该变量相应类型的零值。\n\
  \n### 自测练习\n\n1. 给定以下结构体和结构体变量声明：\n\n    ```\n    struct TermAccount\n    {\n  \
