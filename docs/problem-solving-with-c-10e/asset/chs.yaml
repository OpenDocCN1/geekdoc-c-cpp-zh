  \ 类型。4. 是否可以使用运算符重载来改变整数 `+` 的行为？为什么？\n\n# 用于自动类型转换的构造函数\n\n如果你的类定义包含了适当的构造函数，系统将执行类型转换。例如，如果你的程序包含了\
  \ Display 11.5 中的 `Money` 类定义，你可以在程序中使用以下代码：\n\n```cpp\nMoney baseAmount(100, 60),\
  \ fullAmount;\nfullAmount = baseAmount + 25;\nfullAmount.output(cout);\n```\n\n\
  输出将是\n\n```\n$125.60\n```\n\n上面的代码看起来足够简单且自然，但有一个微妙的点。`baseAmount + 25` 表达式中的 `25`\
  \ 并不是相应的类型。在 Display 11.5 中，我们只重载了运算符 `+` 以便与两个 `Money` 类型的值使用。我们没有重载 `+` 以便与一个\
  \ `Money` 类型的值和一个整数使用。常量 `25` 是整数，不是 `Money` 类型。常量 `25` 可以被视为 `int` 类型或 `long` 类型，但除非类定义某种方式告诉系统如何将整数转换为\
  \ `Money` 值，否则 `25` 不能作为 `Money` 类型的值使用。系统知道 `25` 代表 $25.00 的唯一方法是我们包含了一个接受 `long`\
  \ 类型单一参数的构造函数。当系统看到表达式\n\n```\nbaseAmount + 25\n```\n\n它首先检查运算符 `+` 是否已为 `Money`\
  \ 类型值和整数的组合重载。由于没有这种重载，系统接着查找是否存在接受单一整数参数的构造函数。如果它找到了接受单整数参数的构造函数，它将使用该构造函数将整数 `25`\
  \ 转换为 `Money` 值。接受 `long` 类型单一参数的构造函数告诉系统如何将如 `25` 等整数转换为 `Money` 值。单参数构造函数说 `25`\
  \ 应该转换为成员变量 `allCents` 等于 `2500` 的 `Money` 类型对象；换句话说，构造函数将 `25` 转换为代表 $25.00 的 `Money`\
  \ 类型对象。（构造函数的定义在 Display 11.3 中。）\n\n注意，除非有合适的构造函数，否则这种类型转换将无法工作。例如，`Money` 类型 (Display\
  \ 11.5) 没有一个接受 `double` 类型参数的构造函数，因此如果你将以下代码放入一个声明 `baseAmount` 和 `fullAmount` 为\
