  \ 要求前向迭代器而 `vector` 具有随机访问迭代器？\n\n# `Set` 算法\n\n[显示 18.20] 展示了 STL 中定义的泛型 `set`\
  \ 操作函数的示例。注意，这些泛型算法假设容器按顺序存储其元素。容器 `set`、`map`、`multiset` 和 `multimap` 确实按顺序存储其元素，因此\
  \ [显示 18.20] 中的所有函数都适用于这四个模板类容器。其他容器（如 `vector`）并不按顺序存储其元素，这些函数不应与此类容器一起使用。要求元素排序是为了让算法更高效。\n\
  \n这些操作适用于 set、map、multiset、multimap（以及其他容器），但并不适用于所有容器。例如，对于 vector、list 或 deque，除非其内容已排序，否则无法工作。为了使这些容器，容器中的元素必须按顺序存储。这些运算符都适用于前向迭代器，这意味着它们也适用于双向迭代器和随机访问迭代器。（在某些情况下它们甚至适用于其他类型的迭代器，我们已经详细介绍过。）\n\
