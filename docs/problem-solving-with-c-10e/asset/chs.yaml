  \n# 显示 4.4 函数调用的细节\n\n图 4.4 完整替代文本\n\n# 返回布尔值的函数\n\n函数可以返回一个 `bool` 值。返回布尔值的函数称为`谓词`（predicate）。这种函数可以用于布尔表达式，以控制\
  \ `if-else` 语句或控制循环语句，也可以用于任何其他允许布尔表达式的地方。此类函数的返回类型应为 `bool` 类型。\n\n对返回 `true` 或\
  \ `false` 布尔值的函数的调用可以用于任何允许布尔表达式的地方。这通常能使程序更易读。通过函数声明，你可以将一个复杂的布尔表达式与一个有意义的名称关联，并将该名称在\
  \ `if-else` 语句或任何其他允许布尔表达式的地方作为布尔表达式使用。例如，语句\n\n```\nif (((rate >= 10) && (rate\
  \ < 20)) || (rate == 0))\n{\n    ...\n}\n```\n\n可以被写为\n\n```\nif (appropriate(rate))\n\
  {\n    ...\n}\n```\n\n前提是定义了以下函数：\n\n```\nbool appropriate(int rate)\n{     return\
  \ (((rate >= 10) && (rate < 20)) || (rate == 0));\n}\n```\n\n# 函数声明的替代形式\n\n你不需要在函数声明中列出形式参数的名称。以下两个函数声明是等价的：\n\
  \n```\ndouble totalCost(int numberPar, double pricePar);\n```\n\n和\n\n```\ndouble\
  \ totalCost(int, double);\n```\n\n我们将始终使用第一种形式，以便我们能够在伴随函数声明的注释中引用形式参数。然而，你经常会在描述函数的手册中看到第二种形式。²\n\
  \n这种替代形式仅适用于函数声明。*函数头必须始终列出形式参数名称*。\n\n# 函数定义——语法总结\n\n函数声明通常放在程序 `main` 部分之前，而函数定义通常放在程序\
  \ `main` 部分之后（或者，正如我们在本书稍后看到的，放在单独的文件中）。显示 4.6 给出了函数声明和定义的语法总结。实际上，自由度比该显示要大一点。函数定义中的声明和可执行语句可以混合在一起，只要每个变量在使用之前都已声明即可。在函数定义中混合声明和可执行语句的规则与程序\
  \ `main` 部分的规则相同。但除非你有理由不这样做，否则最好将声明放在最，如显示 4.6 所示。\n\n![插图显示了一个带有返回返回值的“函数”语法的代码段](img/p202-1.png)\n\
  \n# 显示 4.6 返回返回值的函数语法\n\n图 4.6 完整替代文本\n\n由于函数在执行 `return` 语句之前不会返回值，因此函数体中必须包含一个或多个\
  \ `return` 语句。函数定义可以包含多个 `return` 语句。例如，代码体可能包含一个 `if-else` 语句，`if-else` 语句的每个分支可能包含一个不同的\
  \ `return` 语句，如显示 4.5 所示。\n\n# 关于函数定义位置的更多信息\n\n我们讨论了函数声明通常的位置。在正常情况下这些是函数定义。然而，编译器接受带有函数定义的程序。例如，如果你将所有的函数定义都放在\
  \ `main` 部分之前，那么不需要包含任何函数声明。这为学习如何构建自己的函数奠定了基础。\n\n# 编程技巧：在分支语句中使用函数调用\n\n`switch`\
