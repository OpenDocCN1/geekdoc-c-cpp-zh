  \ velocity is 331.3 m/s\nAt 1 degrees Celsius the velocity is 331.9 m/s\nAt 2 degrees\
  \ Celsius the velocity is 332.5 m/s\n```\n\n### 12\n许多私人井每分钟只产生 1 或 2 加仑水。产量井缺水的方法是使用水箱。四口之家每天大约使用\
  \ 250 加仑水。然而，井本身（即井筒）中有一个“天然”水箱。较深的井储存更多可以抽出的水。但会有很多水可用？\n\n编写一个程序，允许用户输入井的半径（英寸）（典型的井半径为\
  \ 3 英寸）和井的深度（英尺）（假设水充满这个深度，尽管实际上通常并非如此，因为静态水位通常在地面以下 50 英尺以上）。程序应输出井筒中储存的加仑数。参考：圆柱体积为\
  \ `πr²h`，其中 `r` 是半径，`h` 是高度， 1 立方英尺 = 7.48 加仑水。\n\n例如，一个深 300 英尺、半径 3 英寸的水井大约含有\
  \ 441 加仑水——对于四口之家来说绰绰有，不需要安装单独的水箱。\n\n### 13\n哈里斯-本尼迪方程估计了身体不运动时维持体重所需的卡路里数。这被称为基础代谢率，简称\
  \ BMR。\n\n女性维持体重所需的热量公式为：\n\n`BMR = 655 + (4.3 × weight) + (4.7 × height) - (4.7\
  \ × age)`\n\n男性维持体重所需的热量公式为：\n\n`BMR = 66 + (6.3 × weight) + (12.9 × height) - (6.8\
  \ × age)`\n\n\n\n\n\n一块典型的巧克力棒含有约 230 卡路里。编写一个程序，允许用户输入其体重（磅）、身高（英寸）、年龄（岁），并用字符\
  \ `M` 表示男性、`F` 表示女性。该程序应根据指定的体重、身高、年龄以及相应的性别，输出为了维持体重而应该消耗的巧克力棒数量。\n\n14. 编写一个程序，计算\
