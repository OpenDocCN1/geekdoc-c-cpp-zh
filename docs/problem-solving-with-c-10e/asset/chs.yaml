  \    double f;\n    f = (9/5) * c + 32.0;\n    ```\n\n    1. `f` 被赋予了什么值？\n    2.\
  \ 解释实际上发生了什么，以及程序员可能想要。\n    3. 按照程序员的意图重写代码。\n\n20. 当以下代码行嵌入到一个声明 `month`、`day`、`year`\
