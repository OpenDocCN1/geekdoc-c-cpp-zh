  \ 9 章讨论这一点 9。如果你还没有学习过指针，可以安全地忽略这个脚注。\n\n\n\n\n14. 对象的实际上是变量的值，而不是变量本身，但由于我们使用变量来命名它所持有的值，我们可以忽略这一细微差别并简化讨论，仿佛变量和它的值是同一个东西一样进行讨论。\n\
  \n15. 有时候这种理想并没有完全实现，但在理想世界中它应该是被实现的，至少对于简单的程序，即使在我们所处的这个不完美的世界中，它实现了。\n\n16. 在[第\
  \ 11 章]中，我们将看到需要为类重新定义（重载）赋值运算符 `=` 的情况。\n\n17. 详情请参阅[第 2 章]。[图 2.2] 对大多数最新编译器实现的数据类型进行了描述。\n\
  \n18. C++ 在初始化（调用拷贝构造函数的三个情况）和赋值之间做了仔细的区分。初始化使用拷贝构造函数创建一个新对象；赋值运算符则获取一个现有对象并对其进行修改，使其成为赋值表达式右侧对象的（除内存位置外）完全相同的副本。\n\
  \n19. 正如你在本章稍后部分看到的，即使两个命名空间包含相同的名称，也有同时使用它们的方法，但这是一个微妙的问题，目前与我们无关。\n\n20. 细节如下：`NULL`\
  \ 的定义由 C++ 预处理器处理，它将 `NULL` 替换为 `0`。因此，编译器从未真正见过 `\"NULL\"`，所以没有命名空间问题，也不需要 `using`\
  \ 指令。\n\n21. 一些作者会使用子类 `D` 和超类 `B`，而不是派生类 `D` 和基类 `B`。然而，我们发现“派生类”和“基类”这两个术语更不容易混淆。我们提到这一点是为了帮助你阅读其他文本。\n\
  \n22. 某些编译器可能允许基于 `const` 与非 `const` 进行重载，但你不能依赖这一点，因此不应该这样做。基于原因，某些对`signature`的定义包含了\
