  \ 运算符的最典型排序都是严格弱序。对于想要了解细节的人：“严格排序”（strict ordering）必须满足：（反自反）`Ordering(x, x)` 始终为假；（反对对称）`Ordering(x,\
  \ y)` 意味着 `!Ordering(y, x)`；（传递性）`Ordering(x, y)` 和 `Ordering(y, z)` 意味着 `Ordering(x,\
  \ z)`；以及（等价传递）如果 `x` 等价于 `y` 且 `y` 等价于 `z`，那么 `x` 等价于 `z`。如果 `Ordering(x, y)` 和\
  \ `Ordering(y, x)` 都为假，则两个元素 `x` 和 `y` 等价。\n\n27. 由于短路求值，`!(found)` 不会被求值，所以我们实际上得到的是两个操作而不是三个。然而，重要的是获得一个良好的上界。如果我们额外增加一个不显著的操作。\n"
