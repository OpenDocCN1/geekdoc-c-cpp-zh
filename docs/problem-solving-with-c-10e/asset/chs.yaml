  \ `shoee`。\n\n8. 为以下声明提供一个函数定义。（类型 `ShoeType` 在练习中给出。）\n\n    ```\n    ShoeType\
  \ discount(ShoeType oldRecord);\n    ```\n    返回与其参数相同的内容，但价格减少了 10%。\n\n9. 为类型\
  \ `StockRecord` 提供一个结构定义，该类型有两个成员变量，一个名为 `shoeInfo` 类型为 `ShoeType`，另一个名为 `arrivalDate`\
  \ 类型为 `Date`。\n\n10. 声明一个类型为 `StockRecord` 的变量，并写一条语句将日期的年份设置为 `2006`。\n\n\n\n\n\
  \n`DayOfYear` 类的定义位于显示 10.3 附近。目前，请忽略包含 `public` 关键字的行。这一行仅仅表示成员变量和函数没有访问限制。我们将在本章稍后部分解释这一行。`DayOfYear`\
  \ 类类定义的其余部分与结构体定义非常相似，区别在于它使用了 `class` 关键字而不是 `struct`，并且列出了成员函数 `output`（以及成员变量\
  \ `month` 和 `day`）。注意，成员函数 `output` 是通过提供其函数声明来列出的。成员函数的定义在其他地方给出。（在 C++ 类定义中，你可以按照自己的意愿任意混合成员变量和成员函数的顺序，但我们所遵循的风格倾向于将成员函数列在成员变量之前。）类类型的对象（即变量）的声明方式与预定义类型的变量相同，也与结构体变量的声明方式相同。\n\
  \n你定义的类的成员函数的调用方式与我们在第 6 章中描述预定义类的方式方式相同。例如，显示 10.3 中的程序以如下方式声明了两个 `DayOfYear` 类型的对象：\n\
  \n```cpp\nDayOfYear today, birthday;\n```\n\n如下所示使用对象 `today` 调用成员函数 `output`：\n\
  \n```cpp\ntoday.output();\n```\n\n以及如下所示使用对象 `birthday` 调用成员函数 `output`：\n\n```cpp\n\
  birthday.output();\n```\n\n当定义成员函数时，定义必须包含类名，因为可能有两个或多个类具有相同名的成员函数。在显示 10.3 中只有一个类定义，但在其他情况下，你可能会有很多类定义，且每个类都可能有一个名为\
  \ `output` 的成员函数。`DayOfYear` 类成员函数 `output` 的定义显示在显示 10.3 中。该定义与普通函数定义相似，但存在一些不同。\n\
  \n成员函数 `output` 的函数定义头如下：\n\n```cpp\nvoid DayOfYear::output()\n```\n\n`::` 运算符被称为**作用域解析运算符**，它的作用与点运算符（`.`）类似。点运算符和作用域解析运算符都用于指示成员函数属于哪个成员。然而，作用域解析运算符\
  \ `::` 与类名配合，而点运算符与对象（即类变量）配合。作用域解析运算符由两个之间没有空格的冒号组成。作用域解析运算符之前的类名通常被称为**类型限定符**，因为它将函数名限定（“qualifies”）到了一个特定的类型。\n\
  \n看显示 10.3 给出的成员函数 `DayOfYear::output` 的定义。注意，在 `DayOfYear::output` 的函数定义中，我们直接使用了成员名\
  \ `month` 和 `day`，而没有先提供对象和点运算符。这初看之下可能并不奇怪。此时我们仅仅是在定义成员函数 `output`。这个对 `output`\
  \ 的定义将适用于所有 `DayOfYear` 类型的对象，但在此时我们并不知道将要使用的 `DayOfYear` 类型对象的名称，因此我们无法给出它们的名称。当调用成员函数时，例如：\n\
  \n```cpp\ntoday.output();\n```\n\n函数定义中的所有成员名都会限定为调用对象的名称。因此，上面的函数调用等同于以下内容：\n\n\
  ```cpp\n{\n    cout << \"month = \" << today.month\n         << \", day = \" <<\
  \ today.day << endl;\n}\n```\n\n在成员函数的定义中，你可以不使用点运算符而使用类成员的名称。\n\n### 自测练习\n\n1.\
  \ 下面我们重新定义了显示 10.3 中的 `DayOfYear` 类，使其多了一个名为 `input` 的成员函数。请为成员函数 `input` 写一个合适的定义。\n\
  \n```cpp\nclass DayOfYear\n{\npublic:\n    void input();\n    void output();\n \
  \   int month;\n    int day;\n};\n```\n\n2. 给定以下类定义，为成员函数 `set` 写一个合适的定义：\n\n```cpp\n\
  class Temperature\n{\npublic:\n    void set(double newDegrees, char newScale);\n\
  \    // 将成员变量设置为参数给的值\n    double degrees;\n    char scale; // 氏度 'F' 或摄氏度 'C'\n\
  };\n```\n\n3.仔细区分点运算符和作用域解析运算符 `::` 的含义和用法。\n\n## 公有和私有成员\n\n预定义类型（如 `double`）并不是通过类实现的，但编写你的\
  \ C++ 编译器的人们设计了某种表示 `double` 类型值的方法。实现 `double` 类型有多种。事实上，不同版本的 C++ 实现 `double`\
  \ 类型的方式略有不同，但如果你将你的 C++ 程序移动到另一个具有不同 `double` 类型实现的计算机上，你的程序应该能够正常工作。^(15 类是你定义的类型，你定义的类型也应该像预定义类型一样良好。你可以构建自己的类类型定义库，并像使用预定义类型一样使用你的类型。例如，你可以将每个类定义放在单独的文件中，并复制到任何使用该类型的程序。\n\
  \n为了实现这一理想，我们需要描述类定义的另一个特征。\n\n\n\n\n\n回来看显示 10.3 中给出的 `DayOfYear` 类型定义。`DayOfYear`\
  \ 类型设计用于存储表示生日和节假日等日期的值。我们选择将这些日期表示为两个整数，一个表示月份，另一个表示月份中的某一天。我们以后可能会决定将月份的表示方法从一个\
  \ `int` 类型的变量改为三个 `char` 类型的变量。在更改后的版本中，这三个字符将是月份名称的缩写。例如，三个 `char` 值 `'J'`、`'a'`\
  \ 和 `'n'` 将代表月份一月（January）。然而，使用一个 `int` 类型的单一成员变量来记录月份，还是使用三个 `char` 类型的成员变量，这一个使用\
  \ `DayOfYear` 类型的程序员不需要关心的实现细节。当然，如果你更改了类 `DayOfYear` 表示月份的方式，那么你就必须更改成员函数 `output`\
  \ 的实现——但那是你唯一需要更改的内容。你不需要更改任何使用你的 `DayOfYear` 类定义的程序的其他部分。遗憾的是，显示 10.3 中的程序并没有达到这种理想状态。例如，如果你将名为\
  \ `month` 的成员变量替换为三个 `char` 类型的成员变量，那么将不再名为 `month` 的成员变量了，因此你必须更改程序中执行输入的部分，并更改\
  \ `if-else` 语句。\n\n有了理想的类定义，你应该能够更改类实现的细节，而在任何使用该类的程序中，你唯一需要更改的是成员函数的定义。为了实现这一理想，你必须拥有足够的成员函数，以便你永远不需要直接访问成员变量，而通过成员函数访问它们。这样，如果你更改了成员变量，你只需要更改成员函数的定义以匹配你对成员变量的更改，程序中的其他任何地方都不需要更改。在显示\
  \ 10.4 中，我们重新定义了类 `DayOfYear`，使其拥有足够的成员函数完成我们希望程序执行的所有事情，因此程序不需要直接引用任何成员变量。如果你仔细查看显示\
  \ 10.4 中的程序，你会发现成员变量名 `month` 和 `day` 被使用的唯一地方是在成员函数的定义中。在成员函数定义之外的任何地方都没有引用 `today.month`、`today.day`、`bachBirthday.month`\
  \ 或 `bachBirthday.day`。\n\n![插图展示了一个带有“私有成员”的“类”的代码段](img/p563-1.png)\n\n# 显示 10.4\
  \ 带有私有成员的类\n\n图 10.4 完整备用文本![插图展示了之前代码段的连续部分，展示了带有“私有成员”的“类”](img/p564-1.png)10.2-3\
  \ 完整备用文本\n\n***示例对话***\n\n```\n输入今天的日期：\n输入月份数字: 3\n输入日期: 21\n今天的日期是 month = 3,\
  \ day = 21\nJ. S. 巴赫的生日是 month = 3, day = 21\n生日快乐，约翰·塞巴斯蒂安！\n```\n\n显示 10.4 中的程序有一个新功能，旨在确保任何使用\
  \ `DayOfYear` 类的程序员永远不会直接引用其任何成员变量。注意 `DayOfYear` 类定义中包含 `private` 关键字的该行。此行之后列出的所有成员变量名都是私有成员，这意味着除了成员函数的定义内部，无法在程序中直接访问它们。如果你尝试在程序的\
  \ `main` 部分或某些函数的定义中访问这些成员变量之一，编译器将给出错误。如果你在 `DayOfYear` 的成员列表中插入 `private` 关键字和冒号，那么\
  \ `month` 和 `day` 将变为私有成员。对于显示 10.4 中的这种新定义，在 `main` 部分的以下赋值操作将是不允许的。\n\n一旦你将成员变量设为私有，除了使用成员函数外，就没有其他方法更改其值。对于成员函数定义来说，这是一个严厉的限制，但通常是一项明智的限制。程序员发现这通常会让他们的代码更容易理解。\n\
  \n\n\n\n同样要注意，成员函数 `DayOfYear::set` 和 `DayOfYear::input` 会检查并确保成员变量 `month` 和 `day`\
  \ 被设置为合法值。这是通过调用成员函数 `DayOfYear::checkDate` 实现的。如果成员变量 `month` 和 `day` 是公有的而不是私有的，那么这些成员变量就可以被设置为任何值，包括非法值。通过将成员变量设为私有并仅通过成员函数对其进行操作，我们可以确保成员变量永远不会被设置为非法或无意义的值。（在自测练习\
  \ 14 中，你被要求重新定义成员函数 `DayOfYear::checkDate`，以便对非法日期进行完整检查。）\n\n也可以将成员函数设为私有。与私有成员变量一样，私有成员函数可以在其他成员函数的定义中使用，但在其他地方不能，例如在使用该类类型的程序的\
  \ `main` 部分。例如，显示 10.4 中的成员函数 `DayOfYear::checkDate` 是一个私有成员函数。如果你只期望在成员函数的定义中使用该函数作为辅助函数，那么通常的做法是将成员函数设为私有。\n\
  \n`public` 关键字指示公共成员的方式与 `private` 关键字指示私有成员的方式相同。例如，对于显示 10.4 中定义的 `DayOfYear`\
  \ 类，除了 `DayOfYear::checkDate` 外的所有成员函数都是公有成员（所有成员变量都是私有成员）。公共成员可以在程序的 `main` 体或任何函数的定义中使用。\n\
  \n你可以在类定义中拥有任意数量的 `public` 和 `private`。每当你插入标签：\n\n```\npublic:\n```\n成员列表从私有变为公有。每当你插入标签：\n\
  \n```\nprivate:\n```\n成员列表变回私有。例如，后续结构中的成员函数 `doSomethingElse` 和成员变量 `moreStuff`\
  \ 是私有成员，而其他四个成员都是公有的：\n\n```\nclass SampleClass\n{\npublic:\n    void doSomething();\n\
  \    int stuff;\nprivate:\n    void doSomethingElse();\n    double moreStuff;\n\
  };\n```\n\n如果你在类定义的开头没有插入 `public:` 或 `private:`，那么它们将是私有成员。然而，显式地将每组成员标记为 `public`\
  \ 或 `private` 是一个好主意。\n\n# 提示：将所有成员变量私有\n\n定义类时，通常的做法是将所有成员变量设为私有。这意味着成员变量只能通过成员函数进行访问或更改。本章的大部分都在介绍为什么要这样定义类。\n\
  \n# 提示：定义访问函数和修改函数\n\n运算符 `==` 可以测试两个简单类型的值是否相等。遗憾的是，预定义的 `==` 并不自动适用于对象。在第 11 章\
  \ 中，我们将教你如何让运算符 `==` 适用于你定义的类。在此之前，你无法对对象使用相等运算符（也不能对结构使用）。这会导致一些复杂性。定义类时，首选样式是将成员变量设为私有。因此，为了测试两个对象是否表示相同的值，你需要一种访问成员变量值的方法（或等的值）。这允许你通过测试每对对应成员的值来测试相等性。在显示\
  \ 10.4 中，我们在 `if-else` 语句使用了成员函数 `getMonth` 和 `getDay`。\n\n像 `getMonth` 和 `getDay`\
  \ 这样允许你获取私有成员变量值的成员函数被称为访问函数（accessor functions）。考虑到你目前为止学到的技术，在每个类定义中包含一组完整的访问函数是非常重要的，这样你就可以测试对象的相等性。访问函数不需要字面上返回值，但它们必须返回关于值的内容。在第\
  \ 11 章 中，我们将开发一种更优雅的方法来测试对象，即使在你学习了之后，拥有访问函数仍然很有用。像显示 10.4 中的 `set` 这样允许你更改成员变量值的成员函数被称为修改函数（mutator\
  \ functions）。在每个类定义中包含修改函数是非常重要的，这样你就可以更改存储在对象中的数据。\n\n### 自测练习\n\n14. 显示 10.4 中的成员函数\
  \ `DayOfYear::checkDate`允许某些非法日期通过，例如 2 月 30 日。重新定义成员函数 `DayOfYear::checkDate`，使其在发现任何非法日期时终止程序。允许月份有\
  \ 29 天，以便你考虑闰年。（提示：这有点繁琐，函数定义有点长，但并不困难。）\n\n15. 假设你的程序包含以下类定义：\n\n```\nclass Automobile\n\
  {\npublic:\n    void setPrice(double newPrice);\n    void setProfit(double newProfit);\n\
  \    double getPrice();\nprivate:\n    double price;\n    double profit;\n    double\
  \ getProfit();\n};\n```\n\n并假设程序的 `main` 部分包含以下声明，并且程序以某种方式设置了成员变量的值：\n\n```\nAutomobile\
  \ hyundai, jaguar;\n```\n\n在 `main` 部分中哪些语句是允许的？\n\n```\nhyundai.price = 4999.99;\n\
  jaguar.setPrice(30000.97);\ndouble aPrice, aProfit;\naPrice = jaguar.getPrice();\n\
  aProfit = jaguar.getProfit();\naProfit = hyundai.getProfit();\nif (hyundai == jaguar)\n\
  \    cout << \"Want to swap cars?\";\nhyundai = jaguar;\n```\n\n16. 假设你修改了自测练习 15，使\
  \ `Automobile`类的定义省略了包含 `private` 关键字的行。这会改变你对自测练习 15 问题的回答？\n\n\n\n\n对对象或结构体使用赋值运算符\
  \ `=` 是完全合法的。例如，假设显示 10.4 所示定义了 `DayOfYear` 类，使其拥有两个名为 `month` 和 `day` 的私有成员变量，并假设对象\
  \ `dueDate` 和 `tomorrow` 声明如下：\n\n```\nDayOfYear dueDate, tomorrow;\n```\n\n那么以下操作也是完全合法的（前提是对象\
  \ `tomorrow` 的成员变量已经赋予了值）：\n\n```\ndueDate = tomorrow;\n```\n\n上述赋值操作等同于以下操作：\n\n\
  ```\ndueDate.month = tomorrow.month;\ndueDate.day = tomorrow.day;\n```\n\n此外，即使名为\
  \ `month` 和 `day` 的成员变量是 `DayOfYear` 类的私有成员，这种情况依然成立。[#fn16] 当以这种方式拷贝对象时，它被称为**浅拷贝**。之所以被称为浅拷贝，是因为只拷贝了直接成员变量。如果某个成员变量是引用，那么拷贝将将指向同一个引用。\n\
  \n# 编程示例 BankAccount 类—版本 1\n\n显示 10.5 包含一个银行账户的类定义，它说明了你迄为止看到的所有关于类定义的要点。这种类型的银行账户允许你随时取款，因此它不像你之前看到的\
  \ `CDAccount` 类型那样有期限。更重要的区别是，`BankAccount` 类拥有你可能在程序中使用的所有操作的成员函数。`BankAccount`\
  \ 类对象有两个私有成员变量：一个用于记录账户余额，另一个用于记录利率。让我们讨论一下 `BankAccount` 类的一些特性。\n\n![插图显示了“BankAccount\
  \ 类”的代码片段。](img/p573-1.png)\n\n# 显示 10.5 `BankAccount` 类\n\n图 10.5 完整替代文本![插图显示了之前“BankAccount\
  \ 类”代码片段的后续部分](img/p574-1.png)10.2-3 完整替代文本![插图显示了之前“BankAccount 类”代码片段的后续部分](img/p575-1.png)10.2-3\
  \ 完整替代文本\n\n***示例对话***\n\n```\n测试开始:\naccount1 初始状态:\n账户余额 $123.99\n利率 3.00%\naccount1\
  \ 使用新设置:\n账户余额 $100.00\n利率 5.00%\naccount1 更新后:\n账户余额 $105.00\n利率 5.00%\naccount2:\n\
  账户余额 $105.00\n利率 5.00%\n```\n\n首先，注意 `BankAccount` 类有一个名为 `fraction` 的私有成员函数。由于\
  \ `fraction` 是私有成员函数，它不能在 `main` 函数体内或任何非 `BankAccount` 类成员的函数体中被调用。`fraction` 函数只能在\
  \ `BankAccount` 类其他成员函数的定义中调用。我们拥有这个（或任何）私有成员函数的唯一原因是为了帮助我们定义同一类的其他成员函数。在对 `BankAccount`\
  \ 类的定义中，我们包含了成员函数 `fraction`，以便我们能够在 `update` 函数的定义中使用它。`fraction` 函数接受一个代表百分比数字的参数（例如\
  \ 10.0% 对应 `10.0`），并将其转换为分数（例如 `0.10`）。这允许我们根据给定百分比计算账户的利息。如果账户包含 $100.00 且利率为 10%，则利息等于\
  \ $100 乘以 0.10，即 $10.00。\n\n当你在程序的 `main` 函数体中调用公共成员函数（如 `update`）时，必须包含一个对象名称和一个点，如下显示\
  \ 10.5 中的行：\n\n```\naccount1.update();\n```\n\n然而，当你在另一个成员函数的定义内部调用私有成员函数（或其他任何成员函数）时，你只需要成员函数名称，不需要任何调用对象或点运算符。例如，以下成员函数\
  \ `BankAccount::update` 的定义包含了对 `BankAccount::fraction` 的调用（如显示 10.5 所示）：\n\n```\n\
  void BankAccount::update() {\n    balance = balance + fraction(interestRate);\n\
  }\n```\n\n\n\n\n\n*   类的私有成员除了在同类的另一个成员函数的定义内部外，无法被使用。\n*   类的成员函数名可以像普通函数名一样进行重载。\n\
  *   类可以使用另一个类作为其成员变量的类型。\n*   函数可以拥有类型为类的形式参形参数。（参见自测练习题 19 和 20。）\n*   函数可以返回一个对象；也就是说，类可以作为函数返回值的类型。（参见自测练习题\
  \ 21。）\n\n### 自测练习题\n\n### 19. 为具有以下函数定义的函数提供定义。类 `BankAccount` 定义在 显示 10.5。\n\n\
  ```\ndouble difference(BankAccount account1, BankAccount account2);\n//前置条件：account1\
  \ 和 account2 已经赋值\n//（即，它们的成员变量已经赋值）。\n//返回 account1 的余额减去 account2 的余额。\n```\n\n\
  ### 20. 为具有以下函数定义的函数提供定义。类 `BankAccount` 定义在 显示 10.5;\n//前置条件：theAccount 之前已经赋值\n\
  //（即，它的成员变量已经赋值）。\n//后置条件：账户余额已更改，使得两年的利息已计入账户。\n```\n\n### 21. 为具有以下函数定义的函数提供定义。类\
  \ `BankAccount` 定义在 显示 10.5。\n\n```\nBankAccount newAccount(BankAccount oldAccount);\n\
  //前置条件：oldAccount 之前已经赋值\n//（即，它的成员变量已经赋值）。\n//返回一个新账户的值，其余额为零且利率与 oldAccount 相同。\n\
  ```\n\n例如，在定义此函数后，程序可能包含以下内容：\n\n```\nBankAccount account3, account4;\naccount3.set(999,\
  \ 99, 5.5);\naccount4 = newAccount(account3);\naccount4.output(cout);\n```\n\n这将产生以下输出：\n\
  \n```\nAccount balance $0.00\nInterest rate 5.50%\n```\n\n# 用于初始化的构造函数\n\n在声明对象时，你通常想初始化对象的某些或全部成员变量。正如我们在本书后面将看到的，还有其他你可能想要执行的初始化操作，但初始化成员变量是最常见的初始化类型。C++\
  \ 对此类初始化提供了特殊规定。当你定义一个类时，可以定义一种特殊的成员函数，称为 `构造函数`。构造函数是在当该类的对象被声明时自动调用的成员函数。构造函数用于初始化成员变量的值并执行任何其他可能需要的初始化。你可以像定义任何其他成员函数一样定义构造函数，但有两点不同：\n\
  \n1.  构造函数的名称必须与类名相同。例如，如果类名为 `BankAccount`，那么该类的任何构造函数必须命名为 `BankAccount`。\n2.\
  \  构造函数的定义不能返回值。此外，在函数声明的开头或函数头不能给出任何返回类型，即使是 `void`。\n\n例如，假设我们想为 `BankAccount`\
  \ 类型的对象添加一个用于初始化余额和利率的构造函数，该类型所示 显示 10.5。类定义如下。（为了节省空间，我们省略了一些注释，但应该包含它们。）\n\n```\n\
  class BankAccount\n{\npublic:\n    BankAccount(int dollars, int cents, double rate);\n\
  \    //将账户余额初始化为 $dollars.cents 并\n    //并将利率初始化为 rate 百比。\n\n    void set(int dollars,\
  \ int cents, double rate);\n    void set(int dollars, double rate);\n    void update();\n\
  \n    double getBalance();\n    double getRate();\n    void output(ostream& outs);\n\
  private:\n    double balance;\n};\n```\n\n\n\n\n\n你可以重载像 `BankAccount::BankAccount`\
  \ 这样的构造函数名称，就像你可以重载任何其他成员函数名称一样，正如我们在显示 10.5 中所对过的 `BankAccount::set`。事实上，构造函数通常会被重载，以便对象可以通过多种方式进行初始化。例如，在显示\
  \ 10.6 中，我们重新定义了类 `BankAccount`，使其拥有三个版本的构造函数。这种重新定义重载了构造函数名称 `BankAccount`，使其具有三个参数（正如我们刚刚讨论的）、两个参数或无参数。\n\
  \n![](img/p581-1.png) ![一张插图展示了一个演示带有“类”和“构造函数”的代码段](img/p582-1.png) ![](img/p583-1.png)\n\
  \n**屏幕输出**\n\n```\naccount1 initialized as follows:\nAccount balance $100.00\nInterest\
  \ rate 2.30%\naccount2 initialized as follows:\nAccount balance $0.00\nInterest\
  \ rate 0.00%\naccount1 reset to the following:\nAccount balance $999.99\nInterest\
  \ rate 5.50%\n```\n\n# 显示 10.6 带有构造函数的类\n\n图 10.6 完整备用文本\n\n例如，假设你在声明 `BankAccount`\
  \ 类型的对象时只提供了两个参数，如下例所示：\n\n```\nBankAccount account1(100, 2.3);\n```\n\n那么对象 `account1`\
  \ 将被初始化为代表一个余额为 $100.00 且利率为 2.3% 的账户。\n\n另一方面，如果没有提供参数，如下例所示：\n\n```\nBankAccount\
  \ account2;\n```\n\n那么对象将被初始化为代表一个余额为 $0.00 且利率为 0.0% 的账户。请注意，当构造函数没有参数时，你不需要在对象声明中包含任何括号。以下写法是错误的：\n\
  \n```\nBankAccount account2(); //错误！不要这样做！\n```\n\n在某些情况下，一旦你有了一组良好的构造函数定义，就可以省略像\
  \ `set` 这样的修改器成员函数。你可以使用显示 10.6 中的重载构造函数 `BankAccount` 来根据你选择的值创建新的 `BankAccount`\
  \ 对象。然而，调用构造函数会创建一个新对象，因此如果你想更改对象中现有的成员变量，你应该使用修改器函数。\n\n显示 10.6 中的无参数构造函数值得额外讨论，因为它包含了我们以前未见过的内容。为了参考，我们重现了无参数构造函数的定义：\n\
  \n```\nBankAccount::BankAccount() : balance(0), interestRate(0.0)\n{\n    // 函数体特意为空\n\
  }\n```\n\n在第一行显示的新元素是以单个冒号开头的部分。构造函数定义的这部分被称为**初始化列表**。正如此示例所示，初始化列表位于结束参数列表的括号之后、函数体左大括号之前。初始化列表由一个冒号组成，后面跟着一个由逗号分隔的部分或全部成员变量列表。每个成员变量后面都跟着用括号括的初始化值。该构造函数定义与以下编写定义的方式完全等价：\n\
  \n```\nBankAccount::BankAccount( )\n{\n    balance = 0;\n    interestRate = 0.0;\n\
  }\n```\n\n带有初始化列表的构造函数定义中的函数体不需要为空。例如，以下对双参数构造函数的定义等价于显示 10.6 中的定义：\n\n```\nBankAccount::BankAccount(int\
  \ dollars, double rate)\n           : balance(dollars), interestRate(rate)\n{\n\
  \    if ((dollars < 0) || (rate < 0))\n    {\n        cout << \"Illegal values for\
  \ money or interest rate.\\n\";\n        exit(1);\n    }\n}\n```\n\n# 提示：始终包含默认构造函数\n\
  \nC++ 并不总是为你定义的类生成默认构造函数。如果你没有提供构造函数，编译器将生成一个默认构造函数。另一方面，如果你定义了至少一个构造函数，那么 C++ 编译器就不会再生成其他构造函数。每当你声明该类型的对象时，C++\
  \ 都会寻找合适的构造函数。如果你在不使用参数的情况下声明对象，C++ 将寻找默认构造函数，如果你没有定义默认构造函数，就没有可以寻找。\n\n例如，假设你定义了如下类：\n\
  \n![一张插图展示了以下代码段](img/p586-1.png)10.2-3 完整备用文本你应该认为以下是声明 `SampleClass` 类型对象并调用该类构造函数的合法方法：\n\
  \n```\nSampleClass myObject(7, 7.77);\n```\n\n然而，你可能会惊讶地发现以下是非法的：\n\n```\nSampleClass\
  \ yourObject;\n```\n\n编译器将此声明解释为对无参数构造函数的调用，但并没有零参数构造函数的定义。你必须为 `yourObject` 的声明添加两个参数，或者添加一个无参数构造函数的定义。\n\
  \n可以使用无参数调用的构造函数被称为**默认构造函数**，因为它适用于你在没有指定任何参数时声明对象的默认情况。由于你可能经常需要在不提供任何构造函数参数的情况下声明对象，因此你应该始终包含一个默认构造函数。以下重定义的\
  \ `SampleClass` 版本包含了默认构造函数：\n\n```\nclass SampleClass\n{\npublic:\n    SampleClass(int\
  \ parameter1, double parameter2);\n    SampleClass(); // 默认构造函数\n    void doStuff();\n\
  private:\n    int data1;\n    double data2;\n};\n```\n\n如果你以这种方式重新定义 `SampleClass`\
  \ 类，那么之前的 `yourObject` 声明将是合法的。\n\n\n\n\n\n如果你不希望默认构造函数初始化任何成员变量，可以在实现它时只需给它一个空函数体。下面的构造函数定义是完全合法的。它被调用时除了让编译器满意之外什么都不做：\n\
  \n```\nSampleClass::SampleClass()\n{\n    // 什么都不做。\n}\n```\n\n注意，如果使用 `new` 运算符作为动态变量创建一个类，则会调用默认构造函数。\n\
  \n# C++11 中的成员初始化与构造函数委托\n\nC++11 支持一种名为`成员初始化`的特性，这在大多数面向对象的编程语言中都存在。该特性允许你为成员变量设置默认值。当对象创建时，成员变量会自动初始化为指定的值。考虑以下\
  \ `Coordinate` 类的定义和实现：\n\n```\nclass Coordinate\n{\n  public:\n       Coordinate();\n\
  \       Coordinate(int x);\n       Coordinate(int x, int y);\n       int getX();\n\
  \       int getY();\n  private:\n       int x=1;\n       int y=2;\n};\nCoordinate::Coordinate()\n\
  { }\nCoordinate::Coordinate(int xVal) : x(xVal)\n{ }\nCoordinate::Coordinate(int\
  \ xVal, int yVal) : x(xVal), y(yVal)\n{ }\nint Coordinate::getX()\n{\n  return x;\n\
  }\nint Coordinate::getY()\n{\n  return y;\n}\n```\n\n如果我们创建一个 `Coordinate` 对象，那么默认成员变量\
  \ `x` 将被设置为 1，成员变量 `y` 将被设置为 2。如果我们调用了显式设置了变量的构造函数，这些值可以被覆盖。在下面的代码段中，`c1` 的 `x`\
  \ 和 `y` 设置了默认值，但对于 `c2`，默认值只设置了 `y`，因为 `x` 被显式设置为输入参数：\n\n```\nCoordinate c1, c2(10);\n\
  cout << c1.getX() << \" \" << c1.getY() << endl; // 输出 1 2\ncout << c2.getX() <<\
  \ \" \" << c2.getY() << endl; // 输出 10 2\n```\n\nC++11 支持的另一个相关特性是`构造函数委托`。简单来说，它允许一个构造函数调用另一个构造函数。例如，我们可以修改默认构造函数的实现，使其调用带有两个参数的构造函数：\n\
  \n```\nCoordinate::Coordinate() : Coordinate(99,99)\n{ }\n```\n\n由 `Coordinate c1;`\
  \ 定义的对象将调用默认构造函数，该构造函数反过来调用构造函数将 `x` 设置为 `99` 并将 `y` 设置为 `99`。\n\n### 自测练习\n\n22.\
  \ 假设你的程序包含以下类定义（以及成员函数的定义）：\n\n```\nclass YourClass\n{\npublic:\n    YourClass(int\
  \ newInfo, char moreNewInfo);\n    YourClass();\n    void doStuff();\nprivate:\n\
  \    int information;\n    char moreInformation;\n};\n```\n\n以下哪些项是合法的？\n\n```\n\
  YourClass anObject(42, 'A');\nYourClass anotherObject;\nYourClass yetAnotherObject();\n\
  anObject = YourClass(99, 'B');\nanObject = YourClass();\nanObject = YourClass;\n\
  ```\n\n23. 你将如何修改 Display 10.4 中 `DayOfYear` 类的定义，使其具有两个版本的（重载）构造函数？一个版本应该具有两个 `int`\
  \ 形式参数（一个用于月份，一个用于日期），并设置私有成员变量表示该月份和日期。另一个版本不应有形式参数，并并将所代表的日期设置为 1 月 1 日。不要在任何构造函数中使用构造函数初始化部分完成此操作。\n\
  \n24. 重做上练习，但这次使用构造函数初始化部分来初始化每个构造函数中的所有成员函数。\n\n# 10.3 抽象数据类型\n\n> 我们都知道——时代报也知道——但我们假装不知道。\n\
  > VIRGINIA WOOLF, Monday or Tuesday\n\n一种数据类型，例如 `int` 类型，具有某些特定的值，例如 `0`、`1`、`−`、`2`\
  \ 等。你倾向于将数据类型视为这些值，但对这些值的操作与值本身同样重要。如果没有操作，你无法对这些值做任何有趣的事。`int` 类型的运算由 `+`、`−`、`*`、`/`、`%`\
  \ 以及其他运算符和预定义的库函数组成。你不应该将数据类型仅仅视为值的集合。一个**数据类型**由值的集合以及定义在这些值上的基本操作集组成。\n\n如果使用该类型的程序员无法访问值和操作的实现细节，则该数据类型被称为**抽象数据类型**（缩写为\
  \ ADT）。预定义类型（如 `int`）都是抽象数据类型（ADT）。不知道像 `+` 和 `*` 这样的操作对于 `int` 类型是如何实现的。即使你知道这些，你也不会在任何\
  \ C++ 程序中使用这些信息。\n\n程序员定义的类型（例如结构体类型和类类型）并不自动是 ADT。除非在定义和使用时非常小心，否则程序员定义的类型可能会以不直观的方式使用，导致程序难以理解和修改。避免这些问题的最佳方法是确保你定义的所有数据类型都是\
  \ ADT。在 C++ 中实现这一点的方法是使用类，但并不是每个类都是 ADT。要使类成为 ADT，你必须以特定的方式定义类，这是下一小节的主题。\n\n# 产生抽象数据类型的类\n\
  \n类是你定义的类型，而不是 `int` 或 `char` 这样已经预定义的类型。一个类的值是成员变量的集合。例如，`BankAccount` 类型在 Display\
  \ 10.6 由两个 `double` 类型的值组成。为了方便引用，我们重复类定义（省略注释）：\n\n```\nclass BankAccount\n{\n\
  public:\n    BankAccount(int dollars, int cents, double rate);\n    BankAccount(int\
  \ dollars, double rate);\n    BankAccount();\n    void set(int dollars, int cents,\
  \ double rate);\n    void set(int dollars, double rate);\n    void update();\n \
  \   double getBalance();\n    double getRate();\n    void output(ostream& outs);\n\
  private:\n    double balance;\n    double interestRate;\n    double fraction(double\
  \ percent);\n};\n```\n\n使用 `BankAccount` 类型的程序员不需要你是如何实现 `BankAccount::update` 或其他成员函数的。我们使用的成员函数\
  \ `BankAccount::update` 定义如下：\n\n```\nvoid BankAccount::update()\n{\n    balance\
  \ = balance + fraction(interestRate) * balance;\n}\n```\n\n然而，我们可以放弃私有函数 `fraction`\
  \ 并使用以下复杂的公式实现 `update` 成员函数：\n\n```\nvoid BankAccount::update()\n{\n    balance\
  \ = balance + (interestRate / 100.0) * balance;\n}\n```\n\n使用 `BankAccount` 类的程序员不需要关心我们使用了哪种\
  \ `update` 实现，因为两种实现的效果相同。\n\n同样，使用 `BankAccount` 类的程序员不需要关心类值是如何实现的。我们选择将值实现为两个\
  \ `double` 类型的值。如果 `vacationSavings` 是 `BankAccount` 类型的对象，`vacationSavings` 的值由存储在以下两个成员变量中的两个\
  \ `double` 类型的值组成：\n\n```\nvacationSavings.balance\nvacationSavings.interestRate\n\
  ```\n\n然而，你不希望将对象 `vacationSavings` 的值视为两个 `double` 类型数字，例如 `1.3546e + 2` 和 `4.5`。你希望将\
  \ `vacationSavings` 的值视为条记录\n\n账户余额 $135.46\n利率 4.50%\n```\n\n这就是为什么我们的 `BankAccount::output`\
  \ 实现以这种格式写入类值。\n\n\n\n\n我们选择将此 `BankAccount` 值实现为两个 `double` 值 `1.3546e + 2` 和 `4.5`，这是一个实现细节。我们也可以将此\
  \ `BankAccount` 值实现为两个 `int` 值 `135` 和 `46`（分别代表余额的美元和分部分）以及一个 `double` 类型的单一值 `0.045`。值\
  \ `0.045` 仅仅是 4.5% 转换为分数，这可能是实现百分比数字更实用的方法。毕竟，为了计算账户利息，我们正是会将百分比转换为这样的分数。通过 `BankAccount`\
  \ 类的这种替代实现，公共成员将保持不变，但私有成员将变为以下内容：\n\n```cpp\nclass BankAccount\n{\npublic:\n  \
  \      <This part is exactly the same as before>\nprivate:\n    int dollarsPart;\n\
  \    int centsPart;\n    double interestRate;\n    double fraction(double percent);\n\
  };\n```\n\n我们需要修改成员函数的定义以匹配这一变化，但这很容易做到。例如，可以将 `getBalance` 函数的定义和一个版本的构造函数更改为如下所示：\n\
  \n```cpp\ndouble BankAccount::getBalance()\n{\n    return (dollarsPart + 0.01 *\
  \ centsPart);\n}\nBankAccount::BankAccount(int dollars, int cents, double rate)\n\
  {\n    if ((dollars < 0) || (cents < 0) || (rate < 0))\n    {\n        cout << \"\
  Illegal values for money or interest rate.\\n\";\n        exit(1);\n    }\n    dollarsPart\
  \ = dollars;\n    centsPart = cents;\n    interestRate = rate;\n}\n```\n\n同样，其他每个成员函数也可以重新定义，以适应这种存储账户余额和利利率的新方法。\n\
  \n请注意，尽管用户可能将账户余额视为单一数字，但这并不意味着实现必须是 `double` 类型的单一数字。你刚刚看到，例如，它可以是两个 `int` 类型的数字。使用\
  \ `BankAccount` 类型的程序员不需要知道任何关于 `BankAccount` 类型的值是如何实现的这些细节。\n\n这些关于 `BankAccount`\
  \ 类型的注释说明了定义类以使其成为抽象数据类型（ADT）的基本技术。为了定义一个类使其成为抽象数据类型，你需要将程序员如何使用该类型的规范与该类型如何实现的细节分离开。这种分离应该是完全的，以至于你可以更改类的实现而无需对任何使用该类\
  \ ADT 程序进行任何更改。确保这种分离的一种方法是遵循以下规则：\n\n1. 将所有成员变量设为类的私有成员。\n2. 将程序员需要的每个基本操作设置为类的公共成员函数，并完整指定如何使用每个此类公共成员函数。\n\
  3. 将任何辅助函数设为私有成员函数。\n\n在[第 11 章](#fileP7001013976000000000000000005570C.xhtml_P70010139760000000000000000055570C）和[第\
  \ 12 章](#fileP700101397600000000000000000F4BF.xhtml_P700101397600000000000000000F4BF）中，你将学习一些定义\
  \ ADT 的替代方法，但这三条规则是确保类是抽象数据类型的一种常用方法。\n\nADT 的**接口**（interface）告诉你在程序中使用该 ADT。当你将\
  \ ADT 定义为 C++ 类时，接口由类的公共成员函数以及告诉你如何使用这些公共成员函数的注释组成。ADT 的接口应该是你在程序中使用该 ADT 所需要的所有信息。\n\
  \nADT 的**实现**（implementation）告诉该接口是如何被实现为 C++ 代码的。ADT 的实现由类的私有成员以及公共和私有成员函数的定义组成。虽然运行使用\
  \ ADT 的程序需要这些实现，但在编写使用该 ADT 的程序的其余部分时，你不应该需要知道关于实现的任何信息；也就是说，在编写程序的 `main` 部分以及编写\
  \ `main` 部分所使用的任何非成员函数时，你不应该知道关于实现的任何信息。这种情况类似于我们在[第 4 章](#fileP7001013976000000000000000001D54.xhtml_P70010139760000000000000000001D54）和[第\
  \ 5 章](#fileP70010139760000000000000000025F2.xhtml_P70010139760000000000000000025F2）中对普通函数定义所提倡的。ADT\
  \ 的实现就像普通函数的实现一样，应该被看作一个黑盒。\n\n\n\n\n请注意，虽然显示 10.6 中的实现和显示 10.7 中的实现都有一个名为 `interestRate`\
