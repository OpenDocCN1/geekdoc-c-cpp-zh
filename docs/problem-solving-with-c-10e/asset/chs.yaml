  \ 函数都需要一个类型为 `double` 的形式参数表示价格，以及一个类型为 `int` 的形式参数表示尺寸（半径或边长）。因此，这两个函数声明具有的形式参数的数量和类型是相同的。（具体来说，它们都将拥有一个类型为\
  \ `double` 的形式参数和一个类型为 `int` 的形式参数。）因此，编译器将无法决定使用哪种定义。你仍然可以通过定义两个函数来击败这家恶毒披萨店的策略，但它们需要有不同的名称。\n\
  \n29. `unitprice` 的定义没有进行任何输入或输出，因此没有使用 `iostream` 库。在 `main` 中，我们需要 `using` 指令，因为\
  \ `cin` 和 `cout` 定义在 `iostream` 中，而这些定义将 `cin` 和 `cout` 置于 `std` 命名空间中。\n\n# 练习程序\n\
  \n练习程序通常可以通过一个短程序解决，直接应用本章介绍的编程原理。\n\n1. 一升等于 0.264179 加仑。编写一个程序，读取用户汽车消耗的汽油升数和行驶英里数，然后输出汽车每加仑的英里数。你的程序应允许用户根据意愿重复进行此计算。定义一个函数来计算每加仑英里数。你的程序应使用全局定义的常量表示每加仑升数。\n\
  \n2. 修改你的练习程序 1，使其接受两辆汽车的输入数据，并输出每辆汽车每加仑英里数。你的程序还将宣布哪辆汽车燃油效率最高（每加仑英里数最高）。\n\n3.\
  \ 股票价格有时给到最近的八分之一美元；例如 297/8 或 891/2。编写一个程序计算用户持有的某只股票的价值。程序询问持有的股数、价格的整数部分和分数部分。分数部分应以两个\
  \ `int` 值的形式输入，一个是分子，一个是分母。程序然后输出用户的持仓价值。你的程序应允许用户根据意愿重复进行此计算，并包含一个具有三个 `int` 参数的函数定义，这些参数包括价格的整数部分和组成部分的两个整数。该函数返回单股股票的价格，类型为\
  \ `double` 的单一数值。\n\n4. 编写一个程序来衡量过去一年的通胀率。程序询问某物品（如热狗或 1 克拉钻石）在一年前和今天的价格。它将通胀率估算为价差除以年前的价格。你的程序应允许用户根据意愿重复进行此计算。定义一个函数来计算通胀率。通胀率应该是一个类型为\
  \ `double` 的值，以百分比表示速率，例如，5.3 表示 5.3%。\n\n5. 通过增强你上一个练习程序的程序，使其能够打印出物品在计算时间点一年和两年后的预估价格。一年的成本增加被估算为通胀率乘以年初的价格。定义第二个函数，在给定物品当前价格和通胀率作为参数的情况下，确定该物品一年后的预估成本。\n\
  \n6. 为一个计算信用卡账户余额利息的函数编写声明。该函数接收初始余额、每月利率和必须支付利息的月数参数。返回的值是应付利息。不要忘记复利——即对应付利息收取利息。应付利息被加入应付余额中，下个月的利息使用这个更大的余额计算。使用一个与显示\
  \ 2.14 类似（但不需要完全相同）的 `while` 循环。将函数嵌入一个程序中，读取利率、初始账户余额和月数的值，然后输出应付利息。将你的函数定义嵌入一个允许用户计算应付利息的程序中。\n\
  \n7. 质量分别为 `m1` 和 `m2`、距离为 `d` 的两个物体之间的引力公式给出：\n\n$$F = \\frac{Gm_{1}m_{2}}{d^{2}}$$\n\
  \n其中 `G` 是通用常数：\n\n$$G = 6.673 \\times 10^{-8}$$\n\n编写一个函数定义，接收两个体的质量和它们之间距离的参数，并返回引力。你应该使用一个全局定义的常量表示引力常数。将你的函数定义嵌入一个程序中，给定合适的输入时计算引力。你的程序应允许用户根据意愿重复此计算。\n\
  \n8. 我们“幸运”地拥有几个绝对值函数是历史的偶然。当 C++ 出现时，C 库已经可用；它们可以被轻松使用，因此没有使用函数重载来重写。你需要找到能找到的所有绝对值函数，并通过重载\
