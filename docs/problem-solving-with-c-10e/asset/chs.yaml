  \n6. “跳跃”游戏由一个包含 `n` 个正整数的棋板组成，但第一列始终包含 0。这些数字代表进入每一列的成本。这里是一个 `n` 为 6 的示例游戏板：\n\
  \n![一行 6 个相邻的方框，分别包含以下数字：0, 3, 80, 6, 57, 10。](img/ua14_00500.png)\n\n\n\n\n\n#\
  \ 游戏的目标是从第一列移动到最后一列，使得总成本最低。每列中的数字代表进入该列的成本。你始终从第一列开始游戏，并有两种移动方式。你可以移动到相邻列，也可以跳过相邻列落到两列之后。游戏的总成本是所访问列的成本之和。\n\
  \n在上方所示的板中，有多种方法到达终点。从第一列开始，我们目前的成本为 0。我们可以跳到 80，然后跳到 57，最后移动到 10，总成本为 `80 + 57\
  \ + 10 = 147`。然而，一条更便宜的路径是移动到 3，跳到 6，然后跳到 10，总成本为 `3 + 6 + 10 = 19`。\n\n为此问题编写一个递归解决方案，计算游戏的最低成本，并对一个表示为数组的任意大的游戏板输出该值。你的程序不需要输出实际的跳转序列，只需要输出该序列的最低成本。在确保你的解决方案在小数组上有效后，在\
  \ `n` 值不断增大的棋板上进行测试，以感受你解决方案的可扩展性和效率。\n\n## 7. 假设我们可以从自动售卖机购买每块 1 美元的巧克力棒。每块巧克力棒内部都有一优惠券。我们可以用\
  \ 7 张优惠券兑换 1 块巧克力棒。如果我们有 `n` 美元，想知道可以吃掉多少块巧克力棒（包括通过券兑换的）。\n\n例如，如果我们有 20 美元，最初可以购买\
  \ 20 块巧克力棒。这为我们提供了 20 张优惠券。我们可以用 14 张优惠券兑换 2 块额外的巧克力棒。这两块额外的巧克力棒还有 2 张优惠券，所以加上原始购买剩余的\
  \ 6 张优惠券，我们现在总共有 8 张优惠券。这足够我们兑换最后的 1 块巧克力棒。结果我们现在有了 23 块巧克力棒和 2 张剩余的优惠券。\n\n为此问题编写一个递归解决方案，从用户处输入用于购买巧克力棒的金额，并在花完所有钱并尽可能兑换优惠券后，输出你可以收集多少块巧克力棒。你的递归函数将基于拥有的优惠券数量。\n\
  \n## 8. 有些问题需要找到一组项目的所有排列（不同的顺序）。对于一个包含 `n` 个元素的集合 `{a[1], a[2], a[3], . . . a[n]}`，有\
  \ `n!` 种排列。例如，给定集合 `{1, 2, 3}`，有六种排列：\n\n```\n{3, 2, 1} {2, 3, 1} {2, 1, 3} {3,\
  \ 1, 2} {1, 3, 2} {1, 2, 3}\n```\n\n编写一个递归函数生成数字集合的所有排列。这里给出了解决方案的通用大纲，但实现由你决定。程序需要存储一组数字排列集合，你可以通过多种方式实现（例如，节点链表、向量链表、数组等）。你的程序将使用多个不同大小的集合调用递归函数，并打印每个集合生成的排列结果。\n\
  \n一种解决方案是首先排除集合中的第 `n` 个元素。递归地使用 `(n-1)` 个元素的集合找到所有排列。如果我们将第 `n` 个元素插入到这些排列的每个位置，我们就得到了一个包含第\
  \ `n` 个元素的新排列集合。基准情况是集合中只有一个元素，此时解决方案简单就是该单个元素的排列。\n\n例如，考虑寻找 `{1, 2, 3}` 的所有排列。我们排除\
  \ `3` 并递归地找到集合 `{1, 2}` 的所有排列。这包含以下排列：\n\n```\n{1, 2}         {2, 1}\n```\n\n接下来，我们将\
  \ `3` 插入到这些排列的每个位置。对于第一个排列，我们将 `3` 插入到开头、`1` 和 `2` 之间、以及 `2` 之后。对于第二个排列，我们将 `3`\
  \ 插入到开头、`2` 和 `1` 之间、以及 `1` 之后：\n\n```\n{3, 1, 2} {1, 3, 2} {1, 2, 3}  {3, 2, 1}\
  \ {2, 3, 1} {2, 1, 3}\n```\n\n生成的六种排列包含了集合 `{1, 2, 3}` 的所有排列。\n\n## 9. 单词接接游戏由刘易·卡罗于\
  \ 1877 年发明。想法是从起始单词开始，每次改变一个字母，直到到达结束单词。路径上的每个单词必须是英语单词。\n\n例如，从 FISH 开始，你可以通过以下梯子形成到\
  \ MAST 的接字：\n\nFISH, WISH, WASH, MASH, MAST\n\n编写一个使用递归的程序，根据起始单词和结束单词找到单词接字，或判断是否存在单词接字。使用书中源码附带的\
  \ `words.txt` 文件作为你有效单词的字典。该文件包含 87314 个单词。你的程序不需要找到最短的梯子，只要存在，任何梯子都可以。\n\n# 15\
  \ 继承\n\n## 引言\n面向对象编程是一种流行且强大的技术。除其他特性外，它提供了一种被称为继承的新抽象维度。这意味着可以定义非常通用的类。随后，可以定义该类的更具体的版本并进行继承。\n\
  \n## 继承基础\n\n> 如果我们想要改变孩子身上的任何东西，我们应该先检查它，看看是否不是我们自己应该改变的东西。\n\nCARL GUSTAV JUNG，《人格的整合》\n\
  \nC++ 最强大的功能之一是使用继承从一个类派生另一个类。**继承**是从另一个类（称为**基类**）创建一个新类（被称为**派生类**）的过程。派生类自动拥有基类的所有的成员变量和函数，并且拥有额外的成员函数和/或额外的成员变量。\n\
  \n在第 10 章中，我们提到类 `D` 派生自类 `B` 意味着类 `D` 拥有类 `B` 的所有特性以及额外的特性。当类 `D` 派生自类 `B` 时，我们说\
  \ `B` 是基类，`D` 是派生类。我们还说 `D` 是**子类**，`B` 是**父类**。\n\n\n\n\n\n为了说明继承的用处，假设你建立了一个家庭自动化系统，你的车库门和锅炉温控器已连接网络，并可以从计算机访问。你希望从计算机控制并查询这些设备的状态（例如：门是打开的，温控器设置为\
  \ 80 度）。如果这些不同的设备有一个统一的接口，实现这一目标将简单得多。继承让我们在实现这一点的同时，提供一种无需重复组织代码的方法。\n\n首先，考虑家庭自动化系统中“设备”的通用概念。每个设备都必须有型号和序列号。也许每个设备都有查询其状态的方法。我们可以用一个\
  \ `Device` 类来建模，该类包含型号和序列号变量，以及一个用于状态的函数。这种想法是该类包含了所有可能的设备共有的函数和属性。\n\n其次，考虑车库门。它是自动化系统中的一种特定设备。除了像其他设备一样拥有型号、序列号和查询状态的方法外，车库门设备还有一个特定的打开或关闭门的函数。我们可以用\
  \ `DoorDevice` 类来建模车库门。我们需要在这个类中添加一个 `openClose()` 函数。`DoorDevice` 类也是我们知道如何返回设备状态的地方。在通用的\
  \ `Device` 类级别，我们没有足够的信息来返回特定设备的状态，因为在那个层级我们甚至不知道正在处理的是哪种设备。虽然我们需要为 `DoorDevice`\
  \ 添加用于状态和打开/关闭门的函数，但如果我们不需要重复编写为 `Device` 类编写的处理型号和序列号的变量和代码就太好了。\n\n同样，温控器设备也将拥有型号、序列号和查询状态的方法，外还有一个设置温度的函数。我们可以定义一个\
  \ `ThermostatDevice` 类，包含设置温度和返回设备状态的函数，但如果我们不需要再次编写为 `Device` 类编写的处理型号和序列号的变量和代码就太好了！\n\
  \n我们可以通过继承来解决这个问题。在这种情况下，`DoorDevice` “是” `Device`，而 `ThermostatDevice` “是” `Device`。通过将\
  \ `DoorDevice` 和 `ThermostatDevice` 定义为自 `Device` 的派生类，这些类（如果程序员指定的话）就可以访问 `Device`\
  \ 中定义的型号和序列号，我们不需要在 `Device` 类中重写处理这些变量的任何代码。同时，我们可以添加派生类特有的特定代码。这些类之间的关系如显示 15.1\
  \ 所示。\n\n`DoorDevice` 或 `ThermostatDevice` 类型的对象包含了在 `Device` 中定义的函数和变量，例如 `model`\
  \ 和 `serialNumber`。\n\n`status()` 函数可以被重写。如果一个 `DoorDevice` 对象被视为 `Device` 对象，那么调用\
  \ `status()` 将调用 `DoorDevice` 的 `status()` 函数，而不是 `Device` 的 `status()` 函数。当 `Device`\
  \ 类不知道返回什么作为状态，而只有派生类才能返回信息时，这是非常有的。\n\n![展示家庭自动化设备继承层次结构示例的图表](img/fg15_00100.png)\n\
  \n# 显示 15.1 家庭自动化设备继承层次结构示例\n\n图 15.1 完整替代文本\n\n一旦定义了继承关系，那么如果我们创建一个 `DoorDevice`\
  \ 或 `ThermostatDevice` 类型的对象，就可以访问在 `Device` 中定义的函数和变量。例如，如果 `thermostat` 是 `ThermostatDevice`\
  \ 类型的变量，只要 `model` 是 `Device` 类中的公共字符串变量，我们就可以访问 `thermostat.model`。这节省了我们重新定义 `Device`\
  \ 类代码和变量的工作。\n\n我们可以指定 `status()` 函数的行为稍有不同。当我们在基类和派生类中定义相同的函数时，我们将在本书的稍后部分看到有两种选择：重定义函数或重写函数。在这种情况下，我们想要重写函数。如果我们有一个类型为\
  \ `ThermostatDevice` 的对象 `thermostat`，但将 `thermostat` 视为 `Device` 类型（例如，通过将 `thermostat`\
  \ 传递给参数定义为 `Device` 类型的函数），那么调用 `status()` 将调用与 `ThermostatDevice` 关联的定义，而不是与 `Device`\
  \ 关联的定义。这种行为在这种情况下很重要，因为 `Device` 类并不知道返回什么作为状态！这个主题在第 15.3 节中有更详细的探讨。\n\n另一个可以应用继承的示例是考虑第\
  \ 10 章) 账户。我们讨论过 CD 账户是储蓄账户的特殊版本。通过从 `SavingsAccount` 派生 `CDAccount` 类，我们在创建 `CDAccount`\
  \ 对象时会自动继承所有的 `SavingsAccount` 公共函数和变量。C++ 在预定义类中也使用了继承。在使用文件流时，预定义类 `ifstream`\
  \ 通过添加如 `open` 和 `close` 等成员函数派生自预定义类 `istream`。流 `cin` 属于所有输入类（即 `istream`），但不属于输入文件类（即\
  \ `ifstream`），部分由于它缺少派生类 `ifstream` 的成员函数 `open` 和 `close`。\n\n# 派生类\n\n假设我们正在设计一个具有薪资员工和小时薪员工记录的记录程序。这些类之间存在一个自然的层次结构。它们都是具有“员工”属性的人类。\n\
  \n按小时工资的员工是员工的一个子集。另一个子集是每月或每周领取固定工资的员工。虽然程序可能不需要对应所有员工集合的类型，但从更一般的员工概念来思考是有用的。例如，所有员工都有姓名和安全号码，设置和更改姓名及安全号码的成员函数对于薪资员工和小员工是相同的。\n\
  \n在 C++ 中，你可以定义一个名为 `Employee` 的类，包含所有员工（无论是薪资还是小时薪），然后使用该类来定义小时薪和薪资员工的类。显示 15.2\
