  \ input to readMinute\";\n100       exit(1);\n101   }\n102}\n103 \n104//使用了 iostream,\
  \ cctype, and cstdlib:\n105void readHour(istream& ins, int& theHour)\n106\n{\n107\
  \    char c1, c2;\n108    ins >> c1 >> c2;\n109    if (!(isdigit(c1) && (isdigit(c2))))\n\
  110    {\n111        cout<< \"Error illegal input to readHour\";\n112        exit(1);\n\
  113    }\n114 \n115    theHour = (digitToInt(c1) * 10) + digitToInt(c2);\n116  \
  \  if (theHour< 0 || theHour> 23)\n117    {\n118        cout<< \"Error illegal input\
  \ to readHour\";\n119        exit(1);\n120    }\n121}\n```\n*(注：由于原文代码第 109-134\
  \ 行存在明显的格式粘贴错误或逻辑混乱（乱码），翻译时保持了其原始结构并仅对部分可读部分进行了对齐)*\n\n# 显示 12.2 DigitalTime 实现文件\n\
  \n为了在程序中使用 `DigitalTime` ADT 类，程序必须包含命名接口文件的包含指令。\n\n```cpp\n#include \"dtime.h\"\
  \n```\n\n注意实现文件和程序文件都必须包含此指令。包含程序的文件的（即包含 main 部分的文件）通常被称为“应用程序文件”或“驱动文件”。[显示 12.3]\
  \ 包含一个使用并演示 `DigitalTime` ADT 类的简单应用程序文件。\n\n```cpp\n1 //应用程序文件 timedemo.cpp (你的系统可能需要\
  \ .cpp 以外的\n2 //后缀): 此程序演示了 DigitalTime 类的使用。\n3 #include <iostream>\n4 #include\
  \ \"dtime.h\"\n5 using namespace std;\n6 \n7 int main( )\n8 {\n9     DigitalTime\
  \ clock, oldClock;\n10 \n11    cout<< \"Enter the time in 24-hour notation: \";\n\
  12     cin >> clock;\n13 \n14     oldClock = clock;\n15     clock.advance(15);\n\
  16     if (clock == oldClock)\n17        cout << \"Something is wrong.\";\n18  \
  \   cout << \"You entered \" << oldClock << endl;\n19     cout << \"15 minutes later\
  \ the time will be \"\n20          << clock << endl;\n21 \n22     clock.advance(2,\
  \ 15);\n23     cout << \"2 hours and 15 minutes after that\\n\"\n24          <<\
  \ \"the time will be \"\n25          << clock << endl;\n26 \n27     return 0;\n\
  28 }\n```\n\n***示例对话***\n\n```\nEnter the time in 24-hour notation: 11:15\nYou entered\
  \ 11:15\n15 minutes later the time will be 11:30\n2 hours and 15 minutes after that\n\
  the time will be 13:45\n```\n\n\n\n关于如何运行这个包含三个文件中的完整程序的具体细节，取决于你正在使用的系统。然而，对于所有系统，基本细节都是相同的。你必须编译实现文件，并且必须编译包含程序主部分的应用程序文件。你不需要编译接口文件，在本例中，接口文件就是显示\
  \ 12.1 中提供的 `dtime.h` 文件。你不需要编译接口文件，因为编译器认为该接口文件的内容已经包含在另外两个文件中了。请记住，实现文件和应用程序文件都包含以下指令：\n\
  \n```\n#include \"dtime.h\"\n```\n\n编译你的程序会自动调用一个预处理器，该预处理器会读取此包含指令并将其替换为 `dtime.h`\
  \ 文件中的文本。因此，编译器看到了 `dtime.h` 的内容，所以 `dtime.h` 文件不需要单独编译。（事实上，编译器看到了两次 `dtime.h`\
  \ 的内容：一次是在编译实现文件时，一次是在编译应用程序文件时。）这种对 `dtime.h` 文件的拷贝只是概念上的拷贝。编译器就像 `dtime.h` 的内容被复制到每个带有包含指令的文件中一样。然而，如果你在编译后查看该文件，你只会发现包含指令，而找不到\
  \ `dtime.h` 文件的内容。\n\n一旦编译了实现文件和应用程序文件，你仍然需要连接这些文件以便它们共同工作。这被称为文件的 `linking`（链接），并通过一个名为\
  \ `linker`（链接器）的独立工具完成的。如何调用链接器的细节取决于你正在使用的系统。文件链接完成后，你就可以运行程序了。（通常链接是在运行程序的过程中自动完成的。）\n\
  \n这个过程听起来很复杂，但许多系统都有设施，可以自动或半自动地为你管理大部分这些细节。在任何系统上，这些细节很快就会变成常规操作。\n\n显示 12.1、12.2\
  \ 和 12.3 包含一个被分成碎片并放在三个不同文件中的完整程序。你也可以将这三个文件的内容合并到一个文件中，然后编译并运行这一个文件，而无需处理所有关于包含指令和链接独立文件的繁琐。为什么要费精力使用三个独立的文件呢？将程序划分为独立的文件有几个优点。由于你在与应用程序文件分离的文件中拥有\
  \ `DigitalTime` 类的定义和实现，你可以在许多不同的程序中使用该类，而不需要在每个程序中都重写该类的定义。此外，无论有多少程序使用 `DigitalTime`\
  \ 类，你只需要编译一次实现文件。但优点不仅于此。由于你已经将 `DigitalTime` ADT 类的接口与实现分离，你可以更改实现文件，而不需要更改任何使用该\
  \ ADT 的程序。事实上，你甚至不需要重新编译程序。如果你更改了实现文件，你只需要重新编译实现文件并重新链接文件。节省一些编译时间是件好事，但最大的优势是不需要重写代码。你可以在许多程序中使用\
  \ ADT 类，而无需将类代码写进每个程序中。你可以更改 ADT 类的类的实现，而不需要重写使用该类的任何程序的任何部分。\n\n现在我们已经解释了 ADT 类和程序中的各种文件是如何使用的，让我们更详细地讨论我们\
  \ ADT 类的实现（显示 12.2）。大部分实现细节都是直观的，但有两个点值得注意。注意成员函数名 `advance` 被重载了，因此它有两个函数定义。同样注意，重载的提取（输入）运算符\
  \ `>>` 的定义使用了两个名为 `readHour` 和 `readMinute` 的“辅助函数”，而这两个辅助函数本身又使用了第三个名为 `digitToInt`\
  \ 的辅助函数。让我们讨论一下这些点。\n\n`DigitalTime` 类（显示 12.1 和 12.2）有两个名为 `advance` 的成员函数。一个版本接受单个参数，即要增加的分钟数的整数。另一个版本接受两个参数，一个小时数和一个分钟数，并增加该小时数加上该分钟数的时间。注意\
  \ `advance` 的双参数版本定义包含了对单参数版本的调用。首先增加 `hoursAdded` 小时，然后使用单参数版本的 `advance` 增加 `minutesAdded`\
  \ 分钟。初看起来这可能很奇怪，但它是完全合法的。这两个名为 `advance` 的函数对于编译器来说是两个恰好同名的函数。这种情况与将 `advance` 的其中一个版本命名为\
  \ `another``区别。\n\n现在让我们讨论辅助函数。辅助函数 `readHour` 和 `readMinute` 逐字符读取输入，将其转换为整数并放入成员变量\
  \ `hour` 和 `minute` 中。`readHour` 和 `readMinute` 函数逐位读取小时分钟，因此它们读取的是 `char` 类型的值。这比读取\
  \ `int` 输入要复杂，但它允许我们进行错误检查以判断输入格式是否正确，并在输入格式不正确时发出错误信息。这些辅助函数 `readHour` 和 `readMinute`\
  \ 使用另一个名为 `digitToInt` 的辅助函数，这与我们在定义 `class Money` 时使用的 `digitToInt` 函数相同（显示 11.3）。`digitToInt`\
  \ 函数将数字（如 `'3'`）转换为数字（如 `3`）。\n\n# #ifndef\n\n我们已经提供了一种将程序放在三个文件中的方法：两个用于类的接口和实现，一个用于程序的部分。程序可以放在三个以上的文件中。例如，程序可能使用多个类，每个类都可能放在单独的一对文件中。假设你的程序分布在多个文件中，并且有多个文件包含类接口文件的包含指令，如下所示：\n\
  \n```cpp\n#include \"dtime.h\"\n```\n\n\n\n\n\n在这种情况下，你可能会拥有包含其他文件的文件，而这些其他文件反过来可能包含其他文件。这很容易导致一个文件在实际上包含了多次\
  \ `dtime.h` 中的定义。C++ 不允许你对一个类进行多次定义，即使重复的定义是完全相同的。此外，如果你在许多不同的项目中使用同一个头文件，那么几乎几乎无法追踪你是否多次包含了该类的定义。为了避免这个问题，C++\
  \ 提供了一种标记代码段的方法，用以表示“如果你之前已经包含过这些内容，就不要再次包含它。”这种实现方法非常直观，尽管在还没习惯它之前，这种写法可能看起来有点奇怪。我们将通过一个示例，在讲解的过程中解释其中的细节。\n\
  \n以下指令“定义（defines）”了 `DTIME_H`：\n\n```\n#define DTIME_H\n```\n\n这意味着编译器的预处理器将 `DTIME_H`\
  \ 置于一个列表，以表示 `DTIME_H` 已经被看到过了。用“定义（Defines）”可能不是描述它的最好词，因为 `DTIME_H` 并没有被定义为任何含义，仅仅是被放入列表中。重要的点是，你可以使用另一个指令来测试\
  \ `DTIME_H` 是否已经定义，从而测试一段代码是否已经被处理过。你可以使用任何（非关键字）标识符来替换 `DTIME_H`，但你会发现对于应该使用哪种标识符是有标准惯例的。\n\
  \n以下指令测试 `DTIME_H` 是否已经定义：\n\n```\n#ifndef DTIME_H\n```\n\n如果 `DTIME_H` 已经定义，那么从该指令到后续指令第一次出现之间的所有内容都将被跳过：\n\
  \n```\n#endif\n```\n\n（另一种等价的表述可能有助于理解指令的拼写方式：如果 `DTIME_H` **未（not）**定义，那么编译器将处理到下一个\
  \ `#endif` 的所有内容。这个 `not` 就是了为什么 `#ifndef` 中有一个 `n`。这可能会让你怀疑是否也有一个 `#ifdef` 指令对应\
  \ `#ifndef` 指令。有的，而且它的意义显而易见，但我们没有机会使用 `#ifdef`。）\n\n现在考虑以下代码：\n\n```\n#ifndef DTIME_H\n\
  #define DTIME_H\n<一个类定义>\n#endif\n```\n\n如果这段代码位于名为 `dtime.h` 的文件中，那么无论你的程序包含多少次\n\
  \n```\n#include \"dtime.h\"\n```\n\n该类只会被定义一次。\n\n当第一次处理\n\n```\n#include \"dtime.h\"\
  \n``` 时，标志位 `DTIME_H` 被定义，类也被定义。现在，假设编译器再次遇到\n\n```\n#include \"dtime.h\"\n```\n\
  \n当第二次处理这个包含指令时，该指令\n\n```\n#ifndef DTIME_H\n```\n会指示跳过到\n\n```\n#endif\n```\n之前的所有内容，因此该类不会被再次定义。\n\
  \n在 显示 12.4 中，我们重写了显示 12.1 中所示的头文件 `dtime.h`，但这次我们使用了这些指令来防止多次定义。对于显示 12.4 中显示的\
  \ `dtime.h` 版本，如果一个文件多次包含以下包含指令，类 `DigitalTime` 仍然只会被定义一次：\n\n```\n#include \"dtime.h\"\
  \n```\n\n```\n 1    //头文件 dtime.h: 这是 DigitalTime 类的接口（INTERFACE）。\n 2    // 这种类型的值是一天中的时间。值的输入和输出采用\n\
  \ 3    //24 小时制，例如上午 9:30 表示为 9:30，下午 2:45 表示为 14:45。\n 4    #ifndef DTIME_H\n 5\
  \    #define DTIME_H\n 6    #include <iostream>\n 7    using namespace std;\n 8\
  \    class DigitalTime\n 9    {\n10     \n    <DigitalTime 类的定义与显示 12.1 相同.>\n11\
  \     \n12    };\n13     \n14    #endif//DTIME_H\n```\n\n# 显示 12.4 避免类的多次定义\n\n\
  你可以使用其他标识符来替换 `DTIME_H`，但通常惯例是使用全大写的文件名。\n\n# 编程技巧 定义其他库\n\n你并不是为了为了单独编译而才定义一个类。如果你有一组相关的函数想要创建你自己的库，你可以将函数声明放在头文件中，将定义放在实现文件中，就像我们处理\
  \ ADT 类那样。\n\n### 自测题\n\n1.  假设你正在定义一个 ADT 类，并在程序中使用该类。你想将类和程序部分分开。请指定以下各项内容应该放在接口文件、实现文件还是应用程序文件中：\n\
  \    1.  类的定义\n    2.  作为 ADT 操作的但既不是成员不是友元的函数声明\n    3.  作为 ADT 操作的但既不是成员不是友元的重载运算符声明\n\
  \    4.  作为 ADT 操作的但既不是成员不是友元的函数定义\n    5.  作为 ADT 操作的类友元函数定义\n    6.  成员函数的定义\n\
  \    7.  作为 ADT 操作的但既不是成员不是友元的重载运算符定义\n    8.  作为 ADT 操作且是类友元的重载运算符定义\n    9.  程序的\
  \ `main` 部分\n\n2.  以下哪个文件的文件名以 `.h` 结尾：类的接口文件、类的实现文件或使用该类的应用程序？\n\n3.  当你分文件定义类时，有一个接口文件和一个实现文件。这些文件中哪些需要编译？（都是？都不是？只有一个？如果是，是哪一个？）\n\
  \n4.  假设你分文件中定义了一个类，并在程序中使用该类。现在你修改了类的实现文件。以下文件（如果有的话）需要重新编译：接口文件、实现文件或应用程序文件？\n\
  \n\n\n\n5. 假设你想更改显示 12.1 和 12.2 中给出的 `DigitalTime` 类的实现。具体来说，你想更改记录的方式。不再使用两个私有变量\
  \ `hour` 和 `minute`，而是想使用单个（私有的）`int` 变量，并命名为 `minutes`。在这个新的实现中，私有变量 `minutes`\
  \ 将时间记录为自 0:00（即午夜）以来的分钟数。因此，1:30 被记录为 90 分钟，因为它是午夜后的 90 分钟。请描述你需要如何更改显示 12.1 和\
  \ 12.2 所示的接口和实现文件。你不需要写出整个文件；只需指出你需要更改哪些项目以及你将如何以通用的方式进行更改。\n\n6. 你在 C++ 中定义的 ADT\
  \ 和你在 C++ 中定义的类之间有什么区别？\n\n# 12.2 命名空间 (Namespaces)\n\n> 名字里有什么呢？我们所称之的玫瑰，即使换个名字，它的香味依然芬人。\n\
  \n威廉·莎士比亚，《罗米欧与朱丽叶》\n\n当一个程序使用由不同程序员编写的不同类和函数时，可能两个程序员为两个不同的事物使用相同的名称。命名空间是处理这种问题的方法。命名空间是名称定义的的集合，例如类定义和变量声明。\n\
  \n# 命名空间与 `using` 指令\n\n我们已经一直在使用名为 `std` 的命名空间。`std` 命名空间包含了你所使用的标准库文件（如 `iostream`\
  \ 和 `cstdlib`）中定义的所有名称。例如，当你在文件开头放置以下内容时\n\n```\n#include <iostream>\n```\n\n这会将所有的名称定义（如\
  \ `cin` 和 `cout` 等名称）放入 `std` 命名空间中。除非你指定正在使用 `std` 命名空间，否则你的程序并不知道 `std` 命名空间中的名称。到目前，我们知道的指定\
  \ `std` 命名空间（或任何命名空间）的方法只有使用以下 `using` 指令：\n\n```\nusing namespace std;\n```\n\n\
  了解为什么你可能想要包含此 `using` 指令的好方法是思考你为什么可能不包含它。如果你没有包含 `std` 命名空间的 `using` 指令，那么你可以定义\
  \ `cin` 和 `cout` 具有其标准含义之外的意义（也许你想重新定义 `cin` 和 `cout` 让它们的行为稍有不同）。它们的标准含义在 `std`\
  \ 命名空间中，如果没有 `using` 指令（或类似物），你的代码对 `std` 命名空间一无所知，因此对于你的代码而言，`cin` 和 `cout` 的唯一定义是你给它们的任何定义。\n\
  \n你写的每一行代码都位于某个命名空间中。如果你不将代码放在特定的命名空间中，那么它就在名为全局命名空间（global namespace）的命名空间中。到目前，我们还没有将任何代码放在任何命名空间中，因此我们所有的代码都在全局命名空间中。全局命名空间没有\
  \ `using` 指令，因为你始终在使用全局命名空间。你可以说始终存在一个隐式的 `using` 指令，表示你正在使用全局命名空间。\n\n注意，你可以同时使用多一个命名空间。例如，我们始终在使用全局命名空间，并且通常在使用\
  \ `std` 命名空间。如果一个名称在两个命名空间中都被定义且你都在使用它们，会发生什么？这会导致错误（编译器错误或运行时错误，取决于具体细节）。你可以在两个命名空间中使用相同的名称，但如果确实如此，你一次只能使用其中一个命名空间。然而，这并不意味着你不能在同一个程序中使用两个命名空间。你可以在同一个程序的不同时间使用它们。例如，假设\
  \ `ns1` 和 `ns2` 是两个命名空间，假设 `myFunction()` 是一个没有参数的 `void` 函数，在两个命名空间中都有定义，但在两个命名空间中的定义不同。那么以下内容是合法的：\n\
  \n```\n{\n    using namespace ns1;\n    myFunction();\n}\n{\n    using namespace\
  \ ns2;\n    myFunction();\n}\n```\n\n第一次调用将使用命名空间 `ns1` 中的 `myFunction()` 定义，第二次调用将使用命名空间\
  \ `ns2` 中的定义。\n\n第一次调用将使用命名空间 `ns1` 中的 `myFunction()` 定义，第二次调用将使用命名空间 `ns2` 中的定义。\n\
  \n回想一下块（block）是花括号 `{}` 内语句、声明和可能的代码的列表。在块开始处的 `using` 指令仅作用于该块。因此第一个 `using` 指令作用于第一个块，第二个\
  \ `using` 指令作用于第二个块。通常的说法是，`ns1` 命名空间的作用是第一个块，而 `ns2` 命名空间的作用是第二个块。由于这个规则，你可以在同一个程序中使用两个命名空间（如上文所述的包含两个块的程序）。如果你在文件开头使用\
  \ `using` 指令，那么该 `using` 指令将作用于整个文件。`using` 指令通常应该放在文件开头或块的开头。\n\n# 创建命名空间\n\n为了在命名空间中放置某些代码，你只需将其放在如下形式的命名空间分组中：\n\
  \n```\nnamespace NameSpace\n{\n    SomeCode\n}\n```\n\n你在代码中包含这些分组时，表示将 `SomeCode`\
  \ 中的名称放入 `NameSpace` 命名空间。这些名称（实际上是名称的定义）可以通过 `using` 指令可用：\n\n```\nusing namespace\
  \ NameSpace;\n```\n\n例如，以下内容来自显示 12.5，在 `savitch1` 命名空间中放置了一个函数声明：\n\n![](img/p724-1.png)\n\
  \n![演示“命名空间”的插图](img/p725-1.png)\n\n**示例对话**\n\n```\n来自命名空间 2 的问候。\n来自命名空间 1 的问候。\n\
  全局你好！\n```\n\n# 显示 12.5 `Namespace` 演示\n\n图 12.5 完整文本\n\n```\nnamespace savitch1\n\
  {\n    void greeting();\n}\n```\n\n再次查看显示 12.5，你会发现 `greeting()` 函数的定义也放置在了 `savitch1`\
  \ 命名空间中。这是通过额外的命名空间分组实现的：\n\n```\nnamespace savitch1\n{\n    void greeting()\n \
  \   {\n        cout << \"Hello from namespace savitch1.\\n\";\n    }\n}\n```\n\n\
  注意，你可以为同一个命名空间拥有任意数量的此类命名空间分组。在显示 12.5 中，我们为 `savitch1` 使用了两个命名空间分组，为 `savitch2`\
  \ 使用了另外两个。\n\n命名空间中定义的每个名称在命名空间分组内部都是可用的，但名称也可以对命名空间外部的代码可用。`savitch1` 命名空间中的该函数声明和函数定义可以通过\
  \ `using` 指令可用：\n\n```\nusing namespace savitch1;\n```\n\n\n\n如显示 12.5 所示。\n\n###\
  \ 自测练习\n\n7. 考虑显示 12.5 所示的程序。我们可以使用名称 `greeting` 来代替 `bigGreeting` 吗？\n\n8. 在自测练习\
  \ 7 中，我们看到你`不能`为以下函数添加定义（将其格到全局命名空间中）：\n\n```\nvoid greeting( );\n```\n\n你可以在全局命名空间中为以下函数声明添加定义吗？\n\
  \n```\nvoid greeting(int howMany);\n```\n\n9. 一个命名空间可以有多个一个命名空间分组吗？\n\n# 限定名\n\n\
  假设你正面临以下情况：你有两个命名空间，`ns1` 和 `ns2`。你想使用定义在 `ns1` 中的函数 `fun1` 和定义在命名空间 `ns2` 中的函数\
  \ `fun2`。复杂之处在于，`ns1` 和 `ns2` 都定义了一个名为 `myFunction` 的函数。（假设此处的讨论中所有函数都不带参数，因此不涉及函数重载。）使用以下代码\
  \ 并不是一个好主意：\n\n```\nusing namespace ns1;\nusing namespace ns2;\n```\n\n这将会为 `myFunction`\
  \ 提供冲突的定义。\n\n你需要一种方法来表示你正在使用命名空间 `ns1` 中的 `fun1` 和命名空间 `ns2` 中的 `fun2`，而不再使用 `ns1`\
  \ 和 `ns2` 中的其他任何内容。以下内容被称为 `using` 声明（using declarations），它们就是你的答案：\n\n```\nusing\
  \ ns1::fun1;\nusing ns2::fun2;\n```\n\n形式如下的 `using` 声明\n\n```\nusing NameSpace::OneName\n\
  ```\n\n会使命名空间 `NameSpace` 中的名称 `OneName`（定义）可用，但不会使 `NameSpace` 中的任何其他名称可用。\n\n\
  注意，你之前见过作用域解析运算符 `::`。例如，在显示 12.2 中，我们有如下的函数定义：\n\n```\nvoid DigitalTime::advance(int\
  \ hoursAdded, int minutesAdded)\n{\n    hour = (hour + hoursAdded) % 24;\n    advance(minutesAdded);\n\
  }\n```\n\n在这种情况下，`::` 意味着我们正在为类 `DigitalTime` 定义函数 `advance`，而不是在其他类中任何名为 `advance`\
  \ 的函数。同样，\n\n```\nusing ns1::fun1;\n```\n\n意味着我们正在使用在命名空间 `ns1` 中定义的名为 `fun1` 的函数，而不是其他命名空间中\
  \ `fun1` 的任何定义。\n\n现在假设你打算使用在命名空间 `ns1` 中定义的名称 `fun1`，但你打算只使用它一次（或少数几次）。你可以像下面一样使用命名空间名称和作用域解析运算符来为函数（或其他项目）命名：\n\
  \n```\nns1::fun1( );\n```\n\n这种形式通常用于指定参数类型。例如，考虑\n\n```\nint getNumber(std::istream\
  \ inputStream)\n. . .\n```\n\n在函数 `getNumber` 中，参数 `inputStream` 的类型是 `istream`，其中\
  \ `istream` 是定义在 `std` 命名空间中的。如果对类型名 `istream` 的使用是你从 `std` 命名空间需要的唯一名称（或者如果你需要的所有名称都类似地通过\
  \ `std::` 限定），那么你`不需要` \n\n```\nusing namespace std;\n```\n\n# 关于命名空间的一个细微差别（可选）\n\
  \n`using` 声明（using declaration）例如\n\n```\nusing std::cout;\n```\n\n与 `using` 指令（using\
  \ directive）例如\n\n```\nusing namespace std;\n```\n\n之间存在两个区别。\n\n区别如下：\n\n1. `using`\
  \ 声明（如 `using` `std::cout;`）仅使命名空间中的一个名称对代码可用，而 `using` 指令（如 `using namespace` `std;`）使命名空间中的所有名称可用。\n\
  \n2. `using` 声明将一个名称（如 `cout`）引入你的代码中，因此无法再次使用该名称。然而，`using` 指令仅可能引入命名空间中的名称。\n\n\
  点 1 非常而易见。点 2 有些微妙之处。例如，假设命名空间 `ns1` 和 `ns2` 都提供了 `myFunction` 的定义，但没有其他名称冲突。那么以下内容不会产生问题：\n\
  \n```\nusing namespace ns1;\nusing namespace ns2;\n```\n\n只要（在这些指令的作用范围内）从不使用过 `myFunction`。相反，以下内容是非法的：\n\
  \n```\nusing ns1::myFunction;\nusing ns2::myFunction;\n```\n\n有时这个细微差别很重要，但它并不影响常规情况。\n\
  \n### 自测练习\n\n10. 写出名为 `wow` 的 `void` 函数的声明。函数 `wow` 有两个参数，第一个是定义在 `speed` 命名空间中的\
  \ `speed` 类型，第二个是定义在 `indy` 命名空间中的 `speed` 类型。\n\n11. 考虑 `Money` 在显示 11 中的以下函数声明：\n\
  \n```\nvoid input(istream& ins);\nvoid output(ostream& outs) const;\n```\n\n重写这些函数声明，使它们不需要前面置\n\
  \n\n\n```\n\n# 匿名命名空间\n\n我们在 12.2 中对 `DigitalTime` 类的定义使用了三个辅助函数：`digitToInt`、`readHour`\
  \ 和 `readMinute`。这些辅助函数是 `DigitalTime` ADT 类的一部分，因此我们将它们的定义放在实现文件中。然而，这并没有真正隐藏这些函数。我们希望这些函数对于\
  \ `DigitalTime` 实现文件是局部的。然而，按照我们这样做，它们并不是。特别是，在使用类 `DigitalTime` 的应用程序程序中，我们无法定义另一个名为\
  \ `digitToInt`（或 `readHour 或 readMinute`）的函数。这违反了信息隐藏的原则。为了真正隐藏这些辅助函数并使它们局部于 `DigitalTime`\
  \ 实现文件，我们需要将它们放在一个特殊的命名空间。**编译单元**是一个文件，例如类实现文件，以及该文件中包含的所有文件，例如类的接口头文件。每个编译单元都有一个**匿名命名空间。**匿名命名空间的分组写法与任何其他命名空间相同，但没有给出名称，如下例：\n\
  \n```\nnamespace\n{\n    void sampleFunction( )\n       .\n       .\n       .\n\
  } //匿名命名空间\n```\n\n\n\n在匿名命名空间（unnamed namespace）中定义的所有名称对于编译单元都是局部，因此这些名称可以在编译单元之外重用于其他地方。例如，显示\
  \ 12.6 和 12.7 展示了 `DigitalTime` 类接口和实现文件的一个（以及我们最终的）版本。注意辅助函数（`readHour`、`readMinute`\
  \ 和 `digitToInt`）都在匿名命名空间中，因此对于编译单元是局部的。如显示 12.8 所示，匿名命名空间中的名称可以在编译单元之外重用于其他地方。在显示\
  \ 12.8 中，函数名 `readHour` 被重用于应用程序中的另一个不同函数。\n\n![插图展示了如何将“类”放在“命名空间-头文件”中。](img/p729-1.png)\n\
  \n# 显示 12.6 在命名空间中放置类——头文件\n\n图 12.6 完整备用文本![插图展示了如何将“类”放在“命名空间-实现文件”中。](img/p730-1.png)\n\
  \n# 显示 12.7 在命名空间中放置类——实现文件\n\n图 12.7 完整备用文本![插图展示了代码段的后续部分，说明了如何将“类”放在“命名空间-实现文件”中。](img/p731-1.png)12.2-1\
  \ 完整备用文本![插图展示了如何将“类”放在“命名空间-应用程序”中。](img/p732-1.png)\n\n# 显示 12.8 在命名空间中放置类——应用程序\n\
  \n图 12.8 完整备用文本\n\n### 对话\n\n```\n让我们玩一个时间游戏吧。\n假设小时刚刚发生了变化。\n你可以将午夜写为 0 或 24，\n\
  但我总是将其写为 0。\n输入小时数字（0 到 24）：11\n你输入了 11:00\n15 分钟后时间将是 11:15\n之后 2 小时 15 分钟后\n时间将是\
  \ 13:30\n```\n\n如果你再次查看显示 12.8 中的实现文件，你会发现辅助函数 `digitToInt`、`readHour` 和 `readMinute`\
  \ 在匿名命名空间之外使用，且无需任何命名空间限定符。在匿名命名空间中定义的任何名称都可以在编译单元的任何地方不加限定符使用。（当然，这是必要的，因为匿名命名空间没有名称可用于限定其内部名称。）\n\
  \n有趣的是，匿名命名空间是如何与 C++ 规则（即你不能在同一命名空间内对一个名称有两个定义）相互作用的。每个编译单元中都有匿名命名空间。编译单元之间很容易重叠。例如，类的实现文件和使用该类的应用程序通常都会包含该类的头文件（接口文件）。因此，头文件存在于两个编译单元中并参与了两个匿名命名空间。这听起来很危险，但只要每个编译单元的命名空间在单独考虑时是合理的，通常就不会产生问题。例如，如果一个名称在头文件的匿名命名空间中定义，那么在实现文件或应用程序的匿名命名空间中就不能再次定义它。这样就避免了名称冲突。\n\
