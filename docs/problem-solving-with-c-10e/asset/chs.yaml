  \n> 一切皆有可能。\n\n通用准则\n\n## 引言\n\n在第 4 章中讨论的自顶向下设计策略是为程序设计算法的有效方法。你将程序的任务划分为子任务，然后作为函数实现这些子任务的算法。到目前为止，我们已经看到如何定义以某些参数的值开始并返回单个值作为函数调用结果的函数。计算单个值的子任务是一种非常重要的子任务类型，但它不是唯一的类型。在本章中，我们将完成对\
  \ C++ 函数的描述，并介绍设计执行其他类型子任务的函数的技术。\n\n### 前提条件\n\n在阅读本章之前，你应该阅读第 2 章到第 4 章。\n\n#\
  \ 5.1 `void` 函数\n\n子任务在 C++ 中是以函数形式实现的。第 4 章中讨论的函数总是返回单个值，但还有其他形式的子任务。子任务可能会产生多个值，也可能完全不产生值。在\
  \ C++ 中，一个函数要么返回单个值，要么完全不返回任何值。正如我们在本章稍后看到的，产生多个不同值的子任务通常（也许很矛盾的是）被实现为不返回任何值的函数。然而，目前，让我们避免这种复杂性，专注于关注直观上不产生任何值的子任务，并看看这些子任务是如何实现的。不返回值的函数被称为\
  \ `void` 函数。例如，程序的一个典型子任务是输出某些计算的结果。这个子任务在屏幕上产生输出，但没有为程序的其余部分产生任何值。这种子任务将实现为 `void`\
  \ 函数。\n\n# `void` 函数的定义\n\n在 C++ 中，`void` 函数的定义方式与返回值的函数几乎相同。例如，以下是一个 `void` 函数，它输出计算结果，将以华氏度表示的温度转换为以摄氏度表示。实际计算将在程序的其他地方完成。这个\
  \ `void` 函数仅实现输出计算结果的子任务。目前，我们不需要担心计算将如何进行。\n\n```\nvoid showResults(double fDegrees,\
  \ double cDegrees)\n{\n    using namespace std;\n    cout.setf(ios::fixed);\n  \
  \  cout.setf(ios::showpoint);\n    cout.precision(1);\n    cout << fDegrees\n  \
  \       << \" degrees Fahrenheit is equivalent to\\n\"\n         << cDegrees <<\
  \ \" degrees Celsius.\\n\";\n}\n```\n\n`void` 函数的定义方式与返回值的函数几乎相同。例如，以下是一个 `void`\
  \ 函数，它输出计算结果，将华氏度表示的温度转换为摄氏度。实际计算将在程序的其他地方完成。这个 `void` 函数仅实现输出计算结果的子任务。目前，我们不需要担心计算将如何进行。\n\
  \n```\nvoid showResults(double fDegrees, double cDegrees)\n{\n    using namespace\
