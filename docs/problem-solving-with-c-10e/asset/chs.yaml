  \ Input\n\nThe C string `\"1234\"` and the number `1234` are not the same things.\
  \ The first is a sequence of characters; the second is a number. In everyday life,\
  \ we write them the same way and blur this distinction, but in a C++ program this\
  \ distinction cannot be ignored. If you want to do arithmetic, you need `1234`,\
  \ not `\"1234\"`. If you want to add a comma to the numeral for one thousand two\
  \ hundred thirty four, then you want to change the C string `\"1234\"` to the C\
  \ string `\"1,234\"`. When designing numeric input, it is often useful to read the\
  \ input as a string of characters, edit the string, and then convert the string\
  \ to a number. For example, if you want your program to read an amount of money,\
  \ the input may or may not begin with a dollar sign. If your program is reading\
  \ percentages, the input may or may not have a percent sign at the end. If your\
  \ program reads the input as a string of characters, it can store the string in\
  \ a C-string variable and remove any unwanted characters, leaving only a C string\
  \ of digits. Your program then needs to convert this C string of digits to a number,\
  \ which can be easily easily done with the predefined function `atoi`.\n\nThe function\
  \ `atoi` takes one argument that is a C string and returns the `int` value that\
  \ corresponds to that C string. For example, `atoi(\"1234\")` returns the integer\
  \ `1234`. If the argument does not correspond to an `int` value, then `atoi` returns\
  \ 0. For example, `atoi(\"#37\")` returns 0, because the character ‘#’ is not a\
  \ digit. You pronounce `atoi` as “A to I,” which is an abbreviation of “alphabetic\
  \ to integer.” The function `atoi` is in the library with header file `cstdlib`,\
  \ so any program that uses it must contain the following directive:\n\n```cpp\n\
  #include <cstdlib>\n```\n\nIf your numbers are too large to be values of type `int`,\
  \ you can convert them from C strings to values of type `long`. The function `atol`\
  \ performs the same conversion as the function `atoi` except that `atol` returns\
  \ values of type `long` and thus can accommodate larger integer values (on systems\
  \ where this is a concern).\n\n[Display 8.2] contains the definition of a function\
