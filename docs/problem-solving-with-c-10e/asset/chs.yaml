  \ 按照升序排序。\n30    //使用二分查找算法确定 target 是否在范围\n31    //[first, last) 中。\n32    //时间复杂度：对于随机访问迭代器为\
  \ O(log N)。对于非随机访问\n33    //迭代器，线性级为 N，其中 N 是范围 [first, last) 的大小。\n```\n\n这些对于前向迭代器都有效，这意味着它们也适用于双向迭代器和随机访问迭代器。（在某些情况下，它们甚至适用于其他类型的迭代器，我们尚未进行详细介绍。）\n\
  \n# 显示 18.18 一些非修改泛型函数\n\n注意，当给出两个范围时，它们不需要在同一个容器中，甚至不需要是同类型的容器。例如，对于 `search` 函数，范围\
  \ `[first1, last1)` 和 `[first2, last2)` 可能在不同的容器中。\n\n注意，在 [显示 18.18 中有三个函数：`find`、`search`\
  \ 和 `binary_search`。`search` 用于查找子序列，而 `find` 和 `binary_search` 用于查找单个值。在查找单个元素时如何决定使用\
  \ `find` 还是 `binary_search`？一个返回迭代器，另一个返回布尔值，但这不是最大的区别。`binary_search` 要求范围是有序的且复杂度为\
  \ O(log N）；`find` 函数不要求范围排序，但是线性时间。如果你有有序元素，可以使用 `binary_search` 更快地查找。\n\n注意，使用\
  \ `binary_search` 函数时，你可以保证实现将使用第 14 章 中讨论过的二分查找算法。使用二分查找算法的重要性在于它保证了非常快的运行时间，O(log\
  \ N)。如果你没有读过第 14 章且没有听说过二分查找，只需将其视为一种要求元素排序的快速查找算法。这些是与二分查找相关的全部要点。\n\n### 自测练习\n\
