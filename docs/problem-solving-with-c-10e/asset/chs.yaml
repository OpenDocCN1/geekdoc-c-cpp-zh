  May the hair on your toes grow long and curly.\n```\n\n# C 字符串到数字的转换与健壮输入\n\nC 字符串\
  \ `\"1234\"` 和数字 `1234` 并不是同一个东西。前者是一个字符序列；后者是一个数字。在日常生活中，我们用相同的方式写它们并模糊了这种区别，但在\
  \ C++ 程序中，这种区别是不能被忽视的。如果你想进行算术运算，你需要的是 `1234` 而不是 `\"1234\"`。如果你想在千两百三十四这个数字中加入一个逗号，那么你就需要将\
  \ C 字符串 `\"1234\"` 改为 C 字符串 `\"1,234\"`。在设计数值输入时，将输入读取为字符字符串、编辑字符串，然后将字符串转换为数字是有用的。例如，如果你想让程序读取一个金额，输入可能以美元符号开头，也可能没有。如果你的程序正在读取百分比，输入末尾可能有百分号，也可能没有。如果你的程序将输入视为字符字符串，它可以将字符串存储在\
  \ C 字符串变量中并移除任何不需要的字符，只留下一个包含数字的 C 字符串。然后你的程序需要将这个数字 C 字符串转换为数字，可以通过预定义的函数 `atoi`\
  \ 轻松完成。\n\n`atoi` 函数接受一个 C 字符串作为参数，并返回与该 C 字符串对应的 `int` 值。例如，`atoi(\"1234\")` 返回整数\
  \ `1234`。如果参数没有对应任何 `int` 值，则 `atoi` 返回 0。例如，`atoi(\"#37\")` 返回 0，因为字符‘#’不是数字。你把\
  \ `atoi` 读作“A to I”，它是“alphabetic to integer”（字母到整数）的缩写。`atoi` 函数位于头文件为 `cstdlib`\
  \ 的库中，因此任何使用它的程序必须包含以下指令：\n\n```cpp\n#include <cstdlib>\n```\n\n如果你的数字太大，无法作为 `int`\
  \ 类型的值，你可以将它们从 C 字符串转换为 `long` 类型的值。`atol` 函数执行与 `atoi` 相同的转换，不同之处 `atol` 返回的是 `long`\
  \ 类型的值，因此可以容纳更大的整数值（在存在此类问题的系统中）。\n\n[Display 8.2] 包含一个名为 `readAndClean` 的函数定义，它读取一行输入并丢弃除数字\
