  \ 10 名之一，则将其添加到列表中。相同的名称和分数可以出现多次。例如，如果 Bill 玩了 3 次分别得到 100、99 分，而 Bob 玩了一次得到 50\
  \ 分，那么高分将是 Bill 100, Bill 99, Bob 50。\n2. 打印前 10 名和分数，按分数从高到低排序。\n3. 允许用户输入玩家名称，如果在前\
