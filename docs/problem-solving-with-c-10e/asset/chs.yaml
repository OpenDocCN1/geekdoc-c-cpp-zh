  \ 和 `slist` 保证它们的迭代器不会因添加或删除而移动，除非该迭代器位于被移除的元素上。模板类 `vector` 和 `deque` 则不提供此类保证。[显示\
  \ 18.19] 中的某些函数模板保证了某些特定迭代器的值，而且无论容器是什么，你当然可以依赖这些保证。\n\n### 自测练习题\n\n21. 你可以在 `list`\
