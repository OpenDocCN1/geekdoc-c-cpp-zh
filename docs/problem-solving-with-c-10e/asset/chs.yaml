  \n# 10.4 继承引论\nC++ 最强大的功能之一是使用 `派生类`。“继承”这个词只是派生类主题的另一个名称。当我们说一个类派自另一个类时，意味着派生类是通过添加功能从另一个类获得的。例如，假设我们定义了一个车辆类，它具有记录车辆轮数和最大人数的成员变量。该类还有访问器和修改器函数。想象我们接着定义了一个汽车类，它具有与车辆类类似的成员变量和函数。此外，我们的汽车类还会增加如油箱燃料量车牌号之类的成员变量，并增加成员函数。与其在汽车类内部重复车辆类的成员变量和函数的定义，我们可以使用\
  \ C++ 的继承机制让汽车类继承车辆类的成员变量和函数。\n\n继承允许你定义一个通用类，然后定义添加了一些新细节的特定类。这节省了工作，因为更具体的（即派生的）类继承了通用类的属性，程序员只需要编写新功能。本节将首先介绍继承和派生类的概念，然后简要描述如何创建你自己的派生类。继承的细节留给第\
  \ 15 章。\n\n\n\n\n\n考虑在显示 10.7 中定义的 `BankAccount` 类。该类跟踪银行账户的金额和利率——这些是适用于任何计息账户的通用特性。如果我们想实现更特定类型的银行账户，那么就有一个自然的层级结构来对账户类型分组。显示\
  \ 10.8 描绘了银行账户、支票账户、货币市场账户、储蓄账户和定期存款（CD）账户这种层级安排的一部分。在层级结构中，`BankAccount` 是最通用的账户类型；更具体的账户类型显示在下方。箭头从特定账户类型指向更通用的账户类型。除了表示不同类型的银行账户外，每个框还对应于我们可以在\
  \ C++ 中实现的类。\n\n![显示类层级的流程图。箭头表示框从底到上的流，如下：货币市场账户指向支票账户，支票账户指向银行账户。CD 账户指向储蓄账户，储蓄账户指向银行账户。](img/fg10_00800.png)\n\
  \n# 显示 10.8 类层级\n\n例如，支票账户可以执行银行账户的所有操作（存储金额和利率），但还允许客户存款存款和支票。同样，储蓄账户可以执行银行账户的所有操作，但还允许客户进行存款和取款。与支票账户不同，储蓄账户可能不允许客户开具支票。由于支票账户和储蓄账户都是银行账户的类型，因此它们直接显示在\
  \ `BankAccount` 类的下方显示 10.8。当我们说某个类 A 是另一个类 B 的`派生类`时，意味着类 A 拥有 B 的所有特征，但它还具有`新增特征`。在图中表示这种关系的惯例是从特定类到更通用的类画一个空心箭头。例如，在显示\
  \ 10.8 中，`CheckingAccount` 和 `SavingsAccount` 类是 `BankAccount` 类的派生类。\n\n在 C++ 中，某些类\
  \ A 可以是另一个类 B 的派生类，而类 B 又可以是另一个类 C 的派生类，依此类推。例如，CD 账户与储蓄账户类似，但资金和任何应得利息在“到期”日期之前不能提取。如果在到期日期之前提取资金，则会有罚金。由于这些限制，CD\
  \ 账户产生的利息率通常比储蓄账户高。在层级结构中，这通过从 `SavingsAccount` 派生 `CDAccount` 来显示。同样，货币市场账户是一种特殊的支票账户，客户通常对开支票的数量有限制，并且有更高的最低余额，但支付更高的利率。在层级结构中，这通过从\
  \ `CheckingAccount` 派生 `MoneyMarketAccount` 来显示。\n\n派生类通常使用继承和家族关系的比喻来讨论。如果类 B 是类\
  \ A 的派生类，那么类 B 被称为类 A 的`子类`，类 A 被称为类 B 的`父类`。父类也被称为基类。派生类被认为`继承`其父类的成员函数。例如，每辆转换汽车都从所有汽车类继承了拥有四个轮子的事实。这就是为什么派生类的话题通常被称为`继承`。\n\
  \n# 定义派生类\n\n如果我们想创建一个类来表示储蓄账户，可以从复制 `BankAccount` 类并将其重命名为 `SavingsAccount` 开始。我们需要添加新的公共成员函数来存款和取款。虽然这种方法可行，但它会非常低效，因为\
  \ `SavingsAccount` 类将重复 `BankAccount` 类中的大部分功能。这不仅浪费了内存空间，而且使修改变得更加困难。例如，如果我们以后决定将\
  \ `update()` 函数更改为每天计息而不是每年计息，那么我们有两个地方需要进行更改：在 `SavingsAccount` 类中以及在 `BankAccount`\
  \ 类中。这些问题可以通过将 `SavingsAccount` 类定义为 `BankAccount` 类的派生类来解决。这样 `SavingsAccount`\
  \ 类就可以共享 `BankAccount` 类中定义的成员变量和函数。我们在定义派生类时，通过添加冒号后跟 `public` 关键字和父类名称来指定这种关系。\n\
  \n![显示类层级的流程图。箭头表示框从底到上的流，如下：货币市场账户指向支票账户，支票账户指向银行账户。CD 账户指向储蓄账户，储蓄账户指向银行账户。](img/fg10_00800.png)\n\
  \n## 继承实现\n\n如果我们想创建一个类来表示储蓄账户，可以从复制 `BankAccount` 类并将其重命名为 `SavingsAccount` 开始。我们需要添加新的公共成员函数来存款和取款。虽然这种方法可行，但它会非常低效，因为\
  \ `SavingsAccount` 类将重复 `BankAccount` 类中的大部分功能。这不仅浪费了内存空间，而且使修改变得更加困难。例如，如果我们以后决定将\
  \ `update()` 函数更改为每天计息而不是每年计息，那么我们有两个地方需要进行更改：在 `SavingsAccount` 类中以及在 `BankAccount`\
  \ 类中。这些问题可以通过将 `SavingsAccount` 类定义为 `BankAccount` 类的派生类来解决。这样 `SavingsAccount`\
  \ 类就可以共享 `BankAccount` 类中定义的成员变量和函数。我们在定义派生类时，通过添加冒号后跟 `public` 关键字和父类名称来指定这种关系。\n\
  \n# 显示 10.9 `SavingsAccount` 派生类\n\n[content]\n```cpp\nclass SavingsAccount : public\
  \ BankAccount\n{\npublic:\n    SavingsAccount(int dollars, int cents, double rate,\n\
  \              int daysToMaturity);\n    <其他构造函数通常放在这里>\n    int getDaysToMaturity(\
  \ );\n    返回 CD 到期的天数\n    void decrementDaysToMaturity( );\n    //从 daysToMaturity\
  \ 变量中减 1\nprivate:\n    int daysToMaturity; //CD 到期的天数\n};\n```\n\n\n\n\n再次，我们只定义了与\
  \ CD 账户专门相关的函数和数据，在这种情况下，即存储和操作到期天数。我们不需要重新定义与银行账户或储蓄账户相关变量和函数，因为这些成员将从父类继承。例如，一旦\
  \ `CDAccount` 类中的函数实现完成，给定一个 `CDAccount` 对象，我们可以从 `CDAccount`、`SavingsAccount` 或\
  \ `BankAccount` 类调用以下函数：\n\n![](img/p605-2.png)\n\n这个简短的示例仅触及继承所可能性的边缘。更多细节请参阅第\
  \ 15 章。虽然学习如何使用继承有效设计类确实需要一些努力，但从长远来看，这些努力是值得的。你最终编写的代码将比不使用继承的代码少，且更于理解和维护。\n\n\
  ### 自测练习\n\n29. 继承如何支持代码复用并使代码更易维护？\n\n30. 派生类可以直接通过名称访问父类的私有成员变量吗？\n\n31. 假设类 `SportsCar`\
  \ 是类 `Automobile` 的派生类。假设类 `Automobile` 有名为 `accelerate` 和 `addGas` 的公共成员函数。`SportsCar`\
  \ 类的对象会有名为 `accelerate` 和 `addGas` 的成员函数吗？\n\n### 章节总结\n\n* 结构体可以可以将不同类型的数据组合成单一（复合）数据值。\n\
  * 类可以可以将数据和函数组合成单一（复合）对象。\n* 类的成员变量或成员函数可以是公的，也可以是私有的。如果是公的，则可以在类外部使用；如果是私有的，则只能在类中另一个成员函数的定义中使用。\n\
  * 函数可以具有类或结构体类型的形式参数。函数可以返回类或结构体类型的值。\n* 类的成员函数可以像普通函数重载一样重载。\n* `constructor`（构造函数）是类的一种成员函数，在声明类对象时自动调用。构造函数的名称必须与它所属的类名相同。\n\
  * 数据类型由一组值以及定义在这些值上的一组基本操作组成。\n* 如果使用该类型的程序员不需要了解关于该类型的值和操作如何实现的任何细节，则该数据类型被称为 `abstract\
  \ data type`（抽象数据类型）。\n* 在 C++ 中实现抽象数据类型的一种方法是定义一个类，所有成员变量设为私有，并将操作实现为公共成员函数。\n\
  * 继承指的是类之间的父/子关系。子类（派生类）从父类继承成员。\n\n### 自测练习答案\n\n1. 1.\n    1. `double`\n    2.\
