  \ << next;\n49            inStream.get(next);\n50        }\n51    }\n```\n\n\n\n\
  \n| `isupper(Char_Exp)` | 如果 `Char_Exp` 是大写字母，则返回 `true`；否则返回 `false`。 |\n\n```cpp\n\
