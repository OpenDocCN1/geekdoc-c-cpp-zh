  \n# 4.3 用户定义函数\n\n> 定制的西装比现成品的更合身。\n\n 叔叔，裁缝\n\n在上一节中，我们告诉了你如何使用预定义函数。在本节中，我们将告诉你如何定义自己的函数。\n\
  \n\n\n\n\n你可以定义自己的函数，可以将它们定义在与程序 `main` 部分同一个文件中，也可以定义在单独的文件中，以便函数被多个不同的程序使用。无论哪种情况，定义方式都是相同的，但目前我们假设函数定义将与程序的\
  \ `main` 部分在同一个文件中。\n\n显示 4.3 包含一个完整程序中的示例函数定义，演示了对函数的调用。该函数名为 `totalCost`。该函数接受两个参数——单件价格和购买数量。该函数返回指定价格下相应数量物品的总成本（包括销售税）。该函数的调用方式与调用预定义函数相同。程序员必须编写的函数描述要稍微复杂一些。\n\
