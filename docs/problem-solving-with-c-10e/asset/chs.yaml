  \n\n\n\n\n# 练习程序\n\n3. 编写一个类似于上一个练习的程序，将米和厘米转换为英尺和英寸。使用函数处理子任务。\n\n4. （你应该在执行此练习之前完成前两个练习程序。）编写一个结合了前两个练习程序中函数的程序。该程序询问用户是想将英尺英寸转换为米和厘米，还是将米和厘米转换为英尺英寸。程序随后执行所需的转换。让用户输入整数\
