  \ 和 `Rectangle::erase` 提供新定义，使得 `draw` 函数能够通过在合适的位置放置字符 `'*'` 在屏幕上绘制图形。对于 `erase`\
  \ 函数，你可以简单地清屏（通过输出空行或采用更复杂的方法）。这个问题包含很多细节，你必须对其中一些细节自行决定。\n\n## 7. 银行账户系统\n银行有许多类型的账户，通常对取款等交易相关的费用有不同的规则。客户允许在账户之间转账资金，并产生与从一个账户提取资金相关的相应费用。\n\
  \n编写一个程序，包含一个银行账户基类和两个派生类（如下文所示），代表具有不同取款规则的账户。还要编写一个将资金从一个账户（任何类型）转移到另一个账户的函数。转移是从一个账户的取款和另一个账户的存款。由于转账可以在任何时间对任何类型的账户进行，因此类中的\
  \ `withdraw` 函数必须是虚函数。编写一个主程序，创建三个账户（每个类一个）并测试转移函数。\n\n对于这些类，创建一个名为 `BankAccount`\
  \ 的基类，它包含所有者姓名（字符串）和账户余额（`double`）作为数据成员。包含成员函数 `deposit` 和 `withdraw`（均接受一个 `double`\
  \ 作为金额参数）以及访问器函数 `getName` 和 `getBalance`。`deposit` 将金额添加到余额中（假设金额为非负），`withdraw`\
  \ 将金额从余额中扣（假设金额为非负且小于等于余额）。\n\n此外创建一个名为 `MoneyMarketAccount` 的类，它派自 `BankAccount`。在\
  \ `MoneyMarketAccount` 中，用户在给定时间内获得两次免费取款机会（本中不需要考虑时间）。在免费取款次数后，每次取款将从余额中扣除 1.50\
  \ 美元的费用。因此，该类必须有一个数据成员来跟踪取款次数。它还必须重写 `withdraw` 定义。\n\n最后，创建一个派自 `BankAccount` 的\
  \ `CDAccount` 类（模拟定期存款），它除了姓名和余额外，还有一个利率。定期存款在提前提取资金时产生罚金。假设提取资金（任何金额）所产生的罚金为该账户每年获得利息的\
  \ 25%。假设所提取的金额加罚金将从账户余额中扣除。同样，`withdraw` 函数必须重写基类中的函数。对于所有三个类，`withdraw` 函数应返回一个整数，指示状态（取款成功或资金不足无法取款）。出于本次练习的考虑，请忽略这些账户的其他函数和属性（例如何时以及如何支付利息）。\n\
  \n## 8. RFID 物流\n射频识别（RFID）芯片是可放置在产品上的微型标签。它们的行为类似于无线条形码，可以无线向接收器广播识别码。RFID 芯片的一个应用是利用它们来辅助货运的物流。考虑一个装满物品的集装箱。如果没有\
  \ RFID 芯片，人类必须手动对集装箱中的所有物品进行盘点以验证内容。如果集装箱上贴有 RFID 芯片，RFID 芯片可以电子地向人类广播集装箱的准确内容，而无需人工干预。\n\
  \n为了模拟这一应用，编写名为 `ShippingContainer` 的基类，它有一个整数类型的集装箱 ID 。包含设置和访问 ID 的成员函数。添加一个名为\
  \ `getManifest` 的虚函数，返回一个空字符串。该函数的目的是返回集装箱的内容。\n\n创建一个名为 `ManualShippingContainer`\
  \ 的派生类，代表手动盘点集装箱的方法。在这种方法中，人类只需为集装箱的所有内容附上文本描述。例如，描述可能是“4 箱苹果。10 箱梨。”添加一个 `string`\
  \ 类型的新类变量来存储清单单（manifest）。添加一个名为 `setManifest` 的函数来设置此字符串。重写 `getManifest` 函数，使其返回该字符串。\n\
  \n创建第二个派生类 `RFIDShippingContainer`，代表使用 RFID 盘点集装箱的方法。为了模拟 RFID 芯片的计算过程，创建一个 `add`\
  \ 函数来模拟向集装箱中添加物品。该类应使用你选择的数据结构存储所有添加物品的列表（作为字符串）和它们的数量。例如，如果 `add` 函数如下所示被调用了三次：\n\
  \n```cpp\nrfidContainer.add(\"crate of pears\"); // 添加一箱梨\nrfidContainer.add(\"\
  crate of apples\"); // 添加一箱苹果\nrfidContainer.add(\"crate of pears\"); // 添加一箱梨\n\
  ```\n\n此时，数据结构应存储一个包含两个物品的列表：苹果箱和梨箱。苹果的数量为 1，梨的数量为 2。重写 `getManifest` 函数，使其返回一个通过遍历物品列表构建的所有物品字符串。在上面的示例中，返回的字符串将是“2\
  \ 箱梨. 1 箱苹果。”\n\n最后，编写一个主程序，创建一个指向六个 `ShippingContainer` 对象的指针数组。用三个 `Manual-ShippingContainer`\
  \ 对象和三个 `RFIDShippingContainer` 对象实例化该数组。对于 `ManualShippingContainer` 对象，你必须调用 `setManifest`\
  \ 来设置内容。对于 `RFIDShippingContainer` 对象，你必须调用 `add` 来设置内容（尽管在现实世界中，集装箱的内容将通过 RFID\
  \ 芯片自动“添加”自己，而不是需要人类手动输入）。最后，编写一个循环遍历所有的 `ShippingContainer` 指针，并输出每个对象的清单以及相应的集装箱\
  \ ID。这是集装箱接收者希望看到的内容。\n\n你可能需要将整数转换为字符串。在 C++11 中实现此点的简单方法是：`string s = to_string(intVariable);`\n\
  \n## 9. 捕食者-猎物者模拟\n该编程项目的目标是创建一个简单的二维捕食者-猎物者模拟。在这个模拟中，猎物者是蚂，捕食者是画虫（doodlebugs）。这些生物在一个由\
  \ 20×20 网格组成的世界中。每个单元格只能被一个生物占据。网格是封闭的，因此不允许生物移动到边缘。时间以时间步进行模拟。每个生物每个时间步都会执行某些操作。\n\
  \n蚂的行为遵循以下模型：\n\n*   **移动**：每个时间步，随机尝试向上、向下、向左或向右移动。如果目标相邻单元被占用或会导致蚂移出网格，则蚂留在当前单元中。\n\
  *   **繁殖**：如果一只蚂生存了三个时间步，那么在时间步结束时（即移动之后）它将繁殖。这通过在相邻（上、下、左或右）的空单元中创建新蚂来实现。如果没有空单元，则不发生繁殖。产生后代后，蚂必须再经过三个时间步才能再次产生后代。\n\
  \n画虫的行为遵循以下模型：\n\n\n\n\n\n- **移动**：每个时间步，如果相邻有一个蚂蚁（上、下、左或右），则涂虫（doodlebug）将移动到该单元并吃掉蚂蚁。否则，涂虫按照与蚂蚁相同的规则移动。注意，涂虫不能吃其他涂虫。\n\
  - **繁殖**：如果涂虫生存了八个时间步，然后在时间步结束时它将以蚂蚁相同的方式产生一个新的涂虫。\n- **饿死**：如果涂虫在过去的三个时间步内没有吃蚂蚁，那么在第三个时间步结束时它将饿死。然后从单元网格中移除该涂虫。\n\
  \n在一个回合中，所有涂虫应该在蚂蚁移动之前移动。\n\n编写一个程序来实现此模拟，并使用 ASCII 字符 `o` 表示蚂蚁，`X` 表示涂虫来绘制世界。创建一个名为\
  \ `Organism` 的类，封装蚂蚁和涂虫共有的基本数据。该类应该有一个名为 `move` 的虚函数，该函数在 `Ant` 和 `Doodlebug` 的派生类中定义。你可能需要额外的数据结构来跟踪哪些生物已经移动过。\n\
  \n用 5 只涂虫和 100 只蚂蚁初始化世界。每个时间步后，提示用户按回车键进入下一个时间步。你应该看到捕食者和猎物种群之间的循环模式，尽管随机扰动可能会导致其中一个或两个物种的灭绝。\n\
