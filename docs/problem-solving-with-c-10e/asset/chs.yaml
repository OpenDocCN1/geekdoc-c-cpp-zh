  \n# 问题定义\n\nApex 塑料勺制造公司委托我们编写一个程序，显示其四个工厂中每个工厂生产率的条形图。输入由一组数字组成，给出每个工厂的产量，并以一个作为哨兵值的负数结束。\n\
  \n输出将是一个显示每个工厂总产量的条形图。条形图中的每个星号等于 1000 个单位。每个工厂的产量将四舍五入到最近的 1000 单位。\n\n## 输入\n\n\
  有四个编号为 1 到 4 的工厂。对于这四个工厂中的每一个，提供以下输入：一组给出该工厂每个部门产量的数字列表。该列表以负数结束。\n\n## 输出\n\n一个显示每个工厂总产量的条形图。条形图中的每个星号等于\
  \ 1000 个单位。\n\n# 问题分析\n\n我们将使用一个名为 `production` 的数组，它将存储四个工厂的总产量。在 C++ 中，数组索引始终从\
  \ `0` 开始。但由于工厂的编号是 `1` 到 `4`，而不是 `0` 到 `3`，我们不会使用工厂编号作为数组索引。相反，我们将第 `n` 号工厂的总产量放在索引变量\
  \ `production[n−1]` 中。1 号工厂的总输出将存储在 `production[0]` 中，2 号工厂的数据存储在 `production[1]`\
  \ 中，以此此类推。\n\n由于输出是以千位为单位的，程序将缩放数组元素的值。如果 3 号工厂的总产量为 4040 单位，那么 `production[2]`\
  \ 的值最初被设置为 `4040`。然后这个 `4040` 的值将被缩放为 `4`，使得 `production[2]` 的值变为 `4`，然后在图中输出四个星号来表示\
  \ 3 号工厂的产量。\n\n\n\n\n我们程序的任务可以分为以下几个子任务：\n\n*   `inputData`: 读取每种植物的输入数据，并将索引变量\
  \ `production[plantNumber − 1]` 的值设置为该植物的总产量，其中 `plantNumber` 是植物的编号。\n*   `scale`:\
  \ 对于每个 `plantNumber`，将索引变量 `production[plantNumber − 1]` 的值更改为相应数量的星号。\n*   `graph`:\
  \ 输出条形。\n\n整个 `production` 数组将作为执行这些子任务的函数的参数。按照数组参数的惯例，这意味着我们必须有一个额外的形式形式参数来表示数组的大小，在当前情况下，该大小等同于植物的数量。我们将使用一个定义常数来表示植物的数量，该常量将作为数组\
  \ `production` 的大小。我们程序的 `main` 部分，连同执行子任务的函数声明以及用于植物数量的定义常量，所示显示 7.5。请注意，由于没有理由更改函数\
  \ `graph` 的数组参数，我们通过添加 `const` 参数修饰符将该数组参数变为了常量参数。显示 7.5 中的内容是我们程序的大纲，如果它位于单独的文件中，则可以编译该文件，以便我们在定义与所显示的函数声明对应的函数之前，检查该大纲中的任何语法错误。\n\
  \n在编译了显示 7.5 所示的文件后，我们准备好设计这三个子任务函数的实现方案。对于这三个函数中的每一个，我们都设计一个算法，编写函数代码，并在设计下一个函数之前对函数进行测试。\n\
  \n# `inputData` 的算法设计\n\n函数 `inputData` 的函数声明和描述性注释所示显示 7.5。正如我们程序 `main` 部分体（同样所示显示\
  \ 7.5\n{\n        using namespace std;\n        for (int plantNumber = 1;\n    \
  \        plantNumber <= lastPlantNumber; plantNumber++)\n        {\n        cout\
  \ << endl\n             << \"Enter production data for plant number \"\n       \
  \      << plantNumber << endl;\n        getTotal(a[plantNumber − 1]);\n        }\n\
  }\n```\n\n这段代码是常规的，因为所有工作都由 `getTotal` 函数完成，我们仍然需要设计该函数。但在讨论函数 `getTotal` 之前，让我们观察关于函数\
  \ `inputData` 的几点。请注意，我们将编号为 `plantNumber` 的数字存储在索引为 `plantNumber − 1` 的索引变量中；这是因为数组始终从索引\
  \ `0` 开始，而植物编号从 `1` 开始。此外，注意我们在函数 `getTotal` 的参数传递中使用了索引变量。`getTotal` 函数确实执行了 `inputData`\
  \ 函数的所有工作。\n\n`getTotal` 函数完成了某一个植物的所有输入工作。它读取该植物的产量数字，对数字求和，并将总和存储在该植物的索引变量中。但\
  \ `getTotal` 不需要知道它的参数是一个索引变量。对于 `getTotal` 这样的函数，索引变量只是任何 `int` 类型的变量。因此，`getTotal`\
  \ 将具有一个 `int` 类型的引用参数。这意味着 `getTotal` 读取数字、求和并设置其参数的值。显示 7.6 显示了 `getTotal` 和 `inputData`\
  \ 的函数定义。这些函数嵌入在一个简单的测试程序中。\n\n```\n//Reads data and displays a graph showing productivity\
  \ for each plant.\n#include <iostream>\nconst int NUMBER_OF_PLANTS = 5;\n\nvoid\
  \ inputData(int a[], int lastPlantNumber)\n//Precondition: lastPlantNumber 是数组 a\
  \ 的大小。\n//Postcondition: 对于 plantNumber = 1 到 lastPlantNumber:\n//a[plantNumber\
  \ − 1] 等于产量。\n\nvoid scale(int a[], int size);\n//Precondition: a[0] 到 a[size −\
  \ 1] 每个一个非负值。\n//Postcondition: a[i] 已更改为原始在 a[i] 中的千位数（一个整数），\n//对于所有 0 <= i <=\
  \ size − 1 的 i。\n\nvoid graph(const int asteriskCount[], int lastPlantNumber);\n\
  //Precondition: asteriskCount[0] 到 asteriskCount[lastPlantNumber − 1] 有非负值。\n//Postcondition:\
  \ 显示了一个条形图，说明\n//植物 N 生产了 asteriskCount[N − 1] 千单位，\n//对于每个 1 <= N <= lastPlantNumber\
  \ 的 N。\n\nint main() {\n    using namespace std;\n    int production[NUMBER_OF_PLANTS];\n\
  \n    cout << \"此程序显示\\n\"\n         << \"公司每种植物的产量图。\\n\";\n\n    inputData(production,\
  \ NUMBER_OF_PLANTS);\n    scale(production, NUMBER_OF_PLANTS);\n    graph(production,\
  \ NUMBER_OF_PLANTS);\n\n    return 0;\n}\n```\n\n# 显示 7.5 图形程序大纲\n\n# 测试 `inputData`\n\
  \n每个函数都应该在一个它是唯一未测试函数的程序进行测试。`inputData` 函数包含了对 `getTotal` 函数的调用。因此，我们应该在自己的驱动程序中测试\
  \ `getTotal`。一旦 `getTotal` 经过完全测试，我们就可以在程序中使用它，如显示 7.6 所示，来测试 `inputData` 函数。\n\n\
  \n\n\n在测试函数 `inputData` 时，我们应该包含对工厂所有可能的类型的生产数字的测试。我们应该包含一个没有生产数字的工厂（正如我们在显示 7.6\
  \ 中对工厂 4 所做的那样）；我们应该包含一个只有一个生产数字的工厂测试（正如我们在显示 7.6 中对工厂 3 所做的那样）；我们还应该包含一个有多个生产数字的工厂测试（正如我们在显示\
  \ 7.6 中对工厂 1 和 2 所做的那样）。我们应该同时测试非零和零生产数字，这就是为什么我们在显示 7.6 中工厂 2 的输入列表中包含了一个 `0`。\n\
  \n# `scale` 的算法设计\n\n函数 `scale` 改变数组 `production` 中每个索引变量的值，使其显示要打印的星号数量。由于每 1000\
  \ 单位的产量应该对应一个星号，因此每个索引变量的值必须除以 `1000.0`。然后，为了获得整数数量的星号，将该数字舍入到最近的整数。这种方法可以用于缩放任何大小数组\
  \ `a` 中的值，因此 `scale` 的函数声明（在显示 7.5 中显示并在此重复）是根据某个任意大小的数组 `a` 陈述的：\n\n```cpp\nvoid\
  \ scale(int a[ ], int size);\n// 前置条件：a[0] 到 a[size − 1] 每个都有一个\n// 非负值。\n// 后置条件：对于所有满足\
  \ 0 <= i <= size − 1 的 i，\n// a[i] 已更改为 a[i] 原本的\n// 舍入为整数的 1000 倍数）。\n```\n\n当调用函数\
  \ `scale` 时，数组参数 `a` 将被数组 `production` 替换，形式参数 `size` 将被 `NUMBER_OF_PLANTS` 替换，使得函数调用看起来如下：\n\
  \n```cpp\nscale(production, NUMBER_OF_PLANTS);\n```\n\n`scale` 函数的算法如下：\n\n```cpp\n\
  for (int index = 0; index < size; index++)\n```\n\n将 `a[index]` 的值除以 1000 并将结果舍入到最近的整数；结果为\
  \ `a[index]` 的新值。\n\n# `scale` 的代码实现\n\n`scale` 的算法转换为接下来给出的 C++ 代码，其中 `round` 是我们仍然需要定义的函数。`round`\
  \ 函数接受一个 `double` 类型的参数并返回一个 `int` 类型的值，该值是与其参数最近的整数；也就是说，`round` 函数将对其参数舍入到最近的整数。\n\
