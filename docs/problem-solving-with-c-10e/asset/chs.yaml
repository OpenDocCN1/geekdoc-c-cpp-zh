  \ `1`，而 `false` 被存储为 `0`。\n\n### 整数除法\n\n当与负 `int` 值使用时，运算符 `/` 和 `%` 的结果在不同的 C++\
  \ 实现中可能不同。因此，只有当你确定两个值都是非负时，才对 `int` 值使用 `/` 和 `%`。\n\n算术表达式任何合理的间距都可以。你可以在操作和括号之间插入空格，也可以省略它们。采取任何产生易读结果的方法。\n\
  \n你可以通过插入括号来指定操作顺序，如下两个表达式所示：\n\n```\n(x + y) * z\nx + (y * z)\n```\n\n要评估第一个表达式，计算机先加\
  \ `x` 和 `y`，然后将结果乘以 `z`。要评估第二个表达式，它先乘以 `y` 和 `z`，然后将结果加到 `x` 上。尽管你可能习惯使用包含方括号和各种形式括号的数学公式，但在\
  \ C++ 中是不被允许的。C++ 在算术表达式中只允许一种括号。其他变体留作其他用途。\n\n\n\n\n\n如果你省略了括号，计算机将遵循所谓的`优先级规则`（precedence\
  \ rules），这些规则决定了运算符（如 `+` 和 `*`）的执行顺序。这些优先级规则类似于代数和其他数学课程中使用的规则。例如：\n\n```\nx +\
  \ y * z\n```\n\n它的计算方式是先执行乘法，再执行加法。除了某些标准情况（例如一系列加法或嵌入在加法中的简单乘法）外，通常最好是包含括号，即使预期的操作顺序正是由`优先级规则`决定的。括号使表达式更易读，并减少程序员出错的概率。完整的\
  \ C++ 优先级规则见附录 2。\n\n显示 2.7 显示了一些常见的算术表达式示例以及它们在 C++ 中的表达方式。\n\n| 数学公式 | C++ 表达式\
  \ |\n| --- | --- |\n| `b`² −; 4`ac` | `b`*b` −; 4`a``c` |\n| `x`(`y` + `z`) | `x`*(`y` + `z`)\
  \ |\n| $\\frac{1}{x^{2} + x + 3}$ | 1/(x`*`x` + `x` + 3) |\n| $\\frac{a + b}{c -\
