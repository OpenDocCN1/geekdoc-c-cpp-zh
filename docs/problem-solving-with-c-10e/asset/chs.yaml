  ```cpp\nvoid houseTurn(int houseRoll,\n                bool &bust,\n           \
  \     int &total)\n```\n\n| | 实现庄家或电脑玩家一个回合的逻辑（上述第 6 步）。`houseRoll` 是庄家进行的且玩家可见的第一次掷骰数值。如果庄家爆牌，`bust`\
  \ 返回 `true`，否则返回 `false`。`total` 返回庄家掷骰的总和。测试回合胜者的逻辑（上述第 7 步）由调用 `houseTurn` 的代码处理，而不是在\
  \ `houseTurn` 内部处理。 |\n\n测试这些函数以确保它们正常工作。最后，编写最终游戏的逻辑。如有需要，你可以根据认为认为编写额外的函数。\n\n\
  10. 完成编程项目 9，但使用自上而下的方法（top-down methodology）而不是自下而上的方法。这意味着先在 `main` 方法中编写游戏逻辑，并为\
  \ `playerTurn` 和 `houseTurn` 编写存根（stubs）。一种实现存根且仍保持测试灵活性的简单方法是直接从键盘输入值。例如，为了模拟玩家下注\
  \ $50、庄家掷出 6 以及玩家停留在总和 15 的情况，函数将向 `wager` 输入 50，将 `bust` 设置为 `false`，向 `total`\
  \ 输入 15，并向 `houseRoll` 输入 6。\n\n在 `main` 函数中的逻辑运行正常后，使用 `rollDice` 和 `getWager`\
  \ 的存根实现 `playerTurn` 和 `houseTurn` 中的代码。再次，一种实现存根的简单技术是从键盘输入值。\n\n在 `playerTurn`\
  \ 和 `houseTurn` 正常工作后，实现 `rollDice` 和 `getWager` 的逻辑以完成程序。\n\n\n\n\n\n尽管你可能没有意识到，但你已经在程序中使用流（streams）。你已经使用过的\
  \ `cin` 是连接到键盘的输入流，而 `cout` 是连接到屏幕的输出流。只要你的程序包含一个名为 `iostream` 的头文件的 `include` 指令，这两个流就可以自动供你的程序使用。你可以定义其他来自或发往文件的流；一旦定义了它们，你就可以像使用\
  \ `cin` 和 `cout` 相同的方式在程序中使用它们。\n\n例如，假设你的程序定义了一个名为 `inStream` 的流，它来自某个文件。（我们稍后会告诉你如何定义它。）然后你可以在程序中使用以下代码，用名为\
  \ `theNumber` 的 `int` 变量填充该文件中的一个数字：\n\n```\nint theNumber;\ninStream >> theNumber;\n\
  ```\n\n同样，如果你的程序定义了一个名为 `outStream` 的输出流，它指向另一个文件，那么你就可以将该变量的值输出到该文件中。以下内容将输出字符串\
  \ `\"theNumber is\"`，随后是变量 `theNumber` 的内容，到连接到流 `outStream` 的输出文件中：\n\n```\noutStream\
  \ << \"theNumber is\" << theNumber << endl;\n```\n\n一旦流连接到目标文件，你的程序就可以像处理键盘和屏幕 I/O\
  \ 一样处理文件 I/O。\n\n# 为什么使用文件进行 I/O？\n\n我们目前为止使用的键盘输入和屏幕输出处理的是临时数据。当程序结束时，键盘输入的数据和留在屏幕上的数据就会消失。文件为你提供了一种永久存储数据的方法。文件的内容一直存在，直到人或程序更改该文件。如果你的程序将输出发送文件，在程序运行结束后，输出文件仍然存在。输入文件可以被许多程序重复使用，而无需为每个程序单独输入数据。\n\
  \n你的程序使用的输入和输出文件与你用编辑器读写的文件是同一种类型，例如你用来编写程序时使用的编辑器。这意味着你可以在方便的时候为你的程序创建一个输入文件，或者读取你的程序生成的输出文件，而不需要在程序运行时必须完成所有的读写操作。\n\
  \n文件还为你提供了一种处理大量数据的方便方法。当你的程序从一个大输入文件获取输入时，程序接收了大量数据，而不需要让用户进行大量输入。\n\n# 文件 I/O\n\
  \n当你的程序从文件获取输入时，被称为从文件读取；当你的程序将输出发送到文件时，被称为向文件写入。还有其他从文件读取输入的方法，但我们将使用的方法是从文件开头到末尾（或到程序结束前能到达的地方）读取文件。使用这种方法，你的程序不允许回溯并第二次读取文件中的任何内容。这与程序从键盘获取输入时的情况完全相同，因此这看起来不应该觉得新奇或奇怪。（正如我们将要看到的，程序可以从文件的开头开始重新读取文件，但这是“重新开始”，而不是“回溯”。）同样，对于我们介绍的这种方法，你的程序从文件开头开始向前将输出写入文件。它不允许回溯并更改它之前已写入文件的任何输出。这与你的程序将输出发送到屏幕的情况完全相同。你可以向屏幕发送更多输出，但你不能回溯并更改屏幕输出。你将输入从文件获取到程序中，或将输出从程序发送到文件的方法，是通过流将程序连接到文件。\n\
  \n在 C++ 中，流是一种特殊的、被称为“对象”（object）的变量。我们将在下一节中讨论对象，但我们首先描述你的程序如何使用流对象来执行简单的文件 I/O。如果你想使用流从文件获取输入（或向文件提供输出），你必须声明该流，并将流连接到文件。\n\
  \n你可以将流连接的文件看作流的值。你可以将流从一个文件断开并连接到另一个文件，因此你可以更改这些流变量的值。然而，你必须使用仅适用于流的特殊函数来执行这些更改。你不能像使用\
  \ `int` 或 `char` 类型的变量那样在赋值语句中使用流变量。虽然流是变量，但它们是不寻常变量。\n\n`cin` 和 `cout` 流已经为你声明好了，但如果你想让一个流连接到文件，你必须像声明任何其他变量一样声明它。输入文件流变量的类型名为\
  \ `ifstream`（代表“input-file stream”）。输出文件流变量的类型名为 `ofstream`（代表“output-file stream”）。因此，你可以如下所示声明\
  \ `inStream` 为一个文件的输入流，并将 `outStream` 为另一个文件的输出流：\n\n```\nifstream inStream;\nofstream\
  \ outStream;\n```\n\n类型 `ifstream` 和 `ofstream` 定义在带有头文件 `fstream` 的库中，因此任何以这种方式声明流变量的程序必须包含以下指令（通常位于文件开头）：\n\
  \n```\n#include <fstream>\n```\n\n在使用类型 `ifstream` 和 `ofstream` 时，你的程序还必须包含以下内容，通常位于文件开头或使用类型\
  \ `ifstream` 或 `ofstream` 的函数开头：\n\n```\nusing namespace std;\n```\n\n程序使用的流变量（如\
  \ `inStream` 和 `outStream`）必须分别连接到文件。这被称为打开文件，是通过一个名为 `open` 的函数完成的。例如，假设你想让输入流\
  \ `inStream` 连接到名为 `infile.dat` 的文件。你的程序必须在从该文件读取任何输入之前包含以下：\n\n```\ninStream.open(\"\
  infile.dat\");\n```\n\n这种语法看起来相当奇怪。我们将在下一节讨论这种奇特的语法。现在，只需注意关于这种 `open` 调用的一些细节。首先，流变量名和一个点（即句号）放在函数\
  \ `open` 之前，文件名作为参数给出 `open`。还要注意文件名是用引号括起来。作为参数给的文件名与你想用编辑器写入该文件时使用的名称相同。如果输入文件与你的程序在同一个目录下，你可能只需要按照描述的方法提供文件名即可。在某些情况下，你可能还需要指定文件所在的目录。指定目录的细节因系统而异。如果你需要指定目录，请让你的导师或其他当地专家解释细节。\n\
  \n你也可以如下将打开文件与流变量的声明结合：\n\n```\nifstream inStream(\"infile.dat\");\n```\n\n一旦声明了输入流变量并使用\
  \ `open` 函数将其连接到文件，你的程序就可以使用提取运算符 `>>` 从文件获取输入。例如，以下代码从连接到 `inStream` 的文件中读取两个数字，并将它们放入变量\
  \ `oneNumber` 和 `anotherNumber` 中：\n\n```\nint oneNumber, anotherNumber;\ninStream\
  \ >> oneNumber >> anotherNumber;\n```\n\n输出流打开（即连接到文件）的方式与之前描述输入流相同。例如，以下内容了输出流\
  \ `outStream` 并将其连接到名为 `outfile.dat` 的文件：\n\n```\noutStream.open(\"outfile.dat\"\
  );\n```\n\n\n\n\n\n```\nofstream outStream;\noutStream.open(\"outfile.dat\");\n\
  ```\n\n当与类型为 `ofstream` 的流配合使用时，成员函数 `open` 将输出文件不存在时创建该输出文件。如果输出文件已经存在，成员函数 `open`\
  \ 将丢弃文件内容，以便在调用 `open` 之后输出文件是空空的。\n\n在调用 `open` 将文件连接到流 `outStream` 后，程序可以使用插入运算符\
  \ `<<` 向该文件发送输出内容。例如，以下代码将两个字符串以及变量 `oneNumber` 和 `anotherNumber` 的内容写入到与流 `outStream`\
  \ 连接的文件中（在本例中，该文件是名为 `outfile.dat` 的文件）：\n\n```\noutStream << \"oneNumber = \" <<\
  \ oneNumber\n<< \" anotherNumber = \" << anotherNumber;\n```\n\n注意，当你的程序处理文件时，就像该文件有两个名字一样。一个是操作系统使用的普通文件名。这个名称被称为“外部文件名”（external\
  \ file name）。在我们的示例代码中，外部文件名是 `infile.dat` 和 `outfile.dat`。从某种意义上说，外部文件名是文件的“真实名称”。它是操作系统使用的名称。这些外部文件名的拼写约定因系统而异；你需要从你的导师或其他当地的专家那里学习这些约定。我们在示例中使用的\
  \ `infile.dat` 和 `outfile.dat` 名称在你的系统中可能像也可能不像文件名。你应该遵循你系统使用的任何约定来命名文件。虽然外部文件名是文件的真实名称，但在程序中通常只使用一次。外部文件名作为参数传递给函数\
  \ `open`，但在文件打开后，始终通过命名连接到该文件的流来引用该文件。因此，在你的程序中，流名充当了文件的第二个名字。\n\n显示 6.1 示例程序从一个文件读取三个数字，并将它们的和以及一些文本写入另一个文件。\n\
  \n当程序完成从文件获取输入或向文件发送输出时，应该关闭每个文件。关闭文件会将流与文件断开连接。通过调用函数 `close` 来关闭文件。以下行来自显示 6.1\
  \ 中的程序说明了如何使用 `close` 函数：\n\n```\ninStream.close( );\noutStream.close( );\n```\n\
  \n注意，`close` 函数不接受参数。如果你的程序正常结束但没有关闭文件，系统将为你自动关闭文件。然而，养成关闭文件的习惯至少出于两个原因。首先，系统只有在程序以正常方式结束时才会为你关闭文件。如果你的程序由于错误异常结束，文件将不会被关闭，并可能处于损坏状态。如果程序在完成文件操作后立即关闭文件，文件损坏的可能性就会降低。关闭文件的第二个原因是，你可能希望程序将输出发送到文件，稍后将该输出读回程序。要做到这一点，你的程序应该在完成写入文件后关闭文件，然后使用\
  \ `open` 函数将文件连接到输入流。（可以同时为了输入和输出打开一个文件，但这种方法略有不同，我们不会讨论这种替代方案。）\n\n```\n 1    //从文件\
  \ infile.dat 读取三个数字，对数字求和，\n 2    //并将和写入文件 outfile.dat。\n 3    //（程序的改进版本将在显示 6.2\
  \ 中给出。）\n 4    # include <fstream>\n 5    int main( )\n 6    {\n 7        using\
  \ namespace std;\n 8        ifstream inStream;\n 9        ofstream outStream;\n\
  10     \n11        inStream.open(\"infile.dat\");\n12        outStream.open(\"outfile.dat\"\
  );\n13        int first, second, third;\n14        inStream >> first >> second >>\
  \ third;\n15        outStream << \"The sum of the first 3\\n\"\n16             \
  \     << \"numbers in infile.dat\\n\"\n17                  << \"is \" << (first\
  \ + second + third)\n18                  << endl;\n19        inStream.close( );\n\
  20        outStream.close( );\n21        return 0;\n22    }\n```\n\n| infile.dat\
  \ |  | outfile.dat |\n| （程序未更改内容。） |  | （程序运行后。） |\n|   |\n\n```\n1\n2\n3\n4\n```\n\
  \n | |  \n\n```\nThe sum of the first 3\nnumbers in infile.dat\nis 6\n```\n\n |\n\
  \n屏幕上没有输出，也没有输入。\n\n# 显示 6.1 简单的输入/输出\n\n## 类与对象的介绍\n\n流 `inStream` 和 `outStream`\
  \ 以及上一节中提到的预定义流 `cin` 和 `cout` 都是对象。**对象**是一个具有函数的变量。例如，流 `inStream` 和 `outStream`\
  \ 都具有一个名为 `open` 的函数。如下：\n\n```\nifstream inStream;\nofstream outStream;\ninStream.open(\"\
  infile.dat\");\noutStream.open(\"outfile.dat\");\n```\n\n这种写法是有原因的。对象 `inStream`\
  \ 关联的 `open` 函数与对象 `outStream` 关联的 `open` 函数是不同的。前一个 `open` 函数用于打开文件，另一个用于输出文件。当然，这两个函数是相似的，它们都“打开”文件。当我们给两个函数相同的名称时，是因为这两个函数具有某种相似性。然而，这两个\
  \ `open` 函数是不同的。当编译器看到对 `open` 函数的调用时，必须确定指的是哪一个 `open`。编译器通过查看前面的对象名称来确定，在这种情况下是\
  \ `inStream` 或 `outStream`。与对象关联的函数被称为**成员函数**。因此，例如 `open` 是对象 `inStream` 的成员函数，而另一个名为\
  \ `open` 的函数是对象 `outStream` 的成员。\n\n正如我们看到的，不同的对象可以不同的成员函数。这些函数可能有相同的名称（如 `open`\
  \ 函数），也可能有完全不同的名称。对象的类型决定了对象拥有哪些成员函数。如果两个对象的类型相同，它们可能有不同的值，但将具有相同的成员函数。例如，假设你声明了以下流对象：\n\
  \n```\nifstream inStream, inStream2;\nofstream outStream, outStream2;\n```\n\n`inStream.open`\
  \ 和 `inStream2.open` 是同一个函数。同样，`outStream.open` 和 `outStream2.open` 也是同一个函数（但它们不同于\
  \ `inStream.open` 和 `inStream2.open`）。\n\n变量对象的类型（例如 `ifstream` 和 `ofstream`）被称为**类**。由于对象的成员函数完全由其类（即由其类型）决定，这些函数被称为*类的成员函数*（也称为*对象的成员*）。例如，`ifstream`\
  \ 类有一个名为 `open` 的成员函数，而 `ofstream` 类有一个不同的名为 `open` 的成员函数。\n\n\n\n\n当你在程序中调用成员函数时，总是要指定一个对象，通常是通过编写对象名称并在函数名之前加上一个点（.），正如下例所示：\n\
  \n```\ninStream.open(\"infile.dat\");\n```\n\n命名对象的一个原因是，该函数可能会对对象产生某些影响。在前面的示例中，对函数\
  \ `open` 的调用将文件 `infile.dat` 连接到流 `inStream`，因此它需要知道这个流的名称。\n\n在函数调用中，例如\n\n```\n\
  inStream.open(\"infile.dat\");\n```\n\n这个点被称为 `dot operator`（点操作符），在点之前命名的对象被称为\
  \ `calling object`（调用对象）。在某些方面，调用对象就像是函数的一个额外参数——函数可以像改变参数一样改变调用对象——但调用对象在函数调用中起着甚至更大的作用。调用对象决定了函数名的含义。编译器使用调用对象的类型来确定函数名的含义。例如，在早先的那次对\
  \ `open` 的调用中，对象 `inStream` 的类型决定了函数名 `open` 的含义。\n\n函数名 `close` 与 `open` 类似。`ifstream`\
  \ 和 `ofstream` 类各都有一个名为 `close` 的成员函数。它们都用于“关闭文件”，但它们关闭的方式不同，因为文件被打开和处理的方式也所不同。我们将在本章的稍后部分讨论\
  \ `ifstream` 和 `ofstream` 类的更多成员函数。\n\n## 编程提示：检查文件是否成功打开\n\n调用 `open` 可能会因为许多原因而失败。例如，如果你打开一个输入文件，但没有你所指定的外部名称的文件，那么\
  \ `open` 的调用就会失败。当发生这种情况时，你可能不会接收到错误信息，你的程序可能会直接继续执行某些意料之外的操作。因此，你应该在每次调用 `open`\
  \ 之后紧跟一个测试，以检查 `open` 调用是否成功，如果 `open` 失败，则结束程序（或采取其他适当措施）。\n\n你可以使用名为 `fail` 的成员函数来测试流操作是否失败。`ifstream`\
  \ 和 `ofstream` 每个类都有一个 `fail` 成员函数。`fail` 函数不接受任何参数，并返回一个 `bool` 值。对名为 `inStream`\
  \ 的流调用函数 `fail` 如下：\n\n```\ninStream.fail( )\n```\n\n这是一个可以用于控制 `while` 循环或 `if-else`\
  \ 语句的布尔表达式。\n\n你应该在每次调用 `open` 之后立即调用一次 `fail`；如果 `open` 调用失败，函数 `fail` 将返回 `true`（即布尔表达式为真）。例如，如果以下对\
  \ `open` 的调用失败，程序将输出错误信息并结束；如果调用成功，`fail` 函数返回 `false`，程序将继续运行。\n\n![插图显示了一个代码段：](img/ch6_p10.png)6.1-2\
  \ 完整备用文本\n\n`fail` 是一个成员函数，因此使用流名和点来调用它。当然，对 `inStream.fail` 的调用仅指形式为 `inStream.open`\
  \ 的 `open` 调用，而不指使用任何其他流作为调用对象时进行的任何 `open` 函数调用。\n\n之前显示的 `exit` 语句与类无关，与流也没有直接关系，但它经常在这种语境下使用。`exit`\
  \ 语句会导致你的程序立即结束。`exit` 函数将它的参数返回给操作系统。要使用 `exit` 语句，你的程序必须包含以下 `include` 指令：\n\n\
  ```\n#include <cstdlib>\n```\n\n当使用 `exit` 时，你的程序还必须包含以下内容通常位于文件开头或使用 `exit` 的函数体开头：\n\
  \n```\nusing namespace std;\n```\n\n函数 `exit` 是一个预定义函数，接受一个整数参数。按照惯例，如果调用 `exit`\
  \ 是由于错误，则使用 `1` 作为参数，否则使用 `0`。对于我们的目的来说，使用什么整数没有区别，但遵循这一惯例是有好处的，因为这在更高级的编程中非常重要。\n\
  \n显示 6.2 包含了来自 显示 6.1 的程序的重写版本，其中包含了检查输入和输出文件是否成功打开的测试。它处理文件的方式与 显示 6.1 中的程序完全相同。特别是，假设\
  \ 显示 6.1 中所示的文件 `infile.dat` 存在且包含内容，程序将创建 显示 6.2 所示的 `outfile.dat` 文件。然而，如果发生某些错误且某个\
  \ `open` 调用失败了，程序将结束并向屏幕发送一条错误消息。\n\n```\n// 从 infile.dat 读取数字，对这些数字求和，\n//并将和写入\
  \ outfile.dat。\n#include <fstream>\n#include <iostream>\n#include <cstdlib>\nint\
  \ main( )\n{\n    using namespace std;\n    ifstream inStream;\n    ofstream outStream;\n\
  \    inStream.open(\"infile.dat\");\n    if (inStream.fail( ))\n    {\n        cout\
  \ << \"输入打开失败。\\n\";\n        exit(1);\n    }\n    outStream.open(\"outfile.dat\"\
  );\n    if (outStream.fail( ))\n    {\n        cout << \"输出打开失败。\\n\";\n       \
  \ exit(1);\n    }\n    int first, second, third;\n    inStream >> first >> second\
  \ >> third;\n    outStream << \"infile.dat 中前 3 个\\n\"\n              << \"数字的和是\
  \ \" << (first + second + third)\n              << endl;\n    inStream.close( );\n\
  \    outStream.close( );\n    return 0;\n}\n```\n\n***屏幕输出*** **(如果 infile.dat 不存在)**\n\
  \n```\n输入打开失败。\n```\n\n# 显示 6.2 带有检查的文件 I/O\n\n注意我们使用 `cout` 输出错误信息；这是因为我们希望错误信息发送到屏幕，而不是文件。由于此程序使用\
  \ `cout` 输出到屏幕（同时在进行文件 I/O），我们为头文件 `iostream` 添加了包含指令。（实际上，当程序有了 `#include <fstream>`\
  \ 时，不需要 `#include <iostream>`，但包含它没有问题，而且它可以提醒你程序除了文件 I/O 之外还在使用屏幕输出。）\n\n# 文件 I/O\
  \ 技术\n\n正如我们已经提到的，`>>` 和 `<<` 运算符对于连接到文件的流与对于 `cin` 和 `cout` 的工作方式相同。然而，文件 I/O 的编程风格与使用屏幕和键盘的\
  \ I/O 不同。当从键盘读取输入时，你应该提示输入并回显输入，如下所示：\n\n```\ncout << \"输入数字：\";\ncin >> theNumber;\n\
  cout << \"你输入的数字是 \" << theNumber;\n```\n\n\n\n\n当你的程序从文件读取输入时，你不应该包含此类提示行或对输入的回显，因为没有那里来读取并响应这些提示和回显。在从文件读取输入时，你必须确定文件中的数据正是程序所预期的数据类型。然后，你的程序只需读取输入文件，假设在需要时所需的数据已经在那里了。如果\
  \ `inFile` 是一个连接到输入文件的流变量，且你希望将之前显示的键盘/屏幕 I/O 替换为连接到 `inFile` 的文件的输入，那么你可以将那三行替换为如下行：\n\
  \n```\ninFile >> theNumber;\n```\n\n你可以打开任意数量的输入或输出流。因此，一个程序既可以从键盘获取输入，也可以从一个或多个文件获取输入。同一个程序也可以将输出发送到屏幕以及一个或多个文件。或者，一个程序可以从键盘获取所有输入，并将输出同时发送到屏幕和文件。允许任何输入和输出流的组合。书中的大多数示例都将使用\
  \ `cin` 和 `cout` 通过键盘和屏幕进行 I/O，但很容易修改这些程序，使程序从文件读取输入和/或将输出发送到文件。\n\n### 自测练习\n\n\
  1. 假设你正在编写一个程序，使用一个名为 `fin` 的流（它将连接到一个输入文件）以及一个名为 `fout` 的流（连接到一个输出文件）。你如何声明 `fin`\
  \ 和 `fout`？你需要在程序文件中放置哪些 `include` 指令？\n\n2. 假设你正在继续编写上一个练习中讨论的程序，并且你想让它从文件 `stuff1.dat`\
  \ 读取输入并将输出发送到文件 `stuff2.dat`。你需要在程序中放置哪些语句来将流 `fin` 连接到文件 `stuff1.dat`，并将流 `fout`\
  \ 连接到文件 `stuff2.dat`？务必包含检查以确保打开操作成功。\n\n3. 假设你仍在编写我们在前两个练习中讨论的同一个程序，现在你到了不再需要从文件\
  \ `stuff1.dat` 获取输入也不再需要向文件 `stuff2.dat` 发送输出的。你如何关闭这些文件？\n\n4. 假设你想更改显示 6.1 中的程序，使其将输出发送到屏幕而不是文件\
  \ `outfile.dat`。（输入仍应来自文件 `infile.dat`。）你需要对程序做哪些更改？\n\n5. 如果你的程序使用了函数 `exit`，你需要在程序文件中放置哪一个\
  \ `include` 指令？\n\n6. 继续自测练习 5，`exit(1)` 对其参数做了什么操作？\n\n7. 假设 `bla` 是一个对象，`dobedo`\
  \ 是对象 `bla` 的成员函数，且 `dobedo` 接受一个 `int` 类型的参数。你如何使用参数 `7` 调用对象 `bla` 的成员函数 `dobedo`？\n\
  \n8. 普通程序变量与文件具有哪些特征？文件的哪些特征与程序中的普通变量有何不同？\n\n9. 列出至少三个与 `iostream` 对象相关的成员函数，并给出每个函数的用法示例。\n\
  \n10. 程序读取了文件文件中一半的行。程序必须对文件进行什么操作才能第二次读取第一行？\n\n11. 文中提到“一个文件有两个名称”。这两个名称是什么？每个名称在何时被使用？\n\
  \n# 向文件追加内容（*可选*）\n\n向文件发送输出时，你的代码必须首先使用成员函数 `open` 打开文件并将其连接到类型为 `ofstream` 的流。我们到目前为止所采用的方法（使用文件名作为单个参数）始终会产生一个空文件。如果已存在指定名称的文件，其旧内容将丢失。还有另一种打开文件的方法，使得你程序的输出可以追加到文件中已有任何数据之后。\n\
  \n要将你的输出追加到名为 `important.txt` 的文件，你将使用 `open` 的双参数版本，如下例所示：\n\n```\nofstream outStream;\n\
  outStream.open(\"important.txt\", ios::app);\n```\n\n如果文件 `important.txt` 不存在，这将创建一个带有该命名的空文件以接收你程序的输出，但如果文件已存在，则你程序的所有输出都将追加到文件的末尾，这样文件中的旧数据就不会丢失。这在显示\
  \ 6.3 中所示说明。\n\n```\n 1    // 将数据追加到文件 data.txt 的末尾。\n 2    #include <fstream>\n\
  \ 3    #include <iostream>\n 4    \n 5    int main()\n 6    {\n 7         using\
  \ namespace std;\n 8         ofstream outStream;\n 9         cout << \"Opening important.txt.\\\
  n\";\n 10        outStream.open(\"important.txt\", ios::app);\n 11        if (outStream.fail())\n\
  \ 12        {\n 13             cout << \"Opening failed.\\n\";\n 14            \
  \ exit(1);\n 15        }\n 16        outStream << \"Appends data to the end of the\
  \ file data.txt.\\n\";\n 17        outStream << \"This is a line of data.\\n\";\n\
  \ 18        outStream << \"This is another line of data.\\n\";\n 19        outStream.close();\n\
  \ 20        cout << \"Done.\\n\";\n 21        return 0;\n 22    }\n```\n（注：上面的代码块根据提供的逻辑重构）。\n\
  \n显示 6.3 追加输出\n向文件发送输出时，你的代码必须首先使用成员函数 `open` 打开文件并将其连接到类型为 `ofstream` 的流。我们到目前为止所采用的方法（使用文件名作为单个参数）始终会产生一个空文件。如果已存在指定名称的文件，其旧内容将丢失。还有另一种打开文件的方法，使得你程序的输出可以追加到文件中已有任何数据之后。要将你的输出追加到名为\
  \ `important.txt` 的文件，你将使用 `open` 的双参数版本，如下所示：\n\n如果文件 `important.txt` 不存在，这将创建一个带有该命名的空文件以接收你程序的输出，但如果文件已存在，则你程序的所有输出都将追加到文件的末尾，这样文件中的旧数据就不会丢失。\n\
  \n# 文件名输入（*可选*）\n\n到此为止，我们将输入和输出文件的文件名直接写在了程序代码中。我们通过将文件名作为 `open` 的参数来实现这一点，例如：\n\
  \n```\ninStream.open(\"infile.dat\");\n```\n\n这有时会不方便。例如，显示 6.2 中的程序从文件 `infile.dat`\
  \ 读取数字并将和输出到 `outfile.dat`。如果你想对另一个名为 `infile2.dat` 的文件中的数字进行相同的计算，并将结果写入另一个文件 `outfile2.dat`，那么你必须更改\
  \ `open` 成员函数中的文件名并重新编译程序。更好的替代方案是编写程序，让用户输入输入和输出文件的名称。\n\n文件名是一个*字符串*，我们将在第 8 章](#fileP7001013976000000000000000004360.xhtml_P700101397600000000000000004360)之前详细讨论字符串。但是很容易学习关于字符串的知识，以便编写接受文件名作为输入的程序。**字符串**只是字符序列。我们之前已经在输出语句中使用字符串值，如下：\n\
  \n```\ncout << \"This is a string.\";\n```\n\n每当你编写字面量字符串时（如所示的 `cout` 语句），你必须将字符串放在双引号中。\n\
  \n\n\n\n为了将文件名读取到程序中，你需要一个能够存储字符串的变量。我们将在第 8 章 中详细讨论字符串的细节，但目前我们只介绍足够存储文件名的内容。存储字符串值的变量声明如下例所示：\n\
  \n```\nchar fileName[16];\n```\n\n这种声明与你将变量声明为 `char` 类型相同，区别在于变量名后面紧跟一个方括号内的整数，该整数指定了存储在变量中的字符串中可以包含的最大字符数。这个数字必须比字符串值的最大字符数大\
  \ 1。因此，在我们的示例中，变量 `fileName` 可以包含任何 15 个或更少字符的字符串。名称 `fileName` 可以替换为任何其他标识符（非关键字），而数字\
  \ `16` 可以替换为任何其他正整数。\n\n你可以像输入其他类型的值一样为字符串变量输入字符串值。例如，考虑以下代码：\n\n```\ncout << \"\
  Enter the file name (maximum of 15 characters):\\n\";\ncin >> fileName;\ncout <<\
  \ \"OK, I will edit the file \" << fileName << endl;\n```\n\n这段代码的一种可能对话如下：\n\n\
  ```\nEnter the file name (maximum of 15 characters): \nmyfile.dat\nOK, I will edit\
  \ the file myfile.dat\n```\n\n一旦你的程序将文件名读取到字符串变量（例如变量 `fileName`），它就可以将该字符串变量作为成员函数\
  \ `open` 的参数。例如，下面的代码将输入文件流 `inStream` 连接到名称存储在变量 `fileName` 中的文件（并使用成员函数 `fail`\
  \ 检查打开是否成功）：\n\n```\nifstream inStream;\ninStream.open(fileName);\nif (inStream.fail(\
  \ ))\n{\n    cout << \"Input file opening failed.\\n\";\n    exit(1);\n}\n```\n\n\
  请注意，当你将字符串变量作为成员函数 `open` 的参数时，不需要使用任何引号。\n\n在显示 6.4 中，我们重写了显示 6.2 中的程序，使其从用户指定的任何文件读取输入并将输出发送到用户指定的的文件。输入和输出文件名被读取到字符串变量\
  \ `inFileName` 和 `outFileName` 中，然后这些变量被用作调用成员函数 `open` 的参数。注意字符串变量的声明。你必须在每个字符串变量后的方括号中包含一个数字，正如我们在显示\
  \ 6.4 中做的那样。\n\n```\n 1    //从用户指定的文件读取三个数字，对这些数字求和，\n 2    //并将和写入用户指定的另一个文件中。\n\
  \ 3    #include <fstream>\n 4    #include <iostream>\n 5    #include <cstdlib>\n\
  \ 6   \n 7    int main( )\n 8    {\n 9        using namespace std;\n10        charinFileName[16],\
  \ outFileName[16];\n11        ifstream inStream;\n12        ofstream outStream;\n\
  13     \n14        cout << \"I will sum three numbers taken from an input\\n\"\n\
  15             << \"file and write the sum to an output file.\\n\";\n16        cout\
  \ << \"Enter the input file name (maximum of 15 characters):\\n\";\n17        cin\
  \ >> inFileName;\n18        cout << \"Enter the output file name (maximum of 15\
  \ characters):\\n\";\n19        cin >> outFileName;\n20        cout << \"I will\
  \ read numbers from the file \"\n21             << inFileName << \" and\\n\"\n22\
  \             << \"place the sum in the file \"\n23             << outFileName <<\
  \ endl;\n24      \n25        inStream.open(inFileName);\n26        if (inStream.fail(\
  \ ))\n27        {\n28            cout << \"Input file opening failed.\\n\";\n29\
  \            exit(1);\n30        }\n31      \n32        outStream.open(outFileName);\n\
  33        if (outStream.fail( ))\n34        {\n35            cout << \"Output file\
  \ opening failed.\\n\";\n36            exit(1);\n37        }\n```\n\n\n\n对 `precision`\
  \ 的调用仅适用于调用中指定的流。如果你的程序有另一个名为 `outStreamTwo` 的输出流，那么对 `outStream.precision` 的调用会影响输出到流\
  \ `outStream`，但对流 `outStreamTwo` 没有影响。当然，你也可以对流 `outStreamTwo` 调用 `precision`；你甚至为输出到流\
  \ `outStreamTwo` 的数字指定不同的位数，如下：\n\n```\noutStreamTwo.precision(3);\n```\n\n我们魔法公式中的其他格式指令比成员函数\
  \ `precision` 复杂一些。我们现在讨论这些其他指令。以下是是以 `outStream` 为调用对象对成员函数 `setf` 的两次调用：\n\n```\n\
  outStream.setf(ios::fixed);\noutStream.setf(ios::showpoint);\n```\n\n`setf` 是 `set\
  \ flags`（设置标志）的缩写。`flag`（标志）是一个以两种可能方式执行某操作的指令。如果将标志作为参数传递给 `setf`，该标志将告诉计算机以某种特定方式向该流写入输出。它导致流执行的操作取决于标志。\n\
  \n在前面的示例中，对函数 `setf` 有两次调用，这两个调用设置了两个标志 `ios::fixed` 和 `ios::showpoint`。标志 `ios::fixed`\
  \ 导致流以所谓的“定点计数法”（fixed-point notation）输出 `double` 的数字，这是我们通常书写数字的一种通俗说法。如果设置了 `ios::fixed`\
  \ 标志（通过调用 `setf`），那么输出到该流的所有浮点数（如 `double` 类型数字）将以普通的计数法写入，而不是科学计数法（e-notation）。\n\
  \n标志 `ios::showpoint` 告诉流在浮点数（如 `double` 类型数字）中始终包含一个小数点。因此，如果要输出的数字值为 `2.0`，它将被输出为\
  \ `2.0` 而不是简单的 `2`；也就是说，即使小数点后的所有数字都是 `0`，输出也会包含小数点。一些常见的标志及其它们引起的操作在显示 6.5 中描述。\n\
  \n| `Flag` | `Meaning` | `Default` |\n| --- | --- | --- |\n| ios::fixed | 如果设置此标志，浮点数将不以科学计数法写入。（设置此标志会自动取消\
  \ `ios::scientific` 标志。） | 未设置 |\n| ios::scientific | 如果设置此标志，浮点数将以科学计数法写入。（设置此标志会自动取消\
  \ `ios::fixed` 标志。）如果既未设置 `ios::fixed` 也设置 `ios::scientific`，则系统决定如何输出。 | 未设置 |\n\
  | ios::showpoint | 如果设置此标志，浮点数将始终显示小数点和末随零。如果没有设置，输出的数字可能不带带小数点和末随零。 | 未设置 |\n|\
  \ ios::showpos | 如果设置此标志，正整数值前将输出加号。 | 未设置 |\n| ios::right | 如果设置此标志并调用 `width`\
  \ 给出一个字段宽度值，则下一个输出项将位于 `width` 指定的右端。也就是说，在输出项前放置额外的空格。（设置此标志会自动取消 `ios::left` 标志。）\
  \ | 已设置 |\n| ios::left | 如果设置此标志并调用 `width` 给出一个字段宽度值，则下一个输出项将位于 `width` 指定的左端。也就是说，在输出项后放置额外的空格。（设置此标志会自动取消\
  \ `ios::right` 标志。） | 未设置 |\n\n# 显示 6.5 格式标志 setf\n\n另一个有用的标志是 `ios::showpos`。如果为流设置此标志，输出到该流的正数将带有加号。如果你希望在正数前出现加号，插入以下内容：\n\
  \n```\ncout.setf(ios::showpos);\n```\n\n负数前会显示负号。\n\n一个非常常用的格式函数是 `width`。例如，考虑由流\
  \ `cout` 执行的以下 `width` 调用：\n\n```\ncout << \"Start Now\";\ncout.width(4);\ncout\
  \ << 7 << endl;\n```\n\n这段代码会在屏幕上显示以下行：\n\n```\nStart Now   7\n```\n\n该输出在字母 `'w'`\
  \ 和数字 `7` 之间恰好有空格。`width` 函数告诉流在输出项时使用多少空格。在这种情况下，项（即数字 `7`）仅占据一个空间，而 `width` 要求使用四个空间，因此有三个空格。如果输出所需的空间比你在\
  \ `width` 中指定的多，将使用所需的额外空间。无论给 `width` 什么参数，整个项都会输出。\n\n对 `width` 的调用仅适用于调用中指定的流。如果你的程序有另一个名为\
  \ `outStreamTwo` 的输出流，那么对 `outStream.precision` 的调用会影响输出到流 `outStream`，但对流 `outStreamTwo`\
  \ 没有影响。当然，你也可以对 `outStreamTwo` 调用 `precision`；你可以为输出到流 `outStreamTwo` 的数字指定不同的位数，如下：\n\
  \n```\noutStreamTwo.precision(3);\n```\n\n# 操符\n\n**操符**（manipulator）是非传统方式调用的函数。它转而调用成员函数。与传统函数一样，操符可能有参数，也可以没有。我们已经见过过一个操符\
  \ `endl`。在本小节中，我们将讨论两个操符 `setw` 和 `setprecision`。\n\n操符 `setw` 和成员函数 `width`（你已经见过）执行完全相同的操作。你通过在插入运算符\
  \ `<<` 之后写入 `setw` 操符来调用它，就像发送到输出流一样，这转而调用成员函数 width。例如，以下使用指定的宽度输出数字 `10`、`20`\
  \ 和 `30`：\n\n```\ncout << \"Start\" << setw(4) << 10\n<< setw(4) << 20 << setw(6)\
  \ << 30;\n```\n\n前面的语句将产生以下输出：\n\n```\nStart  10  20    30\n```\n\n（10 前有两个空格，20\
  \ 前有两个空格，30 前有四个空格。）\n\n操符 `setprecision` 执行与成员函数 `precision`（你已经见过）完全相同的操作。然而，对\
  \ `setprecision` 的调用写在插入运算符 `<<` 之后，类似于你调用 `setw` 操符的方式。例如，以下使用 `setprecision` 调用指定的位数输出列出的数字：\n\
  \n```\ncout.setf(ios::fixed);\ncout.setf(ios::showpoint);\ncout << \"$\" << setprecision(2)\
  \ << 10.3 << endl\n<< \"$\" << 20.5 << endl;\n```\n\n上面的语句将产生以下输出：\n\n```\n$10.30\n\
  $20.50\n```\n\n当你使用操符 `setprecision` 设置小数点后的位数时，就像成员函数 `precision` 的情况一样，该设置一直有效，直到你通过另一个\
  \ `setprecision` 或 `precision` 调用将其重置为其他数字。\n\n要使用 `setw` 或 `setprecision` 操操符，你必须在程序中包含以下指令：\n\
  \n```\n#include <iomanip>\n```\n\n你的程序还应该包含以下内容：\n\n```\nusing namespace std;\n\
  ```\n\n### 自测题\n\n12. 执行以下行时将产生什么输出（假设这些行嵌入在具有适当 `include` 指令的完整且正确的程序中）？\n\n\n\n\
  \n\n```\ncout << \"*\";\ncout.width(5);\ncout << 123\n     << \"*\" << 123 << \"\
