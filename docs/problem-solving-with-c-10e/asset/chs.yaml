  ISBN 13: 978-0-13-444828-2\n\n# 前言\n\n本书旨在用于 C++ 语言的第一门编程和计算机科学课程。它假设读者没有之前的编程经验，也没有高中代数以外的数学知识。\n\
  \n如果您使用过本书的旧版本，应该阅读以下解释第十版更改的部分，然后就可以跳过前言的其余部分。如果您是本书的新读者，前言的其余部分将为您提供本书的概述。\n\n\
  # 第十版的更改\n\n这第十版介绍了与第九版相同的编程哲学。第九版的所有内容均保留，但进行了以下增强：\n\n* 全文统一使用 `camelCase`（驼峰命名法）而非\
  \ `underscore_case`（下划线命名法）。\n* 在第 10 章 中讨论了浅拷贝与深拷贝。\n* 在第 12 章和第 17 章中增加了关于使用头文件编译模板的材料。\n\
  * 在第 18 章中增加了 `std::array` 和智能指针的材料。\n* 修正了错误，例如用 `std::function` 替换 `std::vector`，以及用\
  \ `std::string` 替换文件 I/O。\n* 十个新视频。\n\n\n\n\n\n# 课程概览\n\n- **类与命名空间**：第 10 章，第 11\
  \ 章的第 11.1 节和第 11.2 节以及第 11 章，第 12 章。这些内容涵盖了类的定义、友元、重载运算符和命名空间。\n- **数组、字符串和向量**：第\
  \ 7 章和第 8 章\n- **指针和动态数组**：第 9 章\n- **类中的数组**：第 11 章的第 11.3 节和第 11.4 节属于第 11 章\n\
  - **继承**：第 15 章\n- **递归**：第 14 章。（或者，递归可以移动到课程的后期。）\n- **指针和链表**：第 13 章\n\n你也可以使用以下章节的任何子集：\n\
  \n- **异常处理**：第 16 章\n- **模板**：第 17 章\n- **标准模板库**：第 18 章\n\n# 重新排序：类在前\n\n此版本将所有控制结构和基础内容安排在类之后，比之前靠后。\n\
