  \ \\ldots + a_{0}$ 将通过链表实现。每个节点包含一个表示 $x$ 幂次的 `int` 值和一个对应的系数 `int` 值。该类的操作包括加法、减法、乘法和多项式的求值。重载用于加法、减法和乘法的运算符这些操作。\n\
  \n多项式的求值实现为一个具有 `int` 类型参数的成员函数。求值成员函数通过将参数代入 $x$ 执行指示的操作返回结果。包含四个构造函数：\n*   默认构造函数。\n\
  *   拷贝构造函数。\n*   具有单个 `int` 类型参数的构造函数，产生一个常数项等于构造函数参数的多项式。\n*   具有两个 `int` 类型参数的构造函数，产生系数和指数由这两个参数给出的单项多项式。（在上述表示中，单参数构造函数产生的多项式是简单的形式\
  \ $a[0]$。双参数构造函数产生的多项式是稍微复杂的形式 $a[n]x^{\\hat{}n}$。）\n\n包含合适的析构函数。包含输入输出多项式的成员函数。\n\
  \n当用户输入多项式时，用户输入如下：\n\n$a_{n} \\times \\hat{}n + a_{n - 1} \\times \\hat{}n - 1\
  \ + \\ldots + a_{0}$\n\n但是，如果系数 `a[i]` 为零，用户可以省略项 `a[i]x^i`。例如，多项式 $3x⁴ + 7x² +\
  \ 5$\n\n可以输入为：\n\n```\n3x⁴ + 7x² + 5\n```\n\n\n\n\n\n```\n3x⁴ + 0x³ + 7x² + 0x¹\
  \ + 5\n```\n\n如果系数为负数，则用减号代替加号，如下例所示：\n\n```\n3x⁵ − 7x³ + 2x¹ − 8\n−7x⁴ + 5x² +\
  \ 9\n```\n\n多项式开头的减号（如两个示例中的第二个）仅适用于第一个系数；它不会使整个多项式变。多项式以相同的格式输出。在输出时，系数为零的项将不会输出。\n\
  \n为了简化输入，你可以假设多项式始终每行输入，且始终会有一个常项 `a[0]`。如果没有常项，用户将在常项处输入 0，如下所示：\n\n```\n12x⁸ +\
  \ 3x² + 0\n```\n\n### 4. 在此项目中，你将使用链表代替数组，重新完成第 11 章中的编程项目 8。正如那里提到的，这是一个`double`类型元素的链表。这一事实意味着某些成员函数可能需要更改。成员如下：默认构造函数；一个名为\
