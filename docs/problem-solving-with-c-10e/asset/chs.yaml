  3. 析构函数实际上做了什么？\n4. 析构函数应该做什么？\n\n# 重载赋值运算符\n\n假设 `string1` 和 `string2` 声明如下：\n\n\
  ```\nStringVar string1(10), string2(20);\n```\n\n`StringVar` 类定义在显示 11.11 和 11.12\
  \ 中。如果 `string2` 以某种方式被赋予赋值，则定义了以下赋值语句，但它的含义可能并不是你想要的：\n\n```\nstring1 = string2;\n\
  ```\n\n和通常一样，这个预定义的赋值语句版本会将 `string2` 的每个成员变量的值拷贝到 `string1` 对应的成员变量中，因此 `string1.maxLength`\
  \ 的值变为与 `string2.maxLength` 相同，`string1.value` 的值变为与 `string2.value` 相同。但这可能会给 `string1`\
  \ 带来问题，甚至可能给 `string2` 带来问题。\n\n成员变量 `string1.value` 包含一个指针，赋值语句将该指针设置为与 `string2.value`\
  \ 相同。因此，`string1.value` 和 `string2.value` 指向内存中的同一位置。如果你更改了 `string1` 中的字符串值，你也会更改\
  \ `string2` 中的字符串值。如果你更改了 `string2` 中的字符串值，你就会更改 `string1` 中的字符串值。\n\n简而言之，预定义的赋值语句并没有执行我们希望\
  \ `StringVar` 类型对象的赋值语句执行的操作。在 `StringVar` 类中使用预定义的赋值运算符版本只会导致问题。修复此的方法是重载赋值运算符\
  \ `=`，以便它对 `StringVar` 类的对象执行我们想要的操作。\n\n赋值运算符不能像我们重载 `<<` 和 `+` 等运算符那样进行重载。当你重载赋值运算符时，它必须是类的成员函数；不能是类的友元（friend）。要为\
  \ `StringVar` 类添加一个重载的赋值运算符版本，应将 `StringVar` 的定义更改如下：\n\n```cpp\nclass StringVar\n\
  {\npublic:\n    void operator =(const StringVar& rightSide);\n    // 重载赋值运算符 = 以将字符串\n\
  \    // 从一个对象拷贝到另一个对象。\n    <类的定义的其余部分可以与\n    显示 11.11 中的相同。>\n```\n\n随后，赋值运算符的使用就像你一直使用赋值运算符一样。例如，考虑以下情况：\n\
  \n```\nstring1 = string2;\n```\n\n在此调用中，`string1` 是调用对象，而 `string2` 是成员运算符 `=` 的参数。\n\
  \n赋值运算符的定义可以如下：\n\n```cpp\n// 以下定义是可以接受的，但\n// 我们将提供一个更好的定义：\nvoid StringVar::operator\
  \ =(const StringVar& rightSide)\n{\n    int newLength = strlen(rightSide.value);\n\
  \    if ((newLength) > maxLength)\n        newLength = maxLength;\n    for (int\
  \ i = 0; i < newLength; i++)\n        value[i] = rightSide.value[i];\n    value[newLength]\
  \ = '\\0';\n}\n```\n\n注意，赋值运算符右侧对象中字符串的长度会被检查。如果它太长而无法放入赋值运算符左侧的对象（即调用对象），则只有足够的字符会被拷贝到接收字符串的对象中。但假设你不想在拷贝过程中丢失任何字符。为了容纳所有字符，你可以为赋值运算符左侧的对象创建一个新的、更大的动态数组。你可以尝试如下重定义赋值运算符：\n\
  \n```cpp\n// 这个版本有一个 bug：\nvoid StringVar::operator =(const StringVar& rightSide)\n\
  {\n    delete [] value;\n    int newLength = strlen(rightSide.value);\n    maxLength\
  \ = newLength;\n    value = new char[maxLength + 1];\n    for (int i = 0; i < newLength;\
  \ i++)\n        value[i] = rightSide.value[i];\n    value[newLength] = '\\0';\n\
  }\n```\n（注：原文在此处存在部分重复和逻辑断层，翻译已根据上下文进行了整理。）\n\n对于许多类，赋值运算符的定义在两边都是同一个对象时可能无法工作。你应该始终检查这种情况，并仔细地编写你的赋值运算符定义，使其在这种情况下也能工作。\n\
  \n### 自测题\n\n27. 1. 详细解释为什么当仅由内置类型组成时，不需要重载赋值运算符。\n2. 与拷贝构造函数的第 (a) 小相同。\n3. 与析构函数的第\
  \ (a) 小相同。\n\n# 本章总结\n\n* 类的**友元**（friend）函数是一个普通函数，只是它可以访问类的私有成员，就像成员函数一样。\n* 如果你的类拥有一套完整的访问器和修改器函数，那么将函数设为友元的唯一理由是为了简化并高效地定义该函数，但这通常已经足够了。\n\
  * 对于类类型的参数，通常应该是常量参数。\n* 运算符（如 `+` 和 `==`）可以重载，以便与定义的类对象一起。\n* 在重载 `>>` 或 `<<` 运算符时，返回类型应该是流类型并且必须是引用，通过在返回类型名称后添加\
  \ `&` 来。\n* 数组的基类型可以是结构体或类。结构体或类可以将数组作为成员变量。\n* **析构函数**是类的一种特殊成员函数。当类对象离开范围时，析构函数会被调用。析构函数的主要目的是将内存返回给空存储，以便内存被重复利用。\n\
  \n\n\n\n\n*   `copy constructor`（拷贝构造函数）是一个只有一个参数的构造函数，该参数的类型与类相同。如果你定义了拷贝构造函数，每当函数返回类类型的值，以及每当类类型的按值参数在调用中被“填入”时，它都会被自动调用。任何使用指针和\
  \ `new` 运算符的类都应该有一个拷贝构造函数。\n\n*   赋值运算符 `=` 可以对类进行重载，使其在该类中的行为符合你的意预期。然而，它必须作为类的成员进行重载；而不能作为友元（friend）进行重载。任何使用指针和\
  \ `new` 运算符的类都应该为该类重载赋值运算符。\n\n### 自测练习答案\n\n1. 1\\.\n\n```cpp\nbool before(DayOfYear\
