  \ 函数重写为虚函数。\n\n编写一个 `main` 函数，创建一个至少包含一只鸟、一只狗和一只猫的宠物向量或数组，然后循环遍历并输出每个宠物的描述。\n\n\n\
  \n\n异常最重要的用途或许是处理某些具有特殊情况的函数，这些情况根据函数被使用的方式会有不同的处理。也许该函数可能会在许多程序中使用，其中某些程序将以一种方式处理特殊情况，而另一些程序将以另一种方式处理。例如，如果函数存在除以零的操作，那么对于该函数的某些调用，程序应该结束；但对于其他调用，则应该发生其他事情。你会发现，可以将此类函数定义为在发生特殊情况时抛出异常，而该异常将允许在函数外部处理该特殊情况。这样，就可以针对函数的不同调用以不同的方式处理特殊情况。\n\
  \n在 C++ 中，异常处理的过程如下：由某些库软件或你的代码提供一种机制，在发生异常情况时发出信号。这被称为`抛出异常（`throwing an exception`）。在程序的另一个地方，你放置处理异常情况的代码。这被称为`处理异常（`handling\
  \ the exception`）。这种编程方法可以让代码更加整洁。当然，我们仍然需要解释在 C++ 中实现这些操作细节。\n\n### 前提条件\n\n除了可以跳过的一个小节外，[第\
  \ 16.1 节] 仅使用了来自[第 2 章]到[第 6 章]以及[第 10 章]到[第 11 章]的内容。[第 16.1 节]中名为“派生类中的异常规范”的陷阱（Pitfall）小节使用了[第\
  \ 15 章]的内容。这个陷阱小节可以跳过而不影响连续性。\n\n除了可以跳过的一个小节外，[第 16.2 节]仅使用了来自[第 2 章]到[第 8 章]、第\
  \ 10 章]到[第 12 章]的内容，以及[第 16.1 节]和[第 15 章]中的[第 15.1 节]。[第 16.2 节]中名为“测试可用性”的小节使用了[第\
  \ 15 章]的内容。该小节可以跳过而不影响连续性。\n\n# 16.1 异常处理基础\n\n，程序在大多数情况下都能正常工作。我并不知道它必须为了那种情况而工作。异常处理应该节制使用，并用于比包含在简单示例中更复杂的情况。因此，我们将通过通常会使用异常处理的简单示例，来教你\
  \ C++ 的异常处理细节。这对于学习异常处理非常有意义，但不要忘记这些这些示例只是玩具级示例，在实践中，你不会为任何如此简单的事情使用异常处理。\n\n# 异常处理的玩具示例\n\
  \n对于这个示例，假设牛奶在我们的文化中是如此重要的食物，以至于人们永远不会缺牛奶，但我们仍然希望程序能够适应牛奶耗光这种极罕的情况。假设我们没有耗光牛奶的基础代码如下：\n\
  \n```cpp\ncout << \"Enter number of donuts:\\n\";\ncin >> donuts;\ncout << \"Enter\
  \ number of glasses of milk:\\n\";\ncin >> milk;\ndpg = donuts/static_cast<double>(milk);\n\
  cout << donuts << \" donuts.\\n\"\n     << milk << \" glasses of milk.\\n\"\n  \
  \   << \"You have \" << dpg\n     << \" donuts for each glass of milk.\\n\";\n```\n\
  \n如果没有牛奶，这段代码将包含除以零的操作，这是一个错误。为了处理耗光牛奶的特殊情况，我们可以为这种不寻常的情况添加测试。带有此种特殊情况测试的完整程序在[显示\
  \ 16.1]中显示。[显示 16.1]中的程序没有使用异常处理。现在，让我们看看如何使用 C++ 异常处理设施重写这个程序。\n\n```cpp\ninclude\
  \ <iostream>\nusing namespace std;\n\nint main()\n{\n    int donuts, milk;\n   \
  \ double dpg;\n    cout << \"Enter number of donuts:\\n\";\n    cin >> donuts;\n\
  \    cout << \"Enter number of glasses of milk:\\n\";\n    cin >> milk;\n    if\
  \ (milk <= 0)\n    {\n        cout << donuts << \" donuts, and No Milk!\\n\"\n \
  \            << \"Go buy some milk.\\n\";\n    }\n    else\n    {\n        dpg =\
  \ donuts/static_cast<double>(milk);\n        cout << donuts << \" donuts.\\n\"\n\
  \             << milk << \" glasses of milk.\\n\"\n             << \"You have \"\
  \ << dpg\n             << \" donuts for each glass of milk.\\n\";\n    }\n    cout\
  \ << \"End of program.\\n\";\n    return 0;\n}\n```\n\n**示例对话**\n\n```\nEnter number\
  \ of donuts:\n12\nEnter number of glasses of milk:\n0\n12 donuts, and No Milk!\n\
  Go buy some milk.\nEnd of program.\n```\n\n# 显示 16.1 不使用异常处理处理特殊情况\n\n在[显示 16.2]中，我们使用异常重写了[显示\
  \ 16.1]中的程序。这只是一个玩具示例，你可能不会在这种情况下使用异常。然而，它确实为我们提供了一个简单的示例。虽然程序整体并不简单，但至少 `try` 和\
  \ `catch` 单词之间的部分更整洁，这暗示了使用异常的优势。看 `try` 和 `catch` 单词之间的代码。那些代码基本上与[显示 16.1]中的代码相同，但不是那个大的\
  \ `if-else` 语句（在[显示 16.1]中用颜色显示），而是新程序中的以下这个较小的 `if` 语句（加上一些简单的非分支语句）：\n\n\n\n\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int donuts,\
  \ milk;\n    double dpg;\n\n    try\n    {\n        cout << \"Enter number of donuts:\\\
  n\";\n        cin >> donuts;\n        cout << \"Enter number of glasses of milk:\\\
  n\";\n        cin >> milk;\n\n        if (milk <= 0)    \n            throw donuts;\
  \ \n\n        dpg = donuts/static_cast<double>(milk);\n        cout << donuts <<\
  \ \" donuts.\\n\"\n             << milk << \" glasses of milk.\\n\"\n          \
  \   << \"You have \" << dpg\n             << \" donuts for each glass of milk.\\\
  n\";\n    }\n    catch(int e)\n    {\n        cout << e << \" donuts, and No Milk!\\\
  n\"\n             << \"Go buy some milk.\\n\";\n    }\n\n    cout << \"End of program.\\\
  n\";\n    return 0;\n}\n```\n\n### 示例 1\n\n```\nEnter number of donuts:\n12\nEnter\
  \ number of glasses of milk:\n6\n12 donuts.\n6 glasses of milk.\nYou have 2 donuts\
  \ for each glass of milk.\n```\n\n### 示例 2\n\n```\nEnter number of donuts:\n12\n\
  Enter number of glasses of milk:\n0\n12 donuts, and No Milk!\nGo buy some milk.\n\
  End of program.\n```\n\n# 显示 16.2 使用异常处理实现相同的功能\n\n```cpp\nif (milk <= 0)\n    \
  \   throw donuts;\n```\n\n这个 `if` 语句表示，如果没有牛奶了，就执行某些异常操作。这些异常操作跟在 `catch` 关键字之后。其核心思想是：正常情况由\
  \ `try` 关键字之后的代码处理，而跟在 `catch` 关键字之后的代码仅在异常情况下使用。因此，我们将正常情况与异常情况隔离开来。在这个简单的示例中，这种分离分离并没有带给我们太多用处，但在其他情况下，它将被证明是非常有帮助的。让我们来看细节。\n\
  \n在 C++ 中处理异常的基本方法由 `try-throw-catch` 三元组组成。`try` 块的语法如下：\n\n```\n try\n {\n   \
  \  Some_Code\n }\n```\n\n### `try` 块包含了基本算法代码，用于告诉计算机在一切顺利时该做什么。它之所以被称为 `try` 块，是因为你并不\
  \ 100% 确定一切都会顺利，但你想想要“尝试一下”。\n\n现在，如果真的发生了错误，你想抛出一个异常，这是表示发生了错误的一种方式。当我们添加 `throw`\
  \ 时，其基本结构如下：\n\n```\n try\n {\n   Code_To_Try\n   Possibly_Throw_An_Exception\n\
  \   More_Code\n }\n```\n\n下面是一个包含 `throw` 语句的 `try` 块示例（复制自显示 16.2）：\n\n```cpp\n\
  try\n{\n    cout << \"Enter number of donuts:\\n\";\n    cin >> donuts;\n    cout\
  \ << \"Enter number of glasses of milk:\\n\";\n    cin >> milk;\n    if (milk <=\
  \ 0)\n        throw donuts;\n    dpg = donuts/static_cast<double>(milk);\n    cout\
  \ << donuts << \" donuts.\\n\"\n         << milk << \" glasses of milk.\\n\"\n \
  \        << \"You have \" << dpg\n         << \" donuts for each glass of milk.\\\
  n\";\n}\n```\n\n以下语句抛出了 `int` 类型的值 `donuts`：\n\n```cpp\nthrow donuts;\n```\n\n抛出的值（在此例中为\
  \ `donuts`）有时被称为**异常**，而 `throw` 语句的执行被称为**抛出异常**。你可以抛出任何类型的值。在本例中，抛出一个 `int` 值。\n\
  \n正如名称所示，当某个东西被“抛出”时，它会从一个地方移动到另一个地方。在 C++ 中，从一个地方移动到另一个地方的是控制流（以及抛出的值）。当异常发生时，周围\
  \ `try` 块中的代码停止执行，另一个被称为 `catch` 块的代码开始执行。`catch` 块的执行被称为捕获异常或处理异常。当异常被抛出时，它最终应该被某个\
  \ `catch` 块处理（捕获）。在显示 16.2 中，相应的 `catch` 块紧跟在 `try` 块之后。我们重复一下 `catch` 块：\n\n```cpp\n\
  catch(int e)\n{\n    cout << e << \" donuts, and No Milk!\\n\"\n         << \"Go\
  \ buy some milk.\\n\";\n}\n```\n\n这个 `catch` 块看起来非常像一个具有 `int` 类型参数的函数定义。它并不是函数定义，但在某些方面，`catch`\
  \ 块类似于函数。它是一段独立的代码，当你的程序遇到并执行了之前的 `try` 块时，会被执行：\n\n```\nthrow\n```\n\n因此，这个 `throw`\
  \ 语句类似于函数调用，但它不是调用函数，而是调用 `catch` 块，并指示执行 `catch` 块中的代码。`catch` 块通常被称为异常处理器，这个术语暗示\
  \ `catch` 块具有类似函数的性质。在下面 `catch` 的这行代码中，标识符 `e` 是什么？\n\n```cpp\ncatch(int e)\n```\n\
  \n该标识符 `e` 看起来像一个参数，行为也非常像。因此，我们将这个 `e` 称为捕获块参数。\n\n\n\n\n如果 `donuts` 的值为正数，则不执行\
  \ `throw` 语句。在这种情况下，整个 `try` 块将被执行。在执行 `try` 块中的最后一条语句后，将执行 `catch` 块之后的语句。请注意，如果没有抛出异常，则\
  \ `catch` 块将被忽略。\n\n这听起来就像 `try-throw-catch` 设置等同于 `if-else` 语句。它们几乎是等同的，区别在于抛出的值。`try-throw-catch`\
  \ 设置类似于*具有额外的向其中一个分支发送消息的能力*的 `if-else` 语句。这听起来和 `if-else` 语句没有太大区别，但在实践中事实是巨大的差异。\n\
  \n用更正式的语气总结一下：`try` 块包含一些代码，我们假设这些代码包含一个 `throw` 语句。`throw` 语句通常只在异常情况下执行，但当它执行时，它会抛出一个某种类型的值。当抛出异常（类似于显示\
  \ 16.2 中的对话，你会发现只要用户输入非正数，`try` 块就会停止，并执行 `catch` 块。目前，我们假设每个 `try` 块后面都跟着一个相应的\
  \ `catch` 块。稍后我们将讨论如果没有相应的 `catch` 块会发生什么。\n\n接下来，我们总结一下当 `try` 块没有抛出异常时发生了什么。如果\
  \ `try` 块没有抛出异常（没有值），那么在 `try` 块完成后，程序执行将继续执行 `catch` 块之后的代码。换句话说，如果没有抛出异常，则 `catch`\
  \ 块将被忽略。程序执行的大多数时间内，`throw` 语句都不会执行，因此在大多数情况下，`try` 块中的代码将运行完毕，而 `catch` 块中的代码将被完全忽略。\n\
  \n### 自测练习\n\n1. 下列代码产生什么输出？\n\n```cpp\nint waitTime = 46;\ntry\n{\n    cout <<\
  \ \"Try block entered.\\n\";\n    if (waitTime > 30)\n        throw waitTime;\n\
  \    cout << \"Leaving try block.\\n\";\n}\ncatch(int thrownValue)\n{\n    cout\
  \ << \"Exception thrown with\\n\"\n         << \"waitTime equal to \" << thrownValue\
  \ << endl;\n}\ncout << \"After catch block.\" << endl;\n```\n\n2. 如果对自测练习 1 中的代码进行以下更改，会产生什么输出？将行\n\
  \n```cpp\nint waitTime = 46;\n```\n\n更改为\n\n```cpp\nint waitTime = 12;\n```\n\n\
  3. 在自测练习 1 给出的代码中，`throw` 语句是什么？\n\n4. 当执行 `throw` 语句时会发生什么？这是一个通用性问题。请说明通常情况下会发生什么，而不仅仅是自测问题\
  \ 1 中的代码或其他某些示例代码中发生的情况。\n\n5. 在自测练习 1 给出的代码中，`try` 块是什么？\n\n6. 在自测练习 1 给出的代码中，`catch`\
  \ 块是什么？\n\n7. 在自测练习 1 给出的代码中，`catch` 块的参数是什么？\n\n# 定义你自己的异常类\n\n`throw` 语句可以抛出任何类型的值。一种常见的做法是定义一个类，其对象可以携带你想抛出给\
  \ `catch` 块的精确类型信息。定义特殊异常类的另一个更重要的原因是，你可以使用不同的类型来识别每种可能的异常情况。\n\n异常类仅仅是一个类。使其成为异常类的是它是如何被使用的。尽管如此，在选择异常类的名称和其他细节上花费精力是值得的。显示\
  \ 16.3 包含一个带有程序员定义异常的程序示例。这只是一个说明 C++ 的演示程序。对于如此简单的任务来说，它使用了过多的机制。\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nclass NoMilk {\npublic:\n    NoMilk();\n   \
  \ NoMilk(int howMany);\n    int getDuts();\nprivate:\n    int count;\n};\nint main()\
  \ {\n    int donuts, milk;\n    double dpg;\n    try {\n        cout << \"Enter\
  \ number of donuts:\\n\";\n        cin >> donuts;\n        cout << \"Enter number\
  \ of milk:\\n\";\n        cin >> milk;\n        if (milk <= 0)\n            throw\
  \ NoMilk(donuts);\n        dpg = static_cast<double>(milk);\n        cout << donuts\
  \ << \" donuts.\\n\"\n             << milk << \" glasses.\\n\"\n             <<\
  \ \"You have \" << dpg << \" donuts for each glass.\";\n    } catch(NoMilk e) {\n\
  \        cout << e.getDuts() << \" donuts, and No Milk!\\n\"\n             << \"\
  Go buy some milk.\\n\";\n    }\n    cout << \"End of program.\";\n    return 0;\n\
  }\nNoMilk::NoMilk() {}\nNoMilk::NoMilk(int howMany) : count(howMany) {}\nint NoMilk::getDuts()\
  \ {\n    return count;\n}\n```\n\n示例对话与显示 16.2 相同。\n\n# 显示 16.3 定义你自己的异常类\n\n注意下面的\
  \ `throw` 语句：\n\n```cpp\nthrow NoMilk(donuts);\n```\n\n`NoMilk(donuts)` 部分是对 `NoMilk`\
  \ 类构造函数的调用。该构造函数接收一个 `int` 参数（此处为 `donuts`）并创建一个 `NoMilk` 类对象。然后该对象被“抛出”。\n\n# 多异常抛出与捕获\n\
  \n`try` 块可以抛出任意数量的异常值，且类型可以不同。在任何单一次的执行中，只会抛出一个异常（因为异常异常会结束 `try` 块的执行），但在执行 `try`\
  \ 块的不同时刻可能会抛出不同类型的异常值。每个 `catch` 块只能捕获一种类型的值，但通过在 `try` 块之后放置多个 `catch` 块，可以捕获不同类型的异常值。例如，显示\
  \ 16.4 中的程序在其 `try` 块之后放置了两个 `catch` 块。\n\n\n\n\n\n```cpp\n#include <iostream>\n\
  #include <string>\nusing namespace std;\n\nclass NegativeNumber\n{\npublic:\n  \
  \  NegativeNumber();\n    NegativeNumber(string takeMeToYourCatchBlock);\n    string\
  \ getMessage();\nprivate:\n    string message;\n};\n\nclass DivideByZero\n{};\n\n\
  int main()\n{\n    int jemHadar, klingons;\n    double portion;\n\n    try\n   \
  \ {\n        cout << \"Enter number of JemHadar warriors:\\n\";\n        cin >>\
  \ jemHadar;\n        if (jemHadar< 0)\n            throw NegativeNumber(\"JemHadar\"\
  );\n\n        cout << \"How many Klingon warriors do you have?\\n\";\n        cin\
  \ >> klingons;\n        if (klingons< 0)\n            throw NegativeNumber(\"Klingons\"\
  );\n        if (klingons != 0)\n            portion = jemHadar/static_cast<double>(klingons);\n\
  \        else\n            throw DivideByZero();\n        cout << \"Each Klingon\
  \ must fight \"\n             << portion << \" JemHadar.\\n\";\n    }\n    catch(NegativeNumber\
  \ e)\n    {\n        cout << \"Cannot have a negative number of \"\n           \
  \  << e.getMessage() << endl;\n    }\n    catch (DivideByZero)\n    {\n        cout\
  \ << \"Send for help.\\n\";\n    }\n\n    cout << \"End of program.\\n\";\n    return\
  \ 0;\n}\n\nNegativeNumber::NegativeNumber()\n{}\n\nNegativeNumber::NegativeNumber(string\
  \ takeMeToYourCatchBlock)\n    : message(takeMeToYourCatchBlock)\n{}\n\nstring NegativeNumber::getMessage()\n\
  {\n    return message;\n}\n```\n\n**示例对话 1**\n\n```\nEnter number of JemHadar warriors:\n\
  1000\nHow many Klingon warriors do you have?\n500\nEach Klingon must fight 2.0 JemHadar.\n\
  End of program\n```\n\n**示例对话 2**\n\n```\nEnter number of JemHadar warriors:\n−10\n\
  Cannot have a negative number of JemHadar\nEnd of program.\n```\n\n**示例对话 3**\n\n\
  ```\nEnter number of JemHadar warriors:\n1000\nHow many Klingon warriors do you\
  \ have?\n0\nSend for help.\nEnd of program.\n```\n\n虽然这里没有实现，但异常类可以有它们自己的接口和实现文件，并可以放在命名空间中。\n\
  \n这是另一个玩具示例。\n\n# 显示 16.4 捕获多个异常\n\n注意，`DivideByZero` 的 `catch` 块中没有参数。如果你不需要参数，只需简单列出类型而不带任何参数。这种情况在标题为“异常类可以是简单的”的“编程提示”部分会有稍更详细的讨论。\n\
  \n# 编程提示 异常类可以是简单的\n\n在这里我们重现了显示 16.4）中异常类 `DivideByZero` 的定义：\n\n```cpp\nclass\
  \ DivideByZero\n{};\n```\n\n这个异常类没有成员变量，也没有成员函数（默认构造函数除外）。它除了名字外一无所有，但这足够有用。抛出一个\
  \ `DivideByZero` 类的对象可以激活适当的 `catch` 块，就像在显示 16.4 中那样。\n\n在使用简单的异常类时，一旦异常到达 `catch`\
  \ 块，你通常无法对异常（抛出的值）做任何事情。异常只是被用来引导你进入 `catch` 块。因此，你可以省略 `catch`-块的参数。（每当你不需要它时，都可以省略\
  \ `catch`-块的参数，无论该异常类型是否简单。）\n\n# 在函数中抛出异常\n\n有时，延迟处理异常是有意义的。例如，你可能有一个函数，其代码在尝试除以零时会抛出异常，但你可能不想在该函数中捕获该异常。某些使用该函数的程序在异常抛出时应该直接结束，而其他使用该函数的程序应该做其他事情。因此，如果你在函数内部捕获了异常，你就不知道该如何处理它。在这些情况下，不在函数定义中捕获异常是有意义的，而是让任何使用该函数的程序将调用放在\
  \ `try` 块中，并在显示 16.5 中捕获异常：\n\n```cpp\n#include <iostream>\n#include <string>\n\
  using namespace std;\n\nint main()\n{\n    int jemHadar, klingons;\n    double portion;\n\
  \n    try\n    {\n        cout << \"Enter number of JemHadar warriors:\\n\";\n \
  \       cin >> jemHadar;\n        if (jemHadar< 0)\n            throw NegativeNumber(\"\
  JemHadar\");\n\n        cout << \"How many Klingon warriors do you have?\\n\";\n\
  \        cin >> klingons;\n        if (klingons< 0)\n            throw NegativeNumber(\"\
  Klingons\");\n        if (klingons != 0)\n            portion = jemHadar/static_cast<double>(klingons);\n\
  \        else\n            throw DivideByZero();\n        cout << \"Each Klingon\
  \ must fight \"\n             << portion << \" JemHadar.\\n\";\n    }\n    catch(NegativeNumber\
  \ e)\n    {\n        cout << \"Cannot have a negative number of \"\n           \
  \  << e.getMessage() << endl;\n    }\n    catch (DivideByZero)\n    {\n        cout\
  \ << \"Send for help.\\n\";\n    }\n\n    cout << \"End of program.\\n\";\n    return\
  \ 0;\n}\n\ndouble safeDivide(int top, int bottom)\n{\n    if (bottom == 0)\n   \
  \     throw DivideByZero();\n\n    return top/static_cast<double>(bottom);\n}\n\
  ```\n\n**示例对话 1**\n\n```\nEnter number of JemHadar warriors:\n1000\nHow many Klingon\
  \ warriors do you have?\n500\nEach Klingon must fight 2.0 JemHadar.\nEnd of program\n\
  ```\n\n**示例对话 2**\n\n```\nEnter number of JemHadar warriors:\n−10\nCannot have a\
  \ negative number of JemHadar\nEnd of program.\n```\n\n# 显示 16.5 在函数内部抛出异常\n\n该语句在\
  \ `try` 块中可见。然而，从程序执行的角度来看，它在 `try` 块中，因为它是 `safeDivide` 的定义，并且 `try` 块中有对 `safeDivide`\
  \ 的调用。\n\n# 异常规范\n\n如果函数不捕获异常，它至少应该警告程序员对该函数的调用可能会抛出异常。如果函数定义中可能会抛出未捕获的异常，则这些异常类型应该列在**异常规范**中，如由显示\
  \ 16.5 中的以下函数声明所示：\n\n```cpp\ndouble safeDivide(int top, int bottom) throw (DivideByZero);\n\
  ```\n\n函数的异常规范有时也被称为**抛出列表**（throw list）。\n\n如果函数定义中有多个可能被抛出的异常，则异常类型之间用逗号分隔，如下所示：\n\
  \n```cpp\nvoid someFunction( ) throw (DivideByZero, OtherException);\n```\n\n\n\n\
  \n在异常规范中列出的所有异常类型都将被视为正常处理。当我们说异常被正常处理时，意味着它是按照我们在在本节之前所描述的方式进行处理的。具体而言，你可以将函数调用放在\
  \ `try` 块中，随后紧跟一个 `catch` 块以捕获该类型的异常；如果函数抛出了异常（且没有在函数内部捕获它），那么紧随 `try` 块的 `catch`\
  \ 块将捕获该异常。如果完全没有异常规范（甚至没有 `throw` 列表，即使是空的），那么它等同于所有可能的异常类型都已列在异常规范中；也就是说，抛出的任何异常都会被正常处理。\n\
  \n当函数中抛出异常但该异常未列在异常规范中（且未在函数内部捕获）时会发生什么？在这种情况下，程序将终止。特别注意，如果在函数中抛出了异常但它未列在异常规范中（且未在函数内部捕获），它将不会被任何\
  \ `catch` 块捕获，而是你的程序将终止。记住，如果完全没有规格列表（即使是空的），也等同于所有异常都列在规格列表中，因此抛出异常不会以本段描述的方式终止程序。\n\
  \n请记住，异常规范是针对那些“流出”函数的异常的。如果异常没有流出函数，它们就不属于异常规范。如果它们流出了函数，无论它们源自何处都属于异常规范。如果在函数定义内部的\
  \ `try` 块中抛出了异常，并在函数定义内部的 `catch` 块中被捕获，那么它的类型不需要列在异常规范中。如果一个函数定义包含了另一个函数的调用，而该其他函数可能会抛出一个未被捕获的异常，那么该异常的类型应该放在异常规范中。\n\
  \n表示函数不抛出任何未在函数内部捕获的异常，你可以使用如下空异常规范：\n\n```cpp\nvoid someFunction( ) throw ( );\n\
  ```\n\n总结如下：\n\n```cpp\nvoid someFunction( ) throw (DivideByZero, OtherException);\n\
  // 类型为 DivideByZero 或 OtherException 的异常将被\n//正常处理。所有其他异常如果在函数体内\n// 未被捕获将终止程序。\n\
  \nvoid someFunction( ) throw ( );\n// 空异常列表；如果抛出异常但未在函数体内\n// 捕获，将终止程序。\n\nvoid\
  \ someFunction( );\n// 所有类型的异常都被正常处理。\n```\n\n请记住，派生类的对象也是其基类的一个对象。因此，如果 `D` 是类\
  \ `B` 的派生类，且 `B` 在异常规范中，那么抛出的类 `D` 对象将被视为正常处理，因为它是类 `B` 对象且 `B` 在异常规范中。然而，不会进行任何自动类型转换。如果\
  \ `double` 在异常规范中，这并不意味着可以抛出一个 `int` 值。你需要在异常规范中同时包含 `int` 和 `double`。\n\n最后的警告：并不是所有的编译器都按照预期方式处理异常规范。某些编译器本质上将异常规范视为注释，因此对于这些编译器来说，异常规范对你的代码没有影响。这就是将你的函数可能抛出的所有异常都放在异常规范中的另一个原因。这样，所有编译器将以相同的方式处理你的异常。当然，你也可以通过没有任何异常规范来获得相同的编译器一致性，但这样你的程序文档性较差，而且无法获得使用异常规范的编译器提供的额外错误检查。对于能够处理异常规范的编译器，一旦你的程序抛出了你未预料的异常，程序就会终止。（注意，这是一种运行时行为，但你获得的具体运行时行为取决于你的编译器。）\n\
  \n### 自测练习\n\n8. 下列程序的输出是什么？\n\n```cpp\n#include <iostream>\n using namespace std;\n\
  \ void sampleFunction(double test) throw (int);\nint main()\n{\n    try\n    {\n\
  \        cout << \"Trying.\\n\";\n        sampleFunction(98.6);\n        cout <<\
  \ \"Trying after call.\\n\";\n    }\n     catch(int)\n    {\n        cout << \"\
  Catching.\\n\";\n    }\n    cout << \"End of program.\\n\";\n     return 0;\n}\n\
  \ void sampleFunction(double test) throw (int)\n{\n    cout << \"Starting sampleFunction.\\\
  n\";\n     if (test < 100)\n        throw 42;\n}\n```\n\n9. 如果对自测练习 8 中的程序进行以下更改，该程序的输出是什么？将\
  \ `try` 块中的\n\n```cpp\nsampleFunction(98.6);\n```\n\n更改为\n\n```cpp\nsampleFunction(212);\n\
  ```\n\n# 16.2 异常处理的编程技术\n\n> 仅在特殊情况下使用此。\n\nWARREN PEACE, The Lieutenant’s Tools\n\
  \n到目前为止，我们向你展示了大量解释 C++ 中异常处理如何工作的代码，但我们还没有展示过一个良好且真实使用异常处理的程序示例。然而，既然你已经了解了异常处理的机制，本节可以继续解释异常处理技术。\n\
  \n# 何时抛出异常\n\n我们给出了一些简单的代码来阐明异常处理的基本概念。然而，我们的示例简单得不切实际。一个更复杂但更好的准则是是将抛出异常和捕获异常分离到不同的函数中。在大多数情况下，你应该在函数定义内部包含\
  \ `throw` 语句，在该函数的异常规范中列出异常，并将 `catch` 子句放在另一个函数中。因此，`try-throw-catch` 三组的优用法所示：\n\
  \n```cpp\nvoid functionA() throw (MyException)\n{\n    .\n    .\n    .\n    throw\
  \ MyException(<某个参数>);\n    .\n    .\n    .\n}\n```\n\n那么，在另一个函数（可能是另一个文件中的另一个函数）中，你有：\n\
  \n```cpp\nvoid functionB()\n{\n   try\n   {\n        .\n        .\n        .\n \
  \    functionA();\n        .\n        .\n        .\n    }\n     catch(MyException\
  \ e)\n    {\n        <处理异常>\n    }\n        .\n        .\n        .\n}\n```\n\n\
  此外，即使是这种 `throw` 语句的使用也应该保留不可避免的情况。如果你能以其他方式轻松处理问题，就不要抛出异常。将 `throw` 语句留给那些“异常情况的处理方式取决于函数如何以及在何处被使用”的情况。如果异常情况的处理方式取决于函数如何以及在哪里被调用，那么最好的做法是让调用函数的程序员来处理异常。在所有其他情况下，几乎总是应该避免抛出异常。\n\
  \n# 异常类层次结构\n\n定义异常类的层次结构非常有用。例如，你可能有一个 `ArithmeticError` 异常类，然后定义一个 `ArithmeticError`\
  \ 的派生类异常类 `DivideByZeroError`。由于 `DivideByZeroError` 是一个 `ArithmeticError`，因此每个针对\
  \ `ArithmeticError` 的 `catch` 块都会捕获 `DivideByZeroError`。如果你在异常规范中列出 `ArithmeticError`，那么你实际上也将\
  \ `DivideByZeroError` 添加到了异常规范中，无论你是否在异常规范中显式列出 `DivideByZeroError`。\n\n\n\n\n\n\
  # 测试可用内存\n\n在第 13 章中，我们使用如下代码创建了新的动态变量：\n\n```\nstruct Node\n{\n    int data;\n\
  \    Node *link;\n};\ntypedef Node* NodePtr;\n    . . .\nNodePtr pointer = new Node;\n\
  ```\n\n只要有足够的内存来创建新节点，这段代码就能正常工作。但是，如果没有足够的内存会发生什么？如果没有足够的内存来创建节点，就会抛出一个 `bad_alloc`\
  \ 异常。`bad_alloc` 类型是 C++ 语言的一部分，你不需要定义它。\n\n由于 `new` 在没有足够内存创建节点时会抛出 `bad_alloc`\
  \ 异常，你可以按照如下方式检查内存是否溢出：\n\n```\ntry\n{\n    NodePtr pointer = new Node;\n}\ncatch\
  \ (badAlloc)\n{\n    cout << \"Ran out of memory!\";\n}\n```\n\n当然，除了简单给出警告消息外，你还可以做其他事情，但具体做法取决于你特定的编程任务。\n\
  \n# 重新抛出异常\n\n在 `catch` 块中抛出异常是合法的。在某些情况下，你可能想捕获一个异常，然后根据细节决定抛出相同的异常或不同的异常，以便在异常处理块链的更上层进行处理。\n\
