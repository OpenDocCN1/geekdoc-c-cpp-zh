  \n5. 汉诺塔：有一个关于僧侣用 64 个石盘玩这个谜题的故事。传说当僧侣们完成将盘从一个柱子移动到另一个柱子时，时间就会结束。一堆 `n` 个大小递减的盘放在三根柱之一。任务是每次将盘从第一根柱移动到第二根。为了实现这一点，任何盘都可以从任何柱子移动到任何柱子，但必须遵守不能将大盘放在小盘之上的规则。提供了备用的第三根柱。你的任务是编写一个描述该问题解决方案的递归函数。我们没有图形，因此你应该输出一组解决该问题的指令序列。\n\
  \n> （提示*：如果你能利用第二根柱作为备用，将 `n−1` 个盘从第一根移动到第三根，那么最后一个盘就可以从第一根移动到第二根。然后使用相同的技巧（无论是什么）将\
