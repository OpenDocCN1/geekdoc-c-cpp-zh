  \ \"How are you? \";\n    strcat(aString, \"Good, I hope.\");\n    ```\n\n# C 字符串的输入与输出\n\
  \nC 字符串可以使用插入运算符 `<<` 输出。事实上，我们已经对带引号的字符串这样做了。你可以以相同的方式使用 C 字符串变量；例如：\n\n```\ncout\
  \ << news << \"Wow.\\n\";\n```\n\n其中 `news` 是一个 C 字符串变量。\n\n可以使用输入运算符 `>>` 填充 C\
  \ 字符串变量，但有一点需要记住。与所有其他数据类型一样，当以这种方式读取 C 字符串时，所有的空白字符（空格、制表符和换行符）都会被跳过。此外，如果你想读取整行，可以使用\
  \ `>>` 逐个单词读取行，这可能很繁琐且仍然无法读取行中的空格。有一种简单的方法可以读取整行并将结果字符串放入 C 字符串变量中：使用定义的函数 `getline`，它是输入流（如\
  \ `cin`）的成员函数。`getline` 有两个参数：第一个参数是接收输入的 C 字符串变量，第二个参数是允许 `getline` 填充的最大字符数（通常是一个整数）。例如，考虑以下代码：\n\
  \n```cpp\nchar a[80];\ncout << \"Enter some input:\\n\";\ncin.getline(a, 80);\n\
  cout << a << \"END OF OUTPUT\";\n```\n\n嵌入在完整程序中，这段代码产生的对话如下：\n\n```\nEnter some\
  \ input:\nDo be to!\nDo be to!END OF OUTPUT\n```\n\n使用 `getline` 函数时，整行会被读取。即使生成的字符串比第二个参数指定的最大字符数短，`getline`\
  \ 会在填充了第二个参数数量的字符后停止，即使行尚未结束。例如，考虑以下代码：\n\n```\nchar shortString[5];\ncout << \"\
  Enter some input:\\n\";\ncin.getline(shortString, 5);\ncout << shortString << \"\
  END OF OUTPUT\";\n```\n\n嵌入在完整程序中，这段代码产生的对话如下：\n\n```\nEnter some input:\ndobed\n\
  dobeEND OF OUTPUT\n```\n\n注意读取到字符串变量 `shortString` 的四个字符而不是五个，尽管第二个参数是 5。这是因为空字符\
  \ `'\\0'` 填充了一个数组位置。每个 C 字符串在存储到 C 字符串变量时都会以空字符终止，这总是消耗一个数组位置。\n\n我们为 `cout` 和 `cin`\
  \ 演示的 C 字符串输入输出技术对于文件的输入输出也是类似的。输入流 `cin` 可以替换为连接到文件的输入流。输出流 `cout` 可以替换为连接到文件的输出流。（文件\
  \ I/O 在第 6 章中讨论。）\n\n### 自测练习\n\n13. 考虑以下代码（假设嵌入在一个完整且正确的程序中并运行）：\n\n    ```\n \
