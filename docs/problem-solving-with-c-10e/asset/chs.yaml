  \n## 6\n我母亲总是带一个红色的小计数器去杂货店。这个计数器用于记录如果她购买了这次购物时篮子里的所有物品，到目前为止将花费的金额。它有一个四位显示器、每个数字对应的递增按钮以及一个重位按钮。如果输入的金额超过了它能记录的\
  \ `$99.99`，溢出指示器会变成红色。（这是很久以前的事了。）\n\n编写并实现类 `Counter` 的成员函数，用于模拟并略微扩展这种杂货店计数器的行为。构造函数应该创建一个\
  \ `Counter` 对象，该对象可以计数到构造函数参数指定的值。也就是说，`Counter(9999)` 应该提供一个可以计数到 `9999` 的计数器。新构造的计数器显示为\
  \ `0`。成员函数 `void reset();` 将计数器的数值置为 `0`。成员函数 `void incr1();` 将个位加 1，`void incr10();`\
  \ 将十位加 1，`void incr100();` 和 `void incr1000();` 分别增加接下来的两位。在增加数值时考虑任何进位，只需向私有数据成员加上相应的数字即可，无需进一步操作。成员函数\
  \ `bool overflow();` 用于检测溢出。（溢出是指增加计数器的私有数据成员超过了构造计数器时输入的最大值的结果。）\n\n使用该类来对我母亲的红色小点击器进行模拟。尽管显示的是整数，但在模拟中，右侧两个（低位）数字始终被视为分和十角分，下一位是美元，第四位是十美元。\n\
  \n提供对应分、十分角（10 分）、美元和十美元的按键。遗憾的是，没有一种按键选择看起来特别易于记忆。一种选择是使用按键 `asdfo`：`a` 代表分，后跟数字\
  \ `1` 到 `9`；`s` 代表十分角，后跟数字 `1` 到 `9`；`d` 代表美元，后跟数字 `1` 到 `9`；`f` 代表十美元，同样后跟数字 `1`\
  \ 到 `9`。每个条目（`asdf` 后跟 `1` 到 `9` 中的任意一个）之后都需按回车键。每次操作后都会报告溢出情况。可以通过按下 `o` 键请求查看溢出。\n\
  \n## 7\n编写一个`有理数`（rational number）类。这个问题将在第 11 章 中再次遇到，那里运算符重载将使问题变得简单得多。现在我们将使用成员函数\
  \ `add`、`sub`、`mul`、`div` 和 `less` 分执行操作 `+`、`-`、`*`、`/` 和 `<`。例如，`a + b` 将写为 `a.add(b)`，而\
  \ `a < b` 将写为 `a.less(b)`。\n\n为有理数定义一个类。有理数是一个比例，由两个整数组成并用除法表示。不执行除法，仅进行表示，例如 `1/2`、`2/3`、`15/32`、`65/4`、`16/5`。你应该用两个\
  \ `int` 值 `numerator`（分子）和 `denominator`（分母）来表示有理数。\n\n抽象数据类型构造的一个原则是必须存在构造函数来创建具有合法值的对象。你应该提供通过两个\
  \ `int` 值创建对象；这是一个带有两个 `int` 参数的构造函数。由于每个 `int` 也是有理数（例如 `2/1` 或 `17/1`），你应该提供一个带有单个\
  \ `int` 参数的构造函数。\n\n提供成员函数 `input` 和 `output`分别接收 `istream` 和 `ostream` 参数，并以 `2/3`\
  \ 或 `37/` 的格式获取或写入有理数。\n\n提供成员函数 `add`、`sub`、`mul`、`div` 和 `less` 来执行相应操作。成员函数 `neg`\
  \ 返回对象的负值。\n\n```\na + b\na - b\na * b\na / b\na < b\n```\n\n## 8\n定义一个名为 `Odometer`（里程表）的类，用于跟踪燃料和里程。包含私有成员变量来跟踪里程数和燃料效率。该类应该有一个构造函数将这些值初始化为零。包含一个将里程表重置的成员函数、一个设置燃料效率的成员函数、一个接受里程并将其加入里程表的成员函数，以及一个返回车辆消耗加仑数的成员函数。\n\
  \n使用你的类编写一个测试程序，创建不同燃料效率的行程。\n\n## 9\n重做第 5 章中的编程项目 7（或者第一次做），但这次使用类来封装日期。使用私有成员变量存储日、月、年，并带有相应的构造函数以及获取和设置数据的成员函数。创建一个返回星期几公共函数。所有辅助函数都应该是私有的。将你的类定义嵌入到合适的测试程序中。\n\
  \n## 10\n美国邮政会在每封信上打印一种条码来表示五位（或更多）邮政编码，这种格式被称为 POSTNET（该格式在 2009 年被新系统 OneCode\
  \ 代代）。条码由长条和短条组成。\n\n对于本程序，我们将条码表示为数字字符串。数字 1 代表长条，数字 0 代表短条。因此，条码在我们的程序中表示为\n\n\
  ```\n110100101000101011000010011\n```\n\n移除这些后剩余 25 位数字。如果将这 25 位数字分成每 5 位一组，我们得到\n\
  \n```\n10100    10100    01010    11000    01001\n```\n\n考虑每组 5 位数字。每组数字中恰好有两个 1。每个数字代表一个数值。从左到右，数字编码的值为\
  \ 7、4、2、1 和 0。将相应的数值与数字相乘并求和，即可邮政编码的最终编码位。下表显示了 10100 的编码。\n\n\n\n\n\n![](img/ua10_00200.png)10.4-8\
  \ 完整替代文本\n\n```\nZip Code Digit = 7 + 0 + 2 + 0 + 0 = 9\n```\n\n对每组 5 位数字重复此操作，并将它们拼接以获得完整的邮政编码。有一个特殊值：如果一组\
  \ 5 位数字之和为 11，则它代表数字 `0`（这是必要的，因为每组用两个数字无法表示零）。示例条形码的邮政编码解码结果为 `99504`。虽然 POSTNET\
  \ 方案看起来可能没必要那么复杂，但它的设计允许机器检测扫描邮政编码时是否发生了错误。\n\n编写一个邮政编码类，用于编码和解码美国邮政局在信封上使用的 5 位条形码。该类应该有两个构造函数。第一个构造函数应该接收整数类型的邮政编码，第二个构造函数应该接收由\
  \ `0s` 和 `1s` 组成的条形码字符串（如上所述）。尽管你有两种方式输入邮政编码，但在内部，该类应只使用一种格式存储邮政编码（你可以选择将其存储为条形码字符串或邮政编码数字）。该类还应该至少有两个公共成员函数，一个返回整数格式的邮政编码，另一个返回字符串格式的条形码的邮政编码。所有辅助函数都应该声明为私有。将你的类定义嵌入到一个适当的测试程序中。如果向构造函数传递了无效的条形码，你的程序应该打印错误信息。\n\
  \n11. 考虑一个名为 `Movie` 的类，它包含有关电影的信息。该类具有以下属性：\n\n* 电影名称\n* MPAA 分级标准（例如，G, PG, PG-13,\
  \ R）\n* 将此电影评为 `1`（糟糕）的人数\n* 将此电影评为 `2`（差）的人数\n* 将此电影评为 `3`（普通）的人数\n* 将此电影评为 `4`（好）的人数\n\
  * 将此电影评为 `5`（极佳）的人数\n\n实现该类，并为电影名称和 MPAA 分级提供访问器（accessor）和修改器（mutator）函数。编写一个函数\
  \ `addRating`，接收整数作为输入参数。该函数应该验证参数是否为 1 到 5 之间的数字，如果是，则增加符合输入参数的评分人数。例如，如果输入参数为\
  \ `3`，那么给电影评为 `3` 的人数应该加 1。编写写另一个函数 `getAverage`，它返回所有电影评分的平均值。最后，添加一个构造函数，允许程序员用指定的名称和\
  \ MPAA 分级创建对象。在构造函数中，评分电影的人数应被设置为 `0`。\n\n通过编写 `main` 函数来测试该类，创建至少两个电影对象，为每部电影添加至少五次评分，并输出每个电影对象的名称、MPAA\
  \ 分级和平均评分。\n\n# 11 友元函数、重载运算符与类中的数组\n\n> 给我们提供工具，我们就能完成工作。\n\n温斯顿·丘吉尔，无线电广播，1941\
  \ 年 2 月 9 日\n\n## 引言\n\n本章将教你更多为类定义函数和运算符的技术，包括重载常用运算符如 `+`、`*` 和 `/`，以便它们像用于 `int`\
  \ 和 `double` 等预定义类型一样被用于你定义的类。\n\n### 前提条件\n\n本章使用的材料从第 2 章到第 10 章。\n\n# 11.1 友元函数\n\
  \n> 信任你的朋友。\n\n常见建议\n\n目前为止，我们一直将类操作（如输入、输出、访问器函数等）实现为类的成员函数，但对于某些操作，将这些操作实现为普通（非成员）函数更为自然。在本节中，我们将讨论将非成员函数定义为对象操作的技术。我们从一个简单的示例开始。\n\
  \n# 编程示例：相等函数\n\n在第 10 章中，我们开发了一个名为 `DayOfYear` 的类，用于记录日期，例如 1 月 1 日或 7 月 4 日，这些可能是节日、生日或其他年度活动。我们提供了该类的逐步改进版本。最终版本出现在第\
  \ 10 章的自测 2 中。我们重复了该类的最终版本，并通过添加一个可以测试两个 `DayOfYear` 对象是否代表相同日期的 `equal` 函数进一步增强了类。![插图显示代码段](img/p23-1)\n\
  \n***示例***\n\n```\n 输入今天的日期：\n 输入月份：3\n 输入日期：21\n 今天的日期是 3, 21\n 巴赫的生日是 3, 21\n\
  \ 生日快乐！\n```\n\n# 显示 11.1\n\n图 11.1\n\n假设 `today` 和 `bachBirthday` 是两个已赋值的 `DayOfYear`\
  \ 对象。你可以通过以下表达式测试它们是否代表相同日期：\n\n```\nequal(today, bachBirthday)\n```\n\n此 `equal`\
  \ 函数的调用在 `today` 和 `bachBirthday` 代表相同日期时返回 `true`。在显示 11.1 中，此布尔表达式用于控制 `if-else`\
  \ 语句。\n\n`equal` 函数的定义非常直观。如果两个日期代表相同的月份和日期，则它们相等。`equal` 的定义使用访问函数 `getMonth` 和\
  \ `getDay` 来比较两个对象代表的月份和日期。\n\n注意我们没有将 `equal` 函数制作成员函数。可以将 `equal` 作为 `DayOfYear`\
  \ 类的成员函数，但 `equal` 比较的是*两个* `DayOfYear` 对象。如果你将 `equal` 是成员函数，你必须决定调用对象应该是第一个日期还是第二个日期。与其随机选择其中一个日期作为调用对象，我们让\
  \ `equal` 成为接收两个日期作为参数的普通（非成员）函数。\n\n### 自测练习\n\n1.  编写函数 `before` 的函数定义，该函数接收两个\
  \ `DayOfYear` 类型的参数（该类型定义在显示 11.1 中）。该函数返回一个 `bool` 值，如果第一个参数代表的日期在第二个参数所代表的日期之前，则返回\
  \ `true`；否则函数返回 `false`；例如，1 月 5 日在 2 月 2 日之前。\n\n\n\n\n\n如果你的类拥有一套完整的访问函数（accessor\
  \ functions），你就可以使用这些访问函数来定义一个测试相等性的函数，或者执行任何依赖于私有成员变量的计算。然而，尽管这可能让你访问私有成员变量，但它可能无法让你高效地访问它们。再次查看显示\
  \ 11.1 中给出的 `equal` 函数定义。为了读取月份，它必须调用访问函数 `getMonth`。为了读取日期，它必须调用访问函数 `getDay`。这种方法行得通，但如果我们可以直接访问成员变量，代码将会更加简单且高效。\n\
  \n在显示 11.1 中给出的更简单且高效的 `equal` 函数定义如下：\n\n```\nbool equal(DayOfYear date1, DayOfYear\
  \ date2)\n{\n    return (date1.month == date2.month &&\n            date1.day ==\
  \ date2.day);\n}\n```\n\n这种定义仅仅有一个问题：它是非法的！它之所以非法，是因为成员变量 `month` 和 `day` 是 `DayOfYear`\
  \ 类的私有成员。通常情况下，私有成员变量（以及私有成员函数）不能在函数体内引用，除非该函数是成员函数，而 `equal`并不是 `DayOfYear` 类的成员函数。但有一种方法可以赋予非成员函数拥有与成员函数相同的访问权限。如果我们将函数\
  \ `equal` 成为 `DayOfYear` 类的 `friend`（友元），那么之前的 `equal` 定义就是合法的。\n\n类的**友元函数**（friend\
  \ function）不是类的成员函数，但友元函数像成员函数一样拥有该类的私有成员。友元函数可以直接读取成员变量的值，甚至可以直接修改成员变量的值，例如使用带有赋值运算符一侧为私有成员变量的赋值语句。要使一个函数成为友元函数，你必须在类定义中将其声明为友元。例如，在显示\
  \ 11.2 中，我们重写了 `DayOfYear` 类的定义，使得函数 `equal` 是该类的友元。通过在类的定义中列出函数声明并在函数声明前放置 `friend`\
  \ 关键字，即可使一个函数成为类的友元。\n\n![插图显示了“作为友元的相等性函数”的代码段](img/p627-1.png)\n\n# 显示 11.2 作为友元的相等性函数\n\
  \n图 11.2 完整替代文本\n\n通过列出其函数声明，可以将友元函数添加到类定义中，这就像列出成员函数的声明一样，只不过要在函数声明前加上 `friend`\
  \ 关键字。然而，友元并不是成员函数；相反，它实际上是一个对类成员具有非凡访问权限的普通函数。友元的定义和调用方式与其所属的普通函数完全相同。特别是，显示 11.2\
  \ 中所示的 `equal` 函数定义头头没有包含限定符 `DayOfYear::`。此外，`equal` 函数不是通过点运算符来调用的。`equal` 函数接受\
  \ `DayOfYear` 类型的对象作为参数的方式与任何其他非成员函数接受任何类型参数的方式相同。然而，友元函数的定义可以通过名称访问类的私有成员变量和私有成员函数，因此它具有与成员函数相同的访问权限。\n\
  \n# 编程提示：同时定义访问函数和友元函数\n\n看起来似乎，如果你将所有基础函数都设为类的友元，那么就不需要在类中包含访问函数和修改函数（mutator functions）了。毕竟，友元函数可以访问私有成员变量，因此不需要访问或修改函数。这种说法并不完全错误。如果真的把世界上所有的函数都变成类的友元，你确实不需要访问或修改函数。然而，将所有函数都变成友元是不现实的。\n\
  \n为了理解为什么仍然需要访问函数，请考虑显示 11.2 中给出的 `DayOfYear` 类示例。你可能会在另一个程序中使用类，该程序可能非常想计算剩余月份。具体来说，`main`\
  \ 函数可能包含：\n\n```\nDayOfYear today;\ncout << \"enter date: \";\ncout << \"There are\
  \ \" << today.getMonth() << \" months left.\\n\";\n```\n\n你不能使用 `today.month`，因为\
  \ `month` 是私有的。你需要访问函数 `getMonth()`。注意，你可以将 `equal` 函数定义为友元（如显示 11.2），也可以不作为友元而使用访问函数（如显示\
  \ 11.1）。大多数情况下，将函数变为友元的唯一理由是为了使定义更简单高效；但有时，这就足够了。\n\n# 编程提示：同时使用成员函数和非成员函数\n\n成员函数和友元函数的作用非常相似。事实上，有时并不清楚应该将某个特定函数设为类的友元还是类的成员函数。在大多数情况下，你可以将一个函数设为成员函数或友元来执行相同的任务。然而，在某些地方使用成员函数更好，而在某些地方使用友元函数更好（甚至是使用非友元的普通函数，如显示\
  \ 11.1 中的 `equal` 版本）。帮助你在成员函数和非成员函数之间决简单规则如下：\n\n-   如果函数执行的任务仅涉及一个对象，则使用成员函数。\n\
  -   如果执行的任务涉及多个对象，则使用非成员函数。例如，显示 11.1 和显示 11.2 中的 `equal` 函数涉及两个对象，因此我们将其设为非成员（友元）函数。\n\
  \n将非成员函数变为友元函数还是使用访问和修改函数，取决于效率和个人喜好。只要你有足够的访问函数和修改函数，任何方法都行得通。\n\n\n\n\n\n选择使用成员函数还是非成员函数并不总是上述两条规则那么简单。随着经验的增加，你会发现在某些情况下违反这些规则是有价值的。一个更准确但难以理解的规则是：如果任务与单个对象密切相关，则使用成员函数；如果任务涉及多个对象且这些对象是对称使用的，则使用非成员函数。然而，这个更准确的规则并非一成不变，在你处理对象变得更加熟练之前，上述两个简单规则将是你可靠的指南。\n\
  \n## 编程示例：Money 类（版本 1）\n\n`Display 11.3` 包含一个名为 `Money` 的类的定义，该类代表美国货币的金额。该值实现为一个单一整数，代表转换为分（pennies）后的金额。例如，$9.95\
  \ 将被存储为值 `995`。由于我们使用整数来表示金额，因此金额是以精确数量表示的。我们没有使用 `double` 类型的值，因为 `double` 类型的值被存储为近似值，而我们希望货币金额是精确的数值。\n\
  \n```\n1    // 演示 Money 类的程序。\n2    #include <iostream>\n3    #include <cstdlib>\n\
  4    #include <cctype>\n5    using namespace std;\n6    // 用于美国货币金额的类。\n7    class\
  \ Money\n8    {\n9    public:\n10        friend Money add(Money amount1, Money amount2);\n\
  11        // 前提条件：amount1 和 amount2 已赋值。\n12        // 返回 amount1 和 amount2 值的和。\n\
  13        friend bool equal(Money amount1, Money amount2);\n14        // 前提条件：amount1\
  \ 和 amount2 已赋值。\n15        // 如果 amount1 和 amount2 的值相同则返回 true；\n16        //\
  \ 否则，返回 false。\n17        Money(long dollars, int cents);\n18        // 初始化对象，使其值表示由参数给定的美元和\n\
  19        // 分。如果金额为负数，则\n20          // 美元和分都必须是负数。\n21        Money(long dollars);\n\
  22        // 初始化对象，使其值表示 $dollars.00。\n23        Money( );\n24        // 初始化对象，使其值表示\
  \ $0.00。\n25        double getValue( );\n26        // 前提条件：调用对象已赋值。\n27        //\
  \ 返回调用对象数据中记录的金额。\n28        void input(istream& ins);\n29        // 前提条件：如果 ins\
  \ 是文件输入流，则 ins 已经\n30        // 连接到文件。输入流 ins 中输入了一个包含美元符号的金额。\n31        // 负金额的表示法为\
  \ −$100.00。\n32        // 后置条件：调用对象的值设置为\n33        // 从输入流 ins 读取的金额。\n34     \
  \   void output(ostream& outs);\n35        // 前提条件：如果 outs 是文件输出流，则 outs 已经\n36\
  \        // 连接到文件。\n37        // 后置条件：美元符号和调用对象记录的\n38        // 金额已发送到输出流 outs。\n\
  39    private:\n40        long allCents;\n41    };\n42    int digitToInt(char c);\n\
  43    // 用于 Money::input 定义中函数的函数声明：\n44    // 前提条件：c 是 '0' 到 '9' 的数字之一。\n45   \
  \ // 返回该数字对应的整数；例如，digitToInt ('3') 返回 3。\n46    int main( )\n47    {\n48      \
  \  Money yourAmount, myAmount(10, 9), ourAmount;\n49        cout << \"Enter an amount\
  \ of money: \";\n50        yourAmount.input(cin);\n51        cout << \"Your amount\
  \ is \";\n52        yourAmount.output(cout);\n53        cout << endl;\n54      \
  \  cout << \"My amount is \";\n55        myAmount.output(cout);\n56        cout\
  \ << endl;\n57        if (equal(yourAmount, myAmount))\n58            cout << \"\
  We have the same amounts.\\n\";\n59        else\n60            cout << \"One of\
  \ us is richer.\\n\";\n61        ourAmount = add(yourAmount, myAmount);\n62    \
  \    yourAmount.output(cout);\n63        cout << \" + \";\n64        myAmount.output(cout);\n\
  65        cout << \" equals \";\n66        ourAmount.output(cout);\n67        cout\
  \ << endl;\n68        return 0;\n69    }\n70    Money add(Money amount1, Money amount2)\n\
  71    {\n72        Money temp;\n73        \n74        temp.allCents = amount1.allCents\
  \ + amount2.allCents;\n75        return temp;\n76    }\n77    \n78    bool equal(Money\
  \ amount1, Money amount2)\n79    {\n80        return (amount1.allCents == amount2.allCents);\n\
  81    }\n82    \n83    Money(long dollars, int cents)\n84    {\n85        allCents\
  \ = dollars * 100 + cents;\n86    }\n87    \n88    Money(long dollars)\n89    {\n\
  90        allCents = dollars * 100;\n91    }\n92    \n93    Money( )\n94    {\n\
  95        allCents = 0;\n96    }\n97    \n98    double getValue( )\n99    {\n100\
  \       return allCents / 100.0;\n101   }\n102   \n103   void input(istream& ins)\n\
  104   {\n105       char oneChar, decimalPoint, digit1, digit2;\n106       bool negative;\n\
  107       \n108       ins >> oneChar;\n109       if (oneChar == '$')\n110      \
  \     negative = false;\n111           ins >> digit1 >> decimalPoint >> digit2;\n\
  112       else if\n113           (oneChar == '−')\n114           negative = true;\n\
  115           ins >> digit1 >> decimalPoint >> digit2;\n116       else\n117    \
  \   {\n118           cout << \"Error money input\\n\";\n119           exit(1);\n\
  120       }\n121       \n122       if (oneChar != '$' || decimalPoint != '.'\n123\
  \           || !isdigit(digit1) || !isdigit(digit2))\n124       {\n125         \
  \  cout << \"Error for money input\\n\";\n126           exit(1);\n127       }\n\
  128       \n129       allCents = digitToInt(digit1) * 10 + digitToInt(digit2);\n\
  130       if (negative)\n131           allCents = −allCents;\n132   }\n133   \n\
  134   void output(ostream& outs)\n135   {\n136       long positiveCents, dollars,\
  \ cents;\n137       positiveCents = abs(allCents);\n138       dollars = positiveCents\
  \ / 100;\n139       cents = positiveCents % 100;\n140       \n141       if (allCents\
  \ < 0)\n142           outs << \"−$\" << dollars << '.';\n143       else\n144   \
  \        outs << \"$\" << dollars << '.';\n145       \n146       if (cents < 10)\n\
  147           outs << '0';\n148       outs << cents;\n149   }\n150   \n151   int\
  \ digitToInt(char c)\n152   {\n153       return (static_cast<int>(c) − static_cast<int>('0'));\n\
  154   }\n```\n\n\n\n\n这个表示金额（以所有分为单位）的整数存储在名为 `allCents` 的成员变量中。我们可以使用 `int` 类型作为成员变量\
  \ `allCents` 的类型，但在某些编译器中，这会严重限制我们能够表示的金额范围。在 C++ 的某些实现中，`int` 类型仅使用 2 字节来存储。这种\
  \ 2 字节实现的结果是，`int` 类型的最大值仅略大于 `32000`，而 `32000` 分仅代表 320 美元，这是一笔很小的金额。由于我们可能需要处理比\
  \ 320 美元大多的金额，因此我们使用 `long` 作为成员变量 `allCents` 的类型。以 2 字节实现 `int` 类型的 C++ 编译器通常将\
  \ `long` 类型实现为 4 字节。`long` 类型的值与 `int` 类型的值一样都是整数，不同之处 4 字节的 `long` 实现使得 `long`\
  \ 类型的最大允许值远大于 `int` 类型的最大允许值。在大多数系统上，`long` 类型的最大允许值是 20 亿或更大。（`long` 类型也被称为 `long\
  \ int`。这两个名称 `long` 和 `long int` 指向同一种类型。）\n\n`Money` 类有两个友元函数操作：`equal` 和 `add`（它们定义在\
  \ Display 11.3）。`add` 函数返回一个 `Money` 对象，其值是两个参数值之和。形如 `equal(amount1, amount2)`\
  \ 的函数调用，如果两个对象 `amount1` 和 `amount2` 的值代表相等的金额，则返回 `true`。\n\n注意，`Money` 类读写金额的方式我们我们读写金额的方式，例如\
  \ $9.95 或 –$9.95。首先，考虑成员函数 `input`（同样定义在 Display 11.3）。该函数首先读取一个字符，该字符应该是美元符号（`$`）或负号（`−`）。如果第一个字符是负号，则函数通过将变量\
  \ `negative` 的值设置为 `true` 来记住该金额是负数。然后它再读取额外的字符，该字符应该是美元符号。相反，如果第一个符号不是 `'−'`，则将\
  \ `negative` 设置为 `false`。此时，负号（如果有）和美元符号已经读取。函数 `input` 然后以 `long` 类型的值读取美元数，并将美元数放在名为\
  \ `dollars` 的局部变量中。在读取完输入的美元部分后，`input` 函数将输入的剩余部分作为 `char` 类型的值进行读取；它读取了三个字符，这三个字符应该是一个小数点两个数字。\n\
  \n（你可能想定义成员函数 `input`，使其将小数点作为 `char` 类型的值读取，然后将分数作为 `int` 类型的值读取。之所以不这样做是因为某些 C++\
  \ 编译器处理前导零的方式。正如标题为“数字常量中的前导零”的陷阱部分所解释，许多仍在使用的编译器不会按照你希望的方式读取带有前导零的数字，因此如果你的 C++\
  \ 代码将 `09` 读取为 `int` 类型的值，像 `$7.09` 的金额可能会被错误读取）。\n\n下面的赋值语句将组成输入金额部分的两个数字转换为单个整数，存储在局部变量\
  \ `cents` 中：\n\n```\ncents = digitToInt(digit1) * 10 + digitToInt(digit2);\n```\n\
  \n执行此赋值语句后，`cents` 的值就是输入金额中的分数。\n\n辅助函数 `digitToInt` 接收一个数字作为参数（例如 `'3'`），并将其转换为对应的\
  \ `int` 值（例如 `3`）。我们需要这个辅助函数是因为成员函数 `input` 以两个 `char` 类型的值读取代表分数的两个数字，这些值存储在局部变量\
  \ `digit1` 和 `digit2` 中。然而，一旦数字被读入计算机，我们就希望将它们作为数字使用。因此，我们使用函数 `digitToInt` 将数字如\
  \ `'3'` 转换为数字如 `3`。`digitToInt` 函数的定义在 Display 11.3\n\n\n\n成员函数 `output` 根据成员变量\
  \ `allCents` 的值计算美元数和分位数。它通过对 100 进行整除来计算美元数和分位数。例如，如果 `allCents` 的值为 `995`，则美元数为\
  \ `995/100`（即 `9`），分数为 `995%100`（即 `95`）。因此，当 `allCents` 的值为 `995` 时，输出为 `$9.95`。\n\
  \n成员函数 `output` 的定义需要为输出负金额做特殊处理。负数的整数除法没有标准定义，并且会随实现而异。为了避免这个问题，我们在执行除法之前取了 `allCents`\
  \ 的绝对值。为了计算绝对值，我们使用了预定义函数 `labs`。`labs` 返回其参数的绝对值，就像 `abs` 函数一样，但 `labs` 取 `long`\
  \ 类型参数并返回 `long` 类型的值。`labs` 函数位于头文件 `cstdlib` 库中，就像 `abs` 函数一样。\n\n下面的赋值语句正确设置了\
  \ `allCents`：\n\n```\nallCents = dollars * 100 + cents;\n```\n\n如果金额为负，必须将 `allCents`\
  \ 的值从正变为负。通过以下语句实现：\n\n```\nif (negative)\n    allCents = −allCents;\n```\n\n# `digitToInt`\
  \ 的实现（可选）\n\nDisplay 11.3 中的 `digitToInt` 函数定义在此重现：\n\n```cpp\nint digitToInt(char\
  \ c)\n{     return (static_cast<int>(c) − static_cast<int>('0'));\n}\n```\n\n\n\n\
  \n乍看之下，返回值的公式可能看起来有点奇怪，但细节并不太复杂。要转换的数字——例如 `'3'`——是参数 `c`，而返回的值将是对应的 `int` 值——在本例中，为\
  \ `3`。正如我们在第 2 章和第 6 章中指出的，`char` 类型的值是以数字形式实现的。遗憾的是，实现数字 `'3'` 的数字并不是 `3`。类型转换\
  \ `static_cast<int>(c)` 产生实现字符 `c` 的数字，并将该数字转换为 `int` 类型。这把 `c` 从 `char` 类型变为 `int`\
  \ 类型的数字，但遗憾的是，它并不是我们想要的数字。例如，`static_cast<int>('3')` 不是 `3`，而是另一个数字。我们需要将 `static_cast<int>(c)`\
  \ 转换为与 `c` 对应的数字（例如，将 `'3'` 转换为 `3`）。因此，让我们看看如何调整 `static_cast<int>(c)` 以得到我们想要的数字。\n\
  \n我们知道数字是有序的。因此 `static_cast<int>('0') + 1` 等于 `static_cast<int>('1')`；`static_cast<int>('1')\
  \ + 1` 等于 `static_cast<int>('2')`；`static_cast<int>('2') + 1` 等于 `static_cast<int>('3')`，依此类推。知道数字按这种顺序排列就是我们判断\
  \ `digitToInt` 返回正确值所需的全部知识。如果 `c` 是 `'0'`，返回的值为：\n\n```\nstatic_cast<int>(c) −\
  \ static_cast<int>('0')\n```\n\n结果为：\n\n```\nstatic_cast<int>('0') – static_cast<int>('0')\n\
  ```\n\n所以 `digitToInt('0')` 返回 `0`。\n\n现在让我们考虑当 `c` 的值为 `'1'` 时发生了什么。返回的值是 `static_cast<int>(c)\
  \ - static_cast<int>('0')`，即 `static_cast<int>('1') - static_cast<int>('0')`。它等于\
  \ `(static_cast<int>('0') + 1) - static_cast<int>('0')`，而这又等于 `static_cast<int>('0')\
