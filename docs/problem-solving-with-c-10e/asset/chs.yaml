  \ 关键字代表了什么？\n\n# 11.2 重载运算符\n\n数学是给不同的事物赋予相同的名称。\n\n在本章早些时候，我们展示了如何让 `add` 函数成为\
  \ `Money` 类的友元，并使用它来两个 `Money` 类型的对象（参见 显示 11.3）。`add` 函数对于相加是足够的，但如果可以直接使用标准的 `+`\
  \ 运算符来相加 `Money` 类型的值会更好，如下代码最后一行所示：\n\n```cpp\nMoney total, tax;\ncout << \"Enter\
  \ cost and tax: \";\ncost.input(cin);\ntax.input(cin);\ntotal = cost + tax;\n```\n\
  \n而不是使用稍微笨拙的\n\n```cpp\ntotal = add(cost, tax);\n```\n\n记住，运算符（如 `+`）实际上只是函数，只是用法与普通函数不同。在普通函数调用中，参数放在函数名的括号内，例如\n\
  \n```add(cost, tax)\n```\n\n对于二元运算符，参数放在运算符的两侧，如下所示：\n\n```cost + tax\n```\n\n函数可以重载以接受不同类型的参数。运算符也是函数，因此运算符也可以重载。重载运算符（如\
  \ `+`）的方法与重载函数的方法基本相同。在本节中，我们将展示如何重载运算符。\n\n# 重载运算符\n\n你可以重载运算符 `+`（以及许多其他运算符），使其接受类类型的参数。重载\
