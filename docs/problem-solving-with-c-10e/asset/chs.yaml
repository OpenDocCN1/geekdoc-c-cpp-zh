  \ 的类型均为 `int`。\n\n24. 编写一个 `if-else` 语句：如果变量 `temperature` 的值大于或等于 `100`、变量 `pressure`\
  \ 的值大于或等于 `200` 或两者均是，输出单词 `Warning`。否则，`if-else` 语句输出单词 `OK`。变量 `temperature` 和\
  \ `pressure` 的类型均为 `int`。\n\n25. 考虑一个二次表达式，例如\n\n```\nx2 − x − 2\n```\n\n描述该二次表达式何为正（即大于\
  \ 0），涉及到描述一组数字，这些数字要么小于较小的根（`−1`），要么大于较大的根（`+2`）。请编写一个 C++ 布尔表达式，当该公式具有正值时该表达式为真。\n\
  \n26. 考虑二次表达式\n\n```\nx2 − 4x + 3\n```\n\n描述该二次表达式何为负，涉及到描述一组数字，这些数字同时大于较小的根（`+1`）且小于较大的根（`+3`）。请编写一个\
  \ C++ 布尔表达式，当该二次表达式的值为负时该表达式为真。\n\n27. 嵌入这些 `if-else` 语句中的 `cout` 语句的输出是什么？请假设这些语句嵌入在一个完整正确的程序中。解释你的答案。\n\
  \n1. ```cpp\nif (0)\n      cout << \"0 is true\";\n    else\n      cout << \"0 is\
  \ false\";\n    cout << endl;\n```\n\n2. ```cpp\nif (1)\n      cout << \"1 is true\"\
  ;\n    else\n      cout << \"1 is false\";\n    cout << endl;\n```\n\n3. ```cpp\n\
  if (−1)\n      cout << \"−1 is true\";\n    else\n      cout << \"−1 is false\"\
  ;\n    cout << endl;\n```\n\n注意：这仅为练习。这并不是说明你应当遵循的编程风格。\n\n### 简单循环机制\n\n大多数程序都包含某些重复若干次的操作。例如，显示\
  \ 2.8 中的程序计算工人的总工资。如果公司雇用了 100 名工人，那么一个完整的薪资程序将重复此计算 100 次。程序中重复语句或一组语句的部分被称为**循环**。C++\
  \ 语言有多种创建循环的方法。其中一种结构被称为 `while` 语句或 `while` 循环。我们将首先通过一个短的示例来说明它的用法，然后给出一个更真实的示例。\n\
  \n显示 2.12 中的程序包含一个用颜色标出的简单 `while` 语句。大括号 `{` 和 `}` 之间的部分被称为 `while` 循环的**体**；它是被重复的操作。大括号内部语句按顺序执行，然后再次执行、再次执行，直到\
  \ `while` 循环结束。在第一个示例对话中，循环体在循环结束前执行了三次，因此程序输出了三次 `Hello`。循环体的每次重复被称为一次迭代。\n\n###\
  \ 示例 `while` 循环示例\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\
  \ {\n    int countDown;\n    cout << \"How many greetings? \";\n    cin >> countDown;\n\
  \    while (countDown > 0) {\n        cout << \"Hello \";\n        countDown = countDown\
  \ - 1;\n    }\n    cout << endl;\n    return 0;\n}\n```\n\n如果用户输入 `3`，上述程序的输出将是：\n\
  \n```\nHow many greetings? 3\nHello Hello Hello\n```\n\n\n\n让我们详细了解一下 `while` 语句所执行的操作。当\
  \ `while` 语句执行时，首先发生的情况是检查 `while` 关键字后面的布尔表达式。它的结果为真或为假。例如，比较运算：\n\n```\ncountDown\
  \ > 0\n```\n\n如果 `countDown` 的值为正数，则该比较为真。如果为假，则不采取任何操作，程序将继续执行 `while` 语句之后的下一个语句。如果比较为真，则将执行整个循环体。被比较的表达式中通常至少有一个包含可能会被循环体更改的内容，例如显示\
  \ 2.12 中 `while` 语句中 `countDown` 的值。在执行循环体之后，会再次检查该比较。只要比较一直为真，这个过程就会反复进行。在循环体的每次迭代后，都会再次检查该比较，如果为真，则再次执行整个循环体。当比较不再为真时，`while`\
  \ 语句结束。\n\n`while` 语句执行时首先发生的情况是检查布尔表达式。如果当 `while` 语句开始时布尔表达式为假，则循环体将永远不会执行。这正是显示\
  \ 2.12 中“示例对话 3”中发生的情况。在许多编程场景中，你可能希望循环体有零次执行。例如，如果你的 `while` 循环正在读取一个包含考试中所有不及格分的列表，而没有人不及格，那么你就希望循环体执行零次。\n\
  \n正如我们刚刚注意到的，`while` 循环可能会执行零次循环体，这通常是你想要的。反相反，如果你知道在*所有情况下*你的循环体都应该至少执行一次，那么你可以使用\
  \ `do-while` 语句。`do-while` 语句与 `while` 语句类似，但循环体始终至少执行一次。`do-while` 语句的语法见显示 2.14。一个带有示例\
  \ `do-while` 循环的程序见显示 2.15。在那个 `do-while` 循环中，与任何 `do-while` 循环一样，首先发生的情况是执行循环体中的语句。在循环体的第一次迭代之后，`do-while`\
  \ 语句的行为与 `while` 循环相同。检查布尔表达式。如果布尔表达式为真，则再次执行循环体；再次检查布尔表达式，以此此类推。\n\n![插图展示了“do-while”循环的代码段。](img/p87-1.png)\n\
