  \ `%` 运算符来实现此函数。）\n\n### 5. 在冷天气下，气象学家报告了一种名为风寒指数（windchill factor）的指数，它考虑了风速和温度。该指数衡量特定空气温度下风带来的寒冷效应。风寒指数可以通过公式近似计算：\n\
  \n$W = 13.12 + 0.6215*t - 11.37*v^{(0.16)} + 0.3965*t^{(0.016)}$\n\n其中：\n\n* `v`\
  \ = 风速，单位为米/秒\n* `t` = 温度，单位为摄度：`t` <= 10\n* `W` = 风寒指数（单位为摄度）\n\n编写一个返回风寒指数的函数。你的代码应确保不违反温度限制。在你大学图书馆的旧报纸中查找一些天气预报，并将你计算的风寒指数与报纸报道的结果进行比较。\n\
  \n### 6. 在 Puzzlevania 土地，Aaron、Bob 和 Charlie 就就谁是世界上最伟大的解谜高手发生了争论。为了一劳永逸地解决争论，他们同意进行生死决斗。Aaron\
  \ 的射击水平很差，命中目标的概率只有 1/3。Bob 稍微好一点，命中目标的概率为 1/2。Charlie 是一位顶尖射击手，从不失手。命中意味着击杀，被击中的人将退出决斗。\n\
  \n为了补偿他们射击技巧上的不公平，决定参赛者轮流射击，从 Aaron 开始，然后是 Bob，最后是 Charlie。该循环将一直持续直到只剩一个人。那个人将被视为世界上最伟大的解谜高手。\n\
  \n1.  编写一个函数模拟单次射击。它应该使用以下声明：\n\n    ```\n    void shoot(bool& targetAlive, double\
  \ accuracy);\n    ```\n\n    该函数通过生成一个 0 到 1 之间的随机数，模拟以给定精度向 `targetAlive` 射击。如果随机数小于\
  \ `accuracy`，则目标被命中，且 `targetAlive` 应被设置为 `false`。第 4 章说明了如何生成随机数。\n\n    例如，如果\
  \ Bob 向 Charlie 射击，可以这样调用：\n\n    ```\n    shoot(charlieAlive, 0.5);\n    ```\n\n\
  \    这里，`charlieAlive` 是一个布尔变量，指示 Charlie 是否存活。在继续步骤 b 之前，使用驱动程序测试你的函数。\n\n2.  一个显而易见的策略是每个人都射向场上存活的精度最高的射击手，理由是这个射击手最致命且反击概率最高。编写第二个名为\
  \ `startDuel` 的函数，它使用 `shoot` 函数根据该策略模拟整个决斗。它应该循环，直到只剩一名参赛者，并根据射击者的身份使用正确的目标和命中概率调用\
  \ `shoot` 函数。该函数应返回一个指示决斗获胜者的变量。\n\n3.  在你的主函数中，循环调用 `startDuel` 函数 1000 次，记录每个参赛者获胜的次数。输出当每个人使用射向剩余存活精度最高射击手的策略时，每个参赛者胜的概率。\n\
  \n4.  一种反直觉的策略是让 Aaron 在第一射故意射偏。之后，每个人都使用射向剩余存活精度最高射击手的策略。这种策略意味着 Aaron 保证活过第一轮，因为\
  \ Bob 和 Charlie 会互相射击。修改程序以适应这一新策略，并输出每个参赛者的胜率。\n\n### 7. 编写一个程序，输入日期（例如 2008 年\
  \ 7 月 4 日）并输出该日期对应的星期。以下算法来自 [`en.wikipedia.org/wiki/Calculating_the_day_of_the_week`](http://en.wikipedia.org/wiki/Calculating_the_day_of_the_week)。实现将需要几个函数。\n\
  \n    ```\n    bool isLeapYear(int year);\n    ```\n\n    如果 `year` 是闰年，该函数应返回 `true`，否则返回\
