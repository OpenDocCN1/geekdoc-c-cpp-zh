  \n# 12 独立编译与命名空间\n\n> 你的“if”是唯一的\n\nWILLIAM As Like It\n\n## 引言\n\n本章涵盖了关于如何将 C++\
  \ 程序组织成独立部分的两个主题。12.1 独立编译讨论了如何将 C++ 程序分布在多个文件中，以便当程序的某些发生变化时，只需要重新编译这些部分。独立部分也可以更容易地重用于其他应用程序。\n\
  \n12.2 讨论了命名空间，我们在第 2 章中简要介绍过命名空间。命名空间是一种通过限定名称来重用类、函数和其他项名称的方法。命名空间将代码划若干部分，以便不同部分可以使用具有不同含义的名称。命名空间为名称提供了比局部变量更通用的局部含义。\n\
  \n### 前提条件\n\n本章使用了第 2 章到第 6 章的材料，以及第 10 章到第 11 章的材料。\n\n\n\nC++ 提供了将程序划分为若干部分的机制，这些部分存储在单独的文件中，分别编译，并在程序运行时（或在运行之前）将它们链接在一起。你可以将类的定义（及其相关的函数定义）放置在与使用该类的程序分开的文件中。这样你就可以构建一个类库，使得许多程序可以使用同一个类。你可以只编译一次类，然后在许多不同的程序中使用它，就像你使用预定义库（例如带有头文件\
  \ `iostream` 和 `cstdlib` 的库）一样。此外，你可以在两个文件中定义类本身，这样类的功能规范就与类的实现方式分开了。如果你的类是按照我们为你提供的指南进行定义的，并且你只修改了类的实现部分，那么你只需要重新编译包含类实现的文件即可。其他文件（包括使用该类的程序文件）不需要更改，甚至不需要重新编译。在本节中，我们将告诉该如何执行这种类的类的独立编译。\n\
  \n# 复习 ADT\n\n回想一下，ADT（抽象数据类型）是一个经过定义的类，其目的是将类的接口和实现分离。你所有的类定义都应该是 ADT。为了定义一个类使其成为\
  \ ADT，你需要将程序员如何使用该类的规范与类如何实现的细节分离开。这种分离应该是完全的，以至于你可以在更改实现，而无需以任何方式更改任何使用该类的程序。确保这种分离的方法可以总结为三条规则：\n\
  \n1. 将所有成员变量设为类的私有（private）成员。\n2. 将 ADT（类）的每个基本操作设置为类的公有成员函数、友元函数、普通函数或重载运算符。将类定义以及函数和运算符的声明放在一起。这组内容同其随附的注释被称为\
  \ ADT 的 `interface`（接口）。在类或函数/运算符声明随附的注释中，详细说明如何使用每个此类函数或运算符。\n3. 使使用抽象数据类型的程序员无法访问基本操作的实现。`implementation`（实现）由函数定义和重载运算符定义（以及这些定义所需的任何辅助函数或其他额外条目）组成。\n\
  \n在 C++ 中，确保你遵循这些规则的最佳方法是将 ADT 类的接口和实现放在不同的文件中。正如你可能猜到的那样，包含接口的文件通常称为 `interface\
  \ file`（接口文件），而包含实现的文件称为 `implementation file`（实现文件）。如何设置、编译和使用这些文件的具体细节在不同 C++\
  \ 版本之间略有不同，但所有 C++ 版本的的基本方案是相同的。特别是，文件中包含的内容在所有系统中都是相同的。唯一变化的是你用于编译和链接这些文件所需的命令。关于文件中包含内容的细节将在下一个案例研究中阐明。\n\
  \nADT 类具有私有成员变量。私有成员变量（以及私有函数）对我们“将 ADT 的接口和实现放在单独文件中”的基本哲学思想提出了一个问题。ADT 类定义中的公有部分是\
  \ ADT 接口的一部分，但私有部分是实现的一部分。这是一个问题，因为 C++ 不允许你将类定义跨越两个文件拆分。因此，需要某种妥协。唯一明智的妥协方案，也是我们所采用的方案，是将整个类定义放置在接口文件中。由于使用\
  \ ADT 类的程序员无法使用类的任何私有成员，因此私有成员在实际上仍然对程序员隐藏了。\n\n# 案例研究 `DigitalTime` — 一个独立编译的类\n\
  \n[Display 12.1] 包含了名为 `DigitalTime` 的 ADT 类的接口文件。`DigitalTime` 是一个其值为一天中时间的类，例如\
  \ 9:30。只有类的公有成员才是接口的一部分。私有成员是实现的一部分，尽管它们在接口文件中。标签 `private`： 警告你这些私有成员不是公有接口的一部分。程序员为了使用\
  \ ADT `DigitalTime` 所需要知道的所有信息，都在文件开头的注释以及类定义中公有部分的注释中进行了解释。此接口告诉程序员如何使用名为 `advance`\
  \ 的两个版本的成员函数、构造函数，以及重载的运算符 `=`、`>>` 和 `<<`。名为 `advance` 的成员函数、重载运算符和赋值语句是程序员操作该类对象和值的唯一方式。正如接口文件顶部的注释所示，此\
  \ ADT 类使用 24 小时制，因此，下午 1:30 的输入和输出均为 13:30。为了有效使用 `DigitalTime` 类而必须知道的这些以及其他细节都包含在成员函数随附的注释中。\n\
  \n![图像显示了“DigitalTime 接口文件”的代码段。](img/p709-1.png)\n\n# 显示 12.1 `DigitalTime` 的接口文件\n\
  \n[Figure 12.1]\n\n我们将接口放在了一个名为 `dtime.h` 的文件中。后缀 .h 表示这是一个头文件。接口文件始终是头文件，因此始终以后缀\
  \ .h 结尾。任何使用 `DigitalTime` 类的程序必须包含一个类似下面的包含指令，该指令指定了此文件：\n\n```cpp\n#include \"\
  dtime.h\"\n```\n\n当你编写包含指令时，必须指示该头文件是为你提供的预定义头文件，还是你编写的头文件。如果头文件是预定义的，请用尖括号括头文件文件名，例如\
  \ `<iostream>`。如果头文件是你编写的，请用引号括头文件文件名，例如 `\"dtime.h\"`。这种区别告诉编译器去哪里查找头文件。如果头文件文件名在尖括号中，编译器将在你的\
  \ C++ 实现中预定义头文件所在的地方查找。如果头文件文件名在引号中，编译器将在当前目录或你系统中存储程序员定义头文件的地方查找。\n\n\n\n\n\n任何使用我们\
  \ `DigitalTime` 类的程序都必须包含之前命名头文件 `dtime.h` 的 `include` 指令。这足以允许你编译程序，但不足以允许你运行程序。为了运行程序，你必须编写（并编译）成员函数和重载运算符的定义。我们将这些函数和运算符定义放在另一个文件中，称为“实现文件”（implementation\
  \ file）。虽然大多数编译器并没有强制要求，但传统的做法是给接口文件和实现文件赋予相同的名称。然而，这两个文件的后缀名是不同的。我们将 ADT 类的接口放在命名为\
  \ `dtime.h` 的文件中，将该 ADT 类的实现放在命名为 `dtime.cpp` 的文件中。你为实现文件使用的后缀取决于你使用的 C++ 版本。请为实现文件使用你通常用于包含\
  \ C++ 程序的文件的相同后缀。如果你的程序文件以 `.cxx` 结尾，那么你就使用 `.cxx` 代替 `.cpp`。如果你的程序文件以 `.CPP` 结尾，那么你的实现文件也将以\
  \ `.CPP` 而不是 `.cpp` 结尾。我们使用 `.cpp` 是因为大多数编译器都接受 `.cpp` 作为 C++ 源文件文件的后缀。我们 `DigitalTime`\
  \ ADT 类的实现文件见 [显示 12.2]。在我们解释了我们 ADT 的各种文件如何相互交互之后，我们将回到 [显示 12.2] 并讨论该实现文件中定义的详细信息。\n\
  \n```cpp\n1 //实现文件 dtime.cpp (你的系统可能需要 .cpp 以外的\n2 //后缀): 这是 DigitalTime ADT 类的实现。\n\
  3 //DigitalTime 类的接口在头文件 dtime.h 中。\n4 #include <iostream>\n5 #include <cctype>\n\
  6 #include <cstdlib>\n7 #include \"dtime.h\"\n8 using namespace std;\n9 //这些函数声明用于定义\n\
  10//重载的输入运算符 >> ：\n11void readHour(istream& ins, int& theHour);\n12//前置条件：流 ins\
  \ 中的下一个输入是 24 小时制的时间，\n13//例如 9:45 或 14:45。\n14//后置条件：theHour 已被设置为时间的小时部分。\n15//冒号已被丢弃，下一个要读取的输入是分钟。\n\
  16void readMinute(istream& ins, int& theMinute);\n17//在 readHour 读取小时后从流 ins 中读取分钟。\n\
  18int digitToInt(char c);\n19//前置条件：c 是 '0' 到 '9' 数字之一。\n20//返回该数字对应的整数；例如，digitToInt('3')\
  \ 返回 3。\n21bool operator ==(const DigitalTime& time1, const DigitalTime& time2)\n\
  22{\n23    return (time1.hour == time2.hour && time1.minute == time2.minute);\n\
  24}\n25//使用了 iostream 和 cstdlib:\n26DigitalTime::DigitalTime(int theHour, int theMinute)\n\
  27{\n28    if (theHour< 0 || theHour> 23 || theMinute< 0 || theMinute> 59)\n29 \
  \   {\n30        cout<< \"Illegal argument to DigitalTime constructor.\";\n31  \
