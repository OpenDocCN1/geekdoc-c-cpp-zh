  \ `double` 数组和一个名为 `size` 的 `int` 参数作为参数，并返回一个 `int` 类型的值。该函数将测试数组是否乱序，即数组违反了以下条件：\n\
  \n```cpp\na[0] <= a[1] <= a[2] <= ...\n```\n\n如果元素没有乱序，函数返回 −1；否则，它将返回数组中第一个乱序元素的索引。例如，考虑以下声明\n\
  \n```cpp\ndouble a[10] = {1.2, 2.1, 3.3, 2.5, 4.5,\n                  7.9, 5.4,\
  \ 8.7, 9.9, 1.0};\n```\n\n在这个数组中，`a[2]` 和 `a[3]` 是第一对乱序的元素，`a[3]` 是第一个乱序元素，因此函数返回\
  \ `3`。如果数组是有序的，函数将返回−1`。\n\n# 7.3 数组编程\n\n> 孩子，永远不要相信一般性印象，要把精力集中在细节上。\n\n亚瑟·柯南·道尔爵，《身份案》（福尔摩斯探）\n\
  \n在本节中，我们将讨论部分填充数组，并对数组的排序和搜索进行简单介绍。本节不包含关于 C++ 语言的新材料，但包含了更多关于 C++ 数组参数的练习。\n\n\
  # 部分填充数组\n\n在编写程序时，通常不知道数组所需的确切大小，或者大小可能会在程序的每次运行之间发生变化。处理这种情况的一种常见且简单的方法是将数组声明为程序可能需要的最大大小。然后，程序就可以根据需要自由地使用数组的全部或部分。\n\
  \n部分填充数组需要一些注意。程序必须跟踪数组使用了多少部分，并且不能引用任何未赋值的索引变量。显示 7.9 程序说明了这一点。该程序读取一个高尔夫得分列表，并显示每个得分与平均值的差异。该程序适用于长度短至一个得分、长至十个得分以及两者之间任何长度的列表。得分存储在数组\
  \ `score` 中，该数组有十个索引变量，但程序只使用它需要的数组部分。变量 `numberUsed` 用于跟踪数组中存储了多少元素。元素（即得分）存储在\
  \ `score[0]` 到 `score[numberUsed − 1]` 位置。\n\n```cpp\n 1    //显示一组高尔夫得分中每个得分与其平均值之间的差异。\n\
  \ 2    #include <iostream>\n 3    const int MAX_NUMBER_SCORES = 10;\n\n 4    void\
  \ fillArray(int a[], int size, int& numberUsed);\n 5    // 前提条件：size 是数组 a 的声明大小。\n\
  \ 6    // 后置条件：numberUsed 是存储在 a 中的值数量。\n 7    //a[0] 到 a[numberUsed − 1] 已用从键盘读取的\n\
  \ 8    // 非负整数填充。\n\n 9    double computeAverage(const int a[], int numberUsed);\n\
  10    // 前提条件：a[0] 到 a[numberUsed − 1] 有值；numberUsed> 0。\n11    // 返回 a[0] 到 a[numberUsed\
  \ − 1] 数字的平均值。\n\n12    void showDifference(const int a[],int numberUsed);\n13 \
  \   // 前提条件：a 的前 numberUsed 个索引变量有值。\n14    // 后置条件：输出到屏幕，显示 a 的前\n15    // numberUsed\
  \ 个元素中每个与其平均值的差异。\n\n16    int main( )\n17    {\n18        using namespace std;\n\
  19        int score[MAX_NUMBER_SCORES], numberUsed;\n\n20        cout << \"此程序读取高尔夫得分，并显示\n\
  21             每个得分与平均值的差异。\\n\";\n22        cout << \"输入得分：\\n\";\n23        fillArray(score,\
  \ numberUsed);\n24        showDifference(score, numberUsed);\n25        return 0;\n\
  26    }\n27    void fillArray(int a[], int size, int& numberUsed)\n28    {\n   \
  \     using namespace std;\n29        cout << \"输入最多 \" << size << \" 个非负整数。\\n\"\
  ;\n30        cout << \"用负数结束列表。\\n\";\n31        int next, index = 0;\n32      \
  \  cin >> next;\n33        while (next >= 0 && index < size)\n34        {\n35  \
  \          a[index] = next;\n36            index++;\n37        }\n38        numberUsed\
  \ = index;\n    }\n39    double computeAverage(const int a[], int numberUsed)\n\
  40    {\n        double total = 0;\n41        for (int index = 0; index < numberUsed;\
  \ index++)\n42            total += a[index];\n43        if (numberUsed> 0)\n44 \
  \           total/numberUsed;\n45        else\n46        {\n            using namespace\
  \ std;\n47            cout << \"错误：元素数量为 0\\n\";\n48                 << \"computeAverage\
  \ 返回 0。\\n\";\n49            return 0;\n50        }\n    }\n51    void showDifference(const\
  \ int a[], int numberUsed)\n52    {\n        using namespace std;\n53        double\
  \ average = computeAverage(a, numberUsed);\n54        cout << \"\" << numberUsed\
  \ << \" 个得分的平均值为 \" << average << endl;\n55             << \"得分如下：\\n\";\n56   \
  \     for (int index = 0; index < numberUsed; index++)\n57            cout << a[index]\
  \ << \" 与平均值的差异为 \"\n58                 << (a[index] − average) << endl;\n    }\n\
  ```\n\n***示例***\n\n```\n此程序读取高尔夫得分，并显示\n每个得分与平均值的差异。\n输入得分：\n输入最多 10 个非负整数。\n用负数结束列表。\n\
  69 74 68 −1\n平均 3 个得分的平均值为 70.3333\n得分如下：\n69 与平均值的差异为 −1.3333\n74 与平均值的差异为 3.66667\n\
  68 与平均值的差异为 −2.3333\n```\n\n# 显示 7.9 部分填充数组\n\n细节与当 `numberUsed` 是数组的声明大小且使用整个数组时非常相似。特别地，`numberUsed`\
  \ 通常应该是任何操作部分填充数组的函数的参数。由于 `numberUsed`（在正确使用的情况下）通常可以确保函数不会引用非法的数组索引，这有时（但并非总是）消除了对提供数组声明大小参数的需求。例如，`showDifference`\
  \ 和 `computeAverage` 函数使用 `numberUsed` 来确保使用合法的数组索引。然而，`fillArray` 函数需要知道数组的最大声明大小，以防止溢出。\n\
  \n# 编程提示 不要在形式参数上吝啬\n\n注意 显示 7.9 中的 `fillArray` 函数。在调用 `fillArray` 时，声明数组大小 `MAX_NUMBER_SCORES`\
  \ 作为参数之一给出，如下所示来自显示 7.9 的函数调用：\n\n```cpp\nfillArray(score, MAX_NUMBER_SCORES, numberUsed);\n\
  ```\n\n\n\n\n你可能会认为 `MAX_NUMBER_SCORES` 是一个全局定义的常量，因此在 `fillArray` 的定义中可以直接使用它而不需要将其作为参数。你是正确的，如果我们除了示例\
  \ 7.9 之外的任何程序中使用 `fillArray`，那么可以在不将 `MAX_NUMBER_SCORES` 作为 `fillArray` 参数的情况下实现这一点。然而，`fillArray`\
  \ 是一个非常有用的函数，你可能会在多个不同的程序中使用。我们确实在示例 7.10 程序中使用了 `fillArray`，该函数将在下一节中讨论。在示例 7.10\
  \ 程序中，数组大小的参数是一个不同的全局常量。如果我们把全局常量 `MAX_NUMBER_SCORES` 写入 `fillArray` 函数体中，我们就无法在上述程序中重用该函数。\n\
  \n# 编程示例：搜索数组\n\n一个常见的编程任务是在数组中搜索给定的值。例如，数组可能包含某门课程所有学生的学号。为了判断某个学生是否注册，需要搜索数组以查看其是否包含该学号。示例\
  \ 7.10 程序会先填充数组，然后根据用户指定的值对数组进行搜索。实际应用程序会复杂得多，但它展示了顺序搜索算法的所有精髓。顺序搜索算法是你能想象的最直接的搜索算法：程序按从到尾检查数组元素，看目标数字是否等于任何一个元素。\n\
  \n在示例 7.10 程序中，使用 `search` 函数来搜索数组。搜索数组时，你通常想知道的不只是目标值是否在数组中。如果目标值在数组中，你通常想知道持有该目标值的变量的索引，因为索引可以作为有关目标值的其他信息的引导。因此，我们设计了\
  \ `search` 函数返回目标值在数组中的位置索引，前提是目标值确实在数组中。如果目标值不在数组中，`search` 返回 `-1`。让我们详细查看一下 `search`\
  \ 函数。\n\n`search` 函数使用 `while` 循环逐个检查数组元素，看是否有任何一个等于目标值。变量 `found` 被用作标记，记录目标元素是否已找到。如果在数组中找到了目标元素，则将\
  \ `found` 设置为 `true`，从而结束 `while` 循环。\n\n```\n 1     //搜索一个部分填充的非负整数数组。\n 2    \
  \ #include <iostream>\n 3     const int DECLARED_SIZE = 20;\n\n 4     void fillArray(int\
  \ a[], int size, int& numberUsed);\n 5     // 前置条件：size 是数组 a 的声明大小。\n 6     //\
  \ 后置条件：numberUsed 是存储在 a 中的值数量。\n 7     //a[0] 到 a[numberUsed - 1] 已经用从键盘读取的\n 8\
  \     //非负整数填充。\n\n 9     int search(const int a[], int numberUsed, int target);\n\
  10     // 前置条件：numberUsed <= a 的声明大小。\n11     // 此外，a[0] 到 a[numberUsed - 1] 有值。\n\
  12     // 返回第一个使得 a[index] == target 的索引，\n13     // 只要存在这样一个索引。\n14     int main(\n\
  15     {\n16         using namespace std;\n17         int arr[DECLARED_SIZE];\n\
  18         int numberUsed, target, result;\n19         char ans;\n20         fillArray(arr,\
  \ DECLARED_SIZE, numberUsed);\n21         do\n22             cout << \"Enter a number:\
  \ \";\n23             cin >> target;\n24             result = search(arr, numberUsed);\n\
  25             if (result == -1)\n26                 cout << target << \" is not\
  \ on the list.\" << endl;\n27             else\n28                 cout << target\
  \ << \" is stored in position \" << result << endl;\n29             cout << \"Search\
  \ again? \";\n30             cin >> ans;\n31         } while (ans != 'n');\n32 \
  \        return 0;\n33     }\n```\n\n### 示例\n\n```\n10 20 30 40 50 60 70 80\nEnter\
  \ a number: 10\n10 is stored in position 0\nSearch again? 20\nEnter a number: 20\n\
  20 is stored in position 1\nSearch again? 30\nEnter a number: 30\n30 is stored in\
  \ position 2\nSearch again? 40\nEnter a number: 40\n40 is stored in position 3\n\
  Search again? 50\nEnter a number: 50\n50 is stored in position 4\nSearch again?\
  \ 60\nEnter a number: 60\n60 is stored in position 5\nSearch again? 70\nEnter a\
  \ number: 70\n70 is stored in position 6\nSearch again? 80\nEnter a number: 80\n\
  80 is stored in position 7\nSearch again? 90\nEnter a number: 90\n90 is not on the\
  \ list.\nSearch again? n\n```\n\n### 实现细节\n\n```cpp\nvoid fillArray(int a[], int\
  \ size, int& numberUsed)\n{\n    numberUsed = 0;\n    while (numberUsed < size)\n\
  \    {\n        cout << \"Enter a non integer: \";\n        cin >> a[numberUsed];\n\
  \        numberUsed++;\n    }\n}\n\nint search(const int a[], int numberUsed, int\
  \ target)\n{\n    int index = 0;\n    bool found = false;\n    while (!found &&\
  \ index < numberUsed)\n    {\n        if (a[index] == target)\n        {\n     \
  \       found = true;\n        }\n        index++;\n    }\n    if (found)\n    \
  \    return index;\n    else\n        return -1;\n}\n```\n\n\n\n\n实现这种通用方法有许多方式。可以使用两个数组，并按排序将元素从一个数组复制到另一个数组来开发具体细节，但使用一个数组应该是既足够又经济的。因此，`sort`\
  \ 函数只使用包含待排序值的这一个数组。`sort` 函数通过交换成对的值来重新排列数组 `a` 中的值。让我们来看一个具体的示例，以便你看到算法是如何运行的。\n\
  \n考虑显示 7.11 所示的数组。算法将将最小值放置在 `a[0]` 中。最小值是 `a[3]` 中的值。因此，算法交换 `a[0]` 和 `a[3]` 的值。然后，算法寻找下一个最小元素。此时\
  \ `a[0]` 中的值是最小元素，因此下一个最小元素是剩余元素 `a[1]`、`a[2]`、`a[3]`、……、`a[9]` 中的最小值。在显示 7.11 的示例中，下一个最小元素在\
  \ `a[5]`，因此算法交换 `a[1]` 和 `a[5]` 的值。第二个最小元素的定位如图中显示 7.11 中的第四和第五张数组图片所示。算法随后定位第三个最小元素，依此类推。\n\
  \n![一张说明选择排序的图表。](img/fg07_01100.png)\n\n# 显示 7.11 选择排序\n\n图 7.11 完整备用文本\n\n随着排序的进行，数组开头的元素被设置为正确的排序值。数组的已排序部分通过从数组未排序末端的元素中逐个添加元素来增长。注意，算法不需要对最后一个索引变量\
  \ `a[9]` 中的值进行任何操作。这是因为一旦其他元素被放置在正确的位置，`a[9]` 也也一定具有正确的值。毕竟，`a[9]` 的正确值是剩余待移动值中的最小值，而唯一剩余待移动的值就是已经在\
  \ `a[9]` 中的值了。\n\n包含在演示程序中的函数 `sort` 的定义见显示 7.12。`sort` 使用函数 `indexOfSmallest` 来找到数组未排序末端最小元素的索引，然后通过交换将该元素移动到数组的已排序部分。\n\
  \n`swapValues` 函数见显示 7.12，用于交换索引变量的值。例如，以下调用将交换 `a[0]` 和 `a[3]` 的值：\n\n```\nswapValues(a[0],\
  \ a[3]);\n```\n\n`swapValues` 函数在第 5 章中解释过。\n\n```\n 1    //测试过程 sort。\n 2    #include\
  \ <iostream>\n 3    void fillArray(int a[], int size, int& numberUsed);\n 4    //前置条件：size\
  \ 是数组 a 的声明大小。\n 5    //后置条件：numberUsed 是存储在 a 中的值个数。\n 6    //a[0] 到 a[numberUsed\
  \ − 1] 已经填充了\n 7    //从键盘读取的非负整数。\n 8    void sort(int a[], int numberUsed);\n10\
  \    //前置条件：numberUsed <= 数组 a 的声明大小。\n11    //数组元素 a[0] 到 a[numberUsed − 1]具有值。\n\
  12    //后置条件：a[0] 到 a[numberUsed − 1] 的值已排序。\n13    //该算法通过交换成对的值。\n14    void swapValues(int&\
  \ v1, int& v2);\n15    //交换 v1 和 v2 的值。\n16    int indexOfSmallest(const a[], int\
  \ startIndex, int numberUsed);\n17    //返回 a[startIndex] 到 a[numberUsed-1] 中最小元素的索引。\n\
  18    int main() {\n19        int a[10], numberUsed;\n20        fillArray(a, 10,\
  \ numberUsed);\n21        for (int i = 0; i < numberUsed - 1; i++) {\n22       \
  \     int smallest = indexOfSmallest(a, i, numberUsed);\n23            swapValues(a[i],\
  \ a[smallest]);\n24        }\n25    }\n```\n\n\n\n\n此时，算法已经完成。数组开头的剩余数字不需要检查，因为它是唯一的数字，且必须是最小的。设计一个基于冒泡排序的程序时，请注意我们将最大的元素放在索引\
  \ `length-1` 处，将次大的元素放在 `length-2`，下一个放在 `length-3`，依此类推。这对应于一个从数组索引 `length-1`\
  \ 开始递减到数组索引 1 的循环。我们不需要包含索引 0，因为它将包含最小元素。实现该循环的一种方法是以下代码，其中变量 `i` 对应目标索引：\n\n```\n\
  for (int i = length-1; i > 0; i--)\n```\n\n冒泡排序的“冒泡”部分发生在循环的每次迭代内部。冒泡步骤由另一个循环组成，该循环将最大数移动数组中的索引\
  \ `i`。首先，索引 0 和索引 `i` 之间的最大数将被“泡”到索引 `i`。我们通过比较索引 0 处的数字与索引 1 处的数字开始冒泡过程。如果索引 0\
  \ 处的数字大于索引 1 处的数字，则交换这两个值，使得最大的数字位于索引 1 处。如果索引 0 处的数字小于或等于索引 1 处的数字，则什么都不会发生。从以下未排序数组开始：\n\
  \n初始数组：`{3, 10, 9, 2, 5}`\n\n然后冒泡过程的第一步将比较 3 和 10。由于 `10 > 3`，什么都不会发生，结果是数字 10 位于索引\
  \ 1：\n\n步骤 1 之后：`{3, 10, 9, 2, 5}`\n\n对于较大的值重复该过程，直到达到 `i`。第二步将比较索引 1 和 2 处的数字，即值\
  \ 10 和 9。由于 10 大于 9，我们交换数字，结果如下：\n\n步骤 2 之后：`{3, 9, 10, 2, 5}`\n\n该过程再重复两次：\n\n\
  步骤 3 之后：`{3, 9, 2, 10, 5}`\n\n步骤 4 之后：`{3, 9, 2, 5, 10}`\n\n这结束了冒泡排序算法的第一次迭代。我们已经将最大的数字泡到了数组末尾。下一次迭代将次大的数字泡到倒数第二个位置，依此类推，其中变量\
  \ `i` 代表被泡数字的目标索引。如果我们使用变量 `j` 来引用被泡元素的索引，那么我们的循环代码看起来像这样：\n\n```\nfor (int i =\
  \ length-1; i > 0; i--)\n   for (int j = 0; j < i; j++)\n```\n\n在循环内部，我们必须比较索引 `j`\
  \ 和索引 `j+1` 处的元素。较大的应该移动到索引 `j+1`。完成后的算法所示所示，一个完整的示例可以在显示 7.13 中。\n\n```\nfor (int\
  \ i = length-1; i > 0; i--)\n   for (int j = 0; j < i; j++)\n      if (arr[j] >\
  \ arr[j+1])\n      {\n            int temp = arr[j+1];\n            arr[j+1] = arr[j];\n\
  \            arr[j] = temp;\n      }\n```\n\n```\n1    //显示 7.13  冒泡排序程序\n 2   \
  \ //使用冒泡排序对整数数组排序。\n 3    #include <iostream>\n 4    \n 5    void bubblesort(int\
  \ arr[], int length);\n 6    //前置条件：length <= 数组 arr 声明的大小。\n 7    //数组元素 arr[0]\
  \ 到 a[length − 1] 有值。\n 8    //后置条件：arr[0] 到 arr[length − 1] 的值已经\n 9    //经过重排，使得\
  \ arr[0] <= a[1] <=  <= arr[length − 1]。\n10     \n11    int main()\n12    {\n13\
  \       using namespace std;\n14       int a[] = {3, 10, 9, 2, 5, 1};\n15    \n\
  16       bubblesort(a, 6);\n17       for (int i=0; i<6; i++)\n18       {\n19   \
  \          cout << a[i] << \" \";\n20       }\n21       cout << endl;\n22      \
  \ return 0;\n23    }\n24    \n25    void bubblesort(int arr[], int length)\n26 \
  \   {\n27           //向右冒泡最大的数\n28           for (int i = length-1; i > 0; i--)\n\
  29                  for (int j = 0; j < i; j++)\n30                         if (arr[j]\
  \ > arr[j+1])\n31                         {\n32                               int\
  \ temp = arr[j+1];\n33                               arr[j+1] = arr[j];\n34    \
  \                           arr[j] = temp;\n35                         }\n36   \
  \ }\n```\n\n### 显示 7.13 冒泡排序程序\n使用冒泡排序对整数数组排序。\n\n### 自测练习\n17. 编写一个程序，读取十个整数到 `numberArray`\
  \ 并输出顺序。对于这个练习你不需要使用函数。\n18. 编写一个程序，读取十个字母到 `letterBox` 并输出顺序。对于这个练习你不需要使用函数。\n\
  19. 以下是显示 7.13 替代版本的声明。\n\n\n\n\n\n在 C++ 中，二维数组（例如 `page`）实际上是数组的数组。示例数组 `page`\
  \ 实际上是一个大小为 30 的一维数组，其基本类型是一个大小为 100 的一维字符数组。通常情况下，这不需要你担心，你通常可以认为数组 `page` 实际上是一个具有两个索引的数组（而不是更难追踪的数组的数组）。然而，至少有一种情况，二维数组看起来非常像数组的数组，即：你有一个函数，且该函数包含一个用于数组的数组参数时，这将在下一个小节中讨论。\n\
  \n# 多维数组参数\n\n以下对二维数组的声明实际上是声明了一个大小为 30 的一维数组，其基本类型是一个大小为 100 的一维字符数组：\n\n```cpp\n\
  char page[30][100];\n```\n\n将二维数组视为数组的数组将有助于你理解 C++ 如何处理多维数组的参数。例如，以下函数接收一个类似 `page`\
  \ 的数组参数，并将其打印到屏幕上：\n\n```cpp\nvoid displayPage(const char p[][100], int sizeDimension1)\n\
  {\n    for (int index1 = 0; index1 < sizeDimension1; index1++)\n    {//打印其中一行：\n\
  \        for (int index2 = 0; index2 < 100; index2++)\n            cout << p[index1][index2];\n\
  \        cout << endl;\n    }\n}\n```\n\n注意，对于二维数组参数，第一维度的大小没有给出，因此我们必须包含一个 `int`\
  \ 参数来提供该第一维度的大小。（与普通数组一样，编译器允许你通过在第一对方括号中放置数字来指定第一维度。然而，该数字只是注释；编译器会忽略任何此类数字。）第二维度（以及如果超过两个维度时的所有其他维度）的大小在数组参数之后给出，如参数所示：\n\
  \n```cpp\nconst char p[ ][100]\n```\n\n如果你意识到多维数组是数组的数组，那么这个规则就开始变得合理。由于二维数组参数\n\
  \n```cpp\nconst char p[ ][100]\n```\n\n是一个数组数组的参数，第一维度实际上是数组的索引，其处理方式与普通一维数组的索引一样。第二维度是基本类型描述的一部分，该基本类型是一个大小为\
  \ 100 的字符数组。\n\n# 编程示例：二维评分程序\n\n显示 7.14 包含一个程序，该程序使用名为 `grade` 的二维数组来存储并显示一个小级的成绩记录。该级有四名学生，包含三次测验。显示\
  \ 7.15 说明了如何使用数组 `grade` 来存储数据。第一个数组索引用于指定学生，第二个数组索引用于指定测验。由于学生和测验是从 1 开始编号的而不是\
  \ 0，我们必须从学生编号中减 1，并从测验编号中减 1，以获得存储特定测验数的索引变量。例如，第 4 号学生在第 1 次测验中得到的分记录在 `grade[3][0]`\
  \ 中。\n\n我们的程序还使用了两个普通的一维数组。数组 `stAve` 将用于记录每个学生的平均测验分。例如，程序将 `stAve[0]` 设置为第 1 号学生获得测验分的平均值，将\
  \ `stAve[1]` 设置为第 2 号学生测验分的平均值，以此此类推。数组 `quizAve` 将用于记录每次测验的平均分。例如，程序将 `quizAve[0]`\
  \ 设置为第 1 次测验所有学生分数的平均值，`quizAve[1]` 将记录第 2 次测验的平均分，以此此类推。显示 7.16 说明了数组 `grade`、`stAve`\
  \ 和 `quizAve` 之间的关系。在该显示中，我们展示了数组 `grade` 的一些示例数据。这些数据反过来决定了程序存储在 `stAve` 和 `quizAve`\
  \ 中的值。\n\n\n\n\n```cpp\n// 将每个学生的测验分数读入二维数组 grade 中（但\n// 此显示中未显示输入代码）。计算每个学生的平均分\n\
  // 以及每次测验的平均分。显示测验分数\n// 及其平均分。\n#include <iostream>\n#include <iomanip>\nconst\
  \ int NUMBER_STUDENTS = 4, NUMBER_QUIZZES = 3;\n\n\n\nvoid computeStAve(const int\
  \ grade[][NUMBER_QUIZZES], double stAve[]);\n// 前置条件：全局常量 NUMBER_STUDENTS 和 NUMBER_QUIZZES\n\
  // 是数组 grade 的维度。每个索引变量\n// grade[stNum - 1, quizNum - 1] 包含学生 stNum 在测验\n// quizNum\
  \ 中的分数。\n// 后置条件：每个 stAve[stNum - 1] 包含学生\n// stNum 的平均分。\n\nvoid computeQuizAve(const\
  \ int grade[][NUMBER_QUIZZES], double quizAve[]);\n// 前置条件：全局常量 NUMBER_STUDENTS\
  \ 和 NUMBER_QUIZZES\n// 是数组 grade 的维度。每个索引变量\n// grade[stNum - 1, quizNum - 1] 包含学生\
  \ stNum 在测验\n// quizNum 中的分数。\n// 后置条件：每个 quizAve[quizNum - 1] 包含测验 quizNum\n//\
  \ 的平均分。\n\nvoid display(const int grade[][NUMBER_QUIZZES],\nconst double stAve[],\
  \ const double quizAve[]);\n// 前置条件：全局常量 NUMBER_STUDENTS 和 NUMBER_QUIZZES 是\n//\
  \ 数组 grade 的维度。每个索引变量 grade[stNum - 1,\n// quizNum - 1] 包含学生 stNum 在测验 quizNum 中的分数。每个\n\
  // stAve[stNum - 1] 包含学生 stNum 的平均分。每个\n// quizAve[quizNum - 1] 包含测验 quizNum 的平均分。\n\
  // 后置条件：grade、stAve 和 quizAve 中的所有数据均已输出。\n\nint main( )\n{\n    using namespace\
  \ std;\n    int grade[NUMBER_STUDENTS][NUMBER_QUIZZES];\n    double stAve[NUMBER_STUDENTS];\n\
  \    double quizAve[NUMBER_QUIZZES];\n \n    <填充数组 grade 的代码将在此处，但未显示。>\n    computeStAve(grade,\
  \ stAve);\n    computeQuizAve(grade, quizAve);\n    display(grade, stAve, quizAve);\n\
  \    return 0;\n}\nvoid computeStAve(const int grade[][NUMBER_QUIZZES], double stAve[])\n\
  {\n    for (int stNum = 1; stNum <= NUMBER_STUDENTS; stNum++)\n    {// 处理一个 stNum:\n\
  \        double sum = 0;\n        for (int quizNum = 1; quizNum <= NUMBER_QUIZZES;\
  \ quizNum++)\n            sum = sum + grade[stNum - 1][quizNum - 1];\n        //sum\
  \ 包含学生编号 stNum 的所有测验分数总和。\n        stAve[stNum - 1] = sum/NUMBER_QUIZZES;\n    \
  \    // 学生 stNum 的平均分是 stAve[stNum-1] 的值\n    }\n}\n \n \nvoid computeQuizAve(const\
  \ int grade[][NUMBER_QUIZZES], double quizAve[])\n{\n    for (int quizNum = 1; quizNum\
  \ <= NUMBER_QUIZZES; quizNum++)\n    {// 处理一次测验 (针对所有学生):\n        double sum =\
  \ 0;\n        for (int stNum = 1; stNum <= NUMBER_STUDENTS; stNum++)\n         \
  \   sum = sum + grade[stNum - 1][quizNum - 1];\n        //sum 包含所有学生在测验 quizNum\
  \ 中的分数总和。\n        quizAve[quizNum - 1] = sum/NUMBER_STUDENTS;\n        // 测验 quizNum\
  \ 的平均分是 quizAve[quizNum - 1] 的值\n    }\n}\n \n \n// 使用 iostream 和 iomanip:\nvoid\
  \ display(const int grade[][NUMBER_QUIZZES],\n    const double stAve[], const double\
  \ quizAve[])\n{\n    using namespace std;\n    cout.setf(ios::fixed);\n    cout.setf(ios::showpoint);\n\
  \    cout.precision(1);\n    cout << setw(10) << \"Student\"\n         << setw(5)\
  \ << \"Ave\"\n         << setw(15) << \"Quizzes\\n\";\n    for (int stNum = 1; stNum\
  \ <= NUMBER_STUDENTS; stNum++)\n    {// 显示一个 stNum:\n        cout << setw(10) <<\
  \ stNum\n             << setw(5) << stAve[stNum - 1] << \" \";\n        for (int\
  \ quizNum = 1; quizNum <= NUMBER_QUIZZES; quizNum++)\n                cout << setw(5)\
  \ << grade[stNum - 1][quizNum - 1];\n        cout << endl;\n    }\n    cout << \"\
  Quiz averages = \";\n    for (int quizNum = 1; quizNum <= NUMBER_QUIZZES; quizNum++)\n\
  \        cout << setw(5) << quizAve[quizNum - 1];\n    cout << endl;\n}\n```\n\n\
  ***示例对话***\n\n<填充数组 grade 的对话未显示。>\n\n| `Student` | `Ave` | `Quizzes` |\n\n| `1`\
  \ | `10.0` | `10` | `10` | `10` |\n\n| `2` | `10.0` | `10` | `10` | `10` |\n\n\n\
  \n\n\n*   数组的索引变量在计算机内存中紧相邻存储，因此数组占据内存中的一段连续区域。当数组作为参数传递给函数时，只向调用该函数提供第一个索引变量（编号为\
