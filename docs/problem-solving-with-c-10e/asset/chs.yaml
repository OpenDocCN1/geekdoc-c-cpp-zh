  2 件物品，每件 $10.10。\n最终账单（含税）为 $21.21\n```\n\n# 显示 4.3 一个函数定义\n\n图 4.3 完整替代文本\n\n函数的描述由两部分组成，称为`函数声明`和`函数定义`。**函数声明**（也称为**函数原型**）描述了函数如何被调用。C++\
  \ 要求在调用函数之前，代码中必须出现完整的函数定义或函数声明。`totalCost` 函数的声明位于显示 4.3 顶部并以彩色显示，在此处重复如下：\n\n\
  ```cpp\ndouble totalCost(int numberPar, double pricePar);\n```\n\n函数声明告诉了你编写函数调用所需的所有信息。它告诉你是函数的名称，在本例中为\
  \ `totalCost`。它告诉你是函数需要多少个参数以及参数应该是什么类型；在这种情况下，函数 `totalCost` 接受两个参数，第一个类型为 `int`，第二个类型为\
  \ `double`。标识符 `numberPar` 和 `pricePar` 被称为*形式参数*。**形式参数**被用作一种空白或占位符，用来代表参数。当你编写函数声明时，你并不知道参数将是什么，因此你使用形式参数来代替参数。形式参数的名字可以是任何有效的标识符，但在一段时间内，我们将形式参数名称以\
  \ `Par` 结尾，以便于我们将其与程序中的其他项目区分开来。注意，函数声明以分号结束。\n\n函数声明中的第一个单词指定了函数**返回值的类型**。因此，对于\
  \ `totalCost` 函数，返回值的类型是 `double`。\n\n如你所见，显示 4.3 中的函数调用满足了函数声明给出的所有要求。让我们来看。函数调用位于以下行：\n\
  \n```cpp\nbill = totalCost(number, price);\n```\n\n函数调用是等号右侧的表达式。函数名为 `totalCost`，并且有两个参数：第一个参数类型为\
  \ `int`，第二个参数类型为 `double`，由于变量 `bill` 的类型为 `double`，看起来该函数返回一个 `double` 类型的值（事实确实如此）。所有这些细节都由函数声明决定。\n\
  \n编译器并不关心函数声明旁边是否有注释，但你应该始终包含一个注释，来说解释函数返回了什么值。\n\n在显示 4.3 中，函数定义位于显示的底部并以彩色显示。**函数定义**描述了函数如何计算其返回的值。如果你将函数看作程序中的一个小型程序，那么函数定义就像是这个小程序的代码。事实上，函数定义的语法与程序\
  \ `main` 部分的语法非常相似。函数定义由一个*函数头*后面跟着一个*函数体*组成。\n\n\n\n\n\n### 3.\n当用一个参数替换形式参数时（例如，用\
