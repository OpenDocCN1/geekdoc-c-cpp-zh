  {\n    month = 1;\n    day = 1;\n}\n```\n\n### 24.\n类定义与上一个练习相同。构造函数的定义将变为如下形式：\n\
  ```cpp\nDayOfYear::DayOfYear(int theMonth, int theDay)\n    : month(theMonth), day(theDay)\n\
  {\n    checkDate();\n}\nDayOfYear::DayOfYear() : month(1), day(1)\n{\n    // 主体故意为空。\n\
  }\n```\n\n### 25.\n所有成员变量都应该是私有的。作为 ADT（抽象数据类型）接口部分的成员函数（即作为 ADT 操作的成员函数）应该是公有的。你可能还有一些仅在其他成员函数定义中使用的辅助帮助函数。这些辅助函数应该是私有的。\n\
  \n### 26.\n所有私有成员变量声明都是实现的一部分。（不应该有公有成员变量。）类中所有公共成员函数的声明（列在类定义中）以及这些声明的说明注释都是接口的一部分。所有私有成员函数的函数声明都是实现的一部分。所有成员函数的定义（无论公共还是私有）都是实现的一部分。\n\
  \n### 27.\n你只需要读取接口部分。也就是说，你只需要读取类中公共成员的声明（列在类定义中）以及这些声明的说明注释。你不需要读取任何私有成员函数的声明、私有成员变量的声明、公共成员函数的定义或私有成员函数的定义。\n\
  \n### 28.\n（注意：输入文本中此点的内容被截断了。）\n\n\n\n\n\n## 29. 父类定义的函数和数据可以在派生类中使用，消除了在派生类中重新定义这些函数和数据的需要。这提高了可维护性，因为多个类之间不再有代码重复，因此代码中只有一处位置可能需要更改。此外，继承提供了一种整洁的方法，来隔离仅适用于派生类的代码。由于此类代码只出现在派生类的定义中，因此通常更容易阅读。\n\
  \n## 30. 不，但派生类可以通过公共函数间接访问父类的私有成员变量。\n\n## 31. 是的，派生类将拥有相同的函数。在[第 15 章]中，我们将讨论如何让函数对`SportsCar`\
  \ 类对象和`Automobile` 类对象执行不同的操作。\n\n# 练习程序\n\n练习程序通常可以通过一个简短的程序来解决，该程序直接应用本章介绍的编程原理。\n\
