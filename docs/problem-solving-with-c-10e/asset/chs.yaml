  \ 编写第 7 章显示 7.10 中 `search` 迭代的递归版本。\n\n4. 房间里有 `n` 个人，其中 `n` 是大于或等于 2 的整数。每个人都与其他人各握一次手。握手的总数是多少？编写一个递归函数来解决这个问题，头文件定义如下：\n\
