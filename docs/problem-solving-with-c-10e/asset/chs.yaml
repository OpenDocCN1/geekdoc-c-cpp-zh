  \   //从键盘读取非负整数并\n12    //将它们的总和放在 sum 中。\n13     \n14    int main( )\n15    {\n\
  16        using namespace std;\n17        int production[NUMBER_OF_PLANTS];\n18\
  \        char ans;\n19     \n20        do\n21        {\n22            inputData(production,\
  \ NUMBER_OF_PLANTS);\n23            cout << endl\n24                 << \"Total\
  \ production for each\"\n25                 << \" of plants 1 through 4:\\n\";\n\
  26            for (int number = 1; number <= NUMBER_OF_PLANTS; number++)\n27   \
  \             cout << production[number − 1] << \" \";\n28     \n29            cout\
  \ << endl\n30                 << \"Test Again?(Type y or n): \";\n31           \
  \ cin >> ans;\n32        } while (ans != 'N') && (ans != 'n') );\n33     \n34  \
  \      cout << endl;\n35        return 0;\n36    }\n37    // 使用 iostream:\n38  \
  \  void inputData(int a[], int lastPlantNumber)\n39    {\n40        using namespace\
  \ std;\n41        for (int plantNumber = 1;\n42             plantNumber <= lastPlantNumber;\
  \ plantNumber++)\n43        {\n44             cout << endl\n45                 \
  \ << \"Enter production data for plant number \"\n46                   << plantNumber\
  \ << endl;\n47            getTotal(a[plantNumber − 1]);\n48        }\n49    }\n\
  50\n51    // 使用 iostream:\n52    void getTotal(int& sum)\n53    {\n54        using\
  \ namespace std;\n55        cout << \"Enter number of units produced by each department.\\\
  n\"\n56             << \"Append a negative number to the end.\\n\";\n57        sum\
  \ = 0;\n58        int next;\n59        cin >> next;\n60        while (next >= 0)\n\
  61        {\n62            sum = sum + next;\n63            cin >> next;\n64   \
  \     }\n65        cout << \"Total = \" << sum << endl;\n66    }\n```\n\n**示例对话**\n\
  \n```\nEnter production data for plant 1\nEnter number of units produced by each\
