  你可以向 (E)东、(N)北或 (Q)退出。\nE\n```\n\n10. 逆波尔兰表达式（RPN），或称为后缀法，是一种指定数学表达式的格式。在 RPN 中，运算符位于操作数之后，而不是运算符位于操作数之间的普通格式（这被称为\
  \ `infix` 中缀表示）。从空栈开始，可以使用以下规则实现 RPN 计算器：\n\n* 如果输入数字，将其推入栈。\n* 如果输入 `\"+\"`，则从栈中弹出最后两个操作数，将它们相加并将结果推入栈。\n\
  * 如果输入 `\"−\"`，则弹出 `value1`，弹出 `value2`，然后将 `value2-value1` 推入栈。\n* 如果输入 `\"*\"\
  `，则从栈中弹出最后两个操作数，将它们相乘并将结果推入栈。\n* 如果输入 `\"/\"`，则弹出 `value1`，弹出 `value2`，然后将 `value2/value1`\
  \ 推入栈。\n* 如果输入 `\"q\"`，则停止输入值，打印栈顶元素并退出程序\n\n修改第 13.2 节) * 2` 的示例输入和输出：\n\n```\n\
  10\n2\n3\n+\n−\n2\n*\n```\n\n11. 在尝试此之前你应该完成项目 10。编写一个程序将全括号中缀表达式转换为等值的后缀表达式，然后对其进行求值。从一个存储运算符的空栈和一个字符串空队列开始，可以使用以下规则实现转换：\n\
  \n* 如果输入 `\"(\"`，忽略它。\n* 如果输入数字，则将其添加到队列中。\n* 如果输入运算符（`*`、`\"+\"`、`\"−\"` 或 `\"\
  /\"`），则将其推入栈。\n* 如果输入 `\")\"`，则从栈中弹出运算符并将其添加到队列中。\n* 如果输入 `\"q\"`，则退出。\n\n当最后一个运算符被弹出时，队列包含该表达式。详细信息请参阅第\
  \ 8 节。使用 `cStr()` 函数将字符串转换为 C 字符串，然后使用 `atoi` 将 C 字符串转换为整数。`((10 − (2 + 3)) * 2)`\
  \ 的示例输出所示：\n\n```\n(\n(\n10\n−\n(\n2\n+\n3\n)\n)\n*\n2\n)\n```\n\n\n\n\n你可能遇到过一些运行结果良好的循环定义。最显著的例子是某些\
  \ C++ 语句的定义。例如，`while` 语句的定义说明它可以包含其他的（较小的）语句。由于这些较小语句的可能之一是另一个 `while` 语句，因此该定义中存在某种循环性。如果完整地写出\
  \ `while` 语句的定义，它将包含对 `while` 语句的引用。在数学中，这种循环定义被称为递归定义。在 C++ 中，函数也可以以同样的方式根据自身定义。更准确地说，函数定义可能包含对它自身的调用。在这种情况下，该函数被称为递归函数。本章将讨论\
  \ C++ 中的递归，并更广泛地讨论递归作为一种编程和解决问题的技术。\n\n### 前提条件\n\n节 14.1 和 节 14.2 使用的材料仅来自第 2 章\
  \ 到第 5 章。节 14.3 使用的材料来自第 2 章到第 7 章和第 10 章。\n\n# 14.1 用于任务的递归函数\n\n> 我也记得那个夜晚，那是《千夜谭》的中间，当舍赫拉德（通过抄写员一次神奇的疏忽）开始逐字逐句地讲述《千夜谭》的故事时，这建立了再次回到她必须重复它的夜晚的风险，从而走向无限。\n\
  \n> 豪尔赫·路易斯·博尔赫斯，《分叉路径》\n\n当你编写一个函数来解决任务时，一种基本的设计技术是将任务分解为子任务。有时事实证明，至少有一个子任务是相同任务的较小示例。例如，如果任务是在数组中搜索某个特定值，你可能会将其分为搜索数组前半部分的子任务和搜索数组后半部分的子任务。搜索数组两半部分的子任务是原始任务的“较小”版本。每当其中一个子任务是待完成的原始任务的较小版本时，你就可以使用递归函数解决原始任务。通过这种方式轻松地分解问题需要一些训练，但一旦你学会了这项技术，它就可以设计算法（并最终设计\
  \ C++ 函数）最快的方法之一。我们从一个简单的案例研究开始来说说明这种技术。\n\n# 案例研究 竖直数字\n\n在这个案例研究中，我们设计了一个递归的 `void`\
  \ 函数，它将数字竖直写到屏幕上，例如，1984 将被写成：\n\n```\n1\n9\n8\n4\n```\n\n# 问题定义\n\n我们函数的声明和头文件注释如下：\n\
  \n```\nvoid writeVertical(int n);\n//前置条件：n >= 0.\n//后置条件：数字 n 被竖向写到屏幕上，\n//每个数字占一行。\n\
  ```\n\n# 算法设计\n\n一种情况非常简单。如果要打印的数字 `n` 只有一位，那么直接写出该数字即可。尽管如此简单，这种情况仍然很重要，所以让我们记录下它。*简单情况*：`n\
  \ < 10`。\n\n现在，让我们考虑要打印的数字多于一位典型情况。假设你想竖向打印 `1234`，你把任务分解为两个子任务：\n\n1. 递归地输出 `n\
  \ / 10`。\n2. 输出最后一位 `n % 10`。\n\n选择此类分解的另一个原因是，成功的递归定义始终包含一个不涉及递归调用的情况，以及一个或多个涉及的情况。\n\
  \n# 编码\n\n我们现在可以将所有部分组合在一起，产生显示 14.1 所示的递归函数 `writeVertical`。在下一节中，我们将详细解释此示例中递归的工作原理。\n\
  \n```cpp\n1//演示递归函数 writeVertical 的程序。\n2    #include <iostream>\n3    using namespace\
  \ std;\n4      \n5    void writeVertical(int n);\n6    //前置条件：n >= 0.\n7    //后置条件：数字\
  \ n 被竖向写到屏幕上，\n8    //每个数字占一行。9     \n10    int main( )\n11    {\n12        cout\
  \ << \"writeVertical(3):\" << endl;\n13        writeVertical(3);\n14     \n15  \
  \      cout<< \"writeVertical(12):\" <<endl;\n16        writeVertical(12);\n17 \
  \    \n18        cout<< \"writeVertical(123):\" <<endl;\n19        writeVertical(123);\n\
  20     \n21        return 0;\n22    }\n23     \n24    //使用 iostream:\n25    void\
  \ writeVertical(int n)\n26    {\n27        if (n < 10)\n28        {\n29        \
  \    cout << n << endl;\n30        }\n31        else //n 为两位或更多：\n32        {\n\
  33            writeVertical(n / 10);\n34            cout << (n % 10) << endl;\n\
  35        }\n36    }\n```\n\n***示例对话***\n\n```\nwriteVertical(3):\n3\nwriteVertical(12):\n\
  1\n2\nwriteVertical(123):\n1\n2\n3\n```\n\n# 显示 14.1 一个递归输出函数\n\n# 追踪递归调用\n\n让我们看看当执行以下函数调用时到底发生了什么：\n\
  \n```\nwriteVertical(123);\n```\n\n\n\n当执行此函数调用时，计算机的处理方式与处理任何其他函数调用相同。参数 `123`\
  \ 被替换函数定义中的参数 `n`，并执行函数体。在用 `123` 替换 `n` 之后，要执行的代码如下：\n\n![插图显示了几行代码，其中“writeVertical(123\
  \ / 10);”这一行被注释为“计算将在此停止，直到递归调用返回。”](img/ua14_00200a.png)\n\n由于 `123` 不小于 `10`，`if-else`\
  \ 语句中的逻辑表达式结果为 `false`，因此执行 `else` 部分。然而，`else` 部分以以下函数调用开始：\n\n```\nwriteVertical(n\
  \ / 10);\n```\n\n（由于 `n` 等于 `123`）该调用即为：\n\n```\nwriteVertical(123 / 10);\n```\n\
  \n这等同于：\n\n```\nwriteVertical(12);\n```\n\n当执行到达这个递归调用时，当前的函数计算被置于挂起状态，并执行该递归调用。当该递归调用完成后，挂起的计算执行将返回此处，挂起的计算将从此处继续。\n\
  \n该递归调用\n\n```\nwriteVertical(12);\n```\n\n其处理方式与任何其他函数调用均相同。参数 `12` 被替换参数 `n`，并执行函数体。在用\
  \ `12` 替换 `n` 之后，有两个计算，一个一个挂起的，一个活跃的，如下所示：\n\n![一个包含活动代码块的框叠加在一个一个包含挂起代码的框上。](img/ua14_00100.png)14.1-3\
  \ 完整替代文本\n\n由于 `12` 不小于 `10`，`if-else` 语句中的布尔表达式为 `false`，因此执行 `else` 部分。然而，正如你所看到的，`else`\
  \ 部分以一个递归调用开始。递归调用的参数是 `n / 10`，在当前情况下等于 `12 / 10`。因此，函数 `writeVertical` 的此第二次计算被挂起，并执行以下递归调用：\n\
  \n```\nwriteVertical(12/ 10);\n```\n\n这等同于：\n\n```\nwriteVertical(1);\n```\n\n此时，有两个挂起的计算在等待恢复，计算机开始执行这个新的递归调用，其处理方式与之前所有的递归调用都相同。参数\
  \ `1` 被替换参数 `n`，并执行函数体。此时，计算情况如下：\n\n![一个包含活动代码块的框叠加在两个包含挂起代码的框上。](img/ua14_00200.png)14.1-4\
  \ 完整替代文本\n\n当这次执行函数体时，发生了一些些不同的情况。由于 `1` 小于 `10`，`if-else` 语句中的布尔表达式为 `true`，因此执行\
  \ `else` 之前的语句。该语句仅仅是一个 `cout` 语句，将参数 `1` 写入屏幕，因此调用 `writeVertical(1)` 向屏幕写入 `1`\
  \ 并在没有任何递归调的情况下结束。\n\n当调用 `writeVertical(1)` 结束时，等待它结束的挂起计算从它之前停止的地方继续执行，如下所示：\n\
  \n![一个包含活动代码块的框叠加在一个包含挂起代码的框上。](img/ua14_00300.png)14.1-5 完整替代文本\n\n当这个挂起的计算恢复时，它执行一个\
  \ `cout` 语句，输出值 `12 % 10`，结果为 `2`。这结束了该计算，但还有另一个挂起的计算在等待恢复。当这最后一个挂起的计算恢复时，情况如下：\n\
  \n![一个包含活动代码块的框。](img/ua14_00400.png)14.1-6 完整替代文本\n\n当这最后一个挂起的计算恢复时，它输出值 `123 %\
  \ 10`，结果为 `3`，原始函数调用的执行此结束。果然，数字 `1`、`2` 和 `3` 已经按顺序每行一个写入屏幕。\n\n# 深入理解递归\n\n函数\
  \ `writeVertical` 的定义使用了递归。然而，在评估函数调用 `writeVertical(123)` 时，我们并没有做任何新奇或不同的操作。我们像处理之前章节中看到的任何函数调用一样来处理它。我们只是用参数\
  \ `123` 替换参数 `n`，然后执行函数定义体中的代码。当我们到达递归调用\n\n```\nwriteVertical(123 / 10);\n```\n\
  \n时，我们只是简单地重复了这一过程。\n\n计算机会跟踪递归调用。当函数被调用时，计算机代入参数并开始执行代码。如果它遇到递归调用，将暂时停止计算，因为它必须在知道递归调的结果之前才能继续。它会保存之后继续所需的所有信息。当递归调用完成后，外层计算继续。\n\
  \nC++ 语言对在函数定义中如何使用递归调用没有限制。然而，为了使递归函数定义有用，必须设计成使得任何对函数的调用最终都能终止。成功的递归函数定义的概括如下：\n\
  \n- 一个或多个通过递归调用完成较小任务来完成任务的情况。\n- 一个或多个不使用任何递归调用完成任务的情况。这些不使用递归调用的情况被称为**基准情况**（base\
  \ cases）或**停止情况**。通常，`if-else` 语句决定执行哪种情况。典型的场景是原始函数调用执行包含递归调用的情况。该递归调用可能会反过来执行另一个需要递归调用的情况。递归调用多次产生另一个递归调用，但最终应该适用停止情况。*每次函数调用最终必须指向停止情况，否则由于无限递归链，函数调用将不会结束。*（在实践中，无限递归链的调用通常会异常终止而不是一直运行。）\n\
  \n确保最终到达停止情况的最常见方法是编写函数，使得每次递归调用时某个（正）数值数量都会减少，并为某个“小”值提供一个停止情况。这就是我们在显示 14.1 中设计\
  \ `writeVertical` 函数的方式。\n\n### 自测练习\n\n1. 下程序的输出是什么？\n\n\n\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nvoid cheers(int n);\nint main()\n{\n    cheers(3);\n\
  \    return 0;\n}\nvoid cheers(int n)\n{\n    if (n == 1)\n    {\n            cout\
  \ << \"Hurray\\n\";\n    }\n    else\n    {\n            cout << \"Hip \";\n   \
  \         cheers(n − 1);\n    }\n}\n```\n\n2. 编写一个递归的 `void` 函数，该函数包含一个正整数参数，并在屏幕上同一行输出该数量的星号\
  \ `'*'`。\n\n3. 编写一个递归的 `void` 函数，它包含一个正整数参数。当被调用时，函数会将参数倒序输出到屏幕上。例如，如果参数是 `1234`，它会在屏幕上输出：\n\
  \n```\n4321\n```\n\n4. 编写一个递归的 `void` 函数，它接受一个 `int` 参数 `n` 并输出整数 `1, 2, ..., n`。\n\
  \n5. 编写一个递归的 `void` 函数，它接受一个 `int` 参数 `n` 并输出整数 `n, n–1, ..., 3, 2, 1`。（*提示：* 注意，你可以将自测试练习\
  \ 4 的代码转换为自测试练习 5 的代码，或者反之，只需交换两行代码即可。）\n\n# 用于递归的栈\n\n为了跟踪递归以及许多其他事情，大多数计算机系统使用一种名为\
  \ `stack`（栈）的结构。`stack` 是一种非常特殊的内存结构，类似于一叠纸。在这个类比中，有无穷尽的额外空白纸供应。要将某些信息放入栈中，就将其写在这些纸的其中一张上并放在纸栈的顶部。要向栈中放入更多信息，就取一张干净的纸，在上面写上信息，并将这张新纸放在纸栈的顶部。通过这种直接的方法，可以在栈上放置越来越多的信息。\n\
  \n从栈中提取信息也是通过一个非常简单的程序实现的。可以读取顶部的纸，当它不再被需要时，将其丢弃。这里有一个复杂之处：只有顶部的纸是可以访问的。如果要读取顶部的第三张纸，必须先丢弃顶部的两张纸。由于最后放入栈的纸是第一个从栈中取出的，栈通常被称为\
  \ `last-in/first-out (LIFO)`（后进先出）内存结构。\n\n使用栈，计算机可以轻松地跟踪递归。每当函数被调用时，就会取一张新纸。函数的定义被复制到这张纸上，并将参数填入函数参数中。然后计算机开始执行函数定义的体。当它遇到递归调用时，它会停止在该张纸上进行的计算，以便计算递归调用。但在计算递归调用之前，它会保存足够的信息，以便当它最终完成递归调用时，可以继续之前停止的计算。这些保存的信息被写在一张纸上并放在栈中。递归调用将使用一张新纸。计算机在这张新纸上写出函数的第二个副本，为函数参数填入参数，并开始执行递归调用。当它在递归调用的副本内部遇到递归调用时，它会重复在栈上保存信息并使用新纸进行新递归调用的过程。这一过程在名为“跟踪递归调用”的小节中有所插图。尽管我们在该节中没有称其为栈，但层层叠加的计算插图展示了栈的操作。\n\
  \n这个过程一直持续直到某个函数的递归调用完成了它的计算且没有产生更多的递归调用。当这种情况发生时，计算机转向栈上顶部的纸。这张纸包含了部分完成的计算，它正在等待刚刚结束的递归计算。因此，可以继续那个挂起的计算。当该挂起的计算结束时，计算机丢弃那张纸，栈中其下方的挂起计算就变成了栈顶部的计算。计算机转向现在位于栈顶部的挂起计算，以此此类推。该过程一直持续到底部纸上的计算完成。取决于进行了多少次递归调用以及定义是如何定义的，栈可能会以任何方式增长和收缩。注意，栈中的纸只能以后进先出的方式访问，但这恰恰是跟踪递归调用所需要的。每个挂起的版本都在等待栈中直接位于它上面的版本的完成。\n\
  \n不言而明，计算机并没有这种纸的栈。这只是一个类比。计算机使用内存的一部分而不是纸片。这些内存部分之一（“纸”）的内容被称为 `activation frame`（激活帧）。这些激活帧按照我们刚刚讨论的后进先出方式进行处理。（激活帧并不包含函数定义的完整副本，而仅仅引用函数定义的单个副本。然而，一个激活帧包含了足够的信息，允许计算机表现得好像该帧包含了函数定义的完整副本。）\n\
  \n# 递归与迭代\n\n递归并不是绝对必要的。事实上，某些编程语言并不允许递归。任何可以使用递归完成的任务也可以通过其他方式完成。函数的非递归版本通常使用某种类型的循环（或多个循环）来代替递归。出于这个原因，非递归版本通常被称为\
  \ `iterative version`（迭代版本）。如果将函数 `writeVertical` 的定义替换为迭代版本，输出将是相同的。正如在本例所示，函数的递归版本有时比迭代版本要简单得多。\n\
  \n\n\n\n\n递归编写的函数通常运行速度比等效的迭代版本慢，使用的存储空间更多。虽然显示 14.2 中给出的 `writeVertical` 迭代版本看起来比显示\
  \ 14.1 中的递归版本使用了更多的存储空间并执行了更多计算，但这两个版本的 `writeVertical` 实际上使用的存储空间和执行的计算量是相当的。事实上，递归版本可能会使用更多的存储空间，且运行速度稍慢，因为计算机必须花费大量工作来操作栈以跟踪递归。然而，由于系统会自动为你完成这一切，使用递归有时可以让你作为程序员的工作变得更简单，并且有时可以产生更容易理解的代码。正如你在本章的示例以及自测练习和编程项目中所看到的，有时递归定义更简单、更清晰；而在其他时候，迭代定义更简单、更清晰。\n\
  \n### 自测练习\n\n6. 如果你的程序产生了显示为 `stack overflow,` 的错误信息，错误的可能来源是什么？\n\n7. 为自测练习 1\
  \ 中定义的函数 `cheers` 编写一个迭代版本。\n\n8. 为自测练习 2 中定义的函数编写一个迭代版本。\n\n9. 为自测练习 3 中定义的函数编写一个迭代版本。\n\
  \n10. 追溯你为自测练习 4 编写的递归解决方案。\n\n11. 追溯你为自测练习 5 编写的递归解决方案。\n\n# 14.2 用于数值的递归函数\n\n\
  > 迭代是人性的，递归是神性的。\n\n> 匿名作者\n\n# 返回数值的递归函数的通用形式\n\n到目前为止你看到的递归函数都是 `void` 函数，但递归并不限于\
  \ `void` 函数。递归函数可以返回任何类型的值。设计返回值的递归函数的技术与设计 `void` 函数的技术基本上相同。一个成功的返回值的递归函数定义大纲如下：\n\
  \n*   在一个或多个情况中，返回的值是通过对同一函数的调用（即使用递归调用）来计算的。正如 `void` 函数的情况一样，递归调用的参数在直觉上应该是“更小”的。\n\
  \n*   在一个或多个情况中，返回的值是在不使用任何递归调用的情况下计算的。这些没有递归调用的情况被称为**基准情况**或**停止情况**（就像 `void`\
  \ 函数的情况一样）。\n\n这种技术在下一个编程示例中得到了说明。\n\n# 编程示例：另一个幂函数\n\n在第 4 章中我们介绍了计算幂的预定义函数。例如，`pow(2.0,3.0)`\
  \ 返回 `2.0`^(`3.0`)，因此以下代码将变量 `x` 设置为 `8.0`：\n\n```\ndouble x = pow(2.0, 3.0);\n\
  ```\n\n`pow` 函数接受两个 `double` 类型的参数并返回一个 `double` 类型的值。显示 14.3 包含了一个相似函数的递归定义，但它处理的是\
  \ `int` 类型而不是 `double` 类型。这个新函数被称为 `power`。例如，由于 `2`^(`3`) 是 `8`，以下代码将把 `y` 的值设为\
  \ `8`：\n\n```cpp\nint y = power(2, 3);\n```\n\n```cpp\n 1    //演示递归函数 power 的程序。\n\
  \ 2    #include <iostream>\n 3    #include <cstdlib>\n 4    using namespace std;\n\
  \ 5    int power(int x, int n);\n 6    //前条件：n >= 0。\n 7    //返回 x 的 n 次方。\n 8 \
  \   int main( )\n 9    {\n10        for (int n = 0; n < 4; n++)\n11            cout\
  \ << \"3 to the power \" << n\n12                 << \" is \" << power(3, n) <<\
  \ endl;\n13        return 0;\n14    }\n15    //使用 iostream 和 cstdlib:\n16    int\
  \ power(int x, int n)\n17    {\n18        if (n < 0)\n19        {\n20          \
  \  cout << \"Illegal argument to \";\n21        }\n22        if (n > 0)\n23    \
  \        return power(x, n - 1) * x;\n24        else\n25            return 1;\n\
  26    }\n```\n*（注：提示中提供的源代码在末处断断化/损坏了；我已清理了逻辑以反映一个标准的递归幂函数，同时保持了所要求的上下文。）*\n\n\n\
  \n\n\n当计算机到达停止情况 `power(2,0)` 时，有三个挂悬的计算。在计算完停止情况返回的值后，它会恢复最近一次挂悬的计算，以确定 `power(2,1)`\
  \ 的值。之后，计算机将完成其他每个挂悬的计算，将计算出的每个值作为值代入另一个挂悬的计算中，直到到达并完成原始调用 `power(2,3)` 的计算。整个计算的细节如显示\
  \ 14.4 所示。\n\n![评估递归函数调用 power (2, 3) 的图表](img/fg14_00400.png)\n\n## 显示 14.4 评估递归函数调用\
  \ `power (2, 3)`\n\n图 14.4 完整备用文本\n\n### 自测练习\n\n12. 下一个程序的输出是什么？\n\n```cpp\n#include\
  \ <iostream>\nusing namespace std;\nint mystery(int n);\n//前置条件 n >= 1.\nint main()\n\
  {\n    cout << mystery(3);\n    return 0;\n}\nint mystery(int n)\n{\n    if (n <=\
  \ 1)\n        return 1;\n    else\n        return ( mystery(n − 1) + n );\n}\n```\n\
  \n13. 下一个程序的输出是什么？`rose` 是什么著名的数学函数？\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\nint rose(int n);\n//前置条件: n >= 0.\nint main()\n{\n    cout << rose(4);\n\
  \    return 0;\n}\nint rose(int n)\n{\n    if (n <= 0)\n        return 1;\n    else\n\
  \        return ( rose(n − 1) * n );\n}\n```\n\n14. 重新定义函数 `power` 以使其适用于负指数。为了实现这一点，你还必须将返回值的类型改为\
  \ `double`。重新定义版本 `power` 的函数声明和头文件注释如下：\n\n```cpp\ndouble power(int x, int n);\n\
  //前置条件: 如果 n < 0，则 x 不为 0。\n// 返回 x 的 n 次方。\n```\n\n(*提示：* `x`^(–n) 等于 1/(`x`^n)。)\n\
  \n## 14.3 递归地思考\n\n> 世界上只有两种人：一类是将世界分为两类人，另一类则不是。\n\n匿名人士\n\n## 递归设计技术\n\n在定义和使用递归函数时，你并不希望一直关注栈和挂悬的计算。递归的威力在于你可以忽略这些细节，并让计算机为你完成记账工作。考虑显示\
  \ 14.3 中的 `power` 函数示例。`power`定义的思考方式如下：\n\n```\npower(x, n) 返回 power (x, n − 1)\
  \ * x\n```\n\n由于 `x`^n 等于 `x`^(n–1) * `x`，只要计算始终能到达停止情况并正确计算停止情况，这就是要返回的正确值。因此，在检查了定义的递归部分是正确的之后，你只需要检查递归调用链是否始终到达停止情况，以及停止情况是否始终返回正确的值。\n\
  \n当你设计递归函数时，你不需要追踪你程序中该函数实例的整个递归调用序列。如果函数返回一个值，你所做的只是确认满足以下三个属性：\n\n1. 没有无限递归。（递归调用可能会导致另一个递归调用，而该调用又可能导致另一个调用，依此类推，但每一条这样的递归调用链最终都会到达停止情况。）\n\
  2. 每个停止情况都为该情况返回正确的值。\n3. 对于涉及递归的情况：*如果*所有递归调用都返回正确的值，*那么*函数返回的最终值就是正确的值。\n\n例如，考虑显示\
  \ 14.3 中的 `power` 函数：\n\n1. 没有无限递归：`power(x,n)` 的第二个参数在每次递归调用中都减 `1`，因此任何递归调用链最终都会到达\
  \ `power(x,0)` 情况，这正是停止情况。因此，没有无限递归。\n2. 每个停止情况都为该情况返回正确的值：唯一的停止情况是 `power(x,0)`。`power(x,0)`\
  \ 的调用总是返回 `1`，而 `x`⁰的正确值正是 `1`。因此停止情况返回了正确的值。\n3. 对于涉及递归的情况——如果所有递归调用都返回正确的值，那么函数返回的值就是正确的：涉及递归的情况是\
  \ `n>1`。当 `n>1` 时，`power(x,n)` 返回：\n\n```\npower(x, n − 1) * x\n```\n\n为了证明这是要返回的正确值，注意：*如果*\
  \ `power(x,n-1)` 返回正确的值，*那么* `power(x,n)` 返回\n\n```\nxn−1 * x\n```\n\n即 `xn`，这是\
  \ `power(x,n)` 的正确值。\n\n## 案例研究：二分查找——递归思考的示例\n\n在这个案例研究中，我们开发了一个递归函数来搜索数组以是否包含特定值。例如，数组可能包含一组无效的信用卡列表。店员需要搜索列表以查看客户的卡片是否有效。在第\
  \ 7 章（显示 7.10)）中我们讨论过通过简单检查每个数组元素的简单搜索方法。在本节中，我们将开发一种对于搜索排序数组要快得多的方法。\n\n数组 `a`\
  \ 的索引是从 `0` 到 `finalIndex` 的整数。为了让搜索数组的任务更容易，我们假设数组是有排序的。因此，我们知道如下：\n\n```\na[0]\
  \ <= a[1] <= a[2] <= … <= a[finalIndex]\n```\n\n\n\n\n我们将设计该函数，使用两个引用参数来返回搜索结果。其中一个名为\
  \ `found` 的参数类型为 `bool`。如果找到了该值，则 `found` 将被设置为 `true`。如果找到了该值，另一个名为 `location`\
  \ 的参数将被设置为所找到的值的索引。如果我们用 `key` 来表示要搜索的值，那么要完成的任务可以精确地表述如下：\n\n```\n前置条件：a[0] 到 a[finalIndex]\
  \ 按升序顺序排列。\n后置条件：如果 key 不是 a[0] 到 a[finalIndex] 中的值之一，则 found == false；否则，a[location]\
  \ == key 且 found == true。\n```\n\n# 算法设计\n\n现在，让我们开始编写一个算法来解决这个任务。这有助于我们以非常具体的方式将问题可视化。假设数字列表非常长，长到需要用一本书才能列出所有数字。这实际上是无效信用卡号分发给没有计算机的商店的方式。如果你是一名收银员并拿到了一张信用卡，你必须检查它是否在列表中，从而判断它是无效的。\n\
  \n你会如何操作？打开书的中间，看看数字是否在那里。如果不在，且它比中间的数字小，就向书的开头回溯。如果该数字比中间的数字大，你就向书的末尾查找。这个想法产生了我们算法的第一草稿：\n\
  \n```\nfound = false; // 目前为止。\nmid = 0 和 finalIndex 之间的近似中间点;\nif (key == a[mid])\n\
  {\n    found = true;\n    location = mid;\n}\nelse if (key < a[mid])\n    search\
  \ a[0] 到 a[mid − 1];\nelse if (key > a[mid])\n    search a[mid + 1] 到 a[finalIndex];\n\
  ```\n\n由于对较短列表的搜索是我们正在设计的算法任务的小版本，因此该算法自然适用于递归。可以通过对算法自身的递归调用对较短列表进行搜索。\n\n我们的伪代码有点太不精确，不容易转换为\
  \ C++ 代码。问题在于递归调用。图中显示了两个递归调用：\n\n```\nsearch a[0] 到 a[mid − 1];\n```\n\n和\n\n```\n\
  search a[mid + 1] 到 a[finalIndex];\n```\n\n为了实现这些递归调用，我们需要另外两个参数。递归调用指定了要搜索数组的一个子范围。一种情况下，它是索引为\
  \ `0` 到 `mid-1` 的元素；在另一种情况下，它是索引为 `mid+1` 到 `finalIndex` 的元素。这两个额外的参数将指定搜索的起始和结束索引，我们将它们称为\
  \ `first` 和 `last`。使用这些参数作为最低和最高索引，而不是 `0` 和 `finalIndex`，我们可以更精确地将伪代码表达：\n\n```\n\
  要搜索 a[first] 到 a[last]，执行以下操作：\nfound = false; // 目前为止。\nmid = first 和 last 之间的近似中间点;\n\
  if (key == a[mid])\n{\n    found = true;\n    location = mid;\n}\nelse if (key <\
  \ a[mid])\n    search a[first] 到 a[mid − 1];\nelse if (key > a[mid])\n    search\
  \ a[mid + 1] 到 a[last];\n```\n\n为了搜索整个数组，执行算法时将 `first` 设置为 `0`，将 `last` 设置为 `finalIndex`。递归调用将对\
  \ `first` 和 `last` 使用其他值。例如，第一次递归调用将 `first` 设置为 `0`，并将 `last` 设置为计算出的值 `mid-1`。\n\
  \n与任何递归算法一样，我们必须确保算法会结束，而不是产生无限递归。如果在列表中找到了所需的数字，则没有递归调用且过程终止，但我们需要某种方法来检测数字何时不在列表中。在每次递归调用中，`first`\
  \ 的值都会增加或 `last` 的值都会减小。如果它们相互交错且 `first` 实际上变得大于 `last`，那么我们就知道没有更多的索引可以检查了，且数字\
  \ `key` 不在数组中。如果我们向伪代码添加这个测试，就可以得到一个完整的解决方案，如显示 14.5 所示。\n\n```\nint a[Some_Size_Value];\n\
  搜索 a[first] 到 a[last] 的算法\n 1    //前置条件：\n 2    //a[first]<= a[first + 1] <= a[first\
  \ + 2] <= … <= a[last]\n```\n\n**定位值 `key`：**\n\n```\n 1    if (first > last) //\
  \ 停止情况\n 2        found = false;\n 3    else\n 4    {\n 5        mid = first 和 last\
  \ 之间的近似中间点;\n 6        if (key == a[mid]) // 停止情况\n 7        {\n 8            found\
  \ = true;\n 9            location = mid;\n 10        }\n 11        else if (key\
  \ < a[mid])\n 12            search a[first] 到 a[mid − 1];\n 13        else if (key\
  \ > a[mid])\n 14            search a[mid + 1] 到 a[last];\n 15    \n```\n\n# 二分查找的伪代码\n\
  \n现在我们可以例行地将伪代码转换为 C++ 代码。结果如显示 14.5。\n\n```\n1    演示递归函数的程序。\n2    #include <iostream>\n\
  3    using namespace std;\n4    const int ARRAY_SIZE = 10;\n5     \n6     \n7  \
  \  void search(const int a[], int first, int last,\n8               int key, bool&\
  \ found, int& location);\n9    //前置条件：a[first] 到 a[last] 按升序顺序排列。\n10   //后置条件：如果\
  \ key 不是 a[first] 到 a[last] 中的值之一，\n11   then found == false；否则，a[location] == key\
  \ 且 found == true。\n12     \n13     \n14   int main( )\n15   {\n16        int a[ARRAY_SIZE];\n\
  17        int finalIndex = ARRAY_SIZE − 1;\n18     \n< 程序的这部分包含一些填充和排序数组 a 的代码。具体细节与此示例无关。\n\
  19        int key, location;\n20        bool found;\n21        cout << \"要查找的数字：\"\
  ;\n22        cin >> key;\n23        search(a, 0, finalIndex, key, location);\n24\
  \     \n25        if (found)\n26            cout << key << \" 在索引 \"\n27       \
  \          << location <<endl;\n28        else\n29            cout << key << \"\
  \ 不在数组中。\" <<endl;\n30     \n31        return 0;\n32    }\n33    void search(const\
  \ int a[], int first, int last,\n34               int key, bool& found, int& location)\n\
  35    {\n36        int mid;\n37        if (first > last)\n38        {\n39      \
  \      found = false;\n40        }\n41        else\n42        {\n43            mid\
  \ = (first + last)/2;\n44     \n45            if (key == a[mid])\n46           \
  \ {\n47                found = true;\n48                location = mid;\n49    \
  \        }\n50            else if (key < a[mid])\n51            {\n52          \
  \      search(a, first, mid −1, key, found, location);\n53            }\n54    \
  \        else if (key > a[mid])\n55            {\n56                search(a, mid\
  \ + 1, last, key, found, location);\n57            }\n58        }\n59    }\n```\n\
  \n该函数在示例数组上执行的图表如图 14.6 所示。\n\n# 显示 14.6 二分查找的递归函数\n\n![显示函数 search 执行过程的图表](img/fg14_0070.png)\n\
  \n# 显示 14.7 函数 `search` 的执行\n\n图 14.7 完整替代文本\n\n\n\n\n注意，`search` 函数解决了一个比原始任务更通用的问题。我们的目标是设计一个搜索整个数组的函数。然而，该函数允许我们通过指定索引边界\
  \ `first` 和 `last` 来搜索数组的任何区间。这在设计递归函数时很常见。通常，为了能够表达递归算法，有必要解决一个更通用的问题。在这种情况下，我们只需要在\
  \ `first` 和 `last` 被设置为 `0` 和 `finalIndex` 的情况下获得答案。但是，递归调用会将它们设置为 `0` 和 `finalIndex`\
  \ 以外的值。\n\n# 检查递归\n\n在“递归设计技术”小节中，我们给出了你应该检查的三个标准，以确保递归 `void` 函数定义是正确的。让我们针对 显示\
  \ 14.6 中提供的 `search` 函数检查这三点。\n\n1. 没有无限递归：在每次递归调用中，`first` 的值都会增加或 `last` 的值都会减少。如果递归调用链不以其他方式结束，那么最终函数被调用时\
  \ `first` 将大于 `last`，这就是停止情况。\n\n2. 每个停止情况都为该情况执行了正确的操作：有两个停止情况：当 `first` > `last`\
  \ 和当 `key==a[mid]` 时。让我们考虑每种情况。\n\n    如果 `first` > `last`，`a[first]` 和 `a[last]`\
  \ 之间没有数组元素，因此 `key` 不在数组的这段内存中。（该段内没有任何元素！）所以，如果 `first` > `last`，函数 `search` 正确地将\
  \ `found` 设置为 `false`。\n\n    如果 `key==a[mid]`，算法正确地将 `found` 设置为 `true` 并将 `location`\
  \ 设置为 `mid`。因此，两种停止情况都是正确的。\n\n3. 对于涉及递归的每个情况，如果所有递归调用都正确执行了它们的操作，那么整个情况的执行都是正确的：有两种情况存在递归调用：当\
  \ `key` < `a[mid]` 和当 `key` > `a[mid]` 时。我们需要检查这两种情况的每一个。\n\n    首先假设 `key` < `a[mid]`。在这种情况下，由于数组是有序的，我们知道如果\
  \ `key` 在数组的任何地方，那么 `key` 就是从 `a[first]` 到 `a[mid−1]` 的元素之一。因此，函数只需要搜索这些元素，这正是递归调用\n\
  \n    ```\n    search(a, first, mid − 1, key, found, location);\n    ```\n\n   \
  \ 所做的。所以，如果递归调用是正确的，整个操作就是正确的。\n\n    接下来，假设 `key` > `a[mid]`。在这种情况下，由于数组是有序的，我们知道如果\
  \ `key` 在数组的任何地方，那么 `key` 就是从 `a[mid+1]` 到 `a[last]` 的元素之一。因此，函数只需要搜索这些元素，这正是递归调用\n\
  \n    ```\n    search(a, mid + 1, last, key, found, location);\n    ```\n\n    所做的。所以如果递归调用是正确的，整个操作就是正确的。因此，在两种情况下，函数都执行了正确的操作（假设递归调用执行了正确的操作）。\n\
  \n`search` 函数通过了我们的所有三个测试，因此是一个良好的递归函数定义。\n\n# 效率\n\n与简单按顺序尝试所有数组元素的算法相比，二分查找算法极快。在二分查找中，你从一开始就排除了大约一半的数组在考虑范围之外。然后你排除掉四分之一，然后是八分之一，以此此类推。这些节省累积成了一个极快速的算法。对于一个包含\
  \ 100 个元素的数组，二分查找不需要与 key 比较超过 7 个数组元素。一个简单的顺序搜索可能会与 key 比较多达 100 个数组元素，并且平均情况下会与\
  \ key 比较大约 50 个数组元素。此外，数组越大，节省的效果就越显著。对于一个包含 1000 个元素的数组，二分查找只需要与 key 值比较大约 10 个数组元素，而简单的顺序搜索算法平均需要比较\
  \ 500 次。\n\n`search` 函数的迭代版本见于 显示 14.8。在某些系统上，迭代版本的运行比递归版本更高效。迭代版本的算法是通过镜像递归版本得出的。在迭代版本中，局部变量\
  \ `first` 和 `last` 镜像了递归版本参数的作用，这些参数也命名为 `first` 和 `last`。正如示例所示，即使你预计以后会将其转换为迭代算法，推导出递归算法通常是有意义的。\n\
  \n## 函数声明\n\n```\n 1    void search(const int a[], int lowEnd, int highEnd,\n 2\
  \    int key, bool& found, int& location);\n3    //前置条件：a[lowEnd] 到 a[highEnd] 是有序的。\n\
  4    //后置条件：如果 key 不在 a[lowEnd] 到 a[highEnd] 之间，则 found == false；否则 a[location]\
  \ == key 且 found == true。\n```## 函数定义\n\n```\n 1    void search(const int a[], int\
  \ lowEnd, int highEnd,\n 2        int key, bool& found, int& location)\n 3    {\n\
  \ 4        int first = lowEnd;\n 5        int last = highEnd;\n 6        int mid;\n\
  \ 7     \n 8        found = false; //到目前为止\n 9        while ((first <= last) &&\
  \ !(found) )\n10       {\n11            mid = (first + last)/2;\n12            if\
  \ (key == a[mid])\n13            {\n14                found = true;\n15        \
  \        location = mid;\n16            }else if (key < a[mid])\n17            {\n\
  18                last = mid − 1;\n19            }else if (key > a[mid])\n20   \
  \         {\n21                first = mid + 1;\n22            }\n23       }\n24\
  \   }\n```\n# 显示 14.8 二分查找的迭代版本\n\n# 编程示例递归成员函数\n\n类的成员可以是递归的。成员函数可以像普通函数一样使用递归。显示中使用的\
  \ `class BankAccount` 类与 显示 10.6 中定义的 `named BankAccount` 类相同，但我们重载了成员函数 `update`。`update`\
  \ 的第一个版本没有参数，向银行账户余额增加一年的单利。另一个（新的）`update` 版本带有 `int` 参数，表示年份。该成员函数通过发布相应多年的利息来更新账户。新版本的\
  \ `update` 是递归的；有一个参数称为 `years`；并使用以下算法：\n\n*   如果年份为 1，那么//停止情况：\n\n    *   调用另一个名为\
  \ `update` 的函数（无参数的版本）。\n\n*   如果 `years` 大于 1，那么//递归情况：\n\n    *   进行递归调用发布 `years-1`\
  \ 年的利息，然后调用另一个名为 `update` 的函数（无参数的版本）来发布额外一年的利息。\n\n\n\n\n\n1. 不存在无限递归：每次递归调用都会将\
  \ `years` 的数量减少 `1`，直到 `years` 最终变为 `1`，这就是停止情况。因此，不存在无限递归。\n\n2. 每个停止情况都为该情况执行了正确的操作：唯一的停止情况是\
  \ `years==1`。这种情况会产生正确的操作，因为它简单地调用了另一个名为 `update` 的重载成员函数，而我们已经在第 10 章中检查过该函数的正确性。\n\
  \n3. 对于涉及递归的情况，如果所有递归调用都执行正确，那么整个情况就会执行正确：递归情况——即 `years>1`——工作正常，因为如果递归调用正确地发布了\
  \ `years-1` 年的利息，那么只需要再额外发布一年的利息，并调用 `update` 的零参数重载版本即可正确发布一年的利息。因此，*如果*递归调用执行了正确的操作，*那么*\
  \ `years>1` 情况的整个操作将是正确的。\n\n在这个示例中，我们重载了 `update`，使得有两个名为 `update` 的不同函数：一个不接受参数，另一个接受一个参数。不要混淆对这两个名为\
  \ `update` 的函数的调用。它们是两个不同的函数，对于编译器来说，它们只是碰巧具有相同的名称。当带有一个参数的函数 `update` 的定义中包含对不接受参数的\
  \ `update` 版本的调用时，那并不是递归调用。只有对与函数声明完全相同的 `update` 调用才是递归调用。为了理解其中的原理，请注意我们可以将不接受参数的\
  \ `update` 版本命名为 `postOneYear()`而不是 `update()`，那么递归版本 `update` 的定义将如下：\n\n```cpp\n\
  void BankAccount::update(int years)\n{      if (years == 1)\n    {\n        postOneYear();\n\
  \    }     else if (years > 1)\n    {\n        update(years − 1);\n        postOneYear();\n\
  \    }\n}\n```\n\n### 自测题\n\n15. 为以下函数编写递归函数定义：\n\n```cpp\nint squares(int n); //前置条件：n\
