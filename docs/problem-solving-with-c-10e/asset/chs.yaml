  \ `a`、`b` 和 `c` 的所有组合都能构成三角形。你的函数应该对合法数据产生正确结果，并对非法组合产生合理结果。\n\n# 编程项目\n\n编程项目比练习程序需要更多的问题解决能力，并且通常有许多不同的解决方法。访问\
