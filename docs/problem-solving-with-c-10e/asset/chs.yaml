  40    }\n```\n\n***示例对话***\n\n```\nEnter 4 个数字进行缩放: 2600 999 465 3501\n缩放到 1000\
  \ 倍后的数值为: 3 1 0 4\n```\n\n# 显示 7.7 函数 `scale`\n\n其结果为 `floor(3.1)`，即为 `3.0`。事实上，对于任何大于或等于\
  \ `2.5` 且小于等于 `3.0` 的数字，该数字加上 `0.5` 将大于 `3.0`。因此，用 `roundNum` 调用任何大于或等于 `2.5` 且小于等于\
  \ `3.0` 的数字将返回 `3`。\n\n因此，`roundNum` 对于 `2.0` 到 `3.0` 之间的所有参数都能正常工作。显然，`2.0` 到 `3.0`\
  \ 之间的参数并没有特殊之处。类似的参数适用于所有非负数。因此，`roundNum` 对于所有非负参数都能正常工作。\n\n# 测试 `scale`\n\n[显示\
  \ 7.7] 包含一个 `scale` 函数的演示程序，但 `round` 和 `scale` 函数的测试程序应该比这个简单的程序更详细。特别是，它们应该允许你多次重新测试被测试的函数，而不是只有一次。我们不会提供完整的测试程序，但你应该首先在它自己的驱动程序中测试\
  \ `round`（它被 `scale` 使用），然后在另一个驱动程序中测试 `scale`。测试 `round` 的程序应该测试参数为 `0` 的情况、测试向上舍入的参数（如\
  \ `2.6`）以及测试向下舍入的参数（如 `2.3`）。测试 `scale` 的程序应该对数组元素测试类似的多种数值。\n\n# 函数 `graph`\n\n\
