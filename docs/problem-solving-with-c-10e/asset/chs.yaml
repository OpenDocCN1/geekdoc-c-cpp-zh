  \ `&` 的规则中的某些神秘感。\n\n当你向返回类型的名称添加 `&` 时，你是在表示运算符（或函数）返回一个`引用`。我们到目前为止的所有函数和运算符都返回值。然而，如果返回类型是流，你不能简单地返回流的值。对于流来说，流的值是整个文件、键盘或屏幕，返回这些内容可能没有意义。因此，你只想返回流本身，而不是流的值。当你向返回类型的名称添加\
  \ `&` 时，你是在表示运算符（或函数）返回一个`引用`，这意味着你返回的是对象本身，而不是对象的值。\n\n提取运算符 `>>` 的重载方式与我们描述插入运算符\
  \ `<<` 的描述是类似的。然而，对于提取（输入）运算符 `>>`，第二个参数将是接收输入值的对象，因此第二个参数必须是一个普通的按引用传递参数。以大纲形式，重载提取运算符\
