  \ | `cmath` |\n\n# 附录 5 内联函数\n\n当成员函数的定义很短，你可以在类的内部给出函数定义。你只需将成员函数声明替换为成员函数定义；但是，由于定义是在类内部，你不需要包含类名和作用域解析运算符。例如，下面定义的\
  \ `Pair` 类对其两个构造函数以及成员函数 `getFirst` 提供了内联函数定义：\n\n```\nclass Pair\n{\npublic:\n\
  \    Pair( ) {}\n    Pair(char firstValue, char secondValue)\n        : first(firstValue),\
  \ second(secondValue) {}\n    char getFirst()\n    {\n        return first;\n  \
  \  }\n    ...\nprivate:\n    char first;\n    char second;\n};\n```\n\n注意，内联函数定义的右括号后不需要分号，尽管在该处加上分号也没有错。\n\
  \n编译器对内联函数定义进行处理方式不同，因此它们通常运行得更快，尽管会消耗更多存储。对于内联函数，程序中的每个函数调用都会替换为函数定义的编译版本，因此对内联函数的调用没有普通调用的开销。\n\
  \n# 附录 6 重载数组索引方括号\n\n\n\n\n你可以为类重载方括号 `[]`，以便它们可以与该类的对象一起使用。如果你想在赋值运算符左侧的表达式中使用\
  \ `[]`，那么该运算符必须定义为返回一个引用，这通过在返回类型后添加 `&` 来指示。（这与我们讨论的重载 I/O 运算符 `<<` 和 `>>` 有相似之处。）在重载\
  \ `[]` 时，运算符 `[]` 必须是一个成员函数；重载的 `[]`不能是友元（friend）运算符。（在这方面，`[]` 的重载方式与赋值运算符 `=`\
  \ 的重载方式相似；重载 `=` 在第 11 章中名为“重载赋值运算符”的部分进行了讨论。）\n\n例如，下面的代码定义了一个名为 `Pair` 的类，其对象的行为类似于具有索引\
  \ 1 和 2（而不是 0 和 1）的字符数组：\n\n```\nclass Pair\n{\npublic:\n    Pair();\n    Pair(char\
  \ firstValue, char secondValue);\n    char& operator[](int index);\nprivate:\n \
  \   char first;\n    char second;\n};\n```\n\n成员函数 `[]` 的定义如下：\n\n```\nchar& Pair::operator[](int\
  \ index)\n{\n    if (index == 1)\n        return first;\n    else if (index == 2)\n\
  \        return second;\n    else\n    {\n        cout << \"Illegal index value.\\\
  n\";\n        exit(1);\n    }\n}\n```\n\n对象的声明和使用如下：\n\n```\nPair a;\na[1] = 'A';\n\
  a[2] = 'B';\ncout << a[1] << a[2] << endl;\n```\n\n注意，在 `a[1],` 中，`a` 是调用对象而 `1`\
  \ 是成员函数 `[]` 的参数。\n\n# 附录 7 `this` 指针\n\n在为类定义成员函数时，你有时想要引用调用对象。`this` 指针是一个预定义的指针，指向调用对象。例如，考虑如下所示类：\n\
  \n```\nclass Sample\n{\npublic:\n      ...\n    void showStuff();\n      ...\nprivate:\n\
  \    int stuff;\n      ...\n};\n```\n\n定义成员函数 `show_stuff` 的以下两种方式是等价的：\n\n```\n\
  void Sample::showStuff()\n{\n    cout << stuff;\n}\n//不是良好的风格，但它说明了 this 指针：\nvoid\
  \ Sample::showStuff()\n{\n    cout << (this->stuff);\n}\n```\n\n注意，`this` 不是调用对象的名称，而是指向调用对象的指针的名称。`this`\
  \ 指针的值不能被改变；它始终指向调用对象。\n\n正如上一个示例中使用 `this` 之前的注释所示，你通常不需要 `this` 指针。然而，在少数情况下，它是很有用的。\n\
  \n`this` 指针经常用到的其中一个地方是重载赋值运算符 `=`。例如，考虑以下类：\n\n```\nclass StringClass\n{\npublic:\n\
  \    ...\n    StringClass& operator =(const StringClass& right_side);\n    ...\n\
  private:\n    char *a;//以 '\\0' 结尾的字符串值的动态数组。\n};\n```\n\n下面的重载赋值运算符的定义可以用于赋值链，例如：\n\
  \n```\ns1 = s2 = s3;\n```\n\n这个赋值链意味着\n\n```\ns1 = (s2 = s3);\n```\n\n重载赋值运算符的定义使用\
  \ `this` 指针来返回 `=` 符号左侧的对象（即调用对象）：\n\n```\n//此版本在所有情况下都不起作用。另看下一个版本。\nStringClass&\
  \ StringClass::operator =(const StringClass& right_side)\n{\n    delete [] a;\n\
  \    a = new char[strlen(right_side.a) + 1];\n    strcpy(a, right_side.a);\n   \
  \ return *this;\n}\n```\n\n上面的定义在一种情况下确实存在问题：如果同一个对象出现在赋值运算符的双方（例如 `s=s;`），那么数组成员将被删除。为了避免这个问题，你可以使用\
  \ `this` 指针按如下方式测试这种特殊情况：\n\n```\n//修复了 bug 的最终版本：\nStringClass& StringClass::operator\
  \ =(\nconst StringClass& right_side)\n{\n    if (this == &right_side)\n    {\n \
  \       return *this;\n    }\n    else\n    {\n        delete [] a;\n        a =\
  \ new char [strlen(right_side.a) + 1];\n        strcpy(a, right_side.a);\n     \
  \   return *this;\n    }\n}\n```\n\n在第 11 章中名为“重载赋值运算符”的部分，我们以友元的形式重载了该运算符。\n\n\
  # 附录 8 作为成员变量重载运算符\n\n作为成员变量重载运算符起初看起来很奇怪，但很容易习惯这些新细节。许多专家主张始终作为成员重载运算符，而不是作为友元。这更符合对象编程的精神。然而，将二元运算符作为成员重载有一个很大的缺点。当你将二元运算符作为成员重载时，两个参数不再是对称的。一个是调用对象，只有第二个“参数”才是真正的参数。这不仅美观，而且有一个非常实际的缺陷。任何自动类型转换只适用于第二个参数。例如，以下内容是合法的：\n\
  \n```\nMoney baseAmount(100, 60), fullAmount;\nfullAmount = baseAmount + 25;\n```\n\
  \n这是因为 `Money` 有一个带 `long` 类型参数的构造函数，因此值 25 将被视为 `long` 值并自动转换为 `Money` 类型的值。\n\n\
  \n\n\n然而，如果你将 `+` 重载为成员运算符，那么你无法反转 `+` 的两个参数的操作。以下代码是非合法的：\n\n```\nfullAmount =\
  \ 25 + baseAmount;\n```\n\n这是因为 25 不能作为调用对象。将 `long` 值转换为 `Money` 类型对于参数是有效的，但对于调用对象则不然。\n\
  \n另一方面，如果你将 `+` 重载为友元（friend），那么以下代码是完全合法的：\n\n```\nfullAmount = 25 + baseAmount;\n\
