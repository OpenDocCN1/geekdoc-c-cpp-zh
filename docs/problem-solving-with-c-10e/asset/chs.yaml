  \ `Stack` 类的实现\n\n编写成员函数 `push` 的定义是自测试练习 10。然而，我们已经给出了任务的算法。`push` 成员函数的代码与显示 13.4\
  \ 中所示的 `headInsert` 函数基本上相同，不同之处在于成员函数 `push` 中，我们使用名为 `top` 的指针代替了名为 `head` 的指针。\n\
  \n空栈就是一个空链表，因此通过将指针 `top` 设置为 `NULL` 来实现空栈。一旦你意识到 `NULL` 代表空栈，默认构造函数和成员函数 `empty`\
  \ 的实现就显而易见了。\n\n拷贝构造函数的定义有点复杂，但没有使用任何我们还没有讨论过的技术。细节留给自测试练习 11。\n\n`pop` 成员函数首先检查栈是否为空。如果栈不空，它将继续移除栈顶部的字符。它将局部变量\
  \ `result` 设置为栈顶部的符号。操作如下：\n\n```cpp\nchar result = top->data;\n```\n\n在将顶节点中的符号保存到变量\
  \ `result` 之后，指针 `top` 移动到链表中的下一个节点，从而有效地从链表中删除了顶节点。指针 `top` 通过以下语句移动：\n\n```cpp\n\
  top = top->link;\n```\n\n然而，在移动指针 `top` 之前，会放置一个名为 `tempPtr` 的临时指针，使其指向即将从链表中移除的节点。然后可以通过以下调用\
  \ `delete` 来移除该节点：\n\n```cpp\ndelete tempPtr;\n```\n\n由成员函数 `pop` 从链表中移除的每个节点都会通过调用\
  \ `delete` 被销毁。因此，析构函数需要做的就是调用 `pop` 从栈中移除每个元素。然后，每个节点的内存将返回到空闲存储（freestore）。\n\n\
