  \n奥维德（OVID），《变形记》第四部\n\n## 黑盒类比\n\n使用程序的人不需要知道程序是如何编码的细节。想象一下，如果你必须知道并记住你所使用的编译器的代码，你的生活将是多么惨。程序有任务要执行，例如编译你的程序或检查论文中单词的拼写。你只需要知道程序的工作*是什么*，以便使用该程序，但你不需要（或至少不应该）知道程序*如何*执行其工作。函数就像一个小程序，也应该以类似的方式使用。在程序中使用函数的程序员需要知道该函数*执行了什么*（例如计算平方根或将温度从华氏度转换为摄氏度），但不需要知道函数*如何*完成其任务的。这通常被称为将函数视作一个*黑盒*。\n\
  \n将某物称为**黑盒**是一种修辞手法，旨在传达一种物理设备的形象：你 own 知道如何使用它，但它的操作方法是一个谜，因为它被封装在一个黑盒子里，你无法看到内部（也无法撬开它！）。如果一个函数设计得很好，程序员就可以像使用黑盒一样使用它。程序员只需要知道，如果向黑盒放入适当的参数，那么黑盒就会传出一个适当的返回值。将设计一个函数使其可以像黑盒一样使用有时被称为**信息隐藏**，以强调程序员的行为就像函数体已经从视图中隐藏了一的一样。\n\
  \n[显示 4.7] 包含了名为 `newBalance` 的函数声明和两种不同的定义。正如函数声明注释所解释的，函数 `newBalance` 在计入单利时计算银行账户的新余额。例如，如果账户初始金额为\
  \ 100 美元，账户存入了 4.5% 的利息，那么新余额为 104.50 美元。因此，以下代码将 `vacationFund` 的值从 `100.00` 改为\
  \ `104.50`：\n\n```\nvacationFund = 100.00;\nvacationFund = newBalance(vacationFund,\
  \ 4.5);\n```\n\n程序员使用 [显示 4.7] 中所示 `newBalance` 的哪种实现并不重要。这两种定义的函数返回完全相同的值。我们完全可以在函数定义的体上覆盖一个黑盒，让程序员不知道正在使用的是哪种实现。为了使用\
  \ `newbalance` 函数，程序员只需要读取函数声明和随附注释。\n\n### 函数声明\n\n```\n 1   double newBalance(double\
  \ balancePar, double ratePar);\n 2   //返回计入单利后银行账户的\n 3   //余额。形式参数 balancePar 是\n\
  \ 4   //旧余额。形式参数 ratePar 是利率。\n 5   //例如，如果 ratePar 为 5.0，则利率为 5%\n 6   //那么 newBalance(100,\
  \ 5.0) 返回 105.00。\n```\n\n### 定义 1\n\n```\ndouble newBalance(double balancePar,\
  \ double ratePar)\n{\n    double interestFraction, interest;\n\n    interestFraction\
  \ = ratePar/100;\n    interest = interestFraction * balancePar;\n    return (balancePar\
  \ + interest);\n}\n```\n\n### 定义 2\n\n```\ndouble newBalance(double balancePar,\
  \ double ratePar)\n{\n    double interestFraction, updatedBalance;\n\n    interestFraction\
  \ = ratePar/100;\n    updatedBalance = balancePar * (1 + interestFraction);\n  \
  \  return updatedBalance;\n}\n```\n\n# 显示 4.7 黑盒等效的定义\n\n像使用黑盒一样编写和使用函数也称为**过程抽象**。在用\
  \ C++ 编程时，将其称为*函数抽象*可能更有意义。然而，*过程*（procedure）是一个比*函数*（function）更通用的术语。计算机科学家使用*过程*一词指代所有“类函数”的指令集，因此他们使用*过程抽象*这一术语。*抽象*一词旨在传达这样观点：当你把函数当成黑盒使用时，你抽象掉了函数体中包含的代码细节。你可以将这种技术称为*黑盒原理*、*过程抽象原理*或*信息隐藏*。这三个术语的意思相同。无论你如何称呼这个原理，关键是在设计和编写函数定义时应该使用它。\n\
  \n# 编程技巧选择形式参数名称\n\n过程抽象原理认为，函数应该是相互独立的模块，与程序的其余部分分开设计。在大型编程项目中，可能会分配不同的程序员编写每个函数。程序员应该为形式参数选择他们能找到的最有意义的名称。替换形式参数的参数很可能是程序\
  \ `main` 部分的变量。这些变量也应该赋予有意义的名称，通常由编写函数定义的程序员以外的人选择。这使得某些或所有参数的名称与某些形式参数的名称相同。这是完全可以接受的。无论为作为参数的变量选择什么名称，这些名称都不会与形式参数的名称产生任何混淆。毕竟，函数将只使用参数的值。当你使用变量作为函数参数时，函数只获取变量的值，而忽略变量名称。\n\
  \n\n\n\n既然你已经知道在选择形式参数名称时完全完全自由，我们将不再在每个形式参数名称末尾加上 `\"Par\"`。例如，在显示 4.8 中，我们重写了函数\
  \ `totalCost` 的定义，其来源于显示 4.3，使得形式参数命名为 `number` 和 `price`，而不是 `numberPar` 和 `pricePar`。如果你将显示\
  \ 4.3 中出现的函数 `totalCost` 的函数声明和定义替换为显示 4.8 中的版本，那么程序的运行方式将完全相同，尽管此时会有名为 `number`\
  \ 和 `price` 的形式参数，并且程序的 `main` 部分会有同样命名为 `number` 和 `price` 的变量。\n\n### 函数声明\n\n\
  ```\n1     double totalCost(int number, double price);\n2     // 计算总成本，包括 5% 的销售税，\n\
  3     // 单价为 price 的 number 件物品。\n```\n\n### 函数定义\n\n```\n1     double totalCost(int\
  \ number, double price)\n2     {\n3        const double TAX_RATE = 0.05; // 5% 的销售税\n\
  4        double subtotal;\n5        subtotal = price * number;\n6        return\
