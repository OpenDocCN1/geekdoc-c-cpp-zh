  \        figureOut(a, b, c);\n        cout << a << \" \" << b << \" \" << c;\n \
  \       return 0;\n    }\n    void figureOut(int& x, int y, int& z)\n    {\n   \
  \     using namespace std;\n        cout << x << \" \" << y << \" \" << z << endl;\n\
  \        x = 1;\n        y = 2;\n        z = 3;\n        cout << x << \" \" << y\
  \ << \" \" << z << endl;\n    }\n    ```\n\n8. 如果在 `swapValues` 的函数声明和函数头中省略第一个参数的与符号\
  \ `&`，显示 5.4 中程序的输出将是什么？第二个参数的与符号未被移除。\n\n9. 如果将函数 `doStuff` 的函数声明更改如下所示，并更改函数头以匹配，使得形式参数\
  \ `par2Ref` 变为值传递参数，那么显示 5.6 中程序的输出将是什么？\n\n    ```cpp\n    void doStuff(int par1Value,\
  \ int par2Ref);\n    ```\n\n10. 编写一个名为 `zeroBoth` 的 `void` 函数定义，它具有两个类型为 *`int`*\
  \ 的引用参数，并将这两个变量的值设置为 `0`。\n\n11. 编写一个名为 `addTax` 的 `void` 函数定义。该函数有两个形式参数：`taxRate`（以百分比表示的销售税率）和\
  \ `cost`（税前的前的成本）。该函数改变 `cost` 的值，使其包含销售税。\n\n\n\n\n## 12. 返回值的函数可以有引用传递的参数吗？函数可以同时具有按值传递和按引用传递的参数吗？\n\
  \n## 5.3 使用过程抽象\n\n> 我的记忆力太差了，很多时候我忘了自己的名字！\n\n米格尔·德·塞尔万提斯·萨瓦德拉，《唐吉诃德》\n\n请记住，过程抽象原则指出，函数的设计应该使其能够像“黑盒”一样被使用。为了让程序员有效地使用一个函数，程序员只需要知道函数声明以及说明该函数功能的辅助注释。程序员不需要知道函数体中包含的任何细节。在本节中，我们将更详细地讨论与这一原则相关的若干主题。\n\
  \n## 函数调用函数\n\n函数体内部可以包含对另一个函数的调用。这类函数调用的情况与函数调用发生在程序的 `main` 函数中的情况完全相同；唯一的限制是函数声明应该在函数之前之前。如果你按照我们一直以来采用的方式设置程序，这种情况就会自动发生，因为所有的函数声明都在\
  \ `main` 函数之前，而所有的函数定义都在 `main` 函数之后。虽然你可以在另一个函数的定义内部包含函数调用，但不能将一个函数的定义放在另一个函数定义的体内部。\n\
  \n显示 5.8 显示了显示 5.4 中程序的增强版本。显示 5.4 中的程序总是反转变量 `firstNum` 和 `secondNum` 的值。显示 5.8\
  \ 中的程序只在某些时候反转这些变量。显示 5.8 使用了 `order` 函数来重新排列这些变量中的值，以确保：\n\n```\nfirstNum <= secondNum\n\
  ```\n\n![](img/fg05_00800.png) ![](img/p275-1.png)\n\n***示例对话***\n\n```\n输入两个整数：10\
  \ 5\n按升序排列的数字为：5 10\n```\n\n## 显示 5.8 `函数调用另一个函数`\n\n如果该条件已经成立，则对变量 `firstNum` 和\
  \ `secondNum` 不进行任何操作。然而，如果 `firstNum` 大于 `secondNum`，则调用 `swapValues` 函数来交换这两个变量的值。这种顺序测试和变量值的交换全在\
  \ `order` 函数体内部进行。因此，`swapValues` 函数在 `order` 函数体内部被调用。这没有产生特殊问题。利用过程抽象原则，我们将 `swapValues`\
  \ 函数认为是在执行一个动作（即交换两个变量的值）；无论该动作发生在何处，其本质都是相同的。\n\n## 前置条件和后置条件\n\n编写函数声明注释的一种良好方法将其拆分为两类信息，称为前置条件（precondition）和后置条件（postcondition）。`precondition`\
  \ 说明在调用函数时假设为真的条件。除非前提条件成立，否则不应使用该函数，也不能期望它能正确执行。`postcondition` 描述了函数调用的效果；也就是说，后置条件告诉我们在前提条件成立的情况下执行函数后将变为什么。对于返回值的函数，后置条件将描述函数返回的值。对于改变某些参数变量值的函数，后置条件将描述对参数值所的所有更改。\n\
  \n例如，显示 5.8 中所示的 `swapValues` 函数声明注释可以按如下格式：\n\n```\nvoid swapValues(int& variable1,\
  \ int& variable2)\n// Precondition: variable1 和 variable2 已给出\n// Postcondition:\
  \ variable1 和 variable2 的值已交换\n```\n（注：输入中此代码块的文本不完整，我根据上下文重构了逻辑）。\n\n\n\n\n\n一如既往，我们应该确保对程序所需的输入和产生的输出有清晰的陈述。\n\
  \n# 输入\n\n输入将包含物品的批发价以及该物品售出所需的预期天数。\n\n# 输出\n\n输出将给出该物品的零售价。\n\n# 问题分析\n\n与许多简单的编程任务一样，这个任务可以分解为三个主要的子任务：\n\
  \n1. 输入数据。\n2. 计算物品的零售价。\n3. 输出结果。\n\n这三个子任务将通过三个函数实现。这三个函数通过其函数声明和附带的注释进行描述。请注意，只有被函数修改的参数是引用传递（call-by-reference）。剩余的形参是值传递（call-by-value）。\n\
  \n```\nvoid getInput(double& cost, int& turnover);\n//前置条件：用户准备好正确输入值。\n//后置条件：cost\
  \ 的值已设置为\n//物品的批发价。turnover 的值已设置为\n//物品售出的预期天数。\n```\n\n```\ndouble price(double\
  \ cost, int turnover);\n//前置条件：cost 是一个物品的批发价。\n//turnover 是物品\n//售出的预期天数。\n//返回物品的零售价。\n\
  ```\n\n```\nvoid giveOutput(double cost, int turnover, double price);\n//前置条件：cost\
  \ 是一个物品的批发价；\n//turnover 是物品售出的预期时间；\n//price 是物品的零售价。\n//后置条件：cost、turnover 和 price\
  \ 的值已\n//写到屏幕上。\n```\n\n现在我们已经有了函数头，编写程序的 `main` 部分就轻而易举了：\n\n```\nint main()\n\
  {\n    double wholesaleCost, retailPrice;\n    int shelfTime;\n    getInput(wholesaleCost,\
  \ shelfTime);\n    retailPrice = price(wholesaleCost, shelfTime);\n    giveOutput(wholesaleCost,\
  \ shelfTime, retailPrice);\n    return 0;\n}\n```\n\n尽管我们还没有编写函数体，并且不知道函数是如何工作的，但我们可以编写上述使用函数的代码。这就是过程抽象（procedural\
  \ abstraction）原则的含义。函数被视为黑盒。\n\n# 算法设计\n\n函数 `getInput` 和 `giveOutput` 的实现非常直观。它们仅包含几个\
  \ `cin` 和 `cout` 语句。函数 `price` 的算法由如下伪代码给出：\n\n```\nif turnover ≤ 7 days then\n\
  \    return (cost +5% of cost);\nelse\n    return (cost +10% of cost);\n```\n\n\
  # 编码\n\n此程序使用了三个常量：5% 的低加价率、10% 的高加价率，以及 7 天的预期货架时间作为阈值（超过该阈值则使用高加价率）。由于如果公司决定更改定价策略，这些常量可能需要更改以更新程序，因此我们在程序开始为这三个数字声明了全局命名常量。带有\
  \ `const` 修饰符的声明如下：\n\n```\nconst double LOW_MARKUP = 0.05; //5%\nconst double HIGH_MARKUP\
  \ = 0.10; //10%\nconst int THRESHOLD = 7; // 如果不预期\n                         //7\
  \ 天或更短内售出则使用 HIGH_MARKUP\n```\n\n函数 `price` 的体是对我们算法从伪代码到 C++ 代码的直观翻译：\n\n```cpp\n\
  {\n    if (turnover <= THRESHOLD)\n        return ( cost + (LOW_MARKUP * cost) );\n\
  \    else\n        return ( cost + (HIGH_MARKUP * cost) );\n}\n```\n\n完整的程序所示 显示\
  \ 5.9 中。\n\n```cpp\n 1    //根据 Quick-Shop 超市连锁的\n 2    //定价策略确定物品的零售价。\n 3    #include\
  \ <iostream>\n 4    const double LOW_MARKUP = 0.05; //5%\n 5    const double HIGH_MARKUP\
  \ = 0.10; //10%\n 6    const int THRESHOLD = 7;// 如果不预期\n 7                    \
  \        //7 天或更短内售出则使用 HIGH_MARKUP.\n 8    void introduction();\n 9    //后置条件：程序描述被写在屏幕上。\n\
  10    void getInput(double& cost, int& turnover);\n11    //前置条件：用户准备好正确输入值。\n12\
  \    //后置条件：cost 的值已设置为\n 13    //物品的批发价。turnover 的值已设置为\n 14    //物品售出的预期天数。\n\
  \ 15    double price(double cost, int turnover);\n 16    //前置条件：cost 是一个物品的批发价。\n\
  \ 17    //turnover 是物品售出的预期天数。\n 18    //返回物品的零售价。\n 19    void giveOutput(double\
  \ cost, int turnover, double price);\n 20    //前置条件：cost 是一个物品的批发价；\n 21    //turnover\
  \ 是物品售出的预期时间；\n 22    //price 是物品的零售价。\n 23    //后置条件：cost、turnover 和 price 的值已\n\
  \ 24    //写到屏幕上。\n 25    int main()\n 26    {\n 27    double wholesaleCost, retailPrice;\n\
  \ 28    int shelfTime;\n 29    getInput(wholesaleCost, shelfTime);\n 30    retailPrice\
  \ = price(wholesaleCost, shelfTime);\n 31    giveOutput(wholesaleCost, shelfTime,\
  \ retailPrice);\n 32    return 0;\n 33    }\n 34    //使用 iostream：\n 35    void\
  \ introduction()\n 36    {\n 37        using namespace std;\n 38        cout <<\
  \ \"This program determines the retail price for\\n\"\n 39            << \"an item\
  \ at a Quick-Shop supermarket store.\\n\";\n 40    }\n 41    //使用 iostream：\n 42\
  \    void getInput(double& cost, int& turnover)\n 43    {\n 44        using namespace\
  \ std;\n 45        cout << \"Enter the wholesale cost of item: $\";\n 46       \
  \ cin >> cost;\n 47        cout << \"Enter the expected number of days until sold:\
  \ \";\n 48        cin >> turnover;\n 49    }\n 50    //使用 iostream：\n 51    void\
  \ giveOutput(double cost, int turnover, double price)\n 52    {\n 53        using\
  \ namespace std;\n 54        cout.setf(ios::fixed);\n 55        cout.setf(ios::showpoint);\n\
  \ 56        cout.precision(2);\n 57        cout << \"Wholesale cost = $\" << cost\
  \ << endl\n 58             << \"Expected time until sold = \"\n 59             <<\
  \ turnover << \" days\" << endl\n 60             << \"Retail price = $\" << price\
  \ << endl;\n 61    }\n 62    //使用定义的常量 LOW_MARKUP, HIGH_MARKUP, 和 THRESHOLD：\n 63\
  \    double price(double cost, int turnover)\n 64    {\n 65        if (turnover\
  \ <= THRESHOLD)\n 66            return ( cost + (LOW_MARKUP * cost) );\n 67    \
  \    else\n 68            return ( cost + (HIGH_MARKUP * cost) );\n 69    }\n```\n\
  \n***示例对话***\n\n```\nThis program determines the retail price for\nan item at a\
  \ Quick-Shop supermarket store. Enter the wholesale cost of item: $1.21\nEnter the\
  \ expected number of days until sold: 5\nWholesale cost = $1.21\nExpected time until\
  \ sold = 5 days\nRetail price = $1.27\n```\n\n# 显示 5.9 `超市定价`\n\n# 程序测试\n\n测试程序的一个重要技术是测试所有类型的输入。对于我们所指的输入的“类型”，并没有精确的定义，但在实践中，通常很容易判断程序处理的是什么类型的输入数据。对于我们的超市程序，有两种主要的输入类型：使用\
  \ 5% 低加价率的输入和使用 10% 高加价率的输入。因此，我们 应该至少测试一个预期货架时间少于 7 天的案例，以及至少测试一个预期货架时间超过 7 天的案例。\n\
  \n\n\n\n另一种测试策略是边界值测试。遗憾的是，边界值又是另一个模糊的概念。如果一个输入（测试）值是程序行为发生改变的值，那么它 true 一个边界值。例如，在我们的超市程序中，程序的行为在预期的货架停留时间\
  \ 7 天时发生变化。因此，7 是一个边界值；程序对于小于或等于 7 天的天数的行为与大于 7 天的天数的行为不同。因此，我们至少应该对一个预期在货架上恰好停留\
  \ 7 天的案例对程序进行测试。通常情况下，你还应该测试距离边界值一个步之远的输入，因为在判断边界位置时很容易产生差一错误（off-by-one error）。因此，我们应该对预期在货架上停留\
  \ 6 天、7 天和 8 天的物品输入对程序进行测试。（这是在于上一段落中描述的测试输入之外的，，那些输入应该远低于 7 天且也远高于 7 天。）\n\n###\
  \ 自测练习\n\n13. 函数定义可以出现在另一个函数定义的体内部吗？\n\n14. 函数定义可以包含对另一个函数的调用吗？\n\n15. 重写 显示 5.8\
  \ 中所示的 `order` 函数的声明注释，使其用前置条件和后置条件来表达。\n\n16. 为预定义函数 `sqrt` 提供一个前置条件和一个后置条件，该函数返回其参数的平方根。\n\
  \n# 5.4 函数的测试与调试\n\n> “我看到了那个可怜的东西——我所创造的可悲怪物。”\n\n> 玛丽·沃尔斯克拉夫特·谢莱，《弗兰肯斯坦》\n\n#\
  \ 桩程序与驱动程序\n\n每个函数都应该作为一个与程序部分独立的单元进行设计、编码和测试。这是自顶向下设计策略的精髓。当你将每个函数视为一个独立的单元时，你就将一个大任务转化了一系列更小、更容易管理的任务。但你如何在该函数所属程序之外对其进行测试呢？你编写一个特殊的程序来完成测试。例如，显示\
  \ 5.10 显示了一个用于测试 `getInput` 函数的程序，该函数曾在 显示 5.9 中的程序中使用。\n\n```\n 1    //函数 getInput\
  \ 的驱动程序。\n 2    #include <iostream>\n 3    \n 4    void getInput(double& cost, int&\
  \ turnover);\n 5    //前置条件: 用户准备好正确输入值。\n 6    //后置条件: cost 的值已设置为\n物品的\n 7    批发价。turnover\
  \ 的值已设置为\n 8    物品售出前的预期天数。\n 9     \n10    int main( )\n11    {\n12        using\
  \ namespace std;\n13        double wholesaleCost;\n14        int shelfTime;\n15\
  \        char ans;\n16     \n17        cout.setf(ios::fixed);\n18        cout.setf(ios::showpoint);\n\
  19        cout.precision(2);\n20        do\n21        {\n22            getInput(wholesaleCost,\
  \ shelfTime);\n23     \n24            cout << \"Wholesale cost is now $\"\n25  \
  \               << wholesaleCost << endl;\n26            cout << \"Days until sold\
  \ is now \"\n27                 << shelfTime << endl;\n28     \n29            cout\
  \ << \"Test again?\"\n30                 << \" (Type y for yes or n for no): \"\
  ;\n31            cin >> ans;\n32            cout << endl;\n33        } while (ans\
  \ == 'y' || ans == 'Y');\n34     \n35        return 0;\n36    }\n37    //使用 iostream:\n\
  38    void getInput(double& cost, int& turnover)\n39    {\n40        using namespace\
  \ std;\n41        cout << \"Enter the wholesale cost of item: $\";\n42        cin\
  \ >> cost;\n43        cout << \"Enter the expected number of days until sold: \"\
  ;\n44        cin >> turnover;\n45    }\n```\n\n***样例对话***\n\n```\nEnter the wholesale\
  \ cost of item: $123.45\nEnter the expected number of days until sold: 67\nWholesale\
  \ cost is now $123.45\nDays until sold is now 67\nTest again? (Type y for yes or\
  \ n for no): y\nEnter the wholesale cost of item: $123.45\nEnter the expected number\
  \ of days until sold: 67\nWholesale cost is now $123.45\nDays until sold is now\
  \ 67\nTest again? (Type y for yes or n for no): y\n```\n\n\n\n\n使用带有存桩（stubs）的程序框架允许你先测试然后“填充”基础程序框架，而不是为了测试每个函数而编写完全全新的程序。因此，带有存桩的程序框架通常是最有效的测试方法。一种方法是使用驱动程序（driver\
  \ programs）来测试某些基本函数（如输入输出函数），然后使用带有存桩的程序测试剩余函数。存桩逐个替换：一个存桩被完整的函数替换并进行测试；一旦该函数经过充分测试，另一个存桩会被完整的函数定义替换，依此类推，直到生成最终程序。\n\
  \n### 自测练习\n\n17. 测试函数的根本规则是什么？为什么这是一个测试函数的好方法？\n\n18. 什么是驱动程序？\n\n19.为显示 5.11 中所示的函数编写一个驱动程序。\n\
  \n20. 为自测练习 11 中的函数 `addTax` 编写一个驱动程序。\n\n21. 什么是存桩（stub）？\n\n22. 为给出的函数声明编写一个存桩。不要编写整个程序，只编写放入程序中的存桩。（*提示*：它会非常短。）\n\
  \n```\ndouble rainProb(double pressure, double humidity,\n                double\
  \ temp);\n//Precondition: pressure 是以汞柱为单位的气气\n//压力，\n//humidity 是百分比形式的相对湿度，以及\n\
  //temp 是华氏度温度。\n//返回降雨概率，这是一个 0 到 1 之间的数字。\n//0 表示没有下雨机会。1 表示下雨是 100%。\n```\n\n\
  # 5.5 通用调试技术\n\n通过使用存桩和驱动进行仔细测试，可以检测程序中可能存在的大量错误。然而，检查代码和测试用例的输出可能不足以追踪许多逻辑错误。在这种情况下，你可以采用一些通用的调试技术。\n\
  \n# 保持开放心态\n\n从整体上检查系统，不要假设错误发生在某个特定位置。如果程序输了错误的值，那么你应该检查源代码、输入输出值的不同测试用例，以及算法背后的逻辑。例如，考虑显示\
  \ 5.9 中确定超市示例价格的代码。如果显示了错误的价格，错误可能只是测试用例中的输入值与你预期的值不同，导致程序看起来是错误的。\n\n一些初级程序员会“随机”更改代码部分，希望这能修复错误。不惜一切避免这种技术！这种方法在你编写的最初几个简单程序上可能有效。但对于较大的程序，它几乎会失败，并且经常会程序引入新错误。在提交修改之前，确保你理解代码更改将产生什么样的逻辑影响。\n\
  \n最后，如果老师允许，你可以将程序展示给别人看。新鲜视角有时可以快速发现你一直忽略的错误。休息一下并在几小时后或第二天回到问题上有时有助于发现错误。\n\n\
  # 检查常见错误\n\n你应该寻找的首要错误之一是容易犯的常见错误，正如教科书中“陷阱”（Pitfall）和“编程提示”（Programming Tip）部分描述的那样。常见错误的来源示例包括：（1）未初始化的变量，（2）差一错误（off-by-one\
  \ errors），（3）越界数据边界，（4）自动类型转换以及（5）使用 `=` 代替 `==`。\n\n# 定位错误\n\n确定错误的精确原因和位置是修复错误的第一步之一。检查不同测试用例的输入输出行为是定位错误的方法之一。相关技术是在程序的策略位置添加\
  \ `cout` 语句，打印关键变量的值。`cout` 语句还可以显示程序正在执行哪些代码。这是第 3 章中描述的 `for` 循环变量追踪策略，但即使代码中没有循环也可以它。\n\
  \n例如，考虑显示 5.12 中的代码，该代码目的是使用公式将温度从华氏度转换为摄氏度：\n\n$$C = \\frac{5}{9}(F - 32)$$\n\n\
  \n\n添加调试代码和引入 `cout` 语句是一种在几乎任何编程环境中都行的简单技术。然而，在程序中添加大量的 `cout` 语句有时会非常繁琐。此外，`cout`\
  \ 语句的输出可能很长或难以解释，而且调试代码的引入甚至可能引入新的错误。许多编译器和集成开发环境都包含一个独立的程序，即 `debugger`（调试器），它允许程序员在特定的代码行（称为\
  \ `breakpoint`，即断点）上停止程序的执行，并逐行通过代码的执行。当调试器逐行执行代码时，程序员可以检查变量的内容，甚至手动更改存储在这些变量中的值。查看关键变量的值不需要\
  \ `cout` 语句。不同 C++ 编译器的调试器界面、命令和功能各异，因此请查看您的用户手册或咨询您的导师以获取如何使用这些功能的帮助。\n\n# `assert`\
  \ 宏\n\n在第 5.3 节中，我们讨论了子程序的先置条件（preconditions）和后置条件（postconditions）的概念。`assert` 宏是一个确保在\
  \ `assert` 语句所在位置预期条件为真的工具。如果不满足条件，程序将显示错误消息并终止。要使用 `assert`，首先通过以下包含语句在程序中包含 `assert`\
  \ 的定义：\n\n```cpp\n#include <cassert>\n```\n\n要使用 `assert`，请在您想要强制断言的位置添加以下代码行，并带上求值为为的布尔表达式：\n\
  \n```cpp\nassert(boolean_expression);\n```\n\n`assert` 语句是一个宏，类似于函数的构造结构。例如，考虑一个使用牛顿法计算数字\
  \ `n` 的平方根的子程序：\n\n$$sqrt_{i + 1} = \\frac{1}{2}\\left\\lbrack {sqrt_{i} + \\frac{n}{sqrt_{i}}}\
  \ \\right\\rbrack$$\n\n这里 `sqrt[0]` = 1，且当 `i` 趋于无穷大时，`sqrt[i]` 趋于 `n` 的平方根。实现该算法的子程序要求\
  \ `n` 为正数，且我们重复计算的迭代次数也是正数。我们可以通过如下所示向子程序添加 `assert` 来保证这一条件：\n\n```cpp\n// 使用牛顿迭代法近似计算\
  \ n 的平方根。\n// Precondition: n 为正数，numIterations 为正数。\n// Postcondition: 返回 n 的平方根\n\
  double newtonSqroot(double n, int numIterations)\n{\n    double answer = 1;\n  \
  \  int i = 0;\n\n    assert((n > 0) && (numIterations> 0));\n    while (i <numIterations)\n\
  \    {\n        answer = 0.5 * (answer + n / answer);\n        i++;\n    }\n   \
  \ return answer;\n}\n```\n\n如果我们尝试用任何负数参数执行此子程序，程序将终止并显示失败的断言。`assert` 语句可以以类似的方式用于任何您想要强制的断言，它是防御性编程的一种极佳技术。\n\
  \n如果您要分发程序，您可能不希望可执行程序包含 `assert` 语句，因为用户可能会收到他们无法理解的错误消息。如果您在代码中添加了许多 `assert`\
  \ 语句，删除所有它们将非常繁琐。幸运的是，您可以通过在程序开头、`<cassert>` 的 `include` 语句之前添加以下行来禁用所有 `assert`\
  \ 宏：\n\n```cpp\n#define NDEBUG\n#include <cassert>\n```\n\n如果您稍后更改了程序并需要再次调试，可以通过删除\
  \ `#define NDEBUG` 行（或将其注释掉）来重新开启 `assert` 语句。\n\n### 自测练习\n\n-   程序中的所有子任务都可以实现为函数，可以是返回返回值的函数，也可以是\
  \ `void` 函数。\n-   `形式参数`（formal parameter）是一种占位符，在调用函数时由函数`参数`（argument）进行填充。执行这种替换的方法有两种：按值传递（call-by-value）和按引用传递（call-by-reference）。\n\
  -   在`按值传递`替换机制中，参数的值被替换为对应的形式参数。在`按引用传递`替换机制中，参数应该是一个变量，整个变量被替换为相应的参数。\n-   在函数定义中指示按引用传递参数的方法是在形式参数的类型后加上取地址符号\
  \ `&`。\n-   对应按值传递参数的参数不能通过函数调用更改。对应按引用传递参数的参数可以通过函数调用更改。如果您想让函数更改变量的值，则必须使用按引用传递参数。\n\
  -   编写函数注释的良好方法是使用`先置条件`（precondition）和`后置条件`（postcondition）。`先置条件`说明了在调用函数时假设为真的内容。`后置条件`描述了函数执行后将为真的内容。\n\
  -   每个函数都应该在一个先置条件成立的程序中测试。\n-   `驱动程序`（driver program）是一个除了测试函数外什么都不做的程序。\n-  \
  \ 函数的简化版本称为`stub`（存根）。stub 用于尚未测试的函数。\n\n### 章节总结\n\n23. 在计算语句 `x = x / y;` 时，如何使用\
