  \n# `Stack` 类的接口文件\n\n`push` 和 `pop` 源于另一种可视化栈的方式。栈类似于有时用于在食堂放置盘子的机制。该机制将盘子放在桌面上的洞里。盘子下方有一个弹簧，其张力调节使得顶部盘子超出桌面。如果这种机制用作数据结构，数据将写在盘子上（这可能违反某些规定，但是一个很好的类比）。要在栈中添加盘子，将其放在其他盘子的顶部，新盘子的重量会`压`弹簧。当你移除一个盘子时，下方的盘子就会`弹出`进入视野。\n\
  \n显示 13.18 显示了一个简单的程序，说明了如何使用 `Stack` 类。该程序一次读取一个单词并将字母放入栈中。程序逐个移除字母并将其写入屏幕。由于数据从栈中移除的顺序与其进入栈的顺序相反，输出显示的是反向单词。\n\
  \n```cpp\n1    //演示 Stack 类的程序。\n2    #include <iostream>\n3    #include \"stack.h\"\
  \n4    using namespace std;\n5    using namespace stacksavitch;\n 6     \n7    int\
  \ main( )\n 8    {\n 9        stack s;\n 10        char next, ans;\n 11     \n 12\
  \        do\n 13        {\n 14            cout << \"Enter a word: \";\n 15     \
  \       cin.get(next);\n 16            while (next != '\\n')\n 17            {\n\
  \ 18                s.push(next);\n 19                cin.get(next);\n 20      \
  \      }\n 21     \n 22            cout << \"Written backward that is: \";\n 23\
  \            while ( ! s.empty( ) )\n 24            cout << s.pop( );\n 25     \
  \       cout << endl;\n 26     \n 27            cout << \"Again?(y/n): \";\n 28\
  \            cin >> ans;\n 29            cin.ignore(10000, '\\n');\n 30        }\
  \ while (ans != 'n' && ans != 'N');\n 31     \n 32        return 0;\n 33    }\n\
