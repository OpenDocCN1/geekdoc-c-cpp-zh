  {\n    cout << \"Output file opening failed.\\n\";\n    exit(1);\n}\n```\n\n3. ```cpp\n\
  fin.close();\nfout.close();\n```\n\n4. 你需要将流 `outStream` 替换为 `cout`。注意你不需要声明 `cout`，不需要对\
