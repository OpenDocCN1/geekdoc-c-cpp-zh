  \ 和 `Grandchild` 三类的构造函数和析构函数。当调用 `Grandchild` 类的构造函数时，哪些构造函数会被调用？顺序是怎样的？当调用 `Grandchild`\
  \ 类的析构函数时，哪些析构函数会被调用？顺序是什么？\n\n9. 为以下类定义成员函数 `addValue`、拷贝构造函数、重载赋值运算符和析构函数。该类用于表示部分填充数组。成员变量\
  \ `numberUsed` 包含当前已填充的数组位置数量。给出另一个构造定义以帮助你开始。\n\n```cpp\n#include <iostream>\n\
  #include <cstdlib>\nusing namespace std; \n\nclass PartFilledArray\n{\n public:\n\
  \    PartFilledArray(int arraySize);\n    PartFilledArray(const PartFilledArray&\
  \ object);\n    ~PartFilledArray();\n    void operator =(const PartFilledArray&\
  \ rightSide);\n    void addValue(double newEntry);\n    //There would probably be\
  \ more member functions\n    //but they are irrelevant to this exercise.\n protected:\n\
  \    double *a;\n    int maxNumber;\n    int numberUsed;\n};\nPartFilledArray::PartFilledArray(int\
  \ arraySize)\n              : maxNumber(arraySize), numberUsed(0)\n{\n    a = new\
  \ double[maxNumber];\n}\n```\n\n（许多权威人士认为成员变量应该是 private 而不是 protected。我们倾向于同意这一点。然而，使用\
  \ `protected` 可以使练习设计更好，而且你对 protected 变量应该有一些经验，因为确实有程序员在使用它们。）\n\n10. 定义一个名为 `PartFilledArrayWMax`\
  \ 的类，它是 `PartFilledArray` 类的派生类。`PartFilledArrayWMax` 类有一个额外的成员变量名为 `maxValue`，用于存储数组中的最大值。定义一个名为\
  \ `getMax` 的成员访问函数，返回数组中存储的最大值。重定义成员函数 `addValue` 并定义两个构造函数，其中一个有一个 `int` 参数表示数组中的最大条目数。还要定义一个拷贝构造函数、一个重载赋值运算符和一个析构函数。（真实的类会有更多的成员函数，但对于练习来说这些足够了。）\n\
  \n# 15.3 多态性\n\n> 所有的经验都是拱门，可以在其之上构建。\n\nHENRY ADAMS，《亨利·亚当斯的教育》\n\n多态性（Polymorphism）是指为一个函数名关联多个含义的能力。按照现的用法，`polymorphism`指的是一种为单个函数名关联多个含义的特定方式。也就是说，`polymorphism`是指通过一种被称为\
  \ `晚绑定`（late binding）的特殊机制，为一个函数名关联多个含义的能力。多态性是`面向对象编程`（object-oriented programming）这一编程哲学的核心组件之一。晚绑定，并由此产生的多态性，是本节的主题。\n\
  \n# 晚绑定\n\n`虚函数`（virtual function）在某种意义上可以在定义之前就被使用的函数。例如，一个图形程序可能有若干种图形，如矩形、圆形、椭圆等。每个图形都可能是不同类的对象。例如，`Rectangle`\
  \ 类可能有关于高度、宽度和中心点的成员变量，而 `Circle` 类可能有关于中心点和半径的成员变量。在一个设计良好的编程项目中，它们可能都是一个单一父类的后代，例如名为\
  \ `Figure` 的类。现在，假设你想有一个函数在屏幕上绘制一个图形。为了画一个圆，你需要与画矩形所需的完全不同的指令。因此，每个类都需要一个不同的函数来绘制它种类的图形。然而，由于这些函数属于类，它们都可以命名为\
  \ `draw`。如果 `r` 是一个 `Rectangle` 对象而 `c` 是一个 `Circle` 对象，即使 `r.draw()` 和 `c.draw()`\
  \ 也可以用不同代码实现的函数。这些都不是新奇，但现在我们进入新内容：在父类 `Figure` 中定义的`virtual 函数`。\n\n现在，父类 `Figure`\
  \ 可能有适用于所有图形的函数。例如，它可能有一个名为 `center` 的函数，通过擦除图形然后在屏幕中心重新绘制它，将图形移动到屏幕中心。`Figure::center`\
  \ 可能会使用 `draw` 函数在屏幕中心重新绘制图形。当你考虑对 `Rectangle` 和 `Circle` 类的图形使用继承的函数 `center` 时，你开始发现这里存在复杂性。\n\
  \n为了使观点更加清晰且更具戏剧性，假设 `Figure` 类已经编写并投入使用，在之后的某个时间，我们为一种全新的图形添加一个类，比如 `Triangle`\
  \ 类。现在，`Triangle` 可以是 `Figure` 类的派生类，因此函数 `center` 将继承自 `Figure` 类；因此，函数 `center`应该适用于所有的\
  \ `Triangle`（并为它们正确执行！）。但存在一个问题。函数 `center` 使用 `draw`，而 `draw` 函数对于每种类型的图形都是不同的。继承的函数\
  \ `center`（如果没有特殊处理）将使用在 `Figure` 类中提供的 `draw` 函数定义，而该 `draw` 函数对于 `Triangle` 来说无法正常工作。我们希望继承的函数\
  \ `center` 使用 `Triangle::draw` 而不是 `Figure::draw`。但是，在编写和编译 `center` 函数（定义在 `Figure`\
  \ 类中）时，`Triangle` 类以及 `Triangle::draw` 函数还没有编写！`center` 函数如何可能为 `Triangle` 正常工作？编译器在编译\
  \ `center` 的时候对 `Triangle::draw` 是一无所知的。答案是，只要 `draw` 是一个 `virtual 函数`，它就可以适用。\n\
  \n当你将一个函数设为 `virtual` 时，你是在告诉编译器：“我不知道这个函数是如何实现的。等在程序中使用它时，从对象实例中获取实现。”这种在运行时确定过程实现的技术被称为`晚绑定`（late\
  \ binding）或`动态绑定`（dynamic binding）。虚函数是 C++ 提供晚绑定的方式。但介绍到此为止。我们需要一个示例来让这一切生动起来（并教你如何在程序中使用虚函数）。为了解释\
  \ C++ 中虚函数的细节，我们将使用一个图形领域之外其他领域的简化示例。\n\n# C++ 中的虚函数\n\n\n\n\n\n假设你正在为一家汽车零件商店设计一个记录程序。你希望这个程序具有通用性，但你不确定自己是否能考虑到所有可能的情况。例如，你想跟踪销售情况，但你无法预见所有的销售类型。最初，只有针对去商店购买某个特定零件的零售客户的常规销售。然而，稍后你可能想添加带折扣的销售，或者带有运费的邮购销售。所有这些销售都是针对具有基本价格的物品，并最终会生成某些账单。对于简单的销售，账单就是基本价格，但如果你以后添加了折扣，那么某些类型的账单也将取决于折扣的大小。你的程序需要计算每日总销售额，直观来说，这应该是所有单独销售账单的总和。你可能还想计算当天最大和最小销售额，或者当天的平均销售额。这些都可以从单笔账单计算出来，但计算账单的函数将在稍后添加，届那时你将决定要处理哪些类型的销售。为了适应这一点，我们将计算账单的函数设为虚函数。（为了在这个第一个示例中简单起见，我们假设每笔销售仅涉及一个物品，尽管通过派生类和虚函数，我们可以（但此处不会）处理多个物品的销售。）\n\
  \n显示 15.9 和 15.10 包含了 `Sale` 类的接口和实现。所有销售类型都应该是 `Sale` 类的派生类。`Sale` 类对应于没有额外折扣或费用的单个物品简单销售。注意函数\
  \ `bill` 声明中的保留字 `virtual`（参见显示 15.9）。注意（显示 15.10），成员函数 `savings` 和重载运算符 `<` 都使用了函数\
  \ `bill`。由于 `bill` 被声明为虚函数，我们稍后可以定义 `Sale` 类的派生类，并定义它们版本的 `bill` 函数，而我们在 `Sale`\
  \ 类中提供的成员函数 `savings` 的定义和重载运算符 `<` 的定义将使用与派生类对象对应的 `bill` 函数版本。\n\n```\n 1    //这是头文件\
  \ sale.h。\n 2    //这是 Sale 类的接口。\n 3    //Sale 是一个用于简单销售的类。\n 4    #ifndef SALE_H\n\
  \ 5    #define SALE_H\n 6     \n 7    #include <iostream>\n 8    using namespace\
  \ std;\n 9     \n10    namespace salesavitch\n11    {\n12     \n13        class\
  \ Sale\n14        {\n15        public:\n16            Sale();\n17            Sale(double\
  \ thePrice);\n18            virtual double  bill() const;\n19            double\
  \ savings(const Sale& other) const;\n20            //如果你购买 other 而不是调用对象，则返回节省的金额。\n\
  21        protected:\n22                double price;\n23        };\n24     \n25\
  \        bool operator <(const Sale& first, const Sale& second);\n26        //比较两个销售以查看哪一个更大。\n\
  27    }//salesavitch\n28     \n29    #endif // SALE_H\n```\n\n# 显示 15.9 基类 `Sale`\
  \ 的接口\n\n```\n 1    //这是实现文件：sale.cpp\n 2    //这是 Sale 类的实现。\n 3    //Sale 类的接口在\n\
  \ 4    //头文件 sale.h 中。\n 5    #include \"sale.h\"\n 6     \n 7    namespace salesavitch\n\
  \ 8    {\n 9        Sale::Sale() : price(0)\n10        {}\n11         \n12     \
  \   Sale::Sale(double thePrice) : price(thePrice)\n13        {}\n14          \n\
  15        double Sale::bill() const\n16        {\n17            return price;\n\
  18        }\n19         \n20        double Sale::savings(const Sale& other) const\n\
  21        {\n22            return ( bill() − other.bill() );\n23        }\n24  \
  \       \n25        bool operator <(const Sale& first, const Sale& second)\n26 \
  \       {\n27            return first.bill() < second.bill();\n28        }\n29}//salesavitch\n\
  ```\n\n# 显示 15.10 基类的实现\n\n对于显示 15.9 和 15.10，包含了 `Sale` 类的接口和实现。所有销售类型都应该是 `Sale`\
  \ 类的派生类。`Sale` 类对应于没有额外折扣或费用的单个物品简单销售。注意函数 `bill` 声明中的保留字 `virtual`（参见显示 15.9）。注意（显示\
  \ 15.10），成员函数 `savings` 和重载运算符 `<` 都使用了函数 `bill`。由于 `bill` 被声明为虚函数，我们稍后可以定义 `Sale`\
  \ 类的派生类，并定义它们版本的 `bill` 函数，而我们在 `Sale` 类中提供的成员函数 `savings` 的定义和重载运算符 `<` 的定义将使用与派生类对象对应的\
  \ `bill` 函数版本。\n\n# 显示 15.11 派生类 `Sale`\n\n假设你正在为一家汽车零件商店设计一个记录程序。你希望这个程序具有通用性，但你不确定自己是否能考虑到所有可能的情况。例如，你想跟踪销售情况，但你无法预见所有的销售类型。最初，只有针对去商店购买某个特定零件的零售客户的常规销售。然而，稍后你可能想添加带折扣的销售，或者带有运费的邮购销售。所有这些销售都是针对具有基本价格的物品，并最终会生成某些账单。对于简单的销售，账单就是基本价格，但如果你以后添加了折扣，那么某些类型的账单也将取决于折扣的大小。你的程序需要计算每日总销售额，直观来说，这应该是所有单独销售账单的总和。你可能还想计算当天最大和最小销售额，或者当天的平均销售额。这些都可以从单笔账单计算出来，但计算账单的函数将在稍后添加，届那时你将决定要处理哪些类型的销售。为了适应这一点，我们将计算账单的函数设为虚函数。（为了在这个示例示例简单简单见我们我们假设每笔销售仅涉及一个物品，通过派生类和虚函数，我们可以（但此处不会）处理多个物品的销售。）\n\
  \n如何工作？为了编写 C++ 程序，你只需假设它是通过魔法实现的。当你标记一个函数为 `virtual` 时，你是在告诉 C++ 环境，“等待直到这个函数被使用，并获取对应的实现。”\n\
  \n# 显示 15.12 虚函数的使用\n\n为了在 C++ 中使用虚函数，你需要了解技术细节。我们在这里列出：\n\n*   如果一个函数在派生类中的定义与基类类不同，且你想让它成为虚函数，你需要在基类的函数声明中添加\
  \ `virtual` 关键字。你不需要在派生类的函数声明中添加保留字 `virtual`。如果一个函数在基类中是虚函数，那么它在派生类中自动也是虚函数。（不过，在派生类的函数声明中标记\
  \ `virtual` 是一个好习惯，尽管这并不是必须。）\n\n\n\n\n\n- 保留字 `virtual` 被添加到函数声明中，而不是函数定义中。\n-\
  \ 除非你使用 `virtual` 关键字，否则你无法获得虚函数以及虚函数的优势。\n\n既然虚函数如此出色，为什么不将所有的成员函数都变成虚函数呢？几乎不总是使用虚函数的唯一理由就是效率。编译器和运行时环境对虚函数需要执行更多工作，因此，如果你标记了比需要的更多的成员函数为\
  \ `virtual`，你的程序效率就会降低。\n\n### 自测练习\n\n11. 假设你通过删除保留字 `virtual` 来修改类 `Sale` 类的定义（显示\
  \ 15.9）。这将会如何改变显示 15.12 中程序的输出？\n\n# 虚函数与扩展类型兼容性\n\n我们将讨论将类成员函数声明为 `virtual` 的进一步后果，并进行一个使用了这些某些特征的示例。\n\
  \nC++ 是一种相当强类型的语言。这意味着对象的类型总是会被检查的，如果发生类型不匹配，就会发出错误信息，例如当没有可以自动调用的转换时，参数与形式参数之间发生类型不匹配。这意味着通常情况下赋值给变量的值必须与变量的类型匹配，尽管在少数定义情况下，C++\
  \ 会执行自动类型转换（称为 `coercion`，强制类型转换），使得看起来你可以将一种类型的值赋值给另一个类型的变量。例如，C++ 允许你将 `char`\
  \ 或 `int` 类型的值赋值给 `double` 类型变量。然而，C++ 不允许你将 `double` 或 `float` 类型的值赋值给任何整数类型（`char`、`short`、`int`、`long`）。\n\
  \n然而，尽管强类型如此重要，这种强类型检查仍然干扰了面向对象编程中继承的核心思想。假设你定义了类 `A` 和类 `B`，并定义了类型为类 `A` 和类 `B`\
  \ 的对象。你不能总是这些类型的对象之间进行赋值。例如，假设程序或单元包含以下类型声明：\n\n```\nclass Pet\n{ \npublic:\n  \
  \   virtual void print();\n     string name;\n};\n class Dog : public Pet\n{\n public:\n\
  \     virtual void print(); //不需要 virtual 关键字，但为了清晰起见\n             //把它放在这里。（这也是一种良好的风格！）\n\
  \     string breed;\n};\nDog vDog;\nPet vPet;\n```\n\n现在关注数据成员 `name` 和 `breed`。（为了保持此示例简单，我们把成员变量设为了\
  \ `public`。在实际应用中，它们应该是 `private` 的，并有操作它们的函数。）\n\n任何 `Dog` 都是一个 `Pet`。允许程序将 `Dog`\
  \ 类型的值也视为 `Pet` 类型的值似乎是有意义的，因此以下操作应该是被允许的：\n\n```\nvDog.name = \"Tiny\";\nvDog.breed\
  \ = \"Great Dane\";\nvPet = vDog;\n```\n\nC++ 允许这种赋值。你可以将一个值（例如 `vDog` 的值）赋值给父类型的变量（例如\
  \ `vPet`），但你不允许反向赋值。虽然上面的赋值是被允许的，但赋值给变量 `vPet` 的值丢失了它的 `breed` 字段。这被称为**切片问题**（the\
  \ slicing problem）。以下尝试访问将产生错误信息：\n\n```\ncout << vPet.breed; //非法：class Pet 没有名为\
  \ breed 的成员\n```\n\n你可能会认为这是合理的，因为一旦 `Dog` 被移动到类型为 `Pet` 的变量中，它应该被视为任何其他 `Pet`，而不应该具有\
  \ `Dog` 特有的属性。这引发了激烈的哲学辩论，但在编程时它通常只会带来麻烦。名为 Tiny 的狗仍然是一条大丹，我们希望引用它的品种，即使我们在中间某处将其视为了一个\
  \ `Pet`。\n\n幸运的是，C++ 确实为我们提供了一种在不丢弃品种的情况下将 `Dog` 视为 `Pet` 的方法。为此，我们使用指向动态对象实例指针。假设我们添加了以下声明：\n\
  \n```\nPet *pPet;\nDog *pDog;\n```\n\n如果我们使用指针和动态变量，我们可以将 `Tiny` 视为 `Pet` 而不丢失它的品种。以下是允许的：\n\
  \n```\npDog = new Dog;\npDog->name = \"Tiny\";\npDog->breed = \"Great Dane\";\n\
  vPet = pDog;\n```\n\n此外，我们仍然可以访问 `pPet` 所指向节点的 `breed` 字段。假设\n\n```cpp\nDog::print();\n\
  ```\n\n已定义如下：\n\n```\n//使用 iostream\nvoid Dog::print()\n{\n    cout << \"name: \"\
  \ << endl;\n    cout << \"breed: \" << endl;\n}\n```\n\n语句 `pPet->print();` 将导致以下输出：\n\
  \n```\nname:\nbreed: Great Dane\n```\n\n这是由于 `print()` 是一个虚函数。（这里是双关语。）\n\n```\n\
  #include <iostream>\n#include <string>\nusing namespace std;\n\nclass Pet\n{\npublic:\n\
  \    virtual void print();\n    string name;\n};\n\nclass Dog : public Pet\n{\n\
  public:\n    virtual void print(); //不需要 virtual 关键字，但为了清晰起见\n             //把它放在这里。（这也是一种良好的风格！）\n\
  \    string breed;\n};\n\nint main()\n{\n    Dog vDog;\n    Pet vPet;\n\n    vDog.name\
  \ = \"Tiny\";\n    vDog.breed = \"Great Dane\";\n    vPet = vDog;\n\n    // 以下直接访问成员变量而不是通过虚函数\n\
  \    // 将产生错误：\n    //cout << \"name: \" << pPet->name << \"  breed: \"\n    //\
  \     << pPet->breed << endl;\n    //产生错误信息：'class Pet' 没有名为 'breed' 的成员\n    \n\
  \    Dog *pDog;\n    Pet *pPet;\n\n    pDog = new Dog;\n    pDog->name = \"Tiny\"\
  ;\n    pDog->breed = \"Great Dane\";\n    vPet = pDog;\n\n    pPet->print(); //\
  \ 这两个打印相同的输出：\n    pDog->print(); // name: Tiny\n                   //breed: Great\
  \ Dane\n\n    return 0;\n}\n\nvoid Pet::print()\n{\n    cout << \"name: \" << endl;//注意没有提到\
  \ breed\n}\n\nvoid Dog::print()\n{\n    cout << \"name: \" << name << endl;\n  \
  \  cout << \"breed: \" << breed << endl;\n}\n```\n\n***示例对话***\n\n```\nname: Tiny\n\
  breed: Great Dane\nname: Tiny\nbreed: Great Dane\n```\n\n# 显示 15.13 使用虚函数的更多继承\n\
  \n# 编程提示 使析构函数变为虚\n\n总是使析构函数虚是一个良好的策略，但在我们解释为什么这是一个良好的策略之前，我们需要说明析构函数和指针如何交互，以及析构函数虚意味着什么。\n\
  \n考虑以下代码，`SomeClass` 是一个没有虚析构函数的类：\n\n```\nSomeClass *p = new SomeClass;\n    .\
  \ . delete p;\n```\n\n当对 `p` 调用 `delete` 时，`SomeClass` 类的析构函数会被自动调用。\n\n\n\n\n\n\
  描述析构函数如何与虚函数机制交互的最简单方法是：析构函数被处理为所有析构函数具有相同的名称（尽管它们实际上并没有相同的名称）。例如，假设 `Derived` 是类\
  \ `Base` 的派生类，并且 `Base` 类中的析构函数被标记为 `virtual`。现在考虑以下代码：\n\n```\nBase *pBase = new\
  \ Derived;\n    . . . delete pBase;\n```\n\n当调用 `delete pBase` 时，会触发一个析构函数。由于 `Base`\
  \ 类中的析构函数被标记为 `virtual`，且所指向的对象类型为 `Derived`，因此会调用 `Derived` 类的析构函数（它随后调用 `Base`\
  \ 类的析构函数）。如果 `Base` 类中的析构函数没有声明为 `virtual`，则只会调用 `Base` 类的析构函数。\n\n另一个需要记住的点是，当析构函数被标记为\
  \ `virtual` 时，所有派生类的析构函数都会自动变为虚函数（无论它们是否标记了 `virtual`）。同样，这种行为就像所有析构函数具有相同的名称（尽管它们并没有）。\n\
  \n现在我们准备好解释为什么所有的析构函数都应该是虚的了。假设类 `Base`有一个指针类型的成员变量 `pB`，`Base` 类的构造函数创建了 `pB` 指向的动态变量，而\
  \ `Base` 类的析构函数删除 `pB` 指向的动态变量。假设 `Base` 类的析构函数没有标记为 `virtual`。同样假设类 `Derived`（派生自\
  \ `Base`）有一个指针类型的成员变量 `pD`，`Derived` 类的构造函数创建了 `pD` 指向的动态变量，而 `Derived` 类的析构函数删除\
  \ `pD` 指向的动态变量。考虑以下代码：\n\n```\nBase *pBase = new Derived;\n. . .\ndelete pBase;\n\
  ```\n\n由于基类中的析构函数没有标记为 `virtual`，因此只会调用 `Base` 类的析构函数。这将 `pB` 指向的动态变量的内存返回空存储，但\
  \ `pD` 指向的动态变量的内存将永远不会返回空存储（直到程序结束）。\n\n另一方面，如果基类 `Base` 的析构函数被标记为 `virtual`，那么当对\
  \ `pBase` 应用 `delete` 时，将调用 `Derived` 类的析构函数（因为所指向的对象类型为 `Derived`）。`Derived` 类的析构函数将删除\
  \ `pD` 指向的动态变量，然后自动调用基类 `Base` 的析构函数，从而删除 `pB` 指向的动态变量。因此，通过将基类析构函数标记为 `virtual`，所有内存都会返回空存储。为了应对此类情况，最好的方法是始终将析构函数标记为虚函数。\n\
  \n### 自测练习题\n\n12. 为什么我们不能将基类对象赋值给派生类变量？\n\n13. 将派生类对象赋值给基类变量（在合法的情况下）存在什么问题？\n\n\
  14. 假设基类和派生类各有一个签名相同的成员函数。当你有一个指向基类对象的指针并通过该指针调用成员函数时，请讨论什么决定了实际调用的是哪个函数——是基类成员函数还是派生类函数。\n\
  \n# 本章总结\n\n*   继承通过从一个类派生出另一个类并为派生类添加功能，为代码复用提供了工具。\n*   派生类对象继承基类的所有成员，并可以添加新成员。\n\
  *   后期绑定（Late binding）意味着决定哪个版本的成员函数合适是在运行时决定的。虚函数是 C++ 用来实现后期绑定的机制。多态、后期绑定和虚函数本质上都是同一个主题。\n\
  *   基类中的 `protected` 成员可以直接被公共派生类的成员函数访问。\n\n# 自测练习题的答案\n\n1. 1. 是的。你可以用一个派生类对象来替换基类类型类型的参数。`HourlyEmployee`\
