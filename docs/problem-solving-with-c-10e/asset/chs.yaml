  \ AM.\n```\n\n37. 编写一些 C++ 代码，读取一行文本并回显删除掉所有大写字母后的行。\n\n### 章节总结\n\n* 类型为 `ifstream`\
  \ 的流可以通过调用成员函数 `open` 连接到文件。你的程序随后可以从该文件获取输入。\n* 类型为 `ofstream` 的流可以通过调用成员函数 `open`\
  \ 连接到文件。你的程序随后可以向该文件发送输出。\n* 你应该使用成员函数 `fail` 来检查对 `open` 调用是否成功。\n* **对象**（object）是一个关联有函数的变量。这些函数被称为**成员函数**。**类**（class）是一种其变量为对象的类型。流是对象的一个示例。`ifstream`\
  \ 和 `ofstream` 类型是类的示例。\n* 当你编写对对象的成员函数的调用时，使用以下语法：\n\n```\nCalling_Object.Member_Function_Name(Argument_List);\n\
  ```\n\n一个以流 `cout` 为调用对象、`precision` 为成员函数的示例如下：\n\n```cpp\ncout.precision(2);\n\
  ```\n\n* 流成员函数（如 `width`、`setf` 和 `precision`）可用于格式化输出。这些输出函数对于到屏幕的流 `cout` 以及连接到文件的输出流同样有效。\n\
  * 每个输入流都有一个名为 `get` 的成员函数，用于读取一个字符。成员函数 `get` 不跳过空白字符。每个输出流也有一个名为 `put` 的成员函数，用于向输出流写入一个字符。\n\
  * 成员函数 `eof` 可用于测试程序何时到达输入文件的末尾。`eof`成员函数对于文本处理有效。但在处理数值数据时，你可能更倾向于使用在本章讨论的其他方法来测试文件末尾。\n\
  * 函数可以具有流类型的形式参数，但它们必须是引用传递的；不能按值传递。类型 `ifstream` 可用于输入文件流，类型 `ofstream` 可用于输出文件流。（更多可能性请见下文。）\n\
  * 如果你使用 `istream`（不带 f）作为输入流的类型，那么该参数的参数可以是 `cin` 或类型为 `ifstream` 的输入文件流。如果你使用 `ostream`（不带\
  \ f）作为输出流的类型，那么该参数的参数可以是 `cout` 或类型为 `ofstream` 的输出文件流。\n\n### 自测练习答案\n\n1. 两个的声明如下：\n\
