  \ 的函数，将这六个变量作为参数。你的函数应返回 `int` 分钟差。例如，给定起始时间为 11:59 AM，未来时间为 12:01 PM，你的程序应计算 2\
  \ 分钟。给定起始时间为 11:59 AM，未来时间为 11:58 AM，你的程序应计算 1439 分钟（23 小时 59 分钟）。\n\n你可能需要通过读取字符值从用户获取“AM”或“PM”。字符可以像数字一样比较。例如，如果变量\
  \ `aChar` 是 `char` 类型，那么 (`aChar == 'A'`) 是一个当 `aChar` 包含字母 A 时求值为 `true` 的布尔表达式。\n\
