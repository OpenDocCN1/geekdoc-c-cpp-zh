  \    cout << fDegrees\n         << \" degrees Fahrenheit is equivalent to\\n\"\n\
  \         << cDegrees << \" degrees Celsius.\\n\";\n}\n```\n\n子任务可能会产生多个值，也可能完全不产生值。在\
  \ C++ 中，一个函数要么返回单个值，要么完全不返回任何值。正如我们在本章稍后看到的，产生多个不同值的子任务通常（也许很矛盾的是）被实现为不返回任何值的函数。然而，目前，让我们避免这种复杂性，专注于直观上不产生任何值的子任务，并看看这些子任务是如何实现的。不返回值的函数被称为\
