  \ vector 的容量。\n\n你可以使用成员函数 `resize` 来更改 vector 的大小。例如，下面的代码将 vector 调整为 24 个元素：\n\
  \n```\nv.resize(24);\n```\n\n如果之前的大小小于 24，则新元素将按照我们为带有整数参数的构造函数所描述的方式进行初始化。如果之前的大小大于\
  \ 24，则除前 24 个元素以外的所有元素都会丢失。如果需要，容量会自动增加。通过使用 `resize` 和 `reserve`，你可以在不再需要某些元素或某些容量时收缩\
