  37        minute = theMinute;\n38    }\n39}\n40DigitalTime::DigitalTime( ) : hour(0),\
  \ minute(0)\n41{\n42    //函数体特意为空。\n43}\n44 \n45void DigitalTime::advance(int minutesAdded)\n\
  46\n{\n47    int grossMinutes = minute + minutesAdded;\n48    minute = grossMinutes\
  \ % 60;\n49 \n50    int hourAdjustment = grossMinutes / 60;\n51    hour = (hour\
  \ + hourAdjustment) % 24;\n52}\n53 \n54void DigitalTime::advance(int hoursAdded,\
  \ int minutesAdded)\n55\n{\n56    hour = (hour + hoursAdded) % 24;\n57    advance(minutesAdded);\n\
  58}\n59 \n60//使用了 iostream:\n61ostream& operator <<(ostream& outs, const DigitalTime&\
  \ theObject)\n62\n{\n63    outs << theObject.hour<< ':';\n64    if (theObject.minute<10)\n\
  65        outs << '0';\n66    outs << theObject.minute;\n67    return outs;\n68}\n\
