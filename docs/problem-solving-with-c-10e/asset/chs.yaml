  \ `expenses` 的值设置为 `0`。但如果 `savings` 小于 `expenses`，则 `if-else` 语句仅输出单词 `Bankrupt`\
  \ 而不改变任何变量的值。\n\n23. 编写一个 `if-else` 语句：如果变量 `exam` 的值大于或等于 `60` 且变量 `programs_done`\
