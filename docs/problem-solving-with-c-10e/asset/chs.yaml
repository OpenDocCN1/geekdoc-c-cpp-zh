  29    #endif //EMPLOYEE_H\n```\n\n# 显示 15.5 派生类 `SalariedEmployee` 的实现\n\n注意，派生类的定义与其他任何类都一样，但在类的第一行添加了冒号、保留字\
  \ `public` 以及基类的名称，例如：\n\n```\nclass HourlyEmployee : public Employee\n{\n```\n\n\
  \n\n\n\n除了继承的成员变量和成员函数外，派生类还可以添加新的成员变量和新的成员函数。新的成员变量和新成员函数的声明在类定义中列出。例如，派生类 `HourlyEmployee`\
  \ 添加了两个成员变量 `wageRate` 和 `hours`，并添加了名为 `setRate`、`getRate`、`setHours` 和 `getHours`\
  \ 的新成员函数。这在显示 15.4 中所示。请注意，你不需要为继承的成员函数提供声明，除非是针对你想要更改其定义的那些函数，这就是为什么我们只从基类 `Employee`\
  \ 中列出了成员函数 `printCheck`。目前，请不要担心派生类构造函数定义的细节。我们将在下一个节中讨论构造函数。\n\n在派生类的实现文件中，例如显示\
  \ 15.6 ![一张插图展示了一个说明派生类“HourlyEmployee”实现的代码段。](img/p846-1.png)\n\n# 显示 15.6 派生类\
  \ `HourlyEmployee` 的实现\n\n图 15.6 完整备用文本\n\n继承的成员函数的定义可以在派生类的定义中进行更改，使其在派生类中的含义与在基类中的含义不同。这被称为**重定义**继承的成员函数。例如，成员函数\
  \ `printCheck()` 在派生类 `HourlyEmployee` 的定义中被重定义。要重定义一个成员函数定义，只需在类定义中列出它并给它一个新的定义，就像对派生类中添加的成员函数做的那样。这通过\
  \ `HourlyEmployee` 类重定义的函数 `printCheck()` 所示（显示 15.4 和 15.6)）。\n\n`SalariedEmployee`\
  \ 是 `Employee` 类的另一个派生类示例。`SalariedEmployee` 类的接口在显示 15.5 中给出。声明为 `SalariedEmployee`\
  \ 类型的对象拥有 `Employee` 的所有成员函数和成员变量，以及 `SalariedEmployee` 类定义中的成员。尽管 `SalariedEmployee`\
  \ 类没有列出任何继承的变量，并且只列出了 `Employee` 类的一个函数，即 `printCheck`（该函数在 `SalariedEmployee` 中更改了定义），然而，`SalariedEmployee`\
  \ 类仍然拥有 `name`、`ssn` 和 `netPay` 三个成员变量，以及成员变量 `salary`。注意，你不需要为了 `SalariedEmployee`\
  \ 拥有这些成员而声明 `Employee` 类的成员变量和成员函数（如 `name` 和 `setName`）。`SalariedEmployee` 类会自动获取这些继承成员，无需程序员进行任何操作。\n\
  \n请注意，`Employee` 类包含了 `HourlyEmployee` 和 `SalariedEmployee` 两个类共同的代码。这避免了你编写两次相同代码的麻烦（一次用于\
  \ `HourlyEmployee` 类，一次用于 `SalariedEmployee` 类）。继承允许你重用 `Employee` 类中的代码。\n\n# 派生类的构造函数\n\
  \n基类的构造函数不会被派生类继承，但你可以在派生类构造函数的定义中调用基类的构造函数，这就是你需要或通常需要的。派生类的构造函数以特殊方式使用基类的构造函数。基类的构造函数初始化从基类继承的所有数据。因此，派生类的构造函数从调用基类的构造函数开始。\n\
  \n调用基类构造函数有一种特殊的语法，这通过显示 15.6 中 `HourlyEmployee` 类的构造函数定义所示：\n\n```\nHourlyEmployee::HourlyEmployee(string\
  \ theName, int theNumber, double theWageRate, double theHours)\n     : Employee(theName,\
  \ theNumber), wageRate(theWageRate), hours(theHours)\n{\n}\n```\n\n\n\n\n调用基类构造函数是派生类构造函数执行的第一个动作。因此，如果类\
  \ `B` 派生自类 `A`，类 `C` 派生自类 `B`，那么当创建一个类 `C` 的对象时，首先会调用类 `A` 的构造函数，然后调用类 `B` 的构造函数，最后执行\
  \ `C` 构造函数的剩余操作。\n\n# `protected` 饰符\n\n正如你所看到的，你不能在派生类的定义或实现中访问私有（private）成员变量或私有（private）成员函数。成员变量和函数有一种分类方式，允许它们在派生类中通过名称访问，但在其他地方（例如在某个非派生类中）无法访问。如果你在类的成员变量或成员函数之前使用\
  \ `protected` 饰符而不是 `private` 或 `public`，那么对于派生类以外的任何类或函数，其效果与成员变量被标记为 `private`\
  \ 相同；但在派生类中，可以通过名称访问该变量。\n\n例如，考虑派生自基类 `Employee` 的类 `HourlyEmployee`。在 `HourlyEmployee::printCheck`\
  \ 的定义中，我们被使用访问器（accessor）和修改器（mutator）成员函数来操作继承的成员变量。如果 `Employee` 类中所有的私有成员变量都用关键字\
  \ `protected` 代替 `private`，那么派生类 `HourlyEmployee::printCheck` 的定义可以简化如下：\n\n```\n\
  void HourlyEmployee::printCheck( )\n // 仅当 Employee 的成员变量被标记为\n // protected 而不是\
  \ private 时才有效。\n {\n    netPay = hours * wageRate;\n\n    cout << \"\\n_ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _\\\
  n\";\n    cout << \"Pay to the order of \" << name << endl;\n    cout << \"The sum\
  \ of \" << netPay << \" Dollars\\n\";\n    cout << \"_ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _\\\
  n\";\n    cout << \"Check Stub: NOT NEGOTIABLE\\n\";\n    cout << \"Employee Number:\
  \ \" << ssn << endl;\n    cout << \"Hourly Employee. \\nHours worked: \" << hours\n\
  \         << \" Rate: \" << wageRate << \" Pay: \" << netPay\n         << endl;\n\
  \    cout << \"_ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _\\\
  n\";\n }\n```\n\n在派生类 `HourlyEmployee` 中，继承的成员变量 `name`、`netPay` 和 `ssn` 可以通过名称访问，前提是它们在基类\
  \ `Employee` 中被标记为 `protected`（而不是 `private`）。然而，在任何非派生自 `Employee` 类的类中，这些成员变量被视为像标记为\
  \ `private` 一样。\n\n基类中被保护（protected）的成员变量在任何派生类中也表现得像也被标记为 `protected`。例如，假设你定义了\
  \ `HourlyEmployee` 类的派生类 `PartTimeHourlyEmployee`。`PartTimeHourlyEmployee` 类继承了\
  \ `HourlyEmployee` 类的所有成员变量，包括 `HourlyEmployee` 继承自 `Employee` 类的成员变量。因此，`PartTimeHourlyEmployee`\
  \ 类将拥有成员变量 `netPay`、`name` 和 `ssn`。如果这些成员变量在 `Employee` 类中被标记为 `protected`，那么就可以在\
  \ `PartTimeHourlyEmployee` 类函数的定义中使用名称使用它们。除了派生类（以及派生类的派生类等）之外，标记为 `protected` 的成员变量的处理方式与标记为\
  \ `private` 相同。\n\n我们包含对 `protected` 成员变量的讨论主要是因为你会看到它们被使用，并且应该熟悉它们。许多（但不是所有）编程权威人士认为使用\
  \ `protected` 成员变量是一种糟糕的风格。他们认为这破坏了隐藏类实现的原则，并且所有的成员变量都应该被标记为 `private`。如果所有成员变量都标记为\
  \ `private`，则继承的成员变量将无法被访问。\n\n### 自测\n\n1. 下程序是否合法（假设已添加了适当的 `include` 指令）？\n\n\
