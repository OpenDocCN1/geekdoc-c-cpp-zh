  \ BaseType a[],\n           int numberUsed, BaseType target);\n//Pre 提条件：numberUsed\
  \ 小于 a 声明的大小。\n// 同时，a[0] 到 a[numberUsed-1] 都有值。\n// 返回满足 a[index] == target 的第一个索引，\n\
