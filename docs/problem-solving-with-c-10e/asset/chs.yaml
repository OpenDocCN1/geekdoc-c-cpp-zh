  72\n{\n73    readHour(ins,theObject.hour);\n74    readMinute(ins,theObject.minute);\n\
  75    return ins;\n76}\n77 \n78int digitToInt(char c)\n79\n{\n80    return (static_cast<int>(c)\
  \ - static_cast<int>('0'));\n81}\n82 \n83//使用了 iostream, cctype, and cstdlib:\n\
  84void readMinute(istream& ins, int& theMinute)\n85\n{\n86    char c1, c2;\n87 \
