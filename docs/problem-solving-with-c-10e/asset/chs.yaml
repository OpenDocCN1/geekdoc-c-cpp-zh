  \ 11.9 作为指南，但此程序将比 Display 11.10 中的程序更简单。）\n\n# 作为类成员的数组\n\n你可以拥有一个带有数组作为成员的结构或类。例如，假设你是一名运动员，希望有一个程序来记录你在不同距离的成绩。你可以使用结构\
  \ `myBest`（下给出的 `Data` 类型）来记录距离：\n\n```cpp\nstruct Data\n{\n    double time[10];\n\
  \    int distance;\n};\nData myBest;\n```\n\n设置距离（米）可以使用以下代码：\n\n```\nmyBest.distance\
  \ = 20;\n```\n\n你可以如下通过键盘输入的值设置十个数组元素：\n\n```\ncout << \"Enter ten times (in seconds):\\\
  n\";\nfor (int i = 0; i < 10; i++)\n    cin >> myBest.time[i];\n```\n\n表达式 `myBest.time[i]`\
  \ 从左到右读取：`myBest` 是结构；`myBest.time` 是名为 `time` 的成员变量。由于 `myBest.time` 是一个数组，添加索引是合理的。因此，表达式\
  \ `myBest.time[i]` 是数组 `myBest.time` 的第 `i` 个索引变量。如果你使用类而不是结构类型，那么就可以用成员函数完成所有的数组操作，避免这种混淆的表达式。这在下面的编程示例中进行了说明。\n\
  \n# 编程示例 用于部分填充数组的类\n\nDisplay 11.10 显示了名为 `TemperatureList` 的类的定义，其对象是温度列表。你可能会在一个天气分析程序中使用\
  \ `TemperatureList` 类型的对象。温度列表存储在成员变量 `list` 中，它是一个数组。由于该数组通常只部分填充，因此使用另一个名为 `size`\
  \ 的成员变量来跟踪数组使用了多少空间。`size` 的值是用于存储值的 `list` 数组的索引变量的数量。\n\n\n\n\n\n```cpp\n 1  \
  \  // 这是一个类的定义\n 2    //TemperatureList。此类型的值是华氏度温度的列表。\n 3     \n 4    #include\
  \ <iostream>\n 5    #include <cstdlib>\n 6    using namespace std;\n 7     \n 8\
  \    const int MAX_LIST_SIZE = 50;\n 9     \n10    class TemperatureList\n 11  \
  \  {\n 12    public:\n 13        TemperatureList( );\n 14        // 将对象初始化为空列表。\n\
  \ 15     \n 16        void addTemperature(double temperature);\n 17        // 前提：列表未满。\n\
  \ 18        // 后置：温度已添加到列表中。\n 19     \n 20        bool full( ) const;\n 21    \
  \    // 如果列表已返回 true，否则返回 false。\n 22     \n 23        friend ostream& operator\
  \ <<(ostream& outs,\n 24            const TemperatureList& theObject);\n 25    \
  \    // 重载 << 运算符以便输出 TemperatureList 类型的值。\n 26        // 温度每行输出一个。\n 27      \
  \  // 前提：如果 outs 是文件输出流，则 outs\n 28        // 已经连接到一个文件。\n 29    private:\n 30 \
  \       double list[MAX_LIST_SIZE]; // 华氏度温度数组\n 31        int size; // 已填充数组位置的数量\n\
  \ 32    };\n 33     \n 34    // 这是 TemperatureList 类的实现。\n 35     \n 36    TemperatureList::TemperatureList(\
  \ ) : size(0)\n 37    {\n 38        // 函数体故意为空。\n 39    }\n 40    void TemperatureList::addTemperature(double\
  \ temperature)\n 41    {// 使用 iostream 和 cstdlib:\n 42        if ( full( ) )\n 43\
  \        {\n 44            cout << \"Error: adding to a full list.\\n\";\n 45  \
  \          exit(1);\n 46        }\n 47        else\n 48        {\n 49          \
  \  list[size] = temperature;\n 50            size = size + 1;\n 51        }\n 52\
  \    }\n 53    bool TemperatureList::full( ) const\n 54    {\n 55        return\
  \ (size == MAX_LIST_SIZE);\n 56    }\n 57    // 使用 iostream:\n 58    ostream& operator\
  \ <<(ostream& outs, const TemperatureList& theObject)\n 59    {\n 60        for\
  \ (int i = 0; i < theObject.size; i++)\n 61            outs << theObject.list[i]\
  \ << \" F\\n\";\n 62        return outs;\n 63    }\n```\n\n# 示例 11.10 带有数组成员的类程序\n\
  \n`TemperatureList` 类型对象的声明方式与任何其他类型的对象相同。例如，以下代码将 `myData` 声明为 `TemperatureList`\
  \ 类型对象：\n\n```\nTemperatureList myData;\n```\n\n此声明为新对象 `myData` 调用了默认构造函数，因此对象\
  \ `myData` 被初始化，使得成员变量 `size` 的值为 `0`，表示一个空列表。\n\n一旦你声明了如 `myData` 这样的对象，就可以通过调用成员函数\
  \ `addTemperature` 向温度列表（即向成员数组 `list`）添加项，如下所示：\n\n```\nmyData.addTemperature(77);\n\
  ```\n\n事实上，这是你向列表 `myData` 添加温度的唯一方法，因为数组 `list` 是一个私有成员变量。请注意，当你调用成员函数 `addTemperature`\
  \ 添加项时，该函数调用会首先测试数组列表是否已满，并且只有在数组未满时才会添加该值。\n\n`TemperatureList` 类是非常专门的。你对 `TemperatureList`\
  \ 类对象可以进行的操作只有：初始化列表使其为空、向列表添加项、检查列表是否已满以及输出列表。要输出存储在（之前声明的）对象 `myData` 中的温度，其调用方式如下：\n\
  \n```\ncout << myData;\n```\n\n由于此，通过 `TemperatureList` 类，你无法从温度列表（数组）中删除温度。但是，你可以通过调用默认构造函数删除整个列表并从空列表重新开始，如下：\n\
  \n```\nmyData = TemperatureList();\n```\n\n`TemperatureList` 类型几乎没有使用温度的属性。你可以为压力列表、距离列表或任何其他表示为\
  \ `double` 类型值的列表定义类似的类。为了省去定义所有这些不同类的麻烦，你可以定义一个单一类，它表示一个任意的 `double` 类型值列表，而不必指定这些值代表什么。\n\
  \n### 自测练习\n\n1. 修改 Display 11.10 中提供的 `TemperatureList` 类，添加一个名为 `getSize` 的成员函数，该函数不接受参数并返回温度的数量。\n\
  \n2. 修改 Display 11.10 中提供的 `TemperatureList` 类型，添加一个名为 `getTemperature` 的成员函数，它接受一个大于等于\
  \ `0` 且严格小于 `MAX_LIST_SIZE` 的 `int` 参数，并返回该位置的 `double` 值。因此，当参数为 `0` 时，`getTemperature`\
  \ 返回第一个温度；参数为 `1` 时返回第二个，依此类推。假设 `getTemperature` 不会被带有列表中不存在的位置参数的调用。\n\n# 11.4\
  \ 类与动态数组\n\n> 带有所有的设备和手段。\n\n威廉·莎士比亚，第四部分第三部\n\n动态数组的基类型可以是类。类可以拥有一个动态数组作为成员变量。你可以以任何方式结合所学习的类技术和动态数组技术。在使用类和动态数组时会有更多需要注意的事情，但基础技术是你已经掌握的。让我们从一个示例开始。\n\
  \n# 编程示例 字符串变量类\n\n在第 8 章中，我们展示了如何定义数组变量来存储 C 字符串。在上节中，你学习了如何定义动态数组，以便数组的大小可以在运行时确定。在这个示例中，我们将定义一个名为\
  \ `StringVar` 的类，其对象是字符串变量。`StringVar` 类的对象将使用运行时确定的动态数组来实现。因此 `StringVar` 类型的对象具有动态数组的所有优势，同时也具有额外的功能。我们将定义\
  \ `StringVar` 的成员函数，如果你尝试将过长的字符串赋值给 `StringVar` 类型的对象，将收到错误消息。我们定义的版本仅提供了处理字符串对象的一小部分操作。在编程项目\
  \ 1 中，你将被要求添加更多成员函数和重载运算符来增强类定义。\n\n\n\n\n\n`StringVar` 类型的定义在显示 11.11 中。`StringVar`\
  \ 类的一个一个构造函数接受一个 `int` 类型的单一参数。该参数决定了对象中存储的字符串值的最大允许长度。默认构造函数创建一个最大允许长度为 100 的对象。另一个构造函数接受一个数组参数，该数组包含一个第\
  \ 8 章中讨论的类型的 C 字符串。注意，这意味着该构造函数的参数可以是带引号的字符串。该构造函数初始化对象，使其能够容纳任何长度小于或等于参数长度的字符串，并将对象的字符串值初始化为该参数值的拷贝。目前，忽略标记为拷贝构造函数（Copy\
  \ constructor）的构造函数。同时也忽略名为 `~StringVar` 的成员函数。尽管它看起来像是一个，但 `~StringVar` 并不是构造函数。我们将在后面的子节中讨论这两种新类型的成员函数。`StringVar`\
  \ 类其余成员函数的含义非常直观。\n\n![](img/p671-1.png) ![插图显示了一个使用“StringVar 类”的程序。](img/p672-1.png)\n\
  \n###get 对话\n\n```\nWhat is your name?\nKathryn Janeway\nWe are Borg\nWe will meet\
  \ again Kathryn Janeway\nEnd of demonstration\n```\n\n# 显示 11.11 使用 `StringVar`\
  \ 类的程序\n\n图 11.11 完整替代文本\n\n一个简单的演示程序在显示 11.11 中。两个对象 `yourName` 和 `ourName` 在函数\
  \ `conversation` 的定义内部声明。对象 `yourName` 可以包含任何长度为 `maxNameSize` 或更短的字符串。对象 `ourName`\
  \ 初始化为字符串值 `\"Borg\"`，其值可以更改为任何长度为 `4` 或更短的字符串。\n\n正如我们在本子节开头指出的，该类是通过动态数组实现的。实现方式在显示\
  \ 11.12 中。声明一个 `StringVar` 类型的对象时，会调用构造函数来初始化对象。该构造函数使用 `new` 运算符为成员变量 `value` 创建一个新的字符动态数组。字符串值作为普通字符串值存储在数组\
  \ `value` 中，并用 `'\\0'` 标记字符串的结束。注意，该数组的大小直到对象声明时才确定，此时会调用构造函数，而构造函数的参数决定了动态数组的大小。正如显示\
  \ 11.11 所示，该参数可以是一个 `int` 类型的变量。查看函数 `conversation` 定义中对象 `yourName` 的声明。构造函数的参数是按值参数\
  \ `maxNameSize`。回想按值参数是一个局部变量，因此 `maxNameSize` 是一个变量。任何 `int` 变量都可以这样用作构造函数的参数。\n\
  \n![](img/p674-1.png) ![插图显示了一个说明“StringVar”实现的代码段。](img/p675-1.png)\n\n# 显示 11.12\
  \ `StringVar` 的实现\n\n图 11.12 完整替代文本\n\n成员函数 `length`、`input_line` 和重载输出运算符 `<<`\
  \ 的实现都很直观。在接几个子节中，我们将讨论函数 `~StringVar` 和标记为拷贝构造函数（Copy constructor）的构造函数。\n\n# 析构函数\n\
  \n动态变量有一个问题。除非程序适当调用 `delete`，否则它们不会消失。即使动态变量是用局部指针变量创建的，且局部指针变量在函数调用结束时消失，如果没有调用\
  \ `delete`，动态变量仍然会存在。如果没有删除动态变量，它将继续占用内存。\n\n为了解决这个问题，C++ 有一种特殊的成员称为**析构函数**（destructor）。析构函数是在当对象离开作用域时自动调用的成员函数。如果类有一个合适的析构函数，它将调用\
  \ `delete` 来消除动态变量。\n\n成员函数 `~StringVar` 给在显示 11.12 中。`~StringVar` 调用 `delete` 来消除由成员变量\
  \ `value` 指向的动态数组。与构造函数一样，析构函数与类名相同，但名称开头有一个波浪号 `~`。与构造函数一样，它没有返回类型，甚至没有 `void`。\n\
  \n# 拷贝构造函数\n\n**拷贝构造函数**是一个具有一个与类类型相同的参数的构造函数。该参数必须是一个按引用传递的参数，通常该参数前面会有 `const`\
  \ 参数修饰符，因此它是一个常量参数。在所有其他方面，拷贝构造函数的定义与任何其他构造函数相同，并且可以像其他构造函数一样使用。\n\n\n\n\n\n```\n\
  StringVar line(20), motto(\"Constructors can help.\");\ncout << \"Enter a string\
  \ of length 20 or less:\\n\";\nline.inputLine(cin);\nStringVar temp(line);//通过拷贝构造函数初始化。\n\
  ```\n\n用于初始化三个 `StringVar` 类型对象中的每一个对象的构造函数是由对象名称后括号内给定的参数类型决定的。对象 `line` 由一个具有类型为\
  \ `int` 参数的构造函数初始化；对象 `motto` 由具有类型为 `const char a[]` 参数的构造函数初始化。同样，对象 `temp` 由一个具有一个类型为\
  \ `const StringVar&` 参数的构造函数初始化。当以这种方式使用时，就像使用任何其他构造函数一样使用了拷贝构造函数。\n\n拷贝构造函数的定义使得被初始化的对象成为其参数的完整、独立的拷贝。因此，在声明中：\n\
  \n```\nStringVar temp(line);\n```\n\n成员变量 `temp.value` 并不是简单地设置为与 `line.value` 相同的值；这将产生两个指向同一个动态数组的指针。拷贝构造函数的定义可见显示\
  \ 11.12。注意，在拷贝构造函数的定义中，创建了一个新的动态数组，并将一个动态数组的内容复制到另一个动态数组。因此，在之前的声明中，`temp` 的初始化使得其字符串值等于\
  \ `line` 的字符串值，但 `temp` 拥有一个独立的动态数组。因此，对 `temp` 享的任何更改对 `line` 都没有影响。这被称为**深拷贝**。在第\
  \ 10 章中讨论的浅拷贝只会拷贝内存中同一个动态数组的引用。深拷贝会为任何动态结构创建一个新拷贝。\n\n正如你所看到的，拷贝构造函数可以像任何其他构造函数一样被使用。拷贝构造函数在某些其他情况下也会自动调用。粗略来说，每当\
  \ C++ 需要对对象进行拷贝时，它就会自动调用拷贝构造函数。特别是，拷贝构造函数会在三种情况下自动调用：(1) 当声明类对象并由另一个同类型的对象初始化时；(2)\
  \ 当函数返回一个类类型的值时；(3) 每当类类型的参数作为按值传递（call-by-value）参数被调用时。在这种情况下，拷贝构造函数定义了什么是“代入”。\n\
  \n为了理解为什么你需要拷贝构造函数，让我们看看如果我们不为 `StringVar` 类定义拷贝构造函数，会发生什么。假设我们没有在 `StringVar` 类的定义中包含拷贝构造函数，并假设我们在函数定义中使用按值传递参数，例如：\n\
  \n```\nvoid showString(StringVar theString)\n{\n    cout << \"The string is: \"\n\
  \         << theString << endl;\n}\n```\n\n考虑以下代码，它包含一个函数调用：\n\n```\nStringVar greeting(\"\
  Hello\");\nshowString(greeting);\ncout << \"After call: \" << greeting << endl;\n\
  ```\n\n假设没有拷贝构造函数，执行过程如下：当执行函数调用时，`greeting` 的值被拷贝到局部变量 `theString` 中，因此 `theString.value`\
  \ 被设置为 `greeting.value`。但这些是指针变量，因此在函数调用期间，`theString.value` 和 `greeting.value`\
  \ 指向同一个动态数组，如下：\n\n![箭头从两个并排的框（分别标记为“greeting.value”和“theString.value”）指向一个包含行“Hello”的框（包括引号）。](img/ua11_0100.png)\n\
  \n当函数调用结束时，会调用 `StringVar` 的析构函数将 `theString` 使用的内存返回堆（freestore）。析构函数的定义包含以下语句：\n\
  \n```\ndelete [] value;\n```\n\n由于析构函数是带对象 `theString` 用的，此语句等同于：\n\n```\ndelete\
  \ [] theString.value;\n```\n\n这使得图片变为如下：\n\n![箭头从两个并排的框（分别标记为“greeting.value”和“theString.value”）指向一个包含行“Undefined”的不规则形状轮廓。](img/ua11_0200.png)\n\
  \n由于 `greeting.value` 和 `theString.value` 指向同一个动态数组，删除 `theString.value` 等同于删除 `greeting.value`。因此，当程序到达以下语句时，`greeting.value`\
  \ 是未定义的：\n\n```\ncout << \"After call: \" << greeting << endl;\n```\n\n因此，这个 `cout`\
  \ 语句是未定义的。这个 `cout` 语句可能会碰巧给你想要的输出，但迟早晚，`greeting.value` 未定义的这一事实将产生问题。一个主要问题发生在对象\
  \ `greeting` 是某个函数中的局部变量时。在这种情况下，当函数结束时，会带 `greeting` 调用析构函数。该析构函数调用等同于：\n\n```\n\
  delete [] greeting.value;\n```\n\n但正如我们看到的，`greeting.value` 指向的动态数组已经被删除，现在系统试图第二次删除它。两次调用\
  \ `delete` 同一个动态数组会产生程序崩溃的严重错误。如果没有拷贝构造函数就会发生这种情况。幸运的是我们在 `StringVar` 类定义中包含了拷贝构造函数，所以当执行函数调用时，拷贝构造函数会被调用：\n\
  \n```\nStringVar greeting(\"Hello\");\nshowString(greeting);\n```\n\n拷贝构造函数定义了将参数\
  \ `greeting` “代入”按值传递参数 `theString` 的含义，因此现在如下：\n\n![箭头从标记为“greeting.value”和“theString.value”的两个框指向各自包含“Hello”的独立框。](img/ua11_0300)\n\
  \n因此，对 `theString.value` 的任何更改对 `greeting` 都没有影响，析构也没有问题。如果先调用 `theString` 然后调用\
  \ `greeting`，每次调用删除的是不同的动态数组。\n\n当函数返回类类型的值时，会自动调用拷贝构造函数来拷贝返回语句的值。如果没有拷贝构造函数，将发生类似于我们在参数处描述的问题。\n\
  \n如果类定义涉及使用 `new` 操作符的指针和动态分配内存，你需要包含拷贝构造函数。通常拷贝构造函数应该对动态内存进行深拷贝。不涉及指针或动态分配内存的类不需要拷贝构造函数。默认执行的浅拷贝通常足够。\n\
  \n与你预期相反，当你使用赋值运算符将一个对象等于另一个对象时，并不会调用拷贝构造函数。¹⁸ 如果不喜欢默认赋值运算符的作用，可以在“重载赋值运算符”小节描述的方法重新定义赋值运算符。\n\
  \n### 自测练习\n\n23. 如果类名为 `MyClass` 且它有一个构造函数，那么构造函数叫什么？如果 `MyClass` 有析构函数，那么析构函数叫什么？\n\
  \n24. 假设你将显示 11.12 中的析构函数定义改为如下内容。那么显示 11.11 中的示例对话会发生什么变化？\n\n\n\n\n\n```cpp\n\
  StringVar::~StringVar()\n{\n    cout << endl\n         << \"Good-bye cruel world!\
  \ The short life of\\n\"\n         << \"this dynamic array is about to end.\\n\"\
