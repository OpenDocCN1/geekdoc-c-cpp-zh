  \        void Employee::printCheck( ) const\n46        {\n47            cout <<\
  \ \"\\nERROR: printCheck FUNCTION CALLED FOR AN \\n\"\n48                 << \"\
  UNDIFFERENTIATED EMPLOYEE. Aborting the program.\\n\"\n49                 << \"\
  Check with the author of the program about this bug.\\n\";\n50            exit(1);\n\
  51        }\n\n52    }//employeessavitch\n```\n\n# 显示 15.3 基类 `Employee` 的实现\n\n\
  你可以拥有一个（未区分的）`Employee` 对象，但我们定义 `Employee` 类的目的是为了为不同类型的员工定义派生类。特别是 `printCheck`\
  \ 函数的定义将在派生类中总是会被改变，以便不同类型的员工拥有不同类型的支票。这在 `Employee` 类的 `printCheck` 函数定义中有所体现。为这样一个（未区分的）`Employee`\
  \ 打印支票毫无意义。我们对该员工的工资详情一无所知。因此，我们实现了 `Employee` 类的 `printCheck` 函数，以便如果对基类 `Employee`\
  \ 对象调用 `printCheck`，程序将带有错误消息停止。正如你所看到的，派生类将拥有足够的信息来重新定义 `printCheck` 函数，以产生有意义的员工支票。\n\
  \n派生自 `Employee` 类的类将自动拥有 `Employee` 类的所有成员变量（`name`、`ssn` 和 `netPay`）。派生自 `Employee`\
  \ 类的类也将拥有 `Employee` 类的所有成员函数，例如 `printCheck`、`getName`、`setName` 以及显示 15.2 中列出的其他成员函数。这通常通过说派生类继承成员函数来表示。\n\
  \n`Employee` 类的定义见显示 15.4。C++并不要求它们在同一个命名空间中，但由于它们是相关的，将它们放在那里是有意义的。\n\n# 显示 15.4\
