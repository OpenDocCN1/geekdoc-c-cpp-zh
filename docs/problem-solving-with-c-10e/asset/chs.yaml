  \ result + (last1 − first1) + (last2 − first2)。\n14    //时间复杂度：与范围 [first1, last1)\
  \ 的大小成正比，\n15    //加上 [first2, last2) 的大小。\n```\n\n排序使用了 `>` 运算符，因此必须定义 `>` 运算符。还有其他版本（此处未列出），它们允许你提供排序关系。已排序意味着按升序排列。\n\
  \n# 显示 18.21 某些通用排序算法\n\n# 18.4 C++ 正在演进\n\nC++ 是一种不断演进的语言。`ISO`（国际标准组织）的一个委员会负责批准对\
  \ C++ 的提案更改。每隔几年就会发布新标准。在本节中，我们将简要介绍添加到 `C++11` 标准中的一些额外功能。这里包含的主题作为计算机编程和计算机科学中更高级主题的介绍。如果你想深入研究这些主题，请咨询更高级的教科或在\
  \ `https://isocpp.org/` 上查看 `ISO C++` 标准。\n\n# std::array\n\n标准容器 `array` 包含在 `<array>`\
  \ 库中，允许你使用类似 vector 的符号对固定大小的元素序列进行随机访问。本质上，该容器允许你像 vector 一样安全地访问数组元素，但具有普通数组的性能和极低的存储要求。\n\
  \n显示 18.22 展示了如何在创建一个六个整数的数组的同时初始化前三个元素。其余三个元素会自动初始化为零，因此我们不会像标准数组那样遇到未知未初始化值的问题。\n\
  \n```\n 1    #include <iostream>\n 2    #include <array>\n 3\t  \n 4    using std::cout;\n\
  \ 5    using std::endl;\n 6    using std::array;\n 7\n 8    int main()\n 9    {\n\
  10        // 分配了数组以存储六个整数。\n11        // 前三个被设置为 10, 20 和 30，而\n12        // 剩余部分设置为\
  \ 0。\n13        array<int,6> a = {10, 20, 30};\n15\n15        cout << \"The size\
  \ of the array: \" << a.size() << endl;\n16        cout << \"The element at index\
  \ 1: \" << a[1] << endl;\n17        cout << \"Setting a[4] to 100\" << endl;\n18\
  \        a[4] = 100;\n19        cout << \"Outputting all elements of the array:\
  \ \" << endl;\n20        for (int element : a)\n21             cout << \" \" <<\
  \ element << endl;\n22    }\n```\n\n示例对话\n\n```\nThe size of the array: 6\nThe element\
  \ at index 1: 20\nSetting a[4] to 100.\nArray contains:\n10\n20\n30\n0\n100\n0\n\
  ```\n\n# 显示 18.22 std::array\n\n与 vector 类似但与标准数组不同，我们可以使用 `size()` 函数获取数组的大小。我们也可以使用传统的\
  \ `[]` 记法来读取和设置数组的内容。尝试读取范围之外的值返回 0，而尝试设置范围之外的值则没有影响。注意，数组中的索引 3 和 5 被设置为默认值 0。\n\
  \n我们可以使用 vector 可用的相同算法。例如，如果包含了 `<algorithm>`，我们就可以在迭代器 `begin()` 和 `end()` 指定范围内对数组进行排序。\n\
  \n```cpp\nstd::sort(a.begin(), a.end());\ncout << \"After sort, array contains:\
  \ \" << endl;\nfor (int element : a)\n    cout << element << endl;\n```\n\n输出是排序顺序的数组：\n\
  \n```\nAfter sort, array contains:\n0\n0\n10\n20\n30\n100\n```\n\n# 正则表达式\n\n关于正则表达式的完整论述超本书的范围，但这里描述了正则表达式的总结以及一些\
  \ C++ 示例。在编写时，某些编译器尚不支持。\n\n# 显示 18.23 基础正则表达式\n\n这里是一些简单正则表达式的示例：\n\n| 描述 | 正则表达式\
  \ |\n| --- | --- |\n| 三个 a 后面跟三个 b | `aab` 或 `a{3}b{3}` |\n| 零或多个 a 的任意序列 | `a*`\
  \ |\n| 一个或多个 a 后面跟任意数量 b | `a+b*` |\n| 标识符的规则，即字母或下划线后跟任意字母、数字或下划线序列 | `[a-zA-Z_]+[a-zA-Z0-9]*`\
  \ |\n\nC++11 正则表达式库包含了许多有用的字符类。其中一些如下表所示：\n\n| 正则表达式 | 含义 |\n| --- | --- |\n| `\\\
  d` | 单个数字 |\n| `\\D` | 非数字 |\n| `\\s` | 空格字符（例如：制表符、换行符、空格） |\n| `\\w` | 单词字符 |\n\
  \n我们可以利用这些类来简化模式。例如，如果我们想匹配连续两个单词，那么正则表达式 `\\w+\\s\\w+` 将匹配任意的一个或多个单词字符序列，后跟一个空格，再是任意的一个或多个单词字符序列。\n\
  \n匹配正则表达式的 C++11 包含了 `<regex>` 库。`regex` 类是 `std` 命名空间的一部分并接受模式作为输入。`regex` 类拥有函数\
  \ `regex_match` 用于精确匹配字符串、`regex_search` 用于在字符串中查找模式的出现情况，以及 `regex_replace` 用格式字符串替换字符串中的匹配项。\n\
  \n\n\n\n\n# 显示 18.24 (#fileP7001013976000000000000000008195.xhtml_P700101397600000000000000008195)\n\
  \n演示了 `regex_match` 如何判断 `text1` 或 `text2` 是否匹配由空格分隔的两个单词的模式。注意，由于我们需要在模式中包含字面量\
  \ `\\`，C++ 字面量字符串变得有用，可以简化模式。否则，我们需要用两个 `\\\\` 来表示单个 `\\`，因为 `\\` 是转义字符。\n\n```\n\
  1    #include <iostream>\n2    #include <regex>\n3    #include <string>\n4    \n\
  5    using std::cout;\n6    using std::endl;\n7    using std::string;\n8    \n9\
  \    int main()\n10   {\n11        string text1 = \"hello world\";\n12        string\
  \ text2 = \"hello   world\";\n13        string phonePattern = R\"(\\d{3}-\\d{3}-\\\
  d{4})\"; // 字面量字符串而非转义字符。\n14        string twoWordPattern = R\"(\\w+\\s+\\w+)\"\
  ; // 一个由空格分隔的两个单词的模式\n15        regex regPhone(phonePattern);\n16        regex regTwoWord(twoWordPattern);\n\
  17\n18       string s;\n19        cout << \"Enter a string to test the phone pattern:\
  \ \" << endl;\n20        getline(std::cin, s);\n21        if (regex_match(s, regPhone))\n\
  22             cout << s << \" matches \" << phonePattern << endl;\n23        else\n\
  24             cout << s << \" doesn't match \" << phonePattern << endl;\n25\n26\
  \        cout << \"Enter a string to test the two word pattern: \" << endl;\n27\
  \        getline(std::cin, s);\n28        if (regex_match(s, regTwoWord))\n29  \
  \           cout << s << \" matches \" << twoWordPattern << endl;\n30        else\n\
  31             cout << s << \" doesn't match \" << twoWordPattern << endl;\n32 \
  \  }\n```\n\n**示例对话 1**\n\n```\nEnter a string to test the phone pattern:\n907-867-5309\n\
  907-867-5309 matches \\d{3}-\\d{3}-\\d{4}\nEnter a string to test the two word pattern:\n\
  hello world\nhello world matches \\w+\\s+\\w+\n```\n\n**示例对话 2**\n```\nEnter a string\
  \ to test the phone pattern:\n867-5309\n867-5309 doesn't match \\d{3}-\\d{3}-\\\
  d{4}\nEnter a string to test the two word pattern:\nhello   world\nhello   world\
  \ doesn't match \\w+\\s+\\w+\n```\n\n# 18.24 正则表达式匹配\n\n作为电话模式的进一步示例，让我们如何组合正则表达式来匹配任意格式的电话号码：\n\
  \n* `(999) 999-999`\n* `999-999-999`\n* `999 999`\n\n我们需要匹配第一组三个数字。为了精确匹配三个数字，我们可以使用\
  \ `\\d` 表示数字，使用 `{3}` 表示三个：\n\n```\n\\d{3}\n```\n\n为了考虑到括号，我们可以允许可选的左右括号。必须在括号前面使用转义字符，否则括号将被解释为分组。`(`\
  \ 之后的 `?` 匹配一个左括号，`)` 之后的 `?` 匹配一个右括号。目前带括号的三个数字正则表达式为：\n\n```\n\\(?\\d{3}\n```\n\
  \n连字符或空格将第一组数字与下一组三个数字隔开。我们可以用正则表达式 `(-|\\s)` 匹配连字符或空格，当将其添加到正则表达式末尾时如下：\n\n```\n\
  \\(?\\d{3}\\)?(-\\s)\n```\n\n接下来我们重复三个数字组：\n\n```\n\\(?\\d{3}\\)?(-\\s)\\d{3}\n\
  ```\n\n最后，我们有连字符或空格以及精确四个数字：\n\n```\n\\(?\\d{3}\\)?(-\\s)\\d{4}\n```\n\n以下代码片段输出“Phone\
  \ number found”，因为 `regex_search` 在目标字符串的任何地方找到正则表达式的匹配：\n\n```\nstring text = \"\
  Call me at (907) 867-5309\";\nstring pattern = R\"(\\?\\d{3}\\)?(-\\s)\\d{4})\"\
  ;\nregex reg(pattern); \nif (regex_search(text, reg))\n    cout << \"Phone number\
  \ found\" << endl;\n```\n\n最后，如果你想找到正则表达式的所有出现处，可以使用正则表达式迭代器。`sregex_iterator` 类用于遍历字符串中的所有匹配。`regex_iterator`\
  \ 类用于 C 风格字符串。示例显示了字符串中的所有电话号码。迭代器的构造函数接受正则表达式以及字符串开始和结束的引用。注意，默认情况下 `end_iterator`\
  \ 初始化为我们可以用于 `cur_iterator` 的结束条件。\n\n```\nstring text = \"Call me at my desk phone\
  \ (907) 867-5309 \" +\n              \"or my cell phone 907-350-3491.\";\nstring\
  \ pattern = R\"(\\?\\d{3}\\)?(-\\s)\\d{3}(-\\s)\\d{4})\";\nregex reg(pattern);\n\
  \nsregex_iterator cur_iterator(text.begin(), text.end(), reg);\nsregex_iterator\
  \ end_iterator;\nwhile (cur_iterator != end_iterator)\n{\n    cout << cur_iterator->str()\
  \ << endl;\n    cur_iterator++;\n}\n```\n\n**示例对话**\n\n```\n(907) 867-5309\n907-350-3491\n\
  ```\n\n# 线程\n\n线程是一个独立的计算过程。在 C++ 中，你可以拥有多线程的程序。你可以将线程视为并行执行的计算，这意味着线程是并行的。\n\n\
  你已经经历过线程。现代操作系统允许你运行多个程序。例如，与其等待扫描程序完成，你可以继续例如在扫描程序仍在执行时读取电子邮件。在许多情况下，线程并没有真正并行执行。相反，计算机在线程之间切换，以便每个线程执行一点计算。在具有足够处理器的计算机上，线程确实可以并行执行。读取电子邮件的程序确实变慢了，但由于人类比计算机慢得多，任何明显的变慢可能不会被察觉。\n\
  \n当你需要额外的速度并想要（可能）并行运行计算，以及当另一个线程被阻塞/停止（等待输入）时想让某些处理继续时，线程是有用的。在图形处理器（GPU）编程中，你可以拥有成千上万的线程！在支持\
  \ GPU 的服务器或工作站上运行以前的超级计算机可能的。\n\n与本节的其他部分一样，我们只通过一些示例提供线程的介绍。显示 18.25 中的第一个示例了如何在单独线程中运行函数。\n\
  \n```\n1    #include <iostream>\n2    #include <thread>\n3 \n4    using std::cout;\n\
  5    using std::endl;\n6    using std::thread; \n7    \n8    void func(int a)\n\
  9    {\n10        cout << \"Hello World: \" << a << \" \"\n11             << std::this_thread::get_id()\
  \ << endl;\n12    }\n13\n14    int main()\n15    {\n16        thread t1(func, 10);\n\
  17        thread t2(func, 20);\n18        t1.join();\n19        t2.join();\n20 \
  \   }\n```\n\n**示例对话**\n\n![插图显示了以下输出](img/p1014-1.png)\n\n# 显示 18.25 **线程 Hello\
  \ World**\n\n编译程序时，你可能需要与线程库链接。例如，Linux 环境下 g++ 编译器的典型命令行参数为：\n\n```\ng++ program.cpp\
  \ –std=c++11 −pthread\n```\n\n\n\n\n此程序启动了两个线程。每个线程都运行 `func` 函数。每个线程还会自动获得一个唯一\
  \ ID，如果需要，我们可以通过 `get_id()` 访问它。传递一个 ID 编号通常是有用的，我们通过传递变量 `a` 中的数字实现了这一点。\n\n如果你运行该程序，你将看到两个线程在运行并输出“Hello\
  \ World”。一旦线程启动，我们就失去了对它何时运行的控制权——这现在取决于操作系统了！你可以通过反复运行线程看到这一点。最终，你应该看到每个线程的输出覆盖了另一个。这是因为当一个线程正在输出它的消息时，会发生上下文切换，我们运行了第二个线程，它会直接在第一个线程文本的中间吐出它的文本。\n\
  \n`join()` 函数让主函数等待每个线程完成后再继续。这对于同步多个线程至关重要。\n\n如果我们想避免线程相互覆盖，可以添加一个 `mutex`（互斥锁）来实现互斥。它会锁定线程，使得一次只有一个线程能进入某个代码区域。这对于某些程序防止死锁或其他类型的错误极其重要（如果你学习操作系统，会看到更多这类内容）。显示\
  \ 18.26 中的修改强制其他线程等待，因此一次只有一个线程可以运行 `func` 中的代码。\n\n```cpp\n 1    #include <iostream>\n\
  \ 2    #include <thread>\n 3    #include <mutex>\n 4    \n 5    using std::cout;\n\
  \ 6    using std::endl;\n 7    using std::thread;\n 8    using std::mutex;\n 9 \
  \                    \n10    mutex globalLock;\n11    \n12    void func(int a)\n\
  13    {\n14        globalLock.lock();\n15        cout << \"Hello World: \" << a\
  \ << \" \"\n16             << std::this_thread::get_id() << endl;\n17        globalLock.unlock();\n\
  18    }\n19    int main()\n20    {\n21        thread t1(func, 10);\n22        thread\
  \ t2(func, 20);\n23        t1.join();\n24        t2.join();\n25}\n```\n\n# 显示 18.26\
  \ 线程与 `mutex`\n\n想要一个或两个以上的线程是很常见的。在这种情况下，我们可以创建一个线程数组。这里是创建一个包含 10 个线程数组的代码：\n\n\
  ```cpp\nthread tArr[10];\nfor (int i =0; i < 10; i++)\n        tArr[i] = thread(func,\
  \ i);\nfor (int i =0; i < 10; i++)\n        tArr[i].join();\n```\n\n注意运行哪个线程首先运行的不可预测性！\n\
  \n```\nHello World: 0 140198342674176\nHello World: 3 140198311204608\nHello World:\
  \ 2 140198321694464\nHello World: 4 140198300714752\nHello World: 1 140198332184320\n\
  Hello World: 5 140198290224896\nHello World: 6 140198279735040\nHello World: 7 140198269245184\n\
  Hello World: 8 140198258755328\nHello World: 9 140198248265472\n```\n\n你可能希望在线程中运行一个类。显示\
  \ 18.27 中提供了一个实现此点的模板。在这种情况下，我们将类命名为 `Runnable`，但可以使用任何你喜欢的名称。\n\n```cpp\n 1   \
  \ #include <iostream>\n 2    #include <thread>\n 3\n 4    using std::cout;\n 5 \
  \   using std::endl;\n 6    using std::thread; \n 7    \n 8    class Runnable\n\
  \ 8    {\n 9        public:\n10            Runnable();\n11            Runnable(int\
  \ n);\n12        void operator()();  // 注意这里的两个 ()()\n13        private:\n14   \
  \     int num;\n15    };\n16\n17    Runnable::Runnable() : num(0)\n18    {\n19 \
  \   }\n20    Runnable::Runnable(int n) : num(n)\n21    {\n22    }\n23    void Runnable::operator()()\n\
  24    {\n25            cout << \"Hello world, I am number \" << num << endl;\n26\
  \    }\n27\n28    int main()\n29    {\n30        Runnable r1(10);\n31        Runnable\
  \ r2(20);\n32\n33        thread t1(r1);\n34        thread t2(r2);\n35\n36      \
  \  t1.join();\n37        t2.join();\n38}\n\n# 显示 18.27 在线程中运行类\n\n当线程启动时，`Runnable`\
  \ 类执行 `operator()` 方法。任何想要传递给线程的数据通常在构造函数中发送。显示 18.28 程序创建了三个线程，每个线程可能并行地搜索数组的一部分。找到的最小值存储在\
  \ `results` 数组中，我们为每个线程留了一个位置。`main` 函数需要遍历 `results` 数组。\n\n```cpp\n 1    #include\
  \ <iostream>\n 2    #include <thread>\n 3    \n 4    using std::cout;\n 5    using\
  \ std::endl;\n 6    using std::thread;\n 7\n 8    class Runnable\n 9    {\n10  \
  \  public:\n11       Runnable();\n12       Runnable(int *target, int *results, int\
  \ num, int end);\n13       void operator()();\n14       private:\n15       int *target,\
  \ *results;\n16       int num, start, end;\n17    };\n18\n19    Runnable::Runnable()\n\
  20    {\n21       target=nullptr;\n22       results=nullptr;\n23       num=0;\n\
  24       start=0;\n25       end=0;\n26    }\n27\n28    Runnable::Runnable(int *target,\
  \ int *results, int num,\n39                       end)\n30      this->target= target;\n\
  31      this->results = results;\n32      this->num = num;\n33      this->start\
  \ = start;\n34      this->end = end;\n35    }\n36\n37    void Runnable::operator()()\n\
  38    {\n39        int min = target[start];\n40        for (int i=start+1; i<=end;\
  \ i++)\n41        {\n42        if(target[i]<min)\n43                min = target[i];\n\
  44        }\n45        results[num] = min;\n46    }\n47\n48    int main()\n49  \
  \  {\n50        thread tarr[3];\n51        int target[] = {31, 66, 41, 8, 92, 47,\
  \ 22, 87, 45, 92, 4, 14};\n52        int results[] = {999, 999, 999, 999};\n53 \
  \       for (int i = 0; i < 3; i++)\n54        {\n55             Runnable r(target,\
  \ results, i, i*4, i*4+3);\n56             tarr[i] = thread(r);\n57        }\n58\
  \        for (int i =0; i < 3; i++)\n59            tarr[i].join();\n60        for\
  \ (int i =0; i < 3; i++)\n61            cout << results[i] << endl;\n62        int\
  \ min = results[0];\n63        if (min > results[1])\n64             min = results[1];\n\
  65        if (min > results[2])\n66             min = results[2];\n67        cout\
  \ << \"The minimum from threaded min-search is \" << min << endl;\n68    }\n```\n\
  \n示例对话\n\n```\n8\n22\n4\nThe minimum from threaded min-search is 4\n```\n\n# 显示\
  \ 18.28 使用线程搜索数组\n\n代码发送了要搜索的数组、结果数组、一个 ID 以及每个线程搜索的边界。每个线程随后搜索其所在的数组部分，找到最小值，并使用其\
  \ ID 确定在 `results` 数组中放置结果的唯一位置。\n\n# 智能指针\n\n第 9 章 和 第 13 章描述了指针的优点，但也说明了如果内存管理不当会产生的陷阱。悬空指针或内存泄漏可能会导致难以发现的错误。C++11\
  \ 包含了一个名为 `shared_ptr` 的新类，它简化了内存管理和内存中对象的共享。\n\n\n\n例如，考虑以下实现 `Node` 类简单链表的代码。该类仅存储一个整数。该代码使用通过指针链接类的“旧”格式编写编写，并且没有显式地释放在\
  \ `listTest` 函数中分配的内存。这意味着当执行返回到 `main` 函数时，程序发生了内存泄漏。如果程序没有立即退出，这可能会导致内存问题。\n\n\
  ```\n 1    // 使用传统指针的简单 Node 类链表。\n 2    // 注意，此版本在执行返回到\n 3    // main 时，存在内存泄漏。\n\
  \ 4    #include <iostream>\n 5    using std::cout;\n 6    using std::endl;\n 7 \
  \   \n 8    // 一个简单的 Node 类。功能完整的类会有\n 9    // 更多函数。\n10    class Node\n11    {\n\
