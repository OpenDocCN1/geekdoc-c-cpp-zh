  \n你可以在网上找到许多食物的卡路里含量估计值。例如，一个双芝士汉堡大约有 1000 卡路里。\n\n6.  你发明了一种可以深炸奶油蛋糕（twinkies）的自动售卖机。编写一个程序模拟该自动售卖机。买一个深炸奶油蛋糕需要\
