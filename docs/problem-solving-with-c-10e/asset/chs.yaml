  \n图 5.2 完整替代文本![插图显示了一个带有“void Function.”语法的代码段。](img/fg05_002b00.png)5.1-1 完整替代文本\n\
  \n***示例对话***\n\n```\n我将把华氏度温度转换为摄氏度。\n输入华氏度温度：32.5\n32.5 华氏度等同于\n0.3 摄氏度。\n```\n\
  \n# `void` 函数中的 `return` 语句\n\n`void` 函数和返回值的函数都可以包含 `return` 语句。对于返回返回值的函数，`return`\
  \ 语句指定了要返回的值。对于 `void` 函数，`return` 语句仅仅是结束函数调用。正如我们在上一章中看到的，每个返回值的函数都必须通过执行 `return`\
  \ 语句来结束。然而，`void` 函数并不需要包含 `return` 语句。如果它不包含 `return` 语句，它将在执行完函数体中的代码后结束。这就好像在函数体末尾的最后一个右大括号\
  \ `}` 之前有一个隐式的 `return` 语句一样。例如，如果我们省略显示 5.2 中函数定义中的 `return` 语句，`initializeScreen`\
  \ 和 `showResults` 函数的执行将完全相同。\n\n函数体中最后一个右大括号之前存在隐式 `return` 语句这一事实，并不意味着你在 `void`\
  \ 函数中永远不需要 `return` 语句。例如，显示 5.3 中的函数定义可以被用餐厅管理程序的一部分。该函数输出关于在桌旁的人之间分配给定数量冰淇淋的指令。如果桌上没有人（即如果\
  \ `number` 等于 `0`），则 `if` 语句中的 `return` 语句将终止函数调用并避免除以零。如果 `number` 不为 `0`，则在执行函数体末尾的最后一个\
  \ `cout` 语句时，函数调用结束。\n\n![插图显示了一个关于“在 void 函数中使用 return”的代码段。](img/fg05_00300.png)\n\
  \n# 显示 5.3 在 `void` `Function` 中使用` `return`\n\n图 5.3 完整替代文本\n\n到此时，你可能已经猜到程序的 `main`\
  \ 部分实际上是一个名为 `main` 的函数定义。当程序运行时，`main` 函数会被自动调用，它反过来可能会调用其他函数。虽然程序 `main` 部分的 `return`\
  \ 语句似乎是可选的，但正式上来说并不是。从技术上讲，程序的 `main` 部分是一个返回 `int` 类型值的函数，因此它需要一个 `return` 语句。然而，`main`\
  \ 函数的使用方式就像它是 `void` 函数一样。将程序的 `main` 部分视为返回整数的函数可能听起来很疯狂，但传统一直如此。最好的办法可能是继续将程序的\
  \ `main` 部分仅仅视为“程序的主部分”，而不要担心这个微小的细节。³\n\n### 自测练习\n\n1. 下面程序的输出是什么？\n\n```\n#include\
  \ <iostream>\nvoid friendly();\nvoid shy(int audienceCount);\nint main()\n{\n  \
  \  using namespace std;\n    friendly();\n    shy(6);\n    cout << \"One more time:\\\
  n\";\n    shy(2);\n    friendly();\n    cout << \"End of program.\\n\";\n    return\
  \ 0;\n}\n\nvoid friendly()\n{\n    using namespace std;\n    cout << \"Hello\\n\"\
  ;\n}\n\nvoid shy(int audienceCount)\n{\n    using namespace std;\n    if (audienceCount\
  \ < 5)\n        return;\n    cout << \"Goodbye\\n\";\n}\n```\n\n2. 你是否被在 `void`\
  \ 函数中有一个 `return` 语句？\n\n3. 假设你省略了显示 5.2 中 `initializeScreen` 的 `return` 语句，这对程序会有什么影响？程序能编译吗？能运行吗？\n\
  \n4. 编写一个带有三个参数的 `void` 函数定义，输出这些参数的乘积。在一个程序中读取三个数字并调用该函数。\n\n5. 如果你有 `int main()`\
  \ 但没有提供 `0;`，编译器会发出警告吗？\n\n6. `void` 函数的调用是作为语句还是表达式？\n\n# 5.2 引用参数\n\n当函数被调用时，其参数会替换函数定义中的形式参数，或者非正式地说，参数被“插入”到形式参数中。有不同的机制用于这种替换。我们在第\
  \ 4 章 中以及到目前为止使用的机制被称为***值传递***（call-by-value）机制。替换参数的第二种主要机制被称为***引用传递***（call-by-reference）机制。\n\
  \n# 引用传递初步观察\n\n我们到目前使用的值传递机制对于某些子任务是不足够的。例如，一个常见的子任务是从用户获取一个或多个输入值。回看显示 5.2 中的程序。它的任务被分为四个子任务：初始化屏幕、获取华氏温度、计算相应的摄氏温度以及输出结果。这四个子任务中的三个通过\
  \ `initializeScreen、celsius` 和 `showResults` 函数实现。然而，获取输入的子任务是通过以下四行代码来实现的（而不是作为函数调用）：\n\
  \n```\ncout << \"I will convert a Fahrenheit temperature\"\n     << \" to Celsius.\\\
  n\"\n     << \"Enter a temperature in Fahrenheit: \";\ncin >> fTemperature;\n```\n\
  \n获取输入的子任务应该通过函数调用来完成。为了通过函数调用实现这一点，我们将使用引用参数。\n\n\n\n用于获取输入的函数应该将一个或多个变量的值设置为键盘上输入的值，因此函数调用应该将一个或多个变量作为参数，并应该改变这些参数变量的值。在我们目前为止为止的按值传递（call-by-value）形式参数中，函数调用中的参数可以是一个变量，但函数只获取变量的值而不会以任何方式改变该变量。在按值传递的形式参数中，只有参数的值被替换为形式参数。对于输入函数，我们希望用变量（而不是变量的值）来替换形式参数。引用传递（call-by-reference）机制正是这样工作的。通过\
  \ `call-by-reference` 形式参数（也简单称为 `reference` 参数），函数调用中对应的参数必须是一个变量，并且该参数变量会被替换为形式参数。这好比该参数变量被字面量地复制到函数定义的体中，并取代形式参数的形式存在。在参数被替换后，将执行函数体中的代码，这段代码可以改变参数变量的值。\n\
  \n引用传递参数必须以某种方式标记，以便编译器将其与按值传递参数区分来。指示引用传递参数的方法是在函数声明和函数定义头部的形式参数列表中，在类型名称末尾加上取地址符\
  \ `&`。例如，接下来的函数定义有一个形式参数 `fVariable`，该形式参数就是一个引用传递参数：\n\n```\nvoid getInput (double\
  \ & fVariable)\n{ using namespace std;\n    cout << \"I will convert a Fahrenheit\
  \ temperature\"\n         << \" to Celsius.\\n\"\n         << \"Enter a temperature\
  \ in Fahrenheit: \";\n    cin >> fVariable;\n}\n```\n\n在包含此函数定义的程序中，以下函数调用将变量 `fTemperature`\
  \ 设置为从键盘读取到的值：\n\n```\ngetInput(fTemperature);\n```\n\n使用这个函数定义，我们可以轻松地重写显示 5.2\
  \ 所示的程序，使得读取输入的子任务由此函数调用完成。然而，与其重写旧程序，不如来看一个完全全新的程序。\n\n显示 5.4 展示了引用传递参数。该程序并没有做什么。它只是读取两个数字，并将相同的数字写出来，但顺序反相反。`getNumbers`\
  \ 和 `swapValues` 函数中的参数都是引用传递参数。输入通过函数调用完成：\n\n```\ngetNumbers(firstNum, secondNum);\n\
  ```\n\n```\n 1    //演示引用传递参数的程序。\n 2    #include <iostream>\n 3    void getNumbers(int&\
  \ input1, int& input2);\n 4    //从键盘读取两个整数。\n 5    void swapValues(int& variable1,\
  \ int& variable2);\n 6    //交换 variable1 和 variable2 的值。\n 7    void showResults(int\
  \ output1, int output2);\n 8    //按顺序显示 variable1 和 variable2 的值。\n 9      int main(\
  \ )\n10    {\n11        int firstNum = 0, secondNum = 0;\n12    \n13        getNumbers(firstNum,\
  \ secondNum);\n14        swapValues(firstNum, secondNum);\n15        showResults(firstNum,\
  \ secondNum);\n16    }\n```\n\n\n\n当函数语句执行时，函数体对形式参数执行的任何操作，实际上都是对与该形式参数相关的内存位置中的变量执行的。在这种情况下，`getNumbers`\
  \ 函数体中的指令指示使用 `cin` 语句在形式参数 `input1` 中存储一个值，因此该值被存储在内存位置 1010 的变量中（该位置恰好是变量 `firstNum`\
  \ 存储的位置）。同样，`getNumbers` 函数体中的指令指示接着使用 `cin` 语句在形式参数 `input2` 中存储一个值，因此该值被存储在内存位置\
  \ 1012 的变量中（该位置恰好是变量 `secondNum` 存储的位置）。因此，无论指示计算机对 `input1` 和 `input2` 执行什么操作，实际上都是对变量\
  \ `firstNum` 和 `secondNum` 执行的。例如，如果用户如显示 5.4 所示输入 `5` 和 `10`，那么结果如下：\n\n![表格显示了内存位置和对应的值。](img/un05_00300.png)5.2-4\
  \ 全备替代文本\n\n当函数 `getNumbers` 退出时，变量 `input1` 和 `input2` 超出范围并丢失。这意味着我们无法再通过变量 `input1`\
  \ 和 `input2` 获取 1010 和 1012 处的数据值。然而，数据仍然存在于内存位置 1010 和 1012 中，并且可以在 `main` 函数的作用范围内通过变量\
  \ `firstNum` 和 `secondNum` 访问。关于引用传递机制在此次 `getNumbers` 函数调用中工作原理的细节，在显示 5.5 中有所描述。\n\
  \n## 显示 5.4 中函数调用的剖析\n\n### 使用引用传递参数\n\n**0** 假设编译器已为变量 `firstNum` 和 `secondNum`\
  \ 分配了以下内存地址：\n\n```\n firstNum → 1010\n         secondNum → 1012\n```\n\n（我们不知道分配了哪些地址，结果也将取决于实际地址，但这将使得过程变得非常具体，从而可能更容易理解。）\n\
  \n**1** 在显示 5.4 中的程序中，开始执行以下函数调用：\n\n```\n getNumbers(firstNum, secondNum);\n```\n\
  \n**2** 被指示使用变量 `firstNum` 的内存位置代替形式参数 `input1`，使用第二个 `secondNum` 的内存位置代替形式参数 `input2`。其效果等于将函数定义重写为如下内容（这不是法的\
  \ C++ 代码，但对我们来说有明确的含义）：\n\n```\n void getNumbers( int& <内存位置 1010 处的变量>,\n     \
  \     int& <内存位置 1012 处的变量>)\n          {\n             using namespace std;\n \
  \            cout << \"Enter two integers: \";\n             cin >> <内存位置 1010 处的变量>\n\
  \                 >> <内存位置 1012 处的变量>;\n          }\n```\n\n### 显示 5.4 中函数调用的剖析（未完）\n\
  \n由于位置 1010 和 1012 处的变量是 `firstNum` 和 `secondNum`，因此其效果等于将函数定义重写为：\n\n```\n void\
  \ getNumbers(int& firstNum, int& secondNum)\n          {\n             using namespace\
  \ std;\n             cout << \"Enter two integers: \";\n             cin >> firstNum\n\
  \                 >> secondNum;\n          }\n```\n\n**3** 执行函数体。其效果等于执行了以下内容：\n\
  \n```\n {\n                using namespace std;\n                cout << \"Enter\
  \ two integers: \";\n```\n\n**4** 执行 `cin` 语句时，`input1` 和 `input2` 的值被设置。（如显示 5.4\
  \ 所示，那么 `firstNum` 的值为 5，`secondNum` 的值为 10。）\n\n**5** 函数结束时，变量 `input1` 和 `input2`\
  \ 保留了这些值。（如显示 5.4 所示）。\n\n## 显示 5.5 引用传递的行为\n\n这似乎多了一层用词。如果你说 `input1`，我们不知道你是指\
  \ `main` 部分声明的变量 `firstNum` 还是形式参数 `input1`。然而，如果 `main` 部分声明的变量 `input1` 被分配内存位置\
  \ 1014，那么“内存位置 1014 处的变量”这一说法就是没有义的。让我们检查这种情况下替换的细节。\n\n在此调用中，对应形式参数 `input1` 的参数是变量\
  \ `secondNum`，对应形式参数 `input2` 的参数是变量 `firstNum`。这对我们来说可能困惑，但对计算机来说完全没有问题，因为计算机从未真正“用\
  \ `input2` 替换 `input1`”或“用 `input1` 替换 `input2`”。计算机仅处理内存位置。计算机将“内存位置 1016 处的变量”替换形式参数\
  \ `input1`，将“内存位置 1014 处的变量”替换形式参数 `input2`。\n\n## 编程示例 swapValues 函数\n\n在显示 5.4\
  \ 中定义的 `swapValues` 函数交换两个变量的值。该函数的描述由以下函数声明和注释给出：\n\n```\nvoid swapValues(int&\
  \ variable1, int& variable2);\n//交换 variable1 和 variable2 的值。\n```\n\n为了看到函数应该是如何工作的，假设变量\
  \ `firstNum` 的值为 `5`，变量 `secondNum` 的值为 `10`，并考虑函数调用：\n\n```\nswapValues(firstNum,\
  \ secondNum);\n```\n\n\n\n在此函数调用后，`firstNum` 的值将变为 `10`，`secondNum` 的值将变为 `5`。\n\
  \n如显示 5.4 所示，函数 `swapValues` 的定义使用了名为 `temp` 的局部变量。这个局部变量是必须的。你可能会认为函数定义可以简化为如下：\n\
  \n![插图显示了一个代码段：](img/un05_00500.png)5.2-6 完整替代文本\n\n为了看出这种替代定义无法运行，请考虑此定义和函数调用会发生的情况：\n\
  \n```\nswapValues(firstNum, secondNum);\n```\n\n变量 `firstNum` 和 `secondNum` 被替换为形式参数\
  \ `variable1` 和 `variable2`，因此在使用这种错误的函数定义时，函数调用等同于以下：\n\n```\nfirstNum = secondNum;\n\
  secondNum = firstNum;\n```\n\n这段代码并没有产生预期的结果。`firstNum` 的值被设置为 `secondNum` 的值，这本该如此。但随后，`secondNum`\
  \ 的值被设置为 `firstNum` 改变后的值，而此时它已经是 `secondNum` 的原始值。因此，`secondNum` 的值完全没有改变。（如果这不清楚，请用变量\
  \ `firstNum` 和 `secondNum` 的具体值过一遍步骤。）函数需要做的是保存 `firstNum` 的原始值，以免该值丢失。这正是正确函数定义中局部变量\
  \ `temp` 的用途。那个正确的定义是显示 5.4 中的那个。当使用正确版本并用参数 `firstNum` 和 `secondNum` 调用函数时，函数调用等同于以下代码，该代码运行正常：\n\
  \n```\ntemp = firstNum;\nfirstNum = secondNum;\nsecondNum = temp;\n```\n\n# 混合参数列表\n\
  \n形式参数是值传递（call-by-value）参数还是引用传递（call-by-reference）参数，取决于其类型说明上是否带有与符号（&）。如果存在与符号，则该形式参数为引用传递参数。如果形式参数没有关联与符号，则为值传递参数。\n\
  \n在同一个函数中混合使用值传递和引用传递的形式参数是完全合法的。例如，在以下函数声明中，第一个和最后一个形式参数是引用传递参数，而中间的是值传递参数：\n\n\
  ```\nvoid goodStuff(int& par1, int par2, double& par3);\n```\n\n引用传递参数不仅限于 `void`\
  \ 函数。你也可以在返回值的函数中使用它们。因此，带有引用传递参数的函数既可以改变作为参数传入的值，也可以返回一个值。\n\n# 编程提示：使用何种参数\n\n\
  显示 5.6 说明了编译器处理值传递和引用传递形式参数的差异。参数 `par1Value` 和 `par2Ref` 在函数定义体内部都被赋予了值。但由于它们是不同类型的参数，两种情况下的效果是不同的。\n\
  \n```\n 1    //说明了值传递参数与引用传递参数\n 2    //之间的差异。\n 3    #include <iostream>\n 4  \
  \  void doStuff(int par1Value, int& par2Ref);\n 5    //par1Value 是一个值传递形式参数，\n 6\
  \    //par2Ref 是一个引用传递形式参数。\n 7    int main( )\n 8    {\n 9        using namespace\
  \ std;\n10        int n1, n2;\n11     \n12        n1 = 1;\n13        n2 = 2;\n14\
  \        doStuff(n1, n2);\n15        cout << \"n1 after function call = \" << n1\
  \ << endl;\n16        cout << \"n2 after function call = \" << n2 << endl;\n17 \
  \       return 0;\n18    }\n19      void doStuff(int par1Value, int& par2Ref)\n\
  20    {\n21        using namespace std;\n22        par1Value = 111;\n23        cout\
  \ << \"par1Value = \" << par1Value << endl;\n24        par2Ref = 111;\n25      \
  \  cout << \"par2Ref = \" << par2Ref << endl;\n26    }\n```\n\n### 示例\n\n```\nn1\
  \ after function call = 1\nn2 after function call = 2\n```\n\n# 机制比较\n\n`par1Value`\
  \ 是值传递参数，调用方式如下：\n\n```\ndoStuff(n1, n2);\n```\n\n`par1Value` 是值传递参数，调用方式如下：\n\n\
  ```\ndoStuff(n1, n2);\n```\n\n`par1Value` 是值传递参数，调用方式如下：\n\n```\ndoStuff(n1, n2);\n\
  ```\n\n`par1Value` 是值传递参数，调用方式如下：\n\n```\ndoStuff(n1, n2);\n```\n\n`par1Value` 是值传递参数，调用方式如下：\n\
  \n```\ndoStuff(n1, n2);\n```\n\n`par1Value` 是值传递参数，调用方式如下：\n\n```\ndoStuff(n1, n2);\n\
  ```\n\n`par1Value` 是值传递参数，调用方式如下：\n\n```\ndoStuff(n1, n2);\n```\n\n`par1Value` 是值传递参数，调用方式如下：\n\
  \n```\ndoStuff(n1, n2);\n```\n\n`par1Value` 是值传递参数，调用方式如下：\n\n```\ndoStuff(n1, n2);\n\
  ```\n\n`par1Value` 是值传递参数，调用方式如下：\n\n```\ndoStuff(n1, n2);\n```\n\n（注：提供的文本在该部分存在重复/乱码内容。）\n\
