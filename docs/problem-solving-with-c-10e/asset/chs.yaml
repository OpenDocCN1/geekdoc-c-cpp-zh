  n');\n}\n```\n\n### 31.\n\n```cpp\nvoid sendLine(ostream& targetStream)\n{\n   \
  \ char next;\n    do\n    {\n        cin.get(next);\n        targetStream << next;\n\
  \    } while (next != '\\n');\n}\n```\n\n### 32.\n\n1. `2.0 1.1 2.3`\n2. `2.0 3.0\
  \ 2.3`\n3. `2.0 3.0 4.0`\n\n### 33. 是一组组函数：\n\n```cpp\nvoid func(double x)\n{\n\
  \    double y = 1.1;\n    double z = 2.3;\n    cout << x << \" \" << y << \" \"\
  \ << z << endl;\n}\nvoid func(double x, double y)\n{\n    double z = 2.3;\n    cout\
  \ << x << \" \" << y << \" \" << z << endl;\n}\nvoid func(double x, double y, double\
  \ z)\n{\n    cout << x << \" \" << y << \" \" << z << endl;\n}\n```\n\n### 34. 结果将为\
  \ `false`。你的程序必须在变为 `true` 之前尝试额外读取一个字符（最后一个字符之外）。\n\n### 35.\n\n```cpp\nvoid textToScreen(ifstream&\
  \ fileStream)\n{\n    char next;\n    fileStream.get(next);\n    while (! fileStream.eof(\
  \ ))\n    {\n        cout << next;\n        fileStream.get(next);\n    }\n}\n```\n\
  \n如果你愿意，可以使用 `cout.put(next);` 代替 `cout << next;`。\n\n### 36. 完整的对话如下：\n\n```\n\
  Enter a line:\n10\n11\n```\n\n### 37.\n\n```cpp\ncout << \"Enter a line:\\n\";\n\
  char next;\ndo\n{\n    cin.get(next);\n    if (!isupper(next))\n        cout <<\
  \ next;\n} while (next != '\\n');\n```\n\n注意 `isupper(next)` 为 `false`，因为 `next`\
  \ 不是一个字母。\n\n# 练习程序\n\n1. 写一个程序，读取一个包含 `int` 类型数字的文件，并输出平均值和最小值。该文件仅包含由空格或换行符分隔的\
  \ `int` 数字。\n2. 写一个程序，从一个包含 `double` 类型数字的文件读取输入，并输出中。该文件仅包含由空格或换行符分隔的 `double`\
  \ 数字。\n3. 写一个程序，计算数字列表的位数。对于一个排序后的文件，如果元素个数为奇数，位数是中间元素；如果是偶数，则为中间两个元素的平均值。你需要打开文件、统计元素个数、关闭文件，然后重新打开文件并计算位数。\n\
  4. 写一个程序，从一个包含 `double` 类型数字的文件读取输入，并输出平均值和标准差。该文件仅包含由空格和或换行符分隔的 `double` 数字。数字列表\
  \ `n[1]`、`n[2]`、`n[3]` 等的标准差定义为以下数字平均值的平方根：\n\n   > (`n[1] - a`)²，(`n[2] - a`)²，(`n[3]\
  \ - a`)²，等等\n\n   > 数字 `a` 是数字 `n[1]`、`n[2]`、`n[3]` 等的平均值。如果是作为课程作业，请向你的讲师获取文件名。\n\
  5. 对于排序后的文件，四位数是三个之一：第一四位数有四分之一的数据值小于或等于它，四分之一的数据位于第一和第二四位数之间，四分之一的数据位于第二和第三四位数之间，四分之一高于第三。（*提示*：完成部分\
  \ (a) 后，你已经得到了第二四位数。你也应该意识到你已经完成了寻找另外两个四位数所需的所有工作。）\n\n写一个关于程序编写提供和接受建议的程序。程序首先在屏幕上写一条建议，并要求用户输入另一条建议。然后程序结束。下一个运行程序的人将收到上一个运行程序的人所提供的建议。建议存储在一个文件中，并在每次运行程序后文件内容会发生变化。你可以使用编辑器在文件中输入初始建议，以便让第一个运行程序的人员收到一些建议。允许用户输入任意长度的建议，使其可以是任意行数。用户被告知通过两次回车键来结束其建议。\n\
  \n\n\n\n\n## 6. 编写一个程序，从一个文件读取文本并将该文本的编辑版本写入另一个文件。编辑后的版本与未编辑的版本相同，但每个两个或多个连续的空白字符串都被替换为单个空白符。因此，文本经过编辑后删除了任何多余的空白字符。你的程序应该定义一个函数，并将输入流和输出文件流作为参数调用。如果这是课堂作业，请从教师处获取文件名。\n\
  \n## 7. 编写一个程序，合并两个文件中的数字并将所有数字写入第三个文件。你的程序从两个不同的文件获取输入，并将输出写入第三个文件。每个输入文件都包含一个\
  \ `int` 类型的数字列表，并按从小到大的顺序排序。程序运行后，输出文件将包含两个输入文件中所有的数字，按从小到大的顺序排列在一个更长的列表中。你的程序应该定义一个函数，将两个输入文件流和一个输出文件流作为三个参数调用。如果这是课堂作业，请从教师处获取文件名。\n\
  \n# 编程项目\n\n编程项目比练习程序需要更多的问题解决能力，并且通常有许多不同的解决方法。访问 [www.myprogramminglab.com](http://www.myprogramminglab.com)\
  \ 在线完成许多编程项目并获得即时反馈。\n\n## 1. 编写一个生成个性化垃圾邮件的程序。该程序同时从输入文件和键盘获取输入。输入文件包含信的文本，但收件人姓名由三个字符\
  \ `#N#` 表示。程序要求用户输入一个名称，然后将信写入第二个文件，但将三个字母 `#N#` 替换为该名称。三字母字符串 `#N#` 在信中恰好出现一次。\n\
  \n> *提示*：让你的程序从输入文件读取内容，直到遇到三个字符 `#N#` 为止，并在读取过程中将读取的内容复制到输出文件。当遇到这三个字母 `#N#` 时，向屏幕发送输出并从键盘请求名称。你应该能够推导出其余的细节。你的程序应该定义一个函数，并将输入流和输出文件流作为参数调用。如果这是课堂作业，请从教师处获取文件名。\n\
  \n> 困难版本（使用可选部分“文件名作为输入”中的材料）：允许字符串 `#N#` 在文件中出现任意次数。在这种情况下，名称存储在两个字符串变量中。对于这个版本，假设有名字和姓，但没有中间名或首字母。\n\
  \n## 2. 编写一个计算课程数值分数的程序。课程记录在一个文件中，该文件将作为输入文件。输入文件的格式完全如下：每行包含学生的姓，然后是一个空格，然后是学生的名，紧接着是一个空格，最后是十个测验分数，全部在同一行。测验分数是整数，并用一个空格分隔。你的程序将从该文件获取输入并将输出发送第二个文件。输出文件中的数据与输入文件中的数据相同，但每行末尾会额外多出一个数字（`double`\
  \ 类型）。该数字将是该学生十次测验分数的平均分。如果这是课堂作业，请从教师处获取文件名。使用至少一个以文件流作为全部或部分参数的函数。\n\n## 3. 以以下所有方式增强你为“编程项目\
  \ 2”编写的程序。\n\n1.  每行中的测验分数列表将包含十个或更少的测验分数。（如果测验分数少于十个，意味着学生错过了了一次或多次测验。）平均分仍然是测验分数之和除以\
  \ `10`。这相当于给任何错过的测验 0 分。\n2.  输出文件的开头将包含一行（或多行）来解释输出内容。使用格式化指令使布局整洁且易读。\n3.  在将所需的输出放置到输出文件中后，你的程序将关闭所有文件，然后将“输出”文件的内容复制到“输入”文件中，以便最终效果是更改输入文件的内容。\n\
  \n使用至少两个以文件流作为全部或部分参数的函数。如果这是课堂作业，请从教师处获取文件名。\n\n## 4. 编写一个程序，计算包含某些文本的文件的平均单词长度（每个单词的平均字符数）。单词定义为任何符号字符串，其末端分别由以下内容之一包围：空白符、逗号、句号、行首或行尾。你的程序应该定义一个函数，并将输入文件流作为参数调用。该函数还应该支持将\
  \ `cin` 流作为输入流，尽管在该程序中不会用 `cin` 作为参数调用该函数。如果这是课堂作业，请从教师处获取文件名。\n\n## 5. 编写一个程序来纠正\
  \ C++ 程序中的错误，这些错误在使用 `cin` 和 `cout` 时使用了错误的运算符 `<<` 或 `>>`。程序将将每个（错误的）出现\n\n```\n\
  cin <<\n```\n\n替换为修正后的版本\n\n```\ncin >>\n```\n\n并将每个（错误的）出现\n\n```\ncout >>\n```\n\
  \n替换为修正后的版本\n\n```\ncout <<\n```\n\n对于一个更简单的版本，假设 `cin` 与其随后的 `<<` 之间总有一个空白符，同样假设\
  \ `cout` 与其随后的 `>>` 之间总有一个空白符。\n\n对于困难版本，允许 `cin` 与 `<<` 之间以及 `cout` 与 `>>` 之间存在任意数量的空白，甚至是零空白。在这种困难的情况下，修正后的版本在流和运算符之间仅有一个空白。待纠正的程序在一个文件中，修正后的版本输出到第二个文件。你的程序应该定义一个函数，并将输入流和输出文件流作为参数调用。\n\
  \n> 如果这是课堂作业，请从教师处获取文件名，并询问教师你应该做简单版本还是困难版本。\n\n> *提示*：即使你正在做困难版本，你可能会发现先做简单版本，然后修改你的程序以执行更难的任务会更简单更快速。\n\
  \n## 6. 编写一个程序，允许用户输入任何单行问题，然后回答该问题。程序不会真正关注问题，而简单地读取问题行并丢弃读取的所有内容。它总是给出以下答案之一：\n\
  \n```\n我不确定，但我想你会在第 #N 章中找到答案。\n这是一个好问题。\n如果是我，我不会担心这些事情。\n这个问题困扰了哲学家们几个世纪。\n我不知道，我只是一台机器。\n\
  想想，答案就会出现在你脑海里。\n以前知道那个问题的答案，但我忘记了。\n答案可以在森林的一个秘密地点找到。\n```\n\n这些答案存储在一个文件中（每行一个答案），你的程序简单地从文件中读取下一个答案并将其输出作为该问题的回答。当你的程序读取完整个文件后，它只需关闭文件，重新打开文件，并再次从答案列表开始。\n\
  \n\n\n\n当你的程序输出第一个答案时，它应该将两个符号 `#N` 替换为 1 到 18 之间的数字（包括 1 和 18）。为了在 1 到 18 之间选择一个数字，你的程序应该初始化一个变量为\
  \ 18，并在每次输出数字时将该变量的值减 1，使得章节编号从 18 倒数到 1。当变量达到值 `0` 时，你的程序应该将其值改回 18。使用 `const`\
  \ 修饰符通过全局命名常量声明将数字 17 命名为 `NUMBER_OF_CHAPTERS`。\n\n> (*提示*：使用本章定义的 `newLine` 函数。）\n\
  \n### 7. 这个项目与编程项目 6 相同，不同之处在这个项目中，你的程序将使用一种更复杂的方法来选择问题的答案。当你的程序读取一个问题时，它会统计问题中的字符数并将该数字存储在名为\
  \ `count` 的变量中。然后它用答案 `count % ANSWERS` 进行响应。文件中的第一个答案是答案 `0`，下一个是答案 `1`，然后是 `2`，依此类推。`ANSWERS`\
  \ 定义在一个常量声明中，如下，因此它等于答案文件中的答案数量：\n\n```\nconst int ANSWERS = 8;\n```\n\n通过这种方式，你可以更改答案文件使其包含更多或更少的答案，而你只需要更改常量声明即可让你的程序针对不同数量的可能答案正确工作。假设即使答案文件发生变化，文件中列出的第一个始终是：\n\
  \n```\nI'm not sure, but I think you will find the answer in Chapter #N.\n```\n\n\
  在替换两个字符 `#N` 为数字时，使用数字 `(count % NUMBER_OF_CHAPTERS + 1)`，其中 `count` 是上述讨论的变量，而\
  \ `NUMBER_OF_CHAPTERS` 是定义为等于本书章节数的全局命名常量。\n\n### 8. 该程序对文本文件中的行进行编号。编写一个程序，从文件中读取文本，并将每行输出到屏幕和另一个文件中，并在前面带上行号。在行的开头打印行号，并在三个空格的字段中右对齐。在行号后紧跟一个冒号，然后是一个空格，最后是行的文本。你应该一次获取一个字符，并编写代码忽略每行开头的空格。你可以假设行足够短以适应屏幕上的一行。否则，如果行太长，则允许默认的打印机或屏幕输出行为（即换行或截断）。\n\
  \n> 一个稍微困难的版本通过在处理文件行之前统计行数来确定行号字段所需的空格数。该版本的程序应该在每个能够放入 72 字符行内的最后一个完整单词之后插入一个新行。\n\
  \n### 9. 编写一个程序，计算文件的以下所有统计数据，并将统计数据同时输出到屏幕和另一个文件：文件中字符出现的总频数、文件中非空白字符的总数、以及文件中字母出现的总频数。\n\
  \n### 10. 文本文件 `babynames2012.txt` 包含在本书的源代码中，并可以在书籍网站在线获取，它包含了由社会安全局编制的 2012 年美国最受欢迎的\
  \ 1000 个男孩和女孩名字列表。\n\n这是一个空格分隔的文件，包含 1000 个条目，首先列出排名，然后是对应的男孩名和女孩名。最受欢迎的名字列在最，最不受欢迎的名字列在最后。例如，文件开头为\n\
  \n```\n1 Jacob Sophia\n2 Mason Emma\n3 Ethan Isabella\n```\n\n这表示 Jacob 是最受欢迎的男孩名字，Sophia\
  \ 是最受欢迎的女孩名字。Mason 是第二受欢迎的男孩名字，Emma 是第二受欢迎的女孩名字。\n\n编写一个程序允许用户输入一个名字。程序应从文件中读取并在男孩和女孩中搜索匹配的名字。如果找到匹配项，它应该输出该名字的排名。程序还应该指示如果没有匹配项。\n\
  \n例如，如果用户输入名字 “Justice”，那么程序应该输出：\n\n```\nJustice is ranked 519 in popularity among\
  \ boys.\nJustice is ranked 518 in popularity among girls.\n```\n\n如果用户输入名字 “Walter”，那么程序应该输出：\n\
  \n```\nWalter is ranked 376 in popularity among boys.\nWalter is not ranked among\
  \ the top 1000 girl names.\n```\n\n### 11. 为了完成这个问题，你必须有一台能够查看可矢量图形（SVG）文件的计算机。你的\
  \ Web 浏览器可能已经查看这些文件。要测试浏览器是否可以显示 SVG 文件，请输入下面的 `rectline.svg` 文件并看看是否可以在 Web 浏览器中打开它。如果你的\
  \ Web 浏览器无法查看该文件，则你可以在网上搜索并下载免费的 SVG 查看器。\n\n> 用于绘制图像的图形屏幕使用坐标系，其中 (0, 0) 位于左上角。`x`\
  \ 坐标向右增加，`y` 坐标向下增加。因此，坐标 (100, 0) 将位于正右侧 100 像素处。如下图所示。\n\n> SVG 格式使用 XML 定义图像。图像规范存储在文本文件中并可以由\
  \ SVG 查看器显示。这是一个绘制两个矩形和一条线的示例 SVG 文件。\n\n```\n<?xml version=\"1.0\" standalone=\"\
  no\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 1.1//EN\"\n\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
  >\n<svg width=\"500\" height=\"500\"\nxmlns=\"http://www.w3.org/2000/svg\">\n<rect\
  \ x=\"20\" y=\"20\" width=\"50\" height=\"250\"\nstyle=\"fill:blue;\"/>\n<rect x=\"\
  75\" y=\"100\" width=\"150\" height=\"50\"\nstyle=\"fill:rgb(0,255,0);\"/>\n<line\
  \ x1=\"0\" y1=\"0\" x2=\"300\" y2=\"300\"\nstyle=\"stroke:purple;stroke-width:2\"\
  />\n</svg>\n```\n\n对于这个问题，你可以忽略前五行和最后一行，并将它们视为正确创建图像所需的插入的模板代码。\n\n以 `<rect x=\"\
  20\"` 开头的行绘制一个蓝色矩形，其左上角位于坐标 (20, 20)，宽度为 50 像素，高度为 250 像素。\n\n以 `<rect x=\"75\"\
  ` 开头的行绘制一个绿色矩形（RGB 值 0,255,0 全绿），其左上角位于坐标 (75, 100)，宽度为 150 像素，高度为 50 像素。\n\n最后，`<line>`\
  \ 标签从 (0, 0) 到 (300, 300) 绘制一条紫色线，宽度为 2。\n\n基于此示例，编写一个程序输入四个非负整数值并创建一个 SVG 文件，显示一个描绘整数值的简单条形图。你的程序应该缩放这些值，使其始终以最大\
  \ 400 像素的高度绘制。例如，如果你要绘图的输入值为 20, 40, 60 和 120，你可以生成一个显示所示的 SVG 文件：\n\n![一个无标签的条形图显示坐标平面上的四个垂直条，从左到右高度增加。](img/ua06_00200.png)\n\
  \n\n\n\n\n12. 有关 SVG 格式的信息，请参考 `Programming Project 11`。下面是另一个示例，说明了如何绘制圆、椭圆和多条直线：\n\
  \n```xmlxml\n<?xml version=\"1.0\" standalone=\"no\"?>\n<!DOCTYPE svg PUBLIC \"\
  -//W3C//DTD SVG 1.1//EN\"\n\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
  >\n<svg width=\"500\" height=\"500\"\nxmlns=\"http://www.w3.org/2000/svg\">\n\n\
  <circle cx=\"100\" cy=\"50\" r=\"30\"\nstroke=\"green\" stroke-width=\"3\" fill=\"\
  gold\"/>\n\n<ellipse cx=\"100\" cy=\"200\" rx=\"50\" ry=\"100\"\nstyle=\"fill:purple;stroke:black;stroke-width:2\"\
  />\n\n<polyline points=\"10,10 40,40 20,100 120,140\"\nstyle=\"fill-opacity:0;stroke:red;stroke-width:2\"\
  />\n\n</svg>\n```\n\n`<circle>` 标签绘制了一个中心位于 (100, 50) 的圆，半径为 30，笔画宽度为 3。它填充为金色，并有绿色边框。\n\
  \n`<ellipse>` 标签绘制了一个中心位于 (100, 200) 的椭圆，`x` 半径为 30，`y` 半径为 100。它使用紫色填充，黑色边框。\n\n\
  `<polyline>` 标签绘制了一条从 (10, 10) 到 (40, 40) 再到 (20, 100) 最后到 (120, 140) 的红线。fill-opacity\
  \ 设置为 0，使得多边形的填充变为透明。\n\n根据这些示例以及 `Project 18` 中介绍的内容，编写一个程序创建一个 SVG 图像，画出你教授的画像。图像可以有些抽象且简单。如果你想绘制更精美的图像，可以研究\
  \ SVG 图片格式；还有额外的标签可以使用过滤器、渐变和多边形进行绘制。\n\n13. 编写一个程序，提示用户输入一个文本文件名，然后输出文件中的单词数。你可以将“单词”视为任何被空白字符包围的文本（例如空格、回车、换行符）或位于文件开头或结尾的文本。\n\
  \n14. 以下是一个老字谜猜谜游戏：“除了 tremendous、stupendous 和 horrendous 之外，请说出一个以 dous 结尾的常用单词。”如果你思考一下，答案可能就会出现在脑海中。然而，我们也可以通过读取一个英文单词文本文件，并在单词以“dous”结尾时输出该单词来解决这个谜题。`words.txt`\
  \ 文件包含 87,314 个英文单词，其中就完成谜题的单词。该文件可以在书中源代码处在线获取。编写一个程序读取文本文件中的每个单词，并仅输出那些以“dous”结尾的单词以解决这个谜题。\n\
  \n# 7 数组\n\n> 在拥有数据之前进行理论化是一个严重的错误。\n> 亚瑟·柯南·道尔爵，《波希米亚恋》（福尔摩斯探案）\n\n## 引言\n\n数组用于处理一组类型相同的数据，例如温度列表或姓名列表。本章介绍了在\
  \ C++ 中定义和使用数组的基础知识，并介绍了在设计使用数组的算法和程序时使用的许多基本技术。\n\n### 前提条件\n\n本章使用了从第 2 章 到第 6\
  \ 章 的。\n\n# 7.1 数组简介\n\n假设我们想写一个程序读取五个分数并对这些分数进行一些操作。例如，程序可能会计算最高分，然后输出每个分数与最高分的差值。在读取所有五个分数之前，不知道最高分。因此，必须在存储中保留所有五个分数，以便在计算出最高分后，每个分数都能与其比较。\n\
  \n为了保留这五个分数，我们需要等同于五个 `int` 类型的变量。我们可以使用五个独立的 `int` 类型变量，但五个变量很难追踪，而且我们以后可能想更改程序来处理\
  \ 100 个分数；显然，100 个变量是不切实际的。数组是完美的解决方案。**数组**的行为就像一个变量列表，具有统一的命名机制，可以用一行简单的代码进行声明。例如，我们需要的五个独立变量的名称可以是\
  \ `score[0]`、`score[1]`、`score[2]`、`score[3]` 和 `score[4]`。不改变的部分——在本例中为 `score`——是数组的名称。可以改变的部分是方括号中的整数\
  \ `[ ]`。\n\n# 数组的声明与引用\n\n在 C++ 中，由五个 `int` 类型的变量组成的数组可以这样声明：\n\n```\nint score[5];\n\
  ```\n\n这种声明等于将以下五个变量都声明为 `int` 类型：\n\n```\nscore[0], score[1], score[2], score[3],\
  \ score[4]\n```\n\n构成数组的单个变量有多种不同的说法。我们称之为**索引变量**（indexed variables），尽管它们有时也被称为下标变量（subscripted\
  \ variables）或数组的元素（elements）。方括号中的数字被称为**索引**（index）或下标（subscript）。在在 C++ 中，索引从\
  \ 0 开始编号，而不是从 1 或 0 以外的任何数字开始。数组中索引变量的数量被称为数组的声明大小，有时简单称为数组的大小。在声明数组时，数组名称后的方括号中给出了数组的大小。\n\
  \n\n\n\n```cpp\nfor (i = 0; i < 5; i++)\n    cout << score[i] << \" off by \"\n\
  \         << (max - score[i]) << endl;\n```\n\n`for` 语句非常适合数组操作。\n\n# 编程提示：为数组大小使用定义的常量\
  \ `Constant`\n\n再次查看显示 7.1 中的程序。它只适用于恰好五个学生的班级。大多数班级并没有恰好五个学生。让程序更具通用性的方法之一是为每个数组的大小使用定义的常量。例如，显示\
  \ 7.1 中的程序可以重写为使用以下定义的常量：\n\n```cpp\nconst int NUMBER_OF_STUDENTS = 5;\n```\n\n\
  那么数组声明行将变为：\n\n```cpp\nint i, score[NUMBER_OF_STUDENTS], max;\n```\n\n当然，所有将数组大小为\
  \ `5` 的地方也应该更改为 `NUMBER_OF_STUDENTS` 而不是 `5`。如果对程序进行了这些更改（或者更好的是，如果程序从初就是这样写的），那么只需通过更改定义常量\
  \ `NUMBER_OF_STUDENTS` 的那一行代码，就可以重写程序以适用于任何人数的学生。请注意，在许多编译器上，你不能使用变量作为数组的大小，如下：\n\
  \n```cpp\ncout << \"Enter number of students:\\n\";\ncin >> number;\nint score[number];\
  \ // 在许多编译器上是非合法的！\n```\n\n```cpp\n 1    // 读取 5 个分数并显示每个\n 2    //分数与最高分相差多少。\n\
  \ 3    #include <iostream>\n 4    int main( )\n 5    {\n 6        using namespace\
  \ std;\n 7        int i, score[5], max;\n\n 8        cout << \"Enter 5 scores:\\\
  n\";\n 9        cin >> score[0];\n10        max = score[0];\n11        for (i =\
  \ 1; i < 5; i++)\n12        {\n13            cin >> score[i];\n14            if\
  \ (score[i] > max)\n15                max = score[i];\n16            //max 是值 score[0],...,\
  \ score[i] 中的最大值。\n17        }\n18        cout << \"The highest score is \" << max\
  \ << endl\n19             << \"The scores and their\\n\"\n20             << \"differences\
  \ from the highest are:\\n\";\n21        for (i = 0; i < 5; i++)\n22           \
  \ cout << score[i] << \" off by \"\n23                 << (max − score[i]) << endl;\n\
  24        return 0;\n25}\n```\n\n***示例对话***\n\n```\nEnter 5 scores:\n5 9 2 10 6\n\
  The highest score is 10\nThe scores and their\ndifferences from the highest are:\n\
  5 off by 5\n9 off by 1\n2 off by 8\n10 off by 0\n6 off by 4\n```\n\n# 使用数组的显示 7.1\
  \ 程序\n\n某些但并非所有编译器都允许你像这样使用变量来指定数组大小。然而，出于移植性考虑，你不应该这样做，即使你的编译器允许这样做。（在第 9 章中，我们将讨论另一种类型的数组，其大小可以在程序运行时确定。）\n\
  \n# 内存中的数组\n\n在讨论数组如何在计算机内存中表示之前，让我们先看看一个简单的变量（例如 `int` 或 `double` 类型的变量）在计算机内存中是如何表示的。计算机内存由一系列命名的位置组成，称为字节。⁷字节的数字被称为它的地址。简单变量被实现为由若干连续字节组成的内存区域。字节的数量由变量的类型决定。因此，内存中的简单变量由两部分信息描述：内存中的一个**地址**（给出该变量第一个字节的位置）和变量的类型（它告诉变量需要多少字节的内存）。当我们谈论变量的地址时，我们说的的就是这个地址。当你的程序在变量中存储值时，实际发生的情况是该值（编码为\
  \ 0 和 1）被放置在分配给该变量的内存字节中。同样，当变量作为（引用传递）参数传递函数时，实际发生的情况是该值（编码为 0 和 1）被放置在分配给该变量的内存字节中。\n\
  \n\n\n在定义用于遍历数组的变量时，可以使用与定义函数参数时相同的修饰符。我们在上面使用的变量 `x` 的示例等同于值传递。如果我们在循环内部更改 `x`，它不会改变数组。我们可以使用\
  \ `&` 将 `x` 定义为引用传递，这样对 `x` 的修改将应用到数组上。我们还可以使用 `const` 来指示该变量不可更改。下面的示例增加了数组中每个元素的值并输出了它们。我们在输出循环中使用\
  \ `auto` 数据类型来自动确定数组内元素的类型。\n\n```\nint arr[] = {2, 4, 6, 8};\nfor (int& x : arr)\n\
  \    x++;\nfor (auto x : arr)\n    cout << x;\ncout << endl;\n```\n\n这将输出：3579。在遍历\
  \ `vector` 时，基于范围的 `for` 循环特别为方便，`vector` 在第 8 章中引入；在遍历容器时，容器在第 18 章中讨论。\n\n###\
