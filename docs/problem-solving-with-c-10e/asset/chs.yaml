  \ 22};`\n\n    4.  `Date dueDate = {12, 21, 22};`\n\n6. 为一个记录编写结构类型定义，该记录包含一个人的工资率、累积假期（某个整数天数）和状态（小时制或薪资制）。将状态表示为\
