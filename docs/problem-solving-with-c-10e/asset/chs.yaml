  \ | 参数 `money` 是玩家拥有的金额。该函数从键盘输入注码并返回该金额。该函数应确保输入的金额是有效的（正数且 <= `money`）。如果金额无效，则应提示人类输入另一个值。\
  \ |\n\n在使用你的驱动程序测试了这些函数后，向上抽象链移动，以实现这些函数：\n\n```cpp\nvoid playerTurn(int money,\n\
  \           int &wager,\n           bool &bust,\n           int &total,\n      \
  \     int &houseRoll)\n```\n\n| | 实现人类玩家一个回合的游戏逻辑（对应上述第 2–5 步）。参数 `money` 是玩家拥有的金额。`wager`\
