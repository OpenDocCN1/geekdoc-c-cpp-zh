  \ class ForwardIterator2>\n13    bool equal(ForwardIterator1 first1, ForwardIterator1\
  \ last1,\n14               ForwardIterator2 first2);\n15    //如果 [first1, last1)\
  \ 包含与从 first2 开始的 \n16    // last1-first1 个元素相同且顺序相同，则返回 true。否则返回 false。\n17  \
  \  //时间复杂度：与范围 [first, last) 的大小成线性关系。\n18     \n19    template<class ForwardIterator1,\
