  Enter a line of input:\nMay the hair on your toes grow long and curly.\n```\n\n\
  # C 字符串到数字的转换与健壮输入\n\nC 字符串 `\"1234\"` 和数字 `1234` 并不是同一个东西。前者是一个字符序列；后者是一个数字。在日常生活中，我们用相同的方式写它们并模糊了这种区别，但在\
  \ C++ 程序中，这种区别是不能被忽视的。如果你想进行算术运算，你需要的是 `1234` 而不是 `\"1234\"`。如果你想在千两百三十四这个数字中加入一个逗号，那么你就需要将\
  \ C 字符串 `\"1234\"` 改为 C 字符串 `\"1,234\"`。在设计数值输入时，通常将输入读取为字符字符串、编辑字符串，然后将字符串转换为数字是有用的。例如，如果你想让程序读取一个金额，输入可能以美元符号开头，也可能没有。如果你的程序正在读取百分比，输入末尾可能有百分号，也可能没有。如果你的程序将输入视为字符字符串，它可以将字符串存储在\
  \ C 字符串变量中并移除任何不需要的字符，只留下一个包含数字的 C 字符串。然后你的程序需要将这个数字 C 字符串转换为数字，可以通过预定义的函数 `atoi`\
  \ 轻松完成。\n\n`atoi` 函数接受一个 C 字符串作为参数，并返回与该 C 字符串对应的 `int` 值。例如，`atoi(\"1234\")` 返回整数\
  \ `1234`。如果参数没有对应任何 `int` 值，则 `atoi` 返回 0。例如，`atoi(\"#37\")` 返回 0，因为字符‘#’不是数字。你把\
  \ `atoi` 读作“A to I”，它是“alphabetic to integer”（字母到整数）的缩写。`atoi` 函数位于头文件为 `cstdlib`\
  \ 的库中，因此任何使用它的程序必须包含以下指令：\n\n```cpp\n#include <cstdlib>\n```\n\n如果你的数字太大，无法作为 `int`\
  \ 类型的值，你可以将它们从 C 字符串转换为 `long` 类型的值。`atol` 函数执行与 `atoi` 相同的转换，不同之处 `atol` 返回的是 `long`\
  \ 类型的值，因此可以容纳更大的整数值（在存在此类问题的系统中）。\n\n[Display 8.2] 包含一个名为 `readAndClean` 的函数定义，它读取一行输入并丢弃除数字\
  \ `'0'` 到 `'9'` 以外的所有字符。然后该函数使用 `atoi` 函数将“清理后”的数字 C 字符串转换为整数值。正如演示程序所示，你可以使用此函数读取金额，用户是否包含美元符号将并不重要。同样地，你可以读取百分比，用户是否输入了百分号也并不重要。尽管输出看起来好像\
  \ `readAndClean` 函数仅仅是移除了一些符号，但发生的操作远于此。产生的值是一个真正的 `int` 值，可以在程序中作为数字使用；它不是一个字符\
  \ C 字符串。\n\n```cpp\n 1\t //演示函数 readAndClean 使用。\n 2\t#include <iostream>\n 3\t\
  #include <cstdlib>\n 4\t#include <cctype>\n 5\t  \n 6\tvoid readAndClean(int& n);\n\
  \ 7\t//读取一行输入。丢弃数字以外的所有符号。将\n 8\t//C 字符串转换为整数，并将 n 设置为该整数的值。\n 9\t  \n10\tvoid newLine(\
  \ );\n11\t//丢弃当前输入行上剩余的所有输入。\n12\t//同时也丢弃行尾的 '\\n'。\n13\t   \n14\tint main( )\n\
  15\t{\n16\t\t  using namespace std;\n17\t\t  int n;\n18\t\t  char ans;\n19\t\t \
  \ do\n20\t\t  {\n21\t\t\t  cout << \"Enter an integer and press Return: \";\n22\t\
  \t\t  readAndClean(n);\n23\t\t\t  cout << \"That string converts to the integer\
  \ \" << n <<endl;\n24\t\t\t  cout << \"Again? (yes/no): \";\n25\t\t\t  cin >> ans;\n\
  26\t\t\t  newLine( );\n27\t\t}\t while ( (ans != 'n') && (ans != 'N') );\n28\t \
  \ return 0;\n29\t  //使用 iostream, cstdlib, 和 cctype:\n30\tvoid readAndClean(int&\
  \ n)\n31\t  {\n32\t\t  using namespace std;\n33\t\t  const int ARRAY_SIZE = 6;\n\
  34\t\t  char digitString[ARRAY_SIZE];\n35\t   \n36\t\t  char next;\n37\t\t  cin.get(next);\n\
  38\t\t  int index = 0;\n39\t\t  while (next != '\\n'\n40\t\t\t  if (isdigit(next))\
  \ && (index < ARRAY_SIZE - 1))\n41\t\t\t\t  digitString[index] = next;\n42\t\t\t\
  \t  index++;\n43\t\t\t  cin.get(next);\n44\t\t  }\n45\t\t  digitString[index] =\
  \ '\\0';\n46\t\t  n = atoi(digitString);\n47\t  }\n```\n\n对话示例：\n\n```\nEnter some\
