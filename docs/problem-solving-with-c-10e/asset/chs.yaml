  \ 17 到 21 之间。\n\n7.  如果庄家没有“爆牌”，则将其数值与玩家的总和进行比较。如果总和相同，则为平局（push），玩家不赢也不输。如果庄家的总和大于玩家，则玩家输掉注码。如果玩家的总和大于庄家，则玩家赢得注码。\n\
  \n编写一个程序重复回合，直到玩家决定退出或用光资金。玩家初始资金为 $100。\n\n使用自下而上的开发方法（bottom-up methodology）编写你的程序。在编写实现游戏逻辑的高级代码之前，你应该编写驱动程序（drivers）来测试你的函数。至少你应该从以下函数开始：\n\
