  \ << amount << \" in my purse.\\n\";\n```\n\n如果你将运算符 `<<` 类比为其他运算符（如 `+`），那么上面的应该是（事实上也是）等价于以下：\n\
  \n```\n((cout << \"I have \") << amount) << \" in my purse.\\n\";\n```\n\n为了使这个表达式有意义，第一个求值的子表达式是：\n\
  \n```\n(cout << \"I have \")\n```\n\n如果情况顺利，那么这个子表达式最好返回 `cout`，以便计算继续进行，如下：\n\n\
  ```\n(cout << amount) << \" in my purse.\\n\";\n```\n\n而如果情况继续顺利，`(cout << amount)`\
  \ 最好也返回 `cout`，以便计算继续进行，如下：\n\n```\ncout << \" in my purse.\\n\";\n```\n\n这在显示 11.7\
