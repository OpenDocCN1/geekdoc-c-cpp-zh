  \ 10\n输入第 2 号保护主义者的报告\n第 2 号保护主义者的蛋总数为 12\n所有报告的蛋总数 = 22\n```\n\n\n\n每当子任务接收某些值（例如某些数字）并返回单个值时，将该子任务实现为一个函数是很自然的事。每有两个或多个此类子任务执行相同的计算时，可以将它们实现为同一个函数，并在每次使用它时传入不同的参数。因此，我们决定使用一个名为\
  \ `unitPrice` 的函数来计算披萨每平方英寸的价格。该函数的声明和说明注释如下：\n\n```\ndouble unitPrice(int diameter,\
  \ double price);\n //返回披萨每平方英寸的价格。名为 diameter 的\n // 参数是以英寸为单位的披萨直径。名为 price 的\n\
  \ // 参数是披萨的价格。\n```\n\n# 算法设计\n\n子任务 1 是非常直接的。程序将要求输入值并将其存储在四个变量中，我们将它们命名为 `diameterSmall`、`diameterLarge`、`priceSmall`\
  \ 和 `priceLarge`。\n\n子任务 4 是常规操作。为了确定哪种披萨最划算，我们只需要使用小于运算符比较两种披萨的每平方英寸成本。子任务 5 是结果的常规输出。\n\
  \n子任务 2 和 3 通过调用函数 `unitPrice` 来实现。接下来，我们为该函数设计算法。算法中困难的部分是确定披萨的面积。一旦知道了面积，我们就可以通过除法轻松确定每平方英寸的价格，如下：\n\
  \n```\nprice/area\n```\n\n其中 `area` 是存储披萨面积的变量。该表达式将是函数 `unitPrice` 返回的值。但我们仍然需要制定一种计算披萨面积的方法。\n\
  \n披萨基本上是一个圆（由饼底、奶酪、酱料等组成）。圆的面积（因此披萨的面积）是 π*r²，其中 `r` 是圆的半径，而 π 是一个被称为“派”的数字，约等于\
  \ 3.14159。半径是直径的一半。\n\n函数 `unitPrice` 的算法可以概述如下：\n\n# 函数 `unitPrice` 的算法概述\n\n1.\
  \ 计算披萨的半径。\n2. 使用公式 π*r² 计算披萨的面积。\n3. 返回表达式 `(price/area)` 的值。\n\n在将其翻译成 C++ 代码之前，我们会对这个大纲提供更详细的内容。我们将使用*伪代码*（pseudocode）来表达这个更详细版本的算法。**伪代码**是\
  \ C++ 和普通英语的混合体。伪代码允许我们在不担心 C++ 语法细节的情况下使算法精确化。然后，我们可以轻松地将伪代码翻译成 C++ 代码。在我们的伪代码中，`radius`\
  \ 和 `area` 将用于存储其名称所指示值的变量。\n\n# 函数 `unitPrice` 的伪代码\n\n```\nradius = one half of\
  \ diameter;\narea = π * radius * radius;\n return (price/area);\n```\n\n这完成了我们对\
  \ `unitPrice` 的算法设计。我们现在准备好将子任务 1 到 5 的解决方案转换为一个完整的 C++ 程序。\n\n# 编码\n\n子任务 1 的编码是常规的，因此我们接下来考虑子任务\
  \ 2 和 3。我们的程序可以通过对函数 `unitPrice` 的以下两次调用来实现子任务 2 和 3：\n\n```\nunitPriceSmall = unitPrice(diameterSmall,\
  \ priceSmall);\nunitPriceLarge = unitPrice(diameterLarge, priceLarge);\n```\n\n\
  其中 `unitPriceSmall` 和 `unitPriceLarge` 是两个 `double` 类型的变量。函数定义的好处之一是你可以在程序中多次调用该函数。这为你节省了重复相同（或几乎相同）代码的麻烦。但我们仍然必须为函数\
  \ `unitPrice` 编写代码。\n\n当我们将伪代码翻译成 C++ 代码时，我们得到了 `unitPrice` 函数体的内容：\n\n```\n{//unitPrice\
  \ 函数体的第一版草稿\n     const double PI = 3.14159;\n     double radius, area;\n\n    radius\
  \ = diameter/2;\n    area = PI * radius * radius;\n     return (price/area);\n}\n\
  ```\n\n注意，我们使用修符 `const` 将 `PI` 变为一个命名常量。同样，注意代码中的以下行：\n\n```\nradius = diameter/2;\n\
  ```\n\n这只是简单的除以 2，你可能认为没有比这更常规的操作了。然而，按照写法，这行代码包含一个严重的错误。我们希望除法能产生包含任何小数部分的披萨半径。例如，如果我们考虑购买“倒霉特惠”（这是一种\
  \ 13 英寸的披萨），那么半径就是 6.5 英寸。但变量 `diameter` 的类型是 `int`。常量 `2` 也是 `int` 类型。正如我们在第 2\
  \ 章中看到的，这一行将执行整数除法，计算出的半径 `13/2` 将是 `6` 而不是正确的值 `6.5`，我们因此忽略了半英寸的披萨半径。在很大情况下，这不会被察觉，但结果可能是披萨消费者联盟的数百万订阅者因购买尺寸错误的披萨而浪费金钱。这可能不会引发全球性的经济衰退，但程序将无法实现帮助消费者找到最划算购买的目标。在更重要的程序中，这种简单错误的结果可能是灾难性的。\n\
  \n我们如何修复这个错误？我们希望除以 2 是普通除法，在答案中包含任何小数部分。那种形式的除法要求除法运算符 `/` 的参数中至少有一个是 `double`\
  \ 类型。我们可以使用类型转换将常量 `2` 转换为 `double` 值。记住，`static_cast<double>(2)` 被称为*类型转换*（type\
  \ casting），它将 `int` 值 `2` 转换为 `double` 类型的值。因此，如果我们把 `2` 替换为 `static_cast<double>(2)`，这将把除法的第二个参数的类型从\
  \ `int` 变为 `double`，然后除法就会产生我们想要的结果。重写后的赋值语句为：\n\n```\nradius = diameter/static_cast<double>(2);\n\
  ```\n\n`unitPrice` 函数定义的完整修正代码以及程序的其余部分显示显示 4.10 中。\n\n\n\n\n\n```cpp\n//确定两种披萨尺寸中哪一种更划算。\n\
  #include <iostream>\nusing namespace std;\n\ndouble unitPrice (int diameter,double\
  \ price);\n//返回披萨每平方英寸的价格。名为 diameter 的形式 \n//参数是披萨的直径（英寸）。\n// 形名为 price 的形式参数是披萨的价格。\n\
  \nint main( )\n{\n   int diameterSmall, priceSmall;\n   int diameterLarge, priceLarge;\n\
  \   double unitPriceSmall,\n   double unitPriceLarge;\n\n   cout << \"欢迎来到披萨消费者联盟。\\\
  n\";\n   cout << \"输入小披萨的直径（英寸）：\";\n   cin >> diameterSmall;\n   cout << \"输入小披萨的价格：\
  \ $\";\n   cin >> priceSmall;\n   cout << \"输入大披萨的直径（英寸）：\";\n   cin >> diameterLarge;\n\
  \   cout << \"输入大披萨的价格： $\";\n   cin >> priceLarge;\n\n   unitPriceSmall = unitPrice(diameterSmall,\
  \ priceSmall);\n   unitPriceLarge = unitPrice(diameterLarge, priceLarge);\n\n  \
  \ cout.setf(ios::fixed);\n   cout.setf(ios::showpoint);\n   cout.precision(2);\n\
  \   cout << \"小披萨:\\n\"\n        << \"直径 = \" << diameterSmall << \" 英\\n\"\n  \
  \      << \"价格 = $\" << priceSmall\n        << \" 每平方英寸 = $\" << unitPriceSmall\
  \ << endl\n        << \"大披萨:\\n\"\n        << \"直径 = \" << diameterLarge << \" 英\\\
  n\"\n        << \"价格 = $\" << priceLarge\n        << \" 每平方英寸 = $\" << unitPriceLarge\
  \ << endl;\n   if (unitPriceLarge < unitPriceSmall)\n      cout << \"大披萨更划算。\\n\"\
  ;\n   else\n       cout << \"小披萨更划算。\\n\";\n\n   cout << \"胃口大开!\\n\";\n   return\
  \ 0;\n}\n\ndouble unitPrice(int diameter, double price)\n{\n   const double PI =\
  \ 3.14159;\n   double radius, area;\n\n   radius = diameter/static_cast<double>(2);\n\
  \   area = PI * radius * radius;\n   return (price/area);\n}\n```\n\n***示例对话***\n\
  \n```\n欢迎来到披萨消费者联盟。\n输入小披萨的直径（英寸）：10\n输入小披萨的价格：  $7.50\n输入大披萨的直径（英寸）：13\n输入大披萨的价格：\
  \  $14.75\n小披萨:\n直径 = 10 英\n价格 = $7.50 每平方英寸 = $0.10\n大披萨:\n直径 = 13 英\n价格 = $14.75\
  \ 每平方英寸 = $0.11\n小披萨更划算。\n胃口大开！\n```\n\n## 显示 4.10 `购买披萨`\n\n类型 `static_cast<double>(2)`\
  \ 返回值 `2.0`，因此我们本可以使用常量 `2.0` 来代替 `static_cast<double>(2)`。无论哪种方式，函数 `unitPrice`\
  \ 都将返回相同的值。然而，通过使用 `static_cast<double>(2)`，我们显而易见地表明我们想要执行的是结果包含小数部分的除法。如果我们改用\
  \ `2.0`，那么在修订或复制代码时，我们很容易犯下将 `2.0` 改为 `2` 的错误，这将产生一个细微的问题。\n\n我们需要对程序的编码再做一点说明。正如你在显示\
  \ 4.10 中所示，当我们编写任务 4 和 5 时，我们将这两个任务合并到了一段代码中，该代码由一系列 `cout` 语句后跟一个 `if-else` 语句组成。当两个任务非常简单且关联紧密时，将它们合并为一个单一任务有时是有意义的。\n\
  \n## 程序测试\n\n程序仅仅通过编译并产生看起来正确的答案，并不意味着程序是正确的。为了增加对程序的信心，你应该使用你通过其他方式已知正确答案的输入值对程序进行测试，例如，用纸笔计算答案或使用手持计算器。例如，买一个\
  \ 2 英寸的披萨是没有意义的，但它仍然可以作为该程序的一个简单测试用例。它是一个简单的测试用例，是因为用手很容易算出答案。让我们计算一个售价 $3.14 的\
  \ 2 英寸披萨的每平方英寸成本。由于直径是 2 英寸，半径是 1 英寸。半径为 1 的披萨面积为 `3.14159 * 1`²，即为 `3.14159`。如果我们将其除以\
  \ $3.14 的价格，发现每平方英寸的价格为 `3.14/3.14159`，大约是 $1.00。当然，这对于披萨来说是一个荒谬的尺寸，对于如此小的披萨来说也是一个荒谬的价格，但很容易确定函数\
  \ `unitPrice` 针对这些参数应该返回的值。\n\n\n\n\n在上一节中，我们主张将函数像黑盒一样使用。为了定义一个函数使其能够作为黑盒使用，你通常需要为函数提供它自己的变量，这些变量不会与程序的其余部分发生冲突。“属于”函数的变量被称为`局部变量`（local\
  \ variables）。正如我们将看到的，这些变量仅仅遵循第 3 章中的嵌套块作用域规则。在本节中，我们将再次查看作用域问题，重点关注局部变量以及如何使用它们。\n\
  \n# 小程序类比\n\n回看显示 4.1 中的程序。它包含了对预定义函数`sqrt`的调用。为了使用这个函数，我们不需要知道关于`sqrt`函数定义的任何细节。特别是，我们不需要知道在`sqrt`定义中声明了哪些变量。你定义的函数也是一样。你编写的函数定义中的变量声明与预定义函数定义中的变量声明是相互独立的。函数定义内部的变量声明与在另一个程序中的变量声明是一样的。如果你在函数定义中声明一个变量，然后在程序的`main`部分（或另一个函数定义的体体内）声明了同名的另一个变量，那么这两个变量是两个不同的变量，尽管它们的名称相同。让我们来看一个在函数定义中拥有与程序另一个变量同名变量的程序。\n\
  \n显示 4.11 中的程序有两个名为`averagePea`的变量；一个在函数`estTotal`的定义中声明并使用，另一个在程序的`main`部分声明并使用。`estTotal`函数定义中的变量`averagePea`和程序`main`部分中的变量`averagePea`是两个不同的变量。这就像函数`estTotal`是一个预定义函数一样。这两个名为`averagePea`的变量之间的相互干扰并不比两个完全不同程序中的两个变量之间的干扰大。当在函数调用`estTotal`时给`averagePea`赋值时，这并不会改变程序`main`部分中同样名为`averagePea`的变量的值。（显示\
  \ 4.11 中程序的细节除了这种命名的巧合外，将在本节之后的“编程示例”部分解释。）\n\n```\n1      //计算实验性豌豆生长块的平均产量。\n\
  \ 2      #include <iostream>\n 3      using namespace std;\n 4    \n 5      double\
  \ estTotal(int minPeas, int maxPeas, int podCount);\n 6      //返回收获豌豆总数的估计值。\n 7\
  \      //形式参数 podCount 是豆荚的数量。\n 8      //形式参数 minPeas 和 maxPeas 是每颗豆荚中\n 9    \
  \  //豌豆的最小和最大数量。\n10\n11      int main( )\n12      {\n13          int maxCount,\
  \ minCount, podCount;\n14          double averagePea, yield;\n15\n16          cout\
  \ << \"Enter 每颗豆荚中豌豆的最小和最大数量: \";\n17          cin >> minCount >> maxCount;\n18\
  \          cout << \"Enter 豆荚的数量: \";\n19          cin >> podCount;\n20        \
  \  cout << \"Enter 每颗豌豆的平均重量（盎司）:\";\n21          cin >> averagePea;\n22\n23   \
  \       yield =\n              estTotal(minCount, maxCount, podCount) * averagePea;\n\
  25\n26          cout.setf(ios::fixed);\n27          cout.setf(ios::showpoint);\n\
  28          cout.precision(3);\n29          cout << \"Min number of peas per pod\
  \ = \" << minCount << endl\n30               << \"Max number of peas per pod = \"\
  \ << maxCount << endl\n31               << \"Pod count = \" << podCount << endl\n\
  32               << \"Average pea weight = \"\n33               << averagePea <<\
  \ \" ounces\" << endl\n34               << \"Estimated average yield = \" << yield\
  \ << \" ounces\"\n35               << endl;\n36\n37          return 0;\n38    }\n\
  39\n40    double estTotal(int minPeas, int maxPeas, int podCount)\n41    {\n42 \
  \         double averagePea;\n43          averagePea = (maxPeas + minPeas)/2.0;\n\
  44          return (podCount * averagePea);\n45    ```***对话***\n\n每颗豆荚中豌豆的最小和最大数量:\
  \ 4 6\n豆荚的数量: 10\n每颗豌豆的平均重量（盎司）: 0.5\n每颗豆荚中豌豆的最小数量 = 4\n每颗豆荚中豌豆的最大数量 = 6\n豆荚数量 =\
  \ 10\n豌豆平均重量 = 0.500 盎司\n估计平均产量 = 25.000 盎司\n```\n\n名为`averagePea`的变量是局部的。\n\n名为`averagePea`的变量是局部于`estTotal`的。\n\
  \n# 局部变量\n\n在函数体内部定义的变量说是局部于该函数或以该函数为作用域。在程序`main`部分内部定义的变量说是局部于程序的`main`部分或以程序的`main`部分为作用域。当我们说一个变量不属于任何函数或不属于程序的`main`部分时，意味着它是局部于某个函数的。\n\
  \n# 编程示例 实验性地\n\n显示 4.11 中的程序给出了用于种植实验性豌豆的地块的总产量估计。`estTotal`函数返回收获豌豆总数的估计值。`estTotal`接受三个参数。一个参数是豆荚的数量。另外两个参数用于估计每颗豆荚中豌豆的数量。不同豆荚的豌豆数量不同，因此函数的另外两个参数是任何一个豆荚中找到的最小最大数量。`estTotal`计算这两个数字的平均值，并将该平均值作为每颗豆荚平均豌豆数的估计。\n\
  \n# 全局常量与全局变量\n\n正如我们在第 2 章中提到的，可以使用`const`修符对常量值命名。例如，在显示 4.10 中，我们使用了以下声明将常量`3.14159`命名为`PI`：\n\
  \n```cpp\nconst double PI = 3.14159;\n```\n\n在显示 4.3 中，我们使用`const`修符通过以下声明为销售税率命名：\n\
  \n```cpp\nconst double TAX_RATE = 0.05; //5%销售税\n```\n\n\n\n\n与我们的变量声明一样，我们将这些命名常量的声明放置在使用它们的函数体内部。这样做效果得很好，因为每个命名常量都只被一个函数使用。然而，很容易出现多个函数使用同一个命名常量的情况。在这种情况下，你可以将命名常量的声明放在程序的开头，即位于所有函数体之外，且位于程序\
  \ `main` 部分的函数体之外。此时，该命名常量被称为`全局命名常量`，并且该命名常量可以在常量声明之后的任何函数定义中使用。\n\n显示 4.12 显示了一个包含全局命名常量示例的程序。该程序要求输入半径，然后根据该半径同时计算圆面积和球体体积。编写该程序的程序员查阅了计算这些数值的公式，并发现了以下内容：\n\
  \n```\narea = π  × (radius)2\n volume = (4/3) × π × (radius)3\n```\n\n```\n 1  \
  \ //计算圆的面积和球体的体积。\n 2    //对两个计算都使用相同的半径。\n 3    #include <iostream>\n 4    #include\
  \ <cmath>\n 5    using namespace std;\n 6\n 7    const double PI = 3.14159;\n 8\n\
  \ 9    double area (double radius);\n10    //返回指定半径的圆的面积。\n11\n12    double volume(double\
  \ radius);\n13    //返回指定半径的球体的体积。\n14\n15    int main( )\n16    {\n17        double\
  \ radiusOfBoth, areaOfCircle, volumeOfSphere;\n18\n19        cout << \"Enter a radius\
  \ to use for both a circle\\n\"\n20             << \"and a sphere (in inches): \"\
  ;\n21        cin >> radiusOfBoth;\n22\n23        areaOfCircle = area(radiusOfBoth);\n\
  24        volumeOfSphere = volume(radiusOfBoth);\n25\n26        cout << \"Radius\
  \ = \" << radiusOfBoth << \" inches\\n\"\n27             << \"Area of circle = \"\
  \ << areaOfCircle\n28             << \" square inches\\n\"\n29             << \"\
  Volume of sphere = \" << volumeOfSphere\n30             << \" cubic inches\\n\"\
  ;\n31\n32          return 0;\n33    }\n34\n35    double area(double radius)\n36\
  \    {\n37          return (PI * pow(radius, 2));\n38    }\n39\n40    double volume(double\
  \ radius)\n41    {\n42          return ((4.0/3.0) * PI * pow(radius, 3));\n43  \
  \  }\n```\n\n***示例对话***\n\n```\n输入一个用于圆和球的半径（英寸）： 2\nRadius = 2 inches\nArea of\
  \ circle = 12.5664 square inches\nVolume of sphere = 33.5103 cubic inches\n```\n\
  \n# 显示 4.12 全局命名常量\n\n这两个公式都包含了 `π`，它大约等于 `3.14159`。符号 `π` 是希腊字母“pi”。在之前的程序中，我们使用以下声明来产生名为\
  \ `PI` 的常量：\n\n```cpp\nconst double PI = 3.14159;\n```\n\n在显示 4.12 程序中，我们使用了相同的声明但将其放在文件开头，以便定义可以在所有函数体中使用的命名常量。\n\
  \n编译器对你放置全局命名常量的位置有很大的自由度，但为了提高可读性，你应该将所有的 `include` 指令放在一起，所有的全局命名常量声明放在一起，所有的函数声明放在一起。我们将遵循标准做法，将全局命名常量声明放在\
  \ `include` 指令之后、函数声明之前。\n\n即使命名常量只被一个函数使用，将所有命名常量声明放在程序开头也有助于可读性。如果命名常量在未来的程序版本中可能需要更改，那么将它放在开头会更容易找到。例如，将销售税率的常量声明放在程序开头，以便在税率增加时可以修改程序。\n\
  \n可以将不带 `const` 修饰符的普通变量声明为`全局变量`，它们可以在文件中所有的函数定义中访问。这与全局命名常量的方法相同，只是变量声明没有修饰符。然而，通常不需要使用这样的全局变量。此外，全局变量会让程序更难理解。\n\
  \n# 值传递形式参数是局部变量\n\n形式参数不仅仅是待填充的空白。在本章的前面，我们描述了值传递机制。现在我们可以更详细地定义这种“插入”过程。形式参数就像你在函数体内部声明的变量一样是局部变量。但是，你不为形式参数添加变量声明。在函数声明中列出形式参数\
  \ `minutes_worked` 已经作为变量声明。以下是定义 `fee` 函数的*错误方法*，因为它重复声明了 `minutesWork`：\n\n# 显示\
  \ 4.13 作为局部变量使用的形式参数\n\n图 4.13 完整替代文本\n\n注意 `fee` 函数定义中的形式参数 `minutesWorked`。它被当作变量使用，并在函数定义内的以下行中改变了值：\n\
  \n```cpp\nminutesWorked = hoursWorked * 60 + minutesWorked;\n```\n\n# 块作用域\n\n\n\
  \n\n局部变量的作用范围是指程序中可以直接访问该变量的部分，有时称为 `local scope`（局部作用域）。同样，在程序开头、在所有函数体之外声明的全局标识符有时被称为具有\
  \ `global scope`（全局作用域）。尽管它们有所不同，但局部和全局标识符实际上都是第 3 章中描述的 `block scope`（块作用域）的示例。块是用括号括起来的某些\
  \ C++ 代码，除了“全局块”外，它是一个隐含的最外层块，包含了所有代码。作用域规则规定，在块内声明的标识符对于该块是局部的，并且仅从定义点到该块结束为止可以访问。块通常是嵌套的。例如，`main`\
  \ 函数的大括号定义了一个块，而 `main` 内部 `for` 循环定义了一个嵌套块。\n\n显示 4.14 中概述的程序没有计算任何有趣的内容，但说明了不同块中声明的标识符的作用域。在这个示例中，常量\
  \ `GLOBAL_CONST` 具有全局作用域，函数 `function1` 和 `main` 也是，因为它们是在所有函数体之外声明的。这允许我们从 `main`\
  \ 和 `function1` 访问 `GLOBAL_CONST`。\n\n## 再次回顾块作用域\n\n![一张插图展示了说明“局部、全局和块作用域”的代码段。](img/p227-1.png)\n\
  \n# 显示 4.14 局部、全局和块作用域\n\n图 4.14 完整替代文本\n\n`main` 函数声明了变量 `x` 和 `d`，它们对于 `main`\
  \ 是局部的。它们的作用域延伸到 `main` 块的结束。同样，函数 `function1` 有参数 `param` 和局部变量 `y`，它们的作用域延伸到 `function1`\
  \ 的结束。这两个变量都无法从其作用域之外直接访问。局部变量和参数的作用域实际上使用了相同的块作用域规则，但在这种情况下，块指的是声明变量或参数的函数。\n\n\
  显示 4.14 中的 `for` 循环说明了嵌套块的作用域。变量 `i` 在 `for` 循环内部声明，因此其作用域仅到循环块结束。尝试在它的作用域之外的任何地方引用\
  \ `i`，即使我们仍在 `main` 内部（例如在第 17 行），也会导致编译器错误。\n\n你可以认为变量是在其作用域开始时创建，并在其作用域结束时销毁的。例如，显示\
  \ 4.14 中的局部变量 `y` 每次调用 `function1` 时都会被创建并初始化为 `GLOBAL_CONST`。如果第 23 行的代码更改了存储在\
  \ `y` 中的值，那么这些更改将在函数退出且 `y` 离开作用域时丢失，因为变量 `y` 被销毁了。重复调用 `function1` 不会记得 `y` 的以前值，而是创建一个新的\
  \ `y`。\n\n除了块作用域，还有命名空间作用域（namespace scope）和类作用域（class scope）。类作用域在第 10 章中讨论，命名空间作用域在第\
  \ 12 章中。C++ 还定义了函数原型作用域（function prototype scope），它是指函数原型中定义的参数的作用范围。最后，C++ 支持函数作用域（function\
  \ scope），用于标签（labels）。标签是 C 语言的遗留，与 `goto` 语句配合使用。它们的使用通常被回避，因为它们可能导致难以追踪的逻辑，而相同任务可以通过循环以易理解的方式完成。\n\
  \n# 再次回顾命名空间\n\n到为止，我们所有的程序都是以以下两行代码开头的：\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\n```\n\n然而，文件的开头并不总是 `using namespace std;` 的最佳位置。在我们将使用比 `std` 更多的命名空间之前，应该把指令放在该去的地方。事实上，我们可以在函数定义中使用不同的命名空间。如果你将\
  \ `using namespace std;` 放在函数体的大括号 `{` 内部，该指令仅适用于该函数。这允许你使用不同的命名空间，即使它们在同一个文件中。\n\
  \n在函数定义内部放置 `using namespace std;` 类似于在函数内部放置变量声明；该指令的作用范围限于该函数。在使用任何 `std` 以外的命名空间之前，良好的做法是，当你开始使用多个命名空间时，这种差异会影响程序的执行。\n\
  \n```cpp\n// 计算圆的面积和球的体积。\n// 使用相同的半径进行计算。\n#include <iostream>\n#include <cmath>\n\
  \nconst double PI = 3.14159;\n\n// 返回指定半径的圆面积。\ndouble area(double radius);\n\n\
  // 返回指定半径的球体积。\ndouble volume(double radius);\n\nint main()\n{\n    using namespace\
  \ std;\n\n    double radiusOfBoth, areaOfCircle, volumeOfSphere;\n\n    cout <<\
  \ \"输入一个用于圆和球的\\n\"\n         << \"半径（英寸）: \";\n    cin >> radiusOfBoth;\n\n   \
  \ areaOfCircle = area(radiusOfBoth);\n    volumeOfSphere = volume(radiusOfBoth);\n\
  \n    cout << \"半径 = \" << radiusOfBoth << \" 英寸\\n\"\n         << \"圆的面积 = \" <<\
  \ areaOfCircle\n         << \" 平方英寸\\n\"\n         << \"球的体积 = \" << volumeOfSphere\n\
  \         << \" 立方英寸\\n\";\n\n    return 0;\n}\n\ndouble area(double radius)\n{\n\
  \    using namespace std;\n\n    return (PI * pow(radius, 2));\n}\n\ndouble volume(double\
  \ radius)\n{\n    using namespace std;\n\n    return ((4.0/3.0) * PI * pow(radius,\
  \ 3));\n}\n```\n\n该程序的示例对话与显示 4.12 中的程序相同。\n\n# 显示 4.15 `使用命名空间`\n\n### 自测练习题\n\n\
  \n\n\n20. 如果你在函数定义中使用了一个变量，你应该在哪里声明该变量？在函数定义内部吗？在程序的 `main` 部分？还是在任何方便的地方？\n\n21.\
  \ 假设有一个名为 `Function1` 的函数在 `Function1` 的定义内部声明了一个名为 `sam` 的变量，而名为 `Function2` 的函数在\
  \ `Function2` 的定义内部也声明了一个名为 `sam` 的变量。程序可以通过编译吗（假设其他部分都是正确的）？如果程序可以通过编译，它可以运行吗（假设其他部分都是正确的）？如果运行，运行时会生成错误信息吗（假设其他部分都是正确的）？如果运行且没有产生错误信息，它会输出正确的结果（假设其他部分都是正确的）？\n\
  \n22. 下述函数旨在以英尺和英寸作为长度参数，并返回该长度对应的总英寸数。例如，`total_inches(1,2)` 应该返回 `14`，因为 1 英尺\
  \ 2 英寸等于 14 英寸。以下函数的执行是否正确？如果不正确，原因是什么？\n\n```\ndouble total_inches(int feet, int\
  \ inches)\n{\n    inches = 12 * feet + inches;\n     return inches;\n}\n```\n\n\
  23. 编写一个名为 `readFilter` 的函数声明和函数定义，该函数没有参数且返回一个 `double` 类型的值。函数 `readFilter` 提示用户输入一个\
  \ `double` 类型的值并将该值读入局部变量中。如果读取的值大于或等于零，则函数返回该值；如果读取的值为负，则返回零。\n\n# 编程示例：阶乘函数\n\n\
  显示 4.16 包含了一个常用数学函数——阶乘函数的函数声明和定义。在数学文本中，阶乘函数通常写为 `n!`，定义为从 1 到 `n` 的所有整数的乘积。在传统的数学符号中，你可以这样定义\
  \ `n!`：\n\n```\nn! = 1 × 2 × 3 × ... × n\n```\n\n在函数定义中，我们使用 `while` 循环执行乘法。注意，乘法的顺序与你可能预期的相反。程序先乘以\
  \ `n`，然后是 `n – 1`，然后是 `n – 2`，依此类推。\n\n![插图显示了“阶乘函数”的代码段](img/p231-1.png)\n\n# 显示\
  \ 4.16 阶乘函数\n\n图 4.16 完整替代文本\n\n`factorial` 的函数使用了两个局部变量：在函数体开始处声明的 `product`，以及形式参数\
  \ `n`。由于形式参数是一个局部变量，因此我们可以更改它的值。在这种情况下，我们使用递减运算符 `n--` 来改变形式参数 `n` 的值。（递减运算符在第 2\
  \ 章中讨论过。）\n\n每执行一次循环体，变量 `product` 的值就会乘以 `n` 的值，然后使用 `n--` 将 `n` 的值减 1。如果用 `3`\
  \ 作为参数调用函数 `factorial`，那么第一次执行循环体时，`product` 的值为 `3`；第二次执行循环体时，`product` 的值为 `3\
  \ * 2`；第三次执行循环体时，`product` 的值为 `3 * 2 * 1`，然后 `while` 循环结束。因此，以下代码将变量 `x` 设置为 `6`，即\
  \ `3 * 2 * 1`：\n\n```\nx = factorial(3);\n```\n\n注意局部变量 `product` 在变量声明时被初始化为值 `1`。（这种在声明时初始化变量的方法是在第\
  \ 2 章中引入的。）很容易看出 `1` 是变量 `product` 的正确初始值。为了确认这是 `product` 的正确初始值，请注意在第一次执行 `while`\
  \ 循环体后，我们希望 `product` 的值等于（原始）形式参数 `n` 的值；如果 `product` 初始化为 `1`，那么就会发生这种情况。\n\n\
  # 4.6 重载函数名\n\n> “……——这说明一年有三百六四天，你可以收到非生日礼物的——”\n> > “当然了，”爱丽丝说。\n\n> > “而且生日礼物只有一个，你知道的。这对你来说太光荣了！”\n\
  \n> > “我不明白你说的‘光荣’是什么意思，”爱丽丝说。\n\n> > 呆呆蛋蔑蔑地地说，“除非我告诉你，否则它就什么什么意思——多也不少。”\n\n> >\
  \ “但‘光荣’并不是‘一个不起眼的论据’，”爱丽丝反对道。\n\n> > “当我使用一个词时，”呆呆蛋用带轻蔑的语气说，“它就意味着我选择的那个意思——多也不少。”\n\
  \n> > “问题在于，”爱丽丝说，“你能不能让词具有这么多意义。”刘易·卡罗尔，《穿镜奇游》\n\n# 重载简介\n\n假设你正在编写一个计算两个数字平均数的程序。你可能会使用以下函数定义：\n\
  \n```cpp\ndouble ave(double n1, double n2)\n{\n     return ((n1 + n2)/2.0);\n}\n\
  ```\n\n现在假设你的程序还需要一个计算三个数字平均数的函数。你可以定义一个新的名为 `ave3` 的函数：\n\n```cpp\ndouble ave3(double\
  \ n1, double n2, double n3)\n{\n     return ((n1 + n2 + n3)/3.0);\n}\n```\n\n这样做可行，而且很多编程语言没有其他选择。幸运的是，C++\
  \ 允许更优雅的解决方案。在 C++ 中，你只需为这两个函数使用相同的函数名 `ave`；你可以用以下函数定义来替代 `ave3` 定义：\n\n```cpp\n\
  double ave(double n1, double n2, double n3)\n{     return ((n1 + n2 + n3)/3.0);\n\
  }\n```\n\n函数名 `ave` 现在有两个定义。这就是重载示例。在这种情况下，我们重载了函数名 `ave`。在显示 4.17 中，我们将这两个 `ave`\
  \ 函数定义嵌入了一个完整的示例程序中。请注意，每个函数定义都有自己的函数声明。\n\n***输出***\n\n```\n2.0, 2.5 和 3.0 的平均数是\
  \ 2.50000\n4.5 和 5.5 的平均数是 5.00000\n```\n\n# 显示 4.17 重载函数名\n\n图 4.17 完整替代文本\n\n\n\
  \n\n重载是一个极棒的主意。它让程序更易于读，并避免了你为了给函数想一个新名称而抓狂——仅仅是因为你已经在另一个函数定义中使用过最自然的名称。但是，当编译器遇到一个具有两个或多个定义的函数名调用时，它是如何知道使用哪个函数定义的呢？编译器无法读取程序员的心思。为了确定使用哪个函数定义，编译器会检查函数调用中参数的数量和类型。在显示\
  \ 4.17 程序中，调用的函数 `ave` 一个有两个参数，另一个有三个。为了确定使用哪个定义，编译器只需计算函数调用中参数的数量。如果有两个参数，就使用第一个定义；如果有三个参数，就使用第二个定义。\n\
  \n每当你为同一个函数名提供两个或多个定义时，这些不同的函数定义必须具有不同的参数规格；也就是说，任何两个具有相同函数名的函数定义必须使用不同数量的形式参数，或者使用不同类型的形式参数（或两者兼有）。注意，当你重载一个函数名时，两个不同定义的函数声明在形式参数上必须不同。*你不能通过提供仅在返回值类型不同的定义来重载函数名*。\n\
  \n重载对你来说并不新鲜。你已经在第 2 章中见过除法运算符 `/` 的一种重载。如果两个操作数都是 `int` 类型，如 `13/2`，那么返回的值是整数除的结果，在这种情况下为\
  \ `6`。另一方面，如果一个或两个操作数都是 `double` 类型，那么返回的值就是普通除的结果；例如，`13/2.0` 返回值 `6.5`。除法运算符 `/`\
  \ 有两个定义，这两个定义之间的区别不在于操作数的数量不同，而在于要求不同类型的操作数。`/` 的重载与函数名重载的区别在于，编译器已经完成了对 `/` 的重载，而你编写了函数名的重载。我们将在后面的章节中看到如何重载\
  \ `+`、`–` 等运算符。\n\n# 编程示例：修改后的购买披萨程序\n\n披萨消费者联盟对我们为它编写的显示 4.10 程序非常成功。事实上，现在每个人总是买最划算的披萨。以前一家不名誉的披萨店曾通过欺骗消费者购买更贵的披萨来赚钱，但我们的程序终结了他们的恶行。然而，所有者们希望继续他们卑鄙的行为，并想出了欺骗消费者的新方法。他们现在提供圆形披萨和矩形披萨。他们知道我们写的程序无法处理矩形的披萨，因此他们希望能够再次混淆消费者。我们需要更新程序，以瓦败他们的恶意阴谋。我们想要修改程序，使其能够比较圆形披萨和矩形披萨。\n\
  \n我们需要对披萨评估程序所做的更改很明确：我们需要稍微更改输入和输出，以便处理两种不同形状的披萨。我们还需要添加一个新函数，计算矩形披萨每平方英寸的成本。我们可以在程序中使用以下函数定义，以便计算矩形披萨的单价：\n\
  \n```\ndouble unitPriceRectangular\n    (int length, int width, double price)\n\
  {     double area = length * width;\n     return (price/area);\n}\n```\n\n然而，对于一个函数来说，这个名字相当长；事实上，它太长到我们需要将函数头写在两行。这是合法的，但如果使用相同的名称\
  \ `unitPrice` 同时用于计算圆形披萨单价的函数和计算矩形披萨单价的函数会更好。由于 C++ 允许函数名重载，我们可以这样做。为函数 `unitPrice`\
  \ 提供两个定义不会给编译器带来问题，因为这两个函数的参数数量不同。显示 4.18 显示了我们在修改披萨评估程序以允许比较圆形披萨和矩形披萨后得到的程序。\n\n\
