  \ 100 个不同的 `if-else` 语句！相反，使用 `%` 和 `/` 来提取十位和个位数字以构建英文字符串。你可能需要专门对 0、10–19 等值进行测试。\n\
  \n5.  为了维持人体体重，成年人每天需要消耗足够的热路里以：(1) 满足基础代谢率（呼吸、维持体温所需的能量），(2) 考虑到运动等体力活动，以及 (3)\
  \ 考虑到消化消耗食物所需的能量。对于体重为 `P` 磅的成年人，我们可以使用以下公式估计这些热路里需求：\n\n1. 基础代谢率：所需卡路里 = 70 * (`P`\
  \ / 2.2)^(0.756)\n2. 体力活动：所需卡路里 = 0.0385 * `Intensity` * `P` * `Minutes`\n   这里，`Minutes`\
