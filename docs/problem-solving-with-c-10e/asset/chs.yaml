  \ ADT 文件的独立文件中。\n\n# 13 指针与链表\n\n> 如果那里恰好有一个\n> 以真诚的方式爱着我\n> 我的心会向你指引他\n> 我也会向你指引他\n\
  > — GILBERT AND SULLIVAN, 《Ruddigore》\n\n## 引言\n\n`linked list`（链表）是使用指针构建的列表。链表的大小不是固定的，而是在程序运行时可以增长和缩小。本章将向你介绍如何定义和操作链表，这将向你介绍使用指针的新方法。\n\
  \n### 前提条件\n\n本章使用了从第 2 章到第 12 章的内容。\n\n# 13.1 节点与链表\n\n有用的动态变量很少是 `int` 或 `double`\
  \ 这样的简单类型，通常是某些复杂类型，例如数组、`struct` 或类类型。你已经看到数组类型的动态变量是有用的。`struct` 或类类型的动态变量也有用，但方式不同。`struct`\
  \ 或类的动态变量通常有一个或多个成员变量，通过指针变量将它们连接到其他动态变量。例如，其中一个恰好包含购物列表的结构在显示 13.1 中所示。\n\n![说明节点和指针的流程图](img/fg13_00100.png)\n\
  \n# 显示 13.1 节点与指针\n\n图 13.1 完整替代文本\n\n# 节点\n\n类似于显示 13.1 所示的结构由我们绘制的由箭头连接的框组成。这些框被称为\
  \ `nodes`（节点），箭头代表指针。显示 13.1 中的每个节点都包含一个字符串、一个整数和一个可以指向相同类型其他节点的指针。注意，指针指向整个节点，而不是节点内部的各个项目（如\
  \ `10` 或 `\"rolls\"`）。\n\n节点在 C++ 中通过 `structs` 或类实现。例如，显示 13.1 中所示类型节点的 `struct`\
  \ 类型定义如下：\n\n```cpp\nstruct Node\n{\n    string item;\n    int count;\n    Node\
  \ *link;\n};\n\ntypedef Node* ListNode;\n```\n\n\n\n\n这条赋值语句与前一个语句的意思相同，但后者是通常使用的形式。\n\
  \n第一个节点中的字符串可以通过以下语句从 `\"rolls\"` 改为 `\"bagels\"`：\n\n```\nhead->item = \"bagels\"\
  ;\n```\n\n对列表第一个节点进行这些更改的结果如显示 13.2 图中所示。查看显示 13.2 图中所示列表中最后一个节点的指针成员。这个最后一个节点在应该有指针的地方写了\
  \ `NULL` 单词。在显示 13.1 中，我们曾用短语“end marker”填充了这个位置，但“end marker”并不是一个 C++ 表达式。在 C++\
  \ 程序中，我们使用常量 `NULL` 作为结束标记来指示链表的结束。`NULL` 是一个特殊的定义常量，是 C++ 语言的一部分（作为所需的 C++ 库的一部分提供）。\n\
  \n![两幅说明访问节点数据的流程图。](img/fg13_0020.png)\n\n# 显示 13.2 访问节点数据\n\n图 13.2 完整替代文本\n\n\
  `NULL` 通常用于两个不同的（但经常重合的）目的。它用于给一个本没有值的指针变量赋一个值。这防止了对内存的意外引用，因为 `NULL` 不是任何内存位置的地址。第二类用途是作为结束标记。程序可以像显示\
  \ 13.2 所示所示遍历节点列表，并且当程序到达包含 `NULL` 的节点时，它就知道到达了列表的末尾。\n\n常量 `NULL` 实际上是数字 `0`，但我们更倾向于将其思考并拼写为\
  \ `NULL`。这让你明确你指的是这个可以赋值给指针变量的特殊用途值。标识符 `NULL` 的定义在许多标准库中，例如 `<iostream>` 和 `<cstddef>`，因此当你使用\
  \ `NULL` 时，应该使用带有 `<iostream>` 或 `<cstddef>`（或其他合适的库）的 `include` 指令。为了让你的程序代码可以使用\
  \ `NULL`，不需要 `using` 指令。特别是，它不需要 `using namespace std;`，尽管你代码中的其他内容可能需要类似 `using\
  \ namespace std;` 的内容。\n\n可以使用赋值运算符将指针设置为 `NULL`，如下所示，这声明了一个名为 `there` 的指针变量并将其初始化为\
  \ `NULL`：\n\n```\ndouble *there = NULL;\n```\n\n常量 `NULL` 可以赋值给任何指针类型的指针变量。\n\n\
  # nullptr\n\n常量 `NULL` 实际上是数字 `0` 这一事实导致了歧义问题。考虑下面的重载函数：\n\n```cpp\nvoid func(int\
  \ *p);\nvoid func(int i);\n```\n\n如果我们调用 `func(NULL)`，将调用哪个函数？由于 `NULL` 是数字 0，两者都是同样有效的。C++11\
  \ 通过引入一个新常量 `nullptr` 解决了这个问题。`nullptr` 不是整数 零，但它是一个用于表示空指针的字面量常量。在任何你曾使用 `NULL`\
  \ 处理指针的地方都使用 `nullptr`。例如，我们可以写：\n\n```cpp\ndouble *there = nullptr;\n```\n\n###\
  \ 自测练习题\n\n1. 假设你的程序包含以下类型定义：\n\n   ```\n   struct Box\n   {\n       string name;\n\
  \       int number;\n       Box *next;\n   };\n   typedef Box* BoxPtr;\n   ```\n\
  \n   以下代码产生的输出是什么？\n\n   ```\n   BoxPtr head;\n   head = new Box;\n   head->name\
  \ = \"Sally\";\n   head->number = 18;\n   cout << (*head).name << endl;\n   cout\
  \ << head->name << endl;\n   cout << (*head).number << endl;\n   cout << head->number\
  \ << endl;\n   ```\n\n2. 假设你的程序包含自测练习 1 给出的类型定义和代码。该代码创建了一个包含字符串 `\"Sally\"` 和数字\
  \ `18` 的节点。你需要添加什么代码来将该节点的成员变量 `next` 的值设置为 `NULL`？\n\n3. 假设你的程序包含自测练习 1 给出的类型定义和代码。假设指针变量\
  \ `head` 的值没有被更改，你如何销毁 `head` 指向的动态变量以便重用内存？\n\n4. 给定以下结构定义：\n\n   ```\n   struct\
  \ ListNode\n   {\n       string item;\n       int count;\n       ListNode *link;\n\
  \   };\n   ListNode *head = new ListNode;\n   ```\n\n   编写代码将 `head` 指向的节点的 `item`\
  \ 成员赋值为 `\"Wilbur’s brother\"`。\n\n# 链表\n\n如显示 13.2 所示的列表，每个节点都有一个指向下一个节点的指针。列表中的第一个节点被称为头。要测试一个节点是否是最后一个节点，只需要测试它的指针成员是否等于\
  \ `NULL`。\n\n在本节中，我们的目标是编写一些操作链表的简单函数。为了方便，我们将使用如下的简单节点和指针类型：\n\n```\nstruct Node\n\
  {\n    int data;\n    Node *link;\n};\ntypedef Node* NodePtr;\n```\n\n作为热身练习，让我们看看如何构建链表的头部。首先，我们声明一个名为\
  \ `head` 的指针变量，它指向我们的链表头部：\n\n```\nNodePtr head;\n```\n\n为了创建我们的第一个节点，我们使用 `new`\
  \ 运算符创建一个新的动态变量，它将成为我们链表的第一个节点。\n\n然后我们给这个新节点的成员变量赋值：\n\n```\nhead->data = 3;\n\
  head->link = NULL;\n```\n\n注意，该节点的指针成员被设置为 `NULL`。\n\n在小节中，我们假设我们的链表已经包含一个或多个节点。插入函数的第一个参数将指向链表头部指针变量的引用传递参数。另一个参数将给出要存储在新节点中的数字。我们的插入函数声明如下：\n\
  \n```cpp\nvoid headInsert(NodePtr& head, int theNumber);\n```\n\n\n\n\n为了向链表插入一个新节点，我们的函数将使用\
  \ `new` 运算符创建一个新节点。然后将数据拷贝到新节点中，并将新节点插入到链表的头部。当我们以这种方式插入节点时，新节点将成为列表中的第一个节点（即头节点），而不是最后一个节点。由于动态变量没有名称，我们必须使用一个局部指针变量来指向该节点。如果我们将局部指针变量命名为\
  \ `tempPtr`，那么新节点就可以通过 `*tempPtr` 来引用。整个过程可以总结如下：\n\n### `headInsert` 函数的伪代码\n\n\
  1. 创建一个由 `tempPtr` 指向的新型动态变量。（这个新的动态变量就是新节点。这个新节点可以通过 `*tempPtr` 来引用。）\n2. 将数据存放在此新节点中。\n\
  3. 使此新节点的 `link` 成员指向原始链表的头节点（第一个节点）。\n4. 使命名为 `head` 的指针变量指向新节点。\n\n显示 13.313.1-2\
  \ 完整备用文本![四个说明向链表添加节点的流程图后两个。](img/fg13_00400.png)13.1-2 完整备用文本\n\n# 显示 13.3 向链表添加节点\n\
  \n完整的函数定义在显示 13.4 中。\n\n```\nFunction Declaration\n 1    struct Node\n 2    {\n\
  \ 3        int data;\n 4        Node *link;\n 5    };\n 6      \n 7    typedef Node*\
  \ NodePtr;\n 8      \n 9    void headInsert(NodePtr& head, int theNumber);\n10 \
  \   //前条件：指针变量 head 指向\n11    //链表的头部。\n12    //后条件：包含 theNumber 的新节点\n13    //已添加到链表的头部。\n\
  Function Definition\n 1    void headInsert(NodePtr& head, int theNumber)\n 2   \
  \ {\n 3        NodePtr tempPtr;\n 4        tempPtr = new Node;\n 5       \n 6  \
  \      tempPtr->data = theNumber;\n 7      \n 8        tempPtr->link = head;\n 9\
  \        head = tempPtr;\n10    }\n```\n\n# 显示 13.4 在链表头部添加节点的函数\n\n你可能需要考虑列表为空的情况。例如，购物清单可能是空的，因为本周没有东西要买。一个没有任何内容的列表被称为空列表。链表通过一个指向链表头部的指针来命名，但空列表没有头节点。要指定空列表，你使用指针\
  \ `NULL`。如果指针变量 `head` 应该指向链表的头节点，你可以如下设置 `head` 的值：\n\n```\nhead = NULL;\n```\n\
  \n每当你设计处理链表的函数时，都应该始终检查它对空列表是否有效。如果不有效，你可能需要为空列表添加特殊情况。或者你的程序必须以其他方式或完全避免空列表。幸运的是，空列表通常可以像任何其他列表一样对待。例如，显示\
  \ 13.4 中的 `headInsert` 函数是基于非空列表设计的，但检查将显示它对空列表同样有效。\n\n# 搜索链表\n\n接下来，我们将设计一个函数来搜索链表以定位特定节点。我们将使用之前节中相同的\
  \ `Node` 节点类型。（节点和指针类型的定义在显示 13.4;\n//前条件：指针 head 指向\n// 链表的头部。最后一个节点中的\n// 指针为\
  \ NULL。如果列表为空，则 head 为 NULL。\n// 返回指向包含目标的\n// 第一个节点的指针。如果没有节点//包含目标，函数返回 NULL。\n\
  ```\n\n我们将使用命名为 `here` 的局部指针变量来遍历列表寻找目标。在链表或任何由节点和指针组成的数据结构中移动的唯一方法是跟随指针。因此，我们将\
  \ `here` 指向第一个节点，并通过每个节点的指针移动指针。这种技术在显示 13.6\n{\n    使 here 指向列表中的下一个节点。\n}\nif\
  \ (here 指向的节点包含目标)\n    return here;\nelse\n    return NULL;\n```\n\n为了将指针 `here`\
  \ 移动到下一个节点，我们必须根据已命指针来思考。下一个节点是由 `here` 当前指向的节点的指针成员指向的。`here` 指向节点的指针成员由表达式给出：\n\
  \n```\nhere->link\n```\n\n将 `here` 移动到下一个节点，我们希望改变 `here` 使其指向上述指针（成员）变量。因此，以下语句将指针\
  \ `here` 移动到下一个节点：\n\n```\nhere = here->link;\n```\n\n将这些部分结合得到算法伪代码的如下改进：\n\n###\
  \ `search` 函数的初步版本\n\n```\nhere = head;\nwhile (here->data != target && here->link\
  \ != NULL)\n    here = here->link;\nif (here->data == target)\n    return here;\n\
  else\n    return NULL;\n```\n\n注意 `while` 语句中的布尔表达式。我们通过测试成员变量 `here->link` 是否等于\
  \ `NULL` 来测试 `here` 是否不是最后一个节点。\n\n![四个说明搜索链表的流程图。](img/fg13_00600.png)\n\n# 显示\
  \ 13.6 搜索链表\n\n图 13.6 完整备用文本\n\n我们仍然必须回去处理空列表。如果检查我们的代码，我们会发现空列表存在问题。如果列表为空，`here`\
  \ 等于 `NULL`，因此以下表达式是未定义的：\n\n```\nhere->data\nhere->link\n```\n\n\n\n\n当 `here`\
  \ 为 `NULL` 时，它没有指向任何节点，因此既没有名为 `data` 的成员，也没有名为 `link` 的成员。因此，我们对空列表进行了特例处理。完整的函数定义参见显示\
  \ 13.7。\n\n![一张插图显示了一个代码段，通过一个“函数”在“链表”中定位“节点”。](img/p756-1.png)\n\n# 显示 13.7 在链表中查找结点的函数\n\
  \n图 13.7 完整备用文本\n\n# 指针作为迭代器\n\n**迭代器**是一种允许你循环遍历数据结构中存储的数据项的构造，以便你可以对每个数据项执行任何你想要的操作。迭代器可以是某个迭代器类的对象，也可以是更简单的东西，例如数组索引或指针。指针提供了迭代器的一个简单示例。事实上，指针是迭代器的典型示例。这些基本思想可以在链表的语文中很容易地看到。你可以通过从链表头开始，一次移动一个节点通过链表，并循环列表中的所有节点，从而将指针作为迭代器。通用大纲如下：\n\
  \n```\nNode_Type *iter;\nfor (iter = head; iter != NULL; iter = iter->link)\n  \
  \  Do whatever you want with the node pointed to by iter;\n```\n\n其中，`head` 是指向链表头节点的指针，`link`\
  \ 是节点中指向链表中下一个节点的成员变量名。\n\n例如，为了输出我们一直讨论的这种类型链表在所有节点中的数据，你可以使用\n\n```cpp\nNodePtr\
  \ iter; //等同于： Node *iter;\nfor (iter = head; iter != NULL; iter = iter->link)\n\
  \    cout << (iter->data);\n```\n\n`Node` 和 `NodePtr` 的定义已给出在显示 13.7 中。\n\n# 在列表内部插入和删除节点\n\
  \n我们接下来设计一个函数，在链表的指定位置插入节点。如果你希望节点按照某种特定顺序（例如数字顺序或字母顺序），你不能简单地将节点插入到链表的开头或结尾。因此，我们将设计一个函数，在链表的指定节点之后插入节点。我们假设其他某个函数或程序部分已正确放置了一个名为\
  \ `afterMe` 的指针，指向链表中的某个节点。我们希望将新节点放在 `afterMe` 所指向的节点之后，如显示 13.8 所示。相同的技术适用于带有任何类型数据的节点，但为了具体起见，我们正在使用与之前小节相同类型的节点。类型定义已在显示\
  \ 13.7 中给出。我们要定义的函数声明如下：}\n\n```cpp\nvoid insert(NodePtr afterMe, int theNumber);\n\
  //前置条件：afterMe 指向链表中的一个节点。\n//后置条件：一个包含 theNumber 的新节点\n//已添加到 afterMe 所指向的节点之后。\n\
  ```\n\n![一个流程图，说明了在链表中间插入的操作。](img/fg13_00800.png)\n\n# 显示 13.8 在链表中间插入\n\n图 13.8\
  \ 完整备用文本\n\n新节点的设置方法与在显示 13.4 中函数 `headInsert` 中相同。此函数与上一个函数的区别在于，我们现在希望将节点插入在链表的头部，而是在\
  \ `afterMe` 所指向的节点之后。插入方法如显示 13.8 所示，并以 C++ 代码表示如下：\n\n```cpp\n// 将新节点连接到链表\ntempPtr->link\
  \ = afterMe->link;\n// 将链表连接到新节点\nafterMe->link = tempPtr;\n```\n\n这两个赋值语句的顺序至关重要。在第一个赋值中，我们要在更改\
  \ `afterMe->link` 的值之前获取它的值。完整的函数定义在显示 13.9 中：\n\n```cpp\nstruct Node {\n    int\
  \ data;\n    Node *link;\n};\ntypedef Node* NodePtr;\n\nvoid insert(NodePtr afterMe,\
  \ int theNumber) // 前置条件：afterMe 指向链表中的一个节点。\n// 后置条件：一个包含 theNumber 的新节点已添加到 afterMe\
  \ 所指向的节点之后。\n{\n    NodePtr tempPtr = new Node;\n    tempPtr->data = theNumber;\n\
  \    tempPtr->link = afterMe->link;\n    afterMe->link = tempPtr;\n}\n```\n\n# 显示\
  \ 13.9 在链表中间插入节点\n\n如果你查看 `insert` 函数，你会发现即使 `afterMe` 指向的是链表的最后一个节点，它也能正常工作。但是，对于在链表头部插入节点，你需要使用显示\
  \ 13.4 中的 `headInsert` 函数。尽管定位指针 `afterMe` 需要一些开销，但向链表插入比向数组要高效。\n\n从链表中删除节点也很容易。显示\
  \ 13.10 插示了这种方法。一旦 `before` 和 `discard` 指针定位好，删除该节点只需要以下语句：\n\n```cpp\nbefore->link\
  \ = discard->link;\n```\n\n![一个三部分的图，说明了删除节点的过程。](img/fg13_0100.png)\n\n# 显示 13.10\
  \ 删除节点\n\n这种操作就足够从链表中移除该节点了。然而，如果你不再使用该节点，你应该销毁它并将其使用的内存返回空闲存储；你可以通过调用 `delete`\
  \ 来：\n\n```cpp\ndelete discard;\n```\n\n### 自测练习\n\n5.  为链表的节点和指针编写类型定义。节点类型名为 `NodeType`，指针类型名为\
  \ `PointerType`。链表将是字母。\n\n6.  链表通常通过一个指向第一个节点的指针来给出，但空列表没有第一个节点。通常用什么指针值表示空列表？\n\
  \n7.  假设你的程序包含以下类型定义和指针变量声明：\n\n    ```cpp\n    struct Node {\n        double data;\n\
  \        Node *next;\n    };\n    typedef Node* Pointer;\n    Pointer p1, p2;\n\
  \    ```\n\n\n\n\n## 8. 假设你的程序包含了如自测练习 7 所示的类型定义和指针变量声明。进一步假设 `p2` 指向链表上的一个类型为 `Node`\
  \ 的节点，且该节点不是链表的最后一个节点。编写代码来删除 `p2` 所指向的节点*之后*的节点。在执行此代码后，链表应该保持不变，只是链表上的节点少了一个。（*提示：*你可能需要声明另一个指针变量来使用。）\n\
  \n## 9. 选择一个答案并解释原因。\n\n对于一个持有相同类型对象的大数组和一个大型列表，在链表中间的已知位置插入一个新对象，与在数组中插入相比：\n\n\
  1. 效率更高\n2. 效率更\n3. 大约相同\n4. 取决于两个列表的大小\n\n# 链表的变体\n\n在本小节中，我们将向你介绍使用节点和指针可以的许多数据结构。我们将简要描述两种额外的数据结构：双向链表和二叉树。\n\
  \n普通链表允许你仅向一个方向移动（顺着链接移动）。`双向链表`中的一个节点有两个链接，一个链接指向下一个节点，另一个链接指向上一个节点。从图上看，双向链表看起来像显示\
  \ 13.11 中的示例列表。\n\n![说明双向链表的流程图。](img/fg13_01100.png)\n\n# 显示 13.11 双向链表\n\n图 13.11\
  \ 完整替代文本\n\n双向链表的 `Node` 类如下：\n\n```\nstruct Node\n{\n    int data;\n    Node *forwardLink;\n\
  \    Node *backLink;\n};\n```\n\n双向链表通常不是指向头节点的单一指针，而是指向两个端节点中每一个节点的指针。你可以将这些指针称为\
  \ `front` 和 `back`，尽管选择哪个是 `front` 哪个是 `back` 是任意的。双向链表类的构造函数和某些函数的定义必须更改（相对于单链表的情况），以适应额外的链接。\n\
  \n`树` 是一种如显示 13.12 所示结构的数据结构。特别地，在树中，你可以通过遵循链接的某些路径从顶部（根）节点到达任何节点。注意树中没有循环。如果你遵循链接移动，最终会到达一个“末端”。注意每个节点有两个指向其他节点（或值\
  \ `NULL`）的链接。这种树被称为`二叉树`，因为每个节点恰好有两个链接。还有其他类型的树，节点中的链接数量不同，但二叉树是最常见的情况。\n\n![说明二叉树的流程图。](img/fg13_01200.png)\n\
  \n# 显示 13.12 二叉树\n\n图 13.12 完整替代文本\n\n树并不是链表的一种，但它使用链接（指针）的方式与链表中的用法相似。二叉树节点类型的定义本质上与双向链表相同，但两个链接通常使用\
  \ `left` 和 `right` 单词的某种形式命名。以下是一个可以用于构建二叉树的节点类型：\n\n```\nstruct TreeNode\n{\n \
  \   int data;\n    TreeNode *leftLink;\n    TreeNode *rightLink;\n};\n```\n\n在显示\
  \ 13.12 中，名为 `root` 的指针指向`根节点`（“顶部节点”）。根节点的作用类似于普通链表中的头节点（显示 13.10）。树中的任何节点都可以通过遵循链接从根节点到达。\n\
  \n*tree*（树）这个术语似乎是一个误用。根在树的顶部，分支结构看起来更像根的分支结构而不是树的结构。这个术语的秘密在于将图片显示 13.12 翻转过来。\n\
  \n\n\n\n\n# 显示 13.14 `Node` 类的实现文件\n\n```cpp\n 1    //此程序演示了如何使用 Node 类创建链表\n 2\
  \    //创建了五个节点，对它们进行输出，然后\n 3    //销毁。\n 4    #include <iostream>\n 5    #include\
  \ \"Node.h\"\n 6     \n 7    using namespace std;\n 8    using namespace linkedlistofclasses;\n\
  \ 9     \n10    //此函数将新节点插入到列表头部\n 11    //它是显示 13.4 中定义的相同函数的基于类的\n 12    //版本。\n\
  13    void headInsert(NodePtr& head, int theNumber)\n 14    {\n 15        NodePtr\
  \ tempPtr;\n 16        //构造函数将 tempPtr->link 设置为 head 并将\n 17        //数据值设置为 theNumber\n\
  \ 18        tempPtr = new Node(theNumber, head);\n 19        head = tempPtr;\n 20\
  \    }\n 21     \n 22    int main()\n 23    {\n 24        NodePtr head, tmp;\n 25\
  \     \n 26        //创建一个节点为 4 -> 3 -> 2 -> 1 -> 0 的列表\n 27        head = new Node(0,\
  \ NULL);\n 28        for (int i = 1; i < 5; i++)\n 29        {\n 30            headInsert(head,\
  \ i);\n 31        }\n 32        //遍历列表并显示每个值\n 33        tmp = head;\n 34      \
  \  while (tmp != NULL)\n 35        {\n 36            cout << tmp->getData() << endl;\n\
  \ 37            tmp = tmp->getLink();\n 38        }\n 39        //在退出程序前删除列表中的所有节点\n\
  \ 40        //\n 41        tmp = head;\n 42        while (tmp != NULL)\n 43    \
  \    {\n 44            NodePtr nodeToDelete = tmp;\n 45            tmp = tmp->getLink();\n\
  \ 46            delete nodeToDelete;\n 47        }\n 48        return 0;\n 49  \
  \  }\n```\n\n***示例对话***\n\n```\n4\n3\n2\n1\n0\n```\n\n# 显示 13.15 使用 `Node` 类的程序\n\
  \n# 13.2 栈与队列\n\n> 但许多现在在前的必倒在后的，许多现在在后的必倒在前的。\n\n马太福音 19:30\n\n链表有许多应用。在本节中，我们将给出两个其用途的示例。我们使用链表来实现两个名为\
  \ `stack`（栈）和 `queue`（队列）的数据结构。在本节中，我们始终使用普通链表，而不使用双向链表。\n\n# 栈\n\n`stack` 是一种按照数据存储顺序的反序来检索数据的数据结构。假设你将字母\
  \ 'A'、'B' 然后是 'C' 放入栈中。当你从栈中取出这些字母时，它们将按照 'C'、'B' 然后 'A' 的顺序被移除。栈的这种用法在显示 13.16\
  \ 中所示。如图所示，你可以将栈想象成地面上的洞。为了从栈中取出东西，你必须先移除你想要的东西之上的项。由于由于，栈通常被称为`后进先出` (LIFO) 数据结构。\n\
  \n![一个七部分的图表，显示字母 A、B 和 C 按顺序掉入一个窄容器中，使得 C 最终位于顶部，B 在中间，A 在底部。然后字母按照 C、B、A 的顺序从容器中取出。](img/fg13_01600.png)\n\
  \n# 显示 13.16 栈\n\n栈用于许多语言处理任务。在第 14 章中，我们将讨论计算机系统如何使用栈来跟踪 C++ 函数调用。然而，在这里我们只做一个非常简单的应用。我们在这个例子中的目标是向你展示如何使用链表技术来实现特定的数据结构；栈是使用链表的一个简单示例。你不需要为了理解这个例子而阅读第\
  \ 14 章。\n\n# 编程示例 栈栈类\n\n我们的 `Stack` 类的接口在显示 13.17 中给出。这个特定的栈用于存储 `char` 类型的数据。你可以定义一个存储任意类型数据的栈。在栈上可以执行两个基本操作：向栈添加项和从栈中移除项。向栈添加项被称为\
  \ `push`，从栈中移除项被称为 `pop`，我们将执行这些操作的成员函数以此此命名。\n\n```cpp\n1    //这是头文件 stack.h。这是\
  \ Stack 类的接口，\n2    //用于字符栈栈。\n3    #ifndef STACK_H\n4    #define STACK_H\n 5  \
  \  namespace stacksavitch\n 6    {\n 7        struct StackFrame\n 8        {\n 9\
  \            char data;\n 10            StackFrame *link;\n 11        };\n 12  \
  \      typedef StackFrame StackPtr;\n 13        class Stack\n 14        {\n 15 \
  \       public:\n 16            Stack( );\n 17            //初始化为空栈。\n 18       \
  \     Stack(const Stack aStack);\n 19            //拷贝构造函数。\n 20            ~Stack(\
  \ );\n 21            //销毁栈并释放所有内存。\n 22            void push(char theSymbol);\n\
