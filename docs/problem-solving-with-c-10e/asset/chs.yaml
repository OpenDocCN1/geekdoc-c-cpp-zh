  \n更改函数 `sort` 以能够对基类型为 `double` 的数组进行排序，我们只需要将类型名 `int` 的几个实例替换为类型名 `double` 即可。此外，`double`\
  \ 类型并没有特殊之处。我们可以对许多其他类型进行类似的替换。关于该类型，我们唯一需要知道的是该类型定义了运算符 `<`。这是函数模板的完美用例。\n\n# 17.2\
  \ 抽象模板\n\n（注：此处原文存在重复内容，已根据要求处理）\n\n\n\n\n一旦定义了类模板，你就可以声明该类的对象。声明必须指定要为 `T` 填充什么类型。例如，以下代码声明了对象\
  \ `score` 用来记录一对整数，并声明了对象 `seats` 用来记录一对字符：\n\n```\nPair<int> score;\nPair<char>\
  \ seats;\n```\n\n然后，这些对象可以像任何其他对象一样被使用。例如，以下代码将第一支队伍的分数设置为 `3`，将第二支队伍的分数设置为 `0`：\n\
  \n```\nscore.setElement(1, 3);\nscore.setElement(2, 0);\n```\n\n类模板的成员函数定义方式与普通类的成员函数相同。唯一的区别是成员函数的定义本身也是模板。例如，以下是成员函数\
  \ `setElement` 以及带有两个参数的构造函数的适当定义：\n\n```cpp\n//Uses iostream and cstdlib:\n template<class\
  \ T>\n void Pair<T>::setElement(int position, T value)\n{\n    if (position == 1)\n\
  \        first = value;     else if (position == 2)\n        second = value;   \
  \  else\n    {\n        cout << \"Error: Illegal pair position.\\n\";\n        exit(1);\n\
  \    }\n}\ntemplate<class T>\nPair<T>::Pair(T firstValue, T secondValue)\n     \
  \  : first(firstValue), second(secondValue)\n{\n     //Body intentionally empty.\n\
  }\n```\n\n注意，作用域解析符之前的类名是 `Pair<T>`，而不是简单的 `Pair`。\n\n类模板的名称可以作为函数参数的类型。例如，以下是一个带有整数对参数的函数的可能声明：\n\
  \n```cpp\nint addUp(const Pair<int>& thePair);\n//Returns the sum of the two integers\
  \ in thePairPair.\n```\n\n注意，我们指定了要填充到类型参数 `T` 中的类型，在本例中为 `int`。\n\n你甚至可以在函数模板中使用类模板。例如，与其定义上面那个特化的函数\
  \ `addUp`，你不如定义如下的函数模板，以便该函数适用于各种类型的数字：\n\n```cpp\ntemplate<class T>\nT addUp(const\
  \ Pair<T>& thePair);\n//Precondition: The operator + is defined for values of type\
  \ T.\n//Returns the sum of the two values in thePair.\n```\n\n# 编程示例：数组类\n\n显示 17.4\
  \ 包含一个对象为列表的类模板的接口。由于该类定义是一个类模板，因此这些列表可以是任意类型的项目列表。你可以拥有 `int` 类型值的列表、`double` 类型值的列表、`string`\
  \ 类型对象的列表，或者任何其他类型项目的的列表。\n\n```cpp\n 1    //This is the header file genericlist.h.\
  \ This is the interface for the\n 2    //class GenericList. Objects of type GenericList\
  \ can be a list of items\n 3    //of any type for which the operators << and = are\
  \ defined.\n 4    //All the items on any one list must be of the same type. A list\
  \ that\n 5    //can hold up to max items all of type Type_Name is declared as follows:\n\
  \ 6    //GenericList<Type_Name> the_object(max);\n 7    #ifndef GENERICLIST_H\n\
  \ 8    #define GENERICLIST_H\n 9    #include <iostream>\n10    using namespace std;\n\
  11    \n12    namespace listsavitch\n13    {\n14        template<class ItemType>\n\
  15        class GenericList\n16        {\n17        public:\n18            GenericList(int\
  \ max);\n19            //Initializes the object to an empty list that can hold up\
  \ to\n20            //max items of type ItemType.\n21            ~GenericList( );\n\
  22             //Returns all the dynamic memory used by the object to the freestore.\n\
  23            \n24            int length( ) const;\n25            //Returns the\
  \ number of items on the list.\n26            \n27            void add(ItemType\
  \ newItem);\n28            //Precondition: the list is not full.\n29           \
  \ //Postcondition: the newItem has been added to the list.\n30            \n31 \
  \           bool full( ) const;\n32            //Returns true if the list is full.\n\
  33            \n34            void erase( );\n35            //Removes all items\
  \ from the list so that the list is empty.\n36            \n37            friend\
  \ ostream& operator <<(ostream& outs,\n38                                      \
  \ const GenericList<ItemType>& theList)\n39            {\n40                   for\
  \ (int i = 0; i < theList.currentLength; i++)\n41                          outs\
  \ << theList.item[i] << endl;\n42                   return outs;\n43           \
  \ }\n44            //Overloads the << operator so it can be used to output the\n\
  45            //contents of the list.\n46            //Overloads the << operator\
  \ so it can be used to output the\n47            //contents of the list.\n48   \
  \         //Overloads the << operator so it can be used to output the\n49      \
  \      //contents of the list.\n50            //Precondition: If outs is a output\
  \ stream, then outs has\n51            //already been connected to file.\n52   \
  \         //Note that the implementation of the overloaded insertion\n53       \
  \     //has been placed in the header file rather than the implementation file.\n\
  54        private:\n55            ItemType *item; //pointer to the dynamic array\
  \ that holds the list.\n56            int maxLength; //max number of items allowed\
  \ on the list.\n57            int currentLength; //number of items currently on\
  \ the list.\n58        };\n59    }//listsitch\n60    #endif //GENERICLIST_H\n```\n\
  \n# 类模板 `GenericList` 的接口\n\n显示 17.4 包含了上述代码代码。由于该类定义是一个类模板，因此列表可以是任意类型的项目列表。你可以拥有\
  \ `int` 类型值的列表、`double` 类型值的列表、`string` 类型对象的列表，或者任何其他类型项目的列表。\n\n显示 17.5 包含一个使用该类模板的演示程序。虽然这个程序并没有做什么，但它展示了如何使用类模板。一旦你理解了语法细节，就可以在任何需要列表的程序中使用类模板。显示\
  \ 17.6 给出了类模板的实现。\n\n![](img/fg17_0050.png) ![](img/fg17_005b.png)\n\n***输出***\n\
  \n```\n Output\nfirstList =\n1\n2\nsecondList =\nA\nB\nC\n```\n\n# 使用 `GenericList`\
  \ 类模板的程序\n\n注意，我们重载了插入运算符 `<<`，以便它可以输出 `GenericList` 类的对象。为了这一点，我们将运算符 `<<` 为类的友元。为了获得与类类型相同的参数，我们使用了表达式\
  \ `GenericList<ItemType>` 作为参数类型。当类型参数被替换为（例如）`int` 类型时，该参数将是 `GenericList<int>`\
  \ 类型。\n\n\n\n\n\n关于编译来自显示 17.4,17.5 和 17.6 的代码需要说明。编译这些代码的有效解决方案是在使用之前 `#include`\
  \ 模板类定义和模板函数定义，正如我们所的那样。在这种情况下，只需要编译显示 17.5 中的文件。请确保你使用了 `#ifndef` `#define` `#endif`\
  \ 机制来防止所有要 `#include` 的文件被多次包含。\n\n```\n 1    //This is the implementation file:\
  \ genericlist.cpp\n 2    //This is the implementation of the class template named\
  \ GenericList.\n 3    //The interface for the class template GenericList is in the\n\
  \ 4    //header file genericlist.h.\n 5    #ifndef GENERICLIST_CPP\n 6    #define\
  \ GENERICLIST_CPP\n 7    #include <iostream>\n 8    #include <cstdlib>\n 9    #include\
  \ \"genericlist.h\" //This is not needed when used as we are using this file,\n\
  10                           //but the #ifndef in genericlist.h makes it safe.\n\
  11    using namespace std;\n 12    \n13    namespace listsavitch\n14    {\n 15 \
  \       //Uses cstdlib:\n16        template<class ItemType>\n 17        GenericList<ItemType>::GenericList(int\
  \ max) : maxLength(max),\n18                                                   \
  \  currentLength(0)\n19        {\n20            item = new ItemType[max];\n21  \
  \      }\n 22    \n23        template<class ItemType>\n 24        GenericList<ItemType>::~GenericList(\
  \ )\n25        {\n26            delete [] item;\n27        }\n 28    \n29      \
  \  template<class ItemType>\n30        int GenericList<ItemType>::length( ) const\n\
  31        {\n32            return (currentLength);\n33        }\n 34    \n35   \
  \     //Uses iostream and cstdlib:\n36        template<class ItemType>\n37     \
  \   void GenericList<ItemType>::add(ItemType newItem)\n38        {\n39         \
  \   if ( full( ) )\n40            {\n41                cout << \"Error: adding to\
  \ a full list.\\n\";\n42                exit(1);\n43            }\n44          \
  \  else\n45            {\n46                item[currentLength] = newItem;\n47 \
  \               currentLength = currentLength + 1;\n48            }\n49        }\n\
  \ 50    \n51        template<class ItemType>\n52        bool GenericList<ItemType>::full(\
  \ ) const\n53        {\n54            return (currentLength == maxLength);\n55 \
  \       }\n 56    \n57        template<class ItemType>\n58        void GenericList<ItemType>::erase(\
  \ )\n59        {\n60            currentLength = 0;\n61        }\n62}//listsavitch\n\
  63    #endif // GENERICLIST_CPP Notice that we have enclosed all the template\n\
