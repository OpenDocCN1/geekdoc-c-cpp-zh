  ;\n   ```\n\n9. 编写一些 C++ 代码，从键盘读取 20 个 `int` 类型的值并填充到数组 `a` 中。不需要编写完整的程序，只需编写实现此功能的代码，但请给出数组以及所有变量的声明。\n\
  \n10. 假设你有如下声明：\n\n    ```\n    int yourArray[];\n    ```\n\n    同样，假设在 C++ 实现中\
  \ `int` 占用 7 个字节。当你运行程序时，`yourArray` 将消耗多少内存？\n\n# 7.2 函数中的数组\n\n你可以同时使用索引变量和整个数组作为参数。我们首先讨论索引变量。\n\
  \n# 作为参数的索引变量\n\n索引变量可以像任何变量一样完全作为参数。例如，假设程序包含：\n\n```\nint i, a[10];\n```\n\n如果\
  \ `i` 为 0，那么以下操作是合法的：\n\n```\nmyFunction(a[0]);\n```\n\n如果 `i` 的值为 3，那么以下操作等同于：\n\
  \n```\nmyFunction(a[3]);\n```\n\n索引变量是值传递的。引用传递参数也适用于相同的说明。\n\n# 显示 7.3 作为参数的索引变量\n\
  \n```cpp\n#include <iostream>\nconst int NUMBER_OF_EMPLOYES = 3;\n\nint adjustDays(int\
  \ oldDays);\n//返回 oldDays 加 5。\n\nint main( )\n{\n    using namespace std;\n   \
  \ int vacation[NUMBER_OF_EMPLOYES], number;\n    cout << \"Enter allowed vacation\
  \ days for employees 1\"\n         << \"through \" << NUMBER_OF_EMPLOYES << \":\\\
  n\";\n    for (number = 1; number <= NUMBER_OF_EMPLOYES; number++)\n        cin\
  \ >> vacation[number - 1];\n    for (number = 0; number < NUMBER_OF_EMPLOYES; number++)\n\
  \        vacation[number] = adjustDays(vacation[number]);\n    cout << \"The revised\
  \ number of vacation days are:\\n\";\n    for (number = 1; number <= NUMBER_OF_EMPLOYES;\
  \ number++)\n        cout << \"Employee number \" << number\n             << \"\
  \ vacation days = \" << vacation[number-1] << endl;\n    return 0;\n}\n\nint adjustDays(int\
  \ oldDays)\n{\n    return (oldDays + 5);\n}\n```\n\n***示例对话***\n\n```\n Enter allowed\
  \ vacation days for employees 1 through 3:\n10 20 5\nThe revised number of vacation\
  \ days are:\nEmployee number 1 vacation days = 15\nEmployee number 2 vacation days\
  \ = 25\nEmployee number 3 vacation days = 10\n```\n\n### 自测练习\n\n11. 考虑以下函数定义：\n\
  \n```cpp\nvoid tripler(int& n)\n{\n    n = 3*n;\n}\n```\n\n以下哪些函数调用是可以接受的？\n\n\n\
  \n\n\n```cpp\nint a[3] = {4, 5, 6}, number = 2;\ntripler(number);\ntripler(a[2]);\n\
  tripler(a[3]);\ntripler(a[number]);\ntripler(a);\n```\n\n12. 下列代码有什么错误（如果有的话）？`tripler`\
  \ 的定义在自测练习 11 中。\n\n```cpp\nint b[5] = {1, 2, 3, 4, 5};\nfor (int i = 1; i <= 5;\
  \ i++)\n    tripler(b[i]);\n```\n\n# 将整个数组作为函数参数\n\n函数可以拥有一个用于整个数组的形式参数，这样在调用函数时，接入该形式参数的参数就是一个整个数组。然而，用于整个数组的形式参数既不是值传递参数，也不是引用传递参数；它是一种新的形式参数，被称为`array\
  \ parameter`（数组参数）。让我们从一个示例开始。\n\n在显示 7.4 中定义的函数有一个数组参数 `a`，它在函数调用时会被一个整个数组替换。它还有一个普通的值传递参数（`size`），假设这是一个等于数组大小的整数值。该函数用其数组参数（即填充数组的所有索引变量）填充从键盘输入的值，然后函数向屏幕输出一条消息，告知最后使用的数组索引。\n\
  \n形式参数 `int a[]` 是数组参数。方括号内没有索引表达式，这是 C++ 用于指示数组参数的。数组参数并不完全是引用传递参数，但在大多数实际用途中，它的行为非常类似于引用传递参数。让我们详细查看这个示例，看看在这种情况下数组参数是如何工作的。（当然，`array\
  \ argument` 是指接入数组参数的数组，例如 `a[]`。）\n\n当调用函数 `fillUp` 时，它必须有两个参数：第一个参数提供一个整数数组，第二个参数应该提供数组的声明大小。例如，以下是一个可接受的函数调用：\n\
  \n```cpp\nint score[5], numberOfScores = 5;\nfillUp(score, numberOfScores);\n```\n\
  \n此对 `fillUp` 的调用将用键盘输入的五个整数填充数组 `score`。注意，形式参数 `a[]`（它在函数声明和函数定义的标题中使用）是带有方括号给出的，但没有索引表达式。（你可以在数组参数的方括号内插入一个数字，但编译器会简单地忽略该数字，因此我们书书中不使用这样的数字。）另一方面，函数调用中提供的参数（在本例中为\
  \ `score`）提供时不带任何方括号或索引表达式。在这次函数调用中，数组参数 `score` 发生了什么？粗略地说，参数 `score` 被接入到函数体中的形式数组参数\
  \ `a`，然后执行函数体。因此，函数调用\n\n### 函数声明\n\n```cpp\n 1    void fillUp(int a[], int size);\n\
  \ 2    //前置条件：size 是数组 a 的声明大小。\n 3    //用户将输入 size 个整数。\n 4    //后置条件：数组 a 已用键盘输入的\
  \ size 个整数填充。\n```\n\n### 函数定义\n\n```cpp\n 1    //使用 iostream:\n 2    void fillUp(int\
  \ a[], int size)\n 3    {\n 4        using namespace std;\n 5        cout << \"\
  Enter \" << size << \" numbers:\\n\";\n 6        for (int i = 0; i < size; i++)\n\
  \ 7            cin >> a[i];\n 8        size--;\n 9        cout << \"The last array\
  \ index used is \" << size << endl;\n10   }\n```\n\n# 显示 7.4 带数组参数的函数\n\n```cpp\n\
  fillUp(score, numberOfScores);\n```\n\n等同于以下代码：\n\n![一张几行代码的插图，其中“size = 5;”行被注释为“5\
  \ 是 numberOfScores 的值”。](img/Ch7_p17.png)\n\n形式参数 `a` 与我们之前看到的参数类型不同。形式参数 `a` 仅仅是参数\
  \ `score` 的一个占位符。当用 `score` 作为数组参数调用函数 `fillUp` 时，计算机的行为就像 `a` 被替换为相应的参数 `score`\
  \ 一样。*当数组在函数调用中作为参数时，对数组参数执行的任何操作都会在数组参数上执行，因此数组参数索引变量的值可以被函数改变。*如果函数体中的形式参数被改变（例如通过\
  \ `cin` 语句），那么数组参数也会随之改变。\n\n到目前为止，数组参数看起来仅仅是数组的引用传递参数。这虽然接近事实，但数组参数与引用传递参数略有不同。为了帮助解释这种差异，让我们回顾关于数组的一些细节。\n\
  \n从这个角度来看，数组有三个部分：第一个索引变量的地址（位置）、数组的基类型（决定每个变量占用的内存）以及数组的大小（即索引变量的数量）。当数组作为函数的参数时，只将这三部分中的第一部分交给函数。当数组参数接入其对应的形式参数时，接入的只是索引变量的地址。数组参数的基类型必须与形式参数的基类型匹配，因此函数也知道数组的基类型。然而，数组参数并没有告诉函数数组的大小。当执行函数体中的代码时，计算机知道数组在内存中的起始位置以及每个变量占用的内存，但（除非你做了特殊处理）它不知道数组有多少个索引变量。这就是为什么始终提供另一个\
  \ `int` 参数来告诉函数数组的大小至关重要的原因。这也是为什么数组参数不同于引用传递参数的原因。\n\n这些数组参数可能有点奇怪，但直接由于这种看似奇怪的定义，它们至少有一个很好的特性。这种优势通过再次查看显示\
  \ 7.4 中给出的 `fillUp` 函数示例得到了最好的说明。*同一个函数可以用于填充任何大小的数组*，只要数组的基类型是 `int`。例如，假设你有如下的数组声明：\n\
  \n```cpp\nint score[5], time[10];\n```\n\n以下对 `fillUp` 的第一个调用用 `score` 数组填充五个值，第二个调用用\
  \ `time` 数组填充十个值：\n\n```cpp\nfillUp(score, 5);\nfillUp(time, 10);\n```\n\n\n\n\n\
  \n你可以对不同大小的数组参数使用同一个函数，因为大小是一个独立的参数。\n\n# `const` 参数修饰符\n\n当你在函数调用中使用数组参数时，函数可以更改数组中存储的值。这通常是没问题的。然而，在复杂的函数定义中，你编写的代码可能会在无意中更改数组中存储的一个或多个值，尽管该数组本不应该被更改。作为预防措施，你可以告诉编译器你并不打算更改数组参数，然后计算机将进行检查，确保你的代码没有无意中更改数组中的任何值。要告诉编译器函数不应更改数组参数，你可以在该参数位置的数组参数之前插入修饰符\
  \ `const`。使用 `const` 修饰的数组参数被称为**常量数组参数**。\n\n例如，以下函数输出数组中的值，但不会更改数组中的值：\n\n```\n\
  void showTheWorld(int a[ ], int sizeOfA)\n//Precondition: sizeOfA 是数组 a 的声明大小。\n\
  //a 的所有索引变量都已赋予了值。\n//Postcondition: a 中的值已写入\n//到屏幕上。\n{\n    cout << \"The array\
  \ contains the following values:\\n\";\n    for (int i = 0; i < sizeOfA; i++)\n\
  \        cout << a[i] << \" \";\n    cout << endl;\n}\n```\n\n该函数可以正常工作。然而，作为额外的安全措施，你可以如下所示在函数头中添加修饰符\
  \ `const`：\n\n```\nvoid showTheWorld(const int a[ ], int sizeOfA)\n```\n\n添加了此修饰符\
  \ `const` 后，如果你的函数定义包含更改数组参数中任何值的错误，计算机将发出错误信息。例如，以下 `showTheWorld` 函数的一个版本，它包含一个无意更改数组参数值的错误。幸运的是，这个版本的函数定义包含了修饰符\
  \ `const`，因此错误信息会告诉我们数组 `a` 被更改了。该错误信息将帮助解释错误：\n\n```\nvoid showTheWorld(const int\
  \ a[ ], int sizeOfA)\n//Precondition: sizeOfA 是数组 a 的声明大小。\n//a 的所有索引变量都已赋予了值。\n\
  //Postcondition: a 中的值已写入\n//到屏幕上。\n```\n\n![插图显示了代码，其中“for(int i = 0; i < sizeOfA;\
  \ a[i]++)”被注释为“错误，但除非使用 const 修饰符，否则编译器将检测不到。”](images/Ch7_p20.png)\n\n如果我们在这个函数定义中没有使用\
  \ `const` 修饰符，并且犯了所示的错误，函数将编译并运行，而没有任何错误信息。然而，代码将包含一个无限循环，不断增加 `a[0]` 并将其新值写入屏幕。\n\
  \n这个错误的 `showTheWorld` 版本的问题在于，在 `for` 循环中增加了错误的项。索引变量 `a[i]` 被增了，但本应该增加的是索引 `i`。在这个错误的版本中，索引\
