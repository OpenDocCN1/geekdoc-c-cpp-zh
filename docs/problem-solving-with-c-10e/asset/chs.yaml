  > 引用自 YOGI BERRA\n\n## 引言\n\n程序中语句执行的顺序被称为控制流。`if-else` 语句、`while` 语句和 `do-while`\
  \ 语句是指定控制流的三种方法。本章探索了使用这些语句的一些新方法，并引入了两种名为 `switch` 语句和 `for` 语句的新语句，它们也被用于控制流。`if-else`\
  \ 语句、`while` 语句或 `do-while` 语句的操作由布尔表达式控制。我们首先详细地讨论布尔表达式。\n\n### 前提条件\n\n本章使用了第\
  \ 2 章中的材料。\n\n## 3.1 使用布尔表达式\n\n> “相反地，”特德迪继续说道，“如果事实这样，它可能是；如果确实如此，它就会是；但既然事实如此，它就不是。这就是逻辑。”\n\
  > 刘易斯·卡罗尔，《穿镜镜》\n\n### 评估布尔表达式\n\n布尔表达式是一个可以被认为是 `true` 或 `false` 的表达式（即如果满足则为 `true`，如果不满足则为\
  \ `false`）。到目前为止，你已经将布尔表达式用作 `if-else` 语句中的测试条件循环（如 `while` 循环）中的控制表达式。然而，布尔表达式对于你可能使用的任何\
  \ `if-else` 语句或循环语句都有其独立的身份。C++ 类型 `bool` 允许你声明可以携带 `true` 和 `false` 值的变量。\n\n布尔表达式的评估方式与算术表达式相同。唯一的区别在于，算术表达式使用\
  \ `+`、`*` 和 `/` 等运算符并产生数字作为最终结果，而布尔表达式使用关系运算符如 `==` 和 `<` 以及布尔运算符如 `&&`、`||` 和 `!`\
  \ 来产生 `true` 和 `false` 值之一作为最终结果。注意 `==`、`!=`、`<`、`<= 等是可以操作的。\n\n\n\n\n由于关系运算符\
  \ `>` 和 `==` 在 `&&` 操作之前进行求值，你可以省略上述表达式中的括号，它的含义是相同的，但包含一些括号会让表达式更易读。\n\n当表达式中省略括号时，计算机将根据被称为`优先级规则`的规则对项目进行分组。C++\
  \ 的某些优先级规则可见显示 3.2。如果一个操作在另一个操作之前求值，则先求值的的操作为具有`更高的优先级`。等优先级的二元操作按左到右顺序执行。等优先级的一元操作按右到左顺序执行。完整的优先级规则见附录\
  \ 2。\n\n![优先级规则列表。](img/fg03_00200.png)\n\n# 显示 3.2 优先级规则\n\n图 3.2 完整替代文本\n\n注意，优先级规则既包含了\
  \ `+` 和 `*` 等算术运算符，也包含了 `&&` 和 `||` 等布尔运算符。这是因为许多表达式结合了算术和布尔操作，如下例例所示：\n\n```\n\
  (x + 1) > 2 || (x + 1) < −3\n```\n\n如果你检查显示 3.2 中给出的优先级规则，你会发现该表达式等同于\n\n```\n((x\
  \ + 1) > 2) || ((x + 1) < −3)\n```\n\n因为 `>` 和 `<` 的优先级高于 `||`。事实上，你可以省略上述表达式中的所有括号，它的含义是相同的，尽管读起来会更困难。虽然我们不主张省略所有括号，但看到如何使用优先级规则来解释这样的表达式可能会很有启发性。以下是不带任何括号的表达式：\n\
  \n```\nx + 1 > 2 || x + 1 < −3\n```\n\n优先级规则说首先应用一元 `−`，然后应用 `+` 符号，接着执行 `>` 和 `<`，最后执行\
  \ `||`，这与完全加括号的版本所指示的操作完全一致。\n\n此前对布尔表达式如何进行求值的描述基本上是正确的，但在 C++ 中，计算机在求值布尔表达式时实际上会偶尔采取捷径。注意，在很多情况下，你只需要求值布尔表达式中的两个子表达式中的第一个。例如，考虑以下：\n\
  \n```\n(x >= 0) && (y > 1)\n```\n\n如果 `x` 是负数，那么 `(x >= 0)` 为 `false`，正如你在显示 3.1\
  \ 的表格中所示，当 `&&` 表达式中的一个子表达式为 `false` 时，无论另一个表达式是 `true` 还是 `false`，整个表达式都是 `false`。因此，如果我们知道第一个表达式是\
  \ `false`，就不需要求值第二个表达式。`||` 表达式的情况也类似。如果用 `||` 运算符连接的两个表达式中的第一个是 `true`，你就知道整个表达式是\
  \ `true`，无论第二个表达式是 `true` 还是 `false`。C++ 语言利用这一事实，可以避免求值由 `&&` 或 `||` 连接的逻辑表达式中第二个子表达式的麻烦。C++\
  \ 首先求值由 `&&` 或 `||` 连接的两个表达式中最左侧的一个。如果这提供了足够的信息来确定表达式的最终值（独立于第二个表达式的值），那么 C++ 就不会去求值第二个表达式。这种求值方法被称为`短路求值`。\n\
  \n除了 C++ 之外，某些语言使用`完全求值`。在完全求值中，当两个表达式由 `&&` 或 `||` 连接时，两个子表达式总是求值，然后使用真值表来获得最终表达式的值。\n\
  \n短路求值和完全求值给答案相同，所以你为什么要关心 C++ 使用了短路求值呢？大多数时候你不需要关心。只要由 `&&` 或 `||` 连接的两个子表达式都有值，两种方法产生相同的结果。然而，如果第二个子表达式是未定义的，你可能会很幸运。\n\
  \n\n\n如果你没有指定任何数值，枚举类型定义中的标识符将被赋予从 `0` 开始的连续值。例如，该类型定义：\n\n```\nenum Direction {\
  \ NORTH = 0, SOUTH = 1, EAST = 2, WEST = 3 };\n```\n\n等同于\n\n```cpp\nenum Direction\
  \ { NORTH, SOUTH, EAST, WEST };\n```\n\n这种没有显式列出 `int` 值的形式通常用于你只需要一个名称列表且不在乎它们具体数值是什么的情况。\n\
  \n如果你只对部分枚举常量初始化了某些值，例如：\n\n```\nenum MyEnum { ONE = 17, TWO, THREE, FOUR = −3,\
  \ FIVE };\n```\n\n那么 `ONE` 取值为 `17`，`TWO` 取下一个 `int` 的值 `18`，`THREE` 取下下一个值 `19`，`FOUR`\
  \ 取值为 `−3`，而 `FIVE` 取下一个值 `-2`。\n\n简而言之，第一个枚举常量的默认值是 `0`。除非你设置了一个或多个枚举常量，否则它们都会递\
  \ 1。\n\nC++11 引入了一种新版本的枚举，称为强类型枚举（strong enums 或 enum classes），它避免了传统枚举的一些问题。例如，你可能不希望枚举表现像整数。此外，枚举是全局作用域，因此你不能拥有两个相同的枚举值。要定义强枚举，在\
  \ `enum` 之后添加 `class` 关键字。你可以通过提供枚举名称、两个冒号以及值来限定枚举值。例如：\n\n```\nenum class Days\
  \ { Sun, Mon, Tue, Wed };\n enum class Weather { Rain, Sun };\nDays d = Days::Tue;\n\
  Weather w = Weather::Sun;\n```\n\n变量 `d` 和 `w` 不是整数，因此我们不能像对待整数那样处理它们。例如，检查 `if\
  \ (d == 0)` 是非法的，而在传统枚举中这是合法的。检查 `if (d == Days::Sun)` 是合法的。\n\n# 3.2 多分支\n\n> “请告诉我，我从这里应该往哪条路走吗？”\n\
  > “这很大程度上取决于你想去哪里，”猫说。\n> 刘易斯·卡罗尔，《爱丽丝仙仙游》\n\n任何从多个备选方案中选择其一的编程结构都被称为分支机制。`if-else`\
  \ 语句在两个替代方案之间进行选择。在本节中，我们将讨论从两个以上替代方案中选择的方法。\n\n# 嵌套语句\n\n正如你所看到的，`if-else` 语句和\
  \ `if` 语句内部包含了更小的语句。到目前为止，我们使用复合语句和赋值语句等这些较小的子语句，但还有其他可能性。事实上，任何语句都可以作为 `if-else`\
  \ 语句、`if` 语句、`while` 语句或 `do-while` 语句的子部分。这在显示 3.3 中所示。该显示中的语句有三层嵌套，如框所示。两个 `cout`\
  \ 语句嵌套在一个 `if-else` 语句中，而该 `if-else` 语句又嵌套在一个 `if` 语句中。\n\n![一张说明在 if 语句中嵌套 if-else\
  \ 语句的图](img/fg03_00300.png)\n\n# 显示 3.3 if 语句中的 if-else 语句\n\n图 3.3 完整备用文本\n\n在嵌套语句时，通常会对每一层嵌套的子语句进行缩进。在显示\
  \ 3.3 中，有三层嵌套，因此有三层缩进。两个 `cout` 语句的缩进程度相同，因为它们处于相同的嵌套层级。在本章的后后部分，你将看到某些使用其他缩进模式合理的特定情况，但除非有相反的规则，否则你应该像显示\
  \ 3.3 所示那样对每一层嵌套进行缩进。\n\n# 编程提示：在嵌套语句中使用括号\n\n假设我们想写一个 `if-else` 语句，用于赛车的车载计算机监控系统。程序的这部分会在燃油量低时警告驾驶员，但在油箱快满时告诉驾驶员跳过进站检查。在所有其他情况下，程序不输出任何内容，以免分散驾驶员的注意力。我们设计了以下伪代码：\n\
  \n如果油表低，则发出警告。否则（即油箱已满），告诉驾驶员不要停止。如果我们不小心，可能会按照如下方式实现代码：\n\n```\nif (fuelGauge <\
  \ 3/4)\n    if (fuelGauge < 1/4)\n        cout << \"Fuel low\";\n    else\n    \
  \    cout << \"Fuel over 3/4\";\n```\n\n编译器会将 `else` 与最近且未与任何 `else` 配对的 `if` 配对。这被称为**悬空\
  \ else (dangling else)** 问题；它在显示 3.4 中所示。为了修复这个问题，使用括号来分组语句：\n\n```\nif (fuelGauge\
  \ < 3/4) {\n    if (fuelGauge < 1/4) {\n        cout << \"Fuel low\";\n    }\n}\
  \ else {\n    cout << \"Fuel over 3/4\";\n}\n```\n\n现在，`else` 正确地匹配了第一个 `if`。\n\n\
  # 显示 3.4 括号的重要性\n\n图 3.4 完整备用文本\n\n\n\n\n然而，即使在这些简单的情况下，大括号有时也能提高代码的可读性。一些程序员主张，在\
  \ `if-else` 语句中，即使是最简单的子语句也使用大括号，这正如我们在 Display 3.4 中的第一个 `if-else` 语句中所做的那样。\n\n\
  # 多路 `if-else` \n\n`if-else` 语句是一个双分支。它允许程序在两个可能的动作中选择一个。通常你可能希望有一个三分支或四分支，以便程序可以在两个以上的备选动作之间进行选择。你可以通过嵌套\
  \ `if-else` 语句来实现这种多路分支。例如，假设你正在设计一个游戏程序，用户必须猜一个数字。该数字存储在名为 `number` 的变量中，猜的值存储在名为\
  \ `guess` 的变量中。如果你想在每次猜测后给出提示，可能会设计如下伪代码：\n\n```\n当 guess > number 时输出“太高了”。\n当\
  \ guess < number 时输出“太低了”。\n当 guess == number 时输出“正确！”。\n```\n\n每当分支动作被描述为一组互斥条件和对应动作的列表时（如本例所示），都可以嵌套的\
  \ `if-else` 语句来实现。例如，这段伪代码翻译为以下代码：\n\n```\nif (guess > number)\n\tcout << \"Too\
  \ high.\";\n else if (guess < number)\n\tcout << \"Too low.\";\n else if (guess\
  \ == number)\n\tcout << \"Correct!\";\n```\n\n这里使用的缩进模式与我们之前提倡的略有不同。如果我们遵循之前的缩进规则，将会产生类似如下的内容：\n\
  \n```\nif (guess > number)\n\tcout << \"Too high.\";\n else\n \t   if (guess < number)\n\
  \t\tcout << \"Too low.\";\n \t   else\n \t\t   if (guess == number)\n\t\t\tcout\
  \ << \"Correct!\";\n```\n\n请使用之前的缩进模式而不是这种。这是少数几种情况之一，你不应该遵循我们关于嵌套语句的通用缩进指南。原因是，通过对齐所有的\
  \ `else`，你同时也对齐了所有的条件/动作对，从而使程序的布局能够反映你的推理逻辑。另一个原因是，即使对于嵌套得不是太深的 `if-else` 语句，你也会很快耗尽页面的空间！\n\
  \n由于条件是互斥的，上述嵌套 `if-else` 语句中的最后一个 `if` 是多余的，可以省略，但有时将其如下所示包含在注释中是最好的：\n\n```\n\
  if (guess > number)\n\tcout << \"Too high.\";\n else if (guess < number)\n\tcout\
  \ << \"Too low.\";\n else //(guess == number)\n\t cout << \"Correct!\";\n```\n\n\
  即使条件不是互斥的，你也可以使用这种形式的多分支 `if-else` 语句。无论条件是否互斥，计算机都会按照它们出现的顺序评估条件，直到找到第一个为 `true`\
  \ 的条件，然后执行该条件对应的动作。如果没有条件为 `true`，则不采取任何动作。如果语句以不带 `if` 的普通 `else` 结尾，则当所有条件都为 `false`\
  \ 时，执行最后一个语句。\n\n# 编程示例 州所得税\n\nDisplay 3.5 包含一个使用多路 `if-else` 语句的程序。该程序获取纳税人四舍五入到整数的净收入，并根据该净收入计算应交的州所得税。州根据以下税率表计算税：\n\
  \n1. 前 $15,000 的净收入不缴税。\n2. $15,001 到 $25,000 之间的每美元净收入征收 5% 的税。\n3. 超过 $25,000\
  \ 的每美元净收入征收 10% 的税。\n\n```\n 1\t//计算州所得税的程序。\n 2\t#include <iostream>\n 3\tusing\
  \ namespace std;\n 4\n 5\t//此程序输出计算出的州所得税金额，\n 6\t//如下：$15,000 以下收入免税；$15,001 至\n\
   //$25,000 之间的收入征收 5%；$25,000 以上收入征收 10%。\n 8\n 9\tint main( )\n10\t  {\n11\t\t\
  \  int netIncome;\n12\t\t  double taxBill;\n13\t\t  double fivePercentTax, tenPercentTax;\n\
  14\n15\t\t  cout << \"Enter net income (四舍五入到整数) $\";\n16\t\t  cin >> netIncome;\n\
  17\n18\t\t  if (netIncome <= 15000)\n19\t\t\t  cout << \"Too high.\";\n20\t\t  else\
  \ if (netIncome <= 25000)\n21\t\t\t  cout << \"Too low.\";\n22\t\t  else //(netIncome\
  \ > 25000)\n23\t\t\t  cout << \"Correct!\";\n24\t\t  return 0;\n25\t}\n```\n\n\n\
  \n`SOME_CONSTANT` 是一个 `int` 类型的常量。假设 `\"First Output\"` 和 `\"Second Output\"` 都没有输出。因此，你知道\
  \ `x` 的值被输出了。\n\n12. 编写一个多分支 `if-else` 语句，将 `int` 变量 `n` 的值分类为以下类别之一，并输出适当的消息：\n\
  \n```\nn < 0 or 0 ≤ n ≤ 100 or n > 100\n```\n\n13. 假定以下声明和输出语句，假设它们已嵌入到正确的程序中并运行。输出是什么？\n\
  \n```\nenum Direction { N, S, E, W };\n//...\ncout << W << \" \" << E << \" \" <<\
  \ S << \" \" << N << endl;\n```\n\n14. 假定以下声明和输出语句，假设它们已嵌入到正确的程序中并运行。输出是什么？\n\n\
  ```\nenum Direction { N = 5, S = 7, E = 1, W };\n// ...\ncout << W << \" \" << E\
  \ << \" \" << S << \" \" << N << endl;\n```\n\n### `switch` 语句\n\n你已经见过用 `if-else`\
  \ 语句来构建多分支。`switch` 语句是另一种 C++ 语句，也实现多分支。示例 `switch` 语句在显示 3.6 中。这个特定的 `switch`\
  \ 语句有四个普通分支和一个用于非法输入的第五个分支。变量 `grade` 决定了执行哪一个分支。每个等级 `'A'`、`'B'` 和 `'C'` 都有一个分支。等级\
  \ `'D'` 和 `'F'` 会进入同一个分支，而不是为 `'D'` 和 `'F'` 分别执行操作。如果 `grade` 的值是 `'A'`、`'B'`、`'C'`、`'D'`\
  \ 或 `'F'` 之外的任何字符，则执行标识符 `default` 之后的 `cout` 语句。\n\n```\n 1\t// 用于说明 switch 语句的程序\n\
   2\t#include <iostream>\n 3\tusing namespace std;\n 4\tint main( )\n 5\t{\n 6\t\t\
  char grade;\n 7\t\tcout << \"Enter your midterm grade and press Return: \";\n 8\t\
  cin >> grade;\n 9\tswitch (grade)\n10\t\t  {\n11\t\t\t  case 'A':\n12\t\t\t\t  cout\
  \ << \"Excellent. \"\n13\t\t\t\t\t   << \"You need not take the final.\\n\";\n14\t\
  \t\t\t  break;\n15\t\t\t  case 'B':\n16\t\t\t\t  cout << \"Very good. \";\n17\t\t\
  \t\t  grade = 'A';\n18\t\t\t\t  cout << \"Your midterm grade is now \"\n19\t\t\t\
  \t\t   << grade << endl;\n20\t\t\t\t  break;\n21\t\t\t  case 'C':\n22\t\t\t\t  cout\
  \ << \"Passing.\\n\";\n23\t\t\t\t  break;\n24\t\t\t  case 'D':\n25\t\t\t  case 'F':\n\
  26\t\t\t\t  cout << \"Not good. \"\n27\t\t\t\t\t   << \"Go study.\\n\";\n28\t\t\t\
  \t  break;\n29\t\t\t  default:\n30\t\t\t\t  cout << \"That is not a possible grade.\\\
  n\";\n31\t\t  }\n32\t\t  cout << \"End of program.\\n\";\n33\t\t  return 0;\n34\t\
  \  }\n```\n\n**示例对话 1**\n\n```\nEnter your midterm grade and press Return: A\nExcellent.\
  \ You need not take the final.\nEnd of program.\n```\n\n**示例对话 2**\n\n```\nEnter\
  \ your midterm grade and press Return: B\nVery good. Your midterm grade is now A.\n\
  End of program.\n```\n\n**示例对话 3**\n\n```\nEnter your midterm grade and press Return:\
  \ D\nNot good. Go study.\nEnd of program.\n```\n\n**示例对话 4**\n\n```\nEnter your\
  \ midterm grade and press Return: E\nThat is not a possible grade.\nEnd of program.\n\
  ```\n\n# 显示 3.6 一个 `switch` 语句\n\n`switch` 语句的语法和首选缩进模式在显示 3.6 中的示例 `switch` 语句以及标题为“switch\
  \ Statement”的框中所示。\n\n当执行 `switch` 语句时，会执行多个不同分支中的一个。执行哪一个分支的选择由关键字 `switch` 之后括号中给出的控制表达式决定。显示\
  \ 3.6 中示例 `switch` 语句中的控制表达式类型为 `char`。`switch` 语句必须求值为整数、字符或 `enum`。执行哪一个分支的选择由关键字\
  \ `switch` 之后的括号中的控制表达式决定。\n\n\n\n\n```cpp\n//Program to give out homework assignment\
  \ information.\n#include <iostream>\nusing namespace std;\n\nint main( )\n{\n\t\
  int choice;\n\t\n\tdo\n\t{\n\t\tcout << endl\n\t\t\t<< \"Choose 1 to see the next\
  \ homework assignment.\\n\"\n\t\t\t<< \"Choose 2 for your grade on the last assignment.\\\
  n\"\n\t\t\t<< \"Choose 3 for assignment hints.\\n\"\n\t\t\t<< \"Choose 4 to exit\
  \ this program.\\n\"\n\t\t\t<< \"Enter your choice and press Return: \";\n\t\tcin\
  \ >> choice;\n\n\t\tswitch(choice)\n\t\t{\n\t\t\tcase 1:\n\t\t\t\t//code to display\
  \ the next assignment on screen would go here.\n\t\t\t\t\tbreak;\n\t\t\tcase 2:\n\
  \t\t\t\t\t//code to ask for a student number and give the corresponding\n\t\t\t\t\
  \t//grade would go here.\n\t\t\t\t\tbreak;\n\t\t\tcase 3:\n\t\t\t\t\t//code to display\
  \ a hint for the current assignment would go\n\t\t\t\t\t//here.\n\t\t\t\t\tbreak;\n\
  \t\t\tcase 4:\n\t\t\t\t\tcout << \"End of Program.\\n\";\n\t\t\t\t\tbreak;\n\t\t\
  \tdefault:\n\t\t\t\t\tcout << \"Not a valid choice.\\n\"\n\t\t\t\t\t\t<< \"Choose\
  \ again.\\n\";\n\t\t}\n\t} while (choice != 4);\n\t\n\treturn 0;\n}\n```\n\n***示例对话***\n\
  \n# 显示 3.7 菜单\n\n![插图显示了用于发布作业信息的代码输出示例。](img/p134-1.png)3.2-5 完整替代文本\n\n# 块 (Blocks)\n\
  \n`switch` 语句或 `if-else` 语句的每个分支都是一个独立的子任务。正如之前的编程提示所示，通常最好的方法是将每个分支的操作设为函数调用。这样，每个分支的子任务就可以单独进行设计、编写和测试。另一方面，有时一个分支的操作非常简单，你只需要将其作为一个复合语句。偶尔，你可能想为这个复合语句提供自己的局部变量。例如，考虑显示\
  \ 3.8 中的程序。它计算了指定价格数量物品的最终账单。如果销售是批发交易，则不收取销售税（推测是因为会在物品转售给零售买家时支付）。然而，如果销售是零售交易，则必须加上销售税。使用\
  \ `if-else` 语句来对批发和零售购买产生不同的计算。对于零售购买，计算使用了一个名为 `subtotal` 的临时变量，因此该变量在 `if-else`\
  \ 语句该分支的复合语句内部声明。\n\n![](img/p135-1.png)![插图显示了一个带有局部变量的代码段块。](img/p136-1.png)\n\
  \n***示例对话***\n\n```\n输入价格: $10.00\n输入购买数量: 2\n如果是批发购买，输入 W。\n如果是零售购买，输入 R。\n然后按回车。\n\
  R\n2 件物品 每$10.00\n总账单 = $21.00（含销售税）。\n```\n\n# 显示 3.8 带有局部变量的块\n\n图 3.8 完整替代文本\n\
  \n如显示 3.8 所示，变量 `subtotal` 在一个复合语句内部声明。如果我们愿意，可以在声明它的复合语句之外将变量名 `subtotal` 用于其他地方。在复合语句内部声明的变量对于该复合语句是**局部的\
  \ (local)**。局部变量在复合语句执行时创建，在复合语句完成后销毁。换句话说，局部变量仅存在于声明它的复合语句内部。在复合语句内部，你可以使用复合语句外部声明的所有变量，也可以使用复合语句内部声明的局部变量。\n\
  \n带有声明的复合语句不仅仅是一个简单的复合语句，因此它有一个特殊的名称。包含变量声明的复合语句通常被称为**块 (block)**，在块内声明的变量被称为**块的局部的\
  \ (local to the block)**。\n\n# 3.3 关于 C++ 循环语句的更多\n\n> 生活并不是接接一个的倒霉——\n\n> \n\n\
  > 而是同一件倒霉事反复发生。\n\nEDNA ST. VINCENT MILLAY, 给 Arthur Darison Ficke 的信, 1930 年 10\
  \ 月 24 日\n\n\n\n\n\n`loop`（循环）是任何重复执行某语句或语句序列的程序结构。我们已经见过的简单 `while` 循环和 `do-while`\
  \ 循环就是循环的示例。在循环中重复的语句（或一组语句）被称为循环的 `body`（循环体），而循环体的每次重复执行被称为循环的 `iteration`（迭代）。在构建循环时，两个主要的设计问题是：循环体应该是什么？循环体应该迭代多少次？\n\
  \n# 回习 `while` 语句\n\n`while` 语句及其变体 `do-while` 语句的语法在显示器 3.9 中进行了回顾。这两种循环之间的重要区别在于控制布尔表达式*何时*进行检查。当执行\
  \ `while` 语句时，在执行循环体*之前*会检查布尔表达式。如果布尔表达式的值为 `false`，则循环体完全不执行。对于 `do-while` 语句，先执行循环体，在执行循环体*之后*再检查布尔表达式。因此，`do-while`\
  \ 语句始终至少执行一次循环体。在启动之后，`while` 循环和 `do-while` 循环的行为非常相似。在循环体的每次迭代后，都会再次检查布尔表达式；如果为\
  \ `true`，则循环将再次迭代。如果它从 `true` 变为 `false`，则循环语句结束。\n\n![插图展示了“while”语句和“do-while”语句的语法。](img/p140-1.png)\n\
  \n# 显示器 3.9 `while` 语句和 `do-while` 语句的语法\n\n图 3.9 完全替代文本\n\n## 循环执行的逻辑\n\n执行 `while`\
  \ 循环时发生的第一件事是评估控制布尔表达式。如果布尔表达式在某一点评估的结果为 `false`，则循环体永远不会执行。执行零次循环体似乎毫无意义，但有时这正是所需要的操作。例如，`while`\
  \ 循环通常用于计算数字列表之和，但该列表可能是空的。更具体地说，支票对账程序可能会使用 `while` 循环来汇总你一个月内开出的所有支票金额——但你可能休息了一个月，一张支票都没开。在这种情况下，没有数字需要相加，因此循环迭代了零次。\n\
  \n# 回习递增和递减运算符\n\n你已经将递增运算符作为一种语句，将变量的值加 1。例如，以下代码将在屏幕上输出 `42`：\n\n```\nint number\
  \ = 41;\nnumber++;\ncout << number;\n```\n\n到目前为止，我们一直将递增运算符作为语句。但递增运算符也是一种运算符，就像\
  \ `+` 运算符一样。像 `number++` 这样的表达式也会返回一个值，因此 `number++` 可以用于算术表达式中，如 `2 * (number++)`。\n\
  \n表达式 `number++` 首先返回变量 `number` 的值，然后 `number` 的值增加 1。例如，考虑以下代码：\n\n```\nint number\
  \ = 2;\nint valueProduced = 2 * (number++);\ncout << valueProduced << endl;\ncout\
  \ << number << endl;\n```\n\n此代码将产生以下结果：\n\n```\n4\n3\n```\n\n注意表达式 `2 * (number++)`。当\
  \ C++ 评估此表达式时，它使用的是 `number` 在递增*之前*的值，而不是递增之后的值。因此，表达式 `number++` 产生的值是 `2`，尽管递增运算符将\
  \ `number` 的值改为 `3`。这可能看起来很奇怪，但有时这正是你想要的。而且，正如你将要看到的，如果你想要一个行为不同的表达式，你也可以实现。\n\n\
  表达式 `v++` 评估结果为变量 `v` 的值，然后 `v` 的值增加 1。如果你反转顺序并将 `++` 放在变量前面，这两个动作的顺序就会反转。表达式 `++v`\
  \ 首先增加变量 `v` 的值，然后返回这个增加后的 `v` 的值。例如，考虑以下代码：\n\n```\nint number = 2;\nint valueProduced\
  \ = 2 * (++number);\ncout << valueProduced << endl;\ncout << number << endl;\n```\n\
  \n此代码与之前的代码相同，区别在于 `++` 在变量之前，所以这段代码产生了以下结果：\n\n```\n6\n3\n```\n\n注意两个递增运算符 `number++`\
  \ 和 `++number` 对变量 `number` 具有相同的效果：它们都将 `number` 的值增加 1。但两个表达式评估出的值不同。请记住，如果 `++`\
  \ 在变量*之前*，则递增是在值返回*之前*完成的；如果 `++` 在变量*之后*，则递增是在值返回*之后*完成的。\n\n显示器 3.10 表达式中的递增运算符\n\
  \n程序在显示器 3.10 中展示了使用递增运算符作为语句来将变量的值加 1。\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\n\nint main()\n{\n    int numberOfItems, count, totalCalories;\n\n    cout\
  \ << \"How many items did you eat today? \";\n    cin >> numberOfItems;\n\n    totalCalories\
  \ = 0;\n    count = 1;\n    cout << \"Enter the number of calories in each of\\\
  n\"\n         << numberOfItems << \" items eaten:\\n\";\n\n    while (count++ <=\
  \ numberOfItems)\n    {\n        cin >> caloriesForItem;\n        totalCalories\
  \ += caloriesForItem;\n    }\n\n    cout << \"Total calories eaten today = \"\n\
  \         << totalCalories << endl;\n\n    return 0;\n}\n```\n\n***对话***\n\n```How\
  \ many items did you eat today? 7\nEnter the number of calories in each of\n7 items\
  \ eaten:\n300 60 120\n600 150 120\nTotal calories eaten today = 1430\n```\n\n###\
  \ 自测练习\n\n21. 以下代码如果嵌入到完整程序中，输出是什么？\n\n```cpp\nint count = 3;\nwhile (count-- >\
  \ 0)\n    cout << count << \" \";\n```\n\n22. 以下代码如果嵌入到完整程序中，输出是什么？\n\n```cpp\n\
  int count = 3;\nwhile (--count > 0)\n    cout << count << \" \";\n```\n\n23. 以下代码如果嵌入到完整程序中，输出是什么？\n\
  \n```cpp\nint n = 1;\ndo\n    cout << n << \" \";\nwhile (n++ <= 3);\n```\n\n24.\
  \ 以下代码如果嵌入到完整程序中，输出是什么？\n\n```cpp\nint n = 1;\ndo\n    cout << n << \" \";\nwhile\
  \ (++n <= 3);\n```\n\n\n\n\n\n### `for` 语句\n\n`while` 语句和 `do-while` 语句就是你绝对需要的循环机制。事实上，仅需\
  \ `while` 语句就足够了。然而，有一种循环类型非常常见，以至于 C++ 为其包含了一个特殊的语句。在进行数值计算时，通常会先用数字 1 进行计算，然后是数字\
  \ 2，接着是 3，依此类推，直到达到某个最后一个值。例如，为了将 1 到 10 数字相加，你希望计算机执行十次以下语句，其中 `n` 的值第一次等于 `1`，之后每次\
  \ `n` 都增加 1：\n\n```\nsum = sum + n;\n```\n\n以下是使用 `while` 语句实现这一目标的一种方法：\n\n```\n\
  sum = 0;\nn = 1;\n while (n <= 10)\n{\n\tsum = sum + n;\n\tn++;\n}\n```\n\n虽然在这里使用\
  \ `while` 循环可以完成任务，但这种情况正是 `for` 语句（也称为 `for` 循环）的设计初衷。下面的 `for` 语句可以简洁地完成相同的任务：\n\
  \n```\nsum = 0;\n for (n = 1; n <= 10; n++)\n\tsum = sum + n;\n```\n\n让我们逐部分分析这个\
  \ `for` 语句。\n\n首先，注意到 `while` 循环版本和 `for` 循环版本是由相同的部分组合而成的：它们都以一个将变量 `sum` 设置为 `0`\
  \ 的赋值语句开始。在两种情况下，这个对 `sum` 的赋值语句都放置在循环语句开始之前。循环语句本身都是由这些部分组成的。\n\n```\nn = 1; n\
  \ <= 10; n++ and sum = sum + n;\n```\n\n这些部分在 `for` 语句中的作用与它们在 `while` 语句中相同。`for`\
  \ 语句仅仅是表达相同含义的一种更紧凑的方式。虽然还有其他可能性，但我们将只使用 `for` 语句来执行由一个变量控制的循环。在我们的示例中，该变量就是 `n`。在前面两个循环等效性的指导下，让我们来看一下编写\
  \ `for` 语句的规则。\n\n`for` 语句以关键字 `for` 开头，后面跟着括号内的三个内容，它们告诉计算机如何处理控制变量。`for` 语句的开头如下：\n\
  \n```\nfor (Initialization_Action; Boolean_Expression; Update_Action)\n```\n\n第一个表达式告诉我们如何初始化变量，第二个表达式给出了用于检查循环何时结束的布尔表达式，最后一个表达式告诉我们我们在每次循环执行循环体后，如何更新循环控制变量。例如，上面的\
  \ `for` 循环开始于：\n\n```\nfor (n = 1; n <= 10; n++)\n```\n\n`n = 1` 表示 `n` 被初始化为 `1`。`n\
  \ <= 10` 表示只要 `n` 小于或等于 `10`，循环就会继续迭代循环体。最后一个表达式 `n++` 表示在每次执行循环体后，`n` 递增 1。\n\n\
  `for` 语句开头的三个表达式由两个、且仅两个分号隔开。不要屈受在第三个表达式后放置分号的诱惑。（技术性解释是，这三者都是表达式而不是语句，因此结尾不需要分号。）\n\
  \n[Display 3.11] 显示了 `for` 语句的语法，并通过展示它如何转换为等效的 `while` 语句来描述 `for` 语句的操作。注意，在 `for`\
  \ 语句中，与相应的 `while` 语句一样，停止条件是在第一次迭代之前测试的。因此，可能存在循环体执行零次的 `for` 循环。\n\n```\nfor Statement\n\
  SYNTAX\n1\t for (Initialization_Action; Boolean_Expression; Update_Action)\n2\t\t\
  \ Body_Statement\nEXAMPLE\n1\t for (number = 100; number >= 0; number−−)\n2\t\t\
  \ cout << number\n3\t\t\t   << \" bottles of beer on the shelf.\\n\";\n```\n\n**等效的\
  \ `while` 循环**\n\n**等效语法**\n\n```\n1\tInitialization_Action;\n2\t while (Boolean_Expression)\n\
  3\t {\n4\t\t Body_Statement\n5\t\t Update_Action;\n6\t }\n```\n\n**等效示例**\n\n```\n\
  1\tnumber = 100;\n2\t while (number >= 0)\n3\t {\n4\t\t cout << number\n5\t\t\t\
  \  << \" bottles of beer on the shelf.\\n\";\n6\t\t number−−;\n7\t }\n```\n\n***输出***\n\
  \n```\n100 bottles of beer on the shelf.\n99 bottles of beer on the shelf.\n```\n\
  \n# 显示 3.11 `for` 语句\n\n[Display 3.11] 显示了一个嵌入完整程序中的示例 `for` 语句。`for` 语句与上述类似，但它有一个新特性：`n`\
  \ 初始化为 `1`。`n <= 10` 表示只要 `n` 小于或等于 `10`，循环就会继续迭代循环体。最后一个表达式 `n++` 表示在每次执行循环体后，`n`\
  \ 递增 1。\n\n到为止，你已经看到了在每次循环迭代后将控制变量增加 1 的 `for` 循环，也看到了在每次循环迭代后将控制变量减少 1 的 `for`\
  \ 循环。还有更多可能的变量更新类型。变量可以递增或递减 2 或 3 或任何数字。如果变量是 `double` 类型，它可以递增或递减一个小数。以下所有都是合法的\
  \ `for` 循环：\n\n\n\n\n\n```cpp\nint n;\n for (n = 1; n <= 10; n = n + 2)\n\tcout\
  \ << \"n is now equal to \" << n << endl;\nfor (n = 0; n > −100; n = n − 7)\n\t\
  cout << \"n is now equal to \" << n << endl;\nfor (double size = 0.75; size <= 5;\
  \ size = size + 0.05)\n\tcout << \"size is now equal to \" << size << endl;\n```\n\
  \n更新并不非得加法或减法。此外，初始化也不仅仅是将变量赋值为常量。你可以以任何你想要的方式初始化和更改循环控制变量。例如，下面的代码演示了另一种启动 `for`\
  \ 循环的方法：\n\n```cpp\nfor (double x = pow(y, 3.0); x > 2.0; x = sqrt(x))\n\tcout <<\
  \ \"x is now equal to \" << x << endl;\n```\n\n### 使用哪种循环\n\n在设计循环时，选择使用哪种 C++ 循环语句最好推迟到设计过程的最后阶段。首先使用伪代码设计循环，然后将伪代码翻译成\
  \ C++ 代码。到那个时候，很容易决定使用哪种类型的 C++ 循环语句。\n\n如果循环涉及使用一个每次循环变化量相等的变量进行数值计算，请使用 `for`\
  \ 循环。事实上，当你有一个用于数值计算的循环时，都应该考虑使用 `for` 循环。它并不总是合适的，但对于数值计算，它通常是最清晰、最易于使用的循环。\n\n\
  在大多数其他情况下，你应该使用 `while` 循环或 `do-while` 循环；决定使用这两种中的哪一个相当容易。如果你坚持循环体至少执行一次，可以使用 `do-while`\
  \ 循环。如果在某些情况下循环体完全不应该执行，那么你必须使用 `while` 循环。需要 `while` 循环的一个常见情况是在可能完全没有数据时读取输入。例如，如果程序读取一个成绩列表，可能会存在学生没有参加考试的情况，因此输入循环可能会遇到空列表。这需要一个\
  \ `while` 循环。\n\n### 自测练习\n\n25. 以下代码的输出是什么（当嵌入完整程序中时）？\n\n```cpp\nfor (int count\
  \ = 1; count < 5; count++)\n\tcout << (2 * count) << \" \";\n```\n\n26. 以下代码的输出是什么（当嵌入完整程序中时）？\n\
  \n```cpp\nfor (int n = 10; n > 0; n = n - 2)\n{\n\tcout << \"Hello \";\n\tcout <<\
  \ n << endl;\n}\n```\n\n27. 以下代码的输出是什么（当嵌入完整程序中时）？\n\n```cpp\nfor (double sample\
  \ = 2; sample > 0; sample = sample − 0.5)\n\tcout << sample << \" \";\n```\n\n28.\
  \ 对于以下每个情况，说明哪种循环类型（`while`、`do-while` 或 `for`）效果最好：\n\n    1.  求级数，例如 `1/2 + 1/3\
  \ + 1/4 + 1/5 + … + 1/10`。\n    2.  读取一个学生的成绩列表。\n    3.  读取一个部门员工请病假的天数。\n    4.\
  \  测试一个函数以查看它对不同参数值的性能如何。\n\n29. 将以下循环重写为 `for` 循环。\n\n    1.  ```cpp\n        int\
  \ i = 1;\n\t\t while (i <= 10)\n\t\t{\n\t\t\tif (i < 5 && i != 2)\n\t\t\t cout <<\
  \ 'X';\n\t\t\ti++;\n\t\t}\n    ```\n\n    2.  ```cpp\n        int i = 1;\n     \
  \    while (i <= 10)\n\t\t{\n\t\t\tcout << 'X';\n\t\t\ti = i + 3;\n\t\t}\n    ```\n\
  \n    3.  ```cpp\n        long m = 100;\n         do {\n\t\t\tcout << 'X';\n\t\t\
  \tm = m + 100;\n\t\t}\n\t\twhile (m < 1000);\n    ```\n\n30. 此循环的输出是什么？识别 `n` 的值与变量\
  \ `log` 的值之间的联系。\n\n```cpp\nint n = 1024;\n int log = 0;\n for (int i = 1; i < n;\
  \ i = i * 2)\n\tlog++;\ncout << n << \" \" << log << endl;\n```\n\n31. 此循环的输出是什么？对代码进行注释。\n\
  \n```cpp\nint n = 1024;\n int log = 0;\n for (int i = 1; i < n; i = i * 2);\n\t\
  log++;\n```\n\n32. 此循环的输出是什么？对代码进行注释。\n\n```cpp\nint n = 1024;\n int log = 0;\n\
  \ for (int i = 1; i < n; i = i * 2);\n\tlog++;\n```\n\n# `break` 语句\n\n你已经使用过 `break`\
  \ 语句。有时 `break` 语句可以用于退出。\n\n### 3.4 设计循环\n\n在设计循环时，你需要设计三件事：\n\n1.  循环体\n2.  初始化语句\n\
  3.  循环结束的条件\n\n我们从两个常见任务的章节开始，并展示如何为每项任务设计这三者。\n\n# 用于和和积的循环\n\n许多常见任务涉及读取一个数字列表并计算它们的和。如果你知道会有多少个数字，这样的任务可以通过以下伪代码轻松完成。变量\
  \ `this_many` 的值是要相加的数字个数。和累加在变量 `sum` 中。\n\n```\nsum = 0;\nrepeat the following\
  \ this_many times:\n\tcin >> next;\n\tsum = sum + next;\nend of loop.\n```\n\n该伪代码很容易实现为以下\
  \ `for` 循环：\n\n```cpp\nint sum = 0;\n   for (int count = 1; count <= this_many;\
  \ count++)\n{\n\tcin >> next;\n\tsum = sum + next;\n}\n```\n\n注意变量 `sum` 在执行以下循环体语句时预计有一个值：\n\
  \n```cpp\nsum = sum + next;\n```\n\n由于 `sum` 在第一次执行此语句时必须有一个值，因此在执行循环之前必须对 `sum`\
  \ 初始化为某个值。为了确定 `sum` 的正确初始化值，请思考你希望在一次迭代后发生什么。在添加第一个数字后，`sum` 的值应该是该数字。也就是说，第一次通过循环时，`sum\
  \ + next` 的值应该等于 `next`。为了实现这一点，`sum` 的值必须初始化为 `0`。\n\n你可以用类似于我们形成数字列表和的方法来形成数字列表的**积**。该技术由以下代码所示：\n\
  \n\n\n\n\n```\nint product = 1;\n for (int count = 1; count <= thisMany; count++)\n\
  {\n\tcin >> next;\n\tproduct = product * next;\n}\n```\n\n变量 `product` 必须赋予一个初始值。不要假设所有变量都应该初始化为零。如果将\
  \ `product` 初始化为 `0`，那么在上述循环结束后，它仍然是 `0`。正如之前所示的 C++ 代码所示，`product` 的正确初始化值是 `1`。为了看出\
  \ `1` 是正确的初始值，请注意在循环第一次执行时，它将使 `product` 等于读取的第一个数字，这正是你想要的。\n\n### 结束循环\n\n终止“输入循环”（input\
  \ loop）有四常用的方法。我们将按照顺序讨论它们。\n\n1. 以大小开头的列表\n2. 迭代前询问\n3. 以哨兵值结束的列表\n4. 输入耗尽\n\n\
  如果你的程序可以预先确定输入列表的大小（通过询问用户或通过其他方法），你可以使用“重复 *n* 次”的循环来精确地读取 *n* 次输入，其中 *n* 是列表的大小。这种方法被称为“以大小开头的列表”（list\
  \ headed by size）。\n\n结束输入循环的第二方法是在每次循环迭代后，询问用户是否应该再次迭代。例如：\n\n```\nsum = 0;\ncout\
  \ << \"Are there any numbers in the list? (Type\\n\"\n\t << \"Y and Return for Yes,\
  \ N and Return for No): \";\n char ans;\ncin >> ans;\n while ((ans == 'Y') || (ans\
  \ == 'y'))\n{\n\tcout << \"Enter number: \";\n\tcin >> number;\n\tsum = sum + number;\n\
  \tcout << \"Are there any more numbers? (Type\\n\"\n\t\t << \"Y for Yes, N for No.\
  \ End with Return.): \";\n\tcin >> ans;\n}\n```\n\n然而，对于读取长列表来说，这对用户来说是非常累的。想象一下这样输入一个包含\
  \ 100 个数字的列表。用户可能会从高兴转变为讽刺，然后变得愤怒和沮丧。在读取长列表时，最好只包含一个停止信号，这就是我们下一个讨论的方法。\n\n结束从键盘读取值列表的循环，最好的方法可能是使用“哨兵值”（sentinel\
  \ value）。“哨兵值”是与读取的列表中所有可能的值都不同的值，因此它可以被用于指示列表的结束。例如，如果循环读取一个正数列表，则可以使用负数作为哨兵值来指示列表的结束。可以使用如下循环来添加非负数列表：\n\
  \n```\ncout << \"Enter a list of nonnegative integers.\\n\"\n\t << \"Place a negative\
  \ integer after the list.\\n\";\nsum = 0;\ncin >> number;\n while (number >= 0)\n\
  {\n\tsum = sum + number;\n\tcin >> number;\n}\n```\n\n注意，列表中的最后一个数字被读取了但没有加到 `sum`\
  \ 中。要添加数字 `1`、`2` 和 `3`，用户在列表末尾追加一个负数，如下：\n\n```\n1 2 3 −1\n```\n\n最后的 `−1` 被读取但没有加到总和中。\n\
  \n要这样使用哨兵值，你必须确定该数据类型中至少有一个值绝对不会出现在输入值列表中，因此可以作为哨兵值。如果列表由可能可能是任何值的整数组成，那么就没有剩余的值可以作为哨兵值。在这种情况下，你必须使用其他方法来结束循环。\n\
  \n从文件读取输入时，可以使用哨兵值，但更常用的方法是简单地检查文件中所有输入是否已读取，并在没有更多输入可读时结束循环。这种结束输入循环的方法在第 6 章中编程技巧部分的“检查文件末尾”章节，以及名为`“eof\
  \ 成员函数”`的部分中讨论过。\n\n我们提供的结束输入循环的技术都是更通用技术的特例，这些更通用的技术可以结束任何类型的循环。更通用的技术如下：\n\n*\
  \ 计数控制循环\n* 迭代前询问\n* 根据标志条件退出\n\n“计数控制循环”（count-controlled loop）是任何在循环开始前确定迭代次数，然后按次数执行循环体的循环。我们讨论的输入循环的“以大小开头的列表”技术就是计数控制循环的一个示例。我们所有的“重复许多次”循环都是计数控制循环。\n\
  \n我们已经讨论过“迭代前询问”（ask-before-iterating）技术。你可以将其用于输入循环以外的循环，但该技术最常用的用途是处理输入。\n\n在本节之前，我们讨论了在读取哨兵值时结束的输入循环。在我们的示例中，程序将非负整数读取到一个名为\
  \ `number` 的变量中。当 `number` 接收到负值时，表示输入结束；这是“根据标志条件退出”（exit on a flag condition）的一个示例。“标志”就是“哨兵值”。通过“输入耗尽”结束输入循环是另一个示例。\n\
  \n\n\n\n\n显示 3.15 中的程序旨在帮助追踪绿颈秃（一种濒危物种）的繁殖率。在该类秃类生存的地区，保护人员每年会对绿颈秃巢中的蛋数量进行计数。显示\
  \ 3.15 中的程序会读取该地区每位保护人员的报告，并计算他们观察到的所有巢中蛋的总数。\n\n![](img/p160-1.png) ![插图显示了“显式嵌套循环”的代码段](img/p161-1.png)\n\
  \n# 显示 3.15 显式嵌套循环\n\n图 3.15 完整替代文本\n\n每份保护人员的报告由一个数字列表组成。每个数字代表观察到的绿颈秃巢中蛋的数量。程序读取一位保护人员的报告，并计算该保护人员发现的蛋的总数。每位保护人员的数字列表末尾都添加了一个负数，这用作哨兵值。程序遍历报告数量，并计算每份报告发现的蛋的总数。\n\
  \n循环体可以包含任何种的语句，因此可能出现嵌套循环（就像蛋嵌套在巢中一样）。显示 3.15 中的程序包含一个嵌套在另一个循环中的循环。显示 3.15 中的嵌套循环为\
  \ `count` 从 `1` 到 `numberOf Reports` 的每一个值执行一次。对于外层 `for` 循环的每一次此类迭代，内部 `while`\
  \ 循环都会完整执行一次。在第 4 章中，我们将使用子程序来使显示 3.15 中的程序更具读性。\n\n### 自测练习\n\n36. 编写一个循环，在嵌入完整程序时，向屏幕打印十次\
  \ `Hello` 单词。\n\n37. 编写一个循环，读取一个偶数列表（例如 `2`、`24`、`8`、`6`）并计算列表中数字的和。列表以哨兵值结束。除其他外，你必须决定使用什么作为哨兵值。\n\
  \n38. 预测以下嵌套循环的输出：\n\n```cpp\nint n, m;\n for (n = 1; n <= 10; n++)\n\t   for (m\
  \ = 10; m >= 1; m −−)\n\t\tcout << n << \" times \" << m\n\t\t\t << \" = \" << n\
  \ * m << endl;\n```\n\n### 调试循环\n\n无论程序设计得多么仔细，错误有时仍然会发生。在循环方面，程序员经常犯的错误具有某种模式。大多数循环错误涉及循环的第一次或最后一次迭代。如果你发现循环运行结果不符合预期，请检查循环的次数是否多了一次或少了一次。次数多一次或少一次的循环被称为\
  \ `off-by-one error`（差一错误）；这些错误是最常见的循环 bug 之一。确保你没有混淆“小于”和“小于等于”。确保你已正确初始化循环。记住，循环有时需要迭代零次，并检查你的循环是否正确处理了这种可能性。\n\
  \n无限循环通常由于控制循环停止的布尔表达式出现错误。检查你是否没有反转不等式，将“小于”误认为“大于”。另一个常见的无限循环来源是使用相等性测试来终止循环。\n\
  \n*每当你修改程序时，都应该重新测试程序*。永远不要假设你的修改会让程序变得正确。仅仅你发现了一个需要修正的地方，并不意味着你已经发现了所有需要修正的地方。此外，正如示例所示，当你修改程序的某部分以使其变正确时，该更改可能要求你修改程序的其他部分。\n\
  \n\n\n\n我们开发的这些技术将帮助你发现那些可能出现在设计良好的程序中的 Bug。然而，无论如何调试，都无法将一个设计糟糕的程序转换为一个可靠且易读的程序。如果一个程序或算法非常难以理解或性能非常糟糕，不要尝试修复它。相反，请将其丢弃并从头开始。这将产生一个更易读且不太可能包含隐藏错误的程序。可能不那么明显的是，通过丢弃设计糟糕的代码并重新开始，你会比尝试修复旧代码更快得出一个可工作的程序。丢弃你辛辛苦编写的所有代码似乎是在浪费精力，但这是进行下去最有效的方法。投入到废弃代码中的工作并没有白费。你通过编写它学到的教训将帮助你比毫无经验开始更快地设计出更好的程序。坏代码本身可能完全没有帮助。\n\
  \n### 自测练习\n\n39. 追踪变量（trace a variable）意味着什么？你如何追踪一个变量？\n\n40. 什么是差一循环错误（off-by-one\
  \ loop error）？\n\n41. 你有一段长 100 米的围栏。围栏柱每隔 10 英尺放置一个。你需要多少根围栏柱？为什么这个问题出现在编程书中并不像看起来那么愚蠢？这个问题涉及了程序员面临的哪种问题？\n\
  \n### 章节总结\n\n- 布尔表达式的评估方式与算术表达式的评估方式类似。\n- 大多数现代编译器都有一个 `bool` 类型，其值为 `true` 和\
  \ `false`。\n- 你可以编写一个函数，使其返回 `true` 或 `false` 值。对此类函数的调用可以作为布尔表达式用于 `if-else` 语句或任何其他允许布尔表达式的地方。\n\
  - 解决任务或子任务的一种方法是写下每个条件下需要采取的条件相应的动作。这在 C++ 中可以实现为多分支 `if-else` 语句。\n- `switch` 语句是实现程序用户菜单的好方法。\n\
  - 块（block）是一个包含变量声明的复合语句。在块中声明的变量是局部的。除了其他用途，块还可以用于多分支语句中某个分支的动作，例如多分支 `if-else`\
  \ 语句。\n- `for` 循环可以用于实现相当于“重复循环体 `n` 次”的指令。\n- 终止输入循环有四种常用方法：由大小引导的列表、迭代前询问、以哨兵值结束的列表以及输入耗尽。\n\
  - 通常最好的做法是在伪代码中设计循环，而不指定具体的 C++ 循环机制选择。一旦算法设计完成，选择使用哪种 C++ 循环语句通常是显而易见的。\n- 简化对嵌套循环推理的一种方法是将循环体转变为一个函数调用。\n\
  - 始终检查循环，确保循环中使用的变量在循环开始之前已正确初始化。\n- 始终检查循环，确保它们的迭代次数没有多一次或少了一次。\n- 在调试循环时，追踪循环体中的关键变量会有帮助。\n\
  - 如果一个程序或算法非常难以理解或性能非常糟糕，不要尝试修复它。相反，请将其丢弃并从头开始。\n\n### 自测练习答案\n\n1. `true`。\n2.\
  \ `true`。注意表达式 (a) 和 (b) 含义相同。因为运算符 `==` 和 `<` 的优先级高于 `&&`，所以你不需要括号。然而，括号会让阅读变得更容易。大多数人发现表达式\
  \ (a) 比表达式 (b) 更易读，尽管它们的含义相同。\n3. `true`。\n4. `true`。\n5. `false`。由于第一个表达式 `count\
  \ == 1` 的值为 `false`，你知道整个表达式为 `false`，而不需要评估第二个表达式。因此 `x` 和 `y` 的值无所谓。这被称为短路求值，是\
  \ C++ 的做法。\n6. `true`。由于第一个表达式 `count < 10` 的值为 `true`，你知道整个表达式为 `true`，而不需要评估第二个表达式。因此\
  \ `x` 和 `y` 的值无所谓。这被称为短路求值，是 C++ 的做法。\n7. `false`。注意 (g) 中的表达式包含了 (f) 中的表达式作为子表达式。该子表达式使用了如\
  \ (f) 所述的短路求值进行评估。(g) 中的整个表达式等价于：\n```\n!(true || (x < y)) && true\n```\n这等价于 `!(true\
  \ && true)`，再等价于 `!true`，即最终值 `false`。\n8. 该表达式在评估时会产生错误，因为第一个表达式 `((limit/count)\
  \ > 7)` 涉及除以零。\n9. `true`。由于第一个表达式 `(limit < 20)` 的值为 `true`，你知道整个表达式为 `true`，而不需要评估第二个表达式。因此第二个表达式\n\
  ```\n((limit/count) > 7)\n```\n从未被评估，因此计算机没有察觉到它涉及除以零。这是短路求值，是 C++ 的做法。\n10. 该表达式在评估时会产生错误，因为第一个表达式\
  \ `((limit/count) > 7)` 涉及除以零。\n11. `false`。由于第一个表达式 `(limit < 0)` 的值为 `false`，你知道整个表达式为\
  \ `false`，而不需要评估第二个表达式。因此第二个子表达式\n```\n((limit/count) > 7)\n```\n从未被评估，因此计算机没有察觉到它涉及除以零。这是短路求值，是\
  \ C++ 的做法。\n12. 如果你认为这个表达式毫无意义，你是正确的。这个表达式没有直观的意义，但 C++ 将 `int` 值转换为 `bool` 值，然后评估\
  \ `&&` 和 `!` 操作。因此 C++ 将评估这段乱码。记住在 C++ 中，任何非零整数转换为 `true`，`0` 转换为 `false`。C++ 将如下评估：\n\
  ```\n(5 && 7) + (!6)\n```\n在表达式 `(5 && 7)` 中，`5` 和 `7` 转换为 `true`。`true && true`\
  \ 评估为 `true`，C++ 将其转换为 `1`。在 `(!6)` 中，`6` 被转换为 `true`，所以 `!true` 评估为 `false`，C++\
  \ 将其转换为 `0`。整个表达式评估结果为 `1 + 0`，即 `1`。最终值因此为 `1`。C++ 将数字 `1` 转换为 `true`，但答案作为 `true`\
  \ 并没有什么直观的意义；直接说答案是 `1` 更好。\n\n> 你不需要精通评估这些毫无意义的表达式，但这样做有助于你理解为什么当你犯在表达式中错误混合数值和布尔运算符的错误时，编译器不会给你给出错误信息。\n\
