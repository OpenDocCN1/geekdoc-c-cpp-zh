  \ is mischievous.\n\n# 17 模板\n本章介绍了 C++ 模板。模板允许你定义带有参数的函数和类，这将允许你设计比之前更通用的函数和类。\n\
  \n### 先决条件\n\n第 17.1 节使用了从第 2 章到第 5 章的材料，以及第 7 章的第 7.1 节、第 7.2 节和第 7.3 节的第 7 章的材料。它没有使用任何关于类的材料。第\
  \ 17.2 节使用了从[第 2 章]到[第 7 章]的材料。\n\n# 17.1 用于算法抽象的模板\n\n\n\n\n\n我们之前的许多 C++ 函数定义其底层算法比我们在函数定义中给出的算法要通用得多。例如，考虑\
  \ `swapValues` 函数，我们首先在第 5 章中讨论过它。为了参考，我们现在重复该函数的定义：\n\n```cpp\nvoid swapValues(int&\
  \ variable1, int& variable2)\n{\n    int temp;\n    temp = variable1;\n    variable1\
  \ = variable2;\n    variable2 = temp;\n}\n```\n\n注意，`swapValues` 函数仅适用于`int`类型的变量。然而，函数体中提供的算法同样可以用于交换两个`char`\
  \ 类型变量的值。如果我们想对`char` 类型的变量也使用 `swapValues` 函数，可以通过添加以下定义来对该函数名进行重载：\n\n```cpp\n\
  void swapValues(char& variable1, char& variable2)\n{\n    char temp;\n    temp =\
  \ variable1;\n    variable1 = variable2;\n    variable2 = temp;\n}\n```\n\n但这两个\
  \ `swapValues` 函数的定义存在一些效率低下且令人不满意的地方：它们几乎是完全相同的。唯一的区别是一个定义在三个地方使用了`int` 类型，而另一个定义在相同的三个地方使用了`char`\
  \ 类型。如果继续这样做，如果我们想让函数 `swapValues` 适用于对`double` 类型的变量对，我们就必须编写第三个几乎完全相同的函数定义。如果我们想将\
  \ `swapValues` 应用到更多类型，那么几乎完全相同的函数定义数量将会更多。这将需要大量的打字工作，并用许多看起来相同的定义使我们的代码变得杂乱。我们应该认为，以下函数定义适用于任何类型的变量：\n\
  \n```cpp\nvoid swapValues(Type_Of_The_Variables& variable1,\n                Type_Of_The_Variables&\
  \ variable2)\n{\n    Type_Of_The_Variables temp;\n    temp = variable1;\n    variable1\
  \ = variable2;\n    variable2 = temp;\n}\n```\n\n正如我们将看到的，这种操作是可能的。我们可以定义一个适用于所有类型变量的函数，尽管其语法与我们上面展示的有所不同。该语法将在下一个节中描述。\n\
  \n# 函数模板\n\n显示 17.1 显示了用于 `swapValues` 函数的 C++ 模板。此函数模板允许你交换任何两个类型变量的值，只要这两个变量类型相同即可。定义和函数声明以以下行开头：\n\
  \n```cpp\ntemplate<class T>\n```\n\n这通常被称为`template prefix`（模板前），它告诉编译器随后的定义或函数声明是一个`template`，而\
  \ `T` 是一个`type parameter`。在这种语境下，`class` 一词实际上意味着`type`。^(24 正如我们将看到的，类型参数 `T` 可以被任何类型替换，无论该类型是否为类。在函数定义的体内部，类型参数\
  \ `T` 的用法就像任何其他类型一样。\n\n```cpp\n 1    //演示函数模板的程序。  2    #include <iostream>\n 3\
  \    using namespace std;\n 4    //交换 variable1 和 variable2 的值。\n 5    template<class\
  \ T>\n 6    void swapValues(T& variable1, T& variable2)\n 7    {\n 8          T\
  \ temp;\n 9           \n10          temp = variable1;\n 11          variable1 =\
  \ variable2;\n 12          variable2 = temp;\n 13    }\n 14    int main( )\n15 \
  \   {\n 16        int integer1 = 1, integer2 = 2;\n 17        cout << \"Original\
  \ integer values are \"\n 18             << integer1 << \" \" << integer2 <<endl;\n\
  \ 19        swapValues(integer1, integer2);\n 20        cout << \"Swapped integer\
  \ values are \"\n 21             << integer1 << \" \" << integer2 <<endl;\n 22 \
  \       char symbol1 = 'A', symbol2 = 'B';\n 23        cout << \"Original character\
  \ values are \"\n 24             << symbol1 << \" \" << symbol2 <<endl;\n 25   \
  \     swapValues(symbol1, symbol2);\n 26        cout << \"Swapped character values\
  \ are \"\n 27             << symbol1 << \" \" << symbol2 <<endl;\n 28        return\
  \ 0;\n 29    }\n```\n\n***输出***\n\n```\nOriginal integer values are 1 2\nSwapped\
  \ integer values are 2 1\nOriginal character values are A B\nSwapped character values\
  \ are B A\n```\n\n# 显示 17.1 函数模板\n\n函数模板定义本质上是一个巨大的函数定义集合。对于显示 17.1 中所示 `swapValues`\
  \ 函数模板，实际上对于每种可能类型都有一个函数定义。这些定义都是通过将类型参数 `T` 替换为类型名称得到的。例如，后续的函数定义是将 `T` 替换为 `double`\
  \ 得到的：\n\n```cpp\nvoid swapValues(double& variable1, double& variable2)\n{\n   \
  \ double temp;\n    temp = variable1;\n    variable1 = variable2;\n    variable2\
  \ = temp;\n}\n```\n\n另一个 `swapValues` 定义是通过将类型参数 `T` 替换为 `int` 得到的。还有另一个定义是通过将类型参数\
  \ `T` 替换为 `char` 得到的。显示 17.1 中所示的函数模板重载了函数名 `swapValues`，使得每种可能的类型都有对应的函数定义。\n\n\
  编译器并不会为所有类型生成定义，但它的行为就像是生成了所有定义一样。对于你使用的每种不同类型都会产生单独的定义，但对于未使用的类型则不会。对于同一种类型，无论你使用多少次，只会生成一个定义。\n\
  \n注意，在显示 17.1 中 `swapValues` 被调用了两次：一次参数是 `int` 类型，另一次是 `char` 类型。\n\n考虑显示 17.1\
  \ 中的中的以下函数调用：\n\n```cpp\nswapValues(integer1, integer2);\n```\n\n当 C++ 编译器处理到此函数调用时，它注意到参数的类型——在本例中为\
  \ `int`——然后它使用模板生成一个将类型参数 `T` 替换为类型名称 `int` 的函数定义。同样，当编译器看到函数调用\n\n```cpp\nswapValues(symbol1,\
  \ symbol2);\n```\n\n它注意到参数的类型——在本例中为 `char`——然后使用模板生成一个将类型参数 `T` 替换为类型名称 `char`\
  \ 的函数定义。\n\n注意，当你调用使用函数模板定义的函数时，不需要进行任何特殊操作；像调用其他函数一样调用它即可。编译器会完成从函数模板生成函数定义的所有工作。\n\
  \n\n\n\n\n注意，在显示 17.1 中，我们将函数模板定义放在了程序的 `main` 部分之前，并且没有使用任何模板函数声明。函数模板可以有函数声明，就像普通函数一样。你可能（也可能）能够将函数模板的函数声明和定义放置在与普通函数函数声明和定义相同的位置。然而，某些编译器不支持模板函数声明，也不支持模板函数的单独编译。当编译器支持这些功能时，其细节可能会变得非常复杂，并且在不同的编译器之间有所不同。你最稳妥的策略是不使用模板函数声明，并确保函数模板定义出现在它使用的同一个文件中，并且出现在函数模板被使用之前。\n\
  \n我们提到过，函数模板定义应该出现在使用该模板函数的同一个文件中（即与调用该模板函数位于同一个文件中）。然而，函数模板定义可以通过 `#include` 指令出现。你可以在一个文件中给出函数模板定义，然后在使用该模板函数的文件中\
  \ `#include` 该文件。这是最整洁且安全的通用策略。然而，即使是这种策略在某些编译器上可能无法运行。如果不起作用，请咨询当地专家。\n\n虽然我们将在代码中不模板函数声明，但为了方便编译器支持使用这些函数声明的读者，我们将描述它们并给出示例。\n\
  \n在显示 17.1 中的函数模板中，我们使用字母 `T` 作为类型的参数，这是 C++ 语言的传统做法但并非强制。类型参数可以是任何标识符，`T` 是一个很好的类型名称，但有时其他名称更好。例如，`swapValues`\
  \ 函数在显示 17.1 中给出的模板如下：\n\n```\ntemplate<class VariableType>\nvoid swapValues(VariableType&\
  \ variable1, VariableType& variable2)\n{\n    VariableType temp;\n    variable1\
  \ = variable2;\n    variable2 = temp;\n}\n```\n\n函数模板可以是多个类型参数。例如，具有两个参数 `T1` 和\
  \ `T2` 的模板如下：\n\n大多数函数模板只需要一个类型。不能有未使用的参数；每个类型参数都必须在模板中使用。\n\n# 练习题\n\n1. 编写一个名为\
  \ `maximum` 的函数模板，它接受两个相同类型的值，并返回其中较大的一个（如果相等则返回任意一个）。给出该模板的声明和定义。\n2. 我们使用了三种绝对值函数：`abs`、`labs`\
  \ 和 `fabs`。这些函数在类型上有所不同。请为支持 `<` 运算符的类型编写一个 `absolute` 模板。\n3. 在模板中，`T` 必须是什么 kind\
  \ 的？\n    1. `T` 必须是类。\n    2. `T` 不能是类。\n    3. `T` 必须是 C++ 内置类型。\n    4. `T` 可以是程序员定义的任何类型。\n\
  \n# 编程示例：通用函数\n\n在显示 17.1 中，我们给出了一个 `int` 类型值的排序算法。该算法在 C++ 中实现如下：\n\n```\nvoid\
  \ sort(int a[], int numberUsed)\n{     \n    int indexOfSmallest;\n    for (int\
  \ index = 0; index < numberUsed - 1; index++)\n    {\n        indexOfSmallest =\
  \ indexOfSmallest(a, index, numberUsed);\n        swapValues(a[index], a[indexOfSmallest]);\n\
  \    }\n}\n```\n\n如果你研究 `sort` 函数的定义，你会发现数组的基类型没有以任何重要的方式使用。如果我们把函数头中的数组基类型替换为 `double`，我们将得到一个适用于\
  \ `double` 值的排序函数。当然，我们必须调整辅助函数以便它们适用于 `double` 数组。因此，让我们考虑 `sort` 函数内部调用的辅助函数。这两个辅助函数是\
  \ `swapValues` 和 `indexOfSmallest`。\n\n我们已经看到 `swapValues` 可以适用于任何类型，只要我们将其定义为函数模板（如所示）。让我们看看\
  \ `indexOfSmallest` 是否依赖于排序数组的基类型。`indexOfSmallest` 的定义重复如下：\n\n```\nint indexOfSmallest(const\
  \ int a[], int startIndex,\n                    int numberUsed)\n{     \n    int\
  \ min = a[startIndex];\n    int indexOfMin = startIndex;     \n    for (int index\
  \ = startIndex + 1;\n         index < numberUsed; index++)\n    {\n        if (a[index]\
  \ < min)\n        {\n            min = a[index];\n            indexOfMin = index;\n\
  \        }\n    }\n    return indexOfMin;\n}\n```\n\n`indexOfSmallest` 函数也没有以任何重要的方式依赖于数组的类型。如果我们把两个高亮的\
  \ `int` 类型替换为 `double` 类型，那么我们就更改了 `indexOfSmallest` 函数，使其适用于基类型为 `double` 的数组。\n\
  \n\n\n\n为了更改函数 `sort` 以能够对基类型为 `double` 的数组进行排序，我们只需要将类型名 `int` 的几个实例替换为类型名 `double`\
  \ 即可。此外，`double` 类型并没有特殊之处。我们可以对许多其他类型进行类似的替换。关于该类型，我们唯一需要知道的是该类型定义了运算符 `<`。这是函数模板的完美用例。如果我们将函数\
  \ `sort` 和 `indexOfSmallest` 中的几个类型名 `int` 实例替换为一个类型参数，那么函数 `sort` 就可以对任何类型的值的数组进行排序，前提是该类型的值可以使用\
  \ `<` 运算符进行比较。在 显示 17.2 中，我们编写了这样一个函数模板。\n\n```\n 1    //这是文件 sortfunc.cpp\n 2 \
  \   template<class T>\n 3    void swapValues(T& variable1, T& variable2)\n     \
  \      <swapValues 的其余定义见显示 17.1.>\n 4     \n 5    template<class BaseType>\n 6\
  \    int indexOfSmallest(const BaseType a[], int startIndex, int numberUsed)\n 7\
  \    {\n 8        BaseType min = a[startIndex];\n 9        int indexOfMin = startIndex;\n\
  10     \n11        for (int index = startIndex + 1; index < numberUsed; index++)\n\
  12            if (a[index] < min)\n13            {\n14                min = a[index];\n\
  15                indexOfMin = index;\n16                //min 是 a[startIndex] 到\
  \ a[index] 之间最小的\n17            }\n18      \n19        return indexOfMin;\n20  \
  \  }\n21     \n22    template<class BaseType>\n23    void sort(BaseType a[], int\
  \ numberUsed)\n24    {\n25    int indexOfNextSmallest;\n26    for (int index = 0;\
  \ index < numberUsed – 1; index++)\n27       {//将正确的值放在 a[index]::\n28         \
  \     indexOfNextSmallest =\n29                    indexOfSmallest(a, index, numberUsed);\n\
  30              swapValues(a[index], a[indexOfNextSmallest]);\n33           //a[0]\
  \ <= a[1] <=…<= a[index] 是原始数组中最小的 32\n           //元素。其余元素位于剩余的位置。\n33       }\n\
  34    }\n```\n\n# 显示 17.2 通用排序函数\n\n注意，显示 17.2 所示的函数模板 `sort` 可以用于非数值类型的数组。在显示 17.3\
  \ 的演示程序中，调用函数模板 `sort` 来对字符数组进行排序。字符可以使用 `<` 运算符进行比较。虽然应用于字符值时的 `<` 运算符的确切含义在不同实现之间可能有所不同，但关于\
  \ `<` 如何对字母排序，某些情况是始终成立的。当应用于两个大写字母时，运算符 `<` 测试第一个字母在字母顺序上是否在第二个字母之前。同样，当应用于两个小写字母时，运算符\
  \ `<` 测试第一个字母在字母顺序上是否在第二个字母之前。当你混合大写和小写字母时，情况就没那么理想了，但显示 17.3 所示的程序只处理大写字母。在那个程序中，通过调用函数模板\
  \ `sort` 对一个大写字母数组按字母顺序排序。（函数模板 `sort` 甚至可以对你定义的类对象的数组进行排序，只要你重载了 `<` 运算符使其适用于该类的对象。）\n\
