  \n\n```\n欢迎来到披萨消费者联盟。\n输入圆形披萨的直径（英寸）：10\n输入圆形披萨的价格：$8.50\n输入矩形披萨的长和宽（英寸）：6 4\n输入矩形披萨的价格：$7.55\n\
  圆形披萨：直径 = 10 英\n价格 = $8.50 每平方英寸 = $0.11\n矩形披萨：长度 = 6 英\n矩形披萨：宽度 = 4 英\n价格 = $7.55\
  \ 每平方英寸 = $0.31\n圆形披萨更划算。\n胃口大开！\n```\n\n# 示例 4.18 重载函数名\n\n# 自动类型转换\n\n假设你的程序中出现了以下函数定义，且你*没有*重载函数名\
  \ `mpg`（因此这是名为 `mpg` 的唯一定义）：\n\n```cpp\ndouble mpg(double miles, double gallons)\n\
  //返回每加仑英里。\n{\n    return (miles/gallons);\n}\n```\n\n如果你使用 `int` 类型的参数调用函数 `mpg`，C++\
  \ 将自动将任何 `int` 类型的参数转换为 `double` 类型的值。因此，以下代码将在屏幕上输出 `22.5 miles per gallon`：\n\n\
  ```cpp\ncout << mpg(45, 2) << \" miles per gallon\";\n```\n\nC++ 将 `45` 转换为 `45.0`，将\
  \ `2` 转换为 `2.0`，然后执行除法 `45.0/2.0` 获取返回值，即 `22.5`。\n\n如果一个函数需要 `double` 类型的参数，而你提供了一个\
  \ `int` 类型的参数，C++ 将自动将 `int` 参数转换为 `double` 类型的值。这种做法非常有用且自然，以至于我们几乎不需要思考。然而，重载可能会干扰这种自动类型转换。让我们来看一个例子。\n\
  \n现在，假设你（愚蠢地）重载了函数名 `mpg`，使得你的程序也包含了以下 `mpg` 的定义（同之前的定义共存在）：\n\n```cpp\nint mpg(int\
  \ goals, int misses)\n //返回完美进球数测量\n // 计算方法为 (goals - misses)。\n {\n     return\
  \ (goals − misses);\n}\n```\n\n在包含这两个 `mpg` 函数名重定义的程序中，以下代码将（遗憾地）输出 `43 miles per\
  \ gallon`（因为 43 是 45 – 2）：\n\n```cpp\ncout << mpg(45, 2) << \" miles per gallon\"\
  ;\n```\n\n当 C++ 看到函数调用 `mpg(45, 2)` 时，该调用有两个 `int` 类型的参数，C++ *首先*会寻找具有两个 `int` 类型形式参数的\
  \ `mpg` 函数定义。如果它找到了这样的函数定义，C++ 就会使用该定义。除非这是它找到匹配函数定义的唯一方法，否则 C++ 不会将 `int` 参数转换为\
  \ `double` 类型的值。\n\n`mpg` 示例说明了关于重载的另一点：你不应该为两个不相关的函数使用相同的函数名。这种对函数名的粗率使用最终一定会导致混乱。\n\
