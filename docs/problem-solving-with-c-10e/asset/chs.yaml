  \n# 关联容器 `set` 和 `map`\n\n`set` 和 `map` 等关联容器存储数据。`set` 不存储重复元素。`set` 按顺序存储元素。添加或删除元素不会影响迭代器，指向被删除元素的迭代器除外。\n\
  \n## set 模板类细节\n\n类型名 `set<T>` 或 `set<T, Ordering>`，用于类型为 `T` 的元素的集合。`Ordering`\
  \ 用于排序元素。如果没有给出 `Ordering`，使用的排序是 `<`。如果没有指定 `Ordering`，则假设。关于 `set` 的某些细节参见 显示\
  \ 18.11。简单的示例展示了如何使用 `set` 的某些成员函数。\n\n### 示例成员函数\n\n| `成员函数 (s 是 Set 对象)` | `含义`\
  \ |\n| --- | --- |\n| `s.insert(Element)` | `在集合中插入 `Element` 的拷贝。如果 `Element` 已经在集合中，则没有影响。`\
  \ |\n| `s.erase(Element)` | `从集合中移除 `Element`。如果 `Element` 不在集合中，则没有影响。` |\n| `s.find(Element)`\
  \ | `返回指向集合中 `Element` 拷贝的可变迭代器。如果 `Element` 不在集合中，则返回 `s.end()`。 |\n| `s.erase(Iterator)`\
  \ | `移除迭代器所在的元素。` |\n| `s.size()` | `返回集合中元素的数量。` |\n| `s.empty()` | `如果集合为空则返回\
  \ `true`；否则返回 `false`。` |\n\n\n\n\n\n| `s1 == s2` | `如果集合包含相同的元素，则返回 `true`；否则返回\
  \ `false`。` |\n| `set 模板类也具有默认构造函数、拷贝构造函数，以及此处未提到的其他特殊构造函数。它还有一个析构函数，用于返回所有存储空间以回收，以及一个良好的赋值运算符。`\
  \ |\n\n# 显示 18.11 `set` 模板类\n\n![插图展示了一个使用“set 模板类”的程序。](img/p988-1.png)\n\n***示例对话***\n\
  \n```\n集合包含：\nA B C D\n移除 C。\nA B D\n```\n\n# 显示 18.12 使用 `set` 模板类的程序\n\n图 18.12\
  \ 完整备用文本\n\n`map` 本质上是一个给出的组有序对的函数。对于对中出现的每个 `first` 值，最多有一个 `second` 值使得对 `(first,\
  \ second)` 存在于 map 中。模板类 `map` 在 STL 中实现了 map 对象。例如，如果你想为每个字符串名称分配一个唯一的数字，可以如下所示声明一个\
  \ `map` 对象：\n\n```\nmap<string, int> numberMap;\n```\n\n对于被称为 `keys`（键）的 `string`\
  \ 值，`numberMap` 对象可以关联一个唯一的 `int` 值。\n\n思考 map 的另一种方式是 `关联数组`。传统的数组从数值索引映射到值。例如，`a[10]\
  \ = 5` 将数字 5 存储在索引 10 处。关联数组允许你使用选择的数据类型定义自己的索引。例如，`numberMap[\"c++\"] = 5` 将将整数\
  \ 5 与字符串 `c++` 关联。为了方便，定义了 `[]` 方括号运算符允许你使用类似数组的表示法访问 map，尽管如果你需要，也可以使用 `insert`\
  \ 或 `find` 方法。\n\n与 `set` 对象一样，`map` 对象按照其键值的排序顺序存储其元素。你可以在角括号 `<>` 中作为第三个参数指定键的排序。如果不指定排序，则将使用默认排序。你可以使用的排序限制与\
  \ `set` 模板类允许的排序限制相同。注意，排序仅针对键值。第二个类型可以是任何类型，且不需要与任何排序有关。与 `set` 对象一样，`map` 对象中存储条目的排序是为了效率考虑量。\n\
  \n从 map 中添加和检索数据最简单的方法是使用 `[]` 运算符。给定 map 对象 `m`，表达式 `m[key]` 将返回与 `key` 关联的数据元素的引用。如果\
  \ map 中不存在 `key` 对应的条目，则将创建一个具有数据元素默认值的新条目。对于数值型数据类型，默认值是 0。对于 `string` 类型的对象，默认值是一个空字符串。\n\
  \n`[]` 运算符可以用于向 map 添加新项或用于替换现有的条目。例如，语句 `m[key] = newData;` 将在 `key` 和 `newData`\
  \ 之间创建一个新的关联。注意，必须确保不会意外创建 map 条目。例如，如果你执行语句 `val = m[key];` 的意图是检索与 `key` 关联的值，但错误地输入了一个\
  \ map 中已不存在的 `key` 值，则会为该 `key` 创建一个具有默认值的新条目并将其赋值给 `val`。\n\n关于 `map` 模板类的一些基本细节在\
  \ 显示 18.13 中。为了理解这些细节，你首先需要了解一些 `pair` 模板类。\n\n# map 模板类细节\n\n类型名 `map<KeyType,\
  \ T>` 或 `map<KeyType, T, Ordering>` 用于将类型为 `KeyType` 的元素关联到类型为 `T` 的元素。\n\n`Ordering`\
  \ 用于按键值对元素进行排序以实现高效存储。如果没有提供 `Ordering`，则使用的排序是二元运算符 `<`。\n\n库头文件：`<map>` 将定义放在\
  \ `std` 命名空间中。\n\n定义类型包括：`key_type` 用于键值的类型，`mapped_type` 用于被映射的值的类型，以及 `size_type`。（因此，定义类型\
  \ `key_type` 只是我们之前所说的 `KeyType`。）\n\n迭代器：`iterator`、`const_iterator`、`reverse_iterator`\
  \ 和 `const_reverse_iterator`。\n\n所有迭代器都是双向的。那些不包含 `const_` 的迭代器既不是常量的也不是变的，而是两者之间。例如，如果\
  \ `p` 是 `iterator` 类型，则你可以更改键值但不是 `T` 类型的值。也许至少最初，将所有迭代器视为常量是最好的。\n\n`begin()`、`end()`、`rbegin()`\
  \ 和 `rend()` 具有预期的行为。添加或删除元素不会影响迭代器，位于被删除元素的迭代器除外。\n\n***示例成员函数***\n\n| 成员函数 (m\
  \ 是 Map 对象) | `含义` |\n| --- | --- |\n| `m.insert(Element)` | `在 map 中插入 `Element`。`Element`\
  \ 类型为 `pair<KeyType, T>`。返回类型为 `pair<iterator, bool>` 的值。如果插入成功，返回的对的第二部分为 true，且迭代器位于插入的元素。`\
  \ |\n| `m.erase(Target_Key)` | `移除键为 `Target_Key` 的元素。` |\n| `m.find(Target_Key)`\
  \ | `返回指向键值为 `Target_Key` 元素的迭代器。如果不存在此类元素，则返回 `m.end()`。` |\n| `m[Target_Key]`\
  \ | `返回与键关联的对象的引用。如果 map 尚未包含对象，则插入一个类型 T 的默认对象。` |\n| `m.size()` | `返回 map 中对的数量。`\
  \ |\n| `m.empty()` | `如果 map 为空则返回 `true`；否则返回 `false`。` |\n| `m1 == m2` | `如果 map\
  \ 包含相同的元素，则返回 `true`；否则返回 `false`。` |\n| `map 模板类也具有默认构造函数、拷贝构造函数，以及此处未提到的特殊构造函数。它还有一个析构函数，用于返回所有存储空间以回收，以及一个良好的赋值运算符。`\
  \ |\n\n# 显示 18.13 `map` 模板类\n\nSTL 模板类 `pair<T1,T2>` 拥有值对，其中第一个元素类型为 `T1`，第二个类型为\
  \ `T2`。如果 `aPair` 是 `pair<T1,T2>` 对象，那么 `aPair.first` 是第一个元素，类型为 `T1`，`aPair.second`\
  \ 是第二个元素，类型为 `T2`。成员变量 `first` 和 `second` 是公共成员变量，所以不需要访问或修改函数。\n\n`pair` 模板的头文件是\
  \ `<utility>`。因此，为了使用 `pair` 模板类，你需要在文件中包含以下内容：\n\n```\n#include <utility>\nusing\
  \ std::pair;\n```\n\n`map` 模板类使用 `pair` 模板类来存储键与数据项之间的关联。例如，给定\n\n```\nmap<string,\
  \ int> numberMap;\n```\n\n我们可以通过 `pair` 对象添加从 `\"c++\"` 到数字 10 的映射：\n\n```\npair<string,\
  \ int> toInsert(\"c++\", 10);\nnumberMap.insert(toInsert);\n```\n\n或者通过 `[]` 运算符：\n\
  \n```\nnumberMap[\"c++\"] = 10;\n```\n\n在任何情况下，当我们使用迭代器访问此对时，`iterator->first` 指向键\
  \ `\"c++\"`，而 `iterator->second` 指向数据值 10。一个展示如何使用 map 模板的一些成员函数的简单示例在 显示 18.14\
  \ 中。\n\n\n\n\n\n```cpp\n 1    //Program to demonstrate use of the map template class.\n\
  \ 2    #include <iostream>\n 3    #include <map>\n 4    #include <string>\n 5  \
  \  using std::cout;\n 6    using std::endl;\n 7    using std::map;\n 8    using\
  \ std::string;\n 9    int main()\n10    {\n11        map<string, string> planets;\n\
  12        planets[\"Mercury\"] = \"Hot planet\";\n13        planets[\"Venus\"] =\
  \ \"Atmosphere of sulfuric acid\";\n14        planets[\"Earth\"] = \"Home\";\n15\
  \        planets[\"Mars\"] = \"The Red Planet\";\n16        planets[\"Jupiter\"\
  ] = \"Largest planet in our solar system\";\n17        planets[\"Saturn\"] = \"\
  Has rings\";\n18        planets[\"Uranus\"] = \"Tilts on its side\";\n19       \
  \ planets[\"Neptune\"] = \"1500 mile-per-hour winds\";\n20        planets[\"Pluto\"\
  ] = \"Dwarf planet\";\n21        cout << \"Entry for Mercury - \" << planets[\"\
  Mercury\"]\n22             << endl << endl;\n23        if (planets.find(\"Mercury\"\
  ) != planets.end())\n24            cout << \"Mercury is in the map.\" << endl;\n\
  25        if (planets.find(\"Ceres\") == planets.end())\n26            cout << \"\
  Ceres is not in the map.\" << endl << endl;\n27        cout << \"Iterating through\
  \ all planets: \" << endl;\n28        map<string, string>::const_iterator iter;\n\
  29        for (iter = planets.begin(); iter != planets.end(); iter++)\n30      \
  \  {\n31            cout << iter->first << \" - \" << iter->second << endl;\n32\
  \        }\n33        return 0;\n34    }\n```\n\n**示例对话**\n\n![一张插图显示了“遍历所有行星”的输出](img/p991-92b.png)18.2-1\
  \ 全备用文本\n\n```\n Jupiter - Largest planet in our solar system\nMars - The Red Planet\n\
  Mercury - Hot planet\nNeptune - 1500 mile-per-hour winds\nPluto - Dwarf planet\n\
  Saturn - Has rings\nUranus - Tilts on its side\nVenus - Atmosphere of sulfuric acid\n\
  ```\n\n# 显示 18.14 使用 `map` 模板类的程序\n\n我们将提到另外两种关联容器，尽管我们不会提供它们的任何细节。模板类 `multiset`\
  \ 和 `multimap` 本质上分别与 `set` 和 `map` 相同，但 `multiset` 允许元素重复而`multimap` 允许每个键值关联多个值。\n\
  \n## 编程提示：在容器上使用初始化、范围 `for` 循环和 `auto`\n\nC++11 引入的几个特性使得处理集合变得更加容易。特别是，你可以使用统一初始化列表格式来初始化你的容器对象，该格式由大括号中的初始数据组成。你还可以使用\
  \ `auto` 和范围 `for` 循环轻松地遍历容器。考虑以下两个初始化的集合对象：\n\n```cpp\nmap<int, string> personIDs\
  \ = {\n                                  {1,\"Walt\"},\n                       \
  \           {2,\"Kenrick\"}\n                              };\nset<string> colors\
  \ = {\"red\",\"green\",\"blue\"};\n```\n\n我们可以使用范围 `for` 循环和 `auto` 便利地遍历每个容器：\n\
  \n```cpp\nfor (auto p : personIDs)\n     cout << p.first << \" \" << p.second <<\
  \ endl;\nfor (auto p : colors)\n     cout << p << \" \";\n```\n\n此代码段的输出是：\n\n```\n\
  1 Walt\n2 Kenrick\nblue green red\n```\n\n# 效率\n\nSTL 的设计将效率视为一个重要的考量因素。事实上，STL\
  \ 的实现力求达到最优效率。例如，`set` 和 `map` 元素是按顺序存储的，因此搜索元素的算法可以更高效。\n\n每个模板类的每个成员函数都有一个保证的最大运行时间。这些最大运行时间使用所谓的大\
  \ O 表示（big-O notation）表示，我们将在第 18.3 节中讨论。（第 18.3 节还为我们讨论过的某些容器成员函数提供了一些保证的运行时间。这些位于标题为“容器访问运行时间”的小节中。）当使用更高级的引用或在本章较后的部分时，你将被某些函数的保证的最大运行时间。\n\
  \n### 自测练习\n\n14. 在执行以下代码后，map `mymap` 中会有多少元素？\n\n```cpp\nmap<int, string> myMap;\n\
  myMap[5] = \"c\";\ncout << myMap << endl;\n```\n\n15. `set` 可以有重复元素吗？\n\n16. 假设\
  \ `s` 类型为 `set<char>`。如果 `'A'` 在 `s` 中，`s.find('A')` 返回什么值？如果 `'A'` 不在 `s` 中，又返回什么值？\n\
  \n# 18.3 泛型算法\n\n> “治愈消耗、贫血和其他所有疾病。”\n\n本节涵盖了 STL 中的一些基本函数模板。我们无法为你提供所有函数的全面描述，但将展示一个足够大的示例，让你对其中的内容有一个良好的感受。\n\
  \n这些模板函数有时被称为泛型算法。*算法*（algorithm）一词的使用是有原因的。回想算法只是执行任务的一组指令。算法可以用任何语言表示，包括 C++。但在使用算法时，程序员们通常在脑海中有一个代码的抽象。它提供了重要的细节，而不是编码的细微细节。\n\
  \n# 运行时间与大 O 表示法\n\n如果你问一个程序员程序运行有多快，你可能会得到像“两秒”这样的答案。然而，程序的速度不能由单一数字来给出。程序在处理较大输入时花费的时间通常比处理较小输入时要长。你会预期一个排序数字的程序排序十个数字花费的时间会比排序一千个数字的时间短。那么，程序员应该如何回答“你的程序有多快？”这个问题？\n\
  \n\n\n\n程序员必须提供一个数值表，显示程序处理不同大小输入所需的时间。例如，该表格可能如下所示图 18.15。这个表格没有给出一个单一的时间，而是针对各种不同的输入大小给出了不同的时间。这个表格是对数学中所谓的“function”（函数）的描述。就像一个（非\
  \ `void`）C++ 函数接受一个参数并返回一个值一样，这个函数也接受一个参数（即输入大小），并返回一个数字（即程序处理该大小输入时所花费的时间）。如果我们把这个函数命名为\
  \ `T`，那么 `T(10)` 是 2 秒，`T(100)` 是 2.1 秒，`T(1000)` 是 10 秒，而 `T(10,000)` 是 2.5 分钟。该表格只是该函数\
  \ `T` 某些值的样本。程序处理任何大小的输入都会花费一定的时间。因此，尽管表中没有显示，但还有 `T(1)`、`T(2)`……以及`T(101)`、`T(102)`\
  \ 等值。对于任何正整数 `N`，`T(N)` 是程序对 `N` 个数字排序所需的时间。函数 `T` 被称为程序的 `running time`（运行时间）。\n\
  \n| `Input Size`（输入大小） | `Running Time`（运行时间） |\n| --- | --- |\n| `10 numbers` |\
  \ `2 seconds` |\n| `100 numbers` | `2.1 seconds` |\n| `1000 numbers` | `10 seconds`\
  \ |\n| `10,000 numbers` | `2.5 minutes` |\n\n# 图 18.15 运行时间函数的一些值\n\n目前，我们一直假设这个排序程序在处理任何包含\
  \ `N` 个数字的列表时花费相同的时间。这未必如此。如果列表已经排序或接近排序，花费的时间可能会少得多。在这种情况下，`T(N)` 被定义为“最困难”列表所花费的时间，即在该\
  \ `N` 个数字的列表上使程序运行最长的时间。这被称为 `worst-case running time`（最坏情况运行时间）。在本章中，当我们给出算法或某些代码的运行时间时，*始终指的是最坏情况运行时间*。\n\
  \n程序或算法花费的时间通常由公式给出，例如 `4*N + 3`、`5*N + 4` 或 `N²`。如果运行时间 `T(N)` 为 `5*N + 5`，那么对于大小为\
  \ `N` 的输入，程序将运行 `5*N + 5` 个时间单位。\n\n以下是用于在包含 `N` 个元素的数组 `a` 中搜索，以确定特定值 `target`\
  \ 是否在数组中的代码：\n\n```\nint i = 0;\nbool found = false;\nwhile (( i < N) && !(found))\n\
  \  if (a[i] == target)\n      found = true;\n  else       i++;\n```\n\n我们想要对计算机执行这段代码所需的时间进行某种估算。我们希望这个估算不依赖于我们使用哪种计算机，这是因为我们不知道将使用哪种计算机，或者因为我们可能会在不同的时间使用几台不同的计算机运行程序。一种可能的方法是计算“steps”（步骤）的数量，但很难决定什么是一个步骤。在这种情况下，通常的做法是计算\
  \ `operations`（操作）的数量。`operations` 一词几乎和 `step` 一样模糊，但在实践中，对于什么算作一次操作至少有一些共识。让我们假设，对于这段\
  \ C++ 代码，以下任何符号的出现都算作一次操作：=`、`<`、`&&`、`!`、`[]`、`==` 和 `++`。计算机在执行这些操作之外还必须做其他事情，但这些似乎是它正在的主要工作，我们将假设它们占据了运行这段代码所需时间的大部分。事实上，我们对时间的分析将假设其他所有事情都不花费任何时间，而程序运行的总时间等于执行这些操作所需的时间。虽然这是一种理想化的假设，显然不完全真实，但事实证明这种简化假设在实践中效果良好，因此在分析程序或算法时经常这样做。\n\
  \n即使有了我们的简化假设，我们仍然必须考虑两种情况：值 `target` 在数组中，或者不在数组中。让我们先考虑 `target` 不在数组中的情况。执行的操作次数取决于搜索的数组元素数量。操作\
  \ `=` 在循环执行之前执行了两次。由于我们假设 `target` 不在数组中，循环将执行 `N` 次，数组中的每个元素执行一次。每次执行循环时，都会执行以下操作：`<`、`&&`、`!`、`[]`、`==`\
  \ 和 `++`。这为 `N` 次循环迭代中的每一次都增加了六个操作符。最后，在 `N` 次迭代之后，布尔表达式再次被检查并发现为假。这又增加了最后三次操作（`<`、`&&`、`!`）。如果我们统计所有操作，就会得到一个总数。尽管我们在表中没有显示这些值，但还有\
  \ `T(1)`、`T(2)`……以及`T(101)`、`T(102)` 等值。对于任何正整数 `N`，`T(N)` 是程序对 `N` 个数字排序所需的时间。函数\
  \ `T` 被称为程序的 `running time`（运行时间）。\n\n（注：此处译歉，原文中存在段落存在重复内容，已根据指令要求完成翻译并保持逻辑。）\n\
  \n\n\n\n数量级估算（例如之前的 `6*N* + 5`）包含一个用于算法（或程序或代码段）解决的任务规模的参数。在我们的示例案例中，该参数 `N` 是要搜索的数组元素数量。不意外的是，搜索较多的数组元素比搜索较少的数组元素花费更长时间。大-*O*\
  \ 运行时间估算始终表示为问题规模的函数。在本章中，我们所有的算法将涉及某些容器中的范围值。在所有情况下，`N` 都将是该范围内元素的数量。\n\n以下是关于大-*O*\
  \ 估算的另一种务实的思考方法：\n\n> **只看最高指数的项，并忽略常数倍数。**\n\n例如，以下所有都是 `O(N²)`：\n\n`N² + 2*N*\
  \ + 1`, `3*N² + 7`, `100*N² + *N*`\n\n以下所有的都是 `O(N³)`：\n\n`N³ + 5*N² + *N* + 1`,\
  \ `8*N³ + 7`, `100*N³ + 4*N* + 1`\n\n大-*O* 运行时间估算确实是粗糙的，但它们包含了一些信息。它们无法区分 `5*N*\
  \ + 5` 的运行时间与 `100*N*` 的运行时间，但它们确实让我们区分某些运行时间，从而确定某些算法比其他算法更快。查看显示 18.16 中的图表；注意所有函数\
  \ `O(N)` 的图最终都会落在函数 `0.5*N²` 的图下方。结果是必然的：只要我们使用足够大的 `N` 值，`O(N)` 算法的运行速度总是比任何 `O(N²)`\
  \ 算法快。尽管对于你处理的问题规模，`O(N²)` 算法可能比 `O(N)` 算法快，但程序员发现，对于大多数直觉上“大”的实际应用，`O(N)` 算法的表现优于\
  \ `O(N²)` 算法。类似的说明也适用于任何其他两种大-*O* 运行时间。\n\n![显示运行时间比较的折线图。](img/fg18_01600.png)\n\
  \n# 显示 18.16 运行时间的比较\n\n图 18.16 完全替代文本\n\n一些术语将有助于我们对通用算法运行时间的描述。**线性运行时间**意味着运行时间为\
  \ `T(N) = aN + b`。线性运行时间始终是 `O(N)` 运行时间。**二次运行时间**意味着最高次项为 `N²` 的运行时间。二次运行时间始终是\
  \ `O(N²)` 运行时间。我们还会在运行时间公式中偶尔遇到对数。对数通常不给出任何基数，因为改变基数只是一个常数倍数。如果你看到 `log N`，请将其视为\
  \ `N` 的以 2 为底的对数，但将其视为 `N` 的以 10 为底的对数也没有错。对数是非常增长缓慢的函数。因此，`O(log N)` 运行时间非常快。有时\
  \ `log[2] N` 写作 `lg N`。\n\n# 容器访问运行时间\n\n现在我们了解了大-*O* 表示法，就可以表示我们在第 18.2 节“容器”中讨论过的某些访问函数的效率。在\
  \ `vector` 末尾插入（`push_back`）、`deque` 头部或尾部插入（`push_back` 和 `push_front`）以及 `list`\
  \ 任何位置插入（`insert`）都是 `O(1)`（即与容器大小无关的运行时间常数上界）。对于 `vector` 或 `deque`，插入或删除任意元素是\
  \ `O(N)`，其中 `N` 是容器中的元素数量。对于 `set` 或 `map`，查找（`find`）是 `O(log N)`，其中 `N` 是容器中的元素数量。\n\
  \n### 自测练习\n\n17. 证明运行时间 `T(N) = aN + b` 是 `O(N)` 运行时间。（*提示*唯一的问题在于 `+ b`。假设 `N`\
  \ 至少为 1。）\n\n18. 证明对于任何两个基数 `a` 和 `b`，如果 `a` 和 `b` 大于 1，则存在常数 `c` 使得 `log_a N ≤\
  \ c*log_b N`。\n\n# 非修改序列算法\n\n本节描述了对容器操作但不对其修改的函数。一个很好的例子是 `find` 函数，它在显示 18.17\
  \ 中与 `vector` 类一起。`find` 函数类似于 `set` 的成员函数，但适用于任何顺序容器。这就是为什么这些函数被称为通用的。如果 `find`\
  \ 函数没有找到它要查找的元素，它会返回第二个迭代器参数，该值不需要等于某个 `end()`。\n\n```\n//演示 find 函数的程序\n#include\
  \ <iostream>\n#include <vector>\n#include <algorithm>\nusing std::cin;\nusing std::cout;\n\
  using std::endl;\nusing std::vector;\nusing std::find;\nint main()\n{\n    vector<char>\
  \ line;\n    cout << \"输入一行文本:\\n\";\n    char next;\n    cin.get(next);\n    while\
  \ (next != '\\n')\n    {\n        line.push_back(next);\n        cin.get(next);\n\
  \    }\n    vector<char>::const_iterator where;\n    where = find(line.begin(),\
  \ line.end(), 'e');\n    //where 指向 line 中第一个 'e' 出现的位置\n    vector<char>::const_iterator\
  \ p;\n    cout << \"在你输入第一个 e 之前输入的是:\\n\";\n    for (p = line.begin(); p != where;\
  \ p++)\n        cout << *p;\n    cout << endl;\n    cout << \"在你之后输入的是:\\n\";\n\
  \    for (p = where; p != line.end(); p++)\n        cout << *p;\n    cout << endl;\n\
  \    cout << \"演示结束。\\n\";\n    return 0;\n}\n```\n\n# 显示 18.17 通用 `find` 函数\n\n\
  ```\n输入一行文本:\nA line of text.\n在你输入第一个 e 之前输入的是:\nA lin\n在你之后输入的是:\ne of text.\n\
  演示结束。\n```\n\n\n\n`find` 能够适用于任何容器类吗？不，并不完全是。首先，它接受迭代器作为参数，而某些容器（如 `stack`）并不具备迭代器。要使用\
  \ `find` 函数，容器必须拥有迭代器，元素必须存储在线性序列中，以便 `++` 运算符能够让迭代器在容器中移动，并且元素必须能够使用 `==` 进行比较。换句话说，容器必须具有前向迭代器（或某种更强类型的迭代器，例如双向迭代器）。\n\
  \n在介绍泛型函数模板时，我们将使用所需迭代器类型的名称作为类型参数名，来描述迭代器类型参数。因此，`ForwardIterator` 应该被替换为某种某种前向迭代器的类型，例如\
  \ `list`、`vector` 或其他容器模板类中的 `iterator` 类型。请记住，双向迭代器也是前向迭代器，而随机访问迭代器也是双向迭代器。因此，类型名\
  \ `ForwardIterator` 可以用于任何双向迭代器或随机访问迭代器类型的迭代器类型，也可以用于普通的前向迭代器类型。在某些情况下，当我们指定 `ForwardIterator`\
  \ 时，你可以使用甚至更简单的迭代器类型；即输入迭代器或输出迭代器，但由于我们还没有讨论输入和输出迭代器，因此我们没有在函数模板声明中提到它们。\n\n请记住，*forward\
  \ iterator*（前向迭代器）、*bidirectional iterator*（双向迭代器）和 *random access iterator*（随机访问迭代器）指的是迭代器的种类，而不是类型名称。实际的类型名称类似于\
  \ `std::vector<int>::iterator`，在这种情况下它恰好是一个随机访问迭代器。\n\n显示 18.18 显示了 STL 中一些非修改泛型示例。显示使用了讨论容器迭代器时常用的表示法。从迭代器\
  \ `first` 移动到但不等于迭代器 `last` 所经过的迭代器位置被称为 `range first, last)`。例如，接下来的 `for` 循环输出了范围\
  \ `[first, last)` 中的所有元素：\n\n```\nfor (iterator p = first; p != last; p++)\n   \
  \ cout << *p << endl;\n```\n\n```\n 1    template<class ForwardIterator, class T>\n\
