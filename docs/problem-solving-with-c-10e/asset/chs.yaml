  # 1 计算机与 C++ 编程简介\n\n> 分析的整个开发和运行现在都可以由机器执行……只要分析机存在，它就不可避免地引导科学的未来方向。\n\n查尔斯·巴贝奇\
  \ (CHARLES BABBAGE，1792–1871)\n\n## 引言\n\n在本章中，我们将描述计算机的基本组件，以及设计和编写程序的基本技术。然后，我们将向你展示一个示例\
  \ C++ 程序，并描述它的工作原理。\n\n## 1.1 计算机系统\n\n计算机遵循的一系列指令称为 `program`（程序）。计算机使用的程序集合被称为该计算机的\
  \ `software`（软件）。构成计算机装置的实际物理机器称为 `hardware`（硬件）。正如我们将看到的，计算机的 `hardware` 在概念上非常非常简单。然而，现在的计算机配备了大量的\
  \ `software` 来辅助编程任务。这些 `software` 包含了各种类型的编辑器、翻译器和管理器。由此产生的环境是一个复杂且强大的系统。在书中，我们几乎完全关注\
  \ `software`，但对 `hardware` 的组织方式进行简要概述将很有帮助。\n\n### 硬件\n\n计算机主要分为三类：`PCs`、`workstations`（工作站）和\
  \ `mainframes`（主机）。`PC`（个人计算机）是一种设计供人一次使用的较小型计算机。大多数家庭计算机都是 `PCs`，但 `PCs` 也广泛用于商业、工业和科学领域。`workstation`\
  \ 本质上是一个更大、更强大的 `PC`。你可以将其认为一台“工业级”的 `PC`。`mainframe` 是一种更大的计算机，通常需要一些支持人员，并且通常由多个用户共享。`PCs`、`workstations`\
  \ 和 `mainframes` 之间的区别并不精确，但这些术语被常用，并能够传达关于计算机的一些非常通用的信息。\n\n`network`（网络）由若干连接的计算机组成，以便它们可以共享资源（如打印机）并共享信息。`network`\
  \ 可能包含若干 `workstations` 和一个或多个 `mainframes`，以及打印机等共享设备。\n\n对于我们学习编程的来说，你是在 `PC`、`mainframe`\
  \ 还是 `workstation` 上工作并不重要。正如我们所看到的，计算机的基本配置对于这三种类型的计算机都是相同的。\n\n大多数计算机系统的 `hardware`\
  \ 组织如图 [Display 1.1] 所示。计算机被认为具有五个主要组件：`input device(s)`（输入设备）、`output device(s)`（输出设备）、`processor`（处理器，也称为\
  \ `CPU`，即中央处理单元）、`main memory`（内存）和 `secondary memory`（外存）。`processor`、`main memory`\
  \ 和 `secondary memory` 通常安置在一个机箱内。`processor` 和 `main memory` 成了计算机的核心，可以被视为集成单元。其他组件连接到\
  \ `main memory` 并在 `processor` 的指导下运行。[Display 1.1] 中的箭头指示了信息流的方向。\n\n![显示计算机主要组件的图示](img/fg01_00100.png)\n\
  \n## 显示 1.1 计算机的主要组件\n\n[图 1.1 完整替代文本]\n\n`input device`（输入设备）是任何允许人向计算机传递信息的设备。你的主要输入设备可能是键盘和鼠标。\n\
  \n`output device`（输出设备）是允许计算机向你传递信息的设备。最常见的输出设备是显示屏，称为 `monitor`（显示器）。通常会有多个输出设备。例如，除了\
  \ `monitor` 之外，你的计算机可能还连接了一台打印机以便在纸上产生输出。键盘和显示器有时被认为是一个名为 `terminal`（终端）的单元。\n\n\
  为了存储输入内容并为计算提供等同草稿纸，计算机提供了 `memory`（内存）。计算机执行的 `program` 也存储在这些内存中。计算机有两种形式的内存，称为\
  \ `main memory` 和 `secondary memory`。正在执行的 `program` 保存在 `main memory` 中，而 `main\
  \ memory` 正如其名，最重要的内存。`Main memory` 由一系列编号的存储位置 `memory locations`（存储单元）组成。`memory\
  \ locations` 的数量因计算机而异，范围从几千到数百万不等，有时甚至达到数十亿。每个 `memory location` 包含一串 0 和 1。这些位置的内容可以改变。因此，你可以将每个\
  \ `memory location` 想象成一块微小的黑板，计算机可以在上面写入和擦除。在大多数计算机中，所有 `memory locations` 包含相同数量的零/一。只能取\
  \ 0 或 1 值的数字称为 `binary digit`（二进制位）或 `bit`（位）。内存的一个八位称为 `byte`（字节），因此我们可以将这些编号的内存位置称为\
  \ `bytes`。标识 `byte` 的数字称为其 `address`（地址）。数据项（如数字或字母）可以存储在这些 `bytes` 中的一个，然后在需要时使用该\
  \ `byte` 的 `address` 来查找该数据项。\n\n如果计算机需要处理无法放入单个 `byte` 的数据项（例如大数字），它将使用多个相邻的字节来持有该数据项。在这种情况下，持有数据项的整个内存仍然被称为\
  \ `memory location`。构成此 `memory location` 的第一个 `byte` 的 `address` 被用作这个较大 `memory\
  \ location` 的地址。[Display 1.2] 显示了一台假设计算机主存的图片。`memory locations` 的大小不是固定的，当在计算机上运行新程序时可能会改变。\n\
  \n![说明存储单元和字节的图示](img/fg01_00200.png)\n\n## 显示 1.2 存储单元和字节\n\n[图 1.2 完整替代文本]\n\n\
  \n\n\n计算机内存中的信息是以 0 和 1 表示的，这一事实在用 `C++`（或大多数其他编程语言）进行编程时并不需要你担心。然而，关于这种对 0 和 1\
  \ 的使用，有一点在我们开始编写程序时就会引起关注。计算机需要将这些 0 和 1 字符串解释为数字、字母、指令或其他类型的信息。计算机根据某些编码方案自动执行这些解释。计算机内存中存储的每种不同类型项目都使用不同的代码：一种代码用于字母，另一种用于整数，另一种用于分数，再另一种用于指令，依此类推。例如，在一组常用的编码中，`01000001`\
  \ 是字母 `A` 的代码，也是数字 `65` 的代码。为了知道特定位置上的字符串 `01000001` 代表什么，计算机必须跟踪该位置当前正在使用的是哪种代码。幸运的是，程序员很少需要担心这些代码，可以安全地假定位置中实际上包含字母、数字或任何想要的内容进行推理。\n\
  \n我们到目前为止讨论的内存是主内存。没有了主内存，计算机什么也做不了。然而，主内存仅在计算机实际执行程序中的指令时才使用。计算机还有另一种形式的内存，称为 `secondary\
  \ memory`（辅助内存）或 `secondary storage`。（在此背景下，`memory` 和 `storage` 是完全同义词）。**Secondary\
  \ memory**是在计算机使用之后（以及之前）用于保存信息永久记录的内存。常用的指代辅助内存的替代术包括 `auxiliary memory`、`auxiliary\
  \ storage`、`external memory` 和 `external storage`。\n\n### 辅助存储\n\n辅助存储中的信息存储在称为\
  \ **files** 的单元中，这些单元可以根据需要任意大或小。例如，一个程序存储在辅助存储的一个文件中，并在程序运行时被复制到主内存中。你可以将程序、字母、库存列表或任何其他单元的信息存储在文件中。\n\
  \n单台计算机可以连接多种不同的辅助内存。最常见的辅助内存形式是 `hard disks`（硬盘）、`diskettes`（软盘）、`CDs`、`DVDs` 和移动式闪存驱动驱动器（**Diskettes**有时也被称为\
  \ `floppy disks`）。计算机上使用的 **CDs**（光盘）与用于录制和播放音乐的 CD 基本相同，而 **DVDs**（数字多功能光盘）与用于播放视频的\
  \ DVD 相同。计算机 CD 和 DVD 可以只读，这样计算机就可以读取但不能更改盘上的数据；计算机 CD 和 DVD 也可以是读写的，计算机可以更改其数据。**Hard\
  \ disks** 是固定在位置上的，通常不会从磁盘驱动器中取出。软盘和 CD 可以轻松从磁盘驱动器中取出并带到另一台计算机。软盘和 CD 具有廉价和便携的优点，但硬盘存储更多数据且运行更快。今天，**Flash\
  \ drives**（优盘）很大程度上取代了软盘，并使用名为闪存的内存存储数据。与主内存不同，闪存不需要电源维持存储在设备上的信息。还有其他形式的辅助内存，但此列表涵盖了你可能遇到的大多数形式。\n\
  \n主内存被称为 **RAM** 或 **random access memory**（随机访问存储器）。它被称为 `random access`是因为计算机可以立即访问任何内存位置中的数据。辅助内存通常需要\
  \ **sequential access**（顺序访问），这意味着计算机必须遍历所有（或至少是许多）内存位置，直到找到它需要的项目。\n\n### 处理器\n\
  \n**processor**（也称为 **central processing unit,** 或 **CPU**）是计算机的“大脑”。当计算机进行广告时，计算机公司会告诉你它包含什么\
  \ `chip`。这个 **chip** 就是处理器。处理器遵循程序中的指令并执行程序指定的计算。然而，处理器是一个非常简单的大脑。它所能做的就是遵循程序员提供的一系列简单指令。典型的处理器指令内容诸如：“将\
  \ 0 和 1 解释为数字，然后将内存位置 37 中的数字与内存位置 59 中的数字相加，并将结果放在位置 43”，或“读取一个输入字母，将其转换为 0 和 1\
  \ 字符串形式的代码，并将其放在内存位置 1298”。处理器可以进行加、减、乘、除，并将内容从一个内存位置移动到另一个。它可以将 0 和 1 字符串解释为字母，并将字母发送到输出设备。处理器还具有重新排列指令顺序的原始能力。处理器指令在不同计算机之间有所不同。现代计算机的处理器可能有数百条可用指令。然而，这些指令通常与我们刚刚描述的那些简单。\n\
  \n## 软件\n\n你通常不直接与计算机交谈，而是通过 `operating system`（操作系统）与它通信。**operating system**将计算机的资源分配给计算机必须完成的不同任务。操作系统实际上是一个程序，但也许将其设为你的首席管家更好。它负责管理你所有其他管家程序，并将你的请求交付给它们。如果你想运行一个程序，你告诉操作系统包含该程序的文件的文件名，操作系统就会运行该程序。如果你想编辑一个文件，你告诉操作系统文件名，它就会启动编辑器。\n\
  \n一个 **program** 是供计算机遵循的一系列指令。如显示 1.3 所示，计算机的输入可以认为由两部分组成：程序和数据。**data** 是我们概念化为程序的输入。例如，如果程序将两个数字相加，那么这两个数字就是数据。换句话说，数据是程序的输入，程序和数据都是计算机的输入（通常通过操作系统）。每当我们给计算机一个要遵循的程序和一些供程序使用的数据时，我们就被说是在数据上**running\
  \ the program**，而计算机被说是在数据上**execute the program**。*data* 这个词还有一个比我们刚刚给出的含义宽泛得多的含义。在最广义的意义上，它指的是计算机可用的任何信息。这个词在狭义和广义意义上都很常用。\n\
  \n\n\n\n有很多种语言用于编写程序。在本文中我们将讨论 `C++` 编程语言并使用它来编写我们的程序。`C++` 是一门高级语言，你可能听过的其他大多数语言也是如此，例如\
  \ `C`、`C#`、`Java`、`Python`、`PHP`、`Pascal`、`Visual Basic`、`FORTRAN`、`COBOL`、`Lisp`、`Scheme`\
  \ 和 `Ada`。高级语言在许多方面与人类语言相似。它们的设计便于人类编写和阅读程序。像 `C++` 这样的高级语言包含的指令比计算机处理器（CPU）能够执行的简单指令复杂得多。\n\
  \n计算机可以理解的语言被称为低级语言。低级语言的具体细节在不同计算机之间有所不同。一条典型的低级指令可能如下：\n\n```\nADD X Y Z\n```\n\
  \n这条指令可能意味着“将名为 `X` 的内存位置中的数字加上名为 `Y` 的内存位置中的数字，并将结果存放在名为 `Z` 的内存位置中。”上面的示例指令是用汇编语言编写的。虽然汇编语言与计算机理解的语言几乎相同，但在计算机理解它之前，它必须经过一次简单的翻译。为了让计算机遵循汇编语言指令，这些单词需要翻译成\
  \ 0 和 1 的字符串。例如，单词 `ADD` 可能翻译为 `0110`，`X` 可能翻译为 `1001`，`Y` 翻译为 `1010`，`Z` 翻译为 `1011`。计算机最终执行的上述指令版本将是：\n\
  \n```\n0110 1001 1010 1011\n```\n\n汇编语言指令及其向 0 和 1 的翻译在不同机器上是不同的。\n\n以 0 和 1 形式编写的程序被称为机器语言，因为这是计算机（机器）实际读取并执行的程序。汇编语言和机器语言几乎是一回事，它们之间的区别对我们来说并不重要。重要的区别是机器语言与如\
  \ `C++` 等高级语言之间的区别：任何高级语言程序在计算机理解并执行它之前，都必须翻译成机器语言。\n\n### 编译器\n\n将 `C++` 等高级语言翻译成机器语言的程序被称为编译器。因此，编译器是一种相当奇特的程序，因为它的输入或数据是另一个程序，而它的输出是另一个程序。为了避免混淆，输入程序通常称为源程序或\
  \ `source code`，编译器产生的翻译版本称为 `object program` 或 `object code`。`code` 一词经常被用来指代程序或程序的一部分，这种用法在提到目标程序时尤为常见。现在，假设你想运行一个你编写的\
  \ `C++` 程序。为了让计算机执行你的 `C++` 指令，请按照以下步骤操作。首先，使用你的 `C++` 程序作为数据运行编译器。请注意，在这种情况下，你的\
  \ `C++` 程序并没有被视为一组指令。对于编译器来说，你的 `C++` 程序仅仅是一段很长的字符字符串。输出将是另一个长字符字符串，它是你 `C++` 程序的机器语言等效物。接下来，在我们通常认为的\
  \ `C++` 程序数据上运行这个机器语言程序。输出将是我们通常理解的 `C++` 程序的输出。如果你有两台计算机，这个基本过程将更容易可视化，如显示 1.4\
  \ 所示。在实际上，整个过程是通过使用一台计算机两次来完成的。\n\n![用于明编译和运行 C++ 程序基本概述的流程图。](img/fg01_00400.png)\n\
  \n# 显示 1.4 编译和运行 C++ 程序（基本概述）\n\n图 1.4 完整备用文本\n\n翻译和运行 `C++` 程序的完整过程比我们在显示 1.4 中显示的要复杂一点。你编写的任何\
  \ `C++` 程序都会使用一些已经为你编写好的操作（例如输入和输出例程）。这些已经为你编写好的项目（如输入和输出例程）已经过编译，并且它们的目标代码等待与你程序的目标代码结合，以生成一个可以在计算机上运行的完整机器语言程序。另一个称为链接器的程序会将这些程序片段的目标代码与编译器从你的\
  \ `C++` 程序中产生的目标代码结合。编译器和链接器之间的相互作用在显示 1.5 所示。在通常情况下，许多系统会自动完成此操作。因此，你可能不需要担心链接。\n\
  \n![用于准备程序以运行的流程图。](img/fg01_00400.png)\n\n# 显示 1.5 准备 C++ 程序\n\n图 1.5 完整备用文本\n\n\
  ### 自测练习\n\n1. 计算机的五个主要组件是什么？\n2. 相加两个数字程序数据是什么？\n3. 为学生分配字母等级程序数据是什么？\n4. 机器语言程序和高级语言程序之间的区别是什么？\n\
  5. 编译器的作用是什么？\n6. 源程序是什么？目标程序是什么？\n7. 什么是操作系统？\n8. 操作系统有什么作用？\n9. 列出你运行程序的计算机上使用的操作系统。\n\
  10. 什么是链接？\n11. 查询你使用的编译器是否会自动进行链接。\n\n## 1.2 编程与解决问题\n\n> 分析机完全没有产生任何东西的能力。它可以执行我们知道如何让它执行的一切。它可以遵循分析；但没有预判任何分析关系或真理的能力。它的领域是协助我们利用已经熟悉的内容。\n\
  > 埃达·奥古斯塔，洛夫莱斯夫人（1815–1852）\n\n在本节中，我们描述了一些可以用于设计和编写程序的通用原则。这些原则不仅适用于 `C++`。无论你使用什么种编程语言，这些原则都适用。\n\
  \n### 算法\n\n在学习第一门编程语言时，很容易产生一种印象，即在计算机上解决问题的困难部分是将你的想法翻译成它的特定语言。这事实如此。在计算机上解决问题的最困难部分是发现解决方案的方法。因此，暂时忽略编程语言，转而专注于制定解决方案的步骤并用通俗英语将其写下来，就像这些指令是给人类而不是计算机的的一样，是很有帮助的。以这种方式表示的指令序列通常被称为*算法*。\n\
  \n\n\n\n一组引导解决方案的精确指令被称为 `algorithm`（算法）。一些近似词包括*recipe*（配方）、*method*（方法）、*directions*（指示）、*procedure*（程序）和*routine*（常规）。指令可以用编程语言或人类语言表示。我们的算法将用英语和\
  \ C++ 编程语言表示。计算机程序仅仅是用计算机可以理解的语言表示的算法。因此，`algorithm` 一词比 `program` 一词更通用。然而，当我们说一组指令是一个算法时，我们通常是指这些指令是用英语表示的，因为如果它们是用编程语言表示的，我们会使用更具体的术语\
  \ `program`。一个例子有助于澄清这一概念。\n\n![艾达·奥古斯塔的肖像以及查尔斯·巴贝奇的照片和他的计算机模型，这是一台带有许多手柄、杠杆和开关的复杂机器。](img/ua01_00100.png)\n\
  \n显示 1.6 包含一个用英语表示的算法。该算法确定特定名称在名称列表中出现的次数。如果列表包含上赛季每场足球比赛的获胜者，且该名称是你喜爱的球队，那么该算法就能确定你的球队赢了多少场比赛。该算法简短简单，但在其他方面与我们将要处理的算法非常典型。\n\
  \n### 确定名称在名称列表中出现次数的算法：\n\n```\n1\\.  获取名称列表。\n2.  获取正在检查的名称。\n3.  将计数器置零。\n4.\
  \  对列表上的每个名称执行以下操作：\n    将上的名称与正在检查的名称进行比较，\n    如果名称相同，则计数器加一。\n5.    宣布答案是计数器所示的数字。\n\
  ```\n\n# 显示 1.6 一个 `algorithm`（算法）\n\n我们示例算法中编号为 1 到 5 的指令旨在按列出的顺序执行。除非另有说明，否则我们始终假设算法指令是按照给出的（写下的）顺序执行的。然而，大多数有趣的算法都会指定某些顺序的改变，通常是某些指令的反复重复，例如我们示例算法中的第\
  \ 4 条指令那样。\n\n`algorithm` 一词有着悠久的历史。它源于 `al-Khowarizmi`，一位 9 世纪的波斯数学家和天文学家。他写了一本关于数字处理和方程的著名教科书。书名为\
  \ *Kitab al-jabr w’almuqabala*，可以翻译为《合并与还原的规则》（Rules for Reuniting and Reducing）。读音相似的词\
  \ `algebra`（代数）源于阿拉伯语 `al-jabr`，该词出现在书名中，通常被翻译为 *reuniting*（合并）或 *restoring*（还原）。`algebra`\
  \ 和 `algorithm` 这两个词的含义曾比现在要紧密得多。事实上，直到现代，`algorithm` 一词通常仅指用于求解数值方程的代数规则。今天，`algorithm`\
  \ 一词可以应用于各种处理符号数据和数值数据的指令。现在，使一组指令符合算法定义的属性取决于指令的性质，而不是取决于指令所处理的对象。要成为算法，一组指令必须完全且无歧地指定要采取的步骤以及采取这些步骤的顺序。执行算法的人或机器完全按照算法所说的做，不多也不少。\n\
  \n### 程序设计\n\n设计程序通常是一项困难的任务。没有一套完整的规则，也没有算法可以告诉你如何编写程序。程序设计是一个创造过程。尽管如此，有一个可以遵循的计划大纲。该大纲以图表形式给出显示\
  \ 1.7。所示，整个程序设计过程可以分为两个阶段：*解决问题阶段*（problem-solving phase）和*实现阶段*（implementation\
  \ phase）。`解决问题阶段`的结果是一个用英语表示的用于解决问题的算法。为了在 C++ 等编程语言中产生程序，会将算法翻译成编程语言。从算法产生最终程序被称为\
  \ `implementation phase`（实现阶段）。\n\n![说明程序设计过程的流程图。](img/fg01_00700.png)\n\n# 显示\
  \ 1.7 程序设计过程\n\n图 1.7 完整替代文本\n\n第一步是确保任务——你希望程序做的事情——被完全且精确地指定。不要轻视这一步。如果你不确切你想要的程序输出是什么，你可能会对程序产生的内容感到惊讶。确保你清楚程序的输入是什么，输出中应该精确包含哪些信息，以及这些信息应该以什么形式存在。例如，如果该程序是一个银行会计程序，你不仅必须知道利率，还需要知道利是按年、每月还是每天复利。如果程序是用来写诗的，你需要确定诗歌可以是自由体还是必须是抑扬五音步或其他格律。\n\
  \n许多初学者并不理解在用 C++ 等编程语言编写程序之前需要设计算法，因此他们试图通过完全跳过解决问题阶段，或将其简化为问题定义部分来走捷径。这看起来很合理。为什么不“直击目标”以节省时间呢？答案是*这并没有节省时间*。经验证明，两阶段过程能更快地产生正确的程序。两阶段过程通过将算法设计与\
  \ C++ 等编程语言的详细规则分离，简化了算法设计阶段。结果是算法设计过程变得不那么复杂，不容易出错。即使对于中等规模的程序，这也可以代表半天仔细工作与几天在糟糕的程序中寻找错误之间的区别。\n\
  \n实现阶段并不是一个不足道的步骤。有需要关注的细节，有时这些细节可能非常微妙，但它比你想象的要简单得多。一旦你熟悉了 C++ 或其他编程语言，将算法翻译成编程语言就会变成一项常规任务。\n\
  \n如显示 1.7 所示，测试发生在两个阶段。在编写程序之前，会对算法进行测试，如果发现算法有缺陷，则重新设计算法。这种桌面测试是通过在脑中运行算法并亲自执行这些步骤来完成的。对于大型算法，这需要笔和纸。C++\
  \ 程序通过编译它并在示例输入数据上运行来进行测试。编译器会针对某些类型的错误给出错误信息。要找到其他类型的错误，你必须某种地检查输出是否正确。\n\n\n\n\
  \n图 1.7 中所示的图是程序设计过程的理想化描述。它是你应该在脑海中具备的基本模型，但现实情况往往更加复杂。在现实中，错误和缺陷会在意想不到的时间被发现，你可能需要回溯并重新执行之前的步骤。例如，如图\
  \ 1.7 所示，测试算法可能会发现问题定义是不完整的。在这种情况下，你必须回溯并重新表述定义。偶尔，定义或算法中的缺陷直到程序测试时才会被观察到。在这种情况下，你必须回溯并修改问题定义或算法，以及设计过程中随其之后的所有内容。\n\
  \n### 面向对象\n\n我们在上一节中概述的程序设计过程将程序视为用于操作某些数据的算法（一组指令）。这是一个正确的观点，但并不总是最高效的观点。现代程序通常使用一种名为`面向对象编程`（`object-oriented\
  \ programming`）或`OOP`的方法进行设计。在 `OOP` 中，程序被视为一组相互作用的对象的集合。当程序是一个模拟程序时，这种方法论最容易理解。例如，对于一个模拟高速公路立交的程序，对象可以代表汽车和公路的车道。每个对象都有描述其在不同情况下应该如何行为的算法。以\
  \ `OOP` 风格进行编程包括设计对象以及它们所使用的算法。在 `OOP` 框架下进行编程时，图 1.7 中的`算法设计`一词将被短语`设计对象及其算法`所取代。\n\
  \n`OOP` 的主要特征是`封装`（`encapsulation`）、`继承`（`inheritance`）和`多态`（`polymorphism`）。`封装`通常被描述为信息隐藏或抽象。这种描述是正确的，但也许更容易理解的特征描述是：封装是对对象描述的一种简化形式。`继承`涉及到编写可重用的程序代码。`多态`指的是单一名称在继承语境下可以有多种含义。在做出这些陈述后，我们必须承认，对于从未听说过\
  \ `OOP` 的读者来说，这些话意义不大。然而，我们将在本书后面详细介绍所有这些术语。`C++` 通过提供`类`（`classes`）来适应 `OOP`，这是一种结合了数据和算法的数据类型。\n\
  \n### 周期\n\n大型软件系统（如编译器和操作系统）的设计者将软件开发过程分为六阶段，统称为`软件生命周期`（`software life cycle`）。该生命周期的六阶段是：\n\
  \n1. 任务的分析与规范（问题定义）\n2. 软件设计（对象与算法设计）\n3. 实现（编码）\n4. 测试\n5. 系统的维护与演进\n6. 淘汰\n\n\
  我们在讨论程序设计时没有提到最后两个阶段，因为它们发生在程序完成并投入运行之后。然而，它们应该始终被记在脑中。除非你将程序设计得易于阅读和易于更改，否则你无法为你的程序添加改进或修正。设计程序使其易于修改是一个重要课题，当我们积累了更多背景并掌握了更多编程技术后，将进行详细讨论。淘汰的含义是显而易见的，但并不总是容易接受的。当一个程序运行不符合预期且无法通过合理的努力进行修复时，它就应该被丢弃并由全新的程序取代。\n\
  \n### 自测练习\n\n12. 算法与食谱基本相同，但食谱中允许的某些步骤在算法中是不允许的。以下食谱中的哪些步骤可以在算法允许？\n\n```\nPlace\
  \ 2 teaspoons of sugar in mixing bowl.\nAdd 1 egg to mixing bowl.\nAdd 1 cup of\
  \ milk to mixing bowl.\nAdd 1 ounce of rum, if you are not driving.\nAdd vanilla\
  \ extract to taste.\nBeat until smooth.\nPour into a pretty glass.\nSprinkle with\
  \ nutmeg.\n```\n\n13. 创建程序时你应该采取的第一步是什么？\n\n14. 程序设计过程可以分为两个主要阶段。它们是什么？\n\n15. 解释为什么解决问题的阶段不应该被轻视。\n\
  \n## 1.3 C++ 简介\n\n> 语言是科学唯一的工具……\n\n塞缪尔·约翰逊 (1709–1784)\n\n在本节中，我们向你介绍 `C++` 编程语言，这是本书使用的编程语言。\n\
  \n### C++ 语言的起源\n\n人们注意到 `C++` 语言的第一点是它不寻常的名字。你可能会问，是否存在 `C` 编程语言？是否存在 `C–` 语言？是否存在名为\
  \ `A` 或 `B` 的编程语言？这些问题的答案大多是否定的。但这些问题的方向是正确的。存在 `B` 语言；它并非源自 `A`，而是源自名为 `BCPL` 的语言。`C`\
  \ 语言源自 `B` 语言，而 `C++` 则源自 `C` 语言。为什么 `C++` 的名字有两个加号？正如你在下一节将看到的，`++` 是 `C` 和 `C++`\
  \ 语言中的一种操作，因此使用 `++` 是一个双关语。`BCPL` 和 `B` 语言与我们无关。我们将通过描述 `C` 语言开始对 `C++` 编程语言的描述。\n\
  \n`C` 语言是由丹尼斯·里奇在 70 年代在 AT 贝尔实验室开发的。它最初被用于编写和维护 `UNIX` 操作系统。（在此之前 `UNIX` 系统程序是用汇编语言或\
  \ `B` 语言编写的，后者是 `UNIX` 的创始人。）`C` 是一种通用语言，可以编写任何类型的程序，但它的成功和流行与 `UNIX` 操作系统紧密相关。如果你想维护你的\
  \ `UNIX` 系统，你需要使用 `C`。`C` 与 `UNIX` 配合非常完美，很快不仅是系统程序，几乎所有运行在 `UNIX`上的商业程序都是用 `C`\
  \ 语言编写的。`C` 变得如此流行，其他操作系统上也出现了该语言的版本；它的使用并不限于使用 `UNIX` 的计算机。\n\n`C` 语言很独特，因为它是一种具有许多低级语言特征的高级语言。`C`\
  \ 处于极高级语言和低级语言这两个极端之间，这正是它优点和缺点的所在。和（低级）汇编语言一样，`C` 语言程序可以直接操作计算机内存。另一方面，`C` 具有许多高级语言的特征，使其比汇编语言更容易阅读和编写。这使得\
  \ `C` 成为编写系统的程序的极选择，但对于其他程序（在某些方面甚至对于系统程序），`C` 并不像其他语言那样容易理解；它也没有像其他高级语言那样拥有自动检查。\n\
  \n\n\n\n为了克服 C 语言及其和其他缺点，AT&T 贝尔实验室的 Bjarne Stroustrup 在 20 世纪 80 年代初开发了 C++。Stroustrup\
  \ 将 C++ 设计为一种更好的 C。C 的大部分内容都是 C++ 的子集，因此大多数 C 程序也是 C++ 程序。（反之则不然；许多 C++ 程序 绝对不是\
  \ C 程序。）与 C 不同，C++ 具有进行*面向对象编程*的设施，这是在章章早些部分描述过的一种非常强大的编程技术。C++ 语言持续演进。2011 年增加了主要的新特性，该版本被称为\
  \ C++11。2014 年增加了一些次要特性。在编写本书时，C++17 正在开发中，并将包含并行算法等额外特性。\n\n### 示例 C++ 程序\n\n显示\
  \ 1.8 包含一个简单的 C++ 程序以及当*用户*运行并与该程序交互时可能生成的屏幕显示。运行程序的人被称为 `user`。程序运行时时的输出显示在“示例对话”中。用户输入的文本用颜色显示，以区别于程序输出的文本。在实际屏幕上，这两种文本看起来看起来是相似的。程序的源代码显示在第\
  \ 1–22 行。行号仅供参考。在输入程序时你不需要输入行号。C++ 中具有预定义含义的关键字用颜色显示。这些关键字将在第 2 章 中讨论。编写程序的人被称为\
  \ `programmer`。不要混淆用户和程序员的角色。用户和程序员可能是同一个人，也可能不是。例如，如果你编写并运行一个程序，那么你既是程序员也是用户。对于专业制作的程序，程序员（或多个程序员）和用户通常是不同的人。\n\
  \n```\n 1    #include <iostream>\n 2    using namespace std;\n 3    int main( )\n\
   4    {\n 5        int numberOfPods, peasPerPod, totalPeas;\n 6        cout << \"\
  Press return after entering a number.\\n\";\n 7        cout << \"Enter the number\
  \ of pods:\\n\";\n 8        cin >> numberOfPods;\n 9        cout << \"Enter the\
  \ number of peas in a pod:\\n\";\n10        cin >> peasPerPod;\n11        totalPeas\
  \ = numberOfPods * peasPerPod;\n12        cout << \"If you have \";\n13        cout\
  \ << numberOfPods;\n14        cout << \" pea pods\\n\";\n15        cout << \"and\
  \ \";\n16        cout << peasPerPod;\n17        cout << \" peas in each pod, then\\\
  n\";\n18        cout << \"you have \";\n19        cout << totalPeas;\n20       \
  \ cout << \" peas in all the pods.\\n\";\n21        return  0;\n22    }\n```\n\n\
  ***示例对话***\n\n```\nPress return after entering a number.\nEnter the number of pods:\n\
  10\nEnter the number of peas in a pod:\n9\nIf you have 10 pea pods\nand 9 peas in\
  \ each pod, then\nyou have 90 peas in all the pods.\n```\n\n# 显示 1.8 示例 C++ 程序\n\
  \n在下一章中，我们将详细解释编写诸如显示 1.8 中所示程序所需的所有 C++ 特性，但为了让你感受一个 C++ 程序是如何工作的，我们现在将提供关于该特定程序工作原理的简要描述。如果某些细节不太清楚，请担心。在这一节中，我们只是想对\
  \ C++ 程序是什么有个初步的了解。\n\n示例程序的开始和结束包含了一些我们尚不需要关注的细节。程序从以下几行开始：\n\n```\n#include <iostream>\n\
  using namespace  std;\nint  main()\n{\n```\n\n现在我们将这些行视为一种表示“程序在这里开始”的相当复杂的方式。\n\
  \n`The` 程序以以下两行结束：\n\n```\n return 0;\n}\n```\n\n对于一个简单的程序，这两行仅仅意味着“程序在这里结束”。\n\n\
  在起始和结束行之间的行是程序的核心。我们将简要描述这些行，从下面这一行开始：\n\n```\nint numberOfPods, peasPerPod, totalPeas;\n\
  ```\n\n这一行被称为 `variable declaration`。该变量声明告诉计算机 `numberOfPods`、`peasPerPod` 和 `totalPeas`\
  \ 是变量。（注：原文此处存在大量重复内容，已清理并保留核心含义）。\n\n\n\n这几行与之前的两行相似。第一行向屏幕发送一条消息，要求输入数字。当你用键盘输入一个数字并按下回车键时，该数字就会成为变量\
  \ `peasPerPod` 的值。在示例对话中，我们假设你输入了数字 `9`。在你输入 `9` 并按下回车键后，变量 `peasPerPod` 的值就变为 `9`。\n\
  \n下面所示的下一个非空程序行执行了该简易程序中进行的所有计算：\n\n```\ntotalPeas = numberOfPods * peasPerPod;\n\
  ```\n\n在 C++ 中，星号符号 `*` 用于乘法。因此，这条语句的意思是将 `numberOfPods` 和 `peasPerPod` 相乘。在这种情况下，`10`\
  \ 乘以 `9` 得到结果 `90`。等号表示变量 `totalPeas` 应被赋值为结果 `90`。这是等号的一种特殊用法；它在这里的意思与其他数学语境不同。它为左侧的变量赋予一个（可能是新的）值；在这种情况下，它让\
  \ `90` 成为 `totalPeas` 的值。\n\n程序的其余部分基本上是更多类似的输出。考虑接下来的三个非空行：\n\n```\ncout << \"\
  If you have \";\ncout << numberOfPods;\ncout << \" pea Pods\\n\";\n```\n\n这只是另外三个输出语句，其工作原理与之前以\
  \ `cout` 开头的语句基本相同。唯一新颖的是这三条语句中的第二个，它表示输出变量 `numberOfPods`。当输出变量时，输出的是该变量的值。因此，这条语句导致输出一个\
  \ `10`。（请记住，在程序的这个示例运行中，变量 `numberOfPods` 是由运行程序的用户设置为 `10` 的。）因此，这三行产生的输出是：\n\n\
  ```\nIf you have 10 pea pods\n```\n\n注意，输出全部在同一行上。只有当作为输出发送特殊指令 `\\n` 时，才会开始新的一行。\n\
  \n程序的其余部分不包含任何新内容，如果你理解了我们到为止讨论的内容，你就应该能够理解程序的剩余部分。\n\n### 编程提示：输入和输出语法\n\n如果你将\
  \ `cin` 视为键盘或输入设备的名称，将 `cout` 视为屏幕或输出设备的名称，那么很容易记住箭头 `>>` 和 `<<` 的方向。它们指向数据移动的方向。例如，考虑这条语句：\n\
  \n```\ncin >> numberOfPods;\n```\n\n在上述语句中，数据从键盘移动到变量 `numberOfPods`，因此箭头从 `cin`\
  \ 指向该变量。\n\n另一方面，考虑输出语句：\n\n```\ncout << numberOfPods;\n```\n\n在这条语句中，数据从变量 `numberOfPods`\
  \ 移动到屏幕，因此箭头从变量 `numberOfPods` 指向 `cout`。\n\n### 简单 C++ 程序的布局\n\n简单 C++ 程序的通用形式如显示\
  \ 1.9 所示。对于编译器而言，`换行`和`空格`不需要那里以及我们的示例中那样所示。编译器会接受任何合理的换行和缩进模式。事实上，编译器甚至会接受大多数不合理的换行和缩进模式。然而，程序的布局应该始终易于阅读。将左大括号\
  \ `{` 单独放在一行，并将右大括号 `}` 也单独独放在一行，将使这些标点符号易于找到。对每个语句进行缩进并将每个语句单独放在一行，可以易地看到程序的指令是什么。之后，我们的某些语句将长到无法放在一行内，届时我们将使用这种模式的轻微变体来进行缩进和换行。你应该遵循书中示例设定的模式，或者如果你在课课上，就遵循老师指定的模式。\n\
  \n```cpp\n 1   #include <iostream>\n 2   using namespace  std;\n 3   \n 4   int\
  \  main()\n 5   {\n 6        Variable_Declarations\n 7\n 8        Statement_1\n\
   9        Statement_2\n10        ...\n11        Statement_Last\n12\n13        return\
  \ 0;\n14   }\n```\n\n# 显示 1.9 简单 C++ 程序的布局\n\n在显示 1.8 中，变量声明位于以单词 `int` 开头的那行上。正如我们即将在下一章中看到的，你不需要将所有变量声明都放在程序的开头，但那是它们的一个很好的默认位置。除非你有理由将它们放在别处，否则请将它们放在程序的开头，如显示\
  \ 1.9 所示。\n\n语句是指是以 `cout` 或 `cin` 开头的行，以及以等号结尾的行。语句通常被称为`可执行语句`。注意我们看到的每个语句都以分号结尾。第一行\n\
  \n```\n#include <iostream>\n```\n\n被称为 `include` 指令。它告诉编译器去哪里找到某些信息。在这种情况下，`iostream`\
  \ 是处理键盘输入和屏幕输出的库的名称；`iostream` 是包含该库的文件。我们之前讨论的链接器程序将库的代码和你编写程序的代码相结合。对于 `iostream`，这在你的系统上可能会自动发生。你最终会使用其他库，当你使用它们时，必须在程序开头通过指令来命名它们。指令总是以符号\
  \ `#` 开头。\n\n接下来的这行代码进一步解释了我们刚刚解释的 `include` 指令：\n\n```cpp\nusing namespace std;\n\
  ```\n\n这一行表示 `iostream` 中定义的名称应以“标准方式”解释（`std` 是 *standard* 的缩写）。我们稍后将在书中对这一行进行更多说明。接下来的第三行和第四行非空行表示程序的主部分从这里：\n\
  \n```cpp\nint main()\n{\n```\n\n正确的术语是*主函数*，而不是*主部分*，但这种细微差别在我们关注第 4 章之前不会涉及。大括号\
  \ `{` 和 `}` 标记了程序主部分的开始和结束。它们不需要单独放在一行，但为了让它们易于找到，我们总是将它们每一个单独放在一行。\n\n倒数第二行\n\n\
  ```cpp\nreturn 0;\n```\n\n\n\n意为“运行到这里时结束程序”。这一行不需要是程序的最后一行，但在一个非常简单的程序中，将它放在任何其他地方都没有意义。某些编译器允许你省略这一行，并会判断出当没有更多语句需要执行时，程序就结束了。然而，其他编译器会坚持你包含这一行，因此最好养成包含它的习惯，即使你的编译器认为没有它也能运行。这一行被称为\
  \ `return statement`（返回语句），被认为是一个可执行的语句，因为它告诉计算机执行某些事情；具体来说，它告诉计算机结束程序。数字 `0` 对我们来说还没有直观的意义，但它必须存在那里；随着你学习更多\
  \ C++ 的知识，它的意义将变得清晰。请注意，尽管 `return` 语句表示结束程序，你仍然必须在程序主部分的末尾添加一个右大括号 `}`。\n\n###\
  \ 编译和运行 C++ 程序\n\n在上一节中，你已经学习了如果运行显示 1.8 所示的 C++ 程序会发生什么。但那个程序在哪里，你如何让它运行呢？\n\n\
  你使用文本编辑器编写 C++ 程序，就像编写任何其他文档一样——论文、情书、购物清单或任何内容。程序保存在文件中，就像你使用文本编辑器准备的任何文档一样。有不同的文本编辑器，它们的使用细节各不相同，因此我们无法对你的文本编辑器做过多介绍。你应该查阅你编辑器的文档。\n\
  \n编译和运行 C++ 程序的方法也取决于你使用的特定系统，因此我们将仅以非常通用的方式讨论这些点。你需要学习如何在你的系统中给出编译、链接和运行 C++ 程序的命令。这些命令可以在你的系统手册中找到，也可以通过询问已经在你的系统上使用\
  \ C++ 的人获得。当你给出编译程序的命令时，这将产生你的 C++ 程序的机器语言翻译。这个翻译后的版本被称为你程序的 `object code`（目标代码）。目标代码必须与已经为你写好的例程（例如输入和输出例程）的目标代码进行链接（即组合）。这种链接很可能是自动完成的，所以你不需要担心链接。但在某些系统上，你可能被要求单独调用链接器。再次，请查阅你的手册或咨询当地专家。最后，你给出运行程序的命令；如何给出该命令也取决于你使用的系统，因此请检查手册或咨询当地专家。\n\
  \n### 编程提示：让你的程序运行起来\n\n不同的编译器和不同的环境可能在设置带有 C++ 程序的文件的某些细节上会有细微差异。从显示 1.10 中获取程序的副本。它可以在互联网上下载。（详情请参阅前言。）或者，你自己非常仔细地手动输入程序。不要输入行号。编译该程序。如果你收到错误消息，请检查你的输入，修复任何拼写错误并重新编译文件。一旦程序在没有错误消息的情况下编译通过，请尝试运行程序。\n\
