  \ 等于 `14`。\n\n16. 为单参数成员函数 `Bank-Account::update(int years)` 编写迭代版本，该函数见显示 14.9。\n\
  \n# 本章总结\n\n- 如果一个问题可以简化为相同问题的更小实例，那么递归解决方案可能很容易找到并实现。\n- 函数定义的递归算法通常包含两种情况：一个或多个包含至少一次递归调用的情况，以及一个或多个在不进行递归调用的情况下解决问题的停止情况。\n\
  - 在编写递归函数定义时，始终确认函数不会产生无限递归。\n- 当你定义递归函数时，使用“递归设计技术”小节提供的三个标准来确认函数的正确性。\n- 当你设计递归函数来解决任务时，通常需要解决比给定任务更通用的问题。这可能是为了允许正确的递归调用，因为较小的问题可能与给任务并不完全相同。例如，在二分查找问题中，任务是搜索整个数组，但递归解决方案是搜索数组任何部分（全部或部分）的算法。\n\
