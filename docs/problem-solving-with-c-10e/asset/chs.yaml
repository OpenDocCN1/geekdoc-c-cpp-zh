  \n## 9. 在这一章中，我们只使用了一个单一模板类类型参数。C++ 允许你指定多个类型参数。例如，以下代码指定了类接受两个类型参数：\n\n```\ntemplate<class\
  \ T, class V>\n class Example\n{\n    ...\n}\n```\n\n在创建类的实例时，我们现在必须指定两个数据类型，例如：\n\
  \n```\nExample<int, char> demo;\n```\n\n创建一个 `Map` 类，将键映射到值。键和值的数据类型应该使用类型参数单独指定。该映射构成了简单数据库的基础。例如，为了将员工\
  \ ID 映射到员工姓名，我们可能会使用整数作为键的数据类型，使用字符串作为名称的数据类型。该类应该具有以下函数：\n\n1. 向映射中添加新的键/值对\n2.\
  \ 给键将现有的键/值对设置为新值\n3. 给键从映射中删除键/值对\n4. 给键检查映射中是否存在键/值对\n5. 给键检索键/值对的值\n\n可以使用任何你想要的数据类型来实现该映射。编写一个\
  \ `main` 函数，通过样本数据执行所有函数来测试该类。\n\n# 18 标准模板库与 C++11\n\n> 库不是制造出来的，它们生长出来。\n\nAUGUSTINE\
  \ BIRRELL\n\n## 引言\n\n有大量用于存储数据的标准数据结构。由于它们是如此标准，因此为它们提供标准的、移植的实现是有意义的。标准模板库（STL）包含了此类数据结构的库。STL\
  \ 中包含了 `stack`、`queue` 以及许多其他标准数据结构的实现。在 STL 的背景下讨论时，这些数据结构通常被称为 `容器类`，因为它们用于存放数据集合。在[第\
  \ 8 章]中，我们通过描述 `vector` 模板类展示了 STL 的预览，它是 STL 中的容器类之一。在本章中，我们将介绍 STL 中包含的一些基本类的概述。我们没有空间在这里对\
  \ STL 进行全面阐述，但我们将提供足够的内容让你开始使用一些基本的 STL 容器类。\n\nSTL 由 Alexander Stepanov 和 Meng\
  \ Lee 在惠尔惠普公司开发，基于 Stepanov、Lee 和 David Musser 的研究。它是一个用 C++ 语言编写的库集合。尽管 STL 不是\
  \ C++ 语言核心的一部分，但它是 C++ 标准的一部分，因此任何符合标准的 C++ 实现都会包含 STL。从实际角度考虑，你可以将 STL 视为 C++ 语言的一部分。\n\
  \n正如其名所示，STL 中的类都是模板类。STL 中的一个典型容器类有一个类型参数，用于存储在容器类中的数据类型。STL 容器类大量使用迭代器，迭代器是便于循环遍历容器中数据的对象。迭代器概念的介绍在[第\
  \ 13.1 节]中给出，那里我们讨论了用作迭代器的指针。在阅读本章之前，阅读该节将对你有所帮助。如果你还没有这样做，也应该阅读[第 8.3 节]，该节涵盖了\
  \ STL 的 `vector` 模板类。\n\nSTL 还包含了许多重要的泛型算法的实现，例如搜索和排序算法。这些算法是以模板函数实现的。在讨论容器类之后，我们将描述其中一些算法实现。\n\
  \nSTL 与其他 C++ 库（例如 `<iostream>`）的区别在于，类和算法是`泛型的`，这是另一种说法，即它们是模板类和模板函数。\n\n### 前提条件\n\
  \n本章使用了[第 2 章]到[第 13 章]、[第 15 章]、[第 17 章]和[第 18 章]的内容。\n\n## 18.1 迭代器\n\n> 白兔戴上眼镜。“我该从哪里开始？”他问。\n\
  \n> “从开始开始，”国王严肃地说道，“一直持续直到到达结尾。”\n\nWIS CARROLL，《爱丽仙游》\n\n在[第 8 章]中引入的 Vector 是\
  \ STL 中的容器类之一。迭代器是指针的泛化。本节向你展示如何在 vector 中使用迭代器。\n\n## 18.2 *using* 声明\n\n在继续学习本节和本章之前，回顾[第\
  \ 12 章]中的“限定名称”小节可能会有所帮助。\n\n假设 `my_function` 是定义在命名空间 `my_space` 中的函数。以下 `using`\
  \ 声明允许你使用标识符 `my_function` 并使其代表定义在命名空间 `my_space` 中的 `my_function` 版本：\n\n```\n\
  using my_space::my_function;\n```\n\n在该 `using` 声明的作用范围内，表达式如 `my_function(1,2)`\
  \ 与 `my_space::my_function(1,2)` 相同；也就是说，在该 `using` 声明的作用范围内，标识符 `my_function` 始终指向\
  \ `my_space` 中的定义，而不是其他命名空间中的定义。\n\n在讨论迭代器时，我们经常会将 `::` 运算符应用于另一个级别。你经常会看到这样的表达式：\n\
  \n```\nusing std::vector<int >::iterator;\n```\n\n在这种情况下，标识符 `iterator` 命名了一个类型。因此，在该\
  \ `using` 指令的作用范围内，允许以下操作：\n\n```\niterator p;\n```\n\n\n\n\n这声明 `p` 的类型为 `iterator`。`iterator`\
  \ 类型是什么？它定义在类 `vector<int>` 的定义中。哪一个 `vector<int>` 类呢？是定义在 `std` 命名空间中的那个。（我们稍后会详细解释\
  \ `iterator` 类型。此时，我们只关注解释 `using` 指令。）\n\n你可能会反对说这完全是大题小做。在 `std` 命名空间之外，没有任何命名空间定义了\
  \ `vector<int>` 类。这可能是的，也可能不是，但在现在或将来，其他命名空间中可能会定义一个名为 `vector<int>` 的类。你可能进一步反对说，你从未听说过在类内部定义类型。我们还没有涉及这类定义，但它们是可能的，而且在\
  \ STL 中非常常见。因此，你必须知道如何使用这些类型，即使你并不定义这些类型。\n\n总之，考虑这个 `using` 指令：\n\n```\nusing std::vector<int>::iterator;\n\
  ```\n\n在这个 `using` 指令的作用范围内，标识符 `iterator` 指的是在类 `vector<int>` 中定义的名为 `iterator`\
  \ 的类型，而该类又定义在 `std` 命名空间中。\n\n# 迭代器基础\n\n**迭代器**是指针的泛化，实际上它通常是使用指针实现的，但迭代器的抽象设计是为了让你避开实现细节，并为你提供一个统一的迭代器接口，该接口在不同的容器类之间是通用的。每个容器类都有自己的迭代器类型，就像每个数据类型都有自己的指针类型一样。但就像所有指针类型对于特定数据类型的动态变量的行为本质上相同，每个迭代器类型的行为也相同，但每个迭代器仅与它自己的容器类配合使用。\n\
  \n迭代器不是指针，但如果你将其视为并像指针一样使用它，也不会出错。就像指针变量一样，迭代器变量位于（“指向”）容器中的一个数据条目。你使用以下适用于迭代器对象的重载运算符来操作迭代器：\n\
  \n*   前置和后置增运算符运算符 `++`，用于将迭代器移动到下一个数据项。\n*   前置和后置减运算符 `--`，用于将迭代器移动到上一个数据项。\n\
  *   相等和不等运算符 `==` 和 `!=`，用于测试两个迭代器是否指向同一个数据位置。\n*   解引用运算符 `*`，如果 `p` 是一个迭代器变量，那么\
  \ `*p` 就可以访问位于（由 `p` 指向）的数据。这种访问可以是只读、只写、或同时允许读取和修改数据，取决于具体的容器类。\n\n并不是所有的迭代器都拥有这些运算符。然而，`vector`\
  \ 模板类是一个示例，其迭代器拥有所有这些运算符以及更多。\n\n容器类具有启动迭代器过程的成员函数。毕竟，一个新的迭代器变量并没有位于（“指向”）容器中的任何数据。许多容器类（包括\
  \ `vector` 模板类）具有以下成员函数，它们返回迭代器对象（迭代器值），指向数据结构中的特殊数据元素：\n\n*   `c.begin()` 返回容器\
  \ `c` 的迭代器，指向容器 `c` 中的“第一个”数据项。\n*   `c.end()` 返回一个可以测试迭代器是否已越过容器 `c` 中最后一个数据项的值。迭代器\
  \ `c.end()` 与测试指针是否越过链表最后一个节点的 `NULL` 完全模拟。因此，迭代器 `c.end()` 是一个位于任何数据项上的迭代器，但它是一种结束标记或哨兵。\n\
  \n对于许多容器类，这些工具允许你编写 `for` 循环来遍历容器对象 `c` 中的所有元素，如下：\n\n```\n//p 是一个与容器对象 c 类型相同的迭代器变量。\n\
  for (p = c.begin(); p != c.end(); p++)\n    process *p //*p 是当前的数据项。\n```\n\n这就是大体。现在，让我们在\
  \ `vector` 模板容器类的具体设置来看细节。\n\n显示 18.1 展示了在 `vector` 模板类上使用迭代器。请记住，STL 中的每种容器类型都有自己的迭代器类型，尽管它们的使用方式基本上是相同的。我们为\
  \ `int` 向量需要的迭代器类型为：\n\n```\nstd::vector<int>::iterator\n```\n\n另一个容器类是 `list` 模板类。`int`\
  \ 列表的迭代器类型为：\n\n```\nstd::list<int>::iterator\n```\n\n```\n#include <iostream>\n\
  #include <vector>\n#include <list>\n\nusing namespace std;\n\nint main() {\n   \
  \ vector<int> container;\n    container.push_back(1);\n    container.push_back(2);\n\
  \    container.push_back(3);\n    container.push_back(4);\n\n    vector<int>::iterator\
  \ p;\n    for (p = container.begin(); p != container.end(); p++) {\n        cout\
  \ << *p << \" \";\n    }\n    cout << endl;\n\n    list<int> lst;\n    lst.push_back(1);\n\
  \    lst.push_back(2);\n    lst.push_back(3);\n    lst.push_back(4);\n\n    list<int>::iterator\
  \ it;\n    for (it = lst.begin(); it != lst.end(); it++) {\n        cout << *it\
  \ << \" \";\n    }\n    cout << endl;\n\n    return 0;\n}\n```\n\n# 在 Vector 使用迭代器\n\
  \n在 `vector`（或任何容器类）中使用迭代器的基本用法由以下几行所示：\n\n```\nvector<int>::iterator p;\nfor (p\
  \ = container.begin(); p != container.end(); p++)\n    process *p\n```\n\n\n\n当且仅当\
  \ `p1` 和 `p2` 位于同一元素时，结果为真。（这与指针类似。如果 `p1` 和 `p2` 是指针，那么当它们指向同一个东西时，结果就为真。）按照惯例，`!=`\
  \ 只是 `==` 的否定，因此：\n\n```\np1 != p2\n```\n\n当 `p1` 和 `p2` 不位于同一元素时，结果为真。\n\n成员函数\
  \ `begin()` 用于将迭代器置于容器中的第一个元素。对于 vector 以及许多其他容器类，成员函数 `begin()` 返回一个指向第一个元素的迭代器。（对于\
  \ vector `v`，第一个元素是 `v[0]`。）因此，\n\n```\nvector<int>::iterator p = v.begin();\n```\n\
  \n这会将迭代器变量 `p` 初始化为指向第一个元素的迭代器。因此，访问 vector `v` 中所有元素的基础 `for` 循环是：\n\n```\nvector<int>::iterator\
  \ p;\nfor (p = v.begin(); Boolean_Expression; p++)\n     Action_At_Location p;\n\
  ```\n\n用于停止条件的所需的 `Boolean_Expression` 是：\n\n```\np == v.end()\n```\n\n成员函数 `end()`\
  \ 返回一个哨兵值，可以通过该值检查迭代器是否已经过了最后一个元素。如果 `p` 位于最后一个元素，那么在 `p++` 之后，测试 `p == v.end()`\
  \ 将从 `false` 变为 `true`。因此，带有正确 `Boolean_Expression` 的 `for` 循环是：\n\n```cpp\nvector<int>::iterator\
  \ p;\nfor (p = v.begin(); p != v.end(); p++)\n     Action_At_Location p;\n```\n\n\
  注意，`p != v.end()` 在 `p` 的位置移动过最后一个元素之前不会从 `true` 变为 `false`。因此，`v.end()` 不位于任何元素。`v.end()`\
  \ 的值是一个作为哨兵值的特殊值。它不是一个普通的迭代器，但你可以使用 `==` 和 `!=` 将 `v.end()` 与迭代器比较。`v.end()` 的值类似于用于标记第\
  \ 13 章中讨论的链表结束标记的 `NULL` 值。\n\n以下来自显示 18.1 的 `for` 循环对名为 `container` 的 vector 使用了这种完全的技术：\n\
  \n```cpp\nvector<int>::iterator p;\nfor (p = container.begin(); p != container.end();\
  \ p++)\n   cout << *p << \" \";\n```\n\n在迭代器 `p` 所在位置执行的操作是：\n\n```cpp\ncout <<\
  \ *p << \" \";\n```\n\n解引用运算符 `*` 针对 STL 容器迭代器进行了重载，使得 `*p` 产生位于位置 `p` 的元素。特别地对于\
  \ vector 容器，`*p` 产生位于迭代器 `p` 的元素。因此，上面的 `cout` 语句输出位于迭代器 `p` 处的元素，整个 `for` 循环输出\
  \ vector 容器中的所有元素。\n\n解引用运算符 `*p` 始终产生位于迭代器 `p` 的元素。在某些情况下，`*p` 只读访问，这不允许你更改元素。在其他情况下，它赋予你对元素的访问权限并允许你更改元素。对于\
  \ vector，`*p` 将允许你更改位于 `p` 处的元素，如下所示（来自显示 18.1 的 `for` 循环）：\n\n```cpp\nfor (p =\
  \ container.begin(); p != container.end(); p++)\n    *p = 0;\n```\n\n这个 `for` 循环遍历\
  \ vector 容器中的所有元素并将所有元素更改为 `0`。\n\n# 编程技巧：使用 `auto` 简化变量声明\n\n在涉及模板和迭代器时，`auto`\
  \ 关键字可以让你的代码更具读性。声明迭代器可能非常繁琐：\n\n```cpp\nvector<int>::iterator p = v.begin();\n\
  ```\n\n我们可以使用 `auto` 更紧凑地实现相同的功能：\n\n```cpp\nauto p = v.begin();\n```\n\n或者，如果代码只使用一种类型的迭代器，可以使用以下方法：\n\
  \n```cpp\nusing std::vector<char>::iterator;\n…\niterator p;\n```\n\n你也可以使用以下方法，但它不太理想，因为会将\
  \ `std` 命名空间中的所有名称都引入到当前的声明区域，增加了名称冲突的可能性。\n\n### 自测\n\n1. `v.begin()` 返回什么？`v.end()`\
  \ 返回什么？\n2. 如果 `p` 是一个迭代器，`*p` 是什么？\n3. 如果 `p` 是一个迭代器，`p++` 返回什么？\n\n# 迭代器的种类\n\n\
  不同的迭代器根据对其可以执行的操作进行分类。Vector 迭代器是最通用的；所有操作都适用于它们。在显示 18.2 中我们使用方括号语法来说明这一点。\n\n\
  # 随机访问\n\n随机访问意味着你可以一步直接到达任何特定元素。我们已经使用过 `container[2]` 作为 vector 的一种随机访问。这仅仅是数组和\
  \ vector 中标准的方括号运算符。新之处在于，你可以对迭代器使用这种相同的方括号语法。表达式 `p[2]` 是获取索引为 `2` 的元素访问的一种方式。\n\
  \n\n\n\n表达式 `p[2]` 和 `*(p + 2)` 是完全等价的。类似于指针算术（参见第 9 章`），`(p + 2)` 表示 `p` 之后的两个位置。由于\
  \ `p` 位于上述代码中的第一个（索引 `0`）位置，因此 `(p + 2)` 位于第三（索引 `2`）位置。表达式 `(p + 2)` 返回一个迭代器。表达式\
  \ `*(p + 2)` 对该迭代器解引用。当然，你可以将 `2` 替换为不同的非负整数以获得指向不同元素的指针。\n\n请注意，`p[2]` 或 `(p +\
  \ 2)` 都不会改变迭代器变量 `p` 中迭代器的值。表达式 `(p + 2)` 返回另一个位置的另一个迭代器，但它保持 `p` 原位置不变。`p[2]` 也是如此。还要注意，`p[2]`\
  \ 和 `(p + 2)` 的含义取决于迭代器在 `p` 中的位置。例如，`(p + 2)` 意味着 `p` 所在位置之后的两个位置，无论该位置何处。\n\n\
  例如，假设之前讨论的显示 18.2 中的代码被替换为以下内容（注意添加的 `p++`）：\n\n```\nvector<char>::iterator p =\
  \ container.begin();\np++;\ncout << \"The third entry is \" << container[2] << endl;\n\
  cout << \"The third entry is \" << p[2] << endl;\ncout << \"The third entry is \"\
  \ << *(p + 2) << endl;\n```\n\n这三个 `cout` 的输出将不再是\n\n```\nThe third entry is C\n\
  The third entry is C\nThe third entry is C\n```\n\n而是\n\n```\nThe third entry is\
  \ C\nThe third entry is D\nThe third entry is D\n```\n\n`p++` 将 `p` 从位置 `0` 移动到位置\
  \ `1`，因此 `(p + 2)` 现在是位于位置 `3` 处的迭代器，而不是位置 `2`。因此，`*(p + 2)` 和 `p[2]` 等于 `container[3]`，而不是\
  \ `container[2]`。\n\n现在我们对迭代器的了解已经足够理解迭代器是如何分类的。主要的迭代器类型有：\n\n*   前向迭代器（Forward\
  \ iterators）：`++` 可作用于迭代器。\n*   双向迭代器（Bidirectional iterators）：`++` 和 `--` 均作用于迭代器。\n\
  *   随机访问迭代器（Random access iterators）：`++`、`--` 和随机访问均作用于迭代器。\n\n注意，这些是不断增强的类别：每个随机访问迭代器都是双向迭代器，每个双向迭代器都是前向迭代器。正如我们将看到的，不同的模板容器类具有不同类型的迭代器。`vector`\
  \ 模板类的迭代器是随机访问迭代器。\n\n注意，*forward iterator*、*bidirectional iterator* 和 *random access\
  \ iterator* 的名称指的是迭代器的种类，而不是类型名称。实际的类型名称将类似于 `std::vector<int>::iterator`，在这种情况下，它恰好是一个随机访问迭代器。\n\
  \n### 自测练习\n\n4. 假设 vector `v` 按顺序包含字母 `'A'`、`'B'`、`'C'` 和 `'D'`。以下代码的输出是什么？\n\n\
  ```\nvector<char>::iterator i = v.begin();\ni++;\ncout << *(i + 2) << \" \";\ni--;\n\
  cout << i[2] << \" \";\ncout << *(i + 2) << \" \";\n```\n\n# 常量可变迭代器\n\n前向迭代器、双向迭代器和随机访问迭代器每一类都分为两个类别：*常量*（constant）和*可变*（mutable），这取决于解引用运算符对迭代器的行为。对于**常量迭代器**（**constant\
  \ iterator**），解引用运算符产生元素的只读版本。对于常量迭代器 `p`，你可以使用 `*p`（例如赋值给变量或输出到屏幕），但你不能通过（例如赋值给\
  \ `*p`）来更改容器中的元素。对于**可变迭代器 p**（**mutable iterator p**），`*p` 可以被赋值一个值，这将改变容器中相应的元素。vector\
  \ 迭代器是可变的，如下显示 18.1; p != container.end(); p++)\n    *p = 0;\n```\n\n如果容器只有常量迭代器，你就无法获得可变迭代器。然而，如果容器具有可变迭代器，而你想要该容器的常量迭代器，你可以拥有它。例如，以下代码可以工作：\n\
  \n```cppstdstd::vector<int> container;\nstd::vector<int>::const_iterator p = container.begin();\n\
  ```\n\n如果你打算更改容器中的元素，以下代码将产生错误：\n\n```cpp\n*p = 10;\n```\n\n# 反向迭代器\n\n有时你想按反序遍历元素。如果你有双向迭代器，有一种方法可以使用一种被称为**反向迭代器**（**reverse\
  \ iterator**）的迭代器来实现你的目标。以下可以正常工作：\n\n```\nvector<int>::reverse_iterator rp;\nfor\
  \ (rp = container.rbegin(); rp != container.rend(); rp++)\n    // do something\n\
  ```\n\n成员函数 `rbegin()` 返回一个位于最后一个元素的迭代器。成员函数 `rend()` 返回一个标记反向顺序元素“结束”的哨兵。注意，对于类型为\
  \ *reverse iterator* 的迭代器，递增运算符 `++` 会在元素中反向移动。换句话说，`--` 和 `++` 的含义是交换的。显示 18.3\
  \ 中的程序演示了反向迭代器。\n\n```cpp\n//演示反向迭代器的程序\n#include <iostream>\n#include <vector>\n\
  using std::cout;\nusing std::endl;\nusing std::vector;\nint main()\n{\n    vector<char>\
  \ container;\n    container.push_back('A');\n    container.push_back('B');\n   \
  \ container.push_back('C');\n    cout << \"Forward:\\n\";\n    vector<char>::iterator\
  \ p;\n    for (p = container.begin(); p != container.end(); p++)\n        cout <<\
  \ *p << \" \";\n    cout << endl;\n\n    cout << \"Reverse:\\n\";\n    vector<char>::reverse_iterator\
  \ rp;\n    for (rp = container.rbegin(); rp != container.rend(); rp++)\n       \
  \ cout << *rp << \" \";\n    cout << endl;\n    return 0;\n}\n```\n\n***示例对话***\n\
  \n```\nForward:\nA B C\nReverse:\nC B A\n```\n\n# 显示 18.3 反向迭代器\n\n`reverse_iterator`\
  \ 类型也有常量版本，命名为 `const_reverse_iterator`。\n\n# 其他类型的迭代器\n\n\n\n\n\n还有其他类型的迭代器，我们在书中将不会介绍。简而言之，你可能会遇到两种迭代器：输入迭代器（input\
  \ iterator），它本质上是可用于输入流的正向迭代器；以及输出迭代器（output iterator），它本质上是可用于输出流的正向迭代器。更多细节，你需要查阅更高级的参考资料。\n\
  \n### 自测练习\n\n5. 假设 vector `v` 按照顺序包含字母 `'A'`、`'B'`、`'C'` 和 `'D'`。以下代码的输出是什么？\n\n\
  ```\nvector<char>::reverse_iterator i = v.rbegin();\ni++;\ni++;\ncout << *i << \"\
  \ \";\ni--;\ncout << *i << \" \";\n```\n\n6. 假设你想运行以下代码，其中 v` 是一个 `int` 类型的 vector：\n\
  \n```cpp\nfor (p = v.begin(); p != v.end(); p++)\n    cout << *p << \" \";\n```\n\
  \n以下哪种是声明 `p` 的可能方法？\n\n```cpp\nstd::vector<int>::iterator p;\nstd::vector<int>::const_iterator\
  \ p;\n```\n\n# 18.2 容器\n\n> *不要把鸡蛋都放在一个篮子里而且*——盯着那个篮子。\n\n马克·特维恩，《普丁头·威尔逊》\n\nSTL\
  \ 的`容器类`（container classes）是用于存储数据的不同数据结构，例如列表、队列和栈。每个都是一个模板类，带有一个用于存储特定数据类型的参数。例如，你可以指定一个列表为\
  \ `int` 列表、`double` 列表、`string` 列表，或你希望的任何类或 `struct` 类型。每个容器模板类可能都有自己专门的访问器函数和修改器函数，用于从容器中添加和删除数据。不同的容器类可能具有不同类型的迭代器。例如，一个容器类可能具有双向迭代器，而另一个容器类可能只有正向迭代器。然而，每当定义它们时，迭代器运算符以及成员函数\
  \ `begin()` 和 `end()` 对于所有 STL 容器类都具有相同的含义。\n\n# 顺序容器\n\n顺序容器将其数据项排列成列表，以便有一个第一个元素、下一个元素，依此类推，直到最后一个元素。我们在[第\
  \ 13 章]中讨论的链表是列表的一种示例。我们在[第 13 章]中讨论的列表有时被称为`单向链表`（singly linked lists），因为从一个位置到另一个位置只有一个链接。STL\
  \ 没有对应于这种单向链表的容器，尽管某些实现通常以 `slist` 的名称提供实现。STL 部分的最简单列表是`双向链表`（doubly linked list），即模板类\
  \ `list`。这两种列表之间的差异在[显示 18.4]中所示。\n\n![展示两种列表的流程图](img/fg18_00400) 18.4 两种类型的列表\n\
  \n[显示 18.4]中的列表按顺序包含三个整数值 `1`、`2` 和 `3`。这两个列表的类型分别为 `slist<int>` 和 `list<int>`。该显示还指示了迭代器\
  \ `begin()` 和 `end()` 的位置。我们还没有告诉你如何向列表输入整数。\n\n在[显示 18.4]中，我们将单向链表和双向链表画成了[第 14\
  \ 章]中讨论的节点和指针形式。STL 类 `list` 和非标准类 `slist` 可能（也可能）以此方式实现。然而，当使用 STL 模板类时，你被这些实现细节隔离开了。因此，你只需要从数据的位置（可能是也可能不是节点）和迭代器（不是指针）来思考。你可以将[显示\
  \ 18.4]中的箭头视为指示 `++`（向下）和 `--`（向上）的方向。\n\n我们想要展示模板类 `slist`是为了为顺序容器提供一个背景。它对应于我们在[第\
  \ 13 章]中讨论得最多的内容，而且当你提到链表时，大多数程序员脑海中浮现的第一个东西。然而，由于模板类 `slist` 不是标准的，我们不再对其进行讨论。如果你的实现提供了模板类\
  \ `slist` 且你想使用它，其细节与我们为 `list` 描述的相似，不同之处在于减运算符 `--`（前缀和后置）没有在 `slist` 中定义。\n\n\
  一个使用 STL 模板类 `list` 的简单程序在[显示 18.5]中。`push_back` 函数向列表末尾添加元素。请注意，对于 `list` 模板类，解引用运算符让你获得读取和更改数据的访问。还要注意，对于\
  \ `list` 模板类以及 STL 的所有模板类和迭代器，所有的定义都位于 `std` 命名空间中。\n\n```cpp\n//演示 STL 模板类 list\
  \ 的程序。\n#include <iostream>\n#include <list>\nusing std::cout;\nusing std::endl;\n\
  using std::list;\n\nint main()\n{\n    list<int> listObject;\n\n    for (int i =\
  \ 1; i <= 3; i++)\n        listObject.push_back(i);\n\n    cout << \"List contains:\\\
  n\";\n    list<int>::iterator iter;\n    for (iter = listObject.begin(); iter !=\
  \ listObject.end(); iter++)\n        cout << *iter << \" \";\n    cout << endl;\n\
  \n    cout << \"Setting all entries to 0:\\n\";\n    for (iter = listObject.begin();\
  \ iter != listObject.end(); iter++)\n        *iter = 0;\n\n    cout << \"List now\
  \ contains:\\n\";\n    for (iter = listObject.begin(); iter != listObject.end();\
  \ iter++)\n        cout << *iter << \" \";\n    cout << endl;\n\n    return 0;\n\
  }\n```\n\n***对话***\n\n```\nList contains:\n1 2 3\nSetting all entries to 0:\nList\
  \ now contains:\n0 0 0\n```\n\n# 显示 18.5 使用 list 模板类\n\n注意，如果我们将 `list` 和 `list<int>`\
  \ 分别替换为 `vector` 和 `vector<int>`，[显示 18.5] 将完全相同的编译并运行。这种使用的统一性是 STL 语法的关键部分。\n\n\
  然而，vector 和 list 容器之间存在差异。主要差异之一是 vector 容器具有随机访问迭代器，而 list 容器只有双向迭代器。例如，如果你从使用随机访问的[显示\
  \ 18.2]开始，将所有的 `vector` 和 `vector<char>` 分别替换为 `list` 和 `list<char>`，然后编译该程序，你将得到编译错误。（即使你删除了包含\
  \ `container[i]` 或 `container[2]` 的语句，你也会收到错误信息。）\n\n\n\n\n\nSTL 的基本序列容器模板类在显示 18.6\
  \ 中给出。一些成员函数的示例在显示 18.7 中。其他容器（如栈和队列）可以通过在“容器适配器 `stack` 和 `queue`”小节中讨论的技术从这些类中获得。所有序列模板类都有一个析构函数，返回存储以便回收。\n\
  \n| `模板类名称` | `迭代器类型名称` | `迭代器种类` | `库头文件` |\n| --- | --- | --- | --- |\n| `slist`\
  \ | `slist<T>::iterator` | `可变向前` | `<slist>` |\n| `警告：slist 不是 STL 的一部分。` | `slist<T>::const_iterator`\
  \ | `常量向前` | `取决于实现且可能不可。` |\n| `list` | `list<T>::iterator` | `可变双向` | `<list>`\
  \ |\n| | `list<T>::const_iterator` | `常量双向` | |\n| | `list<T>::reverse_iterator`\
  \ | `可变双向` | |\n| | `list<T>::const_reverse_iterator` | `常量双向` | |\n| `vector` |\
  \ `vector<T>::iterator` | `可变随机访问` | `<vector>` |\n| | `vector<T>::const_iterator`\
  \ | `常量随机访问` | |\n| | `vector<T>::reverse_iterator` | `可变随机访问` | |\n| | `vector<T>::const_reverse_iterator`\
  \ | `常量随机访问` | |\n| `deque` | `deque<T>::iterator` | `可变随机访问` | `<deque>` |\n| |\
  \ `deque<T>::const_iterator` | `常量随机访问` | |\n| | `deque<T>::reverse_iterator` |\
  \ `可变随机访问` | |\n| | `deque<T>::const_reverse_iterator` | `常量随机访问` | |\n\n# 显示 18.6\
  \ STL 基础序列容器\n\n| `成员函数 (c 是容器对象)` | `含义` |\n| --- | --- |\n| `c.size()` | `返回容器中的元素数量。`\
  \ |\n| `c.begin()` | `返回一个指向容器中第一个元素的迭代器。` |\n| `c.end()` | `返回一个指向容器最后一个元素之后位置的迭代器。`\
  \ |\n| `c.rbegin()` | `返回一个指向容器中最后一个元素的迭代器。配合 reverse_iterator 使用。不是 slist 的成员。`\
  \ |\n| `c.rend()` | `返回一个指向容器中第一个元素之后位置的迭代器。配合 reverse_iterator 使用。不是 slist 的成员。`\
  \ |\n| `c.push_back(Element)` | `在序列末尾插入 Element。不是 slist 的成员。` |\n| `c.push_front(Element)`\
  \ | `在序列头部插入 Element。不是 vector 的成员。` |\n| `c.insert(Iterator, Element)` | `在 Iterator\
  \ 位置之前插入 Element 的拷贝。` |\n| `c.erase(Iterator)` | `删除 Iterator 处的元素。返回一个指向紧随其位置的元素的迭代器。如果删除的是最后一个元素，则返回\
  \ c.end()。` |\n| `c.clear()` | `一个移除容器中所有元素的空函数。` |\n| `c.front()` | `返回指向序列头部元素的引用。等于\
  \ *(c.begin())`。` |\n| `c1 == c2` | `如果 c1.size() == c2.size() 且 c1 的每个元素都等于 c2\
  \ 对应的元素，则为真。` |\n| `c1 != c2` | `!(c1 == c2)` |\n\n<本节讨论的所有序列容器都具有默认构造函数、拷贝构造函数以及各种用于初始化容器为默认或指定元素的构造函数。它们还都有一个返回所有存储以便回收的析构函数和一个行为良好的赋值运算符。>\n\
  \n# 显示 18.7 部分序列容器成员函数\n\n`deque`，读作“d-queue”或“deck”，代表“双端队列”。deque 是一种“超级队列”。在队列中，你从数据序列的一端添加数据并在另一端移除数据。在\
  \ deque 中，你可以从任一端添加数据，也可以从任一端移除数据。模板类 `deque` 是双端队列的模板类，带有一个用于存储数据类型的参数。\n\n# 编程提示\
  \ 容器中的类型定义\n\nSTL 容器类包含了在用这些类进行编程时非常有用的类型定义。我们已经看到 STL 容器类可能包含 `iterator`、`const_iterator`、`reverse_iterator`\
  \ 和 `const_reverse_iterator` 等类型定义。模板类 `deque` 是双端队列的模板类，带有一个用于存储数据类型的参数。`value_type`\
  \ 是存储在容器中的元素类型。正如我们在 fileP7001013976000000000000000007D4C.xhtml_P70010139760000000000000000007DA0)中指出的，`size_type`\
  \ 是容器大小的类型。`reference_type` 和 `const_reference_type` 也为了方便而定义。\n\n### 自测练习\n\n7.\
  \ `vector` 和 `list` 之间的主要区别是什么？\n8. 哪些模板类 `slist、list、vector、deque` 具有 `push_back`？\n\
  9. 哪些模板类 `slist、list、vector、deque` 具有随机访问迭代器？\n10. 哪些类 `slist、list、vector、deque`\
  \ 具有可变迭代器？\n\n# 容器适配适配器 `stack` 和 `queue`\n\n容器适配器是构建在其他类之上的模板类。例如，`stack` 模板类默认实现在\
  \ `deque` 之上，数据存储在那里。然而，你被屏蔽了这一细节，将栈视为简单的后进先出数据结构。\n\n其他容器适配器类是 `queue` 和 `priority_queue`。栈和队列在[第\
  \ 8 章中讨论过。**优先级队列**类似于队列，其额外属性是每个条目在添加到队列时都会赋予一个优先级。如果所有条目具有相同的优先级，则从优先级队列中移除元素与队列相同。如果项目具有不同的优先级，则高优先级项目先于低优先级项目移除。我们不会详细讨论优先级队列，但为可能熟悉该概念的人提到这一点。\n\
  \n虽然适配器模板类构建在默认容器类之上，但你可以根据应用程序的需求，出于效率或其他原因指定不同的底层容器。例如，任何序列容器都可以作为 `stack` 的底层容器，任何\
  \ `vector` 以外的序列容器都可以作为 `queue` 的底层容器。`stack` 和 `queue` 的默认底层数据结构都是 `deque`。如果你对底层容器类型满意，那么容器适配器对你来说就像任何其他模板容器类。例如，使用默认底层容器的\
  \ `stack` 模板类类型名称对于 *`int`* 栈是 `stack<*`int`*>`。如果你希望指定底层容器为 `vector` 模板类，则将使用 `stack<*`int`*,\
  \ vector<`*`int`*`>>` 作为类型名称。我们将始终使用默认底层容器。\n\n\n\n\n\n如果你确实指定了底层容器，请注意，C++11 之前的\
  \ C++ 编译器无法编译在类型表达式中没有空格的情况下带有两个 `>` 符号的代码。请使用 `stack<int>` 或 `vector<int> >`（在最后两个\
  \ `>` 之间留一个空格）。不要使用 `stack<int>, vector<int>>`。C++11 编译器在两个 `>` 符号之间不需要留空格。\n\n\
  `stack` 模板类的成员函数和其他细节请参见 显示 18.8。对于 `queue` 模板类，这些细节参见 显示 18.9。使用 `stack` 模板类的简单示例参见\
  \ 显示 18.10。\n\n# 显示 18.8 `Stack` 模板类\n\n## Stack 适配器模板类细节\n\n类型名 `stack<T>` 或 `stack<T,\
  \ Underlying_Container>`，用于类型为 `T` 的元素的栈。\n\n库头文件：`<stack>`，其定义在 `std` 命名空间中。\n\n\
  定义类型：`value_type`、`size_type`。\n\n没有迭代器。\n\n### 示例成员函数\n\n| `成员函数 (s 是 Stack 对象)`\
  \ | `含义` |\n| --- | --- |\n| `s.size()` | `返回栈中元素的数量。` |\n| `s.empty()` | `如果栈为空则返回\
  \ `true`；否则返回 `false`。` |\n| `s.top()` | `返回指向栈顶成员的可变引用。` |\n| `s.push(Element)`\
  \ | `在栈顶插入 `Element` 的拷贝。` |\n| `s.pop()` | `移除栈顶的元素。注意 `pop` 是一个 void 函数。它不返回被移除的元素。`\
  \ |\n| `s1 == s2` | `如果 `s1.size() == s2.size()` 且 `s1` 的每个元素都等于 `s2` 的对应元素，则返回\
  \ `true`；否则返回 `false`。` |\n\n`stack` 模板类还有一个默认构造函数、拷贝构造函数，以及一个接受任何序列容器类对象的构造函数，并将栈初始化为序列中的元素。它还拥有析构函数（用于返回所有存储以供回收）以及一个行为良好的赋值运算符。\n\
  \n# 显示 18.9 `Queue` 模板类\n\n## Queue 适配器模板类细节\n\n类型名 `queue<T>` 或 `queue<T, Underlying_Container>`，用于类型为\
  \ `T` 的元素的队列。\n\n出于效率考虑，`Underlying_Container` 不能是 vector 类型。\n\n库头文件：`<queue>`，其定义在\
  \ `std` 命名空间中。\n\n定义类型：`value_type`、`size_type`。\n\n没有迭代器。\n\n### 示例成员函数\n\n| `成员函数\
  \ (q 是 Queue 对象)` | `含义` |\n| --- | --- |\n| `q.size()` | `返回队列中元素的数量。` |\n| `q.empty()`\
  \ | `如果队列为空则返回 `true`；否则返回 `false`。` |\n| `q.front()` | `返回指向队列头部的可变引用。` |\n| `q.back()`\
  \ | `返回指向队列尾的可变引用。` |\n| `q.push(Element)` | `将 `Element` 添加到队列尾。` |\n| `q.pop()`\
  \ | `移除队列头部元素。注意 `pop` 是一个 void 函数。它不返回被移除的元素。` |\n| `q1 == q2` | `如果 `q1.size()\
  \ == q2.size()` 且 `q1` 的每个元素都等于 `q2` 的对应元素，则返回 `true`；否则返回 `false`。` |\n\n`queue`\
  \ 模板类还有一个默认构造函数、拷贝构造函数，以及一个接受任何序列容器类对象的构造函数，并将栈初始化为序列中的元素。它还拥有析构函数（用于返回所有存储以供回收）以及一个行为良好的赋值运算符。\n\
