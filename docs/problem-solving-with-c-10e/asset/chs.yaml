  最终读取到的值 = 75\n```\n\n# 显示 8.3 健壮的输入函数\n\n显示 8.2 中的 `readAndClean` 函数和 显示 8.3 中的\
  \ `getInt` 函数是你可以通过将数值输入读取字符串值来设计的各种输入函数的示例。本章末的编程项目 3 要求你定义一个与 `getInt` 类似的函数，它读取\
  \ `double` 类型的数字，而不是 `int` 类型数字。为了编写该函数，如果能有一个预定义的函数可以将字符串值转换为 `double` 类型数字，就太好了。幸运的是，预定义函数\
  \ `atof`（它位于包含头文件 `cstdlib` 的库中）正是此用。例如，`atof (\"9.99\")` 返回 `double` 类型的值 `9.99`。如果参数不对应于\
  \ `double` 类型数字，则 `atof` 返回 `0.0`。`atof` 的读音是“A to F”，它是“alphabetic to floating\
  \ point”（字母到浮点）的缩写。请记住，带有小数点的数字通常被称为*浮点*数，这是因为计算机在内存中存储这些数字时处理小数点的方式。\n\n# 8.2 标准\
  \ `string` 类\n\n> 我试着捕捉我们说的每一个句子、每一个词，并迅速地将这些句子和词锁在我的文学宝库中，因为它们可能会派上用场。\n\n—— 安东·契诃霍夫，《海鸥》\n\
  \n在第 8.1 节 中，我们引入了 C 字符串。这些 C 字符串简单来说是以空字符 `'\\0'` 终止的字符数组。为了操作这些 C 字符串，你需要担心处理数组的所有细节。例如，当你想要向\
  \ C 字符串中添加字符而数组中没有足够的空间时，你必须创建另一个数组来容纳这个更长的字符串。简而言之，C 字符串要求程序员跟踪 C 字符串在内存中存储的所有低级细节。这是大量的额外工作和错误的来源。\n\
  \nC++ 的 ANSI/ISO 标准规定，C++ 必须也有一个 `string` 类，允许程序员将字符串视为基本类型，而无需担心实现细节。在本节中，我们向你介绍这种\
  \ `string` 类型。\n\n# 标准 `string` 简介\n\n`string` 类定义在名为 `<string>` 的库中，定义存放在 `std`\
  \ 命名空间中。因此，为了使用 `string` 类，你的代码必须包含以下内容（或更少）：\n\n```cpp\n#include <string>\nusing\
  \ namespace std;\n```\n\n`string` 类允许你像处理简单类型的值一样处理字符串值和字符串表达式。你可以使用 `=` 运算符给字符串赋值，并可以使用\
  \ `+` 号拼接两个字符串。例如，假设 `s1`、`s2` 和 `s3` 是 `string` 类型的对象，且 `s1` 和 `s2` 都有字符串值。那么 `s3`\
  \ 就可以设置为 `s1` 中的字符串值紧随连接上 `s2` 中的字符串值的拼接结果：\n\n```cpp\ns3 = s1 + s2;\n```\n\n不需要担心\
  \ `s3` 因为太小而无法容纳其新的字符串值。如果 `s1` 和 `s2` 的长度之和超过 `s3` 的容量，则会自动为 `s3` 分配更多空间。正如我们之前提到的，引号字符串实际上是\
  \ C 字符串，因此它们在字面上并不是 `string` 类型。然而，C++ 提供了引号字符串到 `string` 类型值的自动类型转换。因此，你可以像使用 `string`\
  \ 字面量值一样使用引号字符串，大多数其他地方通常会将引号字符串看作 `string` 类型的值。例如，\n\n```cpp\ns3 = \"Hello Mom!\"\
  ;\n```\n\n将字符串变量 `s3` 的值设置为一个与 C 字符串 `\"Hello Mom!\"` 相同字符的字符串对象。\n\n`string` 类有一个默认构造函数，可以将\
  \ `string` 对象初始化为空字符串。`string` 类还有一个第二个构造函数，它接受一个标准 C 字符串作为参数。\n\n\n\n\n你可以使用插入运算符\
  \ `<<` 和 `cout` 来输出 `string` 对象，就像你输出其他类型的数据一样。这在显示 8.4 中所示。使用 `string` 类进行输入要稍微微妙一些。\n\
  \n提取运算符 `>>` 和 `cin` 对 `string` 对象的工作方式与其他数据相同，但请记住，提取运算符会忽略初始空白字符，并在遇到更多空白字符时停止读取。这对于字符串和其它数据都是如此。例如，考虑以下代码：\n\
  \n```\nstring s1, s2;\ncin >> s1;\ncin >> s2;\n```\n\n如果用户输入：\n\n```\nMay the hair\
  \ on your toes grow long and curly!\n```\n\n那么 `s1` 将接收值 `\"May\"`，并删除任何前导（或尾随）空白字符。变量\
  \ `s2` 接收字符串 `\"the\"`。使用提取运算符 `>>` 和 `cin`，你只能读取单词；你无法读取整行或其他包含空格的字符串。有时这正是你想要的，但有时这完全不是你想要的。\n\
  \n如果你想让程序读取整行输入到 `string` 类型的变量中，可以使用函数 `getline`。在 `string` 对象上使用 `getline` 的语法与我们在第\
  \ 8.1 节中为 C 字符串描述的有所不同。你不使用 `cin.getline`；而是将 `cin` 作为 `getline` 的第一个参数。¹¹（因此，此版本的\
  \ `getline` 不是成员函数。）\n\n```\nstring line;\ncout << \"Enter a line of input:\\n\"\
  ;\ngetline(cin, line);\ncout << line << \"END OF OUTPUT\\n\";\n```\n\n当嵌入到完整的程序时，这段代码会产生如下对话：\n\
  \n```\nEnter some input:\nDo bedo to you!\nDo bedo to you!END OF OUTPUT\n```\n\n\
  如果行中有前导或尾随空白，那么它们也将是 `getline` 读取的字符串值的一部分。此版本的 `getline` 位于库 `<string>` 中。你可以使用连接到文本文件的流对象代替\
  \ `cin`，以便使用 `getline` 从文件进行输入。\n\n你不能使用 `cin` 和 `>>` 读取空白字符。如果你想一次读取一个字符，可以使用 `cin.get`，我们在第\
  \ 6 章中讨论过。函数 `cin.get` 读取的是 `char` 类型的值，而不是 `string` 类型的值，但在处理 `string` 输入时它很有帮助。显示\
  \ 8.5 包含一个演示了用于 `string` 输入的 `getline` 和 `cin.get` 的程序。函数 `newLine` 的意义在名为“混合 cin\
  \ `>>` 变量和 getline”的陷阱小节中解释。\n\n```\n 1\t //Demonstrates getline and cin.get.\n\
  \ 2\t  #include <iostream>\n 3\t  #include <string>\n 4\t  void newLine( );\n 5\t\
  \  int main( )\n 6\t  {\n 7\t  using namespace std;\n 8\t   \n 9\t  string firstName,\
  \ lastName, recordName;\n10\t\t  string motto = \"Your records are our records.\"\
  ;\n11\t\t  cout << \"Enter your first and last name:\\n\";\n12\t\t  cin >> firstName>>lastName;\n\
  13\t\t  newLine( );\n14\t\t  recordName = lastName + \", \" + firstName;\n15\t\t\
  \  cout << \"Your name in our records is: \";\n16\t\t  cout << recordName<<endl;\n\
  17\t\t  cout << \"Our motto is\\n\"\n18\t\t\t   << motto <<endl;\n19\t\t  cout <<\
  \ \"Please suggest a better (one-line) motto:\\n\";\n20\t\t  getline(cin, motto);\n\
  21\t\t  cout << \"Our new motto will be:\\n\";\n22\t\t  cout << motto <<endl;\n\
  23\t\t  return 0;\n24\t  }\n 25\t   \n 26\t  //Uses iostream:\n 27\t  void newLine(\
  \ )\n 28\t  {\n 29\t\t  using namespace  std;\n 30\t   \n31\t\tchar nextChar;\n\
  32\t\t  do\n33\t\t  {\n34\t\t\t  cin.get(nextChar);\n35\t\t  } while (nextChar !=\
  \ '\\n');\n36\t  }\n```\n\n***示例对话***\n\n```\nEnter your first and last name:\n\
  B'Elanna Torres\nYour name in our records is: Torres, B'Elanna\nOur motto is\nYour\
  \ records are our records.\nPlease suggest a better (one-line) motto:\nOur records\
  \ go where no records dared to go before.\nOur new motto will be:\nOur records go\
  \ where no records dared to go before.\n```\n\n# 使用 string 类的显示 8.5\n\n### 自测练习\n\
  \n15. 考虑以下代码（假设它被嵌入到一个完整的程序并运行）：\n\n```\nstring s1, s2;\ncout << \"Enter a line\
  \ of input:\\n\";\ncin >> s1 >> s2;\ncout << s1 << \"*\" << s2 << \"<END OF OUTPUT\"\
  ;\n```\n\n如果对话如下，下一行输出是什么？\n\n```\nEnter a line of input:\nA string is joy!\n```\n\
  \n16. 考虑以下代码（假设它被嵌入到一个完整的程序并运行）：\n\n```\nstring s1, s2;\n```\n\n如果对话如下，下一行输出是什么？\n\
  \n```\nEnter a line of input:\nA string is joy!\n```\n\n\n\n\n显示 8.6 也说明了成员函数 `length`。每个\
  \ `string` 对象都有一个名为 `length` 的成员函数，它不接受参数并返回 `string` 对象所表示的字符串的长度。因此，`string` 对象不仅可以像数组一样使用，而且\
  \ `length` 成员函数使其行为得像一个部分填充的数组，自动跟踪已占用多少个位置。\n\n当与 `string` 类对象一起使用时，数组方括号不会检查非法索引。如果你使用非法索引（即大于或等于对象中字符串长度的索引），那么产生的结果将是不可预测的，但注定是糟糕的。你可能会得到奇怪的行为，而没有任何错误消息告诉你问题是非法索引值。\n\
  \n有一个名为 `at` 的成员函数，它可以检查非法索引值。该成员函数的行为基本上与方括号相同，但两点不同：你对 `at` 使用函数符号，因此不是使用 `a[i]`，而是使用\
  \ `a.at(i)`；并且 `at` 成员函数会检查 `i` 是否评估为非法索引。如果 `a.at(i)` 中 `i` 的值为非法索引，你应该得到一个运行时错误消息，告诉哪里错了。在下面的两个示例代码段中，尝试的访问超出范围，但其中第一个可能不会产生错误消息，尽管它将访问一个不存在的索引变量：\n\
  \n```\nstring str(\"Mary\");\ncout << str[6] << endl;\n```\n\n然而，第二个示例将导致程序异常终止，因此你至少知道出了问题：\n\
  \n```\nstring str(\"Mary\");\ncout << str.at(6) << endl;\n```\n\n但请注意，当 `str.at(i)`\
  \ 有有非法索引 `i` 时，某些系统提供的错误消息非常糟糕。\n\n你可以通过为索引变量（如 `str[i]`）分配一个 `char` 值来更改字符串中的单个字符。这也可以通过成员函数\
  \ `at` 完成。例如，要将 `string` 对象 `str` 中的第三个字符更改为 `'X'`，你可以使用以下代码段之一：\n\n```\nstr.at(2)\
  \ = 'X';\n```\n\n或者\n\n```\nstr[2] = 'X';\n```\n\n与普通的字符数组一样，`string` 类型对象的字符位置从\
  \ 0 开始索引，因此 `string` 中的第三个字符位于索引位置 2。\n\n显示 8.7 给出了 `string` 类成员函数的部分列表。在许多方面，`string`\
  \ 类对象的行为比我们在第 8.1 节中引入的 C 字符串更好。特别是，`string` 类对象上的 `==` 运算符返回的结果符合我们对字符串相等的直观理解——即，如果两个字符串包含相同顺序的相同字符，则返回\
  \ `true`，否则返回 `false`。同样地，比较运算符 `<`, `>`, `=`, `>=` 使用字典序比较字符串对象。（字典序是使用附录 3 中 ASCII\
  \ 字符集中给出的符号顺序进行的字母表顺序排序。如果字符串全部由字母组成，且都全为大写字母或全为小写字母，那么对于这种情况，字典序与日常的字母顺序相同。）\n\n\
  | 示例 | 备注 |\n| --- | --- |\n| **构造函数** | |\n| `string str;` | 默认构造函数创建一个空字符串对象 `str`。\
  \ |\n| `string str(\"sample\");` | 创建一个带有数据“sample”的字符串对象。 |\n| `string str(aString);`\
  \ | 创建一个作为 `aString` 拷贝的字符串对象 `str`；`aString` 是 `string` 类的对象。 |\n| **访问器** | |\n\
  | `str[i]` | 返回 `str` 中索引 `i` 处字符的读/写引用。不检查非法索引。 |\n| `str.at(i)` | 返回 `str` 中索引\
  \ `i` 处字符的读/写引用。与 `str[i]` 相同，但此版本检查非法索引。 |\n| `str.substr(position, length)` |\
  \ 返回从调用对象的 `position` 位置开始且具有 `length` 个字符的子字符串。 |\n| `str.length()` | 返回 `str`\
  \ 的长度。 |\n| **赋值/修改器** | |\n| `string str1 = str2;` | 将 `str1` 初始化为 `str2`。 |\n\
  | `str1 += str2;` | 将 `str2` 拼接到 `str1` 的末尾。 |\n| `str.empty()` | 如果 `str` 为空则返回\
  \ `true`；否则返回 `false`。 |\n| `str1 + str2` | 返回一个将 `str2` 拼接到 `str1` 后的字符串。 |\n|\
  \ `str.insert(pos, str2);` | 在 `pos` 处向 `str` 插入 `str2`。 |\n| `str.erase(pos, length);`\
  \ | 从 `pos` 开始删除长度为 `length` 的子字符串。 |\n| **比较** | |\n| `str1 == str2` `str1 != str2`\
  \ | 比较相等或不等；返回布尔值。 |\n| `str1 < str2` `str1 > str2` | 四种比较。都是字典序。 |\n| `str1 <=\
  \ str2` `str1 >= str2` | |\n| **查找** | |\n| `str.find(str1)` | 返回 `str1` 在 `str`\
  \ 中首次出现的索引。如果未找到 `str1`，则返回特殊值 `string::npos`。 |\n| `str.find(str1, pos)` | 返回 `str1`\
  \ 在 `str` 中从 `pos` 开始的首次出现的索引。 |\n| `str.find_first_of(str1, pos)` | 返回从 `pos` 开始的，在\
  \ `str` 中任何属于 `str1` 字符的首次出现索引。 |\n| `str.find_first_not_of(str1, pos)` | 返回从 `pos`\
  \ 开始的，在 `str` 中任何不在 `str1` 中的字符的首次出现索引。 |\n\n# 显示 8.7 标准类 `string` 的成员函数\n\n# 编程示例回文测试\n\
  \n显示 8.8 测试输入字符串以判断其是否为回文。我们的回文测试将忽略所有空格和标点符号，并在判断内容是否为回文时，会将字母的大写和小写版本视为相同。一些回文示例如下：\n\
  \n```\nAble was I ere I saw Elba.\nI Love Me, Vol. I.\nMadam, I’m Adam.\nA man,\
  \ a plan, a canal, Panama.\nRats live on no evil star.\nradar\ndeed\nmom\nracecar\n\
  ```\n\n\n\n\n```cpp //回文属性的测试。\n#include <iostream>\n#include <string>\n#include\
  \ <cctype>\nusing namespace std;\nvoid swap(char& v1, char& v2);\n// 交换 v1 和 v2\
  \ 的值。\nstring reverse(const string& s);\n// 返回 s 的拷贝，但字符顺序是反的。\nstring removePunct(const\
  \ string& s, const string& punct);\n// 返回 s 的拷贝，并删除字符串 punct\n// 中出现的任何匹配的字符。\n\
  string makeLower(const string& s);\n// 返回 s 的拷贝，将所有大写\n// 字符转换为小写，其他字符保持不变。\nbool\
  \ isPal(const string& s);\n// 如果 s 是回文则返回 true，否则返回 false。\nint main()\n{\n    string\
  \ str;\n    cout << \"输入待回文测试的字符串\\n\"\n         << \"并按回车。\\n\";\n    getline(cin,\
  \ str);\n    if (isPal(str))\n        cout << \"\\\"\" << str + \"\\\" is a palindrome.\"\
  ;\n    else\n        cout << \"\\\"\" << str + \"\\\" is not a palindrome.\";\n\
  \    cout << endl;\n    return 0;\n}\n\nvoid swap(char& v1, char& v2)\n{\n    char\
  \ temp = v1;\n    v1 = v2;\n    v2 = temp;\n}\n\nstring reverse(const string& s)\n\
  {\n    int start = 0;\n    int end = s.length();\n    string temp(s);\n\n    while\
  \ (start < end)\n    {\n        end--;\n        swap(temp[start], temp[end]);\n\
  \        start++;\n    }\n    return temp;\n}\n// 使用 <cctype> 和 <string>\nstring\
  \ makeLower(const string& s)\n{\n    string temp(s);\n    for (int i = 0; i < s.length();\
  \ i++)\n        temp[i] = tolower(s[i]);\n    return temp;\n}\nstring removePunct(const\
  \ string& s, const string& punct)\n{\n    string noPunct; // 初始化为空字符串\n    int sLength\
  \ = s.length();\n    int punctLength = punct.length();\n    for (int i = 0; i <\
  \ sLength; i++)\n    {\n        string aChar = s.substr(i, 1); // 一个单字符字符串\n   \
  \     int location = punct.find(aChar, 0);\n        // 在 punct 中查找源字符串\n       \
  \ // 连续字符的位置。\n        if (location < 0 || location >= punctLength)\n          \
  \  noPunct = noPunct + aChar; // aChar 不在 punct 中，所以保留它\n    }\n    return noPunct;\n\
  }\n\n// 使用函数 makeLower, removePunct\nbool isPal(const string& s)\n{\n    string\
  \ punct(\",;:.?!?'\\\" \"); // 包含空格\n    string str(s);\n    str = makeLower(str);\n\
  \    string lowerStr = removePunct(str, punct);\n    return (lowerStr == reverse(lowerStr));\n\
  }\n```\n\n***示例对话***\n\n```\n输入待回文测试的字符串\n并按回车。\nMadam, I'm Adam.\n\"Madam, I'm\
  \ Adam.\" is a palindrome.\n```\n\n***示例对话***\n\n```\n输入待回文测试的字符串\n并按回车。\nRadar\n\
  \"Radar\" is a palindrome.\n```\n\n***示例对话***\n\n```\n输入待回文测试的字符串\n并按回车。\nAm I a\
  \ palindrome?\n\"Am I a palindrome?\" is not a palindrome.\n```\n\n# 显示 8.8 回文测试程序\n\
  \n`removePunct` 函数的关注点在于，它使用了字符串成员函数 `substr` 和 `find`。成员函数 `substr` 根据给定的子字符串的位置和长度，从调用对象中提取子字符串。\n\
  \n`removePunct` 的前三行声明了函数中使用的变量。`for` 循环逐遍历参数的字符，并尝试在 `punct` 字符串中查找它们。\n\n\n\n\n\
  \n符号 `vector<Base_Type>` 是一个 `template class`（模板类），这意味着你可以为 `Base_Type` 任何类型，并生成一个该基类型的\
  \ vector 类。你可以将其理解为像为数组指定基类型一样，为 vector 指定基类型。你可以使用任何类型（包括类类型）作为 vector 的基类型。符号\
  \ `vector<int>` 是一个 `class name`（类名），因此之前将 `v` 声明为 `vector<int>` 的 vector 包含了对类\
  \ `vector<int>` 默认构造函数的调用，这会创建一个空的 vector 对象（不包含元素）。\n\n## 访问元素\n\nvector 元素的索引从\
  \ 0 开始，与数组相同。可以使用数组的方括号符号来读取或更改这些元素，就像在数组中一样。例如，以下代码更改了 vector `v` 中第 `i` 个元素的值，然后输出该更改后的值。（`i`\
  \ 是一个 `int` 变量。）\n\n```\nv[i] = 42;\ncout << \"The answer is \" << v[i];\n```\n\n\
  然而，在 vector 上使用这种方括号符号有一个限制，这与数组中的相同用法不同。你可以使用 `v[i]` 来更改第 `i` 个元素的值。但你不能使用 `v[i]`\
  \ 初始化第 `i` 个元素；你只能更改已经赋予了某些值的元素。要在 vector 的某个索引位置首次添加元素，你通常会使用成员函数 `push_back`。\n\
  \n你按照位置顺序向 vector 添加元素，首先是位置 `0`，然后是位置 `1`、`2`，以此此类推。成员函数 `push_back` 将元素添加到下一个可用位置。例如，以下代码为\
  \ vector `sample` 的元素 `0`、`1` 和 `2` 了初始值：\n\n```\nvector<double> sample;\nsample.push_back(0.0);\n\
  sample.push_back(1.1);\nsample.push_back(2.2);\n```\n\n在 C++11 中，我们可以像初始化数组一样初始化\
  \ vector：\n\n```cpp\nvector<double> sample = {0.0, 1.1, 2.2};\n```\n\nvector 中的元素数量被称为\
  \ vector 的 **size**（大小）。可以使用成员函数 `size` 来确定 vector 中有多少个元素。例如，在执行上述代码后，`sample.size(\
  \ )` 返回 `3`。你可以如下所示列出当前 vector `sample` 中的所有元素：\n\n```\nfor (int i = 0; i < sample.size(\
  \ ); i++)\n\tcout << sample[i] << endl;\n```\n\n函数 `size` 返回一个类型为 `unsigned int`\
  \ 的值，而不是 `int` 类型。（`unsigned int` 类型只允许非负整数值）。当需要类型为 `int` 类型时，此返回值应自动转换为 `int`\
  \ 类型，但某些编译器可能会警告你，在需要 `int` 的地方使用了 `unsigned int`。如果你想非常稳妥，可以始终应用类型强制转换将返回的 `unsigned\
  \ int` 转换为 `int`，或者像在这种 `for` 循环中，使用类型为 `unsigned int` 的循环控制变量如下所示：\n\n```\nfor\
  \ (unsigned int  i = 0; i < sample.size( ); i++)\n\tcout << sample[i] << endl;\n\
  ```\n\n等价地，我们可以使用范围 `for` 循环：\n\n```cpp\nfor (auto\ti : sample)\n\tcout << i <<\
  \ endl;\n```\n\n显示 8.9 提供了一个说明一些基本 vector 技术的简单演示。\n\n```cpp\n 1\t #include <iostream>\n\
  \ 2\t  #include <vector>\n 3\t  using namespace std;\n\n 4\t  int main( )\n 5\t\
  \  {\n 6\t\t  vector<int> v;\n 7\t  cout << \"Enter a list of positive numbers.\\\
  n\"\n 8\t\t\t   << \"Place a negative number at the end.\\n\";\n\n 9\t\t  int next;\n\
  10\t\t  cin >> next;\n11\t\t  while (next > 0)\n12\t\t  {\n13\t\t\t  v.push_back(next);\n\
  14\t\t\t  cout << next << \" added. \";\n15\t\t\t  cout << \"v.size( ) = \" <<v.size(\
  \ ) <<endl;\n16\t\t\t  cin >> next;\n17\t\t  }\n\n18\t\t  cout << \"You entered:\\\
  n\";\n19\t\t  for (unsigned int i = 0; i <v.size( ); i++)\n20\t\t\t  cout v[i] <<\
  \ \" \";\n21\t\t  cout << endl;\n\n22\t\t  return 0;\n23\t  }\n```\n\n***示例对话***\n\
