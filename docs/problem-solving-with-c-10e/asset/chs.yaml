  \n参数修饰符 `const` 可以用于任何类型的参数；然而，它通常只用于类的按引用传递参数（偶尔也用于某些对应参数较大的其他参数）。\n\n在调用函数时，按引用传递的参数会被参数替换，且函数调用可能会（也可能不会）更改参数的值。当你调用成员函数时，调用对象的行为非常像按引用传递的参数。当你调用成员函数时，该函数调用可以改变调用对象的值。例如，考虑以下情况，其中类\
