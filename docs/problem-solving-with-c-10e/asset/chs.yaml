  \ 17 章\n- **标准模板库**：第 18 章\n\n# 学生的易读性\n\n一本书仅仅按照正确的顺序介绍正确的主题是不够的。即使在教师或其他资深程序员阅读时保持清晰和正确也是不够的。这些内容需要以一种初学者易于理解的方式呈现。在这本入门教材中，我努力用学生认为清晰且友好的方式写作。使用过本书早期版本的学生报告证实，这种风格使内容变得清晰，往往让学生觉得很有趣。\n\
  \n# ANSI/ISO C++ 标准\n\n本版本完全兼容符合最新 ANSI/ISO C++ 标准的编译器。在编写时，最新标准是 `C++14`。\n\n#\
  \ 高级主题\n\n许多“高级主题”正在成为标准 CS1 课程的一部分。即使它们不是课程的一部分，将它们作为补充材料出现在书中也是好的。本书提供了许多可以集成到课程中或作为补充主题的高级主题。它涵盖了\
  \ C++ 模板、继承（包括虚函数）、异常处理、`STL`（标准模板库）、线程、正则表达式和智能指针。尽管本书使用了库并教给学生库的重要性，但它并不需要任何非标准库。本书仅使用所有\
  \ C++ 实现都提供的库。\n\n# 依赖图\n\n下一页的依赖图显示了章节和子节的可能顺序。连接两个框的线意味着在覆盖下方框之前必须覆盖上方框。任何与此部分排序一致的排序都可以不丢失连续性进行阅读。如果框包含一个或多个节编号，则该框仅指这些节，而不是整个章节。\n\
  \n# 总结框\n\n每个要点都总结在一个框中。这些总结框穿插在每个章节中。\n\n# 自测试\n\n每个章节在战略位置都包含许多自测试题。所有自测试题的完整答案都位于每章的末尾。\n\
