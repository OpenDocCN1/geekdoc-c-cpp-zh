  \ 11 那样总是假设飞机有 7 行）。\n\n4. 写一个函数，接受 C 字符串作为输入参数并反转该字符串。该函数应使用两个指针，`front` 和 `rear`。`front`\
  \ 指针初始应指向字符串中的第一个字符，`rear` 指针初始应指向字符串中的最后一个字符。通过交换 `front` 和 `rear` 所引的字符来反转字符串，然后递增\
  \ `front` 指向下一个字符并递减 `rear` 指向前一个字符，以此此类推，直到整个字符串反转。编写一个主程序在各种偶数和奇数长度的字符串上测试你的函数。\n\
