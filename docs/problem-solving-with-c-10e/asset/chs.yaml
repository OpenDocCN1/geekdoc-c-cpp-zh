  \ 的值设置为 9\n    并将 numberOfPeople 的值设置为 2。\n    程序是如何做到的并不重要。>\ncandyPerPerson =\n\
  \     static_cast<double>(totalCandy);\n```\n\n注意 `static_cast<double>(totalCandy)`\
  \ 的位置；如果 `candyPerPerson` 是 `double` 类型的变量，那么以下写法是等价的\n\n# 旧的转换形式\n\n使用 `static_cast<double>(totalCandy)`\
