  \ + 8 = 10。\n\n    ```\n    int getMonthValue(int month, int year);\n    ```\n\n\
  \    该函数应根据下表返回值，并需要调用 `isLeapYear` 函数。\n\n    ![显示月份返回值的表格](img/p302-1.png)\n\n\
  \    最后，为了计算星期，计算日期加上 `getMonthValue`、`getYearValue` 和 `getCenturyValue` 的和。除除以\
