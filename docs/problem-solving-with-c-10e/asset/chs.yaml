  \ 循环\n\n## 增和自减运算符\n\n`while` 语句执行时首先发生的情况是检查布尔表达式。如果当 `while` 语句开始时布尔表达式为假，则循环体将永远不会执行。这正是显示\
  \ 2.12 中示例对话 3 中发生的情况。在许多编程场景中，你可能希望循环体有零次执行。例如，如果你的 `while` 循环正在读取一个包含考试中所有不及格分的列表，而没有人不及格，那么你就希望循环体执行零次。\n\
  \n正如我们刚刚注意到的，`while` 循环可能会执行零次循环体，这通常是你想要的。反相反，如果你知道在*所有情况下*你的循环体都应该至少执行一次，那么你可以使用\
