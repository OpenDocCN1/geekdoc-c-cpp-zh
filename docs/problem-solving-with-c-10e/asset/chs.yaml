  \n13. 编写一个名为 `one_more` 的函数定义，该函数有一个用于整数数组的形式化参数，并将每个数组元素的值加 1。添加任何其他需要的形式参数。\n\n\
  14. 考虑以下函数定义：\n\n    ```cpp\n    void too2(int a[ ], int howMany)\n    {\n     \
