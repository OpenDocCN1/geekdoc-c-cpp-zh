    \n## SQL 注入\n\nSQL 注入是一种非常糟糕的东西。这是一种安全漏洞，黑客可以利用代码中的漏洞深入你的数据库。MySQL 数据库在 PHP 代码中实现，了解你应该避免的事项可以帮助编写安全代码。\n\
