- fmt: "\nDid you know that your data tables in Microsoft Access 2007 can be used\
    \ to control your Access 2007 program and write code for you, if they contain\
    \ metadata? Metadata is data about data. You have actually been storing and using\
    \ metadata since you started using Access 2007. When you choose a color for a\
    \ form textbox label, you are instructing Access 2007 to remember this color and\
    \ run program code that creates that color each time that label is shown. Here\
    \ is an example of how you could save yourself from writing many lines of code\
    \ by using metadata that you have stored in an Access 2007 data table. Here is\
    \ an example of using metadata. You have some reports to be printed every Tuesday\
    \ and some that need to be printed every Friday. You could write some Access 2007\
    \ code to print the Tuesday reports by writing:\n\n```\nIf Weekday(Date) = 3 then\
    \ 'It's Tuesday'\nDoCmd.OpenReport \"Tuesday Report A\"\nDoCmd.OpenReport \"Tuesday\
    \ Report B\"\nDoCmd.OpenReport \"Tuesday Report C\"\nDoCmd.OpenReport \"Tuesday\
    \ Report D\"\nDoCmd.OpenReport \"Tuesday Report E\"\nEnd if\n```\n\nYou would\
    \ then write some more code for Friday reports:\n\n```\nIf Weekday(Date) = 6 then\
    \ 'It's Friday'\nDoCmd.OpenReport \"Tuesday Report A\"\nDoCmd.OpenReport \"Tuesday\
    \ Report B\"\nDoCmd.OpenReport \"Tuesday Report C\"\nDoCmd.OpenReport \"Tuesday\
    \ Report D\"\nDoCmd.OpenReport \"Tuesday Report E\"\nEnd if\n```\n\nNow let's\
    \ write these 14 lines of code with one line 7 lines of code.\n\n```\nDim rs As\
    \ DAO.Recordset\nSet rs = CurrentDb.OpenRecordset(\"Table Name Containing Metadata\"\
    )\nDo Until rs.EOF\n  If ![DayOfWeek] = Weekday(Date) Then\n    DoCmd.OpenReport\
    \ ![ReportName]\n  End If\n  rs.Move\nNext Loop\n```\n\nThese 7 lines of code\
    \ would not need to be changed or added even if the 10 reports increase to 50\
    \ reports in Access 2007 or any other version of Access. The Access 2007 data\
    \ table would only need to store the report name and the day of week, just two\
    \ fields of data. This means easy maintenance and no future code changes.\n\n\
    This technique can be used for running a set of queries with a specified sequence.\
    \ Use metadata when linking to external data sources by including paths, file\
    \ or table names, and specifications. You can automate importing or exporting\
    \ data by storing import and export specifications, formats, and storage paths.\n\
    \n# Advanced Tips to Help PHP Programmers Improve Their Program Code\n\nSince\
    \ it made humble beginnings around two decades ago, PHP programming has witnessed\
    \ a rapid climb, going on to become the most popular programming language for\
    \ all Web Applications. Numerous websites are powered by PHP programming code\
    \ while an overwhelming majority of Web projects and scripts rely on this popular\
    \ language for their development. Owing to the huge popularity of this development\
    \ language, it is seemingly impossible any PHP programmer to say that he lacks\
    \ even the basic working knowledge of PHP. In this tutorial we aim to help those\
    \ at the learning stage of this programming language, willing to roll up sleeves\
    \ and let their hands dirty with this language. These simple tips will help increasing\
    \ the proficiency of the development processes making code cleaner and offering\
    \ optimum levels of performance.\n\n## SQL Injection\n\nSQL Injection is a nasty\
    \ thing. This is a security exploit wherein a hacker can dive into your database\
    \ making the most of vulnerability in code. MySQL database is implemented in PHP\
    \ code being aware of the things you should avoid can help write secure code.\n\
    \n## Differentiate between operators\n\nAn integral part of PHP programming is\
    \ operators. However, some programmers are not as sorting out the difference between\
    \ them. In fact, many claim most programmers are capable of telling the difference\
    \ between operators at first glance! Failure to differentiate between `==` and\
    \ `===` is a bug on the report.\n\n## `replace()` vs `pregreplace()`\n\nFavor\
    \ `replace()` over `pregreplace()`: As far as overall performance is concerned,\
    \ `replace()` proves much more efficient as opposed to regular expressions. In\
    \ fact, statistics show `replace()` improves the efficiency of code by much as\
    \ 61% compared to regular expressions such as `pregreplace()` and `preg()`. However,\
    \ if your code comprises nothing but regular expressions, then `pregreplace()`\
    \ and `preg()` will prove to be much faster and efficient than `replace()` function.\n\
    \n## Use of ternary operators\n\nRather than use if/else statement altogether\
    \ in your programming code, consider the use of a ternary operator. They are effective\
    \ in terms of freeing up a lot of space for better readability of your programs.\
    \ The code looks less cluttered and it is easier to scan it in the future for\
    \ any unexpected errors. However, be careful that you do not have more than one\
    \ operator in a single statement. Very often PHP gets confused regarding its source\
    \ of action in such situations.\n\n## Use a PHP Framework\n\nUse of a PHP framework\
    \ is seemingly impossible for every project you create. However, the use of such\
    \ frameworks as CodeIgniter, Symfony, Zend and CakePHP helps in reducing the time\
    \ required for developing a website. A Web framework is typically software that\
    \ bundles itself along with functionalities that are commonly needed, aiding to\
    \ speed up the development process. By letting a framework handle all of the repetitive\
    \ tasks required for website programming, you can work on the development process\
    \ at a much faster rate. Less coding you have to take care of, lesser will be\
    \ the testing and debugging requirements thus letting you speed up with the overall\
    \ process.\n\n## Make correct use of suppression operator\n\nThe `@` symbol is\
    \ typically the error suppression operator. Place `@` in front of a PHP statement\
    \ and it will suppress all errors in that statement. This is if you have doubt\
    \ over a value but would not want them to show up when the script runs. Many programmers,\
    \ though, often use error suppression in an improper manner. The `@` operator\
    \ is slow and can affect performance. If you are writing code, keep performance\
    \ in mind. While alternative methods exist, the use of `@` operator may result\
    \ in side effects.\n\n## `isset()` vs `strlen()`\n\nRather than use `strlen`,\
    \ if you are to implement a function that checks the length of a string, use `isset()`.\
    \ This allows your function to work as much as the other functions, not that you\
    \ can have a value variable.\n\n## Importance of using comments in PHP\n\nPHP\
    \ is a very versatile language, allowing programmers to make applications according\
    \ to their various tastes. But one thing all programmers should maintain is the\
    \ ability to comment. In essence, commenting saves hours of time reading code\
    \ and is often required by employs. Comments are not parsed by the PHP engine,\
    \ so they are only visible to those who are viewing the original code of the file.\
    \ This is great for documenting what each code block does, while keeping the casual\
    \ visitor to a website oblivious to the comments present on the application they\
    \ are using. Unlike HTML comments, PHP comments are not even visible in the source\
    \ code of a website. HTML comments are visible to the general public, which can\
    \ potentially lead to the stealing of code or even help hackers exploit applications.\
    \ PHP comments aren't output to the browser at all, so they are completely safe\
    \ from prying eyes.\n\nThere are actually three operators that we may use to tell\
    \ the PHP engine that we want to use a comment. Single inline comments can be\
    \ used with `//` and `#` operators. For multiple-line comments, we use `/*` and\
    \ `*/` respectively to indicate what is a comment and what is actually PHP code.\
    \ While the first two operators are synonymous, the last one is used for code\
    \ that requires relatively little work.\n\n## Learning PHP language\n\nLearning\
    \ a new programming language is not difficult if you are familiar with other basic\
