    这确保了我们在使用此指针变量时不会损坏内存。代码的可读性只是可维护性方面的方面之一。编码标准对于程序的可维护性有很大帮助，即我们能够轻松地更改程序。通过编码标准强制的一一致性是实现程序维护成功的关键因素。


    # 为什么需要编码标准？管理概述


    程序员经常被要求在没有标准或质量保证的情况下编写代码。这往往只有在出现重大问题后，人们才会发现那几个月（在某些情况下是几年）的编程工作是徒劳无功的。对所生成的代码进行某些控制是至关重要的——而这从一份文档齐全的编码标准开始。


    无论你有多忙，从长远来看，编码标准都会节省时间——它是良好编程的基础。编码标准与编程生产力是并不悖的。无论使用何种编程语言，遵循编码标准都会显著提高开发生产力。一套一致应用的编码规范将标准化应用程序的结构和编码风格，使程序员能够轻松地阅读和理解其他程序员的代码，以及他们自己的代码。


    良好的编码标准能够产生精确、可读且无歧的源代码，这些代码尽可能保持一致且直观。编码标准的目的是为了使程序易于阅读和理解，而不会用过度的约束和任意的限制限制程序员自然的创造力。


    ## 维护成本


    遵循编码标准不仅能提高系统开发的生产力，还能提高增强和维护系统的生产力。控制维护成本同样重要——这些成本可能占软件整个生命周期成本的大部分。为了降低高昂的维护成本，务必编写出让公司内任何其他程序员都能轻松解读和增强的代码。这很重要，因为通常很少软件是由原程序员维护的。


    ## 执行标准


    所有程序员都应对编码标准达成共识。一旦达成共识，必须作为质量保证的一部分来执行该标准。使用约定的编码技术和良好的编程实践对软件质量和性能起着重要作用。通过一致地应用定义良好的编码标准，事事软件项目的程序员团队更有可能产出易懂、无错、高性价比且易于维护的质量系统代码。


