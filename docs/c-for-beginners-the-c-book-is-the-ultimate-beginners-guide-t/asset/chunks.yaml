    \n## 正确使用错误抑制运算符\n\n`@` 符号通常是错误抑制运算符。在 PHP 语句前放置 `@`，它将抑制该语句中的所有错误。这适用于你对某个值有怀疑，但不希望它们在脚本运行时显示的情况。然而，许多程序员经常以不当的方式使用错误抑制。`@`\
