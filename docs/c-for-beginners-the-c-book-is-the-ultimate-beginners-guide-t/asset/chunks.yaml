  trans: "\n\n你知道吗，Microsoft Access 2007 中的数据表如果包含元数据，就可以被用来控制你的 Access 2007 程序并为你编写代码。元数据是关于数据的数据。从你开始使用\
    \ Access 2007 开始，你实际上一直在存储和使用元数据。当你为表单文本框标签选择一种颜色时，你是在指示 Access 2007 记住这种颜色，并在每次显示该标签时运行创建该颜色的程序代码。这是一个如何使用存储在\
    \ Access 2007 数据表中的元数据来避免自己编写许多行代码的示例。以下是使用元数据的示例。你有一些报告每周二打印，有些需要在每周五打印。你可以编写一些\
    \ Access 2007 代码来打印周二的报告：\n\n```\nIf Weekday(Date) = 3 then 'It's Tuesday'\nDoCmd.OpenReport\
    \ \"Tuesday Report A\"\nDoCmd.OpenReport \"Tuesday Report B\"\nDoCmd.OpenReport\
    \ \"Tuesday Report C\"\nDoCmd.OpenReport \"Tuesday Report D\"\nDoCmd.OpenReport\
    \ \"Tuesday Report E\"\nEnd if\n```\n\n然后你为周五的报告编写更多代码：\n\n```\nIf Weekday(Date)\
    \ = 6 then 'It's Friday'\nDoCmd.OpenReport \"Tuesday Report A\"\nDoCmd.OpenReport\
    \ \"Tuesday Report B\"\nDoCmd.OpenReport \"Tuesday Report C\"\nDoCmd.OpenReport\
    \ \"Tuesday Report D\"\nDoCmd.OpenReport \"Tuesday Report E\"\nEnd if\n```\n\n\
    现在，让我们用 7 行代码代替这 14 行代码。\n\n```\nDim rs As DAO.Recordset\nSet rs = CurrentDb.OpenRecordset(\"\
    Table Name Containing Metadata\")\nDo Until rs.EOF\n  If ![DayOfWeek] = Weekday(Date)\
    \ Then\n    DoCmd.OpenReport ![ReportName]\n  End If\n  rs.Move\nNext Loop\n```\n\
    \n即使 Access 2007 或任何其他版本的 Access 中的报告从 10 份增加到 50 份，这 7 行代码也不需要更改或添加。Access 2007\
    \ 数据表只需要存储报告名称和星期几，只需两个数据字段。这意味着易于维护，且未来不需要更改代码。\n\n这种技术可以按指定的顺序运行一组查询。在链接到外部数据源时，通过包含路径、文件或表名以及规范使用元数据。通过存储导入和导出规范、格式和存储路径，你可以自动化导入或导出数据。\n\
    \n# 帮助 PHP 程序员改进程序代码的高级技巧\n\n自大约二十年前从微基础起步以来，PHP 编程见证了快速增长，并成为所有 Web 应用程序最流行的编程语言。许多网站由\
    \ PHP 编程代码驱动，绝大多数 Web 项目和脚本都依赖这种流行的语言进行开发。由于这种开发语言的巨大流行，任何 PHP 程序员似乎都不可能说自己连 PHP\
