    # CHAPTER 8: WHAT CODING LANGUAGES ARE USED TO DEVELOP IPHONE APPS?


    While it may sound like a very technical undertaking, anyone with a good knowledge
    of object oriented computer programming can easily develop iPhone apps. However,
    due to restrictions placed by Apple, not all object oriented programming languages
    are suitable developers. Here is a detailed guide on what programming language
    is best and how best to approach the task.


    Apple restricts all apps meant for launching on its Apple Stores to be based on
    `Objective C` as a programming code. `Objective C` is a hybridized form of the
    more universal C programming code. It is possible to create applications using
    other languages and then using a wrapper API to make it look like Objective C
    but this may not always work. In order to develop a good app that will get enough
    popularity with iPhone users, you need to use a Mac computer. For the best results,
    go for one with an Intel based processor, preferably running MAC OS X. As such,
    you will not have to trouble yourself with thoughts about compatibility of the
    app you develop will be optimized for use on iOS devices. Next step is still.
    After setting up your Mac and downloading the iPhone `Software Development Kit`
    from the Apple website. Apple provides the free SDK and contains everything you
    need to begin including the environment `XC` as well as the simulator that allows
    you to test the apps before launching them. Brush up on your OOP (Object Oriented
    Programming) skills to apply Objective C. It has many ways as it hides the complexity
    of underlying hardware leaving you to concentrate on technical aspects of the
    application itself and not the platform on which it will run. There are plenty
    of free tutorials to guide you. Start by writing simple programs. Being too ambitious
    can cause you problems in the future. It is best to play beginning with a set
    of manageable projects and gradually qualifying to more complex and challenging
    tasks as your skills increase. Unlike safe languages like Java, a single mistake
    in Objective C code may lead to program crashing as a whole. After testing your
    application sufficiently on the simulator, you need to migrate to the real environment.
    To do this, you need to register first with the official iPhone developer program.
    You will need to pay a joining fee of $99. After you have signed the agreement
    to abide by Apple'' code of conduct, return the form to begin testing your application
    on a real environment. Becoming a good developer is more about having the right
    skills and tools than being a professional programmer. Learning the right oriented
    coding will help you to develop iPhone apps that are ready to launch on the actual
    devices. Once you get registered as a developer, you can launch them online and
    await them to be downloaded by enthusiasts.


    # VISUAL BASIC 6: INTELLECTUAL PROPERTY AND CODE OWNERSHIP


    Visual Basic 6 is still used in a huge array of applications today. In particular,
    a large number of administration systems were written with a combination of a
    VB6 Front-End and a Microsoft Access or SQL Server database Back-End. Using Visual
    Basic 6 as the Front-End was a good idea at the time. But Visual Basic 6, released
    in 1988, cannot be purchased and extended support stopped in 2008. The number
    of willing programmers with the necessary skills and software to maintain VB6
    is diminishing. Any company still using VB6 Front-End is in danger of unsupported
    falling. Making "just a change" to the system becomes a major effort - expensive,
    if all possible to go. Supporting antiquated software is a "just a change" to
    the system. Changes are always needed - with new systems, with new generation
    becoming functional.


    # Code Ownership and Copyright


    The question of code ownership and copyright is asked with increasing. The problem
    of code ownership of the VB6 Front-End is a real threat - where is highly dependent
    on it. The usual rule "if you pay for it, you own it" does not apply with code
    - ownership usually reside with the author of the software.


    # Obtaining the Code


    There is need for total control by the development process. But the code might
    not be available - the original programmer may have moved on better and greener.
    Frankly, obtaining the code leaves a company to extortion. But just possessing
    the VB6 code will not solve the ongoing development problem.


    # Even if


    Even if the Visual Basic 6 code is available - will it run? Usually a large number
    of third-party OCXs (Custom controls) and DLLs (Dynamic-link libraries) have been
    incorporated. And the installation software and licenses for these add-ins are
    hard to come. Most of the VB6 third-party software companies are now defunct,
    or have been taken over by other companies. And, due to the primitive nature of
    VB6, the Front-End system will have incorporated many OCXs, DLLs and APIs (application
    programming interfaces) - for system information, reporting, data grids, resizing,
    calendar controls, buttons, tooltips, dropdowns, etc. Then, in trying to set up
    the programming environment, difficulties may include conflicts between DLL and
    OCX versions and registration problems - commonly known as "DLL hell".


    # Code Ownership must be determined from the outset


    This may seem like 20/20 hindsight, but for future reference: When a developer
    is hired to create an administrative system, the company''s ownership of the code
    should be agreed from the start. To enforce this, after each new release of the
    software, the code should be deposited onto a PC within the company. And to make
    assurance - it must be coded that it can be deployed to all users.


