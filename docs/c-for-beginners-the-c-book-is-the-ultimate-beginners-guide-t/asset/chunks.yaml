    Here then are some ideas to help create your Coding Standard. Make it short and
    to the point:


    ### Readable Code

    The code must be created so that it is easy for other programmers to understand.
    It should not be written only with just the computer in mind. The code should
    be easily readable, with lots of white space.


    ### Blocks of Code

    Blocks of Code should be broken into sections that are well defined and understandable
    procedure chunks. It may be helpful to use a "Main Line" to split a lengthy procedure.


    ### Code Indentation

    Those "If" "If" "Else" constructs are hard to follow, if the indentation of control
    structures is inconsistent.


    ### Variable Names

    The variable naming convention should be well-thought, meaningful and consistently
    applied. The variable name should describe the content of the variable. Try not
    to have abbreviations, unless they are consistently applied. The standards for
    capitals, Camel or Pascal case need to be set.


    ### Procedure Names

    Much as for variable naming conventions, procedure names should describe their
    purpose.


    ### Code Documentation

    No matter how well the code is written, changes or enhancements will eventually
    be required. Time should be spent when actually writing the code, commenting on
    the intent and technical aspects of the code. This will save time and effort later.
    In addition to external documentation, all code should be liberally documented
    with comments. Each procedure should have a heading with comments describing the
    input, output and function of the procedure.


    ### Complex Constructs

    There is always the temptation to use the latest and greatest feature - this is
    true especially with inexperienced programmers. Complexity and the esoteric will
    make a program code difficult to follow, maintain and debug. Simplicity, above
    all, must be enforced.


    ### Keep the Coding Simple

    If another much cannot understand, at a glance, what the Code is all about, then
    the Code is badly written. So often becomes necessary when debugging or enhancing
    code, that the code be rewritten. This is a costly exercise for the company as
    well as being a non-productive and wasted effort.


    ### Isolate Complex Code

    There will be the occasion when simplicity must give way to complexity, when functionality
    or performance is required. In these cases (hopefully, few and far between), the
    complex code should be isolated in a "black box" library procedure.


    ### Reusable Code

    The Coding Standard should include the gathering and documentation of reusable
    Code. With reusable Code, that is Code that is not duplicated throughout an entire
    organization, the programmers will build programs faster - and programs that run
    faster. Using less Code means greater productivity and faster development cycles.
    By using the same Code repeatedly by every programmer in every project, errors
    are identified and eliminated sooner.


