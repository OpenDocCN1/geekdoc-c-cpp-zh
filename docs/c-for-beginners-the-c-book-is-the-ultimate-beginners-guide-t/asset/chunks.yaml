    # 第 8 章：开发 iPhone 应用使用哪些编程语言？


    虽然这听起来是一项非常有技术性的任务，但任何具备良好面向对象计算机编程知识的人都可以轻松开发 iPhone 应用。然而，由于 Apple 的限制，并不是所有的面向对象编程语言都适合开发者。这里有关于哪种编程语言最好以及如何最好完成任务的详细指南。


    Apple 限制所有旨在其 Apple Store 发布的 App 必须以 `Objective C` 作为编程代码。`Objective C` 是更通用的
    C 语言代码的混合形式。可以使用其他语言创建应用程序，然后使用封装 API 使其看起来像 Objective C，但这种方法并不总是有效。为了开发一个能够受到
    iPhone 用户足够欢迎的优秀应用，你需要一台 Mac 电脑。为了获得最佳效果，请选择带有 Intel 处理器的电脑，最好运行 MAC OS X。这样，你就不必为所开发的
    App 的兼容性问题烦恼，因为它将针对 iOS 设备的使用进行优化。下一步仍然是：在设置好你的 Mac 并从 Apple 网站下载 iPhone `Software
    Development Kit`（软件开发包）。Apple 提供免费的 SDK，其中包含了你所需的所有内容，包括环境 `XC` 以及允许你在发布之前测试应用的模拟器。复习你的
    OOP（面向对象编程）技能以应用 Objective C。它有很多优势，因为它隐藏了底层硬件的复杂性，让你能够专注于应用程序本身的技术层面，而不是运行它的平台。有许多免费教程可以指导你。从编写简单的程序开始。过于野心勃勃可能会在未来给你带来问题。最好的方法是从一组易于管理的项目开始，并随着你技能的提高，逐渐胜任更复杂、更具挑战性的任务。与
    Java 这种安全的语言不同，Objective C 代码中的一个错误就可能导致整个程序崩溃。在模拟器上充分测试你的应用程序后，你需要迁移到真实环境。要做到这一点，你首先需要在官方
    iPhone 开发者计划中注册。你需要支付 99 美元的入会费。在签署了遵守 Apple 代码行为准则的协议后，返回表格以开始在真实环境中测试你的应用程序。成为一个优秀的开发者更多是关于拥有正确的技能和工具，而不是成为一个专业的程序员。学习正确的导向型编码将帮助你开发出准备在实际设备上发布的
    iPhone 应用。一旦你注册成为开发者，你就可以可以在网上发布它们，并等待爱好者下载。


    # VISUAL BASIC 6：知识产权与代码所有权


    Visual Basic 6 如今仍被用于大量的应用程序中。特别是，大量的管理系统是用 VB6 前端与 Microsoft Access 或 SQL Server
    数据库后端组合编写的。在当时使用 Visual Basic 6 作为前端是一个好主意。但发布于 1988 年的 Visual Basic 6 已无法购买，且扩展支持已于
    2008 年停止。拥有必要技能和软件来维护 VB6 的意向程序员正在减少。任何仍在使用 VB6 前端的公司都面临着无支持崩溃的危险。对系统进行“小改动”将变成一项艰巨工程——如果可能的话，将非常昂贵。支持过时的软件对系统来说是一个“小改动”。变化是永远需要的——随着新系统的出现，随着新一代的变得功能化。


    # 代码所有权与版权


    关于代码所有权和版权的问题问得越来越多。VB6 前端的代码所有权问题是一个真实的威胁——许多地方高度依赖它。“你付了钱，你就拥有它”的通常规则并不适用于代码——所有权通常属于软件作者。


    # 获取代码


    开发过程需要完全的控制。但代码可能无法获得——原始程序员可能已经去寻找更好的新平台。坦率地说，获取代码会使公司面临勒索风险。但仅仅拥有 VB6 代码并不能解决正在进行的开发问题。


    # 即使如此


    即使 Visual Basic 6 代码可用——它能运行吗？通常已经整合了大量的第三方 OCX（自定义控件）和 DLL（动态链接库）。这些插件的安装软件和许可证很难获得。大多数
    VB6 第三方软件公司现在已经倒闭，或者被其他公司收购。而且，由于 VB6 的原始性质，前端系统已经整合了许多 OCX、DLL 和 API（应用程序编程接口）——用于系统信息、报告、数据网格、调整大小、日历控件、按钮、工具提示、下拉菜单等。DLL
    版本之间的冲突问题被称为“DLL 地狱”。


