    Code readability is just one of the aspects of maintainability. Coding standards
    help a great deal with program maintainability, our ability to change programs
    with ease. Consistency imposed through a coding standard is a key factor to achieve
    successes in maintaining programs.


    # WHY HAVE CODING STANDARDS? A MANAGEMENT OVERVIEW


    All too frequently a programmer is left to produce code, without standards or
    quality assurance. It is only after a major problem that the months and in some
    cases, the years of programming are found to be worthless. Some control on the
    code being produced is essential - and this starts with a well-documented Coding
    Standard.


    No matter how busy you are, a Coding Standard will be a time saver in the long
    run - it is fundamental to good programming. Coding Standards and programming
    productivity go hand-in-hand. Adhering to a Coding Standard will lead to a significant
    increase in development productivity, whatever the programming language. A consistently
    applied set of Coding Conventions will standardised the structure and coding style
    of an application, so a programmer can easily read and understand other programmers''
    code, as well as their own code.


    Good Coding Standards result in precise, readable, and unambiguous source code
    that is consistent and as intuitive as possible. The object of a Coding Standard
    is to make the program easy to read and understand without cramping the programmer''s
    natural creativity with excessive constraints and arbitrary restrictions.


    ## Maintenance Costs


    Following a Coding Standard will increase productivity, not only to system development,
    but increase productivity in enhancing and maintaining systems well. And it is
    also important to control maintenance costs - these can constitute most of the
    lifetime cost of software. To reduce the high maintenance cost, it is essential
    to have code written that can be easily deciphered and enhanced by any other programmer
    in your Company. This is important, as usually little software is maintained by
    the original programmer.


    ## Enforcing the Standard


    All the programmers should agree on the Coding Standard. Once agreement has been
    reached, the Standard must be enforced, as part of quality assurance. The use
    of the agreed coding techniques and good programming practices play an important
    role in software quality and performance. By consistently applying a well-defined
    Coding Standard, a team of programmers working on a software project is more likely
    to yield quality system code that is intelligible, error free, cost-effective
    and maintainable.

