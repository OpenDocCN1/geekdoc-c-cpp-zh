    # 13.3.2 Algorithm and Data Structure Optimization: Efficient Logic


    Choosing efficient algorithms and data structures is crucial for game performance,
    particularly in systems that are executed frequently, such as game logic, AI,
    physics, and collision detection.


    Optimization Techniques:


    +   - Algorithm Complexity: Select algorithms with lower time complexity for performance-critical
    tasks. For example, O(log n) or O(n) algorithms instead of O(n^2) or O(n^3) algorithms
    where possible, especially for large datasets or frequently executed.

    - Data Structure Choice: Choose data structures that are optimized for the operations
    you need to perform often. For example, use hash tables (unordered_map in C++)
    for fast lookups, vectors or arrays for sequential data access, and spatial data
    structures (e.g., quadtrees, BVHs) for spatial queries in games with large worlds.

    - Pre-computation and Caching: Pre-compute rendering results or data that are
    used repeatedly and store them in cache to avoid redundant computations. For example,
    pre-calculate lighting or visibility information, or cache frequently accessed
    game data.

    - Avoid Unnecessary Operations: Minimize unnecessary computations, memory allocations,
    and function calls in performance-critical code paths.


    **Real-world scenario:** In games, AI pathfinding algorithms, collision detection
    routes, and physics simulations are often performance-intensive. Game developers
    carefully optimize these systems by selecting efficient algorithms and data structures.
    For example, using A* pathfinding algorithm instead of Dijkstra''s algorithm in
    large game worlds, or using bounding volume hierarchies (BVHs) for efficient collision
    queries.


    # 13.3.3 Rendering Optimization: Efficient Graphics Pipeline


    Rendering is often a major performance bottleneck in games, especially in visually
    rich and complex games. Optimizing the pipeline is'
