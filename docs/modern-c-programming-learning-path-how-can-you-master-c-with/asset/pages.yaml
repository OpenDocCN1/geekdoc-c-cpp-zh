    ```\nfor (int i = 0; i < 100000; ++i) {\n    atomicCounter++; // Atomic operation\
    \ // No explicit mutex needed - increment is atomic\n}\nstd::cout << threadName\
    \ << \" finished incrementing.\" << std::endl;\n\nint main() {\n    std::thread\
