    \ && !std::is_floating_point<T>, void>\nprintCategory(T value) {\nstd::cout <<\
    \ \"Value is of another type\" << std::endl;\n}\n```\n\n```\nint main() {\n  \
    \  printCategory(10); // Calls integral overload printCategory\npoint overload\
