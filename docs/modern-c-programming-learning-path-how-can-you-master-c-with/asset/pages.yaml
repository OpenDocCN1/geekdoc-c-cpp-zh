  md: 'Data alignment and packing are techniques that can impact both memory access
    performance and memory footprint in C++ programs, particularly in systems and
    embedded programming.


    # Data Alignment:


    +   - Memory access efficiency: Modern processors access memory most efficiently
    when data is aligned to natural boundaries (e.g., 4-byte integers aligned at 4-byte
    boundaries, 8-byte doubles aligned at 8-byte boundaries). Misaligned memory accesses
    can be significantly slower, especially on some architectures, as they might require
    multiple memory accesses instead of a single aligned access.

    - Compiler alignment: Compilers typically align data structures by default to
    ensure efficient memory access. For example, a struct might be padded with extra
    bytes to ensure that members are properly aligned.

    - aligns specifier (C++11): C++11 introduced the aligns specifier to control the
    alignment of variables and data structures explicitly.


    # Data Packing:


    +   - Memory footprint reduction: Data packing aims to reduce the memory footprint
    of data structures by eliminating padding inserted for alignment. This is particularly
    important in memory-constrained embedded systems.

    - #pragma pack (compiler-specific): Compilers often provide #pragma pack directives
    (or similar mechanisms) to control struct packing and disable padding.

    - Trade-off: performance vs. size: Data packing can reduce memory footprint but
    might also lead to misaligned memory accesses, potentially degrading performance
    on some architectures. The trade-off between memory size and access performance
    needs to be considered.


    # Example: Data Alignment and Packing


    Default Alignment (Compiler-aligned struct): C++'
