    # # 13.2.1 Key Concepts of Unreal Engine C++ Scripting


    Unreal Engine''s C++ scripting system is built upon a set of core concepts and
    conventions:


    +   - Reflection System: Unreal Engine uses a powerful reflection system that
    allows C++ classes, properties, and functions to be exposed to the engine and
    Blueprint visual scripting. This enables seamless integration between C++ code
    and the engine''s editor and runtime environment. Macros like UCLASS(), UFUNCTION(),
    UPROPERTY() are used to mark C++ code for reflection.


    +   - Actors and Components: Actors are the fundamental building blocks of games
    in Unreal Engine. They are objects that can be placed in a level and possess behavior.
    Components are reusable modules that provide specific functionalalities to Actors
    (e.g., rendering, physics, audio). C++ is used to create custom Actors and Components
    with specific game logic and behaviors.


    +   - Game Framework: Unreal Engine provides a set of core game framework classes
    that define the structure of a game, including GameMode (manages game rules and
    gameplay flow), PlayerController (handles player input), Pawn or Character (represent
    characters), and GameState (stores game state information). C++ is used to extend
    and customize these framework classes to implement game-specific logic.


    +   - Unreal Header Tool (UHT): UHT is a preprocessor that parses Unreal Engine
    C++ header files and generates reflection metadata. This metadata is used for
    various purposes, including Blueprint integration, property serialization, and
    garbage collection.


    +   - Garbage Collection: Unreal Engine has its own garbage collection system
    to automatically manage memory for reflected UObjects (objects derived from UObject,
    the base class for most Unreal Engine objects). This simplifies management for
    game developers.


    +   - Blueprint Integration: C++ code in Unreal is designed to work seamlessly
    with Blueprint visual scripting. C++ classes and functions can be exposed to Blueprint,
    allowing designers and other team members to extend and customize C++ logic.'
