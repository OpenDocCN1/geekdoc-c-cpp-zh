    directory.

    3. Add Clang to PATH: Similar to MinGW-w64, add the Clang bin directory (e.g.,
    C:\Program Files\LLVM\bin) to your PATH environment variable. Follow the same
    steps as described for MinGW-w64 PATH setup.

    4. Verify installation: Open Command Prompt and run clang --version.


