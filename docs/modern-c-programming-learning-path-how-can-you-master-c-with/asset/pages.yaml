- img_proc: true
  md: '# 15.3.2 Dockerizing a Simple C++ Application


    Let Dockerize a simple "Hello World" C++ application.


    Step-by-step guide:


    +   1. **Install Docker**: Install Docker Desktop (for Windows, macOS) or Docker
    Engine (for Linux) on your development machine. Follow the installation instructions
    for your system from the [official Docker website](https://www.docker.com/).

    2. **Create a Project Directory**: Create a directory for your Docker project
    (e.g., `DockerCppApp`).

    3. **Create hello.cpp**: Create `hello.cpp` in your project directory ("Hello
    World" program as before).

    4. **Create Dockerfile**: Create a `Dockerfile` in your project directory. This
    file defines how to build the Docker image for your C++ application. Example Dockerfile
    content:


    Dockerfile


    ```

    FROM ubuntu:latest # Base image: Ubuntu latest WORKDIR /app # Set working inside
    the container COPY . /app Copy project files into /app RUN apt-get update & apt-get
    install -y g++ Install g++ compiler RUN g++ hello.cpp -o hello_app # Compile the
    C++ application CMD ["/hello_app"] # Command to run when the container starts

    ```


    **Explanation of Dockerfile instructions:


    +   * FROM ubuntu: Specifies the base image for the Docker image. Here we use
    the latest Ubuntu image from Docker Hub.

    * WORKDIR /app: Sets the working directory inside the container to /app. Subsequent
    commands will be executed in this directory.

    * COPY . /app: Copies all files from the current directory (where Dockerfile is
    located) to the host machine to the /app container.

    * RUN apt-get update & apt-get install -y g++: Executes commands inside the building
    image. This line updates the package lists and installs the g++ C++ compiler.

    * RUN g++ hello.cpp -o hello_app: Compiles the hello.cpp source code inside the
    container, creating an executable named hello_app.

    * CMD ["/hello_app\:]: Specifies the command to run when started from this image.
    Here, it runs the compiled hello_app.'
  merge: -1
  pgno: 327
- img_proc: true
  md: '5. Build the Docker Image: Open a terminal in your project directory (where
    the Dockerfile is located). Build the Docker image using the docker build command.


    Bash


    docker build -t my-cpp-app .


    +   - docker build: Docker command to build an image.

    - -t my-cpp-app: Tags the image with the name my-cpp-app. You can choose a different
    name.

    - : : Specifies the build context as the current directory (where the Dockerfile
    is).


    # 6. Run the Docker Container: Run a container from the built Docker image using
    the docker run command.


    Bash


    docker run my-cpp-app


    You should see the output "Hello World from Dockerized C++" printed to your terminal.


    # Code Explanation:


    +   - Dockerfile: Defines the steps to create a Docker image. It specifies the
    base image, copies application code, installs dependencies (g++ compiler in this
    case), compiles the application within the container, and sets the command to
    run when the container starts.

    - docker build -t my-cpp-app : Builds a Docker image named my-cpp-app based on
    the Dockerfile in the current directory. Docker builds images in layers, caching
    intermediate steps for faster rebuilds.

    - docker run my-cpp-app: Runs a container from the my-cpp-app image. Docker creates
    an isolated environment based on the image, and the CMD instruction in the Dockerfile
    is executed inside the container.


    Real-world scenario: Docker is widely adopted for deploying microservices, web
    applications, and backend services. It is used extensively in cloud environments,
    CI/CD pipelines, and development workflows to ensure consistent and reproducible
    deployments. Containerizing C++ applications with Docker simplifies deployment,
    dependency management, and scaling, making it a valuable tool for modern software
    development and operations.'
