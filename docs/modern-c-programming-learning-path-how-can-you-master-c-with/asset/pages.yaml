    # 4.5 Memory Leaks and Debugging Tools (Valgrind, AddressSanitizer)


    Memory leaks are a common and insidious problem in C++ programs that use dynamic
    memory allocation. A memory leak occurs when dynamically allocated memory is no
    longer reachable by the program but is not deallocated using delete. Over time,
    memory leaks can accumulate, leading to increased memory usage, performance degradation,
    and eventually program crashes. Detecting and fixing memory leaks is a crucial
    part of C++ development. Tools like Valgrind and AddressSanitizer are invaluable
    for identifying memory-related errors, including leaks.


    # 4.5.1 Memory Leaks: Causes and Consequences


    Memory leaks typically occur due to programmer errors in managing dynamically
    allocated memory. Common causes include:


    +   - Forgetting to use delete: Allocating memory with new but not freeing it
    when it''s no longer needed.

    - Exceptions preventing delete: If an exception is thrown between new and delete
    and not properly caught, the delete call might be skipped, leading to a leak.
    RAII (smart pointers) helps prevent this.

    - Lost pointers: Overwriting a pointer variable that holds the address of dynamically
    allocated memory before deallocating it, making the memory unreachable.

    - Circular references with shared_ptr: As discussed earlier, circular dependencies
    in shared_ptr ownership can prevent deallocation.


    The consequences of memory leaks can range from gradual performance slowdown to
    application crashes, especially in long-running programs or'
