  md: '# 2.1 Structure of a C++ Program


    Every C++ program adheres to a basic structure that dictates how code is organized
    and executed. Understanding this is crucial for writing correct and maintainable
    code. A typical C++ program generally consists of several key components, including
    preprocessor directives, namespace declarations, the main function, and program
    statements.


    # 2.1.1 main Function: Entry Point of Execution


    At the heart of every executable C++ program lies the main function serves as
    the entry point where program execution begins. The main function typically has
    a return type of int, and by convention, a return value of 0 indicates successful
    program execution, while any other value signals an error. Stroustrup emphasizes
    in "The C++ Programming Language," the main function is indispensable; without
    it, the operating system has no designated point for your program (Stroustrup,
    2013).


    Example: A Minimal C++ Program C++


    ```

    #include <iostream> int main() {

    std::cout << "Hello, World!" << std::endl; return 0; }

    ```


    **Step-by-step explanation:**


    +   1. #include <iostream>: This line is a preprocessor directive that includes
    the iostream header file. This header provides input and output functionalities,
    allowing us to display text on the console. The #include directive is processed
    before compilation, effectively copying the contents of iostream into your source
    code.


    +   2. int main() { }: This defines the main function. The int keyword specifies
    that the function returns an integer value. The parentheses () indicate that main
    is a function, and in this case, it takes no arguments. The curly braces {} enclose
    the body of the main function, containing the program''s executable statements.


    +   3. std::cout << "Hello, World!" << std::endl;: This line is a statement that
    performs output. std::cout is the standard output stream object'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'C++, typically connected to the console. The << operator is the insertion operator,
    used here to send the string literal "Hello, World!" to the output stream. std::endl
    is a manipulator that inserts a newline character and flushes the output stream,
    ensuring the output is immediately displayed. The std:: prefix indicates that
    cout and endl belong to the standard namespace, which we will discuss next.


    +   4. return 0; This statement returns the integer value 0 from the main function,
