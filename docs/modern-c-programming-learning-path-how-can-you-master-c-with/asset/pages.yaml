    or false. C++ provides three primary types of conditional statements: if, else,
    and switch.


    # ## 3.1.1 if Statements: Executing Code Conditionally


    The if statement is the most basic conditional statement. It executes a block
    of code only if a specified condition evaluates to true. The condition is typically
    a boolean expression.


    **Example:** if Statement for Age Check Imagine a real-world scenario where you
    are building a program to verify age for access to certain content. An if statement
    can be used to check if a user''s age meets the required threshold.


