  md: 'Release builds are optimized for deployment and performance. They are compiled
    with:


    +   - No debugging symbols: Debugging symbols are typically excluded from release
    builds to reduce executable size and improve performance.

    - Full optimizations: Compiler optimizations are enabled to maximize performance.
    Optimizations can include inlining functions, loop unrolling, register allocation,
    and other techniques to make the code run faster and more efficiently.

    - Assertions and error checks often disabled: Assertions and runtime error checks
    are often disabled in release builds to eliminate their runtime overhead and improve
    performance. Error handling in release typically relies on more robust reporting
    and recovery mechanisms rather than assertions.


    # Characteristics of Release Builds:


    +   - Faster execution: Release builds are significantly faster than debug builds
    due to compiler optimizations.

    - Smaller executable size: Without debugging symbols and with optimizations, release
    executables are smaller.

    - Harder debugging: Debugging release builds is more challenging because debugging
    symbols are absent, and optimizations can make the execution flow less straightforward
    to follow.


