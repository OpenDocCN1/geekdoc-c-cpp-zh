    +   1. **Install Valgrind (if not already installed):** On Debian/Ubuntu: sudo
    apt-get install valgrind. On macOS (using Homebrew): brew install valgrind

    2. **Compile your C++ program:** Compile your program with debugging information
    (e.g., using g++ -g your_program.cpp -o your_program). The -g flag includes debugging
    symbols which Valgrind uses to provide more informative error messages.

    3. **Run your program under Valgrind:** Execute the command valgrind --leak-check=full
    ./your_program. --leak-check=full enables leak checking. Replace ./your_program
    with the path to your executable.

    4. **Analyze Valgrind output:** Valgrind will run your program and produce a report
    after the program exits. The report will detail any memory errors detected, including
    memory leaks, invalid reads/writes, etc. Look for sections like "LEAK SUMMARY"
    in the output to identify potential leaks.


