    # 11.4.3 Inline Functions: Reducing Function Call Overhead


    Inline functions are a compiler hint to replace function calls with the actual
    function body at the call site. Inlining can eliminate function call overhead
    (function call setup, parameter passing, return), potentially improving performance,
    especially for small, frequently called functions.


    Best Practices:


    +   **Use inline keyword for small, frequently called functions:** Mark small
    functions that are called frequently as inline. The compiler may choose to inline
    these functions, reducing function call overhead.


    +   **Compiler discretion:** The inline keyword is a hint, not a directive. The
    compiler ultimately decides whether to inline a function based on factors like
    function size, complexity, and optimization level. Very large or complex functions
    might not be inlined even if marked inline.


    +   **Header file placement:** For inlining to be effective, the function definition
    (not just declaration) should be visible at the call site. Therefore, inline function
    definitions are typically placed in header files.


    +   **Template functions are implicitly inline:** Template functions are implicitly
    inline because the compiler needs to generate code for each template instantiation
    at the call site.


    Example: Inline Function


    ```

    C++

    // hello.h (header file - inline function definition) #ifndef HELLO_H

    #define HELLO_H


    inline void inlineSayHello(const char* name) { // Inline function definition in
    header std::cout << "Hello, (inline)," << name << "!" << std::endl; }


    #endif HELLO_H

    ```'
