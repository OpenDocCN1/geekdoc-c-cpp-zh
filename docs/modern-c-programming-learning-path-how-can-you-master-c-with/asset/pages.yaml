  md: "Dynamic memory allocation (using new and delete or malloc and free) can be\
    \ problematic in embedded systems due to:\n\n+   - **Fragmentation**: Repeated\
    \ allocation and deallocation can lead to memory fragmentation, reducing the availability\
    \ of contiguous memory blocks.\n- **Non-determinism**: Dynamic allocation times\
    \ can be unpredictable, which is undesirable in real-time systems.\n- **Overhead**:\
    \ Dynamic allocation and deallocation operations have runtime overhead.\n- **Memory\
    \ leaks**: Memory leaks due to improper deallocation are a common source of bugs.\n\
    \n# Best Practice:\n\n+   - **Favor static allocation**: Whenever possible, use\
    \ static stack-based allocation for variables and data structures. Declare variables\
    \ with fixed sizes at compile time.\n- **Use fixed-size buffers**: Instead of\
    \ dynamically allocating buffers, use fixed-size arrays or buffers allocated statically\
    \ or on the stack.\n- **Memory pools or custom allocators**: If dynamic allocation\
    \ is unavoidable, consider using memory pools or custom allocators to manage memory\
    \ more efficiently and predictably. Memory pools pre-allocate a large block of\
    \ memory and then allocate and deallocate from within this pool, reducing fragmentation\
    \ and overhead.\n\n# Example: Static Allocation vs. Dynamic Allocation Dynamic\
    \ Allocation (Avoid in critical embedded code): C++\n\n```\nvoid processDataDynamically(int\
