    # 4.3 Smart Pointers


    Manual memory management using new and delete is error-prone and can lead to memory
    leaks, dangling pointers, and other memory-related issues. To address these problems,
    C++ introduced smart pointers in C++11. Smart pointers are RAII wrappers around
    raw pointers that automatically manage memory deallocation. They ensure that dynamically
    allocated memory is automatically freed when the smart pointer goes out of scope,
    preventing memory leaks and reducing the burden of manual management. C++ provides
    several types of smart pointers, including unique_ptr, shared_ptr, and weak_ptr,
    each with different ownership semantics.


