  trans: "\n\n## 编译器选择\n\n### **MinGW (Minimalist GNU for Windows)**: 这是流行的 GNU 编译器集合\
    \ (`GCC`) 在 Windows 上的移植版本。如果你选择了 MinGW 版本的 Qt，则需要一个兼容的 MinGW 编译器。如前所述，Qt 安装程序可能会提供一个。或者，你可以单独安装\
    \ MinGW，通常通过 `MSYS2` 等发行版（它提供了一个包管理器环境）。如果单独安装，请确保架构（通常为 64 位，与 Qt 构建版本匹配，如 `MinGW`\
    \ 64-bit）和版本与你选择的 Qt 构建兼容。兼容信息通常可以在特定版本的 Qt 文档中找到。\n\n### **macOS**\n\n- **Xcode\
    \ 和命令行工具**: Apple 通过 `Xcode` 提供其开发工具。请从 Mac App Store 安装最新版本的 `Xcode`。`Xcode`\
    \ 包含了 `Clang` C++ 编译器。安装 `Xcode` 后，你可能还需要显式安装命令行工具。打开 `Terminal` 应用程序（应用程序 > 实用工具\
    \ > 终端）并运行命令：`xcode-select --install`。按照提示操作。这确保了编译器和其他构建工具可以通过命令行访问，并能被 `Qt Creator`\
    \ 识别。\n\n### **Linux**\n\n- **GCC/G++**: `GNU Compiler Collection` 是大多数 Linux\
    \ 发行版上的标准编译器。你需要安装 C++ 编译器和相关的构建工具。具体的包名有所不同：\n    - 在 **Debian/Ubuntu/Mint**\
    \ 上：打开终端并运行 `sudo apt update && sudo apt install build-essential`。该包组包含了 `GCC/G++`\
    \ 以及 `make` 等其他基本工具。\n    - 在 **Fedora/CentOS/RHEL** 上：打开终端并运行 `sudo dnf groupinstall\
    \ \"Development Tools\"`（旧版 CentOS/RHEL 使用 `yum`）。\n    - 确保你安装的 `GCC` 版本符合你你正在使用的\
    \ Qt 6 版本的最低要求（检查 Qt 文档，但现代发行版通常提供支持 C++17/20 的足够新的版本）。\n\n- **Clang**: `Clang`\
    \ 是 Linux 上另一个优秀的 C++ 编译器。你可以通过发行版的包管理器安装它（例如在 Debian/Ubuntu 上使用 `sudo apt install\
    \ clang`，在 Fedora 上使用 `sudo dnf install clang`）。如果你打算使用 `Clang`，请确保在提供的情况下选择与\
    \ `Clang` 兼容的 Qt 构建，或验证其兼容性。`GCC` 通常是 Linux 上 Qt 开发最常用的选择。\n\n- **核心开发库**: Qt\
    \ 应用通常依赖于其他系统库进行渲染、字体、平台集成等。安装主构建工具（`build-essential` 或 `Development Tools`）通常会引入许多必要的依赖项。然而，你有时可能需要特定的开发包（通常以\
    \ `-dev` 或 `-devel` 结尾），例如 OpenGL/Mesa 的（Debian/Ubuntu 上的 `libgl1-mesa-dev`）或\
    \ Fontconfig 的（`libfontconfig1-dev`）。如果通过系统包管理器安装 Qt 库本身（我们在这里没有这样做，而是使用在线安装程序），包依赖关系通常会处理这些问题，但意识到潜在的系统库依赖项有助于排除故障。\n\
    \n## 配置 Qt Creator\n\n在安装了 Qt SDK 和兼容的编译器后，就可以启动由在线安装程序安装的 IDE —— `Qt Creator`\
    \ 了。第一次运行它时，它可能会执行一些初始设置，并尝试自动检测已安装的 Qt 版本和编译器。\n\n在 `Qt Creator` 中管理工具链的核心概念是\
    \ `Kit`（构建套）。一个 `Kit` 代表构建和运行 Qt 项目的完整配置。它汇结了：\n\n- 一个特定的 `Qt Version`（例如，用于 `MSVC\
    \ 2019` 64 位的 `Qt 6.7.0`）\n- 一个 C++ 编译器（例如，`MSVC 2019` 64 位、`MinGW` 64 位、macOS\
    \ `Clang`、Linux `GCC`）\n- 一个调试器（通常随编译器自动检测，如 `GDB` 或 `CDB`）\n- `CMake` 工具（指向 `CMake`\
    \ 可执行文件）\n- 其他设置，如目标设备（桌面）\n\n`Qt Creator` 通常非常擅长根据你通过在线安装程序安装的内容以及它找到的系统编译器自动检测有效的组合。要查看和管理这些\
    \ Kits：\n\n1. 转到 `Tools > Options`（Windows/Linux）或 `Qt Creator > Preferences`（macOS）。\n\
    2. 从左侧窗格中选择 `Kits` 部分。\n3. 你将看到 `Kits`、`Qt Versions`、`Compilers`、`Debuggers`、`CMake`\
    \ 标签页。\n4. 在 `Kits` 标签页下，检查自动检测的 Kits。有效的 `Kit` 在其组件旁边会有绿色勾选或相应的图标。如果你看到警告（黄色三角形）或错误（红色图标），意味着\
    \ `Qt Creator` 无法找到或验证某个组件（例如，在系统 `PATH` 中未找到指定的编译器）。\n5. 如果 `Kit` 配置不当，你通常可以从\
    \ `Kit` 详情中的下拉列表中选择正确的组件（例如，如果检测到的编译器没有自动关联，可以手动选择它）。确保 Qt 版本与 `Kit` 名称中指定的编译器匹配（例如，使用\
    \ `MSVC` 的 Kit 应该指向 `MSVC` 构建的 Qt）。\n6. 良好的做法是选择你打算使用的主要 Kit（例如与你的主编译器匹配的 `Desktop\
    \ Qt 6.7.0` kit）并点击 `Make Default`（设为默认）按钮。这确保新项目使用此配置。\n\n## 验证完整设置\n\n确认环境一切正常的最佳方法是构建并运行一个简单的项目。\n\
    \n1. 在 `Qt Creator` 中，转到 `File > New Project...` 或 `File > New File`。\n2. 选择 `Application\
    \ (Qt) -> Qt Widgets Application` 或 `Console Application`。\n3. 为你的项目命名（例如 `HelloWorldWidgets`）并选择位置（使用无空格的路径）。\n\
    4. 选择构建系统：`CMake`。\n5. 选择之前验证过的 Kit。确保只勾选了它。\n6. 点击 `Finish`。\n7. `Qt Creator`\
    \ 将生成项目文件。处理完成后，点击左下面板的绿色“运行”按钮（播放符号）或按下 `Ctrl+R`（macOS 为 `Cmd+R`）。\n\n如果你的设置正确，`CMake`\
    \ 将配置项目，编译器将进行构建，并弹出一个窗口（Widgets）或控制台输出（Console）。看到这个简单的程序运行说明 Qt 库、`Qt Creator`、`CMake`、编译器和链接器都在正常工作。\n\
    \n"
- fmt: "\nConsulting the Qt documentation for your specific version and platform,\
    \ or searching community forums with the exact error messages you encounter, can\
    \ provide more targeted solutions.\n\n## Conclusion\n\nSetting up the development\
    \ environment is the essential first step, laying the groundwork for everything\
    \ that follows. While it involves several components and some platform-specific\
    \ details, using the Qt Online Installer and verifying the configuration with\
    \ Qt Creator streamlines the process considerably. With a working Qt 6 SDK, Qt\
    \ Creator IDE, `CMake`, and a compatible C++ compiler correctly configured in\
    \ a `Kit`, you have a powerful and productive environment at your fingertips.\
    \ You are now fully equipped and ready to take the next step: writing your first\
    \ lines of Qt C++` code and bringing your application ideas to life.\n\n## Your\
    \ First Qt Applications: Building \"Hello World\" with QtWidgets and QML\n\nNow\
    \ that your development environment is configured, featuring the Qt 6 SDK, Qt\
    \ Creator, and the necessary compilers linked together in a working `Kit` (as\
    \ detailed in Section 1.1), it's time for the rewarding part: creating and running\
    \ actual code. We will construct two minimal applications, one using the traditional\
    \ `QtWidgets` module and another using the modern Qt Quick/QML approach. These\
    \ \"Hello World\" examples serve two main purposes: they provide final validation\
    \ that your toolchain is functioning correctly for both UI paradigms, and they\
    \ offer a first glimpse into the basic structure of Qt projects.\n\n### Project\
    \ 1: Your First QtWidgets Application\n\nQt Widgets are well-suited for creating\
    \ classic desktop applications with a native look and feel. Let's build a very\
    \ simple one.\n\n1. Launch `Qt Creator`.\n2. Navigate to the menu: `File > New\
    \ Project...` (or `File > New File or Project...`).\n3. In the dialog that appears,\
    \ select `Application (Qt)` from the project types.\n4. Choose `Qt Widgets Application`\
    \ from the central panel and click the `Choose...` button.\n5. Project Name and\
    \ Location: Enter a name for your project, for instance `HelloWorldWidgets`. Select\
    \ a directory where the project files will be stored. Remember our earlier advice:\
    \ paths without spaces or special characters are generally safer. Click Next.\n\
    6. Build System: You'll be prompted to select the build system. Ensure `CMake`\
    \ is selected, as this is the standard for modern Qt 6 development. Click Next.\n\
    7. Class Information: The wizard suggests default names for the main window class\
    \ (`MainWindow`) and generates corresponding files (`mainwindow.h`, `mainwindow.cpp`,\
    \ `mainwindow.ui`). For this simple example, accept the defaults. Click Next.\n\
    8. Translation Files: You might be asked about creating translation files. Leave\
    \ this empty for now. Click Next.\n9. Kit Selection: This step is crucial. You'll\
    \ see a list of the `Kits` configured in `Qt Creator`. Select the valid Qt 6 Desktop\
    \ `Kit` you verified in the previous section (e.g., something like \"Desktop Qt\
    \ 6.x.x MSVC2019 64bit\" or \"Desktop Qt 6.x.x GCC 64bit\"). Ensure only this\
    \ `Kit` is checked. Click Next.\n10. Version Control: You have an option to add\
    \ the project to a version control system like `Git`. You can skip this for now.\
    \ Click Finish.\n\n`Qt Creator` will now generate the project structure. In the\
    \ left-hand pane (the project explorer), you'll see several files:\n\n- `CMakeLists.txt`:\
    \ This text file contains instructions for `CMake` on how to build your application\
    \ (finding Qt modules, compiling source files, linking libraries). We will look\
    \ into this more later.\n- `main.cpp`: This file contains the `main` function,\
    \ the entry point of your C++ application. Its primary role here is to create\
    \ a `QApplication` object (which manages application-wide resources and the event\
    \ loop) and to create and show an instance of your `MainWindow`.\n- `mainwindow.h`\
    \ and `mainwindow.cpp`: These are the header and source files for your main window\
    \ class, derived from `QMainWindow`.\n- `mainwindow.ui`: This XML-based file defines\
    \ the visual layout of your main window. You can double-click it to open it in\
    \ `Qt Creator`s integrated visual editor, `Qt Designer`.\n\nLet's make this application\
    \ announce itself. The simplest way is to set the window's title. Open `mainwindow.cpp`.\
    \ Inside the constructor (`MainWindow::MainWindow(...)`), you'll likely see a\
    \ line similar to `ui->setupUi(this);`. Add the following line immediately after\
    \ it:\n\n```cpp\nsetWindowTitle(tr(\"Hello Widgets World!\"));\n```\n\nThe `setWindowTitle`\
    \ function does exactly what its name suggests. We use `tr()` for potential future\
    \ translation, a good habit even now.\n\nNow, let's build and run the application.\
    \ Locate the green \"Run\" button (a triangle icon, usually in the bottom-left\
    \ area of `Qt Creator`, alongside build options). Click it, or use the keyboard\
    \ shortcut (typically `Ctrl+R` on Windows/Linux, `Cmd+R` on macOS).\n\n`Qt Creator`\
    \ will invoke `CMake`, then your C++ compiler and linker. If everything is configured\
    \ correctly, after a short build process, you should see a small, empty window\
    \ appear on your desktop. Observe its title bar – it should display \"Hello Widgets\
    \ World!\". This window will likely adopt the standard appearance of applications\
    \ on your operating system (Windows, macOS, or Linux). Congratulations, you've\
    \ successfully built and run your first Qt Widgets application! You can simply\
    \ close the window to stop the application.\n\n### Project 2: Your First Qt Quick/QML\
    \ Application\n\nQt Quick uses the declarative `QML` language, often preferred\
    \ for dynamic, animated, and touch-friendly interfaces. Let's create a QML equivalent.\n\
    \n1. In `Qt Creator`, navigate again to `File > New Project....`.\n2. Select `Application\
    \ (Qt)` as the project type.\n3. This time, choose `Qt Quick Application` and\
    \ click `Choose....`.\n4. Name and Location: Enter a different name, such as `HelloWorldQML`,\
    \ and choose a location. Click Next.\n5. Build System: Ensure `CMake` is selected.\
    \ Click Next.\n6. Qt Quick Application Type: You might be offered different templates.\
    \ Choose a simple one like \"Qt Quick Application - Empty\" or similar (avoiding\
    \ templates that include Controls or other advanced features for this first example).\
    \ Click Next.\n7. Kit Selection: As before, select the same valid Qt 6 Desktop\
    \ `Kit` you used for the Widgets project. Click Next.\n8. Version Control: Skip\
    \ this if desired. Click Finish.\n\n`Qt Creator` generates the files for this\
    \ QML project:\n\n- `CMakeLists.txt`: Again, defines the build process via `CMake`,\
    \ specifying QML modules this time.\n- `main.cpp`: This `main` function looks\
    \ slightly different. It typically creates a `QGuiApplication` (base for applications\
    \ with graphical elements but not necessarily `QtWidgets`), instantiates a `QQmlApplicationEngine`,\
    \ and tells the engine to load your main QML file.\n- `main.qml` (or similar,\
    \ check the `main.cpp` loading logic): This is the heart of the UI definition.\
    \ It's a text file written in `QML` (Qt Modeling Language), which describes the\
    \ UI elements and their relationships declaratively.\n\nLet's modify this QML\
    \ application. Open the `main.qml` file. You'll likely see some default QML code,\
    \ probably defining a `Window` element. Inside the `Window` element, you might\
    \ find a `Text` element or just `width/height` properties. Modify the `Window`\
    \ element to set its title and add or modify a `Text` element to display our message.\
    \ Your `main.qml` might look something like this (adapt based on the exact template\
    \ generated):\n\n```qml\nimport QtQuick\nimport QtQuick.Window\n\nWindow {\n \
    \   width: 640\n    height: 480\n    visible: true\n    title: qsTr(\"Hello QML\
    \ World!\") // Set the window title\n\n    Text {\n        anchors.centerIn: parent\
    \  // Center the text in the window\n        text: qsTr(\"Hello QML World!\")\
    \ // Set the text content\n        font.pointSize: 24  // Make the text a bit\
    \ larger\n    }\n}\n```\n\nHere, `Window` and `Text` are QML types. Properties\
    \ like `width`, `height`, `visible`, `title`, and `text` are set using the property:\
    \ value syntax. `qsTr()` is the QML equivalent of `tr()` for localization. `anchors.centerIn:\
    \ parent` is a QML way to easily position elements.\n"
  raw: 'Consulting the Qt documentation for your specific version and platform, or
    searching community forums with the exact error messages you encounter, can provide
    more targeted solutions.


    Conclusion


    Setting up the development environment is the essential first step, laying the
    groundwork for everything that follows. While it involves several components and
    some platform-specific details, using the Qt Online Installer and verifying the
    configuration with Qt Creator streamlines the process considerably. With a working
    Qt 6 SDK, Qt Creator IDE, CMake, and a compatible C++ compiler correctly configured
    in a Kit, you have a powerful and productive environment at your fingertips. You
    are now fully equipped and ready to take the next step: writing your first lines
    of Qt C++ code and bringing your application ideas to life.


    ## Your First Qt Applications: Building "Hello World" with QtWidgets and QML


    * * *


    Now that your development environment is configured, featuring the Qt 6 SDK, Qt
    Creator, and the necessary compilers linked together in a working Kit (as detailed
    in Section 1.1), it''s time for the rewarding part: creating and running actual
    code. We will construct two minimal applications, one using the traditional QtWidgets
    module and another using the modern Qt Quick/QML approach. These "Hello World"
    examples serve two main purposes: they provide final validation that your toolchain
    is functioning correctly for both UI paradigms, and they offer a first glimpse
    into the basic structure of Qt projects.


    Project 1: Your First QtWidgets Application


    Qt Widgets are well-suited for creating classic desktop applications with a native
    look and feel. Let''s build a very simple one.


    1.  Launch Qt Creator.


    2.  Navigate to the menu: File > New Project... (or File > New File or Project...).


    3.  In the dialog that appears, select Application (Qt) from the project types.


    4.  Choose Qt Widgets Application from the central panel and click the Choose...
    button.


    5.  Project Name and Location: Enter a name for your project, for instance, HelloWorldWidgets.
    Select a directory where the project files will be stored. Remember our earlier
    advice: paths without spaces or special characters are generally safer. Click
    Next.


    6.  Build System: You''ll be prompted to select the build system. Ensure CMake
    is selected, as this is the standard for modern Qt 6 development. Click Next.


    7.  Class Information: The wizard suggests default names for the main window class
    (MainWindow) and generates corresponding files (mainwindow.h, mainwindow.cpp,
    mainwindow.ui). For this simple example, accept the defaults. Click Next.


    8.  Translation Files: You might be asked about creating translation files. Leave
    this empty for now. Click Next.


    9.  Kit Selection: This step is crucial. You''ll see a list of the Kits configured
    in Qt Creator. Select the valid Qt 6 Desktop Kit you verified in the previous
    section (e.g., something like "Desktop Qt 6.x.x MSVC2019 64bit" or "Desktop Qt
    6.x.x GCC 64bit"). Ensure only this Kit is checked. Click Next.


    10.  Version Control: You have an option to add the project to a version control
    system like Git. You can skip this for now. Click Finish.


    Qt Creator will now generate the project structure. In the left-hand pane (the
    project explorer), you''ll see several files:


    ● CMakeLists.txt: This text file contains instructions for CMake on how to build
    your application (finding Qt modules, compiling source files, linking libraries).
    We will look into this more later.


    ● main.cpp: This file contains the main function, the entry point of your C++
    application. Its primary role here is to create a QApplication object (which manages
    application-wide resources and the event loop) and to create and show an instance
    of your MainWindow.


    ● mainwindow.h and mainwindow.cpp: These are the header and source files for your
    main window class, derived from QMainWindow.


    ● mainwindow.ui: This XML-based file defines the visual layout of your main window.
    You can double-click it to open it in Qt Creator''s integrated visual editor,
    Qt Designer.


    Let''s make this application announce itself. The simplest way is to set the window''s
    title. Open mainwindow.cpp. Inside the constructor (MainWindow::MainWindow(...)),
    you''ll likely see a line similar to ui->setupUi(this);. Add the following line
    immediately after it:


    C++


    setWindowTitle(tr("Hello Widgets World!"));


    The setWindowTitle function does exactly what its name suggests. We use tr() for
    potential future translation, a good habit even now.


    Now, let''s build and run the application. Locate the green "Run" button (a triangle
    icon, usually in the bottom-left area of Qt Creator, alongside build options).
    Click it, or use the keyboard shortcut (typically Ctrl+R on Windows/Linux, Cmd+R
    on macOS).


    Qt Creator will invoke CMake, then your C++ compiler and linker. If everything
    is configured correctly, after a short build process, you should see a small,
    empty window appear on your desktop. Observe its title bar – it should display
    "Hello Widgets World!". This window will likely adopt the standard appearance
    of applications on your operating system (Windows, macOS, or Linux). Congratulations,
    you''ve successfully built and run your first Qt Widgets application! You can
    simply close the window to stop the application.


    Project 2: Your First Qt Quick/QML Application


    Qt Quick uses the declarative QML language, often preferred for dynamic, animated,
    and touch-friendly interfaces. Let''s create a QML equivalent.


    1.  In Qt Creator, navigate again to File > New Project....


    2.  Select Application (Qt) as the project type.


    3.  This time, choose Qt Quick Application and click Choose....


    4.  Name and Location: Enter a different name, such as HelloWorldQML, and choose
    a location. Click Next.


    5.  Build System: Ensure CMake is selected. Click Next.


    6.  Qt Quick Application Type: You might be offered different templates. Choose
    a simple one like "Qt Quick Application - Empty" or similar (avoiding templates
    that include Controls or other advanced features for this first example). Click
    Next.


    7.  Kit Selection: As before, select the same valid Qt 6 Desktop Kit you used
    for the Widgets project. Click Next.


    8.  Version Control: Skip this if desired. Click Finish.


    Qt Creator generates the files for this QML project:


    ● CMakeLists.txt: Again, defines the build process via CMake, specifying QML modules
    this time.


    ● main.cpp: This main function looks slightly different. It typically creates
    a QGuiApplication (base for applications with graphical elements but not necessarily
    QtWidgets), instantiates a QQmlApplicationEngine, and tells the engine to load
    your main QML file.


    ● main.qml (or similar, check the main.cpp loading logic): This is the heart of
    the UI definition. It''s a text file written in QML (Qt Modeling Language), which
    describes the UI elements and their relationships declaratively.


    Let''s modify this QML application. Open the main.qml file. You''ll likely see
    some default QML code, probably defining a Window element. Inside the Window element,
    you might find a Text element or just width/height properties. Modify the Window
    element to set its title and add or modify a Text element to display our message.
    Your main.qml might look something like this (adapt based on the exact template
    generated):


    QML


    import QtQuick


    import QtQuick.Window


    Window {


    width: 640


    height: 480


    visible: true


    title: qsTr("Hello QML World!") // Set the window title


    Text {


    anchors.centerIn: parent  // Center the text in the window


    text: qsTr("Hello QML World!") // Set the text content


    font.pointSize: 24  // Make the text a bit larger


    }


    }


    Here, Window and Text are QML types. Properties like width, height, visible, title,
    and text are set using the property: value syntax. qsTr() is the QML equivalent
    of tr() for localization. anchors.centerIn: parent is a QML way to easily position
    elements.'
