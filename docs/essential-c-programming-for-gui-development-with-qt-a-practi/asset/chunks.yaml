    Notice how Layout.fillHeight and Layout.fillWidth provide much more control over
    how space is distributed compared to the basic Column positioner.


    Choosing the Right Approach


    ● Anchors: Fundamental for nearly all relative positioning tasks. Use them to
    center items, align edges, fill parent containers, or position items relative
    to siblings. Often used inside items managed by layouts or positioners.


    ● Positioners (Row, Column, Grid, Flow): Best for simple linear or grid arrangements
    where items should mostly keep their intrinsic sizes, and complex resizing policies
    are not needed. Quick for basic lists or flows.


    ● Qt Quick Layouts (RowLayout, ColumnLayout, GridLayout): The preferred choice
    for structured application layouts, forms, toolbars, status bars, and any complex
    arrangement where intelligent resizing, alignment, and space distribution are
    important. They handle varying content sizes (like translated text) more robustly.
    Choose these when building interfaces analogous to those you''d create with QtWidgets
    layouts.


    Often, the best approach involves combining these techniques – for example, using
    a ColumnLayout for the main structure, and then using anchors within one of the
    items managed by the layout to precisely position an overlay element.


    QML offers flexible and powerful tools for arranging items. While fixed x/y coordinates
    should be used sparingly, Anchors provide the foundation for fluid relative positioning.
    For simpler sequences and grids, Positioners like Row and Column offer convenience.
    For robust, size-aware arrangements typical of application UIs, the Qt Quick Layouts
    module (RowLayout, ColumnLayout, GridLayout) with its attached properties is generally
    the most powerful and recommended approach. Understanding when and how to use
    each of these techniques is key to building adaptive and professional-looking
    Qt Quick interfaces.


    ## Basic Interactivity: Handling Mouse/Touch Input and Introduction to States


    * * *


    Static user interfaces aren''t very engaging. Users need to interact with elements
    – clicking buttons, hovering over items, dragging objects. QML provides straightforward
    mechanisms for handling common input events, primarily through dedicated non-visual
    items like MouseArea. Furthermore, managing the visual feedback for these interactions
    (like highlighting a button when hovered) is elegantly handled using QML''s state
    machine framework.


