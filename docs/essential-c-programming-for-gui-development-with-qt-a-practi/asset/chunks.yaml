    # First Impressions


    You have now successfully built and run minimal applications using Qt''s two primary
    UI technologies. You saw the slightly different project structures generated by
    Qt Creator and the fundamental difference in defining the UI: a more imperative/designer-driven
    approach with QtWidgets versus a declarative text-based approach with QML. Both
    resulted in a running graphical application, confirming your environment is ready
    for either path.


    Building these simple "Hello World" applications is a vital rite of passage. It
    verifies that the complex chain of tools – Qt Creator, `CMake`, the C++ compiler,
    the linker, and the Qt 6 libraries – are all correctly installed and configured
    for both QtWidgets and Qt Quick development. You''ve seen the basic workflow within
    Qt Creator: creating a project from a template, making minor code modifications,
    and executing the application. With this foundation firmly in place, we can now
    proceed to understand the essential C++ features and Qt core concepts that you
    will use consistently throughout your development process.


    # Understanding Qt''s Build Systems


    When you write C++ code, especially for a substantial project involving a framework
    like Qt, the journey from source files (`.cpp`, `.h`, `.ui`, `.qml`, `.qrc`) to
    a runnable application involves several steps. The C++ compiler needs to process
    each source file, Qt-specific tools need to handle things like UI definitions
    and meta-object information, and finally, a linker must combine everything into
    an executable. Managing this process – tracking dependencies between files, invoking
    the right tools with the right options, handling differences between operating
    systems and compilers – is the job of a build system. A build system automates
    these complex tasks, ensuring your application is built correctly and consistently.


    Qt historically provided its own dedicated build tool, `qmake`, while modern Qt
    development, particularly starting with Qt 6, heavily favors the industry-standard
    `CMake`. Understanding the basics of both is helpful, though our focus moving
    forward will be squarely on `CMake`.


    ## qmake: The Classic Qt Build System


    For many years, `qmake` was the standard build system for Qt projects. It was
    designed specifically for Qt, making simple Qt applications very easy to configure.
    It uses project files with a `.pro` extension. These files contain variables that
    define the project''s characteristics and the files involved.


    Let''s consider a hypothetical, minimal `.pro` file for a simple Qt Widgets application:


    ```makefile

    TEMPLATE = app

    TARGET = HelloWorldWidgets

    QT += core gui widgets

    SOURCES += \

    main.cpp \

    mainwindow.cpp

    HEADERS += \

    mainwindow.h

    FORMS += \

    mainwindow.ui

    ```


    Here''s a breakdown of these common `qmake` variables:


    - `TEMPLATE = app`: Specifies that we are building an executable application (`lib`
    would be used for building libraries).

    - `TARGET = HelloWorldWidgets`: Defines the name of the output executable file.

    - `QT += core gui widgets`: This is crucial for `qmake`. It tells `qmake` that
    the project depends on the `core`, `gui`, and `widgets` modules from Qt. `qmake`
    uses this information to automatically add the necessary include paths, linker
    flags, and dependencies for these modules. The `+=` syntax means "add to the list".

    - `SOURCES += ...`: Lists the C++ source files (`.cpp`) to be compiled.

    - `HEADERS += ...`: Lists the C++ header files (`.h`). While not strictly needed
    for compilation itself, listing them helps `qmake` track dependencies and assists
    IDEs like Qt Creator.

    - `FORMS += ...`: Lists the Qt Designer UI files (`.ui`). `qmake` knows it needs
    to run the User Interface Compiler (`uic`) on these files to generate C++ code.


    `qmake` processes this `.pro` file and generates platform-specific build instructions,
    typically in the form of Makefiles on Linux and macOS, or potentially project
    files for IDEs like Visual Studio on Windows. The `make` utility (or the IDE''s
    build system) then reads these instructions to compile and link the application.
    `qmake` also includes simple conditional logic (e.g., `win32 { SOURCES += ...
    }`) to handle platform differences.


    While `qmake` is straightforward for basic Qt-only projects and you will undoubtedly
    encounter it in older examples or existing codebases, it becomes less convenient
    when dealing with complex dependencies (especially non-Qt libraries) or when aiming
    for integration within the broader C++ ecosystem. For new projects with Qt 6,
    `qmake` is generally considered legacy.


    ## CMake: The Modern Standard for Qt 6


    `CMake` is a powerful, open-source, cross-platform build system generator. Unlike
    `qmake`, it''s not specific to Qt but is widely adopted across the C++ community
    for projects of all sizes. Recognizing `CMake`s strengths in handling complex
    builds, managing dependencies, and integrating with various tools and IDEs, The
    Qt Company designated `CMake` as the primary, officially supported build system
    for Qt 6.


    `CMake` uses configuration files named `CMakeLists.txt`. Let''s see how our simple
    Widgets application might be described using `CMake`:


    ```cmake

    cmake_minimum_required(VERSION 3.16) # Specify minimum CMake version

    project(HelloWorldWidgets VERSION 1.0 LANGUAGES CXX) # Define project name, version,
    language

    set(CMAKE_CXX_STANDARD 17) # Require C++17 standard

    set(CMAKE_CXX_STANDARD_REQUIRED ON)

    set(CMAKE_AUTOMOC ON)      # Enable automatic moc handling

    set(CMAKE_AUTORCC ON)      # Enable automatic rcc handling


    # Find the Qt 6 installation and required components

    find_package(Qt6 REQUIRED COMPONENTS Core Widgets)


    # Define the executable target and its source files

    add_executable(HelloWorldWidgets

    main.cpp

    mainwindow.cpp

    mainwindow.h

    mainwindow.ui

    )


    # Link the executable against the required modules

    target_link_libraries(HelloWorldWidgets PRIVATE

    Qt6::Core

    Qt6::Gui

    Qt6::Widgets

    )

    ```


    Key CMake commands and concepts illustrated here:


    - `cmake_minimum_required()`: Sets the minimum version of `CMake` needed to process
    this file.

    - `project()`: Names the project.

    - `set(CMAKE_CXX_STANDARD ...)`: A standard CMake way to specify the required
    C++ standard (e.g., 17 for C17).

    - `set(CMAKE_AUTOMOC ON)`, `set(CMAKE_AUTORCC ON)`, `set(CMAKE_AUTOUIC ON)`: These
    are crucial boolean variables provided by Qt''s CMake integration. Setting them
    to `ON` tells CMake to automatically detect the need for and invoke Qt''s Meta-Object
    Compiler (`moc`), Resource Compiler (`rcc`), and User Interface Compiler (`uic`).

    - `find_package(Qt6 REQUIRED COMPONENTS ...)`: This command instructs CMake to
    locate an installed Qt 6 package and ensures that the specified `COMPONENTS` (Core,
    Widgets) are available.

    - `add_executable(...)`: Defines an executable target (named `HelloWorldWidgets`
    here) and lists the source files required to build it.

    - `target_link_libraries(...)`: Links the specified target against the required
    libraries. Qt''s CMake integration provides imported targets like `Qt6::Core`,
    `Qt6::Gui`, etc., which encapsulate all necessary include paths and library flags
    for that module. `PRIVATE` indicates these are dependencies needed to build the
    target itself.

