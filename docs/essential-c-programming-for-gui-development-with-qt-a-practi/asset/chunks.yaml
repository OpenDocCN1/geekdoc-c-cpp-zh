    ○     painter.drawRect(x, y, width, height); or drawRect(QRect);


    ○     painter.drawEllipse(x, y, width, height); or drawEllipse(QRect);


    ○     painter.drawText(x, y, "Some Text"); or drawText(QRect, flags, "Text");


    ○     painter.drawPixmap(x, y, QPixmap);


    ○ And many more (arcs, polygons, paths, etc.). Coordinates are typically relative
    to the widget''s top-left corner (0,0).


    Triggering Repaints (update()):


    Crucially, you never call paintEvent directly. If the state of your widget changes
    (e.g., a value it displays is modified, its color should change) and it needs
    to be visually updated, you call its update() slot. This function notifies Qt
    that the widget needs repainting; Qt will then schedule a paintEvent call efficiently,
    often coalescing multiple update requests.


    Size Hints:


    Widgets drawn from scratch need to inform Qt''s layout system about their preferred
    size. Reimplement these virtual functions:


    ● virtual QSize sizeHint() const override;: Return the ideal/preferred size for
    your widget based on its content or design.


    ● virtual QSize minimumSizeHint() const override;: Return the minimum sensible
    size below which the widget shouldn''t shrink. Layout managers use these hints
    to allocate space appropriately.


    Example Idea (ColorCircleWidget):


    ●     Inherit QWidget.


    ●     Add a QColor m_color member.


    ● Add a public slot setColor(const QColor &color) which updates m_color and calls
    update().


    ● Reimplement paintEvent: Create QPainter, set render hint Antialiasing, set brush
    to m_color, set pen to Qt::black or Qt::NoPen. Calculate a rectangle fitting within
    the widget''s bounds (rect()), potentially making it square, and call painter.drawEllipse(rect).


    ● Reimplement sizeHint to return a sensible default size (e.g., QSize(50, 50)).


    Choosing the Approach


    ● Use Composition when you can build your desired widget from existing standard
    Qt widgets. It''s faster to develop and leverages existing functionality, styling,
    and accessibility.


    ● Use Custom Painting when you need a truly unique visual representation (like
    charts, graphs, custom dials, artistic elements) or specialized low-level interaction
    handling that standard widgets don''t provide. It offers complete control but
    requires more implementation effort, including handling size hints and potentially
    mouse/keyboard events manually.


    Creating custom widgets is a powerful technique in Qt Widgets development. Whether
    you compose existing widgets within a new QWidget subclass or dive into custom
    drawing using QPainter within the paintEvent, you can build precisely the user
    interface components your application requires. Composition offers rapid development
    by reusing standard elements, while QPainter provides ultimate control over visual
    appearance for unique graphical representations. Understanding both approaches
    allows you to choose the most effective strategy for each specific UI challenge.


    ## Styling QtWidgets Applications with Qt Style Sheets (QSS)


    * * *


    By default, Qt Widgets strive to adopt the native look and feel of the underlying
    operating system (Windows, macOS, Linux). This ensures applications feel integrated
    into the user''s environment, which might have its own themes and variations (even
    within Germany, different Linux desktop environments or Windows versions present
    different default styles). However, you often want to apply custom branding, create
    a unique visual theme, or simply fine-tune the appearance of specific widgets
    beyond what their basic properties allow. Qt Style Sheets (QSS) provide a flexible
    and declarative mechanism to achieve this.


    Inspired by Cascading Style Sheets (CSS) used in web development, QSS allows you
    to define rules that specify how widgets should be rendered, controlling aspects
    like colors, borders, backgrounds, fonts, padding, and margins. It separates the
    visual appearance from the widget''s core functionality.


    QSS Syntax Basics


    The fundamental structure of a QSS rule is straightforward and mirrors CSS:


    Code snippet


    selector {


    property: value;


    property2: value2;


    /* Add more properties as needed */


    }


    ●     Selector: Determines which widget(s) the rule applies to.


    ● Declaration Block: Enclosed in curly braces {}, containing one or more property-value
    pairs.


    ● Property-Value Pair: Specifies a visual attribute (e.g., background-color) and
    the value it should take (e.g., blue). Pairs end with a semicolon ;.


    ●     Comments: C-style comments /* comment */ can be used.


    Selectors: Targeting Widgets


    Choosing the right selector is key to applying styles precisely where you want
    them.


    ● Type Selector: Targets all instances of a specific widget class (and its subclasses,
    unless overridden by a more specific rule). This is very common for applying general
    styles.


    Code snippet


    QPushButton { background-color: lightgray; border-radius: 5px; }


    QLineEdit { border: 1px solid gray; }


    ● Object Name Selector (#objectName): Targets a single, specific widget instance
    based on its object name, which you set in your C++ code using widget->setObjectName("mySpecialButton");.
    This is highly specific and ideal for unique elements.


    Code snippet


    QPushButton#okButton { background-color: green; color: white; }


    QLabel#errorLabel { color: red; font-weight: bold; }


    ●     (Note: Unlike CSS''s #id, QSS uses #objectName).


    ● Class Selector (.): Used less commonly than Type or Object Name selectors for
    standard widgets, but can target custom widget types or specific internal Qt classes.
    Example: .MyCustomWidget { border: 2px solid orange; }.


    ● Attribute Selector ([property="value"]): Targets widgets based on the value
    of their Qt properties (ones defined with Q_PROPERTY). Example: QPushButton[flat="true"]
    { border: none; }.


    ●     Combinators: Define relationships between selectors:


    ○ Descendant Selector (space): QFrame QLabel { color: blue; } (Styles any QLabel
    that is a child, grandchild, etc., of a QFrame).


    ○ Child Selector (>): QFrame > QLabel { font-style: italic; } (Styles only QLabels
    that are direct children of a QFrame).


    ● Pseudo-States (:): Apply styles conditionally based on the widget''s current
    state. Essential for interactive feedback.


    ○     :hover: Mouse cursor is over the widget.


    ○ :pressed: Widget is currently being pressed (e.g., a button click).


    ○     :checked: Widget is checked (e.g., QCheckBox, QRadioButton).


    ○     :unchecked: Widget is not checked.


    ○     :disabled: Widget is disabled (setEnabled(false)).


    ○     :enabled: Widget is enabled.


    ○     :focus: Widget has keyboard focus.


    ○     :on, :off: Often used for checkable items like QCheckBox.


    ○ You can chain pseudo-states: QPushButton:hover:!pressed { background-color:
    #eeeeee; } (Style when hovered but not currently pressed).


    Code snippet


    QPushButton { background-color: lightblue; border: 1px solid darkblue; }


    QPushButton:hover { background-color: skyblue; }


    QPushButton:pressed { background-color: darkblue; color: white; }


    QPushButton:disabled { background-color: #cccccc; color: #888888; }


    ● Sub-Controls (::): Target specific parts or elements within a more complex widget.


    ○     QCheckBox::indicator (The checkable box itself).


    ○     QRadioButton::indicator:checked (The indicator of a checked radio button).


    ○     QSlider::groove:horizontal (The groove the slider moves in).


    ○     QSlider::handle:horizontal (The draggable handle).


    ○     QComboBox::drop-down (The arrow button part).


    ○     QTabBar::tab (Individual tabs in a QTabWidget).


    ○     QTableView::item:selected (A selected item in a table view).


    Code snippet


    QCheckBox::indicator { width: 15px; height: 15px; border: 1px solid gray; }


    QCheckBox::indicator:checked { background-color: green; image: url(:/icons/checkmark.png);
    }


    QSlider::handle:horizontal { background: qlineargradient(...); border-radius:
    5px; width: 10px; }


    Common QSS Properties


    QSS supports a wide range of properties similar to CSS. Some essentials include:'
