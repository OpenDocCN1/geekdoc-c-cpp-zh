    ## Developing Custom Models (`QAbstractItemModel`)


    * * *


    Standard Qt models offer convenience but lack the flexibility needed when interfacing
    with intricate or large-scale data backends. Developing a custom model becomes
    necessary when:


    ● Your data source is a custom C++ class structure (e.g., QList<MyBusinessObject*>,
    complex trees of objects).


    ● Data comes from a database requiring specialized queries or business logic beyond
    what QSqlTableModel provides.


    ●     Data is fetched dynamically from a network service.


    ● You need to implement on-demand data loading (lazy loading) for very large datasets.


    ● You require custom logic for sorting, filtering, editing validation, or drag-and-drop
    operations directly tied to the data source.


    ● You need to represent data that doesn''t map easily to a simple list or grid
    (e.g., complex relational data).


    The foundation for all Qt models is QAbstractItemModel. For simpler list or table
    structures, Qt provides the convenience subclasses QAbstractListModel and QAbstractTableModel,
    which pre-implement some functions relevant to their specific structure. Creating
    a custom model involves inheriting from one of these classes and reimplementing
    several key virtual functions that define the contract between your data source
    and Qt''s views and delegates.


    The Core Read-Only Interface


    At a minimum, even for a model that only displays data (read-only), you must implement
    the following pure virtual functions inherited from QAbstractItemModel:


    1.  rowCount(const QModelIndex &parent = QModelIndex()) const override:


    ○ Purpose: Returns the number of rows available under the item specified by the
    parent model index.


    ○ Implementation: If parent is invalid (!parent.isValid()), it refers to the top
    level of the model; return the number of top-level rows. For list/table models,
    if parent is valid, you typically return 0 (as they don''t have nested rows under
    items). For tree models, you return the number of direct children of the item
    identified by parent. You''ll need to access your backend data based on the parent
    index to determine the child count.


    2.  columnCount(const QModelIndex &parent = QModelIndex()) const override:


    ○ Purpose: Returns the number of columns available under the item specified by
    the parent model index.


    ○ Implementation: For list models, this always returns 1\. For table models, it
    typically returns a fixed number representing the columns in your table, regardless
    of the parent. For tree models, it might depend on the parent item if sub-items
    have varying column structures, but often it''s constant for all items at the
    same level.


    3.  data(const QModelIndex &index, int role = Qt::DisplayRole) const override:


    ○ Purpose: This is the heart of the model – it retrieves the actual data for display
    or other purposes. It''s called frequently by views and delegates.


    ○ Implementation: Check if the provided index is valid (index.isValid()). If not,
    return an empty QVariant(). Get the row and column from the index (index.row(),
    index.column()). Use this, potentially along with internal data retrieved from
    the index (see below), to locate the corresponding item in your backend data structure.
    Then, use a switch statement on the requested role (Qt::DisplayRole, Qt::DecorationRole,
    Qt::ToolTipRole, custom roles, etc.) and return the appropriate piece of data
    for that role, wrapped in a QVariant. If the role isn''t supported for this item,
    return QVariant(). Efficiency here is key.


    4.  index(int row, int column, const QModelIndex &parent = QModelIndex()) const
    override:


    ○ Purpose: Creates the QModelIndex object that views and delegates use to refer
    to the specific child item located at the given row and column relative to the
    parent index.


    ○ Implementation: This function bridges the gap between the row/column/parent
    coordinates used by views and your internal data representation. Inside this function,
    you determine which internal data item corresponds to the requested row, column,
    and parent. You then use the protected createIndex(row, column, internalData)
    function (provided by QAbstractItemModel). The crucial part is internalData, which
    can be:


    ■ A quintptr (e.g., storing an index or ID into your data structure). Use index.internalId()
    later to retrieve it.


    ■ A void* pointer directly to your C++ backend object or data structure node.
    Use index.internalPointer() later to retrieve it. Warning: If using pointers,
    you must ensure the pointed-to object remains valid for the lifetime of any model
    indices referring to it.


    ○ The QModelIndex created stores the row, column, and your internal data, allowing
    you to map back to your backend data in other functions like data() and parent().


    5.  parent(const QModelIndex &child) const override:


    ○ Purpose: Returns the QModelIndex corresponding to the parent of the given child
    index. The inverse of index().


    ○ Implementation: Retrieve the internal data associated with the child index (child.internalPointer()
    or child.internalId()). Use this to find the corresponding parent item in your
    backend data structure. If a parent exists, determine its row and column relative
    to its parent and create a QModelIndex for it using createIndex(). If the child
    represents a top-level item, return an invalid QModelIndex() (QModelIndex()).
    Essential for tree models; trivial for list/table models (usually just returns
    QModelIndex()).


    Enabling Editing (Read-Write Models)'
