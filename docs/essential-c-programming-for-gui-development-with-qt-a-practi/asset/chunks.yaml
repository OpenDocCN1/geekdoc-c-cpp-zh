    \n}\n```\n\n● `void keyPressEvent(QKeyEvent *event)`: 当小部件拥有键盘焦点并按下按键时调用。事件对象提供了键码（`event->key()`，例如\
    \ `Qt::Key_Enter`、`Qt::Key_A`）和修饰键状态（`event->modifiers()`）。\n\nC++\n\n```cpp\n\
    // 在 MyWidget.cpp\n\n#include <QKeyEvent>\n#include <QDebug>\n\nvoid MyWidget::keyPressEvent(QKeyEvent\
    \ *event) {\n    if (event->key() == Qt::Key_Space) {\n        qDebug() << \"\
    Space bar pressed!\";\n        // 执行操作...\n    } else if (event->key() == Qt::Key_Escape)\
    \ {\n        qDebug() << \"Escape pressed, closing widget maybe?\";\n        close();\
    \ // 示例操作\n    } else {\n        QWidget::keyPressEvent(event); // 将未处理的按键传递给基类\n\
    \    }\n}\n```\n\n● `void paintEvent(QPaintEvent *event)`: 这是自定义绘制的基础。每当 Qt 确定小部件（或其部分）需要重绘时，它就会被调用。在此处理器内部，你通常会为小部件创建一个\
    \ `QPainter` 对象，并使用它的方法绘制形状、文本、图像等。我们稍后详细介绍 `QPainter`。至关重要的是，不要直接在 `paintEvent`\
    \ 之外调用绘图函数。如果你需要触发重绘，请调用 `update()` 或 `repaint()`。\n\n● `void closeEvent(QCloseEvent\
    \ *event)`: 当用户尝试关闭顶层窗口（例如点击“X”按钮）时调用。你可以重写此方法以拦截关闭请求，或许是为了提示用户保存更改。你可以使用 `event->accept()`（允许关闭）或\
    \ `event->ignore()`（阻止关闭）来控制窗口是否实际关闭。\n\nC++\n\n```cpp\n// 在 MyMainWindow.cpp\n\
    \n#include <QCloseEvent>\n#include <QMessageBox>\n\nvoid MyMainWindow::closeEvent(QCloseEvent\
    \ *event) {\n    if (isModified()) { // 假设 isModified() 检查是否有未保存的更改\n        QMessageBox::StandardButton\
    \ res;\n        res = QMessageBox::warning(this, \"Unsaved Changes\",\n      \
    \      \"Do you want to save your changes?\",\n            QMessageBox::Save |\
    \ QMessageBox::Discard | QMessageBox::Cancel);\n        if (res == QMessageBox::Save)\
    \ {\n            saveChanges(); // 调用函数保存\n            event->accept(); // 允许关闭\n\
    \        } else if (res == QMessageBox::Discard) {\n            event->accept();\
    \ // 允许关闭\n        } else { // 取消\n            event->ignore(); // 阻止关闭\n    \
    \    }\n    } else {\n        event->accept(); // 无更改，允许关闭\n    }\n}\n```\n\n\
    ● `void resizeEvent(QResizeEvent *event)`: 在小部件被调整大小后调用。事件包含 `oldSize()` 和 `newSize()`。这对于执行超出\
    \ Qt 标准布局管理器范围的自定义布局调整非常有用。\n\n**重要**：当你重写事件处理器时，必须决定是否也调用基类的实现（例如 `QWidget::keyPressEvent(event)`）。调用基类实现可以确保执行任何默认行为或进一步的传播逻辑。通常，如果你没有完全处理该事件，或者你想增强而非完全替换基类行为，就会调用它。\n\
    \n### 事件传播：`accept()` 和 `ignore()`\n\n对于许多类型的事件，特别是小部件上的输入事件，Qt 采用了传播机制。如果小部件没有处理某个事件，Qt\
    \ 可能会将事件提供给其父小部件，并此类推向上级。你使用 `QEvent` 对象上的方法来控制这一点：\n\n● `event->accept()`：如果你成功处理了事件，在事件处理器中调用它。这通常会阻止事件进一步传播。许多事件处理器如果没有显式忽略事件，就会隐式接受事件。\n\
    \n● `event->ignore()`：如果你的小部件未处理该事件，请调用此项。这通知 Qt 应该继续尝试传递事件，通常是通过将其传递给父小部件。`closeEvent`\
    \ 的示例演示了使用 `ignore()` 来取消关闭操作。\n\n### 事件过滤器：拦截事件\n\n除了在接收事件的类中直接重写事件处理器外，Qt 还提供了另一种强大的机制：事件过滤器。事件过滤器允许一个\
    \ `QObject`（过滤器对象）监控并可能拦截发往另一个 `QObject`（观察对象）的事件。\n\n1. **安装过滤器**：调用 `watchedObject->installEventFilter(filterObject);`。\n\
    2. **重写 eventFilter**：在 `filterObject` 的类中，重写虚函数 `bool eventFilter(QObject *watched,\
    \ QEvent *event)`。\n3. **逻辑**：在 `eventFilter` 内部，检查观察对象和事件类型是否是你想要拦截的。如果你完全处理了事件，执行你的操作并返回\
    \ `true`。返回 `true` 会防止事件进一步传递（包括传递给观察对象自身的 `event()` 函数或特定的处理器）。如果你没有处理该事件，或者只想监控它，请返回\
    \ `false`（或者更好的是调用基类实现：`return QObject::eventFilter(watched, event);`）以允许正常处理继续。\n\
    \n事件过滤器对于实现集中的事件处理逻辑、在不创建子类的情况下修改现有小部件的行为或调试事件流非常有用。然而，它们有时会让控制流变得不如直接重写处理器那么直观。\n\
    \nQt 的事件系统由事件循环调度，是交互和响应的响应。事件通过 `event()` 函数传递给 `QObject`，通常分发到特定的处理器如 `mousePressEvent`、`keyPressEvent`\
    \ 或 `paintEvent`。重写这些处理器是定义自定义响应的主要方式。理解事件传播（`accept()` 和 `ignore()`）以及事件过滤器机制可以对事件处理进行精细控制。虽然事件是底层的，但通常会触发高级的信号槽机制，构成应用程序内通信和反应的整体。\n\
    \n第四章：使用 QtWidgets 构建界面\n\n### 必要的布局管理：有效地安排小部件\n\n***\n\n初次接触 GUI 开发时，通过指定精确坐标和固定大小在窗口上放置小部件（使用\
    \ `setGeometry`、`move` 或 `resize`）似乎很直观。然而，对于超出简单的固定大小对话框，这种方法很快就会出现问题。为什么呢？\n\
    \n考虑以下情况：\n\n● 当窗口调整大小时：固定位置的小部件不会重新排列，导致元素重叠或出现过多空白。\n● 文本长度变化：如果你的程序被翻译成单词更长的语言（例如法语），固定大小的标签或按钮可能会截断文本。同样，用户可调的字体大小也会破坏固定布局。\n\
    ● 使用不同的屏幕分辨率或 DPI 设置：在一个屏幕上看起来很好的布局在另一个屏幕上可能显得拥挤或过于空旷。\n● 平台外观和感觉不同：不同的操作系统对小部件有标准的间距和外观。固定定位忽略了这些规范。\n\
    \n为了解决这些挑战并创建专业的、自适应的用户界面，Qt 提供了一套强大的布局管理器系统。这些对象会自动控制在容器（如 `QWidget` 或 `QMainWindow`）内部的小部件的大小和位置，确保它们根据预定义的规则进行逻辑排列。\n\
    \n布局管理基础\n\n核心思想非常简单：不是告诉每个小部件具体去哪里以及多大，而是将相关的小部件分组并将它们分配给布局管理器。然后你告诉布局管理器你希望如何安排这些小部件（例如在一行中、一列或网格中）。布局管理器负责计算它控制的每个小部件的适当几何形状。\n\
    \n关键概念：\n\n"
- fmt: "\n# Qt Layout Management\n\n- **Automatic Arrangement**: Layouts handle the\
    \ geometry calculations. When the container widget is resized, the layout automatically\
    \ rearranges its widgets according to its rules and the widgets' size hints (their\
    \ preferred sizes).\n- **Widget Ownership**: You add widgets to a layout using\
    \ functions like `addWidget()`. Once added, the layout manages the widget's size\
    \ and position within the container. You typically should not call `setGeometry`,\
    \ `move`, or `resize` on widgets managed by a layout.\n- **Setting the Layout**:\
    \ A layout manager itself needs to be associated with the container widget whose\
    \ children it will manage. This is done using the container's `setLayout()` function.\
    \ A widget can only have one top-level layout manager set directly on it.\n\n\
    Qt provides several standard layout manager classes, each suited for different\
    \ arrangement tasks.\n\n## Core Qt Layout Classes\n\n### 1. QHBoxLayout (Horizontal\
    \ Layout)\n- **Purpose**: Arranges widgets side-by-side in a single horizontal\
    \ row.\n- **Usage**: Ideal for toolbars, button groups (like OK/Cancel), or any\
    \ set of elements that should appear next to each other. Widgets are added from\
    \ left to right.\n- **Example**:\n```cpp\n#include <QHBoxLayout>\n#include <QPushButton>\n\
    #include <QWidget> // Include necessary headers\n\n// Assume 'this' is the parent\
    \ QWidget\nQHBoxLayout *buttonLayout = new QHBoxLayout(); // Create the layout\n\
    QPushButton *okButton = new QPushButton(\"OK\");\nQPushButton *cancelButton =\
    \ new QPushButton(\"Cancel\");\nbuttonLayout->addStretch(1); // Add stretchable\
    \ space first (pushes buttons right)\nbuttonLayout->addWidget(okButton); // Add\
    \ OK button\nbuttonLayout->addWidget(cancelButton); // Add Cancel button\n// this->setLayout(buttonLayout);\
    \ // Set this layout on the parent later\n```\n- `addStretch(int stretchFactor)`\
    \ adds expandable empty space. Widgets added after it will be pushed towards the\
    \ right (or bottom for `QVBoxLayout`). The `stretchFactor` controls how much space\
    \ it takes relative to other stretches (more later).\n- `addSpacing(int size)`\
    \ adds fixed-size empty space.\n\n### 2. QVBoxLayout (Vertical Layout)\n- **Purpose**:\
    \ Arranges widgets one above the other in a single vertical column.\n- **Usage**:\
    \ Perfect for stacking input fields, labels, list views, or groups of controls\
    \ vertically. Widgets are added from top to bottom.\n- **Example**:\n```cpp\n\
    #include <QVBoxLayout>\n#include <QLabel>\n#include <QLineEdit>\n#include <QWidget>\
    \ // Include necessary headers\n\n// Assume 'this' is the parent QWidget\nQVBoxLayout\
    \ *formLayout = new QVBoxLayout();\nQLabel *nameLabel = new QLabel(\"Name:\");\n\
    QLineEdit *nameEdit = new QLineEdit();\nQLabel *emailLabel = new QLabel(\"Email:\"\
    );\nQLineEdit *emailEdit = new QLineEdit();\nformLayout->addWidget(nameLabel);\n\
    formLayout->addWidget(nameEdit);\nformLayout->addWidget(emailLabel);\nformLayout->addWidget(emailEdit);\n\
    formLayout->addStretch(1); // Pushes content upwards if space allows\n// this->setLayout(formLayout);\
    \ // Set this layout on the parent later\n```\n\n### 3. QGridLayout (Grid Layout)\n\
    - **Purpose**: Arranges widgets in a grid of rows and columns. This is the most\
    \ flexible layout for two-dimensional arrangements.\n- **Usage**: Suitable for\
    \ calculator layouts, complex forms where alignment in rows and columns is needed,\
    \ or any grid-like structure. Widgets can span multiple rows or columns.\n- **Example**:\n\
    ```cpp\n#include <QGridLayout>\n#include <QPushButton>\n#include <QLineEdit>\n\
    #include <QWidget> // Include necessary headers\n\n// Assume 'this' is the parent\
    \ QWidget\nQGridLayout *gridLayout = new QGridLayout();\nQLineEdit *display =\
    \ new QLineEdit();\ndisplay->setReadOnly(true);\n// Add display spanning 4 columns\
    \ in row 0\ngridLayout->addWidget(display, 0, 0, 1, 4); // widget, row, col, rowSpan,\
    \ colSpan\n// Add some number buttons\ngridLayout->addWidget(new QPushButton(\"\
    7\"), 1, 0);\ngridLayout->addWidget(new QPushButton(\"8\"), 1, 1);\ngridLayout->addWidget(new\
    \ QPushButton(\"9\"), 1, 2);\ngridLayout->addWidget(new QPushButton(\"/\"), 1,\
    \ 3); // Operator\ngridLayout->addWidget(new QPushButton(\"4\"), 2, 0);\n// ...\
    \ add more buttons ...\n// Make column 3 stretch more than others if extra space\
    \ is available\ngridLayout->setColumnStretch(3, 1);\n// this->setLayout(gridLayout);\
    \ // Set this layout on the parent later\n```\n- `setColumnStretch(int column,\
    \ int stretchFactor)` and `setRowStretch(...)` control how extra space is distributed\
    \ among columns/rows.\n\n### 4. QFormLayout (Form Layout)\n- **Purpose**: Specifically\
    \ designed for creating two-column input forms, typically consisting of a label\
    \ in the first column and an input widget (like `QLineEdit`, `QComboBox`, `QSpinBox`)\
    \ in the second column. It automatically aligns items according to platform conventions\
    \ (e.g., labels might be right-aligned on some platforms).\n- **Usage**: Very\
    \ convenient for settings dialogs, database entry forms, etc.\n- **Example**:\n\
    ```cpp\n#include <QFormLayout>\n#include <QLabel>\n#include <QLineEdit>\n#include\
    \ <QSpinBox>\n#include <QWidget> // Include necessary headers\n\n// Assume 'this'\
    \ is the parent QWidget\nQFormLayout *formLayout = new QFormLayout();\nQLineEdit\
    \ *nameEdit = new QLineEdit();\nQLineEdit *emailEdit = new QLineEdit();\nQSpinBox\
    \ *ageSpinBox = new QSpinBox();\nformLayout->addRow(\"Name:\", nameEdit);\nformLayout->addRow(\"\
    Email:\", emailEdit);\nformLayout->addRow(\"Age:\", ageSpinBox);\n// this->setLayout(formLayout);\
    \ // Set this layout on the parent later\n```\n\n## Layout Properties and Nesting\n\
    \n- **Spacing and Margins**: Layout managers have properties to control spacing:\n\
    \    - `setSpacing(int)`: Sets the space between widgets managed by the layout.\n\
    \    - `setContentsMargins(int left, int top, int right, int bottom)`: Sets the\
    \ empty space around the outside edges of the layout, separating its contents\
    \ from the parent widget's border.\n- **Stretch Factors**: When adding widgets\
    \ (`addWidget`), layouts (`addLayout`), or stretch (`add`), you can provide an\
    \ integer stretch factor. When the container is larger than the preferred size\
    \ of its contents, the extra space is distributed among the items in proportion\
    \ to their stretch factors. Items with a stretch factor of 0 do not expand. `add()`\
    \ is simply adding empty space with a stretch factor. This is key for controlling\
    \ how UIs resize.\n- **Spacers (`QSpacerItem`)**: You can create `QSpacerItem`\
    \ objects representing fixed or expanding empty space and add them to layouts\
    \ using `addSpacerItem()`. This provides more explicit control over spacing than\
    \ `addSpacing` or `addStretch` in some cases.\n- **Nesting Layouts**: Real-world\
    \ interfaces are rarely simple enough for a single layout manager. The power of\
    \ Qt's layout system comes from nesting. You can add one layout manager inside\
    \ another using `addLayout()`. For example, your main window might use `QVBoxLayout`.\
    \ Inside that, you might place a `QGridLayout` for the central area, and at the\
    \ bottom, add a `QHBoxLayout` containing OK/Cancel buttons. This hierarchical\
    \ combination allows for virtually any desired arrangement.\n\n## Setting the\
    \ Layout on the Parent Widget\n\nAfter you have created your primary layout manager\
    \ (which might contain nested layouts and widgets), you must associate it with\
    \ the container widget it manages:\n\n```cpp\nQWidget *myDialog = new QWidget();\n\
    QVBoxLayout *mainLayout = new QVBoxLayout(); // Create the top-level layout\n\
    // ... Create widgets and add them to mainLayout or nested layouts ...\nQHBoxLayout\
    \ *buttonLayout = new QHBoxLayout();\nbuttonLayout->addStretch();\nbuttonLayout->addWidget(new\
    \ QPushButton(\"OK\"));\nmainLayout->addLayout(buttonLayout); // Add the nested\
    \ layout to the main layout\n\n// Finally, install the main layout onto the container\
    \ widget\nmyDialog->setLayout(mainLayout);\nmyDialog->show();\n```\n\nOnce `setLayout()`\
    \ is called, the `mainLayout` takes control of arranging all widgets and sub-layouts\
    \ added to it within the boundaries of `myDialog`. The dialog itself will then\
    \ resize according to the layout's calculated minimum and preferred sizes (size\
    \ hints).\n"
  raw: '● Automatic Arrangement: Layouts handle the geometry calculations. When the
    container widget is resized, the layout automatically rearranges its widgets according
    to its rules and the widgets'' size hints (their preferred sizes).


    ● Widget Ownership: You add widgets to a layout using functions like addWidget().
    Once added, the layout manages the widget''s size and position within the container.
    You typically should not call setGeometry, move, or resize on widgets managed
    by a layout.


    ● Setting the Layout: A layout manager itself needs to be associated with the
    container widget whose children it will manage. This is done using the container''s
    setLayout() function. A widget can only have one top-level layout manager set
    directly on it.


    Qt provides several standard layout manager classes, each suited for different
    arrangement tasks.


    Core Qt Layout Classes


    1.  QHBoxLayout (Horizontal Layout):


    ○     Purpose: Arranges widgets side-by-side in a single horizontal row.


    ○ Usage: Ideal for toolbars, button groups (like OK/Cancel), or any set of elements
    that should appear next to each other. Widgets are added from left to right.


    ○     Example:


    C++


    #include <QHBoxLayout>


    #include <QPushButton>


    #include <QWidget> // Include necessary headers


    // Assume ''this'' is the parent QWidget


    QHBoxLayout *buttonLayout = new QHBoxLayout(); // Create the layout


    QPushButton *okButton = new QPushButton("OK");


    QPushButton *cancelButton = new QPushButton("Cancel");


    buttonLayout->addStretch(1); // Add stretchable space first (pushes buttons right)


    buttonLayout->addWidget(okButton); // Add OK button


    buttonLayout->addWidget(cancelButton); // Add Cancel button


    // this->setLayout(buttonLayout); // Set this layout on the parent later


    ■ addStretch(int stretchFactor) adds expandable empty space. Widgets added after
    it will be pushed towards the right (or bottom for QVBoxLayout). The stretchFactor
    controls how much space it takes relative to other stretches (more later).


    ■     addSpacing(int size) adds fixed-size empty space.


    2.  QVBoxLayout (Vertical Layout):


    ○ Purpose: Arranges widgets one above the other in a single vertical column.


    ○ Usage: Perfect for stacking input fields, labels, list views, or groups of controls
    vertically. Widgets are added from top to bottom.


    ○     Example:


    C++


    #include <QVBoxLayout>


    #include <QLabel>


    #include <QLineEdit>


    #include <QWidget> // Include necessary headers


    // Assume ''this'' is the parent QWidget


    QVBoxLayout *formLayout = new QVBoxLayout();


    QLabel *nameLabel = new QLabel("Name:");


    QLineEdit *nameEdit = new QLineEdit();


    QLabel *emailLabel = new QLabel("Email:");


    QLineEdit *emailEdit = new QLineEdit();


    formLayout->addWidget(nameLabel);


    formLayout->addWidget(nameEdit);


    formLayout->addWidget(emailLabel);


    formLayout->addWidget(emailEdit);


    formLayout->addStretch(1); // Pushes content upwards if space allows


    // this->setLayout(formLayout); // Set this layout on the parent later


    3.  QGridLayout (Grid Layout):


    ○ Purpose: Arranges widgets in a grid of rows and columns. This is the most flexible
    layout for two-dimensional arrangements.


    ○ Usage: Suitable for calculator layouts, complex forms where alignment in rows
    and columns is needed, or any grid-like structure. Widgets can span multiple rows
    or columns.


    ○     Example:


    C++


    #include <QGridLayout>


    #include <QPushButton>


    #include <QLineEdit>


    #include <QWidget> // Include necessary headers


    // Assume ''this'' is the parent QWidget


    QGridLayout *gridLayout = new QGridLayout();


    QLineEdit *display = new QLineEdit();


    display->setReadOnly(true);


    // Add display spanning 4 columns in row 0


    gridLayout->addWidget(display, 0, 0, 1, 4); // widget, row, col, rowSpan, colSpan


    // Add some number buttons


    gridLayout->addWidget(new QPushButton("7"), 1, 0);


    gridLayout->addWidget(new QPushButton("8"), 1, 1);


    gridLayout->addWidget(new QPushButton("9"), 1, 2);


    gridLayout->addWidget(new QPushButton("/"), 1, 3); // Operator


    gridLayout->addWidget(new QPushButton("4"), 2, 0);


    // ... add more buttons ...


    // Make column 3 stretch more than others if extra space is available


    gridLayout->setColumnStretch(3, 1);


    // this->setLayout(gridLayout); // Set this layout on the parent later


    ■ setColumnStretch(int column, int stretchFactor) and setRowStretch(...) control
    how extra space is distributed among columns/rows.


    4.  QFormLayout (Form Layout):


    ○ Purpose: Specifically designed for creating two-column input forms, typically
    consisting of a label in the first column and an input widget (like QLineEdit,
    QComboBox, QSpinBox) in the second column. It automatically aligns items according
    to platform conventions (e.g., labels might be right-aligned on some platforms).


    ○ Usage: Very convenient for settings dialogs, database entry forms, etc.


    ○     Example:


    C++


    #include <QFormLayout>


    #include <QLabel>


    #include <QLineEdit>


    #include <QSpinBox>


    #include <QWidget> // Include necessary headers


    // Assume ''this'' is the parent QWidget


    QFormLayout *formLayout = new QFormLayout();


    QLineEdit *nameEdit = new QLineEdit();


    QLineEdit *emailEdit = new QLineEdit();


    QSpinBox *ageSpinBox = new QSpinBox();


    formLayout->addRow("Name:", nameEdit); // Adds label (QString) and widget


    formLayout->addRow("Email:", emailEdit);


    formLayout->addRow(new QLabel("Age:"), ageSpinBox); // Can also add QLabel widget


    // this->setLayout(formLayout); // Set this layout on the parent later


    Layout Properties and Nesting


    ● Spacing and Margins: Layout managers have properties to control spacing:


    ○ setSpacing(int): Sets the space between widgets managed by the layout.


    ○ setContentsMargins(int left, int top, int right, int bottom): Sets the empty
    space around the outside edges of the layout, separating its contents from the
    parent widget''s border or other elements.


    ● Stretch Factors: When adding widgets (addWidget), layouts (addLayout), or stretch
    (addStretch), you can provide an integer stretch factor. When the container is
    larger than the preferred size of its contents, the extra space is distributed
    among the items in proportion to their stretch factors. Items with a stretch factor
    of 0 do not expand. addStretch() is simply adding empty space with a stretch factor.
    This is key for controlling how UIs resize.


    ● Spacers (QSpacerItem): You can create QSpacerItem objects representing fixed
    or expanding empty space and add them to layouts using addSpacerItem(). This provides
    more explicit control over spacing than addSpacing or addStretch in some cases.


    ● Nesting Layouts: Real-world interfaces are rarely simple enough for a single
    layout manager. The power of Qt''s layout system comes from nesting. You can add
    one layout manager inside another using addLayout(). For example, your main window
    might use a QVBoxLayout. Inside that, you might place a QGridLayout for the central
    area, and at the bottom, add a QHBoxLayout containing OK/Cancel buttons. This
    hierarchical combination allows for virtually any desired arrangement.


    Setting the Layout on the Parent Widget


    After you have created your primary layout manager (which might contain nested
    layouts and widgets), you must associate it with the container widget it manages:


    C++


    QWidget *myDialog = new QWidget();


    QVBoxLayout *mainLayout = new QVBoxLayout(); // Create the top-level layout


    // ... Create widgets and add them to mainLayout or nested layouts ...


    QHBoxLayout *buttonLayout = new QHBoxLayout();


    buttonLayout->addStretch();


    buttonLayout->addWidget(new QPushButton("OK"));


    mainLayout->addLayout(buttonLayout); // Add the nested layout to the main layout


    // Finally, install the main layout onto the container widget


    myDialog->setLayout(mainLayout);


    myDialog->show();


    Once setLayout() is called, the mainLayout takes control of arranging all widgets
    and sub-layouts added to it within the boundaries of myDialog. The dialog itself
    will then resize according to the layout''s calculated minimum and preferred sizes
    (size hints).'
