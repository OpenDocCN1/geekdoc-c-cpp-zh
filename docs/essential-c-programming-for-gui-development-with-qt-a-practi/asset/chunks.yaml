    #include <QStandardPaths> // For standard locations


    #include <QDir>          // For path manipulation


    QString documentsPath = QStandardPaths::writableLocation(QStandardPaths::DocumentsLocation);


    QString filePath = documentsPath + QDir::separator() + "myfile.txt"; // Use separator()
    for portability


    QFile file(filePath);


    // Writing Example


    if (!file.open(QIODevice::WriteOnly | QIODevice::Text)) {


    qWarning() << "Could not open file for writing:" << file.errorString();


    // return; // Or handle error appropriately


    } else {


    QTextStream out(&file);


    out << "Hello from Qt Application!" << Qt::endl; // Use Qt::endl for newline +
    flush


