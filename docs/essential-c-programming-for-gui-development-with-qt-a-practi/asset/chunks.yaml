- fmt: "\nQt provides a sophisticated and elegant solution to this problem: the signal\
    \ and slot mechanism. It allows objects to communicate without needing explicit\
    \ knowledge of each other, promoting loose coupling and enabling flexible, event-driven\
    \ architectures. Mastering this mechanism is fundamental to effective Qt development.\n\
    \n## The Core Concept: Decoupled Communication\n\nImagine one object (e.g., a\
    \ `QPushButton`) needs to notify others when something interesting happens (e.g.,\
    \ it's clicked). Instead of the button needing a list of specific functions to\
    \ call, it simply emits a signal. A signal is like a broadcast message declaring\
    \ \"Something happened!\".\n\nOther objects (e.g., your main application window,\
    \ a data processing class) that are interested in this event can connect one of\
    \ their functions, called a slot, to that specific signal. When the button emits\
    \ the `clicked()` signal, the Qt framework automatically invokes any slots connected\
    \ to it.\n\n### Key characteristics of this system:\n\n- **Decoupling**: The object\
    \ emitting the signal (the sender) knows nothing about the objects or slots receiving\
    \ it (the receivers). It just emits the signal. Likewise, the receiver knows which\
    \ signal it's connected to but doesn't need direct knowledge of the sender object.\n\
    - **Many-to-Many**: One signal can be connected to multiple slots. One slot can\
    \ be connected to multiple signals.\n- **Type Safety (Modern Syntax)**: Connections\
    \ made using the modern syntax are checked at compile time, ensuring the signal\
    \ and slot arguments are compatible.\n- **Flexibility**: Connections can be established\
    \ or broken at runtime.\n\nThis mechanism relies heavily on the `QObject` base\
    \ class and the metadata generated by the Meta-Object Compiler (`MOC`). When you\
    \ declare signals or use the `Q_OBJECT` macro in a class deriving from `QObject`,\
    \ the `MOC` generates code that enables signal emission and dynamic connection\
    \ management. The Qt event loop (which we'll discuss later) also plays a role,\
    \ particularly in handling communication across different threads.\n\n## Defining\
    \ Signals and Slots\n\nTo participate in this mechanism, a class must typically\
    \ inherit from `QObject` and include the `Q_OBJECT` macro in its declaration.\n\
    \n- **Signals**: Signals are declared using the `signals:` keyword (or `Q_SIGNAL`\
    \ macro before Qt 6). They look like function declarations but require no implementation\
    \ body – the `MOC` provides the necessary magic. Conceptually, they are protected\
    \ members.\n\n- **Slots**: Traditionally, slots were declared using the `slots:`\
    \ keyword (e.g., `public slots:`, `private slots:`). While this still works and\
    \ can help organize code, modern Qt allows any normal C++ member function (public,\
    \ private, or protected), static member function, or compatible free function/lambda\
    \ expression to act as a slot. The `slots:` keyword is primarily needed for compatibility\
    \ with the older, string-based connection syntax.\n\nHere's a simple example:\n\
    \n```cpp\n#include <QObject>\n#include <QDebug>\n\nclass Counter : public QObject\
    \ {\n    Q_OBJECT // Required macro for signals/slots/properties\n\npublic:\n\
    \    explicit Counter(QObject *parent = nullptr) : QObject(parent), m_value(0)\
    \ {}\n    int value() const { return m_value; }\n\npublic slots: // Or just 'public:'\
    \ - any member function can be a slot now\n    void setValue(int value) {\n  \
    \      if (m_value == value)\n            return;\n        m_value = value;\n\
    \        qDebug() << \"Counter value changed to:\" << m_value;\n        emit valueChanged(m_value);\
    \ // Emit the signal\n    }\n\nsignals:\n    void valueChanged(int newValue);\
    \ // Signal declaration, no implementation needed\n\nprivate:\n    int m_value;\n\
    };\n```\n\nIn this `Counter` class, `valueChanged(int)` is declared as a signal.\
    \ The `setValue(int)` function acts as a slot (and a regular method). When `setValue`\
    \ changes the internal value, it emits the `valueChanged` signal using the `emit`\
    \ keyword (which is actually an empty macro resolved by the `MOC`).\n\n## Connecting\
    \ Signals to Slots: QObject::connect\n\nThe static `QObject::connect` function\
    \ establishes a connection between a signal and a slot. There are several syntaxes:\n\
    \n1. **String-Based Syntax (Legacy - Avoid in New Code):**\n```cpp\n// connect(sender,\
    \ SIGNAL(signalSignature(Args)), receiver, SLOT(slotSignature(Args)));\nconnect(counterInstance,\
    \ SIGNAL(valueChanged(int)), labelInstance, SLOT(setNum(int)));\n```\n2. This\
    \ syntax uses macros `SIGNAL` and `SLOT` to specify signal and slot signatures\
    \ as strings. Its major drawback is the complete lack of compile-time checking.\
    \ Typos in the signal/slot names or argument mismatches are only detected at runtime,\
    \ usually as warnings printed to the console. It's also less efficient. Avoid\
    \ this in new Qt 6 projects.\n\n3. **Pointer-to-Member-Function Syntax (Modern\
    \ - Preferred):**\n```cpp\n// connect(sender, &SenderClass::signalName, receiver,\
    \ &ReceiverClass::slotName);\nCounter *counter = new Counter(this);\nQLabel *label\
    \ = new QLabel(this); // Assume label exists\nconnect(counter, &Counter::valueChanged,\
    \ label, &QLabel::setNum);\n```\n4. This syntax uses pointers to member functions.\
    \ It offers full compile-time type checking. If the signal and slot signatures\
    \ are incompatible, or if the signal/slot doesn't exist, the code will fail to\
    \ compile – catching errors early. This is the recommended approach for connecting\
    \ signals to member function slots. If signals or slots are overloaded, you need\
    \ to help the compiler choose the correct overload using `QOverload` (from `<QOverload>`)\
    \ or `qOverload` (a function template available since Qt 5.7):\n```cpp\n// Example\
    \ with overload: assume myObject has void valueChanged(int) and void valueChanged(QString)\n\
    // connect(myObject, qOverload<int>(&MyObjectClass::valueChanged), otherObject,\
    \ &OtherClass::handleIntChange);\n// connect(myObject, qOverload<QString>(&MyObjectClass::valueChanged),\
    \ otherObject, &OtherClass::handleStringChange);\n```\n\n5. **Connecting to Lambdas\
    \ and Free Functions:**\nYou can directly connect signals to C++ lambda expressions\
    \ or compatible free functions/static methods:\n```cpp\n// Connect to a lambda\n\
    int threshold = 10;\nconnect(counter, &Counter::valueChanged, this, [this, threshold](int\
    \ newValue) {\n    if (newValue > threshold) {\n        qDebug() << \"Value\"\
    \ << newValue << \"exceeded threshold\" << threshold;\n        // 'this' and 'threshold'\
    \ are captured from the surrounding scope\n        // Maybe update another UI\
    \ element: this->warningLabel->show();\n    }\n});\n// Connect to a free function\
    \ (signature must match or be compatible)\n// void handleGlobalValueChange(int\
    \ value);\n// connect(counter, &Counter::valueChanged, &handleGlobalValueChange);\n\
    ```\n6. Lambdas are particularly powerful, allowing concise inline handlers and\
    \ easy access to local context.\n\n## Connection Types\n\nThe `connect` function\
    \ can take an optional fifth argument specifying the `Qt::ConnectionType`. This\
    \ primarily affects behaviour when the sender and receiver objects live in different\
    \ threads:\n\n- **Qt::AutoConnection (Default)**: If the sender and receiver are\
    \ in the same thread, it behaves like `Qt::DirectConnection`. If they are in different\
    \ threads, it behaves like `Qt::QueuedConnection`. This is usually the best choice\
    \ unless you have specific threading requirements.\n- **Qt::DirectConnection**:\
    \ The slot is executed immediately in the thread that emitted the signal. If the\
    \ sender and receiver are in different threads, the slot runs in the sender's\
    \ thread. This can be dangerous if the slot accesses data local to the receiver's\
    \ thread without proper locking.\n- **Qt::QueuedConnection**: The call to the\
    \ slot is encapsulated in an event and posted to the event loop of the receiver's\
    \ thread. The slot is executed only when the receiver's event loop processes that\
    \ event. Arguments passed via the signal are copied. This is the standard way\
    \ to perform safe cross-thread communication using signals and slots.\n- **Qt::BlockingQueuedConnection**:\
    \ Similar to `QueuedConnection`, but the sending thread blocks until the slot\
    \ has finished executing in the receiver's thread. Use this with extreme caution,\
    \ as it can easily lead to deadlocks if the receiver thread needs to communicate\
    \ back to the sender thread.\n"
  raw: "Qt provides a sophisticated and elegant solution to this problem: the signal\
    \ and slot mechanism. It allows objects to communicate without needing explicit\
    \ knowledge of each other, promoting loose coupling and enabling flexible, event-driven\
    \ architectures. Mastering this mechanism is fundamental to effective Qt development.\n\
    \nThe Core Concept: Decoupled Communication\n\nImagine one object (e.g., a QPushButton)\
    \ needs to notify others when something interesting happens (e.g., it's clicked).\
    \ Instead of the button needing a list of specific functions to call, it simply\
    \ emits a signal. A signal is like a broadcast message declaring \"Something happened!\"\
    .\n\nOther objects (e.g., your main application window, a data processing class)\
    \ that are interested in this event can connect one of their functions, called\
    \ a slot, to that specific signal. When the button emits the clicked() signal,\
    \ the Qt framework automatically invokes any slots connected to it.\n\nKey characteristics\
    \ of this system:\n\n● Decoupling: The object emitting the signal (the sender)\
    \ knows nothing about the objects or slots receiving it (the receivers). It just\
    \ emits the signal. Likewise, the receiver knows which signal it's connected to\
    \ but doesn't need direct knowledge of the sender object.\n\n● Many-to-Many: One\
    \ signal can be connected to multiple slots. One slot can be connected to multiple\
    \ signals.\n\n● Type Safety (Modern Syntax): Connections made using the modern\
    \ syntax are checked at compile time, ensuring the signal and slot arguments are\
    \ compatible.\n\n●     Flexibility: Connections can be established or broken at\
    \ runtime.\n\nThis mechanism relies heavily on the QObject base class and the\
    \ metadata generated by the Meta-Object Compiler (MOC). When you declare signals\
    \ or use the Q_OBJECT macro in a class deriving from QObject, the MOC generates\
    \ code that enables signal emission and dynamic connection management. The Qt\
    \ event loop (which we'll discuss later) also plays a role, particularly in handling\
    \ communication across different threads.\n\nDefining Signals and Slots\n\nTo\
    \ participate in this mechanism, a class must typically inherit from QObject and\
    \ include the Q_OBJECT macro in its declaration.\n\n● Signals: Signals are declared\
    \ using the signals: keyword (or Q_SIGNAL macro before Qt 6). They look like function\
    \ declarations but require no implementation body – the MOC provides the necessary\
    \ magic. Conceptually, they are protected members.\n\n● Slots: Traditionally,\
    \ slots were declared using the slots: keyword (e.g., public slots:, private slots:).\
    \ While this still works and can help organize code, modern Qt allows any normal\
    \ C++ member function (public, private, or protected), static member function,\
    \ or compatible free function/lambda expression to act as a slot. The slots: keyword\
    \ is primarily needed for compatibility with the older, string-based connection\
    \ syntax.\n\nHere's a simple example:\n\nC++\n\n#include <QObject>\n\n#include\
    \ <QDebug>\n\nclass Counter :  public QObject {\n\nQ_OBJECT // Required macro\
    \ for signals/slots/properties\n\npublic:\n\nexplicit  Counter(QObject *parent\
    \ = nullptr) : QObject(parent), m_value(0) {}\n\nint  value() const { return m_value;\
    \ }\n\npublic slots: // Or just 'public:' - any member function can be a slot\
    \ now\n\nvoid  setValue(int value) {\n\nif (m_value == value)\n\nreturn;\n\nm_value\
    \ = value;\n\nqDebug() << \"Counter value changed to:\" << m_value;\n\nemit valueChanged(m_value);\
    \ // Emit the signal\n\n}\n\nsignals:\n\nvoid  valueChanged(int newValue); //\
    \ Signal declaration, no implementation needed\n\nprivate:\n\nint m_value;\n\n\
    };\n\nIn this Counter class, valueChanged(int) is declared as a signal. The setValue(int)\
    \ function acts as a slot (and a regular method). When setValue changes the internal\
    \ value, it emits the valueChanged signal using the emit keyword (which is actually\
    \ an empty macro resolved by the MOC).\n\nConnecting Signals to Slots: QObject::connect\n\
    \nThe static QObject::connect function establishes a connection between a signal\
    \ and a slot. There are several syntaxes:\n\n1.  String-Based Syntax (Legacy -\
    \ Avoid in New Code):\n\nC++\n\n// connect(sender, SIGNAL(signalSignature(Args)),\
    \ receiver, SLOT(slotSignature(Args)));\n\nconnect(counterInstance, SIGNAL(valueChanged(int)),\
    \ labelInstance, SLOT(setNum(int)));\n\n2.  This syntax uses macros SIGNAL and\
    \ SLOT to specify signal and slot signatures as strings. Its major drawback is\
    \ the complete lack of compile-time checking. Typos in the signal/slot names or\
    \ argument mismatches are only detected at runtime, usually as warnings printed\
    \ to the console. It's also less efficient. Avoid this in new Qt 6 projects.\n\
    \n3.  Pointer-to-Member-Function Syntax (Modern - Preferred):\n\nC++\n\n// connect(sender,\
    \ &SenderClass::signalName, receiver, &ReceiverClass::slotName);\n\nCounter *counter\
    \ = new Counter(this);\n\nQLabel *label = new QLabel(this); // Assume label exists\n\
    \nconnect(counter, &Counter::valueChanged, label, &QLabel::setNum);\n\n4.  This\
    \ syntax uses pointers to member functions. It offers full compile-time type checking.\
    \ If the signal and slot signatures are incompatible, or if the signal/slot doesn't\
    \ exist, the code will fail to compile – catching errors early. This is the recommended\
    \ approach for connecting signals to member function slots. If signals or slots\
    \ are overloaded, you need to help the compiler choose the correct overload using\
    \ QOverload (from <QOverload>) or qOverload (a function template available since\
    \ Qt 5.7):\n\nC++\n\n// Example with overload: assume myObject has void valueChanged(int)\
    \ and void valueChanged(QString)\n\n// connect(myObject, qOverload<int>(&MyObjectClass::valueChanged),\
    \ otherObject, &OtherClass::handleIntChange);\n\n// connect(myObject, qOverload<QString>(&MyObjectClass::valueChanged),\
    \ otherObject, &OtherClass::handleStringChange);\n\n5.  Connecting to Lambdas\
    \ and Free Functions:\n\n    You can directly connect signals to C++ lambda expressions\
    \ or compatible free functions/static methods:\n\nC++\n\n// Connect to a lambda\n\
    \nint threshold = 10;\n\nconnect(counter, &Counter::valueChanged, this, [this,\
    \ threshold](int newValue) {\n\nif (newValue > threshold) {\n\nqDebug() << \"\
    Value\" << newValue << \"exceeded threshold\" << threshold;\n\n// 'this' and 'threshold'\
    \ are captured from the surrounding scope\n\n// Maybe update another UI element:\
    \ this->warningLabel->show();\n\n}\n\n});\n\n// Connect to a free function (signature\
    \ must match or be compatible)\n\n// void handleGlobalValueChange(int value);\n\
    \n// connect(counter, &Counter::valueChanged, &handleGlobalValueChange);\n\n6.\
    \  Lambdas are particularly powerful, allowing concise inline handlers and easy\
    \ access to local context.\n\nConnection Types\n\nThe connect function can take\
    \ an optional fifth argument specifying the Qt::ConnectionType. This primarily\
    \ affects behaviour when the sender and receiver objects live in different threads:\n\
    \n● Qt::AutoConnection (Default): If the sender and receiver are in the same thread,\
    \ it behaves like Qt::DirectConnection. If they are in different threads, it behaves\
    \ like Qt::QueuedConnection. This is usually the best choice unless you have specific\
    \ threading requirements.\n\n● Qt::DirectConnection: The slot is executed immediately\
    \ in the thread that emitted the signal. If the sender and receiver are in different\
    \ threads, the slot runs in the sender's thread. This can be dangerous if the\
    \ slot accesses data local to the receiver's thread without proper locking.\n\n\
    ● Qt::QueuedConnection: The call to the slot is encapsulated in an event and posted\
    \ to the event loop of the receiver's thread. The slot is executed only when the\
    \ receiver's event loop processes that event. Arguments passed via the signal\
    \ are copied. This is the standard way to perform safe cross-thread communication\
    \ using signals and slots.\n\n● Qt::BlockingQueuedConnection: Similar to QueuedConnection,\
    \ but the sending thread blocks until the slot has finished executing in the receiver's\
    \ thread. Use this with extreme caution, as it can easily lead to deadlocks if\
    \ the receiver thread needs to communicate back to the sender thread."
