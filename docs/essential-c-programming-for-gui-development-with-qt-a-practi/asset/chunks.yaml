    );\n```\n\n3. **Issue Request**: Call the appropriate method on the `QNetworkAccessManager`\
    \ instance, passing the `QNetworkRequest`. Common methods include `get()`, `post()`,\
    \ `put()`, `deleteResource()`. These methods immediately return a pointer to a\
    \ `QNetworkReply` object.\n```cpp\n#include <QNetworkReply>\n\nQNetworkReply *reply\
    \ = networkManager_->get(request);\n// Do NOT block here waiting for the reply!\n\
    ```\n"
