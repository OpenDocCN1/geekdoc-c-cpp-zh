  trans: "\n\n## QSS 属性概述\n\n- **颜色与背景**: `color`（文本/前景颜色）、`background-color`、`alternate-background-color`（用于项视图）、`background-image`、`border-image`。\n\
    - **盒模型**: `border`（简写）、`border-width`、`border-style`（实线、虚线等）、`border-color`、`border-radius`（用于圆角）、`padding`（内边距）、`margin`（边框外空间）。\n\
    - **字体**: `font`（简写）、`font-family`、`font-size`、`font-weight`（普通、粗体）、`font-style`（正体、斜体）。\n\
    - **尺寸与位置（有限）**: `min-width`、`min-height`、`max-width`、`max-height`（影响尺寸提示）、`position`（较少，通常依赖布局）。\n\
    - **特定部件属性**: 针对特定部件的属性（例如用于项视图的 `selection-background-color`，`QTableView` 的 `gridline-color`）。\n\
    \n请参阅 Qt 文档（“Qt Style Sheets Reference”）获取部件、子控件及支持属性的完整列表。\n\n## 应用样式表\n\n有几种方法可以应用\
    \ QSS 规则：\n\n### 1. 针对单个部件\n直接应用于特定的部件实例及其子部件。适用于一次性自定义。\n\n```cpp\nQPushButton\
    \ *myButton = new QPushButton(\"Special\");\nmyButton->setObjectName(\"specialButton\"\
    ); // 如果需要进行特定样式化，此是良好的做法\nmyButton->setStyleSheet(\"QPushButton#specialButton\
    \ { background-color: orange; font-weight: bold; }\");\n```\n\n### 2. 全局应用\n为整个应用程序设置样式表。这是应用一致主题的标准方法。通常在\
    \ `main.cpp` 中完成一次。\n\n```cpp\n// 在 main.cpp 中\n\n#include <QApplication>\n#include\
    \ <QFile>\n#include <QTextStream>\n#include \"mainwindow.h\" // 你的主窗口头文件\n\nint\
    \  main(int argc, char *argv[]) {\n    QApplication app(argc, argv);\n    // 示例：应用全局样式\n\
    \    // (通常从文件加载更好)\n    app.setStyleSheet(\"QPushButton { border-radius: 3px;\
    \ padding: 5px; }\"\n                     \"QLineEdit { border: 1px solid #aaaaaa;\
    \ padding: 3px; }\");\n    MainWindow w;\n    w.show();\n    return app.exec();\n\
    }\n```\n\n### 3. 从文件加载（推荐）\n对于任何非简单的样式设置，将你的 QSS 规则保留在单独的文件（例如 `style.qss` 或 `style.css`）中。在应用程序启动时加载它。这保持了代码整洁并使主题易于编辑。\n\
    \n```cpp\n// 在 main.cpp 或主题加载函数中\nQFile styleFile(\":/styles/style.qss\"); //\
    \ 从 Qt 资源系统加载\n// 或 QFile styleFile(\"path/to/style.qss\");\n\nif (styleFile.open(QFile::ReadOnly\
    \ | QFile::Text)) {\n    QTextStream stream(&styleFile);\n    qApp->setStyleSheet(stream.readAll());\
    \ // qApp 是指向 QApplication 的全局指针\n    styleFile.close();\n} else {\n    qWarning()\
    \ << \"无法加载样式表:\" << styleFile.errorString();\n}\n```\n\n## 级联与优先级\n\n与 CSS 类似，QSS\
    \ 规则具有级联性。如果多个规则匹配一个部件，Qt 将使用优先级来决定哪一个生效：\n\n- 直接设置在部件上的样式（`widget->setStyleSheet`）优先级最高。\n\
    - 对象名称选择器（`#objectName`）比类型选择器（`QPushButton`）优先级更高。\n- 选择器包含更多组件的规则（例如 `QFrame\
    \ QPushButton:hover`）比简单的规则（`QPushButton`）优先级更高。\n- 如果优先级相同，则样式表中后出现的规则具有优先权。某些属性（如字体和颜色）会被子部件继承，除非被覆盖。其他属性（如\
    \ `background-color` 或 `border`）通常不会继承。\n\n## 局限性与注意事项\n\n- **CSS 的子集**: QSS 实现了\
    \ CSS2 的许多功能和 CSS3 的部分，但它并不是完整的浏览器 CSS 引擎。请始终检查 Qt 文档以获取特定部件支持的选择器和属性。\n- **性能**:\
    \ 虽然通常效率很高，但全局应用带有深层后代选择器的极其复杂的样式表可能会产生轻微的性能影响，特别是在部件创建或状态更改期间。如果性能至关重要，请进行测试。\n\
    - **覆盖原生样式**: QSS 赋予了你控制权，这意味着你的应用程序在某些平台上看起来可能不够“原生”。要实现自定义与原生外观的完美融合，有时需要仔细的样式设置或使用平台特定的代码。\n\
    \nQt 样式表提供了一种极其灵活且强大的方式来定制 QtWidgets 应用程序的视觉外观，超越了默认的平台外观。通过掌握选择器（目标类型、对象名称、状态和子控件）和属性（控制颜色、边界、字体等）的类\
    \ CSS 语法，你可以创建独特、具有品牌感且在视觉上吸引人的用户界面。在整个应用程序应用样式（通常通过从外部文件加载规则）可以实现一致的主题和更易于维护。QSS\
    \ 是完善应用程序并使其具有视觉吸引力的关键工具。\n\n## 管理应用程序资源 (.qrc 文件)\n\n除了代码和视觉样式外，现实世界的应用程序通常依赖于外部资源——按钮和操作的图标、用于品牌或显示的图像、自定义字体文件、翻译文件，甚至是我们刚刚讨论的\
    \ Qt 样式表文件。此外，为了触及全球观众，特别是在欧洲等不同地区，从一开始就考虑到翻译来设计应用程序至关重要。Qt 为这两个挑战都提供了集成解决方案。\n\
    \n### Qt 资源系统 (.qrc 文件)\n\n除了代码和视觉样式外，现实世界的应用程序通常依赖于外部资源——按钮和操作的图标、用于品牌或显示的图像、自定义字体文件、翻译文件，甚至是我们刚刚讨论的\
    \ Qt 样式表文件。此外，为了触及全球观众，特别是在欧洲等不同地区，从一开始就考虑到翻译来设计应用程序至关重要。Qt 为这两个挑战都提供了集成解决方案。\n\
    \n#### Qt 资源系统 (.qrc 文件): 嵌入资源\n\n分发应用程序时，带上图像、图标或样式表可能会出现问题。文件可能会被意外删除、移动或放在错误的路径，导致图标或样式丢失。资源系统通过允许将这些资源编译到应用程序中（或库中）来解决这个问题。`.qrc`\
    \ 文件是简单的 XML 文件，列出了你想要嵌入的资源，并在代码中使用别名访问它们。\n\n#### 创建并使用 .qrc\n\n1. **创建 .qrc\
    \ 文件**: 你可以在 Qt Creator 中创建（右键点击项目 -> 添加... -> Qt -> 资源文件）。或者，手动创建一个具有如下基本结构的\
    \ XML 文件：\n\n```xml\n<!DOCTYPE RCC>\n<RCC version=\"1.0\">\n<qresource prefix=\"\
    /\">\n<file alias=\"icons/save.png\">../assets/images/diskette_32.png</file>\n\
    <file alias=\"icons/open.png\">../assets/images/folder_open_32.png</file>\n<file>styles/main_theme.qss</file>\n\
    <file>logo.png</file>\n</qresource>\n</RCC>\n```\n\n2. **添加到构建系统**: 确保你的 `.qrc`\
    \ 文件列在项目的构建配置（`CMakeLists.txt` 或 `.pro` 文件）中。这告诉构建系统处理它。\n\n3. **在代码中访问资源**: 使用以冒号\
    \ `:` 开头的路径引用你的嵌入资源，后面跟着前缀（如果没有 `/`）以及别名或文件名。\n\n```cpp\n#include <QIcon>\n#include\
    \ <QPixmap>\n#include <QFile>\n#include <QPushButton>\n#include <QApplication>\
    \ // 用于 qApp->setStyleSheet\n\n// 示例用法：\nQIcon saveIcon(\":/icons/save.png\");\n\
    QPushButton *saveButton = new QPushButton(saveIcon, \"Save\");\n\nQPixmap logo(\"\
    :/images/logo.png\"); // 假设 .qrc 中定义了 prefix=\"/images\"\nQLabel *logoLabel =\
    \ new QLabel();\nlogoLabel->setPixmap(logo);\n\n// 从资源加载 QSS\nQFile styleFile(\"\
    :/styles/main_theme.qss\");\nif (styleFile.open(QFile::ReadOnly | QFile::Text))\
    \ {\n    qApp->setStyleSheet(styleFile.readAll());\n    styleFile.close();\n}\n\
    \n// 从资源加载翻译文件（见 i18n 部分）\n// translator.load(\":/translations/app_de.qm\");\n\
    ```\n\n- `<qresource prefix=\"...\">`: 定义资源系统的虚拟路径前缀。`/` 常用于主资源。\n- `<file alias=\"\
    ...\">real/path/on/disk/file.ext</file>`: 指定磁盘上的文件（`real/path/...`）并在资源系统中赋予别名（`alias=...`）。如果没有别名，则使用磁盘路径的文件名。\n\
    \n"
- fmt: "\n# Build Process Integration\n\nWhen you build your project, the build system\
    \ automatically runs Qt's Resource Compiler (`rcc`). `rcc` reads the `.qrc` file,\
    \ finds the specified assets on disk, compresses them (by default), and generates\
    \ a C++ source file containing the data as byte arrays. This C++ file is then\
    \ compiled and linked into your final executable.\n\n## Benefits\n\n- **Simplified\
    \ Deployment**: Your executable becomes self-contained regarding these assets;\
    \ no need to distribute loose files.\n- **Reliability**: Assets cannot be accidentally\
    \ deleted or moved by the end-user.\n- **Platform Independence**: Resource paths\
    \ work identically across Windows, macOS, and Linux.\n- **Potential Speed**: Accessing\
    \ embedded resources might be slightly faster than disk I/O, especially after\
    \ initial loading.\n\n## Basic Internationalization (i18n) with `tr()`\n\nInternationalization\
    \ (often abbreviated as `i18n` – `'i'` + 18 letters + `'n'`) is the process of\
    \ designing software so that it can be adapted to various languages and regional\
    \ peculiarities without engineering changes. Localization (`L10n`) is the process\
    \ of actually adapting the software for a specific region or language by adding\
    \ locale-specific components and translating text. For applications intended for\
    \ use beyond a single language group (very relevant in a multilingual environment\
    \ like Germany and Europe), designing for translation is essential.\n\nQt provides\
    \ excellent support for `i18n`, and the cornerstone from the developer's perspective\
    \ is the `QObject::tr()` function.\n\n### The Role of `tr()`\n\n`tr()` is used\
    \ to mark user-visible string literals in your source code as translatable.\n\n\
    ```cpp\n// Instead of this:\nlabel->setText(\"User Name:\");\n\nQMessageBox::information(this,\
    \ \"File Saved\", \"Your file has been saved successfully.\");\n\n// Use tr():\n\
    label->setText(tr(\"User Name:\"));\n\nQMessageBox::information(this, tr(\"File\
    \ Saved\"), tr(\"Your file has been saved successfully.\"));\n```\n\n### Why is\
    \ `tr()` Necessary?\n\nCrucially, `tr()` itself does not perform the translation.\
    \ It serves as a marker for Qt's translation toolchain. When you use `tr()`, you\
    \ enable tools like `lupdate` to scan your source code and extract these specific\
    \ string literals into translation files. Strings not wrapped in `tr()` will simply\
    \ be invisible to these tools and cannot be easily translated using the standard\
    \ Qt workflow.\n\n### Context and Disambiguation\n\n`tr()` is a member of `QObject`.\
    \ When called within a method of a class derived from `QObject` (like your `QMainWindow`\
    \ or custom `QWidget` subclasses), the name of the class provides context for\
    \ the string. This helps translators understand where the string is used. For\
    \ example, `tr(\"Ok\")` in `LoginDialog` might need a different translation than\
    \ `tr(\"Ok\")` in `PrinterSettingsDialog`. If the class context isn't enough,\
    \ you can add a comment for the translator:\n\n```cpp\n// Disambiguation comment\
    \ for Qt Linguist\n//: Button text\nokButton->setText(tr(\"Ok\"));\n```\n\nOr\
    \ add a second argument to `tr()` which acts as a disambiguation comment:\n\n\
    ```cpp\nokButton->setText(tr(\"Ok\", \"Confirmation button text\"));\n```\n\n\
    ### The Translation Workflow (Conceptual Overview)\n\nWhile the full details involve\
    \ several steps and tools, here's the basic process enabled by using `tr()`:\n\
    \n1. **Developer**: Writes code, wrapping all user-facing string literals in `tr()`.\n\
    2. **lupdate Tool**: Scans the source code (`.cpp`, `.h`, `.ui` files) and extracts\
    \ `tr()` strings, creating or updating `.ts` (Translation Source) XML files for\
    \ each target language (e.g., `myapp_de.ts`).\n3. **Translator**: Uses the Qt\
    \ Linguist application to open a `.ts` file (e.g., `myapp_de.ts`), sees the source\
    \ strings (like `\"User Name:\"`) along with any context/comments, and enters\
    \ the corresponding translation (e.g., `\"Benutzername:\"`).\n4. **lrelease Tool**:\
    \ Takes the completed `.ts` file(s) and compiles them into compact, binary `.qm`\
    \ (Qt Message) files (e.g., `myapp_de.qm`). These `.qm` files are what your application\
    \ actually uses. They are often embedded using the Qt Resource System.\n5. **Application\
    \ Loading**: At runtime (usually in `main.cpp`), your application creates `QTranslator`\
    \ objects, uses `translator.load()` to load the appropriate `.qm` file (often\
    \ based on `QLocale::system()` to detect the user's language, perhaps loading\
    \ `:/translations/app_de.qm` if the locale is German), and installs the translator(s)\
    \ onto the `QApplication` instance using `app.installTranslator(&translator)`.\n\
    \nOnce a `QTranslator` for the user's language is loaded and installed, subsequent\
    \ calls to `tr(\"Some Text\")` in your code will automatically look up `\"Some\
    \ Text\"` in the loaded `.qm` file and return the translation if found; otherwise,\
    \ it returns the original literal string. Qt also uses this system for its own\
    \ built-in dialog text (`\"OK\"`, `\"Cancel\"`, etc.), which is why loading the\
    \ `qtbase` translations is also common practice.\n\nManaging application assets\
    \ and preparing for translation are vital steps in creating professional, distributable\
    \ software. The Qt Resource System (`.qrc` files) provides a robust way to embed\
    \ resources like icons, images, QSS files, and compiled translation (`.qm`) files\
    \ directly into your executable, simplifying deployment and ensuring assets are\
    \ always available.\n\n# Chapter 6: Introduction to Qt Quick and QML for Modern\
    \ UIs\n\n## QML Syntax Fundamentals: Items, Properties, Basic Types\n\nWhile `QtWidgets`\
    \ provide a mature and powerful way to build classic desktop applications, Qt\
    \ offers a second, more modern UI framework called Qt Quick. Qt Quick excels at\
    \ creating dynamic, visually rich interfaces with smooth animations and transitions,\
    \ making it particularly well-suited for mobile applications, embedded devices,\
    \ and contemporary desktop experiences. Instead of constructing the UI imperatively\
    \ step-by-step in C++, Qt Quick uses a declarative language called QML (Qt Modeling\
    \ Language).\n\n### Basic QML Document Structure\n\nQML code is typically written\
    \ in text files with a `.qml` extension. A basic QML document has a simple structure:\n\
    \n1. **Import Statements**: At the top, you import the QML modules (libraries)\
    \ that provide the building blocks you need. Each import specifies a module and\
    \ usually a version number. The most fundamental module is `QtQuick`.\n```qml\n\
    import QtQuick // Provides basic types like Item, Rectangle\nimport QtQuick.Window\
    \ // Provides the Window type\n```\n2. **Root Element**: Every `.qml` file must\
    \ define exactly one root QML element (also called an object or Item). This element\
    \ acts as the container for everything else defined in that file. Common root\
    \ elements are `Item`, `Rectangle`, or `Window`.\n3. **Comments**: You can use\
    \ single-line (`//`) and multi-line (`/* ... */`) comments, just like in C++.\n\
    \n### Fundamental Concepts: Items and Properties\n\n- **Items**: The basic building\
    \ blocks of a QML interface are Items. Everything you see or interact with (and\
    \ some non-visual elements) is an Item or derives from the base `Item` type. The\
    \ `Item` type itself is a non-visual element often used for grouping other items\
    \ or as a base for custom components. Visual items like `Rectangle`, `Text`, and\
    \ `Image` inherit from `Item`.\n- **Properties**: Items have properties that define\
    \ their attributes, appearance, and behaviour. Examples include `width`, `height`,\
    \ `x`, `y` (position), `visible`, `opacity`, `color`, `text`, etc.\n- **Setting\
    \ Static Values**: You assign values to properties using a colon (`:`) followed\
    \ by the value. The value can be a literal number, a boolean (`true/false`), a\
    \ string (enclosed in double quotes \" \"), a color (as a string like `\"blue\"\
