    现在，使用相同的绿色运行按钮（或 `Ctrl+R`/`Cmd+R`）运行此项目。构建完成后，将会出现一个新窗口。此时，它将显示居中显示的“Hello QML
    World!”文本，其标题栏也会反映这一点。请注意，该窗口的外观可能与原生 QtWidgets 略有不同，这反映了 QML 独特的渲染流水线。完成后请关闭窗口。


    # 初印象


    你现在已成功使用 Qt 的两种主要 UI 技术构建并运行了最小化应用程序。你看到了 Qt Creator 生成的略有不同的项目结构，以及在定义 UI 方面的根本区别：QtWidgets
    采用更具命令式/设计器驱动的方法，而 QML 则采用声明式的基于文本的方法。两者都生成了运行的图形化应用程序，确认了你的环境已准备好胜任一种路径。


    构建这些简单的“Hello World”应用程序是一个至关重要的仪式。它验证了复杂的工具链——Qt Creator、`CMake`、C++ 编译器、链接器以及
    Qt 6 库——都已为 QtWidgets 和 Qt Quick 开发正确地安装并配置完成。你已经熟悉了 Qt Creator 中的基本工作流：从模板创建项目、进行微小的代码修改并执行应用程序。在坚实这一基础的基础上，我们现在可以继续理解在开发过程中将持续使用的基本
    C++ 特性和 Qt 核心概念。


    # 理解 Qt 的构建系统


    当你编写 C++ 代码时，特别是对于涉及 Qt 等框架的大型项目，从源文件（`.cpp`, `.h`, `.ui`, `.qml`, `.qrc`）到可运行应用程序涉及多个步骤。C++
    编译器需要处理每个源文件，Qt 特有的工具需要处理 UI 定义和元对象信息等内容，最后链接器必须将所有内容合并为可执行文件。管理这一过程——跟踪文件之间的依赖关系、使用正确的选项调用正确的工具、处理操作系统和编译器之间的差异——是构建系统的工作。构建系统自动化了这些复杂任务，确保你的应用程序被正确且一致地构建。


    Qt 在历史上提供过自己的专有构建工具 `qmake`，而现代 Qt 开发（特别是从 Qt 6 开始）很大程度上倾向于行业标准 `CMake`。了解两者的基础都是有帮助的，尽管我们接后的重点将完全放在
    `CMake` 上。


    ## qmake: 经典的 Qt 构建系统


    多年来，`qmake` 一一直是 Qt 项目的标准构建系统。它专门为 Qt 设计，使得简单的 Qt 应用程序非常容易配置。它使用带有 `.pro` 扩展的项目文件。这些文件包含了定义项目特性和涉及文件的变量。


    让我们考虑一个简单的 Qt Widgets 应用程序的假设最小 `.pro` 文件：


    ```makefile

    TEMPLATE = app

    TARGET = HelloWorldWidgets

    QT += core gui widgets

    SOURCES += \

    main.cpp \

    mainwindow.cpp

    HEADERS += \

    mainwindow.h

    FORMS += \

    mainwindow.ui

    ```


    以下是这些常用 `qmake` 变量的说明：


    - `TEMPLATE = app`: 指定我们正在构建一个可执行应用程序（`lib` 用于构建库）。

    - `TARGET = HelloWorldWidgets`: 定义输出可执行文件的名称。

    - `QT += core gui widgets`: 这对于 `qmake` 来说至关重要。它告诉 `qmake` 项目依赖于 Qt 的 `core`、`gui`
    和 `widgets` 模块。`qmake` 使用这些信息自动添加这些模块所需的包含路径、链接标志和依赖项。`+=` 语法意味着“添加到列表”。

    - `SOURCES += ...`: 列出要编译的 C++ 源文件（`.cpp`）。

    - `HEADERS += ...`: 列出 C++ 头文件（`.h`）。虽然编译本身并不严格需要，但列出它们有助于 `qmake` 跟踪依赖关系并辅助 Qt
    Creator 这样的 IDE。

    - `FORMS += ...`: 列出 Qt Designer UI 文件（`.ui`）。`qmake` 知道它需要对这些文件运行用户界面编译器（`uic`）以生成
    C++ 代码。


    `qmake` 处理此 `.pro` 文件并生成特定平台的构建指令，通常在 Linux 和 macOS 上以 Makefile 的形式存在，或者在 Windows
    上可能是针对 Visual Studio 等 IDE 的项目文件。然后 `make` 工具（或 IDE 的构建系统）读取这些指令来编译和链接应用程序。`qmake`
    还包含了简单的条件逻辑（例如 `win32 { SOURCES += ... }`）来处理平台差异。


    虽然 `qmake` 对于基础的纯 Qt 项目来说非常直观，且你无疑会在旧示例示例或现有代码库中遇到它，但在处理复杂依赖关系（尤其是非 Qt 库）或旨在集成到更广泛的
    C++ 生态系统中时，它会变得不那么方便。对于 Qt 6 的新项目，`qmake` 通常被认为是旧留的。


    ## CMake: Qt 6 的现代标准


    `CMake` 是一个强大的、开源的跨平台构建系统生成器。与 `qmake` 不同，它不是特定于 Qt 的，但在 C++ 社区被广泛应用于各种规模的项目。考虑到
    `CMake` 在处理复杂构建、管理依赖关系以及与各种工具和 IDE 集成方面的优势，Qt 公司将 `CMake` 指定为 Qt 6 主要且官方支持的构建系统。


    `CMake` 使用名为 `CMakeLists.txt` 的配置文件。让我们看看我们的简单的 Widgets 应用程序是如何被描述的：


    ```cmake

    cmake_minimum_required(VERSION 3.16) # 指定最小 CMake 版本

    project(HelloWorldWidgets VERSION 1.0 LANGUAGES CXX) # 定义项目名称、版本、语言

    set(CMAKE_CXX_STANDARD 17) # 要求 C++17 标准

    set(CMAKE_CXX_STANDARD_REQUIRED ON)

    set(CMAKE_AUTOMOC ON)      # 启用自动 moc

    set(CMAKE_AUTORCC ON)      # 启用自动 rcc


    # 查找 Qt 6 安装并所需的组件

    find_package(Qt6 REQUIRED COMPONENTS Core Widgets)


    # 定义可执行文件目标及其源文件

    add_executable(HelloWorldWidgets

    main.cpp

    mainwindow.cpp

    mainwindow.h

    mainwindow.ui

    )


    # 将可执行文件链接到所需的模块

    target_link_libraries(HelloWorldWidgets PRIVATE

    Qt6::Core

    Qt6::Gui

    Qt6::Widgets

    )

    ```


    这里演示的关键 CMake 命令和概念：


    - `cmake_minimum_required()`：设置处理此文件的最小 `CMake` 版本。

    - `project()`：命名项目。

    - `set(CMAKE_CXX_STANDARD ...)`：指定所需 C++ 标准的标准 CMake 方法。

    - `set(CMAKE_AUTOMOC ON)`, `set(CMAKE_AUTORCC ON)`, `set(CMAKE_AUTOUIC ON)`：这些是
    Qt CMake 集成提供的关键布尔变量。将它们设置为 `ON` 会 CMake 自动检测并调用 Qt 的元对象编译器 (moc)、资源编译器 (rcc)
    和用户界面编译器 (uic)。

    - `find_package(Qt6 REQUIRED COMPONENTS ...)`：此命令指示 CMake 查找已安装的 Qt 6 包，并确保指定的
    `COMPONENTS`（组件）可用。

    - `add_executable(...)`：定义一个可执行目标（此处名为 `HelloWorldWidgets`）并列出构建它所需的源文件。

    - `target_link_libraries(...)`：将指定的目标链接到所需的库。Qt 的 CMake 集成提供了导入目标，如 `Qt6::Core`、`Qt6::Gui`
    等，它们封装了该模块所需的所有包含路径和链接标志。`PRIVATE` 表示这些是构建目标本身所需的依赖项。


