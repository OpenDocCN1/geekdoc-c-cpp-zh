    \ Qt 视图及委托之间的约定。\n\n### 核心只读接口\n\n即使对于一个只显示数据的模型（只读），你至少也必须实现继承自 `QAbstractItemModel`\
    \ 的以下纯虚函数：\n\n1. `rowCount(const QModelIndex &parent = QModelIndex()) const override`:\n\
    \   - **目的**：返回父模型索引指定的条项下可用的行数。\n   - **实现**：如果 `parent` 无效（`!parent.isValid()`），则它指向模型的顶层；返回顶层行的数量。对于列表/表格模型，如果\
    \ `parent` 有效，你通常返回 0（因为它们在项目项目下没有嵌套行）。对于树模型，你返回由 `parent` 标识的项目的直接子节点数量。你需要根据\
    \ `parent` 索引访问你的后端数据以确定子计数。\n\n2. `columnCount(const QModelIndex &parent = QModelIndex())\
    \ const override`:\n   - **目的**：返回父模型索引指定的条项下可用的列数。\n   - **实现**：对于列表模型，这始终返回\
    \ 1。对于表格模型，它通常返回一个代表表格列的固定数量，无论 `parent` 如何。对于树模型，如果子项目具有不同的列结构，它可能取决于 `parent`\
    \ 项目，但通常对于同一层级的所有项目来说是常数。\n\n3. `data(const QModelIndex &index, int role = Qt::DisplayRole)\
    \ const override`:\n   - **目的**：这是模型的核心——它检索用于显示或其他目的的实际数据。视图和委托频繁调用它。\n   - **实现**：检查提供的\
    \ `index` 是否有效（`index.isValid()`）。如果无效，返回空 `QVariant()`。从 `index` 获取行和列（`index.row()`、`index.column()`），并结合请求的\
    \ `role`（`Qt::DisplayRole`、`Qt::DecorationRole`、`Qt::ToolTipRole`、自定义角色等），使用 switch\
    \ 语句在后端数据结构中定位相应项并返回该角色的数据。如果不支持该角色，返回 `QVariant()`。这里的效率是关键。\n\n4. `index(int\
    \ row, int column, const QModelIndex &parent = QModelIndex()) const override`:\n\
    \   - **目的**：创建一个 `QModelIndex` 对象，视图和委托使用它来引用位于相对于 `parent` 索引的特定子项。\n   - **实现**：该函数桥接了视图使用的行/列/父坐标与你的内部数据表示之间的差距。在此函数内部，你确定哪个内部数据对应请求的行、列。然后使用保护的\
    \ `createIndex(row, column, internalData)` 函数（由 `AbstractItemModel` 提供）。关键部分是\
    \ `internalData`，它可以是：\n     - `quintptr`（例如存储数据结构中的索引或 ID）。以后通过 `index.internalId()`\
