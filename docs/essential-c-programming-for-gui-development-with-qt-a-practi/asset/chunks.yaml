    ● void keyPressEvent(QKeyEvent *event): Called when a key is pressed while the
    widget has keyboard focus. The event object provides the key code (event->key(),
    e.g., Qt::Key_Enter, Qt::Key_A) and modifier status (event->modifiers()).


    C++


    // In MyWidget.cpp


    #include <QKeyEvent>


    #include <QDebug>


    void  MyWidget::keyPressEvent(QKeyEvent *event) {


    if (event->key() == Qt::Key_Space) {


    qDebug() << "Space bar pressed!";


    // Perform action...


    } else  if (event->key() == Qt::Key_Escape) {


    qDebug() << "Escape pressed, closing widget maybe?";


    close(); // Example action


    } else {


    QWidget::keyPressEvent(event); // Pass unhandled keys to base


    }


    }


    ● void paintEvent(QPaintEvent *event): This is fundamental for custom drawing.
    It''s called whenever Qt determines a widget (or part of it) needs to be redrawn.
    Inside this handler, you typically create a QPainter object for the widget and
    use its methods to draw shapes, text, images, etc. We will cover QPainter in detail
    later. It''s crucial not to call drawing functions outside paintEvent directly.
    If you need to trigger a repaint, call update() or repaint().


    ● void closeEvent(QCloseEvent *event): Called when the user attempts to close
    a top-level window (e.g., by clicking the ''X'' button). You can reimplement this
    to intercept the close request, perhaps to prompt the user to save changes. You
    control whether the window actually closes using event->accept() (allow closing)
    or event->ignore() (prevent closing).


    C++


    // In MyMainWindow.cpp


    #include <QCloseEvent>


    #include <QMessageBox>


    void  MyMainWindow::closeEvent(QCloseEvent *event) {


    if (isModified()) { // Assume isModified() checks for unsaved changes


    QMessageBox::StandardButton res;


    res = QMessageBox::warning(this, "Unsaved Changes",


    "Do you want to save your changes?",


    QMessageBox::Save | QMessageBox::Discard | QMessageBox::Cancel);


    if (res == QMessageBox::Save) {


    saveChanges(); // Call function to save


    event->accept(); // Allow closing


    } else  if (res == QMessageBox::Discard) {


    event->accept(); // Allow closing


    } else { // Cancel


    event->ignore(); // Prevent closing


    }


    } else {


    event->accept(); // No changes, allow closing


    }


    }


    ● void resizeEvent(QResizeEvent *event): Called after the widget has been resized.
    The event contains the oldSize() and newSize(). Useful for performing custom layout
    adjustments that go beyond Qt''s standard layout managers.


    Important: When you reimplement an event handler, you must decide whether to also
    call the base class''s implementation (e.g., QWidget::keyPressEvent(event)). Calling
    the base implementation ensures that any default behavior or further propagation
    logic is executed. You typically call it if you haven''t fully handled the event
    or if you want to augment, rather than completely replace, the base behavior.


    Event Propagation: accept() and ignore()


    For many event types, especially input events on widgets, Qt employs a propagation
    mechanism. If a widget doesn''t handle an event, Qt may offer the event to its
    parent widget, and so on up the hierarchy. You control this using methods on the
    QEvent object:


    ● event->accept(): Call this within your event handler if you have successfully
    processed the event. This generally prevents the event from propagating further.
    Many event handlers implicitly accept the event if they don''t explicitly ignore
    it.


    ● event->ignore(): Call this if your widget does not handle the event. This signals
    to Qt that it should continue trying to deliver the event, typically by propagating
    it to the parent widget. The closeEvent example demonstrates using ignore() to
    cancel the close operation.


    Event Filters: Intercepting Events


    Besides reimplementing event handlers directly in the class receiving the event,
    Qt provides another powerful mechanism: event filters. An event filter allows
    one QObject (the filter object) to monitor and potentially intercept events destined
    for another QObject (the watched object).


    1.  Install Filter: Call watchedObject->installEventFilter(filterObject);.


    2.  Reimplement eventFilter: In the filterObject''s class, reimplement the virtual
    function bool eventFilter(QObject *watched, QEvent *event).


    3.  Logic: Inside eventFilter, check if the watched object and event type are
    the ones you want to intercept. If you handle the event completely, perform your
    actions and return true. Returning true prevents the event from being delivered
    further (including to the watched object''s own event() function or specific handlers).
    If you don''t handle the event, or only want to monitor it, return false (or better,
    call the base class implementation: return QObject::eventFilter(watched, event);)
    to allow normal processing to continue.


    Event filters are useful for implementing centralized event handling logic, modifying
    the behavior of existing widgets without subclassing them, or for debugging event
    flow. However, they can sometimes make the control flow less obvious than direct
    handler reimplementation.


    Qt''s event system, orchestrated by the event loop, is the foundation for user
    interaction and responsiveness. Events represent low-level occurrences, delivered
    to QObjects via their event() function, which typically dispatches to specific
    virtual handlers like mousePressEvent, keyPressEvent, or paintEvent. Reimplementing
    these handlers is the primary object-oriented way to define custom event responses.
    Understanding event propagation (accept()/ignore()) and the alternative mechanism
    of event filters allows for fine-grained control over event processing. While
    events are low-level, they often trigger the higher-level signal and slot mechanism,
    forming a complete picture of communication and reaction within a Qt application.


    # Chapter 4:


    # Building Interfaces with QtWidgets


    * * *


    Essential Layout Management: Arranging Widgets Effectively


    * * *


    When first approaching GUI development, it might seem intuitive to place widgets
    on a window by specifying exact pixel coordinates and fixed sizes (using functions
    like setGeometry, move, or resize). However, this approach quickly proves problematic
    and should generally be avoided for anything beyond the simplest, fixed-size dialogs.
    Why?


    Consider what happens when:


    ● The window is resized: Widgets at fixed positions won''t rearrange themselves,
    leading to overlapping elements or excessive empty space.


    ● Text length changes: If your application is translated into a language with
    longer words (like German, relevant here in Germany!), fixed-size labels or buttons
    might truncate the text. Similarly, user-adjustable font sizes can break fixed
    layouts.


    ● Different screen resolutions or DPI settings are used: A layout that looks good
    on one screen might appear cramped or overly spacious on another.


    ● Platform look-and-feel varies: Different operating systems have different standard
    spacings and appearances for widgets. Fixed positioning ignores these conventions.


    To address these challenges and create professional, adaptive user interfaces,
    Qt provides a powerful system of layout managers. These are objects that automatically
    control the size and position of the widgets within a container (like a QWidget
    or QMainWindow), ensuring they arrange themselves logically according to predefined
    rules.


    Layout Management Fundamentals


    The core idea is simple: instead of telling each widget exactly where to go and
    how big to be, you group related widgets together and assign them to a layout
    manager. You then tell the layout manager how you want those widgets arranged
    (e.g., in a row, in a column, in a grid). The layout manager takes responsibility
    for calculating the appropriate geometry for each widget it controls.


