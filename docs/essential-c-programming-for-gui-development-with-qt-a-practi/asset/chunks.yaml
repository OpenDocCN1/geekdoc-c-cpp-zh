  trans: "\n\n许多基础的视觉 QML 项目如 `Rectangle`、`Image` 或 `Text` 本身并不直接处理鼠标或触摸输入。要让视觉项目具有交互性，你通常会在内部嵌入一个非视觉的\
    \ `MouseArea` 项目。`MouseArea` 会检测发生在其边界内的鼠标和触摸事件，并提供允许你处理的信号。`MouseArea` 通常会将触摸事件视为鼠标事件（例如，轻点类似于点击），从而简化了当今常见的跨设备输入处理。\n\
    \n## 核心概念\n\n1. **嵌入 (Embedding)**：将 `MouseArea` 放置在你想要变为交互式的视觉项目内部。通常，你会使用 `anchors.fill:\
    \ parent` 来让 `MouseArea` 完全覆盖其父元素。\n2. **信号处理器 (Signal Handlers)**：QML 提供了一种方便的语法，用于在项目的定义中直接处理信号：`onSignalName:\
    \ { /* JavaScript 代码 */ }`。当信号发射时，将执行 JavaScript 代码块。\n3. **常用 MouseArea 处理器**：\n\
    \   - `onClicked: { ... }`: 当主鼠标按钮（通常是左键）在 `MouseArea` 内部按下并释放时，或者区域被轻点时触发。参数\
    \ `mouse` 提供了位置（`mouse.x`、`mouse.y`）和按钮（`mouse.button`）等细节。\n   - `onPressed:\
    \ { ... }`: 鼠标按钮按下时立即触发。\n   - `onReleased: { ... }`: 鼠标按钮释放时触发。\n   - `onPositionChanged:\
    \ { ... }`: 当按住按钮时，鼠标光标（或触摸点）移动时触发。\n   - `onEntered: { ... }`: 当鼠标光标进入 `MouseArea`\
    \ 边界时触发。需要 `hoverEnabled` 设置为 `true`。\n   - `onExited: { ... }`: 当鼠标光标离开 `MouseArea`\
    \ 边界时触发。需要 `hoverEnabled` 设置为 `true`。\n4. **hoverEnabled 属性**：默认情况下，`MouseArea`\
    \ 在没有按下按钮时不会跟踪鼠标移动。要启用悬停效果（使用 `onEntered`/`onExited` 信号，或者在使用 QSS 效样式时使用选择器中的\
    \ `:hover` 伪状态），必须设置 `hoverEnabled: true`。这会有轻微的性能开销，因此仅在需要时启用。\n\n## 示例：让我们让\
    \ `Rectangle` 在点击时改变颜色并报告悬停状态。\n\n```qml\nimport QtQuick\nimport QtQuick.Window\n\
    \nWindow {\n  width: 300; height: 200\n  visible: true\n  title: \"MouseArea Example\"\
    \n\n  Rectangle {\n    id: clickableRect\n    width: 150; height: 100\n    anchors.centerIn:\
    \ parent\n    color: \"lightblue\"\n    border.color: \"steelblue\"\n    border.width:\
    \ 2\n\n    Text {\n      id: statusText\n      anchors.bottom: parent.bottom;\
    \ anchors.horizontalCenter: parent.horizontalCenter\n      anchors.bottomMargin:\
    \ 5\n      text: \"Hover or Click Me\"\n    }\n\n    MouseArea {\n      id: mouseArea\n\
    \      anchors.fill: parent  // 让 MouseArea 覆盖 Rectangle\n      hoverEnabled:\
    \ true  // 启用悬停检测\n      onClicked: {\n        console.log(\"Rectangle clicked\
    \ at:\", mouse.x, \",\", mouse.y);\n        // 直接更改父元素的颜色（命令式样式）\n        parent.color\
    \ = (parent.color == \"lightgreen\") ? \"lightblue\" : \"lightgreen\";\n     \
    \ }\n      onEntered: {\n        console.log(\"Mouse entered\");\n        parent.border.color\
    \ = \"red\"; // 悬停时改变边界颜色\n        statusText.text = \"Mouse is inside\";\n  \
    \    }\n      onExited: {\n        console.log(\"Mouse exited\");\n        parent.border.color\
    \ = \"steelblue\"; // 恢复边界颜色\n        statusText.text = \"Hover or Click Me\"\
    ;\n      }\n    }\n  }\n}\n```\n\n运行此代码。点击矩形会切换其背景颜色，鼠标移入移出会改变边界颜色和文本标签。`console.log`\
    \ 消息将出现在 Qt Creator 的应用程序输出面板中。\n\n（注：虽然 `MouseArea` 是基础性的，但新的应用程序可能会使用 `QtQuick.InputHandlers`\
    \ 中的处理器，如 `TapHandler`、`DragHandler`、`HoverHandler` 来处理更复杂或特定的输入场景，但 `MouseArea`\
    \ 已经很好地涵盖了基础功能。）\n\n## QML 状态简介：声明式视觉变化\n\n在上面的示例中，我们在 JavaScript 信号处理器内部命令式地更改了矩形的颜色和\
    \ `border.color`。虽然这对于简单情况有效，但在不同交互之间管理许多属性变化可能会变得复杂。QML 状态（States）提供了一种更结构化、声明式的方法来管理项目不同的视觉外观或配置。\n\
    \n**概念**：你为项目定义了命名的状态。每个状态指定了当该状态激活时，某些属性应该具有的值。你只需只需更改项目的 `state` 属性，QML 就会自动应用相应的属性值。\n\
    \n### 声明状态\n\n1. **states 属性**：向想要管理外观的项目添加一个 `states` 列表属性。\n2. **State 对象**：在\
    \ `states` 列表内部定义 `State` 对象。每个 `State` 必须有一个唯一的 `name` 属性（字符串）。默认状态隐式命名为 `\"\"\
    `。\n3. **PropertyChanges 对象**：在每个 `State` 内部，使用一个或多个 `PropertyChanges` 对象。一个 `PropertyChanges`\
    \ 对象指定：\n   - `target`: 在此状态下属性应该改变的项目的 `id`。\n   - **属性赋值**：一个属性值对的列表，定义了该状态的值。\n\
    \n### 切换状态\n\n项目的当前状态由其 `state` 属性决定。你通过程序化地响应事件来更改状态，通过将状态名称赋值给该属性：`newState`。要返回默认外观，将状态设置为空字符串：``。\n\
    \n## 结合 MouseArea 与状态\n\n让我们修改之前的示例，使用状态来处理悬停效果。\n\n```qml\nimport QtQuick\nimport\
    \ QtQuick.Window\n\nWindow {\n  width: 300; height: 200\n  visible: true\n  title:\
    \ \"QML States Example\"\n\n  Rectangle {\n    id: interactiveRect\n    width:\
    \ 150; height: 100\n    anchors.centerIn: parent\n    // 默认外观 (state = \"\")\n\
    \    color: \"lightblue\"\n    border.color: \"steelblue\"\n    border.width:\
    \ 2\n\n    Text {\n      id: statusText\n      // ...（与之前相同） ...\n      text:\
    \ \"Hover Me\"\n    }\n\n    MouseArea {\n      id: mouseArea\n      anchors.fill:\
    \ parent\n      hoverEnabled: true\n      onClicked: {\n        // 目前仍然是命令式的，也可以改为状态切换\n\
    \        parent.color = (parent.color == \"lightgreen\") ? \"lightblue\" : \"\
    lightgreen\";\n      }\n      // 根据悬停更改状态\n      onEntered: { parent.state = \"\
    hovered\" }\n      onExited: { parent.state = \"\" } // 返回默认状态\n    }\n\n    //\
    \ 为 interactiveRect 定义状态\n    states: [\n      State {\n        name: \"hovered\"\
    \ // 状态名称\n        PropertyChanges {\n          target: interactiveRect // 改变项目的属性\n\
    \          border.color: \"red\" // 该状态下的属性值\n        }\n        PropertyChanges\
    \ { // 也可以目标其他项目\n          target: statusText\n          text: \"Mouse is Hovering!\"\
    \n        }\n      }\n      // 可以定义其他状态，如 \"pressed\", \"disabled\" 等\n    ]\n\
    \  }\n}\n```\n\n现在，当鼠标进入 `MouseArea` 时，它将 `interactiveRect` 的状态设置为 `\"hovered\"\
    `。QML 自动找到名为 `\"hovered\"` 的 `State` 并应用其中定义的 `PropertyChanges`：`interactiveRect`\
    \ 的边界颜色变为红色，`statusText` 的文本也发生变化。当鼠标离开时，将状态设回 `\"\"` 将属性恢复到直接定义在项目上的默认值。\n\n\
    ### 状态的优势\n\n- **声明式**：定义 UI 在不同状态下的样子，而不是逐步如何更改它。\n- **结构更清晰**：将特定模式下相关的属性变化组合在一起。\n\
    - **动画/过渡**：QML `Transition` 元素（稍后介绍）可用于定义在状态更改时自动运行的平滑动画，使状态转换具有视觉吸引力。\n\n"
- fmt: "\nMaking QML interfaces interactive involves capturing user input, typically\
    \ using `MouseArea` for mouse and basic touch events, and responding within signal\
    \ handlers like `onClicked` or `onEntered`. While simple property changes can\
    \ be done imperatively within these handlers, `QML States` provide a powerful,\
    \ declarative approach for defining distinct visual configurations. By defining\
    \ `State` objects with `PropertyChanges` and modifying an item's `state` property\
    \ in response to events, you create well-structured and maintainable interactive\
    \ components, paving the way for more complex behaviors and smooth visual transitions.\n\
    \n# Chapter 7: Dynamic UIs and C++ Integration\n\n## Building Reusable UI Elements\
    \ with Custom QML Components\n\nImagine designing an application interface. You\
    \ might need several buttons with a specific custom appearance (rounded corners,\
    \ specific hover effects, an icon alongside text), or perhaps multiple instances\
    \ of an input field paired with a validation status icon. Defining the QML structure\
    \ and logic for such elements repeatedly throughout your UI code leads to duplication,\
    \ makes maintenance difficult (a change needs to be applied everywhere), and clutters\
    \ your main QML files.\n\nThe solution is to encapsulate these recurring UI patterns\
    \ into custom QML components. A custom component is essentially a self-contained\
    \ QML element, defined in its own `.qml` file, which can then be instantiated\
    \ and reused just like standard QML types (`Rectangle`, `Text`, etc.). This promotes\
    \ modularity, reusability, and maintainability – core principles of good software\
    \ design.\n\n### Creating a Basic QML Component\n\nThe fundamental idea is simple:\
    \ any `.qml` file can act as a custom component.\n\n1. **Create a .qml File**:\
    \ Create a new text file with a `.qml` extension (e.g., `MyCustomButton.qml`).\n\
    2. **Define Root Item**: Inside this file, define a single root QML `Item` (e.g.,\
    \ `Item`, `Rectangle`, `FocusScope`) which serves as the base or container for\
    \ your component. This root item, along with any child items defined within it,\
    \ constitutes the component's internal structure.\n3. **Filename is Type Name**:\
    \ The filename (with the first letter capitalized and without the `.qml` extension)\
    \ becomes the QML type name you use to instantiate the component elsewhere. So,\
    \ `MyCustomButton.qml` defines the `MyCustomButton` type.\n\n#### Directory Structure\
    \ and Imports\n\nBy default, QML files within the same directory can usually instantiate\
    \ each other using their type names directly. For better organization, you'll\
    \ often place custom components in subdirectories (e.g., a `components` folder).\
    \ To use components from a subdirectory, you need to import that directory in\
    \ the QML file where you want to use them:\n\n```qml\nimport QtQuick\nimport \"\
    ./components\"  // Import components from the 'components' subdirectory\n\n//\
    \ ... later ...\n\nMyCustomButton {\n    // ... properties ...\n}\n```\n\n(More\
    \ advanced module definition mechanisms exist for larger projects or libraries).\n\
    \n### Defining the Component's Public Interface\n\nA key aspect of components\
    \ is encapsulation: hiding internal complexity and exposing a clean, well-defined\
    \ interface for external use. This interface consists of custom properties, signals,\
    \ and methods.\n\n* **Custom Properties**: Allow users of your component to configure\
    \ its appearance or behavior. There are two main ways to define them at the root\
    \ level of your component's `.qml` file:\n    * `property <type> propertyName:\
    \ <defaultValue>`: Defines a completely new property specific to your component.\
    \ Internal elements can then bind to this property.\n    ```qml\n    // Inside\
    \ MyCustomButton.qml, at the root level\n    property color buttonColor: \"lightgray\"\
    \  // New property with a default\n    property int cornerRadius: 4\n    // Internal\
    \ Rectangle might bind: color: buttonColor; radius: cornerRadius\n    ```\n  \
    \  * `property alias aliasName: internalItemId.propertyName`: Exposes an existing\
    \ property of an internal child item directly under a new name (`aliasName`) on\
    \ the component. This is useful for providing direct access to common properties\
    \ like text or source URLs.\n    ```qml\n    // Inside MyCustomButton.qml, assuming\
    \ internal Text item has id: buttonLabel\n    property alias text: buttonLabel.text\
    \ // Expose internal Text item's text property\n    ```\n\n* **Custom Signals**:\
    \ Allow your component to notify external users about significant internal events\
    \ (e.g., it was clicked, a value changed). Declare signals using the `signal`\
    \ keyword, followed by the signal name and optional typed arguments.\n    ```qml\n\
    \    // Inside MyCustomButton.qml, at the root level\n    signal clicked(var mouseArgs)\
    \ // Define a 'clicked' signal, passing mouse event args\n    signal toggled(bool\
    \ isChecked) // Define a signal for a checkable component\n    ```\n    * You\
    \ emit these signals from JavaScript code within the component (e.g., inside a\
    \ `MouseArea` handler) using the signal name like a function call: `clicked(mouse)`\
    \ or `toggled(true)`.\n\n* **Custom Methods (Functions)**: You can define JavaScript\
    \ functions directly within the component's root item to provide methods that\
    \ can be called on instances of your component from outside.\n    ```qml\n   \
    \ // Inside MyCustomButton.qml, at the root level\n    function highlight() {\n\
    \        // 'rootRect' is assumed id of the main Rectangle\n        rootRect.border.color\
    \ = \"red\";\n        console.log(text + \" button highlighted!\");\n    }\n \
    \   ```\n\n### Example: A Reusable SimpleButton.qml Component\n\nLet's create\
    \ a basic button component:\n\n```qml\n// SimpleButton.qml\nimport QtQuick\n\n\
    Rectangle { // Root item is a Rectangle\n  id: root  // Give root an id for internal\
    \ reference\n\n  // --- Public Interface ---\n  property alias text: buttonLabel.text\
    \ // Expose internal Text's text property\n  property color buttonColor: \"lightgray\"\
    \  // Custom property for background\n  property color hoverColor: \"skyblue\"\
    \     // Custom property for hover\n  property color textColor: \"black\"    \
    \   // Custom property for text\n\n  // --- Internal Implementation ---\n  width:\
    \ buttonLabel.implicitWidth + 20  // Size based on text\n  height: buttonLabel.implicitHeight\
    \ + 10 // Padding\n  color: mouseArea.pressed ? Qt.darker(buttonColor, 1.2) :\
    \ (mouseArea.containsMouse ? hoverColor : buttonColor)\nradius: 4\n\n  Text {\n\
    \    id: buttonLabel\n    anchors.centerIn: parent\n    text: \"Default Text\"\
    \ // Default text if not set\n    font.pointSize: 12\n    color: textColor //\
    \ Bind to custom property\n  }\n\n  MouseArea {\n    id: mouseArea\n    anchors.fill:\
    \ parent\n    hoverEnabled: true  // Needed for containsMouse\n    cursorShape:\
    \ Qt.PointingHandCursor\n    onClicked: {\n      root.clicked() // Emit the component's\
    \ signal\n    }\n  }\n}\n```\n\n#### Using the SimpleButton Component\n\nNow,\
    \ in another file (e.g., `Main.qml` in the same directory), you can use this component:\n\
    \n```qml\n// Main.qml\nimport QtQuick\nimport QtQuick.Window\nimport QtQuick.Layouts\n\
    \nWindow {\n  width: 300; height: 200\n  visible: true\n  title: \"Custom Component\
    \ Test\"\n\n  ColumnLayout { // Use a layout to arrange buttons\n    anchors.centerIn:\
    \ parent\n    spacing: 10\n\n    SimpleButton { // First instance\n      id: okButton\n\
    \      text: \"OK\"  // Set the exposed 'text' property (alias)\n      buttonColor:\
    \ \"lightgreen\"  // Set custom property\n      hoverColor: \"palegreen\"\n  \
    \    onClicked: { // Handle the custom signal\n        console.log(\"OK Button\
    \ Clicked!\")\n      }\n    }\n\n    SimpleButton { // Second instance\n     \
    \ id: cancelButton\n      text: \"Cancel\"\n      buttonColor: \"#FFDDDD\"  //\
    \ Light red\n      hoverColor: \"#EEEEEEEE\"\n      textColor: \"darkred\"\n \
    \     Layout.alignment: Qt.AlignRight // Layout property\n      onClicked: {\n\
    \        console.log(\"Cancel Button Clicked!\")\n        Qt.quit() // Example\
    \ action\n      }\n    }\n  }\n}\n```\n\nNotice how each `SimpleButton` instance\
    \ is created declaratively. We configure each one using the custom properties\
    \ (`text`, `buttonColor`, etc.) defined in `SimpleButton.qml`, and we connect\
    \ to the custom `clicked` signal using the familiar `onSignalName` syntax. The\
    \ internal structure (`Rectangle`, `Text`, `MouseArea`) is hidden from the user\
    \ of the component.\n"
  raw: 'Making QML interfaces interactive involves capturing user input, typically
    using MouseArea for mouse and basic touch events, and responding within signal
    handlers like onClicked or onEntered. While simple property changes can be done
    imperatively within these handlers, QML States provide a powerful, declarative
    approach for defining distinct visual configurations. By defining State objects
    with PropertyChanges and modifying an item''s state property in response to events,
    you create well-structured and maintainable interactive components, paving the
    way for more complex behaviors and smooth visual transitions.


    # Chapter 7:


    # Dynamic UIs and C++ Integration


    * * *


    Building Reusable UI Elements with Custom QML Components


    * * *


    Imagine designing an application interface. You might need several buttons with
    a specific custom appearance (rounded corners, specific hover effects, an icon
    alongside text), or perhaps multiple instances of an input field paired with a
    validation status icon. Defining the QML structure and logic for such elements
    repeatedly throughout your UI code leads to duplication, makes maintenance difficult
    (a change needs to be applied everywhere), and clutters your main QML files.


    The solution is to encapsulate these recurring UI patterns into custom QML components.
    A custom component is essentially a self-contained QML element, defined in its
    own .qml file, which can then be instantiated and reused just like standard QML
    types (Rectangle, Text, etc.). This promotes modularity, reusability, and maintainability
    – core principles of good software design.


    Creating a Basic QML Component


    The fundamental idea is simple: any .qml file can act as a custom component.


    1.  Create a .qml File: Create a new text file with a .qml extension (e.g., MyCustomButton.qml).


    2.  Define Root Item: Inside this file, define a single root QML Item (e.g., Item,
    Rectangle, FocusScope) which serves as the base or container for your component.
    This root item, along with any child items defined within it, constitutes the
    component''s internal structure.


    3.  Filename is Type Name: The filename (with the first letter capitalized and
    without the .qml extension) becomes the QML type name you use to instantiate the
    component elsewhere. So, MyCustomButton.qml defines the MyCustomButton type.


    Directory Structure and Imports:


    By default, QML files within the same directory can usually instantiate each other
    using their type names directly. For better organization, you''ll often place
    custom components in subdirectories (e.g., a components folder). To use components
    from a subdirectory, you need to import that directory in the QML file where you
    want to use them:


    QML


    import QtQuick


    import  "./components"  // Import components from the ''components'' subdirectory


    // ... later ...


    MyCustomButton {


    // ... properties ...


    }


    (More advanced module definition mechanisms exist for larger projects or libraries).


    Defining the Component''s Public Interface


    A key aspect of components is encapsulation: hiding internal complexity and exposing
    a clean, well-defined interface for external use. This interface consists of custom
    properties, signals, and methods.


    ● Custom Properties: Allow users of your component to configure its appearance
    or behavior. There are two main ways to define them at the root level of your
    component''s .qml file:


    ○ property <type> propertyName: <defaultValue>: Defines a completely new property
    specific to your component. Internal elements can then bind to this property.


    QML


    // Inside MyCustomButton.qml, at the root level


    property color buttonColor: "lightgray"  // New property with a default


    property int cornerRadius: 4


    // Internal Rectangle might bind: color: buttonColor; radius: cornerRadius


    ○ property alias aliasName: internalItemId.propertyName: Exposes an existing property
    of an internal child item directly under a new name (aliasName) on the component.
    This is useful for providing direct access to common properties like text or source
    URLs.


    QML


    // Inside MyCustomButton.qml, assuming internal Text item has id: buttonLabel


    property alias text: buttonLabel.text // Expose internal Text item''s text property


    ● Custom Signals: Allow your component to notify external users about significant
    internal events (e.g., it was clicked, a value changed). Declare signals using
    the signal keyword, followed by the signal name and optional typed arguments.


    QML


    // Inside MyCustomButton.qml, at the root level


    signal clicked(var mouseArgs) // Define a ''clicked'' signal, passing mouse event
    args


    signal toggled(bool isChecked) // Define a signal for a checkable component


    ● You emit these signals from JavaScript code within the component (e.g., inside
    a MouseArea handler) using the signal name like a function call: clicked(mouse)
    or toggled(true).


    ● Custom Methods (Functions): You can define JavaScript functions directly within
    the component''s root item to provide methods that can be called on instances
    of your component from outside.


    QML


    // Inside MyCustomButton.qml, at the root level


    function  highlight() {


    // ''rootRect'' is assumed id of the main Rectangle


    rootRect.border.color = "red";


    console.log(text + " button highlighted!");


    }


    Example: A Reusable SimpleButton.qml Component


    Let''s create a basic button component:


    QML


    // SimpleButton.qml


    import QtQuick


    Rectangle { // Root item is a Rectangle


    id: root  // Give root an id for internal reference


    // --- Public Interface ---


    property alias text: buttonLabel.text // Expose internal Text''s text property


    property color buttonColor: "lightgray"  // Custom property for background


    property color hoverColor: "skyblue"    // Custom property for hover


    property color textColor: "black"       // Custom property for text color


    signal clicked()                        // Custom signal when clicked


    // --- Internal Implementation ---


    width: buttonLabel.implicitWidth + 20  // Size based on text + padding


    height: buttonLabel.implicitHeight + 10


    color: mouseArea.pressed ? Qt.darker(buttonColor, 1.2) : (mouseArea.containsMouse
    ? hoverColor : buttonColor) // Dynamic color based on state


    border.color: Qt.darker(color, 1.3) // Border slightly darker than background


    radius: 4


    Text {


    id: buttonLabel


    anchors.centerIn: parent


    text: "Default Text"  // Default text if not set externally


    color: root.textColor // Bind to custom property


    font.pointSize: 12


    }


    MouseArea {


    id: mouseArea


    anchors.fill: parent


    hoverEnabled: true  // Needed for containsMouse


    cursorShape: Qt.PointingHandCursor


    onClicked: {


    root.clicked() // Emit the component''s signal


    }


    }


    }


    Using the SimpleButton Component:


    Now, in another file (e.g., Main.qml in the same directory), you can use this
    component:


    QML


    // Main.qml


    import QtQuick


    import QtQuick.Window


    import QtQuick.Layouts


    Window {


    width: 300; height: 200


    visible: true


    title: "Custom Component Test"


    ColumnLayout { // Use a layout to arrange buttons


    anchors.centerIn: parent


    spacing: 10


    SimpleButton { // First instance


    id: okButton


    text: "OK"  // Set the exposed ''text'' property (alias)


    buttonColor: "lightgreen"  // Set custom property


    hoverColor: "palegreen"


    onClicked: { // Handle the custom signal


    console.log("OK Button Clicked!")


    }


    }


    SimpleButton { // Second instance


    id: cancelButton


    text: "Cancel"


    buttonColor: "#FFDDDD"  // Light red


    hoverColor: "#FFEEEE"


    textColor: "darkred"


    Layout.alignment: Qt.AlignRight // Layout property


    onClicked: {


    console.log("Cancel Button Clicked!")


    Qt.quit() // Example action


    }


    }


    }


    }


    Notice how each SimpleButton instance is created declaratively. We configure each
    one using the custom properties (text, buttonColor, etc.) defined in SimpleButton.qml,
    and we connect to the custom clicked signal using the familiar onSignalName syntax.
    The internal structure (Rectangle, Text, MouseArea) is hidden from the user of
    the component.'
