    declaring them via Q_PROPERTY, simply by calling setProperty("newPropertyName",
    value). These "dynamic properties" are stored internally but lack the full metadata
    (like specific NOTIFY signals) associated with declared properties. They are primarily
    useful for attaching arbitrary user data to objects temporarily. Rely on Q_PROPERTY
    for any state that needs proper integration with binding or introspection.


    The Meta-Object System, enabled by QObject, the Q_OBJECT macro, and the MOC preprocessor,
    extends C++ with powerful introspection capabilities crucial for Qt''s dynamic
    features. Qt Properties, declared using Q_PROPERTY, build upon this system to
    provide a standardized way to expose object state, complete with accessor functions
    and change notification signals (NOTIFY). This not only allows for dynamic querying
    and manipulation of object attributes but, most importantly, serves as the foundation
    for the data binding mechanisms essential for frameworks like Qt Quick/QML, enabling
    reactive and maintainable user interfaces. Understanding how to define and use
    properties correctly is therefore vital for leveraging the full power of Qt.


    ## Understanding and Handling Events in Qt Applications


    * * *


    While signals and slots provide a high-level mechanism for communication between
    objects based on state changes or specific occurrences, Qt applications are fundamentally
    driven by events. Events represent low-level notifications about things that have
    happened, such as a user pressing a key, moving the mouse, a window being resized,
    or the system requesting a repaint. Understanding how Qt processes these events
    is crucial for creating interactive and responsive applications. Signals are often
    emitted as a result of handling an event (e.g., a QPushButton handles a mouse
    press event and, in response, emits its clicked() signal), but the event system
    is the underlying foundation.


    The Event Loop: The Application''s Heartbeat


    At the core of every Qt application (GUI or console) runs an event loop. When
    you call QApplication::exec() (or QCoreApplication::exec() for non-GUI apps),
    you start this loop. The event loop''s primary responsibilities are:


    1.  Waiting: It continuously monitors various event sources (like the window system
    for mouse/keyboard input, network sockets for incoming data, timers). If there
    are no events, the application typically "sleeps" efficiently within the event
    loop, consuming minimal CPU resources.


    2.  Dispatching: When an event occurs (e.g., the user clicks the mouse), it''s
    detected and placed into an event queue associated with the target object (usually
    a widget) and its thread.


    3.  Processing: The event loop retrieves events from the queue one by one and
    dispatches them to the intended recipient object for processing.


    This continuous cycle of waiting, dispatching, and processing keeps the application
    alive and responsive. It''s vital not to perform long-running, blocking operations
    directly within code that executes as part of the event loop (like inside an event
    handler or a slot connected via AutoConnection or DirectConnection), as this will
    prevent the loop from processing further events, causing the UI to freeze and
    become unresponsive. We''ll address handling long tasks later when discussing
    concurrency.


    Event Generation and Delivery


    Events originate from various sources:


    ● Window System: Mouse movements, button clicks, key presses, window resize/move
    requests, paint requests.


    ●     Timers: QTimer objects generate QTimerEvents at regular intervals.


    ● User Code: You can manually create and post events using QCoreApplication::postEvent
    (asynchronous) or send them synchronously with QCoreApplication::sendEvent.


    ●     Other Sources: Network operations, internal Qt state changes, etc.


    Each event is represented by an instance of a class derived from the base QEvent.
    Qt defines numerous event types (QEvent::Type enum) and corresponding classes
    carrying specific information:


    ●     QMouseEvent: Contains mouse cursor position, button states.


    ● QKeyEvent: Contains information about the key pressed or released, modifier
    keys (Shift, Ctrl, Alt).


    ● QPaintEvent: Indicates a region of a widget needs to be repainted.


    ● QResizeEvent: Contains the old and new size of a widget.


    ●     QCloseEvent: Generated when a window is requested to close.


    The delivery process, simplified, looks like this: An event is generated and queued
    for the target object''s thread. The event loop picks it up and calls QCoreApplication::notify(),
    a central dispatch function. This function eventually calls the target QObject''s
    virtual event(QEvent *event) function. The default implementation of QObject::event()
    (and more specialized versions in QWidget, etc.) examines the event''s type (event->type())
    and calls a corresponding type-specific, virtual event handler function if one
    exists (e.g., if the type is QEvent::MouseButtonPress, it calls mousePressEvent()).


