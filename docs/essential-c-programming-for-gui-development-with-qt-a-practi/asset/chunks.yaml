  trans: "\n第一步是在下载安装程序之前，先创建一个 Qt 账户。从历史角度来看，访问开源组件并不总是强制要求账户的，但现在已成为通过在线安装程序（Online\
    \ Installer）管理下载的标准方式。别担心，创建账户是免费且简单的。只需访问 Qt 官网（`qt.io`）并寻找“注册”（Sign up）或“创建账户”（Create\
    \ account）等选项。你通常需要提供电子邮件地址并创建一个密码。该账户允许安装程序验证你的身份，并根据与你的账户相关的开源（LGPLv3/GPL）或商业许可显示可用的下载内容。一旦账户创建并验证通过（你可能需要通过电子邮件进行确认），请妥好登录凭据以便安装程序使用。\n\
    \n## 获取并运行 Qt 在线安装程序\n\n准备好 Qt 账户后，回到 Qt 网站的下载区域。寻找与“应用程序开发 Qt”（Qt for Application\
    \ Development）或“Qt 在线安装程序”相关的下载。你会发现适用于 Windows (`.exe`)、macOS (`.dmg`) 和 Linux\
    \ (`.run`) 的版本。下载适用于你操作系统的相应安装程序。\n\n下载完成后，启动安装程序。它首先会提示你输入 Qt 账户凭据（电子邮件和密码）。输入它们以继续。安装程序将从\
    \ Qt 服务器获取有关可用 Qt 版本和工具的最新信息。你将被引导通过几个屏幕，包括欢迎信息和许可协议。请注意许可条款；对于大多数开源开发，你将在 LGPLv3\
    \ 或 GPL 许可条款下进行。\n\n## 导航组件选择\n\n这是安装过程中最关键的阶段，在此处你精确指定需要 Qt 生态系统中的哪些部分。\n\n-\
    \   **安装文件夹 (Installation Folder)**：安装程序将询问你想将 Qt SDK 和工具安装在哪里。强烈建议（尤其是 Windows\
    \ 上）选择不包含空格或特殊字符的路径。在 Windows 上使用简单的路径如 `C:\\Qt`，在 macOS 上使用 `/Users/your_username/Qt`，在\
    \ Linux 上使用 `/home/your_username/Qt`（或者系统级安装使用 `/opt/Qt`，但用户级通常更容易操作）通常更好。这可以避免某些构建工具或脚本无法正确处理复杂路径时可能出现的问题。\n\
    -   **安装类型 (Installation Type)**你可能会看到“默认安装”（Default installation）、“最小化安装”（Minimal\
    \ installation）或“自定义安装”（Custom installation）等选项。始终选择“自定义安装”。这让你对组件进行细粒度的控制，确保你安装了使用\
    \ Qt 6 进行 C++ 桌面开发所需的特定 Qt 版本、模块和工具。默认安装可能会忽略必要的特定编译器构建，或安装你并不打算使用的版本。\n-   **选择组件\
    \ (Selecting Components)**：自定义安装界面显示可用组件的树状视图。起初看起来可能让人眼花缭，但我们可以将其拆解：\n    - \
    \  **Qt 版本 (Qt Versions)**：你会看到不同主要 Qt 版本的分类（例如 Qt 6、Qt 5）。展开最新的稳定版 Qt 6.x 类别（例如，在本文写作时，你可能会看到\
    \ Qt 6.7 或类似的发布）。这是我们将在书中重点关注的版本。\n    -   **Qt 6.x 内部特定平台模块 (Platform-Specific\
    \ Modules within Qt 6.x)**：在选定的 Qt 6.x 版本下，你会找到为不同的编译器和架构定制的构建。这至关重要。你必须选择与你打算在系统上使用的编译器匹配的组件：\n\
    \        -   **在 Windows 上**：你会看到如 `MSVC 2019 64-bit`、`MSVC 2022 64-bit`、`MinGW\
    \ 64-bit`（特定的 MinGW 版本可能会不同）等选项。选择与你已安装或计划安装的编译器对应的那个（稍后详细介绍编译器）。针对现代 Windows\
    \ 的开发，64 位是标准配置。\n        -   **在 macOS 上**：你通常只会看到一个 macOS 选项。此构建使用 Xcode 提供的\
    \ Clang 编译器。\n        -   **在 Linux 上**：你通常会看到 `GCC 64-bit` 选项，它是针对许多 Linux 发行版标准的\
    \ GCC 编译器版本构建的。\n    -   **Qt 6.x 下的额外库 (Additional Libraries under Qt 6.x)**：除了核心平台构建，你可能看到其他库的复选框。确保选中了\
    \ `Qt Shader Tools` 等基本内容（通常是默认选中的）。如果你预见最初要处理旧代码示例，可以考虑 `Qt 5 Compatibility Module`，但请尽量专注于纯\
    \ Qt 6。如果你知道之后需要，可以现在添加 `Qt WebEngine`（用于嵌入网页内容）或 `Qt Multimedia` 等模块，或者稍后重新运行安装程序添加组件。避免盲目选择所有内容，因为这会显著增加下载大小和安装时间。\n\
    \    -   **源码 (Sources)**：通常有一个下载所选 Qt 版本“源码”的选项。这允许你在调试时进入 Qt 自身的代码，对于高级故障排除非常有帮助。然而，它会消耗大量的磁盘空间。对于初始设置，除非你有特定理由包含它们，否则可以安全地跳过下载源码。\n\
    \    -   **移动目标 (Mobile Targets - Android/iOS)**：你可能会看到 Android 或 iOS 开发的选项。虽然\
    \ Qt 支持移动端，但本书重点关注桌面应用程序。除非移动开发是近期目标，否则目前可以忽略这些。\n    -   **开发者和设计工具 (Developer\
    \ and Designer Tools)**：这是树状视图中的另一个顶级分类。确保选择了最新稳定版本的 `Qt Creator`。这是我们在整书中使用的\
    \ IDE。你还应该确保选中了 `CMake`，因为 Qt 6 高度依赖它作为构建系统。像 `Ninja`（Make 的快速替代方案）之类的构建工具也可能在此处选中或隐含包含；通常有它们是好的。\n\
    \    -   **编译器 (Compilers - Windows/MinGW)**：如果你在 Windows 上并计划使用 MinGW 编译器（GCC\
    \ 的端口）而不是微软的 MSVC，Qt 安装程序可能会在“开发者和设计工具”下提供下载并安装建议。如果你还没有安装兼容的 MinGW 工具链，选择此选项非常方便。\n\
    \n仔细检查你的选择，确保你有与编译器、Qt Creator 和 CMake 匹配的 Qt 6.x 构建。然后继续安装。根据网络连接和选择组件的数量，下载和安装过程可能需要一段时间。\n\
    \n## 特定编译器前提\n\nQt 本身是一个框架；它需要一个 C++ 编译器将你的源代码转换为可执行程序。你在安装期间选择的 Qt 库是使用特定编译器预编译的，你需要在系统中安装兼容的编译器。\n\
    \n### Windows\n\n**Microsoft Visual C++ (MSVC)**：这是微软原生 C++ 编译器，包含在 Visual Studio\
    \ 中。你并不一定需要安装 Visual Studio IDE。你可以从微软网站免费获取 `Visual Studio 生成工具` 安装程序来安装所需的命令行工具。在运行\
    \ Visual Studio 安装程序（无论是完整 IDE 还是生成工具）时，请确保勾选“使用 C++ 的桌面开发”工作负载。至关重要的是，你安装的 MSVC\
    \ 版本（例如 `MSVC 2019` 或 `MSVC 2022`）必须与你在 Qt 在线安装程序中选择的 Qt MSVC 构建匹配（例如 `MSVC 2019\
    \ 64-bit`）。Visual Studio 的社区版也是免费的，并包含了必要的编译器。\n"
- fmt: "\n## Compiler Selection\n\n### **MinGW (Minimalist GNU for Windows)**: This\
    \ is a port of the popular GNU Compiler Collection (`GCC`) to Windows. If you\
    \ selected a MinGW build of Qt, you need a compatible MinGW compiler. As mentioned,\
    \ the Qt installer might provide one. Alternatively, you can install MinGW separately,\
    \ often via distributions like `MSYS2` (which provides a package manager environment).\
    \ If installing separately, ensure the architecture (usually 64-bit, matching\
    \ the Qt build like `MinGW` 64-bit) and version are compatible with the Qt build\
    \ you chose. Compatibility information is usually available in the Qt documentation\
    \ for the specific release.\n\n### **macOS**\n\n- **Xcode and Command Line Tools**:\
    \ Apple provides its development tools via `Xcode`. Install the latest version\
    \ of `Xcode` from the Mac App Store. `Xcode` includes the `Clang` C++ compiler.\
    \ After installing `Xcode`, you may also need to explicitly install the Command\
    \ Line Tools. Open the `Terminal` application (`Applications > Utilities > Terminal`)\
    \ and run the command: `xcode-select --install`. Follow the prompts. This ensures\
    \ the compilers and other build tools are accessible from the command line and\
    \ easily discoverable by `Qt Creator`.\n\n### **Linux**\n\n- **GCC/G++**: The\
    \ `GNU Compiler Collection` is the standard compiler on most Linux distributions.\
    \ You need to install the C++ compiler and related build tools. The exact package\
    \ names vary:\n    - On **Debian/Ubuntu/Mint**: Open a terminal and run `sudo\
    \ apt update && sudo apt install build-essential`. This package group includes\
    \ `GCC/G++` and other essential tools like `make`.\n    - On **Fedora/CentOS/RHEL**:\
    \ Open a terminal and run `sudo dnf groupinstall \"Development Tools\"` (or `yum`\
    \ on older `CentOS/RHEL`).\n    - Ensure your installed `GCC` version meets the\
    \ minimum requirement for the Qt 6 version you are using (check Qt documentation,\
    \ but modern distributions usually provide a sufficiently recent version capable\
    \ of C++17/20).\n\n- **Clang**: `Clang` is another excellent C++ compiler available\
    \ on Linux. You can install it via your distribution's package manager (e.g.,\
    \ `sudo apt install clang` on Debian/Ubuntu, `sudo dnf install clang` on Fedora).\
    \ If you intend to use `Clang`, ensure you select a `Clang`-compatible Qt build\
    \ if one is offered, or verify compatibility. `GCC` is generally the most common\
    \ choice on Linux for Qt development.\n\n- **Essential Development Libraries**:\
    \ Qt applications often depend on other system libraries for rendering, fonts,\
    \ platform integration, etc. Installing the main build tools (`build-essential`\
    \ or `Development Tools`) usually pulls in many necessary dependencies. However,\
    \ you might occasionally need specific development packages (often ending in `-dev`\
    \ or `-devel`), such as those for OpenGL/Mesa (`libgl1-mesa-dev` on Debian/Ubuntu)\
    \ or Fontconfig (`libfontconfig1-dev`). Package dependencies for the Qt libraries\
    \ themselves, if installed via the system package manager (which we are not doing\
    \ here, using the online installer instead), often handle this, but being aware\
    \ of potential system library dependencies is helpful for troubleshooting.\n\n\
    ## Configuring Qt Creator\n\nWith the Qt SDK and a compatible compiler installed,\
    \ it's time to launch `Qt Creator`, the IDE installed by the Online Installer.\
    \ The first time you run it, it will likely perform some initial setup and might\
    \ attempt to automatically detect your installed Qt versions and compilers.\n\n\
    The core concept for managing toolchains in `Qt Creator` is the `Kit`. A `Kit`\
    \ represents a complete configuration for building and running a Qt project. It\
    \ bundles together:\n\n- A specific `Qt Version` (e.g., `Qt 6.7.0` for `MSVC 2019`\
    \ 64-bit)\n- A C++ Compiler (e.g., `MSVC 2019` 64-bit, `MinGW` 64-bit, `Clang`\
    \ macOS, `GCC` Linux)\n- A `Debugger` (usually auto-detected alongside the compiler,\
    \ like `GDB` or `CDB`)\n- The `CMake` Tool (pointing to the `CMake` executable)\n\
    - Other settings like the target device (Desktop)\n\n`Qt Creator` is usually very\
    \ good at auto-detecting valid combinations based on what you installed via the\
    \ Online Installer and the system compilers it finds. To review and manage these\
    \ Kits:\n\n1. Go to `Tools > Options` (on Windows/Linux) or `Qt Creator > Preferences`\
    \ (on macOS).\n2. Select the `Kits` section from the left-hand pane.\n3. You will\
    \ see tabs for `Kits`, `Qt Versions`, `Compilers`, `Debuggers`, `CMake`.\n4. Under\
    \ the `Kits` tab, examine the automatically detected Kits. A valid `Kit` will\
    \ have a green checkmark or appropriate icons next to its components. If you see\
    \ warnings (yellow triangles) or errors (red icons), it means `Qt Creator` couldn't\
    \ find or verify a component (e.g., the specified compiler wasn't found in the\
    \ system `PATH`).\n5. If a `Kit` is misconfigured, you can often select the correct\
    \ component from the dropdown lists within the `Kit`'s details (e.g., manually\
    \ select the detected compiler if it wasn't automatically associated). Ensure\
    \ the Qt version matches the compiler specified in the `Kit`'s name (e.g., a Kit\
    \ using `MSVC` should point to an `MSVC` build of Qt).\n6. It's good practice\
    \ to select the primary Kit you intend to use (e.g., the `Desktop Qt 6.7.0` kit\
    \ matching your main compiler) and click the `Make Default` button. This ensures\
    \ new projects use this configuration unless you specify otherwise.\n\nSpend a\
    \ few minutes ensuring you have at least one valid Kit correctly configured for\
    \ Desktop Qt 6 development using the compiler you installed.\n\n## Verifying the\
    \ Complete Setup\n\nThe best way to confirm everything is working correctly is\
    \ to build and run a simple project.\n\n1. In `Qt Creator`, go to `File > New\
    \ Project...` or `File > New File or Project....`.\n2. Choose `Application (Qt)\
    \ -> Qt Widgets Application` (or `Qt Console Application`). Click `Choose....`.\n\
    3. Give your project a name (e.g., `HelloWorldWidgets`) and choose a location\
    \ to create it (use paths without spaces). Click `Next`.\n4. Select the build\
    \ system: Choose `CMake`. Click `Next`.\n5. Accept the default class names (e.g.,\
    \ `MainWindow`). Click `Next`.\n6. Select the Kit you configured and verified\
    \ earlier. Ensure only that Kit is checked.\n7. Click `Finish`.\n8. `Qt Creator`\
    \ will generate the project files. Once it's done processing, click the green\
    \ \"Run\" button (looks like a play symbol) in the bottom-left panel or press\
    \ `Ctrl+R` (`Cmd+R` on macOS).\n\nIf your environment is set up correctly, `CMake`\
    \ will configure the project, the compiler will build it, and a small empty window\
    \ (for Widgets) or console output (for Console) will appear. Seeing this simple\
    \ application run successfully confirms that the Qt libraries, `Qt Creator`, `CMake`,\
    \ the compiler, and the linker are all communicating correctly.\n\n## Troubleshooting\
    \ Common Setup Issues\n\nIf the verification step fails, here are common culprits:\n\
    \n- **Invalid Kit**: Double-check the Kit configuration in `Qt Creator`. Ensure\
    \ the compiler path, Qt version, and `CMake` tool are correctly identified and\
    \ compatible.\n- **Missing Compiler**: Did you install the compiler correctly\
    \ (`Visual Studio Build Tools`, `Xcode Command Line Tools`, Linux `build-essential`)?\
    \ Is the compiler accessible in the system `PATH` environment variable, or is\
    \ its path correctly specified in the `Kit`?\n- **Compiler/Qt Mismatch**: Are\
    \ you trying to use a Kit configured for `MSVC` with a `MinGW` build of Qt, or\
    \ vice-versa? Ensure the selected Qt version matches the compiler in the `Kit`.\n\
    - **PATH Environment Variable**: Sometimes, build tools might not be found if\
    \ their installation directories aren't in the system's `PATH`.\n- **Installation\
    \ Path Issues**: Paths with spaces or non-ASCII characters can occasionally cause\
    \ problems, though `CMake` and modern tools handle them better than older systems.\
    \ Sticking to simple paths (`C:\\Qt`, `~/Qt`) is safer.\n- **Firewall/Antivirus**:\
    \ Rarely, aggressive security software might interfere with the installer's downloads\
    \ or the build process.\n- **Incorrect Components**: Did you forget to select\
    \ the specific Qt 6.x module for your compiler or `Qt Creator` itself during the\
    \ Online Installer steps? You can rerun the Online Installer (`MaintenanceTool.exe`\
    \ or similar in your Qt installation directory) to add or remove components.\n"
  raw: '○ MinGW (Minimalist GNU for Windows): This is a port of the popular GNU Compiler
    Collection (GCC) to Windows. If you selected a MinGW build of Qt, you need a compatible
    MinGW compiler. As mentioned, the Qt installer might provide one. Alternatively,
    you can install MinGW separately, often via distributions like MSYS2 (which provides
    a package manager environment). If installing separately, ensure the architecture
    (usually 64-bit, matching the Qt build like MinGW 64-bit) and version are compatible
    with the Qt build you chose. Compatibility information is usually available in
    the Qt documentation for the specific release.


    ●     macOS:


    ○ Xcode and Command Line Tools: Apple provides its development tools via Xcode.
    Install the latest version of Xcode from the Mac App Store. Xcode includes the
    Clang C++ compiler. After installing Xcode, you may also need to explicitly install
    the Command Line Tools. Open the Terminal application (Applications > Utilities
    > Terminal) and run the command: xcode-select --install. Follow the prompts. This
    ensures the compilers and other build tools are accessible from the command line
    and easily discoverable by Qt Creator.


    ●     Linux:


    ○ GCC/G++: The GNU Compiler Collection is the standard compiler on most Linux
    distributions. You need to install the C++ compiler and related build tools. The
    exact package names vary:


    ■ On Debian/Ubuntu/Mint: Open a terminal and run sudo apt update && sudo apt install
    build-essential. This package group includes GCC/G++ and other essential tools
    like make.


    ■ On Fedora/CentOS/RHEL: Open a terminal and run sudo dnf groupinstall "Development
    Tools" (or yum on older CentOS/RHEL).


    ■ Ensure your installed GCC version meets the minimum requirement for the Qt 6
    version you are using (check Qt documentation, but modern distributions usually
    provide a sufficiently recent version capable of C++17/20).


    ○ Clang: Clang is another excellent C++ compiler available on Linux. You can install
    it via your distribution''s package manager (e.g., sudo apt install clang on Debian/Ubuntu,
    sudo dnf install clang on Fedora). If you intend to use Clang, ensure you select
    a Clang-compatible Qt build if one is offered, or verify compatibility. GCC is
    generally the most common choice on Linux for Qt development.


    ○ Essential Development Libraries: Qt applications often depend on other system
    libraries for rendering, fonts, platform integration, etc. Installing the main
    build tools (build-essential or Development Tools) usually pulls in many necessary
    dependencies. However, you might occasionally need specific development packages
    (often ending in -dev or -devel), such as those for OpenGL/Mesa (libgl1-mesa-dev
    on Debian/Ubuntu) or Fontconfig (libfontconfig1-dev). Package dependencies for
    the Qt libraries themselves, if installed via the system package manager (which
    we are not doing here, using the online installer instead), often handle this,
    but being aware of potential system library dependencies is helpful for troubleshooting.


    Configuring Qt Creator


    With the Qt SDK and a compatible compiler installed, it''s time to launch Qt Creator,
    the IDE installed by the Online Installer. The first time you run it, it will
    likely perform some initial setup and might attempt to automatically detect your
    installed Qt versions and compilers.


    The core concept for managing toolchains in Qt Creator is the Kit. A Kit represents
    a complete configuration for building and running a Qt project. It bundles together:


    ● A specific Qt Version (e.g., Qt 6.7.0 for MSVC 2019 64-bit)


    ● A C++ Compiler (e.g., MSVC 2019 64-bit, MinGW 64-bit, Clang macOS, GCC Linux)


    ● A Debugger (usually auto-detected alongside the compiler, like GDB or CDB)


    ●     The CMake Tool (pointing to the CMake executable)


    ●     Other settings like the target device (Desktop)


    Qt Creator is usually very good at auto-detecting valid combinations based on
    what you installed via the Online Installer and the system compilers it finds.
    To review and manage these Kits:


    1.  Go to Tools > Options (on Windows/Linux) or Qt Creator > Preferences (on macOS).


    2.  Select the Kits section from the left-hand pane.


    3.  You will see tabs for Kits, Qt Versions, Compilers, Debuggers, CMake.


    4.  Under the Kits tab, examine the automatically detected Kits. A valid Kit will
    have a green checkmark or appropriate icons next to its components. If you see
    warnings (yellow triangles) or errors (red icons), it means Qt Creator couldn''t
    find or verify a component (e.g., the specified compiler wasn''t found in the
    system PATH).


    5.  If a Kit is misconfigured, you can often select the correct component from
    the dropdown lists within the Kit''s details (e.g., manually select the detected
    compiler if it wasn''t automatically associated). Ensure the Qt version matches
    the compiler specified in the Kit''s name (e.g., a Kit using MSVC should point
    to an MSVC build of Qt).


    6.  It''s good practice to select the primary Kit you intend to use (e.g., the
    Desktop Qt 6.7.0 kit matching your main compiler) and click the Make Default button.
    This ensures new projects use this configuration unless you specify otherwise.


    Spend a few minutes ensuring you have at least one valid Kit correctly configured
    for Desktop Qt 6 development using the compiler you installed.


    Verifying the Complete Setup


    The best way to confirm everything is working correctly is to build and run a
    simple project.


    1.  In Qt Creator, go to File > New Project... or File > New File or Project....


    2.  Choose Application (Qt) -> Qt Widgets Application (or Qt Console Application).
    Click Choose....


    3.  Give your project a name (e.g., HelloWorldWidgets) and choose a location to
    create it (use paths without spaces). Click Next.


    4.  Select the build system: Choose CMake. Click Next.


    5.  Accept the default class names (e.g., MainWindow). Click Next.


    6.  Select the Kit you configured and verified earlier. Ensure only that Kit is
    checked. Click Next.


    7.  Click Finish.


    8.  Qt Creator will generate the project files. Once it''s done processing, click
    the green "Run" button (looks like a play symbol) in the bottom-left panel or
    press Ctrl+R (Cmd+R on macOS).


    If your environment is set up correctly, CMake will configure the project, the
    compiler will build it, and a small empty window (for Widgets) or console output
    (for Console) will appear. Seeing this simple application run successfully confirms
    that the Qt libraries, Qt Creator, CMake, the compiler, and the linker are all
    communicating correctly.


    Troubleshooting Common Setup Issues


    If the verification step fails, here are common culprits:


    ● Invalid Kit: Double-check the Kit configuration in Qt Creator. Ensure the compiler
    path, Qt version, and CMake tool are correctly identified and compatible.


    ● Missing Compiler: Did you install the compiler correctly (Visual Studio Build
    Tools, Xcode Command Line Tools, Linux build-essential)? Is the compiler accessible
    in the system''s PATH environment variable, or is its path correctly specified
    in the Kit?


    ● Compiler/Qt Mismatch: Are you trying to use a Kit configured for MSVC with a
    MinGW build of Qt, or vice-versa? Ensure the selected Qt version matches the compiler
    in the Kit.


    ● PATH Environment Variable: Sometimes, build tools might not be found if their
    installation directories aren''t in the system''s PATH.


    ● Installation Path Issues: Paths with spaces or non-ASCII characters can occasionally
    cause problems, though CMake and modern tools handle them better than older systems.
    Sticking to simple paths (C:\Qt, ~/Qt) is safer.


    ● Firewall/Antivirus: Rarely, aggressive security software might interfere with
    the installer''s downloads or the build process.


    ● Incorrect Components: Did you forget to select the specific Qt 6.x module for
    your compiler or Qt Creator itself during the Online Installer steps? You can
    rerun the Online Installer (MaintenanceTool.exe or similar in your Qt installation
    directory) to add or remove components.'
