    \n}\n\nRectangle { // 第三个元素，填充底部区域\n\nid: bottomRect\nheight: 40\n\ncolor: \"\
    wheat\"\n\n// 锚定水平填充底部，并带有边距\n\nanchors.left: parent.left\nanchors.right: parent.right\n\
    anchors.bottom: parent.bottom\nanchors.margins: 10\n\n}\n\n}\n\n}\n```\n\n###\
    \ 快捷锚点 (Convenience Anchors):\n\n ● `anchors.fill: targetItem`: 使项目占据与 `targetItem`（通常是父级）相同的几何区域。适用于背景。\n\
    \ ● `anchors.centerIn: targetItem`: 将项目在 `targetItem`（通常是父级）内水平和垂直方向居中。等同于设置 `horizontalCenter`\
    \ 和 `verticalCenter` 锚点。\n\n锚点创建了强关系。如果上述示例中的容器移动或调整大小，所有子矩形将自动调整其位置，并可能调整大小（如果没有显式设置\
    \ `width`/`height` 且锚点对其进行了约束），以保持定义的关系。\n\n### 布局器 (Positioners): 基于规则的简单排列\n\
    \n布局器是容器项目，它们根据简单的预定义规则排列其子元素。你直接在布局器块内部声明子元素，由它处理这些元素的布局。Qt Quick 提供了几种布局器类型：\n\
    \n ● `Row`: 从左到右水平排列子元素。\n ● `Column`: 从上到下垂直排列子元素。\n ● `Grid`: 在网格中排列子元素，从左到右、从上到下填充单元格。你可以指定\
    \ `rows` 或 `columns`。\n ● `Flow`: 像页面上的文字一样排列子元素——从左到右，当可用宽度（`Flow` 自身的 `width`\
    \ 属性）超出时，换到下一行。\n\n布局器具有如 `spacing`（用于 `Row`、`Column`、`Grid`、`Flow`）、`rowSpacing`、`columnSpacing`（用于\
    \ `Grid`、`Flow`）等属性，用于控制项目之间的间距。\n\n#### QML 示例\n\n```qml\nimport QtQuick\n\n\
    Column { // 此代码段使用 Column 作为根节点\n\nspacing: 5  // 列中元素之间的间距\n\nRow { // 列内部的一行\n\
    \nid: buttonRow\nspacing: 10  // 行内元素之间的间距\n\nRectangle { color: \"red\"; width:\
    \ 50; height: 30 }\nRectangle { color: \"green\"; width: 50; height: 30 }\nRectangle\
    \ { color: \"blue\"; width: 50; height: 30 }\n}\n\nGrid {\ncolumns: 3  // 将后续元素排列在\
    \ 3 列网格中\nspacing: 3\nRepeater { // 通常与布局器配合使用以创建创建多个元素\n\nmodel: 6  // 创建 6 个元素\n\
    \ndelegate: Rectangle {\nwidth: 40; height: 40\ncolor: Qt.rgba(Math.random(),\
    \ Math.random(), Math.random(), 1.0)\n}\n}\n}\n}\n```\n\n### 限制性\n\n布局器主要管理位置。它们根据项目自身的显式或隐式大小排列项目。它们不会像传统的布局管理器那样智能地重新调整项目大小以填充可用空间。\n\
    \n### Qt Quick 布局 (Layouts): 健壮的大小和位置管理\n\n对于需要类似于 QtWidgets 布局的健壮大小管理的复杂 UI，Qt\
    \ 提供了 Qt Quick Layout 模块。你需要导入 `QtQuick.Layouts`。该模块包含了 `RowLayout`、`ColumnLayout`\
    \ 和 `GridLayout`。\n\n**主要区别:** 与布局器不同，Qt Quick Layout 会积极管理子元素的大小和位置。它们会考虑项目的最小、首选和最大大小，以及子元素提供的特定指令，以智能地分配空间。使得它们更适用于结构化的应用程序\
    \ UI、表单以及组件需要优雅扩展或收缩的情况。\n\n#### 附加属性 (Layout.*): Qt Quick Layout 内部的项目使用以 `Layout`\
    \ 为前缀的附加属性来通信它们的尺寸偏好。\n\n ● `Layout.fillWidth: true` / `Layout.fillHeight: true`:\
    \ 告诉布局允许此项目水平/垂直扩展以填充可用空间。\n ● `Layout.preferredWidth`, `Layout.preferredHeight`:\
    \ 向布局提供理想尺寸的提示。\n ● `Layout.minimumWidth`, `Layout.maximumWidth` 等：定义大小约束。\n ●\
    \ `Layout.alignment`: 在分配的布局单元格内对齐项目（例如 `Qt.AlignRight`、`Qt.AlignVCenter`）。\n\
    \ ● `Layout.row`, `Layout.column`, `Layout.rowSpan`, `Layout.columnSpan`: 在 `GridLayout`\
    \ 中用于定位项目并允许跨越。\n\n#### QML 示例\n\n```qml\nimport QtQuick\nimport QtQuick.Layouts\
    \ // 导入 Layouts 模块\n\nColumnLayout { // 使用 ColumnLayout 代替 Column\n\nanchors.fill:\
    \ parent  // 使布局填充其父级\n\nRectangle { // 项目 1：取固定首选高度，填充宽度\n\nid: header\nLayout.preferredHeight:\
    \ 40\nLayout.fillWidth: true  // 水平扩展\n\ncolor: \"lightblue\"\n\nText { anchors.centerIn:\
    \ parent; text: \"Header Area\" }\n}\n\nRectangle { // 项目 2：占据所有剩余的垂直空间，填充宽度\n\
    \nid: content\nLayout.fillWidth: true\nLayout.fillHeight: true  // 占据剩余垂直空间\n\n\
    color: \"lightyellow\"\n\nText { anchors.centerIn: parent; text: \"Content Area\
    \ (Stretches)\" }\n}\n\nRectangle { // 项目 3：固定大小，右对齐\n\nid: footer\nLayout.preferredWidth:\
    \ 100\nLayout.preferredHeight: 30\nLayout.alignment: Qt.AlignRight // 在其布局槽内对齐\n\
    \ncolor: \"lightgray\"\n\nText { anchors.centerIn: parent; text: \"Footer\" }\n\
    }\n\n}\n```\n\n注意与基础布局器相比，`Layout.fillHeight` 和 `Layout.fillWidth` 对空间分布提供了丰富得多的控制。\n\
    \n### 选择正确的方法\n\n ● **锚点 (Anchors)**: 几乎所有定位任务的基础。使用它们来居中项目、对齐边缘、填充容器或相对于兄弟元素对齐项目。通常用于由布局或布局器管理的项目内部。\n\
    \ ● **布局器 (Row, Column, Grid, Flow)**: 最适用于简单的线性或网格排列，在这些情况下项目应保持其固有大小，且不需要复杂的缩放策略。对于基本列表或流非常快速。\n\
    \ ● **Qt Quick 布局 (RowLayout, ColumnLayout, GridLayout)**: 结构化应用程序布局、表单、工具栏、状态栏以及任何对智能缩放、对齐和空间分配有要求的复杂排列的首选选择。当你构建类似于使用\
    \ QtWidgets 布局创建的界面时，请选择它们。\n\n"
- fmt: "\nMany fundamental visual QML items like `Rectangle`, `Image`, or `Text` do\
    \ not inherently process mouse or touch input themselves. To make a visual item\
    \ interactive, you typically embed a non-visual `MouseArea` item within it. The\
    \ `MouseArea` detects mouse and touch events occurring within its boundaries and\
    \ provides signals that you can handle. Touch events are generally treated like\
    \ mouse events (e.g., a tap is like a click) by `MouseArea`, simplifying basic\
    \ cross-device input handling common today.\n\n## Key Concepts\n\n1. **Embedding**:\
    \ Place the `MouseArea` inside the visual item you want to make interactive. Often,\
    \ you'll use `anchors.fill: parent` to make the `MouseArea` cover its parent completely.\n\
    2. **Signal Handlers**: QML provides a convenient syntax for handling signals\
    \ directly within an item's definition: `onSignalName: { /* JavaScript code */\
    \ }`. When the signal is emitted, the JavaScript code block is executed.\n3. **Common\
    \ MouseArea Handlers**:\n   - `onClicked: { ... }`: Fired when the primary mouse\
    \ button (usually left) is pressed and released inside the `MouseArea`, or when\
    \ the area is tapped. An argument `mouse` provides details like position (`mouse.x`,\
    \ `mouse.y`) and button (`mouse.button`).\n   - `onPressed: { ... }`: Fired as\
    \ soon as a mouse button is pressed down.\n   - `onReleased: { ... }`: Fired when\
    \ a mouse button is released.\n   - `onPositionChanged: { ... }`: Fired when the\
    \ mouse cursor (or touch point) moves while a button is held down.\n   - `onEntered:\
    \ { ... }`: Fired when the mouse cursor enters the bounds of the `MouseArea`.\
    \ Requires `hoverEnabled` to be `true`.\n   - `onExited: { ... }`: Fired when\
    \ the mouse cursor leaves the bounds of the `MouseArea`. Requires `hoverEnabled`\
    \ to be `true`.\n4. **hoverEnabled Property**: By default, `MouseArea` doesn't\
    \ track mouse movements when no buttons are pressed. To enable hover effects (using\
    \ `onEntered`/`onExited` signals or the `:hover` pseudo-state in selectors if\
    \ using QSS equivalent styling), you must set `hoverEnabled: true`. This has a\
    \ slight performance overhead, so only enable it when needed.\n\n## Example: Let's\
    \ make a `Rectangle` change color when clicked and report hover state.\n\n```qml\n\
    import QtQuick\nimport QtQuick.Window\n\nWindow {\n  width: 300; height: 200\n\
    \  visible: true\n  title: \"MouseArea Example\"\n\n  Rectangle {\n    id: clickableRect\n\
    \    width: 150; height: 100\n    anchors.centerIn: parent\n    color: \"lightblue\"\
    \n    border.color: \"steelblue\"\n    border.width: 2\n\n    Text {\n      id:\
    \ statusText\n      anchors.bottom: parent.bottom; anchors.horizontalCenter: parent.horizontalCenter\n\
    \      anchors.bottomMargin: 5\n      text: \"Hover or Click Me\"\n    }\n\n \
    \   MouseArea {\n      id: mouseArea\n      anchors.fill: parent  // Make MouseArea\
    \ cover the Rectangle\n      hoverEnabled: true  // Enable hover detection\n \
    \     onClicked: {\n        console.log(\"Rectangle clicked at:\", mouse.x, \"\
    ,\", mouse.y);\n        // Change parent's color directly (imperative style)\n\
    \        parent.color = (parent.color == \"lightgreen\") ? \"lightblue\" : \"\
    lightgreen\";\n      }\n      onEntered: {\n        console.log(\"Mouse entered\"\
    );\n        parent.border.color = \"red\"; // Change border color on hover\n \
    \       statusText.text = \"Mouse is inside\";\n      }\n      onExited: {\n \
    \       console.log(\"Mouse exited\");\n        parent.border.color = \"steelblue\"\
    ; // Restore border color\n        statusText.text = \"Hover or Click Me\";\n\
    \      }\n    }\n  }\n}\n```\n\nRun this code. Clicking the rectangle toggles\
    \ its background color, and moving the mouse in and out changes the border color\
    \ and the text label. The `console.log` messages will appear in Qt Creator's application\
    \ output pane.\n\n(Note: While `MouseArea` is fundamental, newer applications\
    \ might use handlers from `QtQuick.InputHandlers` like `TapHandler`, `DragHandler`,\
    \ `HoverHandler` for more complex or specific input scenarios, but `MouseArea`\
    \ covers the basics well.)\n\n## Introduction to QML States: Declarative Visual\
    \ Changes\n\nIn the example above, we changed the rectangle's color and `border.color`\
    \ imperatively inside the JavaScript signal handlers. While this works for simple\
    \ cases, managing many property changes across different interactions can become\
    \ complex. QML States provide a more structured, declarative way to manage different\
    \ visual appearances or configurations of an item.\n\n**Concept**: You define\
    \ named states for an item. Each state specifies the values certain properties\
    \ should have when that state is active. You then simply change the item's `state`\
    \ property, and QML automatically applies the corresponding property values.\n\
    \n### Declaring States\n\n1. **states Property**: Add a `states` list property\
    \ to the item whose appearance you want to manage.\n2. **State Objects**: Inside\
    \ the `states` list, define `State` objects. Each `State` must have a unique `name`\
    \ property (a string). The default state is implicitly named \"\".\n3. **PropertyChanges\
    \ Objects**: Inside each `State`, use one or more `PropertyChanges` objects. A\
    \ `PropertyChanges` object specifies:\n   - `target`: The `id` of the item whose\
    \ properties should change in this state.\n   - **Property Assignments**: A list\
    \ of `property: value` pairs defining the target values for that state.\n\n###\
    \ Switching States\n\nAn item's current state is determined by its `state` property.\
    \ You change the state programmatically, usually in response to an event, by assigning\
    \ the state's name to this property: `targetItem.state = \"newStateName\"`. To\
    \ return to the default visual appearance, set the state back to the empty string:\
    \ `targetItem.state = \"\"`.\n\n## Example Combining MouseArea and States\n\n\
    Let's modify the previous example to use states for the hover effect.\n\n```qml\n\
    import QtQuick\nimport QtQuick.Window\n\nWindow {\n  width: 300; height: 200\n\
    \  visible: true\n  title: \"QML States Example\"\n\n  Rectangle {\n    id: interactiveRect\n\
    \    width: 150; height: 100\n    anchors.centerIn: parent\n    // Default appearance\
    \ (state = \"\")\n    color: \"lightblue\"\n    border.color: \"steelblue\"\n\
    \    border.width: 2\n\n    Text {\n      id: statusText\n      // ... (same as\
    \ before) ...\n      text: \"Hover Me\"\n    }\n\n    MouseArea {\n      id: mouseArea\n\
    \      anchors.fill: parent\n      hoverEnabled: true\n      onClicked: {\n  \
    \      // Still imperative for now, could also be state change\n        parent.color\
    \ = (parent.color == \"lightgreen\") ? \"lightblue\" : \"lightgreen\";\n     \
    \ }\n      // Change state based on hover\n      onEntered: { parent.state = \"\
    hovered\" }\n      onExited: { parent.state = \"\" } // Revert to default state\n\
    \    }\n\n    // Define the states for interactiveRect\n    states: [\n      State\
    \ {\n        name: \"hovered\" // Name of the state\n        PropertyChanges {\n\
    \          target: interactiveRect // Which item's properties change?\n      \
    \    border.color: \"red\" // Property value in this state\n        }\n      \
    \  PropertyChanges { // Can target other items too\n          target: statusText\n\
    \          text: \"Mouse is Hovering!\"\n        }\n      }\n      // Could define\
    \ other states like \"pressed\", \"disabled\" etc.\n    ]\n  }\n}\n```\n\nNow,\
    \ when the mouse enters the `MouseArea`, it sets the `interactiveRect`'s state\
    \ to \"hovered\". QML automatically finds the `State` named \"hovered\" and applies\
    \ the `PropertyChanges` defined within it: the `interactiveRect`'s border color\
    \ becomes red, and the `statusText`'s text changes. When the mouse exits, setting\
    \ the state back to \"\" reverts the properties to their default values defined\
    \ directly on the items.\n\n### Benefits of States\n\n- **Declarative**: Defines\
    \ what the UI looks like in different states, rather than how to change it step-by-step.\n\
    - **Clearer Structure**: Groups related property changes for a specific mode.\n\
    - **Animations/Transitions**: QML `Transition` elements (covered later) can be\
    \ used to define smooth animations that automatically run when the state changes,\
    \ making state transitions visually appealing.\n"
  raw: 'Many fundamental visual QML items like Rectangle, Image, or Text do not inherently
    process mouse or touch input themselves. To make a visual item interactive, you
    typically embed a non-visual MouseArea item within it. The MouseArea detects mouse
    and touch events occurring within its boundaries and provides signals that you
    can handle. Touch events are generally treated like mouse events (e.g., a tap
    is like a click) by MouseArea, simplifying basic cross-device input handling common
    today.


    Key Concepts:


    1.  Embedding: Place the MouseArea inside the visual item you want to make interactive.
    Often, you''ll use anchors.fill: parent to make the MouseArea cover its parent
    completely.


    2.  Signal Handlers: QML provides a convenient syntax for handling signals directly
    within an item''s definition: onSignalName: { /* JavaScript code */ }. When the
    signal is emitted, the JavaScript code block is executed.


    3.  Common MouseArea Handlers:


    ○ onClicked: { ... }: Fired when the primary mouse button (usually left) is pressed
    and released inside the MouseArea, or when the area is tapped. An argument mouse
    provides details like position (mouse.x, mouse.y) and button (mouse.button).


    ○ onPressed: { ... }: Fired as soon as a mouse button is pressed down.


    ○ onReleased: { ... }: Fired when a mouse button is released.


    ○ onPositionChanged: { ... }: Fired when the mouse cursor (or touch point) moves
    while a button is held down.


    ○ onEntered: { ... }: Fired when the mouse cursor enters the bounds of the MouseArea.
    Requires hoverEnabled to be true.


    ○ onExited: { ... }: Fired when the mouse cursor leaves the bounds of the MouseArea.
    Requires hoverEnabled to be true.


    4.  hoverEnabled Property: By default, MouseArea doesn''t track mouse movements
    when no buttons are pressed. To enable hover effects (using onEntered/onExited
    signals or the :hover pseudo-state in selectors if using QSS equivalent styling),
    you must set hoverEnabled: true. This has a slight performance overhead, so only
    enable it when needed.


    Example: Let''s make a Rectangle change color when clicked and report hover state.


    QML


    import QtQuick


    import QtQuick.Window


    Window {


    width: 300; height: 200


    visible: true


    title: "MouseArea Example"


    Rectangle {


    id: clickableRect


    width: 150; height: 100


    anchors.centerIn: parent


    color: "lightblue"


    border.color: "steelblue"


    border.width: 2


    Text {


    id: statusText


    anchors.bottom: parent.bottom; anchors.horizontalCenter: parent.horizontalCenter


    anchors.bottomMargin: 5


    text: "Hover or Click Me"


    }


    MouseArea {


    id: mouseArea


    anchors.fill: parent  // Make MouseArea cover the Rectangle


    hoverEnabled: true  // Enable hover detection


    onClicked: {


    console.log("Rectangle clicked at:", mouse.x, ",", mouse.y);


    // Change parent''s color directly (imperative style)


    parent.color = (parent.color == "lightgreen") ? "lightblue" : "lightgreen";


    }


    onEntered: {


    console.log("Mouse entered");


    parent.border.color = "red"; // Change border color on hover


    statusText.text = "Mouse is inside";


    }


    onExited: {


    console.log("Mouse exited");


    parent.border.color = "steelblue"; // Restore border color


    statusText.text = "Hover or Click Me";


    }


    }


    }


    }


    Run this code. Clicking the rectangle toggles its background color, and moving
    the mouse in and out changes the border color and the text label. The console.log
    messages will appear in Qt Creator''s application output pane.


    (Note: While MouseArea is fundamental, newer applications might use handlers from
    QtQuick.InputHandlers like TapHandler, DragHandler, HoverHandler for more complex
    or specific input scenarios, but MouseArea covers the basics well.)


    Introduction to QML States: Declarative Visual Changes


    In the example above, we changed the rectangle''s color and border.color imperatively
    inside the JavaScript signal handlers. While this works for simple cases, managing
    many property changes across different interactions can become complex. QML States
    provide a more structured, declarative way to manage different visual appearances
    or configurations of an item.


    Concept: You define named states for an item. Each state specifies the values
    certain properties should have when that state is active. You then simply change
    the item''s state property, and QML automatically applies the corresponding property
    values.


    Declaring States:


    1.  states Property: Add a states list property to the item whose appearance you
    want to manage.


    2.  State Objects: Inside the states list, define State objects. Each State must
    have a unique name property (a string). The default state is implicitly named
    "".


    3.  PropertyChanges Objects: Inside each State, use one or more PropertyChanges
    objects. A PropertyChanges object specifies:


    ○ target: The id of the item whose properties should change in this state.


    ○ Property Assignments: A list of property: value pairs defining the target values
    for that state.


    Switching States:


    An item''s current state is determined by its state property. You change the state
    programmatically, usually in response to an event, by assigning the state''s name
    to this property: targetItem.state = "newStateName". To return to the default
    visual appearance, set the state back to the empty string: targetItem.state =
    "".


    Example Combining MouseArea and States:


    Let''s modify the previous example to use states for the hover effect.


    QML


    import QtQuick


    import QtQuick.Window


    Window {


    width: 300; height: 200


    visible: true


    title: "QML States Example"


    Rectangle {


    id: interactiveRect  // Target for PropertyChanges


    width: 150; height: 100


    anchors.centerIn: parent


    // Default appearance (state = "")


    color: "lightblue"


    border.color: "steelblue"


    border.width: 2


    Text {


    id: statusText


    // ... (same as before) ...


    text: "Hover Me"


    }


    MouseArea {


    id: mouseArea


    anchors.fill: parent


    hoverEnabled: true


    onClicked: {


    // Still imperative for now, could also be a state change


    parent.color = (parent.color == "lightgreen") ? "lightblue" : "lightgreen";


    }


    // Change state based on hover


    onEntered: { parent.state = "hovered" }


    onExited: { parent.state = "" } // Revert to default state


    }


    // Define the states for interactiveRect


    states: [


    State {


    name: "hovered"  // Name of the state


    PropertyChanges {


    target: interactiveRect // Which item''s properties change?


    border.color: "red"    // Property value in this state


    // color: "skyblue" // Could change other properties too


    }


    PropertyChanges { // Can target other items too


    target: statusText


    text: "Mouse is Hovering!"


    }


    }


    // Could define other states like "pressed", "disabled" etc.


    ]


    }


    }


    Now, when the mouse enters the MouseArea, it sets the interactiveRect''s state
    to "hovered". QML automatically finds the State named "hovered" and applies the
    PropertyChanges defined within it: the interactiveRect''s border color becomes
    red, and the statusText''s text changes. When the mouse exits, setting the state
    back to "" reverts the properties to their default values defined directly on
    the items.


    Benefits of States:


    ● Declarative: Defines what the UI looks like in different states, rather than
    how to change it step-by-step.


    ● Clearer Structure: Groups related property changes for a specific mode.


    ● Animations/Transitions: QML Transition elements (covered later) can be used
    to define smooth animations that automatically run when the state changes, making
    state transitions visually appealing.'
