  trans: "\n\n无论你是在与在线服务交互——例如从欧盟门户网站获取开放数据、访问法兰克福常见的金融 API、消耗天气数据，或与你自己的应用程序后端通信——还是仅仅需要一种比基础键值对更灵活的结构化方式来存储应用程序配置，你几乎都会遇到\
    \ JSON。它简单的基于文本的格式基于 JavaScript 对象字面量，但与语言无关，使得人类和机器都易于读写。\n\nQt Core 提供了一系列专门用于高效解析和操作\
    \ JSON 数据的类，消除了处理基础 JSON 时对外部库的需求。\n\n## Qt 的 JSON 类\n\n你将主要使用的类有：\n\n1. `QJsonValue`：代表\
    \ JSON 结构中的单个值。`QJsonValue` 可以持有多种类型之一：Null（空）、Bool（真/假）、Double（技术上， JSON 中的所有数字都是\
    \ double）、String（字符串）、Array（数组）或 Object（对象）。它的作用非常像 `QVariant`，但专门针对 JSON 类型设计。你将使用\
    \ `isString()`、`isArray()`、`toBool()`、`toString()`、`toArray()`、`toObject()` 等函数来检查类型并转换值。\n\
    \n2. `QJsonArray`：代表 JSON 数组（`[...]`）。它包含一个有序的 `QJsonValues` 列表。你可以通过索引访问元素，对其进行迭代并添加/删除值。它在概念上类似于\
    \ `QVariantList` 或 `QList<QJsonValue>`。\n\n3. `QJsonObject`：代表 JSON 对象（`{...}`）。它包含一个无序的键值对集合，其中键总是字符串（`QString`），值是\
    \ `QJsonValues`。你可以通过键访问值、检查键是否存在并遍历键。它在概念上类似于 `QVariantMap` 或 `QMap<QString,\
    \ QJsonValue>`。\n\n4. `QJsonDocument`：代表一个完整的 JSON 文档。它的主要作用是将原始 JSON 数据（通常来自\
    \ `QByteArray`）解析为 `QJsonObject` 或 `QJsonArray` 根元素，反之，将 `QJsonObject` 或 `QJsonArray`\
    \ 转换回适用于写入文件或通过网络发送的格式化 `QByteArray`。\n\n## 解析 JSON 数据（读取 JSON）\n\nJSON 数据通常以字节序列的形式到达，通常存储在\
    \ `QByteArray` 中（例如来自 `QNetworkReply` 或 `QFile`）。解析涉及将这些原始数据转换为 Qt 的 JSON 对象表示。\n\
    \n1. 解析 `QByteArray`：使用静态函数 `QJsonDocument::fromJson()`。它接收包含 JSON 数据的 `QByteArray`\
    \ 以及一个可选的 `QJsonParseError` 对象指针，用于报告任何语法错误。始终检查解析错误。\n\n```cpp\n#include <QJsonDocument>\n\
    #include <QJsonObject>\n#include <QJsonArray>\n#include <QJsonParseError>\n#include\
    \ <QByteArray>\n#include <QDebug>\n\nQByteArray jsonData = /* ... 从网络响应或文件获取 ...\
    \ */;\n\nQJsonParseError parseError;\nQJsonDocument jsonDoc = QJsonDocument::fromJson(jsonData,\
    \ &parseError);\n\nif (parseError.error != QJsonParseError::NoError) {\n    qWarning()\
    \ << \"解析 JSON 失败:\" << parseError.errorString()\n    << \"偏移位置:\" << parseError.offset;\n\
    \    return; // 或者适当处理错误\n}\n```\n\n2. 检查并获取根元素：有效的 JSON 文档必须以对象或数组作为根元素。使用 `isObject()`\
    \ 或 `isArray()` 检查你拥有的是哪一个，并使用 `object()` 或 `array()` 获取它。\n\n```cpp\nQJsonObject\
    \ rootObject;\nQJsonArray rootArray;\n\nif (jsonDoc.isObject()) {\n    rootObject\
    \ = jsonDoc.object();\n    qDebug() << \"JSON 文档是一个对象。\";\n    // 继续从 rootObject\
    \ 访问数据...\n} else if (jsonDoc.isArray()) {\n    rootArray = jsonDoc.array();\n\
    \    qDebug() << \"JSON 文档是一个数组。\";\n    // 继续从 rootArray 访问数据...\n} else {\n\
    \    qWarning() << \"JSON 文档既不是对象不是数组。\";\n    return;\n}\n```\n\n## 访问 JSON 结构中的数据\n\
    \n一旦获得了根对象或数组，就可以导航结构：\n\n- **访问 QJsonObject 值**：使用 `operator[]` 或更安全的 `value()`\
    \ 方法（如果键不存在，则返回空 `QJsonValue`）。在使用 `toString()`、`toDouble()`、`toObject()`、`toArray()`、`toBool()`\
    \ 进行转换之前，始终检查类型（`isString`、`isDouble`、`isObject`、`isArray`、`isBool`、`isNull`）。为转换函数提供默认值以增强健壮性（例如\
    \ `toInt(0)`）。\n\n```cpp\nif (rootObject.contains(\"userName\") && rootObject[\"\
    userName\"].isString()) {\n    QString name = rootObject[\"userName\"].toString();\n\
    \    qDebug() << \"用户名:\" << name;\n}\n\ndouble score = rootObject.value(\"score\"\
    ).toDouble(0.0); // 提供默认值\nQJsonObject details = rootObject[\"details\"].toObject();\
    \ // 假设 'details' 存在且是一个对象\n```\n\n- **访问 QJsonArray 值**：使用带有索引的 `operator[]`\
    \ 或 `at()`。检查数组边界（`index < jsonArray.size()`）。使用范围 for 循环进行迭代。像处理 `QJsonObject`\
    \ 一样检查并转换值。\n\n```cpp\nif (jsonDoc.isArray()) { // 假设根是一个对象数组\n    QJsonArray\
    \ users = jsonDoc.array();\n    for (const QJsonValue &userValue : users) {\n\
    \        if (userValue.isObject()) {\n            QJsonObject user = userValue.toObject();\n\
    \            qDebug() << \"用户:\" << user[\"id\"].toInt() << user[\"name\"].toString();\n\
    \        }\n    }\n    if (users.size() > 0 && users[0].isObject()) {\n      \
    \  qDebug() << \"第一个用户的邮箱:\" << users[0].toObject()[\"email\"].toString();\n \
    \   }\n}\n```\n\n- **嵌套结构**：链式调用访问器：`QString street = rootObject[\"address\"].toObject()[\"\
    street\"];`\n\n## 创建 JSON 数据（写入 JSON）\n\n你也可以通过 `QJsonObject` 和 `QJsonArray` 构建\
    \ JSON：\n\n1. **构建对象/数组**：创建实例并填充它们。赋值的值会被隐转换为 `QJsonValue`。\n\n```cpp\nQJsonObject\
    \ contact;\ncontact[\"name\"] = \"Max Mustermann\";\ncontact[\"city\"] = \"Frankfurt\"\
    ;\ncontact[\"age\"] = 35;\ncontact[\"active\"] = true;\n\nQJsonArray phoneNumbers;\n\
    phoneNumbers.append(\"+49 69 123456\");\nphoneNumbers.append(\"+49 170 987654\"\
    );\ncontact[\"phones\"] = phoneNumbers; // 将数组作为赋值\n```\n\n2. **创建 QJsonDocument**：将你的根对象或数组封装在\
    \ `QJsonDocument` 中。\n\n```cpp\nQJsonDocument contactDoc(contact);\n```\n\n3.\
    \ **转换为 QByteArray**：使用 `toJson()` 方法将文档序列化为字节。你可以选择紧凑或缩进格式。\n\n```cpp\nQByteArray\
    \ jsonDataCompact = contactDoc.toJson(QJsonDocument::Compact);\nQByteArray jsonDataIndented\
    \ = contactDoc.toJson(QJsonDocument::Indented); // 人类可读\n\nqDebug() << \"紧凑 JSON:\"\
    \ << jsonDataCompact;\nqDebug() << \"缩进 JSON:\" << jsonDataIndented;\n```\n\n\
    4. 该 `QByteArray` 然后可以发送到 `QNetworkRequest`（例如通过 `manager->post()`）或使用 `QFile`\
    \ 保存到文件中。\n\n"
- fmt: "\n# Introduction to Multithreading (`QThread`, `QtConcurrent`)\n\nOne of the\
    \ most common and jarring problems in GUI applications occurs when the interface\
    \ freezes, becoming unresponsive to user input – clicks don't register, the window\
    \ might grey out, and the operating system may even display a \"Not Responding\"\
    \ message. This typically happens because the application's main thread (also\
    \ known as the GUI thread) is busy performing a long-running operation and cannot\
    \ process user input events or repaint requests from the event loop.\n\nIn today's\
    \ world (2025), users expect applications to remain fluid and interactive at all\
    \ times. Whether it's performing complex calculations, accessing slow network\
    \ resources, performing extensive disk I/O, or processing large datasets – tasks\
    \ common in the demanding business, financial, or industrial applications often\
    \ developed or used in places like Frankfurt – these operations must not block\
    \ the main thread. The standard solution is multithreading: delegating time-consuming\
    \ work to one or more background threads, allowing the main GUI thread to continue\
    \ processing events and keep the UI responsive. Qt provides robust support for\
    \ multithreading through several mechanisms.\n\n## Qt Threading Approaches\n\n\
    We'll focus on two primary high-level approaches provided by Qt:\n\n1. `QThread`\
    \ with the Worker-Object Pattern: A flexible approach involving explicit thread\
    \ management and signal-slot communication.\n2. `QtConcurrent` Framework: A higher-level\
    \ API for running functions in a managed thread pool, often simplifying common\
    \ background task scenarios.\n\n## The Worker-Object Pattern with QThread\n\n\
    While `QThread` is Qt's fundamental class for managing threads, a common misconception\
    \ is that you should subclass `QThread` and put your lengthy task logic inside\
    \ a reimplemented `run()` method. This approach is generally discouraged in modern\
    \ Qt development because it complicates object lifetimes and makes standard signal/slot\
    \ communication with the thread more difficult.\n\nThe recommended, safer, and\
    \ more flexible pattern involves separating the thread management (`QThread`)\
    \ from the task logic (a \"Worker\" QObject):\n\n1. **Create the Worker**: Define\
    \ a new class that inherits directly from `QObject` (not `QThread`). Implement\
    \ the long-running task logic within one or more public slots or regular methods\
    \ in this Worker class. Define signals in the Worker (e.g., `progressUpdated(int)`,\
    \ `resultReady(QString)`, `workFinished()`) to communicate status and results\
    \ back to the main thread.\n\n```cpp\n// worker.h\n#include <QObject>\n#include\
    \ <QString>\n\nclass Worker : public QObject {\nQ_OBJECT\npublic:\n    explicit\
    \ Worker(QObject *parent = nullptr);\npublic slots:\n    void doLongTask(const\
    \ QString &input); // Slot to trigger the work\nsignals:\n    void resultReady(const\
    \ QString &result);\n    void progressUpdated(int percentage);\n    void workFinished();\
    \ // Signal completion\n    // No reimplementation of run() needed here!\n};\n\
    ```\n\n2. **Instantiate and Move**: In your main thread code (e.g., `MainWindow`\
    \ or a controller class), create instances of both your `Worker` and `QThread`.\
    \ Crucially, move the Worker object to the newly created `QThread` using `moveToThread()`.\n\
    \n```cpp\n// In mainwindow.cpp or similar\n#include \"worker.h\"\n#include <QThread>\n\
    \n// ... Inside MainWindow constructor or setup function ...\nQThread* thread\
    \ = new QThread;\nWorker* worker = new Worker; // Create worker with no parent\
    \ initially\nworker->moveToThread(thread); // Worker's slots will now run in 'thread'\n\
    ```\n\n3. **Connect Signals and Slots (Cross-Thread)**: Use `QObject::connect`\
    \ to establish communication before starting the thread. Qt's signal/slot mechanism\
    \ automatically handles thread safety using Queued Connections when connecting\
    \ objects living in different threads.\n\n```cpp\n// Connect signal to trigger\
    \ work in the worker thread\nconnect(this, &MainWindow::startTaskSignal, worker,\
    \ &Worker::doLongTask);\n\n// Connect worker signals back to main thread slots\
    \ (e.g., for UI updates)\nconnect(worker, &Worker::resultReady, this, &MainWindow::handleResults);\n\
    connect(worker, &Worker::progressUpdated, this, &MainWindow::updateProgressBar);\n\
    \n// Connect signals for thread management and cleanup\nconnect(worker, &Worker::workFinished,\
    \ thread, &QThread::quit);\n\n// Optional: Clean up worker and thread when thread\
    \ finishes\nconnect(thread, &QThread::finished, worker, &QObject::deleteLater);\n\
    connect(thread, &QThread::finished, thread, &QObject::deleteLater);\n```\n\n4.\
    \ **Start the Thread**: Call `thread->start()`. This starts the thread's event\
    \ loop (if needed by the worker, though often not strictly necessary if the worker\
    \ just performs a blocking task in its slot).\n\n5. **Trigger the Work**: Emit\
    \ the signal from the main thread that's connected to the worker's slot.\n\n```cpp\n\
    emit startTaskSignal(\"Data to process\"); // Worker::doLongTask will now run\
    \ in the background thread\n```\n\nThis pattern keeps the task logic encapsulated\
    \ in the Worker class and uses the standard signal/slot mechanism for safe, asynchronous\
    \ communication between the main thread and the background thread.\n\n## QtConcurrent:\
    \ High-Level Concurrency Framework\n\nFor less complex background tasks, particularly\
    \ running a single function or parallelizing computations across available CPU\
    \ cores, the `QtConcurrent` namespace provides higher-level functions that often\
    \ eliminate the need for manual `QThread` management. It utilizes a global, managed\
    \ `QThreadPool`.\n\n### Using `QtConcurrent::run()`:\n\nThis function is the workhorse\
    \ for running a function in a background thread from the pool.\n\n1. **Call `run()`**:\
    \ Pass the function to execute (free function, static method, lambda, or member\
    \ function bound using `std::bind` or a lambda) and its arguments. It immediately\
    \ returns a `QFuture<T>` object, where `T` is the return type of your function.\n\
    \n```cpp\n#include <QtConcurrent>\n#include <QFuture>\n#include <QString>\n\n\
    // Assume this function might block or take time\nQString processUserData(int\
    \ userId) {\n    // ... potentially long computation or I/O ...\n    QString result\
    \ = \"Processed data for user \" + QString::number(userId);\n    QThread::sleep(2);\
    \ // Simulate work\n    return result;\n}\n\n// In main thread code:\nint idToProcess\
    \ = 123;\nQFuture<QString> futureResult = QtConcurrent::run(processUserData, idToProcess);\n\
    // --- UI remains responsive here ---\n```\n\n2. **Get Result Asynchronously (Recommended)**:\
    \ The `QFuture` represents the eventual result. To get the result without blocking\
    \ the main thread, use `QFutureWatcher<T>`:\n\n```cpp\n#include <QFutureWatcher>\n\
    #include <QLabel> // For UI update example\n\n// ... inside a class method ...\n\
    QFutureWatcher<QString> *watcher = new QFutureWatcher<QString>(this);\n\n// Connect\
    \ the watcher's finished signal to a slot/lambda in the main thread\nconnect(watcher,\
    \ &QFutureWatcher<QString>::finished, this, [=]() {\n    QString result = watcher->result();\
    \ // Get result - safe now as task is finished\n    qDebug() << \"QtConcurrent\
    \ task finished. Result:\" << result;\n    statusLabel->setText(result); // Update\
    \ UI safely from main thread\n    watcher->deleteLater(); // Clean up the watcher\n\
    });\n\nwatcher->setFuture(futureResult); // Tell watcher to monitor the future\n\
    statusLabel->setText(\"Processing user \" + QString::number(idToProcess) + \"\
    ...\");\n```\n\n3. **Avoid Blocking**: While `QFuture` has methods like `waitForFinished()`\
    \ and `result()` that block until the task completes, never call these directly\
    \ on the main GUI thread, as it defeats the purpose of using a background thread\
    \ and will freeze your UI.\n\n4. **Map/Filter/Reduce**: `QtConcurrent` also offers\
    \ functions like `map`, `filter`, and `mappedReduced` designed to automatically\
    \ parallelize operations across items in a container using the thread pool, which\
    \ can significantly speed up computations on multi-core processors.\n\n## Choosing\
    \ Between QThread and QtConcurrent\n"
  raw: 'Introduction to Multithreading (`QThread`, `QtConcurrent`)


    * * *


    One of the most common and jarring problems in GUI applications occurs when the
    interface freezes, becoming unresponsive to user input – clicks don''t register,
    the window might grey out, and the operating system may even display a "Not Responding"
    message. This typically happens because the application''s main thread (also known
    as the GUI thread) is busy performing a long-running operation and cannot process
    user input events or repaint requests from the event loop.


    In today''s world (2025), users expect applications to remain fluid and interactive
    at all times. Whether it''s performing complex calculations, accessing slow network
    resources, performing extensive disk I/O, or processing large datasets – tasks
    common in the demanding business, financial, or industrial applications often
    developed or used in places like Frankfurt – these operations must not block the
    main thread. The standard solution is multithreading: delegating time-consuming
    work to one or more background threads, allowing the main GUI thread to continue
    processing events and keep the UI responsive. Qt provides robust support for multithreading
    through several mechanisms.


    Qt Threading Approaches


    We''ll focus on two primary high-level approaches provided by Qt:


    1.  QThread with the Worker-Object Pattern: A flexible approach involving explicit
    thread management and signal-slot communication.


    2.  QtConcurrent Framework: A higher-level API for running functions in a managed
    thread pool, often simplifying common background task scenarios.


    The Worker-Object Pattern with QThread


    While QThread is Qt''s fundamental class for managing threads, a common misconception
    is that you should subclass QThread and put your lengthy task logic inside a reimplemented
    run() method. This approach is generally discouraged in modern Qt development
    because it complicates object lifetimes and makes standard signal/slot communication
    with the thread more difficult.


    The recommended, safer, and more flexible pattern involves separating the thread
    management (QThread) from the task logic (a "Worker" QObject):


    1.  Create the Worker: Define a new class that inherits directly from QObject
    (not QThread). Implement the long-running task logic within one or more public
    slots or regular methods in this Worker class. Define signals in the Worker (e.g.,
    progressUpdated(int), resultReady(QString), workFinished()) to communicate status
    and results back to the main thread.


    C++


    // worker.h


    #include <QObject>


    #include <QString>


    class Worker :  public QObject {


    Q_OBJECT


    public:


    explicit  Worker(QObject *parent = nullptr);


    public slots:


    void  doLongTask(const QString &input); // Slot to trigger the work


    signals:


    void  resultReady(const QString &result);


    void  progressUpdated(int percentage);


    void  workFinished(); // Signal completion


    // No reimplementation of run() needed here!


    };


    2.  Instantiate and Move: In your main thread code (e.g., MainWindow or a controller
    class), create instances of both your Worker and QThread. Crucially, move the
    Worker object to the newly created QThread using moveToThread().


    C++


    // In mainwindow.cpp or similar


    #include "worker.h"


    #include <QThread>


    // ... Inside MainWindow constructor or setup function ...


    QThread* thread = new QThread;


    Worker* worker = new Worker; // Create worker with no parent initially


    worker->moveToThread(thread); // Worker''s slots will now run in ''thread''


    3.  Connect Signals and Slots (Cross-Thread): Use QObject::connect to establish
    communication before starting the thread. Qt''s signal/slot mechanism automatically
    handles thread safety using Queued Connections when connecting objects living
    in different threads.


    C++


    // Connect signal to trigger work in the worker thread


    connect(this, &MainWindow::startTaskSignal, worker, &Worker::doLongTask);


    // Connect worker signals back to main thread slots (e.g., for UI updates)


    connect(worker, &Worker::resultReady, this, &MainWindow::handleResults);


    connect(worker, &Worker::progressUpdated, this, &MainWindow::updateProgressBar);


    // Connect signals for thread management and cleanup


    connect(worker, &Worker::workFinished, thread, &QThread::quit);


    // Optional: Clean up worker and thread when thread finishes


    connect(thread, &QThread::finished, worker, &QObject::deleteLater);


    connect(thread, &QThread::finished, thread, &QObject::deleteLater);


    4.  Start the Thread: Call thread->start(). This starts the thread''s event loop
    (if needed by the worker, though often not strictly necessary if the worker just
    performs a blocking task in its slot).


    5.  Trigger the Work: Emit the signal from the main thread that''s connected to
    the worker''s slot.


    C++


    emit startTaskSignal("Data to process"); // Worker::doLongTask will now run in
    the background thread


    This pattern keeps the task logic encapsulated in the Worker class and uses the
    standard signal/slot mechanism for safe, asynchronous communication between the
    main thread and the background thread.


    QtConcurrent: High-Level Concurrency Framework


    For less complex background tasks, particularly running a single function or parallelizing
    computations across available CPU cores, the QtConcurrent namespace provides higher-level
    functions that often eliminate the need for manual QThread management. It utilizes
    a global, managed QThreadPool.


    Using QtConcurrent::run():


    This function is the workhorse for running a function in a background thread from
    the pool.


    1.  Call run(): Pass the function to execute (free function, static method, lambda,
    or member function bound using std::bind or a lambda) and its arguments. It immediately
    returns a QFuture<T> object, where T is the return type of your function.


    C++


    #include <QtConcurrent>


    #include <QFuture>


    #include <QString>


    // Assume this function might block or take time


    QString processUserData(int userId) {


    // ... potentially long computation or blocking I/O ...


    QString result = "Processed data for user " + QString::number(userId);


    QThread::sleep(2); // Simulate work


    return result;


    }


    // In main thread code:


    int idToProcess = 123;


    QFuture<QString> futureResult = QtConcurrent::run(&processUserData, idToProcess);


    // --- UI remains responsive here ---


    2.  Get Result Asynchronously (Recommended): The QFuture represents the eventual
    result. To get the result without blocking the main thread, use QFutureWatcher<T>:


    C++


    #include <QFutureWatcher>


    #include <QLabel> // For UI update example


    // ... inside a class method ...


    QFutureWatcher<QString> *watcher = new QFutureWatcher<QString>(this);


    // Connect the watcher''s finished signal to a slot/lambda in the main thread


    connect(watcher, &QFutureWatcher<QString>::finished, this, [=]() {


    QString result = watcher->result(); // Get result - safe now as task is finished


    qDebug() << "QtConcurrent task finished. Result:" << result;


    statusLabel->setText(result); // Update UI safely from main thread


    watcher->deleteLater(); // Clean up the watcher


    });


    watcher->setFuture(futureResult); // Tell watcher to monitor the future


    statusLabel->setText("Processing user " + QString::number(idToProcess) + "...");


    3.  The watcher''s finished signal is emitted in the main thread (where the watcher
    object lives), allowing safe UI updates.


    4.  Avoid Blocking: While QFuture has methods like waitForFinished() and result()
    that block until the task completes, never call these directly on the main GUI
    thread, as it defeats the purpose of using a background thread and will freeze
    your UI.


    Map/Filter/Reduce: QtConcurrent also offers functions like map, filter, and mappedReduced
    designed to automatically parallelize operations across items in a container using
    the thread pool, which can significantly speed up computations on multi-core processors.


    Choosing Between QThread and QtConcurrent'
