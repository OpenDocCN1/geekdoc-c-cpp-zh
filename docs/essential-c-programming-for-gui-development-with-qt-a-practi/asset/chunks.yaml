  trans: "\n\n```cpp\n// 在显示自定义对话框的代码中（例如 MyMainWindow）\n\n#include \"logindialog.h\"\
    \ // 你的自定义对话框头\n\nvoid MyMainWindow::showLoginDialog() {\n    LoginDialog dialog(this);\
    \ // 创建实例，'this' 是父对象\n\n    if (dialog.exec() == QDialog::Accepted) {\n     \
    \   // 对话框被接受（例如点击了 OK）\n        QString username = dialog.username(); // 自定义\
    \ getter 函数\n        QString password = dialog.password(); // 自定义 getter 函数\n\
    \        attemptLogin(username, password);\n    } else {\n        // 对话框被拒绝（例如点击了取消或关闭）\n\
    \        qDebug() << \"Login cancelled.\";\n    }\n}\n```\n\n# 重新回顾中心部件 (Central\
    \ Widget)\n\n请记住，`QMainWindow` 提供了框架（菜单、工具栏等），但主应用程序的内容位于通过 `setCentralWidget()`\
    \ 设置的单个部件中。这个中心部件通常是你应用最复杂布局的地方，这些布局包含了应用程序的核心交互元素。\n\n`QMainWindow` 为主应用程序窗口提供了标准结构，集成了菜单、工具栏、停靠部件（dock\
    \ widgets）、状态栏和中心内容区域。`QDialog` 是创建辅助交互窗口的基础，它可以是模态的（`exec()`）或非模态的（`show()`）。`QAction`\
    \ 是定义菜单和工具栏中可重用命令的基础。Qt 还提供了方便的标准对话框（`QMessageBox`、`QFileDialog` 等）用于常用任务，而自定义对话框允许定制用户输入。通过将这些顶层窗口与之前讨论的布局和核心部件相结合，你可以使用\
    \ `Qt Widgets` 构建结构良好、功能全图形应用程序。\n\n# 第 5 章：自定义与视觉效果\n\n## 子化现有部件并使用 `QPainter`\
    \ 绘图\n\nQt 内置的部件库非常全面，涵盖了大多数常用的用户界面元素。然而，应用程序通常需要特殊的控件来独特地展示信息、提供新颖的交互，或者简单是将标准部件的重复模式封装成可重用的组件。创建自定义部件允许你扩展\
    \ Qt 的功能，并根据你的需求精确定制应用程序的界面。在 `QtWidgets` 模块中，创建自定义部件有两种主要策略。\n\n## 方法 1：组合 (Composition)\
    \ - 子化并组合现有部件\n\n这种方法本质上是利用较小的、标准的 Qt 部件构建一个更大的、专门的部件。你创建一个继承自 `QWidget` 的新类（如果需要如可见边框等功能，有时也会继承更具体的类，如\
    \ `QFrame`），并使用布局管理内部的子部件。\n\n**概念：** 把它想象成用积木搭建。你的自定义部件充当容器，持有并排列标准的 Qt 部件（如\
    \ `QLabel`、`QLineEdit`、`QPushButton`、`QSlider` 等），创建一个具有自身特定界面和行为的复合控件。\n\n**使用场景：**此方法在以下情况下非常理想：\n\
    * 你需要将几个总是一起出现的标准部件组合在一起（例如，滑块旁边的标签，带有浏览按钮的行编辑器）。\n* 你想创建一个由标准部分构建的具有定义接口（信号、槽、属性）的可重用组件。\n\
    * 你想维护底层标准部件的外观、触感和可访问性（accessibility features）特性。\n\n**实现步骤：**\n\n1. **子化 `QWidget`**：创建一个继承自\
    \ `QWidget` 的新类。\n2. **添加 `Q_OBJECT` 宏**：如果你的自定义部件需要自己的信号、槽或属性来与外部通信，请包含此宏。\n\
    3. **创建子部件**：在你的自定义部件类的构造函数中，创建你需要的标准部件实例（例如 `QLabel`、`QSlider`）。将此作为父对象传递，以确保在自定义部件被删除时进行正确的对象生命周期管理。\n\
    4. **创建并应用布局**：实例化合适的布局管理器（`QHBoxLayout`、`QVBoxLayout`、`QGridLayout` 等）。将你的子部件添加到此布局布局中。最后，调用\
    \ `this->setLayout(yourLayout);` 将布局安装到你的自定义部件上。现在，布局将管理自定义部件边界内子部件的几何形状。\n5.\
    \ **定义接口**：暴露必要的功能。这通常涉及：\n    * 创建公共槽，允许外部代码控制内部部件的状态。\n    * 当部件内部发生重大事件时（例如值变化），发射自定义信号。你可能将内部部件的信号（如\
    \ `QSlider` 的 `valueChanged`）连接到自定义部件中的私有槽，然后由该槽发射你自定义的、更高级别的信号。\n    * 定义映射到内部部件相关状态的属性（`Q_PROPERTY`）。\n\
    \n**示例想法（LabeledSlider）：** 想象一个水平组合 `QLabel` 和 `QSlider` 的部件。\n* 继承 `QWidget`。\n\
    * 构造函数创建 `m_label = new QLabel(this);` 和 `m_slider = new QSlider(Qt::Horizontal,\
    \ this);`。\n* 创建 `QHBoxLayout`，添加 `m_label`，然后添加 `m_slider`。\n* 调用 `setLayout(layout);`。\n\
    * 为值添加 `Q_PROPERTY`，带有 `READ (value())`、`WRITE (setValue(int))`、`NOTIFY (valueChanged(int))`。\n\
    * 实现 `value()` 返回 `m_slider->value()`。\n* 实现 `setValue(int)` 调用 `m_slider->setValue(val)`。\n\
    * 将 `m_slider->valueChanged` 信号连接到私有槽 `onSliderValueChanged(int)`。\n* 在 `onSliderValueChanged`\
    \ 中，可能更新标签（`m_label->setNum(val)`）并发射 `valueChanged(val);`。\n\n这种组合方法对于通过利用现有的\
    \ Qt 构建块快速创建可重用的 UI 组件非常强大。\n\n## 方法 2：使用 `QPainter` 自定义绘图\n\n当你需要一个具有独特视觉外观或无法通过组合标准部件或样式来实现图形表示的部件时，你需要控制绘制过程。这涉及子化\
    \ `QWidget`（或其他合适的基类）并使用 `QPainter` 重实现 `paintEvent` 函数。\n\n**概念：** 不要依赖子部件或样式表，而是提供\
    \ C++ 代码来显式绘制线条、形状、像素或文本，以渲染你的部件。\n\n### paintEvent 函数\n* 这是一个继承自 `QWidget` 的保护虚函数。\n\
    * 当你的部件全部或部分需要重绘时，Qt 会调用此函数。这发生在部件首次显示、调整大小、被遮挡后或通过 `update()` 显式调度时。\n* 你必须在子类中重实现此函数以执行自定义绘制。`QPaintEvent*\
    \ event` 参数包含了更新区域的细节，有时可以用于优化，但通常你会在事件处理器中重绘整个部件。\n\n### 使用 QPainter\n`QPainter`\
    \ 是 Qt 多功能的 2D 图形引擎。你在 `paintEvent` 中使用它。\n\n1. **创建 `QPainter`**：`paintEvent`\
    \ 中的第一步通常是在栈上创建一个 `QPainter` 对象，并将 `this`（正在绘制的部件）作为绘制设备传入：\n```cpp\nvoid MyCustomWidget::paintEvent(QPaintEvent\
    \ *event) {\n    QPainter painter(this);\n    // ... 绘制命令在这里 ...\n} // painter\
    \ 离开作用域并自动清理\n```\n\n2. **设置绘制器状态**：`QPainter` 工作像一个状态机。在发出绘制命令之前配置它的绘制参数。关键参数包括：\n\
    \    * **笔 (`QPen`)**：控制线条和轮廓的绘制方式（颜色、宽度、样式如实线、虚线）。使用 `painter.setPen(QPen(Qt::blue,\
    \ 2))` 设置。\n    * **画刷 (`QBrush`)**：控制形状的填充方式（颜色、模式如实色、渐变、纹理）。使用 `painter.setBrush(Qt::red)`\
    \ 或 `painter.setBrush(Qt::NoBrush)` 设置。\n    * **字体 (`QFont`)**：控制文本的外观。使用 `painter.setFont(QFont(\"\
    Arial\", 12))` 设置。\n    * **渲染提示 (Rendering Hints)**：提高绘制质量，特别是形状。对于平滑边缘，`painter.setRenderHint(QPainter::Antialiasing,\
    \ true);` 非常推荐。\n\n3. **绘制**：调用 `QPainter` 的绘制方法，这些方法将使用当前设置的笔、刷和字体。\n\n"
- fmt: "\n- `painter.drawLine(x1, y1, x2, y2);`\n- `painter.drawRect(x, y, width,\
    \ height);` or `drawRect(QRect);`\n- `painter.drawEllipse(x, y, width, height);`\
    \ or `drawEllipse(QRect);`\n- `painter.drawText(x, y, \"Some Text\");` or `drawText(QRect,\
    \ flags, \"Text\");`\n- `painter.drawPixmap(x, y, QPixmap);`\n- And many more\
    \ (arcs, polygons, paths, etc.). Coordinates are typically relative to the widget's\
    \ top-left corner (0,0).\n\n### Triggering Repaints (`update()`)\n\nCrucially,\
    \ you never call `paintEvent` directly. If the state of your widget changes (e.g.,\
    \ a value it displays is modified, its color should change) and it needs to be\
    \ visually updated, you call its `update()` slot. This function notifies Qt that\
    \ the widget needs repainting; Qt will then schedule a `paintEvent` call efficiently,\
    \ often coalescing multiple `update` requests.\n\n### Size Hints\n\nWidgets drawn\
    \ from scratch need to inform Qt's layout system about their preferred size. Reimplement\
    \ these virtual functions:\n\n- `virtual QSize sizeHint() const override;`: Return\
    \ the ideal/preferred size for your widget based on its content or design.\n-\
    \ `virtual QSize minimumSizeHint() const override;`: Return the minimum sensible\
    \ size below which the widget shouldn't shrink. Layout managers use these hints\
    \ to allocate space appropriately.\n\n### Example Idea (ColorCircleWidget)\n\n\
    - Inherit `QWidget`.\n- Add a `QColor` `m_color` member.\n- Add a public slot\
    \ `setColor(const QColor &color)` which updates `m_color` and calls `update()`.\n\
    - Reimplement `paintEvent`: Create `QPainter`, set render hint `Antialiasing`,\
    \ set brush to `m_color`, set pen to `Qt::black` or `Qt::NoPen`. Calculate a rectangle\
    \ fitting within the widget's bounds (`rect()`), potentially making it square,\
    \ and call `painter.drawEllipse(rect)`.\n- Reimplement `sizeHint` to return a\
    \ sensible default size (e.g., `QSize(50, 50)`).\n\n### Choosing the Approach\n\
    \n- Use Composition when you can build your desired widget from existing standard\
    \ Qt widgets. It's faster to develop and leverages existing functionality, styling,\
    \ and accessibility.\n- Use Custom Painting when you need a truly unique visual\
    \ representation (like charts, graphs, custom dials, artistic elements) or specialized\
    \ low-level interaction handling that standard widgets don't provide. It offers\
    \ complete control but requires more implementation effort, including handling\
    \ size hints and potentially mouse/keyboard events manually.\n\nCreating custom\
    \ widgets is a powerful technique in Qt Widgets development. Whether you compose\
    \ existing widgets within a new `QWidget` subclass or dive into custom drawing\
    \ using `QPainter` within the `paintEvent`, you can build precisely the user interface\
    \ components your application requires. Composition offers rapid development by\
    \ reusing standard elements, while `QPainter` provides ultimate control over visual\
    \ appearance for unique graphical representations. Understanding both approaches\
    \ allows you to choose the most effective strategy for each specific UI challenge.\n\
    \n# Styling QtWidgets Applications with Qt Style Sheets (QSS)\n\nBy default, Qt\
    \ Widgets strive to adopt the native look and feel of the underlying operating\
    \ system (Windows, macOS, Linux). This ensures applications feel integrated into\
    \ the user's environment, which might have its own themes and variations (even\
    \ within Germany, different Linux desktop environments or Windows versions present\
    \ different default styles). However, you often want to apply custom branding,\
    \ create a unique visual theme, or simply fine-tune the appearance of specific\
    \ widgets beyond what their basic properties allow. Qt Style Sheets (QSS) provide\
    \ a flexible and declarative mechanism to achieve this.\n\nInspired by Cascading\
    \ Style Sheets (CSS) used in web development, QSS allows you to define rules that\
    \ specify how widgets should be rendered, controlling aspects like colors, borders,\
    \ backgrounds, fonts, padding, and margins. It separates the visual appearance\
    \ from the widget's core functionality.\n\n## QSS Syntax Basics\n\nThe fundamental\
    \ structure of a QSS rule is straightforward and mirrors CSS:\n\n```css\nselector\
    \ {\n  property: value;\n  property2: value2;\n  /* Add more properties as needed\
    \ */\n}\n```\n\n- **Selector**: Determines which widget(s) the rule applies to.\n\
    - **Declaration Block**: Enclosed in curly braces {}, containing one or more property-value\
    \ pairs.\n- **Property-Value Pair**: Specifies a visual attribute (e.g., `background-color`)\
    \ and the value it should take (e.g., `blue`). Pairs end with a semicolon ;.\n\
    - **Comments**: C-style comments `/* comment */` can be used.\n\n### Selectors:\
    \ Targeting Widgets\n\nChoosing the right selector is key to applying styles precisely\
    \ where you want them.\n\n- **Type Selector**: Targets all instances of a specific\
    \ widget class (and its subclasses, unless overridden by a more specific rule).\
    \ This is very common for applying general styles.\n\n```css\nQPushButton { background-color:\
    \ lightgray; border-radius: 5px; }\nQLineEdit { border: 1px solid gray; }\n```\n\
    \n- **Object Name Selector (`#objectName`)**: Targets a single, specific widget\
    \ instance based on its object name, which you set in your C++ code using `widget->setObjectName(\"\
    mySpecialButton\");`. This is highly specific and ideal for unique elements.\n\
    \n```css\nQPushButton#okButton { background-color: green; color: white; }\nQLabel#errorLabel\
    \ { color: red; font-weight: bold; }\n```\n\n- (Note: Unlike CSS's #id, QSS uses\
    \ #objectName).\n- **Class Selector (`.`)**: Used less commonly than Type or Object\
    \ Name, but can target custom classes. Example: `.CustomWidget { border: 2px solid\
    \ orange; }`.\n- **Attribute Selector (`[property=\"value\"]`)**: Targets widgets\
    \ based on properties. Example: `QPushButton[flat=\"true\"] { border: none; }`.\n\
    - **Combinators**: Define relationships between selectors:\n    - **Descendant\
    \ Selector (space)**: `Frame QLabel { color: blue; }` (Styles any `QLabel` that\
    \ is a child, grandchild, etc., of `Frame`).\n    - **Child Selector (`>`)**:\
    \ `Frame > QLabel { font-style: italic; }` (Styles only `QLabel` that are direct\
    \ children of `Frame`).\n- **Pseudo-States (`:`)**: Apply styles conditionally\
    \ based on the widget's state. Essential for interactive feedback.\n    - `:hover`:\
    \ Mouse cursor is over the widget.\n    - `:pressed`: Widget is currently pressed\
    \ (e.g., a button click).\n    - `:checked`: Widget is checked (e.g., `QCheckBox`,\
    \ `QRadioButton`).\n    - `:unchecked`: Widget is not checked.\n    - `:disabled`:\
    \ Widget is disabled (`setEnabled(false)`).\n    - `:enabled`: Widget is enabled.\n\
    \    - `:focus`: Widget has keyboard focus.\n    - `:on`, `:off`: Often used for\
    \ checkable items like `QCheckBox`.\n    - You can chain pseudo-states: `QPushButton:hover:!pressed\
    \ { background-color: #eeeeee; }` (Style when hovered but not pressed).\n\n```css\n\
    QPushButton { background-color: lightblue; border: 1px solid darkblue; }\nQPushButton:hover\
    \ { background-color: skyblue; }\nQPushButton:pressed { background-color: darkblue;\
    \ color: white; }\nQPushButton:disabled { background-color: #cccccc; color: #888888;\
    \ }\n```\n\n- **Sub-Controls (`::`)**: Target specific parts or elements within\
    \ a more complex widget.\n    - `QCheckBox::indicator`: The checkable box itself.\n\
    \    - `QRadioButton::indicator:checked`: The indicator of a checked radio button.\n\
    \    - `QSlider::groove:horizontal`: The groove the slider moves in.\n    - `QSlider::handle:horizontal`:\
    \ The draggable handle.\n    - `QComboBox::drop-down`: The arrow button part.\n\
    \    - `QTabBar::tab`: Individual tabs in a `QTabWidget`.\n    - `QTableView::item:selected`:\
    \ A selected item in a table view.\n\n```css\nQCheckBox::indicator { width: 15px;\
    \ height: 15px; border: 1px solid gray; }\nQCheckBox::indicator:checked { background-color:\
    \ green; image: url(:/icons/checkmark.png); }\nQSlider::handle:horizontal { background:\
    \ qlineargradient(...); border-radius: 5px; width: 10px; }\n```\n\n### Common\
    \ QSS Properties\n\nQSS supports a wide range of properties similar to CSS. Some\
    \ essentials include:\n"
