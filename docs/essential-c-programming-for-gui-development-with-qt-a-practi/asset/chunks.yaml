    Basic File Operations: QFile and QDir


    For handling arbitrary file content (user documents, log files, custom data formats)
    and interacting with the directory structure, Qt provides QFile and QDir.


    QFile: Reading and Writing File Content


    QFile provides an interface for basic I/O operations on individual files.


    1.  Opening: Create a QFile object with the path. Call open() specifying the mode
    (QIODevice::ReadOnly, QIODevice::WriteOnly, QIODevice::ReadWrite, QIODevice::Append).
