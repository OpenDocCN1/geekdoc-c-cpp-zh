    \ height);` 或 `drawRect(QRect);`\n- `painter.drawEllipse(x, y, width, height);`\
    \ 或 `drawEllipse(QRect);`\n- `painter.drawText(x, y, \"Some Text\");` 或 `drawText(QRect,\
    \ flags, \"Text\");`\n- `painter.drawPixmap(x, y, QPixmap);`\n- 以及许多其他（弧、多边形、路径等）。坐标通常相对于小部件的左上角\
    \ (0,0)。\n\n### 触发重绘 (`update()`)\n\n至关重要的一是，你永远不要直接调用 `paintEvent`。如果你的小部件的状态发生了变化（例如，它显示的值被修改了，颜色应该改变），并且需要进行视觉更新，你应该调用它的\
    \ `update()` 槽。此函数通知 Qt 该小部件需要重绘；Qt 然后将高效地调度 `paintEvent` 调用，通常会合并多个 `update`\
    \ 请求。\n\n### 尺寸提示 (Size Hints)\n\n从头开始绘制的小部件需要通知 Qt 的布局系统它们的首选尺寸。重新实现这些虚函数：\n\n\
    - `virtual QSize sizeHint() const override;`: 根据内容或设计为你的小部件返回理想/首选的尺寸。\n- `virtual\
    \ QSize minimumSizeHint() const override;`: 返回一个合理的最小尺寸，小部件不应缩小到该尺寸以下。布局管理器使用这些提示来适当地分配空间。\n\
    \n### 示例思路 (ColorCircleWidget)\n\n- 继承 `QWidget`。\n- 添加一个 `QColor` 成员变量 `m_color`。\n\
    - 添加一个公共槽 `setColor(const QColor &color)`，它可以更新 `m_color` 并调用 `update()`。\n- 重新实现\
    \ `paintEvent`：创建 `QPainter`，设置渲染提示 `Antialiasing`（抗锯齿），将画刷设置为 `m_color`，将画笔设置为\
    \ `Qt::black` 或 `Qt::NoPen`。计算一个适应小部件边界的矩形 (`rect()`)，可能使其成为正方形，并调用 `painter.drawEllipse(rect)`。\n\
    - 重新实现 `sizeHint` 以返回一个合理的默认尺寸（例如 `QSize(50, 50)`）。\n\n### 选择方法\n\n- 使用**组合 (Composition)**：当你能够从现有的标准\
    \ Qt 小部件构建所需的小部件时，使用这种方法。它开发速度更快，并利用了现有的功能、样式和可访问性。\n- 使用**自定义绘制 (Custom Painting)**：当你需要真正独特的视觉表示（如图表、图形、自定义仪表盘、艺术元素）或标准小部件未提供的特殊底层交互处理时，使用这种方法。它提供了完全的控制，但需要更多的实现工作，包括手动处理尺寸提示以及可能的鼠标/键盘事件。\n\
    \n创建自定义小部件是 Qt Widgets 开发中的一项强大技术。无论是在新的 `QWidget` 子类中组合现有的小部件，还是在 `paintEvent`\
    \ 中使用 `QPainter` 进行自定义绘制，你都可以构建出应用程序所需的精确用户界面组件。组合通过重用标准元素实现了快速开发，而 `QPainter`\
    \ 为独特的图形表示提供了对外观的终控制。理解这两种方法允许你针对每个特定的 UI 挑战选择最有效的策略。\n\n# 使用 Qt 样式表 (QSS) 为 QtWidgets\
    \ 应用设置样式\n\n默认情况下，Qt Widgets 努力采用底层操作系统的原生外观和感受（Windows、macOS、Linux）。这确保应用程序感觉像是集成在用户的环境中，而该环境可能有自己的主题和变体（即使在德国，不同的\
    \ Linux 桌面环境或 Windows 版本也呈现不同的默认样式）。然而，你通常希望应用自定义品牌、创建独特的视觉主题，或者简单地超出基本属性允许的范围微调特定小部件的外观。Qt\
    \ 样式表 (QSS) 提供了一种灵活且声明式的机制来实现此目标。\n\nQSS 受 Web 开发中级联样式表 (CSS) 的启发，允许你定义规则来指定如何渲染小部件，控制颜色、边框、背景、字体、内边距和外边距等方面。它将视觉外观与小部件的核心功能分离。\n\
    \n## QSS 语法基础\n\nQSS 规则的基本结构非常简单，并镜像了 CSS：\n\n```css\nselector {\n  property:\
    \ value;\n  property2: value2;\n  /* 根据需要添加更多属性 */\n}\n```\n\n- **选择器 (Selector)**：决定规则适用于哪个小部件（部件）。\n\
    - **声明块 (Declaration Block)**：括在大括号 {} 中，包含一个或多个属性-值对。\n- **属性-值对 (Property-Value\
    \ Pair)**：指定视觉属性（例如 `background-color`）和它应该取的值（例如 `blue`）。键值对以分号 ; 结束。\n- **注释\
    \ (Comments)**：可以使用 C 风格的注释 `/* comment */`。\n\n### 选择器：定位小部件\n\n选择正确的选择器是将样式精确地应用到你想要的地方的关键。\n\
    \n- **类型选择器 (Type Selector)**：针对特定小部件类的所有实例（及其子类，除非被更具体的规则所覆盖）。这对于应用通用样式非常常见。\n\
    \n```css\nQPushButton { background-color: lightgray; border-radius: 5px; }\nQLineEdit\
    \ { border: 1px solid gray; }\n```\n\n- **对象名称选择器 (`#objectName`)**：根据对象名称针对单个特定的小部件实例，你可以在\
    \ C++ 代码中通过 `widget->setObjectName(\"mySpecialButton\");` 设置它。这具有很强的针对性，是唯一元素的理想选择。\n\
    \n```css\nQPushButtonButton#okButton { background-color: green; color: white;\
    \ }\nQLabel#errorLabel { color: red; font-weight: bold; }\n```\n\n- （注意：与 CSS\
    \ 的 #id 不同，QSS 使用 #objectName）。\n- **类选择器 (`.`)**：比类型或对象名称选择器用得少，但可以针对自定义类。例如：`.CustomWidget\
    \ { border: 2px solid orange; }`。\n- **属性选择器 (`[property=\"value\"]`)**：根据属性针对小部件。例如：`QPushButton[flat=\"\
    true\"]`。\n- **组合符 (Combinators)**：定义选择器之间的关系\n    - **后代选择器 (空格)**：`Frame QLabel\
    \ { color: blue; }`（针对 Frame 的子、孙子等）。\n    - **子选择器 (`>`)**：`Frame > QLabel {\
    \ font-style: italic; }`（针对直接子元素）。\n- **伪类 (`:`)**：根据小部件的状态条件应用样式。对于交互反馈至关重要。\n\
    \    - `:hover`：鼠标悬停在小部件上。\n    - `:pressed`：小部件正被按下（例如按钮点击）。\n    - `:checked`：小部件已勾选（例如\
    \ `CheckBox`, `QRadioButton`）。\n    - `:unchecked`：小部件未勾选。\n    - `:disabled`：小部件已禁用\
    \ (`setEnabled(false)`)。\n    - `:enabled`：小部件已启用。\n    - `:focus`：小部件拥有焦点。\n\
    \    - `:on`, `:off`：通常用于可检查项目，如 `CheckBox`。\n    - 你可以链用伪类：`QPushButton:hover:!pressed\
    \ { background-color: #eeeeee; }`（悬停但未按下时）。\n\n```css\nQPushButton { background-color:\
    \ lightblue; border: 1px solid darkblue; }\nQPushButton:hover { background-color:\
    \ skyblue; }\nQPushButton:pressed { background-color: darkblue; color: white;\
    \ }\nQPushButton:disabled { background-color: #cccccc; color: #888888; }\n```\n\
    \n- **子控件 (`::`)**：针对更复杂小部件的特定部分或元素。\n    - `QCheckBox::indicator`：可检查框本身。\n \
    \   - `QRadioButton::indicator:checked`：已选单选按钮的指示器。\n    - `QSlider::groove:horizontal`：滑块移动的槽。\n\
    \    - `QSlider::handle:horizontal`：可拖动的手柄。\n    - `QComboBox::drop-down`：下拉按钮。\n\
    \    - `QTabBar::tab`：`QTabWidget` 中的单个标签页。\n    - `QTableView::item:selected`：表格视图中的选中项。\n\
    \n```css\nQCheckBox::indicator { width: 15px; height: 15px; border: 1px solid\
    \ gray; }\nQCheckBox::indicator:checked { background-color: green; image: url(:/icons/checkmark.png);\
    \ }\nQSlider::handle:horizontal { background: qlineargradient(...); border-radius:\
    \ 5px; width: 10px; }\n```\n\n### Q QSS 属性\n\nQSS 支持许多与 CSS 类似的属性。一些常用的包括：\n\n"
- fmt: "\n## QSS Properties Overview\n\n- **Color & Background**: `color` (text/foreground),\
    \ `background-color`, `alternate-background-color` (for item views), `background-image`,\
    \ `border-image`.\n- **Box Model**: `border` (shorthand), `border-width`, `border-style`\
    \ (solid, dashed, etc.), `border-color`, `border-radius` (for rounded corners),\
    \ `padding` (space inside border), `margin` (space outside border).\n- **Font**:\
    \ `font` (shorthand), `font-family`, `font-size`, `font-weight` (normal, bold),\
    \ `font-style` (normal, italic).\n- **Size & Position (Limited)**: `min-width`,\
    \ `min-height`, `max-width`, `max-height` (influence size hints), `position` (less\
    \ common, usually rely on layouts).\n- **Widget Specific**: Properties specific\
    \ to certain widgets (e.g., `selection-background-color` for item views, `gridline-color`\
    \ for `QTableView`).\n\nRefer to the Qt documentation (\"Qt Style Sheets Reference\"\
    ) for a complete list of widgets, sub-controls, and supported properties.\n\n\
    ## Applying Style Sheets\n\nThere are several ways to apply your QSS rules:\n\n\
    ### 1. Per-Widget\nApply directly to a specific widget instance and its children.\
    \ Useful for one-off customizations.\n\n```cpp\nQPushButton *myButton = new QPushButton(\"\
    Special\");\nmyButton->setObjectName(\"specialButton\"); // Good practice if styling\
    \ specifically\nmyButton->setStyleSheet(\"QPushButton#specialButton { background-color:\
    \ orange; font-weight: bold; }\");\n```\n\n### 2. Application-Wide\nSet a style\
    \ sheet for the entire application. This is the standard way to apply a consistent\
    \ theme. Typically done once in your `main.cpp`.\n\n```cpp\n// In main.cpp\n\n\
    #include <QApplication>\n#include <QFile>\n#include <QTextStream>\n#include \"\
    mainwindow.h\" // Your main window header\n\nint  main(int argc, char *argv[])\
    \ {\n    QApplication app(argc, argv);\n    // Example: Apply a global style\n\
    \    // (Often better to load from file)\n    app.setStyleSheet(\"QPushButton\
    \ { border-radius: 3px; padding: 5px; }\"\n                     \"QLineEdit {\
    \ border: 1px solid #aaaaaa; padding: 3px; }\");\n    MainWindow w;\n    w.show();\n\
    \    return app.exec();\n}\n```\n\n### 3. Loading from a File (Recommended)\n\
    For any non-trivial styling, keep your QSS rules in a separate file (e.g., `style.qss`\
    \ or `style.css`). Load it at application startup. This keeps code clean and makes\
    \ the theme easily editable.\n\n```cpp\n// In main.cpp or theme loading function\n\
    QFile styleFile(\":/styles/style.qss\"); // Load from Qt Resource System\n// or\
    \ QFile styleFile(\"path/to/style.qss\");\n\nif (styleFile.open(QFile::ReadOnly\
    \ | QFile::Text)) {\n    QTextStream stream(&styleFile);\n    qApp->setStyleSheet(stream.readAll());\
    \ // qApp is a global pointer to QApplication\n    styleFile.close();\n} else\
    \ {\n    qWarning() << \"Could not load stylesheet:\" << styleFile.errorString();\n\
    }\n```\n\n## Cascading and Specificity\n\nLike CSS, QSS rules cascade. If multiple\
    \ rules match a widget, Qt uses specificity to decide which one applies:\n\n-\
    \ Styles set directly on a widget (`widget->setStyleSheet`) are the most specific.\n\
    - Object Name selectors (`#objectName`) are more specific than Type selectors\
    \ (`QPushButton`).\n- Rules with more components in the selector (e.g., `QFrame\
    \ QPushButton:hover`) are more specific than simpler ones (`QPushButton`).\n-\
    \ If specificity is equal, the rule appearing later in the style sheet takes precedence.\
    \ Some properties, like font and color, are inherited by child widgets unless\
    \ overridden. Others, like `background-color` or `border`, generally are not inherited.\n\
    \n## Limitations and Considerations\n\n- **Subset of CSS**: QSS implements many\
    \ features from CSS2 and some from CSS3, but it's not a full web browser CSS engine.\
    \ Always check the Qt documentation for supported selectors and properties for\
    \ specific widgets.\n- **Performance**: While generally efficient, extremely complex\
    \ style sheets with deep descendant selectors applied application-wide can have\
    \ a minor performance impact, especially during widget creation or state changes.\
    \ Test if performance is critical.\n- **Overrides Native Styling**: QSS gives\
    \ you control, but it means your application might look less \"native\" on some\
    \ platforms. Achieving a perfect blend of custom and native appearance sometimes\
    \ requires careful styling or using platform-specific code sections.\n\nQt Style\
    \ Sheets provide a remarkably flexible and powerful way to customize the visual\
    \ appearance of your QtWidgets applications, moving beyond the default platform\
    \ look and feel. By mastering the CSS-like syntax of selectors (targeting types,\
    \ object names, states, and sub-controls) and properties (controlling colors,\
    \ borders, fonts, etc.), you can create unique, branded, and visually engaging\
    \ user interfaces. Applying styles application-wide, often by loading rules from\
    \ external files, allows for consistent theming and easier maintenance. QSS is\
    \ a key tool in polishing your application and making it visually appealing.\n\
    \n## Managing Application Resources (.qrc files)\n\nBeyond code and visual styling,\
    \ real-world applications often depend on external assets – icons for buttons\
    \ and actions, images for branding or display, custom font files, translation\
    \ files, or even the Qt Style Sheet files we just discussed. Furthermore, to reach\
    \ a global audience, especially in diverse regions like Europe, designing applications\
    \ with translation in mind from the start is crucial. Qt provides integrated solutions\
    \ for both challenges.\n\n### The Qt Resource System (.qrc files): Embedding Assets\n\
    \nDistributing your application along with a collection of separate image files,\
    \ icons, or stylesheets can be problematic. Files might get accidentally deleted,\
    \ moved, or placed in the wrong relative path, leading to broken icons or missing\
    \ styles. The Qt Resource System offers a robust solution by allowing you to compile\
    \ these assets directly into your application (or into a separate library).\n\n\
    The system works using `.qrc` (Qt Resource Collection) files. These are simple\
    \ XML files that list the resources you want to embed and define aliases for accessing\
    \ them within your code.\n\n#### Creating and Using .qrc Files\n\n1. **Create\
    \ the .qrc file**: You can easily create one in Qt Creator (Right-click project\
    \ -> Add New... -> Qt -> Resource File). Alternatively, create an XML file manually\
    \ with this basic structure:\n\n```xml\n<!DOCTYPE RCC>\n<RCC version=\"1.0\">\n\
    <qresource prefix=\"/\">\n<file alias=\"icons/save.png\">../assets/images/diskette_32.png</file>\n\
    <file alias=\"icons/open.png\">../assets/images/folder_open_32.png</file>\n<file>styles/main_theme.qss</file>\
    \ \n<file alias=\"translations/app_de.qm\">../translations/myapp_german.qm</file>\n\
    </qresource>\n<qresource prefix=\"/images\">\n<file>logo.png</file>\n</qresource>\n\
    </RCC>\n```\n\n- `<qresource prefix=\"...\">`: Defines a virtual path prefix within\
    \ the resource system. `/` is common for the main resources.\n- `<file alias=\"\
    ...\">real/path/on/disk/file.ext</file>`: Specifies a file on your disk (`real/path/...`)\
    \ and gives it an alias (`alias=...`) within the resource system under the current\
    \ prefix. If alias is omitted, filename part of the disk path is used.\n\n2. **Add\
    \ to Build System**: Ensure your `.qrc` file is listed in your project's build\
    \ configuration (`CMakeLists.txt` or `.pro` file). This tells the build system\
    \ to process it.\n\n3. **Access Resources in Code**: Reference your embedded resources\
    \ using paths that start with a colon `:`, followed by the prefix (if not `/`),\
    \ and the alias or filename.\n\n```cpp\n#include <QIcon>\n#include <QPixmap>\n\
    #include <QFile>\n#include <QPushButton>\n#include <QApplication> // For qApp->setStyleSheet\n\
    \n// Example Usage:\nQIcon saveIcon(\":/icons/save.png\");\nQPushButton *saveButton\
    \ = new QPushButton(saveIcon, \"Save\");\n\nQPixmap logo(\":/images/logo.png\"\
    ); // Assuming prefix=\"/images\" in .qrc\nQLabel *logoLabel = new QLabel();\n\
    logoLabel->setPixmap(logo);\n\n// Load QSS from resources\nQFile styleFile(\"\
    :/styles/main_theme.qss\");\nif (styleFile.open(QFile::ReadOnly | QFile::Text))\
    \ {\n    qApp->setStyleSheet(styleFile.readAll());\n    styleFile.close();\n}\n\
    \n// Load translation file from resources (see i18n section)\n// translator.load(\"\
    :/translations/app_de.qm\");\n```\n"
