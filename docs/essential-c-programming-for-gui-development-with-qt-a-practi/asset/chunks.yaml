    ● Inserting Rows: Call beginInsertRows(parentIndex, firstRow, lastRow) before
    inserting data into your backend structure. After inserting, call endInsertRows().


    ● Removing Rows: Call beginRemoveRows(parentIndex, firstRow, lastRow) before removing
