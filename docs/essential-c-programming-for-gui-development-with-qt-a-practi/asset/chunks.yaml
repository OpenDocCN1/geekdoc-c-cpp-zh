    }


    3.  Image:


    ○     Purpose: Displays bitmap images like PNG, JPG, GIF.


    ○     Key Properties:


    ■ source: Specifies the image file path or URL. This is crucial. Use qrc:/ prefix
    for images embedded via the Qt Resource System (e.g., "qrc:/images/logo.png"),
    file:/// for local files (less common for deployed apps), or http:// for network
    images.


    ■ fillMode: Controls how the image scales if its size differs from the Image item''s
    width/height. Options include Image.Stretch, Image.PreserveAspectFit (fits inside,
    preserving aspect ratio - common), Image.PreserveAspectCrop (fills, preserving
    aspect ratio, cropping if needed), Image.Tile.


    ■ smooth: Boolean, enables smooth filtering when scaling (looks better, slightly
    more expensive).


    ■ sourceSize: Sometimes needed if the image format doesn''t specify size, or to
    treat a larger sprite sheet as a specific size.


    4.  QML


    // Add this inside the Window element


    Image {


    id: logoImage


    x: 20; y: greetingText.y + greetingText.height + 15  // Position below text


    width: 48; height: 48


    source: "qrc:/icons/qt_logo.png"  // Assumes this exists in your resources


    fillMode: Image.PreserveAspectFit


    smooth: true


    }


    Property Binding: A Glimpse into QML''s Power


    Notice how we positioned elements using id references (e.g., y: blueRect.y + blueRect.height
    + 10). QML takes this further with property binding. You can make a property directly
    dependent on an expression involving other properties:


    QML


    Rectangle {


    id: container


    width: 200; height: width / 2  // Height is bound to half the width


    color: "yellow"


    Text {


    // Center text horizontally within the container using a binding


    x: (parent.width - width) / 2  // ''parent'' refers to container


    y: 20


    text: "Width: " + container.width // Text bound to container''s width


    }


    }


    In this example, if container.width ever changes, its height and the Text item''s
    text and x position will automatically update. This reactive nature, where properties
    update automatically based on dependencies, is central to QML and significantly
    simplifies the creation of dynamic interfaces. We will explore binding in much
    more detail soon.


    QML offers a declarative approach to UI development, using a structure based on
    Items and their Properties. Basic visual elements like Rectangle, Text, and Image
    serve as fundamental building blocks. You define the UI structure by nesting items
    and assign unique ids to reference them. While static property assignments are
    simple, the real power begins to emerge with property binding, allowing properties
    to react automatically to changes elsewhere in the UI. This section provides the
    syntactic foundation needed to start assembling basic Qt Quick interfaces. Next,
    we''ll look at how to arrange these items effectively using QML''s positioning
    and layout mechanisms.


    ## Positioning and Layouts in QML: Anchors, Positioners, and Qt Quick Layouts


    * * *


    Right, we''ve seen the basic building blocks of a QML interface – Items like Rectangle,
    Text, and Image with their properties. Now, how do we arrange these effectively
    on the screen? Relying solely on fixed x and y coordinates leads to rigid designs
    that don''t adapt well to different window sizes, screen resolutions, or even
    varying text lengths common in translated applications (for instance, German text
    is often longer than its English equivalent). QML provides several powerful mechanisms
    for dynamic positioning and layout management.


    Creating user interfaces that look good and function correctly across various
    screen sizes and conditions requires moving beyond fixed x/y positioning. Qt Quick
    offers three primary approaches to arrange items dynamically: Anchors, Positioners,
    and the dedicated Qt Quick Layouts module.


    Anchors: The Powerhouse of Relative Positioning


    Anchors are arguably the most fundamental and frequently used positioning mechanism
    in QML. They allow you to define geometric relationships between items, creating
    fluid layouts where items automatically adjust their positions relative to their
    parents or siblings.


    Concept: Instead of setting an absolute x or y, you define constraints by "anchoring"
    specific lines of one item to the lines of another. Each visual item has several
    invisible anchor lines:


    ●     Edges: left, right, top, bottom


    ●     Center Lines: horizontalCenter, verticalCenter


    ●     Text Baseline: baseline (useful for aligning text elements)


    Syntax: You access anchors via the anchors property group. The basic syntax is
    anchors.myLine: targetItem.targetLine.


    QML


    import QtQuick


    import QtQuick.Window


    Window {


    width: 400; height: 300


    visible: true


    title: "QML Anchors Example"


    Rectangle { // Parent container


    id: container


    width: 300; height: 200


    // Center the container within the window using anchors


    anchors.horizontalCenter: parent.horizontalCenter


    anchors.verticalCenter: parent.verticalCenter


    color: "lightgray"


    border.color: "gray"


    Rectangle { // First child, anchored top-left with margin


    id: topLeftRect


    width: 100; height: 50


    color: "lightblue"


    // Anchored relative to the ''container'' (its parent)


    anchors.left: parent.left


    anchors.top: parent.top


    anchors.margins: 10  // Applies to top and left anchors


    }


    Rectangle { // Second child, anchored next to the first


    id: rightOfRect


