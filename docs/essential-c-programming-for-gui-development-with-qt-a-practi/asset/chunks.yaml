    3. **处理**：事件循环从队列中逐个提取事件并将其分发给预期的接收对象进行处理。\n\n这种等待、分发和处理的持续循环使应用程序保持活跃和响应。至关重要的一点是，不要在作为事件循环执行的代码中直接执行耗时的阻塞操作（例如在事件处理器内部或通过\
    \ `AutoConnection` 或 `DirectConnection` 连接的槽内部），因为这将阻止循环处理后续事件，导致 UI 冻结并无响应。我们将在以后讨论并发时处理长任务的方法。\n\
    \n#### 事件的生成与传递\n事件源自各种来源：\n\n* **窗口系统**：鼠标移动、按钮点击、按键按下、窗口缩放/移动请求、重绘请求。\n* **定时器**：`QTimer`\
