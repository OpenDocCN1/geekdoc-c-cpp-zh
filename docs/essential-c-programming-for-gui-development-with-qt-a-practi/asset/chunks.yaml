  trans: "\n\n```json\nPropertyChanges { target: interactiveRect; color: \"skyblue\"\
    ; border.color: \"darkred\" }\n\n}\n\n// 定义用于动画状态变化的过渡效果\n\ntransitions: [\n\n\
    \  Transition {\n    // 当切换到/离开任何状态时应用（包括 \"\" <-> \"hovered\"）\n    // 动画化 interactiveRect\
    \ 的 color 属性\n    ColorAnimation { properties: \"color\"; duration: 250; easing.type:\
    \ Easing.InOutQuad }\n    // 动画化 interactiveRect 的 border.color 属性\n    ColorAnimation\
    \ { properties: \"border.color\"; duration: 250 }\n  }\n]\n\n}\n```\n\n现在，当鼠标悬停在矩形上时，状态会变为\
    \ \"hovered\"，从而触发 `Transition`。过渡内部的 `ColorAnimations` 会自动运行，在 250 毫秒内将 `color`\
    \ 和 `border.color` 属性从默认值平滑插值到 \"hovered\" 状态中定义的值。鼠标移出则反转该状态变化，并再次运行动画回到默认值。\n\
    \n### 基础之外\n\nQML 的动画框架非常丰富。你可以使用 `SequentialAnimation` 和 `ParallelAnimation`\
    \ 组合动画，使用 `Behavior` 为任何属性更改应用默认动画，并创建复杂的脚本动画。然而，与状态绑定的过渡提供了实现流式 UI 响应的最常用且声明式方式。\n\
    \n在 Qt Quick 中创建流畅的现代界面涉及使用适当的控件并结合动画。Qt Quick Controls 提供了标准的、可样化的 UI 元素库，如按钮和文本字段。QML\
    \ 动画（`PropertyAnimation`、`ColorAnimation` 等）允许属性更改随时间平滑发生。\n\n# 第 8 章：用于可扩展数据处理的模型/视图编程\n\
    \n## 理解 Qt 的模型/视图架构\n\n想象构建一个管理客户联系人、显示财务交易或浏览文件系统的应用程序。这些任务通常涉及以列表或表格等结构化格式向用户展示可能的大型数据集。一种简单的方法是将所有数据直接加载到\
    \ UI 控件中（例如直接向 `QListWidget` 中添加字符串）。然而，这种方法会迅速失效：\n\n- **可扩展性问题**：直接将成千上万或百万项加载到\
    \ UI 控件会消耗大量内存，并导致应用程序运行缓慢或无响应。\n- **灵活性不足**：如果你想同时将同一个联系人数据以简单列表和详细表格的形式显示怎么办？在每个\
    \ UI 控件中存储数据会导致重复和同步问题。\n- **可维护性差**：将数据存储/检索逻辑直接与 UI 展示代码混合，使得应用程序更难以理解、测试和修改。数据源的更改会影响整个\
    \ UI 代码，而 UI 的微调则有破坏数据处理的风险。\n\n为了克服这些挑战，Qt 采用了一种名为模型/视图架构（Model/View Architecture）的强大设计模式。核心原则是关注点分离：数据处理与数据展示分离。\n\
    \n### 三大组件：模型（Model）、视图（View）和代理（Delegate）\n\n该架构涉及三种不同的组件协同工作：\n\n1. **模型 (Model)**：\n\
    \   - **角色**：数据提供者。它封装了应用程序的数据及其结构（列表、表格、树）。它直接持有数据，或提供一个接口从其他源（如数据库、文件或网络服务）访问数据。\n\
    \   - **接口**：它为视图提供了一个标准化接口，用于查询存在多少数据（例如行/列数）并检索用于显示的特定数据片段。\n   - **通知**：负责在底层数据发生变化时（项的添加、删除或修改）通知视图。\n\
    \   - **关键类**：在 Qt 中，自定义模型继承自 `QAbstractItemModel` 或其便利子类（`QAbstractListModel`、`QAbstractTableModel`）。Qt\
    \ 还为常见情况提供了现成的模型。\n   - 关键在于模型完全不知道数据是如何视觉显示的。\n\n2. **视图 (View)**：\n   - **角色**：数据展示者。它以特定格式将模型提供的数据可视化（例如，滚动列表、基于网格的表格、分级树）。\n\
    \   - **交互**：它处理与展示相关的用户交互，如滚动、选择项目以及可能启动的编辑操作。\n   - **数据请求**：它查询模型以绘制当前可见项所需的数据。它本身不存储数据的副本。\n\
    \   - **关键类**：`QListView`、`QTableView`、`QTreeView`（在 QtWidgets 中）；`ListView`、`GridView`、`TableView`（在\
    \ QML 中）。\n   - 关键在于视图完全不知道数据的来源或内部存储；它只通过标准接口与模型通信。\n\n3. **代理 (Delegate)**：\n\
    \   - **角色**：项渲染器和编辑器。虽然视图管理整体布局和交互，但代理负责每个单独项（列表中的行、表格中的单元格）的绘制方式。当项需要被修改时，它还提供编辑控件（例如\
    \ `QLineEdit`）。\n   - **自定义**：代理允许对项的外观进行超出简单文本的巨大自定义——你可以通过绘制图形、使用自定义控件等来渲染每个项。\n\
    \   - **关键类**：`QStyledItemDelegate`（QtWidgets 中默认的、感知平台的代理）、`QAbstractItemDelegate`（自定义代理的基类）；在\
    \ QML 中，视图的 `delegate` 属性通常持有一个充当代理的 QML 组件定义。\n   - 关键在于代理专注于一次渲染/编辑一项，使用模型提供的该特定项的数据。\n\
    \n### 启用通信：模型索引（Model Indices）和数据角色（Data Roles）\n\n这些分离的组件如何在没有直接耦合的情况下有效通信？两个关键概念桥越了这一差距：\n\
    \n1. **模型索引 (`QModelIndex`)**：\n   当视图需要某个项的数据时，它不会问“给我客户 Doe 的数据”，而是询问模型“给我第\
    \ 5 行第 2 列的数据”。这种行/列信息（以及树结构所需的内部模型指针）封装在 `QModelIndex` 对象中。这种抽象索引是视图用于在模型上下文中引用数据的通用语言。模型将此索引翻译为对实际数据的访问。\n\
    \n2. **数据角色 (`Qt::ItemDataRole`)**：\n   单个数据项（如客户联系人）通常关联有多个信息（名称、电话、图标、工具提示、勾选状态）。模型不是仅仅返回一个数据块，而是视图/代理使用角色请求数据的特定方面。角色定义在\
    \ `Qt::ItemDataRole` 枚举中。常见的角色包括：\n   - `Qt::DisplayRole`：要显示的主要文本。\n   - `Qt::DecorationRole`：与文本一起显示的图标或色块。\n\
    \   - `Qt::EditRole`：适用于编辑的数据格式（通常与 `DisplayRole` 相同）。\n   - `Qt::ToolTipRole`：悬停在项上时的工具提示文本。\n\
    \   - `Qt::StatusTipRole`：状态栏文本。\n   - `Qt::CheckStateRole`：用于可勾选项（返回 `Qt::Checked`\
    \ 或 `Qt::Unchecked`）。\n   - `Qt::FontRole`、`Qt::BackgroundRole`、`Qt::ForegroundRole`：基础样式的提示。\n\
    \   - `Qt::UserRole`：定义应用程序特定角色的起始点，允许在模型和代理之间传递任意数据类型。\n\n当代理渲染项时，它可能会使用 `DisplayRole`\
    \ 向模型请求数据以获取文本，使用 `DecorationRole` 获取图标，使用 `ToolTipRole` 获取工具提示，且都使用同一个 `QModelIndex`。这使得单个模型项能够丰富且灵活地表示。\n\
    \n## 实现的收益\n\n这种分离带来了显著的优势，对于处理大量数据的应用程序尤其尤为重要，这类应用程序在法兰克福及全球的金融或数据分析领域非常常见。\n\
    \n"
- fmt: "\n- Scalability: Views typically only request data for the items currently\
    \ visible on screen. This means models can efficiently manage datasets containing\
    \ millions of rows without overwhelming the UI or consuming excessive memory.\n\
    - Flexibility & Reusability: The same data `Model` can be simultaneously presented\
    \ by multiple different `Views` (e.g., a list view and a table view showing different\
    \ columns of the same data). You can change the presentation (swap views, redesign\
    \ delegates) without touching the underlying data model. Models designed with\
    \ a clean interface can be reused elsewhere.\n- Data Abstraction: The `View` doesn't\
    \ care if the `Model` gets its data from an in-memory `QList`, an SQL database,\
    \ a network API, or a complex C++ object structure. This logic is encapsulated\
    \ entirely within the `Model`.\n- Customization: Delegates provide fine-grained\
    \ control over item rendering and editing.\n- Maintainability: The clear separation\
    \ of concerns makes the codebase easier to understand, test, debug, and evolve\
    \ over time.\n\nQt's Model/View architecture is a sophisticated and highly effective\
    \ design pattern for decoupling data storage and logic from its visual presentation.\
    \ By splitting responsibilities among the `Model` (data access and structure),\
    \ the `View` (overall presentation and interaction), and the `Delegate` (individual\
    \ item rendering and editing), and using `QModelIndex` and `Qt::ItemDataRole`\
    \ as the communication interface, Qt enables the creation of scalable, flexible,\
    \ and maintainable applications capable of handling large and complex datasets\
    \ efficiently. Understanding this fundamental separation is the first essential\
    \ step towards mastering data handling in both Qt Widgets and Qt Quick applications.\
    \ We will subsequently explore how to use Qt's standard models and implement your\
    \ own custom models.\n\n## Using Standard Models with QtWidgets and QML\n\nImplementing\
    \ a custom model by subclassing `QAbstractItemModel` or its derivatives provides\
    \ maximum flexibility but also requires understanding and implementing several\
    \ virtual functions correctly. For many common situations, such as displaying\
    \ a simple list of strings or a table of data held in memory, Qt offers convenient,\
    \ ready-to-use standard model classes that handle the necessary interface implementations\
    \ for you. We'll focus on two of the most versatile: `QStringListModel` and `QStandardItemModel`.\n\
    \n### QStringListModel: For Simple String Lists\n\nAs its name suggests, `QStringListModel`\
    \ is designed specifically to represent a list of strings (`QStringList`) as a\
    \ model. It's a one-column model where each row corresponds to a string in the\
    \ list.\n\n- Purpose: Ideal for populating simple list views (`QListView`, `ListView`)\
    \ or combo boxes (`QComboBox`) where you only need to display plain text items.\n\
    - QtWidgets Usage:\n1. Prepare your data as a `QStringList`.\n2. Create an instance\
    \ of `QStringListModel`.\n3. Set the data using `model->setStringList(yourStringList);`.\n\
    4. Assign the model to your view: `listView->setModel(model);`.\n\n```cpp\n#include\
    \ <QApplication>\n#include <QStringListModel>\n#include <QListView>\n#include\
    \ <QStringList> // Include necessary headers\n\n// In a widget's setup code:\n\
    \nQStringList germanCities;\ngermanCities << \"Berlin\" << \"Hamburg\" << \"Munich\"\
    \ << \"Cologne\" << \"Frankfurt\"; // Our current location!\n\nQStringListModel\
    \ *model = new QStringListModel(this); // Parent 'this' manages memory\n\nmodel->setStringList(germanCities);\n\
    \nQListView *listView = new QListView(this);\nlistView->setModel(model);\n\n//\
    \ Add listView to a layout...\n```\n\n- The `QListView` will now display the list\
    \ of cities.\n- QML Usage: The process involves creating the model in C++ and\
    \ exposing it to QML.\n1. Create and populate the `QStringListModel` instance\
    \ in C++ as shown above.\n2. Expose the model instance to QML, typically using\
    \ context properties in `main.cpp`:\n\n```cpp\n// In main.cpp, after creating\
    \ the model instance 'cityModel':\nengine.rootContext()->setContextProperty(\"\
    cityListModel\", cityModel);\n```\n3. In your QML file, bind the `ListView`'s\
    \ model property to the exposed context property. The delegate can access the\
    \ string data using the default display role (sometimes accessible directly as\
    \ `modelData` depending on Qt version/context).\n\n```qml\n// In main.qml or similar\n\
    import QtQuick\nimport QtQuick.Controls // Assuming use of Controls ListView\n\
    \nListView {\n    anchors.fill: parent\n    model: cityListModel // Bind to the\
    \ exposed C++ model instance\n    delegate: ItemDelegate { // Or simple Text item\n\
    \        width: parent.width\n        text: model.display // Access the string\
    \ via the 'display' role\n        // or sometimes just 'text: modelData' might\
    \ work\n    }\n}\n```\n\n### QStandardItemModel: Flexible Item-Based Storage\n\
    \nFor scenarios requiring more than just simple strings – like tables with multiple\
    \ columns, lists with icons or checkboxes, or even hierarchical tree structures\
    \ – `QStandardItemModel` offers much greater flexibility. It stores data using\
    \ `QStandardItem` objects, where each item can hold data for various roles (text,\
    \ decoration, tooltips, etc.) and can have child items to form hierarchies.\n\n\
    - Purpose: A generic, in-memory model suitable for lists, tables, and trees where\
    \ items might have multiple attributes (columns/roles) or parent-child relationships.\n\
    - Core Concept (QStandardItem): Each cell or node in the model is represented\
    \ by a `QStandardItem`. You interact with these items to set data:\n1. `item->setText(\"\
    Some Text\")`: Sets data for `Qt::DisplayRole` and `Qt::EditRole`.\n2. `item->setIcon(QIcon(\"\
    :/icons/myicon.png\"))`: Sets data for `Qt::DecorationRole`.\n3. `item->setToolTip(\"\
    Helpful tip\")`: Sets data for `Qt::ToolTipRole`.\n4. `item->setCheckable(true)`:\
    \ Sets data for `Qt::CheckStateRole`.\n5. `item->setData(someValue, Qt::UserRole\
    \ + 1)`: Set data using custom roles.\n6. `parentItem->appendRow(childItem)`:\
    \ Build hierarchies.\n\n- QtWidgets Usage (Table Example):\n1. Create a `QStandardItemModel`\
    \ instance, optionally specifying initial row/column counts.\n2. Set header labels\
    \ using `model->setHorizontalHeaderLabels({\"Col1\", \"Col2\"});`.\n3. Create\
    \ `QStandardItem` instances for each cell you want to populate. Set their data\
    \ using methods like `setText()`, `setIcon()`, etc.\n4. Add the items to the model,\
    \ either row by row (`model->appendRow(QList<QStandardItem*> rowItems);`) or cell\
    \ by cell (`model->setItem(row, column, item);`).\n5. Assign the model to the\
    \ view (`QTableView`, `QTreeView`, `QListView`): `tableView->setModel(model);`.\n\
    \n```cpp\n#include <QApplication>\n#include <QStandardItemModel>\n#include <QTableView>\n\
    #include <QStandardItem> // Include necessary headers\n\n// In setup code:\nQStandardItemModel\
    \ *model = new QStandardItemModel(2, 3, this); // 2 rows, 3 columns\nmodel->setHorizontalHeaderLabels({\"\
    Name\", \"City\", \"Active\"});\n\n// Row 0\nmodel->setItem(0, 0, new QStandardItem(\"\
    Alice\"));\nmodel->setItem(0, 1, new QStandardItem(\"Frankfurt\"));\nQStandardItem*\
    \ itemRC2 = new QStandardItem();\nitemRC2->setCheckable(true);\nitemRC2->setCheckState(Qt::Checked);\n\
    model->setItem(0, 2, itemRC2);\n\n// Row 1 (using different item creation)\nQStandardItem*\
    \ nameItem = new QStandardItem(\"Bob\");\nQStandardItem* cityItem = new QStandardItem(\"\
    Berlin\");\ncityItem->setIcon(QIcon(\":/icons/city_icon.png\")); // Example icon\n\
    QList<QStandardItem> rowItems;\nrowItems << nameItem << cityItem << new QStandardItem();\
    \ // Empty item for last column\nmodel->appendRow(rowItems);\n\nQTableView *tableView\
    \ = new QTableView(this);\ntableView->setModel(model);\n\n// Add tableView to\
    \ layout...\n```\n\n- QML Usage:\n1. Create and populate the `QStandardItemModel`\
    \ in C++.\n2. Expose Role Names: For QML delegates to easily access data by name\
    \ (like `model.name` instead of just `model.display`), you usually need to tell\
    \ the model how roles map to names before populating data if using roles beyond\
    \ display/decoration. This is done via `setItemRoleNames()`.\n\n```cpp\n// In\
    \ C++, before populating extensively\n```\n"
  raw: '● Scalability: Views typically only request data for the items currently visible
    on screen. This means models can efficiently manage datasets containing millions
    of rows without overwhelming the UI or consuming excessive memory.


    ● Flexibility & Reusability: The same data Model can be simultaneously presented
    by multiple different Views (e.g., a list view and a table view showing different
    columns of the same data). You can change the presentation (swap views, redesign
    delegates) without touching the underlying data model. Models designed with a
    clean interface can be reused elsewhere.


    ● Data Abstraction: The View doesn''t care if the Model gets its data from an
    in-memory QList, an SQL database, a network API, or a complex C++ object structure.
    This logic is encapsulated entirely within the Model.


    ● Customization: Delegates provide fine-grained control over item rendering and
    editing.


    ● Maintainability: The clear separation of concerns makes the codebase easier
    to understand, test, debug, and evolve over time.


    Qt''s Model/View architecture is a sophisticated and highly effective design pattern
    for decoupling data storage and logic from its visual presentation. By splitting
    responsibilities among the Model (data access and structure), the View (overall
    presentation and interaction), and the Delegate (individual item rendering and
    editing), and using QModelIndex and Qt::ItemDataRole as the communication interface,
    Qt enables the creation of scalable, flexible, and maintainable applications capable
    of handling large and complex datasets efficiently. Understanding this fundamental
    separation is the first essential step towards mastering data handling in both
    Qt Widgets and Qt Quick applications. We will subsequently explore how to use
    Qt''s standard models and implement your own custom models.


    ## Using Standard Models with QtWidgets and QML


    * * *


    Implementing a custom model by subclassing QAbstractItemModel or its derivatives
    provides maximum flexibility but also requires understanding and implementing
    several virtual functions correctly. For many common situations, such as displaying
    a simple list of strings or a table of data held in memory, Qt offers convenient,
    ready-to-use standard model classes that handle the necessary interface implementations
    for you. We''ll focus on two of the most versatile: QStringListModel and QStandardItemModel.


    QStringListModel: For Simple String Lists


    As its name suggests, QStringListModel is designed specifically to represent a
    list of strings (QStringList) as a model. It''s a one-column model where each
    row corresponds to a string in the list.


    ● Purpose: Ideal for populating simple list views (QListView, ListView) or combo
    boxes (QComboBox) where you only need to display plain text items.


    ●     QtWidgets Usage:


    1.  Prepare your data as a QStringList.


    2.  Create an instance of QStringListModel.


    3.  Set the data using model->setStringList(yourStringList);.


    4.  Assign the model to your view: listView->setModel(model);.


    C++


    #include <QApplication>


    #include <QStringListModel>


    #include <QListView>


    #include <QStringList> // Include necessary headers


    // In a widget''s setup code:


    QStringList germanCities;


    germanCities << "Berlin" << "Hamburg" << "Munich" << "Cologne" << "Frankfurt";
    // Our current location!


    QStringListModel *model = new QStringListModel(this); // Parent ''this'' manages
    memory


    model->setStringList(germanCities);


    QListView *listView = new QListView(this);


    listView->setModel(model);


    // Add listView to a layout...


    ●     The QListView will now display the list of cities.


    ● QML Usage: The process involves creating the model in C++ and exposing it to
    QML.


    1.  Create and populate the QStringListModel instance in C++ as shown above.


    2.  Expose the model instance to QML, typically using context properties in main.cpp:


    C++


    // In main.cpp, after creating the model instance ''cityModel'':


    engine.rootContext()->setContextProperty("cityListModel", cityModel);


    3.  In your QML file, bind the ListView''s model property to the exposed context
    property. The delegate can access the string data using the default display role
    (sometimes accessible directly as modelData depending on Qt version/context).


    QML


    // In main.qml or similar


    import QtQuick


    import QtQuick.Controls // Assuming use of Controls ListView


    ListView {


    anchors.fill: parent


    model: cityListModel // Bind to the exposed C++ model instance


    delegate: ItemDelegate { // Or simple Text item


    width: parent.width


    text: model.display // Access the string via the ''display'' role


    // or sometimes just ''text: modelData'' might work


    }


    }


    QStandardItemModel: Flexible Item-Based Storage


    For scenarios requiring more than just simple strings – like tables with multiple
    columns, lists with icons or checkboxes, or even hierarchical tree structures
    – QStandardItemModel offers much greater flexibility. It stores data using QStandardItem
    objects, where each item can hold data for various roles (text, decoration, tooltips,
    etc.) and can have child items to form hierarchies.


    ● Purpose: A generic, in-memory model suitable for lists, tables, and trees where
    items might have multiple attributes (columns/roles) or parent-child relationships.


    ● Core Concept (QStandardItem): Each cell or node in the model is represented
    by a QStandardItem. You interact with these items to set data:


    1.  item->setText("Some Text"): Sets data for Qt::DisplayRole and Qt::EditRole.


    2.  item->setIcon(QIcon(":/icons/myicon.png")): Sets data for Qt::DecorationRole.


    3.  item->setToolTip("Helpful tip"): Sets data for Qt::ToolTipRole.


    4.  item->setCheckable(true); item->setCheckState(Qt::Checked);: For Qt::CheckStateRole.


    5.  item->setData(someValue, Qt::UserRole + 1);: Set custom data using custom
    roles.


    6.  parentItem->appendRow(childItem); or parentItem->setChild(row, col, childItem);:
    Build hierarchies.


    ●     QtWidgets Usage (Table Example):


    1.  Create a QStandardItemModel instance, optionally specifying initial row/column
    counts.


    2.  Set header labels using model->setHorizontalHeaderLabels({"Col1", "Col2"});
    and setVerticalHeaderLabels(...).


    3.  Create QStandardItem instances for each cell you want to populate. Set their
    data using methods like setText(), setIcon(), etc.


    4.  Add the items to the model, either row by row (model->appendRow(QList<QStandardItem*>
    rowItems);) or cell by cell (model->setItem(row, column, item);).


    5.  Assign the model to the view (QTableView, QTreeView, QListView): tableView->setModel(model);.


