- fmt: "\nThe first step, before even downloading the installer, is to create a Qt\
    \ Account. Historically, this wasn't always strictly required for accessing the\
    \ open-source components, but it is now the standard way to manage downloads via\
    \ the Online Installer. Don't worry, creating an account is free and straightforward.\
    \ Simply navigate to the main Qt website (`qt.io`) and look for options like \"\
    Sign up\" or \"Create account.\" You'll typically need to provide an email address\
    \ and create a password. This account allows the installer to authenticate you\
    \ and present the available downloads based on the open-source (LGPLv3/GPL) or\
    \ commercial licenses associated with your account. Once your account is created\
    \ and verified (you might need to confirm via email), keep your login credentials\
    \ handy for the installer.\n\n## Acquiring and Running the Qt Online Installer\n\
    \nWith your Qt Account ready, head back to the Qt website's download section.\
    \ Look for downloads related to \"Qt for Application Development\" or the \"Qt\
    \ Online Installer.\" You'll find versions available for Windows (`.exe`), macOS\
    \ (`.dmg`), and Linux (`.run`). Download the appropriate installer for your operating\
    \ system.\n\nOnce downloaded, launch the installer. It will first prompt you for\
    \ your Qt Account credentials (email and password). Enter them to proceed. The\
    \ installer will then fetch the latest information about available Qt versions\
    \ and tools from the Qt servers. You'll be guided through several screens, including\
    \ welcome messages and license agreements. Pay attention to the license terms;\
    \ for most open-source development, you will be proceeding under the terms of\
    \ the LGPLv3 or GPL licenses.\n\n## Navigating the Component Selection\n\nThis\
    \ is the most crucial stage of the installation process, where you specify exactly\
    \ which parts of the Qt ecosystem you need.\n\n- **Installation Folder**: The\
    \ installer will ask where you want to install the Qt SDK and tools. It's highly\
    \ recommended, especially on Windows, to choose a path that does not contain spaces\
    \ or special characters. A simple path like `C:\\Qt` on Windows, `/Users/your_username/Qt`\
    \ on macOS, or `/home/your_username/Qt` (or perhaps `/opt/Qt` for a system-wide\
    \ install, though user-level is often easier) on Linux is generally preferable.\
    \ This avoids potential issues with some build tools or scripts that might not\
    \ handle complex paths correctly.\n- **Installation Type**: You will likely be\
    \ presented with options like \"Default installation,\" \"Minimal installation,\"\
    \ or \"Custom installation.\" Always choose Custom installation. This gives you\
    \ granular control over the components, ensuring you install the specific Qt version,\
    \ modules, and tools required for C++ desktop development with Qt 6. Default installations\
    \ might omit necessary compiler-specific builds or install versions you don't\
    \ intend to use.\n- **Selecting Components**: The custom installation screen presents\
    \ a tree view of available components. This can look overwhelming initially, but\
    \ we can break it down:\n    - **Qt Versions**: You will see categories for different\
    \ major Qt versions (e.g., Qt 6, Qt 5). Expand the latest stable Qt 6.x category\
    \ (for instance, as of this writing, you might see Qt 6.7 or a similar release).\
    \ This is the version we will focus on in this book.\n    - **Platform-Specific\
    \ Modules within Qt 6.x**: Under the chosen Qt 6.x version, you'll find builds\
    \ tailored for different compilers and architectures. This is critical. You must\
    \ select the component(s) that match the compiler you intend to use on your system:\n\
    \        - **On Windows**: You'll see options like `MSVC 2019 64-bit`, `MSVC 2022\
    \ 64-bit`, `MinGW 64-bit` (the specific MinGW version might vary). Choose the\
    \ one corresponding to the compiler you have installed or plan to install (more\
    \ on compilers shortly). For development targeting modern Windows, 64-bit is standard.\n\
    \        - **On macOS**: You'll typically see a single macOS option. This build\
    \ uses the Clang compiler provided by Xcode.\n        - **On Linux**: You'll usually\
    \ see a `GCC 64-bit` option, built against a standard version of the GCC compiler\
    \ expected on many Linux distributions.\n    - **Additional Libraries under Qt\
    \ 6.x**: Besides the core platform build, you might see checkboxes for other libraries.\
    \ Ensure essentials like `Qt Shader Tools` are selected (often default). You might\
    \ consider `Qt 5 Compatibility Module` if you anticipate working with older code\
    \ examples initially, but try to focus on pure Qt 6 where possible. Modules like\
    \ `Qt WebEngine` (for embedding web content) or `Qt Multimedia` can be added now\
    \ if you know you'll need them, or you can rerun the installer later to add components.\
    \ Avoid selecting everything indiscriminately, as this significantly increases\
    \ download size and installation time.\n    - **Sources**: There's usually an\
    \ option to download the `Sources` for the selected Qt version. This allows you\
    \ to step into Qt's own code while debugging, which can be insightful for advanced\
    \ troubleshooting. However, it consumes considerable disk space. For initial setup,\
    \ you can safely skip downloading sources unless you have a specific reason to\
    \ include them.\n    - **Mobile Targets (Android/iOS)**: You might see options\
    \ for Android or iOS development. While Qt supports mobile, this book focuses\
    \ on desktop applications. You can ignore these for now unless mobile development\
    \ is an immediate goal.\n    - **Developer and Designer Tools**: This is another\
    \ top-level category in the tree view. Ensure the latest stable version of `Qt\
    \ Creator` is selected. This is the IDE we will use throughout the book. You should\
    \ also ensure `CMake` is selected, as Qt 6 heavily relies on it for its build\
    \ system. Build tools like `Ninja` (a fast alternative to Make) might also be\
    \ selected here or included implicitly; it's generally good to have.\n    - **Compilers\
    \ (Windows/MinGW)**: If you are on Windows and plan to use the `MinGW` compiler\
    \ (a port of GCC) instead of Microsoft's MSVC, the Qt installer might offer to\
    \ download and install a suitable version under the Developer and Designer Tools.\
    \ If you don't already have a compatible MinGW toolchain installed, selecting\
    \ this option is convenient.\n\nReview your selections carefully, ensuring you\
    \ have the correct Qt 6.x build for your compiler, Qt Creator, and CMake. Then\
    \ proceed with the installation, accepting the license agreements when prompted.\
    \ The download and installation process may take some time depending on your internet\
    \ connection and the number of components selected.\n\n## Platform-Specific Compiler\
    \ Prerequisites\n\nQt itself is a framework; it needs a C++ compiler to turn your\
    \ source code into an executable program. The Qt libraries you selected during\
    \ installation were pre-compiled using a specific compiler, and you need a compatible\
    \ compiler installed on your system.\n\n### Windows\n\n**Microsoft Visual C++\
    \ (MSVC)**: This is the native Microsoft C++ compiler, included with Visual Studio.\
    \ You do not necessarily need the full Visual Studio IDE installed. You can install\
    \ just the necessary command-line tools using the `Build Tools for Visual Studio`\
    \ installer, available free from Microsoft's website. When running the Visual\
    \ Studio installer (either for the full IDE or just the Build Tools), ensure you\
    \ select the \"Desktop development with C++\" workload. Crucially, the version\
    \ of MSVC you install (e.g., `MSVC 2019` or `MSVC 2022`) must match the Qt MSVC\
    \ build you selected in the Qt Online Installer (e.g., `MSVC 2019 64-bit`). The\
    \ Community edition of Visual Studio is also free and includes the necessary compilers.\n"
  raw: 'The first step, before even downloading the installer, is to create a Qt Account.
    Historically, this wasn''t always strictly required for accessing the open-source
    components, but it is now the standard way to manage downloads via the Online
    Installer. Don''t worry, creating an account is free and straightforward. Simply
    navigate to the main Qt website (qt.io) and look for options like "Sign up" or
    "Create account." You''ll typically need to provide an email address and create
    a password. This account allows the installer to authenticate you and present
    the available downloads based on the open-source (LGPLv3/GPL) or commercial licenses
    associated with your account. Once your account is created and verified (you might
    need to confirm via email), keep your login credentials handy for the installer.


    Acquiring and Running the Qt Online Installer


    With your Qt Account ready, head back to the Qt website''s download section. Look
    for downloads related to "Qt for Application Development" or the "Qt Online Installer."
    You''ll find versions available for Windows (.exe), macOS (.dmg), and Linux (.run).
    Download the appropriate installer for your operating system.


    Once downloaded, launch the installer. It will first prompt you for your Qt Account
    credentials (email and password). Enter them to proceed. The installer will then
    fetch the latest information about available Qt versions and tools from the Qt
    servers. You''ll be guided through several screens, including welcome messages
    and license agreements. Pay attention to the license terms; for most open-source
    development, you will be proceeding under the terms of the LGPLv3 or GPL licenses.


    Navigating the Component Selection


    This is the most crucial stage of the installation process, where you specify
    exactly which parts of the Qt ecosystem you need.


    ● Installation Folder: The installer will ask where you want to install the Qt
    SDK and tools. It''s highly recommended, especially on Windows, to choose a path
    that does not contain spaces or special characters. A simple path like C:\Qt on
    Windows, /Users/your_username/Qt on macOS, or /home/your_username/Qt (or perhaps
    /opt/Qt for a system-wide install, though user-level is often easier) on Linux
    is generally preferable. This avoids potential issues with some build tools or
    scripts that might not handle complex paths correctly.


    ● Installation Type: You will likely be presented with options like "Default installation,"
    "Minimal installation," or "Custom installation." Always choose Custom installation.
    This gives you granular control over the components, ensuring you install the
    specific Qt version, modules, and tools required for C++ desktop development with
    Qt 6\. Default installations might omit necessary compiler-specific builds or
    install versions you don''t intend to use.


    ● Selecting Components: The custom installation screen presents a tree view of
    available components. This can look overwhelming initially, but we can break it
    down:


    ○ Qt Versions: You will see categories for different major Qt versions (e.g.,
    Qt 6, Qt 5). Expand the latest stable Qt 6.x category (for instance, as of this
    writing, you might see Qt 6.7 or a similar release). This is the version we will
    focus on in this book.


    ○ Platform-Specific Modules within Qt 6.x: Under the chosen Qt 6.x version, you''ll
    find builds tailored for different compilers and architectures. This is critical.
    You must select the component(s) that match the compiler you intend to use on
    your system:


    ■ On Windows: You''ll see options like MSVC 2019 64-bit, MSVC 2022 64-bit, MinGW
    64-bit (the specific MinGW version might vary). Choose the one corresponding to
    the compiler you have installed or plan to install (more on compilers shortly).
    For development targeting modern Windows, 64-bit is standard.


    ■ On macOS: You''ll typically see a single macOS option. This build uses the Clang
    compiler provided by Xcode.


    ■ On Linux: You''ll usually see a GCC 64-bit option, built against a standard
    version of the GCC compiler expected on many Linux distributions.


    ○ Additional Libraries under Qt 6.x: Besides the core platform build, you might
    see checkboxes for other libraries. Ensure essentials like Qt Shader Tools are
    selected (often default). You might consider Qt 5 Compatibility Module if you
    anticipate working with older code examples initially, but try to focus on pure
    Qt 6 where possible. Modules like Qt WebEngine (for embedding web content) or
    Qt Multimedia can be added now if you know you''ll need them, or you can rerun
    the installer later to add components. Avoid selecting everything indiscriminately,
    as this significantly increases download size and installation time.


    ○ Sources: There''s usually an option to download the Sources for the selected
    Qt version. This allows you to step into Qt''s own code while debugging, which
    can be insightful for advanced troubleshooting. However, it consumes considerable
    disk space. For initial setup, you can safely skip downloading sources unless
    you have a specific reason to include them.


    ○ Mobile Targets (Android/iOS): You might see options for Android or iOS development.
    While Qt supports mobile, this book focuses on desktop applications. You can ignore
    these for now unless mobile development is an immediate goal.


    ○ Developer and Designer Tools: This is another top-level category in the tree
    view. Ensure the latest stable version of Qt Creator is selected. This is the
    IDE we will use throughout the book. You should also ensure CMake is selected,
    as Qt 6 heavily relies on it for its build system. Build tools like Ninja (a fast
    alternative to Make) might also be selected here or included implicitly; it''s
    generally good to have.


    ○ Compilers (Windows/MinGW): If you are on Windows and plan to use the MinGW compiler
    (a port of GCC) instead of Microsoft''s MSVC, the Qt installer might offer to
    download and install a suitable version under the Developer and Designer Tools.
    If you don''t already have a compatible MinGW toolchain installed, selecting this
    option is convenient.


    Review your selections carefully, ensuring you have the correct Qt 6.x build for
    your compiler, Qt Creator, and CMake. Then proceed with the installation, accepting
    the license agreements when prompted. The download and installation process may
    take some time depending on your internet connection and the number of components
    selected.


    Platform-Specific Compiler Prerequisites


    Qt itself is a framework; it needs a C++ compiler to turn your source code into
    an executable program. The Qt libraries you selected during installation were
    pre-compiled using a specific compiler version, and you need a compatible compiler
    installed on your system.


    ●     Windows:


    ○ Microsoft Visual C++ (MSVC): This is the native Microsoft C++ compiler, included
    with Visual Studio. You do not necessarily need the full Visual Studio IDE installed.
    You can install just the necessary command-line tools using the "Build Tools for
    Visual Studio" installer, available free from Microsoft''s website. When running
    the Visual Studio installer (either for the full IDE or just the Build Tools),
    ensure you select the "Desktop development with C++" workload. Crucially, the
    version of MSVC you install (e.g., MSVC 2019 or MSVC 2022) must match the Qt MSVC
    build you selected in the Qt Online Installer (e.g., MSVC 2019 64-bit requires
    Visual Studio 2019 build tools). The Community edition of Visual Studio is also
    free and includes the necessary compilers.'
