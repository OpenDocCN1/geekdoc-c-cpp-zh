    \ 模块（库）。每个导入都指定一个模块和通常的版本号。最基础的模块是 `QtQuick`。\n```qml\nimport QtQuick // 提供如 Item、Rectangle\
    \ 等基本类型\nimport QtQuick.Window // 提供 Window 类型\n```\n2. **根元素**：每个 `.qml` 文件必须恰好定义一个根\
    \ QML 元素（也称为对象或 Item）。该元素充当文件中定义的其他所有内容的容器。常见的根元素有 `Item`、`Rectangle` 或 `Window`。\n\
    3. **注释**：你可以使用单行（//）和多行（/* ... */）注释，就像在 C++ 中一样。\n\n### 核心概念：项目与属性\n\n- **项目\
    \ (Items)**：QML 界面的基本构建块是项目。你看到或交互的所有（以及某些非视觉元素）都是项目或派自基础 `Item` 类型。`Item` 类型本身是一个非视觉元素，通常用于组合其他项目或作为自定义组件的基类。视觉项目如\
