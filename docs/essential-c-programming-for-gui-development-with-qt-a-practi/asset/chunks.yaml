    \ true  // Assign a boolean\n}\n```\n\n## Object Hierarchy (Nesting)\n\nYou define\
    \ the structure of your UI by nesting `Item` declarations within each other. An\
    \ `Item` declared inside another becomes its visual child. Child coordinates (`x`,\
    \ `y` properties) are relative to the parent `Item`'s top-left corner.\n\n```qml\n\
    Rectangle { // Parent Rectangle\n  width: 300; height: 200\n  color: \"lightgray\"\
    \n\n  Text { // Child Text item, nested inside Rectangle\n    x: 10; y: 10  //\
    \ Position relative to parent Rectangle\n    text: \"Hello inside a Rectangle\"\
    \n  }\n}\n```\n\n## The id Property\n\nThis is a special, essential property.\
    \ You assign a unique identifier (`an id`) to an `Item` so that other `Items`\
    \ within the same QML document can refer to it. This `id` is not a string; it's\
    \ a special identifier used directly in QML code. It's crucial for positioning\
    \ elements relative to each other and for property binding (which we'll touch\
    \ upon shortly).\n\n```qml\nRectangle {\n  id: myBackground  // Assign an id to\
    \ this Rectangle\n  width: 250; height: 150\n  color: \"white\"\n}\n// Another\
    \ item could potentially refer to 'myBackground.width'\n```\n\n## Basic Visual\
    \ Item Types\n\nLet's look at three fundamental visual building blocks provided\
    \ by the `QtQuick` module:\n\n### 1. Rectangle\n\n- **Purpose**: Draws a simple\
    \ rectangle, which can be filled with a solid color or gradient, have borders,\
    \ and have rounded corners. It's often used for backgrounds, separators, or basic\
    \ shapes.\n- **Key Properties**: `width`, `height`, `color`, `gradient` (for color\
    \ gradients), `radius` (for rounded corners), `border.color`, `border.width`.\n\
    \n```qml\nimport QtQuick\nimport QtQuick.Window\n\nWindow { // Using Window as\
    \ the root element\n  width: 300; height: 200\n  visible: true\n  title: \"Basic\
    \ QML Elements\"\n\n  Rectangle {\n    id: blueRect\n    width: 150; height: 80\n\
    \    x: 20; y: 20  // Position from top-left of Window\n    color: \"lightblue\"\
    \n    border.color: \"steelblue\"\n    border.width: 2\n    radius: 8  // Rounded\
    \ corners\n  }\n}\n```\n\n### 2. Text\n\n- **Purpose**: Displays text. Provides\
    \ properties for controlling font, color, alignment, and wrapping.\n- **Key Properties**:\
    \ `text` (the string to display), `color`, `font.family`, `font.pointSize`, `font.bold`,\
    \ `font.italic`, `wrapMode` (e.g., `Text.WordWrap`), `horizontalAlignment`, `verticalAlignment`.\n\
    \n```qml\n// Add this inside the Window element from the previous example\nText\
    \ {\n  id: greetingText\n  x: blueRect.x + 10  // Position relative to blueRect's\
    \ x\n  // Position below blueRect (anchoring is better, but using x/y for now)\n\
    \  y: blueRect.y + blueRect.height + 10\n  width: 260  // Allow wrapping\n  text:\
    \ \"This is a Text item displaying styled text below the rectangle.\"\n  color:\
    \ \"darkgreen\"\n  font.pointSize: 12\n  font.italic: true\n  wrapMode: Text.WordWrap\n\
    }\n```\n\n### 3. Image\n\n- **Purpose**: Displays bitmap images like PNG, JPG,\
    \ GIF.\n- **Key Properties**:\n    - `source`: Specifies the image file path or\
    \ URL. This is crucial. Use `qrc:/` prefix for images embedded via the Qt Resource\
    \ System (e.g., `\"qrc:/images/logo.png\"`), `file:///` for local files (less\
    \ common for deployed apps), or `http://` for network images.\n    - `fillMode`:\
    \ Controls how the image scales if its size differs from the `Image` item's width/height.\
    \ Options include `Image.Stretch`, `Image.PreserveAspectFit` (fits inside, preserving\
    \ aspect ratio - common), `Image.PreserveAspectCrop` (fills, preserving aspect\
    \ ratio, cropping if needed), `Image.Tile`.\n    - `smooth`: Boolean, enables\
    \ smooth filtering when scaling (looks better, slightly more expensive).\n   \
    \ - `sourceSize`: Sometimes needed if the image format doesn't specify size, or\
    \ to treat a larger sprite sheet as a specific size.\n\n```qml\n// Add this inside\
    \ the Window element\nImage {\n  id: logoImage\n  x: 20; y: greetingText.y  //\
    \ Position below greetingText\n  source: \"qrc:/images/logo.png\"\n  fillMode:\
    \ Image.PreserveAspectFit\n  smooth: true\n}\n```\n\n## Property Binding: A Glimpse\
    \ into QML\n\nProperty binding allows one property to automatically update when\
    \ another dependent property changes. Notice how we positioned elements relative\
    \ to each other in the examples. QML is powerful through these bindings.\n\n```qml\n\
    Rectangle {\n  id: container\n  width: 200; height: 200\n  color: \"yellow\"\n\
    \n  Text {\n    // The text property is bound to the container's width\n    text:\
    \ \"Width is: \" + container.width\n    anchors.centerIn: parent\n  }\n}\n```\n"
