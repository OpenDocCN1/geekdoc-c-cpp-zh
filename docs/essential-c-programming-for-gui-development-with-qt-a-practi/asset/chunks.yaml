    \ `QVariant`，因此你需要使用 `.toType()` 方法将其转换为所需的类型。\n\n```cpp\nsettings.beginGroup(\"\
    MainWindow\");\n// 提供匹配预期类型的默认值\nQSize size = settings.value(\"size\", QSize(1024,\
    \ 768)).toSize();\nQPoint pos = settings.value(\"pos\", QPoint(100, 100)).toPoint();\n\
    settings.endGroup();\nbool wrap = settings.value(\"Editor/wrapLines\", true).toBool();\n\
    QStringList recent = settings.value(\"RecentFiles\").toStringList(); // 默认为空列表\n\
    QColor highlight = settings.value(\"HighlightColor\", Qt::white).value<QColor>();\
    \ // 使用 .value<T>()\n\n// 应用获取到的设置\n// resize(size);\n// move(pos);\n// editor->setLineWrapMode(wrap\
    \ ? QTextEdit::WidgetWidth : QTextEdit::NoWrap);\n```\n\n### 4. 范围：默认情况下，`QSettings`\
    \ 于 `QSettings::UserScope`（特定当前用户的设置）。你可以指定 `QSettings::SystemScope` 用于系统级设置，但写入这些内容通常需要管理员权限。\n\
    \n`QSettings` 非常适用于简单的键值配置数据，但不太适合存储大量数据、复杂的关系信息或特定文件格式的用户文档。\n\n## 基本文件操作：QFile\
    \ 和 QDir\n\n为了处理任意文件内容（用户文档、日志文件、自定义数据格式）并与目录结构交互，Qt 提供了 `QFile` 和 `QDir`。\n\n\
    ### QFile：读取和写入文件内容\n\n`QFile` 为单个文件的基础 IO 提供了接口。\n\n1. **打开**：使用路径创建 `QFile`\
    \ 对象。调用 `open()` 并指定模式（`QIODevice::ReadOnly`、`QIODevice::WriteOnly`、`QIODevice::ReadWrite`、`QIODevice::Append`）。在继续之前，始终检查\
    \ `open()` 是否返回 `true`。可选的 `QIODevice::Text` 标志可以在平台约定与 `\\n` 之间自动转换换行符。\n\n```cpp\n\
    #include <QFile>\n#include <QTextStream> // 用于文本 IO\n#include <QDebug>\n#include\
    \ <QStandardPaths> // 用于标准位置\n#include <QDir>           // 用于路径处理\n\nQString documentsPath\
    \ = QStandardPaths::writableLocation(QStandardPaths::DocumentsLocation);\nQString\
    \ filePath = documentsPath + QDir::separator() + \"myfile.txt\"; // 使用 separator()\
    \ 保证移植性\nQFile file(filePath);\n\n// 写入示例\nif (!file.open(QIODevice::WriteOnly\
    \ | QIODevice::Text)) {\n    qWarning() << \"无法打开文件写入:\" << file.errorString();\n\
    \    // return; // 或妥善处理错误\n} else {\n    QTextStream out(&file);\n    out <<\
    \ \"Hello from Qt Application!\" << Qt::endl; // 使用 Qt::endl 换行并刷新\n    out <<\
    \ \"Current time (CEST): \" << QDateTime::currentDateTime().toString(Qt::ISODate)\
    \ << Qt::endl;\n    // file.write(someQByteArray); // 用于二进制数据\n    file.close();\
    \ // 良好的习惯，尽管析构函数也会关闭\n}\n\n// 读取示例\nif (!file.open(QIODevice::ReadOnly | QIODevice::Text))\
    \ {\n    qWarning() << \"无法打开文件读取:\" << file.errorString();\n    // return;\n\
    } else {\n    QTextStream in(&file);\n    while (!in.atEnd()) {\n        QString\
    \ line = in.readLine();\n        qDebug() << \"读取行:\" << line;\n    }\n    //\
    \ 或者一次性读取所有（针对较小文件）：\n    // file.seek(0); // 如果行读取后需要回溯\n    // QByteArray allData\
    \ = file.readAll();\n    // qDebug() << \"读取全部:\" << QString::fromUtf8(allData);\
    \ // 假设为 UTF-8\n    file.close();\n}\n```\n\n2. 你也可以使用 `QFile` 读取通过 Qt 资源系统嵌入的文件（例如\
    \ `QFile resourceFile(\":/data/config.dat\");`）。\n\n### QDir：目录操作\n\n`QDir` 提供了查询和操作目录及路径的功能。\n\
    \n```cpp\n#include <QDir>\n#include <QStringList>\n#include <QDebug>\n#include\
    \ <QStandardPaths>\n\n// 获取标准路径（推荐！）\nQString configPath = QStandardPaths::writableLocation(QStandardPaths::ConfigLocation);\
    \ // 通常为 ~/.config/YourApp\nQString dataPath = QStandardPaths::writableLocation(QStandardPaths::AppDataLocation);\
    \ // 通常为 ~/.local/share/YourApp\n\n// 如果目录不存在则创建\nQDir configDir(configPath);\n\
    if (!configDir.exists()) {\n    if (configDir.mkpath(\".\")) // 创建 configDir 表示的路径\n\
    \        qDebug() << \"创建配置目录:\" << configPath;\n    } else {\n        qWarning()\
    \ << \"创建目录失败:\" << configPath;\n    }\n}\n\n// 列出当前目录下的文件\nQDir currentDir =\
    \ QDir::current(); // 或 QDir(\".\")\nqDebug() << \"当前路径:\" << currentDir.absolutePath();\n\
    \nQStringList entries = currentDir.entryList(QStringList() << \"*.cpp\" << \"\
    *.h\", // 按模式过滤\n    QDir::Files | QDir::NoDotAndDot, // 按类型过滤\n    QDir::Name);\
    \ // 按名称排序\nqDebug() << \"C++/头文件:\" << entries;\n\n// 检查目录是否存在\nQDir tempDir\
    \ = QDir::temp(); // 获取系统临时目录\nqDebug() << \"临时目录是否存在:\" << tempDir.exists();\n\
    ```\n\n"
- fmt: "\nWhether you're interacting with online services – perhaps fetching open\
    \ data from European Union portals, accessing financial APIs common in Frankfurt,\
    \ consuming weather data, or talking to your own application backend – or simply\
    \ need a structured way to store application configuration that's more flexible\
    \ than basic key-value pairs, you will almost certainly encounter JSON. Its simple\
    \ text-based format, based on JavaScript object literals but language-independent,\
    \ makes it easy for both humans and machines to read and write.\n\nQt Core provides\
    \ a set of classes specifically designed for parsing and manipulating JSON data\
    \ efficiently, eliminating the need for external libraries for basic JSON handling.\n\
    \n## Qt's JSON Classes\n\nThe primary classes you'll work with are:\n\n1. `QJsonValue`:\
    \ Represents a single value within a JSON structure. A `QJsonValue` can hold one\
    \ of several types: Null, Bool (true/false), Double (all numbers in JSON are doubles\
    \ technically), String, Array, or Object. It acts much like a `QVariant` but is\
    \ specific to JSON types. You'll use functions like `isString()`, `isArray()`,\
    \ `toBool()`, `toString()`, `toArray()`, `toObject()` to check the type and convert\
    \ the value.\n\n2. `QJsonArray`: Represents a JSON array (`[...]`). It holds an\
    \ ordered list of `QJsonValues`. You can access elements by index, iterate over\
    \ them, and add/remove values values. It's conceptually similar to a `QVariantList`\
    \ or `QList<QJsonValue>`.\n\n3. `QJsonObject`: Represents a JSON object (`{...}`).\
    \ It holds an unordered collection of key-value pairs, where keys are always strings\
    \ (`QString`) and values are `QJsonValues`. You can access values by key, check\
    \ for key existence, and iterate over keys. It's conceptually similar to a `QVariantMap`\
    \ or `QMap<QString, QJsonValue>`.\n\n4. `QJsonDocument`: Represents a complete\
    \ JSON document. Its main roles are to parse raw JSON data (usually from a `QByteArray`)\
    \ into a `QJsonObject` or `QJsonArray` root element, and conversely, to convert\
    \ a `QJsonObject` or `QJsonArray` back into a formatted `QByteArray` suitable\
    \ for writing to a file or sending over the network.\n\n## Parsing JSON Data (Reading\
    \ JSON)\n\nJSON data typically arrives as a sequence of bytes, often stored in\
    \ a `QByteArray` (e.g., from a `QNetworkReply` or `QFile`). Parsing involves converting\
    \ this raw data into Qt's JSON object representation.\n\n1. Parse the `QByteArray`:\
    \ Use the static `QJsonDocument::fromJson()` function. It takes the `QByteArray`\
    \ containing the JSON data and an optional pointer to a `QJsonParseError` object\
    \ to report any syntax errors. Always check for parsing errors.\n\n```cpp\n#include\
    \ <QJsonDocument>\n#include <QJsonObject>\n#include <QJsonArray>\n#include <QJsonParseError>\n\
    #include <QByteArray>\n#include <QDebug>\n\nQByteArray jsonData = /* ... get from\
    \ network reply or file ... */;\n\nQJsonParseError parseError;\nQJsonDocument\
    \ jsonDoc = QJsonDocument::fromJson(jsonData, &parseError);\n\nif (parseError.error\
    \ != QJsonParseError::NoError) {\n    qWarning() << \"Failed to parse JSON:\"\
    \ << parseError.errorString()\n    << \"at offset:\" << parseError.offset;\n \
    \   return; // Or handle error appropriately\n}\n```\n\n2. Check and Get Root\
    \ Element: A valid JSON document must have either an object or an array as its\
    \ root element. Check which one you have using `isObject()` or `isArray()` and\
    \ retrieve it using `object()` or `array()`.\n\n```cpp\nQJsonObject rootObject;\n\
    QJsonArray rootArray;\n\nif (jsonDoc.isObject()) {\n    rootObject = jsonDoc.object();\n\
    \    qDebug() << \"JSON Document is an Object.\";\n    // Proceed to access data\
    \ from rootObject...\n} else if (jsonDoc.isArray()) {\n    rootArray = jsonDoc.array();\n\
    \    qDebug() << \"JSON Document is an Array.\";\n    // Proceed to access data\
    \ from rootArray...\n} else {\n    qWarning() << \"JSON Document is neither an\
    \ object nor an array.\";\n    return;\n}\n```\n\n## Accessing Data within JSON\
    \ Structures\n\nOnce you have the root object or array, you can navigate the structure:\n\
    \n- **Accessing `QJsonObject` Values**: Use the `operator[]` or the safer `value()`\
    \ method (which returns a null `QJsonValue` if the key doesn't exist). Always\
    \ check the type (`isString`, `isDouble`, `isObject`, `isArray`, `isBool`, `isNull`)\
    \ before converting using `toString()`, `toDouble()`, `toObject()`, `toArray()`,\
    \ `toBool()`. Provide default values to conversion functions for robustness (e.g.,\
    \ `toInt(0)`).\n\n```cpp\nif (rootObject.contains(\"userName\") && rootObject[\"\
    userName\"].isString()) {\n    QString name = rootObject[\"userName\"].toString();\n\
    \    qDebug() << \"User Name:\" << name;\n}\n\ndouble score = rootObject.value(\"\
    score\").toDouble(0.0); // Provide default\nQJsonObject details = rootObject[\"\
    details\"].toObject(); // Assumes 'details' exists and is an object\n```\n\n-\
    \ **Accessing `QJsonArray` Values**: Use `operator[]` or `at()` with an index.\
    \ Check the array bounds (`index < jsonArray.size()`). Iterate using range-based\
    \ for loops. Check and convert values just like with `QJsonObject`.\n\n```cpp\n\
    if (jsonDoc.isArray()) { // Assuming root is an array of objects\n    QJsonArray\
    \ users = jsonDoc.array();\n    for (const QJsonValue &userValue : users) {\n\
    \        if (userValue.isObject()) {\n            QJsonObject user = userValue.toObject();\n\
    \            qDebug() << \"User:\" << user[\"id\"].toInt() << user[\"name\"].toString();\n\
    \        }\n    }\n    if (users.size() > 0 && users[0].isObject()) {\n      \
    \  qDebug() << \"First user email:\" << users[0].toObject()[\"email\"].toString();\n\
    \    }\n}\n```\n\n- **Nested Structures**: Chain the accessors: `QString street\
    \ = rootObject[\"address\"].toObject()[\"street\"];`.\n\n## Creating JSON Data\
    \ (Writing JSON)\n\nYou can also construct JSON programmatically using `QJsonObject`\
    \ and `QJsonArray`:\n\n1. **Build Objects/Arrays**: Create instances and populate\
    \ them. Values assigned are implicitly converted to `QJsonValue`.\n\n```cpp\n\
    QJsonObject contact;\ncontact[\"name\"] = \"Max Mustermann\";\ncontact[\"city\"\
    ] = \"Frankfurt\";\ncontact[\"age\"] = 35;\ncontact[\"active\"] = true;\n\nQJsonArray\
    \ phoneNumbers;\nphoneNumbers.append(\"+49 69 123456\");\nphoneNumbers.append(\"\
    +49 170 987654\");\ncontact[\"phones\"] = phoneNumbers; // Assign array as value\n\
    ```\n\n2. **Create `QJsonDocument`**: Wrap your root object or array in `QJsonDocument`.\n\
    \n```cpp\nQJsonDocument contactDoc(contact);\n```\n\n3. **Convert to `QByteArray`**:\
    \ Use the `toJson()` method to serialize the document into bytes. You can choose\
    \ between compact or indented format.\n\n```cpp\nQByteArray jsonDataCompact =\
    \ contactDoc.toJson(QJsonDocument::Compact);\nQByteArray jsonDataIndented = contactDoc.toJson(QJsonDocument::Indented);\
    \ // Human-readable\n\nqDebug() << \"Compact JSON:\" << jsonDataCompact;\nqDebug()\
    \ << \"Indented JSON:\" << jsonDataIndented;\n```\n\n4. This `QByteArray` can\
    \ then be sent in a `QNetworkRequest` (e.g., with `manager->post()`) or saved\
    \ to a file using `QFile`.\n"
  raw: 'Whether you''re interacting with online services – perhaps fetching open data
    from European Union portals, accessing financial APIs common in Frankfurt, consuming
    weather data, or talking to your own application backend – or simply need a structured
    way to store application configuration that''s more flexible than basic key-value
    pairs, you will almost certainly encounter JSON. Its simple text-based format,
    based on JavaScript object literals but language-independent, makes it easy for
    both humans and machines to read and write.


    Qt Core provides a set of classes specifically designed for parsing and manipulating
    JSON data efficiently, eliminating the need for external libraries for basic JSON
    handling.


    Qt''s JSON Classes


    The primary classes you''ll work with are:


    1.  QJsonValue: Represents a single value within a JSON structure. A QJsonValue
    can hold one of several types: Null, Bool (true/false), Double (all numbers in
    JSON are doubles technically), String, Array, or Object. It acts much like a QVariant
    but is specific to JSON types. You''ll use functions like isString(), isArray(),
    toBool(), toString(), toArray(), toObject() to check the type and convert the
    value.


    2.  QJsonArray: Represents a JSON array ([...]). It holds an ordered list of QJsonValues.
    You can access elements by index, iterate over them, and add/remove values. It''s
    conceptually similar to a QVariantList or QList<QJsonValue>.


    3.  QJsonObject: Represents a JSON object ({...}). It holds an unordered collection
    of key-value pairs, where keys are always strings (QString) and values are QJsonValues.
    You can access values by key, check for key existence, and iterate over keys.
    It''s conceptually similar to a QVariantMap or QMap<QString, QJsonValue>.


    4.  QJsonDocument: Represents a complete JSON document. Its main roles are to
    parse raw JSON data (usually from a QByteArray) into a QJsonObject or QJsonArray
    root element, and conversely, to convert a QJsonObject or QJsonArray back into
    a formatted QByteArray suitable for writing to a file or sending over the network.


    Parsing JSON Data (Reading JSON)


    JSON data typically arrives as a sequence of bytes, often stored in a QByteArray
    (e.g., from a QNetworkReply or QFile). Parsing involves converting this raw data
    into Qt''s JSON object representation.


    1.  Parse the QByteArray: Use the static QJsonDocument::fromJson() function. It
    takes the QByteArray containing the JSON data and an optional pointer to a QJsonParseError
    object to report any syntax errors. Always check for parsing errors.


    C++


    #include <QJsonDocument>


    #include <QJsonObject>


    #include <QJsonArray>


    #include <QJsonParseError>


    #include <QByteArray>


    #include <QDebug>


    QByteArray jsonData = /* ... get from network reply or file ... */;


    QJsonParseError parseError;


    QJsonDocument jsonDoc = QJsonDocument::fromJson(jsonData, &parseError);


    if (parseError.error != QJsonParseError::NoError) {


    qWarning() << "Failed to parse JSON:" << parseError.errorString()


    << "at offset:" << parseError.offset;


    return; // Or handle error appropriately


    }


    2.  Check and Get Root Element: A valid JSON document must have either an object
    or an array as its root element. Check which one you have using isObject() or
    isArray() and retrieve it using object() or array().


    C++


    QJsonObject rootObject;


    QJsonArray rootArray;


    if (jsonDoc.isObject()) {


    rootObject = jsonDoc.object();


    qDebug() << "JSON Document is an Object.";


    // Proceed to access data from rootObject...


    } else  if (jsonDoc.isArray()) {


    rootArray = jsonDoc.array();


    qDebug() << "JSON Document is an Array.";


    // Proceed to access data from rootArray...


    } else {


    qWarning() << "JSON Document is neither an object nor an array.";


    return;


    }


    Accessing Data within JSON Structures


    Once you have the root object or array, you can navigate the structure:


    ● Accessing QJsonObject Values: Use the operator[] or the safer value() method
    (which returns a null QJsonValue if the key doesn''t exist). Always check the
    type (isString, isDouble, isObject, isArray, isBool, isNull) before converting
    using toString(), toDouble(), toObject(), toArray(), toBool(). Provide default
    values to conversion functions for robustness (e.g., toInt(0)).


    C++


    if (rootObject.contains("userName") && rootObject["userName"].isString()) {


    QString name = rootObject["userName"].toString();


    qDebug() << "User Name:" << name;


    }


    double score = rootObject.value("score").toDouble(0.0); // Provide default


    QJsonObject details = rootObject["details"].toObject(); // Assumes ''details''
    exists and is an object


    ● Accessing QJsonArray Values: Use operator[] or at() with an index. Check the
    array bounds (index < jsonArray.size()). Iterate using range-based for loops.
    Check and convert values just like with QJsonObject.


    C++


    if (jsonDoc.isArray()) { // Assuming root is an array of objects


    QJsonArray users = jsonDoc.array();


    for (const QJsonValue &userValue : users) {


    if (userValue.isObject()) {


    QJsonObject user = userValue.toObject();


    qDebug() << "User:" << user["id"].toInt() << user["name"].toString();


    }


    }


    if (users.size() > 0 && users[0].isObject()) {


    qDebug() << "First user email:" << users[0].toObject()["email"].toString();


    }


    }


    ● Nested Structures: Chain the accessors and type conversions: QString street
    = rootObject["address"].toObject()["street"].toString();. Remember to add checks
    (isObject, contains) in production code to prevent crashes if the structure isn''t
    as expected.


    Creating JSON Data (Writing JSON)


    You can also construct JSON structures programmatically using QJsonObject and
    QJsonArray:


    1.  Build Objects/Arrays: Create instances and populate them. Values assigned
    are implicitly converted to QJsonValue.


    C++


    QJsonObject contact;


    contact["name"] = "Max Mustermann";


    contact["city"] = "Frankfurt";


    contact["age"] = 35;


    contact["active"] = true;


    QJsonArray phoneNumbers;


    phoneNumbers.append("+49 69 123456");


    phoneNumbers.append("+49 170 987654");


    contact["phones"] = phoneNumbers; // Assign array as a value


    2.  Create QJsonDocument: Wrap your root object or array in a QJsonDocument.


    C++


    QJsonDocument contactDoc(contact);


    3.  Convert to QByteArray: Use the toJson() method to serialize the document into
    bytes. You can choose between compact or indented format.


    C++


    QByteArray jsonDataCompact = contactDoc.toJson(QJsonDocument::Compact);


    QByteArray jsonDataIndented = contactDoc.toJson(QJsonDocument::Indented); // Human-readable


    qDebug() << "Compact JSON:" << jsonDataCompact;


    qDebug() << "Indented JSON:" << jsonDataIndented;


    4.  This QByteArray can then be sent in a QNetworkRequest (e.g., with manager->post())
    or saved to a file using QFile.


    Common Use Cases Revisited


    ● Network APIs: JSON is ubiquitous. Parse responses received in QNetworkReply::finished
    slots. Construct JSON objects/arrays to send as the body of POST/PUT requests
    (remembering to set the Content-Type header to application/json).


    ● Configuration Files: For complex configuration that doesn''t fit QSettings well,
    saving/loading a QJsonObject to/from a file using QFile and QJsonDocument is a
    common pattern.


    ● Data Serialization: A straightforward way to save and load the state of application
    objects (if they can be reasonably represented in JSON).


    JSON is an essential data format for modern application development, particularly
    for web service interaction and configuration. Qt provides a robust and convenient
    set of classes (QJsonDocument, QJsonObject, QJsonArray, QJsonValue) within its
    Core module for both parsing JSON data received from external sources (QJsonDocument::fromJson)
    and generating JSON data (QJsonDocument::toJson) to be sent or stored. Mastering
    these classes allows your Qt applications to seamlessly integrate with the vast
    ecosystem of JSON-based APIs and data formats. Remember to always handle potential
    parsing errors and validate data types when accessing JSON values.


    # Chapter 10:


    # Writing Efficient and Concurrent Applications


    * * *'
