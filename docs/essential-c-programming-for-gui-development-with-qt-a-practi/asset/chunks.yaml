  trans: "\n\nQt 的 `QtWidgets` 模块为构建交互式桌面应用程序提供了丰富的常用控件工具包。从简单的 `QPushButton` 和 `QLabel`\
    \ 到复杂的 `QTextEdit` 以及数据驱动的 `Item Views`（项视图），这些控件是用户看到并与之交互的构建块。通过将这些控件放入合适的布局管理器（`QHBoxLayout`、`QVBoxLayout`、`QGridLayout`、`QFormLayout`）中，你可以构建出既功能又视觉良好的界面，并优雅地适应不同的用户环境。本节涵盖了许多核心控件，但\
    \ Qt 还提供了更多专门的控件，你可以通过文档或使用集成的 `Qt Designer` 工具进行视觉化探索。\n\n## 主窗口、对话框、菜单和工具栏\n\
    \n单个控件和布局需要一个容器来承载。在典型的桌面应用程序中，这个主容器是主窗口，通常辅以对话框来处理特定的交互或显示消息。Qt 为这些常见的顶层元素提供了专用类。\n\
    \n### QMainWindow：应用程序枢纽\n\n对于大多数标准桌面应用程序的主窗口，`QMainWindow` 是首选类。它不仅仅是一个空白窗口；它具有预定义的结构，并对常见的应用程序“家具”提供了内置支持：\n\
    \n- **菜单栏**：位于顶部的水平条（或与系统栏集成，例如在 macOS 上），持有应用程序菜单（文件、编辑、帮助等）。你通过 `menuBar()`\
    \ 函数访问它。\n- **工具栏**：一个或多个区域（通常位于顶部、菜单栏下方，也可以停靠在侧边或底部），包含按钮（`QToolButton`）或其他控件，用于快速访问常用操作。工具栏通常可以由用户移动甚至作为独立窗口浮动。你使用\
    \ `addToolBar()` 添加它们。\n- **停靠窗口**：独立的子窗口（`QDockWidget`），可以停靠在中心内容周围的特定区域，或作为独立窗口浮动。非常适合工具调板、文件管理器或属性检查器等。通过\
    \ `addDockWidget()` 添加。\n- **中心部件**：这是应用程序的主要内容区域。一个 `QMainWindow` 只能有一个中心部件，使用\
    \ `setCentralWidget()` 设置。该控件通常占据窗口最大的区域。通常，你会创建一个通用的 `QWidget`（或自定义子类），在该中心部件上应用你的主布局管理器（如\
    \ `QVBoxLayout` 或 `QGridLayout`），并用你的主应用程序控件（文本编辑器、图形视图等）填充该布局。\n- **状态栏**：沿底部边缘的条，用于显示状态消息、进度指示或其他瞬时信息。通过\
    \ `statusBar()` 访问。\n\n要创建一个主应用程序窗口，你通常需要派类 `QMainWindow`，在其构造函数或专门的设置函数中设置这些元素，创建并配置中心部件，然后设置中心部件。\n\
    \n### QAction：定义可重用的命令\n\n在创建菜单和工具栏之前，理解 `QAction` 是关重要的。`QAction` 代表单一的抽象用户操作，如“打开文件”、“保存”、“复制”或“退出”。它本身不是一个控件，但包含了关于操作的信息：\n\
    \n- **文本**（例如“打开...”、“&保存” - & 定义了键盘快捷加速键）\n- **图标**（`setIcon()`）\n- **工具提示**（`setToolTip()`）\n\
    - **状态提示**（显示在状态栏中 - `setStatusTip()`）\n- **快捷键**（`setShortcut()`）\n- **可勾选状态**（`setCheckable()`）\n\
    - **启用/禁用状态**（`setEnabled()`）\n\n关键优势是可重用性。你可以为“保存”创建一个单一的 `QAction` 并将其添加到文件菜单和工具栏中。当你禁用该\
    \ `QAction` 时，它在两个地方都会显示为禁用。你将操作的 `triggered()` 信号（当通过菜单、工具栏或快捷键激活操作时发出）连接到执行实际工作的槽。这使得操作处理变得集中化。`QActions`\
    \ 通常被创建为 `QMainWindow` 子类的成员变量。\n\n```cpp\n// 在 MyMainWindow.h (或 .cpp) 中\n\n\
    #include <QAction>\n#include <QKeySequence> // 用于快捷键\n#include <QIcon> // 用于图标\n\
    \n// ... 在类声明或构造函数内部 ...\n\nsaveAction = new QAction(QIcon::fromTheme(\"document-save\"\
    ), tr(\"&Save\"), this); // 图标、文本、父对象\n\nsaveAction->setShortcut(QKeySequence::Save);\
    \ // 标准快捷键（例如 Ctrl+S）\n\nsaveAction->setStatusTip(tr(\"Save the current document\"\
    ));\n\nconnect(saveAction, &QAction::triggered, this, &MyMainWindow::saveDocument);\
    \ // 连接信号到槽\n```\n\n### 创建菜单和工具栏\n\n定义好 `QActions` 后，在你的 `QMainWindow` 子类中填充菜单和工具栏非常简单：\n\
    \n- **菜单**：\n  1. 获取菜单栏：`QMenuBar *mainMenuBar = menuBar();`\n  2. 添加顶层菜单：`QMenu\
    \ *fileMenu = mainMenuBar->addMenu(tr(\"&File\"));`\n  3. 向菜单添加操作：`fileMenu->addAction(saveAction);`\n\
    \  4. 添加分隔符：`fileMenu->addSeparator();`\n  5. 创建子菜单：`QMenu *exportMenu = fileMenu->addMenu(tr(\"\
    E&xport\")); exportMenu->addAction(exportPdfAction);`\n\n- **工具栏**：\n  1. 创建并添加工具栏：`QToolBar\
    \ *fileToolBar = addToolBar(tr(\"File Actions\"));`（返回创建的工具栏）。`addToolBar` 将其挂载到主窗口。\n\
    \  2. 添加操作：`fileToolBar->addAction(saveAction);`（通常仅用于工具栏）。\n  3. 添加分隔符：`fileToolBar->addSeparator();`\n\
    \  4. 添加其他控件：`fileToolBar->addWidget(new QComboBox());`\n\n### 对话框 (QDialog)：聚焦交互\n\
    \n对话框是用于以聚焦方式与用户交互的辅助窗口——提示输入、提供选择或显示消息。它们派自 `QDialog`。\n\n- **模态对话框**：在对话框关闭之前阻塞应用程序中所有窗口的输入。使用\
    \ `exec()` 显示模态对话框。`exec()` 调用只有在对话框关闭时才会返回，返回类似 `QDialog::Accepted` 或 `QDialog::Rejected`\
    \ 的结果代码（通常通过将确定/取消按钮连接到对话框的 `accept()` 和 `reject()` 槽来触发）。模态对话框用于在对话框完成之前不应使用主窗口的关键交互（例如：登录提示、确认消息）。\n\
    - **非模态对话框**：允许用户在对话框打开时与其他窗口进行交互。使用 `show()`（或用于不同激活行为的 `open()`）。通信通常通过连接对话框和主窗口之间的信号和槽进行。非模态对话框用于辅助工具，如查找/替换窗口或非关键状态显示。\n\
    \n- **标准对话框**：Qt 提供了方便的静态函数来调用常见的平台原生对话框。使用这些函数可以确保你的应用程序符合 Windows、macOS 或 Linux\
    \ 用户预期的外观感受（细微的风格差异是正常的，反映了平台习惯，即使在德国与美国相比也是如此）。\n\n  1. `QMessageBox::information(parent,\
    \ title, text)` / `question(...)` / `warning(...)` / `critical(...)`：显示带有不同图标和按钮组的消息框。\n\
    \  2. `QFileDialog::getOpenFileName(...)` / `getSaveFileName(...)` / `getExistingDirectory(...)`：显示选择文件或文件夹的对话框。\n\
    \  3. `QFontDialog::getFont(...)`：允许用户选择字体。\n  4. `QColorDialog::getColor(...)`：允许用户选择颜色。\n\
    \n- **自定义对话框**：对于标准对话框之外的特定需求，你可以通过派生 `QDialog` 创建自己的对话框。\n\n  1. 在你的自定义对话框类中设计\
    \ UI，像使用其他 `QWidget` 一样使用控件和布局。\n  2. 添加按钮（通常为“确定”和“取消”）。\n  3. 将“确定”按钮的 `clicked()`\
    \ 信号连接到对话框内置的 `accept()` 槽。\n  4. 将“取消”按钮的 `clicked()` 信号连接到对话框内置的 `reject()`\
    \ 槽。\n  5. 提供公共成员函数以便在对话框被接受后获取用户输入的数据。\n\n"
- fmt: "\n```cpp\n// In the code that shows the custom dialog (e.g., MyMainWindow)\n\
    \n#include \"logindialog.h\" // Your custom dialog header\n\nvoid MyMainWindow::showLoginDialog()\
    \ {\n    LoginDialog dialog(this); // Create instance, 'this' is parent\n\n  \
    \  if (dialog.exec() == QDialog::Accepted) {\n        // Dialog was accepted (e.g.,\
    \ OK clicked)\n        QString username = dialog.username(); // Custom getter\
    \ function\n        QString password = dialog.password(); // Custom getter function\n\
    \        attemptLogin(username, password);\n    } else {\n        // Dialog was\
    \ rejected (e.g., Cancel clicked or closed)\n        qDebug() << \"Login cancelled.\"\
    ;\n    }\n}\n```\n\n# The Central Widget Revisited\n\nRemember that the `QMainWindow`\
    \ provides the frame (menus, toolbars, etc.), but the main application content\
    \ lives within the single widget set via `setCentralWidget()`. This central widget\
    \ is usually where you'll apply your most complex layouts containing the core\
    \ interactive elements of your application.\n\n`QMainWindow` provides the standard\
    \ structure for main application windows, integrating menus, toolbars, dock widgets,\
    \ a status bar, and a central content area. `QDialog` is the base for creating\
    \ secondary interaction windows, which can be modal (`exec()`) or modeless (`show()`).\
    \ `QAction` is fundamental for defining reusable commands placed in menus and\
    \ toolbars. Qt also offers convenient standard dialogs (`QMessageBox`, `QFileDialog`,\
    \ etc.) for common tasks, while custom dialogs allow for tailored user input.\
    \ By combining these top-level windows with layouts and the core widgets discussed\
    \ previously, you can construct well-structured, fully featured graphical applications\
    \ using `Qt Widgets`.\n\n# Chapter 5: Customization and Visual Appeal\n\n## Subclassing\
    \ Existing Widgets and Painting with `QPainter`\n\nQt's built-in widget library\
    \ is comprehensive, covering most common user interface elements. However, applications\
    \ often require specialized controls to present information uniquely, provide\
    \ novel interactions, or simply encapsulate a recurring pattern of standard widgets\
    \ into a reusable component. Creating custom widgets allows you to extend Qt's\
    \ capabilities and tailor your application's interface precisely to your needs.\
    \ There are two primary strategies for creating custom widgets in the `QtWidgets`\
    \ module.\n\n## Approach 1: Composition - Subclassing and Combining Existing Widgets\n\
    \nThis approach is essentially about building a larger, specialized widget out\
    \ of smaller, standard Qt widgets. You create a new class that inherits from `QWidget`\
    \ (or occasionally a more specific class like `QFrame` if you need its features\
    \ like a visible border) and manage internal child widgets using layouts.\n\n\
    **Concept:** Think of it like building with blocks. Your custom widget acts as\
    \ a container, holding and arranging standard Qt widgets (like `QLabel`, `QLineEdit`,\
    \ `QPushButton`, `QSlider`, etc.) to create a compound control with its own specific\
    \ interface and behavior.\n\n**Use Cases:** This method is ideal when:\n* You\
    \ need to group several standard widgets that always appear together (e.g., a\
    \ label next to a slider, a line edit with a browse button).\n* You want to create\
    \ a reusable component with a defined interface (signals, slots, properties) built\
    \ from standard parts.\n* You want to maintain the look, feel, and accessibility\
    \ features of the underlying standard widgets.\n\n**Implementation Steps:**\n\n\
    1. **Subclass `QWidget`**: Create your new class inheriting from `QWidget`.\n\
    2. **Add `Q_OBJECT` Macro**: Include this if your custom widget needs its own\
    \ signals, slots, or properties to communicate with the outside world.\n3. **Create\
    \ Child Widgets**: In the constructor of your custom widget class, create instances\
    \ of the standard widgets you need (e.g., `QLabel`, `QSlider`). Pass this as the\
    \ parent to ensure proper object lifetime management if your custom widget is\
    \ deleted.\n4. **Create and Apply Layout**: Instantiate a suitable layout manager\
    \ (`QHBoxLayout`, `QVBoxLayout`, `QGridLayout`, etc.). Add your child widgets\
    \ to this layout. Finally, call `this->setLayout(yourLayout);` to install the\
    \ layout onto your custom widget. The layout will now manage the geometry of the\
    \ child widgets within the bounds of your custom widget.\n5. **Define Interface**:\
    \ Expose the necessary functionality. This often involves:\n    * Creating public\
    \ slots to allow external code to control the state of the internal widgets.\n\
    \    * Emitting custom signals when significant events occur within the widget\
    \ (e.g., a value changes). You might connect internal widget signals (like a `QSlider`'s\
    \ `valueChanged`) to private slots in your custom widget, which then emit your\
    \ custom, higher-level signal.\n    * Defining properties (`Q_PROPERTY`) that\
    \ map to the relevant state of the internal widgets.\n\n**Example Idea (LabeledSlider):**\
    \ Imagine a widget combining a `QLabel` and a `QSlider` horizontally.\n* Inherit\
    \ `QWidget`.\n* Constructor creates `m_label = new QLabel(this);` and `m_slider\
    \ = new QSlider(Qt::Horizontal, this);`.\n* Create `QHBoxLayout`, add `m_label`,\
    \ then `m_slider`.\n* Call `setLayout(layout);`.\n* Add `Q_PROPERTY` for value\
    \ with `READ (value())`, `WRITE (setValue(int))`, `NOTIFY (valueChanged(int))`.\n\
    * Implement `value()` to return `m_slider->value()`.\n* Implement `setValue(int)`\
    \ to call `m_slider->setValue(val)`.\n* Connect `m_slider->valueChanged` signal\
    \ to a private slot `onSliderValueChanged(int)`.\n* In `onSliderValueChanged`,\
    \ potentially update the label (`m_label->setNum(val)`) and emit `valueChanged(val);`.\n\
    \nThis composition approach is powerful for creating reusable UI components relatively\
    \ quickly by leveraging existing Qt building blocks.\n\n## Approach 2: Custom\
    \ Painting with `QPainter`\n\nWhen you need a widget with a completely unique\
    \ visual appearance or graphical representation that cannot be achieved by combining\
    \ standard widgets or styling, you need to take control of the drawing process.\
    \ This involves subclassing `QWidget` (or another suitable base) and reimplementing\
    \ its `paintEvent` function using `QPainter`.\n\n**Concept:** Instead of relying\
    \ on child widgets or style sheets, you provide C++ code that explicitly draws\
    \ every line, shape, pixel, or piece of text required to render your widget.\n\
    \n### paintEvent Function\n* This is a protected virtual function inherited from\
    \ `QWidget`.\n* Qt calls this function whenever all or part of your widget needs\
    \ to be redrawn. This happens when the widget is first shown, resized, uncovered\
    \ after being obscured, or explicitly scheduled for update via `update()`.\n*\
    \ You must reimplement this function in your subclass to perform custom drawing.\
    \ The `QPaintEvent* event` argument contains details about the region needing\
    \ update, which can sometimes be used for optimization, but often you'll redraw\
    \ the entire widget state within the event handler.\n\n### Using QPainter\n`QPainter`\
    \ is Qt's versatile 2D graphics engine. You use it inside `paintEvent`.\n\n1.\
    \ **Create a `QPainter`**: The first step in `paintEvent` is usually creating\
    \ a `QPainter` object on the stack, passing `this` (the widget being painted)\
    \ as the \"paint device\":\n```cpp\nvoid MyCustomWidget::paintEvent(QPaintEvent\
    \ *event) {\n    QPainter painter(this);\n    // ... painting commands go here\
    \ ...\n} // painter goes out of scope and cleans up automatically\n```\n\n2. **Set\
    \ Painter State**: `QPainter` works like a state machine. You configure its drawing\
    \ parameters before issuing drawing commands. Key parameters include:\n    * **Pen\
    \ (`QPen`)**: Controls how lines and outlines are drawn (color, width, style like\
    \ solid, dashed). Set using `painter.setPen(QPen(Qt::blue, 2));`.\n    * **Brush\
    \ (`QBrush`)**: Controls how shapes are filled (color, pattern like solid, gradient,\
    \ texture). Set using `painter.setBrush(Qt::red);` or `painter.setBrush(Qt::NoBrush);`.\n\
    \    * **Font (`QFont`)**: Controls the appearance of text. Set using `painter.setFont(QFont(\"\
    Arial\", 12));`.\n    * **Rendering Hints**: Improve drawing quality, especially\
    \ for shapes. `painter.setRenderHint(QPainter::Antialiasing, true);` is highly\
    \ recommended for smooth edges.\n\n3. **Draw**: Call `QPainter`'s drawing methods,\
    \ which use the currently set pen, brush, and font.\n"
