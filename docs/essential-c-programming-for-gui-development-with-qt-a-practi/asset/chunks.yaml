    file.close();


    }


    2.  You can also use QFile to read files embedded via the Qt Resource System (e.g.,
    QFile resourceFile(":/data/config.dat");).


    QDir: Directory Operations


    QDir provides functionality for querying and manipulating directories and paths.


    C++


    #include <QDir>


    #include <QStringList>


    #include <QDebug>


    #include <QStandardPaths>


