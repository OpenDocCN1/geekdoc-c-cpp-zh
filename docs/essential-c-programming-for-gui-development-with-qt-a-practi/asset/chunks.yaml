    -   **概念**：创建一个包含你的可执行文件、必要的 Qt `.so` 文件（从构建环境拷贝）、所需的 Qt 插件（例如 `platforms/libqxcb.so`），并可能尝试打包运行时库（`libstdc++.so.6`,
    `libgcc_s.so.1`）和其他依赖项。然后使用 Shell 脚本（`run.sh`）在启动可执行文件之前设置 `LD_LIBRARY_PATH` 环境变量，指向打包的库。

    -   **工具**：第三方工具 `linuxdeployqt` 尝试自动拷贝 Qt 组件和某些系统依赖项，通常在此方法或配合 AppImage 使用。

    -   **缺点**：极其脆弱。打包如 `GLIBC` 或 `libstdc++` 等核心系统库很容易与用户系统上安装的版本发生冲突，导致崩溃。很难在不同的发行版中识别所有必要的依赖项。`LD_LIBRARY_PATH`
    通常被认为是分发中的不良做法。这种方法通常不用于广泛发布应用程序。


    ## 3. 现代通用打包格式（推荐）

    这些格式旨在通过将应用程序及其大部分或全部所需的库打包成单一的、自包含的软件包，并设计能够在广泛的 Linux 发行版上运行。


    -   **AppImage**：将应用程序及其依赖项打包成单个可执行文件（`.AppImage`）。用户下载此文件，使其具有可执行权限（`chmod +x`）并直接运行，而无需安装。它在镜像内部打包了所需的库。使用
    `linuxdeployqt`（通常带有 appimage 插件）或 `appimagetool` 工具来创建它们。对于初学者来说相对简单，并且适合从网站直接下载。

    -   **Flatpak**：一种流行的沙箱格式。应用程序在隔离的环境中运行，增强了安全性。它使用共享的“运行时”（例如 Freedesktop 运行时、KDE/GNOME
    运行时，通常包含 Qt），这些运行时只需安装一次即可供多个 Flatpak 应用共享，从而减少了重复。运行时未包含的特定特定依赖项将打包在 Flatpak
    内部。Flatpak 提供了更好的桌面集成（菜单项、MIME 类型），通常通过 Flathub 等仓库进行分发。创建 Flatpak 更加复杂，需要详细的清单文件（`.json`
    或 `.yaml`）并使用 `flatpak-builder` 工具。

    -   **Snap**：Canonical（Ubuntu 的母公司）提供的替代沙箱格式。目标与 Flatpak 类似（打包、安全、运行时/基础）。主要通过
    Snap Store 分发。


    ## 4. 分发策略

    对于在 2025 年向广泛的 Linux 用户分发图形 Qt 应用程序，AppImage 和 Flatpak 通常是首选解决方案，它们在跨发行兼容性和依赖管理之间提供了最佳平衡。


    ## 测试至关重要（尤其是 Linux！）

    鉴于 Linux 世界的多样性，测试比在 Windows 或 macOS 上更为关键。在你主要目标发行版的全新安装上（例如最新的 Ubuntu LTS、当前的
    Fedora、可能是 Debian 稳定版）测试你选择的部署包（AppImage, Flatpak, `.deb/.rpm`），以确保满足依赖且应用程序运行正常。


    ## 结论

    在 macOS 上部署 Qt 应用程序涉及创建自包含的 `.app` 包，通常使用 `macdeployqt` 处理 Qt 框架和路径调整，随后为了分发必须进行强制的代码签名和公证。在
    Linux 上，平台的多样性带来了挑战，这使得 AppImage 和 Flatpak 等现代通用格式成为推荐的方法，优于脆弱的手动打包或劳动密集型的原生打包。无论在哪个平台，理解特定的依赖需求、使用适当的
    Qt 部署工具并在干净的目标系统上进行严格测试，都是成功将应用程序交付给终端用户的关键步骤。


    # 附录 A：Qt 模块概述

    好的，本附录简要概述主章节未深入介绍的一些重要 Qt 模块。Qt 是一个庞大的框架，结构由许多模块（库）组成，允许开发者仅包含特定应用程序所需的功能。此列表并非详无完尽，但它突出了常用模块，并根据你的项目需求提供了进一步探索的指引。请记住，使用任何模块通常需要将其添加到构建系统配置中（`.pro`
    文件中的 `QT += modulename`，或者在 CMake 中更新 `find_package` 和 `target_link_libraries`），并包含相关的
    C++ 头文件或导入 QML 模块。你所使用的 Qt 版本的官方 Qt 文档始终是权威参考。


    Qt 的模块化设计允许了可扩展性和灵活性。以下是一些关键模块，为了清晰起见进行了分类：


    ### 核心模块（已广泛介绍）

    -   **Qt Core**：绝对的基础。提供核心非 GUI 类，如 `QObject`（以及元对象系统、信号/槽）、容器（`QString`, `QList`,
    `QVector`, `QMap`, `QHash`）、`QVariant`、线程支持（`QThread`, `QMutex`）、事件循环（`QEventLoop`）、文件
    IO（`QFile`, `QDir`）、应用程序设置（`QSettings`）、JSON 支持（`QJsonDocument` 等）、插件和基础工具。几乎所有的
    Qt 应用程序都需要。

    -   **Qt GUI**：GUI 编程的基础类，独立于特定的 UI 技术（Widgets 或 Quick）。处理窗口系统集成、事件处理（`QEvent`）、2D
    图形（`QPainter`, `QImage`, `QPixmap`, `QColor`, `QFont`）、基础 OpenGL/Vulkan 集成。它是
    Qt Widgets 和 Qt Quick 的依赖。

    -   **Qt Widgets**：用于创建经典的、平台集成桌面用户界面的模块。包含 `QWidget`、布局管理器（`QHBoxLayout` 等）以及系列标准控件（`QPushButton`,
    `QLineEdit`, `QTableView`, `QMainWindow`, `QDialog` 等）。

    -   **Qt QML**：提供引擎（`QQmlApplicationEngine`, `QQmlContext`）以及 QML 语言的基础，能够解析和执行
    `.qml` 文件。

    -   **Qt Quick**：使用 QML 构建现代流畅用户界面的框架。包括视觉渲染、基础视觉项（`Item`, `Rectangle`, `Text`,
    `Image`）、动画框架、状态管理、定位工具（锚点、定位器）和输入处理（`MouseArea`）。

    -   **Qt Quick Controls**：一组标准 控件（如 `Button`, `TextField`, `Slider`, `ComboBox`,
    `TabView`），使用 QML 实现，设计用于在 Qt Quick 应用中方便样式。

    -   **Qt Network**：网络编程的类，支持通过 TCP/IP 和 UDP 进行通信，并为 HTTP/HTTPS 等常用协议提供高级 API（`QNetworkAccessManager`,
    `QNetworkRequest`, `QNetworkReply`）。还包含 SSL/TLS 支持。


    ### 数据处理与存储

    -   **Qt SQL**：提供与平台和数据库无关的接口，用于操作 SQL 数据库（`QSqlDatabase`, `QSqlQuery`）。包含模型类（`QSqlQueryModel`,
    `QSqlTableModel`），用于将数据库结果集成到 Qt 的模型/视图框架中。

    -   **Qt XML**：提供读取和写入 XML 文档的 API，可以使用流方法（`QXmlStreamReader`, `QXmlStreamWriter`）或文档对象模型（DOM）表示（`QDomDocument`）。

    -   **Qt Concurrent**：一个编写多线程代码的高级框架，无需直接管理 `QThread` 对象。提供了如 `QtConcurrent::run`
    等在线程池中执行函数的函数，以及用于并行处理数据结构的 map/filter/reduce 操作。


    ### 图形、可视化与多媒体

    -   **Qt Multimedia**：提供处理音频和视频播放（`QMediaPlayer`, `QAudioOutput`）、录制和摄像头控制（`QMediaCaptureSession`）的类。


