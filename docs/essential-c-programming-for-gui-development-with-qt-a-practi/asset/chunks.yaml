    Use Cases: This method is ideal when:


    ● You need to group several standard widgets that always appear together (e.g.,
    a label next to a slider, a line edit with a browse button).


    ● You want to create a reusable component with a defined interface (signals, slots,
    properties) built from standard parts.


    ● You want to maintain the look, feel, and accessibility features of the underlying
    standard widgets.


    Implementation Steps:


    1.  Subclass QWidget: Create your new class inheriting from QWidget.


    2.  Add Q_OBJECT Macro: Include this if your custom widget needs its own signals,
    slots, or properties to communicate with the outside world.


    3.  Create Child Widgets: In the constructor of your custom widget class, create
    instances of the standard widgets you need (e.g., QLabel, QSlider). Pass this
    as the parent to ensure proper object lifetime management if your custom widget
    is deleted.


    4.  Create and Apply Layout: Instantiate a suitable layout manager (QHBoxLayout,
    QVBoxLayout, QGridLayout, etc.). Add your child widgets to this layout. Finally,
    call this->setLayout(yourLayout); to install the layout onto your custom widget.
    The layout will now manage the geometry of the child widgets within the bounds
    of your custom widget.


    5.  Define Interface: Expose the necessary functionality. This often involves:


    ○ Creating public slots to allow external code to control the state of the internal
    widgets.


    ○ Emitting custom signals when significant events occur within the widget (e.g.,
    a value changes). You might connect internal widget signals (like a QSlider''s
    valueChanged) to private slots in your custom widget, which then emit your custom,
    higher-level signal.


    ○ Defining properties (Q_PROPERTY) that map to the relevant state of the internal
    widgets.


    Example Idea (LabeledSlider): Imagine a widget combining a QLabel and a QSlider
    horizontally.


    ●     Inherit QWidget.


    ● Constructor creates m_label = new QLabel(this); and m_slider = new QSlider(Qt::Horizontal,
    this);.


    ●     Create QHBoxLayout, add m_label, then m_slider.


    ●     Call setLayout(layout);.


    ● Add Q_PROPERTY for value with READ (value()), WRITE (setValue(int)), NOTIFY
    (valueChanged(int)).


    ●     Implement value() to return m_slider->value().


    ●     Implement setValue(int) to call m_slider->setValue(val).


    ●     Connect m_slider->valueChanged signal to a private slot onSliderValueChanged(int).


    ● In onSliderValueChanged, potentially update the label (m_label->setNum(val))
    and emit valueChanged(val);.


    This composition approach is powerful for creating reusable UI components relatively
    quickly by leveraging existing Qt building blocks.


    Approach 2: Custom Painting with QPainter


    When you need a widget with a completely unique visual appearance or graphical
    representation that cannot be achieved by combining standard widgets or simple
    styling, you need to take control of the drawing process yourself. This involves
    subclassing QWidget (or another suitable base) and reimplementing its paintEvent
    function using QPainter.


    Concept: Instead of relying on child widgets or style sheets to define appearance,
    you provide C++ code that explicitly draws every line, shape, pixel, or piece
    of text required to render your widget.


    The paintEvent Function:


    ●     This is a protected virtual function inherited from QWidget.


    ● Qt calls this function whenever all or part of your widget needs to be redrawn.
    This happens when the widget is first shown, resized, uncovered after being obscured,
    or explicitly scheduled for an update via update().


    ● You must reimplement this function in your subclass to perform custom drawing.
    The QPaintEvent* event argument contains details about the region needing update,
    which can sometimes be used for optimization, but often you''ll redraw the entire
    widget state within the event handler.


    Using QPainter:


    QPainter is Qt''s versatile 2D graphics engine. You use it inside your paintEvent.


    1.  Create a QPainter: The first step in paintEvent is usually creating a QPainter
    object on the stack, passing this (the widget being painted) as the "paint device":


    C++


    void  MyCustomWidget::paintEvent(QPaintEvent *event) {


    QPainter painter(this);


    // ... painting commands go here ...


    } // painter goes out of scope and cleans up automatically


    2.  Set Painter State:  QPainter works like a state machine. You configure its
    drawing parameters before issuing drawing commands. Key parameters include:


    ○ Pen (QPen): Controls how lines and outlines are drawn (color, width, style like
    solid, dashed). Set using painter.setPen(QPen(Qt::blue, 2));.


    ○ Brush (QBrush): Controls how shapes are filled (color, pattern like solid, gradient,
    texture). Set using painter.setBrush(Qt::red); or painter.setBrush(Qt::NoBrush);.


    ○ Font (QFont): Controls the appearance of text. Set using painter.setFont(QFont("Arial",
    12));.


    ○ Rendering Hints: Improve drawing quality, especially for shapes. painter.setRenderHint(QPainter::Antialiasing,
    true); is highly recommended for smooth edges.


    3.  Draw: Call QPainter''s drawing methods, which use the currently set pen, brush,
    and font:'
