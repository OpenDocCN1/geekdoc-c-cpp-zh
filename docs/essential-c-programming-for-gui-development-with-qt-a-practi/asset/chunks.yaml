  trans: "\n\n对于单线程应用程序，`AutoConnection` 实际上意味着 `DirectConnection`。在处理多线程时，你通常会显式使用\
    \ `QueuedConnection` 用于线程间发送的信号，以确保线程安全。\n\n## 断开信号与槽\n\n虽然断开连接不如连接常见，但你可以使用 `QObject::disconnect`\
    \ 断开已建立的连接。你通常需要提供与 `connect` 调用类似的参数，以标识要断开的特定连接。现代 C++ 实践（例如使用 `connect` 返回的\
    \ `QMetaObject::Connection` 对象，或依赖于对象销毁时的自动断开连接）通常减少了手动断开连接的需求。\n\n信号与槽机制是 Qt\
    \ 编程的基石，实现了对象之间健壮且解耦的通信。通过在发射类中定义信号并将其连接到接收类中的槽（成员函数、自由函数或 Lambda 表达式），你可以创建出灵活且易于维护的应用程序。始终优先使用\
    \ `QObject::connect` 的现代成员函数指针或 Lambda 语法，以获得编译时安全的优势。在处理多线程时，理解连接类型至关重要，`Qt::AutoConnection`\
    \ 是默认值，而 `Qt::QueuedConnection` 对于安全的跨线程调用至关重要。这种强大的机制构成了整个 Qt 框架事件处理和动态行为的基础。\n\
    \n## 元对象系统与 Qt 属性：驱动内省与绑定\n\n虽然信号与槽提供了强大的通信机制，但它们只是 Qt 内部更大型基础设施的一个面，该基础设施被称为元对象系统（MOS）。该系统赋予了\
    \ Qt 远超标准 C++ 运行时类型信息（RTTI）的能力，实现了诸如内省（在运行时查询对象结构）、动态属性访问以及信号/槽机制本身等功能。通过该系统暴露的关键组件是\
    \ Qt 属性（Property），它提供了一种管理和观察 `QObject` 状态的标准方法。\n\n### 元对象系统 (MOS)：为什么 Qt 需要更多\n\
    \n标准 C++ 通过 `typeid`（用于类型识别）和 `dynamic_cast`（用于继承层次结构中的安全向下转换）提供了基础的 RTTI。然而，Qt\
    \ 的目标需要多得运行时信息：\n\n- 通过名称发现对象可用的信号和槽。\n- 使用字符串名称动态调用方法（槽）。\n- 在无需编译时感知的情况下，通过名称获取和设置对象属性（属性）。\n\
    - 查询类继承关系（`inherits()`）。\n- 为信号/槽连接提供底层机制。\n\n为了实现这一点，Qt 采用了多种组件的组合：\n\n1. **QObject\
    \ 基类**：提供了元对象交互的根本锚点和 API（`metaObject()`、`property()`、`setProperty()` 等）。\n2.\
    \ **Q_OBJECT 宏**：该宏放置在类声明的私有部分，向 Qt 工具指示该类需要元对象能力。它声明了基础的元素，例如静态成员 `metaObject()`。\
    \ \n3. **元对象编译器 (MOC)**：如前所述，这个至关重要的预处理工具会扫描你的头文件，查找包含 `Q_OBJECT` 宏的类。它解析对信号、槽（使用\
    \ `slots` 关键字或识别的签名）以及属性（`Q_PROPERTY`）的声明。基于此，MOC 会生成一个辅助 C++ 源文件，其中包含元对象功能的实现，包括该类的静态\
    \ `QMetaObject` 实例以及信号发射和动态调用所需的代码。这些生成的代码会被编译并链接到你的最终应用程序中。\n4. **QMetaObject\
    \ 类**：对于每个使用 `Q_OBJECT` 的 `QObject` 派生类，都存在该类的实例。它存储了关于类的所有内省信息：名称、父类名称、方法列表（包括信号和槽）、属性、枚举以及使用特定宏声明的构造函数。你可以通过对象的\
    \ `metaObject()` 成员函数在运行时访问对象的元对象。\n\n这些组件共同允许 Qt 执行仅靠标准 C++ RTTI 无法完成的任务，构成了\
    \ Qt 动态特性的骨干。\n\n### Qt 属性：结构化的状态暴露\n\n虽然你可以使用公共成员变量或 getter/setter 方法来管理对象的状态，但\
    \ Qt 属性为 `QObject` 派生类提供了一种更强大、更正式的机制。属性将特性（如文本、值、颜色）与访问函数（读/写）以及至关重要的更改通知信号配对。\n\
    \n属性在类定义中使用 `Q_PROPERTY` 宏进行声明：\n\n```cpp\nQ_PROPERTY(Type name READ readFunc\
    \ WRITE writeFunc NOTIFY notifySignal MEMBER memberName ...)\n```\n\n`Q_PROPERTY`\
    \ 声明中的关键属性：\n\n- **Type**：属性的数据类型（例如 `int`、`bool`、`QString`、`QColor`，甚至是用元系统注册的自定义类型）。\n\
    - **name**：识别属性的标识符（作为 C++ 标记，初始时不是字符串），例如 `text`、`value`、`enabled`。此名称用于动态访问。\n\
    - **READ readFunc**：指定用于读取属性值的常量成员函数（getter）。这对于可读属性是至关重要的。\n- **WRITE writeFunc**：指定用于更改属性值的成员函数（setter）。这对于可写属性是要求的。理想情况下，setter\
    \ 应在值实际发生变化时才发射 `notify` 信号。\n- **NOTIFY notifySignal**：指定对象在属性值更改后必须立即发射的信号。这对于更改通知和数据绑定至关重要。信号通常应该将新值作为参数，尽管属性系统本身并不强制要求这一点。\n\
    - **MEMBER memberName**：（自 Qt 5.1 起）对于直接暴露成员变量的简单属性，它是使用 `READ` 和 `WRITE` 的替代方案。该变量必须与一个\
    \ `NOTIFY` 信号相关联。虽然对于简单情况很方便，但相比显式的 getter/setter 函数，它的封装性略差。\n- **其他属性**：`RESET`（指定重置函数）、`DESIGNABLE`（对设计工具的提示）、`USER`（标记属性在编辑器中可编辑）、`CONSTANT`（用于构造后值不会改变的属性）、`FINAL`（属性无法在子类中重写）。\n\
    \n让我们通过属性增强我们的 `Counter` 示例：\n\n```cpp\n#include <QObject>\n#include <QDebug>\n\
    \nclass Counter : public QObject {\n    Q_OBJECT\n    // 将 value 定义为属性：Type=int,\
    \ Name=value, Getter=value, Setter=setValue, Notifier=valueChanged\n    Q_PROPERTY(int\
    \ value READ value WRITE setValue NOTIFY valueChanged)\n\n    public:\n      \
    \  explicit Counter(QObject *parent = nullptr) : QObject(parent), m_value(0) {}\n\
    \n        // 用于 value 属性的 READ 函数\n        int value() const { return m_value;\
    \ }\n\n    public slots:\n        // 用于 value 属性的 WRITE 函数\n        void setValue(int\
    \ value) {\n            if (m_value == value)\n                return; // 只在值不同时进行更改并通知\n\
    \            m_value = value;\n            qDebug() << \"通过属性设置更改 Counter 值为:\"\
    \ << m_value;\n            emit valueChanged(m_value); // 发射 NOTIFY 信号\n     \
    \   }\n\n    signals:\n        // 用于 value 属性的 NOTIFY 信号\n        void valueChanged(int\
    \ newValue);\n\n    private:\n        int m_value;\n};\n```\n\n现在，值特性被正式暴露为属性，并与其\
    \ getter、setter 和通知信号关联。\n\n### 内省与动态属性访问\n\n元对象系统允许你在运行时动态交互属性，而无需特定的 C++ 类类型（只要知道它是\
    \ `QObject`）。\n\n- **查询元数据**：你可以访问 `QMetaObject` 并检查属性细节：\n\n```cpp\nCounter *counter\
    \ = new Counter();\nconst QMetaObject *metaObj = counter->metaObject();\nqDebug()\
    \ << \"Class:\" << metaObj->className();\nint propIndex = metaObj->indexOfProperty(\"\
    value\");\nif (propIndex != -1) {\n```\n\n"
- fmt: "\n```cpp\nQMetaProperty metaProp = metaObj->property(propIndex);\n\nqDebug()\
    \ << \"Property Name:\" << metaProp.name(); // Output: \"value\"\n\nqDebug() <<\
    \ \"Property Type:\" << metaProp.typeName(); // Output: \"int\"\n\nqDebug() <<\
    \ \"Readable:\" << metaProp.isReadable(); // Output: true\n\n}\n```\n\n### Generic\
    \ Access\n`QObject` provides generic functions to read and write properties using\
    \ their string names. These functions use `QVariant`, Qt's versatile class for\
    \ holding many different data types.\n\n```cpp\nCounter *counter = new Counter();\n\
    \n// Write property dynamically using setProperty\n\nbool ok = counter->setProperty(\"\
    value\", 50); // Pass name as string, value in QVariant\n\nqDebug() << \"setProperty\
    \ successful:\" << ok;\n\n// Read property dynamically using property\n\nQVariant\
    \ currentValue = counter->property(\"value\"); // Returns value in QVariant\n\n\
    if (currentValue.isValid() && currentValue.canConvert<int>()) {\n\nqDebug() <<\
    \ \"Current value read dynamically:\" << currentValue.toInt(); // Output: 50\n\
    \n}\n```\n\nThis dynamic access is heavily used by scripting engines, UI designers,\
    \ and the QML engine.\n\n### Properties and Data Binding: The Power of NOTIFY\n\
    The real power of properties, especially in modern UI development with Qt Quick/QML,\
    \ comes from the `NOTIFY` signal. When you bind a QML element's attribute to a\
    \ C++ property:\n\n```qml\n// In QML\nText {\n\n// Bind the 'text' attribute to\
    \ the 'value' property of 'myCppCounter'\ntext: myCppCounter.value.toString()\
    \ // Assuming myCppCounter is exposed to QML\n}\n```\n\nThe QML engine establishes\
    \ a connection behind the scenes. It connects an internal update mechanism to\
    \ the `valueChanged` signal (the `NOTIFY` signal for the `value` property) of\
    \ the `myCppCounter` object. Whenever the C++ code calls `setValue()` and emits\
    \ `valueChanged()`, the QML engine receives this signal and automatically knows\
    \ it needs to re-evaluate the binding and update the `Text` element's `text` attribute.\
    \ This creates a seamless, reactive link between your C++ backend logic and your\
    \ QML frontend without manual update calls.\n\n### Dynamic Properties\nIt's also\
    \ possible to add properties to a `QObject` instance at runtime without declaring\
    \ them via `Q_PROPERTY`, simply by calling `setProperty(\"newPropertyName\", value)`.\
    \ These \"dynamic properties\" are stored internally but lack the full metadata\
    \ (like specific `NOTIFY` signals) associated with declared properties. They are\
    \ primarily useful for attaching arbitrary user data to objects temporarily. Rely\
    \ on `Q_PROPERTY` for any state that needs proper integration with binding or\
    \ introspection.\n\nThe Meta-Object System, enabled by `QObject`, the `Q_OBJECT`\
    \ macro, and the `MOC` preprocessor, extends C++ with powerful introspection capabilities\
    \ crucial for Qt's dynamic features. Qt Properties, declared using `Q_PROPERTY`,\
    \ build upon this system to provide a standardized way to expose object state,\
    \ complete with accessor functions and change notification signals (`NOTIFY`).\
    \ This not only allows for dynamic querying and manipulation of object attributes\
    \ but, most importantly, serves as the foundation for the data binding mechanisms\
    \ essential for frameworks like Qt Quick/QML, enabling reactive and maintainable\
    \ user interfaces. Understanding how to define and use properties correctly is\
    \ therefore vital for leveraging the full power of Qt.\n\n### Understanding and\
    \ Handling Events in Qt Applications\n\nWhile signals and slots provide a high-level\
    \ mechanism for communication between objects based on state changes or specific\
    \ occurrences, Qt applications are fundamentally driven by events. Events represent\
    \ low-level notifications about things that have happened, such as a user pressing\
    \ a key, moving the mouse, a window being resized, or the system requesting a\
    \ repaint. Understanding how Qt processes these events is crucial for creating\
    \ interactive and responsive applications. Signals are often emitted as a result\
    \ of handling an event (e.g., a `QPushButton` handles a mouse press event and,\
    \ in response, emits its `clicked()` signal), but the event system is the underlying\
    \ foundation.\n\n#### The Event Loop: The Application's Heartbeat\nAt the core\
    \ of every Qt application (GUI or console) runs an event loop. When you call `QApplication::exec()`\
    \ (or `QCoreApplication::exec()` for non-GUI apps), you start this loop. The event\
    \ loop's primary responsibilities are:\n\n1. **Waiting**: It continuously monitors\
    \ various event sources (like the window system for mouse/keyboard input, network\
