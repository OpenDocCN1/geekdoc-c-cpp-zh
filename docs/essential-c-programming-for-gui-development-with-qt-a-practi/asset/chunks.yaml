  trans: "\nQt 为此问题提供了一种复杂而优雅的解决方案：信号与槽（signal and slot）机制。它允许对象在不需要相互明确了解的情况下进行通信，促进了松耦合并实现了灵活的事件驱动架构。掌握这一机制是进行高效\
    \ Qt 开发的基础。\n\n## 核心概念：解耦通信\n\n想象一个对象（例如，`QPushButton`）在发生某些有趣事件时（例如被点击时）需要通知其他对象。按钮不需要一个特定的函数列表来供调用，它只需发射一个信号（signal）。信号就像一条广播消息，声明“发生了一些事情！”。\n\
    \n其他对该事件感兴趣的对象（例如，你的主应用程序窗口、一个数据处理类）可以将它们其中一个函数（称为槽，slot）连接到该特定信号上。当按钮发射 `clicked()`\
    \ 信号时，Qt 框架会自动调用所有连接到它的槽。\n\n### 该系统的关键特性：\n\n- **解耦**：发射信号的句（发送者）对接收该信号的句或槽（接收者）一无所知。它只管发射信号。同样，接收者知道自己连接到了哪个信号，但不需要直接了解发送者对象。\n\
    - **多对多**：一个信号可以连接到多个槽。一个槽可以连接到多个信号。\n- **类型安全（现代语法）**：使用现代语法建立的连接会在编译时进行检查，确保信号和槽的参数是兼容的。\n\
    - **灵活性**：连接可以在运行时建立或断开。\n\n该机制严重依赖于 `QObject` 基类以及由元对象编译器（`MOC`）生成的元数据。当你在一个派自\
    \ `QObject` 的类中声明信号或使用 `Q_OBJECT` 宏时，`MOC` 会生成代码以实现信号发射和动态连接管理。Qt 事件循环（我们稍后会讨论）也起着作用，特别是在处理跨线程的通信时。\n\
    \n## 定义信号与槽\n\n要参与这一机制，类通常必须继承自 `QObject` 并在声明中包含 `Q_OBJECT` 宏。\n\n- **信号（Signals）**：信号使用\
    \ `signals:` 关键字声明（在 Qt 6 之前使用 `Q_SIGNAL` 宏）。它们看起来像函数声明，但不需要实现体——`MOC` 提供了必要的魔法。在概念上，它们是保护成员。\n\
    \n- **槽（Slots）**：传统上，槽使用 `slots:` 关键字声明（例如 `public slots:`, `private slots:`）。虽然这种方式仍然有效并有助于组织代码，但现代\
    \ Qt 允许任何普通的 C++ 成员函数（公共、私有或保护）、静态成员函数或兼容的自由函数/lambda 表达式作为槽。`slots:` 关键字主要用于与旧的基于字符串的连接语法兼容。\n\
    \n这里是一个简单的示例：\n\n```cpp\n#include <QObject>\n#include <QDebug>\n\nclass Counter\
    \ : public QObject {\n    Q_OBJECT // 信号/槽/属性所需的宏\n\npublic:\n    explicit Counter(QObject\
    \ *parent = nullptr) : QObject(parent), m_value(0) {}\n    int value() const {\
    \ return m_value; }\n\npublic slots: // 或者直接用 'public:' - 现在现在任何成员函数都可以是槽\n  \
    \  void setValue(int value) {\n        if (m_value == value)\n            return;\n\
    \        m_value = value;\n        qDebug() << \"Counter value changed to:\" <<\
    \ m_value;\n        emit valueChanged(m_value); // 发射信号\n    }\n\nsignals:\n \
    \   void valueChanged(int newValue); // 信号声明，不需要实现\n\nprivate:\n    int m_value;\n\
    };\n```\n\n在类 `Counter` 类中，`valueChanged(int)` 被声明为一个信号。`setValue(int)` 函数作为一个槽（以及普通方法）。当\
    \ `setValue` 改变内部值时，它使用 `emit` 关键字发射 `valueChanged` 信号（该关键字实际上是一个由 `MOC` 解析的空宏）。\n\
    \n## 连接信号与槽：QObject::connect\n\n静态函数 `QObject::connect` 建立了信号与槽之间的连接。有以下几种语法：\n\
    \n1. **基于字符串的语法（旧式 - 在新代码中避免）**：\n```cpp\n// connect(sender, SIGNAL(signalSignature(Args)),\
    \ receiver, SLOT(slotSignature(Args)));\nconnect(counterInstance, SIGNAL(valueChanged(int)),\
    \ labelInstance, SLOT(setNum(int)));\n```\n2. 这种语法使用宏 `SIGNAL` 和 `SLOT` 将信号和槽签名指定为字符串。它的主要缺点是完全缺乏编译时检查。信号/槽名称的拼写错误或参数不匹配只有在运行时才能检测到，通常作为打印到控制台的警告。它的效率较低。在新的\
    \ Qt 6 项目中请避免使用。\n\n3. **成员函数指针语法（现代 - 推荐）**：\n```cpp\n// connect(sender, &SenderClass::signalName,\
    \ receiver, &ReceiverClass::slotName);\nCounter *counter = new Counter(this);\n\
    QLabel *label = new QLabel(this); // 假设 label 存在\nconnect(counter, &Counter::valueChanged,\
    \ label, &QLabel::setNum);\n```\n4. 这种语法使用成员函数的指针。它提供了完全的编译类型检查。如果信号和槽的签名不兼容，或者信号/槽不存在，代码将无法编译——从而及早发现错误。这是连接信号到成员函数槽的推荐方法。如果信号或槽重载，你需要使用\
    \ `QOverload`（来自 `<QOverload>`）或 `qOverload`（自 Qt 5.7 起可用的函数模板）帮助编译器选择正确的重载：\n\
    ```cpp\n// 带重载示例：假设 myObject 有 void valueChanged(int) 和 void valueChanged(QString)\n\
    // connect(myObject, qOverload<int>(&MyObjectClass::valueChanged), otherObject,\
    \ &OtherClass::handleIntChange);\n// connect(myObject, qOverload<QString>(&MyObjectClass::valueChanged),\
    \ otherObject, &OtherClass::handleStringChange);\n```\n\n5. **连接到 Lambda 和自由函数**：\n\
    你可以将信号直接连接到 C++ lambda 表达式或兼容的自由函数/静态方法：\n```cpp\n// 连接到 lambda\nint threshold\
    \ = 10;\nconnect(counter, &Counter::valueChanged, this, this, threshold {\n  \
    \  if (newValue > threshold) {\n        qDebug() << \"Value\" << newValue << \"\
    \ exceeded threshold\" << threshold;\n        // 'this' 和 'threshold' 从作用域捕获\n\
    \        // 可能更新另一个 元素：this->warningLabel->show();\n    }\n});\n// 连接到自由函数（签名必须匹配）\n\
    // void handleGlobalChange(int value);\nconnect(counter, &Counter::valueChanged,\
    \ &handleGlobalChange);\n```\n6. Lambda 特别强大，允许内联处理程序并方便地访问上下文。\n\n## 连接类型\n\n\
    `connect` 函数可以接受一个可选的参数来指定 `Qt::ConnectionType`。这主要影响发送者和接收者位于不同线程时的行为：\n\n- **Qt::AutoConnection（默认）**：如果发送者和接收者在同一线程中，它类似于\
    \ `Qt::DirectConnection`。如果它们在不同的线程中，它类似于 `Qt::QueuedConnection`。除非有特定的线程需求，否则这是最佳选择。\n\
    - **Qt::DirectConnection**：槽在发射信号的线程中立即执行。如果发送者和接收者在不同的线程中，槽将在发送者线程中运行。如果槽访问了接收者线程本地的数据，这可能是危险的。\n\
    - **Qt::QueuedConnection**：将槽调用封装在一个事件并并到接收者线程的事件循环。只有当接收者的事件循环处理该事件时才会执行槽。通过信号传递的参数会被复制。这是使用信号和槽执行安全跨线程通信的标准方法。\n\
    - **Qt::BlockingQueuedConnection**：类似于 `QueuedConnection`，但但发送线程会阻塞直到槽在接收者线程中执行完毕。使用时要非常小心，因为如果接收者线程需要与发送者线程通信，很容易导致死锁。\n"
- fmt: "\nFor single-threaded applications, `AutoConnection` effectively means `DirectConnection`.\
    \ When dealing with multiple threads, you'll often explicitly use `QueuedConnection`\
    \ for signals sent between threads to ensure thread safety.\n\n## Disconnecting\
    \ Signals and Slots\n\nWhile less common than connecting, you can break established\
    \ connections using `QObject::disconnect`. You typically need to provide similar\
    \ arguments as the `connect` call to identify the specific connection(s) to break.\
    \ Modern C++ practices, like using `QMetaObject::Connection` objects returned\
    \ by `connect` or relying on automatic disconnection when objects are destroyed,\
    \ often reduce the need for manual disconnection.\n\nThe signal and slot mechanism\
    \ is a cornerstone of Qt programming, enabling robust, decoupled communication\
    \ between objects. By defining signals in emitting classes and connecting them\
    \ to slots (member functions, free functions, or lambdas) in receiving classes,\
    \ you create flexible and maintainable applications. Always prefer the modern\
    \ pointer-to-member-function or lambda syntax for `QObject::connect` to benefit\
    \ from compile-time safety. Understanding connection types is crucial when working\
    \ with multiple threads, with `Qt::AutoConnection` being the default and `Qt::QueuedConnection`\
    \ essential for safe cross-thread calls. This powerful mechanism forms the basis\
    \ for event handling and dynamic behaviour throughout the Qt framework.\n\n##\
    \ The Meta-Object System and Qt Properties: Powering Introspection and Bindings\n\
    \nWhile signals and slots provide a powerful communication mechanism, they are\
    \ just one facet of a larger infrastructure within Qt known as the Meta-Object\
    \ System (MOS). This system grants Qt capabilities far beyond standard C++ Run-Time\
    \ Type Information (RTTI), enabling features like introspection (querying object\
    \ structure at runtime), dynamic property access, and, of course, the signal/slot\
    \ mechanism itself. A key component exposed through this system is the Qt Property,\
    \ which provides a standardized way to manage and observe the state of `QObjects`.\n\
    \n### The Meta-Object System (MOS): Why Qt Needs More\n\nStandard C++ offers basic\
    \ RTTI through `typeid` (for type identification) and `dynamic_cast` (for safe\
    \ downcasting in inheritance hierarchies). However, Qt's goals required much more\
    \ runtime information:\n\n- Discovering an object's available signals and slots\
    \ by name.\n- Invoking methods (slots) dynamically using their string names.\n\
    - Getting and setting object attributes (properties) by name without compile-time\
    \ knowledge.\n- Querying class inheritance relationships (`inherits()`).\n- Providing\
    \ the underlying machinery for signal/slot connections.\n\nTo achieve this, Qt\
    \ employs a combination of components:\n\n1. **QObject Base Class**: Provides\
    \ the fundamental anchor point and API for meta-object interactions (`metaObject()`,\
    \ `property()`, `setProperty()`, etc.).\n2. **Q_OBJECT Macro**: This macro, placed\
    \ within the private section of your class declaration, signals to Qt tools that\
    \ the class requires meta-object capabilities. It declares essential elements\
    \ like the static `metaObject()` member. \n3. **Meta-Object Compiler (MOC)**:\
    \ As mentioned before, this crucial pre-processing tool scans your header files\
    \ for classes containing the `Q_OBJECT` macro. It parses declarations for signals,\
    \ slots (using the `slots` keyword or recognized signatures), and properties (`Q_PROPERTY`).\
    \ Based on this, the MOC generates an auxiliary C++ source file containing the\
    \ implementation for the meta-object features, including a static `QMetaObject`\
    \ instance for the class and the code needed for signal emission and dynamic invocation.\
    \ This generated code is compiled and linked into your final application.\n4.\
    \ **QMetaObject Class**: An instance of this class exists for each `QObject` derivative\
    \ using `Q_OBJECT`. It stores all the introspective information about the class:\
