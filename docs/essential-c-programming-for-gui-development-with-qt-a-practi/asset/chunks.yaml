  trans: "\n\n- **Qt Installer Framework**: `Qt` 官方提供的工具，用于创建在线/离线安装程序以及管理组件/更新非常强大，但与\
    \ `Inno Setup` 或 `NSIS` 相比，部署简单应用程序的学习曲线可能更陡。\n\n你通过配置这些工具（通常通过脚本文件）来包含 `windeployqt`\
    \ 收集的所有文件，加上手动添加的运行时库/DLL 以及任何其他应用程序数据文件，定义快捷方式位置，指定许可协议等，最终生成单一的 `setup.exe`\
    \ 文件。\n\n### 最后一步：在干净的 Windows 机器上进行测试！\n\n这是最关键的验证步骤。在创建了部署文件夹，或者理想情况下是最终的安装程序后，请在一个干净的\
    \ Windows 安装系统（使用虚拟机或另一台电脑）上进行测试，该系统不应安装 `Qt` 或你的开发工具。运行安装程序并启动应用程序。它能启动吗？所有功能都能工作吗（特别是使用\
    \ `HTTPS` 时的网络功能）？此测试模拟了真实用户的环境，是确保你包含了所有必要依赖的唯一方法。\n\n在 Windows 上部署 `Qt` 应用程序不仅仅是拷贝可执行文件。你必须识别并封装依赖项，包括\
    \ `Qt` 库和插件（使用 `windeployqt` 可以极大地简化此过程）、正确的 C++ 编译器运行时、可能的 `SSL` 库以及任何第三方 DLL。使用\
    \ `Inno Setup` 或 `NSIS` 等工具将这些组件封装成用户友好的安装程序提供了一种专业的分发方法。在干净的 Windows 系统上进行严格测试对于确保你的应用程序在终端用户正确运行至关重要。\n\
    \n## 在 macOS 上部署应用程序 (`macdeployqt`, App Bundles`)\n\n`Qt` 的跨平台特性同样适用于 macOS 和\
    \ Linux，但打包和分发应用程序的方法与 Windows 不同，彼此之间也存在差异。\n\n### macOS 部署：应用程序包和 macdeployqt\n\
    \n在 macOS 上，应用程序通常以应用程序包（Application Bundles）的形式分发。对于用户来说，它看起来是一个扩展名为 `.app` 的单一文件（例如\
    \ `MyApp.app`），但实际上是一个特殊结构的目录，包含了可执行文件以及所有必要的资源和库。\n\n- **包结构**：`YourApp.app/Contents/`\
    \ 内部的关键内容：\n    - `MacOS/`: 包含实际的可执行文件。\n    - `Frameworks/`: 存放所需的动态库和 `Qt` 框架\
    \ (`Qt*.framework`)。\n    - `Resources/`: 包含应用程序数据文件、图标（`Info.plist` 在此处引用图标文件）、翻译文件。\n\
    \    - `Plugins/`: 存放 `Qt` 插件（平台插件 `platforms/libqcocoa.dylib`、图像格式等）。\n    -\
    \ `Info.plist`: 一个包含应用程序元数据的 XML 文件（标识符、版本、可执行文件名称、图标文件等）。\n\n- **macdeployqt\
    \ 工具**：`Qt` 提供了 `macdeployqt` 命令行工具（位于 `Qt` 的 `bin` 目录），专门用于正确填充此包结构。它的主要任务是：\n\
    \    - 将应用程序可执行文件拷贝到 `Contents/MacOS/`。\n    - 将必要的 `Qt` `.framework` 包拷贝到 `Contents/Frameworks/`。\n\
    \    - 将所需的 `Qt` 插件拷贝到 `Contents/Plugins/`。\n    - 关键点：分析依赖关系并使用 macOS 的 `install_name_tool`\
    \ 工具修改可执行文件和框架内部的路径。这确保了它们会在 `.app` 包内部查找依赖项，使包成为自包含且可移动的。\n\n- **用法**：\n    -\
    \ 使用 `Qt Creator` 或 `CMake` 以 Release 模式构建你的应用程序。这通常会在构建目录下生成基本的 `YourApp.app`\
    \ 结构。\n    - 打开“终端”（Terminal）应用程序。确保环境已配置为找到你的 `Qt` 安装的 `bin` 目录。\n    - 运行工具指向你的应用程序包：\n\
    \      ```bash\n      macdeployqt YourApp.app\n      ```\n    - **常用选项**：\n  \
    \      - `-dmg`: 自动创建一个 `.dmg`（磁盘映像）文件，这是 macOS 应用程序常用的发行格式，包含了你的包。\n        -\
    \ `-codesign=\"Your Developer ID Application: Common Name (ID)\"`: 使用指定的 Apple\
    \ Developer ID 证书对应用程序包及其内容签名。这是非常重要的。\n        - `-notarize=\"--apple-id user@example.com\
    \ --team-id YOURTEAMID --password app-specific-pw\"`（简化示例，具体选项随版本变化）：将签名后的应用提交给\
    \ Apple 进行公证（notarization），这是分发的另一个安全要求。\n        - `-verbose=2`: 增加输出细节以于排故障。\n\
    \n- **依赖处理**：`macdeployqt` 能够有效处理 `Qt` 框架和插件。然而，像 `windeployqt` 一样，它不会自动封装非 Qt\
    \ 的动态库 (`.dylib`)。如果你的应用程序使用了第三方库，必须手动将它们拷贝到 `Contents/Frameworks/` 目录，并自行使用 `install_name_tool`\
    \ 修复可执行文件以及可能的库内部的路径——这是一个复杂的过程。C++ 运行时通常是 `macOS/Xcode` 的一部分，且 `SSL/TLS` 通常通过原生的\
    \ `Secure Transport` 框架处理，因此除非有特殊要求，否则手动封装 `OpenSSL` 并不像 Windows/Linux 上那样常见。\n\
    \n- **代码签名与公证（强制性）**：由于 macOS 的安全措施（Gatekeeper），分发应用程序通常需要使用从 Apple 获取的有效 Apple\
    \ Developer ID 证书进行签名（需要加入 Apple 开发者计划）。此外，Apple 现在通常要求在 App Store 之外分发的应用程序必须经过公证——这是一个将你签名后的应用上传到\
    \ Apple 进行自动安全扫描的过程。只有经过签名和公证的应用程序才能在终端用户的 Mac 上运行且不会出现阻塞性的安全警告。`macdeployqt`\
    \ 提供了辅助签名和公证的选项，但管理证书以及与 Apple 工具（`codesign`, `altool`, `notarytool`）交互是 macOS\
    \ 部署工作流中必要的一部分。\n\n- **磁盘映像 (.dmg)**：分发 macOS 应用程序的标准方法是通过 `.dmg` 文件。`macdeployqt\
    \ -dmg` 选项可以创建一个基础映像。开发者通常会自定义这些映像（使用“磁盘工具”或其他工具），以包含一张显示应用程序图标的背景以及以及指向 `/Applications`\
    \ 文件夹的快捷方式，引导用户拖放 `.app` 包来完成安装。\n\n### Linux 部署：处理多样性\n\n在 Linux 上部署应用程序面临着不同的挑战，这主要是由于发行版数量众多（Ubuntu,\
    \ Fedora, Debian, Arch, openSUSE 等，在欧洲包括德国的许多发行版非常流行）以及已安装库版本的差异（特别是核心库如 `GLIBC`、`libstdc++`、图形驱动程序、桌面环境组件）。仅仅拷贝可执行文件和\
    \ `Qt` 的共享对象 (`.so`) 文件通常在不同的发行版甚至同一发行版的不同版本上会失败。\n\n目前有几种策略：\n\n1. **原生系统包 (.deb,\
    \ .rpm)**：\n    - **概念**：为特定的发行版家族创建包（例如，适用于 Debian/Ubuntu/Mint 的 `.deb$，适用于 Fedora/CentOS/RHEL/openSUSE\
    \ 的 `.rpm`）。\n    - **优点**：提供了最好的用户体验和系统集成。对系统库（如 `libc`、`libstdc++`、其他库的特定）的依赖关系声明在包元数据中，由系统软件包管理器（`apt`、`dnf`、`yum`、`zypper`）自动处理。更新也可以通过软件包管理器。\n\
    \    - **缺点**：为每个目标发行版和版本创建、测试和维护独立的包需要大量精力。需要学习特定发行版的打包工具和策略。对于分发给广泛且未知的 Linux\
    \ 用户范围，这通常是不可行的。\n\n2. **手动封装 + 封装脚本（通常不可靠）**：\n\n"
