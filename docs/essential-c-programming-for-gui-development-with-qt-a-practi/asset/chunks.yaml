    add it to both the File menu and a toolbar. When you disable the QAction, it automatically
    appears disabled in both places. You connect the action''s triggered() signal
    (emitted when the action is activated via menu, toolbar, or shortcut) to a slot
    that performs the actual work. This centralizes action handling. QActions are
    typically created as member variables of the QMainWindow subclass.


    C++


    // In MyMainWindow.h (or .cpp)


    #include <QAction>


    #include <QKeySequence> // For shortcuts


    #include <QIcon> // For icons


    // ... inside class declaration or constructor ...


    saveAction = new QAction(QIcon::fromTheme("document-save"), tr("&Save"), this);
    // Icon, Text, Parent


    saveAction->setShortcut(QKeySequence::Save); // Standard shortcut (e.g., Ctrl+S)


    saveAction->setStatusTip(tr("Save the current document"));


    connect(saveAction, &QAction::triggered, this, &MyMainWindow::saveDocument); //
    Connect signal to slot


    Creating Menus and Toolbars


    With QActions defined, populating menus and toolbars is straightforward within
    your QMainWindow subclass:


    ●     Menus:


    1.  Get the menu bar: QMenuBar *mainMenuBar = menuBar();


    2.  Add top-level menus: QMenu *fileMenu = mainMenuBar->addMenu(tr("&File"));


    3.  Add actions to a menu: fileMenu->addAction(saveAction);


    4.  Add separators: fileMenu->addSeparator();


    5.  Create submenus: QMenu *exportMenu = fileMenu->addMenu(tr("E&xport")); exportMenu->addAction(exportPdfAction);


    ●     Toolbars:


    1.  Create and add a toolbar: QToolBar *fileToolBar = addToolBar(tr("File Actions"));
    (Returns the created toolbar). addToolBar attaches it to the main window.


    2.  Add actions: fileToolBar->addAction(saveAction); (Typically only the icon
    is shown on the toolbar).


    3.  Add separators: fileToolBar->addSeparator();


    4.  Add other widgets: fileToolBar->addWidget(new QComboBox()); (You can embed
    other widgets too).


    Dialogs (QDialog): Focused Interactions


    Dialogs are secondary windows used to interact with the user in a focused way
    – prompting for input, presenting choices, or displaying messages. They derive
    from QDialog.


    ●     Modal vs. Modeless:


    1.  Modal Dialogs: Block input to all other windows in the application until the
    dialog is closed. Use dialog->exec() to show a modal dialog. The exec() call only
    returns when the dialog is closed, typically returning a result code like QDialog::Accepted
    or QDialog::Rejected (often triggered by connecting OK/Cancel buttons to the dialog''s
    accept() and reject() slots). Use modal dialogs for critical interactions where
    the main window shouldn''t be used until the dialog task is complete (e.g., login
    prompts, confirmation messages).


    2.  Modeless Dialogs: Allow the user to interact with other application windows
    while the dialog remains open. Use dialog->show() (or dialog->open() for slightly
    different activation behavior). Communication typically happens via signals and
    slots connected between the dialog and the main window. Use modeless dialogs for
    auxiliary tools like find/replace windows or non-critical status displays.


    ● Standard Dialogs: Qt provides convenient static functions to invoke common platform-native
    dialogs. Using these ensures your application adheres to the look and feel expected
    by users on Windows, macOS, or Linux (minor stylistic differences are normal,
    reflecting platform conventions, even here in Germany compared to, say, the US).


    1.  QMessageBox::information(parent, title, text) / ::question(...) / ::warning(...)
    / ::critical(...): Display standard message boxes with different icons and button
    sets.


    2.  QFileDialog::getOpenFileName(...) / ::getSaveFileName(...) / ::getExistingDirectory(...):
    Show dialogs for selecting files or folders.


    3.  QFontDialog::getFont(...): Allow the user to select a font.


    4.  QColorDialog::getColor(...): Allow the user to select a color.


    ● Custom Dialogs: For specific input needs beyond the standard dialogs, you create
    your own by subclassing QDialog.


    1.  Design the UI within your custom dialog class, using widgets and layouts just
    like any other QWidget.


    2.  Add buttons (typically "OK" and "Cancel").


    3.  Connect the "OK" button''s clicked() signal to the dialog''s built-in accept()
    slot.


    4.  Connect the "Cancel" button''s clicked() signal to the dialog''s built-in
    reject() slot.


    5.  Provide public member functions to retrieve the data entered by the user after
    the dialog has been accepted.


