    \ \" 包裹）、颜色（如字符串 \"blue\"、\"#FF0000\" 或使用 `Qt.rgba(...)`）或枚举值（例如 `Text.AlignRight`）。\n\
    \n```qml\nRectangle {\n    width: 200  // 分配一个数字\n}\n```\n\n"
