  trans: "\n\n```height: 100\n\ncolor: \"steelblue\"  // Assign a color string\n\n\
    visible: true  // Assign a boolean\n}\n```\n\n## 对象层次结构（嵌套）\n\n你通过相互嵌套 `Item`\
    \ 声明来定义 UI 结构。在另一个元素内部声明的 `Item` 将成为它的视觉子元素。子元素的坐标（`x`, `y` 属性）相对于父级 `Item` 的左上角。\n\
    \n```qml\nRectangle { // 父 Rectangle\n  width: 300; height: 200\n  color: \"lightgray\"\
    \n\n  Text { // 子 Text 项，嵌套在 Rectangle 内部\n    x: 10; y: 10  // 相对于父 Rectangle\
    \ 的位置\n    text: \"Hello inside a Rectangle\"\n  }\n}\n```\n\n## id 属性\n\n这是一个特殊且重要的属性。你为\
    \ `Item` 分配一个唯一的标识符（`an id`），以便同一个 QML 文档中的其他 `Items` 能够引用它。这个 `id` 不是字符串；它是直接在\
    \ QML 代码中使用的特殊标识符。它对于元素之间的相对定位以及属性绑定（我们稍后会提到）至关重要。\n\n```qml\nRectangle {\n  id:\
    \ myBackground  // 为此 Rectangle 分配一个 id\n  width: 250; height: 150\n  color: \"\
    white\"\n}\n// 其他项可能会引用 'myBackground.width'\n```\n\n## 基础视觉项类型\n\n让我们来看由 `QtQuick`\
    \ 模块提供的三个基础视觉构建块：\n\n### 1. Rectangle (矩形)\n\n- **用途**：绘制一个简单的矩形，可以填充纯色或渐变，具有边框和圆角。它通常用于背景、分隔符或基本形状。\n\
    - **关键属性**：`width`, `height`, `color`, `gradient`（用于颜色渐变），`radius`（用于圆角），`border.color`,\
    \ `border.width`。\n\n```qml\nimport QtQuick\nimport QtQuick.Window\n\nWindow {\
    \ // 使用 Window 作为根元素\n  width: 300; height: 200\n  visible: true\n  title: \"\
    Basic QML Elements\"\n\n  Rectangle {\n    id: blueRect\n    width: 150; height:\
    \ 80\n    x: 20; y: 20  // 相对于 Window 左上角的位置\n    color: \"lightblue\"\n    border.color:\
    \ \"steelblue\"\n    border.width: 2\n    radius: 8  // 圆角\n  }\n}\n```\n\n###\
    \ 2. Text (文本)\n\n- **用途**：显示文本。提供了控制字体、颜色、对齐方式和换行的属性。\n- **关键属性**：`text`（要显示的字符串），`color`,\
    \ `font.family`, `font.pointSize`, `font.bold`, `font.italic`, `wrapMode`（例如 `Text.WordWrap`），`horizontalAlignment`,\
    \ `verticalAlignment`。\n\n```qml\n// 将此内容添加到上一个示例的 Window 元素中\nText {\n  id: greetingText\n\
    \  x: blueRect.x + 10  // 相对于 blueRect 的 x \n  // 位于 blueRect 下方（使用锚点更好，但目前使用\
    \ x/y）\n  y: blueRect.y + blueRect.height + 10\n  width: 260  // 允许换行\n  text:\
    \ \"This is a Text item displaying styled text below the rectangle.\"\n  color:\
    \ \"darkgreen\"\n  font.pointSize: 12\n  font.italic: true\n  wrapMode: Text.WordWrap\n\
    }\n```\n\n### 3. Image (图像)\n\n- **用途**：显示位图，如 PNG、JPG、GIF。\n- **关键属性**：\n   \
    \ - `source`：指定图像文件路径或 URL。这至关重要。通过 Qt 资源系统嵌入的图像使用 `qrc:/` 前缀（例如 `\"qrc:/images/logo.png\"\
    `），对于本地文件使用 `file:///`（在部署的应用中较少见），对于网络图像使用 `http://`。\n    - `fillMode`：控制当图像尺寸与\
    \ `Image` 项的宽度/高度不一致时如何缩放。选项包括 `Image.Stretch`、`Image.PreserveAspectFit`（适应内部并保持宽高比例\
    \ - 常用）、`Image.PreserveAspectCrop`（填充并保持宽高比例，必要时裁剪）、`Image.Tile`。\n    - `smooth`：布尔值，缩放时启用平滑滤波（效果更好，但开销略大）。\n\
    \    - `sourceSize`：如果图像格式未指定尺寸，或者为了将大型精灵图视为特定尺寸，则有时需要。\n\n```qml\n// 将此添加到 Window\
    \ 元素中\nImage {\n  id: logoImage\n  x: 20; y: greetingText.y  // 位于 greetingText\
    \ 下方\n  source: \"qrc:/images/logo.png\"\n  fillMode: Image.PreserveAspectFit\n\
    \  smooth: true\n}\n```\n\n## 属性绑定：初探 QML\n\n属性绑定允许一个属性在另一个依赖属性更改时自动更新。注意我们在示例中是如何让元素相互相对定位的。QML\
    \ 通过这些绑定变得非常强大。\n\n```qml\nRectangle {\n  id: container\n  width: 200; height:\
    \ 200\n  color: \"yellow\"\n\n  Text {\n    // text 属性绑定到 container 的宽度\n    text:\
    \ \"Width is: \" + container.width\n    anchors.centerIn: parent\n  }\n}\n```\n\
    \n"
- fmt: "\n```qml\ncolor: \"lightgreen\"\n\n// Anchored relative to 'topLeftRect' (its\
    \ sibling)\n\nanchors.left: topLeftRect.right // Left edge aligns with topLeftRect's\
    \ right edge\n\nanchors.leftMargin: 5  // Small space between them\n\nanchors.verticalCenter:\
    \ topLeftRect.verticalCenter // Align vertically\n\n}\n\nRectangle { // Third\
    \ child, filling bottom area\n\nid: bottomRect\nheight: 40\n\ncolor: \"wheat\"\
    \n\n// Anchored to fill bottom horizontally, with margins\n\nanchors.left: parent.left\n\
    anchors.right: parent.right\nanchors.bottom: parent.bottom\nanchors.margins: 10\n\
    \n}\n\n}\n\n}\n```\n\n### Convenience Anchors:\n\n ● `anchors.fill: targetItem`:\
    \ Makes the item take the same geometry as the `targetItem` (usually parent).\
    \ Useful for backgrounds.\n ● `anchors.centerIn: targetItem`: Centers the item\
    \ horizontally and vertically within the `targetItem` (usually parent). Equivalent\
    \ to setting `horizontalCenter` and `verticalCenter` anchors.\n\nAnchors create\
    \ strong relationships. If container in the example above moves or resizes, all\
    \ the child rectangles will automatically adjust their positions and potentially\
    \ sizes (if `width`/`height` aren't explicitly set and anchors constrain them)\
    \ to maintain the defined relationships.\n\n### Positioners: Simple Arrangement\
    \ by Rule\n\nPositioners are container items that arrange their children according\
    \ to simple, predefined rules. You declare the children directly inside the positioner\
    \ block, and it handles their placement. Qt Quick provides several positioner\
    \ types:\n\n ● `Row`: Arranges its children horizontally, left-to-right.\n ● `Column`:\
    \ Arranges its children vertically, top-to-bottom.\n ● `Grid`: Arranges its children\
    \ in a grid, filling cells left-to-right, top-to-bottom. You specify `rows` or\
    \ `columns`.\n ● `Flow`: Arranges children like words on a page – left-to-right,\
    \ wrapping to the next line when the available width (`width` property of the\
    \ `Flow` itself) is exceeded.\n\nPositioners have properties like `spacing` (for\
    \ `Row`, `Column`, `Grid`, `Flow`), `rowSpacing`, `columnSpacing` (for `Grid`,\
    \ `Flow`) to control the gap between items.\n\n#### QML Example\n\n```qml\nimport\
    \ QtQuick\n\nColumn { // Use Column as root for this example snippet\n\nspacing:\
    \ 5  // Space between items in the column\n\nRow { // A row within the column\n\
    \nid: buttonRow\nspacing: 10  // Space between items in the row\n\nRectangle {\
    \ color: \"red\"; width: 50; height: 30 }\nRectangle { color: \"green\"; width:\
    \ 50; height: 30 }\nRectangle { color: \"blue\"; width: 50; height: 30 }\n}\n\n\
    Grid {\ncolumns: 3  // Arrange subsequent items in a 3-column grid\nspacing: 3\n\
    Repeater { // Often used with positioners to create multiple items\n\nmodel: 6\
    \  // Create 6 items\n\ndelegate: Rectangle {\nwidth: 40; height: 40\ncolor: Qt.rgba(Math.random(),\
    \ Math.random(), Math.random(), 1.0)\n}\n}\n}\n}\n```\n\n### Limitation\n\nPositioners\
    \ primarily manage position. They arrange items based on the items' own explicit\
    \ or implicit sizes. They don't intelligently resize items to fill available space\
    \ like traditional layout managers do.\n\n### Qt Quick Layouts: Robust Size and\
    \ Position Management\n\nFor more complex UIs requiring robust size management\
    \ similar to QtWidgets layouts, Qt provides the Qt Quick Layouts module. You need\
    \ to import `QtQuick.Layouts`. This module includes `RowLayout`, `ColumnLayout`,\
    \ and `GridLayout`.\n\n**Key Difference:** Unlike Positioners, Qt Quick Layouts\
    \ actively manage both the size and position of their children. They take into\
    \ account the minimum, preferred, and maximum sizes of items, as well as specific\
    \ instructions provided by the children, to distribute space intelligently. This\
    \ makes them much better suited for structured application UIs, forms, and situations\
    \ where components need to expand or shrink gracefully.\n\n#### Attached Properties\
    \ (Layout.*): Items within a Qt Quick Layout communicate their sizing preferences\
    \ using attached properties, prefixed with `Layout`.\n\n ● `Layout.fillWidth:\
    \ true` / `Layout.fillHeight: true`: Tells the layout that this item is allowed\
    \ to expand horizontally/vertically to fill available space.\n ● `Layout.preferredWidth`,\
    \ `Layout.preferredHeight`: Hints to the layout about the ideal size.\n ● `Layout.minimumWidth`,\
    \ `Layout.maximumWidth`, etc.: Defines size constraints.\n ● `Layout.alignment`:\
    \ Aligns the item within its allocated layout cell (e.g., `Qt.AlignRight`, `Qt.AlignVCenter`).\n\
    \ ● `Layout.row`, `Layout.column`, `Layout.rowSpan`, `Layout.columnSpan`: Used\
    \ within `GridLayout` to position items and allow spanning.\n\n#### QML Example\n\
    \n```qml\nimport QtQuick\nimport QtQuick.Layouts // Import the Layouts module\n\
    \nColumnLayout { // Use ColumnLayout instead of Column\n\nanchors.fill: parent\
    \  // Make the layout fill its parent\n\nRectangle { // Item 1: Takes fixed preferred\
    \ height, fills width\n\nid: header\nLayout.preferredHeight: 40\nLayout.fillWidth:\
    \ true  // Expands horizontally\n\ncolor: \"lightblue\"\n\nText { anchors.centerIn:\
    \ parent; text: \"Header Area\" }\n}\n\nRectangle { // Item 2: Takes all remaining\
    \ vertical space, fills width\n\nid: content\nLayout.fillWidth: true\nLayout.fillHeight:\
    \ true  // Takes remaining vertical space\n\ncolor: \"lightyellow\"\n\nText {\
    \ anchors.centerIn: parent; text: \"Content Area (Stretches)\" }\n}\n\nRectangle\
    \ { // Item 3: Fixed size, aligned right\n\nid: footer\nLayout.preferredWidth:\
    \ 100\nLayout.preferredHeight: 30\nLayout.alignment: Qt.AlignRight // Align within\
    \ its layout slot\n\ncolor: \"lightgray\"\n\nText { anchors.centerIn: parent;\
    \ text: \"Footer\" }\n}\n\n}\n```\n\nNotice how `Layout.fillHeight` and `Layout.fillWidth`\
    \ provide much more control over space distributed compared to basic positioner.\n\
    \n### Choosing the Right Approach\n\n ● **Anchors**: Fundamental for nearly all\
    \ positioning tasks. Use them to center items, align edges, fill containers, or\
    \ position items relative to siblings. Often used inside items managed by layouts\
    \ or positioners.\n ● **Positioners (Row, Column, Grid, Flow)**: Best for simple\
    \ linear or grid arrangements where items should mostly keep their intrinsic sizes,\
    \ and complex resizing policies are not needed. Quick for basic lists or flows.\n\
    \ ● **Qt Quick Layouts (RowLayout, ColumnLayout, GridLayout)**: The preferred\
    \ choice for structured application layouts, forms, toolbars, status bars, and\
    \ any complex arrangement where intelligent resizing, alignment, and space distribution\
    \ are important. Choose these when building interfaces analogous to those you'd\
    \ create with QtWidgets layouts.\n\nOften, the best approach involves combining\
    \ these techniques – for example, using a `ColumnLayout` for the main structure,\
    \ and then using anchors within one of the items managed by the layout to precisely\
    \ position an overlay element.\n"
