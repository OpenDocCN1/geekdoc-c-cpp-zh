  trans: "\n\n# Qt 布局管理\n\n- **自动排版**：布局（Layouts）负责几何形状计算。当容器控件的大小发生变化时，布局会根据其规则和控件的大小提示（其首选尺寸）自动重新排列其内部控件。\n\
    - **控件所有权**：你使用 `addWidget()` 等函数将控件添加到布局中。一旦添加，布局就会管理该控件在容器内的大小和位置。通常，你不应该对由布局管理的控件调用\
    \ `setGeometry`、`move` 或 `resize`。\n- **设置布局**：布局管理器本身需要与它将要管理的子控件的容器控件关联。这是通过容器的\
    \ `setLayout()` 函数实现的。一个控件只能直接在其上设置一个顶层布局管理器。\n\nQt 提供了几个标准布局管理器类，每种都适用于不同的排版任务。\n\
    \n## Qt 核心布局类\n\n### 1. QHBoxLayout (水平布局)\n- **用途**：在单行水平方向上并排排列控件。\n- **用法**：非常适用于工具栏、按钮组（如\
    \ 确定/取消）或任何应该并排显示的元素组。控件从左到右添加。\n- **示例**：\n```cpp\n#include <QHBoxLayout>\n#include\
    \ <QPushButton>\n#include <QWidget> // 包含头文件\n\n// 假设 'this' 是父 QWidget\nQHBoxLayout\
    \ *buttonLayout = new QHBoxLayout(); // 创建布局\nQPushButton *okButton = new QPushButton(\"\
    OK\");\nQPushButton *cancelButton = new QPushButton(\"Cancel\");\nbuttonLayout->addStretch(1);\
    \ // 先添加伸缩空间（将按钮向右推）\nbuttonLayout->addWidget(okButton); // 添加 OK 按钮\nbuttonLayout->addWidget(cancelButton);\
    \ // 添加取消按钮\n// this->setLayout(buttonLayout); // 之后将此布局设置给父控件\n```\n- `addStretch(int\
    \ stretchFactor)` 添加可扩展的空空间。在其后添加的控件将被推向右侧（对于 `QVBoxLayout` 则向下）。`stretchFactor`\
    \ 控制其相对于其他伸缩空间（后续添加的）占的空间。\n- `addSpacing(int size)` 添加固定大小的空空间。\n\n### 2. QVBoxLayout\
    \ (垂直布局)\n- **用途**：在单列垂直方向上一个接一个排列控件。\n- **用法**：非常适合垂直堆叠输入框、标签、列表视图或控件组。控件从上到下添加。\n\
    - **示例**：\n```cpp\n#include <QVBoxLayout>\n#include <QLabel>\n#include <QLineEdit>\n\
    #include <QWidget> // 包含头文件\n\n// 假设 'this' 是父 QWidget\nQVBoxLayout *formLayout\
    \ = new QVBoxLayout();\nQLabel *nameLabel = new QLabel(\"Name:\");\nQLineEdit\
    \ *nameEdit = new QLineEdit();\nQLabel *emailLabel = new QLabel(\"Email:\");\n\
    QLineEdit *emailEdit = new QLineEdit();\nformLayout->addWidget(nameLabel);\nformLayout->addWidget(nameEdit);\n\
    formLayout->addWidget(emailLabel);\nformLayout->addWidget(emailEdit);\nformLayout->addStretch(1);\
    \ // 如果空间允许，将内容向上推\n// this->setLayout(formLayout); // 之后将此布局设置给父控件\n```\n\n###\
    \ 3. QGridLayout (网格布局)\n- **用途**：在行和列组成的网格中排列控件。这是二维布局中最灵活的布局。\n- **用法**：适用于计算器布局、需要行列对齐的复杂表单，或任何网格结构。控件可以跨越多行或列。\n\
    - **示例**：\n```cpp\n#include <QGridLayout>\n#include <QPushButton>\n#include <QLineEdit>\n\
    #include <QWidget> // 包含头文件\n\n// 假设 'this' 是父 QWidget\nQGridLayout *gridLayout\
    \ = new QGridLayout();\nQLineEdit *display = new QLineEdit();\ndisplay->setReadOnly(true);\n\
    // 在第 0 行跨越 4 列\ngridLayout->addWidget(display, 0, 0, 1, 4); // 控件, 行, 列, 行跨越,\
    \ 列跨\n// 添加一些数字按钮\ngridLayout->addWidget(new QPushButton(\"7\"), 1, 0);\ngridLayout->addWidget(new\
    \ QPushButton(\"8\"), 1, 1);\ngridLayout->addWidget(new QPushButton(\"9\"), 1,\
    \ 2);\ngridLayout->addWidget(new QPushButton(\"/\"), 1, 3); // 运算符\ngridLayout->addWidget(new\
    \ QPushButton(\"4\"), 2, 0);\n// ... 添加更多按钮 ...\n// 如果有额外空间，让第 3 列比其他列伸缩得更多\n\
    gridLayout->setColumnStretch(3, 1);\n// this->setLayout(gridLayout); // 之后将此布局设置给父控件\n\
    ```\n- `setColumnStretch(int column, int stretchFactor)` 和 `setRowStretch(...)`\
    \ 控制额外空间在列/行之间的分布。\n\n### 4. QFormLayout (表单布局)\n- **用途**：专门为创建双列输入表单设计，通常第一列为标签，第二列为输入控件（如\
    \ `QLineEdit`、`QComboBox`、`QSpinBox`）。它根据平台约定自动对齐项（例如，某些平台上标签可能右对齐）。\n- **用法**：对于设置对话框、数据库输入表单等非常方便。\n\
    - **示例**：\n```cpp\n#include <QFormLayout>\n#include <QLabel>\n#include <QLineEdit>\n\
    #include <QSpinBox>\n#include <QWidget> // 包含头文件\n\n// 假设 'this' 是父 QWidget\n\
    QFormLayout *formLayout = new QFormLayout();\nQLineEdit *nameEdit = new QLineEdit();\n\
    QLineEdit *emailEdit = new QLineEdit();\nQSpinBox *ageSpinBox = new QSpinBox();\n\
    formLayout->addRow(\"Name:\", nameEdit);\nformLayout->addRow(\"Email:\", emailEdit);\n\
    formLayout->addRow(\"Age:\", ageSpinBox);\n// this->setLayout(formLayout); //\
    \ 之后将此布局设置给父控件\n```\n\n## 布局属性与嵌套\n\n- **间距与边距**：布局管理器具有控制间距的属性：\n    - `setSpacing(int)`：设置布局控件之间的间距。\n\
    \    - `setContentsMargins(int left, int top, int right, int bottom)`：设置布局边缘的空白空间，将其内容与父控件分离。\n\
    - **伸缩因子**：在添加控件 (`addWidget`)、布局 (`addLayout`) 或伸缩 (`add`) 时，可以提供一个整数伸缩因子。当容器大于内容的首选尺寸时，额外空间根据伸缩因子进行分配。伸缩因子为\
    \ 0 的项不扩展。`add()` 是添加带有伸缩因子的空间。这是控制 UI 缩放的关键。\n- **Spacer (`QSpacerItem`)**：你可以创建表示固定或扩展空空间的\
    \ `QSpacerItem` 对象，并使用 `addSpacerItem()` 将它们添加到布局中。在某些情况下，这比 `addSpacing` 或 `addStretch`\
    \ 提供了更精确的控制。\n- **嵌套布局**：现实世界的界面很少简单到只需要一个布局管理器。Qt 布局系统的强大在于嵌套。你可以使用 `addLayout()`\
    \ 将一个布局添加到另一个布局中。例如，你的主窗口可能使用 `QVBoxLayout`。在内部，可以在中心区域放置 `QGridLayout`，并在底部添加一个包含确定/取消按钮的\
    \ `QHBoxLayout`。这种层级组合允许任意所需的排列。\n\n## 在父控件上设置布局\n\n在创建主布局管理器（可能包含嵌套布局和控件）之后，必须将其与它管理的容器控件关联：\n\
    \n```cpp\nQWidget *myDialog = new QWidget();\nQVBoxLayout *mainLayout = new QVBoxLayout();\
    \ // 创建顶层布局\n// ... 创建控件并将其添加到 mainLayout 或嵌套布局中 ...\nQHBoxLayout *buttonLayout\
    \ = new QHBoxLayout();\nbuttonLayout->addStretch();\nbuttonLayout->addWidget(new\
    \ QPushButton(\"OK\"));\nmainLayout->addLayout(buttonLayout); // 将嵌套布局添加到主布局\n\
    \n// 最后，将主布局安装到容器控件上\nmyDialog->setLayout(mainLayout);\nmyDialog->show();\n```\n\
    \n一旦调用 `setLayout()`，`mainLayout` 就会接管所有添加到它的控件和子布局在 `myDialog` 边界内的排列。随后，对话框本身将根据布局计算出的最小和首选尺寸进行调整大小。\n\
    \n"
- fmt: "\nQt's layout managers (`QHBoxLayout`, `QVBoxLayout`, `QGridLayout`, `QFormLayout`)\
    \ are indispensable tools for creating user interfaces that are adaptive, maintainable,\
    \ and platform-friendly. By abandoning fixed positioning and embracing layouts,\
    \ you ensure your applications look professional and function correctly across\
    \ different environments and user preferences. Mastering the use of different\
    \ layout types, nesting them effectively, and controlling space distribution with\
    \ stretch factors and margins is a fundamental skill for any Qt Widgets developer.\
    \ With layouts managing the arrangement, we can now turn our attention to the\
    \ common widgets themselves that populate these layouts.\n\n## Buttons, Input\
    \ Fields, Display Widgets, and Item Views\n\nWith our layout structure defined,\
    \ we need to populate it with interactive elements. Qt's `QtWidgets` module offers\
    \ a comprehensive collection of standard controls, inheriting from the base `QWidget`\
    \ class. These range from simple buttons and labels to complex data entry fields\
    \ and views for displaying large datasets. We'll cover the essentials here, grouping\
    \ them by their typical function. Remember, these are the widgets you would add\
    \ to the layouts discussed in the previous section (using `addWidget()` typically).\n\
    \n### Button Widgets: Triggering Actions\n\nButtons are perhaps the most common\
    \ way users initiate actions.\n\n- `QPushButton`: The standard clickable command\
    \ button. You provide text (or optionally an icon) describing the action. Its\
    \ primary role is to emit the `clicked()` signal when the user activates it. You\
    \ connect this signal to a slot to perform the desired operation. You can set\
    \ its text using the constructor or `setText()`, and add an icon using `setIcon()`.\
    \ \n- `QToolButton`: Often used in toolbars (`QToolBar`). While it can display\
    \ text, it's more commonly configured to show just an icon (`setIcon()`). `QToolButton`s\
    \ are frequently associated with `QAction` objects (which represent actions that\
    \ can be triggered from menus, toolbars, or shortcuts) and often emit the `triggered(QAction*)`\
    \ signal. They can also feature popup menus (`setMenu()`, `setPopupMode()`).\n\
    - `QCheckBox`: Presents an option that can be toggled on (checked) or off (unchecked).\
    \ It consists of a checkbox square and a text label. Useful for boolean settings\
    \ or selecting multiple options from a set. Key signal: `stateChanged(int state)`\
    \ (reports `Qt::Checked`, `Qt::Unchecked`, or potentially `Qt::PartiallyChecked`)\
    \ or the simpler `toggled(bool checked)`. You can check its state programmatically\
    \ using `isChecked()`.\n- `QRadioButton`: Represents one choice among a set of\
    \ mutually exclusive options. Radio buttons with the same parent widget automatically\
    \ form an exclusive group (only one can be checked at a time). For more complex\
    \ groupings, `QButtonGroup` can be used. Like `QCheckBox`, it emits `toggled(bool\
    \ checked)` when its state changes (note this signal is emitted by both the button\
    \ being unchecked and the one being checked). Use `isChecked()` to query its state.\n\
    \n### Input Field Widgets: Gathering User Data\n\nThese widgets allow users to\
    \ enter text or select values.\n\n- `QLineEdit`: The standard widget for single-line\
    \ text input. Use it for names, search terms, file paths, etc. Key signals include\
    \ `textChanged(const QString &text)` (emitted whenever the text changes) and `returnPressed()`\
    \ (emitted when the Enter/Return key is pressed). Access its content using `text()`\
    \ and set it using `setText()`. Features like `setPlaceholderText()` (ghost text)\
    \ and `setEchoMode(QLineEdit::Password)` (for password fields) are very useful.\n\
    - `QTextEdit`: A more advanced widget for multi-line text editing. It supports\
    \ both plain text (`toPlainText()`, `setPlainText()`) and rich text.\n- `QSpinBox`\
    \ and `QSpinBox`: These provide fields for entering numeric values – integers\
    \ and floating-point numbers. Use `setRange()` to define minimum and maximum.\
    \ `valueChanged(int)` or `valueChanged(double)` notifies you.\n- `QComboBox`:\
    \ A dropdown list allowing users to select one option from a list. You populate\
    \ it using `addItem()` or `addItems(QStringList)`. It can be made editable (`setEditable(true)`).\
    \ Key signals are `currentIndex()`\n- `QSlider`: A classic slider control (horizontal\
    \ or vertical, `setOrientation()`). It emits `valueChanged(int)`. \n\n### Display\
    \ Widgets: Presenting Information\n\nThese widgets are primarily used to show\
    \ information to the user.\n\n- `QLabel`: One of the most versatile display widgets.\
    \ It can display plain text, a subset of rich text, or images (`QPixmap`). It's\
    \ commonly used to label other widgets (`setBuddy()`).\n- `QLCDNumber`: Simulates\
    \ a segmented Liquid Crystal Display (LCD), typically used for displaying digits.\
    \ Use the `display(int)` or `display(double)` slot to update the number. `setSegmentStyle()`\
    \ controls the appearance.\n- `QProgressBar`: Provides a visual indication of\
    \ the progress of a lengthy operation. You set its range (usually 0 to 100, or\
    \ 0 to the number of items being processed) using `setRange()` and update its\
    \ current value using `setValue()`. It can also be set to an indeterminate state\
    \ (`setRange(0,0)`) where it shows continuous activity without specific progress\
    \ indication.\n\n### View Widgets: Handling Structured Data\n\nFor displaying\
    \ larger amounts of data, often in list or tabular form, Qt uses its powerful\
    \ Model/View Framework. The core idea (which we'll explore fully in a later chapter)\
    \ is to separate the data storage and structure (the Model) from how it's presented\
    \ visually (the View). Here are the standard view widgets:\n\n- `QListView`: Displays\
    \ data from a model as a simple, single column list.\n- `QTableView`: Displays\
    \ data from a model in a grid of rows and columns, like a spreadsheet.\n- `QTreeView`:\
    \ Displays data from a model that has an inherent hierarchical (tree-like) structure.\n\
    \nTo use these effectively, you typically create a separate model object (e.g.,\
    \ deriving from `QAbstractListModel` or `QAbstractTableModel`, or using standard\
    \ models like `QStringListModel` or `QStandardItemModel`) and associate it with\
    \ the view using `view->setModel(model)`.\n\nFor simpler scenarios, Qt also provides\
    \ convenience classes: `QListWidget`, `QTableWidget`, and `QTreeWidget`. These\
    \ bundle a standard view with a built-in item-based model, allowing you to add\
    \ items (`QListWidgetItem`, `QTableWidgetItem`, `QTreeWidgetItem`) directly to\
    \ the widget itself. While easier for basic use cases, they are less flexible\
    \ and generally less performant for large or complex datasets compared to the\
    \ true Model-View approach.\n"
  raw: 'Qt''s layout managers (QHBoxLayout, QVBoxLayout, QGridLayout, QFormLayout)
    are indispensable tools for creating user interfaces that are adaptive, maintainable,
    and platform-friendly. By abandoning fixed positioning and embracing layouts,
    you ensure your applications look professional and function correctly across different
    environments and user preferences. Mastering the use of different layout types,
    nesting them effectively, and controlling space distribution with stretch factors
    and margins is a fundamental skill for any Qt Widgets developer. With layouts
    managing the arrangement, we can now turn our attention to the common widgets
    themselves that populate these layouts.


    ## Buttons, Input Fields, Display Widgets, and Item Views


    * * *


    With our layout structure defined, we need to populate it with interactive elements.
    Qt''s QtWidgets module offers a comprehensive collection of standard controls,
    inheriting from the base QWidget class. These range from simple buttons and labels
    to complex data entry fields and views for displaying large datasets. We''ll cover
    the essentials here, grouping them by their typical function. Remember, these
    are the widgets you would add to the layouts discussed in the previous section
    (using addWidget() typically).


    Button Widgets: Triggering Actions


    Buttons are perhaps the most common way users initiate actions.


    ● QPushButton: The standard clickable command button. You provide text (or optionally
    an icon) describing the action. Its primary role is to emit the clicked() signal
    when the user activates it. You connect this signal to a slot to perform the desired
    operation. You can set its text using the constructor or setText(), and add an
    icon using setIcon().


    ● QToolButton: Often used in toolbars (QToolBar). While it can display text, it''s
    more commonly configured to show just an icon (setIcon()). QToolButtons are frequently
    associated with QAction objects (which represent actions that can be triggered
    from menus, toolbars, or shortcuts) and often emit the triggered(QAction*) signal.
    They can also feature popup menus (setMenu(), setPopupMode()).


    ● QCheckBox: Presents an option that can be toggled on (checked) or off (unchecked).
    It consists of a checkbox square and a text label. Useful for boolean settings
    or selecting multiple options from a set. Key signal: stateChanged(int state)
    (reports Qt::Checked, Qt::Unchecked, or potentially Qt::PartiallyChecked) or the
    simpler toggled(bool checked). You can check its state programmatically using
    isChecked().


    ● QRadioButton: Represents one choice among a set of mutually exclusive options.
    Radio buttons with the same parent widget automatically form an exclusive group
    (only one can be checked at a time). For more complex groupings, QButtonGroup
    can be used. Like QCheckBox, it emits toggled(bool checked) when its state changes
    (note this signal is emitted by both the button being unchecked and the one being
    checked). Use isChecked() to query its state.


    Input Field Widgets: Gathering User Data


    These widgets allow users to enter text or select values.


    ● QLineEdit: The standard widget for single-line text input. Use it for names,
    search terms, file paths, etc. Key signals include textChanged(const QString &text)
    (emitted whenever the text changes) and returnPressed() (emitted when the Enter/Return
    key is pressed). Access its content using text() and set it using setText(). Features
    like setPlaceholderText() (ghost text) and setEchoMode(QLineEdit::Password) (for
    password fields) are very useful.


    ● QTextEdit: A more advanced widget for multi-line text editing. It supports both
    plain text (toPlainText(), setPlainText()) and rich text formatting (toHtml(),
    setHtml()) including basic styles (bold, italic), colors, lists, and even images.
    The textChanged() signal indicates modifications.


    ● QSpinBox and QDoubleSpinBox: These provide fields specifically for entering
    numeric values – integers for QSpinBox, floating-point numbers for QDoubleSpinBox.
    They typically include up/down arrows to increment/decrement the value. Use setRange()
    to define minimum and maximum values. The valueChanged(int) or valueChanged(double)
    signal notifies you of changes. Access the value with value() and set it with
    setValue(). You can also add prefixes or suffixes (setPrefix(), setSuffix()).


    ● QComboBox: A dropdown list allowing users to select one option from a list.
    You populate it using addItem() or addItems(QStringList). It can be made editable
    (setEditable(true)) allowing users to type values not in the list. Key signals
    are currentIndexChanged(int index) and currentTextChanged(const QString &text).
    Get the selected item using currentIndex() or currentText().


    ● QSlider: A classic slider control (horizontal or vertical, set via setOrientation())
    allowing users to select a value graphically within a defined range (setRange()).
    It emits valueChanged(int) as the slider handle is moved. Get/set its value using
    value() and setValue().


    Display Widgets: Presenting Information


    These widgets are primarily used to show information to the user.


    ● QLabel: One of the most versatile display widgets. It can display plain text,
    a subset of rich text, or images (QPixmap). It''s commonly used to label other
    widgets (use setBuddy() to link a label to an input widget for keyboard focus
    shortcuts). Set its content using setText(), setNum(), or setPixmap(). setAlignment()
    controls text/pixmap alignment.


    ● QLCDNumber: Simulates a segmented Liquid Crystal Display (LCD), typically used
    for displaying digits. Use the display(int) or display(double) slot to update
    the number shown. setSegmentStyle() controls the appearance (e.g., Filled, Outline).


    ● QProgressBar: Provides a visual indication of the progress of a lengthy operation.
    You set its range (usually 0 to 100, or 0 to the number of items being processed)
    using setRange() and update its current value using setValue(). It can also be
    set to an indeterminate state (setRange(0,0)) where it shows continuous activity
    without specific progress indication.


    Item View Widgets: Handling Structured Data


    For displaying larger amounts of data, often in list or tabular form, Qt uses
    its powerful Model/View Framework. The core idea (which we''ll explore fully in
    a later chapter) is to separate the data storage and structure (the Model) from
    how it''s presented visually (the View). Here are the standard view widgets:


    ● QListView: Displays data from a model as a simple, single column list.


    ● QTableView: Displays data from a model in a grid of rows and columns, like a
    spreadsheet.


    ● QTreeView: Displays data from a model that has an inherent hierarchical (tree-like)
    structure.


    To use these effectively, you typically create a separate model object (e.g.,
    deriving from QAbstractListModel or QAbstractTableModel, or using standard models
    like QStringListModel or QStandardItemModel) and associate it with the view using
    view->setModel(model).


    For simpler scenarios, Qt also provides convenience classes: QListWidget, QTableWidget,
    and QTreeWidget. These bundle a standard view with a built-in item-based model,
    allowing you to add items (QListWidgetItem, QTableWidgetItem, QTreeWidgetItem)
    directly to the widget itself. While easier for basic use cases, they are less
    flexible and generally less performant for large or complex datasets compared
    to the true Model/View approach. For non-trivial applications, investing time
    in understanding Model/View is highly recommended.'
