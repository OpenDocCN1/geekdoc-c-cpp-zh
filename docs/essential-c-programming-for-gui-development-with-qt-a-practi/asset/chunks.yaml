  trans: "\nCMake 分两个阶段工作。首先，它处理 `CMakeLists.txt` 文件（配置阶段），以生成适用于目标平台和所选构建工具的原生构建文件（例如用于\
    \ `make` 的 Makefile、用于 `ninja` 的 Ninja 文件、Visual Studio 解决方案、Xcode 项目文件）。这个“生成器”通常通过\
    \ Qt Creator 中的 `Kit` 或在命令行中使用 `-G` 标志来选择。其次，所选的原生构建工具（`make`、`ninja`、`msbuild`、`xcodebuild`）使用这些生成的文件来实际对项目的编译和链接。\n\
    \n在 Qt 6 中使用 `CMake` 具有多个优势：对依赖项有更显式的控制、更容易与第三方 C++ 库集成（这些库通常提供它们自己的 CMake 支持）、更广泛的社区知识，以及在\
    \ Qt Creator 和其他 C++ IDE 中获得良好的支持。\n\n## Qt Creator 集成\n\n无论你选择 `qmake`（用于旧版项目）还是\
    \ `CMake`（用于新的 Qt 6 项目），Qt Creator 均提供了无缝集成。当你创建一个新项目时，选择构建系统将决定 Qt Creator 是生成\
    \ `.pro` 文件还是带有适当初始内容的 `CMakeLists.txt` 文件。你选择的 `Kit` 将你的项目与特定的 Qt 版本、编译器以及相应的构建系统工具（`qmake`\
    \ 可执行文件或 `CMake` 可执行文件）关联。点击 IDE 中的“构建”或“运行”按钮会自动在后台调用正确的构建系统，根据你的 `Kit` 配置处理你的项目文件并管理编译和链接过程。虽然理解底层构建系统的基础知识有所帮助，但\
    \ Qt Creator 方便地处理了典型开发工作流中的大多数直接交互。\n\n构建系统对于管理 C++ 和 Qt 开发的复杂性至关重要。虽然 Qt 传统的\
    \ `qmake` 系统在多年里运行良好且目前仍然可用，但 `CMake` 是 Qt 6 开发指定的标准，提供了更大的灵活性以及与更广泛的 C++ 生态系统的更好的集成。在整本书中，我们所有的示例和项目都将使用\
    \ `CMake`。基本掌握为什么需要构建系统以及 `CMakeLists.txt` 文件中命令的基本目的，将帮助你理解项目结构并排排除潜在的构建问题。幸运的是，Qt\
    \ Creator 管理了大部分的构建执行工作，让你能够主要专注于编写 C++ 和 QML 代码。一旦完成完成并对构建过程有了基本的理解，我们就可以进入构成\
    \ Qt 编程基石的核心 C++ 概念。\n\n# 第 2 章：Qt 开发者的现代 C++ 基础\n\n## 在 Qt 项目中利用 C++17/20 特性\n\
    \nQt 一直随 C++ 一起进化，特别是 Qt 6，接受并鼓励使用现代 C++ 标准（C++17 和 C++20）。虽然 Qt 提供了了自己的健壮机制，但在适当的地方集成标准\
    \ C++ 特性可以简化你的代码，并使你的 Qt 项目符合现代 C++ 最佳实践。使用这些特性不仅仅是为了采用新语法；更是为了编写更有表现力、更安全且有时更高的代码。假设你已经配置了项目的\
    \ `CMakeLists.txt` 文件以使用较新的 C++ 标准（例如 `set(CMAKE_CXX_STANDARD 17)`），让我们看看特定特性是如何惠及\
    \ Qt 开发的。\n\n### 智能指针 (std::unique_ptr 和 std::shared_ptr)\n\n内存管理在 C++ 中至关重要。Qt\
    \ 提供了一种基于 `QObject` 父子层级的强大对象所有权模型。当父对象 `QObject` 被删除时，它会自动删除其子对象。该系统对于 Qt 框架内的\
    \ GUI 元素和相关对象效果非常好。然而，它并没有涵盖所有的内存管理场景，例如：\n\n- 未派生自 `QObject` 的堆分配对象。\n- 不自然符合父子所有权层级的\
    \ `QObjects`。\n- 内存以外的资源（尽管 RAII 广泛）。\n\n这就是标准 C++ 智能指针成为 Qt 系统不可或缺的补充之处。\n\n\
    - `std::unique_ptr`：这种智能指针强制对动态分配对象的独占所有权。当 `unique_ptr` 超出范围（或被显式重置）时，它会自动删除管理的对象。这符合\
    \ `RAII`（资源获取即初始化）原则，是防止唯一资源内存泄漏的主要工具。你可能在 Qt 类中使用它来管理分配在堆上的非 `QObject` 成员：\n\n\
    ```cpp\n#include <memory>\n#include <QObject>\n\nclass Worker;  // 假设 Worker 不是一个\
    \ QObject\n\nclass Manager : public QObject {\nQ_OBJECT\n\npublic:\n    explicit\
    \ Manager(QObject *parent = nullptr) : QObject(parent) {\n        // 在堆上分配 Worker，由\
    \ unique_ptr 管理\n        worker_ = std::make_unique<Worker>();\n        // ...\
    \ 使用 worker_->doSomething() ...\n    }\n    // 不需要为析构函数编写手动 delete！\n    // 当\
    \ Manager 毁时，worker_ 将被自动删除。\n\nprivate:\n    std::unique_ptr<Worker> worker_;\n\
    };\n```\n\n- `std::shared_ptr`：该指针允许多个 `shared_ptr` 实例通过引用计数共同拥有动态分配的对象。只有当管理它的最后一个\
    \ `shared_ptr` 被删除或重置时，对象才会被删除。当所有权需要在未通过 Qt 父子机制关联的不同部分之间共享时，这非常有用。然而，使用 `shared_ptr`\
    \ 要谨慎——它会因引用计数产生一些性能开销，并带有循环引用的风险（两个对象互相持有对方的 `shared_ptr`，导致无法删除）。`std::weak_ptr`\
    \ 可以帮助打破此类循环但会增加复杂性。\n\n**重要注意：** 避免用智能指针封装由 Qt 层级管理的 `QObject` 子对象。如果你创建一个 `QWidget`\
    \ 并设置了其父对象，Qt 会管理其生命周期。在这种情况下使用 `unique_ptr` 会导致智能指针和 Qt 父对象都尝试删除该对象。在 Qt 所有权模型不适用或不合适的地方使用智能指针。\n\
    \n### 用于简洁连接的 Lambda 表达式\n\nQt 的信号槽机制是对象间通信的基础。虽然存在使用 `SIGNAL` 和 `SLOT` 宏（由于缺乏编译时检查，不再建议使用）或成员函数指针传统方法，但\
    \ C++ Lambda 表达式为连接槽提供了一种高度灵活且通常更易读的替代方案，特别是对于简单的处理程序。\n\nLambda 允许你在 `connect`\
    \ 调用中定义匿名函数。它们在 Qt 中的主要优势包括：\n\n- **简洁性**：简单的槽实现可以直接写在连接处。\n- **上下文捕获**：Lambda\
    \ 可以轻松“捕获”作用范围内的变量，包括 `this` 指针或局部变量，使其在 Lambda 体内部可用。\n- **类型安全**：使用 Lambda 的连接会在编译时检查，防止由于签名不匹配导致的运行时错误。\n\
    \n考虑将 `QPushButton` 的 `clicked` 信号连接到更新 `QLabel`：\n\n```cpp\n#include <QPushButton>\n\
    #include <QLabel>\n#include <QVBoxLayout>\n#include <QApplication> // 必要的头文件\n\
    \n// 假设 button 和 label 是类中的成员指针\n// QPushButton* button_ = ...;\n// QLabel* statusLabel_\
    \ = ...;\n\n// 在设置函数或构造函数内部：\nconnect(button_, &QPushButton::clicked, this, [this]()\
    \ {\n    // 捕获 'this'，允许访问 statusLabel_ 等成员\n    this->clickCount_++;\n    statusLabel_->setText(QString(\"\
    Clicked %1 times\").arg(this->clickCount_));\n});\n```\n\n在这里，Lambda `[this]()\
    \ { ... }` 捕获了 `this` 指针，允许在作为槽的 Lambda 体内访问成员 `statusLabel_` 和假设的 `clickCount_`\
    \ 成员。\n\n### 使用 auto 进行类型推断\n\n`auto` 关键字允许编译器从初始化值自动推断变量的类型。这可以显著减少冗余，特别是对于复杂的\
    \ Qt 类型。\n\n"
- fmt: "\n## Benefits in Qt projects:\n\n- **Brevity**: Avoids writing out lengthy\
    \ type names, such as container iterators or complex template instantiations.\n\
    - **Readability (often)**: Can make code cleaner when the type is obvious from\
    \ the initializer.\n- **Maintainability**: If the type returned by a function\
    \ changes slightly (but is still compatible), code using `auto` might not need\
    \ modification.\n\n### C++\n\n```cpp\n// Without auto\nQList<QString> stringList\
    \ = {\"apple\", \"banana\", \"cherry\"};\nQList<QString>::iterator it = stringList.begin();\n\
    \n// With auto\nauto stringListAuto = QList<QString>{\"apple\", \"banana\", \"\
    cherry\"}; // Type deduced\nauto itAuto = stringListAuto.begin(); // Type QList<QString>::iterator\
    \ deduced\n\n// Useful when dealing with Qt functions returning complex types\n\
    auto *childWidget = parentWidget->findChild<QPushButton*>(\"okButton\"); // Type\
    \ QPushButton* deduced\n```\n\n**Caution**: Use `auto` where it improves clarity,\
    \ not where it obscures the type.\nExplicit types can sometimes be better for\
    \ function parameters or fundamental types.\n`// auto value = 42; // Clearer as\
    \ int value = 42;`\n\n## Range-Based for Loops for Simpler Iteration\n\nC++11\
    \ introduced range-based for loops, providing a much cleaner syntax for iterating\
    \ over containers compared to traditional iterator loops. Qt's containers integrate\
    \ seamlessly with this feature.\n\n### C++\n\n```cpp\nQStringList names = {\"\
    Alice\", \"Bob\", \"Charlie\"};\n\n// Traditional iterator loop\nfor (QStringList::const_iterator\
    \ it = names.constBegin(); it != names.constEnd(); ++it) {\n    qDebug() << *it;\n\
    }\n\n// Range-based for loop (cleaner and less error-prone)\nfor (const QString\
    \ &name : names) { // Use const& for read-only access\n    qDebug() << name;\n\
    }\n\nQVector<int> numbers = {1, 2, 3, 5, 8};\nint sum = 0;\nfor (int number :\
    \ numbers) { // Simple copy for fundamental types\n    sum += number;\n}\n\n//\
    \ Works with QMap too (using structured bindings from C++17)\nQMap<QString, int>\
    \ scores;\nscores[\"Alice\"] = 90;\nscores[\"Bob\"] = 85;\nfor (const auto& [name,\
    \ score] : scores.asKeyValueRange()) { // C++17 structured binding\n    qDebug()\
    \ << name << \"scored\" << score;\n}\n```\n\nRange-based loops are generally preferred\
    \ for iterating over entire Qt containers due to their readability and reduced\
    \ risk of errors (no manual iterator incrementing or end condition checking).\n\
    \n## constexpr Basics for Compile-Time Evaluation\n\nThe `constexpr` keyword signifies\
    \ that a variable or function can be evaluated at compile time. While GUI programming\
    \ heavily involves runtime interactions, `constexpr` still finds its place in\
    \ Qt projects:\n\n- **Compile-Time Constants**: Define constants whose values\
    \ are known at compile time, potentially allowing for optimizations or use in\
    \ contexts requiring compile-time values (like array bounds or template parameters).\n\
    - **Compile-Time Functions**: Create simple utility functions that operate on\
    \ literal types and can be computed during compilation if their inputs are known\
    \ then.\n\n### C++\n\n```cpp\nconstexpr int DefaultWidth = 800;\nconstexpr int\
    \ DefaultHeight = 600;\nconstexpr double AspectRatio = static_cast<double>(DefaultWidth)\
    \ / DefaultHeight;\n\nconstexpr int CalculateBufferSize(int elementCount) {\n\
    \    return elementCount * 128; // Example calculation\n}\n\nclass MyWidget :\
    \ public QWidget {\npublic:\n    MyWidget(QWidget* parent = nullptr) : QWidget(parent)\
    \ {\n        resize(DefaultWidth, DefaultHeight); // Use constexpr variables\n\
    \        constexpr int bufferSize = CalculateBufferSize(10); // Calculated at\
    \ compile time\n        buffer_.resize(bufferSize);\n    }\nprivate:\n    QByteArray\
    \ buffer_;\n};\n```\n\nWhile not as pervasive in typical GUI logic as lambdas\
    \ or `auto`, using `constexpr` where applicable aligns with modern C++ practices\
    \ for defining constants and performing compile-time computations. Embracing modern\
    \ C++ features like smart pointers, lambda expressions, `auto`, range-based for\
    \ loops, and `constexpr` is highly beneficial for Qt 6 development. They allow\
    \ you to write code that is safer (better memory management, compile-time checks),\
    \ more concise (lambdas, `auto`, range-for), and often more expressive. These\
    \ features integrate smoothly with Qt's own mechanisms, providing you with a powerful\
    \ and modern toolkit. As we proceed, we will continue to utilize these C++ features\
    \ naturally within our Qt examples, reinforcing their practical application. Next,\
    \ we will examine Qt's specific object model and value-based classes, understanding\
    \ how they form the foundation of the framework.\n\n## Understanding Qt's Object\
    \ Model\n\nAt the heart of many Qt modules lies the `QObject` class. It serves\
    \ as the foundation for essential framework features, but it behaves quite differently\
    \ from simple C++ data structures or even many classes you might design yourself.\
    \ Simultaneously, Qt provides a wide array of classes designed to behave like\
    \ built-in types, representing values like strings, numbers, sizes, and colors.\
    \ Recognizing when you're working with a `QObject`-based class versus a value-based\
    \ class dictates how you manage its lifetime, how you pass it around, and what\
    \ capabilities it possesses.\n\n### The QObject Class: Identity and Framework\
    \ Integration\n\n`QObject` is the base class for a vast number of Qt classes,\
    \ particularly those involved in:\n\n- **User Interface Elements**: All widgets\
    \ (`QWidget` and its derivatives like `QPushButton`, `QLineEdit`, `QMainWindow`)\
    \ inherit from `QObject`.\n- **Communication**: The powerful signals and slots\
    \ mechanism relies on `QObject`.\n- **Event Handling**: Objects that process events\
    \ typically derive from `QObject`.\n- **Properties**: Qt's dynamic property system\
    \ is built upon `QObject`.\n- **Timers**: `QTimer` is a `QObject`.\n- **Networking**:\
    \ Classes like `QNetworkAccessManager` are `QObjects`.\n\nThe defining characteristic\
    \ of a `QObject` is that it has identity. Each instance of a `QObject` derivative\
    \ represents a unique entity within your application. Consequently, `QObjects`\
    \ are non-copyable and non-assignable. If you look at the `QObject` source code\
    \ (or documentation), you'll find that its copy constructor and copy assignment\
    \ operator are explicitly deleted (or were historically disabled using the `Q_DISABLE_COPY`\
    \ macro). Why? Consider a `QPushButton`. Copying it wouldn't make logical sense\
    \ – would the copy connect to the same user actions? Would it occupy the same\
    \ space on the screen? `QObjects` represent specific instances with unique state\
    \ and connections. You interact with existing `QObject` instances primarily through\
    \ pointers (`QPushButton*`) or references (`QPushButton&`).\n\nThis identity principle\
    \ enables several core Qt features:\n\n1. **Parent-Child Hierarchy and Memory\
    \ Management**: `QObjects` can be organized into hierarchies. When you create\
    \ a `QObject` (typically on the heap using `new`), you can optionally pass a pointer\
    \ to another `QObject` as its parent.\n\n```cpp\n#include <QPushButton>\n#include\
    \ <QVBoxLayout>\n#include <QWidget> // Include necessary headers\n\n// Inside\
    \ a QWidget subclass constructor or setup function:\nQVBoxLayout *layout = new\
    \ QVBoxLayout(this); // 'this' (the widget) is parent of layout\nQPushButton *button1\
    \ = new QPushButton(\"Button 1\", this); // 'this' is parent of button1\nQPushButton\
    \ *button2 = new QPushButton(\"Button 2\"); // No parent initially\nbutton2->setParent(this);\
    \ // Now 'this' is parent of button2\n\nlayout->addWidget(button1);\nlayout->addWidget(button2);\n\
    ```\n\n2. When the parent `QObject` (in this case, the widget pointed to by this)\
    \ is deleted, it automatically iterates through its children and deletes them.\
    \ This mechanism dramatically simplifies memory management, especially for complex\
    \ object trees like GUI layouts, preventing memory leaks as long as the top-level\
    \ object is properly deleted. Note that this applies only to objects allocated\
    \ on the heap (new).\n\n3. **Signals and Slots**: The robust mechanism allowing\
    \ objects to communicate without direct coupling (which we will explore in detail\
    \ later) is intrinsically tied to `QObject`.\n"
  raw: 'Benefits in Qt projects:


    ● Brevity: Avoids writing out lengthy type names, such as container iterators
    or complex template instantiations.


    ● Readability (often): Can make code cleaner when the type is obvious from the
    initializer.


    ● Maintainability: If the type returned by a function changes slightly (but is
    still compatible), code using auto might not need modification.


    C++


    // Without auto


    QList<QString> stringList = {"apple", "banana", "cherry"};


    QList<QString>::iterator it = stringList.begin();


    // With auto


    auto stringListAuto = QList<QString>{"apple", "banana", "cherry"}; // Type deduced


    auto itAuto = stringListAuto.begin(); // Type QList<QString>::iterator deduced


    // Useful when dealing with Qt functions returning complex types


    auto *childWidget = parentWidget->findChild<QPushButton*>("okButton"); // Type
    QPushButton* deduced


    // Caution: Use auto where it improves clarity, not where it obscures the type.


    // Explicit types can sometimes be better for function parameters or fundamental
    types.


    // auto value = 42; // Clearer as int value = 42;


    Range-Based for Loops for Simpler Iteration


    C++11 introduced range-based for loops, providing a much cleaner syntax for iterating
    over containers compared to traditional iterator loops. Qt''s containers integrate
    seamlessly with this feature.


    C++


    QStringList names = {"Alice", "Bob", "Charlie"};


    // Traditional iterator loop


    for (QStringList::const_iterator it = names.constBegin(); it != names.constEnd();
    ++it) {


    qDebug() << *it;


    }


    // Range-based for loop (cleaner and less error-prone)


    for (const QString &name : names) { // Use const& for read-only access


    qDebug() << name;


    }


    QVector<int> numbers = {1, 2, 3, 5, 8};


    int sum = 0;


    for (int number : numbers) { // Simple copy for fundamental types


    sum += number;


    }


    // Works with QMap too (using structured bindings from C++17)


    QMap<QString, int> scores;


    scores["Alice"] = 90;


    scores["Bob"] = 85;


    for (const  auto& [name, score] : scores.asKeyValueRange()) { // C++17 structured
    binding


    qDebug() << name << "scored" << score;


    }


    Range-based loops are generally preferred for iterating over entire Qt containers
    due to their readability and reduced risk of errors (no manual iterator incrementing
    or end condition checking).


    constexpr Basics for Compile-Time Evaluation


    The constexpr keyword signifies that a variable or function can be evaluated at
    compile time. While GUI programming heavily involves runtime interactions, constexpr
    still finds its place in Qt projects:


    ● Compile-Time Constants: Define constants whose values are known at compile time,
    potentially allowing for optimizations or use in contexts requiring compile-time
    values (like array bounds or template parameters).


    ● Compile-Time Functions: Create simple utility functions that operate on literal
    types and can be computed during compilation if their inputs are known then.


    C++


    constexpr  int DefaultWidth = 800;


    constexpr  int DefaultHeight = 600;


    constexpr  double AspectRatio = static_cast<double>(DefaultWidth) / DefaultHeight;


    constexpr  int  CalculateBufferSize(int elementCount) {


    return elementCount * 128; // Example calculation


    }


    class MyWidget :  public QWidget {


    public:


    MyWidget(QWidget* parent = nullptr) : QWidget(parent) {


    resize(DefaultWidth, DefaultHeight); // Use constexpr variables


    constexpr  int bufferSize = CalculateBufferSize(10); // Calculated at compile
    time


    buffer_.resize(bufferSize);


    }


    private:


    QByteArray buffer_;


    };


    While not as pervasive in typical GUI logic as lambdas or auto, using constexpr
    where applicable aligns with modern C++ practices for defining constants and performing
    compile-time computations.


    Embracing modern C++ features like smart pointers, lambda expressions, auto, range-based
    for loops, and constexpr is highly beneficial for Qt 6 development. They allow
    you to write code that is safer (better memory management, compile-time checks),
    more concise (lambdas, auto, range-for), and often more expressive. These features
    integrate smoothly with Qt''s own mechanisms, providing you with a powerful and
    modern toolkit. As we proceed, we will continue to utilize these C++ features
    naturally within our Qt examples, reinforcing their practical application. Next,
    we will examine Qt''s specific object model and value-based classes, understanding
    how they form the foundation of the framework.


    ## Understanding Qt''s Object Model


    * * *


    At the heart of many Qt modules lies the QObject class. It serves as the foundation
    for essential framework features, but it behaves quite differently from simple
    C++ data structures or even many classes you might design yourself. Simultaneously,
    Qt provides a wide array of classes designed to behave like built-in types, representing
    values like strings, numbers, sizes, and colors. Recognizing when you''re working
    with a QObject-based class versus a value-based class dictates how you manage
    its lifetime, how you pass it around, and what capabilities it possesses.


    The QObject Class: Identity and Framework Integration


    QObject is the base class for a vast number of Qt classes, particularly those
    involved in:


    ● User Interface Elements: All widgets (QWidget and its derivatives like QPushButton,
    QLineEdit, QMainWindow) inherit from QObject.


    ● Communication: The powerful signals and slots mechanism relies on QObject.


    ● Event Handling: Objects that process events typically derive from QObject.


    ●     Properties: Qt''s dynamic property system is built upon QObject.


    ●     Timers: QTimer is a QObject.


    ●     Networking: Classes like QNetworkAccessManager are QObjects.


    ●     Concurrency: Thread-related classes often involve QObject.


    The defining characteristic of a QObject is that it has identity. Each instance
    of a QObject derivative represents a unique entity within your application. Consequently,
    QObjects are non-copyable and non-assignable. If you look at the QObject source
    code (or documentation), you''ll find that its copy constructor and copy assignment
    operator are explicitly deleted (or were historically disabled using the Q_DISABLE_COPY
    macro). Why? Consider a QPushButton. Copying it wouldn''t make logical sense –
    would the copy connect to the same user actions? Would it occupy the same space
    on the screen? QObjects represent specific instances with unique state and connections.
    You interact with existing QObject instances primarily through pointers (QPushButton*)
    or references (QPushButton&).


    This identity principle enables several core Qt features:


    1.  Parent-Child Hierarchy and Memory Management:  QObjects can be organized into
    hierarchies. When you create a QObject (typically on the heap using new), you
    can optionally pass a pointer to another QObject as its parent.


    C++


    #include <QPushButton>


    #include <QVBoxLayout>


    #include <QWidget> // Include necessary headers


    // Inside a QWidget subclass constructor or setup function:


    QVBoxLayout *layout = new QVBoxLayout(this); // ''this'' (the widget) is parent
    of layout


    QPushButton *button1 = new QPushButton("Button 1", this); // ''this'' is parent
    of button1


    QPushButton *button2 = new QPushButton("Button 2"); // No parent initially


    button2->setParent(this); // Now ''this'' is parent of button2


    layout->addWidget(button1);


    layout->addWidget(button2);


    2.  When the parent QObject (in this case, the widget pointed to by this) is deleted,
    it automatically iterates through its children and deletes them. This mechanism
    dramatically simplifies memory management, especially for complex object trees
    like GUI layouts, preventing memory leaks as long as the top-level object is properly
    deleted. Note that this applies only to objects allocated on the heap (new).


    3.  Signals and Slots: The robust mechanism allowing objects to communicate without
    direct coupling (which we will explore in detail later) is intrinsically tied
    to QObject.'
