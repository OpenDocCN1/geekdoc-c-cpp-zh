    runs Qt''s Resource Compiler (rcc). rcc reads the .qrc file, finds the specified
    assets on disk, compresses them (by default), and generates a C++ source file
    containing the data as byte arrays. This C++ file is then compiled and linked
    into your final executable.


    Benefits:


    ● Simplified Deployment: Your executable becomes self-contained regarding these
    assets; no need to distribute loose files.


    ● Reliability: Assets cannot be accidentally deleted or moved by the end-user.


    ● Platform Independence: Resource paths work identically across Windows, macOS,
    and Linux.


    ● Potential Speed: Accessing embedded resources might be slightly faster than
    disk I/O, especially after initial loading.


    Basic Internationalization (i18n) with tr()


    Internationalization (often abbreviated as i18n – ''i'' + 18 letters + ''n'')
    is the process of designing software so that it can be adapted to various languages
    and regional peculiarities without engineering changes. Localization (L10n) is
    the process of actually adapting the software for a specific region or language
    by adding locale-specific components and translating text. For applications intended
    for use beyond a single language group (very relevant in a multilingual environment
    like Germany and Europe), designing for translation is essential.


    Qt provides excellent support for i18n, and the cornerstone from the developer''s
    perspective is the QObject::tr() function.


    The Role of tr():


    tr() is used to mark user-visible string literals in your source code as translatable.


    C++


    // Instead of this:


    label->setText("User Name:");


    QMessageBox::information(this, "File Saved", "Your file has been saved successfully.");


    // Use tr():


    label->setText(tr("User Name:"));


    QMessageBox::information(this, tr("File Saved"), tr("Your file has been saved
    successfully."));


    Why is tr() Necessary?


    Crucially, tr() itself does not perform the translation. It serves as a marker
    for Qt''s translation toolchain. When you use tr(), you enable tools like lupdate
    to scan your source code and extract these specific string literals into translation
    files. Strings not wrapped in tr() will simply be invisible to these tools and
    cannot be easily translated using the standard Qt workflow.


    Context and Disambiguation:


    tr() is a member of QObject. When called within a method of a class derived from
    QObject (like your QMainWindow or custom QWidget subclasses), the name of the
    class provides context for the string. This helps translators understand where
    the string is used. For example, tr("Ok") in LoginDialog might need a different
    translation than tr("Ok") in PrinterSettingsDialog. If the class context isn''t
    enough, you can add a comment for the translator:


    C++


    // Disambiguation comment for Qt Linguist


    //: Button text


    okButton->setText(tr("Ok"));


    Or add a second argument to tr() which acts as a disambiguation comment:


    C++


    okButton->setText(tr("Ok", "Confirmation button text"));


    The Translation Workflow (Conceptual Overview):


    While the full details involve several steps and tools, here''s the basic process
    enabled by using tr():


    1.  Developer: Writes code, wrapping all user-facing string literals in tr().


    2.  lupdate Tool: Scans the source code (.cpp, .h, .ui files) and extracts tr()
    strings, creating or updating .ts (Translation Source) XML files for each target
    language (e.g., myapp_de.ts).


    3.  Translator: Uses the Qt Linguist application to open a .ts file (e.g., myapp_de.ts),
    sees the source strings (like "User Name:") along with any context/comments, and
    enters the corresponding translation (e.g., "Benutzername:").


    4.  lrelease Tool: Takes the completed .ts file(s) and compiles them into compact,
    binary .qm (Qt Message) files (e.g., myapp_de.qm). These .qm files are what your
    application actually uses. They are often embedded using the Qt Resource System.


    5.  Application Loading: At runtime (usually in main.cpp), your application creates
    QTranslator objects, uses translator.load() to load the appropriate .qm file (often
    based on QLocale::system() to detect the user''s language, perhaps loading :/translations/app_de.qm
    if the locale is German), and installs the translator(s) onto the QApplication
    instance using app.installTranslator(&translator).


    Once a QTranslator for the user''s language is loaded and installed, subsequent
    calls to tr("Some Text") in your code will automatically look up "Some Text" in
    the loaded .qm file and return the translation if found; otherwise, it returns
    the original literal string. Qt also uses this system for its own built-in dialog
    text ("OK", "Cancel", etc.), which is why loading the qtbase_ translations is
    also common practice.


    Managing application assets and preparing for translation are vital steps in creating
    professional, distributable software. The Qt Resource System (.qrc files) provides
    a robust way to embed resources like icons, images, QSS files, and compiled translation
    (.qm) files directly into your executable, simplifying deployment and ensuring
    assets are always available.


    # Chapter 6:


    # Introduction to Qt Quick and QML for Modern UIs


    * * *


    QML Syntax Fundamentals: Items, Properties, Basic Types


    * * *


    While QtWidgets provide a mature and powerful way to build classic desktop applications,
    Qt offers a second, more modern UI framework called Qt Quick. Qt Quick excels
    at creating dynamic, visually rich interfaces with smooth animations and transitions,
    making it particularly well-suited for mobile applications, embedded devices,
    and contemporary desktop experiences. Instead of constructing the UI imperatively
    step-by-step in C++, Qt Quick uses a declarative language called QML (Qt Modeling
    Language).


    With QML, you describe what the user interface is – its components, their properties,
    and their relationships – rather than writing detailed instructions on how to
    build it. This often leads to more concise, readable UI code that is easier to
    design and iterate upon, especially in collaboration with UI/UX designers.


    Basic QML Document Structure


    QML code is typically written in text files with a .qml extension. A basic QML
    document has a simple structure:


    1.  Import Statements: At the top, you import the QML modules (libraries) that
    provide the building blocks you need. Each import specifies a module and usually
    a version number. The most fundamental module is QtQuick.


    QML


    import QtQuick // Provides basic types like Item, Rectangle, Text, Image


    import QtQuick.Window // Provides the Window type for top-level windows


    2.  You import the specific versions required by the types you use; Qt Creator
    often assists with this.


    3.  Root Element: Every .qml file must define exactly one root QML element (also
    called an object or Item). This element acts as the container for everything else
    defined in that file. Common root elements are Item, Rectangle, or Window.


    4.  Comments: You can use single-line (//) and multi-line (/* ... */) comments,
    just like in C++.


    Fundamental Concepts: Items and Properties


    ● Items: The basic building blocks of a QML interface are called Items. Everything
    you see or interact with (and even some non-visual elements) is an Item or derives
    from the base Item type. The Item type itself is a non-visual element often used
    simply for grouping other items or as a base for custom components. Visual items
    like Rectangle, Text, and Image inherit from Item.


    ● Properties: Items have properties that define their attributes, appearance,
    and behaviour. Examples include width, height, x, y (position), visible, opacity,
    color, text, etc.


    ● Setting Static Values: You assign values to properties using a colon (:) followed
    by the value. The value can be a literal number, a boolean (true/false), a string
    (enclosed in double quotes "), a color (as a string like "blue", "#FF0000", or
    using Qt.rgba(...)), or an enumeration value (e.g., Text.AlignRight).


