    complex (e.g., completely new dataset, major sort/filter), call beginResetModel()
    before the change, modify the data, then call endResetModel(). Views will discard
    all cached information and request everything anew. Use this sparingly as it can
    be inefficient for large views.


    QML Integration: roleNames()


    As highlighted previously, for custom models intended for use in QML views (ListView,
    TableView, Repeater), you must reimplement roleNames():


    C++


    // In MyCustomModel.h


    QHash<int, QByteArray> roleNames() const  override;


    // In MyCustomModel.cpp


    QHash<int, QByteArray> MyCustomModel::roleNames() const {


    QHash<int, QByteArray> roles;


    roles[Qt::DisplayRole] = "display"; // Standard role mapped


    roles[Qt::DecorationRole] = "decoration";


    roles[MyCustomRole1] = "roleNameForQml1"; // Custom role mapped


    roles[MyCustomRole2] = "roleNameForQml2";


    return roles;


    }


    This mapping allows your QML delegate to access data for specific roles using
    convenient property names: model.display, model.decoration, model.roleNameForQml1,
    etc.


    Complexity and Considerations


    Developing custom models, especially for complex tree structures or editable data,
    requires careful implementation. Key considerations include:


    ● Correct QModelIndex Management: Ensuring index(), parent(), and createIndex()
    work correctly with your internal data representation is crucial and often the
    trickiest part.


    ● Performance: The data() function can be called very frequently; ensure it accesses
    your backend data efficiently.


    ● Signal Emission: Correctly emitting dataChanged, rowsInserted, etc., is vital
    for keeping views synchronized. Forgetting signals is a common source of bugs.


    ● Thread Safety: If your backend data can be modified from other threads, your
    model implementation (especially data() and signal emission) must be thread-safe,
    often requiring mutexes or other synchronization mechanisms.


    While Qt''s standard models cover many common cases, implementing a custom model
    by subclassing QAbstractItemModel, QAbstractListModel, or QAbstractTableModel
    provides the ultimate flexibility for integrating complex, dynamic, or non-standard
    data sources with Qt''s powerful view classes in both QtWidgets and QML. It requires
    careful implementation of core virtual functions for structure definition (rowCount,
    columnCount), data retrieval (data), index creation (index, parent), editing (setData,
    flags), dynamic updates (signal emissions), and QML integration (roleNames). Although
    more complex than using standard models, custom models are essential for building
    scalable, high-performance, data-driven applications tailored to specific backend
    requirements, a common necessity in sophisticated software development seen in
    hubs like Frankfurt and beyond.


    # Chapter 9:


    # Networking, Data Storage, and Files


    * * *


    Using `QNetworkAccessManager` for HTTP Requests


    * * *


    In today''s interconnected world (as of April 2025), applications rarely operate
    in isolation. They frequently need to communicate over networks – primarily the
    internet – to download updates, fetch dynamic content, interact with RESTful web
    APIs, or synchronize data with servers. Whether you''re accessing financial market
    data APIs (common in a hub like Frankfurt), pulling weather information, loading
    user profiles, or interacting with your own custom backend, HTTP and its secure
    variant HTTPS are the dominant protocols. Qt provides robust support for network
    communication through its Qt Network module, centered around the QNetworkAccessManager
    class.


    Setting Up


    First, ensure your project includes the Qt Network module.


    ●     In a .pro file: QT += network


    ●     In CMakeLists.txt:


    CMake


    find_package(Qt6 REQUIRED COMPONENTS Network Core Gui Widgets) # Add Network


    # ...


    target_link_libraries(YourTargetName PRIVATE Qt6::Core Qt6::Gui Qt6::Widgets Qt6::Network)
    # Link against Network


    The Asynchronous Nature of Network Operations


    Network requests can take an unpredictable amount of time to complete due to network
    latency, server load, or connection issues. Performing network operations synchronously
    (waiting for the response before continuing) would block the main thread of your
    application, freezing the user interface – a completely unacceptable user experience.


    QNetworkAccessManager is designed to work asynchronously. When you initiate a
    network request, QNetworkAccessManager returns control to your application immediately
    and performs the network operation in the background, leveraging Qt''s event loop.
    It notifies you about progress and completion using signals.


    The Standard Workflow


    Interacting with QNetworkAccessManager follows a consistent pattern:


    1.  Create Manager: Instantiate QNetworkAccessManager. Typically, you create one
    long-lived instance for your application or a major component. It''s often a member
    of your main window or a dedicated network service class. Remember to give it
    a parent QObject for proper memory management.


    C++


    #include <QNetworkAccessManager>


    // In your class constructor or initialization:


    networkManager_ = new QNetworkAccessManager(this);


    2.  Prepare Request: Create a QNetworkRequest object. Set the target URL using
    setUrl(). You can also set various request headers (like User-Agent, Authorization,
    or Content-Type for POST/PUT) using setHeader().


    C++


    #include <QNetworkRequest>


    #include <QUrl>


    QNetworkRequest request(QUrl("https://api.example.com/data"));


    request.setHeader(QNetworkRequest::UserAgentHeader, "MyAwesomeApp/1.0");


    3.  Issue Request: Call the appropriate method on the QNetworkAccessManager instance,
    passing the QNetworkRequest. Common methods include get(), post(), put(), deleteResource().
    These methods immediately return a pointer to a QNetworkReply object.


    C++


    #include <QNetworkReply>


