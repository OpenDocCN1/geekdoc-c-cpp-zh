  trans: "\n\n## 4. 连接信号\n将槽（或 lambda 表达式）连接到 `QNetworkReply` 对象发出的信号，以便处理执行结果。最重要的信号是\
    \ `finished()`。其他信号还包括 `errorOccurred(QNetworkReply::NetworkError)`、`downloadProgress(qint64\
    \ bytesReceived, qint64 bytesTotal)` 以及 `uploadProgress(...)`。\n\n```C++\nconnect(reply,\
    \ &QNetworkReply::finished, this, &MyClass::handleReplyFinished);\n\n// 或者使用 lambda\
    \ 表达式：\n\n// connect(reply, &QNetworkReply::finished, this, [=]() { 在此处处理回复 */\
    \ });\n```\n\n## 5. 处理回复（在 finished 槽函数中）\n当 `finished()` 信号发出时，你连接的槽函数会执行。在该槽内部：\n\
    \n- **检查错误**：始终先检查 `reply->error()`。如果它不是 `QNetworkReply::NoError`，则处理错误（例如：显示消息、记录\
    \ `reply->errorString()`）。你也可以检查 HTTP 状态码：`reply->attribute(QNetworkRequest::HttpStatusCodeAttribute).toInt()`。\n\
    - **读取数据**：如果没有错误，使用 `QByteArray responseData = reply->readAll();` 读取响应体。\n- **处理数据**：解析或使用\
    \ `responseData`（例如：解析 JSON、显示图像、保存到文件）。\n- **清理**：至关重要的一点是，使用 `reply->deleteLater();`\
    \ 为 `QNetworkReply` 对象调度删除。这确保了对象在当前事件循环结束后会被安全地删除。如果不这样做将导致内存泄漏。\n\n## 发起 GET\
    \ 请求（获取数据）\nGET 请求用于从指定的 URL 获取数据。\n\n```C++\n// 在启动请求的函数中\n\nvoid MyClass::fetchData()\
    \ {\n    QUrl url(\"https://jsonplaceholder.typicode.com/posts/1\"); // 示例公共 API\n\
    \n    QNetworkRequest request(url);\n    QNetworkReply *reply = networkManager_->get(request);\n\
    \n    // 此处将 finished 信号连接到 lambda 以保持简洁\n    connect(reply, &QNetworkReply::finished,\
    \ this, [=]() {\n        // 当回复完成时执行此 lambda\n        if (reply->error() == QNetworkReply::NoError)\
    \ {\n            QByteArray responseData = reply->readAll();\n            qDebug()\
    \ << \"GET Response:\" << responseData;\n            // TODO: 处理数据（例如：解析 JSON）\n\
    \        } else {\n            qDebug() << \"GET Error:\" << reply->errorString();\n\
    \            qDebug() << \"HTTP Status Code:\" << reply->attribute(QNetworkRequest::HttpStatusCodeAttribute).toInt();\n\
    \        }\n        // 重要：调度删除回复\n        reply->deleteLater();\n    });\n}\n\
    ```\n\n## 发起 POST 请求（发送数据）\nPOST 请求通常用于将数据提交到服务器（例如：创建新资源、提交表单数据）。\n\n```C++\n\
    // 在启动请求的函数中\n\nvoid MyClass::submitData(const QJsonObject &jsonData) { // 假设\
    \ jsonData 已准备就\n    QUrl url(\"https://jsonplaceholder.typicode.com/posts\");\
    \ // 用于 POST 的示例公共 API\n\n    QNetworkRequest request(url);\n    // 为 JSON 数据设置合适的头\n\
    \    request.setHeader(QNetworkRequest::ContentTypeHeader, \"application/json\"\
    );\n\n    // 将 JSON 对象转换为 QByteArray\n    QByteArray postData = QJsonDocument(jsonData).toJson();\n\
    \    QNetworkReply *reply = networkManager_->post(request, postData);\n\n    connect(reply,\
    \ &QNetworkReply::finished, this, [=]() {\n        if (reply->error() == QNetworkReply::NoError)\
    \ {\n            // 读取服务器对 POST 的响应\n            QByteArray responseData = reply->readAll();\n\
    \            qDebug() << \"POST Response:\" << responseData;\n            // 通常包含创建的资源的\
    \ ID 等\n        } else {\n            qDebug() << \"POST Error:\" << reply->errorString();\n\
    \            qDebug() << \"HTTP Status Code:\" << reply->attribute(QNetworkRequest::HttpStatusCodeAttribute).toInt();\n\
    \        }\n        reply->deleteLater();\n    });\n}\n```\n\n类似的模式也适用于 `put()`（更新数据）和\
    \ `deleteResource()`（删除数据）。\n\n## 错误处理与 HTTPS\n在你的 finished 处理程序中始终检查 `reply->error()`。区分网络级错误（`reply->error()\
    \ != NoError`）和 HTTP 状态码指示的应用级错误（4xx 表示客户端错误，5xx 表示服务器错误）。\n\n对于 HTTPS URL，Qt\
    \ 需要访问 SSL/TLS 库。在 macOS 和最近的 Windows 上，它通常使用原生操作系统能力（Secure Transport/Schannel）。在\
    \ Linux 和较旧的 Windows 上，或者在静态编译 Qt 时，你通常需要确保运行时可用兼容的 OpenSSL 库。在部署应用程序的同时部署正确的\
    \ OpenSSL 库（`libssl`, `libcrypto`）是一个常见需求，如果漏掉有时会成为部署问题的根源。\n\n## 处理响应数据\n`reply->readAll()`\
    \ 方法返回一个 `QByteArray`。你通常需要对其进行处理：\n\n- **JSON**：使用 `QJsonDocument::fromJson(responseData)`\
    \ 解析，然后使用 `QJsonObject` 或 `QJsonArray` 遍历数据（稍后会更详细介绍）。\n- **图像**：直接从 `QByteArray`\
    \ 创建 `QPixmap` 或 `QImage`。\n- **纯文本/HTML**：转换为 `QString`（假设为 UTF-8 编码，则使用 `QString::fromUtf8(responseData)`）。\n\
    \n## 线程说明\n由于 `QNetworkAccessManager` 使用事件循环异步操作，它不会阻塞创建它的线程（通常是主线程/GUI 线程）。`QNetworkReply`\
    \ 的槽函数会在该线程中执行。\n\n"
- fmt: "\n```cpp\n// QCoreApplication::setOrganizationDomain(\"mycompany.com\"); //\
    \ Optional but good\n\n// QCoreApplication::setApplicationName(\"MyApp\");\n\n\
    // ... later ...\n\n// QSettings settings; // Uses global names\n\n// Method 2:\
    \ Specify in constructor (useful if names vary or aren't global)\n\nQSettings\
    \ settings(\"MyCompanyName\", \"MyApp\");\n```\n\n### 2. Saving Values (setValue):\
    \ Use `setValue()` to store data. The key can use `/` to create logical groups\
    \ (like directories). `QSettings` automatically handles storing various data types\
    \ via `QVariant`.\n\n```cpp\n// Assuming 'this' is your main window (QWidget*)\n\
    \nsettings.beginGroup(\"MainWindow\"); // Start a group for clarity\nsettings.setValue(\"\
    size\", this->size());\nsettings.setValue(\"pos\", this->pos());\nsettings.endGroup();\
    \ // End the group\nsettings.setValue(\"Editor/wrapLines\", true);\nsettings.setValue(\"\
    RecentFiles\", QStringList() << \"/path/a.txt\" << \"/path/b.txt\");\nsettings.setValue(\"\
    HighlightColor\", QColor(Qt::yellow));\n```\n\n### 3. Retrieving Values (value):\
    \ Use `value()` to retrieve settings. Crucially, always provide a default value\
    \ as the second argument. This ensures your application behaves correctly if the\
    \ setting hasn't been saved yet (e.g., on first launch). The returned value is\
    \ a `QVariant`, so you need to convert it to the expected type using `.toType()`\
    \ methods.\n\n```cpp\nsettings.beginGroup(\"MainWindow\");\n// Provide defaults\
    \ matching expected type\nQSize size = settings.value(\"size\", QSize(1024, 768)).toSize();\n\
    QPoint pos = settings.value(\"pos\", QPoint(100, 100)).toPoint();\nsettings.endGroup();\n\
    bool wrap = settings.value(\"Editor/wrapLines\", true).toBool();\nQStringList\
    \ recent = settings.value(\"RecentFiles\").toStringList(); // Default is empty\
    \ list\nQColor highlight = settings.value(\"HighlightColor\", Qt::white).value<QColor>();\
    \ // Use .value<T>()\n\n// Apply retrieved settings\n// resize(size);\n// move(pos);\n\
    // editor->setLineWrapMode(wrap ? QTextEdit::WidgetWidth : QTextEdit::NoWrap);\n\
    ```\n\n### 4. Scope: By default, `QSettings` operates in `QSettings::UserScope`\
    \ (settings specific to the current user). You can specify `QSettings::SystemScope`\
    \ for system-wide settings, but writing these usually requires administrative\
    \ privileges.\n\n`QSettings` is perfect for simple key-value configuration data\
    \ but less suitable for storing large amounts of data, complex relational information,\
    \ or user documents in specific file formats.\n\n## Basic File Operations: QFile\
    \ and QDir\n\nFor handling arbitrary file content (user documents, log files,\
    \ custom data formats) and interacting with the directory structure, Qt provides\
    \ `QFile` and `QDir`.\n\n### QFile: Reading and Writing File Content\n\n`QFile`\
    \ provides an interface for basic I/O operations on individual files.\n\n1. **Opening**:\
    \ Create a `QFile` object with the path. Call `open()` specifying the mode (`QIODevice::ReadOnly`,\
    \ `QIODevice::WriteOnly`, `QIODevice::ReadWrite`, `QIODevice::Append`). Always\
    \ check if `open()` returns `true` before proceeding. The optional `QIODevice::Text`\
    \ flag enables automatic conversion of newline characters between the platform's\
    \ convention and `\\n`.\n\n```cpp\n#include <QFile>\n#include <QTextStream> //\
    \ For text I/O\n#include <QDebug>\n#include <QStandardPaths> // For standard locations\n\
    #include <QDir>           // For path manipulation\n\nQString documentsPath =\
    \ QStandardPaths::writableLocation(QStandardPaths::DocumentsLocation);\nQString\
    \ filePath = documentsPath + QDir::separator() + \"myfile.txt\"; // Use separator()\
    \ for portability\nQFile file(filePath);\n\n// Writing Example\nif (!file.open(QIODevice::WriteOnly\
    \ | QIODevice::Text)) {\n    qWarning() << \"Could not open file for writing:\"\
    \ << file.errorString();\n    // return; // Or handle error appropriately\n} else\
    \ {\n    QTextStream out(&file);\n    out << \"Hello from Qt Application!\" <<\
    \ Qt::endl; // Use Qt::endl for newline + flush\n    out << \"Current time (CEST):\
    \ \" << QDateTime::currentDateTime().toString(Qt::ISODate) << Qt::endl;\n    //\
    \ file.write(someQByteArray); // For binary data\n    file.close(); // Good practice,\
    \ though destructor also closes\n}\n\n// Reading Example\nif (!file.open(QIODevice::ReadOnly\
    \ | QIODevice::Text)) {\n    qWarning() << \"Could not open file for reading:\"\
    \ << file.errorString();\n    // return;\n} else {\n    QTextStream in(&file);\n\
    \    while (!in.atEnd()) {\n        QString line = in.readLine();\n        qDebug()\
    \ << \"Read line:\" << line;\n    }\n    // Or read all at once (for smaller files):\n\
    \    // file.seek(0); // Rewind if needed after line reading\n    // QByteArray\
    \ allData = file.readAll();\n    // qDebug() << \"Read all:\" << QString::fromUtf8(allData);\
    \ // Assuming UTF-8\n    file.close();\n}\n```\n\n2. You can also use `QFile`\
    \ to read files embedded via the Qt Resource System (e.g., `QFile resourceFile(\"\
    :/data/config.dat\");`).\n\n### QDir: Directory Operations\n\n`QDir` provides\
    \ functionality for querying and manipulating directories and paths.\n\n```cpp\n\
    #include <QDir>\n#include <QStringList>\n#include <QDebug>\n#include <QStandardPaths>\n\
    \n// Get standard paths (Recommended!)\nQString configPath = QStandardPaths::writableLocation(QStandardPaths::ConfigLocation);\
    \ // Usually ~/.config/YourApp\nQString dataPath = QStandardPaths::writableLocation(QStandardPaths::AppDataLocation);\
    \ // Usually ~/.local/share/YourApp\n\n// Create directory if it doesn't exist\n\
    QDir configDir(configPath);\nif (!configDir.exists()) {\n    if (configDir.mkpath(\"\
    .\")) { // create the path represented by configDir\n        qDebug() << \"Created\
    \ config directory:\" << configPath;\n    } else {\n        qWarning() << \"Failed\
    \ to create config directory:\" << configPath;\n    }\n}\n\n// List files in current\
    \ directory\nQDir currentDir = QDir::current(); // Or QDir(\".\")\nqDebug() <<\
    \ \"Current Path:\" << currentDir.absolutePath();\n\nQStringList entries = currentDir.entryList(QStringList()\
    \ << \"*.cpp\" << \"*.h\", // Filter by pattern\n    QDir::Files | QDir::NoDotAndDot,\
    \ // Filter by type\n    QDir::Name); // Sort by name\nqDebug() << \"C++/Header\
    \ Files:\" << entries;\n\n// Check directory existence\nQDir tempDir = QDir::temp();\
    \ // Get system temp\nqDebug() << \"Temp directory exists:\" << tempDir.exists();\n\
    ```\n"
