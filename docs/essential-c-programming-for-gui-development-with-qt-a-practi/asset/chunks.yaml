  trans: "\n使 QML 接口具有交互性涉及捕捉用户输入，通常使用 `MouseArea` 来处理鼠标和基础触摸事件，并在 `onClicked` 或 `onEntered`\
    \ 等信号处理器中进行响应。虽然可以在这些处理器中以命令式的方式进行简单的属性更改，但 `QML States`（状态）为定义不同的视觉配置提供了一种强大且声明式的方法。通过定义一个带有\
    \ `PropertyChanges` 的 `State` 对象，并根据事件修改项目的 `state` 属性，你可以创建结构良好且易于维护的交互式组件，为更复杂的行为和流畅的视觉过渡铺平道路。\n\
    \n# 第 7 章：动态 UI 与 C++ 集成\n\n## 使用自定义 QML 组件构建可复用的 UI 元素\n\n想象正在设计一个应用程序界面。你可能需要几个具有特定自定义外观的按钮（圆角、特定的悬停效果、文本旁边的图标），或者可能需要多个与验证状态图标配对的输入字段实例。在整个\
    \ UI 代码中重复定义这些元素的 QML 结构和逻辑会导致代码重复、增加维护难度（一处的更改需要应用到每处），并让你的主 QML 文件变得杂乱。\n\n\
    解决方案是将这些的 UI 模式封装到自定义 QML 组件中。自定义组件本质上是一个自包含的 QML 元素，定义在自己的 `.qml` 文件中，可以像标准 QML\
    \ 类型（如 `Rectangle`、`Text` 等）一样实例化和复用。这促进了模块化、可复用性和维护性——这些良好软件设计的核心原则。\n\n### 创建基础\
    \ QML 组件\n\n基本思想非常简单：任何 `.qml` 文件都可以作为自定义组件。\n\n1. **创建 .qml 文件**：创建一个扩展名为 `.qml`\
    \ 的新文本文件（例如 `MyCustomButton.qml`）。\n2. **定义根节点**：在该文件中，定义单个根 QML `Item`（例如 `Item`、`Rectangle`、`FocusScope`），作为组件的基类或容器。该根节点连同在其中定义的任何子节点构成了组件的内部结构。\n\
    3. **文件名即类型名**：文件名（首字母大写且不带 `.qml` 扩展名）将成为你在其他地方实例化该组件时使用的 QML 类型名。因此，`MyCustomButton.qml`\
    \ 定义了 `MyCustomButton` 类型。\n\n#### 目录结构与导入\n\n默认情况下，同一目录下的 QML 文件通常可以直接通过其类型名相互实例化。为了更好地组织代码，你通常会将自定义组件放在子目录中（例如\
    \ `components` 文件夹）。要使用来自子目录的组件，你需要在使用它们的 QML 文件中导入该目录：\n\n```qml\nimport QtQuick\n\
    import \"./components\"  // 导入来自 'components' 子目录的组件\n\n// ... 后续 ...\n\nMyCustomButton\
    \ {\n    // ... 属性 ...\n}\n```\n\n（对于较大的项目或库，存在更高级的模块定义机制）。\n\n### 定义组件的公共接口\n\
    \n组件的一个关键方面是封装：隐藏内部复杂性并为外部使用提供一个清晰、定义的接口。该接口由自定义属性、信号和方法组成。\n\n* **自定义属性**：允许组件的用户配置其外观或行为。在组件\
    \ `.qml` 文件的根层级定义它们有两种主要方式：\n    * `property <type> propertyName: <defaultValue>`：定义一个特定于你组件的全新属性。内部元素随后可以绑定到此属性。\n\
    \    ```qml\n    // 在 MyCustomButton.qml 内部根层级\n    property color buttonColor:\
    \ \"lightgray\"  // 带有默认值的新属性\n    property int cornerRadius: 4\n    // 内部 Rectangle\
    \ 可能会绑定：color: buttonColor; radius: cornerRadius\n    ```\n    * `property alias\
    \ aliasName: internalItemId.propertyName`：在组件上以新名称（`aliasName`）直接暴露内部子项的现有属性。这对于直接访问文本或源\
    \ URL 等常用属性非常有用。\n    ```qml\n    // 在 MyCustomButton.qml 内部，假设内部 Text 项的 id 为\
    \ buttonLabel\n    property alias text: buttonLabel.text // 暴露内部 Text 的 text 属性\n\
    \    ```\n\n* **自定义信号**：允许你的组件向外部用户通知重要的内部事件（例如被点击、值改变）。使用 `signal` 关键字声明信号，后跟信号名和可选的带类型参数。\n\
    \    ```qml\n    // 在 MyCustomButton.qml 内部根层级\n    signal clicked(var mouseArgs)\
    \ // 定义 'clicked' 信号，传递鼠标事件参数\n    signal toggled(bool isChecked) // 为可检查组件定义信号\n\
    \    ```\n    * 你可以在组件内部的 JavaScript 代码中（例如在 `MouseArea` 处理器内部）使用信号名像调用函数一样发射这些信号：`clicked(mouse)`\
    \ 或 `toggled(true)`。\n\n* **自定义方法（函数）**：你可以直接在组件的根节点内定义 JavaScript 函数，以便从外部在组件实例上调用这些方法。\n\
    \    ```qml\n    // 在 MyCustomButton.qml 内部根层级\n    function highlight() {\n \
    \   // 假设 'rootRect' 是主 Rectangle 的 id\n        rootRect.border.color = \"red\"\
    ;\n        console.log(text + \" button highlighted!\");\n    }\n    ```\n\n###\
    \ 示例：可复用的 SimpleButton.qml 组件\n\n让我们创建一个基础按钮组件：\n\n```qml\n// SimpleButton.qml\n\
    import QtQuick\n\nRectangle { // 根节点是一个 Rectangle\n  id: root  // 给根节点一个 id 以供内部引用\n\
    \n  // --- 公共接口 ---\n  property alias text: buttonLabel // 暴露的 text 属性\n  property\
    \ color buttonColor: \"lightgray\"  // 按钮颜色属性\n  property int cornerRadius: 4\
    \           // 圆角属性\n  property color textColor: \"black\"      // 文字颜色属性\n\n\
    \  // --- 内部实现 ---\n  width: buttonLabel.implicitWidth + 20\n  height: buttonLabel.implicitHeight\
    \ + 10\n  radius: cornerRadius\n\n  Text {\n    id: buttonLabel\n    anchors.centerIn:\
    \ parent\n    text: \"Default Text\" // 未设置时的默认文本\n    font.pointSize: 12\n  \
    \  color: textColor\n  }\n\n  MouseArea {\n    id: mouseArea\n    anchors.fill:\
    \ parent\n    hoverEnabled: true\n    cursorShape: Qt.PointingHandCursor\n   \
    \ onClicked: {\n      root.clicked() // 发射信号\n    }\n  }\n}\n```\n\n#### 使用 SimpleButton\n\
    \n现在，在另一个文件中（例如同一目录下的 `Main.qml`），你可以使用此组件：\n\n```qml\n// Main.qml\nimport QtQuick\n\
    import QtQuick.Window\nimport QtQuick.Layouts\n\nWindow {\n  width: 300; height:\
    \ 200\n  visible: true\n  title: \"自定义组件测试\"\n\n  ColumnLayout { // 使用布局排列按钮\n\
    \    anchors.centerIn: parent\n    spacing: 10\n\n    SimpleButton { // 第一个实例\n\
    \      id: okButton\n      text: \"确定\"  // 设置暴露的 text 属性 (alias)\n      buttonColor:\
    \ \"lightgreen\"\n      hoverColor: \"palegreen\"\n      onClicked: { // 处理自定义信号\n\
    \        console.log(\"确定被点击了!\")\n      }\n    }\n\n    SimpleButton { // 第二个实例\n\
    \      id: cancelButton\n      text: \"取消\"\n      buttonColor: \"#FFDDDD\"\n\
    \      hoverColor: \"#EEEEEEEE\"\n      textColor: \"darkred\"\n      Layout.alignment:\
    \ Qt.AlignRight // 布局属性\n      onClicked: {\n        console.log(\"取消被点击了!\")\n\
    \        Qt.quit() // 示例操作\n      }\n    }\n  }\n}\n```\n\n注意每个 `SimpleButton`\
    \ 都是以声明的方式创建的。我们使用 `SimpleButton.qml` 中定义的自定义属性（`text`、`buttonColor` 等）来配置每个实例，并使用熟悉的\
    \ `onSignalName` 语法连接到自定义 `clicked` 信号。内部结构（`Rectangle`、`Text`、`MouseArea`）对组件的用户是不可见的。\n"
- fmt: "\nQML components, defined simply as `.qml` files, are the cornerstone of building\
    \ scalable, maintainable, and reusable Qt Quick user interfaces. By encapsulating\
    \ structure and logic within a component file and defining a clear public interface\
    \ through custom properties (using `property` and `property alias`), signals (`signal`),\
    \ and methods (`function`), you can create complex UIs by assembling simpler,\
    \ well-defined building blocks. This approach significantly reduces code duplication,\
    \ improves readability, and makes future modifications much easier.\n\n## Exposing\
    \ Data and Functionality (Properties, Slots, Models)\n\nWhile QML excels at defining\
    \ the structure, layout, and visual appearance of a modern user interface, most\
    \ real-world applications require more complex backend logic, performance-intensive\
    \ operations, interaction with operating system features, or integration with\
    \ existing C++ libraries and data structures. Therefore, effectively bridging\
    \ the gap between your declarative QML frontend and your imperative C++ backend\
    \ is a crucial skill for Qt Quick development. Qt provides robust mechanisms for\
    \ this integration.\n\nQML's strength lies in its declarative nature for UI design,\
    \ animations, and states. C++, on the other hand, excels at computation, system\
    \ interaction, managing complex application logic, and achieving high performance.\
    \ A typical Qt Quick application leverages the strengths of both, using QML for\
    \ the presentation layer and C++ for the business logic and data backend. The\
    \ key is enabling seamless communication between these two worlds. Qt allows C++\
    \ objects and their features (properties, methods, signals) to be exposed to the\
    \ QML environment, making them directly accessible from QML code and JavaScript\
    \ expressions.\n\n### Exposing C++ Objects via Context Properties\n\nOne of the\
    \ most common and straightforward ways to make C++ functionality available to\
    \ QML is by setting context properties. You create an instance of your C++ class\
    \ (which must inherit from `QObject`) in your C++ application setup (usually `main.cpp`)\
    \ and register that specific instance with the QML engine's root context under\
    \ a chosen name. This makes that C++ object instance globally accessible within\
    \ the QML files loaded by that engine.\n\nImplementation (`main.cpp`):\n\n```cpp\n\
    #include <QGuiApplication>\n#include <QQmlApplicationEngine>\n#include <QQmlContext>\
    \ // Required for context properties\n#include \"backend.h\" // Your C++ backend\
    \ class header\n\nint main(int argc, char *argv[]) {\n    QGuiApplication app(argc,\
    \ argv);\n    Backend backendLogic; // 1. Create an instance of your C++ QObject\
    \ class\n    QQmlApplicationEngine engine;\n    // 2. Expose the instance to QML\
    \ under the name \"backend\"\n    engine.rootContext()->setContextProperty(\"\
    backend\", &backendLogic);\n    const QUrl url(QStringLiteral(\"qrc:/main.qml\"\
    )); // Path to your main QML file\n    QObject::connect(&engine, &QQmlApplicationEngine::objectCreated,\
    \ &app, [url](QObject *obj, const QUrl &objUrl) {\n        if (!obj && url ==\
    \ objUrl)\n            QCoreApplication::exit(-1);\n    }, Qt::QueuedConnection);\n\
    \    engine.load(url);\n    return app.exec();\n}\n```\n\nAccessing in QML: Now,\
    \ within any QML file loaded by this engine (like `main.qml` or components it\
    \ uses), you can directly refer to the C++ object using the name \"backend\":\n\
    \n```qml\n// Inside main.qml or another loaded QML file\nimport QtQuick\n\nItem\
    \ {\n    // Access properties/methods/signals of the C++ object\n    Text {\n\
    \        text: backend.someDataProperty // Access a C++ property\n    }\n    Button\
    \ { // Assuming a Button component exists\n        text: \"Call C++ Function\"\
    \n        onClicked: backend.doSomethingInCpp(\"hello from QML\") // Call C++\
    \ method\n    }\n    // Connections { target: backend; onDataReady: console.log(\"\
    C++ Signal!\") } // Connect to C++ signal\n}\n```\n\n### Making C++ Features Accessible\
    \ from QML\n\nFor a C++ object exposed as a context property (or via other registration\
    \ methods) to be useful in QML, its class needs to be structured correctly:\n\n\
    1.  **Inherit QObject**: The C++ class must inherit from `QObject`.\n2.  **Q_OBJECT\
    \ Macro**: It must include the `Q_OBJECT` macro in its declaration to enable the\
    \ Meta-Object System.\n\nWith this foundation, specific C++ features become accessible:\n\
    \n*   **Properties (`Q_PROPERTY`)**: Properties declared in your C++ class using\
    \ `Q_PROPERTY` are the primary way to expose data to QML.\n    *   `READ`: A `READ`\
    \ function (getter) makes the property readable from QML (`backend.propertyName`).\n\
    \    *   `WRITE`: A `WRITE` function (setter) makes the property modifiable from\
    \ QML (`backend.propertyName = newValue`).\n    *   `NOTIFY`: A `NOTIFY` signal\
    \ is essential for enabling QML's property binding. When the C++ code changes\
    \ the property's value (usually within the setter) and emits the associated `NOTIFY`\
    \ signal, the QML engine detects this and automatically updates any QML properties\
    \ bound to it.\n\n```cpp\n// In Backend.h\nclass Backend : public QObject {\n\
    \    Q_OBJECT\n    // Property: readable, writable (optional), with change notification\n\
    \    Q_PROPERTY(QString userName READ userName WRITE setUserName NOTIFY userNameChanged)\n\
    public:\n    // ... constructor ...\n    QString userName() const;\n    void setUserName(const\
    \ QString &name);\nsignals:\n    void userNameChanged(QString userName); // NOTIFY\
    \ signal\nprivate:\n    QString m_userName;\n};\n```\n\n```qml\n// In QML\nText\
    \ { text: \"User: \" + backend.userName } // Binds to userName, updates on userNameChanged\n\
    TextInput { onAccepted: backend.userName = text } // Modifies C++ property\n```\n\
    \n*   **Slots and Invokable Methods (`Q_INVOKABLE`)**: Public slots in your C++\
    \ class, or any public member function explicitly marked with the `Q_INVOKABLE`\
    \ macro, can be called directly as methods from QML/JavaScript.\n\n```cpp\n//\
    \ In Backend.h\npublic slots: // Or use Q_INVOKABLE\nvoid processData(int value);\n\
    ```\n\n```qml\n// In QML\nButton { onClicked: backend.processData(42) }\n```\n\
    \n*   **Signals**: Signals defined in your C++ class using the `signals:` keyword\
    \ can be connected to by QML signal handlers using the `onSignalName:` syntax\
    \ or the `Connections` element.\n\n```cpp\n// In Backend.h\nsignals:\n    void\
    \ calculationComplete(double result);\n\n// In C++ (e.g., inside processData)\n\
    // ... perform calculation ...\n// emit calculationComplete(calculatedResult);\n\
    ```\n\n```qml\n// In QML\nItem {\n    // Method 1: Direct connection on context\
    \ property\n    backend.onCalculationComplete: {\n        console.log(\"Calculation\
    \ result from C++:\", result)\n        resultDisplayLabel.text = \"Result: \"\
    \ + result // Update UI\n    }\n    // Method 2: Using Connections element (useful\
    \ if 'backend' isn't the root id)\n    Connections {\n        target: backend\n\
    \        function onCalculationComplete(result) { // Use 'function' here\n   \
    \         console.log(\"Alternate connection:\", result)\n        }\n    }\n}\n\
    ```\n\n### Exposing List Data via C++ Models\n\nWhile exposing simple properties\
    \ and calling methods works well for individual pieces of data or triggering actions,\
    \ it's inefficient for handling lists, tables, or trees of data. Directly exposing\
    \ a `QList` or `QVector` from C++ doesn't integrate well with QML's view elements\
    \ (`ListView`, `GridView`, `Repeater`) or provide automatic updates when the C++\
    \ data changes.\n\nThe standard Qt solution is to use the Model/View framework.\
    \ You create a C++ class that inherits from `QAbstractListModel` (for lists) or\
    \ `QAbstractItemModel` (for tables/trees). This model class implements specific\
    \ virtual functions to provide data to QML.\n\nKey concepts for `QAbstractListModel`:\n\
    \n*   Implement `rowCount()`: Returns the number of items.\n*   Implement `data(const\
    \ QModelIndex &index, int role)`: Returns the data for the item at `index.row()`\
    \ for a specific role.\n*   Implement `roleNames()`: Crucial for QML. This function\
    \ returns a map where integer roles (`Qt::DisplayRole`, `Qt::EditRole`, custom\
    \ roles starting from `Qt::UserRole`) are mapped to unique byte array names (e.g.,\
    \ `\"display\"`, `\"name\"`, `\"iconUrl\"`, `\"price\"`). These names become the\
    \ property names accessible via the `model` keyword within the QML delegate (e.g.,\
    \ `model.name`, `model.price`).\n\nYou then expose an instance of your C++ model\
    \ class to QML using `setContextProperty` (e.g., `\"myListModel\"`) and bind a\
    \ QML view to it:\n\n```qml\n// In QML\nListView {\n    anchors.fill: parent\n\
    }\n```"
  raw: 'QML components, defined simply as .qml files, are the cornerstone of building
    scalable, maintainable, and reusable Qt Quick user interfaces. By encapsulating
    structure and logic within a component file and defining a clear public interface
    through custom properties (using property and property alias), signals (signal),
    and methods (function), you can create complex UIs by assembling simpler, well-defined
    building blocks. This approach significantly reduces code duplication, improves
    readability, and makes future modifications much easier.


    ## Exposing Data and Functionality (Properties, Slots, Models)


    * * *


    While QML excels at defining the structure, layout, and visual appearance of a
    modern user interface, most real-world applications require more complex backend
    logic, performance-intensive operations, interaction with operating system features,
    or integration with existing C++ libraries and data structures. Therefore, effectively
    bridging the gap between your declarative QML frontend and your imperative C++
    backend is a crucial skill for Qt Quick development. Qt provides robust mechanisms
    for this integration.


    QML''s strength lies in its declarative nature for UI design, animations, and
    states. C++, on the other hand, excels at computation, system interaction, managing
    complex application logic, and achieving high performance. A typical Qt Quick
    application leverages the strengths of both, using QML for the presentation layer
    and C++ for the business logic and data backend. The key is enabling seamless
    communication between these two worlds. Qt allows C++ objects and their features
    (properties, methods, signals) to be exposed to the QML environment, making them
    directly accessible from QML code and JavaScript expressions.


    Exposing C++ Objects via Context Properties


    One of the most common and straightforward ways to make C++ functionality available
    to QML is by setting context properties. You create an instance of your C++ class
    (which must inherit from QObject) in your C++ application setup (usually main.cpp)
    and register that specific instance with the QML engine''s root context under
    a chosen name. This makes that C++ object instance globally accessible within
    the QML files loaded by that engine.


    Implementation (main.cpp):


    C++


    #include <QGuiApplication>


    #include <QQmlApplicationEngine>


    #include <QQmlContext> // Required for context properties


    #include "backend.h" // Your C++ backend class header


    int  main(int argc, char *argv[]) {


    QGuiApplication app(argc, argv);


    Backend backendLogic; // 1\. Create an instance of your C++ QObject class


    QQmlApplicationEngine engine;


    // 2\. Expose the instance to QML under the name "backend"


    engine.rootContext()->setContextProperty("backend", &backendLogic);


    const QUrl url(QStringLiteral("qrc:/main.qml")); // Path to your main QML file


    QObject::connect(&engine, &QQmlApplicationEngine::objectCreated,


    &app, [url](QObject *obj, const QUrl &objUrl) {


    if (!obj && url == objUrl)


    QCoreApplication::exit(-1);


    }, Qt::QueuedConnection);


    engine.load(url);


    return app.exec();


    }


    Accessing in QML: Now, within any QML file loaded by this engine (like main.qml
    or components it uses), you can directly refer to the C++ object using the name
    "backend":


    QML


    // Inside main.qml or another loaded QML file


    import QtQuick


    Item {


    // Access properties/methods/signals of the C++ object


    Text {


    text: backend.someDataProperty // Access a C++ property


    }


    Button { // Assuming a Button component exists


    text: "Call C++ Function"


    onClicked: backend.doSomethingInCpp("hello from QML") // Call C++ method


    }


    // Connections { target: backend; onDataReady: console.log("C++ Signal!") } //
    Connect to C++ signal


    }


    Making C++ Features Accessible from QML


    For a C++ object exposed as a context property (or via other registration methods)
    to be useful in QML, its class needs to be structured correctly:


    1.  Inherit QObject: The C++ class must inherit from QObject.


    2.  Q_OBJECT Macro: It must include the Q_OBJECT macro in its declaration to enable
    the Meta-Object System.


    With this foundation, specific C++ features become accessible:


    ● Properties (Q_PROPERTY): Properties declared in your C++ class using Q_PROPERTY
    are the primary way to expose data to QML.


    ○ READ: A READ function (getter) makes the property readable from QML (backend.propertyName).


    ○ WRITE: A WRITE function (setter) makes the property modifiable from QML (backend.propertyName
    = newValue).


    ○ NOTIFY: A NOTIFY signal is essential for enabling QML''s property binding. When
    the C++ code changes the property''s value (usually within the setter) and emits
    the associated NOTIFY signal, the QML engine detects this and automatically updates
    any QML properties bound to it.


    C++


    // In Backend.h


    class Backend :  public QObject {


    Q_OBJECT


    // Property: readable, writable (optional), with change notification


    Q_PROPERTY(QString userName READ userName WRITE setUserName NOTIFY userNameChanged)


    public:


    // ... constructor ...


    QString userName() const;


    void  setUserName(const QString &name);


    signals:


    void  userNameChanged(QString userName); // NOTIFY signal


    private:


    QString m_userName;


    };


    // In QML


    Text { text: "User: " + backend.userName } // Binds to userName, updates on userNameChanged


    TextInput { onAccepted: backend.userName = text } // Modifies C++ property


    ● Slots and Invokable Methods (Q_INVOKABLE): Public slots in your C++ class, or
    any public member function explicitly marked with the Q_INVOKABLE macro, can be
    called directly as methods from QML/JavaScript.


    C++


    // In Backend.h


    public slots: // Or use Q_INVOKABLE


    void  processData(int value);


    // In QML


    Button { onClicked: backend.processData(42) }


    ● Signals: Signals defined in your C++ class using the signals: keyword can be
    connected to by QML signal handlers using the onSignalName: syntax or the Connections
    element.


    C++


    // In Backend.h


    signals:


    void  calculationComplete(double result);


    // In C++ (e.g., inside processData)


    // ... perform calculation ...


    // emit calculationComplete(calculatedResult);


    // In QML


    Item {


    // Method 1: Direct connection on context property


    backend.onCalculationComplete: {


    console.log("Calculation result from C++:", result)


    resultDisplayLabel.text = "Result: " + result // Update UI


    }


    // Method 2: Using Connections element (useful if ''backend'' isn''t the root
    id)


    Connections {


    target: backend


    function onCalculationComplete(result) { // Use ''function'' keyword here


    console.log("Alternate connection:", result)


    }


    }


    }


    Exposing List Data via C++ Models


    While exposing simple properties and calling methods works well for individual
    pieces of data or triggering actions, it''s inefficient for handling lists, tables,
    or trees of data. Directly exposing a QList or QVector from C++ doesn''t integrate
    well with QML''s view elements (ListView, GridView, Repeater) or provide automatic
    updates when the C++ data changes.


    The standard Qt solution is to use the Model/View framework. You create a C++
    class that inherits from QAbstractListModel (for lists) or QAbstractItemModel
    (for tables/trees). This model class implements specific virtual functions to
    provide data to QML views.


    Key concepts for QAbstractListModel:


    ●     Implement rowCount(): Returns the number of items.


    ● Implement data(const QModelIndex &index, int role): Returns the data for the
    item at index.row() for a specific role.


    ● Implement roleNames(): Crucial for QML. This function returns a map where integer
    roles (Qt::DisplayRole, Qt::EditRole, custom roles starting from Qt::UserRole)
    are mapped to unique byte array names (e.g., "display", "name", "iconUrl", "price").
    These names become the property names accessible via the model keyword within
    the QML delegate (e.g., model.name, model.price).


    You then expose an instance of your C++ model class to QML using setContextProperty
    (e.g., "myListModel") and bind a QML view to it:


    QML


    // In QML


    ListView {


