  trans: "\n\n虽然 Qt 允许将应用程序编译为原生 Windows 可执行文件（`.exe`），但简单地将此 `.exe` 文件复制到另一台 Windows\
    \ 机器通常无法运行。这是因为可执行文件依赖于多个外部动态链接库（DLL），这些库存在于你的开发机器上，但在标准用户的 PC 上可能不存在。Windows\
    \ 部署过程涉及收集这些依赖并将它们与你的应用程序打包。这确保了截至 2025 年 4 月，法兰克福、柏林或任何地方运行 Windows 的用户都能成功启动并使用你的软件。\n\
    \n# 理解 Windows 依赖项\n\n为 Windows 构建的 Qt 应用具有几种类型的依赖项：\n\n1. **Qt 库 (`Qt6*.dll`)**:\
    \ 你的应用程序链接到使用的特定 Qt 模块（例如，`Qt6Core.dll`、`Qt6Gui.dll`、`Qt6Widgets.dll`、`Qt6Network.dll`）。具体取决于项目配置（`.pro`\
    \ 中的 `QT += ...` 或 CMake 中的 `find_package/target_link_libraries`）。这些核心 Qt DLL\
    \ 必须分发。\n\n2. **Qt 平台插件 (`platforms\\qwindows.dll`)**: 此关键插件允许 Qt 应用程序与 Windows\
    \ 操作系统交互，以创建窗口、处理事件等。它位于相对于可执行文件目录的 `platforms` 子目录中。\n\n3. **其他 Qt 插件**: 根据你使用的\
    \ Qt 功能，可能需要其他插件。它们位于特定的子目录：\n   - 图像格式 (`imageformats\\`，例如 `qjpeg.dll`、`qgif.dll`)\n\
    \   - 数据库驱动程序 (`sqldrivers\\`，例如 `qsqlodbc.dll`、`qsqlite.dll`)\n   - 样式 (`styles\\\
    `，例如 `qwindowsvistastyle.dll` - 现在较少用）\n   - 多媒体后端 (`mediaservice\\`,`audio\\\
    `)\n\n4. **C++ 编译器运行时运行库**: 这是一个由你使用的编译器决定的关键依赖项：\n   - MSVC (Visual Studio):\
    \ 需要与编译时使用的 Visual Studio 版本对应的 Microsoft Visual C++ 可再发行程序 DLL（例如，对于 VS 2015\
    \ 到 2022，常用文件包括 `vcruntime140.dll`、`msvcp140.dll`，以及可能的其他文件如 `concrt140.dll`、`ucrtbase.dll`）。最终用户可能没有安装正确的版本。\n\
    \   - MinGW: 需要 MinGW 特有的运行时 DLL，例如 `libgcc_s_seh-1.dll`（或取决于版本/架构的变体）、`libstdc++-6.dll`、`libwinpthread-1.dll`。这些文件在标准用户的机器上几乎不存在。\n\
    \n5. **SSL 库（用于 HTTPS）**: 如果你的应用程序发起了 HTTPS 网络请求（使用 `QNetworkAccessManager`）且\
    \ Qt 配置为使用 OpenSSL（Windows 上的常见情况），你必须分发正确的 OpenSSL DLL（通常为 `libcrypto-*.dll`\
    \ 和 `libssl-*.dll`，其中 `*`  Qt 预期的版本）。缺失或不兼容的 SSL 库是部署应用无法通过 HTTPS 连接的非常常见原因。\n\
    \n6. **第三方库**: 你的应用程序显式链接的任何其他外部 DLL。\n\n# 使用 windeployqt: Qt 的部署助手\n\n手动查找并复制所有必要的\
    \ Qt DLL 和插件既繁琐又容易出错。坦率地说，Qt 提供了一个专门为此目的的命令行工具：`windeployqt.exe`。该工具位于 Qt 安装目录的\
    \ `bin` 目录下（例如 `C:\\Qt\\6.x.x\\msvc2019_64\\bin`）。\n\n`windeployqt` 分析你的应用程序可执行文件（`.exe`），确定其\
    \ Qt 依赖项，并将所需的 Qt DLL、平台插件、相关的其他插件（如图像格式）、翻译文件（如果请求了 `.qm` 文件）以及某些运行时组件复制到目标目录，并按正确的子目录结构（`platforms`、`imageformats`\
    \ 等）进行排列。\n\n## 如何使用 windeployqt:\n\n1. **以 Release 模式构建**: 始终部署应用程序的 Release\
    \ 版本，而不是 Debug 版本（后者具有不同的、更大的且不适合分发的依赖项）。\n2. **设置环境**: 打开命令提示符或 PowerShell 窗口，其中\
    \ Qt bin 目录和编译器工具链的路径已正确设置在 `PATH` 环境变量中。最简单的方法通常是使用 Qt 维护工具安装的特定命令行快捷方式（例如，“Qt\
    \ 6.x.x (MSVC 2019 64-bit)”）。\n3. **导航到构建目录**: 使用 `cd` 到包含编译后的应用程序可执行文件的目录（例如\
    \ `cd C:\\Users\\YourUser\\MyApp\\build-release`）。\n4. **运行工具**: 执行命令：\n   ```bash\n\
    \   windeployqt .\n   ```\n5. （`.` 表示当前目录，告诉 `windeployqt` 在此处查找可执行文件并在旁边部署依赖项）。或者指定可执行文件：`windeployqt\
    \ myapp.exe`。\n\n   - **常用选项**:\n     - `--qm`: 同时也复制 Qt 翻译路径中找到的所有 `.qm` 翻译文件。\n\
    \     - `-- C:\\Path\\To\\DeployFolder .: 将可执行文件和依赖项复制到指定的输出文件夹，而不是当前目录。\n   \
    \  - `--no-translations`, `--no-plugins`, `--no-opengl-sw`: 如果不需要，排除特定类型依赖项的选项。\n\
    \n## windeployqt 通常不复制的内容:\n\n至关重要的是，`windeployqt` 主要处理 Qt 自己的库和插件。它通常不复制：\n-\
    \ MSVC 运行时库。\n- MinGW 运行时库。\n- OpenSSL (`libcrypto`, `libssl`) DLL 库。\n- 应用程序使用的任何其他第三方库。\n\
    \n# 处理依赖项\n\n运行 `windeployqt` 后，你需要向部署目录添加非 Qt 的依赖项：\n\n### MSVC 运行时\n- 推荐：随应用程序一起捆绑\
    \ Microsoft Visual C++ 可再发行程序安装程序（例如，针对 2015-2022 的 `VC_redist.x64.exe`）并静默运行。这可以确保运行时正确安装并更新。\n\
    - 备选方案：手动从 Visual Studio 安装目录将所需的 `vcruntime*.dll`、`msvcp*.dll` 等文件复制到应用程序文件夹中。检查这些文件的分发许可。\n\
    \n### MinGW 运行时\n在你用于构建应用程序的特定 MinGW 工具链的 `bin` 目录下找到必要的 DLL（`libgcc_*.dll`、`libstdc++*.dll`、`libwinpthread-*.dll`），并将它们直接复制到\
    \ `.exe` 所在的部署文件夹中。\n\n### OpenSSL 库\n如果 HTTPS 需要，获取兼容的 `libcrypto-*.dll` 和 `libssl-*.dll`\
    \ 二进制文件（确保 32/64 位与你的应用程序匹配）。你可能通过 Qt 维护工具安装可选的 OpenSSL 组件包含了它们，或者从可靠的第三方来源下载（检查兼容性和许可）。将这两个\
    \ DLL 直接复制到 `.exe` 所在的应用程序文件夹中。\n\n# 创建安装程序\n\n仅仅向用户提供包含 .exe 和几十个 DLL 的文件夹并不是一种专业且友好的发行方法。你应该使用专用工具将所有内容封装进安装程序。安装程序可以：\n\
    - 引导用户完成设置。\n- 将文件复制到正确的位置（例如 `C:\\Program Files\\YourApp`）。\n- 创建开始菜单和桌面快捷方式。\n\
    - 运行先决条件（如 VC++ 可再发行程序程序）。\n- 通过 Windows“应用和功能”提供卸载。\n\n## Windows 常用安装工具：\n\n\
    - **Inno Setup**: 免费、强大、基于脚本、广泛使用且文档齐全。许多 Qt 项目的理想选择。\n- **NSIS (Nullsoft Scriptable\
    \ Install System)**: 另一个非常流行的免费基于脚本的选项。\n- **商业工具**: InstallShield、Advanced Installer\
    \ 提供更多功能和图形界面，但需要付费。\n\n"
- fmt: "\n- **Qt Installer Framework**: `Qt`'s own tool, powerful for creating online/offline\
    \ installers and managing components/updates, but can have a steeper learning\
    \ curve for deploying simple applications compared to `Inno Setup` or `NSIS`.\n\
    \nYou configure these tools (usually via a script file) to include all files gathered\
    \ by `windeployqt` plus the manually added runtimes/DLLs and any other application\
    \ data files, define shortcut locations, specify license agreements, etc., ultimately\
    \ producing a single `setup.exe` file.\n\n### Final Step: Test on a Clean Windows\
    \ Machine!\n\nThis is the most critical validation step. After creating your deployment\
    \ folder or, ideally, your final installer, test it on a clean Windows installation\
    \ (use a virtual machine or a separate PC) that does not have `Qt` or your development\
    \ tools installed. Run the installer and launch the application. Does it start?\
    \ Do all features work (especially networking if using `HTTPS`)? This test simulates\
    \ a real user's environment and is the only way to be certain you've included\
    \ all necessary dependencies.\n\nDeploying `Qt` applications on Windows involves\
    \ more than just copying the executable. You must identify and bundle dependencies,\
    \ including `Qt` libraries and plugins (using `windeployqt` simplifies this greatly),\
    \ the correct C++ compiler runtime, potentially `SSL` libraries, and any third-party\
    \ DLLs. Packaging these components into a user-friendly installer using tools\
    \ like `Inno Setup` or `NSIS` provides a professional distribution method. Rigorous\
    \ testing on a clean Windows system is essential to ensure your application runs\
    \ correctly for end-users.\n\n## Deploying Applications on macOS (`macdeployqt`,\
    \ App Bundles)\n\n`Qt`'s cross-platform nature extends strongly to macOS and Linux,\
    \ but the methods for packaging and distributing applications differ significantly\
    \ from Windows and from each other.\n\n### macOS Deployment: Application Bundles\
    \ and macdeployqt\n\nOn macOS, applications are typically distributed as Application\
    \ Bundles. To the user, this looks like a single file with an `.app` extension\
    \ (e.g., `MyApp.app`), but it's actually a specially structured directory containing\
    \ the executable and all its necessary resources and libraries.\n\n- **Bundle\
    \ Structure**: Key contents inside `YourApp.app/Contents/`:\n    - `MacOS/`: Contains\
    \ the actual executable file.\n    - `Frameworks/`: Holds required dynamic libraries\
    \ and `Qt` frameworks (`Qt*.framework`).\n    - `Resources/`: Contains application\
    \ data files, icons (`Info.plist` references the icon file here), translation\
    \ files.\n    - `Plugins/`: Holds `Qt` plugins (platform plugin `platforms/libqcocoa.dylib`,\
    \ image formats, etc.).\n    - `Info.plist`: An XML file containing metadata about\
    \ the application (identifier, version, executable name, icon file, etc.).\n\n\
    - **macdeployqt Tool**: `Qt` provides the `macdeployqt` command-line tool (in\
    \ `Qt`'s `bin` directory) specifically for populating this bundle structure correctly.\
    \ Its main tasks are:\n    - Copying the application executable into `Contents/MacOS/`.\n\
    \    - Copying the necessary `Qt` `.framework` bundles into `Contents/Frameworks/`.\n\
    \    - Copying required `Qt` plugins into `Contents/Plugins/`.\n    - Crucially:\
    \ Analyzing dependencies and using the macOS `install_name_tool` utility to modify\
    \ internal paths within the executable and frameworks. This ensures they look\
    \ for dependencies within the `.app` bundle itself, making the bundle self-contained\
    \ and relocatable.\n\n- **Usage**:\n    - Build your application in Release mode\
    \ using `Qt Creator` or `CMake`. This typically generates the basic `YourApp.app`\
    \ structure in the build directory.\n    - Open the `Terminal` application. Make\
    \ sure the environment is configured to find your `Qt` installation's `bin` directory.\n\
    \    - Run the tool, pointing it at your application bundle:\n      ```bash\n\
    \      macdeployqt YourApp.app\n      ```\n    - **Common Options**:\n       \
    \ - `-dmg`: Automatically creates a `.dmg` (Disk Image) file, a common distribution\
    \ format for macOS applications, containing your bundle.\n        - `-codesign=\"\
    Your Developer ID Application: Common Name (ID)\"`: Signs the application bundle\
    \ and its contents using the specified Apple Developer ID certificate. This is\
    \ essential.\n        - `-notarize=\"--apple-id user@example.com --team-id YOURTEAMID\
    \ --password app-specific-pw\"` (Simplified example, exact options evolve): Submits\
    \ the signed app to Apple for notarization, another security requirement for distribution.\n\
    \        - `-verbose=2`: Increases output detail for troubleshooting.\n\n- **Dependency\
    \ Handling**: `macdeployqt` handles `Qt` frameworks and plugins effectively. However,\
    \ like `windeployqt`, it does not automatically bundle non-Qt dynamic libraries\
    \ (`.dylib`). If your application uses third-party libraries, you must manually\
    \ copy them into the `Contents/Frameworks/` directory and use `install_name_tool`\
    \ yourself to fix the paths in your executable and potentially within the libraries\
    \ themselves – a more complex process. The C++ runtime is typically part of `macOS/Xcode`,\
    \ and `SSL/TLS` is usually handled via the native `Secure Transport` framework,\
    \ so manually bundling `OpenSSL` is less common than on Windows/Linux unless specifically\
    \ required.\n\n- **Code Signing and Notarization (Mandatory)**: Due to macOS's\
    \ security measures (Gatekeeper), distributing applications typically requires\
    \ them to be code-signed with a valid Apple Developer ID certificate obtained\
    \ from Apple (requires enrollment in the Apple Developer Program). Furthermore,\
    \ Apple now generally requires applications distributed outside the App Store\
    \ to be notarized – a process where you upload your signed application to Apple\
    \ for automated security scanning. Only signed and notarized applications will\
    \ run without prohibitive security warnings on end-user Macs. `macdeployqt` offers\
    \ options to assist with signing and notarization, but managing certificates and\
    \ interacting with Apple's tools (`codesign`, `altool`, `notarytool`) is a necessary\
    \ part of the macOS deployment workflow.\n\n- **Disk Images (.dmg)**: The standard\
    \ way to distribute a macOS application is via a `.dmg` file. The `macdeployqt\
    \ -dmg` option creates a basic one. Often, developers customize these images (using\
    \ `Disk Utility` or other tools) to include a background image showing the application\
    \ icon and a shortcut to the `/Applications` folder, guiding users to drag-and-drop\
    \ the `.app` bundle to install it.\n\n### Linux Deployment: Handling Diversity\n\
    \nDeploying applications on Linux presents a different set of challenges, primarily\
    \ due to the vast number of distributions (Ubuntu, Fedora, Debian, Arch, openSUSE,\
    \ etc., many popular across Europe including Germany) and variations in installed\
    \ library versions (especially core libraries like `GLIBC`, `libstdc++`, graphics\
    \ drivers, desktop environment components). Simply copying the executable and\
    \ `Qt`'s shared object (`.so`) files often fails on different distributions or\
    \ even different versions of the same distribution.\n\nSeveral strategies exist:\n\
    \n1. **Native System Packages (.deb, .rpm)**:\n    - **Concept**: Create packages\
    \ tailored for specific distribution families (e.g., `.deb` for Debian/Ubuntu/Mint,\
    \ `.rpm` for Fedora/CentOS/RHEL/openSUSE).\n    - **Pros**: Provides the best\
    \ user experience and system integration. Dependencies on system libraries (like\
    \ `libc`, `libstdc++`, specific versions of other libraries) are declared in the\
    \ package metadata, and the system's package manager (`apt`, `dnf`, `yum`, `zypper`)\
    \ handles installing them automatically. Updates can also be managed via the package\
    \ manager.\n    - **Cons**: Requires significant effort to create, test, and maintain\
    \ separate packages for each target distribution and version. Requires learning\
    \ distribution-specific packaging tools and policies. Often impractical for distributing\
    \ to a wide, unknown range of Linux users.\n\n2. **Manual Bundling + Wrapper Script\
    \ (Generally Unreliable)**:\n"
  raw: '● Qt Installer Framework: Qt''s own tool, powerful for creating online/offline
    installers and managing components/updates, but can have a steeper learning curve
    for deploying simple applications compared to Inno Setup or NSIS.


    You configure these tools (usually via a script file) to include all files gathered
    by windeployqt plus the manually added runtimes/DLLs and any other application
    data files, define shortcut locations, specify license agreements, etc., ultimately
    producing a single setup.exe file.


    Final Step: Test on a Clean Windows Machine!


    This is the most critical validation step. After creating your deployment folder
    or, ideally, your final installer, test it on a clean Windows installation (use
    a virtual machine or a separate PC) that does not have Qt or your development
    tools installed. Run the installer and launch the application. Does it start?
    Do all features work (especially networking if using HTTPS)? This test simulates
    a real user''s environment and is the only way to be certain you''ve included
    all necessary dependencies.


    Deploying Qt applications on Windows involves more than just copying the executable.
    You must identify and bundle dependencies, including Qt libraries and plugins
    (using windeployqt simplifies this greatly), the correct C++ compiler runtime,
    potentially SSL libraries, and any third-party DLLs. Packaging these components
    into a user-friendly installer using tools like Inno Setup or NSIS provides a
    professional distribution method. Rigorous testing on a clean Windows system is
    essential to ensure your application runs correctly for end-users.


    ## Deploying Applications on macOS (`macdeployqt`, App Bundles)


    * * *


    Qt''s cross-platform nature extends strongly to macOS and Linux, but the methods
    for packaging and distributing applications differ significantly from Windows
    and from each other.


    macOS Deployment: Application Bundles and macdeployqt


    On macOS, applications are typically distributed as Application Bundles. To the
    user, this looks like a single file with an .app extension (e.g., MyApp.app),
    but it''s actually a specially structured directory containing the executable
    and all its necessary resources and libraries.


    ●     Bundle Structure: Key contents inside YourApp.app/Contents/:


    ○     MacOS/: Contains the actual executable file.


    ○     Frameworks/: Holds required dynamic libraries and Qt frameworks (Qt*.framework).


    ○ Resources/: Contains application data files, icons (Info.plist references the
    icon file here), translation files.


    ○ Plugins/: Holds Qt plugins (platform plugin platforms/libqcocoa.dylib, image
    formats, etc.).


    ○ Info.plist: An XML file containing metadata about the application (identifier,
    version, executable name, icon file, etc.).


    ● macdeployqt Tool: Qt provides the macdeployqt command-line tool (in Qt''s bin
    directory) specifically for populating this bundle structure correctly. Its main
    tasks are:


    ○     Copying the application executable into Contents/MacOS/.


    ○     Copying the necessary Qt .framework bundles into Contents/Frameworks/.


    ○     Copying required Qt plugins into Contents/Plugins/.


    ○ Crucially: Analyzing dependencies and using the macOS install_name_tool utility
    to modify internal paths within the executable and frameworks. This ensures they
    look for dependencies within the .app bundle itself, making the bundle self-contained
    and relocatable.


    ●     Usage:


    ○ Build your application in Release mode using Qt Creator or CMake. This typically
    generates the basic YourApp.app structure in the build directory.


    ○ Open the Terminal application. Make sure the environment is configured to find
    your Qt installation''s bin directory.


    ○     Run the tool, pointing it at your application bundle:


    ○     Bash


    macdeployqt YourApp.app


    ○       


    ○      


    ○     Common Options:


    ■ -dmg: Automatically creates a .dmg (Disk Image) file, a common distribution
    format for macOS applications, containing your bundle.


    ■ -codesign="Your Developer ID Application: Common Name (ID)": Signs the application
    bundle and its contents using the specified Apple Developer ID certificate. This
    is essential.


    ■ -notarize="--apple-id user@example.com --team-id YOURTEAMID --password app-specific-pw"
    (Simplified example, exact options evolve): Submits the signed app to Apple for
    notarization, another security requirement for distribution.


    ■     -verbose=2: Increases output detail for troubleshooting.


    ● Dependency Handling: macdeployqt handles Qt frameworks and plugins effectively.
    However, like windeployqt, it does not automatically bundle non-Qt dynamic libraries
    (.dylib). If your application uses third-party libraries, you must manually copy
    them into the Contents/Frameworks/ directory and use install_name_tool yourself
    to fix the paths in your executable and potentially within the libraries themselves
    – a more complex process. The C++ runtime is typically part of macOS/Xcode, and
    SSL/TLS is usually handled via the native Secure Transport framework, so manually
    bundling OpenSSL is less common than on Windows/Linux unless specifically required.


    ● Code Signing and Notarization (Mandatory): Due to macOS''s security measures
    (Gatekeeper), distributing applications typically requires them to be code-signed
    with a valid Apple Developer ID certificate obtained from Apple (requires enrollment
    in the Apple Developer Program). Furthermore, Apple now generally requires applications
    distributed outside the App Store to be notarized – a process where you upload
    your signed application to Apple for automated security scanning. Only signed
    and notarized applications will run without prohibitive security warnings on end-user
    Macs. macdeployqt offers options to assist with signing and notarization, but
    managing certificates and interacting with Apple''s tools (codesign, altool, notarytool)
    is a necessary part of the macOS deployment workflow.


    ● Disk Images (.dmg): The standard way to distribute a macOS application is via
    a .dmg file. The macdeployqt -dmg option creates a basic one. Often, developers
    customize these images (using Disk Utility or other tools) to include a background
    image showing the application icon and a shortcut to the /Applications folder,
    guiding users to drag-and-drop the .app bundle to install it.


    Linux Deployment: Handling Diversity


    Deploying applications on Linux presents a different set of challenges, primarily
    due to the vast number of distributions (Ubuntu, Fedora, Debian, Arch, openSUSE,
    etc., many popular across Europe including Germany) and variations in installed
    library versions (especially core libraries like GLIBC, libstdc++, graphics drivers,
    desktop environment components). Simply copying the executable and Qt''s shared
    object (.so) files often fails on different distributions or even different versions
    of the same distribution.


    Several strategies exist:


    1.  Native System Packages (.deb, .rpm):


    ○ Concept: Create packages tailored for specific distribution families (e.g.,
    .deb for Debian/Ubuntu/Mint, .rpm for Fedora/CentOS/RHEL/openSUSE).


    ○ Pros: Provides the best user experience and system integration. Dependencies
    on system libraries (like libc, libstdc++, specific versions of other libraries)
    are declared in the package metadata, and the system''s package manager (apt,
    dnf, yum, zypper) handles installing them automatically. Updates can also be managed
    via the package manager.


    ○ Cons: Requires significant effort to create, test, and maintain separate packages
    for each target distribution and version. Requires learning distribution-specific
    packaging tools and policies. Often impractical for distributing to a wide, unknown
    range of Linux users.


    2.  Manual Bundling + Wrapper Script (Generally Unreliable):'
