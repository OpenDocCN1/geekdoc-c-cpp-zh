  trans: "\n\n允许用户通过视图修改数据：\n\n- `flags(const QModelIndex &index) const override`:\
    \ 重写此函数以为 `index` 处的项返回相应的 `Qt::ItemFlags`。至少，你需要在返回的 `flags` 中包含 `Qt::ItemIsEditable`（与其他标志如\
    \ `Qt::ItemIsSelectable | Qt::ItemIsEnabled` 进行按位“或操作）。\n- `setData(const QModelIndex\
    \ &index, const QVariant &value, int role = Qt::EditRole) override`: 当代理（delegate）完成对项的编辑时，会调用此函数。你将接收到项的\
    \ `index`、新值 `value`（作为 `QVariant` 类型）以及 `role`（通常为 `Qt::EditRole`）。你的实现必须：\n\
    \    1. 验证 `index` 和 `role`。\n    2. 验证传入的 `value`（例如，检查数据类型、范围）。\n    3. 更新你的实际后端数据存储。\n\
    \    4. 如果更新成功，发射 `dataChanged()` 信号（见下文）以通知视图。\n    5. 如果成功则返回 `true`，否则返回 `false`。\n\
    \n## 处理动态数据更改\n\n如果你的后端数据可以独立于 `setData()` 调用发生变化（例如，从网络、后台线程或应用程序的其他部分更新），你的模型必须通知已绑定的视图以便它们进行刷新。这是通过在数据修改操作周边的发射继承自\
    \ `QAbstractItemModel` 的信号来实现的：\n\n- **插入行**：在向你的后端结构插入数据之前，调用 `beginInsertRows(parentIndex,\
    \ firstRow, lastRow)`。插入后，调用 `endInsertRows()`。\n- **删除行**：在删除数据之前，调用 `beginRemoveRows(parentIndex,\
    \ firstRow, lastRow)`。删除后，调用 `endRemoveRows()`。\n- （对于列也存在相似的函数：`beginInsertColumns`、`endInsertColumns`\
    \ 等）\n- **更新现有数据**：在修改了一个或多个项的数据后，发射 `dataChanged(topLeftIndex, bottomRightIndex,\
    \ QVector<int> roles = {})`。这会告诉视图哪个矩形区域的项（从 `topLeftIndex` 到 `bottomRightIndex`）以及哪些特定的数据角色（如果向量为空，则为所有角色）可能发生了更改，并需要重新查询和重绘。\n\
    - **重置模型**：对于细粒度信号过于复杂的剧烈变化（例如，完全全新的数据集、主要的排序/过滤），在更改之前调用 `beginResetModel()`，修改数据，然后调用\
    \ `endResetModel()`。视图将丢弃所有缓存信息并重新请求所有内容。请谨慎使用，因为对于大型视图来说这是低效的。\n\n## QML 集成：roleNames()\n\
    \n如前所述，对于用于 QML 视图（`ListView`、`TableView`、`Repeater`）的自定义模型，必须重实现 `roleNames()`：\n\
    \n```cpp\n// 在 MyCustomModel.h\nQHash<int, QByteArray> roleNames() const override;\n\
    \n// 在 MyCustomModel.cpp\nQHash<int, QByteArray> MyCustomModel::roleNames() const\
    \ {\nQHash<int, QByteArray> roles;\nroles[Qt::DisplayRole] = \"display\"; // 标准角色映射\n\
    roles[Qt::DecorationRole] = \"decoration\";\nroles[MyCustomRole1] = \"roleNameForQml1\"\
    ; // 自定义角色映射\nroles[MyCustomRole2] = \"roleNameForQml2\";\nreturn roles;\n}\n\
    ```\n\n这种映射允许你的 QML 代理使用方便的属性名访问特定角色的数据：`model.display`、`model.decoration`、`model.roleNameForQml1`\
    \ 等。\n\n## 复杂性与考虑\n\n开发自定义模型，特别是针对复杂的树结构或可编辑数据，需要仔细的实现。关键考虑因素包括：\n\n- **正确的 QModelIndex\
    \ 管理**：确保 `index()`、`parent()` 和 `createIndex()` 与你的内部数据表示正常工作至关重要，且这通常是最棘手的部分。\n\
    - **性能**：`data()` 函数可能会被频繁调用；确保它能高效地访问你的后端数据。\n- **信号发射**：正确发射 `dataChanged`、`rowsInserted`\
    \ 等对于保持视图同步至关重要。忘记发射信号是常见的 Bug 来源。\n- **线程安全**：如果你的后端数据可以从其他线程修改，你的模型实现（特别是 `data()`\
    \ 和信号发射）必须是线程安全的，通常需要互斥锁或其他同步机制。\n\n虽然 Qt 的标准模型涵盖了许多常见情况，但通过子类化 `QAbstractItemModel`、`QAbstractListModel`\
    \ 或 `QAbstractTableModel` 来实现自定义模型，为与 QtWidgets 和 QML 中强大的视图类集成复杂、动态或非标准数据源提供了终极灵活性。这需要对核心虚函数进行仔细实现，包括结构定义（`rowCount`、`columnCount`）、数据检索（`data`）、索引创建（`index`、`parent`）、编辑（`setData`、`flags`）、动态更新（信号发射）以及\
    \ QML 集成（`roleNames`）。尽管比使用标准模型复杂，但对于构建针对特定后端的可扩展、高性能数据驱动应用程序至关重要，这在法兰克福等地的复杂软件开发中是常见需求。\n\
    \n# 第 9 章：\n\n# 网络、数据存储与文件\n\n### 使用 QNetworkAccessManager 进行 HTTP 请求\n\n在当今互联通的世界（截至\
    \ 2025 年 4 月），应用程序很少孤立运行。它们经常需要通过网络（主要是互联网）通信以下载更新、获取动态内容、与 RESTful Web API 交互或与服务器同步数据。无论你是在访问金融市场数据\
    \ API（在法兰克福这样的枢纽城市很常见）、拉取天气信息、加载用户配置文件还是与自己的自定义后端交互，HTTP 及其安全版本 HTTPS 都是主流协议。Qt\
    \ 通过其网络模块为网络通信提供了强健的支持，围绕 `QNetworkAccessManager` 类展开。\n\n#### 设置\n\n首先，确保你的项目包含了网络模块。\n\
    \n- 在 `.pro` 文件中：`QT += network`\n- 在 `CMakeLists.txt` 中：\n```cmake\nfind_package(Qt6\
    \ REQUIRED COMPONENTS Network Gui)\ntarget_link_libraries(YourTarget PRIVATE Qt6::Core\
    \ Qt6::Gui Qt6::Network)\n```\n\n#### 网络操作的异步性\n\n网络请求完成可能需要不可预测的时间。同步执行网络操作（等待响应）将阻塞你的应用程序的主线程，导致用户界面冻结。\n\
    \n`QNetworkAccessManager` 设计为异步工作。当你启动网络请求时，`QNetworkAccessManager` 会返回控制权，并在后台执行网络操作。它通过信号通知你完成情况。\n\
    \n#### 标准工作流\n\n与 `QNetworkAccessManager` 交互遵循一致的模式：\n\n1. **创建管理器**：实例化 `QNetworkAccessManager`。通常为你的应用程序或主要组件创建一个长期实例。它通常是主窗口或专用网络类的成员。记得给它指定父对象\
    \ `QObject` 以进行正确的内存管理。\n```cpp\n#include <QNetworkAccessManager>\n// 在类构造函数或初始化中：\n\
    networkManager_ = new QNetworkAccessManager(this);\n```\n\n2. **准备请求**：创建一个 `QNetworkRequest`\
    \ 对象。使用 `setUrl()` 设置目标 URL。还可以使用 `setHeader()` 设置各种请求头（如 `User-Agent`、`Authorization`\
    \ 或 POST/PUT 的 `Content-Type`）。\n```cpp\n#include <QNetworkRequest>\n#include\
    \ <QUrl>\n\nQNetworkRequest request(QUrl(\"https://api.example.com/data\"));\n\
    request.setHeader(QNetworkRequest::UserAgentHeader, \"MyAwesomeApp/1.0\");\n```\n\
    \n3. **发出请求**：在 `QNetworkAccessManager` 实例上调用相应的方法并传递 `QNetworkRequest`。常用方法包括\
    \ `get()`、`post()`、`put()`、`deleteResource()`。这些方法会立即返回 `QNetworkReply` 对象的指针。\n\
    ```cpp\n#include <QNetworkReply>\n\nQNetworkReply *reply = networkManager_->get(request);\n\
    // 不要在此处阻塞等待！\n```\n\n"
- fmt: "\n## 4. Connect Signals\nConnect slots (or lambdas) to signals emitted by\
    \ the `QNetworkReply` object to handle the outcome. The most important signal\
    \ is `finished()`. Others include `errorOccurred(QNetworkReply::NetworkError)`,\
    \ `downloadProgress(qint64 bytesReceived, qint64 bytesTotal)`, and `uploadProgress(...)`.\n\
    \n```C++\nconnect(reply, &QNetworkReply::finished, this, &MyClass::handleReplyFinished);\n\
    \n// Or using a lambda:\n\n// connect(reply, &QNetworkReply::finished, this, [=]()\
    \ { /* Handle reply here */ });\n```\n\n## 5. Handle Reply (in the finished slot)\n\
    When the `finished()` signal is emitted, your connected slot executes. Inside\
    \ this slot:\n\n- **Check for Errors**: Always check `reply->error()` first. If\
    \ it's not `QNetworkReply::NoError`, handle the error (e.g., display a message,\
    \ log `reply->errorString()`). You can also check the HTTP status code: `reply->attribute(QNetworkRequest::HttpStatusCodeAttribute).toInt()`.\n\
    - **Read Data**: If there was no error, read the response body using `QByteArray\
    \ responseData = reply->readAll();`.\n- **Process Data**: Parse or use the `responseData`\
    \ (e.g., parse JSON, display image, save to file).\n- **Clean Up**: Crucially,\
    \ schedule the `QNetworkReply` object for deletion using `reply->deleteLater();`.\
    \ This ensures the object is deleted safely after the current event loop cycle\
    \ finishes. Failing to do this will cause memory leaks.\n\n## Making GET Requests\
    \ (Fetching Data)\nGET requests are used to retrieve data from a specified URL.\n\
    \n```C++\n// In a function that initiates the request\n\nvoid MyClass::fetchData()\
    \ {\n    QUrl url(\"https://jsonplaceholder.typicode.com/posts/1\"); // Example\
    \ public API\n\n    QNetworkRequest request(url);\n    QNetworkReply *reply =\
    \ networkManager_->get(request);\n\n    // Connect finished signal to a lambda\
    \ for conciseness here\n    connect(reply, &QNetworkReply::finished, this, [=]()\
    \ {\n        // This lambda executes when the reply is finished\n        if (reply->error()\
    \ == QNetworkReply::NoError) {\n            QByteArray responseData = reply->readAll();\n\
    \            qDebug() << \"GET Response:\" << responseData;\n            // TODO:\
    \ Process the data (e.g., parse JSON)\n        } else {\n            qDebug()\
    \ << \"GET Error:\" << reply->errorString();\n            qDebug() << \"HTTP Status\
    \ Code:\" << reply->attribute(QNetworkRequest::HttpStatusCodeAttribute).toInt();\n\
    \        }\n        // IMPORTANT: Schedule reply for deletion\n        reply->deleteLater();\n\
    \    });\n}\n```\n\n## Making POST Requests (Sending Data)\nPOST requests are\
    \ typically used to submit data to a server (e.g., creating a new resource, submitting\
    \ form data).\n\n```C++\n// In a function that initiates the request\n\nvoid MyClass::submitData(const\
    \ QJsonObject &jsonData) { // Assume jsonData is prepared\n    QUrl url(\"https://jsonplaceholder.typicode.com/posts\"\
    ); // Example public API for POST\n\n    QNetworkRequest request(url);\n    //\
    \ Set appropriate header for JSON data\n    request.setHeader(QNetworkRequest::ContentTypeHeader,\
    \ \"application/json\");\n\n    // Convert JSON object to QByteArray\n    QByteArray\
    \ postData = QJsonDocument(jsonData).toJson();\n    QNetworkReply *reply = networkManager_->post(request,\
    \ postData);\n\n    connect(reply, &QNetworkReply::finished, this, [=]() {\n \
    \       if (reply->error() == QNetworkReply::NoError) {\n            // Read the\
    \ server's response to the POST\n            QByteArray responseData = reply->readAll();\n\
    \            qDebug() << \"POST Response:\" << responseData;\n            // Often\
    \ includes the ID of the created resource, etc.\n        } else {\n          \
    \  qDebug() << \"POST Error:\" << reply->errorString();\n            qDebug()\
    \ << \"HTTP Status Code:\" << reply->attribute(QNetworkRequest::HttpStatusCodeAttribute).toInt();\n\
    \        }\n        reply->deleteLater();\n    });\n}\n```\n\nSimilar patterns\
    \ apply for `put()` (updating data) and `deleteResource()` (deleting data).\n\n\
    ## Handling Errors and HTTPS\nAlways check `reply->error()` in your finished handler.\
    \ Distinguish between network-level errors (`reply->error() != NoError`) and application-level\
    \ errors indicated by HTTP status codes (4xx for client errors, 5xx for server\
    \ errors).\n\nFor HTTPS URLs, Qt needs access to SSL/TLS libraries. On macOS and\
    \ recent Windows, it often uses the native OS capabilities (Secure Transport/Schannel).\
    \ On Linux and older Windows, or when building Qt statically, you typically need\
    \ to ensure compatible OpenSSL libraries are available at runtime. Deploying the\
    \ correct OpenSSL libraries (`libssl`, `libcrypto`) alongside your application\
    \ is a common requirement and sometimes a source of deployment issues if missed.\n\
    \n## Processing Response Data\nThe `reply->readAll()` method returns a `QByteArray`.\
    \ You'll often need to process this:\n\n- **JSON**: Use `QJsonDocument::fromJson(responseData)`\
    \ to parse, then `QJsonObject` or `QJsonArray` to navigate the data (covered in\
    \ more detail later).\n- **Images**: Create `QPixmap` or `QImage` directly from\
    \ the `QByteArray`.\n- **Plain Text/HTML**: Convert to `QString` (`QString::fromUtf8(responseData)`\
    \ assuming UTF-8 encoding).\n\n## Threading Notes\nSince `QNetworkAccessManager`\
    \ operates asynchronously using the event loop, it doesn't block the thread it\
    \ was created in (usually the main/GUI thread). The `QNetworkReply` signals (like\
    \ `finished`) are typically emitted in the context of that same thread's event\
    \ loop. This means slots connected directly (using `AutoConnection` or `DirectConnection`)\
    \ can safely update UI elements, as they execute within the GUI thread.\n\n`QNetworkAccessManager`\
    \ provides a powerful, asynchronous, signal-slot based API for handling network\
    \ communication, primarily HTTP and HTTPS, within Qt applications. By following\
    \ the standard workflow – creating a manager, preparing a request, issuing the\
    \ request (get, post, etc.), connecting to the `QNetworkReply::finished` signal,\
    \ and handling the response (including error checking and crucial `deleteLater()`\
    \ cleanup) – you can effectively integrate your application with web services\
    \ and APIs without blocking the user interface. Proper error handling and understanding\
    \ the requirements for HTTPS are essential for robust network communication in\
    \ modern, connected applications.\n\n## Persistent Data: Saving Settings with\
    \ `QSettings`\n\nOkay, once your application closes, any data held only in memory\
    \ is lost. To make applications truly useful, they need to remember information\
    \ between sessions – user preferences, window configurations, document data, and\
    \ more. Qt provides convenient mechanisms for this type of persistent storage,\
    \ primarily through `QSettings` for application settings and `QFile`/`QDir` for\
    \ more general file operations.\n\nApplications need ways to store data so it's\
    \ available the next time they run. This could range from remembering the window's\
    \ last size and position to saving complex user-created documents. Qt offers different\
    \ approaches depending on the type and structure of the data you need to persist.\n\
    \n### QSettings: Platform-Independent Application Settings\nFor storing typical\
    \ application settings – user preferences, UI state, recent file lists, configuration\
    \ options – `QSettings` is the ideal Qt solution. Its key strength lies in providing\
    \ a platform-independent API while using the native storage mechanism appropriate\
    \ for the operating system:\n\n- **Windows**: Typically uses the Windows Registry.\n\
    - **macOS**: Uses Core Foundation Preferences API (usually stored in .plist files).\n\
    - **Linux/Unix**: Uses text-based configuration files (often INI format) stored\
    \ in standard locations like `~/.config/YourOrg/YourApp.conf` or `~/.local/share/YourOrg/YourApp.conf`.\n\
    \nThis ensures your application behaves like a good citizen on each platform,\
    \ storing settings where users and system administrators expect to find them,\
    \ whether deployed locally here in Frankfurt or distributed globally.\n\n### Using\
    \ QSettings:\n1. **Initialization**: Create a `QSettings` object. It's highly\
    \ recommended to set your organization and application names first, either globally\
    \ on the `QApplication` object or directly in the `QSettings` constructor. These\
    \ names determine the storage path/key.\n\n```C++\n#include <QSettings>\n#include\
    \ <QCoreApplication> // Or QApplication\n#include <QPoint>\n#include <QSize>\n\
    \n// Method 1: Set globally (often in main.cpp)\n// QCoreApplication::setOrganizationName(\"\
    MyCompanyName\");\n```\n"
