    \n### 理解和处理 Qt 应用程序中的事件\n\n虽然信号和槽提供了一种基于状态变化或特定发生的对象之间的高级通信机制，但 Qt 应用程序本质上是由事件驱动的。事件代表了关于已发生情况的底层通知，例如用户按下按键、移动鼠标、窗口缩放或系统请求重绘。理解\
