- fmt: "\nQt's `QtWidgets` module provides a rich toolkit of essential controls for\
    \ building interactive desktop applications. From simple `QPushButton`s and `QLabel`s\
    \ to complex `QTextEdit`s and data-driven `Item Views`, these widgets serve as\
    \ the building blocks users see and interact with. By placing these widgets into\
    \ the appropriate layout managers (`QHBoxLayout`, `QVBoxLayout`, `QGridLayout`,\
    \ `QFormLayout`), you can construct interfaces that are both functional and visually\
    \ appealing, adapting gracefully to different user environments. This section\
    \ covered many core widgets, but Qt offers even more specialized controls, which\
    \ you can explore through the documentation or visually using the integrated `Qt\
    \ Designer` tool.\n\n## Main Windows, Dialogs, Menus, and Toolbars\n\nIndividual\
    \ widgets and layouts need a container to live in. In a typical desktop application,\
    \ this primary container is the main window, often supplemented by dialog boxes\
    \ for specific interactions or messages. Qt provides dedicated classes for these\
    \ common top-level elements.\n\n### QMainWindow: The Application's Hub\n\nFor\
    \ the primary window of most standard desktop applications, `QMainWindow` is the\
    \ class of choice. It's more than just a blank window; it comes with a predefined\
    \ structure and built-in support for common application \"furniture\":\n\n- **Menu\
    \ Bar**: A horizontal bar at the top (or integrated with the system bar, e.g.,\
    \ on macOS) holding application menus (File, Edit, Help, etc.). You access it\
    \ via the `menuBar()` function.\n- **Toolbars**: One or more areas (typically\
    \ at the top, below the menu bar, but can also be docked at sides or bottom) containing\
    \ buttons (`QToolButton`) or other controls for quick access to common actions.\
    \ Toolbars can often be moved or even floated as separate windows by the user.\
    \ You add them using `addToolBar()`.\n- **Dock Widgets**: Independent sub-windows\
    \ (`QDockWidget`) that can be docked into specific areas around the central content\
    \ or floated as separate windows. Ideal for things like tool palettes, file explorers,\
    \ or property inspectors. Added via `addDockWidget()`.\n- **Central Widget**:\
    \ This is the main content area of your application. A `QMainWindow` can have\
    \ only one central widget, set using `setCentralWidget()`. This widget typically\
    \ occupies the largest area of the window. Usually, you create a generic `QWidget`\
    \ (or a custom subclass), apply your primary layout manager (like `QVBoxLayout`\
    \ or `QGridLayout`) to this central widget, and populate that layout with your\
    \ main application controls (text editors, graphics views, etc.).\n- **Status\
    \ Bar**: A bar along the bottom edge used to display status messages, progress\
    \ indicators, or other transient information. Accessed via `statusBar()`.\n\n\
    To create a main application window, you typically subclass `QMainWindow`, set\
    \ up these elements in its constructor or a dedicated setup function, create and\
    \ configure the central widget, and then set the central widget.\n\n### QAction:\
    \ Defining Reusable Commands\n\nBefore creating menus and toolbars, it's essential\
    \ to understand `QAction`. A `QAction` represents a single, abstract user action\
    \ like \"Open File,\" \"Save,\" \"Copy,\" or \"Exit.\" It's not a widget itself\
    \ but holds information about the action:\n\n- **Text** (e.g., \"Open...\", \"\
    &Save\" - & defines a keyboard accelerator)\n- **Icon** (`setIcon()`)\n- **Tooltip**\
    \ (`setToolTip()`)\n- **Status tip** (shown in the status bar - `setStatusTip()`)\n\
    - **Shortcut key** (`setShortcut()`)\n- **Checkable state** (`setCheckable()`)\n\
    - **Enabled/disabled state** (`setEnabled()`)\n\nThe key benefit is reusability.\
    \ You can create a single `QAction` for \"Save\" and add it to both the File menu\
    \ and a toolbar. When you disable the `QAction`, it automatically appears disabled\
    \ in both places. You connect the action's `triggered()` signal (emitted when\
    \ the action is activated via menu, toolbar, or shortcut) to a slot that performs\
    \ the actual work. This centralizes action handling. `QActions` are typically\
    \ created as member variables of the `QMainWindow` subclass.\n\n```cpp\n// In\
    \ MyMainWindow.h (or .cpp)\n\n#include <QAction>\n#include <QKeySequence> // For\
    \ shortcuts\n#include <QIcon> // For icons\n\n// ... inside class declaration\
    \ or constructor ...\n\nsaveAction = new QAction(QIcon::fromTheme(\"document-save\"\
    ), tr(\"&Save\"), this); // Icon, Text, Parent\n\nsaveAction->setShortcut(QKeySequence::Save);\
    \ // Standard shortcut (e.g., Ctrl+S)\n\nsaveAction->setStatusTip(tr(\"Save the\
    \ current document\"));\n\nconnect(saveAction, &QAction::triggered, this, &MyMainWindow::saveDocument);\
    \ // Connect signal to slot\n```\n\n### Creating Menus and Toolbars\n\nWith `QActions`\
    \ defined, populating menus and toolbars is straightforward within your `QMainWindow`\
    \ subclass:\n\n- **Menus**:\n  1. Get the menu bar: `QMenuBar *mainMenuBar = menuBar();`\n\
    \  2. Add top-level menus: `QMenu *fileMenu = mainMenuBar->addMenu(tr(\"&File\"\
    ));`\n  3. Add actions to a menu: `fileMenu->addAction(saveAction);`\n  4. Add\
    \ separators: `fileMenu->addSeparator();`\n  5. Create submenus: `QMenu *exportMenu\
    \ = fileMenu->addMenu(tr(\"E&xport\")); exportMenu->addAction(exportPdfAction);`\n\
    \n- **Toolbars**:\n  1. Create and add a toolbar: `QToolBar *fileToolBar = addToolBar(tr(\"\
    File Actions\"));` (Returns the created toolbar). `addToolBar` attaches it to\
    \ the main window.\n  2. Add actions: `fileToolBar->addAction(saveAction);` (Typically\
    \ only the toolbar).\n  3. Add separators: `fileToolBar->addSeparator();`\n  4.\
    \ Add other widgets: `fileToolBar->addWidget(new QComboBox());`\n\n### Dialogs\
    \ (QDialog): Focused Interactions\n\nDialogs are secondary windows used to interact\
    \ with the user in a focused way – prompting for input, presenting choices, or\
    \ displaying messages. They derive from `QDialog`.\n\n- **Modal Dialogs**: Block\
    \ input to all windows in the application until the dialog is closed. Use `exec()`\
    \ to show a modal dialog. The `exec()` call only returns when the dialog is closed,\
    \ returning a result code like `QDialog::Accepted` or `QDialog::Rejected` (often\
    \ triggered by connecting OK/Cancel buttons to the dialog's `accept()` and `reject()`\
    \ slots). Use modal dialogs for critical interactions where the main window shouldn't\
    \ be used until the dialog is complete (e.g., login prompts, confirmation messages).\n\
    - **Modeless Dialogs**: Allow the user to interact with other windows while the\
    \ dialog remains open. Use `show()` (or `open()` for different activation behavior).\
    \ Communication typically happens via signals and slots connected between the\
    \ dialog and the main window. Use modeless dialogs for auxiliary tools like find/replace\
    \ windows or non-critical status displays.\n\n- **Standard Dialogs**: Qt provides\
    \ convenient static functions to invoke common platform-native dialogs. Using\
    \ these ensures your application adheres to the look and feel expected by users\
    \ on Windows, macOS, or Linux (minor stylistic differences are normal, reflecting\
    \ platform conventions, even here in Germany compared to, say, the US).\n\n  1.\
    \ `QMessageBox::information(parent, title, text)` / `question(...)` / `warning(...)`\
    \ / `critical(...)`: Display standard message boxes with different icons and button\
    \ sets.\n  2. `QFileDialog::getOpenFileName(...)` / `getSaveFileName(...)` / `getExistingDirectory(...)`:\
    \ Show dialogs for selecting files or folders.\n  3. `QFontDialog::getFont(...)`:\
    \ Allow the user to select a font.\n  4. `QColorDialog::getColor(...)`: Allow\
    \ the user to select a color.\n\n- **Custom Dialogs**: For specific input needs\
    \ beyond the standard dialogs, you create your own by subclassing `QDialog`.\n\
    \n  1. Design the UI within your custom dialog class, using widgets and layouts\
    \ just like any other `QWidget`.\n  2. Add buttons (typically \"OK\" and \"Cancel\"\
    ).\n  3. Connect the \"OK\" button's `clicked()` signal to the dialog's built-in\
    \ `accept()` slot.\n  4. Connect the \"Cancel\" button's `clicked()` signal to\
    \ the dialog's built-in `reject()` slot.\n  5. Provide public member functions\
    \ to retrieve the data entered by the user after the dialog has been accepted.\n"
