  trans: "\n\n## 视觉提示与反馈\n\n- **交互视觉提示**：使用细微的视觉变化来指示可交互性。为可点击元素实现悬停效果（使用 `QSS` 的\
    \ `:hover` 或 `QML` 状态/过渡）。为按钮显示明显的“按下”状态。明确指示当前哪个部件具有键盘焦点（这通常由样式处理，但可以通过 QSS 中的\
    \ `:focus` 或 QML 中的状态进行自定义）。适时地更改鼠标光标（`QWidget::setCursor`、`QGuiApplication::setOverrideCursor`、`QML\
    \ cursorShape`）——例如：可点击项使用 `Qt::PointingHandCursor`，在处理期间使用 `Qt::WaitCursor`。\n\
    \n- **状态消息**：对于简短的非关键状态更新（例如“文件已保存”、“连接中...”），使用 `QMainWindow` 中的 `QStatusBar`，通过\
    \ `statusBar()->showMessage(\"message\", timeout)` 运行。在 `QML` 中，可以创建自定义的状态区域。\n\
    \n- **显式确认与错误报告**：使用模态对话框，如 `QMessageBox` (`QtWidgets`) 或自定义等效项（`QML Dialog`、弹出窗口）来确认可能具有破坏性的操作（例如“你确定要删除吗？”）、报告重要任务的成功完成或清晰地解释错误。错误消息应该具有信息量，说明出了什么问题，理想情况下应说明用户如何修复，而不是显示晦涩的错误代码。\n\
    \n- **输入验证反馈**：不要等到用户提交表单才告诉他们存在错误。如果输入无效，请即时反馈。使用配合 `QLineEdit` 的 `QValidator`\
    \ 子类，更改输入字段的边框颜色（通过 `QSS` 或状态），在字段旁边显示/隐藏警告图标，或显示带有验证规则的工具提示/标签。\n\n## 原则 3：一致性\
    \ - 可预测性降低认知负载\n\n用户根据模式学习如何与软件交互。一致的应用程序行为是可预测的，使其更容易学习和使用，减少认知负载和错误发生的概率。一致性既适用于你的应用程序内部，也相对于用户熟悉的平台保持一致性。\n\
    \n### 在 Qt 中实现一致性：\n\n- **内部一致性**：在整个应用程序中，相似的功能使用相同的设计模式、交互模型、术语、图标和位置。例如，如果“保存”位于“文件”菜单中，并在一个屏幕上用磁盘图标表示，请在所有地方保持这一约定。创建可重用的自定义组件（第\
    \ 5.1 节、第 7.1 节）是强制内部一致性的主要方法。在 `QtWidgets` 中使用 `QAction` 可以确保命令在菜单和工具栏之间行为一致（第\
    \ 4.3 节）。\n\n- **平台一致性**：虽然 Qt 支持大量的自定义，但请注意目标操作系统（Windows、macOS、德国或其他流行的 Linux\
    \ 变体）的规范。用户期望对话框中按钮顺序（确定/取消的位置不同）、标准键盘快捷键（保存使用 `Ctrl+S`/`Cmd+S`）、常见菜单结构（文件、编辑、视图、帮助）以及标准对话框的外观。使用\
    \ `QMessageBox`、`QFileDialog` 等有助于维护这种特性。`Qt Quick Controls` 提供了样式（Material、Universal、Fusion），可以提供一致的跨平台外观，或尝试模拟特定的平台样式。在独特品牌标识的益处与遵循平台规范带来的可用性提升之间进行权衡。\n\
    \n- **视觉一致性**：在整个应用程序中一致地应用视觉样式（`QSS` 主题、`QML` 样式对象或组件）。定义协调的调色板、排版比例表和图标样式。除非有强烈的功能理由，否则避免对单个部件应用随机、一次性的样式。全应用程序样式表（第\
    \ 5.2 节）是关键。\n\n## 相互关系与无障碍访问\n\n这些原则高度关联。一致的反馈增强了清晰度。清晰的视觉层级提高了可扫描性。遵循这些原则也为无障碍访问奠定了基础。清晰的标签、良好的色彩对比、可预测的键盘导航（布局和\
    \ `QLabel::setBuddy` 辅助）以及清晰的焦点指示受益于所有用户，包括使用辅助技术的用户。虽然完全的无障碍访问需要在这些基础之外投入额外努力，但良好的\
    \ UI/UX 设计是必要的起点。\n\n设计一个“惊艳”的 Qt 应用程序涉及超越表面美学，去拥抱可用性的核心原则。通过关注清晰性（使界面易于理解）、反馈（让用户知晓情况）和一致性（确保行为可预测），你可以创建出不仅功能完备而且直观、高效且易于使用的应用程序。Qt\
    \ 提供了工具 —— 布局管理器、标准控件、动作、样式系统、状态、信号 —— 以在 `QtWidgets` 和 `Qt Quick` 环境中有效实现这些原则。优先考虑这些\
    \ UX 基础对于交付专业、高质量的软件至关重要。\n\n## 自定义 Qt Quick Controls 和使用 Qt Quick Shapes\n\n\
    虽然基础项（`Rectangle`、`Text`）上的基本 `QML` 属性如颜色、半径和字体设置提供了一定程度的视觉自定义，但实现独特的品牌标识或执行复杂的视觉设计通常需要更多控制。当在处理标准\
    \ UI 元素或需要超出简单矩形和位图之外的图形时，这一点尤为真实。Qt Quick 提供了强大的机制，既可以对标准控件进行深度自定义，也可以创建复杂的矢量图形。2025\
    \ 年的用户对视觉精细度有高要求，这些技术有助于满足这些期望。\n\n### 自定义 Qt Quick Controls\n\n`QtQuick.Controls`\
    \ 模块（`import QtQuick.Controls`）提供了 `Button`、`TextField`、`Slider`、`CheckBox` 等基本\
    \ UI 元素。虽然这些控件提供了基本属性，但真正的威力在于它们为自定义而设计的架构。\n\n1. **内置样式**：`Qt Quick Controls`\
    \ 支持多种内置样式（例如 Fusion、Imagine、Material、Universal），定义了它们的默认外观。你可以在全局选择一种样式，通常通过环境变量（`QT_QUICK_CONTROLS_STYLE`）或在\
    \ C++ 中通过设置（`QQuickStyle::setStyle(\"Material\")`）。这些样式提供了不同的审美 —— Fusion 旨在跨平台一致性，Material\
    \ 模仿 Android 设计语言，Universal 类似于 Windows 元素。虽然它们提供了良好的起点并具有适应性，但要与特定的 OS 主题（如 Windows\
    \ 11 或德国流行的 Linux 主题）实现像素级匹配，可能需要进一步的自定义。某些样式还暴露了特定属性以进行微调。\n\n2. **重写控件委托（主要方法）**：自定义控件的最灵活方法是替换其视觉实现部分，这些在文中被称为“委托”（尽管与模型/视图委托不同）。许多控件将关键视觉部分暴露为包含\
    \ Item 的属性：\n    - `background`：绘制控件背景形状和填充的项。\n    - `contentItem`：显示主要内容的项（例如文本和图标）。\n\
    \    - `indicator`：表示检查状态或选择标记的项（用于 `CheckBox`、`RadioButton`、`Switch`）。\n    -\
    \ `handle`：`Slider` 或 `ScrollBar` 等控件的可拖动部分。\n\n3. 你可以将自定义的 `QML Component` 分配给这些属性。`Component`\
    \ 定义了一个作为模板的 `QML` 结构。在自定义组件内部，你可以使用任何 `QML` 项（`Rectangle`、`Image`、`Text`、自定义\
    \ `Shapes` 等）和逻辑创建所需的视觉。至关重要的是，在分配给委托属性的组件内部，可以通过隐式 `control` 关键字访问被样式的控件状态（例如\
    \ `control.text`、`control.checked`、`control.pressed`、`control.hovered`、`control.enabled`）。\n\
    \n4. **示例：自定义按钮**：\n\n```qml\nimport QtQuick\nimport QtQuick.Controls\nimport\
    \ QtQuick.Layouts // 用于 contentItem 布局\n\nButton {\n    id: myCustomButton\n \
    \   text: \"Submit\"\n    width: 120; height: 40\n}\n```\n\n"
- fmt: "\n```cpp\n// Define a custom component for the background\n\nbackground: Component\
    \ {\n  Rectangle {\n    // Access control state for visual feedback\n    color:\
    \ control.pressed ? \"darkseagreen\" : (control.hovered ? \"lightgreen\" : \"\
    mediumseagreen\")\n    border.color: Qt.darker(color, 1.2)\n    border.width:\
    \ 1\n    radius: 8  // Rounded corners\n\n    // Smooth color change (optional)\n\
    \    Behavior  on color { ColorAnimation { duration: 150 } }\n  }\n}\n\n// Define\
    \ a custom component for the content (icon + text)\ncontentItem: Component {\n\
    \  RowLayout { // Use a layout for icon and text\n    anchors.fill: parent\n \
    \   spacing: 5\n    Image {\n      source: \"qrc:/icons/submit_icon.png\"\n  \
    \    Layout.preferredWidth: 16\n      Layout.preferredHeight: 16\n      Layout.alignment:\
    \ Qt.AlignVCenter\n      fillMode: Image.PreserveAspectFit\n    }\n    Text {\n\
    \      text: control.text // Use the Button's text property\n      color: control.pressed\
    \ ? \"white\" : \"black\"\n      font.bold: true\n      Layout.alignment: Qt.AlignVCenter\n\
    \    }\n  }\n}\n```\n\n5. This approach allows you to completely redefine the\
    \ look while reusing the button's underlying logic and signals (`onClicked`).\n\
    \n6. **Full Custom Styles (Advanced):** For large applications requiring a completely\
    \ unique and consistent theme across all controls, you can create a full custom\
    \ style set. This involves either creating `C++` style plugins or defining a specific\
    \ directory structure containing `QML` implementations for each control part,\
    \ which is a significantly more advanced topic.\n\n# Vector Graphics with Qt Quick\
    \ Shapes\n\nWhile `Rectangle` provides basic shapes and `Image` handles bitmaps,\
    \ sometimes you need complex, scalable vector graphics for icons, diagrams, charts,\
    \ or non-rectangular UI elements. The `QtQuick.Shapes` module (`import QtQuick.Shapes`)\
    \ allows you to define and render high-quality, antialiased vector shapes directly\
    \ in `QML`.\n\n## Key Concepts:\n\n- **Shape Item**: The top-level container for\
    \ defining a complex shape made of one or more paths.\n- **ShapePath Item**: Represents\
    \ a single path within the `Shape`. A path can have an outline (`stroke`) and\
    \ a fill. Key properties include `strokeWidth`, `strokeColor`, `fillColor`, `fillGradient`,\
    \ `strokeStyle` (e.g., `Qt.DashLine`), `capStyle`, `joinStyle`.\n- **Path Definition**:\
    \ You define the geometry of a `ShapePath` by nesting specific path element items\
    \ within it, starting from `startX`, `startY` coordinates on the `ShapePath`:\n\
    \    - `PathMove { x: ..., y: ... }`: Moves the current point without drawing.\n\
    \    - `PathLine { x: ..., y: ... }`: Draws a straight line to the point.\n  \
    \  - `PathArc { x: ..., y: ..., radiusX: ..., radiusY: ..., ... }`: Draws an elliptical\
    \ arc.\n    - `PathQuad, PathCubic`: Draw quadratic and cubic Bezier curves.\n\
    \    - `ClosePath {}`: Draws a line back to the start point of the current sub-path.\n\
    - **PathSvg**: Alternatively, and often powerfully, you can define a path using\
    \ standard SVG path data strings within a `PathSvg` element: `PathSvg { path:\
    \ \"M 10 10 L 90 10 L 50 90 Z\" }`. This is ideal for importing complex shapes\
    \ from vector design software like `Inkscape` or `Adobe Illustrator`.\n\n## Example:\
    \ Simple Custom Shape Icon\n\n```qml\nimport QtQuick\nimport QtQuick.Shapes\n\n\
    Shape {\n  id: warningIcon\n  width: 32; height: 32\n  // Antialiasing for smooth\
    \ rendering\n  antialiasing: true  // Property on Shape is convenient shorthand\n\
    \n  // Yellow filled triangle background\n  ShapePath {\n    id: trianglePath\n\
    \    fillColor: \"gold\"\n    strokeColor: \"transparent\"  // No outline for\
    \ the background\n    startX: width / 2; startY: 2  // Start at top-center (adjust\
    \ for stroke)\n    PathLine { x: width - 2; y: height - 2 } // Line to bottom-right\n\
    \    PathLine { x: 2; y: height - 2 } // Line to bottom-left\n    ClosePath {}\
    \ // Close back to top\n  }\n\n  // Black exclamation mark using SVG path data\n\
    \  ShapePath {\n    strokeWidth: 3\n    strokeColor: \"black\"\n    fillColor:\
    \ \"transparent\"  // No fill\n    PathSvg { path: \"M 16 8 L 16 18 M 16 22 L\
    \ 16 24\" }\n  }\n}\n```\n\n## Combining Techniques\n\nThe real power of `Shape`\
    \ item comes from combining these. By mastering these techniques, you can create\
    \ stunning, resolution-independent interfaces.\n\n### Enhancing Visuals: Working\
    \ with QPainter\n\nWhile `Rectangle` provides basic shapes, `QPainter` offers\
    \ much more for custom drawing.\n\n1. **QPainterPath**: For shapes more complex\
    \ than primitives, `QPainterPath` allows you to build arbitrary shapes composed\
    \ of lines, curves (quadratic, cubic), arcs, and sub-paths. You define the path\
    \ once and can then efficiently draw its outline (`strokePath`) or fill it (`fillPath`).\n\
    \n```cpp\n// Inside paintEvent(QPaintEvent*)\nQPainter painter(this);\npainter.setRenderHint(QPainter::Antialiasing);\n\
    QPainterPath path;\npath.moveTo(20, 80); // Start point\npath.cubicTo(40, 10,\
    \ 70, 10, 90, 80); // Draw a Bezier curve\npath.lineTo(60, 60); // Draw a line\n\
    painter.setPen(QPen(Qt::blue, 3));\npainter.setBrush(Qt::cyan);\npainter.drawPath(path);\
    \ // Draw the combined path\n```\n\n2. **Gradients**: Instead of solid color fills\
    \ (`QBrush(color)`), you can use gradients for smoother, more visually appealing\
    \ backgrounds or effects. Qt provides linear (`QLinearGradient`), radial (`QRadialGradient`),\
    \ and conical (`QConicalGradient`) gradients. You define color stops along the\
    \ gradient path/radius and then create a `QBrush` from the gradient object.\n\n\
    ```cpp\n// Inside paintEvent\nQPainter painter(this);\nQRect targetRect = rect().adjusted(5,\
    \ 5, -5, -5); // Example rectangle\nQLinearGradient linearGrad(targetRect.topLeft(),\
    \ targetRect.bottomLeft());\nlinearGrad.setColorAt(0.0, Qt::white); // Start color\n\
    linearGrad.setColorAt(1.0, Qt::lightGray); // End color\npainter.setBrush(linearGrad);\n\
    painter.setPen(Qt::darkGray); // Outline\npainter.drawRoundedRect(targetRect,\
    \ 10, 10); // Draw with gradient fill\n```\n"
