  md: '# Analysis


    You have used Deny this time rather than Revoke. In our very simplified example,
    Deny and Revoke have the same effect—in reality, you may find differences between
    Deny and Revoke.


    # Drop Database


    After our tour of DDL and DCL, it''s time to clean up your server. Try the first
    Database—it will fail, probably. If it does, try the Use with the second Drop
    Database. Finally, try the Drop Login.


    # Syntax


    +   - drop database removes user tables stored proc index

    - primary and foreign keys

    - but not login

    - login (drop or sp_revokelogin ''Domain\User'')


    ```

    drop database MyDatabase


    use master

    drop database MyDatabase


    drop login TestLogin

    ```


    # Result


    Command(s) completed successfully.


    # Analysis


    You can''t drop a database if it''s in context and you have a connection to it.
    The Use statement flips you into the master database, and then you can drop MyDatabase.
    Dropping a database removes the database and any objects it contains (tables,
    views, functions, stored procedures, and users). However, it won''t remove the
    login you created. Users live in databases, but logins are at the server level.
    Why that you needed the final Drop Login.


    Well done, that''s our last query. Please be careful! Your database context may
    now be master. Remember to change back to AdventureWorksDW2008 (AdventureWorksDW
    in SQL Server 2005) before you start experimenting with any more SQL. To change
    the database, issue another Use statement or use the drop-down on the toolbar.'
