    # Analysis


    The result shown is the second query. Dates as criteria can be problematic. Please
    note they are enclosed in single quotes like strings. Also, note the format of
    the date (YYYY-MM-DD, 1944-06-26)—this is just of the formats you can use. Other
    formats such as MM/DD/YYYY (06/26/1944) and DD/MM/YYYY (26/06/1944) may cause
    difficulties for non-U.S. and U.S. users, respectively. You might want to experiment
    further, by trying MMM DD, YYYY (Jun 26, 1944) or MMM DD, YYYY (June 26, 1944)
    formats. A reasonably safe format is YYYYMMDD (19440626).


    There are further complications. BirthDate has a date type. You may well meet
    other columns with a datetime data type. Such columns will also record the hours
    and minutes and milliseconds. When developing your, you will have to pay attention
    to the time as well as the date—for example, 1944-06-26 00:00:00.000.


