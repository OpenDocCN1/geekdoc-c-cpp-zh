    # Outer Joins


    Often, when you join tables, there may be a mismatch of records. For example,
    you may have a product that does not belong to any product subcategory. Or you
    may have a product subcategory that does not have any products belonging to it.
    Inner joins find matched records across two or more tables. To find matched records
    as well, you will need an outer join (not an inner join). The next few queries
    investigate outer joins. Here''s a base query to get us started—now, it''s still
    an inner join.


    # Syntax


    ```

    -- two tables again 397 rows

    select EnglishProductName, EnglishProductSubcategoryName,

    S.ProductSubcategoryKey from DimProduct as P inner join

    DimProductSubcategory as S

    on P.ProductSubcategoryKey = S.ProductSubcategoryKey

    ```'
