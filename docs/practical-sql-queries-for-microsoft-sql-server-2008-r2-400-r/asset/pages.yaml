    # Analysis


    This query counts the number of products in each category—the result does not
    show the subcategory. The subcategory table (DimProductSubcategory) is only used
    so we can join each individual product to its relevant category.


    # Sum() 1/2


    The Count() aggregate function has been replaced by Sum(). Expect this one to
    return an error.


    # Syntax


    ```

    -- sum rather than count

    select EnglishProductCategoryName, EnglishProductSubcategoryName,

    SUM(EnglishProductName) as [SumOfProducts] from DimProductCategory as C

    inner join DimProductSubcategory as S

    on C.ProductCategoryKey = S.ProductCategoryKey

    inner join DimProduct as P

    on on S.ProductSubcategoryKey = P.ProductSubcategoryKey

    group by EnglishProductCategoryName, EnglishProductSubcategoryName

    ```


    # Result


    ```

    Msg 8117, Level 16, State 1, Line 2

    Operand data type varchar is invalid for sum operator.

    ```


    # Analysis


    EnglishProductName is a string with a data type of varchar. Earlier, we used Count()
    on the same column. You can count product names but you can''t sum them.


    # Sum() 2/2


    The aggregated column is now numeric.'
