    # Primary Key


    The Alter Table query makes the first column (SupplierID) into a primary key using
    Add Constraint syntax. PK_SupplierID is the name you invent for the key. There
    are also two Inserts and a Select—expect the Insert to fail.


    # Syntax


    ```

    -- primary key

    alter table Suppliers

    add constraint PK_SupplierID primary key (SupplierID)

    ---

    insert into Suppliers

    values (1,''Pubs'')

    ---

    insert into Suppliers

    values (3,''Pubs'')

    ---

    select * from Suppliers

