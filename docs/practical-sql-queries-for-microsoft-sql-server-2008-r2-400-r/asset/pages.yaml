    ![](img/906d042eab2493d2c9ccfd1e7ed07cdc_238_0.png)


    # Analysis


    The result shown is from the second of the two queries. The keyword Ex tests to
    if there are any records in the subquery. The first query returns all of your
    employees only if there are one or more customers with a LastName of Zimmerman.
    The second query does so if one or more customers have a surname of Munson. As
    that query returns no employees, it means no customer has a LastName of Munson.
    On large tables, you may find using an asterisk (*) rather than a specific column
    name in the subquery Select is more efficient.


