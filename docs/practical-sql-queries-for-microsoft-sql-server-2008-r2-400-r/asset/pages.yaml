  md: '# Chapter 3: Order By


    return data in the order of a cluster-indexed primary key. However, you can''t
    guarantee that this will happen every time—the only way to be certain of some
    kind of sort is to use an Order By clause.


    # Order By


    Often, of course, you''ll want to sort the rows being returned—either alphabetically
    (on strings) or numerically (on numeric columns). This query includes an Order
    By clause.


    # Syntax


    ```

    -- order on lastname

    select LastName, FirstName from DimCustomer

    order by LastName

    ```


    # Result


    ![](img/906d042eab2493d2c9ccfd1e7ed07cdc_110_0.png)


    # Analysis


    The LastName column is now sorted in ascending alphabetical order. You may have
    to scroll down a long way to see the effect—there are an awful of customers with
    a surname of Adams! You will also notice that the FirstName column is in no particular
    order for each LastName.


    # Asc


    The keyword Asc has been added to the Order By clause.'
