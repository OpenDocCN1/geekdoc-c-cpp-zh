    # Analysis


    Group By is incredibly powerful syntax—hopefully, you’ve seen a couple of examples
    you might be able to apply to your own data. It shows the groups and the aggregate
    calculations as totals. However, it does not show the detail records. For example,
    if you return the maximum price of products in a subcategory, you do not get to
    see a list of the individual products in each subcategory as well. The Compute
    clause is able to show totals and details. There are two result sets here. You
    can see the individual products and their prices in the first result set. The
    second result set shows the maximum and average prices. But these are not the
    maximum and average prices by category or subcategory—they are the maximum and
    average prices of all products. What we need to be able to aggregate on groups
    as well—we need some syntax that combines Compute with Group By. The SQL to do
    that is the Compute clause.


    # Compute 1/2


    This is the Compute clause—not a Compute clause. This query is an attempt to see
    both detail records and aggregations at the group level.'
