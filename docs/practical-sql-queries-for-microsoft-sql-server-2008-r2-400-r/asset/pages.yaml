  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    In this chapter we examine table creation. There are many ways of creating tables—here
    we concentrate on creating tables using a Select statement. A later chapter shows
    how to do so with a Create statement. You''ll learn how to create both permanent
    and temporary tables. Furthermore, you''ll meet three different types of temporary
    tables, semipermanent temporary tables, tempdb database. permanent and temporary
    tables have many uses. They can be used to denormalize and join tables for reporting
    purposes. In addition, they are invaluable for testing new designs and testing
    your SQL when your SQL becomes very complex, you can break it down into simpler
    steps and work against a series of temporary staging tables.


    +   - Key concepts Selecting into new tables, permanent tables, local temporary
    tables, global temporary tables, semipermanent temporary tables, tempdb database,
    deleting data, dropping tables


    +   - Keywords Select Into, #, ##, tempdb, Delete, Drop Table


    # Base Query


    The records returned by this query are going to be used in this chapter to show
    a variety of methods for creating new tables with a Select statement.


    # Syntax


    ```

    select

    select EnglishProductName, ListPrice - DealerPrice as Discount

    from DimProduct

    where ListPrice - DealerPrice is not null

    order by EnglishProductName

    ```'
