  md: '# Analysis


    The query returns 606 rows.


    # Count(*) 1/2


    The two queries here both give the same result.


    # Syntax


    ```

    -- count(*) 606

    select COUNT(*) from DimProduct

    select COUNT_BIG(*) from DimProduct

    ```


    # Result


    | (No column name) |

    |---|

    | 606 |


    # Analysis


    Last query returned 606 rows. These two queries return just 1 row each. That single
    row contains the count of the number of records in the table (606). Count() returns
    an int data type while Count_Big() returns a bigint data type. If you are expecting
    more than two billion records to be in the table, you must use Count_Big() rather
    than Count(). Both varieties in the syntax here have an asterisk (*) as a parameter.
    This has a specific meaning. It will count a record even if it''s a duplicate
    of another record—a duplicated record counts as two. In addition, it will also
    count any records that have null values in every single column.


    # Count(*) 2/2


    Aggregate functions, like Count(), do not result in very friendly column names.
    Our query employs a simple alias.


    # Syntax


    ```

    -- aliases good for all aggregates

    select COUNT(*) as [Number of Records] from DimProduct

    ```


    # Result


    | Number of Records |

    |---|

    | 606 |'
