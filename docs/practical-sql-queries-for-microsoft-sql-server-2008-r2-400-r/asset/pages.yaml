  md: '# Case ... When ... End


    Instead of If ... Else, you might like to take a look at Case ... When ... End.
    Yes, this one does have a Then and an End—maybe it''s a little more structured.


    # Syntax


    ```

    -- case

    declare @minute tinyint

    set @minute = datepart(mi,getdate())

    declare @OddEven bit

    set @OddEven = @minute %2

    select

    case @OddEven

    when 0 then ''Even''

    when 1 then ''Odd''

    else ''Unknown''

    end as [Minute]

    ```


    # Result


    Minute

    1 Odd


    # Analysis


    If you run this a few times, the result should change. Hopefully, you never see
    ''Unknown''. Getdate() returns the current date and time. Datepart(mi) extracts
    the minute from the time. %2 means modulo 2—so divide by 2 and return the remainder,
    which is always going to 0 or 1.


