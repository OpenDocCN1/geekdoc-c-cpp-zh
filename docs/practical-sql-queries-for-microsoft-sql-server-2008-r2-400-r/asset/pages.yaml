  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    This is an introductory chapter. It concentrates on retrieving columns of data
    from a single table. A wide variety of techniques are covered—doing column calculations,
    aliasing columns, handling dates and nulls, and more. Many of the techniques discussed
    are fundamental and give you a sound basis on which to develop more complex SQL.
    You will meet a lot of syntax in this chapter again in later chapters as you learn
    more complex SQL.


    +   - Key concepts Selecting columns from a single table, schema names, database
    names, case sensitivity, aliases, XML, concatenation, data types, date and numeric
    calculations, Case functions


    +   - Keywords Select, From, Use, As, Cast(), Convert(), GetDate(), Datediff(),
    Distinct, Top, For Xml, IsNull(), Is Null, Coalesce(), Case


    # Hello World


    Your first Select query!


    # Syntax


    ```

    -- hello world

    -- this is a comment as is the line above

    select ''Hello World''

    ```


    # Result


    | No column name |

    | Hello World |


    # Analysis


    I guess this is not the exciting SQL query ever. However, it does prove a point—a
    Select statement does not have to return data from a table. Select can be used
    to return literals (strings and numbers), values of variables, function return
    values, and more. We''ll investigate all of these in the course of this book—the
    rest of this chapter is devoted to returning data from a single relational table.


    # Select All Columns from a Table


    This is different from the previous query—it has a From clause. It returns all
    the columns or fields (and all the rows or records) from a table called DimCustomer.'
