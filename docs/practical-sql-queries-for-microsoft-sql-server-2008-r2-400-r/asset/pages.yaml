    # Analysis


    The column(s) you use in a Compute By clause must also appear in an Order By clause.
    In addition, the Order By clause must precede the Compute By clause. Wow—eight
    result sets! You should be able to see the product detail records for each of
    the four categories and the aggregates for each category, too. You may have to
    use the outer scroll bar to see all the aggregates. You may have to use the inner
    scroll bar to see all the details.


    The result of a Compute By can be a little difficult to read. To get all of the
    result sets into a single result set would require some extremely complex and
    probably inefficient SQL. It gets quite tricky handling the multiple result sets
    in client applications. If you find yourself writing lots of Compute and By queries,
    you are probably ready to start building a multidimensional database. However,
    that requires SSAS cubes, not SQL Server relational tables. Oh, and it might involve
    learning the MDX query language as well!'
