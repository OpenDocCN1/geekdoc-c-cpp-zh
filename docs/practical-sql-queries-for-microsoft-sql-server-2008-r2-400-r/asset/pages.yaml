    # # Analysis


    Some SQL Server data types (for example, char and varchar) contain ASCII characters
    only. Other string data types (for example, nchar and nvarchar) contain Unicode
    characters. In general, the mapping from ASCII to Unicode happens automatically.
    In certain circumstances, the mapping may not work. A discussion of SQL collations
    and the difference between ASCII and Unicode is outside the scope of this book.
    However, if you find searches are not returning the expected results, you may
    want to try the N prefix in the syntax for this query. This prefix means you are
    searching with a Unicode rather than an ASCII character. Graphical query designers
    automatically add the N prefix before strings for you.


    # # More on Like


    Here, the pattern for the wildcard search has changed.


    # # Syntax


    ```

    -- two letters

    select FirstName, LastName from DimCustomer

    where LastName like ''Li%''

    ```'
