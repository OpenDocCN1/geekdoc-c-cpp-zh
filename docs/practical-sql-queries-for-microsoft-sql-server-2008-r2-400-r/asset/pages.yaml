  md: '# StDev()


    StDev() is used to work out standard deviations. There are three queries here.


    # Syntax


    ```

    -- stdev

    select STDEV(SalesAmount) from FactResellerSales

    select STDEV(all SalesAmount) from FactResellerSales

    select STDEV(distinct SalesAmount) from FactResellerSales

    ```


    # Result


    | (No column name) |

    | 1 | 2124.2337584832 |


    # Analysis


    The first two queries are functionally equivalent (the result shown); the All
    keyword is optional. The third query returns a different result—the keyword Distinct
    causes the calculation to ignore duplicate SalesAmount values.


    # Some Statistics


    This is our last query in this chapter devoted to aggregates. It displays more
    than one aggregation.


    # Syntax


    ```

    -- more than one aggregate function

    select SUM(SalesAmount) as [Total Sales], AVG(SalesAmount)

    as [Average Sale], STDEV(all SalesAmount) as [All SD],

    STDEV(distinct SalesAmount) as [Distinct SD] from FactResellerSales

    ```


    # Result


    | Total Sales | All SD | Distinct SD |

    | 1 | 80450596.9823 1322.0047 | 2124.2337584229 4164.16620976141 |


    # Analysis


    You can combine different aggregation functions in one Select list. You can even
    use different columns, provided these columns are all aggregated in some way.'
