  md: '# About the Author


    Art Tennick (Brighton, U.K.) has worked in relational database design and SQL
    queries for over 20 years. He has been involved in multidimensional database design,
    cubes, data mining, DMX and MDX queries for 10 years. Based in the United Kingdom,
    he has been a software consultant, trainer, and writer for some 25 years. Recently,
    he has worked with several major retail and banking corporations to implement
    BI solutions using Microsoft SQL Server, SSAS, SSIS, SSRS, and Excel 2007/2010.
    This is nineteenth book and he has also written over 300 articles for computer
    magazines in the United States, the United Kingdom, and Ireland. His web site
    is www.MrCube.net.


    # About the Technical Editor


    Dejan Sarka focuses on development of database and Business Intelligence applications.
    Besides projects, he spends about half of his time in training and mentoring.
    He is the founder of the Slovenian SQL Server and .NET Users Group. Dejan Sarka
    is the main author or coauthor of eight books about databases and SQL Server.
    Dejan Sarka also developed two courses for Solid Quality Mentors: Data Modeling
    Essentials and Data Mining with SQL Server 2008.'
