  md: '6. Type, or type drag, or copy and paste to create the query.


    7. Click the Execute button on the toolbar.


    There are many other ways of opening the query editor. Here''s a popular alternative:


    +   1. In Object Explorer, right-click the SQL Server database AdventureWorksDW2008
    or AdventureWorks2008 (AdventureWorksDW or AdventureWorks in SQL Server 2005).
    If your Object Explorer is closed or empty, click File | Connect Object Explorer.


    +   2. Click New Query.


    # Chapter Content


    # Chapter 1, "Select: Single Table”


    This is an introductory chapter. It concentrates on retrieving columns and rows
    of data from a single table. A wide variety of techniques are covered—doing column
    calculations, aliasing columns, handling dates and nulls, and more. Many of the
    techniques discussed are fundamental ones and give you a sound basis on which
    to develop more complex SQL. You will meet a lot of syntax from this chapter again
    in later chapters as you learn more complex SQL.


    # Chapter 2, "Where”


    This chapter is devoted to the Where clause. It''s a huge subject area and could
    easily fill a whole book, let alone a single chapter. Here you''ll discover how
    to search records—how to find what you''re looking for. You also see how to rerun
    subsets of your tables based on the criteria you specify. Many of your SQL queries
    are going to require Where clauses—here you''ll become familiar with all the important
    concepts and techniques for returning just what you want (and being able to ignore
    what you don''t).


    # Chapter 3, "Order By”


    If you need to sort the output of your SQL queries, use the Order By clause. That''s
    the topic for this chapter. It shows you how to sort alphabetically and numerically.
    It also demonstrates how to extract the top (or best) and the bottom (or worst)
    of the rows in your tables.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Chapter 4,”Select: Multiple Tables”


    The previous three chapters concentrate on single-table queries. It''s unlikely
    that you will always find the data you need in a single table. Often, your data
    is split across two or more tables. This chapter shows the SQL required to put
    tables together. The technique is of performing joins on tables. There are quite
    a few variations on the join technique. All of the variations (inner joins and
    outer joins and more) are covered here. You will find the SQL useful when you
    move on to build views and stored procedures. If you join tables in a normalized
    database, then the joining is sometimes referred to as denormalization. Denormalization
    is an important part of building SQL relational data warehouses (star schemas,
    for example) and SSAS multidimensional cubes.


    # Chapter 5,”Aggregates”


    Here we look how to aggregate data. Aggregating data includes counting, and averaging
    data. You may also be interested in how to calculate maximum and minimum values.
    All of these topics are covered in this chapter. We''ll be doing the aggregations
    on all the records in a table—so, a summation, will result in a grand total. A
    later chapter, Chapter 8 on Group By, extends this chapter and how to perform
    aggregations on subsets of tables—in other words, how to calculate subtotals as
    well as grand totals. Being able to produce aggregates makes your reports for
    end users more informative—they can see the overall picture rather than lots of
    individual bits of data. Aggregation is also an important concept to understand
    as you begin to develop your data warehouses.


    # Chapter 6,”Select: New Tables”


    In this chapter we examine table creation. There are many ways of creating tables—here
    we concentrate on creating tables using a Select statement (Select Into). A later
    chapter shows how to do so with a Create statement. You''ll learn how to create
    both permanent and temporary tables. Furthermore, you''ll meet three different
    types of temporary tables and have a quick look at the tempdb database. Permanent
    permanent and temporary tables have many uses. They can be used to denormalize
    and join tables for reporting purposes. In addition, they are invaluable for testing
    new designs and testing your SQL, when you prefer not to work against live production
    tables. Also, when your SQL becomes very complex, you can break it down into simpler
    steps and work against a series of temporary staging tables.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Chapter 7,"Except/Intersect/Union"


    Here we examine set operations. The three main keywords introduced are Union,
    Intersect, and Except. These are set operators that treat each table involved
    in the operation as set. If you are familiar with set theory and Venn diagrams
    from high school math, you already have a good idea how they work. Union puts
    two or more tables together. Intersect looks at what the tables have in common.
    Except returns the differences between tables.


    # Chapter 8,"Group By"


    Business users often ask for reports that show totals and subtotals. These totals
    are often based on particular categories or groups of data. This chapter introduces
    the SQL required to group your data and produce meaningful totals. The main emphasis
    is on the Group By clause with various aggregation functions, for example, Sum().
    We also take a quick look at the more specialized Compute and By clauses. Hopefully,
    you''ll learn enough SQL in just this chapter to begin producing sophisticated
    queries for your business users.


    # Chapter 9,"System Functions"


    SQL Server has a couple built-in system functions. You can browse them all in
    Object Explorer, where they are arranged by category. You can always write your
    own functions in SQL, but it makes sense to use the prewritten ones if they serve
    your purpose. It''s going to save you a lot of work and time if what you want
    is already there. In this chapter, we investigate some of these system functions.
    In particular, we concentrate on some of the most popular and useful string functions,
    mathematical functions, and date functions. Knowledge of these functions will
    help you to easily manipulate and transform your data, in exactly the way you
    want to.


    # Chapter 10,"Subqueries"


    A looking at queries within queries—that''s Select statements within Select statements.
    These are often called subqueries or nested queries. Subqueries have lots of uses,
    some of them quite advanced, like derived tables. As this is an introductory book,
    we''ll concentrate on one of the more popular and simpler uses for subqueries.
    We examine how to use a subquery in a Where clause. There are many ways of doing
    the same thing in SQL, as is often the case. You can arrive at the same results
    as you do with subqueries by possibly using joins or temporary tables or some
    procedural programming with variables. Those other topics are covered in other
    chapters in this book.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Introduction


    # Chapter 11,”Delete/Insert/Update”


    Many of the other chapters deal with getting data out of your tables and databases—lots
    and lots of Select statements. This assumes, of course, that the data is already
    there and in the form you require. By contrast, this chapter is dedicated to entering
    and maintaining the data in the first place. Without your data, your Select statements
    will return nothing. Without good data, your Select statements will return erroneous
    or obsolete data. Here, we look at data entry using the Insert statement and maintaining
    data accuracy with the Update statement. In addition, you learn how to remove
    obsolete or unwanted data with the Delete statement. There are also example queries
    showing how to work with identity (auto-numbering) columns.


    # Chapter 12,”Views/User-Defined Functions”


    As business user demands for more and more sophisticated reports increase, your
    SQL is going to become more and more complex. Rather than having to code the syntax
    over and over, you can save your SQL. There are three main ways of doing this.
    You (and others) can reuse it for complex Select statements—a view is really a
    stored query. You can use it at any time, without having to be aware of all the
    complex SQL you originally put into it. This called *encapsulation*. A second
    way of saving SQL is to create your own user-defined functions. These are normally
    used for storing calculations (we are not going to cover table functions that
    can store Selects). A third way is to create stored procedures. Stored procedures
    can be used to store both calculations and Selects. Views and functions are covered
    in this chapter. The next chapter discusses stored procedures. Functions and stored
    procedures allow you to do sophisticated procedural programming, which we do not.


    # Chapter 13,”Stored Procedures/Programming”


    This is the chapter for procedural programmers. It introduces lots of syntax that
    you may not think of as SQL. Indeed, strictly speaking, some of it is not SQL.
    We should rather call it T-SQL (Transact-SQL), which is the SQL Server version
    of SQL that contains lots of keywords and concepts that extend standard SQL. These
    extensions are very powerful and help you make your SQL queries truly dynamic
    and versatile. For example, you can dynamically change a Where clause at run.
    The main emphasis of the chapter (after exploring some basic programming constructs)
    is on stored procedures. These allow you to change your SQL dynamically based
    on conditional factors—and a whole lot more. In addition, stored procedures provide
    encapsulation of your code. If you get it right, a Select in a stored procedure
    can run much faster than it normally would as a stand-alone query. This is SQL
    on steroids!


    # xx'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Chapter 14,”Data Definition Language (DDL) and Data Control Language (DCL)


    Data definition language (DDL) is that part of SQL concerned with creating and
    maintaining the database objects you will need. Data control language (DCL) is
    the part of SQL dedicated to setting up security on the objects you''ve created.
    This chapter is dedicated to DDL and DCL. You will see how to create a database,
    tables, keys, indexes, and other objects. Once those objects have been created,
    you''ll also learn how to create a login and a user and control test access to
    the objects.


    # Chapter 15,”After You Finish


