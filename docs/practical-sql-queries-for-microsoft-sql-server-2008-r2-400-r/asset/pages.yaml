    sample VB.NET code that creates a dataset (you may have to adapt the Data Source
    and Initial Catalog properties as well as the table name in the From clause):


    ```

    Dim con As SqlClient.SqlConnection("Data Source=localhost;

    Initial Catalog=AdventureWorks2008;Integrated Security=SSPI")

    con.Open()

