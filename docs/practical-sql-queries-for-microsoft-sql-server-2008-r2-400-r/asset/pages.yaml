  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    In this chapter, we look at how to aggregate data. Aggregating data includes counting,
    totaling, and averaging data. You may also be interested in how to calculate maximum
    and minimum values. All of these topics are covered in this chapter. We''ll be
    doing the aggregations on all of the records in a table—so a summation, for example,
    will result in a grand total. A later chapter, Chapter 8 on Group By, extends
    this chapter and shows how to perform aggregations makes reports for users more
    informative—they can see the overall picture rather than lots of individual bits
    of data. Aggregation is also an important concept to understand as you begin to
    develop your data warehouses.


    +   ** Key concepts** Aggregating data, totaling data, counts, minimums, maximums,
