- img_proc: true
  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    SQL Server has a couple hundred built-in system functions. You can browse them
    all in Object Explorer where they are arranged by category. You can always write
    your own functions in SQL, but it makes sense to use the prewritten ones if they
    serve your purpose. It''s going to save you a lot of work and time, if what is
    already there. In this chapter, we investigate some of these system functions.
    In particular, we concentrate on some of the most popular and useful string functions,
    mathematical functions, and date functions. A knowledge of these functions will
    help you easily manipulate and transform your data, in exactly the way you want
    to.


    +   - Key concepts Using the built-in system functions, string functions, mathematical
    functions, date functions


    +   - Keywords Lower(), Upper(), Left(), Right(), Charindex(), Replace(), Ceiling(),
    Floor(), Round(), Datepart(), Datename(), Getdate(), Datediff(), Dateadd(), Convert()


    # Base Query for String Functions


    Let''s start with a few string functions. This is a base query for these functions.


    # Syntax


    ```

    -- string functions

    -- base query

    select distinct EnglishProductName from DimProduct as P

    inner join DimProductSubcategory as S

    on P.ProductSubcategoryKey = S.ProductSubcategoryKey

    inner join DimProductCategory as C

    on S.ProductCategoryKey = C.ProductCategoryKey

    where EnglishProductName = ''Bikes''

    order by EnglishProductName

    ```'
