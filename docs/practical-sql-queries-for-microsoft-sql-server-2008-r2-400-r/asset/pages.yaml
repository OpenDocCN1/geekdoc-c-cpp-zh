    # Compute


    This is your introduction to the Compute clause. We are still calculating aggregate
    values, but this time, there''s no Group By clause. This query is going to give
    its result in a completely different way. The structure of the result means you
    can''t use Compute everywhere you might use a Group By—for example, in views and
