- img_proc: true
  md: '# Chapter 13: Stored Procedures/Programming 263


    # Syntax


    ```

    -- output parameter

    alter proc GetCustomers

    @maritalstatus nchar(1) = ''S'',

    @gender varchar(1) = ''F'',

    @count int out

    asas

    begin

    select FirstName + '' '' + LastName as [Full Name], MaritalStatus, Gender

    from DimCustomer

    where MaritalStatus = @maritalstatus and Gender = @gender

    set @count = @@ROWCOUNT

    end

    ```


    # Result


    Command(s) completed successfully.


    # Analysis


    Output parameters require the keyword Out (or Output) and appear before the As
    keyword. If there are two or more input and/or output parameters, they must be
    comma-separated. The output parameter here, @count, is of data type int. In the
    main body of the procedure, this parameter is being set to @@Rowcount. @@Rowcount
    is a system variable that returns the number of records affected by the previous
    statement. Consequently, @count holds the number of records returned by the Select
    statement.


    # Output Parameter 2/4


    Let''s attempt to run our stored procedure. All three queries here are going to
    fail.


    # Syntax


    ```

    -- calling to get output parameter

    exec GetCustomers

    --

    exec GetCustomers ''M'', ''F''

    --

    exec GetCustomers @count out

    ```'
