  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    # Where to Use SQL


    Throughout this book, you''ve been using SSMS to write your SQL queries and display
    the results. It''s unlikely that your users will have SSMS—indeed, it''s not recommended
    for end users as it''s simply too powerful and potentially dangerous. This chapter
    presents some alternative software and methods for getting SQL query results to
    the end user.


    # SSRS


    SQL Server Reporting Services (SSRS) can generate quite complex SQL for you, but
    you may want some of the more sophisticated queries you''ve seen in this book.
    You will need a SQL Server connection to do this. To use your SQL, paste the code
    you might have developed in SSMS into the SQL Pane in Query Designer (or click
    Edit As Text on the toolbar first).


    # SSIS


    With SQL Server Integration Services (SSIS) you can get the SQL results into a
    data pipeline using a Data Flow task. It''s quite easy to convert it into a text
    file, an Excel worksheet, or a SQL table. You will need an Ole DB or ADO NET source
    with a SQL Server connection. Then change the Data access mode from Table or View
    to SQL Command and paste in your SQL from SSMS. Alternatively, on the SSIS Control
    Flow, you can use an Execute SQL task and configure the ResultSet property appropriately.


    # DMX


    If you need to train an SSAS data mining model or run a DMX prediction query against
    a relational database, you can use SQL inside the DMX.


    # XMLA


    Your SQL queries can also be nested inside XMLA. To do so, use an <ExecuteCommand><Statement>
    construct.


    # Winforms and Webforms


    If you are a .NET developer, you can create your own Windows applications (Winforms)
    or web pages (Webforms) to display the results of your SQL queries. The simplest
    way to do so is to use a datagrid.'
  merge: -1
  pgno: 321
- img_proc: true
