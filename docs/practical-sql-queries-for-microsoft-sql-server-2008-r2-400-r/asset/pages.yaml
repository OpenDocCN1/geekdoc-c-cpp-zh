    # Analysis


    Here are only 3 rows, not the 18,484 we had in the previous query. When you have
    a subset of the rows in a table, it''s often referred to as a horizontal partition.
    Without any sorting of the data, you can''t predict exactly which 3 rows are to
    be returned. Also, please remember to include the schema name as you adapt this
    and other queries for your own databases. As a reminder, it''s also good practice
    to terminate the query with a semicolon.


    # Where =


