  md: '# Local Temporary Table


    There are a total of four queries here. First, there''s a Select Into to create
    a new table. The new table name has a # prefix. Second, there''s a normal Select
    to select the table. Third, there''s a Drop Table to remove the table. Fourth,
    there''s a normal Select to verify that the new table has been removed. Before
    you run the third query, Drop Table, please read the Analysis for this query.


    # Syntax


    ```

    -- local temporary

    select EnglishProductName, ListPrice - DealerPrice as Discount

    into #NewDimProduct

    from DimProduct

    where ListPrice - DealerPrice is not null

    order by EnglishProductName

    -- test

    select * from #NewDimProduct

    -- drop

    drop table #NewDimProduct

    select * from #NewDimProduct

    ```


