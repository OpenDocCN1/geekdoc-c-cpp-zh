- img_proc: true
  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    His chapter looks at queries within queries—that''s Select statements with Select
    statements. These are often called subqueries or nested queries. Subqueries have
    lots of uses, some of quite advanced, like derived tables. As this is an introductory
    book, we''ll concentrate on one of the most popular and simpler subqueries. We
    examine how to use a subquery in a Where clause. As is often the case, there are
    many ways of doing the same thing in SQL. You can arrive at the same results as
    you do with subqueries by possibly using joins or temporary tables or some procedural
    programming with variables. Those other topics are covered in other chapters in
    this book.


    +   * Key concepts Subqueries or nested queries

    * Keywords Select, In, Exists, Not, Any, All


    # Where Revision


    This chapter is going to have subqueries (or nested queries) in Where clauses.
    Here are four queries to give you some revision of simple Where clauses—if you
    need it.


    # Syntax


    ```

    -- simple where revision

    select FirstName, LastName from DimEmployee

    where LastName = ''Munson''

    select FirstName, LastName from DimEmployee

    where LastName <> ''Munson''

    select FirstName, LastName from DimEmployee

    where LastName in (''Munson'', ''Brown'')

    select FirstName, LastName from DimEmployee

    where LastName not in (''Munson'', ''Brown'')

    ```


    # Result


    | FirstName | LastName |

    | --- | --- |

    | Kevin | Brown |

    | Jo | Brown |

    | Stuart | Munson |

    | Eric | Brown |


    # Analysis


    The result shown is from the third of the four Select statements.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Subquery In


    There are two Selects and two tables in one query. The second Select, in parentheses,
    is the subquery.


    # Syntax


    ```

    -- employee and customer table no direct join

    -- same surname

    select FirstName, LastName from DimEmployee

    where LastName in (select LastName from DimCustomer)

    ```


    # Result


    | FirstName | LastName |

    |---|---|

    | 1 | Frank | Lee |

    | 2 | Kimberly | Zimmermann |

    | 3 | Samantha | Smith |

    | 4 | Denise | Smith |

    | 5 | Shane | Kim |

    | 6 | John | Campbell |

    | 7 | David | Campbell |

    | 8 | Dan | Wilson |

    | 9 | Ashvini | Sharma |

    | 10 | Lane | Sackander |

    | 11 | Barry | Johnson |

    | 12 | David | Johnson |

    | 13 | Willis | Johnson |

    | 14 | Patrick | Wedge |

    | 15 | Michael | Ray |

    | 16 | Michael | Rothkugian |

    | 17 | Janet | Shepherdian |

    | 18 | Ken | Sánchez |


    # Analysis


    The result is a list of employees who share surnames with your customers. The
    subquery must be enclosed within parentheses. A good way to test queries containing
    subqueries is to make sure the subquery itself works. This is true for the subqueries
    in this book—there is a type of subquery called a correlated subquery where it
    no longer holds. You test it by highlighting the subquery and executing it individually
    as a standalone-alone query. If it fails, the whole query (the outer and inner
    queries together) is also going to fail. This subquery could be rewritten as a
    join between the tables. You can do this, even if there is no primary-to-foreign-key
    relationship between the tables. In this example, the join column would be LastName.'
