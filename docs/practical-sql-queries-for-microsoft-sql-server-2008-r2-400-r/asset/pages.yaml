- img_proc: true
  md: '# Analysis


    There''s a Top clause in this query—it''s asking for the top one (1). But top
    one at what? The Top clause works with the Order By clause (if you have that clause).
    Therefore, we are asking for the top paid customer—here it''s Damien Chander (your
    answer may be different). In fact, the result is not predictable, and the next
    query shows why.


    You should be aware of an alternative syntax:


    ```

    select top (1) LastName, FirstName, YearlyIncome from DimCustomer

    order by YearlyIncome desc

    ```


    This alternative syntax incorporates parentheses. This is, in fact, the recommended
    way to do it. I have avoided this best practice, in this book, for reasons of
    backward compatibility.


    # Top with Ties


    Who are the customers (plural) with the highest income? There are two queries
    here for you to try.


    # Syntax


    +   - top with ties

    select top 1 with ties LastName, FirstName, YearlyIncome from DimCustomer

    order by YearlyIncome desc

    select top 113 LastName, FirstName, YearlyIncome from DimCustomer

    order by YearlyIncome desc


    # Result


    ![](img/906d042eab2493d2c9ccfd1e7ed07cdc_119_0.png)'
  merge: -1
