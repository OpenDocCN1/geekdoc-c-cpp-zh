  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    If you need to sort the output of your SQL queries, you use the Order By clause.
    That''s the topic for this chapter. It shows you how to sort alphabetically and
    numerically. It also demonstrates how to extract the top (or best) and the bottom
    (or worst) of rows in your tables.


    +   - **Key concepts** Sorting records, sorting on alphabetic columns, sorting
    on numeric columns, showing the top records

    - **Keywords** Order By, Asc, Desc, Top, Percent, With Ties


    # No Particular Order


    Let''s start with a simple Select on two columns from the DimCustomer table.


    # Syntax


    ```

    -- names in any old order

    select LastName, FirstName from DimCustomer

    ```


