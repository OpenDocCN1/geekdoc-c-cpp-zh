  md: '# Introduction


    # SQL


    Structured Query Language (SQL) is a standard language for interrogating and working
    with relational databases. SQL is supported by many database vendors. The SQL
    in this book was written against Microsoft SQL Server 2008. However, about 99
    percent of the queries will work against earlier versions of SQL Server. In addition,
    about 95 percent of the queries will work against databases such as Oracle, DB2,
    MySQL. The Microsoft implementation of the SQL language in SQL Server is called
    Transact-SQL (T-SQL). All SQL dialects have some small differences, but the queries
    in this book can be adapted to your own database software if it''s not SQL.


    The SQL language is often divided into three sections, data manipulation language
    (DML), data definition language (DDL), and data control language (DCL). All three
    sections are covered in this book. DML consists of Select, Insert, Update, and
    Delete. DDL consists of Create, Alter, and Drop. DCL consists of Grant, Revoke,
    and Deny. DDL and DCL have their own chapter, but they are discussed briefly in
    other chapters too. Most of the chapters deal with DML— particular, we concentrate
    largely (but not exclusively) on the Select statement of DML.


    Generally, when people talk about SQL queries, they are referring to Select statements.
    You are going to get lots and lots of practice with Select statements! But other
    areas of SQL are also covered in reasonable detail too.


    # Prerequisites


    You will need two databases. First, the SQL Server AdventureWorksDW2008 database
    (called AdventureWorksDW in SQL Server 2005), which is the AdventureWorks star/snowflake/OLAP
    schema—most of the SQL queries are written again that database. Second, the SQL
    Server AdventureWorks2008 database (called AdventureWorks in SQL Server 2005),
    which is an OLTP schema. Only one or two queries are written against this database.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Installing Adventure Works


    You can download the required SQL Server databases from codeplex.com (both 2008
    and 2005 versions). As of this writing, the URL was http://www.codeplex.com/MSFTDBProdSamples/Release/ProjectReleases.aspx?ReleaseID=16040.
    Choose SQL Server 2008 or SQL Server 2005 from the Releases box. URLs can change—if
    you have difficulty, then search we codeplex.com on Adventure Works Samples, or
    try http://msftdbprodsamples.codeplex.com.


    # SQL Server 2008


    Before you begin the download, you might want to check the two hyperlinks for
    Database Prerequisites and Installing Databases. Download and run SQL2008. AdventureWorks
    All Databases.x86.msi (there are also 64-bit versions, x64 and ia64). As the installation
    proceeds, you will have to choose an instance name for your SQL Server. When the
    installation finishes, you will have some new SQL Server databases, including
    AdventureWorksDW2008 and AdventureWorks2008.


    # SQL Server 2005


    The download files are called AdventureWorksBICL.msi (there are also 64-bit versions,
    x64 and IA64) and AdventureWorksDBCL.msi (there are also 64-bit versions, x64
    and IA64). With 2005 you can go through Setup or Control Panel to add the samples—this
    is not possible in 2008. Unlike 2008, the download and subsequent installation
    do not result in the new databases appearing under SQL Server in SSMS—it''s not
    possible to write your first query until you have to manually attach the databases.
    You can do this from SSMS (right-click on the Databases folder and choose Attach)
    to do this for you. If you have some DBA knowledge. Or you might ask your SQL
    Server DBA to do this for you. If you click the Release Notes hyperlink on the
    download page, you will find out how to do this from SQL—using SQL before you
    even start a book for learning SQL!


    # Source Code


    All of the source code for the queries in this book is available for download.
    You can simply copy and paste into your editor to ensure you are typing. You can
    copy and paste individual queries or copy and paste blocks of code. If you do
    the latter, make sure that you highlight only the relevant code before you run
    the query.


    You can download the source code from vw.mhprofessional.com/computingdownload.'
