    |---|---|

    | 1 | Racing Bikes | NULL |

    | 2 | NULL | Trikes |


    # Analysis


    Now you have just two rows. These are the two new mismatched records (one from
    each of the two). This is a standard and very useful query to try and discover
    mismatched records in your tables. Please note that the Is Null clause is used
    twice on different columns.


