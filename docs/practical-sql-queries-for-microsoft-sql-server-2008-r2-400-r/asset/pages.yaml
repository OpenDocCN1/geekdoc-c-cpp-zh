    Neither the LastName nor the FirstName columns are in any particular (alphabetical)
    order. If you were to include the CustomerKey column, you might see that it appears
    to be sorted numerically in ascending order. That column is the primary key of
    the table and has a special type of index (clustered index) defined for it. Often,
    SQL Server will'
