- img_proc: true
  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    This is the chapter for procedural programmers. It introduces lots of syntax that
    you may not think of as SQL. Strictly, speaking, it is not SQL. We should really
    call it T-SQL (Transact-SQL), which is the SQL Server version of SQL that contains
    lots of keywords and concepts that extend standard SQL. These extensions are very
    powerful and help you make your SQL queries truly dynamic and versatile. For example,
    you can dynamically change a Where clause at runtime. The main emphasis of the
    chapter (after exploring some basic programming constructs) is on stored procedures.
    These allow you to change your SQL dynamically based on conditional factors—and
    a whole lot more. In addition, stored procedures provide encapsulation of your
    code. If you get it right, a Select in a stored procedure can also run much faster
    than it normally would as a stand-alone query. This is SQL on steroids!


    +   - **Key concepts** Debugging with Select and Print, user-defined variables,
    while loops, conditional branching, system variables, creating stored procedures,
    calling stored procedures, input parameters, output parameters, return values,
    default parameters, error handling


    +   - **Keywords** Select, Declare, @, Set, @@Version, @@RowCount, While Begin
    ... End, Return, If ... Else, Case ... When ... End, Create Proc, Alter Proc,
    Out, Default, Try ... Catch, ERROR_MESSAGE()


    # Select


    You can use Select to display literals and variables onscreen.


    # Syntax


    ```

    -- select

    select ''Got here''

    ```


    # Result


    | Pro column name |

    | 1 | Got here |


    # Analysis


    The result appears on the Results tab. Dumping variable values to screen is very
    handy when you are debugging complex procedural code.'
