  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    # Self Join 1/6


    Sometimes, a table may be joined to itself. It has a foreign key that points to
    the primary key in the same table. A classic example is an employees'' table—for
    example, DimEmployee. Such a table is often referred to as a self-join table (other
    terms include hierarchical table, recursive table, and parent-child table). Please
    try the following on DimEmployee.


    # Syntax


    ```

    -- self join base query (Rob Walters twice)

    select EmployeeKey, FirstName, LastName, ParentEmployeeKey, FirstName,

    LastName from DimEmployee

    ```


    # Result


    | EmployeeKey FirstName LastName ParentEmployeeKey FirstName LastName |

    |---|---|---|---|---|---||

    | 1 | Guy | Gilbert | 18 | Guy | Gilbert |

    | 2 | Kevin | Brown | 7 | Kevin | Brown |

    | 3 | Roberto | Tamburello | 14 | Roberto | Tamburello |

    | 4 | Rob | Walters | 3 | Rob | Walters |

    | 5 | Rob | Walters | 3 | Rob | Walters |

    | 6 | Thierry | D''Hers | 112 | Thierry | D''Hers |

    | 7 | David | Bradley | 11 | David | Bradley |

    | 8 | David | Bradley | 112 | David | Bradley |

    | 9 | John | Ellerbeck | 23 | John | Ellerbeck |

    | 10 | Ruth | Ellerbeck | 189 | Ruth | Ellerbeck |

    | 11 | Gail | Erickson | 3 | Gail | Erickson |

    | 12 | Bary | Johnson | 189 | Bary | Johnson |

    | 13 | Jossef | Goldberg | 3 | Jossef | Goldberg |

    | 14 | Tim | Duly | 112 | Tim | Duly |

    | 15 | Sidney | Higa | 189 | Sydney | Higa |

    | 16 | Taylor | Maxwell | 23 | Taylor | Maxwell |

    | 17 | Jeffrey | Ford | 189 | Jeffrey | Ford |

    | 18 | Jo | Brown | 23 | Jo | Brown |


    # Analysis


    There are 296 rows. The repetition of the FirstName and LastName columns is deliberate—we’re
    going to use these columns in later queries. The primary key is EmployeeKey and
    the foreign key is ParentEmployeeKey. The employee called Guy has a primary key
    of 1 and a foreign key of 18. This means he works for the employee with a primary
    key of 18. That person is Jo Brown, who in turn reports to Peter Krebs. If you
    understand that, then you understand self joins.'
