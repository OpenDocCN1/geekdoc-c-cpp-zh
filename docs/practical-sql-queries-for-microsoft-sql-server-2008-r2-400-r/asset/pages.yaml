- img_proc: true
  md: 'In this chapter, we examine set operations. The three main keywords introduced
    Union, Intersect, and Except. These are operators that treat each table involved
    in the operation as a set. If you are familiar with theory and Venn diagrams from
    high school math, you already have a good idea how they work. Union puts two or
    more tables together. Intersect looks at what the tables have in common. Except
    returns the differences between tables.


    +   - **Concepts** Set operations, appending tables, common records in tables,
    different records in tables, except, intersect, union


    +   - **Keywords** Union, Union All, Intersect, Except, Select Into, Insert Into


    # # New Table 1/2


    We are going to need two new tables for the exercises in this chapter. Here''s
    a Select to create the first of the two new tables. It''s followed by a normal
    Select to verify the new table and its data.


    # ## Syntax


    ```

    -- preparing data 1/2

    select EnglishProductName, ReorderPoint

    into Table1

    from DimProduct

    where EnglishProductName like ''flat%''

    order * by EnglishProductName-- 9 records

    select * from Table1

    ```


    # ## Result


    | EnglishProductName | ReorderPoint |

    | Flat Washer 1 | 750 |

    | Flat Washer 2 | 750 |

    | Flat Washer 3 | 750 |

    | Flat Washer 4 | 750 |

    | Flat Washer 5 | 750 |

    | Flat Washer 6 | 750 |

    | Flat Washer 7 | 750 |

    | Flat Washer 8 | 750 |

    | Flat Washer 9 | 750 |'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Analysis


    Now you have a new table, with a very exciting name! It contains nine products,
    also with highly stimulating names. I reinstated the Order By clause—the user
    may want the records sorted.


    # New Table 2/2


    The Select Into creates the second of the two new tables we need for this chapter.


    # Syntax


    ```

    -- preparing data 2/2

    select EnglishProductName, ReorderPoint

    into Table2

    from DimProduct

    where EnglishProductName = ''flat washer 9''

    -- 1 record

    select * from Table2

    ```


    # Result


    | EnglishProductName | ReorderPoint |

    |---|---|

    | Flat Washer 9 | 750 |


    # Analysis


    This new table (Table2) contains just the one record. This record is the same
    as one of the records in Table1.


    # Inserting Data


    Also, we''re going to need another record in the second of the two new tables
    (Table2). The first query is an Insert Into statement—inserts are covered more
    fully later in the book.


    # Syntax


    ```

    -- add a record

    insert into Table2

    values(''Flat Washer 33'',999)

    -- 2 records

    select * from Table2

    ```'
