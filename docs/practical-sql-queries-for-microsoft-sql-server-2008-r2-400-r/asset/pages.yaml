    # # Analysis


    All four queries, or just three? It is possible that the first one might fail.
    The first of the four queries is terminated with a semicolon (;)—this is sometimes
    optional, but many SQL programmers find it good practice to clearly delineate
    queries. I would recommend the use of semicolons in *all* your queries. In the
    second query, the From is in uppercase (FROM)—SQL syntax is case-insensitive.
    The third query is the one that might possibly fail—the table name is in lowercase
    (dicustomer). If it does fail, your database might be case-sensitive—there are
    some varieties of the Microsoft AdventureWorks downloads that are case-sensitive.
    Most SQL databases are, in reality, case-insensitive. If you suspect that yours
    is case-sensitive, ask your SQL DBA to make it case-insensitive. Or make sure
    you capitalize all object names used in this book. You can check the capitalization
    of object names by browsing the object in Object Explorer in SSMS. The fourth
    and final query uses lots of space characters and hard returns—it on three lines.
    SQL queries are forgiving of white space and carriage returns.


