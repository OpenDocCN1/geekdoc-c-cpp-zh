  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    # Schema Name


    Here, there is a dbo prefix before the table name. The prefix is called the schema.
    Most of the time, you may be able to ignore the schema and simply use the table
    name without the schema prefix. However, this is generally considered bad practice.
    It is possible to have the same table name more than once in a database, if they
    belong to different schemas. You should always explicitly use the schema name.
    Instances in which the schema name is not used in this book are for learning purposes
    only.


    # Syntax


    ```

    -- schema name

    select * from dbo.Customer

