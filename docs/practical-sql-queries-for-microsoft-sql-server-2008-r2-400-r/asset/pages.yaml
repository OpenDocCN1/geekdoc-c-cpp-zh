  md: '# Chapter 13: Stored Procedures/Programming 249


    # If ... Else 2/6


    This query is deliberately written to fail.


    # Syntax


    ```

    -- more on if

    if 1 <> 0

    print ''true''

    print ''got here''

    else

    print ''false''

    ```


    # Result


    Msg 156, Level 15, State 1, Line 5

    Incorrect syntax near the keyword ''else''.


    # Analysis


    The error may be a little perplexing at first. An Else must come after an If.
    But the If is actually only the first Print (''true''). The second Print (''got
    here'') is not part of the If—therefore the Else does not follow the If, it follows
    a stand-alone Print (''got here'').


    # If ... Else 3/6


    Now, there''s a Begin ... End block after the If.


    # Syntax


    ```

    -- better

    if 1 <> 0

    begin

    print ''true''

    print ''got here''

    else

    print ''false''

    ```


    # Result


    true

    got here'
