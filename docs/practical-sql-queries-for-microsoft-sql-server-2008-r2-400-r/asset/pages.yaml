  md: '# Syntax


    ```

    -- drop

    drop table NewDimProduct

    select * from NewDimProduct

    ```


    # Result


    Msg 208, Level 16, State 1, Line 1

    Invalid object name ''NewDimProduct''.


    # Analysis


    Drop Table is different from Delete. Delete removes data but leaves the table
    intact. Drop Table removes the table completely—if the table contains data, then
    the data is removed when the table is removed. The Select statement error message
    confirms that the table no longer exists. If you right-click and choose Refresh
    in Object Explorer, you can verify that your new table is gone. Using Object Explorer.
    When you right-click on a table, there is a Delete option in the context menu.
    This is not the equivalent of the SQL Delete statement; it''s actually the equivalent
    of the SQL Drop Table statement. Please don''t experiment on any production databases
    tables!


    # Creating an Empty Table


    You have just created a new table containing data using Select Into. You can also
    create a new table that does not contain data with Select Into. There is a Where
    clause at the end of this query.


    # Syntax


    ```

    -- empty table

    select EnglishProductName, ListPrice - DealerPrice as Discount

    into NewDimProduct

    from DimProduct

    where 1 = 0

    ```


