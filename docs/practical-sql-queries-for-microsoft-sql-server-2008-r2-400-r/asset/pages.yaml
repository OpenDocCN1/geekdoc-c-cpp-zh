    # Create View


    This is the same Select as in the last query, but it has Create View syntax before
    the Select.


    # Syntax


    ```

    -- a view

    create view MyView as

    select EnglishProductName, EnglishProductSubcategoryName,

    EnglishProductCategoryName from DimProduct as P

    inner join DimProductSubcategory as S

    on P.SubcategoryKey = S.SubcategoryKey

    inner join DimProductCategory as C

    on S.CategoryKey = C.CategoryKey

    where EnglishProductName = ''Bikes''

    or EnglishProductName = ''Accessories''

    ```'
