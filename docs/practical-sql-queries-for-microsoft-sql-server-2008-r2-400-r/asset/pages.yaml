    | 15 | Full-Finger Gloves, M | 15.196 |

    | 16 | Full-Finger Gloves, S | 15.196 |

    | 17 | Half-Finger Gloves, L | 9.4192 |

    | 18 | Half-Finger Gloves, L | 9.796 |


    # Analysis


    There are many different ways of creating tables. You can, of course, create tables
    graphically in SSMS. As this is a book about queries, graphical methods are outside
    its scope. To create queries directly from the SQL language, you often will use
    Create Table syntax—this is covered in a later chapter on data definition language
    (DDL). Create Table results in an empty table, which later has to be populated
    with records. The next few queries in this chapter show some alternative methods
    for creating tables (both permanent and temporary tables). The tables are going
    to be created using a Select statement—this gives the option of populating the
    table with records as it''s created.


    # Select Into


    This query is going to creating a new table called NewDimProduct. There is an
    Into clause before the From clause.


    # Syntax


    ```

    select into

    select EnglishProductName, ListPrice - DealerPrice as Discount\into NewDimProduct

    from DimProduct

    where ListPrice - DealerPrice is not null

    ```'
