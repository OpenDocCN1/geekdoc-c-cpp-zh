  md: '# Foreign Key


    We are going to define a foreign key and set up referential integrity between
    the two tables.


    # Syntax


    ```

    -- foreign key DRI

    alter table Products

    add constraint FK_SupplierID foreign key (SupplierID)

    references dbo.Suppliers (SupplierID)

    ```


    # Result


    Command() completed successfully.


    # Analysis


    The foreign key in the Products table is SupplierID. This refers back to the SupplierID
    column in the parent table (Suppliers). SupplierID is the primary key in the Suppliers
    table. FK_SupplierID is the name you decide to give the foreign key. You can see
    the foreign key in Object Explorer under the Keys folder underneath the table.


    # Foreign Key Violation


    This query is an Insert Into Values. The last entry in the Values list is the
    foreign key (SupplierID).


    # Syntax


    ```

    -- inserting data fails DRI

    insert into Products

    values (1,''Red racing bike'',2500,99)

    ```


    # Result


    ```

    Msg 547, Level 16, State 0, Line 2

    The INSERT statement conflicted with the FOREIGN KEY constraint "FK_SupplierID".
    The insert failed because the FOREIGN KEY constraint.

    The statement has been terminated.

    ```


    # Analysis


    The Insert should fail. You tried to insert a value of 99 as the SupplierID. The
    foreign key constraint will only allow values for the foreign key (SupplierID)
    that already exist\ in the primary key (SupplierID) column of the parent table
    (Suppliers).'
