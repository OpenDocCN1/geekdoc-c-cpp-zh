  md: '# Analysis


    You now have 39 rows. If you scroll down, you''ll see the Racing Bikes subcategory
    with no category, and the Trikes category with no subcategory. Our original inner
    join gave 37 rows. Our left join returned 38 records: 37 rows plus Racing Bikes
    from the left table. Our right join gave 38 records: 37 Trikes from the right
    table. The full outer join, in this query, returns 39 records—37 plus Racing Bikes
    from the left table and Trikes from the right table. A full outer join returns
    all records from both the left table and the right table, including matched and
    mismatched records.


    # Full Outer Join 2/2


    This is the outer join with a double null set.


    # Syntax


    ```

    -- full outer with two nulls 2 records

    select EnglishProductSubcategoryName, EnglishProductName

    from DimProductSubcategory as S

    full outer join DimProductCategory as C

    on S.ProductKey = C.ProductKey

    where EnglishProductSubcategoryName is null

    or EnglishProductSubcategoryName is null

    ```


