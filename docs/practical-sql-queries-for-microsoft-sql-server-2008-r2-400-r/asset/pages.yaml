    # Analysis


    This is not we want! In the last query you saw 397 products—now it seems there
    are 22422. In this query, the tables are separated by a comma in the From clause.
    This syntax is called a cross join. It shows every single combination of product
    name and product subcategory—even when the combination is wrong. Please take a
    look at the Adjustable Race product. Cross joins do have certain uses in SQL queries,
    but a cross join is not appropriate here. The Order By clause is purely to sort
    the records—nothing else.


    # How Not to Join Tables 2/3


    Both the tables, DimProduct and DimProductSubcategory, have a column in common.
    It''s called ProductSubcategoryKey. In this query, we''re trying to join the two
    tables together on this shared column—to see if we can get the right match between
    products and their subcategories.


    # Syntax


    ```

    -- how not to do it 2/3

    select EnglishProductName, EnglishProductSubcategoryName

    from DimProduct, DimProductSubcategory

    where ProductSubcategoryKey = ProductSubcategoryKey

    ```'
