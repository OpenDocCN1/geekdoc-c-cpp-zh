- img_proc: true
  md: '# Chapter 7: Except/Intersect/Union 155


    You can union more than two tables—simply add more Union operators and Select
    statements. A union is not the same as a join. A join puts tables together horizontally,
    usually based on a primary-to-foreign-key relationship—it’s for creating a single
    result from often dissimilar tables (denormalization). A union appends tables
    it them together vertically—it’s for creating a single result from similar tables
    (conforming).


    # Union 2/3


    This query is designed to give an error.


    # Syntax


    ```

    -- error 1/2

    select * from Table1

    union

    select EnglishProductName from Table2

    ```


    # Result


    > Msg 245, Level 16, State 1, Line 2

    All queries using a UNION, INTERSECT or EXCEPT operator must have an equal number
    of expressions in their list.


    # Analysis


    The error occurs when the first Select returns two columns and the second Select
    returns only one column. When you append tables with the Union operator, there
    must be an equal number of columns from each table.


    # Union 3/3


    This query, too, is meant to fail!


    # Syntax


    ```

    -- error 2/2

    select ReOrderPoint from Table1

    union

    select EnglishProductName from Table2

    ```


    # Result


    > Msg 245, Level 16, State 1, Line 2

    Conversion failed when converting the nvarchar value ''Flat Washer 33'' to data
    type smallint.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Analysis


    The error is a different one. This time we have the same number of columns, so
    that''s not the problem. However, the data types of the two columns are incompatible.
    ReOrderPoint is a smallint while EnglishProductName is a varchar.


    # Union All


    But our queries here are meant to work. Please note that Union has been changed
    to Union All.


    # Syntax


    ```

    -- union all 11 records

    select * from Table1

    union all

    select * from Table2

    ```


    # Result


    | EnglishProductName | ReorderPoint |

    |---|---|

    | Flat Washer 1 | 750 |

    | Flat Washer 2 | 750 |

    | Flat Washer 3 | 750 |

    | Flat Washer 4 | 750 |

    | Flat Washer 5 | 750 |

    | Flat Washer 6 | 750 |

    | Flat Washer 7 | 750 |

    | Flat Washer 8 | 750 |

    | Flat Washer 9 | 750 |

    | Flat Washer 33 | 999 |

    | Flat Washer 9 | 750 |


    # Analysis


    Here you get 11 rows (not the 10 we had a couple of queries ago). The record that
    is common to both tables, Flat Washer 9, is returned twice. The Union operator
    suppresses duplicates, while Union All does not.


    # Intersect


    The operator between the two Selects is Intersect rather than Union.'
