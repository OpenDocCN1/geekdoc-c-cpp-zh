  md: '# Chapter 2: Where 75


    # Syntax


    -- better, contains another table

    select JobCandidateID, Resume

    from AdventureWorks2008.HumanResources.JobCandidate

    where contains (Resume, ''cycle'')


    # Result


    | JobCandidateID | Resume |

    |---|---||

    | 1 | 4 | cns:Resume xmlns:ns=''http://schemas.rn... | |

    | 2 | 5 | cns:Resume xmlns:ns=''http://schemas.rn... | |


    # Analysis


    This query finds the word ''cycle'' anywhere within the Resume column of the table.
    The Contains predicate assumes full-text searching is enabled on your database
    and that a Full Text Catalog exists on the table. Enabling full-text searching
    and constructing a Full Text Catalog on a table is beyond the scope of this book
    (but to point to you in the right direction, right-click on a table and choose
    Full-Text index). The Resume column has a data type of XML and has an awful of
    data in it. When you have long strings to search (for example, XML, text, ntext,
    varchar (max), nvarchar (max) ) and potentially lots of records, you will find
    full-text searching much faster than using the Like operator with wildcards.


