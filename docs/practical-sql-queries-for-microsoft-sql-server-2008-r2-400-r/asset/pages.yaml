- img_proc: true
  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    As business user demands for more and more sophisticated reports increase, SQL
    is going to become more and more complex. Rather than having to code the same
    syntax over and over again, you can save your SQL. There are three main ways of
    doing this. You can create views for complex Select statements—a view is really
    a stored query. You (and others) can reuse it at any time, without having to be
    aware of the complex SQL you originally put into it. This is called encapsulation.
    A second way of saving SQL is to create your own user-defined functions. These
    are normally used for storing calculations (we are not going to cover table functions
    that can be used to store both calculations and Views). A third way is to create
    stored procedures. Procedures can be used to store both calculations and Select.
    Views and functions are covered in this chapter. The next chapter discusses stored
    procedures. Functions and stored procedures allow you to do such sophisticated
    programming, which we do not.


    +   - **Concepts** Creating views, encapsulating and hiding complex SQL, creating
    your own functions


    +   - **Keywords** Create View, Alter View, Drop View, Create Function, Drop Function


    # Select from Tables


    Here''s some moderately complex SQL—it''s a Select joining three tables.


    # Syntax


    ```

    -- a select

    select EnglishProductName, EnglishProductSubcategoryName,

    EnglishProductCategory from DimProduct as P

    inner join DimSubcategory as S

    on P.ProductSubcategoryKey = S.ProductSubcategoryKey

    inner join DimCategory as C

    on S.ProductCategoryKey = C.ProductCategoryKey

    where EnglishCategoryName = ''Bikes'' or

    EnglishCategoryName = ''Accessories''

    ```'
  merge: -1
  pgno: 261
