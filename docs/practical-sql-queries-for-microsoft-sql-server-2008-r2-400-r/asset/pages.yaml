  md: '# Analysis


    Often, you''ll want to see how much time has elapsed since a start date or start
    time. For example, if you are in marketing, you might want to see the age of your
    customers. It doesn''t make sense to have a column (unless it''s a calculated
    column) in the table called Age—you''ll be updating the column every year for
    every customer! This is probably a better solution—it makes use of the DateDiff
    function. The function is working out the number of years between the birth date
    of the customer and the current date. The first parameter of the DateDiff function
    is yy. To see a full list of parameter codes, highlight the word DateDiff and
    press F1. My help system takes me to Dateadd(), for some reason—but the codes
    are not the same. This anomaly may well be fixed in your version of SQL Server.


    # Numeric Column Calculation 1/2


    As well as date column calculations, you can perform calculations using numeric
    columns. Here, you''re attempting to find out how many children of a customer
    live away from home. Expect this query to fail—at least, partially.


    # Syntax


    ```

    -- columns calculation

    select totalchildren, numberchildrenathome,

    totalchildren - numberchildrenathome as AwayFromHome

    from DimCustomer

    ```


    # Result


    ```

    Msg 8115, Level 16, State 2, Line 2

    Arithmetic overflow converting expression to data type tintint.

    ```


    # Analysis


    You might just see a flicker of data on the Results tab before you are flipped
    to the Messages tab, with an error about an indent overflow. If you then click
    the Results tab, you will see some records returned—so you may be tempted to conclude
    that the query was successful. However, you will see a note at the bottom that
    the query completed with errors. Also, there are only 82 rows returned (bottom-right
    corner), and from earlier queries we know there are over 18,000 customers. The
    problem is addressed in the next query.'
