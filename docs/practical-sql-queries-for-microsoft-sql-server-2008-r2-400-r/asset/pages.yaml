  md: '# # Chapter 14


    # # Data Definition Language (DDL) and Data Control Language (DCL)


    ![](img/906d042eab2493d2c9ccfd1e7ed07cdc_304_0.png)'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    Data definition language (DDL) is part of SQL concerned with creating and maintaining
    the database objects you need. Data control language is the part of SQL dedicated
    to setting up security on the objects you''ve created. This chapter is dedicated
    to DDL and DCL. You will see how to create a database, tables, keys, indexes,
    and other objects. Once those have been created, you''ll also learn how to create
    a login and a user, and to control and test access to the objects.


    +   * **Key concepts** Data definition language, data control language, creating
    databases, creating tables, creating primary keys, creating foreign keys, creating
    indexes, creating logins, creating users, security, giving and removing permissions

    * **Keywords** Create Database, Use Table, Alter Table, Add Constraint, Primary
    Key, Foreign Key, References, Create Index, Create Login, Create User, Execute
    As, Revert, Revoke, Denny, Drop Database, Drop Login


    # Create Database


    Creating a database from a SQL query can be very simple or very complex. This
    query is about the simplest you can get. I would recommend that you don''t try
    the exercises in this chapter on a production server.


    # Syntax


    ```

    -- create database

    -- you must be sysadmin

    -- make sure it doesn''t already exist

    create database MyDatabase

    ```


    # Result


    Command(s) completed successfully.


    # Analysis


    There''s not lot of syntax here! Creating a database this means it will have all
    of the default values configured for your SQL Server databases. The full syntax
    is complex and beyond the scope of an introductory book. By default, you can only
    create databases if you are a member of the sysadmin role. You can also create
    databases if you have given explicit permissions or have been added to the dbcreator
    role. If you''re logged in as an administrator, it''s possible that you are a
    member of this role already. If you''re not sure, you may want to consult with
    your SQL Server DBA.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Use


    You are going to create some tables in this new database. If you are currently
    connected to AdventureWorksDW2008 (or AdventureWorksDW in SQL Server 2005), the
    tables you create shortly will go into that database. To ensure the tables go
    into your new MyDatabase, you have three choices. First, as you create other objects,
    preface the object name with the database and schema (dbo) names. Second, switch
    the context to MyDatabase by using the drop-down on the toolbar. Third, issue
    the Use statement as shown in this query.


    # Syntax


    +   - either database from combo or use MyDatabase

    use MyDatabase


    # Result


    Command(s) completed successfully.


    # Analysis


    If you issue the Use as shown here, the new database context can be seen in the
    drop-down on the toolbar. The tab of your query editor window also displays the
    current context. Database context is vital. Many times I have inadvertently created
    objects and then lost them—only to discover later that I accidentally created
    them in the master database!


