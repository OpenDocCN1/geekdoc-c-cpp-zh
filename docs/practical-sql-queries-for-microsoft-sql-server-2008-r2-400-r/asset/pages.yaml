    # Third-Party Software


    There is an infinite variety of third-party software applications available that
    allow you to paste in your SQL.


    # Copy and Paste


    Or you can right-click on the Results pane in SSMS and select Select All. Then
    rightclick again and choose Copy. You can then paste the SQL results (rather than
    the SQL itself) into an application of your choice.'
