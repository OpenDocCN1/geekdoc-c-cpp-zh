  md: '# # Chapter 8


    # Group By'
  merge: -1
  pgno: 190
- img_proc: true
  md: "# Practical SQL Queries for Microsoft SQL Server 2008 R2\n\nBusiness users\
    \ often ask for reports that show totals and subtotals. These totals often based\
    \ on particular categories or groups of data. This chapter introduces the SQL\
    \ required to group your data and make meaningful totals. The main emphasis is\
    \ on the Group By clause used with various aggregation functions, for example\
    \ Sum(). We also take a look at the more specialized Compute and Compute By clauses.\
    \ Hopefully, you'll learn enough SQL in just this chapter to begin producing reports\
    \ for your business users.\n\n+   - Key concepts Grouping records, aggregations\
    \ across groups, totals and subtotals, filtering groups, comparing aggregate values,\
    \ totals and detail records\n\n+   - Keywords Group By, Having, Compute, Compute\
    \ By, Count(), Sum(), Min(), Max(), Avg()\n\n# Base Query\n\nTo get started on\
    \ this chapter devoted to grouping records, here's a base query that we'll use\
    \ a few times.\n\n# Syntax\n\n```\nselect EnglishProductCategoryName, EnglishProductSubcategoryName\
    \ from DimProductCategory as C\n join DimProductSubcategory as S\n on C.ProductCategoryKey\
    \ =\n```\n\n# Result\n\n| EnglishProductCategoryName | EnglishProductSubcategoryName\
    \ |\n|---|---|\n| 1 Bikes | Mountain Bikes |\n| 2 Bikes | Road Bikes |\n| 3 Bikes\
    \ | Touring Bikes |\n| 4 Components | Handlebars |\n| 5 Components | Bottom Brackets\
    \ |\n| 6 Components | Bikes |\n| 7 Components | Chars |\n| 8 Components | Cranksets\
    \ |\n| 9 Components | Derailers |\n| 10 Components | Forks |\n| 11 Components\
    \ | Headsets |\n| 12 Components | Mountain Frames |\n| 13 Components | Pedals\
    \ |\n| 14 Components | Road Frames |\n| 15 Components | Saddles |\n| 16 Components\
    \ | Touring Frames |\n| 17 Components | Wheels |\n| 18 Clothing | Bib-Shorts |"
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Analysis


    The result of the inner join is a list of categories and corresponding subcategories.
    There are 37 rows. If you look at the Bikes category, it''s composed of three
    subcategories (Mountain Bikes, Road Bikes, and Touring Bikes).


    # Count()


    The Bikes category has three subcategories. It might be useful to see how many
    subcategories make up each category for reporting purposes. Here''s the Count()
    aggregate.


    # Syntax


    ```

    -- count with error

    select EnglishProductName, COUNT(EnglishProductSubcategoryName)

    from DimProductCategory as C

    inner join DimProductSubcategory as S

    on C.ProductCategoryKey = S.ProductCategoryKey

    ```


    # Result


    Msg 512, Level 1, State 1, Line 2 Column ''DimProductCategory.EnglishProductProductName''
    is invalid in the select list because it is not contained in either


    # Analysis


    This is a common error in SQL queries. There is something wrong with the EnglishProductProductName
    column. It''s a non-aggregated column appearing alongside an aggregated column,
    EnglishProductSubcategoryName. You can''t have a non-aggregated column and an
    aggregated column in a count list, unless you include a Group By clause. You could
    have aggregated the EnglishProductCategory column too—but we don''t want that;
    we simply want to see the category name.


    # Group By 1/2


    The query introduces the Group By clause.


    # Syntax


    ```

    -- count with group

    select EnglishProductCategoryName, COUNT(EnglishProductSubcategoryName)

    as [Count Subcategories] from DimProductCategory as C

    ```'
  merge: -1
