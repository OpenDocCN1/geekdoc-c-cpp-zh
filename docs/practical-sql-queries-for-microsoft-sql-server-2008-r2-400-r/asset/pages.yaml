    # Analysis


    This function changes your strings into lowercase, if they are not already in
    lowercase.

    You can browse the system functions in Object Explorer. To do so, expand the Programmability
    folder under any database, then expand the Functions folder and the System Functions
    folder. This last folder contains all of the system functions organized into subfolders
    by category. As you might expect, string functions are in the String Functions
    folder, and mathematical functions are in the Mathematical Functions folder. Date
    functions can be found under the Date and Time Functions folder. Later in the
    chapter, we are going to use the Convert() function—this appears under the Other
    Functions folder. If you hover your mouse over a function, you get a tooltip explaining
    its purpose. If you expand a function, you get a little help with its syntax.
    With many other objects in Object Explorer, you can drag and drop the function
    name into the query editor window by typing and typos. If you highlight the function
    in the query editor and press F1, it opens SQL Server Books Online (BOL), giving
    a full explanation, full syntax, and examples that you can copy and paste. This
    technique works best if you highlight only the function without the parentheses.


    # Upper()


    The Upper() function.'
