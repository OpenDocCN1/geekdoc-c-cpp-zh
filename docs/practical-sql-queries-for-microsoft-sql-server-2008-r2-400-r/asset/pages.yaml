  md: '# Result


    | SupplierID | SupplierName |

    |---|---|

    | 1 | Adventure Works |

    | 2 | Northwind |

    | 3 | Pubs |


    # Analysis


    The Select should return three rows. The second Insert was successful. The first
    Insert failed as there''s now a primary key on the table. The primary key is on
    the SupplierID column. One of the features of a primary key is that it puts a
    unique index on the column. This means you can''t have duplicate values—a supplier
    (Adventure Works) already has a SupplierID of 1, and the attempt to add a new
    supplier (Pubs) with the same SupplierID generates a primary key error. The second
    attempt to add Pubs is fine.


