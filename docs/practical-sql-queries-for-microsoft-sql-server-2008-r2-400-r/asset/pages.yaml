  md: 'data from the source table into the new table. The new table is permanent—can
    see it listed in Object Explorer (you may have to right-click and choose Refresh
    first). The new table has some but not all of the features of the source table.
    For example, it has the same columns (those specified in the Select column list)
    with the same data types. It has the same number of records and the same data.
    However, if one of the columns has an identity property, this is copied too. It
    will not have any of the keys (for primary or foreign key) nor any of the indexes
    from the original table.

    If Select Into into two joined tables, you are creating a single table from two
    sources. Some people use this method to denormalize data and create tables for
    reporting. You can also accomplish this by creating views. Views are discussed
    in a later chapter. The difference is that a view does not create a new permanent
    object (for simplicity, I am ignoring materialized views, which are a special
    case). Here, you have a permanent object that persists until it''s explicitly
    dropped.


    # Deleting New Table


    Please try the Delete query first and then run the Select query.


    # Syntax


    ```

    -- delete

    delete NewDimProduct

    select * from NewDimProduct

    ```


