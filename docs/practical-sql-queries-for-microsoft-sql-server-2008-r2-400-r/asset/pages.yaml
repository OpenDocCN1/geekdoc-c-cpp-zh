  md: '# Create Proc


    Why not a stored procedure too? Please run separately—otherwise the stored procedure
    will run itself recursively.


    # Syntax


    ```

    -- stored procedure

    create proc ProductsBySupplier

    @supplier varchar(25)

    as

    select SupplierName, ProductName from Suppliers as S

    inner join Products as P

    on S.SupplierID = P.SupplierID

    where SupplierName = @supplier

    --

