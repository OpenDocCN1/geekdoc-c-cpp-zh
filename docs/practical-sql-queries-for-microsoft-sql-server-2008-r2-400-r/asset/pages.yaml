- img_proc: true
  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    The previous three chapters concentrated on single-table queries. It''s unlikely
    that you will always find the data you need in a single table. Often, your data
    is split over two or more tables. This chapter shows the SQL required to put tables
    together. The technique is one of performing joins on tables. There are quite
    a few variations on the join technique. All of the variations (inner joins and
    outer joins and more) are covered here. You will find the SQL useful when you
    later move on to build views and stored procedures. If you join tables in a normalized
    database, the joining is sometimes referred to as denormalization. denstar is
    an important part of building SQL Server relational data warehouses (star schemas,
    for example) and SSAS multidimensional cubes.


    +   - Key concepts Querying multiple tables, inner joins, left outer joins, right
    outer joins, full outer joins, self joins, cross joins, matching records, nonmatching
    records, table aliases


    +   - Keywords Inner Join, On, Left Outer Join, Right Outer Join, Full Outer Join


    # Single Table


    If you''ve worked through the previous chapters, this should be revision. It''s
    a single table Select to serve as a base query for some upcoming queries that
    are going to involve more than just one table.


    # Syntax


    ```

    single table

    select EnglishProductName, ProductSubcategoryKey from DimProduct

    where ProductSubcategoryKey is not null

    ```


    # Result


