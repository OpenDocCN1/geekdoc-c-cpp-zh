    # Analysis


    The Delete statement does not delete the table! You can still see the column names
    when you execute the Select query. A Delete statement does delete data from a
    table—there are no rows to be seen.


    # Dropping New Table


    Execute the Drop Table query and then try the Select query. Please be careful
    that you use Drop Table on the correct table, NewDimProduct, not DimProduct.'
