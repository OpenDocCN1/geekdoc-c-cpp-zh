  md: '# # Chapter 11


    # ## Delete/Insert/Update


    ![](img/906d042eab2493d2c9ccfd1e7ed07cdc_244_0.png)'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    Any of the other chapters deal with getting data out of your tables and databases—lots
    and Select statements. This assumes, of course, the data is already there and
    is in the form you require it. By contrast, this chapter is dedicated to entering
    and maintaining the data in the first place. Without good data, your Select statements
    will return nothing. Here, we look at data entry using the Insert statement and
    maintaining data accuracy with the Update statement. In addition, you learn how
    to remove obsolete or unwanted data with the Delete statement. There are also
    example queries showing how to work with identity (auto-numbering) columns.


    +   * Key concepts Inserting records, updating records, deleting records, truncating
    tables, dropping tables, working with identity columns

    * Keywords Insert Into ... Select, Insert Into ... Values, Select Into, Update
    ... Set, Delete, Truncate Table, DBCC Checkident(), Set Identity_Insert, Drop
    Table


    # Select Into


    Our first query in this chapter creates a new table, Scenario, based on an existing
    table called DimScenario. There''s a second Select to test this new table. The
    new table is used for exercises shortly. The first query also demonstrates Select
    Into, which is one way (out of a few) to put data into a table.


    # Syntax


    ```

    -- base table select into

    select *

    into Scenario

    from DimScenario

    --

    select * from Scenario

    ```


    # Result


    | ScenarioKey | ScenarioName |

    |---|---|

    | 1 | Actual |

    | 2 | Budget |

    | 3 | Forecast |'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'Chapter 11: Delete/Insert/Update


    # Analysis


    Select Into creates a new table and populates it with data from the source table.
    If the destination table already exists, the query will fail. To put data into
    an existing table from a source table, you use Insert Select, not Select Into.
    If you don''t have a source table, you can manually enter data with Insert Values.
    Both Insert Select and Insert Values are also covered in this chapter.


    # Truncate Table


    Here''s a Truncate query followed by a Select.


    # Syntax


    ```

    -- truncate

    tricate table Scenario

    --

    select * from Scenario

    ```


    # Result


    ![](img/906d042eab2493d2c9ccfd1e7ed07cdc_246_0.png)


    # Analysis


    Truncate Table removes all the data from the table. It does not remove the table.
    You can also use Delete to remove data from a table—Delete is discussed shortly.
    Truncate Table is faster than Delete on large tables. However, Truncate Table
    is never logged (Delete is logged if you have logging turned on—through the Recovery
    Model property of a database), which means it''s difficult to recover after an
    accidental removal of records. In addition, Truncate Table will fail if the table
    is involved in a referential integrity relationship with another table. It works
    fine, and you should be left with an empty Scenario table.


    Drop Table (the next query) is completely different from Truncate Table and Delete.
    The two leave the table structure intact. Drop Table not only removes the data
    from the table it also removes the table itself.


    # Drop Table


    This is a Drop Table query followed by a Select to test the results.'
