  md: '# Syntax


    +   - update

    - one column


    ```

    update Scenario

    set ScenarioName = ''Revised forecast''

    select * from Scenario

    ```


    # Result


    | ScenarioKey | ScenarioName |

    |---|---|

    | 1 | Revised forecast |

    | 2 | Revised forecast |

    | 3 | Revised forecast |


    # Analysis


    Woops, I forgot to use a Where clause! All the ScenarioName columns now have the
    same data.


    # Update with Where 1/2


    In this query, we have a Where clause with the Update statement.


    # Syntax


    ```

    - where clause doesn''t have to be same column

    update Scenario

    set ScenarioName = ''New revised forecast''

    where ScenarioKey = 3

    select * from Scenario

    ```


    # Result


    | ScenarioKey | ScenarioName |

    |---|---|

    | 1 | Revised forecast |

    | 2 | Revised forecast |

    | 3 | New revised forecast |


    # Analysis


    Hopefully, we just learned a very important lesson. An Update without a Where
    will update every single record in the table. Similarly, a Delete without a Where
    will remove all the records from a table. Unless you have a very good reason not
    to, Updates and Deletes should always be written with a Where clause.'
