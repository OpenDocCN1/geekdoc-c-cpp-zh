    # XML


    Normally, your SQL queries return a set of records or rows—this is often called
    a result or set record. You can handle this in a wide variety of ways in front-end
    applications; a popular way is to use a data grid. Sometimes, though, your client
    software may want the data in XML format. The second and third queries show two
    ways of retrieving XML data.


    # Syntax


    ```

    -- xml

