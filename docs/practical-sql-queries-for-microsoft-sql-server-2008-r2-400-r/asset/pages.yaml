    inner join DimProductSubcategory as S

    on C.ProductCategoryKey = S.ProductCategoryName

    group by EnglishProductCategoryName


    # Result


    | EnglishProductCategoryName | Count Subcategories |

    |---|---|

    | Accessories | 12 |

    | Bikes | 3 |

    | Clothing | 8 |

    | Components | 14 |


    # Analysis


    There are 4 records, now the 37 we had earlier. The Bikes category has three subcategories.
    We still have a non-aggregated and an aggregated column in the column list, the
    non-aggregatedaggregated column (EnglishProductCategoryName) this time also appears
    in the Group By clause. You are asking SQL Server to group on category and return
    the count of the subcategories in each group.


    # Group By 2/2


    Here we''ve added a Where clause as well.


    # Syntax


    ```

    -- count with group with where

    select EnglishProductCategoryName, COUNT(EnglishProductSubcategory)

    as [Count Subcategories] from DimProductCategory as C

    inner join DimProductSubcategory as S

    on C.ProductCategoryKey = S.ProductCategoryName

    where EnglishProductCategoryName <> ''Bikes''

    group by EnglishProductCategoryName

    ```


    # Result


    | EnglishProductCategoryName | Count Subcategories |

    |---|---|

    | Accessories | 12 |

    | Clothing | 8 |

    | Components | 14 |


    # Analysis


    Now you can see the Bikes category. As always, you can extend your SQL by combining
    clauses and keywords and operators and functions. In this case, the Where clause
    must appear before the Group By clause.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Chapter 8: Group By 163


    # Having 1/2


    You can filter records using a Where clause. You can also filter groups of records
    by using a Having clause. The difference between Where and Having is examined
    shortly. Let''s try eliminating bikes, by asking only for those categories that
    contain more than three subcategories.


    # Syntax


    ```

    -- count with group with having 1/2

    select EnglishProductProductName, COUNT(EnglishProductSubcategoryName)

    as [Count Subcategories] from DimProductCategory as C

    inner join DimProductSubcategory as S

    on C.ProductCategoryKey = S.ProductCategoryKey

    group by EnglishProductProductName

    having [Count Subcategories] > 3

    ```


    # Result


    Msg 207, Level 16, State 1, Line 6

    Invalid column name ''Count Subcategories''.


    # Analysis


    Unfortunately, this doesn''t work. The count of the subcategories is aliased as
    [Count Subcategories] and that''s what we''ve used in the Having clause.


    # Having 2/2


    Instead of the alias, we have the aggregation and column in the Having clause.


    # Syntax


    ```

    -- count with group with having 2/2

    select EnglishProductProductName, COUNT(EnglishProductSubcategoryName)

    as [Count Subcategories] from DimProductCategory as C

    inner join DimProductSubcategory as S

    on C.ProductCategoryKey = S.ProductCategoryKey

    group by EnglishProductProductName

    having COUNT(EnglishProductSubcategoryName) > 3

    ```'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# Result


    | EnglishProductCategoryName | CountSubcategories |

    |---|--|

    | 1 | Accessories | 12 |

    | 2 | Clothing | 0 |

    | 3 | Components | 14 |


    # Analysis


    This time works fine. You can''t use aliases in Having clauses to repeat the original
    expression, Count(EnglishProductCategoryName). A Where clause must precede Group
    By clause, while a Having clause must come after the Group By. You have now managed
    to eliminate the Bikes category in two queries. Earlier, you did this in a Where
    clause. Here, you''ve done it in a Having clause. The two clauses operate differently.
    A Where clause does not return unwanted rows—they are filtered out at source.
    A Having clause returns the records so that grouping and aggregating can be done
    before they are filtered out. Generally, if you wish to filter on grouped and
    aggregated results, you must use a Having clause. You will notice that Bikes is
    not referred to in the query.


    # No Aggregation


    There are two queries here. The first one has no Group By. Both queries produce
    the same result, although you might find that the order of the results is different.


    # Syntax


    ```

    -- when not use group by

    select EnglishProductCategoryName, EnglishProductSubcategoryName from DimProductCategory
    as C

    inner join DimProductSubcategory as S

    on C.ProductCategoryKey = S.ProductCategoryKey

    --

    select EnglishProductCategoryName, EnglishProductSubcategoryName from DimProductCategory
    as C

    inner join DimProductSubcategory as S

    on C.ProductCategoryKey = S.ProductCategoryKeyngroup by EnglishProductCategoryName,
    EnglishProductSubcategoryName

    ```'
