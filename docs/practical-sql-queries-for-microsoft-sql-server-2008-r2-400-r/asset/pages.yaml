- img_proc: true
  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    # Analysis


    If a stored procedure runs successfully, the return value is 0. Here, we''ve created
    a variable (@return) to capture, hold, and display the return value. Please note
    the syntax for the Exec line. You must run all of the syntax in one go—the result
    shown from Select @return. Altogether, there are three results.


    # Return 2/4


    In our last query, the return value was set implicitly by the stored procedure.
    You can, if you wish, also set it explicitly. There are two queries here; please
    run them separately.


    # Syntax


    ```

    alter proc GetCustomers

    @maritalstatus nchar(1) = ''S''

    @gender nvarchar(1) = ''F''

    @count int out

    as

    begin

    select FirstName + '' '' + LastName as [Full Name], MaritalStatus, Gender

    from DimCustomer

    where MaritalStatus = @maritalstatus and Gender = @gender

    set @count = @@ROWCOUNT

    return 0

    end

    ndeclare @count int

    declare @return int

    exec @return = GetCustomers default, default, @count out

    select @count as [Records]

    select @return as [Return]

    ```


    # Result


    | Return |

    | 1 | 0 |


    # Analysis


    To set the return value from a stored procedure explicitly, you use the Return
    statement. A Return statement also causes the stored procedure to stop and exit.
    The result shown is the return value.'
