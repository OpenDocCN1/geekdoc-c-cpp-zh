  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    His chapter is devoted to the Where clause. It''s a huge subject area and could
    easily fill a whole book, let alone a single chapter. You''ll discover how to
    search records (relational database experts prefer to call them rows)—how to find
    what you''re looking for. You''ll also see how to return subsets of your tables
    based on criteria. Many of your own SQL queries are going to require Where clauses—here
    you''ll become familiar with all of the important concepts and techniques for
    returning just what you want (and being able to ignore what you don''t).


    +   * Key concepts Searching for records, filtering, search criteria, date searching,
    equalities and inequalities, null values, Unicode and ASCII, wildcards, full-text
    searches


