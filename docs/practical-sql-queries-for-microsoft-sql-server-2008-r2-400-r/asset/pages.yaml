  md: '# Delete with Identity 1/2


    This time, we''ll use Delete rather than Truncate Table before repopulating the
    Scenario table.


    # Syntax


    ```

    -- delete again

    delete Scenario

    -- delete from Scenario also occurs

    --

    insert into Scenario (ScenarioName)

    select ScenarioName from DimScenario

    --

    select * from Scenario

    ```


    # Result


    | ScenarioKey | ScenarioName |

    |---|---|

    | 1 4 | Actual |

    | 2 5 | Budget |

    | 3 6 | Forecast |


    # Analysis


    Now ScenarioKey starts at 4. It picks up where it left off counting last time.
    Delete (unlike Truncate Table) does not reset the identity column.


    # Delete with Identity 2/2


    So, how do you reset an identity column after a Delete? The second query here
    uses DBCC Checkident().


    # Syntax


    ```

    -- delete with identities

    delete Scenario

    -- reseed

    dbcc checkident(Scenario, reseed, 0)

    --

    insert into Scenario (ScenarioName)

    select ScenarioName from DimScenario

    --

    select * from Scenario

    ```'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Result


    | ScenarioKey | ScenarioName |

    |---|---|

    | 1 | Actual |

    | 2 | Budget |

    | 3 | Forecast |


    # Analysis


    Your ScenarioKey should start at 1 again. DBCC Checkpoint() accepts a table name,
    the Reseed key, and a reseed value. This is all a bit convoluted, so why bother?

    Truncate Table removes all the records from a table. Delete (without a Where clause)
    does the same. Truncate Table resets the identity column and Delete does not.
    However, Truncate Table can be dangerous if it''s not logged. Anyway, it will
    not work if the table is involved in a referential integrity relationship. You
    may prefer to or be forced to use Delete to clear out a table. But why worrying
    about reseeding the identity column with DBCC Checkident after a Delete? Okay
    it looks nicer if it restarts at 1 again. More importantly, though, you might
    run out of numbers, and further inserts will not. The point where you are going
    to run out of numbers depends on the data type of the identity column. Tinyint
    limits you to a couple of hundred, smallint has a limit of just over 32 thousand,
    and the int limit is around two billion. In terms of performance and storage space,
    tinyint is better than smallint, which, in turn, is better than int. You are going
    to hit a trade-off between performance and number limits. DBCC Checkpoint(), resets
    the identity column, can help you avoid this trade-off.


    # Delete with Where


    If all is well, you should have three records in the new Scenario table, starting
    with an identity column value of 1. So far, our Truncate Table and Delete statements
    have managed to remove all the records the each time. Truncate Table and Delete
    can be very, very dangerous! Delete is a safer if you have logging on (through
    the Recovery Model property of a database)—it''s easy to undo it. Delete is a
    lot safer to add a Where clause (Truncate Table does not support the Where).


    # Syntax


    ```

    -- delete with where

    delete Scenario

    where ScenarioName = ''Budget''

    --

    select * from Scenario

    ```'
