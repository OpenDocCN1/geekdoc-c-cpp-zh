- img_proc: true
  md: '# Analysis


    You will notice that each product belongs to a particular product subcategory,
    denoted by the ProductSubcategoryKey column. To simplify introduction to multiple
    table queries, we are ignoring those products that do not have a product subcategory.
    The null values have been suppressed for now—we’ll see how to deal them later
    in the chapter. As the query stands, you should have 397 rows. It would be useful
    to use the name of the products'' subcategories rather than their keys—we need
    another table to do this.


    If you know something about relational database design (in particular, normalization),
    you might be surprised to see duplicate product names in the result. In fact,
    AdventureWorksDW2008 (or AdventureDW in SQL Server 2005) is not a normalized database.
    It’s deliberately denormalized into a star schema (strictly speaking, it’s a snowflake
    star). Star and snowflake schemas are used in data warehousing and building SSAS
    cubes. These topics are beyond the scope of this book. But, if you are interested,
    the same product name can appear more than once if other columns in the record
    are different—for example, the same product can have a different price at different
    times. Such a table is called a _slowly changing dimension table.


    # How Not to Join Tables 1/3


    In order to show the product subcategory name alongside the product name, this
    query adds a second table (DimProductSubcategory, which contains the subcategory
    name). We are trying to join the two tables together.


    # Syntax


    ```

    -- how not to do it 1/3

    select EnglishProductName, EnglishProductSubcategoryName

    from DimProduct, DimProductSubcategory

    order by EnglishProductName

    ```'
