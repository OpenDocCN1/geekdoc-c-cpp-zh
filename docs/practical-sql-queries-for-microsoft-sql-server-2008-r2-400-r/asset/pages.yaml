  md: '# Numeric Column Calculation 2/2


    The Cast() function is used here to change the two columns (TotalChildrenNumberAtHome)
    involved in the calculation into a data type of smallint.


    # Syntax


    ```

    ```

    select totalchildren, numberchildrenathome,

    cast (totalchildren as smallint) - cast(numberchildrenathome as smallint)

    as AwayFromHome from DimCustomer

    ```

    ```


    # Result


    | totalchildren | numberchildrenathome | AwayFromHome |

    |---|---|--|

    | 1 | 0 | 2 |

    | 2 | 3 | 0 |

    | 3 | 3 | 0 |

    | 4 | 0 | 0 |

    | 5 | 5 | 0 |

    | 6 | 0 | 0 |

    | 7 | 0 | 0 |

    | 8 | 3 | 0 |

    | 9 | 4 | 0 |

    | 10 | 0 | 0 |

    | 11 | 0 | 0 |

    | 12 | 4 | 0 |

    | 13 | 0 | 2 |

    | 14 | 0 | 2 |

    | 15 | 3 | 3 |

    | 16 | 0 | 0 |

    | 17 | 0 | 0 |

    | 18 | 4 | 4 |


    # Analysis


    If you examine the two columns in the Object Explorer, you will notice both have
    a data type of tinyint. A tinyint only supports positive integers. A tinyint column
    subtracted from a tinyint column will attempt to give the answer (aliased as AwayFromHome)
    as a tinyint. However, the customer on row 83 has a negative number as AwayFromHome—the
    previous query failed exactly at this record. The Cast() function is used to change
    both tinyint columns into smallint ones, and the result will be a smallint. A
    smallint supports negative (as well as positive) integers. Now, the query completes
    successfully. I am not sure how you can have a negative number of children away
    from home (but that''s the data we have to work with)!'
