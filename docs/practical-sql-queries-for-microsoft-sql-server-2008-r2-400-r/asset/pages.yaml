  md: '# Chapter 6: Select: New Tables 147


    # Analysis


    The # prefix to the new table name results in the creation of a new temporary
    table (the ones created in earlier queries are permanent tables). A single # prefix
    means a local temporary table. Before you run the Drop Table statement, it''s
    worth considering a few things. As the table is temporary, it will automatically
    disappear if you close your query editor—so a Drop Table is not required. I used
    Drop Table only to save your query editor window. Also, as it''s a temporary,
    it lives in your tempdb database. You can view it in Object Explorer—open the
    System Databases folder, tempdb, and expand Temporary Tables (you may need to
    right-click and choose Refresh). It''s a local temporary table; it can only be
    seen from the current query editor window. If you were to open a new window, a
    normal Select on the table would fail.


    Try the second Select to verify that the table exists and contains data. Then
    drop the table and try selecting to confirm it has disappeared.

    Temporary tables are often used as work tables or staging tables or test tables.
    Maybe you want to experiment with some SQL, but prefer not to do so on a production
    table.


    # Global Temporary Table


    The new table name in the Select Into query has a ## prefix.


    # Syntax


    ```

    -- global temporary

    select EnglishProductName, ListPrice - DealerPrice as Discount

    into ##NewDimProduct

    from DimProduct

    where ListPrice - DealerPrice is not null

    order by EnglishProductName

    -- test

    select * from ##NewDimProduct

    -- drop

    drop table ##NewDimProduct

    select * from ##NewDimProduct

    ```'
