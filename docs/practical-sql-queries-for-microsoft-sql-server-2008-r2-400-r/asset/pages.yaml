  md: '# Result


    Msg 229, Level 14, State 5, Line 2

    The SELECT permission was denied on the object ''Products'', database ''MyDatabase'',
    schema ''dbo''.


    # Analysis


    On the first try, you can see the table as TestLogin. Your second try should fail.
    In addition to Grant and Revoke, there is also a Deny statement. There is a subtle
    difference between Revoke and Deny—we are not going to cover in this book. However,
    if you have to implement security for real, you will need to understand the difference.
    You are referred to SQL Server Books Online (BOL).

    Here, you have been looking at Select permissions. You can also set permissions
    for Insert, Update, and Delete.


    # Execute Permission


    It''s also possible to allow users to run stored procedures. There are three Execute
    As blocks this time. Run the first one, then the Grant statement. Then, run the
    second one followed by the Deny statement. Finally, run the third Execute As block.


    # Syntax


    ```

    -- test security on stored procedure

    execute as login = ''TestLogin''

    exec ProductsBySupplier ''Adventure Works''

    --

    revert

    --ngrant execute on ProductsBySupplier to TestLogin

    --

    execute as login = ''TestLogin''

    exec ProductsBySupplier ''Adventure Works''

    revert

    --

    deny execute on ProductsBySupplier to TestLogin

    --

    execute as login = ''TestLogin''

    exec ProductsBySupplier ''Adventure Works''

    revert

    ```


    # Result


    Msg 229, Level 14, State 5, Procedure ProductsBySupplier, Line 1

    The EXECUTE permission was denied on the object ''ProductsBySupplier'', database
    ''MyDatabase'', schema ''dbo''.'
