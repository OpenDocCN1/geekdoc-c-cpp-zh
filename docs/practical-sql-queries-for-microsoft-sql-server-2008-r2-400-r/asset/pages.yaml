  md: '# Practical SQL Queries for Microsoft SQL Server 2008 R2


    # Analysis


    We seem to have a problem with something called an identity column. An identity
    column is auto-numbering, SQL Server automatically enters data in the column for
    you. By default, it won''t let you enter your values. When you Select Into to
    create a new table, it will also make a column into an identity if such a column
    exists in the source table. In the original DimScenario table, the ScenarioKey
    is an identity column. Also, the ScenarioKey column in our new Scenario table
    is an identity. Our Insert Into ... Select trying to copy data into this identity
    column, which is why it fails.


    # Insert Into ... Select 2/3


    This time we are only going to insert data into one column.


    # Syntax


    ```

    -- better?

    insert into Scenario

    select ScenarioName from DimScenario

    ```


    # Result


    ```

    {3 row(s) affected}

    ```


    # Analysis


    You should see that three rows are affected. Our Insert Into ... Select has worked.


    # Insert Into ... Select 3/3


    This is even better. You have explicitly listed the destination column as well
    as the source column.


    # Syntax


    ```

    -- even better

    insert into Scenario (ScenarioName)

    select ScenarioName from DimScenario

    --

    select * from Scenario

    ```'
