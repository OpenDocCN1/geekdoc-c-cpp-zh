    More generally, however, the specifics of a change might not be known when a user
    asks for the impacts of modifying a statement or when the slicing task does not
    involve a change (e.g., debugging, information-flow analysis). For such situations,
    we generated SEnSA$^{17}$ a sensitivity-analysis technique and tool for slicing
    quantification and other applications. Sensitivity is used in many fields to determine
    how modifications to some aspect of that system (e.g., an input) affect other
    aspects of that system (e.g., the outputs) [71].


    We designed SEnSA as a generic modifier for programs at locations, such as changes
    or failing points. SEnSA executes a program $P$, a test $T$, and for each case
    $c$ in $T$, SEnSA executes $c$ repeatedly, replaces each value($s$) computed by
    $c$ with a different value, and uses DEA to find which statements were affected
    by these modifications. With this information for all cases in $T$, SEnSA computes
    the sensitivity of each statement $s$ in $P$ to the behavior of $c$ by measuring
    the frequency with which $s$ is affected. These frequencies are the degree of
    dependence on statement $c$ of all statements in $P$, given $T$.


    For a forward static slice from $c$ in program $P$, SEnSA uses $T$ to quantify
    the dependency on $c$ of the statements in slice. For a backward static slice
    from $s$, SEnSA can be used in a similar fashion to quantify the dependency of
    $s$ on selected statements $c$ from that slice.


    SEnSA is highly configurable. In addition to parameters such as the number of
    times to-run each case with a different modification (the default is 20), SEnSA
    lets users choose built-in modification strategies for picking new values for
    $c$ at runtime. Furthermore, users can add their own strategies. SEnSA ensures
    that each new value picked for $c$ is unique, to maximize diversity while minimizing
    bias. When a strategy runs out of possible values for a case, SEnSA stops and
    moves on to the next case. SEnSA offers three modification strategies which the
    user can choose:


    +   1. Random:A random value is picked within a specified range. By default, the
    range covers all elements of the value type *char*, for which only readable characters
    are picked. For some reference types such as *String*, objects with random states
    are picked. For all other reference types, the strategy currently picks null.$18}$


    > 17SEnSA is available for download at http://nd.edu/hcai/sensa/html.


    > 18We are developing a method to instantiate most types with random states.'
