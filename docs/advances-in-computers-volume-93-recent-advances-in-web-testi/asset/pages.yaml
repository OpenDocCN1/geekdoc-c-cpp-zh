  md: 'compared to traditional software, because they involve dynamic code creation
    and interpretation and because they implement a specific interaction mode, based
    on the navigation structure of the web application.


    Researchers have investigated approaches and techniques to automate web testing,
    dealing with the special features of web applications. This chapter contains a
    comprehensive overview of the research carried out in the last 10 years to support
    web testing with automated tools. We categorize the works available in the literature
    according to the specific web testing phase they address. In particular, we consider
    all the works at building a navigation model of the web application under test.
    In fact, such a model is often the starting point for test derivation. Then, we
    consider the problem of input generation, the traversal of a selected navigation
    path that requires appropriate input data are identified and submitted to the
    server during test execution. Metrics are introduced and to assess the adequacy
    of the test cases constructed from the model. The last part of the chapter is
    devoted to very recent advancements in the area, focused on rich client web applications,
    which demand a specific approach to modeling and to test case derivation.


    # 1. INTRODUCTION


    Web applications represent a key, strategic asset of our society. Many of the
    processes that affect our daily lives are mediated by web applications. Nowadays,
    people expect to perform tasks related to their work, money, health, public administration,
    and entertainment on the web. Online banking, e-commerce, e-government, e-health
    are all terms that refer to the vast application domain and the multitude of application
    scenarios that involve web applications. As a consequence, web applications must
    be dependable. Being a critical, strategic asset, their quality and reliability
    must achieve adequate standards.


    While software quality has been investigated for a long time and a huge amount
    of research works and practical tools are available to help developers deliver
    the required quality level for traditional software, the same is not true for
    web applications, the web technology is quite recent, it differs substantially
    from that of traditional software and it is rapidly changing. With traditional
    software, testing is the most prominent approach to ensure that adequate quality
    standards are met. Testing of traditional software usually involves modeling the
    system under test, using the model to generate the test cases and to evaluate
    their adequacy, and defining the oracles that specify whether the behavior observed
    during testing is compliant with the one expected by the end user. With web applications
    the key phases of testing remain the same, but the reference model and the related
    adequacy criteria differ substantially.'
