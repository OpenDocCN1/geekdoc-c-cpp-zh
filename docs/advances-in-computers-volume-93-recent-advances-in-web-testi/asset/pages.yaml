    SECEMDD seems to be a promising approach: when it was first proposed in 2009,
    only small-sized proof-of-concept case studies were addressed (e.g. the Monde
    protocol for electronic payment [77]). It then evolved towards a medium-sized
    case study, the copy card application [80], where more advanced application-specific
    security properties were handled. As a last step, the authors were capable of
    handling an industrial scale project, the German electronic health card application
    [76]. These results were obtained in a relatively short time (from 2009 to 2012).


    # 5. DISCUSSION


    This section synthesizes our evaluation in a comparison table, and discusses open
    issues and current challenges in MDS.


    # 5.1 Evaluation Synthesis


    We re-visit now the MDS approaches we evaluated in Section 4 to extract a synthesis
    regarding our taxonomy of Section 3.2. These considerations are summarized in
    Table 2, where column corresponds to a taxonomy entry and each row to one of the
    MDS approaches we selected.


    **Application Domains** Most of the evaluated approaches are designed to be “general
    purpose”, i.e. their objective is to address a large range of application domains.
    One exception is SECEMDD which only focuses on supporting the development of smart
    card and service applications.


    **Security Concerns** Only SECUREML concentrates on one concern, i.e. access control.
    The SECEMDD approach mainly deals with cryptographic protocols but also targets
    application-specific security properties. The other approaches, i.e. UMLSEC, TECT,
    and MODELSEC are open to multiple security concerns.


    **Modeling Paradigm** All approaches combine the model-driven architecture with
    domain-specific modeling paradigm. One exception is UMLSEC, which applies the
    multi-paradigm modeling paradigm (MPM). This is do since different views of a
    UMLSEC system are modeled by different UML diagrams and finally all views are
    composed to form the complete specification of the system. However, no platform
