    # ABOUT THE AUTHORS


    Dr. Levi Lácio currently a Research Associate with the Modeling, Simulation and
    Design Laboratory of McGill University. He received his PhD. from the University
    of Geneva, Switzerland, 2008. His research is about bridging software engineering
    and formal techniques. Some of his concrete areas of interest are model-driven
    development, model transformation languages, the verification of model transformations,
    correctness-by-construction, models of concurrency (in particular Algebraic Petri
    Nets), model evolution, model-based testing and control. Together with several
    PhD students he is currently developing a suite of techniques and tools for the
    verification of model transformations for the automotive industry.


    Qin Zhang is a technical engineer at the University of Luxembourg. He received
    his B.Sc. at Harbin Institute of Technology (HIT), China in 2007. He was at University
    of Aizu, dual-degree scholarship from 2007 to 2010 and received an M.Sc. of Aizu,
    Japan, and an M.Eng. at Harbin Institute of Technology, China in 2010. He is currently
    working as a technical engineer at the Security, Reliability and Trust Research
    Centre (SnT) of University of Luxembourg. His interests are Model-Driven Engineering,
    specifically on Model-Driven software and Model Welding.


    Ph H. Nguyen, Ph.D. student, received his BS at Hanoi University of Science and
    Technology (HOST) - Vietnam, 2006. From 2008 to 2010, he had been receiving the
    Huy Talent Scholarship awarded by the Minister for Education, Culture and Science
    of the Netherlands, to study the Master Program in Computer Science & Engineering
    at Eindhoven University of Technology (TU/e). Currently, he is a PhD candidate
    at the Security, Reliability and Trust Research Centre (SnT), University of Luxembourg.
    His research project is Model-Driven Software Engineering (MDSE) for the development
    of secure systems. This involves developing/applying MDSE techniques in secure
    systems designs and development. His interest spans Model-Driven Engineering,
    Model-Based Security Testing, Quality Assessment of Model Transformations, Modularity
    and Dynamic Adaptation, and Software Evolution.'
