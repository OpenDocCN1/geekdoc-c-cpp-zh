    draw any statistically significant conclusions about this finding. Let us take
    a look at what elements of MCDA methods, in particular, might potentially lead
    to better performance of SQA methods that adapted MCDA.


    For example, with respect to software quality benchmarks (R10), the MCDA methods
    that are designed for the purpose of ranking (γ) or sorting (β) decision alternatives
    naturally support this requirement. The methods designed for ranking purposes
    directly rank-order alternative software products regarding their quality level.
    The sorting methods can be easily adapted for benchmarking purposes by the predefined
    classes for which alternative products are sorted can be rank-ordered regarding
    the quality level. Normally, the sorting purpose is preferred as quality classes
    can be defined on a ratio or interval scale, thus allow for evaluating how much
    the quality of alternative software differs. Ranking methods solely allow concluding
    that one product is better than another, but not by'
