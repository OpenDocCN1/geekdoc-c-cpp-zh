    # 5.2 Model Mining


    From the collected execution traces, ReAjax and Crawlax mine a model of the user-interface.
    Two types of models are mined by the following:


    **[Finite state machine (FSM)]** ReAjax infers a FSM in which each state of the
    machine represents a DOM state (instance) of the userinterface, while each transition
    of the machine represents the execution of the events/callbacks that change the
    DOM state. To avoid the state explosion problem (i.e., the uncontrolled increase
    of the FSM size), ReAjax considers only the callbacks that actually change the
    DOM and it abstracts the concrete DOM states by means of a *abstraction function*.
    An abstraction function is a function that groups sets of concrete DOM states
    into abstract (high-level) states. Since the number of possible DOM states is
    often huge and unbounded, it is practically impossible to represent them in a
    FSM model. ReAjax introduces a high-level set of abstract states, representing
    such concrete states after applying a given abstraction function, such as the
