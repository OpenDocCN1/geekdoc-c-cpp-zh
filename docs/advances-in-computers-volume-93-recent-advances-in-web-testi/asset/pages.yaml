    # ## 8.3 Dynamic Quantification


    Given a representative test suite, we can quantify slices via differential execution
    analysis [79] and sensitivity analysis [71].


    # ### 8.3.1 Differential Execution Analysis (DEA)


    Differential execution analysis (DEA) is designed specifically for forward slicing
    from changes to identify the semantic dependencies [55] of statements on changes.
    Semantic dependencies tell which statements are truly affected by which statements
    or changes. Although finding dependencies is an undecidable problem, DEA detects
    dependencies on changes when they occur at runtime to under-approx the set of
    semantic dependencies in the program. Therefore, DEA does not guarantee 100% recall
    of the suite but is much better than when dynamic slicing normally achieves [45,
    79].


    DEA works by executing a program before and after the change, collecting the augmented
    execution history [79] of each execution, and then comparing both histories. The
    execution history of a program for an input is the sequence of statements executed
    for that input. The augmented execution history is the execution history annotated
    with the values read and written by each statement execution. The differences
    between two histories reveal which statements had their occurrences or values
    altered by a change—the conditions for semantic dependence. A formal definition
    of DEA is given in [79].


    # ### 8.3.2 Sensitivity Analysis


    DEA can be used to quantify static forwards when the change is known—for post-change
    impact analysis. To do this, a DEA-based q-slicing technique can execute the program
    repeatedly with and without the change for many inputs and find, for each statement,
    the frequency with which representative of the program’s change. If the inputs
    are sufficiently representative of the program’s'
