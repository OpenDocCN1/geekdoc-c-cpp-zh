    \ the smallest of alternatives that satisfy the criteria at the best possible\
    \ level (optimal set). The set could be a one-element set and may contain non-comparable\
    \ \"best\" alternatives.\n\n+   - Sorting ($\beta$): For a predefined set of categories,\
    \ the sorting methods assign each considered alternative to one. The categories\
    \ do not have to be ordered, but the domain knowledge should enforce different\
    \ treatments for each predefined category. Example categories might be \"definitely\
    \ acceptable\", \"possibly acceptable but needing more information\", and \"definitely\
    \ unacceptable\n\n+   - Ranking ($\\gamma$): As a result, a complete or partial\
    \ order over the alternatives are expected. This order may further be used as\
    \ an instrument for comparing alternatives.\n\n+   - Description ($\\delta$):\
    \ Aims at identification of the major distinguishing features of the alternatives\
    \ and at alternatives based on these features.\n\n+   - Conceptualization: Aims\
    \ at identifying ideal or quasi-ideal alternatives available at the moment and\
    \ possibly perceiving new alternatives.\n\nIn the context of SQA, problématique\
