  md: '# Adapting Multi-Criterion Decision Analysis for Assessing the Quality of Software
    Products


    This selection may lead to a situation in which the results of SQA not reflect
    reality and cannot be trusted. The methods that received the best scores in our
    evaluation (VC-DRSA, UTA-DIS,MACBETH) were not used for SQA in the analyzed primary
    studies. These methods allow reducing the dimensionality of the problem, and allow
    viewing the intermediate decision and incorporating decisions in subhierarchies.
    In contrast to the analyzed MCDA methods, the MCDA methods are frequently supported
    by a software tool, which is usually free. A software tool could be a determinant
    in regarded of a certain MCDA method, as many MCDA methods are as difficult to
    comprehend. There exist weaknesses of MCDA methods that require improvement. None
    of the analyzed MCDA methods can be treated as a substitute for an existing SQA
    method. The SQA method that performed best in the evaluation was not outperformed
    by any single MCDA method.


    For now, the most important thing is to make conscious decisions about the usage
    of MCDA methods to ensure the benefits and consequences of their applications
    are explicit and understood. Using the list of requirements and criteria we proposed
    could be the first step for this purpose. Improvement of the existing methods
    should be the goal of future research, to allow supporting the SQA methods by
    MCDA methods and to provide reliable results. We strongly believe that combining
    these two domains lead to the development of methods fully satisfying the requirements
    defined for SQA. The first step may be to share knowledge, information, and expertise
    between the two research communities through the use of the MCDA for SQA platform.


