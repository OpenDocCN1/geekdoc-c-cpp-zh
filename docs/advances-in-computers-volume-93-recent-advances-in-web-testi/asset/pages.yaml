  md: "Non-Compensatory Approaches: Although compensatory decision making seems to\
    \ be very rational, reality humans do not follow it because collecting and comparing\
    \ all of the necessary data is labor intensive. In particular, people (1) do not\
    \ collect the relevant information systematically, (2) fail to collect the relative\
    \ importance of various attributes, or (3) do not trade off the benefits of some\
    \ criteria (attributes) against the deficits of others. Therefore, in everyday\
    \ practice non-compensatory decision making is typically used instead. In non-compensatory\
    \ decision making, negative and positive criteria do not compensate each other.\
    \ There are two basic types of non-compensatory approaches:\n\n+   - Alternative-based:\
    \ Considers one alternative at a time with respect to multiple criteria:\n   \
    \ - Conjunctive: Selects alternatives that meet a minimum level regarding evaluative\
    \ criterion, i.e., accepts an alternative if it passes the minimum acceptable\
    \ value on all criteria.\n    - Disjunctive: Selects alternatives that meet a\
    \ satisfactory level regarding each relevant evaluative criterion, i.e., accepts\
    \ alternative if it passes the minimum acceptable value on any criterion.\n\n\
    +   - Criterion-based: Considers one attribute at a time across several alternatives:\n\
    \    - Lexographic: Ranks attributes by importance and selects the bestperforming\
    \ alternative on the most important attribute, i.e., ranks alternatives on all\
    \ criteria and selects the one that has the highest rank on the most important\
    \ criteria. If there is a tie (more than one brand is best), it performs the comparison\
    \ again on the next important attribute.\n    - Sequential elimination: Ranks\
    \ attributes and sets minimum levels for each attribute. It selects alternatives\
    \ that are acceptable (better than minimum) on the most important attribute. If\
    \ there is a tie, it moves to the next most important attribute and does on until\
    \ one alternative is selected.\n\n+   - Partially compensatory: Some kind of compensation\
    \ is accepted between the different dimensions or criteria.\n\nAlternative-based\
    \ approaches typically select a set of multiple alternatives, whereas criterion-based\
    \ approaches typically select one best alternative. Therefore, it is useful to\
    \ first form a \"consideration set\" using an alternative-based (conjunctive/disjunctive)\
    \ approach, and then to apply a criterion-based approach to select the (best)\
    \ final alternative."
