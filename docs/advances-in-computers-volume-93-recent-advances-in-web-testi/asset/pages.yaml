    unlike instrumentation.


    Another significant advantage of this tool extension is that only common hardware
    mechanisms are needed to be available and accessible to the device. More advanced
    mechanisms such as the LBR and BTS are available only on a small range of processor
    types, and the support for these mechanisms is lacking at the kernel and user
    tool levels. Instead, the authors take advantage of the CPU_CYCLES hardware counter,
    which is available on nearly every tablet, smartphone, and commodity computer.


    # Challenges of Statement Monitoring


    The first challenge of this work is selecting a hardware mechanism for use sampling.
    Again, there are a wide-range of hardware mechanisms to choose from, and many
    of these are supported for sampling use at user and kernel levels. The goal is
    to select a mechanism that is widely available on many different types of devices.
    When using these simpler mechanisms, the time overhead of use is only dependent
    on the number of samples taken; each mechanism is accessed and information is
    recorded in the same way for all.


    Therefore, in branch testing, there is again the challenge of balancing the efficiency
    and effectiveness of the hardware tool. When using software-level instrumentation
    for statement coverage, probes and payloads are added for counting each time individual
    lines are executed during the program. Additionally, instrumentation code is inserted
    for each branch of the program, where branch instrumentation records how frequently
    different paths are taken through “if” statements and other conditionals. When
    sampling-ing instructions using hardware mechanisms, any statement that is executed
    may be observed, although recording can be tied to particular processes if desired.


    A third challenge comes from the requirement that the source code must not be
    modified. This requirement is advantageous because execution information can be
    determined for any executing program without the need of recompilation. By not
    modifying the code, TheME loses its capability of starting and monitoring when
    code that does not correspond to our program source code, as setup and teardown
    code, is executing. This will result in higher time overheads when executing the
    tests. However, current testing tools [2, 5, 26] can only achieve instrumentation,
    of unmodified code through the use of dynamic instrumentation, which is often
    significantly more expensive in terms of time and memory than static instrumentation.'
