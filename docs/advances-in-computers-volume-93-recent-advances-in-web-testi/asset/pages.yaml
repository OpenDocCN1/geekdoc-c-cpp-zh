  md: '# 4.3.2 Statement Coverage via Hardware Monitoring


    Similar to branch coverage, statement coverage is also frequently used to measure
    the quality of a test suite. Statement coverage measures the percentage of executed
    statements to the total number of statements in the application test [67]. A high
    level of statement coverage is correlated with fault-finding capability, although
    it is recognized that statement coverage alone may not be a strong indicator of
    software quality. This is because statement coverage produces very different results
    depending on how the source code is formatted [1]. For example, in the code shown
    below, statement coverage would be 33%.


    ```

    1 int main()

    2 {

    3   HIT if (true) return 1;

    4   MIS foo();

    5   MIS return 0;

    6 }

    ```


    However, if the code is reformatted, as shown below, statement coverage would
    be 66%.


    ```

    1 int main()

    2 {

    3   HIT if (true)

    4   HIT return 1;

    5   MIS foo(); return 0;

    6 }

    ```


    Despite these disadvantages, for test quality [15, 68–71]. Different standards
    require achieving high levels of statement coverage. For example, avion industry
    standard DO-254 demands that 100% statement coverage be achieved. Avionics industry
    DO-178B and automotive industry standard IEC 61508 detail similar requirements.


    Walcott-Justice [11] extended to execute tests while monitoring statement coverage.
    The additional requirement was made that the source code cannot be modified in
    any way prior to execution. Therefore, the technique uses only hardware mechanisms
    to monitor execution while requiring no code growth, recompilation, or compiler
    analysis tools.


    The experimental results show that up to 79% of the statement coverage reported
    by instrumentation can be reported with less time overhead. Additionally, because
    THeME does not require'
