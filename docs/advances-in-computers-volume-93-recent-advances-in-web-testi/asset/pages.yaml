    # 3.1 Fault Propagation Models


    A number of researchers have worked on theoretical aspects of fault propagation
    for fault-based testing. Fault-based testing [19, 26] restricts testing to a class
    of faults and tests the software for the absence of faults of that particular
    kind. Typically, the faults considered are simple transformations of code at specific
    locations. There are two main assumptions that justify this testing approach:
    the competent programmer hypothesis [19], which states that developers create
    programs that are syntactically correct, and the coupling effect [19], which states
    that data reveals simple faults are also sensitive enough to uncover more complex
    faults. The theoretical work on fault-based testing described in this section
    can be naturally applied to changes. Changes, like faults, can be seen as code
    transformations; the only difference between changes and faults is that the location
    and semantics of changes are always known.


    Morell [47] developed a theory to understand and systematize fault-based testing.
    Fault-based restricts testing to a class of faults and tests the software for
    the absence of these. Morell''s theory provides a framework where classes of faults
    are specified as transformations (alternative expressions) in the code and establishes
    as the goal of testing the selection of input data that differentiate all alternative
    programs produced by those transformations from the original program. To achieve
    this goal, Morell proposed symbolic testing, in which transformations are symbolic
    (i.e., they represent infinitely alternatives), the original program and its alternatives
    are represented as symbolic functions of the input, and the condition for test
    inputs to distinguish although from the original program is expressed as a propagation
    assertion in which the symbolic functions are required to differ. Although symbolically
    evaluating complete programs is impractical, Morell''s makes symbolic testing
    an ideal formalism for developing and analyzing less, approximate approaches.


    Richardson and Thompson [65] proposed the RELAY model of fault detection, which
    refines Morell''s theory by describing in detail the steps involved in the execution
    and propagation of a fault to cause an avoidable failure. These steps include
    the origination of a potential failure (i.e., an erroneous state) when executing
    a faulty component, the computational transfer of this failure to the containing
    expression, and the transfer from computation to computation of faulty states
    via information flows (i.e., chains of control and data dependencies) until a
    failure is revealed to an external'
