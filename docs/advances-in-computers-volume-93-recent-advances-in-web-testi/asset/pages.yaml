    # 1.2 Research Objectives and Scope


    The objective of our study was to evaluate existing MCDA methods focusing on their
    applicability for the purpose of SQA. We decided to evaluate the MCDA methods
    from the point of view of a quality assurance engineer working in a software development
    organization whose task is to develop a method for his organization and who has
    access to the appropriate literature (e.g., journal and conference articles, books).
    In order to achieve this objective:


    +   * We first reviewed studies regarding SQA and defined the criteria for our
    assessment to answer the question:

    * RQ1: What are the requirements regarding software quality assessment methods?
    Then we analyzed the MCDA literature and extended our criteria by the factors
    being taken into account when selecting an MCDA to support decision making:

    * RQ3: What are the most relevant criteria for selecting an MCDA method for: (A)
    any purpose? (B) the purpose of SE? (C) the purpose of SQA?

    * Then we examined the studies already applying MCDA methods for SQA, to find
    out:

    * RQ4: How do SQA methods benefit from MCDA methods?

    * We identified the objects for our evaluation by determining the most popular
    MCDA methods:

    * RQ2: What are the most popular MCDA methods?

    * Finally, we conducted the evaluation and answered the final question:

    * RQ5: To what extent are MCDA methods suitable for SQA?


    # 1.3 Structure of the Chapter


    This chapter is structured as follows: In Section 2, we introduce the basic concepts
    of software quality assessment and multi-criteria decision support, and present
    the analogies between them. Section 3 presents the design of our study. We summarize
    the results of the first part of our study by a review of the existing SQA methods
    in Section 4. Then, in Section 5 we assess the most popular MCDA methods with
    respect to their applicability for the purpose of SQA. Section 6 summarizes the
    results of the study and draws the most relevant conclusions, including directions
    for future work on improving SQA.'
