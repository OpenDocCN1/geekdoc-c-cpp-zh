    # 6. RELATED WORK


    Despite more a decade of existence, there is only one survey [57] and two systematic
    reviews [46, 88] on the subject of MDS.


    Kasal et al. [57] share with our work a taxonomy for evaluating model-based security
    engineering which directly inspires our. Several taxonomy entries are common,
    for example their paradigm, verification, and security mechanisms correspond respectively
    to our modeling approach, verification, and security concerns. From the MDE orientation,
    the fact that we consider modeling approach with the possible use of DSLs already
    covers some of their entries (namely, granularity, and executability). Their work
    only reviews four approaches: UMLSEC [51], Secure Software Architecture [104],
    a Model-Based Aspect-Oriented Framework [105] and AVISA [9]— push-button tool
    for validating Internet security protocols. The authors also include, at the same
    level, tools aimed at general-purpose analysis: SMV (System Model Verifier),³a
    LTL/CTL general-purpose model-checker, and Alloy—a SAT-based solver for relational
    specifications [44]. Neither can be considered as an MDS approach according to
    our definition.


    The systematic review conducted by Jensen and Jaatun [46] is clearly oriented
    toward code generation. We also cover three out of five of the approaches they.
    However, the authors have not provided the MDS approach selection criteria. Furthermore,
    as an inherent limitation of a systematic review, their work does not use a systematic
    evaluation scheme (such as the taxonomy defined in our work) such that the evaluation
    result is less detailed when compared ours.


    Nguyen et al. [88] proposed a systematic literature review targeting specifically
    MDS approaches. Their selection process retained 80 papers of more than 10 thousands
    papers. This review also succinctly describes five approaches, all evaluated in
    this chapter. This paper describes statistical results on several dimensions (the
    application domains, the level of automation when reaching executable code for
