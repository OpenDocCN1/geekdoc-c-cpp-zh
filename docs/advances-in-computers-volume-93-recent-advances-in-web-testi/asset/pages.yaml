    # 3.3 Regression Testing and Test-Suite Aug


    Regression testing is an important form of software testing that consists of re-testing
    software after it is modified [8, 11, 22, 25, 28, 29, 36, 38, 42, 48, 51, 67,
    70, 93] to look for any regressions (i.e., program behaviors that stop working
    correctly) introduced by changes. Typically, an existing suite is reused to perform
    regression testing. Also, because changes might introduce new features or exhibit
    side effects, new test cases might be needed. Therefore, as a complement to regression
    testing, developers need to perform what is called test-suite augmentation [6,
    73], a process that assesses the existing test-suite and adds new test cases as
    needed.'
