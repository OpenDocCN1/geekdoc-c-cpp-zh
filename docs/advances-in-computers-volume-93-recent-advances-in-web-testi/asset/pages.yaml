  md: '# Change-Effects Analysis for Evolving Software


    has more than one outgoing call edge $E_{inter}$ is treated as a branching node
    and each call edge from that node is labeled with the signature of the target
    procedure. Also, procedures might terminate abnormally by halting or throwing
    an exception, which creates special dependencies [83]. These and any other kinds
    of control flow are represented by CFGs and ICFGs.


    Not all paths in the ICFG of a program correspond to paths in that program—only
    realizable paths do.


    **Definition 3.** *A realizable path in the ICFG of a program is a path for which
    every call edge $(c, E_p)$ is matched by its corresponding return edge $(EX_p,
    r)$.*


    Henceforth, we use the term *path* to refer only to realizable paths in ICFGs.
    Two other necessary control-flow concepts are dominance and post-dominance.


    **Definition 4.** A node $n$ in a CFG or ICFG $G$ dominates a node $n$ in $G$
    if and only every path from every node of $G$ to $n$ contains $m$.


    **Definition 5.** A node $m$ in a CFG or ICFG $G$ *post-dominates* a node $n$
    in $G$ if and only every path from $n$ to every exit node of $G$ contains $m$.


    # 2.2 Program Dependencies


    The control decisions and the manipulation of variables in the statements of a
    program give rise to dependencies among those statements. If a statement $s_1$
    is dependent on a statement $s_2$, we also say that a node $m_1$ for $s_1$ in
    a CFG or ICFG $G$ is dependent on a node $n_2$ in $G$. Dependencies created by
    control decisions are *control dependencies* [21].


    **Definition 6.** A statement $s_1$ is *control-dependent* on a statement $s_2$
    with label $L$ if $s_2$ has a successor $u$ (along an edge labeled $L$) and a
    successor $v$ that $s_1$ post-dominates $u$ but $s_1$ does not post-dominates
    $v$.


    In other words, a statement $s_1$ is control dependent on a statement $s_2$ if
    $s_2$ has two or more outgoing edges, and for at least one not those edges, $s_1$
    necessarily executes after taking that edge. If so, control (execution) of $s_1$
    depends on the decision at $s_2$.


    A control dependency can be written as $(x, y)$ or $(x, y, L)$ (the latter form
    if the decision matters), where $y$ is control dependent on $x$ for decision $L$.
