    # 4.3.3 THeME for Smartphones and Tablets


    The execution and evaluation of test cases is ideally performed within the environment
    in which the final application will execute. When developing applications for
    memory-constrained devices such as modern tablets and smartphones, however, tests
    are generally only executed using an emulator. Emulators tend to be much slower
    than the device itself, and they cannot accurately copy all conditions under which
    applications may run.


    The process of executing test cases on the device itself is difficult. In the
    past year, attempts have been made by automating the testing process [72]. However,
    no research has been done regarding test case evaluation on execution. Static
    instrumentation tools could potentially be ported to execute on the devices, but
    the memory overhead and code growth that they will likely stress the system and
    reduce the ability to fully and accurately execute tests. For example, tests such
    as those described in [73], would be severely limited if execution itself increases
    memory overhead. Dynamic instrumentation tools would likely suffer the same issues.
    Additionally, because dynamic instrumentation techniques generate instrument code
    during execution, they cannot simply be ported over for new systems.'
