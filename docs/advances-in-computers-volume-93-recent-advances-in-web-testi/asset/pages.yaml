    The cart management functionality of our running example might be implemented
    using rich client technologies, such as Ajax. Technically, this means that whenever
    a book is added to or removed from the cart, a client side script (e.g., written
    in Javascript) will be executed, so as to modify the Document Object Model (DOM)
    of the web page. This results in the web page being updated to the new state of
    the cart. However, this is achieved without requesting a new web page from the
    browser. Notification of the cart update is inserted carried out asynchronously
    using the Ajax client-server asynchronous communication facilities.


    Since no transition from a page to another page occurs when a rich client modifies
    the DOM, the navigation model for a rich client web application will not be enough
    to thoroughly test it. In our running example, changing the state of the cart
    does not correspond to any navigation path in the navigation graph, since edges
    in graph are exclusively associated with page requests to the server and HTML
    response pages provided by the server to the browser. As a consequence, to test
    the cart management functionality a different modeling approach must be taken.
    Instead of focusing on the navigation graph, in the case of a rich client web
    application, the modeling focus shall be on the DOM state. Events that the DOM
    state will be transitions in the rich client model.


    A model for the Ajax cart management may consist of a set of sets, each characterized
    by the number of items in the cart (e.g., 0 items, 1 items). GUI events that trigger
    DOM changes (e.g., addToCart and remove-FromCart events) are modeled as transitions
    between states. Testing the functionalities can be turned into the problem of
    exercising the event sequences in the rich client model of the cart functionality.
    In this way, relevant behaviors of this functionality, that would go unnoticed
    in the navigation graph, are exercised during testing.


    # 1.2 Key Problems in Web Testing


    Based on the example described above, we can categorize the key problems associated
    with web testing as follows:


    +   [Model construction] A navigation graph of the application under test must
    be constructed, so as to ensure that all relevant navigation paths are exercised
    during testing.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '[Input generation] Once a test scenario has been derived from the navigation
    model of the web application, concrete input values must be supplied to make it
    an actually executable test case.


    [Metrics] Adequacy metrics are computed to determine if the set of test cases
    produced so far provides enough coverage of the web application model or if additional
    tests must be produced. Metrics are also useful to characterize the part of a
    web application that are more difficult to be explored by automated tools, hence
    requiring manual intervention during testing (these are called crawlability metrics).


    [Rich client] When scripts run on the client modify the DOM directly and communicate
    asynchronously with the server, the navigation graph is no longer appropriate
    as a model for test case derivation and a different model, representing the DOM
    states and transitions, should be adopted.


    # 1 Structure of the Chapter


    This chapter completes a previously published chapter on the same topic [17].
    We share with the previous publication [17] the same high level view of the testing
    process, consisting of: (1) model construction; (2) test case generation from
    the model; (3) adequacy metrics and criteria, to decide on the thoroughness of
    testing. However, we analyze in depth a complementary set of problems; while the
    previous work [17] we consider the problems of modeling notations (including statistical
    Markov models, object-oriented models and regular expressions) and portability
    analysis, we consider the problems of automated model construction, automated
    input generation and metrics. Moreover, we include also recent works on modeling
    and testing of rich client applications.


    The rest of this chapter is organized along the four problems identified above.
    Specifically, Section 2 presents the most approaches for model construction; Section
    3 describes the most important input generation techniques; Section 4 deals with
    metrics; Section 5 provides details on how to model client applications and how
    to test them.


    # 2. MODEL CONSTRUCTION


    In web testing, a model-based approach is often adopted to derive navigation sequences
    that are successively turned into executable test cases [2, 16, 15, 40, 41, 46].
    Hence, the problem is how to define a web application model and how to construct
    it. Since the focus is on navigation sequences, a'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'web model can be abstractly regarded as a navigation graph, whose paths correspond
    to the various possible navigation sequences. While such a graph is the backbone
    of almost all proposed test models for web applications, we can distinguish two
    major families of models adopted for testing:


    +   - **UML models** These models extend Conallen''s UML model [11] with test-specific
    information.


    +   - **FSM models** These models adopt a finite state machine-based approach,
    which incorporates states, transitions and guards.


    Both types of models are based on the same underlying navigation graph, it is
    possible to define a mapping between them, with limited loss of information.

    The problem of constructing a web application model to be used during testing
    can be approached manually, automatically, or semi-automatically. Automated or
    semi-automated model construction can be viewed as a reverse engineering problem.
    Based on static and dynamic information collected for the web application to be
    modeled, a model is synthesized, sometimes with the help of the tester or requiring
    the tester to perform some post-construction refinement.


    Static analysis is not adequate for the reverse engineering of web application
    models. In fact, the information available is severely limited and incomplete.
    Dynamically generated pages are obtained by concatenating HTML fragments with
    additional content which is put at run time, depending on the user input. This
    means that the actual HTML code of a web page is not known entirely until the
    web page is actively navigated at run time. (e.g., Javascript code), which are
    synthesized dynamically at the server side and which might affect the web page
    structure at run time. Moreover, the web page may include client side scripts
    as client scripts have access to the Document Object Model (DOM) of the web page
    in read and write mode. This means at runtime the structure of a web page may
    change due to client script execution. Additional dynamism may come from late
    binding to external services invoked by the web application and by dynamic component
    loading on the server side. Reflection on the server side may introduce further
    dynamism. For all these reasons, all approaches for the reverse engineering of
    a web model take advantage of static and dynamic information [3, 40, 41, 46].


    Each static or dynamically constructed web page is a node in the navigation graph
    of the web application. In UML models this is represented as a class in the class
    diagram. In FSM models it is a state. Whatever is the representation, a common
    problem is that during web navigation'
  merge: -1
  pgno: 13
- img_proc: true
  md: '(i.e., dynamic analysis), pages that have different structure and content may
    indeed represent the same logical page in the model. For instance, the page that
    shows the information of a particular web application user will be different from
    that shown for another user. However, such pages should not be treated as different
    nodes of the model. They are in fact the same logical page. The problem of identifying
    Logical Web Pages (LWP) from the actually navigated pages is a key problem in
    model construction for web applications and different authors have come out with
    different solutions to the problem.


    In the following, we describe the UML models and the FSM models that have been
    proposed in the context of model construction for testing. Then, we analyze in
    depth the LWP identification problem.


    # 2.1 UML Models


    Figure 1 shows an excerpt of the UML meta-model that defines Conallen''s UML notation
    for web application models. A static HTML page is a class to which the <<ClientPage>
    stereotype of the UML meta-model applies. Hyperlinks between pages are modeled
    as <<Link> associations. A page may contain forms, to collect user input to be
    submitted to the server. The <<Form> stereotype can be stereotyped to the classes
    to represent the HTML forms. Attributes of <<Form> classes are stereotyped as
    <<InputElement>, <<SelectElement> and <<TextAreaElement>, depending on the kind
    of input that is collected from the user (respectively, a single text field, a
    selection among multiple constant values or a multi-line text field). The server
    script that is executed upon form submission is stereotyped as <<ServerPage>.
