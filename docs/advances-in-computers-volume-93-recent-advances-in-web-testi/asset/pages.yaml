  md: '# 94

    Kristen R. Walcott-Justice


    There are also a number of promising opportunities to advance hardware performance
    monitoring at the hardware, kernel, and software levels that could further improve
    access schemes in terms of efficiency. One technique would be to eliminate OS
    sheltering. In current systems, the kernel is required to shepherd all functions
    related to configuring, accessing, and reading hardware mechanisms. Requiring
    the operating system''s involvement in all of these functions at a cost that is
    significantly higher than necessary. At the lowest level, completion of these
    operations requires either reading or writing registers on the processor core,
    which is highly efficient by nature. However, when each operation is performed
    by the operating system, there are a number of added sources of overhead. These
    include an added system call to enter the privileged kernel, the saving of context
    by spilling user-level state to memory, and restoring this state when execution
    is returned to the user-level application.


    For many of the traditional applications that use hardware monitoring, this kernel-level
    usage is sufficient. Generally, hardware counters and mechanisms are only set
    up and down during the beginning and end of an application''s execution. Often,
    the monitored counter is left to increment until the end of the application''s
    execution, at which point, it is read. Thus, kernel involvement is required only
    twice. In other monitoring techniques, hardware mechanisms can be accessed and
    read infrequently during program execution [32, 80]. However, because test coverage
    analysis requires more frequent monitoring, requiring OS involvement on each sample
    affects the time of overhead. Allowing counters to be accessed directly from user
    mode, would result in a significant reduction in the cost of accessing the hardware
    mechanisms [35].


    There are two ways to achieve user control of hardware mechanisms. One requires
    hardware modification, while the other can be to allow the operating system to
    control the access permissions of hardware mechanisms directly by adding a simple
    register that can be used to specify execution modes that have direct access.
    While the overhead in the chip''s die area to support this added permissions would
    be negligible, hardware modification would be required. The second approach is
    to have the kernel not set the mode of the processor back to user mode when execution
    returns to the point of interest. This technique would only require modifying
    the OS code, but it would result in a security hole that can be exploited by malicious
    programs.


    Another opportunity to improve hardware monitoring efficiency is to enable what
    we call satellite monitoring [13]. Currently, hardware monitoring'
  merge: -1
