  md: '# PREFACE


    This volume of Advances in Computers is the 93rd in this series. This series,
    which has been continuously published since 1960, presents in each volume four
    to seven chapters describing new developments in software, hardware, or uses of
    computers.


    Even though software has been around for a number of decades, its quality continues
    to elude computer engineers and scientists alike. This is largely due to the multi-faceted
    nature of software quality. Consider, for example, web applications that have
    become pervasive in the last two decades. They have needed new techniques to assess
    their quality because they involve dynamic code creation and interpretation. Moreover,
    as software assurance imposes prohibitive performance overhead that has prompted
    the need for new, more efficient solutions. As software interconnectivity has
    become a dominant aspect of its quality, requiring novel techniques. Finally,
    as software changes throughout its lifetime, quality assurance approaches need
    to adapt with change. In this volume, we touch upon all these issues.


    This volume is a compilation of a set of five chapters that study issues of software
    quality, security, and evolution. The authors of these chapters are world leaders
    in their fields of expertise. Together these chapters provide a view into the
    state-of-the-art in their respective fields of expertise.


    Chapter 1, entitled “Recent Advances in Web Testing”, provides a comprehensive
    overview of the research carried out in the last ten years to support web testing
    with automated tools. The chapter categorize the works available in the literature
    according to the specific web testing phase that they address. In particular,
    first considers the works aimed at building a navigation model of the web application
    under test. Such a model is often the starting point for test case derivation.
    Then, considers the problem of input generation, because the traversal of a selected
    navigation path requires that appropriate input data be identified and submitted
    to the server during test execution. Metrics are introduced and used to assess
    the adequacy of the test cases constructed from the model. The last part of the
    chapter is devoted to very recent advancements in the area, focused on rich client
    web applications, which demand a specific approach to modeling and to test case
    derivation.'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'Chapter 2, entitled “Exploiting Hardware Monitoring in Software Engineering,”
    discusses advances in program monitoring, a key component of many software engineering
    tasks. Traditionally, instrumentation has been used to complete such tasks. However,
    instrumentation can prohibitively increase the time and expense the memory overhead
    of an application. As an alternative to instrumentation, hardware monitoring has
    been shown to aid in developing more efficient techniques. The chapter examines
    efforts in applying hardware monitoring to a number of software engineering tasks
    including profiling, dynamic optimization, and software testing. It presents imments
    in using instrumentation for monitoring, how hardware mechanisms can provide an
    alternative, and the success that has been revealed in software engineering research
    when applying hardware monitoring approaches.


    Sound methodologies for constructing software-critical systems are extremely important
    in order to confront the increasingly varied security threats. As a response to
    this need, Model-Driven Engineering approach for supporting the development of
    security-critical systems. Chapter 3, entitled “Advances in Model-Driven Security”
    summarizes the most important developments of Model-Driven Security during the
    past decade. The chapter starts by building a taxonomy of the most important concepts
    of this domain, which it uses to describe and evaluate a set of representative
    and influential Model-Driven Security approaches in the literature. The chapter
    focuses on the concepts shared by Model-Driven Engineering and Model-Driven Security,
    allowing the identification of the advantages, disadvantages, and open issues
    when applying Model-Driven Engineering to the Information Security domain.


    Chapter 4 is entitled “Adapting Multi-Criteria Decision Analysis for Assessing
    the Quality of Software Products. Current Approaches and Future Perspectives.”
    Our great reliance on software-based systems and services requires software products
    of the highest quality. An essential prerequisite for developing software of guaranteed
    quality in a predictable way is the ability to model and objectively assess its
    quality throughout the project lifecycle. A potential approach must handle the
    abstract and multidimensional character of quality. This chapter leverages the
    analogies between software quality assessment (SQA) and Multi-Criteria Decision
    Analysis (MCDA) to investigate how MCDA methods can support the most relevant
    requirements for an SQA method. The chapter (1) reviews existing SQA methods regarding
    potential'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'benefits from using MCDA methods, and (3) assesses some popular MCDA methods
    regarding their applicability for SQA. Although a number of SQA methods proposed
    in recent years already adapt MCDA, the exact rationales for selecting a particular
    method are usually unclear or arbitrary. Neither the goals nor the constraints
    of SQA are explicitly considered. Existing SQA methods do not meet the relevant
    requirements and mostly share the same weaknesses independent of whether they
    employ MCDA or not. In many cases, popular MCDA techniques are unsuitable for
    SQA because they do not meet its basic constraints, such as handling situations
    where data are scarce.


    Software constantly changes during its life cycle. This phenomenon is particularly
    prominent in modern software, whose complexity grows and changes rapidly in response
    to market pressures and user demands. At the same time, developers must ensure
    the quality of the software in a timely manner. Therefore, it is of critical importance
    to provide developers with effective tools and techniques to analyze, test, and
    validate their software as it evolves. While techniques for supporting software
    evolution abound, a conceptual foundation for understanding, analyzing, comparing,
    and developing new techniques is also necessary for the continuous growth of this
    field. A key challenge for many of these techniques is to accurately model and
    compute the effects of changes on the behavior of software systems. Such a model
    helps understand, compare, and further advance important activities such as changeimpact
    analysis, regression testing, testsuite augmentation, and program merging. Chapter
    5, entitled, “Change-Effects Analysis for Evolving Software,” describe process
    in developing and studying a functional approach called change–effects analysis.
    This kind of analysis computes all the differences that a change in the code can
    cause on every element (e.g., statement) of program. These differences include
    not only which program elements are affected by a change, but also how their behavior
    (i.e., execution frequency and states) are affected.


    I hope that you find these articles of interest. If you have any suggestions of
    topics for future chapters, or if you wish to be considered as an author for a
    chapter, I can be reached at atif@cs.umd.edu.


