  md: '# 4.3 Usage of MCDA in Existing SQA Methods


    # RQ4 How do SQA methods benefit from MCDA?


    The analysis of existing SQA methods showed that 18 out of the 28 SQA methods
    actually employ one or a combination of several MCDA methods (or their elements).


    Which MCDA methods are used for the purpose of SQA?


    Figure 7 illustrates the frequency with which specific MCDA methods (or their
    elements) are used in the 28 SQA methods we analyzed. The Analytic Hierarchy Process
    (AHP) [77, 78, 80] is adapted most often for the purpose of SQA. The most popular
    AHP or its elements were used in 12 SQA methods (43%). The most element of AHP
    is the technique of pairwise comparisons used in the context of SQA for assigning
    relative importance weights to quality attributes.


    The second commonly used MCDA approach is the family of ELECTRE methods [30].
    Five SQA methods adapted one of the ELECTRE methods, while the relative importance
    weights of quality attributes were determined using various techniques, including
    the AHP''s pairwise comparisons. Finally, one SQA method adapted the Technique
    for Order by Similarity to Ideal Solution (TOPSIS) [39, 64], and two further SQA
    methods additionally extended MCDA through fuzzy logic techniques [92] in order
    to account for the uncertainty of the input information. In the remaining 11 SQA
    methods we could not find any elements of a specific MCDA method.


