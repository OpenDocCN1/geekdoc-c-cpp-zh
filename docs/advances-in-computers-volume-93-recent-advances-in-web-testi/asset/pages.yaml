    or an existing on-chip interconnection network depending on the need for predictable
    behavior [31].


    # 3.2 Debugging and Advanced Hardware Mechanisms


    In addition to standard hardware counters, most microprocessors today also support
    hardware sampling based on a hardware counter through the use of a debugging mechanism.
    Although the name of the debugging mechanism varies across CPU models, most can
    be configured to generate an interrupt whenever a hardware counter overflows,
    based on some user defined value. When the interrupt is triggered, the Instruction
    Pointer and other register contents are recorded. This information can identify
    the instruction that caused the sample to be recorded.


    In most cases, a sample from the debugging mechanism reports information about
    one instruction. Although a hardware mechanism tracking a particular event will
