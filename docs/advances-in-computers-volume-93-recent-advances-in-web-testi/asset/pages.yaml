    applications to bypass the currently required system call on every LBR probe to
    allow for exploratory experimentation (e.g. for example, if the program runs in
    unrestricted kernel mode). With this change, we expect DDI to be quite efficient,
    only requiring the reading a vector of registers directly from hardware.


    # 5.2 Future Challenges in Software Engineering


    A few concerns arise when using hardware performance monitoring for software engineering
    tasks. The first is with regard to the consistency of results. As sampling is
    being used, different results are seen each time, which can particularly be difficult
    to deal with in software testing and debugging. The second concerns with the effectiveness
    of the sampling. Finally, more efficient methods to gather results, particularly
    for mobile devices, need to be researched.


    The first major challenge in using hardware performance monitors program behavior
    is in the consistency of the results. Shye et al. [7], it is observed that code
    coverage can be improved over twenty runs of the program by 10–20%. While this
    is interesting, in software testing and other software engineering tasks, we desire
    to get our results within a single run of the program. The results from this work
    imply that the repeatability of results must be determined over a wide range of
    program and executions. In preliminary work, we have seen that the repeatability
    of results depends much on the structure of the program. Program functions or
    branches/loops that are frequently executed are far more likely to be observed
    using hardware monitoring techniques.


    The effectiveness of hardware monitoring techniques could potentially be improved
    by inserting a small amount of software-level instrumentation into the application
    along branches or statements that are not likely to be seen. By first statically
    analyzing the code for complexity, we can identify portions of the code that are
    likely to be observed. If instrumentation is added unnecessarily, the overhead
    improvements from leveraging hardware monitoring will be reduced. On the other
    hand, a conservative approach may have little impact on improving effectiveness.'
