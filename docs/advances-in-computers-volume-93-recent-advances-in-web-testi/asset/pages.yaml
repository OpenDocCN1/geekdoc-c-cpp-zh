    FSM models of the web applications. However, it is extremely useful to be able
    to determine such logical web pages automatically. This is the subject of a following
    subsection.


    Building a single FSM for a large web application might be unaffordable, due to
    the associated size. Researchers have investigated the possibility of modeling
    complex applications hierarchically, by taking advantage of the possibility to
    define a hierarchy of FSMs [2], such that the intermediate levels represent macro-states
    of the application, while the leaf levels represent the detailed navigation structure
    for a specific macro-functionality. The clustering of pages into interconnected
    macro-states, organized in a hierarchy, can be achieved by decomposing the application
    functionality. Each macro functionality represents a macro-state, containing a
    set of locally located pages, which are modeled using a leaf FSM similar to the
    one in Fig. 3. The macro-functionalities can be obtained by experts inferred from
    the top-level menus of the web application, which usually makes the macro-functional
    areas visible to the user.


    A top level FSM for the e-commerce application used as a running example is shown
    in Fig. 4. The three states in this FSM model, *ProductSelection*, *Payment*,
    and *Shipping*, can be expanded into leaf level FSM models, which makes the macro
    state *ProductSelection* expands into the FSM model shown in Fig. 3. By organizing
    the complexity of large web applications it is possible to support their testing
    efficiently. In fact, test cases can be produced for the leaf FSMs, so as to focus
    the testing on the individual functionalities, considered separately. Then, following
    the hierarchy, higher level test cases can be derived using the higher level FSM
    models, to test the interactions among the functionalities of the leaf FSMs. This
    is similar to moving from unit to integration testing in traditional software
    testing.


    FSM models of web applications can also be used for formal verification. Once
    a set of temporal properties of interest, that are expected to hold for the web
    application, are formalized in temporal logics, a model checker can run against
    the FSM model to verify that they are indeed satisfied [12, 5, 22].'
