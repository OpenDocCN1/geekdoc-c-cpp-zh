    # 6. CONCLUSIONS


    Hardware monitoring approaches have successfully been applied in

    many software engineering tasks, particularly in program profiling, dynamic

    optimization, and software testing. While advances have been made in

    improving the efficiency of using instrumentation for program execution

    monitoring, research has revealed that the use of hardware mechanisms can

    elinate or drastically reduce the need for instrumentation. The key trade-

    off in balancing hardware monitoring and instrumentation use is between the

    eff needed for the approach and the amount and type of observations

    that must be made. The research presented in this chapter demonstrates

    hardware monitoring has been used successfully in balancing these tradeoffs

    in software engineering tasks.


    While the results are promising, more research is needed to better under-

    stands the types of information that can be obtained by exploiting hardware

    monitoring and the repeatability of the results. A hybrid approach involving\he
    addition of instrumentation may be necessary to improve the overall

    effectiveness for software engineering tasks that require more precise informa-

    finally, the efficiency and applicability of hardware monitoring

    aches may be improved as the hardware, OS tools, and user level

    tools continue to develop. Although hardware monitoring research currently

    focuses on applications executing on commodity markets, their use may

    pentially aid in testing, debugging, use analysis, and application analysis on

    mobile devices and embedded systems.


