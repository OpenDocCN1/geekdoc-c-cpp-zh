    In order to systematize the management of software quality, quality models are
    created. They are composed of the identified characteristics of software that
    are important for determining quality (hence the name quality characteristics
    or attributes), and the relationships between them [40]. The process of determining
    software quality is called quality assessment (SQA) or evaluation, and recognizes
    the extent to which the value of the quality characteristics of software meets
    the explicit and implicit requirements stated by the people for and/or interested
    in the assessment (quality stakeholders).


    There are many quality stakeholders, and each of them may have different expectations
    regarding software quality. Word and Venkatesan [89] summarize different views
    on software quality and distinguish between the following facets of quality: (a)
    User-based is determined by end-users based on their experience in working with
