  md: '# Recent Advances in Web Testing


    For traditional software, a source code and more specifically the control flow
    programmed in the source code. The control flow graph models the execution flow
    inside each procedure while the call graph models the invocation of procedures.
    Such models—and others built upon them—determine how to generate the test cases
    and how to evaluate their adequacy. As a simple example, whitebox coverage criteria
    as statement/branch coverage that all nodes/edges in the control flow graph of
    the system under test are exercised in at least one test case. This provides a
    clear guidance for the creation of test cases and for the assessment of their
    adequacy with respect to the target coverage goal (e.g., 100% branch coverage).


    While web applications are still constructed as collections of source code modules,
    they introduce more dynamism, associated with runtime code generation, and an
    alternative view of the execution flow, which is represented by the navigation
    graph. Since they are organized as client-server programs, web applications reside
    on the server, but the code that is on the server performs only part of the required
    computation. Another relevant part is delegated to the client and the code to
    be executed on the client is generated dynamically on the server. Such dynamism
    may have different degrees of complexity. In the simplest case, the code running
    on the server just retrieves an HTML page which is sent to the client and client
    side execution is limited to page rendering. In more complex cases, fragments
    of script code are sent to the client, for client-side execution. This might involve,
    for instance, the client-side validation of user input or the correction of graphical
    effects and advanced interactions on the GUI. An extreme case of dynamism is presented
    by modern, rich-client web applications. In such a case, the client page is continuously
    modified by client-side code which interacts asynchronously with the server to
    obtain data and execute services. A continuous flow of data between client and
    server occurs dynamically, at runtime, making the notion of source code no longer
    a static notion, which can be subjected to control flow modeling, as with traditional
    software.


    The navigation view offered by a web application to the end user is crucial to
    testing. It is complementary to the control flow view, so it does not replace,
    but introduces a different perspective for both test case generation and adequacy
    assessment. The navigation graph, describes how the user can move from one page
    or one GUI state to another, introduces another, different coverage dimension,
    which is equally important as the control flow for quality assurance. Ensuring
    that the test cases cover all statements/branches may be insufficient to ensure
    that all relevant navigation paths have been adequately exercised. A novel modeling
    approach'
