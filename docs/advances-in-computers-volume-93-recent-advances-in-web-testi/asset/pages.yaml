    # Final Criteria for Evaluating MCDA Methods


    In order to obtain a final set of criteria for evaluating the suitability of MCDA
    methods for the purpose of SQA, we combined the constraints on MCDA methods with
    the user into a non-redundant set of decision criteria. For this purpose, we merged
    both sets and removed items that refer to the same aspect of an MCDA/SQA method.
    In addition, we distinguished between necessary and sufficient decision criteria.
    *Necessary criteria* are not subject to trade-off and must be fulfilled in order
    to accept a candidate MCDA method as feasible for the purpose of SQA. Not meeting
    at least one criterion disqualifies the method independent of how it performs
    on other criteria. *Sufficient criteria* can be traded off, that is, negative
    evaluations on some criteria can be compensated by positive evaluations on other
    criteria.


    # 3.3.2 Evaluation Procedure


    We assessed the suitability for the purpose of SQA of the MCDA methods we had
    analyzed in the popularity search in two steps: screening and evaluation. The
    *screening* step involved excluding MCDA methods that do not meet the necessary
    decision criteria. The *evaluation* step consisted of assessing how the MCDA methods
    perform rigorous evaluation criteria.


    Each reviewer assessed 50% of the MCDA methods and verified the assessment of
    30% of the other reviewer.


