    The table omits two changes in NanoXML for which strategies trivially had 100%
    detection. For "non-trivial" changes, somewhat surprisingly, BR did slightly better
    on average than DU, while the two did better than STMT. The MATRIX strategies,
    especially PROP, did much better than the coverage-based strategies. This suggests,
    while CHAIN is a viable improvement, PROP is the ideal choice with a more than
    50% chance on finding observable effects of changes. For more details on this
    study, we refer the reader to Reference [73].


    Because of the scalability issues of symbolic execution, which analyzes paths
    one by one, we developed a more scalable form of symbolic execution called SPD
    [75] which analyzes multiple paths simultaneously by exploiting the dependence
    structure of programs to obtain the same results as regular symbolic execution
    but more efficiently. For the changes in Tcas, using SPD, the effectiveness within
    our memory limits of PROP increased by 17% whereas, for NanoXML, a variant of
    SPD that constrains the size of symbolic expressions increased the effectiveness
    of PROP by 44%. For full details on SPD and our second study, we refer the reader
    to Reference [75].


    # 7. APPLICATION: DEMAND-DRIVEN TEST-SUITE AUGMENTATION


    Computing all change-testing requirements for a distance d, as in Section 6, gives
    developers an idea of how adequate a current test suite is and how much additional
    testing effort is needed. In practice, the number of test requirements grows explosively
    with distance d, which limits the distances to change-effects propagation can
    be achieved (whether an effect keeps propagating d is left to change). Also, if
    only a small subset of these requirements are satisfied, the computation of the
    remaining requirements is wasted.


    In this section, we present an alternative approach to achieve greater distances
    to test changes with CHAIN and PROP by identifying satisfied requirements on demand
    during testing instead of computing all testing requirements up-front. Naturally,
    this comes at the price of not knowing in advance the total number of requirements
    and not having up-front the propagation constraints that can help generate those
    cases. Nevertheless, as we show in this section, a demand-driven alternative of
    MATRIX can be practical and effective.'
