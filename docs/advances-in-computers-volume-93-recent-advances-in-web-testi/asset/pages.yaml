  md: 'The most widely known and used classification system is based on the concept
    of problématique introduced by Roy [75], which distinguishes four different kinds
    of problems: choice, sorting, ranking, description (as described in Section 2.2).


    With respect to the number of alternatives, we can distinguish between:


    +   * Discrete Problems: These problems are also referred to as Multi-Attribute
    Decision Making (MADM) and are concerned with choosing from a discrete (finite
    and countable) set of explicitly decision alternatives (evaluation problem).

    * Continuous Problems: These problems are also referred to as Multi-Objective
    Decision Making (MODM) and are concerned with choosing from a continuous (infinite
    and uncountable) number of typically not directly specified decision alternatives
    (optimization problem). Unlike a discrete problem, a continuous problem only outlines
    where the alternatives lie (so-called feasible region), so that each point in
    this region corresponds to a specific alternative.

    * Zoupoupis and Doumps [94] mention a classification of MCDA methods regarding
    the aggregation procedure of the assessments of the particular criteria. So there
    are methods which use for aggregation:

    * Outranking relations: Binary relations that enable the assessment of the outranking
    degree of one alternative over another if there are enough arguments to confirm
    that one alternative is at least as good as the other one.

    * Utility functions: The global utility of one alternative constitutes all measure
    of the performance of an alternative when all criteria are considered (e.g., the
    global utility can be a sum or a product of all the utilities regarding all criteria).
    In that sense, global utility serves as an index used to decide upon the classification/sorting
    of the alternatives into the predefined groups.

    * Discriminant function: Similar to the utility function, the discriminant function
    cannot be considered as a preference model because it considers neither the order
    of preference among the decision classes nor the order preference in the criteria
    domains; all criteria are assumed to be quantitative (qualitative criteria should
    also be quantified); it is always linear.

