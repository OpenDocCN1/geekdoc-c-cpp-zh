    on the features they cover. Specifically, the first four metrics (PCOV, LCOV,
    IPATH, KPATH) target structural coverage; the next three (INODES, IEDGES, SCC)
    cover the macro functionalities; the final four metrics (CNODES, CEDGES, PNODES,
    PEDGES) target pages based on their position in the navigation structure.


