  md: '# 5.2 Threats to the Validity of MDS


    In this section, we summarize a few of the disadvantages of current MDS approaches,
    as mentioned in the literature.


    Employing UML profiles is the subject of debate within the community. Sánchez
    et al. [91] mention the usability of UML profiles for modeling and analyzing security-critical
    systems. They argue that adapting a UML profile to model new security concerns
    beyond its original capabilities is difficult, if not impossible. Second, Ma et
    al. [73] show that using general-purpose modeling languages, such as UML profiles,
    hinders reusability, although it does favor communication between models. Moreover,
    the same authors mention that adapting UML profiles to new systems requires a
    large effort when security is not already integrated in the modeling effort.


    Breu et al. [19] emphasize the importance of traceability in MDS approaches. However,
    traceability is rarely presented in the MDS methodologies we have analyzed.


    As a last general remark, Ma et al. [73] state that most MDS approaches (which
    are of our selection) are still merely academic. Some of those MDS approaches
    are prototypes illustrating theoretical concepts for part of a research project.
    Most of them are implementations designed for a specific business domain, and/or
    a specific security concern. Moreover, the results of the systematic reviews on
    MDS, conducted by Nguyen et al. [88] and by Jensen and Jaatu [46] both show that
    there is a lack of empirical studies on MDS research.


    # 5.3 Relevant Open Issues


    Based on the evaluation result, the following issues seems to be open for discussion.


    # 5.3.1 Choice of Modeling Paradigms


    Table 2 shows that the separation of security concerns from business logic (SoC)
    is present in almost all MDS approaches. However, even if the notion of Separation
    of Concerns is at the heart of AoM (Aspect-Oriented Modeling), none of the evaluated
    MDS approaches explicitly uses the AoM paradigm. Indeed, in the literature we
    have analyzed the term weaving is not used, and no approach uses a model weaver.
    This result conforms to the survey statistics in [88] that 87% of their selected
    primary studies are not based on AoM paradigm.


    It is difficult to explain why evaluated MDS approach explicitly applies the AoM
    paradigm, but we will attempt to propose a few possible reasons.'
