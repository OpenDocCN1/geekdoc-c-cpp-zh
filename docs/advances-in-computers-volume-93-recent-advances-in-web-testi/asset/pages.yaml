    # 4. HARDWARE MONITORING IN SOFTWARE ENGINEERING


    When considering a monitoring task, we must consider within the design space the
    particular need for flexibility, performance, and predictability. For example,
    when considering continual monitoring for memory access violations, the performance
    overhead is of utmost importance, but the need for flexibility in monitoring is
    not there (a special purpose monitoring task); dedicated hardware support might
    be the right solution. When using monitors as oracles during unit testing, the
    need for flexibility in the monitoring task is imperative since we are likely
    to use monitors for diverse tasks, for example, a functional oracle or a test
    adequacy measurement tool. In this case, arbitrary monitors that can be easily
    modified and replaced are required; an inflexible hardware solution would not
    work. Flexible monitors based on instrumentation would be far more suitable assuming
    the performance penalty is acceptable.'
