    a small application). The authors are currently working on extending this approach:
    they plan to define a calculus for QVT, the language they use for MMT, that will
    allow them to formally prove the correctness of Kiv in such transformations.


    The verification of security properties is handled by Kiv, a theoremprover on
    AsMs. Security properties are expressed using a dedicated logic, the Dynamic Logic,
    tailored to algebraic specifications constituting the mathematical background
    of ASMs. They noticed an interesting fact:application-specific security properties
    generally better guarantees than standard properties (like secrecy or integrity),
    but these general-purpose security properties still need to be proved, and are
    in fact often required as a background for specific ones. For example the German
    health card, ensuring that only a qualified doctor can issue a secrecy for any
    intruder (except of course, the patient). Moebius et al. [76] also provides a
    methodology for facilitating iterative verification: by following guidelines (e.g.
    specifying system invariants into several pieces to be able to re-prove most of
    them, or modifying protocols behavior when necessary), they were capable of running
    most of their proofs in further incremental steps. It remains to see if this methodology
    is applicable beyond their application domain.


    At a later stage, SECUREMD introduced the possibility to define test cases directly
    on UML [76]. Using Model-To-Test transformations, these test cases can be executed
    on the generated Java code to validate scenarios not handled by the verification
    process, as interactions with the user interface for which code is not automatically
