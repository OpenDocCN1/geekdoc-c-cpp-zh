    # 3. INPUT GENERATION


    Input generation (a.k.a. test data generation) is the process of creating a set
    of input values (data) for testing the adequacy of a software application. It
    constitutes an important part of software testing, especially in the context of
    web applications. It may be the actual data that has been taken from user-session
    data (e.g., stored in log-files) [20, 42] or artificial data specifically for
    testing a web application. Input generation is a complex problem and a lot of
    solutions have been proposed during the last few years, none of them seems to
    be definitive.


    A test case for a web application is a sequence of pages to be visited plus the
    input values to be provided to pages containing interfaces [40]. In this section
    we use web forms as the main mechanism for defining the interface of a web application.
    Forms are used to collect the input data to be processed by the web application.
    RIAs (Rich Internet Applications), which use input mechanisms that go beyond web
    forms [21], are taken into account in Section 5. Algorithms for interface identification
    for RIAs have been investigated by Halfond et al. [21] and by Elbaum et al. [18].


    A web interface based on HTML forms can be identified that: (1) each form corresponds
    to an interface, and (2) each input element in the form (e.g., text box, radio
    button, or hidden field) corresponds to an input parameter (a triple: name, data
    type¹) and one or more input values) of that interface.


    The problem of producing/constructing input values to be used during web testing
    can be approached manually or (semi-)automatically.


    +   * **[Manual techniques]** These techniques are the first to be proposed [16,
    40]; input values are inserted manually by the tester or recovered by Files/DBs
    previously filled by the tester. Usually,values are produced by the tester using
    traditional testing techniques, such as equivalence partitioning [37] and boundary
    value analysis.


    +   * **[(Semi-automatic techniques]** These techniques are more recent; the test
    data generation phase is tool assisted. In some cases the input


    ¹The type of values (e.g., string or integer) can be associated with the corresponding
    form element.'
