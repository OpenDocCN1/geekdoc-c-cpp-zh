  md: '# 1. INTRODUCTION


    The constant modification of software during its life cycle creates serious challenges
    for developers and testers because changes might not behave as expected or might
    introduce erroneous side effects. For example, changing the type of a collection
    of items from a set to a list might lead to undesired duplicate items. For another
    example, adding minimum-age constraints to a banking system might prevent children
    from monitoring their accounts even if only parents can perform sensitive operations.
    Hence, developers must understand the consequences and risks of modifying any
    part of a software system before they can properly design and test their changes.
    After modifying the software, developers must check the correctness of their changes
    by identifying and checking the actual effects of such changes on the behavior
    of the program. Developers can use program-analysis techniques [2] to these ends.


    The class of techniques that searches for the effects of changes in software is
    change-impact analysis [5, 7, 9, 13, 14, 23, 40, 44, 49, 58, 61, 63]] (or, simply,
    impact analysis). Impacts identify the parts of the software that are potentially
    or actually changed by a change. We classify these techniques into two categories:
    predictive and descriptive. Predictive impacts (e.g., [5, 13, 14]) identify potential
    effects of changing a particular program location, such as a statement or method,
    before changing. This is particularly useful to assist developers before they
    decide to change that location, how to change it, and how to propagate that change
    [60] (i.e., which other changes to make down the line as a consequence). Descriptive
    analyses (e.g., [61, 63, 79]), in contrast, identified entities after changes
    are made by analyzing the differences in code and behavior observable the unmodified
    and modified software.


    After changes are made, to validate them, developers typically perform regression
    testing—re-testing a program after it is modified [8, 11, 25, 28, 29, 36, 38,
    42, 51, 67, 70, 93]]. Most research on regression testing has focused on the efficiency
    of this activity through approaches such as (1) selecting a subset of the test
    cases that need to be re-run (e.g., [16, 70]), (2) prioritizing test cases to
    find errors earlier (e.g., [68, 85]), and (3) reducing the size of the test suite
    according to some criterion (e.g., [27, 92]). Little attention has been given
    to the effectiveness of regression testing, which requires only'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'identifying existing test cases affected by changes, but also understanding
    how changes affect the behavior of a program and what new test cases are needed
    to exercise new behaviors. Finding as many differences as possible caused by changes
    in the behavior of a program is a necessity to determine whether those changes
    are correct or not.



    A key challenge for many of these techniques is to accurately model and compute
    the effects of changes on the behavior of evolving systems. Fundamental models
    help understand, compare, and further advance-impact analysis, regression testing,
    and other software-evolution tasks, as test-suite augmentation [57, 73, 78] and
    program merging [12, 46, 79].


    In this chapter, we describe our progress and those of other researchers in developing
    and studying a foundational approach called-effects analysis [72]. This kind of
    analysis computes, in an ideal setting (i.e., given unlimited resources), all
    the differences that a change in the code of a program can cause on every element
    (e.g., statement) of that program. These differences include not only which elements
    are affected by a change, but also how their behavior (i.e., frequency and states)
    is affected.


    Naturally, computing all possible effects of changes is an undecidable problem.
    However, such a model for computing change effects can be the basis for practical
    approaches that approximate those effects. In this chapter, we describe various
    approximations for change-effects analysis and their application to two key tasks
    in software evolution: change-impact analysis and change testing. Our conclusion
    is that the effects of changes on software behavior can be computed with enough
    precision to help testers analyze the consequences of changes and reuse and augment
    their test suites effectively.


    The rest of this chapter is organized as follows. Section 2 provides necessary
    background contexts. Section 3 gives an overview of approaches by other researchers
    related to change-effects analysis, including reviews of change-impact analysis
    and test-suite augmentation. Section 4 presents the foundations of change-effects
    analysis, including a procedure for finding all effects in an ideal setting of
    infinite resources. Sections 6–8 describe practical approximations applied to
    test-suite augmentation for evolving software, change-impact analysis, and change
    interaction. Finally, Section 9 discusses future directions.


    # 2. BACKGROUND


    Several program analysis techniques are needed to identify the elements and relationships
    in program code that can be affected by changes.'
