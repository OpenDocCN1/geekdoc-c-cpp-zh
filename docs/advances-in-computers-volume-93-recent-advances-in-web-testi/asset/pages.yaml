    are considered: (i) generic invariants on the DOM-tree; (ii) between DOM-tree
    states; and (iii) application-specific invariants. Generic invariants are application
    and domain constraints related to the DOM structure. Such invariants are generated
    to primarily check the presence of malformed HTML and error messages (e.g., 404
    Not Found, Timeout) in the DOM structure. DOM state invariants are related to
    the states of the RIA''s user-interface. They express the requirements on the
    state-flow graph and its transitions. State invariants are supposed to check,
    e.g., presence of deadlocks, i.e., clickable elements of the RIA interface that
    should change the DOM state, but instead broken; problems related to the back-button
    of the web browser; etc. Application-specific invariants are constrained related
    to the domain of the RIA under testing, e.g., parts of the DOM structure and runtime
    JavaScript variables may depend on specific properties of the RIA. To define this
