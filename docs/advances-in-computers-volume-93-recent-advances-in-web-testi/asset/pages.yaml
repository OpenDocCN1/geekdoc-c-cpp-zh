    store user-session data (e.g., one of the simplest is configuring the Apache server
    to log all the received requests) [20].


    The techniques proposed by Elbaum et al. [19, 20] are essentially four. The simplest
    technique reuses user-session data by directly replaying individual user sessions,
    similarly to a capture-replay tool (e.g., Rational Robot’). The second technique
    replays a mixture of interactions from multiple user-sessions. The third technique
