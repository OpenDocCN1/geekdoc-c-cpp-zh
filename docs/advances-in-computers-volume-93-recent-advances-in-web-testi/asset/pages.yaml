  md: '# Change-Effects Analysis for Evolving Software


    Another important avenue of future research is the automation of testdata creation
    for satisfying propagation-testing requirements for changes. Despite recent advances
    in test-data generation, the problem of targeted testdata generation (i.e., generation
    of inputs for reaching a particular point in the program) is far from solved.
    Moreover, the propagation-based testing of changes requires not only the execution
    of the change, but also the satisfaction of infection and propagation conditions.
    Thus, it is unclear whether testdata generation for change effects can be automated
    to a satisfactory level, although the current immature of this field suggests
    that much greater automation can be achieved. In all, creating test data for change
    testing is the natural next step in this line of research to improve upon the
    manual approach used in our case studies. The large amount of developer involvement
    currently limits our ability to study change-testing techniques.


