    of all system parts, independently of any technical considerations about the final
    execution platforms and their embedded technologies; a PIM is then refined into
    a Platform Specific Model (PSM) and combined with a Platform Description Model
    (PDM) to finally reach code that run on a specific platform.


    MDA promotes a vertical separation of concerns: the system is designed at a high
    level, without any considerations about the target platform specifics; these specifics
    are then integrated by automated generators to produce code compliant with each
    platform. This methodology directly inspired several MDS proposals for enforcing
    security concerns within soft-applications.


    # 2.2.2 Domain Specific Modeling


    A common way to tackle the increasing complexity of current software systems consists
    in applying the "divide-and-conquer" approach: by delegating the design activity
    into several areas of concern and focusing on specific aspects of the system,
    it becomes possible to delege the abstraction level of the produced specifications
    with the immediate benefit of increasing the level of confidence attached to them.
    This also allows making those specifications closer to the domain''s experts,
    which facilitates controlling the quality of the produced artifacts and sometimes
    delegating their creations to those experts. Within MDE, Domain-Specific Modeling
    (DSM) is a key methodology for the effective and successful specification of such
    systems. This methodology makes systematic use of Domain-Specific Modeling Languages
    (DSMLs, or DSLs for short) to represent the various artifacts of a system as models.
    The idea is simple: focusing designers'' efforts on the parts of the design (e.g.,
    capturing the intricacies of a new insurance product), while'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'the underlying machinery takes care of the repetitive, error-prone, and well-known
    processes that make things work properly within the whole system.


    A well-known white paper on the subject from [75] presents anecdotal evidence
    that DSLs boost productivity up to 10 times, based on experiences with developing
    operating systems for cell phones for Nokia™ and Lucent™. These results pushed
    the scientific community to invest further in this field and build environments
    to facilitate the construction, management and maintenance of DSLs. This effort
    has been materialized with concrete frameworks: EMF and GMF [81], AtOM³ [67],
    or Microsoft™ DSL Tools [26], among others.


    # 2.2.3 Multi-Paradigm Modeling


    Multi-Paradigm Modeling (MPM), as introduced by Mosterman and Vanghelwe [85],
    is a perspective on software development that advocates models should be built
    at the right level of abstraction regarding their purpose. Automatic model transformations
    should be used to pass information from one representation to another during the
    development of a system. In this case it is desirable to consider modeling as
    an activity that spans different models, expressed in different paradigms. The
    main advantage is claimed of such an approach is that the software engineer can
    benefit from the already existing multitude of languages and tools for describing
    and automating software development activities—while pushing the task of transforming
    data between formalisms to specialized methodology.


    To make this idea more concrete, one might think of a UML statechart model representing
    the abstract behavior of a software system being converted into a Java model for
    execution on a given platform; or of the statechart being transformed into a formalism
    that is amenable for verification. Another advantage of this perspective on software
    development is the fact that toolsets for implementing a particular software development
    methodology become flexible. This is due to the fact that formalisms and transformations
    may be potentially plugged in or out of a development given given explicit representation.


    The idea of Multi-Paradigm Modeling is close to the idea of ModelDriven Architecture
    (MDA): in MPM the emphasis is mainly on the fact that several modeling paradigms
    are employed at the right level of abstraction during software development; MDA
    is rather focused on proposing a systematic methodology where a set of model transformations
    are chained in order to pass from a set of requirements for a system to be run
    on a given platform. MDA can thus be seen as an instance of MPM.'
