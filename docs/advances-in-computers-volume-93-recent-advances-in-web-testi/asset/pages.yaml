    # 2.4 Analogies between SQA and MCDA


    When analyzing the problem of software quality assessment and the multi-criteria
    decision making problem, we recognized many analogies. Table 1 briefly summarizes
    these analogies and similarities, whereas Fig. 1 illustrates the similarities
    between hierarchical decision and quality models (e.g., the ISO SQuaRE standard
    [40]). This analogy motivated us to consider employing MCDA techniques for the
    purpose of SQA.


    # 3. STUDY DESIGN AND EXECUTION


    # 3.1 Research Questions and Strategy


    We designed the study to investigate the extent to which the existing MCDA methods
    fulfill the most relevant requirements of software engineering practitioners concerning
    software quality assessment. We formulated our research goal using the goal template
    defined in QGM [6], derived the research questions from both, and presented both
    in Table 2.


    In order to answer the stated research questions, we designed our study in the
    following. We answered the questions RQ1, RQ3, and RQ4 by performing a systematic
    literature review (SLR) complemented by a small survey among selected employees
    of software enterprises. The SLR also allowed us to identify MCDA methods, which
    we investigated regarding their frequency of use by performing a so-called Popularity
    Search (RQ2). The methods we identified as answering RQ2 were evaluated using
    the previously determined criteria (answers RQ1, RQ3, and RQ4) based on the state
    of the art, which resulted in the answer to research question RQ5.


