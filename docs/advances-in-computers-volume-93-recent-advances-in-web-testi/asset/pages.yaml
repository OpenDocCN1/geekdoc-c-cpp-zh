  md: '# [Model construction] Web application models of two types have been described:
    UML and FSM models. Both explicitly represent the navigation structure of the
    web application under test. Reverse engineering algorithms to obtain these models
    by static and dynamic analysis of the web application under test have been presented
    in detail. A recurring problem of these reverse engineering approaches is the
    identification of “logical” web pages, i.e., web pages that represent equivalence
    classes of concrete web pages, differing by minor, irrelevant details, but associated
    with the same design entity. Techniques to identify logical web pages during model
    construction have also been discussed.


    # [Test case generation] Test case generation for the web application under test
    can be approached either manually or semi-automatically. In the latter, the problem
    of automatically generating input values that may extend exploration and intensive
    testing of the application have been investigated. In this chapter, we have described
    the so-called hidden web crawlers, that deal with the same problem. We have then
    considered testing techniques, including equivalence partitioning and boundary
    value analysis, fuzz testing, user-session-based input generation, and symbolic
    execution.


