    and challenges that must be answered. Additionally, we observe from success in
    applying hardware monitoring mechanisms to Software Engineering tasks that the
    benefits of the approach depend largely on the nature of the problem. The overall
    applicability to other tasks can be improved, but more research must be done.


    # 5.1 Software Engineering Applications


    Some software engineering tasks and challenges lend themselves very well to hardware
    monitoring support. For example, dynamic optimization generally relies on execution
    samples to make approximations for improved behavior. Similarly, profiling information
    can often be gathered from partial execution information. There are additionally
    applications in software testing and debugging that can benefit from hardware
    monitoring, at least as a supplement. All of these rely on instrumentation traditionally,
    and hardware monitoring provides an efficient mechanism to gather partial data.


    Although techniques melding instrumentation and hardware monitoring are yet to
    be explored, such combination potentially has strong application in testing and
    debugging. For example, research in software testing regression test suite prioritization,
    relies on test coverage [78], might use estimates of program coverage rather than
    complete coverage data to generate test suite priorities and selections. As such
    decisions are already estimation-based, hardware monitoring could provide a partial
    or full estimation regarding coverage criteria.


    Hardware monitoring may also be used for fault localization and debugging. In
    work by Soffa et al. [35], we propose a hardware monitoring'
