  md: '# Recent Advances in Web Testing


    Reverse engineering of the Conallen UML model can be viewed as a specialized form
    of graph traversal. The pseudo-code of the algorithm underlying reverse engineering
    tools is shown in Algorithm 1. Starting from a URL u, the algorithm first downloads
    the static or dynamic web page p. A simple static analysis is then performed on
    p to identify its hyperlinks and forms. Such hyperlinks and forms are added to
    the UML model being constructed and are traversed during the exploration of the
    web application, not previously encountered during the visit.


    It should be noticed to decide whether a link (p, t, l) or a form (p, t, f) is
    present in the model, the algorithm has to decide whether the concrete pages p
    and t map to any existing LWP in the model. When this happens, the algorithm then
    checks whether the two logical pages associated with p and t are already connected
    by link l or by form submission chain f (i.e., an aggregation relation with form
    f, followed by a <<Submit>> relation with the server page a, followed by a <<Builds>>
    relation with t). Hence, Algorithm 1 depends on the capacity to precisely recognize
    LWP during navigation.


    When applied to the example in Fig. 2, Algorithm 1 will initially call with Home
    URL and an initially empty UML model m. The pages to be visited are Login and
    ShowProducts, reached through the static links in Home, which is added to the
    model. When completed, the Login form will lead to the exploration of Authentication,
    which is added to the model. The AddToCart form leads to CartManagement. Login
    is visited twice, it is reachable from both Home and from ShowProducts, since
    the second visit no additional element will be added to the model, the contained
    Login form has been added previously. ShowProducts is also reached multiple times,
    from Authentication, CartManagement and ShowProducts itself. However, no outgoing
    link or form that was not added previously to the model is discovered during these
    visits. The resulting UML model is shown in Fig. 2.


