    The effects of a change on a modified program reflect the actual meaning of that
    change for the behavior of the program. Thus, a change can be viewed not just
    as a localized syntactic modification of the code, but more precisely as the collection
    of behavioral differences (i.e., differences in states or paths) caused by the
    syntactic modification. Such differences are initiated at the location of the
    change and propagate to all affected parts of the program, matter how far from
    the change they are.


    # 4.1.4 Effects of Multiple Changes


    Changes in programs usually do not occur in isolation. Thus, it is necessary to
    define what the effects of multiple changes on each other mean—how these interact.
    The guiding principle for multiple changes in our formal model is


    A Cx affects another change Cy if the presence of Cx alters in any way the effects
    of Cx on the program.


    This section provides formal definitions of dependency among changes and change
    interaction, including a proof that change interaction is a symmetric relation.


    The context for the effects of a change C is the entire program with all other
    changes in place, rather than just the syntactic location of C and the original
    program with change C. Because the meaning of C corresponds to its effects on
    the entire modified program, any modification of these effects caused by other
    changes is an interaction with C. This consideration leads to the definition of
    semantic dependence among changes.


