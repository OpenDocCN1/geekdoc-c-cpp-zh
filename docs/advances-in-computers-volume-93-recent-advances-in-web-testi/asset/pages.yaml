- img_proc: true
  md: 'exact because a number of SQA methods adapt elements of more than one method.
    A detailed look at the individual assessments showed that adjustments of the MCDA
    techniques resulted in improved satisfaction of some requirements while requiring
    the fulfilment of other requirements. For example, Sarkis and Talluri et al. [82]
    adjusted AHP by combining it with elements of Goal Programming [22]. As a consequence,
    the method fulfilled the requirement for handling the preferences of multiple
    quality stakeholders (R01). This improvement, however, did not come for free.
    The usage of a quite sophisticated technique such as Goal Programming reduced
    the complexity of the method and its outcomes to the decision makers (R02). Another
    example of improving an SQA method on one requirement at the expense of worsening
    on another is by Becker and Rauber [7]. They combined a hierarchical utility function
    with piecewise linear interpolation. This allowed reduced the method''s comprehensibility
    (R13) These examples represent a typical trade-off when adjusting MCDA techniques,
    meaning additional capabilities of a method are achieved at the expense of its
    sophistication—which reduced comprehensibility for potential users. The negative
    impact of higher complexity on the comprehensibility of an SQA method can be moderated
    by appropriate tool support. Yet, for most of the methods we analyzed, comprehensive
    tool support seems to missing; at least the primary studies we reviewed did not
    refer to such support.


    In practice,trade-offs between requirements should be considered explicitly when
    selecting or improving an SQA method. In other words,selecting and adjusting a
    candidate SQA method should be driven by fulfilling the most critical requirements
    because this allows for optimizing the cost-benefit ratio of obtaining a suitable
    SQA method. The primary studies we analyzed unfortunately do not present any systematic
    approach for selecting and adjusting specific MCDA techniques for the purpose
    of SQA.


    # 6.3 Future Perspectives


    Our findings suggest that some gaps needs to be overcome for everyday use SQA
    methods more feasible and that MCDA techniques can support software quality assessment.
    So we decided to create a knowledge sharing platform called MCDA for SQA. It aims
    at leveraging the experience'
