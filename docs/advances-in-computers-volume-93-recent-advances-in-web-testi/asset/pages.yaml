    # 3.3.2 Coverage-Based Testing Criteria for Modified Software


    Whole-program coverage criteria aims at discovering faults whose existence and
    location are unknown. In the case of modified software, however, the changes and
    their location are known. Researches have exploited this information at least
    by proposing to test the effects of changes by identifying entities, such as branches
    or data dependencies, that might be affected by the changes and requiring the
    coverage of these entities by a regression test suite [11, 25, 69]. Affected entities
    are identified in these techniques via forward traversal of control and data dependencies
    from the locations affected by changes—the approach corresponding to forward slicing
    [30, 31, 90]. Thus, testing techniques use specialized criteria that require the
    coverage of all subsets of program entities instead of all entities, as whole-program
    criteria do [Section 3.3.1]. The effectiveness of these change-testing techniques,
    however, was not evaluated empirically until our work started in Reference [73].


