  md: '# Alternatives A


    A refers to a set of m alternatives considered in the decision model such as $A
    = \{a_1, a_2, \dots, a_m\}$ and $A \in A^*$. In the context of software quality
    assessment, an alternative corresponds to the software product under assessment.
    Example alternatives include requirement specification, software design, software
    code, and software application.


    # Attributes D


    An attribute represents a measurable characteristic of an alternative. In the
    context of software quality assessment, an attribute corresponds to the measurable
    property of the assessed software artifact (e.g., complexity is an attribute of
    software source code). An attribute to which a measure is associated is called
    a *measurable attribute.


    # Measures M


    A measure quantifies an alternative to its attribute by assigning the attribute
    numbers or symbols [2]. Formally, a measure is a unary function upon an attribute
    of an alternative. In the context of software quality assessment, a measure is
    interpreted in the same way as in MCDA. An example measure is McCabe’s cyclomatic
    complexity (CC) [55], which quantifies the “complexity” attribute of software
    code.


    # Criteria G


    The family of $n$ decision criteria $g$, such as $G = \{g_1, g_2, \dots, g_n\}$
    is a tool for evaluating and comparing alternatives from the viewpoint of the
    consequences of their selection. Decision criterion $g$ is an attribute with an
    associated preference relation, where *preference relation* refers to a binary
    relation on the attribute, i.e., a relation that defines the ordinal correspondence
    between the attribute''s measurement values and the decision maker''s preferences
    regarding this attribute. Well-defined decision criteria should be [10] relevant,
    measurable, non-redundant, complete, concise, and judgment independent. In the
    context of software quality assessment, a decision criterion corresponds to a
    quality aspect, also referred to as *quality attribute* [40]. Example quality
    aspects include software reliability, maintainability, and other software “ability-like”
    aspects that are associated with the preferences of the quality stakeholders.


    Decision criteria may be represented as a simple set or be structured in a hierarchy
    or network. Typically, the criteria are organized in a hierarchy in which they
    are broken down into sub-criteria, which are broken'
