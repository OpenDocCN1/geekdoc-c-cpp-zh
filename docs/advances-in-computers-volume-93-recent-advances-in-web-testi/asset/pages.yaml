  md: '152


    Levi Lúcio et al.


    Moussa Amrani recently completed his Ph.D entitled "Formal Verification of Model
    Transformation – An Application to Kermeta". This work had two objectives: providing
    a methodological framework for helping model transformation designers ensure the
    correctness of transformation; and proposing formal verification for Kermeta,
    a popular object-oriented model transformation framework used in industrial projects.
    Before his Ph.D, Moussa Amrani received a BSc, a MSc and a Magistere in Computer
    Science from University Joseph Fourier (Grenoble, France) where his work was dedicated
    to the formal verification of object-oriented programming languages like Java,
    using popular techniques like model-checking and abstract interpretation. His
    main areas of expertise are Model-Driven Engineering, Formal verification techniques,
    and Formal Semantics.


    Dr. Jacques Klein is research scientist at the University of Luxembourg. He received
    a Ph.D. degree in Computer Science from the University of Rennes, France in 2006
    for a deconstruction on the searing of behavioral models (UML) in a Model-Driven
    Engineering and Product Line contents. In 2007/2008, he worked for two years at
    the University of Luxembourg as a significant collaborator. In 2009, he moved
    to a full time position at the CPR-Gabbriel Lippmann in Luxembourg, to work on
    IT projects as project manager. In March 2010, he came back to the University
    of Luxembourg to work in the team of Prof. Yves Le Traon. His main areas of expertise
    are:Model-Driven Engineering, with a focus on composition; Security (namely security
    for Android) by applying Software Engineering to security; Software Testing, and
    Software Product Lines.


    Hans Vanhaghele is a Professor in the department of Mathematics and Computer Science
    at the University of Antwerp in Belgium, an Adjunct Professor in the School of
    Computer Science at McGill University, Montreal, Canada and an Adjunct Professor
    at the National University of Defense Technology in Changsha, China. In a variety
    of projects, often with industrial partners, he develops and applies the model-based
    theory and techniques of Multi-Paradigm Modelling in diverse domains, such as
    automotive software. He is an Associate Editor of Springer’s Software and Systems
    Modeling journal, of the International Journal of Critical Computer-Based Systems,
    of Transactions of the Society for Computer Simulation, and of the International
    Journal of Adaptive, Resilient and Autonomic Systems.


    Yves Le Traon is professor at Faculty of Science, Technology and Communication
    at University of Luxembourg, Campus Kirchberg, in the domain of software engineering,
    reliability, validation and security. He is currently the head of the CSC Research
    Unit (Department of Computer Science). He is also a member of the Interdisciplinary
    Centre for Security, Reliability and Trust (SnT), where he leads the research
    group SERVAL (SEcuRity VALidation of services and networks). His research interests
    include software testing, design for test, model-driven validation, model-based
    testing, evolutionary algorithms, software security, cloud optimization and testing,
    and Android security.'
