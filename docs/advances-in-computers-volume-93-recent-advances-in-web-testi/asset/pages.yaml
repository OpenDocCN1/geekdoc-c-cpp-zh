    using information about the RIA that is captured by applying dynamic analysis.
    These testing approaches differ namely: (i) on the technique adopted to mine the
    RIA interface models, (ii) on the type of the mined model and the information
    represented in them, as well as (iii) on the technique adopted to use the mined
    models to test the RIA.


    # 5.1 Dynamic Analysis


    Traditional static analysis, based on source code analysis and parsing technologies,
    has severe limitations in the analysis of a RIA, since it is not enough powerful
    to capture the dynamic behaviors and changes of a RIA. For this reason, dynamic
    analysis was adopted by both Marchetto et al. [29] and Mesbah et al. [36] to support
    RIA analysis, since it can capture information useful to comprehend the logics
    underlying a RIA. Performing dynamic analysis on a target application involves
    running the application in different conditions and contexts while collecting
    information about the application components and the executed behaviors. In other
    words, tracing the application executions and collecting information in log-files.
    Dynamic analysis is by definition partial, that is when applying dynamic analysis,
    we can only reason and comprehend the "part" of application exposed by the observed
    and traced behaviors. Therefore, often, a manual validation or refinement step
    of the results obtained be required, to increase its effectiveness. Two steps
    of the dynamic analysis affect mostly its effectiveness. To apply dynamic analysis
    we have to identify: (i) a set of meaningful execution scenarios, usable to run
    the application and expose its relevant behaviors; and (ii) the input values required
    to exercise these scenarios. However, identifying meaningful executions and inputs,
    thus collecting useful information about the application structure and behaviors,
    is a complex, difficult task. Both of them are not trivial and may require a nontrivial
    effort, as well as specific application and domain knowledge.'
