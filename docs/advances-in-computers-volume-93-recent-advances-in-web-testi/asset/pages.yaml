    There are many various methods used at solving multi-criteria decision problems.
    Each of them possesses different characteristics: Some are related to the nature
    of the problem they solve, others to the quality of the provided results. Therefore,
    there are many systems for classifying MCDA methods. This section presents and
    describes the major classifications of MCDA methods.'
