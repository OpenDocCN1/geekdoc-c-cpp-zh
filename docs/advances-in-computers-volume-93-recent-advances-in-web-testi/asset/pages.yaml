    # 3.2 (Semi-)automatic Techniques


    # 3.2.1 Hidden Web Crawlers


    The first works in the context of test data generation concern the development
    of crawlers capable of extracting content from the so-called “Hidden web” [25,
    38]. The hidden (or deep) web is part of the internet that is not indexable by
    search engines, because it is hidden behind input forms, e.g., in searchable databases.
    It has been recognized that significant technical challenges in designing a hidden
    crawler (i.e., a crawler to automatically parse, process, and interact with form-based
    web interfaces) [38]. However, the main challenge is equipping crawlers with the
    necessary input values (i.e., how to “fill out forms”).


    The first prototype of a hidden crawler was HIWI [38]. HIWI consists of three
    components: (1) a form extractor, to extract some kind of descriptive information,
    or label, for each element in a form, (2) a database of values, called Label Value
    Set (LVS) table, organized in terms of a finite number of concepts or categories,
    each of which is also associated with labels, and (3) a matching algorithm capable
    of matching form labels with database labels to compute a set of candidate values.


    The operating principle of HIWI is simple. From a given URL, as any traditional
    crawler, HIWI crawls the web application. For each covered-form, it collects each
