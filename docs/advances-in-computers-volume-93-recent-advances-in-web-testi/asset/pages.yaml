  md: 'Exploiting Hardware Monitoring in Software Engineering


    information can only be collected from the core hosting the application monitored.
    This necessitates that the program be interrupted to collect the needed information.
    However, allowing hardware monitoring information to be accessed from any core
    would require minimal hardware modification. It would require moving each core''s
    performance monitoring unit (PMU), which controls hardware monitoring ability,
    into the “uncore.”


    Figure 21 illustrates moving private PMU to the global uncore area [13]. Making
    the aggregated PMU universally accessible would require an added core id assigned
    to each global PMU and added bus lines from each core. This approach would allow
    the monitoring and analysis of the application from a core separate from those
    hosting the application’s threads, allowing the application to be unperturbed
    throughout execution. Some uncore events are now available for monitoring using
    libpf and OProfile; however, the use of these yet to be explored for software
    testing purposes.


