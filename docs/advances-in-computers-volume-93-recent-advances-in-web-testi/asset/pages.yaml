    MCDA methods for the purpose of SQA.\n\nThe platform also presents the results\
    \ discussed in this chapter (Figure 14\npresents the main website screen), and\
    \ can be accessed at: http://mcdaforsqa.cs.put.poznan.pl.\n\n# 7. SUMMARY AND\
    \ CONCLUSIONS\n\nIn this chapter, we presented our study, whose goal was to evaluate\n\
    existing Multi-Criteria Decision Analysis (MCDA) methods with regard to\nthe applicability\
    \ for the purpose of software quality assessment (SQA). This\nprimary goal was\
    \ set based on the identified allegiances between characteristics\nof the problems\
    \ of SQA and the problems MCDA methods help to solve.\nIn order to achieve this\
    \ goal, we performed a systematic literature review\ncomplemented by a small industrial\
    \ survey, which led us to the following\nfindings, i.e., the answers to stated\
    \ research questions.\n\nA set of requirements regarding SQA methods can be precisely\
    \ formulated. Our\nanalysis of the primary studies and the results of the small\
    \ industrial survey\n us to formulate a set of 15 requirements addressed by software\
    \ quality\npractitioners and investigators.\n\nA number of SQA methods are used,\
    \ but they are not perfect. We obtained\n28 different SQA methods in our SLR.\
    \ They have been successfully applied\nin some contexts. However, they are reported\
    \ to have some weaknesses in\nterms of handling many aspects, coping with uncertain\
    \ information, or\nmissing data. Moreover, the SQA methods share the same weakness.\n\
    \nSome SQA methods are supported by MCDA. 18 out of 28 SQA methods use all or\
    \ some of the techniques/elements of MCDA methods. Although\nthe techniques usually\
    \ help to achieve the stated goal, their usage makes the\nSQA methods inherit\
    \ the weaknesses of the MCDA methods. However, in a\nfew studies, the authors\
    \ also overcome the limitations of the applied MCDA\nmethods. For example, in\
    \ [58, 7], the applied MCDA methods, which, by\ndefinition, do not handle hierarchical\
    \ problems, were adapted so to handle\nsituations.\n\nHowever, we found that the\
    \ selection of an MCDA method for the\npurpose of SQA is not done systematically.\
    \ Most frequently, the primary studies\napplied those MCDA methods that we identified\
    \ as being the most popular\nones, e.g., AHP, TOPSIS, and SAW."
