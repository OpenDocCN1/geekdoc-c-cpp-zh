    Change-impact analysis techniques provide various tradeoffs for scalability and
    precision. The most scalable, coarse-grained impact identified classes or methods
    (e.g., [5, 14, 63]), which can be useful as a first step for developers to understand
    the consequences of a change, but do not describe which of those classes or methods
    are affected or how they are affected. The fine-grained impact analyses use code
    dependencies (e.g., [10, 31]) to identify impacts at the statement level, but
    they are still imprecise because they either find, in a conservative way, an excessive
    portion of the program as potentially affected or missed code not revealed by
