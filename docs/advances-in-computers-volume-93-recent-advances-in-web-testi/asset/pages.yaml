    the testing activities [8, 28]. After executing a test against the web application
    under test, metrics can be obtained based on coverage information collected during
    test case execution. Such coverage information can be mapped to model elements
    (e.g., pages and links traversed), coverage metrics can also be determined. These
    metrics can be used as adequacy criteria [8] or crawlability indicators [28].
    When used as *adequacy criteria*, metrics determine the stop condition for testing.
    The web application is regarded as adequately tested if some adequacy metrics
    are above a user defined threshold (usually expressed as a percentage of the maximum
    possible value). For instance, 100% of the web pages must have been visited during
    testing. Metrics can also be used as *crawlability indicators*, to determine whether
    the web application has been explored enough during model construction. If a web
    application contains pages for which low crawlability metrics are measured, the
    user is warned about the possibility that a portion of the web application remains
    unexplored. By intensifying crawling (possibly with human intervention) on those
    parts that are more difficult to crawl, a more complete model is obtained, which
    in turn is associated with a set of test cases that exercises the web application
    more exhaustively.


    Other works [9, 14] introduced web metrics for purposes not strictly related to
    testing. These metrics are focused on the focus of navigation for the end user
    of a web application and consider phenomena such as disorientation due to the
    complexity of the navigation structure, inconsistencies, and lack of a hierarchical
    navigation structure. Information retrieval metrics [14] are introduced to determine
    the relevance of a web page to specific information need, as well as the quality
    of the information provided by a given page.


    Some concepts defined to characterize the end usability of a web application,
    the concept of index node and central node [9], have been adopted to define metrics
    used during web testing. An *index node* is a node that supports full reachability
    of a large collection of web pages, pointing to the entry pages of different subportions
    of the navigation graph. Index nodes can be identified automatically by measuring
    the outdegree of nodes. When the outdegree is above a user defined threshold (e.g.,
    $\mu+3\sigma$, where $\mu$ is the average outdegree computed over all nodes and
    $\sigma$ is the standard deviation of the outdegree), an index node is identified.
    A *central node* is a node whose distance from all other nodes in a navigation
    graph by measuring the sum of all distances of each node from the other nodes.
    When it is impossible to reach a node from a given node, the associated'
