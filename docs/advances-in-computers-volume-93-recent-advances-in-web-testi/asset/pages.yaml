    This section describes the propagation-based technique MATRIX for analyzing the
    testing requirements of single changes. Section 6.2.1 presents Phase 1, while
    Section 6.2.2 presents Phase 2.


    # 6.2.1 Phase 1: Chain Requirements


    A simple strategy for testing a change is cover all changed statements. However,
    as shown in studies [73], this strategy fails to guarantee that all possible effects
    of the change on different parts of the program are tested. Consider, for example,
    program Bin in Fig. 1 and change Ci. Let Bin be this modified version. This program
