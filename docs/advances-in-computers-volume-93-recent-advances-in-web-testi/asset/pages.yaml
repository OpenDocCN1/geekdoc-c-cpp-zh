  md: '# Adapting Multi-Criterion Decision Analysis for Assessing the Quality of Software
    Products


    how much. For example, all SQA methods that adapt AHP and/or SAW provide good
    support for benchmarking software with respect to quality as AHP and SAW support
    the sorting purpose.


    Moreover, MCDA primarily support any set of decision criteria with custom-tailored
    priorities and measurement scales (R12). Compensatory MCDA methods, such as AHP
    and SAW, are also directly applicable either for simple sets of quality attributes
    or hierarchically organized attributes (R13). SQA methods that adapt MCDA, specifically
    AHP and/or custom-tailored software quality models as a basis for quality assessments.
    Regarding preference scales defined on decision criteria, MCDA typically used
    an intuitive scale. For instance, compensatory MCDA methods based on weighted
    aggregation (sum or product) use the preference scale 0–1 of the decision criteria.
    Adapting such methods for SQA facilitates incorporating subjective quality evaluations
    on individual quality attributes (R09) as well as interpreting intermediate quality
    assessment on individual quality attributes considered in the assessment (R15).


    In order to handle interdependencies between quality attributes (R06), the authors
    of SQA methods use MCDA methods that directly cope with this issue. For instance,
    Morisio et al. [58, 59] adapt MCDA outranking methods such as ELECTRE.


    Finally, combining compensatory and non-compensatory approaches for aggregating
    assessments on individual quality attributes into an overall assessment (R07)
    poses a significant challenge for existing SQA methods. Except for one method,
    none of them meets this requirement. Becker and Rauber [7] proposed a partial
    solution in that they weighted product aggregation and a utility function using
    the 0–5 scale. The value 0 represents an unacceptable value for a criterion. If
    any measurement leads to a 0 of value, this is propagated up to the decision through
    multiplications of the weighted product aggregation. In this sense, a veto threshold
    = 0 is set on the lowest-level measurable criteria. In this simple way, the authors
    introduced the non-compensatory assessment element into a generally compensatory
    SQA method.


    # Have SQA methods resolved the weaknesses of the MCDA methods they adapted?


    Based on the mean assessment, most of the SQA methods have improved compared to
    the MCDA techniques they used. In only few cases did the mean assessment become
    worse. However, this generic statement is not'
  merge: -1
