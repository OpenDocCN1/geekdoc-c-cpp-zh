  md: '# Change-Effects Analysis for Evolving Software


    Control-flow analysis (Section 2.1) builds graph representations of all possible
    sequences of statements in program executions. Control- and dependence (Section
    2.2) analyses the dependencies among states that arise from control decisions
    and computations in the program. Slicing (Section 2.3) uses these dependencies
    to identify the subset of a program or execution that affects or is affected by
    a certain control decision or computation. Symbolic execution (Section 2.4) produces
    an algebraic representation of the cumulative effect on the program state of statements
    in a path or set of paths of the program.


    # 2.1 Control Flow Analysis


    In this chapter, we define a statement as a line of executable code (i.e., code
    that can modify a program state or path). Without loss of generality, we assume
    that a statement contains at most one procedure call (i.e., function or method
    call). A statement that contains a procedure is a call site. The executable code
    of a program procedure can be represented by its control-flow graph [3], defined
    next.


    **Definition 1.** A control-flow graph (CFG) for a procedure $p$ is a connected
    directed graph $G=(V,E)$ where $V$ is the set of nodes and $E$ is the set of edges.
    For each statement $p$ other than a call site, $V$ contains a node. For each call
    site in $p$, $V$ contains a call node and a return node that represents the points
    before and after the call, respectively. Each of these nodes is labeled with a
    unique identifier (e.g., the line number) for the corresponding statement, followed
    by a suffix “a” if it is a call node and “b” if it is a return node. $V$ also
    contains two distinguished $EN$ (or ENTRY) and $EX$ (or EXIT) for the entry to
    and exit from $p$, respectively. In $V$, only $EN$ has no predecessors and $EX$
    has no successors. The edges in $E$ represent the flow of control among the elements
    in $p$ represented by the nodes in $V$. For each call site in $p, E$ contains
    an edge from the corresponding return node. If $p$ has multiple exit statements,
    $E$ contains an edge from each node to an exit statement to $EX$. An edge $e$
    whose source node has multiple outgoing edges is labeled with the control decision
    that causes $e$ to be taken.


