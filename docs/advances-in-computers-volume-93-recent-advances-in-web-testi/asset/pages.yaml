  md: '# Exploiting Hardware Monitoring in Software Engineering


    The THME system, however, provides an efficient and effective solution to the
    test execution process and can easily be ported to other devices that (i) the
    devices have accessible hardware mechanisms, (ii) there exists kernel support
    for accessing and reading the mechanisms, and (iii) there exists a kernel interface
    that will properly interact with the access tool and the hardware. Most modern
    smartphone and tablet devices meet the first two requirements. For example, the
    iPhone 3GS, Nokia n900, Samsung Galaxy Nexus, iPad2, Motorola XOOMOM, and the
    Amazon Kindle Fire all use ARM Cortex-A8 or A9 processors. The Cortex-A8 an A9
    have more than fifty hardware counters that can be utilized, and they are accessible
    at the kernel and user levels through the perf and Oprofile tools.


    The hardware mechanisms on the Cortex-A9 processor, which is used in most multi-core
    mobile devices, are unique in that they support the tracking of code in Java applications.
    In addition to the typical mechanisms that track CPU cycles, branches retired,
    read/writes, etc., the A9’s mechanisms also monitor decoded bytecode execution
    and Jazelle branch execution [9, 33]. Jazelle Direct Bytecode allows processors
    to execute Java bytecode as a hard execution state. The most prominent use of
    Jazelle is by manufacturers of mobile phones to increase the execution speed of
    Java Micro games and applications. A Jazelle-aware Java Virtual Machine (JVM)
    will attempt to run Java bytecode, returning to the software for more complicated,
    or lesser-used bytecode operations. ARM claims that approximately 95% of bytecode
    in typical program usage ends up being directly processed in the hardware [74].
    Therefore, these two additional mechanisms potentially are very useful for monitoring
    the behavior of Java applications.


    Although hardware mechanisms exist on processors for mobile devices and although
    recent kernels provide support for accessing and recording information from these
    counters, the kernel interface between the two is lacking. In order to take advantage
    of hardware mechanisms, the access tool, kernel, and hardware must be able to
    interact properly. For example, many mobile devices are designed with the TI OMAP4
    system on a chip (SoC), which is a high-performance applications processor. Devices
    that use an OMAP4 SoC include the Amazon Kindle Fire, Barnes and Noble N Tablet,
