  md: '# Abstract


    Sound methodologies for constructing security-critical systems are extremely important
    in order to confront the increasingly varied security threats. As a response to
    this need, Model-Driven Security emerged in the early 2000s as a specialized Model-Driven
    Engineering approach for supporting the development of security-critical systems.


    In this chapter we summarize the most important developments of Model-Driven Security
    during the past decade. In order to so we start by building a taxonomy of the
    most important concepts of this domain. We then use our taxonomy to describe and
    evaluate a set of representative and influential Model-Driven Security approaches
    in the literature. In our development of this we concentrate on the concepts shaped
    by Model-Driven Engineering and Model-Driven Security. This allows us to identify
    and debate the advantages, disadvantages, and open issues when applying Model-Driven
    Engineering to the Information Security domain.


    This chapter provides a broad view of Model-Driven Security and is intended as
    an introduction to Model-Driven Security for students, researchers, and practitioners.


    # 1. INTRODUCTION


    The world is becoming increasingly digital. On one hand, advances in computers
    and information technology bring us many benefits. On the other hand, information
    security is becoming more and more crucial and challenging. Few days pass without
    new stories in the newspapers about malware, software vulnerabilities, botnet
    attacks, or other digital related problems. Thus, information security is a significant
    issue in computer science and keeps attracting the interest of researchers and
    engineers [43].


    Security requirements for software are becoming more complex in order to deal
    with the diverse and constantly changing threats. Given security requirements
    are often tangled with functional requirements, it is difficult to integrate them
    properly in the traditional software development process. Also, security requirements
    are rarely dealt with the early stages of the development process [28]. Traditional
    methods for developing security-critical systems are becoming increasingly inefficient.
    Moreover, due to economic pressure, development time is short and the frequency
    of required modifications is high. This leads in practice to many security defects
    that have been exploited and made the headlines in the newspapers. All these issues
    show the need for more timely, innovative, and sound engineering methods in this
    area.


    Model-Driven Security (MDE) has emerged more than a decade ago as a specialized
    Model-Driven Engineering (MDE) approach for supporting the development of security-critical
    systems. MDE has been considered by some authors as a solution to the handling
    of complex and evolving software systems [18]. The paradigm consists of electing
    models and transformations as


