    # 8.3.3 Evaluation


    We compared the q-slices produced by SenSA with context-insensitive static

    forwards for predicting change impacts at various program locations.

    The scenario is early change-impact analysis, in which users query for the poten-t
    impacts of changing a location without necessarily knowing the details

    of the change yet. Our research questions were:


    +   **RQ1**: How good is q-slicing at predicting impacts?

    **RQ2**: How good is q-slicing for different usage budgets?

    **RQ3**: How expensive is SenSA for q-slicing?


    The first and second questions address the benefits of q-slicing overall

    per slice-inspection effort. The third question targets the practicality of

    SenSA.


    # 8.3.4 Setup


    SenSA extends DUA-FORENSICS [74, 80], our analysis and monitoring tool

    for Java bytecode codes. For this study, we chose three Java subjects from the

    SIR repository [20] for which many test cases and changes (bug fixes) are

    provided. These subjects are Schedule1 (a small task scheduler), NanoXML

    (a lean XML parser), and XML-security (an encryption library of more than

    2000 lines of code). For each subject, we studied 7 changes, for a total of

    21 changes.


