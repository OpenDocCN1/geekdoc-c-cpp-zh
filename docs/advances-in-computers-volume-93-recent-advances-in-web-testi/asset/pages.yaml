    \ groups of MCDA methods:\n\n+   * Single-criterion synthesis approach without\
    \ incomparability (multiple attribute utility theory methods): These methods consist\
    \ of aggregating the different points of view into a unique function which must\
    \ subsequently be optimized. Research related to these methods studies the mathematical\
    \ conditions of aggregation, the particular forms of the aggregating function,\
    \ and the construction methods.\n* Outranking synthesis approach with incomparability\
    \ (outranking methods): These methods aim first to build a relation, called an\
    \ outranking relation, which represents the strongly established decision maker's\
    \ preferences, given the information at hand. The latter relation is therefore\
    \ generally non transitive. The second step consists of outranking the outranking\
    \ relation in order to help the decision maker solve his problem.\n* Interactive\
    \ local judgment approach with trial and error iterations (interactive methods):\
    \ These methods alternate between calculation steps (yielding successive compromises)\
    \ and dialog steps (sources of extra information about the decision maker's preferences).\
    \ Though they are most developed in the context of multiple objective mathematical\
    \ programming, some of these methods can be applied to more general cases.\n\n\
    Note that incomparability of two options is not the same as indifference between\
    \ two options and might, for example, be associated with missing information at\
    \ the time the assessment is made.\n\nAnother important distinction between MCDA\
