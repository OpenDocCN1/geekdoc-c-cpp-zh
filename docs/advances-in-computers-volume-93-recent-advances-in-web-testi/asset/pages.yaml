    After automatic execution, the reviewers performed an initial review based on
    the title, keywords, and abstract. They checked whether criteria SC1–SC5 were
    satisfied and whether these metadata imply criteria SC6–SC7 will be satisfied.


    For primary studies from software engineering information sources, we performed
    a quality assessment step, in which criteria SC6–SC7 were verified by the reviewers
    reading full papers assessing the quality of the manuscripts. The reviewers were
    to answer each question using a 5-point Likert scale [52]: Strongly agree, Agree,
    Neither agree, Disagree, and Strongly disagree. If a primary study was assessed
    as ‘Strongly disagree’ or ‘Disagree’ on more than two criteria, we did not extract
    the information from it.


    For us, an SQA method means a method that focuses on assessing the quality of
    a software product, not a specific set of quality attributes (e.g., security).
    So, we did not include the following families of methods that might be regarded
    as SQA: (1) software reliability growth methods [53], which aim to predict software
    reliability based on past software failures, (2) software fault–proneness or maintainability
    models of software based on the structural properties of the software source code,
    and [5], and (3) software reuse models [57], which predict benefits, e.g., improved
    maintainability, fewer failures, or financial benefits based on the level of software
    reuse.


