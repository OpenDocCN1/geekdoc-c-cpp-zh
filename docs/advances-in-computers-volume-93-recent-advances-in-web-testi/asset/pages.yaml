    # 7. CONCLUSION


    In this chapter we have presented the main advances in Model-Driven Security for
    the past decade. In order to propose a clear vision of what MDS is, we first introduced
    the main concepts on which MDS is based on. In particular, we focused on the notions
    of MDE, such as metamodels, model transformations, et, but also on the notion
    of separation of concerns or views. We have then proposed a detailed taxonomy
    consisting of the main concepts and elements of MDS. Based on our taxonomy we
    have described, summarized, evaluated, and discussed well-known MDS approaches:
    UMLSEC, SECUREML, TECTET, ModelSEC, and SECMD. We pointed out some current limitations
    of MDS approaches, and sketched some relevant open issues. Overall, this chapter
    provides a broad view of the field and is intended as an introduction to MDS for
    students, researchers, or practitioners.


    This work allows us to provide insights about future directions for MDS research
    and industrial practice. A primary challenge is to reach a better level of maturity:
    this of course requires building tools, but also conducting systematic industrial
    experimentation. The latter is obviously difficult in such a critical software
    application domain. However, recent progress in MDE in theories and tooling, well
    as the continuous interest from industry modeling, may directly be benefit to
    the development of MDS.


    We noticed that most of the existing MDS approaches implement separation of security
    concerns from the business logic (SOC), even if for the approaches we surveyed
    this principle cannot be considered as the AOM paradigm. By leveraging AOM, security
    concerns can be specified as aspect models that can be woven into the primary
    (business logic) models.'
