    # 5.3 RIA Testing


    The mined FSM and SFG models, capturing the states of the application user-interface,
    are used as source of knowledge for testing the RIA under analysis. Marchetto
    et al. [31] and Mesbah et al. [36] suggest two ways to test the application:


    [Test case generation] Marchetto et al. [31] used the mined FSM to derive abstract
    cases, then concretized and executed in the running application. In fact, each
    path of the FSM is a sequence of user-interface events (e.g., clicks of interface
    buttons) and states of the interface/after the execution of each. Conventional
    FSM coverage criteria (e., state or transition coverage) can be applied to derive
    sets of test cases. Marchetto et al. [31], moreover, presented a specific criterion
    based on the coverage of the semantically interacting events [34, 51]. A semantic
    interaction exists between a pair of FSM events ($e_1$ and $e_2$) whenever the
    effect on the DOM state of the two callbacks $e_1$ and $e_2$, associated with
    $e_1$ and $e_2$, are not independent, i.e., swapping the order of execution brings
    the application to a different FSM state. This notion of semantically interacting
    events can be easily generalized to sequences. However, the sequences of events
    extracted from the FSM are only test cases. They cannot be executed directly and
    they have to be concretized, by adding the input values to execute the event callbacks.
    They also need oracles, with the aim of checking the output of the test case executions.
    Databases of input values are used for input definition. The values in such databases
    can be defined randomly, with the help of the user, or they can be collected with
    the traces that are used for model mining. About the oracles, i.e., the PASS/FAIL
    result of a test case execution, can be determined by: (1) checking the consistency
    of the concrete state sequence w.r.t. the related state sequence in the FSM of
    the application; (2) checking any output value (e.g., DOM elements, their attributes
    and the textual content in the resulting page) against a manually provided oracle;
    (3) determining whether the application is crashed by the test case (this is often
    called smoke testing).'
