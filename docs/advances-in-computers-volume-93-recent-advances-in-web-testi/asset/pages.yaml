    # Abstract


    Program monitoring is a key component of many software engineering tasks. Traditionally,
    instrumentation is used to complete these tasks. However, instrumentation can
    prohibitively increase the time and especially the memory overhead of an application.
    As an alternative to instrumentation, hardware monitoring has been shown to aid
    in developing more efficient techniques.'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'In this chapter, we examine efforts in applying hardware monitoring to a number
    of software engineering tasks including profiling, dynamic optimization, and software
    testing. We discuss improvements in using instrumentation for monitoring, how
    hardware-ware mechanisms can provide an alternative, and the success that has
    been revealed in software engineering research when applying hardware monitoring
    approaches.


    # 1. INTRODUCTION


    Monitoring is traditionally performed using instrumentation. To instrument code,
    the program is analyzed, either statically or dynamically, to determine points
    of interest. Each is marked by a probe, which is usually a jump or call to payload.
    When the probe is reached during program execution, the payload is executed, and
    the payload analyzes and records the monitoring information needed.


    In most tools, instrumentation is statically placed in the source or binary code
    before execution and remains in the code until execution terminates, which leads
    to overheads. For example, the time overhead of monitoring the execution of all
    branches has been reported to be, on average, 10% and 30%, with code growth from
    60% to 90% [1–3]. Even though coverage may only require one instantiation of a
    code element, the instrumentation generally stays in the code, causing unnecessary
    overhead. Static instrumentation may also be placed along infeasible paths, which
    leads to imprecision as well as avoidable code growth [4].


    Dynamic instrumentation tools, as Pin [5], add instrumentation each selected program
    element is going to be executed. A just-in-time compiler is used to compile new
    code for the straight line code sequence starting at the instruction to be instrumented.
    For each insertion, the tool transfers control to the generated sequence [5].
    While dynamic techniques are advantageous in that they do not require static code
    modification,'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Exploiting Hardware Monitoring in Software Engineering


    time, and memory overheads are generally substantially higher than that of static
    instrumentation [6, 7].


    When monitoring large scale programs or more complex structures, the overall cost
    of monitoring can become prohibitive in time and space, particularly in resource-constrained
    environments such as mobile devices and embedded systems. Despite the popularity
    of such systems, there exists little support for monitoring execution behavior
    on the devices themselves. As an example, mobile applications are generally first
    evaluated in an emulator, and then they are later subjected to way testing for
    additional evaluation. Emulators provide an inexpensive way to evaluate applications
    on mobile phones to developers who may not have physical access. However, developers
    recognize that when building applications, it is important that the application
    is tested adequately on a real device before releasing it to users [8]. Traditional
    program monitoring approaches using static or dynamic instrumentation prohibitively
    impact the ability to monitor behavior or the devices themselves due to their
    increased memory footprints.


    As an alternative to software-based monitoring through instrumentation, recent
    advances in computer architecture have brought new opportunities for producing
    more efficient and effective software development tools. Modern-processors in
    commodity markets, mobile devices, and embedded systems include sets of hardware
    counters and monitors that were built to assist in tracking and measuring various
    aspects of program execution in situ. For example, the Intel Nehalem processor
    provides the capability to track more than 175 different kinds of execution events
    [9]. The Cortex-A8 and A9 processors, used in the iPhone 3GS, Samsung Galaxy Nexus,
    iPad2, and the Amazon Kindle Fire, have more than 50 hardware counters that can
    be exploited using a variety of tools. Mult-core processors can enable more efficient
    program analysis and modification, while hardware performance mechanisms enable
    architectural event monitoring at very low cost.


    The term hardware performance mechanism (HPM) encompasses three architectural
    concepts. The first is hardware performance counters, which are simple counters
    for architectural events. Hardware performance counters are stored in registers
    and accessible using privileged instructions. Using hardware performance counters,
    users can count the number of events that have occurred across all processor cores
    or on a single core. The second concept is that of information that can be gathered
    using a performance monitoring unit (PMU) or debugging unit, which we call hardware
    performance monitors. Hardware performance monitors gather'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'hardware snapshots of program execution based on a hardware performance counter.
    When a counter reaches a designated value, a sample of the currently executing
    instructions is taken. A sample includes current instruction, memory contents,
    the PC, etc... Finally, the third mechanism consists of more advanced debugging
    monitoring support on the processor that can monitor series of instructions at
    a time.


    Compared to instrumentation, the use of hardware mechanisms is attractive as they
    perform monitoring with very little overhead, and their use can remove the need
    for instrumentation. When monitoring hardware mechanisms, a counter and mechanism
    need only be set up once per core during test execution, and reading of them is
    inexpensive. For example, Dey et al. [10] report that the initial setup for a
    counter takes approximately 318 µs, and reading a counter value takes only 3.5
    µs on average. Setup and sampling of events is higher for more complex mechanisms
    [11]. Using hardware performance monitors in lieu of instrumentation incurs no
    code growth and does not require recompilation.


    Although the access/reading of hardware mechanisms is expensive, it is not free,
    particularly when more complex hardware mechanisms are being used. Therefore,
    a balance needs to be found between the number of times a counter is read or a
    sample is taken and the time overhead for gathering such information. In some
    software engineering tasks, as determining optimizations and performing trace
    selection, sparse samples can be used to estimate profiles or program behavior
    [12]. Other tasks, such as measuring the coverage of a test suite, rely on more
    information, necessitating more frequent sampling [13]. For example, in branch
    testing, instrumentation is used to monitor all source code branches which the
    tcher is considered and monitor only those branches. While hardware mechanisms
    tracking a particular event will observe all events of that type during program
    execution, sample data may miss infrequently executed branches. Also, the use
    of hardware mechanisms implies that samples are likely to include branches that
    are not associated with the test program such as in setup, teardown, or library
    code.


    When executing and evaluating programs, particularly those that will run in environments
    that are constrained by time or memory, techniques that are efficient in terms
    of time and memory are necessary. However, these techniques should also be effective,
    providing an accurate estimation of program execution behavior.


    This chapter presents an overview of the state of the art and practice in efficiently
    and effectively monitoring program behavior through the exploitation of hardware
    mechanisms in a variety of software engineering tasks. First,'
  merge: -1
  pgno: 61
- img_proc: true
  md: 'Exploiting Hardware Monitoring in Software Engineering


    we discuss instrumentation practices that have been used to improve the time and
    memory overheads incurred by monitoring. Then, we provide an overview of hardware
    mechanisms, how they can be used, and several challenges that must be considered
    when using hardware mechanisms in software engineering tasks. Finally, we describe
    how hardware mechanisms have been used in recent software engineering research
    and discuss future directions.


    # 2. REDUCING THE OVERHEAD OF PROGRAM MONITORING


    A number of techniques have been developed based on instrumentation in an attempt
    to reduce the overheads of program monitoring. This section presents an overview
    of common commercial tools as well as recent research in static and dynamic instrumentation
    approaches.


    The simplest aim only to measure the structural or data-flow coverage of the execution
    of a program. There is a large variety of measurement criteria: data and data-flow
    coverage, statement (line) coverage, block coverage, decision (branch) coverage,
    path coverage, function/method coverage, class coverage, and execution state space
    coverage. Among them, statement (basic block) coverage, decision coverage, function/method
    coverage, and class coverage have been implemented by some coverage tools. The
    rest remains most of interest to researchers, because of their increased complexity
    and difficulty of use. For example, practitioners in generale era do not use other
    criteria such as data coverage because it is harder to improve data coverage [14].


    The majority of existing coverage tools implement statement/block coverage, decision/function
    coverage, and class coverage. Some of these include CoverageMeter [1], BullseyeCoverage
    [15], Clover [16], gcov [17], Emma [18], JCover [19], IBM’s Rational Suite [20],
    and Covertura [21]. A comparison of these tools has been written by Yang et al.
    [22]. Each of these statistically instrument a program with probes for the entire
    extent of the tested program. Instrumentation is also placed along infeasible
    paths unnecessarily [4]. The time overhead of using instrumentation for monitoring
    branches with these tools has been reported to be, on average, between 10% and
    30%, with code growth ranging from 60% to 90% by [1]. When monitoring statement
    coverage, execution is slowed down by a factor of seven on average [6].


    Coverage testing tools can also be used for program profiling to identify heavily
    executed parts of programs with potential uses in compiler optimization, program
    refactoring, performance-related debugging, etc. Many'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'tools, including eXVantage [23], CodeTEST [24],Dynamic Code Coverage, JCover,
    PurifyPlus, and Semantic Designs [25], support this feature [22].


    Other tools exist for performing dynamic instrumentation for coverage evaluation
    or profiling. These include Pin [5], Dynryst [26], Paradigm [27], and Jazz [2,
    28]. Dynryst and Jazz appear to incur the lowest time and memory overheads when
    dynamically inserting and removing instrumentation Tikir and Hollingsworth use
    a dynamic technique for node coverage with Dynryst [6, 26]. The Dynryst dynamically
    inserts instrumentation on method invocations for node coverage. A separate thread
    periodically removes the instrumentation. This instrumentation remains until,
    even when it is not needed. They report slowdowns of 1.001–2.37 (average 1.36)
    for C programs. Memory needs


    In Jazz, a tool developed by Misurda al. [2, 28], instrumentation is similarly
    added only when needed for monitoring. In their tool, however, instrumentation
    is removed as soon as possible. Misurda reported that for their tool, JAZZ, the
    slowdown over uninstrumented code for their dynamic approach varies from 0.98
    to 1.56 with a 1.18 average slowdown when calculating branch coverage. Memory
    needs for branch execution are on par with static instrumentation techniques [2].


    Sampling has also been used in coverage and profile monitoring, without the use
    of hardware mechanisms, to improve efficiency. In work by Arnold and Ryder [29],
    instrumentation sampling is used to reduce the overhead of using complete sampling
    for profile collection. Their framework switches between instrumented and non-instrumented
    code by placing a sample condition on all method entries and backedges. A sample
    condition is checked, potentially causing the tool to execute fully instrumented
    code, based on a trigger mechanism. Using this combination of instrumented and
    noninstrumented code resulted in 90% accurate profiles with 6% overhead. However,
    because their technique doubles all methods in size, the maximum space overhead
    is the sum of the sizes of the final optimized code for all methods.


    # 3. FOUNDATIONS IN HARDWARE MONITORING


    In lieu of instrumentation, software engineering researchers are beginning to
    exploit hardware mechanisms and multicore technology for their program monitoring
    needs. In this section, we provide a brief background of a few hardware mechanisms
    available in commodity machines, a description'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'of how hardware mechanisms on multiple cores can be utilized for improved analyses,
    and tools and techniques available for hardware mechanism user-level access and
    sampling.


    # 3.1 Hardware Monitoring on Commodity Devices


    Nearly all microprocessors used in computers, tablets, and mobile devices today
    contain hardware counters. Hardware counters are a set of special-purpose registers
    built into modern microprocessors to store the counts of hardware-related activities
    within computer systems. Traditionally, hardware counters are relied upon to conduct
    low-level performance analysis or tuning, particularly within the operating system.
    The number of available hardware-counters in a processor is limited while each
    CPU model might have a lot of different events that a developer might like to
    measure. For example, the Intel Nehalem processor provides the capability to track
    more than 2000 different performance counter events, and recent linux patches
    provide user-level support for nearly 200 of these counters [9]. Each counter
    is generally programmed with the index of an event type to be monitored. On a
    single core, the CPU cycle counter and up to several additional counters can be
    monitored at once [30].


    Most commercial computers ship with two or four cores per chip, and recent mobile
    devices and tablets have two cores per chip. State-of-the-art computers and servers
    have 12 or more cores per chip. Often, these cores are left idle. Each core per
    processor has its own set of hardware mechanisms that can be leveraged during
    program execution. In current hardware implementations, each core can access only
    the hardware mechanisms associated with that core. However, as can be seen in
    Figure 1, cores on a chip have two private caches and share a cache, typically
    the L2 or L3 cache, and thus communicate with low overhead for improved monitoring
    and analysis.


    Recent research has proposed architectural enhancements to improve the efficiency
    of monitoring by enabling the program and the monitor to execute in parallel on
    separate cores [31, 32]. One architectural advancement is the addition of extraction
    logic that can observe an application executing on the core as its program state
    changes. If a state change needs to be monitored occurs, the extraction will pack
    the state change into a message and send it to one of the monitors for verification.
    In this architecture, one or more cores can be used to monitor and potentially
    share the workload, while introducing little or no intrusion to the software being
    monitored. The communication between cores can be achieved either through a dedicated'
