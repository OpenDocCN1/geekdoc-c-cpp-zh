    # 2.3 Identification of Logical Web Pages


    The UML or FSM navigation model may explode in the presence of dynamically generated
    pages, whose content vary depending on the user input and

    on the application state. Hence, to construct models of reasonable size, concrete
    pages encountered during navigation are mapped to LWP by means

    ab abstraction function $abs$, that $lp = abs(p)$, with $lp$ the LWP and p a

    concrete page encountered during navigation. Several approaches have

    been proposed to automate such mapping [40, 46, 48]. They can be

    classified as follows:


    +   URL abstraction: Each concrete URL is mapped to an abstract URL\and two concrete
    pages are regarded as the same LWP if they have the

    same abstract URL.


    +   Textual similarity:Similarity metrics are computed by comparing the

    textual information contained in two concrete web pages and when

    s similarity is above a given, user defined threshold, the two pages are

    mapped to the same LWP.


    +   Structural similarity: The HTML structure of two concrete pages

    compared, using tree matching algorithms, and when their similarity is

    above a given, user defined threshold, the two pages are mapped to the

    same LWP.


    URL abstraction is a simple technique, that works well in practice

    [48], but it has limitations that should be taken into account. Usually,

    URL abstraction is achieved by discarding some of the URL elements. For

    instance, an abstract URL can be defined as the initial LWP with all concrete

    parameter values removed (this means that parameter names are kept, while

    values are discarded). Sometimes the discarded elements might be useful to

    distinguish different LWP. For instance, the dispatcher pattern is used

    to implement a web application, all pages come with the same URL and

    differ by page identifier. If the concrete value of the page identifier is

    discarded by URL abstraction, all pages collapse into a single LWP. By introducing
    ad hoc corrections for such cases (e.g., keeping some concrete values

    that are helpful to discriminate LWPs), URL abstraction is a simple and quite

    accurate technique.'
