    The transformations integrate specific information to produce adequate code, in
    particular by following the target programming languages paradigms (object-orientation
    for JavaCard, algebraic specifications for ASMs). In particular the specific built-in
    data types and values, the configuration settings, the serialization mechanism
    for protocol exchange messages, the encryption/decryption algorithms, among other
    implementation details, are taken into consideration.


    From these models, MMT techniques are used for generating the actual code necessary
    for execution and verification. These transformations are implemented with XPAND,
