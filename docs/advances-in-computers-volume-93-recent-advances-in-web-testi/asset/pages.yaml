    # 3.2.5 Symbolic Execution and Constraint Solving Techniques


    The approach proposed by Artzi et al. [4] combines dynamic analysis, symbolic
    execution (a static analysis that treats input variables as symbolic variables
    [24]) and constraint solving (the process of finding a solution to a set of constraints
    that the variables must satisfy [47]) for automatically generating input values
    for PHP applications. The testing approach dynamic symbolic execution or con testing
    [43] is applied to web applications. The web application under test is first executed
    with an initial concrete input (i.e., an empty or randomly chosen input) and then
    on additional inputs obtained by solving the constraints generated by a symbolic
    execution engine. In detail, during each execution, the server side code of the
    web application is monitored to record path constraints (i.e., the set of constraints
    on symbolic input variables encountered in the code during the execution). Then,
    the system implementing this approach iteratively creates new inputs by negating
    each of the constraints in the path condition and by solving the modified constraints.
    The newly created input values explore a different path in the control flow graph,
    diversifying the tests that are generated.


