    # 5. RICH CLIENT


    Modern client-side scripting languages (e.g., Javascript, Actionscript) allow
    developers to implement Rich Internet Applications (in short RIAs). RIAs are web
    applications having advanced, sophisticated, and interactive user-interfaces that
    cannot be realized using the traditional web paradigm. Figure 9 visually summarizes
    the main differences between traditional (synchronous) and modern (asynchronous)
    web applications based on the Ajax technology [50]. The traditional web paradigm
