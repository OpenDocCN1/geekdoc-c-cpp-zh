    phase. Hence, picking an input that covers the change has a rather small chance
    of causing a difference.


    In many cases, an adequate test suite for the simple-change strategy exercises
    only a fraction of all dependence chains along which a change may propagate. Because
    the effects of a change can propagate forward along any of the chains starting
