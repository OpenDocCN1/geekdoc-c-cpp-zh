    **Separation of Security from Business.** Separation of Concerns (SoC), a well-accepted
    design principle in computer science, consists of dividing a system into distinct
    features (aspects) that are ideally loosely coupled, i.e. their functionalities
    overlap minimally [60]. Security is a good example:ideally,security concerns should
    not interfere with other functionalities, but rather complete them [97]. Most
    of the MDS approaches follow this principle [88], especially when a generative
    approach like MDS is used: platform-independent models are designed for business
    and security separately, transformed into platform-specific models from which
    the security infrastructure is integrated directly in the system application logic.
    This entry covers in fact two points: whether each concern is separated from the
    other and until when, and how the integration is performed.


    **ModelTransformations.** ModelTransformation is the key ingredient for bridging
    models with the final code that will ultimately be executed. Its main advantage
    resides in the fact that it processes tedious and error-prone maneuvers on models
    or code, and can be easily repeated if modifications of models are necessary.
    It is especially important when different models need to be integrated (in the
    context of SoC), but also for ensuring consistency between models, and correct
    refinement of code.


    This entry relates to the transformations which are used in the engineering process:
    Model-To-Model Transformation (MMT) normally serve the purpose (but are not restricted
