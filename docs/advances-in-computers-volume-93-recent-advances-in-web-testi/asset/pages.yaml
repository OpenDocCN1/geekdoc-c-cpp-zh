  md: '# 2.2.4 Aspect-Oriented Modeling


    In Mrs, when specified in isolation, security models can be composed into a business
    model (or target model) using Aspect-Oriented Modeling (AoM) techniques.


    Modularization of crosscutting concerns has been popularized by the Aspect J language
    [5], but there is a growing interest in also handling them earlier in the software
    life-cycle, for instance at design time [23], or during requirements analysis
    [45]. Aspect-Oriented Development (AoSD) follows the well-known Roman principle
    of divide and conquer. In put another way, separation of concerns is a long-standing
    idea that simply means a large problem is easier to manage if it can be broken
    into pieces; particularly so if the solutions to the sub-problems can be combined
    for a solution to the large problem. More specifically, AoSD aims at addressing
    crosscutting concerns (such as security, synchronization, concurrency, persistence,
    response time, among others) by providing means for their systematic integration,
    separation, representation, and composition. Crosscutting concerns are encapsulated
    in separate modules, known as aspects. Once the different aspects are specified,
    they can be assembled to build the whole application. This mechanism of integration
    is called weaving. Generally, the weaving process is decomposed into two phases:
    a phase of detection, where a part of an aspect (called pointcut) is used as a
    predicate to find all the areas in a model (called base model) where the aspects
    have to be woven; and a composition phase, where a second part of the aspect (called
    advice) is composed or merged with the base model at the previously detected areas
    (called join points).


    Currently several techniques exist to represent, compose or weave aspects at a
    modeling level. Clarke and Baniass [24] define an approach called Theme/UML. It
    introduces a theme module that can be used to represent a concern at the modeling
    level. Themes are declaratively complete units of modularization, in which any
    of the diagrams available in the UML can be used to model one view of the structure
    and behave the concern requires to execute.


    France et. [34] and Reddy et al. [90] propose a symmetric model composition technique
    that supports composition of model elements that present different views of the
    same concept. This composition technique has been implemented in a tool called
    Kompose. The model elements to be composed must be of the same syntactic type,
    that is, they must be instances of the same metamodel class. An aspect view may
    also describe a concept that is not present in a target model, and vice versa.
    In these'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'cases, the model elements are included in the composed model. The process of
    identifying model elements to compose is called element matching. To support automated
    element matching, each element type (i.e. the elements meta-model class) is associated
    with a signature type that determines the uniqueness of elements in the type space:
    two elements with equivalent signatures represent the same concept and thus are
    composed.


    Similar contributions follow the same lines and specific weaving techniques: either
    based on behavioral aspects [102, 27, 61, 62], or on generic weavers that can
    be applied to any modeling language with a well-defined model: e.g. MATA [103],
    SmartAdapter [82], or Geko [65, 83]. Finally, advanced mechanisms have been proposed
    to weave an unaspect previously woven [63], to finely tune the weaving [84], or
    to weave aspect (or view) instances of different metamodels [10].


    # 3. MODEL-DRIVEN SECURITY


    Model-Driven Security (MDS) can be seen as a specialization of MDE for supporting
    the development of security-critical applications. MDS use of the conceptual approach
    of MDE as well as its associated techniques and tools to propose methods for the
    engineering of security-critical applications. More specifically, models are the
    central artifacts in every MDE approach. Besides being used to describe the system''s
    business logic, they are used extensively to capture security concerns. Models
    allow the introduction and enforcement of security in the application being built.


    In this section, we start going back to the roots of MDS to see how it was perceived
    by the authors who introduced it in the first place. We then propose a taxonomy
    for MDS which we use in this text to evaluate different MDS approaches in the
    literature.


    # 3.1 A Brief History of MDS


    Contributions provided early tentative definitions for MDS. We review them to
    extract their common features.


    Jürgens [47] started a pioneering work in the domain of MDS with his approach
    UMLSEC. Based on UML extensions, UMLSEC combines several diagrams for modeling
    and analyzing systems: class diagrams for the static structure, statecharts for
    the dynamic behavior, interaction diagrams for object interactions within distributed
    systems, and deployment diagrams to enforce security in the target platform. Although
    the approach does not explicitly mention the idea of MDE, it had from the beginning
    vision'
