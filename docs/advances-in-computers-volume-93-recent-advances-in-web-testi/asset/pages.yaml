    finally Section 7 concludes with potential challenges for MDS.


    # 2. MODEL-DRIVEN ENGINEERING


    Model-Driven Engineering (MDE) encompasses both a set of tools and a loose methodological
    approach to the development of software. The claim'
  merge: -1
  pgno: 109
- img_proc: true
  md: '106


    behind Model-Driven Engineering is that by building and abstractions of the processes
    the software engineer is trying to automate, the produced software will be of
    better quality than by using a general purpose programming language (GP). The
    reasoning behind this claim is that abstractions of concepts and processes manipulating
    these concepts are easier to understand, verify, and simulate computer programs.
    The reason for that is that those abstractions are close to the domain addressed
    by the engineers, whereas general GPLs are built essentially to manipulate computer
    architecture concepts.


    # 2.1 Models, Metamodels, and Model Transformations


    The central artifact in MDE is the model. A model in the computing world is a
    simplification of a process one wishes to capture or automate. The simplification
    is that does not take into account details that can be overseen at a given stage
    of the engineering cycle. The purpose is to focus on the relevant concepts at
    hand—much as example a plaster model of a car for studying aerodynamics will not
    take into account the real materials of a car is made of.


    In the computing world a model is defined by using a given language. Coming back
    to the car analogy, if an engineer wishes to have a computational model of a car
    for 3D visualization, a language such as the one defined by a Computer Assisted
    Design (CAD) tool will be necessary to express a particular car design. In the
    computing world such languages—called metamodels—are used to describe families
    of models of computational artifacts that share the same abstractions. Each metamodel
    is a language (called formalism) that have many model instantiations, much as
    in a CAD tool many different cars can be described.


    The missing piece in this set of concepts is Model Transformations. Model transformations,
    as illustrated in Fig. 1, allow passing relevant information from one modeling
    framework to another and, according to [95] the “heart and soul of model-driven
    software development.” Model transformations have been studied from a theoretical
    point of view for a number of years (e.g. the work of [31]), but only recently
    have become a first class citizen in the software development world. Their need
    came naturally with the fact that MDE was used to be professionally used in certain
    areas such as mobile telephony or the automotive industry. Implementations for
    transformation languages such as ATL [11], Kermeta [86], or QVT [30] have been
    developed in the last few years and provide stable platforms for writing and executing
    model transformations.'
