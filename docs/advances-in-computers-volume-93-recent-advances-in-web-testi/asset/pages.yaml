    # Modeling Approach. As already stated, MDS is a specialization of MDE: it becomes
    natural to classify MDS approaches paradigm and modeling languages. The modeling
    paradigm addresses the general principle for representing, managing, and combining
    models. For example for standard UML modeling, cross-cutting concerns are scattered
    across related models, and are then combined at different levels, such as typically
    the case in MDA. Aspect-Oriented Modeling (AOM) advocates a clear separation of
    concerns that are subsequently woven into a primary model using a set of modeling
    rules, obtaining a full model before full code generation. Domain Specific Modeling
    (DSM) is another slightly different approach, where each model captures specifically
    the knowledge of a subject domain, that can eventually be cross-cutting. Multi-Paradigm
    Modeling (MPM) can be seen as an extension of DSM, where different models of modeling
    coexist in a controlled, modeled way. Those paradigms are not completely disjoint,
    but share many features and it is sometimes difficult to distinguish between them,
    and we often rely on the authors'' statements to tag an approach with an underlying
    modeling paradigm.


    There exist in MDE a plethora of modeling languages, and this richness is directly
    reflected in MDS: standard UML diagrams; UML profiles; tailored DSLs; or formal
    specification languages (e.g. Petri nets). [88], standard UML and UML profiles
    are the most commonly used in the literature, undoubtedly due to UML''s reach
    within the modeling and engineering communities. Nonetheless, several researchers
    make use of DSLs with the goal of achieving more customized modeling capabilities.
    Formal specification languages are not so much represented, most probably because
    they are perceived as difficult to integrate with standard engineering tools,
