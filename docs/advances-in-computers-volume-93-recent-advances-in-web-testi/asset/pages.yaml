  md: "# Procedure COMPUTEEFFECTS\n\nInputs: *P*: program; C: change\n\n**Output**:\
    \ effects: map program $\rightarrow$ dependence chain $\rightarrow$ conditions\n\
    \n```\n(1) P' := applyChain(P, C)\n(2) foreach program { P, P' }\n(3) altProgram\
    \ := P' if program is P ; otherwise\n(4) chainWorklist := createEmptyChains(program,\
    \ change)\n(5) foreach emptyChain in chainWorklist\n(6) effects[emptyChain] :=\
    \ reachingCondition(program, start(emptyChain))\n(7) // incremental computation\
    \ of conditions\n(8) while chainWorklist $\neq \\emptyset$\n(9) prefixChain :=\
    \ pop(chainWorklist)\n(10) foreach dep in nextDependencies(program, prefixChain)\n\
    (11) chain := append(prefixChain, dep)\n // chain conditions\n(12) depCode :=\
    \ overCondition(program, prefixChain, dep)\n(13) chainCode := effects[program][chain]\
    \ $\\wedge$ depCode\n // state conditions\n(14) (S, S_{alt}) := PSE_Dep(dep, altProgram,\
    \ dep)\n(15) stateCode := live(S) $\neq$ live($S_{alt}$) $\\vee$ pc(S) $\\wedge$\
    \ $\neg$ pc($S_{alt}$)\n(16) effects[program][chain] := chainCode $\\wedge$ stateCode\n\
    (17) push(chainWorklist, chain)\n(18) endfor\n(19) endwhile\n(20) endfor\n(21)\
