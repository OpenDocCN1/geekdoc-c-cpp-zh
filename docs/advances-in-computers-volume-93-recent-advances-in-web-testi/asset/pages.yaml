    #  2.2.1 Model-Driven Architecture


    Model-Driven Architecture (MDA) is an OMG proposal launched in 2001 to help standardize
    model definitions, and favor model exchanges and compatibility. The MDA consists
    of the following points [64]:


    +   • It builds on the UML, an already standardized and well-accepted notation,
    already used in Object-Oriented systems. In an effort to harmonize notations and
    clean the UML’s internal structure, Meta-Object Facility (MoF) was proposed for
    coping with the plethora of model definitions and languages;


    +   • It proposes a pyramidal construction of models as can be observed in Fig.
    2: artifacts populating the level M0 represents the actual system; those in the
    M1 level are metamodel ones; artifacts belonging to the M2 level are metamodels,
    allowing the definition of M1 models; and finally, the unique artifact at the
    M3 level is MoF itself, considered as meta-circularly defined a model itself;


    +   • Along with this pyramid, MDA enforces a particular vision of software systems
    development seen as a process with the following steps (Fig. 3): requirements
    are collected in a Computation Independent Model (CIM), independently of how the
    system will be ultimately implemented; then a Platform Independent Model (PIM)
    describes the design and analysis


    ![](img/0263f26030aa28a04646b4ed98260212_112_0.png)


    **Fig. 2. The MDA pyramid.** (adapted from [100]).'
