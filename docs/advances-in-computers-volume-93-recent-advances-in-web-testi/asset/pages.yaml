    59, 63, 79, 94]. These techniques use control flow or dependencies but ignore
    the states under which changes create an impact. For comprehensive surveys of
    the literature on CIA, we refer to References [18, 41, 43].


    We classify CIA techniques into two categories: predictive and descriptive. Predictive
    impact analyses (e.g., [5, 13, 14]) identify potential effects of changing a particular
    program location, such as a statement or method,'
