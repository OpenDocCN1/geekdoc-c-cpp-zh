    # ABOUT THE AUTHORS


    Raul Santelices is an Assistant Professor in the Computer Science and Engineering
    Department at the University of Notre Dame in the US. In the past, he was a software
    architect in educational and video games ventures. His academic interests are
    software engineering in general and program analysis in software testing, debugging,
    and evolution. He received the Best Paper and ACM SIGSOFT Distinguished Paper
    awards at the IEEE/ACM International Conference on Automated Software Engineering
    in 2008. His work is partially funded by the Office of Naval Research in the US.


    Yiji Zhang is a Ph.D. student in Computer Science at the University of Notre Dame
    in the US. Her research interest is in software engineering, specifically on probabilistic
    models of program behavior for program slicing and fault localization. She obtained
    a B.E. in Software Engineering at Zhejiang University in China.


    Haipeng Cai is a Ph.D. student in Computer Science at the University of Notre
    Dame in the US. He worked on computer graphics and visualizations during his previous
    graduate studies and was a software developer in internet search services and
    embedded systems. His current research interests are in software engineering with
    emphasis on program analysis. He obtained his M.S. degree in Computer Science
    from The University of Southern Mississippi.


    Siyuan Jian is a Ph.D. student in Computer Science at the University of Notre
    Dame in the US. Her research interest is in software engineering, specifically
    on dynamic slicing, change-impact quantification, and dynamic symbolic execution.
    She obtained her M.S. and B.E. degrees in Software Engineering at East China Normal
    University and Tongji University in China, respectively.'
