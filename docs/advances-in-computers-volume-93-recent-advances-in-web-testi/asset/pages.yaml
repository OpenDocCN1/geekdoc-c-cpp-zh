  md: '# Hardware Monitoring for Statement Testing


    To achieve the goal of exploiting hardware mechanisms for statement coverage,
    two common hardware mechanisms can be used for sampling are examined. After selecting
    a mechanism, the time and code growth overheads that sampling incurs and the level
    of statement coverage that can be observed during sampling is analyzed. Finally,
    additional information that can be obtained while monitoring test execution is
    demonstrated and discussed with its potential usage within work.


    THeME is executed on the system described in Section 4.3.1.4, and the same test
    applications are used as described in Section 4.3.1.4. The infrastructure of THeME
    is simplified for the coverage technique, as shown in Fig. 12. Because hardware
    mechanisms are used to observe statements rather than branches, no program modification
    is necessary. The program’s binary is first analyzed to record all statements
    that may be executed. Debugging information is used to generate a table of statements,
    relating back to the source code. Then the table and program are passed to the
    hardware-level monitor for program execution. Upon completion, the updated table
    is analyzed to calculate the overall statement coverage of our tests. The static
    compiler analysis component present in Section 4.3.1 is removed. This was done
    for two reasons: First, the removal allows for a more accurate observation of
    the level of statement coverage monitoring alone can discover. Second, in most
    resource-constrained devices, no compiler or build tools are available on the
    system. Thus, this revision to THeME precisely matches the statement coverage
    levels that could be observed on such devices.


    The efficiency of the infrastructure is calculated based on the base run times
    of benchmark execution reported by the execution tool of the SPEC 2006 benchmarks,
    runspec. All timing results are compared to the overheads from execution of full-instrumented
    versions of the benchmarks. Gov [17] was used to generate the instrumented benchmarks.
    The effectiveness of the infrastructure is analyzed based on statement coverage.


