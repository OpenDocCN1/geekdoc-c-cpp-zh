    **Definition 2.** An interprocedural control-flow graph (ICFG) for a program P
    is a connected directed graph $G^P = (V^P, E^P)$ where $V^P$ is the union of the
    node sets of the CFGs of all procedures P and $E^P = (E_{cfg} - E_{cr}) \cup E_{inter}$,


    +   * $E_{cfg}$ is the union of all edge sets of CFGs of all procedures,

    * $E_{cr}$ is the set of all edges connecting call nodes to return nodes,

    * $E_{inter}$ is the set of all edges $(c, EN_p)$ and return edges $(EX_p, r)$
    connecting the calling node and return nodes for all call sites in P to the procedures
    $p$ that they call.


