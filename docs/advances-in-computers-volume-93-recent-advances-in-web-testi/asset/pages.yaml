    (MTT) are traditionally used for generating textual artifacts from models, in
    particular code, test cases, etc.


    **Verification.** After deriving a number of security properties from security
    requirements, a key issue is how to make those properties hold on the artifacts
    generated by the MDS approach.


    Ideally, a model at a given level of abstraction during an MDS process is executable.
    By executable we mean that the model has well understood operational semantics
    and can be interpreted by a model checker or the theorem prover that properties
    about it can be formally shown. At the lowest level of abstraction the generated
    code and system infrastructure are by definition executable since they are built
    to run on a specific platform.


