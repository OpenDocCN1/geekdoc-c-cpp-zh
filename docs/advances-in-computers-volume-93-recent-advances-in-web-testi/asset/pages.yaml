    The effects of changes can also be approximated as quantities denoting the degree
    of influence of changes on individual lines of code. The resulting technique,
    quantitative slicing, promises increases in the usefulness of program slices.
    Rather than pruning statements from slices, q-slicing grades statements according
    to their relevance to a slice. In this chapter, we discussed two approaches to
    q-slicing, including a novel dynamic technique for computing relevance scores.
    More techniques can be added under the umbrella of q-slicing. The possibilities
    are many for quantifying slices in better ways and for improving other applications,
    such as debugging. Q-slicing is an emerging, rich, and open field.


    # 10. FUTURE DIRECTIONS


    At the foundational level, our definitions in this chapter can lead to new ways
    to compute how changes propagate through software components, including not only
    code but also data (e.g., databases, files). New theories can be developed as
    an extension of these foundations that better suit in concurrent and data-driven
    software. (Our foundations support virtually all types of code, as long as it
    is possible to capture all sources of uncertainty as inputs). Also, we envision
    the opportunity of using our foundations to define a framework for the specification
    of formal semantics of programming languages., much like existing formal semantics
    of programming


    The techniques presented in this chapter for computing testing requirements are
    by the only ways in which the effects of changes can be approximated. For example,
    various heuristics can be used to identify and prioritize clusters of the effects
    to focus the testing efforts on the areas that are most likely or most impacted
    by these changes. On the experimental side, it is necessary to investigate the
    ability of change-testing techniques to not only reveal the observable differences
    in the behavior of software caused by changes but also to detect any errors introduced
    by those changes. Finding differences caused by changes is always a difficult
    task and, therefore, cost-effective techniques such as those we presented are
    needed to find many differences as possible as a requisite for detecting change-related
    errors.'
