    approach to online analyses for fault localization. Figure 20 presents our proposed
    deep dynamic inspection (DDI) technique. The goal of this approach is to provide
    an efficient lightweight technique for partially automated soft- fault localization.
    The programmer only needs to identify a region of suspicious code, and upon an
    error, our DDI analysis leverages hardware performance mechanisms, namely the
    LBR, to report the path that leads to the error with negligible runtime


    There are two classes of information reported by DDI: concrete path information
    and fuzzy path information. The concrete path that leads to the error presents
    a complete path limited by the instantaneous size of the branch trace collected
    at the time of the error. Fuzzy path information provides longer probable paths
    using a reverse dynamic trigger injection technique.


    As shown in Fig. 20, a hardware monitor (HPM) trigger is injected into the suspicious
    basic block. This trigger is tripped when the suspicious block is executed, and
    the contents of the LBR are immediately collected. The contents of the LBR at
    this point provide a concrete path'
