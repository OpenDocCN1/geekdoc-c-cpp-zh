  md: '# 2.2 Decision Making and Multi-Criteria Decision Analysis


    Decision Making is the study of identifying and selecting alternatives based on
    how well they satisfy the needs, requirements, goals, expectations, etc. of a
    person responsible for this task (referred to as a decision maker) [36]. Frequently,
    in real life the task is not easy, so Multi-Criteria Decision Analysis (MCDA)
    proposes several methods that support decision making. MCDA [45, 72] involves
    modeling the preferences of decision makers onto multiple, usually conflicting,
    decision criteria. The preference models can be used for evaluation, prioritization,
    or selection of the available alternatives characterized by the multiple criteria,
    which provides some aid, prompt, or hint for a human who takes the final decision.


    # 2.2.1 Multi-Criteria Decision Problem


    We formulate the multi-criteria decision problem MDP, also known as decision goal,
    as a tuple MDP = (A*, V, Π), where A* refers to a set of alternatives considered
    in decision making, V refers to a set of viewpoints in the decision problem, and
    Π refers to the purpose of decision making..


    # Alternative A*


    An alternative, or more generally, a potential action, is the object of the decision
    or the object toward which decision support is directed. The concept of alternative
    corresponds to a particular case where potential actions cannot be performed conjointly.
    In other words, the concept of an alternative implies that alternatives considered
    in the decision process are mutually exclusive. Moreover, alternatives are assumed
    to be independent in the sense that the evaluation of one alternative not influence
    the evaluation of the others. Hwang and Yoon [39] distinguish between two classes
    of decision situations with respect to the number of alternatives: Multiply Attribute
    Decision Making (MADM), with a limited set of alternatives, and Multiple Objective
    Decision Making (MODM), with a continuous set of possible alternatives. The software
    quality assessment problem corresponds to MADM with a finite number of alternatives
    (i.e., software artifacts).


    # Viewpoint V


    Viewpoint refers to the perception of the decision problem and depends on the
    actors involved in the decision-making process, the so-called Decision Makers.'
