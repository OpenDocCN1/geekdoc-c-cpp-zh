  md: '# 4.2 Crawlability Metrics


    Web crawlers are tools that try to explore as much as possible of a target web
    application. The possibility for a crawler to explore a web application exhaustively
    depends on the input data it provides when forms are encountered. In fact, some
    portions of a web application can be navigated only if the crawler has the capability
    to provide input data that satisfy certain constraints (e.g., values that pass
    client/server side input validation, which would otherwise block the user navigation
    at the current page).


    Automated crawlers may leave large portions of a web application unexplored, if
    they are not able to generate proper input values. As a consequence, the web application
    model constructed from the crawled pages may be largely incomplete and limited
    portion of the entire web application. Crawlability metrics have been introduced
    [28] to predict whether forms exist in the currently available web model for which
    the crawler capabilities are not enough to achieve full exploration of the conceptual
    pages reachable from such. Hence, by crawlability we indicate the property of
    a form (and by extension of a web application) to be fully traversed by an automated
    crawler with given capabilities. Crawlability metrics attempt to quantify such
    a property.


    The crawlability of a web application measures how easy it is for crawler to explore
    all its conceptual pages [28] (we consider conceptual and not concrete pages,
    because the latter may be unlimited in number and differ by just minor, irrelevant
    elements). The main source of difficulty in the exploration of a web application
    comes from forms and the input data they accept. In fact, only input data specifying
    constraints allow the crawler to visit certain conceptual web pages. Crawlability
    cannot be measured precisely, unless the conceptual model of the web application
    is fully known in advance, which makes crawlability measurement useless for practical
    purposes. Hence, we resort to crawlability metrics, which provide approximate
    estimates of the actual crawlability of a web application and its forms. For this
    reason, crawlability metrics are also called crawlability indicators.


    As shown in Fig. 7, crawlability indicators are computed by analyzing both the
    server and the client code associated with a form. Such indicators can be used
    to identify the automated input generation effort on those forms that are associated
    with low values of the crawlability indicators (see activity (5a) in Fig. 7).
    They can also be used to provide the tester with a ranked list of the forms being
    explored. At the top of the ranked list will be the forms having low crawlability
    indicators. Then, manually crafted input data can be provided by the tester (activity
    (6)), so as to ensure that these'
