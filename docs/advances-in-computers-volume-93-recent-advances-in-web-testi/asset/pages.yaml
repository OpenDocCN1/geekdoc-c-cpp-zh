    changes to reduce the scenario in which users query for the consequences

    of changing those locations would have. Then, for each q-slice given by

    SenSA, we ranked its statements from greatest to lowest score. For compar-ison,
    we also ranked the static slices using Weiser''s approach [90] by visiting

    statements in breadth-first from the change location and sorting them'
