    # 3.3 Procedure for Evaluating MCDA Methods


    In order to support the purpose of SQA, an MCDA method must be applicable in the
    context of SQA and fulfill the requirements of its potential users. In order to
    evaluate the suitability of existing MCDA methods for the purpose of SQA, we first
    identified a set of relevant evaluation criteria and then evaluated the most popular
    MCDA methods using these criteria. In this section, we present the procedure used
    for selecting the relevant criteria and for evaluating the MCDA methods.


    # 3.3.1 Evaluation Criteria


    We defined evaluation criteria as a synthesis of (a) constraints on using MCDA
    for the purpose of SQA and (b) user requirements regarding SQA.


    # Constraints on Using MCDA for the Purpose of SQA


