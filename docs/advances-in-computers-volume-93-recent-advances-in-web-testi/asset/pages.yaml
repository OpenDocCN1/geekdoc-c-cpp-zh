  md: '# 7.1 Overview


    To circumvent the limitations of the original version of MATRIX, the demand-driven
    approach for testing changes using the CHAIN and PROP strategies. This approach
    requires only static and dynamic dependence analysis and runtime state monitoring,
    in contrast with MATRIX, which requires symbolic execution of all paths that can
    propagate a change and the enumeration of all dependence chains within a distance
    limit. Instead of computing all test requirements beforehand, the approach identifies
    the unsatisfied test requirements that lie at the frontier of the test requirements
    already satisfied. Although the propagation conditions are no longer expressed
    symbolically in the approach,instead of solving the constraints, testers must
    ensure the propagation of an infection via a difference in state or divergence
    in paths.


    Given a test TS, a frontier test requirement for CHAIN is a dependence that is
    covered by TS up to, excluding, its last dependence. For PROP, a frontier test
    requirement for TS is a dependence and its propagation conditions such that either
    the chain is a frontier test requirement for CHAIN or the propagation condition
    for the last dependence of the chain is not satisfied by TS. Consequently, the
    set of unsatisfied test requirements for test TS is the union of the frontier
    test requirements for TS and every other test requirement whose chain extends
    the chain of some frontier requirement.


    To illustrate, we use trees to depict the satisfied and frontier test requirements
    for changes. A chain tree is a tree root node represents a change and each other
    node represents the pair of a dependence and its propagation condition. Each pair
    is part of a satisfied test requirement or the end of a frontier test requirement.
    A node at the end of a frontier test requirement is called frontier node and is
    a leaf in the chain tree. The root node is annotated with the corresponding dependence
    and propagation condition. For Chain, the propagation condition is omitted.) Each
    edge (u, v) in a chain tree indicates the dependence and propagation condition
    for node u (or the change, if u is the root) are followed by the dependence and
    propagation condition for node v in some test requirement. Therefore, the PDG
    node of the dependence for u is the source PDG node of the dependence for v.


    Consider, for example, program Bin and change C1 from Fig. 1,and strategy CHAIN.
    Before any test execute,the chain tree for C1 in Bin consists of only one node—the
    frontier node for change C1 in statement 1.'
