    # 7.3 Comprehensive Study


    The demand-driven nature of this approach allowed for a more comprehensive study
    than for MATRIX. For this study, we used DUA-FENICS [80] again and we considered
    Java subjects for a large number of test cases are available. Those pools of test
    cases allowed us to create up to 1000 test suites for each technique studied.
    Between a number of subjects from the Siemens suite [34] that we translated to
    Java and three versions of NanoXML [20], we studied a total of 62 changes. For
    complete details of this study, we refer to References [77, 78].


    For each change, we computed and measured the difference-detection ability of
    each strategy—STMT, BR, DU, CHAIN, and PROP—to output differences. Such give developers
    a view of the behavior of change. Our metric of quality of the test suite is the
    ratio of the test suite. Thus, the best possible value of it is 1.0.


    To support our analysis of the factors affecting the effectiveness of each strategy,
    we defined the detectability of a change as the difference-detection ratio for
    STMT on that change. The detectability of a change is the estimated probability
    that a test case that covers the change also reveals an output difference. The
    lower the detectability of a change, the less likely it is that a test case reveals
    a difference for that change and, thus, the greater is the difficulty of testing
    that change successfully.


    Table 5 shows the average detection ratios for all strategies, up to distance
    10 for CHAIN and PROP. For all cases, a distance of 10 or more was achieved for
    the latter two strategies. Therefore, distance 10 is the maximum distance for
    which we obtained results for all changes. In this, DU was slightly more effective
    per test than BR, which had no significant improvement over STMT. CHAIN has a
    consistently greater cost-effectiveness on average than those three coverage-based
    strategies, although the difference is not great. PROP, however, did considerably
    better than all other strategies, including CHAIN, for all distances with statistical
    significance. Interestingly, PROP peaks at distance 4 and decreases to some extent,
    suggesting that the best distribution of test cases can be achieved early. Nevertheless,'
