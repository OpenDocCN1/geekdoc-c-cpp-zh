  md: '# Adapting Multi-Criteria Decision Analysis for Assessing the Quality of Software
    Products


    +   * Indifference (I): Situation in which there are clear reasons that justify
    equivalence between the two alternatives. In terms of indifference and preference
    thresholds, alternative b is indifferent to alternative a in terms of criterion
    g if:


    ```

    $g(a) \leq g(b) + q[g(b)]$ and $g(a) \leq g(b) + p[g(b)]$

    ```


    Indifference is a reflexive and symmetric binary relation.


    +   * Weak preference (Q): Situation in which there are clear reasons that justify
    strict preference in favor of one of the two alternatives, but the reasons are
    insufficient and do not allow deducing strict preference in favor of the other
    alternative or indifference between both. In terms of indifference and preference
    thresholds, alternative a is weakly preferred to alternative b in terms of criterion
    g if:


    ```

    $g(a) > g(b) + q[g(b)]$

    ```


    Week preference is a non-reflexive and asymmetric binary relation.


    +   * Strict preference (P): Situation in which there are clear reasons in favor
    of one of the two alternatives. In terms of indifference and preference thresholds,
    alternative a is strictly preferred to alternative b in terms of criterion g if:


    ```

    $g(a) > g(b) + p[g(b)]$

    ```


    Strict preference is a non-reflexive and asymmetric binary relation.


    +   * Incomparability (R): Situation in which there are no clear reasons for justifying
    any of the three preceding relations. Incomparability is a non-reflexive and symmetric
    binary relation.


    Basic preference relations can be grouped into more comprehensive preference relations.
    A well-known example of a comprehensive preference relation is the Outranking
    relation $S = P \cup Q \cup I$, where for any pair of decision alternatives $(a,
    b) \in A \times A$, $aS$ means “a is at least good as b”. Outranking is a non-transitive,
    reflexive, and asymmetric binary relation.


