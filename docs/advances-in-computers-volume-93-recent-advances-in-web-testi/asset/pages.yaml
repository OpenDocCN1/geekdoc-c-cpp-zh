    Identification of LWP based on textual or structural similarity does not rely
    on the URL used to request a page. This can be useful when the URL is not much
    informative or when it cannot discriminate pages that should be actually regarded
    as logically different. The textual similarity between pages can be measured by
    computing their string edit distance [6] and then turning the edit distance into
    a similarity value normalized between 0 and 1. Given two strings $s1$ and $s2$,
    their edit distance is the minimum number of character insertion/deletion operations
    that make the two strings equal. For instance, the strings:


    +   * $s1 = "aabbcc"

    * $s2 = "agbcc"


    we have $dist(s1, s2) = 3$, since in $s1$ the second character "a" must be replaced
    by "g" (one deletion + 1 insertion) and one character "b" must be deleted, in
    order to make the two strings equal. The edit distance can be converted to a similarity
    metrics between 0 and 1 as follows:


    > $sim(s1, s2) = 1 - dist(s1, s2)/(length(s1) + length(s2)).$$


    This similarity metrics measures the proportion of characters that two strings
    have in common. In our example $sim(s1, s2) = 1-3/11 = 8/11$ (8 characters are
    common in the two strings $s1, s2$.


    Structural similarity is also based on the edit distance, computed on the parse
    trees of the HTML code of the two pages being compared. The distance between two
    trees can be defined as the minimum number of node deletions and insertions that
    are necessary to make the two trees equal [6]. For the following trees, $t_1,
    t_2$:


    ![](img/0263f26030aa28a04646b4ed98260212_22_0.png)


    we have $dist(t_1, t_2) = 3$, since node $K$ must be inserted into $t_1$ and node
    $A$ must be replaced by $B$. Once the edit distance is available, we can easily
    convert it to a similarity metrics:


    > $sim(t_1, t_2) = 1 - dist(t_1, t_2)/(size(t_1) + size(t_2)),$$'
