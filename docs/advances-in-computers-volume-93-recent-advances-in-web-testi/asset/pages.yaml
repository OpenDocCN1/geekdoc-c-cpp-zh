    # 8. APPLICATION: QUANTITATIVE CHANGE-IMPACT ANALYSIS


    A major problem of program analyses is their, manifested in an excess of false
    positives (false alarms) or false negatives (missed targets) or both. Program
    slicing [90] is one analysis that is popular but also imprecise. Static slicing
    often reports many potentially relevant statements, whereas dynamic slicing—a
    variant that trades completeness for precision—can produce many false positives
    [45, 79]. To increase the precision of static slicing by reducing the size of
    slices, researchers have proposed combining static and dynamic slicing (e.g.,
    [37]) and pruning slices based on some criterion (e.g., [84, 95]). However, these
    methods can suffer from false positives and even false negatives. Other attempts
    to improve this precision include better alias and points-to-analyses, which can
    reduce slice sizes to some extent.


    To address the limitations of slicing, especially its static version, we introduce
    in this section quantitative slicing (q-slicing) [15, 76, 81], a general'
