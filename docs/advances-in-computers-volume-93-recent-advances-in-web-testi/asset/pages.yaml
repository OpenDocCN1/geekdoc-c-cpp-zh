  md: '# Advances in Model-Driven Security


    The AoM paradigm could thus be used to enhance the modularity of the security-critical
    systems and the reusability of the security models.


    DSL has to deal with the business complexity, but also with the additional complexity
    of security concerns which are multiple in nature. An intuitive solution to this
    variety is for the software development methodology to reflect the heterogeneous
    nature of such systems with the goal of making their design simpler. From our
    evaluation in Section 4 we can deduce that it is difficult to develop a general-purpose
    DSL intended to model all security concerns simultaneously. This is because different
    security properties require different interactions with the business models that
    are too complex to be modeled by a human using a single DSL. For easing the modeling
    task and allowing better verification possibilities, an interesting possibility
    is that each security concern modeled using a specifically tailored DSL.


    However, spreading security concerns over several models raises several crucial
    challenges in our opinion: First, it hinders the understanding of the overall
    system''s security by the experts they need to deal with models simultaneously.
    This drawback can however be balanced by the narrowed focus of those models. Second,
    it requires proper composition operators for creating models that amalgam all
    security aspects. This is crucial for later phases: whereas separate security
    models make it possible to analyze security properties independently, the enforcement
    of these policies in the business part of the systems and code generation requires
    merging all security aspects before reaching platform code. Third, it complicates
    keeping all models synchronized over common information and poses additional challenges
    when tracking integrated verification results back to security information that
    is distributed over several models.


