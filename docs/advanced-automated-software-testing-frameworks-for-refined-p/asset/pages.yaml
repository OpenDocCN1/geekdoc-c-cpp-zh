    # ABSTRACT


    Ensuring the correctness of a distributed program is not an easy task. Testing
    and formal methods can play a significant role in this regard. However, testing
    does not allow for formal specification of the properties to be checked. On the
    other hand, formal methods verify that a model of a distributed system satisfies
    certain properties that are formally specified. However, formal methods do not
    guarantee that a particular implementation of the system under consideration will
