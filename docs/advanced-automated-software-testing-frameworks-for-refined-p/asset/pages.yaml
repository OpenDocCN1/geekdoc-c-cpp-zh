  md: '# Testing E-Services


    Figure 6. The mirror effect for the two systems


    ![](img/03347457387556f0f0f2af882be884ac_227_0.png)


    ing new features and upgrades to the existing system also requires close interaction
    with the user group, for testing and demonstrating its effectiveness, before finally
    integrating to the existing system.


    # 6. THE MIRROR EFFECT


    The web-based system is not tested with the users for its effectiveness before
    deployment. It is important to know “what is expected from the web-based system”,
    or which characteristics can be migrated from the old system to the new one, the
    ones that didn’t work in the old system may be improved and tested and offered
    to the user with a better experience in the new system (Figure 6). This would
    have greatly enhanced the web electronic workflow. Understanding relating the
    users motivation and usage characteristics from the old system (i.e. paper based)
    into the new (i.e. web electronic) may have offered the user with the same look
    and feel within the new system.


    A different approach may not be appropriate in developing users experience based
    on the system (and not the user requirement), which discouraged the users from
    parting their prior (old) experience. Rather the users examined the new experience
    (on the basis of system requirements) as rigid and not effective in the current
    electronic task. Keeping aside ones prior experience that has been developed over
    a period of time and used in everyday task is difficult to forget or separate.


    A good system will complement and integrate user’s prior experience within the
    new framework. For example a typist using a typewriter has prior experience'
