    # 2. PERSPECTIVES TO THE RESEARCH PROBLEM


    The Management believed that the e-services system, when fully developed, would
    be more useful for staff in their work. Management considered that the e-services
    system was a channel for delivering better, more useful and efficient services
    to students and at the same time would provide effective work administration for
    staff. In the long term, such advantages would be reflected in better work management
    practices and increased work productivity. The most important factor from the
    Management perspective for staff acceptance, use, and continued use of the e-services
    system was the perceived usefulness of the e-services system.


    The problem facing the international admission department is that the staff is
    not accepting the web electronic service system in processing the student application;
    intend continue to use the old system that is traditional paper based service.
    Printing documents, storing in folders, processing, and correspondence with students
    are through traditional mail and central to the workflow system. Reliance on paper-based
    service tends to duplicate and increase task load leading to errors and confusion.
    As a result of this, the department lacks behind in providing good service to
    its clients (students), resulting in considerable backlog. This is shown in Figure
    1.


    The case study examines the Web Electronic Service framework of the University
    of Australia (not the real name). The department is in the process of developing
    and implementing Web-based e-service system. International students have the option
    to lodge the admission application through either of: web-based e-service system
    on the World Wide Web, phone, fax, or in person. Receiving the application decision
    is made by the staff on the admission status. The department is implementing the
    electronic delivery of services on the website. The web electronic service is
    believed to be in for approximately last two and half years. The e-service process
    involves students making the application and the staff processing on the website.


    The department introduced the web electronic service to catch up with the increasing
    backlog and to improve the service. The staff indicated their resistance to accept
    web-based e-service system on the basis of factual information such as: it added
    additional load to their current task, lack of confidence, fear of providing wrong
    information on the web, and not seeking help when required.'
