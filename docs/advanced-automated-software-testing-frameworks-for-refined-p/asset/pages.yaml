    # Modeling Pre- and Post-Conditions of Basic Functions


    The first modeling notation used for representing the execution context of a function,
    i.e., its pre- and post-conditions, is a pre-/post-notation. A function can be
    executed if the system fulfils its pre-condition. After the execution of a function
    in a defined pre-condition, the system fulfills a defined post-condition. Two
    functions can be concatenated if the post-condition of one function and the pre-conditions
    of the other function overlap. In the approach, the modeling notation B machines
    is used, a formal notation for state-based systems using an abstract machine notation
    (Abrial, 1996).


    A machine consists of a set of variables for describing system states, a set of
    invariants, and a set of operations for modifying the system state. Invariants
    are used to restrict the value of state variables. Each system specified as a
    B Machine has a unique initial state, which is defined in the initialization part
    of the B machine. The system operations have designated pre- and post-conditions
    and provoke the change of state variables. B supports the refinement and abstraction
    of operations and state space, but does not support composition. Each valid and
    reachable combination of state variable values is a valid system state, i.e.,
