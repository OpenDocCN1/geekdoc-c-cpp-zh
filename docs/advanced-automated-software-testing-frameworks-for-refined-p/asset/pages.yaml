    # THE CASE STUDY


    The test object is derived from the automotive example presented in (Robinson-Mallett,
    Hierons, Poore & Liggesmeyer, 2008), a simplified component-based automatic transmission
    control system. Automotive transmissions are complex software-intensive subsystems
    in road vehicles, which consists of several ECUs connected via communication buses
    (Nauheimer, Bertsche, Ryborz, & Novak, 2011).


    Figure 2 shows the simplified system structure of the feasibility study, which
    is derived from the case study described (Robinson-Mallett et al., 2008). For
    demonstration purposes, the system was reduced to six components that communicate
    via automotive-specific communication busses. The component vehicle describes
    the vehicle- and engine-specific aspects of the transmission, such as acceleration
    and deceleration, calculation of engine RPM, and velocity. Furthermore, the vehicle
    may affect the shift strategy when thresholds for engine RPM and velocity are
    reached. The shift lever is responsible for selecting the desired shift mode (neutral
    automatic, manual). The shift control evaluates the inputs from the vehicle and
    from the shift lever controls the clutch and transmission components. The control
    depends on the transmission type such as single or dual clutch transmission (Nauheimer
    et al., 2011). The clutch control and transmission control components execute
    the commands from shift control. The ignition is connected to the shift lever
    to assure stationary safety-related functionalities (e.g., the ignition can only
    be turned off when the shift lever is in the parking position).'
