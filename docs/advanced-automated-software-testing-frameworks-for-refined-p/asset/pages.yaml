    Figure 12. Test case generation and coverage criteria


    ![](img/03347457387556f0f0f2af882be884ac_191_0.png)


    step from reduced test models. For scalability reasons, different criteria are
    proposed for each model type. Depending on the type of function (basic or composite)
    appropriate coverage criteria are selected. Test cases for basic functions focus
    on the coverage of the B states and the component interactions related to the
    function. Test cases for composite functions aim at covering the functional composition
    in CSP and the B state space affected by the functional pre- and post-conditions.


    Figure 12 shows the test case generation approach for the heterogeneous test models
    together with the coverage criteria for each notation. The graphs describe the
    subsumption relation of the coverage criteria, which is represented by the order
    in the graph. An upper criterion subsumes the lower criterion by assuring a higher
    coverage of the model. The criteria are globally applied at each integration step,
    i.e., the set of all test cases of a certain covers function sequences, execution
    paths in composite functions, and component interactions. The symbol * means that
    the test case generation is bounded by a sequence length, path length, or the
    number of loop and cycle executions. The criteria marked in bold are proposed
    as minimum coverage criteria for the approach.


    In the first step, sequences of functions are generated from the B model. The
    weakest criterion is the coverage of all functions, which is related to the coverage
    of all reachable operations. A stronger criterion is the coverage of all reachable
    transitions of the B model, which corresponds to the coverage of all functions
    calls and functional pre-conditions. The coverage of function sequences of a certain'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Model-Based Testing of Distributed Functions


    length is an alternative, stronger criterion. The strongest criterion proposed
    is the coverage of transition sequences of a certain length.


    In the second step, execution paths of the composite functions are generated from
    the CSP model. The weakest criterion is the coverage of all functions, which corresponds
    to the coverage of all processes in the CSP model. By using sequences, alternatives,
    and parallel compositions, complex structures can be described. A stronger criterion
    is the coverage of all branches, which is driven by the number of external choice
    operators in the composition. Paths of paths of a certain length can be constructed
    by concatenating branches. The coverage of paths of a certain length subsumes
    branch. On the other hand, the execution of concurrent processes is an important
    aspect (Ulrich & König, 1997). The strongest criterion proposed is the coverage
    of paths of a certain length combined with the coverage of the concurrent executions.


    In the third step, sequences of correct stimuli, responses, and component interactions
    are generated for the test cases derived in the previous steps. The criteria are
    applied to the component models, which are specified as timed automata. The weakest
    criterion generates one path through the component models for each function called
    from the CSP and B-models. Strong criteria are the coverage of all interacting
    events for a certain function and the coverage of all reachable and valid component
    interactions provoked by the exchange of interacting events. Interactions can
    be concatenated to sequences of a certain length, which represents the strongest
    criterion coverage.


    Figure 13 presents an example of a test case for the basic function automatic
    upshift. The test case generation for basic functions focuses on the coverage
    of functional pre and post conditions in the B state space and component interactions
    described in the component models. On the left hand side a trace through the B
    state space with the state variable changes is shown. The diagram on the right
    side shows the sequence diagram of the test case with system inputs from the environment
    (driver), component interactions, and expected state changes.


    The test case starts in the initial state system which is defined in the original
    B model. In order to execute the function automatic upshift, the system state
    has to be changed. Therefore, the auxiliary function is specified to provide the
    required state by setting the system mode to D (driving mode) and engaging the
    first gear. The upshift is performed when the car accelerates and a defined engine
    rpm threshold is achieved. The shift control interacts with the clutch control
    and the transmission control to execute the upshift in the transmission. Finally,
    an knowledge signal is sent back to the vehicle component.'
