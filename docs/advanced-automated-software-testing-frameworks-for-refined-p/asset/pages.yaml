    user interaction is suggested. This paper specifically investigates issues related
    to user learning experiences in web-based learning adoption and the process involving
    continued use of web-based learning services. With technology constantly changing
    it will inevitably have an effect on the user''s learning experience and perception.


    Davidow and Uttal (1989) suggest user''s expectation is formed by many uncontrollable
    factors, from the experience of user''...to a user''s psychological state. It
    is argued that a user web-based learning experience is formed and based on wider
    range of prior experiences that may be recalled or narrowed in a similar situation.
    The flow of information over the Internet is faster and communication between
    user''s leads to enhanced learning. Understanding user''s web-based learning experience
    and perception solely on the basis of online or offline experience would tend
    to limit the research dimension; rather a combination approach is adopted.


    # RESEARCH METHODOLOGY


    The aim of the study is to investigate the adoption of web-based learning among
    users. This led to the development of converging lines of inquiry, a process of
    triangulation (Yin 1994). In the first instance discussions were held together
    with three senior staff members involved in implementing the web-based learning
    project. They included the executive director, IT Manager, and an outside Consultant.
    In the second round separate individual interviews are conducted with these participants.
    The third round of interviews was conducted with the admissions manager and separate
    individual interviews with two other staff members. Altogether six separate interviews
    with participants were held. Though the participant''s gender is not a major factor
    for introspection, it coincided to balance, three males and three females. In
    the first round the data collected were compared with the second round and third
    round interview data, for consistency, clarity and accuracy of the information.


    Interview data were also compared to test for the factors having effect on users
    with high and low performance in learning how use the web-based system. This provided
    the advantage of not duplicating the data with just one set of evidence. The discussions
    and interviews were open-ended (Yin 1994), the researcher in the beginning provided
    the topic, and the respondents are probed of their opinion about the events. The
    questions are directed towards user''s learning experience with the web-based
    system. This led the users in reflecting their recent learning experiences with
    the system and demonstrating its effectiveness in the web-based task. It provides
    the opportunity of capturing rich information that is fresh and part of the user-learning
    interface within the web-based system. It not provides information about the user''s
    learning experience, but also demonstrates the boundaries of the web-based'
