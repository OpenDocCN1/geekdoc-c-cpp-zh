    and UML models as UML state charts.


    # COMPONENT-BASED SYSTEMS


    Systems are complex entities composed of a set of components. They provide high-level
    functionality stated in the system requirements specification. Distributed systems
    that consist of multiple autonomous computers or processes that communicate through
    a computer network or a communication middleware. The processes interact with
    each other in order to achieve a common goal (Attiya & Welch, 2004).


    Components are system parts with defined interfaces and functionalities. In many
    areas, the manufacturers of complex embedded systems use third-party components
    from suppliers, such as software packages or complete ECUs. Their main task is
    to specify the desired component functionality and integrate it into their system.
    When third-party components are used, the manufacturer often provides the supplier
    with textual specifications, enriched with some models for interesting or critical
    aspects. The integration test of the assembled system becomes an important quality
    assurance activity.


    Components may be triggered by the environment (stimuli) and may respond internally
    (to other system components) or externally (to the environment). The environment
    comprises all test-relevant entities and components that are outside the system
    boundary, i.e., they are not part of the system under test. The definition of
    the system boundary, i.e., the determination of the concrete set of components
    and the abstraction level of their interfaces, is an important activity of the
    test planning'
