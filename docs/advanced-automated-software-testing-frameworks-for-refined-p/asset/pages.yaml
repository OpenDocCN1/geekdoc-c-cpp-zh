    # Modeling the Transition-Based Behavior of Component Interactions


    The third modeling notation used for describing the composition of functions is
    a transition-based notation. Transition-based notations describe the control logic
    of components with their major states and actions that lead to state transitions.
    For describing complex systems, additional modeling elements like data variables,
    clocks, hierarchical machines, parallelism, and synchronization have been introduced.
    In the approach, the modeling notation timed automata is. Tim automata are finite
    state machines extended with variables and clocks (de Alfaro & Henzinger, 2001).
    A timed automaton consists of locations, an initial location, variables and clocks,
    actions (input and output events), edges between locations, and invariants assigned
    to locations. Clocks are special variables that progress synchronously. Locations
    represent the vertices of the automaton and may have invariants related to system
    values. Every automaton has a designated initial location. Locations are connected
    by edges. Edges may be annotated with an event (either sending or receiving),
    guards to the related values, and actions for setting variable values.


    A system is modeled as a parallel composition of timed automata. Timed automata
    support the synchronous and asynchronous component interactions through synchronized
    events and shared variables. An example of communicating finite state machines
    modeled as timed automata is shown in Figure 8.


    The timed automata are derived from the case study described in (Robinson-Mallett
    et al., 2008). Synchronous communication between two automata is provided when
    edges labeled with complementary events synchronize over a common channel (e.g.,
    MODE_D! for sending and MODE_D? for receiving). Asynchronous communication between
    timed automata is modeled by means of shared global variables, i.e., different
    automata can read and write variables and react depending on their values.


