    incorporates some of the latest advances in the speech recognition field such
    as

    tree-structured state network compression, language model look ahead caching,

    preventive pruning during token expansion, graph based confidence estimation,

    et system has been entirely developed using the C++ programming language

    (for efficiency reasons) and the Standard Template Library (STL) (Stepanov, 1995).

    The system is intended to be platform independent although currently it has

    tested on Linux machines.


    Given the complexity of the system developed, we have put special emphasis on

    t testing process to make sure that every module of the system behaves as speci-

    ed the Software Requirements Specification (SRS). In addition, we plan to keep

    advancing the system in the near future to keep state-of-the-art and to incorporate

    new features such as online environment and speaker adaptation methods. Thus,
    it is

    of the utmost importance for us to build a testing framework that can aid us with
    the

    regression tests and that can be easily extendable when new functionality is added

    to the system. The testing framework must also support a collaborative work model,

    given that several researchers will be contributing to the system implementation.


    # 4. TESTING APPROACH AND METHODOLOGY


    In this section the testing strategy and the testing techniques used to test the
    devel-\oped speech recognition system will be described. Both black box and white
    box

    testing paradigms were utilized to design the test cases used to test independent

    modules of the system in isolation (unit testing). However, only black box testing

    techniques were used to test the system as a whole. Unit tests were developed
    for

    each of the C++ classes that constitute the system. Once the system was completely

    implemented according to the Software Requirements Specification (SRS) and the

    unit test returning positive results (which indicates a good degree of reliability

    at the component level), we proceed to carry out the final tests to verify its
    completeness and correctness.

