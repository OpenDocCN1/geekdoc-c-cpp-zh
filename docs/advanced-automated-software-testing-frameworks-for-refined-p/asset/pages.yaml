  md: '# Runtime Verification of Distributed Programs


    # OMICITY


    In the previous section we have described some of the property classes for which
    efficient checking algorithms can be found. However, if the property that we want
    to check does not belong to any of these classes (general property), the checking
    will incur significant overhead due to the exponential number of states that needs
    to be considered. The notion of atomicity can be exploited to reduce the number
    of states where a given property needs to be checked.


    Lamport has developed a theorem in atomicity to simplify verification of distributed
    systems (Lamport, 1990). Lamport adopted the common approach of formally defining
    an execution of a distributed program to be a sequence of atomic actions. At the
    lowest level of abstraction each event result from executing any statement in
    the distributed program can be considered an atomic action. Reducing the number
    of atomic actions makes reasoning about a concurrent program easier because there
    are fewer interleavings to consider. This is the main goal of Lamport''s theorem.


    According to this theorem, a sequence of statements in a distributed program can
    be grouped together and be treated as an atom under some stated conditions. Formally,
    an atom may receive information from other processes, followed by at most one
    externally visible event (for instance, altering a variable to some global property).
    This theorem allows a distributed program to be abstracted into a reduced distributed
    program with more general and possibly larger atoms. As a result, the cost of
    program verification can also be reduced.


    Formally, consider a distributed algorithm A in which each process executes a
    sequence of the process''s input buffers, performs some computation, and sends
    a set of messages to other processes. According to this theorem, the reduced version
    A'' of algorithm A in which entire operation is a single atomic action and message
    transmission is instantaneous; this means that a message appears in the receiver''s
    input buffer when the message is sent. In this case, algorithm A'' will not have
    any computation state in which a process is in the middle of an operation or a
    message is in transit. Hence, algorithm $A''$ is simpler than algorithm $A$ and
    it is easier to reason about $A''$ than about $A$. In his work, Lamport defined
    six conditions and proved that these conditions are satisfied, then $A$ satisfies
    a correctness property $\phi$ if and only if $A''$ satisfies $\phi$.'
