  md: '# About the Contributors


    **Izzat Mahmoud Almadi** is an Assistant Professor in the Department of Computer
    Information Systems at Yarmouk University in Jordan. He obtained his Ph.D degree
    in Software Engineering from NDSU (USA). His second Master’s is in Software Engineering
    from University of Phoenix (USA). He had B.sc degree in Telecommunication Engineering
    from Mutah University in Jordan. Before joining Yarmouk University he worked for
    several years in several companies and institutions in Jordan, USA, and UAE. His
    research interests include: software engineering, software testing, e-learning,
    software metrics, and formal methods.


    **Thomas Bauer**, after studying software engineering at the University of Potsdam
    (Germany, 1999-2005), has been working as a researcher at the department of Embedded
    Systems Quality Assurance at the Fraunhofer IESE. His research interests are cost-efficient
    application of quality assurance, test automation, and model-based testing. Mr.
    Bauer has been involved in several industrial and research projects focusing on
    the quality assurance of software-intensive technical systems. He was the IESE-project
    leader of the ITEA2-project D-Mint which was developing and transferring model-based
    testing technologies to industrial practice. Furthermore, he is co-founder and
    co-organizer of the workshop series on model-based testing in practice (MoTiP).


    **Daniel Bolanos** received his undergraduate degree in Computer Science from
    the Universidad Autonoma de Madrid (Spain) in 2002 and his PhD in Computer Science
    and Electrical Engineering in 2008 from the same university. Since then he has
    worked as a Research Associate at the University of Colorado in Boulder (USA)
    and as a Research Scientist in the company Boulder Language Technologies. His
    research is focused on automatic speech recognition with a focus on children’s'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# About the Contributors


    speech. As another area of interest he has worked on automatic testing tools and
    techniques. Dr. Bolanos is the author of several conference and journal articles
    in the field of speech recognition as well as a book and two book chapters in
    the field of automated software testing.


    **Robert Eschbach** is the Embedded Systems Quality Assurance department head
    at Fraunhofer IESE, where he is mainly engaged in projects with safety-critical
    and software intensive systems. His research in software and systems engineering
    centers on modeling theory, model-based testing, dependability engineering and
    formal methods. He is the author of more than 60 refereed publications. Dr. Eschbach
    has been a principal investigator in numerous research and industrial development
    projects, including the standardization of an important formal description technique
    for the telecommunication sector. He has given more than 30 industrial talks at
    workshops and conferences. Dr. Eschbach earned his Ph.D. in Informatics at the
    University of Kaiserslautern, Germany.


    **Alexander Roy Gheoghan** graduated cum laude from Jackson State University in
    2011 with Bachelor of Science degrees in Computer Science and Physics. Since graduation,
    he has been working as a Software Engineer at L-3 Communications, TX, a Fortune
    500 company. He had participated in the NSF-sponsored Research Experiences for
    Undergraduates (REU) in Wireless Ad hoc Networks and Sensor Networks at Jackson
    State University during Summer 2009. He worked as an Undergraduate Research Assistant
    during the academic year 2010-11 at Jackson State University, focusing on Web
    development, software security, and virtualization. He had also served as a Research
    Assistant for the Department of Civil Engineering in 2009, developing materials
    for a freshman orientation course with the goal of fostering teamwork and critical
    thinking skills through the use of Lego Mindstorm robots.


    **Seifined Kadry** is an Associate Professor of Applied Mathematics in the faculty
    of American University of the Middle East Kuwait. He received his Masters’ degree
    in Modeling and Intensity Calculus (2001) from the Lebanese University – EPFL
    -INRIA. He did his doctoral research (2003-2007) in Applied Mathematics from Blaise
    Pascal University-Clermont Ferrand II, France. He worked as Head of Software Support
    and Analysis Unit of First National Bank where he designed and implemented their
    data warehouse and business intelligence; he has published one book and many papers
    on applied math, computer science, and stochastic systems in peer-reviewed journals.'
