  md: 'developed over a period of time and is proficient with its use. If the typist
    is asked to use a personal computer without using prior typing skills may offer
    resistance in acceptance of the personal computer and its future usage. Precautions
    may be taken not to relate the negative effects from one system to another (i.e.
    paper-based to web-based system). Such negative effects can be scrutinized and
    tested for improvement for their effect in the new system which is Table 1.


    # 7. IMPLICATIONS AND DISCUSSIONS FOR RESEARCH


    This study contributes to more effective design and development by implementing
    the important elements of dimension for a web-based e-services system (e.g. Table
    1) based on qualitative evidence from participants. The facets of web-based e-services
    systems dimension (e.g. Table 1, column 2) are only understood when the system
    has been developed and running, thus capturing users understanding of the systems
    deficiency. This research differs from the previous literature by suggesting that
    the important aspects of the e-services dimension need to be ‘early on designed
    and tested’ by the system development cycle. This would reduce the negative impact
    on the users’ attitude towards e-services system performance. E-services are user
    driven, features that enhances the systems design will have an effect on the user
    adoption of e-services. This research also identifies the need to integrate qualitative
    data into the design for e-services system development projects. The experiences
    learnt from the e-services system development are:


    +   1. The users need to be involved in the systems development from a very early
    stage.


    +   2. The use of qualitative data from users in e-services systems implementation
    need not be underestimated. No user group (e.g. administration staff, academic
    staff, and senior management staff) should be ignored.


    +   3. Detail conceptualization of the e-services systems needs to be developed
    and mapped and shown to the user group and for their input. Any changes to that
    process need to be implemented at that stage.


    The key learning points for this article is to know the users effective role in
    using user requirements, implement those requirements within the e-services system
    by reducing technical complexities and increasing task simplicity on the computer
    screen. Further, understanding the systems gap and the impact it can have on the
    e-services project, by tapping into the users knowledge about the features of
    the previous system (i.e. paper-based) and building those features into the new
    e-services system that would make the transition easy for the user.'
