    # Introduction to the Fortify Source Code Analysis (SCA) Suite


    The Fortify Source Code Analyzer, SCA, can be used to perform a static analysis
    on C/C++ or Java code and can run in Windows, Linux, or Mac environments (Chest
    & West, 2008). The Fortify SCA can analyze individual files or entire projects.
    The analyzer follows a set of rules that are included in a rulepack, and may use
    generic rulepacks or create their custom sets of rules. The analyzer can create
    reports in HTML format for easy viewing, as well as reports which may be viewed
    with the Audit Workbench utility that is included in the Fortify suite of tools.
    The Audit Workbench allows users to fine-tune the results of a static code analysis
    and limit the displayed results to those in which they are interested. The Workbench
    also includes an editor which will highlight the troublesome-code and allow users
    to make changes to the code within the application. For each generic issue flagged
    by the analyzer, the Audit Workbench provides a description of the problem and
    how the problem may be averted.


    # Issues Identified by the Fortify SCA


    With a generic rulepack, the SCA will identify four categories of issues: (i)
    semantic, (ii) eventdata, (iii) control flow, and structural issues.


    Semantic issues include those such as system information leaks, present whenever
    information specific to the program''s internal workings may be inadvertently
    provided to a user. The simplest method of this type of semantic issue is the
    use of the `printStackTrace()` method in Java''s Exception class. This method
    outputs the call stack at the point at the exception occurred and provides a user
    with information about the program''s structure, including method names. While
    use of the `printStackTrace()` method is handy during debugging, it is not advisable
    to leave such code in a finished product.


    Dataflow issues include those through which data can cause unwanted effects on
    a program''s execution. For example, if a line of text were accepted from a user
    or a method of another class as an SQL query and executed directly onto the database
    without first checking the code which may perpetuate a SQL-injection attack (Whittaker,
    2002). This highlights the need for proper input handling.


    Control flow issues are those related to an improper resource of commands. An
    example of a control flow issue would be if a resource were allocated but never'
