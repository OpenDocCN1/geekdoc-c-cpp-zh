  md: '# Test Case Prioritization using Cuckoo Search


    # Cuckoo Search Algorithm (Yang X S Yang and Deb S, 2009, 2010)


    We can simply describe Cuckoo Search algorithm by using the following three idealized
    rules:


    +   - Each cuckoo lays one egg at a nest, and dumps it in a randomly chosen nest.
    The process of executing a program or system with the intent of finding errors
    or it involves any activity aimed at evaluating an attribute or capability of
    a program and determining that it meets its required results.

    - The best nests with high quality of eggs (i.e. solutions) will carry over to
    the next generations.

    - The number of available host nests is fixed, and a host can discover an alien
    egg with a probability of 0 or 1. In this case, the host bird can either throw
    the egg away or abandon the nest as to build a completely new nest in a new location.
    The pseudo code of Cuckoo search algorithm is shown in Appendix A.


    The implementation of Cuckoo search algorithm in test case prioritization is explained
    in the next section phase.


    # THE PROPOSED STRATEGY


    To generate prioritized test cases this approach consists of two phases. During
    phase 1(based upon the concept on Aggrawal K K et al, 2004 work as shown in Figure
    1 (phase 1).This first phase concept is same as is reported in paper (Aggrawal
    K K et al, 2004). Some of the test cases from the initial test suite (T) will
    be removed and a new test suite T'', which has less number of test cases will
    be generated so by the end of phase 1 the test suite will be minimized. Step1
    calculating NO_MATCHES for each test and adding the maximum match test to T''.
    Step 2 repeatedly calculates step1 by removing the lines of code by the test case
    added to T'' from the test cases and MOD_LINES in every iteration a test case
    is added.In Step 3 considering the dependent test cases. There by considering
    the problem of test case prioritization with the test cases in T'' during phase
    2. In phase 2 Cuckoo Search is implemented on the permutations of test cases in
    T'' and a prioritized test suite is generated.


