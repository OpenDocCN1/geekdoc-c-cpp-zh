    and decision-making. The user''s comment about the web-based e-service system
    is "we are not consulted and no one speaks to us about the online processing system,
    it just suddenly appeared and we have to use it". One participant went a step
    further and said, "they (the users) dont feel any ownership of the beginning and
    we are slowly trying to introduce that sense of ownership among users". Such experience
    may been frequently shared among colleagues who were using the web-based system,
    and the overall general perception of the system is perceived to be low not as
    as a result of its characteristics (not this time) but due to the intense collective
    feeling again accepting the system, due to lack of contribution in its development,
    participation, and consultation process.


    A participant disclosed this as "when managers are told to handle an inquiry,
    the reaction is, isn''t their job". This clearly demonstrated that either the
    users are shifting their task to their sub-ordinates or they didn''t understand
    their contribution and responsibilities in the web-based system. No minimum standard
    is set for each task; rather the complete service output is taken as a final delivery
    of service. This has reduced the sense of user ownership, and the minimum standard
    is expected in doing the task.


    General models of employee behavior suggest that behavior is determined by role
    of clarity, ability to perform, and motivation to perform (Zeithaml and Bitner
    2000; Sandhu and Corbett 2009). Similarly, user behavior in a service production
    and delivery situation is facilitated when (1) users understand their roles and
    know how they are expected to perform, as clearly defining their task; (2) users
    are able to perform as expected, that is the minimum standard expected to do the
    task; and (3) there are valued rewards for performing as expected (Schneider and
    Bowen, 1990), that is users will be motivated individually and collectively for
    their achievements. While working with both systems users had forgotten their
    actual roles within the systems.


