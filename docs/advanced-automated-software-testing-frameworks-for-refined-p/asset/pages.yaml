  md: '# Model-Based Testing of Distributed Functions


    # INTEGRATION ORDER


    The integration order determines the order of system assembly for integration
    testing. The test approach, a function-driven bottom-up integration strategy is
    used. The objective is to integrate and test the functions according to their
    order in the function graph. Based on the function graph, the order of functions
    and their component clusters for testing are identified. The component clusters
    represent the relevant minimal system configurations needed to perform a certain
    function. A cluster is mapped to a configuration step. The integration order of
    the clusters depends on the hierarchy of their functions extracted from the function
    graph.


    For each configuration step, the set of relevant functions is determined. The
    test order for the functions within a configuration step is defined by the order
    of the functions in the function graph. Sub-functions are integrated earlier than
    their composite functions. Furthermore, it is possible to integrate multiple functions
    with the same system configuration together in one step to reduce the test execution
    effort.


    Figure 10 shows the partial order of the system assembly for the transmission
    example. Four configurations, i.e., component clusters, have been identified.
    The clusters are arranged in a bottom-up way considering the position of their
    functions in the hierarchy. The integration of functions within a cluster is also
    done in a bottom-up way. The functions marked in italics are containers, which
    are approved when all of their sub-functions have been tested and approved. For
    each configuration step, the set of involved components (marked as white boxes),
    required stubs (marked as gray boxes), and irrelevant components (marked as black
    boxes) are annotated. The annotations are related to the system structure shown
    in Figure 2.


    In the example, cluster configuration 1 with the components shift control, ignition,
    and shift lever is tested first. It contains the set of safety-related system
    functions. The functions Start ignition and Lock ignition are tested together,
    followed by the composite function Ignition related. In the next step, the functions
    Park to drive and Drive to park are covered. Finally, the composite function Lever
    changing is tested. After this step, all safety-related functions are tested and
    the container Safety functions is approved.


    In the next step, configuration 2 (with the components shift control, vehicle,
    transmission ctl, and clutch ctl) is assembled and its functions are tested, which
    is followed by configuration 3. After testing and approving the last function
    robustness tour, the container driving scenarios is also approved. Thus, all system
    functions have been approved and the product is released to the next stage.


    For each configuration step, reduced versions of the test models are created,
    i.e., a reduced CSP model showing the relevant functional compositions, a reduced
