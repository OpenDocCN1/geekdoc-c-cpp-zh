  md: '# Chapter 10

    Testing E-Services


    Kamaljeet Sandhu

    University of New England, Australia


    # ABSTRACT


    This research is is about testing the effectiveness of Web-based e-services system.
    The problem facing the department is the staff resistance to accept and use e-services
    in their work. There are technical issues that impact negatively on staff users
    of the e-services system. Case analysis reveals that there are wider issues stemming
    from the interaction with the system which has a low impact on e-services acceptance.
    E-services drivers such as user training and experience, motivation, perceived
    usefulness and ease of use, acceptance, and usage were not clearly understood
    by the technical development team, hence not when implementing the e-services
    system.


    # 1. INTRODUCTION


    E-Services system are rapidly introduced on websites with the expectation that
    the users are going to utilise them (Khalifa and Liu 2003). The application of
    e- Services system on websites is widely expected to be a more effective, efficient
    and productive communication for businesses and users alike (Rust and Lemon 2001).
    However, whether or not it leads to continue use of e-services is not known. One
    of the purposes of using e-services is that it provides instant delivery of service
    and accompanying information to the user. Whatever the purpose, e-services systems
    have one thing in common — (placing an order, payment etc) — they provide an


    DOI: 10.4018/978-1-4666-0089-8.ch010'
