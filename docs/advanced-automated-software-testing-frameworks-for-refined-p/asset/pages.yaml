  md: '# Runtime Verification of Distributed Programs


    # PROGRAM SLICING


    The concept of slicing arose from research on dataflow analysis and static program
    analysis (Weiser, 1984). The main goal of introducing this concept was to facilitate
    the debugging and understanding of sequential imperative programs. A slice of
    a program P with a criterion C (usually a program point) is a set of statements
    of P, which are relevant to the computations performed in C. It has been extended
    in various ways to deal with more complex program constructs, e.g., arrays, points,
    and concurrency. Moreover, the concept of slicing has been extended to more formalisms,
    including Z formalisms (Wu & Yi, 2004), and hierarchical state machines (Heimahl
    & Whalen, 1997). In general, the basic idea behind program slicing is to remove
    details of the program that are not relevant to the analysis in hand. For example,
    if we wish to verify property, slicing can be applied to eliminate parts of the
    program that do not affect that property.


    Computation slicing was introduced in (Li, Rilling, Goswami, 2004, Sen & Garg,
    2003a, Garg & Mittal, 2001, Mittal & Garg, 2001) as an abstraction technique for
    analyzing distributed computations (execution traces). A computation slice, defined
    with respect to a global property, is the computation with the least number of
    global states that contain all states of the original computation for which the
    property evaluates to true. This is in contrast to traditional slicing techniques,
    which either work at the program level or do slicing with variables. Computation
    slicing can be used to eliminate the irrelevant global states of the original
    computation, and keep only the states that are relevant for our purpose. (In Mittal
    & Garg, 2001), Mittal & Garg proved that a slice exists for all global predicates.
    However, it is, in general, NP-complete to compute the slice. They developed efficient
    algorithms to compute slices for special classes of predicates.


    # PARTIAL ORDER TRACE ANALYZER


    In this section we will give a brief introduction to Partial Order Trace Analyzer
    (POTA) which is a tool that can be used for runtime verification of distributed
    programs (computations) (Sen, 2004; Sen & Garg, 2003b).


    The properties to be checked using POTA have to be specified using the specification
    language (RCT+) which is a subset of temporal logic CTL. POTA contains the implementation
    of a number of efficient verification algorithms.


    The tool has been implemented using the Java programming language. POTA takes
    as an input a program and a specification. The specification is given in a text
    file and then parsed. The program is instrumented using the instrumentor module
    and then executed. A trace of the program is collected while the program is running.'
