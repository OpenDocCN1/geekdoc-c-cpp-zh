  md: '# On the Application of Automated Software Testing Techniques


    It is generally known that speech recognition systems never yield 100% accuracy,
    regardless of the task.


    +   iii. On the other hand, if the score resulting from (a) is higher than the
    score obtained from (b), a recognition error has occurred that was prompted by
    a pruning error or an implementation error. Using the frame-level scores that
    were kept during steps (a) and (b), it is possible to determine the source of
    this error. If the frame-level score of the path resulting from (b) is always
    within the beam pruning width with respect to the frame-level score of the path
    resulting from (a), then the recognition error can not have been caused by a pruning
    error, but instead has occurred due to an implementation error, and in this case,
    an error is reported.


    Note that if other types of beam pruning methods are used, like layer-dependent
    beam pruning or histogram-based pruning, additional verifications need to be carried
    out in step III to determine whether the recognition error is caused by a pruning
    error or by an implementation error. In layer-dependent beam pruning, tokens in
    specific layers of the decoding network are pruned using beams of different width,
    and typically narrower for the word-end layer. In this case, additional checks
    need to be made to sure that the score in positions of the path obtained in (b)
    that correspond to those layers in the network is within the layer-specific beam
    relative to the best overall score at that frame. In histogram-based pruning,
    only the best N tokens survive at each iteration of the Viterbi search. This will
    require that additional checks be performed in step III to make sure that the
    frame-level score of the path obtained in (b) was not actually pruned off the
    search simply because it ranked above N. In this case, it becomes slightly more
    complicated, due to the actual characteristics of histogram-based pruning. In
    histogram-based pruning, the idea is to keep the N best tokens to avoid the computational
    complexity of sorting the whole set of tokens, which can be considerable. The
    computational complexity of histogram based pruning is O(n), where n is the number
    of tokens resulting from a token expansion, while sorting the whole set of tokens
    would be O(log(n)), which makes a big difference for a large n. The implementation
    consists of building a histogram from the scores of all the tokens resulting from
    the expansion process and keeping the tokens that are in the higher bins (where
    the tokens have higher scores). Since this method keeps the best bins, which are
    those containing approximately N tokens in total, and not necessarily the best
    N tokens (note that tokens will be typically distributed across bins), it will
    be necessary to replicate the histogram-based pruning during step III, as opposed
    to merely checking whether the path resulting from (B) has a score which is the
    same or higher than the Nth path.'
