    # CONCLUSION AND OUTLOOK


    In this chapter, a novel model-based approach for the systematic testing of distributed
    functions in component-based systems has been presented. The focus of the work
    was on the systematic construction of models for covering the system requirements
    and enabling the automated generation of test cases. The test problem was solved
    by a heterogeneous modeling approach consisting of three models for describing
    the function composition, the post-conditions of functions, and the component
    behavior. For each model type, an appropriate notation was proposed. The modeling
    notations can be changed according to the system properties and the test designers''
    expertise with the notations. An approach for the systematic construction of the
    models from the system requirements was presented. The stepwise assembly is supported
    by a function-driven integration order. Test cases are automati'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Model-Based Testing of Distributed Functions


    cally generated from the test models. A set of coverage criteria has been proposed
    for the different modeling notations. Future work will comprise the improvement
    of the tool chain and further application of the method in industrial case studies.


