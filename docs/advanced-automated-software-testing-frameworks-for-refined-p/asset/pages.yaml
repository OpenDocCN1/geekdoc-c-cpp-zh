    # TEST PROFILER


    In a large system or program it can be difficult to ensure that the test data
    is adequate. One way to try to test whether it does indeed cause all statements
    to be executed is to use a profiler. A profiler is a software package that monitors
    the testing by inserting probes into the software under test. When testing takes
    place, the profiler can expose pieces of the code that are not executed and therefore
    reveal the weakness in the data. Another approach to investigating the test data
    is called mutation testing. In this technique, artificial bugs are inserted into
    the program. An example would be to change a + into a -. The test is run and if
    the bugs are not revealed, the test data is obviously inadequate. The test data
    is modified until the artificial bugs are exposed.


    # BETA TESTING


    In beta testing, a preliminary version of a software product is released to a
    selected market, the customer or client, knowing that it has bugs. Users are asked
    to report on faults so that the product can be improved for its proper release
    date. Beta testing gets its name from the second letter of the Greek alphabet.
    Its name therefore conveys the idea that it is the second major act of testing,
    following on after testing within the developing organization. Once Beta testing
    is complete and the bugs are fixed, the software is released.


    # TEST AUTOMATION


    It is good practice to automate testing so that tests can be reapplied at the
    touch of a button. This is extra work in the beginning but often saves time overall.
    The following reasons lead software companies to apply a test automation process
    on software:


    +   * Manual mistakes: may occur due to human interference. In this direction,
    the execution of test automation reduces the wrong entering information by the
    tester.

    * Parallel execution: the computer is a multitask, it can run many tests in parallel
    hence the process can be done faster with less resources.

    * No Interruption: there is no need to interrupt the execution of automated test,
    contrary to manually executed cycle.'
