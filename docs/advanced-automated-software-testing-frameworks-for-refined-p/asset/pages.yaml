    report events that are relevant for monitoring the properties to be checked.


    There are two categories of runtime verification techniques (Ladan, 2001):


    +   On-the-fly techniques: The program behavior is analyzed during its execution
    such that errors are detected and reported as they occur during the run.


    +   Offline techniques: These techniques collect a log of events that occur during
    a program''s execution and post-process the log to detect errors. The main disadvantage
    of these techniques is that execution logs can be very large for parallel and
    distributed programs.


