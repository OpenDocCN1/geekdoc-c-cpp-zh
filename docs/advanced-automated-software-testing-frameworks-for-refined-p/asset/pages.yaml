    Furthermore quality characteristics is also determined by the process employed
    to design the product, product characteristics and the project attributes in terms
    of life cycle stages. Every application area also has its own specialized quality
    requirements which need to be considered while designing quality objectives of
    a software project. This highlights the fact that there is no strict definition
    of quality as each software development project and product has its own quality
    goals. In this chapter, we highlight how the quality can be improved in each software
    lifecycle phase and also suggest methodologies that can be put in place to improve
    the software development projects.


    The remaining of this chapter is structured as follows. Section 2 discusses quality
    and its attributes which need to be considered in the entire software development
    lifecycle. Section 3 highlights the prevailing methodologies employed to enhance
    quality in software projects. Section 4 presents our conclusion.


    # QUALITY IN SOFTWARE DEVELOPMENT LIFECYCLE (SDLC)


    The importance of enhanced quality suggests that quality is not something that
    is added to a product after it has been realized (such as garnishing a dish that
    has already been cooked). It requires a quality culture where the raw materials
    and the processes involved have built-in quality. In such a culture, enhancement
    of quality becomes everyone''s responsibility. Thus, it becomes an ongoing activity
    performed throughout the software development lifecycle, through all the various
    software development phases; requirements engineering, system design, development
    and testing. As previously mentioned, software quality can also be correctly classified
    in terms of product quality, process quality and the project quality. Process
    quality refers to the effectiveness of the procedures employed in producing high
    quality software artifacts during the software development life cycle. Product
    quality refers to the quality attributes built into the final software product.
    Project quality refers to'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# A Review of Software Quality Methodologies


    the overall processes of assessment, monitoring and management. Process quality
    is relatively important as it makes the foundation for the success of current
    as well as future projects whereas the product quality only focuses on the current
    Project which is under consideration. Similarly, quality management activities
    are categorized into quality assurance and quality control. Quality assurance
    is proactive whereas quality control is a reactive strategy. The objective of
    the quality assurance activities is to perform SDLC activities in an optimal way
    to reduce the inherent problems and increase the product and process quality,
    whereas quality control activities attempt to find whether the product or process
    meets the required quality standard and, if not, what the discrepancies are. In
    the following sections, we discuss the activities which need to be focused to
    improve the quality of software products in a SDLC process. Here, the process
    is seen as composed of a number of software project phases consisting of: initiation,
    planning, requirements elicitation, design, testing and configuration.


    # Project Initiation


    Project initiation is a preliminary stage of any software development project
    where project proposals and contracts are established and project feasibility
    is carried out. In order to avoid problems later in the project lifecycle, it
    is important to accurately estimate the project scope, the software size and project
    effort to identify project cost, project duration and service level agreements.
    This could be realized by applying multiple estimation techniques, instead of
    a single approach, and also by learning from other past projects while working
    on feasibility assessment. This stage may also be known as the feasibility step.
    At the end of the phase, either the project is abandoned or the next stage – planning
    – is entered to conduct a proper planning strategy before implementing it (cf.
    Wierseger, 2007; Greer& Conradi, 2009).


    # Project Planning


    This is the most important stage of any development project. If this stage is
    conducted correctly the project execution becomes straight forward. Projects costing
    too much or their late delivery or not conforming to user requirements is often
    due to inappropriate planning. An important project aspect, which most of the
    software projects lack, is timely delivery of artifacts. One reason for this is
    the choice of inappropriate software development lifecycle model. There are numerous
    issues at this stage relating to: cash flow forecasting, work breakdown structures,
    cost, time and effort estimation, analysis of resources availability, resource
    allocation planning, staff responsibility and progress monitoring strategies (cf.
    Walston'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# A Review of Software Quality Methodologies


    & Felix, 1977; Albrecht & Gaffney, Mohapatra, 2010). All these need to be appropriately
    developed to control the project schedule and ensure that planning is correct.
    In addition, it is at this stage that overall quality assurance and monitoring
    policies need to be developed for later implementation in the project lifecycle.
    These refer to ensuring that: 1) work breakdown structures are complete by conducting
    reviews; 2) estimation of time and cost is worked out following industry approaches;
    3) the entire project is conducted following set approaches as devised by organizations
    such as PMI (Project Management Institute).


    # Requirements Engineering


    Once the planning is over, the requirements elicitation stage can be entered.
    The objective of this software development lifecycle is to gather, classify and
    document software requirements (cf. Naseibeh & Easterbrook, 2000; Lamsweerde,
    2000; Wiegers, 2003; Wiegers, 2006). Majority of software project fail due to
    weak and incomplete requirement engineering phase. It is important to employ multiple
    requirement elicitation techniques to better understand the software requirement.
    It is important that appropriate time is spent to discuss system requirements
    with the customers. Furthermore, the requirements classification, prioritization
    and validation need to be carried out in a well planned manner to understand the
    relationships among requirements. At the end of this stage, a well documented
    software requirement specification should be available as a requirement baseline
    for the entire lifecycle project. Quality procedures at this stage refer to ensuring
    that 1) each meeting achieves the aim; 2) reviews for documents are conducted
    so that ambiguities and omission can be removed; 3) development team exhibit the
    professionalism and follow the code of conduct already set.


    # System Design


    This stage is the first step in the execution of the project plan. During this
    stage, the system design and architecture is established. The typical quality
    attributes like performance, maintainability, understandability, ease of use (when
    the product is complete), and maintainability are taken into account during system
    design and architecture. In order to avoid later problems, it is important to
    measure the performance of proposed system design and architecture and benchmark
    it with required performance levels by conducting complexity analysis. This would
    give an early indication of our approach lacks required performance level. The
    design approach depends on the application domain; however, one way to instill
    quality is to follow the engineering approach, practicing principles such as abstraction,
    information'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# A Review of Software Quality Methodologies


    hiding and modularity (cf. Song, & Osterweil, 1994). As an example: modularity
    will help to reduce complexity and information hiding will aid the functional
    independence. As a result, the final product will be better constructed.


    # Coding


    The coding phase is the realization of requirements in a programming environment.
    Here, the design is implemented to develop the software artifact. The selection
    of programming environment also affects the quality, so it is important to evaluate
    the benefits and limitations of programming environment and project quality goals.
    Furthermore, it is recommended to follow the best practices for coding, to improve
    the code readability and understandability and also ensure modularity (cf. Seacord,
    2005). Coding standards walkthroughs and coding review procedures must be in place
    to ensure quality.


    # Testing


    Software testing refers to verification and validation activities in software
    development lifecycle. These activities are important part of software development
    lifecycle as the development phase. Here, the requirements are validated to ensure
    that the final product conforms to the requirements at the beginning. A weak verification
    strategy (often mainly to save time as perhaps the project is already behind schedule)
    can allow the product to pass through, which does not meet quality criteria. It
    is pertinent that these verification activities should not only focus on software
    artifacts by conducting code testing, instead the artifacts produced throughout
    the lifecycle (such as software requirement specification, project plan, configuration
    management etc.) should also be subject to verification. In other words, testing
    of the product is as important as ensuring that the procedures are also of good
    quality. Here, quality needs to be instilled in all aspects of software testing
    including test planning, automation of testing, requiring ample execution time
    for this stage.


    # Configuration Management


    Software configuration management is not always part of a SDLC. However, it is
    a process to control and track changes in software artifacts as well other elements
    of software configuration throughout the SDLC. Software artifacts and other associated
    elements (including design and documentation) keep on changing due to different
    set of changes which could be corrective, adaptive, perfect or preventive (cf.
    Lz & Swanson, 1980). The changes can affect each artifact in software development
    lifecycle so there should be an effective configuration management'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# A Review of Software Quality Methodologies


    plan in place, to control these different variants of artifacts. In the absence
    of a configuration management plan, the final product may not be integrated based
    on the updated artifacts and as a result, it is quite possible that it may not
    meet the customer requirements or expectations. This activity is often neglected,
    mainly due to lack of time, however, it is important that appropriate time is
    devoted to this activity.


    # QUALITY METHODOLOGIES


    In order to evaluate and improve the quality of products and processes, a number
    of different methodologies have been suggested. This section reviews the prevailing
    methodologies which are employed at different instances in software development
    lifecycle. Some of these have already been mentioned, the following sections will
    provide more detail.


    # Software Quality Standards


    Knowledge be a strategic asset for every organization to improve the organizational
    processes (cf. Grant, 1996; Spender, 1996). Knowledge about best practices in
    software development life cycle activities can help to improve the quality of
    the software products as well as processes. As a result, notion of software quality
    standards have gained considerable importance. Since software development is a
    human centric activity, complete automation of software development activities
    is not possible but it has been observed that, when provided a set of guidelines,
    the activities in software development lifecycle work better compared to a scenario
    where every team member is open to experiment. Numerous quality models have been
    suggested. Generally, these models are classified into two categories:


    +   - Those commonly referred to as process improvement guidelines and Those often
    referred to as assessment frameworks


    Some quality models work in a hybrid manner i.e. as a combination of the two approaches.
    Table 1 provides a list of a number of important software quality models, currently
    available. When selecting a quality model, one has to keep in mind the similarities
    and differences of the current project with the standardized approach. This will
    then help in instantiating the activities according to the project needs.


    Software quality models provide a mechanism for channeling knowledge about development
    of complex software. However, recent literature has highlighted that many software
    companies having failures in adapting to defined software standards or simply
    not adhering to the standards. The typical reasons of this behaviour are'
