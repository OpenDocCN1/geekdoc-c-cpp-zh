  md: '# Chapter 1


    # How Much Automation can be Done in Testing?


    Izzat Alsmadi

    Yarmouk University, Jordan


    # ABSTRACT


    It is widely acknowledged that software testing stage is a stage in the software
    project that is time and resources’consuming. In addition, this stage comes late
    in the project, usually at the time when pressure of delivery is high. Those are
    some reasons why major projects in testing focus on methods to automate one or
    more of activities in this stage. In this chapter, description of all sub stages
    in software testing is explained along with possible methods to automate activities
    in this sub stage. The focus in this chapter is on the user interface of the software
    as it is one of the major components that receives a large percentage of testing.
    A question always raised in testing is whether full test automation is possible
    and if that is feasible, possible and applicable. While 100% test automation is
    theoretic and impractical, given all types of activities that may occur in testing,
    it is hoped that a maximum coverage in test automation will be visible soon.


    # INTRODUCTION


    Part of software project development, it is very important to make sure, before
    product delivery, that the software is working as expected without serious flaws
    or problems. Testing the software, like any other product, can be seen from several
    perspectives. It can be based on what we are testing. For example, each deliverable
    in the


    DOI: 10.4018/978-1-4666-0089-8.ch001'
  merge: -1
