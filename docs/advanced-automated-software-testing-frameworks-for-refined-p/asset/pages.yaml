    process effectiveness and reliability. Project attributes highlight the effectiveness
    of a project. The process and product metrics can be extended to project level
    as well. Resource metrics are used to determine the quantity of resources which
    are consumed for the realization of software projects. An example is the effort
    that has gone into the project, which can be a measure in person months or total
    development time.


    # Reviews and Inspections


    Reviews and Inspections are another important set of procedures which are applied
    to work in software products (cf. Wiegers, 2002). The objective is similar to
    auditing i.e. to improve software processes and product qualities through reviews
    and inspections. IEEE standard for software reviews define reviews as “A process
    or meeting during which a software product is presented to project personnel,
    managers, users, customers, user representatives, or other interested parties
    for comment or approval.”


    Inspections are also defined in IEEE standards for software reviews as follows:
    “The purpose of an inspection is to detect and identify software product anomalies.
    This is a systematic peer examination that:


    +   * Verifies that the software product satisfies its specifications

    * Verifies that the software product satisfies quality attributes

    * Verifies that the software product conforms to applicable regulations, standards,
    guidelines, plans, and procedures

    * Identifies deviations from standards and specifications

    * Collects software engineering data (for example, anomaly and effort data) (optional)

    * Uses the collected software engineering data to improve the inspection itself
    and its supporting documentation (for example, checklists) (optional).


    Reviews are used to uncover error and verify that software meets its requirements,
    followed followed standards and is developed uniformly. The review results contain
    decisions about the product and all the team members need to sign off (Frank et
    al., 2008). The products, here, refer to requirement documents, design diagrams,
    source listings, test plans as well as any other associated products of the SDLC
    activities. Proper views will help to develop products with appropriate quality.'
