  md: '# Runtime Verification of Distributed Programs


    Various temporal logics have been defined in the literature. LTL, CTL and CTL*
    are the most commonly used temporal logics. All these logics use four temporal
    operators G,F,U,X. The meaning of these operators can be described as:


    +   -Gp: Globally p, i.e., assertion p holds in every state.

    : Future p, i.e., assertion p will hold in a future state.

    Uq: p Until q, i.e., assertion p will hold until q holds.

    X: Next p, i.e., assertion p will hold in the next state.


    In the following subsections we will give some details about LTL, CTL and CTL.


    # Linear Temporal Logic


    Linear temporal logic (LTL) is used to specify properties of interleaving sequences
    (i.e., paths). LTL uses the four basic temporal operators G,F,U,X. The syntax
    of LTL is defined by the following grammar where terminals ~, ∧, and ∨ are logical
    connectives; terminals X, and U are temporal operators; terminal ap denotes an
    atomic property, (ap ∈ AP); and nonterminal f denotes an LTL formula:


    ```

    f:= ap |f∧f |f∨f |¬f |Xf|Uf

    ```


    We have the following equivalences for LTL operators,


    Fp≡trueUp


    Gp≡(trueU¬p)


    Based on the above equivalences, any LTL property can be expressed using only
    symbols from the set {~, , X, U} ∪ AP.

    More details about LTL property can be found in (Pnu, 1979).


    # Computation Tree Logic (CTL)


    Computation tree logic CTL is a branching time logic; meaning that the computation
    starting from a state is viewed as a tree where each branch corresponds to a path
    (Exe, 1990). The truth of a temporal formula in CTL is defined for a state if
    all the paths or some of the paths originating from that state satisfy a condition.


    CTL temporal operators are pairs of symbols. They talk about what can happen from
    the current state. The first member of the pair is one of the path quantifiers
