    In the first activities described of the software testing framework, a formal
    format is required to generate the test cases automatically. We defined a GUI
    test automation model in an XML format for that purpose (Alsmadi and Magel 2007).
    The tool analyses the GUI and extract its hierarchical tree of controls or objects.
    The decision to use XML File as a saving location is in the fact that XML Files
    support hierarchy. This hierarchy can be persisted from the XML File. We encoded
