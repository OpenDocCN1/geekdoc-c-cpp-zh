    model. Some papers include a description of an overall data model framework (Memon
    2004, White et al 2001 and Bret 2004). The GUI testing framework described in
    some of these references is a general test automation architecture that includes
    test case generation, selection, execution and verification. It can be applied
    to any testing or GUI testing model.


