  md: '# Test Case Prioritization using Cuckoo Search


    test suite T'' from the test cases and modified lines to avoid a redundant coverage.

    Finally at the end of the phase 1 the program P can be executed with the minimum
    number of test cases where the program has been modified.


    # Step 1


    As shown in Figure 1, initially a test suite T, let''s say the test suite contains
    N test cases. The lines of each test case (TL) covers and the lines of code where
    the program has been modified (MOD_LINES) will be given for the program P. An
    object will be created for each test case and the lines covered by it will be
    stored in an array. The NO MATCHES for each test case will be calculated with
    the new lines of code using hash algorithm. Then sort the test case objects by
    NO_MATCHES found and adding the test case to the new test suite T''.


    # Step 2


    By calculating the intersection between MOD_LINES and TL (i), let''s say i, the
    test case that was added before. The lines of code matched by test case i TMATCHLINES(i)
    will be obtained.Then the lines of code TMATCH_LINES(i) will be removed from the
    remaining test cases TL(j),j=1 to N and in the MOD_LINES to avoid redundant coverage
    matches.. Then again the NO_MATCHES is calculated for the remaining test cases
    with the modified MOD_LINES.

    By repeating Step 2 described above and removing the test cases that have NO_MATCHES
    is equal to zero in every iteration.A test case will be added to new test suite
    T'' after each iteration.


    # Step 3


    By the end of step 2 a new test suite which has less number of test cases than
    T, will be generated. Then considering the dependent test cases since the test
    cases cannot be removed if there exists some other test cases which depends on
    the test cases are removed, even though they''re not covering new lines of code.
    To implement this, this dependent test case will be taken in the form of a graph
    using the data structure adjacency matrix (Michael T Goodrich, 2006) where values
    0 or 1 assigned as elements of matrix based on dependency of corresponding row
    to column of matrix. By using topological sort (Michael T Goodrich, 2006) on this
    graph dependent test cases will be generated.


    Suppose that a test case TC(i) is not in T'' because it is not covering MOD_LINES
    while a test case let''s say TC(j) which is in T* and depends on TC(i).Then TC(i)
    will be added to the test suite T''.'
