    # Step 2. Derive severity probability for each test case


    After running the full test suite, we can sum up the number of defects uncovered
    by each test case. Learning from real in-house testing, we find that the severity
    of defects (how important or serious the defect) is very important for software
    quality. Considering this aspect, we modify the simple risk model that we mentioned
    previously. The probability element in the original risk model is changed to severity
    probability, which combines the average severity of defects by multiplying the
    Number of Defects N by the Average Severity of Defects S (N×S), we can estimate
    the severity probability for each test case.


    Severity probability falls into a zero to five scales, where zero is low and five
    is high. For the test cases without any defect, P (t) is equal to zero. For the
