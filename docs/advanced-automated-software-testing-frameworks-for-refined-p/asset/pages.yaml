    # Fitness Function (Krishnamurthy R and Mary Arul S A Sahaaya, 2009):


    The fitness value considers (as as reported in Krishnamurthy R and Mary Arul S
    A Sahaaya, 2009) the incremental code coverage of the test suite, giving precedence
    to test suites whose earlier tests have a greater coverage. Fitness value is calculated
    in two parts. First, F-actual is computed by summing the products of the execution
    time (Ti) and code coverage of test suite


    TSj {1, i} = (T1 .... Ti) for each test case in test suite.

    Fs-actual

    For test TS order let''s say TS (i=1 to k).


    Fs-actual=0 //initialized to zero

    For (i=1 to k)

    Fs-actual=Fs-actual + Time (TC (i)) * code coverage (P, TS {1 to i})

    Fs-max represents the maximum value that Fs-actual could take (i.e., the value
    of Fs-actual if TC1 covered 100% of the code covered by T


    Fs_max (P, TS) = Code coverage (p, TS)*summation of (i=1 to k Time (TC (i)))

    Fitness value=Fs-actual/Fs-max


    # FIRST PHASE (AGGRAWAL K K, SING Y AND KAUR A, 2004)


    During Phase 1, only the lines of code where the program P has been modified will
    be considered. Presenting the algorithm for the modified lines of code of the
    same algorithm works well with addition and deletion of lines in the Program P(as
    given in Aggrawal K.K. et al,2004). In step1 NO_MATCHES will be calculated for
    each test case and sorting the test case objects with the NO_MATCHES found. In
    step 2 in each iteration a test case will be added to the test suite T’ and repeating
    step1 again by removing lines of code that was covered by the test case added
    to the'
