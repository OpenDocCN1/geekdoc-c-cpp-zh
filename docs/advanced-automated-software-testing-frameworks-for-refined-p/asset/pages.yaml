    # REGRESSION TESTING


    Regression testing is defined as “the process of retesting the modified parts
    of the software and ensuring that no errors have been introduced into previously
    tested code”. Let P be a program, let P’ be a modified version of P, and let T
    be a test suite for P. Regression testing consists of reusing T on P’, and determining
    the new test cases are needed to effectively test code or functionality added
    or changing in producing P’. There is various regression testing techniques (Duggal
    and Suri, 2008): Retest all, Regression Selection, Test Case Prioritization and
    Hybrid Approach (Figure 7).


    # Retest All


    The simplest regression testing strategy, retest all, reruns every test case in
    the initial test suite. This approach, however, can be prohibitively expensive
    – rerunning test cases in the test suite may require an unacceptable amount of
    time and cost.


