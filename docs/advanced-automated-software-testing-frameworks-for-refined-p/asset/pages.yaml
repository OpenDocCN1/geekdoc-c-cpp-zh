  md: '# Testing E-Learning Websites


    Figure 2. User experience grid (Adapted from Zenke and Connellan (2001))


    ![](img/03347457387556f0f0f2af882be884ac_206_0.png)


    Zenke and Connellan (2001) posit that each learning experience, regardless of
    whether it''s online or offline, sets the stage of expectations for future interactions.
    The user tends to focus on ease of use (more than the usefulness), familiarity,
    skills needed, website-to-website learning comparison, and on the task complexity.
    Task complexities can be defined in terms of navigation on the website, information
    search, transaction processing, and online support (i.e., help). A participant
    related to this terms of the web-based system as:


    > “System is not intelligent to check simple errors like spell checks, grammar
    checks...”


    The statement referred to the user''s learning experience of the systems'' capabilities
    in terms of their prior experience. The user had had this functionality in another
    system and expected to match with their prior information experience in the web-based
    system. The user''s perceived experience about the current system being below
    its standard and not helpful in doing the task.


    Zenke and Connellan (2001) developed a model (Customer Experience Grid, see Figure
    2) to capture the sum total of user learning experiences. The vertical axis of
    the user experience grid is the outcome the user receives, and offered on a website.
    The horizontal axis the user goes through the learning process to obtain the outcome,
    as navigating the website, putting out information, looking for pricing, ordering
    a product et. User compares similar outcomes on other website or in an offline
    environment in user transaction process. Zenke and Connellan (2001) claim that
    the process – the way they are served – is what makes it into learning experience,
    positively or negatively for users.


    If the user''s needs are not met on the process and outcome axes, they tend to
    go elsewhere, and hence called defectors. Similarly if the user''s needs are met
    on one'
