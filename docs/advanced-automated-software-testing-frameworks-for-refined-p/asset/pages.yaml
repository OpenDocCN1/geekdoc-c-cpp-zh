    # CLASSES OF PROPERTIES


    In this section we will describe four classes of properties for which efficient
    detection algorithms have been developed.


    # Stable Properties


    A stable property remains true once it becomes true. Termination detection is
    an example of stable property detection. Stability depends on the system; some
    properties are stable in some systems but not stable in others. The global snapshot
    algorithm by Chandy and Lamport (Chandy & Lamport, 1985) can be used to check
    the satisfaction of a stable property in a given distributed computation.


    The value of an unstable property may change from time to time. There is very
    little value in using a snapshot to detect a non-stable property—the property
    may have even if it is not detected. Many researchers have described algorithms
    to detect stable and unstable properties (Garg & Waldecker, 1996, 1994, Schwarz
    & Mattern, 1994, Garg & Waldecker, 1992, Haban & Weigel, 1988).


    # Observer Independent Properties


    Charron-Bost, Delporte-Gallet, & Fauconnier (1995) present a class of properties
    that they can call observer independent. This class includes all properties such
    that (Possibly: $\phi$) $\equiv$ (Definitely: $\phi$). A disjunction of local
    properties is an observer independent property. Any stable property is also observer
    independent, the proof of this fact can be found in (Charron-Bost et al., 1995).


    The name “observer independent” originates from the notion of a set of observers
    where each observes a different sequential execution of the distributed program.
    Each observer can determine if $\phi$ becomes true in any of the global states
    observed by him. If property $\phi$ is observer independent, then all observers
    will agree on whether $\phi$ ever became true.


    Independent properties can be detected efficiently because we need to traverse
    only a single path of the state lattice to detect an observer property $\phi$.
    If $\phi$ is true in the path, then Possibly: $\phi$ is clearly true. On the other
    hand, if $\phi$ is false along that path, we know that Definitely: $\phi$ is also
    false. Since (Possibly: $\phi$) $\equiv$ (Definitely: $\phi$) for observer independent
    properties, we conclude that $\phi$ is also false for the lattice.'
