    Some papers elaborated on problems with capture/play-back tools (Marick 1998,
    and Saket 2005). The need to replay all test cases, editing the script code is
    complex, and the lack of error handling are these issues. The reuse of test oracles
    is not very useful in the case of using a capture/play-back tool.


    The standard industry practice of buying tools for testers is unacceptable. The
    goal of automated tests is to be usable by everyone. Licenses for GUI test tools
    often run up to $7,500 a seat (Bret 2004). It''s hard enough for traditional organizations
    to find the budget to buy some licenses for their testers.


    In the next part some other papers are presented. These papers are related to
    the specific work of each module in the software testing subst. The following
    paragraphs present some of those papers.


    Several approaches have been proposed for test case generation, including: random,
    path-oriented, intelligent approaches (Memon al 2003) and domain testing (which
    includes equivalence partitioning, boundary-value testing, and the category-partitioning
    methods) Mellon 2004).


    Path oriented techniques generally use flow information to identify set of paths
    to cover and generate the appropriate test cases to execute each identified path.
    These techniques can be classified as static or dynamic Static techniques are
    based on symbolic execution, whereas dynamic techniques obtain the necessary data
    by directly executing the application under test (Alsmadi and Magel 2007).


    Goal-oriented techniques identify test cases covering a selected goal such as
    a statement or branch, irrespective of the path intent. Intelligent techniques
    of automated test case generation relies on complex computations to identify test
    cases. The real challenge to test generation is the generation of test cases that
    are capable of detecting faults in the AUT.


    (Goga 2003) introduces an algorithm based on a probabilistic approach. It suggests
    test generation and test execution in one phase. (Tretmans 1996) studies test
    case generation algorithms for implementations that communicate via inputs and
    outputs, based on specifications using the Labeled Transition Systems (LTS). In
    the (MulSaw project 2006), the team used two complementary frameworks, TestEra
    and Korat, automatically generate all non-isomorphic test cases from the method’s
    pre-condition and check correctness using the method’s post-condition as a test
    oracle. There are several papers published related to the MulSaw project.'
