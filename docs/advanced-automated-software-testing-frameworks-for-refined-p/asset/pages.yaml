    testing techniques are usually applied, i.e., test cases are derived or selected
    based on the system specification. Integration testing is driven in practice by
    manual tests that highly depend on the experience of the test engineers and on
    their system knowledge. This approach leads to inefficient quality assurance in
    terms of effort, test coverage, and product quality.


    By introducing model-based development approaches for software in embedded systems
