  md: '# Chapter 9

    Testing E–Learning Websites


    Kamaljeet Sandhu

    University of New England, Australia


    # ABSTRACT


    Testing e-learning websites may provide an insight to characteristics that are
    useful and others that are not so useful to the users. From a technical or systems
    development perspective, such understanding may not be known till it is finally
    tested and by the users. Therefore this research aims to explore the effectiveness
    of e-learning websites in relation to user’s perceptions (either positive or negative)
    that are developed when interacting with e-learning system and the features they
    have to use.


    # INTRODUCTION


    User’s engaged in web-based learning activities tend to focus on prior information
    experience and perception, especially from the offline environment. The effect
    of information on user experience in web-based learning on first time user’s compared
    to the frequent user’s will vary, a user with no experience can form high (or
    low) perception, especially via word of mouth communications. Such perceptions
    may behave differently from those developed via experience. The concept of flow
    is important because it has a clear set of antecedents and consequences that have
    implications for web-based learning. User’s information experience on a website,
    its impact, retention of that web-based learning experience can be related to
    the flow concept.


    DOI: 10.4018/978-1-4666-0089-8.ch009'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Testing E-Learning Websites


    For the flow state to be experienced a critical threshold and the user must be
    in balance and the user must be paying attention. That is a user must be in state
    of learning. Hoffman and Novak (1996) suggest that the consequences of flow in
    web-based environments relates to increased learning, increased exploratory and
    participatory behaviours, and more positive subjective experiences, a critical
    objective of a commercial website is to facilitate the flow experiences. Karahanna
    et al. (1999) suggest that user’s acquire personal experience and their own source
    of evaluative information using the information system. An experience can have
    a strong effect on the user remembering their learning experience on a particular
    website.


    User information experience in web-based systems learning is an important area
    that is gradually growing with introduction and adoption of web-based technology
    (i.e. WebCT, Firstclass, and Blackboard). The information available in web-based
    systems may be one of the determinants which direct the user in achieving the
    desired objectives that form the purpose of using the system. The user information
    requirements may be based on prior experience in similar or related traditional
    learning environment. Information search form the initial need in the activity
    to achieve the desired objectives, and the acquisition of information experience
    process. If information not available to users in e-learning or traditional learning
    environments may direct the user in adopting the search process based on experience.


    Web-based user services are generally perceived as successful, but there has been
    evaluation of how well the web meets its user’s primary requirements (D’Ambra
    and Rice 2001). The freedom and flexibility offered by the Internet allow users
    to connect to other websites of their interest and at the same time build upon
    their experience on the web. A number of researchers suggested that flow is a
    useful construct for describing interactions with websites (Csikszmihalyi 1975;
    Johnson and Mathews 1997; Zeithaml et al. 1993; Zeithaml et al.; 2000); Flow has
    been described as “process of optimal experience” (Csikszmihalyi and Leuvre 1990)
    achieved when sufficiently motivated user perceives a balance between their skills
    and challenges of the interaction, together with focused attention (Hoffman and
    Novak 1996).


    This study assumes that user’s experience with information already exists in the
    traditional environment (i.e., offline). Understanding the traditional learning
    complexities of user experience with information and transforming it into the
    web-based environment is a challenge for both practitioners and researchers. The
    dimension and scale of such complexity in technology and its alliance with information
    may provide an integration point where technology requirements may meet with the
    user’s learning experience. Defining user experience with information is not an
    easy and straightforward process. Rather developing an approach to studying the
    learning process on the basis of web-based learning and'
