  md: '# Chapter 2

    On the Application of

    Automated Software

    Testing Techniques to

    the Development and

    Maintenance of Speech

    Recognition Systems


    Daniel Bolanos

    University of Colorado at Boulder, USA


    # ABSTRACT


    This chapter focuses on the description and analysis of an automated software
    testing approach followed during the development of a new generation automatic
    speech recognition system. Automatic speech recognition systems present a series
    of characteristics that distinguish them from other software systems and make
    the elaboration of test-cases a truly complex task: the metrics used to measure
    their performance and accuracy, the nature of the input and output data that they
    receive and produce, the multiple data formats, their working mode, the high number
    of configuration parameters, et cetera.


    This chapter provides practitioners in the field with a set of guidelines to help
    them through the process of elaborating an adequate automated testing framework
    to competently test automatic speech recognition systems. Through this chapter
    the testing process of such a system is analyzed from different angles, and different
    methods and techniques are proposed that are well suited for this task.


    DOI: 10.4018/978-1-4666-0089-8.ch002'
  merge: -1
