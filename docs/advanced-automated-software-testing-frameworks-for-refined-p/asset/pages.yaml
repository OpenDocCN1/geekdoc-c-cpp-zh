  md: '# On the Application of Automated Software Testing Techniques


    # 2. BACKGROUND


    Due to the increasingly important role of software testing in software quality
    assurance, during recent years, the use of testing frameworks that assist the
    developer during the testing process, and particularly the use of those belonging
    to the xUnit family, have proven to be invaluable. The production of high-quality
    and bug-free software products and solutions has gained a crucial importance in
    the software development industry, with its focus on meeting the needs of the
    increasingly demanding end-users. In the last few years, many software testing
    techniques and methodologies have emerged to address these challenges, some of
    which are influenced by Agile methodologies (Beck, 2001) and provide us with a
    wide set of principles, practices and recommendations for all the tasks in the
    software testing process, from test case design to automation of functional tests.
    In this context, an overwhelming number of testing frameworks and tools have been
    developed and are available (many of them under open-source licenses) with the
    purpose of aiding the developer in testing every particular system aspect within
    any programming language imaginable.


    However, as the number of resources and techniques available continues to increase,
    the complexity derived from the selection and integration of the most relevant
    software testing principles, techniques and tools into a convenient and effective
    software testing framework. In this respect, although it will contain information
    about the tools utilized, this chapter is mainly focused on techniques and strategies
    that help in the development of effective automated tests in the context of a
    speech recognition system and in particular for a speech decoding system.


    To our knowledge, very little work has been published in the literature on this
    topic. For example in (Harrington, 2008) a embedded speech recognition system
    that recognizes isolated words using Dynamic Time Warping (DTW) is developed and
    tested using different approaches like unit testing and component-wide integration
    tests. However, unlike the ASR system we developed, this system does not continuous
    speech recognition and it is based on a rather simpler pattern matching technique
    called DTW. Thus, the principle to design the test cases and the testing techniques
    utilized are substantially different. Most of the times the word “testing” appears
    in the speech recognition literature in connection with actual recognition accuracy
    of the ASR system, which is measured using standard metrics like the Word Error
    Rate. For example, Sphinx (Lee, 1990), one of the most popular speech recognition
    systems used for research, provides the user with a mechanism to run “regression
    tests”, which in this case are tests that are run regularly to determine how Sphinx
    performs under a variety of tasks (ranging from small vocabulary to very large
    vocabulary tasks). These tests are useful to track the'
