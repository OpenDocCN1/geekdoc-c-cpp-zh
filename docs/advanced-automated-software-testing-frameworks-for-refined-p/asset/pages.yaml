  md: '# How Much Automation can be Done in Testing?


    # Challenges in GUI Test Automation


    GUI test automation is a major challenge for test automation activities. Most
    of the current GUI test automation tools are partially automated and require the
    involvement of users or testers in several stages. Examples of some of the challenges
    that face GUI test automation is: dealing with continuously new controls or components,
    the dynamic behavior of the user interface, timing and synchronization problems,
    etc.


    In record/play back test automation tools, we have to retest the application in
    case of any change in the functionalities or the GUI of the program. In many cases,
    this is seen as making such tools impractical especially as the program GUI is
    expected to be continuously evolved and changed.


    # GUI Test Automation Tools


    There are several GUI test automation tools available in the market. Some of the
    larger vendors for such tools include: IBM Rational, Mercury, and Segue. Trying
    to build a GUI test automation tool is like trying to make a new operating system
    in that the available resources for the existing ones (i.e. in the market or the
    industry) are hard to compete with. However, GUI test automation has not reached
    a mature level where those tools can be implemented in all scenarios with no problems.
    User interfaces evolve rapidly with richer and newer components. The processes
    in general use artificial intelligence algorithms to simulate user activities.
    The richness and complexity of this space make it possible for new research ideas
    to compete with long time existed automation tools in the industry.


    In the research field, there are several research papers about GUI testing using
    the data model (Ames and Jie, 2004, Noristica 1998, Memon et al., 2003, Memon,
    2004, Memon and Xie, 2005, and Spreinkle et al. 2005). The overall goals and approach
    for this work is very similar to their goals. The GUI testing framework described,
    as a GUI automation structure, is generic and should be applied to any testing
    or GUI testing model. Since research projects in general have limited resources,
    each paper discusses a specific area of GUI test automation activities. Without
    having all components, it is very hard to use these ideas in the industry.'
