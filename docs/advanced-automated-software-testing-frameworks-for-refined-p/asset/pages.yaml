  md: '# A Review of Software Quality Methodologies


    # SOFTWARE TESTING


    Software testing is an important tool to analyze the quality of software systems
    and to test correctness and performance of the system. It has two aspects to it:
    verification and validation. Verification refers to conformation to user requirements
    and validation refers to it being ''correct'' from users'' perspective. The objective
    is to verify that the software system adheres to software requirements and is
    free of bugs and the final product is one that the users originally for. There
    has been an extensive literature available discussing the software testing challenges,
    research issues and implications (cf. Borba et al., 2007; Bertolino, 2003; Bertolino,2200).
    A comprehensive test plan should be established for each software development
    project highlighting scope, approach, resources and schedule of testing activities.
    The selection of appropriate test strategy is important in testing planning. We
    highlight different testing strategies which can be adopted depending upon the
    status and requirements of the software project.


    # Top Down Testing


    Top level module is tested first, and then the whose calling module has already
    tested, has the turn (cf. Myers, 1979). A “stub” module is used when the module
    under testing needs to exchange data from its subordinate modules. This approach
    is quite helpful in identifying problems earlier if the errors are profoundly
    occurred in top level modules.


    # Bottom Up Testing


    In contrast to top level testing approach if it is expected that majority of flaws
    will occur in internal modules then a bottom up testing strategy may be more productive
    in identifying flaws quickly. In this approach the bottom level module is tested
    first and if it requires data exchange with its higher module a “driver” module
    is realized to simulate the functionality of higher modules. Once the testing
    of bottom level module is completed, then its upper level module has the next
    turn.


    # Black Box Testing


    The objective of black box testing approach is to verify that the output of the
    program is correct with respect to a given input data. In this approach knowledge
    of program logic and internal structure is not required; instead test cases are
    designed using the software requirement specification.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# A Review of Software Quality Methodologies


    # White Box Testing


    In contrast to black box strategy, white box testing focuses on program internals
    and logic. The objective of this approach is to verify that the program code behaves
    correctly. This requires thorough code knowledge to carry out statement and branch
    testing to evaluate control flow and dataflow.


    # Grey Box Testing


    Like black box testing, grey box testing involves testing the software by evaluating
    the output for a given input, but the input values are selected in such a way
    that different internal program paths are evaluated. This requires extensive knowledge
    of software''s internal components and their interaction behavior.


    # Time Box Testing


    With the increasing popularity of agile software development approaches, similar
    testing methodologies have emerged. In time box testing we have a predefined deadline
    when the testing tasks need to be finished. The testing tasks are scheduled in
    a manner that this deadline is achieved.


    # Test Driven Testing


    Beck (2003) describes that in this testing approach, a test case is written before
    the software code describing some functionality. In the absence of software code
    this test case fails then the appropriate code is written to satisfy this test
    case. Later refactoring technique may be used to improve the quality of written
    code.


    # Good Enough Testing


    Software testing is expensive as it requires considerable resources. Good enough
    testing approach tries to make a balance between software cost and quality. Its
    objective is to realize a software product that is good enough to meet customers''
    requirements and organization''s expectations (cf. Bach, 1998; Elather, 2008).


    # Risk Based Testing


    Risk based testing is another approach where preference is given to test cases
    which have high probability of occurrence. In this approach test cases are defined
    taking'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# A Review of Software Quality Methodologies


    account the most important risk factors and prioritizing the test cases of most
    critical areas first (cf. Redmill, 2004; Souza et al., 2010)


    # Simulation


    The software systems (especially embedded system settings) where physical testing
    is difficult to conduct, simulation is an important tool to analyze the behavior
    of the system. Simulation provides replicated real life environment to understand
    the operation of the system and test its behavior before the software is actually
    deployed (cf. Henry, 2000; Bai et al., 2007).


    # Input / Output Testing First


    It has been observed that the input and output from the software system are often
    error prone. In this testing approach every valid input is used as a test case
    to demonstrate every valid output (cf. Frank et al., 2008).


    # Certification


    Testing tasks may be outsourced to some independent third party entities or tied
    with some external well known standard. This could be the demand of the customer
    or maybe be exploited by the company to better market their software product.


    # Random Input


    Carrying out complete software testing is difficult due to required time, effort
    and cost. In random input testing strategy a sub set of randomly selected inputs
    is applied. The random selection of input may be influenced by some heuristics,
    and/ or prior experiences. This technique is quite useful in cases where possibility
    of number of input events is relatively very high (cf. Mayer & Schneckenburger,
    2006; Ciupa et al., 2007).


    # Usability Testing


    The objective of usability testing is to evaluate how easy it is to understand
    the graphical user interface of the system (cf. Andreas et al., 2007; Andrzejczak
    & Liu, 2010).'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Qualification Testing


    The objective of this testing strategy is to evaluate whether the software product
    is suitable for operational use (cf. Frank et al., 2008).


    # Operational Testing


    The operational testing takes qualification testing to next level and to analyze
    whether the software system works properly in its operational environment (cf.
    Frank et al., 2008).


    # Acceptance Testing


    The objective of acceptance testing is to verify the finished product from end-user/customer''s
    perspective in order to see if it meets the specified functional requirements
    earlier by the customer during the requirements engineering. Acceptance testing
    is generally performed by the customer using his test cases/business scenarios
    and is conducted before the end product is delivered (cf. Hsia et al., 1997; Park
    & Maurer, 2008).


    # Alpha Testing


    Alpha testing is conducted by end users to identify the potential bugs in software
    system. The testing is normally conducted at developer''s site which simulates
    the end user environment. The objective of this testing methodology is to reduce
    the potential problems before the actual release of software product.


    # Beta Testing


    Beta testing is carried out by conducting external acceptance testing at customer''s
    site. The real world situation helps in identifying faulty behavior and bugs which
    were not visible during house testing.


    # Performance Testing


    The performance of software systems is vital for the acceptability by customers.
    Performance testing focuses on factors like effectiveness, reliability, speed,
    resource consumption and efficiency in operational conditions (cf. Hoskins et
    al., 2005; Shams et al., 2006; Goldin & Tennant, 2007).'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# A Review of Software Quality Methodologies


    # Environmental Load


    This testing approach is similar to performance and stress testing; its objective
    is to find the highest load level under which the software system can work properly.


    # Worst Case Testing


    In the software testing literature it is described that mostly the errors are
    found on the boundary / extreme values of input classes used. In this approach
    extreme values are entered to see system behavior (cf. Bright, 2000).


    These different software testing strategies can be applied at different levels
    of software testing which are highlighted in Table 2.


    # SOFTWARE AUDITS


    Software audits are an important tool to identify the discrepancy much earlier
    in a software development lifecycle. A worthwhile objective of auditing is to
    examine the product components and processes and improve as necessary to improve
    the product and process quality. IEEE standard for software processes define audit
    as “An independent examination of a software product, software process, or set
    of software processes to assess compliance with specifications, standards, contractual
    agreements, or other criteria.” Frank et al., (2008) describe that auditing consists
    of four stages which are planning and preparation, performance, reporting, corrective
    action and follow-up. They further classify audits into 12 classes as described
    in Table 3. The output of software audit is a report which is sent to audit initiator
    and then to audit organization. It contains audit findings and type and timing
    of follow up activities (Frank et al., 2008).


    # CONCLUSION


    Software quality is an important characteristic of all well designed products
    which needs to be an important aspect of all phases of software development. It
    is important that the development process is correctly followed and products are
    built in a ‘quality-aware’ environment. The difficulty is that quality is an abstract
    concept and cannot be easily quantified. However, it can be determined or its
    level established in terms of the quality attributes such as the product’s correctness,
    reliability, performance, usability, portability etc. To get the quality right,
    it is also important that'
