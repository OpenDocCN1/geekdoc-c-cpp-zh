    concurrency, the number of global states of an execution can grow exponentially
    with respect to the number of program statements executed. A set of $n$ concurrent
    events forms $2^*$. As a result, deciding whether a distributed satisfies satisfies
    a predicate (property) can incur significant overhead. This problem is referred
