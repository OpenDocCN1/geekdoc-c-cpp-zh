    # DISTRIBUTED AND COMPOSITE FUNCTIONS


    The behavioral aspects of the system are described by a set of functions. Functions
    are subroutines and portions of program code that perform specific tasks and fulfill
    specific requirements. Functions are composite, i.e., they can contain or invoke
    other functions. Furthermore, functions can be used by several complex functions,
    e.g., an exception handling routine can be invoked by different system functions.
    Functions are enabled at specific system states, i.e., certain combinations of
    component states. These states describe the pre-condition for the function. During
    the execution of the function, the system state, i.e., the corresponding component
    states, may be changed. The result of the state describes the post-condition of
    the function.


    Functions are executed by stimulating the system via its interface. The system
    behavior is represented by system state changes, system responses to the environment,
    and internal component interactions. Distributed systems usually provide a set
    of functions that are implemented by the interplay of the system components, the
    so-called distributed functions. A function is distributed if at least two components
    are involved and at least one component interaction takes place between the components.
    An interaction is triggered by external stimulation of at least one component.
    The assumption is that the system works in a slow environment, i.e., the environment
    sends inputs only when the system is in stable mode (Lanet & Requet, 1998). The
    system is in stable mode when all components are in stable states, i.e., no outward
    transitions of the components are enabled.'
