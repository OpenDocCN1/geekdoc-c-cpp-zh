    The models described above are systematically constructed from the systems requirements
    specification and the component models. The system requirements specify the distributed
    system functions. defined by pre- and post-conditions, its implementation as a
    composite function, and the concrete component interactions that realize the function.
    Figure 9 shows the main steps of the approach.'
