    \ implemented to verify the correctness of the token-expansion process. The goal\
    \ of this algorithm is to make sure that in the case that the best theoretical\
    \ path according to the available acoustic and language models (and also the value\
    \ of configuration parameters that affect the search outcome, like the insertion\
    \ penalty) corresponds to the string of words in the orthographic transcription\
    \ of the utterance, it is actually found (and with the same associated global\
    \ score) at the end of the search process³. The idea behind this algorithm is\
    \ that at each time frame during the Viterbi search, all the paths with a score\
    \ within the beam width survive.\nThe algorithm proceeds as follows:\n\n+   1.\
    \ Define a reasonable set of configuration parameters in order to minimize pruning\
    \ errors.\n\n+   2. For each utterance in the speech material for testing purposes\
    \ (which will typically be the training partition of the speech corpus):\n   \
    \ a. Decode it and get a hypothesis with its corresponding global and frame-level\
    \ score and the time alignment information (information of starting and ending\
    \ times for each of the lexical units in the path)\n    b. For each utterance,\
    \ perform a forced alignment against the orthographic transcription using the\
    \ same language and acoustic models and the same insertion penalty values. Keep\
    \ the frame-level and global score.\n    c. Compare global scores resulting from\
    \ steps (a) and (b). Here, there are three possibilities:\n        i. If both\
    \ scores are the same, check that the time alignment information in both paths\
    \ is identical. If that is not the case, an error should be reported.\n      \
    \  ii. If the global score resulting from (b) is lower (recall that automatic\
    \ speech recognition log-likelihood values are taken to avoid problems with the\
    \ dynamic range of floating point variables) that the global score in (a), it\
    \ means the recognition system has produced an incorrect hypothesis and has failed\
    \ to output the string of words corresponding to the orthographic transcription\
    \ (what the speaker actually said) of the utterance. This is most likely caused\
    \ by inaccuracies in the acoustic or language modeling, and not due to implementation\
    \ errors, and is therefore out of the scope in testing."
