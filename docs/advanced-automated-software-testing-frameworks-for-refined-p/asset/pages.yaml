  md: '# On the Application of Automated Software Testing Techniques


    comes into play here is the bad principle of if something works (reasonably well)
    do not touch it, as opposed to the good principle of software testing: make your
    changes confidently and run the necessary tests (which include the regression
    and the newly developed test-cases.) We believe that following an adequate software
    testing methodology can overcome these issues and potentially facilitate a more
    rapid development of the field by providing researchers with clear guidelines
    for how to automate the testing of ASR systems, so they can be updated safely
    and confidently.


    This chapter focuses on the description and analysis of a software engineering
    testing approach followed during the development of a new generation speech recognition
    system, which will be released as an open source system in the future to be used
    for the research community. The aim of the chapter is to provide practitioners
    in the field with a set of guidelines to help them through the process of elaborating
    an adequate automated testing framework to competently test ASR systems. ASR systems
    present a series of characteristics that distinguish them from other software
    systems and make the elaboration of test cases a truly complex task; the metrics
    used to measure their performance and accuracy, the nature of the input and output
    data they receive and produce, the multiple formats in which this data can be
    stored and retrieved, their working mode (live, or batch mode), the configuration
    parameters (of which there are a large number and which greatly affect the recognition
    accuracy) In addition, an ASR system comprises a number of modules that need to
    be integrated and tested seamlessly. For this reason, there are many issues upon
    which to shed light and much insight to be provided. Potential readers of this
    chapter could be from speech processing specialists to software developers interested
    in this particular case-study.


    This chapter is divided as follows: section two provides some background on the
    topic, in which preliminary work on software testing and automated speech recognition
    systems tested. Section three introduces the testing approach and methodology
    followed. Section five describe how unit testing has been utilized to test different
    parts of the system and how test cases have been designed to test each of the
    modules of the system: loading of the input data, generation of the output data
    (recognition hypotheses), and actual recognition process. Section six describes
    how to test the system as a whole (i.e. functional testing). Section seven describes
    how software management configuration tools have been used to manage the software
    elements, production code and test code and how to interact with them them during
    the development cycle. Finally, we draw conclusion in section eight.'
