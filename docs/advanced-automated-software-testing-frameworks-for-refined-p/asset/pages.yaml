  md: '# How Much Automation can be Done in Testing?


    We will demonstrate the basics of capture/play-back tools by using the IBM Rational
    Robot (from Stewart, 2008). The Robot can capture and replay user interactions
    with the GUI, a Java application or a Java applet. Figure 1 shows the interface
    for the Robot scripting application.


    The user starts the recording process using the tool selection shown in Figure
    1. The user performs some tasks which are recorded. Figure 2 shows an example
    of a recorded script. To re-execute the recorded actions on the application, you
    can select to run one or more recording from those displayed in the script interface
    (Figure 3). You can also edit the scripts to add or modify any line of code.


    Rational Robot uses Virtual User (VU) script for performance testing or the GUI
    script for functional testing. VU has its own scripting language while GUI script
    uses QBasic scripting language. GUI scripts are used to replay the GUI activities
    users record, while VU scripts are used to replay client/server requests the users
    record during performance testing.


    Depending on the tools used, there are several ways to ensure the success of an
    executed script. In general, a user can define some rules or test points (i.e.
    assertions) to be checked during the execution process. The user defines the expected
    results at those assertion points (expected results can be difficult to describe
    in GUI testing).


    Although many of the capture/play-back tools have been available for several years,
    they have some drawbacks. They are relatively expensive, writing and recording
    test scripts is labor intensive and error prone. They often use proprietary scripting
    languages that make the company developers incapable of editing or fixing their
    errors. They may require a long time to redo tests whenever a change occurs to
    the GUI as a result of a new release. They are not fully automated tools as they
    require a user to record the tests at the beginning and whenever a significant
    change occurs to the GUI functionalities or components.


