  md: '# Chapter 7

    A Review of Software Quality Methodologies


    Saqib Saeed

    University of Siegen, Germany


    Farrukh Masood Khawaja

    Ericsson Telekommunikation GmbH, Germany


    Zaigham Mahmood

    University of Derby, UK


    # ABSTRACT


    Pervasive systems and increased reliance on embedded systems require that the
    underlying software is properly tested and has in-built high quality. The approaches
    often adopted to realize software systems have inherent weaknesses that have resulted
    in less robust software applications. The requirement of reliable software suggests
    that quality needs to be instilled at all stages of a software development paradigms,
    especially at the testing stages of the development cycle ensuring that quality
    attributes and parameters are taken into account when designing and developing
    software. In this respect, numerous tools, techniques, and methodologies have
    also been proposed. In this chapter, the authors present and review different
    methodologies employed to improve the software quality during the software lifecycle.


    DOI: 10.4018/978-1-4666-0089-8.ch007'
