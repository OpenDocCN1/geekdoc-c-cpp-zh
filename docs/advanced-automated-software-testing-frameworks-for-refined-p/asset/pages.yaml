    # CONCLUSION


    The case study data shows that both the staff and the Management were excited
    about the web-based e-services system in terms of user-work management. Those
    inspirations were short-lived when the web e-services system did not meet the
    staff expectations. The perceived usefulness of the web-based e-services system
    in this case was not considered an important factor as the users perceptions were
    based on that system, one that was not capable of delivering.


    The level of interaction from traditional services such as paper-based to webbased
    services and simultaneous use of both has laid a new set of implications for the
    universities, organizations, government, consumers, practitioners, and researchers.
    In understanding the new set of implications, initial research revealed that uptake
    and use of this new innovation has been positive, its acceptance and continued
    use have been limited. The available research identifies some main issues it lacks
    in understanding the impact of the critical success factors. Further research
    will attempt to explore a more structured understanding to web-based systems user
    learning within a theoretical construct.


    In line with the preceding discussion it is suggested that web-based systems adoption
    takes into account the user experience that develops with user interaction with
    the system. Though prior studies even adopted the general technology models like
    the TAM model (Davis 1989; Davis et al. 1989; Davis 1993), which is of significance,
