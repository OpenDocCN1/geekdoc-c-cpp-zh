    # FUTURE RESEARCH DIRECTIONS


    Software security is getting more prominence and is considered as an essential
    artifact of a software development lifecycle (SDLC). By considering software security,
    starting from the stage of ‘Requirements Analysis,all the way to the ‘Testing’
    stages of a SDLC, one can significantly enhance cyber security and reduce the
    number of attacks when the software is being in use (i.e., post-release). The
    book chapter focuses on the static code analysis of software program. A natural
    extension of our work would be to conduct a run-time code analysis of software
    programs and compare the two approaches with respect to the potential vulnerabilities
    identified and the ease of fixing and analyzing the presence of these vulnerabilities.
    In this pursuit, we will also be studying the various tools (like the Fortify
    SCA) that are available among the Software Development community for both static
    code analysis and run-time code analysis and analyze the pros and cons of some
    of the commonly used tools. In we will develop testcases that can be used to capture
    the different vulnerabilities associated with the software. With the Fortify SCA,
    we also plan to study some C++ programs, like that of the file reader program
    in this case study, and identify/analyze vulnerabilities that are either characteristic
    of the language (such as the Buffer Overflow attacks) or also seen in other contemporary
    programming languages like Java.


