    # TYPES OF SOFTWARE MAINTENANCE


    E.B. Swanson initially identified three categories of maintenance: corrective,
    adaptive, and perfective. Later on, one additional category is added by Lient
    and Swanson (1981): Preventive maintenance. The distribution of maintenance activities
    is shown in Figure 2.


    Corrective maintenance is any maintenance activity to fix the bugs that have occurred
    or after delivery (Takang and Grub, 1996), while adaptive maintenance keeps the
    software program working in a changed or changing environment such as the hardware
    or the operating system (Coenen and Bench-Capon, 1993). Perfective maintenance
    is every change to software to increase its performance or to enhance its user
    interface and its maintainability (Vliet, 2000). The goal of preventive maintenance
    is to keep the software functioning correctly at any time.


