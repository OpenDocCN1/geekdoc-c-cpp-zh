    #  8. CONCLUSION


    Through the course of this chapter, we have described a software testing framework
    that was successfully used during the development of a speech recognition system,
    in particular a speech decoder system. In this framework, different testing strategies
    and techniques have been integrated to automatically verify the correctness and
    coherence of different software components from multiple angles: unit testing
    (black box and white box), functional testing, etc. This framework was designed
    to provide the software developer with an automated format by which to test the
    system during the whole development cycle and, even more important in a system
    of its kind, during the software maintenance life cycle. A speech recognition
    system is a system that needs to stay up-to-date and thus needs to be constantly
    updated by incorporating new research contributions.


    +   * A comprehensive description has been provided of test cases that were designed
    to test different components of the speech recognition system, from the configuration
    file to the token expansion implementation.

    * Strategies to test the internals of a speech recognition system have been provided.

    * A mechanism to execute the automated test cases designed from a single script
    has been described.

    * A mechanism to report testing errors in a consistent fashion has been described.

    * How to take advantage of Software Management Configuration tools during the
    development process to aid and support the testing process of an ASR system has
    been described.


    To summarize, a testing framework has been described that will assist speech researchers
    and software developers in the difficult task of keeping a speech recognition
    system up-to-date without compromising its reliability and overall accuracy.'
