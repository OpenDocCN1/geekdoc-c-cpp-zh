    use many different sources of evidence (Yin, 1994) providing real life information
    on the existing problem. Information on the current system provides insight on
    the obstacles in the user acceptance in systems development and implementation
    process. This led to the development of converging lines of inquiry, a process
    of triangulation (Yin, 1994) in processing information from number of sources.


