    # RELATED WORK


    Model-based testing deals with the automated generation or selection of test cases
    from models. Integration testing is often supported by different kinds of models
    such as structural, behavioral, or code models. A widely accepted taxonomy for
    model-based testing is presented in (Utting, Pretschner & Legeard, 2011). This
    taxonomy has been extended to cover the specific aspects for integration testing.


    Figure 4 shows the taxonomy proposed for integration testing approaches. Six dimensions
    have been defined: test objectives, model types, modeling paradigm, test criteria,
    test generation technology, and integration order.


    Three common test objectives in terms of coverage have been identified, namely,
    component interactions, and use cases / scenarios. Code coverage in integration
    testing details with the modeling and coverage of the inter-functional, inter-component,
    and inter-class control and data flow. The coverage of component interactions
    focuses on more abstract component interplay without accessing the concrete control
    and data flows in the program. The coverage of complex interactions, use cases,
    and scenarios represents the requirements-based system view. The systems and its
    subsystems have to fulfill the functional and non-functional requirements stated
    in the specification.


    The integration order determines the assembling system components. The classification
    used here is re-used from (Borner, 2010). Most of the approaches derive the integration
    order based on the system structure, some on functional system aspects such as
    use case or thread-based integration order. Traditional hierarchical approaches
    comprise top-down or bottom-up ordering. Other approaches transform the system
    structure by using cluster splitting, cluster analysis, or genetic algorithms
    to identify communicating subsystems and minimize the number of stubs and the
    effort for creating them. Only few integration approaches explicitly consider
    the integration order, for example (Robinson-Mallettett et al., 2008).'
