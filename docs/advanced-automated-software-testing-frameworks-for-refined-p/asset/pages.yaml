    # Software Tools Utilized


    +   * Unit testing: The library used for unit testing is CxxTest (Volk, 2004),
    which is available under the GNU Lesser General Public License (Free Software
    Foundation, 2007). CxxTest is a portable library that uses either Perl or Python
    to run unit test of C++ classes.

    * System testing: the same library CxxTest has been used for unit and system testing.

    * Software deployment and test cases execution: Ant

    * Software Management Configuration: SVN Subversion (Collabnet, 2000).


    # Consistent Reporting of Testing Errors


    A C++ class has been developed which collects error messages generated by test
    cases that fail and dump the information in a single file. Every time a CxxTest
    assert fails, a message is generated that is specific to the test case where the
    failure has occurred, this message is sent to this class, which stores it in a
    unique file. This way, it is possible to run the whole series of test cases that
    exercise different verifications over different modules of the system and over
    the system as a whole and generate a unique testing report, which contains the
    test execution results.


    # 5. UNIT TESTING


    The first step when carrying out unit testing is to design the test cases. Black
    box and white box techniques are both suitable for this purpose. Testing whether
    the output of a function or method, given certain inputs, conforms to its functional
    specification contained in the SRS. White box consists of analyzing the source
    code in order to guide the selection of test data. Test data must be appropriately
    selected to achieve adequate coverage over the code to test.


    One of the most challenging aspects of performing unit testing is to achieve the
    complete isolation of a class from its collaborative classes. Typically, an object
    makes use of other objects to carry out certain tasks beyond its functionality.
    Obviously, the execution results, and also the test of methods belonging to that
    object will be, to a great degree, determined by the inner-state of the object.
    Usually it is very difficult to set up a domain state in such a way that exposes
    the features to be tested. Even if it can be done, the written test will probably
    be quite'
