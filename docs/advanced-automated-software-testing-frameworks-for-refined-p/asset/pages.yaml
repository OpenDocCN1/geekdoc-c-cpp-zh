  md: '# Chapter 8

    Model–Based Testing of Distributed Functions


    Thomas Bauer

    Fraunhofer IESE, Germany


    Robert Eschbach

    Fraunhofer IESE, Germany


    # ABSTRACT


    The standard-compliant development of component-based embedded systems calls for
    systematic coverage of product requirements and for testing component interactions
    at the system integration stage. System functionality is represented by a set
    of complex distributed functions, i.e., functions that are spread across several
    system components. This chapter presents a novel automated model-based testing
    approach for distributed functions that use informal system requirements and component
    behavior models. The test modeling notation makes it possible to model component
    interactions and composite functions with defined pre- and post-conditions. Test
    cases are automatically generated as scenarios of distributed functions represented
    by sequences of component interactions.


    # INTRODUCTION


    In embedded systems, such as automotive or industrial automation, the majority
    of new innovations are realized via interactions of different system components.
    Examples are comfort functions in info- and entertainment systems or safety-critical
    driver assistance functions like park lane and brake assistants. In the past decade,


    DOI: 10.4018/978-1-4666-0089-8.ch008'
  merge: -1
