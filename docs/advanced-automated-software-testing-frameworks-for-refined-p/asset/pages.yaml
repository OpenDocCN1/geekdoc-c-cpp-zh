  md: '# Model-Based Testing of Distributed Functions


    industrial development processes have been influenced by strict process and product
    standards, shorter development cycles, and higher quality needs. On the other
    hand, about 50% of all failures are caused by software faults, of which about
    25% are caused by distributed software functions (Biagosch, Knupfer, Radtke, Näher
    & Zielke, 2005).


    Complex embedded systems are often developed with third-party components provided
    by suppliers. The integration of third-party components requires particular efforts
    regarding systematic quality assurance on the part of the manufacturers, since
    neither the program code nor supplier-internal documentation is accessible. The
    manufacturer has to assure that the system assembled from externally developed
    components fulfils the system requirements and customer needs. A systematic integration
    test approach is needed to detect requirement violations and unspecified component
    interactions.


