  md: '# How Much Automation can be Done in Testing?


    tests, and generating test cases from algorithms, it is more time and cost effective
    to automate those tasks.


    In short, GUI test automation does not mean replacing users totally by computers,
    it means reducing the involvement of users or humans in testing to the practical
    minimum. Full test automation that means no involvement of testers through all
    the process stages is not practical or feasible. The main goal of test automation
    is to reduce time and cost of testing as one of the major stages that consume
    resources in software development.


    Automating black box testing requires generating test cases on the basis of a
    representative model of the system called the test model. This model gets its
    information from the specification or design. This is usually known as model-based
    test automation techniques. Automating white box testing requires generating test
    cases from the code or implementation.


    It is useful and cost effective to start the testing activities that are repeated
    frequently. This makes it more cost effective to build or use a automate tool
    in some testing activities such as regression testing. We also automate when the
    number of tests to execute is large. It will take lot of testers'' time to run
    those cases and verify their results.


    In some cases, testing is required to run automatically after work hours where
    some testers may not be available. Test automation can free the scarce resources
    of developers and testers to do some other tasks. We do not automate to get rid
    of testers; we extend their capabilities.


    In the following sections, we will present the software testing activities based
    on the model and research projects described in our previous published papers
    (Alsmadi and Magel 2007, Tubeishat et al 2010, Alsmadi and AIKabi 2011).


