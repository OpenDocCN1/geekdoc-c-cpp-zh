    # TESTING TECHNIQUES


    Code can be tested at many different levels with different techniques: do individual
    statements execute according to specification, do procedures provide expected
    output for given input, do the program as a whole perform in a particular way?
    Within this are many issues to be borne in mind. For example, it is possible to
    execute each statement without touching upon certain conditions. However, test
    cases should try to take account of all possible conditions and combinations of
    conditions, with special emphasis on boundary conditions and values where behavior
    is often erroneous. In the following sections, we discussed of the techniques
    used in software testing.


    # Black Box or Functional Testing


    Knowing that exhaustive testing is infeasible, the black box approach to testing
    is to devise sample data that is representative of all possible data. We then
    run the program, input the data and see what happens. This type of testing is
    termed black box testing because no knowledge of the workings of the program is
    used as part of the testing – we only consider inputs and outputs. The program
    is thought of as enclosed within a black box. Black box testing is also known
    as functional testing because it uses only knowledge of the function of the program
    (not how it works). Ideally, testing proceeds by writing down the data and the
    expected outcome of the test before testing takes place. This is called a test
    specification or schedule. Then you run the program, input the data and examine
    the outputs for discrepancies between the predicted outcome and the actual outcome.
    Test data should also check whether exceptions are handled by the program in accordance
    with its specification.'
