    > “Due to time out period that the user has to reenter all informa once again...this
    creates multiplicity of information for us...as the same user is reapplying again
    and it is hard to differentiate between the same application.”


    As users become more frequent users place more reliance on learning from internal
    sources (memory) from external sources (advertisements, word of mouth, etc) Johnson
    and Mathews 1997. Many researchers have noted the ways in which memory is biased
    (Foulkes 1994). Frequent events are easier to recall than infrent ones (Hasher
    and Zacks 1984). Frequent remembering an event is biased by the availability of
    information within memory (Johnson and Mathews 1997). The mechanical process of
    conducting the task with the available tools on the website forms a bias of interactivity
    for the user and is similar to recalling frequent and infrequent users. Prior
    research suggests the application of tools to vary across users from novice to
    advance (see Martin 1991).


