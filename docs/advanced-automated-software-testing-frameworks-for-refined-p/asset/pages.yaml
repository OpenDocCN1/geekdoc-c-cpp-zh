    # KEY TERMS AND DEFINITIONS


    +   **Attack:** A sequence of actions that when executed will exploit the vulnerability
    in a code and cause the software to fail and/or behave in an unexpected and often
    undesirable manner.


    +   **Denial of Service:** An attack that will lead to the software becoming unavailable
    for use by legitimate users.


    +   **Path Mitigation:** A vulnerability that arises when the inputs entered by
    the user are directly passed and executed in the program, without validating the
    correctness and appropriateness of the input values.


    +   **Sanitize:** The process of scanning through input values (either from the
    user, or the run-time environment) to analyze and verify for the correctness and
    appropriateness of usage before actually being as part of a program.


    +   **Static Code Analysis:** The process of examining a piece of code without
    actually executing it. Static Code Analysis is also referred to as Source Code
    Analysis,


    +   **System Information Leak:** A vulnerability that when exploited will lead
    to the disclosure of the program structure, critical system information and other
    sensitive details of the software and its application environment.


    +   **Unreleased Resource:** A vulnerability that arises when the developer basically
    forgets to release the resources after their intended use and no longer needed
    in the software program.


    +   **Vulnerability:** An inherent flaw in the code that when exploited will cause
    the software to fail and/or behave in an unexpected and often undesirable manner.'
