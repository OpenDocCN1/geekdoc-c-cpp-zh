    In the flow state, the user’s focus or attention is narrowed to a limited stimulus
    field, and irrelevant thoughts are filtered out. Csikzentmihalyi (1975) suggest
    that in a flow state the person becomes absorbed in the activity, while increasing
    his awareness of his mental processes in the interaction with the web, the computer
