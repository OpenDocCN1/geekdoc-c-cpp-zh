    # Computer Assisted Testing or Test Automation?


    Computer-assisted testing (CAT) includes the use of the computer to aid in the
    testing process. The assistance may be in the form of test generation, test execution
    or delivery, scoring, record keeping, reporting results, providing feedback to
    examiners. It is a cost and time effective process as it replaces some of the
    tedious tasks usually done by testers. For some test processes, such as analyzing
