    # ABSTRACT


    Test Case prioritization consists of proper organization and scheduling of the
    test in a specific sequence. Regression testing is an important issue and concept
    during software maintenance process, but due to scarcity of resources re-execution
    of all test cases, is not possible during regression testing. Hence in version
    or version specific regression testing, it is more important to execute these
    test cases that are beneficial. In this chapter, a new prioritization technique
    is proposed for version specific regression testing using Cuckoo Search Algorithm.
    This technique prioritizes the test cases based on lines of code where the code
    is modified.


    DOI: 10.4018/978-1-4666-0089-8.ch006'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Test Case Prioritization using Cuckoo Search


    # INTRODUCTION


    In software development, the ethics behind Software Engineering is very important
    and essential. Software development and management is depend upon series of phase
    known as software development life cycle (SDLC), in this life cycle Software Testing
    (Pressman R S,2005) involves identifying the conditions where software deviates
    from its normal behaviour or exhibit different activity in contrast to its specificity.
    Software testing has a major role in software development lifecycle (SDLC) to
    develop the high quality software product. At least, software testing consumes
    50% of the development cost. Testing is the process of checking whether the developed
    project conforms to the expected output by finding errors in the program, and
    also to reveal inadequacies (Mathur Aditya P, 2007).


    Regression testing (Srivastava Praveen Ranjan et al.,2008) (Singh Yogesh et al.,2010)
    is conducted to ensure that changes in software are correct and have not affected
    the unchanged portions of the software. Test suites that are already available
    from earlier versions of software can be expensive to execute completely. Hence
    test case prioritization (Horgan J R and S London, 1992) is one of the techniques
    for reducing cost to regression testing.


    Test case prioritization (Srivastava Praveen Ranjan, 2008) helps software testing
    by decreasing the effort flow and time based on some criterion such as code coverage.
    It has been identified that one of the software engineering areas with a more
    suitable and realistic use of artificial intelligence techniques is software testing
    (McMinn Phil, 2004) and these techniques are known as metaheuristic approaches
    (Srivastava Praveen Ranjan, 2008). A recently developed metaheuristic optimisation
    algorithm, Cuckoo Search (Yang X S and Deb S, 2009), is being used under this
    study for prioritization of different test cases in a test suite. In the later
    sections of this chapter, the use of Cuckoo search algorithm in test case optimization
    is discussed. The background work includes drawbacks of some of the existing methods
    of test case optimization is discussed in section 2. In next concept of cuckoo
    search is discussed. Test case prioritization using cuckoo search has been discussed
    in detail the section proposed strategy. A simple implementation of the approach
    is given in the section case study.


    # BACKGROUND WORK


    An early representation of test prioritization was reported by Horgan and London
    (Horgan J R and S London, 1992) in an industrial strength tool, this tool is used
    for variety of control flow and data flow coverage criteria. Coverage based (Aggrawal
    K K et al,2004) technique for test case prioritization, where practica-'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Test Case Prioritization using Cuckoo Search


    tion is based on the original test suite and modified version, however they do
    not combine code coverage information with function coverage. (Elbaum Sebastian
    et al, 2000 and 2004) have reported several variants of test prioritization. (Kim
    J. and A. Porter, 2002) propose a history based technique and discuss trade offs
    in the use of test selection using monitoring traversals and test prioritization.
    (Srivastava A. and J. Thiagarajan, 2002) have reported Echelon, which is an industrial
    strength tool to prioritize test cases. (Srikanth H and Williams L., 2005) investigate
    economic application of test prioritization. (Do Hyunook et al, 2004) performed
    a cost benefit analysis of prioritizing unit test cases. (Wong E et al, 1997)
    reported an experiment to investigate the fault detection effectiveness using
    all criteria. Many of the previous researchers prioritized the test cases based
    on faults detected not version specific test case prioritization, in this chapter,
    the idea of version specific case prioritization is highlighted by a metaheuristic
    approach (i.e. cuckoo search) (Yang X S and Deb S, 2010). To efficiently search
    solution, Cuckoo search algorithm is used, since it is more efficient and simple
    than other metaheuristic algorithms and moving towards an optimized solution by
    replacing a fraction of worst nests in each iteration till maximum number of iterations
    predefined by user. The idea of version specific case prioritization being presented
    in this chapter is based on the various parameters as time, cost and max_generations
    will be decided which will be used in Cuckoo algorithm. For example if time is
    the parameter on which the test cases are prioritized then in that stipulated
    the maximum possible iterations i.e. max_generations of iteration will be decided
    and Cuckoo search there by presents the best solution in every generation relative
    to the previous one. In the next section how the Cuckoo search works is explained.


    # INTRODUCTION TO CONCEPT


    Cuckoo search is an optimization metaheuristic algorithm which is more efficient
    relative to some other metaheuristic algorithms (Srivastava Praveen Ranjan et
    al, 2008).Themain advantage of Cuckoo search algorithm is that it can easily solve
    optimized problems. Based on the fitness value in every iteration a fraction of
    worst nests are abandoned which are not good solutions and in every generation
    moving towards an optimized solution by replacing the solutions with the good
    ones. Finally by the end of max_ iterations (iterations until loop continues),
    a fraction of solutions will be replaced and we will obtain the optimized solution
    (Yang X S Yang and Deb S, 2010).'
