  md: '# A Case Study on Testing for Software Security


    program forces the read module to prematurely end. In the latter case, try-catch
    blocks are typically used to process the errors and once the control leaves the
    catch block, the program continues to normally execute the code following the
    try-catch block and behave as if nothing happened before. Care should be to release
    the resources that were allocated inside the try block – since there can be more
    than one catch block depending on the specific exceptions that are to be captured,
    it would not be proper to put statements pertaining to the release of the allocated
    resources in each of these catch blocks. Instead, we suggest the option of exploiting
    the finally block (that is not mandatory for use try-catch blocks) and insert
    there all the statements pertaining to resource release.


    The Path Manipulation vulnerability arises when the inputs entered by the user
    are directly passed and executed in the program, without validating the correctness
    and appropriateness of the input values. It becomes more critical if the user
    values are directly embedded into path statements that say a critical system resource
    (say a file) and executes them with elevated privileges (higher than that of the
    user who passed the input). We present solutions to handle this vulnerability
    and illustrate the use of a Sanitizing module that can be used to filter the input
    by scanning for a blacklist of non-allowable characters and the path requested
    in the input.


    # CONCLUSION


    Software security is a rapidly growing field and is most sought after in both
    industry and academics. With the development of automated tools such as Fortify
    Source Code Analyzer, it becomes more tenable for a software developer to fix,
    in-house, the vulnerabilities associated with the software prior to its release
    and reduce the number of patches that need to be applied to the software after
    release. This book chapter presented a case study of a file reader program (developed
    in Java) on how to analyze the source code of an application using an automated
    tool, to capture the inherent vulnerabilities present in the code and mitigate
    one or more of them using the Source Code Analyzer (SCA), developed by Fortify,
    Inc., and illustrated the use of its command line and graphical interface (Audit
    Workbench) to present and analyze the vulnerabilities identified in a software
    program. The SCA could be used in a variety of platforms and several object-oriented
    programming languages. The four vulnerabilities that are specifically discussed
    in length and mitigated in the case study include the Denial of Service vulnerability,
    System Information Leak vulnerability, Unreleased Resource (streams) vulnerability
    and the Path Manipulation vulnerability. Even though our code is written in Java,
    the solutions proposed'
