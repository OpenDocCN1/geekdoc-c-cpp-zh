    it is correct and coherent before initiating the actual recognition process. From
    the automatic testing perspective, it is thus necessary to build a set of test
    cases that verify whether the system is able to properly handle different parameter
    configurations; both admissible and non admissible. This section will describe
    how to build a set of negative test cases that verify the response of the system
    to ill-formed parameter configurations. The execution of positive test cases will
    be covered later in this section. Negative test cases are those that exercise
    the response of a software system to "abnormal" conditions, when an input file
    does not exist in disk or cannot be opened, or a configuration parameter that
    is ill-formed. On the other hand, positive test cases exercise the response of
    a software system to "normal" conditions.


