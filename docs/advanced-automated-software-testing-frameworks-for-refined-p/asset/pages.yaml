    # 5. TESTING THE GAP BETWEEN THE PAPER BASED SYSTEM AND E-SERVICES SYSTEM


    The gap between paper-based and web-based e-service system are identified emerging
    due to information gap, design gap, communication, and fulfillment gap. Zeithalm
    et al (2000) in their study pointed to each of these gaps on the basis of users
    experience with the website. Information gap leads to providing incomplete or
    accurate information to the users. The initial design of a website not meeting
    the user’s requirement may result in design gap. The presence of an information
    gap could exacerbate the design gap because incomplete or incorrect understanding
