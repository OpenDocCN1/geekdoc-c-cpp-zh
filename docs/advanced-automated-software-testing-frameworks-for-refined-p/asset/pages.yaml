    # THE CASE STUDY


    The case study examines the testing of web-based framework of the University of
    Australia (not the real name). International students have the option to lodge
    an admission application through either: web-based e-service on the Internet,
    phone, fax, or person. Receiving the application a decision is made by the staff
    on the admission status. Within this process the department is implementing an
    electronic delivery of its services on the website.


    Web-based e-service has been in use for the last two and half years. The complete
    process involves students making the application and the staff processing applications
    on the website. The staff is currently using the web-based e-service and the paper-based
    system in conducting the tasks. Transition from paper-based to web-based e-service
    is believed by the department to be a significant step in the direction of moving
    the complete student admission process over the website and gradually removing
    the paper-based system. The users learning experience in adopting the web-based
    system is focus of attention in the study.


    # TESTING USER’S INFORMATION EXPERIENCE ON WEBSITES


    The staff and Management acceptance of the e-Services system and its continued
    usage usage in processing international student’s admission applications is considered
    a major organisational requirement to meet Departmental targets in the university’s
    Strategic Plans. However, the Executive Director noted:


    > “One of our problems is that we have a lot of trouble with our staff coping
    with the new e-Services system. To get them to work with the two systems is troublesome
    for them. Actually we have ‘realised’ that the e-Services system is part of everyday
    work. And it probably deserves more attention instead of paper-based print applications
    in many ways. Our e-Services practices had to change.”'
