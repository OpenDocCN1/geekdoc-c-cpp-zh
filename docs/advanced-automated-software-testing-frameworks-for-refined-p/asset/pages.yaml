    # White Box or Structural Testing


    This form of testing makes use of knowledge of how the program works – the structure
    of the program – as the basis for devising test data. In white box testing every
    statement in the program is executed at some time during the testing. This is
    equivalent to ensuring that every path (every sequence of instructions) through
    the program is executed at some time during testing. This includes null paths,
    so an “if statement” without an else has two paths and every loop has two paths.
    Testing should also include any exception handling carried out by the program.


    # DEBUGGING THE CODE


    Some debuggers allow the user to step through a program, executing just one instruction
    at a time. Each time you execute one instruction you can see which paths of execution
    has been taken. You can also see (or watch) the values of variables. It is rather
    like an automated structured walkthrough. In this form of testing, you concentrate
    on the variables and closely check their values as they are changed by the program
    to verify that they have been changed correctly. A debugger is usually used for
    debugging (locating a bug); here it is used for testing (establishing the existence
    of a bug).


    74'
