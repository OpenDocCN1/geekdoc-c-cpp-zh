    # ABSTRACT


    System maintenance is a general term required to keep a system running properly.
    The system could be a computer system, mechanical system, or other system. The
    maintenance in this sense is related to the deterioration of the system due to
    its usage and age. This context of maintenance does not apply to software, where
    the deterioration due to the usage and age don''t make sense. Conventionally,
