    \ Unreleased Resource vulnerability occurs when the program is coded in such a\
    \ way that it can potentially fail to release a system resource (Howard et al.,\
    \ 2009). In our file reader program, we have vulnerability with the FileReader\
    \ and the associated Buffered Reader streams being unreleased because of some\
    \ abrupt termination of the program. If there is any exception returned from the\
    \ readLine() method call in Line 16 of the testFileRead_fixed_v2.java program,\
    \ the control immediately switches from the try block to the catch block and the\
    \ two streams 'fr' of FileReader and 'br' of BufferedReader will never be released\
    \ until the operating system explicitly forces the release of these resources\
    \ upon the termination of the program. From a security standpoint, if an attacker\
    \ can intentionally trigger a resource leak, the attacker may be able to launch\
    \ a denial of service attack by depleting the resource pool."
