  md: '# A Case Study on Testing for Software Security


    Security review is one of the most important parts of a static code analysis.
    If a program is insecure and causes sensitive data to be released, it could have
    catastrophic consequences for the program''s developers. Several key security
    problems that should be addressed during a security review (Wysopal et al., 2006)
    are those related to input handling, errors and exceptions, and buffer/integer
    overflow.


    +   **Input Handling:** The simplest rule to follow when handling any type of
    input is “never trust the input” (Howard et al., 2009). This applies not only
    to values passed from a user via a graphical user interface or command-line interface,
    but also applies to files being read from a disk, database, system variables,
    and from configuration files. While it is more probable for users to provide faulty
    data than the system, it is still a dangerous possibility and must be handled
    appropriately.


    +   **Errors and Exceptions:** Whenever a section of code or has the potential
    to throw an exception, it must be handled appropriately. Proper handling of errors
    and exceptions is critical and one should not ignore them. It is the goal of the
    developer to identify the situations which cause such errors and exceptions to
    be thrown and take steps to avoid them.


    +   **Buffer/Integer Overflow:** Buffer overflow and integer overflow occur whenever
    data is added to a buffer or the value of an integer is changed without properly
    considering the size of the buffer or integer. In languages like C or C++ which
    are “not memory-safe”, this can lead to serious security vulnerabilities, such
    as buffer overflow attacks (Howard et al., 2009). While “memory-safe” languages
    like Java or C try to catch buffer/integer overflow issues at compilation, the
    issues may not be ignored. It is possible that an operation will cause a buffer/integer
    overflow resulting in an error or exception. One should always check the size/value
    of buffers/integers before performing any operations on the system to ensure that
    they do not overflow.


    The following are the learning objectives of this book chapter with regards to
    static code analysis and testing for software security:


    +   1. Explain the basics of static code analysis and its different sub-categories.

    2. Use an automated tool to conduct static code analysis of a software program.

    3. Understand the risk associated with the Denial of Service vulnerability and
    propose a solution to mitigate it.

    4. Understand the risk associated with the System Leak vulnerability and propose
    solution to mitigate it.'
