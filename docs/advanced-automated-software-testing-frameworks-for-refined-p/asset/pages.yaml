    # PROPERTY CHECKING APPROACHES


    The first approach to check the satisfaction of a global property in a distributed
    computation is based on the global snapshot algorithm by Chandy and Lamport (Chandy
    & Lamport, 1985, Bougé, 1987, Spezialetti & Kearns, 1986). Their approach requires
    repeated computation of consistent global snapshots until a snapshot path is found
    where the desired property (predicate) is satisfied. This approach works only
    for stable properties, i.e., properties that do not turn false once they become
    true. The Chandy and Lamport approach may fail to detect a non-stable property
    because it may turn true only between two successive snapshots.


    The second approach to check the satisfaction of a global property in a given
    distributed computation was proposed by Cooper and Marzullo (Cooper & Marzullo,
    1991). Their approach is based on the construction of the state lattice (Cooper
    & Marzullo, 1991, Jegou, Medina, & Nourine, 1995) and can be used for the detection
    of *possibly*: $\phi$ is true if $\phi$ is true for any global state in the lattice.
    The predicate *definitely*: $\phi$ is true if, for all paths from the initial
    global state to the final global state, $\phi$ is true in some global state along
    that path. Though this approach can be used to detect both stable and unstable
    properties, the detection may be prohibitively expensive. This approach requires
    exploring'
