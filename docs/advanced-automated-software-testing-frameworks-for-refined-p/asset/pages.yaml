  md: '# A Review of Software Quality Methodologies


    Table 3. Software audit types (adopted from Frank et al., 2008)


    | Audit Type | Description |

    | :--- | :--- |

    | **First Party Audit** | This type of audit is performed within the organization.
    Its example could be an inter-nal software quality audit. |

    | **Second Party Audit** | This type of audit is carried out by customers on suppliers.
    Supplier survey by customer before contract signing to evaluate suppliers'' procedure
    is an example of second party audit. |

    | **Third party Audit** | This type of audit is conducted by an independent party
    which is deputed by client. A certification registration audit is an example of
    this type of audit. The registration organization does not have direct link with
    other company nor certification agency but it carries out on behalf of authority.
    |

    | **Internal Audit** | Internal audit performed within organization to identify
    the strengths and weaknesses of the organization. |

    | **External Audit** | External audit is carried out by a company on an external
    entity. The company may deploy its own employees or a third party to perform audit
    activities. |

    | **System Audit** | System audit takes a holistic view of the organization/or
    project, so they have wide scope and larger boundaries. |

    | **Process Audit** | Process audit investigates an activity to verify that input,
    actions and output are compatible with defined requirements. |

    | **Product Audit** | The objective of product audit is to ensure the final product
    for its suitability for use. |

    | **Compliance Audit** | Compliance audit highlights that activities have been
    properly carried out and adhere to criteria met in contracts, agreements and standards.
    |

    | **Regulatory Audit** | These audits are carried out to make sure that requirements
    by regulatory bodies are adhered. |

    | **Management Audit** | Management audit verifies that organizational rules and
    policies are effective and adhered. |

    | **Quality Audit** | The objective of quality audit is to evaluate whether quality
    activities and their results are compatible with established procedures. |


