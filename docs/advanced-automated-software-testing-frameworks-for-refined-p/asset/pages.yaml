    In (Memon 2001), Planning Assisted Tester for graphical Systems (PATHS) takes
    test cases from test designer as inputs and generates sequences of events automatically.
    These sequences of events or plan test cases for the GUI. PATHS first performs
    an automated analysis of the hierarchical structure of the GUI to create hierarchical
    operators that are then used during the plan generation. The test designer describes
    the preconditions and effects of these planning operators, which subsequently,
    become a valid input to the planner. Each planning operator has two controls that
    represent a valid event sequence. For example, File Save, File_SaveAs, Edit Cut,
    and Edit_Copy are examples of planning operators. The test designer begins the
