    # REGRESSION TEST SELECTION BASED ON RISK ANALYSIS


    This section is based on the study ofChen and Probert (2003). Risk is anything
    that threatens the successful achievement of a project''s goals. Specifically,
    a risk is an event that some probability of happening, and if it occurs, will
    result in some loss. The tester''s job is to reveal high-priority problems in
    the product. Traditional testers have always used risk-based testing, but in an
    ad hoc fashion based on their personal judgment. Using risk metrics to quantitatively
    measure the quality of a test suite seems perfectly reasonable and is our approach.


    Amland (2000) presented a simple risk model with only two elements of Risk Exposure.
    We use this model in our research. It takes into account:


    +   1. The probability of a fault being present. Myers (1979) reports as the number
    of detected errors increases, the probability that more undetected errors exist
    also in-creases. If one component has defects that are detected by full testing,
    it is very likely that we can find more defects in this component by regression
    testing (the more defects detected, the more defects we can expect). Thus, components
    with detected defects should be covered more carefully by regression tests.

    2. The cost (consequence or impact) of a fault in the corresponding function if
    it occurs in operation. It is a well-known, observed fact that most commercial
    software contains bugs at delivery time. Companies begin a project with the knowledge
    that they will choose, software-that contains known bugs (Bach, 1998). However,
    when the budget is limited, we strive to detect the most critical defects first.


    The mathematical formula to calculate Risk Exposure is RE (f) = P (f) × C (f),
    where RE (f) is the Risk Exposure of function, P (f) is the probability of a fault
    occurring in function f and C (f) is the cost if a fault is executed in function
    f in operational mode. In this context, we calculate first the Risk Exposure for
    each test case (RE (t)). Then we choose test cases based on RE (t). To illustrate
    this formula we present a real example based on our SNA-Soft product. The evaluation
    of risk exposure involves 4 steps:'
