    # Linear Properties


    A linear property is based on the notion of a “forbidden” state.


    Let $s$ be a local state, $X$ and $Y$ be two global states. $X''$ denotes the
    cut formed by advancing $X$ to the successor of $s$. A local state is a forbidden
    state with respect to a property $\phi$ if its inclusion in any global state $X$
    implies that $\phi$ is not satisfied at $X$. This can be defined formally as follows
    (Charge & Garg, 1998):


    ```

    $forb_\phi(s, X) \equiv Y: X \subseteq Y: \phi(Y) \Rightarrow X'' \subseteq Y$

    ```


    This means if $\phi$ is false in $X$ and $s$ is the forbidden state, then $\phi$
    will remain false until a successor to $s$ is reached.


    Conjunctive properties are linear. An efficient algorithm to detect conjunctive
    properties can be found in (Garg, 2002). Some properties are linear in some systems
    but not in others. For example, the property $x_i + x_j \le c$, where $x_i$ and
    $x_j$ are two variables belonging to different processes and $c$ is a constant,
    is linear in systems where $x_i$ or $x_j$ is monotonically increasing.


    # Regular Properties


    Let $L$ be the state lattice of a distributed computation. A property $\phi$ is
    regular if and only for any two global states $G$ and $H$,


    ```

    $\phi(G) \wedge \phi(H) \Rightarrow \phi(G \cap H) \wedge \phi(G \cup H)$

    ```


    That is, a property is a regular property if the set of global states satisfying
    the predicate forms a sublattice of the lattice of global states. A regular predicate
    is also linear and hence easy to detect.

    The property $\phi=$ “There is no outstanding message in the channel” is an example
    of a regular property. This property holds on a state $X$ if for each send event
    in $X$ the corresponding receive event is also in $X$. Suppose $\phi$ holds on
    $X$ and $Y$($\phi(X) \wedge \phi(Y)$), it is easy to show that it holds in $(X
    \cap Y)$. Consider a send event $s \in (X \cap Y)$. Let $r$ be the corresponding
    receive event, $\phi(X)$ implies that $r \in X$ and $\phi(Y)$ implies that $r
    \in Y$. Thus $r \in (X \cap Y)$. Consequently, $\phi(X \cap Y)$ and hence $\phi$
    is a regular predicate (Garg, 2002).'
