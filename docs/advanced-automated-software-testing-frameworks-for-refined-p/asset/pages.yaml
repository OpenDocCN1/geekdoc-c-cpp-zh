    # Software Metrics


    Software metrics are set of measures to quantify the value of various quality
    aspects. Fenton (1991) describes software metric as an approach to measure some
    property of software product or process. Generally, metrics can be classified
    into four categories which are product, process, project and resource metrics
    (cf. Frank et al., 2008). Metrics can also be designed based on the need and type
    of attributes using different frameworks as plan-do-check-act cycle (Deming, 1986)
    or goal-question-metric (Basili & Rombach, 1984).


    Product metrics highlight the properties of a particular software product e.g.
    number of defects in the product which highlights a product quality attribute.
    Another example of this could be the software size for which source line of codes
    and function points could be used as metrics. Process metrics highlight the quality
    and productivity of overall software development process. This category of metrics
    provides the status of different aspects of software development process which
    helps in identifying the correct improvement levels. The example of this type
    of metric is defect removal metric (Kan, 1995), which can be used to evaluate'
