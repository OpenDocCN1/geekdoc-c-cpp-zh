  md: '# Runtime Verification of Distributed Programs


    The trace is then given to the analyzer module as an input. The analyzer module
    implements the slicing and property checking algorithms. POTA tool also involves
    a translator module that enables the use of a model checker on the program trace
    rather than on the program itself.


    The purpose of the instrument module is to inject code at the appropriate places
    in the program to be verified. The main goal of the instrumented code is to output
    the relevant events (communication events or any event that may affect one of
    the properties to be checked) and a vector clock that is updated for each relevant
    event.


    Upon executing the instrumented program, a log file is generated for each process.
    The contents of each log file is a sequence of (event, vector clock) pairs that
    a process generates. Each pair in the sequence is also appended by the values
    of the variables that the pair manipulates. The log files of all the processes
    in the distributed program are then merged to obtain a partial order representation
    of the execution trace.


    The translator module takes as an input a trace of the program and translates
    it into Promela (input language of SPIN). The analyzer module contains the slicing
    and property checking algorithms (Sen, 2004).


