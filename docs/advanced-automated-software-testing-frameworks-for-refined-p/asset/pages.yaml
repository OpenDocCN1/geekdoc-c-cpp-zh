- img_proc: true
  md: '# A Review of Software Quality Methodologies


    # INTRODUCTION


    The abstract nature of software products make them very different from conventional
    products that we can touch and see built. As a result, the probability of human
    induced errors in software systems becomes high. Software systems have revolutionized
    every field of life. It is hard to believe that software systems are not being
    applied in any organizational setting. Extensive use of software applications
    and products in everyday life requires dependable and efficient software applications
    to run the day to day smoothly. This is equally true in case of business organization
    and commercial environments. As a result, similar to other products, the quality
    is emerging as an important attribute of such software systems. Crosby (1979)
    defines quality as “conformance to requirements” and Pressman (2010) extends this
    definition to include “adherence to standards”. Pressman (2010) defines software
    quality as “conformance to explicitly stated functional and performance requirements,
    explicitly documented documents, and implicit characteristics that are expected
    of all professionally developed software.” This definition only focuses on functional
    requirements but also includes performance requirements, adherence to development
    standards and presence of generic quality attributes to determine the quality
    level of software artifact. However, the definition of software quality is a contested
    concept in software engineering literature (cf. Kitchenham & Pfleger, 1996; Petrasch,
    1999). The suggestion is that, in defining software quality, requirements and
    elicitation of such requirements must form an important aspect of quality. An
    important reason behind this is, in contrast to the conventional products, elicitation
    of software requirements is regarded as the responsibility of the development
    team instead of the customers. As a result, the requirements are categorized in
    different types e.g. user requirements, functional requirement, non-functional
    requirements, usability requirements, performance requirements. The additional
    difficulty is that the requirements may well conflict with each other; they may
    even have different priority levels among stakeholders (depending on stakeholders’)
    perspectives or the application domain. It is also possible that it may be difficult
    to achieve some of these requirements.


    IEEE (1990) defines software quality as “the degree to which a system, component,
    or process meets customer or needs or expectations.” This definition only focuses
    on the conventional marketing principle that customer is right and quality is
    only measured based on the satisfaction level of customer needs. On the other
    hand, other quality parameters are invisible to users, but extremely important,
    get neglected. It is not easy to quantify quality. It is, therefore, often assessed
    in terms of its characteristics. Ghezzi et al., (2003) describe following eleven
    characteristics of software quality.'
  merge: -1
