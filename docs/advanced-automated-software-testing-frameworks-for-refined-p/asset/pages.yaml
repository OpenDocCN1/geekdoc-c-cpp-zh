  md: '# About the Contributors


    Eslam Al Maghayreh is currently an Assistant Professor in the Department of Computer
    Science at Yarmouk University in Jordan. Al Maghayreh received his PhD degree
    in Computer Science from Concordia University (Canada) in 2008, his Master''s
    degree in Computer Science from Yarmouk University in 2003, and his Bachelor''s
    degree in Computer Science from Yarmouk University in 2001. Al Maghayreh research
    interests include: multi-agent systems, distributed systems, and runtime verification.


    Zaigham Mahmood is a Principal Researcher and Reader in Applied Computing in the
    School of Computing and Mathematics, University of Derby, UK. He has an MSc in
    Mathematics, an MSc in Computer Science, and a PhD in Modeling of Phase Equilibria.
    He is also a Chartered Engineer and a Chartered Information Technology Professional.
    Dr. Mahmood has in excess of 50 papers published in proceedings of international
    conferences and journals as well as chapters in books. He is a member of advisory
    and editorial boards of several journals and international conferences. His research
    interests are in the area of software engineering, project management, enterprise
    computing, and e-government.


    Srikan Reddy Malipalet is currently pursuing M.Sc Tech. Information System at
