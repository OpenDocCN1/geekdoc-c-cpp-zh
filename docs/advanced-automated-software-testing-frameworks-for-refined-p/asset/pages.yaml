    One of the most important factors impacting the quality of the testing process
    is the appropriate selection and design of the test cases that will be used to
    exercise the system during the testing process. In the case of a speech recognition
    system, the design of the test cases needs to be based on a fairly deep understanding
    of the internals of the ASR system. We believe that having sufficient experience
    in the field can make a significant difference in this respect, and is one of
    the motivations for writing this chapter. For example, if we need to test a C++
    class that generates a graph of words containing recognition hypotheses, it will
    be necessary to possess a profound understanding of the properties of the graph
    to write an appropriate and comprehensive set of test cases. While these properties
    can be easily enumerated in the SRS, some background in the field is necessary
    to correctly interpret and reflect in an effective set of test cases. The quality
    of these test cases will profoundly determine the success of the software testing
    process.


    This section covers the detail of the testing process in isolation the core C++
    classes of the ASR system developed. These classes are the class that creates
    the decoding network and the class that implements the Token Passing algorithm.
    The testing process of the remaining classes of the system are not considered
    as relevant so they won''t be described in this section.


    # 5.1. Testing the Correctness of the Decoding Network


    The decoding network is a graph that contains all the lexical (typically words)
    that are in the recognition vocabulary. Each of the nodes in the network represents
    a HMM-state (the state of a left to right Hidden Markov Model) of a given triphone
    (which is the equivalent to a phone when context independent acoustic modeling
    is used) of a generic lexical unit. Most of the decoding time is spent traversing
    the decoding network so testing it thoroughly is crucial. Most of the most important
    checks that we have performed to verify its correctness are listed below:


    +   - There has to be one and only one word-identity node in the root node or
    any fan-in node and any reachable end-node.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# On the Application of Automated Software Testing Techniques


    +   - There has to be a word-identity node for each of the words in the active
    vocabulary and their corresponding alternative pronunciations in the pronunciation
    lexicon.


    +   - All the nodes have to be connected and there not be redundant transitions.


    +   - Backward transitions can only occur at word-ends.


    +   - All the emitting nodes (those that represent HMM-states) have to have a
    self-transition.


    +   - It must be possible to transition from the end of any one word to the beginning
    of any other word in the active dictionary.


    +   - Check the coherence between node-depth and node position within the network.


    # 5.2 Testing the Token Expansion Process


    As in state-of-the-art speech decoding systems, the system we have built relies
    on the Token Passing Paradigm (Young, 1989) to carry out the search process, which
    is an efficient implementation of the time Viterbi search (which is a dynamic
    programming algorithm). According to this paradigm, at the beginning of utterance,
    a number of tokens are placed in the root node of the decoding network, which
    is compiled beforehand, and propagated from left to right to explore the search
    space. Every time a token arrives at a word identity node, a new word is added
    to the partial hypothesis attached to the token. Once the utterance is processed,
    the hypothesis of the best scoring token will be the final recognition hypothesis.


    A number of test cases have been implemented to verify that the token expansion
    process is done correctly. Given the complexity of steps in the process, a number
    of assert clauses have been used for verification purposes. Assert clauses can
    be placed at very specific locations inside a complex algorithm, as are less intrusive
    and it is easy to configure the compiler so that they are passed over when generating
    the final system release. We list below a series of checks that were made to verify
    the correctness of the token-expansion process:


    +   - Make sure the best token at time t has a lower score than the best token
    at t-1, otherwise it could mean that the acoustic models are broken, since the
    probability that a Gaussian Mixture Model (GMM) generates any feature vector is
    always positive (negative when log), has to be a, or a token was not actually
    expanded during the last iteration.


    +   - Make sure all the tokens we have observed the same number of feature frames.'
