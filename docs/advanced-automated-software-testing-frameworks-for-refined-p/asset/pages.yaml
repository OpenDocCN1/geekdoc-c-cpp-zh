  md: '# Testing E-Learning Websites


    Electronic services system were perceived by Management to provide benefits including
    less paperwork, quick delivery of information, easy editing and updating of information.
    Rogers (1995) argue that attributes of the innovation should be compatible with
    the organisation. At the same time Management realised that systems challenge
    staff on implementation. Rogers (1995) suggests that complexity of systems implementation,
    trialability of the system, and ease of observability of the perceived characteristics
    of innovation. Through prior analysis of the situation, the Management’s perception
    of introducing the new technology was based on the belief that such technology
    would have a positive impact on staff when the advantages were reflected in their
    work.


    The user perception of electronic service is a burden and acted as a barrier to
    their work. The users learned that it increased the workload, slowed the work
    process, and brought in complexity to the task. The department did not implement
    electronic services or introduce technology to jobs at the same time. The effect
    on user learning experience using the e-service is not estimated when the system
    was being developed. Understanding the task sequence from start to finish, and
    integrating those functions into web-based learning process is missing. It lacks
    coherence. Individual users do not have consistent skills in learning how to use
    the system because of differing levels of expertise (i.e., user category). Specific
    expertise needed for conducting the task was lacking.


    The users were asked to enter all information directly to the web. To expect a
    user to start an electronic service without prior learning the user’s experience
    is not perceive to be appropriate. Despite providing regular training the user
    resistance to use the electronic system increased. The following quote support
