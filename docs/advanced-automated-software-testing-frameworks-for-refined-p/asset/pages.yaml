    # Critical Path Level Reduction through Selecting Representatives


    This technique approaches test reduction through selecting representative test
    scenarios. Representatives are elected from the different categories, classes
    or areas to represent the whole country. In this approach, the algorithm arbitrarily
    selects a test scenario. The selected scenario includes controls from the different
