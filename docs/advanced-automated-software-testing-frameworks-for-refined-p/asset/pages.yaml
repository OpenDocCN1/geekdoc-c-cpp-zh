    $O(m^n)$ global states in the worst case, where $n$ is the number of processes
    and $m$ is the number of relevant local states in each process. The third approach
    avoids the construction of the state lattice by exploiting the structure of the
    property to identify a subset of the global states such that if the property is
    true, it must be true in one of the states from this subset. This approach can
    be used to develop more efficient algorithms, but it is less general than the
    second approach. For example, (Garg & Waldecker, 1994, 1996) present algorithms
    of complexity $O(n^m)$ to detect *possibly*: $\phi$ and definitely: $\phi$ when
    $\phi$ is a conjunction of local properties (a local property is a property of
    a single process). (Chase & Garg, 1995, Tomlinson & Garg, 1993) present efficient
    algorithms that use this approach to detect $\sum x < C$ where $x$ are variables
    on different processes and $C$ is constant.


    # PROBLEMS IN CHECKING GLOBAL PROPERTIES


    Many of the problems in distributed programs can be reduced to the problem of
    observing a distributed computation to check whether it satisfies a given property
    or not. Termination and deadlock detection are some examples (Garg, 2002).


    The difficulties of observing a distributed computation to check the satisfaction
    of a given property are due to the following characteristics of a distributed
    program (Garg, 2002):


    +   1. The lack of a common clock, which implies that the events in a given distributed
    computation can only be partially ordered.

    2. The lack of shared memory, which indicates that the evaluation of a global
    property will incur message overhead to collect the necessary information to evaluate
    it.

    3. The existence of multiple processes that are running concurrently, which implies
    that the number of global states that needs to be considered in property checking
    will be exponential in the number of processes.


    In general, the problem of detecting a global property in a given distributed
    computation is NP-complete (Chase & Garg, 1998). A significant part of this chapter
    will be mainly dedicated to explore some of the work presented in the literature
    to efficiently check the satisfaction of a property in a given distributed computation.
    These include, restricting the class of the properties to be checked, atomicity
    and slicing.'
