  md: '# 8. CONCLUSION


    The evidence in this study reveals that users’ beliefs are created on the basis
    of impressions formed about e-services. These impressions play an important role
    in determining user thoughts about e-services acceptance and their evaluation
    is guided by their assessment of how well e-services meet their work requirements.
    Users did not recognize the benefits and rewards of effective participation unless
    they are specifically informed about its benefits, ease of use, and usefulness.
    The users are not informed about the accrued benefits not only to them, but also
    to their colleagues, the department, and the whole organization. All users are
    not motivated with the same types of rewards, efforts to include individualized
    rewards may be considered. Some may value the increased access and timesaving
    they can gain by performing their service effectively. Others may value recognition,
    monetary benefits, or still may be looking for a promotion, autonomy, or greater
    personal control over the service outcome. If users are not satisfied and their
    motivation is lacking, it will result in negative outcomes such as, not understanding
    the service process, slowing down the change process, resistance to change affecting
    each other (i.e. their colleagues) as well as the customer.


    The users may have been clearly informed about their contribution in developing
    the web-based e-service. Different user’s contribution in forming the service
    requires a clear understanding of each user participation and contribution to
    the process. Interconnected task of different users may the start and completion
    of each user task and responsibilities. Whatever the case, the expected level
    of user participation required to be communicated verbally or in writing in order
    to perform their roles.


    Users need to be educated of their roles and their inputs so that they can perform
    the task effectively. To understand what is expected of them and the expertise
    to accomplish the task requires evaluation and feedback of their abilities necessary
    to perform within a specified context. Users education program can take the form
    of formal orientation programs, training, written literature provided to users
    (manual, or unknown), directional cues and signage in the service environment,
    learning from colleagues and personal experience. User’s performing a specific
    task requires understanding of the task process (for example: What is needed?
    How to progress? What is user supposed to do?).


    Observing other users using the same task (brings confidence), exchanging information
    with other users, enhances user experience. Rewarding the users performing their
    roles effectively motivates the users and influences others in doing their task
    well, provides confidence, increases motivation, and job satisfaction. Rewards
    are likely to come in the form of increased control over the web-based service
    delivery process, timesaving, monetary savings, and psychological or physical
    benefits.'
