- img_proc: true
  md: '# Testing E-Services


    information service on the website. The primary requirement for e-services is
    the conducting of actions of personal benefit to the customer in a timely fashion
    and with instant feedback on its state of execution and level of performance.


    With the development of information technology allowing user participation in
    service delivery on websites, customers’ roles in the e-services process have
    become more important. Therefore, it can be argued that researchers need to pay
    more attention to customers’ and users evaluations of technology-based services
    (Parasuraman and Grewal 2000; Chea and Lou 2008; Chellappan 2008). In general,
    existing research suggests that e-services system translate into fast delivery
    of services on websites and portals without the users investing time or effort.
    The flexibility in service delivery offered by e-services system provides users
    with quick selection of the best services available, choice from a wider range
    of service providers, the availability of interaction in their time and space,
    easier access to several related services, access to unlimited content, and effortless
    retrieval facilities (van Riel et al. 2001).


    The implications of using e-services are significant for business (Xue et al.
    2004). Customer participation and acceptance of e-services provides them with
    a broader choice of services that meet their requirements. In some organisations
    this has led to the overhaul of the service delivery system (Xue et al. 2004).
    It is therefore important to understand the user roles in e-services system development.
    User - e-services interaction behaviour on websites is unique in the sense that
    the interface places itself in cyberspace within a short time. It is therefore
    important for business to understand what influences the use of an e-services
    system in that short time frame (Grönroos et al. 2000).


    Organisations engaged in e-business are providing e-services such as banking,
    airline ticket booking, car rental, management consulting, and the selling of
    music and software. Educational institutions are increasingly opting for interactive,
    e-services service delivery to meet user demand (Forrest and Mizerski, 1996).
    E-services system offer advantages such as instant and 24 X 7 access, immediate
    feedback and receiving, effective and immediate ordering etc, to business and
    government organisations delivering online services. For example, Hewlett Packard
    is rapidly transforming their after-sales service to e-services system users (McCarthy
    1999; Ruyter et al. 2001). Organisations have realised it would be easier for
    both businesses and their customers to put information up on the web to answer
    repeated requests from users (Berners-Lee 1999:65).


    Organisations and governments worldwide have established e-services system on
