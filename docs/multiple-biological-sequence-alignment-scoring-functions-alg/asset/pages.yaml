  md: '# QUANTIFYING SEQUENCE ALIGNMENTS


    ![](img/c2ce4992087205b6ef559b10db163265_53_0.png)


    **Figure 3.5** traversal of a tree by an SP measurement. The total visits on each
    edge is shown. Some edges are visited more than others.


    If, instead, the gap penalty is chosen to be –10, both of these alignments yield
    the same score.


    From the evolution perspective, the SP method is deficient. In Figure 3.5, (a)
    represents the evolution tree of the sequences (the leaves) and represents the
    SP accounting method for the MSA. The score of a pairwise alignment (A,B) evaluates
    the likelihood of evolutionary events on (A,u) and (u,B) of the tree. Similarly,
    the score of a pairwise alignment (C,D) evaluates the probability of evolution
    events on edges (C,w), (w,v), and (v,D) of the tree. A tick is marked on each
    edge it is being accounted for while calculating the SP score.


    In addition, the SP scoring method calculates all-pair scores of residues in a
    column every step run-time of an MSA algorithm by $O(n^2)$ for aligning $n$ sequences
    of length $n$. Nevertheless, sum-of-pair is the most popular used scoring function.
    When the mismatched score and gap penalty are negative values, the SP method seems
    to work well. The reason is the over-rewarded mismatched scores become larger
    penalties.


    # 3.5 CIRCULAR SUM SCORE


    Circular sum (CS) score [38] is an alternative measurement that corrects the redundancy
    in SP and is based on a solution to the traveling salesman problem (TSP). To calculate
    the CS score, a circular tour through an evolutionary tree representing the sequences
    in the MSA must be identified. Given a set of n sequences, $S=s_1,...,s_n$, the
    CS score for its alignment is the cost of half of all the edges in the tree $T(S)$
    visited during a tour from $s_1$ to $s_n$ and back to $s_1$. The circular tour
    leaves each edge and each exactly twice. For example, the circular tour for the
    tree in Section 3.4.1, starting from A, A is to B, from B to C, from C to D, from
    D to E, and back to A as seen in Figure 3.6.


    Similar to SP method, the edges between two residues can be derived from any scoring
    matrix or substitution matrix.


    The CS score gives an upper bound, the best score that a given set of sequences
    can be aligned.


    One of the drawback of this method is both evolution tree construction and the
    TSP are NP-complete. Thus, CS scoring method has limited practical use.'
