    # 8.7 TOOL EVALUATION


    Sequence and alignment tools rely on benchmark data sets to evaluate their effectiveness.
    And each benchmark data set has its own criteria for selecting the sequences and
    measuring the effectiveness of the result. Some contains real biological sequences,
    while others contain computer-generated sequences. There are many benchmark data
    sets, however, the following six benchmark data sets are popular. BaIBASE [52]
    has eight references, for each type of alignment result. Ref1 contains tests containing
    small number of equidistant sequences and is subcategorized by percent identity.
    Ref2 alignments contain unrelated sequences. Ref3 contains two divergent subfamilies
    with less than 25% identity between the groups. Ref4 contains tests for testing
    large internal insertions and deletions. Refs 6-8 deal with transmembrane regions,
    inverted domains, and repeat sequences. Some of the BaIBASE test cases are confined
    to homologous regions, which are difficult to detect because these region boundaries
    may be unknown.


    OxBench [165] contains three related data sets: MASTER, FULL, and EXTENDED. The
    MASTER set is used to test isolated domains exclusively from sequences of source.
    The FULL set is a full-length sequence data that was generated from the suitable
    MASTER set. The EXTENDED set is the MASTER set with additional high-scoring homologous
    sequences.


    PREFAB [53] is generated by pairwise alignment of sequences with known 3D structure
    and added up to 24 high-scoring homologues for each sequence. The effective assessment
    of an alignment is based on the structural alignment of original pair alone.


    SABmark [166] contains two subsets: SUPERFAMILY and TWILIGHT. The tests in the
    first set contain sequence with 20–50% similarity, and the second set contain
    sequences with 25% similarity or less. False-positive homologous blocks are'
