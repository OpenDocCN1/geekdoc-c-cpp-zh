    Figure 5.19 illustrates the process of creating a consistency database for KB-MSA.
    Every time a residue in a sequence is identified as part of a local pair-wise
    alignment, 1 is added to its weight vector $w$. Each significant block is represented
    as a triplet containing the block residues, the block identification, and the
    block weight factor. The weight factor is the total number of blocks identified
    in the pair-wise alignment divided by the number of all input sequences. The weight
    factor is set to 1 for all featured blocks of sequences from knowledge database.
    This is the main difference between the sequences from the two types of databases.


    The technique of using sequence consistency information in multiple sequence alignment
    is fundamental in T-Coffee, ProbCons, and MAFFT. However, the consistency in this
    algorithm represent the common residues across many sequences, unlike T-Coffee
    or ProbCons and MAFFT, where the sequence consistency is a library of local/global
    pair-wise alignment scores or metrics of transitional probabilities.


