    Multiple mutual alignment (MSA) is the extension of pair-wise sequence alignment
    as discussed in Chapter 2 in which the number of sequences to be aligned are more
    than two. (Figure 5.1 shows an alignment of BAliBase [52] reference 1 ubiquitin
    set.) With this extension, the MSA problem becomes intractable, in fact, finding
    the optimal solution for MSA is an NP-complete problem proved by Wang and Jiang
    in 1994 [68]. Thus, any attempt to develop a practical algorithmic method to find
    a mathematical solution for such problem is infeasible. To overcome this problem,
    various heuristic approaches have been proposed leading to a large number of MSA
    programs based on different strategies such as progressive, iterative, genetic,
    probabilistic, or hybrid of these methods. Each strategy focuses on one or few
    features such as speed, sequence local similarity, sequence overall similarity,
    sequence structure, and similarity. In 1999, Thompson et al. [69] performed a
    comprehensive comparison of the 10 most popular used MSA tools currently available
    [PIMA (SBPIMA and LIMPMA), MUTAL, MULTALIGN, PILEUP, ClustalX, SAGA, HMMT, and
    PRRP] at the time. As expected, the tests were not able to distinctively identify
