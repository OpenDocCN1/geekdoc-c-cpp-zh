    # 3.9.5 Scoring Metric and Sequence Weight Factor


    Sequence alignment has a factor that should be included in a scoring metric. Aligning
    a residue $a$ from motif $x$ to a similar residue $b$ in the same core motif or
    in sequence $s_i$ should have more weight than aligning $a$ to $b$ in a different
    motif or to any other residue from other locations, as in Figure 3.12.


    This depends on how much biological information about the sequences we have. In
    some instances, there are groups of similar sequences among aligning sequences.
    Normalizing this redundancy will help reduce bias in MSA results. However, biologists
    may include a subset of similar sequences into the aligning sequences to guide
    the alignment toward the redundancy that are not useful and may lead to unwanted
    results. Therefore, the weight factor should be from a function that measures
    the significance


