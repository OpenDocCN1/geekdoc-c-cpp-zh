  md: '# 11.3.1.4 S2D


    Recently, Sormanni et al. [325] introduced a computational method, named S2D,
    to predict secondary structure populations from amino acid sequences simultaneously.
    Many proteins or protein regions have been recognized as intrinsically disordered
    proteins (IDPs) and intrinsically disordered protein regions (IDPRs), which means
    that they are highly dynamical and are not able to maintain stable 3D structures
    [326, 327]. IDPs and IDRs prove to be involving in many biological processes,
    such as regulation and signaling [32]. As many structured proteins contain disordered
    regions, and disordered proteins contain some structured parts at the same time,
    the boundary between "ordered" and "disordered" proteins are not well defined.
    It would be desirable to have a predictor that provides structure and disorder
    simultaneously to reveal their intertwined properties of protein molecules.


    The S2D predictor uses the artificial neural networks with extreme learning (ELM).
    Compared to many other machine learning methods, an important aspect of ELM is
    that the universal approximation capability has been proven. For each protein
    target, a structure profile is generated using the PSSM by the PSI-BLAST program.
    Each residue in a sequence is described by 22 values with 21 from PSSM and one
    additional parameter to represent the identity of the amino acid found at that
    position. The training procedure of S2D is in three steps as follows:


    +   1. S2D uses two single-hidden layer feed-forward neural networks (SLFNs),
    where the first SLFN employs a sliding window of 11 amino acids with 242 input
    neurons and the second SLFN employs a sliding window of 15 amino acids with 330
    input neurons. Both networks have 4000 hidden nodes and 3 output neurons corresponding
    to α-helix, β-strand, and coil of the molecule respectively. Based on ELM, the
    first layer of weights in the sliding window, is randomly assigned.

    2. The second step of S2D is to predict the mean secondary structure populations
    of the entire protein by an N-to-1 network taking 22 values from PSSM and the
    6 additional values corresponding to the outputs of the two SLFNs in the first
    step. N-to-1 network has 150 hidden nodes and predicts three output values as
    well.

    3. The third step of S2D employs another SLFN with a sliding window of 5 amino
    acids and 3600 hidden nodes. The network uses the same input values as residue
    as the N-to-1 network in the second step. The N-to-1 network provides this SLFN
    with valuable information about the global properties of the protein sequence,
    which can be utilized to interpret the stabilizing effect of the tertiary structure.


    The experimental results showed that S2D predicted the SS populations similar
    to the X-ray structures with a Q₄ score above 79% and identified disordered regions
    with an accuracy about 85–88% [325].'
