    to measure the similarities among genomes. Once all the MUMs are built, locally
    collinear blocks, the basis of the core-genome alignment, are identified. The
    MUMs within locally collinear blocks are employed to construct the backbone of
    the multiple alignments. Gaps between collinear columns are aligned using MUSCLE
    [53]. Parsnp flags all polymeric columns in multiple alignments as variants or
    bases with poor qualities by FreeBays [260]. The second tool in Harvest, Ginger,
