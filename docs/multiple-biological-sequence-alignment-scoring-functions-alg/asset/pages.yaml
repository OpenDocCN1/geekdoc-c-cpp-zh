    programming R-Meshes or in $O(n)$ time using $O(n)$ R-Meshes. The latter is preferred
    as the dendrogram [step ii] and alignment [step iii] steps takes $O(n)$ time to
    complete. Then, a dendrogram is built, using the parallel neighbor-joining clustering
    algorithm described earlier, from all the pairwise DP alignment scores from step
    (i). [step iii], for each pair of prealigned groups of sequences along the dendrogram,
    the sum-of-pair column matching scores must be precalculated to initialize the
    DP R-Mesh. There are $n-1$ branches in the dendrogram leading to $n$ pairwise
    alignment groups to be performed.


    In terms of complexity, the progressive multiple sequence alignment takes $O(n)$
    time to complete all the pairwise sequence alignments [step (i)]–or $O(1)$ time
    using $n-1$ DP R-Meshes. Its consequence [step (ii)] to build the sequence dendrogram
    takes $O(n)$ time using $O(n^3)$ processing units. Finally, the progressive [step
    iii] takes $O(n)$ time using a DP R-Mesh. Therefore, the overall run-complexity
    of this parallel multiple sequence alignment is $O(n)$.


    The number of processing units utilized in this parallel alignment is bounded
    by the number of DP R-Meshes used and their sizes. The general DP R-Mesh uses
    $O(n^4)$'
