    the maximum value in distance matrix $D$ generated from this alignment scores
    is also bounded by $b^2$. Thus, the sum of $n$ of these distance values is bounded
    by $b^4$. These fact allow us to calculate the sums in step 2 in $O(c)$ time using
    an $n \times n$ R-Mesh as in Theorem 1. In this case, $c$ is constant ($c=4$).
