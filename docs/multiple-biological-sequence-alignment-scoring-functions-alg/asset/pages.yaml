    # 2.3 DYNAMIC PROGRAMMING


    Dynamic programming (DP) is defined by Richard Bellman in 1953 based on an optimal
    policy such that any decision must constitute an optimal policy with regard to
    the result of the first decision, regardless of whatever the first decision is.
    In sequence alignment term, regardless of the first symbols being chosen to align,
    all other aligning sequences guarantee that they yield the optimal alignment.
    Dynamic programming is utilized to produce the global alignment as was first introduced
    in the Needleman–Wunsch''s algorithm [19], and a local alignment version is in
    the Smith–Waterman''s algorithm [18]. Similar to the dot-plot technique, two sequences
    are mapped onto the two perpendicular sides of an $m \times n$ matrix. DP then
    starts from the joined corner of the sequences to calculate all matching scores
    of the residues in the two sequences in the adjacent slots. The process repeated'
