    +   * MAQ

    Li et al. [241] described a tool, named MAQ, which can build assemblies by employing
    mapping and estimate the error probability for the genotypes, including short
    indels and SNPs, by using quality scores and mate-pair information. MAQ has two
    stages: the alignment stage and the SNP calling stage. At the alignment stage,
    MAQ first scans the reference genome and indexes sequences to identify potential
    read alignments. A read is mapped to the position with the minimum sum of quality
    values according to the mismatched bases. To find the best alignment, MAQ builds
    multiple hash tables to ensure that a sequence with no more than two mismatches
    be it. Each hash table contains a noncontiguous set templates containing of 1
    or 0, where bases at 1 are indexed [261]. After the read indexing, the reference
    will be scanned and hashed base by base through the same templates used in the
    indexing. By looking up in the hash tables, if a potential alignment is found,
    MAQ will extend the alignment from the seed without gaps and calculate the sum
    of qualities of mismatched bases. MAQ integrates the coordinate of the alignment
    and the read identifier as a score. If a read has highest scores with different
    positions on the reference, only one position will be picked randomly. If the
    paired-end reads are available, MAQ keeps a queue to record the last two alignments
    of a read on the forward strand end. When a potential alignment is found on the
    reverse strand, MAQ looks up the queue to whether an alignment exists on the forward
    strand. The mapping quality is measured by the phred-scaled probability [262].
    MAQ finds short indels by utilizing the Smith–Waterman gapped alignment [254]
    and the mate-pair information. Given a read pair, if one end can be mapped to
    the reference but the other end cannot, a potential explanation is'
