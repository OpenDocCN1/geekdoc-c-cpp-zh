  md: '# SEQUENCE FUNDAMENTALS


    Stockholm, Swiss-Prot, and so on. In general, the sequence formats can be grouped
    into four groups: sequencing specific, based sequence, with features, and alignment
    sequence. The sequencing specific formats as AB1 from Applied Biosystems or ACE
    are used by companies that perform sequencing. The sequence data are obtained
    in fragments, called reads, and are assembled together. Many sequence formats
    are specially designed for sequencing technologies.


    The based sequence format often represents the residues themselves along with
    an identification or sequence name. The most classic sequence format is FASTA
    format (or Pearson format), a text-based format where each sequence is preceded
    with its name, comments, and the sequence base pairs or amino acids are represented
    using single-letter codes. Multiple sequences can be included in a file, where
    each line be fewer than 120 characters. A comment line starts with character ";
    and should only be intended for human. The sequence name should start with <,
    and an asterisk "* marks the end of a sequence and can be omitted. Each sequence
    should be separated by a new line. The following is an example of sequences in
    FASTA format:


    # Example 1.1 MCHU - Calmodin - Human, rabbit, rat, and chicken


    ```

    >gl|552411|gb|AAD44166.1|[Elephas maximus maximus]

    LCYTHIGRNIYSYGIAEFFAHFTYWGMLLITATMFFYPLPWGWFSWAGVITNLFSAPYWIWG

    GGTSDVKATNRFAHFFTPLTMAGVHLETISGNPLGLTSDSKFIHPYYTI

