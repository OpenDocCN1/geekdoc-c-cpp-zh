    HEP scoring function can lead to better MSA results. This test is performed by
    implementing and deploying the HEP scoring function along with SP, Smith''s PIMA,
    Valdar''s scoring functions, described in previous sections, in a progressive
    MSA program. SP is the most popular scoring function and majority of other scoring
    functions are variables of SP; Smith''s PIMA covering hierarchy is used in HEP
