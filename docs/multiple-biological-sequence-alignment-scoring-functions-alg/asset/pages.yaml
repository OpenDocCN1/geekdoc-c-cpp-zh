    limit, SoftSV applies the start of soft-clipped sequences. SoftSV needs two groups
    of soft-clip sequences: one located at the upstream breakpoint and one located
    at the downstream breakpoint. The soft-clipped sequences at the upstream breakpoint
    will match the non-soft clipped sequences located at the downstream breakpoint.
    With the soft-clip information, SoftSV builds a weighted, undirected graph where
    each vertex represents a soft-clip sequence, and each edge represents a match
    between the soft-clip and the non-soft clipped sequence based on the Smith-Waterman
    alignment between them. For every SV with at least one soft-clip sequence at breakpoints,
    a maximal clique can be constructed in the graph. The edges between the soft-clip
    sequences at the same breakpoints are weighted zero, while edges matching with
    the soft-clip sequences between different breakpoints are weighted one. The SoftSV
    sums all the weights of the edges belonging to the same clique and assigns the
    sum to that clique. The clique with the highest positive value is selected as
    a candidate SV. The consensus of an SV is computed as the median of the positions
    of all soft-clip sequence at two breakpoints, respectively. The experimental results
    show that SoftSV is very efficient for data sequencing falling within the range
    between 5x and 25x and read lengths ranging from 75 to 150 bp.


    # 10.4 EVALUATION METHODOLOGY


    Analytical requirements are the major factor for the downstream analyses when
    we conduct the evaluation for the variant calling. For example, in phylogenetic
    inferences, a small number of inaccurate variant calls may not impact the analyses
    of samples when there are a great number of variants. However, the more accurate
    results from variant callers will give us better and more detailed interpretation
    on the genetic modification. Before the actual evaluation, two general principles
    may guide us to the evaluation: (i) The selection of benchmarking samples and
    reference genomes is critical to assess the variant calling process. The selected
    data sets must be incred accurate and represent the characteristics of the samples
    used in the studies. (ii) Multiple metrics, such as TP and FP, negative call rates,
    and receiver characteristic (ROC) curves, should be utilized to evaluate the performance
    of variant calling. In the rest of section, a list of metrics for performance
    measurement, simulation tools, real benchmark datasets, and databases are introduced
    to the interested readers to test and compare various variant callers with different
    task requirements.


    # 10.4.1 Performance Metrics


    Most of available performance metrics for variant calling are derived from contingency
    tables that capture the relationship between the variant labels assigned by the'
