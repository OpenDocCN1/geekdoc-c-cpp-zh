    sequence alignment and Nussinov dynamic programming folding method, which is computationally
    expensive. Various algorithms have been developed to reduce the computational
    complexity of the Sankoff algorithm. For example, sampling-based approaches, instead
    of reducing the search space, have developed [299, 300]. Other methods have used
    posterior probabilities of base pairs and/or aligned columns to reduce the search
    space of the Sankoff algorithm [301, 302]. We use a recently proposed method,
    named DAFS [294], to illustrate an efficient way to fold RNA sequences.


    DAFS Sasto et al. [294] developed a novel algorithm, DAFS, which aligns and folds
    RNA sequences simultaneously by maximizing the expected accuracy for predicting
    the common SS and their alignments. Given a set of unpaired RNA sequences, RNA
    structural alignment aims to produce a reliable alignment, as well to predict
    the reliable common SS. DAFS is for maximizing the expected accuracy (MEA) principle,
    which can be described as


