  md: '# 152 MULTIPLE SEQUENCE FOR NEXT-GENERATION SEQUENCES


    While suffix tree is an effective data structure for subsequence searches, it
    requires a large amount of computer memory to operate. Since the alphabet used
    in the reads and the genome is small, many alignment algorithms to reduce symbol
    redundancy in the sequence to speed up the computation. For example, Bowie [194],
    BWA [195], and SOAP [196] utilize Burrows-Wheeler transform (BWT) [197] - a space
    efficient text compressing algorithm.


    Bowie [1994] is another well-known memory-efficient and fast indexing algorithm.
    Bowie use BWT [197] and FM-index [198] to index reads. BWT [1997] algorithm was
    invented by Burrows and Wheeler in 1994 to compress large texts for efficient
    search. The transformation permits the order of the symbols in the text so that
    substrings often occur when followed by similar single character multiple times
    in a row. In general, BWT takes an input sequence of length *n*, generates sequences
    of length *n* by rotating the input sequence, sorts the sequences by lexicographical
    order, and then outputs the last column of the sorted sequences. Table 9.1 illustrates
    the BWT of the input sequence “GTGTAC”, where “"” and “$” denote the alphabet
    and the end of the string, and they are considered larger than the alphabet,


    The BWT is reversible. If we take the output, the last column of the sorted sequences,
    then sort it by lexicographical order, produce the sorted column with the input,
    and repeat the sequence and combine it with the input each row has exactly the
    same number of symbols as the input. The original input sequence is the one that
    is preceded by “"” and ended by “$.”. This process is shown in Table 9.2, in which
    each step is processed from left to right.


