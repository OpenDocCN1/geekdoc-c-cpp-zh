    organization, such as human, genome alignment is the only method for variant detection
    of closely related bacterial genomes [245, 246]. Aligning genomes is able to reliably
    identify all of variants and usually serves as a gold standard for comprehensive
    variant identification, although it depends on highly accurate and continuous
    assemblies, which are expensive to generate sometimes. In this chapter, we focus
    on the variant callers based on reading mapping and genome alignment, using MSA
    as their main sources for variant inference. We will describe six variant callers,
    including three tools based on genome alignment, that are, MUMmer [247], Musgy
    [248], ParSNP [29], and three tools based on the reading mapping, by MAQ [241],
    Gustaf [250], SoftSV [251], to deliver the whole picture or some images of variant
