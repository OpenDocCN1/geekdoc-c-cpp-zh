    # 10.3 VARIATION DETECTION METHODS BASED ON MSA


    Regarding the input and calling strategies, variant detection methods can be grouped
    into three categories: read mapping methods, *k-mer* matching methods, and genome
    alignment methods. Read-based and genome-based methods employ (multiple) sequence
    alignments to search genome variants. The difference is that the former use short
    reads while the latter use the whole genome. Variant callers based on *k-mer*
    matching alignments using subsequences with fixed length, *k* flanked by the conserved
    sequences among target genomes to produce high precision variants instead of aligning
    aligning sequences [229, 230]. In the past, *k*-mer approaches have been heavily
    used to measure genome similarity and cover homologous genomic sequences [231–233].
    Recently, *k-mer* matching has also been applied to SNV discovery [234–236]. Kidd
    et al. [236] introduced the diagnostic *k-mer* analysis to genotype sequenced
    novel insertions and discriminate heterozygous from homozygous insertions using
    the NGS data. Gardner and Hall developed a software, kSNP v2, to identify SNP
    centered in the center of odd-length k-mers possessed by multiple genomes. These
    matched k-mers can be aligned back to reference genomes if available to locate
    others of SNPs. Therefore, these approaches are suitable for both assembled genomes
    and NGS results, sensitivity is sacrificed for the improved efficiency of exact
    alignment [237]. Since *k-mer approaches generally do not use MSA, we focus our
    attentions on the read mapping and genome alignment methods.


    A common workflow of read- and genome-based method is shown in Figure 10.4. After
    the library preparation, the samples will be sequencedenced on the NGS platform
    and filtered to control quality. Before the variant calling, the alignments are
    constructed by aligning short sequence reads to the existing references or the
    *de novo* assembled genomes. The detected variants can be further annotated and
    visualized using other dedicated tools, and prioritized and filtered by lab validation.
