    With this construction, the distances in $M$ are additive, the sum of all edge
    weights between any two OTUs are exactly the distance between those two OTUs as
    depicted in $M$. The tree in Figure 6.3 is the additive tree representing the
    phylogenetic tree. For all additive distance matrices, the $O(n^2)$ algorithm
    for finding the phylogenetic tree. In reality, the distance is rarely additive;
    thus, finding a tree that best fits the data is often the case. There are two
    popular methods for this:


