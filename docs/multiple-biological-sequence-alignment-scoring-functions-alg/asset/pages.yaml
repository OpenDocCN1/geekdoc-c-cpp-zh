  md: "# PROTEIN/DNA/RNA PAWISE SEQUENCE ALIGNMENT\n\n# 2.1 SEQUENCE ALIGNMENT FUNDAMENTALS\n\
    \nSequence alignment problems can be generalized as follows: Let $W = \\{\\alpha_1,\
    \ \\dots, \\alpha_i, \\dots, \\alpha_j\\}, i > 0$, a set of amino acid symbols\
    \ or nucleotide symbols. A sequence $s_i = \\alpha_1 \\dots \\alpha_i \\dots \\\
    alpha_k$ is a string of $n$ amino acid symbols. An alignment is a transformation\
    \ of\n\n$k > 1$ sequences $\\{s_1, s_2, \\dots, s_k\\}$ inserted into $\\{s'_1,\
    \ s'_2, \\dots, s'_k\\}$, where $s'_i$ is the $i$th sequence $s_i$ with GAP (-)\
    \ symbols inserted to maximize the similarity among the regions across. In biological\
    \ perspective, the gaps represent residue symbols being deleted from the sequences\
    \ during the course of evolution. In general, when a gap is inserted into a sequence,\
    \ a penalty is applied to the alignment. The weight of the penalty depends on\
    \ the location of the insertion.\n\nFor example, the sequences to be aligned are\
    \ $s_1$: GLISVT and $s_2$: GIVT, then a possible alignment is\n\n```\n$A(s_1,\
    \ s_2) = \\begin{cases} s'_1: & G L I V S T \\ s'_2: & G - I V - T \\end{cases}$\n\
    ```\n\nCommon pairwise alignment techniques are dot-matrix [17], dynamic programming\
    \ [18, 19], and word method [20]. Each method provides a host of advantages. For\
    \ example, the dot-matrix provides a good visualization of an alignment; the dynamic\
    \ programming technique guarantees an alignment with optimal score; and the word\
    \ method ($k$-tuple) is a time-efficient alignment method that provides reasonable\
    \ sequence alignments. In this chapter, we explore the details of these algorithms.\n\
    \n# 2.2 DOT-PLOT MATRIX\n\nThe dot-matrix method [17] provides a visualization\
    \ of potential matching of sequences between any two sequences. This method is\
    \ performed as follows:\n\n+   (i) For any pair of given sequences of lengths\
    \ $m$ and $n$, the sequences are mapped onto the two perpendicular edges of an\
    \ $m \times n$ matrix.\n(ii) A scoring scheme is used to mark the similarity between\
    \ any two residues of the two sequences.\n\nFor simplicity, a dot would be placed\
    \ on the diagonal lines where the two residues are the same, otherwise that slot\
    \ is left unmarked. When all $m \times n$ slots are considered, dots that resemble\
    \ diagonal lines in the matrix represent the similar sections between two sequences.\
    \ Obviously, two identical sequences will have a diagonal line starting at the\
    \ beginning joint of the two sequences. Figure 2.1 shows a dot matrix created\
    \ from aligning ACACACTA against sequence AGACACA. These two sequences share the\
    \ same subsequence ACACA. Since this method plots any matching residues between\
    \ two sequences, it is common that the dot matrix\n\n12"
