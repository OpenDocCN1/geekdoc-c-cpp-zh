  md: '# # 6

    # PHYLOGENY IN MULTIPLE SEQUENCE ALIGNMENTS


    Multiple Sequence Alignment (MSA) is a common tool in phylogenetic analysis, where
    the evolutionary tree of different organisms are identified and organized in a
    hierarchical structure in which closely related species are physically placed
    near each other. This kind of structure is a phylogeny – a conjecture of evolution
    of taxonomic groups. It is not to confuse that many MSA algorithms also use pairwise
    alignments to construct a phylogeny as a reference for further refinement. These
    two types of phylogenetic structures may or not represent the same information
    because the first one is built from pairwise alignment and the latter is derived
    from the final assembled MSA. We should view the phylogeny constructed by calculating
    the distance of any sequences as a specific phylogeny for these sequence being
    aligned.


    # 6.1 THE TREE OF LIFE


    MSAs are often used to create a phylogenetic tree – tree of life – due to the
    two distinct features that MSAs possess. First, most functional domains are known
    and well annotated in sequences; thus, MSAs help identify these functional domains
    in non-annotated sequences. This way, sequences can be categorized by similar
    functional domains. The second feature is the capability to find conserved regions
    that are known to be functionally important. With the flexibility in MSA techniques
    that


