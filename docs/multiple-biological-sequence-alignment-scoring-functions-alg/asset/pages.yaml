    chips that share a limited onboard memory. This memory is called local memory
    or distributed memory. The processing nodes may share a common memory. With these
    systems, each individual processing node can perform different task on different
    set of data. Communication among processing nodes relies primary on the network
    connections. These systems are classified as Multiple-Instruction, Multiple-Data
    (MIMD) systems.


    # 7.1.2 Vector


    Vector processors have special instructions that can perform the same instruction
    on several data elements. For example, a vector instruction can add one array
    of scalar to another simultaneously, while a regular scalar instruction has to
    iterate through the elements in the arrays individually. These systems are classified
    as Single-Instruction, Multiple-Data (SIMD) systems.


    # 7.1.3 GPU


    Graphics processing unit (GPU) is very popular in portable and desktop computers
    for rendering graphics computers. GPU instructions are specialized for graphics
    manipulation and processing. Currently, it is common to utilize GPU for general-purpose
    processing. GPUs must work in conjunction with a host system as coprocessors.


    # 7.1.4 FPGA


    Field-programmable gate arrays (FPGAs) are a type of reconfigurable computing
    systems. Hardware logic on FPGAs is configurable, which allows custom operations
    and data types to be programmed into the chip for each processing element on board.
    FPGAs act as coprocessors and are utilized as hardware accelerators. FPGA processing
    elements are locally interconnected, as utilizing a very low overhead communication
    environment.


    # 7.1.5 Reconfigurable Mesh


    Reconfigurable Mesh (R-Mesh) computing system is a k-dimension grid of processing
    elements. Communication between the processing elements is primarily through a
    grid network, which is either electrical or optical. The difference in the network
    medium leads to different communication protocols for this computing model. Generally,
    R-Mesh processing elements can perform a few simple operations and contain minimal
    amount of local memory.


    # 7.2 EXITING PARALLEL MULTIPLE SEQUENCE ALIGNMENT


    In general, independent operations can be performed simultaneously on different
    computing elements to speed-up the time it takes to complete a task. The trade-off'
