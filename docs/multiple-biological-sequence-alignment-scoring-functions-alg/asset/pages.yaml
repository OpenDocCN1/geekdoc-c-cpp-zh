  md: '# # 3 QUANTIFYING SEQUENCE ALIGNMENTS


    The concept of measuring the evolution is to calculate the number of evolutions
    or the number of derivation levels of species from their original ancestors. Hypothetically,
    to do this, the entire hierarchy of evolution and the species involved must be
    identified and correctly organized. In the real world, a complete evolution information
    is often not available, and nobody knows for sure when, how, why, and what species
    really involved in the evolution. Thus, the task of measuring evolution relies
    on the genetic and genomic information that are obtained from certain species,
    which often comes in the form of sequences. In this chapter, we will study existing
    methods that have been used to measure species evolutionary distances and similarities.


    # ## 3.1 EVOLUTION AND MEASURING EVOLUTION


