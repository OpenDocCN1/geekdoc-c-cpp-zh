    and the protein structure dictates sequences. In this section, we present the\
    \ fundamentals of sequences and their basic components.\n\n# 1.3.1 Protein\n\n\
    Proteins (also known as polypeptides) are organic compounds consisting of amino\
    \ acids linked with peptide bonds forming a linear polypeptide and folded into\
    \ a globular form. The linear sequence of amino acids in the protein molecule\
    \ represents its primary structure. The secondary structure refers to regions\
