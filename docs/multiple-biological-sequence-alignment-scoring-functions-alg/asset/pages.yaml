    # 7.5.1 Hierarchical Clustering on R-Mesh


    The parallel neighbor-joining (NJ) [61] clustering method on R-Mesh is described
    here; other hierarchical clustering mechanisms can be done in a similar manner.
    The neighbor-joining takes a distance matrix between all pairs of sequences and
    represents it as a star-like connected tree, where each sequence is an external
    node (leaf) on the tree. NJ then joins the shortest distance pair of nodes and
    replaces it with a new node. This process is repeated until all the nodes are
    merged.


    Followings are the actual steps to build the dendrogram:


    +   1. Initially, all pairwise distances are given in the form of a matrix $D$
    of size $n \times n$, where $n$ is the number of nodes (or input sequences).


    +   2. Calculate the average distance from node $i$ to all the other nodes with
    $r_i = \frac{\sum D_{ij}}{n-1}$.


    +   3. The pair of nodes with the shortest distance $(i, j)$ is the pair that
    gives minimal value of $M_{ij}$, where $M_{ij} = r_i - r_j$.


    +   4. A new node $u$ is created for shortest pair $(i, j)$, and the distances
    from $u$ to $i$ and $j$ are $d_{ui} = \frac{D_{ij}}{2}$, and $d_{uj} = d_{ij}
    - d_{ui}$.


    +   5. The distance matrix $D$ is updated with the new node $u$ to replace the
    shortest distance pair $(i, j)$, and the distances from all other nodes to $u$
    is calculated as $D_{uk} = D_{ik} + D_{jk} - D_{ij}$.


    These steps are repeated for $n-1$ iterations to reduce distance matrix $D$ to
    one pair of nodes. The last pair does not to be merged, unless the actual location
    of the root node is needed.


    Steps 1 and 4 are constant-time operations on an $n \times n$ R-Mesh, where each
    processing unit stores a corresponding value from the distance matrix. the progressive
    multiple sequence alignment algorithm only uses the dendrogram as a guiding tree
    to select the closest pair of sequences (or two groups of sequences), the actual
    distance values between the nodes on the final dendrogram are mostly insignificant.
    Consequently, the values in distance matrix $D$ can be scaled down without changing
    the order of the nodes in the dendrogram. In addition, if these values are not
    preserved, calculations in step 4 can be skipped.


