  md: 'DIVERSITY SCORING SCHEMES


    # ### 3.7.1 Background


    The Shannon entropy originates from combinatorics and information theoretics.
    The combinatorial derivation can be seen as follows: Consider 10 colored balls
    of 5 reds, 2 greens, and 3 yellows. The total distinct arrangement is 10!/(5!2!3!)
    = 2520. In general, with n symbols of k types, the total distinct permutation
    is given as


    ```

    $W = \frac{N!}{\prod_{i=1}^{k} n_i},

    ```


    $n_i$ is the frequency of the $i$th type. For large $n$, $N!$ can be calculated
    using Stirling’s approximation: $\ln N \approx N\ln N - N$. Therefore,


    ```

    $lnW = - \sum_{i}^{k} p_i\ln p_i$,

    ```


    where $p_i = n_i/N$ is the fractional frequency of type $i$. Moreover, the linearly
    transformation of this function gives the Shannon’s entropy:


    ```

    $S = - \sum_{i}^{k} p_i\log_2 p_i$.

    ```


    # ### 3.7.2 Methods


    In 1991, Sander and Schneider [43] defined a conservation score based on a normalized-Shannon’s
    entropy as


    ```

    $S = - \sum_{i}^{k} p_i\ln p_i \times \frac{1}{\ln k}$.

    ```


    where $k$ is the number of symbol types (4 for DNA/RNA sequences and 20 for protein
    sequences).


    Similarly, Shenkin et al. [44] proposed their score as:


    ```

    $S = 2^S \times 6$.

    ```


    where $S$ is the Shannon’s entropy and $k$ is the number of symbol types. These
    two equations are transformations of each other; thus, they are very similar.
    One problem with these functions is that the maximal diversity only occurs when
    all types are represented evenly. Second, these functions will get their maximum
    score when there is at least $k$ sequences involved in a column.


    Another scoring scheme based on Shannon’s entropy is Gerstein and Altman’s method
    [45]. Their function is designed to compare sequence conservation against structural
    conservation in multiple alignments of protein sequence structures. The function
    is defined as


    ```

    $S = \sum_{i}^{k} \bar{p}_i\log_2 \bar{p}_i - \sum_{i}^{k} p_i\log_2 p_i$,

    ```'
