  md: "# NEW DEVELOPMENT IN MULTIPLE SEQUENCE ALIGNMENT ALGORITHMS\n\nT-Coffee [58]\
    \ and ClustW [55]. What makes this algorithm distinctively different from others\
    \ is the capability to change its sequence alignment order to reflect the best\
    \ pair-wise matching whenever new information is available, correcting alignment-errors\
    \ as soon as they are found.\n\nInitially, the biological information and local\
    \ pair-wise alignment scores are obtained for all input sequences. The biological\
    \ information can be obtained by querying sequence knowledge databases as Swiss-Prot\
    \ or TrEMBL [10]. To combine this information, each residue in the sequence will\
    \ be represented as a triplet, $(r, \\alpha, \\beta)$, containing the residue\
    \ $r$, the local alignment score $\\alpha$ and the biological score $\beta$. This\
    \ information is utilized to enhance the global pair-wise alignments, estimating\
    \ the sequence alignment tree. Moreover, the guiding tree in this algorithm can\
    \ dynamically recover its branches based on the result of alignments on lower\
    \ branches.\n\n# 5.5.2.1 The PaADT's Algorithm The algorithm to align $n$ input\
    \ sequences is\n\n+   Step 1: Each sequence is represented as an array of triplets.\
    \ The $i$-th triplet of sequence $j$ represents the residue $i$ of sequence and\
    \ two values $\\alpha$ and $\\beta$. These values represent the local alignment\
    \ score and biological score of this residue, respectively. Initially, these scores\
    \ are zero.\n\n+   Step 2: For each input sequence, extract its biological information.\
    \ Residues identified as part of a conserved or functional region are given $\\\
    beta=1$ for its biological score.\n\n+   Step 3: Perform all-pair-wise sequence\
    \ alignments via Smith-Waterman's method [18] to identify the longest common subsequence\
    \ between any pair of sequences. These $a$ scores are cumulative. A residue with\
    \ local alignment score of $n \\times a$ indicates that this residue is common\
    \ to all-pair-wise alignments.\n\n+   Step 4: Perform all-pair-wise sequence alignments\
    \ via the weighted Needman-Wunsch's algorithm as described earlier. The inverse\
    \ of these alignment scores represents the distance matrix between the sequences.\n\
    \n+   Step 5: Estimate the phylogenetic tree by using distance matrix generated\
    \ in step 4. The phylogenetic tree can be estimated by the neighbor-joining (NJ)\
    \ or weighted/unweighted pair grouping with arithmetic method (UPGMA/WPGMA) as\
    \ discussed in Chapter 4. Branches of the guiding tree that have $\\epsilon$ distance\
    \ are considered interchangeable.\n\n+   Step 6: Align the sequences following\
    \ the order specified by the estimated phylogenetic tree from the leaves to the\
    \ root via the Needleman-Wunsch's algorithm with weighted scoring scheme described\
    \ early. On any section of a tree where there are more than two interchangeable\
    \ branches, all-pair-wise alignments between these branches are performed. The\
    \ highest score pairs are selected and gap-refined; the process is repeated until\
    \ all branches are aligned."
