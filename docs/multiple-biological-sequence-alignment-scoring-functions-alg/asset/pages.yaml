    \ score where different symbol pairs gets more counts than the conserved ones.\
    \ Both Wu and Jores's method does not take penalty into account.\n\n# 3.6.3 Lockless\
    \ and Ranganathan's Method\n\nRanganathan and Ranganathan [41] propose a different\
    \ scoring method where they measure the conservation of an amino acid in a position\
    \ that extends to the whole alignment. If a symbol $a$ occurs in the sequence\
    \ database with a frequency $q_a$, the probability of $occurring$ $n_a$ times\
    \ in a column of $N$ residues is $P(X=n_a)$ where $X \\sim Bin(N,q_a)$, where\
    \ $Bin(N,q_a)$ is the binomial probability of $a$. For example, if one half of\
    \ the residues in SWISS-PROT [10] database are all As, then the probability of\
    \ $A$ occurring ten times in a column with 10 residues is the same as the probability\
    \ of tossing a coin 10 times and get heads. The function to calculate the difference\
    \ between the frequency of $a$ at a specific column and $a$ across the alignment\
    \ is defined as\n\n```\n$d(n_a,\\overline{n}_a) = \\ln\\left(\\frac{P(X=n_a)}{P(X=\\\
    overline{n}_a)}\right), \\quad (3.8)$\n```\n\nwhere $\\overline{n}_a$ is the average\
    \ frequency of symbol $a$ in the entire alignment. This gives $d=0$ when the frequencies\
    \ of $a$ in all columns are the same.\nThe conservation score is defined to be\
    \ the root-mean-square deviation of overall protein acids, such as\n\n```\n$S\
    \ = \\sqrt{\\sum_{a} d(n_a,\\overline{n}_a)^2}. \\quad (3.9)$\n```\n\nDue to its\
    \ complexity, this method is rarely used in sequence alignment.\n\n# 3.7 DIVERSITY\
    \ SCORING SCHEMES\n\nShannon's entropy, proposed in 1948 [42], is commonly used\
    \ to quantify the diversity in alignment columns. In this section, we will investigate\
