    Given a column of $k$ aligned sequences, $k > 1$, containing $n$ residues, $n
    \leq k$. Let $c_i > 0$ be the cardinality of two matches at level $i, l \leq \log
    5, c_i > 1$, and $c_{i+1} \geq 0$. The score of the column is 1 if all residues
    are homogeneous; otherwise, the score of the column will be


    ```

    $$\frac{1}{(n-1)^l} \times [(n-1-a_1)^{c_i} + (n-1-a_2)^{c_i} + \dots + (n-1-a_l)^{c_i}}
    + \dots] + \frac{(a_i+a_j-1)^{c_{ij}}}{t} + \dots + \frac{(n-1)^0}{5}$

    ```


    $\gamma_c \geq 1$ and $a \geq 1, i \neq j, i \geq j$, and $1 \leq t \leq log$.


    Let $c = \min(c_i)$ and $a = c - c_{i+1}$. If there are only two types of residues
    (divergent of degree 2), the column score will be $(n-x-1)^c + (x-1)^c - \frac{x-1}{2}$,
    $1 \leq x < k$, and $a \geq 0$. To prove that $(n-1)^c > (n-x-1)^c + (x-1)^c -
    \frac{(n-1)^a}{2}$, $a \geq 2$. Since $(n-1)^c > 2 \times [(n-x-1)^c + (x-1)^c]$,
    we need to prove $(n-1)^c > (n-x-1)^c + (x-1)^c - \frac{(n-1)^a}{2}$. $(x-1)^c
    + \frac{(n-1)^a}{2}$ is equal to $(n-x-1)^c + \frac{(n-1)^a}{2}$. This is true
    $\forall l$.


    Similarly, the proof can be extended to any divergent of $d, d \leq n$. If there
    are $d$ types of amino acids at the leaf level of the scoring tree, the column
    score will be smaller than a similar tree with divergent degree $d-1$ because
    splitting one the leaf groups into two groups from a $d-1$ divergent tree makes
    it a $d$ degree divergent tree.


