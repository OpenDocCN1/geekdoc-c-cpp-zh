    or inverted repeats. These are sequences that are the reverse of others downstream
    sequences. For example: 5'' ... GGCGGGCCAAAAAAAACCCCCCGGGCGG ... 3'' is an RNA
    stem-loop. To identify these motifs, a sequence is aligning itself using dot matrix.
    With a window size equal to the length of the motifs identified, the dot-plot
