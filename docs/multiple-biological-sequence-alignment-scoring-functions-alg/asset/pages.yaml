    +   * MUMer

    Delcher et al. [247] described a system, named MUMer, to rapidly align sequences
    containing millions of bases using three techniques, that is, suffix tree [252],
    increasing subsequence (LIS) [253], and Smith-Waterman alignment. With the alignment,
    MUMer can identify SNPs, repeats, and other sophisticated variants. To locate
    the genetic variants, MUMer introduced compete, maximal match (MUM), which is
    defined as a subsequence that shows exactly once in the target genomes and cannot
    be extended. Based on the MUM, MUMER defined four classes of variations as depicted
    in Figure 10.6. The identifying process is comprised of four steps: (i) search
    all MUM subsequence in two target genomes; the principle of action is that if
    a long and perfect MUM is found in genomes, it is most likely belonging to the
    global alignment. (ii) Find the LIS of a sequence of MUM to scan the alignment
    from begin to end. (iii) Locate SNPs, inserts, and repeats indicates the gap areas
    that separate the alignments. (iv) Write out the callers and the imperfectly matched
    regions. The experiments using MUM on two closely related and distant genomes
    revealed that a large number of MUMs are needed to exist between highly similar
    genomes, which is an important assumption to ensure MUMer to be practicable.


