  md: '# 2


    # PROTEIN/DNA/RNA PAIRWISE SEQUENCE ALIGNMENT


    Given a set of biological sequences, it is often a desire to identify the similarities
    shared between the sequences. This information will give further data about the
    functionality, originality, or the evolution of the species where these biological
    sequences are obtained. Theoretically, the best identification technique would
    be the one that correctly and perfectly aligns all the residues and substructures
    sharing similar biological and functional features between the sequences and structures.
    These aligned residue blocks in the sequence alignments suggest possible biological
    relationships between these sequences and can easily be verified with prior knowledge
    on these biological data. With some known data, we can logically infer them over
    to other biological entities involved in the alignment. Without any known information,
    the alignment of similarities obtained from different species could lead to possible
    discovery of biological meaning. In reality, this technique has yet to exist due
    to many factors such as the lack of information about the functionality of each
    region in a sequence, how the regions are correlated, how the two sequences have
    evolved, or which parts of the sequences are simply random mutations. In practice,
    many alignment algorithms are designed around the two concepts: global alignment
    and local alignment. In global sequence alignment, all sequences maintain a correspondence
    over their entire length. On the other hand, in the local alignment, only the
    most similar part of the sequences is aligned. It depends on what is being identified;
    each concept has its own advantages.


    Multiple Biological Sequence Alignment: Scoring Functions, Algorithms and Applications

    First Edition. Ken Nguyen, Xuan Guo, and Yi Pan.

    © 2016 John Wiley & Sons, Inc. Published 2016 by John Wiley & Sons, Inc.'
