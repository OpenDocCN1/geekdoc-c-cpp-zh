    neural networks with the statistical-based scores as the encoded features to achieve
    the improvement on the secondary structure prediction accuracy. A sliding window
    of 15 residues is selected. To predict the SS state of residue in the middle of
    the window, SCORION utilizes 20 PSSM values, 1 extra value, and the context-based
    scores of the predefined SS to train a neural model. Some studies'
