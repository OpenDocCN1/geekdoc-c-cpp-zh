    to calculate PPV is written as


    > $PPV = \frac{TP}{TP + (FP - \epsilon)}$ (11.7)


    The MCC is formulated as


    > $MCC = \frac{TP \times TN - FP \times FN}{\sqrt{(TP + FP)(TP + FN)(TN + FP)(TN
    + FN)}}$ (11.8)'
