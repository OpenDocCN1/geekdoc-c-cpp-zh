    BLAST [24] is the most popular pairwise sequence alignment used to search

    sequence databases. BLAST is a heuristic search method that splits an input query

    sequence into small segments (words) of size w and scans a sequence database for

    matching sequences with a score greater than a predetermined cut-off score S (BLAST

