    # 9.2 OVERVIEW OF NEXT GENERATION SEQUENCE ALIGNMENT ALGORITHMS


    Most of the alignment problems in NGS are assembling the reads and aligning to
    their reference. With the magnitude of sequencing technologies throughput, most
    alignment algorithms utilize data structures that provide effective indexing and
    searching operations. In general, the alignment problem is treated as a string
    searching, where the reads are substrings of the reference, and the alignments
    are done by identifying the location of the read in the reference. One of the
    most effective techniques to handle this problem is indexing the sequences, both
    the reads and the reference. The sequences can be indexed by keywords and stored
    in hash tables where the words can be identified efficiently. An alternative is
    creating a suffix tree, where all possible suffix in the reads and the reference
    can be identified optimally.


    # 9.2.1 Alignment Algorithms Based on Seeding and Hash Tables


    The simplest form to find the occurrences of a read on the reference genome is
    to slide the read from one end of the reference to the other end, one symbol at
    a time. At every step, if the read and the corresponding subsequence from the
    reference genome are identical, we have a match – a location where the read should
    be mapped onto the reference. Obviously, this technique yields a prohibitively
    large time complexity for a task with hundreds of thousands of reads. To reduce
    the computation, hashing is a technique to convert a string, that is, a subsequence
    into a key for fast search – the key is a number representing a location on a
    table in which we would place the string. Thus, similar string get the same key
    and will be stored as the same location.


    The concept of using a hash table indexing is seen earlier in BLAST. Similar to
    BLAST, hash table based algorithms fundamentally find the same seed-and-extend
    paradigm, where the position of each k-mer (k=11 by default) subsequence of the
    query is stored in a hash table and the k-mer is the key. The algorithm scans
    the database for k-mer exact matches by looking up the hash table. These matches
    become the seeds of the anchor points, where the algorithm extends its matching
    and joining all the gaps without a maximum sequence pairs (MSP). The Smith–Waterman
    [18] pairwise alignment is performed to find the optimal matching between the
    MSP and the sequence database, in NGS reads, it is between the reference genome
    and the reads. Nevertheless, it is the same technique to search for the best alignment
    of the short sequence reads onto a long reference genome. To handle inexact matches
    between reads, Needleman–Wunsch [19] is utilized.


    In particular, these alignment algorithms using seeding and hash tables: SeqMap
    [174], MAQ [175], RMAP [176], ZOOM [177], MOM [178], BFAST'
