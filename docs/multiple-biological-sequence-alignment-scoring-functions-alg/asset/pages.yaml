    \ scores are calculated at each step, HEP uses a scoring tree which is built using\
    \ substitution matrix such as PAM, BLOSUM, or any scoring matrix. In HEP, the\
    \ score of matching residues is assumed to be positive; thus, adjustment of residue\
    \ weighting values is needed. A way to adjust weights is scaling up the scores\
