  md: '# 7 MULTIPLE SEQUENCE ALIGNMENT ON HIGH-PERFORMANCE COMPUTING MODELS


    The current advancement of sequencing technology has created a vast amount of
    sequences to be categorized, stored, and analyzed. However, multiple sequence
    alignment, one of the most used tools for sequence analysis, is already passing
    its practical threshold due to large number of sequences to be aligned and the
    NP-completeness nature of the alignment problem. A practical solution to this
    problem is to perform independent subtasks of the alignment problem simultaneously
    on parallel or distributed computers. In this chapter, we will start by describing
    the basics of parallel computing models and then investigate multiple sequence
    alignment algorithms that have been parallelized to speed up multiple sequence
    alignment process.


    # 7.1 PARALLEL SYSTEMS


    There are many types of parallel computing systems that have been deployed to
    solve computationally intensive problems such as sequence alignment and classification.
    Following are the most models that are described.


    # 7.1.1 Multiprocessor


    Multiprocessor systems consist of multiple processing nodes connected through
    a network. Each processing node contains one or more processors or multicore'
