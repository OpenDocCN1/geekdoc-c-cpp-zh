    $\delta(s_1, s_2) = \begin{cases} maxOV(s_1, s_2) - minOV(s_1, s_2) \ minOV(s_1,
    s_2) \ int(\frac{1}{2}len(s_1)) \ int(\frac{1}{2}len(s_2)) \end{cases}$

