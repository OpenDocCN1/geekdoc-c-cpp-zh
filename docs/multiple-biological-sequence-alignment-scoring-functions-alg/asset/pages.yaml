    MULTIPLE SEQUENCES ALIGNMENT ALGORITHMS


    # 5.5.2.2 Scoring Method Traditionally. Needleman–Wunsch’s algorithm [19] maps
    two sequences x and y of lengths n to the two connecting sides of a scoring matrix
    H with (n+1) x (n+1). The values in first row and column of the matrix are set
    to the corresponding gap penalty, that is, H[0,i] = H[i,0] = i × gap, where gap
    is the gap-aligned penalty (a negative value). A pair of residues from ith row
    and column ith is the maximum of three values:


    ```

    H(i,j) = { H(i-1, j-1) + s(x_i,y_j), \ H(i-1, j) + gap, \ H(i, j-1) + gap }

    ```


    where s(x_i,y_j) is the substitution score (or pair-wise residue score) between
    residues at row i and residue yj at column j.


    To incorporate the local alignment scores and the biological scores into this
    dynamic pair-wise alignment, the pair-score between triplets (x_j, α_i, β_j),
    representing residues yj and x_i, is defined as


    ```

    s(x_i, α_i, β_j) = s(x_i, α_j) + (α_i + β_j) / 2 + B(β_i, β_j) × s(x_i, y_j)

    ```


    where B(β_i, β_j) is the biological score of the two residues yj and x_i, which
    is defined as


    ```

    B(β_i, β_j) = { 1 if β_i ≠ 0 and β_j ≠ 0, 0 otherwise }

    ```


    To align two prealigned groups of sequences, the sum-of-pair scoring method and
    the average local alignment score extends to the average of all local alignment
    scores in two aligning columns. The sequence group column score is set to 1 if
    any of the residues in a column has a biological score of 1; otherwise, it is
    set to zero. This group biological score helps dynamic programming to favor matching
    between two columns that have at least a residue with biological significance.
    These biological scores (β) and local alignment scores (α) are used as weight
    control parameters. They can be increased or decreased to adjust the weights of
    these two features


    # 5.5.2.3 Dynamic Alignment Guidance Tree Similar to traditional method, an alignment
    guiding tree is built from either UPGMA [60] or neighbor-joining (NJ) [61] from
    all-pair-wise sequence distances. However, in this method, the branches of the
    alignment guiding tree that are less than ε distance are considered interchangeable.
    These branches indicate that the pair-wise distances between these sequences are
    small. Then, when the sequences are aligned, these distances will depend on gap
    insertions and the arrangement of the columns of these alignments. In this design,
    the branches are allowed to be reordered dynamically based on the best pair-wise
    alignment of any two branches. This step'
