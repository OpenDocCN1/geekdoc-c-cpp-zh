    # 2.3.4 Affine Gap Penalty


    Statistically, the occurrence of d deletions/insertions is more likely than the
    occurrence of isolated mutations. One way to enforce this concept is to penalize
    the opening gap, the first insertion/deletion of a segment, more than consecutive
    insertions/deletions. This is called the affine gap penalty [22] and it is calculated
    as


    > $w(g) = o + (l - 1)e$,


    where $w(g)$ is the weight or penalty of gap $g$, $o$ is the opening gap, $l$
    is the length of the gap, and $e$ is the cost of each insertion/deletion. In general,
    $o \le e \le 0$.


    # 2.4 WORD METHOD


    Word methods, also known as the $k$-tuple methods [20], are heuristic methods
    that find a series of short and nonoverlapping subsequences (“words”). These methods
    do not guarantee to find the optimal alignment solution between sequences; however,
    they are fast and significantly more efficient than dynamic programming and dot-plot
    methods. They are more practical to query large databases of sequences. In general,
    the word methods are as follows:


    First, a window of size $k$ is chosen, normally $k \ge 3$ for protein sequences
    or $k \ge 11$ for DNA and RNA sequences. This window is then applied to one end
    of a sequence to obtain a $k$-length subsequence called a word. The window is
    then moved to the other end, one symbol at a time, to obtain all $k$-length words
    in a sequential order. The next step is to search these words from other sequences
    for either exact matches (as in FASTA) or highest scoring words (as in BLAST).
    Sequences that yield a matching greater than a predefined threshold $\lambda$
    are considered highly homologous. Figure 2.8 and the following example illustrates
    how to use the word method in sequence alignments.'
