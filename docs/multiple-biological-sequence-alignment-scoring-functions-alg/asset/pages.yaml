  md: '# PROGRESSIVE ALIGNMENT


    5.1.1.1 Determining the Cutting Position The most important task of DCA is how
    to identify the location for splitting each sequence. A perfect set of cuts could
    lead to an optimal solution. DCA uses a heuristic based on additional cost matrices
    to quantify the compatibility of the cut positions. The cut position is calculated
    as follows:


    For any sequence $s = s_1, s_2, \dots, s_n$ of length $n$ and a cut position $c$
    ($0 \le c \le n$), the prefix sequence before $c$ is denoted as $s(\le c)$ and
    the suffix $s(> c)$. Dynamic programming is used to compute the additional cost
    of $C_{s_p,s_q}[c_p, c_q]$ for all pair of sequences $(s_p, s_q)$ and for all
    cut positions $c_p$ of $s_p$ and $c_q$ of $s_q$. The additional cost is defined
    as


    ```

    $C_{s_p,s_q}[c_p, c_q] = w_{opt}(s_p(\le c_p), s_q(\le c_q)) + w_{opt}(s_p(> c_p),
    s_q(> c_q)) - w_{opt}(s_p, s_q)$

    ```


    this is the extra cost of requiring the alignment of $s_p$ and $s_q$ to optimally
    align the two prefixes and suffixes rather than the sequences themselves. To extend
    the cut over all sequences, the additional cost is defined as:


    ```

    $C(c_1, c_2, \dots, c_k) = \sum_{1 \le p < q \le k} \alpha_{p,q} C_{s_p,s_q}[c_p,
    c_q]$

    ```


    where $\alpha_{p,q}$ is the dependent-weight factor. The dependent weight factor
    is computed using the sum-of-pair scores [70] to increase the weight (or score)
    of a matching of residues. It is defined as


    ```

    $\alpha_{p,q} = \begin{cases} 1 & \text{if maxScore = 0,} \ 1 - \frac{w_{opt}(s_p,s_q)}{maxScore}
    & \text{otherwise,} \end{cases}$

    ```


    where $minScore$ and $maxScore$ are the lowest and highest pair-wise scores of
    all the columns (positions) in the alignment of sequences $s_p$ and $s_q$ respectively,
    and $w_{opt}(s_p,s_q)$ is the optimal alignment score of $s_p$ and $s_q$ that
    is, score obtained by aligning the sequences via dynamic programming algorithm.


    The use of dynamic programming for aligning sequence fragments in DCA increases
    its processing exponentially preventing DCA to align more than few sequences (<8
    sequences). A faster version of DCA is FDCA [71], which approximates the cut positions
    to reduce DCA search space. The approximation is much larger than preempting a
    tuple of cutting whenever its partial sum is larger than the minimum found so
    far. This technique extends the capability of DCA up to 9 sequences.


    In general, the suboptimal heuristics often lead to unacceptable alignment results.
    Nevertheless, DCA is probably the closest algorithm that directly implements dynamic
    programming technique.


    # 5.2 PROGRESSIVE ALIGNMENT


    Progress MSA is introduced by Feng and Doolittle in 1987 [72]. The main idea is
    that a pair of sequences with minimum edit distance is most likely to originate
    from'
