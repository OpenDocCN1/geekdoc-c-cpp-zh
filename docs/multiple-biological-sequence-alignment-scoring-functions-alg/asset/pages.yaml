    # 5.2.3 PRIME: Profile-Based Randomized Iteration Method


    PRIME [77] is an extension of progressive alignment where input sequences are
    progressively aligned as Clust. Next, a distance matrix is generated from the
    multiple alignment result to construct a phylogenetic tree. A random branch of
    the tree is cut to partition the sequences in the alignment into two groups. Next
    Needleman-Wunsch’s dynamic programming is used to align these two groups – in
    this, two columns compared rather than two. This process is repeated until convergent,
    that is, no better alignment score found. In its earlier version, PRRN [78], affine
    gap penalty, and anchoring technique are employed. The anchoring technique keeps
    columns untouched during progressive alignment, and the group-to-group alignments
    are done on segments around the anchors.


    The group-to-group gap penalty is defined as


    ```

    $g(a_i, b_j) = \sum_{1 \le p \le m} \sum_{1 \le q \le n} w_{p,q}(-v).\gamma(a_{p,j},
    b_{q,j}),$

    ```'
