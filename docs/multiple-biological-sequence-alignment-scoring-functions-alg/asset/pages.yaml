    # 3.8.1 Valdar''s Method


    In 2001, Valdarn and Thornton [48] propose a scoring method to measure the conservation
    and the frequency of residues in a column as follows:


    > $S(x) = \lambda \sum_{i=1}^{n} \sum_{j>i}^{n} w_i w_j M(s_i(x)s_j(x)), \quad
    (3.17)$


    where $n$ is the sequence length and $\lambda$ scales $S(A)$ to range $[0,1]$,
    that is,


    > $\lambda = \frac{1}{\sum_{i=1}^{n} \sum_{j>i}^{n} w_i w_j}, \quad (3.18)$


    where $w_i$ is the weight of sequence $s_i$ such that


    > $w_i = \frac{1}{n} \sum_{j=1}^{n} d(s_i, s_j), \quad (3.19)$


    where $d(s_i, s_j)$ is the distance between sequence $s_i$ and $s_j$ and is calculated
    as


    > $d(s_i, s_j) = 1 - \frac{1}{n \times align_{ij}} \times \sum_{x \in align_{ij}}
    M(s_i(x), s_j(x)), \quad (3.20)$


    where $align_{ij}$ is the set of all positions that manifest an amino acid in
    one or both of $s_i$ and $s_j$, and $n \times align_{ij}$ is the size of this
    set.'
