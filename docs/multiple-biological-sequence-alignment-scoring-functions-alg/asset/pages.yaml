    The Total Column (TC) score calculates the percentage of residue similarity between
    the columns and their corresponding column in the reference alignment. The sum-of-pair
    scoring method measures the overall quality of each alignment by summing all pairwise
    scores of the residue symbols in each column, and the alignment score is the sum
    of all columns. Some commonly used matrix series are PAM [25] and BLOSUM [27].
    These scoring matrices are derived from the probability symbol being substituted
    by another based on either the residue physiochemical properties or their frequency
    in sequence databases.


    Unlike these scoring, the HEP [62] score builds a set coverage for all residue
    symbols from a pairwise scoring matrix, where each overlapping set is considered
    a tree node in the scoring tree as in Figure 8.2.


    To calculate the score of an alignment column, the HEP scoring method sums all
    matches of the scoring tree covering all residues in the column. Each tree node
    is 1 few the number of residues matching at that tree node raised to the power
    of the node cardinality and factored out by that node. The HEP column score is
    mathematically defined as


    ```

    cScore(i) = \left\{ \begin{array}{l} 0, & \text{if } i \ matches only at tree
    root, \ \frac{1}{(k-1)^f} \sum_{j=1}^{f} \log |T_{ij}| \frac{(count(node)-1)^{j}}{j}
    \end{array} \right. (8.3)

    ```


    The score (weight) of aligning column i of alignment p, p[i], and column j of
    alignment q, q[j], is the column score of column generated by merging all the
    residues in p[i] and q[j].'
