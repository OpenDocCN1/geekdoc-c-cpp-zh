    # 5.4.3 FAlign


    FAlign [105] combines both progressive and iterative refinement algorithms into
    MSA. This method requires users to identify and define the motif regions in the
    sequences. The sequences are split at the motifs'' boundaries across all sequences
    into segments, and each segment of the sequences is aligned progressively. The
    segments are assembled back after being aligned to generate an alignment. FAlign
    uses BLOSUM62 score matrix and sum-of-pair score. The last step of the algorithm
    is randomly and iteratively shifting the gaps and residues in nonmotif regions
    to improve the alignment score.


