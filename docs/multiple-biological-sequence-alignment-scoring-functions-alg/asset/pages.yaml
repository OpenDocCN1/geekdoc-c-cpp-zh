    \ Review of RNA SS Prediction Methods\n\nTwo main information types are used for\
    \ RNA SS prediction: evolutionary and thermodynamic information. Thus, the prediction\
    \ algorithms can be categorized into two groups: comparative methods and free\
    \ energy methods. The former makes predictions using the sequence families, and\
    \ the latter uses only a single sequence to make prediction. The main assumption\
    \ of comparative methods is the conserved patterns of base pairs, which is, pairs\
    \ will vary at the same time during evolution and maintaining structural integrity.\
    \ The comparison between the predicted results from experiments and comparative\
    \ models will be in the crystal structures. Comparative sequence analysis is able\
    \ to predict nearly 98% of pairings in the current comparative models and all\
    \ of the SS base pairs and even some tertiary pairs in crystal structures. Different\
    \ from the comparative methods, free energy methods, also known as single sequence\
    \ approaches, use one sequence to determine the structure of complementary regions\
    \ that are energetically stable. The working hypothesis of free energy method\
    \ is that the native SS is the one with the minimum energy. However, the computation\
    \ of free energy for a conformation is not accurate due to many factors, such\
    \ as the assumption of free energy additive, the absence of measured thermodynamic\
    \ parameters of noncanonical base pairs (like the wobble pairs), and sequence-dependent\
    \ loops. The single sequence approach is not as accurate as comparative approaches\
    \ because the information gathered from multiple sequences would be missing if\
    \ only from the single sequence [292]. In this section, we focus on topic of comparative\
    \ methods using MSA. The RNA SS prediction problem is defined as follows:\n\n\
    Problem (RNA SS Prediction Based on Multiple Homologous Sequences) Given a collection\
    \ of homologous sequences and a query sequence $\\alpha$, predict an SS of $\\\
    alpha$."
