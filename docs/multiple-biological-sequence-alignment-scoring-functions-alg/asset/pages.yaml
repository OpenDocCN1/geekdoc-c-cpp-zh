    # 5.2.1 Clustal Family


    The most popular program in this group is the Clustal family (including ClustX
    and Clustal(W) [55]. It is fast and relatively reliable. Similar to all other
    progressive programs, Clustal starts by pair-wise aligning all sequences via global
    DP with PAM250 or BLOSUM62 (or any substitution matrix chosen by the user). It
    guarantees that the distances between sequences are mathematically optimal. Clustal
    uses these pair-wise alignment scores to build a neighbor-joining tree (NJ) -
    the early version of Clustal uses UPGMA method. The sequences are aligned following
    the tree from the leaves inward. There are some parameters in Clustal that make
    it more sensitive than others the gap penalties. For example, Clustal assumes
    that short stretches of hydrophilic residues (e.g., 5 or more) is an indication
    loop or random coil regions that reduces the opening gap penalty for these stretches.
    Similarly, it increases the gap penalty for any gap that is less than 8 residues
    apart based the observation of alignments between sequences of known structures,
    which rarely has a gap within 8-residue sequences. The initial gap penalty is


    > $GOP + \log(n,m) \times s(a,b) \times ID\%$,


    where GOP is the user-defined opening gap penalty, $m$ and $n$ are sequence lengths,
    $s(a,b), a \neq b$ is the average mismatched score between two residues, and $ID\%$
    is the percentage identity scaling factor. ID\%$ is the ratio between the number
    of matched pairs over the total number of residue pairs.

    The extended gap penalty is defined as


    > $GEP \times \left(1.0 + |\log(\frac{n}{m})|right)\right)$,


    where GEP is the user-defined extended gap cost.


    # 5.2.2 PIMA: Pattern-Induced Multsequence Alignment


    PIMA [50, 76] applies the progressive technique to align protein sequences. The
    main difference between PIMA and other algorithms is the generation and usage
    of sequence patterns to align groups of sequences from the internal nodes of the
    tree. Initially, PIMA performs pair-wise local DP on input sequences to obtain
    a distance matrix between all. The dendrogram (guiding tree) is then built from
    the distance matrix using WPGMA method [60] (weighted pair group method using
    arithmetic averaging). PIMA then progressively aligns pairs of sequences from
    the leaf level of the tree. A sequence pattern is generated for each pair-wise
    alignment using the amino acid class covering (AACC) to represent the residues
    in each column. Thus, aligning any two nodes in PIMA is always a pair-wise alignment
    of two sequences; either they are the actual input sequences, a sequence and a
    pattern,'
