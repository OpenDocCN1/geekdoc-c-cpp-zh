    RNA, and signal recognition particle RNA (SRP RNA) [279]. In a cell, the functions
    of different RNAs differ widely from each other. In instance, all organisms use
    the mRNA in protein synthesis; some viruses use RNA as genetic material instead
    of DNA; incompletely processed involve small nuclear RNAs (snRNA) to become mature
    mRNAs. As the close connection between the RNA structure and its function, we
    can have more precise understanding of RNA functions with more accurate prediction
    of its structure. To computationally predict RNA SS accurately is an important
    and difficult task. Both crystal and experimental structures confirmed that RNA
    SSs can be predicted accurately using merely primary sequence since the structure
    of RNA is usually more evolutionary conserved than primary sequence [280].


    Due to the similar relation between the RNA function and its structure, accurate
    protein SS is also essential for almost all theoretical and experimental studies
    on protein. Genome sequencing makes a tremendous amount of amino acid sequence
    data available, while the structural information is much harder to obtain experimentally.
    The gap between the number of known protein amino acid sequences and the number
    of structures in the Protein Data Bank (PDB) [281] rapidly increases. With the
    completion of many large-scale genome projects, the rapidly growing protein sequences
    require more and more structure predictions. Understanding protein structure is
    crucial for analyzing protein function and applications as drug design. Understanding
    complex dependency between protein sequence and structure is another great challenge
    in computational biology [282]. It is widely accepted that the amino acid sequence
    contains sufficient information to determine the 3D structure of a protein, but
    it is extremely hard to predict 3D protein structure based on the primary sequence.
    Although the prediction of the 3D structure is one of the ultimate goals of protein
    science, the prediction of protein SS from sequences remains a feasible intermediate
    step in this direction. Protein SS prediction is not as difficult as 3D structure
    prediction, and it offers valuable information for further elucidating the 3D
    structure of the protein. The protein SSs define the key structural elements of
    the protein and the location of these elements in the protein amino acid sequence.
    In this chapter, we start with the definitions of essential elements in RNA and
