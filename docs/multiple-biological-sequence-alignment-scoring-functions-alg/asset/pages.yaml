    # 5.3 CONSISTENCY PROBABILISTIC MSA


    Hidden Markov models (HMMs) are used as a statistical model of the sequence primacy
    structure consensus in [82, 83]. The probability that a region being a codon is
    calculated as


    ```

    Prob(c_1 · c_k) = \prod_{i=1}^k p(c_i)

    ```


    where p(c_i) is the probability of codon c_i. The codon probability is the relative
    frequencies of the 64 codons from a DNA sequence database. HMM is a finite state
    machine with (A, B, Π); A is the transition probabilities, B is the output probabilities,
    and Π is the initial state probabilities. For any given time t ≥ 1, A, B, and
    Π are defined as follows:


    +   A = {a_{ij} = P(q_j at t+l|q_i at t)}, where P(a|b) is the conditional probability
    of a given b ≥ 1 is time, and q_i ∈ Q.

    B = {b_{ik} = P(o_k|q_i)}, where o_k ∈, that is, B is the probability that the
    output o_k with given state q_i, and Π is calculated as


    ```

