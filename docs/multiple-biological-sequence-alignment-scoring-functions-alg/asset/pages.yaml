  md: '# PROTEIN SECONDARY STRUCTURE PREDICTION BASED ON MSA 191


    network. Bayesian network is a probabilistic graphical model that represents a
    set of random variables with their conditional dependencies. An artificial neural
    network models the brain-receiving inputs that are processed with the influence
    of weights to become output. A consistently updated list of protein SS can be
    found in the Wikipedia (https://en.wikipedia.org/wiki/List_of_protein_secondary_structure_prediction_programs).
    Early methods for the prediction of protein SS utilized the propensities from
    a single amino acid, that is, residues tend to be in a particular SS state than
    other residues [317]. Recently, machine learning techniques are trained with sequence
    profiles or SS information of resolved structures to achieve better prediction
    accuracy. Given a query sequence, the most common way to collect the sequence
    profiles is using the position-specific score matrix (PSSM), which is generated
    by PSI-BLAST [318]. In the following section, we first introduce how PSI-BLAST
    generates the PSSM, and then we discuss recently proposed approaches to illustrate
    the strategies about how to incorporate the PSSM into the protein SS prediction.


    # 11.3.1.1 PSI-BLAST Altschul et al. [318] proposed the Position-Iterated BLAST
    (PSI-BLAST) program for automatically combining significant alignments by BLAST
    INTO and for searching the database using this matrix. The PSSM is a popular representation
    of patterns in biological sequences, which has been used as an important feature
    in the classification of SS prediction. The PSSM makes multiple sequence alignments
    be represented as easily as the mathematical entities. There are several ways
    to construct a PSSM, but the best way is using the log-odds method in analogy
    to how the substitution matrices are made. Given a set of aligned sequences, the
    frequency of each type of amino acid that has occurred at each position is denoted
    as $m_{u,a}$. The general frequency of amino acid $a$ among sequences is denoted
    as $p_a$. Let $m_{u,a}$ be the PSSM score used for amino acid $a$ in the column
    $u$


    ```

    $m_{u,a} = log \frac{m_{u,a}}{p_a}$. It is also possible to weight the scores
    to compensate for the bias in the original sequence selection. To use the PSSM,
    we need to specify a sliding window along the target sequence. At every position,
    a PSSM score is calculated by summing the scores of all columns, and the highest
    scoring is reported.

    ```


    PSI-BLAST is performed in five steps: (i) search a query against the protein database;
    (ii) construct a multiple sequence alignment with the search result and create
    the specialized PSSM; (iii) use the PSSM as a query against the database; (iv)
    estimate the statistical significance as E values; (v) repeat steps 3 and 4 iteratively
    until converge or hit a user-defined value, and update the PSSM as the new query
    for each search.


