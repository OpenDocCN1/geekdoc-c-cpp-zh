    # 6.2 PHYLOGENY CONSTRUCTION


    The main purpose of a phylogenetic tree is to depict the evolution of the organisms.
    Thus, correctly reconstructing the evolution and representing it as a phylogenetic
    tree is a critical task. As seen in Chapter 4, a phylogeny can be constructed
    from pairwise alignments via identity and similarity scores. A phylogeny is represented
    as a root-tree or an unrooted tree. In the rooted tree, the root is the common
    ancestor of all Operational taxonomic units (OTUs) that are being studied. A path
    from the root to a nodes defines an evolutionary path.


    In the unrooted tree, the relationships between OTUs are depicted, the evolutionary
    paths are not specified. Both the rooted and unrooted trees can be transformed
    from one to the other. For example, the unrooted tree (b) in Figure 6.2 can beformed
    into a rooted tree by making node Seq2 the root. It is a common practice that
    each branch in the phylogenetic tree has two descendants if it is rooted or three
    neighbors if it is unrooted. This hierarchical structure is the result of the
    rarity of the same and synchronous evolution rate observed in organisms, (otherwise,
    there is no divergence). Phylogenetic reconstruction is well supported by the
    scientific communities. There are large numbers of available software packages
    that are designed to create phylogenetic trees. A comprehensive list of phylogeny
    is maintained by the Department of Genome Sequences at the Washington University
    http://evolution.washington.edu/phylip/software.html. Phylogenetic trees are usually
    generated by the distance methods or character-based methods


