    known variants can be embedded into the target genomes. Numerous sequencing read
    simulators have been developed, and we list some popular ones in Table 10.2. When
    simulating short reads, these simulators use two error models, which are the empirical
    and the theoretical models. Some simulators also use the base quality (BQS) to
    simulate the sequence data sets.


