    This process is repeated until more clusters are found. The remaining nonclustered
    sequences are grouped into a special cluster. The (ii) condition extends the cluster
    membership to a sequence with low score but share a highly conserved segment to
    join a cluster. However, this is an exclusive relationship, and a sequence can
    only be a member of one cluster. The cluster overlap reducing step enforces this
    requirement. This fast technique has a run-time complexity of O(kn), where $n$
    is the number of sequences to be clustered and $k$ is the number of clusters.


    Example: Consider sequence set $S = \{A, B, C, D, E, F, G, H, I\}$, threshold
    $g = 7$, and the following sequence matrix:


    | A | B | C | D | E | F | G | H | I |

    |---|---|---|---|---|---|---|---|---||

    | B | 11 | | | | | | | |

    | C | 5 | 4 | | | | | | |

    | D | 9 | 8 | 7 | | | | | |

    | E | 7 | 5 | 5 | 2 | | | | |

    | F | 6 | 7 | 2 | 1 | 9 | | | |

    | G | 6 | 4 | 4 | 8 | 10 | 8 | | |

    | H | 5 | 6 | 3 | 9 | 13 | 9 | 8 | |

    | I | 9 | 8 | 1 | 9 | | 7 | 7 | 6 |


    The first iteration starts with $C = \{E,H\}$ for $(E,H) = 13$ is the highest
    score. A breadth first search (BSF) for C adds $\{E,G\}$, $\{E,F\}$, and $\{H,D\}$
    by following E and H, respectively. Thus, we will have a cluster of $\{D,E,F,G,H\}$,
    $S = \{A,B,C\}$, and $F = \{D,E,F,G,H\}$.


    The second iteration starts with $C = \{A,B\}$ for $(A,B) = 11$ is the highest-score
    in this iteration. A BSF from C adds $\{A,I\}$ and $\{D,I\}$. Thus, $S = \{C\}$.


    Since there is the only sequence left in $S$, the algorithm terminates with three
    clusters $\{A,B,D,I\}$, $\{D,E,F,G,H\}$, where sequence $D$ is a member of two
    clusters.


    If we enforce the condition that a new member must have all relationships to all
    other members in the cluster greater than the threshold, then D would be disjoint
    from the first cluster. This condition increases the run-time complexity of the
    algorithm; however, it strengthens the relationships in each cluster, where members
    are closer. In the worst case where all $n$ sequences overlap in $n$ clusters,
    the run-time complexity of this clustering algorithm is $O(n^3)$. Hence, the run-time
    complexity of the phylogeny estimation is $O(n^4)$.'
