    the measurement often relies on the information of the primary sequence. In general,
    the measurement is focused on four features: sequence similarity, homology, divergence,
    and convergence. These features involve the sequences and their structures and
    functionalities.


    The simplest of the four is the similarity between sequences. For any given set
    of sequences, a statistical analysis of sequence similarity can be derived from
    the number of common nucleotides in the sequences. However, this measure has limited
    used for the randomness involved. For example, finding a high'
