    the best opportunity to find variants accurately, assembling short reads in an
    enormous amount is a computationally challenging problem that requires significant
    resources. Read-split approaches achieve a high degree of accuracy for variants
    with medium sizes, but the performance drops significantly as the size of the
    variations increases. Coverage depth methods often fail in calling small indels
    due to the inaccurate breakpoint prediction. The mapping for read splitting and
    analyses on depth coverage requires the short sequencing read data, which is sometimes
    not available or may be normally larger than the genomes themselves and become
    a computational cost. Mapping accuracy can also be messed up by unexpected results,
    such as repetitive sequence, and misalignment low complexity. Therefore, we still
    need more sophisticated inference models and more accurate and longer sequenced
    reads to make better variant calls.


    Another challenge in variant calling development is the lack of gold standard
    samples or controls to benchmark calling results, especially for the somatic CNV
    detection [275]. Although some NGS-based benchmarks, including in silico simulated
    data or variant callers on the same set of tumor samples, have been applied to
    evaluate the published somatic CNV detection programs, the generality of these
    benchmarks is not clear yet. Several simulators such as ART, GemSIM, PIRS, and
    RVSim, have been proposed to simulate NGS data with consideration of reproducing
    biases from experimental platform-dependent errors and sequence context, we still
    need a comprehensive simulator that is able to capture all the features of the
    genome, especially for the tumor. In the meantime, array-based platforms and calling
    algorithms still lack reproducibility and concordance based on the recent assessment.
    Without a well-controlled and annotated reference benchmark, it will be hard to
    understand the advantages and disadvantages associated with each approach. As
    a result, the choice of NGS-based variant callers relies more on technique descriptions
    rather than their performances on a standard benchmark. Therefore, it is necessary
    and urgent for the community to lay down better data sets as a benchmark, which
    for comprehend the complexity of human genomes, for the performance estimation
    and the improvement development.'
