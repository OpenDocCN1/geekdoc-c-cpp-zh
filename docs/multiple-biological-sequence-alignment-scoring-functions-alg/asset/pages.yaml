  md: 'The gap penalty is an experimental value, depending on each specific MSA algorithm,
    and often left to biologists to decide. Gaps are artificial, quantifying a match
    between a residue and a gap is biologically meaningless. Thus, quantifying methods
    that focus on the available information in the aligning sequences such as known
    motifs and residue location and mutation constraints are preferable.


    # 3.3.1 Sequence Distances


    All of the above-mentioned matrices serve only one purpose, that is, how measure
    a match between two residue symbols. Almost all sequence analysis depends on some
    value that represents the distance or the relatedness between two or more sequences,
    not the residues themselves. In some sequence alignment, a pair of sequences have
    the same lengths after being aligned. Since a pair of aligned sequence is a pair
    of two strings, there are two approaches to measure the sequence distance. A simple
    and natural approach is to sum all scores of each pair. If the score is the identity
    score, that is, 1 for matched and 0 for unmatched, then is the edit distance,
    or Hamming distance. Edit distance is the number of positions at which the corresponding
    symbols are different, that, the number of substitutions must be done to transform
    one sequence into the other. The drawback of this method is that the biological
    significance of the sequences is simply ignored, which could lead to errors in
    sequence classification. If a substitution or mutation matrix is used, the score
    then represent the component of biological measurements of all the residues in
    the alignment. These scores are often called the sum-of-pair-score(SP) [35]. Mathematically,
    sum-of-pair-score is defined as follows:


    **Definition 1** The pairwise alignment score of two induced sequences $s''_i$
    and $s''_j$ where $s''_i, s''_j \in A$ is $S(s''_i, s''_j) = \sum_{k} S(s''[k],
    s''[k]).


    A is the alignment of sequences $S_i$ and $S_j$, $|A|$ is the total length of
    the alignment, $S(s''[k], s''[k])$ is a matching score obtained from scoring matrix,
    and $s''_i$ are the residue symbols in the aligned sequences $s_i$ and $s_j$ (i.e.,
    the sequences with gap (- inserted), respectively.


    # 3.3.2 Example


    Given the following sequences to be aligned:


    +   S1: MTEITAAM and

    S2: MILIAM.


    After being aligned, a gap is inserted into the second sequence between I and
    A. The edit distance scoring scheme gives a score of 3, and the scheme using BLOSUM62
    matrix gives a score of 8 (assuming the gap-mismatch is -9). Figure 3.3 illustrates
    these scores.'
  merge: -1
