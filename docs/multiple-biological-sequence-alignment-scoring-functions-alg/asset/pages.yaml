  md: '# EVALUATION METHODOLOGY


    target method and labels from the ground truth. There are four basic combination
    labels for the reported variants: true positive (TP), true negative (TN), false
    positive (FP), and false negative (FN). We use TP, TN, FP, and FN to denote the
    denoters of variants falling into the corresponding categories. Here, we list
    the definitions and meanings for seven commonly used metrics:


    +   - Accuracy


    $$Accuracy = \frac{TP + TN}{TP + FP + TN + PN}$$\quad (10.1)$$n

    It is the ratio of the correct calls to the total number of positions.


    +   - Specificity


    $$Specificity = \frac{TN}{TN + FP}$$\quad (10.2)$$n

    It is the ratio of the nonvariant calls to the total number of nonvariant positions.


    +   - Sensitivity


    $$Sensitivity = \frac{TP}{TP + FN}$$\quad (10.3)$$n

    It is the ratio of the variant calls to the total number of variant positions.
    It is also known as recall, true-positive rate (TPR), or positive call rate.


    +   - Precision


    $$Precision = \frac{TP}{TP + FN}$$\quad (10.4)$$n

    It is the ratio of the correct variant calls to the total number of variant calls.
    It is also known as positive predictive value (PPV).


    +   - F1-score


    $$F1-score = 2 \frac{Precision \times Sensitivity}{Precision + Sensitivity}$$\quad
    (10.5)$$n

    It is interpreted as a weighted average of the precision and sensitivity, where
    1 is the best score and 0 otherwise.


    +   - ROC

    It is a graphical plot deoting by plotting the TPR against the false-positive
    rate at multiple threshold. It demonstrates the performance of a binary classifier
    system when we alter its discrimination threshold.


    +   - Jaccard index


    $$J(A,B) = \frac{|A \cap B|}{|A \cup B|} \quad 0 \leq J(A,B) \leq 1.$$$


    It is also known as Jaccard similarity coefficient, and A and B are two finite
    sets of the variant calling results. Jaccard index is a measurement of the similarity
    between two predicted variant sets. When two sets are the same, the Jaccard index
    is 1; when two sets are completely different, the Jaccard index is 0.


