    # 4.1 UNWEIGHTED PAIR GROUP METHOD WITH ARITHMETIC MEAN – UPGMA


    Similar to all other methods, unweighted pair group method with arithmetic mean
    (UPGMA) requires the knowledge of the distances between all taxonomies, sequences
    in this case. These distances naturally come in the form of a matrix. UPGMA uses
    the distance matrix to construct a phylogenetic tree or evolutionary tree. In
    general, each sequence is treated as Operational Taxonomic Unit (OTU). UPGMA starts
    with two closest OTUs and combines them to build a new OTU. The distances between
    all other OTUs to the new OTU are recalculated. The new distances are arithmetic
    means between the OTU and all the members of the new OTU. This process is repeated
    until all OTUs are merged. Example: Consider four sequences A, B, C, D and their
    distance matrix $d$.


    | | A | B | C | D |

    |---|---|---|---|---|n| A | | 0 | | | |

    | B | | 7 | | |

    | C | | 11 | 6 | 0 |

    | D | | 14 | 9 | 7 | 0 |'
