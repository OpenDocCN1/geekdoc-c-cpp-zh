    # 5.1 DYNAMIC PROGRAMMING


    MSA algorithms in this group are extensions of dynamic programming.


    # 5.1.1 DCA


    Divide and Conquer multiple sequence alignment (DCA) algorithm is designed by
    Stoye [54] for his dissertation. The basic idea of DCA is rather simple: each
    sequence is split into two subsequences at location near the midpoint. The splits
    partition the problem into two sub-MSA problems with shorter sequences. This process
    is repeated until the sequences become sufficiently short, that is, shorter than
    a predefined threshold L. These multiple sequence alignments are then optimally
    aligned by dynamic programming method. The alignments of these subproblems are
    concatenated yielding an MSA for the original sequences. This algorithm is illustrated
    in Figure 5.2.


    ![](img/c2ce4992087205b6ef559b10db163265_85_0.png)


    **Figure 5.2** Illustration of the divide and conquer multiple sequence alignment
    (DCA).'
