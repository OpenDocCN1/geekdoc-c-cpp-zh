    GA-Forest Lin et al. [295] developed a permutation-based genetic algorithm, which
    combines the minimum free energy model with the similarity information from the
    homologous sequences to improve the RNA prediction. We name our method GA-Forest,
    which has three major steps: preprocessing, GA, and postprocessing. Since the
    genetic algorithm starts with the permutation, in the preprocessing, GA-Forest
    finds out all the possible stems from the RNA primary sequences and orders them
    as the permutations. Each permutation has the position and length information
    obtained by comparing to the reference. In the second step, GA-Forest iterates
    crossover, mutation, and selection using the free energy as the fitness function
    until reaching the structural stability criteria. The mutation operation is implemented
    by randomly switching positions of two stems. In the postprocessing, GA-Forest
    tries to find the most similar structures. In order to compare the similarity
    for RNA SSs, each SS is represented by only one Hochmann''s forest [308]. After
    computing the similarity of these forests and the reference or consensus structure,
    GA-Forest selects the structure, which has the highest similarity score and output
    it as the predicted SS.


