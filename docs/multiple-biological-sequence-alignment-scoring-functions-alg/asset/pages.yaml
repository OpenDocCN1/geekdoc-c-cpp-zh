  md: '# PHYLOGENY IN MULTIPLE SEQUENCE ALIGNMENTS


    # 6.3 INFERRING PHYLOGEN FROM MULTIPLE SEQUENCE ALIGNMENTS


    Most MSA algorithms rely on the phylogeny tree constructed by pairwise alignment
    to guide the assembling of the alignment. However, the phylogeny is also benefited
    from the result alignment.


    Majority of alignment algorithms employ certain levels of refinement to improve
    the overall alignment score. Refinement steps may change the order of the sequences
    in the pairwise alignment generated guiding tree. Moreover, biologists align multiple
    sequences to systematically identify some common regions in the sequences that
    are tedious and time consuming for human to manually. When reviewing the multiple
    alignment result where these sequences are lined up, the experts often intervene
    to analyze, correct, and annotate these regions, thus changing the weight of each
    OTU. Additionally, existing large sequence knowledge databases such as GenBank,
    European Nucleotide Archive, DNA Data Bank of Japan, and secondary databases such
    as UniProt, Swiss-Prot, and TrEMBL allow sequences to be cross-referenced easily
    to identify their family classification and possibly primary and secondary structures.


    When a new sequence of a species is assembled and ready to add into the sequence
    databases, BLAST is often employed to search across existing sequence databases
    to identify the set of sequences that share the most similarity with the new sequence.
    These matching sequences are aligned with the new sequence to identify similar
    functional regions. Information from secondary structural databases can be used
    to annotate the sequence further, and expert will verify the classification of
    the sequence before having it indexed within the appropriate family in the database.
    With the vast available sequence knowledge bases, MSA and phylogeny reconstruction
    are often more biologically precise with algorithms that utilize these knowledge
    bases in their process.'
