    In the 1990s, the National Center for Biotechnology (NCBI), which houses the GenBank
    and genome sequencing data, defined a standard to uniquely identify the sequence.
    The header of the sequence should include a unique sequence identification. Figure
    1.5 shows some headers used by different groups.


    Sequences with feature formats also feature data of the sequence to be included.
    Figure 1.6 shows a segment of sequence represented in GenBank sequence format.
    It includes almost everything about the sequence such as the authors of the sequence,
    the sequence itself, the journal in which it is published, and so on.


    The alignment sequence formats as GCG, MSF, Clustal, Phylis, and so on are used
    to represent sequence alignments. These formats preserve the actual alignment
    of the sequences making it easier for visual inspections. For example, Figure
    1.7 shows two sequences in Phylis and Clustal formats.


