    We will have to score 15 residue pairs: (A, C), (A, T), (A, G), (A, T), (A, T),
    (C, T), (C, G), (C, T), (C, T), (T, G), (T, T), (T, G), (G, T), (G, T). Since
    the matching between residue $b$ and residue $a_i$, these pairs become (A, C),
    3(A, T), (A, G), 3(C, T), (C, G), 3(G, T), 3(T, T). These redundancies occur once
    the set of residues represents itself 1 [for gap two or 4 for DNA/RNA]. Thus,
    if we combine the two column symbols with their number of occurrences, the sum-of-pair
    method can be transformed into a counting problem and can be defined


    ```

    $sp(f, g) = \sum_{i=1}^{T} \frac{n_i(n_i-1)}{2} + n_i \sum_{j=i+1}^{T} n_j \times
    s(i, j), \quad (7.2)$

    ```


    where $f, g$ are the two columns, $T$ is the number of different residue symbols
    ($T=4$ for DNA/RNA and $T=20$ for proteins), $s(i, j)$ is the pairwise matching
    score, or substitution score, between residue symbols $i$ and $j$, and $n_i$ and
    $n_j$ are the total count of $i$ and $j$ (the occurrences of residue symbols $i$
    and $j$), respectively. Since $T$ is constant, the summations in Equation 7.2
    remain constant, regardless of how many sequences are involved.


    The sum-of-pair of the two columns can be given above


    ```

    $\frac{3(T-1)}{2}s(T, T) + [s(A, C) + s(A, G) + 3s(A, T) + s(C, G) + 3s(C, T)
    + 3s(G, T)].$

    ```


