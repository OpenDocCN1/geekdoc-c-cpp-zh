  md: 'meaning alignment. In these cases, the local DP alignment, which is proposed
    by Smith and Waterman, identifies the longest segment pair that yields the best
    alignment score that is more preferable. In the Smith–Waterman''s algorithm, the
    longest segment pair between two aligning sequences yields the optimal alignment
    is identified by comparing all possible segments of lengths between the two sequences.
    The main difference between this technique and Needleman–Wunsch''s is that negative
    scores are set to zeroes. This modification produces an alignment score with positive
    scores. Thus, the backtracking procedure of the algorithm starts at the highest
    score cell and proceeds until it encounters a cell with zero. The longest segment
    pair identified in these backtracking steps is the optimal scored alignment of
    the two sequences.


    Let two sequences $a$ and $b$ be of lengths $m$ and $n$, respectively. The alignment
    matrix score $H$ is built as follows:


    ```

    $H(i,0) = 0, \le i \le m,\nH(0,j) = 0, \le j \le n,$$\nH(i,j) = \max \begin{cases}
    H(i-1, j-1) + w(a_i, b_j) & \text{Match/Mismatch}\\ H(i-1, j) + w(a_i, -) & \text{Deletion}\\
    H(i, j-1) + w(-, b_j) & \text{Insertion} \end{cases}\n1 \le i \le m, 1 \le j \le
    n,$

    ```


    where $a_i$ is the $i$-th symbol in sequence $a$, $m = |a|$ is the length of $a$,
    $n = |b|$ is the length of $b$, $H(i,j)$ is the maximum similarity score between
    the subsequence of $a$ of length $i$, and the subsequence of $b$ of length $j$,
    $w(c,d), c,d \in \Sigma$ is the matching score between two residues.


    The backtracking steps in Smith–Waterman are similar to those of Needleman–Wunsch''s;
    it starts from the matrix cell with a maximum score. Using the same example 2.3.2
    with the scoring scheme, +1 for a match, –2 for a gap, and –2 for a mismatch,
    we get a local alignment of ATTC as in Figure 2.7. It is important to note that
    the backtracking will trace the paths that lead to the highest score; therefore,
    the alignment of “A” to “A” from the fifth row and fourth column (as in Figure
    2.7) is not one of these paths.


    To align sequences that share multiple conserved regions (motifs), the Smith–Waterman''s
    algorithm can be repeated on the nonaligned segments until all residues are aligned.
    However, this technique is time consuming and does not guarantee an overall optimal
    alignment.'
