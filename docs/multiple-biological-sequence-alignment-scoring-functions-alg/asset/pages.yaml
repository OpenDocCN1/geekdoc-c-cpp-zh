    \ 0$. This probability decreases exponentially as the number of aligning sequences\
    \ increases. Consequently, the scoring function should reward aligned columns\
    \ proportionally with the matching matching probability.\n\nThe Hierarchical Expected\
    \ Matching Probability (HEP) [49] is a scoring method that utilizes the Amino\
    \ Acid Covering Hierarchy (AACCH) used in Smith and Smith's PIMA scoring to calculate\
    \ the probability of residues being aligned in a column as seen in Figure 3.9.\
