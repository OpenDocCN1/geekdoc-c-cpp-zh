    **Figure 3.3** Shows the score by (a) edit distance and (b) BLOSUM62 matrix.


    All of these scoring schemes are only applicable to a pair of residues. The next
    section, we will investigate other scoring schemes for groups of more than two
    residues.


    # 3.4 SCORING MULTIPLE SEQUENCE ALIGNMENTS


    Aligning and scoring two sequences are quite primitive with these available substitution
    matrices and pairwise alignment algorithms. However, when more than two sequences
    are involved in an alignment, it opens up an entire world of ambiguity. There
    is no concrete biological information to help identifying the probability of k
    residues mutated to each other at any sequence site. Without these measurements,
    it is hard to determine whether an indel (insert/delete) would improve or worsen
    the alignment of the sequences. And without such measurement, it is hard to determine
    which alignment of the same set of sequences is the best. Figure 3.4 illustrates
    this, where two preassembled alignments are being aligned together. Each column
    contains more than one residue symbol, and when matching one against another it
    requires a quantitative method to indicate which combination is the best.


    One of the simplest methods is the column score, which is similar to the identity
    score. This method rewards a score of 1 for a column with the same residue symbols
    and 0 for containing any divergent symbols. This method does not have any practical
    use except for detecting conserved columns in an alignment. In this section, we
    will explore alternative methods that have been developed to quantify multiple
    sequence alignment (MSA).


    # 3.4.1 Sum-of-Pair Score


    One of the most popular quantitative measurement for MSA is the sum-of-pair score,
    or simply sum-of-pair (SP). It comes with many variations as in [35–37]. To calculate
    the SP score of n sequences, the scores of all $n$ pairwise alignments


    ```

    A1: AACAACT

    AATG-CT

    A2: GACAACT

    GATG-CT

    ```


    **Figure 3.4** Illustrates the steps in assembling an MSA.'
