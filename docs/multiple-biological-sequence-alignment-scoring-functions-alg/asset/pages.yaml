    H state; $len(\bullet)$ is the number of amino residues in the sequence. Usually,
    the measurements mentioned earlier are scaled in the percentage representation.


    # 11.3.2.2 Benchmark Database Resources The performance of various prediction
    programs depends on the test databases and on the protein sequence data sets for
    which the predictions are made. There are some traditional public benchmarks for
    protein structure prediction, such as CB5153, Carugo338, and CASP9 targets. We
    briefly introduce these public benchmarks as follows:


    +   * CB5153. This data set includes 153 nonredundant domains, which was collected
    by Cuff and Barton in 1999. It has been frequently used to evaluate protein prediction.
    It can be freely accessed at http://chem.nottingham.ac.uk/dissolved/data-sets/CB5153.

    * Manesh data set, also known as Manesh215, consists of 215 nonhomologous protein
    chains with less than 25% pairwise sequence similarity. The data set is available
    at http://www.rtc.iken.jp/~netasa/rvp-manesh-215/.

    * CASP, that is, Critical Assessment of protein Structure Prediction, starting
    from 1994, is a community-wide and worldwide experiment for structure prediction
    performed every 2 years. It is freely available at http://predictioncenter.org/casp9/targetlist.cgi.

    * SCOP, that is, Structural Classification of Proteins, is a manually curated
    ordering of protein structural domains. Up to November 2015, the latest version
    of SCOP is 1.75 with 38221 PDB entries. The database is publicly accessible at
    http://scop.mrc-lb.cam.ac.uk/scop/

    * ASTRAL. The ASTRAL comp provides databases and tools useful for analyzing protein
    structures and protein sequences. Its current version is 2.05, released on February
    5, 2015. It is freely available at http://astral.berkeley.edu/


    # 11.4 CONCLUSION AND FUTURE WORK


    In this chapter, we briefly introduce two MSA-based applications, RNA and protein
    SS predictions. The key idea behind MSA-based RNA prediction is the conserved'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# CONCLUSION AND FUTURE WORK


    patterns of base pairs inferred from a collection of homologous sequences, that
    is, some base pairs tend to vary at the same time during evolution for maintaining
    structural integrity. In general, MSA provides three types of information, that
    is, mutual information, covariation information, and phylogenetic information.
    Regarding the order of alignment and folding processes in RNA SS prediction, the
    computational approaches are classified into three categories: Prior Aligning
    Ulterior Folding Method, Simultaneously Folding and Aligning Method, and Prior
    Folding Ulterior Aligning Method. We use distinct approaches falling into these
    three groups to demonstrate the fundamental strategies of alignment and folding
    based on MSA. Although protein does not exactly the same variation pattern of
    base pairs as in RNA prediction, some studies showed that the SS state of the
    amino acid residue is significantly affected by the pattern of adjacent residues.
    Due to fact, many modern methods for SS prediction have been extensively studied
    using machine learning approaches, such as support vector machines, hidden Markov
    models, and neural networks, which often utilize the PSSM generated from MSA as
    a significant indicator. We introduced the PSI-BLAST and how to use PSI-BLAST
    to create PSSM, and then employed three proposed machine learning approaches to
    utilize to incorporate the information from PSSM when predicting SSs. For the
    quality assessment of these two MSA applications, we provide a list of evaluation
    metrics and available benchmarks freely available on the Internet.


    For the RNA SS prediction, the computational cost for the second-type methods,
    that is, Simultaneously Folding and Aligning Method, is still a big computational
    challenge, although various techniques for reducing the computation time have
    developed. More efficient algorithms that mature computing techniques, such as
    cloud computing, are needed. Despite the difference of protein prediction methods,
    the cross-validated 80% accuracy barrier is still present and has not yet been
    overcome. Kihara [329] pointed out the importance of long-range interactions on
    the formation of protein SS. We argued that as SS predictions are based on a sliding
    window, the long-range effects not only on $\beta sheets but even on helices will
    be in a limited manner. On nonsiding-window-based methods could make progress
    in SS prediction with innovative machine learning strategies such as hierarchical
    memory, deep neural networks, and computational biology thinking. Therefore, the
    future direction of secondary structure prediction could be an empirical approach
    to the utilization of a group of techniques to include most if not all aspects
    of machine learning. Lastly, novel applications of other machine learning techniques,
    such as graph theory, data visualization, and biomedical framework, along with
    silico simulation and even DNA computing, promise to give rise to the eventual
    vision of routine tertiary and even quaternary protein structure prediction. Perhaps
    these techniques field of “biomolecular intelligence,” where molecular biology
    and machine learning converge and become one discipline.'
