    # 11.3.2 Measures of Quality of Protein SS Prediction


    11.3.2.1 Performance Metrics We assess the quality of protein SS prediction at
    two levels, which is the residue level and the segment level. To calculate any
    metrics at these levels, we need the numbers of residues in a native SS state
    with the prediction in state $j$. If we aim at three-state prediction, $i$ and
    $j$ are in a set $S$ of {helix H, strand, coil C}. $N_{ij}$ represent these numbers.
    Six residue-level measures commonly used are defined as follows:


    ```

    $Q_{Hpre} = \frac{N_{HH}}{\Sigma_{i}N_{iH}}, Q_{Epre} = \frac{N_{EE}}{\Sigma_{i}N_{iE}},
    Q_{Cpre} = \frac{N_{CC}}{\Sigma_{i}N_{iC}}, Q_{Hobs} = \frac{N_{HH}}{\Sigma_{j}N_{Hj}},
    Q_{Eobs} = \frac{N_{EE}}{\Sigma_{j}N_{Ej}}, Q_{Cobs} = \frac{N_{CC}}{\Sigma_{j}N_{Cj}}$

    ```


    $Q_{Hpre}, Q_{Epre}, Q_{Cpre}$ measure the percentages of correctly predicted
    helix, strand and coil residues. Similarly, $Q_{Hobs}, Q_{Eobs},$ and $Q_{Cobs}$
    measure the percentages of correct helix, strand, and coil predictions among all
    native helix, strand, and coil residues, respectively. Another commonly used parameter
    measuring the accuracy is the parameter $Q_3$, which quantifies the overall rate
    of correct predictions for three SS states. If the helix prediction errors, $Q_{HEerror}$
    is applied when a native helix is predicted as a strand and vice versa.


    ```

    $Q_3 = \frac{\Sigma_{ij}N_{ij}}{N}, Q_{HEerror} = \frac{N_{HE}+N_{EH}}{N}$

    ```


    where $N$ is the total number of residues in the protein sequence.

    For the segment level, we use the segment overlap (SOV), which is an average overlap
    between the observed and predicted segments. $SOV$ contains the predicted helix
    $(SOV_H)$, coil $(SOV_C)$ segments, and $SOV_3$, which is similar to the $Q_3$,
    is the sensitivity measurement.


    ```

    $SOV_H = \frac{1}{N_H} \sum_{S_h} minOV(s_1, s_2) + \delta(s_1, s_2)$,$\nSOV_3
    = \frac{1}{N} \left( \sum_{i \in S_i} \left( \frac{minOV(s_1, s_2) + \delta(s_1,
    s_2)}{maxOV(s_1, s_2)} \right) \times len(s_2) \right)$

    ```'
