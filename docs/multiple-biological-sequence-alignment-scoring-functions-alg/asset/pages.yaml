    # 3.9.7.4 Implementation of HEP Scoring Method in Progressive Sequence Alignment


    The benchmark test results suggest that HEP scoring is more sensitive and reliable
    than other methods. To further confirm that HEP can improve MSA results, we have
    implemented HEP in a progressive MSA, which is the same alignment technique employed
    in ClustW, PIMA, T-COFFEE, and so on. This technique can be summarized as follows:


    +   - Perform all-pairwise sequence alignment to calculate the distance between
    the input sequences.


    +   - Build a dendrogram tree using UPGMA [60] or NJ [61] hierarchical clustering
    methods.


    +   - Pairwise align the sequences (or two groups of sequences) following the
    dendrogram from the leaves to the root.


    In this implementation, ClustalW is utilized to perform steps (i) and (ii) since
    at are at the pairwise level of sequence alignment HEP score acts exactly the
    same as sum-of-pair score used in this ClustalW. In step (iii), two versions of
    Needleman–Wunsch’s [19] algorithm are implemented: one uses SP [35] scoring method,
    one uses Smith’s Pima [50] method, one uses Valdar’s method [48], and the last
    one uses HEP method. The Trident method is not implemented since its appropriate
    parameters are hard to determine. Moreover, Trident method did not perform in
    the previous BDataBase3.0 and PREFAB4.0 tests.


    ![](img/c2ce4992087205b6ef559b10db163265_72_0.png)'
