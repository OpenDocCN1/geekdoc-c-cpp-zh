  md: '# PREFACE


    The advancement in sequencing technology has resulted in enormous amount of data
    that must be analyzed and categorized. Recently, the US National Center for Biotechnology
    Information (NCBI) announced the availability of whole genome sequences for more
    than 1000 species. The number of sequenced individual organisms is growing very
    fast around the world. However, the availability of sequence information is only
    the first step in understanding how cells survive, reproduce, and adjust their
    behavior. The next step is to analyze the data, extract knowledge from them, and
    get a better understanding of the functions, and control mechanisms of these species.
    Since sequence alignment is the fundamental operation in dealing with the sequencing
    data, it is gaining a lot of interest from researchers who are mining biological
    information from massive sequence databases. Multiple sequence alignment algorithms
    are used to align three or more biological sequences. For example, multiple biological
    sequence alignment is used in motif finding, sequence clustering, and sequence
    mining. The current advancement in sequencing technology has created a massive
    number of biological sequences (DNA/RNA/protein, etc.), thus expanding the sequence
    databases at a rate exceeding the capability of existing sequence analysis tools
    and facility. As a result, many traditional sequence alignment models and methods
    become obsolete, along with the books covering only these topics.


    Exhaustive dynamic programming is a straightforward way to compute multiple sequence
    alignments. However, this approach is prohibitive in terms of both time and space.
    To overcome these constraints, heuristics such as progressive alignment have been
    suggested. Other new heuristic algorithms based on information extracted from
    sequences themselves are described in the book. Another issue is how to evaluate
    the quality of the alignments obtained. Clearly, a simple numerical score for
    matching or mismatching of two biological symbols is not always the'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# xii


    # PREFACE


    right to do. We need to take into account the biological means of these symbols.
    Furthermore, the validations should be done by biological experiments or by biological
    experts on real biological sequences based on their experiences. The aim of this
    book is to cover as many topics as possible arising recently in this field apart
    from traditional multiple sequence alignment algorithms. This book provides detailed
    descriptions of the traditional and modern approaches in biological sequence alignments
    and homology search. It covers the full spectrum of the field alignment algorithms
    to scoring methods, practical techniques, alignment tools, and their evaluations
    and applications. It provides the details of the state of the computational methodologies
    for challenging tasks in multiple sequence alignment including the following:


    +   - Background of protein/DNA/RNA pairwise and multiple sequence alignment

    - Clustering methods

    - Theories and developments of scoring functions and scoring matrices

    - Cutting-edge development in multiple sequence alignment algorithms

    - Knowledgebase-assisted sequence alignment

    - Evaluation of existing sequence alignment algorithms

    - Homologous sequence classification and organization

    - Phylogeny estimation

    - Large-scale homology search

    - Parallel and distributed sequence alignment algorithms

    - Popular sequence alignment servers

    - Alignment algorithms for next-generation sequences

    - Variants detection based on multiple sequence alignment

    - RNA/protein secondary structure prediction using multiple sequence alignment


    Multiple sequence alignment is often included as a chapter in most of bioinformatics
    and sequence analysis books. It is the first book in the field that provides a
    comprehensive view into recently developed large-scale alignment models and techniques
    that promise to handle the current and future challenges of aligning enormous
    amount of sequences. It is also the first book specifically written for multiple
    sequence alignment.


    Readers will be informed with the fundamentals in biological sequence alignment
    and analysis to understand the state-of-the-art techniques in sequence alignment
    and be able to choose appropriate sequence analysis tools for their tasks. The
    intended readers of this book are researchers, engineers, graduate and postgraduate
    students in bioinformatics and systems biology, and molecular biologists. It provides
    the readers with a comprehensive book in multiple biological sequence alignment
    theory, methodology, evaluation, applications, and technologies.


