    # 1.3.2 DNA/RNA


    Both DNA and RNA contain three basic components:(i) a five-carbon sugar, which
    could be ribose (in RNA) or deoxyribose (as in DNA), (ii) a series of chemicals
    derived from phosphoric acid molecules, and (iii) four nitrogen compounds with
    the chemical properties of bases. DNA has four bases namely adenine (A), thymine
    (T), guanine (G), and cytosine (C), while RNA has adenine (A), uracil (U), guanine
    (G), and cytosine (C) bases. Adenine and guanine are double-ring molecules known
    as purine, while other bases are single-ring molecules known as pyrimidine (see
    Figure 1.4 for an example


    DNA is a linear, double-helix structure and RNA is a single-stranded structure
    and composed of intertwined chains made of nucleotides. takes ribose as its sugar.
    There are three types of RNA: messenger RNA (mRNA), transfer RNA (tRNA), and ribosomal
    RNA (rRNA). tRNA and tRNA are parts of synthesizing process, and mRNA is a template
    for synthesis. The process of producing an amino acid chain, the nucleotide sequence
    of an mRNA is read from one end to the other in the group of three successive
    bases. These groups are called codons. Each codon is either a coding for an amino
    acid or a translation terminal signal. There are 64 (4 x 4 x 4) possible codons
    for the bases.


