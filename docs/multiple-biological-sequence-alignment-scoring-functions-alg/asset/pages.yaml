  md: '# SCORING MULTIPLE SEQUENCE ALIGNMENTS


    within the MSA are added. This sum-of-pair method is the extension of sum-of-pair
    method mentioned in scoring pairwise alignment to cover all pairwise scores. Formally,
    the SP score is defined as


    **Definition 2** The multiple alignment score of $s''_1,s''_2,\dots,s''_n$ where
    $s''_i, s''_j \in A$, is $S(A) = S(s''_1, s''_2, \dots, s''_n) = \sum_{k=1}^n
    \sum_{i,j,i\neq j} S(s''_i[k], s''_j[k])$.


    The following two examples will illustrate the SP method in details.


    # **3.4.1.1 Example 1** Given the following sequences


    +   S1: MITEITA

    S2: MILIA

    S3: TITIA


    and their alignment A:


    | S1 | M T E I T A |

    | S2 | M I L I - A. |

    | S3 | T I T I - - A |


    The SP score of this alignment is the sum of


    $S(A) = [S(M,M) + S(M,T) + S(M,T)] + [S(T,I) + S(T,I) + S(I,I)]

    \+ [S(E,L) + S(E,T) + S(L,T)] + [S(I,I) + S(I,I) + S(I,I)]

    \+ [S(T,-) - S(T,-) + S(-,-)] + [S(A,A) + S(A,A) + S(A,A)]$


    The biggest problem with this scoring method is how to score a pair of matching
    between two gaps. In practice, it is simply ignored.


    # **3.4.1.2 Example 2** Aligning a sequence of sequence $s_j = \dots MI\dots$
    with pre-aligned sequences $A = \{s_j = \dots LLM\dots$ and $s_k = \dots IMI\dots\}$
    yields more than one alignment. If BLOSUM62 substitution matrix and a gap penalty
    of -1 are used to score the alignment, the alignment of


    | s''_j | L L L |

    | s''_k | I M I |

    | s''_i | M - I |


    $S(s_i, s_j, s_k) = \begin{cases} s''_j & L L L \ s''_k & I M I \ s''_i & M -
    I \end{cases}$


    yields a score of -5, which is higher than the alignment of


    | s''_j | L L L |

    | s''_k | I M I |

    | s''_i | M - I |


    yielding a score of -8.'
