    # ## 9.1 INTRODUCTION


    Traditional sequencing techniques, such as capillary electrophoresis-based Sanger
    sequencing and microarray, are expensive and have limitations such as throughput,
    scalability, speed, and resolution. The new approach is called next-generation
    sequencing (NGS), which takes a slightly different approach to improve the sequencing
    throughput. The NGS technique utilized the same concept as in capillary electrophoresis-based
    Sanger technique on small fragments of DNA. From a DNA template strand, the bases
    of a small fragment of DNA sample are identified from signals emitted as the fragment
    is resynthesized. sequentially for each base in the fragment. The NGS can perform
    millions of DNA fragments in parallel, thus producing hundreds of gigabases of
    data in each sequencing run. Consider a single genomic DNA (gDNA) is being fragmented
    sequencing. The segments are flushed through the DNA template multiple times with
    different synthesizing agents for each base, and the signals emitted from the
    binding of the bases and the template are identified and recorded. Here, a string
    of bases for each segment is identified as a sequence read. The next step in the
    process is to assemble these small sequence reads onto a reference genome. Differences
    between the reads and the reference are indications'
