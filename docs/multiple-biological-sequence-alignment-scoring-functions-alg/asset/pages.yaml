  md: '# #4 SEQUENCE CLUSTERING


    It is natural to group closely-related sequences into clusters before performing
    multiple sequence alignment. Scientists in the field have been debating on how
    to systematically detect and measure the relatedness between sequences, that is,
    the homologous features and functional similarities between sequences. Figure
    4.1a shows the mutation steps of residues in different species sequences during
    evolution. The phylogeny tree indicates at any specific site by which a symbol
    is mutated to the other. Figure 4.1b shows the original symbol it was either G
