  md: '# Wiley Series on


    # Bioinformatics: Computational Techniques and Engineering


    Bioinformatics and computational biology involve the comprehensive application
    of mathematics, statistics, science, and computer science to the understanding
    of living systems. Research and development in these areas require cooperation
    among specialists from the fields of biology, computer science, statistics, physics,
    and related sciences. The objective of this book series is to provide timely treatments
    of the different aspects of bioinformatics spanning theory, new and established
    techniques, technologies and, application domains. This series emphasizes algorithmic,
    mathematical, statistical, and computational methods that are central in bioinformatics
    and computational biology.


    Series Editors: Professor Yi Pan and Professor Albert Y. Zomaya

    pan@cs.gsu.edu | zomaya@it.usyd.edu.au


