    # 5.3.3 ProbCons: Probabilistic Consistency-Based Multiple Sequence Alignment


    ProbCons [86] algorithm is based on the probabilistic consistency of the sequences.
    It is a pair-HMM-progressive alignment algorithm that uses Needleman-Wunsch''s
    algorithm with no gap penalty (maximum expected accuracy) The emission probability
    of a residue is based on BLOSUM62 substitution matrix and the transitional probabilities,
    which is corresponding to the gap penalty. The transitional probabilities obtained
    by unsupervised expectation maximization (EM) [64] method.


    Given the input sequence $S$, the algorithm is as follows:


    +   *Step 1*: For every pair of sequences $x$ and $y \in S$, a posterior probability
    matrix represents the probabilities of two residues, from sequence $x$ and one
    from sequence $y$, is paired in alignment, and is calculated as follows:


    ```

    $P_{x,y} = \mathbf{P}(x_i \sim y_j \in a * | x, y) \quad (5.8)$

    ```


    where $x_i$ and $y_j$ are residues at location $i$ and $j$ in the sequences, $a$
    is a pair-wise alignment of $x$ and $y$ generated by the model.


    +   *Step 2*: The expected accuracy of an alignment $a$ is defined to be the expected
    number of correctly aligned pairs of residues divided by the length of the shorter
    sequence:


    ```

    $E_a(accuracy(a, a *)|x,y) = \frac{1}{min|x|, |y|} \sum_{x_i \sim y_j \in a} \mathbf{P}(x_i
    \sim y_j \in a * | x, y) \quad (5.9)$

    ```


    It then computes the alignment $a$ that maximizes the expected accuracy by dynamic
    programming and $E(x,y) = \mathbf{E}_{a_*}(a, a *)|x,y).'
