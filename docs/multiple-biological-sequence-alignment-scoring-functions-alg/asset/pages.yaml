    # 4.3 OVERLAPPING SEQUENCE CLUSTERING


    It is very common to arrange sequences into related groups in sequence analysis.

    Most of clustering algorithms are designed for large-scale databases or large
    data set where the distance between each data element is known. On the contrary,
    in multiple sequence alignment, the distance between alignment is not well defined;
    and distinctive clusters are not the goal. Thus, conveniently NJ and UPGMA often
    are the popular choices for clustering when the needs arise. However, these algorithms
    are not intended for sequence clustering, rather predicting the phylogenetic tree
    of sequences. Alignment techniques following this tree often shared features between
    the sequences since the first pair of sequences dictates the alignment of the
    next. Figure 4.4 illustrates this.


    Recently, there is a clustering algorithm specifically for multiple sequence alignment
    called Overlapping Sequence Clustering (OSC) [66]. This technique is based on
    the facts that an organism can inherit traits from different families. In this
    case, a sequence clustering based on these similarities may more sense than hierarchical
    sequence clustering. This method uses DP to find the best pairwise local alignment
    between sequences. Then from the best local alignment scores, all sequences that
    yield alignment scores greater than a preset threshold $g$ are grouped into a
    cluster. Following are details of this algorithm, which relies on the transitive
    closure of a set.


    The transitive closure is defined as follows: For any relation $R$, the transitive
    closure of $R$ is the intersection of all relations containing $R$ and is defined
    as


    > $R^+ = \bigcup_{i\in N} R^i$ (4.1)


    ![](img/c2ce4992087205b6ef559b10db163265_80_0.png)


    **Figure 4.4** Illustration of different alignment outcomes from the motifs in
    bold; (b) shows the expected alignment; (c) and (d) show the alignment based on
    different phylogeny guiding tree.'
