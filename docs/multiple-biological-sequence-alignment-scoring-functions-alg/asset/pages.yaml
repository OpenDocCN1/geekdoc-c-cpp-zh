    # 3.6 CONSERVATION SCORE SCHEMES


    When multiple residues are grouped together, scoring them are no longer trivial.
    Each residue has its own stereochemical property and biological meaning. Thus,
    most scoring schemes rely on the conservation and diversity of the symbols instead.


    # 3.6.1 Wu and Kabat''s Method


    In 1970, Wu and Kabat [39] proposed a method to measure sequence conservation.
    The method is as follows:


    ```

    $S = \frac{k}{nl} \times N,$

    ```


    where $k$ is the number of amino acid types in a column, $nl$ is the number of
    times the most abundant amino acid occurred in the column, and $N$ is the number
    of sequences included during scoring process. Thus, the score for the third column
    of the following alignment is


    ```

    $A(s_i, s_j, s_k) = \begin{cases} s''_i : & \mathbf{L} \ \mathbf{L} \ \mathbf{L}
    \ s''_j : & \mathbf{I} \ \mathbf{M} \ \mathbf{I} \ s''_k : & \mathbf{M} \ \mathbf{I}
    \ \mathbf{I} \end{cases}$

    ```


    where $k=3$ for three symbol types, $nl=2$ since $I$ occurs twice in that column,
    and $N=3$ for three sequences involved. Thus, the score is $3 \times 3 = 4.5$.


    This method simply ignores the probability that some nonconserved symbols could
    be mutated to the majority symbols. And in the extreme case where there are $n$
    symbols of two types, one has $\frac{n}{2}+1$ residues and the other has $\frac{n}{2}-1$
    symbols; this method will simply ignore the other conserved half.


    # 3.6.2 Jores''s Method


    In 1990, Jores et al. [40] proposed a different scoring scheme to address the
    problem in Wu and Kabat''s method. Their scoring method is defined as


    ```

    $S = \frac{k_{pairs}}{n_{pairs}} \times \frac{1}{2}N(N-1),$

    ```'
