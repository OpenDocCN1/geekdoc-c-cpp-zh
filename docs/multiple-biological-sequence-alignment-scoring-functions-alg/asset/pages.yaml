  md: "# 32\n\n# QUANTIFYING SEQUENCE ALIGNMENTS\n\nthe $i$ and $j$ in a sequence.\
    \ $\\lambda$ is a scaling factor that converts the scores to integers for the\
    \ ease of calculation.\n\nThere is an equivalent relationship between PAM and\
    \ BLOSUM. For example, PAM100 is roughly equivalent to BLOSUM90, so PAM120 to\
    \ BLOSUM80, PAM160 to BLOSUM60, PAM200 to BLOSUM52, and PAM250 to BLOSUM45. Table\
    \ 3.3 represents the BLOSUM45 derived from sequences clustered at the 45% identity\
    \ level.\n\nGONNET [33] is another matrix developed by Gonnet, Cohen, and Benner\
    \ in 1992 using exhaustive protein pairwise Needleman-Wunsch's alignment algorithm\
    \ with PAM matrix on existing protein sequence database at the time. GONNET matrix\
    \ is shown in Table 3.4.\n\n# 3.3 GAPS\n\nGaps are artificial insertions into\
    \ sequences to move similar segments of sequences into alignment. It is widely\
    \ believed that through evolution, segments of a sequence are missing due to several\
    \ factors, either biologically, physically, or chemically, which leads to homologous\
    \ sequences with different lengths. The missing segments are considered deleted\
    \ from the sequence, and the sequences retaining these segments are considered\
    \ inserted with such segments. To correctly align homologous sequences, the missing\
    \ segments must be accounted for. This is why gaps are inserted into sequences\
    \ to get the similar regions aligned. The probability of a segment that is missing\
    \ from a sequence is rarely studied due to the fact that exact and true progression\
    \ including the corresponding DNA/RNA sequences of species involved is unknown.\
    \ Thus, is improbable to determine whether segments of a sequence are missing\
    \ from the original one, or inserted by combining sequences of other species,\
    \ or are mutated under some conditions. It is not clear whether the sequences\
    \ being aligned are homogenous or not. The alignment of the sequences may lead\
    \ to a conclusion.\n\nThese problems revolve around a circle, and MSA is an attempt\
    \ to create circ. Inserting the right number of gaps into the appropriate locations\
    \ in the sequences will give us the solution. Correctly placing the gaps into\
    \ the sequences is a very difficult problem since there are tremendous insertions,\
    \ or deletions to be considered, and true model is not available or for validating\
    \ the resulting alignments. In Lesk and Kothia [34] showed that deletions/insertions\
    \ are observed primarily in unstructured coils or surface regions of secondary\
    \ structure units of homologous protein sequences (i.e., $\\alpha$-helices and\
    \ $\beta$-strands) rather than within them themselves.\n\nWe want to least align\
    \ similar motifs of the sequences together; gap insertions are not unavoidable.\
    \ Nevertheless, unlimited gap insertions are biologically meaningless. As a result,\
    \ the majority of MSA algorithms penalize gap insertions to avoid unnecessary\
    \ extension of the alignment. Thus, the overall objective is to maximize the matches\
    \ in the alignment and minimize inserted gaps."
