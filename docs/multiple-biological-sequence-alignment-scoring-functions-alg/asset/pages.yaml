  md: 'Independently, Huang and Biswas [110] and Aluru et al. [121] propose similar
    algorithms to partition the DP column-wise and assign each partition to a processor.
    All processors are synchronized to calculate their partitions in one row a time.
    For this algorithm to perform properly, each processor must hold a copy of the
    sequence that is mapped to the rows of the matrix. Since these calculations are
    performed row-wise, the values from cells $c_{i-1,j}$ and $c_{i,lj}$ are available
    before the calculation of cell $c_{ij}$. The value of $c_{i,j-1}$ can be obtained
    by performing prefix-sum across all cells in $n$ processors, the computation time
    of each is dominated by the prefix-sum calculations, which is $O(\log n)$ time
    on PRAM models. Therefore, the DP table can be constructed in $O(m+n)$ time, or
    $O(\log n)$ for $n \ge m$, using $O(n)$ processors.


    Recently, Sarkar et al. [114] implement both of these DP algorithms [120, 121]
    on a network-on-chip computing platform [122].


    In addition, the construction of a dendrogram can be parallelized in [113] using
    $n$ GPUs and completing in $O(n^3)$ time.

    Furthermore, there are algorithms to parallelize the progressive alignment step,
    step (iii) as in [123] and [124], the independent aligned pairs along the dendrogram
    are aligned simultaneously. This technique gains speed-up; the time complexity
    of the alignment remains unchanged unless all pairwise alignments eventually get
    merged. Another attempt is seen in [124] where Huang''s algorithm [120] is used.
    When an antisocial DP alignment in lower tree level in step (iii) is completed,
    it is distributed to other processors for computing the pairwise alignment of
    a higher level. This technique can lead to an incorrect result since the actual
    pairwise alignment of the lower branch is still uncertain.


    Overall, the major speed-up achieved from these implementations comes from two
    parallel tasks: performing simultaneously and calculating the dynamic programming
    matrix adiagonally (or in blocks). These two tasks only reduce the run-time complexity
    of the original algorithm by an order to $O(n^4)$, regardless of how many processors
    are used. The bottleneck resides in step (iii), where the pairwise group alignments
    are sequentially following the guiding tree, and each alignment requires all the
    pairwise scores to be calculated.


    The remaining of this chapter is devoted to parallel sequence alignment algorithms.
