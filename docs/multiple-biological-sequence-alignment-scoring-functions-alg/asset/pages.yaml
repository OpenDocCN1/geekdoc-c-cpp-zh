    sequences Seq3, Seq4, and Seq5. Finally, C has been changed to A in the subfamily
    containing sequences Seq4 and Seq5 in Figure 4.1c.


    There are many algorithms for clustering such as K-means [62], fuzzy C-means [63],
    hierarchical clustering, and probabilistic clustering [64]. However, these methods
    classify the sequences into groups with smallest distance (edit distance/ Hamming
    distance, Euclidean distance) and often normalize the biological implication between
    sequences. K-means finds k clusters starting with k random seeds (initial k-clusters)
    and grouping the nearest data points (sequences) to the cluster based on the data
    points and the centroid of the cluster. Fuzzy-C-means is almost identical to K-means
    method except a data point (sequence) is allowed to participate in more than one.
    The probabilistic clustering algorithms group the data points into clusters based
    on their distributions such Gaussian or Poisson. These clustering algorithms are
    not very reliable for sequence clustering


