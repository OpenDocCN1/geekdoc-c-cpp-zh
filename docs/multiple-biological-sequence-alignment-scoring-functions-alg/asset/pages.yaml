    # 3.1.2 Measuring Relatedness


    The most basic task to identify the evolution process is to calculate the evolution
    distances between the involved species. Initially, species that yield the most
    confidence in being homologous are grouped together. These groups are then considered
    as taxonomic units, and the process is repeated until all taxonomic units are
    joined. The most fundamental task in this process is measuring the evolution distance
    or scoring the homogeneity between species. In terms of sequence analysis, the
    scoring is often based on the similarity, divergence, and convergence between
    the sequences. At the sequence level, neither nucleotides or amino acids, there
    is available biological and scientific information permitting scientists to rank
    any pair of matching residues. However, functional units and structures of the
    sequences are often made of more than one residue and may depend on each other;
    making the ranking very difficult until the units and the dependency between them
    are being determined. The most popular approach to solve this problem is to accumulate
    the similarity scores, divergent scores, and convergent scores, and then normalize
    these scores based on some weighing schemes. Therefore, the weighing scheme should
    be refined by experts for each instance of measurement to fit the data and their
    expected or desired results. Any revealed information obtained from sequence alignment
    should be incorporated back to further refine the alignment.


    # 3.2 SUBSTITUTION MATRICES AND SCORING MATRICES


    Quantifying the distance between sequences often relies on the probability of
    one residue being mutated to another. Proteins have 20 different amino acids and
    DNA/RNA have four different nucleotides. For convenience, these mutation/substitution
    pairs are often pre-calculated for general uses. The values of these matrices
    are different and depend on which method is being employed.


    # 3.2.1 Identity Scores


    This method is probably the simplest scoring scheme. Protein polypeptides and
    DNA/RNA nucleotides are classified into two types: identical and nonidentical
    or matched and unmatched. The matched pairs are given a positive score (usually
    1) and the unmatched pairs get 0 score.'
