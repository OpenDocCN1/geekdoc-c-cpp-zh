    # 5.4.1 SAGA: Sequence Alignment by Genetic Algorithm


    SAGA [97] optimizes its multiple sequence alignment by applying genetic algorithm
    (GA) [93, 94]. The SAGA algorithm starts with an initial population containing
    some random alignments of the sequences. These initial alignments represent the
    first generation, $g_0$, of the alignments. In generation $n, n > 0$, SAGA ranks
    each member in the population using the sum-of-pair as its objective function
    and allows the GA to select pairs of parents from $g_{n-1}$ to create offspring
    for the $n$th generation. Pair of parents with a good fitness score, based on
    the objective function, is allowed to have more offspring. The offspring are created
    from any combination of crossover, gap insertion, and block-shuffling techniques.
    The crossover allows blocks of parents to be swapped as in Figure 5.13; the gap
    insertion method creates a child by inserting gaps into a parent alignment; and
    the block shuffling allows a block of gaps to be shuffled to the left or right
    locations. The population is kept constant by replacing the population members
    with new offspring. No duplicated members are allowed in the population. The algorithm
    terminates when no new offspring with better fitness score can be found in the
    $n + k$th generation. $n$ and $k$ are predefined parameters by users before executing
    the algorithm. This algorithm is depicted in Figure 5.14.


    Similarly, GA and RBT-GA (Rubber Band Techniques with GA) utilize genetic algorithm
    as their engine. The term “rubber band,” used in RBT-GA method, represents a path
    from $(0,0)$ to $(m,n)$ in a backtracking matrix similar to the one created in
    dynamic programming. The optimal rubber band is exactly the same as the DP backtracking
    path. The rubber band technique iteratively selects residues from the aligning
    paths of sequences as anchor points (poles) and tries to find the best score path
    between the anchors.


