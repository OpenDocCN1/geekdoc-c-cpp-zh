  md: 'OTUs remain. This algorithm is detailed as follows: Consider a set of $n$ sequences
    and a distance matrix $d$.


    Step 1: Calculate the net divergence for each OTU to all other OTUs


    ```

    $u_i = \sum_{k} d_{ik}/(n-2)$

    ```


    Step 2: Calculate the new distance matrix $M$


    ```

    $M_{ij} = d_{ij} - u_i - u_j$

    ```


    and join two closest neighbors, that is, the pairs with minimal value from $M$.\nStep
    3: Calculate the distance between OTU $i$ and $j$ to the new OTU $ij$ as


    ```

    $d_{(ij)} = (d_{ij} + u_i - u_j)/2$\n$d_{(ji),(ij)} = (d_{ij} + u_j - u_i)/2$

    ```


    Step 4: Compute distances between new OTU to all other OTUs


    ```

    $d_{(ij),k} = (d_{ik} + d_{jk} - d_{ij})/2$.

    ```


    Step 5: Replace $i$ and $j$ by $(i,j)$.\nStep 6: Repeat from step 1 until only
    2 OTUs remain.


    Example: Consider four sequences A, B, C, D and their distance matrix $d$.


    | | A | B | C | D |

