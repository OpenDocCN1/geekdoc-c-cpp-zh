    # 5.2.4 DIAAlign


    Similar to T-Coffee, DIAAlign combines both pair-wise alignments and local pair-wise
    alignment features. MSAs in DIAAlign are composed of equal-length segments that
    exhibit significant similarity. The segments are obtained from local pair-wise
    alignments. This technique is similar to FASTA alignment. For distantly related
    sequences, DIAAlign uses global alignment method similar to Needleman''s algorithm
    to align them. For mixture of related and unrelated sequences, DIAAlign aligns
    only segments of sequences that are statistical significant. A greedy approach
    is used to search and align similar segments across the sequences. Gaps are not
    penalized in DIAAlign, and segments insignificant are not aligned.


    # 5.2.4.1 Tabu Search Tabu search [79, 80] is an iterative heuristic search scheme
    that is capable of combining combinatorial optimization problems. Tabu search
    is deterministic and capable of avoiding local optima by keeping a list of prohibit
    solutions or a Tabu list. The Tabu search for MSA [81] is carried out in two phases.


    *Phase 1*: Input provides the initial solution for the search. The Tabu MSA merges
    the gap regions, either locally in a sequence or across multiple sequences, to
    neighboring columns to generate a new alignment. The alignment is evaluated with
    T-Coffee objective function and added into the Tabu list preventing Tabu from
    repeating the same move. The highest score alignments in Tabu list are removed
    after $x$ number of iterations so that they can be back in the solution space.
    The moves are repeated until convergent, that is, no solution with worse score
    than the Tabu list or $k$ iterations have been performed.


    *Phase 2*: The steps in this phase are similar to those in this phase with a modification
    so that the best moves are kept in the potential solution list, or elite list.
    The solution is obtained by applying the moves from the elite list.


    ```

    Score = \frac{\sum_{i=1}^{N-1}\sum_{j=i+1}^{N} W_{ij} * Score(A_{ij})}{\sum_{i=1}^{N-1}\sum_{j=i+1}^{N}
    W_{ij} * Len}

    ```


    where $N$ is the number of sequences; $Len$ is the length of the alignment; $w_{ij}$
    is the percent identity between two aligned sequences $S_i$ and $S_j$; $A_{ij}$
    is the pair-wise projection of $S_i$ and $S_j$ obtained from the multiple alignment;
    and $Score(A_{ij})$ is the overall level of identity between $A_{ij}$ and the
    corresponding pair-wise alignment.'
