  md: "# MULTIPLE SEQUENCE ALIGNMENT FOR STRUCTURE DETECTION\n\nAlthough the tertiary\
    \ function is the level of organization relevant for the biological function of\
    \ structured RNA molecules and sometimes SSs are influenced by tertiary structures\
    \ [283], the interactions that are responsible for RNA tertiary formation are\
    \ significantly weaker than those for SS formation [284]. Hence, in recent investigations,\
    \ for computational simplicity, it is assumed that the influence of hydrogen bonds\
    \ within the tertiary structure, on hydrogen bonds within SS, is negligible; consequently,\
    \ SSs can be predicted independently of tertiary structures [285, 286]. In this\
    \ section, we briefly introduce the information types available giving the multialigned\
    \ homologous RNA sequences. Then we review three classical SS prediction methods\
    \ using three different orders of folding and aligning during the prediction process.\
    \ At last, we provide the standard metrics and resources to assess the performance\
    \ of SS results.\n\n# 11.2.1 Common Information in Multialigned RNA Sequences\n\
    \nSeveral types of information extracted from multialigned RNA sequence are utilized\
    \ in the RNA sequence folding and aligning, and the RNA SS prediction tools and\
    \ algorithms. We briefly summarized this information into three categories: mutual\
    \ information, covariation, and phylogenetic information.\n\n# 11.2.1.1 Mutual\
    \ Information It is well known that the mutual information can be applied to detect\
    \ compensatory mutations in an alignment [277, 288]. Given the ith and jth columns\
    \ in an alignment, the mutual information is defined as\n\n```\n$M_{ij} = \\sum_{X,Y}\
    \ f_{ij}(XY) \\log \\frac{f_{ij}(XY)}{f_i(X)f_j(Y)} \\quad (11.1)$\n```\n\nwhere\
    \ $X, Y$ consist of the four possible bases at the positions i and j, $f_i(X)$\
    \ is the frequency of base X, $f_{ij}(XY)$ is the joint frequency of base module\
    \ X and Y. We can employ an upper triangular matrix to present the complete set\
    \ of mutual information. Once the mutual information is complete, SS can be inferred\
    \ from the prediction method using a dynamic programming algorithm [289], which\
    \ maximizes the sum of mutual information over all pairs bases.\n\n# 11.2.1.2\
    \ Covariation Information Because SSs of RNAs are related to their functions,\
    \ mutations that preserve pairs often occur during the evolution, especially in\
    \ the RNA stem parts. The algorithm, RNAalFold[2009], which will be introduced\
    \ in next section, uses the information of covariation in combination with the\
    \ thermodynamic stability of common SSs. By given an input alignment, the covariation\
    \ (CI) can be evaluated by evaluating the averaged number of compensatory mutations\
    \ for a pair of columns. For the ith and jth columns in the alignment, the averaged\
    \ number is defined as\n\n```\n$C_{ij} = \\frac{2}{N(N-1)} \\sum_{\\alpha,\\beta\
    \ \\in A} d_{ij}^{\\alpha,\\beta} q_i^\\alpha q_j^\beta, \\quad (11.2)$\n```"
