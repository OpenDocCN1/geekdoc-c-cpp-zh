    # 3.2.2 Substitution/Mutation Scores


    Substitution scoring scheme is based on the observed residue substitution, or
    mutation, frequencies in sequence alignments. Despite the contradicting fact that
    alignments must exist before the frequencies can be observed and profiled, the
    frequencies can be used to align the sequences with reliable results; when the
    frequencies are obtained from correctly aligning all the sequences in several
    families and then construct phylogenetic trees for each family. Each phylogenetic
    tree is examined to identify the substitution occurred on each branch. A mutation
    or substitution is more likely to occur between residues with similar biochemical
    properties. For instance, isoleucine (I) and seine (V) get a positive score by
    this scheme to indicate a likelihood that would easily mutate. While the hydrophobic
    isoleucine (I) will get a negative score with hydrophilic cysteine (C) as their
    probability of being substituted is very unlikely. A combining all of these scores
    is often called a substitution matrix or a scoring matrix. One of the early matrices
    is Dayoff’s [25,27] matrix or Point (Percentage) Accepted Mutation (PAM) developed
    for protein sequences. The substitution matrix score for all amino acids are generated
    from observing the likelihood of a particular mutation such as A to D with successive
    mutation, as A to y to D, where x and y are some other residues over another.
    The scoring matrix M contains the probabilities of a residue being mutated to
    another. $M_{i,j}$ is defined to be the probability of an amino acid in row $i$
    mutating to an amino acid in column $j$ after a evolutionary period. For example,
    PAM represents the 2% of acceptable point mutations per $10^9$ years. The mutation
    matrix can be generated for any specific evolution period. PAM is based on mutations
    that occurred in an overall alignment of sequences, and its sensitivity is based
    on the distances between sequences pairs. PAM250 – targeting sequences with 250
    PAM per 100 amino acids of sequence – is considered a good matrix to use in protein
    database searches. The log-odds [28–30] are applied to the actual values of PAM
    to normalize it so that PAM1 matrix has one point of mutation over a hundred amino
    acids. The odds ratio is an approach to determine the probability of a certain
    event is for two groups. The odds'
