  md: 'ratio of 1 indicates that the event is equally likely in both groups. The log-odds
    is the natural logarithmic of odds ratio. For independent event, X and Y are as
    follows:


    | Y=1 | Y=0 |

    |---|---||

    | X=1 | $n_{11}$ | $n_{10}$ |

    | X=0 | $n_{01}$ | $n_{00}$ |


    The log-odds formula for two independent events X and Y is


    ```

    $L = \log\left(\frac{P_{11}P_{00}}{P_{10}P_{01}}\right) = \log\left(\frac{n_{11}n_{00}}{n_{10}n_{01}}\right),

    ```


    where $P_{ij} = n_{ij}/n$, with $n = n_{11} + n_{10} + n_{01} + n_{00}$. The likelihood
    of a protein substituting amino acid a for b is defined as a ratio of two properties:


    ```

    $R(a,b) = \frac{P(a,b|match)}{P(a,b|random)}$

    ```


    where $P(a,b|match)$ is the probability of a being substituted for b with the
    assumption that their positions are biologically equivalent, and $P(a,b|random)$
    is the probability of $a$ and $b$ aligned randomly observed. The ratios for all
    amino acids are expressed as log values scaled up to the next integers. The formula
    for generating the value in the substitution matrix


    ```

    $M(a,b) = \lambda \log R(a,b),$

    ```


    where $\lambda$ is a scaling factor. Table 3.2 shows the PAM250 matrix. Similarly,
    Blocks Substitution Matrix (BLOSUM) [31, 32] is also designed for scoring alignments
    of divergent protein sequences used in database search developed along with BLAST.
    Instead of considering each residue independently, BLOSUM considers the significance
    of local alignment blocks, or highly conserved regions, and their contents. The
    exact method is to scan the database for conserved blocks of protein family and
    count the relative frequencies of amino acids and their substitutions. The log-odds
    score calculated for each possible substitution of the 20 standard protein amino
    acids. Each BLOSUM matrix is calculated from grouping sequences with $x$ percentage
    of similarity from a database. For instance, BLOSUM80 represents the substitution
    matrix generated from sequences that are more than 80% identical to the query
    sequence. The formula is used to generate the BLOSUM score:


    ```

    $M_{ij} = \frac{1}{\lambda} \log\left(\frac{P_{ij}}{q_i * q_j}\right)$

    ```


    where $p_{ij}$ is the probability of the two amino acids $i$ and $j$ replacing
    each other in a homologous sequence. $q_i$ and $q_j$ are the background probabilities
    of randomly finding'
