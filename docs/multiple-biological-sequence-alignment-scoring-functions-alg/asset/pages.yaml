  md: '# SEARCHING SEQUENCE DATABASES


    a pair whose score of at least S can be found. If such segment is found, it is
    extended until the total score of the segment begins to decrease. This segment
    is called a high scoring segment pair (HSP). MSP is an HSP with the highest matching
    score. A low threshold T results in more hits and slows down the search. When
    aligning two random sequences of lengths m and n (in, the database), the total
    length of all sequences in the database), the probability of finding a segment
    pair with a score greater than or equal to S is defined to be


    ```

    $E = 1 - e^{-y}$

    ```


    where $y = Km^{-\lambda S}$, $K$ and $\lambda$ are statistical parameters that
    represent the natural scales of the search space and the scoring system. $K$ and
    $\lambda$ depend on the substitution matrix, and the frequencies of the symbols
    in the sequence. Typically, $\lambda = 0.3184$ and $K = 0.13$.


    This threshold is often referred as an E-value, and a typical good E-value should
    be $10^{-S}$ or lower. Smaller E-value indicates that the MSP is highly unique
    and not due to errors.


    The probability of finding $c$ or more distinct segment pairs with scores of at
    least $S$ is


    ```

    $P = 1 - e^{-y} \sum_{i=0}^{c} \frac{y^i}{i!}$

    ```


    Hence, this probability and the E-value determine the degree of confidence on
    a BLAST result.

    BLAST cannot guarantee the MSP to the optimal local alignment; however, the trade-off
    is the great improvement of the algorithm speed that needed to search large databases
    of sequences.


    In later chapters, we will discuss the suffix structures and construction techniques
    that allow a large database of sequences to be stored and retrieved quickly to
    accommodate sequence searches.'
