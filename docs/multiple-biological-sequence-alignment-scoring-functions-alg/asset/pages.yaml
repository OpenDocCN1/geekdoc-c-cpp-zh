    # 11.2.3.1 Performance Metrics The three common ways to measure the rank of RNA
    prediction methods are to compute sensitivity, positive predictive value (PPV),
    and Mathews correlation coefficient (MCC). The calculation of these three metrics
    requires to classify base pairs into the following categories: TP (true positives),
