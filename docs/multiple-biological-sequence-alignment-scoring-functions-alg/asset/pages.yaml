    Each method performs well on different reference set of sequences. PRRP tends
    to perform well on some reference sets containing sequences in the twilight zone,
    that is, sequences that share less than 25% identity.


    There are many MSA algorithms that have been proposed, many of them are slightly
    different from each other. In this chapter, only distinctive MSA paradigms are
    introduced.'
