    # 3.8 STEREOCHEMICAL PROPERTY METHODS


    Scoring methods in this group are designed around the stereochemical properties
    of residue symbols in a column. The stereochemical property is first classified
    by Taylor in 1986 [46]. The classification is based on the residue conservation
    from the database and the Dayhof’s mutation matrix [25]. The classification is
    represented in a Venn diagram as depicted in Figure 3.7.


    In 1987, Zelbil et al. [47] converted Taylor’s Venn diagram into a true-table
    of amino acids with their properties as seen in Figure 3.8. The score is then
    as


    ```

    $S = n_{const} \times \frac{1}{10}.\quad (3.16)

    ```


    where $n_{const}$ is the constant number of properties with same that shared between
    residues in a column. For example, E and D share the same properties, $n_{const}=9$,
    in the table except D is small and E is not.


