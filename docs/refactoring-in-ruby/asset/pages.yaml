    Chapter 17: Calculator


    +   - Duplicated Code: There’s lots of similarity in the way the screen is set
    up (e.g., the calls make digit() and make unit()).


    Where to begin? There’s an art to it (especially with so many choices). We’re
    reasonably confident that Value and Dimension stand on their own. We want to start
    at Calculator, as it’s the heart of the system.

    There are three things we want to accomplish first:


    +   - Remove the direct dependency on the Value class and the default value. (What
    if we want to operate on integers instead of values? What would change?)


    +   - Pull cab() over to the Calculator class.


    +   - Eliminate the duplication in the operators.


    Exercise 17.2: Clean up Calculator

    Fix those problems in the Calculator class.


    When we did this, we made all the arithmetic operators call a common binary op
    method something like this:


    ```

    def plus

    binary op(lambda{a,b} a+b)

    end

    ```


    Exercise 17.3: Straighten out

    It looks like Calc Controller and Calculator are fighting over who owns the state
    that tracks whether a value is calculated. This is used so we know which 58-extended
    by 3 should be (if it’s in the process of being entered) or just toss the 58 and
    put 3 on the stack (if the value on top of the stack was calculated). Figure out
    which class should own the state, and get this out of the other’s hands.


    (There are arguments for either class owning it, but not.)


    Exercise 17.4: Controller

    The controller has two responsibilities: passing through to the calculator options
    and handling extension of the digits or the units. Harmonize and unify the two
    extension-methods.'
