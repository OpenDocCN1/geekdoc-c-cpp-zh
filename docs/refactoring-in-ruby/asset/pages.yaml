  md: '# CHAPTER 8


    # Duplication


    Duplication has been recognized for more than 30 years as the bane of the programmer''s
    lot. How often does duplication cause problems?


    +   - There is more code to maintain (a conceptual and physical burden).

    - Parts that vary are buried inside the parts that stay the same (a perceptual
    problem—it''s hard to see the important stuff).

    - Code variations often hide deeper similarities—it will be hard to see the deeper
    solution hidden within all the same code.

    - There''s a tendency to fix a defect in one place and leave identical defects
    unfixed. When you see two variations of something, it''s hard to know which variation
    is the right pattern or if there''s a good reason for the differences.


    David P introduced the *idea of information hiding*: A good module has a secret.
    By ensuring that a module keeps its secret, we usually reduce duplication. (See
    "On the criteria to be used in decomposing systems into modules" [25]).


    Duplication is a root problem. Many other smells are special-examples of duplication.
    Duplication is not always obvious, but it''s critical to address it. Strive to
    make your code express each "once" and only once." Don''t repeat yourself.


    In this chapter we''ll cover the following smells:


    +   - *Derived Value*, in which a hard-coded value could have been computed instead

    - *Repeated Value*, in which a hard-coded value is repeated

    - *Duplicated Code*, in which code has been copied

    - *Alternative Modules with Different Interfaces*, in which the same problem has
    been solved more than once'
  merge: -1
