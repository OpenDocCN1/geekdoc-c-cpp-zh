  md: '# Duplicated Code


    What to Look For


    +   - The easy form: Two fragments of code look nearly identical.

    - The hard form: Two fragments of code have nearly identical effects (at any conceptual
    level).


    # Why This Is a Problem


    +   Size: The code is bigger than it has to be, with more to understand.

    Flexibility: A design concept expressed more than once interferes with future
    changes; the change may be done in multiple places.

    Communication: Near-repetition interferes with how easily code is understood.
    (The reader must decide whether two things are really expressing one concept,
    and whether any differences are significant.)


    # When to Leave It


    Sometimes, what appears to be duplication is in fact coincidental. In such a case,
    folding the two places together would confuse the reader and create friction against
    future change.


    Very rarely, you might decide that the duplication is necessary to help the code
    communicate better, and choose to leave it in place.


    # How It Got This Way


    Some duplication occurs because programmers work independently in different parts
    of the system, and they not realize that they are creating almost identical code.
    Sometimes people realize there''s duplication, but they don''t have the time or
    inclination to remove it. Other times, duplication will be hidden by other smells;
    after those smells are fixed, the duplication becomes more obvious.


    Perhaps the most common case occurs when the programmers intentionally duplicate
    code. They find some code that is “almost” right, so they copy-and-paste it into
    the new spot with some slight alterations. This often happens on a red bar during
    test-driven development, when it is imperative to get to the green bar as quickly
    as possible.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# What to Do


    +   - If the duplication is within a method or in two different methods in the
    same class or module: Use Extract Method to pull the common part out into a separate
    method.


    +   - If the duplication is within two siblings: Use Extract Method to create
    a single method, Pull Up Method (and Pull Up Instance Variable if needed) to bring
    the common parts together. Then you may be able to use Form Template Method to
    create a common algorithm in the parent and unique steps in the children.


    +   - If the duplication is in two modules or in two unrelated classes: Either
    extract the duplication into a new class or module, or decide that the smell is
    Feature Envy so the common code really belongs in only one place.


    +   - In any of these cases, you may find that the two places aren''t literally
    identical but that they have the same effect. Then you may do a Substitute Algorithm
    so that only one copy is involved.


    # What to Look for Next


    +   - Abstraction: Look for ways to push related responsibilities together. You
    may find new classes waiting to emerge.'
  merge: -1
