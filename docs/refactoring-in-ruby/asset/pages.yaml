  md: '# Greedy Method


    # What to Look For


    +   - A method does more than one job.

    - A method has "and" in its name.

    - The body of the method includes code at several different levels of abstraction.


    # Why This Is a Problem


    > < Communication: A code fragment that has two responsibilities intertwined is
    harder to read, and harder to name.

    ~ Flexibility: If one of the method''s responsibilities must change, or has a
    defect, often have to work hard to sidestep the other''s responsibilities—it can
    therefore be a challenge to avoiding other code.

    ‡ Testability: a method that does two things is harder to test than if the responsibilities
    were separated.


    A method that does two jobs is often said to violate the Single Responsibility
    Principle (SRP); see Robert Martin''s Agile Software Development: Principles,
    Patterns, and Practices [21] for a broader explanation of the SRP.


    # How It Got Its Way


    When new behavior must be added, the quickest to do it is often to weave it into
    existing code.


    # What to Do


    +   - Consider the approaches to dealing with a Long Method—they will often here
    just as well. Use Extract Method to hide detail behind an intention-revealing
    name.

    - If the method makes use of another object, track it and fix the Feature Envy.

    - Look at the method''s parameters: Do they come from different "parts" of the
    application? Are some of them domain related, whereas others are technology related?
    Look for ways to extract methods whose parameter lists are more consistent.


    # What to Look for Next


    > < Communication: If you extracted one or more methods, check the whole system
    of names in their receiving class(es) to ensure it is still consistent.'
  merge: -1
