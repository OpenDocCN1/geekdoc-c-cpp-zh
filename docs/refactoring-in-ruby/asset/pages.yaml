  md: "To fix that, we're going to extract a module for the SVG methods. We'll put\
    \ it in a\nnew source file called svg.rb:\n\n```\nmodule SVG\ndef self.rect(centre\
    \ x, centre y, width, height, fill,\n      stroke width)\n  Q<rect x \"#{centre\
    \ x}\" y \"#{centre y}\"\n      width \"#{width}\" height \"#{height}\"\n    \
    \  fill \"#{fill}\" stroke \"#{stroke}\"\n      stroke width \"#{stroke width}\"\
    \ />\nend\n```\n\n# etc....\n\nA quick glance at this module shows that the Data\
    \ Clumps and Long Parameter\nLists we predicted are now a reality. (In fact, each\
    \ of these SVG elements take\nmore parameters than we have provided here, so the\
    \ problem is worse than it\nseems.) Note also that we haven't moved all of the\
    \ XML into the SVG module, but\nto do that we'll have to how to deal with nested\
    \ XML elements. We want to make\nthe calling script a little clearer before diving\
    \ into the design of the SVG interface.\n\n# Comments\n\nThere's a comment in\
    \ the SVG document generated by the script:\n\n```\n<! x axis >\n```\n\nThe comment\
    \ is there because it's difficult to match the magic SVG words and sym-\nbols\
    \ to the format and structure of a sparkline. We don't like commenting source\
    \ code,\nbut we have no problem creating a self-documenting SVG document, so we're\
    \ happy\nto keep the comment. The problem is that one comment isn't enough; the\
    \ output SVG\nneeds to have a few more! Worse, the script doesn't communicate\
    \ the sparkline's struc-\nt to us, its readers, and so we could easily break it\
    \ accidentally in the future. We'll\nfix both of these issues by extracting a\
    \ method for each component of the sparkline's\nstructure:\n\n```\ndef sparkline(points)\n\
    \  \"<! sparkline >\n  #{SVG.polyline(points, 'none', '#333', 1)}\"\n```"
