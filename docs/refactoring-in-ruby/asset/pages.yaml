  md: "# Chapter 1: A Refactoring Example\n\n+   * Reinvented Wheel: There are already\
    \ Ruby libraries for manipulating XML elements, and for creating SVG documents.\n\
    \nWhich we address first? When faced with a long-to-do list of code smells it's\
    \ easy to feel a little intimidated. It's important to remember at this stage\
    \ that we can't fix everything in one; we'll have to proceed in small, safe steps.\
    \ We also want to avoid planning too far ahead—the code will change with every\
    \ step, and right now it would be a futile waste of energy to attempt to visualize\
    \ what the code might be like a few minutes from now.\n\nIn the next few sections\
    \ we are simply going to address the smells that strike us \"next\" on the to-do\
    \ list, without regard to what \"next\" might mean, or what will happen after\
    \ that. It is entirely likely that you would address the smells in a different\
    \ order, and that's fine; experience suggests that we're likely to finish up at\
    \ approximately the same place later.\n\nFirst, let's tidy up a little.\n\n# Consistency\n\
    \nWe can easily remove the Dead Code and change the Global Variable; at the same\
    \ time we'll create a simple method for each SVG element type we use, and convert\
    \ quoted strings into:\n\n```\nNUMBER OF TOSSES      1000\n```\n\n```\ndef toss\n\
    \  2 * (rand(2)*2 1)\nend\n```\n\n```\ndef values(n)\n  a [0]\n  n.times { a <<\
    \ (toss + a[1]) }\n  a\nend\n```\n\n```\ndef rect(centre x, centre y)\n  Q<rect\
    \ x \"#{centre x 2\" y \"#{centre y 2\"\n  width \"4\" height \"4\"\n  fill \"\
    red\" stroke width \"0\" />\nend\n```"
  merge: -1
  pgno: 24
- img_proc: true
  md: "# # Consistency\n\n```\ndef text(x, y, msg)\n%(<text x=\"#{x}\" y=\"#{y}\"\n\
    \ family=\"Verdana\" font size=\"9\"\n fill=\"red\">#{msg}</text>)\nend\n```\n\
    \n```\ndef line(x1, y1, x2, y2)\n%(<line x1=\"#{x1}\" y1 \"#{y1}\" x2 \"#{x2}\"\
    \ y2 \"#{y2}\"\n stroke=\"#999\" stroke width=\"1\" />)\nend\n```\n\n```\ndef\
    \ polyline(points)\n%(<polyline fill=\"none\" stroke=\"#333\" stroke width=\"\
    1\"\n points=\"#{points.join(' ')}\" />)\nend\n```\n\n```\ndef spark(centre x,\
    \ centre y, value)\n\"<rect x=\"#{centre}\" y=\"#{y}\"\n<text x=\"#{centre}+6\"\
    , centre=\"#{y}+4\", value=\"#{value}\")\"\nend\n```\n\ntosses (NUMBER OF TOSSES)\n\
    points []\ntosses.each index |i| points << \"#{i},#{200 tosses[i]}\" )\n\n```\n\
    data\n%(<svg xmlns=\"http://www.w3.org/2000/svg\"\n xmlns:link=\"http://www.w3.org/1999/xlink\"\
    >\n< x axis>\n#(line(0, 200, NUMBER OF TOSSES, 200)\n#(polyline(points))\n#(spark(NUMBER\
    \ OF TOSSES, 1, 200, tosses[1]))\n</svg>)\n```\n\nputs \"Content Type: image+xml\"\
    \nContent Length: \\#{data.length}\"\n\n#{data}\"\n\nThe overall Greedy Method\
    \ is now somewhat more apparent, as we have more methods dealing with SVG elements.\
    \ However, note that each of the methods just added is also a Greedy Method, because\
    \ each knows something about an SVG element and about how we want the sparkline\
    \ to look. So we've traded some problems for others, and that's a very subjective\
    \ process."
