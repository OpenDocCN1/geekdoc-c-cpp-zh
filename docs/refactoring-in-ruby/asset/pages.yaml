  md: '# Parallel Inheritance Hierarchies


    What to Look For


    +   - You make a new subclass in one hierarchy and find yourself required to create
    a related subclass in another hierarchy.

    - You find two hierarchies where the subclasses have the same prefix. (The naming
    reflects the requirement to coordinate hierarchies.)


    This is a special case of Shotgun Surgery, discussed earlier.


    # Why This Is a Problem


    +   - **Duplication**: Every time we need to change the hierarchy—for example,
    to add another case—we also have to change the other, parallel hierarchy.

    - **Communication**: It''s cumbersome and error-prone, and probably doesn''t communicate
    the intent of the design very well.


    # How It Got This Way


    The hierarchies probably grow in parallel, a class and its pair needed at the
    same time. As, it probably wasn''t bad at first, but after two or more pairs get
    introduced, it becomes too complicated to change one thing. (Often both classes
    embody different aspects of the same decision.)


    This smell may happen along the way while improving a particularly tangled situation.


    # What to Do


    +   - Use *Move Field* and *Move Method* to redistribute the features in such
    a way that you can eliminate one of the hierarchies.


    # What to Look for Next


    +   - **Duplication**: As you merge classes from the two hierarchies, you may
    find **Duplicated Code** coming together in the same place.

    - **Communication**: Hopefully the merged classes now communicate the design clearly;
    look carefully at the names in use to make sure that is the case.

    - **Size**: Having fewer classes means less code to understand. But each class
    in the merged hierarchy is now likely to be bigger than it was, so look out for
    **Large Module** and **Greedy Module**.'
  merge: -1
  pgno: 170
