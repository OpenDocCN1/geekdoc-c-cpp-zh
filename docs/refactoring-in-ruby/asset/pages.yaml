  md: '# Preface


    I work mostly as an agile/XP/TDD coach, mostly working with teams developing C++
    or C# or Java applications, mostly for Microsoft Windows platforms. Early in engagement
    I will inevitably remind everyone on the team work through William Wake''s Refactoring
    Workbook [26], which I consider to be far and away the best book for any developer
    who wants to write great code. A short later in every engagement—and having a
    UNIX background myself—I urge on the team to improve their project automation
    skills by adopting a scripting language. I always recommend Ruby because it is
    easy to learn and object-oriented, and I generally recommend new teams to read
    Marick''s Everyday Scripting with Ruby [20] as a starter.


    Finally, one day in the summer of 2007, it dawned on me that there was one great
    book that I could combine those facets of all my projects, but one that hadn''t
    yet been written—a Refactoring Workbook for Ruby. So I contacted Bill Wake and
    suggested we write one, and you''re now reading the result.


    Compared with Bill''s original Refactoring Workbook, this edition has a similar
    structure but is otherwise a substantial rewrite. We have retained the core smells,
    added a few more, and reworked them to apply to Ruby''s more dynamic environment.
    We have replaced all of the code samples, or revised all of the exercises. We
    have also rewritten much of the introductory material, principally to reflect
    the rise in importance of test-driven development during the last five years.


    In short, we have tried to create a stand-alone Ruby refactoring workbook for
    the modern developer, and not a Java book with Ruby code samples. I hope we''ve
    reasonably close to that goal.


    > —Kevin Rutherford

    Summer 2009


    # What Is This Book About?


    Refactoring is the art of improving the design of existing code and was introduced
    to the world by Martin Fowler in Refactoring [14]. Fowler''s book provides dozens
    of detailed mechanical recipes, each of which describes the steps needed to change
    one (usually small) aspect of a program''s design without breaking anything or
    changing any behavior.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'xx


    Preface


    But to be skilled in refactoring is to be skilled not only in safely and gradually
    changing code''s design, but also in first recognizing code needs improvement.
    The agile community has adopted the term code smell to describe the anti-patterns
    in software design, the places where refactoring is needed.


    The aim of this book, then, is to help you recognize the smells in existing Ruby
    code and apply the most important refactoring techniques to eliminate them. It
    will also help you think about how to design code and to experience the joy of
    writing great code.


    To a lesser this book is also a reference work, providing a checklist for you
    review for smells in any Ruby code. We have also described the code smells using
    a standard format; for each smell we describe


    +   * What Look For: cues that help you spot it

    * Why This Is a Problem: the undesirable consequences of having code with this
    smell

    * When to Leave It: the trade-offs that may reduce the priority of fixing it

    * How It Got This Way: notes on how it happened

    * What to Do: refactorings to remove the smell

    * What to Look for Next: what you may see when the smell has been removed


    This should help keep the smell pages useful for reference even when you''ve finished
    the challenges.


    This book does not attempt to catalog or describe the mechanics of refactorings
    in Ruby. For a comprehensive step-by-step guide to Ruby recipes, we recommend
    Refactoring, Ruby Edition, by Jay Fields, Shane Harvie, and Martin Fowler [11],
    which is a Ruby reworking of Fowler''s Refactoring. It is also not our to describe
    smells in tests; these are already covered by Gerard Meszaros''s XUnit Test Patterns
    [22].


    # Who Is This Book For?


    This book is intended for practicing programmers who write and maintain Ruby code
    and want to improve their code “habitability.” We have tried to focus primarily
    on the universal principles of good design, rather than the details of advanced
    Ruby-fi. Nevertheless, we expect you to be familiar with most aspects of the Ruby
    language, the core classes, and the standard libraries. For some exercises you
    will also need an existing of Ruby code on hand; usually this will be from your
    own projects, but you could also use open source code in gems or downloaded applications.
    Familiarity with'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Preface


    refactoring tools or specific IDEs is not assumed (but the examples in this book
    will provide great help if you wish to practice using such tools).


    As mentioned above, it will be helpful to have Fields et al., Refactoring, Ruby
    Edition [11], as you work through the exercises. In addition to the mechanics
    of refactoring, we frequently refer to design patterns, particularly those cataloged
    by Gamma et al. [16]; you may also find it useful to have available a copy of
    Russ Olsen''s Design Patterns in Ruby [24].


    # What''s in This Book?


    This book is organized into three sections.


    Part I, “The Art of Refactoring,” provides an overview of the art of refactoring.
    We begin with an example; Chapter 1, “A Refactoring Example,” takes a small Ruby
    script containing some common smells and refactors toward a better design. Chapter
    2, “The Refactoring Cycle,” takes a brief look at the process of refactoring—when
    and how to refactor with both legacy code and during test-driven development—while
    Chapter 3, “Refactoring Step by Step,” looks in the details of how used and steps
    taken in a small refactoring. Finally, Chapter 4, “Refactoring Practice,” suggests
    some exercises that you can apply in your work and provides suggestions for further
    reading.


    Part II, “Code Smells,” is the heart of the book, focusing on Ruby code. Each
    chapter here contains descriptions of a few major code smells, followed by a number
    of exercises for you to work through. The challenges vary; ask you to analyze
    code, others to assess to revise code. Not all challenges are equally easy. The
    harder are marked “Challenging”; you will see these have room for variation in
    their answers. Some exercises have solutions (or ideas to help you find solutions)
    in Appendix A, “Answers to Selected Questions.” Where an exercise relies on Ruby
    source code you can download from www.refactoringruby.info.


    Part III, “Programs to Refactor,” provides a few “large” programs to help you
    practice refactoring in a variety of domains.


    Part IV, “Appendices,” provides selected answers to exercises and brief descriptions
    of currently available Ruby refactoring tools.


