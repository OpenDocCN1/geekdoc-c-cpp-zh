  md: '# Measurable Smells


    D. Strictly speaking, the non-! version of the method is redundant—for example,

    could create a reversed copy of a String


    ```

    reversed copy String.new(original).reverse!

    ```


    However, this is a common operation that a method has been provided in

    order to avoid duplication.


    Note that the non-! version is “safe”—it does not modify its receiver. So by

    using a naming convention that makes it somewhat more natural to call the safe

    version of the method, Ruby helps avoid the introduction of insidious defects.


    E. On balance, we don’t consider the size of the String API to be a smell. It’s
    a spe-

    case: String lives at the heart of Ruby’s power and expressiveness, and that’s
    a

    tradeoff we’re happy to make.


    It might be argued that String could be subclassed, so that methods for specific

    p own were only made after conversion to a different object (pack and

    unpack are obvious candidates here). But for most uses, Ruby’s efficacy as a scripting

    language would be compromised by breaking up String.


    As a final point, we tend to consider this smell as applying to the “units” from
    which

    t run-time classes are specified. For example, if a small class includes a large
    mod-

    ule the specification of the class is still small. The Large Module is mostly

    out about the flexibility of the code as written.


    F. The principal reason for the difference is that Java lives on static typing.
    In Ruby

    and Smalltalk, any message can be sent to any object, whereas Java attempts to

    prevent illegal messages at compile time. In Java, one cannot treat any object

    as an array, but in Smalltalk any object can receive at:. The set of interrelated

    interfaces required in order for Java’s Object class to support many of the methods

    available in Ruby or Smalltalk is hard to imagine, and may not even be achievable

    without introduction of multiple inheritance.


    The other main reason is that Java has language entities that are not objects,
    such

    as and ints. Many functions that manipulate these entities have no obvious

    home therefore live as Utility Functions in various libraries. Whereas in Ruby

    and Smalltalk, the same concepts are implemented as proper objects, so those

    ity functions can be methods. Inevitably, some of them will migrate up the class

    hierarchy and become methods available to every object.


    The other impact of having primitives such as int in a language that the lan-

    gauge itself must then support for loops and the like. In Ruby and Smalltalk,

    these procedural constructs can be replaced by methods on Fixum, for example.

    Again, over time some of these methods will migrate up the class hierarchy.'
