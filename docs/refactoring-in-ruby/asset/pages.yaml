  md: '# Complicated Boolean Expression


    What to Look For


    +   - Code has complex conditions involving and, or, and not.


    Why This Is a Problem


    +   - Communication: Any code that requires the reader to resort to dry runs or
    drawing truth tables is going to slow everyone it encounters.

    - Flexibility: A complex Boolean expression can be a “no-go area,” discouraging
    developers from changing the code around it.


    When to Leave It


    You may be able to find others to simplify the expressions, or you may find that
    the rewritten expression communicates less than original.


    How It Got This Way


    The code may have been complicated from the beginning, or it may have picked up
    additional conditions along the way. Sometimes code like this has been directly
    translated from a textbook calculation or formula.


    # What to Do


    +   - Flip the sense:

    if !a becomes unless a

    and

    unless !a becomes if a

    - Apply DeMorgan''s Law:

    !(a && b) becomes (!a) || (!b)

    and

    !(a || b) becomes (!a) && (!b)


    You may find that some variables will communicate better if they change names
    to reflect their flipped sense.'
  merge: -1
