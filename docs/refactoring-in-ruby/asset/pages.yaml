  md: '# CHAPTER 11


    # Inheritance


    The relationship between a class and its subclass starts being simple but gets
    complicated over time. A subclass often depends on its parent more intimately
    than a separate class, but it can go too far.


    A key challenge is deciding what a class *is* (behaves like) versus what a class
    *knows*. A class structure often starts with inheritance and moves to a more compositional
    style over time.


    In this chapter we''ll cover the following smells:


    +   * **Implementation Inheritance**, in which subclassing is used purely to reuse
    code

    * **Refused Bequest**, in which a subclass isn''t substitutable for its superclass

    * **Inappropriate Intimacy (Subclass Form)**, in which a subclass is tangled up
    in its superclass’s implementation details

    * **Lazy Class**, in which a class doesn''t do much'
  merge: -1
