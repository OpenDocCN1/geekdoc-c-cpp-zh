    \ *Hexagonal Architecture* [9], you will find this is most often true within the\
    \ Adapters.\n\nA single case statement is sometimes used in a Factory or Abstract\
    \ Factory. For more information, see Gamma et al.’s *Design Patterns* [16].\n\n\
    Sometimes a case statement is used in several related places to control a state\
    \ machine. It may make sense as is, but refactoring to the State pattern (see\
    \ Design Patterns [16]) is often more appropriate.\n\n# Exercise 9.5: Factory\
    \ Method\n\nYour solution will look something like this:\n\n```\ndef make driver\n\
    \  case @type\n    when USE MEMORY DRIVER\n      return MemoryDriver.new\n   \
    \ when USE DEBUG DRIVER\n      return DebugDriver.new\n    when USE PRODUCTION\
    \ DRIVER\n      return ProductionDriver.new\nend\n```\n\nThis design contains\
    \ some duplication, because the values in the enumerated list must be kept in\
