  md: '# Chapter 3: Refactoring Step by Step


    changing the design, and yet it''s unsafe to change the design without tests.
    (If you find yourself in this position, you may find the techniques in Michael
    Feathers'' Working Effectively with Legacy Code [10] helpful.) And note, by the
    way, areas that are tricky to test often indicate other problems in the design.


    +   - Testing Framework: `Test::Unit` is installed as part of the standard Ruby
    distribution, and `rspec` is available as a gem. It can also be very handy to
    have `autotest` run your tests while you work.


    We have provided `rspec` examples for most of the code samples used in the exercises;
    you''ll find them in the download. Get into the habit of running them as you review
    the code in each exercise.


    +   - CRC (Class, Responsibilities, Collaborators) Cards or UML Sketches: Refactoring
    is design. You may hold a CRC session or draw Unified Modeling Language (UML)
    sketches to compare alternative strategies, particularly when moving responsibilities
    among classes or modules. (For more detail on the CRC card approach, Kent Beck
    and Ward Cunningham''s article “A Laboratory For Teaching Object-Oriented Thinking”
    [5]).


    +   - Configuration Management/Version Control: If you make a mistake while refactoring,
    you''d like the option to return to the last known good point. Alternatively,
    you may want to apply a refactoring, but you may not be sure if the result will
    be improvement; it could be helpful to have the option to try it and then decide
    whether to keep the result. Either way, it''s worth getting into the habit of
    committing code (every time the tests pass), and it''s worth making sure you have
    a version control system that lets you do.


    +   - Sophisticated Development Environment (IDE): A few Ruby environments now
    have growing integrated for automated refactoring tools (see Appendix B, “Ruby
    Refactoring Tools,” for details of these). Tools can remove a lot of the error-prone
    tedious of refactoring. but most refactorings have no tool support, and even with
    automation you still have to decide which refactoring to apply.


    # Inside a Refactoring


    One of the defining aspects of refactoring is the focus on safe transformations.
    We''ll walk through a simple refactoring. Along the way we will derive guidelines
    that will help us understand how refactoring works.


    Consider the refactoring `Hide Delegate`. Its goal is to encapsulate the path
    to an object, so that clients are decoupled from the implementation of how to
    reach it.'
