  md: '# Procedural Code


    What to Look For


    +   - An algorithm proceeds step by step, possibly using one or more temporary
    variables to hold intermediate values.

    - Code iterates over the contents of an Array or Hash, instead of using an approach
    based on each.

    - A code fragment uses a local variable to cache an intermediate result.


    # Why This Is Is a Problem


    +   - **Duplication**: Every collection in Ruby (and indeed any) already provides
    methods that iterate over its elements, iterating in your own code is almost always
    a kind of **Reinvented Wheel**.

    - **Flexibility**: Any method that iterates over a collection *and* does something
    with the elements is arguably a **Greedy Method**.

    - **Simplicity**: Local variables, especially when used to manage iteration, can
    add clutter and obscure a method''s flow. They can also hammer refactorings such
    *Extract Method*.

    - **Communication**: In any language, using the language''s own idioms helps communicate
    the code''s intent to the widest audience. In order to be communicative, your
    code should be written using the styles and idioms of your community. **Procedural
    Code** is not idiomatic in Ruby circles.


    # When to Leave It


    Sometimes a code fragment uses a well-named local variable to help explain the
    steps in an algorithm or the reason the design is like it.


    # How It Got This Way


    During test-driven development, a procedural solution is often the quickest next
    step to get from a red to a green bar. Or, the original code was written by someone
    not used to Ruby''s more functional and object-oriented style.


    # What to Do


    +   - If you''re iterating over a collection, *Replace Loop with Collection Closure
    Method*—for example, using `select`, `reject`, or `collect`.'
