  md: "# Sparkline Script 5\n\ncharacteristics, consequences, and remedies. For the\
    \ purposes of this quick refactoring demonstration, we will use the names of these\
    \ smells (so that you can cross-reference with Part II, “Code Smells,” if you\
    \ wish), but otherwise we just want to get on fixing the code. Here are the more\
    \ obvious problems we noticed in the code:\n\n+   - **Comments:** There's a comment\
    \ in the SVG document (line 29). As a comment in the SVG output that's not a bad\
    \ thing, because the SVG is quite opaque. But it also serves to comment the Ruby\
    \ script, which suggests that the string is too complex.\n\n+   - **Inconsistent\
    \ Style:** Part of the SVG document is broken out into a separate method (line\
    \ 34), whereas most is built inline in the `data` string.\n\n+   - **Long Parameter\
    \ List:** Strictly speaking, the list of properties of the XML elements aren't\
    \ Ruby parameters. But they are long lists, and we feel sure they will cause problems\
    \ later.\n\n+   - **Uncommunicative Name:** The code uses `data` as the name of\
    \ the SVG document, i as an iterator index (line 25), a as the name of an array\
    \ (9), and n as the number of array elements (line 8).\n\n+   - **Dead Code:**\
    \ The constant `BORDER WIDTH` (line 2) is unused.\n\n+   - **Greedy Method:**\
    \ \n**Derived Value:** Most of the numbers representing SVG coordinates and shapes\
    \ could probably be derived from the number of tosses and the sparkline's max\
    \ and min values.\n\n+   - **Duplicate Code:** The text markers for the start\
    \ and end tags of XML elements are repeated throughout the code; the calculation\
    \ `200 tosses[x]` is repeated (lines 25, 34).\n\n+   - **Data Clump:** The SVG\
    \ components' parameters include several x-y parameters represent on the display\
    \ canvas (lines 15, 18, 30). Some have further parameters that make up a rectangle\
    \ (lines 16, 30). Strictly, these are parameters to SVG elements, and this is\
    \ therefore a problem in the definition of SVG.\n\n+   - **Global Variable:**\
    \ Why is `tosses` a global variable at all?\n\n+   - **Utility Function:** One\
    \ might argue that all of the methods here (lines 4, 8, 14) are Utility Functions.\n\
    \n+   - **Greedy Module:** The script isn't a class, as such, but it does multiple\
    \ responsibilities: Some of the script deals with tossing, some with drawing pictures,\
    \ and some wraps the SVG document in an HTTP message.\n\n+   - **Divergent Change:**\
    \ The `data` string (lines 27–35) is probably going to be different for almost\
    \ every imaginable variation on this script."
