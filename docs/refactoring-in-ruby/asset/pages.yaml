  md: '# Foreword


    When it comes to the awkwardness this book teaches you to correct, efficient thinking
    and automatic behavior are important. To get good at this, it’s not enough to
    be able to search for awkwardness—it has to leap out at you as you travel the
    code. Deed, I find Kevin and Bill—like most who write about refactoring—describe
    awkwardness as “code smells.” That’s small is probably the most powerful, primitive,
    and controllable of senses. When you open up a container and the smell of rotting
    meat hits your brain, you move. You act. The smell of rotting code should do the
    same, but it will only do so after practice bleeds well-worn trails through your
    brain.


    SO: DO THE EXERCISES.


    The reason this book will be valuable to you forever is that computers are quite
    unsettled to most problems that need solving. Pigheadedly insist that we squeeze
    every drop of ambiguity out of a world that’s flooded with it. That’s a ridiculous
    … impossible … inhuman demand that we put up with only because computers are so
    fast. As a result of this fundamental mismatch—this requirement that we make up
    precision—it takes


    The humble and effective way to arrive at such a program is to put a fledgling
    version into the world, watch what happens, and reshape it (the program, not the
    world—although people try that too) to make the mismatch less awkward. (And then
    we do it, again, and again.) That’s an intellectual adventure, especially when
    you spot concepts implicit in the code that no one ever quite recognized before,
    concepts that suddenly open up vast new possibilities and require only a few …
    well, maybe more than a few … minor … well, maybe not so minor … changes.


    Without refactoring, and the style it promotes and supports, the changes the program
    needs will be daunting too often. With it, you need never look at a program with
    familiar sense of hopeless dread.


    And won’t that be nice?


    > Brian Marick

    July 4, 2009


    xviii'
