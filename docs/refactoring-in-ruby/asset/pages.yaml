  md: '# Long Parameter List


    What to Look For


    +   - A method has more than one or two parameters.

    - A method yields more than one or two objects to an associated block.


    # Why This Is a Problem


    +   - **Simplicity**: A Long Parameter List often indicates that a method has
    more than one responsibility. Sometimes the parameters have no meaningful grouping—they
    don’t go together. In such cases it may be that the method, or the objects it
    uses, doesn’t represent a meaningful and cohesive abstraction in the problem domain.

    - **Flexibility**: A Long Parameter List represents a large number of pieces of
    shared information between the called and caller code. If either, the parameter
    list is likely to need changing too.

    - **Communication**: A lot of parameters represent a lot to remember—the programmer
    has to remember not only what objects to pass, but in which order. More APIs are
    easier and quicker to use.


    # When to Leave It


    This is one of places where a smell doesn’t always equate to a problem. You might
    smell a Long Parameter List List but decide it’s right for the situation at hand—for
    example, to avoid the called method picking up a dependency that you don’t want
    to have. Ensure that your changes don’t upset this balance.


    # How It Got This Way


    You might be trying to minimize coupling between objects. Instead of the called
    object being aware of relationships between classes, you let the caller locate
    everything: the method contends on what it is being asked to do with the pieces.

    The method may have acquired many parameters because the programmer generalized
    to deal with multiple variations by creating a general algorithm with a lot of
    control parameters.


    # What to Do


    +   - If a parameter’s value can be obtained from another object this one already
    knows, use *Replace Parameter with Method*.'
