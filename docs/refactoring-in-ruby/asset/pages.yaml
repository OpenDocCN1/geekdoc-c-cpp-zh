  md: '# Implementation Inheritance


    Class first and have both parent and child classes delegate to the new class,
    or perhaps the child class should inherit from the new class.


    +   If (some of) the inherited methods do need to be public on the subclass, use
    Extract Module to make them shareable and then delete the inheritance relationship.
    Alternatively, use Replace Inheritance with Delegation and reimplement the child
    class to as a Middle Man for those methods.


    # What to Look for Next


    +   Communication: Removing unwanted inherited methods gives the class’s public
    interface a shake-up. Look through the whole class to check for Inconsistent Names
    or module you extracted, checking for naming smells (see Chapter 6, “Names,” for
    a list of these).


    +   Simplicity: You may find that other implementation decisions depended on,
    or were related to, the one you have just fixed. In particular, look through both
    original classes for examples of Feature Envy in relation to the extracted class
    or module.'
