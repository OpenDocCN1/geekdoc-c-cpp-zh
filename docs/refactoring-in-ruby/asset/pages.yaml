  md: '# Data Clump


    # What to Look For


    +   - The same two or three items frequently appear together in classes and parameter
    lists.

    - A group of instance variable names start or end with similar substrings.


    # Why This Is a Problem


    +   - **Duplication**: The recurrence of the items often means there is duplicate
    code spread around to handle them.

    - **Abstraction**: There may be a missing concept, making the system harder to
    understand.


    # When to Leave It


    Passing a *Whole Object* sometimes introduces a dependency you don''t want (as
    lower-level classes exposed to the whole new object instead of just its components).
    You may continue to pass in the pieces to prevent this dependency.

    Very rarely, there is a measured performance problem solved by passing in the
    parts of the object instead of the object itself. Recognize that this is a compromise
    in the object model for performance. Such code is worth commenting!


    # How It Got This Way


    The items are typically part of some other entity, but yet no one has the insight
    to realize that there''s a missing class. Or, sometimes, people know the class
    is missing but think it''s too small or unimportant to stand alone.

    (Identifying these classes is often a major step toward simplifying a system,
    and it often helps you to generalize classes more easily.)


    # What to Do


    +   - If the items are instance variables in a class, use *Extract Class* to pull
    them into a new class.

    - If the values are together in method signatures, use *Introduce Parameter Object*
    to extract the new object.'
  merge: -1
