  md: '# Alternative Modules with Different Interfaces


    What to Look For


    +   - Two classes or modules seem to be doing the same thing but are using different
    method names.


    Why This Is a Problem


    +   - Flexibility: Maintaining two similar chunks of code can be time-consuming
    and costly.

    - Communication: Having different names for the same concept makes code harder
    to understand.

    - Abstraction: Different names interfere with your ability to pull common code.


    When to Leave It


    Even with Ruby''s open classes, it''s not always expedient to change interfaces
    (e.g., if both are in different libraries that you''d rather own). Each library
    may have its own vision for the same concept, but you may be left with no good
    way to unify them.


    How It Got This Way


    People create similar code to handle similar situations, but don''t realize the
    other code exists.


    What to Do


    Harmonize the classes or modules so that you can eliminate one of them.


    +   1. Use Rename Method to make method names similar.

    2. Use Move Method, Add Parameter, and Parameterize Method to make protocols (method
    signatures and approach) similar.

    3. If you have two classes that are similar but not identical, extract Superclass
    after you have them reasonably well harmonized. For similar modules, extract a
    shared module or class that they can use.

    4. Remove the extra class or module if possible.


    What to Look for Next


    +   - Duplication: You may be able to extract common helper or superclasses.'
