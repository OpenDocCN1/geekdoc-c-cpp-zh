    +   - Follow Your Nose: Pick a code smell in a good-sized project. Eliminate it,
    and review the changed code looking for other smells (this book''s What to Look
    for Next sections will help). For each of the smells you now see, repeat. and
    so on. After 30 or 45 minutes, review both the resulting code and the journey
    you traveled. To do more? Did all the moves pay off? Did you go around circles
    at any point?

    - Harmonizing: Many of the code smells described in this book are fundamentally
    about some kind of duplication: identical code, similar code, code with similar
    structure, code with similar effects. Duplication isn''t always obvious, and sometimes
    the code needs to be changed to reveal it. You can often make refactoring moves
    that make latent duplication explicit. Practice harmonizing things that to be
    similar.


    For example, you may see code with the same effect, but using a different algorithm;
    you can substitute one of the algorithms so you can move to a single copy. Or
    suppose you have essentially the same method in two subclasses, except they have
    different names. You can rename them to the same name, so that you could pull
    the method into the parent. Or perhaps you have two methods that have some parts
    that are similar and other parts that are unique; you can tear apart the method
    so the similar parts are identical and the unique parts are separate, and eliminate
    the duplication.


