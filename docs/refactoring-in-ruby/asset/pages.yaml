  md: 'Migrate


    # Introduce


    These actions introduce a new element of some sort.


    +   - Add a new field, method, or class: It will initially be unused, but it can
    be a target for new usages. For example, you might create a new empty method that
    will soon get moved over from an existing method.

    - Introduce a new mechanism delegating to the old: You can migrate things to use
    the new method, then inline the old method into the new.

    - Introduce a new, independent mechanism: Migrate from the old mechanism to the
    new one.

    - Copy: Copy code. For example, when you Extract Method, you copy the original
    code to the newly created method. We are not advocating copy-and-paste programming;
    two copies of the code will temporarily exist, but one will have deleted by the
    time we reach the end of this refactoring micro-process.


    # For each


    This action lets you look at all occurrences of something.


    +   - Iterate over all uses of the code you want to change. Depending on the type
    of refactoring, this could involve calls, conditional branches, records, tables,
    methods, fields, classes, references, and so on.


    # Migrate


    These actions take you from an old way of doing something to the new way.


    +   - Move a user of the old mechanism to the new one: For example, change a reference
    from the old to the new.

    - Replace: Replace something by its equivalent.

    - Adjust to a new context: For example, the code used in Extract Method may need
    declarations, parameters, etc. to be modified.

    - Rename: Giving a code element a more meaningful or intention-revealing name.'
