    It''s time we looked in detail at the mechanics of refactoring. In this chapter
    we''ll work through the steps involved in Hide Delegate; but first we need to
    review our tools.


    # The Refactoring Environment


    Refactoring can be done on any code at any time, but it''s easier and safer with
    a supportive environment. Be sure to have most of the following tools ready at
    your side before you begin refactoring:


    +   * Team or Partner: For nontrivial decisions about code, it''s helpful to find
    out more than one person considering the problem. A team can often generate ideas
    better than one person alone: Different people have different experiences and
    different exposure to different parts of the system.

    * Tests: Even though refactorings are designed to be safe, it''s possible to make
    a mistake while applying. By having a test suite that is run before and after
    refactoring, you ensure that you change the design of your code, not its effects.


    > “If you want to refactor, the essential precondition is having solid tests.”

    —Martin Fowler [14]


    This is even more true for Ruby than it was when Fowler wrote about refactoring
    in Java. Because in Ruby there''s no compile step: The only way to find out our
    code works is to run it.


    What if you don''t have tests? Then add them, at least to the areas affected by
    the refactoring. Sometimes this is tricky—you may be unable to test effectively
    without'
