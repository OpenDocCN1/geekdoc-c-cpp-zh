    http://www.w3.org/1999/xlink\">\n#(x axis)\n  #(sparkline)\n  #(spark)\n</svg>\n\
    ```\n\n```\nprivate\n```\n\n```\ndef x axis\n  \"<!<x axis >\"\n  #(SVG.line(0,\
