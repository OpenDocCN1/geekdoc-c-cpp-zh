  md: '# Refused Bequest


    What to Look For


    +   * **Explicit Refusal**: The subclass defines an inherited method, makes an
    inherited method private, or makes it throw an exception when it is called.

    * **Implicit Refusal**: A method inherited from the parent class doesn''t work
    for instances of the subclass.

    * An inheritance relationship between two classes doesn''t make sense; the subclass
    isn''t an example of the parent.


    # Why This Is a Problem


    +   * **Simplicity**: Rejecting a parent''s method violates the Liskov Substitution
    Principle (LSP). The refusal of the subclass to implement an inherited method
    that of its clients must cope with refusal in some way.

    * **Duplication**: The clients need to know which class they are dealing with,
    so that they know they can safely invoke the refused method.

    * **Flexibility**: We have pushed one of the subclass''s responsibilities out
    into other classes, which will hamper future change.


    # When to Leave It


    If the inherited method was refused in order to prevent a Combinatorial Explosion,
    you may decide to live with the smell.

    If you leave this smell in place, move to an explicit refusal by having the subclass
    raise an exception when a parent method is refused. If you just leave implicit,
    you can get strange behavior that is difficult to track down.


    # How It Got This Way


    There may be a conscious decision to let subclasses deny use of some features
    to prevent an explosion of types for all feature combinations. More often, it''s
    just a lazy borrowing of parts of the parent''s implementation.


    # What to Do


    +   * First, check if this is actually a disguised case of Implementation Inheritance;
    if so, fix that smell first.'
  merge: -1
  pgno: 140
