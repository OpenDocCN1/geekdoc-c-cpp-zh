  md: '# CHAPTER 7

    Unnecessary Complexity


    Code is sometimes more complicated than it would have to be purely to solve the
    problem at hand. There are three main causes for this problem:


    +   - Code shows the traces of its history, the leftovers from old ways of doing
    things; the current complexity of the code owes more to the past—and to the journey
    travelled—than to generalized.

    - The design has been over-generalized. This is often done in anticipation of
    future requirements, or for premature performance tuning.

    - The original developers were unfamiliar with Ruby—they didn’t know that there
    was a language feature or a library method that does what they need.


    Remove these problems when you run into them. You''ll often find that this can
    lead to further insight and simplification.

    In this chapter we''ll cover the following smells:


    +   - Dead Code, in which some code is unused

    - Speculative Generality, in which code exists “just in case"

    - Greedy Method, in which a method has more than one responsibility

    - Procedural Code, in which code proceeds step by step

    - Dynamic Code Creation, in which class eval and friends are used to create code
    at run-time'
  merge: -1
