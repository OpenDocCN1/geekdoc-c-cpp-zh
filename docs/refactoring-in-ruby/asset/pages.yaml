  md: "# Testability\n\nWe changed quite a lot of code there, and each time we extracted\
    \ a method we re-ran the script to make sure we hadn't broken the sparkline. But\
    \ the HTTP wrapper (lines 52–54) forces us into a particularly unfriendly test\
    \ environment. So to improve testability, we'll delete that HTTP wrapper and simply\
    \ replace it with:\n\n```\nputs data\n```\n\nMore on testing as we proceed, but\
    \ for now that little change makes it easier to run sparky.rb.\n\n# Greedy Methods\n\
    \nEach of the SVG drawing methods we extracted is greedy, because they know about\
    \ SVG and sparkline formatting. We want to address next, because those two kinds\
    \ of knowledge are likely to change at different rates in the future.\n\nWe'll\
    \ begin with rect: we passed in two parameters from the caller, but to make this\
    \ method fully independent of the sparklines application we need to pass in 5:\n\
    \n```\nrect(centre x, centre y, width, height,\n  fill, stroke, stroke width)\n\
    Q(<rect x \"#{centre x}\" y \"#{centre y}\"\n  width \"#{width}\" stroke \"#{height}\"\
    \n  fill \"#{fill}\" stroke \"#{stroke}\"\n  stroke width \"#{stroke width}\"\
    \ />)\n```\n\nThis is ugly, but right it's what the code seems to want. We're\
    \ trading one small for another again here, but little bits of flexibility and\
    \ maintainability are created as by-products.\n\nThe caller changes to match:\n\
    \nSQUARE SIDE 4\n\n```\nspark(centre x, centre y, value)\n  \"#{rect(centre x\
    \ (SQUARE SIDE/2), y (SQUARE SIDE/2),\n  SQUARE SIDE, SQUARE SIDE, 'red', 'none',\
    \ 0))}\n  \"#{text(centre x+6, centre y+4, value)}\"\n```\n\nThe changes to spark\
    \ have Derived Values apparent, so we also took the opportunity to fix that by\
    \ introducing a constant for the size of the little red square."
  merge: -1
