  md: '# Appendix A: Answers to Selected Questions


    +   Mixing domain and screen classes makes the domain depend on its presentation;
    this is backward. It''s better to have them separate so the domain classes can
    be used with an entirely different presentation.


    The performance can go either way. When they''re in one object, the domain class
    updates its value using widget methods. This is typically slower as it takes into
    account buffering, screen updating, and so on.


    On the other hand, the synchronization can become relatively costly. On some occasions,
    you have find a way to make this notification cheaper. Sometimes, a domain class
    can avoid notifying a widget about events that don''t affect it.


    # Exercise 8.6: Ruby Libraries


    A. Examples:


    +   There are dozens of graphics libraries, each offering a binding to a different
    underlying graphics engine.


    +   There are numerous ways of working with HTTP, both in the standard distribution
    and in the Ruby Application Archive (http://raa.ruby-lang.org/). Similarly for
    CGI.


    +   The Logger and log4 libraries.


    +   Many core and standard modules and classes offer aliases for certain methods—for
    example, Enumerable offers both map collect—the same method with two different
    names.


    B. Reasons for the duplication:


    +   The most common reason seems to be that chestnut—historical reasons. Ruby''s
    developers are understandably reluctant to change published interfaces that many
    people depend on. Instead of changing things, they add more, even if it overlaps
    in intent or code.


    +   In something as big as Ruby''s libraries, there are many people working on
    them, and they don''t always coordinate enough to realize that they''ve duplicated
    work.


    +   Synonyms provide compatibility with similar functionality in other languages.
    It''s cheap to offer a synonym for a method, so it can be tempting to help developers
    transition to Ruby by providing them with familiar APIs.


    +   The Ruby libraries are open source, and some early libraries are no longer
    maintained by their original creators. Later, when someone finds a defect or a
    shortfall in one of those libraries, it can seem easier and quicker to simply
    start over and create a new library.'
