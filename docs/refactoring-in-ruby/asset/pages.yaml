    \nIn a pure object-oriented language such as Ruby, there's another way in which\
    \ classes acquire methods: by fixing the Feature Envy and Utility Function smells.\
    \ For example, in a procedural language, to i might be a library function taking\
    \ a single String parameter; here, it is moved onto the parameter's class—String\
    \ in this case. And because there's only one kind of string in Ruby, the String\
    \ class has acquired methods from all the contexts in which it is used by the\
    \ other core and standard library classes.\n\n+   B. A String object is both a\
    \ sequence of bytes and a piece of meaningful text. In addition to the mix-in\
    \ methods, we found the following groups of methods in class String (yours may\
    \ well vary):\n\n+   String as a first-class object: inspect, to s, etc.\nString\
    \ as a sequence of bytes: [], reverse, etc.\nString as a data container: crypt,\
    \ unpack, etc.\nText formatting: center, justify, strip, etc.\nText processing:\
    \ capitalize, downcase, tr, etc.\nPattern matching: index, split, sub, etc.\n\
    String as a value: next, to i, upto, to.\nString as a symbol name: intern, to\
    \ sym, etc.\n\n+   C. On the one hand, aliases increase the size of the class's\
