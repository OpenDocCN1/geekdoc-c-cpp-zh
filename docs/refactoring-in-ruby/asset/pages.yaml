  md: '# Lazy Class


    # What to Look For


    +   - A class isn''t doing much—its parents, children, or clients seem to be doing
    all the associated work—and there isn''t enough behavior left in the class to
    justify its continued existence.

    - Lazy Class is a close relative of Dead Code.


    # Why This Is a Problem


    +   - Simplicity: Every additional class in the application represents something
    extra to understand, and extra code to navigate while following a flow.

    - Communication: A Lazy Class also occupies one of the names in your domain space,
    without paying for that usage.


    # When to Leave It


    Sometimes, a Lazy Class is present to communicate intent. You may have to balance
    communication versus simplicity in your design; and when communication wins, leave
    the Lazy Class in place.


    Other times, a class that appears to be lazy exists as part of the scaffolding
    for a framework. You could tid it up, or leave it in place for compatibility.


    # How It Got This Way


    Typically, all the class''s responsibilities were moved to other places in the
    course of refactoring. Sometimes, the class was created in anticipation of some
    grand design that never materialized. Certain generators for Ruby on Rails create
    Lazy Classes to serve as hooks or placeholders for idioms you may or may not use
    in your application.


    # What to Do


    +   - If parents or children of the class seem like the right place for the class''
    behavior, fold it into one of them via Collapse Hierarchy.

    - Otherwise, fold its behavior into its caller via Inline Class.'
  merge: -1
