  md: '# Message Chain


    # What to Look For


    +   - You see calls of the form a.b.c.d.


    (This may happen directly or through intermediate results.)


    # Why This Is a Problem


    +   - Flexibility: A Message Chain couples the caller to the details of how to
    reach other objects. This coupling goes against two axioms of object-oriented
    programming: the Law of Demeter (see Exercise 12.7) and Tell, Don''t Ask, which
    says that instead of asking for objects you can manipulate them, you should tell
    them to do the manipulation for you. (Andrew Hunt and David Thomas'' The Pragmatic
    Programmer [17]) describes both of these rules in more detail.


    # When to Leave It


    Sometimes the cleanest way to construct or configure a complex of objects is to
    use a Cascade (Smalltalk Best Practice Patterns [2]) or when Martin Fowler calls
    a Fluent Interface [13]. Domain-specific languages (DSLs) often use this approach
    to provide the context necessary to enable a simplified syntax; it looks as if
    the caller is being encouraged to build a message chain, but usually the methods
    all return self. (It''s much more of a problem when the chain of calls is coupling
    to several different objects.)


    This is a trade-off refactoring. If you apply Hide Delegate too much, you get
    to the point where everything''s so busy delegating that nothing seems to be doing
    any actual work. Sometimes it''s just easier and less confusing to call a small
    chain.


    # How It Got This Way


    When you know the relationships among a group of objects, often the fastest way
    to a green bar during test-driven development (TDD) is to introduce a Message
    Chain.


    # What to Do


    +   - If the manipulations actually belong on the target object (the one at the
    end of the chain), use Extract Method and Move Method to put them there.

    - Part of the chain may belong on some other object; look for Inappropriate Intimacy'
  merge: -1
