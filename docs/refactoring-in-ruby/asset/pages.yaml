  md: '# CHAPTER 12


    # Responsibility


    It''s hard to get the right balance of responsibility between objects. One of
    the beauties of refactoring is that it lets us experiment with different ideas
    in a way that lets us safely change our minds.


    There are tools we can use to help us decide how our objects should work together,
    such as design patterns and CRC cards (see “Laboratory for Teaching Object-Oriented
    Thinking” [5]).


    Refactorings are often reversible, and they may trade off between two good things.
    A good example of this is Message Chain versus Middle Man. Sometimes there''s
    a way to improve both smells at the same time, but many times it''s a balancing
    act between them.


    In this chapter we''ll cover the following smells:


    +   - Feature Envy, in which an object is peppered with requests from another
    code fragment

    - Utility Function, in which a method belongs somewhere else

    - Global Variable, in which a global variable is used

    - Inappropriate Intimacy (General Form), in which a class depends on implementation
    details of another class

    - Message Chain, in which a method digs into the structure of another group of
    objects

    - Middle Man, in which an object merely delegates to another

    - Greedy Module, in which a class or module has more than one responsibility'
  merge: -1
