  md: "# Exercise 14.2: Closed Classes\n\n+   A. The ability to redefine the methods\
    \ of any class means that developers could alter their standard meanings. Worse,\
    \ existing tested production code could be subverted by a few careless keystrokes.\n\
    \nAgile development approaches rely on the premise that many aspects of an application\
    \ will quickly stabilize, even when the requirements themselves are fluid. Part\
    \ of the speed of these approaches comes from being able to rely on the correctness\
    \ of increasingly large parts of the application. But if just one developer on\
    \ the team has the habit of customizing core parts to enforce local convention\
    \ or personal whim, the cost-of-change curve will shoot back up and the productivity\
    \ gains will be lost.\n\n(We have seen this effect firsthand in C++ code, where\
    \ an overloaded + operator did something very unexpected when applied to a Matrix;\
    \ the resulting code looked straightforward, but wasted huge amounts of time until\
    \ \"surprise\" was uncovered.)\n\n+   B. One approach is local coding standards\
    \ and conventions, such as Don’t redefine methods of core classes.\n\n+   C. Calling\
    \ freeze on any object prevents its instance variables from being changed, and\
    \ applying it to a Class thus prevents changes to its methods:\n\n```\nclass Foo\n\
    \  # method definitions etc...\n  freeze\nend\n```\n\nHowever, a frozen class\
    \ can still be subclassed, and the subclass is not frozen. The Ruby community\
    \ is enjoying the challenge of searching for a bulletproof solution to this problem,\
    \ far without success. It is likely that convention, coupled with trust and common\
    \ sense, is the only practical way to deal with Ruby’s largeness.\n\n# Exercise\
    \ 14.3: Missing Function\n\n+   A. In Ruby, you can simply extend the Math module\
    \ with the missing method:\n\n```\nmodule Math\n  def Math.sum(x)\n    (Math.cos(x)\
    \ + Math.sin(x)) Math.exp(x)).abs\n  end\n```"
