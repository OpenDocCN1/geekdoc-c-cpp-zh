    # Imagine we have


    ```

    class Rectangle

    attr reader :top left, :width, :height

    end

    ```


    ```

    class Point

    attr reader :x, :y

    end

    ```


    Any client code wishing to find the x-coordinate of a rectangle''s left edge will
    have code flags such as rect.top left.x, and we may decide we want to hide this
    delegation. The Refactoring catalog tells us to take the following steps:


    +   1. Create a simple delegating method on the server

    2. For each client of the delegate:

    (a) Adjust the client to call the server''s new method

    (b) Test

    3. If no client needs to access the delegate any longer:

    (a) Remove the server''s accessor for the delegate

    (b) Test


    Refactoring is a step-by-step process. The steps are smaller than you might initially
    expect. Most refactorings take from a minute to an hour; the average is a few
    minutes. So, if a refactoring takes a few minutes, the steps are even smaller.

    The steps themselves are generally not refactorings, because many of them leave
    the code in a broken or indeterminate state. Refactorings are behavior-preserving
    transformations, whereas the steps in any specific refactoring may temporarily
    break the code.


    # Step 1: Create a delegating method


    We jump right in and create the method we need:


    ```

    class Rectangle

    def left edge

    @top left.x

    end

    ```'
