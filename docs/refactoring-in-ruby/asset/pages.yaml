  md: '# Chapter 3: Refactoring Step by Step


    +   - Swap two independent things: For example, two statements that have no possible
    effect on each other can be swapped. This can be used to harmonize code fragments
    that would have the same text if it weren''t for slight differences in the order
    of statements.


    +   - Propagate a constant: When a "variable" has a constant value, replace the
    variable with the constant.


    # Delete


    These actions eliminate elements.


    +   - Delete dead code: Get rid of code that can never be executed.


    +   - Delete code with no effects: For example, eliminate an empty method or class.


    +   - Deprecate: For code that cannot be deleted (because external uses must be
    accommodated), mark it to discourage new uses.


    # Test


    The Generic Refactoring micro-process has a test run after each turn through the
    loop, and once at the end. In practice, especially if you have comprehensive tests,
    you can take some shortcuts. For example, if you''re moving a method you might
    have 25 references to it in the old place. You could move the first reference,
    test, move the second reference, test, and then move before testing again once
    to ensure sure you have the pattern. When you take this shortcut will depend on
    a combination of factors: how long your tests to run, how easily can you undo
    if you make a mistake, or how hard it is for you to check in files.


    When the tests pass, it''s worth checking in your code. Even if you are only halfway
    through the steps in one refactoring, creating safe bases as you go significantly
    relieve the pressure to complete the task in one sitting.


    It''s important to stress: Refactoring is only safe in the presence of good tests.
    Firstly there is no compiler or static type checks to tell when some subtle, but
    unwanted, typing error (pun intended) has occurred. And secondly because refactoring
    tools for Ruby are in their infancy, and even automated refactoring tools aren''t
    perfect.'
