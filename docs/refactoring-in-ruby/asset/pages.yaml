  md: '# Foreword


    I want to give you two reasons to work through this book. The first reason is
    about right now, and the second is about forevermore.


    The reason you need to work through this book right now is, well, is: You and
    me and all the other Ruby programmers out there. While Ruby’s a language that,
    as the saying goes, makes simple and hard things possible, and while we Ruby programmers
    are intelligent, virtuous, good-looking, kind to animals, and great fun at parties—we’re
    still human. As such, what we make is often awkward, even if it’s Ruby code.


    So there’s this vast and ever-growing sea of Ruby programmers out there, writing
    awkward Ruby code. I bet you’re working on some of that code now, and I’m sure
    you’ll be working on it soon. Do you want to be happy doing that? Or sad?


    In the past so we’ve learned that a wonderful way to be happy working on code
    is to refactor it you go. Refactoring means that you change the code to be less
    awkward on the inside without changing what it does. It''s something you can do
    in small, safe steps while adding features or fixing bugs. As you do, the code
    keeps getting more pleasant, so your life does too.


    Before I give the second reason to work through the book, I want to share my deepest
    fear: that you’ll only read it, not work through it. That would be a horrible
    mistake. When I think of doing that, I imagine all the wonderful tricks in the
    book entering your head through your eyes—and then, far too many of them sliding
    out of your ears, never to be recalled again. What tricks do you remember will
    be shuffled off to that part of the brain marked “For Rational Use Only,” to be
    taken out rarely, on special occasions. Reading will not make you an expert.


    You see, expert behavior is often a-rational. Experts typically act appropriately
    without needing to think through a problem. Indeed, experts often have difficulty
    explaining why a particular action was appropriate. That’s because “thinking through
    a problem” is expensive, so the brain prefers more efficient routes to correct
    behavior. Those routes are created through repetition—like doing exercises in
    this book. (Gary Klein’s Sources of Power is a good book about expert behavior,
    and Read Montague’s Why Choose This Book? explains why the brain avoids what we
    think of as problem-solving.)'
  merge: -1
