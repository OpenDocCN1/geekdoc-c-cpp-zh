  md: '# Dead Code


    # What to Look For


    +   - A variable, parameter, code fragment, method, module, or class is not used
    anywhere (perhaps not other than in tests).


    # Why This Is a Problem


    +   - **Size:** Dead Code adds to the application''s size, and thus to the amount
    of code that must be understood by developers and maintainers.

    - **Communication:** It isn''t always obvious when code is dead, and so the reader
    may take it as having a bearing on the behavior of software. Indeed, **Dead Code**
    that is also incorrect or invalid may lead the developer seriously astray.

    - **Flexibility:** All code has dependencies on other code; **Dead Code** may
    create dependencies where otherwise there would be none. These unnecessary couplings
    may, in turn, slow the pace of change for the code in these areas.


    # When to Leave It


    If your application is a framework, it may include elements or hooks purely to
    support clients'' needs, but which are not needed by the framework itself.


    # How It Got This Way


    Requirements have changed, or a new design has been introduced, without adequate
    cleanup. Or sometimes complicated logic results in some combinations of conditions
    that can'' actually happen; you''ll see this when simplifying conditionals.


    # What to Do


    +   - Delete the unused code and any associated tests.

    - The code you just deleted may have been the client of some other code, so that
    in turn is now dead. Continue checking and deleting until you find no more **Dead
    Code**.


    # What to Look for for


    +   - **Size:** There are fewer code elements to be loaded and interpreted, and
    there is less code to read and search. You may find you now have a *Lazy Class*
    or a *Data Class*, for example.'
  merge: -1
  pgno: 79
