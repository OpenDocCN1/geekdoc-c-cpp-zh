  md: '# Shotgun Surgery


    What to Look For


    +   - Making a simple change requires you to change several classes or modules.


    # Why This Is a Problem


    > > **Communication:** You change a single decision and you have to change several
    classes, which probably means that the decision doesn''t have a name, and consequently
    the application''s design isn''t being clearly communicated. That will cause current
    and future developers to need to search the code more, which may turn lead to
    defects.


    > > **Flexibility:** It probably also means that the decision hasn''t been isolated
    from other decisions. Some modules may be harder to test than necessary, and modules
    may churn for longer, perhaps never stabilizing.


    # How It Got This Way


    One responsibility is split among several modules. There may be a missing class
    that would understand the whole responsibility, or perhaps an **Open Secret**
    has never been encapsulated. Or, this can happen through an overzealous attempt
    to eliminate **Divergent Change**.


    # What to Do


    +   - Identify the class or module that should own the group of changes. It may
    be an existing module, or you may need to use *Extract Module* to create a new
    one. If it is an *Open Secret*, see the advice specific to that smell.


    +   - Use *Move Field* and *Move Method* to put the functionality onto the chosen
    module. After the module not chosen is simple enough, you may be able to use *Inline
    Module* to eliminate it.


    # What to Look for Next


    > > **Duplication:** If the new module embodies a pattern or a sequence of actions,
    you may find that several other modules had to compensate by implementing their
    own copies of those steps. Look for **Duplicated Code** where the new module could
    now be used instead.'
  merge: -1
  pgno: 168
