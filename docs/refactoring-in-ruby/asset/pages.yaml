  md: '# CHAPTER 5

    Measurable Smells


    The smells in this chapter are similar. They''re dead easy to detect. They''re
    objective (after you decide on a way to count and a maximum acceptable score).
    They''re odious.


    And, they''re common.


    You can think of smells as being caught by a software metric. Each metric tends
    to catch different aspects of why code isn''t as good as it could be. Some metrics
    measure variants of code length; others try to measure the connections between
    methods or objects; others measure a distance from an ideal.


    Most metrics seem to correlate with length, so we tend to worry about size first
    (usually noticeable as a Large Module or Long Method). But if a metric is easy
    to compute, we''ll use it as an indicator that some section of code deserves a
    closer look.


    Metrics are not absolute. It is very easy to get into the trap of making numbers
    without addressing the total complexity. So refactor just for a better number;
    make sure it really improves your code.


    The smells in this chapter are the easiest to identify. They''re not necessarily
    easiest to fix.


    There are other metrics that have been applied to software. Many of them are simple
    refinements of code length. Pay attention when things feel like they''re getting
    too big. In this chapter we cover the following smells:


    +   - **Comments**, in which the code includes text to explain what''s happening

    - **Long Method**, in which a method is too long to be manageable

    - **Large Module**, in which a class or module is too large to represent a meaningful
    abstraction

    - **Long Parameter List**, in which a method needs too much information in order
    to get its job done'
