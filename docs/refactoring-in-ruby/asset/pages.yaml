  md: '# Global Variable


    # What to Look For


    +   - Your code uses a global variable, other than one predefined by Ruby itself.


    # Why This Is a Problem


    > > Flexibility: Global variables make it easy for one part of the system to accidentally
    depend on another part of the system. The system is more prone to problems when
    changing something over breaks something over. Furthermore, global variables aren''t
    thread safe, so they increase the risk of obscure bugs.


    > > § Testability: Global variables can make it hard to set up tests: the context
    of the test includes all global state.


    # When to Leave It


    A global variable can be the simplest way to go in simple scripting. But as soon
    as you begin to define your own domain classes it''s best to eliminate any Global
    Variables.


    # How It Got This Way


    The easiest way to establish communication between parts of a program is to introduce
    a Global Variable.


    # What to Do


    +   - Use Add Parameter to give methods access to the value, so that the application
    accesses the global variable directly at only the highest level. Then you have
    a choice: Move the global to the class where it belongs and hand out the instance
    of that class, or create a Registry of some sort and hand out the value from the
    registry.


    # What to Look for Next


    +   - ◎ Abstraction: Look for Data Clumps involving the new parameter. Are there
    other global variables, or objects, that travel with this one?


    +   - ⌛ Duplication: As you make the changes to replace the global access by a
    parameter, look out for code fragments that use the parameter in similar ways.
    Treat the duplication as you find it.'
  merge: -1
