  md: '| Symptoms | Smell |


    | Methods and/or classes have similar behavior but different names | Alternative
    Modules with Different Interfaces, p. 85 |

    | Similar code | Duplicated Code, p. 83 |


    | Names |


    | Two different names for the same thing | Inconsistent Names, p. 61 |

    | Name is compound word, including a type name | |

    | "Hungarian" notation (type indicator used as prefix) | Type Embedded in Name,
    p. 59 |

    | Variable named after type rather than intent | |

    | One or two character name | |

    | Name without vowels | |

    | Numbered variables | Uncommunicative Name, p. 60 |

    | Name that doesn''t reflect its real use or meaning | |


    | Code within a Method |


    | # | Comments |

    | Complex expression using &&, ||, ! | Complicated Boolean Expression, p. 98 |

    | Parameter value controls branching within a method | Control Coupling, p. 100
    |

    | Large number of lines in method | Long Method, p. 44 |

    | Large number of parameters to method | Long Parameter List, p. 48 |

    | Method has more than one responsibility | Greedy Method, p. 70 |

    | Constant embedded in code | Derived Value, p. 80 |

    | Comparison against nil or call to nil? | Nil Check, p. 94 |

    | Complex if statement | |

    | If check before body of code | Special Case, p. 96 |

    | case keyword used | |

    | Several if statements in a row (comparing the same item) | Simulated Polymorphism,
    p. 101 |

    | Use of instanceof, kind of?, is a?, | |


    | Class or Module |


    | Large number of instance variables in class or module | |

    | Large number of methods in class or module | Large Module, p. 46 |

    | Large number of lines in class or module | |

    | Class or module does more than one thing | Greedy Method, p. 146 |


    | Complexity |


    | Variable, parameter, field, code fragment, method, or class never referenced
    | Dead Code, p. 66, or Speculative Generality, p. 68 |

    | Code more general/complicated than it needs to be | Speculative Generality,
    p. 68 |'
