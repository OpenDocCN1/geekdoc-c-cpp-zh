  md: '# Inappropriate Intimacy (Subclass Form)


    What to Look For


    +   - A class makes use of the implementation details of its superclass.

    (There is a related form of inappropriate intimacy between separate classes; see
    **Inappropriate Intimacy (General Form)** in Chapter 12, "Responsibility.")


    Why This Is a Problem


    +   - Flexibility: If implementation details of the superclass change, the consequences
    could propagate to the subclass.

    - Simplicity: If the semantics or behavior of the superclass change without affecting
    the types at the interface, we may introduce subtle defects in its subclasses.


    This problem is more serious between unrelated classes than between a parent and
    child.


    How It Got This Way


    It''s natural that a superclass and its subclasses be more coupled together than
    two strangers. Sometimes it just goes too far.


    What to Do


    +   - First, check if this is also a case of **Implementation Inheritance**; if
    so, fix that smell first.

    - If the parent can define a general algorithm that the children can plug into,
    then use *Form Template Method*.

    - If the parent and child need to be even more decoupled, then use *Replace Inheritance
    with Delegation.*


    What to Look for Next


    +   - **Communication**: You may now created a better abstraction by documenting
    the true interface of the superclass. Review the names it uses for consistency.

    - **Duplication**: If several subclasses had to perform the same set of actions,
    moving them onto the superclass can open up opportunities to simplify the subclasses
    too.'
  merge: -1
