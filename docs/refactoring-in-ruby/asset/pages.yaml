  md: '# Comments


    What to Look For


    +   - The code contains a comment. (Some IDEs make these more obvious by color-coding
    comments.)


    # Why This Is a Problem


    +   - Flexibility: Any comment that explains the code must be kept in step if
    the code is changed.


    +   - Duplication: Most comments can be reflected just as well in the code itself.
    For example, the goal of a method can often be communicated well through its name
    as it can through a comment.


    +   - Communication: Comments that say slightly different than the code create
    cognitive drag—or even mistrust—and slow the reader down.


    # When to Leave It


    Don''t delete comments that are pulling their own weight—such as rdoc API documentation.
    Some comments can be particularly helpful—those that tell why something is done
    a particular way (or why it wasn''t), or those cite algorithms that are not obvious
    (where a simpler algorithm won''t).


    # How It Got This Way


    Comments may be present for the best of reasons: The author realizes something
    isn''t as clear as it could be and adds a comment.


    # What to Do


    +   - When a comment explains a code fragment, you can use Extract Method to pull
    the fragment out into a separate method. The comment will often suggest a name
    for the new method.


    +   - When a comment explains what a method does (better than the method''s name!),
    use Rename Method using the comment as the basis of the new name.


    +   - When a comment explains preconditions, consider using Introduce Assertion
    to replace the comment with code.'
