    # The Refactoring Cycle


    # Exercise 2.1: Simple Design


    +   A. (a) Passes all tests. "If it doesn''t have to work, I can give it to you
    right now."

    (b) Communicates. This makes an appeal to our intuition about future readers of
    our code (including ourselves).

    (c) No duplication. Duplicate code is asking for trouble; it''s too vulnerable
    to changes in one place but not the other.

    (d) Fewest classes and methods. All things being equal, we prefer smaller.


    +   B. The bottom line is that there''s an appeal to the reader''s ability to
    understand; we''ll tolerate duplication to achieve better understanding.


    Test code will sometimes have duplication, for communication reasons. For example,
    it may be easier to repeat an expected value than assign it to a variable and
    use the variable. That way, when you read the code, you know exactly what it was
    looking for, and you don''t have to review code to find the variable and make
    sure nothing else changed along the way.'
