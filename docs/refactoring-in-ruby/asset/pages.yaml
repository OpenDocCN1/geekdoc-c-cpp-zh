  md: '# CHAPTER 1

    A Refactoring Example


    Rather than start with a lot of explanation, we''ll begin with a quick example
    of refactoring to show how you can identify problems in code and systematically
    clean them up. We''ll work “at speed” so you can get the feel of a real session.
    In later chapters, we''ll touch on theory, provide deeper dives into problems
    and how you fix them, and explore moderately large examples that you can practice
    on.


    # Sparkline Script


    Let''s take a look at a little Ruby script Kevin wrote a while back. The script
    generates a sparkline (a small graph used to display trends, without detail) and
    does it by generating an SVG document to describe the graphic. (See Figure 1.1.)


    The original script was written quickly to display a single sparkline to demonstrate
    the trends that occur when tossing a coin. It was never intended to live beyond
    that single use, but then someone asked Kevin to generalize it that the code could
    be used to create other sparklines and other SVG documents. The needs to become
    more reusable and maintainable, which means we''d better get it into shape.


    ![](img/5b337482b4438508059e3e32f3cd9afc_21_0.png)


    Figure 1.1 A sparkline'
