  md: '22 Chapter 2: The Refactoring Cycle


    If your code violates these rules (which are in priority order), you have a problem
    to address. A shorthand name for these rules is OAO, which stands for once and
    only once. The code has to state something once so it can pass its tests and communicate
    the programmer’s understanding and intent. And it should say things only once—that
    is, with no duplication.


    Another name for the rule is “Don’t Repeat Yourself,” or the DRY principle [17].
    Most of the smells cataloged in Part II, “Code Smells,” boil down to duplication
    of some kind; and spotting it can be quite an art—bew of hidden duplication, such
    as parallel class hierarchies, for example. But duplication is occasionally acceptable,
    where its existence helps the code communicate intent; after all, code will be
    read many times than than will be written.


    It’s hard to clean up code that hasn’t been kept clean; few teams can afford to
    lock the doors for months on a quest for perfection. We can learn to make our
    code better during development, and we can add a little energy each time we’re
    working in an


    # Test-Driven/Behavior-Driven Development


    Applying refactor in the midlest of a development episode can lead to confusion,
    unsafe transformations, or, in the worst case, broken code. So it’s best to think
    of development and refactoring as different: different skills, using different
    techniques, to be performed at different times in the overall cycle. Think of
    development and refactoring as different hats—you can only wear one of them at
    any time.


    Test-driven development (TDD) and behavior-driven development (BDD) make the distinction
    between the two hats very clear. They share the following microprocess:


    # The TDD/BDD Micro-Process


    +   - RED Write a new test/example and see it fail.

    - GREEN Get all tests passing again quickly, using the most naive approach you
    can see.

    - REFACTOR Transition to the simplest design that passes all current tests, by
    removing any smells you just introduced.

    - (repeat) Go around again, aiming to be back every few minutes or so.


    The refactoring step is what makes this process sustainable. Without the code
    would quickly degenerate into the legacy spaghetti you’ve no doubt seen on many
    a software development project. Well-factored code is easier to read and more
    amenable'
