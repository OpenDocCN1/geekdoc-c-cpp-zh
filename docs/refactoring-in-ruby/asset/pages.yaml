  md: '# CHAPTER 14


    # Libraries


    Any Ruby application will use libraries—be it the core or standard libraries,
    or third-party gems downloaded from RubyForge or a similar repository.


    Libraries sometimes put us in a dilemma: We want the library to be different,
    and yet we don''t want to change it. Even when it''s possible to change a library,
    that can carry risk because it could affect clients, and it could mean we would
    have to redo the changes for future versions of the library.


    Sometimes, library code is a bit smelly in order that client code doesn''t have
    to be. Micah Martin points out that a library that is so factored has lots of
    public classes and no smells can be harder to use; it''s helpful if the library
    makes a narrow, easy-to-use interface available.


    In this chapter we''ll cover the following smells:


    +   - **Incomplete Library Module**, in which a library has a vital feature missing


    +   - **Reinvented Wheel**, in which you''ve written code that already exists
    elsewhere


    +   - **Runaway Dependencies**, in which unexpected dependencies emerge when reuse
    is attempted'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# Incomplete Library Module


    What to Look For


    +   - You''re using a library module, and there''s a feature you wish were provided,
    but it''s not.


    +   - You see client code implementing a feature that could be in the library.
    (This can be visible as duplication in the client code.)


    # Why This Is a Problem


    In a statically typed language such as Java, an incomplete library can be a big
    problem because we can''t add methods to a class in a jar file. In Ruby, however,
    we can add methods to any class or module at any time. The main issue here is
    finding an appropriate way to manage the extension of the library.


    **Abstraction**: Extending the library by monkey-patching leads to other later
    problems such as **Greedy Module**.


    **Flexibility**: Several projects might extend a library in incompatible ways,
    leading to subtle duplication and extra work if the library changes.


    # How It Got This Way


    The author of the module didn''t anticipate your need (or declined to support
    it due to other trade-offs).


    # What to Do


    +   - Use *Local Extension*. In your own application code add the missing methods
    to the module. However, if those methods don''t naturally form part of the abstraction
    represented by the library, this refactoring will create a **Greedy Module**.


    +   - Alternatively, consider creating an Adapter or Wrapper to contain your extensions.


    +   - If the extension is large, or if it becomes popular, consider using *Extract
    Module* to create a reusable library extension for use in other applications.


    +   - After you''ve reused this extension in a couple of projects, check whether
    the owner of the library would consider incorporating your extension.


    # What to Look for Next


    **Duplication**: Look at the other clients of this library, in every project you
    can find. Look for similar or overlapping extensions—**Alternative Modules with**'
