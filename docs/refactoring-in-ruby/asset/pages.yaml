    # Unnecessary Complexity


    # Exercise 7.2: Today versus Tomorrow


    A. Forces that make it better to design for only today''s requirements today:


    +   - It''s cheaper for now to do only today''s design.

    - We are not committed to requirements evolving in a particular direction (so
    we

    don''t have to backtrack).

    - We are not required to maintain tomorrow''s code today.

    - Code is easier to understand when it does as little as it needs to.


    B. Forces that make it better to design for tomorrow''s requirements today:


    +   - It may be easier to fully out the class while it''s still fresh in our mind

    today.

    - Developing for tomorrow''s needs may help us understand today''s better.


    It all comes down to a bet: On average, it will be cheaper to do only today''s

    design and deal with tomorrow when it comes, or the generalized designs pay

    for themselves by being right often enough?

    Gordon Bell, one of the great hardware designers, said, “The cheapest, fastest,

    and most reliable components of a computer system are those that aren''t here."

    (Quoted in Jon Bentley''s More Programming Pearls [7]).


    # Exercise 7.3: Extraction Trade-Offs


    A. In general, we believe smaller pieces are better. Indeed, the fact that our
    code

    is composed of small, loosely coupled pieces is what keeps down its long-term
    cost

    of ownership. We responded to the needs of today''s code, and one beneficial

    side-effect is that we have a more flexible design for the future. This is therefore

    not Speculative Generality.


    B. If the reverse process of inlining the pieces would create Long Methods or
    Large

    Modules again, the current (refactored) state of the code is preferable.


    C. Be sure to use names that are pertinent to the task at hand, and not too general
