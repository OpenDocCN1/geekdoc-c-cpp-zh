  md: '# CHAPTER 13


    # Accommodating Change


    Some problems become most apparent when you try to change your code. (Most of
    the other smells we''ve discussed can be detected by looking at the code statically.)


    Ideally, one changed decision affects one place in the code. When it doesn''t
    work out that way, it''s a sign of duplication in the code.


    Addressing these smells has a side benefit: Many times it makes the code easier
    to test.


    In this chapter we''ll cover the following smells:


    +   - Divergent Change, in which a class or module changes too frequently

    - Shotgun Surgery, in which a simple change causes change everywhere

    - Parallel Inheritance Hierarchies, in which changes to one hierarchy mirror changes
    to another

    - Combinatorial Explosion, in which a class hierarchy has too many dimensions'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Divergent Change


    What to Look For


    +   - You find yourself changing the same module for different reasons. (For contrast,
    see Shotgun Surgery, the next smell we discuss.)


    # Why This Is a Problem


    +   **Flexibility**: If a module needs to change for many different reasons, you
    may quickly find that two developers need to change it at the same time. The module
    becomes a bottleneck, slowing down progress.


    +   **Abstraction**: Worse, a module with “churn” may never stabilize, and so
    may never come to reliably represent a useful domain abstraction. In Object-Oriented
    Software Construction* [23] Bertrand Meyer recommended that we should strive to
    be able to add functionality without modifying existing classes, because their
    stable, tested state represent an investment. (Recall that in Chapter 8, “Duplication,”
    we talked about Parnas dictum that a module should have only one secret.)


    # How It Got This Way


    The module picks up more responsibilities as it evolves, with no one noticing
    that two different types of decision are involved.


    # What to Do


    +   - It’s likely that frequent change has introduced conditional logic; look
    through the module for Simulated Polymorphism and break up the code using the
    refactorings suggested there.


    +   - If the module has too many (i.e., more than one) responsibilities, consider
    the refactorings we suggest for fixing a Greedy Module. Use Extract Class or Extract
    Module to separate responsibilities.


    +   - If several classes share the same decisions or variation points, you may
    be able to consolidate them into new classes (e.g., by Superclass or Extract Subclass)
    or extract a common module to serve as a mix-in. In the limit, these extracted
    classes or modules can form a layer (e.g., a persistence layer).'
  merge: -1
