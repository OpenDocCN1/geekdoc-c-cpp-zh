  md: '# Symptoms


    | Data | Smell |

    | --- | --- |

    | Public fields (or just setters and getter), but little behavior in class | Data
    Class, p. 110 |

    | Same 2 3 items occur together in class or parameter lists | |

    | Instance variables named with similar substrings | Data Clump, p. 112 |

    | Fixnum or String method parameters | |

    | Constants and "enumerations" used to index Hashes and Arrays | Open Secret,
    p. 108 |

    | String constants for field names | |

    | An instance variable has a value some of the time | Temporary Field, p. 114
    |


    # Inheritance


    | | |

    | --- | --- |

    | Subclass is too tied to parent''s data methods | Inappropriate Intimacy (Subclass
    Form), p. 130 |

    | Class has little code in it | Lazy Class, p. 131 |

    | Subclass throws exception on method the parent requires | |

    | Inherited method doesn''t work | |

    | Clients refer to subclass but never hold reference to the parent class | Refused
    Bequest, p. 128 |

    | Subclass isn''t (conceptually, behaviorally) an example of the parent class
    | |

    | Using of subclass purely to share code | Implementation Inheritance, p. 126
    |


    # Responsibility


    | | |

    | --- | --- |

    | Class manipulates another class'' state | Feature Envy, p. 136 |

    | Class relies too much on how another class works | Inappropriate Intimacy (General
    Form), p. 141 |

    | Chain of chains: a.b().c().d() | Message Chain, p. 143 |

    | Most methods simply delegate to another object | Middle Man, p. 145 |


    # Accommodating Change


    | | |

    | --- | --- |

    | Introducing new class requires multiple classes at various points in its hierarchy
    |

    | Each level of hierarchy deals with a different attribute |

    | Same class changes for different reasons |

    | New subclass in one hierarchy requires new subclass in another hierarchy |

    | Subclasses in two separate hierarchies use the same prefixes |

    | Multiple classes must change for a single decision | Combinatorial Explosion,
    p. 159

    Divergent Change, p. 154

    Parallel Inheritance Hierarchies, p. 158

    Shotgun Surgery, p. 156 |


    # Working with Libraries


    | | |

    | --- | --- |

    | Library doesn''t have a feature you need | Incomplete Library Module, p. 164
    |

    | Application code does exactly what a standard library does | Reinvented Wheel,
    p. 166 |

    | Many "require" calls needed to accomplish a simple task | Runaway Dependencies,
    p. 167 |'
