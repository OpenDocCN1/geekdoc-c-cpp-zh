  md: '# Refused Bequest


    +   * If there''s no reason to share a class relationship, then use Replace Inheritance
    with Delegation.


    +   * If the parent-child relationship does make sense, look through your clients
    to find places where the refused method is called. If you find conditional logic
    (e.g., Special Case) that copies with the refusal, look for ways to implement
    the refused method by pushing the clients'' response into the refused class. This
    may move Method and/or Introduce Null Object. Look through Chapter 9, "Conditional
    Logic," for more ideas.


    +   * Alternatively, look for ways to reorganize the inheritance relationship.
    For example (see Figure 11.1), you could create a new subclass C via Extract Subclass
    and use Push Down Method to move the refused behavior into it. Then change clients
    of the new class.


    ![](img/5b337482b4438508059e3e32f3cd9afc_141_0.png)


    Figure 11.1 Rearranging the Hierarchy


    # What to Look for Next


    +   * **Communication**: Fixing Refused Bequest will improve the way your classes
    communicate your design. Look again at these classes and their clients for Uncommunicative
    Names that could now be simplified or cleaned up.


    +   * **Simplicity**: Reorganizing your classes will likely simplify their clients.
    (LSP requires that subclass instances be substitutable.) Look through all uses
    of the refused method for Special Cases and other signs of coping with broken
    polymorphism; you may find those clients can be simplified.


    +   * **Testability**: Tests are clients too. Fixing a refused method can reduce
    the number of cases you need to test, so check your tests for cases that now collapse
    or disappear.'
  merge: -1
