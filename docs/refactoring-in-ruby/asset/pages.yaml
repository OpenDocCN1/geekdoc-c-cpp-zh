  md: '# Greedy Module


    What to Look For


    +   - A module has more than one responsibility—for example, formatting a report
    as XML and sending it to a SOAP service.


    +   - The fixtures for a class''s unit tests are big and clumsy, or are difficult
    to fabricate.


    +   - A module embodies design decisions that need to change independently or
    at different frequencies.


    Every Large Module is very likely to also be a Greedy Module: Some clients depend
    on some parts, others on different parts. A Temporary Field is also a sure sign.


    # Why This Is a Problem


    +   - Flexibility: One of the benefits of object-oriented design is the ability
    to localize change. By separating an application into small, independent pieces,
    we improve our choices of finding and fixing defects, and adding of new features
    without breaking that work already.


    +   - Simplicity: A module that does too many things, or that embodies too many
    decisions, is more complicated than it needs to be.


    A module that does two jobs is often said to violate the Single Responsibility
    Principle (SRP); see Robert Martin''s Agile Software Development: Principles,
    Patterns, and Practices [21] for a broader explanation of the SRP.


    # How It Got This Way


    When new behavior must be added, the quickest thing to do is to weave it into
    existing code. Often it begins with a Greedy Method, and the longer it continues
    the easier it becomes to add a little more.


    # What to Do


    +   - Consider the approaches to dealing with a Large Module—they will often work
    here as well.


    +   - Look at instance variables and method parameters. If you see a Data Clump,
    use that is the basis for a new class, as described on page 112.'
  merge: -1
  pgno: 158
