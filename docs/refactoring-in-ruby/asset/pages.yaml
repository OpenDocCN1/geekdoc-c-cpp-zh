    # Refactoring


    Here are some of the smells we noticed:


    +   - Uncommunicative Name: Calc Controller and Calc Screen aren''t standard Ruby
    class names (which wouldn''t have underscores).

    - Duplicated Code: Duplication between digits and units.

    - Duplicated Code: Duplication across classes: Calc Screen, Calc Controller, and
    Calculator all have methods for the various operators.

    - Duplicated Code: The button_frame is being passed many times, and it''s only
    the value parameter using it ever.

    - Dead Code: There is an uncalled method binary pop() in Calculator, and plus
    old() in the main class.

    - Middle Man: The arithmetic routines in Calc Controller are pass-through methods
    to Calculator; it''s not clear that the controller is pulling its weight.

    - Greedy Module: Some stack methods are in the controller, some in the Calculator.

    - Inappropriate Intimacy (General Form): There''s redundant state in the controller
    and calculator, trying to manage what happens when a value has been typed in and
    to be extended until one is calculated and should be replaced.

    - Simulated Polymorphism: The extend() method checks types to decide how to operate.

    - Feature Envoy: The cab() method does all its work with the calculator, so the
    work could be moved there.

    - Duplicated Code: All the calculation routines are very similar.

    - Suspicious Code: The Calculator class hard-codes the default value, and the
    operators assume +-/ are defined.

    - Suspicious Code: It seems suspicious that operators put in a default value (0)
    when anything suspicious happens ("5 m PUSH 2 s * yields 0). The value class definitely
    detects trying to add or subtract things with different dimensions.

    - Long Method: Dimension*() method seems long; to s() is definitely too long.

    - Duplicated Code: The positive and negatives are added very similar.

    - Greedy Module: Value knows its formatting.'
