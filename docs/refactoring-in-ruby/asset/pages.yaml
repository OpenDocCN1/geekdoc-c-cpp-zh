  md: '# Large Module


    What to Look For


    +   - A class or module has a large number of instance variables, methods, or
    just lines of code.


    # Why This Is a Problem


    +   - **Testability**: A Large Module is usually difficult to test, either because
    it depends on many other modules or because it is difficult or time-consuming
    to create instances in isolation.


    +   - **Flexibility**: The module represents too many responsibilities folded
    together—that is, every **Large Module** is also a **Greedy Module**.


    # How It Got This Way


    Large modules get big a little at a time. The developer keeps adding one more
    capability to a module until eventually it grows too big. Sometimes the problem
    is a lack of insight into the parts that make up the whole module.


    # What to Do


    In general, you''re trying to break up the module. This usually proceeds piecemeal:


    +   - Very often a review of the module reveals a composite of other smells, such
    as **Long Methods, Data Clumps**, and **Temporary Fields**: fix these smells first.


    +   - To break up the module, use *Extract Class* or *Extract Module* if you can
    identify a new piece that has part of this module''s responsibilities.


    +   - If you have a large class, you might try *Extract Subclass* if you can divide
    responsibilities between the class and a new subclass.


    +   - Sometimes a class is big because it''s a GUI class, and it represents both
    a component and a model. In this case, you can use *Duplicate Observed Data* to
    help extract at a domain class.


    # What to Look for Next


    +   - **Duplication**: As you peel off each piece of the **Large Module** you
    may discover it has similar responsibilities or interface to an existing module.'
