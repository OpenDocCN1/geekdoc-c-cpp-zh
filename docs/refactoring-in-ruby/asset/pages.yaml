  md: '# Repeated Value


    # What to Look For


    +   - A hard-coded value—such as a GUI scaling factor or a text string—occurs
    more than once in the code and has the same meaning each time.


    # Why This Is a Problem


    +   - Duplication: Defects can enter if the value is changed in one place but
    not the other.


    +   - Communication: When a value appears multiple times, it''s not clear whether
    this is intentional or coincidental.


    # When to Leave It


    The same value might actually mean different things. For example, two different
    modules might use the empty string as a default value. This is a coincidence and
    not an example of duplication. Nevertheless, you might improve communication by
    creating constants to give domain-related names to these default values.


    Tests are often more readable when they simply use the value they want, but you
    may sometimes pull out a symbolic constant if it better communicates your intent.


    # How It Got This Way


    A programmer needs a value and puts it in the code; the code then embodies a requirement
    or a design choice. Later, someone needs the value, so he either copies the original
    or independently makes the same choice.


    # What to Do


    +   - If the value is genuinely a simple constant, use Replace Magic Number with
    Symbolic Constant to get a meaningful name.


    +   - Very often, the value is a clue to the existence of the hard form of Duplicated
    Code. Use Extract Method or Form Template Method on the repeated algorithm. Leave
    the value itself in the resulting code, unless naming it helps to explain or document
    the algorithm.


    +   - If the values are strings (e.g., the text of dialog boxes), you may want
    to put them in some sort of mapping facility or use an internationalization library
    such as ri18n.'
