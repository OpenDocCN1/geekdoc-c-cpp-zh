  md: '# Runaway Dependencies


    # What to Look for


    +   - You want to reuse a single class or module, but you have to drag in the
    whole application or several gems you don''t need or want.


    # Why This Is a Problem


    > > Flexibility: The “requires” relationship in Ruby is transitive: If A requires
    B and B C, then A depends on C and needs it in order to load. This could cause
    code to be copied and edited, rather than reused as is.


    # How It Got This Way


    It''s usually easy to just instantiate objects where you need them. And that,
    in turn, means just adding require statements where you need them. And so the
    snowball begins.


    # What to Do


    In general, Dependency Inversion is a large refactoring—one that can take several
    coding sessions to complete. Assuming there''s just one class you want to reuse:


    +   - Sometimes the offending require calls are not needed, perhaps being a hangover
    from earlier refactoring: Dead Code can be simply deleted.


    +   - If your code instantiates third-party objects, use Parameterize Method to
    push the call to new toward the application''s edges. Then delete the corresponding
    require.


    +   - If your class inherits from a third-party class, treat this as if it were
    a case of Implementation Inheritance.


    # What to Look for Next


    +   - Duplication: Gathering together the uses of a third-party module could reveal
    Duplicated Code or Feature Envy in its client classes.'
