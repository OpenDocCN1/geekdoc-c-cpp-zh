  md: '# CHAPTER 4

    Refactoring Practice


    One of the premises of this book is that refactoring is a skill and benefits from
    practice. Look for opportunities to practice and use this skill.


    # Read Other Books


    All the books in the bibliography will repay their study. But if you haven''t
    yet acquired Fields et al.''s *Refactoring, Ruby Edition [11]*, you should seriously
    consider doing so: The exercises in this book touch on half the refactorings cataloged
    in the Fields book. Tools are getting better at the mechanics of refactoring support,
    but it will be a long time before they effectively cover every aspect of refactoring
    in the catalog.


    # Practice Refactoring


    Find ways to make refactoring part of your daily life.


    +   * Build refactoring into your routine. Knowing how to refactor isn''t worth
    much unless it''s applied. Resolve to make your code “lean and clean.\ On an XP
    team, this is part of everyday life. But even heavily-driven approaches expect
    programmers to implement the design well.

    * Build testing into your routine. There''s an old adage (as many are), “If it
    ain''t broke, don''t fix it.” (How many times has the last “simple change” caused
    an unexpected bug?) In programming, the downside of applying this adage is that
    the code just gets uglier and uglier.'
