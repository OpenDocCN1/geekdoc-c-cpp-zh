  md: '# CHAPTER 9


    # Conditional Logic


    It''s natural that object-oriented programming is focused on objects and their
    relationships, but the code within an object is important too. Classic books like
    Jon Bentley’s Programming Pearls [6] and More Programming Pearls [7] or Brian
    Kernigan and P. J. Pflauer’s The Elements of Programming Style [18] can help inspire
    you to write good, code.


    Conditional logic is often the trickiest part of such code.


    +   * It''s hard to reason about, since we we have to consider multiple paths
    through the code.

    * It''s tempting to add special-case handling rather than develop the general
    case.

    * Conditional logic sometimes is used as a weak substitute for object-oriented
    mechanisms.


    In this chapter we''ll cover the following smells:


    +   * Nil Check, in which nil is used to signal something special

    * Special Case, in which one scenario is handled differently than the rest

    * Complicated Boolean Expression, in which the logic is impenetrable

    * Control Coupling, in which the caller decides which path a method should take

    * Simulated Polymorphism, in which duck-tying is hand-coded using conditionals'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Nil Check


    What to Look For


    +   - There are repeated occurrences of if xxx.nil? or if xxx nil, especially
    in guard clauses at the top of methods blocks.


    Why This Is a Problem


    +   - **Duplication:** The multiple identical queries are duplication, with all
    the problems that brings.

    - **Flexibility:** When nil is a possible value, it implies that every client
    must be careful to make this check to avoid a latent bug.


    When to Leave It


    If Nil Check occurs in only one place (e.g., in a Factory Method), it is usually
    not worth the effort to create a separate Null Object.

    Watch out for a case where nil means two or more different things in different
    contexts. (You may be able to support this with different Null Objects.)


    # How It Got This Way


    A developer decided, “We''ll use nil to mean the default.” This may avoided the
    need to initialize certain variables, or it may have been an afterthought for
    an unexpected case. The Nil Check may have been introduced to work around a defect
    (without addressing the underlying cause).


    What to Do


    Try to restrict Nil Checks to interface boundaries. Ensure that only valid objects
    are used in the bulk of the system to avoid the need for these checks.


    +   - If there''s a reasonable default value, use that.

    - You may find the Ruby idiom variable value || default useful at the point where
    you set the value. (If value is nil, it sets the variable to the default).

    - Otherwise, Introduce Null Object creates a default object that you explicitly
    use. You may find method missing useful in this.'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'However, Null Objects need to have safe behavior for the methods they provide.
    They often act as identity objects (as 0 does relative to addition). If you can''t
    define a safe behavior for each method, you may not be able to use a Null Object.


    # What to Look for Next


    +   **Duplication:** A single “missing object” defect may have spawned identical
    defensive code blocks throughout the application; those can be removed.


    +   **Size:** Removing the now-extraneous Nil Checks** will make the code easier
    to read and digest.


    +   **Abstraction:** It may turn out that all of the code to handle a certain
    special case can be brought together into a single Null Object class, which then
    comes to represent a genuine behavioral abstraction from the application’s domain.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# Special Case


    # What to Look For


    +   - Complex if statements.

    - Guard clauses—checks for particular values before doing work (especially comparisons
    to constants).


    # Why This Is a Problem


    < Communication: A Special Case increases the amount the reader has to hold in
    his head while attempting to understand a code fragment.


    # When to Leave It


    In a recursive algorithm there are always one or more base cases that will stop
    the recursion; you can''t expect to eliminate these. And sometimes an if or unless
    clause is just the simplest way to do something.


    # How It Got This Way


    Sometimes, introducing a Special Case was the easiest way to get to the green
    bar. Others, a guard clause may have been introduced to defend against an unruly
    caller, or while simplifying a Complicated Boolean Expression during refactoring.


    # What to Do


    +   - If the conditionals are taking the place of polymorphism, Replace Conditional
    Polymorphism. You may find things become more clear if you first use Extract Method
    on the clauses.

    - If the if and else clauses are similar enough, you may be able to rewrite them
    so that the same code fragment can generate the proper results for each case;
    then the conditional can be eliminated.

    - If you have a defensive guard clause, try pushing it up into the method''s callers
    (Control Coupling for detailed mechanics).


    # What to Look for Next


    +   - Duplication: Removal of a special case may render the code similar to another
    fragment elsewhere or reveal a common structure that was previously obscured.'
