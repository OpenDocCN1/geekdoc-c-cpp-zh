  md: '# What to Do


    +   For an unnecessary module, use the appropriate Inline refactoring on each
    method, class, and constant in the module.


    +   For an unnecessary class: If parents or children of the class seem like the
    right place for its behavior, fold it into one of them via Collapse Hierarchy.
    Otherwise, fold its behavior into its caller via Inline Class.


    +   For an unnecessary method, use Inline Method or Remove Method.


    +   For an unnecessary instance variable, remove all references to it.


    +   For an unnecessary parameter, use Remove Parameter.


    # What to Look for Next


    Communication: The removal of unnecessary code elements may free up names from
    the application’s domain; those names can now be reused, so it may be possible
    to give better names to existing code elements.


    Flexibility: If you inlined anything, look again at the receiving code: Have you
    created a Long Method or Large Module?? Have you created a Greedy Method or a
    Greedy Module?


    Size: Review the places where you removed code or parameters; look out now for
    a Lazy Class or some Dead Code.'
