  md: '# Derived Value


    What to Look For


    +   - The code contains a hard-coded value that could also be obtained by calculating
    it from other values or referencing an appropriate constant.


    Why This Is a Problem


    +   - Duplication: When a value is computed two different ways, it''s prone to
    the two mechanisms diverging.

    - Communication: Showing the relationship between values helps to document the
    design more clearly.


    # When to Leave It


    Some tests may benefit from having a derived value: It may make the test more
    readable, and it may demonstrate an independent computation of the value.


    # How It Got It This Way


    Someone needed a value, so they put it in the code. On its own, perhaps it''s
    not bad, but there are other values derived from or dependent on it. For example,
    we''ll have a string defined as “banana” and a length variable of 6. If you change
    the string, the length variable; however, this is not obvious, and so a defect
    gets in.


    # What to Do


    +   Use Replace Value with Expression for the derived value.


    # What to Look for Next


    +   - Duplication: Cleaning up this duplication may make it easier to see other
    duplication. You may see examples of Feature Envvy.

    - Abstraction: By making explicit the fact that two values depend on each other,
    you may identify the need to wrap those values and calculations in a class. You
    may see this in the form of Open Secret.'
  merge: -1
