    +   - If you use the String form of eval, try to replace it with one of the block
    forms, or with calls to define method; this least provides some syntax safety.


    +   - If you''re using method missing, replace it using Replace Dynamic Receptor
    with Dynamic Method Definition—for example, convert it to class eval.'
