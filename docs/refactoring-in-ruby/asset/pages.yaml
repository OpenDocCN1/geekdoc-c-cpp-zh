  md: '# CHAPTER 10


    # Data


    Data can be defined as simple facts, divorced from information about what to do
    with them. “Data” has a dusty whiff about it, the old-fashioned ring of data processing
    or data structures.


    Data-oriented objects are an opportunity. The smells in this chapter are often
    signs of a missing or inadequately formed class. If the data represents a good
    clustering, we’ll usually be able to find behavior that belongs with it in a class.


    In this chapter we’ll cover the following smells:


    +   - Open Secret, in which a domain’s representation hasn’t been encapsulated

    - Data Class, in which a class has little or no behavior

    - Data Clump, in which a bunch of values travel around together

    - Temporary Field, in which an instance variable has a different lifecycle than
    its enclosing class'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Open Secret


    Sometimes, a simple type (such as a number or string) is used to encode a value
    that could be a domain object in its own right. The representation of this value
    is exposed; clients have to decode and enforce any business rules themselves.


    (This smell was called Primitive Obsession in Fowler''s Refactoring[1] but Ruby
    doesn''t have the concept of primitives in the sense that C++ and Java do. It''s
    the exposure of representation''s important, not the code of item it''s stored
    in.)


    # What to Look For


    +   Several classes or modules pass around a simple value, and they all know how
    to interpret it. (The classic example is a String that “represents” a phone number.)


    +   Several classes or modules know what data is held in each slot of Array or
    Hash.


    # Why This Is a Problem


    > Communication: The value represents a concept, often from the application domain;
    but as yet the concept has not been provided or with clear semantics.


    > Duplication: A domain concept or design decision has been implemented, knowledge
    of its implementation details is spread around the code. This leads to duplication
    of knowledge—and often of code—among the clients of this value.


    +   Simplicity: Shotgun Surgery is almost always caused by an Open Secret—indeed,
    we are often alerted to this smell by encountering Shotgun Surgery first.


    # When to Leave It


    Very rarely, you may decide that fixing this smell would create dependency or
    performance problems.


    Part for a Hash or an Array, you may decide that convenience outweighs the need
    to remove this smell.


    A Hash may represent a simple map of values; if there''s no interpretation layered
    over top of it, there may be less of the smell (but note that you''re still exposing
    the implementation and there may still be a missing object).


    # How It Got This Way


    It''s easy to start with a string or numeric type, and later miss an opportunity
    to introduce a new class.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# What to Do


    +   If you have a primitive whose value is interpreted by several classes, fix
    it as if it were a Data Clump.


    +   If you have an Array or a Hash whose “layout” is common knowledge, use Replace
    Array with Object or Replace Hash with Object.


    # What to Look for Next


    **Duplication:** The class you just extracted is a Data Class. Look for opportunities
    to flesh out its behavior by reviewing its clients for Feature Envy. You will
    often find clients performing validation or formatting of the value.


    **Communication:** You have given a name to a domain concept; review the other
    names that are used around the new class.


    **Flexibility:** Look for ways to push the construction of your new object backward
    in time, so that more parts of your application benefit from the new class’s semantics
    and communication capabilities. If the new class is immutable and has a small
    set of possible or common values, consider introducing Flyweight instances.'
  merge: -1
