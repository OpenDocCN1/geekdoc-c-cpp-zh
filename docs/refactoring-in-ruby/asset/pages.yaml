  md: '# Temporary Field


    # What to Look For


    An instance variable is set only at certain times, and it is nil (or unused) at
    other times.


    # Why This Is a Problem


    **Abstraction**: Parts of the object change at different rates, and the class
    spends effort coordinating the changes. This suggests there is an implicit concept
    that can be brought out (with its own lifetime).


    # When to Leave It


    It may not be the worth of creating a new class if it doesn''t represent a useful
    abstraction.


    # How It Got This Way


    This can happen when one part of an object has an algorithm that passes around
    information through the instance variables rather than parameters; the instance
    variables are valid or used only when the instance is active. The fact that the
    instance variables are sometimes used and sometimes not suggests that there may
    be a missing object whose life cycle differs from that of the object holding them.


    # What to Do


    +   * Use Extract Class, moving over the fields and any related code.


    # What to Look for Next


    **Abstraction**: The new class is likely a Data Class.

    **Duplication**: Look for other places that embody the same concept; they may
    be creating duplication.'
  merge: -1
