  md: '# Utility Function


    # What to Look For


    +   - An instance method has no dependency on the state of the instance.


    # Why This Is a Problem


    A Utility Function is an extreme kind of Feature Envy, and should be fixed for
    much the same reasons:


    > **Abstraction: Utility Functions** often indicate that part of the domain has
    not been named and expressed as objects.

    **Flexibility:** A method that is in the wrong class creates couplings that may
    not be natural within the application''s domain and a loss of cohesion in the
    unwhosting class; **Shotgun Surgery** and **Divergent Change** often occur as
    a consequence.

    **Duplication:** Existing functionality that is difficult to find is also easy
    to miss, which in turn may lead to it being written more than once.


    # When to Leave It


    A Utility Function is sometimes the most direct way of describing a design. For
    example, a Factory may be expressed using class methods.


    # How It Got This Way


    Sometimes there doesn''t just anywhere suitable to put the new method you''re
    writing, so you “temporarily” add it to an existing class, or create a new Utilities
    class to hold it. This often arises from thinking of classes as “containers of
    functions” rather than descriptions of the behavior of objects.


    Sometimes other refactorings—namely Extract Method—leave behind a stub that now
    has nothing to do with the object in which it sits.


    # What to Do


    +   - As a minimum, document the fact that it is a Utility Function by converting
    it to being a class method.


    +   - Look at the method''s parameters; if one is used significantly more than
    the others, or if one looks like the “right” home, use Move Method to move the
    method onto that parameter''s class.'
  merge: -1
  pgno: 150
