  md: '# Responsibility


    In terms of usability, each of these designs has the same drawback: Clients of
    Read-only Document receive an exception if they try to invoke any of the refused
    methods. Even if we implement these methods that they gracefully do nothing, LSP
    would still be violated (inserting text wouldn''t change the document''s length,
    for example). On balance, we have a slight preference for approach (a)—although
    in this case we might choose not to fix the Refused Because at all.


    Finally, if the clients of these classes are close to the user interface, we do
    have an additional option: Instead of calling the refused methods directly, we
    could ask the document—whatever type is—to post its Command objects on the user
    interface. Thus, an editable Document would post objects that could call insert
    and so forth, whereas a ReadonlyDocument would omit them. The end user could never
    invoke a code path that would call a refused method.


