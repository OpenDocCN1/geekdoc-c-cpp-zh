  md: "# The Generic Refactoring Micro-Process\n\nA book on refactoring may list 20\
    \ or 50 refactorings, however those are just a sample of the common ones. You\
    \ often create your own refactorings for a specific situation.\n\nMany refactorings\
    \ share the same abstract shape, which we can document as a micro-process:\n\n\
    +   1. Check whether the refactoring will run into any problems\n2. Introduce\
    \ a new code element\n3. For each thing to migrate:\n   (a) Migrate one client\
    \ of the old element to use the new one\n   (b) Test\n4. Delete the old element\n\
    5. Test\n\nThis is a safe approach. The unsafe alternative is to change the old\
    \ mechanism to use the new one, migrate everything in one bound, and hope for\
    \ the best.\nLarge refactorings—those composed of smaller refactorings—use this\
    \ approach as well. Indeed, it is fundamental to large refactorings that they\
    \ keep the system working during a migration, as it could take hours, days, or\
    \ even weeks.\nThere are a variety of ways for each of these steps (Check, Introduce,\
    \ For, Migrate, Delete, Test) to be realized; we've noted some of the possibilities\
    \ in the following-sections. These can be assembled to build up many new refactorings.\n\
    \n# Check\n\nThese actions confirm that something is true.\n\n+   * *Prove*: Prove\
    \ (formally or informally) that the proposed refactoring is safe.\n* *Look*: Look\
    \ in the code to see if there is anything that would interfere with the refactoring\
    \ to come. For example, you cannot rename f() to g() if g() already exists.\n\
    * *Assert*: Introduce an assertion, code that verifies that some condition is\
    \ true as you expect at a particular point. Use assertions in conjunction with\
    \ tests, but recognize that they can only verify the cases the tests cover."
  merge: -1
