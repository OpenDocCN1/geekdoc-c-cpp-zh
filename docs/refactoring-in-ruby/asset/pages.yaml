  md: '# Combinatorial Explosion


    # What to Look For


    +   - To introduce a single new concept, you must introduce multiple classes at
    various points of a class hierarchy.

    - Each layer of a class hierarchy uses a common set of words (e.g., one level
    adds style information, and the next adds mutability).


    # Why This Is a Problem


    > > Duplication: This is a relative of Parallel Inheritance Hierarchies, in which
    every-thing has been folded into one class hierarchy.


    # How It Got This Way


    What should be independent decisions get implemented via a hierarchy.


    # What to Do


    +   - If things aren''t too far gone, you may be able to use Replace Inheritance
    with Delegate-ation. (By keeping the same interface for the variants, you can
    create an example of the Decorator design pattern).

    - If the situation has grown too complex, you''re in big-refactoring territory,
    and you can use Tease Apart Inheritance. (See Fields et al.''s Refactoring, Ruby
    Edition [11] for the details.)


    # What to Look for Next


    > > Duplication: Fixing a Combinatorial Explosion is often a big shake-up for
    a lot of classes. As always, check the names you end with, and check the code
    in the (old) hierarchy''s clients for Feature Env and related smells.


    > > Size: The classes of the (old) hierarchy are likely to be fewer and smaller
    now, because they deal with the design''s complexities in a different way. Look
    through their clients for historical compromises such as Nil Checks or Complicated
    Boolean Expressions.'
  merge: -1
