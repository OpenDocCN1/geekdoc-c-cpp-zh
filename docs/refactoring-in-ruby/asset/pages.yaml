  md: '# The Refactoring Cycle


    There''s a basic pattern for refactoring:


    # The Refactoring Cycle


    start with working, tested code while the design can be simplified:


    +   - choose the worst smell

    - select a refactoring that will address the smell

    - apply the refactoring

    - check the tests still pass


    We try to select refactorings that improve the code in each trip through the cycle.
    Because none of the steps change the program''s observable behavior, the program
    remains in a working state. Thus, the cycle improves code but retains behavior.
    The trickiest part of the process is identifying the smell, and that''s the bulk
    of this book emphasizes that topic.


    Is this approach to refactoring guaranteed to get to the ideal design for a problem?
    Unfortunately, no, as there is no guarantee that you can reach a global maximum
    by looking at local properties. But it''s easier to design insights that transform
    a solution when the code is as clean as possible.


    Refactoring is like crossing a stream. One way to cross a stream is to take a
    running leap and hope for the best. The refactoring way is to find stepping stones
    and to cross the stream by stepping on one stone at a time; that way, you''re
    less likely to get wet.


    When you start refactoring, it''s best to start with the easy stuff (for example,
    breaking-up large methods or renaming things for clarity). You''ll find that this
    lets you see and fix the remaining problems more easily.


    # When Are We Done?


    How do we know when to stop refactoring and move on to more development? One approach
    is to seek the "simplest" design. In Extreme Programming Explained [4] Kent Beck
    identified four rules for simple design:


    # Simple Design:


    +   - Passes all the tests.

    - Communicates every intention important to the programmers.

    - Has no duplication of code, or of logic, or of knowledge.

    - Contains no unnecessary code.'
