  md: '# Speculative Generality


    What to Look For


    +   - The application''s design includes "hooks" to permit future adaptation or
    customization, and these hooks are only used in one way—or not at all—right now.

    - Code is more complicated than it has to be for the currently implemented requirements.

    - A class has only one subclass, or a method has only one caller, or a module
    is only used in one place.

    - The names used in part of the application are abstract or overly general.


    Lazy Class and Special Case are often indicators that the application at large
    may be suffering from Speculative Generality.


    # Why This Is a Problem


    Communication: Speculative abstractions can make the code harder to understand.
    Flexibility: Hooks and special cases can get in the way when you want to change
    current behavior. So, they slow down the pace of development and maintenance,
    even creating "no-go" areas within an application. Dealing with such code feels
    like "walking on eggshells."


    # When to Leave It


    An application framework may elements present to support clients'' needs that,
    strictly speaking, aren''t needed by the framework itself. Or perhaps some elements
    are used by test methods and they''re exposed as probe points to allow a test
    to have privileged information about the class. Be careful though—this may indicate
    you''re missing an abstraction that you could test independently.


    # How It Got This Way


    The code may have been built with the expectation that it will become more useful,
    but then it never does. When people try to outguess the needs of the code, they
    often add things for generality or for completeness that end up never used. Sometimes
    the code has been used before, but is no longer needed because new or revised
    ways of doing things. (Speculative Generality may be Dead Code that was created
    on purpose.)'
  merge: -1
