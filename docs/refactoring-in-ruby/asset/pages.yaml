  md: "# Feature Envy\n\nWhat to Look For\n\n+   - A code fragment references another\
    \ object more often than it references itself.\n- Several clients do the same\
    \ series of manipulations on a particular type of object.\n\nWhy This Is a Problem\n\
    \n+   - Communication: Code that “belongs” on one class but is located in another\
    \ can be hard to find and may upset the System of Names in the host class.\n \
    \ - Flexibility: A code fragment that is in the wrong class creates couplings\
    \ that may not be natural within the application’s domain and a loss of cohesion\
    \ in the unwilling host class; *Shotgun Surgery* and *Divergent Change* often\
    \ occur as a consequence.\n\n+   - Duplication: Existing functionality that is\
    \ to find is also easy to miss, which in turn may lead to it being written more\
    \ than once.\n\n# When to Leave It\n\nSometimes behavior is intentionally put\
    \ on the “wrong” class. For example, some design patterns, such as Strategy or\
    \ Visitor, pull behavior to a separate class so it can be independently changed.\
    \ If you put it back, with *Move Method* you can end up putting together that\
    \ should change separately.\n\n# How It Got This Way\n\nWherever you have a Data\
    \ Class you will probably also have Feature Envy, but you can see it for any class\
    \ and its clients.\n\n# What to Do\n\n+   - 1. If the envious code fragment is\
    \ not isolated, use Extract Method to pull it into its own method.\n- 2. If the\
    \ envious method makes no references to *self* or *self.class*, see Utility Function.\n\
    - 3. Look for the class of the object that is referenced most and use Move Method\
    \ to put the actions on the correct class."
