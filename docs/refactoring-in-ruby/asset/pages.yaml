  md: "# Greedy Module 9\n\nWe now introduce extra parameters to text, line, and polyline\
    \ in the same way:\n\n```\ndef text(x, y, msg, font family, font size, fill)\n\
    %<text x=\"#{x}\" y=\"#{y}\">\n    font family=\"#{font family}\" font size=\"\
    #{font size}\"\n    fill=\"#{fill}\" >#{msg}</text>\n\ndef line(x1, y1, x2, y2,\
    \ stroke width)\n%<line x1=\"#{x1}\" y1=\"#{y1}\" x2=\"#{x2}\" y2=\"#{y2}\"\n\
    \    stroke=\"#{stroke width}\" />\n\ndef polyline(points, fill, stroke, stroke\
    \ width)\n%<polyline fill=\"#{fill}\" stroke=\"#{stroke}\"\n    stroke width=\"\
    #{stroke width}\"\n    points=\"#{points.join(' ')}\" />\n```\n\nThe calling code\
    \ can change to match, for example:\n\n```\nSQUARE SIDE 4\nSPARK COLOR 'red'\n\
    ```\n\n```\ndef spark(centre x, centre y, value)\n    #(rect centre x (SQUARE\
    \ SIDE/2), centre y (SQUARE SIDE/2),\n        SQUARE SIDE, SQUARE SIDE, SPARK\
    \ COLOR, 'none', 0)\n    #(text x+6, centre y+4, value,\n        'Verdana', 9,\
    \ SPARK COLOR)\n```\n\n> Note that we have traded problems. The four drawing methods\
    \ are no longer greedy, but now call themselves SVG magic (color names, font names,\
    \ and drawing element dimensions). This kind of trading is a completely natural\
    \ part of refactoring, as we create areas of stability within the code. We'll\
    \ return to address this **Inappropriate Intimacy (General Form)** later.\n\n\
    # Greedy Module\n\nThat may not be the last of Greedy Methods, but code changes\
    \ in the previous section have highlighted another of the problems in the original\
    \ code: There's an even clearer distinction between code that knows how to write\
    \ an SVG document and code that knows what a sparkline should look like."
