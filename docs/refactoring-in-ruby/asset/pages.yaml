  md: '# Type Embedded in Name


    # What to Look For


    +   - Names that are compound words, consisting of a word plus the type of the
    argument(s)—for example, `add course(course)`.

    - Hungarian notation, where the type of an object is encoded into the name—for
    example, `i count` as an integer variable.

    - Variable names that reflect their type rather than their purpose or role.


    # Why This Is a Problem


    **Flexibility:** The name of a reference has been coupled to the type of the object
    it refers; if changes we could introduce some cognitive drag.

    **Abstraction:** Different names for the same thing can hide abstractions.


    # When to Leave It


    This smells weakest when applied to method names: Sometimes you need to distinguish
    names from each other according to the types of their parameters or return values.
    (An example from core Ruby is the “conversion” methods: to `s`, `to a`, to `i`,
    to `f`, etc.)


    # How It Got This Way


    The type may originally have been added to help with communication: Hungarian
    notation is often introduced as part of a coding standard—for example, in a pointer-based
    language as C it is useful to know that `**ppc` is in fact a character. Programmers
    use a convention where a prefix indicates that something is a member variable
    (`count` vs `m count`). In Ruby, this is redundant—we already use `@` to indicate
    member variables.


    # What to Do


    +   - Use *Rename Method* (or field or constant or parameter) to a name that communicates
    intent without being tied to a type.


    # What to Look for Next


    **Duplication:** Removing the type names may reveal other duplication. Look for
    Alternative Modules with Different Interfaces.'
  merge: -1
