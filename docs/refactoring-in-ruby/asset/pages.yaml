  md: "# 12 Chapter 1: A Refactoring Example\n\nspark’s parameter could represent\
    \ coin tosses, stock prices, or temperatures, so we renamed it while we remembered.\n\
    \nNow take another look at x axis—it only cares how many y-values there are, but\
    \ isn’t interested in the points. We can pass it in the y-values instead:\n\n\
    ```\ndef x(y values)\n\"<! x axis >\n#{SVG.line(0, 200, y values.length, 200,\
    \ '999', 1)}\"\n```\n\nThis means the only code that cares points is the sparkline\
    \ method. We can move the calculation of points into that method:\n\n```\ndef\
    \ sparkline(y values)\npoints []\ny values.each index { |i| points << \"#{i},#{y\
    \ values[i]}\\ >\n#{SVG.polyline(points, 'none', '#333', 1)}\"\n```\n\nAnd so\
    \ finally (after a little tidying up), the creation of the SVG document looks\
    \ like this:\n\n```\nputs %Q(<svg xmlns=\"http://www.w3.org/2000/svg\"\nxmlns:xlink=\"\
    http://www.w3.org/1999/xlink\">\n  #(x axis(tosses))\n  #(sparkline(tosses))\n\
    \  #(spark(tosses))\n</svg>)>\n```\n\n# Feature Envy\n\nLook again at sequence\
    \ of method calls taking tosses as the single parameter. That chunk of code has\
    \ more affinity with the tosses array than it does with the rest of the script.\
    \ Same for the three methods spark, sparkline, and x axis—all do more with the\
    \ array of y values than they do with anything else. There’s a missing class here,\
    \ one whose state is the array, and has methods that know how to draw the pieces\
    \ of a sparkline. Instances of this missing class represent sparklines, so finding\
    \ a name for it is easy. First, we’ll create a simple stub to hold the array:\n\
    \n```\nclass Sparkline\nattr reader :y values\n```"
