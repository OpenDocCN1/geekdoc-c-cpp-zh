  md: "Values are a pair, representing the product of an integer and a dimension.\
    \ They support the various arithmetic operators, with an operator that can extend\
    \ either part of the pair. (For example, 327 extended with 8 becomes 3278, while\
    \ m extended with 1/s becomes m/s.)\n\nrequire 'dimension'\n\n```\nclass Value\n\
    \  attr :number, :dimension\n\n  def initialize number, dimension\n    @number\
    \ number\n    @dimension dimension\n  end\n\n  def clone\n    Value.new(@number,\
    \ @dimension.clone)\n  end\n\n  def extend v\n    return Value.new(number * 10\
    \ + v, dimension) if v.kind_of? Integer\n    return Value.new(number, dimension\
    \ * v)\n  end\n\n  def +(other)\n    raise \"can't mix apples and oranges\" if\
    \ dimension != other.dimension\n    Value.new(number + other.number, dimension)\n\
    \  end\n\n  def -(other)\n    raise \"can't mix apples and oranges\" if dimension\
    \ != other.dimension\n    Value.new(number - other.number, dimension)\n  end\n\
    \n  def *(other)\n    Value.new(number * other.number, dimension * other.dimension)\n\
    \  end\n\n  def /(other)\n    Value.new(number / other.number, dimension / other.dimension)\n\
    \  end\n```"
