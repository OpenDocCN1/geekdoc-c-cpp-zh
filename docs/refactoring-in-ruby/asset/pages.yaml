  md: '# Dynamic Code Creation


    # What to Look For


    +   - Code uses eval, class eval, or module eval to build new code dynamically.


    # Why This Is a Problem


    Dynamic code evaluation is a very powerful mechanism, and with great power comes
    great responsibility.


    +   - Communication: The names of an application''s classes and methods form the
    vocabulary that makes the code-readable. That code becomes harder to read and
    understand when the abstractions are fluid or created late.


    +   - Testability: Testing, or test-driving, anything that changes dynamically
    is an order of magnitude harder than normal test-driven development.


    +   - Flexibility: Dynamic code evaluation is difficult to debug, and often runs
    more slowly than the alternatives.


    # When to Leave It


    Sometimes dynamic code evaluation is the only or best way to solve a particular
    problem. For example, it may be impossible to determine which methods a class
    must have until run-time.


    # How It Got This Way


    It can be difficult to find the right set of abstractions to define a problem,
    and so it makes sense to build them dynamically as the need arises.


    Other times you might want to use the expressive power of standard Ruby classes
    and methods, but you only find out at run-time which ones you''ll need and what
    need to look like.


