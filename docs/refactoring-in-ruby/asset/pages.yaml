  md: '# What to Look for Next


    +   - **Communication**: Review calls that pass around the items from the new
    object; look for opportunities to use *Preserve Whole Object*.


    +   - **Duplication**: Look at uses of the items; there are often opportunities
    to use *Move Method*, etc., to move those uses into the new object (as you would
    to address the *Data Class* smell).'
