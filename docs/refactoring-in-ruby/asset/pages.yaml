  md: '# # CHAPTER 2

    The Refactoring Cycle


    In this chapter, we''ll define refactoring and code smells. Then we''ll look at
    the fundamental cycle of how to improve code with refactoring. Rules for simple
    design will tell us when we''ve done enough. We''ll close with a look at how refactoring
    is a key part of test-driven development.


    # ## What Is Refactoring?


    Refactoring is the art of safely improving the design of existing code. In Refactoring
    [14], Martin Fowler describes it as:


    > “Refactoring is the process of changing a software system in such a way that
    it does not alter the external behavior of the code it improves its internal structure.”


    This has a few implications:


    +   - Refactoring does not include just any changes in a system: Although refactoring
    should always be part of the process used to create new code, it''s not the part
    that adds new features. Test-driven development, for example, consists of writing
    a test, then writing new code to introduce new features, and, finally, refactoring
    to improve the design.

    - Refactoring is not rewriting from scratch: Although there are times when it''s
    better to start fresh, refactoring changes the balance point, making it possible
    to improve code than take the risk of rewriting it. Sven Gori points out (private
    communication) that refactoring preserves the knowledge embedded in the existing
    code.

    - Refactoring is not just any restructuring intended to improve code: Refactorings
    strive to be safe transformations. Even big refactorings change large amounts
    of code'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'are divided into smaller, safe refactorings. (In the best case, refactorings
    are so well defined that they can be automated.) We won''t regard a change as
    refactoring if it leaves the code not working (that is, not passing its tests)
    for longer than a working session.


    +   - emergent design: Refactoring changes the balance point between up-front
    design and emergent design. Up-front design is design in advance of implementation:
    emergent design is intertwined with implementation. The trade-off between up-front
    and emergent design hinges on how well we can anticipate problems or assess them
    in code, and whether it is easier to design and then translate to code or to code
    and then improve. Refactoring lowers the cost and risk of the emergent approach.
    (You might argue about where the line is, but you probably agree that it shifts.)


    +   - Refactoring can be small or large: Many refactorings are small. Ideally,
    small refactorings are applied "mercilessly" enough that large refactorings are
    rarely needed. Even when applying large-scale refactoring, the approach is not
    new features for six months while we refactor, but rather, refactor as we go,
    and keep the system running at all times.


    # Smells Are Problems


    Code smells are warning signs about potential problems in code. Not all smells
    indicate a problem, but most are worthy of a look and a decision.


    Some people like the term smell, and prefer to talk about potential problems or
    flaws, but we think smell is a good metaphor. Think about what happens when you
    open a fridge that has things going bad inside. Some smells will be strong, and
    it will be obvious what to do about them. Other smells will be subtle; you won''t
    be sure if the problem is caused by the leftover peas or last week''s milk. Some
    food in the fridge may be bad without having a particularly bad smell. Code smells
    are a bit like that: Some are obvious, aren''t. Some mask other problems. Some
    go away unexpectedly when you fix something else.


    Smells usually denote localized problems. It would be nice if people could easily
    erase a whole system. But humans aren''t so good at job; local smells work with
    our tendency to consider only the part we''re looking at right.


    Finally, remember that a smell is an indication of a potential problem, not a
    guarantee of an actual problem. You will occasionally find false positives—things
    that smell to you, but are actually better than the alternatives. But most code
    has plenty of real smells that can keep you busy.'
