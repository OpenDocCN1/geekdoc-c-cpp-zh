  md: '# Implementation Inheritance


    What to Look For


    +   - Inheritance between two classes doesn''t represent an is-a relationship
    (similarity of behavior—i.e., substitutability).

    - Instances of the subclass are never passed as substitutes for instances of the
    parent.

    - A subclass uses or publishes only a subset of the behavior it inherits from
    its super-class. (Also see Refused Bequest.)


    # Why This Is a Problem


    **Communication:** An inheritance relationship is likely to be read as an intention
    for the subclass to be substitutable for the parent. If that isn''t the case—if
    the relationship exists only to allow the subclass to borrow code—then the design
    is being miscommunicated. Readers of this code, and designers of client classes,
    may make incorrect decisions by assuming that the inheritance relationship means
    more than intended.


    **Abstraction:** The public interface of the subclass inappropriately reveals
    things about how the class is implemented.


    **Flexibility:** Inheritance is the strongest kind of relationship between two
    classes, and creates a coupling that can restrict change or be difficult to break.
    Use inheritance sparingly, as Ruby provides more than enough other ways to share
    object behavior. Don''t waste one permitted superclass when you could use a delegate
    or a mix-in instead.


    # When to Leave It


    This is not a strong smell, and you may decide that it just isn''t serious enough
    to fix.


    # How It Got This Way


    Often, creating an inheritance relationship is the quickest way to borrow code
    from a class that already exists.


    # What to Do


    +   - If the inherited methods don''t be public, use Replace Inheritance with
    Delegation. If only a subset of the behavior of the parent class is used, consider
    Extract'
