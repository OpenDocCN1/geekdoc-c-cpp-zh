  md: '# Exercise 7.4: Formatting Names


    +   A. Symptoms of Greedy Method:


    +   (a) The method''s name hints that it may be calculating and outputting the
    person''s name.


    +   (b) The method''s parameters are completely unrelated to each other—out is
    related to the run-time environment, whereas person is from the application''s
    domain.


    +   (c) The method is a Utility Function—it needs those disparate parameters to
    provide all of its working context.


    +   B. Begin by untangling the two parameters. In this case, construct the full
    name and then write it out in one:


    ```

    def display name(out, person)

    full name person.first + ''''

    if person.middle != nil

    full name + person.middle + ''''

    end

    full name + person.last

    out.write(full name)

