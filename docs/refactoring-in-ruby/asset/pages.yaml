  md: '# Uncommunicative Name


    # What to Look For


    A name doesn''t communicate its intent well enough. Examples of this can include:


    +   - One- or two-character names

    - Names with vowels omitted

    - Numbered variables (e.g., panel, pane2, and so on)

    - Odd abbreviations

    - Misleading names


    # Why This Is a Problem


    +   **Communication**: Poor names deceive the reader; they make it harder to build
    a mental picture of what''s going on, and they can be misinterpreted. They also
    hurt the flow of reading as the reader may slow down to interpret the names.

    **Flexibility**: Very short names can be difficult to change, even with automated
    refactoring tools.


    # When to Leave It


    Some teams use short names such as i, j, or k for loop indexes or e for characters;
    these aren''t too confusing if the scope is limited. Similarly, you may occasionally
    find that numbered variables communicate better.


    # How It Got This Way


    When you first implement something, you have to name things somehow. You give
    the best name you can think of at time and move on. Later, you may have an insight
    that lets you pick a better name.


    # What to Do


    +   - Use Rename Method (or field, constant, etc.) to give it a better name.


    # What to Look for Next


    +   **Duplication**: Look for places where the same name means different things,
    or the same thing has different names.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# Inconsistent Names


    What to Look For


    +   - One name is used in place, and a different name is used for the same thing
    somewhere else. For example, in a single application you might see add, store,
    put, and place for the same basic method.


    # Why This Is a Problem


    ◁ Communication: Multiple names (for no reason) make it hard for the reader.

    📖 Duplication: The different names may hide similar methods.


    # How It Got This Way


    Different people may create the classes at different times. (People may forget
    to explore the existing classes before adding more). Occasionally, you''ll find
    people doing this intentionally (but misguideedly) so they can distinguish the
    names.


    # What to Do


    Pick the best name, and use Rename Method (or field, constant, etc.) to give the
    same name to the same things.


    > > The Eiffel language uses a common pool of words for the names of its library
    features; the Rails framework also uses naming conventions extensively. You can
    use this technique as inspiration: Look to existing library names for the vocabulary
    you use.


    # What to Look for Next


    📖 Duplication: Addressing this smell can make classes become more similar than
    when they started. Look for a duplication smell and eliminate it.'
