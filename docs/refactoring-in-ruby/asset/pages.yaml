  md: '# Inappropriate Intimacy (General Form)


    What to Look For


    +   - One class uses or changes “internal” (should-be-private) parts of another
    class.

    - One class depends on implementation details of another class.

    - Code uses `instance variables` or `instance variable get` to dig inside another
    object.


    (There is a related form of inappropriate intimacy between subclass and superclass;
    see **Inappropriate Intimacy (Subclass Form)** in Chapter 11, “Inheritance.\)


    # Why This Is a Problem


    +   - **Flexibility**: If implementation details of the “violated” class change,
    the consequences could propagate to the client.

    - **Simplicity**: If the semantics or behavior of the “violated” class change,
    but don''t affect the types at the interface, we may introduce subtle defects
    in its clients.

    - **Abstraction**: There may be a missing concept embedded in the interaction
    between the existing classes.

    - **Duplication**: Several client classes may duplicate code by accessing internals
    in similar ways.


    # When to Leave It


    Digging into another object''s state is sometimes the simplest way to get something
    done. It is often necessary to implement a generic data transfer mechanism—for
    example, as part of a persistence scheme or to implement views that can display
    arbitrary objects.


    # How It Got This Way


    The two classes probably became intertwined a little at a time. By the time you
    realize there''s a problem, they''re tightly coupled.


    # What to Do


    +   - If two independent classes are entangled, use `Move Method` and `Move Instance
    Variable` to put the right pieces on the right class.'
