  md: '# Long Method


    What to Look For


    +   - A method has a large number of lines. (We''re immediately suspicious of
    any method with more than five lines.)


    # Why This Is a Problem


    +   - Flexibility: A Long Method is guaranteed to be a Greedy Method—at least
    two responsibilities are coupled together in one place, which in turn leads to
    Divergent Change.

    - Testability: It can be difficult to isolate individual behaviors of a Long Method
    for testing; and if a method too much it may also be difficult to create fixtures
    that contain enough context for the method to work properly.


    # When to Leave It


    It may be that a somewhat longer method is just the best way to express something.
    (Like almost all smells, the length is a warning sign, not a guarantee of a problem.)


    # How It Got So This Way


    You can think of it as the Columbo syndrome. Colombo was the TV detective who
    always had "just one more thing." A method starts down a path, rather than break
    the flow or identify the helper classes, the author adds one more thing. Code
    is often easier to write than it is to read, so there''s a temptation to write
    fragments that are too big.


    # What to Do


    +   - Use Extract Method to break up the method into smaller pieces. Look for
    comments or white space delineating interesting fragments that are semantically
    meaningful, not just introduce a function call every seven lines.

    - You may find other refactorings (those that clean up straight-line code, conditionals,
    and variable usage) helpful before you begin splitting up the method.

    - If the method doesn''t separate easily into pieces, consider Replace Method
    Method Object to turn the method into a separate object.


    It''s natural to worry about the performance hit from increasing the number of
    method calls, but most of the time is a non-issue. By getting the code as clean
    as possible before worrying about performance, you have the opportunity to gain'
