  md: '# Control Coupling


    What to Look For


    +   - A method or block checks the value of a parameter in order to decide which
    execution path to take.

    - A method’s name includes a word such as “or.”


    # Why This Is a Problem


    +   - **Duplication:** Control Coupling is a kind of duplication, because the
    caller already knows which path should be taken.

    - **Flexibility:** The caller and called are coupled together—any change to the
    values of the controlling parameter must be reflected on both sides.

    - **Simplicity:** The called method probably also a **Greedy Method**, because
    it includes at least two different code paths.


    # How It Got This Way


    Sometimes we want to modify a method’s behavior slightly, but we don''t want to
    lose the original behavior, so we add a parameter and use it to vary the method’s
    course.


    # What to Do


    +   1. Use *Extract Method* to strip the controlled method down to the bare skeleton.

    2. Then use *Inline Method* to push the responsibility back up to the caller(s).

    3. Repeat all the way up the call stack to the source of the control value.


    # What to Look for Next


    +   - **Duplication:** If the control parameter was passed by more than one caller,
    the *Inline Method* step (mentioned in the preceding section) will have introduced
    some duplication: remove it you go.

    - **Size:** After the dust has settled, check whether any of the *Inline Method*
    steps leave behind a *Lazy Class*.

    - **Abstraction:** When you’ve found the source(s) of the control variable, you
    probably now have a case of **Simulated Polymorphism.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Simulated Polymorphism


    What to Look For


    +   - Code uses a case statement (especially on a type field).


    +   - Code has several if statements in a row (especially if they’re comparing
    against the same value).


    +   - Code uses instance of?, kind of?, is a a?, or to decide what type it’s working
    with.


    +   - Multiple conditionals in different places test the same value.


    # Why This Is a Problem


    +   - Flexibility: When the value is tested in multiple places throughout an application,
    any change to the set of possible values causes many methods and classes to change.
    This is a major cause of Shotgun Surgery and Divergent Change, and missing a single
    case could introduce defects.


    +   - Abstraction: Tests for the type of an object may indicate that the abstraction
    represented by that type is not completely defined (or understood).


    +   - Communication: Conditional code is hard to read and understand, because
    the reader must hold more state in his head.


    # When to Leave It


    Sometimes—particularly at subsystem boundaries—a case statement is the simplest
    way to express the logic.


    # How It Got This Way


    This smell is often caused by laziness in introducing new classes. The first time
    you need conditional behavior, you might use an if or case statement rather than
    a new class. It''s not a big problem at this point because it only occurs once.
    However, if you need another condition based on the same type code, you introduce
    a second case instead of fixing the lack of polymorphism.


    Sometimes the lack of polymorphism is hidden behind a series of if statements
    instead of an explicit case statement, but the root problem is the same.'
  merge: -1
  pgno: 114
