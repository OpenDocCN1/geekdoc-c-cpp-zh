  md: '# Data Class


    # What to Look For


    +   A class consists of only trivial reader and writer methods for instance variables,
    may-be with a constructor to initialize them.


    # Why This Is a Problem


    +   **Abstraction**: Objects are intended to encapsulate both data and behavior,
    but a Data Class only has data. The clients of the class do the "heavy lifting"
    for the class.


    +   **Duplication**: Multiple classes often have to do similar work.


    # When to Leave It


    There are times when `attr accessor` is the simplest and best approach. For example,
    consider a point with `x` and `y` coordinates. The interface probably isn''t going
    to change, and people may deal with *lots* of points. So it makes sense for a
    `Point` class to declare public `attr accessor`.


    Some persistence mechanisms (e.g., ActiveRecord) rely on reflection to determine
    what data should be loaded or stored. Such classes may be constrained by their
    "data class" nature.(You can add methods, but the class tends to be centered around
    its data.) It is sometimes better to treat these classes as Mement (see Gamma''s
    *Design Patterns*), and to use another class as a layer above these persistence
    classes; that new class can benefit from all the changes described here, and it
    will hide the low-level classes.


    # How It Got This Way


    It''s common for classes to begin like this: You realize that some data is part
    of an independent object, so you extract it. In fact, the creation of a `Data
    Class` is a good first step in removing the `Open Secret` and `Data Clump` smells.
    But objects are about the commonality of *behavior*, and these objects aren''t
    developed enough as yet to have behavior.


    # What to Do


    +   1. Use *Remove Setting Methods* for as many instance variables as you can.


    +   2. Use *Encapsulate Collection* to remove direct access to any collection-type
    fields.'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'Data Class


    +   3. Look at each client of the object. Almost invariably, you''ll find Feature
    Envy and Inappropriate Intimacy (General Form)—clients accessing the fields and
    manipulating the results when the data class could do it for them.(This is often
    a source of duplication, because many callers will tend to do the same things
    with the data.) Use Extract Method on the client to pull out the class-related
    code, then Move Method to pull it over the class.


    +   4. After doing this a while, you may find that you have several similar methods
    on the class. Use Rename Method, Extract Method, Add Parameter, or Remove Parameter
    to harmonize signatures and remove duplication.


    +   5. Most access to the instance variables shouldn''t be needed any more because
    the moved methods cover the real use. Use Remove Method to eliminate the readers
    and writers.


    # What to Look for Next


    +   - Communication: Review the names used in this class to ensure that the methods
    you bring in present a consistent API to the class''s clients.

    - Duplication: Where you moved methods from clients into this class, check whether
    those clients are now Lazy Classes and whether they now contain further Duplication.'
  merge: -1
