  md: '# Reinvented Wheel


    What to Look For


    +   - You''ve coded an algorithm with exactly the same behavior as an existing
    Ruby or standard library feature.


    Why This Is a Problem


    +   - **Duplication**: Your code duplicates existing code. This is a variant of
    **Alternative Modules with Different Interfaces** at the level of an algorithm
    or a few methods.

    - **Communication**: Other developers have to waste time reading your code carefully
    to understand its effects.

    - **Simplicity**: It is possible that there are defects in your code that aren''t
    present in the library version of the same functionality.


    # When to Leave It


    If the existing library has defects or other shortcomings, you may have no choice
    but to reinvent the wheel.


    # How It Got This Way


    The code was written by someone not familiar with Ruby’s libraries. Or the Ruby
    libraries have evolved since your code was written, and now your version is obsolete.

    If the existing library’s API is inconvenient for your application, consider adding
    a Wrapper layer to morph the interface into one you can use.


    # What to Do


    Fix this smell in the way you would fix **Alternative Modules with Different Interfaces**
    (See Chapter 8, “Duplication”).


    # What to Look for Next


    +   - Size: Now that you have folded your own algorithm back into the libraries,
    you may find that the class it from is now a **Lazy Class**—or at least contains
    some **Dead Code**.

    - **Communication**: The library may use a different *System of Names* than you
    had, so check for *Inconsistent Names* in the area you just changed.'
