  md: 'We’ve seen how *Wii Sports Resort* includes a variety of training modes based
    on the use of MotionPlus, but the creation of software to test and train the player
    in using Wii controls began with the first version of the Wii Remote, most blatantly
    in *Wii Play*, released in Japan (2006) as “Introduction to the Wii.” This is
    a bundle of nine minigames, some of which overlap conceptually with *Wii Sports*,
    and others of which served as precursors to games in *Wii Sports Resort*—games
    like Shooting Range, Table Tennis, Laser Hockey, Fishing, Billiards, Charge!,
    and Tanks!, as well as the more casual Mii-based games, Find Mii and Post Mii.
    Some of the games seem to have been featured conceptually in the early videos
    that Nintendo showed of players using the system, and one gets the sense from
    them of a short and direct line leading from experimental research and development
    on what the new Wii Remote might do to the boxed software for the retail market.
    It’s almost as if the player gets to play test a range of possible applications
    of the new controller.


    # WarioWare: Smooth Moves


    The most creative example of a game that incorporates training and proof-of-concept
    uses of the Wii Remote into actual gameplay is *WarioWare: Smooth Moves*, a series
    of over two hundred fast-paced, timed microgames (much faster and shorter than
    minigames, at about five seconds each) that train the player in various possible
    gestures using the Wii Remote. Many of the microgames seem as if they could be
    dadaist, self-aware ports of alpha or beta tests of the new Wii Remote, in keeping
    with the spirit of the fictional *WarioWare* franchise itself. Released in 2006
    as a launch title for the Wii, *WarioWare: Smooth Moves* was produced by the Software
    Planning and Development Division. Designer Yoshio Sakamoto has said that the
    team immediately came forward with a software proposal once they saw the concept
    for Wii Remote, thinking, “This was made for WarioWare!”


    The feel of *WarioWare: Smooth Moves* microgames is summed up in its slogan, which
    Miyamoto himself approved and insisted be written on the game’s packaging: “More!
    Shorter! Faster!” Reportedly, the team solicited brief ideas for microgames from
    Nintendo employees, who wrote about a thousand such ideas on yellow sticky notes
    and stuck them up on a wall. The team winnowed it down to the two hundred included
    in the game when it was released. Somewhat oddly, the developers suggest that
    “female staff” in particular kept coming up with fun ideas for microgames, but
    the team was concerned that players wouldn’t know how to hold the Wii Remote in
