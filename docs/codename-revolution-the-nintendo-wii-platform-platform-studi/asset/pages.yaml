- pgno: 44
  md: 'Despite the broader audience, the physical design of the game consoles has
    not been changed to meet the growing popularity. The design focus upon young,
    excitable males limits the potential audience, excluding not only many girls and
    women but also many men. This rich potential is completely untapped.^8^


    The Wii was designed precisely to tap this potential market. Miyamoto has said
    that in conceiving of the system, the company asked itself, “What might convince
    moms to buy this for their kids?”—and he admits that the developers deliberately
    aimed for a low-cost console because it would “make moms happy.”


    Our goal was to come up with a machine that moms would want—easy to use, quick
    to start up, not a huge energy drain, and quiet while it was running. Rather than
    just picking new technology, we thought seriously about what a game console should
    be.^9^


    Clearly “moms” is a gendered, even sexist marketing construct—one that assumes
