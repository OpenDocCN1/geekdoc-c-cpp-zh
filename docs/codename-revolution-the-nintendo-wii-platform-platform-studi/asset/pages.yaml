- pgno: 96
  md: 'Fit even qualify as a game? These are of course semantic questions with no
    obvious final answers. For Nintendo’s part, rather than defining games in strict
    terms, Iwata has said that with the Wii, the company has begun to think in the
    less restrictive terms of just making “things that respond in fun ways to human
    input.”


    In 2006, the same year that the Wii launched, this sort of expanded purpose led
    to the launch of the Touch Generations brand of games within Nintendo for the
    DS and Wii platforms. These games were targeted to the broadest-possible audience,
    first in Japan, with extremely popular titles such as *Brain Training* and *Nintendogs*.
    The software with which the Balance Board was bundled, *Wii Fit*, goes even further
    afield from traditional games than these do. Yet as we’ve seen, Nintendo executives
    were careful in the year of its release to refer to it repeatedly as a game—perhaps
    worried about losing Nintendo’s core audience as a result of expanding its mission
    too broadly too quickly. *Wii Fit*’s logo shows the word “fit” right up against
    “Wii” and leaning a little to the right, like a player standing on the Balance
    Board. It’s essentially a collection of exercise and health-management software
    programs with the addition of some balancing and aerobic games. These *Wii Fit*
    games use the Balance Board as a motion-sensitive controller—though in a different
    way from the Wii Remote—or use the Balance Board and Wii Remote in combination.
    Or in one anomalous case, jogging, the Wii Remote alone is used. You hold it or
    put it in your pocket in order to jog in place and make the Mii avatar jog through
    the game’s on-screen environment. There are gamelike elements in several of the
    activities, but most of *Wii Fit* clearly falls on the exercise side of the “exergame”
    genre.


    Within Nintendo, there seems to have been a division between those working on
    the core franchises—Zelda and Mario—and *Wii Fit*. Even with Miyamoto backing
    it, *Wii Fit*’s team evinces a certain self-consciousness about working on something
    so far from traditional gaming—something, as one staff member in the Software
    Development Department says, that’s at the “opposite [end] of the gaming spectrum”
    from Zelda games.⁹ A similar response can be seen among gamers once *Wii Fit*
    was announced and released. A video that Nintendo executives showed during presentations
    to introduce the game was later remixed by a user for the Web site sarcasticgamer.com
    and posted to YouTube. In it, we see the official video of a series of actors
    demonstrating the Balance Board’s use over a soothing sound track, intercut with
    on-screen clips of the game, but in the place of Nintendo’s narration, a parodic
    voice-over says:


    The makers of *Wii Sports* now give you a little white thing you stand on.'
