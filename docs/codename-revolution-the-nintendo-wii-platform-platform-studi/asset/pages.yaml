- pgno: 38
  md: 'The Nintendo Wii, released in 2006, is the company''s fifth home console, coming
    after the GameCube (2001), Nintendo 64 (1996–2002), the sixteen-bit Super Nintendo
    Entertainment System or SNES (1990–2000), and the eight-bit NES (1983–1994, or
    Famicom—"Family Computer"). These home video game systems were at first a departure
    for a traditional company that was founded, as mentioned earlier, in the nineteenth
    century to manufacture playing cards, and made its name and initial capital in
    the public space of the arcades, most famously with Donkey Kong.


    By definition, a console like the Wii is usually hooked up to a television set
    and serves as the computing heart of a video game entertainment platform in the
    home. Even in this sense, as naming a home entertainment device, the term console
    has a long history. As early as the 1920s, it would have referred to a piece of
    furniture, a cabinet designed to hold a radio receiver or phonograph record player
    along with its wiring, speakers, fittings, and so on, and mounted with control
    knobs, illuminated dials, and other displays. Later, televisions came in "console
    models" in large wooden cabinets that amounted to substantial pieces of furniture.
    Console can also refer to any encased control panel—for instance, the levers,
    stops, and pulls of an organ, which are separate from the body of the musical
    instrument itself. Starting with the first historical example of a home video
    game console, the Magnavox Odyssey in 1972, during the 1970s the term came to
    mean the main box housing "a new variety of electronic game that can be hooked
    up to the family TV set." Much as the concept "desktop computer" does, a console
    contains and unifies a variety'
