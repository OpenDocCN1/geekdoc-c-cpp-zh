- pgno: 95
  md: 'repurposing an optical rotary encoder that had been used in the Nintendo 64
    controller, and one prototype involved using a single sensor of this kind. Another
    idea was just to attach the Wii Remote to the Balance Board using a cable and
    special slot, and in that way gather data on the tilting motion of the board.


    In the end, however, concerns over cost as well as safety and liability (the Balance
    Board when configured in this way would be too high or might tilt too much when
    a player was standing on it) led to the adoption of a different kind of load sensor—strain
    gauges in each of the stubby feet. In each strain gauge, tiny sensors measure
    the stress put on the small pieces of metal to which they''re attached, as the
    strips are deformed ever so slightly by the player''s shifts in weight from one
    foot to another, or by leaning forward onto one''s toes or back onto heels. The
    strain gauge is a relatively simple sensor with almost no moving parts, so it''s
    a robust technology for a peripheral on which players will be standing and stepping
    (sometimes harder than they need to). As if to make a point, Nintendo went so
    far as to have it officially certified as a standard-observant bathroom scale
    in Japan, and Japanese models include a sticker testifying to that certification.
    Electric resistance is increased in the metal wire as it''s stretched or deformed,
    and the changes in voltage are thus converted into data about player movements,
    using the peripheral''s onboard processor. The data is sent to the console via
    Bluetooth at sixty signals per second, where the results are translated into on-screen
    actions.^5


    Once it became clear that the designers would not be tethering the Balance Board
    to the Wii Remote as an extension controller, an independent wireless module giving
    the Balance Board its own Bluetooth link had to be included.^5 This was a first
    for the Wii; all other controllers are extensions of the Wii Remote, piggybacking
    on its wireless connection. One of the developers has pointed out that this new
    independent wireless module opens the door to any number of future Wii peripherals
    that might be developed, revealing a concept of platform as extending out into
    the living room indeterminately, through a series of peripheral devices scattered
    like furniture, just like the coffee table, remote control, rug, or scales, and
    one can perhaps imagine others—the platform as the whole LAN of communication
    and control.


    # **Wii Balance Board as a Game Controller**


    It may be an interesting piece of hardware, and may fit into a larger business
    and design plan on Nintendo''s part, but is the Balance Board really best understood
    as a working game controller? And does software like Wii'
