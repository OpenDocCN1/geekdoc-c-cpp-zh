    to adjust or turn off the 3D view. It contains the same kind of accelerometer
    and gyroscope combination as the Wii, allowing for motion-sensitive games. It
    has two cameras, facing out and back, with which users can take their own 3D pictures
    or capture the surrounding environment so that it can be combined with characters
    and objects in augmented reality games. (In this way, the 3DS extends the design
