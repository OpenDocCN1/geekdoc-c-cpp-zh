  md: '# Wii Sports Resort


    The most extensive tests of the Wii Remote with MotionPlus are gathered in Nintendo’s
    own *Wii Sports Resort* collection, the sequel to the proof-of-concept games that
    shipped with the system in 2006, *Wii Sports*. The MotionPlus accessory was bundled
    with the new game, and an instructional video accessible from the introductory
    title screen shows the player how to attach it to the base of the Wii Remote and
    then calibrate the new controller device.


    The game is set on the fictional Wuhu Island, apparently somewhere in an imaginary
    Pacific. The island may be based in part on Nintendo’s company resort, purchased
    in 1991 on the Big Island of Hawaii, where employees could rent a house or apartment
    at subsidized rates.²¹ The real resort offers access to the Mauna Lani golf course,
    and the fictional Wuhu Island also contains a lush golf course as well as a Hawaiian-looking
    volcanic mountain, but also has an odd, quaint European-style village on it along
    with lots of fields, trails, pathways, and coastal waters where the twelve different
    resort-themed sports are located: Swordplay, Wakeboarding, Archery, Frisbee, Cycling,
    Golf, Table Tennis, Bowling, Basketball, Canoeing (which is really more like kayaking,
    except for the paddles), Power Cruising, and Air Sports. The original *Wii Sports*
    had five games, only two of which were updated for the sequel. In each *Wii Sports
    Resort* game you play as a Mii, and Mii NPCs show up as competitors or observers,
    sometimes to comic effect.


    The system’s fidelity is less precise than is often claimed, but motion mapping
    is nonetheless the point in the end, and the results can be surprisingly satisfying
    during many of the games. These nonrealistic sports simulations deploy the near
    one-to-one mapping provided by the motion-sensitive controller to make your mimed
    actions feel fairly realistic, rather than attempting to make anything look realistic.
    The rest of the game’s pleasures are found in the cartoon artistry and entertaining
    design, including the comic use of Miis. In a bit of interesting metacommentary
    on the mapping of player to the game, the instructional diagrams in the manual
    show a blue-silhouetted Mii for in-game illustrations and a blue-silhouetted,
    normally proportioned woman (with her hair in a topknot) for all player illustrations.
    The human player, two kinds of helper representations, and the Mii avatar are
    all transparently, almost allegorically related. You’re clearly meant to enjoy
    their interlinked correspondences as a design feature as you move among them during
    gameplay, as opposed to losing yourself in anything approaching a realistic immersive
    game world.'
