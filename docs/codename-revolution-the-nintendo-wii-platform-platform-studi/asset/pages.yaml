    this feature, saying in interviews before the release, “We think we’ve defeated
    the waggle.”^21^ His remark echoes the claims made by the developer of the technology
    inside the MotionPlus device, Invensense: “No more playing ‘lazy Wii!’ . . . no
    more lying around on the couch and simply flicking your wrist to play Wii games.
    Sorry!”^22^ An early reviewer of the game agreed, asserting that he quickly learned
    that you really have to stand up to play effectively.^23^ It’s interesting that
    for reviewers and developers, the idea of motion fidelity and the system’s tendency
    to promote full-body movement is recognized as a goal for Wii gameplay, and a
    kind of test of its success as a platform.


    Adjusting the control system may have been the hardest part of designing *Red
    Steel 2*, but the decision that made that adjustment possible, that made it possible
    to take advantage of MotionPlus device without dragging down gameplay, was the
    overall graphic design of the game. Instead of realistic 3D graphics, *Red Steel
    2* is drawn in the style of comic books and manga in particular, using cel-shaded
    graphics made up of distinct black outlines. The invocation of manga fits with
    the samurai-Western theme, and like the Miis, these differently simplified characters
    and settings allow for smoother polygon rendering; the game runs at sixty frames
    per second. Cel-shaded animation, or “non-photorealistic rendering,” is also commonly
    referred to as “toon shading,” and the cartoon effect is valued by gamers who
    fondly remember, for instance, the cel-shaded Link in *The Legend of Zelda: Wind
    Waker* for the GameCube. Cel shading is itself a kind of “retro” artistic back-formation,
    a complicated process that begins in most cases with a 3D model, and applies filters
    and lighting to achieve the “flatter” hand-drawn look. One important result, though,
    when it comes to the Wii is that designs can be made to require fewer polygons
    for detailed textures, because the design can suggest textures and details in
    a more abstract way via the drawing style itself. So this style of graphic animation
    is particularly suited to the limits of the Wii processor.


    In *Red Steel 2*, perhaps the most noticeable manifestations of the style are
    the unrealistic streaking motion lines and reflective flares surrounding your
    moving sword or an opponent’s oversize hammer, for example, both of which have
