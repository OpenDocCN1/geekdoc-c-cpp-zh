  md: 'which their Mii family uses their tiny virtual Wii to watch television or play
    games. It''s a perfect illustration of the aesthetic effects that Gingold attributes
    to Miyamoto''s miniature garden—the playing with the relationships among various
    levels of micro- and macroscales in a virtual living room that''s like a domestic
    container garden, a sort of bonsai version of the room in which the Wii is actually
    meant to be played.


    The name of the service combines Wii with ocha no ma, which is a word for a traditional
    Japanese family living room, where Miis representing a family can assemble. When
    announcing the channel, Iwata suggested that the spread of large flat-screen televisions
    at just the moment when the Wii was introduced offered an opportunity for Nintendo
    to return entertainment to a central viewing location in the era of mobile devices
    and the Internet, a way to reclaim the living room—while also, thanks to Wii Fit
    and Wii Sports, transforming that traditional living room into a new kind of game
    space. According to Iwata, Nintendo research showed that most people had the Wii
    attached to the largest screen television in the house, and he interprets this
    as a cultural opportunity to "revitalize" the living room, to encourage family
    members to "smile" as they watch videos or play Wii games together.59


    As we''ve seen, Nintendo''s revolution is inherently Janus-faced: it looks forward,
    while also looking back. In this way it attempts to redefine gaming and the audience
    for gaming. The Wii claims to offer a new style of gaming to a new audience for
    games, but it does this in part by looking back with reassuring nostalgia to an
    idea of entertainment associated with the company in its earlier heyday in the
    1980s. Wii no Ma is so far a localized Japanese version of the side of the console
    that seeks to return to Nintendo''s roots in family entertainment and (re)occupy
    the living room. In that context, the white rectangular Balance Board is a platform
    of another sort—the kind you stand on—that signifies the importance of the game
    platform''s social function out in physical space. It''s a peripheral at the active
    periphery. It does look like another a piece of streamlined furniture, along with
    the round coffee table, designed for the real-life version of that tiny miniature
    living room, like a yoga or tatami mat, but with technology inside. It is an object
    at home in the idealized family space, the social space occupied by the player''s
    body, where the Wii as a social platform is designed to be experienced.'
