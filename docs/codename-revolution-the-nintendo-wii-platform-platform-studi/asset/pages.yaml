    # **The Book''s Plan**


    A video game console is a platform made up of separate but interrelated components,
    and this book is organized accordingly. Each chapter focuses on a major component
    of the Wii as a platform (see figure 1.1). Chapter 2 looks at the console itself,
    the housing of the motherboard and chipset, the computing heart of the system,
    as well as the symbolic object whose design sets the Wii apart in the marketplace.
    We summarize technical specifications, in this and other components, not for their
    own sake, but rather in order better to understand the specific affordances and
    constraints of the system, including especially its perceived and actual limitations
    when it comes to power and graphics capabilities. We briefly examine one aspect
    of the decision to make the Wii a relatively lower-powered console that''s often
    overlooked: the fact that with lower power comes lower power consumption. The
    Wii consumes much less electricity than comparable'
