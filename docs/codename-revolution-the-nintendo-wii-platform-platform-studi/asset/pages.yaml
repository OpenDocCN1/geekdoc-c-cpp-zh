  md: 'unprotected areas. These are sports rather than combat games, and they''re
    not realistic, except in terms of the feeling they afford of wielding the sword
    via your controller. It feels fairly realistic, is the point, even though the
    sword is red or blue, and you''re a cartoon caricature of yourself standing on
    a platform high above a giant pool. Although you can flail about with the Wii
    Remote to some extent, if only for fun or show, the possible effective moves are
    fairly limited by the program. In the Showdown game, where you cut your way through
    an oncoming horde, players seem comically zombielike as they approach methodically
    and wait their turn to be hit. The simplifications and compromises necessary to
    allow for intuitive swordplay are evident: true one-to-one fidelity of motion
    must be constrained within the limits of the game''s cartoon world in order for
    the whole experience to be rendered entertainingly. Sometimes, as with the walking-zombie
    opponents in Showdown, the constraints tend to weigh down the gameplay, at other
    times the match is better, and it feels like realistic-enough weapon wielding.


    In order to achieve some degree of fidelity in motion mapping, graphic realism
    in general was set aside on Nintendo''s games for the Wii, or it was at least
    relegated to a much lower priority than it usually is on other game consoles.
    (Wii games by third-party developers, however, such as Electronic Arts'' Tiger
    Woods PGA Tour, have often continued to attempt graphic realism on the Wii comparable
    to what''s available on other platforms.) The most obvious example of Nintendo''s
    strategy to make realism a secondary concern (at best) in order to concentrate
    on other features is the appearance of the Mii avatars. Their graphic design is
    simple in a self-conscious, cartoon way that calls attention to their simplicity.
    Like the various Lego video games, or the characters in Pixar''s early animated
    films, from metal Luxo lamps to tin toys and the stars of the Toy Story movies,
    these sports games make an artistic virtue of necessity by limiting their environments
    and Mii avatars (which serve as both player characters and NPCs) to highly stylized
    caricatures, with their bodies glossy obelisks, all artificial-material surfaces
    and textures (see figure 2.2). This eliminates the need to animate complex texture-mapped
    hair, for instance, or flexing musculature, and avoids the need to have the avatars
    move in realistic, convincing ways. The advantage, besides savings when it comes
    to graphic processing, is that the Mii stay safely on this side of the "uncanny
    valley"—a metaphoric term for the anxious, disturbed reaction people have to almost
    lifelike simulated characters. They don''t even attempt the kind of realism that
    can stand out so badly when it fails. When in play, the Miis sometimes don''t
    have arms, say, but simply have tennis racquets, baseball bats, or swords protruding
    from the place near their polished-surface torsos where arms would be.'
