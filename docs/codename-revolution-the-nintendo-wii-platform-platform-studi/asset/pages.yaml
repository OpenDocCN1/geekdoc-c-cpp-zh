  md: 'Some of the new games contain obvious demonstrations of the capabilities of
    the MotionPlus gyrosensor. You twist the Wii Remote like a hand throttle to get
    a burst of speed and surge forward on your Jet Ski in power cruising, and your
    surging personal watercraft interacts with the physics of wakes that you happen
    to be crossing, for example, or targets at which you’re aimed. And as we mentioned
    in chapter 2, the Speed Slice activity in the swordplay game calls on you to model
    the direction and rotational angle of your stroke as you race to cut through a
    series of comically gigantic objects, such as a watermelon, sushi, pencil, egg,
    candle, and cake. When playing golf, the Wii Remote must be held level during
    the swing to avoid a slice. A swing meter to the left of your Mii shows the strength
    of your swing, but also bends and twists to one side or the other if you are twisting
    the remote and not swinging straight. In a pop-up window, an animated blue silhouette
    of the topknotted woman from the printed manual demonstrates the proper form.


    Games for the Wii, and Nintendo’s own titles in particular, necessarily include
    more instructional and practice materials than is usual for most other platforms,
    at least before the advent of Move and Kinect. Prompts about how to hold the controllers,
    or telling you to plug in the Nunchuk or place the Wii Remote on a flat surface
    for syncing, accompanied by sometimes-animated diagrams, are a common part of
    the experience of playing games on the platform. In *Wii Sports Resort* alone,
    some games require only the Wii Remote with MotionPlus (Golf, Bowling, Canoeing,
    Skydiving, Swordplay, Frisbee, Table Tennis, and so on) and others require the
    two-handed Wii Remote and Nunchuk combination, held either as handlebars (in Powercruising,
    Biking), or when using the Wii Remote as a bow and the Nunchuk with its Z trigger
    in the arrow hand (in, for example, Archery). Mostly, these prompts, diagrams,
    and videos are well designed and well integrated into the games, but their ubiquity
    is a reminder that you are using a new and probably unfamiliar control system.


    This presumably even more the case for players in the casual demographic that
    the Wii targets. By definition, such players are statistically less likely to
    have played video games before, so familiarity with even the use of the conventional
    directional or D pad, for example, cannot be assumed. In addition, relatively
    more casual gamers are by definition less likely to have time to devote to learning
    any system of controls, whether it involves button combinations or the meaning
    of particular symbols in a heads-up display. Players must be able to pick up and
    play for relatively short sessions with little or no preparation.


    One kind of response by software developers to this situation has been to make
    the gameplay interface so intuitive (pointing or shaking with the'
