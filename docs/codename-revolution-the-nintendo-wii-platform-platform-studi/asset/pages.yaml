- pgno: 172
  md: 'work, *Disney Epic Mickey*, was in the end developed for the Wii as a platform
    because:


    +   - The technology of the mimetic interface, the Wii Remote, afforded the intuitive
    gestures of painting and erasing that matched the core game mechanic.

    +   - The general style of art associated with the platform—in part for reasons
    of the affordances and constraints of its processors and other technology—is compatible
    with the game’s own “color and cartooniness.”

    +   - The other games and franchises associated with and playable on the platform
    are compatible in terms of the diegetic elements of character, story, and genre
    (Mario and Link belong together with Mickey Mouse).

    +   - The perceived audience for the platform, both its installed base and potential
    demographic reach, seems “right” for the new game: “Nintendo, like Disney, is
    all about reaching a broad audience of gamers, nongamers, kids, adults.”


    Undoubtedly, platform studies must attend to direct connections between hardware,
    software, and creative work. But we believe, as we have tried to illustrate throughout
    this book, that even the most obviously material of these connections are ultimately
    matters of social, cultural, and economic factors. Some of these factors affect
    platform via marketing, or socially, by way of the reaction of players and fans.
    Attending to these factors is part of the job of platform studies, just as book
    history or the history of material texts must attend to matters of readership
    or audience and genre, ideas of the “literary,” or the social class of readers
    when it comes to certain kinds of poems, plays, or novels. Ultimately, this is
    the premise behind our claim throughout this book that platform is a social phenomenon.


    It might seem as if attention to these social factors would risk dematerializing
    the idea of platform, dissolving it in the stew of cultural theory the way that
    an object is dissolved by paint thinner in *Disney Epic Mickey*. On the contrary,
    we think it’s a necessary way to acknowledge that platform spans multiple materialities—from
    microchips to social institutions. They’re all material, and they all matter.
    As a platform, a video game console is a computing-based foundation for running
    games, but it’s also an example of industrial design, a consumer product, a generator
    of expectations as well as a media system that mediates between the various'
