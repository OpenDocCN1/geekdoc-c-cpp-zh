  md: 'Miis gather around a central coffee or tea table with a remote controller on
    it (along with a tea tray) and a television in the corner dominating the idealized
    family living room (*ocha no ma*). The traditional television set is a conceptual
    focal point for that virtual living room.


    The television metaphor also inspired the Wii Remote, as we’ve seen, and we find
    it represented again in the nostalgically shaped, cathode-ray screen icons of
    Channels. Just as Nintendo wanted users to leave the Wii Remote out on the coffee
    table in the living room, and wanted the console to be attractive, small, and
    power-efficient enough for “mom” to want to have it sitting out in that living
    room, so the organizing metaphor of channels harks back to a still-powerful cliché—the
    family watching broadcast television on a central hearthlike set—rather than finding
    and viewing modular media objects on mobile devices, personal laptops, or tablet
    devices, which is after all the increasingly more likely scenario today.


    Even the word channel invokes the idea of a more unified time when stations provided
    programming over licensed portions of the radio spectrum. Sociologists have described
    the importance of the idea of “home electrification” in postwar Japan in particular,
    when modernity was associated with ownership of symbolic household appliances,
    but especially the television set. In the United States during the same era, the
    head of NBC in 1954 described the television as he wished it to be: “the shining
    center of the home.”³ The Wii’s television symbolism was less that kind of ideological
    resonance, perhaps especially for the older consumers that Nintendo has targeted
    as buyers of the system, suggesting that this new kind of video game console can
    re-center the family’s entertainment.


    In reality, however, although the Wii’s Channels may have a uniform look, they
    represent a set of different kinds of pathways for data, mostly depending on the
    Internet, after all, whether via WiFi or a hardwired Ethernet connection, some
    streaming and some downloaded to memory, some arriving quietly during standby
    time via WiiConnect24, and some being channeled to the user by way of games inserted
    into the optical-drive slot and accessed via the Disc Channel—and some of those
    bringing with them encoded system updates as well as the games themselves. Nintendo’s
    DS also can be linked to the Wii wirelessly for downloading and uploading content,
    including some user-generated content.


    The word channels implies order and downward flow. It is thus a deliberately archaic
    term for what is actually a fairly diverse set of pathways to the user—and to
    some degree from the user, since some Channels afford upstream or shared data,
    whether game states shared in online play, Miis that are set to mingle with other
    users’ Miis, accessing the Web using the Opera browser on the Internet Channel,
    or purchasing software via the'
