  md: 'but revolutionary. These are tested technologies with many existing appli-

    cations. What makes the Wii innovative is its combination of available

    technologies in particular contexts and design decisions such as separat-

    ing the two hands of even two-handed gameplay with two cable-connected

    components. Its design combines mostly commodity components in new

    combinations, given its particular uses in the specific market of video

    game consoles. In contrast with the other systems in its generation, the

    Wii offered a system comparable in computational power merely to a late-

    generation Pentium processor, packaged in the smallest “die” possible.

    Yet the Wii can still be considered innovative. In 2006 it offered the small-

    est form factor of any gaming console, aimed at a casual audience that was

    only then beginning to emerge, using Nintendo’s signature style of abstract

    or manga-based games. It did this while reducing power use, mostly for

    economic and marketing reasons (what “mom” would buy), but in a way

    that ended up responding, even if by accident, to some environmental and

    sustainability concerns in the general arena of computing systems.


    Moreover, even though it’s tethered to the television set, the Wii can

    fit into a trend of the convergence of mobile technologies (a connection

    that’s even stronger in the case of the Wii U, with its wireless, tablet-like

    touchscreen controller). The Wii Remote uses the same technology found

    in various mobile devices, including smartphones and tablets. As we have

    seen, Nintendo recently suggested that Apple was its new chief competi-

    tor, and the emphasis on the 3DS is part of exploiting the long-term

    success of the DS (and before that, the Game Boy). The 3DS can be thought

    of as in the general orbit of the Wii. Power-sipping processors are part of

    its success, too, and they connect it to mobile computing and trends in

    pervasive computing, and will likely play an increasing role in gaming and

    game platforms, while also contributing to a modestly hopeful trend

    toward at least relatively greener computing (a field of technology that in

    general is anything but ecologically friendly).


    We are not referring here to the popular media’s idea of convergence:

    the notion that every application will merge into one set-top box, for

    example. As Lee Schell said in his Design, Innovate, Communicate,

    Entertain talk in 2010, this kind of technological convergence is “total

    bullshit. . . . Technologies diverge . . . like species in the Galapagos Islands.”²⁰

    Yet like the evolutionary process that Schell invokes, the convergence and

    divergence of specific technologies within devices—rather than of devices

    into each other—take place over time, all the time, more like shifting phases

    in an uneven process of development, innovation, and retrenchment.


    On the other hand, when it comes to the old idea of device conver-

    gence, we do see forces that are driving the industry as it attempts to'
