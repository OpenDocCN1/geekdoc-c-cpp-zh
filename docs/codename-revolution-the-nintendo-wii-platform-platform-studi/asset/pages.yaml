  md: '# The Living Room as Player Space (Wii no Ma)


    Since May 2009, Nintendo has offered something called the Wii no Ma Channel to
    Wii owners in Japan, which the company says “will let you use your Wii to take
    back the living room.”³⁸ It’s actually an advertising-supported streaming video-on-demand
    and television channel for the Wii, or something like Netflix or AppleTV and iTunes,
    but with a more eclectic mix that includes exclusive content for Nintendo as well
    as a special advertisers’ room where Mii-embodied corporate representatives present
    ads along with special content—since the channel was developed in collaboration
    with the Dentsu advertising agency. We think, however, that the interface for
    the Wii no Ma Channel is rich with symbolism about the system as a whole.


    A 3D Mii-based model of a family living room, perhaps in a Tokyo high-rise, the
    channel is meant to represent an idealized view of the family’s relationship to
    the Wii as an entertainment hub. Miis interact in the virtual living room, and
    through them you can access the channel’s family-oriented entertainment, movies,
    instructional videos, quizzes, children’s programming, and anime. Content can
    be transferred to the DSi for mobile viewing. There is a calendar and message
    board, and viewers rate the videos after watching them (thus providing user data
    for the advertisers). In fact, the houseplant in the corner turns out to be a
    link to the separate room in which marketing Miis tout their corporate products,
    politely sitting down at a table with your own Mii and introducing video commercials
    for you to watch. It’s your choice whether or not you visit the room, and hence
    whether or not you look at the ads, but it’s hard not to notice the metaphoric
    significance of Nintendo’s having brought into the space of the virtual living
    room a doorway to this kind of targeted direct marketing.


    The living room is sparsely furnished in the Japanese style, and the centerpiece
    is a round, modern, blond-wood, Eames-style coffee table (or in this case, tea
    table). An abstract version of the table appears as an icon in the channel’s logo—where
    each letter i in the word Wii is at first sitting on either side of the table
    like little glyphs of Miis—and as the “home” icon on various menus. Posters are
    hung on the walls advertising software titles such as Wii Fit, and there’s also
    a little flat-screen television in the corner of the room on an elegant stand
    with, unsurprisingly, a slim white box standing vertically beside it. Of course
    the Wii no Ma virtual living room contains a tiny virtual Wii console. Videos
    on the Japanese Web site create a kind of infinite regress as you see a real-life
    family in their living room using the Wii to watch the Wii no Ma Channel on'
