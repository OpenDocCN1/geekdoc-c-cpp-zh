- pgno: 62
  md: 'reemergence of Moore’s law at the low-to-middle end of the computing spectrum,
    where the same processors that used to be large, hot, and therefore power hungry,
    can be built smaller, cooler, and more energy efficient, and then ramped up accordingly.


    One way to understand the Wii’s power is as an instance of this reemergence of
    Moore’s law, through a system that operates within a set of design constraints
    on power needs as well as use. Purely in terms of MHz, the frequency of the latest
    CPU in the Wii is double that of the GameCube. In practice, this translates into
    two times or more improvement in performance over the previous-generation Nintendo
    machine. Meanwhile, at the other end of the spectrum, Moore’s law is reaching
    its limit for the powerful processors in the Xbox and PS3, with the only way for
    continued increase being the addition of even more cores—and by consuming a lot
    more power in the process.²⁹ The Wii, by contrast, could continue to ramp up the
    clock speed and experience beneficial results. The PowerPC chip in its architecture
    can be increased to 3.2 GHz; all the designers have to do is expend more energy.
    Certainly for the present, that’s precisely what the Wii developers seem to have
    decided not to do.


    The Wii is the only major game console in its generation that exploits this paradoxical
    reemergence of Moore’s law at the lower end of computing—the only one that could
    continue to increase its speed significantly in the current form factor (or an
    even smaller one). This is a direct result of design and engineering decisions
