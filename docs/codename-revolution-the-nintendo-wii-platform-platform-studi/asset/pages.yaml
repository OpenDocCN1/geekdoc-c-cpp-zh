    # The Wii as a Social Platform


    Trip Hawkins, the founder of Electronic Arts and an early video game industry
    pioneer, has seen the Wii as the initial wake-up call to the video game business,
    an early warning sign in 2006 of the huge wave of online social games—exemplified
    by the popularity of *Mafia Wars* and *FarmVille* on Facebook—that was just about
    to sweep across the culture.²⁹ Though *FarmVille* uses Facebook for its platform
    of asynchronous click-based play, and the Wii encourages interactions in the shared
    space of the living room, both kinds of casual gaming work by tracking what the
    player does in different kinds of social spaces, and creating a feedback loop
    between those player actions and the digital games. The larger climate change
    to which Hawkins refers is a shift toward making gameplay more and more about
    that kind of loop, about forging links between game space and social space. Such
    links have always been part of video gameplay, across platforms. But the Wii places
    those links, those feedback loops with social space, at the center of attention
    for developers, publishers, other console makers, and players.'
