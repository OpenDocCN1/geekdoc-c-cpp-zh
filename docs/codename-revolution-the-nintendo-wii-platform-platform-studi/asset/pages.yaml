- pgno: 143
  md: 'What the console offers are nonessential features, from a strictly computing
    point of view (but absolutely crucial from a social point of view): its special
    interface and control system, the tethered content of exclusive games, and the
    radiating sense of a cultural brand or creative hub provided by two social forces
    in (sometimes-tense) cooperation, the producers and the users. On the one side,
    there''s a producing and publishing company like Nintendo, with its institutions,
    talent, and economic motives. On the other side, there are the users and their
    social networks, fandoms, attachments, and desires. Together these two forces
    give meaning to a platform. Meaning is never something constructed by the producing
    company alone. This is perhaps most obvious when certain users take over a platform
    and reshape it against the grain of how it was designed, by hacking the hardware
    or software, or both, for their own purposes. But in a less obvious or tangible
    way, it''s also true for almost any video game played on any platform, because
    the whole idea of gameplay is to push back against the system (including the software
    running on it) to try to find loopholes, exploits, and clever ways to overcome
    obstacles and beat the game. A social platform is always defined in the space
    between the system and its users.


    # Some Wii Mods and Hacks


    It will come as no surprise to anyone familiar with computing and gaming culture
    that there have been a wide array of creative hacks and mods performed on the
    Wii. These can be divided into two categories: the creative repurposing of the
    system itself or its components; and mods of the system in order to circumvent
    or break security measures, or DRM software or hardware controls. In the first
    category, there are actually two kinds of repurposing: game related, and nongame
    related.


    The gadget-based Wii seems to invite nongame-related hacks that employ its motion-sensitive
    controllers as controllers for other devices and other systems. For example, one
    enterprising team at an Australian mining equipment company coded a control system
    in Python to allow them to use the Wii Remote to operate two fifteen-ton steel
    robot arms with grappling claws. Technically this hack is amusing because it takes
    the controller outside the game universe, into the world of heavy equipment, but
