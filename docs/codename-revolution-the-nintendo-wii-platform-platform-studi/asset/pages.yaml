  md: 'played with “real friends—the friends that you have already established as
    a part of your social network.” This is part of a larger trend in which games
    are leaking out into the real world and inserting themselves into people’s everyday
    experience. In the talk, Schell extrapolates this into a pretty dystopian vision
    of the future that’s only just beginning, where pervasive computing and pervasive
    marketing blend with games in ways that sound frankly Orwellian (or Huxleian).^43


    In a later interview he labeled this the “gamepocalypse,” and it was much discussed
    online under the label of “gamification.” But this is to some degree because the
    marketers are starting to exploit those features of gaming and distributed systems
    that have been emerging for a decade or more, and that grew out of video game
    culture: live-action role-playing, costume role-playing, alternate reality games,
    locative art, augmented reality and geocaching, and Foursquare and Gowalla. Fictive
    worlds from game-based models have been overlaid onto the physical and social
    worlds in all sorts of playful, serious, and sometimes ominous ways. Much of this
    emerges out of game culture, because games have always been about drawing magic
    circles—then playing at the edge of them, more like throwing marbles than putting
    on a play. Schell acknowledges that “the idea of the single-player video game
    is a weird anomaly.”


    > > If you look at the history of games going back thousands of years, those games
    are multiplayer 99 percent of the time. You might have Solitaire, but most of
    the time games are about connecting with other people. Computer technology of
    20 or 30 years ago didn’t really permit that, so there was no choice but to have
    single-player games. I think the single-player thing is a bit of a blip on the
    history of games.^44


    The history of video games, even including single-player video games, is more
    social than the clichés would allow.


    Understanding the social nature of games and game platforms requires that we understand
    the permeable boundary between what’s inside and what’s outside the game. Like
    other critics, Alexander R. Galloway has applied the notions of diegetic versus
    nondiegetic elements to video games. These terms come from film theory and narrative
    theory, where diegetic space is the space of narrative or story (from the Greek
    word diegesis, “to narrate”), and nondiegetic space includes the formal devices
    that are part of a film, say, but not directly part of its story—such as the musical
    score, or the titles and credits. Fair enough. But Galloway also usefully makes
    room in his theory for “gamic elements that are inside the total gamic apparatus
    yet outside the portion of the apparatus that constitutes a'
