  md: 'Outdoor-themed activities take place on *Wii U* Island, the same location as
    in *Wii Sports Resort*. A map in the manual shows the topography and landmarks
    you see during gameplay. (When the first title, *Wii Fit*, was released, the setting
    still had the unfortunate name of Wii Island.) When jogging, the semitranslucent
    first-person Mii follows a Mii guide, or as you learn, you can follow a dog who
    runs past you in order to go to other trails on different parts of the island.
    Six classic Nintendo icons from Mario games appear in various locations around
    the island as Easter eggs to be discovered. You can also cycle around the island,
    using a two-handed control, locating and riding through flags in a winding course.
    A certain degree of freedom—you can run off trails and through the grass—cannot
    help but recall by contrast the different experiences of bike exploration in open-world
    games like, for instance, *Grand Theft Auto: San Andreas*.


    One of the new features in *Wii Fit Plus* allows for the creation of customized
    workout routines. A locker-room interface offers a shortcut to favorite activities
    accessible from the Calendar menu. Once you’ve created your profile using your
    Mii, you start the game in Wii Fit Plaza, a bright, pale, abstract space with
    grid markers on the ground receding to the horizon, and graphs, charts, and icons
    hanging overhead—graphic reminders of the conceptual heart of this suite of games
    and gamelike activities: measuring and plotting fitness data. At the welcome screen
    you’re greeted by an animated Balance Board character, which makes remarks based
    on your recent workout history, time of day, and so on. The rubbery little Balance
    Board is a fully imagined character that behaves like a Disney cartoon, waving
    with one of its corners as if it were a hand, bowing formally, jumping around,
    and running on a treadmill in the background.


    During its early development, the Balance Board even had a tail based on the cable
    that connected it to the Wii Remote, but when the Balance Board was redesigned
    to be wireless, it lost this feature, even though Nintendo animators complained
    that it made it harder for the board to express emotion.³ It’s a cross between
    an artificial intelligence personal trainer and the kind of traditional helper
    characters—often small fairies or sprites like Navi in *Zelda*—that accompany
    your own character, offering hints, directions, or encouragement. In that context,
    it’s interesting to note that this helper character is a cartoon personification
    of the actual controller you’re physically standing on, or a way of integrating
    the physical Balance Board peripheral into the game and rendering it friendlier
    for the player, though it may inadvertently suggest, partly in contradiction to
    this user friendliness, that the controller is in control of the gaming experience.'
