    device, Kinect (formerly code-named Project Natal) at a theatrical kick-off event,
    the Project Natal Experience. The voice-over was over the top: “History is about
    to be rewritten. . . . Human beings will be at the center, and the machine will
    be the one that adapts. Might the next step be an absence of an object? Is the
    future of humanity . . . humanity itself?”¹ High above the giant room, suspended
    from the ceiling, actors played a family sitting on a living room couch, watching
    the event as if it were on their television. One block actor climbed a rocky slope
    to stand on a huge Xbox logo ball and interact with a giant screen, where a cartoon
    avatar imitated their gestures. Then the screen slid open to reveal a living room
    with a family waiting on the couch. The whole set rotated until it was upside
    down. Brief demos of games followed on the screen, as players’ avatars responded
    to their movements. They played through a list of noticeably Wii-like games: sports,
    racing, adventure sports, and a hip-hop dance game by Harmonix (the answer to
    *Just Dance*), a brief preview of a LucasArts *Star Wars* game involving light-saber
    battles.


    The Kinect was released in November 2010, sold separately for Xbox 360 or bundled
    with a new smaller, more elegant Xbox Slim. The symbolism of the E3 event was
    clearly based on Nintendo’s own previous four years of marketing for the Wii—an
