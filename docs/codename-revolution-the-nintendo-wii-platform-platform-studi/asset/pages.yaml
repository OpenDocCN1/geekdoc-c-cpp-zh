  md: 'should that device finally emerge, the player’s pulse and the galvanic charge
    of their body could be added to the mix. A picture starts to emerge here of the
    Wii in action as a kind of local network of things—to borrow a term from ubiquitous
    computing or augmented reality—where the things or objects in question are prosthetic
    devices attached to the player’s body, as well as the player’s body itself.


    As we’ll develop further in chapter 7, this is fundamentally different from the
    way that Microsoft’s Kinect aims to achieve its otherwise-similar mimetic-interface
    engineering. Kinect seeks to erase any sense of things or objects cluttering the
    space between player and game, so that the player can get lost—immersed—in the
    game space. All motion-sensitive platforms work by redefining physical game space
    as the center of activity. But the Wii, first and still most of all, uses its
    modular components, its peripherals, to openly take discrete measurements of the
    player’s body and bodily reactions in a dimensional play space, and makes this
    process an open part of the platform’s experience. The grid of play space, extending
    outward into the real world where the player stands, is “required” for the Wii’s
    network of things to function in the way they were designed. And part of the design
    is the space they need, imagined simply and named the living room, but this is
    a kind of localized, culturally specific code for “player space.”


    The Wii was the first game platform in recent years to openly acknowledge and
    foreground the importance of this space as part of the game experience, after
    an extended period in which systems competed to produce greater and greater realism
    in a virtual 3D game space—greater immersion—by way of ever-escalating power and
    graphics capabilities. All of this is aimed at taking your mind off the physical
    space of your living room and helping you disappear into the virtual world of
    the game. A device like the Balance Board is a material embodiment of the opposite
    tendency in the new generation of consoles (or at least console additions, in
    the cases of Sony and Microsoft).


    Game designers often think in terms of creating possibility spaces, arrays, or
    grids, based ultimately on a mathematical, algorithmic visualization of actual
    possible moves and states within a given game. Such a grid of possibilities is
    the practical engineer’s alternative to the much-cited notion of the “magic circle”
    within which games are played—a concept borrowed from Johann Huizinga’s anthropological
    work in 1938 on the role of play in human culture, *Homo Ludens.*³ On the one
    hand, the magic circle simply means that players agree to abide by the rules;
    on the other hand, it also suggests that they draw a circle around the game for
    its duration, creating a kind of alternate reality, a space apart.'
