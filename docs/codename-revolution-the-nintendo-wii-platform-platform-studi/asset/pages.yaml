- pgno: 41
  md: 'Besides the Mini Cooper, the Wii console might remind some users of other aesthetically
    simple consumer objects, especially Apple''s original iPod or, for that matter,
    Nintendo''s own popular handheld portable DS system. Compact size is one thing
    that all these objects have in common. The prototype Wii, literally a black box
    with no controllers and still known as the Revolution, was first presented at
    the E3 conference in 2005, where Nintendo''s president, Satoru Iwata, held it
    aloft in one hand to emphasize that it was "by far the smallest console" that
    Nintendo had ever built, at about the size of a stack of three DVD cases.^4 (He
    would later say that he actually picked up three plastic DVD cases and showed
    the stack to Nintendo engineers as a design challenge.) Taking the cue, one live
    blogger compared the new box to Apple''s Mac Mini. A kind of parallel evolution
    has taken place with Apple and Nintendo systems in recent years. The GameCube
    was in development during 2000–2001, at the same time that Apple was developing
    its own distinctive Mac G4 Cube. Besides the shared shape, both systems aimed
    at similar low-profile designs, suggesting that they were taking part in larger
    trends in computing during this period. And then the next-generation console from
    Nintendo, the Wii, was nearing the end of its development in 2005, just as the
    Mac Mini appeared—another minimal form-factor, service-oriented, "right-sized"
    device. As many have noticed, the iPod can be seen as an even more apt parallel
    to the Wii in terms of marketing as well as computing design.


    The Wii is smaller than competing consoles in the same generation—roughly 6 by
    8.5 by 1.7 inches as opposed to roughly 10 by 12 by 3 inches for the Xbox and
    PS3—and lighter—2.7 pounds as opposed to 10 or 11 pounds for the other two. Even
    after both competitors came out with “slim” models in 2010, they remained significantly
    larger than the Wii. Nintendo''s developers strategically sacrificed power, storage,
    and other features inside the box to keep it small and cool running, and achieve
    the semiotic effect of simplicity for the sake of marketing, not to mention to
    keep the price below $250. Originally, Nintendo hoped to set the price at about
    $180; by 2010, the price had been reduced to around $200 for an enhanced bundle.
    Aesthetic and technical simplicity, smallness, efficiency, and relatively lower
    cost were all entangled in the original design in ways that make them hard to
    separate for analysis. In fact, these features and limitations are all connected.
    So that it would not overheat, the small console had to draw less electricity,
    but this of course was a consumer advantage in terms of the cost of operation—and
    success at using less power and running cooler meant that the console could claim
    to be quiet as well as visually simple and unobtrusive.^5'
