- pgno: 176
  md: 'respond to that overall divergence and the rise of casual gaming—forces in
    the somewhat-unexpected recent dominance of the living room metaphor, especially
    evident in the Wii''s marketing (and most literally in the Wii no Ma Channel),
    and now in its competitors'' attempts to enter the casual gaming market. The attempt
    to return to the centrality of the television as the hub of all household entertainment,
    probably doomed in the long term, nevertheless says something important about
    the console companies'' (and some consumers'') desire for this kind of convergence
    and perhaps stability in home entertainment, and that desire alone has consequences
    for the further development of creative software and the forms of user experiences
    afforded by future platforms.


    New and not-so-new technologies are always opportunistically combined in game
    platforms, the development of which then feeds back into the next phase of development.
    Until recently, this led to a new generation of consoles about every five years.
    Assuming they remain viable platforms for a while, dedicated game consoles are
    likely to continue to overlap with PCs for some time, and they are almost certain
    to increasingly have to compete with mobile devices, phones, and tablets as well
    as dedicated handheld platforms in an environment of always-on pervasive computing.
    To remain economically viable, any new gaming system would be well advised to
    avoid inventing anything too "revolutionary." This is just the logic of the market.
    Instead it should focus strategically on technologies with the highest (social)
    impact. Under this definition, the Wii is indeed a leading-edge product—one that
    has helped redefine the console market and the social platform of gaming for its
    generation.


    # The Absence of an Object?


    Although it began by imitating the Wii''s approach to the gaming market, in the
    end Microsoft''s Kinect went in a different direction from the Wii, attempting
    to define itself as an even more extreme revolution in console design. In contrast
    to Nintendo''s Wii design, as we''ve been describing it throughout this book,
    Kinect aims to use its gestural interface to produce an experience of total immersion.
    "With Kinect," as the slogan goes, "there are no gadgets, no gizmos, just you."[^1]
    What might it mean, in terms of platform, to develop a system without gadgets?
    What might be gained, and what might be lost?


    At E3 2010, the theatrical circus performance we described at the beginning of
    this chapter played with the line between the living room and game space, with
    various "screens" serving as mere "windows" (surely an intended allusion by Microsoft)
