    # ## Channeling the System


    From the small screens on the Wii Menu, Channel Preview screens are one level
    down. Once there, you can select a Channel or scroll through all Preview screens.
    The Wii Menu and Channels interface was designed to further Nintendo''s blue-ocean
    strategy and make the console something various family members, including nongamers,
    would want to access every day. So the Forecast Channel, for example, was created
    early in the process as a kind of utility widget that might be accessed every
    morning—a demonstration that the system was always on and being updated overnight
    with fresh weather data. A zoomable globe, like Google Earth but provided in this
    case by the National Aeronautics and Space Administration, can be grabbed and
    spun using the Wii Remote to show locations around the world that you can zoom
    in on for weather forecasts for specific cities. Each Channel''s screen icon on
    the Wii Menu has its own dynamically updated sound effect and animated image,
    offering a top-level glimpse of the content without having to open the Channel.


    The Disc Channel is basically the interface for the optical drive. Fixed in place
    at the top-left corner of the Wii Menu, it is the only one you can''t grab and
    drag to reposition—a sign that games loaded from optical discs still have a certain
    assumed priority in the Wii''s conceptual architecture. On the other hand (and
    this is an important point, conceptually), the Disc Channel icon is exactly the
    same size and appearance as the other Channels, suggesting that playing games
    is the first among equal options, finally only one of the many uses of the console,
    which was expressly designed to appeal to nongamers as well as gamers. Accessing
    *Super Mario Galaxy* via a DVD-ROM inserted into the Disc Channel looks and feels
    exactly like accessing the Wii Channel, say, or the News or Forecast Channels.
    It becomes just one more little screen in the array of possibilities.


