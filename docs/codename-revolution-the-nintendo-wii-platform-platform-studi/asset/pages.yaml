  md: '# The MotionPlus Attachment


    Interestingly, the Wii ended up using gyroscopes as well, though of a different
    sort than those stacked by the R.O.B. Nintendo released an expansion component
    in 2009, or what it marketed as an “accessory” that “takes the motion-sensing
    controls of the Wii console to new levels of precision”—but that might also be
    seen as a kind of belated hardware patch for the Wii Remote—the MotionPlus accessory.
    It’s an extraordinary example of industrial design, just in terms of the commercial
    and technical risks that it represents. MotionPlus is an extension that plugs
    into the base of the original controller. It adds 1.25 inches to its length, plus
    additional weight—as well as some practical headaches when it came to the wrist
    strap and the connector port at the Wii Remote’s base—along with a new, longer
    elastic jacket for the controller. In exchange, it significantly adds to the Wii
    Remote’s ability to measure player movements, including a new set of rotational
    movements measured by the gyroscope.


    This additional MEMS device is a dual-axis rate gyroscope, the IDG-600, made by
    InvenSense. Although there was a cruder form of gyroscope used in Nintendo’s *WarioWare:
    Twisted!* for the portable Game Boy Advance platform, Nintendo has said that the
    MotionPlus gyrosensor developed from a modification on the kind of sensor used
    to stabilize handheld video cameras. The combination of the Wii Remote’s accelerometer
    with the MotionPlus gyrosensor allows the combined two-part controller to measure
    movements along six axes, not only along straight lines (up and down, left and
    right, and forward and back) but also twisting and rotational movements (pitch,
    roll, and yaw), thus moving the system much closer to a one-to-one ratio of player
    movements to in-game actions. According to Kuniaki Ito of Nintendo’s product development,
    the sensitivity of the Wii MotionPlus gyrosensor was increased from the approximately
    three hundred degrees of movement per second possible in video camera sensors
