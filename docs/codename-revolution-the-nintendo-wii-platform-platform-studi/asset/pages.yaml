  md: 'braking and fuel system maintenance (especially in the case of hybrid vehicles)—so
    that how they work is essentially mysterious to the owner.⁸


    The question of designing hardware and software platforms to be closed or open,
    or to be left sealed or tinkered with, is only part of the issue. Doctorow’s “screws
    not glue” language is in the end complicated by the multiple kinds of devices
    as well as interactions that people have or wish to have with their devices. It
    makes sense as an argument against a general trend in computing, and in favor
    of a hacker or maker ethos. It’s most compelling when you imagine a future in
    which the old-school open-platform PC is no longer available—in other words, in
    Zittrain’s unwelcome “future of the Internet.”⁹ But for now, a somewhat-different
    aspect of that future seems to be unfolding—one in which specially purposed, often
    smaller and more efficient, dedicated computing devices are proliferating, as
    we first suggested in chapter 2, in conjunction with a dispersal of the kinds
    of computing tasks that people expect these devices to enable. We believe that
    the design of the Wii as a platform can best be understood in the context of this
    new environment. What kind of openness is possible or desirable, on what level,
    in such an environment?


    First, a little background about what it means for a system to be open. The whole
    idea of free/open-source software (FOSS) is focused on the low-level source code
    of a product or system along with its availability for study, use, and repurposing.
    But there are different degrees of free and open. For example, in the case of
    the GNU general public license (GPL), the software and any derivative work must
    by definition always remain completely open under the GPL. That is, anyone who
    modifies it under the license agrees that it will remain available under the original
    terms. Open differs, though, over which applications or devices should actually
    be open source—on the question of how far down and out into the world the openness
    of code should extend. A recent topic of discussion in the FOSS community, for
    instance, has been whether firmware code that has open-source drivers to “talk
    to it” needs to be open source as well.


    In particular, the popular NVIDIA controller has its own proprietary firmware
    (and even proprietary drivers) that can be used to provide the “complete experience”
    even on open-source platforms like Ubuntu. There has been considerable FOSS community
    debate surrounding these kinds of hybrid platforms. In the end, users are afforded
    the option on systems like Ubuntu to install the proprietary drivers, but only
    after they have installed the OS on their computer. So if a user wants to run
    a high-resolution monitor by way of NVIDIA chips, say, they will have to install
    the proprietary drivers on top of the OS and—as the FOSS community views'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'it—live slightly outside the “virtuous” limits of FOSS-compliant software.
    The debates can become fairly theological.


    In everyday life, in the increasingly multiscaled environment of distributed computing
    with embedded dedicated processors everywhere, the pragmatic meaning of openness
    can be found not just in a particular instance of code but also in the bigger
    picture of networking protocols and services. Video game consoles—especially the
    Wii, with its deliberate shift to lower-powered and unobtrusive design—can be
    seen as fitting into this distributed environment and the accompanying trend toward
    more service-oriented design. In effect, setting up the Wii creates a PAN in the
    user’s living room. This PAN enables communication among various components in
    the system.


    Consider the Wii Remote for a moment. What exactly is exchanged across the boundaries
    of controller and sensor bar/television set, or controller and console? A good
    deal of data, as it turns out, and despite the closed nature of the game platform,
    much of these data remain open in some important ways. The Wii Remote transmits
    its accelerometer data (and data from other attached devices, such as the Nunchuk),
    and because this data feed is not encrypted, it can be accessed via other OSes
    besides the Wii—such as Linux and Windows. It’s just a matter of creating a Bluetooth
    pointing device profile (much like what’s created for a standard mouse) and adapting
    the software profile to handle additional data (multiple-axis acceleration).¹⁰


    So what really makes a system open—and perhaps even generative, to use Zittrain’s
    term—may be a matter of how it fits into the larger emerging distributed-systems
    environment. From a broader computer science perspective, the key question in
    most practical instances is whether the system can be integrated into a larger
    world that is increasingly networked, whether wired or wireless, point-to-point
    serial connection (USB, serial port, or parallel port), and so on. Consider just
    one example of a user hack, a simple demonstration that the Wii MotionPlus device,
    on its own, can be attached to a computer via a serial/parallel port, giving the
    user access to the data generated by the turning-fork gyroscope. Does this mean
    that the MotionPlus device is an open one? Technical or legal terms, it does not.
    The device is about as proprietary as it gets when it comes to commercial computing.
    And yet this hack pretty eloquently shows that given the device’s black-box nature,
    its boundaries for integration with wider systems are in practice open, and in
    this way the device is potentially generative in Zittrain’s terms. You can get
    the data out of it with a simple modification, so that’s a kind of openness, whatever
    its original design.'
