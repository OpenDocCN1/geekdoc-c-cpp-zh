- pgno: 22
  md: 'In most cases, however, the technology is far from a simple one-way determinant.
    A third-party action-adventure game like *Red Steel*, created for the launch of
    the Wii and to make use of the original Wii Remote, could fail in many respects
    (as it did)—in part because of the graphic and processing limitations of the system—but
    then be revived (or “rebooted”) in a sequel, *Red Steel 2*, after Nintendo released
    an add-on to the controller, MotionPlus, that incorporated a MEMS “tuning fork”
    gyroscope, which greatly enhanced the Wii Remote’s ability to measure and map
    player movements. The second game’s relative success was a direct consequence
    of changes in the hardware. It was a matter of the developers’ learning to work
    within the constraints of the platform and given a new set of affordances that
    make for realistic-feeling (as opposed to realistic-looking) swordplay. The expressive
    and creative cultural artifact, *Red Steel 2*, is a direct result of new computing
    technology in the first place. At the same time, games like *Red Steel 2* (and
    what was learned from the first *Red Steel*) were the reason for the creation
    of new computing technology. Any full understanding of that game—including even
    its diegetic story line, as limited as it is—must take into account the web of
    economic and technological factors that made the game possible as well as shaped
    its possibilities. From our point of view, no material technology stands apart
    from culture. And no cultural event transcends material or technologies. So our
    approach demands a kind of interweaving of the two.


    If “platforms are layered—from hardware through the operating system and into
    other software layers—and they relate to modular components, such as optional
    controllers and cards,” then the platform itself is a kind of layer in the “stack”
    that represents the structure of digital media objects in their social contexts.^12
    Jan Bogost and Nick Montfort, whose book on the Atari VCS, *Racing the Beam*,
    inaugurated the present series, provide a useful diagram that represents the five
    levels of possible attention to digital media or creative computing, with the
    platform as the foundation, and moving up through software and architectural layers
    (code, form/function, interface, and reception/operation) to include the creative
    work itself (such as a video game).^13 Culture can be understood as the highest-level
    layer or context surrounding the whole, or as something like the solution that
    inevitably pervades every layer in the media object, helping to shape it or be
    shaped by it in turn. We’d go even further to suggest that culture (or social
    context) pervades and shapes every sublayer of the platform layer, too, from the
    technology of transistors to the art of game design. This makes game consoles
    particularly interesting cases for platform studies to consider because they so
    obviously depend on the social and cultural layer if they are to have any meaning.
    Again, the Wii is'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'especially vivid example of this general dependency because it was designed
    to focus on what happens in the social space, shaped by culture, in which games
    are imagined and played.


    As we’ve said, every platform is a social platform to some degree—and not only
    digital platforms. Take books. The printing press along with the institutions
    of print culture can be seen as a kind of platform for producing and disseminating
    texts in the material form of codex books. After Johannes Gutenberg developed
    printing from movable type (in Europe), machines were deployed to impress paper
    with texts using pieces of metal type that were locked into wooden formes and
    inked. This allowed for a high degree of uniformity across multiple copies of
    the same work and the wide dissemination of texts in book form—a form with a two-page-opening
    interface (the codex) that was brilliantly suited to the various reading practices
    that emerged along with it.


    The higher-level connections between print technologies and something often called
    print culture, and between print culture and culture in general, are extremely
    complicated, and their precise nature has been the subject of serious debate among
    book historians.¹⁴ But that there are some such connections—that print technologies
    have cultural effects—is accepted by most historians. There are positive effects—the
    invention of steam-driven printing presses in the early nineteenth century opened
    up mass-market publishing—and negative effects—the Romantic poet William Blake
    and, later, Victorian Pre-Raphaelite poets returned to handcrafted books in part
    as a reaction to new printing technologies.


    Either way, printing platforms affect creative works, such as poems. Yet compared
    to a computing platform like a video game console, print looks more like a culturewide
    technological regime or medium. More precisely, the gift-book annual anthologies
    of the English Regency period, triple-decker (three-volume) novels of the Victorian
    era, do-it-yourself (DIY) cut-and-paste photocopying of zines in the 1980s and
    1990s—all specific configurations of text technologies that shaped the creation
    and reception of various forms of writing—were specific platforms within the larger
    medium or field of print. In this sense, video game consoles are specific platforms
    within the larger field of computing.


    In our own era, we’re seeing the rise of the electronic book in various competing
    platforms for producing and delivering texts. These now include not only PCs but
    also handheld mobile e-book platforms, whether Amazon’s Kindle, various applications
    for mobile phones, or Apple’s iBooks for the iPad. Where are the boundaries defining
    the iPad, for example, as a platform for publishing e-books? To begin with, there
    are the specific hardware and software technical specifications, including'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'everything from the multitouch interface and screen resolution to battery life
    and form factor—the shape and size of the tablet itself. In addition, there are
    layers of software, from the text files in the ePub format, to the code that allows
    for bookmarking, copying of selected text to the clipboard, searching, and dictionary
    lookup from within the selected text (but oddly, not annotation), to the interface
    design for the full-color display that animates page turning when touched and
    stacks cover images of the books in your collection in a graphic bookcase image.
    All these features are part of the iPad''s iBooks platform for e-books.


    But that''s not the end of it. The online software channel by which the e-books
    are published, distributed, purchased, and downloaded, the iBooks section of the
    iTunes Store, is also a crucial layer in the platform—in some ways the most important
    layer of all, because publishing and distribution, not just reading, is the purpose
    of this platform. Even before the iPad was first released, iBooks at iTunes was
    controversial, provoking public debate about Apple''s negotiated role as a bookselling
    "agent" mediating between publishers and readers. And that new model of electronic
    book publishing in turn had specific consequences for the price of e-books, not
    only by Apple on the iTunes Store, but also in response, by its competitor Amazon.
    The competition with Amazon''s Kindle app for the iPad and other devices may be
    the primary motivating factor in the construction of Apple''s own channels of
    distribution. One survey showed that as of fall 2010, while 75 percent of surveyed
    users read books on their iPads, about 7 percent of them preferred to read e-books
    on the iPad via the Kindle app instead of using Apple''s own iBooks app.^15


    The point is that the iPad iBooks platform is the sum total of its layered components—from
    the microchips to the multitouch interface, to the available software, to the
    publishing channel for that software (the actual e-books), and its reception by
    users. A video game platform like Nintendo''s Wii demands detailed attention to
    precisely this kind of multilayered structure. Games, too, are produced, distributed,
    received, and played via a multilayered system of components, from hardware to
    software to economic and social institutions. Platform studies has to remain aware
    of this complexity.


    In that spirit, chapter 5 focuses on the software design and structure of the
