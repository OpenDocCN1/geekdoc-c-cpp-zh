    and (once it was added) MEMS gyroscope to measure the player''s motions in multiple
    dimensions. We place the Wii Remote in the historical context of other somatic
    interface devices as well as metaphorically in the context of the HCI concept
    of the "magic crayon" and in the tradition of the mouse as a controller device.
    We suggest how the addition of the MotionPlus attachment as an upgrade for the
    controller encouraged certain software features not possible or less viable using
    the original Wii Remote alone, as exemplified in the change from a third-party
    action-adventure game exclusively for the Wii, Red Steel (for the launch of the
    Wii in 2006), to the "reboot" sequel, Red Steel 2 (in 2010), along with the proof-of-concept
    motion-sensitive gameplay of Nintendo''s own WarioWare: Smooth Moves, Wii Sports,
    and Wii Sports Resort.


    In chapter 4, we explore a different Nintendo software title meant to leverage
    the system''s new technology, Wii Fit Plus, which came bundled with another peripheral
    controller, the Wii Balance Board. The Wii Balance Board, which you stand on,
    uses stress gauges to measure the body''s weight and motion fairly precisely,
    so that you can use your whole body to control the game. But this device also
    has a history, as we show, and was introduced as part of the larger strategy by
    Nintendo to take over the family living room, as can be seen in the strange new
    channel for the Wii, so far available only in Japan, Wii no Ma (roughly, "Wii
    living room"). The Wii Balance Board, literally a "platform" you stand on, exemplifies
    the system''s shift from imaginary game space to physical player space. This emphasis
    has been the most notable effect of the Wii''s advent, and has altered the landscape
