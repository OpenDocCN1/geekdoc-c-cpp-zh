  md: 'screen you’re standing in the mapped 3D space of your living room. It then
    tracks your movements at thirty frames per second.<sup>15</sup>


    Given the rhetoric at the launch event, and given the stated need for a large,
    well-lit play space, it was surprising to us in our early experiences with the
    system that when playing most of the initial titles released for Kinect, you effectively
    have to remain in an imaginary box about six to eight feet from the screen. If
    an additional player wants to join in a game, they step into this box, and the
    sensor quickly sees them and adds an avatar. If you move too far to one side while
    playing, however, a warning prompts you to move back into the device’s field of
    vision.


    For example, in *Kinect Adventures!* you may see a rendering of an expansive game
    world—a large gym, a glass undersea observatory, a winding riverbed, or a series
    of tracks in a vast mountainous landscape—but most of it is not playable. Your
    actual gameplay, the part of that environment you can control with your gestures,
    is bounded in a much smaller box. Visual cues in the game for the space in which
    you actually move are provided by a conduit-pipe cage extending about as far as
    you can reach, the glass walls of a small underwater room, a raft on which you
    stand and walk from side to side to steer, or the rolling cart on which you traverse
    the tracks. These can be seen as a kind of virtual counterpart to the Wii’s physical
    Balance Board.


    As a result, at least in our initial experiences of gameplay, *Kinect Adventures!*
    games at least—which are obviously early applications of what the system might
    do in the future—can feel a bit claustrophobic, like a theme park ride in which
    you have to keep your hands inside the car or an on-rails game where the contextual
    animations move past you.


    Conceptually, Kinect is a much more technically sophisticated version of Sony’s
    earlier EyeToy camera peripheral. Taking into account its combination of sensors
    and camera, it’s clear, of course, that Kinect doesn’t really offer gadget-free
    gaming; it just takes the gadgets out of the player’s hands and moves them into
    the sensor bar, which sits like a vaguely anthropomorphic robot head near the
    television screen, where it can see the room and any players.


    Structurally, it works like something of an inverted Wii setup. Instead of having
    a CMOS camera sensor in your hand and the LED signals beamed to it from the area
    of the television, as the Wii does, Kinect puts the cameras in the area of the
    television and trains them on the player’s body. The lack of a light-emitting
    piece of hardware for calibration is one reason early reviews have noted that
    the lighting in the game space has to be just right for the Kinect. Too much sunlight,
    for instance, or even a player’s skin tone being too dark for easy reflection
    in low light can confuse the cameras.<sup>26</sup>'
