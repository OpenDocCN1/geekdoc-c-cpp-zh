  md: 'In *Super Paper Mario*, you can push the A button to flip from two to three
    dimensions. When you do, a portal, a cutout door, appears in the flat backdrop,
    rotates with your character, and the setting flips to a 3D view. So rows of blocks
    that were impossible in side-scrolling platform mode are now revealed as only
    a one-block deep, and you can find a way around them. What looked like a distant
    backdrop of mountains flips to reveal itself as a close-up narrow ramp that you
    can climb onto and use to cross behind a chasm. You can only stay in the third
    dimension for a limited time without losing your health, so you play mostly in
    2D, always knowing that things are not as they appear. Your characters, though,
    remain 2D cutouts, sometimes twirling to reveal their flatness, like playing-card
    images (an appropriate visual metaphor in a game from Nintendo, the company that
    got its start manufacturing cards). *Super Paper Mario* reveals a general self-consciousness
    about game history at Nintendo that has also been built into the Wii: the sense
    of controlling a deep canon, and of what that in turn affords—always-available
    multiple “dimensions,” or multiple perspectives on game design and gameplay.^23


    Nothing has attracted as much critical praise among software titles for the Wii
    as the two *Super Mario Galaxy* games (2007 and 2010), 3D platformers that take
    place mostly in space. Comically shaped cartoon planetary bodies, asteroids, and
    planets serve as the 3D “platforms” on which Mario runs and jumps. The games toy
    with radical shifts in perspective, using a planetary-level zoom, so that Mario
    appears to be running on spheres at one moment and, with a zoom in, across the
    larger plane of the planet’s surface. Zooming out makes the scale shift, like
    an artificial garden created bonsai-style in a container, so that houses and trees
    loom out of proportion and can be seen from space, along with a tiny Mario (and
    his enemies) running around the surface of the sphere. In the game a planet can
    seem room or world sized, depending on a quick shift in perspective, making the
    earlier *Super Paper Mario*’s flipping from 2D to 3D look like a conceptual run-through
    for *Galaxy*. Mario’s movements are liberated: from jumping over obstacles and
    gaps, he becomes free to run around in multiple directions and three dimensions.
    Though you move around using the Nunchuk analog thumbstick, both games, but especially
    the second, make use of the Wii Remote for pointing and clicking to control the
    camera, your motion, and various objects—coins, stars, rocket enemies with Mickey
    Mouse–style (or for that matter, Mario-style) arms with gloved hands.


    Both *Super Mario Galaxy* games have been extremely successful, in terms of sales
    and their critical receptions. Most critics have listed them'
