  md: 'cover, and—extending out to what Genette labels the “epitext”—the advertisements,
    posters, author interviews, and publisher’s marketing, all of which frame the
    text for the reader and shape its reception.


    The theory of the paratext is a way to describe the “wrappers” or layers of media
    and prompted social interactions by which texts are conveyed to the world as well
    as experienced. *Context* is what’s given in the culture, but *paratext* is the
    outer edge of the text that interfaces with the given context, forming a “threshold”
    to the text, or a transitional space between the text and the world that shapes
    the reception of the text along with how readers approach and judge it. A book
    appears, is published, in a particular time and place (which provides part of
    its context). But how it is published—including how it is embodied and presented,
    announced and marketed—determines the parts of the context that will actually
    come into play as readers encounter the book. Paratext is the threshold or border
    between the book and its aura—all the paraphernalia of publishing that surrounds
    it—and the wider culture that forms the context for the book’s reception and interpretation.


    According to this analogy, we can quickly identify some basic paratextual features
    of video games: the box art and included operation manual, say, or even the Entertainment
    Software Rating Board’s rating printed on the box—a giant E, T, or M—all features
    that bridge from the game to the player or critic, shaping expectations of everything
    from which players are likely to buy the game, to players’ reactions to the purchase,
    their responses (which might be captured on video) during the initial unpacking
    of the optical disc that conveys the creative work (by way of the software burned
    on it), to how the game is displayed on a retail store’s shelf (or how it appears
    as a thumbnail graphic online). Closer to the “inside” of the game, some paratexts
    are even built in to the game’s code—for example, in the boot and log-in screens,
    opening music, or even the layered animated logos that signify studio, developer,
    and publisher, as you make your way into the actual start screen.


    But the distinctions get a little more complicated as we imagine moving in the
    other direction, outward in concentric circles from the game itself to its outer
    paratextual “wrappers.” Some of these features are part of marketing, and some
    are part of the game’s cultural reception. And many are both. The “outer” paratext
    or epitext clearly consists of the online review sites, help pages, boards and
    forums, collectibles, and fan art Web sites. Yet what about third-party shells
    for controllers, a plastic inflatable go-kart, say, or what about machinima movies
    made using the game engine and assets, or user-generated levels, or game mods?
    How do these paratextual (textual) objects count in relation to the primary'
