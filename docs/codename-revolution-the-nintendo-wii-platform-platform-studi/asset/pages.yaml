  md: 'horizontally and using it as if it were an earlier controller, using two hands,
    controlling the D pad with one hand, and the one and two buttons with the other.
    Using the Wii Remote in this position makes it suddenly obvious to an observer
    that in its button layout and perhaps a more general spirit as well, this purportedly
    revolutionary rectangular plastic controller is a direct descendant of Nintendo''s
    first breakthrough home-console controller for the NES (Famicom).


    The Wii Remote is a motion-sensitive device. This means that it measures, at over
    two hundred signals per second and in three dimensions, the movements the player
    makes with it, using a combination of infrared and wireless Bluetooth channels
    to transmit the movement data, and then map the movements onto the game space.
    So if you swing the remote in a sweeping backhand gesture, your Mii avatar swings
    their tennis racquet the same way on the screen. The measurements are made by
    Analog Devices'' ADXL330 triple-axis accelerometer, a machine inside a tiny, square
    integrated circuit in the Wiimote. The accelerometer—a small piece of hardware
    much like those found, for example, in the iPhone and iPad—is a self-contained
    machine with moving parts known as a MEMS device. A column on Nintendo''s Web
    site usefully and simply defines MEMS as "micro fabrication techniques that use
    applied semi-conductor technology to produce extremely small mechanical structures."^58


    The Wii Remote''s accelerometer is only one of the myriad forms that MEMS can
    take, and there are a number of ways to make these microscale machines. In the
    case of the accelerometer, its extremely small moving parts work in concert with
    etched circuits in the system, translating analog physical motions into electronic
    signals and thus digital data. The Wii Remote MEMS consists of a sliver-size plate
    of polysilicon, a "proof mass" that''s mounted with springs to float suspended
    over a substrate. Air in its patterned channels acts as a cushion for the plate,
    allowing it to float just barely above the substrate and react to subtle changes
    in acceleration, both magnitude—how much movement—and direction. In relation to
    a second layer of polysilicon, the device measures acceleration on an X-Y-Z grid.
    Electric voltage shifts with the shifting relation of the parts, and minute changes
    in voltage, caused by the accelerometer''s movements as the Wii Remote is tilted,
    allow for measurements along three axes: up and down, side to side, and forward
    and back.


    The basic physics behind the accelerometer can be explained by Hooke''s law (formulated
    by British scientist Robert Hooke in 1660) on the relationship between force exerted
    on a mass and the position of that mass, which is seen, for instance, in the displacement
    of a mass attached to a spring with its acceleration along a particular dimension.
