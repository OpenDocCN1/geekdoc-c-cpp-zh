    # Power (Constants)


    Being a computing powerhouse would have been impossible for the Wii, given its
    quiet and efficient technologies as well as small, slim design. Nintendo set out
    from the beginning to head off unfavorable comparisons over raw power by taking
    another tack altogether. Miyamoto publicly described the Wii in terms of natural
    selection, insisting that “power isn’t everything for a console. Too many powerful
    consoles can’t coexist. It’s like having only ferocious dinosaurs. They might
    fight and hasten their own extinction.”⁶ The Wii has competed by being nimble
    and attractive, and for several years after its release it dominated a hitherto-undiscovered
    but extremely wide demographic niche in the console environment—a niche that the
    Wii has helped to create since its appearance in 2006—or the demographic segment
    of users that Juul has called the casual revolution.⁷ These are first-time gamers,
    older adult or female gamers, and consumers who might not even choose to identify
    themselves as gamers. About a year before the Wii appeared, Donald Norman pointed
    out the disconnect between the idea of the core gamer and the actual market for
    video games, which by then included roughly as many women as men:'
