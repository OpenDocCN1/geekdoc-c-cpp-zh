- pgno: 94
  md: 'was designed to resemble a set of bathroom scales. (In fact, one designer early
    in the process briefly imagined its being located in the bathroom, with the player
    carrying data into the console via a USB drive.)⁴


    Nintendo says that the Health Pack originated with Miyamoto’s idea—not the most
    obvious one, on the face of it—that weighing yourself daily could be “fun” (as
    opposed to being pathologically obsessive or tedious). During development, the
    bathroom-scales idea was expanded when the developers noted that sumo wrestlers
    have to use two scales because of their size, or one for each foot. A physical
    trainer consulted later in the process also used two scales to measure and improve
    their clients’ balance, since the combination of scales can measure which foot
    you’re putting more weight on. This led the developers to focus on center of balance,
    not merely weight, as something measurable by the console’s technology—data that
    could be correlated with health—and this led to the Balance Board’s final form
    as a kind of bifurcated digital scale with four sensors.


    Miyamoto insisted at every stage that they hold down the Balance Board’s cost.
    So the developers explored various existing, commodity-component solutions, including
    using actual off-the-shelf bathroom-scales technology. But even sophisticated
    electronic household scales only measure weight four or five times per second,
    and a good controller has to keep pace with the rate at which images are processed—sixty
    images per second. So early ideas for building rapid sensors into the device included


    ![](img/48d07ac8cc90ee4a759ac820bfcf3319_94_0.png)


    The Wii Balance Board extension controller'
