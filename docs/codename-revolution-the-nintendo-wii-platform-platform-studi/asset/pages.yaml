- pgno: 39
  md: 'of system components, and allows users a convenient, ergonomic, and attractive
    way to organize as well as consolidate a system’s controls. In this sense, like
    the old radio consoles, a video game console is also a piece of furniture designed
    to fit into a domestic space—nowadays usually as part of a media or entertainment
    hub—and look natural there, even aesthetically pleasing, while at the same time
    serving its functional purpose.


    The Kyoto-based multinational corporation Nintendo moved into the home market
    in 1975 when it became the Japanese distributor for the Magnavox Odyssey console.
    A decade later, when it named its own first home platform Family Computer (in
    Japan) and Nintendo Entertainment System (in North America and Europe), it was
    staking a claim in that new market territory—the domestic space. During the 1985
    rollout of the NES in New York, the company’s sales staff members were instructed
    to refer to the NES as an “entertainment system” rather than a “video game.” The
    system not only included a light-gun controller, the Zapper, but also the Robotic
    Operating Buddy (R.O.B.), a small robot with optical-sensor eyes that stacked
    blocks or moved gyroscopic tops to interact with the game on the television screen.


    The R.O.B. and the nomenclature of the NES have been treated by most historians
    as marketing moves by Nintendo—a way to gain retail exposure for its system (which
    looked as though a mechanical toy was its centerpiece) in the midst of the hostile
    economic climate following the video game market crash of 1983.⁸³ But they’re
    also useful reminders of the domestic space into which consoles had to fit at
    the time (and since) as well as signs of the modular—sometimes almost cobbled
    together—nature of home-console systems. The console itself contains the central
    processors and so on, but the overall platform includes the crucial television
    set as a component, along with a whole cabinet full of possible controllers, peripherals,
    props, control pads, guns, steering wheels, lightsabers, robots, microphones,
    guitars, and drums, connected by a tangle of cables or, increasingly, wirelessly.
    Inside the industrial design of its casing, the console itself is a complicated
    bundle of parts and components, circuit boards and integrated circuits, transistors,
    solder, and cables.


    # Form Factor and Technical Architecture


    The Wii console was designed in the face of this messy, complicated reality to
    seem simple and self-contained. Different-colored models have been demonstrated,
    and the first prototype shown publicly was black (the introduction in 2010 of
    a black Wii for the consumer market made headlines), but when it was released
    in 2006 the console came only in white,'
