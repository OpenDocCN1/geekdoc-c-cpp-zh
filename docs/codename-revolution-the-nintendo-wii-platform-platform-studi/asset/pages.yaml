  md: 'which you are convinced to treat as a possibility space mapped onto your movements
    as you stand in the physical space of your living room. Inside the game, each
    planetoid in *Super Mario Galaxy* is a miniature world with its own rules (such
    as avoid moving tracks or circular saw blades, spin into and then kick Goombahs
    to find coins or keys, or avoid the sucking black hole). In this way, each planetoid
    is a miniature world, though with some bizarre features as well as pleasant miniature
    gardens, plants, hills, lakes, and cottages. Chaim Gingold notes that Miyamoto
    has repeatedly described his aesthetic ideal in making games such as *The Legend
    of Zelda* as an attempt to give the player a “miniature garden that he could put
    inside a drawer.” Gingold proposes that Miyamoto probably had in mind “*penjing*,
    miniature landscapes in containers”—or bonsai, in Japanese, and we think that
    the link between Miyamoto’s games and the bonsai aesthetic is quite suggestive.³⁹
    For one thing, such stylized miniature gardens and trees are often deliberately
    out of proportion, relying on simplification and abstraction to suggest rather
    than copy to scale the dimensions of objects, so a branch that’s larger than normal
    can suggest, for example, the trunk of a full-sized pine tree. It’s not hard to
    see how this traditional aesthetic of exaggerated features and playing with scale
    might have influenced the look and feel of the Miis as well as the self-contained
    world of Link’s adventures in Zelda.


    Gingold argues further that the idea of building scale models links miniature
    gardening with video game design. “This simultaneous play at micro/macro scales
    is a key pleasure of models. . . . Miniature gardens are scale models of bigger
    phenomena.”³³ But his remark on *penjing* and bonsai indicates an important qualification:
    unlike in proper scale models, in creative works such as games, scale is always
    flexible and manipulable in order to achieve particular emotional effects—for
    instance, the accessibility and *kawaii* of the Miis. With that qualification,
    however, the idea that mapping the relationships between micro- and macroscales,
    between virtual and real worlds, so that, as Miyamoto says, the player can experience
    the pleasures of controlling a miniature garden, turns out to be particularly
    useful for understanding the Wii, its interface, and its most characteristic software
    titles to date. As we’ve seen, the whole idea of the Wii’s motion-sensitive control
    system is that a nonrealistic, nonimmersive game space can be productively linked
    to the player’s physical space by treating the player space—the living room—as
    a critical part of the equation, a grid for possible moves that can be mapped
    onto the game. For the Wii, player space is not something to be transcended or
    wished away in a headlong plunge into immersion in the imaginary game world. Player
    space is instead a place to remain aware of while being engaged in active play.'
