- pgno: 10
  md: '# Series Foreword


    How can someone create a breakthrough game for a mobile phone or a compelling
    work of art for an immersive 3D environment without understanding that the mobile
    phone and the 3D environment are different sorts of computing platforms? The best
    artists, writers, programmers, and designers are well aware that certain platforms
    facilitate certain types of computational expression and innovation. Likewise,
    computer science and engineering has long considered how underlying computing
    systems can be analyzed and improved. As important as scientific and engineering
    approaches are, and as significant as work by creative artists has been, there
    is also much to be learned from the sustained, intensive, humanistic study of
    digital media. We believe it is time for those of us in the humanities to seriously
    consider the lowest level of computing systems, and understand how these systems
    relate to culture and creativity.


    The Platform Studies book series has been established to promote the investigation
    of underlying computing systems, and how they enable, constrain, shape, and support
    the creative work that is done on them. The series investigates the foundations
    of digital media: the computing systems, both hardware and software, that developers
    and users depend on for artistic, literary, gaming, and other creative development.
    Books in the series certainly vary in their approaches, but they all also share
    certain features:


    +   - A focus on a single platform or a closely related family of platforms

    +   - Technical rigor and an in-depth investigation of how computing technologies
    work'
  merge: -1
  img_proc: true
- pgno: 11
  md: '+   - An awareness and discussion of how computing platforms exist in a context
    of culture and society, being developed based on cultural concepts and then contributing
    to culture in a variety of ways—for instance, by affecting how people perceive
    computing


    This particular title, *Codename Revolution*—a collaboration between a scholar
    in textual studies and a computer scientist—offers a close look at how platforms
    and their design can foster social engagement with computing and gaming. The book
    also provides a comprehensive study of a current-generation, state-of-the-art
    platform that was released in 2006, has been extremely influential, and is still
    significant in the market.'
