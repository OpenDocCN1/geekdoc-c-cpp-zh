  md: '+   7. *Kinect Sports* trailer, June 14, 2010, http://www.youtube.com/watch?v=am2RdxbaKE.

    +   8. Quoted in Jonathan Zittrain, *The Future of the Internet: And How to Stop
    It*, Kindle ed. (New Haven, CT: Yale University Press, 2008), 101–114.

    +   9. Seth Schiesel. “New in Gadgetry: 3-D Escapades without Glasses.” *New York
    Times*, June 20, 2010, http://www.nytimes.com/2010/06/21/arts/television/21videogame.html?hp.
    After this chapter was completed, we were able to spend time with the 3DS and
    found the AR (augmented reality) games in particular to be an extension of the
    design ethos of the Wii as we’ve described it throughout this book. That highly
    symbolic coffee or tea table on Wii configuration is replaced in 3DS play with
    an actual table (or any other surface) on which you place an AR card with an image
    printed on it. When viewed through the 3DS, the paper card and the wooden table
    become the game world, as a dragon emerges from the card as if from a hole in
    the table, for example, and you shoot at it from multiple angles encircling around
    the table, holding the console in front of you as a viewer. A similar focus on
    the possibilities of augmented reality has apparently informed the design of the
    Wii U, which makes use of the touchscreen controller as a second, alternative
    window, to “take the game world off the TV and spill it all around you” in the
    living room so that “you can peer into it from any angle.” Iwata, Nintendo E3
    2011 press conference, June 7, 2011, http://e3.nintendo.com.

