- pgno: 167
  md: 'in the U.S. . . . close to 29 million units of Wii sold.<sup>203</sup> With
    the speculative console that became the Wii U at that point still a year in the
    future, and its place in effect having been temporarily held by the 3DS, Nintendo
    focused on a software list for the Wii calculated to play to a sense of history.
    At the E3 press conference, Fils-Aime remarked that the conference had seen plenty
    of talk about “button control, motion control, and—smiling—‘no controller at all.’
    But he said, “technology is only a tool. . . . [T]he thing that matters is an
    experience.” After several years of emphasizing the role of revolutionary technology
    in creating that experience, the company shifted gears in 2010 to concentrate
    on software’s role.


    For Nintendo fans, one big announcement was for the adventure-title, *The Legend
    of Zelda: Skyward Sword*. Long anticipated, the game was shown in a playable state,
    but its release date was pushed off to 2011 (our descriptions here are therefore
    based on the demos, trailers, and reports by journalists). This is the first new
    Zelda game fully designed for the Wii, since *Twilight Princess* had been originally
    started for the GameCube and ported to the Wii late in its development.


    Second only to Mario in iconic status in Nintendo’s catalog, the Zelda franchise
    is Miyamoto’s other great contribution to video game history. *The Kingdom of
    Hyrule* is the original game world as “miniature garden,” to again cite Miyamoto’s
    favorite metaphor. Writer Tom Bissell has compared the “impressively open-ended
    gameworld” of *The Legend of Zelda: Ocarina of Time* in particular (1998, for
    the Nintendo 64) to later open-world or sandbox games like those in the *Grand
    Theft Auto* series; Hyrule offered the player a similar sense of extensive freedom,
    and was “ingenious, fun, and beautiful.” Bissell’s book *Extra Lives* is an interesting
    case study actually—a strange kind of confessional autobiography about his obsession
    with gaming. In it he also contrasts Zelda’s appeal to the “hairlessly innocent
    parts of [his] imagination” with his later cocaine-enhanced experiences with *Grand
    Theft Auto: Vice City*, for example; evincing the kind of deep-seated nostalgia
    that many older core gamers still feel for Nintendo classics.<sup>204</sup>


    This is the kind of loaded context into which any new game in the Zelda series
    is introduced—a complex emotional identification with multiple generations of
    a franchise across several different platforms, which adds up over time to a sense
    of the Zelda universe. It was deliberately triggered by the trailer introducing
    the game, in which ghostlike Links from previous games ride (on horseback) sail
    (in a ship) and leap forward (as a wolf) into the image of the new game’s version
    of the hero, who stands calmly and unsheathes his sword. Ensuring the proper succession
    of games in a long-loved franchise is always important to dedicated fans.'
