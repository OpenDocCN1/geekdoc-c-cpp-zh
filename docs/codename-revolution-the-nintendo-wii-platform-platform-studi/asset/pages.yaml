    The game''s overall plan is based on deepening the context for the mouse as action-adventure
    hero. The story takes place in Wasteland, which basically is a world of discarded,
    forgotten Disney intellectual properties—characters, sets, films, and old theme
    park rides—all held under a spell cast and threatened by a Phantom Blot, by way
    of Oswald the Lucky Rabbit, who was in real life Walt Disney’s first creation
    before Mickey Mouse, but for whom he lost intellectual property rights. Oswald
    is jealous of Mickey’s fame and lives a twisted shadow existence in Wasteland,
    accompanied by a series of uncanny copies of Disney characters that were Mickey’s
    friends, Donald Duck and Goofy, as well as the Beetleworx, dark cyborg versions
    of Mickey’s fellow cartoons. Mickey meddles with the Sorcerer’s created world
    (as in *Fantasia*), then enters Wasteland, climbing through a mirror like Alice
    through the looking glass, and has to stop the Phantom Blot in order to save the
    world, in part by regaining the trust of Oswald, his lost half brother.


    It’s a heavily metanarrative, a dark version of Disney lore, with precedent in
    various actual cartoons, including in the famous short from a competing studio,
    Warner Brothers, *Duck Amuck*, the feature film *Who Framed Roger Rabbit?*, and
    more directly the previous video game series, Square Enix’s *Kingdom Hearts*,
    a critically successful mashup combining Disney worlds and characters with the
    characters of the Japanese *Final Fantasy* series. Spector has said that the core
    mechanic of the game is about the essence of cartoon being: ink or paint. You
    play as Mickey, and use a paintbrush and paint thinner to either bring objects
    into being or dissolve them, so the 3D platformer action involves literally shaping
    the game world—both positively and negatively—as you play. These actions have
    consequences in the story as well, so that “play style matters,” as Spector likes
    to put it.¹⁶ This kind of divergence or split is manifest in the game world, too,
    where there are varying “states of matter,” colorful painted objects that you
    can affect with your brush and thinner along with dark and sharp inert objects
    that you cannot affect. In a corresponding way, you can choose to play Mickey
    (also after all an object in the game world) in varying states of character, from
    “hero” (more like the late Mickey that Spector calls “mom-friendly”) to “scrapper”
    (more like the mischievous Mickey of the early black-and-white cartoons), or a
    hybrid of the two, and his appearance will vary slightly based on the choice.¹⁷
    The range of styles in this one game in some way mirrors the different styles
    of play implicit in the spectrum of hardcore to casual gaming, one end of'
