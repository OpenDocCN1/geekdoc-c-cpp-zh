  md: 'pretend world of character or story”—which is to say, the nondiegetic elements,
    such as the player or “operator” setting up or configuring the game.⁴⁵


    In the end, Galloway realizes that despite the schematic relationships that his
    terms imply, diegetic and nondiegetic elements actually coexist along a complicated
    continuum, and it’s not always easy to define the difference between them. He
    acknowledges, for example, that “nondiegetic elements are often centrally connected
    to the act of gameplay,” that in fact “the nondiegetic is much more common in
    gameplay than in film or literature,” and admits that ultimately “in some instances
    it will be difficult to demarcate the difference between diegetic and nondiegetic
    acts in a video game, for the process of good game continuity is to fuse these
    acts together as seamlessly as possible.”⁴⁶


    Precisely so; and in fact, we could go further and say that video games are normally
    played at the border between diegetic and nondiegetic spaces. This is never clearer
    than when you are playing a multiplayer game or a game with a mimic interface
    like the Wii’s. But, almost all video games have an important social dimension
    in this sense, because almost all video games are played at the paratextual threshold
    between the fictive game world and player operations, the border between diegetic
    and nondiegetic spaces, the boundary of text and paratext. Skilled gamers have
    always been adept at moving from Hyrule to the health meter to the Z button and
    back again. They have also frequently negotiated the border between actual social
    space (in the living room) and the make-believe worlds (game spaces) in which
    they’re engaged, whether ghost-filled mazes, space stations, or Wuhu Island. A
    network of displays, haptics, controllers, and channels of communication has always
    linked game space to the physical and social worlds. That’s what a console-based
    platform is, in the end—that series of links or transactional objects that mediate
    between player and game. What the Wii has done so impressively is to make that
    threshold space, that transitional space, the main focus of its system and the
    focus of the best games for its system. This means actively embracing the idea
    that when it comes to gameplay, the center of the action is paratextual, and the
    paratextual is inherently social.


    Platform is an abstraction, in part a dynamic function of the circumstances of
