  md: 'showing up on a graph, or you can go straight to training activities. For the
    Body Test, you’re prompted to put the Balance Board on the floor and turn it on.
    Then, when it’s ready, a high-pitched, robotic voice says to “step on.” A small
    Mi-like wireframe silhouette rotates off the screen’s side as the system repeats:
    “Measuring . . . Measuring. . . .” Scan lines sweep up the Mii figure as it rotates,
    suggesting that your body is actually being scanned—when of course it’s really
    just being weighed and its center of balance determined. The image—the rotating
    wireframe Mii body being scanned by the system—is a visual metaphor for what’s
    essential about *Wii Fit Plus* and its Balance Board controller as well as what’s
    ultimately essential about the Wii, at least from the point of view of the designers
    and software developers at Nintendo. It’s a figure for the idea at the heart of
    the Wii as a platform—the idea of focusing attention on the player’s active body
    out in physical space, rather than on the virtual presence of an avatar in an
    imaginary game space. And the technology that makes the shift of focus possible
    is located at the platform’s periphery, in peripherals like the Balance Board.


    # Player Space (“Adequate Space Required”)


    Warning screens on the Wii always remind players with diagrams and text to attach
    the Wii Remote with the wrist strap and use the protective jacket, but also to
    “clear the space around you” before you begin. In the diagram, the iconic living
    room containing the blue silhouette demonstration player-figure is standing facing
    a television, and a coffee table has been moved to one side. In the *Wii Operations
    Manual*, an overhead-perspective diagram shows a television screen to the left
    and a player extending a Wii Remote to the right. A box between the screen and
    the player with a graphic warning symbol reads: “CAUTION—Adequate Space Required.”


    Although this warning is of course a legal disclaimer, from the perspective of
    the platform it’s hard not to read it as a suggestive description of the invisible
    key component in the Wii as a system—the physical space between the components,
    and between the player and the display.” Like white space in typography design,
    this negative space is crucial for the operations of any platform, but the Wii
