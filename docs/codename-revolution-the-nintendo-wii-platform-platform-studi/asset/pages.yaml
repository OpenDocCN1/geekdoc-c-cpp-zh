  md: 'Consider the history of Sun, the company that effectively ushered in the open-systems
    era. Although Sun never positioned itself as an open-source company, it nevertheless
    was at the forefront of open standards and interfaces. Even when Java was in its
    infancy, the slogan associated with it was “the network is the computer.” “Sun
    understood then what is widely recognized now: true openness requires designers
    and programmers to keep most of the networking protocols and standards open, because
    these form the boundaries of larger distributed systems. Clearly there are recent
    trends that challenge this view, particularly Apple’s tightening control over
    its platform on various devices by setting up iTunes and the App Store, which
    though it runs on the Internet using its protocols (HTTP and TCP/IP), is mostly
    a closed architecture. In institutional terms, Apple’s control over what gets
    published via the App Store is a serious issue. But this is not reducible, in
    the end, to whether the iPad’s design and source code, for example, does or does
    not allow for easy hacking.


    The overall trend, we think, is toward many smaller linked devices—however closed
    or open—in a relatively open distributed network that itself employs mostly open
    standards. To recognize this is to shift attention from source code per se to
    those standards; in other words, to the social and economic factors that might
    affect communication among the distributed parts of the network or any given platform.
    Such a shift makes it clear that hardware and software design—including the design
    of any platform—is always shaped by social contexts.


    Even Zittrain acknowledges that “how much the system facilitates audience contribution
    is a function of both technological design and social behavior.” There is always
    a social layer at the highest level that’s an essential part of how any computing
    platform works—and how open it is in practice. And this is especially true for
    a gaming system, the purpose of which is creative expression and interactive entertainment.
    Any platform with users is a function of this social layer. The reason that video
    game consoles still exist—at least for now—is that gamers continue to respond
    positively to the affordances of these dedicated systems, with their specialized
    controls, interfaces, and data-management systems, which are closely bound up
    with existing institutions for software development and distribution channels
    as well as communities that identify with particular franchises and producers
    of intellectual property, especially social “universes” surrounding the competing
    platforms. There is no reason, given a regularly updated library of software titles,
    that a PC or portable platform—such as Nintendo’s 3DS, or any smartphone—could
    not serve just as well as a home game console. For many gamers, it already does.¹³'
