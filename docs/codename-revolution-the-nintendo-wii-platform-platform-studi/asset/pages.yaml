    # The Wii Remote as Mouse


    Douglas Engelbart and William K. English, in a famous 1968 paper and demonstration,
    called the controller they had invented an “SRI [Stanford Research Institute]
    cursor device . . . used for screen pointing and selection.” They go on to describe
    the “mouse” (which notably, still required quotation marks around it) as “a hand
    held X-Y transducer usable on any flat surface.”³² It worked by using a system
    of wheels to measure changes in analog voltage, converting the rolling of the
    wheels over the tabletop to mapped proportion to the X or Y coordinates, and using
    an analog-to-digital converter to control what was displayed on the screen. The
    mouse coordinates are translated into instructions for the computer.


    Until the introduction of touchpads for PCs, and then the touchscreen for mobile
    phones and Apple’s iPad, the mouse had become the default interface for most day-to-day
    computer users, replacing the command line for all but the most technically savvy
    (many of whom continue to prefer the command line for programming and data-centric
    tasks anyway). It’s important to notice that unlike the command-line interface,
    the mouse involves tracking user movements in physical space, and converting those
    (analog) movements to digital data in the computer that can (but don’t have to)
    result in graphic representations. Engelbart and English compared it to the available
    alternatives, such as light pens (the mouse was “generally less awkward and fatiguing
    to use”) and joysticks, for functions like efficiency and speed. The original
    mouse even employed three buttons for “special controls” to digitally supplement
    the analog input provided by the moving wheels, not unlike the Wii Remote’s use
    of buttons in addition to input from the accelerometer, gyroscope, and infrared
    sensor. The Wii Remote could also be seen as modeled as much on the mouse as it
    is on the television remote. Both devices are essentially “X-Y transducers,” as
    Engelbart and English refer to the mouse, but with the Z axis added for the Wii.³³
    They convert movement on a Cartesian grid to represented actions in the possibility
    of the video game. (In the Wii’s case, the X-Y and Z grid is also augmented with
    spherical coordinates by way of the MotionPlus accessory.)


    Obviously the joystick is also an X-Y transducer, and one that goes back to the
    beginning of the twentieth century, in digital form first—say, either on or off,
    left or right—and then an analog form, with more precise'
