- pgno: 169
  md: 'During the press conference, when it came time to demonstrate the bow and arrow,
    Miyamoto found his controllers lagging and breaking contact with the game. He
    blamed the glitch on wireless interference, probably accurately, since this was
    a problem faced earlier the same year during high-profile tech demos by Steve
    Jobs at Apple and at a Google demonstration of its Internet television, due to
    the recent increase in the use of “MiFi” personal wireless devices among those
    attending the presentations. Yet the glitch serves as an interesting reminder
    of how dependent new game platforms are becoming on networking communications
    protocols, or how much any modern computing platform is likely to depend on a
    distributed model to one degree or another outside any given device. The network—whatever
    technical form it takes—is becoming a vital component in game platforms. As the
    wireless failures at these demos remind us, this goes beyond any specific design
    for user interactions or online modes of play to the matter of basic infrastructure.


    Another important demo at the same press conference reinforced the appeal to nostalgia,
    taking the cultural associations to levels rarely seen even in the highly allusive
    world of video games. *Disney Epic Mickey* is an exclusive title for the Wii developed
    by respected game designer Warren Spector and Junction Studios (now part of Disney
    Interactive Studios), in collaboration with Disney and Pixar. Spector is a designer
    with “core” credibility, best known for the dark cyberpunk hybrid FPS-RPG series,
    *Deus Ex* (2000, 2003).¹⁵ But he has an interesting background, which includes
    a graduate degree in film and communications, and before his earliest work on
    games, he did a brief stint as an archivist in the David O. Selznick Collection
    of the Harry Ransom research library at the University of Texas. One of the earliest
    games he worked on was *Toon: The Cartoon RPG* (Steve Jackson Games, 1984), in
    which you play as a cartoon character who’s a close parody of an actual classic
    cartoon. Spector’s sense of film history, cartoon art as well as the role of imitation,
    parody, and reconstruction in dealing with cartoon-based intellectual properties
    all read like qualifications for the job of developing a modern action-adventure
    game based on the world’s most famous eighty-year-old cartoon-mouse movie star.


    The issues of Disney aesthetics and values, the squeaky-clean image promoted for
    later incarnations of the mouse, the company’s history when it comes to intellectual
    property battles, and the social politics surrounding Walt Disney and the company
    he founded make the context for this project especially complicated. Early public
    expectations were that Spector would bring a strong aesthetic to the character,
    “darkening” Mickey Mouse in keeping with the kind of FPS and RPG games he had
    produced'
