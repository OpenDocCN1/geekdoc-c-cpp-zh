    A theoretical question often taken up in computing circles these days is whether
    Moore’s law is dead. Gordon Moore, a cofounder of Intel, famously noted that the
    number of transistors (or components) that can be packed into an integrated circuit
    roughly doubled every year from 1958 to 1965. From this, he extrapolated a prediction
    that the trend would continue—and it did for well over twenty years. While the
    precise end date for this upward trend is still unclear, it’s notable that top
    CPU speeds, especially in available processors, seem to have peaked at around
    3.2 GHz in recent years, and are no longer doubling every eighteen to twenty-four
    months. This has led to the emergence of multicore architectures, which effectively
    combine CPUs to achieve more processing power via multiplication. So a dual- or
    quad-core CPU featuring 3.2 GHz cores effectively has 6.4 or 12.8 GHz speed, respectively.


    These speeds are of course seldom achieved in practice, since OSs and applications
    need to be optimized (and work collaboratively) to achieve optimal throughput.
    In many ways, we are witnessing the end of a long period in which CPU speeds continued
    to increase according to Moore’s law. Even when gains are made, we also observe
    a “software lag,” meaning that software is seldom able to take full advantage
    of the extra speed and additional cores. At the same time, paradoxically, we’re
    also seeing the'
