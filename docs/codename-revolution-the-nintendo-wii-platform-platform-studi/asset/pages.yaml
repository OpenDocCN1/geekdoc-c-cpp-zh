  md: 'developers as “waggle”—the tendency of certain games to allow relatively imprecise
    and uninvolved, weak waving of the controller to work as effectively as more mimetic
    gestures, a flick of the wrist instead of a full-armed stroke of a tennis racquet
    or sword. In *Red Steel 2*, swinging the remote harder and faster makes the character
