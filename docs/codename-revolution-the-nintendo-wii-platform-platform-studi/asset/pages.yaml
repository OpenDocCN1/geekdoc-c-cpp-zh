  md: 'for example, can be attached; their blinking lights dangling from the back
    of the console are reminders of a potential channel of wireless communication
    with, say, plastic guitar controllers, microphones, or drum-pad sets in *Rock
    Band* or *Guitar Hero*. On the back, there is also a connection for the cable
    to the slim LED sensor bar that sits on the top or in front of the television,
    and communicates with the infrared sensor camera in the Wii Remote controller,
    as well as AV out and DC power input connections. The lithium battery holder is
    under a cover on the bottom of the console, beside an air intake (there’s also
