  md: 'Jesper Juul, who, as we have said, sees the Wii and its mimetic interface as
    being at the center of the casual revolution, has conducted interesting Internet
    experiments along these lines. He shows that if you search Flickr, for example,
    for “Gears of War 2,” you get pictures of in-game battle, among other things.
    Whereas if you search “Wii Tennis,” you get a much higher percentage of pictures
    of people playing Wii Sports, moving around in their living rooms and waving their
