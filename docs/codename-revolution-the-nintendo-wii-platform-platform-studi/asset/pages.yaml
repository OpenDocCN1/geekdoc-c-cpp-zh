  md: 'Nintendo has worked to develop and has encouraged the third-party development
    of software that would exploit it as a legitimate game controller. In one published
    discussion, *Wii Fit* producer Takao Sawano says, “Sometimes during development,
    I started looking at the Wii Balance Board as more than just an accessory that
    could weigh players and more like a controller used with the feet. I think there’s
    a lot of fun stuff you can do by applying human balance to gaming, and I hope
    lots of different people step up to the challenge.”^20


    Looked at another way, the satirical video remix we mentioned earlier may suggest
    something seriously threatening about *Wii Fit* and the Balance Board—not to mention
    the Vitality Sensor. When the latter was introduced, one prominent game site,
    1up.com, referred to its debut as the primary “WTF moment” of E3 2009.^21 Many
    anxious comments on discussion boards likewise reflected a general sense that
    Nintendo’s Health Pack initiative for the Wii fundamentally challenges what counts
    as a video game in the context of the vast new consumer market that the console
    has opened up. It’s interesting that despite all the ridicule, in the end a good
    many critics on the blogs or in the game press gave *Wii Fit* and its immediate
    sequel *Wii Fit Plus* good reviews. Even yup, which mocked the Vitality Sensor,
    for example, awarded *Wii Fit Plus* an A-. And the game has continued to sell
    well. By March 31, 2010, *Wii Fit Plus* alone had sold 12.65 million units worldwide
    in less than a year since its release.^22 Peripherals for exercise games are objects
    that signal an ongoing redefinition of gaming—a process with a long history, but
    continuing with new prominence in the wake of the casual revolution.


    # *Wii Fit Plus (“Measuring”)*


    *Wii Fit Plus* was released in 2009 either alone or bundled with the Balance Board.
    As a sequel, it offered the original *Wii Fit* games along with fifteen new ones,
    plus additional strength training and game like exercises. There are more actual
    gamelike games than in the first *Wii Fit*. You can run an obstacle course that’s
    essentially a 3D platformer (you walk, run, or jump in place on the Balance Board);
    you can tilt a board with holes in it (you lean on the Balance Board) so that
    balls fall in the holes without falling off the edge; and you can flap your arms
    to make your Mii (in a chicken suit) fly and stop flapping to descend on targets,
    leaning into the direction you want to travel (in this case, remarkably, the Balance
    Board detects the rhythmic motion of your arm flapping). With the exception of
    jogging, all of these make use of the Balance Board; for some you stand on the
    board but also hold the Wii Remote.'
