- pgno: 168
  md: 'Imagery like this is a kind of ritual pageant, meant to reassure and establish
    the lineage of the new installment. In the same spirit, Miyamoto himself came
    onstage (after appearing first on the large video screen) to demonstrate *Skyward
    Sword*.


    In terms of story, it’s a deep prequel that recounts the origin of the famous
    Master Sword, just as fans had speculated when preview artwork of a personified
    sword-figure made its way on to the Web a year earlier. The Skyward Sword of the
    title guides Link in the new game and is eventually transformed into the Master
    Sword. The artwork is subtly different from previous games in the series, based
    more on the look of impressionist paintings, according to Miyamoto and confirmed
    by those who played the demo. Earlier titles in the franchise had a cel-shaded
    cartoon look, and some had speculated that this new game might go in that direction
    again, given the graphics limitations of the Wii. The softer-focus painterly graphics,
    especially for the many scenes of the sky, may be an alternative design solution
    toward addressing the same limitations.


    Several key design decisions have been based on the Wii’s specific affordances
    and constraints. Link is right-handed, of course, as he has been since *Twilight
    Princess*, when the use of the Wii Remote instead of only button controls made
    the stylistically more common choice of right hand for sword hand necessary for
    the first time, altering the famously left-handed hero. You play with two hands,
    the shield controlled by the Nunchuk and the sword by the Wii Remote, and you
    can use the shield to volley shots back to enemies, not only for protection during
    melee battles. The swordplay takes advantage of the MotionPlus attachment, just
    as *Red Steel 2* does, for instance. The Deku Babas, the giant Venus-Flytrap monsters
    that you encounter in the game, have been designed to open their mouths either
    vertically or horizontally, and since MotionPlus affords the possibility of measuring
    the difference, you have to match the direction of the open mouth as you swing
    your sword in order to kill them. When you hold the sword (by holding the Wii
    Remote) pointed straight up, it charges with the power of heaven and can shoot
    lightning bolts. You can shake either controller to produce a weapon: sword, shield,
    slingshot, whip, or bow and arrow. With some refinements, the bow and arrow works
    more or less the way it does in *Wii Sports Resort*. Bombs can now be dropped
    or “bowled” using the same arm motion as in Wii Bowling. The weapons are accessible
    using the Wii Remote to call up a radial menu of items that appears in a heads-up
    display, superimposed on the gameplay screen. In his demo, Miyamoto characterized
    this feature as a way to imagine that you’re reaching in your pocket for the next
    implement.'
