    can we decrease power consumption and maintain performance?"³¹


    This is the complex background to Miyamoto''s later public remarks, characteristically
    understated, that "power isn''t everything in a console."


    A video game console is a computer specifically designed for playing games when
    hooked up to a television. Historically, the dedicated video game console (after
    the Magnavox Odyssey or Atari VCS in the 1970s) emerged more or less in parallel
    with consumer-model PCs. At various times and in specific instances, it was designed
    to compete directly with the PC. The other consoles in the Wii''s generation,
    the PS3 and Xbox 360, are massive, multipurpose machines that go the PC one better.
    In one sense, the Wii took a deliberate turn off that path, off that engineering
    "road map," and at the level of its processors aimed instead to be a dedicated
    games machine in the most targeted, efficient, and low-cost way that it could.
    Yet given economic realities, Nintendo has continued to feel the pressure to make
    its console compete with other machines in the same generation by offering some
    relatively limited forms of online play, for example (and with new pay structures
    for the privilege), as well as introducing Netflix access via the Wii in 2010.
    (Since Nintendo''s console cannot play DVDs, this was seen as a significant move.)
    These compromises are clearly part of a balancing act based on pragmatic imperatives
    of the marketplace as much as on any desire on the company''s part to loosen the
    constraints built into the console itself.


    In the end, however, the Wii console''s limitations and affordances alone have
    not defined the system in the public imagination, except as these have been translated
    into design, and then marketed as such. Iwata may have held aloft the small and
    newly efficient black console at the E3 conference in 2005, but the more socially
    significant preview came later.'
