  md: 'be open to such hacking is also a reminder that no platform is ultimately defined
    entirely by its manufacturer or licensed uses. Every platform is a combination
    of hardware and software that is in part defined by the possibilities that lie
    outside what it was designed to do, because every platform is a site of sometimes-unpredictable
    transactions with users. Author William Gibson famously had a character remark
    that “the street finds its own uses for things.” “Video game players, as users
    go, tend to include an activist or hacker segment that engage in the more extreme
    kinds of creative uses, whether or not they are licensed.


    As we will explore further in the next chapter, however, even perfectly legitimate,
    authorized, and licensed uses can test the boundaries of what was originally intended
    for a platform by its creators. Playing video games is the kind of activity that
    always to some degree depends on such boundary-testing uses, since gaming encourages
    clever and ingenious moves to overcome barriers and obstacles of many kinds, and
    the line between an “exploit” and an extremely clever move—and more generally,
    the magic circle of gaming and what’s outside its perimeter, out in social space
    with all its unpredictable interactions—is often difficult to define.'
