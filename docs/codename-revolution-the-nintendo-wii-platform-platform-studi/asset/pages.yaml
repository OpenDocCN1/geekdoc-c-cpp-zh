  md: 'efficient, consider its core CPU in comparison to that of its competitors.
    The Xbox 360’s core 3.2-GHz PowerPC CPU is a member of the same processor family
    as the Wii’s (the PowerPC), but obviously with more power and thus much increased
    power needs. The PS3 employs a CPU with a dual-core power processor element and
    seven synergistic processor elements. The seven synergistic processor elements
    are used to off-load major computational tasks using a model of parallel computation
    known as single instruction, multiple data. While the Xbox 360 and PS3 have some
    significant architectural differences, in both cases their CPUs are at the high
    end of processor speeds, even in the context of today’s desktop and laptop PCs.
    It comes as no surprise, therefore, that the PS3’s power-consumption footprint
    is the largest of the three. Actually, compared to the Wii, the PS3 is a veritable
    supercomputer, with a design reminiscent of vector-style parallel computers such
    as the Cray.


    The difference in power use is significant. To put it in practical terms, the
    Wii can be powered for twenty years before its electricity costs match the price
    of the system itself. Even when following the National Resources Defense Council’s
    green recommendations and powering down the console when not in use, the two higher-powered
    systems still use slightly more electricity when turned off, used minimally, or
    in standby mode than the Wii does when it’s left on. Interestingly, the study
    rightly connects this difference to the different design constraints of the competing
    systems: “Using an average of just sixteen watts in active mode, the Wii is the
    juice sipper of the group. Attracting buyers with novel, interactive gameplay
    rather than power-hungry, high-end graphics, the Wii uses far less power to operate
    than its competitors.”²⁸ So in the context of video game consoles, the Wii is
    quite the opposite of a huge energy drain, and this is directly tied to Nintendo’s
    development of novel forms of gameplay.


    Early reactions to the Wii’s general profile were often right: it is a good deal
    like the original Mac Mini, which was deliberately designed by Apple to draw only
    a modest amount of power in order to perform its necessary functions (driving
    display graphics, for example, or acting as a home network server). More generally,
    the Wii can be seen as fitting into a larger trend in systems design over the
    past decade toward greater environmental and energy awareness, and more task-specific,
    “right-size” computing. Given that the opportunities at the high end of computing
    for energy efficiency are rare, the industry’s tendency as a whole has been to
    miniaturize and specialize at the lower end of computing, and the Wii’s overall
    design fits right into this trend. Small form-factor PCs, including the Mac Mini
    and popular lightweight netbooks, say, try to do more with less—but in the'
