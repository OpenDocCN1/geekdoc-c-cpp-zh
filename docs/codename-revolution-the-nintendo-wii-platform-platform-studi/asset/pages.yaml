    # The Wii Remote as Magic Crayon


    Developing software for the Wii involves programming for its particular affordances
    and within its particular constraints. This includes first of all programming
    for the intuitive interface provided by the Wii Remote controller. In fact, Nintendo’s
    SDK, which a third-party developer can purchase after being successfully accepted
    and registered as an official Nintendo developer, ships with a tool called LiveMove,
    made by AiLive, which offers a graphic user interface (GUI) for “training” a new
    game to recognize a repertoire of motions by the Wii Remote. The programmer turns
    it on, repeats a series of named sample motions (flipping a pancake, say) in various
    speeds and at different angles, and the program then captures those and automates
    the code for integration into a game under development (in this case, it might
    be a restaurant game). With the Wii control system, game creation itself has to
    leverage the intuitive interface.


    This is a case of a major console system enabling what game developer and theorist
    Chain Gingold has called a “magic crayon.” Magic crayons, in Gingold’s definition,
    are representational languages that combine art and computation, or basically
    software tools for authoring computational works such as games in an intuitive
    way. According to Gingold, a magic crayon should be “accessible” and “sketchable”
    as well as “computational” and “expressive.” “It is a term for an intuitive interface
    from the authoring side that approaches some of the same goals Nintendo has expressed
    for the Wii from the player’s side, including most of all accessibility (“for
    everyone”).”


    From either the authoring or player side, pointing and marking objects are among
    the most intuitive and powerful actions one can perform with the Wii Remote. This
    is made vividly clear in the success of third-party games for the Wii that involve
    such controller actions. Even a game ported from earlier systems such as Capcom’s
    Ōkami can illustrate this power, since it involves using the controller to paint
    as if it were a calligraphy brush (a mechanic that was to return several years
    later in Disney Epic Mickey, as we will show in chapter 7). Drawing a circle in
    the sky makes the sun appear, for example, or drawing a line across a chasm can'
