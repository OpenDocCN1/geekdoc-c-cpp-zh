- pgno: 42
  md: 'The console’s design imperative—to signify simplicity—shows up even in the
    superficial details, such as, for example, the fact that the case’s screws are
    covered with tiny white plastic flaps or rubber feet to create a smooth, uniform
    surface. But concealed behind the smooth, compact shell of the slim white box—literally
    hidden behind a series of trapdoors—are the inevitable complicated details, the
    technology that does the work necessary to any modern console, serving as a reminder
    of the importance of other components and peripherals (or potential components
    and peripherals) that complete the platform. It’s important to get a sense of
    just how much is packed into the deceptively simple form factor, so we want to
    take a moment to tour the console’s components.


    With the console standing vertically, a long trapdoor on the top reveals four
    ports for GameCube controllers. Just behind that, a small door covers two slots
    for GameCube memory cards—signs of the Wii’s most hardwired form of backward compatibility.
    The GameCube (2001) was a sixty-four-bit system and the first Nintendo console
    to use an optical drive for loading games (mini DVD-ROMs). Nintendo has repeatedly
    called attention to this backward compatibility, in concert with the availability
    of the back catalog by way of the Virtual Console. For the GameCube, Nintendo
    had partnered with IBM to produce a custom 486 MHz PowerPC chip, called “Gekko,”
    as its central processing unit (CPU) and a 162 MHz ATI GPU (graphics processor
    unit), codenamed “Flipper”. The Wii makes use of an updated version (“Broadway”)
    of the same basic PowerPC architecture for its 729 MHz processor and 243 MHz ATI
    (“Hollywood”) GPU. In general, the internal architecture for the Wii’s chipset
    is a kind of direct extension of the GameCube’s “Dolphin” chipset. The GameCube
    can be seen as anticipating the Wii’s simplicity of design since it was also a
    small box (a five-inch cube). Unlike the Wii, however, it came in a range of colors
    from the start.


    To return to the Wii: a drive slot runs down the front of the console for optical
    discs (Wii and GameCube discs will work). It glows blue when the console is on,
    when a disc is inserted, and when it’s receiving data over the Internet via the
    WiiConnect24 service. It turns orange when in standby mode, and red when turned
    off. A small door on the console’s front to the left of the optical disc slot,
    below the reset button and above the eject button, opens to reveal a secure digital
    (SD) card slot for much-needed expanded storage (support for secure digital high
    capacity [SDHC] was added in 2009, allowing for up to 32 GB of additional storage),
    along with a small synchronization button above the slot. On the back of the box
    there are two USB ports, where dongles for wireless music-game controllers,'
  merge: -1
