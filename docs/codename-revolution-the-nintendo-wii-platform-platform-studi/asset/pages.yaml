- pgno: 173
  md: 'layers of hardware, code, interface, game, the screen, the player’s body, the
    peripherals, the living room, the invisible networks of communication technologies
    and the larger network, and the world.


    Platforms emerge, evolve, and sometimes disappear from common use over time. Any
    understanding of the life cycle of a platform must take into account its development
    after release, and the significance of the development of software for the platform,
    from launch to the transition to a new platform (which may entail ports, or even
    more radical forms of redesign and recoding) later in the life cycle. As we write,
    the Wii’s successor, the Wii U, has just been unveiled and the original Wii is
    fast approaching the traditional five-year limit of a game system’s life cycle.
    The 3DS, released in 2010, has served as a bridge to the new console, as well
    as a shift by Nintendo into the mobile market. At this interesting moment in the
    life cycle of the three platforms—Wii, 3DS, and Wii U—under the pressure brought
    by the new motion-control competition, Nintendo has paid increased public attention
    to its software, including the appeal of that software to the nostalgia of its
    core fans.


    Another example of this software phase is the James Bond game, *GoldenEye 007*
    for the Wii—a resuscitation of what many consider the most important FPS of its
    generation, *GoldenEye 007* for the Nintendo 64. Yet another is *Metroid: Other
    M*, the new installment of the science-fiction shooter franchise with a solid
    place in video game history, in part because of its female hero, Samus Aran (whose
    alien DNA and cybernetic Power Suit worked to conceal her sex for most of the
    first game). Or the colorful *Kirby’s Epic Yarn*, which exhibits the kind of artwork
    and central concept associated with independent games on WiiWare (the game world
    of this mostly 2D scroller looks entirely made of fabric, and threading, sewing,
    scrunching up, and unraveling become core mechanics), and combines that artwork
    with the cultural capital of yet another well-loved Nintendo franchise.


    Viewed in a wider context, this shift to software is part of the normal staged
    development of game platforms, which emerge not with hardware and software all
    at once together (except for some strategic launch titles) but rather in a kind
    of spiraling double helix. No matter how early the SDKs ship, the greatest production
    of software titles has to wait for some testing and familiarity with a new console
    in the actual market—and this is bound to be exaggerated in the case of any truly
    new developments in hardware or controller system, like the motion control introduced
    by Nintendo in 2006. The case of the two *Red Steel* games illustrates this. The
    distance traveled between the first and second games is the story of an upgrade
    to the platform’s technology (Wii MotionPlus) as well as the'
