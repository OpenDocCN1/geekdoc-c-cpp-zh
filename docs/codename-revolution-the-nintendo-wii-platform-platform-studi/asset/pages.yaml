  md: 'The Kinect debut at E3 opened a three-way competition with Nintendo and Sony
    for market share in the motion-control arena. With the radical decision to forego
    controllers altogether, Microsoft moved aggressively into Nintendo''s blue-ocean
    market space, aiming to capture a segment of the new casual demographic. It''s
    as if one of the larger dinosaurs (to use Miyamoto''s metaphor) decided to turn
    tables, and compete in the wider niche that the small and nimble dinosaur had
    been dominating. In the process, Microsoft (along with Sony, perhaps to a less
    significant degree, in terms of its differences from the Wii) has joined Nintendo
    in redefining game platforms for this generation (or, in the case of Xbox and
    PlayStation, half-generation) of consoles. In reaction to the "controller-free"
    rhetoric, for example, both Sony and Nintendo stressed in their presentations
    at E3 that their controllers still had buttons. And when Miyamoto himself came
    out on the stage later in the week to demo The Legend of Zelda: Skyward Sword,
    his two-handed use of the Wii Remote and Nunchuk, to wield both shield and sword
    or a bow and arrow, for the first time looked oddly normal, quaintly like a standard
    video game control system. The context of the mimetic interface revolution had
    shifted.


    While Microsoft took the spotlight at E3 for its new console technology and extravagant
    show, Nintendo shifted its focus to the portable handheld successor to the DSi,
    the 3DS, and a range of new software titles for it and the Wii. Everything about
    Kinect was big, so Nintendo concentrated on the small, while at the same time
    aligning itself to compete with Sony for the claim that it offered a 3D experience,
    except in this case it was without special glasses. Nintendo''s 3DS was in one
    sense an answer to the critics of the Wii''s graphics capability. On the 3.5-inch
    screen, using 3D technology based on a parallax barrier stereoscopic image LCD
    and with a proportionately powerful processor, the 3DS can claim to be a kind
    of mini HD system—HD in your hand. It has two screens, and the lower one is a
