    The real significance of the popular notebooks, in terms of energy efficiency,
    is that they have led to developments such as the Atom processor and Intel''s
    i-series processors, which are designed to give you the highest performance when
    demanding tasks call for it, but relatively lower performance when it''s not necessary.
    Unlike the Atom processor found in notebooks, which basically settles for lower
    performance in order to fit a lightweight form factor, with the added benefit
    of using little power in the process, the i-series processors behave much like
    the Atom processor in the nominal case, yet can increase their clock speed as
    needed for special situations. The i-series processors have found their way into
    successful normal-size notebook computers from just about every manufacturer,
    including Asus, the company that started the netbook trend, and even Apple, which
    has continued to refresh its notebooks to improve the battery life. Overall, a
    larger trend has emerged of computing systems aiming to do more with less power,
    and this has had an echo effect upward, as it were, in the realm of high-end CPU
    design as well.


    Some examples of this larger trend that are especially relevant to a consumer
