    Inside the box, the motherboard’s various integrated circuits include a 512 MB
    NAND-embedded flash memory card and other memory, 88 MB of main memory, and 3
    MB of short-term framebuffer memory, which is used to hold the color values of
    every pixel on the screen, up to 480i, 480p, or 576i (depending on the locale
    of the system), as well as the primary CPU and GPU chipset. Among additional components,
    the console case contains, for instance, the 802.11 B/G WiFi card with two antennae,
    a heat sink structure, and a fan for cooling the board as well as the actual optical
    disc drive and its logic board, divided from the main board by a metal plate.
    Some parts inside the Wii are labeled with a number starting with an RVL prefix,
