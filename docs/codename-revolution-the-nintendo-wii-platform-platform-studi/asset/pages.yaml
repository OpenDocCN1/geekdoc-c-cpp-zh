- pgno: 223
  md: '> > “As a model example of interdisciplinary analysis, *Codename Revolution*
    offers a comprehensive guide to the Wii platform, while providing insights into
    broader interactions between technology, commerce, textual creativity, and cultural
    practices. A must-read not only for game scholars, but for anyone interested in
    contemporary media and culture.”

    > >

    > > —Jason Mittell, Associate Professor of American Studies and Film & Media Culture,
    Middlebury College


    > > “*Codename Revolution* is a remarkable look at the history of the Nintendo
    Wii, at its design, its games, and how it changed our idea of what video gamers
    can be.”

    > >

    > > —Jesper Juul, visiting assistant arts professor, NYU Game Center, author of
    *Half-Real*'
