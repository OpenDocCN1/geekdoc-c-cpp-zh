  md: 'The first time you play, the introductory cutscene begins with a flyover of
    the island from the vantage point inside an airplane, from which you skydive to
    start the game, getting some basic training in the correspondence of your Mii
    to the Wii Remote as you fall. One of the most striking images in this sequence
    is a translucent Wii Remote that’s briefly superimposed over your free-falling
    Mii to make the point that your Mii is essentially a visualization of the coordinate
    position of your controller in your hand, in space, in relation to gravity. The
    image tilts and tips, moving in six different ways as you move the Wii Remote
    with the MotionPlus attached—a literal visualization of the correspondence of
    player motion and in-game action. The remote becomes not just a controller but
    also a material object conjoined to the avatar, and as you manipulate one, you
    manipulate the other. In this skydiving game you aim at clusters of other Miis,
    and link hands with and collect them for a higher score. A skydiving photographer
    appears to snap group pictures when you do, and you can see the pictures at the
    end of the ride. You can encounter and collect a mixture of user-created and Nintendo-provided
    Miis, from those made by your friends and family to, say, a little green alien
    or Mario himself in a skydiving suit and helmet. In your final approach, you have
    to aim accurately in order to fly down through a series of targets formed by other
    skydivers in ring formation, reminiscent of the star-shaped targets in Mario Kart
    Wii, for example. Then the parachutes open in a final brief cutscene, followed
    by the stats and photos.


    After you’ve played this game, however, you always begin down on Wuhu Island,
    with camera shots of Miis at various locations, and their recent game stats in
    a horizontal crawl displayed beneath them. There’s a button to select instructional
    videos on connecting and disconnecting the MotionPlus and Nunchuk, and recalibrating
    the MotionPlus when it gets out of sync. Initially, the system has to be told
    whether your sensor bar is above or below the television set in order to calculate
    the angle at which you’re pointing. As with the first version of the controller,
    resyncing is sometimes necessary: you put the Wii Remote upside down on a flat
    surface, such as a table or the floor, and the system ticks off ten seconds as
    it recalibrates the starting position and the supersensor and level of the accelerometer.
    Radio frequency wireless signals as well as changes in temperature can interfere
    with and throw off the calibration. Once again, a fairly complicated system is
    required to create the illusion of an intuitive interaction with the game.


    The games repeated from Wii Sports offer improved motion tracking, including the
    ability to see whether your golf club addresses the tee-up ball at an angle, for
    instance, or how your wrist is twisted while bowling.'
