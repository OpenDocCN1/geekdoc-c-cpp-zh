  md: 'Wii Remote) that training is unnecessary. Another response, as seen in *Wii
    Sports Resort*, has been to build in various carefully designed tutorials and
    helpers, some popping up during gameplay. Though many games offer such materials
    in a limited way, Wii games obviously must make a special concerted effort in
    this regard, and often as a result, learning to use the controls becomes part
    of the gameplay itself, in a Wii-specific variation on what Alexander Galloway
    has called “nondiegetic operator acts”—configuration actions such as a setting
    up, or pauses in which a game world hangs suspended.²² Close to the system’s launch,
    proof-of-concept titles for a new platform like the Wii necessarily push such
    acts further into the foreground of normal gameplay, or what players actually
    spend their time doing as they interact with a system.


    Just to cite one example from a classic Nintendo franchise: development *The Legend
    of Zelda: Twilight Princess* in its ported form for the Wii was well under way
    when Miyamoto interceded to insist that the traditional first day in a training
    village—where you explore and learn how game mechanics work, such as how to use
    the control system to control your avatar, Link, to navigate, talk to NPCs, find
    jewels, and so on—should be expanded to three full days in order to give Wii players
    more time to get used to the game and practice with the controls.²³ This seemed
    necessary, no doubt, for the two related reasons that Wii players, defined as
    casual gamers, would be statistically less likely to be familiar with the game
    world and gameplay of a game like Zelda, and because the Wii controller itself
    was new and different for any player who encountered it. So the developers increased
    the time spent (marked by scale-model periods of sunrise to sunset) in the first
    village by a factor of three.


    In the same franchise, *Link’s Crossbow Training* was released in 2007, packaged
    with a white, curved, molded-plastic peripheral shell that allows the Wiimote
    and Nunchuck to be clicked into place to serve as the barrel and a stock with
    a trigger of a stylized rifle (or crossbow). In an apparent homage to the 1980s
    light gun, it was named the Zapper. In fact, the game was first titled *Introduction
    to Wii Zapper*, and it’s essentially a simple and relatively brief shooting-gallery
    style FPS game based on the maps and enemies of *Twilight Princess*, in which
    you complete levels by shooting at targets and enemies. Nintendo’s Web site advertises
    the game in a straightforward way as training for the new controller(s): “After
    a few rounds of *Link’s Crossbow Training*, players will be more than ready to
    pick up any of the future Wii Zapper titles, like *Medal of Honor Heroes 2*, *Ghost
    Squad* and *Resident Evil: The Umbrella Chronicles*.”²⁴ Though it’s explicitly
    couched as training for the Zapper, to some extent the game also trains players
    to interact with the world of *Twilight Princess* in particular and the Zelda
    universe in general from the perspective of the Wii control system.'
