  img_proc: true
- pgno: 180
  md: 'In making the decision to remove the gadgets, the controllers, from the player,
    the Kinect developers had to sacrifice certain affordances, not only the data
    provided by the accelerometers—which are replaced (with a slight lag, in our experience
    with the release titles) by image-captured data—but also the immediate responsiveness
    of digital input—such as the on/off/shoot/release signals provided by buttons.
    Like the Kinect, the Wii also makes use of a gestural interface. You just gesture
    with a controller in your hand, and this offers certain advantages. As Chris Kohler
    observes,


    > > “When you press a button on a standard controller, it sends a very clear signal.
    A switch is flipped; a zero becomes a one. Kinect doesn’t possess this ability.
    All it has is fuzzy analog input.”^27^


    Bowling in *Kinect Sports* presents the same problem. The Wii version of bowling
    is markedly superior for one reason—you hold down a button when you’re holding
    the ball, and release it to let it go. The accelerometer does the fuzzy stuff,
    tracking the swing of your arm, but the button reports when, exactly, you release
    the ball.^28^


    Every system has its unique constraints as well as affordances. Our point is simply
    that the rhetoric of total immersion through “controller-free” gaming in the case
    of Kinect masks certain practical trade-offs. Despite the marketing, the Kinect
    and the Wii have much in common. (They are in some ways structurally inverted
    versions of one another, as we have shown.) Yet Kinect’s move to exit the gadgets
    not only comes at a certain cost, it also sheds light on the importance of gadgets
    in the Wii’s case—that is, on the significance of the network of interrelated
    control devices. A gadget is something you handle, something you with which you
    engage.^29^ These devices are objects in their own right, or components in the
    larger system, that shape and mediate the player’s experience of the system as
    a whole.


    By contrast, the symbolism at the E3 Kinect pageant was focused on erasing those
    mediating devices, dismissed as mere gadgets and gizmos, as if to play to an imagined
    nontechnical consumer. As the voice-over announcer said,


    > > “History is about to be rewritten. . . . Human beings will be at the center,
    and the machine will be the one that adapts. Might the next step be an absence
    of an object?”


    The absence of an object literally meant the absence of a controller, pad, or
    joystick or remote, but because of the dramatic way it was worded, it had a more
    sweeping, philosophical ring to it: the absence of an object implies a total,
    sublime domination by the subject (“it’s all about you”), or the dominance of
    subjectivity itself, which is one version of the old dream of total immersion.^30^'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'Kinect’s version of the mimetic interface, rather than merely shifting attention
    to physical player space (the living room), as the Wii can be said to do, imagines
    the subsuming of player space into a kind of immaterial game space—a game space
    as cyberspace—through erasing the object and making the player, as subject, one
    with the game’s representations. Instead of the game leaking out into your living
    room, you’re sucked into the virtual space behind the screen. But when it comes
    to the notion of cyberspace, even Gibson has in more recent work had his characters
    observe that nowadays, cyberspace seems to be “everting”—meaning that it’s turning
    inside out and spreading into the world.”³ As it does so, its “inwards” are inevitably
    exposed; the scaffolding of its infrastructure are bared.


    The Wii, it seems to us, has participated in this trend by in effect opting out
    of the drive for total immersion.³² It assumes that gaming is less about cyberspace
    than it is about cybernetics—in Norbert Wiener’s sense, based on mechanisms and
    devices providing control and feedback—which has a long history in relation to
    video games.³³ Steven Poole, for example, makes the connection to cybernetics
    and explains that “the perfect video game ‘feel’ requires the ever-increasing
    imaginative and physical involvement of the player to stop somewhere short of
    full bodily immersion. After all, a sense of pleasurable control implies some
    modicum of separation: you are apart from what you are controlling.”³⁴


    Poole’s point implies that to design a platform for “pleasurable control” requires
    a focused attention on the separation—the space between the player and the game—a
    space of possibilities for interesting mediations. This is basically the same
    assertion that we have made throughout the book about the importance of “adequate
    space” for Wii game play, as seen for example in chapter 4’s discussion of the
    Balan Board’s exploiting the active periphery of gameplay, and is in keeping with
    the larger argument that Katie Salen and Eric Zimmerman make against the dominance
    of the “immersive fallacy” in game design—the idea that the whole purpose of video
    games is to “transport a player into an illusory reality” or “an imaginary world.”
    Salen and Zimmerman challenge game designers to give up “pining for immersion,”
    for that total transcendence that “will only evolve . . . when the technology
    arrives.” Instead, they say, designers of games should take seriously the more
    common gamer’s experience of a “hybrid consciousness”—a fluid moving from states
    of immersion, to “deep engagement” with game mechanics, to full awareness of “the
    space outside the magic circle.” Gaming, we think, is indeed all about that movement,
    in and out of the game and the physical room, the magic circle and its outer perimeter,
    the action at the periphery of game space.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Writing a couple of years before the Wii appeared, Salen and Zimmerman suggest
    that such a shift in attention by designers—a shift from “pining for immersion,”
    to encouraging multilayered and (therefore) deep engagement—might help games reach
    a more “diverse mass audience,” or all those potential gamers and more casual
    gamers who have little or no interest in the romantic dream of total immersion
    in a cyberspatial game world, but who would just like to play, and for whom play
    involves playing with the platform, not expecting it to disappear.^36 As we have
    been arguing throughout this book, platform is a social phenomenon. Its meaning
    is determined by ideas along with social and cultural contexts as much as by abstract
    principles of engineering and design. Watching the Kinect E3 2010 show, it was
    hard not to think of that box, rotatable main stage as a giant television set
    turned into a single magic portal to cyberspace, an instance of what the romantic
    poet John Keats called “magic casements, opening on . . . faery lands, forlorn,”
    the subjective end point of an interface about which no one has to be self-conscious
    because it is an extension of consciousness itself (“Might the next step be an
    absence of an object?”).^37 The marketing of Kinect highlights, by contrast, how
    “object oriented” Nintendo’s version of the mimetic interface is—how the experience
    of playing Wii games involves increased attention to the mediating role played
    by the various controllers that are all parts of the system.^38


    The design ethos behind the Wii is not focused so much on the unique properties
    of the Wii Remote, Nunchuk, Balance Board, or other component objects. Nor is
    it all about an idealized and unencumbered player as the controlling subject.
    Instead, it’s focused more on making possible engaging events in the space between
    the user and the game, via the mediating material objects with which the player
    is directly engaged. As a system, the Wii is designed not to elide or conceal
    but rather to call attention to the player’s interactions with objects of various
    kinds—hardware and software, in the hand and on the screen, Mii avatars as well
    as weapons, balls, and vehicles, stored in the console or beamed to the living
    room as services. As a platform, the Wii more often than not focuses attention
    on the charged relationship between subject and object, the repeated material
    transactions between player and game—transactions that are mediated by technology
    (gadgets—that is, peripherals and components), but that always take place in the
    context of the social spaces of living room and the wider culture. In that sense,
    the Wii makes player space itself an important object of (and in) the system.


    As the emergence of the Wii and its recent competition has demonstrated, there
    are multiple possible vectors for the evolution of game'
  merge: -1
  img_proc: true
- pgno: 183
  md: platforms going forward. Different permutations of components offer varying
    affordances and constraints that shape the possibilities, and the possibilities
    include greater or lesser emphasis on the social contexts for gameplay. In all
    gaming systems, regardless of the components, and how they are arranged or connected,
    in the end the most important thing is the kind of (social) interaction they afford,
    as we have contended. Almost every new technology these days is described as revolutionary.
    But in bringing the social nature of game platforms to the center of the discussion,
    the Wii has lived up to its codename.
