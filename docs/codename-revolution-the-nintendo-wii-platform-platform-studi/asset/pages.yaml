    This kind of design solution—deliberately limiting the data density, by limiting
    textures and surfaces that must be animated in the game’s simulation, for example—has
    been Miyamoto’s (and Nintendo’s) strong suit for decades. Ultimately, as we suggested
    in the introduction, it goes back to the eight-bit era, when he created Jumpman,
    who became Mr. Video, who became Mario, with all his particular features meant
    for easy animating. It was an impressive design trick, to make a convincing character
    out of an eight-bit sprite. Nintendo’s design ethos is still one of making something
    creatively compelling out of a limited palette of story and graphic elements.
    In the two recent *Super Mario Galaxy* games for the Wii (2007 and 2010), the
    hero is 3-D, and the 3-D environment (with their often-absurdly playful physics)
    are impressively designed, but still cartoons. The tradition persists in details
    such as the way that most grass on the planetoids that Mario explores is deliberately
    drawn and textured to look like bright plastic Astroturf instead of realistic
    organic vegetation. The stylized aesthetic of Nintendo’s classic franchises is
    perfectly suited to the graphics-challenged configuration of the Wii and its standard
    definition images.


    Comic artist and theorist Scott McCloud argues that cartoon abstraction causes
    the viewer to identify with the abstracted iconic image, to imagine oneself in
    the mask of the simplified cartoon character. This device, he says, is part of
    the traditional “national style” of manga (and anime) in Japan, making up “a long,
    rich history of iconic characters,” thanks to the “seminal influence” of pioneer
    Osamu Tezuka, the creator of the classic manga *Astro Boy*, with its oddly proportioned,
    glossy-bodied hero.¹⁵ It’s no accident that Tezuka is an acknowledged influence
    on Miyamoto. Video game critic Chris Kohler cites McCloud’s contention along with
    that of game historian J. C. Herz, who reminds us that this deliberately abstract
    manga style of drawing characters “translated easily into early video games, which
    didn’t have the graphic resolution to represent characters with adult proportions.
    Small, stylized characters had fewer pixels per inch and were easier to use, and
    so video games borrowed, for reasons of expediency, what manga had developed as
    a matter of convention.”¹⁶ The stylized aesthetic of the Wii contains rich cultural
    allusions to all these conventional Japanese objects—manga, anime, and Kokeshi
    dolls—but it also grows out of earlier video game art and Nintendo’s own history
    of video game design. The point is that it’s not only a design aesthetic or marketing
    decision based on consistent “branding.” It’s also a practical move that makes
    sense “for reasons of expediency” given the technical limitations of the system
    on which the designs will be displayed. It bears repeating that this is not a
    one-way relationship. The platforms'
