  md: 'object, the “game itself”? Where does that game itself begin and end, anyway?
    With what’s on the screen? Or in the code that users don’t see? What about updates
    received online after purchase or expansion packs? Paratext is a shifting and
    uncertain threshold, a dynamic and often concealed border. We believe, though,
    that it’s where things get interesting, because it’s where the meanings of games
    are made.


    The point is not to force the term paratext to fit the case of video games in
    any precise or rigorous way. Still, we contend that Genette’s concept offers a
    way to think about how the value and meaning of video games can’t be restricted
    to just one layer of signification, analogous to the “text itself,” whether that’s
    the ROM, the code, what can be seen on the screen, or some other rigid idea of
    the game itself. The meaning of video games is made, constructed socially, at
    the places where the game crosses boundaries of hardware, software, and unpredictable
    player interactions, but most of all by repeated acts of play—which means that
    other, epitextual activities (those outside the game itself) always figure in,
    activities out in social space. Fans know this, whether or not they think about
    it in these theoretical terms. They inhabit a social space built from and around
    the cultural expressions they love, an ever-expanding series of thresholds, ripples
    spreading out from a cultural object or its franchise, its “universe.”


    A successful game or platform spawns its own “wider culture,” extrudes its own
    paratext as it makes its way through the world. Paratext is an inherently cultural
    and social phenomenon. It’s a series of transactions between creative works and
    the people who receive it, among multiple such people, across groups and institutions.
    All games and game platforms are social in this sense: they’re designed to provoke
    those social transactions—starting with somebody actually playing the game, in
    the living room (or wherever), but including, potentially, other people watching
    and commenting on the gameplay as well as paratextual objects that prepare and
    extend those transactions—collectibles, coffee-table art books, blog reviews,
    and discussion boards, and also hacks, mods, machinima, and gameplay videos. That’s
    what we’re watching in the video with which this chapter began of the group of
    friends playing *Wii Sports* in an empty movie theater: paratext at work, the
    ongoing reception of the Wii as a social platform.


    In his now-famous talk at the Design, Innovate, Communicate, Entertain summit
    in 2010, designer and former Disney imagineer Jesse Schell described a trend:
    that games and other media were everywhere “busting through to reality.” For him,
    this is a phenomenon that includes the Wii but culminates in online social games
    like *FarmVille*, which are'
