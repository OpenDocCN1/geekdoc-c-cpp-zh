  md: '# Degrees of Openness


    In common parlance, a platform is something you build on. Rather than a completed
    structure in its own right, it provides a base or foundation on which other people
    can build. But the openness of platforms to being built on varies widely. An active,
    commercially viable video game console system in a competitive environment is
    not designed to be an open platform. Quite the contrary: it’s the very definition
    of a proprietary platform, a dedicated entertainment system. In the terms used
    by Jonathan Zittrain, a video game console is a consumer “information appliance”—like
    a mobile phone, MP3 player, or DVR—designed to offer a controlled, consistent
    experience, as opposed to a traditional PC, which is a platform “open to a set
    of offerings from anyone who wants[s] to code for it.” Zittrain’s argument is
    that the latter kind of platform is a “generative” one, since people build unanticipated
    edifices on it. It invites audience contributions, as opposed to a more closed,
    “appliance”-like platform such as Apple’s iPhone or iPad—or any video game console.
    His point is that the “nongenerative” kind of platform is these days in the ascendancy
    and threatens to dominate people’s uses of the Internet, and that the whole sphere
    of networked electronic devices is becoming increasingly “appliancified.”


    When Apple released the iPad in 2010, activist and author Cory Doctorow posted
    a blog entry in opposition to the tablet device and general model of closed consumer
    devices. In it, he quotes the Maker’s Manifesto: “If you can’t open it, you don’t
    own it. Screws not glue.” He contrasts the new touchscreen device with the Apple
    II, which “came with schematics for the circuit boards, and birthed a generation
    of hardware and software hackers who upended the world for the better.” The ideal
    user of an iPad, Doctorow says, is just a “consumer,” and you don’t tinker with
    or improve your iPad; you improve it only by buying apps.


    In response to similar criticisms and sparked especially by the controversial
    decision not to include Adobe’s Flash in the iPad support, Steve Jobs said that
    the increasing majority of users do not want or need a programmer’s or hacker’s
    kind of access to the system, particularly at the expense of security and a reliable
    online experience. He compared PCs to trucks—utility vehicles for mostly professional
    drivers—and devices like the iPad to cars—more attractive and comfortable to drive,
    with features such as the automatic transmission aimed at consumers.? What he
    didn’t add is that like the iPad, today’s cars tend to be “attractively styled,”
    but have “their innards hermetically sealed,” relying on onboard and external
    computers for diagnosis and repair as well as functions such as assisted'
