    In an interview posted on Nintendo’s Web site, Kenichiro Ashida, of the Integrated
    Research and Development Division, explains his own shift from hard-core to more
    casual gamer as he got older, had a family, and had less time to play traditional
    games. His sense that the traditional multibutton joypad had reached the limits
    of its design in his view accompanied a kind of division between his receptor
    self and player self. The traditional controller and the style of gaming it represented
    had come to seem incompatible with his life, and it was this that finally brought
    home to him the need for change, convincing Ashida that “it might be time to reconsider
    the entire gameplay style of grasping the controller with two hands, sitting glued
    to the TV until morning.” In response, Miyamoto, laughing, recalled his own hard-core
    resistance to giving up that paradigm, confessing that ten years before he had
    said, “People who want to play Mario with one hand needn’t play at all!” 34 Ashida,
    however, speaks for the massive demographic that Nintendo has successfully tapped
    into with the Wii, as Miyamoto came to understand. Over ten years later, many
    people are playing Mario on the Wii, of course, often using two hands (the Nunchuk
    plus the Wii Remote, or the Wii Remote turned sideways like an NES controller).


    Other games have been developed that use only the Wii Remote, but more significantly,
    the one-handed controller that looks like a television remote has become an icon
    that stands for “Wii” (even the lowercase, sans serif i’s in the logo look like
    two Wii Remotes, and some advertising prints them that way). The little white
    rectangle is in the end a symbol of the desire for a more casual mode of gaming,
    or a kind of material synecdoche, the part that stands for the whole, of the Revolution
    console. In the next'
