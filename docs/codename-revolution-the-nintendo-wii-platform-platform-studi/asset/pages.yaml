    rearranging that are typical of such gardening.


    Newly created Miis start out on the Mii Plaza, a radiating grid of gray and white
    paving stones where all the Miis made on your system gather and stand or walk
    around making small gestures, as if to remind you that they are in fact animated.
    They may talk to one another (as signified by Sims-like or chat-space word bubbles
    above their heads with tics appearing in them in place of text). Sometimes they
    doze off. All the while, cheerful orchestral music plays in a loop. The Miis can
    be rearranged and sorted in various ways using the whistle icon. When not in use,
    the heads-up icons disappear so that the Miis moving around on the Mii Plaza fill
    the screen. You can grab the Miis, by pointing and using both the A and B buttons
    of the Wii Remote, for closeup viewing or to edit their features, mail them to
    other users, or transfer them to a Wii Remote’s onboard memory (each controller
    can hold up to ten) so that they can be physically carried to another Wii. As
    you continue to use the system over time with WiiConnect24 turned on, any number
    of Miis made by other users can visit your Mii Plaza, and your Miis can show up
    on other users’ Wiis anywhere in the world, assuming each of you has adjusted
