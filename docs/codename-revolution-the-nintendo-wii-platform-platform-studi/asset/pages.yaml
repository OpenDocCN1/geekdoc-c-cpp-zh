  md: 'This is what Will Wright means when he says that the Wii takes advantage of
    “an instinctually mapped bandwidth,” and that it’s all about “non-immersive gaming.”


    > We used to think of, like, the best games are the most immersive. I really did
    in . . . I live in the monitor. The world around me ceases to exist as I’m playing
    the game . . . immersive gaming. When you think about the Wii, you know, you’re
    sitting in a room with your friends playing the Wii. Most of the entertainment
    is not happening on the screen. So basically you’re breaking away from this idea
    of an immersive game.^34^


    Unwittingly anticipating the key feature of the still-to-come 3DS, Wright goes
    on to observe that mobile gaming is moving in the direction of augmented reality,
    and that it’s “the intersection of the real world and the virtual world that gets
    really interesting.”^35^ Gingold recognizes that Wright’s own games—*The Sims*
    in particular, at the time that Gingold was writing—“use the interplay of micro/macro
    to map the player into the simulation and encourage participation.”^36^ This is
    a useful way to understand the key affordance of the Wii Remote and Balance Board:
    as enabling the scalar mapping of the player’s reactions into the game world,
    from small twitches to larger whole-body movements, twisting a wrist or rotating
    hips, leaning forward, lunging into a virtual enemy, or jogging in place. In this
    way, the Wii encourages a physical play in excess of what is strictly required
    by the control system, or a form of play that’s close to childlike make-believe
    (playing “swordfight” or “jogging”).^37^


    On the surface, this seems to be the way that Microsoft’s Kinect works as well.
    But in fact, in our own experience playing games on the system, it offers a fundamentally
    different kind of mimetic interface. It proudly does away with peripherals (like
    the Balance Board) and captures player movement in order to try to make the room
    disappear in the player’s consciousness, to pull the player all the way into the
    game world, using motion control to produce a new version of that old ideal: a
    sense of total immersion. The Wii, by contrast, as a result of its “lateral thinking
    with seasoned technology,” is more self-conscious, sometimes awkwardly so, about
    the role of its peripheral objects. As a platform, its gameplay is dependent on
    the controllers, focusing the user’s attention on the peripherals and what one
    does with them—which is to say again that it shifts attention to the platform’s
    periphery, the boundary where the body meets the system’s various devices.'
