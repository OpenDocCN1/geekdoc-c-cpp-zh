    booth and then aims at the front of the theater, where the Wii Bowling alley fills
    the almost-thirty-foot screen (a caption reports the dimensions). People stand
    on the stage and bowl as their friends’ cheers blend with those of the in-game
    Mii audience and the game’s sound effects, piped over the theater’s sound system.
    The friends run through various sports as the video shows them playing Wii Tennis
    from out in the aisles or within rows of red velvet seats, and Wii Golf from the
    stage, chatting and joking as if they were playing in their living room. Their
    life-size shadows show up on the screen, of course, looming between them and the
    now-towering Mii avatars. They end with a round of Wii boxing, one of them playing
    up close, right on the stage, and one out in the aisle. The digital projector
    light glows, high above in the back of the theater.


