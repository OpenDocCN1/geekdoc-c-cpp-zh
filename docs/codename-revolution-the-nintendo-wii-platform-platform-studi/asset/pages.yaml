  md: '+   35. Katie Salen and Eric Zimmerman, *Rules of Play: Game Design Fundamentals*
    (Cambridge, MA: MIT Press, 2004), 458, 451, 455.


    +   36. Ibid., 455.


    +   37. John Keats, “Ode to a Nightingale,” in *John Keats: Complete Poems*, ed.
    Jack Stillinger (Cambridge, MA: Belknap Press of Harvard University Press, 1982),
    279.


    +   38. We use the term object oriented only as a reminder of the questions that
    surround the relationship of the user to hardware and software components. In
    this light, see Ian Bogost’s recent philosophical work on object-oriented ontology,
    a succinct public statement of which is available at http://www.bogost.com/blog/what_is_objectoriented_ontology.shtml.
    Bogost has said that he views platform studies as a kind of “applied” instance
    of this philosophical project (see http://www.bogost.com/blog/i_prefer_not_to.shtml).
    As should be clear from our discussions in this book, our view is generally consonant
    with this perspective, except perhaps that our focus remains more relational,
    more about the roles of players and objects in the inter-relational space they
    co-define, where players meet platforms (as objects and constellations of objects)
    and engage with them. Interestingly, this way of viewing game systems finds an
    echo in theories of (social) network analysis (see David Easley and Jon Kleinberg,
    *Networks, Crowds, and Markets: Reasoning about a Highly Connected World* [Cambridge:
    Cambridge University Press, 2010]), where the usefulness of the network at least
    in part is about the formation of ties—in this case, ties between players, nonplayers,
    and the system components themselves, which can all be viewed as a network or
    graph in computer science terms.'
