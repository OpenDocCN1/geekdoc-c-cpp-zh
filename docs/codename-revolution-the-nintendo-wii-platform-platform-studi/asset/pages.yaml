    Historically, total immersion in this sense has never had all that much to do
    with actual, thriving gameplay, not even, most of the time, in most persistent-world
    MMOs. Yes, the decade before 2006 for the big-budget game industry was consumed
    with developing highly immersive and realistic graphics for more detailed and
    lavishly rendered game worlds. But even in triple-A titles for the major consoles
    before 2006, in most cases conventions and features like the heads-up display,
    not to mention backchat over headsets or Byzantine LAN party configurations, all
    the often highly social activities of fans surrounding game play, gave away the
    truth: gaming has never been entirely about total immersion. Actual gameplay is
    an impure, mixed, borderline activity. Its pleasures include talking to friends
    in the room while you play—snacking and a brushing button combinations from the
    couch.²⁴ It’s not in the end about suspending disbelief and fantasizing about
    being, say, a cybernetic supersoldier on a distant artificial ring world. It is
    not at all clear that gamers, as a group, have ever been motivated primarily by
    the desire to be totally immersed in a kind of realistic out-of-body experience—as
    opposed to being meaningfully engaged at the interface, which has historically
    been constituted by peripherals and controllers.


    Nonetheless, the desire for total immersion seems to have been assumed in the
    marketing of Kinect. Its sensors and cameras work by capturing and mapping the
    living room the way that certain security systems do, rendering it as a field,
    the disturbances of which can be detected as bodies in motion. In this sense,
    it turns your living room into the game space in a much more literal way than
    the Wii’s motion-control system does. Kinect interprets the goal of the gestural
    interface as pointing to increasing dematerialization, as allowing for pure gestures
    with the unencumbered body, so, somewhat counter-intuitively, it has to incorporate
    the player’s body in its interface. When the Wii Fit robotic voice says “measuring,”
    and a wire-frame Mii figure gets “scanned,” it’s just a visual fiction, a metaphor.
    You’re actually standing on a Balance Board being weighed (and your center of
    balance is being determined) while your data are being scanned and matched up
    to those measurements. But when Kinect sets up a new account, or produces an avatar
    for its sports or fitness games, it really does perform a full body scan with
    its cameras, graphing the key forty-eight joints of your body—in many ways a much
    more thorough scan than what the Transportation Security Administration uses for
    airport security, including using sensors to measure how far from the'
