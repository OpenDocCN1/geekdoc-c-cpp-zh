  md: 'segmentation and gender stereotyping actually matter less in selling the Wii
    console than penetration into the homes of casual gamers, into the imagined space
    of the living room, by whatever means.


    At any rate, there’s good reason to try to sell the console to women. Starting
    a year after the release of the Wii, the company’s own documents have repeatedly
    pointed to high in-house statistics showing that over 50 percent of gamers using
    the DS and the Wii are now female.¹³ The case of games and gender is just one
    way in which the Wii exemplifies the connections between platform technology and
    cultural and economic factors. Nintendo’s niche marketing strategy based on certain
    assumptions about gender and the domestic space in which games are played led
    to certain design decisions. Those decisions about platform technology have in
    turn both constrained and enabled specific features of the technology and expressive
    works—the games created for the platform. And then the games have had an effect
    on the larger culture.


    This view of platform and culture as deeply interrelated holds true historically
    for other media, of course, including print media, as we mentioned in the introduction.
    Books are a sophisticated form of technology for delivering texts, a set of platforms
    for cultural expression and communication. Since the fifteenth century, this has
    involved the technology of the printing press, including movable type, and later
    forms of typesetting, formes and frames for holding the type, and machines for
    pressing the image of that type on to sheets of paper, which then could be folded,
    cut, and bound into books. The discipline of book history studies print technology,
    but it also has to pay attention to the means of distributing the printed objects
    that it produces, the social institutions of copyright law, publishers, printers,
    sellers, libraries, monasteries, private collections, ways of getting books into
    the hands of readers or collectors, patronage, subscription, and (later) commercial
    marketing. The cultural contexts of particular readers completes the picture,
    including their social class, gender, level of education, tastes, and assumptions
    about the medium of print—what it can provide for them in the way of “cultural
    capital” or social status, say, as well as the contents of the books they read
    along with the knowledge and pleasure that books offer.


    A video game platform like the Wii demands a comparable level of attention. If
    we want to understand it, we need to study the technology of the platform itself,
    but also the effects of the technology on the games produced for the platform.
    And the market for these games and the platform is more than an external economic
    consideration. It is a partly projected and partly measurable demographic reality,
    which is part of the larger system of expression that the platform creates—the
    outer edge of'
