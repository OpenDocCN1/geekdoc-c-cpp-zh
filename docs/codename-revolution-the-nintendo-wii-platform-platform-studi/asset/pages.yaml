- pgno: 19
  md: 'immersive game spaces, and toward the player’s physical and psychological experience
    of gameplay. The Wii’s cultural influence didn’t stem from the motion-sensitive
    controllers alone. It also depended on the foundation of Nintendo’s reputation
    and software catalog, which includes some of the most beloved franchises in history
    and carries a good deal of cultural capital among so-called core gamers. Smaller,
    less expensive, innovative, accessible, casual, family-friendly, classic, revolutionary,
    and fun—all of these descriptors have been successfully associated with the Wii
    by Nintendo marketing, and echoes of that marketing in the press and wider culture.
    To study the Wii as a platform requires us to pay attention to the links between
    system design, framing, and cultural response.


    # Our Approach


    In general, we’ve approached the writing of this book from the perspectives of
    our different academic disciplines: textual studies and computer science. One
    of us is an English professor who studies the material texts of literary works—for
    example, how manuscripts, print technologies, and publishing all work together
    as a system to afford and constrain the meaning of poetic texts. The study of
    material texts and game studies have begun to combine in volatile and interesting
    ways in the past two decades, thanks to the catalyst of digital media. So as a
    textual studies scholar, Jones found himself teaching and studying electronic
    texts and new media, and presenting papers at digital humanities conferences,
    where he heard compelling presentations by theorists of video games and new media.
    In that context, Jones came to write a book in 2008 on the relation of textual
    studies to video games, and extending that work led him to the present book.^18


    The other one of us, Thiruvathukal, is a computer science professor whose interests
    are in high-performance computing, but also more recently, distributed systems
    and pervasive computing—a space dominated by low-powered devices. He sees systems
    as the anatomy and physiology of platforms, and is intrigued by applications of
    computing to culture—including computing history, digital humanities, gaming,
    and environmental science. That’s how Thiruvathukal came to coauthor the present
    book.


    Together we codirect a university Center for Textual Studies and Digital Humanities
    that supports interdisciplinary research and education at the intersection of
    computing, the humanities, and social sciences—English, history, art, communication,
    new media, sociology, and library and information science. The center supports
    a variety of computing'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'applications and humanities projects, including ways to create new digital
    environments for the collaborative editing and publishing of texts and images,
    from modernist novels to nineteenth-century political cartoons. The whole point
    of digital humanities work, as the term implies, is to bring computer science
    and information technology together with the objects of humanities research—books,
    manuscripts, artworks, photographs, prints, artifacts, records, and electronic
    data; in other words, to connect computing with culture. That’s essentially the
    same method and perspective we bring to this book. In this case, the research
    object is the Wii as a platform—which includes the console, Wii Remote, Nunchuk,
    Balance Board, firmware and operating system (OS) system software, and disc or
    downloaded game software as well as the culture of the commercial video game business,
    for example, along with the larger phenomena of casual gaming and popular understandings
    of what video game systems are and might become.


    Both of us have been around long enough so that we played video games in the heyday
    of the arcades as well as the early home console and PC eras. We’ve owned many
    game systems over the years and currently, between us, own consoles by all three
    major current competitors. But in truth, until we began researching them in recent
    years, we both found ourselves playing games less and less, since like many in
    our demographic group we’ve discovered that having children and academic jobs
    has made it increasingly less likely that we have time and energy for extended
    bouts of gaming. So in our own lives, we’re part of the larger cultural shift
    associated with the Wii—the rise of casual gaming. For pleasure and research,
    we now play games on our mobile devices, phones, and tablets as much as or more
    than we do on home consoles. The truth is that we’re both mostly casual gamers.
    But we still take seriously the study of video games, which we agree are one of
    today’s most pervasive and significant forms of expressive culture.


    We take games seriously as objects of attention even when the games themselves
    are intentionally self-mocking. When we were writing chapter 5, on channels of
    access, distribution, and transmission on the Wii, we found that the then-new
    *WarioWare D.I.Y.* game for the DS had taken the series’ self-referential humor
    about making and selling games to new levels (in more than one sense). It’s a
    game about making games, or in this case the five-second microgames for which
    the series is famous. So we used the tutorials, played around with the built-in
    editor, and made some microgames of our own, starting with one called Make Room!!!,
    in which you have to tap or click to move a coffee table out of the way to provide
    what the *Wii Operations Manual* calls “adequate space” for gameplay. The idea
    for'
