    # Homebrew Channel: The Platform’s Edge


    Finally, even further outside official channels for the platform is the Homebrew
    Channel. It is not a legitimate Nintendo service but instead a special kind of
    exploit in which an “unlocked” Wii console can in effect create a pirate channel
    in the Channels menu for loading unauthorized applications built from user-generated
    code, so that users can run unlicensed games and other software on the platform.
    Nintendo updates to the system, provided automatically via WiiConnect24, block
    this channel, of course. The Homebrew Channel is essentially a rogue clone of
    the official Wii Channels, and it includes emulators for other platforms, somewhat
    like the Virtual Console. After “jailbreaking” the Wii, Homebrew users download
    and install a .WAD file (a game file format descended originally from DOOM and
    reportedly meaning “where''s all the data?”),³² an archive to create a channel
    much like the official ones. From that new channel with its own GUI, users can
    see listed and launch their own or other users’ Homebrew applications from an
    SD card or USB drive.


    The Wii Homebrew Web site claims that the Channel also allows for applications
    to be launched via TCP or a USBGecko device from a PC.³² Indeed, this site and
    others like it remind us that the Homebrew Channel is itself the manifestation
    of a larger network of fans, hobbyists, hackers, and modders, who make use of
    deliberately “broken” Wiis to piggyback their own version of the Wii platform
    on Nintendo’s official and legal version. In this way, even a closed proprietary
    platform can always be pried open.


    That even a tightly controlled and dedicated computing platform like the Wii,
