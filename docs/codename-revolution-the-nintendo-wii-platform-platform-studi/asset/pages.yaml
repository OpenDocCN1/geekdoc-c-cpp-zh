- pgno: 40
  md: 'perhaps to invoke comparison with Apple''s iconic first iPods. When the console
    is standing vertically (it''s designed to work either this way or lying horizontally—yet
    only in these two positions, because the DVD-ROM drive requires gravity to keep
    the DVD in place), the slant of the base visually exaggerates the front height
    and perspective lines. This design gives the box a sense of dramatic sweep, despite
    its small size (figure 2.1). Its overall “emotional design,” however, seems to
    be calculated to invoke an affective response associated with simple fun. As design
    theorist Donald Norman has argued, this response is not only appealing to users
    but also may cause them to forgive the limitations of the console, since research
    shows that “someone who is relaxed, happy, in a pleasant mood, is more creative,
    more able to overlook and cope with minor problems with a device—especially if
    it’s fun to work with.” He cites as an example a reviewer of the Mini Cooper who
    advised his readers to overlook the car’s faults “because it was so much fun.”³
    The Wii only invokes a feeling of simplicity, though. The Wii, like other computing
    devices, is actually a relatively complex system.


