- pgno: 47
  md: 'Much more significant than raw numbers that measure graphics-rendering capabilities
    or processor clock speed is what software designers can do within the limits of
    a given system. Yet what software designers do is frequently affected by general
    perceptions, the market, and the technical specifications of the competing platforms.
    The determining connections between cultural and social factors and hardware or
    software decisions are in this way often indirect, highly mediated, and sometimes
    circular: projected expectations drive design, which in turn creates expectations
    that are fulfilled in later design cycles, and so on.


    Consider the simple question of which games are developed and selected for release
    with a new system. Many of the first-generation games produced for the Wii were
    effectively ports or adaptations of games originally developed for the GameCube.
    In these cases Wii-specific functions were added, especially when it came to using
    the motion-sensitive Wii Remote controller, but usually without fundamentally
    altering the gameplay. *Wii Sports*, *Wii Sports Resort*, and *Wii Fit Plus* games,
    on the other hand, were developed from scratch entirely for the Wii, and so their
    creators were able to calibrate the design to the system’s particular limitations.
    The sports games are highly abstract simulations that make use of selective features
    of game physics. *Wii Sports* consists of five sports simulations with Miis as
    player characters as well as NPCs.


    With the sequel, *Wii Sports Resort*, however, user feedback and other data led
    to motion control being greatly enhanced, rendered more precise, thanks to the
    MotionPlus add-on (which we’ll discuss further in chapter 3). This led to the
    inclusion in the new pack of Sword Play, actually a series of three sword-based
    games, in which you can battle single NPC opponents on an elevated platform above
    the water (Duel), methodically advance by cutting your way through an exaggerated
    number of opponents (Showdown), or slice your way through various absurdly oversize
    objects—fruit, pencils, and cake—at specified angles, showing off the ability
    of the enhanced controller to recognize vertical, horizontal, and diagonal swipes
    in fidelity to the relatively realistic make-believe motions that players make
    (Speed Slice).


    In all of these games, the sword characteristically resembles a red or blue lightsaber
    as much as it does a traditional bamboo kendo sword. (Of course, the *Star Wars*
    [Jedi] weapon was based on martial arts swords in the first place.) As in kendo
    or Western fencing, competition is structured and formalized. Player avatars wear
    protective face-mask helmets and take hits in a methodical way, low or high on
    the body or head, depending on the opponent’s parry, and finally collapse or fall
    off the high platform in the Duel game, when they fail to parry and are hit repeatedly
    in'
