  md: 'Actually, there is a history of using such peripherals as meditation aids at
    the boundary of gaming. In 2008, theorist and game developer Ian Bogost created
    a game written in 6502 Assembly language for the Atari VCS system (available on
    the original format cartridge media) and also for the iPhone (and later, the iPad),
    called *Guru Meditation*.19 It''s a kind of art game—one might even say antigame—in
    which you try to remain as still as possible (either by holding the iPhone or
    iPad level or sitting on a control pad with the VCS) until a sitting guru levitates
    and a timer records your score, which goes higher the longer you concentrate in
    an unmoving position.


    As Bogost explains it, this game is a tribute to an earlier legend—which may or
    may not have actually taken place—by the developers of the Amiga computer OS.
    The story goes that frustrated with the system''s tendency to crash, the programmers
    created a kind of game that required them to still cross-legged and still, balanced
    on an early Atari peripheral, the Joyboard, a controller made by attaching a joystick
    mechanism to a platform so that you could control it by standing on it. The legend
    serves as a kind of origin story to explain a particular error message on the
    Amiga system, the "Guru Meditation" fatal software error. But the Joyboard is
    also a clear precursor of Nintendo''s Balance Board. Bogost points out that you
    could even play a skiing game that shipped with it, *Mogul Maniac*, which is not
    unlike the ski jump in *Wii Sports Resort*, and in fact *Wii Fit* includes an
    unlockable meditation game of its own, oddly like Bogost''s (although *Guru Meditation*
    was essentially completed and had been publically presented well before *Wii Fit*
    shipped).19


    In the *Wii Fit* game, you sit still on the Balance Board (just as the programmers
    were rumored to do on the Joyboard) and breathe deeply, while watching a burning
    candle in the middle of a dark screen. The candle flickers more the more you fidget,
    and it goes out if you move too much. Part of the objective is to ignore the potential
    distractions that the game provides, such as the sound of crickets or human voices,
    and if you sit long enough, insects that come close to and sometimes end up in
    the flame. If you turn your head to look or flinch in response, the candle flame
    wavers or goes out. The game encourages the "just sitting" of Zen practice, letting
    distractions in the environment pass by while you remain undisturbed. It''s about
    as far from the excitement or stimulation of action games as you can get. Such
    applications in effect work as experiments. At the periphery of normal game control
    conventions, they test the limits of what can count as interacting with a game
    system, but in doing so, they''re always open to the charge of being silly. It''s
    a fine line.


    Partly to offset the charge of gimmickry and avoid having the Balance Board become
    a historical oddity that goes the way of the Atari Joyboard.'
