  md: 'which the Wii has helped to define. It’s as if the game were designed to grapple
    with the perceived contradictions inherent in the whole situation of Warren Spector’s
    making a Disney game exclusively for the Wii.


    Play style, states of matter of objects in the game, and character style become
    interrelated variables affecting diegetic events as well as the form and appearance
    of the game world itself. Mixtures of genre are part of the overall experience,
    since the game is basically an action-adventure game with RPG elements and 3D
    platformer architecture. Old-fashioned movie screens serve as portals that take
    you between levels, by way of playable transitions, 2D platformers based directly
    on early black-and-white Disney cartoons such as *Steamboat Willy*.


    There are some clear resemblances between the platformer gameplay and, say, *Super
    Mario Galaxy*, since in both games diminutive, plucky, cartoon heroes with squeaky
    voices run and jump across vast landscapes. Of course, this is no accident, since
    Mickey Mouse was surely among Miyamoto’s inspirations for Mario in the first place,
    especially the later 3D Mario, with his rounded torso and limbs along with white
    gloves. This character kinship serves as an index to the larger connections between
    Nintendo and Miyamoto, and Nintendo and Disney Corporation—the first major licensing
    agreement that Nintendo signed was to make Japanese playing cards with Mickey
    Mouse and other Disney characters printed on them—all of which would seem to make
    the game a natural for the Wii.¹⁸ Still, development began first for other platforms,
    including the PC, but when faced with porting it to the Wii, Spector demurred,
    worried about not giving the system its due in a mere port, and this led eventually
    to simply making the game a Wii exclusive. Spector’s own comments have stressed
    the connections on various levels—cultural, marketing, and technology—that he
    believes make the Wii the right platform for the game.


    Nintendo, like Disney, is all about reaching a broad audience of gamers, nongamers,
    kids, adults: the Wii is popular with all of those. I also like the idea of Mickey
    and Mario and Link together on the same platform—at least virtually. And if I
    was going to take a break from realistic stealthy shooter RPGs, why not go someplace
    where color and cartooniness are the norm rather than the exception? Finally,
    once you start talking about a game that involves painting and erasing and such,
    the Wii Remote and Nunchuk just seemed like a good fit.¹⁹


    These remarks touch on all the basic premises of platform studies, including how
    mutual factors and other intangibles matter in accounting for the relationship
    of platform to creative work. This particular creative'
