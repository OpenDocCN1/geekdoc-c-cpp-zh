- pgno: 14
  md: 'Over ten years ago, Robert D. Putnam published an influential work of sociology,
    *Bowling Alone*, about the loss of social community in the United States—a loss
    symbolized by the title''s sad image. Americans were increasingly likely to go
    bowling by themselves rather than in groups or a league, Putnam found, and this
    was just one example of a more general loss of involvement in civic life. Though
    the book maintains proper skepticism about causation and correlation, it represents
    technology and the media as at least contributing to the problem, and repeats
    a number of clichés about “computer and video games” as being “solitary” and alienating.
    For example, Putnam cites statistics to show that in the 1990s American boys were
    more likely than girls to use computers to play games; girls, in contrast, were
    more likely to use computers for email. Putnam interprets this as evidence that
    girls are “more socially adept,” based on the unsupported premise that games are
    less social than email.


    More than a decade after *Bowling Alone* appeared, civic life in the United States
    may still be in decline (such broad trends are notoriously difficult to both define
    and measure), but bowling—and still sometimes with others—seems to have remained
    at least moderately popular. Now, however, for many people, the idea of bowling
    as a social activity is probably more likely to call to mind *Wii Sports* than
    actual bowling. Google “bowling” in an image search, and the results are almost
    certain to turn up one or two images of Wii Bowling among the group shots in matching
    T-shirts as well as images of crowded alleys. When we tried it for this chapter
    (June 2010), among the top-twenty images was one of a Wii Bowling league T-shirt
    for sale, with a pin replacing each i, and a blurry action shot'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'of a senior citizen throwing their whole body into Wii Bowling at a local public
    library. In fact, googling “Wii Bowling seniors” resulted in 1,940,000 results,
    many including links to how-to articles or stories about retirement homes setting
    up leagues. The Wii has not replaced what Putnam saw as lost in US culture—civic
    involvement and broad social commitments; that’s not the point. But the topic
    of bowling as a social activity has been redefined since 2006 to feature Nintendo’s
    bowling simulation game.


    This is just one anecdotal example of the widespread cultural influence of the
    Wii, the video game console that from its introduction in 2006 until 2010 (when
    competitors introduced similar systems) was synonymous with the mimetic motion-control
    interface (you stand up and swing your arm to bowl, like the person in our search-results
    image), and with the kind of public and playful social interactions once associated
    with card games and bowling leagues. “Entertainment” is literally Nintendo’s middle
    name. The company was established in the nineteenth century as a playing-card
    manufacturer and, interestingly enough in this context, once turned disused bowling
    alleys into multimedia shooting ranges, or places where new kinds of social games
    replaced the once-central bowling leagues in Japan. That history is important
    for this book, which takes a detailed look at this most influential video game
    platform of the past decade at a moment when its successor, Wii U, is on the horizon,
    marking a kind of completion of the primary lifecycle of the original Wii.³


    By the time it went on sale in North America, in November 2006, the Wii had already
    generated a good deal of interest in the press, and on discussion boards and blogs.
    Codenamed “Revolution” during development, the fifth home console released by
    the Kyoto-based entertainment company was marketed in advance as a categorical
    exception—a system for the untapped majority of the market that doesn’t play video
    games or only plays them casually. The Wii helped to usher in the larger trend
    that Jesper Juul calls the “casual revolution” and “a breakthrough moment in the
    history of video games.” So-called social games on the Internet such as FarmVille
    that use Facebook and other social networks to attract their host platforms have
    emerged roughly in parallel with the Wii. Unlike these online social games, the
    Wii home console is what Juul describes as “mimetic-interface” gaming: the system
    mirrors the player’s movements. But social and mimetic-interface games like Wii
    Sports are different manifestations of the same casual revolution, Juul argues.⁴
    In both cases, the emphasis is on the social contexts that give the games meaning
    and the social interactions that are encouraged by the games, even if those interactions
    are not at the center of actual gameplay—which may involve asynchronous online
    interactions such as in FarmVille, using the controller as a token or pointer'
