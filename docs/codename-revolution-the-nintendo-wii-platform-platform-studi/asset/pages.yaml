    # Form Factor and Technology


    The Wii Remote is actually smaller than many modern universal television remote
    controllers, measuring approximately 5.81 by 1.43 by 1.12 inches, so that it can
    fit comfortably into the palm of your hand (see figure 3.2). And when compared
    to many television remotes today, it also has a radically simplified interface:
    a power button at the top (or front, when held in a horizontal position and pointed
    away from you), a cross-shaped directional pad, and an oversize and translucent
    A button below that (the B button is a trigger on the reverse side, set into a
    curved surface along the back of the controller). Across the device’s center is
    a row containing the minus and plus buttons on either side of a small home button
    (labeled both on the button with an icon of a house and beneath the button with
    the word “home”). Below that is a small speaker grill, then one and two buttons
    arranged vertically above a horizontal row of LED indicators, and the Wii logo
    printed in gray. In total, there are eight buttons on the top, including the on/off
    power button, but not counting the B trigger on the reverse side. The battery
    compartment on the reverse side also contains a tiny red button for synchronizing
    the controller with the console.


    The controller’s profile actually feels more like the handle of a lightweight
    tool or an umbrella than like the standard universal cable-DVR-television remotes
    many of us have become used to. It even has a wrist strap like an umbrella’s,
    added to prevent the device from slipping out of your hand during active gameplay,
    and now ships with its own stretchy protective plastic case. Every gaming session
    on the Wii begins with a warning screen with safety diagrams, reminding the player
    to tighten the strap to prevent accident or injury.


    But that rectangular and wedge-shaped pointer is only the most basic core controller.
    For many games—especially back-catalog ones downloaded via the Virtual Console
    or played on GameCube media, or traditional action-adventure games or FPSs—the
    Wii Remote alone is inadequate. So Nintendo developed a plan to treat the Wii
    Remote as a hub for various extension peripherals, starting with an extension
    device that plugs into the remote’s base and rides on its wireless connections,
    using a three-foot cable, a controller shaped like a curved pistol grip with Z
