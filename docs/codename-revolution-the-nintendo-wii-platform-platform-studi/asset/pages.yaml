  md: 'And the Wii’s limitations are no accident. They should be viewed against the
    larger backdrop of recent developments in computing as a whole, including the
    rise of mobile gaming on platforms such as the iPhone and iPad or Android, all
    of which are creating new competition for Nintendo’s DS (and now the 3DS), a market
    based on pared-down computing and display needs, for obvious reasons in the case
    of pocket-size battery-dependent platforms, and the social and economic fact of
    the rise of casual gaming. As consoles go, the Wii appears in retrospect to have
    come along at just the right moment, as a canny participant in the dual trends
    of casual gaming and lightweight, deliberately “underpowered” mobile platforms.
    Though it is thought of as a stationary object sitting beside the television,
    the Wii is itself actually highly portable, compared to larger, more complicated
    systems, and Nintendo has repeatedly stressed the fact that it can easily be carried
    to another room in the house or a friend’s home. To the degree that a home console
    can do so, the Wii shares a number of goals with mobile platforms and recent trends
    in computing in general.


    One important but often-overlooked aspect of these trends in computing is the
    shift toward the goal of lower power consumption. Remember that Miyamoto’s living
    room marketing scenario, in which he imagines getting moms to buy the Wii console,
    includes not only ease of use, speed, and quiet but also energy efficiency—the
    idea that the console would be “not a huge energy drain.” The relative energy
    efficiency of the Wii is indeed striking. A report by the National Resources Defense
    Council in 2008 compared the power use of the major consoles. Sony’s PS3 is the
    biggest power consumer, using about $134 worth of electricity a year (assuming,
    as the study did for all consoles, that it remains powered up). Microsoft’s Xbox
    360 is only slightly better, using $103 worth of electricity annually. By stark
    contrast, Nintendo’s Wii uses only $10 worth of electricity a year. The greater
    power of the Xbox and PS3 is necessary to drive their high-end graphics and support
    other features. Though the details are frequently confused in popular discussions
    as HD, or in mere equations of power with better graphics, it is true that the
    high-end graphics of the larger systems are produced as high-resolution 3D images
    and animations. Added horsepower is needed to ensure that the Xbox and PlayStation
    can run the 3D volumes, and do the more advanced rendering necessary.


    This power comes at a price. The competitor consoles basically cost more to operate
    over one to two years than the Wii currently costs to purchase. Energy and power
    consumption are functions of the host CPU, not just the GPU, and a computing system
    is only as powerful as its weakest link. To get an idea of what we mean by calling
    the Wii relatively energy'
