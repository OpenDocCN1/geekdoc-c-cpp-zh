- pgno: 97
  md: 'For far too long, video games have limited themselves to being fun and entertaining.
    But with *Wii Fit* the sky’s the limit as you explore exciting new exercises like
    . . . *Leaning Side to Side!* . . . And don’t miss *Sticking Out Your Leg!*


    The voice-over mocks the console as a piece of interior decorating for your living
    room (“goes with anything from Ikea”) and satirizes the relatively light exertion
    required by many of the *Wii Fit* games (“combines the perfect balance of barely
    moving and doing mundane things”). It claims that it will take kids away from
    playing outside and put families back in front of the television, and makes fun
    of the idea that “people all over the world think they’re getting exercise” by
    pointing to the mundane peripheral that symbolizes this aspect of the platform—the
    “little white thing you stand on.”¹


    Behind this ridicule is the recognition that, historically, peripheral devices
    like the Balance Board have frequently been introduced primarily to market new
    software, and more often than not with the whiff of gimmickry about them. This
    may be an uncomfortable reminder for some of the roots of game creation in hacking
    and hobbyist communities, resulting in insecurity among some members of the gaming
    and development communities about anything that looks uselessly geeky. From the
    beginning, when people placed translucent plastic filters over the television
    screen to play Magnavox Odyssey games “in color,” new kinds of home game systems—but
    especially new controllers and peripherals—have often seemed merely newfangled
    consumer gadgets.


    In the 1980s, a kind of ancestor of the Balance Board was released for the NES,
    the Roll ’n Rocker, a plastic board with a rounded bottom that served as a D pad
    for almost any game on the system when plugged into the console.¹ A regular NES
    control pad was attached to the board to make the other buttons available by hand,
    but you stood on the board (that is, you could stand on it if you weighed under
    a hundred pounds—a clear indicator of the age of its target market) and leaned
    from side to side to control the direction. It quickly gained a reputation as
    an ineffectual gimmick.


    Or take Nintendo’s Virtual Boy, the gargoyle-like head-and-shoulder-mounted display
    released in 1995. A control pad was attached by cable for playing red-tinted monochrome,
    lo-fi, simplified 3D games—the effect created using parallax optics. In retrospect
    it clearly looks like a conceptual precursor to the 3DS, but in its own time it
    was treated with a good deal of skepticism. Virtual Boy was created by Gunpei
    Yokoi, legendary for inventing the more successful handheld platforms Game Boy
    and, before that, Game & Watch. Even earlier, however, he had made one of Nintendo’s'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'first toys, the Ultra Hand, an extendable mechanical grabber, and was later
    responsible for the light-powered Ray Gun that grew out of the Laser Clay Range
    shooting galleries.


    Yokoi’s work is a reminder of the fine line in the historical commercial market
    between video game systems and toys. Before the commercial failure of the Virtual
    Boy, Yokoi had a reputation at the company for the pragmatic marketing of toylike
    devices. Interestingly, he’s also famous for establishing a company doctrine that
    has returned to prominence in the Wii era: “lateral thinking with seasoned technology,”
    meaning thinking creatively, outside the box, about how to use what has already
    been tested, is readily available, and by implication, is relatively inexpensive—the
    opposite of working at the cutting edge.¹³ Miyamoto himself credits Yokoi with
    shaping Nintendo culture in this direction, for establishing that “Nintendo-ness”
    is not about “the tech edge” but rather about redefinition by way of lateral thinking.¹⁴


    In this spirit, for example, the Wii made use of the existing GameCube chip architecture,
    and the Wii Remote used relatively mundane, nearly off-the-shelf commodity technologies
    such as infrared sensors, LEDs, and Bluetooth to create its new control system.
    The fact is that game controllers, peripherals, have historically always been
    open to the charge that they are just toys, mere gadgets. The Balance Board in
    fact spotlights long-lasting tensions surrounding game gadgetry—tensions still
    present under the cool facade that high-powered game systems, with their multibutton
    control pads, have acquired in recent decades.


    # Wii Vitality Sensor: Capturing the Player’s Internal State


    Here it might be useful to compare the Balance Board to the most ridiculed peripheral
    for the Wii so far, the Wii Vitality Sensor, which has not yet even appeared.
    It was first glimpsed in prototype when Iwata himself presented it at E3 2009,
    and has been mentioned publicly on numerous occasions since, but the Vitality
    Sensor has still failed to materialize as we complete this book. One prototype
    looks like a small bean-shaped pod into which the player inserts a finger so that
    it can measure the player’s pulse and then send the heart-rate data to the system
    as feedback. Iwata has placed the device in the context of the push to expand
    the audience for video games and suggested it was a way to “visualize something
    which is otherwise invisible”—the internal state of the player’s body. “Traditionally,
    video games have been developed to give an increased sense of excitement or stimulation.
    But it may not be long before games are also used to let people unwind, or even
    make it easier to fall asleep.”¹⁵'
