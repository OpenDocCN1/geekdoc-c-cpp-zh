    # ### Red Steel 2


    Red Steel 2 makes a useful case study of what''s involved in developing software
    for the Wii, and how the reality and perception of the system''s power limitations
    affect that development process. The first game in the series and first FPS developed
    for the Wii, *Red Steel*, was a fairly realistic-looking action-adventure game
    with a Japanese yakuza crime mob theme, released by Ubisoft in November 2006 to
    coincide precisely with the launch of the console that same month. It received
    a flood of negative reviews, mainly focused on its clunky mechanics, especially
    the relatively crude synchronization of the Wii Remote gestures with in-game swordplay,
    for example—problems that obviously reflected the developers'' lack of experience
    with the Wii''s new controller technology. But there were also problems with skipping
    movement and occasional crashes that were probably the result of not anticipating
    the Wii''s power limitations. In the game, you use the Wii Remote with the Nunchuk
    attached to handle both guns and a samurai-style katana sword. The possibilities
    for swordplay provided by a motion-sensitive wireless controller raised expectations
    in 2006 that were largely disappointed. *Red Steel* sold reasonably well—over
    one million copies in the end—undoubtedly riding on the popularity of Nintendo''s
    new console and being the only ESRB T-rated shooter for the new system. Yet one
    review site said the game was “buggy” and “thoroughly unimpressive,” because the
    sword fights felt more like “two cavemen hitting each other over the head with
    clubs,” and it signaled widespread disillusionment, not just about this one game,
    but also about the new platform as a whole.<sup>16</sup>


    The follow-up game, *Red Steel 2*, appeared in 2010 and was repeatedly referred
    to as a reboot of the franchise rather than a mere sequel. To make it, developers
    used an entirely new 3D game engine, Ubisoft''s *LyN*, the same used for the company''s
    *Rabbids Go Home* and expressly designed to exploit the full graphics capabilities
    of the Wii.<sup>17</sup> Most important of all, though, was Nintendo''s improved
    motion control. Although development of the second game was already under way
    when the Wii MotionPlus accessory was announced, game design quickly centered
    on how to take advantage of the augmented control provided by the plug-in device,
    which uses a tiny gyroscope to increase the Wii Remote''s sensitivity to'
