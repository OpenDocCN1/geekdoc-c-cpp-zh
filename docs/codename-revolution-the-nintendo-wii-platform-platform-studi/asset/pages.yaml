  md: 'In a crowded auditorium at the E3 2007 conference, Nintendo senior executive
    Miyamoto and Nintendo of America president Reggie Fils-Aime demonstrated a new
    peripheral, the Wii Balance Board. After Fils-Aime stepped up on what looked like
    a double set of slim white bathroom scales and weighed in (joking about his hefty
    body mass index), the two executives played a quick bout of Soccer Ball Heading,
    leaning from side to side on their Wii Balance Boards (as their Miis followed
    suit) in order to return balls—and avoid the occasional cleated shoe or, even
    weirder, stuffed panda head—that came flying at their heads. Fils-Aime won, but
    the real point of the demo was for the audience of game developers and marketers,
    and everyone who watched it later on YouTube or read about it in the press, to
    see the world’s most famous game designer, the creator of Mario and Zelda, standing
    on the Balance Board in his stockinged feet, evidently having fun, using his body
    to control what he made a point of calling a new game. It’s not at all obvious,
    even several years later, that Wii Fit is a game, properly defined, or that the
    Balance Board is much more than a gimmick. But the purpose of this chapter is
    to look closely at the reasons for the introduction of this peripheral in the
    first place along with the contexts in which it might make sense as part of the
    system and ask what the Balance Board tells us about the Wii’s nature as a platform.


    Earlier at the same E3, Fils-Aime had introduced the Wii Fit software—which he
    also referred to as a game—by tying it to the company’s strategy of “audience
    expansion.” The first and most obvious reason that Wii Fit and the Balance Board
    were introduced was to advance Nintendo’s plan to'
