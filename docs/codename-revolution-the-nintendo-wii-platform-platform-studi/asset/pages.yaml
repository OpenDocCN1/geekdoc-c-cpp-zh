- pgno: 17
  md: 'Four years after the release of the Wii, Microsoft’s Kinect extension for the
    Xbox 360 and Sony’s Move for the PS3 were created to compete for the mimetic-interface
    market that Nintendo had opened up. (We’ll have more to say about the initial
    phase of that competition in the book’s final chapter.) But in a more profound
    way than the precursors to these platforms and the Wii’s immediate competition
    in 2006—the Xbox 360 and the PS3 with traditional controls—the Wii depends on
    what happens in that “empty” space between its interconnected components, that
    space between the player and the screen—a space mediated by a network of peripheral
    devices and imagined as a possibility space where social interactions are the
    ideal context for gameplay.


    This book considers the Wii as a social platform. Of course, in one sense, all
    platforms are social systems, and game platforms especially so. But the Wii is
    “about using space in a different way” than in most recent mainstream games with
    3D game worlds, as I have argued elsewhere.^8 It’s designed around the notion
    that gameplay ideally happens in a shared space where social interactions, at
    least potential ones, are at the heart of the experience. Rather than being designed
    to maximize the immersive graphics of the virtual battlefield, kingdom, dungeon,
    or city in which the game takes place, the Wii’s somatic and mimetic network of
    controller objects were expressly made with the physical living room in mind.


    There’s certainly nothing inherently more social in the Wii’s hardware and software
    components than in those of any other game platform. The Xbox and PlayStation,
    along with other legacy historical systems, are frequently and even perhaps typically
    used in social settings, whether local area network (LAN) parties with multiple
    players sitting in the same space but connected via headsets and sharing a virtual
    game space, or more loosely defined groups in which two players wield controls,
    for example, while several others watch and comment. And that’s not to mention
    online social interactions, whether through services such as Xbox Live or massively
    multiplayer online role-playing games played on the personal computer (PC). In
    fact, we believe that most gameplay is fundamentally social in one or more of
    these ways, contrary to mainstream stereotypes. Again, there’s nothing inherently
    more social about using a Wii Remote instead of a traditional two-handed joypad.
    It’s the overall design of the system that makes the difference, and this design
    is shaped by preconceptions about what the system is for and how it’s to be used.
    It’s a difference of degree rather than of kind, a difference in relative emphasis,
    but the Wii was the first home video game platform consciously designed as a whole—from
    initial concept to prototype to shipped product—to first and foremost promote
    social gameplay out in physical space. That’s what we mean when'
