- pgno: 99
  md: 'There has been a constant trickle of jokes in the press and on the Internet
    about the promised Vitality Sensor since then, though, and it’s hard not to see
    it in the way many on the Internet have: as a gadget in the line extending back
    in Nintendo history as far as another arcade device (not really a game) invented
    by Yokoi in 1969, the *Love Tester*.⁶ This was essentially a coin-op toy that
    pretended to measure the love or attraction between two people when they held
    hands while holding onto its electrodes, with a meter that reacted to electric
    resistance in the two bodies. Yet this device, which playfully defined love in
    a pragmatic and operational way as combined electric current, was also treated
    semiseriously by Yokoi, who claimed that the couple’s emotional state would in
    fact be reflected in the measured increase in electric current—an argument that
    sounds much like Iwata’s suggestion, now forty years later, that the pulse-reading
    Vitality Sensor might measure something significant about the player’s internal
    state. As we’ve seen in the discussion of *Red Steel 2* in chapter 3, Nintendo
    has viewed even the reactions and physical motion captured by the Wii Remote with
    MotionPlus as measurements indicating the player’s feelings during gameplay.


    The Vitality Sensor is an indicator of how Nintendo developers think about controllers
    in general—as haptic-somatic feedback loops in the tradition of rumble packs (vibration)
    and in-controller speakers as well as the newer accelerometers and strain gauges.
    This view of the platform as a kind of PAN for gaming has also led to the development
    of Microsoft’s Kinect. Indeed, Nintendo has expressed ambitions for the Vitality
    Sensor that go beyond the Health Pack mandate into more traditional game franchises.
    Iwata has suggested, for example, that it might be possible “to incorporate the
    Vitality Sensor into Zelda so that as you become more scared, the enemies become
    even tougher.” One can imagine action games in which measurements of the player’s
    increased pulse become a factor in the way the game’s artificial intelligence
    shapes “excitement or stimulation,” to use Iwata’s terms.⁷ But the Vitality Sensor
    garnered an endorsement from the American Heart Association presumably because
    of plans to do the opposite—to help users learn to manage their heart rate in
    a feedback loop through software that would be the antithesis of stimulating action
    games. Perhaps in protective reaction to the publicity surrounding Microsoft’s
    Kinect as well as defensiveness about the device itself, Nintendo chose not even
    to mention the Vitality Sensor at E3 2010. Nevertheless, at the same conference
    the game developer Ubisoft demonstrated its own meditation or concentration game
    for the PC based on biofeedback, *Innergy*, which uses a Vitality Sensor–like
    finger cuff along with cartoon visualizations to train the user in synching their
    breathing and heart rate.'
