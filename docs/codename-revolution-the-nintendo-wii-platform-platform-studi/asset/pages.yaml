    of its catalog and the cultural resonance provided by its storied franchises.


    # A Software Phase


    This retrenchment was even more apparent in the Wii’s case. For whatever reason,
    the Vitality Sensor, which had been recognized by the American Heart Association
    earlier in the year in a carefully planned public relations announcement, was
    nowhere to be seen at E3 2010. After the conference, Nintendo of America’s Cammie
    Dunaway responded to questions about it in this way:


    > > We’re continuing to work on the Vitality Sensor. As we thought about what
    we wanted to bring to E3, we realized we had a really packed agenda. We also thought
    about the atmosphere at E3 which is noisy and adrenaline-filled, and loud and
    stressful, and it just didn’t seem like the best environment to introduce a product
    that’s really about relaxing, so we decided we’d think about other venues that
    would be more appropriate.¹²


    In the same interview, she articulated Nintendo’s post-Revolution strategy, saying
    that “you have to have great and innovative technology, but it has to be paired
    with best-in-class game design. I think Zelda is the absolute definitive proof
    point,” and stressed the “very large install base'
