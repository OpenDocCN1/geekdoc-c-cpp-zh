  md: 'software titles have emerged. One more example will help to illustrate what
    many of them have in common. *Monster Hunter Tri* (which was already a hit in
    Japan before its North American release), from the venerable Japanese developer
    Capcom, allows for multiplayer hunting missions against giant monsters that look
    like strange dinosaurs, across vast natural landscapes that sometimes look like
    otherworldly fantasy realms, in scenarios that can seem like a cross between *World
    of Warcraft* and Will Wright’s *Spore*. When it was released, the game was heavily
    marketed as “the most beautiful game on the Wii,” and in an interview, producer
    Ryōzo Tsujimoto said of Wii games of this general kind: “You can [make them] within
    the limitations, but you need a sense of design.” Like *Red Steel 2* (or for that
    matter, Nintendo’s sports games), but employing a different aesthetic, *Monster
    Hunter Tri* leverages its design and artwork to offset the platform’s technological
    constraints. In explaining this, Tsujimoto shares an instructive parable with
    his interviewer:


    > He asked me to imagine a cluster of five trees that might appear in the game.
    Maybe the game can’t render all five trees, so you’re stuck with having to use
    four. How do you place them? That’s the kind of thing focused on by his team.
    Their goal, from the start, he told me, was to develop the best looking game on
    Nintendo’s system.²⁴


    The moral of this story, a variation on the strategy of using cartoon- and manga-style
    graphics, is that what can’t be rendered by the system can be offset by effective,
    thoughtful, design—minimalist design. Four trees perfectly placed can look beautiful
    and avoid crashing the system. The limits of the platform ultimately determine
    design.


    # **Power (Efficiencies)**


    The most notorious drawback of the Wii—its relatively limited graphics capabilities,
    which are considered the result of its relatively lower-powered processors—functions
    as a given, perceived limit that both Nintendo and third-party developers confront
    when designing successful games for the system. This has led to interesting creative
    solutions and successful software titles, from the in-house cartoon aesthetic
    of the Miis, to the related manga style of *Red Steel 2* or “primitive” fantasy
    style of *Monster Hunter Tri*. The most successful development strategy for Wii
    games has been to find ways to reduce the requirements for photorealism or other
    processing-heavy demands of the game world, in order to be able to direct computing
    resources to managing the mimetic interface of the motion-'
