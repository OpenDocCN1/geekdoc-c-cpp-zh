- pgno: 46
  md: 'platform as it were. In fact, it''s arguably one of the most important parts
    of that system, since in the end a video game system, unlike some other kinds
    of computing systems, is a media and entertainment platform, developed to engage
    an audience. It only becomes meaningful when it''s played.


    The Wii''s potential audience is vast, as sales have shown. But Nintendo had to
    project that potential audience first in order to go on to construct it by way
    of the new platform. Its domination of the new market from 2006 to about 2010
    has undoubtedly been enhanced by the form factor of the console—its unobtrusive,
    attractive presence in the living room. This design was in turn closely coupled
    up with, and indeed made possible by, the decision to compete as a smaller, nimbler,
    lower-powered dinosaur in the console environment. Power isn''t everything. Deciding
    to make it a secondary consideration was a crucial stage in the Wii''s creation—one
    that has continued to have far-reaching implications, and one that has contributed
    to the identity of the Wii as what we are calling a social platform, defined as
    much by social contexts as by hardware and software considerations.


    There are two large issues when it comes to the Wii''s relatively low power: the
    constraints this puts on the system''s capabilities, especially when it comes
    to graphics display, and the efficiencies in terms of power consumption that result.
    Both issues have to be understood not only in technical terms but also within
    specific cultural and social contexts.


    The Wii''s modest 729 MHz processor (the IBM PowerPC Broadway chip) contrasts
    starkly with the two major competitors'' 3.2 GHz processors. For video, the Wii
    has an ATI (Hollywood) card, a 243 MHz GPU providing 480p maximum resolution,
    merely standard definition rather than the 1080p high definition (HD) of the other
    platforms, or the kind of graphics capability expected of hard-core players of
    highly cinematic games.


    Members of that demographic have continued to complain about the Wii''s lack of
    HD (though in actuality, image definition has little to do directly with power).
    It''s important to remember that power in a console—and computer systems in general—is
    always relative, and often a fuzzy concept, no more than a general sense users
    have of combined output effects, such as speed, image processing, and storage.
    Sometimes power is really no more than a marketing term with little precise technical
    meaning—as, for example, in the case of Nintendo''s own slogan in the 1980s, in
    the era of the NES: "Now you''re playing with power!" At any rate, the effects
    of power are always a matter of perception, relative to software needs and market
    expectations, which are set by the existing competition in a given generation.'
