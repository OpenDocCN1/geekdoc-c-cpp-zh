  md: 'control system. This has so far worked to capture the casual market. But it
    has continued to provoke complaints among self-described hard-core gamers, who
    seek a deeper, more demanding kind of immersive gameplay—one associated with photorealistic
    graphics and impressive cinematic effects (and increasingly, viewed in HD).


    The split between these two markets can be illustrated by the appearance within
    months of *Red Steel 2* of another western-themed single-player action-adventure
    game, *Red Dead Redemption*, for the PS3 and Xbox 360. The two games have the
    Western genre in common, in a general sense (and coincidentally, the word red
    in their titles), but otherwise they could not be further apart. *Red Dead Redemption*
    is the product of Rockstar Games, the makers of the groundbreaking *Grand Theft
    Auto* series, and like those games, offers a vast sandbox or open world, a simulated
    geography to explore, as well as cinematic-looking 3D graphics. *Red Dead Redemption*
    was extremely well received, ending up on numerous year-end best-of-2010 lists.
    Reviewing it for the *New York Times*, Seth Schiesel describes the game hyperbolically
    in terms of the goal of total immersion: it “does not merely immerse you in its
    fiction. Rather, it submerges you, grabbing you by the neck and forcing you down,
    down, down until you simply have no interest in coming up for air.”²⁵ This super
    immersive effect, we think, is often the opposite kind of experience sought by
    casual gamers in general and Wii gamers in particular. It nonetheless remains
    the holy grail of traditional hard-core games, so called triple-A titles that
    can take forty or more hours to complete, such as the kind of game epitomized
    in the GTA series.


    This book is based on the premise (one shared by Juul’s *A Casual Revolution*)
    that there has been a shift in recent years away from this kind of game as exclusively
    defining video games as a whole, with the rise of more casual or flexible modes
    of play along with the types of games that support those modes. The tale of these
    two different western games reminds us that the remaining division of hard-core
    versus casual gaming follows the division between platforms—at least within the
    Wii’s own generation. Kinect and Move may have added a casual dimension across
    the board, but it remains a truth universally acknowledged that hard-core games
    belong on the graphics-capable Xbox and PlayStation, not on the Wii. Everyone
    agrees that a game like *Red Dead Redemption* could not run well on the Wii, with
    its minimalist, scaled-down, and admittedly limited processing power.²⁶


    But this limitation on the Wii’s part can be seen in a more positive light, in
    terms of its notable success in helping to usher in the casual revolution—which
    we see as a general shift to the social nature of the platform.'
