  \ 3.3 毫米。编写一个程序，计算如果按此速度继续上升，未来 15 年海平面预计将上升多少。以厘米和英寸显示答案。\n\n## 19. 年度高温气温\n\n\
  纽约市 7 月的平均高温气温为 85 华氏度，丹佛为 88 度，凤凰城为 106 度。编写一个程序，计算并报告如果气温上升 2%，这些城市的新 7 月平均高温气温将是多少。\n\
  \n## 20. 需要多少油漆\n\n某个品牌的油漆每加仑可以覆盖 340 平方英尺。编写一个程序，确定并报告对一个高 6 英尺、长 100 英尺的木栅栏每侧涂两层大约需要多少加仑油漆。\n\
  \n# 第 3 章 表达式与交互\n\n## 3.1 `cin` 对象\n\n### 概念\n\n`cin` 可用于读取从键盘输入的数据。\n\n到目前为止，你编写的程序都是带有内置信息的。你使用必要的初始值初始化了变量，而没有让用户输入自己的数据。这类类型的程序局限于仅使用一组初始信息来执行任务。如果你决定更改任何变量的初始值，必须对程序进行修改并重新编译。\n\
  \n在现实中，大多数程序都会请求赋值给变量的值。这意味着如果用户想用不同的信息集多次运行程序，程序就不需要进行修改。例如，一个计算圆面积的程序可能会要求用户输入圆的半径。当计算并打印圆面积后，可以再次运行程序并输入不同的半径。\n\
  \n就像 C++ 提供了 `cout` 对象来产生控制台输出，它提供了一个名为 `cin` 的对象用于读取控制台输入。（你可以将 `cin` 这个词理解为 **con**\
  \ **in**put，输入。）程序 3-1 展示了如何使用 `cin` 读取用户输入的值。注意在第 2 行中有一个 `#include` 语句来包含 `iostream`\
  \ 头文件。任何使用 `cin` 的程序都必须包含此文件。\n\n该程序不是计算一个矩形的面积，而是可以计算任何矩形的面积。存储在 `length` 和 `width`\
  \ 变量中的值是在程序运行时由用户输入的。查看第 12 和第 13 行。\n\n```\ncout << \"What is the length of the\
  \ rectangle? \";\ncin  >> length;\n```\n\n在第 12 行中，`cout` 用于显示问题“What is the length\
  \ of the rectangle?”。这被称为*提示*（prompt）。它让用户知道预期会有输入，并提示他们必须输入什么。当使用 `cin` 从用户获取输入时，前面应该总是跟有一个提示。\n\
  \n第 13 行使用 `cin` 从键盘读取一个值。`>>` 符号是*流提取运算符*（stream extraction operator），它从输入流中*提取*字符，以便在程序中使用。具体来说，流提取运算符从其左侧的流对象获取字符，并将它们存储在右侧出现的变量名中。在本例行中，由\
  \ `cin` 读取的字符来自 `cin` 对象并存储在 `length` 变量中。\n\n从用户处收集输入通常是一个两步过程：\n\n1. 使用 `cout`\
  \ 在屏幕上显示提示。\n2. 使用 `cin` 从键盘读取一个值。\n\n提示应该向用户提问，或告诉用户输入一个特定值。例如，我们刚刚从程序 3-1 中检查的代码显示了以下提示：\n\
  \n```\nWhat is the length of the rectangle?\n```\n\n这告诉用户输入矩形的长度。在显示提示后，程序使用 `cin`\
  \ 从键盘读取一个值并将其存储在 `length` 变量中。\n\n注意 `<<` 和 `>>` 运算符似乎指向数据流向的方向。将它们想象成箭头可能会帮助。在涉及\
  \ `cout` 的语句中，`<<` 运算符始终指向 `cout`，所示。这表示数据正在从变量或字面量流向 `cout` 对象。\n\n```\ncout <<\
  \ \"What is the length of the rectangle? \";\n```\n\n在涉及 `cin` 的语句中，`>>` 运算符指向变量。\n\
  \n```cpp\ncin >> length;\n```\n\n`cin` 对象等待键盘上输入数据，直到按下 `Enter` 键。当用户输入字符时，它们被临时放在一个名为*输入缓冲区*（input\
  \ buffer）的区域。当 `cin` 读取它们时，将其转换为变量的数据类型。例如，如果用户输入 10，`cin` 足够智能知道这是一个整数 10。但如果用户输入像\
  \ 10.7 这样的浮点数，就会出现问题。`cin` 知道这种值无法存储在整数变量中，因此在遇到小数点时停止读取，将剩余数字留在输入缓冲区中。程序 3-2 展示了这一点。\n\
  \n让我们仔细观察程序 3-2 中发生了什么。当提示输入第一个数字时，用户从键盘输入了 12.3。然而，由于 `cin` 正在读取到一个整数变量 `intNumber`，它在遇到小数点时停止读取，并将\
  \ 12 存储在 `intNumber` 中。当第二个 `cin` 语句需要读取一个值到 `floatNumber` 时，它发现输入缓冲区中已经有一个值，即用户第一次输入留下的\
  \ .3。它没有等待用户输入第二个数字，而是读取了 .3 并存储在 `floatNumber` 中。\n\n以后你将学习如何防止这种情况的发生，但目前这说明了向用户提供清晰提示的必要性。如果用户被专门要求为第一个数字输入整数，发生问题的概率就会更小。\n\
  \n### 注意\n\n在任何使用 `cout` 或 `cin` 的程序中，记得包含 `iostream` 头文件。\n\n### 输入多个值\n\n你可以使用\
  \ `cin` 一次输入多个值。程序 3-3 是程序 3-1 的修改版本，可以此操作。\n\n第 14 行等待用户输入两个值。第一个值赋值给 `length`，第二个赋值给\
  \ `width`。\n\n```cpp\ncin >> length >> width;\n```\n\n\n\n\n在示例输出中，用户输入了 10 和 20，因此\
  \ 10 被存储在 `length` 中，20 被存储在 `width` 中。\n\n注意用户在输入数字时用空格分隔它们。这就是 `cin` 知道每个数字开始和结束位置。各个数字之间输入多少个空格并不重要。例如，用户可以输入：\n\
  \n```\n10          20\n```\n\n### 注意\n\n在输入最后一个数字后必须按下 `[Enter]` 键。\n\n你也可以用单个 `cin`\
  \ 语句读取不同数据类型的多个值。这在 程序 3-4 中所示。\n\n正如你在示例输出和 图 3-1 中所示，这些值按照输入顺序存储在各自的变量中。\n\n#\
  \ 图 3-1 持有用户输入的键盘缓冲区\n\n![内存存储图显示键盘缓冲区持有用户输入。](img/FG_03_001.png)图 3-1 完整替代文本\n\n\
  但如果用户以错误的顺序输入值（如下例运行结果所示），会怎样？\n\n# 程序 3-4 以粗体显示的不同示例输入输出\n\n```\n 输入一个整数、一个双精度浮和一个字符：5.7\
  \  4  b[Enter]\nwhole: 5\nfractional: 0.7\nletter: 4\n```\n\n由于数据没有按照指定的顺序输入，导致每个变量存储的值完全搞乱了。图\
