  \n# 8.12 STL `vector` 简介\n\n### 概念\n\n标准模板库包含一种名为 `vector` 的数据类型。它类似于一维数组，但与标准数组相比，它具有许多优势。\n\
  \n`标准模板库`（STL）是一组由`程序员定义`的数据类型和算法，供你在 C++ 程序中使用。这些数据类型和算法并不是 C++ 语言本身的一部分，而是在内置数据类型之外创建的。如果你计划继续学习计算机科学领域，就应该熟悉\
  \ STL。本节介绍了 STL 的一种数据类型：`vector`。\n\n### 注意\n\n要使用 vector，你的程序头文件必须指示你正在使用 `namespace\
  \ std`，因为 vector 包含在该命名空间中。许多旧版本的编译器不允许命名空间或不支持 STL。\n\n在 STL 中定义的数据类型通常被称为`容器`（containers）。之所以被称为容器是因为它们能够存储和组织数据。STL\
  \ 中有两种类型的容器：序列容器（sequence containers）和关联容器（associative containers）。`序列容器`以顺序方式组织数据，类似于数组。`关联容器`通过键（keys）组织数据，允许对存储在容器中的元素进行快速的随机访问。\n\
  \n`vector` 数据类型是一种序列容器，它在以下方面与一维数组相似：\n\n* vector 包含一个值的序列或元素（sequence of values\
  \ or elements）。\n* vector 将其元素存储在连续的内存位置中。\n* 你可以使用数组下标运算符 `[]` 来访问 vector 中的单个元素。\n\
  \n然而，与数组相比，vector 提供了许多优势。以下是其中几个：\n\n* 你不需要声明 vector 将拥有的元素数量。\n* 如果你向已经满的 vector\
  \ 添加一个值，vector 将自动增加其大小以容纳新值。\n* Vector 可以报告它们包含的元素数量。\n\n## 定义和初始化 Vector\n\n要在程序中使用\
  \ vector，你 必须通过以下语句包含 `vector` 头文件：\n\n```\n#include <vector>\n```\n\n要创建一个 vector\
  \ 对象，你使用一个语句，其语法与定义普通变量或数组的语法略有不同。这里有一个示例：\n\n```\nvector<int> numbers;\n```\n\n\
  该语句将 `numbers` 定义为 `int` 类型的 vector。注意数据类型位于尖括号内，紧跟在 `vector` 单词之后。因为 vector 在向其添加值时会扩展，因此不需要声明大小。不过，如果你愿意，也可以声明一个初始大小。这里有一个示例：\n\
  \n```\nvector<int> numbers(10);\n```\n\n该语句将 `numbers` 定义为包含 10 个 `int` 的 vector，但这只是初始大小。如果你向其添加了超过\
  \ 10 个值，它的大小将会扩展。\n\n### 注意\n\n注意，如果你为 vector 指定了初始大小，大小声明符是在圆括号内，而不是方括号。\n\n当你为\
  \ vector 指定初始大时，还可以指定一个初始化值。该初始化值会被复制到每个元素。这里有一个示例：\n\n```\nvector<int> numbers(10,\
  \ 2);\n```\n\n这把 `numbers` 定义为包含 10 个 `int` 的 vector，其中每个元素都初始化为 2。\n\n你还可以使用另一个\
  \ vector 中的值来初始化 vector。例如，如果 `set1` 是一个已经包含值的 `int`  vector，下述语句将创建一个名为 `set2`\
  \ 的新 vector，它是 `set1` 的精确拷贝。\n\n```\nvector<int> set2(set1);\n```\n\n在该语句执行后，vector\
  \ `set2` 将拥有与 `set1` 相同的元素数量，并持有相同的值。\n\n如果你在使用 C++ 11，还可以使用值列表来初始化 `vector`，例所示：\n\
  \n```\nvector<int> numbers { 10, 20, 30, 40 };\n```\n\n该语句定义了一个名为 `numbers` 的 `int`\
  \ vector。该 vector 将有四个元素，初始化为值 10、20、30 和 40。注意，初始化列表被包含在一组括号 `{}` 中，但你不需要在列表之前使用\
  \ `=` 运算符。\n\n表 8-2 总结了我们讨论过的 vector 定义过程。\n\n## 表 8-2 示例 Vector 定义\n\n| 定义格式 |\
  \  |\n| --- | --- |\n| `vector<string> names;` | 这将 `names` 定义为包含 `string` 对象的空\
  \ vector。 |\n| `vector<int> scores(15);` | 这将 `scores` 定义为包含 15 个 `int` 的 vector。\
  \ |\n| `vector<char> letters(25, 'A');` | 这将 `letters` 定义为包含 25 个字符的 vector。每个元素都初始化为‘A’。\
  \ |\n| `vector<double> values2(values1);` | 这将 `values2` 定义为包含 `double` 的 vector。`values1`（也是一个\
  \ `double` vector）的所有元素都被拷贝到 `values2`。 |\n| `vector<int> length{12, 10, 6};` |\
  \ 在 C++ 11 中，这将 `length` 定义为包含 3 个 `int` 的 vector，持有值 12、10 和 6。 |\n\n## 在 Vector\
  \ 中存储和检索值\n\n要在已存在的 vector 元素中存储值，或访问存储在 vector 元素中的数据，可以使用数组下标运算符 `[]`。程序 8-24\
  \ 是程序 8-15 的修改，说明了这一点。\n\n让我们看看程序 8-24 的几行。首先注意第 5 行。它包含了使用 vector 所需的预处理器指令。\n\n\
  ```\n#include <vector>\n```\n\n第 10 行和第 11 行定义了两个 vector。\n\n```\nvector<int> hours(NUMPS);\
  \       // 定义一个整数 vector\nvector<double> payRate(NUMPS);  // 定义一个 double vector\n\
  ```\n\n因为 vector 名称后面有一个声明符，它将以初始大小创建。在这种情况下，命名常量 `NUMPS` 等于 5，因此两个 vector 都将拥有五个元素。由于它们已经有了元素，可以像处理数组一样使用\
  \ `[]` 运算符向它们读取值或赋值。\n\n第 18 行开始一个 `for` 循环，其目的是输入用户数据。循环的第 21 行和第 23 行是读取并放入当前循环变量\
  \ `index` 指定 vector 中的语句。\n\n```\ncin >> hours[index];\ncin >> payRate[index];\n\
  ```\n\n第 29 行开始第二个 `for` 循环。其目的是计算并显示每个员工的毛工资。循环的第 31 行具有执行此计算的语句，从每个 vector 的指定元素中获取数据。\n\
  \n```\ngrossPay = hours[index] * payRate[index];\n```\n\n如果你比较程序 8-24 和程序 8-15，你会发现第\
  \ 14 行到第 36 行是完全相同的。\n\n## 在 C++11 中结合 `vector` 使用范围的 for 循环\n\n\n\n\n然而，你不能使用 `[]`\
  \ 操作符来访问尚不存在的向量元素。要将一个值存储在没有初始大小或已经填满的向量中，你应该使用 `push_back` 成员函数。该函数接受一个值作为参数，并将其存储在放置于向量末尾的新元素中。（它将该值“推”到向量的“末尾”。）\n\
  \n下面是一个示例，展示了如何向名为 `numbers` 的 `ints` 向量中添加一个元素。\n\n```\nnumbers.push_back(25);\n\
  ```\n\n该语句创建了一个包含 25 的新元素，并将其放置在 `numbers` 的末尾。如果 `numbers` 之前没有元素，则该新元素将成为它的唯一元素。\n\
  \n程序 8-26 是对 程序 8-24 的修改。然而，这个版本允许用户指定员工的数量。两个向量 `hours` 和 `payRate` 在定义时没有指定初始大小。由于这些向量没有初始元素，因此使用\
  \ `push_back` 成员函数向它们存储值。\n\n注意程序 8-26 中第 40 行到第 45 行的循环，该循环计算并显示了每个员工的总工资，它使用了\
  \ `[]` 操作符来访问 `hours` 和 `payRate` 向量的元素。之所以可行，是因为第 25 行到第 36 行的第一个循环已经使用 `push_back`\
  \ 成员函数创建了两个向量中的元素。\n\n# 确定向量的大小\n\n与数组不同，向量可以报告它们包含的元素数量。这是通过 `size` 成员函数实现的。下面是一个使用\
  \ `size` 成员函数的语句示例：\n\n```\nnumValues = set.size();\n```\n\n在该语句中，假设 `numValues`\
  \ 是一个 `int` 且 `set` 是一个向量。在执行该语句后，`numValues` 将包含 `set` 中元素的数量。\n\n`size` 成员函数对于编写接受向量作为参数的函数特别特别有用。例如，查看以下\
  \ `showValues` 函数的代码：\n\n```\nvoid showValues(vector<int> vect)\n{\n   for (int\
  \ count = 0; count < vect.size(); count++)\n      cout << vect[count] << endl;\n\
  }\n```\n\n由于向量可以报告其大小，因此函数不需要第二个参数来指示向量中元素的数量。程序 8-27 演示了这个函数。\n\n注意，当程序 8-27 中的向量在第\
  \ 11 行定义时，它没有被赋予任何元素。因此，第 15 行向向量中存储值的语句使用了程序 8-26 中引入的 `push_back` 函数。`push_back`\
  \ 函数每次被调用时都会创建一个新的向量元素来存放值。\n\n# 从向量中删除元素\n\n要从向量中删除最后一个元素，可以使用 `pop_back` 成员函数。以下语句从名为\
  \ `collection` 的向量中删除最后一个元素。\n\n```\ncollection.pop_back();\n```\n\n程序 8-28 演示了\
  \ `pop_back` 函数。\n\n### 注意\n\n`pop_back` 函数是一个 `void` 函数，它不返回从向量中移除的值。以下行代码将无法工作：\n\
  \n```\ncout << \"The value being removed from the vector is \";\n```\n\n# 清空向量\n\
  \n`pop_back` 函数是一个 `void` 函数，它不返回从向量中移除的值。以下行代码将无法工作：\n\n```\ncout << \"The value\
  \ being removed from the vector is \";\n```\n\n# 清空向量\n\n要完全清空向量的内容，使用 `clear` 函数，如下所示：\n\
  \n```\nnumbers.clear();\n```\n\n执行该语句后，`numbers` 将清空所有元素。程序 8-29 演示这一点。\n\n# 检测向量是否为空\n\
  \n要判断向量是否为空，使用 `empty` 成员函数。如果向量为空，它返回 `true`，否则返回 `false`。假设 `numberVector` 是一个向量，以下是它的用法示例：\n\
  \n```\nif (numberVector.empty())\n    cout << \"The vector is empty.\";\n```\n\n\
  程序 8-30 展示了。\n\n# 向量成员函数总结\n\n| 成员函数 | 描述 |\n| :--- | :--- |\n| `at(position)` |\
  \ 返回向量中位置 `position` 的值。 |\n| `clear()` | 清空向量的所有元素。 |\n| `empty()` | 如果向量为空返回 `true`，否则返回\
  \ `false`。 |\n| `pop_back()` | 向量的最后一个元素。 |\n| `push_back(value)` | 将 `value` 存储在向量的最后一个元素。如果向量已满，则创建一个新元素。\
  \ |\n| `resize(n)` | 将向量调整为具有 `n` 个元素。如果包含了可选的 `value` 参数，每个新元素将用该值初始化。 |\n| `size()`\
  \ | 返回向量中元素的数量。 |\n| `swap(vector2)` | 将向量的内容与 `vector2` 的内容交换。 |\n\n## 练习\n\n1.\
  \  8.27 为了定义向量对象，必须 `#include` 哪个头文件？\n2.  8.28 为以下三个向量对象编写定义语句：`frogs`（空的`int`向量）、`lizards`（包含\
  \ 20 个`double`的向量）和 `toads`（包含 100 个`char`的向量，每个元素初始化为'Z'）。\n3.  8.29 定义 `gators`\
  \ 为一个空的 `int` 向量，`snakes` 为一个具有 10 个元素的 `double` 向量。然后写一个语句在 `gators` 中存储 27，并写一个语句在\
  \ `snakes` 的第 4 个元素中存储 12.897。\n\n# 8.13 对象数组\n\n# \n\n数组元素可以是类对象。\n\n你已经了解到数组中的所有元素必须是相同的数据类型，并且已经见过许多不同简单类型的数组，例如\
  \ `int` 数组和 `string` 数组。然而，数组也可以包含更复杂类型，例如程序员定义的结构或对象。唯一的要求是每个元素持有相同类型的结构或相同类的对象。\n\
  \n让我们来看对象数组。你定义对象数组的方式与定义任何数组的方式相同。例如，如果已经定义了一个名为 `Circle` 的类，下面是创建一个可以容四个 `Circle`\
  \ 对象的数组的方法：\n\n```\nCircle circle[4];\n```\n\n\n\n这四个对象分别是 `circle[0]`、`circle[1]`、`circle[2]`\
  \ 和 `circle[3]`。\n\n请注意，类名是 `Circle`，字母 C 是大写的。数组名为 `circle`，字母 c 是小写的。你可能从第 7 章\
  \ 回想起，惯例是类名以大写字母开头，而变量或对象的名称以小写字母开头。为这些对象中的一个对象调用类函数与调用任何其他对象的类函数相同，区别在于必须包含下标以标识引用数组中的哪一个对象。例如，以下语句将调用\
  \ `circle[2]` 的 `findArea` 函数。\n\n```\ncircle[2].findArea();\n```\n\n程序 8-31 通过创建和使用\
  \ `Circle` 类对象的数组说明了这些思想。以下是它所使用的 `Circle` 类的定义。它是第 7 章中引入的 `Circle` 类的变体。\n\n在查看下方的程序\
  \ 8-31 时，请特别注意它的关键部分。第 5 行包含了 `Circle.h` 头文件，其中包含 `Circle` 类定义。然后，在第 12 行，程序创建了一个包含四个\
  \ `Circle` 对象的数组。在第 15 行到第 20 行之间，它使用循环调用每个对象的 `setRadius` 方法。第 26 行到第 29 行使用第二个循环调用每个对象的\
  \ `findArea` 方法并显示结果。\n\n### 注意\n\n每当在不带构造函数参数的情况下创建对象数组时，如果存在默认构造函数，它会为数组中的每个对象运行。这在程序\
  \ 8-31 中就发生过。\n\n当第一次创建 `Circle` 对象数组时，默认构造函数为数组中的每个对象执行，并将其半径赋值为值 1.0。我们从未见过这个值，因为对每个对象的\
  \ `setRadius` 成员函数的调用将其 1.0 替换为传递给 `setRadius` 的新值。如果我们注释掉程序 8-31 的第 15 行到第 20 行，就不会有对\
  \ `setRadius` 的调用。因此，当第 26 行到第 29 行的循环获取并打印面积时，数组中的每个对象的半径仍为 1.0。输出将如下：\n\n```\n\
  Here are the areas of the 4 circles.\ncircle 1    3.14\ncircle 2    3.14\ncircle\
  \ 3    3.14\ncircle 4    3.14 \n```\n\n\n\n\n\n```cpp\nclass Yard\n{\nprivate:\n\
  \   int length, width;\npublic:\n   Yard()\n      { length = 0; width = 0; }\n \
  \  void setLength(int len)\n      { length = len; }\n   void setWidth(int w)\n \
  \     { width = w; }\n};\nint main ()\n{\n   // 完成此程序。\n}\n```\n\n# 结构体数组\n\n如本节前面提到的，数组元素也可以是结构体。当你想要存储一组包含多个数据字段的记录，但又没有使用对象时，这非常有用。我们之前看过的程序\
  \ 8-15 显示了如何通过并行数组存储不同数据类型的相关信息。这是两个或多个数组，它们之间通过下标建立了对应关系。由于结构体可以包含多个不同数据类型的项目，因此可以使用单个结构体数组来代替多个普通变量数组。\n\
  \n结构体数组的定义方法与其他任何数组相同。假设程序中存在以下结构体声明：\n\n```cpp\nstruct BookInfo\n{\n   string title;\n\
  \   string author;\n   string publisher;\n   double price;\n};\n```\n\n以下语句定义了一个数组\
  \ `bookList`，它有 20 个元素。每个元素都是一个 `BookInfo` 结构体。\n\n```cpp\nBookInfo bookList[20];\n\
  ```\n\n可以通过下标访问数组的每个元素。例如，`bookList[0]` 是数组中的第一个结构体，`bookList[1]` 是第二个，依此类推。由于结构体的成员默认是公共的，因此你不需要像访问类对象那样使用函数来访问它们。你只需要在下标后放置点运算符（.）和成员名，即可访问任何元素的成员。\n\
