  \n帕斯卡三角形的前七行如下：\n\n*   1\n*   1 1\n*   1 2 1\n*   1 3 3 1\n*   1 4 6 4 1\n*   1\
  \ 5 10 10 5 1\n*   1 6 15 20 15 6 1\n\n所示的第一行索引为 0，最后一行索引为 6。三角形的第 0 行包含单个数字 1。对于任何正整数\
  \ `k`，索引为 `k` 的行有 `k+1` 个数字，并以 1 开头和结尾。对于第一个和最后一个之外的位置 `p`，第 `k` 行位置 `p` 的元素是第 `k-1`\
  \ 行位置 `p` 和 `p-1` 两个元素之和。\n\n编写一个函数：\n\n```cpp\nvector<int> pascalTriangleNextRow(vector<int>\
  \ row)\n```\n\n该函数以 vector 的形式接收帕斯卡三角形的一行，并返回三角形的下一行。通过编写一个 `main` 函数来测试你的函数，该函数要求用户输入整数\
  \ `N`，并通过反复调用上述函数打印帕斯卡三角形的前 `N` 行。\n\n# 第 18 章链表\n\n## 18.1 链表简介\n\n### 概念\n\n动态分配的数据结构可以在内存中链接形成链。\n\
  \n链表是一系列连接的 `nodes`（节点），其中每个节点都是一个数据结构。链表的节点通常是动态分配、使用然后删除的，允许链表的大小在程序运行时增长或缩小。如果需要向链表中添加新信息，程序只需分配另一个节点并将其插入到序列中。如果需要从链表中移除某特定信息，程序将删除包含该信息的节点。\n\
  \n（注：此处由于原文似乎在此处截断或重复了，根据指令我将仅翻译你提供的文本内容。你提供的文本最后一句是翻译为：如果需要从链表中移除某特定信息，程序将删除包含该信息的节点。）\n\
  \n### 链表相对于数组和 vector 的优势\n\n尽管链表的编码和管理比数组和 vector 复杂，但它们具有一些明显的优势。首先，链表的大小可以很容易地增长或缩小。事实上，程序员不需要知道列表中会有多少节点。它们仅在需要时在内存中创建。\n\
  \n人们可能会认为链表并不优于 vector（位于标准模板库中），因为 vector 也可以扩展或缩小。然而，链表相对于 vector 的优势在于插入或删除节点的速度。\n\
  \n# 链表的结构\n\n列表中的每个节点包含一个或多个持有数据的成员（例如，节点中存储的数据可以是库存记录；或者也可能是由姓名、地址和电话号码组成的客户信息）。除了数据外，每个节点还包含一个\
  \ `successor`（后继）指针，指向链表中的下一个节点。单个节点的组成结构如图 18-1 所示。\n\n非空链表的第一个节点被称为链表的 `head`（头部）。要访问链表中的节点，你需要一个指向头部的指针。从头部开始，你可以通过跟踪每个节点中存储的后继指针访问链表的其余部分。最后一个节点的后继指针被设置为\
  \ `nullptr` 以表示链表的结束。\n\n由于指向链表头部的指针用于定位链表的头部，我们可以认为它代表链表头部。同一个指针也可以通过从头部开始并跟踪后继指针来定位整个链表，因此也自然地认为它代表整个链表。图\
  \ 18-2 展示了一个包含三个节点的链表，显示了指向头部的指针、链表的三个节点以及表示链表结束的 `nullptr` 值。\n\n\n\n\n要在 C++ 中表示链表，我们需要一个能够表示列表中单个节点的数据类型。查看图\
  \ 18-1，我们可以看到，将此数据类型定义为一个结构是自然的，该结构包含了要存储的数据以及一个指向相同类型另一个节点的指针。假设每个节点将存储一个 `double`\
  \ 类型的数据项，我们可以声明以下类型来持有该节点：\n\n```cpp\n struct ListNode\n{\n   double value;\n  \
  \ ListNode *next;\n};\n```\n\n在这里，`ListNode` 是存储在列表中的节点类型，结构体成员 `value` 是节点的数据部分，而声明为\
  \ `ListNode` 指针的结构体成员 `next` 是指向下一个节点的后继指针。\n\n`ListNode` 结构有一个有趣的属性：它包含一个指向相同类型数据结构的指针，因此可以说它是一种包含自身引用的类型。此类类型被称为*自引用数据类型*或*自引用数据结构*。\n\
  \n在声明了表示节点的数据类型后，我们可以通过定义一个指针作为列表头并将其值初始化为 `nullptr` 来定义一个初始为空链表：\n\n```cpp\n ListNode\
  \ *head = nullptr;\n```\n\n现在我们可以创建一个由包含一个存储 12.5 的节点组成的链表，如下所示：\n\n```cpp\n head\
  \ = new ListNode;      // 分配新节点\nhead−>value = 12.5;       // 存储值\nhead−>next =\
  \ nullptr;     // 标记列表结束\n```\n\n现在让我们看看如何创建一个新节点，在其中存储 13.5，并使其成为列表中的第二个节点。我们可以使用第二个指针指向一个新分配的节点，13.5\
  \ 将存储在在该节点中：\n\n```cpp\n ListNode *secondPtr = new ListNode;\nsecondPtr−>value =\
  \ 13.5;\nsecondPtr−>next = nullptr;   // 第二个节点是列表末尾\nhead−>next = secondPtr;   \
  \   // 第一个节点指向第二个\n```\n\n注意，我们现在通过将其后继指针 `secondPtr−>next` 设置为 `nullptr` 使第二个节点成为列表的末尾，并且我们更改了列表头的后继指针使其指向第二个节点。程序\
  \ 18-1 展示了简单链表的创建。\n\n# 使用构造函数初始化节点\n\n回想 C++ 结构体可以有构造函数。为定义列表节点类型的结构提供一个或多个构造函数通常是非常方便的，允许节点在创建时就进行初始化。同样回想，就像普通函数一样，构造函数可以使用默认参数定义。为节点的后继指针提供\
  \ `nullptr` 作为默认参数是非常常见的。这里是 `ListNode` 结构的另一种定义：\n\n```cpp\n struct ListNode\n\
  {\n   double value;\n   ListNode *next;\n   // 构造函数\n   ListNode(double value1,\
  \ ListNode *next1 = nullptr)\n   {\n      value = value1;\n      next = next1;\n\
  \   }\n};\n```\n\n通过这种声明，可以用两种不同的方式创建节点：\n\n1. 仅指定其 `value` 部分并让后继指针默认为 `nullptr`，或者\n\
  2. 同时指定 `value` 部分和指向列表中将跟在该节点之后的节点指针\n\n当我们我们需要创建一个放置在链表末尾的节点时，第一种方法非常有用；而当新创建的节点要插入到列表中某个将有后继节点的位置时，第二种方法非常有用。\n\
  \n使用这种新的节点声明，我们可以用更短的代码创建之前的 `12.5` 后面接 `13.5` 的列表：\n\n```cpp\n ListNode *secondPtr\
  \ = new ListNode(13.5);\nListNode *head = new ListNode(12.5, secondPtr);\n```\n\n\
  我们实际上不需要第二个指针，可以将上面的代码写为：\n\n```cpp\n ListNode *head = new ListNode(13.5);\nhead\
  \ = new ListNode(12.5, head);\n```\n\n这段代码与之前的代码等效，因为赋值语句\n\n```cpp\n head = new\
  \ ListNode(12.5, head);\n```\n\n是从右到左评估的：首先在构造函数中使用 `head` 的旧值，然后将 `new` 运算符返回的地址赋值给\
  \ `head`，成为它的新值。\n\n# 构建列表\n\n使用 `ListNode` 的构造函数版本，可以很容易从文件中读取值并将每个新读取的值添加到已累积值列表的开头来创建一个列表。例如，使用\
  \ `numberList` 作为列表头，使用 `numberFile` 作为输入文件对象，以下代码将读取文本文件中存储的数字并将它们排列成列表：\n\n```cpp\n\
  \ ListNode *numberList = nullptr;\ndouble number;\nwhile (numberFile >> number)\n\
  {\n   numberList = new ListNode(number, numberList);\n}\n```\n\n# 遍历列表\n\n从列表头开始并遍历整个列表，同时在每个节点上进行处理的过程被称为*遍历*列表。例如，如果我们需要打印一个列表，比如头为\
  \ `numberList` 的列表，我们可以使用\n\n```cpp\n ListNode *ptr = numberList;\nwhile (ptr !=\
  \ nullptr)\n{\n   cout << ptr−value << \" \";\n   ptr = ptr−next;\n}\n```\n\n程序\
  \ 18-2 通过读取数字、将其排列成链表并遍历列表来演示这些技术。\n\n## 检查点\n\n1. 18.1 描述节点的两个部分。\n2. 18.2 什么是列表头？\n\
  3. 18.3 什么标记列表结束？\n4. 18.4 什么是自引用数据结构？\n\n# 18.2 链表操作\n\n### Concept\n\n基本的链表操作包括向列表添加元素、从列表中删除元素、遍历列表以及销列表。\n\
  \n在本节中我们开发列表类。其中第一个类 `NumberList` 将存储 `double` 类型。它基于上一节定义的 `ListNode` 结构，在此所示。\n\
  \n# `NumberList.h` 内容\n\n```cpp\n 1 #include <iostream>\n 2 using namespace std;\n\
  \ 3 class NumberList\n 4 {\n 5 protected:\n 6      // 为列表节点声明类\n 7      struct ListNode\n\
  \ 8      {\n 9         double value;\n 10         ListNode *next;\n 11         ListNode(double\
  \ value1, ListNode *next1 = nullptr)\n 12         {\n 13            value = value1;\n\
  \ 14            next = next1;\n 15         }     \n 16      };\n  17      ListNode\
  \ *head;                       // 列表头指针\n 18 public:\n 19      NumberList() { head\
  \ = nullptr;}     // 构造函数\n 20      ~NumberList();                        // 析构函数\n\
  \ 21      void add(double number);\n 22      void remove(double number);\n 23  \
  \    void displayList() const;\n 24 };\n```\n\n由于 `ListNode` 不需要 `NumberList` 外部的代码访问，我们将其声明在\
