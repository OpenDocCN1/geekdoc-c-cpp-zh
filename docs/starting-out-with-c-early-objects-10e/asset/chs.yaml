  \ 文件中找到。\n\n## 5.14 中山信用合作社案例研究\n\n中山信用合作社的经理要求你编写一个贷款摊还程序，以便他的贷款员可以在笔记本电脑上运行。以下是程序的功能要求。\n\
  \n## 问题描述\n\n在给定贷款金额、年利率和贷款年限的情况下，程序必须确定并显示每月还款金额。然后必须创建并显示一张摊还表，列出贷款每个月的以下信息：\n\
  \n* 还款次数\n* 该月还款中用于利息的金额\n* 该月还款中用于本金的金额\n* 该次还款后的余额\n\n可以使用以下报告作为模型。它显示了一笔金额 2000\
  \ 美元、年利率 7.5%、为期 0.5 年（即 6 个月）贷款的所有所需信息。\n\n```\nMonthly payment: $340.66\n```\n\
  \n| `Month` (月份) | `Interest` (利息) | `Principal` (本金) | `Balance` (余额) |\n| ---\
  \ | --- | --- | --- |\n| `1` | `12.50` | `328.16` | `1671.84` |\n| `2` | `10.45`\
  \ | `330.21` | `1341.62` |\n| `3` | `8.39` | `332.28` | `1009.34` |\n| `4` | `6.31`\
  \ | `334.35` | `674.99` |\n| `5` | `4.22` | `336.44` | `338.55` |\n| `6` | `2.12`\
  \ | `338.55` | `0.00` |\n\n## 计算\n\n信用合作社使用以下公式计算贷款的每月还款额：\n\n$$\\text{Payment}\
  \ = \\frac{\\text{Loan}*\\text{Rate/12}*\\text{Term}}{\\text{Term} - 1}$$\n\n其中：\n\
  \n$$\\begin{array}{cll} \\text{Loan} & & \\text{贷款金额} \\\\ \\text{Rate} & & \\text{年利率}\
  \ \\\\ \\text{Term} & & {(1 + \\text{Rate}/12)}^{\\text{Years}}\\end{array}$$\n\n\
  ## 变量\n\n表 5-4 列出了程序所需的变量。\n\n### 表 5-4 中山信用合作社使用的变量\n\n| 变量 | 说明 |\n| --- | ---\
  \ |\n| `loan` | `double`。贷款金额。 |\n| `rate` | `double`。年利率。 |\n| `moInterestRate`\
  \ | `double`。月利率。 |\n| `years` | `double`。贷款年限。 |\n| `balance` | `double`。待还余额。\
  \ |\n| `term` | `double`。用于每月还款计算。 |\n| `payment` | `double`。每月还款金额。 |\n| `numPayments`\
  \ | `int`。总还款次数。 |\n| `month` | `int`。用于当前还款次数的循环变量。 |\n| `moInterest` | `double`。每月利息金额。\
  \ |\n| `principal` | `double`。每月偿还贷款的还款金额。 |\n\n## 程序设计\n\n图 5-18 显示了程序的层次图。\n\n\
  ### 图 5-18 中山信用合作社的层次图\n\n![显示中山信用合作社程序的树形图](img/FG_05_018.png)\n图 5-18 文本\n\n##\
  \ 详细伪代码（包括实际变量名和所需的计算）\n\n```\nInput loan, rate, years\nnumPayments = years * 12\n\
  moInterestRate = rate / 12.0\nterm = (1 + moInterestRate)numPayments\npayment =\
  \ (loan * moInterestRate * term) / (term – 1.0)\nDisplay payment\nDisplay a report\
  \ header with column headings\nbalance = loan // 初始余额为贷款金额\nFor each month of the\
  \ loan\n   moInterest = moInterestRate * balance  // 先计算利息\n   If it's not the final\
  \ month\n       principal = payment – moInterest   // 剩余部分进入本金\n   Else        \
  \             // 是最后一个\n      principal = balance                // 还清精确余额\n   \
  \   payment = balance + moInterest\n   End If\n   balance = balance – principal\
  \         // 只本金减少余额\n   Display month, moInterest, principal, balance\nEnd of loop\n\
  ```\n\n## 程序\n\n检查伪代码逻辑错误后，下一步是将伪代码扩展为最终程序。这在程序 5-22 中显示。\n\n## 注意事项\n\n你可能在输出中注意到，对于某些月份（例如第\
