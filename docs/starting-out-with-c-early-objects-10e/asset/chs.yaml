  \n## 2.4 变量与赋值语句\n\n### 概念\n\n变量代表计算机内存中的存储位置。可以使用赋值语句在其中存储值。\n\n计算机编程中的变量概念与数学中的变量概念有些不同。在编程中，正如你在第\
  \ 1 章 中学到的那样，变量是用于存储数据的命名存储位置。变量允许你在计算机内存中存储和处理数据。它们提供了访问 RAM 的“接口”。可以使用赋值语句将值存储在变量中。程序\
  \ 2-7 包含一个变量和两个赋值语句。\n\n让我们仔细观察这个程序。从第 7 行开始。\n\n```\nint number;\n```\n\n这被称为*变量定义*。它告诉编译器变量名以及它将存储的数据类型。注意定义先给出数据类型，然后是变量名，并以分号结尾。这个变量名为\
  \ `number`。`int` 代表整数，因此 `number` 只能用于整数。\n\n### 注意\n\n程序中使用的每个变量都必须有定义。在 C++ 中，变量定义可以出现在程序的任何位置，只要在变量使用之前即可。以后你将学习定义变量的最佳位置。\n\
  \n现在看第 9 行。\n\n```\nnumber = 5;\n```\n\n这是一个赋值语句，`=` 号被称为*赋值运算符*。该运算符将右侧的值（5）复制到左侧命名的变量（`number`）中。这行代码不会在计算机屏幕上打印任何内容。它在后台默默运行，在\
  \ RAM 中存储值。执行此行代码后，`number` 将设置为 5。\n\n### 注意\n\n赋值语句左侧的项*必须*是一个变量。说 `5 = number;`\
  \ 是错误的。\n\n现在看第 10 行。\n\n```\ncout << \"The value of number is \" << number << endl;\n\
  ```\n\n注意发送给 `cout` 的第一个项带有引号。这让 C++ 知道它是一个字符串并应按原样显示。发送给 `cout` 的第二个项没有引号，所以 C++\
  \ 知道这是一个变量名。\n\n当你将变量名发送给 `cout` 时，它会打印变量的内容，因此显示以下内容：\n\n```\nThe value of number\
  \ is 5\n```\n\n\n\n\n回想第 1 章，变量之所以被称为变量是因为它们的值可以改变。第 12 行的赋值语句将 `number` 中存储的旧值替换为\
  \ 7。\n\n```\nnumber = 7;\n```\n\n因此，第 13 行最后的 `cout` 语句\n\n```\ncout << \"Now the\
  \ value of number is \" << number  << endl;\n```\n\n导致打印以下输出。\n\n```\nNow the value\
  \ of number is 7\n```\n\n## 2.5 字面量 (Literals)\n\n### 概念\n\n字面量是直接写入程序代码中的数据。\n\n\
