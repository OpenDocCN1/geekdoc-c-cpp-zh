  \n# 使用 `set_difference` 函数查找集合的差集\n\n\n\n\n\n两个集合的差集是出现在第一个集合中但不在第二个集合中的元素集合。例如，假设\
  \ `set1` 包含值 1, 2, 3, 4，而 `set2` 包含值 3, 4, 5, 6。`set1` 和 `set2` 的差集是一个包含值 1, 2 的集合。\n\
  \n你可以调用 STL 算法函数 `set_difference` 来获取两个集合的差集。该函数将差集存储在第三个容器中。程序 17-30 演示了如何使用该函数。\n\
  \n# 使用 set_symmetric_difference 函数查找集合的对称差\n\n两个集合的对称差是属于其中一个集合但不同属于两个集合的元素集合。例如，假设\
  \ `set1` 包含值 1, 2, 3, 4，而 `set2` 包含值 3, 4, 5, 6。`set1` 和 `set2` 的对称差是一个包含值 1, 2,\
  \ 5, 6 的集合。\n\n你可以调用 STL 算法函数 `set_symmetric_difference` 来获取两个集合的对称差。该函数将对称差存储在第三个容器中。程序\
  \ 17-31 演示了如何使用该函数。\n\n注意，两个集合对称差的大小可以与两个集合大小之和一样大。例如，如果两个集合没有共同元素，那么属于任何一个集合的每个元素都将在差集中。\n\
  \n# 检查子集关系\n\n如果一个集合的每个元素也是另一个集合的元素，我们称一个集合是另一个集合的子集。例如，如果集合 `S` 包含值 2, 3，而集合 `T`\
  \ 包含值 1, 2, 3, 4，那么 `S` 就是 `T` 的子集。说 `S` 是 `T` 的子集等于说 `T` 包含了 `S`。\n\n你可以调用 STL\
  \ 函数 `includes` 来确定一个集合是否包含另一个集合的所有元素。你使用迭代器将两个排序后的元素范围传递给 `includes` 函数，如果第一个范围包含了第二个范围中的所有元素，该函数返回\
  \ `true`。否则，函数返回 `false`。程序 17-32 演示了如何使用该函数。程序判断 `set1` 中的元素是否包含了 `set2` 中的所有元素。\n\
