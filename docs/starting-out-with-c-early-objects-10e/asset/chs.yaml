  \ are 23 years old.”\n\n# 10.\n\n修改程序 `Pr10-16`，使其使用智能指针而不是原始指针。\n\n# 第 11 章更多关于类和面向对象编程\n\
  \n## 11.1 `this` 指针和常量成员函数\n\n### 概念\n\n默认情况下，编译器为类的每个成员函数提供一个隐式参数，该参数指向调用该成员函数的对象。该隐式参数称为\
  \ `this`。常量成员函数是不修改调用它的对象的函数。\n\n## `this` 指针\n\n考虑以下类\n\n```\n class Example\n\
  {\n   int x;\n   public:\n      Example(int a){ x = a;}\n      void setValue(int);\n\
  \      int getValue();\n};\n```\n\n以及成员函数\n\n```\n int Example::getValue()\n{\n\
  \   return x;\n}\n```\n\n它简单地返回类对象中的值。例如，`getValue` 函数可能在这样的程序中调用：\n\n```\n int\
  \ main()\n{\n   Example ob1(10), ob2(20);\n   cout << ob1.getValue() << \" \" <<\
  \ ob2.getValue();\n   return 0;\n}\n```\n\n在这种情况下，程序将打印值 `10 20`。\n\n你在之前的章节中学过，结构体或类类型的不同对象被称为类的\
  \ `instances`（实例），每个类的实例都拥有类中列出的数据成员的副本。这些数据成员称为实例成员（因为它们属于类的实例），在不同的对象中具有不同的值。因此，在前面的示例中，`ob1`\
  \ 对象中的实例成员 `x` 的值为 `10`，而 `ob2` 中的 `x` 值为 `20`。\n\n现在再次考虑成员函数的代码\n\n```\n int Example::getValue()\n\
  {\n   return x;\n}\n```\n\n此函数本应该返回某个 `Example` 类对象的 `x` 成员，但它是如何知道使用哪个对象的呢？发生的情况是，默认情况下，编译器为每个类的成员函数提供一个隐式参数，该参数是指向类对象的指针。因此，例如，`getValue`\
  \ 函数配备了一个指向类对象的指针隐式参数。\n\n\n\n\n接收一个字符串对象的引用作为参数，但无法修改该对象。可以使用类似的机制保护隐式参数 `*this`\
  \ 不被成员函数修改。在成员函数的定义中，紧跟在参数列表之后放置 `const` 关键字，可以指示编译器该成员函数不应被允许修改其对象。如果成员函数定义在类外，则类内声明和定义都必须带有\
  \ `const`。这里是一个示例：\n\n```\n class ConstExample\n{\n   int x;\npublic:\n   ConstExample(int\
  \ a){ x = a;}\n   void setValue(int);\n   int getValue() const;\n};\n```\n\n`getValue`\
  \ 函数的定义如下：\n\n```\n int ConstExample::getValue() const\n{\n   return x;\n}\n```\n\
  \n带有常量参数 `x` 的函数不能反过来将 `x` 作为非常量参数传递给另一个函数。换句话说，一个承诺不修改 `x` 的函数可以将 `x` 传递给另一个函数，除非该第二个函数也承诺不修改\
  \ `x`。有时会以不明显的方式发生。以下程序使用一个带有常量参数的函数来打印数组的第一个元素。它无法通过编译，是因为它对 `const` 的使用不一致。\n\n\
  ```\n #include \nusing namespace std;\n\nclass K\n{\npublic:\n    void output()\
  \   // 缺少 const!\n    {\n        cout << \"Output of a K object\" << endl;\n   \
  \ }\n};\n\nvoid outputFirst(const K arr[])\n{\n   arr[0].output();\n}\n\nint main(int\
  \ argc, char** argv)\n{\n    K arr[] = { K() };\n    outputFirst(arr);\n    return\
  \ 0;\n}\n```\n\n该程序无法编译是因为编译器无法保证 `const` 数组的元素在作为隐式 `this` 参数传递给 `output` 成员函数时不会被修改：\n\
  \n```\narr[0].output(); \n```\n\n通过将 `output()` 变为 `const` 成员函数来使程序通过，以表示它有一个常量的\
  \ `this` 参数：\n\n```\nclass K\n{\npublic:\n    void output() const\n    {\n     \
  \   cout << \"Output of a K object\" << endl;\n    }\n};\n```\n\n## 11.2 静态成员\n\n\
  ### 概念\n\n如果成员变量声明为 `static`，则该类的所有对象都可以访问该变量。如果成员函数声明为 `static`，则它可以在类的任何实例定义之前被调用。\n\
  \n默认情况下，每个类对象（类的实例）都拥有类成员变量的独立拷贝。对象的成员变量与同类其他对象的成员变量是分离且相互不同的。例如，考虑以下声明：\n\n```\n\
  \ class Widget\n{\n   private:\n      double price;\n      int quantity;\n   public:\n\
  \      Widget(double p, int q)\n          { price = p; quantity = q; }\n      double\
  \ getPrice() const\n          { return price; }\n      int getQuantity() const\n\
  \          { return quantity; }\n};\n```\n\n假设在程序中通过以下声明创建了两个独立的 `Widget` 类实例：\n\
  \n```\nWidget w1(14.50, 100), w2(12.75, 500);\n```\n\n该语句创建了 `w1` 和 `w2` 两个不同的对象。每个对象都有自己的\
  \ `price` 和 `quantity` 成员变量。这可以通过图 11-1 所示。\n\n# 图 11-1 类的非静态成员\n\n![图像显示了两个对象，标记为“w1\
  \ Object”和“w2 Object”。](img/FG_11_001.png)图 11-1 完整替代文本\n\n当调用任何实例的 `getQuantity`\
  \ 成员函数时，它返回调用对象的 `quantity` 变量中存储的值。根据对象中最初存储的值，语句\n\n```\ncout << w1.getQuantity()\
  \ << \" \" << w2.getQuantity();\n```\n\n将显示 `100 500`。\n\n## 静态成员变量\n\n可以创建一个被同类所有对象共享的成员变量。要创建这样的成员，只需在变量声明前放置\
  \ `static` 关键字，如下类所示：\n\n```\n class StatDemo\n{\n  private:\n     static int x;\n\
  \     int y;\n  public:\n     void setx(int a) const { x = a; }\n     void sety(int\
  \ b) const { y = b; }\n     int getx() { return x; }\n     int gety() { return y;\
  \ }\n};\n```\n\n接下来，在类外对变量进行单独定义，例如：\n\n```\nint StatDemo::x;\n```\n\n在此示例中，成员变量\
  \ `x` 将被 `StatDemo` 类的所有对象共享。当一个类对象向 `x` 中存入值时，它是所有对象共享的。假设出现以下语句：\n\n```\nStatDemo\
  \ obj1, obj2;\nobj1.setx(5);\nobj2.sety(10);\ncout << \"x: \" << obj1.getx() <<\
  \ \" \" << obj2.getx() << endl;\ncout << \"y: \" << obj1.gety() << endl;\n```\n\n\
  成员变量 `x` 将将被所有对象共享。这可以通过图 11-2 所示。\n\n# 图 11-2 类的静态成员\n\n![图表显示了三个矩形。](img/FG_11_002.png)图\
  \ 11-2 完整替代文本\n\n静态成员的一个更实用的用法在程序 11-2。`Budget` 类用于收集所有部门的预算请求。该类使用静态成员 `corpBudget`\
  \ 来持有总金额。当调用成员函数 `addBudget` 时，其参数会被加到 `corpBudget` 中。当程序结束时，`corpBudget` 将包含所有值。\n\
  \n### 注意\n\n静态成员变量提供了声明与定义之间很好的很好的。*声明*提供了关于变量是否存在及其类型的信息。*定义*提供了声明的所有信息，并为被定义的变量或函数分配内存。静态成员变量必须在类内*声明*，在类外*定义*。\n\
  \n通常，我们可以将类的成员变量和函数分为两组：*实例成员*和*静态成员*。实例成员是指使用必须与特定实例关联的成员。特别是，实例变量必须通过类的特定实例进行访问，实例函数也必须通过特定实例进行调用。\n\
  \n相反，静态成员变量的使用或静态成员函数的调用不需要与任何实例关联。只需指定静态成员所属的类。\n\n## 静态成员函数\n\n类的成员函数可以通过在其声明前加上\
  \ `static` 关键字来声明为静态。通用格式如下：\n\n```\nstatic <return type><function name>(<parameter\
  \ list>)\n```\n\n静态成员函数通常用于处理类的静态成员变量。事实上，不访问类任何非静态成员的成员函数（例如[程序 11-2]中的 `getCorpBudget()`）应该被设为静态。\n\
  \n\n\n\n程序 11-3 是程序 11-2 的修改版本，它展示了这一点。它要求用户在输入任何部门请求之前先输入主办公室的预算请求。`Budget` 类被修改以包含一个名为\
  \ `mainOffice` 的静态成员函数。该函数将其参数加到静态变量 `corpBudget` 中，并在定义 `Budget` 类的任何实例之前被调用。`getCorpBudget()`\
  \ 函数也变成了静态的。\n\n注意调用静态函数 `mainOffice` 的语句：\n\n```\nBudget::mainOffice(amount);\n\
  ```\n\n调用静态成员函数通常通过作用域解析运算符 `::` 将函数名与类名连接。如果已经定义了类的对象，也可以通过点运算符 `.` 将它们的名称与对象连接来调用静态成员函数。因此，程序\
  \ 11-3 的最后一个输出语句可以写成：\n\n```\ncout << divisions[0].getCorpBudget() << endl;\n```\n\
  \n静态成员函数不能使用 `this` 指针，因为静态成员函数不是通过类的任何实例调用的。此外，静态成员函数无法访问其类的实例成员，除非它指定了该成员属于哪个实例。例如，在类中：\n\
  \n```\n class StatAccess\n{\n   private:\n      int x;\n   public:\n   static void\
  \ output()\n      {\n         cout << x;  // 错误地访问非静态成员\n      }\n   StatAccess(int\
  \ x) { this−>x = x; }\n};\n```\n\n在语句 `cout << x` 中尝试访问 `x` 是错误的，因为它等同于隐式地使用 `this`\
  \ 指针，而静态函数 `output` 并没有该指针。相比之下，在下面相同类的修改示例中，静态成员函数 `print` 正确地访问了非静态成员 `x`，因为它通过参数传递给它的类对象名称对其进行了限定。\n\
  \n```\n class StatAccess\n{\n   private:\n      int x; \n   public:\n      static\
  \ void print(StatAccess a)\n      {\n         cout << a.x;\n      }\n   StatAccess(int\
  \ x) { this−>x = x; }\n};\n```\n\n静态成员函数的优势是，它们可以在类的任何实例创建之前被调用。这允许它们被用于执行在创建类对象之前必须完成的复杂初始化任务。\n\
  \nC++ 使用关键字 `static` 来同时描述静态类成员和静态局部变量。为了理解这一点，查看实例成员和静态类成员的区别是有帮助的。类的每个对象都有其实例成员的独立拷贝，但所有对象共享相同的静态成员。同样，每次对函数的调用都有其非静态局部变量的独立拷贝，但所有函数调用共享相同的静态局部变量。在这个类比中，函数定义对应于类，函数调用对应于类的对象，而非静态局部变量对应于实例成员。\n\
  \n## 11.3 类的朋友 (Friends of Classes)\n\n### 概念\n\n朋友（friend）是一个不是类成员、但有权访问该类私有成员的函数。\n\
  \n私有成员对类外的所有程序部分都是隐藏的，访问它们需要调用公共成员函数。有时，你可能想要对该规则创建一个例外。`friend` 函数是一个不是类成员的函数，但它有权访问类的私有成员。换句话说，`friend`\
  \ 函数被对待方式就像它是类的一个成员一样。`friend` 函数可以是一个普通的独立函数，也可以是另一个类的成员。（事实上，一整个类都可以被声明为另一个类的朋友。）\n\
  \n为了让一个函数或类成为另一个类的朋友，必须由授予其访问权的类将其声明为朋友。类会维护一个它们的的“列表”，只有名称出现在列表中的外部函数或类会被授予访问权限。通过在函数原型前放置关键字\
  \ `friend` 来将函数声明为朋友。其通用格式如下：\n\n```\nfriend <return type><function name>(<parameter\
  \ type list>);\n```\n\n在以下对 `Budget` 类的声明中，另一个类 `Aux` 的 `addBudget` 函数已被声明为朋友：\n\
  \n```\n class Budget\n{\nprivate:\n   static double corpBudget;\n   double divBudget;\n\
  public:\n   Budget() { divBudget = 0; }\n   void addBudget(double b)\n      { divBudget\
  \ += b; corpBudget += divBudget; }\n   double getDivBudget() const { return divBudget;\
  \ }\n   static double getCorpBudget() { return corpBudget; }\n};\n```\n\n在以下对 `Budget`\
  \ 类的声明中，另一个类 `Aux` 的 `addBudget` 函数已被声明为朋友：\n\n```\n class Budget\n{\nprivate:\n\
  \   static double corpBudget;\n   double divBudget;\npublic:\n   Budget() { divBudget\
  \ = 0; }\n   void addBudget(double b)\n      { divBudget += b; corpBudget += divBudget;\
  \ }\n   double getDivBudget() const { return divBudget; }\n   static double getCorpBudget()\
  \ { return corpBudget; }\n};\n```\n\n*(注：修正翻译逻辑)* 假设另一个类 `Aux` 代表一个部门。该部门提出了一个请求，该请求必须加到总预算中。`addBudget`\
  \ 函数的朋友声明告诉编译器该函数具有访问权限：\n\n```\nclass Aux\n{\nprivate:\n   double auxBudget;\n\
  public:\n   Aux() { auxBudget = 0; }\n   void addBudget(double);\n   double getDivBudget()\
  \ { return auxBudget; }\n};\n```\n\n这里是 `Aux::addBudget` 成员函数的定义：\n\n```\n void\
  \ Aux::addBudget(double b)\n{\n   auxBudget += b;\n   Budget::corpBudget += auxBudget;\n\
  }\n```\n\n参数 `b` 被加上预算，通过表达式 `Budget::corpBudget` 进行访问。程序 11-4 在完整程序中展示了这些类。\n\n\
  ### 注意\n\n如前所述，可以将一整个类设为朋友。`Budget` 类可以通过以下声明将 `Aux` 类设为朋友：\n\n```\nfriend class\
  \ Aux;\n```\n\n然而，这可能不是一个好主意。`Aux` 的所有成员函数（包括以后添加的）都可以访问 `Budget` 的私有成员。最佳实践是将必须访问私有成员的函数声明为朋友。\n\
  \n# 检查 (Checkpoint)\n\n1.  实例成员变量和静态成员变量之间有什么区别？\n2.  静态成员变量在类声明中声明。那么静态成员变量在哪里定义？\n\
  3.  静态成员变量是在类的任何实例存在之前、同时还是之后产生的？\n4.  静态成员函数具有什么种局限性？\n5.  静态成员函数可以执行哪种操作是实例成员函数无法执行的？\n\
  6.  如果类 `X` 将函数 `f` 声明为朋友，那么函数 `f` 会成为类 `X` 的成员吗？\n7.  假设类 `Y` 是类 `X` 的朋友，这意味着类\
  \ `Y` 的成员函数可以访问类 `X` 的所有成员。`friend` 关键字应该出现在类 `Y` 的声明中，还是类 `X` 的声明中？\n\n\n\n\n\n\
  与其他变量（数组除外）一样，对象可以使用 `=` 运算符进行相互赋值。例如，考虑程序 11-5，它使用了一个 `Rectangle` 类，该类类似于第 7 章中讨论过的：\n\
  \n可以看到，语句\n\n```\nbox2 = box1\n```\n\n将 `box1` 的 `width` 和 `length` 变量直接复制到了 `box2`\
  \ 的 `width` 和 `length` 变量中。\n\n当用另一个对象的值来初始化一个对象时，也会发生成员级赋值。记住赋值和初始化之间的区别：赋值发生在两个已经存在的对象之间，而初始化发生在正在创建的对象上。考虑以下程序段：\n\
  \n```\nRectangle box1(10, 50);\nRectangle box2 = box1;\n```\n\n第二个语句定义了一个 `Rectangle`\
  \ 对象 `box2` 并将其初始化为存储在 `box1` 中的值。由于发生了成员级赋值，`box2` 对象将包含与 `box1` 对象相同的值。\n\n##\
  \ 11.5 拷贝构造函数\n\n### 概念\n\n拷贝构造是一个特殊的构造函数，每当创建一个新对象并用同类另一个对象的数据对其进行初始化时，就会被调用。\n\
  \n很多时候，创建一个对象并使其初始数据与另一个之前创建的对象相同是有意义的。例如，如果 Mary 和 Joan 住在同一个房子，并且已经创建了 Mary 的地址对象，那么将\
  \ Joan 的地址对象初始化为 Mary 的拷贝是有意义的。特别是，假设我们有如下类来表示地址：\n\n```\n class Address\n{\nprivate:\n\
  \   string street;\npublic:\n   Address() { street = \"\"; }\n   Address(string\
  \ st) { setStreet(st); }\n   void setStreet(string st) { street = st; }\n   string\
  \ getStreet() const { return street; }  \n};\n```\n\n然后我们可以使用以下代码创建 Mary 的地址，并将\
  \ Joan 的地址初始化为 Mary 的拷贝：\n\n```\nAddress mary(\"123 Main St\");\nAddress joan =\
  \ mary;\n```\n\n记住，每当创建对象时，构造函数都必须执行。当创建对象并用同类的另一个对象的数据进行初始化时，编译器会自动调用一个名为`拷贝构造函数`的特殊构造函数，使用现有对象的数据执行初始化。这个拷贝构造函数可以由程序员指定，我们稍后会展示。\n\
  \n# 默认拷贝构造函数\n\n如果程序员没有为类指定拷贝构造函数，那么编译器会自动调用`默认拷贝构造函数`。该默认拷贝构造函数仅使用成员级赋值将现有对象的数据复制到新对象。\n\
  \n大多数情况下，默认拷贝构造函数提供了我们想要的行为。例如，如果在用 Mary 的地址初始化 Joan 的地址后，Joan 后来搬走了并有了了自己的住处，我们可以更改\
  \ Joan 的地址而不影响 Mary 的。这在程序 11-6 中已所示。\n\n# 默认拷贝构造函数的缺陷\n\n然而，在某些情况下，默认拷贝构造函数的行为并不是我们预期的。考虑一个类\n\
  \n```\n class NumberArray\n{\nprivate:\n   double *aPtr;\n   int arraySize;\npublic:\n\
  \   NumberArray(int size, double value);\n   // ~NumberArray(){ if (arraySize >\
  \ 0) delete [] aPtr;}\n   void print() const;\n   void setValue(double value);\n\
  };\n```\n\n它封装了一个 `double` 类型的数字数组（实际上，该类可能还有其他成员）。为了给不同大小的数组提供灵活性，类包含指向数组的指针而不是直接包含数组本身。该类的构造函数代码所示，分配了一个指定大小的数组，然后将数组的所有条目设置为给定值。该类具有打印数组以及将数组条目设置为给定（可能不同）值的成员函数。该类的析构函数使用\
  \ `delete []` 语句来释放数组（参见第 10 章），但目前被注释掉了，以避免由默认拷贝构造函数引起的问题。我们稍后将指出这些问题的具体性质。\n\n\
  程序 11-7\n\n图 11-3 指向同一个数组的两个指针![图表显示了两个指针，first 和 second。它们都名为“aPtr”并指向一个显示 10.5、10.5\
  \ 和 10.5 的数组。](img/FG_11_003.png)\n\n# 程序员定义的拷贝构造函数\n\n程序员可以为类定义拷贝构造函数。程序员定义的拷贝构造函数必须具有一个指向同类的引用参数。因此，在之前的例子中，拷贝构造函数的原型为\n\
  \n```\nNumberArray::NumberArray(const NumberArray &obj)\n```\n\n拷贝构造函数通过为新对象的指针分配单独内存后再进行拷贝，避免了默认拷贝构造函数的问题：\n\
  \n```\n NumberArray::NumberArray(const NumberArray &obj)\n{\n   arraySize = obj.arraySize;\n\
  \   aPtr = new double[arraySize];\n   for(int index = 0; index < arraySize; index++)\n\
  \      aPtr[index] = obj.aPtr[index];\n}\n```\n\n拷贝构造函数不修改被复制的对象，因此将其参数声明为 `const`。程序\
  \ 11-8 演示了修改后带有拷贝构造函数的 `NumberArray` 类的使用。类声明在 `NumberArray2.h` 文件中，成员函数的实现在 `NumberArray2.cpp`\
  \ 中。\n\n### 注意\n\n拷贝构造函数必须具有一个指向同类的引用参数。忘记标识引用参数的 `&` 将导致编译错误。此外，该参数应该是 `const`\
  \ 引用，因为拷贝构造函数不应该修改被复制的对象。\n\n当在函数调用中按值传递对象时，编译器也会自动调用拷贝构造函数来创建对象的副本。这就是为什么拷贝构造函数的参数必须按引用传递的原因；如果在调用构造函数时是按值传递的，那么构造函数将立即被再次调用以创建要按值传递的拷贝，导致构造函数调用的无限链。\n\
  \n## 拷贝构造函数的调用\n\n\n\n\n每当通过用同类的另一个对象初始化来创建对象时，系统会自动调用拷贝构造函数。例如，`Rectangle` 类的拷贝构造函数在以下每个初始化语句中都会被调用：\n\
  \n```\n Rectangle box(5, 10);\nRectangle b = box;    // 初始化语句\nRectangle b1(box);\
  \    // 初始化语句\n```\n\n当函数调用接收到一个类类型的值参数时，拷贝构造函数也会被自动调用。例如，对于如下形式的函数：\n\n```\n void\
  \ fun(Rectangle rect)\n{\n}\n```\n\n如下调用\n\n```\nfun(box);\n```\n\n将导致 `Rectangle`\
  \ 拷贝构造函数的调用。最后，每当函数按值返回一个类对象时，拷贝构造函数会被自动调用。因此，在函数\n\n```\n Rectangle makeRectangle()\n\
  {\n    Rectangle rect(12, 3);\n    return rect;\n}\n```\n\n中执行 return 语句时，将调用拷贝构造函数。这是因为\
  \ return 语句必须创建一个临时的、非局的对象副本，该副本在函数返回后供调用者使用。总而言之，类的拷贝构造函数在以下情况下被调用：\n\n* 正在从同类的对象初始化变量\n\
  * 调用函数时带有该类的值参数\n* 函数返回一个该类对象的值\n\n### 注意\n\n当类的参数通过引用或指针传递时，或者当函数返回指向类对象的引用或指针时，并不会调用拷贝构造函数。\n\
  \n## 检查点\n\n1. 11.8 简述描述成员级赋值（memberwise assignment）的含义。\n2. 11.9 描述发生成员级赋值的两种场景。\n\
  3. 11.10 描述不应使用成员级赋值的情况。\n4. 11.11 什么时候调用拷贝构造函数？\n5. 11.12 编译器如何知道一个成员函数是拷贝构造函数？\n\
  6. 11.13 类的默认拷贝构造函数执行什么操作？\n\n## 11.6 运算符重载\n\n### 概念\n\nC++ 允许你重新定义标准运算符在与类对象一起使用的工作方式。\n\
  \n## 重载 `=` 运算符\n\n正如我们看到的，拷贝构造函数的设计是为了解决包含指针的对象通过成员级赋值用同类另一个对象的数据进行初始化时出现的问题。类似的问题也会出现在对象赋值中。例如，对于上一节中的\
  \ `NumberArray` 类，我们可能有一个程序定义了该类的两个对象：\n\n```\nNumberArray first(3, 10.5);\nNumberArray\
  \ second(5, 20.5);\n```\n\n现在，由于 C++ 允许将赋值运算符与类对象使用，我们可能会执行语句\n\n```\nfirst = second;\n\
  ```\n\n如果我们想将第一个对象设为与第二个对象完全相同的值。此时，C++ 将再次执行从第二个对象到第一个对象的成员级拷贝，导致两个对象中的指针都指向同一块内存。\n\
  \n由于默认的对象赋值比碰了与默认拷贝构造函数相同的问题，我们可能会认为可以使用程序员定义的拷贝构造函数来解决默认赋值引起的问题，但事实并非如此。拷贝构造函数仅在对象在创建时进行*初始化*时才起作用。特别是，拷贝构造函数不会在*赋值*中被调用。为了理解初始化和赋值的区别，假设对象\
  \ `first` 已经创建。那么语句\n\n```\nNumberArray second = first;    // 调用了拷贝构造函数\n```\n\n\
  该语句创建了 `second` 并用 `first` 的值对其进行初始化，这是一种*初始化*，并导致调用拷贝构造函数来执行初始化。然而，语句\n\n```\n\
  second = first;                // 未调用拷贝构造函数\n```\n\n该语句假设两个对象之前都已创建，这是一种*赋值*，因此没有调用构造函数。\n\
  \n为了解决成员级赋值引起的问题，我们需要修改赋值运算符的行为，使其在应用于对象时不同于成员级赋值。这样做我们是在说我们重载了赋值运算符。重载赋值运算符的一种方法是在类中定义一个名为\
  \ `operator=` 的成员函数。为 `NumberArray` 类这样做，我们会如下声明类：\n\n```\n class NumberArray\n\
  {\nprivate:\n   double *aPtr;\n   int arraySize;\npublic:\n   void operator=(const\
  \ NumberArray &); // 重载\n   NumberArray(const NumberArray &);\n   NumberArray(int\
  \ size, double value);\n   ~NumberArray() { if (arraySize > 0) delete aPtr; }\n\
  \   void print() const;\n   void setValue(double value);\n};\n```\n\n在查看函数本身的实现之前，让我们先查看函数头（原型），如图\
  \ 11-4 所示。\n\n## 图 11-4\n\n函数的名称是 `operator=`。由于运算符是类的实例成员，它只能通过类对象调用。调用它的类对象认为是赋值运算符的左操作数，而传递给它的参数认为是赋值运算符的右操作数。为了说明，假设程序中定义了两个对象\
  \ `left` 和 `right`：\n\n```\nNumberArray left(3,10.5);\nNumberArray right(5,20.5);\n\
  ```\n\n为了将 `right` 的值赋给 `left`，我们通过 `left` 对象调用成员函数 `operator=`，并将 `right` 对象作为参数传递：\n\
  \n```\nleft.operator=(right);\n```\n\n虽然你可以这样调用运算符函数，但编译器也允许使用更传统的符号\n\n```\nleft\
  \ = right;\n```\n\n### 注意\n\n运算符函数的参数不需要通过引用传递，也不需要声明为 `const`。在本例中，出于效率考虑，我们使用了引用参数：引用参数避免了拷贝作为参数对象的开销。`const`\
  \ 用于保护参数不受修改。\n\n# 类赋值运算符的返回值\n\n图 11-4 显示重载的 = 运算符返回 `NumberArray` 的引用。这样做是为了与\
  \ C++ 的内置赋值运算符保持一致，后者允许级联赋值语句，例如\n\n```\na = b = c;\n```\n\n级联赋值之所以有效，是因为内置赋值运算符的实现是在执行赋值后返回其左操作数的引用。因此，在该语句中，表达式\
  \ `b = c` 导致 `c` 被赋给 `b`，然后返回 `b` 的引用。该返回引用的值随后被赋给 `a`。\n\n# 类赋值运算符的实现\n\n现在让我们考虑赋值运算符的实现。首先注意到，如果存在如如下语句\n\
  \n```\nx = x; \n```\n\n则不需要进行任何拷贝。\n\n\n\n这会导致一个对象被赋值给自身。（这种赋值在大型程序中可能会间接地发生。）我们可以通过检查赋值左侧对象的地址\
  \ `this` 是否与赋值右侧对象的地址不同来测试这种可能性，如下所示：\n\n```\nif(this != &right)  { /*拷贝对象 …*/ }\n\
  ```\n\n赋值运算符函数首先删除为被赋值对象中的指针分配的内存。之后，它会以与类的拷贝构造函数相同的方式对另一个对象进行拷贝。该函数的最后一个动作是返回（通过引用）赋值左侧的对象\
  \ `*this`。以下是该函数的代码：\n\n```\n NumberArray& NumberArray::operator=(const NumberArray\
  \ &right)\n{\n    if (this != &right)\n    {\n      if (arraySize > 0) \n      {\
  \ \n          delete [] aPtr; \n      }\n      arraySize = right.arraySize;\n  \
  \    aPtr = new double[arraySize];\n      for (int index = 0; index < arraySize;\
  \ index++)\n      {\n        aPtr[index] = right.aPtr[index];\n      }\n    }\n\
  \    return *this;\n}\n```\n\n本节讨论的赋值运算符也称为`拷贝赋值`，以区分于我们稍后将学习的`移动赋值`运算符。通常，在构造函数中分配动态内存（或任何类型的资源）的类应该始终定义析构函数、拷贝构造函数、移动构造函数、拷贝赋值运算符和移动赋值运算符。你将在本章后面的部分学习移动赋值和移动构造函数。\n\
  \n`NumberArray` 类经过修改后包含了拷贝构造函数和重载的赋值运算符，其示例在程序 11-9 中。\n\n## 重载其他运算符\n\nC++ 允许程序员重载赋值以外的其他运算符。在许多情况下，重载\
  \ C++ 的内置运算符是自然的，使其能够与程序员定义的类一起。例如，假设存在名为 `Date` 的类，`Date` 类的对象在成员变量中存储日、月、年。假设\
  \ `Date` 类有一个名为 `add` 的成员函数。`add` 成员函数向日期增加天数，如果日期跨越到另一个月份或年份，则调整成员变量。例如，以下语句向 `today`\
  \ 对象中存储的日期增加五天：\n\n```\ntoday.add(5);\n```\n\n尽管该语句向 `today` 中存储的日期增加五天这看起来是显而易见的，但使用运算符可能会更直观。例如，看以下语句：\n\
  \n```\ntoday += 5;\n```\n\n该语句使用标准的 `+=` 运算符为 `today` 加 5。然而，这种行为并不会自动发生。要发生此操作，必须重载\
  \ `+=` 运算符。在本节中，你将学习重载 C++ 的许多运算符以对类对象执行特殊操作。\n\n### 注意\n\n你已经体验过重载运算符的行为。`/` 运算符执行两种类型的除法：浮点除法和整数除法。如果运算符的操作数之一是浮点类型，结果将是一个浮点值。然而，如果\
  \ `/` 运算符的两个操作数都是整数，则会发生不同的行为：结果是一个整数，小数部分被丢弃。\n\n## 运算符重载的一些通用问题\n\n现在你已经对运算符重载有了初步了解，让我们来看这种编程技术涉及的一些通用问题。\n\
  \n首先，如果你想这样做，你可以更改运算符的整个含义。没有任何什么可以阻止你将 `=` 符号从赋值运算符更改为“显示”运算符。例如，接下来的类就是这么做的：\n\
  \n```\n class Weird\n{\nprivate:\n   int value;\npublic:\n   Weird(int v)\n    \
  \  {value = v; }\n   void operator=(const Weird &right)\n      { cout << right.value\
  \ << endl; }\n};\n```\n\n虽然 `operator=` 函数重载了赋值运算符，但该函数并没有执行赋值。重载运算符所做的只是显示 `right.value`\
  \ 的内容。考虑以下程序段：\n\n```\nWeird a(5), b(10);\na = b;\n```\n\n尽管 `a = b` 语句看起来像是一个赋值语句，但它实际上会导致\
  \ `b` 的成员 `value` 内容显示在屏幕上：\n\n```\n10\n```\n\n另一个运算符重载问题是，你不能更改运算符所接受的操作数个数。`=`\
  \ 符号必须始终二元运算符。同样，`++` 和 `--` 必须始终是一元运算符。\n\n最后一个问题是，虽然你可能重载大多数 C++ 运算符，但你不能重载所有的运算符。表\
  \ 11-1 显示了所有可以重载的 C++ 运算符。\n\n## 运算符重载的方法\n\n重载运算符有两种方法：\n\n1. 将重载运算符作为类的成员函数。这允许运算符函数访问类的私有成员。它还允许函数使用隐式的\
  \ `this` 指针访问调用对象。\n2. 将重载成员函数作为独立的独立函数。以这种方式重载时，运算符函数必须声明为类的友以访问私有成员。\n\n某些运算符，例如流输入输出运算符\
  \ `>>` 和 `<<`，必须作为独立函数重载。其他运算符既可以作为成员函数重载，也可以作为独立函数重载。考虑一个类\n\n```\n class Length\n\
  {\nprivate:\n    int len_inches;\npublic:\n    Length(int feet, int inches)\n  \
  \  {\n        setLength(feet, inches);\n    }\n    Length(int inches) { len_inches\
  \ = inches; }\n    int getFeet() const { return len_inches / 12; }\n    int getInches()\
  \ const { return len_inches % 12; }\n    void setLength(int feet, int inches)\n\
  \    {\n        len_inches = 12 *feet + inches;\n    }\n};\n```\n\n设计用于表示长度测量。该类内部用英寸表示长度，但允许其客户端通过\
  \ `setLength()` 函数以英尺和英寸指定测量。\n\n# 重载算术和关系运算符\n\n类的客户端必须能够加减测量。此外，它们应该能够比较两个测量是否相等，或者一个是否小于另一个。我们将通过作为独立函数重载运算符\
  \ +, `−`、< 和 == 来提供所有这些功能。首先在 `Length` 类中添加以下声明：\n\n```\nfriend Length operator+(Length\
  \ a, Length b);\nfriend Length operator−(Length a, Length b);\nfriend bool operator<(Length\
  \ a, Length b);\nfriend bool operator==(Length a, Length b);\n```\n\n\n\n要了解我们是如何得出这些定义的，请考虑\
  \ `addition` 和 `less-than` 运算符。加法需要接受两个 `Length` 对象 `a` 和 `b` 作为参数，并产生一个 `a` 和 `b`\
  \ 之和的第三 `Length` 对象。同样，小于运算符需要接受两个 `Length` 对象作为参数并返回一个 `Boolean` 值。\n\n要了解如何编写实现这些函数的代码，再次考虑加法。给定两个输入参数\
  \ `a` 和 `b`，它需要返回一个 `Length` 对象，其 `len_inches` 成员是 `a` 和 `b` 的 `len_inches` 成员之和。这可以通过以下代码实现：\n\
  \n```cpp\nLength operator+(Length a, Length b)\n{\n    Length result(a.len_inches\
  \ + b.len_inches);\n    return result;\n}\n```\n\n或者更简洁：\n\n```cpp\n Length operator+(Length\
  \ a, Length b)\n{\n    return Length(a.len_inches + b.len_inches);\n}\n```\n\n我们可以以类似的方式来推出运算符函数\
  \ `−`、`<` 和 `==` 的定义。这里有一个完整的程序，展示了类及其重载运算符，并说明了它们的用法。\n\n## `Length.h` 的内容\n\n\
  ```cpp\n 1 #ifndef _LENGTH_H\n 2 #define _LENGTH_H\n 3 #include <iostream>\n 4 using\
  \ namespace std;\n 5\n 6 class Length\n 7 {\n 8 private:\n 9     int len_inches;\n\
  10 public:\n11     Length(int feet, int inches)\n12     {\n13         setLength(feet,\
  \ inches);\n14     }\n15     Length(int inches){ len_inches = inches; }\n16    \
  \ int getFeet() const { return len_inches / 12; }\n17     int getInches() const\
  \ { return len_inches % 12; }\n18     void setLength(int feet, int inches)\n19 \
  \    {\n20         len_inches = 12 *feet + inches;\n21     }\n22     friend Length\
  \ operator+(Length a, Length b);\n23     friend Length operator−(Length a, Length\
  \ b);\n24     friend bool operator< (Length a, Length b);\n25     friend bool operator==\
  \ (Length a, Length b);   \n26 };\n27 #endif\n```\n\n## `Length.cpp` 的内容\n\n```cpp\n\
  \ 1 #include \"Length.h\"\n 2\n 3 //*************************************\n 4 //\
  \ Overloaded operator +              *\n 5 //*************************************\n\
  \ 6 Length operator+(Length a, Length b)\n 7 {\n 8     return Length(a.len_inches\
  \ + b.len_inches);\n 9 }\n10\n11 //*************************************\n12 //\
  \ Overloaded  operator −             *\n13 //*************************************\n\
  14 Length operator−(Length a, Length b)\n15 {\n16     return Length(a.len_inches\
  \ − b.len_inches);\n17 }\n18\n19 //************************************\n20 // Overloaded\
  \ operator ==            *\n21 //************************************\n22 bool operator==(Length\
  \ a, Length b)\n23 {\n24     return a.len_inches == b.len_inches;\n25 }\n26\n27\
  \ //************************************\n28 // Overloaded operator <          \
  \   *\n29 //************************************\n30 bool operator<(Length a, Length\
  \ b)\n31 {\n32     return a.len_inches < b.len_inches;\n33 }\n```\n\n## 在独立运算符和成员函数运算符之间选择\n\
  \n给定我们编写的独立重载，代码\n\n```cpp\nLength a(4, 2), b(1, 8), c(0);\nc = a + b;\n```\n\n\
  编译器将其解释为：\n\n```cpp\nLength a(4, 2), b(1, 8), c(0);\nc = operator+(a, b);\n```\n\
  \n编译器允许程序员使用友好的中缀表示法。但在内部，它将运算符视为一个名为 `operator+` 的普通函数。这蕴含着一个并非显而易见的影响。语句\n\n```cpp\n\
  c = 2 + a;\n```\n\n等同于\n\n```cpp\nc = operator+(2, b);\n```\n\n这两个语句都能正确编译和执行，因为\
  \ `Length` 类的*转换构造函数*能够根据整数参数 2 创建一个 `Length` 对象。你将在第 11-9 节 中学习转换构造函数。\n\n我们同样可以可以将算术和关系运算符重载为成员函数。以下是实现加法的方法。首先，修改类内声明使运算符成为成员函数：\n\
  \n```cpp\n class Length\n{\nprivate:\n    int len_inches;\npublic:\n    // 修改后的\
  \ operator+ 声明\n    Length operator+(Length b);\n    // 类的其余部分省略\n};\n```\n\n注意运算符现在声明为接受单个\
  \ `Length` 类型的运算符。这是因为作为成员函数，第一个操作数是隐式的（`this`）。\n\n\n\n对编译器而言相当于\n\n```\nLength\
  \ b(4, 8), c(2, 5);\noperator<<(cout, b);\noperator(cout, b + c);\n```\n\n这种等价性具有以下含义：\n\
  \n1. 重载的运算符 `<<` 接受两个参数，第一个是一个 `ostream` 对象，第二个是正在重载该运算符的类对象。对于 `Length` 类，其原型将将是\
  \ `operator<<(ostream &strm, Length a)`。\n\n2. 为了允许在第二个参数中使用表达式（如 `b + c`），第二个参数应该按值传递。第一个参数应该按引用传递，因为\
  \ `ostream` 参数绝不应该按值传递。\n\n此外，流插入运算符应该返回其流参数，这样多个输出表达式就可以链式组合在一起，如下所示：\n\n```\n\
  Length b(4, 8), c(2, 5);\ncout << b << \"  \" << b + c;\n```\n\n将这一切结合起来，我们看到流插入运算符应该写成：\n\
  \n```cpp\n ostream &operator<<(ostream& out, Length a)\n{\n   out << a.getFeet()\
  \ << \" feet, \" << a.getInches() << \" inches\";\n   return out;\n}\n```\n\n重载流输出运算符是有用的，因为它允许在输出时为复杂类的各种字段标记标签。\n\
  \n重载流输入运算符也类似，不同在于表示要读入对象的类参数必须按引用传递。因此，流输入运算符的头文件定义如下：\n\n```cpp\nistream &operator>>(istream\
  \ &in, Length &a);\n```\n\n该函数的完整实现可以在下述 `Length1.cpp` 列表的第 3–18 行找到。初看起来，该函数似乎是有用的，因为它让程序员无需在用户通过屏幕和键盘输入数据时，为对象的不同部分发布提示信息。然而，请注意，如果使用该运算符从非键盘源（如文件或网络连接）读取\
  \ `Length` 对象，这些提示就会变成令人烦人的干扰。\n\n## `Length1.h` 的内容\n\n```cpp\n 1 #ifndef _LENGTH1_H\n\
  \ 2 #define _LENGTH1_H\n 3 #include <iostream>\n 4 using namespace std;\n 5\n 6\
  \ class Length\n 7\n 8 private:\n 9     int len_inches;\n10 public:\n 11     Length(int\
  \ feet, int inches)\n 12     {\n 13         setLength(feet, inches);\n 14     }\n\
  \ 15     Length(int inches){ len_inches = inches; }\n 16     int getFeet() const\
  \ { return len_inches / 12; }\n 17     int getInches() const { return len_inches\
  \ % 12; }\n 18     void setLength(int feet, int inches)\n 19     {\n 20        \
  \ len_inches = 12 *feet + inches;\n 21     }\n 22     // 重载的算术运算符和关系运算符\n 23   \
  \  friend Length operator+(Length a, Length b);\n 24     friend Length operator−(Length\
  \ a, Length b);\n 25     friend bool operator<(Length a, Length b);\n 26     friend\
  \ bool operator==(Length a, Length b);\n 27     Length operator++();\n 28     Length\
  \ operator++(int);\n 29\n 30     // 重载的流输入和输出运算符\n 31     friend ostream &operator<<(ostream\
  \ &out, Length a);\n 32     friend istream &operator>>(istream &in, Length &a);\n\
  \ 33 };\n 34 #endif\n```\n\n## `Length1.cpp` 的内容\n\n```cpp\n 1 #include \"Length1.h\"\
  \n 2\n 3 //**********************************************\n 4 // 重载的流提取运算符 >>  \
  \  *\n 5 //**********************************************\n 6 istream &operator>>(istream\
  \ &in, Length &a)\n 7 {\n 8     // 提示并读取对象数据\n 9     int feet, inches;\n10     cout\
  \ << \"Enter feet: \";\n11     in >> feet;\n12     cout << \"Enter inches: \";\n\
  13     in >> inches;\n14\n15     // 使用数据修改对象 a 并返回\n16     a.setLength(feet, inches);\n\
  17     return in;\n18 }\n19\n20 //*********************************************\n\
  21 // 重载的流插入运算符 <<    *\n 22 //*********************************************\n 23\
  \ ostream &operator<<(ostream& out, Length a)\n 24 {\n 25     out << a.getFeet()\
  \ << \" feet, \" << a.getInches() << \" inches\";\n 26     return out;\n 27 }\n\
  \ 28\n29 //***********************************\n30 // 重载的前置 ++ 运算符    *\n 31 //***********************************\n\
  32 Length Length::operator++()\n 33 {\n34     len_inches ++;\n35     return *this;\n\
  36 }\n37\n38 //***********************************\n39 // 重载的后置 ++ 运算符   *\n 40\
  \ //***********************************\n41 Length Length::operator++(int)\n42 {\n\
  43     Length temp = *this;\n44     len_inches ++;\n45     return temp;\n46 }\n\
  47\n48 //*************************************\n49 // 重载的 + 运算符    *\n50 //*************************************\n\
  51 Length operator+(Length a, Length b)\n52 {\n53     return a + b;\n54 }\n55\n\
  56 //*************************************\n57 // 重载的 - 运算符    *\n58 //*************************************\n\
  59 Length operator−(Length a, Length b)\n60 {\n61     return a - b;\n62 }\n63\n\
  64 //*************************************\n65 // 重载的 < 运算符    *\n66 //*************************************\n\
  67 bool operator<(Length a, Length b)\n68 {\n69     return a < b;\n70 }\n71\n72\
  \ //*************************************\n73 // 重载的 == 运算符    *\n74 //*************************************\n\
  75 bool operator==(Length a, Length b)\n76 {\n77     return a == b;\n78 }\n```\n\
  \n## 重载 `[]` 运算符\n\n任何 C++ 类都可以重载 `[]` 运算符使其对象像数组一样。事实上，`vector` 和 `string` 类都重载了\
  \ `[]`。例如：\n\n```cpp\nstring str = \"mad\";\ncout << str[0];\n```\n\n输出 `m`\n\n\
  重载的 `[]` 运算符必须接受一个参数，并返回任何类型的类型：\n\n```cpp\nReturnType &operator[](inputType)\n\
  ```\n\n为了与内置 `[]` 的工作方式保持一致，重载运算符应按引用返回。举一个简单的例子，假设我们想要一个 `Name` 类表示人的全名。对于这样的名字，我们希望\
  \ `name[1]` 是名，`name[2]` 是姓。此外，我们希望使用非 1 或 2 的整数对此类对象进行索引会导致程序终止。`Name` 类所示：\n\n\
  ## `Name.h` 的内容\n\n```cpp\n 1 #include <string>\n 2 #include <iostream>\n 3 #include\
  \ <cstdlib>\n 4\n 5 using namespace std;\n 6 class Name\n 7 {\n 8     string first_name;\
  \    \n 9     string last_name; \n10\n11     void subError()\n12     {\n13     \
  \    cout << \"Index must be 1 or 2\\n\" ;\n14         exit(1);\n15     }\n16 public:\n\
  17     string &operator[](int index)\n18     {\n19         switch(index)\n20   \
  \      {\n21             case 1: return first_name; break;\n22             case\
  \ 2: return last_name; break;\n23             default: subError();\n24         }\n\
  25     }\n26 };\n```\n\n注意，运算符 `[]` 函数接受一个 `int` 参数并返回字符串变量的引用。如果 `name` 是该类的对象且\
  \ `k` 是一个整数，调用 `name.operator[](k)` 等同于 `name[k]`。基本上，`name[1]` 将返回\n\n为了说明，让我们创建一个对象，可以将\
  \ 0..10 范围内的英语数字单词转换为相应的整数。如果我们有这样一个对象，比如 `trans`，那么 `trans[\"one\"]` 将具有整数值 1，`trans[\"\
  seven\"]` 将具有值 7，以此类推。\n\n主要思想是有一个 vector\n\n\n\n\n\n```cpp\nvector<string> numerals\n\
  {\n  \"zero\", \"one\", \"two\", \"three\", \"four\", \"five\",\n  \"six\", \"seven\"\
  , \"eight\", \"nine\", \"ten\"\n};\n```\n\n该 `vector` 将每个数字单词存储在对应的整数位置上。例如，“zero”存储在\
  \ 0 处，“seven”存储在 7 处。我们接着编写了如下重载的运算符：\n\n```cpp\nint operator \n```\n\n这样当传入一个字符串参数时，它会返回该参数在\
  \ `vector` 中的位置。我们采用的约定是，如果在 `vector` 中未找到该字符串，函数返回 -1。在这里我们偏离了运算符 `[ ]` 返回一个可以赋值的内存地址引用的约定。实现该运算符的\
  \ `Trans` 类在程序 11-13 中给出。\n\n## `Trans.h` 的内容\n\n```cpp\n 1 #include <string>\n\
  \ 2 #include <vector>\n 3 using namespace std;\n 4 class Trans\n 5 {\n 6     vector<string>\
  \ numerals   \n 7     {\n 8       \"zero\", \"one\", \"two\", \"three\", \"four\"\
  , \"five\", \n 9       \"six\", \"seven\", \"eight\", \"nine\", \"ten\"\n10    \
  \ };\n11 public:\n12     int operator \n13     {\n14         for (int k = 0; k <\
  \ numerals.size(); k++)\n15         {\n16             if (numerals[k] == num_str)\n\
  17             {\n18                 return k;\n19             }\n20         }\n\
  21         return −1;\n22     }\n23 };\n```\n\n## 检查点 (Checkpoint)\n\n1. 11.14 假设有一个名为\
