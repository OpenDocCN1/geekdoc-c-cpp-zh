  \ J 命名空间\n\n 引言\n\n*命名空间* 是 ANSI C++ 的一项功能，允许程序员为全局标识符创建一个范围。它们在防止多个全局声明使用相同名称时冲突非常有用。\n\
  \n例如，假设你是一家公司会计部门的程序员。你的公司购买了两个类库。其中一个库用于处理客户账户，包含一个名为 `payable` 的类对象；另一个库用于处理公司工资，也有名为\
  \ `payable` 的类对象。你正在编写一个集成这两个类集的程序，但由于两个类对象的名称相同，编译器生成了错误。你无法修改类库，因为软件供应商只销售对象代码库而不是源代码。\n\
  \n当软件供应商将每个类集放在它们自己的命名空间时，这个问题就可以解决了。每个命名空间都有自己的名称，必须使用该名称来限定其成员。当你（作为应用程序程序员）处理对象时，必须指定对象所属的命名空间。\n\
  \n实现此目标的一种方法是使用作用域解析符通过命名空间来扩展名称。例如，属于 `customer` 命名空间的 `payable` 对象指定为 `customer::payable`，而属于\
  \ `payroll` 命名空间的对象则指定为 `payroll::payable`。\n\n\n\n\n同样，以下语句指示编译器源文件使用了 `payroll`\
  \ 命名空间的成员：\n\n```\nusing namespace payroll;\n```\n\n当源文件中放置了 `using` `namespace`\
  \ 语句后，源文件中的语句就不再需要使用命名空间名和作用域解析符对命名空间成员的名称进行限定。\n\n# 定义命名空间\n\n命名空间的定义方式如下：\n\n\
  ```\nnamespace namespace_name\n{\n   declarations…\n}\n```\n\n例如，查看程序 J-1。它定义了 `test`\
  \ 命名空间，该空间包含三个成员：`x`、`y` 和 `z`。\n\n在程序 J-1 中，变量 `x`、`y` 和 `z` 定义在 `test` 命名空间的作用范围内。每当程序访问这些变量之一时，必须在变量名前之前加上\
  \ `test::`。否则，将发生编译错误。\n\n程序 J-2 演示了程序员如何使用命名空间来解决命名冲突。该程序定义了两个命名空间 `test1` 和 `test2`。这两个命名空间都包含名为\
  \ `x`、`y` 和 `z` 的变量作为成员。\n\n限定命名空间成员名称的另一种方法是使用 `using` `namespace` 语句。该语句告诉编译器，当当前作用域内找不到标识符时，应该在哪个命名空间中搜索该标识符。程序\
  \ J-3 演示了该语句。\n\n`using namespace demo;` 语句消除了在 `testObject` 前加上 `demo::` 的必要。编译器会自动使用\
  \ `demo` 命名空间来查找标识符。\n\n# ANSI C++ 与 `std` 命名空间\n\nANSI 标准头文件中的所有标识符都是 `std` 命名空间的一部分。在\
  \ ANSI C++ 中，`cin` 和 `cout` 写为 `std::cin` 和 `std::cout`。如果你不想为 `cin` 或 `cout`（或任何\
  \ ANSI 标准标识符）指定 `std::`，你必须在程序中编写以下语句：\n\n```\nusing namespace std;\n```\n\n# 附录\
  \ K C++ 类型转换与运行时类型识别\n\n## 引言\n\n在很多时候，程序员需要使用类型转换来告诉编译器将表达式的类型转换为另一种类型。例如，假设你有一个整数变量\
  \ `sum` 存储 `n` 个整数值的和，并想计算平均值将其存储在类型为 `float` 的变量 `average` 中。情况下，你必须通过类型转换告诉编译器在执行除法之前先将\
  \ `sum` 转换为 `double`：\n\n```\ndouble average;\naverage = (double)sum / n;\n```\n\
  \n这种转换被称为 `C 风格`转换。或者，你可以使用较新的 C++ `函数风格`（functional style）转换：\n\n```\ndouble average;\n\
  average = double(sum) / n;\n```\n\n函数风格的转换适用于 `char`、`float`、`int` 和 `double` 等原始内置类型，也适用于提供转换构造函数的用户定义类类型。在大多数情况下，函数风格转换的效果与\
  \ C 风格转换相同。\n\n另一种转换的示例频繁出现在从 I/O 设备（如网络连接或磁盘）读取数据时，数据以字节流的形式到达在这种情况下，为了将数据存储在某种类型的数据项中，例如如下结构体：\n\
  \n```\nstruct PersonData\n{\n   char name[20];\n   int age;\n};\nPersonData data;\n\
  ```\n\n`data` 的地址必须被处理为存储字节序列的位置的地址。换句话说，指向 `data` 的指针必须被处理为指向字节的指针。\n\n由于 C++ 将字节视为同于字符，这意味着指向\
  \ `PersonData` 类型的指针必须被视为一个指向 `char` 的指针。同样，这是通过使用类型转换完成的：\n\n```\nchar *pChar =\
  \ (char *)&data;\n```\n\n该语句获取结构体 `data` 的指针，通过类型转换将其处理为指向 `char` 的指针，并使用结果值初始化新创建的指针变量\
  \ `pChar`。\n\n显然，这两个转换示例是不同的，不仅在目的上不同，而且在编译实现方式上也不同。在将 `PersonData` 转换为 `char` 时，编译器没有执行转换的信息。然而，如果程序员提供了如何执行转换的信息，则可以使用\
  \ `static_cast`。四种转换类型为：\n\n1. `static_cast`\n2. `reinterpret_cast`\n3. `const_cast`\n\
  4. `dynamic_cast`\n\n# `static_cast`\n\n最常用的转换是 `static_cast`，它用于执行定义良好的转换。例如，将\
  \ `int` 转换为 `double`，你可以写：\n\n```\ndouble average = static_cast<double>(sum) / n;\n\
  ```\n\n`static_cast` 还可以用于将 `void*` 指针转换为另一种类型的指针。\n\n```cpp\nint *ptr = static_cast<int*>(voidPtr);\n\
  ```\n\n\n\n最后，`static_cast` 可用于将基类指针转换为派生类指针。我们将在本附录的最后一节中看到这方面的示例。\n\n# `reinterpret_cast`\n\
  \n`reinterpret_cast` 用于强制编译器在明无其他方式进行类型转换的情况下，将一个值视为另一种类型。`reinterpret_cast` 主要用于指针，当一个指向某种类型的指针需要被视为指向另一种类型的指针时使用。换句话说，`reinterpret_cast`\
  \ 对于在介绍部分所讨论的第二种强制转换非常有用。它不会发生位表示的任何变化。被转换的值直接按原样使用。\n\n`reinterpret_cast` 的表示法与\
  \ `static_cast` 。要强制将表达式 `expr1` 视为类型 `type1` 的值，我们写成：\n\n```\n type1 var1 = reinterpret_cast<\
  \ type1 >(expr1);\n```\n\n而不是旧的 C 风格强制转换。例如，如果由于某种原因，我们需要将一个 `FeetInches` 对象视为一对整数，我们可以设置一个\
  \ `int` 指针指向该对象，然后通过对指针解引用来访问对象的整数部分。使用 `reinterpret_cast` 来强制更改指针的类型。下面的 `main`\
  \ 程序将在第一行打印 3，在下一行打印 6。\n\n```\nint main()\n{\n   FeetInches ftObject(3, 6);\n \
  \  // 指向对象起始\n   int *p = reinterpret_cast< int * >(&ftObject);\n   cout << *p <<\
  \ endl;\n   // 指针移动一个 int 大小\n   p++;\n   cout << *p;\n   return 0;\n}\n```\n\n\
  如果编译器已经有足够的信息知道如何执行类型转换，它将拒绝使用 `reinterpret_cast`。特别是，以下语句将产生编译错误：\n\n```\ncout\
  \ << reinterpret_cast< int >(ftObject);\n```\n\n对于不直接与硬件交互的良好程序，很少需要这种类型的强制转换。事实上，对使用\
  \ `reinterpret_cast` 的需求很可能是设计错误的标志。\n\n# `const_cast`\n\n这种类型的强制转换仅用于`指向常量的指针`，并将指向常量的指针视为普通指针。指向常量的指针不能改变它所指向的内存位置。例如，我们可以如下所示定义一对整数变量和一个指向常量\
  \ `int` 的指针：\n\n```\nint k = 4;\nint m = 20;\nconst int *pToC;\n```\n\n我们可以让指针 `pToC`\
  \ 指向不同的整数变量，如下：\n\n```\npToC = &k;\ncout << *pToC; // 输出 4\npToC = &m;\ncout <<\
  \ *pToC; // 输出 20\n```\n\n但我们不能使用 `pToC` 来改变 `pToC` 指向的任何变量。例如，代码\n\n```\n*pToC\
  \ = 23;\n```\n\n是非法法的。此外，你不能将指向常量的指针的值赋值给另一个本身不是指向常量的指针，因为该常量可能会通过第二个指针被修改：\n\n\
  ```\nint *p1;        // 不是指向常量的指针\np1 = pToC;      // 错误!!\n```\n\n出于相同的原因，只有当相应的形式参数是指向常量的指针时，才能将指向常量的指针传递给函数。因此对于函数定义：\n\
  \n```\nvoid print(int *p)\n{\n   cout << *p;\n}\n```\n\n调用\n\n```\nprint(pToC);\n\
  ```\n\n将是非法的。然而，如果将函数修改为接收指向常量的指针作为参数，那么这种调用就是正确的。因此，在存在\n\n```\nvoid constPrint(const\
  \ int *p)\n{\n   cout << *p;\n}\n```\n\n的情况下，调用\n\n```\nconstPrint(pToC);\n```\n\
  \n是被允许的。\n\n这些示例特意保持了简单。在实际程序中，类成员函数返回的指向常量的指针可能指向类中需要保护不受修改的成员。然而，如果这个指针需要传递给一个不幸地没有编写为接收指向常量的指针的函数（例如上面所示的\
  \ `print`），则可以通过 `const_cast` “丢弃”指针的“常量属性”来说服编译器接受该调用，如下所示。\n\n```\n print( const_cast<\
  \ int * >(pToC) );\n```\n\n自然，`const_cast` 也可以用于允许将指向常量的指针赋值给普通指针：\n\n```\n int\
  \ *p = const_cast< int * >(pToC);\n```\n\n与 `reinterpret_cast` 的情况一样，我们注意到在大多数设计良好的程序中，不应需要使用\
  \ `const_cast`。\n\n# `dynamic_cast`\n\n多态代码是指能够用同一继承层次中属于不同类的对象进行调用的代码。由于不同类的对象具有不同的存储需求，多态代码并不直接使用对象。相反，它通过引用或指针来访问它们。在本附录中，我们将主要处理通过指针访问多态对象：通过引用的访问是类似的。\n\
  \n多态代码通过将不同类的对象视为基类来处理它们。然而，有时必须在运行时确定特定的派生类，以便调用其方法。多态类是具有至少一个虚函数的类。在 C++ 中，`dynamic_cast`\
  \ 用于获取多态类对象的指针（或引用），确定对象是否属于目标类，如果是，则返回指向目标类的指针。如果对象不能被视为目标类，`dynamic_cast` 返回特殊的指针值\
  \ `0`。\n\n对象内部带有信息以便进行运行时识别。`dynamic_cast` 的典型用法如下。假设 `pExpr` 是指向某个派生类 `PolyClass`\
  \ 的指针，并且 `DerivedClass` 是派自 `PolyClass` 的类之一。我们可以通过以下代码判断 `pExpr` 指向的对象是否为 `DerivedClass`：\n\
  \n```\nDerivedClass *dP = dynamic_cast<DerivedClass *>(pExpr);\nif (dP)\n {\n  \
  \  // 对象 *dP 属于 DerivedClass\n    …\n }\nelse {\n   // *dp 不属于 DerivedClass\n  \
  \ …\n }\n```\n\n这里 `DerivedClass` 是我们称的目标类。\n\n作为一个示例，考虑一个既有牛产奶又有若干只狗看门的农场。所有动物都吃东西（有一个\
  \ `eat` 函数），牛产奶（有一个 `giveMilk` 函数），狗守卫（有一个 `guardHouse` 函数）。我们可以使用以下类层次结构来描述所有这些：\n\
  \n```\n#include <iostream>\nusing namespace std;\n\nclass DomesticAnimal\n{\n  \
  \ public:\n     virtual void eat()\n      {\n        cout << \"Animal eating: Munch\
  \ munch.\" << endl;\n      }\n};\nclass Cow:public DomesticAnimal\n{\n  public:\n\
  \    void giveMilk()\n    {\n      cout << \"Cow giving milk.\" << endl;\n    }\n\
  };\nclass Dog:public DomesticAnimal\n{\n   public:\n     void guardHouse()\n   \
  \  {\n       cout << \"Dog guarding house.\" << endl;\n     }\n};\n```\n\n注意，`eat`\
  \ 成员函数已声明为虚成员函数，以便使所有类都是多态的。\n\n许多应用程序处理集合，通常是属于同一继承层次的对象的数组。例如，我们的农场可能有两只牛和两只狗，它们可以如下存储在数组中：\n\
  \n```\nDomesticAnimal *a[4] = {new Dog, new Cow,\n                        new Dog,\
  \ new Cow\n                        };\n```\n\n我们必须使用指针数组，因为 `DomesticAnimal` 数组无法容\
  \ `Dog` 或 `Cow` 对象，每种对象通常都比 `DomesticAnimal` 需要更多的存储空间。现在假设我们要遍历整个动物数组并挤奶所有的牛。我们不能直接通过循环遍历数组，因为\n\
  \n\n\n\n```cpp\nfor (int k = 0; k < 4; k++)\n  a[k]->giveMilk();\n```\n\n因为每当 `a[k]`\
  \ 指向 `Dog` 时，就会导致运行时错误。然而，`dynamic_cast` 将接收像 `a[k]` 这样的指针，查看所指向对象的实际类型，如果该类型匹配\
  \ `dynamic_cast` 的目标类型，则返回对象的地址。如果对象不匹配转换的目标类型，则返回 `0` 而不是地址。\n\n如前所述，将表达式 `expr1`\
  \ 强制转换为目标类型 `TargetType` 的通用格式为：\n\n```\ndynamic_cast< TargetType >(expr1);\n```\n\
  \n其中 `TargetType` 必须是指针或引用类型。在我们的情况下，为了确定 `a[k]` 指向的家畜动物是否为牛，我们会写：\n\n```\n Cow\
  \ *pC = dynamic_cast< Cow * >(a[k]);\n```\n\n然后测试 `pC` 以检查它是否为 `0`。如果是 `0`，我们就知道该动物不是牛，尝试给它挤奶是没用的；否则，我们可以通过调用以下代码来挤奶：\n\
  \n```\na[k]->giveMilk();\n```\n\n这是一个将这一切整合的 `main` 函数。\n\n```cpp\nint main()\n\
  {\n   DomesticAnimal *a[4] = {new Dog, new Cow,\n\t                    new Dog,\
  \ new Cow,\n                          };\n   for (int k = 0; k < 4; k++)\n   {\n\
  \     Cow *pC = dynamic_cast<Cow *>(a[k]);\n     if (pC)\n       {\n         //\
  \ pC 不是 0，所以我们找到了一头牛\n\t pC->giveMilk();\n       }\n     else\n      {\n       \
  \ cout << \"This animal is not a cow.\" << endl;\n      }\n   }\n   return 0;\n\
  }\n```\n\n执行时，输出将是\n\n```\nThis animal is not a cow.\nCow giving milk.\nThis animal\
  \ is not a cow.\nCow giving milk.\n```\n\n`dynamic_cast` 之所以如此，是因为多态类对象的类型并不总是能静态确定（即在不运行程序的情况下在编译时确定）。例如，在语句\n\
  \n```\na[k]->giveMilk();\n```\n\n中，要在编译时确定 `a[k]` 指向 `Dog` 还是 `Cow` 是可能的，因为它指向任一类型的对象。相比之下，`static_cast`\
  \ 使用编译时可用的信息。\n\n# 运行时类型识别\n\n正如我们看到的，`dynamic_cast` 可用于运行时识别继承层次结构中多态对象的类类型。更通用地说，`typeid`\
  \ 运算符可以用于运行时识别任何表达式的类型。它可以应用于数据表达式和类型表达式：\n\n```\ntypeid(data_expression)\n```\n\
  \n或者\n\n```\ntypeid(type_expression)\n```\n\n例如，如果我们有如下定义：\n\n```cpp\nint i;\nCow\
  \ c;\nCow *pC;\n```\n\n那么我们可以将 `typeid` 运算符应用于数据项 `i+12`、`c` 和 `pC`，得到：\n\n```\n\
  typeid(i+12)\ntypeid(c)\ntypeid(pC)\n```\n\n这等同于将 `typeid` 应用于相应的类型表达式的结果：\n\n```\n\
  typeid(int)\ntypeid(Cow)\ntypeid(Cow *)\n```\n\n在上一节的程序中，评估表达式\n\n```\ntypeid(a[k])\
  \ == typeid(DomesticAnimal)\n```\n\n始终得到值 `true`。要发现 `a[k]` 指向的动物是否为牛，我们会测试表达式\n\
  \n```\ntypeid(*a[k]) == typeid(Cow)\n```\n\n查看它是否为 `true`。如果是 `true`，我们就可以使用 `static_cast`\
  \ 将 `a[k]` 转换为相应的类型以便给牛挤奶：\n\n```\nstatic_cast<Cow *>(a[k])->giveMilk();\n```\n\n\
  这种转换是必要的，因为如果没有它，语句\n\n```\na[k]->giveMilk();\n```\n\n将无法编译。这是因为 `a[k]` 的类型是 `DomesticAnimal`\
  \ 的指针，而家畜动物没有 `giveMilk()` 成员函数。\n\n# 录录 L 命令行参数\n\n如果你在 UNIX、Linux 或 DOS 提示符等命令行环境中工作，编写能够从命令行接收参数的程序可能会有所帮助。例如，假设我们有一个名为\
  \ `sum` 的程序，它接收两个数字作为命令行参数并显示它们的和。我们可以在操作系统提示符处输入以下命令：\n\n```\nsum 12 16\n```\n\n\
  用空格分隔的参数是 `12` 和 `16`。因为 C++ 程序从 `main` 函数开始执行，所以命令行参数被传递给 `main`。函数 `main` 可以可选地带有两个特殊参数，传统上命名为\
  \ `argc` 和 `argv`。`argc` 参数是一个 `int`，而 `argv` 参数是一个 `char` 指针数组。这里是使用这两个参数的 `main`\
  \ 函数头示例：\n\n```cpp\nint main(int argc, char *argv[])\n```\n\n`argc` 参数包含在命令行上输入的项目数量，包括程序名。（注：此处已去除了重复的\
  \ `argc` 描述）。\n\n# 二进制与位运算\n\nC++ 赋予程序员的许多能力之一是处理整数单个位的能力。本附录的目的是概述数据类型，并解释 C++\
  \ 提供的位运算符。最后，我们将查看位域，它允许我们将变量视为独立的实体。\n\n# 整数形式\n\nC++ 提供的整数类型如下：\n\n```\nchar\n\
  int\nshort\nunsigned char\nunsigned int\nunsigned long\n```\n\n当在 C++ 中为整数赋值常量时，可以使用十进制、八进制或十六进制。在第一位数字前放置零产生八进制。例如，`0377`\
  \ 被解释为八进制。十六进制常量通过在数字前放置 `0x` 或 `0X` 创建。数字 `04B` 被解释。\n\n# 二表示\n\n无论如何表示常量，整数值都以相同的方式存储——二进制格式。让我们快速回顾一下二进制数表示。假设我们有一个字节域。\n\
  \n\n\n这些值实际上是 2 的幂。位 `0` 的值为 `2⁰`，等于 `1`。位 `1` 的等于 `2¹`，等于 `2`。位 `2` 的值为 `2²`，等于\
  \ `4`。这种值的模式一直持续到最后一位。\n\n当一个数字存储在这一字段中时，每个位可能被设置为 `1` 或 `0`。图 M-3 了一个了一个示例。\n\n\
  # 图 M-3\n\n![一张图表显示了 8 个矩形及其数值和“Bit”标签。矩形从左到右显示的数字 0, 1, 1, 0, 0, 1, 1 和 0。](img/FG_AppM_003.png)\n\
  \n在这里，位 `1`、`2`、`5` 和 `6` 被设置为 `1`。要计算此位模式的总体值，我们将所有设置为 `1` 的位值相加。\n\n| 位 1 的值 |\
  \ 2 |\n| 位 2 的值 | 4 |\n| 位 5 的值 | 32 |\n| 位 6 的值 | 64 |\n| | —– |\n| 总值 | 102 |\n\
  \n因此，位模式 `01100110` 的十进制值为 `102`。\n\n# 负整数值\n\n计算机存储负整数的一种方法是使用最左边的位作为符号位。当该位被设置为\
  \ `1` 时，它表示负数；当它被设置为 `0` 时，该数字为正数。然而，这样做的问题在于，对于数字 `0`，我们会有两种位模式。全 `0` 的模式表示正 `0`，而\
  \ `1` 后面跟全 `0` 的模式表示负 `0`。由于这个问题，大多数系统使用补码表示法来负整数。\n\n要计算一个数的补码，首先必须得到所谓的反码。这意味着将每个\
  \ `1` 变为 `0`，将每个 `0` 变为 `1`。接下来，在结果上加 `1`。这就得到了补码。以下是计算机存储值 `-2` 的方式。\n\n| 2 存储为\
  \ | `00000010` |\n| 获取反码 | `11111101` |\n| 加 1 | `1` |\n| | ———— |\n| 补码结果为 | `11111110`\
  \ |\n\n注意，负数的最高位始终被设置为 `1`，而正数或零的最高位始终被设置为 `0`。\n\n# 按位运算符\n\nC++ 提供了各种种运算符，允许你对整数值的每个位执行逻辑操作，并将位向右或向左移动。\n\
  \n# 按位取反运算符\n\n按位取反运算符是 `~` 符号。它是一个一元运算符，对字段中的每个位执行取反操作或反码操作。表达式\n\n```\n~val\n\
  ```\n\n返回 `val` 的反码。它不会改变 `val` 的内容。它可以以以下方式使用：\n\n```\nnegval = ~val;\n```\n\n\
  这会将 `val` 的反码存储在 `negval` 中。\n\n# 按位与运算符\n\n按位与运算符是 `&` 符号。该运算符对两个操作数的每个位执行逻辑与操作。这意味着它逐位地比较两个操作数。对于每个位置，如果两个位都为\
  \ `1`，则结果将为 `1`。如果其中一个或两个位为 `0`，则结果将为 `0`。这是一个示例：\n\n```\nandval = val & 0377;\n\
  ```\n\n与操作的结果将存储在 `andval` 中。该运算符还有一个组合赋值版本。这是一个示例：\n\n```\nval &= 0377;\n```\n\n\
  这等同于：\n\n```\nval = val & 0377;\n```\n\n# 按位或运算符\n\n按位或运算符是 `|` 符号。该运算符对两个操作数的每个位执行逻辑或操作。这意味着它逐位地比较两个操作数。对于每一个位置，如果两个位中有一个为\
  \ `1`，则结果将为 `1`。否则，结果将为 `0`。这是一个示例：\n\n```\norval = val | 0377;\n```\n\n或操作的结果将存储在\
  \ `orval` 中。该运算符还有一个组合赋值版本。这是一个示例：\n\n```\nval |= 0377;\n```\n\n这等同于\n\n```\nval\
  \ = val | 0377;\n```\n\n# 按位异或运算符\n\n按位异或运算符是 `^` 符号。该运算符对两个操作数的每个位执行逻辑异或操作。这意味着它逐位地比较两个操作数。对于每个位置，如果两个位中有一个为\
  \ `1`，但不是两个都是，则结果将为 `1`。否则，结果将为 `0`。这是一个示例：\n\n```\nxorval = val ^ 0377;\n```\n\n\
  异或操作的结果将存储在 `xorval` 中。该运算符也有组合赋值版本。这是一个示例：\n\n```\nval ^= 0377;\n```\n\n这等同于：\n\
  \n```\nval = val ^ 0377;\n```\n\n# 使用掩码使用按位运算符\n\n假设我们有以下声明：\n\n```\nchar value\
  \ = 110, cloak = 2;\n```\n\n图 M-4 展示了两个变量的二进制模式。\n\n# 图 M-4\n\n![两个变量的二进制模式。](img/FG_AppM_004.png)\n\
  \n语句\n\n```\nvalue = value & cloak;\n```\n\n会对 `value` 和 `cloak` 执行逻辑按位与。结果将存储在\
  \ `value` 中。记住，只有当两个位都设置为 `1` 时，按位与才会产生 `1`。图 M-5 显示此与操作的结果。\n\n# 图 M-5\n\n![图表显示了\
  \ 3 条矩形，前两个是“value”和“cloak”。第三条“result”显示为 0, 0, 0, 0, 0, 0, 1 和 0，注释提到“value equals\
  \ result”。](img/FG_AppM_005.png)\n\n`cloak` 变量中的 `0` “隐藏”了 `value` 变量对应位置上的值。这被称为*掩码*。当你对变量进行掩码时，只有与掩码中的\
  \ `1` 对应的位才会“显示出来”。其他位将被关闭。\n\n# 开启位\n\n有时你想开启变量中的选定位并保持其他位不变。这种操作可以通过按位运算符执行。让我们看看当我们将\
  \ `value` 变量与新的 `cloak` 值进行或操作会发生什么。\n\n```\nchar value = 110, cloak = 16;\nvalue\
  \ = value | cloak; // cloak 变量充当掩码。\n```\n\n图 M-6 显示此或操作的结果。\n\n# 图 M-6\n\n![图表显示了\
  \ 3 条矩形，前两个是“value”和“cloak”。第三条“result”显示为 0, 1, 1, 1, 1, 1 和 0，注释提到“value OR cloak\
  \ Equals result”。](img/FG_AppM_006.png)\n\n这导致 `value` 变量的第 4 位被开启，其他位保持不变。\n\n\
  # 关闭位\n\n假设你不是开启特定的位，而是想关闭它们。假设我们有以下声明：\n\n```\nchar status = 127, cloak = 8;\n\
  ```\n\n由于二进制 8 存储为 `1000`，这会将 `cloak` 的第 3 位设置为 `1`，其余所有设置为 `0`。如果我们想将 `status`\
  \ 的第 3 位设置为 `0`，我们必须将其与 `cloak` 的取反进行与操作。换句话说，我们首先获取 `cloak` 的反码，然后与 `status` 进行与操作。记得\
  \ `~` 符号代表按位取反。因此语句看起来如下：\n\n```\nstatus = status & ~cloak;\n```\n\n这种方法有效，因为一元取反操作是在二进制与操作之前完成的。图\
  \ M-7 展示了这些步骤。\n\n# 图 M-7\n\n![图表显示了 5 条矩形。](img/FG_AppM_007.png)图 M-7 完整替代文本\n\n\
  `status` 的第 3 位现在被关闭，所有其他位保持不变。\n\n# 翻转位\n\n翻转一个位就是在它开启时将其关闭，在它关闭时将其开启。这可以通过异或运算符完成。我们将使用以下变量来插明。\n\
  \n```\nchar status = 127, cloak = 8;\n```\n\n我们的目标是翻转 `status` 的第 3 位，因此我们将使用异或运算符。\n\
  \n```\nstatus = status ^ cloak;\n```\n\n\n\n\n图 M-8 展示了这一操作。\n\n# 图 M-8\n\n![图表显示了\
  \ 3 条矩形带。](img/FG_AppM_008.png)\n图 M-8 完整替代文本\n\n## 位运算\n\n该操作将 `status` 的第 3 位从\
  \ 1 更改为了 0。\n\n# 测试位的值\n\n要测试单个位的值，你可以使用 `&` 运算符。例如，如果我们想测试变量 `bitvar` 以检查第 2 位是否开启，我们使用一个第\
  \ 2 位为开启的掩码。以下是一个测试示例：\n\n```\nif ((bitvar & 4) == 4)      cout << \"Bit 2 is on.\\\
  n\";\n```\n\n记住，将值与掩码进行与运算（AND）会产生一个值，它隐藏了掩码中开启以外的所有位。同时记得二进制 `4` 表示为 `100`，只有第\
  \ 2 位开启。因此，如果 `bitvar` 的第 2 位开启，表达式 `bitvar & 4` 将返回值 `4`，导致 `if` 测试条件为真，从而显示消息。\n\
  \n`bitvar & 4` 外围的括号是必要的，以确保在相等性测试之前执行与运算，因为 `==` 运算符的优先级高于 `&` 运算符。\n\n# 位左移运算符\n\
  \n位左移运算符的符号是小于号 `<<`。该运算符接受两个操作数。左侧的操作数是要移动的操作数，右侧的操作数是要移动的位数。当位值左移时，右侧的空位将用 0 填充，移出字段的位将丢失。假设我们有以下变量：\n\
  \n```\nchar val = 2, shiftval;\n```\n\n以下语句将 `val` 左移 2 位后的值存储在 `shiftval` 中。\n\n\
  ```\nshiftval = val << 2;\n```\n\n图 M-9 显示了 `val` 中的值在背后发生的情况。\n\n# 图 M-9\n\n![图表显示了两个带，“移位前”和“移位后”。移位前”的二进制数是\
  \ 0, 0, 0, 0, 0, 0, 1, 0，“移位后”的二进制数是 0, 0, 0, 0, 1, 0, 0, 0。](img/FG_AppM_009.png)\n\
  \n然而，请注意 `val` 本身被移动。只有变量 `shiftval` 被改变了。它被设置为 `val` 左移 2 位后的值。如果我们想移动 `val` 本身，我们需要写道：\n\
  \n```\nval = val << 2;\n```\n\n或者，我们可以使用左移运算符的复合赋值版本，如下：\n\n```\nval <<= 2;\n```\n\
  \n将一个数字向左移动 `n` 位等于将其乘以 `2^n`。因此，这个示例等同于：\n\n```\nval *= 4;\n```\n\n然而，位移几乎总是运行得更快。\n\
  \n# 位右移运算符\n\n位右移运算符的符号是大于号 `>>`。与左移运算符一样，它接受两个操作数。左侧的操作数是要移动的操作数，右侧的操作数是要移动的位数。当位值右移时，如果变量是有符号的，左侧空位的填充取决于机器。它们可能用\
  \ 0 填充，也可能是符号位的值。如果变量是无符号的，空位将用 0 填充。移出字段的位将丢失。假设我们有以下变量：\n\n```\nchar val = 8,\
  \ shiftval;\n```\n\n以下语句将 `val` 右移 2 位后的值存储在 `shiftval` 中。\n\n```\nshiftval = val\
  \ >> 2;\n```\n\n图 M-10 显示了 `val` 中的值在背后发生的情况。\n\n# 图 M-10\n\n![图表显示了两个带，“移位前”和“移位后”。移位前”的二进制数是\
  \ 0, 0, 0, 0, 1, 0, 0, 0，“移位后”的二进制数是 0, 0, 0, 0, 1, 0, 0, 0。](img/FG_AppM_010.png)\n\
  \n# 位域\n\nC++ 允许你创建位域（bit fields）。这里是一个示例：\n\n```cpp\nstruct {\n   unsigned field1\
  \ : 1;\n   unsigned field2 : 2;\n   unsigned field3 : 3;\n   unsigned field4 : 4;\n\
  } mybits;\n```\n\n\n\n\n位域（Bit fields）的可移植性并不好，特别是当指定了字段的物理顺序和边界的确切位置时，因为某些机器从左到右排列位域，而另一些机器则从右到左排列。\n\
  \n# 附录 N 流程图简介\n\n本附录对流程图进行了简要介绍。它包含了第 1 章–第 6 章中出现的某些程序的示例流程图。\n\n流程图是描述程序“流”的图表。它包含了代表程序中每一步骤的符号。图\
  \ N-1 是程序 1-1 的流程图，该程序是第 1 章中的工资计算程序。\n\n# 图 N-1\n\n![流程图显示了程序 8 个步骤的逻辑。流程图用不同的符号显示了处理步骤。](img/FG_AppN_001.png)图\
  \ N-1 完整备用文本\n\n注意此流程图中三类型的符号：圆角矩形（代表终点）、四边形（代表输入/输出操作）和矩形（代表处理过程）。\n\n![图表显示了 3\
  \ 个流程图符号及其标签。](img/UNFG_AppN_001.png)N.1-1 完整替代文本\n\n圆角矩形或终点表示流程图的起点和终点。四边形指定输入或输出操作。矩形描绘了过程，例如数学计算或变量赋值。注意这些符号用箭头连接，箭头指示了程序流的方向。\n\
  \n# 连接器\n\n有时流程图会被拆分成两个或多个更小的图表。这通常在流程图无法放在单页纸上或必须分成若干部分时进行。连接器符号（内部带有字母或数字的小圆圈）允许你连接两个流程图。\n\
  \n![插图显示了一个内部带有字母“A”的圆圈。](img/UNFG_AppN_002.png)\n\n在图 N-2 中，A 连接器表示第二个流程图段开始于第一个流程图段结束的地方。\n\
  \n# 图 N-2\n\n![图表显示了流程图的 2 部分。第一个流程图显示了终点“START”、两个顺序执行的步骤以及连接器“A”。第二个流程图显示了连接器“A”、两个顺序执行的步骤以及终点“END”。](img/FG_AppN_002.png)\n\
  \n# 流程图结构\n\n有四种通用的流程图结构：\n\n*   顺序结构（Sequence）\n*   选择结构（Decision）\n*   分支结构（Case）\n\
  *   重复结构（Repetition）\n\n顺序结构表示一组按顺序执行的动作或步骤。工资计算程序的流程图就是顺序结构的示例。下方的图 N-3 所示的流程图也是顺序结构。它描绘了程序\
  \ 2-20 中执行的步骤，自第 2 章开始。\n\n![流程图显示了一个顺序步骤。](img/FG_AppN_003.png)图 N-3 完整备用文本\n\n\
  图 N-4 所示的流程图是另一个顺序结构，它描绘了第 3 章中程序 3-11 中执行的步骤。注意使用连接器来链接两个流程图段。\n\n![显示带有连接器的 2\
  \ 部分流程图。](img/FG_AppN_004.png)图 N-4 完整备用文本\n\n# 选择结构\n\n在选择结构中，下一个要执行的操作取决于真/假测试的结果。在最简单的选择结构中，如果测试结果为真，则执行一组指令；如果结果为假，则跳过这些指令。流程图中使用一个新的菱形符号表示被测试的真/假语句。图\
  \ N-5 显示了该选择结构的通用形式。\n\n![图表显示了一个选择结构。](img/FG_AppN_005.png)图 N-5 完整备用文本\n\n图 N-6\
  \ 说明了该选择结构的使用。在这个流程图中，对称为条件的语句 `x < y` 进行了测试。如果该条件为真，则执行过程 A 中的语句。如果条件为假，则跳过过程 A\
  \ 的语句。这种选择结构在 C++ 中编码为 `if` 语句。\n\n![图表显示了一个选择结构。](img/FG_AppN_006.png)图 N-6 完整备用文本\n\
  \n稍微复杂一点的选择结构允许在测试条件为真时执行一组语句，在测试条件为假时执行另一组语句。图 N-7 说明了这种形式的选择结构。\n\n![图表显示了一个选择结构。](img/FG_AppN_007.png)图\
  \ N-7 完整备用文本\n\n图 N-8 显示了一个流程图段，其中再次对语句 `x < y` 进行了测试。但这次执行的不同的过程取决于 `x < y` 的结果是真还是假。如果为真，则执行过程\
  \ A 的语句；如果为假，则改为执行过程 B 的语句。\n\n![图表显示了一个选择结构。](img/FG_AppN_008.png)图 N-8 完整备用文本\n\
  \n图 N-9 显示了一个流程图，它描绘了程序 4-3 的逻辑，自第 4 章。该选择结构根据表达式 `number % 2` 的值，在屏幕上显示两种可能的消息之一。注意在[程序\
  \ 4-3]中，C++ 使用 `if/else` 语句来实现这种选择结构。\n\n![流程图显示了程序的逻辑。](img/FG_AppN_009.png)图 N-9\
  \ 完整备用文本\n\n# 分支结构\n\n分支结构是一种更复杂的选择结构形式，根据整数或字符变量或整数表达式的值，可以采取许多不同的操作。图 N-10 显示了分支结构的通用形式。\n\
  \n\n\n\n![图表说明了分支结构。图表显示了一个决策框。框的输出分为 4 条路径，每条路径都指向一个不同的过程。每个过程的输出汇汇在一起。](img/FG_AppN_010.png)\n\
  \n图 N-11 所示的流程图描述了程序 4-23 的逻辑，该程序也来自第 4 章。程序 4-23 说明了 C++ 如何使用 `switch` 语句来实现分支结构。在该程序中，将根据变量\
  \ `choice` 中存储的值遵循四条可能路径中的某一条。\n\n# 图 N-11\n\n![流程图显示了程序的逻辑。](img/FG_AppN_011.png)图\
  \ N-11 完整备用文本文本\n\n# 重复结构\n\n重复结构表示一段重复执行的程序代码块。这种结构通常被称为循环。图 N-12 展示了一个重复结构的示例。\n\
  \n# 图 N-12\n\n![图表说明了重复结构。](img/FG_AppN_012.png)图 N-12 完整备用文本文本\n\n注意菱形符号的使用。重复结构会测试一个语句，该语句指示是否存在某个条件。如果该语句为真（意味着条件存在），则执行一组操作。然后再次测试该语句。如果它仍然为真，则条件仍然存在并重复这些操作。这会一直持续，直到语句不再为真。\n\
  \n在刚刚显示的流程图分段中，测试了语句 `x < y`。如果为真，则执行组成过程 A 的语句并再次评估 `x < y`。只要 x 小于 y，就会重复过程 A。当\
  \ x 不再小于 y 时，重复停止并退出该结构。\n\n重复结构有两种形式：前测试和后测试。前测试结构在执行一个操作或一组操作*之前*测试其条件。我们刚刚检查的流程图分段说明了一个前测试结构。注意，如果条件\
  \ `x < y` 初始为假，则过程 A 完全不会执行。前测试重复结构在 C++ 中被编码为 `while` 循环或 `for` 循环。\n\n后测试重复结构在执行一个操作或一组操作*之后*测试其条件。这种循环始终至少执行一次其代码。图\
  \ N-13 展示了一个代表后测试结构的流程图分段。\n\n# 图 N-13\n\n![图表说明了后测试重复结构。](img/FG_AppN_013.png)图\
  \ N-13 完整备用文本文本\n\n后测试重复结构在 C++ 中被编码为 `do-while` 循环。\n\n图 N-14 显示了一个描述程序 5-6 逻辑的流程图，该程序出现在第\
  \ 5 章。它使用了前测试循环。\n\n# 图 N-14\n\n![流程图说明了前测试循环。](img/FG_AppN_014.png)图 N-14 完整备用文本文本\n\
  \n# 模块\n\n程序模块（如 C++ 中的函数）在流程图中由此符号表示。\n\n![插图显示了一个矩形。插图还显示了矩形两端的各一条垂直线。](img/FG_AppN_003.png)\n\
  \n图 N-15 说明了符号所在处执行的代码。\n\n# 图 N-15\n\n![流程图显示了逻辑。](img/FG_AppN_015.png)图 N-15 完整备用文本文本\n\
  \n然后可以为模块构建一个独立的流程图。图 N-16 显示了程序 6-14](#fileP700101608900000000000000004B1D.xhtml_P700101608900000000000000004B26)\
  \ `main` 函数的流程图，该程序出现在第 6 章。注意它是如何“调用”几个其他模块的。这些其他模块中的每一个都执行程序的某些部分。\n\n# 图 N-16\n\
  \n![流程图显示了程序的逻辑。](img/FG_AppN_016.png)图 N-16 完整备用文本文本\n\n1. [#fileP700101608900000000000000017DC.xhtml_r__P700101608900000000000000023E6]该规则的唯一例外是\
