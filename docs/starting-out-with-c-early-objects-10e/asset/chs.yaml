  \n## 编程挑战\n\n## 1. ASCII 码字符\n\n编写一个程序，使用循环显示每个 ASCII 码 32 到 127 对应的字符。每行显示 16 个字符，字符之间留一个空格。\n\
  \n## 2. 数字之和\n\n编写一个程序，要求用户输入一个正整数，并使用循环验证输入。然后，程序应使用第二个循环计算从 1 到输入数字的所有整数之和。例如，如果用户输入\
  \ 20，循环将找到 1 + 2 + 3 + 3 + + 20 的和。\n\n## 3. 行程距离\n\n车辆行驶距离可以通过如下方式计算：\n\n```\n\
  distance = speed * time\n```\n\n例如，如果一列火车以每小时 40 英里的速度行驶 3 小时，则行驶距离为 120 英里。\n\n\
  编写一个程序，要求用户输入车辆的速度（英里/小时）以及行驶的小时。然后它应使用循环显示在该时间段每小时结束时的总行驶距离。以下是输出示例：\n\n```\nWhat\
  \ is the speed of the vehicle in mph? 40\nHow many hours has it traveled? 3\n\n\
  Hour         Miles Traveled\n----------------------------\n 1                40\n\
  \ 2                80\n 3               120\n```\n\n## 4. 摄氏度华氏度表\n\n在之前的编程挑战中，你被要求编写一个将摄氏度温度转换为华氏度的程序。修改该程序，使其使用循环显示从\
  \ 0 到 30 的摄氏度温度及其对应的华氏温度的表格。\n\n`F = 9/5*C + 32`\n\n## 5. 速度转换表\n\n编写一个程序，显示每小时公里（kph）的速度表，并将其值转换为每小时英里（mph）。表格应显示从每小时\
  \ 40 公里到每小时 120 公里的速度，增量为每小时 10 公里。换句话，它应该显示 40 kph、50 kph、60 kph 等，一直到 120 kph。\n\
  \n`mph = kph⁰.6214`\n\n## 6. 海洋水位\n\n假设地球海洋水位继续以每年约 3.1 毫米的速度上升，编写一个程序，显示未来 25 年每年海洋上升的累计（总计）毫米数。\n\
  \n## 7. 圆面积\n\n计算圆面积的公式为 area=PI*radius²，因此如果半径翻倍，面积将变为四倍。编写一个程序，创建一个显示从 1 开始的圆半径和面积的表格。\n\
  \n## 8. 硬币工资\n\n编写一个程序，如果工资是第一天赚 1 个硬币，第二天赚 2 个硬币，第三天赚 4 个硬币，以此类推每天翻倍，计算一个人一个月能赚多少。程序应要求用户输入工作天数，验证是否在\
  \ 1 到 31 天之间，然后显示总收益。\n\n## 9. 减肥\n\n如果中运动的人每天减少 500 卡路里的摄入，通常每个月可以减轻 4 磅。编写一个程序让用户输入初始体重，然后创建一个表格，显示如果他们坚持这种计划，未来\
  \ 6 个月每月预期体重。\n\n## 10. 热量消耗\n\n在特定的跑步机上跑步，你每分钟消耗 3.9 卡路里。编写一个程序，使用循环显示 5、10、15、20、25\
  \ 和 30 分钟后消耗的热量数。\n\n## 11. 会费上涨\n\n某目前每年会费为 3000 美元的俱乐部宣布，未来五年内其会费每年上涨 3%。编写一个程序，使用循环显示未来五年的预测费用。\n\
  \n## 12. 随机数猜游戏\n\n编写一个程序，生成一个 1 到 100 之间的随机数，并让用户猜数字是多少。如果用户的猜测高于随机数，程序应显示“太高了，再试”。如果用户的猜测低于随机数，程序应显示“太低了，再试”。程序应使用循环重复，直到用户正确猜中随机数。然后程序显示“恭喜，你猜出了我的数字。”\n\
  \n## 13. 随机数猜游戏增强\n\n增强为编程挑战 12 编写的程序，使其记录用户猜测的次数。当用户正确猜中随机数时，程序应连同恭喜信息一起显示次数。\n\
  \n## 14. 最大与最小\n\n编写一个带有循环的程序，让用户输入一系列整数，最后用哨兵 −99 表示序列结束。在输入所有数字后，程序应显示输入的最大和最小数字。\n\
