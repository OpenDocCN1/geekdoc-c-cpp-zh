  \ and Logic Unit\n\n## 算法工作台\n\n28. **可用额度**：为一个计算可用额度的程序设计层级图。该程序应执行以下操作：\n   \
  \ * 显示消息“输入最大额度。”\n    * 等待用户输入。\n    * 显示消息“输入使用金额。”\n    * 等待用户输入。\n    * 从最大额度减去使用的额度。\n\
  \    * 显示可用额度。\n\n29. **账户**：为一个计算余额的程序编写高级和详细伪代码。该程序应询问：\n    * 初始余额\n    * 总存款金额\n\
  \    * 总取款金额\n    一旦输入这些信息，显示当前余额。\n\n30. **销售税**：为一个计算销售税的程序编写高级和详细伪代码。该程序应询问：\n\
  \    * 所购商品的零售价\n    * 销售税率\n    一旦输入这些信息，显示总额。\n\n## 预测输出\n\n如果以下内容是实际程序，每个项会显示什么？\n\
