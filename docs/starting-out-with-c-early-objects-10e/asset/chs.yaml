  # 第 9 章\n\n## 9.1 线性搜索与二分搜索\n线性搜索算法简单地使用循环遍历数组的每个元素，将每个元素的值与要搜索的值进行比较。二分搜索算法要求数组中的值按顺序排序，它从数组的中间元素开始搜索。如果中间元素的值大于要搜索的值，算法下一步将测试数组前半部分中间的元素。如果中间元素的值小于要搜索的值，算法下一步将测试数组后半部分中间的元素。每当数组测试一个数组元素且未找到要搜索的值时，它就会排除剩余部分的一半。这种方法一直持续，直到找到该值，或者没有更多元素可以测试。二分搜索比线性搜索更高效。\n\
  \n\n\n\n\n## 9.2 升序排序意味着将数据值从小到大排列。降序排序意味着将数据值从大到小排列。\n\n## 9.3 值必须按升序或降序顺序排列。\n\
