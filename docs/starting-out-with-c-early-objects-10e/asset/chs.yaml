  \n将浮点变量赋予整数变量具有相同的效果。例如，看以下代码。\n\n```\nint intVar;\ndouble doubleVar = 7.8;\nintVar\
  \ = doubleVar;       // 将 7 赋值给 intVar\n                          // doubleVar 保持为\
  \ 7.8\n```\n\n## Warning!\n\n浮点变量可以比整数变量更大的范围的值。如果将浮点值存储在整数变量中，而该值的整数部分（小数点前的）对于整数变量来说太大，则整数变量将存储一个无效值。\n\
