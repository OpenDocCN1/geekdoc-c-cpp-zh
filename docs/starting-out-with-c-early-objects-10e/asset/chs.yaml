  \ == false)\n```\n\n# 4.8 验证用户输入\n\n### 概念\n\n只要程序的用户输入错误的输入，程序就会产生错误的输出。编写程序时应该过滤掉错误的输入。\n\
  \n计算机世界有一句名言是“垃圾进，垃圾出”（garbage in, garbage out）。程序输出的完整性完全取决于它的输入，因此你应该尽量确保垃圾不会进入你的程序。*输入验证*是检查用户提供给程序的信息并判断其是否有效的过程。良好的程序应该对可接受的输入类型给出的指令，但仍然不能假设用户已经遵循了这些指令。以下是程序执行的几个输入验证示例：\n\
  \n* 检查数字以确保它们在可能取值的范围内。例如，一周有 168 小时。一个人在一周内工作时间超过 168 小时是不可能的。\n* 检查值的“合理性”。虽然一个人每周工作\
  \ 168 小时可能是可能的，但并不太可能。\n* 检查从菜单或其他选择集中选中的项目，以确保它们是可用选项。\n* 检查变量是否存在可能导致问题的值，例如除以零。\n\
  \n程序 4-16 是一个测试评分程序，它拒绝任何小于 0 或大于 100 的分数。\n\n在第 5 章中你将学习一种更好的验证输入数据的方法。\n\n# 4.9\
  \ 关于块和作用域的更多信息\n\n### 概念\n\n变量的作用域限于定义它的块。\n\nC++ 允许你在程序的几乎任何地方创建变量。一种常见的做法是将函数的所有变量定义在函数的顶部，紧跟标记函数体开始的左括号之后。然而，特别是在较长的程序中，变量有时定义在程序中使用它们的地方。只要它们在使用之前被定义，这是允许的。\n\
  \n你在本章的早期部分已经了解到，用大括号包含一个或多个编程语句定义了一个代码块。函数 `main` 的体必须被大括号包含，是一个代码块。`if/else` 语句中与\
  \ `if` 或 `else` 相关的语句集也是如此。每当在块内部定义变量时（你可以在任何块内部定义变量），它的作用域就是程序中从定义处到块右括号之间的部分。因此，定义在函数顶部的变量的作用域本质上是整个函数，而在内部块中定义的变量的作用域只是该块。\n\
