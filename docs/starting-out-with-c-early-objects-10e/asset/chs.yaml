  \ PIN 副本。（PIN 在数据库中也存储为四个元素的数组。）如果这两个数字匹配，则说明客户的身份得到验证。你的函数应该比较这两个数组并确定它们是否包含相同的数字。\n\
  \n我们将该函数命名为 `testPIN`。以下是它必须满足的规范。\n\n\n\n\n\n| 参数 | 该函数应接受三个参数。第一个是存储客户输入的数字的数组。第二个是存储客户正确\
  \ PIN 码数字的数组，该数组是从银行数据库中检索的。最后一个参数表示 PIN 码的数字位数。在程序中，此值被设置为 4。然而，通过将此参数传递给函数，如果银行决定更改\
  \ PIN 尺寸，将使程序未来更于更新。 |\n| 返回值 | 如果两个数组相同，该函数应返回布尔值 `true`。否则，它应返回 `false`。 |\n\n\
  以下是 `testPIN` 函数的伪代码：\n\n```\n 对于第一个数组中的每个元素\n   将该元素与第 2 个数组中对应的元素进行比较\n   如果两个元素的值不同\n\
