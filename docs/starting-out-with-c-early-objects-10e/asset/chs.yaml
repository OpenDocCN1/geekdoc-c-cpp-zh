  程序 1 \n\n图 18-8 所示的情况。\n\n\n\n\n`remove` 成员函数使用指针 `nodePtr` 来搜索包含要删除值 `number` 的节点。在此过程中，第二个指针\
  \ `previousNodePtr` 紧随 `nodePtr` 之后，始终指向 `nodePtr` 所指节点的前一个节点。当 `nodePtr` 指向要删除的节点时，将\
  \ `previousNodePtr->next` 设置为 `nodePtr->next`。这会导致列表中的后继指针跳过包含 `number` 的节点，从而允许使用\
  \ `delete` 释放其内存。整个函数所示：\n\n```cpp\n 25 //**********************************************\n\
  26 // Removes a number from a list. The function  *\n27 // does not assume that\
  \ the list is sorted.    *\n28 //**********************************************\n\
  29 void NumberList::remove(double number)\n30 {\n31   ListNode *nodePtr, *previousNodePtr;\n\
  33\n34    // 如果列表为空，则什么都不做\n35    if (!head) return;\n36\n36    // 确定第一个节点是否为删除的节点\n\
  37    if (head->value == number)\n38    {\n39      nodePtr = head;\n40      head\
  \ = head->next;\n41      delete nodePtr;\n42    }\n43    else\n44    {\n45     \
  \ // 将 nodePtr 初始化为列表头部\n46      nodePtr = head;\n47\n48      // 跳过值成员不等于 number\
  \ 的节点\n49      while (nodePtr != nullptr && nodePtr->value != number)\n50      {\n\
  51         previousNodePtr = nodePtr;\n52         nodePtr = nodePtr->next;\n53 \
  \     }\n54      // 将前一个节点连接到 nodePtr 之后的节点\n55      // 节点，然后删除 nodePtr\n56    \
  \  if (nodePtr)\n57      {\n58         previousNodePtr->next = nodePtr->next;\n\
  59         delete nodePtr;\n60      }\n61    }\n62 }\n```\n\n注意，`remove()` 函数是 `NumberList`\
  \ 的成员，而不是 `SortedNumberList`。与 `add()` 不同，`remove()` 函数同时适用于有序和无序列表，因此不需要重写。在书籍配套网站上找到\
