  \n# 第 17 章 标准模板库\n\n# 17.1 标准模板库简介\n\n### 概念\n\n标准模板库是用于实用数据结构和算法的广泛模板集合。\n\n除了你在整本书中使用的运行时库外，C++\
  \ 还提供了一个广泛的模板库。标准模板库（或 `STL`）包含了许多类和函数的模板。STL 中的大多数模板可以归类为以下几类：\n\n# 17.2 STL 容器和迭代器基础\n\
  \n### 概念\n\n容器是包含值集合的对象。迭代器是用于遍历元素的对象。\n\n## 容器\n\nSTL 中有两种容器：*序列*（sequence）和*关联*（associative）。序列容器通过*位置*存储值：第一个放置的项放在\
  \ 0 位，第二个放在 1 位，第三个放在 2 位，此类推。\n\nSTL 目前提供的序列容器如表 17-1 所示。相比之下，关联容器不按整数位置存储元素。相反，要存储的值与另一个称为*键*（key）的值相关联。你可以将键看作序列容器中索引的角色。\n\
  \n# 表 17-1 序列容器\n\n| 容器类 | 描述 |\n| --- | --- |\n| `array` | 一种类似于数组的固定大小容器。 |\n\
  | `deque` | 双端队列。类似于 `vector`，但设计上可以从两端快速添加或删除值。（该容器将在第 19 章讨论。） |\n| `forward_list`\
  \ | 单向链表数据元素。可以在任何位置插入或删除元素。（该容器将在第 18 章讨论。） |\n| `list` | 双向链表数据元素。可以在任何位置插入或删除元素。（该容器将在第\
  \ 18 章讨论。） |\n| `vector` | 一种工作方式类似于可扩展数组的容器。可以在向量的任何位置添加或删除值。向量会自动调整其大小以容纳其包含的元素数量。\
  \ |\n\n\n\n\n\nSTL 目前提供的关联容器列在表 17-2 中。（注意，`deque` 容器将在第 19 章和 17-2 中列出的类之外，STL\
  \ 还提供了表 17-3 中列出的三种容器适配器类。容器`适配器类`本身不是容器，而是一个将其他容器适配到特定用途的类。你可以将适配器理解为一种特殊的“容器”，它将元素的存储委托给另一个容器。注意，我们将在第\
  \ 19 章中讨论这些类。\n\n# 表 17-3 容器适配器类\n\n| 容器适配器类 | 说明 |\n| --- | --- |\n| `stack` |\
  \ 一种在 `deque`（默认）中存储元素的适配器类。`stack` 是后进先出（LIFO）容器。当你从 `stack` 中检索元素时，`stack` 总是给你最后插入的那个元素。（该类将在第\
  \ 19 章中讨论。） |\n| `queue` | 一种在 `deque`（默认）中存储元素的适配器类。`queue` 是先进后出（FIFO）容器。当你从队列中检索元素时，队列总是给你被插入的第一个（或最早的）元素。（该类将在第\
  \ 19 章中讨论。） |\n| `priority_queue` | 一种在 `vector`（默认）中存储元素的适配器类。在这种数据结构中，每个存储的值都分配有一个优先级，你检索到的元素总是具有最高优先级的元素。（该类将在第\
  \ 19 章中讨论。） |\n\n容器和容器适配器类在不同的 STL 文件声明。表 17-4 列出了根据你打算使用的容器所需的所需的头文件。\n\n# 表 17-4\
  \ 头文件\n\n| 头文件 | 类 |\n| --- | --- |\n| `<array>` | `array` |\n| `<deque>` | `deque`\
  \ |\n| `<forward_list>` | `forward_list` |\n| `<map>` | `map`, `multimap` |\n| `<queue>`\
  \ | `queue`, `priority_queue` |\n| `<set>` | `set`, `multiset` |\n| `<stack>` |\
  \ `stack` |\n| `<unordered_map>` | `unordered_map`, `unordered_multimap` |\n| `<unordered_set>`\
  \ | `unordered_set`, `unordered_multiset` |\n| `<vector>` | `vector` |\n\n# `array`\
  \ 类介绍\n\nSTL 中可能最简单的容器是 `array` 类，它是在 C++11 中引入的。`array` 对象的工作方式与普通数组非常相似。它是一个固定大小的容器。`array`\
  \ 实际上是对普通数组的封装。它是一个持有元素的固定大小容器。`array` 对象相比普通数组的优势在于它有一个 `size()` 成员函数可以返回元素的数量。\n\
  \n当你定义 `array` 对象时，必须指定其类型和元素的数量。例如：\n\n```cpp\narray<int, 5> numbers;\n```\n\n\
  该语句定义了一个名为 `numbers` 的 `array` 对象。可以使用初始化列表：\n\n```cpp\narray<int, 5> numbers =\
  \ {1, 2, 3, 4, 5};\n```\n\n这是一个持有字符串的 `array` 定义：\n\n```cpp\narray<string, 4> names\
  \ = {\"Jamie\", \"Ashley\", \"Doug\", \"Claire\"};\n```\n\n`array` 类重载了 `[]` 运算符，让你像使用普通数组一样使用索引。[程序\
  \ 17-1] 演示了创建、初始化和显示 `array` 元素：\n\n* 第 11 行语句定义了一个带有字符串的 `array` 对象。\n* 第 15 到\
  \ 16 行的 `for` 循环显示了所有的字符串。注意循环测试表达式使用了 `array` 对象的 `size()` 成员函数。\n* 第 16 行使用 `[]`\
  \ 运算符访问了对象的元素。\n\n第 15 到 16 行的 `for` 循环对于演示 `array` 类的 `size()` 成员函数有用，但我们可以轻松地将其重写为范围\
  \ `for` 循环：\n\n```cpp\nfor (auto element : names)\n   cout << element << endl;\n\
  ```\n\n### 警告！\n\n`array` 类的 `[]` 运算符不进行边界检查。与普通数组一样，你必须小心不要越界索引。\n\n你可以看到，`array`\
  \ 类是 C++ 中传统数组的对象对象替代方案。`array` 类还提供了几个提供额外功能的成员函数。[表 17-5] 列出了 `array` 类的成员函数。\n\
  \n# 表 17-5 `array` 成员函数\n\n| 成员函数 | 说明 |\n| --- | --- |\n| `at(index)` | 返回指定索引元素的引用。如果索引越界，该函数将抛出\
  \ `out_of_range` 异常。 |\n| `back()` | 返回容器最后一个元素的引用。 |\n| `begin()` | 返回指向容器第一个元素的迭代器。\
  \ |\n| `cbegin()` | 返回指向容器第一个元素的常量迭代器。 |\n| `cend()` | 返回指向容器结尾的常量迭代器。 |\n| `crbegin()`\
  \ | 返回指向容器最后一个元素的常量反向迭代器。 |\n| `crend()` | 返回指向容器第一个元素的常量反向迭代器。 |\n| `data()` |\
  \ 返回指向容器第一个元素的指针。 |\n\n\n\n\n\n## 容器成员函数参考\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `empty()`\
  \ | 如果容器为空则返回 `true`，否则返回 `false`。 |\n| `end()` | 返回指向容器末尾的迭代器。 |\n| `fill(value)`\
  \ | 将每个元素的值设置为 `value`。 |\n| `front()` | 返回容器中第一个元素的引用。 |\n| `max_size()` | 返回容器中的元素数量（与\
  \ `size()` 成员函数返回的值相同）。 |\n| `rbegin()` | 返回一个指向容器最后一个元素的 `reverse_iterator`（反向迭代器）。\
  \ |\n| `rend()` | 返回一个指向容器第一个元素的 `reverse_iterator`（反向迭代器）。 |\n| `size()` | 返回容器中的元素数量。\
  \ |\n| `swap(second)` | `second` 参数必须是一个与调用对象类型和大小相同的 `array` 对象。该函数交换调用对象与 `second`\
  \ 对象的内容。 |\n\n请注意，上面列出的许多成员函数都返回迭代器。迭代器是 STL 的基础部分，因此理解它们非常重要。\n\n# 迭代器\n\n迭代器是工作类似于指针的对象，用于访问存储在容器中的数据。顾顾名，你可以使用迭代器来遍历容器的内容。目前一共有五类类迭代器。\n\
  \n## 表 17-6 迭代器的分类\n\n| 迭代器类别 | 描述 |\n| :--- | :--- |\n| 正向 (Forward) | 可以在容器中向前移动（使用\
  \ `++` 运算符）。 |\n| 双向 (Bidirectional) | 也可以向后移动的正向迭代器（使用 `++` 和 `--` 运算符）。 |\n| 随机访问\
  \ (Random access) | 双向迭代器，可以跳转到相对于当前位置偏移量指定的元素。 |\n| 输入 (Input) | 可以与输入流配合，从输入设备或文件读取数据。\
  \ |\n| 输出 (Output) | 可以与输出流配合，向输出设备或文件写入数据。 |\n\n迭代器与容器相关。你使用的容器类型决定了你使用的迭代器类别。例如：\n\
  \n- `array`、`vector` 和 `deque` 容器使用随机访问迭代器。\n- `list`、`set`、`multiset`、`map` 和 `multimap`\
  \ 容器使用双向迭代器。\n- `forward_list`、`unordered_map`、`unordered_multimap`、`unordered_set`\
  \ 和 `unordered_multiset` 容器使用正向迭代器。\n\n迭代器在以下方面类似于指针：\n\n- 迭代器可以指向容器中的一个元素。\n- 你可以使用\
  \ `*` 运算符对迭代器进行解引用，获取它指向的元素。\n- 当迭代器指向一个对象时，你可以使用 `->` 运算符访问对象的成员。\n- 你可以使用 `=`\
  \ 运算符为迭代器所引用的容器元素赋值。\n- 你可以使用 `==` 和 `!=` 运算符比较两个迭代器。\n- 你可以使用 `++` 运算符递增迭代器，从而将其移动到容器中的下一个元素。你还可以使用\
  \ `+` 运算符为随机访问迭代器增加一个整数，从而在容器中向前移动指定数量的元素。\n- 如果你使用的是双向迭代器，可以使用 `--` 运算符递减迭代器，从而将其移动到容器中的上一个元素。你还可以使用\
  \ `-` 运算符从随机访问迭代器减去整数，从而在容器中向后移动指定数量的元素。\n\n# 定义迭代器\n\n在定义迭代器之前，你必须知道你想与哪种类型的容器配合迭代器。迭代器定义的通用格式为：\n\
  \n```\ncontainerType::iterator iteratorName;\n```\n\n在通用格式中，`containerType` 是 STL\
  \ 容器类型，`iteratorName` 是你正在定义的迭代器变量名。例如，假设我们定义了如下 `array` 对象：\n\n```cpp\narray<string,\
  \ 3> names = {\"Sarah\", \"William\", \"Alfredo\"};\n```\n\n我们可以通过以下语句定义一个与 `array`\
  \ 对象协同工作的迭代器：\n\n```cpp\narray<string, 3>::iterator it;\n```\n\n该语句定义了一个名为 `it`\
  \ 的迭代器，它可以用于 `array<string, 3>` 对象。编译器会自动选择正确类型的迭代器（在本例情况下，是随机访问迭代器）。\n\n# 从容器对象获取迭代器\n\
  \nSTL 中所有的容器类都提供一个 `begin()` 成员函数和一个 `end()` 成员函数。`begin()` 成员函数非常直观：它返回一个指向容器中第一个元素的迭代器。例如，以下代码段执行了以下操作：\n\
  \n1. 它定义了一个带有三个字符串的 `array` 对象。\n2. 它为该 `array` 对象定义了一个迭代器。\n3. 它让迭代器指向 `array`\
  \ 对象的第一个元素。\n4. 它使用 `*` 运算符对迭代器解引用。\n\n`end()` 成员函数返回一个指向最后一个元素*之后*位置的迭代器。这意味着它返回的迭代器并不指向元素，而是指向容器的末尾。\n\
  \n```cpp\n// 定义一个 array 对象。\narray<string, 3> names = {\"Sarah\", \"William\", \"\
  Alfredo\"};\n\n// 为 array 对象定义迭代器。\narray<string, 3>::iterator it;\n\n// 让迭代器指向\
  \ array 对象的第一个元素。\nit = names.begin();\n\n// 显示迭代器指向的元素。\ncout << *it << endl;\n\
  ```\n\n你通常使用 `end()` 成员函数来让遍历范围的算法何时何时到达末尾。例如，以下代码段显示了使用 `while` 循环显示 `array` 对象的内容：\n\
  \n```cpp\n// 定义一个 array 对象。\narray<string, 3> names = {\"Sarah\", \"William\", \"\
  Alfredo\"};\n\n// 为 array 对象定义迭代器。\narray<string, 3>::iterator it;\n\n// 让迭代器指向\
  \ array 对象的第一个元素。\nit = names.begin();\n\n// 显示 array 对象的内容。\nwhile (it != names.end())\n\
  {\n   cout << *it << endl;\n   it++;\n}\n```\n\n之前显示的代码可以通过 `for` 循环代替 `while` 循环来稍微缩短。\n\
  \n# 使用 `auto` 定义迭代器\n\n很多时候，你可以使用 `auto` 来简化迭代器的定义。例如，每当你使用 `begin()` 等成员函数返回的值来初始化迭代器时，你都可以在迭代器的声明中使用\
  \ `auto`。例如，请看以下代码：\n\n```cpp\narray<string, 3> names = {\"Sarah\", \"William\"\
  , \"Alfredo\"};\narray<string, 3>::iterator it = names.begin();\n```\n\n第二个语句定义了一个名为\
  \ `it` 的迭代器，并调用 `names.begin()` 成员函数对其进行初始化。该语句可以重写为如下所示：\n\n```cpp\narray<string,\
  \ 3> names = {\"Sarah\", \"William\", \"Alfredo\"};\nauto it = names.begin();\n\
  ```\n\n\n\n\n第二语句中显示的 `auto` 声明之所以有效，是因为 `names.begin()` 函数返回一个 `array<string, 3>::iterator`\
  \ 类型的对象。因此，编译器可以确定 `it` 应该是一个 `array<string, 3>::iterator` 类型的对象。这在使用迭代器遍历容器元素的\
  \ `for` 循环中特别有用。例如，查看程序 17-3。它与程序程序 17-2 类似，但在这个版本中，迭代器是在 `for` 循环的初始化表达式（第 15 行）中用\
  \ `auto` 声明的。\n\n# 可变迭代器与 `const_iterator`\n\n`iterator` 类型的迭代器允许你对迭代器指向的元素进行读/写访问。这通常被称为可变迭代器。下面的代码片段展示了一个示例：\n\
  \n```\n// 定义一个数组对象。\narray<int, 5> numbers = {1, 2, 3, 4, 5};\n\n// 为数组对象定义一个迭代器。\n\
  array<int, 5>::iterator it;\n\n// 使迭代器指向数组对象的第一个元素。\nit = numbers.begin();\n\n//\
  \ 使用迭代器修改元素。\n*it = 99;\n```\n\n在段代码片段中，`numbers` 对象最初包含值 1, 2, 3, 4 和 5。最后一条语句引用了\
  \ `it` 迭代器（它指向第一个元素），并将元素的值改为 99。执行最后一条语句后，`numbers` 对象包含值 99, 2, 3, 4 和 5。\n\n\
  如果你想确保没有东西改变容器的内容，可以在定义容器时使用 `const` 修饰符，使容器的内容变为常量。这里有一个示例：\n\n```\nconst array<string,\
  \ 3> names = {\"Sarah\", \"William\", \"Alfredo\"};\n```\n\n这条语句将 `names` 定义为 `const`\
  \ `array` 对象。结果是容器中的元素是常量，不能被修改。（尝试修改容器的内容将在编译时导致错误。）如果我们需要一个迭代器与该对象配合，我们必须使用 `const_iterator`，它为其指向的任何元素提供只读访问。接下来的语句展示了如何定义\
  \ `const_iterator` 的示例：\n\n```\narray<string, 3>::const_iterator it;\n```\n\nSTL\
  \ 中的所有容器类都提供了 `cbegin()` 成员函数和 `cend()` 成员函数。`cbegin()` 成员函数返回指向容器中第一个元素的 `const_iterator`。`cend()`\
  \ 成员函数返回指向容器末尾的 `const_iterator`。在使用 `const_iterator` 时，只需使用容器类的 `cbegin()` 和 `cend()`\
  \ 成员函数，而不是 `begin()` 和 `end()` 成员函数。\n\n# 反向迭代器\n\n反向迭代器是一种反向工作的双向或随机访问迭代器，允许你反向遍历容器中的元素。使用反向迭代器时，容器中的最后一个元素被视为第一个元素，而第一个元素被视为最后一个元素。`++`\
  \ 运算符使反向迭代器向后移动，`--` 运算符使反向迭代器向前移动。\n\n以下 STL 容器支持使用反向迭代器：`array`、`deque`、`list`、`map`、`multimap`、`multiset`、`set`\
  \ 和 `vector`。所有这些类都提供了 `rbegin()` 成员函数和 `rend()` 成员函数。`rbegin()` 成员函数返回指向容器最后一个元素的反向迭代器`rend()`\
  \ 成员函数返回指向第一个元素之前位置的迭代器。这在图 17-2 中所示。\n\n# 图 17-2 由 `rbegin()` 和 `rend()` 成员函数返回的迭代器\n\
  \n![一个容器显示了 6 个矩形。](img/FG_17_002.png)图 17-2 完整替代文本\n\n要创建一个反向迭代器，将其定义为 `reverse_iterator`。下面的代码片段展示了使用反向迭代器按反序显示\
  \ `array` 对象内容的示例。\n\n```\n// 定义一个数组对象。\narray<int, 5> numbers = {1, 2, 3, 4, 5};\n\
  \n// 为数组对象定义一个反向迭代器。\narray<int, 5>::reverse_iterator it;\n\n// 按反序显示元素。\nfor (it\
  \ = numbers.rbegin(); it != numbers.rend(); it++)\n   cout << *it << endl;\n```\n\
  \n声明为 `iterator` 的迭代器是可变的，这意味着它们对指向的元素具有读写访问权限。如果你需要一个迭代器与常量对象配合，我们必须使用 `const_iterator`，它为其指向的任何元素提供只读访问。接下来的语句展示了如何定义\
  \ `const` 对象：\n\n```\nconst array<string, 3> names = {\"Sarah\", \"William\", \"\
  Alfredo\"};\narray<string, 3>::const_iterator it;\n```\n\n所有的容器类都提供了 `cbegin()`\
  \ 成员函数和 `cend()` 成员函数。`cbegin()` 成员函数返回指向容器中第一个元素的 `const_iterator`。`cend()` 成员函数返回指向容器末尾的\
  \ `const_iterator`。\n\n# 节点\n\n1. 17.1 STL 提供了哪两种容器？\n2. 17.2 什么是容器适配器？\n3. 17.3\
  \ 什么是迭代器？\n4. 17.4 假设你正在编写使用 `array`、`multimap` 和 `vector` 的程序。你需要 #include 哪些头文件？\n\
  5. 17.5 双向迭代器和随机访问迭代器的区别是什么？\n6. 17.6 `++` 运算符应用于迭代器时会做什么？\n7. 17.7 容器的 `begin()`\
  \ 和 `end()` 成员函数返回什么值？\n8. 17.8 可变迭代器和 `const_iterator` 的区别是什么？\n9. 17.9 什么是反向迭代器？\n\
  10. 17.10 容器的 `rbegin()` 和 `rend()` 成员函数返回什么值？\n\n# 17.3 `vector` 类\n\n### 概念\n\n\
  `vector` 是一种像数组但具有动态大小的序列容器。\n\n第 8 章介绍了 `vector` 类并讨论了该类的几个成员函数。在本节中，我们将深入研究该类，并讨论如何使用迭代器访问\
  \ `vector`。\n\n回顾我们之前的讨论，`vector` 存储元素的序列。事实上，`vector` 在内部使用数组来存储元素。然而，`vector`\
  \ 比数组有许多优势：\n\n*   在定义 `vector` 时不需要声明其大小。\n*   `vector` 的大小是动态的。你可以在运行时向其添加元素或删除元素。`vector`\
  \ 根据其包含的数量自动调整大小。\n*   `vector` 可以报告它包含的元素数量。\n\n要使用 `vector` 类，你需要在程序中 #include\
  \ `<vector>` 头文件。然后，你可以使用四个 `vector` 构造函数之一来定义 `vector` 对象。表 17-7 显示了使用每个构造函数定义\
  \ `vector`语句的通用格式。\n\n# 表 17-7 `vector` 类构造函数\n\n| |  |\n| :--- | :--- |\n| **默认构造函数**\
  \ | `vector<`*`dataType`*`>` *`name`*`;`创建一个空的 `vector` 对象。在通用格式中，*`dataType`* 是每个元素的数据类型，*`name`*\
  \ 是 `vector` 的名称。 |\n\n\n\n\n### 构造函数\n\n| **填充构造函数 (Fill constructor)** | `vector<dataType>name(size);`\
  \ 创建一个指定大小的 `vector` 对象。在通用格式中，`dataType` 是每个元素的数据类型，`name` 是 `vector` 的名称。`size`\
  \ 参数是一个无符号整数，用于指定 `vector` 初始拥有的元素个数。如果元素是对象，则通过它们的默认构造函数进行初始化。否则，元素将初始化为值 0。 |\n\
  | **填充构造函数 (Fill constructor)** | `vector<dataType>name(size, value);` 创建一个指定大小的\
  \ `vector` 对象，其中每个元素都被赋予一个指定的值。在通用格式中，`dataType` 是每个元素的数据类型，`name` 是 `vector` 的名称。`size`\
  \ 参数是一个无符号整数，用于指定 `vector` 初始拥有的元素个数，而 `value` 参数是填充每个元素的值。 |\n| **范围构造函数 (Range\
  \ constructor)** | `vector<dataType>name(iterator1, iterator2);` 创建一个初始包含两个迭代器指定的范围范围的\
  \ `vector` 对象。在通用格式中，`dataType` 是每个元素的数据类型，`name` 是 `vector` 的名称。`iterator1` 和 `iterator2`\
  \ 参数是指向另一个容器位置的迭代器。它们标记了该容器中将存储在此 `vector` 中的值范围的起始和结束位置。 |\n| **拷贝构造函数 (Copy constructor)**\
  \ | `vector<dataType>name(vector2);` 创建另一个 `vector` 或对象的拷贝的 `vector` 对象。在通用格式中，`dataType`\
  \ 是每个元素的数据类型，`name` 是 `vector` 的名称，`vector2` 是要拷贝的 `vector`。 |\n\n`vector` 和 `array`\
  \ 容器非常相似，并且定义了许多相同的成员函数。特别是，`vector` 类拥有迭代器函数，如 `begin()`、`end()`、`cbegin()`、`crbegin()`、`back()`、`front()`\
  \ 等。它还定义了成员函数 `at()`、`clear()`、`data()` 和 `empty()`。该类的其他成员函数见表 17-8。\n\n# 表 17-8\
  \ `vector` 成员函数\n\n| 成员函数 | 描述 |\n| --- | --- |\n| `assign(size, value)` | 调整 vector\
  \ 的大小并将所有元素设置为指定值。`size` 参数是一个无符号整数，用于指定 vector 的新大小。函数执行后，容器将拥有 `size` 个元素，每个元素都设置为\
  \ `value`。 |\n| `assign(it1, it2)` | 用指向另一个容器的迭代器指定的范围值替换 vector 中现有的元素。迭代器 `it1`\
  \ 和 `it2` 标记了将存储在此 vector 中的值范围的起始和结束位置。 |\n| `capacity()` | 返回容器底层数组在不重新分配数组的情况下可以容的元素个数。\
  \ |\n| `emplace(it, value)` | 以 `value` 为值构造一个新元素。`it` 参数是指向容器中现有元素的迭代器。新元素将插入到\
  \ `it` 所向的元素之前。 |\n| `emplace_back(value)` | 在容器末尾构造一个包含指定 `value` 的新元素。 |\n| `erase(it)`\
  \ | 删除迭代器 `it` 指向的元素。此函数返回指向被删除元素之后的元素的迭代器（如果被删除的元素是最后一个元素，则指向容器末尾）。 |\n| `erase(it1,\
  \ it2)` | 删除范围元素。迭代器 `it1` 和 `it2` 标记了将被删除的值范围的起始和结束位置。此函数返回指向被删除元素之后的元素的迭代器（如果删除的是最后一个元素，则指向容器末尾）。\
  \ |\n| `insert(it, value)` | 插入一个以 `value` 为值的新元素。`it` 参数是指向容器中现有元素的迭代器。新元素将插入到\
  \ `it` 所向的元素之前。该函数返回指向新插入元素的迭代器。 |\n| `insert(it, n, value)` | 插入 `n` 个以 `value`\
  \ 为值的新元素。`it` 参数是指向容器中现有元素的迭代器。新元素将插入到 `it` 所向的元素之前。该函数返回指向新插入元素的迭代器。 |\n| `insert(it,\
  \ it1, it2)` | 从另一个容器插入一个范围的新元素。`it` 参数是指向容器中现有元素的迭代器。 |\n| `insert(it1, it2, it3)`\
  \ | 从另一个容器插入一个范围的新元素。`it2` 和 `it3` 标记了将被插入的值范围的起始和结束位置。该函数返回指向第一个元素的迭代器。 |\n| `max_size()`\
  \ | 返回容器的最大大小。 |\n| `pop_back()` | 删除最后一个元素。 |\n| `push_back(value)` | 在末尾添加一个包含\
  \ `value` 的元素。 |\n| `resize(n)` | 调整容器的大小使其拥有 `n` 个元素。`n` 参数是一个无符号整数。 |\n| `resize(n,\
  \ value)` | 调整容器的大小使其拥有 `n` 个元素。`n` 参数是一个无符号整数。每个新元素都用 `value` 初始化。 |\n| `shrink_to_fit()`\
  \ | 调整 vector 使其容量等于大小。 |\n| `size()` | 返回容器中的元素个数。 |\n| `swap(second)` | `second`\
  \ 参数必须是与调用对象类型相同的 `vector`。函数交换调用对象和 `second` 对象的内容。 |\n\n#  `vector` 操作回顾\n\n以下是如何使用默认构造函数定义一个存储整数的\
  \ `vector` 容器的示例：\n\n```\nvector<int> numbers;\n```\n\n该语句定义了一个名为 `numbers` 的空 `vector`\
  \ 容器。在角括号 `<>` 中，`int` 是每个元素的类型。如果您使用的是符合 C++11 或更高的编译器，可以使用初始化列表来初始化 `vector`，如下：\n\
  \n```\nvector<int> numbers = {1, 2, 3, 4, 5};\n```\n\n这是一个定义存储字符串的 `vector` 的示例：\n\
  \n```\nvector<string> names = {\"Joe\", \"Karen\", \"Lisa\", \"Jackie\"};\n```\n\
  \n`vector` 类重载了 `[]` 运算符，让你能够使用下标访问元素，就像使用数组一样。程序 17-4 简单演示了创建和初始化 `vector` 对象并显示其元素。\n\
  \n请记住 `[]` 运算符也有其局限性。特别是，你只能访问 `vector` 中已经存在的元素。也就是说，你不能使用 `[]` 运算符向现有的 `vector`\
  \ 添加新元素。例如，以下代码在运行时会导致错误：\n\n\n\n\n\n```\nvector<int> numbers;             // 定义一个空的\
  \ vector\nnumbers[0] = 99;                 // 错误！\n```\n\n这段代码会导致错误，因为 `numbers`\
  \ 是一个空的 `vector`。因此元素 `numbers[0]` 并不存在。如果你想向 `vector` 添加新元素，必须使用 `vector` 类中为此目的而存在的成员函数。例如，`push_back()`\
  \ 成员函数会将新元素添加到容器的末尾。你只需要调用该函数并将新元素的值作为参数传递即可。以下代码显示了一个示例：\n\n```\nvector <int> numbers;\n\
  numbers.push_back(10);\nnumbers.push_back(20);\nnumbers.push_back(30);\n```\n\n\
  第一语句创建了一个名为 `numbers` 的空 `vector` 容器。随后的语句将值 10、20 和 30 添加到 `vector` 中。你可以使用 `at()`\
  \ 成员函数通过索引检索 `vector` 元素并带有边界检查。以下代码显示了一个示例：\n\n```\nvector<string> names = {\"\
  Joe\", \"Karen\", \"Lisa\"};\ncout << names.at(3) << endl;  // 抛出异常\n```\n\n此代码段的第一语句定义了一个包含\
  \ 3 个元素的 `vector`。“Joe”位于索引 0，“Karen”位于索引 1，“Lisa”位于索引 2。第二个语句试图显示索引 3 处的元素，但该元素并不存在。结果，`at()`\
  \ 成员函数抛出了 `out_of_range` 异常。\n\n# 在 `vector` 中使用迭代器\n\n`vector` 类支持以下类型的迭代器：\n\n\
  * `iterator`\n* `const_iterator`\n* `reverse_iterator`\n* `const_reverse_iterator`\n\
  \n因此，`vector` 类提供了以下成员函数来获取迭代器：`begin()`、`end()`、`cbegin()`、`cend()`、`rbegin()`、`rend()`、`crbegin()`\
  \ 和 `crend()`。这些成员函数的工作方式与它们的数组类对应项相同，并在 表 17-5 中进行了了描述。\n\n以下代码显示了使用迭代器显示 `vector`\
  \ 元素的示例。\n\n```\n// 创建一个包含名字的 vector。\nvector<string> names = {\"Joe\", \"Karen\"\
  , \"Lisa\", \"Jackie\"};\n\n// 创建一个迭代器。\nvector<string>::iterator it;\n\n// 使用迭代器显示\
  \ vector 中的每个元素。\nfor (it = names.begin(); it != names.end(); it++)\n{\n   cout\
  \ << *it << endl;\n}\n```\n\n我们可以通过在 `for` 循环的初始化表达式中使用 `auto` 声明迭代器来简化代码，如下所示：\n\
  \n```\n// 创建一个包含名字的 vector。\nvector<string> names = {\"Joe\", \"Karen\", \"Lisa\"\
  , \"Jackie\"};\n\n// 使用迭代器显示 vector 中的每个元素。\nfor (auto it = names.begin(); it !=\
  \ names.end(); it++)\n{\n   cout << *it << endl;\n}\n```\n\n# 向 `vector` 插入新元素\n\
  \n你可以使用 `insert` 成员函数在 `vector` 的指定位置插入一个或多个新元素。表 17-8 显示了 `insert` 成员函数的三个重载版本。程序\
  \ 17-5 显示了如何使用第一个版本的示例。\n\n让我们仔细观察该程序：\n\n* 第 8 行定义了一个 `int` 类型的 `vector`，并用值 1,\
  \ 2, 3, 4 和 5 初始化。\n* 第 11 行定义了一个指向 `vector` 中第二个元素的迭代器。\n* 第 14 行在 `it` 指向的元素之前插入了一个新元素。新元素包含值\
  \ 99。\n* 第 17 行到第 18 行的循环显示了 `vector` 的所有元素。\n\n`insert` 成员函数的第二个版本允许你插入多个具有相同值的元素。以下代码段显示了一个示例：\n\
  \n```cpp\n// 定义一个包含 5 个 int 值的 vector。\nvector<int> numbers = {1, 2, 3, 4, 5};\n\
  \n// 定义一个指向第 2 个元素的迭代器。\nauto it = numbers.begin() + 1;\n\n// 插入 3 个新元素，每个值为 99。\n\
  numbers.insert(it, 3, 99);\n```\n\n最后一条语句插入了 3 个每个值为 99 的新元素。语句执行后，vector 将包含 1\
  \ 99 99 2 3 4 5。\n\n`insert` 成员函数的第三种版本允许你向 `vector` 插入一个范围的元素，可能来自另一个容器。该函数接受三个迭代器作为参数。第一个迭代器指定插入元素的位置。第二个和第三个迭代器标记范围的开始和结束。程序\
  \ 17-6 通过将范围 `it2` 到 `it3` 插入到 `v1` 展示了该函数。\n\n\n\n\n`vector` 类提供了两个使用就地构造（emplacement）的成员函数：`emplace()`\
  \ 和 `emplace_back()`。当你使用这些其中一个成员函数时，没有必要提前实例化你将插入的对象。相反，你只需要向就地构造函数传递通常传递给要插入对象构造函数的任何参数。就地构造函数会处理对象的构造，将参数转发给其构造函数。\n\
  \n程序 17-9 展示了我们如何使用 `emplace_back()` 成员函数向 `vector` 中添加 `Product` 对象的示例。注意，我们没有在程序中实例化\
  \ `Product` 类。相反，在第 12 到 14 行中，我们将通常传递给 `Product` 类构造函数的参数传递给 `emplace_back()` 成员函数。`emplace_back()`\
  \ 成员函数会在 `vector` 中构造对象。（这种对象构造方式被称为*就地构造*。）\n\n`emplace()` 成员函数在 `vector` 的指定位置构造对象。你传递给\
  \ `emplace()` 成员函数的第一个参数是一个迭代器。新元素将在迭代器所指元素的前一个位置构造。在迭代器之后，你传递一个要转发给新对象构造函数的参数列表。程序\
  \ 17-10 展示了一个示例。\n\n让我们仔细观察一下这个程序：\n\n*   第 9 到 13 行创建了一个名为 `products` 的 `vector`，并用两个\
  \ `Product` 对象对其进行初始化。\n*   第 16 行定义了一个迭代器 `it`，它指向 `vector` 中的第二个元素。\n*   第 19\
  \ 行在 `vector` 中插入一个新元素，位于 `it` 所指元素的前面。新元素将是一个 `Product` 对象，在构造时将 \"Calendar\" 和\
  \ 25 作为参数传递给构造函数。\n\n# `capacity()`、`max_size()`、`shrink_to_fit()` 和 `reserve()`\
  \ 成员函数\n\n`vector` 容器使用动态分配的数组来存放其元素。当底层数组满且向 `vector` 添加另一个元素时，`vector` 必须增加其底层数组的大小。通常这意味着必须分配一个新数组，将旧数组的所有元素复制到新数组，并释放旧数组。\n\
  \n为了防止每次添加新元素时都发生这一过程，`vector` 类通常会分配比所需的更多的内存。这样就可以添加若干元素而不会触发重新分配过程。因此，一个 `vector`\
  \ 对象有两个大小：(1) 存储在 `vector` 中的元素数量，(2) 在不导致底层数组重新分配的情况下可以存储的元素数量。\n\n你已经知道 `size()`\
  \ 成员函数返回当前存储在 `vector` 中的元素数量。`vector` 类还有一个 `capacity()` 成员函数，它返回容器底层数组在不分配更多内存的情况下当前存储的元素数量。此外，`max_size()`\
  \ 成员函数返回 `vector` 能够存储的理论最大元素数量。\n\n`vector` 的 `capacity()` 成员函数返回的值始终大于或等于 `size()`\
  \ 成员函数返回的值。如果你需要增加 `vector` 的容量，可以调用 `reserve()` 成员函数来请求。你传递一个整数参数来指定所需的元素数量。如果你需要减少\
  \ `vector` 的容量，可以调用 `shrink_to_fit()` 成员函数来请求。该函数不接受参数，它仅仅是收缩 `vector` 的底层数组，使其容量与\
  \ `vector` 的大小相同。\n\n## 检查点\n\n1.  17.11 写一条语句定义一个名为 `avect` 的空 `vector` 对象，它可以持有字符串类型。\n\
  2.  17.12 写一条语句定义一个名为 `avect` 的 `vector` 对象，它可以持有 `int` 类型。该 `vector` 应该有 10 个元素（用默认值\
  \ 0 初始化）。\n3.  17.13 写一条语句定义一个名为 `avect` 的 `vector` 对象，它可以持有 `int` 类型。该 `vector`\
  \ 应该有 100 个元素，每个元素都初始化为值 1。\n4.  17.14 写一条语句定义一个名为 `v1` 的 `vector` 对象，它可以持有 `int`\
  \ 类型。该 `vector` 应该是另一个名为 `v2` 的 `vector` 的拷贝。\n5.  17.15 使用 `vector` 类的 `at()` 成员函数使用无效索引会发生什么？\n\
  6.  17.16 `vector` 类的 `insert()` 成员函数和 `push_back()` 有什么区别？\n7.  17.17 如果你的程序将向\
  \ `vector` 添加大量对象，使用 `insert()` 更好还是 `emplace()` 更好？\n8.  17.18 在内部，`vector` 是如何存储元素的？\n\
  9.  17.19 `vector` 类有 `size()` 成员函数和 `capacity()` 什么是？\n\n# `map`、`multimap` 和 `unordered_map`\
  \ 类\n\n### 概念\n\nmap 中的每个元素有两个部分：键和值。*map* 是一种关联容器。存储在 map 中的每个元素都有两个部分。事实上，map\
  \ 元素通常被称为*键值对*。当你想要从 map 中检索特定的值时，使用键。\n\n例如，假设公司的每个员工都有一个 ID 号，我们想写一个程序来查找。我们可以创建一个\
  \ map，将 ID 作为键，将员工姓名作为值。这在图 17-4 中所示。如果我们知道员工的 ID，就可以检索该员工的姓名。\n\n# 图 17-4 键值对\n\
  \n![一个图表说明了“键-值”对。](img/FG_17_004)图 17-4 全文\n\n另一个示例是一个输入姓名并提供电话号码的程序。该程序可以使用 map，将姓名作为键，将电话号码作为值。如果我们知道姓名，就可以检索该人的电话号码。\n\
  \n### 注意\n\n键值对通常被称为*映射*（mappings），因为每个键都映射到一个值。\n\n# `map` 类\n\nSTL 提供了一个 `map`\
  \ 类模板，你可以在程序中使用它定义 map 容器。`map` 类提供了许多用于存储元素、检索元素、删除元素、遍历 map 等成员函数。\n\n要使用 `map`\
  \ 类，你需要在程序中包含 `<map>` 头文件。然后，你可以使用 `map` 类构造函数之一来定义 `map` 对象。表 17-9 显示了使用每个构造函数定义\
  \ `map` 语句的通用格式。表 17-10 列出了 `map` 类许多（但并非全部）成员函数。\n\n# 表 17-9 `map` **类构造函数**\n\n\
  \n\n\n\n| **默认构造函数** | `map<keyDatatype, valueDataType>name;` 创建一个空的 `map` 对象。在通用格式中，`keyDatatype`\
  \ 是每个元素键的数据数据类型，`valueDataType` 是每个元素值的数据类型，`name` 是 `map` 的名称。 |\n| **范围构造函数**\
  \ | `map<keyDatatype, valueDataType>name(it1, it2);` 创建一个 `map` 对象，该对象初始包含来自另一个容器的值范围，由两个迭代器\
  \ `it1` 和 `it2` 指定。在通用格式中，`keyDatatype` 是每个元素键的数据类型，`valueDataType` 是每个元素值的数据类型，`name`\
  \ 是 `map` 的名称。 |\n| **拷贝构造函数** | `map<keyDatatype, valueDataType>name(map2);` 创建一个作为另一个\
  \ `map`拷贝的 `map` 对象。在通用格式中，`keyDatatype` 是每个元素键的数据类型，`valueDataType` 是每个元素值的数据类型，`name`\
  \ 是 `map` 的名称，而 `map2` 是要拷贝的 `map`。 |\n\n# 表 17-10 一些 `map` 成员函数\n\n| 成员函数 | 说明\
  \ |\n| --- | --- |\n| `at(key)` | 返回指向指定键的元素的引用。 |\n| `clear()` | 删除容器中的所有元素。 |\n\
  | `count(key)` | 返回具有指定键的元素个数。 |\n| `emplace(key, value)` | 向容器中插入一个具有指定 `key` 和\
  \ `value` 的新元素。如果容器中已存在指定键的元素，则函数调用不执行任何操作。 |\n| `empty()` | 如果容器为空则返回 `true`，否则返回\
  \ `false`。 |\n| `erase(key)` | 删除包含指定键的元素。如果元素被删除，函数返回 1；如果没有找到匹配的元素，则返回 0。 |\n\
  | `find(key)` | 查找具有指定键的元素。如果找到元素，函数返回指向该元素的迭代器。如果未找到元素，函数返回指向 `map` 末尾的迭代器。 |\n\
  | `insert(pair)` | 向 map 中插入一个 `pair` 对象。如果已存在具有指定键的元素，则函数调用不执行任何操作。 |\n| `lower_bound(key)`\
  \ | 返回指向第一个键大于或等于 `key` 的元素的迭代器。 |\n| `max_size()` | 返回容器的理论最大尺寸。 |\n| `size()`\
  \ | 返回容器中的元素个数。 |\n| `swap(second)` | `second` 参数必须是与调用对象类型相同的 `map` 对象。该函数交换调用对象与\
  \ `second` 对象之间的内容。 |\n| `upper_bound(key)` | 返回指向第一个键大于 `key` 的元素的迭代器。 |\n\n与大多数\
  \ STL 容器相同，`map` 类具有返回指向容器开头和结束的迭代器的成员函数。具体而言，该类拥有 `begin()`、`cbegin()`、`cend()`、`crbegin()`、`crend()`、`rbegin()`\
  \ 和 `rend()` 成员函数，它们返回普通迭代器、反向迭代器和常量迭代器的各种组合。与序列容器 `array` 和 `vector` 不同，像 `map`\
  \ 这样的关联容器没有 `front()` 和 `back()` 迭代器函数。\n\n以下是一个如何定义一个 `map` 容器来存储员工 ID 号（作为 `int`）及其对应的员工姓名（作为\
  \ `string`）的示例：\n\n```\nmap<int, string> employees;\n```\n\n该语句定义了一个名为 `employees`\
  \ 的 `map` 容器。在尖括号 `<>` 中，第一个数据类型（`int`）是 map 键的类型，在这种情况下是员工 ID 号。第二个数据类型（`string`）是关联值的类型，在这种情况下是员工姓名。因此，该容器的每个元素都将是一个键值对，其中键为\
  \ `int`，值为 `string`。\n\n`map` 容器中的键必须是唯一的。`map` 容器中的两个元素不能具有相同的键值。\n\n# 初始化 Map\n\
  \n你可以使用初始化列表初始化 `map`。下面的代码显示了一个示例：\n\n```\nmap<int, string> employees =\n  {{101,\
  \ \"Chris Jones\"}, {102, \"Jessica Smith\"},\n   {103, \"Amanda Stevens\"}, (104,\
  \ \"Will Osborn\"}};\n```\n\n这段代码创建了一个名为 `employees` 的 `map` 容器，并按如下方式初始化：\n\n*\
  \   第一个元素是 `{101, \"Chris Jones\"}`。在这个元素中，101 是键，\"Chris Jones\" 是值。\n*   第二个元素是\
  \ `{102, \"Jessica Smith\"}`。在这个元素中，102 是键，\"Jessica Smith\" 是值。\n*   第三个元素是 `{103,\
  \ \"Amanda Stevens\"}`。在这个元素中，103 是键，\"Amanda Stevens\" 是值。\n*   第四个元素是 `{104, \"\
  Will Osborn\"}`。在这个元素中，104 是键，\"Will Osborn\" 是值。\n\n`map` 容器中的键必须是唯一的。`map` 容器中的两个元素不能具有相同的键值。\n\
  \n# 向 Map 添加元素\n\n`map` 类重载了 `[]` 运算符，允许你向其 添加新元素。例如，请下面的代码：\n\n```\nmap<int, string>\
  \ employees;\nemployees[110] = \"Chris Jones\";\nemployees[111] = \"Jessica Smith\"\
  ;\nemployees[112] = \"Amanda Stevens\";\n```\n\n第一个语句创建了一个名为 `employees` 的空 `map`\
  \ 容器。第二个语句添加了具有键 110 和值为 \"Chris Jones\" 的元素。第三个语句添加了具有键 111 和值为 \"Jessica Smith\"\
  \ 的元素。第四个语句添加了具有键 112 和值为 \"Amanda Stevens\" 的元素。\n\n`map` 容器中的键必须是唯一的。如果你为现有键分配新值，新值将替换旧值。例如，请下面的代码：\n\
  \n```\nmap<int, string> employees;\nemployees[110] = \"Chris Jones\";\nemployees[110]\
  \ = \"John Smith\";\n```\n\n第一个语句创建了一个名为 `employees` 的空 `map` 容器。第二个语句添加了具有键 110\
  \ 和值为 \"Chris Jones\" 的元素。第三个语句将 \"John Smith\" 赋值给键 110。\n\n# 使用 insert() 成员函数添加元素\n\
  \n当元素存储在 `map` 中时，它是以 `pair` 类型对象存储的。`pair` 类型是一个两个成员变量 `first` 和 `second` 的 `struct`。元素的键存储在\
  \ `first` 成员变量中，元素的值存储在 `second` 成员变量中。\n\n`map` 类提供了一个 `insert()` 成员函数，将 `pair`\
  \ 对象作为元素添加到 map 中。你可以使用 STL 函数 `make_pair` 来构造 `pair` 对象，如下：\n\n```\nmap<int, string>\
  \ employees;\nemployees.insert(make_pair(110, \"Chris Jones\"));\nemployees.insert(make_pair(111,\
  \ \"Jessica Smith\"));\nemployees.insert(make_pair(112, \"Amanda Stevens\"));\n\
  ```\n\n第一个语句创建了一个名为 `employees` 的空 `map` 容器。随后的语句向 map 添加了以下元素：\n\n*   键 = 110，值\
  \ = \"Chris Jones\"\n*   键 = 111，值 = \"Jessica Smith\"\n*   键 = 112，值 = \"Amanda\
  \ Stevens\"\n\n如果你使用 `insert()` 成员函数插入的元素与现有元素具有相同的键，则函数将不会插入新元素。\n\n\n\n\n\n`pair`\
  \ 结构体和 `make_pair` 模板函数在 `utility` 头文件中声明。如果你已经包含了 `map` 头文件，那么 `utility` 头文件也会被自动包含。\n\
  \n# 使用 `emplace()` 成员函数添加元素\n\n`map` 类提供了 `emplace()` 成员函数，用于在容器中构造一个新元素。你只需调用该成员函数，并将新元素的键和值作为参数传递。下面的代码展示了一个示例：\n\
  \n```\nmap<int, string> employees;\nemployees.emplace(110, \"Beth Young\");\nemployees.emplace(111,\
  \ \"Jake Brown\");\nemployees.emplace(112, \"Emily Davis\");\n```\n\n第一条语句创建了一个名为\
  \ `employees` 的空 `map` 容器。随后的语句向 `map` 中添加了以下元素：\n\n* Key = 110, Value = \"Beth\
  \ Young\"\n* Key = 111, Value = \"Jake Brown\"\n* Key = 112, Value = \"Emily Davis\"\
  \n\n如果你使用 `emplace()` 成员函数插入的元素与现有元素具有相同的键，则该函数将不会插入新元素。\n\n# 从 Map 中检索值\n\n要从 `map`\
  \ 中检索值，你可以调用 `at()` 成员函数，并传递与目标值关联的键。如果指定的键存在于容器中，该函数返回其关联的值。如果键不存在，该函数将抛出异常。下面的代码展示了一个示例：\n\
  \n```\n// 创建一个包含员工 ID 和名字的 map。\nmap<int, string> employees =\n  {{101, \"Chris\
  \ Jones\"}, {102, \"Jessica Smith\"},\n   {103, \"Amanda Stevens\"}, (104, \"Will\
  \ Osborn\"}};\n\n// 从 map 中检索一个值。\ncout << employees.at(103) << endl;\n```\n\n这段代码从\
  \ map 中检索并显示了与键 103 关联的值。代码将显示字符串 \"Amanda Stevens\"。\n\n如果你传递给 `at()` 成员函数的键在 map\
  \ 中不存在，则 `at()` 成员函数将抛出一个异常。为了防止这种情况，你应该先调用 `count()` 成员函数来确定键是否存在于 `map` 中。你调用\
  \ `count()` 成员函数并将键作为参数传递。如果指定的键存在于容器中，该函数返回 1。如果键不存在，该函数返回 0。下面的代码展示了一个示例：\n\n\
  ```\n// 创建一个包含员工 ID 和名字的 map。\nmap<int, string> employees =\n  {{101, \"Chris Jones\"\
  }, {102, \"Jessica Smith\"},\n   {103, \"Amanda Stevens\"}, (104, \"Will Osborn\"\
  }};\n\n// 从 map 中检索一个值。\nif (employees.count(103))\n   cout << employees.at(103)\
  \ << endl;\nelse\n   cout << \"Employee not found.\\n\";\n```\n\n# 删除元素\n\n你可以使用\
  \ `erase()` 成员函数从 `map` 中删除或移除元素。你调用 `erase()` 成员函数，并传递与要删除的元素关联的键。下面的代码展示了一个示例：\n\
  \n```\n// 创建一个包含员工 ID 和名字的 map。\nmap<int, string> employees =\n  {{101, \"Chris\
  \ Jones\"}, {102, \"Jessica Smith\"},\n   {103, \"Amanda Stevens\"}, (104, \"Will\
  \ Osborn\"}};\n\n// 删除 ID 为 102 的员工。\nemployees.erase(102);\n```\n\n这段代码创建了一个包含四个元素的\
  \ `map` 容器。然后，它删除了键为 102（值为 \"Jessica Smith\"）的元素。此时 `map` 只包含三个元素。\n\n`erase()`\
  \ 成员函数在指定的元素被成功删除时返回 1，如果未找到，则返回 0。\n\n# 使用基于范围的 for 循环遍历 Map\n\n基于范围的 `for` 循环是遍历\
  \ `map` 中所有元素的方便方法。下面的代码展示了如何显示 `map` 中的所有元素的一个示例：\n\n```\n// 创建一个包含员工 ID 和名字的 map。\n\
  map<int, string> employees =\n  {{101, \"Chris Jones\"}, {102, \"Jessica Smith\"\
  },\n   {103, \"Amanda Stevens\"}, (104, \"Will Osborn\"}};\n// 显示每个元素。\nfor (auto\
  \ element : employees)\n{\n   cout << \"ID: \" << element.first << \"\\tName: \"\
  \ << element.second\n   << endl;\n}\n```\n\n注意，我们在范围变量 `element` 的声明中使用了 `auto`\
  \ 关键字。`auto` 关键字告诉编译器根据变量使用的上下文来确定变量的数据类型。如果我们编写 `element` 变量的实际数据类型，循环将像这样：\n\n\
  ```\nfor (pair<int, string> element : employees)\n{\n   cout << \"ID: \" << element.first\
  \ << \"\\tName: \" << element.second\n   << endl;\n}\n```\n\n如前所述，元素以 `pair` 类型对象的形式存储在\
  \ `map` 容器中。`pair` 类型是一个 `struct`，它有两个成员变量：`first` 和 `second`。元素的键存储在 `first` 成员变量中，元素的值存储在\
  \ `second` 成员变量中。\n\n# 在 Map 中使用迭代器\n\n你可以使用双向迭代器访问 `map` 的元素。`map` 类有一个 `begin()`\
  \ 成员函数，返回指向 `map` 第一个元素的迭代器，以及一个 `end()` 成员函数，返回指向 `map` 末尾的迭代器（最后一个元素之后的位置）。程序\
  \ 17-11 展示了使用迭代器显示 `map` 中所有元素的示例。\n\n让我们仔细观察 程序 17-11：\n* 第 10-12 行：定义并初始化一个 `map`。\n\
  * 第 15 行：定义类型 `map<int, string>` 的迭代器。\n* 第 18-22 行：使用迭代器的 `for` 循环。\n* 第 20-21\
  \ 行：循环体。\n\n注意：当你从第一个到最后一个访问 `map` 的元素时，是按键的顺序访问的。\n\n`map` 类还有一个 `find()` 成员函数，根据指定的键查找元素。如果找到，`find()`\
  \ 函数返回指向它的迭代器。如果未找到，`find()` 函数返回指向 `map` 末尾的迭代器。下面的代码展示了一个示例：\n\n```\n// 创建一个包含员工\
  \ ID 和名字的 map。\nmap<int, string> employees =\n  {{101, \"Chris Jones\"}, {102, \"\
  Jessica Smith\"},\n   {103, \"Amanda Stevens\"}, (104, \"Will Osborn\"}};\n\n//\
  \ 创建迭代器。\nmap<int, string>::iterator iter;\n\n// 查找员工 103。\niter = employees.find(103);\n\
  \n// 显示员工数据。\nif (iter != employees.end())\n{\n   cout << \"ID: \" << iter->first\
  \ << \"\\tName: \" << iter->second << endl;\n}\nelse\n{\n   cout << \"Employee not\
  \ found.\\n\";\n}\n```\n\n# 在 map 中存储 `vector` 作为值\n\n在 程序 17-12 中，我们定义了一个 `map`，其中键是学生名字（字符串），值是包含测试成绩的\
  \ `vector`。\n\n\n\n\n\n* 第 10 到 13 行创建了四个 `vector`，每个包含一个不同学生的测试成绩。\n* 第 16 行定义了一个名为\
  \ `testScores` 的 `map` 容器。注意该 `map` 的类型为 `map<string, vector<int>>`。这意味着键将是 `string`\
  \ 类型，而值将是 `vector<int>` 类型。\n* 第 17 到 20 行向 map 中添加了以下元素：\n    * 键 = \"Kayla\",\
  \ 值 = `student1Scores`，这是一个 `vector<int>` 对象。\n    * 键 = \"Luis\", 值 = `student2Scores`，这是一个\
  \ `vector<int>` 对象。\n    * 键 = \"Sophie\", 值 = `student3Scores`，这是一个 `vector<int>`\
  \ 对象。\n    * 键 = \"Ethan\", 值 = `student4Scores`，这是一个 `vector<int>` 对象。\n* 从第 23\
  \ 行开始的范围 for 循环遍历 map 中的每个元素。记住范围变量 `element` 是 `pair` 数据类型的对象。`element` 对象的 `first`\
  \ 成员变量是元素的键，其 `second` 成员变量是元素的值。因此，表达式 `element.first` 是一个字符串，表达式 `element.second`\
  \ 是一个 `vector<int>` 对象。在第 31 行中，表达式 `element.second[i]` 是 `vector` 中的一个元素。[17-12]\
  \ 展示了将 `vector` 作为值存储在 map 中的过程，但程序可以通过两种方式简化：(1) 在定义 `map` 时，可以使用初始化列表来创建 `vector`\
  \ 对象，这将允许我们消除第 10 到 13 行的 `vector` 定义语句。(2) 我们可以将 29 到 32 行的 `for` 循环重写为范围 for 循环。[17-13]\
  \ 显示了更改后的程序。\n\n# 在 map 中存储自定义类的值\n\n在之前的示例中，我们在 map 中存储了字符串、基本类型和 `vector`。在 map\
  \ 中存储自定义类对象通常非常有用。例如，假设你正在编写一个联系人列表，并想通过输入姓名查找某人的联系信息。你可以创建一个 `map`，为联系人列表中的每个人包含一个元素。在每个元素中，键是姓名，值是包含该人的联系数据。\n\
  \n如果你想将对象作为值存储在 `map` 中，该对象有一个要求：它必须有一个默认构造函数。例如，这里显示的 `Contact` 类拥有姓名和邮箱。因为它有一个默认构造函数（第\
  \ 12 到 14 行），该类的对象可以作为值存储在 `map` 中。\n\n# `Contact.h` 的内容\n\n```\n 1  #ifndef CONTACT_H\n\
  \ 2  #define CONTACT_H\n 3  #include <string>\n 4  using namespace std;\n 5\n 6\
  \  class Contact\n 7  {\n 8  private:\n 9     string name;\n10     string email;\n\
  11  public:\n12     Contact()\n13     {  name = \"\";\n14        email = \"\";\n\
  15     }\n16     Contact(string n, string em)\n17     {  name = n;\n18        email\
  \ = em;\n19     }\n20     void setName(string n)\n21     { name = n; }\n22\n23 \
  \    void setEmail(string em)\n24     {  email = em; }\n25\n26     string getName()\
  \ const\n27     {  return name; }\n28\n29     string getEmail() const\n30     {\
  \  return email; }\n31  };\n32  #endif\n```\n\n[17-14] 展示了如何在 map 中存储 `Contact`\
  \ 类对象。程序创建了三个 `Contact` 对象，然后使用每个 `Contact` 对象的姓名字段作为键将它们存储在 map 中。提示输入要查找的姓名。\n\
  \n让我们仔细观察 [17-14]：\n* 第 12 到 14 行创建了名为 `contact1`、`contact2` 和 `contact3` 的三个 `Contact`\
  \ 对象。\n* 第 17 行定义了一个名为 `contacts` 的 `map`。在角括号 `<>` 内部，第一个数据类型（`string`）是每个键的类型。第二个数据类型（`Contact`）是对应值的类型。因此，该容器的每个元素都是一个键值对，键为\
  \ `string`，值为 `Contact` 对象。\n* 第 20 行定义了一个可以用于 `contacts` map 的迭代器。\n* 第 23 行向 `contacts`\
  \ map 添加了一个元素。键为 \"Ashley Miller\"，值为 `contact1`。\n* 第 24 行向 `contacts` map 添加了另一个元素。键为\
  \ \"Jacob Brown\"，值为 `contact2`。\n* 第 25 行向 `contacts` map 添加了另一个元素。键为 \"Emily Ramirez\"\
  ，值为 `contact3`。\n* 第 28 到 29 行提示用户输入要查找的姓名。用户的输入存储在 `searchName` 中。\n* 第 32 行调用\
  \ `contacts.find()` 函数查找用户输入的姓名。如果在 map 中找到了该姓名，成员函数返回一个指向该元素的迭代器。如果未找到该姓名，成员函数返回一个指向\
  \ map 末尾的迭代器。\n* 如果找到了姓名，第 37 和 38 行的语句将显示联系人的姓名和邮箱地址。记住，迭代器指向一个 `pair` 对象。`pair`\
  \ 对象的 `first` 成员变量是元素的键，`pair` 对象的 `second` 成员变量是元素的值。因此，在第 37 和 38 行中，表达式 `iter->second`\
  \ 引用一个 `Contact` 对象。表达式 `iter->second.getName()` 返回该对象的 `name` 字段，表达式 `iter->second.getEmail()`\
  \ 返回该对象的 `email` 字段。\n\n[17-15] 显示了另一个示例，我们使用范围 for 循环遍历一个包含 `Contact` 对象值的 map。在第\
  \ 25 和 26 行中，范围变量 `element` 是一个 `pair` 对象。`pair` 对象的 `first` 成员变量是元素的键，`pair` 对象的\
  \ `second` 成员变量是元素的值。因此，表达式 `element.second` 引用一个 `Contact` 对象。表达式 `element.second.getName()`\
  \ 返回该对象的 `name` 字段，表达式 `element.second.getEmail()` 返回该对象的 `email` 字段。\n\n[17-15]\
  \ 展示了将自己的对象作为值存储在 map 中的过程，但程序可以通过两种方式简化：在定义 `map` 时，可以使用初始化列表来创建 `Contact` 对象，这将允许我们消除第\
  \ 10 到 12 行的 `vector` 定义语句。[17-16] 显示了更改后的程序。\n\n# 使用自己的类对象作为键\n\n你可以将自己编写的类对象作为键存储在\
  \ map 中，只要该类重载了 `<` 运算符。例如，查看这里显示的 `Customer` 类：\n\n\n\n\n\n`Customer` 类存储了关于客户的两个数据：客户编号（`custNumber`）和姓名（`name`）。重载的\
  \ `<` 运算符（在第 28 到 31 行）如果 `custNumber` 成员小于参数的 `custNumber` 成员，则返回 `true`。否则，返回\
  \ `false`。\n\n假设我们正在编写一个为客户分配剧院座位的程序，并且我们希望将 `Customer` 对象作为 `map` 中的键。程序 17-17\
  \ 显示了一个示例。在第 15 行中，该程序定义了一个使用 `Customer` 对象作为键、字符串作为值的 `map`。\n\n程序 17-17 阐明了将你自己的对象作为\
  \ `map` 中的键的过程，但该程序可以简化。当我们定义 `map` 时，可以使用初始化列表来同时创建 `Customer` 对象。这将允许我们消除第 10\
  \ 到 12 行中的 `Customer` 定义语句。程序 17-18 显示了带有这些更改的程序。\n\n# `unordered_map` 类\n\n从 C++11\
  \ 开始，标准模板库 STL 提供了一个名为 `unordered_map` 的类模板，它与 `map` 类相似，但有两点不同：(1) `unordered_map`\
  \ 中的键不按任何特定方式排序，以及 (2) `unordered_map` 类具有更好的性能。如果你对大量元素进行大量搜索，并且不在意按键的顺序检索它们，那么你可能应该使用\
  \ `unordered_map` 类而不是 `map` 类。\n\n要使用 `unordered_map` 类，你必须在程序中编写 `#include<unordered_map>`\
  \ 指令。`unordered_map` 类拥有与 `map` 类类似的成员函数集（其中许多列在表 17-10 中），在大多数情况下，操作 `unordered_map`\
  \ 就像操作 `map` 一样。以下代码显示了使用元素初始化的 `unordered_map`，然后检索并显示一个元素：\n\n```cpp\n// 创建一个包含员工\
  \ ID 和姓名的 unordered_map。\nunordered_map<int, string> employees =\n  {{101, \"Chris\
  \ Jones\"}, {102, \"Jessica Smith\"},\n   {103, \"Amanda Stevens\"}, (104, \"Will\
  \ Osborn\"}};\n// 从 map 中检索一个值。\ncout << employees.at(103) << endl;\n```\n\n下面的代码显示了使用基于范围的\
  \ `for` 循环显示 `map` 中所有元素的示例：\n\n```cpp\n// 创建一个包含员工 ID 和姓名的 unordered_map。\nunordered_map\
  \ <int, string> employees =\n  {{101, \"Chris Jones\"}, {102, \"Jessica Smith\"\
  },\n   {103, \"Amanda Stevens\"}, (104, \"Will Osborn\"}};\n\n// 显示每个元素。\nfor (auto\
  \ element : employees)\n{\n   cout << \"ID: \" << element.first << \"\\tName: \"\
  \ << element.second\n   << endl;\n}\n```\n\n### 注意\n\n`unordered_map` 类与 `map` 类之间的差异由于它们内部存储元素的方式不同。`map`\
  \ 类使用名为二叉叉树的数据结构，而 `unordered_map` 类使用哈希表。\n\n# `multimap` 类\n\n`multimap` 类允许你创建一个映射容器，其中多个元素可以具有相同的键。换句话说，`multimap`\
  \ 允许重复键。要使用 `multimap` 类，你需要在程序中编写 `#include<map>` 指令。\n\n除了通常的迭代器函数外，`multimap`\
  \ 类还支持表 17-10 中列出的所有 `map` 成员函数。此外，还有一个成员函数\n\n```cpp\nequal_range(key)\n```\n\n\
  它是 `multimap` 特有的。该函数返回一个 `pair` 对象，其 `first` 成员是一个指向 `multimap` 中匹配指定键的第一个元素的迭代器，其\
  \ `second` 成员是一个指向匹配指定键的最后一个元素之后的迭代器。如果未找到指定的键，两个迭代器都将指向自然出现在被搜索元素之后的元素。\n\n让我们考虑一个例子。在电话簿应用中，你可能在\
  \ `multimap` 中存储姓名和电话号码，使用姓名作为键，电话号码作为值。如果一个人有多个电话号码，图 17-5 说明了这一点。\n\n# 图 17-5\n\
  \n![一个 multimap 类](img/17_005) 显示了键 \"Will\" 的两个元素、键 \"faye\" 的两个元素以及键 \"Sarah\"\
  \ 的两个元素。程序 17-17 显示了如何定义 `multimap` 并使用元素初始化。当你遍历 `multimap` 时，元素是按顺序排列的。`multimap`\
  \ 类提供了与 `map` 许多成员函数。`multimap` 和 `map` 类之间的差异将在下文中\n\n# 向 multimap 添加元素\n\n与 `map`\
  \ 类不同，`multimap` 类没有重载 `[]` 运算符。因此，你不能通过赋值语句添加新元素。相反，你可以使用 `emplace()` 成员函数或 `insert()`\
  \ 成员函数。`multimap` 类的 `emplace()` 成员函数接收新元素。以下代码显示了示例：\n\n```cpp\nmultimap<string,\
  \ string> phonebook;\nphonebook.emplace(\"Will\", \"555-1212\");\nphonebook.emplace(\"\
  Will\", \"555-0123\");\nphonebook.emplace(\"faye\", \"555-0707\");\nphonebook.emplace(\"\
  faye\", \"555-1234\");\nphonebook.emplace(\"Sarah\", \"555-8787\");\nphonebook.emplace(\"\
  Sarah\", \"555-5678\");\n```\n\n第一语句创建一个空的 `map` 容器。后续语句使用 `emplace()` 成员函数添加图 17-5\
  \ 所示的元素。如果使用 `emplace()` 成员函数插入的元素与现有键相同，则该函数将添加一个相同键的新元素。\n\n`insert()` 成员函数将一个\
  \ `pair` 对象作为元素添加到 `multimap`。你可以使用 STL 函数 `make_pair` 来构造 `pair` 对象，如下所示：\n\n```cpp\n\
  multimap<string, string> phonebook;\nphonebook.insert(make_pair(\"Will\", \"555-1212\"\
  ));\nphonebook.insert(make_pair(\"Will\", \"555-0123\"));\nphonebook.insert(make_pair(\"\
  faye\", \"555-0707\"));\nphonebook.insert(make_pair(\"faye\", \"555-1234\"));\n\
  phonebook.insert(make_pair(\"Sarah\", \"555-8787\"));\nphonebook.insert(make_pair(\"\
  Sarah\", \"555-5678\"));\n```\n\n第一语句创建一个名为 `phonebook` 的空 `map` 容器。后续语句使用 `insert()`\
  \ 成员函数添加图 17-5 所示的元素。如果使用 `insert()` 成员函数插入的元素与现有键相同，则该函数将添加一个相同键的新元素。\n\n# 获取指定键的元素数量\n\
  \n`multimap` 类的 `count()` 成员函数接受键作为参数，并返回匹配指定键的元素数量。程序 17-20 演示了这一点。\n\n\n\n\n\n\
  # 使用指定键检索元素\n\n与 `map` 类一样，`multimap` 类也有一个 `find()` 成员函数，用于搜索具有指定键的元素。如果找到了该键，`find()`\
  \ 函数将返回指向匹配该键的元素的迭代器。如果没有找到该元素，`find()` 函数将返回指向 `map` 结尾的迭代器。\n\n如果你想检索所有匹配指定键的元素，请使用\
  \ `multimap` 类的 `equal_range` 成员函数。`equal_range` 成员函数返回一个 `pair` 对象。`pair` 对象的 `first`\
  \ 成员指向 `multimap` 中匹配指定键的第一个元素的迭代器。`pair` 对象的 `second` 成员指向匹配指定键的最后一个元素 `之后` 位置的迭代器。程序\
  \ 17-21 演示了如何使用该函数。\n\n让我们仔细查看该程序：\n\n*   第 9 到 12 行定义了一个名为 `phonebook` 的 `multimap`\
  \ 容器，并用六个元素初始化。\n*   第 16 到 17 行定义了一个名为 `range` 的 `pair` 变量。`range` 变量接收来自 `equal_range`\
  \ 成员函数的对象。该对象的 `first` 和 `second` 成员都将是 `multimap` 容器的迭代器。\n*   第 20 行为 `multimap`\
  \ 容器定义了一个名为 `iter` 的迭代器。\n*   第 23 行调用 `phonebook` 容器的 `equal_range` 成员函数，指定 `\"\
  Faye\"` 为键。`equal_range` 函数返回一个 `pair` 对象并赋值给 `range` 变量。\n*   第 26 到 29 行的 `for`\
  \ 循环遍历所有匹配键 `\"Faye\"` 的元素，并显示它们的值。以下是循环的详细信息：\n    *   迭代器 `iter` 最初被设置为 `range.first`。\n\
  \    *   只要 `iter` 不等于 `range.second`，循环就会继续。\n    *   在每次循环迭代结束时，`iter` 递增到下一个元素。\n\
  \    *   循环每次迭代时，它都会显示 `iter` 指向元素的内容（第 26 行）。\n\n### 注意\n\n当使用 `equal_range` 成员函数搜索元素范围时，如果未找到指定的键，两个迭代器都将指向在搜索元素之后自然出现的元素。\n\
  \n# 从 `multimap` 中删除元素\n\n你可以使用 `erase()` 成员函数从 `multimap` 中删除（或擦除）元素。你调用 `erase()`\
  \ 成员函数，并传递与要删除的元素关联的键。所有匹配指定键的元素都将从 `multimap` 中删除。`erase()` 成员函数返回被删除的元素数量。以下代码显示了一个示例：\n\
  \n```cpp\n// 定义一个电话簿 multimap。\nmultimap<string, string> phonebook =\n   { {\"Will\"\
  , \"555-1212\"},  {\"Will\", \"555-0123\"},\n     {\"Faye\", \"555-0707\"},  {\"\
  Faye\", \"555-1234\"},\n     {\"Sarah\", \"555-8787\"}, {\"Sarah\", \"555-5678\"\
  } };\n\n// 从 multimap 中删除 Will 的电话号码。\nphonebook.erase(\"Will\");\n```\n\n这段代码创建了一个包含六个元素的\
  \ `multimap` 容器。然后，它删除了所有键为 `\"Will\"` 的元素（将删除两个元素）。随后 `multimap` 仅包含四个元素。\n\n#\
  \ `unordered_multimap` 类\n\n从 C++11 开始，STL 提供了一个名为 `unordered_multimap` 的类模板，它与\
  \ `multimap` 类相似，但有两个不同之处：(1) `unordered_multimap` 中的键没有按任何特定顺序排序，并且 (2) `unordered_multimap`\
  \ 类具有更好的性能。如果你需要对大量元素进行大量搜索，并且不在意按键的顺序检索它们，你可能应该使用 `unordered_multimap` 类而不是 `multimap`\
  \ 类。\n\n要使用 `unordered_multimap` 类，你必须在程序中编写 `#include<unordered_multimap>` 指令。`unordered_multimap`\
  \ 类拥有一与 `multimap` 类类似的成员函数，在大多数情况下，处理 `unordered_multimap` 就与处理 `multimap` 一直一样。\n\
  \n### 注意\n\n`unordered_multimap` 类与 `multimap` 类之间的差异由于它们内部存储元素的方式不同。`multimap`\
  \ 类使用名为`二叉树`的数据结构，而 `unordered_multimap` 类使用`哈希表`。\n\n## 检查点\n\n1.  17.20 存储在 map\
  \ 中的每个元素都有两个部分。它们是什么？\n2.  17.21 写一个语句定义一个名为 `myMap` 的 `map`。`myMap` 中的键应该是 `int`，值应该是\
  \ `string`。\n3.  17.22 假设已经创建了一个名为 `employee` 的空 `map`。以下语句执行了什么？\n    ```cpp\n\
  \    employee[5] = \"anne\";\n    ```\n4.  17.23 描述检索特定键元素的两种方法。\n5.  17.24 如果你想将自定义定义的类对象作为值存储在\
  \ `map` 中，你需要确保什么？\n6.  17.25 如果你想将自定义定义的类对象作为键存储在 `map` 中，你需要确保什么？\n7.  17.26 `map`\
  \ 和 `unordered_map` 有什么区别？\n8.  17.27 `map` 和 `multimap` 有什么区别？\n\n# `set`, `multiset`\
  \ 和 `unordered_set` 类\n\n### 概念\n\n`set` 是唯一值的集合。`set` 是一个存储唯一值的关联容器。考虑 `set` 的良好方法是将其视为一个键值对的\
  \ map，其中值就是键。使用 STL `set` 声明一个 set。关于 `set` 容器，有两点需要注意：\n\n*   `set` 中的所有元素必须是唯一的。\n\
  *   `set` 中的元素会自动排序。\n\n要使用 `set` 类，你需要在程序中包含 `<set>` 文件。然后，你可以使用其中一个 `set` 构造函数定义一个\
  \ `set` 对象。\n\n\n\n\n\n| `clear()` | 清除集合中的所有元素。 |\n| `count(value)` | 返回包含指定值的元素个数。（对于\
  \ `set` 类，`count()` 函数返回 0 或 1。对于 `multiset` 类，该函数可以返回大于 1 的值。） |\n| `emplace(args..)`\
  \ | 在容器中构造一个新元素，将参数列表传递给元素的构造函数。如果集合中已存在具有指定值的元素，则函数调用将不执行任何操作。 |\n| `empty()` |\
  \ 如果容器为空，则返回 `true`；否则返回 `false`。 |\n| `equal_range(value)` | 返回一个 `pair` 对象。`pair`\
  \ 对象的 `first` 成员是一个指向 `set` 中第一个匹配指定 `value` 的元素的迭代器。`pair` 对象的 `second` 成员是一个指向匹配指定\
  \ `value` 的最后一个元素*之后*位置的迭代器。如果未找到指定的 `value`，两个迭代器都将指向在搜索元素之后自然出现的元素。（对于 `set` 类，该范围最多包含\
  \ 1 个元素。对于 `multiset` 类，该范围可以包含多个元素。） |\n| `erase(value)` | 删除包含指定值的元素。如果删除了元素，函数返回\
  \ 1；如果未找到匹配的元素，则返回 0。 |\n| `find(value)` | 搜索具有指定值的元素。如果找到了该元素，函数返回指向它的元素的迭代器。如果没有找到该元素，函数返回指向\
  \ `set` 结尾的迭代器。 |\n| `insert(value)` | 将一个值作为元素插入 `set` 中。如果集合中已存在指定值的元素，则函数不会插入新元素。该函数返回一个\
  \ `pair` 对象，其 `first` 成员是指向新插入元素（或如果已存在，则指向等效元素）的迭代器，`second` 成员在插入了新元素时为 `bool`\
  \ 值 `true`，如果元素已存在则为 `false`。 |\n| `lower_bound(value)` | 返回指向键大于或等于 `value` 的第一个元素的迭代器。\
  \ |\n| `max_size()` | 返回容器的理论上最大容量。 |\n| `size()` | 返回容器中的元素个数。 |\n| `swap(second)`\
  \ | `second` 参数必须是与调用对象类型相同的 `map` 对象。该函数交换调用对象与 `second` 对象的内容。 |\n| `upper_bound(value)`\
  \ | 返回指向键大于 `value` 的第一个元素的迭代器。 |\n\n下面是如何定义一个用于存储整数的 `set` 容器的示例：\n\n```\nset<int>\
  \ numbers;\n```\n\n该语句定义了一个名为 `numbers` 的 `set` 容器。在尖括号 `<>` 中，数据类型 `int` 是每个元素的类型。你可以提供一个初始化列表来初始化\
  \ `set`，如下所示：\n\n```\nset<int> numbers = {1, 2, 3, 4, 5};\n```\n\n这是一个定义一个用于存储字符串的\
  \ `set` 的示例：\n\n```\nset<string> names = {\"Joe\", \"Karen\", \"Lisa\", \"Jackie\"\
  };\n```\n\n`set` 不能包含重复项，因此，如果相同的值在初始化列表中出现多次，它将只添加到 `set` 中一次。例如，以下 `set` 将包含值\
  \ 1, 2, 3, 4 和 5：\n\n```\nset<int> numbers = {1, 1, 2, 3, 3, 3, 4, 5, 5};\n```\n\
  \n# 向现有的 `set` 添加元素\n\n`set` 类提供了一个 `insert()` 成员函数，用于向容器添加新元素。你只需调用该成员函数并将新元素的值作为参数传递即可。下面的代码是一个示例：\n\
  \n```\nset<int> numbers;\nnumbers.insert(10);\nnumbers.insert(20);\nnumbers.insert(30);\n\
  ```\n\n第一个语句创建了一个名为 `numbers` 的空 `set` 容器。随后的语句将值 10、20 和 30 添加到集合中。如果你插入的值已经存在于\
  \ `set` 中，`insert()` 成员函数将不执行任何操作（不会插入新元素）。\n\n### 注意\n\n`set` 类还提供了 `emplace()`\
  \ 成员函数用于插入元素。你稍后会看到它的示例。要复 `emplace()` 和 `insert()` 成员函数之间的区别，请参见本章关于 `vector` 节中关于构造（emplacement）的讨论。\n\
  \n# 使用基于范围的 for 循环遍历 `set`\n\n基于范围的 `for` 循环遍历 `set` 中所有元素的一种方便方法。下面的代码展示了显示 `set`\
  \ 中所有元素的示例：\n\n```\n// 创建一个包含名字的集合。\nset<string> names = {\"Joe\", \"Karen\", \"\
  Lisa\", \"Jackie\"};\n\n// 显示每个元素。\nfor (string element : names)\n{\ncout << element;\n\
  }\n```\n\n# 在 `set` 使用迭代器\n\n你可以使用双向迭代器来访问 `set` 的元素。`set` 类提供了 `begin()` 和 `cbegin()`\
  \ 成员函数，它们返回指向第一个元素的迭代器；`end()` 和 `cend()` 成员函数则返回指向 `set` 结尾的迭代器。下面的代码展示了使用迭代器显示\
  \ `set` 中所有元素的示例：\n\n```\n// 创建一个包含名字的集合。\nset<string> names = {\"Joe\", \"Karen\"\
  , \"Lisa\", \"Jackie\"};\n\n// 创建迭代器。\nset<string>::iterator iter;\n\n// 使用迭代器显示集合中的每个元素。\n\
  for (iter = names.begin(); iter != names.end(); iter++)\n{\ncout << *iter;\n}\n\
  ```\n\n### 注意\n\n`end()` 和 `cend()` 成员函数返回指向 `set` 结尾的迭代器，但它并不指向实际元素。它指向如果额外的元素出现在最后一个元素的位置\n\
  \n# 判断值是否存在于 `set` 中\n\n你可以使用 `count()` 成员函数或 `find()` 成员函数来确定一个值是否存在于 `set` 中。`count()`\
  \ 函数接受所需的值作为参数，如果在 `set` 中找到，则返回 1；如果未找到则返回 0。这是一个示例：\n\n```\nset<string> names\
  \ = {\"Joe\", \"Karen\", \"Lisa\", \"Jackie\"};\nif (names.count(\"Lisa\"))\ncout\
  \ << \"Lisa 在集合中找到了。\\n\";\nelse\ncout << \"Lisa 未找到。\\n\";\n```\n\n`find()` 成员函数接受所需的值作为参数，如果在\
  \ `set` 中找到了元素，则返回指向该元素的迭代器。如果没有找到该元素，`find()` 函数返回指向 `set` 结尾的迭代器。下面的代码是一个示例：\n\
  \n```\n// 创建一个包含名字的集合。\nset<string> names = {\"Joe\", \"Karen\", \"Lisa\", \"Jackie\"\
  };\n\n// 创建迭代器。\nset<string>::iterator iter;\n\n// 查找 \"Karen\"。\niter = names.find(\"\
  Karen\");\n\n// 显示结果。\nif (iter != names.end())\n{\n   cout << *iter << \"找到了。\\\
  n\";\n}\nelse\n{\n   cout << \"Karen 未找到。\\n\";\n}\n```\n\n# 在 `set` 中存储自定义类的对象\n\
  \n只要该类重载了 `<` 运算符，你就可以在 `set` 中存储你编写的类的对象。`set` 类使用 `<` 运算符来确定存储元素的顺序，并检测重复项。（假设我们正在比较两个值：`value1`\
  \ 和 `value2`。如果 `value1` 不小于 `value2` 且 `value2` 不小于 `value1`，那么这两个值就是相等的。这就是 `set`\
  \ 类用于判断两个值是否为重复项的逻辑。）\n\n\n\n\n例如，回想在本章之前讨论 `map` 类时展示的 `Customer` 类。（参见 `Customer.h`\
  \ 文件的内容）。`Customer` 类存储了关于客户的两个数据项：客户编号和客户姓名。该类还有一个重载的 `<` 运算符，用于比较客户编号。如果我们把 `Customer`\
  \ 类的对象存储在 `set` 容器中，对象将按照客户编号进行排序，并且容器不允许存储具有相同客户编号的对象。程序 17-22 演示演示了这一点。\n\n让我们仔细观察这个程序：\n\
  \n*   第 9 行到第 13 行定义了一个名为 `customerset` 的 `set` 容器。该容器用三个 `Customer` 对象初始化。\n* \
  \  第 16 行调用了 `emplace()` 成员函数向 `set` 中添加一个 `Customer` 对象。然而，传递给 `emplace()` 函数的客户编号已经在\
  \ `set` 中了。结果是该对象不会被添加到 `set` 中。\n*   第 20 行到第 24 行的循环显示了 `set` 容器的所有元素。注意程序输出，元素是按照客户编号的顺序检索的。\n\
  *   接下来，程序在 `set` 容器中搜索客户编号为 1002 的对象。第 28 行的语句定义了一个迭代器，将其赋值为 `find()` 成员函数的返回值。\n\
  *   仔细查看我们传递给 `find()` 成员函数的参数。表达式 `Customer(1002, \"\")` 构造了一个临时的、无名的 `Customer`\
  \ 对象，其客户编号为 1002，客户姓为 `\"\"`。（由于我们只是用这个对象来搜索客户编号为 1002 的元素，因此不需要为客户姓名提供有意义的值）。`find()`\
  \ 成员函数将接受这个 `Customer` 对象作为参数，并在容器中搜索具有匹配客户编号的元素。（记住，`set` 容器使用 `Customer` 类重载的\
  \ `<` 运算符来判断两个对象是否相等）。如果找到匹配元素，函数返回一个指向该元素的迭代器；否则，它返回一个指向容器末尾的迭代器。\n*   第 30 行到第\
  \ 33 行的 `if`/`else` 语句测试迭代器以判断它是指向匹配元素还是容器末尾，并显示指示搜索结果的消息。\n\n# `multiset` 类\n\n\
  `multiset` 类允许你创建一个可以存储重复元素的 `set` 容器。要使用 `multiset` 类，你需要在程序中使用 `#include <set>`\
  \ 指令。该类提供了与 `set` 类相同的成员函数，但有两点不同：\n\n*   在 `set` 类中，`count()` 成员函数返回 0 或 1。在 `multiset`\
  \ 类中，`count()` 成员函数可以返回大于 1 的值。\n*   在 `set` 类中，`equal_range()` 成员函数返回最多包含 1 个元素的范围。在\
  \ `multiset` 类中，`equal_range()` 成员函数可以返回包含多个元素的范围。\n\n# `unordered_set` 和 `unordered_multiset`\
  \ 类\n\n从 C++11 开始，STL 提供了名为 `unordered_set` 和 `unordered_multiset` 的类模板。它们与 `set`\
  \ 和 `multiset` 类相似，但在两个方面不同：(1) 存储在 `unordered_set` 或 `unordered_multiset` 中的值没有以任何特定方式排序，(2)\
  \ `unordered_set` 和 `unordered_multiset` 类的性能优于 `set` 和 `multiset` 类。如果你对大量元素进行大量搜索，并且不在意以任何顺序检索它们，你应该使用\
  \ `unordered_set` 或 `unordered_multiset` 类代替 `set` 或 `multiset`。\n\n要使用 `unordered_set`\
  \ 或 `unordered_multiset` 类，你必须在程序中编写 `#include <unordered_set>` 指令。在大多数情况下，操作 `unordered_set`\
  \ 或 `unordered_multiset` 与操作 `set` 或 `multiset` 是相似的。\n\n## 检查点\n\n1.  17.28 `set`\
