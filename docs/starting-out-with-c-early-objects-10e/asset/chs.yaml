  \n## 编程挑战\n\n# 1. 日期\n\n设计一个名为 `Date` 的类，它具有整数数据成员来存储月份、日期和年份。该类应该有一个三参数的默认构造函数，允许在创建对象时设置日期。如果在创建\
  \ `Date` 对象时未提供参数，或者传递的值无效，则应使用默认值 2001 年 1 月 1 日（January 1, 2001）。该类应具有成员函数，以以下格式打印日期：\n\
  \n```\n3/15/20\nMarch 15, 2020\n15 March 2020\n```\n\n通过编写使用该类的程序来演示。确保你的程序只接受合理的月份和日期。月份应在\
  \ 1 到 12 之间。\n\n# 2. 报告标题\n\n设计一个名为 `Heading` 的类，它具有存储公司名称和报告名称的数据成员。双参数构造构造允许在创建\
  \ `Heading` 对象时指定这些内容。如果用户在不传递参数的情况下创建 `Heading` 对象，则应使用 `ABC Industries` 作为公司名称的默认值，使用\
  \ `Report` 作为报告名称的默认值。该类应具有成员函数，以单行格式打印：\n\n```\nPet Pals Payroll Report\n```\n\n\
  或者四行的框格式：\n\n```\n********************************\n                       Pet Pals\n\
  \                    Report\n********************************\n```\n\n尝试一种根据长度在屏幕上居中标题的方法。通过编写一个使用该类的简单程序来演示。\n\
  \n# 3. 零件工厂\n\n设计一个用于零件工厂的类。假设每小时可以生产 10 个零件，该类对象将计算生产任何数量零件需要的天数。（工厂每天运行两个 8 小时班次。）编写一个程序，询问用户已订单的零件数量，然后显示生产它们所需的天数。思考你的程序应该接受什么样的订单数量值。\n\
  \n# 4. 汽车类\n\n编写一个名为 `Car` 的类，它具有以下成员变量：\n\n- `year`。存储汽车型号年份的 `int`。\n- `make`。存储汽车品牌的\
  \ `string` 对象。\n- `speed`。存储汽车当前速度的 `int`。\n\n此外，该类应具有以下成员函数。\n\n- 构造函数。构造函数接受汽车的\
  \ `year` 和 `make` 作为参数，并将这些值赋予对象的 `year` 和 `make` 成员变量。构造函数将 `speed` 成员变量初始化为 0。\n\
  - 访问器。应创建适当的访问函数，以便从对象的 `year`、`make` 和 `speed` 成员变量中检索值。\n\n\n\n\n\n*   `accelerate.`\
  \ `accelerate` 函数每次被调用时都应该向 `speed` 成员变量加 5。\n*   `brake.` `brake` 函数每次被调用时都应该从\
  \ `speed` 成员变量减 5。\n\n在一个程序中演示该类，该程序创建一个 `Car` 对象，然后调用 `accelerate` 函数五次。在每次调用 `accelerate`\
  \ 函数后，获取汽车的当前速度并显示。然后，调用 `brake` 函数五次。在每次调用 `brake` 函数后，获取汽车的当前速度并显示。\n\n# 5. 人口\n\
  \n在人口群体中，出生率和死亡率的计算方式如下：\n\n$$\\begin{array}{l} {\\text{Birth~Rate} = \\text{Number~of~Births}\
  \ \\div \\text{Population}} \\\\ {\\text{Death~Rate} = \\text{Number~of~Deaths}\
  \ \\div \\text{Population}} \\end{array}$$\n\n例如，在一个人口为 100,000 的群体中，每年有 5,000 人出生和\
  \ 2,000 人死亡，\n\n$$\\begin{array}{l} {\\text{Birth~Rate} = \\text{5,000} \\div \\\
  text{100,000} = \\text{0}\\{.05}} \\\\ {\\text{Death~Rate} = \\text{2,000} \\div\
  \ \\text{100,000} = \\text{0}\\{.02}} \\end{array}$$\n\n设计一个 `Population` 类，用于存储某个地理区域当前口、年出生人数和死亡人数。该类应允许通过两种方式设置这三个值：在创建新的\
  \ `Population` 对象时向三参数构造函数传递参数，或者通过调用 `setPopulation`、`setBirths` 和 `setDeaths`\
  \ 类成员函数。在任何情况下，如果传递给类的数字小于 2，则使用默认值 2。如果传递的出生或死亡人数小于 0，则使用默认值 0。该类还应该有 `getBirthRate`\
  \ 和 `getDeathRate` 函数，用于计算并返回出生率和死亡率。编写一个短程序使用 `Population` 类并演示其功能。\n\n# 6. 小费计算器\n\
  \n设计一个 `Tips` 类，用于计算餐厅餐费的小费。它唯一的类成员变量 `taxRate` 应通过单参数构造函数设置，其值为创建 `Tips` 对象时传递给它的任何费率。如果没有传递参数，则应使用\
  \ .085 的默认税率。该类应仅有一个公共函数 `computeTip`。此函数需要接受两个参数：账单总金额和小费率。它应该使用总单金额以及存储在 `taxRate`\
  \ 成员变量中的值，计算加税前的餐费成本。然后，它应将小费率仅应用于账单中的餐费部分，以计算并返回小费金额。通过创建一个程序来演示该类，该程序创建一个单个 `Tips`\
  \ 对象，然后使用一个哨兵控制的循环让用户使用不同的账单总额和所需的小费率获取正确的小费金额。\n\n# 7. 电影数据\n\n编写一个使用名为 `MovieData`\
  \ 的结构的程序，存储电影的以下信息：标题、导演、发行年份和片长。\n\n包含一个构造函数，允许在创建 `MovieData` 变量时指定这四个成员数据值。程序应创建两个\
  \ `MovieData` 变量，并依次将每个变量传递给一个函数，该函数以清晰格式显示电影信息。通过值将 `MovieData` 变量传递给显示函数。\n\n\
