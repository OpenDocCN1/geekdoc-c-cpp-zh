  \ 浮点数类型\n\n### 概念\n\n浮点数类型用于定义包含小数的数字。整数对于许多任务是不够的。\n\n### 注意\n\n浮点数可以以科学计数法表示。在\
  \ C++ 中，浮点数通常以十进制表示。表 2-8 展示了浮点数在科学计数法中的表示方式。浮点数可以以科学计数法表示。`72819` 乘以 10。在科学计数法中，`72819`\
  \ 是浮点数。\n\n## 表 2-8 浮点数的表示\n\n| 十进制表示法 | 科学计数法 | E 计数法 |\n| --- | --- | --- |\n\
  | 47.91 | 2.4791 × 10² | 2.4791E2 |\n| 0.0072 | 7.2 × 10⁻⁴ | 7.2E−4 |\n| 2,900,000\
  \ | 2.9 × 10⁶ | 2.9E6 |\n\n在 C++ 中，三种数据类型可以表示浮点数：\n\n```\nfloat\ndouble\nlong double\n\
  ```\n\n`float` 类型被认为是单精度。`double` 类型通常是 `float` 的两倍，因此是双精度。正如你可能猜到的，`long double`\
  \ 设计比 `double` 大。这些数据类型的精确大小取决于你使用的计算机。唯一的保证是：\n\n* `double` 至少与 `float` 大。\n* `long\
  \ double` 至少与 `double` 大。\n\n表 2-9 显示了浮点数据类型的典型大小和范围。\n\n## 表 2-9 PC 浮点数据类型\n\n\
  | 数据类型 | 关键字 | 大小 | 范围 | 有效数字 |\n| --- | --- | --- | --- | --- |\n| 单精度 | `float`\
  \ | 4 字节 | ±3.4E−38 到 ±3.4E38 | `7` |\n| 双精度 | `double` | 8 字节 | ±1.7E−308 到 ±1.7E308\
  \ | `16` |\n| 长双精度 | `long double` | 8 字节^* | ±1.7E−308 到 ±1.7E308 | `16` |\n\n\
  ^*某些编译器为 `long double` 使用多于 8 字节。这允许更大的范围。\n\n你会注意到没有无符号浮点数据类型。在所有机器上，`float`、`double`\
  \ 和 `long double` 类型的变量都可以存储正数和负数。程序 2-11 使用了浮点数据类型。\n\n\n\n浮点数字面量（有时称为浮点常数）可以用多种方式表示。如[程序\
  \ 2-11](#fileP7001016089000000000000000000ED6.xhtml_P7001016089000000000000000000F2F）所示，E\
  \ 计数法是其中一种方法。当你编写极大或极小的数字时，这可能是最简单的方法。E 计数法数字可以使用大写的 `E` 或小写的 `e` 表示。注意在源代码中，字面量被写为\
  \ `1.496E8` 和 `1.989E30`，但程序打印时显示为 `1.496e+008` 和 `1.989e+030`。这两组数字是等价的。指数前的加号也是可选的。\n\
  \n你也可以用十进制表示表示浮点数字面量。字面量 `1.496E8` 可以写成：\n\n```\n149600000.0\n```\n\n显然，E 计数法对于长数字更方便；但对于像\
  \ `47.39` 这样的数字，十进制表示优于 `4.739E1`。\n\n以下浮点数字面量都是等价的：\n\n```\n1.496E8\n1.496e8\n\
  1.496E+8\n1.496e+8\n149600000.0\n```\n\n浮点数字面量通常在内存中存储为 `double` 类型。如果你需要将其存储为 `float`\
  \ 类型，可以在末尾添加字母 `F` 或 `f`。例如，以下字面量将被存储为 `float` 类型数字：\n\n```\n1.2F\n45.907f\n```\n\
  \n### Note\n\n由于浮点数字面量通常在内存中存储为 `double`，因此当你将浮点数字面量赋值给 `float` 变量时，某些编译器会发出警告信息。例如，如果\
  \ `num` 是一个 `float` 类型，以下语句可能会导致编译器生成警告信息：\n\n```\nnum = 14.725;\n```\n\n你可以通过在浮点数字面量后添加\
  \ `f` 后缀来抑制错误信息，如下：\n\n```\nnum = 14.725f;\n```\n\n如果你想强制将一个值存储为 `long` `double`，请在其后添加\
  \ `L`，如下：\n\n```\n1034.56L\n```\n\n由于小数点的存在，编译器不会将其误认为长整数。也可以使用小写字母 `l` 将浮点数字面量定义为\
  \ `long double`，但最好使用大写 `L`，因为小写字母 `l` 很容易与数字 `1` 混淆。\n\n## 将浮点值赋予整数变量\n\n当将浮点值赋值给整数变量时，数值的小数部分（小数点后的）会被丢弃。这是因为整数变量无法包含任何小数的值。例如，看以下代码。\n\
  \n```\nint number;\nnumber = 7.8;          // 将 7 赋值给 number\n```\n\n这段代码尝试将浮点值\
  \ `7.8` 赋值给整数变量 `number`。因为这是不可能的，值 `7` 被赋值给 `number`，小数部分被丢弃。当以这种方式丢弃值的一部分时，该值被称为*截断*（truncated）。\n\
  \n将浮点变量赋予整数变量具有相同的效果。例如，看以下代码。\n\n```\nint intVar;\ndouble doubleVar = 7.8;\nintVar\
  \ = doubleVar;       // 将 7 赋值给 intVar\n                          // doubleVar 保持为\
  \ 7.8\n```\n\n## Warning!\n\n浮点变量可以比整数变量更大的范围。如果将浮点值存储在整数变量中，而该值的整数部分（小数点前的）对于整数变量来说太大，则整数变量将存储一个无效值。\n\
