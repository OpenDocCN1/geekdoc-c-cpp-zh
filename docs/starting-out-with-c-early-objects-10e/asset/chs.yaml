  \ `main` 以外的函数终止程序。为了实现这一点，使用了 `exit` 函数。\n\n当调用 `exit` 函数时，它会导致程序停止，无论调用位于哪个函数中。程序\
  \ 6-30 展示了这一点。\n\n`exit` 函数被调用时，它会导致程序停止，无论调用位于哪个函数中。注意函数的返回值不是签名的一部分。以下函数不能在同一个程序中使用，因为它们的参数列表相同：\n\
