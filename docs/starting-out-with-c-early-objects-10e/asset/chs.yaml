  4. 11.40 假设有两个类，`Big` 和 `Small`。编写一个转换构造函数的原型，该构造函数用于将 `Small` 类型的对象转换为 `Big` 类型的对象。\n\
  \n## 11.10 聚合与组合\n\n### 概念\n当一个类的对象拥有另一个类的对象时，就会发生类聚合（Aggregation）。类组合（Composition）是聚合的一种形式，其中所有者类控制被所有者类对象的生命周期。\n\
  \n在第 7 章中，你学习了类可以包含其本身是其他类对象的成员。当类 `C` 包含一个作为另一个类 `D` 对象的成员时，每个 `C` 的对象内部都会包含一个类\
  \ `D` 的对象。这在 `C` 和 `D` 之间创建了*拥有*（has-a）的关系。在这种关系中，`C` 的每一个实例都拥有（或持有）类 `D` 的实例。这在图\
  \ 11-5 中所示。\n\n## 图 11-5 通过实例包含实现的聚合\n![一张图表显示了一个正方形的容器，标记为“C 类对象”。内部是另一个矩形的容器，标记为“D\
  \ 类对象”。](img/FG_11_005.png)\n\n在 C++ 中，这种所有权关系通常是由于 `C` 拥有一个类型为 `D` 的成员而产生，但也可以由于\
  \ `C` 拥有指向 `D` 对象的指针而产生，如图 11-6 所示。\n\n## 图 11-6 通过指向对象的指针实现的聚合\n![一张图表显示了两个矩形容器。它们被标记为“C\
  \ 类对象”和“D 类对象”。有一个箭头从“C 类对象”的主体指向“D 类对象”的名称。](img/FG_11_006.png)\n\n## 成员初始化列表\n\
  在第 7 章中，你学习了初始化类成员的方法之一是使用构造函数配合初始化列表。这里是一个示例。\n\n```cpp\n class Date\n{\n   string\
  \ month;\n   int day, year;\npublic:\n   Date(string m, int d, int y):\n      month(m),\
  \ day(d), year(y)  // 初始化列表\n   {\n   }\n};\n```\n\n## 注意事项\n记住在使用成员初始化列表时要包含所需的冒号。\n\
  \n*聚合*（Aggregation）一词通常泛泛地描述一个类的对象拥有其他类对象的情况。\n\n为了查看当一个类拥有另一个类的对象时，如何使用成员初始化列表，这里有一个拥有\
  \ `Date` 类实例的 `Person` 类的定义部分。\n\n```cpp\n class Person\n{\n   String name;\n  \
  \ Date dateOfBirth;\npublic:\n   // 构造函数\n   Person(string theName, string mo, int\
  \ day, int year):\n      name(theName),\n      dateOfBirth(mo, day, year)\n   {\n\
  \   }\n   后续是其他函数 ...\n};\n```\n\n注意，在调用包含的 `Date` 对象的构造函数时，使用的是*对象的名称* `dateOfBirth`，而不是*对象的类*\
  \ `Date`。\n\n## 通过指针实现的聚合\n现在让我们假设，除了出生日期外，每个人都有一个居住国家。一个国家有一个名称并可能还有许多其他属性：\n\n\
  ```cpp\n class Country\n{\n   string name;\n   // 额外字段\n};\n```\n\n由于许多人会“拥有”同一个国家，`Person`\
  \ 和 `Country` 之间的 has 关系不应通过在每个 `Person` 对象中嵌入 `Country` 类的实例来实现。由于许多人共享同一个居住国家，通过包含关系来实现\
  \ has 关系会导致数据不必要的重复和内存浪费。此外，每当一个国家的任何数据发生变化时，都需要更新许多 `Person` 对象。使用指针来实现 has 关系可以避免这些问题。以下是\
  \ `Person` 类的版本，修改后包含一个指向居住国的的指针：\n\n```cpp\n class Person\n{\n   string name;\n\
  \   Date dateOfBirth;   \n   shared_ptr<Country> pCountry;  // 指向居住国的指针\npublic:\n\
  \   Person(string theName, string month, int day, \n          int year, shared_ptr<Country>&\
  \ pC):       \n          name(theName), dateOfBirth(month, day, year),\n       \
  \   pCountry(pc)\n   {\n   }\n};\n```\n\n## 聚合、组合与生命周期\n聚合、组合与生命周期\n*组合*（Composition）是一个用于描述被所有对象的生命周期与所有者重合的聚合特殊情况的术语。一个很好的例子是当一个类包含另一个类的对象时。以下程序通过修改的类来展示聚合和组合。每个类都有一个构造函数表示创建，以及一个析构函数表示结束。\n\
  \n```cpp\nstatic int uniqueID;\n```\n\n这些数字在创建时标识 `Person`，就像社会安全号码用于标识人们一样。`Date`\
  \ 对象与它的 `Person` 对象之间的关系是组合的一个例子。从程序输出可以看出，这些 `Date` 对象是同时创建并销毁的。更通用的聚合由 `Person`\
  \ 和 `Country` 之间的 has 关系所体现。\n\n## has 关系\n当一个类包含第二个类的实例时，第一个类被认为与第二个类维持着*拥有*（has-a）的关系。例如，`Person`\
  \ 类通过 `dateOfBirth` 拥有 `Date` 类，而 `Date` 类通过 `month` 成员拥有 `string` 对象。这种关系在设计对象系统时建模类与类之间的关系非常重要。程序中的另一个重要关系是\
  \ is 关系，我们将在之后讨论完继承概念后讨论它。因此，对象组合实现了 has 关系，而正如我们以后看到的，继承是实现 is 关系的一种方式。\n\n## 11.11\
  \ 继承\n\n## 泛化与特化\n在现实世界中，你可以发现许多对象的特化版本。例如，“昆虫”一词描述了一种具有许多特征的非常通用生物。由于蚂蚱和蜜蜂都是昆虫，它们拥有昆虫的所有通用特征。此外，它们还有自己的特殊特征。例如，蚂蚱具有跳跃能力，蜜蜂有蜂刺。蚂蚱和蜜蜂是昆虫的特化版本。这在图\
  \ 11-7 中所示。\n\n## 图 11-7 继承中的共同点与差异\n\n\n\n\n\n![树图解释了继承中的共同点和差异。](img/FG_11_007.png)图\
  \ 11-7 完整替代文本\n\n## 继承与“是”关系\n\n当一个对象是另一个对象的特化版本时，它们之间就存在一种 `is-a relationship`。例如，蚂蝗\
  \ `is an` 昆虫。以下是“是”关系的其他几个例子：\n\n*   贵宾犬 `is` 狗。\n*   汽车 `is` 交通工具。\n*   矩形 `is`\
  \ 形状。\n\n当对象之间存在“是”关系时，意味着特化对象具有通用对象的所有特征，还具有使其变得特殊的额外特征。在面向对象编程中，`inheritance`\
  \ 用于在类之间建立这种“是”的关系。\n\n继承涉及一个基类和一个派生类。`base class` 是通用类，而 `derived class` 是特化类。派生类基于基类（或派生自基类）。你可以将基类视为父类，将派生类视为子类。这在图\
  \ 11-8 中所示。\n\n## 图 11-8 继承中的父子关系\n\n![图表展示了父子关系。](img/FG_11_008.png)图 11-8 完整替代文本\n\
  \n派生类继承基类的成员变量和成员函数，而无需对任何一个进行重写。此外，可以向派生类中添加新的成员变量和函数，使其比基类更特化。举一个具体的例子，考虑一个既有学生又有教职人员的大学环境。假设我们有一个\
  \ `Person` 类，它包含一个 `name` 数据成员以及用于处理 `name` 成员的成员函数：\n\n```\n class Person\n{\n\
  private:\n    string name;\npublic:\n    Person() { setName(\"\"); }\n    Person(const\
  \ string& pName) { setName(pName); }\n    void setName(const string& pName) { name\
  \ = pName; }\n    string getName() const { return name; }\n};\n```\n\n假设我们还有这些枚举类型\n\
  \n```\nenum class Discipline {ARCHEOLOGY, BIOLOGY, COMPUTER_SCIENCE};\nenum class\
  \ Classification {FRESHMAN, SOPHOMORE, JUNIOR, SENIOR};\n```\n\n用来定义提供课程的学科范围以及学生的分类。我们可以使用这些类型定义继承自\
  \ `Person` 的 `Student` 和 `Faculty` 类。这是合理的，因为 `Student` 是一个 `Person`，而 `Faculty`\
  \ 成员也是一个 `Person`。\n\n通过继承定义一个类，我们需要指定基类以及派生类为基类添加的额外成员。假设除了具有 `Person` 的所有特征外，`Student`\
  \ 必须必须声明某个学科的专业，并拥有一个作为 `Person` 的学术导师。`Student` 类可以定义如下：\n\n```\n class Student\
  \ : public Person\n{\nprivate:\n    Discipline major;\n    shared_ptr<Person> advisor;\n\
  public:\n    void setMajor(Discipline d) { major = d; }\n    Discipline getMajor()\
  \ const { return major; }\n    void setAdvisor(shared_ptr<Person> p) { advisor =\
  \ p; }\n    shared_ptr<Person> getAdvisor() const { return advisor; }\n};\n```\n\
  \n我们假设许多不同的学生可能有同一个导师。`Student` 对象存储一个指向导师的共享智能指针，以避免内存管理问题。\n\n类声明第一行的第一部分指定 `Student`\
  \ 为正在定义的类名，并指定现有类 `Person` 为其基类：\n\n![类声明第一行的第一部分指定。](img/Page_789.png)\n\n位于基类名称之前的关键字\
  \ `public` 是 `base class access specification`（基类访问说明符）。它影响了派生类的成员函数以及这两个类外部的代码访问基类成员的方式。我们将在稍后的章节中更详细地讨论基类访问说明符。\n\
  \n一个类可以作为多个派生类的基类。特别是，`Faculty` 类也可以如下派生自 `Person` 类：\n\n```\n class Faculty : public\
  \ Person\n{\nprivate:\n  Discipline department;\npublic:\n  void setDepartment(Discipline\
  \ d) { department = d; }\n  Discipline getDepartment( ) const { return department;\
  \  }\n};\n```\n\n因此，`Faculty` 对象是一个在某些学科中拥有所属部门的 `Person` 对象。同样重要的是，派生类的每个对象都包含基类的所有成员。这在图\
  \ 11-9 在 `Student` 和 `Faculty` 类的情况下中所示。\n\n## 派生过程中的新成员\n\n![图表展示了父子关系。](img/FG_11_008.png)图\
  \ 11-8 完整替代文本\n\n## 继承与指针\n\n每当涉及继承时，对象应该是动态分配并通过指针访问的。为了理解这一点，考虑一个同时处理 `Student`\
  \ 和 `Person` 类型的程序。由于 `Student` 是 `Person`，我们应该可以将 `Student` 对象传递给期望 `Person` 的函数，或者将\
  \ `Student` 对象赋值给 `Person` 类型的变量：\n\n```\nPerson p;\nStudent s;\n```\n\n如果我们处理的是指针，这种情况就不会发生。程序\
  \ 11-9 通过创建一个 `Faculty` 对象演示了派生类对象的创建和使用。该程序使用将枚举值映射到字符串的数组以便以便字符串的形式打印枚举值。\n\n\
  ## inheritance.h 内容\n\n```cpp\n1 #include <string>\n2 #include <memory>\n3 using\
  \ namespace std;\n4\n5 enum class Discipline {ARCHEOLOGY, BIOLOGY, COMPUTER_SCIENCE};\n\
  6 enum class Classification {FRESHMAN, SOPHOMORE, JUNIOR, SENIOR};\n7\n8 class Person\n\
  9 {\n10 private:\n11     string name;\n12 public:\n13     Person() { setName(\"\"\
  ); }\n14     Person(const string& pName) { setName(pName); }\n15     void setName(const\
  \ string& pName) { name = pName; }\n16     string getName() const { return name;\
  \ }\n17 };\n18\n19 class Student : public Person\n20 {\n21 private:\n22     Discipline\
  \ major;\n23     shared_ptr<Person> advisor;\n24 public:\n25     void setMajor(Discipline\
  \ d) { major = d; }\n26     Discipline getMajor() const { return major; }\n27  \
  \   void setAdvisor(shared_ptr<Person> p) { advisor = p; }\n28     shared_ptr<Person>\
  \ getAdvisor() const { return advisor; }\n29 };\n30\n31 class Faculty : public Person\n\
  32 {\n33 private:\n34     Discipline department;\n35 public:\n36     void setDepartment(Discipline\
  \ d) { department = d; }\n37     Discipline getDepartment() const { return department;\
  \ }\n38 };\n```\n\n## 超类与子类\n\n\n\n\n我们可以将类看作是描述具有某些特征的所有对象的集合。派生类的对象继承了基类的所有特征，因此可以被视为属于基类。因此，派生类的对象只是基类的特化版对象。出于这个原因，派生类通常被称为基类的\
  \ `subclass`（子类），而基类被称为派生类的 `superclass`（父类）。\n\n## 多重继承\n\nC++ 支持`multiple inheritance`多重继承），即派生类同时继承自两个或多个基类。虽然多重继承很有趣，但它可能导致程序非常难以理解，在实践中很少有用。你可以在书籍辅助网站上的附录\
  \ H 中找到对此的讨论。\n\n书籍辅助网站上的附录 F 展示了如何使用 UML 表示继承。\n\n## 11.12 保护成员和类访问\n\n### 概念\n\
  \n基类的保护成员与私有成员相似，区别在于它们可以被派生类访问。基类访问说明符决定了当派生类继承基类成员时，私有、保护和公共成员是如何被访问的。\n\n到目前为止，你在类内部使用了两种访问说明符：`private`\
  \ 和 `public`。C++ 提供了第三种访问说明符：`protected`。基类的保护成员与私有成员相似，区别在于它们可以被派生类的成员函数访问。保护成员对程序中的所有其他代码都是不可访问的。⁶\n\
  \n让我们假设想在 `Faculty` 类中添加一个构造函数，该函数接受教授的名字和部门作为参数。实现这一点的最佳方法是让该构造函数调用从 `Person` 类继承的\
  \ `setName()` 成员函数。然而，为了说明保护成员的使用，我们将 `Person` 类中 `name` 字段的访问说明改为 `protected`，并让\
  \ `Faculty` 构造函数直接访问它。我们对 `Student` 类进行了类似的修改，添加了一个接受参数并设置保护成员 `name` 的构造函数。生成的代码存储在\
  \ `inheritance1.h` 文件中：\n\n## `inheritance1.h` 的内容\n\n```cpp\n 1 #include <string>\n\
  \ 2 #include <memory>\n 3 using namespace std;\n 4\n 5 enum class Discipline {ARCHEOLOGY,\
  \ BIOLOGY, COMPUTER_SCIENCE};\n 6 enum class Classification {FRESHMAN, SOPHOMORE,\
