  \n# 6.6 `return` 语句\n\n### 概念\n\n`return` 语句会导致函数立即结束。\n\n当函数的最后一个语句执行完毕时，它会返回到调用它的。然而，可以强制函数返回到执行最后语句之前的地方。这可以通过\
  \ `return` 语句来实现，如 程序 6-9 所示。\n\n# 6.7 从函数返回值\n\n### 概念\n\n函数可以将一个值发送回给调用它的程序部分。\n\
  \n你已经看到如何通过参数变量将数据传递给函数。数据也可以从函数返回到调用它的语句。返回值的函数被称为*值返回函数*。\n\n`pow` 函数是你已经使用过的，它是值返回函数的示例。这是一个示例：\n\
  \n```\ndouble x;\nx = pow(4.0, 2.0);\n```\n\n\n\n\n\n虽然可以向函数传递多个参数，但它只能返回一个值。你可以将函数想象成具有多个用于接收数据（参数）的通信通道，但只有一个用于传回数据的通道（即返回值）。这在图\
  \ 6-9 中所示所示。\n\n# 图 6-9：函数只能返回一个值\n\n![插图说明了函数只能返回一个值。](img/FG_06_009.png)图 6-9\
  \ 完整替代文本\n\n## 注意事项\n\n为了从函数返回多个值，必须对它们进行“封装”，以便它们被视为单个值。你将在第 7 章中学习如何操作。\n\n# 定义返回值的函数\n\
  \n当你编写返回值的函数时，必须决定函数将返回什么类型的值。这是因为你必须在函数头和函数原型中指定返回值的数据类型。到目前，我们编写的所有函数都是 `void`\
  \ 函数。这意味着它们不返回任何值。这些函数在函数头和函数原型中使用关键字 `void` 作为返回类型。相比之下，返回值的函数在头部中使用 `int`、`double`、`bool`\
  \ 或任何其他有效的数据类型。以下是一个返回 `int` 值的函数示例：\n\n```\nint sum(int num1, int num2)\n{\n  \
  \  int result;\n    result = num1 + num2;\n    return result;\n}\n```\n\n该函数的名为\
  \ `sum`。注意函数头中的返回类型为 `int`，如图图 6-10 中所示。\n\n# 图 6-10：函数返回类型\n\n![函数读取了“int sum(int\
  \ num1, int num2)”。函数中的“int”部分被标记为“返回类型”。](img/FG_06_010.png)\n\n这段代码定义了一个名为 `sum`\
  \ 的函数，它接受两个 `int` 参数。参数被传递给参数变量 `num1` 和 `num2`。在函数内部定义了变量 `result`。在函数内部定义的变量被称为*局部变量*。在变量定义之后，参数变量\
  \ `num1` 和 `num2` 的值相加，并将它们的和赋值给 `result` 变量。函数中的最后一条语句是：\n\n```\nreturn result;\n\
  ```\n\n该语句会导致函数结束，并将 `result` 变量的值传回调用该函数的语句。返回值的函数必须按照以下通用格式编写 `return` 语句：\n\n\
  ```\nreturn expression;\n```\n\n在通用格式中，`expression` 是要返回的值。它可以是任何有值的表达式，例如变量、字面量或数学表达式。表达式的值会被转换为函数返回的数据类型，并传回调用该函数的语句。在这种情况下，`sum`\
  \ 函数返回 `result` 变量中的值。\n\n然而，我们可以完全消除 `result` 变量并返回表达式 `num1 + num2`，如下代码所示：\n\n\
  ```\nint sum(int num1, int num2)\n{\n    return num1 + num2;\n}\n```\n\n返回值的函数原型遵循我们之前过的相同约定。以下是\
  \ `sum` 函数的原型：\n\n```\nint sum(int num1, int num2);\n```\n\n# 调用返回值的函数\n\n程序 6-11\
  \ 显示了如何调用 `sum` 函数的示例。\n\n这里是第 17 行的语句，它调用了 `sum` 函数并将 `value1` 和 `value2` 作为参数。\n\
  \n```\ntotal = sum(value1, value2);\n```\n\n该语句将 `sum` 函数返回的值赋值给变量 `total`。在这种情况下，函数将返回\
  \ 60。图 6-11 显示了如何调用 `sum` 函数。\n\n\n\n\n假设用户输入了 10.0 作为半径，并将此值作为参数传递给 `square` 函数，该函数将返回值\
  \ 100.0。图 6-12 展示了该值是如何被回传并用于数学表达式表达式的。\n\n## 图 6-12 square 函数\n\n![一张图表解释了平方函数。](img/FG_06_012.png)图\
  \ 6-12 完整备用文本\n\n函数可以返回任何类型的值。程序 6-12 中的 `getRadius` 和 `square` 函数都返回一个 `double`。你在程序\
  \ 6-11 中看到的 `sum` 函数返回一个 `int`。当语句调用一个返回值的函数时，它应该妥善处理该返回值。例如，如果你将 `square` 函数的返回值赋值给变量，则该变量应该是\
  \ `double` 类型。如果函数的返回值带有小数部分，而你将其赋值给一个 `int` 变量，该值将被截断。\n\n# 6.8 返回布尔值\n\n### 概念\n\
  \n函数可以返回 `true` 或 `false` 值。\n\n通常需要一个函数来测试参数并返回一个 `true` 或 `false` 值，以表示是否满足某个条件。这样的函数将返回一个\
  \ `bool` 值。例如，下所示的 `isValid` 函数接受一个 `int` 参数，如果参数在 1 到 100 范围内，则返回 `true`，否则返回 `false`。\n\
  \n```cpp\n bool isValid(int number)\n{\n  bool status;\n  if (number >= 1 && number\
  \ <= 100)\n     status = true;\n  else\n       status = false;\n  return status;\n\
  }\n```\n\n以下代码显示了一个调用该函数的 `if/else` 语句：\n\n```cpp\n int value = 20;\nif (isValid(value))\n\
  \    cout << \"The value is within range.\\n\";\nelse\n    cout << \"The value is\
  \ out of range.\\n\";\n```\n\n由于 `value` 等于 20，这段代码执行时将显示消息“The value is within\
  \ range.”。\n\n程序 6-13 展示了另一个返回类型为 `bool` 的函数示例。该程序有一个名为 `isEven` 的函数，如果它的参数是偶数，则返回\
  \ `true`。否则，函数返回 `false`。\n\n注意第 18 行如何通过以下语句调用 `isEven` 函数：\n\n```cpp\n if (isEven(val))\n\
  ```\n\n回想第 4 章，这是询问函数调用 `isEven(val)` 是否返回了值 `true`。当 `if` 语句执行时，以 `val` 作为参数调用\
  \ `isEven`。如果 `val` 是偶数，`isEven` 返回 `true`；否则返回 `false`。\n\n同样注意从第 31 行开始的 `isEven`\
  \ 函数如何使用 `if` 语句返回值 `true` 或值 `false`。该函数还有其他几种编写方式。让我们比较三种不同的编写方式。\n\n| 版本 1 |\
  \ 版本 2 | 版本 3 |\n| :--- | :--- | :--- |\n| ```cpp\n // 程序 6–13 代码\nbool isEven(int\
  \ number)\n{\n   if (number % 2 == 0)\n      return true;\n   else\n      return\
  \ false;\n}\n``` | ```cpp\n // 版本 2\nbool isEven(int number)\n{  bool answer;\n\
  \   if (number % 2 == 0)\n      answer = true;\n   else\n      answer = false;\n\
  \   return answer;\n}\n``` | ```cpp\n // 版本 3\nbool isEven(int number)\n{  bool\
  \ answer = false;\n   if (number % 2 == 0)\n      answer = true;\n   return answer;\n\
  }\n``` |\n\n尽管程序 6-13 中使用的代码简短且清晰，但它有两个不同的 `return` 语句。许多教师倾向于让返回值的函数只有一个 `return`\
  \ 语句，并放置在函数的末。版本 2 和 3 就是这样做的。你的老师会告诉你应该使用哪种方法。\n\n## 检查\n\n1. 6.11 一个函数可以有多少个返回值？\n\
