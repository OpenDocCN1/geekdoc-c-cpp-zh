  \n8. 15.8 抽象类与其他类有什么不同？\n\n9. 15.9 检查以下类。表格列出了 `Third` 类的成员（部分是继承的）。通过填充成员在 `Third`\
  \ 类中的访问说明符来完成表格。如果某个成员对 `Third` 类不可访问，请填写“inaccessible”。\n\n```cpp\nclass First\n\
  {\n   private:\n      int a;\n   protected:\n      double b;\n   public:\n     \
  \ long c;\n};\nclass Second : protected First\n{\n   private:\n      int d;\n  \
  \ protected:\n      double e;\n   public:\n      long f;\n};\nclass Third : public\
