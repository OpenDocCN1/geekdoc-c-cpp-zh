  \ndoubleVal = integer1 / integer2;\ncout << doubleVal << endl;\n\ndoubleVal = static_cast<double>(integer1)\
  \ / integer2;\ncout << doubleVal << endl;\n\ndoubleVal = static_cast<double>(integer1\
  \ / integer2);\ncout << doubleVal << endl;\n```\n\n## 3.4 溢出与下溢\n\n### Concept\n\
  \n当值无法放入数据类型中时，就会发生溢出。\n\n就像如果你尝试往水桶里放更多水就会溢出一样，如果你尝试存储超过变量范围的值，就会遇到类似的问题。让我们来看一个例子。假设\
  \ `short int` 使用 2 字节的最大值为 32767。在不深入探讨负数如何存储的细节的情况下，了解对于存储正负数的整数类型，最高位设置会被解释为负数是有帮助的。如果对其加\
  \ 1，高位将变为 0。\n\n除了溢出，浮点值也可能发生下溢。当一个值太接近零，以至于表示它所需的位数比存储它的变量更多时，就会发生下溢。程序 3-9 说明了溢出下溢。\n\
  \n尽管某些系统在溢出或下溢发生时显示错误消息，但大多数系统不会。变量只会持有一个错误的值且程序继续运行。因此，为每个变量选择具有足够的位以存储你将存储的值的数据类型是非常重要的。\n\
  \n## 3.5 命名常量\n\n### Concept\n\n字面量可以赋予名称，并在程序中符号地表示它们。\n\n在 第 2 章 中，你学习了程序运行时不会改变的值可以作为字面量存储。然而，有时这不是理想的。例如，假设以下语句出现在一个计算贷款数据的银行程序中：\n\
  \n```\namount = balance * 0.069;\n```\n\n在这样的程序中会产生两个潜在问题。首先，对于原始程序员以外的其他人并不清楚 0.069\
  \ 是什么。它看起来是一个利率，但在某些情况下贷款支付还涉及费用。在不费力检查程序其他部分的情况下，如何确定该语句的目的？\n\n第二个问题是，如果这个数字在程序的其他地方都用于计算并且必须定期更改时。假设该数字是利率，如果利率从\
  \ 6.9% 变为 7.2% 怎么办？程序员必须搜索源代码中该数字出现的所有地方。\n\n\n\n这两个问题都可以通过使用命名常量来解决。命名常量（`named\
  \ constant`），也称为常量变量（`constant variable`），类似于变量，但其内容是只读的，在程序运行时不能更改。以下是命名常量的定义：\n\
  \n```\nconst double INTEREST_RATE = 0.069;\n```\n\n它看起来和普通变量定义一样，区别在于数据类型名称之前出现了\
  \ `const` 关键字。`const` 关键字是一个修饰符，告诉编译器将变量设为只读。这确保了它的值在整个程序执行过程中将保持不变。如果程序中的任何语句尝试更改它的值，程序在编译时将产生错误。命名常量可以使用任何法的\
  \ C++ 标识符名称，但许多程序员在名称中使用全大写字母（正如我们在这里所的那样），以便与普通变量区分来。\n\n在定义命名常量时，必须对其进行初始化。它不能先定义，稍后又通过赋值语句赋值。\n\
  \n```\nconst double INTEREST_RATE;     // 非法\nINTEREST_RATE = 0.069;          //\
  \ 非法\n```\n\n使用命名常量的额外优点是它们使程序更具自文档性。一旦命名常量 `INTEREST_RATE` 被正确定义，程序语句\n\n```\n\
  newAmount = balance * 0.069;\n```\n\n就可以更改为：\n\n```\nnewAmount = balance * INTEREST_RATE;\n\
  ```\n\n新程序员可以阅读第二条语句并更好地理解正在发生什么。显而易见，`balance` 正在乘以利率。这种方法的另一个优势是可以很容易对程序进行广泛的更改。假设利率在整个程序中出现在十几个不同的语句中。如果利率发生变化，则命名常量定义中的初始化值是唯一需要修改的值。如果利率增加到\
  \ 7.2%，只需将定义更改为：\n\n```\nconst double INTEREST_RATE = 0.072;\n```\n\n然后程序就可以重新编译。每个使用\
  \ `INTEREST_RATE` 的语句都将使用新值。\n\n命名常量还可以帮助防止程序代码中的拼写错误。例如，假设你在一个执行各种几何计算的程序中使用数字\
  \ 3.14159 作为 `PI` 的值。每当你在程序代码中输入数字 3.14159 时，你都有可能在其中一个或多个数字上出错。为了帮助防止此类错误，你可以为\
  \ `PI` 定义一个命名常量，根据所需的精度用你想要的位数进行初始化。然后你可以在所有需要该值的公式中使用该常量。\n\n[程序 3-10] 计算圆的面积，使用了命名常量。它在第\
  \ 9 行定义并在第 19 行使用。\n\n## 检查点\n\n1. 3.17 使用 `const` 修饰符编写语句为以下字面量创建命名常量：\n\n   |\
