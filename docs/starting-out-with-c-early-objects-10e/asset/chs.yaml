  \ base.\\n\"; }\n};\nclass Camp : public Base\n{\npublic:\n   Camp() { cout << \"\
  Entering the camp.\\n\"; }\n   Camp(string str1, string str2) : Base(str1)\n   {\n\
  \      cout << \"The camp is \" << str2 << \".\\n\";\n   }\n};\nint main()\n{\n\
  \   shared_ptr<Camp>\n   outpost = make_shared<Camp>(\"secure\", \"secluded\");\n\
  \   return 0;\n}\n```\n\n## 11.14 重写基类函数\n\n### 概念\n\n派生类可以通过定义一个具有相同名称和参数列表的派生类成员函数，来重写其基类的成员函数。\n\
  \n对于派生类定义其继承自基类的成员函数的自己的版本通常是有用的。这可能是为了使成员函数特化，以满足派生类的需求。当这种情况发生时，基类成员函数被认为是被派生类`重写`（overridden）或`重定义`（redefined）。\n\
  \n举一个简单的例子，假设我们想要有一个类 `TFaculty`，它允许我们为教职员工的每个成员关联一个头衔，例如“博士”、“教授”或“院长”。为了实现这一点，我们通过从\
  \ `Faculty` 类派生出新类，添加一个 `title` 数据成员、一个适当的构造函数、一个设置头衔的成员函数，然后重写继承的 `getName()` 成员函数以返回带头衔的名称。\n\
  \n```cpp\n class TFaculty: public Faculty\n{\nprivate:\n  string title;\npublic:\n\
  \  // 此构造函数允许指定头衔\n  TFaculty(const string& fname, Discipline d, string title)\n\
  \  : Faculty(fname, d)\n  {\n    setTitle(title);\n  }\n  void setTitle(const string&\
  \ title) { this−>title = title; }\n\n  // 重写 getName 函数\n  string getName( ) const\
  \ { return title + \" \" + name; }\n};\n```\n\n程序 11-22 展示了该类及其重写成员函数的使用。它使用了文件\
  \ `inheritance3.h` 和 `inheritance3.cpp`。`inheritance3.h` 文件只是添加了 `TFaculty` 类声明的\
  \ `inheritance2.h` 文件，而 `inheritance3.cpp` 与 `inheritance2.cpp` 相同。`inheritance2.h`\
  \ 和 `inheritance2.cpp` 的代码列表可以在 11-13 节末尾找到。所有文件的副本包含在书籍辅助网站上。\n\n## 在重写函数的基类版本和派生类版本之间选择\n\
  \n重写了基类成员函数的派生类对象包含了该成员函数的多个版本。编译器将通过使用调用成员函数时表达式中的类型信息来决定调用多个版本中的哪一个。例如，在程序 11-22\
  \ 中，有两个对 `getName()` 的调用：\n\n1. 调用 `prof.getName()` 返回 `Dr. Indiana Jones`，因为该函数是通过\
  \ `prof` 用的，`prof` 的类型是 `TFaculty`。编译器调用 `TFaculty` 版本的 `getName()`。\n\n2. 调用 `pAdvisor−>getName()`\
  \ 返回 `Indiana Jones` 而没有“Dr.”，因为该函数是通过指针 `pAdvisor` 用的，`pAdvisor` 是指向 `Person` 的指针。编译器调用\
  \ Person 版本的 `getName()`。\n\n## 载载与重写的区别\n\n重载和重写都涉及具有相同名称的定义。然而，两者之间存在差异。重写只能在继承中进行，指的是当基类已经有一个函数时，派生类对该成员的定义。重载是指在全局范围内定义具有不同参数列表的不同函数。\n\
  \n## 获取重写成员的访问\n\n如果派生类重写了基类函数，那么派生类中原本会调用基类的成员函数现在现在将调用派生类的函数。能够调用被重写的函数有时是有用的。事实上，派生类的成员函数可能想要调用基类。这是通过使用范围解析运算符来指定类来实现的：\n\
  \n```cpp\nclass TFaculty : public Faculty\n{\nprivate:\n  string title;\npublic:\n\
  \  TFaculty(const string& fname, Discipline d, string title)\n  : Faculty(fname,\
  \ d)\n  {\n    setTitle(title);\n  }\n  void setTitle(const string& title) { this−>title\
  \ = title; }\n\n  // 重写 getName 函数\n  string getName( ) const { return title + \"\
  \ \" + name; }\n};\n```\n\n# 复习题与练习\n\n## 空空题与简答\n\n1. 如果声明了 ____ 成员变量，该类的所有对象都共享该变量。\n\
