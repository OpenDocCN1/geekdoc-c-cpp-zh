  \ number) // 错误！参数列表必须不同\n{\n    return number * number\n}\n```\n\n重载在存在使用不同数量参数的相似函数时，也非常方便。例如，考虑一个带有返回整数之和函数的程序。一个返回两个整数之和，另一个返回三个整数之和，还有一个返回四个整数之和。以下是它们的头文件：\n\
