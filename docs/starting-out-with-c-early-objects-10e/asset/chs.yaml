  \n### 8. 栈复制操作\n\n\n\n\n\n修改[第 19.2 节 fileP700101608900000000000000000ECD2.xhtml_P700101608900000000000000000ECD2)\
  \ 中的 `IntStack` 类，添加一个拷贝构造函数和一个拷贝赋值运算符。在一个程序中测试你的代码，该程序创建一个栈，向其推入一些值，然后通过两种不同的方式拷贝栈：一种使用拷贝构造函数，另一种使用拷贝赋值。你的程序应该包含用于演示新操作正确性的代码。\n\
  \n# 9. 文件反转器\n\n编写一个程序，打开一个文本文件并将其内容读取到一个字符栈中。然后，程序从栈中弹出字符并将它们保存到第二个文本文件中。第二个文件中保存的字符顺序应该是它们在第一个文件中顺序的逆序。\n\
  \n# 10. 平衡括号\n\n如果一个字符串中的每个右括号都与其前面的左括号匹配，则该字符串具有平衡括号，这种匹配方式类似于 C++ 程序中每个右大括号与前面的左大括号的匹配方式。编写一个程序，使用栈来确定键盘输入的字符串是否具有平衡括号。\n\
  \n# 11. 平衡多分隔符\n\n字符串可能使用多种类型的分隔符来将信息括在“块”中。例如，一个字符串可以使用大括号 `{ }`、圆括号 `( )` 和括号\
  \ `[ ]` 作为分隔符。如果每个右分隔符与其前面相同类型的左分隔符匹配，使得生成的信息块要么不相交，要么其中一个完全嵌套在另一个内部，则该字符串被正确分隔。编写一个程序，使用单个栈来检查包含大括号、圆括号和括号的字符串是否正确分隔。\n\
  \n# 12. 基于栈的二分查找\n\n模仿[第 19.7 节 fileP7001016089000000000000000000F07F.xhtml_P7001016089000000000000000000F07F)\
  \ 中的技术，并使用栈消除二分查找算法中的递归。\n\n# 13. 基于栈的斐波那契函数\n\n使用栈消除[第 14.4 节 fileP700101608900000000000000000B9FE.xhtml_P7001016089000000000000000000B9FE)\
  \ 中讨论的斐波那契函数实现中的递归。\n\n# 14. 基于栈的后缀表达式求\n\n编写一个读取后缀表达式并打印其取值的程序。每个输入表达式应单独占一行输入，当用户输入空行时程序终止。假设只有二元运算符且表达式中不包含变量。你的程序应使用栈。以下是示例输入-输出对：\n\
  \n$$\\begin{matrix} 78 & & & & & & & & & 78 \\\\ 78 & 6 & + & & & & & & & 84 \\\\\
  \ 78 & 6 & + & 9 & 2 & - & / & & & 12 \\end{matrix}$$\n\n# 15. 基于栈的前缀表达式求\n\n编写一个读取前缀表达式并打印其取值的程序。每个输入表达式应单独占一行输入，当用户输入空行时程序终止。假设只有二元运算符且表达式中不包含变量。你的程序应使用栈。以下是示例输入-输出对：\n\
  \n$$\\begin{array}{llllllllll} 78 & & & & & & & & & 78 \\\\ + & 78 & {\\,\\, 6}\
  \ & & & & & & & 84 \\\\ / & + & 78 & 6 & - & 9 & 2 & & & 12 \\end{array}$$\n\n*提示*：从左到右遍历前缀表达式，将运算符和值推入栈中。每当栈上有两个值且其下方紧有一个运算符时，弹出这两个值，弹出该运算符，将运算符应用于这两个值上，并将结果（一个值）推入栈中。难点在于如何在同一个栈上同时存储\
  \ `char` 类型的运算符和 `int` 类型的值。考虑如下所示的类型：\n\n```\nstruct StackElement\n{\n   bool is_value;\n\
  \   int value;\n   char op;\n   StackElement(int number)\n   {\n      is_value =\
  \ true;\n      value = number;\n   }\n   StackElement(char ch)\n   {\n      is_value\
  \ = false;\n      op = ch;\n   }\n};\n```\n\n你可能考虑使用 `vector` 作为栈，以便更容易访问栈顶部的三个元素。\n\
  \n# 第 20 章 二叉树\n\n## 20.1 二叉树的定义与应用\n\n### 概念\n\n二叉树与链表的区别在于，链表中的节点最多可以有一个后继节点，而二叉树中的节点可以多有两个后继节点。\n\
  \n*二叉树*是节点集合，其中每个节点都关联到最多两个后继节点，分别称为*左*孩子和*右*孩子。二叉树中的并非每个节点都有两个孩子：一个或两个节点都可能被省略。二叉树中没有节点的节点被称为*叶子节点*。\n\
  \n二叉树中拥有子节点的节点被称为子节点的*父节点*。对于非空集合，必须有一个没有父节点，这个节点是*根节点*。二叉树与链表之间存在相似之处。二叉树的根对应于链表的头，二叉树的子对应于链表的*前驱*。当然，空链就是二叉树。\n\
  \n## 二叉树的实现\n\n二叉树用于在其节点中存储值。因此，二叉树中的节点将是一个包含值以及指向左右成员的结构体或类：\n\n```\nstruct TreeNode\n\
  {\n   int value;\n   TreeNode *left;\n   TreeNode *right;\n};\n```\n\n二叉树本身由指向根节点的指针表示。未显示值的示例二叉树如[图\
  \ 20-1fileP700101608900000000000000000ECD2.xhtml_P700101608900000000000000]所示。如果该节点没有孩子，其\
  \ `left` 或 `right` 指针将设置为 `nullptr`。\n\n# 图 20-1 二叉树\n\n![插图展示了一个二叉树。](img/FG_20_001.png)\n\
  \n二叉树之所以被称为树，是因为它们看起来像一棵倒过来的树。任何非空树都可以划分为其根节点、*左子树*和*右子树*。直观上，子树是从某个特定节点开始的整个树分支。[图\
  \ 20-2fileP700101608900000000000000000F2BF.xhtml_P700101608900000000000000000F2DE]展示了图\
  \ 20-1 中二叉树的左子树。\n\n# 图 20-2 二叉树的左子树\n\n插图展示了之前的二叉树。树左侧的部分被虚线圈起并标记为“左子树”。(images/FG_20_002.png)\n\
  \n# 二叉树的应用\n\n当线性数据结构（如数组或标准链表）持有大量信息时，对其进行搜索很慢。这是由于线性数据结构的顺序性质决定的。二叉树及其推广是搜索大量信息的极佳数据结构。它们通常用于数据库应用程序以组织数据库记录的键值。当用于方便搜索时，数据结构被称为*二叉搜索树*。二叉搜索树是本章的重点。\n\
  \n信息在二叉搜索树中的存储方式使得在树中搜索变得简单。例如，查看[图 20-3fileP7001016089000000000000000000F2BF.xhtml_P7001016089000000000000000000F2E6]。\n\
  \n# 图 20-3 带有值的二叉树\n\n\n\n\n\n![插图展示了早期的二叉树。](img/FG_20_003.png)图 20-3 完整替代文本\n\n\
  该图描述了一个二叉搜索树，其中每个节点存储一个字母表中的字母。注意，根节点持有字母 `M`。根节点的左孩子持有字母 `F`，右孩子持有字母 `R`。值存储在二叉搜索树中的方式是：节点的左孩子存储的数据值小于节点的数据，而节点的右孩子存储的数据值大于节点的数据。对于树中所有具有子节点的节点，这一结论都是的。\n\
  \n事实上，在二叉搜索树中，节点左侧的**所有**节点的值都小于该节点的值。同样，节点右侧的**所有**节点的值都大于该节点的值。当应用程序搜索二叉搜索树时，它从根节点开始。如果根节点不包含搜索值，应用程序将根据搜索值小于还是大于根节点的值，分支到左子或右子节点。这个过程一直持续，直到找到该值或确定该搜索值不在树中。图\
  \ 20-4 描述了在所示二叉树中查找字母 `P` 的搜索模式。\n\n## 图 20-4 查找值“P”的搜索模式\n\n![插图展示了在非阴影部分带有字母的二叉树。](img/FG_20_004.png)图\
  \ 20-4 完整替代文本\n\n这种搜索二叉树的方法让人联想到用于排序数组的二分查找技术。假设二叉树是平衡的（意味着在每个节点处，左子树和右子树的节点数量大致相同），搜索每一步都会将待搜索树的大小缩小一半。这使得在较少的步数内搜索包含大量信息的树成为可能。\n\
  \n## 检查点\n\n1. 20.1 描述二叉树和链表之间的区别。\n2. 20.2 什么是根节点？\n3. 20.3 什么是子节点？\n4. 20.4 什么是叶子节点？\n\
  5. 20.5 什么是子树？\n6. 20.6 为什么二叉树适用于必须搜索大量信息的算法？\n\n## 20.2 二叉搜索树操作\n\n### 概念\n\n在二叉搜索树上可以执行许多操作，包括创建二叉搜索树、插入、查找和删除节点。\n\
  \n在本节中，你将学习可以在二叉搜索树上执行的一些基本操作。我们将学习一个用于存储整数值的二叉树的简单类。\n\n### 创建二叉搜索树\n\n我们将使用 `IntBinaryTree`\
  \ 类演示基础的二叉树操作。我们二叉树节点的基础是以下 `structure` 声明：\n\n```\nstruct TreeNode\n{     \n  \
  \ int value;\n   TreeNode *left;\n   TreeNode *right;\n   TreeNode(int value1, \n\
  \            TreeNode *left1 = nullptr, \n            TreeNode *right1 = nullptr)\n\
  \   {\n      value = value1;\n      left = left1;\n      right = right1;\n   }\n\
  };\n```\n\n注意，树的每个节点都有一个 `value` 成员，以及两个用于跟踪节点左、右子节点的指针。该类将仅由以下 `IntBinaryTree`\
  \ 类的方法使用。\n\n### `IntBinaryTree.h` 的内容\n\n```\n 1 class IntBinaryTree\n 2 {\n 3\
  \ private:\n 4    // TreeNode 结构体用于构建树。\n 5    struct TreeNode\n 6    {     \n 7\
  \       int value;\n 8       TreeNode *left;\n 9       TreeNode *right;\n10    \
  \   TreeNode(int value1, \n11                TreeNode *left1 = nullptr,\n12    \
  \            TreeNode *right1 = nullptr)\n13       {\n14          value = value1;\n\
  15          left = left1;\n16          right = right1;\n17       }\n18    };\n19\
  \ \n20    TreeNode *root;     // 指向树的根节点的指针\n21 \n22    // 各种辅助成员函数。\n23    void\
  \ insert(TreeNode *&, int);\n24    void destroySubtree(TreeNode *);\n25    void\
  \ remove(TreeNode *&, int);\n26    void makeDeletion(TreeNode *&);\n27    void displayInOrder(TreeNode\
  \ *) const;\n28    void displayPreOrder(TreeNode *) const;\n29    void displayPostOrder(TreeNode\
  \ *) const;\n30 \n31 public:\n32    // 这些成员函数是公共接口。\n33    IntBinaryTree()     \
  \         // 构造函数\n34    {\n35       root = nullptr;\n36    }\n37    ~IntBinaryTree()\
  \             // 析析函数\n38    {\n39       destroySubtree(root);\n40    }\n41    void\
  \ insert(int num)\n42    {\n43       insert(root, num);\n44    }\n45    bool search(int\
  \ num) const;\n46    void remove(int num)\n47    {\n48       remove(root, num);\n\
  49    }\n50    void showInOrder() const;\n51    {\n52       displayInOrder(root);\n\
  53    }\n54    void showPreOrder() const;\n55    {\n56       displayPreOrder(root);\n\
  57    }\n58    void showPostOrder() const;\n59    {\n60       displayPostOrder(root);\n\
  61    }\n62 };\n```\n\n许多二叉树操作都有自然的递归实现。这是因为二叉树是一种递归的数据结构：每个非空二叉树由一个根节点以及左右子树组成，而子树本身也是二叉树。许多二叉树操作可以通过对根节点进行某些处理，然后递归地对左右子树执行该操作来实现。例如，如果根节点由指针表示\n\
  \n```\nTreeNode *tree;\n```\n或者\n\n```\nTreeNode *root;\n```\n并认为它们代表整个树，因为根节点可以访问整个树。为了避免混淆，我们将由\
  \ `IntBinaryTree` 对象表示的二叉树使用首字母大写的标识符，而由指针表示的二叉树使用首字母小写的标识符。\n\n`IntBinaryTree`\
  \ 的公共成员函数包括构造函数、析构函数以及向树中插入新数字、搜索树以确定给定数字是否存在、从树中删除数字以及按不同顺序显示存储的数字。这些函数将在后续章节中讨论。\n\
  \n程序 20-1 演示了 `IntBinaryTree` 对象的创建以及使用公共 `insert` 成员函数构建二叉搜索树。成员函数的实现代码在 `IntBinaryTree.cpp`\
  \ 文件中；该内容的稍后会讨论。执行[程序 20-1]后生成的树如图 20-5 所示。\n\n\n\n\n那么根节点的值将是 `tree−>value`，左、右子树分别由\
  \ `tree−>left` 和 `tree−>right` 提供。递归操作可能会首先处理 `tree−>value`，然后递归对 `tree−>left` 和\
  \ `tree−>right` 进行操作。\n\n# 插入元素\n\n向二叉搜索树中插入数字的工作由私有成员函数完成：\n\n```\ninsert(TreeNode\
  \ *&tree, int num)\n```\n\n该函数接收一个指向二叉搜索树根节点的指针 `tree` 以及一个要插入树的数字 `num`。它使用了递归策略：如果二叉树为空（这是递归的基准情况），它创建一个新的\
  \ `TreeNode` 对象，其 `value` 成员为给定的数字，并将其设置为树的根：\n\n```\nif (!tree)\n{\n   tree = new\
  \ TreeNode(num);\n   return;\n}\n```\n\n然而，如果二叉搜索树不为空，`insert` 函数会将 `num` 与根节点的值\
  \ `tree−>value` 进行比较。根据比较的结果，将新值递归地插入到左子树或右子树中：\n\n```\nif (num < tree−>value)\n\
  \   insert(tree−>left, num);\nelse\n   insert(tree−>right, num);\n```\n\n整个函数代码如下：\n\
  \n```\nvoid IntBinaryTree::insert(TreeNode * &tree, int num)\n{\n   // 如果树为空，创建一个新节点并将其作为\n\
  \   // 树的根\n   if (!tree)\n      {\n        tree = new TreeNode(num);\n        return;\n\
  \      }\n\n   // 如果 num 已经在树中：返回\n   if (tree−>value == num)\n     return;\n\n\
  \   // 树不空：将新节点插入到\n   // 左或右子树中\n   if (num < tree−>value)\n      insert(tree−>left,\
  \ num);\n   else\n      insert(tree−>right, num);\n}\n```\n\n注意，该函数传递的是指针的引用，因为传递的指针可能需要被函数修改。这也是为什么\
  \ `remove` 和 `makeDeletion` 函数通过引用传递参数的原因。\n\n### 注意\n\n图 20-5 所示的树的形状是由值插入的顺序决定的。根节点持有值\
  \ 5，因为它是第一个插入的值。通过逐步执行该函数，你可以看到其他节点是如何出现在它们所示的位置的。\n\n# 遍历二叉树\n\n遍历非空二叉树并处理每个节点值的有三种常用方法：`inorder`（中序）、`preorder`（前序）和\
  \ `postorder`（后序）。这些方法每一种最好都实现为递归函数。算法描述如下。\n\n*   **中序遍历**\n    1.  遍历节点的左子树。\n\
  \    2.  处理节点的数据。\n    3.  遍历节点的右子树。\n\n*   **前序遍历**\n    1.  处理节点的数据。\n    2. \
  \ 遍历节点的左子树。\n    3.  遍历节点的右子树。\n\n*   **后序遍历**\n    1.  遍历节点的左子树。\n    2.  遍历节点的右子树。\n\
  \    3.  处理节点的数据。\n\n`IntBinaryTree` 类可以使用这三种算法中的任意显示树中的所有值。算法通过以下内联公共成员函数启动：\n\n\
  ```\nvoid showInOrder(void)\n   { displayInOrder(root); }\nvoid showPreOrder()\n\
  \   { displayPreOrder(root); }\nvoid showPostOrder()\n   { displayPostOrder(root);\
  \ }\n```\n\n每个公共成员函数都调用一个递归私有成员函数，并将根指针作为参数传递。递归函数非常简单且直观：\n\n```\nvoid IntBinaryTree::displayInOrder(TreeNode\
  \ *tree) const\n{\n   if (tree)\n   {\n      displayInOrder(tree−>left);\n     \
  \ cout << tree−>value << \"  \";\n      displayInOrder(tree−>right);\n   }\n}\n\n\
  void IntBinaryTree::displayPreOrder(TreeNode *tree) const\n{\n   if (tree)\n   {\n\
  \      cout << tree−>value << \"  \";\n      displayPreOrder(tree−>left);    \n\
  \      displayPreOrder(tree−>right);\n   }\n}\n\nvoid IntBinaryTree::displayPostOrder(TreeNode\
  \ *tree) const\n{\n   if (tree)\n   {\n      displayPostOrder(tree−>left);   \n\
  \      displayPostOrder(tree−>right);\n      cout << tree−>value << \"  \";\n  \
  \ }\n}\n```\n\n程序 20-2 是 程序 20-1 的修改版，它演示了这些方法的每一种。\n\n# 搜索二叉树\n\n`IntBinaryTree`\
  \ 类有一个公共成员函数 `search`，如果找到了给定的值返回 `true`，否则返回 `false`。该函数简单地从树开始。函数将搜索值 `num` 与根节点的值进行比较。如果值不匹配，函数在树为空时终止。\n\
  \n```cpp\nbool IntBinaryTree::search(int num) const\n{\n   TreeNode *tree = root;\n\
  \n   while (tree)\n   {\n      if (tree−>value == num)\n         return true;\n\
  \      else if (num < tree−>value)\n         tree = tree−>left;\n      else\n  \
  \       tree = tree−>right;\n   }\n   return false;\n}\n```\n\n# 移除元素\n\n要移除元素，我们首先找到包含元素的节点，然后删除该节点。删除节点的程序取决于其孩子的数量。如果\
  \ X 没有孩子，我们首先找到父节点，将父节点的节点设置为 `nullptr`，然后释放给 X 的内存。如果 X 是树的根，我们描述的程序将不起作用。在这种情况下，我们只需删除\
  \ X 并将树的根设置为 `nullptr`。\n\n删除非叶节点的程序必须确保该节点连接的子树仍然是树的一部分。程序根据被删除的节点有一个孩子还是两个孩子而异。图\
  \ 20-6 展示了一棵我们正准备删除只有一个子树的节点的树。\n\n\n\n\n显然，我们无法将节点的两个子树都连接到它的父节点，因此必须有替代方案。解决此问题的一种方法是将节点的右子树连接到父节点，然后在右子树中找到一个位置来连接左子树。结果如图图\
  \ 20-9 所示。注意，在将左子树连接到右子树时，我们必须注意保持二叉树的搜索属性。\n\n## 图 20-9 删除具有两个节点的简单策略\n\n![一张插图显示了一个二叉树。](img/FG_20_009.png)图\
  \ 20-9 完整替代文本\n\n从 `IntBinaryTree` 对象中删除值是通过调用公共成员函数 `remove` 来完成的，该函数反过来调用同名的私有成员函数。后者函数接收一个二叉搜索树\
  \ `tree` 的根节点）和一个要从树中删除的值 `num`：\n\n```\nremove(TreeNode *&tree, int num)\n```\n\
  \n该函数使用递归策略。如果树为空，则立即返回。否则，如果 `num` 小于根节点中存储的值，函数递归地从左子树中删除 `num`；但如果 `num` 较大，函数则递归地从右子树中删除\
  \ `num`。当 `num` 在根节点中找到时，将交给函数\n\n```\nmakeDeletion(TreeNode *&tree)\n```\n\n以下是\
  \ `remove:` 的代码：\n\n```cpp\nvoid IntBinaryTree::remove(TreeNode *&tree, int num)\n\
  {\n   if (tree == nullptr) return;\n   if (num < tree−>value)\n      remove(tree−>left,\
  \ num);\n   else if (num > tree−>value)\n      remove(tree−>right,num);\n   else\n\
  \      // 我们找到了要删除的节点。\n      makeDeletion(tree);\n}\n```\n\n`makeDeletion` 函数的设计是删除作为参数传递的二叉搜索树的根节点，留下一个由剩余节点组成的二叉搜索树。让我们来看\
  \ `makeDeletion` 背后的逻辑。有几种情况需要考虑：\n\n1. 传递给 `makeDeletion` 的树根没有孩子。在这种情况下，我们删除根节点并将树替换为\
  \ `nullptr`。\n\n2. 树的根只有一个孩子。在这种情况下，我们删除根节点并将树替换为被删除根节点：\n\n```cpp\nTreeNode *nodeToDelete\
  \ = tree;\nif (tree−>right == nullptr)\n   tree = tree−>left;\nelse if (tree−>left\
  \ == nullptr)\n   tree = tree−>right;\n```\n\n注意，这段代码同样适用于第一种情况。\n\n3. 传递给 `makeDelete`\
  \ 的树有两个孩子。删除根节点会导致两个子树，我们需要对这两个子树都进行处理。我们采用的策略是将两个子树合并为一个二叉搜索树，然后用从合并后的子树构建的树替换原始树。如图图\
  \ 20-9 所示，我们可以通过将原始树的左子树连接到原始树右子树中最小节点的左子树来实现这一点。以下是整个函数的代码。\n\n```cpp\nvoid IntBinaryTree::makeDeletion(TreeNode\
  \ *&tree)\n{\n   // 用于保存将要删除的节点\n   TreeNode *nodeToDelete = tree;\n\n   // 用于定位\n\
  \   // 左子树连接的位置\n   TreeNode *attachPoint;\n\n   if (tree−>right == nullptr)\n \
  \  {\n      // 将树替换为其左子树\n      tree = tree−>left;\n   }\n   else if (tree−>left\
  \ == nullptr)\n   {\n      // 将树替换为其右子树\n      tree = tree−>right;\n   }\n   else\n\
  \      // 节点有两个孩子\n      {\n         // 移动到右子树\n         attachPoint = tree−>right;\n\
  \n         // 通过尽可能向左移动，\n         // 定位右子树中的最小节点\n         while (attachPoint−>left\
  \ != nullptr)\n         attachPoint = attachPoint−>left;\n\n         // 将原始树的左子树\n\
  \         // 作为右子树中最小节点的左子树\n         attachPoint−>left = tree−>left;\n\n      \
  \   // 将原始树替换为其右子树\n         tree = tree−>right;\n      }\n   // 删除原始树的根节点\n   delete\
  \ nodeToDelete;\n}\n```\n\n程序 20-4 演示了这些函数。\n\n供参考，`IntBinaryTree` 文件的完整内容所示：\n\n\
  # Contents of `IntBinaryTree.cpp`\n\n\n\n\n\n```cpp\n#include <iostream>\n#include\
  \ \"IntBinaryTree.h\"\nusing namespace std;\n\n//**************************************************\n\
  // 此版本的 insert 将一个数字插入到主二叉搜索树的*\n// 给定的子树中。*\n//**************************************************\n\
  void IntBinaryTree::insert(TreeNode * &tree, int num)\n{\n   // 如果树为空，创建一个新节点并使其成为\n\
  \   // 树的根\n   if (!tree)\n      {\n         tree = new TreeNode(num);\n       \
  \  return;\n      }\n\n   // 如果 num 已经在树中：返回\n   if (tree->value == num)\n     \
  \ return;\n\n   // 树不空：将新节点插入到\n   // 左或右子树中\n   if (num < tree->value)\n      insert(tree->left,\
  \ num);\n   else\n      insert(tree->right, num);\n}\n\n//***************************************************\n\
  // destroySubTree 由析构函数调用。它会*\n// 删除树中的所有节点。                   *\n//***************************************************\n\
  void IntBinaryTree::destroySubtree(TreeNode *tree)\n{\n      if (!tree) return;\n\
  \      destroySubtree(tree->left);\n      destroySubtree(tree->right);\n      //\
  \ 删除根节点\n      delete tree;\n}\n\n//***************************************************\n\
  // searchNode 确定一个值值是否存在于*\n// 树中。如果是，函数返回 true。      *\n// 否则，它返回 false。      \
  \               *\n//***************************************************\nbool IntBinaryTree::search(int\
  \ num) const\n{\n   TreeNode *tree = root;\n\n   while (tree)\n   {\n      if (tree->value\
  \ == num)\n          return true;\n      else if (num < tree->value)\n         \
  \ tree = tree->left;\n      else\n          tree = tree->right;\n   }\n   return\
  \ false;\n}\n\n//********************************************\n// remove 删除给定树中成员变量与\
  \ num*\n// 相同的节点。  *\n//********************************************\nvoid IntBinaryTree::remove(TreeNode\
  \ *&tree, int num)\n{\n   if (tree == nullptr) return;\n   if (num < tree->value)\n\
  \      remove(tree->left, num);\n   else if (num > tree->value)\n      remove(tree->right,num);\n\
  \   else\n      // 我们找到了要删除的节点\n      makeDeletion(tree);\n}\n\n//***********************************************************\n\
  // makeDeletion 接收一个要删除根节点的*\n// 树的引用。如果树只有一个孩子，        *\n// 在删除根节点后，该树将被该唯一孩子*\n\
  // 替换。如果树有两个孩子，   *\n// 被删除节点的左子树将挂载在*\n// 右子树的适当位置，然后*\n// 右子树替换原始树。          \
  \  *\n//***********************************************************\nvoid IntBinaryTree::makeDeletion(TreeNode\
  \ *&tree)\n{\n   // 用于持有将被删除的节点\n   TreeNode *nodeToDelete = tree;\n\n   // 用于定位左子树\n\
  \   //挂载的位置\n   TreeNode *attachPoint;\n\n   if (tree->right == nullptr)\n     \
  \ {\n         // 用其左子树替换树\n         tree = tree->left;\n      }           \n   else\
  \ if (tree->left == nullptr)    \n   {\n         // 用其右子树替换树\n         tree = tree->right;\n\
  \      }    \n   else\n      //该节点有两个孩子\n      {\n         // 移动到右子树\n         attachPoint\
  \ = tree->right;\n\n         // 通过尽可能向左移动\n         // 在右子树中找到最小节点\n         while\
  \ (attachPoint->left != nullptr)\n            attachPoint = attachPoint->left;\n\
  \n         // 将原始树的左子树作为\n         // 右子树中最小节点的左子树\n         attachPoint->left =\
  \ tree->left;\n\n         // 用其右子树替换原始树\n         tree = tree->right;\n      }\n\
  \   // 删除原始树的根\n   delete nodeToDelete;\n}\n\n//*****************************************\n\
  // 此函数以中序遍历显示树中*\n// 存储的值。                                            \n//*********************************************************\n\
  void IntBinaryTree::displayInOrder(TreeNode *tree) const\n{\n   if (tree)\n    \
  \  {\n         displayInOrder(tree->left);\n         cout << tree->value;\n    \
  \     displayInOrder(tree->right);\n      }\n}\n\n//*****************************************\n\
  // 此函数以中序遍历显示树中\n// 存储的值。                                            \n//*********************************************************\n\
  void IntBinaryTree::displayPreOrder(TreeNode *tree) const\n{\n   if (tree)\n   \
  \   {\n         cout << tree->value;\n         displayPreOrder(tree->left);\n  \
  \       displayPreOrder(tree->right);\n      }\n}\n\n//*****************************************\n\
  // 此函数以后序遍历显示树中*\n// 存储的值。                                          \n//*********************************************************\n\
  void IntBinaryTree::displayPostOrder(TreeNode *tree) const\n{\n   if (tree)\n  \
  \    {\n         displayPostOrder(tree->left);\n         displayPostOrder(tree->right);\n\
  \         cout << tree->value;\n      }\n}\n```\n\n## 检查\n\n1. 20.7 描述中序遍历的事件序列。\n\
