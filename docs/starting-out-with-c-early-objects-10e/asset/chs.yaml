  \        int max;\n        max = 10;\n        ```\n   3. `int max(10);`\n   4. `int\
  \ max{10};`\n\n7. 8.14 以下代码的输出是什么？\n   ```cpp\n    const int SIZE 5;\n    int count;\n\
  \    int time[SIZE] = {1, 2, 3, 4, 5},\n        speed[SIZE] = {18, 4, 27, 52, 100},\n\
  \        dist[SIZE];\n    for (count = 0; count < SIZE; count++)\n       dist[count]\
  \ = time[count] * speed[count];\n    for (count = 0; count < SIZE; count++)\n  \
  \  {\n      cout << setw(3) << time[count] << setw(5) << speed[count]\n        \
  \    << setw(5) << dist[count] << endl;\n    }\n   ```\n\n# 8.8 `typedef` 语句\n\n\
  ### 概念\n`typedef` 语句允许为简单或结构化数据类型关联别名。`typedef` 语句允许程序员为现有数据类型创建别名（或同义词）。这可以是简单数据类型，如\
  \ `int`，也可以是复杂的数据类型，如数组。该语句最简单的形式是：\n```cpp\ntypedef <existing data type> <alias>;\n\
  ```\n例如，以下语句将 `examScore` 定义为 `int` 的另一个名称，然后定义了两个 `examScore` 变量：\n```cpp\ntypedef\
  \ int examScore;\nexamScore score1, score2;\n```\n这使得 `score1` 和 `score2` 整数变量，并明确了它们将用于存储分数。\n\
  \n`typedef` 语句最常用的用途之一是为特定用途的数组提供描述性的别名。当与数组一起使用时，持有数组大小的 `[]` 写在别名名称旁边，而不是数据类型旁边。以下语句为大小为\
  \ 100 的 `double` 数组创建了别名 `score`：\n```cpp\ntypedef double score[100];\n```\n这意味着任何定义为\
  \ `score` 的内容都是一个包含 100 个 `double` 元素的数组，用于存储分数。以下两个语句具有相同的功能：\n```cpp\ndouble finalExam[100];\n\
  score finalExam;\n```\n有时，我们希望为特定数据类型的数组创建别名而不指定其大小。以下语句为未指定大小的 `int` 数组创建名为 `arrayType`\
  \ 的别名：\n```cpp\ntypedef int arrayType[];\n```\n在下一节中，当你学习如何将数组作为参数时，就会明白为什么这样做很方便。\n\
  \n# 8.9 作为函数参数的数组\n\n### 概念\n数组的元素和整个数组都可以作为参数传递给函数。通常你可能希望编写处理数组的函数，例如，将数组输入、显示数组内容或计算它们的平均值。当将单个元素传递给函数时，它像处理其他变量一样处理。例如，[程序\
  \ 8-16](https://wiki.example.org/la_fg_08_012.xhtml_la_fg_08_012) 显示了循环每次将数组的一个元素传递给\
  \ `showValue`。由于数组元素是 `int`，每次调用 `showValue` 都会传递一个 `int` 值。在 `showValue` 的原型和函数头中可以看到这种指定方式。`showValue`\
  \ 知道它接收的是数组，无论它恰好是数组。\n\n由于 `showValue` 函数只需显示数组的内容，它不需要直接与数组工作。如果函数需要访问原始数组，它们将通过引用传递。\n\
  \n因为[程序 8-16](https://wiki.example.org/la_fg_08_012.xhtml_la_fg_08_012) 显示了每次将数组的一个元素传递给\
  \ `showValue` 函数，为了显示所有元素，它必须调用八次。通常将整个数组传递给函数更简单，因为函数只需要一次调用即可访问元素。\n\n在 C++ 中，数组名后跟下标引用数组的单个元素。这就是为什么我们可以编写这样的语句：\n\
  ```cpp\ncout << collection[0];\n```\n然而，没有一个变量可以持有整个数组。因此，没有下标的数组名并不持有任何数据。相反，它持有数组在内存中的起始地址。通过使用该地址和下标，可以定位单个元素。当我们传递数组时，我们传递的是数组名称。这意味着我们实际上是在向它发送数组的地址，以便*它*访问元素。\n\
  \n如果编写 `showValues` 函数接受整个数组，参数设置将不同。在下面的函数定义中，参数 `nums` 后面跟着空括号。这表示参数将是整个数组的地址，而不是单个值。\n\
  ```cpp\nvoid showValues (int nums[], int size)\n{\n   for (int index = 0; index\
  \ < size; index++)\n      cout << nums[index] << \" \";\n   cout << endl;\n}\n```\n\
  注意，在传递数值数组的同时，数组的大小也传递给了 `showValues`。这是为了让它知道有多少值需要处理。\n\n当将整个数组传递给函数时，它永远不会按值传递。想象一下，如果每次传递给函数都要创建一个\
  \ 10,000 个元素的数组，需要多少 CPU 时间和内存！仅传递数组的起始内存地址与通过引用传递变量相似，只是在这种情况下没有使用 `&`。[程序 8-17](https://wiki.example.org/la_fg_08_012.xhtml_la_fg_08_012)\
  \ 说明了函数 `showValues` 如何接收整个数组的地址，以便它可以访问并显示所有元素的内容。\n\n\n\n\n仔细观察第 5 行的 `showValues`\
  \ 原型和第 22 行的函数头。在两种情况下，第一个参数名后面都紧跟一对括号。这让程序知道该参数接受数组的地址。如果函数原型没有使用参数名，它看起来会像这样：\n\
  \n```\n void showValues(int [], int);\n```\n\n这仍然表明第一个 `showValues` 参数接收一个整数数组的地址，而第二个参数接收一个单一整数值。\n\
  \n再看程序第 13 行是如何通过以下语句调用 `showValues` 函数的：\n\n```\n showValues(collection, ARRAY_SIZE);\n\
  ```\n\n第一个参数是传递给函数的数组名称。在此函数调用中，传递的是 `collection` 数组的地址。第二个参数是数组的大小。\n\n在 `showValues`\
  \ 函数中，`collection` 数组的起始地址被复制到 `nums` 参数变量中。图 8-13 展示了 `collection` 数组与 `nums` 参数变量之间的关系。当显示\
  \ `nums[0]` 时，屏幕上显示的实际上是 `collection[0]` 的内容。\n\n# 图 8-13 collection 数组与 nums 参数之间的关系\n\
  \n![数组显示了 8 个矩形，每个矩形显示一个整数。](img/FG_08_013.png)图 8-13 完整替代文本\n\n### 注意\n\n尽管 `nums`\
  \ 不是引用变量，但它的工作方式类似于引用。\n\n`showValues` 函数中的 `nums` 参数变量可以接受任何整数数组的地址，并可以使用它来引用该数组。因此，我们可以通过传递数组名称及其大小作为参数，使用\
  \ `showValues` 函数来显示任何整数数组的内容。程序 8-18 使用此函数来显示两个不同数组的内容。注意，它们的大小不必相同。还要注意此程序中使用了\
  \ `typedef` 语句。它使 `arrayType` 名称成为整数数组的别名。该名称随后被用于 `showValues` 原型和函数头中，而不是使用 `int[]`，以指示第一个参数接收\
  \ `int` 数组的起始地址。\n\n注意，在第 14 行和第 15 行声明 `set1` 和 `set2` 时，没有使用大小声明符。我们可以使用声明符，但请记住，当使用初始化列表时是不需要大小声明符的。\n\
  \n回想第 6 章，当引用变量作为参数使用时，它允许函数访问原始参数。对引用变量所做的任何更改实际上都是在该变量所引用的参数上执行的。数组参数的工作非常类似于引用变量。它们允许函数直接访问原始数组。对数组参数所做的任何更改实际上都是在作为参数的原始数组上进行的。程序\
  \ 8-19 中的 `doubleArray` 函数利用这种能力将数组每个元素的内容翻倍。\n\n注意，在程序 8-19 的第 16 行中，`set` 数组被定义为类型\
  \ `arrayType` 而不是 `int` `set[]` 或 `int` `set[ARRAY_SIZE]`，尽管它也可以用这两种方式之一定义。与程序 8-18\
  \ 一样，没有必要指示数组的大小，因为它在创建时使用初始化列表进行了初始化。\n\n还要注意，在第 7 行的 `typedef` 语句中、第 11 行的 `showValues`\
  \ 原型以及第 48 行的 `showValues` 函数中，没有 `&`。记住，当你向函数传递数组时不需要使用 `&`。\n\n### 注意\n\n尽管 `nums`\
  \ 不是引用变量，但它的工作方式类似于引用。`showValues` 函数中的 `nums` 参数变量可以接受任何整数数组的地址并可以使用它来引用该数组。因此，我们可以通过传递数组名称及其大小作为参数，使用\
  \ `showValues` 函数来显示任何整数数组的内容。程序 8-18 使用此函数显示两个不同数组的内容。注意它们的大小不必相同。还要注意此程序中使用 `typedef`\
  \ 语句。它使 `arrayType` 名称成为整数数组的别名。该名称随后被用于 `showValues` 原型和函数头，而不是使用 `int[]`，以指示第一个参数接收\
  \ `int` 数组的起始地址。\n\n注意在第 14 行和第 15 行声明 `set1` 和 `set2` 时，没有使用大小声明符。我们可以使用一个，但请记住，当使用初始化列表时是不需要大小声明符的。\n\
  \n同样回想第 6 章，当引用变量作为参数使用时，它允许函数访问原始参数。对引用变量所做的任何更改实际上都是在该变量所引用的参数上执行的。数组参数的工作非常类似于引用变量。它们允许函数直接访问原始数组。对数组参数所做的任何更改实际上都是在作为参数的原始数组上进行的。程序\
  \ 8-19 中的 `doubleArray` 函数利用这种能力将数组每个元素的内容翻倍。\n\n注意在程序 8-19 的第 16 行中，`set` 数组被定义为类型\
  \ `arrayType` 而不是 `int` `set[]` 或 `int` `set[ARRAY_SIZE]`，尽管它也可以用这两种方式之一定义。与程序 8-18\
  \ 一样，没有必要指示数组的大小，因为它在创建时使用初始化列表进行了初始化。\n\n# 使用 `const` 数组参数\n\n有时你希望函数能够修改数组，但有时又不想。例如，在程序\
  \ 8-19 中，我们需要 `doubleArray` 函数能够将数组每个元素的内容翻倍，但我们不想让 `showValues` 函数改变它们。你可以通过 `const`\
  \ 关键字防止函数意外更改数组。以下是带有 `const` 的 `showValues` 原型和函数头：\n\n```\n void showValues(const\
  \ arrayType, int);\n void showValues(const arrayType, int)\n```\n\n如果函数尝试修改数组，将在编译时发生错误。\n\
  \n# 有用的数组函数\n\n第 8.6 节 向你介绍了诸如求数组之和、寻找最大值和最小值等算法。现在，我们可以编写执行这些操作的通用函数。程序 8-20 使用\
  \ `sumArray`、`getHighest` 和 `getLowest` 函数。因为这些函数都不应该改变数组，所以它们都具有 `const` 数组参数。\n\
  \n## 检查点\n\n1.  8.15 编写一个 `typedef` 语句，使 `TenInts` 名称成为存储 10 个整数的数组的别名。\n\n2.  8.16\
  \ 当数组名传递给函数时，实际传递的是什么？\n\n3.  8.17 下面程序段的输出是什么？（你可能需要查阅附录 A) 中的 ASCII 表。）\n\n  \
  \  ```\n     // 函数原型\n    void fillArray(char [], int)\n    void showArray(const\
  \ char [], int)\n\n    int main ()\n    {  char prodCode[8] = {'0', '0', '0', '0',\
  \ '0', '0', '0', '0'};\n       fillArray(prodCode,8);\n       showArray(prodCode,8);\n\
  \      return 0;\n    }\n    // fillArray 函数定义\n    void fillArray(char arr[], int\
  \ size)\n    {  char code = 65;               // 65 是 'A' 的 ASCII 码\n       for\
  \ (int pos = 0; pos < size; code++, pos++)\n          arr[pos] = code;\n    }\n\
  \    // showArray 函数定义\n    void showArray(const char codes[], int size)\n    {\
  \  for (int pos = 0; pos < size; pos++)\n          cout << codes[pos];\n    }\n\
  \    ```\n\n4.  8.18 下面的程序段完成后将要求用户输入 10 个整数，并将它们存储在数组中。你编写的 `avgArray` 函数应该计算并返回输入数字的平均值。\n\
  \n\n\n\n\n```cpp\n // 在此处编写 avgArray 函数原型。 \n // 它应该有一个 const 数组参数。\nint main()\n\
  {\n   const int SIZE = 10;\n   int userNums[SIZE];\n   cout << \"Enter 10 integers:\
  \ \";\n   for (int count = 0; count < SIZE; count++)\n   {\n      cout << \"#\"\
  \ << (count + 1) << \" \";\n      cin  >> userNums[count];\n   }\n   cout << \"\
  The average of those numbers is \";\n   cout << avgArray(userNums, SIZE) << endl;\n\
  \   return 0;\n}\n// 在此处编写 avgArray 函数。\n```\n\n# 8.10 二维数组\n\n### 概念\n\n二维数组就像是几个相同的数组组合在一起。它非常用于存储多组数据。\n\
  \n数组常用于存储和处理一组数据。然而，有时需要处理多组数据。例如，在一个计算成绩平均分的程序中，老师可能会用一个 `doubles` 数组来记录一个学生的所有考试成绩。如果老师有\
  \ 30 名学生，这意味着需要 30 个 `doubles` 数组来记录全班的成绩。但是，与其定义 30 个独立的数组，不如定义一个二维数组。\n\n你到为止所学习的数组被称为`一维数组`，因为它们只能包含一组数据。`二维数组`（也称为\
  \ `2D arrays`）可以包含多组数据。最好将二维数组想象成一个具有行和列元素的表格，如图 8-14 所示。该图显示了一个三行四列的测试成绩数组。注意，这三行的编号为\
  \ 0 到 2，四列的编号为 0 到 3。数组中总共有 12 个元素。\n\n## 图 8-14 二维数组\n\n![一个表格显示了一个二维数组。](img/FG_08_014.png)图\
  \ 8-14 完整替代文本\n\n要定义二维数组，需要两个大小声明符。第一个用于行数，第二个用于列数。这里是一个三行四列的二维数组的定义示例：\n\n![数组定义显示为“double\
  \ score [3][4]。”“3”旁边的注释为“行 (Rows)”，“4”旁边的注释为“列 (Columns)”。](images/UNFG_08_001.png)\n\
  \n注意每个数字都包含在自己的括号对中。\n\n为了处理二维数组中的信息，每个元素有两个下标，一个表示行，另一个表示列。在 `score` 数组中，第 0 行的元素被引用为\n\
  \n```\nscore[0][0]\nscore[0][1]\nscore[0][2]\nscore[0][3]\n```\n\n第 1 行的元素是：\n\n\
  ```\nscore[1][0]\nscore[1][1]\nscore[1][2]\nscore[1][3]\n```\n\n第 2 行的元素是：\n\n```\n\
  score[2][0]\nscore[2][1]\nscore[2][2]\nscore[2][3]\n```\n\n下标引用在程序中的用法与引用一维数组中的元素相同。例如，以下语句将值\
  \ 92.25 赋值给 `score` 数组中第 2 行第 1 列的元素：\n\n```\nscore[2][1] = 92.25;\n```\n\n接下来的语句显示第\
  \ 0 行第 2 列的元素：\n\n```\ncout << score[0][2];\n```\n\n遍历二维数组每个元素的程序通常使用嵌套循环来实现。程序\
  \ 8-21 了一个了一个示例。\n\n和一维数组一样，二维数组可以在创建时进行初始化。在初始化二维数组时，将每行的初始化列表列表括在大括号中会有所帮助。这里有一个示例：\n\
  \n```cpp\nint hours[3][2] = {{8, 5}, {7, 9}, {6, 3}};\n```\n\n相同的语句也可以写成：\n\n```cpp\n\
  int hours[3][2] = {{8, 5},\n                   {7, 9},\n                   {6, 3}};\n\
  ```\n\n在任何情况下，值按以下方式分配给 `hours`：\n\n```\nhours[0][0] 被设置为 8\nhours[0][1] 被设置为 5\n\
  hours[1][0] 被设置为 7\nhours[1][1] 被设置为 9\nhours[2][0] 被设置为 6\nhours[2][1] 被设置为 3\n\
  ```\n\n图 8-15 展示了初始化。\n\n## 图 8-15 二维数组初始化\n\n![一个表格显示了二维数组的初始化。](img/FG_08_014.png)图\
  \ 8-15 完整替代文本\n\n每行初始化的大括号是可选的。以下两个语句具有相同的效果：\n\n```cpp\nint hours[3][2] = {{8,\
  \ 5}, {7, 9}, {6, 3}};\nint hours[3][2] = {{8, 5}, {7, 9}, {6, 3}};\n```\n\n由于额外的括号将每行分开，因此使用它们是一个好主意。此外，大括号允许你在不省略行的情况下初始化。例如，看以下定义：\n\
  \n```cpp\nint table[3][2] = {{1}, {3}, {5}};\n```\n\n`table[0][0]` 被设置为 1，`table[1][0]`\
  \ 被设置为 3，`table[2][0]` 被设置为 5。\n\n## 将二维数组传递给函数\n\n程序 8-22 展示了如何将二维数组传递给函数。当二维数组传递给函数时，参数必须包含列数的声明符。C++\
  \ 需要此信息来正确翻译下标数组，例如 `table[2]`。这里是 `showArray` 的原型，来自程序 8-22：\n\n```cpp\nvoid showArray(const\
  \ int array[][4], int numRows)\n```\n\n`showArray` 函数可以接受任何二维数组，只要它有四列。在程序 8-22\
  \ 中，该函数显示两个独立数组的内容。\n\n由于二维数组在内存中的存储方式，C++ 要求在函数原型和头部中指定列数。一个行实际上跟随另一个行，如图 8-16\
  \ 所示。\n\n## 图 8-16 二维数组的内存组织\n\n![内存存储显示了内存组织。存储显示了 12 个矩形。每组 4 个矩形被组合在一起。第一组 4\
  \ 个矩形标记为“row 1”，第二组标记为“row 2”，第三组标记为“row 3。”](img/FG_08_016.png)\n\n这种列信息也可以通过 `typedef`\
  \ 语句提供。这里是二维数组的 `typedef` 声明示例：\n\n```cpp\ntypedef int intTable[][4];\n```\n\n该语句使\
  \ `intTable` 成为任意行数和四列二维数组的别名。如果此 `typedef` 语句包含在程序 8-22 中，那么 `showArray` 函数的原型就可以写成：\n\
  \n```cpp\nvoid showArray(intTable, int);\n```\n\n而其函数头部也可以写成：\n\n```cpp\nvoid showArray(intTable\
  \ array, int numRows)\n```\n\n\n\n\n\n在程序 8-21 中，我们使用嵌套循环并将每个数组元素的内容加到累加器中，从而对二维数组中的所有数据求和。你可能记得数组元素元素的代码看起来如下：\n\
  \n```\n for (div = 0; div < NUM_DIVS; div++)\n{  for (qtr = 0; qtr < NUM_QTRS; qtr++)\n\
  \      totalSales += sales[div][qtr];\n}\n```\n\n`NUM_DIVS` 是数组的行数。`NUM_QTRS` 是列数。外层循环为数组中的每一行迭代一次，内层循环为行中的每一列迭代一次。\n\
  \n# 二维数组行的求和\n\n但是，有时你可能需要分别计算二维数组中每一行的和。例如，假设有一个二维数组用于存储一组学生的测试分数。数组中的每一行都是一个学生的一组分数。为了计算每个学生的得分总和，你再次使用一对嵌套循环。内层循环用于加上某行的所有分数，即一个学生的所有分数。外层循环为每个学生执行一次。但现在在开始累加它的值之前，必须为*每一*行将累加器重置为\
  \ 0。此外，在开始新行之前，需要将行的和存储在某处或显示。这里有一个示例。\n\n```\n const int NUM_STUDENTS = 3;    \
  \   // 学生人数\nconst int NUM_SCORES = 5;         // 测试分数数量\ndouble total;        \
  \             // 累加器\ndouble average;                   // 存储给定学生的平均分\ndouble scores[NUM_STUDENTS][NUM_SCORES]\
  \ = {{88, 97, 79, 86, 94},\n                                           {86, 91,\
  \ 78, 79, 84},\n                                           {82, 73, 77, 82, 89}};\n\
  // 计算每个学生的测试分数总和，以便\n// 计算并显示其平均分 \nfor (int row = 0; row < NUM_STUDENTS; row ++)\n\
  {\n   // 为该学生将累加器重置为 0\n   total = 0;\n   // 求行和\n   for (int col = 0; col < NUM_SCORES;\
  \ col++) \n      total += scores[row][col];\n   // 计算并显示该学生的平均分\n   average = total\
  \ / NUM_SCORES; \n   cout << \"Score average for student \"\n        << (row + 1)\
  \ << \" is \" << average << endl;\n}\n```\n\n# 二维数组列的求和\n\n有时你可能需要计算二维数组中每一列的和。使用上一个示例中的测试分数数组，假设你想计算每次测试的班平均分，而不是每个学生的平均分。为了做到，你必须计算数组中每一列的平均值。与上一个示例一样，这是通过一组嵌套循环实现的。然而，现在两个循环的顺序反过来了。内层循环用于加上列中的所有分数，即某次测试的所有分数。外层循环为每次测试执行一次。下面的代码说明了这一点。\n\
  \n```\n const int NUM_STUDENTS = 3;     // 学生人数\nconst int NUM_SCORES = 5;     \
  \  // 测试分数数量\ndouble total;                   // 累加器\ndouble average;          \
  \       // 存储给定测试的平均分\ndouble scores[NUM_STUDENTS][NUM_SCORES] = {{88, 97, 79, 86,\
  \ 94},\n                                           {86, 91, 78, 79, 84},\n     \
  \                                      {82, 73, 77, 82, 89}};\n// 计算并显示每次测试\n//\
  \ 班级平均分\nfor (int col = 0; col < NUM_SCORES; col++)\n{\n   // 为本次测试将累加器重置为 0\n \
  \  total = 0;\n   // 求列和\n   for (int row = 0; row < NUM_STUDENTS; row++)\n    \
  \   total += scores[row][col];\n   // 计算并显示本次测试的班级平均分\n   average = total / NUM_STUDENTS;\n\
  \   cout << \"Class average for test \" << (col + 1) \n        << \" is \" << average\
  \ << endl;\n}\n```\n\n# 8.11 三维或更多维数组\n\n### 概念\n\nC++ 允许数组具有多个维度。\n\nC++ 允许你创建实际上任意维数的数组。这是一个三维（3D）数组定义的示例：\n\
  \n```\n double seat[3][5][8];\n```\n\n这个数组可以被认为三组五行，每行有八个元素。该数组可能被用于存储剧院的座位价格，该剧院有三个区域，每个区域有五行，每行八个座位。\n\
  \n图 8-17 展示了三维数组作为二维数组的“页”的概念。\n\n## 三维数组\n\n![图 8-17 展示了三个矩形，它们堆叠在一起。每个矩形被分为五行八列。它们分别被标记为\
