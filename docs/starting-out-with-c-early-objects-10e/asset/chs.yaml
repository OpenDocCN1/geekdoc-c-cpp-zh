  \ int b, int c)\n{    a = b − c;\n}\n```\n\n\n\n\n有时，你会创建两个或多个执行相同操作但使用不同参数集或不同数据类型参数的函数。例如，在程序\
  \ 6-12 中，有一个使用 `double` ` 参数的 `square` 函数。但假设你还想要一个专门用于整数并接受 `int` 作为参数的 `square`\
  \ 函数。这两个函数的作用是相同的：返回其参数的平方。它们之间唯一的区别是操作中涉及的数据类型。如果你在同一个程序中使用这两个函数，你可能为每个函数分配一个唯一的名称。例如，其中一个可以被命名为\
  \ `squareInt`，另一个命名为 `squareDouble`。然而，C++ 允许你重载函数。这意味着只要它们的参数列表不同，你就可以为多个函数分配相同的名称。程序\
  \ 6-28 说明了这一点。\n\n以下是程序 6-28 中使用的 `square` 函数的头文件：\n\n```\n int square(int number)\n\
  double square(double number)\n```\n\n在 C++ 中，每个函数都有一个签名（signature）。函数签名是函数的名称以及按照正确顺序排列的函数参数的数据类型。程序\
  \ 6-28 中的 `square` 函数将具有以下签名：\n\n```\n square(int)\nsquare(double)\n```\n\n当调用重载函数时，C++\
  \ 使用函数签名将其与其他具有相同名称的区分开来。在程序 6-28 中，当将一个 `int` 参数传递给 `square` 时，会调用具有 `int` 参数的函数版本。同样，当将一个\
  \ `double` 参数传递给 `square` 时，会调用具有 `double` 参数的版本。\n\n请注意，函数的返回值不是签名的一部分。以下函数不能在同一个程序中使用，因为它们的参数列表相同：\n\
  \n```\n int square(int number)\n{\n    return number * number\n}\ndouble square(int\
  \ number) // 错误！参数列表必须不同\n{\n    return number * number\n}\n```\n\n当存在使用不同数量参数的相似函数时，重载也非常方便。例如，考虑一个带有返回整数之和函数的程序。其中一个返回两个整数之和，另一个返回三个整数之和，还有一个返回四个整数之和。以下是它们的头文件：\n\
  \n```\n int sum(int num1, int num2)\nint sum(int num1, int num2, int num3)\nint\
  \ sum(int num1, int num2, int num3, int num4)\n```\n\n因为每个函数的参数数量不同，所以它们都可以在同一个程序中使用。程序\
  \ 6-29 使用了两个命名为 `calcWeeklyPay` 的函数，来确定员工的毛工资。该函数的一个版本使用一个 `int` 和一个 `double` 参数，而另一个版本只使用一个\
  \ `double` 参数。\n\n# 6.15 exit() 函数\n\n### 概念\n\n`exit()` 函数会导致程序终止，无论正在执行哪个函数或控制机制。当\
  \ C++ 程序遇到 `main` 函数中的 `return` 语句时，程序停止。然而，当其他函数结束时，程序不会停止。程序的控制权返回到函数调用后的后续位置。然而，有时在罕见情况下，有必要在\
  \ `main` 以外的函数终止程序。为了实现这一点，使用了 `exit` 函数。\n\n当调用 `exit` 函数时，它会导致程序停止，无论调用位于哪个函数中。程序\
  \ 6-30 展示了这一点。\n\n`exit` 函数被调用时，它会导致程序停止，无论调用位于哪个函数中。注意函数的返回值不是签名的一部分。以下函数不能在同一个程序中使用，因为它们的参数列表相同：\n\
  \n```\n int square(int number)\n{\n    return number * number\n}\ndouble square(int\
  \ number) // 错误！参数列表必须不同\n{\n    return number * number\n}\n```\n\n重载在存在使用不同数量参数的相似函数时也非常方便。例如，考虑一个带有返回整数之和函数的程序。一个返回两个整数之和，另一个返回三个整数之和，还有一个返回四个整数之和。以下是它们的头文件：\n\
  \n```\n int sum(int num1, int num2)\nint sum(int num1, int num2, int num3)\nint\
  \ sum(int num1, int num2, int num3, int num4)\n```\n\n因为每个函数的参数数量不同，所以它们都可以在同一个程序中使用。程序\
  \ 6-29 使用了两个命名为 `calcWeeklyPay` 的函数，来确定员工的毛工资。该函数的一个版本使用一个 `int` 和一个 `double` 参数，而另一个版本只使用一个\
  \ `double` 参数。\n\n# 6.15 exit() 函数\n\n### 概念\n\n`exit()` 函数会导致程序终止，无论正在执行哪个函数或控制机制。当\
