  \ 0。\n    将 `c` 乘以 3 的结果存储在 `x`。\n    将 `b` 乘以 6 的结果加到 `x` 中。\n\n## 寻找错误\n\n36.\
  \ 以下伪代码算法包含两个错误。它应该使用赋值的值来计算并显示两个数字的平均值。找到这两个错误。\n    ```\n    num1 = 6\n    num2\
  \ = 7\n    average = (num1 + num1)/2\n    display avg\n    ```\n\n37. 以下伪代码算法有一个错误。它应该使用输入的矩形房间长度和宽度来计算并显示其面积。找到该错误。\n\
  \    ```\n    area = width × length\n    Display \"房间的宽度是多少?\"\n    Input width\n\
  \    Display \"房间的长度是多少?\"\n    Input length\n    Display area\n    ```\n\n## 软技能\n\
  \n程序员在设计程序之前，必须对程序将要处理的领域或区域有一定的基础知识，必须准确了解客户想要程序做什么。否则，最终程序可能无法正常工作，或者无法满足客户的需求。\n\
  \n38. 假设你的一位刷室内墙的朋友请求你开发一个程序，在输入房间长度和宽度的情况下，确定并显示粉房间所需的油漆量。编写此程序之前，你缺少哪些信息？在开始项目之前，至少需要向你的朋友询问三个问题。\n\
  \n## 编程挑战\n\n## 1. 糖果销售\n\n\n\n\n以程序 1-1 为例，编写一个程序来计算学生组织在糖果销售活动中赚了多少钱。该程序应提示用户输入销售的糖果数量以及组织每根糖果获得的金额。然后它应该计算并显示总收益金额。\n\
  \n## 2. 棒球费用\n\n以程序 1-1 为例，编写一个程序来计算一个联盟棒球球队去年购买新棒球花费了多少钱。该程序应提示用户输入购买的棒球数量和每颗棒球的成本。然后它应该计算并显示购买棒球的总花费。\n\
  \n## 3. 花园尺寸\n\n编写一个程序来计算自然中心一个矩形花园的大小。该程序应提示用户以英尺为单位输入花园的长度和宽度。然后它应该计算并显示花园的平方英尺数。\n\
  \n## 4. 花园费用\n\n编写一个程序来计算自然中心制作上题所述的花卉展示的费用。该程序应提示用户输入土壤、花种和围栏的成本。然后它应该计算并显示总花费。\n\
  \n# 第 2 章 C++ 简介\n\n## 2.1 C++ 程序组成\n\n### 概念\n\nC++ 程序具有具有特定用途的部分和组件。\n\n每个 C++\
  \ 程序都有结构。与人体解剖结构不同，C++ 程序的部分并不总是位于相同的位置。尽管如此，这些部分是确实存在的，学习 C++ 的第一步就是了解它们是什么。我们将从查看程序\
  \ 2-1 开始。\n\n让我们逐行检查程序。这里是第一行：\n\n```cpp\n// A simple C++ program\n```\n\n`//` 标记了*注释*的开始。编译器会忽略从双斜杠到行尾的所有内容。这意味着你可以在那行上输入你想要的任何内容，编译器永远不会抱怨！虽然注释不是必须的，但它们对程序员来说非常重要。大多数程序都比程序\
  \ 2-1 中的示例要复杂得多，注释有助于解释正在发生什么。\n\n第 2 行看起来如下：\n\n```cpp\n#include <iostream>\n```\n\
  \n当一行以 `#` 开头时，表示它是一个*预处理器指令*。预处理器会在编译之前读取你的程序，并仅执行以 `#` 符号开头的行。将预处理器想象成一个为编译器“设置”源代码的程序即可。\n\
  \n`#include` 指令导致预处理器将另一个文件（称为头文件）的内容包含在程序中。它被称为头文件，是因为它应该包含在程序的头部或顶部。括号中包含的单词 `<iostream>`\
  \ 是要包含的头文件的名称。（文件名是 `iostream`。括号表示它是一个标准 C++ 头文件。）`iostream` 文件包含了允许 C++ 程序在屏幕上显示输出并从键盘读取输入的代码。由于\
  \ `cout` 语句（在第 7 行）将将输出打印到计算机屏幕上，因此我们需要包含此文件。`iostream` 文件的内容会在 `#include` 语句出现的地方包含在程序中。\n\
  \n第 3 行内容为：\n\n```cpp\nusing namespace std;\n```\n\n程序通常包含具有唯一名称的各种类型项目。在本章中，你将学习创建变量。在第\
  \ 6 章中你将学习创建函数。在第 7 章中你将学习创建对象。变量、函数和对象是必须具有名称的程序实体示例。C++ 使用*命名空间*来组织程序实体的名称。`using\
  \ namespace std;` 语句声明了 `using` `namespace` `std`。\n\n\n\n\n随着你花费更多时间编写 C++ 代码，你将逐渐熟悉何时应该以及不该使用分号。目前不用担心这些。只需专注于学习程序的部分即可。\n\
  \n第 8 行读取：\n\n```\nreturn 0;\n```\n\n这在程序运行结束时将整数值 0 发送回操作系统。值 0 通常表示程序执行成功。\n\n\
  程序的最后一行，即第 9 行，包含右大括号：\n\n```\n}\n```\n\n这个大括号标记着 `main` 函数的结束。因为 `main` 是此程序中唯一的函数，它也标记着程序的结束。\n\
  \n在刚才的示例程序中，你遇到了几组特殊字符。表 2-1 提供了关于这些字符使用方式的简要总结。\n\n## 表 2-1 特殊字符\n\n| 字符 | 名称 |\
