  \      cout << \"You have won more than 50% of your games. \\n\";\n}\nelse\n   cout\
  \ << \"Good luck in the rest of your games. \";\n```\n\n## 4.7 逻辑运算符\n\n### 概念\n\
  \n逻辑运算符将两个或多个关系表达式合并为一个，或者反转表达式的逻辑。\n\n在上一节中，你看到了程序如何通过两个独立的 `if` 语句来测试两个条件。在本节中，你将看到如何使用逻辑运算符将两个或多个关系表达式合并为一个。表\
  \ 4-6 列出了 C++ 的逻辑运算符。\n\n### 表 4-6 C++ 逻辑运算符\n\n| 运算符 | 含义 | 效果 |\n| --- | --- |\
  \ --- |\n| `&&` | 与 (AND) | 将两个表达式合并为一个。只有当两个表达式都为真时，整个表达式为真。 |\n| `||` | 或 (OR)\
  \ | 将两个表达式合并为一个。其中一个或两个表达式为真，整个表达式为真。只需其中一个为真即可，哪个并不重要。 |\n| `!` | 非 (NOT) | 反转表达式的“真值”。它让真表达式变为假，让假表达式变为真。\
  \ |\n\n## `&&` 运算符\n\n`&&` 运算符被称为逻辑与（AND）运算符。它两个表达式作为操作数，并创建一个仅当两个子表达式都为真时为真的表达式。这是一个使用\
  \ `&&` 运算符的 `if` 语句示例：\n\n```cpp\nif ((temperature < 20) && (minutes > 12))\ncout\
  \ << \"The temperature is in the danger zone.\";\n```\n\n注意，进行与运算连接的两个表达式都是求值为真或为假的完整表达式。首先求值\
  \ `temperature < 20` 生成一个真或假的结果。然后求值 `minutes > 12` 产生一个真或假的结果。最后，将这两个结果进行与运算，得到整个表达式的最终结果。只有当\
  \ `temperature` 小于 20 且 `minutes` 大于 12 时，才会执行 `cout` 语句。如果任一个关系测试为假，整个表达式即为假，`cout`\
  \ 语句不会执行。表 4-7 显示了 `&&` 运算符的真值表。如表所示，只有当两个表达式都为真时，`&&` 运算符才返回真。\n\n#### 4-7 逻辑与表\n\
  \n| 表达式 | 结果 |\n| --- | --- |\n| `false && false` | `false` |\n| `false && true`\
  \ | `false` |\n| `true && false` | `false` |\n| `true && true` | `true` |\n\n###\
  \ 注意\n\n进行 `&&` 运算的两个表达式都是求值为真或为假的完整表达式。首先求值 `temperature < 20` 产生一个真或假的结果。然后求值\
  \ `minutes > 12` 产生一个真或假的结果。最后，将这两个结果进行与运算，得到整个表达式的最终结果。只有当 `temperature` 小于 20\
  \ 且 `minutes` 大于 12 时，才会执行 `cout` 语句。如果任一个关系测试为假，整个表达式即为假，`cout` 语句不会执行。表 4-7 显示了\
  \ `&&` 运算符的真值表。如表所示，只有当两个表达式都为真时，`&&` 运算符才返回真。\n\n### 注意\n\n如果 `&&` 运算符左侧的表达式为假，右侧表达式将不会被检查。这就是短路逻辑。\n\
  \n## `||` 运算符\n\n`||` 运算符被称为逻辑或（OR）运算符。它接受两个表达式作为操作数，并创建一个只要其中一个子表达式为真就为真的表达式。这是一个使用\
  \ `||` 运算符的 `if` 语句示例：\n\n```cpp\nif ((temperature < 20) || (temperature > 100))\n\
  cout << \"The temperature is in the danger zone.\";\n```\n\n当 `temperature` 小于 20\
  \ 或 `temperature` 大于 100 时，将执行 `cout` 语句。如果任一个关系测试为真，整个表达式即为真，`cout` 语句就会执行。\n\n\
  ### 注意\n\n进行或运算的两个对象都应该是求值为真或为假的逻辑表达式。像下面这样编写 `if` 条件是不正确的：\n\n```cpp\nif (temperature\
  \ < 20 || > 100)\n```\n\n键盘上没有 `||` 键。使用两个 `|` 符号。这个符号在反斜杠键上。按下 Shift 键和反斜杠键即可输入。表\
  \ 4-8 显示了 `||` 运算符的真值表。\n\n## 4-8 逻辑或表\n\n| 表达式 | 表达式的值 |\n| --- | --- |\n| `false\
  \ || false` | `false (0)` |\n| `false || true` | `true (1)` |\n| `true || false`\
  \ | `true (1)` |\n| `true || true` | `true (1)` |\n\n只要一个子表达式为真，或表达式就为真。另一个子表达式是假还是真都无重要。\n\
  \n\n\n\n`Program 4-13` 执行不同的测试以判断一个人是否符合贷款条件。该程序确定客户年收入是否至少达到 35,000 美元或者工作是否超过五年。\n\
  \n当表达式 `income >= MIN_INCOME` 或 `years > MIN_YEARS` 中任一个或两个为真时，程序会显示消息“你符合贷款条件。”如果这两个表达式均为假，则会打印不符合条件的消息。\n\
  \n## NOTE\n\n`||` 运算符也执行短路求值。如果 `||` 运算符左侧的子表达式为真，则不会检查右侧的子表达式，因为只要子表达式中有一个真，整个表达式就会真。\n\
  \n## `!` 运算符\n\n`!` 运算符执行逻辑非（NOT）操作。它接收一个操作数并反转其真假值。换句话说，如果表达式为真，`!` 运算符返回假；如果表达式为假，它返回真。以下是一个使用\
  \ `!` 运算符的 `if` 语句：\n\n```\n if (!(temperature > 100))\n   cout << \"You are below\
  \ the maximum temperature.\\n\";\n```\n\n首先，测试表达式 `(temperature > 100)` 为真或假。然后对该值应用\
  \ `!` 运算符。如果表达式 `(temperature > 100)` 为真，`!` 运算符返回假。如果为假，`!` 运算符返回真。在示例中，这等于询问“温度是否不大于\
  \ 100？”或者“温度大于 100 是否为假？”\n\n`Table 4-9` 显示了 `!` 运算符的真表。\n\n### 表 4-9 逻辑非真表\n\n\
  | 表达式 | 表达式的值 |\n| --- | --- |\n| `!false` | `true (1)` |\n| `!true` | `false (0)`\
  \ |\n\n`Program 4-14` 执行与 `Program 4-13` 相同的任务。然而，`if` 语句使用 `!` 运算符来判断申请人收入至少达到\
  \ 35,000 美元或工作超过五年的情况是否为假。\n\n## 布尔变量与 ! 运算符\n\n正如你在本章之前学到的，可以通过直接引用布尔变量名来测试其是否被设置为真。例如，如果\
  \ `moreData` 是一个布尔变量，测试\n\n```\n if (moreData == true)\n```\n\n可以简单地写为\n\n```\n\
  \ if (moreData)\n```\n\n通过使用逻辑非运算符，可以进行类似的操作来测试布尔变量是否被设置为假。测试\n\n```\n if (moreData\
  \ == false)\n```\n\n可以简单地写为\n\n```\n if (!moreData)\n```\n\n本质上，这是在测试 `moreData`\
  \ 是否**没有**设置为真。这种测试布尔变量值的第二种方法实际上更优。这是因为虽然 C++ 常量 `true` 的值始终为 1，但求值为真的条件可以是任何非零值。例如，C++\
  \ 有一个名为 `isalpha()` 的函数，用于测试一个字符是否为字母。正如你所预期的，测试 `isalpha('?')` 的结果为假，而测试 `isalpha('x')`\
  \ 的结果为真。然而，对于某些字母，该函数返回一个非 1 的值来表示真。`Program 4-15` 阐释了这一点。\n\n在第 14 行当测试条件 `isalpha('x')\
  \ == true` 时，程序没有产生预期的结果。`isalpha` 函数返回的值 2 与值 1 进行比较，因此该条件的评估为假，尽管实际上被测试的两个值都代表真。第\
  \ 20 行的代码运行正常，因为 `isalpha` 函数返回的值 2 被正确地解释为真。\n\n## 逻辑运算符的优先级和结合性\n\n`Table 4-10`\
  \ 显示了 C++ 逻辑运算符的优先级，从高到低排列。\n\n## 表 4-10 逻辑运算符的优先级\n\n| `!` |\n| --- |\n| `&&` |\n\
  | `||` |\n\n`!` 运算符的优先级高于许多 C++ 运算符。因此，为了避免错误，最好始终将其操作数包括在括号中，除非你打算将其应用于一个变量或没有其他运算符的简单表达式。例如，考虑以下表达式：\n\
  \n```\n !(x > 2)\n!x > 2\n```\n\n第一个表达式将 `!` 运算符应用于表达式 `x > 2`。它在询问“`x` 是否不大于 2？”。然而，第二个表达式仅将\
  \ `!` 运算符应用于 `x`。它在询问“`x` 的逻辑否定是否大于 2？”假设 `x` 被设置为 5。\n\n\n\n\n\n| `true || true`\
  \ |  |\n| `false || false` |  |\n| `!true` |  |\n| `!false` |  |\n\n2. 4.24 如果 `a\
