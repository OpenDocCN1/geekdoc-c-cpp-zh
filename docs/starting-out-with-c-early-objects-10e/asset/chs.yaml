  \ C++ 不允许在数字字面量中使用逗号。\n\n要定义相同数据类型的多个变量，例如两个整数 `length` 和 `width`，可以分别定义：\n\n```\n\
  int length;\nint width;\n```\n\n或者，也可以将两个变量定义放在一条语句中：\n\n```\nint length, width;\n\
