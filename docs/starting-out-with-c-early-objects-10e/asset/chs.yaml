  \n4. 该语句会调用 `myFunction` 多少次？\n\n# 17.7 函数对象与 Lambda 表达式简介\n\n### 概念\n\n函数对象是一个重载了函数调用运算符的类对象。函数对象的行为就像函数一样，并且可以作为参数传递给其他函数。Lambda\
  \ 表达式是创建函数对象的方便方法。\n\n函数对象也称为仿函数（functor），是一个像函数一样的对象。函数对象可以像函数一样被调用。它们可以接受参数并返回值。要创建一个函数对象，你需要编写一个重载了\
  \ `()` 的类。\n\n# Sum 的内容\n\n```cpp\n#ifndef SUM_H\n#define SUM_H\n\nclass Sum\n{\n\
  public:\n    int operator()(int a, int b) { return a + b; }\n};\n\n#endif\n```\n\
  \n`Sum` 类有一个成员函数：`operator()`。`operator()` 函数有两个 `int` 参数，`a` 和 `b`。它返回 `a` 和 `b`\
  \ 的和。程序 17-30 演示了如何使用该函数。\n\n让我们仔细观察 程序 17-31。在第 13 行，我们创建了 `Sum` 类的实例并将其命名为 `sum`。然后，在第\
  \ 16 行，我们将该对象传递给 `for_each` 函数。然而，函数对象可以在创建时直接被调用，而无需命名。\n\n# IsEven 的内容\n\n```cpp\n\
  #ifndef IS_EVEN_H\n#define IS_EVEN_H\n\nclass IsEven\n{\npublic:\n    bool operator()(int\
  \ x) { return x % 2 == 0; }\n};\n\n#endif\n```\n\n`IsEven` 类有一个成员函数：`operator()`。`operator()`\
  \ 函数有一个 `int` 参数 `x`。如果 `x` 是偶数，它返回 `true`，否则返回 `false`。\n\n# 构造匿名函数对象\n\n在上一节中，我们看到了接受函数指针的\
  \ STL 算法。如果你愿意，你也可以传递一个函数对象。我们的函数对象将是 `IsEven` 类的实例，如下所示：\n\n```cpp\nif (IsEven()(2))\n\
  \   cout << \"The number is even\\n\";\nelse\n   cout << \"The number is not even\\\
  n\";\n```\n\n以下代码创建了一个 `IsEven` 函数对象并用参数 2 调用了它，而从未给该函数对象命名。\n\n\n\n\n\n在没有赋予名称的情况下被创建和使用的对象被称为`匿名`（anonymous）对象。在这段代码段中，`IsEven()`\
  \ 是匿名函数对象，而 `IsEven()(2)` 是调用该函数对象并传递参数 2 的表达式。\n\n程序 17-35 与程序 17-34 类似，不同的是 `IsEven`\
  \ 类的匿名实例被传递给 `count_if()` 函数。\n\n# 谓词术语\n\n返回布尔值的函数或函数对象被称为`谓词`（predicate）。只接受一个参数的谓词被称为`一元谓词`（unary\
  \ predicate）。（之前显示的 `IsEven` 类的实例就是一个一元谓词。）接受两个参数的谓词被称为`二元谓词`（binary predicate）。熟悉这些术语非常重要，因为它们出现在大量的\
  \ C++ 文档和文献中。\n\n# Lambda 表达式\n\n`lambda 表达式`（lambda expression）是一种创建函数对象的紧凑方式，无需编写类声明。它是一个仅包含对象\
  \ `operator()` 成员函数逻辑的表达式。当编译器遇到 lambda 表达式时，它会在内存中自动生成函数对象，并使用你在 lambda 表达式中 `operator()`\
  \ 成员函数提供的代码。\n\n通常，lambda 表达式采用以下通用格式：\n\n```\n[](parameter list) {  function body\
  \  }\n```\n\n表达式开头的 `[]` 被称为`lambda 引入符`（lambda introducer）。它标记了 lambda 表达式的开始。`参数列表`（parameter\
  \ list）是函数对象 `operator()` 成员函数的参数声明列表，而`函数体`（function body）是应该是对象 `operator()` 成员函数体的代码。\n\
  \n例如，计算两个整数之和的函数对象的 lambda 表达式为：\n\n```\n[](int a, int b) { return x + y; }\n```\n\
  \n而，判断整数是否为偶数的函数对象的 lambda 表达式为：\n\n```\n[](int x) { return x % 2 == 0;}\n```\n\n\
  另一个示例，接受整数作为输入并打印该整数的 lambda 表达式写法如下：\n\n```\n[](int a) { cout << a * a << \" \"\
  ; }\n```\n\n### 注意\n\n可选的`捕获列表`（capture list）可以出现在 lambda 表达式括号 `[]` 中。捕获列表是 lambda\
  \ 表达式周围作用域内的变量列表，这些变量可以通过 lambda 函数体访问。\n\n当你调用 lambda 表达式时，在表达式后面紧跟一个圆括号括的参数列表。例如，以下代码段显示了\
  \ 7，它是变量 `x` 和 `y` 之和。\n\n```\nint x = 2;\nint y = 5;\ncout << [](int a, int b)\
  \ {return a + b;}(x, y) << endl;\n```\n\n以下代码段以程序 17-35 的方式计算 `vector` 中的偶数。然而，它使用\
  \ lambda 表达式代替了 `IsEven()` 函数对象作为 `count_if()` 函数的第三个参数。\n\n```\n// 创建一个整数 vector。\n\
  vector<int> v = { 1, 2, 3, 4, 5, 6, 7, 8 };\n\n// 获取偶数的个数。\nint evenNums = count_if(v.begin(),\
  \ v.end(), [](int x) {return x % 2 == 0;});\n\n// 显示结果。\ncout << \"The vector contains\
  \ \" << evenNums << \" even numbers.\\n\";\n```\n\n由于 lambda 表达式生成函数对象，你可以将 lambda\
  \ 表达式赋值给适当类型的变量，然后通过变量名调用它。例如，后续代码所示 lambda 表达式给了我们一个相两个整数的函数对象。该函数对象被赋值给名为 `sum`\
  \ 的变量：\n\n```\nauto sum = [](int a, int b) {return a + b;};\n```\n\n一旦语句执行，我们可以使用\
  \ `sum` 变量来调用函数对象，如下：\n\n```\nint x = 2;\nint y = 5;\nint z = sum(x, y);\n```\n\n\
  在该代码执行后，变量 `z` 将被赋值为 7。程序 17-36\n\n# 谓词术语\n\n返回布尔值的函数或函数对象被称为`谓词`。只接受一个参数的谓词被称为`一元谓词`。（之前显示的\
  \ `IsEven` 类的实例就是一个一元谓词。）接受两个参数的谓词被称为`二元谓词`。熟悉这些术语非常重要，因为它们出现在大量的 C++ 文档和文献中。\n\n\
