  \n# 17. 抛硬币赢取美元\n\n使用编程挑战 16 中的 `Coin` 类创建一个游戏程序。该程序应该有三个 `Coin` 类实例：一个代表四分之一（quarter），一个代表一美角（dime），一个代表五分币（nickel）。\n\
  \n当游戏开始时，你的初始余额为 $0。在游戏的每一轮中，程序将抛出每个模拟硬币。当抛出的硬币正面朝上时，硬币的价值将加入你的余额。例如，如果四分之一币正面朝上，余额将增加\
  \ 25 分。落在反面朝上的硬币不会增加余额。当你的余额达到美元或更多时，游戏结束。如果你的余额恰好为美元，你就赢了游戏。如果你的余额超过了美元，你就输了。\n\
  \n# 18. 钓鱼游戏模拟\n\n编写一个模拟钓鱼游戏的程序。在游戏中，通过掷六面骰子来决定用户钓到了什么。每个可能的物品都有相应的钓鱼得分。得分在用户完成钓鱼之前将保持隐藏，然后根据获得的钓鱼得分显示一条祝贺用户的消息。\n\
  \n以下是关于游戏设计的一些建议：\n\n* 游戏的每轮都是循环的一次迭代，只要玩家想继续钓更多物品，循环就会重复。\n* 在每轮结束时，程序会询问用户是否想继续钓鱼。\n\
  * 程序模拟掷六面骰子的过程。\n* 每个可以钓到的物品都由骰子生成的数字表示——例如，1 代表“一条大鱼”，2 代表“一只旧鞋”，3 代表“一条小鱼”，以此此类推。\n\
  * 用户钓到的每个物品价值的分数不同。\n* 你作为程序设计者，可以决定每个数字代表哪种鱼或物体，以及每个“捕获”关联多少分值。\n* 循环记录用户的钓鱼得分总和。\n\
  * 当退出循环时，将显示钓鱼总分。\n\n# 19. 患者费用\n\n编写一个计算患者账单的程序。账单组件如下：\n\n* `Patient` 类：存储患者姓名、地址和出生日期。\n\
  * `Visit` 类：存储就诊日期、就诊原因以及执行的项目列表。\n* `Procedure` 类：存储项目名称及其费用。\n\n程序应该使用循环处理患者的多次就诊。对于每次就诊，应计算总费用并显示最终账单。\n\
  \n# 第 8 章 数组与向量\n\n## 8.1 数组存储多个值\n\n### 概念\n\n数组允许你存储和处理多个相同类型的值。你目前为止使用的变量只能存储一个值。图\
  \ 8-1 中的变量定义只预留了存储一个指定类型的内存。\n\n### 图 8-1 变量只能持一个值\n\n图表显示了变量列表、它们的值以及每个变量的注释。\n\
  \n数组就像一个可以存储一组相同值的变量。这些值存储在连续的内存中。这是一个整数数组的定义：\n\n```\nint hours[6];\n```\n\n该数组的名字是\
  \ `hours`。括号内的数字是数组的*大小声明符*。它指示数组可以包含的*元素*或值的数量。`hours` 数组可以存储六个元素，每个元素都是整数。这在图\
  \ 8-2 中所示。\n\n## 图 8-2 具有六元素的数组\n\n图表显示一个被分为六个相等矩形的矩形。大矩形显示注释：“hours 数组有足够的内存存储六个\
  \ int 值。”这六个矩形标记为“Element 0”到“Element 5”。\n\n可以定义任何数据类型的数组。以下都是有效的数组定义：\n\n\n\n\n\
  ```\n float temperature[100];         // 100 个 float 类型的数组\nchar letter[26];   \
  \              // 26 个字符的数组\ndouble size[1200];               // 1200 个 double 类型的数组\n\
  string name[10];                 // 10 个 string 对象的数组\n```\n\n# 数组的内存需求\n\n数组所使用的内存量取决于数组的数据类型和元素数量。这里定义的\
  \ `age` 数组是一个包含六个 `short` `int` 值的数组。\n\n```\n short age[6];\n```\n\n在典型的 PC 上，一个\
  \ `short` `int` 占用 2 字节内存，因此 `age` 数组将占用 12 字节。这在图 8-3 中所示。\n\n## 图 8-3 数组内存使用\n\
  \n![内存存储显示一个矩形，被分为 6 个等大的矩形，每个矩形内部都有分区。大矩形旁边的注释为“每个 age 数组元素使用 2 字节。” 6 个矩形标记为“Element\
  \ 0”到“Element 5”。](img/FG_08_003.png)\n\n数组的大小可以通过存储单个元素所需的字节数乘以数组中的元素数量来计算。表 8-1\
  \ 显示了典型系统上各种数组的大小。\n\n## 表 8-1 示例数组及其大小\n\n| 数组声明 | 元素数量 | 每个元素的大小 | 数组的大小 |\n\n\
  | --- | --- | --- | --- |\n\n| `char letter[26];` | 26 | 1 字节 | 26 字节 |\n\n| `short\
  \ ring[100];` | 100 | 2 字节 | 200 字节 |\n\n| `int mile[84];` | 84 | 4 字节 | 336 字节\
  \ |\n\n| `float temp[12];` | 12 | 4 字节 | 48 字节 |\n\n| `double distance[1000];` |\
  \ 1000 | 8 字节 | 8,000 字节 |\n\n## 8.2 访问数组元素\n\n### 概念\n\n数组的每个元素都被分配了唯一的下标。这些下标被用于访问元素。\n\
  \n尽管整个数组只有一个名称，但元素可以作为单独变量变量访问和使用。这是可能的，因为每个元素都被分配了一个名为 `subscript`（下标）的数字。下标用作索引来精确定位数组中的特定元素。第一个元素的下标分配为\
  \ 0，第二个元素分配为 1，以此类推。我们在上一节中定义的 `hours` 数组中的六个元素下标将为 0 到 5。这在图 8-4 中所示。\n\n## 图 8-4\
  \ 数组下标\n\n![内存存储显示一个矩形，被分为 6 个等大的矩形。箭头指向 6 个矩形中的每一个，并标记为 0 到 5。](img/FG_08_004.png)\n\
  \n### 注意\n\nC++ 中的下标编号始终从 0 开始。数组最后一个元素的下标比元素总数少 1。这意味着在图 8-4 所示的数组中，不存在元素 `hours[6]`。数组的最后一个元素是\
  \ `hours[5]`。`hours` 数组中的每个元素在通过下标访问时，都可以用作 `int` 变量使用。这是一个将数字 20 存储在数组第一个元素的语句示例：\n\
  \n```\n hours[0] = 20;\n```\n\n表达式 `hours[0]` 的读法是“hours sub zero”。你会将此赋值读为“hours\
  \ sub zero 被赋值为二十”。图 8-5 显示了语句将 20 赋值给 `hours[0]` 之后 `hours` 数组的内容。\n\n## 图 8-5\
  \ hours 数组的内容\n\n![内存存储显示 hours 数组。6 个矩形标记为“hours[0]”到“hours[5]”。“hours[0]”矩形显示数字\
  \ 20，其他矩形显示问号。](images/FG_08_005.png)\n\n### 注意\n\n由于没有给数组的其他元素赋值，因此使用问号来表示这些元素的内容是未知的。如果存储数值的数组被定义为全局，则它的所有元素默认被初始化为零。然而，局部数组没有默认值。以下语句将整数\
  \ 30 存储在 `hours[3]` 中。注意这是第四个数组元素。\n\n```\n hours[3] = 30;\n```\n\n图 8-6 显示了该语句执行后数组的内容。\n\
  \n## 图 8-6 更新后的 hours 数组内容\n\n![内存存储显示 hours 数组更新后的内容。“hours[0]”矩形显示数字 20，“hours[3]”矩形显示数字\
  \ 30，其他矩形显示问号。](images/FG_08_006.png)\n\n### 注意\n\n理解数组大小声明（size declarator）和下标之间的区别非常重要。数组定义括号内的数字是大小声明，它指定数组包含多少元素。赋值语句（或任何处理数组内容的语句）括号内的数字是下标，它指定访问哪一个元素。元素可以像变量一样通过赋值语句接收值，但整个数组无法一次接收值。假设定义了以下数组：\n\
  \n```\n int doctorA[5];     // 医生 A 每天接诊患者数\nint doctorB[5];     // 医生 B 每天接诊患者数\n\
  ```\n\n以下都是合法的赋值语句：\n\n```\n doctorA[0] = 31;           // doctorA[0] 现在是 31。\n\
  doctorA[1] = 40;           // doctorA[1] 现在是 40。\ndoctorA[2] = doctorA[0];   //\
  \ doctorA[2] 现在也是 31。\ndoctorB[0] = doctorA[1];   // doctorB[0] 现在是 40。\n```\n\n\
  然而，以下语句是不合法的：\n\n```\n doctorA = 152;             // 错误！数组不能整体被赋值。\ndoctorB = doctorA;\
  \         // 这必须通过下标逐个完成。\n```\n\n## 8.3 输入和显示数组数据\n\n数组元素也可以使用 `cin` 对象读取信息，并使用\
  \ `cout` 对象显示其值，就像普通变量一样，只要是逐个操作即可。程序 8-1 显示了上一节讨论的 `hours` 数组被用于存储和显示值。图 8-7 显示了用户输入值后\
  \ `hours` 数组的内容。\n\n## 图 8-7 程序 8-1 填充的数组\n\n![内存存储显示 hours 数组的内容。矩形显示数字 20, 12,\
  \ 40, 30, 30 和 15 分别对应“hours[0]”、“hours[1]”、“hours[2]”、“hours[3]”、“hours[4]”和“hours[5]”。](images/FG_08_007.png)\n\
  \n尽管大多数 C++ 编译器要求数组定义的大小声明必须是常量或字面量，但下标数字可以存储在变量中。这使得可以使用循环“遍历”整个数组，对每个元素执行相同的操作。例如，[程序\
  \ 8-1]可以使用可以使用两个循环来简化：一个用于将值输入到数组，另一个用于显示数组的内容。这在[程序 8-2]中所示。\n\n\n\n\n\n让我们仔细观察[程序\
  \ 8-2]。在第 9 行，`hours` 数组使用命名常量 `NUM_EMPLOYEES` 作为大小声明符进行定义。这创建了一个包含六个元素的 `hours`\
  \ 数组，从 `hours[0]` 到 `hours[5]`。在第 13 行到 18 行之间，使用 `for` 循环向数组的每个位置输入一个值。请注意，循环控制变量\
  \ `count` 也被用作 `hours` 数组的下标。循环每次迭代时，`count` 都会有一个不同的值，从而访问不同的数组元素。\n\n由于 `for`\
  \ 循环将 `count` 初始化为 0，因此在循环第一次迭代时，用户输入的值被读入 `hours[0]`。在下一次迭代时，`count` 等于 1，因此此时用户输入的值被读入\
  \ `hours[1]`。这种情况会持续下去，直到在最后一次迭代中，`count` 等于 5，最后一个用户输入的值被读入 `hours[5]`。`for` 循环的测试条件编写方式是：当\
  \ `count` 达到等于 6 的 `NUM_EMPLOYEES` 时，循环将停止。\n\n程序的第二个 `for` 循环出现在第 23 行和第 24 行。它的工作方式类似，不同之处该循环使用\
  \ `cout` 显示每个数组元素的值，而不是使用 `cin` 将值读入每个数组元素。在第 23 行，变量 `count` 被重新初始化为 0，因此在循环第一次迭代时，存储在\
  \ `hours[0]` 中的值被显示出来。在下一次迭代时，`count` 等于 1，因此此时存储在 `hours[1]` 中的值被显示。这种情况会持续下去，直到在最后一次迭代中，`count`\
  \ 等于 5，存储在 `hours[5]` 中的值被显示。\n\n## 从文件读取数据到数组\n\n有时你可能从文件中读取数据并将其存储在数组中。这个过程非常简单。只需打开文件。然后使用循环从文件中读取每个项目并将其存储在数组元素中。[程序\
  \ 8-3] 修改了[程序 8-2] 来实现这一功能。请注意[程序 8-3] 第 23 行的 `while` 循环条件如何导致循环仅在数组尚未填满且尚未到达文件末尾时进行迭代。[程序\
  \ 8-3] 使用的 `work.dat` 文件与本章程序使用的所有数据输入文件一样，位于书籍配套网站上的[第 8 章]程序文件夹中。\n\n注意在[程序 8-3]\
  \ 中，`hours` 数组的内容是逐个元素输入并显示的。以下语句将是错误的：\n\n```\ncin >> hours;       // 错误！\ncout\
  \ << hours;       // 错误！\ninputFile >> hours;  // 错误！\n```\n\n同样注意，当我们在第 33 行显示员工数据时，我们使用循环控制变量\
  \ `employee` 作为下标来访问 `hours` 数组中该员工的数据。\n\n```\ncout << hours[employee] << endl;\n\
  ```\n\n然而，当我们在第 32 行显示该名员工的编号时，我们给循环控制变量的值加了 1，如下所示：\n\n```\ncout << \"Employee\
  \ \" << employee+1 << \": \";\n```\n这是因为员工 1 号的数据存储在 `hours[0]` 中，员工 2 号的数据存储在 `hours[1]`\
  \ 中，以此此类推。\n\n## 将数组内容写入文件\n\n将数组的内容写入文件也是一件简单的事情。首先打开一个由 `ofstream` 对象指向的输出文件，正如你在[第\
  \ 5 章]中所学会的那样。然后简单地使用循环遍历数组的每个元素，并将输出重定向到文件而不是计算机。\n\n## C++ 中没有边界检查\n\n从历史上看，C++\
  \ 受欢迎的原因之一是它赋予了程序员处理计算机内存的自由。然而，这意味着其他语言提供的防止程序不安全访问内存的许多保护措施在 C++ 中是缺失的。例如，C++\
  \ 不执行数组边界检查。这意味着你可以编写一个程序，无意中允许数组下标越界边界。这就是为什么在[程序 8-3]的第 23 行测试了循环变量的值，以确保它小于数组大小\
  \ `NUM_EMPLOYEES`，才允许循环继续迭代并读入值。\n\n如果程序尝试从一个包含文件中读取的所有项目超过数组能容纳的数量，可能会导致严重问题。具体发生了什么取决于你的系统如何管理内存。在许多系统上，这会导致相邻变量的内容被覆盖，从而丢失其正确值。在某些系统上，它甚至会导致计算机崩溃。[程序\
  \ 8-4] 展示了当数组下标越界时在作者计算机上发生的情况。它显示了存储在一个数组中的数据覆盖了另一个数组中的数据。它还在第 10 行显示了如何在定义数组时用数据初始化数组。这种技术在接下来的章节中将进一步讨论。\n\
  \n让我们仔细观察发生了什么。注意数组 `A` 初始值为 1, 1, 1，但最后变成了 5, 5, 5。这是因为程序第 21 行和第 22 行的循环将值 5 存储了七个数组\
  \ `B` 元素中，尽管数组 `B` 只有足够的内存存储三个值。其余的值存储在了不属于数组 `B` 的相邻内存位置。在这种情况下，某些值属于数组 `A`，因此其内容被覆盖并破坏了。图\
  \ 8-8 说明了这一点。\n\n# 图 8-8 在数组边界外存储数据\n\n![显示内存存储的矩形。](img/FG_008.png)\n\n你可以看到为什么在给数组元素赋值时，确保值在数组边界内写入是非常重要的。\n\
  \n### 注意差一错误\n\n在处理数组时，一种常见的错误是差一错误（off-by-one error）。这是一个很容易犯的错误，因为数组下标是从 0 开始而不是\
  \ 1 开始。例如，看下面的代码：\n\n```\n// 这段代码有一个差一错误\nconst int SIZE = 100;\nint numbers[SIZE];\n\
  for (int count = 1; count <= SIZE; count++)\n    numbers[count] = 0;\n```\n\n这段代码的目的是创建一个\
  \ 100 个元素的整数数组并在每个元素中存储 0。然而，这段代码有一个差一错误。循环使用它的计数器 `count` 作为 `numbers` 数组的下标。在循环执行期间，变量\
  \ `count` 取值为 1 到 100，而它本应该是 0 到 99。结果是下标为 0 的第一个元素被跳过了。此外，循环在最后迭代中尝试使用 100 作为下标。由于\
  \ 100 是无效下标，程序将在数组边界之外写入数据。\n\n## 检查\n\n1. 8.1 定义以下数组：\n    1. `empNum`，一个包含 100\
  \ 个元素的 `int` 数组\n    2. `payRate`，一个包含 25 个元素的 `double` 数组\n    3. `lightYears`，一个包含\
  \ 14 个元素的 `long` 数组\n    4. `stateCapital`，一个包含 50 个 `string` 对象的数组\n\n\n\n\n\n\
  5. age，一个包含 8 个整型的数组，初始化值为 9, 14, 15, 17, 18, 19, 21 和 23。\n6. `deptCode`，一个包含 4\
  \ 个字符的数组，初始化值为 'P'、'S'、'F' 和 'W'\n\n## 2. 8.2 每个数组定义是有效的还是无效的？如果定义无效，请解释原因。\n\n\
  1. `int numbers[10] = {0, 0, 1, 0, 0, 1, 0, 0, 1, 1};`\n2. `int matrix[5] = {1,\
  \ 2, 3, 4, 5, 6, 7};`\n3. `double radii[10] = {3.2, 4.7};`\n4. `int table[7] = {2,\
  \ , , 27, , 45, 39};`\n5. `int blanks[];`\n6. `double measurements[4.5];`\n\n##\
  \ 3. 8.3 在一个包含 4 个 `double` 元素的数组中，有效的下标值是什么？\n\n## 4. 8.4 下列语句都使用了方括号，但它们的含义不同。\n\
  \n```cpp\nint score[15];\nscore[6] = 45;\n```\n\n1. 哪个数字是尺寸说明符？\n2. 哪个数字是下标？\n\n\
  ## 5. 8.5 什么是“数组边界检查”？C++ 是否执行该操作？\n\n## 6. 8.6 下列代码的输出是什么？\n\n```cpp\nint values[5],\
  \ count;\nfor (count = 0; count < 5; count++)\n   values[count] = count * 2;\nfor\
  \ (count = 0; count < 5; count++)\n   cout << values[count] << endl;\n```\n\n##\
  \ 7. 8.7 完成以下程序骨架，使其拥有一个名为 `fish` 的包含 4 个 `int` 数组。完成后，程序应该询问 1 到 4 号渔民捕到了多少条鱼，并将这些信息存储在数组中。然后，它应该显示这些数据。\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main ()\n{\n   const int\
  \ NUM_MEN = ____;\n   // 定义一个名为 fish 的数组，可以容 4 个 int 值。\n   // 你必须完成此程序使其按照上述\n\
  \   // 描述工作。\n   return 0;\n}\n```\n\n## 8.4 数组初始化\n\n### 概念\n\n数组可以在定义时进行初始化。\n\
  \n有时，在程序内部设置变量值比输入它们更合适。然而，为数组的每个元素编写单独的赋值语句意味着大量的输入工作，特别是对于大型数组。例如，考虑一个需要创建一个数组来存储每年每月天数的程序。可以通过包含如下语句：\n\
  \n```cpp\nconst int NUM_MONTHS = 12;\nint days[NUM_MONTHS];\n\ndays[0] = 31; //\
  \ 一月\ndays[1] = 28; // 二月\ndays[2] = 31; // 三月\ndays[3] = 30; // 四月\n// ...\ndays[11]\
  \ = 31; // 十二月\n```\n\n但这需要 12 条单独的赋值语句，每月一条。幸运的是，还有另一种替代方案。正如你在程序 8-4 中简要看到的，C++\
  \ 允许你在定义数组时使用初始化列表对数组进行初始化。接下来的语句展示了如何这样做。它定义了 `days` 数组并用每个月的天数对其初始化。\n\n```cpp\n\
  int days[NUM_MONTHS] = {31, 28, 31, 30, 31, 30, 31, 30, 31, 30, 31};\n```\n\n当执行该语句时，值按照它们出现的顺序放入数组元素中。第一个值\
  \ 31 存储在 `days[0]` 中，第二个值 28 存储在 `days[1]` 中，依此类推。\n\n# 图 8-9 初始化后的 days 数组内容\n\n\
  ![内存存储显示了一个被分为 12 个等大小矩形的区域。矩形的下标从 0 到 11。矩形中的值分别为 31, 28, 31, 30, 31, 30, 31, 30,\
  \ 31, 和 31。](img/009.png)\n\n程序 8-5 包含了上述声明和初始化。它还包含了一个类似的语句，用于创建并初始化一个字符串数组，以存储月份名称。注意这些初始化列表可以跨越多行。\n\
  \n到目前为止，我们已经演示了如何向数组填充值然后显示所有值。然而，有时我们想从数组中检索一个特定的值。程序 8-6 是程序 8-5 的变体，显示了用户选择的月份有多少天。\n\
  \n## 从数组元素 1 开始\n\n有些老师倾向于让你不要使用数组元素 0，而是在对逻辑上从 1 开始的现实世界事物进行建模时，将实际数据存储在元素 1 中。一年的月份就是一个很好的例子。在这种情况下，你将声明\
  \ `name` 和 `days` 数组各包含 13 个元素，并像这样初始化它们：\n\n```cpp\nstring name[NUM_MONTHS+1] =\
  \ \n           { \" \", \"January\", \"February\", \"March\", \"April\", \n    \
  \              \"May\", \"June\", \"July\", \"August\",\n                  \"September\"\
  , \"October\", \"November\", \"December\" };\nint days[NUM_MONTHS+1] = {0, 31, 28,\
  \ 31, 30,\n                             31, 30, 31, 31,\n                      \
  \       30, 31, 30, 31};\n```\n\n注意数组元素 0 没有被使用。它只持有一个占位值。这允许第一个月份（一月）名称存储在 `name[1]`\
  \ 中，第二个月份（二月）名称存储在 `name[2]` 中，依此类推。同样，一月的天数在 `days[1]` 中，二月的天数在 `days[2]` 中，依此类推。\n\
  \n如果数组按所示定义并初始化，程序 8-5 第 22 行到第 26 行的循环将如下：\n\n```cpp\nfor (int month = 1; month\
  \ <= NUM_MONTHS; month++)\n{\n   cout << setw(9) << name[month] << \" has \"\n \
  \        << days[month] << endl;\n}\n```\n\n\n\n\n\n注意图 8-10，其中未初始化的元素都已设置为零。这是当数值数组被部分初始化时发生的情况。当一个\
  \ `string` 对象数组被部分初始化时，未初始化的元素将都包含空字符串，即长度为 0 的字符串。即使部分初始化的数组是局部定义的，情况也是如此。然而，如果一个局部数组完全没有初始化，它的元素将包含“垃圾值”，就像其他局部变量一样。\n\
  \n程序 8-7 显示了 `numbers` 数组在部分初始化后的内容。\n\n虽然数组初始化列表的值可以少于数组元素的个数，但不允许值的数量超过数组能容纳的数量。以下语句是非法的，因为\
  \ `numbers` 数组只能容纳七个值，但初始化列表包含了八个值。\n\n```\n int numbers[7] = {1, 2, 4, 8, 3, 5,\
  \ 7, 9}; // 非法！\n```\n\n此外，如果你遗留一个元素未初始化，则必须遗留其之后的所有元素也处于未状态。C++ 不提供在初始化列表中跳过元素的方法。这里是另一个非法的示例：\n\
  \n```\n int numbers[7] = {1, , 4, , 3, 5, 7};\n```\n\n## 隐式数组尺寸\n\n你可以通过提供一个包含每个元素值的初始化列表来定义一个无需指定大小的数组。C++\
  \ 会统计初始化列表中的项目数量，并赋予数组相应数量的元素。例如，以下代码创建了一个五个元素的数组：\n\n```\n double ratings[] = {1.0,\
  \ 1.5, 2.0, 2.5, 3.0};\n```\n\n## 注意事项\n\n如果你省略了声明符，则必须指定初始化列表。否则，C++ 不知道要把数组做得多大。\n\
  \n## 新的初始化方法\n\n到目前，你已经学会了如何使用赋值运算符定义和初始化普通变量，如下所示：\n\n```\n int value = 5;\n```\n\
  \n然而，既然你已经处理过函数、数组以及可能的类，现在是定义变量时引入另外两种额外的初始化方法了。\n\n第一种初始化变量的新方法使用函数符号表示法。它看起来类似于向函数传递参数的方式。如果你已经学习过构造函数，你会注意到它镜像了你在创建类对象时向构造函数传递值的方式。以下是使用函数符号表示法定义\
  \ `value` 变量并将其初始化为 5 的方法：\n\n```\n int value(5);\n```\n\n第二种初始化变量的新方法是 C++11 引入的，大括号表示法。它看起来类似于你刚刚看到的初始化数组的方式。然而，有两点不同。由于普通变量一次只能存储一个值，因此大括号内部只有一个值。而且，与初始化列表不同，大括号之前没有\
  \ `=` 运算符。以下是使用大括号表示法定义 `value` 变量并将其初始化为 5 的方法：\n\n```\n int value{5}; // 这仅在 C++11\
  \ 或更高版本有效。\n```\n\n大多数程序员继续使用赋值运算符来初始化普通变量，正如我们在本书中所做的那样。然而，大括号表示法有一个优势：它会检查并确保你初始化变量的值与变量的数据类型匹配。例如，假设\
  \ `doubleVal` 是一个存储了 6.2 的 `double` 变量。使用赋值运算符，我们可以编写以下语句之一：\n\n```\n int value1\
  \ = 4.9; // 这将在 4 存储在 value1 中\n int value2 = doubleVal; // 这将在 6 存储在 value2 中\n\
  ```\n\n在这情况下，值的小数部分在赋值给正在定义的变量之前会被截断。这可能会导致问题，但 C++ 编译器允许这样做。它们会发出警告，但仍然会生成一个你可以运行的可执行文件。然而，如果使用大括号表示法，编译器会指示这些语句产生错误，且不会创建可执行文件。你必须在运行程序之前修复错误并重新构建项目。\n\
  \n# 8.5 基于范围的 `for` 循环\n\n### 概念\n\n基于范围的 `for` 循环是一种为数组中的每个元素迭代一次的循环。循环每次迭代时，它都会将数组中的元素复制到一个变量。基于范围的\
  \ `for` 循环是 C++11 引入的。\n\nC++11 提供了一个 `for` 循环的特殊版本，在许多情况下简化了数组处理，被称为基于范围的 `for`\
  \ 循环。当你对数组使用基于范围的 `for` 循环时，循环会自动为数组中的每个元素迭代一次。例如，如果你对一个包含八元素的数组使用基于范围的 `for` 循环，循环将迭代八次。因为基于范围的\
  \ `for` 循环自动知道数组中的元素数量，所以你不需要使用计数器变量来控制。\n\n基于范围的 `for` 循环使用一个名为范围的内置变量。每当基于范围的\
  \ `for` 循环迭代时，它会将下一个数组元素复制到范围变量中。例如，第一次迭代时，范围变量将包含元素 0；第二次迭代时，范围变量将包含元素 1，以此类推。\n\
  \n以下是基于范围的 `for` 循环的通用格式：\n\n让我们更仔细地观察格式的各个部分：\n\n```\n for(dataType rangeVariable\
  \ : array)\n    statement;\n```\n\n- `dataType`: 范围变量的数据类型。它必须与元素的数据类型相同，或者是元素可以转换的类型。\n\
  - `rangeVariable`: 范围变量的名称。该变量在每次循环期间将接收不同数组元素的值。在第一次循环期间，它接收第一个元素的值；第二次循环期间，它接收第二个元素的值，以此类推。\n\
  - `array`: 希望循环操作的数组名称。循环将为数组中的每个元素迭代一次。\n- `statement`: 在每次循环期间执行的语句。要在循环中执行多个语句，请用大括号将其括起来。\n\
  \n例如，假设你有以下数组定义：\n\n```\n int numbers[] = {3, 6, 9};\n```\n\n你可以如下使用基于范围的 `for`\
  \ 循环来显示 `numbers` 数组的内容：\n\n```\n for(int val : numbers)\n{\n    cout << \"The next\
  \ value is \"; \n    cout << val << endl;\n}\n```\n\n由于 `numbers` 数组有三个元素，此循环将迭代三次。第一次迭代时，`val`\
  \ 变量将接收 `numbers[0]` 中的值。第二次迭代时，`val` 将接收 `numbers[1]` 中的值。第三次迭代时，`val` 将接收 `numbers[2]`\
  \ 中的值。这段代码将产生以下输出：\n\n```\n The next value is 3\nThe next value is 6\nThe next value\
  \ is 9\n```\n\n\n\n\n\n如果你愿意，可以使用第 2 章中引入的 `auto` 关键字来指定范围变量的数据类型，而不是由你亲自指定。正如你所记得的，它允许编译器根据初始化变量所用数据的数据类型自动检测变量的数据类型。这里有一个示例：\n\
  \n```\n for(auto val : numbers)\n{\n    cout << \"The next value is \"; \n    cout\
  \ << val << endl;\n}\n```\n\n程序 8-8 使用基于范围的 `for` 循环显示 `string` 数组的元素。\n\n# 使用基于范围的\
  \ `for` 循环修改数组\n\n当基于范围的 `for` 循环执行时，其范围变量包含数组元素的拷贝。因此，除非你将范围变量声明为引用，否则你无法使用基于范围的\
  \ `for` 循环修改数组的内容。回想一下第 6 章，引用变量是另一个值的别名。对引用变量所做的任何更改实际上都是对它所别名的值进行的。\n\n要将范围变量声明为引用变量，请在循环头中的名称前放置一个安符（`&`）。程序\
  \ 8-9 了一个示例。它使用基于范围的 `for` 循环将用户输入的数据存储在数组中。\n\n注意在第 12 行中，范围变量 `val` 的名称前面写有一个安符（`&`）。这把\
  \ `val` 声明为引用变量。随着循环执行，`val` 变量将不仅包含数组元素的拷贝，而且将是元素本身的别名。因此，对 `val` 变量所做的任何更改实际上都是对它当前引用的数组元素进行的。\n\
  \n相比之下，注意第 20 行中范围变量的名称前没有写安符。这是因为在这里没有必要将 `val` 声明为引用变量。此循环仅仅是在显示数组元素，而不是改变它们。\n\
  \n# 基于范围的 `for` 循环与普通的 `for` 循环\n\n在任何需要遍历数组所有元素且不需要使用元素下标的情况下，都可以使用基于范围的 `for`\
  \ 循环。然而，在由于某些目的需要使用元素下标的情况下，它将无法工作。如果循环控制变量用于访问两个或多个不同数组的元素，它也无法工作。在这些情况下，你需要使用普通的\
  \ `for` 循环。\n\n### 注意\n\n你可以对引用范围变量使用 `auto` 关键字。例如，程序 8-9 中第 12 到 16 行的代码可以这样写：\n\
  \n```\n for (auto &val : numbers)\n{\n   cout << \"Enter an integer value: \";\n\
  \   cin  >> val;\n}\n```\n\n## 8.6 处理数组内容\n\n### 概念\n\n单个数组元素的处理方式与其他类型的变量相同。\n\n\
  处理数组元素与处理变量变量没有。例如，以下语句将 `hours[3]` 与变量 `rate` 相乘：\n\n```\n pay = hours[3] * rate;\n\
  ```\n\n以下是对数组元素进行自增和后自增操作的示例：\n\n```\n int score[5] = {7, 8, 9, 10, 11};\n++score[2];\
  \    // 对 score[2] 中的值进行自增操作\nscore[4]++;    // 对 score[4] 中的值进行后自增操作\n```\n\n###\
  \ 注意\n\n使用加减运算符时，注意不要将下标与数组元素混淆。下面的示例说明了它们之间的区别。\n\n```\n amount[count]--;  // 这减少了\
  \ amount[count] 中存储的值\namount[count--];  // 这减少了变量 count，但\n                  //\
  \ 对 amount[count] 中存储的值没有进行任何操作\n```\n\n程序 8-10 演示了在简单语句中使用数组元素。数组元素可以像变量一样以所有方式使用。你已经见过如何读取数组、如何在数组中存储数据以及如何显示数组。数组元素也可以用于关系表达式。例如，以下\
  \ `if` 语句测试一个元素是否小于另一个值：\n\n```\n if (hours[3] < rate)\n```\n\n## 将一个数组复制到另一个\n\n\
  要将一个数组复制到另一个，不能简单地将一个数组赋值给另一个。相反，你必须一个一个赋值。下面的代码演示了如何这样做：\n\n```\n const int SIZE\
  \ = 6;\nint arrayA[SIZE] = {10, 20, 30, 40, 50, 60};\nint arrayB[SIZE];\n\nfor (int\
  \ index = 0; index < SIZE; index++)\n   arrayB[index] = arrayA[index];\n```\n\n\
  在循环的第一次迭代中，`index = 0`，因此 `arrayB[0]` 被赋值为 `arrayA[0]`。在第二次迭代中，`index = 1`，`arrayB[1]`\
  \ 被赋值为 `arrayA[1]`。一直持续到 `arrayA` 的所有元素都被复制到 `arrayB`。\n\n## 比较数组\n\n正如你不能用语句将一个数组复制到另一个，你也不能用语句比较两个数组的内容。也就是说，你不能使用\
  \ `==` 运算符配合数组名称来判断数组是否相等。下面的代码似乎在比较内容，但实际上并没有：\n\n```\n int arrayA[] = { 5, 10,\
  \ 15, 20, 25 };\nint arrayB[] = { 5, 10, 15, 20, 25 };\n\nif (arrayA == arrayB)\
  \       // 这是一个错误\n   cout << \"The arrays are the same.\\n\";\nelse\n   cout <<\
  \ \"The arrays are not the same.\\n\";\n```\n\n当你配合数组名称使用 `==` 运算符时，该运算符比较的是数组的内存地址而不是数组的内容。代码中的两个数组具有不同的内存地址。因此，表达式\
  \ `arrayA == arrayB` 的结果为假。\n\n要比较两个数组的内容，你需要比较它们的单个元素。例如，看以下代码。\n\n```\n const\
  \ int SIZE = 5;\nint arrayA[SIZE] = { 5, 10, 15, 20, 25 };\nint arrayB[SIZE] = {\
  \ 5, 10, 15, 20, 25 };\nbool arraysEqual = true;  // 标志变量\nint count = 0;      \
  \      // 循环计数变量\n\n// 判断元素是否包含相同的数据\nwhile (arraysEqual && count < SIZE)\n{\n \
  \     if (arrayA[count] != arrayB[count])\n         arraysEqual = false;\n     \
  \ count++;\n}\n// 显示适当的消息\nif (arraysEqual)\n   cout << \"The arrays are equal.\\\
  n\";\nelse\n   cout << \"The arrays are not equal.\\n\";\n```\n\n\n\n\n\n接下来的 `while`\
  \ 循环只要 `arraysEqual` 为 `true` 就会继续执行，这意味着目前没有发现任何差异，且 `count` 小于 `SIZE`，表明仍有元素需要比较。变量\
  \ `count` 也用作数组的下标。由于它在循环中不断递增，因此每次迭代都会比较一组不同的对应数组元素。如果发现两个对应元素的值不同，则 `arraysEqual`\
  \ 变量被设置为 `false`，这允许循环退出，而无需检查更多值。循环结束后，通过一个 `if` 语句测试 `arraysEqual` 变量的值。如果该变量仍为\
  \ `true`，则未发现任何差异。数组相等，并会显示一条指示此结果的消息。否则，它们不相等，将显示另一条消息。这段代码可以在书籍配套网站的第 8 章程序文件夹中的\
  \ `arrayCompare.cpp` 文件中找到。\n\n要求和数组中的值，必须使用带有累加器变量的循环。循环将数组中每个元素的值加到累加器上。例如，假设程序中出现以下语句：\n\
  \n```\n const int NUM_UNITS = 6;\nint units[NUM_UNITS] = {16, 20, 14, 8, 6, 10};\n\
  int total = 0;              // 初始化累加器\n```\n\n以下几行使用常规 `for` 循环将数组中每个元素的值加到 `total`\
  \ 变量。代码完成后，`total` 将包含 `units` 数组元素的和。\n\n```\n for (int count = 0; count < NUM_UNITS;\
  \ count++)\n   total += units[count];\n```\n\n在 C++ 11 中，你也可以使用基于范围的 `for` 循环来累加总和，如下：\n\
  \n```\n for (int val : units)\n    total += val;\n```\n\n### Note\n\n注意 `total`\
  \ 被初始化为 0。回想第 5 章，累加器变量在使用它保存运行总和之前必须设置为 0；否则总和将不正确。\n\n## 求数值数组中值的平均值\n\n计算数组中所有值的平均值的第一步是这些值求和。第二步是将和除以数组中的元素个数。假设程序中出现以下语句：\n\
  \n```\n const int NUM_SCORES = 5;\ndouble scores[NUM_SCORES] = {90, 88, 91, 82,\
  \ 95};\n```\n\n以下代码计算 `scores` 数组中值的平均值并将结果存储在 `average` 变量中。\n\n```\n double total\
  \ = 0;         // 初始化累加器\ndouble average;           // 将存储平均值\n\nfor (int count\
  \ = 0; count < NUM_SCORES; count++)\n    total += scores[count];\naverage = total\
  \ / NUM_SCORES;\n```\n\n与上一个示例一样，在 C++ 11 中可以使用基于范围的 `for` 循环来累加总和，而不是所示的常规 `for`\
  \ 循环。无论选择哪种循环，将 `total` 除以 `NUM_SCORES` 求平均语句都不应放在循环内部。该语句应该只在循环完成所有迭代后执行一次。\n\n\
  ## 寻找数值数组中的最大值和最小值\n\n寻找数组中最大和最小值的算法非常相似。首先，让我们来看寻找数组中最大值的代码。假设程序中出现以下行：\n\n```\n\
  \ const int SIZE = 10;\nint numbers[SIZE] = {15, 6, 3, 11, 22, 4, 0, 1, 9, 12};\n\
  ```\n\n寻找数组中最大值的代码如下：\n\n```\n int count, highest;\n\nhighest = numbers[0];\nfor\
  \ (count = 1; count < SIZE; count++)\n{\n   if (numbers[count] > highest)\n    \
  \  highest = numbers[count];\n}\n```\n\n首先，我们将第一个数组元素的值复制到名为 `highest` 的变量中。然后，循环从下标\
  \ 1 开始将所有剩余数组元素与存储在 `highest` 中的值进行比较。每当在数组中发现大于 `highest` 的值时，将其复制到 `highest`。循环结束后，`highest`\
  \ 将包含数组中的最大值。\n\n以下代码寻找数组中的最小值。如你所示，它与寻找最大值的代码几乎完全相同。\n\n```\n int count;\nint lowest;\n\
  lowest = numbers[0];\nfor (count = 1; count < SIZE; count++)\n{\n   if (numbers[count]\
  \ < lowest)\n      lowest = numbers[count];\n}\n```\n\n等待，输入文本末尾有一些重复字符。我已经根据上下文清理了逻辑：“当循环结束，`lowest`\
  \ 将包含数组中的最小值。”\n\n## 部分填充数组\n\n有时你需要在数组中存储一系列元素，但不知道具体的元素个数。一种解决方案是让数组足够大以容纳可能的元素。然而，如果实际元素少于容量，数组将是部分填充。\n\
  \n部分填充数组通常配合一个变量使用，告知数组中存储了多少元素。例如，假设程序使用下面的代码。注意 `numValues` 被初始化为零，因为尚未存储任何值。\n\
  \n```\n const int SIZE = 100;\nint array[SIZE];\nint numValues = 0;\n```\n\n哨兵控制循环的每次迭代允许用户输入一个存储在数组中的数字，或输入\
  \ -1 退出。在存储每个值后，`numValues` 递增以持有可用元素的下标。\n\n```\n int number;\ncout << \"输入一个数字或\
  \ -1 退出：\";\ncin  >> number;\nwhile (number != -1 && numValues < SIZE)\n{\n   array[numValues]\
  \ = number;\n   numValues++;\n   cout << \"输入一个数字或 -1 退出：\";\n   cin  >> number;\n\
  }\n```\n\n当用户输入 -1 或 `numValues` 超过 99 时，循环停止。以下代码显示数组中所有的有效元素。\n\n```\n for (int\
  \ index = 0; index < numValues; index++)\n{\n   cout << array[index] << endl;\n\
  }\n```\n\n### 为什么要使用数组？\n\n程序 8-11 在数组中存储了一组数字，以便求和并找到平均值、最大值最小值。然而，这完全可以在不使用数组的情况下完成。可以将销售数据一个一个地放入简单的变量中，加到总和中，并在读取时与最大值和最小值进行比较。以下代码段演示了这一点。\n\
  \n```\n dataIn >> salesAmt;     输入第一个办公室的数据\ntotalSales = highestSales = lowestSales\
  \ = salesAmt; \nfor (office = 2; office <= numOffices; office++)\n{   dataIn >>\
  \ salesAmt;\n    totalSales += salesAmt;\n    if (salesAmt > highestSales)\n   \
  \    highestSales = salesAmt;\n    else if (salesAmt < lowestSales)\n       lowestSales\
  \ = salesAmt;\n}\naverageSales = totalSales / numOffices;\n```\n\n\n\n\n那么，为什么要用数组呢？有很多原因。其中最重要的原因之一是，一旦数据进入数组，就可以多次使用，而无需重新输入。例如，假设我们不是要寻找最高和最低销售额，而是想创建一个报告，告诉我们哪些办公室的销售额低于平均水平。程序\
  \ 8-12 修改了程序 8-11 来实现这一点。请注意，这需要查看每个数据两次。首先，每个值都被输入并求和，以找到并显示平均值。然后再次检查每个数据值，以便将其与平均值比较，并显示任何低于平均值的值。\n\
  \n程序 8-12 还说明了部分填充数组的使用。它允许 `sales` 数组存储最多 20 个值，然后使用 `while` 循环的控制变量来计数从文件中读取时存储的实际值个数。数据是从程序\
  \ 8-11 使用的相同的 `sales.dat` 文件读取的。\n\n让我们来看程序 8-12 中的几个关键点。首先，看第 29 行。这一行控制着 `while`\
  \ 循环并读取数据。\n\n```cpp\nwhile (count < SIZE && dataIn >> sales[count])\n```\n\n只要\
  \ `count` 小于数组的大小*且*从文件中成功读取了一个数据值（即未遇到文件末尾），循环就会继续。`while` 循环测试表达式的第一部分 `count\
  \ < SIZE` 防止循环写入数组边界之外。测试表达式的第二部分在文件中没有更多数据可读时停止循环。回想第 4 章，`&&` 运算符执行短路求值，因此 `while`\
  \ 循环测试表达式的第二部分 `dataIn >> sales[count]` 只有在 `count` 小于 `SIZE` 时才会执行。第 17 行定义的 `sales`\
  \ 数组有空间存储最多 20 个值，但由于数据文件只包含 12 个值，`while` 循环在读取 12 个项目后终止。\n\n注意循环控制变量 `count`\
  \ 是如何起到两个用途的。因为它初始化为 0，并在每次循环迭代时在第 31 行递增，它记录了 `count` 次，即下一个读取的项应该存储在哪个数组位置，从而正确地允许来自\
  \ `sales.dat` 文件的 12 个值存储在数组位置 0 到 11 中。当循环在我们的运行结束时，`count` 为 12，这等于读取的项数。\n\n\
  我们说过，当数据值需要被多次查看时，使用数组特别有用。这正是程序 8-12 发生的情况。第 30 行的语句将每个存储的数据加到 `total`。这个 `total`\
  \ 随后在第 37 行用于计算平均值。然后，在第 49 到 53 行的 `for` 循环内部，每个存储的项目再次被检查，以便与平均值比较，并在它低于平均值时显示它。随着你继续编程，你将遇到许多需要多次检查数据的算法，并将发现许多数组是组织和存储数据的特别有用的方法。\n\
  \n# 处理字符串\n\n字符串在内部存储为字符数组。它们与其他数组的不同之处在于，元素既可以被视为一组单独字符，也可以被视为单个实体。以下示例代码定义了一个\
  \ `string` 对象并将其视为单个实体，将其作为单个单元输入并显示。\n\n```cpp\nstring name;\ncout << \"Enter your\
  \ name: \";\ncin >> name;\ncout << \"Hello, \" << name << endl;\n```\n\n这实际上是字符串通常处理和处理的方式——作为单个实体。然而，C++\
  \ 提供了通过下标对它们进行索引的能力，就像数组一样，这样就可以逐字符处理它们。如果在前面的代码中为名字输入 `\"Warren\"`，它将存储在 `name`\
  \ `string` 对象中，如图 8-11 所示。\n\n# 图 8-11 字符串存储为一组字符\n\n![一个数组显示了字符‘W’、‘a’、‘r’、‘r’、‘e’、‘n’，下标为“name[0]”到“name[5]”]()\n\
  \n### 注意\n\n`string` 对象和 C 字符串都存储在连续的内存中，如图 8-11 所示。字符串和 C 字符串通过在最后一个字符后的内存字节放置\
  \ `'\\0'`（空字符）来终止。然而，并没有保证 `string` 对象会以这种方式终止。许多 C++ 版本使用空字符来终止 `string`。如果我们想像普通数组一样处理字符串，我们可以这样做：\n\
  \n```cpp\ncout << name[0]; // 输出 W\ncout << name[1]; // 输出 a\n```\n\n程序 8-13 说明了逐字符处理字符串。\n\
  \n程序 8-14 提供了逐字符处理字符串的另一个示例。\n\n字符串处理的更多示例在第 12 章中介绍。\n\n## 8.7 使用并行数组\n\n### 概念\n\
  \n通过相同的下标，你可以在多个数组存储的数据之间建立关系。\n\n有时将相关数据存储在多个数组中是有用的。当相关数据类型不同时，这特别有用。我们在程序 8-5\
  \ 和 8-6 中这样做过，其中 `name` 数组存储 12 个月份的名字，`days` 数组存储给定月份的天数。月份名称和它的天数通过相同的下标关联。例如，`days[3]`\
  \ 存储了 `month[3]` 对应的月份的天数。\n\n当存储在多个数组中的数据项以这种方式关联时，这些数组被称为*并行数组*。程序 8-15 是工资程序的变体，使用了并行数组。一个\
  \ `int` 数组存储每个员工的工时，一个 `double` 数组存储每个员工的小时薪率。\n\n注意在循环中使用相同的下标来访问两个数组。这是因为特定员工的数据存储在每个数组的相同相对位置。例如，1\
  \ 号员工的工时存储在 `hours[0]` 中，而同一员工的薪率存储在 `payRate[0]` 中。下标关联了两个数组中的数据。这一概念在图 8-12 中说明。\n\
  \n\n\n\n![图表显示两个相互行的数组。](img/FG_08_012.png)图 8-12 完整替代文本\n\n## 检查点 (Checkpoint)\n\
