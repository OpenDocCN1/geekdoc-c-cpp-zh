  \n## 9.11 算法的最坏情况复杂度函数 `f(n)` 衡量了算法解决规模为 `n` 的最耗时问题所需的时间。\n\n## 9.12 因为 `10*n` 和\
  \ `25*n` 相差一个常数因子，而常数因子是不重要的，所以这两个算法在效率上被认为是等价。\n\n## 9.13 说 `f(n)` 属于 `O(g(n))`\
  \ 意味着存在正常数 `K`，使得对于所有 `n`  ≥ 1，都有 `f(n) ≤ `K*g(n)`。这意味着对于较大的规模，复杂度函数为 `f(n)` 的算法并不比复杂度函数为\
  \ `g(n)` 的算法差。\n\n## 9.14 要证明 `100*n²+50*n²+75` 属于 `O(20*n³`，我们必须证明某个常数 `K`，对于所有\
  \ `n≥1`，`100*n²+50*n²+75≤K*(20*n³)`。\n观察所有 `n≥1`：\n$$\\frac{100n^{3} + 50n^{2} +\
  \ 75}{20n^{3}} = 5 + \\frac{5}{n} + \\frac{75}{20n^{3}} \\leq 5 + 5 + 75 \\leq 85$$\n\
  因此，我们找到了一个满足不等式的常数 `K`，即 `K=85`。\n\n## 9.15 假设对于所有 `n≥1` 都有 `g(n)≥1`，则对于所有 `n≥1`，有\
  \ `100≤100*g(n)`。这意味着对于所有 `n≥1`，`g(n)+100≤g(n)+100*g(n)=101*g(n)`。现在，如果 `f(n)` 属于\
  \ `O(g(n)+100)`，则存在正数 `K`，使得对于所有 `n≥1`，`f(n)≤K*(g(n)+100)≤101*K*g(n)`。取 `K=101*K`，我们看到对于所有\
  \ `n≥1`，`f(n)≤K*[g(n)]`。\n\n## 第 10 章\n\n1. 10.1 `cout << &count;`\n2. 10.2 `double\
