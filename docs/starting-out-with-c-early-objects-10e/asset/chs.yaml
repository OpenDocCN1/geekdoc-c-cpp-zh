  \ 对象的所有字符都是 `a`..`z` 和 `A`..`Z`，并且 `z` 的后继字符是 `a`，`Z` 的后继字符是 `A`。使用一个程序测试你的类，该程序要求用户输入字符串，然后进行加密并打印。\n\
  \n## 7. 企业销售\n\n公司有六个部门，每个部门负责不同地区的销售。设计一个 `DivSales` 类来保留部门的销售数据，具有：\n\n*   一个包含四个元素的数组，用于持有四个季度的销售。\n\
  *   一个用于持有所有部门总销售额的私有静态变量。\n*   一个接受四个参数的成员函数，每个假设为一个季度的销售。参数的值应复制到持有数据的数组。四个参数的和加到持有总销售额的静态变量。\n\
  *   一个接受 0 到 3 范围内整数参数的函数。该参数被用作季度销售数组的下标。该函数返回该下标元素的值。\n\n编写一个程序创建一个 `DivSales`\
  \ 对象数组。程序要求用户输入每个部门四个季度的销售情况。数据输入后，程序显示各部门季度销售的表格。程序随后显示年度总销售额。\n\n## 8. 有理数算术 I\n\
  \n*有理数*是两个整数的商。例如，12/5、12/`–`4、`–`3/4 和 4/6 都是有理数。如果一个有理数的分母为正且分子分母没有除 1 以外的公约数，则说该有理数是*约简形式*。例如，上述有理数的约简形式为\
  \ 12/5、`–`3/1、`–`3/4 和 2/3。\n\n\n\n\n\n编写一个名为 `Rational` 的类，其构造函数 `Rational(int,\
