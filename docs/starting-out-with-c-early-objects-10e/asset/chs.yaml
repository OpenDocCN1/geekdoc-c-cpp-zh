  \n12. 5.20 写一个 `for` 循环计算以下数字序列的总和：\n\n13. $$\\frac{1}{2} + \\frac{1}{4} + \\frac{1}{28}\
  \ + \\frac{4}{8} + \\frac{1}{16} + \\ldots\\,\\frac{30}{1024}$$\n\n# 5.9 决定使用哪种循环\n\
  \n### 概念\n\n尽管大多数重复算法可以使用三种循环中的任何一种编写，但每种循环在不同的情况下效果最好。\n\nC++ 的三种循环在特定情况下都是理想的。以下是关于何时使用每种循环的简要总结。\n\
  \n## `while` 循环\n\n`while` 循环是一种预测试循环。在条件为假时不执行循环的情况下，它是理想的。例如，验证输入：\n\n```cpp\n\
  while (num != 99)\n{cout << \"输入整数，99 表示退出:\";\n    cin >> num;\n```\n\n## `do-while`\
  \ 循环\n\n`do-while` 循环是一种后测试循环。在需要循环至少执行一次的情况下，它是理想的。`do-while` 循环是重复菜单的好选择：\n\n\
  ```cpp\ndo\ncout << \"输入整数:\";\n    cin >> num;\n} while (num != 99);\n```\n\n##\
  \ `for` 循环\n\n`for` 循环是一种带有初始化、测试和更新计数器的预测试循环。在已知确迭代次数的情况下，`for` 循环是理想的。\n\n```cpp\n\
  for (num = 1; num <= 8; num++)\n    cout << num << \" 的平方是 \" << endl;\n```\n\n\
  一个包含所有类型循环的程序可以在书籍配套网站的第 5 章文件夹找到，以及本章的其他程序。\n\n## 5.10 嵌套循环\n\n### 概念\n\n位于另一个循环内部的循环被称为*嵌套循环*。\n\
  \n在第 4 章中，你看到了一个 `if` 语句可以嵌套在另一个内部。同样也可以嵌套循环。第一个循环被称为*外层循环*。嵌套在内部的被称为*内层循环*。\n\n\
  ```\nwhile (condition1)         // 外层循环开始\n{\n    while (condition2)     // 内层循环开始\n\
  \    {\n    \n    }                     // 内层循环结束\n}                         //\
  \ 外层循环结束\n```\n\n嵌套循环用于需要重复操作某些次数的情况。以下是日常生活中的例子：\n\n*   对于每批要烤的饼干，我们必须将每个饼干放在烤网上。\n\
  *   对于每位销售人员，我们必须累加每笔订单以确定总佣金。\n*   对于每位老师，我们必须为他们的每个班级生成学生名单。\n*   对于每个学生，我们必须累加每个测试分数以找到学生的测试平均分。\n\
  \n无论任务是什么，每当外层循环执行一次时，内层循环都会通过其所有的迭代。这由程序 5-13 说明，该程序处理了最后这项任务，寻找学生的测试平均分。任何类型的循环都可以嵌套在任何其他循环内部。该程序使用了两个\
  \ `for` 循环。\n\n\n\n\n让我们使用所示示例数据，追踪程序 5-13 发生了什么。在这个例中，对于两个学生中的每一个人，我们都输入并相加了他们的三项分数。首先，在第\
  \ 23 行进入了外层循环并将 `snum` 设置为 1。然后，一旦该学生的 `total` 累加器初始化为零，就进入了从第 26 行开始的内循环。当外层循环仍在第一次迭代且\
  \ `snum` 仍为 1 时，内循环执行了所有的迭代，处理了该学生的第 1、2、3 次测试。随后，它退出了内循环，并在第 36 行到 38 行计算并输出了学生\
  \ 1 的平均分。只有这时，程序才到达外层循环的底部并向上进行第二次迭代。外层循环的第二次迭代处理了学生 2。对于外层循环的*每一次*迭代，内循环都执行了*所有*它的迭代。\n\
  \n将每个循环想象成一个旋转的轮子可能会有所帮助。外层循环是一个缓慢移动的大轮。内循环是一个快速旋转的小轮。大轮每旋转一圈，小轮就会旋转很多圈。由于在我们的示例中，外层循环执行了两次，而外层循环的每次迭代内循环都执行了三次，因此内循环总共执行了六次。这对应于用户输入的六个分数，下述总结如下：\n\
  \n*   对于外层循环的每一次迭代，内循环都会执行其所有的迭代。\n*   内循环完成迭代的速度比外层循环快。\n*   要获取内循环的总迭代次数，请将外层循环的迭代次数乘以每次外层循环执行时内循环执行的迭代次数。\n\
  \n## 5.11 跳出循环\n\n### 概念\n\nC++ 提供了提前跳出循环或提前跳出循环迭代的方法。\n\n有时有必要在循环完成所有迭代之前停止它。`break`\
  \ 语句在第 4 章中与 `switch` 一起使用，也可以放在循环内部。当遇到它时，循环立即停止，程序跳转到循环后的语句。\n\n这里有一个带有 `break`\
  \ 语句的循环示例。以下程序段中的 `while` 循环似乎执行了 10 次，但 `break` 语句导致它在第五次迭代后停止。\n\n```\nint count\
  \ = 1;\nwhile (count <= 10)\n{\n     cout << count << endl;\n     count++;\n   \
  \  if (count == 6)\n        break;\n}\n```\n\n给出这个示例仅仅是为了说明循环内部 `break` 语句的作用。然而，你通常不会想这样使用它，因为它违反了结构化编程的规则，并使代码更难于理解、调试和维护。循环的退出应该由循环顶部的条件测试控制（如\
  \ `while` 循环或 `for` 循环），或者由底部的控制（如 `do-while` 循环）。通常在循环内部使用 `break` 语句的唯一情况是在发生错误条件时提前退出循环。程序\
  \ 5-14 提供了一个示例。\n\n## 在嵌套循环中使用 `break`\n\n在嵌套循环中，`break` 语句只会中断它所处的循环。以下程序段在屏幕上显示三行星号。外层循环控制行数，内循环控制每行星号的数量。内循环被设计为显示\
  \ 20 个星号，但 `break` 语句在第 11 次迭代时停止了它。\n\n```\nfor (row = 0; row < 3; row++)\n{  \
  \ for (star = 0; star < 20; star++)\n    {   cout << '*';\n        if (star == 10)\n\
  \            break;\n    }\n    cout << endl;\n}\n```\n\n该程序段的输出为：\n\n```\n***********\n\
  ***********\n***********\n```\n\n### 警告！\n\n由于 `break` 语句跳过了循环条件来终止循环，它违反了结构化编程的规则，并使代码更难于理解、调试和维护。因此，我们***不***建议使用它来退出循环。然而，由于它是\
  \ C++ 语言的一部分，我们引入了它。\n\n## `continue` 语句\n\n有时你想留在循环中，但希望当前的循环迭代立即结束。这可以通过 `continue`\
  \ 语句来实现。当遇到 `continue` 时，循环体中出现在其之后的所有语句都会被忽略，并开始下一次迭代。在 `while` 循环中，遇到 `continue`\
  \ 会跳转到循环顶部的测试表达式；在 `do-while` 循环中，遇到 `continue` 会跳转到底部的测试表达式；在 `for` 循环中，遇到 `continue`\
  \ 会跳转到更新表达式。以下程序段演示了在 `while` 循环中使用 `continue`：\n\n```cpp\nint testVal = 0;\nwhile\
  \ (testVal < 10)\n{\n    testVal++;\n    if (testVal == 4)\n        continue; //\
  \ 终止本次迭代\n    cout << testVal << \" \";\n}\n```\n\n这个循环看起来显示的是 1 到 10，但实际输出如下：\n\
  \n```\n1 2 3 5 6 7 8 9 10\n```\n\n注意数字 4 没有打印。这是因为当 `testVal` 等于 4 时，`continue`\
  \ 语句跳过了 `cout` 语句并开始下一次迭代。\n\n### 注意\n\n与 `break` 语句一样，`continue` 语句违反了结构化编程的规则，并使代码更难于理解、调试和维护。因此，你应该谨慎使用\
  \ `continue`。\n\n## 练习\n\n1.  5.21 什么情况下最适合使用 `while`、`do-while` 或 `for`？\n    *\
  \ 用户必须输入 14 个数字。\n    * 必须显示菜单让用户进行选择。\n    * 计算需要执行次数未知（可能为零次）。\n    * 用户必须输入一系列值，用哨兵值结束。\n\
  \    * 用户必须输入一系列值，并指定数量。\n\n2.  5.22 下列程序段会显示多少个星号？\n    1.  ```cpp\n        for\
  \ (row = 0; row < 20; row++)\n        {  for (star = 0; star < 30; star++)\n   \
  \        {   cout << '*';\n           }\n           cout << endl;\n        }\n \
  \       ```\n    2.  ```cpp\n        for (row = 0; row < 20; row++)\n        { \
  \   for (star = 0; star < 30; star++)\n             {   if (star > 10)\n       \
  \             break;\n                 cout << '*';\n             }\n          \
  \   cout << endl;\n        }\n        ```\n\n3.  5.23 下面程序段会显示什么？\n    ```cpp\n\
  \    int addOn = 0, subTotal = 0;\n    while (addOn < 5)\n    {\n        addOn++;\n\
  \        if (addOn == 3)\n           continue;\n        subTotal += addOn;\n   \
  \     cout << subTotal << \"   \";\n    }\n    ```\n\n\n\n你日常使用的大多数商业软件程序将数据存储在文件中。以下是几个示例。\n\
  \n*   文字处理器：文字处理程序用于编写信函、备忘录、报告和其他文档。这些文档随后保存在文件中，以便稍后进行查看、编辑和打印。\n*   电子表格：电子表格程序用于处理数值数据。数字和数学公式可以插入到电子表格的行和列中。然后，电子表格可以保存到文件中以供以后使用。\n\
  *   图像编辑器：图像编辑程序用于绘制图形和编辑图像，例如你用数码相机拍摄的照片。你用图像编辑器创建或编辑的图像都保存在文件中。\n*   业务运营软件：日常业务运营中使用的程序高度依赖文件。工资程序将员工数据存储在文件中，库存管理程序将公司产品数据存储在文件中，会计系统将公司财务运营数据存储在文件中，以此此类推。\n\
  *   Web 浏览器：有时当你访问一个网页时，浏览器会在你的计算机上存储一个名为 `cookie` 的小文件。Cookie 通常包含有关浏览会话的信息，例如购物篮的内容。\n\
  *   游戏：许多电脑游戏将数据存储在文件中。例如，某些游戏将玩家名称及其分数的列表存储在文件中。这些游戏通常按分数从高到低的顺序显示玩家名称。某些游戏还允许将当前的游戏状态保存到文件中，这样你就可以退出游戏稍后恢复游戏，而无需从头开始。\n\
  \n程序员通常将将数据保存到文件的过程称为向文件`写入数据`（writing data）。当一段数据被写入文件时，它从内存（RAM）中的变量被复制到文件中。这在图\
  \ 5-8 中所示。`输出文件`（output file）一词用于描述数据写入的文件。它被称为输出文件是因为程序将输出内容存储在其中。\n\n## 图 5-8\
  \ 向文件写入数据\n\n![插图解释了如何向文件写入数据。](img/FG_05_008.png)图 5-8 完整替代文本\n\n从文件中检索数据的过程被称为从文件中`读取数据`（reading\
  \ data）。当一段数据从文件中被读取时，它从文件复制到内存（RAM）中的变量中。请参见图 5-9 的插图。`输入文件`（input file）一词用于描述从文件中读取数据的文件。它被称为输入文件是因为程序从文件中获取输入。\n\
  \n## 图 5-9 从文件读取数据\n\n![插图解释了如何从文件中读取数据。](img/FG_05_009.png)图 5-9 完整替代文本\n\n## 文件类型\n\
  \n通常情况下，文件有两种类型：文本文件和二进制文件。`文本文件`（text file）包含使用 ASCII 或 Unicode 等方案编码为文本的数据。即使文件中包含数字，这些数字也是作为一系列字符存储在文件中。因此，可以使用\
  \ `Notepad`（记事本）等文本编辑器打开并查看该文件。`二进制文件`（binary file）包含未转换为文本的数据。因此，你无法用文本编辑器查看二进制文件的内容。在这里我们将只处理文本文件。在第\
  \ 13 章中，你将学习如何处理二进制文件。\n\n## 文件访问方法\n\n访问存储在文件中的数据有两种通用方法：顺序访问和直接访问。当你处理`顺序访问文件`（sequential\
  \ access file）时，你从文件的开始到结束访问数据。如果你想先读取存储在文件末尾的一段数据，你必须先读取它之前的所有数据。你不能直接跳转到所需的数据。这与磁带的工作方式相似。如果你想听磁带上的最后一首歌，你必须快进跳过之前的所有歌曲或者听它们。没有办法可以直接跳转到某特定的歌曲。\n\
  \n当你处理`随机访问文件`（random access file，也称为`直接访问文件`direct access file）时，你可以直接访问文件中的任何一段数据，而无需读取之前的数据。这类似于\
  \ CD 播放器或 MP3 播放器的工作方式。你可以直接跳转到任何你想听的歌曲。这里的重点是顺序访问文本文件。这些文件易于处理，你可以使用它们来理解基础的文件操作。在第\
  \ 13 章中，你将学习处理随机访问。\n\n# 文件名与文件流对象\n\n磁盘上的文件通过`文件名`（filename）识别。例如，当你用文字处理器创建一个文档并将其保存到文件中时，你需要指定文件名。当你使用`Windows\
  \ 资源管理器`等工具查看磁盘内容时，你会看到文件名列表。图 5-10 展示了名为 `cat.jpg`、`notes.txt` 和 `resume.doc` 的三个文件在\
  \ Windows 资源管理器中的表示。\n\n## 图 5-10 三个文件\n\n![显示了三个文件，名为“cat.jpg”、“notes.txt”和“resume.doc”。](img/FG_05_010.png)\n\
  \n每个操作系统都有自己的一文件命名规则。许多系统（包括 Windows）支持使用`文件名扩展`（filename extensions），这是出现在文件名末尾的短字符序列。图\
  \ 5-10 中的文件具有扩展名 `.jpg`、`.txt` 和 `.doc`。点被称为“dot”。所以，例如，文件名 `resume.doc` 读作“resume\
  \ doc”。扩展名通常表示文件中存储的数据类型。例如，`.jpg`扩展通常表示文件包含根据 JPEG 图像标准压缩的图形图像。`.txt`扩展通常表示文件包含文本。`.doc`扩展通常表示该文件包含\
  \ Microsoft Word 文档。\n\n为了让程序处理磁盘上的文件，程序必须在内存中创建一个文件流对象。`文件流对象`（file stream object）是一个与特定文件关联并为程序处理该文件提供方法的对象。它之所以被称为“流”对象是因为它允许数据流从内存复制到文件，以及从文件复制到内存。\n\
  \n\n\n正如你需要在程序中包含 `iostream` 文件来使用 `cin` 和 `cout` 一样，你还需要另一个头文件来操作文件。`fstream` 文件包含了文件操作所需的所有声明。你可以通过以下语句包含它：\n\
  \n```\n#include <fstream>\n```\n\n`fstream` 头文件定义了 `ofstream`、`ifstream` 和 `fstream`\
  \ 数据类型。在 C++ 程序处理文件之前，它必须定义一个这些数据类型之一的对象。该对象将与计算机磁盘上的实际文件“链接”，而对文件可以执行的操作取决于你为文件流对象选择了了这三种数据类型中的哪一个。表\
  \ 5-1 列出并描述了文件流数据类型。\n\n## 表 5-1 文件流对象\n\n| 文件流数据类型 | 描述 |\n| --- | --- |\n| `ofstream`\
  \ | 这代表输出文件 `stream`，读音为 ‘o’ ‘f’ stream。该数据类型的对象可以用于创建文件并向其写入数据。 |\n| `ifstream`\
  \ | 这代表输入文件 `stream`，读音为 ‘i’ ‘f’ stream。该数据类型的对象可以用于打开已存在的文件并从中读取数据。 |\n| `fstream`\
  \ | 这代表文件 `stream`，读音为 ‘f’ stream。该数据类型的对象可以打开文件进行读取、写入或两者都有。 |\n\n### 注意\n\n在本章中，我们只讨论\
  \ `ofstream` 和 `ifstream` 数据类型。`fstream` 类型将在第 13 章介绍。\n\n## 创建文件流对象并打开文件\n\n在向文件写入或从文件中读取数据之前，必须发生两件事：\n\
  \n* 必须创建一个文件流对象。\n* 必须打开文件并将其链接到文件流对象。\n\n以下代码显示了打开文件进行输入（读取）的示例。\n\n```\nifstream\
  \ inputFile;\ninputFile.open(\"customers.txt\");\n```\n\n第一语句定义了一个名为 `inputFile`\
  \ 的 `ifstream` 对象。第二个语句调用了对象的 `open` 成员函数，并将字符串 `\"customers.txt\"` 作为参数传递。在这一语句中，`open`\
  \ 成员函数打开 `customers.txt` 文件并与 `inputFile` 对象链接。执行此代码后，你将能够使用 `inputFile` 从 `customers.txt`\
  \ 文件中读取数据。\n\n### 注意\n\n存储数据的文本文件通常使用 .txt 或 .dat 作为文件扩展名。\n\n以下代码显示了打开文件进行输出（写入）的示例。\n\
  \n```\nofstream outputFile;\noutputFile.open(\"employees.txt\");\n```\n\n第一语句定义了一个名为\
  \ `outputFile` 的 `ofstream` 对象。第二个语句调用了对象的 `open` 成员函数，并将字符串 `\"employees.txt\"\
  ` 作为参数传递。这打开了一个名为 `employees.txt` 的文件并与 `outputFile` 链接。如果指定的文件之前不存在，它将被创建。如果指定的文件已存在，它将被删除并创建一个同名的新文件。执行此代码后，你将能够使用\
  \ `outputFile` 向 `employees.txt` 文件写入数据。\n\n有时，在打开文件时，你可能还需要指定它的完整路径以及名称。例如，在 Windows\
  \ 系统上，以下语句打开文件 `C:\\data\\inventory.txt` 并将其与 `inputFile:` 链接：\n\n```\ninputFile.open(\"\
  C:\\\\data\\\\inventory.txt\");\n```\n\n### 注意\n\n注意文件路径使用了两个反斜杠。如前所述，在字符串字面量中需要两个反斜杠来表示一个反斜杠。\n\
  \n可以在一个语句中定义文件流对象并打开文件。以下示例定义了一个名为 `inputFile` 的 `ifstream` 对象，打开了 `customers.txt`\
  \ 文件并将 `inputFile` 与其关联：\n\n```\nifstream inputFile(\"customers.txt\");\n```\n\n\
  另一个示例定义了一个名为 `outputFile` 的 `ofstream` 对象，打开了 `employees.txt` 文件并将 `outputFile`\
  \ 与其关联：\n\n```\nofstream outputFile(\"employees.txt\");\n```\n\n## 关闭文件\n\n打开文件的反面是关闭文件。虽然程序的文件在程序关闭时会自动关闭，但编写显式关闭它们的语句是一个良好的编程习惯。以下是程序在完成文件使用后应该关闭文件的两个原因：\n\
  \n* 大多数操作系统在将数据写入文件之前临时将其存储在*文件缓冲区*中。文件缓冲区是内存中的一个较小“持有区域”，文件绑定的数据首先写入此处。只有当缓冲区满时，数据才会被实际写入文件。这样做是为了提高系统性能，因为执行文件\
  \ I/O 比在内存中处理数据要慢得多。关闭文件会导致缓冲区中任何未保存的数据写入其文件。这确保了如果你需要读回数据，程序打算写入文件的所有数据实际上都在其中。\n\
  * 某些操作系统限制了同时打开的文件数量。当程序不再使用文件时，关闭它们将释放系统资源。调用文件流对象的 `close` 函数可以关闭与之关联的文件。示例：\n\
  \n```\ninputFile.close();\n```\n\n## 向文件写入数据\n\n你已经知道如何使用插入运算符配合 `cout` 向屏幕输出数据。它也可以用于\
  \ `ofstream` 对象向文件写入数据。假设 `outputFile` 是一个 `ofstream` 对象，以下语句使用 `<<` 向文件写入字符串：\n\
  \n```\noutputFile << \"I love C++ programming\";\n```\n\n该语句将字符串 \"I love C++ programming\"\
  \ 写入 `outputFile` 关联的文件，正如 `cout` 所示：\n\n```\noutputFile << \"Price: \" << price\
  \ << endl;\n```\n\n该语句向 `outputFile` 写入 \"Price: \"，然后是 `price` 的值，最后是一个换行符。程序 5-15\
  \ 演示了打开文件、向文件写入数据并关闭文件。执行此代码后，我们可以使用文本编辑器打开 `demofile.txt` 文件查看其内容并在需要时打印它。图 5-11\
  \ 显示了文件内容在 Notepad 中的外观。\n\n## 图 5-11 demofile.txt 的内容\n\n![记事本显示了 4 个单词。单词是“Bach”、“Beethoven”、“Mozart”和“Schubert.”](img/FG_05_011.png)\n\
  \n注意在程序 5-15 的第 16 到 19 行，写入文件的每个字符串都以换行转义序列（\\n）结束。换行指定了文本行的结束。因为在每个字符串末尾写入了换行符，所以用文本编辑器查看时，字符串显示在不同的行上，如图\
  \ 5-11 所示。\n\n如果我们在写入这四个名称时不使用 `\\n` 转义序列或在每个名称后使用 `endl`，它们将全部显示在文件的同一行上，彼此之间没有空格，如图\
  \ 5-12 所示。\n\n## 图 5-12 单行写入的文件\n\n![记事本显示了一个字符串。它读取的内容为“BachBeethovenMozartSchubert.”](img/FG_05_012.png)\n\
  \n\n\n\n程序 5-16 也向文件写入数据，但它在程序运行时从键盘输入获取数据。该程序要求用户输入三个朋友的名字，然后它将这些名字写入一个名为 `friends.txt`\
  \ 的文件中。\n\n图 5-13 显示了该程序运行后 `friends.txt` 文件的示例。\n\n## 图 5-13 friends.txt 的内容\n\n\
  ![一张截图显示了记事本文件中的 3 个名字。名字是“Joe”、“Chris”和“Geri”。](img/FG_05_013.png)\n\n## 从文件中读取数据\n\
  \n除了使用文本编辑器查看文本文件外，你还可以将文本文件的数据作为程序的输入。这很容易做到，因为 `>>` 运算符可以从文件读取数据，也可以从 `cin` 对象读取数据。假设\
  \ `inputFile` 是一个 `fstream` 或 `ifstream` 对象，以下语句将从文件中读取一个字符串并存储在 `string` 变量 `name`\
  \ 中。\n\n```\ninputFile >> name;\n```\n\n程序 5-17 使用了该语句。它打开了 `friends.txt` 文件，其中包含了我们通过程序\
  \ 5-16 创建的三个名字。它读取这些名字并显示在屏幕上。然后它关闭文件。\n\n注意，程序 5-16 和 5-17 都包含一个循环。大多数处理文件的程序都会对文件中的每个记录执行相同的操作。因此，它们通常会包含一个对每个记录执行一次的循环。程序\
  \ 5-16 中的循环为每条由用户输入并写入文件的数据迭代一次。程序 5-17 中的循环则为每条从文件中读取并显示的数据迭代一次。\n\n## 读取位置\n\n\
  当一个文件被以输入模式打开时，文件流对象内部会维护一个名为“读取位置”（read position）的特殊值。文件的 `read position` 标记了从文件中读取的下一个字节的位置。当打开一个输入文件时，其读取位置初始设置为文件的第一个字节。因此，第一次读取操作从第一个字节开始提取数据。随着数据从文件中读取，读取位置会向前移动，移向文件末尾。\n\
  \n让我们看看在程序 5-17 中是如何工作的。当通过第 13 行的语句打开 `friends.txt` 文件时，文件的读取位置将处于如图 5-14 所示。\n\
  \n## 图 5-14 初始读取位置\n\n![内存显示了 3 个名字。](img/FG_05_014.png)[图 5-14 完整文本]请记住，当 `>>`\
  \ 运算符从文件中提取数据时，它期望读取由空格、制表符或换行符分隔的数据。当第 19 行的语句执行第一次时，`>>` 运算符从文件的当前读取位置读取到 `\\\
  n` 字符。从文件中读取的数据赋值给 `name` 变量。`\\n` 字符也从文件中读取，但它没有作为数据的一部分。因此 `name` 将持有值 `\"Joe\"\
  `。文件的读取位置将位于如图 5-15 所示的位置。\n\n## 图 5-15 下一个读取位置\n\n![内存显示了 3 个名字。](img/FG_05_015.png)\n\
  \n当第 19 行的语句执行第二次时，它从文件中读取下一个项目项，即 `\"Chris\"`，并将该值赋值给 `name` 变量。在该语句执行后，文件的读取位置将位于如图\
  \ 5-16 所示。\n\n## 图 5-16 下一个读取位置\n\n![内存显示了 3 个名字。](img/FG_05_016.png)\n\n当第 19 行的语句执行第三次时，它从文件中读取下一个项目项，即\
  \ `\"Geri\"`，并将该值赋值给 `name` 变量。在该语句执行后，文件的读取位置位于文件末尾，如图 5-17 所示。\n\n## 图 5-17 文件末尾的读取位置\n\
  \n![内存显示了 3 个名字。](img/FG_05_017.png)\n\n## 让用户指定文件名\n\n在之前的每个示例中，打开的文件名都是作为字符串字面量编码在程序中的。然而，在许多情况下，你会希望让用户指定使用的文件名。在\
  \ C++11 中，你可以将 `string` 对象作为文件流对象 `open` 成员函数的参数。程序 5-18 显示了一个示例。第 19 行提示用户输入要读取的文件。第\
  \ 20 行将用户输入的名称存储在名为 `fileName` 的 `string` 对象中，第 27 行将其作为参数传递给 `open` 函数。[程序 5-18]还让用户输入从文件中读取的值个数。\n\
  \n在此示例运行中由用户输入的 `sales.txt` 文件可以在书籍配套网站的第 5 章程序文件夹找到。\n\n## 在旧版本的 C++ 中使用 c_str\
  \ 成员函数\n\n在旧版本的 C++ 语言（C++11 之前），文件流对象的 `open` 成员函数不接受 `string` 对象作为参数。`open` 成员函数要求你以空结尾字符串的形式传递文件名，这也被称为*C\
  \ 字符串*（C-string）。字符串字面量以空结尾 C 字符串的形式存储在内存中（这解释了为什么可以将它们传递给 `open` 函数），但 `string`\
  \ 对象不是。\n\n幸运的是，`string` 对象有一个名为 `c_str` 的成员函数，返回以空结尾 C 字符串格式的对象的内容。以下是调用函数的通用格式：\n\
  \n```\nstringObject.c_str()\n```\n\n在通用格式中，`stringObject` 是 `string` 对象的名称。`c_str`\
  \ 函数返回存储在 `stringObject` 中的字符串的空结尾 C 字符串副本。\n\n例如，[程序 5-18]中的第 27 行可以重写为如下形式，以使程序与旧版本的\
  \ C++ 兼容：\n\n```\ninputFile.open(fileName.c_str());\n```\n\n\n\n\n\n程序 5-18 询问用户文件中有多少个值，并根据该数量读取相应数量的数据项。然而，从文件中读取数据时，并不需要用户指定有多少个数据值或数据在何结束。这是因为文件在末尾有一个文件结束\
  \ (EOF) 标记。你看不见它，但它确实在那里，程序可以测试是否已到达该标记。这个测试非常重要，因为如果程序尝试读取文件末尾之后的内容将会发生错误。\n\n\
  测试是否到达文件末尾最简单的方法是使用 `>>` 运算符。该运算符不仅可以从文件中读取数据，还可以返回一个真值（布尔）值，表示数据是否已成功读取。如果运算符返回\
  \ `true`，则表示成功读取了一个值。如果运算符返回 `false`，则意味着没有从文件中读取到任何值。已到达 EOF。\n\n程序 5-19 修改了 程序\
  \ 5-18，以便在不知道文件中有多少数字的情况下，读取并求出文件中值的和。它在读取的同时也对数字进行了计数。\n\n现在，让我们仔细观察第 25 行，它控制着循环。\n\
  \n```\nwhile (inputFile >> value)\n```\n\n注意，从文件中提取数据的语句被用作 `while` 循环中的一个布尔测试表达式。它的工作原理如下：\n\
  \n*   执行表达式 `inputFile >> value`。\n*   如果成功从文件中读取到一个项，该项将存储在 `value` 变量中，且表达式返回\
  \ `true` 表示成功。在这种情况下，执行第 26 行和第 27 行的语句，并重复循环。\n*   当文件中没有更多可读的项时，表达式 `inputFile\
  \ >> value` 返回 `false`，表示没有读取到值。在这种情况下，循环终止。\n\n# 测试文件打开错误\n\n在某些情况下，`open` 成员函数将无法工作。例如，如果文件\
  \ `info.txt` 不存在或在预目录目录找不到，以下代码将执行失败：\n\n```\nfstream inputFile;\ninputFile.open(\"\
  info.txt\");\n```\n\n幸运的是，有一种方法可以判断 `open` 成员函数是否成功打开了文件。调用 `open` 成员函数后，你可以像测试布尔表达式一样测试文件流对象。程序\
  \ 5-20 展示了如何操作。\n\n让我们仔细观察代码的某些部分。第 12 行调用 `open` 成员函数来打开文件 `list_of_numbers.txt`\
  \ 并将其与名为 `inputFile` 的 `ifstream` 对象关联。然后第 15 行的 `if` 语句像测试布尔表达式一样测试 `inputFile`\
  \ 的值。通过这种测试时，如果文件成功打开，`inputFile` 将给出 `true` 值；否则，它将给出 `false` 值。如示例输出所示，如果无法打开文件，程序将显示错误信息。\n\
  \n检测打开文件失败另一种方法是使用名为 `fail` 的 `ifstream` 类成员函数，如下代码所示：\n\n```\nifstream inputFile;\n\
  inputFile.open(\"customers.txt\");\n\nif (inputFile.fail())\n   cout << \"Error\
  \ opening file.\\n\";\nelse\n{\n   // 处理文件\n}\n```\n\n`fail` 成员函数在尝试执行的文件操作失败（即未成功）时返回\
  \ `true`，在其他情况下返回 `false`。在使用文件 I/O 时，在尝试使用文件之前始终测试文件流对象以确保文件已成功打开是一个好主意。如果无法打开文件，应该通知用户并让程序以适当的方式处理该情况。\n\
  \n## 检查点\n\n1. 5.24\n    1. 什么是输出文件？\n    2. 什么是输入文件？\n2. 5.25 在程序中使用文件必须包含哪个头文件？\n\
