  \ 函数。\n\n## 11. 文件上的插入排序 I\n\n编写一个程序，使用一个初始为空的文件来存储用户输入的排序整数列表。整数以二进制形式存储。每当运行该程序时，它都会打开文件并将存储的整数列表输出到屏幕上。然后程序要求用户输入一个新整数\
  \ `X`。程序查看文件末尾的整数。如果该整数小于或等于 `X`，程序将 `X` 存储在文件末尾并关闭文件。否则，程序从文件末尾开始向开头移动，将文件中每个大于\
  \ `X` 的值向上移动一位，直到到达文件中 `X` 应该存储的位置。然后程序在该位置写入 `X` 并关闭文件。\n\n## 12. 文件上的插入排序 II\n\
