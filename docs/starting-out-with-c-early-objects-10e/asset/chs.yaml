  , ios::in | ios::out | ios::binary);\n```\n\n# 13.8 Online Connections 案例研究\n\n\
  Online Connections 是一个帮助人们结识新朋友的在线服务。想要加入俱乐部并使用其服务的人填写注册表，说明他们的姓名、年龄、联系信息、性别、爱好、个人兴趣以及关于自己的其他相关信息。他们还指定了自己在新朋友中寻找的特质。如果提交的个人信息表明有很大概率匹配成功，该服务将尝试将这两个人联系在一起。\n\
  \n# 对象序列化\n\nOnline Connections 将在文件中存储成员信息。成员信息将由 C++ 程序进行处理，并存储在设计适当的类对象。这些对象可能涉及指向其他对象的指针，形成对象网络，当数据存储到文件时，必须以某种方式保留这种结构。稍后从文件中读回数据时，该结构将被重建。这种通过指针将复杂的对象网络转换为可以存储在磁盘文件（或中央内存之外的其他介质）的形式的过程被称为\
  \ `对象序列化`。\n\n在本节中，我们将通过查看一个包含 C++ `string` 对象的对象序列化的简单案例，来说序列化对象时使用的一些技术。回想 C++\
  \ 字符串通常使用指向动态分配的 `char` 数组的指针来实现。\n\n# 设计程序所需的类\n\n一个存储 Online Connections 成员提交的部分信息的简单类可能包括成员的名字、中间名首字母、姓和年龄。除了通常的访问器（getter）和设置器（setter）函数外，我们还需要用于`序列化`对象的成员函数：即一个将对象转换为存储在文件中的数据的成员函数：\n\
  \n```\nvoid store(ofstream &outFile);\n```\n\n我们还需要一个用于`反序列化`对象的成员函数：即一个从`store`\
  \ 写入的文件数据、恢复其结构并正确设置对象数据成员的函数：\n\n```\nvoid load(ifstream &inFile);\n```\n\n添加构造函数和\
  \ `display` 成员函数后，我们得到了如下类：\n\n# `serialization.h` 的内容\n\n```\n1 #include <iostream>\n\
  2 #include <fstream>\n3 #include <string>\n4 using namespace std;\n5 \n6 class Person\n\
  7 {\n8   string fname, lname;\n9   char mi;\n10   int age;\n11 public:\n12   string\
  \ getFname() const {return fname;}\n13   string getLname() const {return lname;}\n\
  14   char getMi() const {return mi;}\n15   int getAge() const {return age;}\n16\
  \ \n17   void setFname(string name){fname = name;}\n18   void setLname(string name){lname\
  \ = name;}\n19   void setMi(char ch){mi = ch;}\n20   \n21   // 从文件读取数据\n22   void\
  \ load(ifstream &inFile);\n23   // 存储到文件\n24   void store(ofstream &outFile);\n\
  25 \n26   // 构造函数  \n27   Person(string fname = \"\", char mi = 0,\n28         \
  \ string lname = \"\", int age = 0);\n29 \n30   void display()\n31   {\n32     cout\
  \ << fname << \" \" << mi << \" \" << lname << endl\n33          << \"Age : \" <<\
  \ age << endl;\n34   }\n35 };\n```\n\n# 确定序列化方案\n\n\n\n\n我们不能直接将 `Person` 对象的的内容写入磁盘文件，因为字符串成员包含指向字符数组的指针，这些指针需要被存储起来，以便在以后对象反序列化时能够重新构造字符串对象。由于字符串的长度不一，`Person`\
  \ 对象在反序列化时在磁盘上占据的空间也不相同。一种简单但有效的序列化方案是首先写入对象中占用常数空间的成员，然后将每个空间需求可能变化的成员写入磁盘，并在其前面写入该成员占用的字节数。对于\
  \ `Person` 类，我们可以使用图 13-5 所示的方案。\n\n# 图 13-5：一种简单的序列化方案\n\n![插图显示一个矩形被分为 6 个等大的水平部分。](img/FG_13_005.png)图\
  \ 13-5 完整替代文本\n\n`store` 函数的代码非常直观，可以在 `serialization.cpp` 文件的列列表中看到。要设计 `load`\
  \ 函数，我们注意到需要通过先将数据部分读入内存中的字符数组 `buffer` 中，来重新构造 `fname` 和 `lname` 字符串。为了处理 `fname`，我们首先从文件中读取其数据部分所占用的字节数：\n\
  \n```\nint firstNameLength;\ninFile.read(addr(&firstNameLength), sizeof(int));\n\
  ```\n\n然后我们必须将相应数量的字节读入缓冲区中，并对缓冲区进行空终止处理，以将其转换为 C 字符串：\n\n```cpp\ninFile.read(buffer,\
  \ firstNameLength);\nbuffer[firstNameLength] = '\\0';\n```\n\n最后，我们通过将 C 字符串赋值给\
  \ `fname` 成员，将其转换为字符串对象。C++ 字符串类有一个转换构造函数，可以自动将 C 字符串转换为字符串对象，从而使此类赋值成为。\n\n```cpp\n\
  frame = buffer;\n```\n\n`buffer` 数组被用作临时存放地。将其设为类的实例成员会在每个对象中为其分配空间，并浪费大量内存。更好的主意将其设为类的静态成员，这样草稿空间就可以由对象的所有成员共享。然而，我们注意到它只被\
  \ `load` 成员函数使用。因此，我们将其设为局部静态。这样，缓冲区空间只分配一次，而不是在每次调用 `load` 时重新分配。静态局部变量在第 6 章中描述过。\n\
  \n实现 `Person` 类所需的其余成员函数在 `serialization.cpp` 文件的列列表中。\n\n# `serialization.cpp`\
  \ 的内容\n\n```cpp\n 1 #include \"serialization.h\"\n 2 \n 3 Person::Person(string\
  \ fname,  char mi,\n 4                string lname,  int age)\n 5 {\n 6    this–>fname\
  \ = fname;\n 7    this–>lname = lname;\n 8    this–>mi = mi;\n 9    this–>age =\
  \ age;\n10 }\n11  \n12 //*********************************************\n13 // 存储\
  \ mi, age，然后 fname 的长度，      *\n14 // 然后 fname 的数据，然后 lname 的长度， *\n15 // 然后 lname\
  \ 的数据                        *\n16 //*********************************************\n\
  17 void Person::store(ofstream &outFile)\n18 {\n19    outFile.write(&mi, sizeof(mi));\n\
  20    outFile.write(reinterpret_cast<char *>(&age),\n21                  sizeof(age));\n\
  22  \n23    // 写入 fname 和 lname 的长度和数据\n24    int firstNameLength = fname.length();\n\
  25    outFile.write(reinterpret_cast<char *>(&firstNameLength),\n26            \
  \      sizeof(int));\n27    outFile.write(fname.data(), firstNameLength);   \n28\
  \    int lastNameLength = lname.length();\n29    outFile.write(reinterpret_cast<char\
  \ *>(&lastNameLength),\n30                  sizeof(int));  \n31    outFile.write(lname.data(),\
  \ lastNameLength); \n32  }\n33  \n34  //**********************************************\n\
  35  //按照 Person::store 写入的格式读取     *\n36  // 数据                                \
  \     *\n37  //**********************************************\n38  void Person::load(ifstream\
  \ &inFile)\n39  {\n40     const int BUFFER_SIZE = 256;\n41     static char buffer[256];\
  \ //用于读取名字\n42  \n43     inFile.read(&mi, sizeof(mi));\n44     inFile.read(reinterpret_cast<char\
  \ *>(&age), sizeof(age));\n45  \n46     // 先获取 fname 的长度和数据\n47     int firstNameLength;\n\
  48     inFile.read(reinterpret_cast<char *>(&firstNameLength),\n49             \
  \    sizeof(int));\n50     // 将 fname 的数据读入局部缓冲区\n51     inFile.read(buffer, firstNameLength);\n\
  52     // 对缓冲区进行空终止\n53     buffer[firstNameLength] = '\\0';\n54     // 赋值给 fname\n\
  55     fname = buffer;\n56     // 对 lname 执行相同的操作\n57     int lastNameLength;\n\
  58     inFile.read(reinterpret_cast<char *>(&lastNameLength),\n59              \
  \   sizeof(int));\n60     // 将 lname 的数据读入局部缓冲区\n61     inFile.read(buffer, lastNameLength);\n\
  62     // 对缓冲区进行空终止\n63     buffer[lastNameLength] = '\\0';\n64     // 赋值给 lname\n\
  65     lname = buffer;\n66 }\n```\n\n我们需要两个程序来演示 `Person` 类 13-20 的序列化能力，将其写入文件。13-21\
  \ 反序列化这些对象并在屏幕上显示它们。\n\n# 复习题与练习\n\n## 空题与简答\n\n1. 所有文件都分配了一个用于操作系统和用户识别的。\n2. 在使用文件之前，它必须先。\n\
