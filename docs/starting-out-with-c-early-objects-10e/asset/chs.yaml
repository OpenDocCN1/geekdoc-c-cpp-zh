  \n你应该通过移动指针而不是交换节点内容来排序列表。\n\n## 11. 子集的生成\n\n采用以下策略构建集合 1, 2, ..., n 的所有子集的列表。使用\
  \ STL vector 表示单个子集，使用 STL list 的 vectors 表示子集列表。从包含一个空 vector 的列表 `L[0]` 开始；此时\
  \ `L[0]` 代表空集的所有子集。现在假设你已经创建了 1, 2, ..., k-1 的子集列表 `L[k-1]`。为了形成 1, 2, ..., k 的子集列表\
  \ `L[k]`，创建一个空列表 `L`，然后对于 `L[k-1]` 中的每个 vector `v`，将 `v` 和 `v+k` 都添加到 `L` 中。最后，将\
  \ `L[k]` 设置为 `L`。（此处 `v+k` 指将整数 `k` 添加到 vector `v` 的结果）。对所有 n ≤ 4 的值测试你的程序。\n\n\
