  \ (count < 5);\n       {  cout << \"My favorite day is Sunday \\n\";\n         \
  \ count = count + 1;\n       }\n       ```\n\n    4. ```cpp\n       int count =\
  \ 1;\n       while (count < 5)\n          cout << \"My favorite day is Sunday \\\
  n\";\n          count = count + 1;\n       ```\n\n2. 5.2 执行以下代码行时会显示什么？\n\n    ```cpp\n\
  \    int count = 1;\n    while (count < 10)\n    {  cout << count << \"  \";\n \
  \      count = count + 2;\n    }\n    ```\n\n## 5.2 使用 `while` 循环进行输入\n\n### 概念\n\
  \n`while` 循环可以用于创建输入程序，直到输入可接受的数据为止。第 4 章引入了数据验证的概念，并展示了如何使用 `if` 语句验证用户输入的数据。然而，`if`\
  \ 结构只能捕获一个错误值。如果用户在提示重新输入原始值后输入了第二个错误值，它将不会被检查。\n\n`while` 循环解决了这个问题，特别对于验证输入非常有用。如果输入了无效值，循环可以根据需要多次要求用户重新输入，直到收到接受的值。例如，以下循环要求输入一个\
  \ 1 到 100 之间的数字：\n\n```cpp\ncout << \"Enter a number in the range 1–100: \";\ncin\
  \ >> number;\nwhile ((number < 1) || (number > 100))\n{\n   cout << \"ERROR: Enter\
  \ a value in the range 1–100: \";\n   cin >> number;\n}\n```\n\n这段代码首先允许用户输入一个数字。这发生在循环之前。如果输入有效，`while`\
  \ 条件将为假，循环将不会执行。然而，如果输入无效，`while` 条件将为真，因此循环体中的语句将执行。它们将显示错误信息并要求用户输入另一个数字。循环将继续执行，直到用户输入有效数字为止。执行输入验证的通用逻辑在图\
  \ 5-3 所示（此处为占位符，实际应对应逻辑图）](fileP7001016089000000000000000003735)中。0000000000000000000000000003735)\
  \ \n\n### 图 5-3 使用 `while` 循环进行输入\n\n![显示一个流程图](img/0503.png)\n\n## 预读 (Priming\
  \ Read)\n\n在循环开始之前的第一次读取被称为*预读*。它为循环提供了第一个值。程序 5-300000000000000000000000000003735)00000000000000000000000000003735)000000000000000000000000000003735)00000000000000000000000000003735)00000000000000000000000000003735)00000000000000000000000000003735)00000000000000000000000000003735)00000000000000000000000000003735)00000000000000000000000000003735)00000000000000000000000000003735)00000000000000000000000000003735)\n\
  \n## 5.3 递增和递减运算符\n\n### 概念\n\nC++ 提供了一对用于递增和递减的运算符。递增一个值意味着增加它，而递减一个值则意味着减少它。在下面的示例中，`qtyOrdered`\
  \ 增加了 10，`numSold` 减少了 3。\n\n```cpp\nqtyOrdered = qtyOrdered + 10;\nnumSold = numSold\
  \ - 3;\n```\n\n虽然存储在变量中的值可以增加或减少任何数量，但通常将其递增或递减 1。我们在程序 5-200000000000000000000000000003735)00000000000000000000000000003735)00000000000000000000000000000735)00000000000000000000000000000000)```\n\
  \n### 非法量 (Literals)\n\n以下是使用 `++` 和 `--` 的一些合法和非法的表达式。\n\n```cpp\ncount++;    \
  \   // 合法\ncount--;        // 合法\n5++            // 非法\n5--            // 非法\n```\n\
  \n\n\n\n\n在像程序 5-4 中使用的使用的简单语句中，没有区别。然而，当这些运算符被用于不仅仅是增加或减少变量的语句时，这种区别就变得重要了。例如，看以下行：\n\
  \n```\nnum = 4;\ncout << num++;\n```\n\n这条 `cout` 语句正在执行两件事：显示 `num` 的值并增加 `num`。但哪个先发生呢？如果\
  \ `num` 先递增，`cout` 显示的值将与最后递增不同。答案取决于递增运算符的模式。\n\n后置模式导致递增在变量的值在表达式中使用之后才发生。在示例中，`cout`\
  \ 将显示 4，然后 `num` 将增加到 5。然而，前缀模式会导致先执行递增。在以下语句中，`num` 将先增加到 5，然后 `cout` 将显示 5：\n\n\
  ```\nnum = 4;\ncout << ++num;\n```\n\n程序 5-5 通过在 `cout` 语句中放置递增和递减运算符，进一步阐明了这些动态。这使得人们很容易看出在前缀模式和后置模式下使用它们的区别。然而，通常不应该这样做。也就是说，在实际的编程应用程序中，不建议在\
  \ `cout` 语句中使用递增或递减运算符。\n\n让我们分析此程序中的语句。在第 8 行，`num` 初始化为值 4，因此第 11 行的 `cout` 语句显示\
  \ 4。然后，第 12 行将表达式 `num++` 发送到 `cout`。由于 `++` 运算符是以后置模式使用的，值 4 首先被发送到 `cout`，然后 `num`\
  \ 加 1，使其其值变为 5。\n\n当执行第 13 行时，`num` 将保持值 5，因此显示 5。然后，第 14 行将表达式 `++num` 发送到 `cout`。由于\
  \ `++` 运算符是以前缀模式使用的，先给 `num` 加 1（使其变为 6），然后将值 6 发送到 `cout`。这种相同的事件序列也发生在第 17 行到第\
  \ 20 行之间，只是使用的是 `--` 运算符。\n\n另一个例子，看以下代码：\n\n```\nint x = 1;\nint y\ny = x++;  \
  \  // 后置递增\n            // 将 x 的旧值赋给 y，然后增加 x\n```\n\n第一条语句定义了变量 `x`（初始化值为 1），第二条语句定义了变量\
  \ `y`。第三条语句执行了两个操作：\n\n* 它将 `x` 的值（即 1）赋给变量 `y`。\n* 然后变量 `x` 增加。\n\n语句执行后，`y` 将包含\
  \ 1，`x` 将包含 2。现在让我们看看相同的代码，但使用前缀模式的 `++` 运算符：\n\n```\nint x = 1;\nint y;\ny = ++x;\
  \    // 前缀递增\n```\n\n这次第三条语句在前缀模式下使用 `++` 运算符，因此变量 `x` 在赋值发生之前增加。代码执行后，`x` 和 `y`\
  \ 都将包含 2。\n\n## 在数学表达式中使用 `++` 和 `--`\n\n递增和递减运算符也可以用于数学表达式中的变量。就像在算术表达式中一样，后置模式和前缀模式的区别非常关键。考虑以下程序段：\n\
  \n```\na = 2;\nb = 5;\nc = a * b++;\ncout << a << \" \" << b << \" \" << c;\n```\n\
  \n在语句 `c = a * b++` 中，`c` 被赋值为 `a` 乘以 `b` 的值，即 10。然后变量 `b` 增加，因此 `cout` 语句将显示\n\n\
  ```\n2 6 10\n```\n\n如果我们将语句改为\n\n```\nc = a * ++b;\n```\n\n变量 `b` 在乘以 `a` 之前将增加，因此\
  \ `cout` 语句将显示\n\n```\n2 6 12\n```\n\n你可以使用递增和递减运算符在单个语句中封装大量操作，但不要把它们玩得太花。你可能会忍不住尝试类似下面的操作，认为\
  \ `c` 将赋值为 11：\n\n```\na = 2;\nb = 5;\nc = ++(a * b);    // 错误！\n```\n\n但这条赋值语句根本无法工作，因为如之前提到的，递增和递减运算符的操作数必须是一个左值（lvalue）。\n\
  \n## 在关系表达式中使用 `++` 和 `--`\n\n`++` 和 `--` 运算符也可以用于关系表达式。就像在算术表达式中一样，后置模式和前缀模式的区别非常关键。考虑以下程序段：\n\
  \n```\nx = 10;\nif (x++ > 10)\n```\n\n这个 `if` 语句中发生了两个操作：测试 `x` 的值以判断它是否大于 10，并对\
  \ `x` 进行增加。由于 `10` 不大于 `10`，因此 `if` 语句不会执行。然而，如果递增运算符以前缀模式使用的，则 `x` 在测试 `if` 条件之前会增加，因此\
  \ `if` 语句将执行\n\n```\nx = 10;\nif (++x > 10)\n```\n\n## 检查点\n\n5.3 以下每个段落将显示什么？\n\
  \n1. ```\nx = 1;\ny = x++;\n```\n2. ```\nx = 1;\ny = ++x;\n```\n3. ```\nx = 1;\n\
  y = x++;\n```\n4. ```\na = 1;\nc = a * b++;\n```\n5. ```\nx = 99;\nif (x++ < 100)\n\
  ```\n6. ```\nx = 0;\nif (++x)\n```\n\n## 5.4 计数器\n\n### 概念\n\n计数器是一个每次循环迭代时都会定期增加或减少的变量。\n\
  \n有时程序需要跟踪循环执行的次数。例如，程序 5-6 显示从 1 到 5 的数字及其平方，因此循环必须迭代五次。\n\n在程序 5-6 中，控制变量 `num`\
  \ 从 1 开始，每次循环都会增加。当 `num` 达到 6 时，条件 `num <= 5` 为假，循环退出。`num` 也充当计数器，记录到为止循环迭代的次数。注意程序第\
  \ 15 行中 `num` 的增加。因为计数器通常按 1 计数，因此经常使用递增运算符。\n\n### 注意\n\n正确初始化 `num` 是重要的。记住，在函数内部定义的变量没有初始值。\n\
  \n# 让用户控制循环\n\n有时我们希望让用户决定循环迭代的次数。程序 5-2 就是这样做。程序 5-7，是[程序 5-6]的修订版，也这样做。它提示用户输入要显示并平方的最大整数值。然后它让循环计数器\
  \ `num` 计数到该值。\n\n# 5.5 保持运行总和\n\n### 概念\n\n运行总和是每次循环迭代时累加的数字之和。用于保持运行总和的变量被称为累加器（accumulator）。\n\
  \n\n\n\n\n许多编程任务需要你对一组数字进行累加。例如，如果你想找到一组数字的平均值，必须先将它们相加。累加一系列数字的程序通常使用两个元素：\n\n\
  *   一个读取序列中每个数字的循环。\n*   一个在读取数字时累加这些数字总和的变量。\n\n用于累加数字总和的变量被称为 `accumulator`（累加器）。人们通常说循环维持了一个\
  \ `running total`（运行总量），因为它在读取序列中的每个数字时都会将其累加到总和中。图 5-4 显示了计算运行总量的循环的通用逻辑。\n\n#\
  \ 图 5-4 使用循环保持运行总量\n\n![一个流程图显示了如何使用循环来保持运行总量。](img/FG_05_004.png)图 5-4 完整备用文本\n\
  \n当循环结束时，`accumulator` 将包含循环读取的数字总和。注意流程图中的第一步是将 `accumulator` 变量设置为 `0`。这是一个至关重要的步骤。循环每读取一个数字，就会将其累加到\
  \ `accumulator` 中。如果 `accumulator` 的初始值是 `0` 以外的任何值，那么当循环结束时它将不会包含正确的总和。\n\n让我们来看一个保持运行总量的程序。程序\
  \ 5-8 通过读取每日销售额并将其添加到 `accumulator` 中，来计算公司一周的总销售额。\n\n让我们仔细观察一下该程序中的几行关键代码。第 9\
  \ 行创建了一个名为 `NUM_DAYS` 的命名常量，并将其设置为 `5`。这将被用于控制从第 17 行开始的循环迭代次数。在第 12 行，定义了 `totalSales`\
  \ 变量。这就是 `accumulator`。注意它被初始化为 `0`。在第 10 行定义的变量 `day` 在第 16 行（循环开始之前）被赋值为 `1`。这个变量是控制循环的计数器，用于跟踪当前正在读取和处理哪一天的销售额。循环测试条件规定，只要\
  \ `day` 小于或等于 `NUM_DAYS`，循环就会重复。第 22 行在每次循环迭代结束时将 `day` 加 1。\n\n在每次循环迭代中，在第 20 行，用户输入特定一天的销售金额。该金额存储在\
  \ `dailySales` 变量中。然后，在第 21 行，将该金额加到 `totalSales` 变量存储的现有值。注意，第 21 行并不是将 `dailySales`\
  \ 赋值给 `totalSales`，而是通过 `dailySales` 的值来增加 `totalSales` 中存储的值。在循环完成所有迭代后，`totalSales`\
  \ 将包含所有输入的每日销售额的总和，并并在第 26 行将其显示。\n\n## 5.6 哨兵（Sentinels）\n\n### 概念\n\n哨兵（sentinel）是一个标记值列表结束的特殊值。\n\
  \n上一节中的程序 5-8 使用了一个命名常量来指示有销售额数据的天数。它的循环迭代相应的次数，以允许用户输入销售数据。但如果这个数字可以变化呢？在这种情况下，我们可以要求用户输入天数。当用户知道要输入和处理的项数时，这种方法是有效的。然而，有时用户并不知道有多少。\n\
  \n在这样的情况下可以使用的一种技术是要求用户在列表末尾输入一个哨兵。`sentinel` 是特殊值，它不会被误认为是列表的成员，并信号表明没有更多值需要输入。允许数据输入的循环将持续迭代，直到用户输入\
  \ `sentinel`。然后循环终止。这种循环被称为 `哨兵控制循环`（sentinel-controlled loop）。\n\n程序 5-9 包含一个哨兵控制循环。该程序计算足球队在一系列比赛中获得的总分。它允许用户输入到目前为止每场比赛的得分，然后输入\
  \ –1 来信号列表的结束。\n\n该程序选择 `−1` 作为 `sentinel`。\n\n## 检查点（Checkpoint）\n\n1.  5.4 在下面的程序中，哪个变量是计数器，哪一个是累加器？\n\
  \n    ```\n    int number, maxNums, x = 0, t = 0;\n    cout << \"你想输入多少数字？\";\n\
  \    cin >> maxNums;\n    while (x < maxNums)\n    {\n       cout << \"输入下一个数字：\"\
  ;\n       cin >> number;\n       t += number;\n       x++;\n    }\n    cout << \"\
  总和为 \" << t << endl;\n    ```\n\n2.  5.5 找到以下尝试累加代码中的四处错误。\n\n    ```\n    int val,\
  \ count, sum;\n    cout << \"我将累加 5 个数字。\\n\";\n    while (count < 5)\n    {\n \
