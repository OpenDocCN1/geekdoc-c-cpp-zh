  \ `for` 循环将数字 1 到 10 写入文件。\n\n## 5.13 专注于测试与调试：创建数据\n\n### 概念\n\n对程序的彻底测试需要良好的数据。一旦程序设计、编写并发现通过编译，就必须对其进行彻底测试以发现逻辑错误并确保其符合规范。在创建测试数据时，质量比数量更重要。也就是说，一组良好的测试用例提供的关于程序运行的信息比两倍数量要多。每个测试用例都设计用于测试程序的某个方面，并且你应该始终知道你使用的每个测试集在检查什么。作为示例，查看\
  \ 程序 5-21。它使用哨兵控制循环来计算每个学生的平均分，所有分数都在 0 到 100 之间。程序可以编译、链接并运行。但它包含了几个逻辑错误。\n\n尝试使用表\
  \ 5-2 所示的四个测试用例运行程序。程序包含了五个逻辑错误。然而，如果仅用这四个测试用例运行，没有任何错误会被揭示。测试数据设计不足以捕捉它们。测试 1、2\
  \ 和 3 实际上是同一个测试的三个版本。它们仅仅是检查程序是否能够计算出一个没有小数位的单个学生的正确平均分。最后一个测试检查程序是否能捕捉单个过小或过大的无效值，但没有检查当为输入输入第二个无效值时会发生什么。表\
  \ 5-3 包含了一组更好的测试，并说明了你在测试程序时应该检查的内容类型。这些测试将揭示程序所有的错误。\n\n## 表 5-2 程序 5-21 的初步测试计划\n\
