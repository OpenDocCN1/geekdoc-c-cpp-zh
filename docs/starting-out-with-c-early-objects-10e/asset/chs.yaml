  \ (_)。\n\n\n\n\n\n* 在第一个字符之后，你可以使用字母 `a` 到 `z` 或 `A` 到 `Z`、数字 `0` 到 `9` 或下划线。\n\
  * 大写字母和小写字母是有区分的。这意味着 `ItemsOrdered` 与 `itemsordered` 不相同。\n\n表 2-5 列出了变量名，并指示它们在\
  \ C++ 中是否合法或非法。\n\n## 表 2-5 一 C++ 变量名\n\n| 变量名 | 合法或非法 |\n| --- | --- |\n| `dayOfWeek`\
  \ | 合法。 |\n| `3dGraph` | 非法。变量名不能以数字开头。 |\n| `_employee_num` | 合法。 |\n| `June1997`\
  \ | 合法。 |\n| `Mixture#3` | 非法。变量名只能使用字母、数字和下划线。 |\n\n## 2.7 整数数据类型\n\n### 概念\n\n\
  有许多类型的数据。变量根据其数据类型进行分类，数据类型决定了可以在其中存储的信息类型。整数变量只能存储整数。\n\n计算机程序从现实世界收集数据并以各种方式对其进行处理。有许多类型的数据。例如，在数值信息领域，有整数和小数。有负数和正数。此外还有文本信息。例如，名称和地址被存储为字符串，而字符串由字符组成。当你编写程序时，必须确定它可能会遇到什么类型的信息。\n\
  \n如果你正在编写一个计算到遥远恒星的里数的程序，你需要能够存储非常大数字的变量。如果你正在设计用于记录微观尺寸的软件，你需要存储非常小且精确的数字。此外，如果你正在编写一个必须执行数千次密集计算的程序，你希望存储在可以快速处理的变量中。变量的数据类型决定了所有这些因素。\n\
  \n尽管 C++ 提供了许多数据类型，但从最广义上来说，只有两种：数值和字符。数值数据类型进一步分为两类：整数和浮点数，如图 2-3 所示。\n\n# 图 2-3\
  \  C++ 数据类型\n\n![一个树形图说明了基础数据类型。](img/FG_02_003) 图 2-3 完整文本\n\n整数是像 -2、19 这样的整数。浮点数具有像\
  \ -2.3、19.0 和 0.24 这样的小数。此外，整数和浮点数据类型进一步细分为选择变量选择最佳数据类型的主要考虑因素：\n\n* 变量需要存储整数还是浮点值，\n\
  * 变量能够存储的最大和最小数字，\n* 变量需要带符号（正负均）还是无符号（仅正）的数字，以及\n* 变量存储的值所需的小位数。\n\n让我们从整数数据类型开始看。C++\
  \ 有八种不同的整数数据类型。它们的区别在于存储数据的字节数以及可以存储的数值范围。数据类型可以存储的字节数被称为 `size`。通常，数据类型的 size 越大，它可以存储的数值范围就越大。\n\
  \n### 注意\n\n回想第 1 章，一个字节由 8 位组成。因此，在 2 字节内存中存储的数据类型可以存储 16 位信息。这意味着它可以存储 $2^{16}$\
  \ 不同的位模式，即 65536 种不同的零和一组合。使用 4 字节内存的数据类型有 32 位，因此它可以存储 $2^{32}$ 不同的位模式，即 4294967296\
  \ 种组合。这些不同的组合取决于数据类型。例如，`unsigned short` 类型用于存储年龄或重量等非负整数，它使用 16 位来表示 0 到 65535\
  \ 的值。相比之下，`short` 类型存储正负数，因此它使用 16 位来表示从 -32768 到 +32767 的值。\n\n（注：原文后半部分包含大量的重复/乱码段，已根据标准\
  \ C++ 文档进行清理。）\n\n## 表 2-6 整数类型\n\n| 数据类型 | 典型大小 | 典型范围 |\n| --- | --- | --- |\n\
  | `short` | 2 字节 | -32768 到 +32767 |\n| `unsigned short` | 2 字节 | 0 到 +65535 |\n\
  | `int` | 4 字节 | -2147483648 到 +2147483647 |\n| `unsigned int` | 4 字节 | 0 到 4294967295\
  \ |\n| `long` | 4 字节 | -2147483648 到 +2147483647 |\n| `unsigned long` | 4 字节 | 0\
  \ 到 4294967295 |\n| `long long` | 8 字节 | -9223372036854775808 到 +9223372036854775807\
  \ |\n| `unsigned long long` | 8 字节 | 0 到 18446744073709551615 |\n\n## 表 2-7 示例整数定义\n\
