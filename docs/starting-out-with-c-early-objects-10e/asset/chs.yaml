  \n## 2.17 注释\n\n### 概念\n\n许多程序员结合使用单行注释和多行注释，如上一个示例程序所示。便利性通常决定了使用哪种风格。\n\n当使用多行注释时：\n\
  \n*   小心不要将起始符号与结束符号反反。\n\n*   确保不要忘记结束符号。\n\n这两个错误都可能很难追踪，并且会阻止程序正确编译。\n\n### 单行注释\n\
  \n你已经看到过在 C++ 中放置注释的一种方法。正如本章中各个程序所示，你只需要在想开始注释的地方放置两个斜杠（`//`）即可。编译器会忽略从该点到行末尾的所有内容。这被称为\
  \ `single line comment`（单行注释）。\n\n### 多行注释\n\nC++ 中的第二种注释是 `multi-line comment`（多行注释）。多行注释以\
  \ `/*`（正斜杠后跟星号）开始，以 `*/`（星号后跟正斜杠）结束。这些标记之间的所有内容都会被忽略。程序 2-22 展示了多行注释和单行注释的使用。多行注释从第\
  \ 1 行的 `/*` 开始，在第 6 行的 `*/` 结束。\n\n注意，与以 `//` 开始的注释不同，多行注释可以跨多行。这使得编写大块注释变得更加方便，因为你不需要标记每一行。另一方面，多行注释对于编写单行注释来说很不方便，因为你必须输入起始和结束注释符号。\n\
  \n### 注意\n\n注释除了可以说明程序的功能和描述变量的用途，还可以用于解释复杂的过程，并提供如谁编写了程序以及何时进行修改等信息。\n\n\n\n\n\
  编程风格是指程序员使用标识符、空格、制表符、空行和标点字符在视觉上安排程序源代码的方式。这些是编程风格的一些元素，但不是全部。\n\n在第 1 章中，你学习了语法规则规定了语言的使用方式。`C++`\
  \ 的语法规则规定了如何以及在何处放置关键字、分号、逗号、括号以及语言的其他组件。编译器的工作是检查语法错误，如果没有错误，则生成目标代码。\n\n当编译器读取程序时，它将其视为一个长的字符流进行处理。编译器不受每个语句是否单独成一行，也不受是否用空格分隔运算符和操作数的影响。相反，人类很难阅读那些编写得不美观的程序。例如，考虑程序\
  \ 2-23。\n\n尽管该程序在语法上是正确的（它没有违反 `C++` 的任何规则），但它很难阅读。同一个程序在程序 2-24 中显示，使用了更清晰的风格编写。\n\
  \n编程风格是指源代码的视觉安排方式。理想情况下，它是一种在程序中放置空格和缩进的一致方法，从而创建视觉提示。这些提示可以快速告诉程序员关于程序的重要信息。\n\
  \n例如，注意程序 2-24 中 `main` 函数的左括号和右括号是对齐的，并且括号内部每行都缩进了。在一组括号内对所有行进行缩进是 `C++` 的风格。你还会注意到变量定义和\
  \ `cout` 语句之间的空行。这是为了在视觉上将定义与可执行语句分开。\n\n### 注意\n\n尽管你可以自由地开发自己的风格，但你应该遵循常见的编程实践。通过这样做，你编写的程序在其他程序员看来视觉上是合理的，并且尽可能减少错误的可能性。\n\
  \n编程风格的另一个方面是如何处理过长而无法放在一行的语句。由于 `C++` 是一门灵活的语言，通常可以将一个语句跨越几行。例如，这里有一个使用了两行的 `cout`\
  \ 语句：\n\n```\n cout << \"The Fahrenheit temperature is \" << fahrenheit\n     <<\
  \ \" and the Celsius temperature is \" << celsius << endl;\n```\n\n该语句的作用与在同一行输入完全相同。你已经见过类似的变量定义处理：\n\
  \n```\n int fahrenheit,\n    celsius,\n    kelvin;\n```\n\n与编程风格相关的其他问题将贯穿全书。\n\n\
