  \n# Artistic Solutions 油漆作业估算器 (Artistic Solutions Paint Job Estimator)\n\nArtistic\
  \ Solutions 油漆公司确定，每 160 平英尺的墙面需要一桶漆和三小时的人工。公司每小时收取 28 美元人工。设计一个模块化程序，允许用户输入要漆的房间数量、每个房间的大致墙面积（房间之间可能不同）以及每桶漆的价格。它应该创建一个带有华丽公司头的报告，并显示以下信息：\n\
  \n\n\n\n\n- 所需油漆的量（向上取入到下一个整数加仑）\n- 所需的工时\n- 油漆成本\n- 人工费用\n- 涂漆作业的总费用\n\n## 编程挑战\n\
  \n## 1. 加成 (Markup)\n\n编写一个程序，要求用户输入商品的批发价和加成率。然后程序应显示该商品的零售价。例如：\n\n- 如果一件商品的批发价为\
  \ $5.00，加成比例为 100%，则该商品的零售价为 $10.00。\n- 如果一件商品的批发价为 $5.00，加成比例为 50%，则该商品的零售价为 $7.50。\n\
  \n该程序应有一个名为 `calculateRetail` 的函数，该函数接收批发价和加成率作为参数，并返回商品的零售价。\n\n## 2. 摄氏度温度表\n\n\
  将华氏度转换为摄氏度的公式为：\n\n$$C = \\frac{5}{9}\\left( {F - 32} \\right)$$\n\n其中 `F` 是华氏度温度，`C`\
  \ 是摄氏度温度。编写一个名为 `celsius` 的函数，接受华氏度温度作为参数并返回转换后的摄氏度。通过在循环中调用该函数来演示它，显示一个从 0 到 100\
  \ 每隔 5 度的华氏度温度及其对应的摄氏度表格。\n\n## 3. 下落距离\n\n可以使用以下公式确定物体在特定时间内由于重力作用下落的距离：\n\n$$d\
  \ = \\frac{1}{2}gt^{2}$$\n\n公式中的变量如下：\n\n- `d` 是以米为单位的距离，\n- `g` 是 9.8，\n- `t` 是物体下落的时间（秒）。\n\
  \n编写一个名为 `fallingDistance` 的函数，接受对象的下落时间（秒）作为参数。该函数应返回物体在该时间段内下落的距离（米）。编写一个程序来演示该函数，通过在循环调用它，将值\
  \ 1 到 10 作为参数传递并显示返回值。\n\n## 4. 动能\n\n在物理学中，运动中的物体被认为具有动能。可以使用以下公式确定运动物体的动能：\n\n\
  $$KE = \\frac{1}{2}mv^{2}$$\n\n公式中的变量如下：\n\n- `KE` 是以焦耳为单位的动能，\n- `m` 是以千克为单位的物体质量，\n\
  - `v` 是以米/秒为单位的物体速度。\n\n编写一个名为 `kineticEnergy` 的函数，接受对象的质量（千克）和速度（米/秒）作为参数。该函数应返回物体拥有的动能量。通过在程序中调用该函数来演示它，程序要求用户输入质量和速度的值。\n\
  \n## 5. 冠军分部门\n\n编写一个程序，确定公司的四个分部门（东北部、南部、西北部和西南）中哪一个在一个季度的销售额最高。它应该包含以下两个函数，这两个函数由\
  \ `main` 调用：\n\n- `double getSales()` 接收分部门名称。它要求用户输入分部门的季度销售额，验证输入是否小于 0，然后返回。每个分部门应被调用一次。\n\
  - `void findHighest()` 接收四个销售总额。它确定哪一个是最大的，并打印销售额最高的分部门名称及其销售数字。\n\n## 6. 运费\n\n\
  快速货运公司收取以下费率：\n\n| 包裹重量（公斤） | 每 500 英里的运费率 |\n| --- | --- |\n| 2 kg 或更少 | $3.10\
  \ |\n| 超过 2 kg 但不超过 6 kg | $4.20 |\n| 超过 6 kg 但不超过 10 kg | $5.30 |\n| 超过 10 kg |\
  \ $6.40 |\n\n不是 500 的倍数的英里按下一个更高的费率收取。例如，520 英里将按 1000 英里收费。\n\n编写一个程序，询问包裹重量和运输距离。这两个数据项应作为参数传递给\
  \ `calculateCharge` 函数，该函数计算并返回要计算的运费。`main` 函数应循环处理多个包裹，直到录入重量为 0 为止。\n\n## 7.\
  \ 最省油汽车\n\n三辆汽车行驶一段 500 英里的路线。编写一个程序，输入每辆汽车的品牌和所使用的燃料加仑数。在为每辆汽车调用一次 `calcMPG()`\
  \ 函数后，让 `main` 确定并显示哪辆汽车最省油以及它的每加仑英里数。`calcMPG()` 函数接受行驶距离和使用的汽加仑数为参数，并返回得到的每加仑英里。\n\
  \n## 8. 字符串比较\n\n你知道 `==` 运算符可以用于测试两个 `string` 对象是否相等。然而，你可能记得，即使它们包含完全相同的字母，如果任何字母的大小写不同，它们也不会被认为是相等的。因此，例如如果\
  \ `name1 = \"Jack\"` 且 `name2 = \"JACK\"`，它们不被认为是相同的。编写一个程序，要求用户输入两个名称并将它们存储在 `string`\
  \ 对象中。然后程序应报告在忽略大小写的情况下，它们是否相同。\n\n为了帮助程序完成任务，除了 `main` 之外，它应该使用两个函数：`upperCase()`\
  \ 和 `sameString()`。\n\n```\nstring upperCase(string s)\nbool sameString(string s1,\
  \ string s2)\n```\n\n`sameString` 函数接收要比较的两个字符串，并需要调用 `upperCase`。`upperCase` 函数应使用循环，以便对字符串中的每个字符调用\
  \ `toupper` 函数，然后返回结果。\n\n## 9. 移除最低分\n\n- 编写一个程序计算一组分数的平均分，其中最低分会被剔除。\n- `void\
  \ getScore()` 要求用户输入一个分数，将其存储在引用变量中，并验证其不低于 0 或高于 100。该函数应由 `main` 调用五次，对应五个分数。\n\
  - `void calcAverage()` 应计算并显示四个最高分的平均分。该函数应由 `main` 调用一次。\n- `int findLowest()`\
  \ 应找到并返回传递的五个分数中的最小值。它应被 `calcAverage` 调用，后者用它决定删除五个分数中的一个。\n\n## 10. 星星搜索\n\n某特定的才艺比赛有五位评委，每位评委都会为每个表演者给出\
  \ 0 到 10 之间的分数。允许分数分数（例如 8.3）。表演者的最终得分通过去掉最高和最低分，然后对剩余三个分数取平均来确定。编写一个使用这些规则计算并显示参赛得分的程序。它应该包含以下函数：\n\
  \n- `double getJudgeData()` 要求用户输入评委的分数，进行验证，然后返回。该函数应由 `main` 调用五次，对应五位评委。\n- `double\
  \ calcScore()` 应计算并返回去掉最高和最低分后剩余三个分数的平均分。该函数应由 `main` 调用一次，并传递五个分数。\n\n两个额外的函数（描述所示）应被\
  \ `calcScore` 调用，后者使用返回的信息来确定去掉哪些分数：\n\n- `int findLowest()` 应找到并返回传递的五个分数中的最低分。\n\
  - `int findHighest()` 应找到并返回传递的五个分数中的最高分。\n\n\n\n\n\n质数是一个大于 1 且只能能被 1 和它本身整除的整数。例如，数字\
  \ 5 是质数，因为它只能被 1 和 5 整除。然而，数字 6 不是质数，因为它可以被 1、2、3 和 6 整除。\n\n编写一个名为`isPrime`的`Boolean`（布尔）函数，它接受一个整数作为参数，如果该参数是质数则返回`true`，否则返回`false`。在一个完整的程序中演示该函数。\n\
  \n## 提示\n\n记住%` 运算符将一个数除以另一个数并返回余数。在诸如 `num1 % num2` 的表达式中，如果`num1`能被`num2`整除，则\
  \ `%` 运算符将返回 0。\n\n## 12. 现值\n\n假设你想向储蓄账户存入一笔资金，然后让其放置 10 年以赚利息。在 10 年后（120 个月后），你希望账户里有$10,000。为了实现这一目标，你现在需要存入多少钱？你可以使用以下公式，即现值公式：\n\
  \n$$P = \\frac{F}{\\left( {1 + i} \\right)^{t}}$$\n\n公式中的项如下：\n\n*   `P` 是**现值**，即你今天需要存入的金额。\n\
  *   `F` 是你希望在账户中的**未来值**（在本例中为$10,000）。\n*   `i` 是**月利率**（以小数形式表示，例如 .0025）。这等同于用户输入的年利率的\
  \ 1/12。\n*   `t` 是你计划让资金留在账户中的**月数**。这将是用户输入的年数的 12 倍。\n\n编写一个带有名为`presentValue`函数的程序来执行此计算。用户应输入未来值、年利率以及资金增长的年数。程序在将这些值连同未来值传递给`presentValue`函数之前，应将年利率转换为月利率，并将年数转换为月数。\n\
  \n该函数应接受这三个参数，并使用它们计算并返回现值，即你今天需要存入的金额。在一个程序中演示该函数，让用户尝试不同的输入值。\n\n## 13. 未来值\n\n\
  假设你在储蓄账户中有一笔钱，按月产生复利，你想计算在特定月数后你将拥有的金额。该公式被称为未来值公式，如下：\n\n`F` = `P` × (1 + `i`)^(`t*)\n\
  \n公式中的变量如下：\n\n*   `F` 是指定时间段后账户的**未来值**。\n*   `P` 是账户的**现值**。\n*   `i` 是**月利率**。\n\
  *   `t` 是**月数**。\n\n编写一个程序，提示用户输入账户的现值、月利率以及资金留在账户的月数。程序应将这些值传递给名为`futureValue`的函数，该函数计算并返回指定月数后账户的未来值。程序应显示账户的未来值。\n\
  \n## 14. 股票利润\n\n出售股票的利润可以按如下计算：\n\n利润 = (`NS` × `SP`*) − `SC`*) − (`NS` × `PP`*) + `PC`*)\n\
  \n*   其中 `NS` 是股份数，\n*   `SP`* 是每股售价，\n*   `SC` 是已支付的销售佣金，\n*   `PP`* 是每股买入价，\n\
  *   以及 `PC` 是支付的购买佣金。\n\n如果计算结果为正值，则出售股票产生了利润。如果计算结果为负数，则出售导致了亏损。\n\n编写一个函数，接受股份数、每股买入价、支付的购买佣金、每股售价以及支付的销售佣金作为参数。该函数应返回出售股票的利润（或亏损）。在一个程序中演示该函数，要求用户输入所需的数据并显示利润或亏损金额。\n\
  \n## 15. 订单状态\n\nMiddletown 批发铜线公司每卷售价 100 美元，每卷收取 10 美元运费。编写一个显示订单状态的程序。它应该使用两个函数。第一个函数请求以下数据并将输入值存储在引用参数中：\n\
  \n*   订购的卷数。\n*   库存中的卷数。\n*   任何特殊的运输和手续费（高于标准的 10 美元费率）。\n\n第二个函数接收计算和显示以下信息所需的任何值作为参数：\n\
  \n*   从当前库存中准备好发货的订购卷数。\n*   缺货的订购卷数（如果订购数量大于库存）。\n*   待发货部分的总售价（卷数乘以 100）。\n* \
  \  待发货部分的运输手续费。\n\n第二个函数的运输手续费参数默认为 10。\n\n## 16. 重载医院\n\n编写一个程序，计算并显示患者的的费用。首先，程序询问患者是住院还是门诊。如果是住院，应输入以下数据：\n\
  \n*   住院天数\n*   每日费率\n*   医疗费用（实验室检查等）\n*   药物费用\n\n如果是门诊，应输入以下数据：\n\n*   医疗费用（实验室检查等）\n\
  *   药物费用\n\n使用一个单一的独立函数来验证输入是否小于零。如果是，则应重新输入。\n\n一旦输入并验证了所需数据，程序应使用两个重载函数来计算总费用。一个函数应接受住院数据，另一个函数应接受门诊数据。两个函数都应返回总费用。\n\
  \n## 17. 使用文件——医院报告\n\n修改编程挑战 16 重载医院，将其创建的报告写入文件。将文件内容提交给老师。\n\n## 18. 人口\n\n在人口中，出生率是由于出生的人口增长百分比，死亡率是由于死亡的人口减少百分比。编写一个程序询问以下内容：\n\
  \n*   初始人口数量（最小 2）\n*   年出生率\n*   年死亡率\n*   显示的年数（最小 1）\n\n程序随后应显示初始人口以及每年的预测人口。它应使用一个函数计算并返回一年后的预测新规模。公式为\n\
  \n*N* = *P*(1 + *B*)(1 − *D*)\n\n其中\n\n*   `N` 是新人口规模，\n*   `P` 是前一个人口规模，\n*   `B`\
  \ 是出生率，\n*   `D` 是死亡率。\n\n年出生率和死亡率是每 1000 人每年典型的出生和死亡人数，以小数形式表示。例如，如果某个人口每 1000\
  \ 人中通常有 32 人出生和 26 人死亡，则出生率为.032，死亡率为.026。\n\n## 19. 瞬态人口\n\n\n\n\n修改编程挑战 17，使其也考虑人口迁入或迁出地理区域对人口的影响。输入初始人口规模、年出生率、年死亡率、每年迁入该地区的人数以及每年离开该地区的人数，程序应预测\
  \ `numYears` 年后的人口数。你可以提示用户输入 `numYears` 的值，也可以在程序中设置它。\n\n# 20. 差旅费用小组项目\n\n本程序应由一个学生小组负责设计和编写。\n\
  \n从分析程序需求开始。决定需要哪些函数以及每个函数必须完成的任务。分配工作，使每位学生的工作量大致相等。例如，一个学生可以设计主函数，而其他学生设计主函数将调用的独立函数。然后，在开始编写任何代码之前，确定函数名称、参数和返回类型，以便所有已完成的模块在组合成最终程序时能够正常协作。\n\
  \n以下是作业内容。编写一个程序，计算并显示公司员工出差的总差旅费用。程序应包含函数，用于询问并返回以下内容：\n\n* 旅行日期\n* 旅期间离开家人的总晚数\n\
  * 往返机票的金额\n* 租车费用\n* 如果使用私家车，则行驶里程数。车辆补贴为每英里 $0.58。\n* 停车费\n* 出租费\n* 会议或研讨会注册费\n\
  * 酒店费用。公司允许每晚住宿费用最高为 $120。\n* 餐费费用\n\n程序应执行任何必要的计算，例如计算里程报销和允许的酒店报销。然后，它应该创建一个格式良好的费用报告，其中包含每个类别的支出金额以及整个旅行的总支出。此报告应写入文件。\n\
  \n# 第 7 章 类和对象引论\n\n### 注意\n\n如果老师希望在介绍类和对象之前介绍数组，可以在第 8 章之后讲解本章。\n\n# 7.1 抽象数据类型\n\
  \n### 概念\n\n抽象数据类型 (ADT) 是一种数据类型，它指定了该数据类型可以包含的值以及可以对它们执行的操作，而不涉及该数据类型如何实现的细节。\n\
  \n# 抽象\n\n*抽象* (abstraction) 是某事物的通用模型。它是一种定义，仅包含对象的通用特征，而不包含描述对象特定实例的细节。\n\n汽车提供了抽象的说明。大多数人理解汽车是什么，许多人知道如何开车。然而，很少有人能完全理解汽车是如何工作的，或者它所有的零件是什么。这就是抽象的特性。对象的内部组件、结构和操作的细节与它能做什么以及如何操作它的描述隔离开。在日常生活中，我们被此类抽象示例所包围，从微波炉、洗衣机到\
  \ DVD 播放器和电脑。我们知道它们的作用，但并不知道它们是如何工作的。\n\n# 抽象在软件开发中的应用\n\n抽象也出现在编程中。为了使用软件，程序员需要知道对象能做什么，而不是它们是如何工作的。例如，要使用\
  \ `cin` 和 `cout`，你只需要知道它们的接口。要使用 `sqrt` 或 `pow`，你只需要知道它们的名称及其返回的结果。\n\n抽象也适用于数据。要使用任何数据类型，你需要了解关于它的两点：它能包含什么值以及哪些操作适用于它。例如，要使用\
  \ `double`，你只需要知道它可以包含数值（如 `5.0` 或 `-5.1`），而不包含字符串。你不需要知道它是如何在内存中存储的，或者对其执行的算术操作是如何完成的。将数据类型的逻辑属性与其实现分离的方法被称为数据抽象。\n\
  \n# 抽象数据类型\n\n*抽象数据类型* (ADT) 一术语描述任何其实现细节与使用它所需的属性保持分离的数据类型。但通常情况下，该术语指的是程序员创建的数据类型。通常这些数据类型可以包含多个值，就像类一样（你将在本章中学习到类）。程序员定义了数据类型可以包含的值集，定义了一组可以在数据上执行的操作，并创建了一组函数来执行这些操作。在\
  \ C++和其他面向对象的语言中，程序员创建的 ADT 通常通过类来实现。\n\n# 7.2 面向对象编程\n\n### 概念\n\n面向对象编程以对象为中心，封装了数据以及操作这些数据的功能。\n\
  \n在实践中，今天有两种常见的编程方法：过程化编程和面向对象编程 (OOP)。在本章之前，你已经学习了如何编写过程化程序。\n\n过程化编程是一种以执行程序动作的过程（或函数）为中心的软件编写方法。程序的数据（通常存储在变量中）与这些过程是分离的。因此，你必须将变量传递给需要处理变量的函数。相反，面向对象编程是以对象为中心的。\n\
  \n\n\n\n这个问题推动了从过程化编程向面向对象编程的转变。面向对象编程（OOP）以创建和使用对象为中心。`object`是一个软件实体，它将数据与处理这些数据的过程结合在一个单元中。对象的数据项也称为其`attributes`（属性），存储在`member\
  \ variables`（成员变量）中。对象执行的过程被称为其`member functions`（成员函数）。这种将对象的数据和过程封装在一起的操作被称为`encapsulation`（封装）。\n\
  \n### Note\n\n在某些面向对象的编程语言中，对象执行的过程被称为`methods`（方法）。\n\n图 7-1 展示了一个`Circle` 对象可能的外观。它仅有一个成员变量来存储数据，以及两个成员函数。`Circle`对象的成员变量是`radius`。它的`setRadius`成员函数用于设置半径，而它的`calcArea`成员函数用于计算并返回面积。\n\
  \n## 图 7-1 类包含数据和函数\n\n![类解释了 Circle 对象。](img/FG_07_001.png)图 7-1 类包含数据和函数 完整替代文本\n\
  \n成员变量和成员函数都是`Circle`对象的成员，绑定在同一个单元中。当需要执行某个操作时（例如计算圆的面积），会向该对象发送一条消息，告诉它执行`calcArea`函数。由于`calcArea`是`Circle`对象的成员，它自动拥有访问对象成员变量权限。因此，不需要将`radius`传递给`calcArea`函数。\n\
  \n除了将相关数据和函数封装在一起外，对象还允许数据隐藏。`data hiding`（数据隐藏）指的是对象向其外部代码隐藏其数据的能力。只有对象的成员函数才能直接访问并修改其数据。对象通常会隐藏其数据，但允许外部代码通过其某些成员函数来访问数据。正如图\
  \ 7-2 所示，对象的成员函数为对象外部的程序语句提供间接访问对象数据的方法。\n\n## 图 7-2 只有对象的成员函数可以访问对象的数据\n\n![图表说明了函数访问对象数据的方式。](img/FG_07_002.png)图\
  \ 7-2 只有对象的成员函数可以访问对象的数据 完整替代文本\n\n为什么隐藏信息是一件好事？当对象的内部数据对外部代码隐藏，且该数据只能通过通过对象的成员函数来访问时，数据就免受了意外或故意的损坏。此外，对象外部的程序代码不需要了解对象数据的格式或内部结构。代码只需要与对象的函数进行交互。当程序员更改对象内部数据的结构时，对象的成员函数也会随之修改，以便它们仍然能够正常操作该数据。然而，这些更改对对象外部的代码是隐藏的。那些代码不需要更改。它们可以像以前完全一样调用和使用这些成员函数。\n\
  \n早些我们用汽车作为抽象对象的示例，可以在不了解其工作原理细节的情况下使用它。它有一个非常简单的接口，由点火开关、方向盘、油门、刹车踏板和挡位选择器组成。（带有手动变速器的车辆还提供离合踏板）。如果你想驾驶汽车，只需要学会操作这些接口元素即可。要启动电机，只需转动点火开关中的钥匙。内部发生了什么对驾驶员来说是无关。如果你想让汽车左转，就向左旋转方向盘。连接方向盘和前轮的所有连杆运动都在你察觉的情况下发生。如果制造商重新设计车辆以不同的方式执行某些幕后操作，驾驶员也不需要学习新的接口。\n\
  \n由于汽车具有简单的用户界面，没有机械知识的人也可以驾驶。这对于汽车制造商来说是好的，因为这意味着可能有更多人成为客户。这对于汽车用户来说也是好的，因为他们只需要学习几个简单的程序就可以操作几乎任何车辆。\n\
  \n这些在软件开发中同样是有效考虑的问题。一个程序很少由一个人编写。即使是你目前为止创建的小型程序也不是完全由你编写的。如果你整合了 C++ 库函数，或者像`cin`和`cout`这样的对象，你就使用了他人编写的代码。在专业软件开发领域，程序员通常以团队形式工作，买卖代码并在项目上协作。通过\
  \ OOP，程序员可以创建在“引擎盖下”隐藏着强大引擎的对象，但通过简单的接口来保护对象的算法和数据。\n\n## 7.3 类类\n\n### 概念\n\n在\
  \ C++ 中，类（class）是用于创建对象的结构。\n\n在我们创建和使用对象之前，必须描述它将拥有的变量和函数。这是通过定义类来实现的。`class`是一种由程序员定义的类型，描述了对象创建时的样子。\n\
  \n### 使用已熟悉的类\n\n从本书开始，你一直在使用`string` 类来创建和使用`string` 对象。记住，在任何使用`string` 类的程序中包含以下\
  \ `#include` 指令：\n\n```cpp\n#include <string>\n```\n\n这是必要的，因为`string`头文件是定义`string`\
  \ 类的地方。在程序包含该头文件后，你现在可以定义任意数量的`string` 对象。这样做只需指定类名，后面跟着你想要给对象起的名字。示例如下：\n\n```cpp\n\
  string city,\n       state;\n```\n\n该语句创建了两个`string`对象。一个名为`city`，另一个名为`state`。它们都是`string`类的实例，尽管它们可以被赋予不同的值，但这两个对象本质上是相同的。也就是说，它们都拥有一个可以存储字符串的成员变量，并且拥有相同的可以操作字符串的函数。\n\
  \n一旦创建了`string`对象，你就可以在其中存储数据。由于`string`类设计用于配合运算符，你可以将字符串字面量赋值给`string`对象。示例如下：\n\
  \n```cpp\ncity  = \"Chicago\";\nstate = \"Illinois\";\n```\n\n这些语句将\"Chicago\"存储在`city`对象的成员变量中，将\"\
  Illinois\"存储在`state`对象的成员变量中。\n\n`string`类包含了许多对`string`对象持有的数据执行操作的成员函数。在之前的章节中已经接触了其中几个。其中一个名为`length`的成员函数，它返回`string`对象存储的字符串的长度。以下代码演示了这一点：\n\
  \n```cpp\ncout << city.length()   << endl;   // 输出为 7\ncout << state.length()  <<\
  \ endl;   // 输出为 8\n```\n\n\n\n\n\n需要注意的是，为了创建和使用 `string` 对象，我们不需要了解任何关于 `string`\
  \ 类实现的细节。只需要知道它可以存储什么类型的数据，以及我们可以调用哪些函数来操作这些数据。\n\n# 创建你自己的类\n\n要创建你自己的类，你必须编写一个类声明。这里是类声明的通用格式。\n\
  \n```\nclass ClassName        // 类声明以关键字 class \n{                      // 和一个名称开始。\n\
  \n   类成员变量的声明\n   和成员函数的声明写在这里。\n\n};                     // 注意末尾必须的分号。\n```\n\n\
  我们将通过逐步构建一个类来学习如何实现类。我们的示例将是图 7-1 中所示的简单 `Circle` 类。第一步是确定类应该拥有哪些成员变量和成员函数。在这种情况下，正如已经描述的那样，我们已经确定该类需要一个用于存储圆形半径的成员变量以及两个成员函数：`setRadius`\
  \ 和 `calcArea`。\n\n### 注意\n\n这些信息与其他设计信息一起，有时使用视觉建模工具来表达，这些工具是面向对象建模“语言”的一部分，被称为统一建模语言，或\
  \ UML。图 7-1 展示了一种常用的 UML 图表类型，称为`类图`。你将在本章的稍后部分看到更多此类示例。\n\n一旦设计好类，下一步就是编写类声明。这告诉编译器该类包含哪些内容。这里是我们的\
  \ `Circle` 类的声明。注意类名以大写字母开头。虽然这不是强制要求的，但习惯上总是用大写字母开头类名。\n\n```\nclass Circle\n{\
  \  private:\n       double radius;\n\n   public:\n      void setRadius(double r)\n\
  \      {   radius = r; }\n\n      double calcArea()\n      {   return 3.14 * pow(radius,\
  \ 2);  }\n};\n```\n\n# 访问修饰符\n\n类声明看起来非常像图 7-1，只是添加了每个成员函数的实际代码以及两个关键字：`private`\
  \ 和 `public`。这些被称为`访问修饰符`，因为它们指定了谁可以访问类的各种成员。注意每个访问修饰符后面都有一个冒号。公共成员变量可以由类外的函数访问，公共成员函数可以由类外的函数调用。相反，私有成员变量只能由同一类的成员函数访问，私有成员函数只能由该类的其他成员函数调用。如果我们完全省略了\
  \ `public` 和 `private` 词，所有内容将默认变为私有。这不会很有用，因为那样在特殊情况下，类外的任何函数都永远无法使用该类。\n\n在我们的\
  \ `Circle` 类中，成员变量 `radius` 被声明为私有，而成员函数被声明为公共。这是很常见的。成员数据通常被设为私有以保护安全。然后创建公共函数以允许从类外部对这些数据进行经过仔细控制的访问。目前，我们所有的类成员变量将声明为私有，所有的成员函数将声明为公共。稍后你将看到使用私有成员函数的情况。\n\
  \n### 注意\n\n如果类外的程序语句尝试访问私有成员，将导致编译器错误。稍后你将学习如何给外部函数赋予特殊权限来访问私有类成员。\n\n# `private`\
  \ 和 `public` 成员的位置\n\n先列出私有成员还是公共成员并不重要。事实上，甚至不需要将所有具有相同访问规范的成员都声明在一起。下面的两个示例都是\
  \ `Circle` 类的合法声明。\n\n```\nclass Circle                           class Circle\n\
  {  public:                              {  public:\n     void setRadius(double r)\
  \               void setRadius(double r)\n     { radius = r; }                 \
  \       { radius = r; }\n\n     double calcArea ()                     private:\n\
  \     { return 3.14 * pow(radius, 2); }       double radius;\n\n   private:    \
  \                            public:\n     double radius;                      \
  \   double calcArea ()\n};                                          { return 3.14\
  \ * pow\n                                              (radius, 2); }\n        \
  \                                  };\n```\n\n大多数程序员认为将私有成员和公共成员分开更有条理，大多数老师也倾向于让你这样做。在本文中我们遵循标准做法，即先列出所有私有成员，然后列出公共成员，如初始的\
  \ `Circle` 声明所示。\n\n# 7.4 创建和使用对象\n\n### 概念\n\n对象是类的实例。它们在类声明后通过简单语句创建。类声明的作用类似，它描述了从类创建的对象将是什么样的。从类创建的每个对象被称为该类的`instance`（实例），定义类对象被称为`实例化`（实例化）。\n\
  \n你定义的类对象是通过简单的定义语句创建的，就像头文件中定义的类和变量一样。例如，以下语句将 `circle1` 和 `circle2` 定义为 `Circle`\
  \ 类的对象：\n\n```\nCircle circle1,\n       circle2;\n```\n\n它们是 `Circle` 类的两个实例，拥有不同的内存来存储其成员变量中的值。\n\
  \n# 访问对象的成员\n\n类的公共成员通过点操作符访问。你在上一节中看到过这一点，当我们使用以下语句为 `string` 对象 `city` 调用 `length`\
  \ 函数时：\n\n```\ncout << city.length() << endl;\n```\n\n以下语句调用了 `circle1` 和 `circle2`\
  \ 的 `setRadius` 函数。\n\n```\ncircle1.setRadius(1.0);     // 这将 circle1 的半径设置为 1.0\n\
  circle2.setRadius(2.5);     // 这将 circle2 的半径设置为 2.5\n```\n\n注意，成员函数和普通函数一样，如果被定义为接受参数，在调用时可以传递参数。我们定义\
  \ `setRadius` 一个 `double` 参数。\n\n正如之前提到的，对象的成员变量通常被声明为私有。然而，如果一个被声明为公共，则也可以通过点操作符从类外部访问。如果\
  \ `circle` 类 `radius` 变量是公共的，我们可以这样设置它：\n\n```\ncircle1.radius = 1.0;\ncircle2.radius\
  \ = 2.5;\n```\n\n\n\n\n现在半径已经设置好了，我们可以调用 `calcArea` 成员函数来返回 `Circle` 对象的面积：\n\n\
  ```\ncout << \"The area of circle1 is \" << circle1.calcArea () << endl;\ncout <<\
  \ \"The area of circle2 is \" << circle2.calcArea () << endl;\n```\n\n程序 7-1 是一个完整的程序，演示了\
  \ `Circle` 类。注意，创建和使用 `Circle` 对象的语句位于 `main` 中，而不是类声明中。\n\n## 访问器与修改器（Accessors\
  \ and Mutators）\n\n注意程序 7-1 中的第 13 行和第 16 行，类成员函数 `setRadius` 和 `calcArea` 是使用成员变量\
  \ `radius` 的。它们不需要使用点运算符来引用它，因为类的成员函数可以像普通变量一样访问同一类的成员变量，而无需任何额外的符号。同样注意，类成员函数 `calcArea`\
  \ 只使用但没有修改成员变量 `radius`。这种使用类变量的值但不对其更改的函数被称为 `accessor`（访问器）。另一方面，`setRadius` 函数修改了\
  \ `radius` 的内容。这种在成员变量中存储值或更改其取值的成员函数被称为 `mutator`（修改器）。一些程序员将修改器称为 `set functions`（set\
  \ 函数）或 `setter functions`（set 设置函数），因为它们设置了类变量的值；并将访问器称为 `get functions`（get 函数）或\
  \ `getter functions`（get 访问器函数），因为它们仅仅是检索或使用该值。\n\n## 7.5 定义成员函数\n\n### 概念\n\n类成员函数可以在类声明内部定义，也可以在类声明外部定义。\n\
  \n类成员函数的定义方式与普通函数类似。除了我们稍后将看到的少数特殊情况外，它们都有一个函数头，其中包含一个返回类型（可能是 `void`）、一个函数名和一个参数列表（可能为空）。执行函数操作的语句包含在紧随函数头的一对括号中。\n\
  \n当我们在上一节中定义 `Circle` 类时，我们直接在类声明内部定义了它的两个成员函数。当类函数在类声明处被定义时，它被称为 `inline function`（内联函数）。内联函数提供了一种在类声明中包含函数信息的方便方法，但它们只能在函数体非常短（通常只有单行）时使用。当函数体较长时，我们在类声明中放置函数的原型，而不是函数定义本身。然后，我们将函数定义放在类声明外部，要么跟在类声明之后，要么放在单独的文件中。\n\
  \n尽管我们 `Circle` 类中的两个函数短到可以写成内联函数，但我们将它们重写为定义在类声明外部的普通函数，以说明如何操作。在类声明内部，这些函数将被替换为以下原型：\n\
  \n```\nvoid setRadius(double);\ndouble calcArea();\n```\n\n在类声明之后，我们将放置一个包含以下函数定义的\
  \ `function implementation`（函数实现）部分：\n\n```\nvoid Circle::setRadius(double r)\n\
  {   radius = r;\n}\n\ndouble Circle::calcArea()\n{   return 3.14 * pow(radius, 2);\n\
  }\n```\n\n注意，这些函数看起来像普通函数，区别在于类名和双冒号（`::`）位于函数返回类型之后、函数名之前。`::` 符号被称为 `scope resolution\
  \ operator`（作用域解析运算符）。它用于指示这些是类成员函数，并告诉编译器它们属于哪个类。\n\n### 警告！\n\n类名和作用域解析运算符是函数名的扩展。当函数在类声明外部定义时，这些符号必须存在，并且必须位于函数头函数名正之前。\n\
  \n以下是一些额外的示例，说明了在类声明外部定义类函数时如何使用作用域解析。\n\n```\ndouble calcArea()               //\
  \ 错误！缺少了类名和作用域\n                                // 解析运算符。\n\nCircle::double calcArea()\
  \       // 错误！类名和作用域\n                                // 解析运算符的位置不正确。\n\ndouble\
  \ Circle::calcArea()       // 正确！\n```\n\n程序 7-2 修改了程序 7-1，以便在类外部定义类成员函数。\n\n##\
  \ 类成员函数的命名规范\n\n程序 7-3 提供了另一个使用类和对象的示例。它声明并实现了一个 `Rectangle` 类，该类有两个成员变量和五个成员函数。注意程序\
  \ 7-3 中成员函数的名称以 `set` 或 `get` 开头。`setLength` 和 `setWidth` 是修改器（set 函数）。正如预期的那样，修改器以\
  \ `set` 加上它要设置的成员变量名命名。`setLength` 函数设置 `length` 成员变量的值，`setWidth` 函数设置 `width`\
  \ 成员变量的值。\n\n成员函数 `getLength` 和 `getWidth` 是访问器（get 函数）。访问器通常以 `get` 加上它要检索的成员变量名命名，如果它仅仅是返回存储在变量中的值。`getLength`\
  \ 返回存储在 `length` 成员变量中的值，而 `getWidth` 返回存储在 `width` 成员变量中的值。最后一个成员函数 `calcArea`\
  \ 是一个访问器函数，因为它使用但不更改存储在类变量中的任何值。\n\n我们之前提到过，设计类时，通常做法是将所有成员变量设为私有，并提供公共的 set 和 get\
  \ 函数来访问这些变量。这保护了数据。类外部函数只能通过调用公共函数访问成员数据，而这些函数可以编写为防止数据被损坏或以可能影响对象行为的方式进行修改。\n\n\
  ### 避免过期数据（Stale Data）\n\n在 `Rectangle` 类中，`getLength` 和 `getWidth` 成员函数返回存储在 `length`\
  \ 和 `width` 成员变量中的值，但 `calcArea` 成员函数返回计算结果。你可能会疑惑为什么矩形的面积不也存储在成员变量中。之所以不存储面积是因为它可能会变得过期。当一个项目的值依赖于其他数据，并且当其他数据发生变化时该项目没有相应更新，我们就说该项目已变成过期数据。如果矩形的面积存储在成员变量中，那么只要\
  \ `length` 或 `width` 成员变量发生任何变化，它的值就会变得不正确。\n\n\n\n在设计类时，通常不应该使用成员变量来存储可能变得过时的计算值。相反，应该提供一个成员函数，使用最新的数据来计算该值，然后返回计算结果。\n\
  \n## 关于内联函数的更多信息\n\n在设计类时，你需要决定将哪些成员函数在类声明中写为内联函数，将哪些函数定义在类之外。编译器处理内联函数的方式与处理普通函数完全不同。理解这种差异可能帮助你决定何时使用哪种方式。\n\
  \n每当调用普通函数时，幕后都会发生很多操作。许多特殊项目，例如函数执行完毕后返回的地址以及函数参数的值，必须存储在名为 `stack`（栈）的内存区域中。此外，还会创建局部变量，并预留一个位置来存放函数的返回值。所有为函数调用铺平道路的开销都会消耗\
  \ CPU 时间。虽然所需时间很短，但如果函数被调用多次（例如在循环中），开销就会累积。\n\n另一方面，内联函数完全不是在传统意义上被调用。相反，在一个名为\
  \ `inline expansion`（内联展开）的过程中，编译器会将对函数的每次替换为函数本身的实际代码。这意味着如果函数在程序的多个地方被调用，它的整个代码体将被插入多次，从而增加程序的大小。这就是为什么只有代码行非常少的函数才应该写成内联函数。事实上，如果函数体大到无法进行实际的内联展开，编译器将忽略这种方式处理函数的请求。然而，当成员函数较小时，将它写为内联函数可以提高性能，因为你不进行实际的函数调用时开销会更小。\n\
  \n## 检查点\n\n1. 7.1 下列哪项显示了成员函数定义中作用域解析运算符的正确用法？\n    1. `InvItem::void setOnHand(int\
  \ units)`\n    2. `void InvItem::setOnHand(int units)`\n\n2. 7.2 对象的私有成员变量可以通过以下方式从对象外部访问：\n\
  \    1. 公共成员函数\n    2. 任何函数\n    3. 点运算符\n    4. 作用域解析运算符\n\n3. 7.3 假设 `soap` 是\
  \ `Inventory` 类的一个实例，下列哪项是对 `setOnHand` 成员函数的有效调用？\n    1. `setOnHand(20);`\n  \
  \  2. `soap::setOnHand(20);`\n    3. `soap.setOnHand(20);`\n    4. `Inventory.setOnHand(20);`\n\
  \n4. 7.4 完成以下代码骨架以声明一个名为 `Date` 的类。该类应该包含成员变量和函数，用于存储和检索日期的月、日、年。\n```\nclass Date\n\
  {  private:\n   public:\n}\n```\n\n## 7.6 构造函数\n\n### 概念\n\n构造函数是在类对象创建时自动调用的成员函数。\n\
  \n`constructor` 是一个特殊的公共成员函数，在类对象创建时被自动调用以 `construct`（构造）该类对象。如果程序员没有写构造函数，C++\
  \ 会自动提供一个。你看不见它，但每当程序定义对象时，它都会在后台静默运行。然而，程序员在创建类时经常编写自己的构造函数。如果他们这样做，除了构造该类的每个新创建的对象外，它还会执行程序员在其中包含的任何代码。程序员通常使用构造函数来初始化对象的成员变量。然而，它可以执行普通函数可以做的任何事情。\n\
  \n## 注意事项\n\n有关如何在 UML 中表示构造函数的信息，可以在该书配套网站的 附录 F 中找到，网址为 [pearsonhighered.com/<wbr>gaddis](http://pearsonhighered.com/gaddis)。\n\
  \n构造函数看起来像普通函数，但它的名称必须与它所属类的名称相同。编译器借此知道特定的成员函数是构造函数。此外，构造函数不允许有返回值。\n\n程序 7-4 包含一个名为\
  \ `Demo` 的类，其构造函数除了打印消息外什么都不做。这样写是为了演示构造函数何时执行。由于 `Demo` 对象是在两个 `cout` 语句之间创建的，因此构造函数将在这两个语句产生的输出行之间打印它的消息。\n\
  \n在 程序 7-4 中，我们在类声明内部将构造函数定义为内联函数。然而，当成员函数较小时，将它写为内联函数可以提高性能，因为你不进行实际的函数调用时开销会更小。\n\
  \n\n\n`Sale` 类需要一个默认构造函数来处理免税销售。其他类看起来可能不需要——例如，如果从这些类中创建的对象总是被预期为向构造函数传递参数。然而，每当你设计一个带有构造函数的类时，包含一个默认构造函数被认为是一种良好的编程实践。如果你没有定义它，而程序尝试在不传递任何参数的情况下创建对象，程序将无法编译。这是因为必须有一个构造函数来创建对象。为了创建一个不传递任何参数的对象，必须有一个不接受任何参数的构造函数——即默认构造函数。如果程序员没有为类编写任何构造函数，编译器会自动为它创建一个默认构造函数。然而，当程序员编写了一个或多个构造函数时（即使它们都带有参数），编译器就不会再创建默认构造函数。因此，这是程序员的责任。\n\
  \n一个类可以有多个构造函数，但只能有一个默认构造函数。这是因为如果多个函数具有相同的名称，编译器必须能够根据它们的参数列表判断在任何时刻调用的是哪一个。它通过传递给函数的参数数量和类型来确定调用哪一个重载函数。由于名为类名且不接受任何参数的函数只有一个，因此默认构造函数也只能有一个。通常，像\
  \ `Sale` 类一样，默认构造函数没有参数。然而，如果所有参数都有默认值，则拥有带有参数的默认构造函数，这样就可以在不传递参数的情况下调用它。创建一个不接受参数的构造函数和另一个带有参数但允许所有参数都有默认值的构造函数是错误的。这在本质上创建了两个“默认”构造函数。下面的类声明非法地执行了这一点。\n\
  \n```\nclass Sale                // 非法声明！\n{ private:\n    double taxRate;\n\n \
  \ public:\n    Sale()                // 无参数的默认构造函数\n    {  taxRate = 0.05; }\n \
  \   Sale(double r = 0.05) // 带有默认参数的默认构造函数\n    {  taxRate = r; }\n    double calcSaleTotal(double\
  \ cost)\n    {  double total = cost + cost * taxRate;\n       return total;\n};\n\
  ```\n\n可以看出，第一个构造函数没有参数。第二个构造函数有一个参数，但它有一个默认参数。如果定义对象时没有参数列表，编译器将无法判断执行哪一个构造函数。\n\
  \n# 初始化成员变量的其他方法\n\n## 使用成员初始化列表\n\n在创建对象时，有两种额外方法初始化成员变量。第一种是使用成员初始化列表。*成员初始化列表*是一个成员变量名称及其初始值的列表，它出现在构造函数头部之后、函数体大括号之前。\n\
  \n以下是 程序 7-6 中 `Sale` 类构造函数的示例，每个构造函数都重写为使用成员初始化列表而不是赋值语句：\n\n```\nSale(double rate)\
  \ : taxRate(rate)\n{\n}\n\nSale() : taxRate(0.0)\n{\n}\n```\n\n注意函数头部结尾有一个冒号。这标志着后面跟着成员初始化列表。该列表可以放在与头部同一行，也可以放在下一行。成员初始化列表包含了每个要初始化的变量名称，后面跟着用括号括起来的初始值。在这种情况下，只初始化了一个变量，但在初始化列表中初始化一组变量也是可能的。在这种情况下，项之间用逗号分隔。\n\
  \n以下是 程序 7-3 构造函数示例，用于初始化 `Rectangle` 类的 `length` 和 `width` 变量。\n\n```\nRectangle(double\
  \ len, double w) :\n   length(len), width(w)\n{\n}\n```\n\n### 注意\n\n注意初始化列表后面*不能*有分号。\n\
  \n当构造函数具有成员初始化列表时，初始化会在构造函数体内任何语句执行之前发生。在上面的示例中，构造函数体都是空的，因为成员变量的初始化是由初始化列表处理的，所以构造函数不需要做其他事情。\n\
  \n许多程序员倾向于使用成员初始化列表代替构造体内的赋值语句，因为在某些情况下，它允许编译器生成更高效的代码。\n\n## 使用就地成员初始化\n\n在 C++\
  \ 11 之前，你不能在类声明内部初始化类成员变量。为了在创建类对象时设置初始值，代码必须调用一个要么给类成员分配初始值要么带有成员初始化列表的构造函数。从 C++\
  \ 11 开始，你可以在类声明内部定义成员变量时初始化它们。这被称为*就地初始化*（in-place initialization）。这是一个示例：\n\n```\n\
  class Rectangle\n{\nprivate:\n   double width = 0.0;\n   double length = 0.0;\n\
  public:\n    公共成员函数放在这里。\n};\n```\n这为创建的类的每个对象提供了初始值。\n\n# 构造函数委托\n\n通常，一个类会有多个执行相似步骤（或部分相同步骤）的构造函数。例如，查看下面的\
  \ `Contact` 类：\n\n```\nclass Contact\n{\nprivate:\n   string name;\n   string email;\n\
  \   string phone;\npublic:\n   // 默认构造函数\n   Contact()\n   {  name = \"\";\n   \
  \   email = \"\";\n      phone = \"\";\n   }\n\n   // 构造函数 #2\n   Contact(string\
  \ n, string e, string p)\n   {  name = n;\n      email = e;\n      phone = p;\n\
  \   }\n\n   后续是成员函数。\n};\n```\n\n在这个类中，两个构造函数都执行相似的操作。它们为 `name`、`email` 和 `phone`\
  \ 成员变量赋值。默认构造函数为成员分配空字符串，而带有参数的构造函数为它们分配指定的值。\n\n在 C++ 11 中，一个构造函数可以调用同一类中的另一个构造函数。这被称为*构造函数委托*。下面的示例展示了如何使用构造函数委托来避免\
  \ `Contact` 类中的重复代码：\n\n```\nclass Contact\n{\nprivate:\n   string name;\n   string\
  \ email;\n   string phone;\npublic:\n   // 默认构造函数\n   Contact() : Contact(\"\",\
  \ \"\", \"\")\n   { }\n\n   // 构造函数 #2\n   Contact(string n, string e, string p)\n\
  \   {  name = n;\n      email = e;\n      phone = p;\n   }\n\n   后续是成员函数。\n};\n\
  ```\n\n在这个类的版本中，默认构造函数调用了构造函数 #2。注意默认构造函数头部结尾有一个冒号，后面跟着一个带有三个空字符串的构造函数 #2 的调用。每当调用\
  \ `Contact` 类默认构造函数时，它都会调用构造函数 #2，并将空字符串作为参数。结果是空字符串被赋值给对象的 `name`、`email` 和 `phone`\
  \ 成员变量。\n\n# 7.7 析构函数\n\n### 概念\n\n析构函数是在对象销毁时自动调用的成员函数。\n\n析构函数的名称与类名相同，前面带有一个波浪号（`~`）。例如，`Rectangle`\
  \ 类的析构函数命名为 `~Rectangle`。\n\n\n\n析构函数在对象被销毁时自动调用。与构造函数用于在对象创建时进行初始化一样，析构函数用于在对象不存在时执行清理程序。这种情况发生在，例如带有对象的程序停止执行，或者你从创建该对象的函数返回时。\n\
  \n### 注意\n\n关于如何在 UML 中表示析构函数的信息，可以在该书籍辅助网站 [pearsonhighered.com/<wbr>gaddis](http://pearsonhighered.com/gaddis)上的附录\
  \ F 中找到。\n\n程序 7-7 展示了一个包含构造函数和析构函数的简单类。它说明了它们在程序执行过程中何时被调用。\n\n除了析构函数在对象被销毁时会自动调用这一点外，还应该提到以下几点：\n\
  \n* 像构造函数一样，析构函数没有返回值。\n* 析构函数不能接受参数，因此它们永远没有参数列表。\n* 因为析构函数不能接受参数，所以只能有一个析构函数。\n\
  \n析构函数在处理动态分配的对象时最有用。你将在第 10 章中学习这些内容。\n\n## 检查点\n\n1. 7.5 简述构造函数的用途。\n2. 7.6 构造函数的名称与以下哪项相同？\n\
