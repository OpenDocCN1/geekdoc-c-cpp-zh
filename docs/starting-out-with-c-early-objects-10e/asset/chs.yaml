  \n# 第 16 章 异常与模板\n\n## 16.1 异常\n\n### 概念\n\n异常用于信号程序运行时发生的错误或意外事件。\n\n错误测试通常是一个直接的过程，涉及\
  \ `if` 语句或其他控制机制。例如，以下代码段将在除零错误发生之前捕获它：\n\n```cpp\nif (denominator == 0)\n   cout\
  \ << \"ERROR: Cannot divide by zero.\\n\";\nelse\n   quotient = numerator / denominator;\n\
  ```\n\n但如果类似的代码是一个返回商的函数的一部分时，如下例所示：\n\n```cpp\n// 一个不可靠的除法函数\ndouble divide(double\
  \ numerator, double denominator)\n{\n    if (denominator == 0)\n       {\n     \
  \    cout << \"ERROR: Cannot divide by zero.\\n\";\n         return 0;\n      }\n\
  \   else\n       return numerator / denominator;\n}\n```\n\n## 抛出异常\n\n处理复杂错误条件的方法是使用异常。异常是在发生错误时发出信号的值或对象。例如，下面的代码显示了\
  \ `divide` 函数在尝试除零时抛出异常。\n\n```cpp\ndouble divide(double numerator, double denominator)\n\
  {\n   if (denominator == 0)\n        throw string(\"ERROR: Cannot divide by zero.\\\
  n\");\n   else\n       return numerator / denominator;\n}\n```\n\n以下语句导致异常的抛出：\n\
  \n```cpp\nthrow string(\"ERROR: Cannot divide by zero.\\n\");\n```\n\n`throw` 关键字后面跟着一个参数，可以是任何值。正如你所看到的，参数的类型用于确定错误的性质。上面的函数简单地抛出一个包含描述性信息的字符串对象。\n\
  \n包含 `throw` 的行被称为*抛出点*。当执行 `throw` 语句时，控制将传递到程序的另一个部分，即*异常处理器*。\n\n## 处理异常\n\n\
  为了处理异常，程序必须有一个 `try/catch` 结构。`try/catch` 结构的通用格式为\n\n```cpp\ntry\n{\n   // 此处调用可能抛出异常的函数或对象\n\
  }\ncatch(exception parameter)\n{\n   // 此处处理异常\n}\n// 根据需要重复多个 catch 块\n```\n\n\
  结构的第一部分是 *try 块*。它以关键字 `try` 开始，后面是一个代码块，执行可能直接或间接导致异常抛出的任何语句。try 块紧接着跟在一个或多个 *catch\
  \ 块*，这些是异常处理器。catch 块以关键字 `catch` 开始，后面是一组包含异常参数声明的括号。例如，这里有一个与 `divide` 函数配合 `try/catch`\
  \ 结构：\n\n```cpp\ntry\n{\n   quotient = divide(num1, num2);\n   cout << \"The quotient\
  \ is \" << quotient << endl;\n}\ncatch (string exceptionString)\n{\n   cout << exceptionString;\n\
  }\n```\n\n由于 `divide` 函数抛出一个类型为字符串的异常，必须有一个捕获字符串的异常处理器。所示的 catch 块捕获 `exceptionString`\
  \ 参数中的错误信息，然后通过 `cout` 显示出来。\n\n\n\n现在让我们来看整个程序，看看 `throw`、`try` 和 `catch` 是如何协同工作的。在程序\
  \ 16-1 的首次示例运行中，给出了有效数据。这显示了程序如何在无错误的情况下运行。在第二次示例运行中，给出的分母为 `0`。这显示了抛出异常后的结果。\n\n\
  从第二个输出屏幕可以看到，异常导致程序跳出 `divide` 函数并进入 `catch` 块。在 `catch` 块执行完成后，程序将从 `try/catch`\
  \ 结构之后的第一个语句继续执行。\n\n## 如果异常未被捕获会怎样？\n\n抛出的异常有两种可能导致未被捕获。第一种可能性是程序中没有包含异常参数为正确数据类型的\
  \ `catch` 块。第二种可能性是异常是从 `try` 块之外抛出的。无论哪种情况，异常都会导致整个程序终止执行。\n\n## 使用类的面向对象异常处理\n\
  \n现在你已经了解了 C++ 异常机制的工作原理，我们将检查一种面向对象的异常处理方法。让我们先看 `IntRange` 类：\n\n### `IntRange.h`\
  \ 的内容\n\n```\n 1 #ifndef INTRANGE_H\n 2 #define INTRANGE_H\n 3\n 4 #include <iostream>\n\
  \ 5 using namespace std;\n 6\n 7 class IntRange\n 8 {\n 9 private:\n10    int input;\
  \  // 用户输入\n11    int lower;  // 范围下限\n12    int upper;  // 范围上限\n13 public:\n14\
  \    // 异常类\n15    class OutOfRange\n16       { };     // 空类声明\n17    // 成员函数\n\
  18    IntRange(int low, int high)   // 构造函数\n19    {\n20       lower = low;\n21\
  \       upper = high;\n22    }\n23    int getInput()\n24    {\n25       cin >> input;\n\
  26       if (input < lower || input > upper)\n27          throw OutOfRange();\n\
  28       return input;\n29    }\n30 };\n31 #endif\n```\n\n`IntRange` 是一个简单的类，其成员函数\
  \ `getInput` 允许用户输入整数值。该值将与成员变量 `lower` 和 `upper`（这些变量由类构造函数初始化）进行比较。如果输入的值小于 `lower`\
  \ 或大于 `upper`，则抛出一个异常，表示该值超出范围。否则，函数返回该值。\n\n该函数没有抛出字符串或某些基本类型的值，而是抛出了一个*异常类*。注意在公共部分出现的空类声明：\n\
  \n```\nclass OutOfRange\n   { };  // 空类声明\n```\n\n注意该类没有成员变量。该类的唯一重要部分是它的名称，该名称将被异常处理代码使用。看\
  \ `getInput` 函数中的 `if` 语句：\n\n```\nif (input < lower || input > upper)\n   throw\
  \ OutOfRange();\n```\n\n`throw` 语句的参数 `OutOfRange()` 会导致 `OutOfRange` 类的一个实例被创建并作为异常抛出。剩下的只需要一个\
  \ `catch` 块来处理该异常。这是一个示例：\n\n```\ncatch (IntRange::OutOfRange)\n{\n   cout << \"\
  That value is out of range.\\n\";\n}\n```\n\n`catch` 块括号内只需要出现异常类的名称。由于异常类是空的，因此没有需要声明实际参数。`catch`\
  \ 块只需要知道异常的类型。\n\n由于 `OutOfRange` 类定义在 `IntRange` 类中，因此它的名称必须使用作用域解析符进行完全限定。程序 16-2\
  \ 显示了该类在驱动程序中的工作。\n\n## 多重异常\n\n到目前为止我们学习的程序只测试一种类型的错误，并且只抛出一种类型的异常。在很多情况下，程序需要测试几种不同类型的错误并信号发生了哪一种。C++\
  \ 允许你抛出和捕获多个异常。唯一的要求是每个不同的异常必须是不同的类型。你只需为 `try` 块中可能抛出的每种异常类型编写单独的 `catch` 块。\n\n\
  例如，假设我们扩展 `IntRange` 类，以便如果用户输入的值太低，则抛出一种异常；如果用户输入的值太大，则抛出另一种异常。首先，我们声明两个不同的异常类，例如：\n\
  \n```\n// 异常类\nclass TooLow\n   { };\nclass TooHigh\n   { };\n```\n\n当用户输入低值时，将抛出一个\
  \ `TooLow` 类的实例，当输入高值时，将抛出一个 `TooHigh` 类的实例。\n\n接下来，我们修改 `getInput` 成员函数进行两次测试并抛出相应的异常：\n\
  \n```\nif (input < lower)\n   throw TooLow();\nelse if (input > upper)\n   throw\
  \ TooHigh();\n```\n\n整个修改后的类名为 `IntRange2`，如下：\n\n`IntRange2.h` 的内容\n\n```\n1 #ifndef\
  \ INTRANGE2_H\n2 #define INTRANGE2_H\n3\n4 #include <iostream>\n5 using namespace\
  \ std;\n6\n7 class IntRange2\n8 {\n9 private:\n10    int input;  // 用户输入\n11   \
  \ int lower;  // 范围下限\n12    int upper;  // 范围上限\n13 public:\n14    // 异常类\n15 \
  \   class TooLow\n16       { };\n17    class TooHigh\n18       { };\n19    // 成员函数\n\
  20    IntRange2(int low, int high)  // 构造函数\n21    {\n22       lower = low;\n23\
  \       upper = high;\n24    }\n25    int getInput()\n26    {\n27       cin >> input;\n\
  28       if (input < lower)\n29          throw TooLow();\n30       else if (input\
  \ > upper)\n31          throw TooHigh();\n32       return input;\n33    }\n34 };\n\
  35 #endif\n```\n\n程序 16-3 是一个演示该类的简单驱动程序。\n\n## 从异常类中提取信息\n\n有时我们可能希望异常返回信息。例如，假设我们希望\
  \ `IntRange` 类不仅在输入无效值时发出信号，而且返回该值。这可以通过为异常类提供存储信息的成员来实现。\n\n`IntRange3` 是对 `IntRange`\
  \ 类的后续修改，它再次使用单个异常类：`OutOfRange`。然而，这个版本的 `OutOfRange` 有一个成员变量和一个初始化它的构造函数：\n\n\
  ```\n// 异常类\nclass OutOfRange\n{  public:\n      int value;\n      OutOfRange(int\
  \ i)\n      { value = i; }\n};\n```\n\n当我们抛出此异常时，我们希望将输入的值传递给 `OutOfRange` 的构造函数。这是通过以下语句实现的：\n\
  \n```\nthrow OutOfRange(input);\n```\n\n`throw` 语句创建 `OutOfRange` 类的一个实例并将 `input`\
  \ 变量的拷贝传递给构造函数。构造函数将此数字存储在 `OutOfRange` 的成员变量 `value` 中。类实例将此成员变量带到拦截异常的 `catch`\
  \ 块。\n\n回到 `catch` 块，提取该值：\n\n```\ncatch (IntRange3::OutOfRange ex)\n{\n   cout\
  \ << \"That value \" << ex.value\n        << \" is out of range.\\n\";\n}\n```\n\
  \n注意 `catch` 块声明了一个名为 `ex` 的参数对象。这是因为异常有一个我们想要检查的成员变量。整个 `IntRange3` 类如下，程序 16-4\
  \ 是演示它的驱动程序。\n\n\n\n\n```cpp\n#ifndef INTRANGE3_H\n#define INTRANGE3_H\n\n#include\
  \ <iostream>\nusing namespace std;\n\nclass IntRange3\n{\nprivate:\n    int input;\
  \  // 用于用户输入\n    int lower;  // 范围下限\n    int upper;  // 范围上界\npublic:\n    //\
  \ 异常类\n    class OutOfRange\n    {\n       public:\n       int value;\n       OutOfRange(int\
  \ i)\n       { value = i; }\n    };\n    // 成员函数\n    IntRange3(int low, int high)\
  \  // 构造函数\n    {\n       lower = low;\n       upper = high;\n    }\n    int getInput()\n\
  \    {\n       cin >> input;\n       if (input < lower || input > upper)\n     \
  \     throw OutOfRange(input);\n       return input;\n    }\n};\n#endif\n```\n\n\
  # 处理由 `new` 抛出的 `bad_alloc` 异常\n\n如果 `new` 操作无法分配请求的存储空间，它会抛出一个类型为 `bad_alloc` 的系统定义异常。例如，以下程序尝试在\
  \ `try` 块内部使用 `new` 操作符分配一个两个整数的数组。如果分配失败，产生的 `bad_alloc` 异常将在关联的 `catch` 块中捕获，程序将带有相应的错误信息终止。如果分配成功，程序将继续打印\
  \ 10 和 20 两个数字。`bad_alloc` 类型定义在头文件 `new` 中，引用它的程序必须包含该头文件。\n\n# 栈回溯\n\n如果在具有能够处理该异常的\
  \ `catch` 块的 `try` 块中抛出了异常，控制将从抛出点转移到 catch 块。假设 `catch` 块执行完毕且没有抛出更多异常、从函数返回或终止程序，执行将从\
  \ `try` 块关联的一系列 `catch` 块之后的第一条语句继续。\n\n如果函数不包含能够处理该异常的 `catch` 块，控制将传出函数，异常将在调用函数中的调用点自动重新抛出。通过这一过程，异常可以沿着函数调用链向后传播，直到异常抛出一个带有可以处理它的\
  \ `catch` 块的 `try` 块。如果从未找到这样的 `try` 块，异常最终将抛出 `main` 函数，导致程序终止。这种将未捕获异常从函数传播到其调用者的过程被称为函数调用的栈回溯（unwinding\
  \ the stack）。\n\n# 重新抛出异常\n\n`try` 块是可以嵌套的。例如，看这段代码段：\n\n```cpp\n void main()\n\
  {\n   try\n   {\n      doSomething();\n   }\n   catch(exception1)\n   {\n      处理异常\
  \ 1 的代码\n   }\n    catch(exception2)\n   {\n      处理异常 2 的代码\n   }\n}\n```\n\n在这个\
  \ `try` 块中，调用了函数 `doSomething`。这里有两个 `catch` 块，一个处理 `exception1`，另一个处理 `exception2`。如果\
  \ `doSomething` 函数包含一个 `try` 块，那么它就嵌套在所示的块内部。\n\n在具有嵌套的 `try` 块时，有时内部异常处理器有需要将异常传递给外部异常处理器。有时，当抛出特定异常时，内部和外部的\
  \ `catch` 块都必须执行操作。这些情况要求内部 `catch` 块重新抛出（rethrow）异常，以便外部 `catch` 块可以捕获它。\n\n`catch`\
  \ 块可以使用无参数的 `throw;` 语句重新抛出异常。例如，假设 `doSomething` 函数（在上述 `try` 块中调用）执行可能抛出 `exception1`\
  \ 或 `exception3` 的代码。假设我们不想在 `doSomething` 中处理 `exception1` 错误，而是想将其重新抛出给外部块。以下代码段说明了如何这样做。\n\
  \n```cpp\n void doSomething()\n{\n   try\n   {\n      可能抛出异常 1 和 3 的代码\n   }\n \
  \  catch(exception1)\n   {\n      throw; // 重新抛出异常\n   }\n   catch(exception3)\n\
  \   {\n      处理异常 3 的代码\n   }\n}\n```\n\n当第一个 `catch` 块捕获到 `exception1` 时，`throw;`\
  \ 语句只是再次抛出该异常。外部 `try/catch` 结构中的 `catch` 块（在本例中是 `main` 函数中的那个）随后将处理该异常。\n\n# 节点\n\
  \n1. 16.1 `try` 块和 `catch` 块之间的区别是什么？\n2. 16.2 如果抛出了异常但未被捕获会发生什么？\n3. 16.3 如果可能抛出多个异常，`catch`\
  \ 块如何知道捕获哪种异常？\n4. 16.4 在 `catch` 块处理异常后，程序执行从哪里恢复？\n5. 16.5 异常如何传递信息？\n\n# 16.2\
  \ 函数模板\n\n### 概念\n\n函数模板是一种可以适用于不同数据类型的“泛型”函数。程序员编写函数的规范，但编译器会为所使用的数据类型生成特定的代码。\n\
  \n重载函数使编程变得方便，因为对于一组函数只需要记住一个函数名称。然而，每个函数仍然必须编写。例如，考虑以下重载的 `square` 函数：\n\n```cpp\n\
  int square(int number)\n{\n   return number * number;\n}\ndouble square(double number)\n\
  {\n   return number * number;\n}\n```\n\n这两个函数之间唯一的区别是返回值和参数的数据类型。在这种情况下，编写函数模板比编写重载函数更方便。\n\
  \n函数模板不是实际函数，而是编译器用于生成一个或多个函数的“模具”。编写函数模板时，不需要为参数、返回值或局部变量指定实际类型。相反，你使用类型参数来指定通用数据类型。当编译器遇到函数调用时，它会检查参数类型并生成适用于这些类型的函数代码。\n\
  \n这是 `square` 函数的函数模板：\n\n```cpp\ntemplate <class T>\nT square(T number)\n{\n  \
  \ return number * number;\n}\n```\n\n函数模板的开头由模板前缀标记，以关键字 `template` 开始。接下来是尖括号，包含模板中使用的一个或多个通用数据类型。泛型数据类型以关键字\
  \ `class` 开头，跟着一个代表数据类型的参数名称。刚才给出的示例只使用了一个，命名为 `T`。（如果有多个，将用逗号分隔。）之后，按照通常编写函数定义，只是将类型参数替换为实际数据类型。在示例中，函数头部为\n\
  \n```\nT square(T number)\n```\n\n`T` 是类型参数或通用数据类型。该头部定义 `square` 为一个返回类型为 `T` 的值的函数，并使用类型同样为\
  \ `T` 的参数 `number`。\n\n如前，编译器会检查 `square` 的每次调用并为 `T` 填充相应的数据类型。例如，以下调用使用了 `int`\
  \ 参数：\n\n```cpp\nint y, x = 4;\ny = square(x);\n```\n\n这段代码会导致编译器生成函数：\n\n```cpp\n\
  int square(int number)\n{\n   return number * number;\n}\n```\n\n而以下语句\n\n```cpp\n\
  double y, d = 6.2\ny = square(d);\n```\n\n将导致生成函数：\n\n```cpp\ndouble square(double\
  \ number)\n{\n   return number * number;\n}\n```\n\n\n\n\n\n程序 16-6 展示了如何使用此函数模板。\n\
  \n## 注意事项\n在函数模板中定义的所有类型参数必须在函数参数列表中至少出现一次。\n\n由于编译器在程序 16-6 中遇到了两次对 `square` 的调用，且每次调用的参数类型不同，因此它为函数的两个实例生成了代码：一个具有\
  \ `int` 参数和 `int` 返回类型，另一个具有 `double` 参数和 `double` 返回类型。这在图 16-1 中图中所示。\n\n## 图\
  \ 16-1 从函数模板生成的代码\n![图表显示了从函数模板生成的代码。](img/FG_16_001.png)图 16-1 完整替代文本\n\n注意程序 16-6\
  \ 中，模板在所有对 `square` 的调用之前出现。与普通函数一样，编译器在遇到对模板函数的调用时，必须已经知道模板的内容。因此，模板应该放置在程序的顶部或头文件中。\n\
  \n## 注意事项\n函数模板仅仅是函数的规范，其本身不会占用内存。当编译器遇到对模板函数的调用时，会在内存中创建函数的实际实例。\n\n## `swap` 函数模板\n\
  在许多应用程序中，需要交换两个相同类型变量的内容。例如，在对整数数组进行排序时，需要如下函数：\n\n```cpp\nvoid swap(int &a, int\
  \ &b)\n{\n   int temp = a;\n   a = b;\n   b = temp;\n}\n```\n\n而在对字符串对象数组进行排序时，则需要如下函数：\n\
  \n```cpp\nvoid swap(string &a, string &b)\n{\n   string temp = a;\n   a = b;\n \
  \  b = temp;\n}\n```\n\n由于这两个函数在编码上的唯一区别是被交换变量的类型，这两个函数的逻辑以及所有其他类似的函数的逻辑可以用一个模板函数来捕捉：\n\
  \n```cpp\ntemplate<class T>\nvoid swap(T &a, T &b)\n{\n   T temp = a;\n   a = b;\n\
  \   b = temp;\n}\n```\n\n此类模板函数在标准 C++ 编译器自带的库中可用。该函数在 `algorithm` 头文件中声明。程序 16-7\
  \ 演示了如何使用此库模板函数来交换变量对的内容。\n\n## 在函数模板中使用运算符\n本节稍早显示的 `square` 函数模板对其参数应用了运算符 `*`。只要传递给它的参数的类型支持\
  \ `*` 运算符，`square` 模板就能正常工作。例如，它适用于 `int`、`long` 和 `double` 等数值类型，因为所有这些类型都有乘法运算符\
  \ `*`。此外，`square` 模板适用于任何重载了 `*` 运算符的用户定义类类型。如果对不支持 `*` 运算符的类型使用 `square` 将会导致错误。\n\
  \n始终记住，模板对于支持模板所用操作的类型有效。例如，只有当类重载了关系运算符时，它才能用于将关系运算符（如 `<`, `<=` 和 `!=`）应用于其类型参数的模板。\n\
  \n例如，由于 string 类重载了所有关系运算符，因此它可以用于计算项目数组最小值的模板函数。程序 16-8 说明了这一点。\n\n## 多类型的函数模板\n\
  函数模板可以使用多个泛型类型。程序 16-9 是一个函数示例，该函数接受三个任意可打印类型的列表作为参数，按顺序打印该列表，然后反序打印该列表。模板函数的类型参数使用标识符\
  \ `T1`、`T2` 和 `T3` 表示。\n\n## 注意事项\n模板前缀中定义的每个类型参数必须在模板定义中的某处使用。\n\n## 使用函数模板进行重载\n\
  函数模板可以重载。与普通函数一样，函数模板通过不同的参数列表来实现重载。例如，程序 16-10 中的 `sum` 函数有两个重载版本。第一个版本接受两个参数，第二个版本接受三个。\n\
  \n还有其他方法可以利用函数模板执行重载。例如，程序可以既包含函数的普通（非模板）版本，又包含模板版本。只要每个版本具有不同的参数列表，它们就可以作为重载函数共存。\n\
  \n## 定义模板函数\n在定义模板函数时，从编写该函数的非模板版本开始，然后在测试后将其转换为模板，可能会有所帮助。转换通过在函数定义前加上适当的模板头来实现，例如：\n\
  \n```cpp\ntemplate <class T>\n```\n\n然后系统地将相关类型替换为泛型类型 `T`。我们在定义 `swap` 函数模板时遵循了类似的步骤。\n\
  \n## 注意事项\n从 C++ 11 开始，你可以在 `template` 前缀中使用关键字 `typename` 代替 `class`。因此，`template`\
  \ 前缀可以写为 `template <typename T>`。\n\n## 检查点\n1. 16.6 编译器何时真正为函数模板生成代码？\n2. 16.7\
  \ 函数\n```cpp\nint minPosition(int arr[], int size)\n```\n接受指定大小的整数数组并返回数组中最小元素的索引。定义一个模板，允许小于运算符\
  \ `<` 的任意类型数组。\n3. 16.8 将类对象传递给使用运算符（如 `*` 或 `>`）的函数模板时，必须确保什么？\n4. 16.9 编写函数模板的好方法是什么？\n\
  \n# 16.3 类模板\n### 概念\n模板也可以用于创建泛型类和抽象数据类型。\n\n函数模板用于我们需要多个具有相同问题逻辑但仅在处理的参数类型上不同的函数的情况。类模板用于我们需要多个仅在某些数据成员类型或其成员函数参数类型上不同的类的情况。\n\
  \n声明类模板与声明函数模板类似：使用 `T`、`T1`、`T2`（或你选择的任何标识符）等泛型类型编写该类，然后在类声明前加上适当编写的模板头。例如，假设我们想要定义一个与第\
  \ 11 章中学过的 `NumberArray` 类类似的类，它表示泛型类型的数组，并添加了执行边界检查的重载运算符 `[]`。将我们的类命名为 `SimpleVector`\
  \ 并放入适当的数据成员和构造函数，我们得到了如下模板：\n\n\n\n\n\n```\ntemplate <class T>\nclass SimpleVector\n\
  {\n    unique_ptr<T []> aptr;\n    int arraySize;   \npublic:\n    SimpleVector(int);\
  \                   // 构造函数\n    SimpleVector(const SimpleVector &);  // 拷贝构造函数\n\
  \    int size() const { return arraySize; }\n    T &operator[](int);           \
  \       // 重载 []运算符\n    void print() const;                  // 输出数组元素\n};\n```\n\
  \n该类模板将在动态生成的数组中存储类型为 `T` 的元素。这解释了为什么指向该数组基地址的指针 `aptr` 被声明为类型 `T []`。由于 `aptr`\
  \ 的类型使用了 `unique_ptr`，因为 `SimpleVector` 对象不会与程序的任何其他部分共享动态分配的数组。同样地，重载的数组下标运算符返回类型为\
  \ `T` 的值。但请注意，`size()` 成员函数返回的值和成员变量 `arraySize` 都是 `int` 类型。这是合理的，因为数组中的元素个数始终是一个整数，无论数组存储的元素类型是什么。\n\
  \n你可以将 `SimpleVector` 模板看作一种通用模式，可以通过特化它来创建持有 `double`、`long`、`string` 或任何你定义的类型的\
  \ `SimpleVector` 类。规则是，通过在类模板的名称后附加一个用尖括号括起来的实际类型列表，来形成此类实际类的类名：\n\n* `SimpleVector<double>`\
  \ 是一个存储 `double` 数组的类的名称。\n* `SimpleVector<string>` 是一个存储 `string` 数组的类的名称。\n* `SimpleVector<char>`\
  \ 是一个存储 `char` 数组的类的名称。\n\n下面是一个使用转换构造函数创建一个包含 10 个 `double` 类型元素的数组，并定义 `SimpleVector`\
  \ 对象的示例：\n\n```\nSimpleVector<double> dTable(10);\n```\n\n该语句使用转换构造函数创建一个包含 10 个\
  \ `double` 类型元素的数组。\n\n在类内部定义模板类的成员函数是直接的：`SimpleVector` 类中 `size()` 的定义就是一个例子。若要在类外定义成员函数，你必须在成员函数的定义前加上一个模板头，该模板头指定了类型参数列表，然后在定义内部，每当需要使用类名时，都要使用类模板名后跟一个尖括号括的类型参数列表。\n\
  \n让我们使用 `operator[ ]` 函数来说明在类外定义成员函数。\n\n```\ntemplate <class T>\nT &SimpleVector<T>::operator[](int\
  \ sub)\n{\n   if (sub < 0 || sub >= arraySize)\n      throw IndexOutOfRangeException(sub)\n\
  \   return aptr[sub];\n}\n```\n\n在此定义中，在作用域解析运算符之前需要类名，因此我们在该处使用了 `SimpleVector<T>`。另一个例子是，考虑转换构造函数的定义：\n\
  \n```\ntemplate <class T>\nSimpleVector<T>::SimpleVector(int s)\n{\n   arraySize\
  \ = s;\n   aptr = make_unique<T[]>(s);\n   for (int count = 0; count < arraySize;\
  \ count++)\n       aptr[count] = T();\n}\n```\n\n在这里，我们需要在作用域解析运算符之前使用 `SimpleVector<T>`，但在之后仅使用\
  \ `SimpleVector` 而不带 `<T>`。这是因为在作用域解析运算符之后需要的不是类名，而是成员函数名，在这种情况下它恰好是一个构造函数。\n\n\
  将类型参数列表附加到模板类名上的规则有一个例外。每当类名位于模板类的作用范围内时，就可以省略该列表以及括住它的尖括号。因此，当类名在类内部的任何处，或在类外定义的成员函数的局部作用域内使用时，可以省略该列表。例如，拷贝构造函数\n\
  \n```\ntemplate <class T>\nSimpleVector<T>::SimpleVector(const SimpleVector &obj)\n\
  {\n   arraySize = obj.arraySize;\n   aptr = make_unique<T[]>(arraySize);\n   for\
  \ (int count = 0; count < arraySize; count++)\n       aptr[count] = obj[count];\n\
  }\n```\n\n不需要为表示参数类型的 `SimpleVector` 附加 `<T>`。\n\n`SimpleVector` 的转换构造函数假设类型参数 `T`\
  \ 在执行赋值 `aptr[count] = T();` 时有一个默认构造函数 `T()`。如果 `T` 是基本类型，C++ 编译器将替代 `T()`。例如，如果\
  \ `T` 是 `int`，则赋值等同于 `aptr[count] = int();`，并且 `aptr[count]` 中将存储值 0。\n\n`SimpleVector`\
  \ 模板的代码列在 `SimpleVector.h` 文件中。\n\n# `SimpleVector.h` 内容\n\n```\n 1 #include <iostream>\n\
  \ 2 #include <cstdlib>\n 3 #include <memory>\n 4 using namespace std;\n 5 \n 6 //\
  \ 索引越界异常\n 7 struct IndexOutOfRangeException\n 8 {\n 9     const int index;\n10\
  \     IndexOutOfRangeException(int ix) : index(ix) {}\n11 };\n12 \n13 template <class\
  \ T>\n14 class SimpleVector\n15 {\n16     unique_ptr<T []> aptr;\n17     int arraySize;\
  \   \n18 public:\n19     SimpleVector(int);                   // 构造函数\n20     SimpleVector(const\
  \ SimpleVector &);  // 拷贝构造函数\n21     int size() const { return arraySize; }\n22\
  \     T &operator[](int);                  // 重载 []运算符\n23     void print() const;\
  \                  // 输出数组元素\n24 };\n25 \n26 //***************************************\n\
  27 // SimpleVector 类构造函数。设置*\n28 // 数组的大小并为其分配内存。            \n29 //***************************************\n\
  30 template <class T>\n31 SimpleVector<T>::SimpleVector(int s)\n32 {\n33     arraySize\
  \ = s;\n34     aptr = make_unique<T[]>(s);\n35     for (int count = 0; count < arraySize;\
  \ count++)\n36         aptr[count] = T();\n37 }\n38 //**************************************\n\
  39 // SimpleVector 拷贝构造函数。            *\n40 //**************************************\n\
  41 template <class T>\n42 SimpleVector<T>::SimpleVector(const SimpleVector &obj)\n\
  43 {\n44     arraySize = obj.arraySize;\n45     aptr = make_unique<T[]>(arraySize);\n\
  46     for (int count = 0; count < arraySize; count++)\n47         aptr[count] =\
  \ obj[count];\n48 }\n49 \n50 \n51 //***************************************\n52\
  \ // 重载 [] 运算符。参数是下标。*\n53 // 该函数返回按下标索引的数组     *\n54 // 中元素的引用。               \
  \    *\n55 //***************************************\n56 template <class T>\n57\
  \ T &SimpleVector<T>::operator[](int sub)\n58 {\n59     if (sub < 0 || sub >= arraySize)\n\
  60         throw IndexOutOfRangeException(sub);\n61     return aptr[sub];\n62 }\n\
  63 //****************************************\n64 // 打印数组中的所有条目。              *\n\
  65 //****************************************\n66 template <class T>\n67 void SimpleVector<T>::print()\
  \ const\n68 {\n69     for (int k = 0; k < arraySize; k++)\n70         cout << aptr[k]\
  \ << \"  \";\n71     cout << endl;\n72 }\n```\n\n该程序演示了 `SimpleVector` 模板。\n\n###\
  \ 注意\n\n包含模板代码的文件已包含在驱动程序代码文件中，以避免单独编译使用模板文件的复杂性。\n\n# 16.4 类模板与继承\n\n继承可以应用于类模板。例如，在下面的模板中，`SearchableVector`\
  \ 派自 `SimpleVector` 类。\n\n# `SearchVect.h` 内容\n\n\n\n\n\n```cpp\n#include \"SimpleVector.h\"\
  \n\ntemplate <class T>\nclass SearchableVector : public SimpleVector<T>\n{\npublic:\n\
  \   // 构造函数。\n   SearchableVector(int s) : SimpleVector<T>(s)\n   { }\n   // 拷贝构造函数。\
  \                \n   SearchableVector(const SearchableVector &);\n   // 附加构造函数。\
  \ \n   SearchableVector(const SimpleVector<T> &obj) :\n       SimpleVector<T>(obj)\
  \ { }\n   int findItem(T);\n};\n\n//******************************************\n\
  // 拷贝构造函数的定义.*\n//******************************************\ntemplate <class T>\n\
  SearchableVector<T>::\nSearchableVector(const SearchableVector &obj) :\n    SimpleVector<T>(obj)\n\
  {\n}\n\n//******************************************\n// findItem 接收类型为 T 的参数*\n\
  // 并在数组中搜索该项。   *\n//******************************************\ntemplate <class\
  \ T>\nint SearchableVector<T>::findItem(T item)\n{\n    for (int count = 0; count\
  \ < this->size(); count++)\n    {\n        if (this->operator[](count) == item)\n\
  \            return count;\n    }\n    return -1;\n}\n```\n\n让我们使用这个示例来仔细观察从模板基类派生类的推导。首先，我们必须告诉编译器，我们正在根据另一个已存在的类模板定义一个新的新的类模板：\n\
  \n```cpp\ntemplate <class T>\nclass SearchableVector : public SimpleVector<T>\n\
  {\n   // 类成员变量将放在这里\n};\n```\n\n这里正在定义的新类模板是 `SearchableVector`，而现有的基类模板是 `SimpleVector<T>`。该类有三个构造函数。这里所示的构造函数：\n\
  \n```cpp\nSearchableVector(int size) : SimpleVector<T>(size){ }\n```\n\n设计用于动态分配一个包含\
  \ `size` 个 `T` 类型元素的数组，这是通过调用基类构造函数并向其传递参数 `size` 实现的。该构造函数将创建一个指定大小的数组，并将所有元素初始化为类型\
  \ `T` 的默认值。该类还有另一个构造函数：\n\n```cpp\nSearchableVector(const SimpleVector<T> &obj):SimpleVector<T>(obj){\
  \ }\n```\n\n它接收一个基类对象作为参数，并搜索该对象的拷贝。该构造函数简单地将其参数传递给基类的拷贝构造函数。剩下的构造函数是 `SearchableVector`\
  \ 类的拷贝构造函数：\n\n```cpp\nSearchableVector(const SearchableVector<T> &obj): SimpleVector<T>(obj){\
  \ }\n```\n\n由于 `SearchableVector` 的初始化与 `SimpleVector` 相同，`SearchableVector` 拷贝构造函数简单将其参数传递给其基类的拷贝构造函数。成员函数\
  \ `findItem` 接收一个类型为 `T` 的项作为参数，并返回该项在数组中的位置。如果在数组中找到该项，则返回值 –1。\n\n`程序 16-12` 通过在两个\
  \ `SearchableVector` 对象中存储值，然后在每个对象中搜索特定值来演示该类。\n\n`SearchableVector` 类证明了类模板可以派生自另一个类模板。此外，类模板可以派生自普通类，而普通类也可以派生自类模板。\n\
