  \ << endl;\n    ```\n\n3.  5.6 写一个哨兵控制的 `while` 循环，直到输入 99 为止。该代码应统计累加分数。它应该报告输入了多少分数并给出平均值。\n\
  \n# 5.7 do-while 循环\n\n### 概念\n\n`do-while` 循环是一种后测试循环，这意味着在每次迭代之后进行测试。\n\n除了 `while`\
  \ 循环外，C++ 还提供了 `do-while` 循环。`do-while` 循环看起来类似于倒过来的 `while` 循环。图 5-5 显示了它的格式以及描述其工作原理的流程图。\n\
  \n# 图 5-5 do-while 循环的格式和逻辑\n\n![图像显示了 do-while 循环的流程图的代码。](img/FG_05_005.png)图\
  \ 5-5 完整备用文本\n\n与 `while` 循环一样，如果循环体只有一个条件执行的语句，可以省略括号。\n\n### 注意\n\n`do-while`\
  \ 循环必须在测试表达式的右括号后以分号终止。\n\n除了外观之外，`do-while` 循环与 `while` 循环的区别在于 `do-while` 是一个后测试（post-test）循环。这意味着它在每次迭代完成后测试其表达式。因此，即使测试表达式在开始时为假，`do-while`\
  \ 也至少执行一次迭代。例如，在下面的 `while` 循环中，`cout` 语句根本不会执行。\n\n```\nint x = 1;\nwhile (x <\
  \ 0)\n    cout << x << endl;\n```\n\n但在下面的 `do-while` 循环中，`cout` 语句将执行一次，因为 `do-while`\
  \ 循环在迭代结束时才评估表达式 `x < 0`。\n\n```\nint x = 1;\ndo\n  cout << x << endl;\nwhile (x\
  \ < 0);\n```\n\n\n\n\n\n当你想确保循环至少执行一次时，应该使用 `do-while` 循环。例如，程序 5-10 在询问用户是否想用另一组分数重复该过程之前，先计算并显示了一组测试分数的平均值。与\
  \ `while` 循环一样，`do-while` 循环可以写为迭代固定次数，也可以允许用户控制循环的次数。程序 5-10 展示了让用户控制循环的另一种方法。只要用户输入‘Y’或‘y’表示是，它就会继续重复。\n\
  \n## `toupper` 函数\n\n让我们仔细观察 程序 5-10 中包含 `do-while` 循环测试表达式的行。\n\n```\nwhile (again\
  \ == 'Y' || again == 'y');\n```\n\n注意如何使用逻辑或（logical OR）运算符来允许用户输入大写的‘Y’或小写的‘y’来执行循环的下一次迭代。\n\
  \n虽然这种方法在测试这两个字符时效果很好，但使用名为 `toupper` 的 C++ 函数（读作“to upper”）可以更更容易实现。该函数接收一个字符并返回该字符的整数\
  \ ASCII 代码。如果接收到的字符是小写字母，它返回其对应大写字母的 ASCII 代码。如果接收到的字符不是小写字母，它则返回传入的相同字符的 ASCII\
  \ 代码。\n\n如果打印 `toupper` 返回的值，打印将是 ASCII 代码。然而，如果将其赋值给一个 `char` 变量并打印，则将打印字符本身。下面的示例说明了这一点。\n\
  \n```\nchar letter1, letter2, letter3;\n\nletter1 = toupper('?');\ncout << letter1;\
  \          // 显示 ?\n\nletter2 = toupper('A');\ncout << letter2;          // 显示 A\n\
  \nletter3 = toupper('b');\ncout << letter3;          // 显示 B\n\ncout << toupper('c');\
  \     // 显示 67，C 的 ASCII 代码\n```\n\n在第一个示例中，传递给 `toupper` 函数的字符根本不是字母，因此返回相同字符的\
  \ ASCII 代码并赋值给 `letter1` 用于打印。在第二个示例中，传递给 `toupper` 的已经是大写字母，因此再次返回接收到的相同字符的 ASCII\
  \ 代码。在第三个示例中，`toupper` 接收到一个小写字母，因此返回其对应大写字母的 ASCII 代码。在最后一个示例中，`toupper` 再次接收到一个小写字母并返回其对应大写字母的\
  \ ASCII 代码。然而，这次打印的是返回的值，而不是将其赋值给 `char` 变量，因此显示的是 ASCII 代码本身的整数值。\n\n传递给 `toupper`\
  \ 的值不需要是字符字面量。也可以是字符变量，如下所示：\n\n```\nchar letter1 = 'b';\nchar letter2 = toupper(letter1);\
  \   // 现在 letter2 的值为 'B'\n```\n\n`toupper` 函数在用于 `do-while` 循环的测试表达式时特别有用。它可以测试存有用户输入的变量，以检查在询问是否再次迭代循环时，用户是否输入了‘Y’或‘y’。以下两个\
  \ `do-while` 测试在逻辑上是等价的：\n\n```\nwhile (again == 'Y' || again == 'y');\nwhile (toupper(again)\
  \ == 'Y');\n```\n\n重要的是，要理解最后一个测试表达式并没有改变存储在 `again` 变量中的值。相反，它将 `toupper` 返回的值与字符字面量进行比较。要实际更改存储在\
  \ `again` 中的值，必须将函数返回的值*赋值*给它，如下所示：\n\n```\nagain = toupper(again);\n```\n\nC++\
  \ 还提供了一个类似的函数将大写字母转换为其对应的小写字母。该函数名为 `tolower`（读作“to lower”）。以下是它的两个用法：\n\n```\n\
  while (tolower(again) == 'y');\nagain = tolower(again);\n```\n\n### 注意\n\n要使用 `toupper`\
  \ 和 `tolower`，你必须在程序中包含 `cctype` 头文件。你可以通过以下语句包含它：\n\n```\n#include <cctype>\n```\n\
  \n## 在菜单中使用 `do-while`\n\n`do-while` 循环是重复菜单的好选择。回想 程序 4-27，它使用 `do-while` 循环显示菜单直到用户选择项目\
  \ 11](#fileP7001016089000000000000000003A32.xhtml_P7001016089000000000000000003A6A)\
  \ 它是对该程序使用 `do-while` 循环的修改。\n\n## 检查\n\n1. 5.7 以下程序段将显示什么？\n\n    1.  ```cpp\n\
  \        int count = 3;\n        do\n            cout << \"Hello World\\n\";\n \
  \           count--;\n        while (count < 1);\n        ```\n\n    2.  ```cpp\n\
  \        int val = 5;\n        do\n            cout << val << \" \";\n        while\
  \ (val >= 5);\n        ```\n\n    3.  ```cpp\n        int count = 0, number = 0,\
  \ limit = 4;\n        do\n        {\n            number += 2;\n            count++;\n\
  \        } while (count < limit);\n        cout << number << endl;\n        ```\n\
  \n2. 5.8 使用 `do-while` 循环编写一个程序，显示用户输入的整数是偶数还是奇数。代码随后询问用户是否想要另一个数字。只要用户输入‘Y’或‘y’循环就会重复。\n\
  \n3. 5.9 修改你的 5.8 答案以使用 `toupper` 函数。\n\n## 5.8 `for` 循环\n\n### 概念\n\n`for` 循环是一种预测试循环，将控制变量的初始化、测试和更新合并在一个头文件中。\n\
  \n通常，循环分为两类：条件循环和计数控制循环。*条件循环*在特定条件存在时执行。例如，输入验证循环在输入无效时执行。当你编写条件循环时，你不知道它将迭代多少次。\n\
  \n有时你知道循环必须执行的精确次数。*计数控制循环*正是如此。例如，如果一个循环要求用户输入每月的销售额，它将迭代十二次。本质上，循环数到十二，并在每次要求输入销售额。计数控制循环必须具备三个元素：\n\
  \n1. 将计数变量初始化为起始值。\n2. 通过将计数变量与最终值进行比较来进行测试。当计数变量达到最终值时，循环终止。\n3. 在每次迭代期间更新计数变量。这通常通过增加该变量来实现。\n\
  \n```\nfor (initialization;  test;  update)\n{\n    statement;\n    statement;\n\
  \    //  根据需要在此处放置尽可能\n    //  语句。\n}\n```\n\n与你使用的其他循环一样，如果循环体中只有一个语句，则可以省略括号。\n\
  \n\n\n\n\n`for` 循环的第一行是 `loop header`（循环头）。在关键字 `for` 之后，括号内有三个表达式，用分号隔开。（注意第三个表达式后面没有分号。）第一个表达式是\
  \ `initialization expression`（初始化表达式）。它通常用于将计数器初始化为起始值。这是循环执行的第一个动作，只执行一次。\n\n第二个表达式是\
  \ `test expression`（测试表达式）。它以与 `while` 和 `do-while` 循环中的 `test expression`相同的方式测试条件并控制循环的执行。只要该条件为\
  \ `true`，`for` 循环体就会重复。像 `while` 循环一样，`for` 循环是一个预测试循环，因此它在每次迭代之前都会评估 `test expression`。\n\
  \n第三个表达式是 `update expression`（更新表达式）。它在每次迭代结束时执行，在再次测试表达式之前执行。通常，这是一个增加循环计数变量的语句。\n\
  \n这里是一个打印五次“Hello”的简单 `for` 循环示例：\n\n```\nfor (count = 1; count <= 5; count++)\n\
  \    cout << \"Hello\" << endl;\n```\n\n在这个循环中，初始化表达式是 `count = 1`，测试表达式是 `count\
  \ <= 5`，更新表达式是 `count++`。循环体有一个语句，即 `cout` 语句。图 5-6 展示了循环执行期间发生的事件序列。请注意，只要测试表达式为\
  \ `true`，步骤 2 到 4 就会重复。\n\n# 图 5-6 for 循环的工作原理\n\n![一张图像显示了一个“for”循环并解释了它的元素。](img/FG_05_006.png)图\
  \ 5-6 完整备用文本\n\n图 5-7 以流程图的形式了循环的逻辑。\n\n# 图 5-7 打印五次语句的 for 循环逻辑\n\n![部分流程图显示了打印五次语句的“for”循环的逻辑。](img/FG_05_007.png)图\
  \ 5-7 完整备用文本\n\n注意计数变量 `count` 如何被控制循环迭代的次数。它从值 1 开始，并在每次循环迭代后递增。只要表达式 `count <=\
  \ 5` 保持为 `true`，循环就会再次迭代。然而，在第五次迭代之后，`count` 将变为 6。这会导致测试表达式变为假，因此循环将终止。还要注意，在这个示例中，变量\
  \ `count` 仅用于循环头以控制循环迭代的次数。它没有用于任何其他目的。然而，在循环体内部使用计数变量也是可能的。例如，看以下代码：\n\n```\nfor\
  \ (number = 1; number <= 5; number++)\n    cout << number << \" \";\n```\n\n此循环中的计数变量是\
  \ `number`。除了控制迭代次数外，它也被用于循环体。此循环将产生以下输出：\n\n```\n1 2 3 4 5\n```\n\n如你所示，循环在每次迭代期间显示\
  \ `number` 变量的内容。\n\n程序 5-12 是 程序 5-6 的新版本，它使用 `for` 循环代替 `while` 循环来显示数字 1–5 及其平方。\n\
  \n# `for` 循环是一个预测试循环\n\n由于 `for` 循环在执行迭代之前会测试其测试表达式，可以编写一个永远不会迭代的 `for` 循环。这里有一个示例：\n\
  \n```\nfor (count = 11; count <= 10; count++)\n    cout << \"Hello\" << endl;\n\
  ```\n\n由于变量 `count` 初始化为一个从一开始就让测试表达式为假的值，因此循环体从不会执行。这个循环一开始就会终止。\n\n## 避免在体中修改计数变量\n\
  \n由于 `for` 循环在执行迭代之前会测试其测试表达式，可以编写一个永远不会迭代的 `for` 循环。这里有一个示例：\n\n```\nfor (count\
  \ = 11; count <= 10; count++)\n    cout << \"Hello\" << endl;\n```\n\n由于变量 `count`\
  \ 初始化为一个从一开始就让测试表达式为假的值，因此循环体从不会执行。这个循环一开始就会终止。\n\n# 更新表达式的其他形式\n\n由于 `for` 循环在执行迭代之前会测试其测试表达式，可以编写一个永远不会迭代的\
  \ `for` 循环。这里有一个示例：\n\n```\nfor (count = 11; count <= 10; count++)\n    cout <<\
  \ \"Hello\" << endl;\n```\n\n由于变量 `count` 初始化为一个从一开始就让测试表达式为假的值，因此循环体从不会执行。这个循环一开始就会终止。\n\
  \n## 在初始化表达式中定义变量\n\n由于 `for` 循环在执行迭代之前会测试其测试表达式，可以编写一个永远不会迭代的 `for` 循环。这里有一个示例：\n\
  \n```\nfor (count = 11; count <= 10; count++)\n    cout << \"Hello\" << endl;\n\
  ```\n\n由于变量 `count` 初始化为一个从一开始就让测试表达式为假的值，因此循环体从不会执行。这个循环一开始就会终止。\n\n\n\n\n\n```cpp\n\
  for (int x = 1, y = 1; x <= 5; x++, y++)\n{\n    cout << x << \" plus \" << y <<\
  \ \" equals \" << (x + y) << endl;\n}\n```\n\n循环的更新表达式同时递增加了 `x` 和 `y` 变量。该循环产生的输出结果为：\n\
  \n```\n1 plus 1 equals 2\n2 plus 2 equals 4\n3 plus 3 equals 6\n4 plus 4 equals\
  \ 8\n5 plus 5 equals 10\n```\n\n在初始化表达式和更新表达式中允许用逗号连接多个语句，但在测试表达式中不允许。如果你想在测试表达式中组合多个表达式，必须使用\
  \ `&&` 或 `||` 运算符。\n\n这里是一个执行此操作的 `for` 循环头部示例：\n\n```cpp\nfor (int count = 1; count\
  \ <= 10 && moreData; count++)\n```\n\n只要 `count` `<=` `10` 且布尔变量 `moreData` 为真，该循环就会执行。一旦其中任何一个条件变为假，循环就会退出。\n\
  \n# 省省略 for` 循环的表达式或循环体\n\n虽然这通常被认为是不良的风格，但 `for` 循环的一个或多个表达式，甚至其循环体都可以被省略。\n\n\
  如果初始化已经执行过或不需要初始化，则可以在 `for` 循环的括号内省略初始化表达式。这里有一个在循环之前执行初始化的循环示例：\n\n```cpp\nint\
  \ num = 1;\nfor ( ; num <= maxValue; num++)\n    cout << num << \"      \" << (num\
  \ * num) << endl;\n```\n\n如果更新表达式在循环的其他地方执行或不需要，则可以省略该更新表达式。虽然不推荐这种类型的代码，但下面的 `for`\
  \ 循环工作方式与 `while` 循环一样：\n\n```cpp\nint num = 1;\nfor ( ; num <= maxValue; )\n{ \
  \ cout << num << \"      \" << (num * num) << endl;\n   num++;\n}\n```\n\n编写一个没有正式主体的\
  \ `for` 循环也是可能的，但不推荐这样做。在这种情况下，循环的所有工作都由循环头部的语句完成。这里有一个显示从 1 到 10 数字的示例。更新表达式中的组合递增操作和\
  \ `cout` 语句完成了每次迭代的工作。\n\n```cpp\nfor (number = 1; number <= 10; cout << number++);\n\
  ```\n\n## 检查点\n\n1. 5.10 `for` 循环头部的括号内出现了哪三个表达式？\n\n2. 5.11 你想写一个 `for` 循环来显示 50\
