  \ 6-29 使用了两个命名为 `calcWeeklyPay` 的函数，来确定员工的毛工资。该函数的一个版本使用一个 `int` 和一个 `double` 参数，而另一个版本只使用一个\
  \ `double` 参数。\n\n*(注：由于提供的原文中存在大量重复内容，上述翻译已根据逻辑进行了完整处理并保留了所有格式。)*\n\n\n\n\n```\n\
  \ 健身俱乐部会员菜单 \n1.₂标准成人会员\n2.₂儿童会员\n3.₂老年人会员\n4.₂退出程序\n\n1[回车] \n几个月？3[回车] \n调用了函数\
  \ showFees，参数如下：\n成员类型: 成人\n速率: 120.00\n月份: 3\n\n       健身俱乐部会员菜单\n1.₂标准成人会员\n2.₂儿童会员\n\
  3.₂老年人会员\n4.₂退出程序\n\n4[回车]\n```\n\n如你所见，通过用存根程序（stub）替换实际函数，你可以将测试工作集中在调用该函数的程序部分。主要，存根程序允许你确定程序是否在预期的时机调用了函数，并确认向函数传递了有效值。如果存根程序代表一个返回值的函数，那么该存根程序应该返回一个测试值。这可以帮助你确认返回值是否被妥善处理。当调用函数的程序部分调试到你满意时，就可以继续测试和调试函数本身了。这就是驱动程序（driver）变得有用的地方。\n\
  \n一个 `driver` 是一个通过简单调用函数来测试函数的程序。如果函数接受任何参数，驱动程序会传递测试数据。如果函数返回一个值，驱动程序会在屏幕上显示该返回值。这允许你看到函数在与其最终将所属的其他程序部分隔离开时的表现。程序\
  \ 6-31 是测试健身俱乐部会员程序中 `showFees` 函数的驱动程序。\n\n如 程序 6-31 所示，驱动程序可以用来测试函数。它可以使用不同的测试值作为参数反复调用函数。当函数的执行符合预期时，就可以将其放入它将所属的实际程序中。\n\
  \n# 6.17 小乐票案例研究\n\n## 问题描述\n\n杰斐逊初中的数学系希望开发一个程序，以一种娱乐的方式为学生们演示基础概率。特别是，他们想要一个名为“小乐票”的程序来模拟彩票。在程序中，学生可以指定选择集中的数字数量（1–12）以及顾客必须选择并与中奖号码匹配的数字数量（在\
  \ 1 到选择集大小之间）。所选数字的顺序并不重要。\n\n## 示例输出\n\n此示例输出准确地说明了该部门希望程序执行的操作。\n\n```\n 此程序将告诉你中奖“小乐票”的概率。\n\
  \n有多少个数字 (1-12) 可供选择？12\n你必须选择几个数字来玩？5\n\n你中奖彩票的机会是每 792 次中的 1 次。\n该概率为 0.0013\n\
  ```\n\n## 程序设计\n\n## 程序步骤\n\n程序必须执行以下通用步骤：\n\n1. 获取并验证可选数字的个数 (`n`)。\n2. 获取并验证这些数字中必须选择的个数\
  \ (`k`)。\n3. 计算从 `n` 个元素的集合中选择一组 `k` 个物品的组合数。\n4. 向玩家报告其中奖机会和中奖概率。\n\n## 程序模块\n\n\
  程序将被设计为一组模块，每个模块都有特定的功能。表 6-1 描述了将使用的模块：\n\n### 表 6-1 小乐票程序模块\n\n| 功能 | 描述 |\n|\
  \ --- | --- |\n| `main` | 此函数解释“游戏”、组织对其他函数的调用并报告结果。 |\n| `getLotteryInfo` | 此函数获取并验证可选数字的数量\
  \ (n) 和必须选择的数字数量 (k)。 |\n| `computeWays` | 此函数计算从 n 个数字中可以选出的大小为 k 的不同集合的数量。 |\n\
  | `factorial` | 此函数计算阶乘。它被 `computeWays` 调用。 |\n\n## 程序组织\n\n在之前的章节中，使用了层级图来说明程序必须执行的动作之间的关系。然而，在一个被组织成一组函数的程序中，层级图通常用于说明程序模块之间的关系。图\
  \ 6-15 展示了小乐票程序的组织结构。注意，它澄清了哪些函数调用了哪些其他函数。\n\n### 图 6-15 小乐票程序层级图\n\n![树图显示了小乐票程序的层级图。](img/FG_06_015.png)\
  \ 图 6-15 全文\n\n### 值将输入的变量\n```\nint pickFrom         // 可选数字的数量\nint numicks  \
  \       // 必须选择的数字数量\n```\n\n### 值将输出的变量\n```\nlong ways    // 选择的数量\n1.0 / ways\
  \       // 概率\n```\n\n## 每个模块伪代码\n\n在模块化程序中，应为每个函数创建一个独立的伪代码以捕捉其逻辑。以下是小乐票程序每个函数的伪代码。\n\
  \n```\n main \n    显示程序要做的功能\n    调用 getLotteryInfo       //  pickFrom 和 numPicks\n\
  \    调用 computeWays       // 返回选择的数量\n    将返回的结果存储在 ways 变量中\n    显示 ways 和 1\n\
  结束 main\n\ngetLotteryInfo                // 输入变量\n    输入 pickFrom\n    当 pickFrom\
  \ < 1 或 pickFrom > 12\n        显示错误消息\n        输入 pickFrom\n    结束\n    输入 numPicks\n\
  \    当 numPicks < 1 或 numPicks > pickFrom\n        显示错误消息\n        输入 numPicks\n\
  \    结束\n结束 getLotteryInfo\n\ncomputeWays      // 接收 pickFrom 为 n，numPicks 为 k\n\
  \    调用 factorial 3 次获取计算所需的信息\n    返回 factorial(n)\n    factorial(k) * factorial\
  \ (n-k)\n结束 computeWays\n\nfactorial      // 接收要计算阶乘的数字\n    factTotal = 1\n   \
  \ 循环从 count 到 1\n        factTotal = factTotal * count\n    结束循环\n    返回 factTotal\n\
  结束 factorial```\n\n## 程序\n\n在伪代码检查逻辑错误之后，下一步一步是将伪代码扩展为最终程序。这在 程序 6-32 所示。\n\n# 高险旅行社案例研究\n\
