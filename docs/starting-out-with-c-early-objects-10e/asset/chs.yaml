  \ 语句\n\n### 概念\n\n`if/else if` 语句是 `if` 语句的链。它们一个接一个执行测试，直到发现其中一个为真。\n\n我们通过使用一组不同但相关的规则做出某些心理决策。例如，我们可以通过参考以下规则决定穿什么种外套或夹克：\n\
