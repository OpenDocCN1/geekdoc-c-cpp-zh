  \n\n\n\n| `+  −` | 二元 | 加法和减法 |\n\n乘法、除法和模运算符具有相同的优先级。加法和减法运算符也是如此。表 3-2 显示了一些表达式及其值。\n\
  \n# 表 3-2 一些简单的 C++ 算术表达式及其值\n\n| 表达式 | 取值 |\n| --- | --- |\n| `5 + 2 * 4` | `13`\
  \ |\n| `10 / 2 − 3` | `2` |\n| `8 + 12 * 2 − 4` | `28` |\n| `4 + 17 % 2 − 1` | `4`\
  \ |\n| `6 − 3 * 2 + 7 − 1` | `6` |\n\n### 结合性\n\n结合性是运算符与其操作数作用的顺序。结合性*从左到右*或*从右到左*。除法运算符的结合性是从左到右，因此它将左侧的操作数除以右侧的操作数。表\
  \ 3-3 显示了算术运算符及其结合性。\n\n## 表 3-3 算术运算符的结合性\n\n| 运算符 | 结合性 |\n| --- | --- |\n| `(unary\
  \ negation) −` | 从右到左 |\n| `*  /  %` | 从左到右 |\n| `+ −` | 从左到右 |\n\n# 使用括号分组\n\n\
  数学表达式的部分可以使用括号分组，以强制某些操作在其他操作之前执行。当遇到一对括号时，括号内部的表达式将在其外部任何表达式之前求值。因此，在以下语句中，首先求值\
  \ `a` 加 `b`。然后将其和除以 4。\n\n```\naverage = (a + b) / 4;\n```\n\n如果没有括号，`b` 将在将 `a`\
  \ 加到结果**之前**除以 4，因为除法运算符的优先级高于加法运算符。表 3-4 显示了更多表达式及其值。\n\n## 表 3-4 更多算术表达式及其值\n\n\
  | 表达式 | 取值 |\n| --- | --- |\n| `(5 + 2) * 4` | 28 |\n| `10 / (5 − 3)` | 5 |\n| `8\
  \ + 12 * (6 − 2)` | 56 |\n| `(4 + 17) % 2 − 1` | 0 |\n| `(6 − 3) * (2 + 7) / 3`\
  \ | 9 |\n\n# 将代数表达式转换为编程语句\n\n在代数中，并不总是需要使用运算符进行乘法。然而，C++ 要求任何数学操作都使用运算符。表 3-5 显示了一些执行乘法的代数表达式和等效的\
  \ C++ 表达式。\n\n# 表 3-5 代数乘法表达式与 C++ 表达式对比\n\n| 代数表达式 | 操作 | C++ 等效 |\n| --- | ---\
  \ | --- |\n| 6B | 6 乘以 B | `6 * B` |\n| (3)(12) | 3 乘以 12 | `3 * 12` |\n| 4xy |\
  \ 4 乘以 x 乘以 y | `4 * x * y` |\n\n在将某些代数表达式转换为 C++ 时，你可能需要插入代数表达式中未出现的括号。例如，看以下表达式：\n\
  \n$$x = \\frac{a + b}{c}$$\n\n要将其转换为 C++ 语句，`a` + `b` 必须包含在括号内，以便在和除以 `c`**之前**将\
  \ `a` 加到 `b` 上。\n\n```\nx = (a + b) / c;\n```\n\n表 3-6 显示了更多代数表达式及其 C++ 等效表达式。\n\
  \n# 表 3-6 更多代数和 C++ 表达式\n\n| 代数表达式 | C++ 表达式 |\n| --- | --- |\n| $y = \\frac{x}{3}$\
  \ | `y = x / 3;` |\n| $z=3b+4$ | `z = 3 * b + 4;` |\n| $a = \\frac{3x+2}{4a-1}$\
  \ | `a = (3 * x + 2) / (4 * a − 1)` |\n\n# 请不要指数！\n\n与许多编程语言不同，C++ 没有指数运算符。将一个数字方幂需要使用*库函数*。C++\
  \ 库不是借书的地方，而是一个专门函数的集合。将库函数视为一个执行特定操作的“例程”。库函数之一名为 `pow`，它的作用是将数字提升到方幂。以下是它的用法示例：\n\
  \n```\narea = pow(4.0, 2);\n```\n\n此语句包含对 `pow` 函数的*调用*。括号内的数字是*参数*。（注：输入文本包含重复的句子，已为了清晰起见清理）。`pow`\
  \ 函数将第一个参数作为第二个参数的幂。\n\n\n\n\n\n$$\\begin{array}{lll} y & = & {6x} \\\\ a & = &\
  \ {2b + 4c} \\\\ y & = & x^{3} \\\\ g & = & \\frac{x + 2}{z^{2}} \\\\ y & = & \\\
  frac{x^{2}}{z^{2}} \\end{array}$$\n\n### 4. 3.12 研究以下程序代码，并完成后面的表格。\n\n```cpp\n\
  double value1, value2, value3;\ncout  << \"Enter a number: \";\ncin   >> value1;\n\
