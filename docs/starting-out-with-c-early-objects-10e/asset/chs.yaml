  }\n\n// 定义\nvoid mess(char str[])\n{\n   int step = 0;\n   while (str[step] != '\\\
  0')\n   {\n      if (str[step] == 'T')\n         step++;\n   }\n}\n```\n\n## 关于\
  \ string 类\n\n从编程的角度来看，标准库 `string` 类提供了许多优势。`string` 类拥有成员函数和重载运算符，可以简化在 C 字符串中定位字符或字符串的任务，这些任务在\
  \ C 字符串中执行是繁琐的。使用 `string` 类的程序必须 `#include` `string` 头文件。`string` 对象可以使用表 12-5\
  \ 所示的任何构造函数创建。\n\n### 表 12-5 构造函数\n\n| 定义 |  |\n| :--- | :--- |\n| `string()` |\
  \ 默认构造函数：创建一个空字符串。示例：`string str;` |\n| `string(const char *s)` | 构造函数：从 C 字符串创建字符串。示例：`string(\"\
  William\");` |\n| `string(const string &s)` | 拷贝构造函数：从现有字符串创建一个新字符串。示例：`string name(s);`\
  \ |\n\n`string` 类重载了表 12-6 所示的运算符。\n\n### 表 12-6 String 类运算符\n\n| 重载运算符 | 描述 |\n\
  | :--- | :--- |\n| `>>` | 从流中提取字符并插入字符串。复制字符直到遇到空白或输入结束。 |\n| `<<` | 将字符串插入流中。 |\n\
  | `=` | 将右侧字符串赋值给左侧字符串对象。 |\n| `+=` | 将右侧字符串的拷贝添加到左侧字符串对象。 |\n| `+` | 返回两个字符串拼接后的字符串。\
  \ |\n| `[ ]` | 实现下标法，如 `name[x]`。返回位置 `x` 字符的引用。 |\n| 关系运算符 | 实现了所有的关系运算符：`< > <=\
  \ >= !=` |\n\n`string` 类还有许多成员函数。例如，`size` 函数返回字符串的长度。表 12-7 列出了许多 `string` 类的成员函数及其重载变体。在某些情况下，传递给成员函数的参数可能导致请求的操作无法实现。在这种情况下，成员函数将通过抛出异常来信号错误的发生。异常在第\
  \ 16 章中讨论。\n\n### 表 12-7 `string` 类成员函数\n\n\n\n\n\n## 成员函数示例\n\n| 成员函数 | 描述 |\n\
  | --- | --- |\n| `theString.append(str);` | 将 `str` 追加到 `theString`。参数 `str` 可以是字符串对象或\
  \ C 字符串。 |\n| `theString.append(str, p, n);` | 将 `str` 中从位置 `p` 开始的 `n` 个字符追加到 `theString`。如果\
  \ `str` 中从 `p` 开始的子串小于 `n` 个字符，则抛出异常。 |\n| `theString.append(str, n);` | 将 C 字符串\
  \ `str` 的前 `n` 个字符追加到 `theString`。 |\n| `theString.append(n, ch);` | 将 `n` 个字符 `ch`\
  \ 追加到 `theString`。 |\n| `theString.assign(str);` | 将 `str` 赋值给 `theString`。参数 `str`\
  \ 可以是字符串对象或 C 字符串。 |\n| `theString.assign(str, p, n);` | 将 `str` 中从位置 `p` 开始的 `n`\
