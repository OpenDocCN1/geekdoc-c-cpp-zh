  \ `<<`，用于类对象的输出。\n\n# 9. 有理数运算 II\n\n修改编程挑战 8 中的 `Rational` 类，添加重载的运算符 `+`、`-`、`*`\
  \ 和 `/`，用于加、减、乘、除法。通过从键盘（或文件）读取并处理一系列有理表达式来测试该类，例如：\n\n```\n2 / 3 + 2 / 8\n2 / 3\
  \ * – 2 / 8\n2 / 3 – 2/ 8\n2 / 3 / 2 / 8\n```\n\n为了方便解析输入，你可以假设数字和算术运算符之间用空格分隔。\n\
  \n# 10. 姓名与分数 HTML 表格\n\n编写一个类，其构造函数接收一个 `Student` 对象向量，其中每个 `Student` 有一个类型为 `string`\
  \ 的名称和一个类型为 `int` 的分数。该类在内部存储传递给构造函数的数据。该类应该有一个重载的输出运算符，以 HTML 表格的形式输出其数据。设计合适的输入并使用它测试你的类。\n\
  \n# 第 12 章更多 C 字符串和 `string` 类\n\n## 12.1 字符测试\n\n### 概念\n\nC++ 库提供了几个测试字符的函数。要使用这些函数，你必须包含\
  \ `<cctype>` 头文件。\n\nC++ 库提供了几个允许你测试字符值的函数。这些函数测试单个 `char` 参数并返回 `true` 或 `false`。例如，下面的程序段使用\
  \ `isupper` 函数来判断作为参数传递的字符是否大写字母。如果是，该函数返回 `true`；否则，返回 `false`。\n\n```\nchar letter\
  \ = 'a';\nif (isupper(letter))\n   cout << \"Letter is uppercase.\\n\";\nelse\n\
  \   cout << \"Letter is lowercase.\\n\";\n```\n\n由于在这个示例中变量 `letter` 包含一个小写字符，`isupper`\
  \ 返回 `false`。`if` 语句将导致显示消息 `\"Letter is lowercase\"`。\n\n表 12-1 列出了几个字符测试函数。这些每个函数在\
  \ `<cctype>` 头文件中都有原型声明，因此在使用这些函数时务必包含该文件。\n\n### 表 12-1 `<cctype>` 中的字符测试函数\n\n\
  | 字符函数 | 描述 |\n| --- | --- |\n| `isalpha` | 如果参数是字母表字母，返回 `true`（非零值）。如果参数不是字母，则返回\
  \ 0。 |\n| `isalnum` | 如果参数是字母表字母或数字，返回 `true`（非零值）。否则，返回 0。 |\n| `isdigit` | 如果参数是\
  \ 0 到 9 之间的数字，返回 `true`（非零值）。否则，返回 0。 |\n| `islower` | 如果参数是小写字母，返回 `true`（非零值）。否则，返回\
  \ 0。 |\n| `isprint` | 如果参数是可打印字符（包括空格），返回 `true`（非零值）。否则返回 0。 |\n| `ispunct` | 如果参数是数字、字母或空格以外的可打印字符，返回\
  \ `true`（非零值）。否则，返回 0。 |\n| `isupper` | 如果参数是大写字母，返回 `true`（非零值）。否则，返回 0。 |\n| `isspace`\
  \ | 如果参数是空白字符，返回 `true`（非零值）。空白字符是以下任意一个：空格 `' ''`,垂直制表符 `'\\v'`,换行符 `'\\n'`, 制表符\
  \ `'\\t'`。否则返回 0。 |\n\n程序 12-1 使用表 12-1 显示的几个函数。它要求用户输入一个字符，然后根据每个函数的返回值显示不同的消息。\n\
  \n程序 12-2 显示了字符测试函数的更多实际应用。它要求用户输入一个字符，然后根据每个函数的返回值显示不同的消息。在这种情况下，`isalpha` 函数测试字符是否为字母。`isdigit`\
  \ 函数测试它是否为数字。`islower` 和 `isupper` 测试大小，`isprint` 测试可打印字符，`ispunct` 测试标点符号。`isspace`\
  \ 测试空白字符。\n\n## 12.2 字符转换\n\n### 概念\n\nC++ 库提供了两个函数 `toupper` 和 `tolower` 用于转换字符的大小。这些函数在表\
  \ 12-2 中描述（这些函数在头文件 `<cctype>` 中原型声明，请务必包含它）。\n\n### 表 12-2 大小转换函数\n\n| 函数 | 描述\
  \ |\n| --- | --- |\n| `toupper` | 返回其参数的大写等效项。 |\n| `tolower` | 返回其参数的小写等效项。 |\n\
  \n\n\n\n\n`Program 12-3` 在输入验证循环演示了 `toupper` 函数。\n\n在第 28 行和第 29 行中，程序提示用户输入 `Y`\
  \ 或 `N` 来指示其是否想计算另一个面积。我们不希望程序如此挑剔，只接受大写的 `Y` 或大写的 `N`。小写的 `y` 或小写的 `n` 也是可以的。输入验证循环必须写为拒绝除\
  \ `'Y'`、`'y'`、`'N'` 或 `'n'` 之外的所有内容。实现这一点的方法是在四个关系表达式中测试 `goAgain` 变量，所示：\n\n```\n\
  while (goAgain != 'Y' && goAgain != 'y' &&\n      goAgain != 'N' && goAgain != 'N')\n\
  ```\n\n虽然这段代码没有问题，但我们可以使用 `toupper` 函数来获取 `goAgain` 的大写形式并仅进行两次比较。这是第 32 行采用的方法：\n\
  \n```\nwhile (toupper(goAgain) != 'Y' && toupper(goAgain) != 'N')\n```\n\n另一种方法是使用\
  \ `tolower` 函数来获取 `goAgain` 的小写形式。这里是一个示例：\n\n```\nwhile (tolower(goAgain) != 'y'\
  \ && tolower(goAgain) != 'n')\n```\n\n这两种方法将产生相同的结果。\n\n## 检查点 (Checkpoint)\n\n\
  1. 12.1 为以下每个函数写一个简短描述：\n\n```\nisalpha\nisalnum\nisdigit\nislower\nisprint\nispunct\n\
  isupper\nisspace\ntoupper\ntolower\n```\n\n2. 12.2 写一条语句，将 `char` 变量 `big` 的内容转换为小写。转换后的值应赋值给变量\
  \ `little`。\n\n3. 12.3 写一个 `if` 语句，如果变量 `ch` 包含数字，则显示单词“digit”。否则，应显示“Not a digit.”。\n\
  \n4. 12.4 下述语句的输出是什么？\n\n```\ncout << toupper(tolower('A'));\n```\n\n5. 12.5 写一个循环，询问用户“你想重复程序还是退出？(R/Q)”。该循环应一直重复，直到用户输入\
  \ R 或 Q（大写或小写均可）。\n\n# 12.3 C 字符串 (C-Strings)\n\n### 概念\n\nC 字符串是存储在连续内存位置的字符序列，并以空字符（null\
  \ character）终止。\n\n许多程序大量地使用字符串。C++ 提供了两种用于处理字符串的不同数据类型：C 字符串和 `string` 类。`string`\
  \ 类库有许多处理字符串的函数。这些函数执行许多实用的字符串相关功能，并具有 C 字符串处理函数所缺乏的编程安全措施。由于由于这些原因，你应该优选使用 `string`\
  \ 类而不是 C 字符串。\n\n尽管如此，每个 C++ 程序员都应该对 C 字符串有良好的理解。`string` 类是构建在 C 字符串之上的，因此理解 C\
  \ 字符串有助于你理解 `string` 类。此外，许多程序是在 `string` 类库被纳入 C++ 标准之前编写的。此类程序需要理解 C 字符串的程序员来维护。最后，编写和维护低级代码（如\
  \ `string` 类库和操作系统部分）的程序员必须使用 C 字符串来表示字符串数据。\n\nC 字符串是存储在连续内存位置的字符序列，并以空字符终止。回想空字符是\
  \ ASCII 代码为 0 的字符。在程序中，空字符通常写为 `\\0`。在程序中使用整数 `0` 或常量 `NULL` 来表示空字符也是常见的。因此，以下所有语句都将空字符存储到字符变量中：\n\
  \n```\nchar ch1, ch2, ch3;\nch1 = '\\0';\nch2 = 0;\nch3 = NULL;\n```\n\n由于数组是存储相同类型值的连续内存位置的序列，因此\
  \ C 字符串实际上是一个空字符终止的字符数组。C 字符串可以以以下三种形式之一出现在程序中：\n\n*   “硬编码”字符串字面量\n*   程序员定义的字符数组\n\
  *   指向字符的指针\n\n无论 C 字符串在程序中以这三种形式中的哪一种出现，C 字符串始终是一个空字符终止的字符数组，并在程序中通过指向数组中第一个字符的指针表示。换句话说，C\
  \ 字符串的类型是\n\n```\nchar *\n```\n\n也就是说，C 字符串的类型是 `指向字符的指针`。\n\n# 字符串字面量 (String Literals)\n\
  \n字符串字面量，也称为字符串常量，以双引号括括的字符序列的形式直接写入程序中：例如，\n\n```\n\"What is your name?\"\n\"Bailey\"\
  \n```\n\n它们都是字符串字面量。\n\n当编译器遇到如 `\"Bailey\"` 这样的字符串字面量时，它分配一个七个字符的数组，将 `\"Bailey\"\
  ` 的六个字符存储在数组的前六个位置中，然后在最后一个位置中存储空字符，如图 12-1。\n\n当编译器遇到如 `\"Bailey\"` 的字符串字面量时，它分配一个七个字符的数组，将\
  \ `\"Bailey\"` 的六个字符存储在数组的前六个位置，然后在最后一个位置存储空字符，如图 12-1。\n\n# 图 12-1 内存中的 C 字符串\n\
