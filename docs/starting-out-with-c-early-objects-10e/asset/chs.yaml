  \n## 编程挑战\n\n## 1. 支票编写\n\n设计一个类 `Numbers`，用于将 0 到 9999 范围内的整数美元金额转换为数字的英文描述。例如，数字\
  \ 713 将翻译为字符串 `seven hundred thirteen`，而 8203 将翻译为 `eight thousand two hundred three`。\n\
  \n该类应该有一个整型成员变量：\n\n```cpp\nint number;\n```\n\n以及一组静态字符串成员集合，用于指定如何将关键美元金额转换为所需的格式。例如，你可能会使用如下静态字符串：\n\
  \n```cpp\nstring lessThan20[ ] =\n    {\"zero\", \"one\", …, \"eighteen\", \"nineteen\"\
  \ };\nstring hundred = \"hundred\";\nstring thousand = \"thousand\";\n```\n\n该类应该有一个构造函数，接受一个非负整数并用它来初始化\
  \ `Numbers` 对象。它应该有一个成员函数 `print()`，打印 `Numbers` 对象的英文描述。通过编写一个主程序来演示该类，要求用户输入一个适当范围内的数字，然后打印其英文描述。\n\
  \n## 2. 年中的一天\n\n假设一年有 365 天，编写一个名为 `DayOfYear` 的类，它接收一个代表一年中天的整数，并将其转换为由月份加日期字符串。例如：\n\
  \n*   第 2 天将是 `January 2`。\n*   第 32 天将是 `February 1`。\n*   第 365 天将是 `December\
  \ 31`。\n\n该类的构造函数接受代表一年中天的整数作为参数，该类应该有一个成员函数 `print()`，以“月-日”格式打印该日期。该类应该有一个整型成员变量来表示天，并应该有\
  \ `string` 类型的静态成员变量来协助从整数格式转换为“月-日”格式。\n\n通过输入代表天的各种整数并打印它们在“月-日”格式下的表示来测试你的类。\n\
  \n## 3. 年中的一天修改\n\n修改之前编程挑战中编写的 `DayOfYear` 类，添加一个接受两个参数的构造函数：一个代表月份的字符串和一个 0 到\
  \ 31 范围内的代表日期的整数。构造函数随后应该初始化类的整型成员，以表示由月份和日期参数指定的日期。如果输入的日期数字超出给定月份的天数范围，则构造函数应带有适当的错误信息并终止程序。\n\
  \n添加以下重载操作符：\n\n*   `++` 前置和后置递增运算符。这些运算符应该修改 `DayOfYear` 对象，使其代表下一天。如果该日期已经是年底，则对象的新值将代表年的第一天。\n\
  *   `--` 前置和后置递减运算符。这些运算符应该修改 `DayOfYear` 对象，使其代表前一天。如果该日期已经是年的第一天，则对象的新值将代表年的最后一天。\n\
  \n## 4. 工作天数\n\n设计一个名为 `NumDays` 的类。该类的目的是存储一个代表工作小时数的值并将其转换为天数。例如，8 小时将转换为 1 天，12\
  \ 小时将转换为 1.5 天，18 小时将转换为 2.25 天。该类应该有一个接受小时数的构造函数，以及用于存储和检索小时数与天数的成员函数。该类还应该有以下重载操作符：\n\
  \n*   加法操作符 `+`。两个对象之和的小数是两个单独对象小时数之和。\n*   减法操作符 `−`。两个对象 `X` 和 `Y` 之差的小时数是 `X`\
  \ 的小时数减去 `Y` 的小时数。\n*   前置和后置递增运算符 `++`。对象中的小时数加 1。\n*   前置和后置递减运算符 `−−`。对象中的小时数减\
  \ 1。\n\n## 5. 回文测试\n\n回文是一个正向和反向读都相同的字符串。例如，`mom`、`dad`、`madam` 和 `radar` 都是回文。编写一个派自\
  \ STL `string` 类的 `Pstring` 类。`Pstring` 类增加了一个成员函数：\n\n```cpp\nbool isPalindrome()\n\
  ```\n\n用于确定字符串是否为回文。包含一个接受 STL `string` 对象作为参数并将其传递给 `string` 基类构造函数的构造函数。通过一个主程序测试你的类，要求用户输入一个字符串。程序使用该字符串初始化\
  \ `Pstring` 对象，然后调用 `isPalindrome()` 判断输入的字符串是否为回文。\n\n你可能会发现字符串类的下标运算符 `[]` 很有用：如果\
  \ `str` 是字符串对象且 `k` 是整数，那么 `str[k]` 返回字符串中位置为 `k` 的字符。\n\n## 6. 字符串加密\n\n编写一个派自\
  \ STL `string` 类的 `EncryptableString`。`Encryptable` 字符串增加了一个成员：\n\n```cpp\nvoid\
