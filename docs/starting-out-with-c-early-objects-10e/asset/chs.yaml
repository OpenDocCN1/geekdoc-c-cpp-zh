  \ 运算符之间的区别。\n\n4.  13.24 `write` 成员函数的两个参数的作用是什么？\n\n5.  13.25 `read` 成员函数的两个参数的作用是什么？\n\
  \n\n\n\n## 6. 13.26 描述字段与记录之间的关系。\n\n## 7. 13.27 假设程序存在以下结构声明、变量和文件流对象定义：\n\n```cpp\n\
  const int NAME_SIZE = 51;\nstruct Data\n{\n   char customer[NAME_SIZE];\n   int\
  \ num;\n   double balance;\n};\nData cust;\nfstream file(\"stuff\", ios::out | ios::binary);\n\
  ```\n\n编写一条语句，使用 `write` 成员函数将 `cust` 的内容存储文件中。\n\n# 13.6 随机访问文件\n\n### 概念\n\n随机访问意味着非顺序地访问文件中的信息。\n\
  \n本章中目前为止创建的所有程序都执行了`顺序文件访问`。当打开文件时，读取和/或写入的位置位于文件的开头（除非使用 `ios::app` 模式，该模式会将数据写入文件的末尾）。如果以输出模式打开文件，字节将一个接一个地写入其中。如果以输入模式打开文件，数据将从第一个字节开始读取。随着读取或写入的持续，文件流对象的读/写位置将顺序通过文件内容移动。\n\
  \n顺序文件访问的问题是，为了读取文件中某个特定的字节，必须先读取它之前的所有字节。例如，如果程序需要存储文件中第 100 个字节处的信息，它将不得不读取前 99\
  \ 个字节才能到达那里。如果你曾经在磁带上搜索过歌曲，你就理解顺序访问。要找到一首歌，你必须听它之前的所有歌曲，或者快进过它们。没有办法立即跳转到那首特定的歌曲。\n\
  \n尽管顺序文件访问在很多情况下很有用，但它会极大地降低程序速度。如果文件很大，定位隐藏在深处的信息可能需要很长时间。或者，C++ 允许程序执行`随机文件访问`。在随机文件访问中，程序可以立即跳转到文件的任何字节，而无需先读取之前的字节。顺序访问和随机访问之间的区别就像磁带和光盘的区别。在听\
  \ CD 时，不需要听或快进过不需要的歌曲。你只需要跳转到你想听的曲目即可。这在图 13-4 中所示。\n\n# 图 13-4 顺序访问与随机访问\n\n![一张图表说明了顺序访问和随机访问。在顺序访问中，箭头从一个存储矩形指向下一个矩形。在随机访问中，箭头以无特定模式从一个矩形指向另一个矩形。](img/FG_13_004.png)\n\
  \n# `seekp` 和 `seekg` 成员函数\n\n文件流对象有两个成员函数用于将读/写位置移动到文件中的任何字节。它们是 `seekp` 和 `seekg`。`seekp`\
  \ 函数用于以输出模式打开的文件，`seekg` 用于以输入模式打开的文件。（如果你记得“p”代表“put”（放入）而“g”代表“get”（获取），那么这就有意义了。`seekp`\
  \ 用于你放入信息的文件，而 `seekg` 用于你从中获取信息的 le。）\n\n以下是 `seekp` 的用法示例：\n\n```cpp\nfile.seekp(20L,\
  \ ios::beg);\n```\n\n第一个参数是一个表示文件偏移量的 `long` 整数。这是你想要移动到的字节数。在例例中，使用了 `20L`。（记住，L\
  \ 后缀强制编译器将该数字视为长型整数。）该语句将文件的写位置移动到第 20 字节。（所有编号都从 0 开始，所以第 20 号字节实际上是第 21 个字节。）\n\
  \n第二个参数称为模式标志，它指定了从哪里开始计算偏移量。标志 `ios::beg` 意味着偏移量从文件开始计算。或者，偏移量也可以从文件末尾或文件的当前位置计算。表\
  \ 13-5 列出了所有三种随机访问模式的标志。\n\n# 表 13-5 文件定位标志\n\n| 模式标志 | 描述 |\n| --- | --- |\n| `ios::beg`\
  \ | 偏移量从文件开始计算。 |\n| `ios::end` | 偏移量从文件末尾计算。 |\n| `ios::cur` | 偏移量从当前位置计算。 |\n\n\
  表 13-6 显示了 `seekp` 和 `seekg` 的示例。\n\n# 表 13-6 定位操作\n\n| 语句 | 对读写位置的影响 |\n| --- |\
  \ --- |\n| `file.seekp(32L, ios::beg);` | 将位置置于文件开头的第 32 个字节。 |\n| `file.seekp(-10L,\
  \ ios::end);` | 将位置从文件末尾向前移动 10 个字节。 |\n| `file.seekp(120L, ios::cur);` | 将位置从当前位置向前移动\
  \ 120 个字节。 |\n| `file.seekg(2L, ios::beg);` | 将位置置于文件开头的第 2 个字节。 |\n| `file.seekg(-100L,\
  \ ios::end);` | 将位置从文件末尾向后移动 100 个字节。 |\n| `file.seekg(40L, ios::cur);` | 将位置从当前位置向前移动\
  \ 40 个字节。 |\n| `file.seekg(0L, ios::end);` | 将位置置于文件末尾。 |\n\n注意表 13-5 中的某些示例使用了负偏移量。负偏移量导致读写位置向后移动，而正偏移量导致向前移动。假设\
  \ `letters.txt` 文件包含以下内容：\n\n```\nabcdefghijklmnopqrst\n```\n\n程序 13-14 使用了 `seekg`\
  \ 函数在不同位置跳转。程序 13-15 显示了 `seekg` 函数的另一个示例。它打开了程序 13-12 创建的 `people.dat` 文件。该文件包含两个记录。程序\
  \ 13-15 首先显示记录 1（第二个记录），然后显示记录 0。\n\n该程序除了 `main` 之外还有两个重要的函数。第一个 `byteNum` 以记录数作为参数并返回该记录的起始字节。它通过记录数乘以\
  \ `Info` 结构的大小来计算记录的起始字节。第二个函数 `showRec` 接受一个 `Info` 结构作为参数并显示其内容。\n\n# `tellp`\
  \ 和 `seekg` 成员函数\n\n文件流对象还有两个可用于随机访问函数：`tellp` 和 `seekg`。它们的目的是作为 `long` 整数返回文件读/写位置的当前字节数。正如你猜的那样，`tellp`\
  \ 返回写入位置，而 `seekg` 返回读取位置。假设 `pos` 是一个 `long` 整数，以下是这些函数的示例：\n\n```cpp\npos = outFile.tellp();\n\
  pos = inFile.tellg();\n```\n\n程序 13-16 演示了 `tellg` 函数。它打开了 `letters.txt` 文件，该文件在程序\
  \ 13-14 中也被使用过。\n\n# 13.7 同时以输入和输出模式打开文件\n\n\n\n\n\n### 概念\n\n你可以对 `fstream` 文件执行输入和输出，而无需关闭并重新打开它。\n\
  \n有时你需要更新存储在文件中的数据。为了实现这一点，你需要打开文件，将部分数据复制到内存中，进行修改，将数据写回文件，然后关闭文件。通过使用 `|` 运算符结合\
  \ `ios::in` 和 `ios::out` 标志，可以为了输入和输出打开文件：\n\n```\nfstream file(\"data.dat\", ios::in\
  \ | ios::out)\n```\n\n相同的操作可以通过 `open` 成员函数完成：\n\n```\nfile.open(\"data.dat\", ios::in\
  \ | ios::out);\n```\n\n如果需要向文件中写入二进制数据，还可以指定 `ios::binary` 标志。这是一个示例：\n\n```\nfile.open(\"\
  data.dat\", ios::in | ios::out | ios::binary);\n```\n\n当 `fstream` 文件同时使用 `ios::in`\
  \ 和 `ios::out` 标志打开时，文件的当前内容将被保留，读/写位置初始置在文件开头。如果文件不存在，则会创建它（除非同时也使用了 `ios::nocreate`）。\n\
