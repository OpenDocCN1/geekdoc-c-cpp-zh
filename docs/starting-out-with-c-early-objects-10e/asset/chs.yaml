  \ | |\n| 4.3 | | |\n| 6 | | |\n\n### 5. 3.13 完成以下程序骨架，使其显示圆柱形燃料罐的体积。圆柱体体积的公式为\n\n\
  volume = π*r*²*h*\n\n其中\n\n* `π` 是 3.14159\n* `r` 是罐的半径\n* `h` 是罐的高度\n\n```cpp\n\
  #include <iostream>\n#include <cmath>\n\nint main()\n{\n   double volume, radius,\
  \ height;\n   cout << \"This program will tell you the volume of\\n\";\n   cout\
  \ << \"a cylinder-shaped fuel tank.\\n\";\n   cout << \"How tall is the tank? \"\
  ;\n   cin  >> height;\n   cout << \"What is the radius of the tank? \";\n   cin\
  \  >> radius;\n\n   // 你必须完成该程序。\n   return 0;\n}\n```\n\n# 3.3 数据类型转换与类型转换\n\n\
  ### 概念\n\n有时需要将一个值从一种数据类型转换为另一种。C++ 提供了实现的方法。\n\n如果将一个浮点值赋值给 `int` 变量，该变量将接收什么值？如果一个\
  \ `int` 乘以一个 `float`，结果将是什么数据类型？如果一个 `double` 除以一个 `unsigned` `int` 会怎样？有什么方法可以预测这些情况下会发生什么吗？答案是肯定的。当运算符的操作数数据类型不同时，C++\
  \ 会自动将它们转换为相同的数据类型。在这样做时，它遵循一套规则，理解这些规则将帮助你防止微妙的错误侵入你的程序。\n\n就像军队中的军官一样，数据类型也是分优先级的。如果一个数值数据类型可以存储更大的数字，它的优先级就高于另一种。例如，`float`\
  \ 的优先级高于 `int`，而 `double` 的优先级高于 `float`。表 3-7 按照排名从高到低的顺序列出了数值数据类型。\n\n## 表 3-7\
  \ 数据类型排名\n\n| `long double` | `double` | `float` | `unsigned long int` | `long long\
  \ int` | `unsigned long int` | `long int` | `unsigned int` | `int` |\n| --- | ---\
  \ | --- | --- | --- | --- | --- | --- | --- |\n\n表 3-7 排名中的一个例外是 `int` 和 `long int`\
  \ 尺寸相同时。在这种情况下，`unsigned int` 的优先级高于 `long int`，因为它可以存储更高的值。\n\n当 C++ 处理运算符时，它力求将操作数转换为相同类型。这种隐式的、或自动的转换被称为*类型强制转换*（type\
  \ coercion）。当一个值被转换为更高的数据类型时，被称为*提升*（promoted）。将一个值进行*降级*（demote）意味着将其转换为较低低的数据类型。让我们来看一下控制表达式求值的具体规则。\n\
  \n**规则 1：** `char`、`short` 和 `unsigned short` 值会被自动提升为 `int`。你会发现 `char`、`short`\
  \ 和 `unsigned short` 没有出现在表 3-7 中。这是因为每当这些数据类型的值在数学表达式中使用时，它们都会被自动提升为 `int`。\n\n\
  **规则 2：** 当运算符处理两个不同类型的值时，较低优先级的值会被提升为较高优先级值的类型。在以下表达式中，假设 `years` 是一个 `int` 变量，`interestRate`\
  \ 是一个 `double` 变量：\n\n```\nyears * interestRate\n```\n在乘法之前，`years` 中的值将被提升为 `double`。\n\
  \n**规则 3：** 当表达式的最终值赋值给变量时，它将转换为该变量的数据类型。在以下语句中，假设 `area` 是一个 `long int` 变量，而 `length`\
  \ 和 `width` 都是 `int` 变量：\n\n```cpp\narea = length * width;\n```\n由于存储在 `length`\
  \ 和 `width` 中的值具有相同的数据类型，任何一个都不会转换为其他数据类型。然而，乘法的结果将提升为 `long`，以便存储在 `area` 中。\n\n\
  但如果接收值的变量类型比值的类型低呢？在这种情况下，该值将被降级。\n\n\n\n由于括号内的操作在其他操作之前执行，因此除法运算符会对它的两个整数操作数执行整数除法，表达式\
  \ `books / months` 的结果将为 4。随后，4 将转换为 `double` 类型的值 4.0，该值将被赋值给 `booksPerMonth`。\n\
  \n### 警告！\n\n为了防止整数除法的发生，应该在执行除法操作之前将其中一个操作数转换为 `double`。这迫使 C++ 自动将另一个操作数的值转换为\
  \ `double`。\n\n程序 3-8 显示了类型转换的另一种用法。\n\n让我们仔细观察这个程序。在第 7 行中，`int` 变量 `number` 被初始化为值\
  \ 65。在第 10 行，`number` 被发送到 `cout`，导致显示 65。在第 14 行，使用类型转换表达式在将其发送到 `cout` 之前将 `number`\
  \ 中的值转换为 `char` 数据类型。回想 第 2 章 字符是以整数 ASCII 码存储在内存中的。因为数字 65 是字母‘A’的 ASCII 码，因此第\
  \ 14 行的语句导致显示了字母‘A’。\n\n### Note\n\nC++ 提供了几种不同的类型转换表达式。`static_cast` 是最常用的类型转换表达式，因此它是我们在书中主要使用的类型转换。关于类型转换的更多信息包含在本书配套网站\
  \ [pearsonhighered.com/gaddis](http://pearsonhighered.com/gaddis) 的 附录 K 中。\n\n\
  # C 风格和旧标准 C++ 类型转换表达式\n\n尽管 `static_cast` 是目前首选的类型转换表达式，但 C++ 也支持两种你应该了解的旧形式：C\
  \ 风格形式和旧标准 C++ 形式。C 风格转换将要转换的数据类型放在圆括号内，并放在要转换值的操作数之前。由于类型转换运算符在操作数之前，这种类型转换表示法被称为前缀表示法。这是一个例子：\n\
  \n```\nbooksPerMonth = (double)books / months;\n```\n\n旧标准 C++ 形式的类型转换表达式也将要转换的数据类型放在要转换值的操作数之前，但它将括号放在操作数周围而不是数据类型周围。这种类型转换表示法被称为函数表示法。这是一个例子：\n\
  \n```\nbooksPerMonth = double(books) / months;\n```\n\n## Checkpoint\n\n1. 3.14\
  \ 假设有以下变量定义：\n\n    ```\n    int a = 5, b = 12;\n    double x = 3.4, z = 9.1;\n\
  \    ```\n\n    以下表达式的值是什么？\n\n    1. `b / a`\n    2. `x * a`\n    3. `static_cast<double>(b\
  \ / a)`\n    4. `static_cast<double>(b) / a`\n    5. `b / static_cast<double>(a)`\n\
  \    6. `static_cast<double>(b) / static_cast<double>(a)`\n    7. `b / static_cast<int>(x)`\n\
  \    8. `static_cast<int>(x) * static_cast<int>(z)`\n    9. `static_cast<int>(x\
  \ * z)`\n    10. `static_cast<double>(static_cast<int>(x) * static_cast<int>(z))`\n\
  \n2. 3.15 如果在 `cin` 语句要求用户输入字母时输入大写字母 B，以下程序代码将显示什么？\n\n```\nchar letter;\n\ncout\
  \ << \"The ASCII values of uppercase letters are \"\n     << static_cast<int>('A')\
  \ << \" − \"\n     << static_cast<int>('Z') << endl;\n\ncout << \"The ASCII values\
  \ of lowercase letters are \"\n     << static_cast<int>('a') << \" − \"\n     <<\
  \ static_cast<int>('z') << endl << endl;\n\ncout << \"Enter a letter and I will\
