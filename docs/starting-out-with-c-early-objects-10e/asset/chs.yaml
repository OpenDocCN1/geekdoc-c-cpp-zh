  \n2.  11.49 你认为为什么基类构造函数的参数要在派生类构造函数的定义中指定？\n\n3.  11.50 向基类构造函数传递参数解决了继承中选择基类构造函数的问题。组合中是否也会出现类似的问题？也就是说，是否存在这样的情况：类的构造函数可能需要向包含的类的构造函数传递参数？如果是这样，猜测传递参数的语法，并构造一个简单的示例来验证你的猜测。\n\
