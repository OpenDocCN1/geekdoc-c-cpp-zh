  \ 18-8 添加 12.6 之后的完整备用文本\n\n## 排序顺序的链表\n\n有时，将添加到链表中的元素保持在排序状态是有用的的。例如，列表可以按升序维护其元素，这意味着列表中的每个元素都小于或等于它的后继元素。在这种情况下，我们不能像在\
  \ `NumberList` 类的 `add` 函数中那样通过将元素放在列表末尾来添加，因为这样做将违反列表中元素的顺序。我们需要一种不同的方法。\n\n考虑一个按升序维护其元素的\
  \ `SortedNumberList` 类。它与 `NumberList` 类相似，不同之处在于对 `add` 函数进行了修改，使其在放置新元素时保持列表的排序状态。由于排序列表（*sorted\
  \ list*）仍然是一个列表，因此使用继承并派生自 `NumberList` 是有意义的。\n\n## ## `SortedNumberList.h` 内容\n\
  \n```cpp\n 1 #include \"NumberList.h\"\n 2 class SortedNumberList : public NumberList\n\
  \ 3 {\n 4 public:\n 5     void add(double number);  \n 6 };\n```\n\n## 在排序列表中插入节点\n\
  \n假设我们有一个按升序排序的数字链表。我们想编写 `add` 函数，使其将其参数 `number` 插入到列表的某个位置，使列表保持排序状态。\n\n需要考虑两种情况。第一种是新插入的数字应该放在列表中已有的每个节点之前。当列表为空，或者列表中的第一个数字大于或等于\
  \ `number` 时会发生这种情况：\n\n```cpp\n if (head == nullptr || head−>value >= number)\n\
  \   head = new ListNode(number, head);\n```\n\n注意，这两个测试的顺序不应反转：你应该在尝试访问 `head−>value`\
  \ 之前确保 `head` 不为 `nullptr`：如果 `head` 为 `nullptr`，评估表达式 `head−>value` 将导致运行时错误。\n\
  \n应该考虑的第二种情况是新数字需要放在列表中已有的节点之后。在这种情况下，新数字将需要放在第一个值大于或等于 `number` 的节点之前。为了找到这样的节点，我们使用一个名为\
  \ `nodePtr` 的指针。我们将 `nodePtr` 置于第二个节点开始，然后在列表中不断向前移动它，直到它移出列表末尾（当 `nodePtr` 变为 `nullptr`\
  \ 时发生这种情况）或它指向一个值大于或等于 `number` 的节点（当表达式 `nodePtr−>value >= number` 变为真时发生这种情况）。为了在\
  \ `nodePtr` 之前插入新节点，我们需要一个指向 `nodePtr` 所指节点的前一个节点的指针。为此，我们使用指针 `previousNodePtr`，它始终指向\
  \ `nodePtr` 所指节点的前节点。寻找插入点的整个过程通过以下代码完成：\n\n```cpp\n previousNodePtr = head;\nnodePtr\
  \ = head−>next;\n\n// 寻找插入点\nwhile (nodePtr != nullptr && nodePtr−>value < number)\n\
  {\n   previousNodePtr = nodePtr;\n   nodePtr = nodePtr−>next;\n}\n```\n\n整个函数（包括创建新节点并将其插入在\
  \ `previousNodePtr` 之后但 `nodePtr` 之前的代码）如下：\n\n## ## `SortedNumberList.h` 内容\n\n\
  ```cpp\n 1 #include \"SortedNumberList.h\"\n 2\n 3 //*********************************************\n\
  \ 4 // 向排序列表添加一个数字。          *\n 5 // 此函数重写了 NumberList 中的 add。 *\n 6 //*********************************************\n\
  \ 7 void SortedNumberList::add(double number)\n 8 {\n 9    ListNode *nodePtr, *previousNodePtr;\n\
  10\n11    if (head == nullptr || head−>value >= number)\n12    {\n13       // 新节点位于列表开头\n\
  14       head = new ListNode(number, head);\n15    }\n16    else\n17    {\n18  \
  \     previousNodePtr = head;\n19       nodePtr = head−>next;\n20\n21       // 寻找插入点\n\
  22       while (nodePtr != nullptr && nodePtr−>value < number)\n23       {\n24 \
  \         previousNodePtr = nodePtr;\n25          nodePtr = nodePtr−>next;\n26 \
  \      }\n27       // 在 nodePtr 之前插入新节点\n28       previousNodePtr−>next = new ListNode(number,\
  \ nodePtr);\n29    }\n30 }\n```\n\n程序 4 使用了 `add` 函数。\n\n类似于程序 3 的。\n\n程序 2 \n\n\
