  \ 第 13 章 高级文件与 I/O 操作\n\n## 13.1 输入/输出流\n\n### 概念\n\n`ifstream` 对象用于文件输入，`ofstream`\
  \ 对象用于文件输出，而 `fstream` 对象同时用于输入和输出。\n\n*输入流*是一个可以从中读取数据的序列；*输出流*是一个可以向其写入数据的序列；*输入/输出*流是一个既允许读取又允许写入的数据序列。键盘是输入流的标准示例，显示器屏幕是输出流的标准示例。\n\
  \nC++ 提供了许多用于处理流的类，包括 `istream` 和 `ostream`。\n\n### 文件类\n\n`ifstream`、`ofstream`\
  \ 和 `fstream` 类非常相似。每个类都有一个默认构造函数来创建类的实例：\n\n```cpp\nifstream()\nofstream()\nfstream()\n\
  ```\n\n此外，每个类都有初始化构造函数，接受两个参数：要打开的文件名和打开模式。文件名由 C 字符串给出。打开模式是决定如何使用文件的设置。初始化构造函数的原型如下：\n\
  \n```cpp\nifstream(const char* filename, ios::openmode = ios::in)\nofstream(const\
  \ char* filename, ios::openmode = ios::out)\nfstream(const char* filename,\n   \
  \      ios::openmode mode = ios::in | ios::out);\n```\n\n从 C11 开始，可以使用 `string`\
  \ 对象作为文件名：\n\n```cpp\nifstream(const string& filename, ios::openmode = ios::in)\n\
  ofstream(const string& filename, ios::openmode = ios::out)\nfstream(const string&\
  \ filename,\n         ios::openmode mode = ios::in | ios::out);\n```\n\n打开模式参数是可选的。如果没有指定，打开模式默认为初始化构造函数所示的值。这些模式值及类似值的含义请参见表\
  \ 13-1。\n\n# 表 13-1 文件模式标志\n\n| 文件模式标志 | 含义 |\n| --- | --- |\n| `ios::app` | 追加模式：输出始终发生在文件末尾。\
  \ |\n| `ios::ate` | 末尾模式：输出最初发生在文件末尾。 |\n| `ios::binary` | 二进制模式：读写文件的数据以二进制形式存在。\
  \ |\n| `ios::in` | 输入模式：文件允许输入操作。如果文件不存在，则打开将失败。 |\n| `ios::out` | 输出模式：文件允许输出操作。如果文件不存在，则创建一个该命名的空文件。\
  \ |\n| `ios::trunc` | 截断模式：如果被打开的文件存在，其内容将被丢弃且大小被截断为零。 |\n\n\n\n\n这三个文件流类都拥有参数与初始化构造函数相似的成员函数，这些函数可以用于打开文件。例如，`fstream`\
  \ 的 `open` 函数具有以下原型定义：\n\n```\nvoid open(const char* filename,\n           ios::openmode\
  \ mode = ios::in | ios::out);\nvoid open(const string& filename,\n           ios::openmode\
  \ mode = ios::in | ios::out);\n```\n\n每个类都还有一个 `close` 成员函数，用于在程序完成文件操作后断开连接：\n\n\
  ```\nvoid close();\n```\n\n打开的文件会占用操作系统的资源，因此在完成文件操作后立即关闭文件非常重要。此外，程序写入文件流对象的数据通常会在操作系统中进行缓冲，而不会立即写入磁盘。当你关闭文件时，操作系统会将这些数据写入磁盘，这一过程被称为\
  \ `flushing the buffer`（刷新缓冲区）。关闭文件可以确保在发生断电或其他导致程序异常终止的情况的情况下，缓冲区中的数据不会丢失。\n\n\
  `fstream` 类本身结合了 `ifstream` 和 `ofstream` 的功能。因此，`fstream` 拥有这两个类所具备的所有成员函数和操作符。特别是，你可以使用提取操作符\
  \ `>>` 和插入操作符 `<<` 在 `fstream` 对象上进行读写数据。\n\n默认情况下，`ifstream` 对象打开文件用于输入，`ofstream`\
  \ 对象打开文件用于输出，而 `fstream` 对象则同时用于输入和输出文件。程序 13-1 提供了一个使用 `fstream` 对象同时打开读写文件的简单（尽管并不实用）的示例。它打开文件，读取并打印内容，然后在文件末尾写入单词“Hello”。如果你从名为“inout.txt”的空文件开始，重复执行该程序将导致每次运行时程序都会向文件中添加“Hello”一词。\n\
  \n在 程序 13-1 中，第 22–25 行的循环只有在提取操作无法读取文件末尾下一个单词时才会终止。文件流对象在每次输入或输出操作失败时都会设置若干错误标志。一旦设置了错误标志，流将不允许对其进行进一步操作，直到清除这些错误标志。第\
  \ 28 行对 `clear` 函数的调用清除这些标志，允许第 31 行和第 32 行的语句执行。\n\n# 文件打开模式\n\n`file open mode`（文件打开模式）是一种决定文件如何被使用的设置。`openmode`\
  \ 类型定义在名为 `ios` 的流相关类中。该类型的值是 `ios` 类的静态常量成员。每个此类值都代表打开文件时可以设置的标志或选项。表 13-1 列出了模式标志及其含义。\n\
  \n二进制逻辑“或”操作符 `|` 可用于组合两个或多个标志的效果。例如，以下打开模式：\n\n```\nios::in | ios::out | ios::ate\n\
  ```\n\n会导致文件以输入和输出的模式打开，且输出最初发生在文件末尾。以下是一个使用 `fstream` 打开三个分别用于输入、输出和输入输出的文件的示例：\n\
  \n```\nfstream inFile, outFile, inOutFile;\ninFile.open(\"in.txt\", ios::in);\n\
  outFile.open(\"out.txt\", ios::out);\noutFile.open(\"inout.txt\", ios::in | ios::out);\n\
  ```\n\n## 注意事项\n\n当单独使用时，`ios::out` 标志会导致删除现有文件的内容，其假设是程序员想要覆盖该文件。如果 `ios::out`\
  \ 与 `ios::app` 结合，则会保留现有文件的内容，并将所有新数据追加到文件末尾。\n\n# 使用构造函数打开文件\n\n使用其中一个初始化构造函数，可以在一条语句中创建流对象并打开文件：\n\
  \n```\nfstream outFile(\"inout.txt\", ios::in | ios::out);\n```\n\n# 输出格式化与 I/O\
  \ 操符\n\n你在 第 3 章 中学的 I/O 操符可以用于流对象。特别是，这些操符：\n\n```\nsetw(n)            fixed\n\
  showpoint          setprecision(n)\nleft               right\n```\n\n可以用于 `fstream`、`ofstream`\
  \ 和 `ostringstream`。为了说明，考虑一个接收 `double` 并返回 `string` 的函数，使用 `ostringstream` 编写两位小数的\
  \ 2 知识：\n\n```\nstring dollarFormat(double amount)\n{\n  // 创建 ostringstream\n \
  \ ostringstream outStr;\n\n  // 设置格式并写入 outStr\n  outStr << showpoint << fixed <<\
  \ setprecision(2);\n\n  // 提取字符串\n  return outStr.str();\n}\n```\n\n程序 13-2 使用 `dollarFormat`\
  \ 函数整齐地写入价格。价格以二维数组给出，并在 10 宽度内右对齐。表 13-2 显示了可以用于 C++ 流对象的 I/O 操符列表并给出了简要说明。\n\n\
  # 表 13-2 I/O 操符\n\n| 操符 | 描述 |\n| --- | --- |\n| `dec` | 以十进制显示后续数字。 |\n| `endl`\
  \ | 换行并刷新输出流。 |\n| `fixed` | 使用定点法表示浮点数。 |\n| `flush` | 刷新输出流。 |\n| `hex` | 十进制输入或输出。\
  \ |\n| `left` | 左对齐输出。 |\n| `oct` | 八进制输入或输出。 |\n| `right` | 右对齐输出。 |\n| `scientific`\
  \ | 使用科学计数法表示浮点数。 |\n| `setfill(ch)` | 设置填充字符 `ch`。 |\n| `setprecision(n)` | 设置浮点精度为\
  \ `n`。 |\n| `setw(n)` | 设置输出字段宽度为 `n`。 |\n| `showbase` | 打印时显示基数。 |\n| `noshowbase`\
  \ | 时不显示基数。 |\n| `showpoint` | 强制显示小数点和尾部零。 |\n| `noshowpoint` | 不打印尾部零并在可能时省略小数点。\
  \ |\n| `showpos` | 为非负数打印 `+` 号。 |\n| `noshowpos` | 为非负数打印 `+` 号。 |\n\n你已经在第 3 章\
  \ 中遇到过其中一些操符。`oct`、`dec` 和 `hex` 操符可以同时用于输入和输出流；它们允许使用八进制、十进制或十六进制系统读取或写入数字。程序 13-3\
  \ 演示了如何使用 `cin` 和 `cout` 读取和写入十进制、十六进制和八进制值。\n\n\n\n回想，当程序向打开的文件写入数据时，数据并不会直接写入文件。相反，数据被存储在与文件关联的输出缓冲区中，稍后通过称为刷新缓冲区（flushing）的过程传输到文件中。通常，只有当缓冲区满或文件关闭时才会刷新缓冲区。`endl`\
  \ 和 `flush` 操纵符允许程序员在任何时间刷新缓冲区，从而强制将缓冲区数据传输到文件中。例如，以下语句会刷新输出流的缓冲区：\n\n```\noutFile\
  \ << flush;\n```\n\n`scientific` 操纵符使浮点数以科学计数法输出，即以 `d.dddEdd` 的形式输出。`fill` 字符是在打印的数字没有填满其打印所在的整个字段时所写入的字符。默认情况下，填充字符是空格。程序员可以使用\
  \ `setfill` 操纵符指定不同的填充字符。例如，\n\n```\noutFile << setfill('%');\n```\n\n这将会将百分号（`%`）设置为填充字符。\n\
