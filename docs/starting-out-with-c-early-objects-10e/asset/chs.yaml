  注意不要将基类说明与成员访问混淆。成员说明符决定了类中的访问类型，而基类说明符决定了继承成员的访问类型。\n\n```cpp\nclass Cat : protected\
  \ Feline\n};\nclass Dog : private Canine\n};\n```\n\n## 表 11-2 基类说明符\n\n| 基类说明符\
  \ | 基类成员在派生类中的出现形式 |\n| :--- | :--- |\n| `private` | * 基类的私有成员对派生类不可访问。<br>* 基类的保护成员变为派生类的私有成员。<br>*\
  \ 基类的公共成员变为派生类的私有成员。 |\n| `protected` | * 基类的私有成员对派生类不可访问。<br>* 基类的保护成员变为派生类的保护成员。<br>*\
  \ 基类的公共成员变为派生类的保护成员。 |\n| `public` | * 基类的私有成员对派生类不可访问。<br>* 基类的保护成员变为派生类的保护成员。<br>*\
  \ 基类的公共成员变为派生类的公共成员。 |\n\n## 图 11-10 对基类成员的访问级别\n\n![该图表展示了对基类成员的访问级别。](img/FG_11_010.png)\n\
