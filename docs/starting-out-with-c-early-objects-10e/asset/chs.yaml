  ## 15.1 继承层次结构中的类型兼容性\n\n### 概念\n\n派生类对象可以用于任何期望基基类对象的地方。\n\n### 继承层次结构\n\n如你在第\
  \ 11 章中所学习到的，如果新类是现有类的特殊版本，那么基于现有类创建一个新类通常是有意义的。派生类本身随后可以作为其他类的基类，从而形成*继承层次结构*。例如，在第\
  \ 11 章中，我们使用继承过程创建了一个包含几个类的层次结构：`Person`、`Student`、`Faculty` 和 `TFaculty`。继承关系通常用矩形表示类，并用从派生类指向基类的箭头表示，如图\
  \ 15-1 所示。\n\n#### 图 15-1 继承层次结构\n\n![一个显示继承层次结构的树状。](img/FG_15_001.png)图 15-1 继承层次结构\
  \ 完整备用文本。\n\n此层次结构当然可以扩展。例如，`Student` 类本身可以被用另外两个派生类 `CStudent` 和 `RStudent` 的基类。后两个类可能被用来表示一种通勤型学生类型，以及另一种在校园内居住的学生类型。\n\
  \n### 继承中的类型兼容性\n\n在继承层次结构中的不同类之间存在某些类型兼容性关系。由于继承层次结构中的对象通常通过指针访问，因此我们用指针来阐述这些规则：\n\
  \n*   *派生类指针始终可以赋值给基类指针*。这意味着基类指针可以指向派生类对象。\n*   *执行将基类指针转换为派生类指针的反向赋值时，需要进行类型转换*。\n\
  \n```cpp\nclass Base\n{\npublic:\n    int i;\n};\n\nclass Derived : public Base\n\
  {\npublic:\n    double d;\n    Derived(int k, double g) : i(k), d(g) {}\n};\n```\n\
  \n给定这些类，我们可以拥有原始指针：\n\n```cpp\nBase *pb = new Base(5);\nDerived *pd = new Derived(6,\
  \ 10.5);\n```\n\n第一条规则允许将 `Derived` 类指针赋值给 `Base` 类。因此我们可以写：\n\n```cpp\npb = pd;\n\
  ```\n\n第二条规则规定如果使用类型转换，可以将基类指针转换为派生类指针。对于原始指针，相应的转换是 `static_cast`。对于 `shared_ptr`，你必须使用\
  \ `static_pointer_cast`：\n\n```cpp\nDerived *pd1 = static_cast<Derived*>(pb);\n\
  shared_ptr<Derived> pd1 = static_pointer_cast(pb);\n```\n\n假设之前之前指向派生类对象，这些赋值将使\
  \ `pd1` 和 `raw_pd` 指向派生类对象。随后，你可以使用这些指针访问派生类成员：\n\n```cpp\ncout << raw_pd->d;\n\
  cout << pd1->d;\n```\n\n现在考虑一种情况：将指向基类对象的基类指针通过类型转换赋值给派生类指针：\n\n```cpp\nraw_pd =\
  \ static_cast<Derived*>(pb);\npd = static_pointer_cast(pb);\n```\n\n该语句编译通过，但在执行时会导致错误。在这样的赋值后，尝试\n\
  \n```cpp\ncout << raw_pd->d;\ncout << pd->d;\n```\n\n访问 `Derived` 类成员将失败，因为 `raw_pd`\
  \ 指向的基类对象没有成员 `d`。\n\n这些兼容性规则对于深度继承层次结构同样有效。例如，在图 15-1 中，`Person` 是 `Faculty` 的基类，而\
  \ `Faculty` 又是 `TFaculty` 的基类。你可以将 `TFaculty` 指针赋值给 `Person` 指针：\n\n```cpp\nTFaculty\
  \ *tF = new TFaculty(name, disc);\nPerson *p;\np = tF;\n```\n\n然而，反向赋值需要类型转换：\n\n\
  ```cpp\ntF = static_cast<TFaculty *>(p);\n```\n\n为了简洁起见，我们省略了上述示例的智能指针版本。这些概念将在下面的程序中进一步说明，该程序使用了来自第\
  \ 11 章类的修改版本。\n\n# `Inheritance4.h` 的内容\n\n\n\n\n\n```cpp\n1 #include <string>\n\
  2 #include <memory>\n3 using namespace std;\n4 \n5 enum class Discipline { ARCHEOLOGY,\
  \ BIOLOGY, COMPUTER_SCIENCE };\n6 enum class Classification { FRESHMAN, SOPHOMORE,\
  \ JUNIOR, SENIOR };\n7 class Person\n8 {\n9 protectedprotected:\n10     string name;\n\
  11 public:\n12     Person() { setName(\"\"); }\n13     Person(const string& pName)\
  \ { setName(pName); }\n14     void setName(const string& pName) { name = pName;\
  \ }\n15     string getName() const { return name; }\n16 };\n17 \n18 class Student\
  \ : public Person\n19 {\n20 private:\n21     Discipline major;\n22     shared_ptr<Person>\
  \ advisor;\n23 public:\n24     Student(const string& sname, Discipline d, \n25 \
  \            const shared_ptr<Person>& adv) : Person(sname)\n26     {\n27      \
  \   major = d;\n28         advisor = adv;\n29     }\n30     void setMajor(Discipline\
  \ d) { major = d; }\n31     Discipline getMajor() const { return major; }\n32  \
  \   void setAdvisor(shared_ptr<Person> p) { advisor = p; }\n33     shared_ptr<Person>\
  \ getAdvisor() const { return advisor; }\n34 };\n35 \n36 class Faculty :public Person\n\
  37 {\n38 private:\n39     Discipline department;\n40 public:\n41     Faculty(const\
  \ string& fname, Discipline d) : Person(fname)\n42     {\n43         department\
  \ = d;\n44     }\n45     void setDepartment(Discipline d) { department = d; }\n\
  46     Discipline getDepartment() const { return department; }\n47 };\n48 \n49 class\
  \ TFaculty : public Faculty\n50 {\n51 private:\n52     string title;\n53 public:\n\
  54     TFaculty(const string& fname, Discipline d, string title)\n55         : Faculty(fname,\
  \ d)\n56     {\n57         setTitle(title);\n58     }\n59     void setTitle(const\
  \ string& title) { this−>title = title; }\n60 \n61     // 重写 getName()\n62     string\
  \ getName() const\n63     {\n64         return title + \" \" + Person::getName();\n\
  65     }\n66 };\n```\n\n以下是将派生类指针赋值给基类指针的其他示例：\n\n```cpp\nshared_ptr<Person> ptp;\n\
  shared_ptr<TFaculty> ptf;\n// 将派生类指针赋值给基类指针\nptp = make_shared<TFaculty>(\"Indiana\
  \ Jones\", \n                            Discipline::ARCHEOLOGY, \"Dr.\");\n// 将基类指针赋值给派生类指针\n\
  // 需要进行类型转换\nptf = static_pointer_cast<TFaculty>(ptp);\n```\n\n在这段代码中，一个新创建的派生类\
  \ `TFaculty` 对象指针被赋值给基类指针 `ptp`。然后，该基类指针通过类型转换赋值给 `ptf`。\n\n这些类型兼容性规则适用于另外两种情况。声明为基类指针的函数参数将接受指向派生类对象的指针。此外，声明返回类型为特定类\
  \ `C` 指针的函数，可能会返回指向自 `C` 的派生类对象的指针。\n\n# 基类指针的类型转换\n\n我们已经看到，指向特定类的指针实际上可能指向派生类的对象。在这种情况下，指针的类类型将与对象的类类型不同。例如，考虑以下语句\n\
  \n```cpp\nshared_ptr<Person> pPerson = \nmake_shared<Faculty>(\"Donald Knuth\",Discipline::COMPUTER_SCIENCE);\n\
  ```\n\n尽管这种赋值是合法的，但 `pPerson` 指针并不知道除继承自 `Person` 之外的 `Faculty` 类成员。因此，通过 `pPerson`\
  \ 访问 `Faculty` 类非继承成员会被编译器拒绝：\n\n```cpp\npPerson−>setDepartment(Discipline::BIOLOGY);\
  \ // 错误！\n```\n\n如果我们知道 `pPerson` 实际上指向一个 `Faculty` 对象，我们可以使用类型转换来让编译器接受该语句：\n\n\
  ```cpp\nstatic_pointer_cast<Faculty> (pPerson)         \n           −> setDepartment(Discipline::BIOLOGY);\n\
  ```\n\n类型转换告诉编译器 `pPerson` 实际上指向一个 `Faculty` 对象。或者，我们可以先将 `pPerson` 转换为存储在 `pFaculty`\
  \ 中的指向 `Faculty` 的指针，然后使用它来访问 `Faculty` 特有的成员：\n\n```cpp\nshared_ptr<Faculty> pFaculty\
  \ = static_pointer_cast<Faculty>(pPerson);\npFaculty−>setDepartment(Discipline::BIOLOGY);\n\
  ```\n\n通常情况下，实际上指向派生类对象的基类指针在可以使用派生类的额外功能之前，必须进行适当的转换。请回想第 11 章。\n\n# 15.2 多态与虚成员函数\n\
  \n### 概念\n\n虚函数允许选择继承体系中成员函数的最具体版本。如果使用不同类型执行代码会产生不同的行为，则称该代码具有*多态性*。例如，如果给一个函数传递了不同的类型，则该函数就是多态的。\n\
  \n为了说明多态性，请考虑以下程序，程序 15-2。该程序创建了一个包含 `Student`、`Faculty` 和 `TFaculty` 类型的 `Person`\
  \ 对象（指针）的 vector。然后它使用相同的代码打印所有对象的名称。因为 vector 只能存放一种类型的元素，所以我们必须使用基类指针的 vector。\n\
  \n注意，程序对数组中的所有对象调用了 `Person` 版本的 `getName` 函数，尽管 `TFaculty` 对象有它们自己的专门版本。这段代码显然不是多态的，因为它无论对象的类型如何，都对每个对象执行相同的成员函数。换句话说，它对不同类型的行为并不不同。\n\
  \n为了更好地理解发生了什么，我们需要仔细观察五个调用中的每一个\n\n```cpp\npeople[k]−>getName()\n```\n\n用于获取要打印的名称。在这些调用中，基类\
  \ `Person` 的指针 `people[k]` 被用于调用不同派生类对象的 `getName` 函数。其中某些类（如 `TFaculty`）重写了 `getName`\
  \ 以提供更专门的版本。当 `people[k]` 指向 `TFaculty` 对象时，编译器必须在 `Person`（指针的类）定义的 `getName` 和\
  \ `TFaculty`（对象实际所属的类）定义的 `getName` 之间做出选择。\n\n通过基类指针调用派生类对象的成员函数是面向对象编程中的常见现象。假设有一个类\
  \ `B` 有一个成员函数 `mfun()`，以及一个指向派生类 `D` 对象的基类指针 `ptr`。\n\n\n\n\n\n```cpp\nclass B\n\
  {\npublic:\n   void mfun()\n   {\n      cout << \"Base class version\";\n   }\n\
  };\nclass D : public B\n{\npublic:\n   void mfun()\n   {\n      cout << \"Derived\
  \ class version\";\n   }\n};\nshared_ptr<Base> ptr = make_shared<D>();\n```\n\n\
  我们想告诉编译器，每当我们写下\n\n```\nptr−>mfun()\n```\n\n编译器应该选择派生类中更特化的 `mfun()` 版本。在 C++ 中，我们可以通过在基类中将\
  \ `mfun()` 声明为 `virtual`（虚）函数来实现。虚函数在 C++ 中用于支持多态行为。因此，为了让类 `B` 及其所有派生类的 `mfun()`\
  \ 实现多态行为，我们必须如下修改 `B` 的定义：\n\n```cpp\nclass B\n{\npublic:\n   virtual void mfun()\n\
  \   {\n      cout << \"Base class version\";\n   }\n};\n```\n\n虚函数特性是可以继承的：也就是说，如果派生类的成员函数重写了基类中的虚函数，那么该成员函数本身也会变为虚函数。因此，在\
  \ `B` 中将 `mfun` 声明为虚函数，使得 `mfun` 在 `D` 以及所有派生自 `D` 的类中都是虚函数。\n\n虽然并非必须，但许多程序员会在所有虚函数上标记\
  \ `virtual` 关键字，以便于识别。这是一种良好的实践，因此，`D` 的定义应该如下所示：\n\n```cpp\nclass D : public B\n\
  {\npublic:\n   virtual void mfun()\n   {\n      cout << \"Derived class version\"\
  ;\n   }\n};\n```\n\n在这个示例中，虚函数是在类声明内部定义的。如果虚成员函数定义在类声明外部，则 `virtual` 关键字应出现在其类内部的声明中，而不是定义处。\n\
  \n接下来的程序 程序 15-3 是 程序 15-2 的修改版本。在其中，`Person` 类的 `getName` 函数被声明为虚函数。它包含了 `inheritance5.h`\
  \ 文件，该文件是对 `inheritance4.h` 文件的修改，使得 `Person` 类中的 `getName` 函数变为虚函数。\n\n# 动态绑定与静态绑定\n\
  \n当编译器在调用函数名时选择应该执行的代码时，被称为编译器 `绑定`（bind）了函数名。换句话说，当函数被调用时，编译器将名称绑定到函数定义。\n\n`静态绑定`（Static\
  \ binding）发生在编译时，并将名称绑定到固定的函数定义上，然后在每次调用该名称时执行该定义。例如，在上节的 程序 15-2 中，编译器使用静态绑定将语句中的\n\
  \n```cpp\nfor (int k = 0; k < people.size() k++)\n{\n   cout << people[k]−>getName()\
  \ << endl;\n}\n```\n\n`getName` 绑定到了 `Person` 类中的 `getName` 定义。\n\n在静态绑定中，编译器使用编译时可用的类型信息。如果代码在继承层次结构内操作不同类的对象，编译器可用的唯一类型信息将是用于访问所有对象的基类指针类型。因此，静态绑定将始终使用成员函数的基类版本。\n\
  \n相比之下，`动态绑定`（dynamic binding）发生在运行时。只有当编译器能够在运行时确定子类对象所属的精确类时，动态绑定才能起作用。编译器随后使用这种运行时类型信息来调用在该类中定义的函数版本。为了使动态绑定成为可能，编译器在具有虚函数的类的每个对象中存储运行时类型信息。动态绑定始终使用对象实际类中的成员函数版本，无论用于访问对象的指针类型是什么类。\n\
  \n关于动态绑定和运行时类型信息的更多信息，可以在书籍辅助网站上的 附录 K\n\n# 11 C++ 11 的 `override` 和 `final` 关键字\n\
  \nC++ 11 引入了 `override` 关键字，帮助防止在重写虚函数时出现细微错误。例如，你能找到 程序 15-4 中的错误吗？\n\n\n\n\n\n\
  派自抽象类的类继承了基类中的所有函数，并且它本身将仍然是一个抽象类，除非它重写了所继承的所有抽象函数。抽象类的有用之处在于，它们定义了一个接口，该接口必须由所有派生自该类的对象来支持。\n\
  \n你可以将抽象类类为除了属于某些子类的实例之外，没有其他实例的类。现实生活中有很多抽象类的例子。例如，在动物界中，所有动物的“动物（Animal）”类就是一个抽象类。不存在不实际上不属于某个子类的动物实例。有既是狗、鸡或狐狸的动物，但不存在仅仅是“动物本身”的动物。\n\
  \n考虑一个图形系统，它由一组必须在屏幕特定位置绘制的形状组成。每个形状对象都应该有某些成员变量来跟踪其位置，并有一个成员函数用于在正确的位置绘制该形状。系统支持的不同形状可能包括矩形、六边形等。由于矩形是一个形状而六边形也是一个形状，因此拥有一个\
  \ `Shape` 类并让 `Rectangle` 和 `Hexagon` 成为派自 `Shape` 的类是有意义的。`Shape` 类将有一个用于设置形状位置的成员函数\
  \ `setPosition`，以及一个用于绘制形状的成员函数 `draw`。然而，因为 `Shape` 是一个抽象类（没有任何形状仅仅是“形状”它必须是矩形、六边形、三角形或其他），绘制特定形状的逻辑必须委托给适当的子类。因此，`draw()`\
  \ 函数不能在 `Shape` 类中实现，而必须是纯虚函数。\n\n[Program 15-6] 显示了一个带有两个派生类 `Rectangle` 和 `Hexagon`\
  \ 的 `Shape` 类。该类声明了一个纯虚函数 `draw()`，该函数由它的两个子类实现。`main` 函数使用指针的 vector 维护了一个 `Shape`\
  \ 对象的集合。\n\n[Program 15-6] 提供了动态绑定和多态的另一个演示。特别考虑语句\n\n```cpp\nshapes[j]->draw();\n\
  ```\n\n该语句在循环中执行了多次不同的操作\n\n```cpp\nfor (int j = 0; j < shapes.size(); j++)\n{\n\
  \   shapes[j]->draw();\n}\n```\n\n第一次执行该语句时，它调用了六边形对象的 `draw` 函数，而第二次执行时，它调用了矩形对象的\
  \ `draw` 函数。由于两个 `draw` 函数位于不同的类中，它们会产生不同的行为。\n\n记住关于抽象基类和纯虚函数的几点：\n\n*   当一个类包含纯虚函数时，它就是一个抽象基类。\n\
  *   抽象基类不能实例化。\n*   纯虚函数用 `= 0` 符号声明，并且没有函数体或定义。\n*   在需要实例化的派生类中，*必须*重写纯虚函数。\n\n\
