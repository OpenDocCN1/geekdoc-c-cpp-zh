  \ `m` 成员。 |\n| `*a.p` | `a` 是结构变量或类对象，`p`（指针）是 `a` 的一个成员。该表达式访问 `a.p` 所指向的值。 |\n\
  | `s->m` | `s` 是指向结构变量或类对象的指针，`m` 是一个成员。该表达式访问 `s` 指向的结构或类对象的 `m` 成员。 |\n| `(*s).p`\
  \ | `s` 是指向结构变量或类对象的指针，`p` 是一个成员。该表达式访问 `s` 指向的结构或类对象的 `p` 成员。 |\n| `s->p` | `s`\
  \ 是指向结构变量或类对象的指针，`p` 是一个成员。该表达式访问 `s` 指向的结构或类对象的 `p` 成员。 |\n| `(*s).p` | `s` 是指向结构变量或类对象的指针，`p`\
  \ 是一个成员。该表达式访问 `s` 指向的结构或类对象的 `p` 成员。 |\n\n## 检查点\n\n假设存在以下结构用于 10.18 到 10.20：\n\
  \n```\n struct Rectangle\n{\n   int length;\n   int width;\n};\n```\n\n1. 10.18\
  \ 定义一个指向 `Rectangle` 的指针。\n2. 10.19 假设 10.18 中的指针指向一个有效的 `Rectangle`。通过指针显示该成员。\n\
  3. 10.20 假设 `rptr` 是指向 `Rectangle` 的指针。表达式 A、B、C 中的哪一个等于表达式：\n\n    ```\n     rptr->width\n\
