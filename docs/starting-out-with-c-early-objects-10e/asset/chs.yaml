  *   第 28 到 38 行显示了程序的输出，包括 `result` vector 的内容。\n\n# 使用 `set_intersection` 函数查找集合的交集\n\
  \n两个集合的交集是一个只包含在两个集合中都存在的元素的集合。例如，假设 `set1` 包含值 1, 2, 3, 4，而 `set2` 包含值 3, 4, 5,\
  \ 6。`set1` 和 `set2` 的交集将是一个包含值 3, 4 的集合。\n\n你可以调用 STL 算法函数 `set_intersection` 获取两个集合的交集。该函数将交集存储在第三个容器中。程序\
