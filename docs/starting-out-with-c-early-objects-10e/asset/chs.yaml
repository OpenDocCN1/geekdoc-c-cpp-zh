  \n44. 学习跳出问题的现象去识别根源是一项重要技能。程序中的 Bug 有时是粗心大意的结果，但有时它们反映了根本性的误解。假设一个朋友一直在试图确定为什么他的程序无法工作。你注意到他正在按值传递文件。除了简单地告诉他文件需要按引用传递外，你还可以告诉他什么？假设你需要向别人演示这一点。Bug\
  \ 通常发生在较大的程序中，这可能让不熟悉程序的人难以理解正在发生什么。编写一个尽可能短但仍然具有文件传递 bug 的程序。\n\n## 编程挑战 (Programming\
  \ Challenges)\n\n## 1. 文件预览器 (File Previewer)\n编写一个程序，要求用户输入文本文件名。程序应显示文件的前 10 行。如果文件少于\
  \ 10 行，则显示整个文件并提示“整个文件已显示”的消息。\n\n## 2. 文件显示程序 (File Display Program)\n编写一个程序，要求用户输入文件名。程序在屏幕上显示文件内容。如果文件内容无法在一个屏幕内显示，程序每次显示\
  \ 24 行然后暂停。程序每次暂停时，应等待用户输入按键后再显示接下来的 24 行。\n\n## 3. 幽话梗 (Punch Line)\n编写一个程序，从两个不同的文件中读取并打印一个笑话及其笑话梗。第一个文件包含笑话但没有笑话梗。第二个文件的最后一行是笑话梗，前面是“垃圾信息（garbage）”。你的程序的\
  \ `main` 函数应该打开这两个文件，然后调用两个函数，为每个函数传递它需要的文件。第一个函数应该读取并显示它所接收的文件的每一行（笑话文件）。第二个函数应该只显示它所接收的文件的最后一行（笑话梗文件）。它应该通过移动到文件末尾然后回溯到最后行的开头找到这一行。测试程序的数据可以在\
  \ `joke.dat` 和 `punchline.dat` 中找到。\n\n## 4. 文件尾部 (Tail of a File)\n编写一个程序，要求用户输入文本文件名。程序应显示文件的最后\
  \ 10 行（文件的“尾部”）。如果文件少于 10 行，则显示整个文件并带有“整个文件已显示”的消息。程序应通过移动到文件末尾然后回溯到倒数第十行来实现这一点。\n\
  \n## 5. 字符串搜索 (String Search)\n编写一个程序，要求用户输入文件名和要搜索的字符串。程序将搜索文件中指定字符串的所有出现情况，并显示包含该字符串的所有行。在找到所有出现情况后，程序应报告该字符串在文件中出现的次数。\n\
  \n## 6. 句子过滤器 (Sentence Filter)\n\n\n\n\n处理输入文件并生成输出文件的程序称为 `filter`（过滤器）。编写一个程序，要求用户输入两个文件名。第一个文件将作为输入文件打开，第二个文件将作为输出文件打开。（假设第一个文件包含以句号结尾的句子。）\
  \ 该程序将读取第一个文件的内容，并将句子中除第一个字母以外的所有字母都转换为小写。句子的第一个字母应设为大写。修改后的内容应存储在第二个文件中。\n\n##\
  \ 7. 文件加密过滤器\n\n文件加密是指使用秘密代码编写文件内容的科学。你的加密程序应该像过滤器一样工作：读取一个文件的内容，将信息修改为一种代码，然后将编码后的内容写入第二个文件。第二个文件将是第一个文件的版本，但是用秘密代码编写的。\n\
  \n尽管存在复杂的加密技术，但你应该自己想出一个简单的方法。例如，你可以每次读取第一个文件的一个字符，并在每个字符写入第二个文件之前，将其 ASCII 码加上\
  \ `10`。\n\n## 8. 文件解密过滤器\n\n编写一个程序，解密由编程挑战 7 中的程序生成的文件。解密程序应该读取编码文件的内容，将信息恢复到原始状态，并写入另一个文件。\n\
  \n## 9. 字母频率\n\n字母 `e` 是英语散文中频率最高的字母，而字母 `z` 频率最低。你的一进行社会学实验的朋友认为，这对于大一学生的写作不一定成立。为了测试他的理论，他要求你写一个程序，该程序读取一个文本文件，并为英语字母表的每个字母打印该字母在文件中出现的次数。\n\
  \n提示：使用大小为 `128` 的整数数组，并使用字母的 ASCII 值作为数组索引来存储和检索字母的计数。\n\n## 10. 放回原来\n\nC++ 输入流类有两个成员函数，`unget()`\
