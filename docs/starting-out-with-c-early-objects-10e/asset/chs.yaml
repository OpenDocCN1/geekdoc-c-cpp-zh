  \ 2-10 所示。该程序还展示了如何在定义变量时给其赋予初始值。\n\n## 整数和长整数字面量\n\n查看来自程序 2-10 所示的以下语句：\n\n```\n\
  \ int floors = 15,\n    rooms = 300,\n    suites = 30;\n```\n\n该语句包含三个整数字面量。在 C++\
  \ 中，整数字面量通常像 `int` 一样存储在内存中。\n\nC++ 语言令人喜爱的特性之一是，它允许你控制程序的几乎每一个方面。如果你需要更改某些内容在内存中的存储方式，提供了相应的工具来实现。例如，如果你处于一种情况：你有一个整数字面量需要作为长整数（long\
  \ integer）存储在内存中？C++ 允许通过在数字末尾加上字母 `L` 来。这里有一个示例：\n\n```\nlong amount;\namount =\
  \ 32L;\n```\n\n第一条语句定义了一个名为 `amount` 的 `long` 类型变量。第二条语句将字面量 `32` 赋值给变量 `amount`。由于字面量写为\
  \ `32L`，它变成了一个长整数字面量。这意味着赋值的值被视为一个 `long`。\n\n同样，如果你想让一个整数字面量被视为 `long long int`（双长），你可以在数字末尾附加\
  \ `LL`。这里有一个示例：\n\n```\nlong long amount;\namount = 32LL;\n```\n\n### 注意\n\n尽管 C++\
  \ 允许你使用大写或小写的 `L`，但小写的 `l` 看起来太像数字 `1`，因此在指定长整数字面量或双长整数字面量时，你应该始终使用大写的 `L`。\n\n\
  ## 十进制和八进制字面量（扩展）\n\n程序员通常使用十进制（或其他进制）以外的计数系统来表示值。十六进制（十六进制）和八进制（八进制）非常受欢迎，因为它们让某些编程任务比十进制数字更方便。\n\
  \n默认情况下，C++ 假设所有整数字面量都以十进制表示。如果你想指示一个字面量是十六进制数，你必须在它前面加上 `0x`。（这是零加 x，不是字母 o 加 x）。以下是十六进制数\
  \ `F4` 在 C++ 中的表示方式：\n\n```\n0xF4\n```\n\n八进制数必须以 `0`（零，不是字母 o）开头。例如，八进制的 `31` 将写为：\n\
  \n```\n031\n```\n\n### 注意\n\n在一段时间内你不会编写需要使用十六进制或八进制数的程序，但如果你在代码中看到它们，应该能够识别出来。\n\
