  \ 18.8 回中列出的步骤？\n\n3.  18.10 在使用多个链表的程序中，如果类析构函数没有删除其链表，可能会发生什么？\n\n# 18.3 链表模板\n\
  \n`NumberList` 类的一个主要局限性是它只能存储 `double` 类型的值。列表类在可以用于存储不同类型的值时最有用。我们将要讨论的 `LinkedList`\
  \ 类使用模板来实现类型灵活性。它使用了与 `NumberList` 类相同的逻辑。\n\n# `LinkedList.h` 的内容\n\n\n\n\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\ntemplate <class T>\nclass LinkedList\n\
  {\nprotected:\n    // 声明列表节点结构体\n    struct ListNode\n    {\n        T value;\n\
  \        ListNode *next;\n        ListNode(T value1, ListNode *next1 = nullptr)\n\
  \        {\n           value = value1;\n           next = next1;\n        }\n  \
  \  };\n    ListNode *head;                      // 列表头指针\npublic:\n    LinkedList()\
  \ { head = nullptr;      // 构造函数\n    ~LinkedList();                       // 析构函数\n\
  \    void add(T value);\n    void remove(T value);\n    void displayList() const;\n\
  };\n\n//*****************************************************\n// 向列表末尾添加新元素。  \
  \                       *\n//*****************************************************\n\
  template <class T>\nvoid LinkedList<T>::add(T value)\n{\n   if (head == nullptr)\n\
  \      head = new ListNode(value);\n   else\n      {\n        // 列表为空\n        //\
  \ 使用 nodePtr 遍历列表\n        ListNode *nodePtr = head;\n        while (nodePtr−>next\
  \ != nullptr)\n           nodePtr = nodePtr−>next;\n\n        // nodePtr−>next 为\
  \ nullptr，所以 nodePtr 指向最后一个节点\n        // 创建新节点并将其放在最后一个节点之后\n        nodePtr−>next\
  \ = new ListNode(value);\n      }\n}\n\n//**********************************************\n\
  // 从列表中删除一个数字。该函数             *\n// 不假设列表是有序的。                           *\n//**********************************************\n\
  template <class T>\nvoid LinkedList<T>::remove(T value)\n{\n    ListNode *nodePtr,\
  \ *previousNodePtr;\n\n    // 如果列表为空，则什么都不做\n    if (!head)  return;\n\n    // 确定第一个节点是否为要删除的节点\n\
  \    if (head−>value == value)\n    {\n      nodePtr = head;\n      head = head−>next;\n\
  \      delete nodePtr;\n    }\n    else\n    {\n      // 将 nodePtr 初始化为列表头\n   \
  \   nodePtr = head;\n\n      // 跳过 value 成员不等于目标值的节点\n      while (nodePtr != nullptr\
  \ && nodePtr−>value != value)\n      {\n         previousNodePtr = nodePtr;\n  \
  \       nodePtr = nodePtr−>next;\n      }\n      // 将上一个节点连接到 nodePtr 之后的节点\n  \
  \    // 然后删除 nodePtr\n      if (nodePtr)\n      {\n         previousNodePtr−>next\
  \ = nodePtr−>next;\n         delete nodePtr;\n      }\n    }\n}\n\n//***************************************************\n\
  // displayList 输出列表中当前存储的所有*\n// 值的序列。                               *\n//***************************************************\n\
  template <class T>\nvoid LinkedList<T>::displayList() const\n{\n    ListNode *nodePtr\
  \ = head;   // 从列表头开始\n    while (nodePtr)\n    {\n       // 打印当前节点的值\n       cout\
  \ << nodePtr−>value << \"    \";\n       // 移动到下一个节点\n       nodePtr = nodePtr−>next;\n\
  \    }\n}\n\n//******************************************************\n// 析构函数释放列表使用的内存。\
  \               *\n//******************************************************\ntemplate\
  \ <class T>\nLinkedList<T>::~LinkedList()\n{\n   ListNode *nodePtr = head;   //\
  \ 从列表头开始\n   while (nodePtr != nullptr)\n   {\n       // garbage 用于跟踪待删除的节点\n  \
  \     ListNode *garbage = nodePtr;\n       // 移动到下一个节点，如果存在\n       nodePtr = nodePtr−>next;\n\
  \       // 删除“垃圾”节点\n       delete garbage;\n   }\n}\n```\n\n请注意，类成员函数的实现之前位于单独的\
  \ `.cpp` 文件中，现在已将其折叠到头文件中。这样做是为了避免编译和链接使用模板的多文件程序时所产生的巨大复杂性。\n\n该模板类适用于任何支持 `==`\
  \ 和 `<=` 等比较运算符的数据类型。特别地，它将适用于所有数值类型和 `string`。\n\n\n\n\n\n[Program 18-7] 将这两个函数整合在一起并说明了它们的用法。该程序从文件\
  \ `Numberfile.dat` 读取数据，该文件可以在书籍的配套网站上找到。\n\n# 递归成员函数\n\n让我们重写一个版本的 `NumberList`\
  \ 类，其中添加元素、删除元素和显示列表的成员函数采用了递归实现。该类还将包含一个 `size()` 函数。以下是该类的声明：\n\n## `NumberList2.h`\
  \ 的内容\n\n```\n 1 #include <iostream>\n 2 using namespace std;\n 3 class NumberList2\n\
  \ 4 {\n 5 protected:\n 6     // 为列表节点声明一个类\n 7     struct ListNode\n 8     {\n 9\
  \        double value;\n10        ListNode *next;\n11        ListNode(double value1,\
  \ ListNode *next1 = nullptr)\n12        {\n13           value = value1;\n14    \
  \       next = next1;\n15        }\n16     };\n17     ListNode *head;          \
  \              // 列表头指针\n18 public:\n19     NumberList2() { head = nullptr; }  \
  \    // 构造函数\n20     ~NumberList2();                        // 析构函数\n21     void\
  \ add(double value) { head = add(head, value);}\n22     void remove(double value)\
  \ {head = remove(head, value);}\n23     void displayList() const {displayList(head);}\n\
  24     int size() const {return size(head);}\n25 private:\n26     // 递归实现\n27  \
  \   ListNode *add(ListNode *aList, double value);\n28     ListNode *remove(ListNode\
  \ *aList, double value);\n29     void displayList(ListNode *aList) const;\n30  \
  \   int size(ListNode *aList) const;\n31 };\n```\n\n如果你观察这个类，你会发现第 20–24 行中的每个公共成员函数在第\
  \ 27–30 行都有对应的私有成员函数。私有成员函数为其对应的公共函数提供了递归实现。注意，每个私有成员函数都有一个类型为 `ListNode*` 的参数。这个参数是递归运行所必需的。\n\
  \n你可能会奇怪为什么我们不把递归函数设为公共。其由于类型为 `ListNode*` 的参数是实现细节，因此不应暴露给类的用户。类公共接口的用户不需要知道列表在内部是使用名为\
  \ `head` 的 `ListNode` 指针实现的。\n\n# 递归 add 成员函数\n\n注意递归的 `add` 成员函数\n\n```\n ListNode\
  \ *add(ListNode *aList, double value);\n```\n\n接受一个输入列表和一个值作为参数，并返回向输入列表添加该值后生成的列表。从技术上讲，该函数的第一个参数是指向链表头的指针，并返回指向结果列表头的指针。`NumberList2.h`\
  \ 代码列表的第 21 行显示了如何调用递归函数向列表添加一个值。\n\n让我们看看 `add` 函数是如何工作的。如果输入列表为空（基准情况），函数将创建一个包含该值的新节点并返回该节点的指针：\n\
  \n```\n return new ListNode(value);\n```\n\n如果列表不为空，函数将按以下方式进行。首先，它将输入列表拆分为它的组成头部节点和尾部。\n\
  \n```\n ListNode *tail = aList−>next;  // 固定尾部\naList−>next = nullptr;         //\
  \ aList 现在指向头部\n```\n\n尾部比原始输入列表短，因此更接近基准情况。通过递归，函数将该值添加到列表的尾部，从而产生一个“更大”的尾部：\n\n\
  ```\n ListNode *biggerTail = add(tail, value);\n```\n\n最后，被 `aList` 指向的原始头部被重新连接到更大的尾部，并返回指向原始头头的指针：\n\
  \n```\n aList−>next = biggerTail;  // 重新连接头部\nreturn aList;              // 返回增强列表的指针\n\
  ```\n\n将所有这些内容整合在一起，我们得到了 `add` 函数的如下代码：\n\n```\n 42 NumberList2::ListNode *NumberList2::add(ListNode\
  \ *aList, double value)\n43 {\n44     if (aList == nullptr)\n45         return new\
  \ ListNode(value);\n46     else\n47     {\n48         // 拆分为组成的头部和尾部\n49       \
  \  ListNode *tail = aList−>next;   // tail\n50         aList−>next = nullptr;  \
  \        // 分离的头部\n51         // 递归地向尾部添加值\n52         ListNode *biggerTail = add(tail,\
  \ value);\n53         // 重新连接头部\n54         aList−>next = biggerTail;\n55      \
  \   // 返回更大列表头的指针\n56         return aList;\n57     }\n58 }\n```\n\n该函数中的代码可以被缩短。首先，注意第\
  \ 50 行是不需要的。在第 52 行对尾部进行递归调用之前，头部不必分离头部，只要它在第 54 行被“重新连接”即可。然后，我们可以消除 `tail` 变量，仅在第\
  \ 52 行使用 `aList−>next`。此时 `else` 分句中的代码可以缩短为：\n\n```\n ListNode *biggerTail = add(aList−>next,\
  \ value);\naList−>next = biggerTail;\nreturn aList;\n```\n\n这反过来可以缩短为\n\n```\n aList−>next\
  \ = add(aList−>next, value);\nreturn  aList;\n```\n\n因此，`add` 函数可以写成：\n\n```\n 28\
  \ NumberList2::ListNode *NumberList2::add(ListNode *aList, double value)\n29 {\n\
  30     if (aList == nullptr)\n31         return new ListNode(value);\n32     else\n\
  33     {\n34         // 将值添加到尾部末\n35         aList−>next = add(aList−>next, value);\n\
  36         return aList;\n37     }\n38 }\n```\n\n# 递归 remove 成员函数\n\n`remove` 函数\n\
  \n```\n ListNode *remove(ListNode *aList, double value)\n```\n\n接受一个输入列表和一个值作为参数，从输入列表中删除该值，并返回生成的列表。如果要删除的值不在列表中，函数将返回原始的输入列表。\n\
  \n该函数的工作如下。如果列表为空，函数返回 `nullptr`。\n\n```\n if(aList == nullptr) return nullptr;\n\
  ```\n\n否则，函数将值与存储在列表中第一个（头部）节点中的值进行比较。如果在那里找到了值，则删除头部节点（由 `aList` 指向）并返回尾部：\n\n\
  ```\n if (aList−>value == value)\n{\n   ListNode *tail = aList−>next;\n   delete\
  \ aList;\n   return tail;\n}\n```\n\n最后考虑的情况是列表不为空且列表头部不包含要删除的值。在这种情况下，函数递归地从列表尾部删除该值，将原始头部重新连接到修改后的尾部，并返回指向（可能修改过的）列表头的指针。使用\
  \ `add()` 函数相同的推理方法，我们可以将这种情况写为：\n\n```\n aList−>next = remove(aList−>next, value);\n\
  return aList;\n```\n\n再次将所有内容整合在一起，我们得到了实现文件 `NumberList2.cpp` 第 10–60 行的完整函数。\n\
  \n\n\n\n\n```cpp\n#include \"NumberList2.h\"\n\n//*******************************************\n\
  // 返回列表中元素的个数               *\n//*****************************************\nint\
  \ NumberList2::size(ListNode *aList) const\n{\n    if (aList == nullptr)\n     \
  \   return 0;\n    else\n        return 1 + size(aList->next);\n}\n\n//*******************************************\n\
  // 打印列表中存储的所有元素         *\n//*******************************************\nvoid NumberList2::displayList(ListNode\
  \ *aList) const\n{\n    if (aList != nullptr)\n    {\n        cout << aList->value\
  \ << \"  \";\n        displayList(aList->next);\n    }\n}\n//***********************************************\n\
  // 在列表末尾添加一个值                *\n//***********************************************\n\
  NumberList2::ListNode *NumberList2::add(ListNode *aList, double value)\n{\n    if\
  \ (aList == nullptr)\n        return new ListNode(value);\n    else\n    {\n   \
  \     // 将该值添加到尾部部\n        aList->next = add(aList->next, value);\n        return\
  \ aList;\n    }\n}\n\nNumberList2::ListNode *NumberList2::remove(ListNode *aList,\
  \ double value)\n{\n    if (aList == nullptr) return nullptr;\n    // 列表不为空\n\n\
  \    // 检查该值是否在列表第一个\n    // 如果是，删除该值并返回新的尾部\n    if (aList->value == value)\n \
  \   {\n        ListNode *tail = aList->next;\n        delete aList;\n        return\
  \ tail;\n    }\n    else\n    {\n        // 该值不在列表第一个\n        // 返回从列表末尾删除该值后的列表\n\
  \        aList->next = remove(aList->next, value);\n        return aList;\n    }\n\
  }\n\nNumberList2::~NumberList2()\n{\n    ListNode *ptr = head;\n    while (ptr !=\
  \ nullptr)\n    {\n        // 指向要删除的节点\n        ListNode *garbage = ptr;\n     \
  \   // 继续到下一个节点\n        ptr = ptr->next;\n        // 删除当前节点\n        delete garbage;\n\
  \    }\n}\n```\n\n`Program 18-8` 展示了这些成员函数的使用。\n\n# 18.5 链表的变体\n\n### 概念\n\n有许多方法可以将动态分配的数据结构连接起来。链表的两种变体是双向链表和循环链表。\n\
  \n我们讨论过的链表示例是`单向链表`：每个节点只连接到另一个节点。这种链表的一种变体是`双向链表`。在这种类型的列表中，每个节点不仅指向下一个节点，还指向上一个节点。这在`图\
  \ 18-14`中所示。\n\n## 图 18-14 双向链表\n\n![插图解释了双向链表。](img/FG_18_014.png)\n\n在`图 18-14`\
  \ 中，列表最后一个节点和第一个节点指向 `nullptr` 地址。当程序遍历列表时，它知道何时到达了任一端。\n\n另一种变体是`循环链表`。这种类型的列表中最后一个节点指向第一个节点，如`图\
  \ 18-15` 所示。\n\n## 图 18-15 循环链表\n\n![插图解释了循环链表。](img/FG_18_015.png)\n\n# 在原始指针和智能指针之间选择\n\
  \n[根据指令说明省略了详细内容...]\n\n# 18.6 STL 的 `list` 和 `forward_list` 容器\n\n### 概念\n\n标准模板库提供了两种不同的链表容器，称为\
  \ `list` 和 `forward_list`。\n\n标准模板库中的 `list` 容器实现为双向链表，而 `forward_list` 容器被实现为单向链表。这些容器执行插入和位置操作的速度比\
  \ `vector` 快，因为在添加新元素时，链表不需要移动现有的元素。`list` 和 `forward_list` 容器在末尾添加元素也是高效的，因为它们有一个指向最后一个元素的内置指针（不需要遍历）。\n\
  \n你无法使用索引来访问元素。\n\n## `list` 容器\n\n要使用 `list` 类，你需要在程序中 `#include` `<list>` 头文件。然后你可以使用四个\
  \ `list` 构造函数之一来定义 `list` 对象。\n\n# 表 18-1 `list` 构造函数\n\n| | 描述 |\n| :--- | :---\
  \ |\n| 默认构造函数 | `list<dataType> name;` 创建一个空的 `list` 对象。在通用格式中，`dataType` 是每个元素的数据类型，`name`\
  \ 是 `list` 的名称。 |\n\n\n\n\n\n### 列表构造函数\n\n| 填充构造函数 | `list<dataType> name(size);`\
  \ 创建一个指定大小的 `list` 对象。在通用格式中，`dataType` 是每个元素的数据类型，`name` 是 `list` 的名称。`size` 参数是一个无符号整数，指定了\
  \ `list` 初始拥有的元素数量。如果元素是对象，则通过它们的默认构造函数对其进行初始化。否则，元素将初始化为值 0。 |\n| 填充构造函数 | `list<dataType>\
  \ name(size, value);` 创建一个指定大小的 `list` 对象，其中每个元素初始被赋予一个指定的值。在通用格式中，`dataType` 是每个元素的数据类型，`name`\
  \ 是 `list` 的名称。`size` 参数是一个无符号整数，指定了 `list` 初始拥有的元素数量，`value` 参数是要填充到每个元素的值。 |\n\
  | 范围构造函数 | `list<dataType> name(it1, it2);` 创建一个 `list` 对象，其初始包含由指向另一个集合的两个迭代器指定的范围范围。在通用格式中，`dataType`\
  \ 是每个元素的数据类型，`name` 是 `list` 的名称。迭代器 `it1` 和 `it2` 标记了将存储在 `list` 中的值范围的开始和结束。 |\n\
  | 拷贝构造函数 | `list<dataType> name(list2);` 创建另一个 `list` 或对象的拷贝。在通用格式中，`dataType` 是每个元素的数据类型，`name`\
  \ 是 `list` 的名称，`list2` 是要拷贝的 `list`。 |\n\n### 表 18-2 常用 `list` 成员函数\n\n| 成员函数 |\
  \ 说明 |\n| --- | --- |\n| `back()` | 返回容器中最后一个元素的引用。 |\n| `begin()` | 返回指向容器起始的迭代器。\
  \ |\n| `cbegin()` | 返回指向容器起始的 `const_iterator`。 |\n| `cend()` | 返回指向容器末尾的 `const_iterator`。\
  \ |\n| `clear()` | 删除容器中的所有元素。 |\n| `crbegin()` | 返回指向容器（反向）末尾的 `const_reverse_iterator`。\
  \ |\n| `crend()` | 返回指向容器（反向）起始的 `const_reverse_iterator`。 |\n| `emplace(it, args...)`\
  \ | 构建一个新对象作为元素，并将 `args...` 作为参数传递给元素的构造函数。`it` 参数是指向容器中现有元素的迭代器。新元素将插入到 `it` 指向的元素之前。\
  \ |\n| `emplace_back(args...)` | 在容器末尾构造一个新对象作为元素。`args...` 参数被传递给元素的构造函数。 |\n|\
  \ `emplace_front(args...)` | 在容器头部构造一个新对象作为元素。`args...` 参数被传递给元素的构造函数。 |\n| `empty()`\
  \ | 如果容器为空则返回 `true`，否则返回 `false`。 |\n| `end()` | 返回指向容器末尾的迭代器。 |\n| `erase(it)`\
  \ | 删除迭代器 `it` 指向的元素。该函数返回一个指向被删除元素之后的元素的迭代器（如果被删除的元素是最后一个，则返回容器的末尾）。 |\n| `erase(it1,\
  \ it2)` | 删除范围内的元素。迭代器 `it1` 和 `it2` 标记了将删除的值范围的开始和结束。该函数返回一个指向被删除元素之后的元素的迭代器（如果删除的是最后一个元素，则返回容器的末尾）。\
  \ |\n| `front()` | 返回容器中第一个元素的引用。 |\n| `insert(it, value)` | 插入一个以 `value` 为值的新元素。`it`\
  \ 参数是指向容器中现有元素的迭代器。新元素将插入到 `it` 指向的元素之前。该函数返回一个指向新插入元素的迭代器。 |\n| `insert(it, n,\
  \ value)` | 插入 `n` 个以 `value` 为值的新元素。`it` 参数是指向容器中现有元素的迭代器，`n` 是一个无符号整数。新元素将插入到\
  \ `it` 指向的元素之前。该函数返回指向新插入元素中第一个元素的迭代器。 |\n| `insert(it1, it2, it3)` | 插入一个范围内的元素。迭代器\
  \ `it1` 和 `it2` 标记了将插入的值范围的开始和结束。`it3` 参数指定了元素插入的位置。该函数返回一个指向新插入元素中第一个元素的迭代器。 |\n\
  | `max_size()` | 返回容器的最大最大容量。 |\n| `merge(second)` | `second` 参数必须是与调用对象相同类型的 `list`\
  \ 对象。该函数合并调用对象和 `second` 对象的内容。在调用 `merge` 函数之前必须对 `second` 列表进行排序，以便生成的列表保持排序状态。函数执行后，`second`\
  \ 列表将为空。 |\n| `pop_back()` | 移除容器的最后一个元素。 |\n| `pop_front()` | 移除容器的第一个元素。 |\n|\
  \ `push_back(value)` | 在容器末尾添加包含 `value` 的新元素。 |\n| `push_front(value)` | 在容器头部添加包含\
  \ `value` 的新元素。 |\n| `rbegin()` | 返回指向容器末尾的反向迭代器。 |\n| `remove(value)` | 删除所有等于\
  \ `value` 的元素。 |\n| `remove_if(function)` | `function` 是一个一元谓词函数（接受一个参数并返回布尔值的函数）。该函数将每个元素作为参数传递给\
  \ `function`，并删除所有使函数返回 `true` 的元素。 |\n| `rend()` | 返回指向容器起始的反向迭代器。 |\n| `resize(n)`\
  \ | `n` 参数是一个无符号整数。该函数调整容器大小以包含 `n` 个元素。如果容器当前大小大于 `n`，则缩小容器大小以保留前 `n` 个元素。如果容器当前大小小于\
  \ `n`，则扩大容器大小以包含 `n` 个元素。 |\n| `resize(n, value)` | 调整容器大小以包含 `n` 个元素（`n` 参数为无符号整数）。如果容器当前大小大于\
  \ `n`，则缩小容器大小以保留前 `n` 个元素。如果容器当前大小小于 `n`，则扩大容器大小以包含 `n` 个元素，并且每个新元素都用 `value` 初始化。\
  \ |\n| `reverse()` | 反转容器中元素的顺序。 |\n| `size()` | 返回容器中元素的数量。 |\n| `sort()` | 按升序排序元素。使用\
  \ `<` 运算符比较元素。 |\n| `swap(second)` | `second` 参数必须是与调用对象相同类型的 `list` 对象。该函数交换调用对象和\
  \ `second` 对象的内容。 |\n| `unique()` | 如果容器中有任何连续的重复元素，则删除除第一个元素之外的所有重复元素。 |\n\n\n\n\
  \n\n程序 18-9 展示了 `list` 容器的一些简单操作。\n\n# `forward_list` 容器\n\n由于 `forward_list` 是用单链表实现的，每个节点只保留一个指针：指向下一个节点的指针。与\
  \ `list` 容器（每个节点保留两个指针：一个指向下一个节点，一个指向上一个节点）相比，`forward_list` 使用的内存比 `list` 少。然而，你只能向向遍历\
  \ `forward_list`。如果你需要同时向前和向后移动，应该使用 `list` 容器。\n\n`forward_list` 容器提供了与 `list`\
  \ 容器大部分相同的成员函数，但有极少数例外。你可以在良好的在线参考网站（如 `cppreference.com` 或 `cplusplus.com`）上找到\
  \ `forward_list` 容器的文档。\n\n# 18.7 Reliable Software Systems, Inc., 案例研究\n\n## 问题描述\n\
  \nReliable Software Systems, Inc. 负责编写和销售供全球程序员使用的 C++ 类库。该公司的产品之一是一个库包，其中包含了在本章第\
  \ 2 节中引入的 `NumberList` 类。它的客户需要在会发生 `NumberList` 对象拷贝和赋值的程序中使用该类。你被要求修改该类以支持拷贝构造函数和赋值运算符。\n\
  \n## 更改的规划与类设计\n\n`NumberList` 类中至少需要添加两个函数。与其修改原始类，你选择使用继承来创建一个具有所请求增强的新类。拷贝构造函数和赋值操作都需要对被复制的\
  \ `NumberList` 对象内部的节点链表进行拷贝。为了避免代码重复，我们将添加一个成员函数\n\n```\n ListNode *copyList(ListNode\
  \ *aList);\n```\n\n该函数会创建并返回节点列表的独立副本。此外，当赋值运算符应用于如下语句时：\n\n```\nx = y;\n```\n\n\
  需要释放为 `NumberList` 对象 `x` 中的链表分配的存储空间。因此，我们在类中添加了一个成员函数\n\n```\n void destroyList(ListNode\
  \ *aList);\n```\n\n设计工作的结果是 `ReliableNumberList.h` 文件所示的 `ReliableNumberList` 类。\n\
  \n## `ReliableNumberList.h` 的内容\n\n```\n 1 #include \"numberlist.h\"\n 2\n 3 class\
  \ ReliableNumberList : public NumberList\n 4 {\n 5 public:\n 6     // 拷贝构造函数\n 7\
  \     ReliableNumberList(const ReliableNumberList& original);\n 8     // 现在我们需要一个默认构造函数\n\
  \ 9     ReliableNumberList(){}\n10     // 赋值运算符\n11     ReliableNumberList& operator=(ReliableNumberList\
  \ right);\n12 private:\n 13     static ListNode* copyList(ListNode *aList);\n14\
  \     static void destroyList(ListNode *aList);\n15 };\n```\n\n我们添加了一个默认构造函数（第 9\
  \ 行），以便创建初始为空的列表。请注意，辅助函数 `copyList` 和 `destroyList` 被声明为 `static`。这是因为它们是通用工具函数，不需要访问特定的\
  \ `NumberList` 对象即可完成工作。\n\n# 类成员函数的实现\n\n我们采用递归策略来实现实现 `copyList` 和 `destroyList`。如果列表为空，`copyList`\
  \ 返回 `nullptr`。如果列表不为空，则该函数会创建一个头节点的拷贝，将其附加到递归创建的尾部拷贝上，并返回生成的列表。\n\n现在考虑 `destroyList`\
  \ 的工作。如果参数列表为空，则无须销毁。如果参数列表不为空，函数将递归破坏尾部，然后释放头节点的存储空间。`copyList` 和 `destroyList`\
  \ 的编码细节可以见随后的 `ReliableNumberList.cpp` 列表。\n\n有了 `copyList` 函数后，编写拷贝构造函数变得几乎轻而易举：构造函数只需拷贝现有对象中的链表，并将结果赋值给正在创建的对象的头部指针：\n\
  \n```\n head = copylist(original.head);\n```\n\n编写赋值运算符并没有困难多少。该运算符首先释放调用对象中链表的存储空间，然后将其右操作数中的列表拷贝赋值给调用对象的头部成员。\n\
  \n```\n destroyList(head);\nhead = copyList(right.head);\n```\n\n你可以在下面的列表中找到完整的实现细节以及该新类的使用插图。\n\
  \n## `ReliableNumberList.h` 的内容\n\n```\n 1 #include \"reliablenumberlist.h\"\n 2\
  \  \n 3 //***************************************************\n 4 // 拷贝构造函数    \
  \                             *\n 5 //***************************************************\n\
  \ 6 ReliableNumberList::\n 7 ReliableNumberList(const ReliableNumberList& original)\n\
  \ 8 {\n 9     head = copyList(original.head);\n10 }\n11\n12 //****************************************************\n\
  13 // 重载赋值运算符                    *\n14 //****************************************************\n\
  15 ReliableNumberList&\n16 ReliableNumberList::operator=(ReliableNumberList right)\n\
  17 {\n18     // 首先释放调用对象中的链表\n19     destroyList(head);\n20     // 赋值右操作数的列表拷贝\n\
  21     head = copyList(right.head);\n22 }\n23\n24 //****************************************************\n\
  25 // 在 NumberList 对象内部*\n26 // 拷贝列表*\n27 //****************************************************\n\
  28 ListNode *\n29 NumberList::copyList(ListNode *aList)\n30 {\n31     if (aList\
  \ == nullptr)\n32         return nullptr;\n33     else\n34         {\n35       \
  \      // 先拷贝尾部\n36             ListNode *tailCopy = copyList(aList->next);\n37\
  \             // 返回附加到尾部的头部\n38             return new ListNode(aList->value, tailCopy);\n\
  39         }\n40 }\n41\n42 //**************************************\n43 // 通过释放所有节点破坏列表*\n\
  44 //**************************************\n45 ReliableNumberList::destroyList(ListNode\
  \ *aList)\n46 {\n47    if (aList != nullptr)\n48    {\n49       // 然后破坏尾部\n50  \
  \     destroyList(aList->next);\n51       // 释放头部\n52       delete aList;\n53  \
  \  }\n54 }\n```\n\n程序 18-10 展示了前面的代码添加到 NumberList 类中的拷贝构造函数和赋值运算符。\n\n# 复习题与练习\n\
  \n 空\n\n1. `head` 指向链表中的第一个节点。\n2. 指向相同类型对象的数据结构被称为 `list` 数据结构。\n3. 为了指示链表为空，你应该将头部指针设置为\
  \ `nullptr`。\n4. `push_back` 意味着将其添加到列表末尾。\n5. `insert_front` 意味着将其插入列表但不一定在末尾。\n\
