  \ && (a > 3)`\n3. `(1 != b) && (c != 3)`\n4. `(a >= −1) || (a <= b)`\n5. `!(a >\
  \ 2)`\n\n3. 4.25 如果 `a = 2`, `b = 4`, 且 `c = 6`，以下表达式为真还是假？\n\n```\n(b > a) || (b\
