  \ `i` 到 `j` 之间所有 vector 条目的字符串拼接。\n\n## 11.7 右值引用与移动操作\n\n### 概念\n\n右值引用表示一个临时对象。\n\
  \n## 左值与右值\n\n右值引用表示一个通常没有名称的临时对象。右值的本质在于它缺乏可以使用的名称。\n\n## 移动构造函数与移动赋值运算符\n\n再次考虑程序\
  \ 11-9 中的 `NumberArray` 类，我们通过添加一个默认构造函数对其进行了修改：\n\n\n\n\n\n```cpp\n class NumberArray\n\
  {\nprivate:\n  double *aPtr;\n  int arraySize;\npublic:\n  // 拷贝赋值和拷贝构造函数\n  NumberArray&\
  \ operator=(const NumberArray &right);    \n  NumberArray(const NumberArray &);\n\
  \n  // 默认构造函数和普通构造函数\n  NumberArray();\n  NumberArray(int size, double value);\n\
  \n  // 析构函数\n  ~NumberArray() { if (arraySize > 0) delete [] aPtr; }\n  void print()\
  \ const;\n  void setValue(double value);\n};\n```\n\n该类的每个对象都拥有一个资源，即指向动态分配内存的指针。此类类都需要一个程序员定义的拷贝构造函数和一个重载的拷贝赋值运算符。这些操作是为了避免由于成员级拷贝操作（memberwise\
  \ copy）导致无意共享资源而产生的错误。\n\n从 C++ 11 开始，类可以定义移动构造函数（`move constructor`）和移动赋值（`move\
  \ assignment`）。为了更好地理解这些概念，我们需要仔细观察析构函数、拷贝构造函数和拷贝赋值运算符的操作。为了帮助我们监控这些函数的调用时，我们修改了\
  \ `NumberArray` 析构函数和所有构造函数，包含了一个打印语句来跟踪这些函数的执行情况。例如，我们如下修改了拷贝构造函数：\n\n```cpp\n\
  \ NumberArray::NumberArray(const NumberArray &obj)\n{\n   cout << \"Copy constructor\
  \ running\\n\";\n   arraySize = obj.arraySize;\n   aPtr = new double[arraySize];\n\
  \   for(int index = 0; index < arraySize; index++)\n   {\n      aPtr[index] = obj.aPtr[index];\n\
  \   }\n}\n```\n\n同样，我们将以下语句添加到析构函数、其他构造函数以及拷贝赋值运算符中：\n\n```cpp\ncout << \"Destructor\
  \ running\\n\";\ncout << \"Default constructor running\\n\";\ncout << \"Regular\
  \ constructor running\\n\";\ncout << \"Assignment operator running\\n\";\n```\n\n\
  构成程序 11-9 的文件的修改版本可以在 `overload2.h` 和 `overload2.cpp` 文件中找到。程序 11-14 展示了拷贝构造函数和拷贝赋值运算符的作用。输出中的行号不是程序生成的：我们添加它们是为了方便讨论。输出中的行\
  \ (1) 是程序第 12 行的默认构造函数生成的。行 (2) 是 `makeArray()` 函数创建本地对象时由第 28 行生成的。输出中的行 (3) 是调用拷贝构造函数拷贝局部对象并创建函数返回的临时对象时生成的。此时，局部对象被析构，产生了输出的行\
  \ (4)。接下来，执行程序第 13 行，调用拷贝赋值并产生输出的行 (5)。随着赋值完成，临时对象被析构，产生输出的行 (6)。行 (7) 是由第二次调用 `makeArray()`\
  \ 创建局部对象生成的。返回的对象通过拷贝构造函数直接拷贝到第二个对象中，产生输出的行 (8)，之后函数中的局部对象被析构，产生行 (9)。行 (10) 和 (11)\
  \ 是在 `main` 函数结束时对象 `first` 和 `second` 被析构产生的。\n\n### 注意\n\n某些编译器可能会执行优化以消除某些构造函数的调用。\n\
  \n我们特别关注程序的第 13 行：\n\n```cpp\nfirst = makeArray()\n```\n\n它调用了拷贝赋值来拷贝临时对象 `makeArray()`，如输出的行\
  \ (5) 所示。拷贝赋值删除了 `first` 中的 `aPtr` 数组，分配了另一个与临时对象大小相同的数组，并将临时数组中的值拷贝到 `first` 的\
  \ `aPtr` 数组中。拷贝赋值尽力避免 `first` 与临时对象之间的指针共享，但紧接着，临时对象就被析构了，其 `aPtr` 数组也被删除了。移动赋值运算符背后的思想是让被赋值的对象与临时对象交换资源，从而避免所有这些工作。这样，当临时对象析构时，它删除的是之前由\
  \ `first` 拥有的内存，而 `first` 则避免了拷贝临时对象 `aPtr` 数组中的元素。\n\n`NumberArray` 类的移动赋值编写如下。为了简化代码，我们库函数\
  \ `swap` 来交换两个内存位置的内容。`swap` 函数定义在 `<algorithm>` 头文件中。\n\n```cpp\n NumberArray&\
  \ NumberArray::operator=(NumberArray&& right)\n{\n    if (this != &right)\n    {\n\
  \       swap(arraySize, right.arraySize);\n       swap(aPtr, right.aPtr);\n    }\n\
  \    return *this;\n}\n```\n\n\n\n\n\n```cpp\n#include <iostream>\n#include \"overload3.h\"\
  \ \nusing namespace std;\n\n//***************************************************\n\
  // 赋值运算符重载函数。 *\n//***************************************************\nNumberArray&\
  \ NumberArray::operator=(const NumberArray &right)\n{\n    cout << \"Copy Assignment\
  \ operator running\\n\";\n    if (this != &right)\n    {\n        if (arraySize\
  \ > 0)\n        {\n            delete[] aPtr;\n        }\n        arraySize = right.arraySize;\n\
  \        aPtr = new double[arraySize];\n        for (int index = 0; index < arraySize;\
  \ index++)\n        {\n            aPtr[index] = right.aPtr[index];\n        }\n\
  \    }\n    return *this;\n}\n\n//**********************************************\n\
  // 拷贝构造函数。                            *\n//**********************************************\n\
  NumberArray::NumberArray(const NumberArray &obj)\n{\n    cout << \"Copy constructor\
  \ running\\n\";\n    arraySize = obj.arraySize;\n    aPtr = new double[arraySize];\n\
  \    for (int index = 0; index < arraySize; index++)\n    {\n        aPtr[index]\
  \ = obj.aPtr[index];\n    }\n}\n\n//**********************************************\n\
  // 构造函数。                                 *\n//**********************************************\n\
  NumberArray::NumberArray(int size1, double value)\n{\n    cout << \"Regular constructor\
  \ running\\n\";\n    arraySize = size1;\n    aPtr = new double[arraySize];\n   \
  \ setValue(value);\n}\n\n//**********************************************\n// 默认构造函数。\
  \                         *\n//**********************************************\n\
  NumberArray::NumberArray()\n{\n    cout << \"Default constructor running\\n\";\n\
  \    arraySize = 2;\n    aPtr = new double[arraySize];\n    setValue(0.0);\n}\n\n\
  //****************************************************\n// 设置数组中所有条目存储的值。 *\n//****************************************************\n\
  void NumberArray::setValue(double value)\n{\n    for (int index = 0; index < arraySize;\
  \ index++)\n    {\n        aPtr[index] = value;\n    }\n}\n\n//***************************************\n\
  // 打印数组中的所有条目。   *\n//***************************************\nvoid NumberArray::print()\
  \ const\n{\n    for (int index = 0; index < arraySize; index++)\n    {\n       \
  \ cout << aPtr[index] << \"  \";\n    }\n}\n\n//*************************************\n\
  // 析构函数。                        *\n//*************************************\nNumberArray::~NumberArray()\n\
  {\n    cout << \"Destructor running\\n\";\n    if (arraySize > 0)\n    {\n     \
  \   delete[] aPtr;\n    }\n}\n\n//***********************************************************\n\
  // 移动赋值运算符。                                *\n//***********************************************************\n\
  NumberArray & NumberArray::operator=(NumberArray&& right)\n{\n    cout << \"Move\
  \ assignment is running\\n\"; // Trace\n\n    if (this != &right)\n    {\n     \
  \   swap(arraySize, right.arraySize);\n        swap(aPtr, right.aPtr);\n    }\n\
  \    return *this;\n}\n\n//***********************************************************\n\
  // 移动构造函数。                                        \n//***********************************************************\n\
  NumberArray::NumberArray(NumberArray && temp)\n{\n    // 从 temp 对象中“窃取”资源\n    this->arraySize\
  \ = temp.arraySize;\n    this->aPtr = temp.aPtr;\n\n    // 将 temp 对象置于安全状态\n   \
  \ // 以供其析构函数运行\n    temp.arraySize = 0;\n    temp.aPtr = nullptr;\n}\n```\n\n通过检查程序输出的第\
  \ (4) 行，你可以看到当赋值源是一个临时对象时，第 1 行调用了移动赋值。\n\n\n\n\n同样地，以下语句将 `d` 中的值转换为整数（截断小数部分）并将其存储在\
  \ `i` 中：\n\n```\ni = d;\n```\n\n类对象也可以提供相同的功能。例如，假设 `distance` 是一个 `Length` 对象，且\
  \ `d` 是一个 `double` 类型变量，如果 `Length` 写得恰当，以下语句可以方便地将 `distance` 存储在于 `d` 的浮点数中：\n\
  \n```\nd = distance;\n```\n\n为了能够使用像这样的语句，必须编写一个运算符函数来执行转换。这里有一个用于将 `Length` 对象转换为\
  \ `double` 的运算符函数：\n\n```\nLength::operator double() const\n{\nreturn len_inches\
  \ /12 + (len_inches %12) / 12.0;\n}\n```\n\n该函数计算以英尺为单位的长度量的实际小数等值。例如，4 英尺 6 英寸的测量将被转换为数字\
  \ 4.5。\n\n### Note\n\n函数头中没有指定返回类型，因为返回类型是从运算符函数的名称中推断出来的。此外，由于该函数是一个成员函数，它作用于调用对象，不需要其他参数。\n\
  \n`[Program 11-16]` 展示了一个修改后的 `Length` 类，该类同时包含 `double` 和 `int` 转换运算符。`int` 运算符简单地返回\
  \ `Length` 对象的英寸数。\n\n# `Length2.h` 的内容\n\n```\n 1 #ifndef _LENGTH1_H\n 2 #define\
  \ _LENGTH1_H\n 3 #include <iostream>\n 4 using namespace std;\n5\n 6 class Length\n\
  \ 7\n 8 private:\n 9   int len_inches;\n10 public:\n11   Length(int feet, int inches)\n\
  12   {\n13       setLength(feet, inches);\n14   }\n15   Length(int inches){ len_inches\
  \ = inches; }\n16   int getFeet() const { return len_inches / 12; }\n17   int getInches()\
  \ const { return len_inches % 12; }\n18   void setLength(int feet, int inches)\n\
  19   {\n20       len_inches = 12 *feet + inches;\n21   }\n22   // 类型转换运算符\n23  \
  \ operator double() const;\n24   operator int() const { return len_inches;  }\n\
  25\n26   // 重载流输出运算符\n27   friend ostream &operator<<(ostream &out, Length a);\n\
  28 };\n29 #endif\n```\n\n# `Length2.cpp` 的内容\n\n```\n 1 #include \"Length2.h\"\n\
  \ 2\n 3 //***********************************************\n 4 // Operator double\
  \ 将 Length 转换为 double  *\n 5 //***********************************************\n\
  \ 6 Length::operator double() const\n 7\n{\n 8    return len_inches /12 + (len_inches\
  \ %12) / 12.0;\n 9 }\n10\n11 //*******************************************\n12 //\
  \ 重载流插入运算符 <<  *\n13 //*******************************************\n14 ostream &operator<<(ostream&\
  \ out, Length a)\n15 {\n16    out << a.getFeet() << \" feet, \" << a.getInches()\
  \ << \" inches\";\n17    return out;\n18 }\n```\n\n## 11.9 转换构造函数\n\n# 概念 (Concept)\n\
  \n除了提供创建对象的方法外，转换构造函数还为编译器提供了一种将给定类型的值转换为类对象的方法。\n\n一个接受非其类类型类型的单一参数的构造函数，可以被视为将其参数转换为该类的对象。这种构造函数被称为*转换构造函数*（convert\
  \ constructor）。\n\n除了创建其类对象的功能外，转换构造函数还为编译器提供了执行隐式类型转换的方法。每当在期望类类型值的地方提供了构造函数参数类型的值时，编译器就会执行此类类型转换。\n\
  \n举一个简单的例子，考虑以下类：\n\n```\n class IntClass\n{\nprivate:\n   int value;\npublic:\n\
  \   // 从 int 的转换构造函数\n   IntClass(int intValue)\n   {\n      value = intValue;\n\
  \   }\n   int getValue() const { return value; }\n};\n```\n\n由于构造函数 `IntClass(int)`\
  \ 接受一个非 `IntClass` 类型的单一参数，因此它是一个转换构造函数。\n\n每当上下文需要类对象但提供了构造函数参数类型的值时，编译器就会自动调用转换构造函数。这种情况发生在四种不同的上下文中：\n\
  \n1.  使用转换构造函数参数类型的值初始化类对象：例如：\n\n    ```\n    IntClass intObject = 23;\n    ```\n\
  \n2.  将转换构造函数参数类型的值赋值给类对象：例如：\n\n    ```\n    intObject = 24;\n    ```\n\n3.  一个期望类类型值参数的函数实际上传递了构造函数参数类型的值。例如，我们可能定义一个函数：\n\
  \n    ```\n     void printValue(IntClass x)\n    {\n       cout << x.getValue();\n\
  \    }\n    ```\n\n    然后调用它：\n\n    ```\n    printValue(25);\n    ```\n\n4.  一个声明类返回值的函数实际上返回了构造函数参数类型的值。例如，编译器将调用构造函数将\
  \ `intValue` 转换为 `IntClass` 对象：\n\n    ```\n     IntClass f(int intValue)\n    {\n\
  \        return intValue;\n    }\n    ```\n\n以下程序说明了转换构造函数的用法。\n\n# `Convert.h`\
  \ 的内容\n\n```\n 1 #include <iostream>\n 2 using namespace std;\n3\n 4 class IntClass\n\
  \ 5 {\n 6 private:\n 7   int value;\n 8 public:\n 9   // 从 int 的转换构造函数\n10   IntClass(int\
  \ intValue)\n11   {\n12     value = intValue;\n13   }\n14   int getValue() const\
  \ { return value; }\n15 };\n```\n\n# `Convert.cpp` 的内容\n\n```\n 1 #include \"Convert.h\"\
  \n 2\n 3 //*******************************************\n 4 // 该函数返回 int，尽管声明的\n\
  \ 5 // 返回类型是 IntClass 对象*\n 6 //*******************************************\n 7\
  \ IntClass f(int intValue)\n 8 {\n 9    return intValue;\n10 }\n11\n12 //*******************************************\n\
  13 // 打印 IntClass 对象的 int  *\n14 // 值。                               *\n15 //*******************************************\n\
  16 void printValue(IntClass x)\n17 {\n18    cout << x.getValue();\n19 }\n```\n\n\
