  \      long i;\n}\n```\n\n| 成员变量 | 在 Third 类中的访问说明符 |\n| --- | --- |\n| `a` | |\n\
  | `b` | |\n| `c` | |\n| `d` | |\n| `e` | |\n| `f` | |\n| `g` | |\n| `h` | |\n| `i`\
  \ | |\n\n# 15.4 组合与继承\n\n### Concept\n\n继承应该模拟派生类与基类之间的“是 −a”关系，而不是“有 −a”关系。\n\n\
  \n\n\n\n面向对象语言中的 `Class inheritance` 应用于建模这样一个事实：派生类的类型是基类类型的一种特例。实际上，一个类可以被看作是从该类创建的所有对象的集合（set）。由于派生类是基类的一种特例，所以与派生类对应的对象集将是与基类对应的对象集的子集（subset）。因此，派生类的每个对象也是基类的对象。换句话说，每个派生类对象“都是一个”基类对象。\n\
  \n`Class composition` 发生在一个类包含另一个类的对象作为其成员变量之一的时候。组合在第 11 章中讨论过，其中指出组合建模了类与之间的“包含”（has-a）关系。\n\
  \n由于派生类继承了基类的所有成员，因此派生类实际上包含了其基类的一个对象。结果是，在原本应该使用组合的设计中，可能会误用继承。例如，考虑一个需要表示个人数据的程序，比如人的姓名和街道地址。街道地址可能包含两行：\n\
  \n*   123 Main Street\n*   Hometown, 12345\n\n现在假设我们有一个用于表示街道地址的类：\n\n```cpp\nclass\
  \ StreetAddress\n{\n   private:\n      string line1, line2;\n   public:\n      void\
  \ setLine1(string);\n      void setLine2(string);\n      string getLine1();\n  \
  \    string getLine2();\n};\n```\n\n由于一个人的数据包含姓名和街道地址，表示个人数据的类的正确表述将以如下方式使用组合：\n\
  \n```cpp\nclass PersonData\n{\n   private:\n      string name;\n      StreetAddress\
  \ address;\n   public:\n      ...\n};\n```\n\n我们省略了 `PersonData` 类的其余声明，因为在我们的目的中不需要它。\n\
  \n可以使用继承而不是组合来定义这个类。例如，我们可以如下定义一个 `PersonData1` 类：\n\n```cpp\nclass PersonData1:public\
  \ StreetAddress\n{\n   private:\n      string name;\n   public:\n      ...\n};\n\
  ```\n\n虽然这个新定义可以正确编译，但在概念上是错误的，因为它将人的数据视为一种特殊的 `StreetAddress` 类型，而事实并非如此。设计中的这种概念性错误可能导致程序难以理解且难以维护。尽可能优先使用组合而非继承是一种良好的设计实践。其中一个原因是，继承通过将基类的受保护（protected）成员暴露给派生类的方法，从而破坏了基类的封装性。\n\
  \n接下来让我们考虑一个使用继承比组合更合理的例子。假设我们有一个表示所有狗的集合的 `Dog` 类。假设每个 `Dog` 对象都有一个类型为 `double`\
  \ 的成员变量 `weight`，我们有如下代码：\n\n```cpp\nclass Dog\n{\n   protected:\n      double weight;\n\
  \   public:\n      Dog(double w) : weight(w) {}\n      virtual void bark() const\n\
  \      {\n         cout << \"I am a dog weighing \" << weight << \" pounds.\" <<\
  \ endl;\n      }\n};\n```\n\n现在假设我们有一个继承自 `Dog` 的 `SheepDog` 类：\n\n```cpp\nclass\
  \ SheepDog : public Dog\n{\n   private:\n      int legs;\n   public:\n      SheepDog(double\
  \ w, int l) : Dog(w), legs(l) {}\n      void bark() const override\n      {\n  \
  \       cout << \"I am a sheepdog weighing \" << weight << \" pounds and having\
  \ \" << legs << \" legs.\" << endl;\n      }\n};\n```\n\n为了演示多态性，我们使用指针向量：\n\n```cpp\n\
  vector<shared_ptr<Dog>> kennel = {\n   make_shared<Dog>(50.0),\n   make_shared<SheepDog>(70.0,\
  \ 4),\n   make_shared<Dog>(40.0)\n};\n\nfor (size_t i = 0; i < kennel.size(); i++)\n\
  {\n   cout << i + 1 << \": \";\n   kennel[i]->bark();\n}\n```\n\n# 15.5 Secure Encryption\
  \ Systems, Inc., Case Study\n\nSecure Encryption Systems 是一家最近成立的咨询公司，负责为企业和机构提供如何其数据免受未经授权访问的建议。该公司希望开发一个框架，能够快速评估和测试不同的加密解密算法，以确定它们的有效性及其提供的安全级别。\n\
  \n在本节中，我们将考虑使用虚函数（virtual functions）和抽象类（abstract classes）来构建应用框架。*应用框架*（application\
  \ framework）可以被看作骨架形式的应用：它只需要用户指定几个函数的定义，即可将框架转换为实用的应用程序。\n\n\n\n\n\n# 理解问题\n\n\
  在第 9 章]的*整合一切*章节中，你学习了编码消息的概念，使其只有拥有正确解码信息的人才能读取。更正式地说，`encryption`（加密）是将消息（称为`plain\
  \ text`明文）转换为`cipher text`（密文）的过程，后者是一种隐藏其真实含义的形式。`Decryption`（解密）是反转已执行加密转换的过程。`Decryption`应用于`cipher\
  \ text`以产生原始的`plain text`。许多其他加密文本的方法。例如，一种简单的加密算法可以通过将每个字符在字母表中向前移动固定位数来加密消息。稍后可以通过每个字符向后移动相同的固定位数来解密消息。例如，明文消息\n\
  \n```\nattack at dawn\n```\n\n可能会转换为密文\n\n```\nbuubdl!bu!ebxo\n```\n\n# 一个简单的加密/解密框架\n\
  \n为了测试加密和解密算法提供一个框架，我们将实现一个类，它提供了测试此类算法所需的所有功能，但留下了未指定的字母转换函数。该框架将以类的形式实现，而转换函数将是类的纯虚成员函数。随后，可以通过创建框架类的派生类并重写虚转换函数来轻松测试特定的加密算法。\n\
  \n我们使用一种非常简单的字符转换算法：它只是将字符在 ASCII 码中向上移动一位；当移动字母‘z’或‘Z’时，它甚至不会回到字母表的开头。程序的主要部分是`Encryption`类：\n\
  \n```cpp\nclass Encryption\n{\nprotected:\n   ifstream inFile;\n   ofstream outFile;\n\
  public:\n   Encryption(const string& inFileName, const string& outFileName);\n \
  \  virtual  ~Encryption();\n   // 纯虚函数\n   virtual char transform(char ch) const\
  \ = 0;\n   // 执行实际工作\n   virtual void encrypt() final;\n};\n```\n\n该类包含了用于访问输入和输出文件的对象。构造函数接收两个文件名并执行打开文件的工作。析构函数关闭文件。`encrypt`函数将从输入文件中读取字符，调用虚函数`transform`来转换单个字符，并将字符写入输出文件。\n\
  \n由于`transform`函数是纯虚的，`Encryption`类是抽象类，不能实例化。`Encryption`的子类只需要实现一个适当的`transform`函数，并将文件名作为参数传递给其基类构造函数。完整的程序如下。\n\
