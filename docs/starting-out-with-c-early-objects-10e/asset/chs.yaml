  \n# 向列表添加元素\n\n`add` 成员函数接受一个 `double` 类型的数字作为参数，创建一个包含该数字的节点并将其添加到列表末尾。基本思想如下：如果一方面列表是空的，新创建的节点将成为列表中唯一的节点：\n\
  \n```\n head = new ListNode(number);\n```\n\n如果另一方面，列表不是空的，我们取一个指针节点 `nodePtr`，将其设置为列表的开头，并向下遍历列表直到它指向最后一个节点。当\
  \ `nodePtr−>next` 等于 `nullptr` 时，我们就知道它指向最后一个节点。将指针从列表开始并遍历到末尾的代码如下：\n\n```\n ListNode\
