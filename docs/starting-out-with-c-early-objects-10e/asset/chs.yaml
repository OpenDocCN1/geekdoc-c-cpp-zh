  \ 在宽度为七的字段中左对齐显示数字 67。\n\n2.  以下程序段将角度从度转换为弧度。\n\n\n\n\n```\nconst double PI = 3.14159;\n\
  double degrees, radians;\n\ncout << \"Enter an angle in degrees and I will convert\
