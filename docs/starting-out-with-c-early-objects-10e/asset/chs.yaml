  \ 2-1 作为你的指南。在程序顶部放置一个带有日期的注释。输入、编译并运行你的程序。\n\n## 2.2 `cout` 对象\n\n### \n\n`cout`\
  \ 用于在电脑屏幕上显示信息。\n\n在本节中，你将学习编写在屏幕上输出的程序。程序可以输出的最简单的屏幕输出是控制台输出，即纯文本。`console` 一词源于过去通过终端与系统交互的时代。由屏幕和键盘组成的终端被称为控制台。\n\
  \n在现代电脑上，运行 Windows 或 Mac OS 等操作系统，控制台输出通常显示在如图 2-1 所示的窗口中。C++ 提供了一个名为 `cout` 的对象用于产生控制台输出。（你可以将\
  \ `cout` 一词视为控制台输出。）\n\n### 图 2-1 控制台窗口\n\n![显示控制台窗口的图片。](img/FG_02_001.png)图 2-1\
  \ 完整替代文本\n\n`cout` 被分类为流对象，这意味着它处理数据流。要在屏幕上打印消息，你需要向 `cout` 发送字符流。让我们看看程序 2-1 中的第\
  \ 7 行：\n\n```\ncout << \"Programming is great fun!\";\n```\n\n`<<` 运算符用于将字符串“Programming\
  \ is great fun!”发送到 `cout`。当这样使用 `<<` 符号时，它被称为流插入运算符。运算符右侧的项被“插入”到发送到 `cout` 以显示的输出流中。\n\
  \n### 注意\n\n流插入运算符始终写为两个小于号，它们之间没有空格。由于你正在使用它向 `cout` 对象发送数据流，你可以将流插入运算符想象成指向 `cout`\
  \ 的箭头，如下：\n\n```\ncout << \"Hello\";\ncout << \"Hello\";\n```\n\n程序 2-2 显示了编写相同程序的另一种方式。\n\
  \n你可以看到，流插入运算符可以向 `cout` 发送多个项。程序 2-3 显示了实现相同任务的另一种方法。此程序的输出与程序 2-1 相同。除非另有规定，否则\
  \ `cout` 不会自动换行，2-2 的一个重要概念是，尽管输出在源代码中被分成了多行，它仍然会在同一行显示。\n\n\n\n\n转义序列使你能够更有效地控制程序输出信息的方式。表\
  \ 2-2 列出了其中的几种常用序列。\n\n## 表 2-2 常见转义序列\n\n| 转义序列 | 名称 | 描述 |\n| --- | --- | ---\
  \ |\n| `\\n` | 换行 | 使光标移动到下一行以便进行后续打印。 |\n| `\\t` | 水平制表 | 使光标跳到下一个制表位。 |\n| `\\\
  a` | 警报 | 使电脑发出蜂鸣声。 |\n| `\\b` | 退格 | 使光标后退（即向左移动）一个位置。 |\n| `\\r` | 回车 | 使光标回到当前行的开头，而不是下一行。\
  \ |\n| `\\\\` | 反斜杠 | 打印一个反斜杠。 |\n| `\\'` | 单引号 | 打印一个单引号。 |\n| `\\\"` | 双引号 | 打印一个双引号。\
  \ |\n\nC++ 初学者常犯的一个错误是在尝试编写转义序列时，使用了正斜杠（`/`）而不是反斜杠（`\\`）。这是行通的。例如，看下面这行代码。\n\n```\n\
  cout << \"Four score/nand seven/nyears ago./n\";  // 错误！\n```\n\n由于程序员不小心写了 `/n`\
  \ 而不是 `\\n`，`cout` 只会在屏幕上显示 `/n` 字符，而不是开始新行输出。这段代码将产生以下输出：\n\n```\nFour score/nand\
  \ seven/nyears ago./n\n```\n\n另一个常见错误是忘记在引号内放入 `\\n`。例如，以下代码将无法编译。\n\n```\n cout\
  \ << \"Good\" << \\n;      // 错误！\ncout << \"Morning\" << \\n;   // 这段代码无法编译。\n\
  ```\n\n我们可以通过将 `\\n` 序列放在字符串字面量内部来修正代码，如下所示：\n\n```\n cout << \"Good\\n\";     \
  \    // 这样可以运行。\ncout << \"Morning\\n\";\n```\n\n```\n\"One\\nTwo\\nThree\\n\"\n\
  ```\n\n图 2-2 中的图将此字符串拆分为单个字符。注意每个 `\\n` 转义序列被仅视为一个字符。\n\n## 图 2-2 字符串中的单个字符\n\n\
  | `0` | `n` | `e` | `\\n` | `T` | `w` | `o` | `\\n` | `T` | `h` | `r` | `e` | `e`\
  \ | `\\n` |\n\n## 2.3 `#include` 指令\n\n### 概念\n\n`#include` 指令会将另一个文件的内容插入到程序中。\n\
  \n现在是扩展我们对 `#include` 指令讨论的好时机。下面这行代码出现在每个示例程序的顶部。\n\n```\n#include <iostream>\n\
  ```\n\n如前所述，任何使用 `cout` 对象的程序都必须包含 `iostream` 头文件。这是因为 `cout` 并不是 C++ 语言“核心”部分的一部分。具体来说，它是*输入/输出流库*的一部分。`iostream`\
  \ 头文件包含了描述 `iostream` 对象的信息。没有它，编译器将不知道如何正确编译使用 `cout` 的程序。\n\n预处理器指令不是 C++ 语句。它们是给预处理器的命令，预处理器在编译器之前运行（因此被称为“预处理器”）。预处理器的工作是设置程序，让程序员的工作更轻松。\n\
  \n例如，任何使用 `cout` 对象的程序都必须包含 `iostream` 文件中详尽的设置信息。程序员可以将所有信息手动输入程序中，但这将非常耗时。另一种方法是使用编辑器将其“剪切并粘贴”到程序中，但效率依然低下。解决方案是让预处理器自动插入\
  \ `iostream` 的内容。\n\n### 警告！\n\n不要在预处理器指令末尾使用分号。因为预处理器指令不是 C++ 语句，它们不需要分号。事实上，在许多情况下，如果预处理器指令以分号结束，会导致错误。\n\
  \n一个 `#include` 指令必须包含你想要插入到程序中的文件名。预处理器会在遇到 `#include` 指令的地方将该文件的全部内容插入到程序中。编译器实际上并看不到\
  \ `#include` 指令。相反，它看到的是预处理器插入的代码，就像程序员亲手输入在那里那里一样。\n\n头文件中包含的代码是 C++ 代码。通常，它们描述了如\
  \ `cout` 等复杂的对象。以后你将学习创建自己的头文件。\n\n## 检查点\n\n1. 2.3 下面这个 `cout` 语句包含错误。\n    ```\n\
