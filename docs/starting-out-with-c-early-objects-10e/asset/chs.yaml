  \n程序 4-17 后定义了它的变量。\n\n在程序 4-17 中，`income` 变量定义在第 16 行，在构成 `main` 函数体的代码块的大括号内部。因此，它的作用域（可以使用它的程序部分）包含了第\
  \ 16 行到第 38 行。这些是从定义点到关闭 `main` 函数的行。\n\n## 变量作用域\n\n变量的作用域限于定义它的块。\n\nC++ 允许你在程序的几乎任何地方创建变量。一种常见的做法是将函数的所有变量定义在函数的顶部，紧跟标记函数体开始的左括号之后。然而，特别是在较长的程序中，变量有时定义在程序中使用它们的地方。只要它们在使用之前被定义，这是允许的。\n\
  \n你在本章的早期部分了解到，用大括号包含一个或多个编程语句定义了一个代码块。函数 `main` 的体必须被大括号包含，是一个代码块。`if/else` 语句中与\
  \ `if` 或 `else` 相关的语句集也是如此。每当在块内部定义变量时（你可以在任何块内部定义变量），它的作用域就是程序中从定义处到块右括号之间的部分。因此，定义在函数顶部的变量的作用域本质上是整个函数，而在内部块中定义的变量的作用域只是该块。\n\
  \n程序 4-17 后定义了它的变量。\n\n在程序 4-17 中，`income` 变量定义在第 16 行，在构成 `main` 函数体的代码块的大括号内部。因此，它的作用域（可以使用它的程序部分）包含了第\
  \ 16 行到第 38 行。这些是从定义点到关闭 `main` 函数的行。\n\n（此处省略重复的段落，根据指令要求不重复输出原文，但原文中存在大量重复内容，译文已按逻辑保留并翻译）\n\
  \n\n\n\n每个字符（甚至是空格）都对应着一个 ASCII 码。请注意，大写字母 `'A'`–'Z'` 的代码与小写字母 `'a'`–'z'` 不同。同样请注意，代表数字的字符（如\
  \ `'1'` 或 `'2'`）的 ASCII 码与该数字本身的值不同。显示所有字符 ASCII 值的完整表格可以在 附录 A 中找到。\n\n当比较两个字符时，实际上比较的是它们的\
  \ ASCII 值。`'A' < 'B'` 是因为 `'A'` 的 ASCII 值 (65) 小于 `'B'` 的 ASCII 值 (66)。同样，`'1' <\
  \ '2'` 是因为 `'1'` 的 ASCII 值 (49) 小于 `'2'` 的 ASCII 值 (50)。然而，如 表 4-11 所示，小写字母的数字大于大写字母，因此\
  \ `'a' > 'Z'`。程序 4-19 展示了如何使用关系运算符进行字符比较。\n\n# 比较 `string` 对象\n\n`string` 对象也可以用关系运算符进行比较。与单个字符一样，当比较两个\
  \ `string` 对象时，实际上比较的是构成字符串的字符的 ASCII 值。例如，假设程序中以下定义：\n\n```\nstring str1 = \"ABC\"\
  ;\nstring str2 = \"XYZ\";\n```\n\n`string` 对象 `str1` 被认为小于 `string` 对象 `str2`，因为字符\
  \ “ABC”在字母顺序上早于（ASCII 值小于）字符 “XYZ”。因此，以下 `if` 语句将在屏幕上显示消息“str1 is less than str2.”。\n\
  \n```\nif (str1 < str2)\n    cout << \"str1 is less than str2.\";\n```\n\n第一个操作数中的每个字符都会逐一与第二个操作数对应位置的字符进行比较。如果两个\
  \ `string` 对象中的所有字符都匹配，则这两个字符串是相等的。如果对应位置的两个字符不匹配，就可以确定其他关系。如果第一个操作数中第一个不匹配的字符小于第二个操作数对应的字符，则第一个操作数小于第二个操作数。同样，如果第一个操作数中第一个不匹配的字符大于第二个操作数对应的字符，则第一个操作数大于第二个操作数。\n\
  \n例如，假设程序有以下定义：\n\n```\nstring name1 = \"Mary\";\nstring name2 = \"Mark\";\n```\n\
  \n`name1` 中的值，“Mary”大于 `name2` 中的值，“Mark”。这是因为 `name1` 中的前三个字符的 ASCII 值与 `name2`\
  \ 中的前三个字符相同，但 “Mary” 第四个位置的 'y' 的 ASCII 值大于 “Mark” 对应位置的 'k'。\n\n可以使用任何关系运算符来比较两个\
  \ `string` 对象。这里是 `name1` 和 `name2` 的一些有效比较。\n\n```\nname1 > name2       // true\n\
  name1 <= name2      // false\nname1 != name2      // true\n```\n\n当然，`string` 对象也可以与字符串字面量进行比较：\n\
  \n```\nname1 < \"Mary Jane\" // true\n```\n\n程序 4-20 进一步演示了如何将关系运算符用于 `string` 对象。\n\
  \n### 注意\n\n与 `string` 对象不同，C 字符串无法用关系运算符进行比较。要比较 C 字符串（你记得它们是被定义为字符数组的字符串），你必须使用\
  \ `strcmp` 函数，该函数将在 第 12 章 中讨论。\n\n# 测试字符\n\n程序 4-19 将用户输入的字符与某些字符字面量进行比较，以测试输入的字符是否为数字、大写字母或小写字母。我们还可以通过\
  \ C++ 提供的函数来测试这些内容。这些函数测试字符的 ASCII 值并返回 `true` 或 `false`。例如，以下程序使用 `isupper` 函数来判断传入的字符是否为大写字母。如果是，则返回\
  \ `true`。\n\n```\nchar letter = 'a';\nif (isupper(letter))\n   cout << \"Letter\
  \ is uppercase.\";\n```\n\n由于 `letter` 是小写字母，`isupper` 返回 `false`，`if` 语句将不会执行其中的内容。表\
  \ 4-12 列出了常用的字符测试函数。\n\n# 表 4-12 字符\n\n| 字符 | 说明 |\n| :--- | :--- |\n| `isalpha`\
  \ | 如果参数是字母字符，则返回 `true`。 |\n| `isalnum` | 如果参数是字母或数字，则返回 `true`。 |\n| `isdigit`\
  \ | 如果参数是 0 到 9 之间的数字，则返回 `true`。 |\n| `islower` | 如果参数是小写字母，则返回 `true`。 |\n| `isprint`\
  \ | 如果参数是打印字符（包括空格），则返回 `true`。 |\n| `ispunct` | 如果参数是非字母、数字或空格的符号，则返回 `true`。 |\n\
  | `isupper` | 如果参数是大写字母，则返回 `true`。 |\n| `isspace` | 如果参数是空白字符，则返回 `true`。空白字符包括以下内容：\n\
  ```\n空格 ' ' 换符 '\\n' 制表符 '\\t'\n``` | 程序 4-21 使用了表 4-12 所示的函数。它要求输入一个字符，然后根据每个函数的返回值显示不同的消息。\n\
  \n# 练习题\n\n1. 4.30 判断以下关系表达式的真假。请参考 附录 A 中的 ASCII 表。\n    - `'a' < 'z'`\n    - `'a'\
  \ == 'A'`\n    - `'5' < '7'`\n    - `'a' < 'A'`\n    - `'1' == 1`\n    - `'1' ==\
  \ 49`\n2. 4.31 判断以下关系表达式的真假。请参考 附录 A 中的 ASCII 表。\n    - “Bill” == “BILL”\n    -\
  \ “Bill” < “BILL”\n    - “Bill” < “Bob”\n    - “189” > “23”\n    - “189” > “Bill”\n\
  \    - “Mary” == “ Mary”\n    - “Mary” < “MaryEllen”\n    - “MaryEllen” < “Mary\
  \ Ellen”\n3. 4.32 假设 `str1` 和 `str2` 是已经初始值的 `string` 对象。编写一个 `if/else if` 语句来比较这两个对象。如果它们的值相同，应打印一条消息并显示其值；否则，应按字母顺序显示这些值。\n\
  4. 4.33 判断这些字符测试函数将返回 `true` 还是 `false`。\n    - `isalpha('B')`\n    - `isalnum('B')`\n\
  \    - `isdigit('B')`\n    - `islower('B')`\n    - `isprint('B')`\n    - `ispunct('B')`\n\
  \    - `isupper('B')`\n    - `isspace('B')`\n\n\n\n你可以使用条件运算符来创建类似于 `if/else` 语句的短表达式。\n\
  \n条件运算符非常强大且独特。它提供了一种表示简单 `if/else` 语句的简写方法。该运算符由问号（`?`）和冒号（`:`）组成。它的格式如下：\n\n```\n\
  \ expression ? expression : expression;\n```\n\n这是一个使用条件运算符的语句示例：\n\n```\n x < 0\
  \ ? y = 10 : z = 20;\n```\n\n该语句被称为`conditional expression`（条件表达式），由 `?` 和 `:` 符号分隔的三个子表达式组成。表达式分别为\
  \ `x < 0`、`y = 10` 和 `z = 20`。\n\n![此语句被称为条件表达式，由 ? 和 : 符号分隔的三个子表达式组成](img/Page_211_001.png)\n\
  \n上面的条件表达式的操作与此 `if/else` 语句相同：\n\n```\n if (x < 0)\n    y = 10;\nelse\n    z =\
  \ 20;\n```\n\n条件表达式中问号之前的部分是待测试的条件。它类似于 `if` 语句括号中的表达式。如果条件为真，则执行 `?` 和 `:` 之间的语句部分。否则，执行\
  \ `:` 之后的部分。图 4-9 展示了这三个子表达式所扮演的角色。\n\n# 图 4-9 条件表达式\n\n![图像解释了条件表达式。](img/FG_04_009.png)图\
  \ 4-9 完整替代文本\n\n如果有帮助，你可以在子表达式周围加上括号，如下所示：\n\n```\n (x < 0) ? (y = 10) : (z = 20);\n\
  ```\n\n### Note\n\n因为条件运算符需要三个操作数，所以它是一个 `ternary`（三元）运算符。\n\n# 使用条件表达式的值\n\n记住，在\
  \ C++ 中，所有表达式都有值，这包括条件表达式。如果第一个子表达式为真，则条件表达式的值就是第二个子表达式的值。否则，它就是第三个子表达式的值。这是一个使用条件表达式值的赋值语句示例：\n\
  \n```\n a = (x > 100) ? 0 : 1;\n```\n\n赋值给变量 `a` 的值将是 0 或 1，取决于 `x` 是否大于 100。该语句的逻辑与以下\
  \ `if/else` 语句相同：\n\n```\n if  (x > 100)\n    a = 0;\nelse\n    a = 1;\n```\n\n\
  程序 4-22 可以用于帮助顾问计算她的费用。她的费率是每小时 50 美元，但她的最低收费是五个小时。条件运算符用于一个语句中，确保小时数不会低于五。\n\n\
  让我们仔细仔细观察第 20 行使用条件表达式的语句：\n\n```\n hours = hours < MIN_HOURS ? MIN_HOURS : hours;\n\
  ```\n\n如果变量 `hours` 的值小于 `MIN_HOURS`，它将 `MIN_HOURS` 存储在 `hours` 中。否则，它将原有的值赋予 `hours`。这确保了当\
  \ `hours` 在第 23 行用于计算顾问费用时，其值不会小于 `MIN_HOURS`。\n\n如你所见，条件运算符让你能够将决策能力封装在一行简洁的代码中。只要稍加想象力，它可以应用于许多其他编程问题。例如，考虑以下语句：\n\
  \n```\n cout << \"Your grade is: \" << (score < 60 ? \"Fail.\" : \"Pass.\");\n```\n\
  \n如果你使用 `if/else` 语句，该语句将写如下：\n\n```\n if (score < 60)\n   cout << \"Your grade\
  \ is: Fail.\";\nelse\n   cout << \"Your grade is: Pass.\";\n```\n\n### Note\n\n\
  括号放在条件表达式周围，是因为 `<<` 运算符的优先级高于 `?:` 运算符。如果没有括号，将只有表达式 `score < 60` 的值会被发送到 `cout`。\n\
  \n## Checkpoint\n\n1. 4.34 将以下 `if/else` 语句重写为条件表达式。\n\n    1.  ```\n         if\
  \ (x > y)\n            z = 1;\n        else\n            z = 20;\n        ```\n\n\
  \    2.  ```\n         if (temp > 45)\n           population = base * 10;\n    \
  \    else\n           population = base * 2;\n        ```\n\n    3.  ```\n     \
  \    if (hours > 40)\n            wages *= 1.5;\n        else\n            wages\
  \ *= 1;\n        ```\n\n    4.  ```\n         if (result >= 0)\n            cout\
  \ << \"The result is positive\";\n        else\n            cout << \"The result\
  \ is negative.\";\n        ```\n\n2. 4.35 将以下条件表达式重写为 `if/else` 语句。\n\n    1.  `j\
  \ = k > 90 ? 5 : 12;`\n\n    2.  `factor = x >= 10 ? y : y;`\n\n    3.  `total +=\
  \ count == sales : sales;`\n\n    4.  `cout << (num % 2 == 0 ? \"Even\" : \"Odd\"\
  );`\n\n3. 4.36 以下程序段将显示什么？\n\n    ```\n     const int UPPER = 8, LOWER = 2;\n  \
  \  int num1, num2, num3 = 12, num4 = 3;\n\n    num1 = num3 < num4 ? UPPER : LOWER;\n\
  \    num2 = num4 > UPPER ? UPPER : LOWER;\n    cout << num1 << \" \" << num2;\n\
  \    ```\n\n\n\n第一个 `case` 语句是 `case 'A':`，第二个是 `case 'B':`，第三个是 `case 'C':`。这些语句标记了当变量\
  \ `choice` 包含 'A'、'B' 或 'C' 值时，程序跳转的位置。（记住，字符变量和字面量被视为整数。）如果用户输入 A、B 或 C 以外的任何内容，则会跳转到\
  \ `default` 部分。\n\n注意位于 `case 'A'`、`case 'B'` 和 `case 'C'` 部分末尾的 `break` 语句。\n\n\
  ![一张显示源代码的图片](img/Page_217_01.png)4.12-15 完整备用文本\n\n`break` 语句会导致程序退出 `switch` 语句。遇到\
  \ `break` 语句后执行的下一条语句将是终止整个 `switch` 语句的结束括号之后的任何语句。每当你想要“退出” `switch` 语句时，都需要 `break`\
  \ 语句，因为它不像 `if/else if` 语句那样在执行完一组语句后自动退出。\n\n`case` 语句显示程序从块中的哪里开始执行，而 `break`\
  \ 语句显示程序从哪里停止。如果没有 `break` 语句，程序将执行从匹配的 `case` 语句到块末尾的所有行。\n\n### Note\n\n`default`\
  \ 部分（如果没有 `default` 则为最后一个 `case` 部分）不需要 `break` 语句。但某些程序员为了一致性仍然倾向于在那里也放一个。\n\n\
  程序 4-24 是程序 4-23 的修改版本，展示了如果省略 `break` 语句会发生什么。\n\n如果没有 `break` 语句，程序 4-24 会“贯穿”（falls\
  \ through）匹配 `case` 表达式语句下方的所有语句。有时这正是你所需要的。程序 4-25 列出了客户可以选择的三种电视机型号的特征。100 型包含一个\
  \ 42 英寸 LCD 平板屏。200 型包含 1080p 高清图像以及一个 42 英寸 LCD 平板屏。300 型包含所有这些内容以及一个内置的数字录像机 (DVR)。该程序使用仔细省略\
  \ `break` 的 `switch` 语句来打印所选型号的特征。\n\n这种“贯穿”能力的另一个用处是，当你想让程序针对多个 `case` 表达式跳转到同一组语句时。例如，程序\
  \ 4-26 要求用户选择狗粮等级。可选范围是 A、B 和 C。`switch` 语句可以识别大写或小写字母。\n\n当用户输入 `'a'` 时，相应的 `case`\
  \ 没有关联的语句，因此程序会贯穿到下一个 `case`，它对应于 `'A'`。\n\n```\n case 'a':\ncase 'A':cout << \"\
  30 cents per pound.\\n\";\n         break;\n```\n\n相同的技术适用于 `'b'` 和 `'c'`。\n\n#\
  \ 在菜单驱动系统中使用 `switch`\n\n`switch` 语句是构建菜单驱动系统的自然机制，就像我们在程序 4-10 中构建的那样。然而，在那个程序中，一旦用户选择了购买哪个包，程序就会使用\
  \ `if/else if` 语句来计算费用。程序 4-27 修改了该程序改为使用 `switch` 语句。注意 `switch` 语句是如何嵌套在 `if`\
  \ 语句内部的，在提示月份数之前验证用户的菜单选择。\n\n## Checkpoint\n\n1. 第一个 `case` 语句是 `case 'A':`，第二个是\
  \ `case 'B':`，第三个是 `case 'C':`。这些语句标记了当变量 `choice` 包含 'A'、'B' 或 'C' 值时，程序跳转的位置。（记住，字符变量和字面量被视为整数。）如果用户输入\
