  \ 293\n- `写入函数模板`, 1013–1016. 查看函数模板\n\n# 附录 E 面向对象编程简述\n\n什么是面向对象编程？面向对象系统意味着什么？为了回答这个问题，我们先来看此之前的编程范式。\n\
  \n# 过程式编程\n\n在 20 世纪 90 年代以前，大多数计算机程序都是`过程式程序`。这些程序被设计为一组过程（或函数），用于执行实现功能所需的各种任务。每个过程由编程语言语句组成，计算机按顺序执行这些语句以处理程序必须完成的某项任务。语句可以收集用户输入、处理存储在内存中的数据、进行计算或执行任何其他操作。\n\
  \n\n\n\n过程化编程以创建过程为中心，而面向对象的编程则以创建对象为中心。`object`（对象）是一个编程实体，通常用于模拟现实世界中的某个实体，例如学生、银行账户，甚至是计算机屏幕。对象“知道”关于它自身的某些事情，并可以“做”某些事情。它所知道的事情被称为它的`attributes`（属性），并通过将它们存储为数据来被“记住”。它能做的事情被称为它的`methods`（方法），由它通过函数可以执行的动作或行为组成。从概念上讲，对象是一个由数据（属性）和函数（方法）组成的自包含单元。\n\
  \n面向对象编程（OOP）彻底改变了 GUI 软件的开发。例如，在 GUI 环境中，计算工资的程序可能会显示为图 E-2 所示的窗口。\n\n## 图 E-2\n\
  \n![“工资计算器”应用程序的界面显示了用户控件。](img/FG_AppE_002.png)图 E-2 完整替代文本\n\n这个窗口可以被视为一个对象。它包含其他对象，如文本输入框和命令按钮。每个对象都有决定其外观的属性。例如，看这些命令按钮。其中一个标题为“计算总工资”（Calculate\
  \ Gross Pay），另一个显示为“关闭”（Close）。这些标题以及按钮的大小和位置都是命令按钮对象的属性。对象还可以存储用户输入的数据。例如，文本输入框之一允许用户输入工作小时数。当这些数据被输入时，它们作为文本输入框的属性被存储起来。\n\
  \n对象也有动作，或方法。例如，当用户用鼠标点击“计算总工资”按钮时，程序将显示总工资金额。与标记为“计算总工资”的按钮对象相关的方法（或函数）会执行此动作。\n\
  \n## 面向对象编程的益处\n\nGUI 软件开发的复杂性并不是过程化程序员面临的首个困难挑战。在 Windows 和其他 GUI 出现很久以前，程序员就在与代码/数据分离的问题作斗争。在过程化编程中，数据和程序代码之间有明确的分。数据存储在特定数据类型的变量中，以及程序员定义的数据结构中。程序代码将数据传递给设计用于接收和处理数据的模块。但是，当程序的规范发生变化，导致重新设计数据结构、更改数据类型并向程序添加新变量时，会发生什么？在过程化程序中，当数据结构发生变化时，操作数据的模块也必须更改以接受新格式。这增加了程序员的工作量，并为代码中出现\
  \ Bug 的可能。\n\n面向对象编程（OOP）通过封装（encapsulation）和数据隐藏（data hiding）解决了代码/数据分离的问题。`Encapsulation`（封装）是将数据与处理这些数据的过程封装进单一对象中。`Data\
  \ hiding`（数据隐藏）是指对象向使用该对象的程序隐藏数据存储细节的能力。外部代码只能通过调用对象的方法来访问数据。这些方法（或过程）提供了一个接口，外部程序通过该接口访问对象中存储的数据。程序不需要知道任何关于数据如何存储的信息。它们只需要知道如何与对象的方法进行交互。如果程序员需要更改对象内部数据的类型或结构，那么提供对象数据与使用它的外部程序之间接口的方法也会同时更改。但从外部程序的角度来看，没有任何变化；它像以前一样访问数据。这在图\
  \ E-3 图 E-3 完整替代文本\n\n## 组件复用\n\n软件开发中鼓励使用 OOP 的另一个趋势是`component reusability`（组件复用）。组件是执行特定的、定义良好的操作或提供特定服务的软件对象。组件不是一个独立的程序，而是可以被需要该服务的程序使用的对象。例如，Sharon\
  \ 是一个开发了渲染 3D 图像组件的程序员。她是一个数学天才，对计算机图形非常了解，因此她的组件被编码为执行所有必要的 3D 数学运算并处理计算机的视频硬件。Tom\
  \ 正在为一家建筑事务所编写程序，他需要应用程序显示建筑的 3D 图像。为了节省时间和工作，可以使用 Sharon 的组件来执行 3D 渲染。\n\n## 对象的日常实例\n\
  \n将一个简单的数字闹钟想象为一个对象。它具有以下属性：\n\n* `hour`（1–12 之间的值）\n* `minute`（0–59 之间的值）\n* `second`（0–59\
  \ 之间的值）\n* `day/night`（上午或下午）\n* `alarm set time`（闹钟时间）\n* `alarm status`（开启或关闭）\n\
  \n你可以看到，属性仅仅是定义闹钟`state`（状态）的数据。表 E-1 列出了闹钟的方法。这些是闹钟执行的动作。\n\n### 表 E-1\n\n| 方法\
  \ | 执行时 | 动作 |\n| :--- | :--- | :--- |\n| `Increment second` | 每秒 | `second` 属性加\
  \ 1。如果值为 59，则变为 0。 |\n| `Increment minute` | `second` 从 59 变为 0 | `minute` 属性加 1。如果值为\
  \ 59，则变为 0。激活 `Check alarm time` 方法。 |\n| `Increment hour` | `minute` 从 59 变为 0\
  \ | `hour` 属性加 1。如果值为 12，则变为 1。 |\n| `Change day/night indicator` | `hour` 从 11\
  \ 变为 12 | 更改指示状态。 |\n| `Set current time` | 用户点击设置时间按钮 | 将 `hour, minute` 和 `day/night`\
  \ 设置为用户的值。 |\n| `Set alarm time` | 用户点击设置闹钟按钮 | 将 `alarm set time` 设置为用户的值。 |\n\
  | `Check alarm time` | 由 `Increment minute` 方法触发 | 检查当前时间 = `alarm set time` 且 `alarm\
  \ status` 为开启。如果是，激活 `Sound alarm` 方法。 |\n| `Turn alarm on` | 用户将闹钟开关拨到开启位置 | 将\
  \ `alarm status` 设置为开启。 |\n| `Sound alarm` | 由 `Check alarm time` 方法触发 | 响铃，直到 `Turn\
  \ alarm off` 方法被激活。 |\n| `Turn alarm off` | 用户将闹钟开关拨到关闭位置 | 将 `alarm status` 设置为关闭。\
  \ |\n\n\n\n\n\n然而，闹钟的一些方法对你是公开的。特别是，你可以执行“设置当前时间”、“设置闹钟时间”、“开启闹钟”和“关闭闹钟”方法。你可以通过按下各种按钮和移动各种开关来实现这些，这些开关作为公共\
  \ `interface` 的一部分，允许外部实体与对象进行交互。\n\n# 类与对象\n\n类（Class）是对象的类型或类别。它规定了该类的对象所拥有的属性和方法。然而，类并不是对象。它仅仅描述了该类的对象在创建时应该什么样。对象本身是类的实例，一旦定义了类，就可以从它创建多个实例（对象）。让我们用闹钟的例子来进一步探讨这个概念。\n\
  \n在生产闹钟之前，必须先对其进行设计。它看起来像什么样？它将拥有什么种内部组件？如何控制它们？界面将由什么组成？设计完成后，必须安排实际机械进行组装。一旦完成，就可以根据相同的设计使用相同的设备生产出多个时钟。\n\
  \n现在让我们来看一个软件示例。杰西卡（Jessica）是一个计算机程序员，她有一个蝴蝶花园，并以研究蝴蝶为爱好。她决定创建一个程序来帮助她对蝴蝶信息进行分类。\n\
  \n![图像显示了 5 只蝴蝶。它们的大小不同，翅膀上的设计也不同。](img/UNFG_AppE_001.png)\n\n然而，在编写实际程序之前，她设计了一个\
  \ `Butterfly` 类，它规定了属性（变量）和方法，这些方法对于存储和处理所有蝴蝶共同的数据非常有用。创建类之后，她编写了程序。该程序创建并使用了许多不同的\
  \ `Butterfly` 对象。每个对象都有不同的名称，例如 `monarch`、`hollyBlue`、`swallowTail` 等。然而，它们都是 `Butterfly`\
  \ 的实例。\n\n# 面向对象的系统\n\n组件重用性和面向对象编程技术为大型计算机应用程序成为由独特的协作实体（组件）组成的整个系统奠定了基础。随着你继续阅读这本书，你将变得越来越熟悉编写面向对象的程序。你还将学习如何有效地使用现有组件、如何创建新组件，以及如何让组件协同工作以创建整个面向对象的系统。\n\
  \n# 附录 F 在类设计中使用 UML\n\n在设计类时，绘制 UML 图表通常很有帮助。`UML` 代表“统一建模语言”（Unified Modeling\
  \ Language）。UML 提供了一组标准图表，用于图形化表示面向对象的系统。你的教科和本附录介绍了一些最常用的图表。图 F-1 显示了类 UML 图的通用布局。注意，该图是一个被分为三个部分的框。顶部部分是写类名的地方。中间部分包含类成员变量列表。底部部分包含类成员函数列表。\n\
  \n# 图 F-1\n\n![图表显示一个被分为 3 个水平部分的框。](img/FG_AppF_001.png)图 F-1 完整备用文本\n\n例如，在第 7\
  \ 章“类与对象导论”中，你学习了一个 `Rectangle` 类，该类可以用于处理矩形的程序。该类具有以下成员变量：\n\n*   `length`\n* \
  \  `width`\n\n该类还具有以下成员函数：\n\n*   `setLength`\n*   `setWidth`\n*   `getLength`\n\
  *   `getWidth`\n*   `getArea`\n\n根据这些信息，我们可以为该类构造一个简单的 UML 图，如图 F-2 所示。\n\n图 F-2\
  \ 中的 UML 图告诉我们类的名称、成员变量的名称以及成员函数的名称。将此图与接下来的实际 C++ 类声明进行比较。\n\n# 图 F-2\n\n![图表显示了\
  \ “Rectangle” 类的 UML 图。](img/FG_AppF_002.png)图 F-2 完整备用文本\n\n```\nclass Rectangle\n\
  {\n   private:\n       double length;\n       double width;\n   public:\n      \
  \ void setLength(double);\n       void setWidth(double);\n       double getLength();\n\
  \       double getWidth();\n       double getArea();\n};\n```\n\n图 F-2 中显示的 UML\
  \ 图显示了类的名称、成员变量的名称和成员函数的名称。\n\n# 访问规范\n\n统一建模语言还提供了一种符号来表示成员是私有的还是公开的。在 UML 图中，你可以在名称前使用\
  \ `–` 来表示它是私有的，或者使用 `+` 来表示它是公开的。图 F-2 显示了修改后的 UML 图。\n\n# 图 F-3\n\n![图表显示一个被分为三个水平部分的框。](img/FG_AppF_001.png)图\
  \ F-1 完整备用文本\n\n# 数据类型和参数符号\n\n在 UML 符号中，首先列出变量名，然后是数据类型。这与 C++ 语法要求的数据类型先出现相反。要指示成员变量的数据类型，在名称后加冒号。例如，`Rectangle`\
  \ 类中的 `width` 是 `double` 类型，因此可以这样列在 UML 图中：\n\n```\n– : double\n```\n\n### 注意\n\
  \n成员函数的返回类型可以以相同的方式列出：在函数名称之后，冒号后跟返回类型。`Rectangle` 类 `getLength` 返回 `double`，因此可以这样列在\
  \ UML 图中：\n\n```\n+ getLength(): double\n```\n\n参数变量及其数据类型可以列在成员函数的括号内。例如，`Rectangle`\
  \ 类 `setLength` 有一个名为 `len` 的 `double` 参数，因此可以这样列在 UML 图中：\n\n```\n+ setLength(len\
  \ : double) : void\n```\n\n图 F-4 显示了 `Rectangle` 类的 UML 图，包含了数据类型、返回类型和参数符号。\n\n\
  # 图 F-4\n\n![图表显示了 “Rectangle” 类的 UML 图。](img/FG_AppF_004.png)图 F-4 完整备用文本\n\n#\
  \ 在 UML 图中显示构造函数和析构函数\n\n在 UML 图中显示构造函数有多种接受的方法。在本附录中，我们将像显示任何其他方法一样显示构造函数，只是不列出返回类型。图\
  \ F-5 显示了 `Sale` 类的 UML 图，该类在[第 7 章]中也讨论过。该类有两个重载的构造函数，以及 `calcSaleTotal` 方法。\n\n\
  \n\n\n![图表显示了“Sale”类的 UML 图。](img/FG_AppF_005.png)图 F-5 完整备用文本\n\n# UML 图中的对象组合\n\
  \n本书的第 11 章引入了对象组合。当一个类包含另一个类的实例作为成员时，就会发生对象组合。在 UML 图中，对象组合通过一根一端带有空心菱形的连线连接两个类来表示。菱形靠近包含其他类实例的那个类。\n\
  \n例如，假设我们有图 F-6 所示的 `PersonInfo` 类，它持有关于一个人的信息。\n\n## 图 F-6\n\n![图表显示了“PersonInfo”类的\
  \ UML 图。](img/FG_AppF_006.png)图 F-6 完整备用文本\n\n假设我们还有图 F-7 所示的 `BankAccount` 类，它持有银行账户的余额，并可以执行存款和取款等操作。\n\
  \n## 图 F-7\n\n![图表显示了“BankAccount”类的 UML 图。](img/FG_AppF_007.png)图 F-7 完整备用文本\n\n\
  图 F-8 显示了另一个类 `BankCustomer` 的 UML 图，该类包含 `PersonInfo` 和 `BankAccount` 类的实例作为成员。类之间的关系通过带有空心菱形的连线表示。空心菱形靠近\
  \ `BankCustomer` 类，因为它是包含其他类实例作为成员的类。\n\n## 图 F-8\n\n![图表显示了“BankCustomer”、“PersonInfo”和“BankAccount”类。](img/FG_AppF_008.png)图\
  \ F-8 完整备用文本\n\n# 显示保护成员\n\n本书的第 11 章还引入了继承，这允许新类从现有类派生。如果一个类将要用作派生其他类的基类，那么通常希望将其某些成员指定为\
  \ `protected`，而不是 `public` 或 `private`。正如第 11 章所示，类的保护成员像私有成员一样受到保护，防止外部使用，但它们可以被派生类的成员函数访问。UML\
  \ 图中的保护类成员可以用 `#` 符号表示。图 F-9 显示了一个具有两个保护变量和一个保护方法的类的 UML 图。\n\n## 图 F-9\n\n![图表显示了“GradedActivity”类的\
  \ UML 图。](img/FG_AppF_009.png)图 F-9 完整备用文本\n\n# UML 图中的继承\n\n你可以在 UML 图中通过一根一端带有空心箭头的连线连接两个类来显示继承。箭头指向基类。例如，图\
  \ F-10 显示了另一个类 `BankCustomer` 的 UML 图，该类包含 `PersonInfo` 和 `BankAccount` 类的实例作为成员。类之间的关系通过带有空心菱形的连线表示。空心菱形靠近\
  \ `BankCustomer` 类，因为它是包含其他类实例作为成员的类。\n\n## 图 F-10\n\n![图表显示了“BankCustomer”、“PersonInfo”和“BankAccount”类。](img/FG_AppF_008.png)图\
  \ F-10 完整备用文本\n\n\n\n\n`extern` 声明并不定义另一个变量；它只是允许访问在其他文件中定义的变量。\n\n只有真正的变量（而不是常量变量）应该被声明为\
  \ `extern`。\n\n```\nconst int maxCustomers = 35;      //不要将此声明为 extern。\n```\n\n\
  这是因为某些编译器会将特定类型的常量变量直接编译到代码中，而不在内存中为它们分配空间，从而导致无法从另一个文件访问该常量。那么，如何允许一个文件中的函数使用另一个文件中定义的变量的值，同时确保它们不会更改该值的值呢？解决方案是结合\
  \ `const` 关键字和 `extern` 声明使用。因此，变量定义在原始文件中，如下所示：\n\n```\n string nameOfBank = “First\
  \ Federal Savings Bank”;\n```\n\n在允许访问该变量的另一个文件中，将 `const` 关键字放在 `extern` 声明上，如下所示：\n\
  \n```\n extern const string nameOfBank;\n```\n\n如果你想保护全局变量不被其定义文件之外的任何地方，可以将该变量声明为\
  \ `static`。这将其作用域限制在定义它的文件中，并从其他文件中隐藏其名称：\n\n```\n static double balance;\n```\n\
  \n[图 G-2] 显示了示例银行程序中的一些全局变量声明。`customer` 和 `accountNum` 定义在 `bank.cpp` 中。由于它们没有被声明为\
  \ `static` 变量，它们的作用域扩展到了 `loans.cpp`、`savings.cpp` 和 `checking.cpp`，这三个文件都包含了这些变量的\
  \ `extern` 声明。尽管变量定义在 `bank.cpp` 中，但也可以被其他三个文件中的任何函数访问。\n\n# 图 G-2\n\n![一张图表显示了\
  \ 4 个文件中的全局变量声明。](img/FG_AppG_002.png)图 G-2 完整替代文本\n\n[图 G-2] 包含了静态全局变量的示例。这些变量在定义它们的文件之外无法访问。例如，变量\
  \ `interest` 在 `loans.cpp` 和 `savings.cpp` 中都被定义为静态全局变量。这意味着这两个文件中的每个都有自己名为 `interest`\
  \ 的变量，且该变量在定义它的文件之外无法访问。定义在 `savings.cpp` 和 `checking.cpp` 中的变量 `balance` 和 `deposit`\
  \ 也是如此。\n\n在我们的示例中，变量 `customer` 被定义为字符数组。它本可以被定义为 `string` 对象，但将其制为 C 字符串是为了说明\
  \ `extern` 声明如何处理数组。注意在 `bank.cpp` 中，该数组带有一个大小说明符定义：\n\n```\n char customer[35];\n\
  ```\n\n但在其他文件找到 `extern` 声明中，它被引用为：\n\n```\nextern char customer[];\n```\n\n在一个一维数组中，数组的大小通常在\
  \ `extern` 声明中被省略。在多维数组中，第一维的大小通常被省略。例如，在一个文件中定义的如下二维数组：\n\n```\n int myArray[20][30];\n\
  ```\n可以通过在其他文件中放置以下声明来使其对其他文件可见。\n\n```\n extern int myArray[][30];\n```\n\n# 面向对象的多文件程序\n\
  \n在创建定义类并创建这些类对象的面向对象程序时，通常将类声明和成员函数定义存储在不同的文件中。通常，程序组件按以下方式存储：\n\n*   类声明——类声明存储在它自己的头文件中，称为*类规格文件*。规格文件的文件名通常与类名相同，扩展名为\
  \ `.h`。\n*   成员函数定义——该类的成员函数定义存储在单独的 `.cpp` 文件中，称为*类实现文件*。该文件必须 `#include` 类规格文件，通常与类名相同，扩展名为\
  \ `.cpp`。\n*   使用该类的客户端函数——任何包含创建和使用类对象的函数的文件也应该 `#include` 类规格文件。它们随后必须与编译后的类实现文件进行链接。\n\
  \n这些组件在下面的示例中给出，该示例创建并使用了一个 `Address` 类。注意一个程序是如何被拆分成单独的文件的。构成程序的 `.cpp` 文件可以单独编译，然后链接以创建可执行程序。\n\
  \n```\n //**********************************************************************\n\
  // address.h 的内容\n// 这是一个包含类声明的规格文件。\n//**********************************************************************\n\
  #include <string>\nusing namespace std;\n\nclass Address\n{private:\n   string name;\n\
  \   string street;\n   string city;\n public:\n   Address(string name, string street,\
  \ string city);\n   Address();\n   void print();\n};\n//***********************************************************************\n\
  // address.cpp 的内容\n// 这是一个包含类成员函数定义的实现文件\n//***********************************************************************\n\
  #include “address.h”\n#include <iostream>\n\nAddress::Address(string name_in, string\
  \ street_in, string city_in)\n{\n   name = name_in;\n   street = street_in;\n  \
  \ city = city_in;\n}\nAddress::Address()\n{\n   name = street = city = ““;\n}\n\
  void Address::print()\n{\n   cout ≪ name << endl\n   ≪ street << endl\n   ≪ city\
  \ << endl;\n}\n//***********************************************************************\n\
  // userfile.cpp 的内容\n// 该文件包含使用类的类的代码。\n//***********************************************************************\n\
  #include “address.h”\n\nint main()\n{\n   //创建一个地址并打印它。\n   Address addr(“John Doe”,\
  \ “123 Main Street”, “Hometown, USA”);\n   addr.print();\n\n   //这里可以放置其他代码。\n \
  \  return 0;\n}\n```\n\n# 附录 H 多继承与虚拟继承\n\n## 引言\n\n与所有面向对象的编程语言一样，C++ 支持继承的概念。然而，与大多数此类语言不同，C++\
  \ 还支持多继承。*多继承*是一种新类同时派生自两个或多个基类的继承类型。当对一个似乎同时属于多个类的对象进行建模时，程序员应该考虑使用多继承。例如，我们可能会有一个\
  \ `Home` 类来建模人类居住的结构，以及另一个 `Automobile` 类来建模人类用于交通目的的某些类型的机器。然后，我们可以想象一个 `MobileHome`\
  \ 类，它的对象同时是 `Home` 和 `Automobile` 类的实例。这种关系在[图 H-1]中所示。\n\n# 图 H-1\n\n![一张图表显示“MobileHome”通过两个箭头连接到“Home”和“Mobile”。](img/FG_AppH_001.png)\n\
  \n图中，指向上的箭头描绘了“是一个”（*is*-a）的关系，说明了移动房屋既是房屋也是汽车。在 C++ 中，这种关系将通过类声明来表示：\n\n```\n class\
  \ Automobile\n{\n   // 汽车成员\n};\nclass Home\n{\n  // 房屋成员\n};\nclass MobileHome\
  \ : public Automobile, public Home\n{\n  // MobileHome 的额外成员\n};\n```\n\n\n\n\n\
  作为使用多继承可能合适的另一个例子，考虑一个拥有各种员工的职业体育组织。`Players`（球员）和`coaches`（教练）都是员工，因此图 H-2 所示的继承层级是非常自然的。\n\
  \n## 图 H-2\n\n![一张图表显示“球员”和“教练”通过两个独立的箭头连接到“员工”。](img/AppH_002.png)\n\n现在考虑一个既是球员又是教练的员工。这类人传统上被称为\
  \ `player-coaches`（球员兼教练）。由于球员兼教练既是球员又是教练，我们得到了图 H-3 所示的继承图。\n\n## 图 H-3\n\n![一张图表显示“球员”和“教练”通过两个独立的箭头连接到“员工”。图表还显示“球员兼教练”通过不同的箭头连接到“球员”和“教练”。](img/AppH_003.png)\n\
  \n我们将图 H-3 所示的情况称为`多继承`（multiple inheritance）。该图的上部分是通常的继承结构，因为它显示 `Player` 和 `Coach`有一个单一基类。图的下部分描绘了多继承：它显示\
  \ `PlayerCoach` 拥有两个基类。\n\n## 多继承的 C++ 实现\n\n在 C++ 中，图 H-3 上半部分所示的继承层级可以通过代码实现：\n\
  \n### PlayerCoach.h 的内容\n\n```\n#include <string>\n#include <iostream>\nusing namespace\
  \ std;\nclass Employee\n{\n    string name;\npublic:\n    string getName(){ return\
  \ name; }\n    Employee(string name){ this->name = name; }\n};\n\nclass Player :\
  \ public Employee\n{\n    int salary;\npublic:\n    int getSalary(){ return salary;\
  \ }\n    void play()\n    {\n        cout << getName() << \" is playing.\\n\";\n\
  \    }\n    //Constructor\n    Player(string name, int salary):\n          // Constructor\
  \ initialization\n          Employee(name), salary(salary)\n    {\n    }\n};\n\n\
  class Coach : public Employee\n{\n    int salary;\npublic :\n    int getSalary(){\
  \ return salary; }\n    void coach()\n    {\n        cout << getName() << \" is\
  \ coaching.\\n\";\n    }\n    //Constructor\n    Coach(string name, int salary):\n\
  \          // Constructor initialization\n          Employee(name), salary(salary)\n\
  \    {\n    }\n};\n```\n\n### PlayerCoach.cpp 的内容\n\n```\n#include \"PlayerCoach.h\"\
  \nint main()\n{\n  // Create Player and Coach objects\n  Player phil(\"Phillip\"\
  , 20000);\n  Coach carol(\"Carol\", 30000);\n  // Call play and coach member functions\n\
  \  phil.play();\n  carol.coach();\n\n  return 0;\n}\n```\n\n### 程序输出\n\n```\nPhillip\
  \ is playing.\nCarol is coaching.\n```\n\n现在让我们考虑使用多继承来定义一个 `PlayerCoach` 类。然而，在此之前，我们应该提到多继承在\
  \ C++ 中很少使用，而且事实上，它可能是使用该特程序中许多问题的根源。在我们处理 `PlayerCoach` 示例时，我们将指出这些困难中的一些。\n\n\
  派生自 `Player` 和 `Coach` 的最简单类是：\n\n```\n#include \"playercoach.h\"\nclass PlayerCoach\
  \ : public Player, public Coach\n{\n};\n```\n\n注意 `PlayerCoach` 除了从其两个基类继承的成员外，没有其他成员。我们刻意这样做是为了让示例尽可能简单。在更真实的情况下，派生类将拥有其基类中没有的额外成员。遗憾的是，这个类将无法编译。原因是它的两个基类都有需要传递参数的非默认构造函数。我们可以通过为\
  \ `PlayerCoach` 配备构造初始化列表来尝试解决这个问题，如下所示。\n\n### PlayerCoachMult.h 的内容\n\n```\n#include\
  \ \"playerCoach.h\"\nusing namespace std;\nclass PlayerCoach : public Player, Coach\n\
  {\npublic:\n    PlayerCoach(string name, int player, int coach):\n          // Constructor\
  \ initialization\n          Employee(name), Player(player), Coach(coach)\n    {\n\
  \    }\n```\n\n\n\n\n在处理一个继承自多个具有共同基类 `B` 的类的类 `K` 的声明时，如果 `B` 已被声明为虚基（virtual），编译器将确保\
  \ `K` 中只包含一个 `B` 的拷贝。在解决共享基类多个拷贝问题的同时，虚继承也带来了一些它自身的问题。再次查看 `PlayerCoachMult.h` 中\
  \ `PlayerCoach` 类列表中第 7 行的构造函数初始化列表：\n\n```\nPlayer(name, playerSalary), Coach(name,\
  \ coachSalary)\n```\n\n由于 `Employee` 是一个虚基类，`PlayerCoach` 类只有一个它的拷贝。对 `Player` 和\
  \ `Coach` 构造函数的调用会导致 `PlayerCoach` 内部单个 `Employee` 对象的构造函数被调用两次。这一事实将导致另一个编译器错误。\n\
  \n为了解决虚基类的多次初始化问题，C++ 编译器将忽略所有派生链中所有中间类中对虚基类构造函数的调用。为了确保虚基类被初始化，C++ 要求`最派生类`（位于多个派生链共同终点的类）来指定共同虚基类的初始化。例如，查看\
  \ Figure H-3。那里展示的继承菱形结构有两个派生链（菱形的左侧和右侧），沿这两条链的中间类分别是 `Player` 和 `Coach`。因此，编译器将忽略这两个类构造函数中的\
  \ `Employee(name)` 调用。为了确保 `Employee` 对象被初始化，必须在 `PlayerCoach` 的构造函数初始化列表中包含对其构造函数的调用，而\
  \ `PlayerCoach` 显然是最派生类。此修改已在下面的代码列表中所示。\n\n### `vPlayerCoach.h` 的内容\n\n```\n1 #include\
  \ <string>\n2 #include <iostream>\n3 using namespace std;\n4 class Employee\n5 {\n\
  6    string name;\n7 public:\n8    string getName(){ return name; }\n9    Employee(string\
  \ name){ this->name = name; }\n10 };\n11\n12 class Player : virtual public Employee\n\
  13 {\n14    int salary;\n15    public:\n16    int getSalary(){ return salary; }\n\
  17    void play()\n18    {\n19        cout ≪ getName() ≪ \" is playing.\\n\";\n\
  20    }\n21     //Constructor\n22    Player(string name, int salary):\n23      \
  \    // Constructor initialization\n24          Employee(name), salary(salary)\n\
  25    {\n26    }\n27 };\n28\n29 class Coach : virtual public Employee\n30 {\n31\
  \    int salary;\n32 public :\n33    int getSalary(){ return salary; }\n34    void\
  \ coach()\n35    {\n36        cout ≪ getName() ≪ \" is coaching.\\n\";\n37    }\n\
  38    //Constructor\n39    Coach(string name, int salary):\n40         // Constructor\
  \ initialization\n41         Employee(name), salary(salary)\n42    {\n43    }\n\
  44 };\n```\n\n### `vPlayerCoachMult.h` 的内容\n\n```\n1 #include \"vplayerCoach.h\"\
  \n2 using namespace std;\n3 class PlayerCoach : public Player, public Coach\n4 {\n\
  5 public:\n6     PlayerCoach(string name, int playerSalary, int coachSalary):\n\
  7     Player(name, playerSalary), Coach(name, coachSalary),\n8     Employee(name)\n\
  9     {\n10    }\n11 };\n```\n\n注意，支持虚继承所需的更改并不多。在我们的案例中，我们在 `PlayerCoach.h` 文件的第\
  \ 12 行和第 29 行增加了 `virtual` 关键字，并在最后一个文件中第 8 行添加了对 `Employee` 构造函数的调用。可以使用与之前示例相同的\
  \ main 函数进行测试。\n\n### 附录 I 头文件和库函数参考\n\n本附录为书中讨论的 C++ 库函数提供了参考。下所示的 Table I-1 给出了按字母排序的函数列表。随后是按头文件组织的函数表。\n\
