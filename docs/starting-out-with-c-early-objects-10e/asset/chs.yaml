  \n\n\n\n\n\n\n\n\n# 知识点\n\n1. 在图 1-8 中，变量 `length` 存储着值 72。\n2. 数字 72 实际上存储在地址为\
  \ 23 的 RAM 中，但名称 `length` 符号性地代表了这一存储位置。\n3. 你可以将变量想象为一个存储信息的箱子。\n4. 在图 1-8 中，数字\
  \ 72 存储在名为 `length` 的箱子里。\n5. 在任何时刻，箱子里只能存储一个项目。\n6. 如果程序在这个箱子里存储另一个值，它将取代数字 72\
  \ 的位置。\n7. 在编程中，数据有两种通用类型：数字（例如 3）和字符（例如字母‘A’）。\n8. 数字用于执行数学运算，字符用于在屏幕或纸张上打印信息。\n\
  9. 数值数据可以进一步分类。例如，以下都是整数。\n10. 以下是实数，或浮点数。\n11. 当你在 C++ 程序中创建一个变量时，你必须知道程序将向其中存储什么类型的数据。\n\
  12. 请查看程序 1-1 的第 7 行。\n13. 语句中的单词 `double` 表示变量 `hours`、`rate` 和 `pay` 将用于存储双精度浮点数。\n\
  14. 这条语句被称为变量定义。\n15. 在 C++ 中，所有变量在使用之前都必须定义，因为变量定义导致了变量在内存中被创建。\n16. 程序的三个主要活动是输入、处理和输出。\n\
  17. 计算机程序通常执行三步过程：收集输入、对收集到的信息进行某些处理，然后产生输出。\n18. 输入是程序从外部世界收集的信息。\n19. 它可以通过用户通过键盘输入数据或使用鼠标发送给程序。\n\
  20. 也可以从磁盘文件或连接到计算机的硬件设备中读取。\n21. 程序 1-1 允许用户输入两项信息：工作小时和每小时薪率。\n22. 第 11 行和第 15\
  \ 行使用 `cin`（读作“see in”）对象来执行这些输入操作。\n\n\n\n\n\n在规划程序时，程序员会使用一种或多种设计工具来创建程序模型。三种常用的设计工具是层次结构图、流程图和伪代码。`hierarchy\
  \ chart`（层次结构图）是一种以图形方式描述程序结构的图表。它包含代表程序每个步骤的方框。这些方框以特定的方式连接，展示它们彼此的关系。图 1-10 展示了薪资计算程序的层次结构图。\n\
  \n## 图 1-10 层次结构图\n\n![一张树形图展示了层次结构图。](img/FG_01_010.png)图 1-10 层次结构图完整替代文本\n\n\
  层次结构图从总体任务开始，然后将其细化为更小的子任务。每个子任务随后被细化为更小的子任务集，直到每个任务都小到易于执行的程度。例如，在图 1-10 中，总体任务“计算总薪资”列在顶层框中。该任务被拆分为三个子任务。第一个子任务“从用户处获取薪资数据”进一步拆分为两个子任务。这种“分而治之”的过程被称为\
  \ `top-down design`（自顶向下设计）。\n\n`flowchart`（流程图）是一种显示程序逻辑流的图表。它是规划程序必须执行的每个操作以及这些操作发生顺序的工具。\n\
  \n### 注意\n\n关于创建流程图的信息可以在该书籍辅助网站的附录 N http://pearsonhighered.com/gaddis 上找到。\n\n\
  `Pseudocode`（伪代码）是人类语言与编程语言之间的混合体。虽然计算机无法理解伪代码，但程序员经常发现用它编写算法很有帮助。这是因为伪代码类似于自然语言，但又足够接近编程语言，以便以后可以轻松转换为程序源代码。通过先用伪代码编写算法，程序员可以专注于程序必须执行的逻辑步骤，而无需担心担心语法或如输出将如何显示等细节。\n\
  \n伪代码可以用高层级别编写，也可以用详细级别编写。许多程序员两种形式都使用。高层伪代码简单地列出程序必须执行的步骤。以下是薪资计算程序的高层伪代码。\n\n\
  ```\nGet payroll data\nCalculate gross pay\nDisplay gross pay\n```\n\n高层伪代码可以扩展为生成详细伪代码。以下是同一程序的详细伪代码。注意，它甚至为变量命名了名称并指示了要执行哪些数学运算。\n\
  \n```\nAsk the user to input the number of hours worked\nInput hours\nAsk the user\
  \ to input the hourly pay rate\nInput rate\nSet pay equal to hours times rate\n\
  Display pay\n```\n\n## 4. 检查模型是否存在逻辑错误\n\n`Logical errors`（逻辑错误），也称为 `logic errors`，会导致程序产生错误结果的错误。逻辑错误的示例包括在计算中使用错误的变量值，或以错误的顺序执行与顺序相关的的操作。一旦创建了程序模型，就应该检查是否存在逻辑错误。程序员应该追踪图表或伪代码，检查每个步骤的逻辑。如果发现错误，可以在编写实际程序源代码之前对模型进行修正。通常情况下，在编程过程中越早发现错误，就越容易修正。\n\
  \n## 5. 编写程序源代码\n\n一旦创建、检查并修正了程序模型（层次结构图、流程图或伪代码），程序员就准备好使用实际的计算机编程语言（如 C++）编写源代码了。大多数程序员直接在计算机上编写代码，将其输入文本编辑器中。然而，某些程序员倾向于先在纸上写程序，然后再输入计算机。程序输入完成后，源代码就会被保存到文件中。\n\
  \n## 6. 编译源代码\n\n接下来，保存的源代码已准备好进行编译。编译器将源代码翻译成机器语言。\n\n## 7. 修正编译期间发现的任何错误\n\n如果编译器报告任何错误，则必须修正它们并重新编译代码。重复此步骤，直到程序没有编译时错误。\n\
  \n## 8. 链接程序以创建可执行文件\n\n一旦源代码无错误地编译，它就可以与程序 `#include` 语句指定的库链接，以创建一个可执行文件。如果在链接过程中发生错误，很可能是程序未能包含所需的库文件。必须包含所需的文件并重新链接程序。\n\
  \n## 9. 使用测试数据运行程序\n\n一旦源代码无错误地编译，就可以与程序 `#include` 语句指定的库链接，以创建一个可执行文件。如果在链接过程中发生错误，很可能是程序未能包含所需的库文件。必须包含所需的文件并重新链接程序。一旦生成了可执行文件，程序就准备好测试运行时错误和逻辑错误。运行时错误发生在程序要求计算机执行不可能的操作时，例如除以零。通常，运行时错误会导致程序中止。如果程序运行但未能产生正确结果，它可能包含了逻辑错误。为了帮助识别此类错误，使用仔细选择的数据运行程序是重要的。\n\
  \n## 10. 修正运行期间发现的任何错误\n\n当出现运行时错误或逻辑错误时，必须修正它们。你必须识别错误发生的步骤并确定原因。`desk-checking`（人工跟踪）是一种可以帮助定位错误的过程。这个术语意味着程序员开始阅读程序或部分程序，并逐句执行。在这个过程中，通常使用纸记录所有变量的当前内容，并绘制每次输出后的屏幕样子。当变量内容更改或屏幕上显示信息时，会被记录。如果错误是逻辑错误的（例如数学公式表述错误），必须修正相关的语句。如果错误由于对程序要求的理解不足，则必须重述程序目的并修改受影响的图表、伪代码和源代码。然后必须保存、重新编译、重新链接并重新测试。这意味着必须重复步骤\
  \ 4 到 10，直到程序能够可靠地产生满意的结果。\n\n## 11. 验证程序结果\n\n当你认为已修正所有错误时，输入测试数据以验证程序是否解决了原始问题。\n\
  \n# 什么是软件工程？\n\n软件工程领域涵盖了构建计算机软件的全过程。它包括软件开发项目的设计、编写、测试、调试、文档编写、修改和维护。像传统工程师一样，软件工程师在他们的工作中使用许多工具。以下是几个例子：\n\
  \n*   程序规范\n*   屏幕输出图表\n*   层次结构图\n*   伪代码\n*   预期输入和期望输出的示例\n*   为测试程序设计的特殊软件\n\
  \n大多数商业应用程序都很大。在很多情况下，是由一个或多个程序员团队而不是单个个体开发的。对程序要求进行彻底分析并将其划分为由团队或团队内个人处理的子任务是非常重要的。\n\
  \n\n\n\n在编程过程的第 3 步中，你学习了层级图作为一种自顶向下设计的工具。当自顶向下设计中识别出的子任务过长或复杂时，可以将它们开发为程序的模块（或独立的组件）。如果程序非常庞大或复杂，可以分配一个软件工程师团队来处理各个模块。随着项目的进行，这些模块将被协调成一个单一的软件应用程序。\n\
