  \n程序 6-13 展示了另一个返回类型为 `bool` 的函数示例。该程序有一个名为 `isEven` 的函数，如果它的参数是偶数，则返回 `true`。否则，函数返回\
  \ `false`。\n\n注意第 18 行如何通过以下语句调用 `isEven` 函数：\n\n```cpp\n if (isEven(val))\n```\n\
  \n回想第 4 章，这是询问函数调用 `isEven(val)` 是否返回了值 `true`。当 `if` 语句执行时，以 `val` 作为参数调用 `isEven`。如果\
  \ `val` 是偶数，`isEven` 返回 `true`；否则返回 `false`。\n\n同样注意从第 31 行开始的 `isEven` 函数如何使用 `if`\
  \ 语句返回值 `true` 或值 `false`。该函数还有其他几种编写方式。让我们比较三种不同的编写方式。\n\n| 版本 1 | 版本 2 | 版本 3\
  \ |\n| :--- | :--- | :--- |\n| ```cpp\n // 程序 6–13 代码\nbool isEven(int number)\n\
  {\n   if (number % 2 == 0)\n      return true;\n   else\n      return false;\n}\n\
  ``` | ```cpp\n // 版本 2\nbool isEven(int number)\n{  bool answer;\n   if (number\
  \ % 2 == 0)\n      answer = true;\n   else\n      answer = false;\n   return answer;\n\
  }\n``` | ```cpp\n // 版本 3\nbool isEven(int number)\n{  bool answer = false;\n  \
  \ if (number % 2 == 0)\n      answer = true;\n   return answer;\n}\n``` |\n\n尽管程序\
  \ 6-13 中使用的代码简短且清晰，但它有两个不同的 `return` 语句。许多教师倾向于让返回值的函数只有一个 `return` 语句，并放置在函数的末。版本\
  \ 2 和 3 就是这样做的。你的老师会告诉你应该使用哪种方法。\n\n函数可以返回 `true` 或 `false` 值。\n\n通常需要一个函数来测试参数并返回一个\
  \ `true` 或 `false` 值，以表示是否满足某个条件。这样的函数将返回一个 `bool` 值。例如，下所示的 `isValid` 函数接受一个 `int`\
  \ 参数，如果参数在 1 到 100 范围内，则返回 `true`，否则返回 `false`。\n\n函数是菜单驱动程序的理想选择。你目前为止看到的函数非常简单。然而，因为我们可以更改作为参数传递给函数的信息，我们能够创建一个适用于所有情况的单一通用函数。\n\
  \n注意函数参数与函数形式之间的关系。这里再次显示了它们，并将参数和参数对齐以便比较。\n\n```cpp\n void showFees(string category,\
  \   double rate, int months);  // 声明\nvoid showFees(string memberType, double rate,\
  \ int months)   // 头部\n     showFees(       \"Adult\",     ADULT_RATE,     months);\
  \  // 函数调用\n     showFees(       \"Child\",     CHILD_RATE,     months);  // 函数调用\n\
  \     showFees(       \"Senior\",    SENIOR_RATE,    months);  // 函数调用\n```\n\n\
  每次调用函数都可以发送不同的参数，并且作为参数的任何变量名称不需要与参数名匹配。然而，`showFees` 函数有三个参数：首先是 `string`，然后是 `double`，最后是\
  \ `int`。因此，每次调用函数必须有三个参数，其顺序和数据类型必须与存储它们的参数相匹配。\n\n\n\n\n有时在程序中，你可能想要清除屏幕并将光标移回顶部。这在编写菜单驱动型程序时特别有用。在用户做完菜单选择并执行了执行该选择的函数后，如果在重新显示菜单之前能够先清除屏幕，那就将非常好。这可以通过在程序中插入一条命令来实现，该命令请求操作系统为你清除屏幕。以下是适用于\
  \ Unix 操作系统（如 Linux 和 Mac OS）的命令：\n\n```c\n system(\"clear\");\n```\n\n这里是适用于 Windows\
  \ 操作系统的命令。你可能注意到它出现在程序 6-14 的第 54 行，就在显示菜单之前。\n\n```cpp\n system(\"cls\");\n```\n\
  \n这会在用户选择新报告进行显示之前，先从屏幕上移除之前的报告。然而，不要在报告显示后过快地清除屏幕，否则它会在用户有机会查看之前就消失了。请看程序 6-14\
  \ 的第 95 到 98 行。这些行保留了报告屏幕，直到用户按下 [Enter] 键表示准备好返回菜单并开始新操作。\n\n# 6.10 局部变量和全局变量\n\
  \n### 概念\n局部变量定义在函数内部，在函数外部无法访问。全局变量定义在所有函数之外，作用范围内的所有函数都可以访问。\n\n## 局部变量\n定义在函数内部的变量是该函数的`局部`变量。它们对其他函数中的语句是隐藏的，这些语句通常无法访问它们。程序\
  \ 6-15 显示，由于定义在函数中的变量是被隐藏了，其他函数可能拥有同名但独立、不同的变量。\n\n尽管有两个名为 `num` 的变量，但由于它们位于不同的函数中，程序一次只能“看到”其中一个。当程序在\
  \ `main` 中执行时，`main` 中定义的 `num` 变量是可见的。然而，当调用 `anotherFunction` 时，只有定义在其内部的变量是可见的，因此\
  \ `main` 中的 `num` 变量被隐藏了。图 6-13 说明了这两个函数的闭闭性。方框代表变量的作用域。\n\n### 图 6-13 局部变量的可见性\n\
  ![一个程序显示了 2 个模块。](img/FG_06_013.png)图 6-13 完整备用文本\n\n### 注意\n函数的参数也是局部变量。它们的作用域限于函数体。\n\
  \n## 局部变量的生命周期\n局部变量仅在定义它的函数执行时存在。这被称为局部变量的`生命周期`。当函数开始时，它的参数变量及其定义的任何局部变量会在内存中创建，当函数结束时，它们会被销毁。这意味着存储在函数参数或局部变量中的任何值在函数调用之间将会丢失。\n\
  \n## 使用参数值初始化局部变量\n可以使用参数变量来初始化局部变量。有时这可以简化函数中的代码。这是我们之前看过的 `sum` 函数的修改版本。在这个版本中，函数的参数被用于初始化局部变量\
  \ `result`。\n\n```cpp\n int sum(int num1, int num2)\n{\n    int result = num1 +\
  \ num2;\n    return result;\n}\n```\n\n## 全局变量\n全局变量是程序中定义在所有函数（包括 `main`）之外的任何变量。全局变量的作用域是从变量定义处到整个程序结束的部分。这意味着在全局变量定义之后定义的所有函数都可以访问该全局变量。程序\
  \ 6-16)显示了两个函数，`main` 和 `anotherFunction`，它们访问同一个全局变量。\n\n在程序 6-16 中，`num` 定义在函数之外。因为它的定义出现在\
  \ `main` 和 `anotherFunction` 之前，这两个函数都可以访问它。\n\n在 C++ 中，除非显式初始化，否则它们会被初始化为零。\n\n\
  ### 注意\n请记住，局部变量不像全局变量那样会被自动初始化。程序员必须处理这一点。\n\n虽然全局变量可能很有用，但你应该限制对它们的使用。当学生开始学习编写多个函数的程序时，他们有时会被诱将所有变量设为全局变量，这样就可以在不传递参数的情况下访问。虽然这种方法可能会让程序更容易编写，但通常会引起问题。原因如下：\n\
  \n- 全局变量使得调试困难。程序中的任何语句都可以更改全局变量的值。如果你发现全局变量中存储了错误的值，你必须追踪每个访问它的语句，以确定错误值是从哪里来的。在具有数千行代码的程序中，这可能是困难的。\n\
  - 使用全局变量的函数通常依赖于这些变量。如果你想在另一个程序中使用此类函数，可能需要对其重新设计，使其不再依赖于全局变量。\n- 全局变量让程序难以理解。全局变量可以被程序中的任何语句修改。因此，为了理解程序中使用全局变量的任何部分，你必须意识到程序中所有访问它的部分。\n\
  \n因此，最好不要使用全局变量来存储、处理和检索数据。相反，应该局部声明变量，并作为参数传递给需要访问它们的函数。\n\n## 全局常量\n尽管你应该尽量避免使用全局变量，但在程序中使用全局常量通常是允许的。`全局常量`是程序中每个函数都可用的命名常量。由于全局常量的值在程序执行期间无法更改，所以你不需要担心与使用全局变量相关的潜在危险。\n\
  \n\n\n\n程序 6-18 展示了如何使用全局常量示例。该程序计算公司管理培训生的总薪资，包括加班费。所有培训生的每时工资都相同。除了 `main` 之外，此程序还有两个函数：`getBasePay`\
  \ 和 `getOvertimePay`。`getBasePay` 函数接受工作小时数并返回非加班小时的工资金额。`getOvertimePay` 函数接受工作小时数，如果有加班小时，则返回加班小时的工资金额。\n\
  \n让我们仔细观察这个程序。在第 7、8 和 9 行定义了三个全局常量。`PAY_RATE` 常量设置为员工的小时工资率，数值为 22.55。`BASE_HOURS`\
  \ 常量设置为 40.0，这是员工在一周内无需获得加班费即可工作的小时。`OT_MULTIPLIER` 常量设置为 1.5，这是加班小时的工资率倍数。这意味着员工的所有加班小时的小时工资率都会乘以\
  \ 1.5。\n\n由于这些常量是全局的，并且定义在程序中所有函数之前，因此所有函数都可以访问它们。例如，`getBasePay` 函数在第 53 和 54 行访问\
  \ `BASE_HOURS` 常量，并在第 54 和 56 行访问 `PAY_RATE` 常量。`getOvertimePay` 函数在第 70 行访问 `BASE_HOURS`\
  \ 常量，并在第 73 行访问三个常量。\n\n# 同名的局部与全局变量\n\n你不能在同一个函数中拥有同名的局部变量。这同样适用于参数变量。参数变量本质上是一个局部变量。因此，你不能为同一个函数中的参数变量和局部变量赋予相同的名称。\n\
  \n然而，你可以拥有与全局变量或常量同名的参数或局部变量。当你这样做时，参数或局部变量的名字会“遮蔽”（shadows）全局变量或常量的名称。这意味着全局变量或常量的名称被参数或局部变量的所隐藏。因此，在程序的这一部分，全局变量或常量无法被看到或使用。程序\
  \ 6-19 阐明了这一点。它有一个名为 `BIRDS` 的全局常量，设置为 500，并在 `california` 函数中有一个名为 `BIRDS` 的局部常量，设置为\
  \ 10000。\n\n当程序在 `main` 函数中执行时，设置为 500 的全局常量 `BIRDS` 是可见的。第 12 行的 `cout` 语句显示“In\
  \ main there are 500 birds.”。然而，当程序在 `california` 函数中执行时，局部常量 `BIRDS` 遮蔽了全局常量 `BIRDS`，因此使用的是局部常量\
  \ `BIRDS`。这就是为什么第 24 行的 `cout` 语句显示“In california there are 10000 birds.”。\n\n#\
  \ 6.11 静态局部变量\n\n如果一个函数在程序中被调用多次，存储在函数局部变量中的值在函数调用之间不会保留。这是因为局部变量在函数终止时会被销毁，并在函数再次启动时重新创建。这在\
  \ 程序 6-20 中所示。\n\n尽管第 25 行 `showLocal` 函数的最后语句在 `localNum` 中存储了 99，但该变量在函数终止时会被销毁。下一次调用该函数时，`localNum`\
  \ 会重新创建并再次初始化为 5。\n\n然而，有时程序希望在函数调用之间“记住”存储在局部变量中的值。这可以通过将变量声明为 `static` 来。静态局部变量在函数返回时不会被销毁。它们在程序的整个生命周期内存在，尽管它们的作用域仅限于定义它们的函数。程序\
  \ 6-21 使用静态局部变量来计算函数被调用的次数。\n\n## 检查点\n\n1. 静态局部变量和全局变量之间的区别是什么？\n2. 下列程序的输出是什么？\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\n\nvoid showArea() {\n    static\
  \ int var = 10;\n    cout << var << endl;\n}\n\nint main() {\n    showArea();\n\
  \    return 0;\n}\n```\n\n3. 下列程序的输出是什么？\n\n```cpp\n#include <iostream>\nusing namespace\
  \ std;\n\nvoid showVar() {\n    static int var = 50;\n    cout << var << endl;\n\
  }\n\nint main() {\n    for (int count = 0; count < 10; count++) {\n        showVar();\n\
  \    }\n    return 0;\n}\n```\n\n# 6.12 默认参数\n\n### 概念\n\n当没有提供参数时，默认参数会自动传递给参数。\n\
  \n可以为函数参数分配默认参数。当函数调用中省略实际参数时，传递默认参数。默认参数通常列在函数原型中。这是一个示例：\n\n```cpp\nvoid showArea(double\
  \ length = 20.0, double width = 10.0);\n```\n\n由于函数原型中不需要参数名称，该示例原型也可以这样声明：\n\n\
  ```cpp\nvoid showArea(double = 20.0, double = 10.0);\n```\n\n在任何情况下，默认参数（必须是字面量或常量）前面都有\
  \ `=` 运算符。\n\n注意在两个示例原型中，`showArea` 有两个 `double` 参数。第一个分配了默认参数 20.0，第二个分配了默认参数 10.0。这是函数的定义：\n\
  \n```cpp\nvoid showArea(double length, double width) {\n    double area = length\
  \ * width;\n    cout << \"The area is \" << area << endl;\n}\n```\n\n`length` 的默认参数是\
  \ 20.0，`width` 的默认参数是 10.0。因为两个参数都有默认参数，所以在函数调用中可以选择省略，如下：\n\n```cpp\nshowArea();\n\
  ```\n\n在此函数调用中，两个默认参数都将传递给参数。参数 `length` 将接收值 20.0，`width` 将接收值 10.0。函数的输出将是\n\n\
  ```\nThe area is 200\n```\n\n默认参数仅在函数调用中省略实际参数时才使用。在下面的调用中，指定了第一个参数，但省略了第二个：\n\n\
  ```cpp\nshowArea(12.0);\n```\n\n值 12.0 将传递给 `length`，而默认值 10.0 将传递给 `width`。函数的输出将是\n\
  \n```\nThe area is 120\n```\n\n\n\n\n\n当然，所有的默认参数都可以被覆盖。在下面的函数调用中，为两个参数都提供了参数值：\n\
  \n```\nshowArea(12.0, 5.5);\n```\n\n该函数调用的输出将是：\n\n```\nThe area is 66\n```\n\n\
  ### 注意\n\n函数的默认参数应该分配在函数名第一次出现的地方。这通常是函数原型处。然而，如果函数没有函数原型，则可以在函数头部中指定默认参数。`showArea`\
  \ 函数可以定义如下：\n\n```\n void showArea(double length = 20.0, double width = 10.0)\n\
  \    {\n       double area = length * width;\n       cout << \"The area is \" <<\
  \ area << endl;\n    }\n```\n\n程序 6-22 阐释了默认函数参数的使用。它包含一个在屏幕上显示星号的函数。该函数接收指定显示多少行星号以及每行打印多少个星号的参数。提供默认参数是为了显示一行包含\
  \ 10 个星号。\n\n尽管 C++ 的默认参数非常方便，但它们在用用上并不灵活。当在函数调用中省略了某个参数时，紧随其后的所有参数都必须省略。在程序 6-22\
  \ 中的 `displayStars` 函数中，无法在不省略 `numRows` 参数的情况下省略 `PerRow` 参数。例如，下面的函数调用将是非法的：\n\
  \n```\ndisplayStars(, 3); // 非法函数调用\n```\n\n然而，函数可以拥有一些带有默认参数的参数，而另一些则没有。例如，在下面的函数中，只有最后一个参数有默认参数：\n\
  \n```\n// 函数原型\nvoid calcPay(int empNum, double payRate, double hours = 40.0);\n\
  \n// 函数定义\nvoid calcPay(int empNum, double payRate, double hours)\n{\n    double\
  \ wages;\n    wages = payRate * hours;\n    cout << \"Gross pay for employee \"\
  \ << empNum << \" is \" << wages << endl;\n}\n```\n\n调用此函数时，必须始终为前两个参数（`empNum`\
  \ 和 `payRate`）指定参数，因为它们没有默认参数。以下是有效调用示例：\n\n```\ncalcPay(76, 15.75); // 使用 hours\
  \ 的默认参数\ncalcPay(142, 20.0); // 指定小时数\n```\n\n当函数混合使用带有默认参数和不带默认参数的参数时，带有默认参数的参数必须最后声明。在\
  \ `calcPay` 函数中，`hours` 不能在其他任何参数之前声明。以下原型是非法的：\n\n```\n// 非法原型\nvoid calcPay(int\
  \ empNum, double hours = 40.0, double payRate);\n\n// 非法原型\nvoid calcPay(double\
  \ hours = 40.0, int empNum, payRate);\n```\n\n以下是关于默认参数重要点的总结：\n\n- 默认参数的值必须是一个字面量值或命名常量。\n\
  - 当在函数调用中省略某个参数（因为有默认值）时，紧随其后的所有参数都必须省略。\n- 当函数混合使用带有默认参数和不带默认参数的参数时，带有默认参数的参数必须最后定义。\n\
  \n# 6.13 使用引用变量作为参数\n\n### 概念\n\n引用变量是引用另一个变量内存位置的变量。对引用变量进行的任何更改实际上都是它所引用的变量进行的。引用变量有时用作函数参数。\n\
  \n你已经学习过变量是存储数据的内存名称。当我们使用变量时，我们正在访问存储在分配给它的内存位置中的数据。引用变量是另一个变量的别名。它没有自己存储数据的内存位置，而是访问另一个变量的内存位置。对引用变量数据的任何更改实际上都是对存储在另一个变量内存位置中的数据进行的。当我们使用引用变量作为参数时，它就变成了参数列表中对应变量的别名。对参数的任何更改实际上都是对调用函数中的变量进行的。当数据以这种方式传递给参数时，该参数被称为`按引用传递`（passed\
  \ by reference）。\n\n引用变量的定义与普通变量类似，只是数据类型和名称之间有一个地址符（`&`）。例如，下面的函数定义使参数 `refVar`\
  \ 成为引用变量：\n\n```\nvoid doubleNum(int &refVar)\n{\n  refVar *= 2;\n}\n```\n\n你可以将空格放在\
  \ `&` 之前或之后。`doubleNum` 函数头也可以写成这样：\n\n```\nvoid doubleNum(int& refVar)\n```\n\n\
  ### 注意\n\n变量 `refVar` 被称为“一个对 `int` 的引用”。\n\n`doubleNum` 函数通过将其乘以 2 来双倍存储在 `refVar`\
  \ 中的值。由于 `refVar` 是引用变量，此操作实际上是在作为参数传递的变量上执行的。带有引用参数的函数原型也必须有一个地址符。与函数头一样，它位于数据类型和变量名之间。如果原型中省略了变量名，地址符直接跟在数据类型后面。以下所有\
  \ `doubleNum` 的原型都是正确的：\n\n```\nvoid doubleNum(int &refVar);\nvoid doubleNum(int&\
  \ refVar);\nvoid doubleNum(int &);\n```\n\n你的老师会告诉你使用哪种形式。\n\n### 注意\n\n地址符必须出现在任何使用引用变量作为参数的函数原型和头中。它不会在函数调用中出现。\n\
  \n程序 6-23 展示了作为引用变量的参数的使用。\n\n程序 6-23 中的参数 `refVar` “指向” `main` 函数中的 `value` 变量。当程序处理引用变量时，它实际上是在处理它所引用或指向的变量。这在图\
  \ 6-14 中得到了阐释。\n\n# 图 6-14 引用变量\n\n![图像显示了一个标记为“原始参数”的矩形。矩形内部显示数字 4。针对“4”的注释写着“引用变量”。](img/FG_06_014.png)\n\
  \n将引用变量作为函数参数在函数目的是接受输入值并将其存储在调用函数的变量中时特别有用。引用参数的另一个用处是必须从函数返回多个值时。如果函数是计算并返回单个值，通常认为使用返回值的函数并使用\
  \ `return` 语句返回值更为合适。\n\n\n\n\n\n程序 6-24 是 程序 6-23 的修改版本。它添加了一个函数 `getNum()`，该函数接收用户的输入并将其存储在\
  \ `userNum` 中。然而，参数 `userNum` 是 `main` 函数中变量 `value` 的引用，因此输入数据实际上存储在该处。程序 6-24\
  \ 还将将函数 `doubleNum()` 重写为一个有返回值的函数。注意第 19 行，`main` 现在必须在 `doubleNum()` 返回值时存储该值。\n\
  \n### 注意\n\n只有变量可以按引用传递。如果你尝试将非变量参数（如字面量、常量或表达式）传递给引用参数，会导致错误。\n\n如果一个函数有多个参数是引用变量，那么在函数声明和函数头中，你必须对对每一个参数都使用取地址符\
  \ `&`。以下是一个使用四个引用变量参数的函数声明：\n\n```\n void addThree(int& num1, int& num2, int& num3,\
  \ int& sum);\n```\n\n这里是该函数的定义：\n\n```\n void addThree(int& num1, int& num2, int&\
  \ num3, int& sum)\n{\n    cout << \"Enter three integer values: \";\n    cin  >>\
  \ num1 >> num2 >> num3;\n    sum = num1 + num2 + num3;\n}\n```\n\n然而，`addThree()`\
  \ 函数实际上只需要一个引用参数 `sum`。其他三个参数可以按值接收其参数，因为该函数并没有修改它们。\n\n### 警告！\n\n仅在绝对需要的地方才使用引用变量。每当你允许函数修改函数外部的变量时，你都在创造潜在的调试问题。\n\
  \n# 何时按引用传递参数，何时按值传递参数\n\n新程序员经常在确定何时应该按引用传递参数给函数、何时应该按值传递时遇到困难。由于如果一个值必须“返回”给调用函数，有两种方法实现：使用引用参数或使用\
  \ `return` 语句，这使得问题变得更加复杂。以下是一些通用指南。\n\n*   当参数是常量时，它必须按值传递。只有变量可以按引用传递。\n*   当作为参数传递的变量不应改变其值时，应该按值传递。这可以保护它不被修改。\n\
  *   当恰好有一个值需要从函数“返回”到调用程序时，通常应该使用 `return` 语句而不是通过引用参数返回。\n*   当作为参数传递给函数的两个或多个变量需要被该函数修改值时，它们应该按引用传递。\n\
  *   当无法合理或正确创建参数的副本时（例如参数是一个文件流对象时），必须按引用传递。\n\n以下是使用引用参数的三常见情况。\n\n*   当函数中输入的数据值需要被调用函数知道时\n\
  *   当函数必须修改调用函数中的现有值时\n*   当将文件流对象传递给函数时\n\n程序 6-25 展示了这些用法中的前两种。`getNums()` 函数使用引用变量作为参数，以便它可以将输入的值存储到\
  \ `main` 函数的 `small` 和 `big` 变量中。`orderNums()` 函数使用引用变量作为参数，以便当它交换传递给它的两个项目时，值实际上会在\
  \ `main` 函数中被交换。\n\n# 将文件传递给函数\n\n如前所述，当文件流对象传递给函数时，应该始终使用引用参数。程序 6-26 展示了如何将文件传递给函数。程序使用的\
  \ `weather.dat` 文件包含以下七个值：72  83  71  69  75  77  70。它可以在第 6 章 中找到。`weather.dat`\
  \ 文件在 `read()` 函数被调用时，以便 `main` 函数能够看到并使用这些数据。\n\n还可以将一个打开的文件传递给函数，并让其读取文件。程序 6-27\
  \ 提供了一个示例。\n\n## 检查点\n\n1. 6.19 哪些类型的值可以默认参数？\n2. 6.20 为函数 `compute()` 编写声明和头，它有三个参数：`int`、`double`\
  \ 的引用以及 `long`（顺序不限）。`int` 参数应该有一个默认值 5，而 `long` 参数不应该有默认值。\n3. 6.21 下列程序的输出是什么？\n\
