  ```\n\n一旦 `nodePtr` 指向最后一个节点，我们就可以在使用代码在之后添加新节点：\n\n```\n nodePtr−>next = new ListNode(number);\n\
  ```\n\n将所有这些整合在一起，我们得到了 `NumberList.cpp` 第 7–23 行所示的 `add` 函数。\n\n# 显示列表\n\n第 29–39\
