  \n### 概念\n\n私有成员函数只能从同一类的成员函数中调用。\n\n到目前，你看到的所有类成员函数都是公共函数。这意味着它们可以被类外部程序的代码调用。然而，类通常需要一些不应被类外部代码调用的内部处理函数。这些函数应该设为私有。\n\
  \n### 注意\n\n关于如何在 UML 中表示私有和公共成员的信息，可以在书籍辅助网站 [pearsonhighered.com/<wbr>gaddis](http://pearsonhighered.com/gaddis)上的附录\
  \ F 中找到。\n\n程序 7-7 展示了一个包含构造函数和析构函数的简单类。它说明了它们在程序执行过程中何时被调用。\n\n除了析构函数在对象被销毁时会自动调用这一点外，还应该提到以下几点：\n\
  \n* 像构造函数一样，析构函数没有返回值。\n* 析构函数不能接受参数，因此它们永远没有参数列表。\n* 因为析构函数不能接受参数，所以只能有一个析构函数。\n\
  \n析构函数在处理动态分配的对象时最有用。你将在第 10 章中学习这些内容。\n\n\n\n\n在程序 7-9 `部分` 中，`InventoryItem` 对象被按值传递给\
  \ `showValues` 函数。然而，按值传递对象需要对对象的所有成员进行复制。这会减慢程序的执行时间，特别是当对象有许多成员时。按引用传递对象速度更快，因为函数可以访问原始对象，因此不需要创建任何副本。由于这个原因，通常我们更倾向于按引用传递对象。\n\
  \n然而，按引用传递对象也有缺点。由于函数可以访问原始对象，它可以调用该对象的修改器函数（mutator functions）并更改其成员数据。这就是为什么当我们想要保护变量的内容时，通常不按引用传递变量。幸运的是，有一个解决方案。为了在对象作为参数传递时对其进行保护，而无需创建副本，可以将其作为`常量引用`（constant\
  \ reference）传递。这意味着传递给函数的是原始对象的引用，但它无法调用任何修改器函数或更改对象的任何成员数据。它只能调用那些本身被指定为`常量函数`（constant\
  \ functions）的访问函数。\n\n要声明一个参数为常量引用参数，我们必须在函数原型和函数头部的参数列表中放入关键字 `const`。以下是如果程序 7-9\
  \ 中 `showValues` 函数的函数原型和头部更改为使用常量引用参数时，它们看起来将是这样：\n\n```\nvoid showValues (const\
  \ InventoryItem&)        // 函数原型\nvoid showValues (const InventoryItem &item)  \
  \ // 函数头部\n```\n\n现在，`showValues` 函数只能调用那些在其函数原型和头部中也列出了 `const` 关键字的 `InventoryItem`\
  \ 函数，例如：\n\n```\ndouble getPrice() const \n```\n\n如果 `showValues` 尝试调用任何其他 `InventoryItem`\
  \ 函数，就会发生编译错误。注意，当将 `showValues` 修改为具有常量引用参数时，只有函数原型和头部更改以包含 `const` 单词。`showValues`\
  \ 函数的体以及对 `showValues` 的调用并没有改变。\n\n# 从函数返回对象\n\n就像函数可以写成返回 `int`、`double` 或其他数据类型一样，它们也可以被设计为返回对象。事实上，当你以前从函数返回一个字符串时就已经做过这件事，因为字符串是一个对象。当函数返回一个对象时，它通常会创建一个类的局部实例，设置其数据成员，然后将其返回。这里有一个示例展示了程序\
