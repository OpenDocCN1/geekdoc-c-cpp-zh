  \ la 名称。\n\n# 5. 猴子生意 (Monkey Business)\n\n当地一家动物园想要跟踪在一个典型周内，三只猴子每天各吃多少磅的食物。编写一个程序，将这些信息存储在一个\
  \ `3×7` 的二维数组中，每行代表一只不同的猴子，每列代表周的不同一天。程序首先应让用户输入每只猴子的数据。然后，它应该创建一个包含以下信息的报告：\n\n\
  * 整个猴子家族每天平均进食量\n* 任何一只猴子在一周内吃得最少的量\n* 任何一只猴子在一周内吃得最多的量\n\n# 6. 无论晴雨 (Rain or Shine)\n\
  \n一名业余气象学家学家想要跟踪去年夏季三个月的天气状况，并将每天标记为下雨（‘R’）、多云（‘C’）或晴天（‘S’）。编写一个模块化程序，将这些信息存储在一个\
  \ `3×30` 的字符数组中，其中行表示月份（`0 = 六月`，`1 = 七月`，`2 = 八月`），列表示该月的第几号。注意，没有收集任何月份 31 号的数据。程序应首先调用一个函数从文件中读取天气数据。然后，它应该创建一个报告，显示每个月份以及整个三个月期间，雨天、多云天和晴天各有多少天。为了实现这一点，它应该使用一个返回值的函数，向该函数传递数组、要检查的月份以及要查找的字符（‘R’、‘C’或‘S’）。该函数应返回指定月份出现请求天气的天数。程序的数据可以在该书籍配套网站第\
  \ 8 章程序文件夹中的 `rain_or_shine.dat` 文件中找到。\n\n# 7. 彩票 (Lottery)\n\n编写一个模拟彩票的程序。程序应该有一个名为\
  \ `winningDigits` 的五元素整数数组，数组中的每个元素都是一个 0 到 9 之间的随机数。程序应要求用户输入五位数字，并将它们存储在第二个名为\
  \ `player` 的整数数组中。程序必须比较两个数组中对应的元素，并统计匹配的数字个数。例如，下面显示了存储了示例数字的 `winningDigits` 数组和\
  \ `player` 数组。有两个匹配数字，即元素 2 和 4。\n\n| WinningDigits | 7 | 4 | 9 | 1 | 3 |\n|---|---|---|---|---|---|\n\
  | player | 4 | 2 | 9 | 7 | 3 |\n\n一旦用户输入了一组数字，程序应显示中奖数字和玩家数字，并告知匹配了多少数字。\n\n# 8.\
  \ 降雨量统计 (Rainfall Statistics)\n\n编写一个模块化程序分析一年的降雨数据。除了 `main` 之外，程序应该有一个 `getData`\
  \ 函数，它接受用户输入的 12 个月的每月总降雨量，并将其存储在一个持有 `double` 数字的数组中。它还应该有四个返回值的函数，计算并向 `main`\
  \ 返回 `totalRainfall`、`averageRainfall`、`driestMonth` 和 `wettestMonth`。最后两个函数返回降雨量最低和最高月份的数字，而不是那些月份的雨量。注意，这个月份数字可以获取对应月份的雨量。这些信息应该被\
  \ `main` 或由 `main` 调用的 `displayReport` 函数使用，打印如下类似的摘要降雨报告：\n\n```\n2019 年 Springdale\
  \ 县降雨报告\n\n总降雨量: 23.19 英寸\n每月平均降雨量: 1.93 英寸\n雨最少的是一月，为 0 英寸。\n雨最多的是四月，为 4 英寸。\n\
  ```\n\n# 9. 洛书魔方 (Lo Shu Magic Square)\n\n洛书魔方是一个三行三列的网格，具有以下属性：\n\n* 网格恰好包含 1 到\
  \ 9 的数字。\n* 每行、每列和每条对角线的和都等于同一个数字。\n\n编写一个使用二维 `3×3` 数组模拟魔方的程序。它应该有一个布尔函数 `isMagicSquare`，该函数接受数组作为参数，如果它判定为魔方则返回\
  \ `true`，否则返回 `false`。用两个数组测试该程序：一个是如图 8-18 所示的魔方，另一个不是魔方。\n\n\n\n\n\n# Stats 类\n\
  \n创建一个 `Stats` 类，其成员数据包含一个能够存储 30 个 `double` 类型的数组，其成员函数包括 `total`、`average`、`lowest`\
  \ 和 `highest` 函数，用于向客户端程序返回数据信息。这些是你在“编程挑战 8”中创建的相同函数的通用版本，但现在它们属于 `Stats` 类，而不是应用程序。除了这些函数外，`Stats`\
  \ 类还应该有一个布尔型（Boolean）函数 `storeValue`，该函数接受来自客户端程序的 `double` 值并将其存储在数组中。该函数的任务是跟踪数组中当前有多少个值，这样它就\
  \ own 该将接收到的下一个值放在什么位置，并在执行其他函数时知道需要处理多少个值。该函数的任务还包括确保接受的数值不超过 30 个。如果 `storeValue`\
  \ 函数能够成功存储发送给它的值，它应该向客户端程序返回 `true`。然而，如果客户端程序尝试存储第 31 个值，该函数不应存储该值，并向客户端程序返回 `false`。\n\
  \n客户端程序应该创建并使用 `Stats` 对象来执行与“编程挑战 8”请求相同的降雨分析。注意，`Stats` 对象不进行任何 I/O。所有的输入和输出都由客户端程序完成。\n\
  \n# 13. Stats 类与统计数据\n\n编写一个客户端程序，使用你为“编程挑战 12”创建的 `Stats` 类来存储和分析径队中 15 名运动员每个人的“最佳”100\
  \ 码冲刺时间。所有的 I/O 都应由客户端程序完成。除了 `main` 之外，它应该还有两个函数：一个 `getData` 函数用于接收用户输入并发送给 `Stats`\
  \ 对象，另一个 `createReport` 函数用于创建并显示类似于所示的报告：\n\n```\nTulsa Tigers Track Team\n\nAverage\
  \ 100 yard-dash time: 11.16 seconds\nSlowest runner: Jack        13.09 seconds\n\
  Fastest runner: Will        10.82 seconds\n```\n\n# 14. 字符转换器类\n\n创建一个 `CharConverter`\
  \ 类，对字符串执行各种操作。它最初应该具有以下两个公共成员函数。你的老师可能会要求你向类中添加更多函数。\n\n*   `uppercase` 成员函数接受一个字符串并返回其副本，并将所有小写字母转换为大写字母。如果字符已经是大写字母或不是字母，则保持不变。\n\
  *   `properWords` 成员函数接受一个由空格分隔的单词字符串，并返回其副本，将每个单词的首字母转换为大写字母。\n\n编写一个使用该类的简单程序。它应该提示用户输入一个字符串。然后，它应该调用\
  \ `properWords` 函数并显示结果字符串。最后，它应该调用 `uppercase` 函数并显示此结果字符串。程序应该循环运行，允许对额外的字符串进行转换和显示，直到用户选择退出。\n\
  \n# 15. 驾照考试\n\n州交通管理局（DMV）要求你编写一个程序，为驾驶证考试的笔试部分评分，该考试有 20 道多选题。以下是正确答案：\n\n$$\\\
  boxed{\\begin{array}{rrrrr} {1.\\text{B}} & {5.\\text{C}} & {9.\\text{C}} & {13.\\\
  text{D}} & {17.\\text{C}} \\\\ {2.\\text{D}} & {6.\\text{A}} & {10.\\text{D}} &\
  \ {14.\\text{A}} & {18.\\text{B}} \\\\ {3.\\text{A}} & {7.\\text{B}} & {11.\\text{B}}\
  \ & {15.\\text{D}} & {19.\\text{D}} \\\\ {4.\\text{A}} & {8.\\text{A}} & {12.\\\
  text{C}} & {16.\\text{C}} & {20.\\text{A}} \\end{array}}$$\n\n为了完成这一点，你应该创建一个 `TestGrader`\
  \ 类。该类将有一个包含 20 个字符的 `answers` 数组，用于存储正确测试答案。它有两个公共成员函数允许用户程序与类进行交互：`setKey` 和 `grade`。`setKey`\
  \ 函数接收一个包含正确答案的 20 个字符字符串，并将这些信息复制到 `answers` 数组中。`grade` 函数接收一个包含考生答案的 20 个字符数组，并将它们的每个答案与正确答案进行比较。申请人必须正确回答\
  \ 15 个或更多问题才能通过考试。在“评分”考试后，`grade` 函数应该创建并向用户返回一个包含以下信息的字符串：\n\n*   指示申请人是否通过或未通过考试的消息\n\
  *   正确答案的数量和错误答案的数量\n*   所有错误题的题列表\n\n创建并使用 `TestGrader` 对象的客户端程序应该首先调用一次 `setKey`，传递一个包含\
  \ 20 个正确答案的字符串。一旦完成此，它应该允许输入考生的 20 个答案，确保只接受 A–D 的答案，并将它们存储在一个 20 个字符的数组中。然后，它应该调用\
  \ `grade` 函数对考试进行评分，并显示函数返回的字符串。程序应该循环以允许输入额外的测试。\n\n# 16. Payroll 对象数组\n\n设计一个\
  \ `PayRoll` 类，其成员变量为员工的薪率和时长。编写一个带有七个 `PayRoll` 对象的程序。程序应该从文件中读取每个人的工时和薪率，并调用类函数存储这些信息。然后它应该每个对象调用一次类函数返回工资，以便显示这些信息。测试此程序的示例数据可以在\
  \ `payroll.dat` 文件找到。\n\n# 17. 自动售卖机模拟\n\n创建一个类来模拟和管理自动售卖机。每种饮料类型的信息应该存储在一个结构中，该结构具有持有饮料名称、价格和机器数量的数据成员。\n\
  \n该类应该有一个五个这样的结构数组，并初始化如下数据：\n\n| 饮料名称 | 价格 | 数量 |\n| --- | --- | --- |\n| Cola\
  \ | 1.00 | 20 |\n| Root beer | 1.00 | 20 |\n| Orange soda | 1.00 | 20 |\n| Grape\
  \ soda | 1.00 | 20 |\n| Bottled water | 1.50 | 20 |\n\n该类应该有两个公共成员函数：`displayChoices`（显示饮料名称和价格）和\
  \ `buyDrink`（处理销售）。该类还应该有两个私有成员函数：`inputMoney`（由 `buyDrink` 调用以接受、验证并返回（给 `buyDrink`）输入的金额）以及\
  \ `dailyReport`（由析构函数调用以报告一天结束时机器中剩余的每种饮料以及收集了多少钱）。你可能希望使用额外的函数使程序更具模块化。\n\n使用该类的客户端程序应该有一个主处理循环，调用\
  \ `displayChoices` 类成员函数并允许顾客选择饮料或退出程序。如果顾客选择了饮料，则调用 `buyDrink` 类成员函数来处理实际销售。该函数应该传递顾客的饮料选择作为参数。以下是\
  \ `buyDrink` 函数应该执行的操作：\n\n*   调用 `inputMoney` 函数并传递顾客的饮料选择。\n*   如果顾客不再希望购买，则返回所有输入的金额。\n\
  *   如果机器缺少请求的饮料，则显示适当“售罄”消息并返回所有输入的金额。\n\n\n\n\n\n- 如果机器内有饮料且输入的金额足够，则通过更新库存数量和已收金额信息来完成销售，计算需要退给顾客的找零，并交付饮料。最后这一操作可以通过打印合适的“这是您的饮料”消息来模拟。\n\
  \n# 18. 箱管理器类 (Bin Manager Class)\n\n设计并编写一个面向对象的程序用于管理仓库中的库存箱。为了完成任务，你将使用两个类：`InvBin`\
  \ 和 `BinManager`。`InvBin` 类存储关于单个箱的信息。`BinManager` 类将拥有并管理一个 `InvBin` 对象的数组。以下是\
  \ `InvBin` 和 `BinManager` 类声明的结构示例：\n\n```cpp\n class InvBin \n{\n    private:\n\
  \       string description;                     // 项目名称\n       int qty;       \
  \                         // 此箱内物品\n                               // 数量\n    public:\n\
  \      InvBin (string d = \"empty\", int q = 0)   // 两个参数构造函数\n        {    description\
  \ = d;  qty = q; }      // 带有默认值\n\n       // 它还将具有以下公共成员函数。这些函数\n       // 将由 BinManager\
  \ 类使用，而不是客户端程序。\n       void setDescription(string d)\n       string getDescription()\n\
  \       void setQty(int q)\n       int getQty( )\n};\nclass BinManager \n{\n   \
  \ private:\n       InvBin bin[30];                           // InvBin 对象数组\n  \
  \     int numBins;                              // 当前正在使用的\n                   \
  \                              // 箱数量\n    public:\n       BinManager()        \
  \                      // 默认构造函数\n       {   numBins = 0; }     \n       BinManager(int\
  \ size, string d[], int q[]) // 三个参数构造函数\n       {   // 接收使用的箱数量以及物品名称和\n      \
  \     // 数量的并行数组。使用这些信息将值存储在\n           // 箱数组的元素中。记住，这些元素是 InvBin 对象。\n      \
  \ }\n       // 类还将具有以下公共成员函数：\n       string getDescription(int index)         \
  \ // 返回一个物品的名称\n       int getQuantity(int index)                // 返回一个物品的数量\n\
  \       bool addParts(int binIndex, int q)        // 如果操作完成则返回 true，\n         \
  \                                         如果无法执行则返回 false—\n       bool removeParts(int\
  \ binIndex, int q)     // 参见验证信息\n};\n```\n\n# 客户端程序 (Client Program)\n\n一旦你创建了这两个类，请编写一个菜单驱动的客户端程序，使用\
  \ `BinManager` 对象来管理其仓库箱。它应该初始化为使用九个箱，并持有以下物品描述和数量。存储物品的箱索引也在此处显示：\n\n1. 常规钳子 25\n\
  2. 尖嘴钳 5\n3. 螺丝刀 25\n4. 圆头螺丝刀 6\n5. 大扳手 7\n6. 小扳手 18\n7. 电钻 51\n8. 无线电钻 16\n9. 手锯\
  \ 12\n\n该模块化客户端程序应该具有以下函数：用于显示菜单、获取并验证用户的选择，以及执行处理该选择所需的必要活动。这包括向箱中添加物品、从箱中移除物品以及显示所有箱的报告。思考\
  \ `displayReport` 客户端函数需要对 `BinManager` 对象进行哪些调用来创建此报告。当用户从菜单选择“退出”选项时，程序应最后调用一次其\
  \ `displayReport` 函数以显示最终箱信息。所有的 I/O 应在客户端类中完成。`BinManager` 类仅接受信息，保持 `InvBin` 对象数组更新，并向客户端程序返回信息。\n\
  \n- **输入验证**：`BinManager` 类函数不应接受从箱中添加或移除的部件数量小于 1。它们也不应允许用户从箱中移除超过其当前持有数量的物品。\n\
  \n#小组项目 (Group Projects)\n\n# 19. 井棋游戏 (Tic-Tac-Toe Game)\n\n编写一个模块化程序，允许两个玩家玩井棋。使用一个三行三列的二维\
  \ `char` 数组作为游戏板。数组的每个元素都应初始化为星号 (*)。程序应显示初始棋盘配置，然后开始执行以下操作的循环：\n\n- 让玩家 1 通过输入行和列号选择\
  \ `X` 的位置。然后重新显示棋盘，用 `X` 替换所选位置的 `*`。\n- 如果还没有胜者且棋盘未满，让玩家 2 通过输入行和列号选择 `O` 的位置。然后重新显示棋盘，用\
  \ `O` 替换所选位置的 `*`。\n\n循环应持续到某个玩家获胜或发生平局，然后显示消息指示谁胜了，或报告发生了平局。\n\n- 当游戏棋盘上的一行、一列或对角线上有三个\
  \ `X` 时，玩家 1 获胜。\n- 当游戏棋盘上的一行、一列或对角线上有三个 `O` 时，玩家 2 获胜。\n- 当棋盘上所有位置都满但没有胜者时，发生平局。\n\
  - **输入验证**：仅允许输入合法的移动。行和列必须是 1、2 或 3。所选的棋盘位置必须是空的（即仍有星号）。\n\n# 20. 剧院门票销售 (Theater\
  \ Ticket Sales)\n\n创建一个 `TicketManager` 类和一个使用它售卖单场演出门票的程序。该项目旨在由二到四名学生设计和编写。以下是一些建议：\n\
  \n- 一名学生设计并编写使用该类的客户端程序，而团队成员设计并编写 `TicketManager` 类。\n- 每个学生分配的工作量应当相等。\n- 类设计以及每个函数的参数和返回类型应预先确定。\n\
  - 项目可以实现为多文件程序，或者可以将所有函数复制到单个文件中。\n\n以下是规范：\n\n- 剧院观众席有 15 行，每行 30 个座位。为了表示座位，`TicketManager`\
  \ 类应该有一个 `SeatStructures` 的二维数组。这些结构中的每一个都应具有数据成员，用于跟踪座椅的价格以及是否可用。\n- 程序数据应从程序文件夹中的两个文件中读取。第一个文件\
  \ `seatPrices.dat` 包含 15 个值，代表每行的价格。同一行的所有座位价格相同，但行与价格不同。第二个文件 `seatAvailability.dat`\
  \ 持有可用性信息。它包含 450 个字符（15 行，每行 30 个字符），指示哪些座位已售出 (*) 哪些可用 (#)。起初所有座位都是可用的。但一旦程序运行并更新文件，某些座位将售出。读取这些文件的明显函数是\
  \ `TicketManager` 对象首次创建时运行的构造函数。\n\n- 客户端程序应该是一个菜单驱动程序，为用户提供售票处选项的菜单，接受并验证用户输入，并调用相应的类函数来执行所需任务。菜单应具有显示座位图、请求门票、打印销售报告和退出程序的选项。\n\
  \n\n\n\n\n*   当用户选择 `display seats` 菜单选项时，应调用 `TicketManager` 函数，该函数将创建并返回一个包含图表的字符串，类似于所示。它应该指示哪些座位已经售出（`*`），哪些座位仍然可以购买（`#`）。然后客户端程序应显示该字符串。\n\
  \    ![图表显示了跨行的星号和井号。](img/Page_611.png)8.4-5 Full Alternative Text\n\n*   当用户选择\
  \ `request tickets` 菜单选项时，程序应提示顾客所需的座位数、期望的行号以及期望的起始座位号。然后应调用 `TicketManager` 票务请求函数并传递这些信息，以便其处理票务请求。如果任何请求的座位不存在或不可用，应返回一个适当的消息由客户端程序显示。如果座位存在且可用，则应创建并返回一个字符串，列出请求的座位数、请求行中每个座位的价格以及这些座位的总价。然后，用户程序应询问顾客是否希望购买这些座位。\n\
  \n*   如果顾客表示他们确实想购买请求的座位，应调用 `TicketManager` 购票模块来处理实际销售。该模块必须能够接受资金，确保资金足够继续销售；如果足够，则将座位标记为已售出，并创建并返回一个包含每个售出座位票据的字符串（带有正确的行号、座位号和价格）。\n\
  \n*   当用户选择 `sales report` 菜单选项时，应调用 `TicketManager` 报告模块。该模块必须创建并返回一个包含报告的字符串，告知已售出多少座位、剩余多少座位，以及为止为止售出座位收了多少钱。考虑你的团队将如何计算或收集并存储这些信息，以便在需要报告时可以使用。\n\
  \n*   当售票日结束且选择了 `quit` 菜单选项时，程序需要将更新后的座位可用性数据写回文件。执行此操作的最明显的地方是在 `TicketManager`\
  \ 的析构函数中。\n\n# 第 9 章搜索、排序与算法分析\n\n## 9.1 搜索算法简介\n\n### 概念\n\n搜索算法是在数据集合中定位特定项目的方法。\n\
  \n程序不仅存储和处理存储在数组中的数据，在数组中搜索特定项目也是非常常见的。本节将向你展示两种搜索数组的方法：线性搜索和二分搜索。每种都有其优缺点。\n\n\
  ## 线性搜索\n\n`linear search`（线性搜索）是一种非常简单的算法也称为 `sequential search algorithm`（顺序搜索算法），它使用循环从第一个元素开始顺序遍历数组。它将每个元素与要搜索的值进行比较，并在找到值或遇到数组末尾时停止。如果搜索的值不在数组中，算法将搜索到数组末尾。\n\
  \n以下是执行线性搜索的函数伪代码：\n\n```\n Set found to false\nSet position to −1\nSet index to\
  \ 0\nWhile index < number of elements and found is false\n   If array[index] is\
  \ equal to search value\n      found = true\n      position = index\n   End If\n\
  \   Add 1 to index\nEnd While\nReturn position\n```\n\n接下来的函数 `linearSearch` 是用于在整数数组上执行线性搜索的\
  \ C++ 代码示例。该数组有 `size` 个元素，用于搜索存储在 `value` 中的数字是否出现。如果找到了该数字，则返回其数组下标。否则，返回 −1，表示该值不在数组中。\n\
  \n```\n int linearSearch(const int array[], int size, int value)\n{\n   int index\
  \ = 0;        // 用作下标搜索数组\n   int position = −1;    // 用于记录搜索值的位置\n   bool found\
  \ = false;   // 用于指示是否找到该值的标记\n                         //      初始化为 false，因为\n\
  \                         //      值尚未被找到\n   while (index < size && !found)\n  \
  \ {\n      if (array[index] == value)     // 如果找到了值\n      {\n          found =\
  \ true;              // 设置标记\n          position = index;          // 记录值的下标\n \
  \     }\n      index++;                       // 移动到下一个元素\n   }\n   return position;//\
  \ 返回位置，或 −1\n} \n```\n\n### 注意释\n\n选择 −1 来表示在数组中未找到搜索值的原因是 −1 不是有效的下标。任何其他非有效的下标值也可以用来发出此信号。\n\
  \n程序 9-1 是一个使用 `linearSearch` 函数的完整程序。它搜索包含五个元素的 `tests` 数组以找到分数为 100。\n\n## 线性搜索的低效性\n\
  \n线性搜索的优点是简单。它非常容易理解和实现。此外，它不要求数组中的数据按照任何特定顺序。然而，它的缺点是效率低下。如果被搜索的数组包含 20,000 个元素，线性搜索必须查看所有\
  \ 20,000 个元素才能确定值不在数组中。\n\n在通常情况下，在数组开头找到项目的概率与在末尾相同。平均而言，对于具有 N 个元素的数组，线性搜索会在 N/2\
  \ 次尝试后找到项目。如果数组有 20,000 个元素，平均需要 10,000 次比较。当然，这假设搜索项目始终位于数组中。（N/2 是平均比较次数。最大比较次数始终是\
  \ N。）\n\n当线性搜索无法定位项目时，它必须与数组中的每个元素进行比较。随着搜索尝试次数的增加，平均比较次数也随之增加。当速度很重要时，在大数组上不应使用线性搜索。\n\
  \n## 二分搜索\n\n`binary search`（二分搜索）是一种巧妙算法，比线性搜索高效得多。它的唯一要求是数组中的值按升序或降序存储。如果数组值按`升序`存储，意味着它们是从低到高排列的。如果按降序存储，它们是从高到低排列的。二分搜索不是测试数组的第一个元素，而是从中间元素开始。如果该元素恰好包含所需的值，则搜索结束。否则，中间元素的值要么大于要么小于要搜索的值。如果它大于所需值，那么该值（如果它在列表中）将在数组的前半部分找到。如果它小于所需值，那么该值（再次，如果在列表中）将在数组的后半部分找到。在任何情况下，一半的数组元素都被排除在进一步搜索之外。\n\
  \n\n\n\n\n以下是一个对元素升序存储的数组进行二分查找函数的伪代码。\n\n```\n Set first to 0\nSet last to the\
  \ last subscript in the array\nSet position to −1\nSet found to false\nWhile found\
  \ is not true and first is less than or equal to last\n   Set middle to the subscript\
  \ halfway between first and last\n   If array[middle] equals the desired value\n\
  \      Set found to true\n      Set position to middle\n   Else If array[middle]\
  \ is greater than the desired value\n       Set last to middle − 1\n   Else\n  \
  \     Set first to middle + 1\n   End If\nEnd While\nReturn position\n```\n\n该算法使用了三个索引变量：`first`、`last`\
  \ 和 `middle`。`first` 和 `last` 变量标记了当前搜索数组部分的边界。它们被初始化为数组第一个和最后一个元素的下标。计算出 `first`\
  \ 和 `last` 之间中间位置元素的下标并将其存储在 `middle` 变量中。如果没有精确的中心元素，用于计算 `middle` 的整数除法将选择中点之前的上一个元素。如果数组中间的元素不包含搜索值，则会调整\
  \ `first` 或 `last` 变量，以便在下一次迭代中只搜索数组的上半或下半部分。每当循环未能定位搜索值时，搜索数组的部分就会减半。\n\n以下示例 C++\
  \ 代码中的函数 `binarySearch` 用于对整数数组进行二分查找。第一个参数 `array` 具有 `size` 个元素，用于查找是否存在存储在 `value`\
  \ 中的数字。如果找到了该数字，则返回其数组下标；否则返回 -1，表示该值不在数组中。\n\n```cpp\n int binarySearch(const int\
  \ array[], int size, int value)\n{\n   int  first = 0,          // First array element\n\
  \        last = size − 1,    // Last array element\n        middle,            \
  \ // Midpoint of search\n        position = −1;      // Position of search value\n\
  \   bool found = false;      // Flag to indicate if the value was found\n   while\
  \ (!found && first <= last)\n   {\n     middle = (first + last) / 2;      // Calculate\
  \ midpoint\n     if (array[middle] == value)       // If value is found there\n\
  \     {\n        found = true;\n        position = middle;\n     }\n     else if\
  \ (array[middle] > value)   // If value is in lower half\n        last = middle\
  \ − 1;\n     else\n        first = middle + 1;           // If value is in upper\
  \ half\n   }\n   return position;\n}\n```\n\n`Program 9-2` 是一个使用 `binarySearch`\
  \ 函数的完整程序。它在员工 ID 数组中搜索特定值。\n\n### 警告！\n\n注意 `Program 8-2` 中的数组在初始化时其值已经按升序排序。除非数组中的值是排序过的，否则二分查找算法将无法正常工作。\n\
  \n## 二分查找的效率\n\n显然，二分查找比线性查找高效得多。每当它进行比较并未能找到目标项时，就会排除剩余待搜索部分的一半。例如，考虑一个拥有 20,000\
  \ 个元素的数组。如果二分查找在第一次尝试未找到项目，剩余待搜索的元素数量为 10,000 个。如果第二次尝试仍找到，剩余待搜索的量为 5,000 个。这个过程一直持续，直到二分查找定位目标值或确定其不在数组中。对于一个拥有\
  \ 20,000 个元素的数组，这最多需要 15 次比较。（与此相比，线性查找平均需要进行 10,000 次比较！）\n\n使用 2 的幂次来计算二分查找在任意大小的数组上可能需要进行的最大比较次数。（2\
  \ 的幂是 2 升到某个整数指数的幂）。只需找到大于数组元素数量的最小的 2 的幂即可。这将告诉你找到一个元素或确定其不存在时所需的最大比较次数。例如，在拥有\
  \ 50,000 个元素的数组中找到一个项目最多需要 16 次比较（`2¹⁶ = 65,536`），在拥有 1,000,000 个元素的数组中找到一个项目最多需要\
  \ 20 次比较（`2²⁰ = 1,048,576`）。\n\n# 9.2 搜索对象数组\n\n### 概念\n\n线性查找和二分查找也可以用于搜索对象数组。\n\
  \n\n\n\n\n许多编程任务需要将其所处理的数据按照某种顺序排序。例如，客户列表通常按字母顺序排序。学生成绩可能从高到低排序。邮件标签记录可以按 `ZIP\
  \ code` 排序。要对数组中的数据进行排序，程序员必须使用适当排序算法。`sorting algorithm` 是一种遍历数组并按照特定顺序重新排列其内容的技术。\n\
  \n本节介绍了两种简单的排序算法：`冒泡排序`和`选择排序`。像许多排序算法一样，它们会对数据进行多次遍历，检查每个仍留待排序的每条数据，并在每次遍历中将一个值放在其正确的位置。\n\
  \n## 冒泡排序\n\n冒泡排序是一种按升序或降序排列数据的简单方法。它之所以被称为`冒泡排序`算法，是因为当它按升序排序数据数组时，每次排序都会导致较大的值“沉”到数组底部，而较小的值“浮”到顶部，就像向池塘里扔石头一样。石头掉到底部，气泡则向表面浮起。当然，通过微小的修改，该算法也可以将数据按降序排序。在这种情况下，每次排序都会导致较小的值沉到底部，较大的值浮到顶部。在本节中，你将看到如何使用冒泡排序算法来升序排序数组。\n\
  \n假设我们有一个如图 9-1 所示的数组。让我们看看如何使用冒泡排序来将数组元素升序排列。\n\n# 图 9-1 一个未排序的数组\n\n![一个图表显示了一个数组，其下标从“Element\
  \ 0”到“Element 5”。数组中的值为 7, 2, 3, 8, 9 和 1。](img/FG_09_001.png)\n\n冒泡排序从比较数组中的前两个元素开始。如果\
  \ `element 0` 中的值大于 `element 1` 中的值，则交换它们。数组将显示如图 9-2 所示。\n\n# 图 9-2 第一次交换后的数组\n\
  \n![一个图表显示了一个数组。数组中的值为 2, 7, 3, 8, 9 和 1。前两个矩形旁边的注释写道：“这些元素被交换了”。](img/FG_09_002.png)\n\
  \n此步骤对元素 `1` 和 `2` 重复进行。如果 `element 1` 中的值大于 `element 2` 中的值，则交换它们。数组将显示如图 9-3 所示。\n\
  \n# 图 9-3 第二次交换后的数组\n\n![一个图表显示了一个数组。数组中的值为 2, 3, 7, 8, 9 和 1。第二个和第三个矩形旁边的注释写道：“这些元素被交换了”。](img/FG_09_003.png)\n\
  \n接下来，比较元素 `2` 和 `3`。这些元素已经处于正确的顺序，因此没有值被交换。随着循环继续，比较元素 `3` 和 `4`。再次，没有必要交换值，因为它们已经处于正确的顺序。\n\
  \n然而，当比较元素 `4` 和 `5` 时，发现它们的值顺序是错误的（9 大于 1），因此必须交换它们。数组现在显示如图 9-4 所示。\n\n## 图 9-4\
  \ 第一轮遍历完成后的数组\n\n![一个图表显示了一个数组。数组中的值为 2, 3, 7, 8, 1 和 9。最后两个矩形旁边的注释写道：“这些元素被交换了”。最后一个矩形被阴影标记。](img/FG_09_004.png)\n\
  \n此时，排序的第一轮遍历已完成。这意味着整个数组已被扫描了一次。冒泡排序已将最大值 9 放在了数组末尾的正确位置。然而，还有其他元素尚未处于最终位置。因此，算法将对数组进行另一次遍历，再次比较每个元素与其相邻的元素。但此轮遍历在到达倒数第二个元素后将停止比较，因为最后一个元素已经包含了正确的值。\n\
  \n第二次遍历从比较元素 `0` 和 `1` 开始。由于 `element 0` 和 `element 1` 的值是正确的（此处原文逻辑应为已排序，但翻译遵循原文），它们不交换。接下来比较元素\
  \ `1` 和 `2`，由于它们已经是正确的顺序，它们不需要交换。元素 `2` 和 `3` 也是如此。当比较元素 `3` 和 `4` 时，发现 `element\
  \ 3` 的值大于 `element 4` 的值，因此它们被交换。数组现在显示如图 9-5 所示。\n\n## 图 9-5 第二轮遍历后的数组\n\n![一个图表显示了一个数组。数组中的值为\
  \ 2, 3, 7, 8, 1, 9。最后两个矩形旁边的注释写道：“这些元素被交换了”。](img/FG_09_005.png)\n\n在第二次遍历结束时，元素\
  \ `0` 和 `1` 的值已经是正确的。接下来比较元素 `1` 和 `2`，由于它们已经是正确的顺序，它们不需要交换。元素 `2` 和 `3` 也是如此。当比较元素\
  \ `3` 和 `4` 时，发现 `element 3` 的值大于 `element 4` 的值，因此它们被交换。数组现在显示如图 9-6 所示。\n\n##\
  \ 图 9-6 第三轮遍历后的数组\n\n![一个图表显示了一个数组。数组中的值为 2, 3, 7, 8, 1, 9。第三和第四个矩形旁边的注释写道：“这些元素被交换了”。](img/FG_09_006.png)\n\
  \n在第三轮遍历结束时，元素 `0`、`1` 和 `2` 的值已经是正确的。接下来比较元素 `1` 和 `2`，由于它们已经是正确的顺序，它们不需要交换。元素\
  \ `2` 和 `3` 也是如此。当比较元素 `3` 和 `4` 时，发现 `element 3` 的值大于 `element 4` 的值，因此它们被交换。数组现在显示如图\
  \ 9-7 所示。\n\n## 图 9-7 完全排序的数组\n\n![一个图表显示了一个数组。数组中的值为 1, 2, 3, 7, 8 和 9。所有矩形都被阴影标记。](img/FG_09_007.png)\n\
  \n这里是用伪代码表示的冒泡排序算法。它按升序排序数组。\n\n```\n For maxElement = 数组中的每个下标，从最后一个到第二个\n    \
  \     For index = 0 To maxElement − 1\n            If array[index] > array[index\
  \ + 1]\n               swap array[index] with array[index + 1]\n            End\
  \ If\n          End For\n       End For\n```\n\n这是冒泡排序算法的 C++ 代码，编写为一个整数数组函数。该函数接受两个参数：要排序的数组和数组的大小。\n\
  \n```cpp\n 1  void bubbleSort(int array[], int size)\n 2  {\n 3     for (int maxElement\
  \ = size − 1; maxElement > 0; maxElement--)\n 4     {\n 5        for (int index\
  \ = 0; index < maxElement; index++)\n 6        {\n 7           if (array[index]\
  \ > array[index + 1])\n 8              swap(array[index], array[index + 1]);\n 9\
  \        }\n 10     }\n11  }\n```\n\n该函数使用了 `for` 循环，一个嵌套在另一个内部。外层循环从第 3 行开始：\n\n\
  ```cpp\nfor (int maxElement = size − 1; maxElement > 0; maxElement--)\n```\n\n\n\
  \n\n该循环在每一轮排序中都会执行一次。如果数组中有 N 个元素，将会有 N-1 轮通过。这是因为冒泡排序的每一轮都会将一个元素放在其正确的位置。一旦 N-1\
  \ 个元素被放置好，最后一个元素一定已经在其正确的位置了。`maxElement` 变量存储了当前轮次中要查看的最后一个元素的下标。注意，它初始化为数组中最后一个元素的下标，并在每次循环结束时递减\
  \ 1。这防止了循环的后续迭代检查已经放置了正确值值的数组位置。\n\n嵌套在第一个循环内部的第二个循环从第 5 行开始，如下：\n\n```\nfor (int\
  \ index = 0; index < maxElement; index++)\n```\n\n在每一轮通过中，该循环会为每个未排序的数组元素执行一次。它将\
  \ `index` 初始化为 0，并增加到 `maxElement − 1`。在每次迭代中，都会执行第 7 行的比较：\n\n```\nif (array[index]\
  \ > array[index + 1])\n```\n\n此 `if` 语句将存储在 `array[index]` 中的值与后续元素 `array[index\
  \ + 1]` 中的值进行比较。如果后续元素的值较大，则调用第 8 行的 `swap` 函数来交换这两个元素。\n\n# 交换数组元素\n\n正如你在冒泡排序算法描述中所看到的，当算法遍历数组时，某些元素会被交换。以下是用于交换两个\
  \ `int` 参数的 `swap` 函数代码：\n\n```\n void swap(int &a, int &b)\n{\n   int temp = a;\n\
  \   a = b;\n   b = temp;\n}\n```\n\n注意，需要三条语句来交换存储在参数 `a` 和 `b` 所引用内存位置的值。首先，将变量\
  \ `a` 的当前值赋值给局部变量 `temp`，这样当第二条语句将其值替换为 `b` 值的副本时，该值就不会“丢失”。然后，第三条语句将 `temp` 中的值（即\
  \ `a` 的旧值）赋予 `b`。\n\n同样注意，`swap` 函数的参数是引用变量。这是必要的，以便函数能够更改作为参数传递给它的值。如果参数没有声明为引用变量，交换将只发生在分配给函数的局部内存中。传递给函数的参数中的值将不会改变。\n\
  \n`Program 9-4` 在一个完整程序中演示了 `bubbleSort` 和 `swap` 函数。\n\n## 更高效的冒泡排序\n\n冒泡排序算法非常简单直观，但它并不高效。这是因为在每一轮通过中，只将一个值放在其正确的位置，但通常需要多次交换。如果数组很大，情况尤其如此。然而，关于冒泡排序有一个有趣的事实是：如果在特定的一中不需要交换，则意味着数组已经完全排序。因此，不再需要进一步的通过。利用这一特点的算法可以防止许多不必要的循环迭代。以下是实现此功能的增强型冒泡排序代码。\n\
  \n```\n void bubbleSort(int array[], int size)\n{\n   bool madeAswap = true;   \
  \   // 允许循环开始\n   for (int maxElement = size − 1; maxElement > 0 && madeAswap; maxElement--)\n\
  \   {\n      madeAswap = false;     // 此轮没有发生交换\n      for (int index = 0; index\
  \ < maxElement; index++)\n      {   if (array[index] > array[index + 1])\n     \
  \     {   swap(array[index], array[index + 1]);\n              madeAswap = true;\n\
  \          }\n      }\n}\n```\n\n外部 `for` 循环每轮执行一次。注意，在每次新的迭代中，布尔变量 `madeAswap`\
  \ 都必须被置回 `false`。否则，一旦在某轮中进行了交换，该变量就会设置为 `true`，即使数组已完全排序，循环也不会提前退出。然而，如果在某轮通过中不需要交换，`madeAswap`\
  \ 将保持为 `false`，`for` 循环条件将导致循环退出。使用这种修改后的冒泡排序的 `Program 9-4` 可以在书籍伴随网站的 `Chapter\
  \ 9` 程序中找到。除了上面显示的代码外，它还让 `bubbleSort` 函数统计了完成排序所需的轮数，并将此计数返回给 `main` 进行显示。正在排序的数组包含六个元素，存储的数据与\
  \ `Program 9-4` 所示的不同。如果没有测试交换的额外代码，它需要五轮才能完成排序。但程序报告它只需要三轮。\n\n## 选择排序\n\n即使有了上述增强，冒泡排序算法仍然效率低下，因为值每次只向数组中的最终位置移动一个元素的位置。选择排序算法在每一轮通过中都需要一次交换，因为它将该轮被正确放置的元素立即移动到它在数组中的正确位置。该算法之所以名为选择排序，是因为在每一轮通过中，它都会确定哪个值属于当前填充的数组位置，并将其“选择”为与该位置上当前值进行交换的对象。\n\
  \n当按升序排序时，选择排序的工作原理如下：找到数组中的最小值并将其移动到 `element 0`。然后，找到下一个较小的值并移动到 `element 1`。这个过程一直持续直到所有元素都按正确的顺序放置。让我们看看选择排序在安排\
  \ `Figure 9-8` 中的数组元素是如何工作的。\n\n# 图 9-8 未排序的数组\n\n![图表显示数组。矩形显示下标“Element 0”到“Element\
  \ 5”。数组中的值为 5, 7, 2, 8, 9 和 1。](img/FG_09_008.png)\n\n选择排序从 `element 0` 开始扫描数组，并找到值最小的元素。然后，该元素的内容与\
  \ `element 0` 的内容交换。在例中，存储在 `element 5` 中的 1 与存储在 `element 0` 中的 5 交换。交换后，数组如 `Figure\
  \ 9-9` 所示。\n\n## 图 9-9 第一轮后的数组\n\n![图表显示数组。数组中的值为 1, 7, 2, 8, 9 和 5。第一个和最后一个矩形旁的注释写道：“这些元素已交换”。第一个矩形带有阴影。](img/FG_09_009.png)\n\
  \n在第二轮中，算法重复该过程，但由于 `element 0` 已经包含了数组中的最小值，因此它被排除在之外。这一次，算法通过查看 `element 1` 中的\
  \ 7 开始扫描。在本例中，`element 2` 中的值是未排序部分中的最小值，因此它与 `element 1` 中的值交换。现在数组看起来如 `Figure\
  \ 9-10` 所示。\n\n\n\n在第三次通过中，算法从元素 2 开始扫描。数组未排序部分中的最小值位于元素 5，因此它与元素 2 处的值进行交换。现在数组的显示如图\
  \ 9-11 所示。\n\n## 图 9-11 第三次通过后的数组\n\n![图表显示了一个数组。数组中的数值为 1, 2, 5, 8, 9 和 7。第三个和最后一个矩形旁边的注释写着“这些元素已交换位置”。前三个矩形填充了阴影。](img/FG_09_011.png)\n\
  \n第四次通过从元素 3 开始。它的值与元素 5 处的值进行交换，导致数组显示如图 9-12 所示。\n\n## 图 9-12 第四次通过后的数组\n\n![图表显示了一个数组。数组中的数值为\
  \ 1, 2, 5, 7, 9 和 8。第四个和最后一个矩形旁边的注释写着“这些元素已交换位置”。前四个矩形填充了阴影。](img/FG_09_012.png)\n\
  \n此时，只剩下两个元素需要排序了。算法发现元素 5 处的值小于元素 4 处的值，因此两者进行了交换。这使得数组处于最终的顺序，如图 9-13 所示。\n\n\
  ## 图 9-13 完全排序后的数组\n\n![图表显示了一个数组。数组中的数值为 1, 2, 5, 7, 8 和 9。最后两个矩形旁边的注释写着“这些元素已交换位置”。所有矩形都填充了阴影。](img/FG_09_013.png)\n\
  \n这里是选择排序算法的伪代码：\n\n```\n For start = 每个数组下标, 从第一个到倒数第二个\n   minIndex = start\n\
  \   minValue = array[start]\n   For index = start + 1 To size − 1 // size − 1 是最后一个元素\n\
  \      If array[index] < minValue\n         minValue = array[index]\n         minIndex\
  \ = index\n      End If\n   End For\n   swap array[minIndex] with array[start]\n\
  End For\n```\n\n与冒泡排序一样，选择排序使用一对嵌套循环，在这种情况下是两个 `for` 循环。外层循环为每次通过迭代一次。它的循环控制变量 `start`\
  \ 留在该次通过将接收正确值的数组元素的下标。在第一次通过中，`start` 等于 0，找到最小值并将其放在位置 0，与之前存储在位置 0 的值交换。在第二次通过中，`start`\
  \ 等于 1，找到剩余值中的最小值并将其放在位置 1，与之前存储在位置 1 的值交换。这个过程一直持续，直到顺序正确的值位于位置 0 到倒数第二个下标位置。一旦完成此操作，留在数组最后一个位置的剩余值将是最大的，因此外层循环不需要再次迭代。对于\
  \ N 个数据，将会有 N-1 次通过。\n\n在每次通过中，内层循环的任务是在数组仍未排序的部分中找到最小值，以便将其与位置 `start` 处的值进行交换。在开始迭代之前，`minIndex`\
  \ 被设置为 `start`，`minValue` 被设置为当前位置 `start` 处的值。然后，内层循环从索引 `start + 1` 开始遍历数组的其余部分。如果找到一个比当前存储在\
  \ `minValue` 中更的值，就会用这个新的小值替换它，并将存储在 `minIndex` 中的下标替换为这个新索引。一旦内层循环完成迭代，`minIndex`\
  \ 将持有最小元素的索引。外层循环随后在返回循环顶部、增加 `start` 并开始下一次排序通过之前，将该元素的内容与 `array[start]` 的内容交换。请注意，如果没有找到比位置\
  \ `start` 处更小的元素，`minIndex` 仍然等于 `start`，因此 `array[start]` 中的值本质上将与它自己交换，保持不变。\n\
  \n与冒泡排序算法一样，一旦选择排序将一个值放在其正确位置，该值和该位置在后续通过中就不需要再次检查。然而，如前所述，选择排序比冒泡排序更有效，因为每次通过所需的交换次数更少。事实上，如你在上面的伪代码所示，每次通过只需要一次数据交换。另一方面，注意到选择排序没有使用标记变量，就像冒泡排序中有一个用于判断数组是否完全排序的变量一样。\n\
  \n\n\n在上一一节中，你学习了作为标准模板库（STL）一部分的 `vector` 类。一旦你正确地定义了 STL `vector` 并向其填充了值，就可以使用本章介绍的算法对该向量进行排序和搜索。在需要时，简单地将数组语法替换为向量语法即可。\n\
  \n程序 9-7 了如何对字符串 `vector` 使用选择排序和二分查找算法。\n\n请注意程序 9-7 与程序 9-5 之间的相似之处与不同之处。程序 9-7\
  \ 中使用选择排序算法对向量排序的代码与程序 9-5 中对数组排序的代码几乎相同。然而，请注意，在程序 9-7 中，向量是通过引用传递给 `selectionSort`\
  \ 函数的。这是必要的，因为与数组不同，除非程序员使用引用变量作为参数，否则向量是按值传递的。还要注意，在程序 9-7 中，我们不需要向处理它的函数传递向量的大小，因为向量的`size()`\
  \ 成员函数可以告诉我们包含多少个元素。\n\n## 9.6 算法分析导论\n\n### 概念\n\n我们可以通过计算算法解决问题所需的步骤数来估计其效率。\n\
  \n算法是解决问题的机械化逐步处理过程，是设计程序时使用的基本策略。对于一个给定的问题，通常有多种算法可以使用。例如，我们在本章较早看到，搜索排序数组的问题可以通过两种不同的方法解决：*顺序查找*和*二分查找*。\n\
  \n我们如何判断解决问题的两个算法中哪一个更好呢？为了回答这个问题，我们需要建立一套判断算法“优劣”程度或效率的标准。最常用的两个标准是空间和时间。*空间*标准指的是算法解决问题所需的内存量，而*时间*标准则指的是执行时间的长短。在本章中，我们将使用时间标准来评估算法的效率。\n\
  \n比较两个算法的一种可能方法是将它们编写成代码，然后对生成的 C++ 程序进行执行计时。这种实验性方法可以产生有用的信息，但它存在以下缺点：\n\n*   它衡量的是程序的效率，而不是算法的效率。\n\
  *   结果取决于用于编写算法的编程语言，以及用于生成机器码的编译器的质量。如果使用不同的语言编写或由不同的编译器进行编译，程序的运行速度可能会更快或更慢。\n\
  *   结果取决于操作系统如何执行程序，以及运行程序的硬件性质。如果我们在不同的计算机和不同的操作系统上运行程序，其执行时间可能会有所不同。\n*   结果仅适用于执行过程中包含的那些输入，可能无法代表使用不同输入集时算法的性能。\n\
  \n更好的方法是计算算法处理给定大小输入时所需的基本步骤数。为了使这种方法具有意义，我们需要对计算问题、问题输入、输入规模和基本步骤有更精确的定义。\n\n##\
  \ 计算问题与基本步骤\n\n*计算问题*是一个用算法解决的问题。这类问题是多个*实例*（instances）的集合，每个实例都由按照规定格式给定的输入数据指定。例如，如果问题\
  \ *P* 是对整数数组进行排序，那么 *P* 的一个实例就是一个特定的待排序的整数数组。实例的*规模*指的是存储输入所需的内存量。输入规模通常由数据所占的位数给出。如果每个条目的位数是固定的（例如\
  \ 64 位），那么数组长度就是良好的输入规模衡量标准。相反，如果元素的大小可以变化，数组长度就不是良好的输入规模衡量标准。\n\n如果算法执行的步骤能够在常数时间内内完成，那么该步骤就是*基本步骤*（也称为基本操作）。在对数组排序时，步骤\n\
  \n```\n交换位置 k 和 k+1 的元素\n```\n\n是基本步骤，因为交换元素的时间是恒定的。相反，像这样的步骤\n\n```\n查找数组中的最大元素\n\
  ```\n\n不是基本步骤，因为完成它所需的时间取决于数组的长度。直观地说，基本步骤是可能构建在某些物理硬件中的步骤。\n\n基本步骤的定义并没有规定限制执行该步骤所需的常数。忽略这些常数的具体值反映了这样一个现实：相同的操作在不同的硬件上执行速度可能，在一个计算机上只需一次指令的操作在另一台计算机上可能需要几条指令。这种定义的后果是将任何常数基本步骤计为一个基本步骤。例如，一个执行\
  \ 5n 个基本步骤的算法可以准确地描述为执行了 n 个基本步骤。\n\n重要的是要意识到，普通的算术和逻辑操作（如加法和比较）除非对加或比较数字的大小加上常数限制，否则它们不是基本步骤。只要限制是常数，大小并不重要。它可以是\
  \ 32、64、128、1024 位甚至更大，这些操作仍然是基本步骤。在随后的讨论中，我们假设算法中作为输入、输出或计算中间结果的所有数字大小都是有限的。这允许我们对它们的操作视为基本步骤。\n\
  \n在我们描述了算法应该解决的问题之后，再来描述算法是合理的。计算问题的描述是通过说明输入看起来是什么样的、规模有多大以及解决问题的算法应该产生什么输出。这些描述必须清晰，以消除歧义，并且通常以便算法能够处理任何符合描述的数据集。\n\
  \n让我们来看一个例子。假设问题 *P* 是对一维数组中的所有整数值求和。我们可以这样描述这个问题：输入数据是一个包含 *n* 个整数值的数组，要产生的输出是这些值的整数和。形式化表写如下：\n\
  \n*   输入：一个大小为 *n* 的整数数组 `a[]`\n*   输入规模：数组条目的数量 *n*\n*   输出：代表数组中存储值总和的整数 `sum`\n\
  \n\n\n注意，这里使用的 `INPUT` 一词并不是用户输入的一组数据。它指的是算法解决问题时使用的数据形式。同样，这里使用的 `OUTPUT` 一词并不是指程序在计算机屏幕上显示的内容。它指的是解决问题的算法所产生的结果。由于我们假设所有数组条目都是固定的大小（例如\
  \ 32 或 64 位），因此数组中元素的数量 `n` 是输入规模的良好衡量。\n\n一旦描述了一个计算问题，就可以设计出许多不同的算法来解决它。当然，某些算法会比其他算法更好，正如我们很快将看到的。这里是解决上述计算问题的一种可能的算法。注意，它是用伪代码表示的，而不是\
  \ C++ 或任何其他特定的编程语言。\n\n## 算法 1\n\n```\n 1: sum = 0 \n2: k = 0 //数组索引 \n3: While\
  \ k < n do \n4:     sum = sum + a[k] \n5:     k = k + 1 \n6: End While\n```\n\n\
  ## 算法复杂度\n\n我们可以通过确定算法处理规模为 `n` 的输入所需的 le 步骤数，来衡量解决计算问题的算法的复杂度。让我们数数算法 1 需要的步数。该算法由第\
  \ 1 行和第 2 行的两个语句组成（各执行一次），以及循环内部第 4 行和第 5 行的两个语句（每次循环迭代执行一次）。回第 1 行和第 2 行的语句执行的是基本操作，可以将它们合并并计作一次基本操作。我们将这种操作称为\
  \ `A`。\n\n此外，由于循环中的两个语句都在常数时间内执行，且与 `n` 的大小无关，它们也是基本操作。由于循环体只包含基本操作，算法执行单次循环迭代所需的时间也是常数，且不依赖于\
  \ `n` 的大小。这允许我们将每次循环迭代视为单个基本操作。我们将这种操作称为 `B`。\n\n操作 `A` 只执行一次，无论 `n` 有多大。操作 `B`\
  \ 在每次循环迭代时执行一次。因为循环迭代了 `n` 次，操作 `B` 被执行了 `n` 次。因此，执行的总操作次数为 1+n。例如，当 `n` = 10 时，执行了\
  \ 11 次操作。当 `n` = 1000 时，执行了 1001 次操作。当 `n` = 10,000 时，执行的操作次数为 10001。注意，当 `n` 变得很大时，1\
  \ 变得微不足道，执行的操作次数约为 `n`。因此我们说该算法处理规模为 `n` 的输入集需要与 `n` 成比例的执行时间。\n\n我们还有另一种方法观察算法\
  \ 1 并确定它需要多少操作。在求数组和时，关键操作是将每个值加到累加和的变量中。这发生在第 4 行，数组值的加次数与循环迭代次数相同。\n\n因此，我们只需要计算数组元素的加次数就能得到相同的结果。事实证明，对于大多数算法，只需要识别并计数一两个对所解决的问题至关重要的基本操作就足够了。例如，在许多数组搜索和排序算法中，只需要计算元素之间的比较次数就足够了。\n\
  \n刚刚考虑的数组求和算法分析起来特别简单，因为它对所有给定规模的输入集都执行相同的工作。\n\n并非所有算法都是如此。考虑本章之前介绍的线性搜索算法。它遍历一个值数组，寻找与搜索键匹配的项目。我们将该键称为\
  \ `X`。算法的输入是包含 `n` 个值的数组和键值 `X`。算法的输出是该值所在数组位置的下标；或者如果没有找到，则判定循环控制变量已大于最后一个数组元素的下标。从形式上说，问题可以表述为：\n\
  \n*   输入：一个规模为 `n` 的整数数组 `a[]` 和一个整数 `X`\n*   输入规模：数组条目的数量 `n`\n*   输出：范围在 0 ≤ k\
  \ ≤ n-1 内的整数 `k`，使得 `a[k] = X`，或者 `k = n`\n\n显示的算法 2 使用线性搜索算法来解决这个问题。\n\n## 算法 2\n\
  \n```\n1: k = 0\n2: While k < n and a[k] ≠ X do\n3:    k = k + 1\n4: End While\n\
  ```\n\n该算法从数组的一端开始，顺序遍历数组。算法一旦遇到 `X` 就会停止，但如果 `X` 不在数组中，它将搜索整个数组。算法可能在仅进行一次比较后停止（在检查的第一个条目中找到\
  \ `X`），也可能在进行了 `n` 次比较后才停止（在检查的最后一个位置找到 `X` 或不在数组中）。事实上，算法可能会执行 `m` 次比较，其中 `m` 是\
  \ 1 到 `n` 之间的任何值。在算法对于相同规模的输入可能执行不同工作量的情况下，通常通过衡量处理需要最多工作的规模为 `n` 的输入时的工作来来算法效率。这被称为通过最坏情况复杂度函数来衡量算法。\n\
  \n# 算法的最坏情况复杂度\n\n算法的最坏情况复杂度函数 `f(n)` 是在需要最多工作的规模为 `n` 的输入上执行的步数。它指示了算法所需的最长时间。\n\
  \n让我们确定本章之前介绍的二分搜索的最坏情况复杂度。该算法用于在升序的数组中定位项目 `X`。最坏情况发生在未找到 `X` 时。在这种情况下，正如我们将看到的，算法执行了\
  \ L+1 步，其中 `L` 是循环迭代的次数。\n\n这里是搜索包含 `n` 个元素数组的二分搜索算法。\n\n## 算法 3\n\n```\n 1: first\
  \ = 0\n2: last = n − 1   // n − 1 是最后一个元素的下标。\n3: found = false\n4: position = −1\n\
  5: While found is not true and first <= last\n6:     middle = (first + last) / 2\n\
  7:     If a[middle] = X\n8:        found = true\n9:        position = middle\n10:\
  \     Else if a[middle] > X\n11:        last = middle − 1\n12:     Else\n13:   \
  \     first = middle + 1\n14:     End If\n15: End While\n16: // 当循环终止时，position\
  \ 持有值 X 所在的下标\n17: //；如果没有找到该值，则持有 −1\n18: //\n```\n\n该算法由一些变量初始化以及一个循环组成。初始化需要常数时间，因此可以被视为一次基本操作。同样，循环的每次迭代都是基本步骤，因为增加数组条目的数量不会增加单次迭代所需的时间。这表明二分搜索所需的步数是\
  \ L+1。现在 `L` 大约等于 `log[2]*n*` 的整数部分，即 `n` 以 2 为底的对数。为了理解这一点，注意搜索数组的大小最初为 `n`，每次迭代都会将剩余部分的大小大约缩小一半。由于每次循环迭代最多执行两次比较，二分搜索总共执行了\
  \ `2*log[2]*n*` 次比较。我们可以将发现总结如下：\n\n*   在最坏情况下，二分搜索需要与 `log[2]*n*` 成比例的时间。\n\n\n\
  \n让我们再看另一个算法来确定它的最坏情况复杂度。要解决的计算问题是将一组 `n` 个整数按升序排列。\n\n- 输入：一个包含 `n` 个整数的数组 `a[]`\n\
  - 输入规模：数组条目的个数 `n`\n- 输出：重新排列后的数组 `a[]`，使得 `a[0]` ≤ `a[1]` ≤ ... ≤ `a(n − 1)`\n\n\
  我们将使用的算法是本章早些介绍的选择排序算法的改进版本。这个版本在每次遍历中扫描最大元素（而不是最小元素），并将其移动到末尾。\n\n## 算法 4\n\n```\n\
  \ 1: 对于 (k = n−1; k ≥ 1; k —−)\n2:      // a[0..k] 是剩余需要排序的部分\n3:      确定 a[0..k]\
  \ 中最大条目的位置 p\n4:         交换 a[p] 与 a[k]\n5:   结束\n```\n\n为了分析该算法的复杂度，我们首先确定它在排序包含\
  \ `n` 个元素的数组时进行了多少次数组元素之间的比较。这些比较发生在第 3 步。第 3 步显然不是基本步骤，因为它所需的时间与 `k` 成比例，且 `k`\
  \ 随着循环的每次迭代而变化。为了更好地理解过程，让我们用基本操作重新表述第 3 步。\n\n- 输入：包含 `k + 1` 个条目的数组 `a[0..k]`\n\
  - 输入规模：数组条目的个数 `k + 1`\n\n```\n3.0: p = 0 // 数组未排序部分最大值的索引\n3.1: 对于 (m = 1; m ≤\
  \ k; m++)\n3.2:    如果 a[m] > a[p] 则\n3.3:      p = m\n3.4:    结束\n3.5: 结束\n```\n\
  \n我们可以看到，第 3.1 行到 3.5 行的循环迭代了 `k` 次，并且在第 3.2 行每次迭代时进行一次比较。因此，该算法在数组元素之间需要 `k` 次比较。\n\
  \n现在回到主排序算法，我们观察到从第 1 行开始到第 5 行结束的循环将进行 `n − 1` 次迭代，对应 `k` 从 `n − 1` 到 1 范围内的每一个值。在第一次迭代中，`k`\
  \ 等于 `n − 1`，根据我们对第 3.0 行到 3.5 行的分析，第 3 步在元素之间执行了 `n − 1` 次比较。在第二次迭代中，`k` 等于 `n\
  \ − 2`，因此第 3 步执行 `n − 2` 次比较。以此此类推，直到最后一次迭代，`k` 等于 1，第 3 步执行 1 次比较。如下：\n\n$$\\begin{array}{crc}\
  \ k & = & {n - \\,\\text{1:~step~3~performs~}n - \\text{1}\\,\\text{comparisons}}\
  \ \\\\ k & = & {n - \\text{2:~step~3~performs~}n - \\text{2}\\,\\text{comparisons}}\
  \ \\\\ \\cdot & & \\\\ \\cdot & & \\\\ k & = & {\\text{1:~step~3~performs}\\,\\\
  text{1}\\,\\text{comparison}}} \\end{array}$$\n\n推广来说，我们可以得出：对于 `k` 从 `n − 1` 到\
  \ 1 的每一个值，在第 `k` 次迭代中，第 3 行的步骤将执行 `k` 次比较。\n\n因此，该简单排序算法执行的比较总数由表达式给出\n\n$1 + 2\
  \ + 3 + \\dots + (n − 1) = (n − 1)n/2$\n\n对于较大的 `n`，这个表达式非常接近 $n²/2$。因此说：\n\n- 在最坏情况下，选择排序的时间与\
  \ $n²$ 成比例。\n\n# 平均情况复杂度\n\n然而，最坏情况复杂度并不能很好算法在实际情况下的表现，因为产生最坏情况性能的输入很少见。通常，我们更感兴趣确定典型情况（或平均情况）的复杂度。当我们知道不同输入在实践中出现的相对频率时，可以使用平均情况复杂度函数。平均情况复杂度函数利用这些频率对每个输入执行的步数进行加权平均。遗憾的是，尽管它提供了算法预期性能的良好衡量，但可能很难获得输入频率的准确估计。\n\
  \n# 渐近复杂度与大 O 表示法\n\n我们可以通过比较两个算法 `F` 和 `G` 来解决同一个问题。具体来说，如果 `f(n)` 和 `g(n)` 是两个算法的复杂度函数，我们可以通过观察\
  \ `n` 变大时比率 `f(n)/g(n)` 的变化来比较算法。如果这个比率趋于某个极限，最容易理解。在过程中，我们假设对于所有 `n ≥ 1`，`f(n)\
  \ ≥ 1` 且 `g(n) ≥ 1`。\n\n- `f(n) = 3n² + 5n` 且 `g(n) = n²`。在这种情况下\n$$\\left( \\frac{f(n)}{g(n)}\
  \ \\right) = \\frac{3n² + 5n}{n²} = 3 + \\frac{5}{n} \\rightarrow 3 \\text{当 } n\\\
  rightarrow\\infty.$$\n这意味着随着 `n` 增大，`f(n)/g(n)` 的值越来越接近 3。这意味着对于较大的输入规模，`F` 执行的操作次数是\
  \ `G` 的三倍。然而，这两个算法仅相差一个常因子，我们认为它们的效率是等等的。\n\n- `f(n) = 3n² + 5n` 且 `g(n) = 100n`。在这种情况下\n\
  $$\\left( \\frac{f(n)}{g(n)} \\right) = \\frac{3n² + 5n}{100n} = \\frac{3n}{100}\
  \ + \\frac{5}{100} \\rightarrow \\infty \\text{当 } n\\rightarrow\\infty.$$\n在这里，比率\
  \ `f(n)/g(n)` 随着 `n` 增大而越来越大。这意味着在大规模下，`F` 执行的工作比 `G` 多得多。这使得 `G` 成为大输入的更好的算法。\n\
  \n- `f(n) = 3n² + 5n` 且 `g(n) = n³`。在这种情况下\n$$\\left( \\frac{f(n)}{g(n)} \\right)\
  \ = \\frac{3n² + 5n}{n³} = \\frac{3}{n} + \\frac{5}{n²} \\rightarrow 0 \\text{当\
  \ } n\\rightarrow\\infty.$$\n这意味着随着 `n` 增大，`f(n)/g(n)` 的值越来越接近 0。这意味着对于较大的输入规模，`G`\
  \ 执行的操作比 `F` 多得多。这使得 `F` 成为更好的算法。\n\n通常，我们可以通过观察 `n` 变大时 `f(n)/g(n)` 的情况来比较两个复杂度函数\
  \ `f(n)` 和 `g(n)`。虽然通过该比率的极限来考虑是有帮助的，但我们不能假设这种极限一定存在。事实证明，即使极限不存在，我们也可以从该比率中获得有用信息。如果我们能找到正常数\
  \ `K` 使得\n$$\\frac{f(n)}{g(n)} \\leq K \\text{对于所有 } n \\geq 1$$\n我们就可以有效地比较这两个复杂度函数。如果可以这样做，意味着算法\
  \ `F` 没有 `G` 的 `K` 倍。在这种情况下，我们说 `f(n)` 属于 `O(g(n))`，读作“f 是 g 的 O”。定义 `f(n)` 在 `O(g(n))`\
  \ 中的条件通常写为：\n`f(n) ≤ K*g(n)` 只要 `n ≥ 1`。\n\n证明 `f(n)` 在 `O(g(n))` 中通常很直观。你观察比率 `f(n)/g(n)`\
  \ 并尝试找到一个正常数 `K`，使得对于所有 `n ≥ 1`，`f(n)/g(n) ≤ K`。例如，为了证明 `3n² + 5n` 是 `O(n²)`，观察以下比例并注意到对于所有\
  \ `n ≥ 1`，`5/n` 最大为 5。因此 `3 + 5/n ≤ 8`。对于 `K = 8`，`f(n)/g(n) ≤ K`。\n\n$$\\frac{3n^{2}\
  \ + 5n}{n^{2}} = 3 + \\frac{5}{n}$$\n\n证明 `f(n)` 不在 `O(g(n))` 中，你必须证明没有方法找到一个正 `K`\
  \ 使得对于所有 `n ≥ 1` 满足 `f(n)/g(n) ≤ K`。例如，函数 `3n² + 5n` 不是 `O(n)`，因为不存在常数 `K` 满足\n\
  $$\\frac{3n^{2} + 5n}{n} = 3n + 5 \\leq K\\,\\text{对于所有 } n \\geq 1.$$\n\n\n\n虽然“大\
  \ O”符号和术语是为函数定义的，但也被用于描述算法和计算问题。因此，如果算法 `F` 的最坏情况复杂度函数 `f(n)` 属于 `g(n)` 的大 O 阶，我们就说算法\
  \ `F` 属于 `O(g(n))`。相应地，数组的顺序查找属于 `O(n)`，而二分查找属于 `O(log[2]n)`。\n\n同样，如果一个问题存在一个算法，其最坏情况复杂度函数属于\
  \ `O(g(n))`，则称该问题属于 `O(g(n))`。因此，排序数组的问题属于 `O(n²)`，而搜索已排序数组的问题属于 `O(log[2]n)`。\n\
  \n如果 `g(n)` 是一个函数，`O(g(n))` 可以被视为一组增长不快于 `g(n)` 的函数族。这些族被称为`复杂度类`，其中几个类非常重要，足以拥有特定的名称。我们在这里按增长速率从快到低的顺序列出它们。\n\
  \n1. `O(1)`：如果存在常数 `K > 0` 使得对于 `n ≥ 1` 都有 `f(n) ≤ K`，则函数 `f(n)` 属于此类。最坏情况复杂度函数属于此类类的算法被称为以`常数时间`运行。\n\
  2. `O(log[2]n)`：此类类的算法以`对数时间`运行。由于 `log n` 的增长远慢于 `n`，问题规模的巨大增加导致算法运行时间的微小增加。这种复杂度是搜索问题的特征，这类问题每次基本操作都能消除一半的搜索空间。`二分查找`算法就属于此类。\n\
  3. `O(n)`：此类类的算法以`线性时间`运行。问题规模的任何增加都会导致算法运行时间的按比例增加。这种复杂度是`顺序查找`等算法的特征，这些算法对输入进行单次扫描或常数次扫描。\n\
  4. `O(n log[2]n)`：此类类被称为“n log n”时间。问题规模的增加会导致算法运行时间的轻微增加。你将在第 14 章学到的排序算法`快速排序`的平均情况复杂度就属于此类。\n\
  5. `O(n²)`：此类类被称为`二次时间`。这种性能是使用两个嵌套循环对输入数据进行多次扫描的算法的特征。问题规模的增加会导致算法运行时间的大幅增加。`泡泡排序`、`选择排序`和`快速排序`的最坏情况复杂度函数都属于此类。\n\
  \n## 检查点\n\n1. 9.10 什么是基本操作？\n2. 9.11 算法的最坏情况复杂度函数是什么？\n3. 9.12 一个算法需要 `10n` 次基本操作来处理规模为\
  \ `n` 的输入，另一个算法需要 `25n` 次基本操作来处理相同的输入。这两个算法哪个更有效？或者它们效率相等？\n4. 9.13 说 `f(n)` 属于\
  \ `O(g(n))` 是什么意思？\n5. 9.14 通过找到一个满足方程 `(100n³ + 50n² + 75)/20n³ ≤ K` 的正数 `K`，证明\
  \ `(100n³ + 50n² + 75)` 属于 `O(20n³)`。\n6. 9.15 假设对于所有 `n ≥ 1` 都有 `g(n) ≥ 1`，证明 `O(g(n)\
  \ + 100)` 中的每个函数也属于 `O(g(n))`。\n\n## 9.7 案例研究\n\n以下案例研究包含了第 9 章介绍材料的应用，可以在本书的配套网站的第\
  \ 9 章文件夹中找到：`pearsonhighered.com/gaddis`。\n\n## Demetris 领导力——第 1 & 2 部分\n\n第 9\
  \ 章介绍了如何搜索和排序数组，包括对象数组。这两个案例研究说明了如何搜索和排序结构体数组。这两个研究都是为 DLC, Inc. 开发程序，这是一家出版书籍、DVD\
  \ 和音频 CD 的虚构公司。两个程序使用的 DLC 库存都存储在一个结构体数组中。\n\n## 创建抽象数据类型——第 2 部分\n\n`IntList` 类从第\
  \ 8 章作为案例研究开始，现在扩展到包含数组搜索和排序。\n\n## 复习题与练习题\n\n## 空选题与简答\n\n1. 搜索算法按顺序遍历数组，将每个项目与搜索值进行比较。\n\
  2. 搜索算法反复将正在搜索的数组部分减半。\n3. 线性查找算法也称为顺序算法，因为。\n4. 搜索算法要求数组的内容必须是有序的。\n5. 线性查找在包含\
  \ N 个元素的数组中查找一个项目时执行的平均比较次数是。\n6. 线性查找在包含 N 个元素的数组中查找一个项目时执行的最大比较次数是。\n7. 如果该值存储在数组元素中，线性查找只需一次比较就能找到要查找的值。\n\
  8. 如果该值存储在数组元素中，二分查找只需一次比较就能找到要查找的值。\n9. 在二分查找中，经过三次比较后，只有数组的 ____ 待搜索。\n10. 二分查找函数在\
  \ 2,000 个元素的数组中搜索某个值时的最大比较次数是。\n11. 如果数组是有序的，值将从低到高 存储。\n12. 如果数组是有序的，值将从高到低 存储。\n\
  13. 泡泡排序在每次遍历数据时会将 ____ 个元素移动到正确位置。\n14. 选择排序在每次遍历数据时会将 ____ 个元素移动到正确位置。\n15. 排序\
  \ N 个数字，对于已经有序的数组，泡泡排序需要多少次扫描：\n    - 如果不包含发现数组已完全排序的停止代码？\n    - 如果包含发现数组已完全排序的停止代码？\n\
  16. 排序 N 个数字，选择排序总是会进行多少次扫描？\n17. 为什么在大数组上，选择排序几乎比泡泡排序更有效？\n18. 在排序对象或结构体数组时，如果两个元素的搜索键值顺序错误，算法必须交换\
  \ ____。\n19. 完成下表，计算线性查找执行的平均次数和最大比较次数，以及二分查找执行的最大比较次数。\n\n| 数组大小→ | 100 个元素 | 1000\
  \ 个元素 | 10,000 个元素 | 100,000 个元素 | 1,000,000 个元素 |\n| --- | --- | --- | --- | ---\
  \ | --- |\n| 线性查找（平均比较次数） | | | | | |\n| 线性查找（最大比较次数） | | | | | | |\n| 二分查找（最大比较次数）\
  \ | | | | | | |\n\n\n\n\n1. 编写一个尽可能高效的伪代码算法，查找具有特定 `customerID` 的记录，假设从 101 到 500\
  \ 的每一个客户 ID 都被使用，且数组有 400 个元素。\n2. 编写一个尽可能高效的伪代码算法，查找一个靠近 ID 末尾（例如 494）的客户 ID 记录，假设\
  \ 101 到 500 范围内并非每一个客户 ID 都被使用，且数组大小仅为 300。\n\n## 软技能\n\n决定如何组织和访问数据是程序设计的重要部分。你已经熟悉了许多允许你组织数据的结构和方法。这些包括一维数组、向量、多维数组、并行数组、结构体、类、结构体数组以及类对象数组。你现在还熟悉了一些用于排列数据（即排序数据）和定位数据项（即搜索数据项）的技术。\n\
  \n2. 与两到三名其他学生合作，共同决定如何对以下应用中使用数据进行组织、排序和定位。准备好向全班展示你们小组的设计方案。\n\n要开发的程序是一个菜单驱动的程序，用于跟踪雇佣你的村庄发放的罚单。当发放罚单时，程序必须能够接受并存储以下信息：罚单号、警员编号、车辆车牌州份和号码、地点、违规代码（这指示违反了哪项停车法规）以及开具日期时间。程序必须存储与每个违规代码相关的罚款金额。当罚单被支付时，程序必须能够接受并存储已支付的信息、支付金额以及收款日期。程序必须能够接受查询，例如在输入罚单号时显示整个罚单记录。程序还必须能够生成以下报告：\n\
  \n* 特定日期发放的所有罚单列表，按罚单号排序\n* 在特定日期收到付款的所有罚单列表，以及当天收到的总金额\n* 一个月内发放的所有罚单报告，按警员编号排序，并统计每个警员开具的罚单数量\n\
  * 所有尚未支付或已金额少于应付金额的罚单报告，按车辆车牌号排序\n\n## 编程挑战\n\n这些编程挑战中的许多可以使用类或不使用类来编写。你的导师将告诉你你应该使用哪种方法。\n\
  \n## 1. 费用账户验证\n\n编写一个程序，让用户输入费用账户号码。程序应通过检查以下列表来判断该号码是否有效：\n\n| 5658845 | 4520125\
  \ | 7895122 | 8777541 | 8451277 | 1302850 |\n| 8080152 | 4562555 | 5552012 | 5050552\
  \ | 7825877 | 1250255 |\n| 1005231 | 6545231 | 3852085 | 7576651 | 7881200 | 4581002\
  \ |\n\n用这些值初始化一个维数组。然后使用简单的线性查找找到用户输入的数字。如果用户输入的数字在数组中，程序应该显示该号码有效的消息。如果用户输入的数字不在数组中，程序应该显示指示该号码无效的消息。\n\
  \n# 2. 彩票中奖者\n\n彩票购买者每周购买 10 张票，总是玩相同的 10 个五位数“幸运”组合。编写一个程序，用这些数字初始化数组，然后让玩家输入本周的中奖五位数数字。程序应对玩家的数字列表进行线性查找，并报告本周是否有任何一张票中奖。以下是这些数字：\n\
  \n| 13579 | 26791 | 26792 | 33445 | 55555 | 62483 | 77777 | 79422 | 85647 | 93121\
  \ |\n\n# 3. 彩票中奖者修改\n\n修改你为编程挑战 2（彩票中奖者）编写的程序，使其执行二分查找而不是线性查找。\n\n## 4. 打击率\n\n\
  编写一个程序，创建并显示一份 12 名小联盟棒球球员及其打击率的报告，按打击率从高到低的顺序列出。程序应使用结构体数组或类对象数组来存储数据，其中每个结构体或对象持有球员的名字和他们的打击率。通过让\
  \ `main` 调用不同的函数来输入数据、排序数据、执行交换和显示报告，使程序模块化。\n\n## 5. 滑雪坡道\n\n编写一个可以供滑雪场使用的程序，用于跟踪一周的雪况。它应该有一个包含七元素的结构体或类对象数组，其中每个结构体或对象持有日期和雪深（英寸）。程序应让用户输入月份、该期间的开始和结束日期，以及基础深度。然后程序应按升序排列数据并显示结果。以下是示例报告的开头。\n\
  \n```\n 12 月雪况报告\n   日期基础\n    13  42.3\n    12  42.5\n    14  42.8\n```\n\n## 6.\
  \ 字符串排序\n\n修改本章中的 `selectionSort` 函数，使其处理字符串数组而不是整数数组。使用驱动程序测试该函数。\n\n## 7. 二分字符串搜索\n\
  \n修改本章中的 `binarySearch` 函数，使其搜索字符串数组而不是 `int` 数组。使用驱动程序测试该函数。（二分搜索之前必须对数组进行排序。）\n\
  \n## 8. 搜索基准\n\n编写一个程序，在数组中按升序存储至少 20 个整数。它应调用一个使用线性查找算法来定位其中一个值的函数。该函数应计数找到该值之前的比较次数。程序随后应调用一个使用二分查找算法来定位相同的值。它也应该计数比较次数。在屏幕上显示这两个计数。\n\
  \n## 9. 降序排序基准\n\n编写一个程序，使用两个包含至少 20 个随机整数的相同数组。它应调用一个使用改进冒泡排序算法对其中一个数组进行降序排序。该函数应计算交换次数。程序随后应调用一个使用改进选择排序算法对另一个数组进行降序排序。它也应该计算交换次数。在屏幕上显示排序数据以及这两个标记清晰的计数。\n\
  \n## 10. 排序顺序\n\n编写一个程序，使用两个包含八个随机整数的相同数组。它应该显示第一个数组的内容，然后调用一个函数使用升序冒泡排序对其进行排序，并在每轮通过后打印数组内容。接下来程序应显示第二个数组的内容，然后调用一个函数使用升序选择排序对其进行排序，并在每轮通过后打印数组内容。\n\
  \n## 11. 升序圆\n\n\n\n\n\n# [第 8 章]中的程序 8-31 创建了一个包含四个 `Circle` 对象的数组，然后显示每个对象的面积。以该程序为起点，对其进行修改，创建一个包含七个\
  \ `Circle` 对象的数组，并用以下半径初始化：2.5, 4.0, 1.0, 3.0, 6.0, 5.5, 2.0。然后使用冒泡排序按半径大小从小到大的顺序对对象进行排序，最后显示每个对象的半径和面积。\n\
  \n## 12. 修改后的 BinManager 类\n\n修改你在[第 8 章]的编程挑战 18 中编写的 `BinManager` 类，如下所示重载其 `getQuantity`、`addParts`\
  \ 和 `removeParts` 函数：\n\n```\nbool addParts(string itemDescription, int q);\nbool\
  \ removeParts(string itemDescription, int q)\nint getQuantity(string itemDescription);\n\
  ```\n\n这些新函数允许通过使用 `item description`（物品描述）而不是箱号作为参数来添加零件、移除零件以及检索特定物品的库存数量。除了编写这三个重载函数外，你还需要创建一个\
  \ `private BinManager` 类函数，该函数使用物品描述作为搜索键来定位所需箱箱的索引。\n\n使用你在[第 8 章]的编程挑战 15 中编写的相同客户端程序测试新类函数，并对其进行修改以调用新函数。确保使用一些与数组中的箱匹配的描述，以及一些不匹配的描述。\n\
  \n就像你在之前的 Bin Manager 程序中所做的那样，如果成功执行添加或删除操作，让函数返回 `true`。如果无法执行（例如传递给它的字符串与数组中的任何物品描述都不匹配），让函数返回\
  \ `false`。如果 `getQuantity` 函数无法找到与传入描述匹配的物品，则让其返回 -1。\n\n## 13. 使用文件——生日列表\n\n编写一个程序，生成按日期顺序排列的名称和生日列表。它应该使用一个包含\
  \ 10 个元素的结构体或类对象数组，每个元素包含两个字符串变量：`name` 和 `birthday`。该程序应通过从书籍配套网站上[第 9 章]程序文件夹中的\
  \ `birthdays.dat` 文件读取数据来填充数组元素。该文件包含 20 行，每行一个人的姓名，下一行是其 mm/dd 格式的生日。一旦数据被读取并存储，程序应按日期从小到大的顺序对元素进行排序，并显示生日列表。使程序具有模块化，由\
  \ `main` 调用不同的函数来读取文件数据、执行排序、交换两个元素并显示列表。\n\n## 14. 使用文件——生日查询\n\n修改你在[第 8 章]的编程挑战\
  \ 13 中编写的程序，使其在从 `birthdays.dat` 文件读取数据后，按 `name` 字段对数组元素进行字母顺序排序，然后打印名称，并提示用户输入他们想要查找生日的人的姓名。然后它应该定位并显示该人的生日。\n\
  \n## 15. 使用文件——字符串选择排序的修改\n\n修改你在[第 8 章]的编程挑战 6 中编写的程序，使其从文件中读取 20 个字符串。数据可以在书籍配套网站上[第\
  \ 9 章]程序文件夹中的 `names.dat` 文件中找到。\n\n## 16. 使用 Vector——字符串排序的修改\n\n修改你在[第 8 章]的编程挑战\
  \ 15 中编写的程序，使其将名称存储在 `vector<string>` 中，而不是字符串数组中。创建 vector 时不指定大小，然后使用 `push_back`\
  \ 成员函数在从文件中读取字符串时将持有每个字符串的元素添加到 vector 中。不要假设总有 20 个字符串，而是不断读取字符串并将它们添加到 vector，直到文件中没有数据为止。数据可以在\
  \ `names.dat` 文件中找到。\n\n# 第 10 章 指针\n\n## 10.1 指针与地址运算符\n\n### 概念\n每个变量都分配了一个内存位置，该地址可以使用运算符\
  \ `&` 获取。内存位置的地址称为指针。执行程序中的每个变量都分配了足够大的内存区域，以容纳该变量类型的值。目前在 PC 上的 C++ 编译器通常为 `char`\
  \ 类型变量分配 1 字节，为 `short` 类型变量分配 2 字节，为 `float` 和 `long` 类型变量分配 4 字节，为 `double` 类型变量分配\
  \ 8 字节。\n\n每个内存字节都有唯一的地址。变量的地址是分配给该变量的第一个字节的地址。假设程序中定义了以下变量：\n\n```\nchar letter;\n\
  short number;\nfloat amount;\n```\n\n[图 10-1] 说明了它们在内存中的排列方式并显示了它们的地址。\n\n### 图\
  \ 10-1 变量及其地址\n![一个内存存储显示了 7 个矩形。](img/FG_10_001.png)\n在[图 10-1]中，变量 `letter` 显示在地址\
  \ 1200，`number` 位于地址 1201，`amount` 位于地址 1203。\n\n[图 10-1] 中所示变量地址是任意的，仅用于说明目的。事实上，大多数编译器分配空间的方式使得单个变量被分配偶数地址。这是因为目前的计算机硬件访问位于偶数地址的数据比访问位于奇数地址的数据要快。\n\
  \nC++ 有一个地址运算符 `&`，用于获取任何变量的地址。使用它时，将其放在你想获取的变量之前。这里有一个返回 `amount` 地址的表达式：\n\n```\n\
  &amount\n```\n\n这里有一个是将变量地址显示到屏幕上的语句：\n\n```\ncout << long(&amount);\n```\n\n默认情况下，C++\
  \ 以十六进制打印地址。在这里我们使用了函数式强制转换为 `long`，以便以通常的十进制格式打印地址。[程序 10-1]演示了使用地址运算符显示变量地址。\n\
  \n值 `&amount` 指定了变量 `amount` 在内存中的位置：在某种意义上，它指向 `amount`。代表内存位置的值或持有某些变量地址的值称为指针。\n\
  \n## 10.2 指针变量\n\n### 概念\n指针变量是存储内存地址的变量。\n\n与其他其他数据值一样，内存地址或指针值也可以存储在相应类型的变量中。存储地址的变量被称为指针变量，但通常被简单称为指针。指针变量的定义（例如\
  \ `ptr`）必须指定 `ptr` 将指向的数据类型。这里有一个示例：\n\n```\nint *ptr;\n```\n\n\n\n\n\n变量名前的星号表示\
  \ `ptr` 是一个指针变量，而 `int` 数据类型表示 `ptr` 只能用于指向或持有整数变量的地址。这个定义可以读作“`ptr` 是一个指向 `int`\
  \ 的指针”。将 `ptr` 视为“`ptr` 所指向的变量”也是很有用的。从这个观点来看，刚才 `ptr` 的定义可以读作“`ptr` 所指向的变量类型为 `int`”。因为星号（`*`）允许你从指针跳转到所指向的变量，因此它被称为间接操作符。\n\
  \n有些程序员倾向于将星号放在类型名旁边声明指针，而不是变量名旁边。例如，上面的声明可以写成：\n\n```\nint* ptr;\n```\n\n这种声明风格可能在视觉上强化\
  \ `ptr` 的数据类型不是 `int` 而是指向 `int` 的指针这一事实。两种声明方式都是正确的。\n\n程序 10-2 展示了指针的一个非常简单的用法：存储并打印另一个变量的地址。\n\
  \n在 程序 10-2 中，定义了两个变量：`x` 和 `ptr`。变量 `x` 是一个 `int`，而 `ptr` 是一个指向 `int` 的指针。变量 `x`\
  \ 初始化为 `25`，而通过以下语句将 `x` 的地址赋值给 `ptr`：\n\n```\nptr = &x;\n```\n\n图 10-2 阐说明了 `ptr`\
  \ 和 `x` 之间的关系。\n\n## 图 10-2 指向变量的指针\n\n![图表显示了一个标记为“x”的矩形。矩形显示数字 25。注释写道“x 的地址:\
  \ 0x7e00”。图表显示了另一个标记为“ptr”的矩形。它显示“0x7e00”。从这个矩形出的箭头指向标记为“x”的矩形。](img/FG_10_002.png)\n\
  \n如 图 10-2 所示，变量 `x` 位于内存地址 `0x7e00` 并包含数字 `25`，而指针 `ptr` 包含地址 `0x7e00`。本质上，`ptr`\
  \ “指向”变量 `x`。\n\n你可以使用指针来间接访问和修改所指向的变量。例如，在 程序 10-2 中，可以使用 `ptr` 来改变变量 `x` 的内容。当间接操作符放在指针变量名之前时，它会对指针进行解引用（`dereferences`）。当你处理一个解引用的指针时，你实际上是在处理指针所指向的值。这在\
  \ 程序 10-3 中得到了证明。\n\n每当表达式 `*ptr` 出现在 程序 10-3 中时，程序都会间接使用变量 `x`。接下来的 `cout` 语句显示两次\
  \ `x` 中的值：\n\n```\ncout ≪ x ≪ \" \" ≪ *ptr ≪ endl;\n```\n\n接下来的语句将 100 存储在 `x` 中：\n\
  \n```\n*ptr = 100;\n```\n\n通过间接操作符，`ptr` 可用于间接访问它所指向的变量。程序 10-4 展示了指针可以间接访问其所指向的变量。\n\
  \n### 注意\n到目前为止你已经看到了星号的三种不同用法：\n\n- 作为乘法操作符出现在语句中：\n```\ndistance = speed * time;\n\
  ```\n- 在指针的定义中：\n```\nint *ptr;\n```\n- 作为间接操作符出现在语句中：\n```\n*ptr = 100;\n```\n\n\
  ## 10.3 数组与指针之间的关系\n\n### 概念\n数组名可以作为指针常量，指针可以作为数组名。你之前了解到不带括号和下标的数组名实际上代表数组的起始地址。程序\
  \ 10-5 通过显示使用间接操作符的数组名说明了这一点。\n\n由于 `numbers` 表现类似于指向数组起始地址的指针 程序 10-5，当 `numbers`\
  \ 被解引用时，获取的是第一个元素。那么，如何使用间接操作符获取数组的整个内容？记住，数组元素在内存中是连续存储的，如 图 10-3 所示。\n\n### 图\
  \ 10-3 数组元素存储在连续内存中\n![存储显示了一个包含 5 个矩形的数组，下标从“numbers[0]”到“numbers[4]”。每个矩形由一条虚线划分。第一个矩形旁边的注释写着“numbers”。](images/FG_10_003.png)\n\
  \n如果 `numbers` 是 `numbers[0]` 的地址，那么向 `numbers` 加值以获取数组中其他元素的地址是合理的。然而，重要的是，指针在数学语句中使用并不像普通变量。在\
  \ C++ 中，当你向指针加上一个值时，你实际上是在加上该值乘以指针所引的数据类型。换句话说，如果你向 `numbers` 加 1，你实际上是在加上 `1 *\
  \ sizeof(short)`。如果你向 `numbers` 加 2，结果是 `numbers + 2 * sizeof(short)`，依此类推。在 PC\
  \ 上，由于内容是正确的，因为 `short` 整数通常使用 2 字节：\n\n```\n*(numbers + 1) 是地址 numbers + 1 * 2\
  \ 处的值\n*(numbers + 2) 是地址 numbers + 2 * 2 处的值\n*(numbers + 3) 是地址 numbers + 3 *\
  \ 2 处的值\n```\n\n以及此类推。这种自动转换意味着可以通过下标或通过指针加上下标来获取数组中的元素。如果表达式 `*numbers`（同于 `*(numbers\
  \ + 0)`）获取的是数组中的第一个元素，那么 `*(numbers + 1)` 获取的就是第二个元素。同样，`*(numbers + 2)` 获取第三个元素，依此类推。图\
  \ 10-4 显示了下标法和指针法的等效性。\n\n### 图 10-4 下标法与指针法\n![存储显示了一个包含 5 个矩形的数组，下标从“numbers[0]”到“numbers[4]”。](images/FG_10_004.png)图\
  \ 10-4 完整替代文本\n\n### 注意 在向指针加上值时，括号至关重要。`*` 运算符的优先级高于 `+` 运算符，因此表达式 `*numbers +\
  \ 1` 不等于 `*(numbers + 1)`。表达式 `*numbers + 1` 是给数组第一个元素的内容加 1，而 `*(numbers + 1)`\
  \ 是给 `numbers` 中的地址加 1，然后对其进行解引用。\n\n程序 10-6 展示了使用指针法访问数组的全部内容。\n\n在处理数组时，请记住以下规则：\n\
  \n```\narray[index] 等同于 *(array + index)\n```\n\n### 警告！\n记住 C++ 对数组不进行边界检查。在使用指针遍历数组时，可能会给指针一个数组范围之外的地址。\n\
  \n\n\n\n为了演示数组名与指针之间的关系有多紧密，请查看程序 10-7。它定义了一个 `double` 数组和一个 `double` 指针，该指针被赋值为数组的起始地址。这里不仅对数组名使用了指针表示法，甚至对指针也使用了下标表示法！\n\
  \n注意，当将数组的地址赋值给指针时，不需要地址操作符。由于数组名本身就是一个地址，使用 `&` 操作符是错误的。然而，你可以使用地址操作符来获取数组中单个元素的地址。例如，`&numbers[1]`\
  \ 获取 `numbers[1]` 的地址。这种技术用于程序 10-8。\n\n数组名与指针变量唯一的区别在于，你不能改变数组名所指向的地址。例如，给定以下定义：\n\
  \n```\n double readings[20], totals[20];\ndouble *dptr;\n```\n\n这些语句是合法的：\n\n```\n\
  \ dptr = readings; // 让 dptr 指向 readings\ndptr = totals;   // 让 dptr 指向 totals\n\
  ```\n\n但这些是非法的：\n\n```\n readings = totals; // 非法！不能更改 readings\ntotals = dptr;\
  \     // 非法！不能更改 totals\n```\n\n数组名是`指针常量`。你不能让它们指向其代表的数组以外的任何地方。\n\n# 10.4 指针算术\n\
  \n### 概念\n\n指针可以通过加或减整数值来修改。\n\n指针变量的内容可以通过执行加或减法的数学语句来改变。这在程序 10-9 中得到了演示。第一个循环增加指针变量，使其遍历数组的每个元素。第二个循环递减指针，使其反向遍历数组。\n\
  \n### 注意\n\n由于 `numPtr` 是一个指针，递增运算符会向 `numPtr` 添加一个整数的大小，因此它指向数组中的下一个元素。同样，递减运算符会从指针中减去一个整数的大小。\n\
  \n并不是所有的算术操作都可以在指针上执行。例如，你不能对指针使用乘法或除法。以下操作是允许的：\n\n* 可以 `++` 和 `--` 运算符增加或递减指针变量。\n\
  * 指针变量可以加或减一个整数。这可以通过 `+` 和 `-=` 运算符来实现。\n* 一个指针可以与另一个指针相减。\n\n## 10.5 初始化指针\n\n\
  ### 概念\n\n指针可以使用现有对象的地址进行初始化。\n\n记住，指针被设计用于指向特定数据类型的对象。当指针用地址初始化时，该地址必须是指针可以指向的对象的地址。例如，以下\
  \ `pint` 的定义是合法的，因为 `myValue` 是一个整数：\n\n```\n int myValue;\nint *pint = &myValue;\n\
  ```\n\n以下也是合法的，因为 `ages` 是一个整数数组：\n\n```\n int ages[20];\nint *pint = ages;\n```\n\
  \n但以下 `pint` 的定义是非法的，因为 `myFloat` 不是 `int`：\n\n```\n float myFloat;\nint *pint =\
  \ &myFloat; \t// 非法！ \n```\n\n指针可以与其他相同类型的变量在同一语句中定义。以下声明定义了一个整数变量 `myValue`，然后定义了一个指针\
  \ `pint`，该指针用 `myValue` 的地址初始化：\n\n```\n int myValue, *pint = &myValue;\n```\n\n\
  以下定义定义了一个数组 `readings` 和一个指针 `marker`，该指针用数组中第一个元素的地址初始化：\n\n```\n double readings[50],\
  \ *marker = readings;\n```\n\n当然，指针只能用已经定义的对象的地址进行初始化。以下是非法的，因为 `pint` 正在用一个尚不存在对象的地址初始化：\n\
  \n```\n int *pint = &myValue;\t// 非法！\nint myValue;\n```\n\n未初始化的本地指针变量不持有有效地址，尝试使用此类指针将导致运行时错误。C++\
  \ 旧版本的惯例是将地址 0 赋值给当前未指向有效内存位置的指针：\n\n```\n int *ptrToint = 0;\ndouble *ptrToDouble\
  \ = 0;\n```\n\n在许多计算机中，地址 0 被操作系统数据占用，用户程序无法访问。许多头文件包括 `iostream`、`fstream` 和 `cstdlib`\
  \ 定义了一个名为 `NULL` 的常量来表示 0。\n\n\n\n\n4. `pint *= 4;`\n5. `pint += x; // Assume x\
  \ 是一个 int.`\n\n### 10.8 对于以下每个变量定义，确定该语句是有效还是无效。对于无效的，请解释原因。\n\n1. `int ivar;`\n\
  \   ```\n   int *iptr = &ivar;\n   ```\n2. `int ivar, *iptr = &ivar;`\n3. `float\
  \ fvar;`\n   ```\n   int *iptr = &fvar;\n   ```\n4. `int nums[50], *iptr = nums;`\n\
  5. `int *iptr = &ivar;`\n   `int ivar;`\n\n## 10.6 指针比较\n\n### 概念\n\nC++ 的关系运算符可以用于比较指针值。\n\
  \n可以使用 C++ 的任何关系运算符对指针进行比较：\n\n```\n > < == != >= <=\n```\n\n如果一个地址在内存中位于另一个地址之前，则第一个地址被认为“小于”第二个地址。在数组中，所有元素都存储在连续的内存位置上，因此元素\
  \ 1 的地址大于元素 0 的地址。这在图 10-5 中于说明。\n\n# 图 10-5 数组元素的地址\n\n![图表显示了 5 个整数的数组存储情况。](img/FG_10_005.png)\
  \ 图 10-5 完整备用文本\n\n由于数组中后续每个元素的地址变大，以下布尔表达式全部为真：\n\n```\n &array[1] > &array[0]\n\
  array < &array[4]\narray == &array[0]\n&array[2] != &array[3]\n```\n\n### 注意\n\n\
  比较两个指针并不等同于比较这两个指针所指向的值。例如，以下 `if` 语句比较了指针变量 `ptr1` 和 `ptr2` 中存储的地址：\n\n```\n if\
  \ (ptr1 < ptr2)\n```\n\n然而，以下语句比较的是 `ptr1` 和 `ptr2` 所指向的值：\n\n```\n if (*ptr1 <\
  \ *ptr2)\n```\n\n比较地址的能力为您提供了另一种方法来确保指针不会超出数组的边界。程序 10-10 将指针 `numPtr` 初始化为数组 `numbers`\
  \ 的起始地址。然后指针 `numPtr` 遍历数组，直到它包含的地址等于数组最后一个元素的地址。然后，指针反向遍历数组，直到它指向第一个元素。\n\n大多数涉及指针的比较都是将指针与\
  \ `0、NULL 或 nullptr` 进行比较，以确定指针是否指向一个合法地址。例如，假设 `ptrToInt` 已定义为指向 `int` 的指针，则代码：\n\
  \n```\n if  (ptrToInt != nullptr)\n    cout ≪ *ptrToInt;\nelse\n    cout ≪ \"null\
  \ pointer\";\n```\n\n只有在验证 `ptrToInt` 不是空指针后，才会打印该指针指向的整数。\n\n# 10.7 作为函数参数的指针\n\
  \n### 概念\n\n指针可以用作函数参数。它让函数访问原始参数的权限，就像引用参数一样。\n\n在第 6 章中，你学习了将引用变量用作函数参数的概念。引用变量充当原始变量的别名。这使得函数能够访问原始参数变量，允许它更改变量的内容。当变量传递给引用参数时，该参数被称为按引用传递。\n\
  \n按引用传递参数的替代方案是使用指针变量作为参数。诚然，引用变量比指针更容易处理。引用变量隐藏了所有解引用和间接访问的“机制”。然而，你仍然应该学习使用指针作为函数参数，因为某些任务（特别是在处理\
  \ C 字符串时）用指针完成效果最好。⁵ 此外，C++ 库中有许多函数使用指针作为参数。\n\n以下是一个使用指针参数的函数定义：\n\n```\n void\
  \ doubleValue(int *val)\n{\n   *val *= 2;\n}\n```\n\n该函数的目的是通过以下语句使 `val` 所指向的变量翻倍：\n\
  \n```\n *val *= 2;\n```\n\n当 `val` 被解引用时，`*=` 运算符作用于 `val` 指向的变量。该语句将地址存储在 `val`\
  \ 中的原始变量乘以 2。当然，当调用函数时，必须使用要翻倍的变量的地址作为参数，而不是变量本身。\n\n以下是调用 `doubleValue` 函数的示例：\n\
  \n```\n doubleValue(&number)\n```\n\n\n\n```\n const int SIZE = 6;\nconst double\
  \ payRates[SIZE] = { 18.55, 17.45,\n\t\t\t\t12.85, 14.97,\n\t\t\t\t10.35, 18.89\
  \ };\n```\n\n在这段代码中，`payRates` 是一个 `const` 类型 `double` 数组。这意味着数组中的每个元素都是一个 `const\
  \ double`，编译器不允许我们编写更改数组内容的代码。如果我们想将 `payRates` 数组传递给指针参数，该参数必须声明为指向 `const double`\
  \ 的指针。下面的函数展示了这样一个示例：\n\n```\n void displayPayRates(const double *rates, int size)\n\
  {\n   // 设置数值输出格式\n   cout ≪ setprecision(2) ≪ fixed ≪ showpoint;\n\n   // 显示所有的薪资率\n\
  \   for (int count = 0; count < size; count++)\n   {\n   \tcout ≪ \"Pay rate for\
  \ employee \" ≪ (count + 1)\n\t     ≪ \" is $\" ≪ *(rates + count) ≪ endl;\n   }\n\
  }\n```\n\n在函数头中，注意 `rates` 参数被定义为指向 `const` `double` 的指针。需要注意的是，`const` 词作用于 `rates`\
  \ 所指向的内容，而不是 `rates` 本身。这在图 10-6 中所示。\n\n## 图 10-6 指向持有常量的内存的指针\n\n![图像显示了文本“const\
  \ double asterisk symbol rates。”const double 旁边的注释写着“这是 rates 指向的内容”。星号符号旁边的另一个注释写着“星号表示\
  \ rates 是一个指针”。](img/FG_10_006.png)\n\n由于 `rates` 是指向 `const` 的指针，编译器不允许我们编写更改 `rates`\
  \ 所指向的内容的代码。\n\n当将常量的地址传递指针变量时，该变量必须定义为指向常量的指针。如果在 `rates` 参数的定义中漏掉了 `const` 词，将导致编译错误。\n\
  \n## 将非常量参数传递指向常量的指针\n\n虽然常量的地址只能传递给指向 `const` 的指针，但指向 `const` 的指针也可以接收非常量项的地址。例如，查看程序\
  \ 10-13。\n\n## 注意事项\n\n在编写使用指针参数的函数时，如果该函数不需要更改参数所指向的数据，那么将参数设为指向 `const` 的指针始终是一个好主意。这不仅可以防止你在函数中无意中更改参数，而且函数还能够接受常量参数和非常量参数的地址。\n\
  \n## 常量指针\n\n在上一节中，我们讨论了指向 `const` 的指针，即指向 `const` 数据的指针。你也可以使用 `const` 关键字来定义常量指针。以下是指向\
  \ `const` 的指针与 `const` 指针之间的区别：\n\n*   指向 `const` 的指针指向一个常量项。指针指向的数据不能改变，但指针本身可以改变。\n\
  *   对于 `const` 指针，指针本身是常量。一旦指针用地址初始化，它就不能指向任何其他地方。\n\n下面的代码展示了一个 `const` 指针的示例。\n\
  \n```\n int value = 22;\nint * const ptr = &value;\n```\n\n注意 `ptr` 的定义中，`const`\
  \ 词出现在星号之后。这意味着 `ptr` 是一个 `const` 指针。这在图 10-7 中所示。在代码中，`ptr` 用变量 `value` 的地址初始化。由于\
  \ `ptr` 是常量指针，如果我们编写让 `ptr` 指向任何其他地方的代码，将导致编译错误。然而，如果我们使用 `ptr` 来更改 `value` 的内容，则不会产生错误。因为\
  \ `value` 不是常量，且 `ptr` 也指向 `const` 的指针。\n\n## 图 10-7 常量指针\n\n![图像显示了文本“int asterisk\
  \ const ptr。”int 旁边的注释写着“这是 ptr 指向的内容。”星号 const 旁边的另一个注释写着“星号符号 const 表示 ptr 是一个常量指针。”](img/FG_10_007.png)\n\
  \n常量指针必须用初始值进行初始化，如前面的示例代码所示。如果将常量指针作为函数参数，编译器不允许我们编写更改 `rates` 所指向的内容的代码。\n\n\n\
  \n但当你不知道需要多少个变量时该怎么办？例如，假设你想写一个测试平均值程序，它可以计算任意数量测试的平均值。显然，这个程序将非常通用，但如果你不知道要定义多少个变量，该如何在内存中存储各个的测试分数呢？简单来说，你可以允许程序“动态地”创建它自己的变量。这被称为*动态内存分配*，只有通过使用指针才能实现。\n\
  \n动态分配内存意味着程序在运行时请求计算机留出一段足够大的未闲内存，以容纳一个特定数据类型的变量。假设一个程序需要创建一个整数变量。它会向计算机请求分配足够数量的字节来用于存储一个\
  \ `int`。当计算机满足该请求时，它会找到并留出一段足够容纳该变量的未闲内存。然后，它会将该块内存的起始地址赋给程序。程序只能通过该地址访问新分配的内存，因此使用这些字节时需要指针。\n\
  \nC++ 程序请求动态分配内存的方式是通过使用 `new` 算符。假设程序有一个定义为指向 `int` 指针的指针：\n\n```cpp\n int *iptr\
  \ = nullptr;\n```\n\n你可以使用 `new` 算符来动态分配一个整数变量，并将新分配变量的地址赋给 `iptr`，如下：\n\n```cpp\n\
  \ iptr = new int;\n```\n\n`new` 算符的操作数是正在创建的变量的数据类型。这在图 10-9 中所示。一旦该语句执行，`iptr`\
  \ 将包含新分配内存的地址。可以通过对指针解引用来在新变量中存储一个值：\n\n```cpp\n *iptr = 25;\n```\n\n# 图 10-9 指向动态分配内存的指针\n\
  \n![图表显示了 10 个等大小的矩形堆叠在一起。](img/FG_10_009.png)图 10-9 完整替代文本\n\n只需使用解引用后的指针，即可在新变量上执行任何其他操作。以下是一些示例语句：\n\
  \n```cpp\n cout ≪ *iptr;\t// 显示新变量的内容。\ncin ≫ *iptr;\t// 让用户输入一个值。\ntotal += *iptr;\t\
  // 在计算中使用新变量。\n```\n\n尽管这些语句说明了 `new` 算符的使用，但动态分配单个变量的意义并不大。`new` 算符更具实用性的用法是动态创建一个数组。这里是如何分配一个包含\
  \ 100 个元素的整数数组的示例：\n\n```cpp\n iptr = new int[100];\n```\n\n一旦数组创建完成，可以使用下标表示法来访问它。例如，可以使用以下循环在每个元素中存储值\
  \ 1：\n\n```cpp\n for (int count = 0; count < 100; count++)\n   iptr[count] = 1;\n\
  ```\n\n每次调用 `new` 都会从程序内存中一个称为*堆*（heap）的特殊区域分配存储空间。如果程序发起了大量的动态内存请求，堆最终将变得耗尽，额外的\
  \ `new` 调用将失败。当这种情况发生时，C++ 运行时系统将*抛出* `bad_alloc` 异常，以通知调用程序请求的内存无法分配。*异常*（exception）是一种用于通知程序正在执行的操作发生了严重错误，且该操作的结果不可信的机制。异常的默认操作是强制执行执行的程序终止。\n\
  \n完成使用动态分配内存块的程序应该*释放*该内存并将其返回堆，以便供以后使用。这是通过调用 `delete` 算符并将要去分配的内存地址传递给它来实现的。在\
  \ `delete` 完成后，应将指针的值设置为 `nullptr`，以表示它不再有效。该规则的唯一例外是：某些情况下（例如在程序结束时），可以明显看出被删除的指针将永远不再再次使用。这里是使用\
  \ `delete` 释放由 `iptr` 指向的单个变量的示例：\n\n```cpp\n delete iptr;\niptr = nullptr;\n```\n\
  \n如果 `iptr` 指向一个动态分配的数组，则在 `delete` 和 `iptr` 之间必须放置一对括号：\n\n```cpp\n delete [] iptr;\n\
  iptr = nullptr;\n```\n\n除非指针即将超出作用范围，否则在对它调用 `delete` 后立即将其值设置为 `nullptr` 是一种良好的做法。这会让程序的其余部分清楚该指针不再指向一个有效的内存位置。它还避免了对同一个指针多次调用\
  \ `delete` 可能产生的问题。这是因为 `delete` 被设计为在对空指针调用时什么什么都不做。\n\n# 悬空指针和内存泄漏\n\n如果指针指向一个已通过调用\
  \ `delete` 释放的内存位置，则称该指针为*悬空*（dangling）。当你访问悬空指针时，你正在尝试使用已经释放并返回堆的内存。事实上，这种内存可能已经被另一个\
  \ `new` 调用重新分配。你可以通过以下方式避免使用悬空指针：\n\n1.  释放内存后立即将指针置为空；\n2.  在尝试访问指针之前验证其是否不空。\n\
  \n如果你在完成使用 `new` 分配的内存块后，忘记通过 `delete` 释放它，则你的程序发生了*内存泄漏*（memory leak）。该块内存在程序终止之前一直无法使用。内存泄漏发生在循环中时尤为严重。对于预计运行数月或数年的程序（如\
  \ Web 服务器），内存泄漏更为严重。随着时间的推移，带有内存泄漏的 Web 服务器将耗尽运行它的计算机的所有内存，导致必须关闭并重启。\n\n### 警告！\n\
  \n仅对之前使用过 `new` 的指针使用 `delete`。如果你对未引用动态分配内存的指针使用 `delete`，可能会导致意外问题！\n\n程序 10-14\
  \ 演示了 `new` 和 `delete` 的使用。它请求任意天数的销售金额。这些金额存储在动态分配的数组中，然后计算总和和平均值。\n\n第 23 行的语句为\
  \ `double` 数组动态分配内存，使用 `numDays` 的值作为元素数量。`new` 算符返回分配内存的起始地址并将并将地址赋给 `sales` 指针变量。随后，`sales`\
  \ 变量在整个程序中被用于存储数组中的销售金额并进行必要的计算。在第 48 行，使用 `delete` 算符释放分配的内存。\n\n# 10.10 从函数返回指针\n\
  \n### 概念\n\n函数可以返回指针，但你必须确保指针引用的项仍然存在。\n\n让函数动态为对象分配存储空间，为对象填充数据并返回其地址通常非常有用。考虑一个为给定的正整数\
  \ *n* 返回前 *n* 个整数平方的函数。例如，如果给函数传递值 4，它将返回一个元素为 1, 4, 9 和 16 的数组。\n\n当调用时，函数分配一个指定大小的数组，将元素设置为所需的值，并返回数组基地址的地址。\n\
  \n\n\n\n```cpp\n int *squares(int n)\n{\n   // 分配一个大小为 n 的数组\n   int *sqarray =\
  \ new int[n];\n   // 用平方填充数组\n   for (int k = 0; k < n; k++)\n   \tsqarray[k] =\
  \ (k+1) * (k+1);\n   // 返回分配数组的起始地址\n   return sqarray;\n}\n```\n\n程序 10-15 展示了另一个例子。该程序包含一个返回随机数数组指针的函数。该函数接受一个整数大小，动态分配一个给定大小的数组，然后用随机值填充该数组。该函数使用系统时钟作为随机数生成器的种子。注意，包含随机数的数组只有在`main`\
  \ 函数完成对它的处理*之后*才被删除。\n\n函数可以安全地返回尚未删除的动态分配存储的指针。相比之下，函数不应返回局部变量的指针，因为这些变量的存储在返回时会被自动释放。考虑以下函数，它返回一个局部数组的地址：\n\
  \n```cpp\n int *errSquares(int n)\n{\n\t// 假设 n 小于 100，使用局部数组\n\tint array[100];\n\
  \n\t// 用平方填充数组\n\tfor (int k = 0; k < n; k++)\n\t\tarray[k] = (k+1) * (k+1);\n\n\
  \t// 返回局部数组的起始地址\n\treturn array;\n}\n```\n\n如下调用：\n\n```cpp\n int * arr = errSquares(5);\n\
  ```\n\n将返回一个已经释放的数组的地址。尝试访问此类数组的元素，例如：\n\n```cpp\n cout ≪ arr[0];\n```\n\n将导致对不存在的存储的引用并引发错误。\n\
  \n### 注意\n\n静态局部变量的存储在返回时不会释放，因此返回指向此类变量指针的函数不会触发我们正在讨论的这类错误。然而，这样的函数可能会导致其他类型的错误，这些讨论超出了本书的范围。\n\
  \n# 停止内存泄漏\n\n对于使用动态分配内存的程序来说，确保每次 `new` 调用都都有对应的 `delete` 调用是重要的，后者会释放分配的内存并将其归堆。未能做到的程序将遭受内存泄漏，这种情况是指程序丢失对动态分配存储的跟踪，因此永远不会调用\
  \ `delete` 来释放内存。在尝试避免内存泄漏时，有两个经验法则非常有帮助：\n\n- 只要可能，调用 `new` 分配存储的函数也应该是调用 `delete`\
  \ 释放存储的函数。\n- 需要动态分配存储的类应该在它的构造函数中调用 `new`，并在它的析构函数中调用相应的 `delete`。因为每当对象被删除或超出范围时，系统会自动调用析构函数，所以放置在析构函数中的\
  \ `delete` 语句将始终被调用。\n\n通过尽可能遵循这些规则，你将始终能够找到与特定 `new` 调用对应的 `delete` 操作，从而验证特定的\
  \ `new` 调用不会导致内存泄漏。程序 10-16 是遵循这些规则的程序示例。注意 `Squares` 类在它的构造函数中分配了动态内存，并在析构函数中有一个\
  \ `delete` 语句。此外，`Squares` 对象的内存分配（第 57 行）及其随后的删除（第 61 行）位于同一个函数中，即 `main`。程序在策略性位置点缀了输出语句，以显示构造函数和析构函数中的\
  \ `new` 和 `delete` 运算符何时被调用。\n\n## 检查\n\n1. 10.9 假设 `array` 是一个 `int` 数组，以下程序段哪些将显示“True”，哪些将显示“False”？\n\
