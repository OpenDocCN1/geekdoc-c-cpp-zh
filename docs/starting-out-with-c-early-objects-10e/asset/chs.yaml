  \ ASCII 码为 0 的字符。\n\n## 2.11 `bool` 数据类型\n\n### Concept\n\n布尔变量被设置为 `true` 或 `false`。\n\
  \n具有 `true` 或 `false` 值的表达式被称为*布尔*表达式，是为了纪念英国数学家乔治·布尔（1815–1864）。\n\n`bool` 数据类型允许你创建持有\
  \ `true` 或 `false` 值的变量。程序 2-16 演示了 `bool` 变量的定义和使用。尽管看起来它在变量中存储了 *true* 和 *false*\
  \ 单词，但它实际上存储的是 1 或 0。这是因为 `true` 是一个值为 1 的特殊整数变量，而 `false` 是一个值为 0 的特殊整数变量，正如你从程序输出中所看到的。\n\
  \n### Note\n\n注意 `true` 和 `false` 单词周围没有引号。这是因为它们是变量，而不是字符串。注意它们必须全部小写。\n\n## 2.12\
  \ 确定数据类型的大小\n\n### Concept\n\n\n\n\n\n`sizeof` 运算符可以用于确定任何系统上某种数据类型的大小。\n\n第 1 章讨论了\
  \ C++ 语言的可移植性。正如你在本章中所看到的，移植性的问题之一是所有机器上的数据类型缺乏共同的大小。如果你不确定计算机上数据类型的大小，C++ 提供了一种查找它们的方法。\n\
  \n一个名为 `sizeof` 的特殊运算符会报告任何数据类型或变量所用的内存字节数。程序 2-17 说明了它的用法。\n\n数据类型或变量名被放在运算符后的括号内。该运算符“返回”该项目所使用的字节数。该运算符可以使用任何地方可以使用无符号整数的地方，包括数学运算。\n\
  \n## 2.13 关于变量赋值和初始化更多内容\n\n### 概念\n\n变量可以在定义时被赋予一个值。这被称为变量初始化。\n\n正如你已经在许多示例中看到的，一个值通过*赋值语句*存储在变量中。例如，以下语句将值\
  \ 12 复制到变量 `unitsSold` 中。\n\n```\nunitsSold = 12;\n```\n\n正如你所记忆的，`=` 符号被称为*赋值运算符*。运算符对数据执行操作。运算符所处理的数据称为*操作数*。赋值运算符有两个操作数。在上一条语句中，左操作数是变量\
  \ `unitsSold`，右侧操作数是整数字面量 `12`。\n\n重要的是记住，在赋值语句中，C++ 要求接收赋值的变量名必须出现在运算符的左侧。以下语句是错误的。\n\
  \n```\n12 = unitsSold;  // 错误！\n```\n\n在 C++ 术语中，`=` 符号左侧的操作数必须是一个左值（lvalue）。*左值*是标识内存中某个位置的东西，其内容可以被更改，因此可以在那里存储新值。大多数情况下，左值是一个变量名。它之所以被称为左值，是因为它是可能出现在赋值运算符左侧的值。\n\
  \n`=` 符号右侧的操作数必须是一个右值（rvalue）。*右值*是任何具有值的表达式。这可以是一个单独的数字（如 12）、计算结果（如 `4 + 8`）或变量名。赋值语句求值右侧表达式以获取右值的值，然后将其放在由左值标识的内存位置。如果整数变量\
  \ `quantity` 的值为 12，则以下三条语句都将值 12 赋给 `unitsSold` 变量。\n\n```\nunitsSold = 12;\nunitsSold\
  \ = 4 + 8;\nunitsSold = quantity;\n```\n\n你还看到在定义变量时给它们赋值是赋值的。这在程序 2-10 和 2-11 中实现过。当一个值在定义时存储在变量中时，被称为*初始化*。如果在同一条语句中定义了多个变量，可以初始化其中一些而不需要初始化所有的。程序\
  \ 2-18 说明了这一点。\n\n## 使用 `auto` 关键字声明变量\n\n![](img/Cpp11_icon.png) C++ 11 引入了一种定义变量的替代方法，通过使用\
  \ `auto` 关键字和初始化值。这里有一个示例：\n\n```\nauto amount = 100;\n```\n\n注意，变量名前面是关键字 `auto`，而不是数据类型。这告诉编译器从初始化值确定变量的数据类型。在这个示例中，初始化值\
  \ 100 是一个 `int`，因此 `amount` 将是一个 `int` 类型的变量。这里是其他示例：\n\n```\nauto stockCode = 'D';\n\
  auto customerNum = 459L;\n```\n\n变量 `stockCode` 将是一个 `char`。变量 `customerNum` 将是一个\
