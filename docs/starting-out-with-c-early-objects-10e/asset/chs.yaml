  \n### 概念\n\n指针和动态内存分配可以用于类对象和结构。声明类指针与声明任何指针类型相同。例如，如果 `Rectangle` 定义如下：\n\n```cpp\n\
  class Rectangle\n{\n   int width, height;\n};\n```\n\n你可以通过以下代码声明一个 `Rectangle`\
  \ 指针并创建一个 `Rectangle` 对象：\n\n```cpp\n Rectangle *pRect = nullptr; // 指向 Rectangle\
  \ 的指针\nRectangle rect;             // Rectangle 对象\n```\n\n并且你可以如下将 `rect` 的地址赋值给\
  \ `pRect`：\n\n```cpp\n pRect = &rect;\n```\n\n现在，假设你想通过指针 `pRect` 访问 `Rectangle`\
  \ 对象的成员。由于 `*pRect` 是访问 `rect` 的另一种方式，你可能认为表达式\n\n```cpp\n *pRect.width\n```\n\n\
  将访问 `rect.width`，但事实并非如此。原因是点选择符的优先级高于 `*` 运算符，所以 `*pRect.width` 等于 `*(rect.width)`。最后一个表达式是一个类型错误。为了正确操作，你必须使用括号强制先应用间接运算符\
  \ `*`，如下所示：\n\n```cpp\n (*pRect).width\n```\n\n以下语句将正确设置矩形的尺寸为 10 和 20。\n\n```cpp\n\
  \ (*pRect).width = 10;\n(*pRect).height = 20;\n```\n\n\n\n\n结合使用括号、间接操作符和点选择符来通过指针访问类对象的成员，可能会导致难以阅读的表达式。为了解决这个问题，C++\
  \ 提供了*结构指针运算符* `->`，以便在你想要通过指针访问类对象的成员时使用它。它由一个连字符 `-` 和一个大于号 `>` 紧挨着写在一起组成，看起来像一个箭头。使用该运算符，你可以通过以下语句设置矩形的尺寸：\n\
  \n```\n pRect->width = 10;\npRect->height = 20;\n```\n\n可以通过指针调用类对象的成员函数。特别地，如果\
  \ `ptr` 是指向一个具有成员函数 `fun()` 的对象的指针，则可以使用以下两个（等效的）表达式中的任意一个来调用该函数：\n\n```\n (*ptr).fun();\n\
  ptr->fun();\n```\n\n# 类对象的动态分配\n\n动态分配的类对象用于构建和管理高级数据结构的程序中，例如列表（在第 17 节中学习）和二叉树（在第\
  \ 19 节中学习）。`new` 运算符用于分配此类对象的方式与其与其他类型变量的方式相同。例如，以下语句分配了一个单个 `Rectangle` 对象并设置了它的尺寸\n\
  \n```\n pRect = new Rectangle;\npRect->width = 10;\npRect->height = 3;\n```\n\n\
  如果 `Rectangle` 有一个接受两个整数参数的构造函数，那么你可以同时分配对象并调用构造函数：\n\n```\n pRect = new Rectangle(10,\
  \ 30);\n```\n\n[程序 10-17] Illust 了这些概念。\n\n# 作为函数参数的类对象指针\n\n结构和类变量的指针可以作为参数传递给函数。接收指针的函数可以使用它来访问或修改结构体的成员。这在[程序\
  \ 10-18]中所示。\n\n# 10.12 选择对象的成员\n\n有时结构和类包含指针作为成员。例如，以下结构体声明有一个 `int` 指针成员：\n\n\
  ```\n struct GradeInfo\n{\n   string name;     // 学生姓名\n   int *testScores; // 动态分配的数组\n\
  \   double average;  // 测试平均分\n};\n```\n\n记住，结构指针运算符 `->` 用于对指向结构或类对象的指针进行解引用，而不是对结构或类中的成员指针进行解引用。如果程序对示例结构中的\
  \ `testScores` 指针进行解引用，必须使用间接操作符。例如，假设定义了以下变量：\n\n```\n GradeInfo student1;\n```\n\
  \n以下语句将显示 `testScores` 成员所指向的值：\n\n```\n cout << *student1.testScores;\n```\n\n\
  仍然可以定义指向包含指针成员的结构指针。例如，以下语句定义 `stPtr` 为指向 `GradeInfo` 结构的指针：\n\n```\n GradeInfo\
  \ *stPtr;\n```\n\n假设 `stPtr` 指向一个有效的 `GradeInfo` 变量，以下语句将显示其 `testScores` 成员所指向的值：\n\
  \n```\n cout << *stPtr->testScores;\n```\n\n在这一语句中，`*` 运算符对 `stPtr->testScores`\
  \ 进行解引用，而 `->` 运算符对 `stPtr` 进行解引用。记住表达式\n\n```\n stPtr->testScores\n```\n\n等于\n\n\
  ```\n (*stPtr).testScores\n```\n\n所以，表达式\n\n```\n *stPtr->testScores\n```\n\n同于\n\
  \n```\n *(*stPtr).testScores\n```\n\n该表达式的笨拙程度显示了 `->` 运算符的必要性。[表 10-1] 列出了一些使用\
  \ `*`、`->` 和 `.` 运算符的表达式，并描述了它们各自引用的内容。如果你记住选择结构成员的 `->` 和 `.` 运算符的优先级高于解引用运算符 `*`，那么这个表会更容易理解。\n\
  \n# 表 10-1 结构指针的解引用\n\n| 表达式 | 描述 |\n| --- | --- |\n| `s->m` | `s` 是指向结构变量或类对象的指针，`m`\
  \ 是一个成员。该表达式访问 `s` 指向的结构或类对象的 `m` 成员。 |\n| `*a.p` | `a` 是结构变量或类对象，`p`（指针）是 `a` 的一个成员。该表达式访问\
