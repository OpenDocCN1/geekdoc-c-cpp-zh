  \n* 一个名为 `sideUp` 的 `string`。`sideUp` 成员变量将存储“heads”（正面）或“tails”（反面）之一，表示朝上的硬币面。\n\
  \n`Coin` 类应该具有以下成员函数：\n\n* 一个默认构造函数，用于随机确定硬币朝上的面（“heads”或“tails”），并相应初始化 `sideUp`\
