  \n# 第 6 章 函数\n\n## 6.1 模块化编程\n\n### 概念\n\n程序可以被拆分为一组可管理的函数或模块。这被称为模块化编程。\n\n函数是执行特定任务的语句集合。到目前为止，你以两种方式使用了函数：(1)\
  \ 你在你编写的每个程序中创建了一个名为 `main` 的函数，(2) 你调用了如 `pow` 和 `sqrt` 等库函数。在本章中，你将学习如何创建自己的可以像库函数一样使用的函数。\n\
  \n函数通常用于将问题分解成较小的、可管理的片段或模块。与其编写一个包含解决问题所需的所有语句的长函数，不如编写几个较短的函数，每个函数负责解决问题的特定部分。这些小函数然后可以按照所需的顺序执行以解决问题。这种方法有时被称为*分而治之*，因为一个大问题被分成了几个更容易解决的小问题。图\
  \ 6-1 通过比较两个程序说明了这一思想：一个使用包含解决问题所需所有语句的单一模块，另一个将问题划分为一组较小的问题，每个问题由单独的函数处理。\n\n###\
  \ 图 6-1 模块化编程\n\n![截图显示了 2 个程序。](img/FG_06_001.png)图 6-1 完整替代文本\n\n编写函数的另一个原因是它们可以简化程序。如果某个特定任务在程序的多个地方被执行，则可以写一次函数来执行该任务，并在需要时随时执行。使用函数的这种好处是*代码复用*。\n\
  \n## 6.2 定义和调用函数\n\n### 概念\n\n函数调用是一个导致函数执行的语句。函数定义包含了构成函数的语句。在创建函数时，你必须编写以下内容：\n\
  \n| 部分 | |\n| :--- | :--- |\n| 名称 | 每个函数都必须有一个名称。通常情况下，适用于变量名的相同规则。 |\n| 参数列表 |\
  \ 参数列表是传递给函数的变量列表。它被包含在 `()` 中。 |\n| 函数体 | 函数体是执行任务的语句集合。这些语句被包含在大括号 `{}` 中。 |\n\
  | 返回类型 | 函数可以传回一个值。返回类型是传回的值的数据类型。 |\n\n定义中的第一行被称为*函数头*。让我们仔细观察它的部分。首先是函数的返回类型。然后是它的名称。函数头以一组括号结束。如果函数有任何参数，它们将列在这些括号内。然而，即使参数列表为空，也必须包含括号，如图\
  \ 6-2 所示。\n\n### 图 6-2 函数定义\n\n![图像显示了一个函数并解释了它的部分。](img/FG_06_002.png)图 6-2 完整替代文本\n\
  \n# Void 函数\n\n你已经知道函数可以返回一个值。你在书中看到的所有程序中的 `main` 函数都声明为向操作系统返回一个 `int` 值。`return\
  \ 0;` 语句在 `main` 函数执行完毕时返回值 0。\n\n然而，并不是所有函数都需要返回值。某些函数只是执行一个或多个语句然后返回。在 C++ 中，这些被称为*void\
  \ 函数*。这里展示的 `displayMessage` 函数就是一个示例：\n\n```\n void displayMessage()\n{\n  cout\
  \ << \"Hello from the function displayMessage.\\n\";\n}\n```\n\n该函数的名称是 `displayMessage`。这个名称具有描述性，正如函数名应该是的那样。它指示了函数的功能：显示消息。因为函数执行其工作不需要接收任何信息，因此括号内没有列出任何参数。函数的返回类型是\
  \ `void`。这意味着函数在执行完毕返回到调用它的程序部分时不会传回值。因为没有传回值，所以不需要 `return` 语句。当函数中的语句执行完毕并遇到结束函数的右括号时，程序会自动返回。\n\
  \n\n\n\n函数在被调用时会被执行。`main` 函数在程序启动时会被自动调用，但所有其他函数必须通过函数调用语句来执行。当一个函数被调用时，程序会跳转到该函数并执行其体内的语句。让我们来看程序\
  \ 6-1，它包含了两个函数：`main` 和 `displayMessage`。\n\n和所有的 C++ 程序一样，程序从 `main` 开始执行。其他函数只在被调用时才会执行。在程序\
  \ 6-1 中，`displayMessage` 函数是由 `main` 函数第 14 行的语句调用的。\n\n```\ndisplayMessage();\n\
  ```\n\n注意函数调用的形式。它仅仅是函数名后跟一组括号和一个分号。让我们将其与函数头进行比较：\n\n| 函数头 | $$\\overset{\\mspace{90mu}}{\\\
  rightarrow}$$ | `void displayMessage()` |\n\n| 函数调用 | $$\\overset{\\mspace{90mu}}{\\\
  rightarrow}$$ | `displayMessage();` |\n\n函数头是函数定义的一部分。它声明了函数的返回类型、名称和参数列表。它不能以分号结束，因为函数体的定义紧随其后。\n\
  \n函数调用是一个执行该函数的语句，因此它像所有其他 C++ 语句一样以分号结束。注意，函数调用不包含返回类型。\n\n你可能在想程序 6-1 第 6 行的语句是做什么的。它被称为函数原型（function\
  \ prototype），其工作仅仅是让编译器知道程序后面会出现某个函数。注意，它看起来和函数头完全一样，因为它是一条语句，所以以分号结尾。在下一节中，你将学习更多关于函数原型的知识。\n\
  \n现在让我们检查程序 6-1 是如何流转的。它当然从 `main` 函数开始。当遇到对 `displayMessage` 的调用时，程序跳转到该函数并执行其语句。一旦\
  \ `displayMessage` 执行完毕，程序就会跳转回 `main` 函数，并从函数调用之后的行继续执行。这在图 6-3 中有所说明。\n\n# 图 6-3\
  \ 函数调用\n\n![一个程序解释了函数调用。](img/FG_06_003.png)图 6-3 完整备用文本\n\n函数调用语句可以用于控制结构中，如循环、`if`\
  \ 语句和 `switch` 语句。程序 6-2 将 `displayMessage` 函数调用放在循环中。\n\n程序中可以有很多许多函数和函数调用。程序 6-3\
  \ 包含三个函数：`main`、`first` 和 `second`。\n\n在程序 6-3 的第 15 和第 16 行，`main` 函数包含了对 `first`\
  \ 的调用和对 `second` 的调用：\n\n```\nfirst();\nsecond();\n```\n\n每个调用语句都会导致程序跳转到一个函数，并在函数完成后返回\
  \ `main`。图 6-4 说明了程序所经过的路径。\n\n# 图 6-4 程序所经过的路径\n\n![图像显示了代码并解释了程序所经过的路径。](img/FG_06_004.png)图\
  \ 6-4 完整备用文本\n\n函数也可以以分级或分层的方式调用。这由程序 6-4 演示，它包含三个函数：`main`、`deep` 和 `deeper`。\n\
  \n在程序 6-4 中，`main` 只调用了 `deep` 函数。随后，`deep` 调用了 `deeper`。该程序所经过的路径如图 6-5 所示。\n\n\
  # 图 6-5 分层函数调用\n\n![模块化的程序解释了函数调用。](img/FG_06_005.png)图 6-5 完整备用文本\n\n## 检查点\n\n\
  使用以下信息回答问题 6.1–6.6。每个函数内的行号已包含。\n\n程序包含以下函数：\n\n```cpp\n1 void printHeading()\n\
  2 {\n3 cout << \"History of Computers \";\n4 }\n```\n\n程序的 `main` 函数包含以下代码：\n\n\
  ```cpp\n12 for (int count = 0; count < 3; count++)\n13 { printHeading ();\n14 cout\
  \ << \"I called printHeading \";\n15 }\n```\n\n1. 6.1 第 1 行是函数头还是函数调用？\n2. 6.2 第\
  \ 13 行是函数头还是函数调用？\n3. 6.3 `printHeading` 函数被调用了多少次？\n4. 6.4 哪行的代码导致程序离开 `printHeading`\
  \ 函数并返回 `main`？\n5. 6.5 当程序返回 `main` 时，下执行哪行的代码？\n6. 6.6 执行 `main` 的第 12–15 行时，会显示什么？\n\
  \n# 6.3 函数原型\n\n### 概念\n\n函数原型消除了在所有调用之前放置函数定义的需要。\n\n在编译器遇到某个函数的调用之前，它必须已经知道该函数的某些。特别是，它必须知道函数使用的参数数量、每个参数的数据类型以及函数的返回类型。这通常通过包含程序中除\
  \ `main` 之外每个函数的原型来实现。`main` 不需要原型，因为它是程序的起点。\n\n到目前为止在本章看到的函数没有从调用它们的函数接收任何信息，因此它们没有参数。除了\
  \ `main` 之外，它们没有返回任何信息，所以它们的返回类型是 `void`。让我们仔细观察程序 6-1 中 `displayMessage` 函数的原型：\n\
  \n```cpp\nvoid displayMessage();\n```\n\n这个原型看起来和函数头相似，但在结尾有一个分号。这条语句告诉编译器 `displayMessage`\
  \ 函数没有参数且具有 `void` 返回类型，意味着它不返回值。\n\n注意程序 6-1 中 `displayMessage` 函数的原型被放置在 `main`\
  \ 函数上方。如果没有它的原型为编译器提供所需的信息，整个 `displayMessage` 函数定义必须放在 `main` 函数之前才能被调用。程序 6-5\
  \ 修订了程序 6-1 以展示如果如果没有函数原型，它需要如何重组。\n\n\n\n\n一些程序员倾向于使用这种组织方式，并将 `main` 函数放在最后。然而，大多数程序员发现，除了\
  \ `main` 之外的每个函数都使用原型，并将 `main` 放在最前面更容易。当程序有许多调用其他函数的函数时，这种方法特别有用。考虑一下程序 6-4 中如果没有函数原型，包含\
  \ `main`、`deep` 和 `deeper` 的三个函数将如何组织：\n\n*   函数 `deeper` 必须放在第一个，这样 `deep` 才能调用它。\n\
  *   函数 `deep` 必须放在第二个，这样 `main` 才能调用它。\n*   主函数必须放在最后。\n\n当使用函数原型时，实际的函数定义可以按照你喜欢的任何顺序放置。只需将原型放在程序的顶部，紧接在\
  \ `using namespace std` 语句之后，就像我们在程序 6-1 到 6-4 中所做样。这将确保它们位于 `main` 或任何函数的之前。\n\n\
  ### 警告！\n\n你必须将函数定义或函数原型放在所有函数调用之前。否则，程序将无法编译。\n\n# 6.4 向函数传递数据\n\n### 概念\n\n当调用一个函数时，程序可能会向函数发送值。\n\
  \n发送到函数的值被称为*参数（arguments）*。你已经熟悉了如何在函数调用中使用参数。在以下语句中，调用了函数 `pow`，并向其传递了两个参数 `2.0`\
  \ 和 `3.0`：\n\n```\nresult = pow(2.0, 3.0);\n```\n\n`pow` 函数使用传递给它的信息来计算第一个参数的第二个参数幂的值。在这种情况下，它将计算\
  \ `2.0` 的三次方，并返回值 `8.0` 将其存储在 `result` 中。\n\n*参数（parameter）*是一个特殊的变量，用于持有作为参数传递到函数的值。通过使用参数，你可以设计自己接收此类数据的自定义函数。\n\
  \n这里是一个带有参数的函数定义。该参数是 `num`。\n\n```\nvoid displayValue(int num)\n{\n    cout <<\
  \ \"The value is \" << num << endl;\n}\n```\n\n注意，参数变量定义在括号 `(int num)` 内部。因为它被声明为整数，函数\
  \ `displayValue` 可以接受整数值作为参数。程序 6-6 是一个使用此函数的完整程序。\n\n注意第 6 行中 `displayValue` 的函数原型：\n\
  \n```\nvoid displayValue(int num);      // Function prototype\n```\n\n它列出了函数参数变量的数据类型和名称。然而，实际上没有在括号内列出参数变量的名称。只需要变量的数据类型。函数原型可以写成这样：\n\
