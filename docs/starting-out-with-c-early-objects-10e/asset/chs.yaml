  \ `long`。\n\n## 2.15 算术运算符\n\n### 概念\n\nC++ 有许多用于算术运算的运算符。通常有三种：一元、二元和三元。\n\n*一元运算符*只需要一个单独的操作数。例如，考虑表达式\
  \ `-5`。当然，这代表负值。减号在这样用时，被称为*取反运算符*。因为只需要一个操作数，所以它是一个一元运算符。\n\n*二元运算符*处理两个操作数。这是最常见的运算符类型。正如你可能猜的的，*三元运算符*需要三个操作数。C++\
  \ 只有一个三元运算符，将在第 4 章中讨论。\n\n算术运算在编程中频繁发生。表 2-10 展示了 C++ 中常见的算术运算符。所有都是二元运算符。\n\n\
  ### 表 2-10 基础算术运算符\n\n| 运算符 | 含义 | 示例 |\n\n| --- | --- | --- |\n| `+` | 加法 | `total\
  \ = cost + tax;` |\n| `–` | 减法 | `cost = total - tax;` |\n| `*` | 乘法 | `tax = cost\
  \ * rate;` |\n| `/` | 除法 | `salePrice = original / 2;` |\n| `%` | 取模 | `remainder\
  \ = value % 3;` |\n\n这里是这些运算符如何工作的示例。\n\n*加法运算符*返回两个操作数的和。\n\n```\ntotal = 4 + 8;\
  \     // total 被赋值为 12\n```\n\n*减法运算符*返回左侧操作数减去右侧操作数的值。\n\n```\ncandyBars = 8 -\
  \ 3;     // candyBars 被赋值为 5\n```\n\n*乘法运算符*返回两个操作数的积。\n\n\n\n\n\n```\npoints =\
  \ 3 * 7;     // points 被赋值为值 21\n```\n\n`division operator` 返回其左操作数除以其右操作数的商。\n\n\
  ```cpp\ndouble points =  5.0 / 2;     // points 被赋值为值 2.5\n```\n\n然而，除法操作符的工作方式取决于其操作数是整数还是浮点数。当操作数中任一者为浮点数时，它会执行你熟悉的“正常”类型除法，如上所示。另一方面，当两个操作数都是整数时，除法的结果也将是一个整数。如果结果有小数部分，该部分将被舍弃。这种除法被称为\
  \ `integer division`（整数除）。\n\n这是一个整数除的示例。\n\n```cpp\ndouble fullBoxes = 26 / 8;\
  \     // fullBoxes 被赋值为 3.0，而不是 3.25\n```\n\n整数除的结果为 `3`，因为 `8` 除以 `26` 整数可以整三次，余数是\
  \ `2`。余数被丢弃。当将 `3` 赋值给浮点变量 `fullBoxes` 时，它被转换为浮点值 `3.0`。尽管结果被赋值给浮点变量，但由于除法发生在赋值之前，除法的小数已被丢弃。\n\
  \n如果你希望除法操作符执行常规除法，必须确保操作数中至少有一个是浮点数。\n\n`modulus operator` 计算整数除的 `remainder`（余数）。\n\
  \n```cpp\nleftOver = 26 % 8;     // leftOver 被赋值为值 2\n```\n\n图 2-8 展示了整数除和取模操作的使用。\n\
  \n## 图 2-8 整数除和取模操作\n\n![图像显示了长除法格式的除法。](img/FG_02_008.png)图 2-8 完整备用文本\n\n在第 3\
  \ 章中，你将学习如何在更复杂的数学公式中使用这些操作符。现在我们将关注它们的基本用法。这里有一个实现该功能的程序。它使用了两个算术操作符：加法操作符和乘法操作符。\n\
  \n假设我们需要编写一个程序来计算并显示员工的周薪。每周常规工作时间为 `40` 小时，任何超过 `40` 小时的都被都被加班。员工常规工作每小时赚 `$18.25`，加班每小时赚\
