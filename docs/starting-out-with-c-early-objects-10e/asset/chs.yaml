  \n证明通过这些修改，同一个程序可以同时用于加密和解密。\n\n# 5. 文件过滤器\n\n文件过滤器读取输入文件，以某种方式对其进行转换，并将结果写入输出文件。编写一个抽象文件过滤器类，定义一个转换字符的纯虚函数。为你的文件过滤器类创建一个子类：一个执行加密，另一个将文件转换为全大写，另一个创建一个原始文件的未修改副本。\n\
