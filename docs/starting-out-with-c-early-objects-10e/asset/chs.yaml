  \ 1 到 20 之间的整数作为班人数，然后循环读取相应数量的姓名。一旦读取完所有姓名，程序应该报告哪个学生将排在队伍的最前面，哪一个将排在队伍的最最后。你可以假设没有两个学生的名字相同。\n\
  \n# 16. 通货膨胀率\n\n年度通货膨胀率是货币贬值的速率。例如，如果年度通货膨胀率为 3.0%，那么一年后，花费 $1,030 才能买到今天 $1,000\
  \ 就能买到的商品。换句话说，一年后，$1,000 只能买到价值 1/1.03 * $1,000，即 $970.87 的货物。两年后，$1,000 只能买到 $970.87\
  \ 的 1/1.03，即 $942.59 的货物。编写一个程序，允许用户输入 1% 到 10% 之间的年度通货膨胀率，然后显示一个表格，显示今天的 $1,000\
  \ 在未来 10 年每年的价值。\n\n# 17. 人口\n\n编写一个预测生物种群数量的程序。该程序应该询问用户初始生物数量、它们的平均每日人口增长量（占当前人口的百分比）以及它们繁殖的天数。使用循环循环显示每一天的人口数量。\n\
  \n> 输入验证：程序不应接受初始人口数量小于 2 的数字、平均每日人口增长量为负数，或繁殖天数小于 1 的数字。\n\n# 18. 数学辅导版本 3\n\n\
  该程序最初是一个 第 3 章 编程挑战，并在 第 4 章 编程挑战中进行了修改。从 第 4 章中描述的版本开始，再次修改程序，以便其显示一个菜单，允许用户选择加法、减法或乘法题。菜单上的最后一个选项应允许用户退出程序。在用户完成数学题后，程序应该再次显示菜单。此过程必须重复，直到用户选择退出程序。如果用户选择了菜单上没有的项目，程序应打印错误信息然后再次显示菜单。\n\
  \n# 19. 酒店套房入住率\n\n编写一个程序，计算位于 15 层豪华酒店顶六层的 120 间套房（每层 20 间）的入住率。这些是 10–12 层和 14–16\
