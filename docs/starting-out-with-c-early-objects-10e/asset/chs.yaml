  下面的函数调用会将 `4` 传递给 `num1` 参数，将 `8` 传递给 `num2`，并将 `7` 传递给 `num3`：\n\n```\nshowSum(4,\
  \ 8, 7);\n```\n\n请注意，虽然传递给函数的名称不需要与接收它们的函数参数名称匹配，但参数必须在数量、顺序以及数据类型上与参数匹配，以防止错误或意外结果。\n\
  \n# 6.5 按值传递数据\n\n### 概念\n\n当参数按值传递给参数时，仅传递了参数值的一个副本。对参数的修改不会影响原始参数。\n\n正如你在本章中看到的，参数是定义在函数定义括号内的特殊用途变量。它们的目的是存储由参数传递给它们的信息，这些参数列在函数调用的括号内。通常情况下，当将信息传递给函数时，它是*按值传递的*。这意味着参数接收了传递给它的值的副本。如果在函数内部更改了参数的值，它对原始参数没有影响。程序\
  \ 6-9 展示了这一概念。\n\n程序 6-9 还说明了，如果函数原型列出了变量名以及数据类型，它所使用的名称只是*虚拟名称*。编译器并没有实际使用它们，而且它们不需要与函数头中使用的名称一致。第\
  \ 7 行的 `changeMe` 函数原型和第 29 行的 `changeMe` 函数头都指定该函数有一个 `int` 参数，但它们为该参数使用了不同的名称。\n\
  \n尽管在 `changeMe` 函数中更改了参数变量 `myValue`，但参数 `number` 没有被修改。这是因为 `myValue` 变量只包含 `number`\
  \ 变量的副本。改变的是这个副本，而不是原始。`changeMe` 函数无法访问原始参数。\n\n图 6-8 说明了参数变量在内存中的存储位置与原始参数是分开的。\n\
  \n# 图 6-8 位于独立内存位置的参数和参数\n\n![一个图表显示了独立内存位置的参数和参数。](img/FG_06_008.png)图 6-8 完整替代文本\n\
  \n在本章后面的部分中，你将学习让函数访问其原始参数的方法。\n\n## 检查点\n\n1. 6.7 指明下列项哪个是函数原型、函数头和函数调用：\n\n  \
