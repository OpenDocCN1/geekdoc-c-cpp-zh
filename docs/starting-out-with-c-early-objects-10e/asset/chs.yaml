  \n# 第 19 章 栈与队列\n\n## 19.1 栈简介\n\n### 概念\n\n栈是一种按照后进先出（LIFO）方式存储和检索项的数据结构。\n\n###\
  \ 定义\n\n与数组或链表一样，栈是一种存储元素序列的数据结构。然而，与数组和列表不同，栈是`后进先出 (last-in first-out, LIFO)`结构。这意味着当程序从栈中检索元素时，最后一个插入栈的元素是第一个被检索到的元素（同样地，第一个插入的元素是最后一个被检索到的元素）。\n\
  \n在可视化栈的工作原理时，想象食堂排队开头的一叠盘子。当食堂工作人员补充盘子供应时，他放在栈顶的第一个盘子是最后一个被拿走的。这在图 19-1）中有所说明。\n\
  \n### # 图 19-1 一叠盘子是后进先出的结构\n\n![插图显示了 5 个堆叠在一起的盘子。它们从底部到顶部编号为 1 到 5。底部和顶部盘子的注释分别为“先进入的盘子，最后出的盘子”和“后进入的盘子，先出的盘子”。](img/FG_19_001.png)\n\
  \n食堂盘子栈的 LIFO 特性也是栈数据结构的主要特征。最后放在栈上的数据元素是第一个从栈中检索到的数据元素。\n\n### 栈的应用\n\n对于首先处理系列中最后一个保存元素的算法，栈是非常用的数据结构。例如，计算机系统在执行程序时会使用栈。当调用函数时，计算机系统会将程序的返回地址、函数的参数和函数的局部变量存储在栈上。当函数返回时，局部变量、参数和返回地址从栈中移除。\n\
  \n### 静态栈与动态栈\n\n栈的数据结构有两种类型：静态和动态。`静态栈`具有固定的大小，并通过数组实现。`动态栈`根据需要增长大小，并通过链表实现。在本节中，你将看到静态和动态栈的示例。\n\
  \n### 栈操作\n\n栈有两个主要操作：`push` 和 `pop`。`push` 操作导致值被存储或推入栈中。例如，假设我们有一个最多容纳三个值的空整数栈。在该栈上，我们执行以下\
  \ push 操作。\n\n```\npush(5);\npush(10);\npush(15);\n```\n\n图 19-2 展示了在执行完这些 push\
  \ 操作后栈的状态。\n\n### # 图 19-2 栈上的 push 操作\n\n![插图显示了 3 次 push 操作。](img/FG_19_002.png)图\
  \ 19-2 完整备用文本\n\n`pop` 操作从栈中检索（从而移除）一个值。假设我们对图 19-2 所示的栈上连续执行三次 pop 操作。图 19-3 描绘了结果。\n\
  \n### # 图 19-3 栈上的 pop 操作\n\n![插图显示了 3 次 pop 操作。](img/FG_19_003.png)图 19-3 完整备用文本\n\
  \n正如你从图 19-3 中看到的，pop 操作会让栈为空。\n\n\n\n\n\n除了表 19-2 中描述的栈成员外，`IntStack` 类还定义了两个名为\
  \ `Overflow` 和 `Underflow` 的内部类，作为栈异常。异常在第 16 章中有所介绍，但为了方便可能跳过该章节的读者，我们在这里将要解释一下它们。当一段代码在执行过程中遇到无法完成其设计任务的条件时，就称该代码导致了\
  \ `exception`（异常）。对于静态栈来说，如果在调用 `push` 时栈上没有更多空间，则会发生 `overflow`（溢出）异常。同样，如果在调用\
  \ `pop` 时栈无无可返回，则会发生 `underflow`（下溢）异常。\n\n检测异常发生的代码可以通过创建一个描述异常的值，并使用 `throw` 语句将该值传递给程序的其他部分来通知它们。例如，`push`\
  \ 函数通过执行以下语句宣布溢出异常的发生：\n\n```\nthrow IntStack::Overflow();\n```\n\n而 `pop` 函数执行语句：\n\
  \n```\nthrow IntStack::Underflow();\n```\n\n以通知程序下溢异常已发生。默认情况下，当程序的任何部分抛出异常时，程序将带有错误信息终止。这种默认行为可以通过“捕获异常”（catching\
  \ the exception）过程来更改。你可以在第 16 章中学习更多关于异常的知识。\n\n`IntStack` 构造函数分配一个指定容量的数组，并将成员变量\
  \ `top` 设置为 0。所有的栈函数都使用 `top`，使其始终指向栈数组中的下一个可用槽位。当 `top` 等于 `capacity` 时，没有更多可用槽位来存储值，调用\
  \ `push` 将抛出异常。同样，当 `top` 为 0 时，栈为空，调用 `pop` 将抛出异常。由于程序中没有提供捕获这两种异常的规定，任何一种异常的发生都会带有错误信息终止程序。请注意，`push`\
  \ 在向栈添加值后增加 `top`，而 `pop` 在返回存储在 `stackArray[top]` 中的值之前递减 `top`。\n\n# `IntStack.cpp`\
  \ 的内容\n\n```cpp\n 1 #include \"intstack.h\"\n 2 //************************************\n\
  \ 3 // Constructor                       *\n 4 //************************************\n\
  \ 5 IntStack::IntStack(int capacity)\n 6 {\n 7    stackArray = make_unique<int[]>(capacity);\n\
  \ 8    this−>capacity = capacity;\n 9    top = 0;\n10 }\n 11 \n 12 //***********************************\n\
  \ 13 // Adds a value to the stack        *\n 14 //***********************************\n\
  \ 15 void IntStack::push(int value)\n 16 {\n 17    if (top == capacity) throw IntStack::Overflow();\n\
  \ 18    stackArray[top] = value;\n 19    top++;\n 20 }\n 21 \n 22 //****************************************\n\
  \ 23 // Determines whether the stack is empty *\n 24 //****************************************\n\
  \ 25 bool IntStack::isEmpty() const\n 26 {\n 27    return top == 0;\n 28 }\n 29\
  \ \n 30 //************************************************\n 31 // Removes a value\
  \ from the stack and returns it *\n 32 //************************************************\n\
  \ 33 void IntStack::pop(int &value)\n 34 {\n 35    if (top == capacity) throw IntStack::Underflow();\n\
  \ 36    top−;\n 37    value = stackArray[top];\n 38 }\n```\n\n\n\n\n溢出（overflow）和下溢（underflow）之间的区别可以总结如下：`push`\
  \ 中的栈溢出会通知调用者栈已耗尽，而栈下溢则通知调用者程序逻辑出现错误。与溢出不同，栈下溢可以通过细致的编程来避免。因此，程序不应使用 `try/catch`\
  \ 来处理下溢。相反，应该在调用 `pop` 之前调用 `isEmpty` 来确保下溢不会发生。\n\n# 栈模板 (Stack Templates)\n\n\
  本章所示的栈仅适用于整数。栈模板可以很容易地设计为适用于任何数据类型。这被留作了一项编程挑战供你完成。\n\n# 19.2 动态栈\n\n### 概念\n\n\
  栈可以实现为链表，并在每次执行 `push` 或 `pop` 操作时扩展或收缩。\n\n动态栈是构建在链表而不是数组之上的。基于链表的栈比基于数组的栈具有两个优势：首先，不需要指定栈的初始大小。动态栈只需从一个空链表开始，然后每推入一个值就扩展一个节点。其次，只要系统有足够的可用内存，动态栈永远不会满。\n\
  \n在本节中，我们将查看一个动态栈类 `DynIntStack`。该类是之前讨论的 `IntStack` 类的动态版本。类声明所示：\n\n# `DynIntStack.h`\
  \ 的内容\n\n```cpp\n 1 class DynIntStack\n 2 {\n 3      struct StackNode\n 4      {\
  \     \n 5         int value;\n 6         StackNode *next;\n 7         // 构造函数\n\
  \ 8         StackNode(int value1, StackNode *next1 = nullptr)\n 9         {\n10\
  \            value = value1;\n11            next = next1;\n12         }\n13    \
  \  };\n14      StackNode *top;\n15 public:\n16    DynIntStack() { top = nullptr;\
  \ }\n17    ~DynIntStack();\n18    void push(int);\n19    void pop(int &);\n20  \
  \  bool isEmpty() const;\n21 \n22    // 栈异常\n23    class Underflow {};\n24 };\n\
  ```\n\n`StackNode` 类是链表中每个节点的数据类型。因为在列表头部添加和删除项非常容易，我们将链表的头部作为栈的顶部（`top`），并使用指针\
  \ `top` 指向列表中的第一个节点。该指针由栈的构造函数初始化为 `nullptr`，表示栈创建时是空的。动态栈没有需要静态分配的数组来填充，因此没有溢出异常。然而，该类定义了一个\
  \ `Underflow` 异常，当尝试弹出空栈时抛出该异常。\n\n该栈类的成员函数所示：\n\n# `DynIntStack.cpp` 的内容\n\n```cpp\n\
  \ 1 #include <iostream>\n 2 #include \"DynIntStack.h\"\n 3 #include <cstdlib>\n\
  \ 4 using namespace std;\n 5 \n 6 //**************************************************\n\
  \ 7 // 成员函数 push 将参数推入*\n 8 // 栈中。                                      *\n 9 //**************************************************\n\
  10 void DynIntStack::push(int num)\n11 {\n12    top = new StackNode(num, top);\n\
  13 }\n14 \n15 //*****************************************************\n16 // 成员函数\
  \ pop 移除栈顶部的*\n17 // 值并将其复制到作为参数*\n18 // 传递的变量。                             *\n\
  19 //*****************************************************\n20 void DynIntStack::pop(int\
  \ &num)\n21 {\n22    StackNode *temp;\n23 \n24    if (isEmpty()) { throw DynIntStack::Underflow();\
  \ }\n25    else  \n26    {\n27       // 从栈顶弹出值      \n28       num = top->value;\n\
  29       temp = top;\n30       top = top->next;\n31       delete temp;\n32    }\n\
  33 }\n34 \n35 //*****************************************************\n36 // 成员函数\
  \ isEmpty 如果栈为*\n37 // 空，则返回 true，否则返回 false。              *\n38 //*****************************************************\n\
  39 bool DynIntStack::isEmpty() const\n40 {\n41    return top == nullptr;\n42 }\n\
  43 \n44 //*****************************************************\n45 // 析构函数。   \
  \                                     *\n46 //*****************************************************\n\
  47 DynIntStack::~DynIntStack()\n48 {\n49    StackNode * garbage = top;\n50    while\
  \ (garbage != nullptr)\n51    {\n52       top = top->next;\n53       garbage->next\
  \ = nullptr;\n54       delete garbage;\n55       garbage = top;\n56    }\n57   \n\
  58 }\n```\n\n`push` 函数特别简单。它只需创建一个新节点，其值为要推入栈的数字，后继指针指向当前栈顶节点，然后将新创建的节点变为新的顶：\n\n\
  ```cpp\ntop = new StackNode(num, top);\n```\n\n注意，即使 `push` 操作之前栈是空的，这种方法也能正常工作，因为后继指针将被设置为\
  \ `top`（即 `nullptr`）。\n\n现在来看 `pop` 函数。正如 `push` 函数必须在列表头部插入节点一样，`pop` 必须从头部删除节点。首先，函数调用\
  \ `isEmpty` 来确定栈中是否存在任何节点。如果没有，则抛出异常。\n\n```cpp\nif (isEmpty()) { throw DynIntStack::Underflow();\
  \ }\n```\n\n如果 `isEmpty` 返回 `false`，则执行以下语句：\n\n```cpp\n// 从栈顶弹出值\nnum = top->value;\n\
  temp = top;\ntop = top->next;\ndelete temp;\n```\n\n顶节点的 `value` 成员被保存在在 `num` 引用中。然后将临时指针\
  \ `temp` 设置为 `top`，接着更新 `top` 为 `top->next`，并删除 `temp`。\n\n`isEmpty` 函数在栈为空时返回 `true`，否则返回\
  \ `false`。\n\n```cpp\nbool DynIntStack::isEmpty() const {\n    return top == nullptr;\n\
  }\n```\n\n析构函数遍历列表并删除每个节点以防止内存泄漏。\n\n```cpp\nDynIntStack::~DynIntStack() {\n   \
  \ StackNode * garbage = top;\n    while (garbage != nullptr)\n    {\n       top\
  \ = top->next;\n       garbage->next = nullptr;\n       delete garbage;\n      \
  \ garbage = top;\n    }\n}\n```\n\n以下程序演示了 `DynIntStack` 类：\n\n```cpp\nint main()\
  \ {\n    DynIntStack s;\n    s.push(10);\n    s.push(20);\n    s.push(30);\n   \
  \ while (!s.isEmpty()) {\n        int val;\n        s.pop(val);\n        cout <<\
  \ val << \" \";\n    }\n    return 0;\n}\n```\n\n# 19.3 STL `stack` 容器\n\n### 概念\n\
  \n标准模板库提供了一个栈模板，它可以实现为 `vector`、`list` 或 `deque`。\n\n到为止，你学习的 STL 容器有 `vector` 和\
  \ `list`。如果一个类为另一个类提供了新的接口，则说该类*适配*了另一个类。新接口的目的是为了让专门任务更加方便。由于 `stack` 容器用于适配 `list`、`vector`\
  \ 和 `deque`，它通常被称为*容器适配器*。\n\n以下是声明基于 `vector`、`list` 和 `deque` 实现的 `int` 栈的示例：\n\
  \n```cpp\nstack<int, vector<int>> iStack; // Vector 栈\nstack<int, list<int>> iStack;\
  \    // List 栈\nstack<int> iStack;             // Deque 栈（默认）\n```\n\n### 注意\n\n\
  在 C++11 之前，`iStack` 声明中的闭合角括号 `>>` 必须写成 `> >`，之间至少留一个空格，以防编译器将其误认为是流提取运算符 `>>`。\n\
  \n表 19-3 列出了栈模板的一些成员函数。\n\n# 表 19-3 STL 栈成员函数\n\n| 成员函数 | 示例和描述 |\n\n| --- | ---\
  \ |\n| `empty` | 如果栈为空则返回 `true`，否则返回 `false`。 |\n| `push` | 将元素添加到栈顶。 |\n| `pop`\
  \ | 移除栈顶的元素。 |\n| `top` | 返回栈顶元素的引用。 |\n| `size` | 返回栈中元素的数量。 |\n\n\n\n\n\n```\n\
  if (myStack.empty())\n```\n\n`empty` 成员函数在栈为空时返回 `true`。如果栈中有元素，它返回 `false`。\n\n\
  | `pop` |\n\n```cpp\nmyStack.pop();\n```\n\n`pop` 函数移除栈顶的元素。\n\n| `push` |\n\n```cpp\n\
  myStack.push(x);\n```\n\n`push` 函数将一个值为 `x` 的元素推入栈中。\n\n| `size` |\n\n```cpp\ncout\
  \ << myStack.size() << endl;\n```\n\n`size` 函数返回栈中当前包含元素个数。\n\n| `top` |\n\n```cpp\n\
  x = myStack.top();\n```\n\n`top` 函数返回栈顶元素的引用。\n\n### 注意\n\n`stack` 模板中的 `pop` 函数不会从栈顶检索值；它只是将其移除。要检索该值，你必须先调用\
  \ `top` 函数。\n\n程序 19-4 是一个演示如何用 `vector` 实现的 STL `stack` 驱动程序。\n\n## 检查点\n\n1. 19.1\
  \ 描述什么是 LIFO。\n2. 19.2 静态栈和动态栈之间有什么区别？动态栈相比静态栈有什么优势？\n3. 19.3 两个主要的栈操作是什么？请描述这两个操作。\n\
  4. 19.4 STL `stack` 容器适配哪些 STL 类型？\n\n# 19.4 队列简介\n\n### 概念\n\n队列是一种按照先进先出方式存储和检索项目的数据结构。\n\
  \n# 定义\n\n与栈一样，`queue`（读音为“cue”）也是一个包含元素序列的数据结构。然而，队列以**先进先出 (FIFO)** 的顺序访问其元素。队列中元素的处理方式就像排在杂货店结账线排队的顾客：队列中的第一个顾客是第一个被服务的。\n\
  \n# 队列的应用\n\n队列数据结构通常用于计算机操作系统。它们在多用户/多任务环境中特别重要，因为那里可能有多个用户或任务同时请求同种资源。例如，打印是由队列控制的，因为一次只能打印一个文档。队列被用于持有系统用户提交的打印作业，而打印机一个接一个地处理这些作业。\n\
  \n通信软件也使用队列来存放通过网络和拨号连接接收的信息。有时信息传输到系统的速度快于其处理速度，因此在接收到信息时将其放入队列中。\n\n# 静态队列和动态队列\n\
  \n队列像栈一样，可以用数组或链表实现。动态队列相对于静态队列所具有的优势，与动态栈相对于静态栈所具有的优势是相同的。事实上，队列和栈之间的主要区别在于在每种结构中访问数据元素的方式。\n\
  \n# 队列操作\n\n队列有一个头部和一个尾部，就像杂货店的结账线一样。这在图 19-8 中进行了说明。当元素被添加到队列时，它被添加到尾部。当元素从队列中移除时，它从头部移除。两个主要的队列操作是入队（enqueuing）和出队（dequeuing）。`enqueue`\
  \ 意味着在队列尾部插入一个元素，而 `dequeue` 意味着从队列头部移除一个元素。实现这些操作有多种算法。我们将从最简单的开始。\n\n# 图 19-8\
  \ 基于数组的队列\n\n![一个基于数组的队列插图显示了行排的 7 个正框。左侧第一个正框和右侧最后一个正框对应的注释分别为“front”（头部）和“rear”（尾部）”。](img/FG_19_008.png)\n\
  \n假设我们有一个空的静态整数队列，能够最多容三个值。使用该队列我们执行以下入队操作：\n\n```cpp\nenqueue(3);\nenqueue(6);\n\
  enqueue(9);\n```\n\n图 19-9 展示了每次这些入队操作后队列的状态。\n\n# 图 19-9 一系列入队操作\n\n![图像显示了 3 个基于数组的队列的插图。](img/FG_19_009.png)图\
  \ 19-9 完整替代文本\n\n注意，头部索引（一个持有下标或指针的变量）始终引用同一个物理元素。尾部索引随着元素的入队在数组中移动。现在让我们看看如何执行出队操作。图\
  \ 19-10 展示了每次这些出队操作后队列的状态。# 图 19-10 一系列出队操作\n\n![图像显示了 3 个基于数组的队列。](img/FG_19_010.png)图\
  \ 19-10 完整替代文本\n\n在出队操作中，头部的元素被移除。这是通过将所有元素向前移动来实现的。第一次出队后，3 被移除。第二次出队后，66 被移除。当队列中只有一个值时（在图\
  \ 19-10），该值位于头部。空队列可以通过将头部和尾部索引都设置为 -1 来表示。\n\n该算法的问题在于其低效性。每次出队时，队列中的剩余元素都要向前移动。队列中的元素越多，每次出队操作的时间就越长。\n\
  \n解决此问题的方法是：让头部和尾部索引在数组中移动。像之前一样，入队元素时，尾部索引移动以留出空间。但在这种设计中，出队元素时，头部索引向尾部移动。\n\n\
  使用这种方法，随着元素的添加和移除，队列逐渐向数组末尾移动。这在图 19-11 中所示。阴影部分表示队列（头部和尾部之间）。\n\n# 图 19-11 混合队列操作\n\
  \n![图像显示了 4 个数组。](img/FG_19_011.png)图 19-11 完整替代文本\n\n这种方法的问题是尾部索引无法移动数组的最后一个元素。解决方案是将数组视为循环而非线性的。当元素越过数组末端时，它会简单的绕回开头。例如，考虑图\
  \ 19-12 所示的队列。\n\n# 图 19-12 即将回回队列\n\n![数组显示了 9 个正框。其下标从 [0] 到 [8]。最后 4 个正框显示了数字\
  \ 7、9、6 和 3。其余的是空的。显示数字 7 和 3 的框对应的注释分别为“front”（头部）和“rear”（尾部）。](images/FG_19_012.png)\n\
  \n3 是队列的尾部，7 是队列的头部。现在，假设执行了入队操作，将值 4 插入队列。图 19-13 展示了队列的尾部是如何绕回数组开头的。\n\n# 图 19-13\
  \ 导致队列回回的入队操作\n\n\n\n\n![一个数组显示了 9 个正格。它的下标从 [0] 到 [8]。](images/FG_19_013.png)图\
  \ 19-13 完整替代文本\n\n那么，将尾部标记回绕到数组对端的代码是什么呢？一种直接的方法是使用 `if` 语句，例如：\n\n```\n if (rear\
  \ == queueSize − 1)\n   rear = 0;\nelse\n   rear++;\n```\n\n另一种方法是使用模算术：\n\n```\n\
  \ rear = (rear + 1) % queueSize;\n```\n\n该语句使用 `%` 运算符将 `rear` 的值调整到适当的位置。虽然这种方法看起来更优雅，但使用哪种代码由你决定。\n\
  \n# 使用循环数组检测满队列和空队列\n\n在我们使用循环数组实现队列时，我们采用了这样的约定：`front` 和 `rear` 索引都引用仍然在队列中的项，且\
  \ `front` 和 `rear` 索引都将被设置为 −1 以表示队列为空。\n\n为了保留这一约定，出队操作在从仅有一个元素的队列中移除元素后，必须将 `front`\
  \ 和 `rear` 都设为 −1。出队操作可以通过测试 `front` 是否等于 `rear` 来检测队列是否只有一个元素。为了防止队列溢出，入队操作在添加另一个元素之前必须首先检查队列是否已满。我们可以通过测试表达式\n\
  \n```\n (rear + 1) % queueSize == front\n```\n\n来判断它是否为真。\n\n检测满队列和空队列还有另一种方法：可以使用计数器变量来记录当前存储在队列中的项数。按照这种约定，计数器在每次入队操作时增加，在每次出队操作时减少。当计数器为零时，队列为空；当计数器等于为队列分配的大小时，队列满。\n\
  \n由于记录队列中的项数可能有帮助，我们将在实现中使用第二种方法。因此，我们引入了变量：\n\n```\n unique_ptr<int []> queueArray;\n\
  int queueSize;\nint front;\nint rear;\nint numItems;\n```\n\n其中 `numItems` 是计数器变量，`queueArray`\
  \ 是指向大小为 `queueSize` 的动态分配数组的唯一智能指针。我们采用以下两个约定：\n\n* `rear` 指向队列中存放最后添加的项的位置。\n\
  * `front` 指向队列中曾经存放最后移除的项的位置。\n\n由于对 `rear` 索引指向位置的约定，入队操作在添加新项 `num` 之前，必须（循环地）将\
  \ `rear` 向右移动一位：\n\n```\n rear =  (rear + 1) % queueSize;\nqueueArray[rear] = num;\n\
  numItems ++;\n```\n\n同样，由于 `front` 处的任何内容已经被移除，出队操作在检索队列项之前必须先移动 `front`。\n\n# 静态队列类\n\
  \n`IntQueue` 类的声明如下：\n\n# `IntQueue.h` 的内容\n\n```\n 1 #include <memory>\n 2 using\
  \ namespace std;\n 3 class IntQueue\n  {\n 5 private:\n 6    unique_ptr<int []>\
  \ queueArray;\n 7    int queueSize;\n 8    int front;\n 9    int rear;\n10    int\
  \ numItems;\n11 public:\n 12    IntQueue(int);\n 13  \n 14    void enqueue(int);\n\
  \ 15    void dequeue(int &);\n 16    bool isEmpty() const;\n 17    bool isFull()\
  \ const;\n 18    void clear();\n 19 };\n```\n\n注意，除了本节讨论的操作外，类还声明了一个名为 `clear` 的成员函数。该函数通过重置\
  \ `front` 和 `rear` 索引并将 `numItems` 成员设置为 0 来清空队列。成员函数的定义列在此：\n\n# `IntQueue.cpp`\
  \ 的内容\n\n```\n 1 #include <iostream>\n 2 #include \"IntQueue.h\"\n 3 #include <cstdlib>\n\
  \ 4 using namespace std;\n 5 \n 6 //*************************\n 7 // 构造函数.     \
  \      *\n 8 //*************************\n 9 IntQueue::IntQueue(int s)\n10 {\n11\
  \    queueArray = make_unique<int []>(s);\n12    queueSize = s;\n13    front = −1;\n\
  14    rear = −1;\n15    numItems = 0;\n16 }\n 17 \n18 //********************************************\n\
  19 // 函数 enqueue 将值 num 插入到 *\n20 // 队列的尾部。                 *\n21 //********************************************\n\
  22 void IntQueue::enqueue(int num)\n23 {\n24    if (isFull())\n25    {\n26     \
  \  cout << \"The queue is full.\\n\";\n27       exit(1);\n28    }\n29    else\n\
  30    {\n31       // 计算新的尾部位置\n32       rear = (rear + 1) % queueSize;      \n33\
  \       // 插入新项\n34       queueArray[rear] = num;\n35       numItems ++;\n36   \
  \ }\n37 }\n```\n\n# 静态队列中的溢出和上流异常\n\n我们队列类中的 `enqueue` 和 `dequeue` 函数在无法执行被要求的任务时会终止调用者程序。终止调用者并不总是正确的做法。更好的做法是抛出一个异常，并允许准备好处理此类异常的调用者采取适当行动。在捕获此类异常后，某些调用者确实可能决定终止程序。然而，其他调用者可能恢复并继续执行。例如，捕获到队列溢出异常的程序可能创建一个更大的队列并切换到新队列。\n\
  \n静态队列的更好设计是让 `enqueue` 和 `dequeue` 抛出 `overflow` 和 `underflow` 异常。让 `enqueue` 抛出\
  \ `overflow` 可以消灭对公共 `isFull` 函数的需求，因为调用者可以使用 `try/catch` 块在队列溢出发生时处理。通过将所有对 `enqueue`\
  \ 的调用放在 `try` 块中，调用者能够在一个地方（即 `catch` 块）放置处理这些调用中任何一个所抛出的异常的代码。如果没有异常处理，每次对 `enqueue`\
  \ 的调用之前都必须先调用 `isFull`，并在 `isFull` 返回 `true` 的情况下附带用于恢复的代码。\n\n本章末的编程挑战之一要求你修改队列类以使用异常。\n\
  \n# 19.5 动态队列\n\n### 概念\n\n队列可以使用链表实现，并在每次入队或出队操作时扩展或缩小。\n\n\n\n动态队列围绕链表构建，比静态队列要理解起来要直观得多。动态队列从一个空链表开始。在执行第一次\
  \ `enqueue` 操作时，会添加一个节点，该节点由 `front` 和 `rear` 指针指向。当每个新元素被添加到队列时，都会在链表的末尾添加一个新节点，并更新\
  \ `rear` 指针指向该新节点。当每个元素被出队时，让 `front` 指向列表中的下一个节点，然后删除之前位于列表头部的节点。图 19-14 展示了动态队列的结构。\n\
  \n## 图 19-14 基于链表的队列\n\n![一张关于节点的示意图，解释了基于链表的队列。](img/FG_19_014.png)图 19-14 完整备用文本\n\
  \n此处列出了一个动态整数队列类：\n\n## `DynIntQueue.h` 的内容\n\n```cpp\n 1 class DynIntQueue\n 2\
  \ {\n 3    struct QueueNode\n 4    {      \n 5       int value;\n 6       QueueNode\
  \ *next;\n 7       QueueNode(int value1, QueueNode *next1 = nullptr)\n 8       {\n\
  \ 9          value = value1;\n10          next = next1;\n 11       }\n 12    };\n\
  \ 13    // 这些用于跟踪队列的头部和尾部\n 14    QueueNode *front;\n 15    QueueNode *rear;\n 16\
  \ public:\n 17    // 构造函数和析构函数\n 18    DynIntQueue();\n 19    ~DynIntQueue();\n\
  \ 20 \n 21    // 成员函数\n 22    void enqueue(int);\n 23    void dequeue(int &);\n\
  \ 24    bool isEmpty() const;\n 25    void clear();\n 26 };\n```\n\n## `DynIntQueue.cpp`\
  \ 的内容\n\n```cpp\n 1 #include <iostream>\n 2 #include \"DynIntQueue.h\"\n 3 #include\
  \ <cstdlib>\n 4 using namespace std;\n 5 \n 6 //************************\n 7 //\
  \ 构造函数.          *\n 8 //************************\n 9 DynIntQueue::DynIntQueue()\n\
  10 {\n 11    front = nullptr;\n 12    rear = nullptr;\n 13 }\n 14 \n 15 //************************\n\
  \ 16 // 析构函数.           *\n 17 //************************\n 18 DynIntQueue::~DynIntQueue()\n\
  \ 19 {\n 20    QueueNode *garbage = front;\n 21    while (garbage != nullptr)\n\
  \ 22    {\n 23       front = front->next;\n 24       garbage->next = nullptr;\n\
  \ 25       delete garbage;\n 26       garbage = front;\n 27    }\n 28 }\n 29 \n\
  \ 30 //********************************************\n 31 // 函数 enqueue 将值 num 插入到\
  \ *\n 32 // 队列的末尾。                 *\n 33 //********************************************\n\
  \ 34 void DynIntQueue::enqueue(int num)\n 35 {\n 36    if (isEmpty())\n 37    {\n\
  \ 38       front = new QueueNode(num);\n 39       rear = front;\n 40    }\n 41 \
  \   else\n 42    {\n 43       rear->next = new QueueNode(num);\n 44       rear =\
  \ rear->next;\n 45    }\n 46 }\n 47 \n 48 //**********************************************\n\
  \ 49 // 函数 dequeue 队列头部的 **\n 50 // 值并将其复制到 num 中。 *\n 51 //**********************************************\n\
  \ 52 void DynIntQueue::dequeue(int &num)\n 53 {\n 54    QueueNode *temp = nullptr;\n\
  \ 55    if (isEmpty())\n 56    {\n 57       cout << \"The queue is empty.\\n\";\n\
  \ 58       exit(1);\n 59    }\n 60    else\n 61    {\n 62       num = front->value;\n\
  \ 63       temp = front;\n 64       front = front->next;\n 65       delete temp;\n\
  \ 66    }\n 67 }\n 68 \n 69 //*********************************************\n 70\
  \ // 函数 isEmpty 如果队列为空则 *\n 71 // 返回 true，否则返回 false。             *\n 72 //*********************************************\n\
  \ 73 bool DynIntQueue::isEmpty() const\n 74 {\n 75    if (front == nullptr)\n 76\
  \       return true;\n 77    else\n 78       return false;\n 79 }\n 80 \n 81 //********************************************\n\
  \ 82 // 函数 clear 出队队列中的 **\n 83 // 所有元素。                             *\n 84 //********************************************\n\
  \ 85 void DynIntQueue::clear()\n 86 {\n 87    int value;   // 占位变量\n 88    while\
  \ (!isEmpty())\n 89       dequeue(value);\n 90 }\n```\n\n## 19.6  动态队列\n\n动态队列围绕链表构建，比静态队列要理解起来要直观得多。动态队列从一个空链表开始。在执行第一次\
  \ `enqueue` 操作时，会添加一个节点，该节点由 `front` 和 `rear` 指针指向。当每个新元素被添加到队列时，都会在链表的末尾添加一个新节点，并更新\
  \ `rear` 指针指向该新节点。当每个元素被出队时，让 `front` 指向列表中的下一个节点，然后删除之前位于列表头部的节点。图 19-14 展示了动态队列的结构。\n\
  \n### `deque` 容器\n\n标准库提供了两个容器：`deque` 和 `queue`。`deque`（读作“deck”）类似于 vector，但允许对两端进行高效访问。由于我们关注的是队列特性，我们将关注它的\
  \ `push_back`、`pop_front` 和 `front` 成员函数。表 19-4 描述了它们。\n\n### `queue` 适配器\n\n`queue`\
  \ 容器适配器可以基于 vector、list 或 deque 构建。默认情况下，它使用 deque。`queue` 支持的插入和删除操作与 stack 相似，但行为有所不同：`queue`\
  \ 版本的 `push` 总是将元素插入尾部；`queue` 版本的 `pop` 总是从头部移除元素。`front` 函数返回头部元素的值。\n\n### `deque`\
  \ 成员函数\n\n| 成员函数 | 描述 |\n| --- | --- |\n| `push_back` | ```cpp iDeque.push_back(7);```\
  \ 接受一个插入到 deque 末尾的值。 |\n| `pop_front` | ```cpp iDeque.pop_front();``` 删除 deque\
  \ 的第一个元素。 |\n| `front` | ```cpp cout << iDeque.front() << endl;``` `front` 返回指向第一个元素的引用。\
  \ |\n\n## 19.7 消除递归\n\n递归是一种非常有用的编程技术，但在解决问题的过程中会产生大量调用的开销。递归方案的效率可以通过重构递归算法以消除递归来提高。在本节中，我们将如何使用栈来消除快速排序算法中的递归。\n\
  \n快速排序的主要问题是排序一个*范围*，即数组 `arr` 中两个索引 `start` 和 `end` 之间的部分。自然地，这只有在 `start < end`\
  \ 时才需要执行。正如在第 14 章中所学的，这通过调用一个 `partition` 过程来实现，该过程确定一个整数 `pivot`，使得：\n\n1. 基准左侧的所有数组元素小于基准元素：即\
  \ `arr[k] < arr[pivot]`，对于范围 `start .. pivot–1` 内内的所有 `k` 均成立。\n\n2. 基准右侧的所有数组元素大于或等于基准元素：即\
  \ `arr[k] >= arr[pivot]`，对于范围 `pivot+1..end` 内内的所有 `k` 均成立。\n\n\n\n\n\n完成此操作后，枢值所在的数组项将位于其排序位置。因此，`partition`\
  \ 过程的一个重要效果是将枢值元素放入其最终的排序位置。通过在调用 `partition` 时跟踪左侧和右子范围，稍后对这些子范围再次调用 `partition`，我们可以在不使用递归的情况下排序整个数组。我们需要跟踪这些子范围，并最终按照\
  \ Quicksort 递归调用的顺序对它们进行划分。由于 Quicksort 的递归调用调用和返回时遵循 LIFO（后进先出）顺序，因此我们使用栈来跟踪等待被划分的范围。\n\
  \n我们解决方案的核心思想是定义一个类：\n\n```cpp\n class Range\n{\n   int start;\n   int end;\npublic:\n\
  \   Range(int s, int e)\n   {\n      start = s; \n      end = e;\n   }\n};\n```\n\
  \n用于跟踪待划分的数组范围。因此，我们使用 STL 的 `stack` 类来定义一个这些范围的栈：\n\n```cpp\n stack<Range> qStack;\n\
  ```\n\n然后，我们使用函数 `qSort(int arr[ ], int size)` 对数组 `arr` 进行排序，初始时将从 `0` 到 `size–1`\
  \ 的范围推入栈，然后反复从栈中取出范围、对该范围进行划分，并将左、右子范围放回栈。从栈中移除的空子范围将被丢弃。该算法如下：\n\n```\n push Range(0,\
  \ size–1) onto stack\nWhile stack not empty\n   pop a range r from the stack\n \
  \  If r is not empty\n      partition the range r into two smaller ranges about\
  \ the pivot\n      push the two smaller ranges onto the stack\n   End if\nEnd While\n\
  ```\n\n### Note\n\n语句 `qStack.push(Range(0, size–1));` 通过调用构造函数创建一个 `Range` 对象。然后将该\
  \ `Range` 对象推入栈中。\n\n完整的解决方案重用了第 14 章中的 `partition` 函数，在程序 19-9 中给出。注意，我们将 `qSort`\
  \ 函数声明为 `Range` 的友元，以便访问 `Range` 的私有成员。\n\n### Note\n\n使用友（friend）概念时应谨慎，因为它通过将类成员声明为私有，绕过了类成员提供的保护。注意，在我们案例中，`Range`\
  \ 类的 `start` 和 `end` 成员永远不会被友函数 `qSort` 修改。\n\n## Review 复习题与练习\n\n### 简答\n\n1.\
