  \n# 7.11 分离类规范、实现与客户端代码\n\n### 概念\n\n通常，类声明存储在各自的头文件中，而成员函数定义存储在各自的 `.cpp` 文件中。\n\
  \n在我们目前为止看过的程序中，类声明、成员函数定义以及使用该类的应用程序都存储在一个文件中。一种更符合习惯的 C++ 程序设计方法是将这些内容存储在三个单独文件中。通常，程序组件以以下方式存储：\n\
  \n* 类声明存储在各自的头文件中。包含类声明的头文件称为*类规范文件*（class specification file）。类规范文件的文件名通常与类名相同，扩展名为\
  \ `.h`。例如，`Rectangle` 类将在 `Rectangle.h` 文件中声明。\n* 任何使用该类的程序都 `#include` 此头文件。\n\
  * 类的成员函数定义存储在单独的 `.cpp`文件中，该文件称为*类实现文件*（class implementation file）。该文件通常与类名相同，扩展名为\
  \ `.cpp`。例如，`Rectangle` 类的成员函数将在 `Rectangle.cpp` 文件中定义。\n* 类的 `.cpp` 文件应该与使用该类的应用程序一起编译并链接。该程序也被称为*客户端程序*（client\
  \ program）或*客户端代码*（client code），它是包含 `main` 函数的文件。这个过程可以通过 `project` 或 `make` 工具实现自动化。如\
  \ Visual Studio 这样的集成开发环境也提供了创建多文件项目的方法。\n\n让我们看看如何使用这种设计方法重写 程序 7-3，即矩形程序。首先，`Rectangle`\
  \ 类声明将存储在下面的 `Rectangle.h` 文件中。\n\n# `Rectangle.h` 内容\n\n```\n 1 // Rectangle.h\
  \ 是 Rectangle 类规范文件。\n 2 #ifndef RECTANGLE_H\n 3 #define RECTANGLE_H\n 4 \n 5 //\
  \ Rectangle 类声明\n 6 class Rectangle\n��7 {\n 8    private:\n 9       double length;\n\
  10       double width;\n11    public:\n12       bool setLength(double);\n13    \
  \   bool setWidth(double);\n14       double getLength();\n15       double getWidth();\n\
  16       double calcArea();\n17 };\n18 #endif\n```\n\n## `Rectangle.h` 析\n\n这是 `Rectangle`\
  \ 类的规范文件。它只包含 `Rectangle` 类的声明，不包含任何成员函数定义。当我们编写其他使用 `Rectangle` 类的程序时，可以包含一个 `#include`\
  \ 指令来引入此文件。这样一来，我们就不需要在每个使用 `Rectangle` 类的程序中都写一遍类声明了。\n\n该文件还引入了两个新的预处理器指令：`#ifndef`\
  \ 和 `#endif`。出现在第 2 行的 `#ifndef` 指令称为*包含保护符*（include guard）。它能防止头文件被意外包含多次。当你的主程序文件包含对某个头文件的\
  \ `#include` 指令时，始终存在该头文件包含另一个头文件的 `#include` 指令的可能性。如果你的主程序文件也包含对第二个头文件的 `#include`\
  \ 指令，预处理器将包含两次第二个头文件。除非在第二个头文件中编写了包含保护符，否则会导致错误，因为编译器会处理两次第二个头文件中的声明。让我们看看包含保护符是如何工作的。\n\
  \n`ifndef` 词代表“如果未定义”（if not defined）。它被用于判断特定常量是否已经通过另一个 `#define` 指令定义过。在编译 `Rectangle.h`\
  \ 文件时，`#ifndef` 指令会检查名为 `RECTANGLE_H` 的常量是否存在。如果该常量尚未被定义，它会在第 3 行被立即定义，并包含文件的其余部分。然而，如果该常量已经定义，意味着该文件已经被包含过了。在这种情况下，它不会被再次包含。相反，`#ifndef`\
  \ 和 `#endif` 指令之间的所有内容将被跳过。注意，在 `#ifndef` 和 `#define` 指令中使用的常量应该全大写，并且习惯上命名为 `FILENAME_H`，其中\
  \ `FILENAME` 是头文件的文件名。\n\n接下来我们需要一个包含类成员函数定义的实现文件。`Rectangle` 类的实现文件是 `Rectangle.cpp`。\n\
  \n# `Rectangle.cpp` 内容\n\n\n\n\n\n```cpp\n1 // Rectangle.cpp 是 Rectangle 类的函数实现文件。\n\
  2 #include \"Rectangle.h\"\n3 \n4 /*******************************************************************\n\
  5 *                    Rectangle::setLength                         *\n6 * 如果传递给\
  \ setLength 函数的参数为零或大于零，\n7 * 它将被复制到成员变量 length 中，并返回 true *\n8 * 如果参数为负数，则 length\
  \ 的值保持不变，\n9 * 并返回 false。                                                      \
  \ *\n10 ****************************************************/\n11 bool Rectangle::setLength(double\
  \ len)\n12 {\n13    bool validData = true;\n14 \n15    if (len >= 0)           \
  \    // 如果 len 有效\n16       length = len;            // 将其拷贝到 length\n17    else\n\
  18       validData = false;       // 否则保持 length 不变\n19    \n20    return validData;\n\
  21 }\n22 \n23 /************************************************\n24 *          \
  \          Rectangle::setWidth                         *\n25 * 如果传递给 setWidth 函数的参数为零或大于零，*\n\
  26 * 它将被拷贝到成员变量 width 中，并返回 true *\n27 * 如果参数为负数，则 width 的值保持不变 *\n28 * 并返回 false。\
  \                       *\n29 ***************************************************/\n\
  30 bool Rectangle::setWidth(double w)\n31 {\n32    bool validData = true;\n33 \n\
  34    if (w >= 0)                 // 如果 w 有效\n35       width = w;              \
  \ // 将其拷贝到 width\n36    else\n37       validData = false;       // 否则保持 width 不变\n\
  38    \n39    return validData;\n40 }\n41 \n42 /**************************************************************\n\
  43 *                     Rectangle::getLength                   *\n44 * 此函数返回成员变量\
  \ length 的值。 *\n45 ***************************************************************/\n\
  46 double Rectangle::getLength()\n47 {\n48    return length;\n49 }\n50 \n51 /**************************************************************\n\
  52 *                     Rectangle::getWidth                    *\n53 * 此函数返回成员变量\
  \ width 的值。  *\n54 ***************************************************************/\n\
  55 double Rectangle::getWidth()\n56 {\n57    return width;\n58 }\n59 \n60 /*******************************************************************\n\
  61 *                        Rectangle::calcArea                      *\n62 * 此函数计算并返回矩形的面积。\
  \ *\n63 ******************************************************************/\n64\
  \ double Rectangle::calcArea()\n65 {\n66    return length * width;\n67 }\n```\n\n\
  查看这五个函数的代码。注意，这三个访问器函数 `getLength`、`getWidth` 和 `calcArea` 与 程序 7-3 中出现的是相同的。然而，对两个修改器函数\
  \ `setLength` 和 `setWidth` 进行了修改，以说明公有类函数保护私有成员数据的另一种方法。在 程序 7-3 中，如果向它们传递了无效数据，`setLength`\
  \ 和 `setWidth` 函数将为 `length` 和 `width` 使用默认值。在 `Rectangle.cpp` 代码中，这两个函数返回一个布尔值，用指示接收到的值是否存储在成员变量中。如果接收到有效参数，它将被存储在成员变量中并返回\
  \ `true`。如果接收到无效参数，成员变量将保持不变并返回 `false`。使用该类的客户端程序必须测试返回的布尔值以确定如何继续操作。\n\n现在看第 2\
  \ 行，它包含以下 `#include` 指令：\n\n```cpp\n#include \"Rectangle.h\"\n```\n\n该指令包含了 `Rectangle.h`\
  \ 文件，该文件包含了 `Rectangle` 类的声明。注意，头文件的名称被包含在双引号（`\" \"`）中，而不是角括号（`< >`）。当你包含 C++ 系统头文件（如\
  \ `iostream`）时，你将文件名包含在角括号中。这表示该文件位于编译器的包含文件目录中。即所有标准 C++ 头文件所在的目录或文件夹。当你包含一个自己编写的头文件（例如类规范文件）时，你将文件名包含在双引号中。这表示该文件位于当前项目目录中。\n\
  \n任何使用 `Rectangle` 类的文件都必须有 `Rectangle.h` 文件的 `#include` 指令。我们需要在类规范文件中包含 `Rectangle.h`，因为该文件中的函数属于\
  \ `Rectangle` 类。在编译器处理带有 `Rectangle::` 名称的函数之前，它必须已经处理了 `Rectangle` 的声明。程序 7-12\
  \ 是 程序 7-3 的修改版本，因为它比程序 7-3 短得多。它不包含 `Rectangle` 类的定义。相反，它的设计是为了与类规范文件一起编译和链接的。程序\
  \ 7-12 只需要使用 `Rectangle` 对象的客户端代码。\n\n注意 程序 7-12 的第 6 行包含 `Rectangle.h` 文件的 `#include`\
  \ 指令。这是为了确保 `Rectangle` 声明被包含。现在我们已经创建了该程序的三个文件，必须采取以下步骤创建可执行文件：\n\n*   首先，编译实现文件\
  \ `Rectangle.cpp` 生成对象文件。该文件通常命名为 `Rectangle.obj`。\n*   接下来，编译主程序文件（位于文件 `pr7–12.cpp`）生成对象文件。该文件通常命名为\
  \ `pr7–12.obj`。\n*   最后，将对象文件 `pr7–12.obj` 和 `Rectangle.obj` 链接在一起创建可执行文件，文件名通常为\
  \ `pr7–12.exe`。\n\n所有的 `.h` 和 `.cpp` 文件都可以在书籍配套网站的第 7 章程序文件夹中找到。\n\n\n\n\n\n图 7-5\
  \ 进一步说明了这一过程。\n\n# 图 7-5 分离的类规格、实现和客户端代码文件\n\n![一张图表说明了类规格、实现和客户端代码文件的过程](img/FG_07_005.png)图\
  \ 7-5 分离的类规格、实现和客户端代码完整替代文本\n\n这些步骤如何执行的具体细节在每个 C++ 开发系统中都是不一样的。幸运的是，大多数系统都会自动为你完成所有这些步骤。例如，在\
  \ Microsoft Visual C++ 中，你先创建一个项目，然后简单地将所有文件添加到项目中。当你编译项目时，这些步骤就会为你完成，并生成一个可执行文件。一旦创建了可执行文件，你就可以运行程序。当为\
  \ `boxLength` 和 `boxWidth` 输入有效值时，输出应与 程序 7-3 所示的内容相同。\n\n### 注意\n\n关于创建多文件项目的额外信息，可以在该书籍辅助网站的\
  \ 附录 G 中找到，网址为 [pearsonhighered.com/gaddis](http://pearsonhighered.com/gaddis)。\n\
  \n# 使用多个文件的优势\n\n将客户端程序与其使用的类的细节分离开被认为良好的编程实践。类是抽象数据类型的示例，正如你在本章前面学到的那样，编写使用该类的程序的程序员唯一需要知道的是类是做什么的、它能存储什么类型的数据、它提供了哪些函数以及如何调用这些函数。程序员以及任何使用该类的程序不需要知道关于类实现的任何信息。此外，许多不同的程序会使用同一个类。如果定义类成员函数的实现代码位于其单独的文件中，那么这些代码不需要出现在所有这些程序中。它们只需要简单地\
  \ `#include` 包含定义的文件即可。\n\n将类拆分为规格文件和实现文件也被认为是良好的编程实践。如果你想将你的类给其他程序员，你不需要共享所有的源代码。你只需要提供规格文件的副本和该类实现的编译后的对象文件即可。其他程序员只需要在他们的程序中插入必要的\
  \ `#include` 指令，对它们进行编译，并将它们与你的类对象文件链接在一起。这防止了可能不理解你代码所有细节的其他程序员做出引入 bug 的更改。\n\n\
  将类拆分为规格文件和实现文件在必须修改类成员函数时也能让事情变得更简单。只需要修改实现文件并重新编译它以创建一个新的对象文件。使用该类的程序不需要重新编译。它们只需要与新的对象文件进行链接即可。\n\
  \n# 在类对象中执行输入/输出\n\n你可能已经注意到 程序 7-12 中，我们避免了在 `Rectangle` 类内部进行任何 I/O 操作。通常，让类成员函数避免使用\
  \ `cin` 和 `cout` 被认为是良好的设计。这样做是为了任何编写使用该类的程序的人都不会被局限于类执行输入或输出的特定方式。除非类被专门设计用于执行\
  \ I/O，否则最好将用户输入和输出等操作交给应用程序的设计者。作为一条一般规则，类应该提供成员函数来获取数据值，而不是在屏幕上显示它们。同样，它们应该提供成员函数将数据存储到私有成员变量中而不使用\
  \ `cin`。程序 7-12 遵循了这两项实践。\n\n### 注意\n\n在某些情况下，类执行 I/O 是合适的。例如，一个类可以设计为在屏幕上显示菜单并获取用户的选择。另一个例子是用于处理程序文件\
  \ I/O 的类。然而，持有和操作数据的类不应该与任何特定的 I/O 例程绑定。这使得它们更具活性。\n\n## 检查点\n\n1. 7.24 假设存在以下组件：\n\
  \    * `BasePay` 类声明\n    * `Overtime` 成员函数\n    * `Overtime` 类声明\n    * `BasePay`\
  \ 成员函数\n你会如何使用它们？包含哪些头文件？\n2. 7.25 类的实例有哪些？\n\n# 7.12 结构体\n\n### 概念\n\nC++ 允许将一组变量组合成称为结构体的单元。结构体是一种程序员定义的类型，可以存储许多数据。在过去，在面向对象编程流行之前，程序员通常使用它们将逻辑连接的数据分组到一个单元中。一旦声明了结构类型，就可以创建该类型的多个变量。\n\
  \n结构的声明方式与类的声明方式相似，有以下不同：\n\n* 使用 `struct` 关键字代替 `class`。\n* 虽然结构可以包含成员函数，但很少这样做。因此结构声明通常只声明变量。\n\
  * 结构声明通常不包含访问限定符 `public` 或 `private`。\n* 与默认私有的类成员不同，结构的成员默认是公开的。程序员通常希望它们保持公开并直接使用默认值。\n\
  \n这里有一个汇总工资数据的结构声明示例。这个特定的结构名为 `Payroll`。注意它以大写字母开头。惯例是像类名一样以大写字母开头。同样注意，和类声明一样，右括号后面必须有一个分号。\n\
  \n```cpp\nstruct Payroll\n{\n   int     empNumber;\n   string  name;\n   double\
  \  hours,\n           payRate,\n           grossPay;\n};\n```\n\n类声明在创建类对象之前不会实例化一样，结构声明也不会创建任何结构实例。示例中的结构声明只是告诉编译器\
  \ `Payroll` 结构是什么样的。它在本质上创建了一个名为 `Payroll` 的新数据类型。\n\n你定义 `Payroll` 结构变量就像定义任何变量一样，先列出数据类型，然后是变量名。以下定义创建了三个\
  \ `Payroll` 结构变量。\n\n```cpp\nPayroll deptHead, foreman, associate;\n```\n\n每个图 7-6\
  \ 都是 `Payroll` 结构的实例，分配了独立的内存来存储其成员数据。注意，尽管这三个结构变量有不同的名称，但每个变量都包含同名的成员。图 7-6 说明了这一点。\n\
  \n\n\n\n\n# 访问结构体成员\n\n结构体的成员访问方式与类的公共成员相同，使用点运算符（`.`）。然而，类的数据成员通常是私有的，必须通过函数进行访问。由于结构体的数据成员是公开的，因此可以直接被访问并可以像普通变量一样使用。以下语句为我们创建的每个\
  \ `Payroll` 变量的 `empNumber` 成员赋值。\n\n```\ndeptHead.empNumber = 475;\nforeman.empNumber\
  \ = 897;\nassociate.empNumber = 729;\n```\n\n以下语句显示了 `deptHead` 所有成员的内容。\n\n```\n\
  cout << deptHead.empNumber << endl;\ncout << deptHead.name << endl;\ncout << deptHead.hours\
  \ << endl;\ncout << deptHead.payRate << endl;\ncout << deptHead.grossPay << endl;\n\
  ```\n\n程序 7-13 是一个使用 `Payroll` 结构体的完整程序。注意各个结构体成员是如何像普通变量一样在 `cin` 语句、`cout` 语句以及数学运算中的。\n\
  \n在程序 7-13 中，变量 `employee` 在第 17 行被定义为 `Payroll` 结构体的实例。然后，可以通过变量名通过点运算符访问它的五个数据成员。例如，在第\
  \ 22 行中，以下语句将一个值读入变量的 `empNumber` 成员中。\n\n```\ncin  >> employee.empNumber;     \
  \  // 正确\n```\n\n通过结构体类型的名称尝试访问此成员是错误的。\n\n```\ncin  >> Payroll.empNumber;     \
  \   // 错误！\n```\n\n# 显示和比较结构体变量\n\n在程序 7-13 中，`employee` 结构体变量的每个成员都被单独显示。这是必要的，因为不能简单通过将整个变量传递给\
  \ `cout` 来显示结构体变量的所有内容。例如，以下语句不起作用。\n\n```\ncout << employee << endl;          \
  \     // 错误！\n```\n\n同样，虽然比较两个单独成员的内容，但不能对整个结构体执行比较操作。例如，如果 `employee1` 和 `employee2`\
  \ 都是 `Payroll` 结构体变量，这种比较会导致错误。\n\n```\nif (employee1 == employee2)            \
  \ // 错误！\n```\n\n然而，下面的比较是完全合。\n\n```\nif (employee1.hours == employee2.hours) //\
  \ idea\n```\n\n# 初始化结构体\n\n结构体变量在定义时有两种初始化方式：使用初始化列表或使用构造函数。\n\n初始化结构体变量成员的最简单方法是使用初始化列表。`初始化列表`是一个用于初始化一组内存位置的值列表。列表中的项用逗号分隔，并用大括号括起来。假设已经声明了以下\
  \ `Date` 结构体：\n\n```\nstruct Date\n{  int day,\n       month,\n       year;\n};\n\
  ```\n\n现在，可以通过在变量名后跟随赋值运算符和初始化列表来定义并初始化 `Date` 变量，如下所示：\n\n```\nDate birthday =\
  \ {23, 8, 1983}; \n```\n\n该语句将 `birthday` 定义为 `Date` 结构体变量。大括号内的值按顺序分配给它的成员。因此，`birthday`\
  \ 的数据成员已如图 7-7 所示所示初始化。\n\n# 图 7-7 用数据初始化的生日对象\n\n![图表显示了生日对象的成员及其初始化的值。](img/FG_07_007.png)图\
  \ 7-7 完整替代文本\n\n也可以只初始化结构体变量的部分成员。例如，如果我们知道要存储的生日是 8 月 23 日，但不知道年份，变量可以这样定义：\n\n\
  ```\nDate birthday = {23, 8};\n```\n\n也可以只初始化结构体变量的部分成员。例如，如果我们知道要存储的生日是 8 月 23\
  \ 日，但不知道年份，变量可以这样定义：\n\n```\nDate birthday = {23, 8};\n```\n\n# 嵌套结构体\n\n就像一个类的对象可以嵌套另一个类中，一个结构体的实例也可以嵌套另一个结构体中。例如，考虑以下声明：\n\
  \n```\nstruct Costs\n{\n   double wholesale;\n   double retail;\n};\n\nstruct Item\n\
  {\n   string partNum;\n   string description;\n   Costs pricing;\n};\n```\n\n`Costs`\
  \ 结构体有两个 `double` 成员：`wholesale` 和 `retail`。`Item` 结构体有三个成员。前两个 `partNum` 和 `description`\
  \ 是 `string` 对象。第三个 `pricing` 是嵌套的 `Costs` 结构体。如果 `widget` 被定义为 `Item` 结构体，图 7-8\
  \ 说明了它的成员。\n\n它们的访问方式如下：\n\n```\nwidget.partnum = \"123A\";\nwidget.description\
  \ = \"iron widget\";\nwidget.pricing.wholesale = 100.0;\nwidget.pricing.retail =\
  \ 150.0;\n```\n\n\n\n\n注意 `wholesale` 和 `retail` 并不是 `widget` 的成员；而 `pricing` 是。要访问\
  \ `wholesale` 和 `retail`，必须先访问 `widget` 的 `pricing` 成员，然后因为它是一个 `Costs` 结构体，就可以访问它的\
  \ `wholesale` 和 `retail` 成员。同样注意，与所有结构体一样，访问成员时必须使用 `member` 名称，而不是 `structure`\
  \ 名称。以下语句将是不合法的。\n\n```\ncout << widget.retail;            // 错误！\ncout << widget.Costs.wholesale;\
  \   // 错误！\n```\n\n当你决定是否使用嵌套结构体时，请考虑各种成员之间的关系。结构体将逻辑上属于的项打包在一起。通常，结构体的成员是描述某个对象的属性。在我们的示例中，对象是一个\
  \ `widget`，它的部分号、描述以及批发价和零售价就是它的属性。当某些属性之间相互关联并形成对象属性的逻辑子组时，将它们打包在一起并使用嵌套结构体是有意义的。注意程序\
  \ 7-14 中内部结构中属性的关联性，它使用了嵌套结构体。\n\n#  own 点\n\n1. 7.26 为一个名为 `Student` 的结构体编写一个声明，用于存储关于该学生的以下数据：\n\
  \    * ID (`int`)\n    * 入学年份 (`int`)\n    * GPA (`double`)\n\n    然后编写定义语句来创建以下两个\
  \ `Student` 变量并使用初始化列表对其进行初始化。\n    * 变量 `s1` 的 ID 号为 1234，入学年份为 2008，GPA 为 3.41。\n\
  \    * 变量 `s2` 的 ID 号为 5678，入学年份为 2010。`GPA` 成员保持未初始化。\n\n2. 7.27 为一个名为 `Account`\
  \ 的结构体编写声明，用于存储关于储蓄账户的以下数据。包含一个构造函数，允许为所有四个成员传递数据值。\n    * 账号 `(string)`\n    *\
  \ 账户余额 `(double)`\n    * 利率 `(double)`\n    * 平均月余额 (`double`)\n\n    现在，为一个 `Account`\
  \ 变量编写一个定义语句，用以下数据初始化成员：\n    * 账号：ACZ42137\n    * 账户余额：$4512.59\n    * 利率：4%\n\
  \    * 平均月余额：$4217.07\n\n3. 7.28 下面的程序骨架在完成后，将要求用户输入有关其最喜爱的电影的以下信息：\n    * 电影名称\n\
  \    * 电影导演名称\n    * 电影上映年份\n\n    通过声明存储这些信息的结构体、定义结构体变量并编写所需的各个语句来完成该程序。\n\n```\n\
  #include <iostream>\n#include <string>\nusing namespace std;\n\n// 编写存储电影信息的结构体声明。\n\
  \nint main()\n{\n   // 在此处定义结构体变量。\n\n   cout << \"Enter the following information\
  \ about your \"\n        << \" favorite movie.\\n\" << \"Name: \";\n   // 在此处编写语句，让用户输入电影名称。\n\
  \       // 将其存储在相应的结构体成员中。\n\n   cout << \"Director: \";\n   // 在此处编写语句，让用户输入导演\n\
  \   // 名称。将其存储在相应的结构体成员中。\n\n   cout << \"Year of Release: \";\n   // 在此处编写语句，让用户输入电影\n\
  \   // 上映年份。将其存储在相应的结构体成员中。\n\n   cout << \"\\nHere is information on your favorite\
  \ movie:\\n\";\n   // 在此处编写语句，显示刚刚\n   // 输入结构体变量的信息。\n   return 0;\n}\n```\n\n\
  4. 7.29 为一个名为 `Location` 的结构体编写声明，带有三个 `double` 成员变量：`latitude`、`longitude` 和 `height`。\n\
  \n5. 7.30 为一个名为 `City` 的结构体编写声明，它拥有成员 `cityName`（`string` 类型）和 `position`（`Location`\
  \ 结构体，已在上方定义）。然后定义一个变量 `destination`，它是 `City` 结构体的实例。\n\n6. 7.31 编写赋值语句，将以下信息存储在\
  \ `destination` 中。\n\n```\ncity name    :   Tupelo\nlatitude     :   34.28     \
  \ // 北纬 34.28 度\nlongitude    :   −88.77     // 西经 88.77 度\nheight       :   361.0\
  \      // 海平面以上 361 英尺\n```\n\n# 将结构体传递给函数\n\n结构体变量就像类对象一样，可以通过值、引用和常量引用传递给函数。默认情况下，它们按值传递。这意味着会创建整个原始结构的副本并传递给函数。除非结构体非常小，否则不希望花费时间复制整个结构，因此结构体通常通过引用传递给函数。然而，这使得函数具有访问原始结构成员变量的权限，允许其更改它们。如果你不希望函数更改任何成员变量的值，则应将结构体变量作为常量引用传递给它。程序\
  \ 7-15 这种修改（注：此处原文为 Program 7-9，但链接指向 7-15，是基于上下文的翻译）。\n\n# 从函数返回结构体\n\n结构体也可以从函数返回。在这种情况下，函数的返回类型是结构体的名称。程序\
  \ 7-15 可以被编写为允许 `getItemData` 函数创建一个 `InvItem` 实例，将数据放入其成员，然后将其传回 `main`，而不是从 `main`\
  \ 接收。这是修改后的 `getItemData` 函数的样子。\n\n```cpp\n/********************************\n\
  \ *                        getItemData                          \n * 此函数将用户输入的数据存储在本地\n\
  \ * InvItem 变量的成员中，并返回它。              \n * *********************************\n\n\
  InvItem getItemData()   \n{\n   InvItem item;          // 创建本地 InvItem 变量\n    \
  \                      // 持有数据直到可以返回。\n   cout << \"Enter the part number: \";\n\
  \   cin >> item.partNum;\n   cout << \"Enter the part description: \";\n   cin.get();\
  \             // 跳过输入输入\n                          // 留下的 '\\n'。\n   getline(cin,\
  \ item.description);\n   cout << \"Enter the quantity on hand: \";\n   cin >> item.onHand;\n\
  \   cout << \"Enter the unit price: \";\n   cin >> item.price;\n\n   return item;\n\
  }\n```\n\n在 `main` 中调用方式如下：\n\n```cpp\npart = getItemData();\n```\n\n此版本的程序 7-15\
  \ 可以在书籍配套网站的第 7 章程序文件夹中作为 `pr7-15B.cpp` 找到。\n\n### 注意\n\n在第 6 章中你学到 C++ 只允许从函数返回单个值。然而，类和结构体提供了绕过这一限制的方法。尽管它们可能有多个成员，每个类或结构体的实例在技术上都是单个对象。通过将多个值封装在类或结构体中，你可以从函数返回任意数量的值。\n\
  \n# 题点\n\n使用以下结构体声明来回答本节的问题。\n\n\n\n\n```cpp\nstruct Rectangle\n{\n   int length;\n\
  \   int width;\n};\n```\n\n1. 7.32 编写一个函数，接受上面定义的`Rectangle`结构体作为参数，并在屏幕上显示该结构体的内容。\n\
  2. 7.33 编写一个函数，使用`Rectangle`结构体引用变量作为参数，并将用户的输入存储在结构体的成员中。\n3. 7.34 编写一个返回`Rectangle`结构体的函数。该函数应该创建一个局部`Rectangle`变量，将用户的输入存储在它的成员成员中，然后将其返回。\n\
  \n# 7.13 关于枚举数据类型\n\n### 概念\n\n枚举数据类型可以提高程序的可读性。\n\n在[第 4 章]中，你已经接触了枚举数据类型。正如你所记得的，这些是程序员定义的数据类型，由一组被称为枚举常量（enumerators）的值组成，这些值表示整数常量。在本节中，我们将进一步探索它们的用法，并检查你可以对它们做和不能做的事情。\n\
  \n## 在一条语句中声明 `enum` 数据类型并定义变量\n\n以下代码使用两行来声明一个枚举数据类型并定义该类型的变量。\n\n```cpp\nenum\
  \ Car { PORSCHE, FERRARI, JAGUAR };\nCar sportsCar;\n```\n\n然而，C++ 允许你在同一语句中声明枚举数据类型并定义该类型的一个或多个变量。因此，之前的代码可以写成：\n\
  \n```cpp\nenum Car { PORSCHE, FERRARI, JAGUAR } sportsCar;\n```\n\n以下语句声明了 `Car`\
  \ 数据类型并定义了两个变量`myCar` 和 `yourCar`。\n\n```cpp\nenum Car { PORSCHE, FERRARI, JAGUAR\
  \ } myCar, yourCar;\n```\n\n## 将整数赋值给 `enum` 变量\n\n尽管枚举数据类型的常量以整数形式存储在内存中，但你不能直接将整数值赋值给`enum`变量。例如，假设我们有一个程序包含以下声明：\n\
  \n```cpp\nenum Day { MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY };\nDay today;\n\
  ```\n\n我们现在可以写如下赋值语句：\n\n```cpp\ntoday = THURSDAY;\n```\n\n然而，正如你在[第 4 章]中所学到的，以下语句是非法的，如果你尝试编译它，将产生错误消息。\n\
  \n```cpp\ntoday = 3;  // 错误！ \n```\n\n在给`enum`变量赋值时，你应该使用有效的枚举常量。但是，如果情况需要你在`enum`变量中存储整数值，你可以通过将整数转换为`enum`数据类型来实现。这里有一个例子：\n\
  \n```cpp\ntoday = static_cast<Day>(3);\n```\n\n这条语句产生的结果与以下语句相同：\n\n```cpp\ntoday\
  \ = THURSDAY;\n```\n\n## 将枚举常量赋值给 `int` 变量\n\n虽然不能直接将整数值赋值给`enum`变量，但你*可以*直接将枚举常量赋值给整数变量。例如，以下代码可以正常工作。\n\
  \n```cpp\nenum Day { MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY };\nint today\
  \ = THURSDAY;\nDay workday = FRIDAY;\nint tomorrow = workday;\ncout << today <<\
  \ \"  \" << tomorrow << endl;\n```\n\n当这段代码运行时，它将显示 3 4。\n\n## 使用数学运算符更改 `enum`\
  \ 变量的值\n\n尽管枚举常量实际上是整数，且`enum`变量实际上持有整数值，但当你尝试对它们进行数学运算时，可能会遇到问题。例如，看以下代码。\n\n```cpp\n\
  Day day1, day2;    // 定义两个 Day 变量\nday1 = TUESDAY;    // 将 TUESDAY 赋值给 day1\nday2\
  \ = day1 + 1;   // 错误！ 这不起作用\n```\n\n第三条语句导致了问题，因为表达式`day1 + 1`的结果是整数值 2。赋值运算符随后尝试将整数值\
  \ 2 赋值给枚举变量`day2`。正如之前讨论过的，由于 C++无法将`int`隐式转换为`Day`，会发生错误。你可以像上面那样使用强制类型转换将结果显式转换为`Day`数据类型，如下：\n\
  \n```cpp\nday2 = static_cast<Day>(day1 + 1); // 这种可行\n```\n\n## 使用枚举常量输出值\n\n正如你已经看到的，将枚举常量发送到`cout`会显示该常量的整数值。例如，假设我们使用之前描述的`Day`类型，以下语句显示\
  \ 0。\n\n```cpp\ncout << MONDAY << endl;\n```\n\n如果你想使用枚举常量显示诸如“Monday”之类的字符串，你必须编写生成它的代码。例如，如果`workDay`是一个`Day`变量，接如下`switch`语句：\n\
  \n```cpp\nswitch(workDay) {\n  case MONDAY: cout << \"Monday\"; break;\n  case TUESDAY:\
  \ cout << \"Tuesday\"; break;\n  case WEDNESDAY: cout << \"Wednesday\"; break;\n\
  \  case THURSDAY: cout << \"Thursday\"; break;\n  case FRIDAY: cout << \"Friday\"\
  ; break;\n}\n```\n\n## 使用枚举常量控制循环\n\n由于枚举常量作为整数存储，你可以使用它们来控制循环。然而，正如上面提到的，在先将其转换回枚举之前，你不能使用数学运算的结果。\n\
  \n```cpp\nfor (int i = 0; i < 5; i++) {\n  Day d = static_cast<Day>(i);\n  // ...\n\
  }\n```\n\n## 11 C++ 中类强类型 enum\n\nC++ 不允许在作用域内存在相同名的枚举常量。也就是说，同一个常量名不能是两个不同数据类型的成员。然而，C++11\
  \ 引入了一种新类型的`enum`，被称为*强类型枚举*（也称为*enum class*），以解决这一局限。这里是强类型`enum`的两个示例：\n\n```cpp\n\
  enum class Presidents { MCKINLEY, ROOSEVELT, TAFT };\nenum class VicePresidents\
  \ { ROOSEVELT, FAIRBANKS, SHERMAN };\n```\n\n这些语句声明了两个强类型枚举`Presidents`和`VicePresidents`。注意它们看起来像普通的`enum`声明，区别在于`enum`后面出现了`class`一词。尽管两个枚举包含相同的常量`ROOSEVELT`，但这些声明编译时不会报错。\n\
  \n然而，当你使用强类型枚举数据类型时，必须在引用的每个常量之前加上所属枚举的名称，并跟上`::`运算符。这里有三个例子：\n\n```cpp\nPresidents\
  \ prez = Presidents::ROOSEVELT;\nVicePresidents vp1 = VicePresidents::ROOSEVELT;\n\
  VicePresidents vp2 = VicePresidents::SHERMAN;\n```\n\n第一条语句定义了一个名为`prez`的`Presidents`变量，并用`Presidents::ROOSEVELT`常量初始化它。第二条语句定义了一个名为`vp1`的`VicePresidents`变量，并用`VicePresidents::ROOSEVELT`常量初始化它。第三条语句定义了一个名为`vp2`的`VicePresidents`变量，并用`VicePresidents::SHERMAN`常量初始化它。注意，尽管常量`SHERMAN`只是其中一个枚举数据类型的成员，它仍然必须以所属枚举的名称作为名前缀。\n\
  \n\n\n\n\n这是一个 `if` 语句的示例，它将 `prez` 变量与枚举值进行比较：\n\n```\nif (prez == Presidents::ROOSEVELT)\n\
  \    cout << \"Roosevelt is president!\\n\";\n```\n\n强类型枚举像普通枚举一样存储为整数。然而，如果你想获取强类型枚举的底层整数值，则必须使用转换操作符。下面的示例将\
  \ `Presidents::ROOSEVELT` 枚举的底层整数值赋值给变量 `x`。\n\n```cpp\nint x = static_cast<int>(Presidents::ROOSEVELT);\n\
  ```\n\n这是另一个示例。它显示了 `Presidents::TAFT` 和 `Presidents::MCKINLEY` 枚举的整数值：\n\n```cpp\n\
  cout << static_cast<int>(Presidents::ROOSEVELT) << \"  \" \n     << static_cast<int>(Presidents::TAFT)\
  \ << endl;\n```\n\n当你声明一个强类型 `enum` 时，可以可选地指定任何整数数据类型作为底层类型。你只需要在 `enum` 名称后面写一个冒号\
  \ `(:)`，然后跟跟所需的数据类型。例如，接下来的语句声明了一个使用 `char` 数据类型作为枚举类型的 `enum`：\n\n```cpp\nenum\
  \ class Day : char { MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY };\n```\n\n下面的语句是另一个示例。该语句声明了一个名为\
  \ `Water` 的 `enum`，它使用 `unsigned` 作为枚举的数据类型。此外，还给枚举分配了值。\n\n```cpp\nenum class Water\
  \ : unsigned { FREEZING = 32, BOILING = 212 };\n```\n\n`Program 7-16` 演示了强类型枚举数据类型的使用。\n\
  \n# 7.14 Home Software 公司 OOP 案例研究\n\n你是 Home Software 公司的一名程序员，负责开发一个模拟银行账户基本工作的类。该类应该执行以下任务：\n\
  \n* 保存账户余额。\n* 保存账户上执行的交易次数。\n* 允许对账户进行存款。\n* 允许从账户中取款。\n* 计算该期间的利息。\n* 随时报告当前账户余额。\n\
  * 随时报告当前的交易次数。\n\n## 私有成员变量\n\n`Table 7-2` 列出了该类所需的私有成员变量。\n\n## Table 7-2 Account\
  \ 类的私有成员变量\n\n| 变量 | 描述 |\n| --- | --- |\n| `balance` | 一个存储当前账户余额的 `double` 类型\
  \ |\n| `intRate` | 一个存储该期间利率的 `double` 类型 |\n| `interest` | 一个存储当前期间所得利息的 `double`\
  \ 类型 |\n| `transactions` | 一个存储当前交易次数的整数 |\n\n## 公有成员函数\n\n`Table 7-3` 列出了该类中的公共成员函数。\n\
  \n## Table 7-3 Account 类的公共成员函数\n\n| 函数 | 描述 |\n| --- | --- |\n| constructor | 接收参数并将其初始存储在\
  \ `balance` 和 `intRate` 成员中。余额的默认值为 0，利率的默认值为 0.045。 |\n| `makeDeposit` | 接收一个 `double`\
  \ 类型参数作为存款金额。该参数被加到 `balance`。 |\n| `withdraw` | 接收一个 `double` 类型参数作为取款金额。除非取款金额大于余额，否则该值将从余额中减去。如果发生这种情况，函数将报告错误。\
  \ |\n| `calcInterest` | 不接收参数。此函数计算当前期间的利息金额，将此值存储在 `interest` 成员中，然后将其加到 `balance`\
  \ 成员中。 |\n| `getBalance` | 返回当前余额（存储在 `balance` 成员中）。 |\n| `getInterest` | 返回当前期间的利息（存储在\
  \ `interest` 成员中）。 |\n| `getTransactions` | 返回当前期间的交易次数（存储在 `transactions` 成员中）。\
  \ |\n\n## 类声明\n\n下面的列表显示了类声明。\n\n## `Account.h` 的内容\n\n```cpp\n1 // Account.h 是\
  \ Account 类的规范文件。\n2 class Account\n3 {\n4  private:\n5    double balance;\n6  \
  \  double intRate;\n7    double interest;\n8    int transactions;\n9  public:\n\
  10\n11 // 构造函数\n12    Account(double rate = 0.045, double bal = 0.0)\n13    {balance\
  \ = bal; intRate = rate;\n14       interest = 0.0; transactions = 0;\n15    }\n\
  16\n17    void makeDeposit(double amount)\n18    {balance += amount;\n19       transactions++;\n\
  20    }\n21\n22    bool withdraw(double amount); // 在 account.cpp 中定义\n23\n24  \
  \  void calcInterest()\n25    {interest = balance * intRate;\n26       balance +=\
  \ interest;\n27    }\n28\n29    double getBalance()\n30    {return balance;}\n31\
  \    }\n32\n33    double getInterest()\n34    {return interest;}\n35    }\n36\n\
  37    int getTransactions()\n38    {return transactions;}\n39 };\n```\n\n## `withdraw`\
  \ 成员函数\n\n唯一没有在类声明中定义的成员函数是 `withdraw`。该函数的目的是从 `balance` 中减去取款金额。然而，如果取款金额大于余额，则不进行取款。\n\
  \n## `Account.cpp` 的内容\n\n```cpp\n1 // Account.cpp 是 Account 类的函数文件。\n2 #include\
  \ \"Account.h\"\n3 \n4 bool Account::withdraw(double amount)\n5 {\n6    if (balance\
  \ < amount)\n7       return false;   // 余额不足\n8    else\n9    {\n10       balance\
  \ -= amount;\n11       transactions++;\n12       return true;\n13   }\n14 }\n```\n\
  \n## 类接口\n\n`balance`、`intRate`、`interest` 和 `transactions` 成员变量是私有的，因此对外部隐藏。这是因为直接访问这些变量的程序员可能会无意中犯下任何错误：\n\
  \n* 在不增加交易次数的情况下进行存款或取款。\n* 取款金额超过余额。这会导致 `balance` 成员变为负值。\n* 计算了利率并调整了 `balance`\
  \ 成员，但利息金额没有记录在 `intRate` 成员中。\n* 使用了错误的利率。\n\n由于可能出现这些错误，类包含了公共成员函数，以确保在操作账户时采取正确的步骤。\n\
  \n## 实现类\n\n`Program 7-17` 展示了 `Account` 类的实现。它提供了一个菜单用于显示储蓄账户的余额、交易次数和所得利息。它还允许用户向账户存款、从账户取款以及计算当前期间的利息。该程序所需的所有文件位于书籍配套网站的第\
  \ 7 章程序文件夹中。\n\n\n\n\n到目前为止，你已经学习了编写类的基础知识、从类创建对象，以及使用对象执行操作。这些知识对于创建一个面向对象的应用程序是必要的，但它并不是设计应用程序的第一步。首先，程序员或分析师必须仔细分析要解决的问题，以准确确定程序必须能够做什么。在面向对象编程（OOP）术语中，程序开发的这一阶段被称为`面向对象分析阶段`。在这一期间，将确定需要哪些类。\n\
  \n面向对象分析的流程通常包括以下步骤：\n\n1.  识别程序中将使用的类和对象。\n2.  为每个类定义属性（attributes）。\n3.  为每个类定义行为（behaviors）。\n\
  4.  定义类之间的关系。\n\n让我们更仔细地观察每一个步骤。\n\n# 1. 识别类和对象\n\n记住，类是一个包，由数据和对数据执行操作的过程组成。为了确定程序中将出现的类，程序员应该考虑主要的数据元素，并决定每个类需要哪些过程或动作。例如，考虑一家使用面向对象程序来输入客户订单的餐厅。客户订单是一份包含菜单项及其相应价格列表。餐厅使用此列表向客户收费，因此可以创建一个类来对其进行建模。此外，餐厅的菜单有几个主菜、前菜、配菜和饮料可供选择。也可以设计一个类来表示菜单项。\n\
  \n类可以轻松设计为对现实世界对象建模，例如客户订单和餐厅的菜单项。以下是其他可能作为程序中类候选的项目类型：\n\n*   用户界面组件，如窗口、菜单和对话框\n\
  *   输入/输出设备，如键盘、鼠标、显示器和打印机\n*   物理对象，如车辆、机器或制成品\n*   记录保存项目，如客户历史和薪资记录\n*   人类扮演的角色（员工、客户、教师、学生等）\n\
  \n# 2. 定义每个类的属性\n\n类的`attributes`（属性）是用于描述从该类实例化的对象的数据元素。它们是对象在程序中正常运行所需的值。使用餐厅的例子，这里是一个`menuItem`（菜单项）类可能的规格说明开头。\n\
  \n```\nClass name: MenuItem\nAttributes: itemName\n               price\n      \
  \         category      // 1 = 前菜, 2 = 沙拉,   3 = 主菜\n                          \
  \   //   4 = 配菜, 5 = 甜点, 6 = 饮料\n```\n\n这是`CustomerOrder`（客户订单）类可能的规格说明开头。\n\n```\n\
  Class name: CustomerOrder\nAttributes: orderNumber\n               tableNumber\n\
  \               serverNumber\n               date\n               items      //\
  \ MenuItem 对象的列表\n               totalPrice\n               tip\n```\n\n# 3. 定义每个类的行为\n\
  \n一旦定义了类的属性，程序员必须识别每个类必须能够执行的活动，或`behaviors`（行为）。例如，`MenuItem`类应该能够执行的一些活动包括：\n\n\
  *   更改价格\n*   显示价格\n\n`CustomerOrder`类应该能够执行的某些活动包括：\n\n*   接收新订单的信息\n*   向现有订单中添加项目\n\
  *   返回之前存储的订单的任何信息\n*   计算订单上所有项目的总价\n*   为厨房打印订购项目列表\n*   为顾客打印账单\n\n在 C++ 中，类的行为是它的`member\
  \ functions`（成员函数）。\n\n# 4. 定义类与类之间的关系\n\n我们面向对象分析阶段的最后一步是定义程序中类与类之间存在的关系。可能的关系可以正式表述为：\n\
  \n*   访问（Access）\n*   所有权（组合，Composition）\n*   继承（Inheritance）\n\n非正式地，这三种关系可以描述为：\n\
  \n*   使用（Uses-a）\n*   拥有（Has-a）\n*   是（Is-a）\n\n第一种关系访问，允许一个对象修改另一个对象的属性。通常，一个对象拥有对象外部部分无法访问的属性。这些被称为私有属性（private\
  \ attributes）。两个对象之间的访问关系意味着一个对象将访问另一个对象的私有属性。当这种关系存在时，可以说一个对象`uses`了另一个对象。\n\n\
  第二种关系所有权，意味着一个对象拥有另一个对象作为其成员之一。例如，在我们的餐厅示例中，`CustomerOrder`类有一个`MenuItem`对象的列表作为它的属性之一。在\
  \ OOP 术语中，这种关系也被称为`composition`（组合）。\n\n第三种关系是继承。有时一个类基于另一个类。这意味着一个类是另一个类的特殊情况。例如，考虑一个使用代表汽车、卡车和喷气式飞机的类的程序。尽管现实世界的这三类非常不同，但它们有许多共同特征：它们都是交通工具，并且都载有一定数量的乘客。因此，三个类中的每一个都可以基于一个`Vehicle`（车辆）类，该类具有它们共有的属性和行为。这在图\
  \ 7-9 中所示。\n\n# 图 7-9 基类和派生类\n\n![树形图展示了一个基类和三个派生类。](img/FG_07_009.png)图 7-9 基类和派生类替代文本\n\
  \n在 OOP 术语中，`Vehicle`类是`base class`（基类），`Car`、`Truck`和`Jet Plane`类是`derived classes`（派生类）。`Vehicle`类的的所有属性和行为都被`Car`、`Truck`和`Jet\
  \ Plane`类继承。这种关系意味着汽车是一种车辆，卡车是一种车辆，喷气式飞机是一种车辆。\n\n除了继承基类的属性和行为外，派生类还会添加自己的。例如，`Car`类可能具有表示它是轿车还是跑车及其引擎类型的属性和行为。`Truck`类可能具有表示其最大载重量以及两次加油之间里程数的属性和行为。`Jet\
  \ Plane`类可能具有表示其高度和航向的属性和行为。这些派生类的组件使得它们比基类更具专门性。\n\n这三种类之间的关系——访问、所有权和继承，将在第 11\
  \ 章中进一步讨论](#fileP700101608900000000000000000629F.xhtml_P7001016089000000000000000006308)。\n\
  \n一旦对企业及其操作进行了分析，就可以对每个类进行设计，并开发一套程序来自动执行某些操作。\n\n# 寻找类\n\n\n\n\n\n`problem domain`（问题领域）是与问题相关的现实世界对象、实体和重大事件集合。如果你理解你正试图解决的问题的本质，你可以自己编写一份问题领域的描述。如果你不完全理解它，则应该让专家为你编写描述。\n\
  \n例如，假设我们正在编写一个应用程序，Joe 汽车修理厂（Joe’s Automotive Shop）的经理将用它为客户打印服务报价单。以下是一个专家（也许是\
  \ Joe 本人）编写的描述：\n\nJoe 汽车修理厂负责维修进口汽车，并专门维修梅赛斯、保捷和宝马制造的汽车。当客户把车带到修理厂时，经理会获取客户的名字、地址和电话号码。然后，经理确定汽车的品牌、型号和年份，并给客户提供服务报价。服务报价单显示预估的零件费用、预估的人工费用、销售税以及总预估费用。\n\
  \n问题领域的描述应包含以下任何内容\n\n* 物理对象，如车辆、机器或产品\n* 人员扮演的任何角色，如经理、员工、客户、老师或学生\n* 业务事件的结果，例如客户订单，或者在本例中为服务报价单\n\
  * 记录项，如客户历史记录和薪资记录\n\n# 识别所有名词\n\n下一步是识别所有的名词和名词短语。（如果描述中包含代词，也将它们包含在内。）再次查看之前的问题领域描述。这次名词和名词短语以粗体显示。\n\
  \n> `Joe’s Automotive Shop` 维修 `foreign cars` 并专门维修由 `Mercedes, Porsche,` 和 `BMW`\
  \ 制造的 `cars`。当一个 `customer` 把一辆 `car` 带到 `shop,` 时，`manager` 获取了 `customer’s name,\
  \ address,` 和 `telephone number`。`manager` 然后确定了 `car` 的 `make, model,` 和 `year`\
  \ 并给 `customer` 提供了一份 `service quote.` `service quote` 显示了 `estimated parts charges,\
  \ estimated labor charges, sales tax,` 以及 `total estimated charges.`\n\n注意有些名词是重复的。以下列表列出了所有名词且没有重复任何项。\n\
  \n| address | foreign cars | Porsche |\n| :--- | :--- | :--- |\n| BMW | Joe’s Automotive\
  \ Shop | sales tax |\n| car | make | service quote |\n| cars | manager | shop |\n\
  | customer | Mercedes | telephone number |\n| estimated labor charges | model |\
  \ total estimated charges |\n| estimated parts charges | name | year |\n\n# 提炼名词列表\n\
  \n出现在问题描述中的名词仅仅是成为类的候选者。可能没有必要为它们中的每一个都创建类。下一步是提炼列表，只包含解决当前特定问题所必需的类。以下是名词从潜在类列表中删除的常见原因。\n\
  \n## 一些名词的含义实际上相同\n\n在例例中，以下名词组指代同一个事物：\n\n* `cars` 和 `foreign cars` 都指代汽车的通用概念。\n\
  * `Joe’s Automotive Shop` 和 `shop` 都指代同一家修理厂。\n\n我们可以为这些每项确定一个单一的类。在这个例中，我们随机地从列表中删除\
  \ `foreign cars` 并使用单词 `cars`。同样地，我们从列表中删除 `Joe’s Automotive Shop` 并使用单词 `shop`。更新后的潜在类列表为：\n\
  \n| address | ~~foreign cars~~ | Porsche |\n| :--- | :--- | :--- |\n| BMW | ~~Joe’s\
  \ Automotive Shop~~ | sales tax |\n| car | make | service quote |\n| cars | manager\
  \ | shop |\n| customer | Mercedes | telephone number |\n| estimated labor charges\
  \ | model | total estimated charges |\n| estimated parts charges | name | year |\n\
  \n## 一些名词可能代表我们解决问题时不需要关注的项\n\n快速回顾问题描述可以提醒我们应用程序应该做什么：打印服务报价单。为了做到这一点，我们列出的潜在类中有两个是不需要的。\n\
  \n* 我们可以从列表中划掉 `shop`，因为我们的应用程序只需要关注单独的一份服务报价单。它不需要处理或确定任何公司范围的信息。如果问题描述要求我们保存所有服务报价单的总计，那么为修理厂创建一个类就是有意义的。\n\
  * 我们不需要为 `manager` 创建类，因为问题陈述没有要求我们处理关于经理的任何信息。如果有多个修理厂经理，且问题描述要求我们记录是哪个经理写了每份服务报价单，那么为经理创建一个类就是有意义的。\n\
  \n此时更新的潜在类列表为：\n\n| address | ~~foreign cars~~ | Porsche |\n| :--- | :--- | :---\
  \ |\n| BMW | ~~Joe’s Automotive Shop~~ | sales tax |\n| car | make | service quote\
  \ |\n| cars | ~~manager~~ | ~~shop~~ |\n| Customer | Mercedes | telephone number\
  \ |\n| estimated labor charges | model | total estimated charges |\n| estimated\
  \ parts charges | name | year |\n\n## 一些名词可能代表对象而不是类\n\n我们可以排除 `Mercedes`、`Porsche`\
  \ 和 `BMW` 作为类，因为在这个例中，它们都代表特定的汽车，可以被视为单个 `cars` 类的实例。我们也可以从列表中删除 `car` 这个词，因为在描述中，它指的是客户带到修理厂的某辆特定汽车。因此，它也会代表\
  \ `cars` 类的实例。此时，潜在类的更新列表为：\n\n| address | ~~foreign cars~~ | Porsche |\n| :---\
  \ | :--- | :--- |\n| BMW | ~~Joe’s Automotive Shop~~ | sales tax |\n| car | make\
  \ | service quote |\n| cars | ~~manager~~ | ~~shop~~ |\n| customer | ~~Mercedes~~\
  \ | telephone number |\n| estimated labor charges | model | total estimated charges\
  \ |\n| estimated parts charges | name | year |\n\n## 某些名词可能代表存储的简单值，不需要类\n\n记住，类包含属性和成员函数。属性是存储在类对象的相关项，定义了状态。成员函数是类对象可以执行的操作。如果一个名词代表没有身份属性或成员函数的类型，那么它可以被从列表中删除。为了帮助判断一个名词是否代表具有属性和成员函数的项，请提出以下问题：\n\
  \n* 你会使用一组相关值来表示该项目的状态吗？\n* 该项目是否有明显的操作？\n\n如果这两个问题的答案都是否，那么该名词可能代表可以存储在简单变量中的值。如果我们对列表中每个每个名词应用此测试，可以得出以下内容可能不是类：`address`、`estimated\
  \ labor charges`、`estimated parts charges`、`make`、`model`、`name`、`sales tax`、`telephone\
  \ number`、`total estimated charges` 和 `year`。这些都是可以存储在变量中的简单字符串或数值。\n\n这是更新后的潜在类列表：\n\
  \n| ~~address~~ | ~~foreign cars~~ | ~~Porsche~~ |\n| :--- | :--- | :--- |\n| ~~BMW~~\
  \ | ~~Joe’s Automotive Shop~~ | ~~sales tax~~ |\n| ~~car~~ | ~~make~~ | service\
  \ quote |\n| cars | ~~manager~~ | ~~shop~~ |\n| customer | ~~Mercedes~~ | ~~telephone\
  \ number~~ |\n| ~~estimated labor charges~~ | ~~model~~ | ~~total estimated charges~~\
  \ |\n| ~~estimated parts charges~~ | ~~name~~ | ~~year~~ |\n\n从列表中可以看出，我们删除了 `cars`、`customer`\
  \ 和 `service quote` 之外的所有内容。这意味着在我们的应用程序中，我们需要类来表示汽车、客户和服务报价单。最终，我们将编写一个 `Car` 类、一个\
  \ `Customer` 类和一个 `ServiceQuote` 类。\n\n\n\n\n\n# 识别类的职责\n\n一旦确定了类，下一个任务就是识别每个类的职责。类的\
  \ `responsibilities`（职责）包括：\n\n*   类负责知道的内容\n*   该类负责执行的动作\n\n当你确定了类负责知道的内容时，你就确定了类的属性（attributes）。同样地，当你确定了类负责执行的动作时，你就确定了它的成员函数（member\
  \ functions）。\n\n经常问诸如“在这个问题的背景下，类必须知道什么？类必须做什么？”这类问题通常非常有帮助。寻找答案的第一个地方是问题域的描述。许多类必须知道和做的事项都会被提到。然而，某些类的职责可能没有直接在问题域中被提到，因此通常需要额外的分析。让我们把这种方法应用于我们之前从问题域中识别出的类。\n\
  \n# `Customer` 类\n\n在我们问题域的背景下，`Customer` 类的任何对象必须知道什么？描述中提到了以下项目，它们都是客户的属性：\n\n\
  *   客户的名字\n*   客户的地址\n*   客户的电话号码\n\n这些都可以表示为字符串并存储在类的成员变量中的值。`Customer` 类可能还知道许多其他事情。在这一点可能会犯的一个错误是识别了太多对象应该负责知道的事情。例如，在某些应用程序中，`Customer`\
  \ 类可能知道客户的电子邮箱地址。然而，这个特定的问题域并没有提到客户的电子邮件地址被用于任何用途，因此知道它并不是该类的职责，我们不应该将其作为属性包含。\n\
  \n现在让我们识别类的成员函数。在我们问题域的背景下，`Customer` 类必须做什么？唯一显见的动作是：\n\n*   创建 `Customer` 类的对象。\n\
  *   设置和获取客户的名字。\n*   设置和获取客户的地址。\n*   设置和获取客户的电话号码。\n\n从这个列表中可以看出，`Customer` 类将需要一个构造函数，以及每个属性的访问器函数（accessor）和修改器函数（mutator）。\n\
  \n图 7-10 显示了 `Customer` 类的 UML 类图。注意，该图看起来像一个分成三个部分的简单矩形。顶部包含类名。中间部分列出了类的属性，即它的成员变量。底部部分列出了它的成员函数。每个属性左侧的减号表示它是私有的（private）。每个函数左侧的加号表示它是公有的（public）。每个属性名称后面跟着一个冒号和数据类型。每个函数名称后面跟着一对括号。如果函数接受任何参数，其参数将列在这些括号内，并带有每个参数的数据类型。括号后面是一个冒号，然后是函数的返回类型。\n\
  \n# 图 7-10 Customer 类的 UML 图\n\n![一张“UML”图显示了一个水平分为 3 部分的矩形。](img/FG_07_010.png)图\
  \ 7-10 Customer 类的 UML 图完整备用文本\n\n### 注意\n\n关于 UML 类图的更多信息可以在该书的配套网站 [pearsonhighered.com/gaddis](http://pearsonhighered.com/gaddis)\
  \ 上的 附录 F 中找到。\n\n# `Car` 类\n\n在我们问题域的背景下，`Car` 类的对象必须知道什么？以下项目都是汽车的属性，并在问题域中被提到：\n\
  \n*   汽车的品牌\n*   汽车的模型\n*   汽车的年份\n\n现在让我们识别类的成员函数。在我们问题域的背景下，`Car` 类必须做什么？再次，唯一的动作动作我们在大多数类中找到的标准成员函数：构造函数、访问器和修改器。具体来说，动作是：\n\
  \n*   创建 `Car` 类的对象。\n*   设置和获取汽车的品牌。\n*   设置和获取汽车的模型。\n*   设置和获取汽车的年份。\n\n图 7-11\
  \ 显示了此时 `Car` 类的 UML 类图。\n\n# 图 7-11 Car 类的 UML 图\n\n![一张“UML”图显示了 Car 类。](img/FG_07_011.png)图\
  \ 7-11 Car 类的 UML 图完整备用文本\n\n# `ServiceQuote` 类\n\n在我们问题域的背景下，`ServiceQuote` 类的对象必须知道什么？问题域提到了以下内容：\n\
  \n*   预估零件\n*   预估费用\n*   销售税\n*   总预估费用\n\n仔细的思考将揭示，销售税和总预估费用这些是计算的结果。为了避免持有过期数据的风险，我们不会将这些值存储在成员变量中。相反，我们将提供计算这些值的成员函数。该类需要的其他成员函数是构造函数，以及针对零件和费用的访问器和修改器。\n\
  \n图 7-12 显示了 `ServiceQuote` 类的 UML 类图。\n\n# 图 7-12 ServiceQuote 类的 UML 图\n\n![一张“UML”图显示了\
  \ “ServiceQuote” 类。](img/FG_07_012.png)图 7-12 ServiceQuote 类的 UML 图完整备用文本\n\n# 这仅仅是开始\n\
  \n你应该将本节中讨论的过程仅仅视为起点。要意识到，设计面向对象的应用程序是一个迭代过程。你可能需要多次尝试来识别所需的所有类并确定它们的所有职责。随着设计过程的展开，你将对问题有更深入的理解，从而看到改进设计的方法。\n\
  \n# 对象重用性\n\n我们提到了面向对象编程提供的许多优势。另一个是对象重用性。类不是一个独立的程序。它是一个创建供需要的程序使用的对象的机制。理想情况下，为一个程序创建的类可以做得足够通用，以便供其他程序使用。例如，`Customer`\
  \ 类可以被设计为许多拥有客户的应用程序创建对象。`Car` 类可以被设计为许多涉及车辆的程序创建对象。\n\n# 面向对象与基于对象的编程\n\n虽然类和对象是面向对象编程的基础，但仅凭它们还不足以构成真正的面向对象编程。使用它们可能更准确地被称为基于对象的编程。当我们增加定义不同对象类之间关系的能力、从其他类创建对象类的能力（继承），以及根据调用成员函数的对象来确定成员函数的行为（多态）时，它就变成了真正的面向对象编程。你将在书中后面学习这些高级的面向对象编程特性。\n\
  \n## 检查\n\n1. 7.35 什么是问题域？\n\n\n\n\n\n## 2. 7.36 在设计面向对象的应用时，谁应该来编写问题域的描述？\n\n##\
  \ 3. 7.37 如何在问题域描述中识别潜在的类？\n\n## 4. 7.38 为了确定一个类的职责，你应该问哪两个问题？\n\n## 5. 7.39 查看以下关于一个问题领域的描述：\n\
  \n一名医生在她的诊所看病人。当患者来到诊所时，医生会对患者进行一项或多项操作。每项执行的操作都有描述和标准费用。当患者离开时，他们会收到一份账单，单上显示他们的姓名和地址、所执行的操作以及这些操作的总费用。\n\
  \n假设你正在创建一个应用程序，用于生成可以打印并交给患者的账单。\n\n1. 识别该问题领域中所有潜在的类。\n2. 精炼列表，只包含解决此问题所需的类或类。\n\
  3. 识别你在步骤 B 中确定的类或或类的职责。\n\n# 7.16 屏幕控制\n\n### 概念\n\n操作系统函数允许你控制输出在控制台屏幕上的显示方式。\n\
  \n### 在屏幕上定位光标\n\n在第 5 章的“整合一切”部分，你学习了 C++ 编译器提供了特殊的库来调用操作系统函数。到目前为止，在第 5 章和第 6\
  \ 章中，我们使用了 Windows 的 `SetConsoleTextAttribute` 函数来彩色显示屏幕输出。现在我们将查看一个用于在屏幕上定位光标的\
  \ Windows 操作系统函数是`SetConsoleCursorPosition`。\n\n### 注意\n\n回顾第 5 章，操作系统函数是针对特定操作系统定制的。因此，使用这些函数的程序将只在编写它们时的系统上运行。这里描述的函数适用于\
  \ Windows 2000 及更高版本的操作系统。如果你正在使用 Linux 或 Mac OS，你的老师可能会为你提供可以在这些系统上运行的类似函数。\n\n\
  直到现在，你创建的所有程序都是从屏幕的第一行开始显示输出。每当用户按下 [Enter] 键或程序输出 `endl` 或 `\"\\n\"` 时，输出会逐行向下移动。但如果你在屏幕的第五行写内容并想返回第二行呢？或者，如果你想在屏幕正中央显示某些内容呢？在\
  \ Windows 系统上，你可以通过使用 `SetConsoleCursorPosition` 函数在写入输出之前将光标移动到所需位置来实现这些操作。\n\n\
  要使用此函数，你需要完成与第 5 章和第 6 章中使用颜色时相同的相同的两件事。你必须：\n\n* 在程序中 `#include <windows.h>`。\n\
  * 在程序中包含以下定义以创建标准输出屏幕的句柄。\n\n```\nHANDLE screen = GetStdHandle(STD_OUTPUT_HANDLE);\n\
  ```\n\n典型的文本屏幕有 25 行，每行有 80 个打印位置。这些位置中的每一个被称为一个单元格（cell）。单元格是一个可以显示单个字符的小块，通过它的行号和在该行上的位置来标识。行号范围从\
  \ 0 到 24，0 是屏幕的顶行。每行的打印位置（通常称为列）范围从 0 到 79，0 位于左侧。单元格的行和列标识了其在屏幕上的位置，被称为坐标。\n\n\
  要将光标放置在特定的屏幕单元格中，你必须通过设置 Windows 中定义的 `COORD` 结构中的两个变量来指定其单元格坐标。该结构有两个成员变量 `X` 和\
  \ `Y`，其中 `X` 存储列，`Y` 存储行。以下是该结构的样子：\n\n```\nstruct COORD\n{\n   short int X; //\
  \ 列位置\n   short int Y; // 行位置\n};\n```\n\n以下是它的使用方法。以下代码段将在标准输出的中央写入单词 `Hello`。\n\
  \n```\nHANDLE screen = GetStdHandle(STD_OUTPUT_HANDLE);\nCOORD position;    // position\
  \ 是一个 COORD 结构\nposition.X = 38;   // 设置靠近中间的列\nposition.Y = 11;   // 设置靠近中心的行\n\
  // 将光标放在那里，然后打印\nSetConsoleCursorPosition(screen, position);\ncout << \"Hello\"\
  \ << endl;\n```\n\n### 注意\n\n当你设置屏幕位置时，你必须在该处写入的所有输出后都跟上 `endl`。这对确保输出实际上显示在此位置是必须的。如果你不使用\
  \ `endl`，输出可能会被缓冲并在光标改变后很久才写入屏幕。在你的输出后跟上换行符 `'\\n'` 是不起作用，因为它不会像 `endl` 那样刷新屏幕。\n\
  \n程序 7-18 将光标定位以便在屏幕中心附近显示一组框。注意它使用了在第 5 章和第 6 章中过的 `Sleep` 函数。该函数会暂停程序执行几分之一秒，以便事件发生不会太快导致用户看不到。传递给函数的参数告诉它应该暂停多少毫秒。一毫秒是秒的千分之一。因此，例如为了暂停程序执行半秒，以下函数调用将有效：\n\
  \n```\nSleep(500);\n```\n\n程序 7-18 使用命令 `Sleep(750)` 在每个框显示后暂停程序执行 3/4 秒。\n\n###\
