  \n---\n\n# 3.12 Green Fields 景观案例研究——第一部分\n\n## 问题描述\n\nGreen Fields Landscaping\
  \ 提供的服务之一是覆盖物（mulch）的销售和交付，按立方码测量和定价。你被要求创建一个程序，确定客户需要多少立方码的覆盖物以及总价格。\n\n## 程序设计\n\
  \n## 程序步骤\n\n程序必须执行以下通用步骤（此步骤列表有时被称为通用伪代码）：\n\n1. 设置每立方码覆盖物的价格（当前为 22.00）。\n2. 要求用户输入要覆盖的平方英尺以及在该区域铺设覆盖物的深度。\n\
  3. 计算所需的立方英尺覆盖物数量。\n4. 计算所需的立方码覆盖物数量。\n5. 计算覆盖物的总价格。\n6. 显示结果。\n\n### 值将作为输入的变量\n\
  \n```\ndouble squareFeet            // 要覆盖土地的平方英尺\nint    depth                \
  \ // 覆盖物铺设的深度（英寸）\n```\n\n### 值将作为输出的变量\n\n```\ndouble cubicYards            //\
  \ 需要的立方码覆盖物数量\ndouble totalPrice            // 所有订单立方码的总价钱\n```\n\n### 程序常量\n\n\
  ```\ndouble PRICE_PER_CUBIC_YD    // 每立方码交付覆盖物的价格\n```\n\n### 额外变量\n\n```\ndouble\
  \ cubicFeet             // 需要的立方英尺覆盖物数量\n```\n\n### 详细伪代码（包括实际的变量名和所需的逻辑计算）\n\n\
  ```\nPRICE_PER_CUBIC_YD = 22.00\nInput squareFeet            // 带有提示\nInput depth\
  \                 // 带有提示\ncubicFeet = squareFeet * (depth / 12.0)\ncubicYards =\
  \ cubicFeet / 27\ntotalPrice = cubicYards * PRICE_PER_CUBIC_YD\nDisplay cubicYards,\
  \ PRICE_PER_CUBIC_YD, and totalPrice\n```\n\n## 程序\n\n在检查伪代码的逻辑错误后，下一步是将伪代码扩展为最终的程序。这在程序\
