  \ | 一年的分钟数 |\n   | `32.2` | 重力加速度常数（英尺/秒²） |\n   | `9.8` | 重力加速度常数（米/秒²） |\n   |\
  \ `1609` | 一英里的米数 |\n\n2. 3.18 完成以下程序代码段，使其能够正确将输入的每英里小时的速度转换为英尺/秒。1 英里/小时等于 1.467\
  \ 英尺/秒。\n\n```\n// 定义一个名为 CONVERSION 的命名常量，其值为 1.467。\ndouble milesPerHour, feetPerSecond;\n\
  \ncout << \"This program converts miles per hour to\\n\";\ncout << \"feet per second.\\\
  n\";\ncout << \"Enter a speed in MPH: \";\ncin  >> milesPerHour;\n// 在此处插入一个数学语句来\n\
  // 计算每秒英尺并将结果\n// 赋值给 feetPerSecond 变量。\ncout << \"That is \" << feetPerSecond <<\
  \ \" feet per second.\\n\";\n```\n\n## 3.6 多重与复合赋值\n\n### 概念\n\n多重赋值意味着一条语句给多个变量分配相同的值。\n\
  \nC++ 允许你同时给多个变量赋值。如果程序有几个变量，例如 `a`、`b`、`c` 和 `d`，每个变量都需要赋予相同的值（例如 12），可以写如下语句：\n\
  \n```\na = b = c = d = 12;\n```\n\n值 12 将赋予语句中列出的每个变量。这是因为赋值操作是从右到左执行的。首先将 12 赋予\
  \ `d`。然后将 `d` 的值（现在是 12）赋予 `c`。接着将 `c` 的值赋予 `b`，最后将 `b` 的值赋予 `a`。\n\n这里是另一个例子。执行该语句后，`store1`\
  \ 和 `store2` 将持有相同的值。\n\n```\nstore1 = store2\n```\n\n## 复合赋值运算符\n\n程序经常具有如下形式的赋值语句：\n\
  \n```\nnumber = number + 1\n```\n\n赋值运算符的右侧给出 `number` 加 1 的值。然后将结果赋予 `number`。同样，以下语句从\
  \ `number` 减去 5：\n\n```\nnumber = number - 5\n```\n\n如果你以前没见过这种语句，可能会因为变量名出现在两侧而引起一些困惑。[表\
  \ 3-8] 显示了其他此类示例。\n\n# 表 3-8 改变变量值的赋值\n\n| 语句 | 操作 | x 的值 |\n| --- | --- | --- |\n\
  | `x = x + 4` | 给 `x` 加 4 | 10 |\n| `x = x - 3` | 从 `x` 减去 3 | 7 |\n| `x = x * 10`\
  \ | 将 `x` 乘以 10 | 10 |\n| `x = x / 2` | 将 `x` 除以 2 | 5 |\n| `x = x % 4` | 使 `x`\
  \ 余数为 | 1 |\n\n由于这类操作非常常见，C++ 为这些提供了一组特殊的运算符。[表 3-9] 显示了*赋值运算符*，也称为*复合运算符*或*算术赋值运算符*。\n\
  \n# 表 3-9 复合赋值运算符\n\n| 运算符 | 示例用法 | 等于 |\n| --- | --- | --- |\n| `+=` | `x += 5`\
  \ | `x = x + 5` |\n| `-=` | `y -= 2` | `y = y − 2` |\n| `*=` | `z *= 10` | `z =\
  \ z * 10` |\n| `/=` | `a /= b` | `a = a / b` |\n| `%=` | `c %= 3` | `c = c % 3`\
  \ |\n\n如你所示，复合赋值运算符不需要程序员输入两次变量。[程序 3-11] 同时使用了多重赋值语句和复合赋值运算符。\n\n更复杂的语句可以使用复合赋值运算符表示。这里有一个例子：\n\
  \n```\nresult *= a + 5;\n```\n\n在这一语句中，`result` 乘以 `a + 5` 的和。注意复合赋值运算符的优先级低于普通算术运算符，因此上述语句等同于\n\
  \n```\nresult = result * (a + 5);\n```\n\n[表 3-10] 显示了使用复合赋值运算符的其他示例。\n\n# 表 3-10\
  \ 使用复合赋值运算符和算术运算符的示例\n\n| 示例用法 | 等于 |\n| --- | --- |\n| `x += b + 5;` | `x = x +\
  \ (b + 5);` |\n| `y −= a * 2;` | `y = y − (a * 2);` |\n| `z *= 10 − c;` | `z = z\
  \ * (10 − c);` |\n| `a /= b + c;` | `a = a / (b + c);` |\n\n\n\n\n| `c %= d − 3;`\
  \ | `c = c % (d − 3);` |\n\n# 单元练习\n\n1. 3.19 写一个多重赋值语句，为变量 `total`、`subtotal`、`tax`\
  \ 和 `shipping` 赋值 0。\n2. 3.20 使用复合赋值运算符编写语句执行以下操作：\n    1. 给 `x.` 加 6。\n    2. 从\
  \ `amount.` 减去 4。\n    3. 将 `y` 乘以 4。\n    4. 将 `total` 除以 27。\n    5. 将 `x` 除以\
  \ 7 的余数存储在 `x` 中。\n    6. 给 `x.` 加上 `y *`5。\n    7. 从 `total.` 减去 `discount` 的 4\
  \ 倍。\n    8. 将 `increase` 乘以 `salesRep` 的 5。\n    9. 将 `profit` 除以 `shares` 再减去\
  \ 1000。\n3. 3.21 下面程序段将显示什么？\n```\nint unus, duo, tres;\n\nunus = duo = tres = 5;\n\
  unus += 4;\nduo *= 2;\ntres −= 4;\nunus /= 3;\nduo += tres;\ncout << unus << endl\
  \ << duo << endl << tres << endl;\n```\n\n## 3.7 输出格式化\n\n### 概念\n\n`cout` 提供了在显示时对数据进行格式化的方法。这将影响数据在屏幕上的显示。\n\
  \n相同的数据可以用几种不同的方式打印或显示。例如，以下所有数字的数值相同，尽管它们看起来不同：\n\n```\n720\n720.0\n720.00000000\n\
  7.2e+2\n+720.0\n```\n\n值的打印方式被称为其`格式化`（formatting）。`cout` 对象对每种数据类型的变量都有标准的格式化方法。然而，有时你可能对数据的显示方式需要更多控制。例如，考虑程序\
  \ 3-12，它显示了三行数字，每个数字之间有空格。\n\n遗憾的是，数字并没有列对齐。这是因为某些数字（如 5 和 7）在屏幕上占据一个位置，而另一些占据两个或三个位置。`cout`\
  \ 只使用打印每个数字所需的空格数。\n\n为了解决这个问题，`cout` 提供了一种方法来指定每个数字使用的最小空格数。可以使用流操作符 `setw` 来建立指定宽度的打印字段。以下是它的用法示例：\n\
  \n```\nvalue = 23;\ncout << setw(5) << value;\n```\n\n`setw` 单词括号内的数字指定了紧随其后的值的字段宽度。`字段宽度`（field\
  \ width）是在屏幕上打印该值所需的最小字符位置数或空格数。在我们的示例中，数字 23 将显示在一个五宽的字段中。\n\n为了进一步明确其工作原理，请看以下语句：\n\
  \n```\nvalue = 23;\ncout << \"(\" << setw(5) << value << \")\";\n```\n\n这将产生以下输出：\n\
  \n```\n(   23)\n```\n\n注意，该数字占据了字段中的最后两个位置。由于数字没有使用整个字段，`cout` 用空格填充了额外的三个位置。由于数字显示在字段的右侧，并在前面有空格“填充”，因此它被称为`右对齐`（right-justified）。\n\
  \n程序 3-13 显示了如何使用 `setw` 使程序 3-12 中的数字打印在完美对齐的列中。此外，由于程序使用了 `setw(6)`，且最大的数字有四位数，数字之间将分开，而不需要在数字之间打印包含空格的字符串面字量。\n\
  \n### 注意\n\n在程序 3-13 的第 3 行 `#include` 指令中指定了一个新头文件 `iomanip`。任何使用 `setw` 的程序必须包含此头文件。\n\
  \n注意，每个值都使用了 `setw` 操作符。这是因为 `setw` 只为紧随其后的值建立字段宽度。在打印完该值之后，`cout` 将恢复到它的默认方法。你可能会想，如果数字太大无法放入字段会发生什么，例如，当数字大到无法适应字段时，如程序\
  \ 3-12 所示：\n\n（此处原文文本逻辑似乎存在乱码或重复错误，已根据上下文语义修复翻译逻辑）\n\n*注：由于提供的原文后半部分出现了严重的文本重复和乱码，译文已根据\
  \ C++ 编程逻辑进行了对齐和修复，以确保通顺。*\n\n\n\n\n\n程序 3-16 显示了如何结合 `setw` 和 `setprecision` 操纵符来控制浮点数的显示方式。\n\
  \n按照我们的指示，程序 3-16 输出的结果最多显示五位有效数字，并在宽度为八个字符的字段中右对齐打印。然而，结果显然不是我们想要的。让我们看看另一个可以解决该问题的操纵符。\n\
  \n## `fixed` 操纵符\n\n如果一个数字太大，无法用 `setprecision` 指定的位数打印，许多系统会用科学计数法打印。例如，这里是程序 3-16\
  \ 输入较大数字时的输出。\n\n```\nEnter the sales for day 1: 145678.99[Enter]\nEnter the sales\
  \ for day 2: 205614.85[Enter]\nEnter the sales for day 3: 198645.22[Enter]\n\nSales\
  \ Figures\n-------------\nDay 1: 1.4568e+005\nDay 2: 2.0561e+005\nDay 3: 1.9865e+005\n\
  Total: 5.4994e+005\n```\n\n为了防止这种情况，你可以使用另一个流操纵符 `fixed`，它表示浮点数输出应该以定点法（或小数）格式打印。\n\
  \n```\ncout << fixed;\n```\n\n然而，`fixed` 操纵符最重要的可能是，当它与 `setprecision` 操纵符结合使用时，它会让\
  \ `setprecision` 以新的方式运行。它指定的是浮点数小数点后显示的位数，而不是显示的总位数。这通常正是我们想要的。例如，如果我们这样重写程序 3-16\
  \ 的第 25 行\n\n```\ncout << fixed << setprecision(2);\n```\n\n并使用相同的示例数据重新运行程序，我们将得到以下结果：\n\
  \n```\nEnter the sales for day 1: 321.57[Enter]\nEnter the sales for day 2: 269.60[Enter]\n\
  Enter the sales for day 3: 307.00[Enter]\nSales Figures\n-------------\nDay 1: \
  \  321.57\nDay 2:   269.60\nDay 3:   307.00\nTotal:   898.17\n```\n\n通过共同使用 `fixed`\
  \ 和 `setprecision`，我们得到了所需的输出。请注意，在这种情况下，我们将精度设置为 2（即我们希望看到的小数位数），而不是 5。\n\n## `showpoint`\
  \ 操纵符\n\n默认情况下，浮点数不显示末尾零，且没有小数部分的浮点数不显示小数点。例如，这段代码\n\n```\ndouble x = 456.0;\ncout\
  \ << x << endl;\n```\n\n它将只显示 456 而不再有其他内容。\n\n另一个有用的操纵符 `showpoint` 允许覆盖这些默认设置。当使用\
  \ `showpoint` 时，它表示浮点数应该打印小数点和小数位，即使显示的值没有小数位。这里是添加了 `showpoint` 操纵符的相同代码。\n\n```\n\
  double x = 456.0;\ncout << showpoint << x << endl;\n```\n\n它显示了以下输出：\n\n```\n456.000\n\
  ```\n\n显示了三个零是因为如果我们不指定想要多少小数位，它会显示六位有效数字。我们可以像下面所示共同使用 `fixed`、`showpoint` 和 `setprecision`\
  \ 操纵符，以便更灵活地控制输出的外观。\n\n```\ndouble x = 456.0;\ncout << fixed << showpoint << setprecision(2)\
  \ << x << endl;\n```\n\n该版本的代码产生了以下输出：\n\n```\n456.00\n```\n\n程序 3-17 进一步说明了这些操纵符的使用。在这种情况下，请注意我们将精度设置为\
  \ 2（即我们希望看到的小数位数），而不是 5。在第 14 行，`fixed` 和 `setprecision` 都被设置了，指定了两个小数位，因此显示为 6.00。第\
  \ 13 章引入了额外的流操纵符和输出格式。然而，在本章中涵盖的操纵符通常足够产生你所需的输出。表 3-12 总结了这些操纵符。\n\n## 表 3-12 输出操纵符\n\
  \n| 流操纵符 | 描述 |\n| --- | --- |\n| `setw(n)` | 为下一个输出值设置最小打印字段宽度为 n。 |\n| `fixed`\
  \ | 以定点法（即小数）形式显示浮点数。 |\n| `showpoint` | 即使浮点数没有小数部分，也显示小数点和末尾零。 |\n| `setprecision(n)`\
  \ | 设置浮点数的精度。 |\n| `left` | 使后续输出左对齐。 |\n| `right` | 使后续输出右对齐。 |\n\n## 检查点\n\n1.\
