  \ * PI / 180;\n\n// Display the value in radians left-justified, in fixed-point\n\
  // notation, with four decimal places of precision, in a field\n// seven spaces\
  \ wide.\n```\n\n## 3.8 处理字符与字符串\n\n### 概念\n\n存在用于处理字符和字符串的特殊函数。\n\n在第 2 章中，你接触了字符和字符串对象。让我们回顾它们的一些特性。`char`\
  \ 变量只能存储一个字符，而定义为字符串的变量可以存储一组完整的字符。下面的变量定义和初始化说明了这一点。\n\n```\nchar letter1 = 'A',\n\
  \     letter2 = 'B';\n\nstring name1 = \"Mark Twain\",\n       name2 = \"Samuel\
  \ Clemens\";\n```\n\n与数值数据类型一样，字符和字符串也可以被赋值。\n\n```\nletter2 = letter1;       //\
  \ 现在 letter2 的值是 'A'\nname2 = name1;           // 现在 name2 的值是 \"Mark Twain\"\n\
  ```\n\n与数值数据类型一样，可以使用 `cout` 语句显示它们。下面这行代码输出了一个字符变量、一个字符串字面量和一个 `string` 对象。\n\n\
  ```\ncout << letter1 << \". \" << name1 << endl; \n```\n\n产生的输出是：\n\n```\nA. Mark\
  \ Twain\n```\n\n然而，输入字符和字符串比读取数值要复杂得多。\n\n## 输入字符串\n\n虽然可以使用 `cin` 配合 `>>` 运算符输入字符串，但可能会导致你留注意的问题。当\
  \ `cin` 读取数据时，它会跳过并忽略任何前导空白字符（空格、制表符或换行符）。然而，一旦遇到第一个非空白字符并开始读取，它会在遇到下一个空白字符时停止读取。如果我们使用以下语句：\n\
  \n```\ncin >> name1;\n```\n\n我们可以输入“Mark”或“Twain”，但无法输入“Mark Twain”，因为 `cin` 无法输入包含嵌入空格的字符串。\n\
  \n程序 3-19 说明了这个问题。\n\n注意，用户从未有机会输入城市。在第一个输入语句中，当 `cin` 到 `John` 和 `Doe` 之间的空格时，它停止读取，仅将\
  \ `John` 存储为 `name` 的值。在第二个输入语句中，`cin` 使用了在键盘缓冲区中找到的剩余字符并将 `Doe` 存储为 `city` 的值。要解决这个问题，可以使用名为\
  \ `getline` 的 C++ 函数。该函数读取一整行（包括前导和嵌入空格），并将其存储在 `string` 对象中。`getline` 函数的形式如下，其中\
  \ `cin` 是我们读取的输入流，`inputLine` 是接收输入字符串的 `string` 变量名。\n\n```\ngetline(cin, inputLine);\n\
  ```\n\n程序 3-20 说明了 `getline` 函数。\n\n## 输入字符\n\n有时你只想读取输入中的单个字符。例如，某些程序会为用户显示一个供选择的项目菜单。通常，选择将由字母\
  \ A、B、C 等表示。用户通过输入一个字符从菜单中选择一个项目。读取单个字符最简单的方法是使用 `cin` 和 `>>` 运算符，如程序 3-21 所示。\n\
  \n## 使用 `cin.get`\n\n然而，与字符串输入一样，有时使用 `cin >>` 读取字符并得不到我们想要。例如，因为它会跳过所有前导空白，无法使用\
  \ `cin >>` 仅输入一个空格或[回车]（Enter）。在按下空格键、制表符键或[回车]键以外的字符之前，程序不会继续执行 `cin` 语句。（一旦输入了此类字符，仍必须按下[回车]键程序才能继续执行下一条语句。）因此，要求用户“按回车键继续。”的程序不能使用\
  \ `>>` 运算符。\n\n\n\n当第 4 行的 `cin >>` 语句读取用户输入的数据时，它会在遇到换行符时停止。换行符没有被读取，但它仍然留在键盘缓冲区中。从键盘读取数据的输入语句只有在键盘缓冲区为空时才会等待用户输入值，但现在它不为空了。当第\
  \ 6 行的 `cin.get` 函数执行时，它将从上一次输入操作停止的地方开始读取键盘缓冲区，并发现了换行符。因此，它直接使用了该字符，而不会等待用户输入另一个值。你可以通过后续章节介绍的\
  \ `cin.ignore` 函数来解决这种状况。\n\n## 使用 `cin.ignore`\n\n`cin.ignore` 函数告诉 `cin` 对象跳过键盘缓冲区中的一个或多个字符。其通用形式如下：\n\
  \n```\ncin.ignore(n, c);\n```\n\n括号中的参数是可选的。如果使用它们，`n` 是一个整数，`c` 是一个字符。它们告诉 `cin`\
  \ 跳过 `n` 个字符，或者遇到字符 `c` 为止。例如，以下语句会导致 `cin` 跳过接下来的 20 个字符或遇到换行符，以先到者为准：\n\n```\n\
  cin.ignore(20,'\\n');\n```\n\n如果不使用任何参数，`cin` 只跳过下一个字符。这里有一个示例：\n\n```\ncin.ignore();\n\
  ```\n\n之前在 `cin >>` 和 `cin.get` 语句交替使用时出现的问题可以通过在 `cin >>` 语句之后插入 `cin.ignore` 语句来避免，如下所示。这将跳过\
  \ `cin >>` 留下的换行符，强制 `cin.get` 等待用户输入另一个字符。\n\n```\ncout << \"Enter a number: \"\
  ;\ncin  >> number;\ncin.ignore();                       // 跳过换行符\ncout << \"Enter\
  \ a character: \";\ncin.get(ch);\ncout << \"Thank You!\" << endl;\n```\n\n# 有用的\
  \ `string` 成员函数和运算符\n\nC++ `string` 对象也有许多成员函数。例如，如果你想知道存储在 `string` 对象中的字符串长度，可以调用对象的\
  \ `length` 成员函数。这是一个如何使用的示例：\n\n```\nstring state = \"New Jersey\";\nint size =\
  \ state.length();\n```\n\n第一语句创建了一个名为 `state` 的 `string` 对象，并用字符串 `\"New Jersey\"\
  ` 初始化它。第二语句定义了一个名为 `size` 的 `int` 变量，并用 `state` 对象中字符串的长度初始化它。这段代码执行后，变量 `size`\
  \ 将包含值 10。\"\"New\"` 和 `\"Jersey\"` 之间的空格是一个字符，与其他任何字符一样被计数。另一方面，你在第 2 章中学到的标记字符串字面量结束的\
  \ `'\\0'` 空字符是不计数的。\n\n另一个用的成员函数是 `assign`。该函数的版本之一允许将一组重复字符赋值给字符串，而无需数字符。例如，假设你声明了一个名为\
  \ `spaces` 的 `string` 对象，并想给它分配 22 个空格。你可以像这样使用字符串字面量：\n\n```\nspaces = \"     \
  \                 \";\n```\n\n然而，数出字符串字面量中包含的空格数量是非常麻烦的，而且很容易数错。使用 `string` 类的 `assign`\
  \ 成员函数要简单得多，如下所示：\n\n```\nspaces.assign(22, ' ');\n```\n\n`string` 类还有用于处理字符串的特殊运算符。其中之一是\
  \ `+` 运算符。\n\n你已经遇到过用 `+` 运算符相加两个数值。由于字符串不能相加，当此运算符与字符串操作数一起使用时，它会将它们*连接*或将它们连接在一起。假设我们在程序中有以下定义和初始化：\n\
  \n```\nstring greeting1 = \"Hello \",\n       greeting2;\nstring word1     = \"\
  World\";\nstring word2     = \"People\";\n```\n\n以下语句说明了字符串连接是如何工作的：\n\n```\ngreeting2\
  \ = greeting1 + word1; // greeting2 现在持有 \"Hello World\"\ngreeting1 = greeting1\
  \ + word2; // greeting1 现在持有 \"Hello People\"\n```\n\n注意，存储在 `greeting1` 中的字符串其最后一个字符是一个空格。如果没有这个空格，`greeting2`\
  \ 将被赋值字符串 `\"HelloWorld\"`。\n\n最后一条语句也可以使用 `+=` 复合赋值运算符编写，如下：\n\n```\ngreeting1\
  \ += word2; \n```\n\n程序 3-23 使用了我们刚刚看到的 `string` 类成员函数和字符串连接运算符。你将在后面的章节中学习许多其他有用的\
  \ `string` 类成员函数和运算符。\n\n# 使用 C 字符串\n\n在 C++ 中，在引入 `string` 类之前，字符串被存储为单个字符。这样一组连续的单元被称为数组。你将在第\
  \ 8 章中学习更多关于数组的知识。\n\n由于 C 字符串比 `string` 对象更难处理，你可能会疑惑为什么还要学习它们。有两个原因。第一，你可能会遇到使用它们的旧版程序，因此你需要理解它们。其次，尽管现在字符串可以被声明为\
  \ `string` 对象，但在某些情况下只有 C 字符串有效。\n\n\n\n使用 C 字符串与使用 `string` 对象的不同点在于，除了在定义时初始化外，它不能使用赋值运算符来赋予值。在程序\
  \ 3-24 中，例如，我们无法将 `cin` 语句替换为以下代码。\n\n```\nname = \"Sebastian\";               \
  \       // 错误！\n```\n\n相反，要给 C 字符串赋值，我们必须使用一个名为 `strcpy` 的函数（读作 *string copy*，字符串拷贝），将一个字符串的内容复制到另一个字符串中。在接下来的代码行中，`Cstring`\
  \ 是接收值的变量名，而 `value` 是字符串字面量或另一个 C 字符串变量名。\n\n```\nstrcpy(Cstring, value);\n```\n\
  \n程序 3-25 展示了 `strcpy` 函数的工作原理。\n\n# 跟踪 C 字符串的容纳能力\n\n使用 C 字符串与使用 `string` 对象的另一个关键区别涉及为其分配的内存。对于\
  \ `string` 对象，你不需要担心内存太小而无法存放想要放入其中的字符串。如果分配给 `string` 对象的存储空间太小，`string` 类函数将确保为它分配更多内存。对于\
  \ C 字符串，情况并非如此。预留用于存放 C 字符串的内存单元数量保持你在定义语句中最初设置的大小。确保放入其中的字符数不超过其存储空间是程序员的工作。如果程序员使用\
  \ `cin` 将一个值读入 C 字符串，而用户输入的字符数超过了它能容纳的范围，`cin` 仍然会存储所有字符。无法容下的字符将溢出到随后的内存单元中，覆盖掉之前存储在那里的任何内容。这种错误被称为*缓冲区溢出*（buffer\
  \ overrun），可能会导致严重问题。\n\n防止这种情况发生的一种方法是使用 `setw` 流操纵符。我们之前之前用于格式化输出的操纵符也可以用于控制 `cin\
  \ >>` 在下一次读取时输入的字符数，如下所示：\n\n```\nchar word[5];\ncin >> setw(5) >> word;\n```\n\n\
  实现相同目的的另一种方法是使用 `cin.width` 函数。\n\n```\nchar word[5];\ncin.width(5);\ncin >> word;\n\
  ```\n\n在这两种情况下，指定的字段宽度均为 5，`cin` 读取的字符最多比此值少一个，为末尾的空字符留出空间。程序 3-26 说明了了配合 `cin`\
  \ 使用 `setw` 操纵符的方法，而程序 3-27 使用了它的 `width` 函数。两个程序都产生相同的输出。\n\n在程序 3-27 中，`cin` 只读取并存储了四个字符到\
  \ `word` 中。如果没有指定字段宽度，`cin` 将把整个单词“Eureka”写入内存，溢出为存放 `word` 所设置的空间。图 3-8 说明了内存受此影响的方式。阴影区域是为存放\
  \ C 字符串分配的 5 字节内存。\n\n# 图 3-8 输入溢出为其分配的内存\n\n![一个存储显示了 10 个相邻的矩形。](img/FG_03_008.png)图\
  \ 3-8 完整替代文本\n\n关于 `cin` 处理字段宽度的方式有三个重要点需要记住：\n\n* 字段宽度仅适用于用户输入的下一个项目。\n* 为了为 ‘\\\
  0’留留空间，字段宽度应该比字符数大一。\n* 如果未指定字段宽度，`cin` 将一直读取直到遇到换行符。\n\n## 读取一行\n\nC 字符串与 `string`\
  \ 对象的另一个区别在于它们如何处理输入行。要读取一行文本，你可以使用 `getline` 函数。该函数读取字符直到遇到换行符，并将它们存储在 C 字符串中。\n\
  \n```\nchar line[100];\ngetline(cin, line);\n```\n\n`getline` 函数定义在 `<string>` 头文件中。它接受两个参数：输入流和将存储该行的\
  \ C 字符串。\n\n## 检查点\n\n1. 使用 C 字符串与使用 `string` 对象的第一个区别在于，除了在定义时初始化外，它不能使用赋值运算符来赋予值。在程序\
  \ 3-24 中，例如，我们无法将 `cin` 语句替换为以下代码。\n\n```\nname = \"Sebastian\";               \
  \       // 错误！\n```\n\n相反，要给 C 字符串赋值，我们必须使用一个名为 `strcpy` 的函数（读作 *string copy*），将一个字符串的内容复制到另一个字符串中。在接下来的代码行中，`Cstring`\
  \ 是接收值的变量名，而 `value` 是字符串字面量或另一个 C 字符串变量名。\n\n```\nstrcpy(Cstring, value);\n```\n\
  \n2. 程序 3-25 展示了 `strcpy` 函数的工作原理。\n\n# 跟踪 C 字符串的容纳能力\n\n使用 C 字符串与使用 `string` 对象的另一个关键区别涉及为其分配的内存。对于\
  \ `string` 对象，你不需要担心内存太小而无法存放想要放入其中的字符串。如果分配给 `string` 对象的存储空间太小，`string` 类函数将确保为它分配更多内存。对于\
  \ C 字符串，情况并非如此。预留用于存放 C 字符串的内存单元数量保持你在定义语句中最初设置的大小。确保放入其中的字符数不超过其存储空间是程序员的工作。如果程序员使用\
  \ `cin` 将一个值读入 C 字符串，而用户输入的字符数超过了它能容纳的范围，`cin` 仍然会存储所有字符。无法容下的字符将溢出到随后的内存单元中，覆盖掉之前存储在那里的任何内容。这种错误被称为*缓冲区溢出*（buffer\
  \ overrun），可能会导致严重问题。\n\n防止这种情况发生的一种方法是使用 `setw` 流操纵符。我们之前之前用于格式化输出的操纵符也可以用于控制 `cin\
  \ >>` 在下一次读取时输入的字符数，如下所示：\n\n```\nchar word[5];\ncin >> setw(5) >> word;\n```\n\n\
  实现相同目的的另一种方法是使用 `cin.width` 函数。\n\n```\nchar word[5];\ncin.width(5);\ncin >> word;\n\
  ```\n\n在这两种情况下，指定的字段宽度均为 5，`cin` 读取的字符最多比此值少一个，为末尾的空字符留出空间。程序 3-26 说明了了配合 `cin`\
  \ 使用 `setw` 操纵符的方法，而程序 3-27 使用了它的 `width` 函数。两个程序都产生相同的输出。\n\n在程序 3-27 中，`cin` 只读取并存储了四个字符到\
  \ `word` 中。如果没有指定字段宽度，`cin` 将把整个单词“Eureka”写入内存，溢出为存放 `word` 所设置的空间。图 3-8 说明说明了内存受此影响的方式。阴影区域是为存放\
  \ C 字符串分配的 5 字节内存。\n\n# 图 3-8 输入溢出为其分配的内存\n\n![一个存储显示了 10 个相邻的矩形。](img/FG_03_008.png)图\
  \ 3-8 完整替代文本\n\n关于 `cin` 处理字段宽度的方式有三个重要点需要记住：\n\n* 字段宽度仅适用于用户输入的下一个项目。\n* 为了为 ‘\\\
  0’留留空间，字段宽度应该比字符数大一。\n* 如果未指定字段宽度，`cin` 将一直读取直到遇到换行符。\n\n## 读取一行\n\nC 字符串与 `string`\
  \ 对象的另一个区别在于它们如何处理输入行。要读取一行文本，你可以使用 `getline` 函数。该函数读取字符直到遇到换行符，并将它们存储在 C 字符串中。\n\
  \n```\nchar line[100];\ngetline(cin, line);\n```\n\n`getline` 函数定义在 `<string>` 头文件中。它接受两个参数：输入流和将存储该行的\
  \ C 字符串。\n\n## 检查点\n\n1. 使用 C 字符串与使用 `string` 对象的第一个区别在于，除了在定义时初始化外，它不能使用赋值运算符来赋予值。在程序\
  \ 3-24 中，例如，我们无法将 `cin` 语句替换为以下代码。\n\n```\nname = \"Sebastian\";               \
  \       // 错误！\n```\n\n相反，要给 C 字符串赋值，我们必须使用一个名为 `strcpy` 的函数（读作 *string copy*，字符串拷贝），将一个字符串的内容复制到另一个字符串中。在接下来的代码行中，`Cstring`\
  \ 是接收值的变量名，而 `value` 是字符串字面量或另一个 C 字符串变量名。\n\n```\nstrcpy(Cstring, value);\n```\n\
  \n2. 程序 3-25 展示了 `strcpy` 函数的工作原理。\n\n\n\n\n| `round` | `y = round(x);` | 将传递的浮点数参数四舍入到最近的整数。返回值为一个整数。\
  \ |\n| `sin` | `y = sin(x);` | 返回参数的正弦值。参数应该是以弧度为单位的角度。返回类型和参数均为 double。 |\n| `sqrt`\
  \ | `y = sqrt(x);` | 返回参数的平方根。返回类型和参数均为 double。参数必须大于或等于零。 |\n| `tan` | `y = tan(x);`\
  \ | 返回参数的正切值。参数应该是以弧度为单位的角度。返回类型和参数均为 double。 |\n\n除了 `abs` 和 `round` 函数外，表 3-13\
  \ 列出的所有函数都接受一个或多个 `double` 参数并返回一个 `double` 值。然而，大多数 C++ 编译器允许也使用 `int` 参数调用它们。因此，以下两种方式都可以打印\
  \ 30 的平方根。\n\n```\ncout << sqrt(30.0);   // 显示 5.47723\ncout << sqrt(30);     //\
  \ 显示 5.47723\n```\n\n程序 3-29 展示了如何使用 `sqrt` 函数寻找直角三角形的斜边。该程序使用了源自毕股定理的公式：\n\n$$c\
  \ = \\sqrt{a^{2} + b^{2}}$$\n\n在公式中，`c` 是斜边的长度，`a` 和 `b` 是三角形另外两条边的长度。\n\n以下语句取自\
  \ 程序 3-29 的第 18 行，计算了三角形两边平方之和的平方根：\n\n```\nc = sqrt(pow(a, 2.0) + pow(b, 2.0));\n\
  ```\n\n注意，以下数学表达式用作 `sqrt` 函数的参数：\n\n```\npow(a, 2.0) + pow(b, 2.0)\n```\n\n该表达式调用了两次\
  \ `pow` 函数：一次计算 `a` 的平方，再次计算 `b` 的平方。然后将这两个平方相加，并将和发送给 `sqrt` 函数。\n\n## 3.10 随机数\n\
  \n### 概念\n\nC++ 提供了一系列函数，用于生成和处理随机数。\n\n随机数是可能值集合中的一个值，它似乎是随机选取的，集合中的每个值被选中的概率相等。它们被用于许多不同类型的程序。以下只是几个例子。\n\
  \n*   计算机游戏经常使用随机数来表示如掷骰子或从牌牌中抽牌等内容。\n*   模拟程序使用随机数来决定一组动作中的哪一个将发生，或者人、动物或其他生物将如何表现。可以创建使用随机数来确定程序中特定事件何时发生的公式。\n\
  *   数据分析程序可能使用随机数来随机选择将检查哪些数据。\n*   计算机安全系统使用随机数来加密敏感数据。\n\nC++ 库有一个名为 `rand()`\
  \ 的函数，用于生成随机数。它每次被调用时返回一个非负整数。要使用 `rand()` 函数，你必须在程序中包含 `cstdlib` 头文件。函数返回的数字是非负整数。以下是用法示例。\n\
  \n```\nrandomNum = rand();\n```\n\n然而，函数返回的数字实际上是“伪随机的”（pseudorandom）。这意味着它们具有随机数的外观和属性，但实际上并不是随机。它们实际上是通过算法生成的。该算法需要一个起始值，称为“种子”（seed），来生成数字。如果不提供种子，它在每次运行时都会产生相同的数字流。程序\
  \ 3-30 阐明了这一点。\n\n为了在每次运行程序时获得不同的随机数流，你必须为随机数生成器提供一个起始种子。在 C++ 中，这是通过调用 `srand`\
  \ 函数实现的。程序 3-31 阐明了这一点。注意 `srand` 函数在第 16 行于 `rand` 调用之前调用，且 `srand` 在整个程序中只被调用了一次。\n\
  \n同样注意，第 9 行创建的存储种子的变量声明为 `unsigned`（无符号）。你可能记得，这种数据类型只持有非负整数。\n\n## 限制随机范围\n\n\
  有时程序需要特定范围内的随机数。为了将随机数的范围限制在 1 到某个最大值 `max` 之间，可以使用以下公式：\n\n```\nnumber = rand()\
  \ % max + 1;\n```\n\n例如，为了生成 1 到 6 之间的随机数来代表骰子，你会使用\n\n```\ndice = rand() % 6 +\
  \ 1;\n```\n\n这是该语句的工作原理。回回模运算符给出整数除法的余数。当 `rand` 函数返回的正整数除以 6 时，余数将在 0 到 5 之间的数字。因为我们需要\
  \ 1 到 6 之间的数字，所以只需加 1。\n\n这个想法可以扩展到产生任何范围内的随机整数。\n\n实现此操作的通用公式为：\n\n```\nnumber\
  \ = (rand() % (maxValue − minValue + 1)) + minValue;\n```\n\n在公式中，minValue 是范围中的最小值，maxValue\
  \ 是范围中的最大值。以下是你可以如何为变量 `number` 分配 10 到 18 之间的随机整数：\n\n```\nconst int MIN_VALUE\
  \ = 10;\nconst int MAX_VALUE = 18;\nnumber = rand() % (MAX_VALUE − MIN_VALUE + 1)\
  \ + MIN_VALUE;\n```\n\n在此代码中，`MAX_VALUE — MIN_VALUE + 1` 结果为 9，即目标范围内的整数个数。模运算因此返回\
  \ 0 到 8 之间的值。加上 `MIN_VALUE`（即 10）就会产生 10 到 18 之间的值。\n\n## 检查点\n\n1.  3.27 使用数学库函数配合\
  \ `cout` 语句，显示 `double` 变量 `inches` 的值四四舍入到最近的整数。\n\n\n\n\n\n## 3.28 \n假设变量 `angle1`\
