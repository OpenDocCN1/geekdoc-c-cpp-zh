  \n## 软技能\n\n程序员需要良好的沟通技巧，还需要良好的分析和解决问题的能力。在项目开始之前，如果参与项目的不同个人之间的预期不够清晰，良好的沟通可以减少容易产生的误解。详细的项目规格说明可以明确项目范围、用户与程序之间将发生什么交互，以及程序具体做什么和不做什么。\n\
  \n30. 与班上的另一个同学配对。你们中一个是客户，另一个是软件开发人员。简要讨论客户希望程序员创建的一个简单程序。这里是一些可能的想法：\n\n    *\
  \   第 1 章 练习中描述的油漆问题\n    *   一个可以将食谱配料减半的程序\n    *   一个计算从 A 点到 B 点需要多长的程序\n\n\
  一旦决定了程序，你们应该独立地、在没有进一步交流的情况下写下详细的规格。客户写下他准确想让程序做的事情，开发人员写下她对程序将准确做什么的理解。完成后，比较你们写的内容。这两者很少会达成一致。\n\
  \n现在讨论这些差异，看看你们是否能对程序必须准确做什么达成清晰的理解。共同创建一个足够详细的程序规格说明，让你们都认为它没有留下任何误解的空间。\n\n##\
  \ 编程挑战\n\n## 1. 两个数之和\n\n编写一个程序，将整数 50 和 100 存储在变量中，并将这两个和存储在名为 `total` 的变量中。在屏幕上显示总和。\n\
  \n## 2. 销售预测\n\n某公司的东海岸销售部产生了总销售额的 58%。根据该百分比，编写一个程序，如果公司今年有 860 万美元的销售额，预测东海岸部门将产生多少金额。在屏幕上显示结果。\n\
  \n## 3. 销售税\n\n编写一个程序，计算 95 美元购买的销售税和总价。假设州销售税为 6.5%，县销售税为 2%。在屏幕上显示购买价格、总税额和总价。\n\
