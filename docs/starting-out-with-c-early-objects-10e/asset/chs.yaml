  # 6. 换行符\n\n为编程挑战 5 的抽象过滤器类创建一个子类，将文件中的每个换行符替换为空格。\n\n# 7. 碰撞形状\n\n编写一个程序创建两个矩形形状并对它们进行动画处理。这两个形状从屏幕的两端开始，然后相互移动。当它们在屏幕中间相遇时，每个形状都会改变方向向屏幕边缘移动。两个形状在屏幕中间不断振荡并相互碰撞。当形状第十次在中间相遇时，程序终止。\n\
