  \n## 10.13 智能指针\n\n### 概念\n\nC++ 11 引入了智能指针，智能指针。\n\n11 在大型程序中，指向动态分配内存的指针被程序的多个部分使用。在这种情况下，很难确定这些内存何时不再需要，或者由程序的哪个部分负责删除该指针。程序可能会遭受*悬空指针*（指针在在使用时即被删除）和*内存泄漏*（即使在内存不再需要后指针也没有删除）的困扰。另一个问题是*重复删除*，即程序的某些部分删除已经被删除的指针。\n\
  \nC++ 11 引入了智能指针的概念来解决这些问题。*智能指针*是工作类似于指针但具有自动删除不再使用的动态分配内存能力的对象。C++ 11 提供了三种智能指针，由\
  \ `unique_ptr`、`shared_ptr` 和 `weak_ptr` 类定义。我们将这些称为*唯一指针*、*共享指针*和*弱指针*。\n\n智能指针的核心概念是对动态分配内存的*所有权*。智能指针被认为*拥有*或*管理*它所指向的对象。*唯一指针*用于由单个指针拥有动态分配的对象。对象的所有权可以从一个指针转移到另一个指针，确保该对象始终只有一个指针作为所有者。当唯一指针离开作用域或它开始接另一个对象的所有权时，它会自动释放它正在管理的对象。\n\
  \n\n\n\n`Shared pointers`（共享指针）共同维护一个当前共享某个对象的指针计数。当设置额外的指针指向该对象时，`reference count`（引用计数）会增加；当指针与对象分离时，计数会减少。当引用计数降为零时，该对象将被删除。我们将在书中书中讨论弱指针。\n\
  \n`unique_ptr`、`shared_ptr` 和 `weak_ptr` 类定义在 `<memory>` 头文件中，因此在使用它们的程序中需要以下语句：\n\
  \n```\n#include <memory>\n```\n\n## `unique_ptr` 类\n\n智能指针实际上是一个封装了指向所有对象的普通指针的对象。我们将被封装的普通指针称为\
  \ `raw pointer`（原始指针）。智能指针类根据所指向对象的类型进行参数化。例如，`unique_ptr<int>` 是指向 `int` 的指针；而\
  \ `unique_ptr<double>` 是指向 `double` 的指针。下面的代码展示了如何创建唯一指针。\n\n```\nunique_ptr<int>\
  \ uptr1(new int);\nunique_ptr<double> uptr2(new double);\n```\n\n或者，你可以定义一个未初始化的唯一指针，稍后给它赋值：\n\
  \n```\nunique_ptr<int> uptr3;\nuptr3 = unique_ptr<int>(new int);\n```\n\n为了避免内存泄漏，由智能指针管理的对象不应再有其他指向它们的引用。换句话说，指向动态分配存储区的指针应该立即传递给智能指针构造函数，而不是先将其赋值给指针变量。例如，你应该避免编写这样的代码：\n\
  \n```\nint *p = new int;\nunique_ptr<int> uptr(p);\n```\n\n智能指针不支持指针算术，因此像这样的语句：\n\
  \n```\nuptr1 ++;\nuptr1 = uptr1 + 2;\n```\n\n会导致编译错误。然而，智能指针通过运算符重载支持常用的指针操作 `*`\
  \ 和 `->`，这个主题我们将在第 11 章学习。下面的代码对指向动态分配内存位置的唯一指针进行解引用，为该位置赋值，增加该值，然后打印结果：\n\n```\n\
  unique_ptr<int> uptr(new int);\n*uptr = 12;\n*uptr = *uptr + 1;\ncout ≪ *uptr ≪\
  \ endl;\n```\n\n你不能用另一个 `unique_ptr` 对象的值来初始化 `unique_ptr`。同样，你不能将一个 `unique_ptr`\
  \ 对象赋值给另一个。因为这种操作会导致两个唯一指针共享同一个对象的所有权。因此，以下语句会导致编译错误：\n\n```\nunique_ptr<int> uptr1(new\
  \ int);\nunique_ptr<int> uptr2 = uptr1; // 非法初始化\nunique_ptr<int> uptr3;       \
  \  // OK\nuptr3 = uptr1;                 // 非法赋值\n```\n\nC++ 提供了一个 `move()` 库函数，可以将所有权从一个唯一指针转移到另一个：\n\
  \n```\nunique_ptr<int> uptr1(new int);\n*uptr1 = 15;\nunique_ptr<int> uptr3;   \
  \ // OK\nuptr3 = move(uptr1);      // 所有权从 uptr1 转移到 uptr3\ncout ≪ *uptr3 ≪ endl;\
  \    // 打印 15\n```\n\n当执行如下移动语句时：\n\n```\nU = move(V); \n```\n\n会发生两件事。首先，`U` 当前拥有的任何对象都会被释放。其次，被移动后的指针\
  \ `V` 放弃其对对象的所有权并变为“空”，而 `U` 接管此前由 `V` 拥有的对象。\n\n你不能通过值传递直接将唯一指针传递给函数，因为按值传递涉及实际参数的拷贝。如果你有一个按值接受唯一指针的函数，在调用该函数时必须对实际参数使用\
  \ `move()` 函数：\n\n```cpp\n// 函数使用按值传递\nvoid fun(unique_ptr<int> uptrParam)\n{\n\
  \   cout ≪ *uptrParam ≪ endl;\n}\n\nint main()\n{ \n   unique_ptr<int> uptr(new\
  \ int);\n   *uptr = 10; \n   fun(move(uptr)); // 在调用中使用 move\n}\n```\n\n上述代码将在函数\
  \ `fun()` 内部打印 10。或者，如果你使用按引用传递，可以省略实际参数上的 `move()`：\n\n```cpp\n// 函数使用按引用传递\nvoid\
  \ fun(unique_ptr<int>& uptrParam)\n{\n   cout ≪ *uptrParam ≪ endl;\n}\n\nint main()\n\
  {\n   unique_ptr<int> uptr1(new int);\n   *uptr1 = 15;\n   fun(uptr1); \t 调用中不需要\
  \ move\n}\n```\n\n上述程序在执行时将打印数字 15。\n\n有趣的是，你可以从函数返回唯一指针。这是因为编译器会对返回 `unique_ptr`\
  \ 对象的函数返回值自动应用 `move()` 操作。\n\n```cpp\n// 返回一个指向动态分配资源的唯一指针\nunique_ptr<int> makeResource()\n\
  {\n   unique_ptr<int> uptrResult(new int);\n   *uptrResult = 55;\n   return uptrResult;\n\
  }\n\nint main()\n{\n   unique_ptr<int> uptr = makeResource();\n   cout ≪ *uptr ≪\
  \ endl;\n}\n```\n\n# 数组的唯一指针\n\n智能指针 `uptr` 的用法就像它是指向 `int` 的普通指针一样。再次回顾我们可以在指针上使用数组符号，我们可以编写这样一个程序，在数组中存储整数的平方：\n\
  \n```cpp\nint main()\n{\n   // 指向数组的唯一指针\n   unique_ptr<int[]> up(new int[5]);\n\
  \n   // 设置数组元素整数的平方\n   for (int k = 0; k < 5; k++)\n   {\n   up[k] = (k+1)*(k+1);\n\
  \   }\n\n   // 打印数组元素\n   for (int k = 0; k < 5; k++)\n   {\n   cout ≪ up[k] ≪ \"\
  \ \";\n   }\n   cout ≪ endl;\n}\n```\n\n从 C++14 开始，`make_unique<T[]>()` 函数接受一个整数参数作为数组的大小：\n\
  \n```\nunique_ptr<int[]> up = make_unique<int[]>(5);\n```\n\n# unique_ptr 类的可选成员函数\n\
  \n`unique_ptr` 类有一些非常有用的实例成员函数。它们如表 10-2 所示。\n\n# 表 10-2 `unique_ptr` 成员函数\n\n|\
  \ 成员函数 | 描述 |\n| --- | --- |\n| `reset()` | 删除此智能指针管理的对象（如果有）。该智能指针变为空。 |\n| `reset(T*\
  \ ptr)` | 删除此智能指针当前管理的对象（如果有）。该智能指针接管原始指针 `ptr` 所指向的对象。 |\n| `get()` | 返回此智能指针管理的对象的原始指针。当需要将此类指针传递给不知道如何处理智能指针的函数时，这非常有用。\
  \ |\n\n\n\n\n\n程序 10-19 展示了唯一指针（unique pointers）的使用。类 `Thing` 与一个全局变量关联，该变量用于在创建每个\
  \ `Thing` 对象时为其分配某种序列号，且该类的每个对象在创建时都会被分配一个唯一的数字。`Thing` 类有一个构造函数和一个析构函数，用于跟踪类实例的创建和销毁。\n\
  \n`Thing` 类包含一个 `to_string()` 函数，该函数返回一个包含实例“序列号”的字符串。该方法调用了也命名为 `to_string()` 的库函数，该函数定义在标准命名空间\
  \ `std` 中用于将整数 `instanceNumber` 转换为字符串形式。使用作用域解析运算符 `std::` 来解决歧义。\n\n注意，此程序中没有对\
  \ `delete` 的调用。通过检查代码及其输出，你可以看到智能指针是如何工作删除不再需要的内存的。\n\n## `shared_ptr` 类\n\n共享指针（shared\
  \ pointer）用于管理可能有多个所有者的动态分配对象。特别，类型 `shared_ptr<T>` 用于管理类型为 `T` 对象的所有权。类构造函数 `shared_ptr<T>(T\
  \ * ptr)` 可用于创建一个共享指针，用于管理由原始指针 `ptr` 指定地址的对象。\n\n`shared_ptr` 类重载了指针运算符 `*` 和 `->`。这里是一个简单的示例，创建了一个由共享指针管理的动态分配整数，并通过该指针访问它：\n\
  \n```\n int main()\n{\n   shared_ptr<int> p(new int);\n   *p = 45;\n   cout ≪ *p\
  \ + 1;\n\n   return 0;\n}\n```\n\n这段代码将打印值 46。\n\n这是另一个示例。假设我们要管理以下类对象的共享所有权：\n\n\
  ```\n class Person\n{ \n   string name;\n   int age;\npublic:\n   string to_string()\n\
  \   {\n     return name + \" \" + to_string(age) + \"\\n\";\n   }\n   //构造函数\n \
  \  Person() {name = \"\"; age = 0;}\n   Person(const string& name, int age)\n  \
  \ {\n     this->name = name;\n     this->age = age;\n   }\n}\n```\n\n我们可以创建两个共享指针，每个管理一个不同的对象，如下：\n\
  \n```\n shared_ptr<Person> p1(new Person());\nshared_ptr<Person> p2(new Person(\"\
  Maria Wu\", 23));\n```\n\n或者，我们可以写\n\n```\n shared_ptr<Person> p1 = shared_ptr<Person>(new\
  \ Person());\nshared_ptr<Person> p2 = shared_ptr<Person>(new Person(\"Maria Wu\"\
  , 23));\n```\n\n# 共享指针组\n\n假设你设置了一个共享指针来管理原始指针 `rPtr` 指向的对象：\n\n```\n T * rPtr =\
  \ new T();\nshared_ptr<T> sPtr1(rPtr);\n```\n\n此时，`sPtr1` 成为拥有 `rPtr` 的共享指针组中的唯一成员。该组维护着引用计数，该计数仅为属于该组的共享指针的数量。这个“组”被称为*控制块*（control\
  \ block），它本身实际上是一个动态分配的对象，用于跟踪引用计数和指向被管理对象的原始指针。控制块负责在引用计数降为零时删除被管理的对象。你可以认为共享指针指向控制块，而控制块指向被管理的对象。\n\
  \n现在，如果用 `sPtr1` 初始化另一个共享指针：\n\n```\n shared_ptr<T> sPtr2 = sPtr1;\n```\n\n那么 `sPtr2`\
  \ 成为 `sPtr1` 同一组指针的成员，共享 `rPtr` 对象的所有权，并且该组的引用计数加一。如果之后，`sPtr2` 被赋值另一个共享指针的值：\n\n\
  ```\n sPtr2 = sPtr3;\n```\n\n那么 `sPtr2` 将放弃对 `rPtr` 的所有权，离开 `sPtr1` 组并加入 `sPtr3`\
  \ 组。第一组的引用计数减一，而第二组的引用计数增加。\n\n# 双重释放的危险（Double Dipping）危险\n\n在使用共享指针时，你应该避免导致两组指针管理同一个对象的情况。例如，在代码中\n\
  \n```\n T * rPtr = new T();\nshared_ptr<T> sPtr1(rPtr);\nshared_ptr<T> sPtr2(rPtr);\n\
  ```\n\n这两个共享指针指向两个不同的控制块，而它们又管理同一个对象。引用计数先降为零的组将删除该对象，导致另一组留下悬空指针。为了避免这个问题，一个给定的原始指针最多应初始化一个共享指针。\n\
  \n## `make_shared<T>()` 函数\n\n再次考虑共享指针的创建：\n\n```\n shared_ptr<Person> p1(new Person());\n\
  ```\n\n该语句的执行涉及两次独立的内存分配：一次用于分配控制块，第二次用于分配 `Person` 对象。每次分配都会产生开销，因此分配一个足够容纳控制块和对象的单一内存块效率更高。有一个\
  \ `make_shared` 函数可以做到这一点。使用该函数，我们可以重写上述语句：\n\n```\n shared_ptr<Person> p1 = make_shared<Person>();\n\
  ```\n\n`make_shared` 函数接受参数，例如：\n\n```\n shared_ptr<Person> p2 = make_shared<Person>(\"\
  Maria Wu\", 23);\n```\n\n`make_shared` 是创建共享指针的推荐方法。除了更高效外，它消除了直接处理原始指针的需求，从而消除了双重释放的可能性。\n\
  \n# 选定的 `shared_ptr` 成员函数\n\n表 10-3 列出了操作共享指针最有用的成员函数。\n\n# 表 10-3 `shared_ptr`\
  \ 成员函数\n\n| 成员函数 | 说明 |\n| --- | --- |\n| `get()` | 返回被管理对象的原始指针，如果没有管理对象则返回空指针。\
  \ |\n| `reset()` |释放管理对象（如果有）。调用指针将为空。 |\n| `reset(T * ptr)` | 当前管理的对象并获取 `ptr`\
  \ 指向的对象的所有权。 |\n| `use_count()` | 返回指向同一对象的共享指针数量。 |\n\n此外，你可以通过测试共享指针的值来检查它是否管理一个对象：\n\
  \n```\n shared_ptr<T> p = ...;\nif ( p )\n{\n   // 正在管理对象\n}\nelse\n{\n   // 指针为空\n\
  }\n```\n\n# 数组共享指针\n\n默认情况下，`shared_ptr` 使用 `delete` 来销毁被管理的对象。与 `unique_ptr` 不同，你不能写\n\
  \n```\n shared_ptr<T[]> sPtr; // 错误！\n```\n\n来指定被对象的类型为数组。绕过这一限制的方法是使用指向 `T` 类型向量的共享指针：\n\
  \n```\n shared_ptr<vector<T>> sVecPtr; \n```\n\n当向量被删除时，它的析构函数将运行并销毁所有向量元素。\n\n\
