  \n# 第 4 章 做出决策\n\n## 4.1 关系运算符\n\n### 概念\n\n关系运算符允许你比较数值和 `char` 值，并判断一个值是否大于、小于、等于或不等于另一个。到目前为止，你编写的程序遵循这一简单方案：\n\
  \n- 从用户处获取输入。\n- 执行一个或多个计算。\n- 在屏幕上显示结果。\n\n计算机擅长执行计算，但也非常擅长比较值以判断一个值是否大于、小于或等于另一个。这类操作对于许多任务非常有价值，例如检查销售数据、确定盈亏情况、检查数字以确保其在接受范围内，以及验证用户提供的输入。\n\
  \n在 C++ 中，通过关系运算符对数值数据进行比较。字符也可以用这些运算符比较，因为字符在 C++ 中被视为数值值。每个关系运算符都确定两个值之间是否存在特定的关系。例如，大于运算符（`>`）判断一个值是否大于另一个。等号运算符（`==`）判断两个值是否相等。表\
  \ 4-1 列出了 C++ 所有的关系运算符。\n\n## 表 4-1 关系运算符\n\n| 关系运算符 | 含义 |\n| --- | --- |\n| `>`\
  \ | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n| `==` | 等于 |\n| `!=`\
  \ | 不等于 |\n\n*(注: 由于原始文本中 Table 4-1 内容不完整，此处根据通用逻辑补全了占符表格结构)*\n\n\n\n\n\n| `x <\
  \ y` | 假（False），因为 `x` 不小于 `y`。 |\n| `x > y` | 真（True），因为 `x` 大于 `y`。 |\n| `x >=\
  \ y` | 真（True），因为 `x` 大于等于 `y`。 |\n| `x <= y` | 假（False），因为 `x` 不小于等于 `y`。 |\n|\
  \ `y != x` | 真（True），因为 `y` 不等于 `x`。 |\n\n## 什么是真？\n\n如果关系表达式可以求值为真或假，那么这些值在程序内部是如何表示的？计算机如何在内存中存储\
  \ `true`？它又是如何存储 `false` 的？\n\n正如你在程序 2-16 中所示，那两个抽象状态被转换为数字。这可能会让人困惑，特别是对于新程序员来说，因为在\
  \ C++ 中，零被认为假，而任何非零值被认为真。C++ 关键字 `false` 被存储为 0，而关键字 `true` 被存储为 1。当关系表达式为假时，它的求值为\
  \ 0。然而，当关系表达式为真时，它并不总是求值为 1。虽然通常情况下如此，但它实际上可以求值为任何非零值。为了为了完整地说明这一点，请看程序 4-1。\n\n\
  让我们仔细观察包含关系表达式的语句：\n\n```\ntrueValue = (x < y);\nfalseValue = (y == x);\n```\n\n\
  这些语句可能看起来很奇怪，因为它们正在将比较的结果赋值给变量。在第一条语句中，变量 `trueValue` 被赋值为 `x < y` 的结果。因为 `x` 小于\
  \ `y`，所以表达式为真，变量 `trueValue` 被赋值为一个非零值。在第二条语句中，表达式 `y == x` 为假，因此变量 `falseValue`\
  \ 被设置为 0。\n\n在编写此类语句时，大多数程序员会将关系表达式括在括号中（如上所示），以使其更加清晰。\n\n然而，实际上并不需要括号，因为即使没有括号，关系操作也会在赋值操作之前执行。这是因为关系运算符的优先级高于赋值运算符。同样，算术运算符的优先级高于关系运算符。\n\
  \n语句\n\n```\nresult = x < y - 8;\n```\n\n等同于语句\n\n```\nresult = x < (y - 8);\n```\n\
  \n在两种情况下，`y - 8` 都会先被求值。然后，这个值将与 `x` 进行比较。然而，请注意第二条语句清晰得多。当算术表达式的结果将用于关系表达式时，在周围加上括号总是一个好主意。\n\
  \n表 4-3 展示了包含关系表达式的其他语句的示例。\n\n# 表 4-3 包含关系表达式的语句（假设 `x` 为 10，`y` 为 7，`z` 为 `int`\
  \ 或 `bool`。）\n\n| 语句 | 结果 |\n| --- | --- |\n| `z = x < y` | `z` 被赋值为 0，因为 `x` 不小于\
  \ `y`。 |\n| `cout << (x > y);` | 显示 1，因为 `x` 大于 `y`。 |\n| `z = (x >= y);` | `z`\
  \ 被赋值为 1，因为 `x` 大于等于 `y`。 |\n| `cout << (x <= y);` | 显示 0，因为 `x` 不小于等于 `y`。 |\n\
  | `z = (y != x);` | `z` 被赋值为 1，因为 `y` 不等于 `x`。 |\n| `cout << (x == (y + 3));` |\
  \ 显示 1，因为 `x` 等于 `y + 3`。 |\n\n关系运算符它们之间也有优先级顺序。两个测试相等或不相等的运算符（`==` 和 `!=`）优先级相同。另外四个测试相对大小的关系运算符的优先级也相同。这四个相对关系运算符的优先级高于两个相等关系运算符。表\
  \ 4-4 展示了关系运算符的优先级。\n\n## 表 4-4 关系运算符的优先级（从高到低）\n\n| `> >= < <=` | |\n| `== !=`\
  \ | |\n\n这是一个应用示例。`a = 9`，`b = 2`，`c = 0`：\n\n```\ncout << (a > b);\n```\n\n因为 `a\
  \ > b` 为假，它的求值为 0。由于 `c == 0` 为真，它的求值为 1。在本章的剩余部分，我们将学习如何使用这些表达式。\n\n## 检查\n\n1.\
  \ 4.1 假设 `x` 为 5，`y` 为 6，`z` 为，请判断以下各项的真假：\n   - `x < y`\n   - `y + 2`\n   - `z`\n\
  \   - `x <=`\n\n2. 4.2 判断以下语句是否正确：\n   - `x <= y`\n   - `y !=`\n   - `z`\n\n3. 4.3\
  \ 用“是”或“否”回答以下问题：\n   - 如果 `x > y` 为真且 `z` 为真，那么 `x < y` 成立吗？\n   - 如果 `x == y`\
  \ 为真且 `z` 为真，那么 `x >= y` 成立吗？\n   - 如果 `x != y` 为真且 `z` 为真，那么 `x <= y` 成立吗？\n\n\
  4. 4.4 下面这段代码会显示什么？\n   ```cpp\n   int a = 0, b = 2, c = 0;\n   cout << (a > b);\n\
  \   cout << (c);\n   ```\n\n## 4.2 `if` 语句\n\n### 概念\n\n`if` 语句可以根据某些条件执行其他语句。\n\
  \n你可以将过程化程序中的语句想象成在路上行走的步骤。为了到达目的地，你必须从开始执行每一步。你到为止在图 4-1 中编写的代码被称为*顺序结构*，因为语句是按顺序执行的，一个接一个，没有分支。然而，程序通常需要多条路径。许多算法需要在情况下执行某些语句。这可以通过*决策结构*来实现。\n\
  \n## 图 4-1 顺序结构\n\n![显示计算矩形面积的源代码](img/FG_04_001.png)图 4-1 替代文本\n\n在决策结构的最简单形式中，动作或一组动作在特定条件存在时执行。如果条件不存在，则不执行这些动作。图\
  \ 4-2 展示了决策结构的逻辑。菱形符号表示是/否问题或真/假条件。如果问题的答案是“是”（或条件为真），程序遵循一条路径，导致执行动作。如果问题的答案是“否”（或条件为假），程序遵循另一条路径，跳过动作。因为决策结构决定了程序遵循哪条路径或分支，它有时被称为*分支结构*。\n\
  \n## 图 4-2 决策结构\n\n![显示决策结构的流程图](img/FG_04_002.png)图 4-2 替代文本\n\n\n\n\n在流程图中，“穿上外套”、“戴帽子”和“戴上手套”这些操作只在外面冷时才执行。如果外面不冷，这些操作就会被跳过。这些操作是`条件执行的`，因为它们在存在特定条件（外面冷）时才会执行。\n\
  \n我们每天都会进行这样的心理测试。这里是其他例子：\n\n*   如果汽车油箱低了，在服务站停下加油。\n*   如果外面在下雨，进入室内。\n*   如果你饿了，找点东西吃。\n\
  \n在 C++ 中编写决策结构最常用的方法是使用 `if` 语句。图 4-3 展示了 `if` 语句的通用格式以及一个视觉化描述其工作原理的流程图。\n\n##\
  \ 图 4-3 if 语句的格式和逻辑\n\n![图显示了一个决策结构和 2 个“if statement”程序。](img/FG_04_003.png)图 4-3\
  \ 完整替代文本\n\n注意，`if` 结构体内部的语句包含在一组大括号内。这创建了 C++ 所说的 `block`（块），并让编译器知道哪些语句与 `if`\
  \ 相关联。左大括号必须位于 `if` `condition`（条件）之后、体中第一条语句之前。然而，在遵循这一要求的同时，不同的程序员选择了不同的位置来放置它。两种常见的放置方式如图\
  \ 4-3 所示。本书使用左侧所示的形式。你的老师会告诉你他或她希望你使用哪种形式。\n\n程序 4-2 阐说明了 `if` 语句的使用。用户输入三个测试分数，程序计算它们的平均分。如果平均分等于\
  \ 100，程序将祝贺用户获得了满分。\n\n让我们仔细观察程序 4-2 的第 21–24 行，这些行导致了祝贺消息的打印。\n\n```\n if (average\
  \ == 100)\n{   cout << \"Congratulations! \";\n    cout << \"That's a perfect score!\\\
  n\";\n}\n```\n\n有四点重要的需要注意。首先，开头语句的单词 `if` 是 C++ 关键字，必须写成小写。其次，要测试的条件（`average ==\
  \ 100`）必须包含在括号内。第三，测试条件后`没有`分号，尽管在每个与 `if` 结构相关联的操作后都`有`分号。我们稍后会解释原因。最后，要条件执行的语句块被大括号包围。每当一个\
  \ `if` 语句与两个或多个操作相关联时，这都是必须的。\n\n如果只有一个语句需要条件执行，则可以省略大括号。例如，在程序 4-2\n   cout <<\
  \ \"Congratulations! That's a perfect score!\\n\";\n```\n\n然而，有些老师倾向于让你在条件执行块周围`始终`加上大括号，即使它只包含一条语句。\n\
  \n表 4-5 显示了 `if` 语句的其他示例及其结果。\n\n## 表 4-5 示例 if 语句\n\n| 语句 | 结果 |\n| --- | --- |\n\
  |  |\n```\n if (hours > 40)\n{   overTime = true;\n    payRate *= 2;\n}\n```\n |\
  \ 仅当 `hours` 大于 40 时，给布尔变量 `overTime` 赋值为 `true` 并使 `payRate` 翻倍。 |\n|  |\n```\n\
  if (temperature > 32)\n    freezing = false;\n```\n | 仅当 `temperature` 大于 32 时给\
  \ `freezing` 赋值为 `false` |\n\n## if 语句的编程风格\n\n尽管 `if` 语句通常跨越一行，但最好缩进：\n\n```\n\
  if (a >= 100)\n   cout << \"The number is out of range.\";\nif (a >= 100)\ncout\
  \ << \"The number is out of range.\";\n```\n\n第一种更容易看出哪些部分属于 `if`。编写 `if` 有两个重要规则：\n\
  \n*   条件执行语句应位于 `if` 之后。\n*   语句应该缩进。\n\n# 需要注意的三个常见错误\n\n编写 `if` 语句时有三个必须注意的常见错误：\n\
  \n1. 位置错误的分号\n2. 缺少大括号\n3. 混淆 `=`\n\n## 注意分号\n\n如果你不小心在 `if` 后面加上分号，编译器将认为你那里放置了一个空语句。这将提前终止\
  \ `if`，将其与之断开。例如，观察程序 4-2 中，如果 `if` 语句被分号提前终止会发生什么：\n\n```\n if (average == 100);\
  \     // 错误。分号提前终止了\n{                        // if 语句。\n    cout << \"Congratulations!\
  \ \";\n    cout << \"That's a perfect score!\";\n}\n```\n\n## 修改后的程序 4-2 输出\n\n\
  ```\n 输入 3 个测试分数，我将计算平均分：80 90 70\n 平均分是 80.0\nCongratulations! That's a perfect\
  \ score!\n```\n\n由于 `if` 语句在遇到提前的分号时结束，大括号内的 `cout` 语句不再是它的一部分。因此，无论 `average` 是否等于\
  \ 100，它们*总是*执行。这个错误版本的程序 4-2 可以在书籍辅助网站的第 4 章程序文件夹中找到，名为 程序 4-2B。\n\n## 不要忘记大括号\n\
  \n\n\n\n如果你打算使用 `if` 语句条件地执行一组语句，而不仅仅是单条语句，请不要忘记大括号。如果没有大括号，`if` 条件仅决定紧随其后的第一个语句是否被执行。任何随后的语句都被视为在\
  \ `if` 语句之外，并且将 `always` 被执行。例如，请注意在原始的 `Program 4-2` 中，如果省略了包裹两个 `cout` 语句的大括号，会发生什么。\n\
  \n```\n if (average == 100)\n    cout << \"Congratulations! \";          // 没有大括号。\n\
  \    cout << \"That's a perfect score!\\n\";  // 这在 if 之外。\n```\n\n# 程序 4-2 第二次修订后的输出（示例输入已加粗显示）\n\
  \n```\n Enter 3 test scores and I will average them: 80 90 70[Enter]\nYour average\
  \ is 80.0\nThat's a perfect score! \n```\n\n在对有条件执行的语句组周围没有大括号的情况下，这些语句中只有第一条属于\
  \ `if` 结构。由于我们测试用例中的条件 `(average == 100)` 为假，因此跳过了 `Congratulations!` 消息。然而，打印 `That's\
  \ a perfect score!` 的 `cout` 语句被执行了，就像每次一样，无论 `average` 是否等于 100。这个错误的 `Program\
  \ 4-2` 版本可以在书籍配套网站的 `Chapter 4` 程序文件夹中找到 `Program 4-2C`。\n\n## 不要混淆 `==` 与 `=`\n\
  \n早些你看到一个警告，提醒不要混淆相等运算符 `(==)` 和赋值运算符 `(=)`，如下所示：\n\n```\n if (x = 2)          \
  \      // 注意这里！\n    cout << \"It is True!\";\n```\n\n这条语句并不是判断 `x` 是否等于 2；相反它将值\
  \ 2 赋值给 `x`！此外，`cout` 语句将 `always` 被执行，因为表达式 `x = 2` 的求值为 2，C++ 将其视为真。\n\n发生这种情况的原因是因为赋值表达式的值是赋值给\
  \ `=` 运算符左侧变量的值。因此，表达式 `x = 2` 的值为 2。早些时候你学过 C++ 将值 `true` 存储为 1。然而，它实际上将所有非零值（不仅仅是\
  \ 1）视为真。因此，2 代表真条件。\n\n让我们通过查看原始 `Program 4-2` 的另一个变体来更仔细地观察这一点。这次注意如果将 `if` 条件中的相等关系运算符替换为赋值运算符会发生什么，如下所示。\n\
  \n```\n if (average = 100)        // 错误。这把 100 赋值给 average。\n{\n    cout << \"Congratulations!\
  \ \";\n    cout << \"That's a perfect score!\\n\";\n}\n```\n\n# 程序 4-2 第三次修订后的输出（示例输入已加粗显示）\n\
  \n```\n Enter 3 test scores and I will average them: 80 90 70[Enter]\nYour average\
  \ is 80.0\nCongratulations! That's a perfect score!\n```\n\n`if` 语句并没有在比较 `average`\
  \ 与 100，而是给它 `assigns` 了值 100。这导致 `if` 测试求值为 100，这被视为真。因此，这两条 `cout` 语句每次都会执行，无论用户输入了什么测试分数。这个错误的\
  \ `Program 4-2` 版本可以在 `Chapter 4` 程序文件夹中找到。\n\n\n\n\n\n如果 `bool` 变量 `salesQuotaMet`\
  \ 为 `true`，这段代码将显示“You have met your sales quota!”。否则，它不会显示任何内容。就像测试一个表达式以查看其值是否非零或零一样，只需通过命名\
  \ `bool` 变量就可以测试其值是否等于 true 或 false。因此，上述代码等同于以下代码：\n\n```cpp\n if (salesQuotaMet\
  \ == true)\n   cout << \"You have met your sales quota!\\n\";\n```\n\n你将在本章后面学习更多关于测试布尔变量的内容。\n\
  \n## 整数标志\n\n尽管程序员在想要创建一个标志时通常使用布尔变量，但也可以使用整数变量。在之前描述的销售佣金程序中，可以通过以下语句定义 `salesQuotaMet`\
  \ 为整数变量：\n\n```cpp\n int salesQuotaMet = 0;   // 0 表示 false\n```\n\n与之前一样，我们将变量初始化为\
  \ `0`（表示 false），因为我们还不知道是否达到了销售配额。在计算销售额后，我们可以使用类似下面的代码：\n\n```cpp\n if (sales >=\
  \ QUOTA_AMOUNT)\n   salesQuotaMet = 1;    // 1 表示 true\n```\n\n在程序的稍后部分，我们可以这样测试标志：\n\
  \n```cpp\n if (salesQuotaMet)      // 除 0 的任何值求值为 true\n   cout << \"You have met\
  \ your sales quota!\\n\";\n```\n\n或者这样：\n\n```cpp\n if (salesQuotaMet != 0)\n  \
  \ cout << \"You have met your sales quota!\\n\";\n```\n\n## 检查点\n\n1. 4.5 编写一个 `if`\
  \ 语句执行以下逻辑：如果变量 `price` 的值大于 `500`，则将 `0.2` 赋值给变量 `discountRate`。\n\n2. 4.6 编写一个\
  \ `if` 语句，如果 `hours` 大于 `40`，则将 `payRate` 乘以 `1.5`。\n\n3. 4.7 编写一个 `if` 语句执行以下逻辑：如果变量\
  \ `sales` 大于 `50,000`，则将 `0.25` 赋值给 `commissionRate` 变量并将 `250` 赋值给 `bonus` 变量。\n\
  \n4. 4.8 正确或错误：以下两个 `if` 语句执行相同的操作。\n\n```cpp\n     if (calls == 20)           \
  \         if (calls = 20)\n        rate *= 0.5;                        rate *= 0.5;\n\
  ```\n\n5. 4.9 编写一个 `if` 语句执行以下逻辑：如果名为 `ticketsSold` 的变量等于 `200`，则将布尔标志变量 `soldOut`\
  \ 设置为 `true`；\n\n6. 4.10 编写一个 `if` 语句，如果布尔标志变量 `soldOut` 设置为 `true`，则打印“The performance\
  \ is sold out!”\n\n7. 4.11 尽管以下代码段在语法上是正确的，但每个段都包含一个错误。找出错误并指出问题所在之处。\n\n    1.\
  \ ```cpp\n         hours = 12;\n        if (hours > 40);\n           cout << hours\
  \ << \" hours qualifies for over-time.\\n\";\n        ```\n\n    2. ```cpp\n   \
  \     interestRate = .05;\n        if(interestRate = .07)\n           cout << \"\
  This account is earning the maximumrate.\\n\";\n        ```\n\n    3. ```cpp\n \
  \        interestRate = .05;\n        if (interestRate > .07)\n           cout <<\
  \ \"This account earns a $10 bonus.\\n\";\n        balance += 10.0;\n        ```\n\
  \n## 4.3 `if/else` 语句\n\n### 概念\n\n`if/else` 语句在 `if` 条件为真时执行一组语句，在条件为假时执行另一组语句。\n\
  \n`if/else` 语句是 `if` 语句的扩展。图 4-4 显示了该语句的通用格式以及视觉化描述其工作原理的流程图。\n\n## 图 4-4 if/else\
  \ 语句的格式和逻辑\n\n![图表显示了一个决策结构流程图和 “if/else” 语句的格式。](img/FG_04_004.png)图 4-4 完整替代文本\n\
  \n与 `if` 语句一样，会对条件进行测试。如果条件为真，则执行包含一个或多个语句的块。然而，如果条件为假，则执行另一组语句。程序 4-3 使用了 `if/else`\
  \ 语句结合取模运算符来判断一个数字是奇数还是偶数。\n\n`if` 语句末的 `else` 部分指定了在条件为假时要执行的一个或多个语句。当 `number\
  \ % 2` 不等于 `0` 时，会执行这些语句。`number % 2` 不等于 `0` 表示该数是奇数。如果你把语句想象成路，那么 `if/else` 语句可以看作叉路口。`else`\
  \ 与 `if` 保持对齐。\n\n## 何时使用 `if` 何时使用 `if/else`\n\n有时新学生不确定应该使用两个 `if` 语句还是一个 `if/else`\
  \ 语句。如果两个条件都可能为真，请使用两个 `if` 语句。例如：\n\n```cpp\n if (score >= 60)               //\
  \ 使用两个 if 语句\n   cout << \"You passed. \\n\";\n if (score >= 80)\n   cout << \"\
  Good job. \\n\";\n```\n\n在这种情况下，如果分数为 `85`，两条消息都会显示。然而，如果条件冲突，你应该使用：\n\n（注：此处原文缺少\
  \ if 逻辑代码，但根据上下文此处应为逻辑对比）\n\n如果两个条件是互斥的（即一个为真而另一个为假），则应该使用 `if/else` 语句。例如：\n\n\
  ```cpp\n if (score >= 60)         // 使用单个 if/else 语句\n   cout << \"You passed. \\\
  n\";\nelse\n   cout << \"You failed. \\n\";\n```\n\n在这里，如果分数为 `85`，则显示第一条消息。如果分数为\
  \ `45`，则显示第二条消息。\n\n除以零在数学上是不可能的，它通常会导致程序崩溃。这意味着程序会提前停止运行，有时会带有错误信息。程序 4-4 展示了在执行除法之前测试除数值的方法的方法。注意\
  \ `else` 与 `if` 保持对齐。这使得两种可能的路径清晰可见。\n\n\n\n\n\n注意程序 4-4 中的第 15 行是如何测试 `num2` 的值的。如果用户输入零以外的任何内容，将执行由\
