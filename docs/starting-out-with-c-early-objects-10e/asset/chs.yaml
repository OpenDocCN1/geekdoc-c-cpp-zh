  \ 转换为数值整数并存储在变量 `num` 中。\n\n# 12.6 编写你自己的 C 字符串处理函数\n\n### 概念\n\n你可以设计专门用于处理字符串的自定义函数。\n\
  \n\n\n\n通过将数组作为参数传递，你可以编写自己的函数来处理 C 字符串。例如，程序 12-13 使用一个函数将 C 字符串从一个数组复制到另一个数组。\n\
  \n注意，程序 12-13 中的 `stringCopy` 函数不接受指示数组大小的参数。它简单地将字符从源字符串复制到目标字符串，直到在源字符串中遇到空终止符。当找到空终止符时，循环就到达了\
  \ C 字符串的末尾。函数中的最后一个语句将空终止符（`'\\0'` 字符）赋值给 `string2` 的末尾，使其能够正确终止。\n\n### 警告！\n\n\
  由于 `stringCopy` 函数不知道目标数组的大小，因此程序员有责任确保目标数组足够大以容纳源字符串数组。\n\n程序 12-14 使用了另一个 C 字符串处理函数：`nameSlice`。该程序要求用户输入其名和姓，中间用空格分隔。该函数在字符串中搜索空格并将其替换为空终止符。实际上，这截断了字符串末尾的姓。\n\
  \n`nameSlice` 中的以下循环从数组中的第一个字符开始并扫描字符串，寻找空格或空终止符：\n\n```\nwhile (userName[k] !=\
  \ ' ' && userName[k] != '\\0')\n   k++;\n```\n\n如果 `userName[k]` 中的字符不是空格或空终止符，则\
  \ `k` 加增，并检查下一个字符。以输入“`Jimmy` `Jones`”为例，循环在 `userName[5]` 处找到了分隔“`Jimmy`”和“`Jones`”的空格。当循环停止时，`k`\
  \ 被设置为 5。这在图 12-3 中所示。\n\n### 图 12-3 在字符串中搜索空格\n\n![内存存储显示了 13 个下标从 0 到 12 的矩形。](img/FG_12_003.png)图\
  \ 12-3 完整备用文本\n\n### 注意\n\n如果遇到空终止符，循环将停止，这样如果用户没有输入空格，它就不会超出数组边界。\n\n一旦循环结束，`userName[k]`\
  \ 将包含空格或空终止符。如果它包含空格，后续的 `if` 语句将其替换为空终止符，其操作如图图 12-4\n   userName[k] = '\\0';\n\
  ```\n\n### 图 12-4 将空格替换为空终止符\n\n![内存存储显示了 13 个下标从 0 到 12 的矩形。](img/FG_12_004.png)图\
  \ 12-4 完整备用文本\n\n新的空终止符现在成为了字符串的末尾。\n\n## 使用指针传递 C 字符串参数\n\n指针对于编写处理 C 字符串的函数非常有用。如果将字符串的起始地址传递到指针参数变量中，可以假设从该地址到持有空终止符的字节的所有字符都是字符串的一部分。（不需要知道存储字符串的数组长度。）\n\
  \n程序 12-15 展示了一个函数 `countChars`，它使用指针来计算特定字符在 C 字符串中出现的次数。在函数 `countChars` 中，`strPtr`\
  \ 指向要搜索的 C 字符串，`ch` 包含要查找的字符。`while` 循环只要 `strPtr` 指向的字符不是空终止符就会重复：\n\n```\nwhile\
  \ (*strPtr != '\\0')\n```\n\n在循环内部，`if` 语句比较 `strPtr` 指向的字符与 `ch`：\n\n```\nif (*strPtr\
  \ == ch)\n```\n\n如果两者相等，`count` 就会递增（`count` 记录了出现的总次数）。\n\n```\ncount++;\n```\n\
  \n最后语句增加了 `strPtr`。当 `strPtr` 最终遇到空终止符时，循环停止并返回 `count` 的值。\n\n## 检查\n\n12.18 下述程序的输出是什么？\n\
