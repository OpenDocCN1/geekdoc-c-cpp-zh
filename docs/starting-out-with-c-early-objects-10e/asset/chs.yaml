  \ `switch` 语句的结束括号之后的任何语句。每当你想要“退出” `switch` 语句时，都需要 `break` 语句，因为它不像 `if/else if`\
  \ 语句那样在执行完一组语句后自动退出。\n\n4. `case` 语句显示程序从块中的哪里开始执行，而 `break` 语句显示程序从哪里停止。如果没有 `break`\
