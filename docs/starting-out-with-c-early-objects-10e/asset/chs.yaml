  \ 12-4` 显示了字面量的存储的位置。。\n\n# 程序员定义的字符数组 (Programmer-Defined Arrays of Character)\n\
  \n字符串字面量只能包含硬编码在程序中的 C 字符串。为了获得从键盘或文件读取字符的 C 字符串，你必须显式定义一个数组来存放这些字符。在此过程中，你应该确保为数组分配一个额外的条目用于存储空字符。例如，如果你的\
  \ C 字符串最多长 19 个字符，你需要分配一个 20 个字符的数组，如下：\n\n```\nconst int SIZE = 20;\nchar company[SIZE];\n\
  ```\n\n当以此方式使用字符串字面量初始化数组时，数组定义中的大小是可选的。如果不指定，编译器会将大小设置为比初始化字符串字面量中的字符数多一个（从而为空终止符留出空间）。\n\
  \n\n\n\n\n如第 3 章 所述，定义为数组的 C 字符串可以使用输入/输出流类的各种对象、运算符和成员函数进行读写。存储为程序员定义数组的 C 字符串可以使用标准的下标表示法进行处理。程序\
  \ 12-5 是一个示例。它每次输出一个字符的字符串，并在找到空终止符时停止。它使用 `getline` 成员函数来读取要输出的字符串，该函数在第 3 章中介绍过。\n\
  \n# 指向 `char` 的指针\n\n正如我们看到的，C 字符串可以表示为字符串字面量或字符数组。这两种方法都会分配一个数组，然后将数组地址作为指向 `char`\
  \ 的指针来实际表示字符串。两者的区别在于，第一情况下，用于存储字符串的数组由编译器隐式分配；而在第二情况下，数组是由程序员显式分配的。\n\n表示 C 字符串的第三种方法使用指向\
  \ `char` 的指针指向一个通过另外两种方法分配了空间的 C 字符串。以下是这样使用 C 字符串的一些示例：\n\n```cpp\nchar name[]\
  \ = \"John Q. Public\";\nchar *p;\np = name;                // 指向已有的 C 字符串\ncout\
  \ << p << endl;       // 打印\np = \"Jane Doe\";          // 指向另一个 C 字符串\ncout <<\
  \ p << endl;       // 打印\n```\n\n使用指针变量表示 C 字符串的一个主要优势是可以让指针指向不同的 C 字符串。\n\n另一种使用指向\
  \ `char` 的指针作为 C 字符串的方法是定义指针，然后将其设置为指向由 `new` 运算符返回的动态分配存储。这在程序 12-6 中所示。\n\n使用指向\
  \ `char` 的指针作为 C 字符串时的一个常见错误是在指针未指向正确分配的 C 字符串时使用它。例如，以下代码：\n\n```cpp\nchar *pname;\n\
  cout << \"Enter your name: \";\ncin  >> pname;\n```\n\n这段代码是错误的，因为程序尝试将字符串读入 `pname`\
  \ 所指向的内存位置，而此时 `pname` 尚未经过初始化。\n\n# 12.4 用于 C 字符串的库函数\n\n### 概念\n\nC++ 库提供了许多处理\
  \ C 字符串的函数。C++ 库提供了许多可以用于处理 C 字符串的函数。这些用于确定字符串长度、连接两个字符串、比较两个字符串以及在另一个字符串中搜索另一个字符串出现处的函数。使用这些函数必须包含\
  \ `<cstring>` 头文件。\n\n## `strlen` 函数\n\n`strlen` 函数接受一个 C 字符串作为参数并返回字符串的长度。这是直到空终止符（但不包括它）的字符数。例如，在代码段中：\n\
  \n```cpp\nchar str[] = \"Hello\";\nint length = strlen(str);\n```\n\n变量 `length`\
  \ 将存储数字 5。\n\n字符串的长度不应与持有它的数组的大小混淆。记住，传递给 `strlen` 的唯一信息是 C 字符串的起始。它不知道数组何时结束，因此它寻找空终止符来指示字符串的结束。\n\
  \n## 传递 C 字符串参数\n\n由于 C 字符串是指向 `char` 的指针，因此 C 字符串处理函数取的参数是 `char` 数组，或者等价于指向 `char`\
  \ 的指针。C 字符串可以用 C 字符串采取的三种形式中的任意一种传递给函数：\n\n*   字符串字面量\n*   存储 C 字符串的数组名\n*   持有\
  \ C 字符串地址的指针变量\n\n## `strcat` 函数\n\n另一个 C 字符串处理函数的示例是 `strcat`。`strcat` 函数接受两个字符串作为参数并将它们连接，返回一个由第一个字符串的所有字符后跟第二个字符串的所有字符组成的单个字符串。以下是它的用法示例：\n\
  \n```cpp\nconst int SIZE = 13;\nchar string1[SIZE] = \"Hello \";\nchar string2[]\
  \ = \"World!\";\ncout << string1 << endl;\ncout << string2 << endl;\nstrcat(string1,\
  \ string2);\n```\n\n`strcat` 函数将 `string2` 的内容拷贝到 `string1` 之后。在这个示例中，调用之前 `string1`\
  \ 包含“Hello ”。调用之后它包含了“Hello World!”。图 12-2 显示了数组的内容。\n\n**警告！** 如果持有第一个字符串的数组不够大，`strcat`\
  \ 将溢出。\n\n## `strcpy` 函数\n\n`strcpy` 函数可以将一个 C 字符串拷贝到另一个。这是它的用法示例：\n\n```cpp\nconst\
  \ int SIZE = 20;\nchar name[SIZE];\nstrcpy(name, \"Albert Einstein\");\n```\n\n\
  第二个 C 字符串被拷贝到第一个参数指定的地址。如果第一个参数引用的位置已经存储了任何内容，它将被覆盖。\n\n**警告！** 遵循 C++ 的本质，`strcpy`\
  \ 不进行边界检查。如果第一个参数指定的数组不够大，将发生溢出。\n\n## 比较 C 字符串\n\n赋值和关系运算符适用于 C++ `string` 类，是因为它们已经针对该类进行了重载。然而，正如赋值运算符不能用于给\
  \ C 字符串赋值一样，关系运算符 `<=` `<` `>=` `!=` 和 `==` 也不能用于比较 C 字符串。这是因为当与 C 字符串使用时，这些运算符比较的是存储字符串的地址，而不是比较组成字符串的实际字符序列。程序\
  \ 12-7 显示了使用相等运算符比较 C 字符串的错误结果。\n\n尽管输入的两个相同的字符串，[程序 12-7] 总是报告它们不相等。这是因为表达式：\n\n\
  ```cpp\nfirstString == secondString\n```\n\n\n\n\n在 `if` 语句中比较的是两个数组的内存地址，而不是存储在这些地址上的字符字符串。由于这些地址不同，因此比较的结果为\
  \ `false`。实际上，在 C++ 中，即使是比较\n\n```\n\"abc\" == \"abc\"\n```\n\n通常也会得到 `false` 的结果。这是因为大多数编译器不会检查是否之前遇到过字符串字面量，并将两个字符串存储在不同的内存地址。编译器随后会比较这两个不同的地址，导致结果为\
  \ `false`。\n\n# `strcmp` 函数\n\n为了正确地比较 C 字符串（C-strings），你应该使用库函数 `strcmp`。该函数接受两个\
  \ C 字符串作为参数，并返回一个整数，表示两个字符串之间的比较情况。它的函数原型如下：\n\n```\nint strcmp(char *string1, char\
  \ *string2);\n```\n\n表示该函数接受两个 C 字符串作为参数（记住 `char *` 是 C 字符串的类型）并返回一个整数结果。结果的值根据以下约定设置：\n\
  \n- 如果两个字符串按字符逐个比较是`equal`，则结果为`zero`。\n- 如果 `string1` 在字母顺序上于 `string2` `before`，则结果为`negative`。\n\
  - 如果 `string1` 在字母顺序上于 `string2` `after`，则结果为`positive`。\n\n这里有一个使用 `strcmp` 判断两个字符串是否相等的示例：\n\
  \n```\nif (strcmp(string1, string2) == 0)\n    cout << \"The strings are equal\"\
  ;\nelse\n    cout << \"The strings are not equal\";\n```\n\n程序 12-7 错误地使用关系运算符测试了两个\
  \ C 字符串，可以使用 `strcmp` 函数进行正确重写，如 程序 12-8 所示。\n\n`strcmp` 函数在比较字符串时是区分大小写的。如果用户在\
  \ 程序 12-8 中输入“Dog”和“dog”，它将报告它们不同。某些编译器提供了 `strcmp` 的非标准版本，可以执行不区分大小写的比较。此类函数的工作方式与\
  \ `strcmp` 相同，只是忽略了字符的大小。\n\n程序 12-9 是关于如何使用 `strcmp` 的更实用的示例。它要求用户输入他们想要购买的部件编号。部件编号包含数字、字母和连字符，因此它必须存储为字符串。一旦用户输入部件编号，程序就会显示其价格。\n\
  \n# 在 `strcmp` 中使用 `!`\n\n某些程序员在测试字符串是否相等时，更倾向于在 `strcmp` 上使用逻辑非（NOT）运算符。由于 0 被认为是逻辑上的\
  \ `false`，因此 `!` 运算符会将该值转换为 `true`。表达式 `!strcmp(string1, string2)` 在两个字符串相同时会返回\
  \ `true`，在它们不同时返回 `false`。以下两个语句在执行时具有完全相同的效果：\n\n```\nif(strcmp(str1, str2) ==\
  \ 0) cout << \"equal\";\nif(!strcmp(str1, str2)) cout << \"equal\";\n```\n\n# 字符串排序\n\
  \n由于 `strcmp` 返回关于所比较的两个字符串相对字母顺序的信息，因此它可以对 C 字符串列表进行排序。程序 12-10 是此的简单说明：它要求用户输入两个名字，然后按字母升序顺序打印。\n\
  \n表 12-3 总结了这里讨论的字符串处理函数以及其他函数。（列出的所有函数都需要 `cstring` 头文件。）\n\n# 表 12-3 选定的 C 字符串函数\n\
  \n| 函数 | 描述 |\n| --- | --- |\n| `strlen` | 接受一个 C 字符串作为参数。返回 C 字符串的长度（不包括空字符）。用法：`len\
  \ = strlen(name);` |\n| `strcat` | 接受两个 C 字符串作为参数。将第二个字符串附加到第一个字符串上（第一个字符串会被改变，第二个字符串保持不变）。用法：`strcat(string1,\
  \ string2);` |\n| `strcpy` | 接受两个 C 字符串作为参数。将第二个字符串复制到第一个字符串中。用法：`strcpy(string1,\
  \ string2);` |\n| `strcmp` | 接受两个字符串。如果 `string1` 和 `string2` 相同，该函数返回 `0`；如果 `string2`\
  \ 在字母顺序上大于 `string1`，则返回负数；如果 `string2` 在字母顺序上小于 `string1`，则返回正数。用法：`if (strcmp(string1,\
  \ string2))` |\n\n## Checkpoint\n\n1. 12.6 简要描述每个：\n    - `strlen`\n    - `strcat`\n\
  \    - `strcpy`\n    - `strcmp`\n2. 12.7 下面的代码将显示什么？\n```\ndog[] = \"Fido\";\ncout\
  \ << strlen(dog) << endl;\n```\n3. 12.8 假设 `SIZE` 值为 16。下面的代码将显示什么？\n```cpp\nchar\
  \ string1[SIZE] = \"Have \";\nchar string2[] = \"nice day\";\nstrcat(string1, string2);\n\
  cout << string1 << endl;\ncout << string2 << endl;\n```\n4. 12.9 写一个语句将“Beethoven”拷贝给\
  \ `composer`。\n5. 12.10 编写代码使用 `getline` 函数读取输入到字符数组中，然后打印 ‘e’ 字符的数量。\n6. 12.11\
  \ 说明以下 `strcmp` 函数调用将返回 0、负数还是正数。参考附录 A 中的 ASCII 表（如有必要）：\n    - `strcmp(\"ABC\"\
  , \"abc\")`\n    - `strcmp(\"Jill\", \"Jim\")`\n    - `strcmp(\"123\", \"ABC\")`\n\
  \    - `strcmp(\"Sammy\", \"Sally\")`\n7. 12.12 完成以下程序框架中的 `if` 语句。\n\n    ```cpp\n\
  \    #include <iostream>\n       using namespace std;\n\n       int main()\n   \
  \    {\n          const int LENGTH = 20;\n          char iceCream[LENGTH];\n   \
  \       cout << \"你最喜欢什么口味的冰淇淋？ \";\n          cout << \"巧克力、香草还是坚果仁？ \";\n    \
  \      cin.getline(iceCream, LENGTH);\n          cout << \"半杯装的脂肪含量为：\\n\";\n  \
  \        //\n          // 完成以下 if-else 语句，\n          // 使程序能够选择用户输入的冰淇淋\n     \
  \     //\n          if (/*在此处插入代码 */)\n             cout << \"巧克力: 9 克。\\n\";\n\
  \          else if (/*在此处插入代码 */)\n             cout << \"香草: 10 克。\\n\";\n    \
  \      else if (/*在此处插入代码 */)\n             cout << \"坚果仁: 14 克。\\n\";\n       \
  \   else \n             cout << \"那不是我们的口味之一！\\n\";\n          return 0;\n     \
  \  }\n    ```\n\n\n\n以字符串形式存储与以数值形式存储数字之间存在区别。字符串“2679”并不是一个数字：它是由构成数字 2679 的每个数字的字符的\
  \ ASCII 编码序列。由于字符串“2679”不是数字，编译器将不允许对其进行加法、乘法和除法等算术操作。表示数字的字符串在用于算术运算符之前，必须先转换为数值形式。同样，处于\
  \ `int`、`long` 和 `double` 等类型数值形式的程序值有时需要转换为字符串形式。生成的字符串可以立即输出到文件或其他输入/输出设备，也可以存储在内存中的字符串对象中以供日后使用。\n\
  \n当用户在键盘上输入数字时，该数字是以用户输入的字符（数字）序列的字符串形式录入的。在 C++ 中，这种数字通常通过流提取运算符 `>>` 读取。该运算符在存储到数值类型的变量之前，会根据需要自动执行转换。在输出时，通过流输出运算符\
  \ `<<` 执行从数值到字符串的反向转换。\n\n# 使用字符串流对象进行数值转换\n\nC++ 有两个类，`ostringstream` 和 `istringstream`，可用于对内存值进行字符串/数值转换。`ostringstream`\
  \ 类是 `ostream`（`cout` 所属类）的子类，并使用流插入运算符 `<<` 将数值转换为字符串。`ostringstream` 类型对象的工作方式与\
  \ `cout` 和文件对象相同，不同之处`ostringstream` 不是将数据写入屏幕或文件，而是将其数据写入其内部包含的字符串对象中。每当你对 `ostringstream`\
  \ 对象使用一次 `<<` 时，它都会执行任何必要的数值到字符串的转换，并将结果附加到字符串的末尾。除了支持 `ostream` 类的所有成员函数和运算符外，`ostringstream`\
  \ 对象还支持表 12-4 所示的 `str` 成员函数。\n\n# 表 12-4 `ostringstream` 和 `istringstream` 类的成员函数\n\
  \n| 成员函数 |  |\n| --- | --- |\n| `istringstream(string s)` | `istringstream:` 的构造函数：设置对象输入流的初始值。示例：`istringstream\
  \ istr(\"50 64 28\");` |\n| `ostringstream(string s)` | `ostringstream:` 的构造函数：设置对象输出流的初始值。示例：`ostringstream\
  \ ostr(\"50 64 28\");` |\n| `string str()` | 返回 `ostringstream` 或 `istringstream`\
  \ 对象中包含的字符串。\n```\n示例: string is = istr.str();\nstring os = ostr.str();\n``` |\n\
  | `void str(string &s)` | 设置作为对象输入或输出流的字符串。\n```\n示例: ostr.str(\"50 64 28\");\n\
  istr.str(\"50 64 28\");\n``` | |\n\n`istringstream` 类派生自 `istream`。它内部包含一个字符串对象，作为一个可以从中“读取”的输入流工作。可以在创建对象时通过\
  \ `istringstream` 构造函数设置输入流，也可以在对象创建后通过调用 `str(string s)` 函数设置。流提取运算符 `>>` 从封装的字符串中读取，并在需要时将字符串转换为数值。`istringstream`\
  \ 的成员函数也列在表 12-4 中。你必须在程序中包含 `<sstream>` 头文件才能使用这些类。\n\n程序 12-11 演示了这些类的用法。\n\n\
  注意，这些类拥有 `ostream` 和 `istream` 对象的完整功能，包括使用八进制和十六进制等不同进制将数字转换为字符串的能力。然而，它们确实有一个缺点，即迫使你创建\
  \ `sstream` 对象仅仅是为了使用它们的插入和提取运算符进行转换。\n\n# 数值转换函数\n\n11 C++ 11 提供了几个 `to_string(T\
  \ value)` 函数，将类型为 `T` 的数值转换为字符串形式。以下是几个 `to_string()` 函数的列表：\n\n```\nstring to_string(int\
  \ value)\nstring to_string(long value)\nstring to_string(double value)\n```\n\n\
  以下代码片段\n\n```\nint a = 5;\nstring str = to_string(a*a);\ncout << \"The square of\
  \ 5 is \" << str;\n```\n\n说明了如何使用该函数。它输出了```\n5 的平方是 25\n\n`to_string()` 函数无法处理\
  \ 10 以外的进制转换。如果你需要该功能，应该使用 `ostringstream` 对象。字符串到数值的转换由以下转换为 `int`、`long`、`float`\
  \ 和 `double` 的函数完成：\n\n```\nint stoi(const string& str, size_t pos = 0, int base\
  \ = 10)\nlong stol(const string& str, size_t pos = 0, int base = 10)\nfloat stof(const\
  \ string& str, size_t pos = 0, int base = 10)\ndouble stod(const string& str, size_t\
  \ pos = 0, int base = 10)\n```\n\n第一个参数 `str` 是要转换的字符串（例如 \"3.4\"）。`pos` 和 `base`\
  \ 参数是可选的，可以省略。如果省略 `pos`，则不存储索引；如果省略 `base`，假设为 10。如果字符串 `str` 有无效值，例如“-34”，则无法进行转换且函数将抛出\
  \ `invalid_argument` 异常。我们将在第 16 章中进一步学习异常。\n\n程序 12-12 演示了转换函数的用法。\n\n## 练习\n\n\
