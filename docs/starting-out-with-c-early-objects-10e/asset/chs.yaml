  \ GB 流量。然后显示应付金额。如果没有节省，不打印任何消息。尽可能使用命名常量代替数字。\n\n# 5 循环\n\n## 5.1 循环简介：`while`\
  \ 循环\n\n### Concept\n循环是程序中重复的部分。第 4 章包含了几个根据学生数字分数报告字母等级的程序。但如果我们想找出全班级 20 名学生的字母等级该该呢？我们需要运行程序\
  \ 20 次。如果我们能简单地在单次运行中指示代码重复 20 次不是更方便吗？幸运的是，有一种机制可以做到。它被称为循环。\n\n*循环* 是导致语句或语句组重复的控制结构。C++\
  \ 有三种循环控制结构：`while` 循环、`do-while` 循环和 `for` 循环。它们之间的区别在于如何控制重复。\n\n## `while` 循环\n\
  \n`while` 循环有两个重要的部分：(1) 一个用于测试真假值的表达式，以及 (2) 一个只要表达式为真就会重复的语句或代码块。图 5-1 显示了 `while`\
  \ 循环的一般格式以及一个视觉化描述其工作原理的流程图。\n\n# Figure 5-1 Format and Logic of the while Loop\n\
  ![An image shows a flow chart and the code for a “while” loop.](img/FG_05_001.png)Figure\
  \ 5-1 Format and Logic of the while Loop Full Alternative Text\n\n\n\n\n\n让我们来看\
  \ `while` 循环的每个部分。第一行有时被称为*循环头*（loop header），由关键字 `while` 以及后面跟的在括号内的待测试*条件*（condition）组成。该条件由任何可以求值为真或否的表达式表示。接下来是循环的*体部*（body）。它包含一个或多个\
  \ C++ *语句*（statements）。\n\n以下是循环的工作原理：测试条件表达式，如果为真，则执行循环体中的每条语句。然后再次测试条件。如果仍然为真，则再次执行每条语句。这个循环一直重复，直到条件为假。\n\
  \n注意，与 `if` 语句一样，循环体内根据条件执行的每条语句都以分号结尾，但括号内的条件表达式后没有分号。这是因为 `while` 循环如果没有跟随其后的语句，它是不完整的。此外，与\
  \ `if` 语句一样，当循环体包含两个或多个语句时，这些语句必须用括号括起来。当循环体只包含一个语句时，可以省略括号。本质上，`while` 循环的作用就像一个可以重复执行的\
  \ `if` 语句。只要括号中的表达式为真，根据条件执行的语句就会重复执行。\n\n[Program 5-1] 使用 `while` 循环打印五次“Hello”。\n\
  \n让我们仔细观察这个程序。在第 7 行，定义了一个整数变量 `count` 并将其初始化为值 1。在第 9 行，`while` 循环从该语句开始：\n\n```\n\
  while (count <= 5)\n```\n\n该语句测试变量 `count` 以确定其值是否小于或等于 5。因为如此，循环体中的语句（第 11 行和第\
  \ 12 行）被执行：\n\n```\ncout << \"Hello   \";\ncount = count + 1;\n```\n\n第 11 行的语句打印单词“Hello”。第\
  \ 12 行的语句将 `count` 加 1，使其值为 2。这是循环体中的最后一条语句，因此在执行它后循环重新开始。它再次测试表达式 `count <= 5`，因为其仍然为真，循环体中的语句再次执行。这个循环一直重复，直到\
  \ `count` 的值等于 6，使得表达式 `count <= 5` 为假。然后循环退出。这在[图 5-2]中所示。\n\n## 图 5-2 while 循环的工作原理\n\
  \n![图像显示了一个 while 循环并解释了它的元素。](img/FG_05_002.png)\n\n循环的每次执行被称为*迭代*（iteration）。此循环在测试表达式\
  \ `count <= 5` 并发现其为假之前将执行五次迭代，导致循环终止。程序随后从循环随后的下一条语句继续执行。控制循环迭代次数的变量被称为*循环控制变量*（loop\
  \ control variable）。在我们刚刚看到的示例中，`count` 就是循环控制变量。\n\n## `while` 是一个预测试循环\n\n`while`\
  \ 循环是一个*预测试*（pretest）循环。这意味着它在每次迭代之前都会测试其条件。如果测试表达式从开始为假，循环将永远不会迭代。所以，如果你想确保 `while`\
  \ 循环至少执行一次，你必须以这种方式初始化相关数据，使得测试表达式开始为真。例如，注意 [Program 5-1] 第 7 行中 `count` 的变量定义：\n\
  \n```\nint count = 1;\n```\n\n`count` 变量被初始化为值 1。如果 `count` 被初始化为大于 5 的值（如下程序段所示），循环将永远不会执行：\n\
  \n```\nint count = 6;\nwhile (count <= 5)\n{\n   cout << \"Hello    \";\n   count\
  \ = count + 1;\n}\n```\n\n## 无限循环\n\n在极少数情况下，循环必须包含一种终止方式。这意味着循环内部某些内容最终必须使测试表达式变为假。[Program\
  \ 5-1] 中的循环在表达式 `count <= 5` 变为假时停止。\n\n如果一个循环没有停止的方法，它被称为*无限循环*（infinite loop）。这是一个示例：\n\
  \n```\nint count = 1;\nwhile (count <= 5)\n{\n    cout << \"Hello    \";\n}\n```\n\
  \n## 注意分号\n\n通过在第一行后无意中放置一个分号，也可能创建一个无限循环。这是一个示例：\n\n```\nint count = 1;\nwhile\
  \ (count <= 5); // 这个分号是一个错误！\n{\n    cout << \"Hello   \";\n    count = count +\
  \ 1;\n}\n```\n\n因为编译器看到了分号，它解释为循环在此时结束。\n\n## 不要忘记大括号\n\n如果你写了一个根据条件执行语句块的循环，请不要忘记用大括号括起所有语句。如果漏了大括号，`while`\
  \ 语句将只根据条件执行后续的一条语句。例如，看以下代码：\n\n```\nint count = 1;\n// 这个循环缺少大括号！\nwhile (count\
  \ <= 5)\n    cout << \"Hello   \";\n    count = count + 1;\n```\n\n在这段代码中，只有一条语句——\
  \ `cout` 语句在 `while` 循环体内。增加 `count` 值的语句不在循环中，因此 `count` 的值保持为 1，且循环测试条件保持为真。循环将不断打印“Hello”，直到用户停止程序。\n\
  \n## 不要将 `=` 与 `==` 混淆\n\n循环的另一个常见陷阱是在你打算使用 `==` 运算符时，无意中使用了 `=` 运算符。以下是一个无限循环，因为测试表达式在每次求值时都会将\
  \ 1 赋值给 `remainder`，而不是测试 `remainder` 是否等于 1：\n\n```\nwhile (remainder = 1) // 错误：注意这里的赋值。\n\
  {\n     cout << \"Enter a number: \";\n     cin >> num;\n     remainder = num %\
  \ 2;\n}\n```\n\n记住，任何非零值都会被求值为真。\n\n## 编程风格与 `while` 循环\n\n可以创建这样的循环：\n\n```\nwhile\
  \ (count <= 5) { cout << \"Hello   \"; count = count + 1; }\n```\n\n然而，请避免这种编程风格。你在使用\
  \ `while` 循环时应该使用的编程布局风格与 `if` 语句相似：\n\n*   如果循环只重复一条语句，它应该出现在 `while` 语句的下一行，并缩进一级。\n\
  \n*   如果循环重复一个语句块，该块应该在 `while` 语句的下一行开始，并且大括号内的每行都应该缩进。\n\n你将在章介绍的其他类型循环中也会看到类似的布局风格。\n\
  \n\n\n\n\n现在你已经理解了 `while` 循环，让我们来看看它有多好用。程序 5-2 修改了上一节的程序 4-9，用于计算多个学生的字母成绩。\n\n\
  让我们来看看程序 5-2 的一些关键特性。`while` 循环的循环头位于第 28 行。循环体包含每次迭代时要执行的语句，位于第 29 行和第 57 行的大括号之间。循环控制变量是\
  \ `student`，它在循环开始前的第 25 行被初始化为 1。注意该变量在循环内部的第 56 行被更改了。这非常重要。因为在每次循环中它都会加 1，最终它将大于\
  \ `numStudents`，循环就会退出。虽然循环控制变量的主要目的是控制循环迭代的次数，但它也可以用于其他目的。注意程序 5-2 如何在第 31 行和第\
  \ 32 行将其当前值作为用户提示信息的一部分显示出来。\n\n## 检查点\n\n1. 5.1 以下每个 `while` 循环将显示多少行内容？\n\n  \
