  \ p);` | 返回 `theString` 中在位置 `p` 或或之后找到字符 `ch` 的第一个位置。如果未找到该字符，则返回 `string::npos`。\
  \ |\n| `theString.insert(p, str);` | 从位置 `p` 开始将 `str` 的拷贝插入 `theString`。参数 `str`\
  \ 可以是字符串对象或 C 字符串。 |\n| `theString.length();` | 返回 `theString` 中字符串的长度。 |\n| `theString.replace(p,\
  \ n, str);` | 将 `theString` 中从位置 `p` 开始的 `n` 个字符替换为字符串对象 `str` 中的字符。 |\n| `theString.size();`\
  \ | 返回 `theString` 中字符串的长度。 |\n| `theString.substr(p, n);` | 返回子串的拷贝。该子串长度为 `n`\
  \ 个字符，从 `theString` 的位置 `p` 开始。 |\n| `theString.swap(str);` | 交换 `theString` 与 `str`\
  \ 的内容。 |\n\n## 12.8 高级软件企业案例研究\n\n你是高级软件企业（Advanced Software Enterprises）的暑期实习生，你的老板要求你开发一个可以格式化美元金额字符串表示的函数。具体来说，他希望你能够在字符串的适当位置添加逗号和美元符号\
