  \ `case`，它对应于 `'A'`。\n\n```\n case 'a':\ncase 'A':cout << \"30 cents per pound.\\\
  n\";\n         break;\n```\n\n10. 相同的技术适用于 `'b'` 和 `'c'`。\n\n11. `switch` 语句是构建菜单驱动系统的自然机制，就像我们在程序\
  \ 4-10 中构建的那样。然而，在那个程序中，一旦用户选择了购买哪个包，程序就会使用 `if/else if` 语句来计算费用。程序 4-27 修改了该程序改为使用\
  \ `switch` 语句。注意 `switch` 语句是如何嵌套在 `if` 语句内部的，在提示月份数之前验证用户的菜单选择。\n\n# 4.13 Enumerated\
  \ Data Types\n\n### Concept\n\nC++ 中的枚举数据类型（enumerated data type）是一种程序员定义的数据类型，其合法值是一组命名的整数常量。\n\
  \n到此为止，我们已经使用了 C++ 语言内置的数据类型，如 `int` 和 `double`，以及由 C++ 类提供的对象类型，如 `string`。然而，C++\
  \ 也允许程序员创建自己的数据类型。*枚举数据类型*是一种程序员定义的数据类型，其唯一的合法值与一组命名的整数常量相关。它之所以被称为枚举类型，是因为命名的常量作为数据类型定义的一部分被枚举（即列举）出来。这是一个枚举类型声明的示例：\n\
  \n```\n enum Roster { Tom, Sharon, Bill, Teresa, John };\n```\n\n这创建了一个名为 `Roster`\
  \ 的数据类型。因为 `enum` 是 C++ 关键字，它必须小写。然而，注意数据类型名称本身以大写字母开头。虽然这不是要求的，但大多数程序员都会大写这个名称。与\
  \ `Roster` 数据类型相关的命名整数常量被称为*枚举符*（enumerators）。`Roster` 数据类型的变量只能具有与这些枚举符相关的值之一。但它们的值究竟是多少呢？默认情况下，编译器会将第一个枚举符设置为\
  \ 0，下一个设置为 1，依此类推。在我们的示例中，`Tom` 的值将是 0，`Sharon` 的值将是 1，依此类推。最后一个枚举符 `John` 的值将是\
  \ 4\\。在本节的后半部分，你将学习如何根据需要为这些命名的常量关联不同的值。\n\n\n\n\n重要的是意识到，`enum` 语句实际上并没有创建任何变量。它只是定义了数据类型。它说明了当我们以后创建这种数据数据类型的变量时，它们的样式将会是这样——其值受限于枚举集中与符号名称相关的整数。接下来的语句显示了如何定义一个\
  \ `Roster` 数据类型的变量。\n\n```\n Roster student;\n```\n\n该语句的格式与其他任何变量定义都一样：首先是数据类型名称，然后是变量名称。注意数据类型名称是\
  \ `Roster`，而不是 `enum Roster`。\n\n现在 `student` 变量已经创建，可以给它赋值，如下所示：\n\n```\n student\
  \ = Sharon;\n```\n\n然后可以这样测试变量的值：\n\n```\n if (student == Sharon)\n```\n\n注意在这两个示例中，`Sharon`\
  \ 周围没有双引号，因为它是一个命名常量，而不是字符串字面量。\n\n尽管枚举数据类型中的值实际上是以整数形式存储的，但你并不总是可以用整数值来替换符号名称。例如，我们不能这样将\
  \ `Sharon` 赋值为 `student` 的值：\n\n```\n student = 1;   // 错误！\n```\n\n然而，你可以通过整数值代替符号名称来测试枚举变量。例如，因为\
  \ `Bill` 被存储为 2，接下来的两个 `if` 语句是等价。\n\n```\n if (student == Bill)\nif (student ==\
  \ 2)\n```\n\n你还可以使用关系运算符来比较两个枚举变量。例如，接下来的 `if` 语句判断 `student1` 中存储的值是否小于 `student2`\
  \ 中存储的值：\n\n```\n if (student1 < student2)\n```\n\n如果 `student1` 等于 `Bill`（存储为 2），且\
  \ `student2` 等于 `John`（存储为 4），则该语句为真。然而，如果 `student1` 等于 `Bill` 且 `student2` 等于\
  \ `Sharon`（存储为 1），则该语句为假。\n\n如前提到的，枚举列表中的符号默认被分配整数值 0、1、2 等。如果这不合适，你可以指定要被分配的值，如下例所示。\n\
  \n```\nenum Department { factory = 1, sales = 2, warehouse = 4 };\n```\n\n记住，如果你确实为枚举符号分配了值，它们必须是整数。下面的值赋值将产生错误。\n\
  \n```\n enum Department { factory = 1.0, sales = 2.0, warehouse = 4.0 };\n     \
  \                                                     // 错误！\n```\n\n虽然没有要求分配的整数值必须升序排列，但通常认为这样做是一个好主意。\n\
  \n如果你省略了一个或多个符号的值赋值，它们将被分配默认值，如下面的两个示例所示。\n\n```\n enum Colors { red, orange, yellow\
  \ = 9, green, blue };\n```\n\n在这个示例中，命名常量 `red` 将被赋值为 0，`orange` 将为 1，`yellow` 将为\
  \ 9，`green` 将为 10，`blue` 将为 11。\n\n```\n enum Rooms { livingroom = 1, den, bedroom,\
  \ kitchen };\n```\n\n在这个示例中，`livingroom` 将被赋值为 1，`den` 将为 2，`bedroom` 将为 3，`kitchen`\
  \ 将为 4。\n\n枚举数据类型的用途之一是符号名称有助于使程序自文档化。然而，由于这些名称不是字符串，它们仅供程序内部使用。使用本节开头定义的 `Roster`\
  \ 数据类型，接下来的两个语句将输出 `2`，而不是名称 `Sharon`。\n\n```\n Roster topStudent = Sharon;\ncout\
  \ << topStudent;\n```\n\n由于枚举数据类型的符号名称与整数值相关，它们可以在 `switch` 语句中使用，如 程序 4-28 所示。该程序还证明了可以在不实际创建任何该类型变量的情况下使用枚举数据类型。\n\
  \n你将在后面的章节中学习更多关于处理枚举数据类型的知识。\n\n## 检查点\n\n1. 4.42 找出以下声明中所有的错误之处。\n\n   ```\n \
  \    Enum Pet = { \"dog\", \"cat\", \"bird\", \"fish\" }\n   ```\n\n2. 4.43 按照指令完成以下程序段。\n\
  \n   ```\n     enum Paint { red, blue, yellow, green, orange, purple };\n   Paint\
  \ color = green;\n\n   // 写一个 if/else 语句，如果 color 是红色、蓝色或黄色，\n   // 则打印 \"primary\
  \ color\"，否则打印\n   // \"mixed color\"。该 if 测试应该使用关系\n   // 表达式。\n   ```\n\n# 4.14\
  \ 专注于测试与调试：验证输出结果\n\n### 概念\n\n在测试新创建或修改的程序时，必须对它产生的输出进行仔细检查，以确保其正确性。\n\n一旦正在开发的程序经过了设计、用编程语言编写并发现可以编译和链接，就很容易得出它可以工作的结论。如果程序在运行时没有中止并产生了“合理”的输出，这种结论尤为常见。然而，仅仅因为程序运行并产生了输出并不意味着它是正确的。它可能包含逻辑错误。为了确定一个程序是否真正有效，必须使用可以预测输出的数据进行测试，并检查输出以确保准确。程序\
  \ 4-29 运行并产生了最初看起来合理的输出。然而，它包含一个导致产生错误的错误。从初看，该程序可能运行正常。每个人的收费费用是 8.25 美，所以如果有 100\
  \ 名成年客人，价格将是 825 美。但实际上只有 69 名客人，其中 4 人是儿童，使得成本大约是后者的三分之。571.20 听起来“大致正确”。\n\n然而，“大致正确”并不是准确性的足够测试。如果使用可以进一步检查输出的数据运行程序，程序员将很快发现错误。以下是同一程序使用更多选定示例数据两次运行的输出。\n\
  \n# 粗体不同示例输入的程序输出\n\n```\n 此程序计算自助餐的总费用。\n输入成年客人人数（12 岁及以上）：1[回]\n输入儿童人数（2-11 岁）：0[回]\n\
  \n自助餐总费用为 $8.00\n```\n\n# 粗体仍不同示例输入的程序输出\n\n```\n 此程序计算自助餐的总费用。\n输入成年客人人数（12 岁及以上）：0[回]\n\
  输入儿童人数（2-11 岁）：1[回]\n\n自助餐总费用为 $4.80\n```\n\n从这些输出中我们可以看到，儿童餐的费用被正确地计算为成年餐费用的 60%，但成年餐费用是错误的。对于一名成年人，得出的是\
  \ 8.00 美，而本应该是 8.25 美。\n\n\n\n\n为了找到问题，程序员应该确定哪些代码行最可能导致问题的产生。最可能的问题出现在第 10 行 `ADULT_MEAL_COST`\
  \ 的初始化或存储中，或者出现在第 14、16、27 和 29 行 `adultMealTotal` 或 `totalMealCost` 的计算或存储中，又或者出现在第\
  \ 33 行 `totalMealCost` 的打印中。由于单份成人午餐的费用错误地显示为整数值，尽管它被格式化为浮点数显示，但需要检查的内容之一是是否所有需要存储浮点值的变量都已定义为\
  \ `float` 或 `double` 类型。果其然，虽然 `adultMealTotal` 和 `totalMealCost` 都被定义为 `double`，但命名常量\
  \ `ADULT_MEAL_COST` 被定义为 `int`。因此，在初始化时赋值的 8.25 在存储时被截断为 8。当将该命名常量的定义重写为\n\n```\n\
  const double ADULT_MEAL_COST = 8.25;\n```\n\n并重新运行程序时，我们得到了以下结果。\n\n### 修正后程序的输出（示例输入用加粗显示）\n\
  \n```\n此程序计算自助午餐的费用费用。\n输入成人客人人数（12 岁及以上）：1[回车]\n输入儿童客人人数（2–11 岁）：0[回车]\n\n自助午餐总费用为\
  \ $8.25\n```\n\n现在该错误已经找到并修复，程序是正确的。然而，应该使用经过精心设计的测试用例进行额外测试，以确认这一结论。关于如何开发良好的测试用例的主题将在下一章进一步讨论。\n\
  \n# 4.15 Green Fields 景观案例研究——部分 2\n\n## 问题描述\n\nGreen Fields 景观公司提供的服务之一是销售常绿树，其价格根据高度确定。客户可以选择“自付自提”的方式购买树、购买树并送货，或者购买树并同时提供送货和种植服务。表\
  \ 4-13` |\n| 3 到 5 英尺 | `69.00 (含税)` |\n| 6 到 8 英尺 | `99.00 (含税)` |\n| 高于 8 英尺 |\
  \ `199.00 (含税)` |\n| 仅送货（每棵） | `20.00 (每订单最高 100.00)` |\n| 送货 + 种植 | `树价的 50%` |\n\
  \n## 程序设计\n\n## 程序步骤\n\n程序必须执行以下通用步骤：\n\n1. 让用户输入购买树的数量和高度。\n2. 让用户指示树是否由 Green\
  \ Fields 种植。\n3. 如果不需要种植服务，让用户指示是否需要送货。\n4. 计算树的总成本。\n5. 计算种植和送货费用。\n6. 计算所有费用的总和。\n\
  7. 打印显示购买信息和所有费用的账单。\n\n### 命名常量\n\n```\ndouble PRICE_1 =  39.00\ndouble PRICE_2\
  \ =  69.00\ndouble PRICE_3 =  99.00\ndouble PRICE_4 = 199.00\ndouble PER_TREE_DELIVERY\
  \ = 20.00\ndouble MAX_DELIVERY = 100.00\n```\n\n### 将输入值的变量\n\n```\nint  numTrees\
  \         // 购买的常绿树数量\nint  height           // 接近英尺的树的高度\nchar planted        \
  \  // 是否种植？('Y'/'N')\nchar delivered        // 是否送货？('Y'/'N')\n```\n\n### 将输出值的变量\n\
  \n```\ndouble treeCost             // 每棵树的成本\ndouble totalTreeCost        // 所有树的总价\n\
  double deliveryCost         // 所有树的送货费用\ndouble plantingCost         // 所有树的种植费用\n\
  double totalCharges         // 发票总金额\n```\n\n## 详细伪代码（包括实际变量名和所需的计算）\n\n```\n初始化\
  \ deliveryCost 和 plantingCost 为 0 \n显示屏幕标题\n输入 numTrees, height, planted\nIf planted\
  \ = 'N'\n    Input delivery\nEnd If\nIf height < 3\n    treeCost = PRICE_1\nElse\
  \ If height <= 5\n    treeCost = PRICE_2\nElse If height <= 8\n    treeCost = PRICE_3\
  \ \nElse\n    treeCost = PRICE_4\nEnd If\ntotalTreeCost = numTrees * treeCost\n\
  If planted = 'Y'\n    plantingCost = totalTreeCost / 2\nElse If delivered = 'Y'\n\
  \    If numTrees <= 5\n      deliveryCost = PER_TREE_DELIVERY * numTrees\n    Else\n\
  \      deliveryCost = MAX_DELIVERY\n    End If\ntotalCharges = totalTreeCost + deliveryCost\
  \ + plantingCost\n显示发票标题\n显示 numTrees, treeCost, totalTreeCost, deliveryCost, plantingCost,\
  \ totalCharges\n```\n\n## 程序\n\n在检查伪代码逻辑后，下一步是将伪代码扩展为最终程序。这在程序 4-30 中。\n\n## Crazy\
  \ Al's 商店案例研究\n\n额外的案例研究包含了第 4 章介绍的内容，可以在配套网站上找到。Crazy Al's 家电脑零售商，其员工按佣金制。佣金率取决于销售额。该案例研究开发一个程序计算每月佣金，然后减去预付款以计算月末剩余工资。该案例研究采用分支逻辑来确定正确的佣金率，包含了问题定义、通用和详细伪代码以及带有示例输出的最终程序。\n\
  \n## 复习题\n\n## 填充与简答\n\n1. 使用大于、小于、大于等于、小于等于、等于或不等于运算符的表达式称为关系表达式。\n2. 关系表达式的值在假时为\
  \ 0，在真时为 1。\n3. `if` 语句将值为 0 的表达式视为，非视为。\n4. 为了让 `if` 语句条件地执行一组语句，这些语句必须放在。\n5.\
