  \n这里的 `CheckPoint` 类是 `private`、`public` 还是 `protected` 基类？\n\n## 11.13 构造函数、析构函数与继承\n\
  \n### 概念\n\n当派生类对象被实例化时，基类构造会在派生类构造函数之前被调用。当对象被销毁时，派生类析构会在基类析构函数之前被调用。\n\n记住，每当创建类的对象时，编译器都会自动调用构造函数。由于每个派生类对象都可以被视为内部嵌入了一个基类对象，因此派生类对象的创建涉及嵌入的基类对象的创建。编译器总会在调用派生类构造函数之前调用基类构造函数。在销毁派生类对象时，这个顺序会反过来：派生类的析构会在基类的析构函数之前调用。这种顺序允许派生类的构造函数和析构函数在执行工作时使用基类的数据或成员函数。\n\
  \n`程序 11-21` 用一个简单的程序说明了这种行为。\n\n## 注意事项\n\n为基类和派生类的析构函数标记关键字 `virtual` 是一种良好的编程习惯。我们将在\
  \ `第 15 章` 中学习虚成员函数的概念。\n\n## 向基类构造函数传递参数\n\n如前所述，编译器会在执行派生类构造函数之前自动调用基类构造函数。编译器的默认操作是调用基类中的默认构造函数。然而，某些类可能没有默认构造函数。此外，程序员可能希望在创建派生类对象时，指定调用几个基类构造函数中的哪一个。\n\
  \n在这些情况下，程序员必须显式地指定编译器应该调用哪个基类构造函数。这是通过在派生类构造函数的定义中为选定的基类构造函数指定参数来实现的。\n\n向基类构造函数传递参数的语法非常简单：派生类构造函数的头部后面跟着一个冒号、指示要调用哪个基类构造函数的标识以及要传递的参数。为了说明，我们将修改\
  \ `Faculty` 类的构造函数，使其调用 `Person` 类中的构造函数。\n\n之前的构造形式为：\n\n```cpp\n Faculty(const\
  \ string& fname, Discipline d)\n{\n   name = fname;\n   department = d;\n}\n```\n\
  \n它现在变为：\n\n```cpp\n Faculty(const string& fname, Discipline d) : Person(fname)\n\
  {\n   department = d;\n}\n```\n\n注意，传递给派生类构造函数的参数之一被传递给了基类构造函数。通常情况下，传递给基类构造函数的参数可以是任何表达式，并可能涉及调用派生类构造函数点时作用域内的任何变量。例如，一个字符串字面量，甚至是一个全局字符串变量，都可以作为\
  \ `Person` 构造函数的参数传递。例如，如果希望教职员的名字默认设为无处不在的“Dr. Staff”，那么下面的构造函数正是我们所需要的：\n\n```cpp\n\
  \ Faculty(Discipline d) : Person(\"Staff\")\n{\n   department = d;\n}\n```\n\n通常，基类构造函数可以接受任意数量的参数。\n\
