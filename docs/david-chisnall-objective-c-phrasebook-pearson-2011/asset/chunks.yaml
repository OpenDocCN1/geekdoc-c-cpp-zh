    \ are defined externally, so the knowledge of the character encoding is extrinsic\
    \ to the string. This is the opposite of how an Objective-C string works.\n\n\
    When you converted a C string to or from an Objective-C string, it had to know\
    \ what the encoding of the C string was. The C standard library functions check\
    \ an environment variable to find out what this should be. Unfortunately, this\
    \ causes all sorts of problems. If you read some data from a socket or a file\
    \ and then construct an Objective-C string from it with these functions, you get\
    \ whatever text encoding your user picked, not the encoding selected by the person\
    \ who created the file.\n\nThese methods are all now deprecated, and in their\
    \ place are methods that take an explicit encoding parameter. One thing to remember\
    \ is that the default for any multibyte encoding is big-endian, which made sense\
    \ on the Motorola 68000 series and RISC workstations where Objective-C gained\
    \ popularity, but is less sensible on little-endian x86 processors.\n\nThe most\
    \ common text encoding in countries that use some variant of the Latin alphabet\
    \ is `UTF-8`. This lets you represent any of the ASCII characters in a single\
    \ byte and most other common characters in two. `NSString` has convenience methods\
    \ for getting and setting UTF-8 encoded data: `-UTF8String` and `+stringWithUTF8String:`.\
    \ In most code, you can use these whenever you are converting to or from C strings.\n\
    \nTo create a string object from a C string in some other encoding, you use the\
    \ `+stringWithCString:encoding:` method. If you are using ideographic characters,\
    \ `UTF-8` is quite inefficient.\n\nThe first argument to this is the C string,\
    \ and the second is a member of an enumerated type representing the encoding.\
    \ If the data is coming from an older Mac, you may want to use `NSMacOSRomanStringEncoding`,\
    \ which was the default encoding before Mac OS got Unicode support. If you need\
    \ to interoperate with old Windows systems, `NSWindowsCP1252StringEncoding` is\
    \ the encoding that you will need in most of the world. Newer Windows systems\
    \ will use `UTF16`, but they prefer the little-endian version, `NSUTF16LittleEndianStringEncoding`.\n\
    \nIf you are storing string data in a particular encoding, you will often use\
    \ instances of `NSData`, rather than pointers. This is a very simple class, which\
    \ encapsulates a region of memory: a pointer and a size. Because it is an object,\
    \ you can introspect it, use reference counting to handle destruction, and store\
    \ it in collections. This makes it more convenient, in a number of cases, than\
