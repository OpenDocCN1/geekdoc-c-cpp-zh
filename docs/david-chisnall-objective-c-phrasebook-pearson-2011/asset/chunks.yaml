    but it is used by the semantic analysis phase of the compiler. This


    **Declaring Objective-C Types** 21


    can help catch some errors at compile time.


    For example, if you try adding an object to an NSArray instance, the compiler
    will warn you that the object does not respond to the relevant message. This lets
    you check whether you really meant NSMutableArray, or if you need to make a mutable
    copy of the array.


    **Note:**


    In C++, it is common to use the **const** keyword to describe objects as immutable.
    In Objective-C, **const** is effectively useless. It specifies that the instance
    variables of an object may not be modified directly, but this is rarely done.
    It does not alter the messages that can be sent to an object, so an object that
    is declared as **const** remains mutable.


    Most of the time when the distinction between mutable and immutable instances
    is required, Objective-C programmers use the *mutable subclass* *pattern*, where
    an immutable class has a mutable subclass. You can cast the mutable version to
    the immutable version implicitly, but you cannot make an immutable instance mutable.


    The **Class** type is similar to **id**, but it may refer to classes. In Objective-C,
    a class is an object, so you can always use **id** instead of **Class**, just
    as you can use **id** instead of a specific object type.


    Two other types are defined in the standard Objective-C headers.1 The **SEL**
    type is used 1If you are compiling with Clang, most of these types


    22


    CHAPTER 2: **An Objective-C Primer**


    for selectors, which we’ll look at later in this chapter.


    The last one is IMP, which stands for *Instance* *Method Pointer*. This type refers
    to a pointer to an Objective-C method. Most of the time, you won’t need to use
    this type at all. It is only used for some of the very dynamic features of Objective-C,
    and for optimization. We’ll look at some places where you might use it in Chapter
    19.


    **Sending Messages**


    9


    [anObject autorelease];


    10


    [anObject addObject: anotherObject]; 11


    [anObject setObject: anotherObject


    12


    forKey: aThirdObject];


    *From: exampleMessages.m*


    The most important addition to C that Objective-C makes is sending messages. A
    message, as I said in the last chapter, is a high-level flow control construct.'
