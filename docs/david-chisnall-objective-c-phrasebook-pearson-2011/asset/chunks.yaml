  trans: "\n\n类型具有不同的尺寸。`ILP32` 意味着 `int`、`long` 和指针都是 32 位。`LP64` 意味着 `long` 和指针是\
    \ 64 位数值，并且隐式地，其他值较小。\n\n相比之下，Microsoft Windows 在 64 位架构上是一个 `LLP64` 平台；`int`\
    \ 和 `long` 保持为 32 位，只有指针和 `long long` 是 64 位。如果你假设可以安全地将指针强制转换为 `long`，就会导致一个问题——这种操作在包括\
    \ Win32 在内的世界范围内几乎每个平台上都是可行的，但在 Win64 平台上却行上行不通。\n\n将指针转换为整数是一个严重的问题。`long long`\
    \ 类型至少是 64 位，因此在任何当前平台上，它都保证足够大以存储任何指针；但在任何 32 位或 16 位的平台上，它可能太大了。\n\n# 在集合中存储数字\n\
    \nC99 引入了 `intptr_t` 类型定义，它的恰好等于指针的大小。Apple 引入了等效类型：`NSInteger`。它在整个 Cocoa 框架中被使用，且始终与指针一样。还有一个无符号版本，`NSNumber`。\n\
    \n在 GUI 代码中，你经常会遇到 `CGFloat` 或 `NSFloat`。它们之间是等价的。它们的大小都是指针，使得它们在 32 位平台上是 `float`，在\
    \ 64 位平台上是 `double`。\n\n```\nNSMutableArray *array = [NSMutableArray array];\n\
    [array addObject: [NSNumber numberWithInt: 12]];\n```\n*来自: numberInArray.m*\n\
    \n所有的标准 Objective-C 集合类都允许你存储对象，但你通常也想在它们中存储原始类型。解决此问题的方案是*装箱（boxing）*——将原始类型封装在一个对象中。\n\
    \n`NSValue` 类层次用于此类。`NSValue` 是一个用于封装单个原始值的类。该类非常通用，是*类簇（class cluster）*的一个示例。当你创建一个\
    \ `NSValue` 实例时，你将得到某个专门用于存储不同数据的子类。如果你在 `NSValue` 中存储一个指针，你不希望该实例占用的空间像包含 `NSRect`（一个包含四个\
    \ `NSFloat` 的 C 结构）那样大。\n\n`NSValue` 的一个具体子类 特别重要：`NSNumber`。该类旨在封装单个数值，并可以从任何\
    \ C 标准整数类型初始化。\n\n这两个类的类的指定的构造函数都是 `+valueWithBytes:objCType`。第一个参数是指向某些值的指针，第二个参数是该类型的*Objective-C\
    \ 类型编码（Objective-C type encoding）*。类型编码是表示特定类型的字符串。它们在 Objective-C 的内省中被大量使用；你可以获取类中任何方法或实例变量的类型（作为类型编码字符串），然后对其进行解析以获取相关的编译时类型。\n\
    \n你可以使用 `@encode()` 指令获取任何类型的类型编码。这类似于 C 语言中的 `sizeof()`，但它返回的不是整数形式的大小，而是将类型编码作为\
    \ C 字符串返回。在处理类型编码时，一个非常方便的技巧是使用 GCC 扩展 `typeof()`。它返回表达式的类型。你可以将它与 `@encode()`\
    \ 结合，如下：\n\n```\nNSValue *value = [NSValue valueWithBytes: &aPrimitive objCType:\
    \ @encode(typeof(aPrimitive))];\n```\n这段代码片段将返回一个封装了 `aPrimitive` 的 `NSValue`，无论原始类型的类型如何都能工作。你可以将其封装在宏中，但如果这样做，请注意不要传递带有副作用的表达式。\n\
    \n注意，你必须传递一个指向原始值的指针。此方法将使用类型编码来确定原始类型有多大，然后进行拷贝。\n\n更多时候，你将使用其他构造函数之一。例如，如果你想从一个整数创建一个\
    \ `NSNumber` 实例，你可以这样做：\n\n```\nNSNumber *twelve = [NSNumber numberWithInt: 12];\n\
    ```\n\n生成的对象随后可以添加到集合中。与 `NSValue` 不同，`NSNumber` 实例是有序的，因此你可以对包含 `NSNumber` 实例的集合进行排序。\n\
    \n```\nNSArray *a = [NSArray arrayWithObjects:\n    [NSNumber numberWithUnsignedLongLong:\
    \ ULLONG_MAX],\n    [NSNumber numberWithInt: -2],\n    [NSNumber numberWithFloat:\
    \ 300.057],\n    [NSNumber numberWithInt: 1],\n    [NSNumber numberWithDouble:\
    \ 200.0123],\n    [NSNumber numberWithLongLong: LLONG_MIN],\n    nil];\n\nNSArray\
    \ *sorted = [a sortedArrayUsingSelector: @selector(compare:)];\nNSLog(@\"%@\"\
    \ , sorted);\n```\n*来自: numberArray.m*\n\n`numberArray.m` 示例将一组 `NSNumber` 实例存储在数组中，然后使用\
    \ `-compare:` 选择器对其进行排序。正如你从输出所示，无论数字是如何创建的，排序都是强制性的。\n\n```\n2010-03-15 14:50:48.166\
    \ a.out[51465:903] (\n\"-9223372036854775808\",\n\"-2\",\n\"1\",\n\"200.0123\"\
    ,\n\"300.057\",\n\"12\",\n\"42\"\n)\n```\n*来自 numberArray 的输出\n\n# 执行小数运算\n\n\
    C 语言提供了两种处理数字的方法：整数和浮点值。浮点值由两个部分组成：尾数和指数。它们的值是 2 的幂乘以尾数。\n\n浮点值的问题在于它们是二进制的。这意味着它们的精度是用二进制位定义的，这并不总是你想要的。例如对于金融应用程序，你可能需要精确到四位小数。这使用浮点值是不可能的；像\
    \ 0.1 这样的值无法用任何有限二进制表示。二进制数是 2 的幂之和，而小数数是 10 的幂之和。对于分数值，小数点后的数字表示一半、四分之一、八分之一等。如果你尝试通过加\
    \ 2 的幂来创建 0.1，你永远无法成功，尽管你越来越接近。当你尝试通过加 10 的幂来创建三分之一时，也是如此（三分之一再加上百分之一，再加上千分之一）。\n\
    \n一种解决方案是使用定点运算。\n\n与其存储美元，你可能会存储分。你必须记住对你的值进行归一化，并且受整数范围的限制。Objective-C 提供了另一种选择：小数浮点类型。\n\
    \n`NSDecimal` 类型是一个表示小数值的 C 结构。奇怪的是，没有创建这些结构的 C API。你必须创建一个 `NSDecimalNumber`\
    \ 实例然后向它发送 `-decimalValue` 消息。\n\n你会有两种运算选择。\n\n`NSDecimalNumber` 实例是不可变的。你可以根据运算创建新的实例——例如，通过向\
    \ `one` 发送 `decimalNumberByAdding:` 消息。\n\n或者，你可以使用 C API，它直接修改结构的值。\n\n```\n\
    NSDecimalNumber *one = [NSDecimalNumber numberWithString:@\"1\"];\nNSDecimalNumber\
    \ *fortyTwo = [NSDecimalNumber numberWithString:@\"42\"];\nNSDecimal sum = [one\
    \ decimalValue];\nNSDecimal temp = [fortyTwo decimalValue];\nNSDecimalAdd(&sum,\
    \ &sum, &temp);\nNSDecimalNumber *result = [NSDecimalNumber numberWithDecimal:sum];\n\
    ```\n*来自: decimal.m*\n\n"
- fmt: "\nIf you are just performing one arithmetic operation and then storing the\
    \ result in an object, the first option is simpler. If you are doing a number\
    \ of steps then it is faster to use the `C` APIs. Because these modify the structure,\
    \ they do not require you to create a new object for each intermediate step.\n\
    \n**Note:**\n\nThe `C1X` specification includes decimal number types, and some\
    \ compilers support these as an extension. The `NSDecimal` type is not compatible\
    \ with these. On most platforms this is not important. If you are targeting something\
    \ like IBM’s `POWER6`, which has hardware for decimal arithmetic, then it is better\
    \ to use the decimal types directly.\n\nNeither of these is especially fast. The\
    \ decimal number is represented as an array of digits, and these are operated\
    \ on in pairs, after the two numbers have been normalized. You can expect to get\
    \ similar performance to a software floating-point implementation—possibly slightly\
    \ worse as `NSDecimal` is not widely used and therefore has not been the focus\
    \ of much optimization effort.\n\n`NSDecimalNumber` is a subclass of `NSNumber`,\
    \ so all of the ways of converting `NSNumber`s to strings that we’ll look at in\
    \ the next section work as expected. You can also convert them to `C` primitive\
    \ types using the standard methods for accessing these on number objects, but\
    \ these methods may truncate or approximate the decimal value.\n\n### Converting\
    \ Between Strings and Numbers\n\n```objectivec\nint answer = [@\"42\" intValue];\n\
    NSString *answerString =\n[NSString stringWithFormat: @\"%d\" , answer];\nNSNumber\
    \ *boxedAnswer =\n[NSNumber numberWithInt: answer];\nNSAssert([answerString isEqualToString:\n\
    [boxedAnswer stringValue]],\n@\"Both strings should be the same\" );\n```\n*From:\
    \ `strtonum.m`*\n\nThere are several ways of converting between a number and a\
    \ string. A lot of objects that represent simple data have methods like `-intValue`,\
    \ for returning an integer representation of the receiver.\n\n`NSString` has several\
    \ methods in this family.\n\nIf you have a string that contains a numerical value,\
    \ you can send it a `-doubleValue`, `-floatValue`, `-intValue`, or `-longLongValue`\
    \ message to convert it to any of these types. In 64-`bit` safe versions of `Foundation`,\
    \ you can also send it an `-integerValue` message. This will return an `NSInteger`.\n\
    \nThere are a few ways of going in the opposite direction, getting a string from\
    \ an integer. We look at one in Chapter 6: The `+stringWithFormat:` method on\
    \ `NSString` lets you construct a string from any primitive `C` types, just as\
    \ you would construct a `C` string with `sprintf()`.\n\nIf you already have a\
    \ number in an `NSNumber` instance, there are two ways of getting a string, one\
    \ of which is a wrapper around the other. The `-descriptionWithLocale:` method\
    \ returns a string generated by formatting the number according to the specified\
    \ locale. \n\nIn fact, this doesn’t do the translation itself. It sends an `-initWithFormat:locale:`\
    \ message to a new `NSString`. The format string depends on the type of the number:\
    \ for example, a double will be converted using the `@\"%0.16g\"` format string.\
    \ This uses up to 16 significant figures and an exponent if required.\n\nThe decimal\
    \ separator depends on the locale.\n\nIf you send an `NSNumber` a `-stringValue`\
    \ message, this is the equivalent to sending a `-descriptionWithLocale:` message\
    \ with `nil` as the argument. This uses the *canonical locale*, which means without\
    \ any localization, so the result will be the same on any platform.\n\n### Reading\
    \ Numbers from Strings\n\n```objectivec\nNSScanner *parser = [NSScanner scannerWithString:\
    \ @\"1 plus 2\"];\nint operands[2];\nNSString *operation;\n[parser setCharactersToBeSkipped:[NSCharacterSet\
    \ whitespaceCharacterSet]];\n[parser scanInt: operands];\n[parser scanCharactersFromSet:[NSCharacterSet\
    \ letterCharacterSet] intoString: &operation];\n[parser scanInt: operands+1];\n\
    ```\n*From: `scanner.m`*\n\nTwo of the first things any `C` programmer learns\
    \ to use are the `printf()` and `scanf()` functions. These are very, very similar—one\
    \ is almost an inverse of the other—and they let you construct formatted strings\
    \ and parse data from them. \n\nWe’ve already seen that `NSString` has a rough\
    \ analogue of `sprintf()`, so you can construct strings from format strings and\
    \ variables, but what is the Objective-C equivalent of `sscanf()`?\n\nHow, given\
    \ a string, do we parse values from it?\n\nThe answer lies in the `NSScanner`\
    \ class. This class is a very powerful tokenizer class. You create an instance\
    \ of `NSScanner` attached to a string and then scan values from it, one at a time.\
    \ \n\nThe messages you send to a scanner all have the same form. They take a pointer\
    \ to a variable and return a `BOOL`, indicating whether they succeeded. The scanner\
    \ stores the current scanning index in the string, and only increments it on a\
    \ successful scan, so you can try parsing the next characters in different ways.\
    \ You can also implement read-ahead and backtracking quite easily with `NSScanner`.\
    \ If you send it a `-scanLocation` message, it returns the current index in the\
    \ string. You can then try scanning a few things, get to an error, and backtrack\
    \ by sending it a `-setScanLocation:` message, resetting the old index.\n\nOne\
    \ of the most powerful methods in `NSScanner` is `-scanCharactersFromSet:intoString:`.\
    \ This reads a string from the current point until it encounters a character not\
    \ present in the specified set. As we will see in Chapter 6, you can construct\
    \ `NSCharacterSet` instances with any arbitrary set, or you can use one of the\
    \ standard ones.\n\nThe example at the start of this section reads a number, then\
    \ a word, then another number from a string. The number is read using the built-in\
    \ `-scanInt:` method, but the word is a bit more complex. It uses an `NSCharacterSet`,\
    \ in this case the set of all letters.\n\nThis isn’t the only `NSCharacterSet`\
    \ used in this example. This scanner is also configured to skip whitespace. The\
    \ `setCharactersToBepped:` message sent to the scanner tells it to ignore any\
    \ characters in the set passed as the argument. Passing the whitespace character\
    \ set tells it to skip any whitespace that occurs between calls.\n\nIf there are\
    \ characters in this set at the position where the scanner starts when you send\
    \ it a scan message, it will skip past them. It will not skip these characters\
    \ while parsing a token, so putting “1 2” in the string would be read as two separate\
    \ numbers, not as 12.\n\n### Creating Constant Strings\n\n```objectivec\nconst\
    \ char *cstring =\"C string\";\nNSString *objcstring = @ @\"Objective-C string\"\
    ;\nCFStringRef cfstring = CFSTR( *\"Core Foundation string\"* );\n```\n*From:\
    \ `constantStrings.m`*\n\nOn OS X, Objective-C strings are *toll-free* *bridged*\
    \ with *Core Foundation (CF)* strings.\n\nConstant CF strings are represented\
    \ in a similar way to GNU runtime Objective-C strings, but with a few differences.\
    \ Their isa pointer is set to an external reference present in the Core Foundation\
    \ framework, so they don’t require the Objective-C runtime or Foundation framework.\n"
