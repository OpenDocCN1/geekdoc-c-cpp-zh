- fmt: "\nOne of the runtime’s responsibilities is storing a table of all loaded classes.\
    \ You can enumerate this table, looking at every class in turn, or you can use\
    \ it to look up a class by name.\n\nThe latter is particularly useful for implementing\
    \ `weak class references`. These are supported directly by the Modern Apple runtime,\
    \ but the support is not yet exposed via the language, so it’s not particularly\
    \ useful. The idea behind a weak class reference is that you can optionally use\
    \ a class.\n\nYou might, for example, write some code in a framework that used\
    \ `Foundation` classes and could use `AppKit` classes if you linked against `AppKit`.\
    \ This framework would then work anywhere that had a `Foundation` implementation,\
    \ but would take advantage of `AppKit` features if they were available. You can\
    \ also use this mechanism to avoid a dependency on third-party frameworks.\n\n\
    ### Testing If an Object Understands a Method 313\n\n1\n```bash\n$ gcc -framework\
    \ Foundation -g -std=c99 weakClass.m && ./a.out\n```\n\n2\n```\na.out[53194:903]\
    \ Not linked against AppKit 3\n```\n\n3\n```bash\n$ gcc -framework Cocoa -g -std=c99\
    \ weakClass.m && ./a.out\n```\n\n4\n```\na.out[53184:903] View: <NSView: 0x1001163b0>\
    \ *Output from: weakClass.m*\n```\n\nNote the difference in outputs when this\
    \ example is linked against `Cocoa` (which links against `AppKit` and `Foundation`)\
    \ and just `Foundation`. If the `NSView` class is present, it creates an instance\
    \ of it. If it isn’t, then it just logs a message.\n\nYou can also use this in\
    \ code that must be backwards-compatible with old versions of a framework. If\
    \ you look up new classes using this mechanism then you get a `Nil` value that\
    \ you can handle when they are not present.\n\n### Testing If an Object Understands\
    \ a Method\n\n12\n```objc\nSEL sel = @selector(delegateMethod:);\nif ([delegate\
    \ respondsToSelector: sel])\n{\n    [delegate delegateMethod: self];\n}\n```\n\
    *From: respondsToSelector.m*\n\nObjective-C code tends to make use of `informal`\
    \ `protocols`. These are groups of messages that a delegate may, optionally, implement.\n\
    \nWhen you write code that uses them, you need to test whether the class actually\
    \ implements the method before sending it.\n\n**Note:**\n\nThis isn’t quite true.\
    \ You can just send the message in an `@try` block and catch the exception that’s\
    \ thrown if it doesn’t understand the method. Given the cost of throwing exceptions,\
    \ however, this is not a recommended approach.\n\nFortunately, this is very simple\
    \ to do. `NSObject` implements a `-respondsToSelector:` method that tests whether\
    \ the receiver can handle messages with a given selector.\n\nThis method is not\
    \ just implemented by `NSObject`, it’s also part of the `NSObject` protocol. Other\
    \ root classes will also implement it. This is very important for forwarding.\n\
    \nThis method, in `NSObject`, calls the `class_respondsToSelector()` runtime function.\
    \ In other classes, the implementation is different.\n\nIf you use the runtime\
    \ functions directly, then you will have quite fragile code. Most of the time,\
    \ you want to know whether the object that you are going to send the message to\
    \ can handle the message, not whether it has a method that handles the message.\
    \ These are the same in some languages, such as C++`, but in Objective-C they\
    \ are very different concepts.\n\n### Forwarding Messages 315\n\nWhen you send\
    \ a `-respondsToSelector:` message to a proxy, it will test whether the real object\
    \ has a method for that selector. The object wrapped by the proxy might be yet\
    \ another proxy, which will then forward the request.\n\nYou can also test for\
    \ protocol conformance by sending a `-conformsToProtocol:` message to a class.\
    \ Note that this only tests whether the class was declared as adopting the protocol.\
    \ Classes can adopt protocols without implementing all of their methods (although\
    \ they shouldn’t), but more commonly classes can implement all of the methods\
    \ in a protocol without explicitly conforming to the protocol.\n\n### Forwarding\
    \ Messages 3\n\n```objc\n@interface Facade : NSObject\n{\n    id delegate;\n}\n\
    @end\n\n@implementation Facade\n- (id)forwardingTargetForSelector:(SEL)aSel\n\
    {\n    return delegate;\n}\n- (void)forwardInvocation: (NSInvocation*)anInv\n\
    {\n    [anInv invokeWithTarget: delegate];\n}\n@end\n```\n*From: forward.m*\n\n\
    Messages in Objective-C are intended to be similar to Smalltalk messages, rather\
    \ than C functions. They are late-bound and can be introspected. At the lowest\
    \ level, they are implemented using C functions, but this is an implementation\
    \ detail. You can pretend that messages are objects that are passed between other\
    \ objects, introspected, and then handled by methods.\n\nWhen you send a message\
    \ to an object that does not correspond to a method on that object, there are\
    \ still some ways for the object to handle it. These have evolved a lot over the\
    \ life of Objective-C.\n\nIn old Objective-C code, the object’s `-forward::` method\
    \ was called. This was a variadic method and required the receiver to know the\
    \ structure of the stack frame. NeXT replaced this with `-forwardInvocation:`.\n\
    \nWith 10.5, Apple introduced a new, faster, forwarding mechanism. If your object\
    \ implements `-forwardingTargetForSelector:`, this will be called with the selector\
    \ for the missing method.\n\n**Note:** The two-stage message-sending mechanism\
    \ used by the GNU runtime does not support this mechanism, and neither do old\
    \ versions of the Apple runtime. If you use it, it is a good idea to provide fallback\
    \ code using `-forwardInvocation:`. If you are using a recent Apple runtime, or\
    \ the GNU runtime with the non-fragile ABI, you will get the benefit of extra\
    \ speed. If not, then your code will still work, it will just be slow.\n\nThe\
    \ `-forwardInvocation:` mechanism is very flexible, but it does not have good\
    \ performance. Creating the object and deconstructing the stack frame costs several\
    \ hundred times more than a normal send, meaning that you shouldn’t use this in\
    \ anything even performance-critical.\n\nThe `-methodSignatureForSelector:` method\
    \ returns an object that represents the structure of the call frame associated\
    \ with the message. The `NSInvocation` class will use this when creating an object\
    \ that encapsulates the message.\n\n### Finding Classes 9\n\n```objc\nint classCount\
    \ = objc_getClassList(NULL, 0);\nClass *classList = calloc(classCount, sizeof(Class));\n\
    objc_getClassList(classList, classCount);\nfor (int i=0 ; i<classCount ; i++)\n\
    {\n    [classes addObject:NSStringFromClass(classList[i])];\n}\nfree(classList);\n\
    [classes sortUsingSelector:@selector(compare:)];\n```\n*From: classTree.m*\n\n\
    There are two ways of finding an Objective-C class. If you know the name, then\
    \ you can just use the `NSClassFromString()` function. This takes a string object\
    \ as the argument and returns the class, or `Nil` if there is no registered class\
    \ with that name.\n\nIf you don’t know the name of the class, then you need to\
    \ do something different. There are a few cases when you might want to know a\
    \ class but do not already know its name. For example, if you have a plugin architecture,\
    \ you might allow the user to specify bundles to load and then want to collect\
    \ all of the subclasses of a particular class, or all of the classes that conform\
    \ to a given protocol.\n"
