    One of the most obvious is error reporting. When an assertion is encountered,
    it means that something has gone badly wrong with your program. You may want to
    collect some information about the conditions that cause this and upload it to
    a bug-tracking system, rather than just crash.


    You can disable asserts by defining the `NS_BLOCK_ASSERTS` macro. This is generally
    only worth doing in performance-critical code. It’s usually better to waste a
    little bit of CPU time than it is to continue in an undefined state.


