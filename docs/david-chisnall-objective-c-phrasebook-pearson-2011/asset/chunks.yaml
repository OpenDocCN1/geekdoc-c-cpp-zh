    # CHAPTER 15: Blocks and Grand Central


    When you run this program, you will see that calling one block affects the return
    value the next time that you call the other.


    1

    2 2, 4, 4


    *Output from: `blockCapture.m`*


    The next time that you call the `linkedCounters()` function, you will get a new
    pair of blocks, referring to a new counter variable. Note the difference between
    the `static` and `__block` storage qualifiers. Both have a similar effect, moving
    a variable off the stack, and allowing it to persist longer than the function,
    but they work very differently.


    When you declare a variable as `static`, every single reference to it will refer
    to the same piece of memory. When you declare a variable as `__block`, every reference
    to it from the same scope will refer to the same bit of memory, but you will get
    a new copy every time that you enter the scope in which it is declared.


    ## Managing Memory with Blocks


    ```c

    __block int counter;

    int(*block)(void*) = ^void(*) { return counter++; };

    block = [block retain];

    _Block_release(block);

    ```

    *From: `blockMemory.m`*


    Memory management in Cocoa traditionally uses reference counting. Blocks work
    in the same way. There are two functions controlling the reference count of a
    block. The `_Block_copy()` function increases its reference count, while the `_Block_release()`
    function decreases it.


    The first function is `_Block_retain()`, to make it explicit that the returned
    block may not be the block passed as an argument. In some situations, the block
    might be allocated on the stack, then copied onto the heap when it is copied.


    In Objective-C, you can also send blocks `-retain`, `-release`, and `-autorelease`
    messages, just as you can any other object. In fact, you can send blocks any messages
    that you want, but they only respond to a few. The compiler won’t give a warning
    if you send any messages to blocks, but you will get a run-time exception.


    Memory management of variables referenced by blocks can be more difficult to understand.
    The `blockRetain.m` example shows two blocks that both refer to objects. The first
    gets a copy of the object pointer, the second gets a shared reference because
    of the `__block` storage qualifier.


    When you retain the block that has a copy of the object pointer, the object is
    also implicitly retained, automatically. Note that this only happens once. When
    you retain the block a second time, it is not. When the block is destroyed, the
    object is released.


    ```objc

    id a = [@ *"a"* mutableCopy];

    __block id b = [@ *"b"* mutableCopy];

    unsigned long(*refCountA)() = ^() { return [a retainCount]; };

    unsigned long(*refCountB)() = ^() { return [b retainCount]; };

    printf("%ld %ld\n", refCountA(), refCountB());

    refCountA = _Block_copy(refCountA);

    refCountB = _Block_copy(refCountB);

    printf("%ld %ld\n", refCountA(), refCountB());

    [refCountA release]; [refCountB release];

    printf("%ld %ld\n", [a retainCount], [b retainCount]);

    ```

    *From: `blockRetain.m`*


    1 1 1

    2 2 1

    3 1 1152921504606846975

    *Output from: `blockRetain.m`*


    This is not the case for the second block. This block has been freed, so sending
    it a message has undefined behavior. In this particular run, it returned some
    data from a random memory location. It might alternatively crash.


    It is your responsibility to ensure that the object remains valid for as long
    as one or more of the blocks persists. This is very difficult to do correctly,
    because blocks, unlike objects, do not have a way of registering cleanup code.


    ## Performing Actions in the Background


    This is also a problem when a block refers to other pointers. Even if a pointer
    does not have the `__block` storage qualifier, the memory that it references is
    not copied. This means that you have to keep track of it just as you would any
    other memory in C, with the added complication that the block, containing a reference
    to it, may persist for a long time.


    ```c

    dispatch_queue_t q = dispatch_get_global_queue(0,0);

    __block int count;

    dispatch_async(q, ^(void){ count++; });

    sleep(1);

    NSCAssert(count == 1, @"Counter incremented in background");

    ```

    *From: `libdispatch.m`*


    If you are using Cocoa on OS X 10.6 or GNUstep on FreeBSD, then you have the option
    of using `libdispatch`, branded by Apple as Grand Central Dispatch, for concurrent
    processing. This library was written by Apple and released under the Apache 2
    license. If you use `libdispatch`, you don’t manage threads manually, you manage
    work queues.


    Work queues execute work units of code. There are two sorts of queue, concurrent
    and FIFO. A concurrent queue will start executing units in the order they were
    added, but they may complete in an arbitrary order, and any number of them might
    be running at once. A FIFO queue will wait for each unit to complete before starting
    the next.


    Context switching between threads is relatively expensive because it needs to
    save the current state and restore it, but there are also some non-obvious costs.
    Different threads are likely to be accessing different bits of data at the same
    time, so switching threads causes a lot of cache and TLB misses.


    The optimal number of threads to use is determined by the number of cores and
    the system load. If you have more cores, you can increase the degree of concurrency
    to take advantage of them without increasing the number of threads.


    ## Creating Custom Queues


    Grand Central does not depend on blocks, but it is much easier to use in conjunction
    with blocks. In the simplest case, you just push blocks into a work queue and
    have them executed in the background. That’s what the example at the start of
    this section does. It gets a handle to the default queue for the normal priority
    and pushes a block into it. The queue will then execute this in the background
    as soon as there is some CPU time.


    ```objc

    dispatch_queue_t q = dispatch_queue_create(@"Example",0);

    __block int count;

    dispatch_async(q, ^(void){ count++; });

    dispatch_async(q, ^(void){ count++; });

    dispatch_async(q, ^(void){ printf("%d\n", count); });

    ```

    *From: `libdispatchFIFO.m`*


    Grand Central comes with three concurrent queues, which are created by default.
    These are registered at three priority levels: low, default, and high. The number
    of things that will run concurrently on each of these depends on the load of the
    system and the number of CPU cores available. You can get a handle to one of these
    with the `dispatch_get_global_queue()` function.


    There is no point in creating a new concurrent queue. Blocks pushed into a concurrent
    queue will begin executing in the order that they were pushed, but they may complete
    in an arbitrary order, and any number of them might be running at once.


    There is also one special queue, which is intended to run on the main thread.

