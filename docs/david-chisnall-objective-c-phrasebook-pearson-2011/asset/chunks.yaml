    One very common use for delegation is the *façade pattern*. This wraps one or
    more private or semi-private objects in a public interface. This is very commonly
    used in Objective-C to provide something like multiple inheritance, where an object
    combines behavior from several distinct objects, delegating some of its functionality
    to each one.


    The NSControl hierarchy in AppKit is a good example of this. Classes in this hierarchy
    inherit behavior from NSView and delegate behavior to an NSCell subclass. NSView
    provides features


    92


    CHAPTER 4: **Common Objective-C Patterns** such as a graphics context, event handling,
    and interaction with the view hierarchy. The cell provides features such as drawing.
    The example at the top of this section is a (very) simplified version of NSControl.


    When you click on a button in OS X, you are usually clicking on an instance of
    NSButton, which is an NSControl subclass using an NSButtonCell for its implementation.
    As a programmer, you can use controls almost interchangeably and you can also
    reuse the cells that they contain. If you see a button in a table or outline view,
