    *From: trim.m*\n\nOften, when you have a string, you want to trim the ends, removing\
    \ either a fixed number of characters or characters from a particular set. A common\
    \ example of the second case is removing leading and trailing whitespace from\
    \ a string. Objective-C string objects support quite a few methods for doing this.\
    \ If you just want to remove leading or trailing characters from a string, the\
    \ `-substringWithRange:` method on `NSString` is the most useful. This will create\
    \ a string object that references the data in string. When you call it on a mutable\
    \ string, however, it must copy the characters.\n\nTo remove characters from a\
    \ particular set, you need to understand `NSCharacterSet`. As its name implies,\
    \ this class encapsulates a set of characters. You can create these from a string,\
    \ but there are also predefined ones that represent well-defined sets. This class\
    \ is used in a similar way to the `ctype.h` functions in C. You can send it `-characterIsMember:`\
    \ message to test whether a single character is a member of the set. Calling the\
    \ `ispunct()` C library function, for example, is equivalent to sending `-characterIsMember:`\
    \ message to the object obtained by sending `+punctuationCharacterSet` to `NSCharacterSet`.\
    \ The Objective-C version is more verbose, but is more generic. Character set\
    \ objects can be passed around your code easily.\n\n## Splitting Strings\n\n```objc\n\
