  trans: "\n选择器（Selectors）用于在消息传递中查找方法的名称。在 GNU Objective-C 中，选择器还包含了消息参数类型的编码。这使得函数可以检查调用它们时是否使用了正确的参数类型，这对于分布式对象以及其他少数情况非常有用。\n\
    \n当你访问方法或实例变量时，你将获得类型编码。这非常有用。在 `EtoileSerialize` 框架中，我使用这些信息来遍历实例变量的类型编码并自动对它们进行序列化。\n\
    \n# 第 2 章：Objective-C 入门\n\n## 使用闭包（Closures）\n\n```objc\nint(^getCounter)(void)(void)\n\
    {\n    __block int counter;\n    int(^block)(void) = ^(void) { return counter++;\
    \ };\n    return _Block_copy(block);\n}\n\nint main(void)\n{\n    int(^block)(void)\
    \ = getCounter();\n    block(); block();\n    NSCAssert(block() == 2, @\"Block\
    \ counted incorrectly\");\n    int(^block2)(void) = getCounter();\n    block2();\
    \ block2();\n    NSCAssert(block2() == 2, @\"Block didn’t start from 0\");\n \
    \   return 0;\n}\n```\n*来源：block.m*\n\n苹果在 10.6 中为 C 语言引入了 *blocks*。虽然这些是 C 语言的扩展，但它们通常与\
    \ Objective-C 配合使用。\n\nBlocks 是*闭包（closures）*。这个名字源于 Smalltalk，`BlockClosure`\
    \ 类封装了闭包。创建 blocks 的语法相当丑。它基于 C 语言的函数指针语法，但用插入符号 `^` 替换了星号。\n\nBlocks 的用法几乎和函数指针完全一样。你可以像调用函数一样调用它们，但不能将它们强制转换为函数指针，因为它们有不同的调用约定。\n\
    \n就像方法一样，block 有一个隐藏的参数。\n\n在示例中，`getCounter()` 函数返回一个实现计数器的新 block。\n\n每当你调用这个\
    \ block 时，它返回的值比上一次调用大一。这之所以有效，是因为在创建 block 的作用域内声明 `counter` 变量使用了 `__block`\
    \ 修饰符。\n\nblock 引用的栈上任何变量都会被复制到堆上并进行引用计数。\n\n当你调用 `_Block_copy()` 时，如果 block 在栈上，它本身会被复制到堆上；如果不在栈上，则其引用计数加一。\n\
    \n示例中 `getCounter()` 函数返回的每个 block 都有 `counter` 变量的拷贝，因为它是一个自动（栈）变量，因此后续对函数的调用都会创建一个新版本。\n\
    \n在 `Foundation` 框架的最新版本中，你会发现有很多接受 block 作为参数的方法。例如，你可以使用 block 作为参数来遍历数组。\n\n\
    Blocks 并没有给 C 语言增加任何表达能力。一个 block 只是隐藏在单个结构体中的函数指针和数据指针，编译器中还有一些额外逻辑用于在调用函数时将数据指针作为隐藏参数插入到函数中。\n\
    \n这并不意味着 blocks 是没用的。归根结底，Objective-C 也是如此；它并没有让你能做任何在 C 中无法做的事，它只是添加了一些语法糖，让某些事情变得更简单。\n\
    \n就像 Objective-C 对象一样，blocks 拥有 `isa` 指针并可以发送消息。它们是私有抽象类 `NSBlock` 的实例，该类实现了 `NSCopying`\
    \ 协议。\n\nblocks 大多数类似于对象的行为都没有文档记录。你可以将它们存储在 Objective-C 集合中，但不要依赖它们理解任何特定消息的能力。在最新版本的\
    \ `Clang` 中，blocks 还支持内省，将其类型暴露为 Objective-C 类型编码。\n\n我们将在第 15 章详细查看 blocks。\n\
    \n# 第 3 章：内存管理\n\n## 留存（Retaining）与释放（Releasing）\n\n```objc\nNSArray *anArray\
    \ = [NSArray array];\nanArray = [[NSArray alloc] init];\n[anArray release];\n\
    ```\n*来源：retainRelease.m*\n\n每个继承自 `NSObject` 的对象都有一个相关的引用计数。当这个引用计数达到 0 时，它会被销毁。使用\
    \ `+alloc` 或任何相关方法（如 `+new` 或 `+allocWithZone:`）创建的对象，其引用计数从 1 开始。\n\n为了控制对象的引用计数，你向它发送\
    \ `-retain` 和 `-release` 消息。正如它们的名称所示，当你想要保留对某个对象的引用或想要释放现有的引用时，应该使用这些消息。`-retain`\
    \ 消息增加对象的引用计数，而 `-release` 消息递减它。\n\n你也可以向对象发送 `-retainCount` 消息来确定其当前的引用计数。人们很想用它来优化，并在当你确定一个对象只有一个引用时调用某些特殊情况。这是一个非常糟糕的主意。正如名称所示，该方法告诉你是对该对象留存引用的数量，而不是引用的总数。在创建指向对象的指针时，不刻意向对象发送\
    \ `-retain` 消息是常见的。\n\n### 赋值给实例变量\n\n```objc\n- (void)setStringValue:(NSString*)aString\n\
    {\n    id tmp = [aString retain];\n    string = tmp;\n}\n```\n*来源：ivar.m*\n\n\
    以这种方式使用引用计数时，有几点需要注意。考虑以下简单的 setter 方法：\n\n```objc\n- (void)setStringValue:(NSString*)aString\n\
    {\n    [string release];\n    string = [aString retain];\n}\n```\n*来源：ivar.m*\n\
    \n这看起来很合理。你释放旧值，然后留存新值并赋值。大多数情况下这样做是有效的，但在少数情况下不会，而且这调试起来会很困惑。如果 `aString` 和 `string`\
    \ 的值相同会怎样？在这种情况下，你向同一个对象发送 `-release` 消息，然后是 `-retain` 消息。如果有其他代码持有该对象的引用，它仍然有效；但如果没有，第一条消息会导致对象被销毁，第二条消息将发送无效指针。\n\
    \n更正确的实现应该是先留存新对象，正如本节开头所示。注意你应该赋值 `-retain` 消息的结果，因为某些对象在你留存它们时会返回另一个对象。这种情况很少见，但偶尔会发生。\n\
    \n最后，这个方法不是线程安全的。如果你需要线程安全的 setter 方法，你需要先留存新值，对结果和实例变量执行原子交换操作，然后释放旧值。\n\n然而，通常情况下，对支持这种细粒度并发的代码进行推理是不可能的，而且它引发的缓存抖动会抵消并行带来的性能收益，因此这是一个极糟糕的主意。如果你真的需要它，使用声明属性来自动合成访问器比自己尝试写要好。\n\
    \n## 避免引用循环（Retain Cycles）\n\n```objc\n- (void)setDelegate:(id)aDelegate\n{\n\
    \    delegate = aDelegate;\n}\n```\n*来源：ivar.m*\n\n纯引用计数的问题是它无法检测循环。如果两个对象互相留存引用，那么它们都永远不会被释放。通常情况下，这不是一个主要问题。\n\
    \nObjective-C 数据结构往往是无环的，但在某些常见情况下循环不可避免的。最常见的是*代理模式（delegation pattern）*。在这种模式中，一个对象通常实现某些机制并将策略委托给另一个对象。大多数\
    \ AppKit 都是这样工作的。\n"
- fmt: "\nThe delegate needs a reference to the object, and the object needs a reference\
    \ to its delegate. This immediately creates a cycle. The common idiom that addresses\
    \ this problem is that objects do not retain their delegates. If you pass an object\
    \ as an argument to a `-setDelegate:` method, you need to make sure that some\
    \ other object holds a reference to it, or it will be deleted prematurely.\n\n\
    # CHAPTER 3: Memory Management\n\n## Autorelease Pools\n\n```c\nid returnObject(void)\n\
    {\n    return [[NSObject new] autorelease];\n}\n\nint main(void)\n{\n    NSAutoreleasePool\
    \ *pool = [NSAutoreleasePool new];\n    id object = returnObject();\n    [object\
    \ retain];\n    [pool drain];\n    // Object becomes invalid here.\n    [object\
    \ release];\n    return 0;\n}\n```\n*From: `autorelease.m`*\n\nAside from cycles,\
    \ the biggest problem with reference counting is that there are short periods\
    \ when no object really owns a particular reference. In C, deciding whether the\
    \ caller or callee is responsible for allocating memory is a problem.\n\nIn something\
    \ like the `sprintf()` function, the caller allocates the space. Unfortunately,\
    \ the caller doesn’t actually know how much space is needed, so the `snprintf()`\
    \ variant was added to let the callee know how much space is available.\n\nThis\
    \ can still cause problems, so the `asprintf()` version was added to let the callee\
    \ allocate the space.\n\nIf the callee is allocating the space, who is responsible\
    \ for freeing it? The caller, presumably, but because the caller didn’t create\
    \ it, anything that checks for balanced `malloc()` and `free()` calls will fail\
    \ to spot the leak.\n\nIn Objective-C, this problem is even more common. Lots\
    \ of methods may return temporary objects. If you’re returning a temporary object,\
    \ it needs to be freed, but if you’re returning a pointer to an instance variable,\
    \ it doesn’t. You could retain such a pointer first, but then you need to remember\
    \ to release every single object that is returned from a method. This quickly\
    \ gets tiresome.\n\nThe solution to this problem is the `autorelease pool`. When\
    \ you send an object an `-autorelease` message, it is added to the currently active\
    \ `NSAutoreleasePool` instance. When this instance is destroyed, every object\
    \ added to it is sent a `-release` message.\n\nThe `-autorelease` message is a\
    \ deferred `-release` message. You send it to an object when you no longer need\
    \ a reference to it but something else might.\n\nIf you are using `NSRunLoop`,\
    \ an autorelease pool will be created at the start of every run loop iteration\
    \ and destroyed at the end. This means that no temporary objects will be destroyed\
    \ until the end of the current iteration. If you are doing something that creates\
    \ a lot of temporary objects, you may wish to create a new autorelease pool, like\
    \ so:\n\n```objc\nid pool = [NSAutoreleasePool new];\n[anObject doSomethingThatCreatesLotsOfObjects];\n\
    [pool drain];\n```\n\nNote that you send an autorelease pool a `-drain` message\
    \ rather than a release message when you destroy it. That is because the Objective-C\
    \ runtime will ignore `-release` messages when you are in garbage collected mode.\
    \ The `-drain` message in this mode provides a hint to the collector, but does\
    \ not destroy the pool, when you are in garbage collected mode.\n\n## Using Autoreleased\
    \ Constructors\n\n```objc\n+(id)object\n{\n    return [[[self alloc] init] autorelease];\n\
    }\n```\n*From: `namedConstructor.m`*\n\nI said in the last section that objects\
    \ created with `+alloc` have a retain count of one. In fact, all objects are created\
    \ with a retain count of one, but objects created with a named constructor, such\
    \ as `+stringWithFormat:` or `+array`, are also autoreleased.\n\nIf you create\
    \ an object with one of these mechanisms, you must send it a `-retain` message\
    \ if you want to keep it. If you don’t, it will be collected later when the autorelease\
    \ pool is destroyed.\n\nThis is a convention that is important to observe in your\
    \ own classes. If someone creates an instance of one of your classes with a named\
    \ constructor, he will expect not to have to release it. A typical named constructor\
    \ would look something like the one at the start of this section.\n\nNote that,\
    \ because this is a class method, the `self` object will be the class. By sending\
    \ the `+alloc` message to `self` rather than to the class name, this method can\
    \ work with subclasses automatically.\n\n## Autoreleasing Objects in Accessors\n\
    \n```objc\n-(NSString*)stringValue\n{\n    return [[string retain] autorelease];\n\
    }\n```\n*From: `ivar.m`*\n\nAnother common issue with reference counting, as implemented\
    \ in Foundation, is that you commonly don’t retain objects that you only reference\
    \ on the stack. Imagine that you have some code like this:\n\n```objc\nNSString\
    \ *oldString = [anObject stringValue];\n[anObject setStringValue: newString];\n\
    ```\n\nIf the `-setStringValue:` method is implemented as I suggested earlier,\
