  trans: "\n\n当等待条件变量时，你首先获取互斥锁，然后原子地释放它并在条件变量上睡眠。当条件变量被信号时，你会被唤醒并原子地重新获取互斥锁。你可以将条件变量视为在线程之间传递互斥锁的一种。\n\
    \nOpenStep 规范包含一个封装了这种底层原的类：`NSConditionLock`。与 POSIX 版本不同（后者在每次调用时都需要与互斥锁关联），该类包含它自己的互斥锁并实现了\
    \ `NSLocking` 协议。\n\n这意味着你可以将条件锁当作锁来使用，尽管这样做会浪费资源。除了锁之外，条件锁还关联了一个整数变量，表示该条件。当你在条件锁上睡眠时，可以指定一个值。只有当条件锁被赋予该值信号时，你的线程才会被唤醒。\n\
    \n当你要等待的条件是一个整数值时，条件锁非常方便，但在其他情况下则不那么方便。通常，你希望线程在对象进入特定状态时被唤醒。使用低级 POSIX 函数实现这一点非常容易，因为它们要求你自己测试条件，但使用\
    \ `NSConditionLock` 则没那么容易。\n\n为了解决这个问题，Apple 引入了 `NSCondition` 类。它是 POSIX 互斥锁和条件变量的简单封装。你可以锁定它，在睡眠时释放锁，然后在另一个线程中对其它发送信号来唤醒它。\n\
    \n### 等待条件\n\n当从 `NSCondition` 睡眠并唤醒后，条件对象将处于锁定状态。你必须测试你的条件，然后要么解锁条件对象，要么返回睡眠。\n\
    \n在几乎所有使用条件变量的场景中，你都使用相同的模式。\n\n通常，它们允许你在线程之间建立生产者-消费者关系。消费者线程需要睡眠，直到有数据等待它。生产者线程在有数据可供其使用时需要唤醒消费者线程。\n\
    \n本节开头的示例展示了类中的两个方法。`-addToQueue` 方法预期从生产者线程调用，而 `-main` 方法实现了消费者线程。\n\n消费者线程的代码显示了线程对象的几个重要特征。它没有使用\
    \ `NSRunLoop`，而是实现了自己的运行循环（run loop），这是一个无限循环，并在每次迭代中显式地创建和销毁自动释放池（autorelease\
    \ pool）。在每次迭代中，它首先锁定条件，如果没有数据在等待，则释放锁并睡眠。\n\n生产者线程随后可以获取锁并信号条件。当这种情况发生时，消费者线程将在锁可用时立即准备唤醒。生产者通过释放锁允许了这一点。消费者线程随后获取下一段数据进行处理并释放锁。在这个示例中，增加和减少一个共享变量被用作向共享数据结构添加某些数据的代理。\n\
    \n**注意：** 从条件变量唤醒线程所需的操作序列开销相当大，因此如果可能，最好避免这样做。对于两个线程之间的通信，我通常倾向于使用无锁环形缓冲区（lockless\
    \ ring buffer），它在空闲一段时间后切换到锁定模式。\n\nApple 的 Grand Central Dispatch（中央调度调度）内部实现了这种模型，因此你可以直接使用，而无需自己编写环形缓冲区代码。\n\
    \n![Image 16](img/index-275_1.png)\n\n### 将变量绑定到 Block\n\n```c\nint (^add)(int,\
    \ int) =\n^(int a, int b)\n{\n    return a + b;\n};\n```\n*来自：blockScope.m*\n\n\
    你可以将函数视为 block 的一种特例。从概念上讲，函数是一个在全局作用域内声明的 block。它们的实现方式略有不同，但在这种情况下差异非常小。\n\n\
    因此，block 最简单的情况等同于函数。它接收一些参数，产生一些输出，并且不引用其自身作用域之外的任何内容。本节开头的片段显示了这种 block 的示例。该声明位于全局作用域，看起来像是非常冗余的函数声明形式。\n\
    \n下一类 block 引用其声明处函数作用域内的内容。你可以在 `blockScope.m` 的其余部分看到这种 block。这个 block 引用了两个变量。`counter`\
    \ 是静态变量，这意味着它存储在程序镜像映射的内存中，就像全局变量一样。block 中对它的引用工作将与对任何其他静态或全局变量的引用相同；只存在一个副本。\n\
    \n**注意：** 虽然暴露给程序员的 block 只有一种类型，但在实现中有两种。你可以通过检查 `isa` 指针来确定你拥有的是哪种 block，尽管公共\
    \ API 并不保证这一点，且可能会在不通知的情况下发生更改。\n\n如果你创建一个不引用其参数或全局变量之外的任何内容的 block，那么该 block\
    \ 是静态分配的，每当在概念上创建它时，你都会得到同一个对象的指针。如果你创建一个引用栈上内容的 block，那么 block 运行时会在每次创建它时在堆上创建它的新副本。\n\
    \n另一个变量 `c` 是局部变量。它在 `getCounter()` 函数中分配在栈上。当该函数返回时，该变量被销毁。block 仍然存在，但它引用的是该变量的副本。这意味着\
    \ block 内部的 `c` 始终包含它创建时的值。你可以从输出中看到它是如何工作的。\n\n```c\nint (*getCounter())(void)\
    \ {\n    static int counter;\n    int c = counter;\n    void (*block)(void) =\
    \ ^(void) {\n        printf(\"current: %d \", counter);\n        printf(\"old:\
    \ %d\\n\", c);\n    };\n    counter++;\n    return _Block_copy(block);\n}\n\n\
    int main(void) {\n    void (*block)(void) = getCounter();\n    block();\n    void\
    \ (*block2)(void) = getCounter();\n    block2(); block2();\n    block(); block2();\n\
    \    return 0;\n}\n```\n*blockScope.m 的输出：*\n```\ncurrent: 1 old: 0\ncurrent:\
    \ 1 old: 0\ncurrent: 2 old: 1\ncurrent: 2 old: 1\ncurrent: 2 old: 0\n```\n\n传统的闭包（closure）引用的是封装作用域中的真实变量，而不是副本。通过对变量使用\
    \ `__block` 修符可以获得这种行为。这种实现非常复杂。变量从栈移动到堆内存中的引用计数块中。这意味着对它的任何引用将引用同一个变量。`blockCapture.m`\
    \ 示例演示了这一点，该函数创建了两个关联的计数器。\n\n```c\ntypedef int (*counter_t)(void);\n\nvoid linkedCounters(counter_t\
    \ *a, counter_t *b) {\n    __block int c = 0;\n    *a = ^(void) { return c++;\
    \ };\n    *b = ^(void) { return ++c; };\n    *a = _Block_copy(*a);\n    *b = _Block_copy(*b);\n\
    \    c++;\n}\n\nint main(void) {\n    counter_t pre, post;\n    linkedCounters(&post,\
    \ &pre);\n    printf(\"%d %d, %d, %d\\n\", pre(), post(), pre(), post());\n  \
    \  return 0;\n}\n```\n*来自：blockCapture.m 的输出：*\n```\n1 1, 2, 2\n```\n\n这两个计数器都引用内存中的同一个变量：一个返回它后增加；另一个增加它后返回。\n\
    \n当\n\n"
