    19 **Objective-C Runtime**


    Objective-C 方法是通过间接层调用的 C 函数。具体实现方式在不同的运行时有所不同。在 NeXT 和 Apple 运行时，简单的消息发送通过 `objc_msgSend()`
    函数实现。不幸的是这不是你需要的唯一函数。在 Darwin/x86 上，对象指针返回在 `eax` 寄存器中。如果返回浮点，它返回在浮点寄存器中。如果返回结构体，在调用者中分配并作为隐藏参数传递。你必须调用
    `objc_msgSend_sret()` 或 `objc_msgSend_fpret()`。这相当混乱，意味着你需要了解调用约定。


    在 GNU 运行时，这要简单得多。没有 `objc_msgSend()` 函数。相反，你调用 `objc_msgSend()` 然后调用返回的函数指针，将其转换为正确的类型。在运行时之间可移植的最简单方法是在
