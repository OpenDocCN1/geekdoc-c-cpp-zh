    CHAPTER 11: **Key-Value Coding**


    This example uses one public class and a number of private subclasses that all
    support the property. You can use instances of all of these classes interchangeably,
    at least when it comes to storing that key. More importantly, you can use something
    like the KeyIVar or KeyFallback class for prototyping and then switch to something
    else later.


    The fallback method is especially useful when prototyping. When you start working,
    create a private dictionary instance variable and access all of the properties
    on the object via KVC.


    Once you’ve determined the properties your class really needs, you can replace
    the fallback implementation with a set of accessors and, as a separate step, replace
    the KVC calls with direct message sends.


    One thing that you might have noticed about this example is that KVC only deals
    with objects, but the instance variable is an **int**.


    Somehow, this still works. This is because KVC performs *auto-boxing*. We set
    this property by passing @ *"12"* as an argument to


    -setValue:forKey:. The KVC code sent an


    -intValue message to the string object, after finding that the property was an
    integer.


    In the other direction, it constructed an NSNumber encapsulating the primitive
    value. If the instance variable or accessor methods use object types, this code
    is bypassed. Note that KVC only accesses the runtime type information


    **Understanding Key Paths** 201


    and all object types are encoded as *"@"* in type encodings.


    This means you can use KVC to set an NSString instance as the value for an instance
    variable declared as an NSArray. KVC won’t generate any errors when you try this,
    and neither will the compiler. The receiver, however, will get an exception the
    next time it sends a message such as -objectAtIndex: to the string.


    If you are writing KVC accessors for object types, you might want to add an assert
    statement checks whether the object has a compatible class.


    **Understanding Key Paths**


    So far, we’ve looked at getting and setting values for an individual key. This
    is quite useful, but it doesn’t quite demonstrate the full flexibility of KVC.


    Most of what we’ve used KVC for could be done quite easily without KVC. If you
    want one object to access a particular property of another object, and don’t want
    to hard code it, you could just store a selector and use the normal Objective-C


    message-sending mechanism to call it.


    This works fine if the property is stored on that object, but what happens if
    you want an indirect property? You could store an array of selectors, and use
    each one to get the intermediate object, but that is cumbersome.


