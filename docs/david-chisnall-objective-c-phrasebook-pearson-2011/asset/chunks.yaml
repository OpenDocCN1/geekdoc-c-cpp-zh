    \ C 中的不透明数据类型也是如此。\n\nObjective-C 的一个稍微意外的方面是，实例变量（Java 和 C++ 称为“字段”）被声明为接口的一部分，而不是实现部分。这是由于\
    \ Objective-C 早期版本实现方式的一种产物。\n\n每个对象都被转换为一个 C 结构体，其第一个字段是指向该类的指针。为了生成这个结构体，编译器需要能够看到所有父类的所有实例变量。这种方法的一个遗憾的副作用是：修改类的布局意味着你必须重新编译它的所有子类。\n\
    \n现在，有了非脆弱性 ABI（non-fragile ABI），你可以从子类中隐藏私有实例变量。对它们的每次引用都通过一个间接层。偏移量现在是一个变量，而不是编译时常量。\n\
    \n默认情况下，Objective-C 实例变量受保护的，这意味着它们只能由该类或其子类访问。如果你为它们加上 `@private` 前缀，它们只对该类可用；如果加上\
    \ `@public`，它们可以在任何地方访问。这非常罕见。对访问权限的运行时检查很少，并且有一些机制可以绕过访问控制，因此通常将所有内容保持受保护，仅在私有类中将实例变量设公共。\n\
    \n**注意：**\nApple 的非脆弱性 ABI 限制了 ivar 偏移变量的可见性，如果你尝试从不同的编译单元访问私有实例变量，将产生硬错误。仍然可以通过使用运行时内省（runtime\
    \ introspection）访问私有实例变量，而这种保护在其他运行时环境中是不可用的。\n\n### 声明类\n\n类接口的基本结构包含三个部分。第一部分是新类在层次结构中位置的定义：\n\
    \n`@interface ClassName : Superclass <protocols>` 类名紧随 `@interface` 关键字之后。接着是一个冒号，然后是父类的名称。可以设计新的根类，但要正确地做到非常复杂，因此大多数时候你只需要使用\
    \ `NSObject` 或 `NSProxy` 作为你的父类。\n\n之后，你可能可选地在角括号中指定一个由逗号分隔的协议列表。Objective-C 中的协议类似于\
    \ Java 中的接口（interfaces）。它们定义了对象必须实现的方法列表。\n\n接下来是实例变量列表。它遵循与在 C 中定义结构体相同的语法。一个只包含实例变量没有方法的简单类定义看起来如下：\n\
    \n```objc\n@interface NoMethods : NSObject\n{\n    int integer;\n    NSObject\
    \ *object;\n    float floatingPoint;\n}\n@end\n```\n\n在 C 结构体定义中任何有效的在这里都是有效的。如果你使用\
    \ Objective-C++，你还可以添加指向 C++ 对象的指针以及具有简单构造函数（trivial constructor）的 C++ 对象。\n\n\
    最后，你列出类所实现的公共方法。与其为此凭空编造，让我们来看一些真实的方法声明：\n\n`+ (id)new;`\n`- (void)appendString:(NSString*)aString;`\
    \ 第一个方法声明前的加号表示这是一个附加到类上的方法。你可以向类发送一个 `+new` 消息，它将还给你一个对象指针。`id` 类型是 Objective-C\
    \ 引入的一种新类型，大致与 C 中的 `void*` 类型相似，但被限制为指向 Objective-C 对象。\n\n注意，返回类型和参数的类型与类型转换使用相同的语法。这突显了消息发送（message\
    \ sends）与 C 函数调用之间的另一个重要区别。该方法被编译为 C 函数，在调用它之前，指针会被转换为这些类型。\n\n类定义的实现部分要简单得多。它以\
    \ `@implementation` 指令开始，包含了类所有方法的定义，如下：\n\n```objc\n@implementation NewClass\n\
    + (int)classVersion\n{\n    return 2;\n}\n- (void)log\n{\n    fprintf(stderr,\
    \ \"log message received\");\n}\n@end\n```\n\n需要注意的一个重要点是，你不需要声明类所实现的所有方法。在类接口中未声明的方法被认为是私有的。调用它们将产生编译时警告，并且类的未来版本可能会完全停止对它们做出响应。\n\
    \n### 使用协议\n\n与类一样，Objective-C 中的协议也是对象。协议的行为是 Apple 在现代运行时（runtime）更改的内容之一。以前，协议通过名称识别，如果两个协议具有相同的名称，则它们被认为是等价的。这意味着，如果你在不同的库中声明了两个同名的协议，你无法判断对象实现了其中哪一个。更重要的是，你无法查找协议并查看它需要哪些方法。\n\
    \n在 Objective-C 2 中，协议现在是唯一的。你现在可以通过名称获取协议并检查它。这在旧模型中有时可行，但它取决于编译器是否已经输出了它的完整定义。你可以使用\
    \ `@protocol()` 关键字获取协议的引用。这样做的主要目的是测试协议的遵循情况。\n\n```objc\nif (![delegate conformsToProtocol:@protocol(DelegateProtocol)])\n\
    {\n    testIndividualMethods = NO;\n}\n```\n\n你可能在一个设置代理的方法中使用类似这样的代码段。如果代理符合该协议，则保证它实现了该协议中的所有方法，因此你不需要测试每一个。如果它符合，你可能需要在发送每条消息之前对其进行测试。\n\
    \n协议为你提供了编译时和运行时的类型检查。你可以通过在类型名称后加上角括号来要求对象符合某个协议。以下是一些示例：\n\n`id <NSCopying>\
    \ a;`\n`id <NSObject,NSCopying> b;`\n`NSObject<NSCopying> *c;`\n\n在这里，你可以将任何实现\
    \ `NSCopying` 协议的对象赋值给 `a`。赋值给 `b` 的对象还必须实现 `NSObject` 协议，任何继承自 `NSObject` 的对象都会自动实现它。最后，`c`\
    \ 必须是 `NSObject` 的子类并实现 `NSCopying` 协议。\n\n如果你将一个对象赋值给要求它符合某个未在其声明遵循列表中协议的变量，编译器将生成警告而不是错误。这不是一个硬错误，因为它可能实现了该协议所需的方法，尽管它没有声明遵循该协议。\n\
    \n### 为类添加方法\n\n```objc\n@interface NSObject (Logging)\n- (void)log;\n@end\n\n\
    @implementation NSObject (Logging)\n- (void)log\n{\n    NSLog(\"%@\", self);\n\
    }\n@end\n```\n\n*来自：logging.m*\n\nObjective-C 与 C++ 或 Java 等语言之间的最大区别之一是**分类**（categories）的概念。这些在\
    \ Smalltalk 中存在，但是作为为了文档将方法分组的一种。在 Objective-C 中，它们允许你为类添加方法，即使你没有源代码。\n\n"
- fmt: "\nCategory definitions are similar in structure to class definitions. A category\
    \ cannot change the instance variables of a class, nor its superclass, so these\
    \ parts of the `@interface` directive are omitted. A category name is added in\
    \ brackets after the class name. In the preceding code, you can see a simple category\
    \ interface and implementation that adds a `-log` method to `NSObject`. You can\
    \ then send a `-log` message to any object and have it dumped to the console.\n\
    \nNote that both the interface and implementation of the category are optional.\
    \ specifying a category interface without a corresponding implementation can be\
    \ useful. Specifying an implementation without an interface is useful if you want\
    \ to just replace methods in an object.\n\nMethods declared in a category will\
    \ replace methods of the same name declared in the class. This ordering is guaranteed,\
    \ so if there is a conflict, the category will always take precedence. If there\
    \ are two categories that define the same method, the one that is used is undefined.\n\
    \nOne of the less-documented features of categories is that they let you add protocol\
    \ conformance to a class. In the Foundation framework, the various collections\
    \ have no common superclass and do not implement a common protocol.\n\nIn the\
    \ EtoileFoundation framework, we add categories to them all, making them adopt\
    \ the `ETCollection` protocol. This lets us use this protocol in places where\
    \ we need some collection, but don’t care exactly which type.\n\nThe `collection.m`\
    \ example shows a (very) simplified version of this. The `Collection` protocol\
    \ is added to both `NSSet` and `NSArray` classes. If you send a `-conformsToProtocol:`\
    \ message to an instance of either of these classes, with `@protocol(Collection)`\
    \ as the argument, it will return `YES`.\n\nThere is a special case for categories,\
    \ where you declare a category interface with no name. This is referred to as\
    \ a *class extension*. Unlike other categories, which should be accompanied by\
    \ a separate `@implementation` directive specifying the category name, methods\
    \ declared in class extensions are expected to appear in the main `@implementation`\
    \ directive for the class. You can use this for forward-declaring private methods.\n\
    \nWith the most recent Objective-C compilers, you may also declare instance variables\
    \ inside class extensions. For this to work, you need to specify the `-fobjc-nonfragile-abi2`\
    \ flag when compiling.\n\n### Adding Methods to a Class\n\n```objc\n@protocol\
    \ Collection\n- (BOOL)isEmpty;\n@end\n\n@interface NSArray (Collection) <Collection>\n\
    @end\n\n@interface NSSet (Collection) <Collection>\n@end\n\n@implementation NSArray\
    \ (Collection)\n- (BOOL)isEmpty\n{\n    return [self count] == 0;\n}\n@end\n\n\
    @implementation NSSet (Collection)\n- (BOOL)isEmpty\n{\n    return [self count]\
    \ == 0;\n}\n@end\n```\n*From: collection.m*\n\n### Using Informal Protocols\n\n\
    ```objc\n@interface NSObject (InformalProtocol)\n- (id)doSomething;\n@end\n\n\
    // Objective-C 2 only:\n@protocol InformalProtocol\n@optional\n- (id)doSomething;\n\
    @end\n```\n*From: informalProtocol.m*\n\nQuite often, you want to define a set\
    \ of methods that you’d like a class to implement, but that are optional. This\
    \ is particularly common for delegates, where you will test whether the delegate\
    \ implements a given method before sending it a message.\n\nWith Objective-C 2,\
    \ protocols can contain methods that are declared as optional, but prior to that\
    \ it was common to implement informal protocols using categories. If you create\
    \ an interface for a category on `NSObject` but don’t provide an interface definition\
    \ for it, then the compiler will assume that every `NSObject` subclass responds\
    \ to the messages declared in the interface and therefore won’t generate a warning\
    \ when you send any of them to an object.\n\nOf course, not every object really\
    \ will implement these methods, so you need to make sure you use `-respondsToSelector:`\
    \ to test whether an object really does, before you send the message.\n\n### Synthesizing\
    \ Methods with Declared Properties\n\nOne of the big additions to Objective-C\
    \ 2 was declared properties. These let you define some aspects of the semantics\
    \ of an accessor and then synthesize the relevant methods if you don’t need any\
    \ special handling.\n\nProperties also introduce some new syntax. They are implemented\
    \ in terms of message sends. The example at the start of this chapter will create\
    \ both `-integer` and `-setInteger:` methods. You can call these just as you would\
    \ any other methods, but you can also use the dot notation, like this:\n\n```objc\n\
    obj.integer = 12;\nint i = obj.integer;\nobj.integer += 42;\n```\n\nThe last case\
    \ is the most useful. Expanding this to the traditional Objective-C message syntax\
    \ would look like so:\n\n```objc\n[obj setInteger: [obj integer] + 42];\n```\n\
    \n```objc\n@interface Integer : NSObject\n@property (nonatomic,assign) int integer;\n\
    @end\n\n@implementation Integer\n@synthesize integer;\n@end\n```\n*From: synth.m*\n\
    \nThe term “property” is used in Smalltalk to refer to any instance variable that\
    \ can be manipulated via accessors. It is used in slightly older Objective-C documentation\
    \ in the same way. Specifying declared properties, rather than just properties,\
    \ helps reduce this ambiguity.\n\nA property declaration contains two parts: an\
    \ interface and an implementation. The interface defines the name and type of\
    \ the property, as you’d expect, but it also defines some high-level semantics.\
    \ Properties are atomic by default. This incurs some overhead, so you probably\
    \ want to specify nonatomic in most properties that you create. Atomicity of accessor\
    \ methods does not make an object thread-safe, and you are almost always better\
    \ off using some higher-level locking for sharing objects between threads.\n\n\
    Consider the `nonatomic.m` example. This declares an atomic property. You then\
    \ use a single increment operation in the code. You’d expect this to be an atomic\
    \ increment, but it isn’t. This single statement expands to two message sends\
    \ with an increment in between them.\n\n```objc\n@interface NotReallyAtomic :\
    \ NSObject\n@property int a;\n@end\n\nint add(NotReallyAtomic *obj)\n{\n    obj.a\
    \ += 1;\n}\n```\n*From: nonatomic.m*\n\nAll that atomic means, in the context\
    \ of properties, is that both the set and get methods will try to acquire the\
    \ same lock, when not using garbage collection, so the object will not be accidentally\
    \ deallocated if you try setting it in one thread and getting it in the other\
    \ thread. In garbage collected mode, and for non-object properties, the `nonatomic`\
    \ has no meaning.\n\nProperties can be either readwrite or readonly, indicating\
    \ whether assigning to them is supported. If you define a readwrite property and\
    \ are not using garbage collection, you also need to define the setter’s semantics.\n\
    \nThere are three options for setter behavior: assign, retain, and copy. The first\
    \ of these is usually only used for delegates, where retaining them would create\
    \ a retain cycle. The latter two options are only valid for Objective-C objects.\
    \ For all primitive C types, assign is the only option.\n"
