    \ messages will be ignored. The compiler will automatically insert calls to functions\
    \ in the runtime for every assignment to the heap. Code must be compiled with\
    \ garbage collection support to use the garbage collector. This will insert calls\
    \ to a set of functions that, on the Mac runtime, are declared in `objc-auto.h`\
    \ on any assignment to the heap. These functions make sure that the garbage collector\
