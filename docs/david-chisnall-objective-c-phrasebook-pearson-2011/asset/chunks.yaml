    *From: copy.m*


    The Foundation framework includes a function called NSCopyObject(). You might
    logically expect that this will copy an object, and you’d be almost right. It
    creates a new object with the same class as the original and then uses something
    like memcpy() to copy the instance variables over.


    This works fine for objects that only have primitive C types as their instance
    variables, but not so well for others. Object pointers need to be sent a -retain
    message when they are copied.


    C pointers may need some other things done to them, particularly if they are opaque
    types returned from some other library.


    Without information about exactly what the relationship between objects is, the
    copy function cannot create a true copy automatically. Some


    **Copying Objects**


    79


    objects should not even support copying. What, for example, would you expect the
    semantics of copying an object that encapsulates a socket to be? Would you get
    two objects encapsulating the same socket?


    The only thing that really knows how to make a copy of an object is the object
    itself. If the object implements the NSCopying protocol, you can send it a -copyWithZone:
    message to get the copy. This takes an NSZone as the argument.


    Most code these days doesn’t bother with NSZone. NSObject provides a -copy method,
    which just calls -copyWithZone: with the default zone as the argument. Although
    you may always call -copy, you should implement


    -copyWithZone:.


    This method normally begins by sending an


    +allocWithZone: message to the receiver’s isa pointer, which creates a new instance.
    It may then call an initializer, or it might fill in the instance variables itself.


    **Note:**


    If you are inheriting from a superclass that implements the NSCopying protocol,
    you should send a -copyWithZone: message to **super** in your -copyWithZone: implementation
    and then only copy the instance variables your subclass added.


