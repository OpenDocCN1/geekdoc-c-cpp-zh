    The simplest way of determining whether a file exists is to try to access it and
    then check for errors. This isn’t particularly elegant, although it is often the
    safe way to work. If you want to provide some feedback to the user about whether
    an operation is expected to work, before trying it, you need an explicit test.


    The -fileExistsAtPath:isDirectory: method does exactly this. The method’s name
    is a bit misleading. It tests whether a file or directory exists at the specified
    path, and tells you if it is a directory.


    The second parameter is a pointer to a **BOOL**. If you’re coming from C or C++,
    this will seem quite familiar, but for people coming from


    **Determining if a File or Directory Exists** 237


    **Note:**


    Don’t use this mechanism to create


    temporary files. If you do, there is a potential race condition between testing
    whether the file exists and creating it. Use the C library mkstemp() function
    instead. The EtoileFoundation framework has a wrapper around this that you can
    use if you want to stay in object land.


    languages like Java it may seem a bit unusual.


    C, and by extension Objective-C, only supports returning a single value, but this
    method needs to return two things: whether something exists and whether it is
    a directory. There are a few ways of implementing this. One would be to define
    an enumerated type, with nothing exists, file exists, and directory exists elements.


    This would have made all of the code that uses this method simpler, so it’s not
    immediately obvious why it wasn’t done. The answer becomes apparent when you realize
    that you can pass NULL as the second argument. If you do this, the method will
    not bother testing whether the object at that path is a directory. This is a relatively
    small saving, so it’s not clear that this was a sensible design choice.


