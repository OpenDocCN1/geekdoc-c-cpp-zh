    \ or it might accidentally delete an object you have just created a reference\
    \ to.\n\nYou have two options when compiling for garbage collection. If you compile\
    \ with the `-fobjc-gc-only` flag your code will only support garbage collection.\n\
    \n```bash\n$ gcc -c -framework Cocoa -fobjc-gc-only collected.m\n$ gcc -c -framework\
