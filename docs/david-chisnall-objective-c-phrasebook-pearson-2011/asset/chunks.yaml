  trans: "\n默认值有多个来源，它们按照顺序加载并覆盖之前的默认值。\n\n最后一种，也是优先级最高的默认值是参数。指定 `-example` 命令行选项会将默认值中的\
    \ `@ *\"example\"` 键设置为传递给参数的任何内容。\n\n这不会替换持久化值，它只是在程序的这次特定运行中覆盖了该值。\n\n从你可以看到，当我们再次运行程序且不带命令行参数时，将使用两次调用之前的旧值。该值在程序的第三次运行时已提交到磁盘，但在第四次运行中没有被使用，因为一个参数替换了它。在第五次运行中，在没有\
    \ `-example` 参数的情况下，它再次可见了。你可以通过 `NSUserDefaults` 显式地查看单个域，但通常很少需要这样做。\n\n如果你正在编写命令行工具，这提供了一种非常方便的解析命令行参数的方法。你可以在默认值系统中存储命令行参数的默认值，并让它们被用户自动覆盖，而无需任何解析代码。\n\
    \n### 存储用户默认值\n\n```\n$ ./a.out persistent\na.out[72216:903] Old value: (nil)\n\
    \n$ ./a.out new\na.out[72216:903] Old value: persistent 5\n\n$ ./a.out -example\
    \ arg store\na.out[72362:903] Old value: arg\n\n$ ./a.out -example arg\na.out[72363:903]\
    \ Old value: arg\n\n$ ./a.out new\na.out[72363:903] Old value: store\n\n$ plutil\
    \ -convert xml1 ~/Library/Preferences/a.out.plist\n$ cat ~/Library/Preferences/a.out.plist\n\
    ```\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE plist PUBLIC\
    \ \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"\
    \ >\n<plist version=\"1.0\">\n<dict>\n  <key>example</key>\n  <string>new</string>\n\
    </dict>\n</plist>\n```\n\n*来自：defaults.m*\n\n很多时候，你想在默认值中存储基础基础数据类型以外的内容。一个常见的例子是颜色。如果你允许用户以任何方式自定义界面，你通常希望他们选择的颜色在程序调用之间保持持久化。这很容易；只需在默认值中存储\
    \ `NSColor` 对象即可。\n\n```objc\nNSUserDefaults *def = [NSUserDefaults standardUserDefaults];\n\
    NSData *serialized = [def objectForKey: @ *\"color\"*];\nid favoriteColor = [NSKeyedUnarchiver\
    \ unarchiveObjectWithData:serialized];\n\nif (nil == favoriteColor) {\n    favoriteColor\
    \ = [NSColor blackColor];\n    serialized = [NSKeyedArchiver archivedDataWithRootObject:favoriteColor];\n\
    \    [def setObject: serialized forKey: @ *\"color\"];\n    [def synchronize];\n\
    }\n```\n*来自：colordefault.m*\n\n### 在用户默认值中存储任意对象\n\n如果属性列表（property lists）以及用户默认值支持\
    \ `NSColor` 对象，那么事情就简单了。遗憾的是，它们不支持。不过，你可以在默认值中存储 `NSData` 实例。如果你有某种将对象转换为数据的机制，就可以将其存储在默认值中。\n\
    \n幸运的是，有很多常用对象支持一种通用方式。任何实现 `NSCoding` 协议的对象都可以使用 `NSCoder` 子类进行序列化和反序列化。与属性列表不同，`NSCoder`\
    \ 机制支持任意对象和循环。\n\n遗憾的是，它要求对象实现 `NSCoding` 协议中的两个方法，因此它并不适用于所有对象。但是，它对很多对象有效，而且复用它在默认值中存储对象是非常轻而易举的。\n\
    \n如果你经常这样做，可以为 `NSUserDefaults` 写一个分类（category），添加 `-colorForKey:` 和 `-setColor:forKey:`\
    \ 方法。这些方法可以接收 `NSColor` 实例，使用 coder 对其进行序列化，然后恢复它。\n\n如果你想要一个更通用的解决方案，可以添加一个 `-setEncodedObject:forKey:`\
    \ 方法。该方法将接受 `id<NSCoding>` 作为参数，并使用本章开头示例中的代码进行存储。\n\n如果你想在默认值中存储某些不支持 `NSCoding`\
    \ 协议的对象，你有两个选择。第一，你可以为它添加 `NSCoding` 支持。这涉及实现 `-encodeWithCoder:` 和 `-initWithCoder:`\
    \ 方法，你可以在分类中实现这些方法。第二是进行其他类型的转换。很多对象都有 `-stringValue` 和 `-initWithString:` 方法。你只需要在存储之前将它们转换为字符串并存储在默认值中，并在从默认值中读取它们时从字符串创建新对象，即可简单地实现这一点。\n\
    \n### 环境\n\n在 OS X 上，有三种方式访问环境变量。其中两种可以在任何地方工作，而第三种只在某些平台上有效。OS X 像 Windows 一样，将环境作为第三参数传递给\
    \ `main()` 函数。这是一个 NULL 结尾的 C 字符串数组。\n\n#### 获取变量\n\n![Getting Variables.png)\n\
    \n```objc\nint main(int argc, char **argv, char **envp) {\n    // C 方式\n    while\
    \ (*envp) {\n        printf(\"%s\\n\", *envp);\n        envp++;\n    }\n\n   \
    \ // Objective-C 方式\n    [NSAutleasePool new];\n    NSDictionary *env = [[NSProcessInfo\
    \ processInfo] environment];\n    for (NSString *key in env) {\n        NSLog(\"\
    %@ = %@\", key, [env objectForKey: key]);\n    }\n    return 0;\n}\n```\n*来自：env.m*\n\
    \n```objc\nint main(int argc, char **argv) {\n    [NSAutleasePool new];\n    NSUserDefaults\
    \ *d = [NSUserDefaults standardUserDefaults];\n    NSString *file = [d stringForKey:\
    \ @ *\"file\"*];\n\n    if (nil == file) {\n        fprintf(stderr, \"USAGE: %s\
    \ {filename}\", argv[0]);\n        return 1;\n    }\n\n    NSLog(@\"Using file\
    \ %@\", file);\n    return 0;\n}\n```\n*来自：args.m*\n\n标准 C 没有提供在 `main()` 函数之外获取程序参数的方法。GNU\
    \ C 标准库提供了一些在程序启动后访问它们的扩展，并且在大多数类 Unix 平台上，你可以从 `/proc` 文件系统读取它们，但在 C 代码中没有简便的可移植方法来获取它们。\n\
    \n在 Objective-C 中，你始终可以通过向 `NSProcessInfo` 发送 `-arguments`get 来获取参数。这会返回一个包含所有选项\
    \ Objective-C 字符串的 `NSArray`。然后你可以以任何喜欢的方式处理这些参数。\n\n"
