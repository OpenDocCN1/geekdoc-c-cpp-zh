    *From: defaults.m*


    The user defaults system is one of the biggest users of property lists. If you
    look in the


    ˜/Library/Preferences directory, you will see a lot of property list files. These
    files store preferences for the current user. There is a corresponding global
    directory in /Library/Preferences.


    Every application has its own *defaults domain*, typically a reverse-DNS notation
    string (for example com.apple.TextEdit). The NSUserDefaults class can access data
    from this domain.


    The user defaults system will read data from a variety of sources. One of the
    most useful is the command line. You can specify key-value pairs as command-line
    arguments to any OS


    X application, which is incredibly useful when


    **Storing User Defaults** 179


    debugging.


    The defaults system is exposed as a single dictionary, with a few convenience
    methods. In general, you can pretend that the user defaults object really is a
    persistent dictionary.


    **Note:**


    The defaults system is comparable to the Windows registry, but with a few important
    differences. Both support multiple levels of keys (user, system, and network),
    but the defaults system hides all of this from the programmer.


    Although both look like tree structures, the registry is a single database, whereas
    the defaults system stores data in separate files for each domain. This makes
    it easy to modify defaults with third-party tools and means that it scales better
    because you never need to read more than one or two of these files into memory
    at once. The downside is that operations on defaults are not transactional.


    Modifying the same domain from two programs simultaneously is undefined.


    Unlike a dictionary, the defaults object has some convenience methods for accessing
    non-object types and for type-checking object types. In the current example, we
    send it a -stringForKey: message. This wraps the -objectForKey: method, but ensures
    that the return value is a string.


    There are other convenience methods, such as -floatForKey: and -setFloat:ForKey:,


    180


    CHAPTER 9: **Working with Property Lists** which take primitive C types and wrap
    them in NSNumber instances before storing them in the defaults system.


    The code in this example ends by sending a


    -synchronize message to the defaults object.


    This is not usually necessary. The defaults object will be periodically synchronized
    with the on-disk storage. In this example, however, we are not using a run loop
    (so timers will not work) and are exiting immediately after modifying the defaults,
    so our changes will never be committed to disk without this.


    Running this example, you can see that the initial value is nil, because there
    isn’t anything stored in defaults. The value passed as an argument to the short
    program is stored in defaults and retrieved automatically the next time it is
    run.


    This also demonstrates using NSArgumentDomain.'
