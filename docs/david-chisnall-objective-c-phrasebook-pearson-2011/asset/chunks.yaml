    [obj setInteger: [obj integer] + 42];\n```\n\n```objc\n@interface Integer : NSObject\n\
    @property (nonatomic,assign) int integer;\n@end\n\n@implementation Integer\n@synthesize\
    \ integer;\n@end\n```\n*自: synth.m*\n\n“property”一词在 Smalltalk 中指代任何可以通过访问器操作的实例变量。在稍旧的\
    \ Objective-C 文档中，它以类似的方式使用。指定声明属性而不仅仅是属性，有助于减少这种歧义。\n\n属性声明包含两个部分：接口和实现。接口定义了属性的名称和类型（正如你预期的那样），但它也定义了一些高级语义。属性默认是原子的（atomic）。这会产生一些开销，因此你可能可能想在你创建的大多数属性中指定\
    \ `nonatomic`。访问器方法的原子性并不能让对象线程安全，在线程之间共享对象时，使用某些高级别的锁几乎总是更好的选择。\n\n考虑 `nonatomic.m`\
    \ 示例。它声明了一个原子属性。然后你在代码中使用单次递增操作。你认为这是一个原子的递增，但事实并非如此。这个语句展开为两个消息发送之间的一个递增。\n\n\
    ```objc\n@interface NotReallyAtomic : NSObject\n@property int a;\n@end\n\nint\
    \ add(NotReallyAtomic *obj)\n{\n    obj.a += 1;\n}\n```\n*自: nonatomic.m*\n\n\
    在属性的上下文中，原子的全部意思是在不使用垃圾回收的情况下，设置和获取方法都会尝试获取同一个锁，这样当你在一个线程中设置而在另一个线程中获取它时，对象就不会被意外释放。在垃圾回收模式下，对于非对象属性，`nonatomic`\
    \ 没有意义。\n\n属性可以是读写（readwrite）或只读（readonly），表示支持对其赋值。如果你定义了一个读写属性且没有使用垃圾回收，你还需要定义设置器的语义。\n\
    \n设置器的行为有三种选项：`assign`、`retain` 和 `copy`。第一个选项通常只用于代理，因为保留它们会创建循环引用。后两个选项仅适用于\
    \ Objective-C 对象。对于所有原始 C 类型，`assign` 是唯一的选项。\n"
