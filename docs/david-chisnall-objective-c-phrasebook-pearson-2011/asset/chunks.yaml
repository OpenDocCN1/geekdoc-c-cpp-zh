    ### 19: **The Objective-C Runtime**


    Objective-C methods are C functions that are called via an indirection layer.
    Exactly how this is implemented varies between runtimes. With the NeXT and Apple
    runtimes, simple message sends are implemented using the `objc_Send()` function.
    Unfortunately, this is not the only function you need. On Darwin/x86, for example,
    object pointers are returned in the `eax` register. If you return a floating point,
    it is returned in a floating point register. If you return a structure, it is
    allocated in the caller and a pointer is passed in as a hidden argument. You have
    to call either `objc_msgSend_sret()` or `objc_msgSend_fpret()`. This is quite
    messy, because it means you have to be aware of the calling conventions on your
    target.


    With the GNU runtimes, this is much simpler. There is no `objc_msgSend()` function.
    Instead, you call `objc_msg_lookup()` and then call the returned function pointer,
    after casting it to the correct types. The easiest way of doing this that is portable
    between runtimes is to use `-methodForSelector:` on `NSObject`. This returns a
    pointer to the function used to implement the method, which you can then call.
    This takes two hidden arguments; the receiver and the selector. This is almost
    enough to call a method by name. The missing part is some mechanism for turning
    strings into selectors. The `NSSelectorFromString()` function does exactly this.
    It takes an `NSString` as an argument and returns a selector. You can then pass
    this to `-methodForSelector:`, and as the second argument to the returned function.


