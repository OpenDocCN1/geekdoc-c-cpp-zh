  trans: "\n读写属性，但仅在公共接口中设为可读。类扩展（Class extensions）提供了实现此点的机制。如果你在主接口中声明属性为只读，但在类扩展中将其重新声明为读写，那么主\
    \ `@implementation` 中的 `@synthesize` 指令将创建 setter 和 getter。\n\n然而，在类扩展不可见的任何地方尝试使用\
    \ setter 都会导致编译器错误。\n\n选项（option），其原因希望是显而易见的：非对象的内容不会响应 `-retain` 或 `-copy` 消息。\n\
    \n这其中一个例外是使用 `__attribute__((NSObject))` 声明的 C 指针类型。该属性告诉编译器该 C 类型实际上是一个 Objective-C\
    \ 对象。Core Foundation 对象和 blocks（参见“使用闭包”章节）是此种情况常见示例。它们被暴露在可能被 C 程序包含的头文件中，因此它们没有显式地暴露\
    \ Objective-C 类型，但在 Objective-C 中可以作为 Objective-C 对象使用。\n\n使用另外两个选项中的哪一个，通常取决于属性的类型。如果它没有实现\
    \ `NSCopying` 协议，那么 `retain` 是你唯一的选择。如果它实现了，你应该决定属性的别名（aliasing）是否会破坏你的代码。如果是，使用\
    \ `copy`；否则，使用 `retain`。\n\n对于响应 `-copyWithZone:` 消息返回 `self` 的不可变对象，这些是等价的。\n\
    \n一旦你声明了属性接口，必须提供实现。属性只是定义访问器方法的一种方式。上例中的属性 `a` 通过 `-a` 和 `-setA:` 方法实现。第一个返回属性的值，第二个将其设置为新值。\n\
    \n**注意：**\n\n点符号语法（dot syntax）是 Apple 对 Objective-C 所做的最受争议的更改之一。它通过重用结构体访问器语法来发送消息，违反了\
    \ Objective-C 的核心原则之一——新语义应该始终使用新语法。点符号语法对于隐藏糟糕的设计也十分有用；它鼓励了非常间接的引用，而这违反了迪梅特法则（Law\
    \ of Demeter）。\n\n你可以自己实现这些方法。你可能也可以从父类继承它们。如果是此类情况，编译器可能无法看到它们并生成警告。你可以通过为该属性提供一条\
    \ `@dynamic` 行来抑制这种警告。这告诉编译器这些方法确实存在，将在运行时解析。\n\n或者，你可以使用 `@synthesize` 告诉编译器为你生成访问器方法。合成的属性方法引用与属性同名的实例变量。这些方法调用一个运行时库函数，参数为实例变量的偏移量和指示属性类型的某些标志位。\n\
    \n在旧的 Objective-C ABI 中，所有实例变量都需要在 `@interface` 描述中声明，以便编译器将它们转换为 C 结构体。在非脆弱 ABI（non-fragile\
    \ ABI）中，情况并非如此。`@synthesize` 指令可以创建不属于类公共接口的新实例变量。\n\n**理解 self, _cmd, super**\n\
    \n```\nid method(**id self, SEL _cmd, ...);\n```\n*来自：object.m*\n\n每个 Objective-C\
    \ 方法都被编译为一个函数。它包含两个隐藏参数：`self` 和 `_cmd`。其中第一个非常显而易见：它是消息的接收者。如果是实例消息，`self` 将是该类的实例。如果是类消息，它将是类本身。\n\
    \n在 C++ 中，`this` 关键字几乎等同于 Objective-C 中的 `self`，但有一个关键区别：`self` 不是关键字。它是一个参数名称。在\
    \ C++ 中赋值给 `this` 会导致错误。在 Objective-C 中给 `self` 赋值是被允许的。\n\n第二个隐藏参数是消息的选择器（selector）。这对于转发等功能的正常工作是必不可少的。当你向一个对象不知道如何处理的对象发送消息时，它将构造一个封装消息的\
    \ `NSInvocation` 对象，然后将其传递给 `-forwardInvocation:`。\n\n由于这两个隐藏参数都不是关键字，你可以在方法之外将它们都作为标识符使用，尽管\
    \ C 规范预留了以下划线开头的标识符用于实现，因此最好不要使用 `_cmd`。标准的作用域规则适用，因此你也可以在方法内部声明一个名为 `self` 的变量，并让它隐藏作为参数传递的版本。如果你这样做，编译器会生成警告，因为这是一件愚蠢的事，但在语义上是有效的。\n\
    \n`super` 伪变量要复杂得多。它只在作为消息的接收者使用时才有效。它会生成一个消息发送，其中 `self` 是接收者，但方法会在父类中查找而不是当前类。这就是你调用已重写方法的方法。\n\
    \n向 `super` 发送消息使用不同的方法查找函数，该函数接受指向 `objc_super` 结构的指针作为参数。该结构包含了目标类和目标对象。\n\n\
    父类在编译时就已经固定。当你编译一个 Objective-C 类时，所有向 `super` 的消息都将在类接口中定义为父类的类上查找。\n\n对于大多数代码，这并不重要，但如果你在使用运行时函数为类添加方法，这是你需要记住的。如果你附加到新类上的方法向\
    \ `super` 发送消息，它将发送到错误的类。\n\n同样注意的是，在带有 GNU 运行时的分类（categories）中，向父类的消息实现方式不同。类实现与类结构在同一个编译单元中，因为类结构是由编译器从\
    \ `@implementation` 上下文中代码生成的。只需通过查找即可找到父类指针。\n\n在分类中，类结构是不可用的。它必须在运行时查找。这使得从方法发送的父类消息变慢。Apple\
    \ 运行时通过让链接器解析外部类引用来解决这个问题。\n\n动态查找是为了支持类替换，一种在运行时替换另一个定义的技术。在现代 Apple 运行时，类替换不再被支持。每个类都导出其结构作为公共符号，因此链接器将在加载时解析类指针。\n\
    \n**理解 isa 指针**\n\n```\ntypedef struct objc_object *id;\n\nstruct objc_object\n\
    {\n    id isa;\n};\n```\n\n在 C++ 中，类就是结构。你可以将一个 C 结构子类 C++ 类。当你对 C++ 类调用方法时，你实际上是在调用一个带有混淆名的\
    \ C 函数，并将结构体指针作为第一个（隐藏）参数。\n\n在 Objective-C 中，结构和类非常不同。在引入非脆弱 ABI 之前，你可以在结构体定义中使用\
    \ `@defs` 关键字来创建一个具有\n\n"
- fmt: "\nthe same layout as a class, but you could not use classes and structures\
    \ interchangeably.\n\nThe difference between an object and a structure is that\
    \ you can send a message to a class. This works because the first instance variable\
    \ in a structure is a pointer to the class structure. This instance variable is,\
    \ by convention, called `isa`, as in “this object is a. . . .” If you define a\
    \ new root class, you must remember to add this instance variable.\n\nAs with\
    \ the `self` and `_cmd` hidden arguments, the `isa` pointer is just another instance\
    \ variable; it is not a keyword. Contrast this with calling a virtual method in\
    \ C++. A C++ object that has virtual methods contains a (hidden) pointer to a\
    \ `vtable`. This is a simple array of function pointers. When you call the method,\
    \ the compiler dereferences the `vtable` pointer and calls the function at the\
    \ correct offset.\n\nYou cannot use the `vtable` to find anything out about the\
    \ object, and its layout is part of the target platform’s ABI definition, not\
    \ part of the language. The `isa` pointer is very different. It is an explicit\
    \ instance variable, and therefore it’s accessible just like any other instance\
    \ variable. It points to a `Class`, which is a `typedef` provided by the Objective-C\
    \ runtime headers2 and defined as either an opaque type or a pointer to a public\
    \ C structure, depending on the runtime.\n\n`Clang` treats it as a built-in type\
    \ if a definition is not provided.\n\n## Understanding the isa Pointer\n\nOn runtimes\
    \ where the exact layout of the class structure is private, you will still find\
    \ functions for inspecting it. These can tell you the offsets of instance variables,\
    \ the names and type signatures of methods and properties, the superclass, and\
    \ so on.\n\nYou can look at the `isa` pointer on other objects. The `id` type\
    \ is defined as a C structure (with no access control) containing just the pointer\
    \ to the class, so you can read it just as you would any other field in a structure.\
    \ Doing this is strongly discouraged.\n\nObjective-C objects may forward messages,\
    \ and the object pointer that you have might be a proxy. If you want to get another\
    \ object’s class, you should send it a `-class` message instead. This is slower,\
    \ but it won’t break in the presence of proxies.\n\nYou can test whether an object\
    \ is a proxy by sending it an `-isProxy` message, but if you’re sending one message\
    \ anyway, you may as well just send one to get the class.\n\n## CHAPTER 2: An\
    \ Objective-C Primer\n\n### Initializing Classes\n\n```objc\n@implementation Init\n\
    \n+ (**void**)load\n{\n    NSLog(@\"+load called\"* );\n}\n\n+ (**void**)initialize\n\
    {\n    NSLog(@\"+initialize called\"* );\n}\n\n- (**id**)init\n{\n    NSLog(@\"\
    -init called\"* );\n    return self;\n}\n\n@end\n\nint main(**void**)\n{\n   \
    \ [NSAutoreleasePool new];\n    NSLog(@ *\"main() entered\"* );\n    id init =\
    \ [[Init alloc] init];\n    init = [[Init alloc] init];\n    return 0;\n}\n```\n\
    *From: classInit.m* In C++, you can perform static initialization by assigning\
    \ the result of a function to a global or static variable. In C, you can use extensions\
    \ such as GCC’s `__attribute__((constructor))` to achieve the same result. These\
    \ both cause a particular function to be called before the `main()` function.\
    \ It’s difficult to use these correctly. The order in which they are called is\
    \ undefined. Objective-C has an equivalent. The `+load` method on a class is called\
    \ when the class is registered with the runtime, before the `main()` function.\n\
    \nIt is not safe to send arbitrary messages from this method. The class itself,\
    \ all of its superclasses, and the constant string class are all guaranteed to\
    \ have been loaded. Other classes might have been, but this is not guaranteed,\
    \ and even if it works for you, it might not work if the load order changes slightly.\n\
    \nA safer alternative is the `+initialize` method. This is called automatically,\
    \ by the runtime, when the first message is sent to the class. Typically, the\
    \ first message will be something like `+alloc`, to create an instance of the\
    \ class, but it might be something requesting the class name or a singleton instance.\n\
    \nThe `+initialize` method lets you perform lazy initialization of things the\
    \ class needs. This won’t be called before the `main()` function, so everything\
    \ will be loaded already and the process will be in a well-defined state.\n\n\
    If you implement both of these methods, you can see the order of execution. First\
    \ the `+load` method is called, as soon as the class is loaded. When the run-time\
    \ loader finishes, it calls the `main()` function. When you send a message to\
    \ the class, the `+initialize` method is called, then the method you actually\
    \ called, and then you can send an `-init` message to the returned instance.\n\
    \n```\na.out[2690:903] +load called\na.out[2690:903] main() entered\na.out[2690:903]\
    \ +initialize called\na.out[2690:903] -init called\n```\n*Output from classInit.m*\
    \ Note that the `+initialize` method is only called once. The second time you\
