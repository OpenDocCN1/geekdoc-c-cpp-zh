    # CHAPTER 7: Working with Collections


    Objective-C collections are higher-level constructs. Each Objective-C collection,
    like most of the other additions made by Objective-C, is an object. You communicate
    with them by sending them messages.


    The Foundation framework includes a number of collection classes for storing ordered
    and unordered data, as well as maps or sets of indexes. Most of the collection
    classes in Objective-C store objects. Unlike C++ STL collections, which need refining
    for the types they may contain, Objective-C collections are heterogeneous. They
    may store any kind of Objective-C object.


    Most Objective-C collections, like strings, use the *mutable subclass pattern*,
    where the superclass implements behavior for an immutable collection and a subclass
    provides a mutable version.


    All of the classes that follow this pattern implement the `NSMutableCopying` protocol,
    meaning that you can send a `-mutableCopy` message to a collection and get a copy
    that is mutable, even if the original isn’t.


    Most collections are also *class clusters*. When you create one, you will get
    some private subclass. The public classes are typically abstract. The user-friendly
    methods are all implemented in terms of a small number of primitive methods. If
    you create your own subclass, you will need to implement these methods yourself.


    ## Using Arrays


    137


    ```

    NSArray *array = [NSArray arrayWithObjects: 7

    @ *"array"* , @ *"containing"* , @ *"string"* , @ *"objects"* , nil];

    8

    NSMutableArray *mutable = [array mutableCopy]; 9

    [mutable sortUsingSelector:@selector(localizedCompare:)];

    10

    [mutable addObject:[NSNumber numberWithInteger: 12]];

    11

    [mutable removeAllObjects];

    ```

    *From: nsarray.m*


    In addition to C arrays, Foundation provides the `NSArray` class and its mutable
    subclass `NSMutableArray`. These implement an abstract data type that maps from
    integers, in a contiguous range starting at zero, to objects.


    Internally, it may be implemented by C arrays, skip lists, or some other data
    structure, depending on how it was created.


    For example, if you create an array by appending two immutable arrays, you may
    get a composite array that doesn’t store anything internally, and just accesses
    the other two arrays. Or you might get a completely new array, depending on what
    the people implementing the relevant `NSArray` subclass thought would be more
    efficient for that specific case.


    The easiest way of creating an Objective-C array is to use the `+arrayWithObjects:`
    method, implemented by both `NSArray` and `NSMutableArray`. This is another example
    of a *variadic method*, taking a list of objects as arguments and using `nil`
    to signify the end of the list. You must be careful, when using variables as arguments
    to this method, that none of the variables are `nil`, or the array will see that
    as the end of the argument list and ignore the later values.


    **Note:**


    Most Objective-C collections don’t allow you to store `nil` as a value. If you
    need to signify a null value, rather than an absence of a value, you can use the
    `NSNull` class. This provides a singleton object that can be accessed with `[NSNull
    null]`.


    Arrays are *class clusters*. The two primitive methods in `NSArray` are `-objectAtIndex`
    and `-count`. All of the other methods are implemented in terms of these. Some
    concrete subclasses, of course, will implement more efficient versions, but if
    you want to create a new `NSArray` subclass, you must implement these two methods
    if you want the other methods in the superclass to work.


    Subclassing `NSMutableArray` is a bit harder; it adds another six primitive methods.
    Most of the time, however, you will be using arrays, not subclassing them. You
    can insert an object into a mutable array with either `-addObject:`, which adds
    it at the end, or `-insertObject:atIndex:`, which inserts it at the specified
    index. The latter method moves all subsequent objects along by one in the array
    to make room. To replace an object, use `-replaceObjectAtIndex:withObject:`.


    ## Manipulating Indexes


    139


    ```

    NSMutableIndexSet *indexSet = [NSMutableIndexSet indexSetWithIndex: 1]; 15

    [indexSet addIndexesInRange:NSMakeRange(5, 20)]; 17

    [array removeObjectsAtIndexes:indexSet];

    ```

    *From: indexset.m*


    Arrays are indexed by integers. Often, you want to do some operation on a group
    of values in an array. A special class, called `NSIndexSet`, is used for storing
    groups of indexes. Internally, this stores a set of ranges, so can be quite dense.


    A very common use for index sets is to collect a group of indexes while enumerating
    an array and then remove them at the end. Removing objects from a collection while
    enumerating it is a bad idea, and will throw an exception in most cases.


    If you add each index that you want to remove to an index set, you can remove
    them all at once when you finish the enumeration. Operations involving index sets
    are usually more efficient than the corresponding operations involving individual
    indexes. This is true true in a relatively naïve implementation, because you need
    fewer message sends. You also get to avoid some range checking. Each operation
    on Objective-C array is bounds checked to make sure it doesn’t refer to an index
    beyond the end of the array. With an index set, the receiver just has to compare
    the result of last index in the array, and then it can operate on single element
    in the index set.


    Like other collections, index sets come in mutable and immutable flavors. Most
    of the time you will use the mutable version.


    You manipulate it by adding and removing either individual indexes (`NSInteger`)
    or ranges. You can use index sets for storing indexes to anything, but they are
    most useful in conjunction with `NSArray`, which have several methods designed
    to take index sets as arguments. You can often use them as an alternative to creating
    a subarray if you just want to work on some arbitrary subset of the elements in
    an array.


    ## Storing Unordered Groups of Objects


    141


    ```

    NSArray *array = [NSArray arrayWithObjects: 7

    @ *"set"* , @ *"object"* , @ *"containing"* , 8

    @ *"seven"* , @ *"objects"* , @ *"not"* , 9

    @ *"eight"* , @ *"objects"* , nil]; 10

    NSSet *set = [NSSet setWithArray: array]; 11

    NSMutableSet *mSet = [set mutableCopy]; 12

    NSCountedSet *cSet = [NSCountedSet setWithArray: array]; 13

    ```

    *From: nsset.m*


    If you want to store a collection of objects without a defined order, you can
    use `NSSet` and its mutable subclass. This models a mathematical set, so inserting
    the same object twice will only store one copy of it.


    How `NSSet` determines equality between objects is quite complex. Equality is
    not the same as identity; it will not store two copies of the same object, but
    it will also not store two objects with the same value. It determines whether
    two objects are equal by sending one of them an `-isEqual:` message with the other
    as an argument.

