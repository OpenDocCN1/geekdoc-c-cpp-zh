    *From: autorelease.m*


    Aside from cycles, the biggest problem with reference counting is that there are
    short periods when no object really owns a particular reference. In C, deciding
    whether the caller or callee is responsible for allocating memory is a problem.


    In something like the sprintf() function, the caller allocates the space. Unfortunately,
    the caller doesn’t actually know how much space is needed, so the snprintf() variant
    was added to let the callee know how much space is available.


    This can still cause problems, so the asprintf() version was added to let the
    callee allocate the space.


    If the callee is allocating the space, who


    **Autorelease Pools** 65


    is responsible for freeing it? The caller, presumably, but because the caller
    didn’t create it, anything that checks for balanced malloc() and free() calls
    will fail to spot the leak.


    In Objective-C, this problem is even more common. Lots of methods may return temporary
    objects. If you’re returning a temporary object, it needs to be freed, but if
    you’re returning a pointer to an instance variable, it doesn’t. You could retain
    such a pointer first, but then you need to remember to release every single object
    that is returned from a method. This quickly gets tiresome.


    The solution to this problem is the *autorelease* *pool*. When you send an object
    an -autorelease message, it is added to the currently active NSAutoreleasePool
    instance. When this instance is destroyed, every object added to it is sent a
    -release message.


    The -autorelease message is a deferred


    -release message. You send it to an object when you no longer need a reference
    to it but something else might.


    If you are using NSRunLoop, an autorelease pool will be created at the start of
    every run loop iteration and destroyed at the end. This means that no temporary
    objects will be destroyed until the end of the current iteration. If you are doing
    something that creates a lot of temporary objects, you may wish to create a new
    autorelease pool, like so:


    66


