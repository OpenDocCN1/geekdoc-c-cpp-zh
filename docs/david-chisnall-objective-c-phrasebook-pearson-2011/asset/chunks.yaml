  trans: "\n\n`-initWithContentsOfFile:` 初始化器，以及相应的构造函数。\n\n这听起来很容易，但实际上存在一些复杂性。最重要的一点是属性列表（property\
    \ lists）并不存储任何关于可变性的信息。例如，`NSString` 和 `NSMutableString` 的存储方式是完全相同的。\n\n# 使用属性列表\
    \ (Working with Property Lists)\n\n当你读取一个属性列表时，你应该得到什么？如果你通过向 `NSArray` 类发送 `+arrayWithContentsOfFile:`\
    \ 消息读取数组，你会得到一个不可变数组。如果你向 `NSMutableArray` 发送相同的消息，你将得到一个可变数组。\n\n对于属性列表的外部元素来说这没问题，但数组内部的节点呢？\n\
    \n在这两种情况下，你得到的都将是填充了不可变对象的数组。这可能不是你想要的结果。\n\n如果你想读取可变对象，则需要使用 `NSPropertyListSerialization`。该类处理属性列表的读取和写入，并提供了比各种集合类更精细粒度的控制。\n\
    \n**注意：**\n\n如果你阅读 Apple 最新版本的文档，你会发现我们在 `NSPropertyListSerialization` 上使用的方法被标记为未来弃用。这是因为该方法是在\
    \ Apple 开始使用 `error:` 参数的时期引入的，但在他们引入 `NSError` 类之前。遗憾的是，推荐用来替代它的方法尚未提供等的功能。\n\
    \n当你使用该类读取属性列表时，可以传递一个可变性选项作为参数。有三个可能的选项。默认是所有对象都是不可变的。本章开头示例中的选项走向了另一个极端，使所有内容都变为可变。在数组中的其中一个字符串添加后缀演示了这一点。\n\
    \n第三种选项介于两者之间。它让容器对象变为可变，但让其他对象（字符串、数字、日期等）保持不可变。当你想要修改属性列表的结构但不想修改任何叶节点元素时，这种方法非常有用。\n\
    \n以这种方式读取属性列表时，属性列表序列化类会告诉你属性列表的格式。\n\n## 转换属性列表格式\n\n```objectivec\nNSString\
    \ *file = [NSString stringWithUTF8String: argv[1]];\nNSData *data = [NSData dataWithContentsOfFile:file];\n\
    NSPropertyListFormat fmt;\nid plist = [NSPropertyListSerialization propertyListWithData:\
    \ data\noptions: 0\nformat: &fmt\nerror: NULL];\n\nif (fmt == NSPropertyListBinaryFormat_v1_0)\n\
    {\n    return 0;\n}\ndata = [NSPropertyListSerialization dataWithPropertyList:\
    \ plist\nformat: NSPropertyListBinaryFormat_v1_\noptions: 0\nerror: NULL];\n\n\
    [data writeToFile: file atomically: NO];\n```\n*来自: makebinaryplist.m*\n\n在 OS\
    \ X 上，你无法写入 OpenStep 格式的属性列表，但仍然可以使用其他两种形式。通常，你应该使用二进制格式存储私有数据，使用 XML 格式存储用户可能想要用其他工具编辑的内容。\n\
    \n这些并不是硬性。属性列表格式的意义你可以在表示之间进行无损转换，因此你可能随处使用二进制格式——因为它更密集且解析更快——并期望用户在想要修改属性列表时对其进行转换。\n\
    \n在使用 `NSPropertyListSerialization` 写入文件时，你可以选择使用哪种格式。该类还很贴心地会在你读取时告诉你当前属性列表的格式。\n\
    \n**注意：**\n\n本节开头示例中使用的方法是随 OS X 10.6 的。如果你使用的是旧版本的 OS X，可以替换我们在上一节中看到的读取方法以及相应的写入方法。\n\
    \n为了效率，将属性列表存储为二进制格式是非常常见的。你的用户随后会决定想在文本编辑器中查看这些文件，因此他们会使用 `plutil` 工具将它们转换为 XML\
    \ 格式。然后，他们当然会忘记将其转换回来，所以你的程序下次读取它们时就会变慢。\n\n如果你不打算每次程序运行时都修改属性列表，那么在加载时检查格式是否仍为二进制是有的，如果不是则将其重写为该格式。\n\
    \n## 存储用户默认设置 (Storing User Defaults)\n\n```objectivec\nNSUserDefaults *def =\
    \ [NSUserDefaults standardUserDefaults];\nid persistentString = [def stringForKey:\
    \ @ *\"example\"* ];\nNSLog(@\"Old value: %@\", persistentString);\nif (argc >\
    \ 1)\n{\n    NSString *new = [NSString stringWithUTF8String: argv[1]];\n    [def\
    \ setObject: new forKey: @ *\"example\"* ];\n    [def synchronize];\n}\n```\n\
    *来自: defaults.m*\n\n用户默认设置系统是属性列表最大的用户之一。如果你查看 `~/Library/Preferences` 目录，你会发现有很多属性列表文件。这些文件存储了当前用户的偏好设置。每个应用程序都有自己的作用域，通常是一个反向\
    \ DNS 符号字符串（例如 com.apple.TextEdit）。`NSUserDefaults` 类可以访问该作用域的数据。\n\n默认系统会从各种来源读取数据。最实用的之一是命令行。你可以将键值对作为命令行参数传递给任何\
    \ X 应用程序，这在调试时非常有用。\n\n**注意：**\n\n默认系统与 Windows 注册表相当，但有几个重要的区别。两者都支持多层级键（用户、系统和网络），但默认系统向程序员隐藏了这一切。\n\
    \n尽管两者看起来像树形结构，但注册表是一个单一数据库，而默认系统将每个作用域存储在独立文件中。这使得使用第三方工具修改默认设置变得容易，并且意味着扩展性更好，因为你不需要一次性将这些文件读取到内存中。缺点是默认设置的操作不是事务性的。\n\
    \n同时从两个程序修改同一个作用域是未定义的。\n\n"
- fmt: "\nThere are several sources for defaults, which are loaded in order and overwrite\
    \ the previous ones.\n\nThe last, and therefore highest priority, defaults are\
    \ the arguments. Specifying an `-example` command-line option sets the `@ *\"\
    example\"` key in defaults to whatever is passed as the argument.\n\nThis does\
    \ not replace the persistent value, it just overrides it in this particular run\
    \ of the program.\n\nYou can see that when we run the program again, without the\
    \ command-line argument, the old value from two invocations ago is used. This\
    \ was committed to disk on the third run of the program, but was not used on the\
    \ fourth run because an argument replaced it. On the fifth run, with no `-example`\
    \ argument, it is visible again. You can look in individual domains explicitly\
    \ with `NSUserDefaults`, but it’s rare to want to.\n\nIf you are writing a command-line\
    \ tool, this provides a very convenient way of parsing command-line arguments.\
    \ You can store default values for command-line arguments in the defaults system\
    \ and have them automatically overridden by the user, without needing any parsing\
    \ code.\n\n### Storing User Defaults\n\n```\n$ ./a.out persistent\na.out[72216:903]\
    \ Old value: (nil)\n\n$ ./a.out new\na.out[72216:903] Old value: persistent 5\n\
    \n$ ./a.out -example arg store\na.out[72362:903] Old value: arg\n\n$ ./a.out -example\
    \ arg\na.out[72363:903] Old value: arg\n\n$ ./a.out new\na.out[72363:903] Old\
    \ value: store\n\n$ plutil -convert xml1 ~/Library/Preferences/a.out.plist\n$\
    \ cat ~/Library/Preferences/a.out.plist\n```\n\n```xml\n<?xml version=\"1.0\"\
    \ encoding=\"UTF-8\" ?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\"\
    \ \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\" >\n<plist version=\"1.0\"\
    >\n<dict>\n  <key>example</key>\n  <string>new</string>\n</dict>\n</plist>\n```\n\
    \n*Output from: defaults.m*\n\nQuite often, you want to store something in defaults\
    \ other than the basic Foundation data types. A common example is colors. If you\
    \ allow users to customize the interface in any way, you typically want their\
    \ selected colors to persist between program invocations. This is easy; just store\
    \ the `NSColor` object in defaults.\n\n```objc\nNSUserDefaults *def = [NSUserDefaults\
    \ standardUserDefaults];\nNSData *serialized = [def objectForKey: @ *\"color\"\
    *];\nid favoriteColor = [NSKeyedUnarchiver unarchiveObjectWithData:serialized];\n\
    \nif (nil == favoriteColor) {\n    favoriteColor = [NSColor blackColor];\n   \
    \ serialized = [NSKeyedArchiver archivedDataWithRootObject:favoriteColor];\n \
    \   [def setObject: serialized forKey: @ *\"color\"];\n    [def synchronize];\n\
    }\n```\n*From: colordefault.m*\n\n### Storing Arbitrary Objects in User Defaults\n\
    \nWell, it would be easy if property lists and, by extension, user defaults supported\
    \ `NSColor` objects. Unfortunately, they don’t. You can, however, store `NSData`\
    \ instances in defaults. If you have some mechanism for turning an object into\
    \ data, you can store it in defaults.\n\nFortunately, there is a generic way that\
    \ a lot of common objects support. Any object that implements the `NSCoding` protocol\
    \ can be serialized and deserialized using an `NSCoder` subclass. Unlike property\
    \ lists, the `NSCoder` mechanism supports arbitrary objects and cycles.\n\nUnfortunately,\
    \ it requires the object to implement the two methods in the `NSCoding` protocol,\
    \ so it doesn’t work on all objects. It does work on a lot, however, and it’s\
    \ trivial to reuse for storing objects in defaults.\n\nIf you are doing this a\
    \ lot, it’s very easy to write a category on `NSUserDefaults` that adds `-colorForKey:`\
    \ and `-setColor:forKey:` methods. These can take an `NSColor` instance, serialize\
    \ it with a coder, and then restore it.\n\nIf you want an even more general solution,\
    \ you could add a `-setEncodedObject:forKey:` method. This would take an `id<NSCoding>`\
    \ as its argument and store it using the code from the example at the start of\
    \ this chapter.\n\nIf you want to store some object that doesn’t support the `NSCoding`\
    \ protocol in defaults, you have two options. First, you can add `NSCoding` support\
    \ to it. This involves implementing the `-encodeWithCoder:` and `-initWithCoder:`\
    \ methods, which you can do in a category. The second is to do some other kind\
    \ of transformation. A lot of object have `-stringValue` and `-initWithString:`\
    \ methods. You can store these in defaults simply by turning them into strings\
    \ before storing them and creating new objects from strings when you read them\
    \ from defaults.\n\n### The Environment\n\nEnvironment variables can be accessed\
    \ in three ways on OS X. Two of them will work anywhere, whereas the third will\
    \ only work on some platforms. OS X, like Windows, passes the environment as a\
    \ third argument to the `main()` function. This is a NULL-terminated array of\
    \ C strings.\n\n#### Getting Variables\n\n![Getting Variables.png)\n\n```objc\n\
    int main(int argc, char **argv, char **envp) {\n    // C way\n    while (*envp)\
    \ {\n        printf(\"%s\\n\", *envp);\n        envp++;\n    }\n\n    // Objective-C\
    \ way\n    [NSAutleasePool new];\n    NSDictionary *env = [[NSProcessInfo processInfo]\
    \ environment];\n    for (NSString *key in env) {\n        NSLog(\"%@ = %@\",\
    \ key, [env objectForKey: key]);\n    }\n    return 0;\n}\n```\n*From: env.m*\n\
    \n```objc\nint main(int argc, char **argv) {\n    [NSAutleasePool new];\n    NSUserDefaults\
    \ *d = [NSUserDefaults standardUserDefaults];\n    NSString *file = [d stringForKey:\
    \ @ *\"file\"*];\n\n    if (nil == file) {\n        fprintf(stderr, \"USAGE: %s\
    \ -file {filename}\", argv[0]);\n        return 1;\n    }\n\n    NSLog(@\"Using\
    \ file %@\", file);\n    return 0;\n}\n```\n*From: args.m*\n\nStandard C does\
    \ not provide a way of getting at program arguments outside of the `main()` function.\
    \ The GNU C standard library provides some extensions for accessing them after\
    \ program start, and on most UNIX-like platforms you can read them from the `/proc`\
    \ filesystem, but there’s no simple way of getting them in a portable way from\
    \ C code.\n\nWith Objective-C, you can always get at the arguments by sending\
    \ an `-arguments` message to `NSProcessInfo`. This returns an `NSArray` containing\
    \ Objective-C strings for all of the options. You can then process the arguments\
    \ in any way you like.\n"
