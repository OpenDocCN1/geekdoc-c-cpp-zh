- fmt: "\nBecause header files are inserted into the compilation unit by the preprocessor,\
    \ before the Objective-C compiler sees them, this separation is not enforced.\
    \ The same is true of C++ and opaque data types in C.\n\nOne slightly surprising\
    \ aspect of Objective-C is that instance variables (what Java and C++ call “fields”)\
    \ are declared as part of the interface, not the implementation. This is an artifact\
    \ of how early versions of Objective-C were implemented.\n\nEvery object was converted\
    \ to a C structure whose first field was a pointer to the class. To generate this\
    \ structure, the compiler needed to be able to see all of the instance variables\
    \ for all superclasses. One unfortunate side effect of this approach was that\
    \ modifying the layout of a class meant that you had to recompile all of its subclasses.\n\
    \nNow, with the non-fragile ABI, you can hide private instance variables from\
    \ the subclasses. Every reference to them goes via an indirection layer. The offset\
    \ is now a variable, not a compile-time constant.\n\nBy default, Objective-C instance\
    \ variables are protected, meaning that they are only accessible by the class\
    \ or its subclasses. If you prefix them with `@private` they are only available\
    \ to the class, and with `@public` they are accessible anywhere. This is quite\
    \ uncommon. There is little run-time checking of the access, and there are a few\
    \ mechanisms for bypassing the access controls, so it’s common to leave everything\
    \ protected, only making instance variables public in private classes.\n\n**Note:**\n\
    Apple’s non-fragile ABI restricts the visibility of ivar offset variables, creating\
    \ a hard error if you try to access a private instance variable from a different\
    \ compilation unit. It is still possible to access private instance variables\
    \ by using runtime introspection and this protection is not available with other\
    \ runtimes.\n\n### Declaring Classes\n\nThe basic structure of a class interface\
    \ contains three parts. First is the definition of the place of the new class\
    \ in the hierarchy:\n\n`@interface ClassName : Superclass <protocols>` The name\
    \ of the class immediately follows the `@interface` keyword. Next there is a colon,\
    \ and then the name of the superclass. It is possible to design new root classes,\
    \ but it is quite complex to do correctly, so most of the time you will just use\
    \ `NSObject` or `NSProxy` as your superclass.\n\nAfter that, you may optionally\
    \ specify a list of protocols, separated by commas, in angle brackets. Protocols\
    \ in Objective-C are like interfaces in Java. They define lists of methods that\
    \ the object must implement.\n\nNext comes the list of instance variables. This\
    \ follows the same syntax as defining a structure in C. A simple class definition\
    \ with just instance variables and no methods would look like this:\n\n```objc\n\
    @interface NoMethods : NSObject\n{\n    int integer;\n    NSObject *object;\n\
    \    float floatingPoint;\n}\n@end\n```\n\nAnything that is valid in a C structure\
    \ definition is valid here. If you are using Objective-C++, you may also add pointers\
    \ to C++ objects and C++ objects that have a trivial constructor.\n\nFinally,\
    \ you list the public methods that the class implements. Rather than making some\
    \ up for this, let’s look at some real method declarations:\n\n`+ (id)new;`\n\
    `- (void)appendString:(NSString*)aString;` The plus sign in front of the first\
    \ method declaration indicates that this is a method attached to the class. You\
    \ can send a `+new` message to the class and it will give you an object pointer\
    \ back. The `id` type is a new type introduced with Objective-C, roughly similar\
    \ to the `void*` type in C, but restricted to pointing to Objective-C objects.\n\
    \nNote that the return type and the types of the parameters use the same syntax\
    \ as type casts. This highlights another important difference between message\
    \ sends and C function calls. The method is compiled down to a C function and\
    \ the pointer to it is cast to these types before it is called.\n\nThe implementation\
    \ part of the class definition is much simpler. It starts with the `@implementation`\
    \ directive and contains definitions of all of the class’s methods, like this:\n\
    \n```objc\n@implementation NewClass\n+ (int)classVersion\n{\n    return 2;\n}\n\
    - (void)log\n{\n    fprintf(stderr, \"log message received\");\n}\n@end\n```\n\
    \nOne important point to note is that you do not have to declare all of the methods\
    \ that a class implements. Methods that are not declared in the class interface\
    \ are considered to be private. Calling them will generate a compile-time warning,\
    \ and a future version of the class may stop responding to them altogether.\n\n\
    ### Using Protocols\n\nLike classes, protocols in Objective-C are objects. The\
    \ behavior of protocols was one of the things that Apple changed with the modern\
    \ runtime. Previously, protocols were identified by name, and two protocols were\
    \ considered equivalent if they had the same name. This meant that if you had\
    \ two protocols with the same name declared in different libraries, you couldn’t\
    \ tell which of them an object implemented. More importantly, you couldn’t look\
    \ up a protocol and see what methods it required.\n\nWith Objective-C 2, protocols\
    \ are now unique. You can now get a protocol by name and inspect it. This sometimes\
    \ worked with the old model, but it depended on whether the compiler had already\
    \ emitted a full definition of it. You can get a reference to a protocol with\
    \ the `@protocol()` keyword. The main reason for doing this is to test protocol\
    \ conformance.\n\n```objc\nif (![delegate conformsToProtocol:@protocol(DelegateProtocol)])\n\
    {\n    testIndividualMethods = NO;\n}\n```\n\nYou might use something like this\
    \ snippet in a method that sets a delegate. If the delegate conforms to the protocol,\
    \ it is guaranteed to implement all of the methods in that protocol, so you don’t\
    \ need to test each one. If it doesn’t, you may need to test each message before\
    \ you send it.\n\nProtocols give you both compile-time and runtime type checking.\
    \ You can require an object to conform to a protocol by putting the name in angle\
    \ brackets after the type name. Here are some examples:\n\n`id <NSCopying> a;`\n\
    `id <NSObject,NSCopying> b;`\n`NSObject<NSCopying> *c;`\n\nHere, you can assign\
    \ any object that implements the `NSCopying` protocol to `a`. Objects assigned\
    \ to `b` must also implement the `NSObject` protocol, which any object that inherits\
    \ from `NSObject` will automatically. Finally, `c` must be a subclass of `NSObject`\
    \ and must implement the `NSCopying` protocol.\n\nThe compiler will generate a\
    \ warning—not an error—if you assign an object to a variable that requires it\
    \ to conform to a protocol that is not in the list that it is declared as conforming\
    \ to. This is not a hard error because it may still implement of the methods required\
    \ by the protocol, even though it doesn’t advertise protocol conformance.\n\n\
    ### Adding Methods to a Class\n\n```objc\n@interface NSObject (Logging)\n- (void)log;\n\
    @end\n\n@implementation NSObject (Logging)\n- (void)log\n{\n    NSLog(\"%@\",\
    \ self);\n}\n@end\n```\n\n*From: logging.m*\n\nOne of the biggest differences\
    \ between Objective-C and a language such as C++ or Java is the idea of *categories*.\
    \ These were present in Smalltalk, but as a way of grouping methods together for\
    \ documentation. In Objective-C, they allow you to add methods to a class, even\
    \ if you don’t have access to the source code.\n"
