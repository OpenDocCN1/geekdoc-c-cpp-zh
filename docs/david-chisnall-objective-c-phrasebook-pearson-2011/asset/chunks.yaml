- fmt: "\n# Handling Errors\n\nException handling back in 2004. Every function compiled\
    \ in this mode, irrespective of the source language, had some `DWARF` debugging\
    \ data exported describing the layout of the stack frame and how to unwind it.\
    \ This is often called *zero-cost exception handling* because it doesn’t impose\
    \ any run-time penalty on code that doesn’t use exception handling. If you compile\
    \ C code in this mode, the binary is a bit bigger from the extra unwinding information,\
    \ but this extra data isn’t even swapped in unless an exception is thrown through\
    \ the C code.\n\nWith this support, it was possible to run cleanup code in C++\
    \ when an Objective-C exception was thrown through C++ stack frames, and vice\
    \ versa. It’s also possible to register cleanup code in C, using the `__attribute__((cleanup))`\
    \ GCC extension.\n\nApple adopted this change with the 64-bit runtime. This changed\
    \ the performance characteristics of exceptions quite significantly.\n\n## Runtime\
    \ Differences for Exceptions\n\nWith `setjmp()/longjmp()` exceptions, entering\
    \ an exception-handling region was expensive (it required saving all registers)\
    \ but throwing an exception was quite fast. It was, however, also unsafe, so the\
    \ documentation recommended that catching an exception should usually be followed\
    \ by aborting the program. Exceptions were to be used for semi-graceful abnormal\
    \ termination, unless they were caught very close to where they were thrown.\n\
    \nWith zero-cost exceptions, it costs nothing to enter an exception-handling block.\
    \ Throwing an exception is very expensive, but safe. This means that you can put\
    \ `@try` blocks in your code without slowing anything down and throw exceptions\
    \ whenever something exceptional happens.\n\nIf you need compatibility with Apple’s\
    \ 32-bit runtime, it’s still a good idea to avoid exceptions; they will add a\
    \ lot of overhead if you frequently use `@try` blocks.\n\n**Note:**\nWhen using\
    \ the older-style exceptions, you must be careful to specify `volatile` for any\
    \ local variables you need to access after catching the exception. If you don’t,\
    \ they may be restored to the value they held when `setjmp()` was called.\n\n\
    ## Throwing and Catching Exceptions\n\n### Exceptions\n\n```objc\nNSArray *array\
    \ = [NSArray array];\n\n@try\n{\n    [array objectAtIndex: 0];\n}\n@catch (NSException\
    \ *e)\n{\n    NSLog(@ *\"Caught exception %@\"* , e);\n}\n```\n*From: exception.m*\n\
    \nOld Objective-C code is likely to contain blocks that start with `NS_DURING`.\
    \ These are the old macros that defined the `setjmp()`-style exception handling.\
    \ With newer versions of the Foundation framework, they are defined in `NSException.h`\
    \ to use the new exception-handling keywords.\n\nThese old macros have a couple\
    \ of limitations, even when they are being used as wrappers around the new keywords.\
    \ First, they only allow `NSException` instances to be caught. Second, they have\
    \ no equivalent of `@finally`, which runs cleanup code and then continues unwinding,\
    \ although you can simulate this by catching an exception and then rethrowing\
    \ it.\n\nThese macros were quite inconvenient to use. You were required to use\
    \ `NS_VALUERETURN` or `NS_VOIDRETURN` to return from inside an `NS_DURING` block,\
    \ to make sure that you removed the cleanup code from the exception-handling stack.\n\
    \n```objc\n#define NS_DURING\n@try {\n    #define NS_HANDLER\n} @catch (NSException\
    \ *localException) {\n    #define NS_ENDHANDLER\n}\n#define NS_VALUERETURN(v,t)\
    \ return (v)\n#define NS_VOIDRETURN return\n```\n*From: NSException.h*\n\nNow,\
    \ exception-handling code looks a lot like Java or C++. There are a few restrictions.\n\
    \nThrowing objects other than `NSException` may work, but it’s unsupported. On\
    \ OS X, this is because an object thrown when compiled with the legacy runtime\
    \ may still be caught with the old `NS_HANDLER` macro, which expects an `NSException`\
    \ instance. With the GCC runtime (but not the GNUstep runtime), it is possible\
    \ to throw an instance of a class that has not been registered properly with the\
    \ runtime, causing a crash in the unwinding library. Throwing non-object types\
    \ is not supported at all.\n\nThe best way of throwing an exception is still to\
    \ send a `-raise` message to an `NSException` instance. You may also use the `@throw`\
    \ keyword to throw an arbitrary object, but don’t be too surprised if it doesn’t\
    \ work. If you are using the GNU runtime or the modern Apple runtime it probably\
    \ will work, but you’re doing something that isn’t well tested.\n\n### Using Exception\
    \ Objects\n\n```objc\n[NSException raise: NSGenericException format: @ *\"This\
    \ is an example\"* ];\n```\n*From: throwexception.m*\n\nThe `NSException` class\
    \ used to implement a stack of `longjmp()` buffers and jump to the top one on\
    \ the stack when required. Now, the unwinding is all done by the runtime and unwinding\
    \ libraries, but `NSException` is still used to encapsulate exceptions.\n\nExceptions\
    \ have three components: a name, a reason, and a user info dictionary. The name\
    \ is a unique identifier for this type of exception. This is just a string, but\
    \ it is common to use a symbolic constant, such as `NSRangeException`, so that\
    \ you can do a pointer comparison on the exception name when you catch an exception.\n\
    \nThe description is a human-readable description. This is generally only for\
    \ debugging, so localization isn’t important. It’s more important that you understand\
    \ what happened than your users do. Finally, the user info dictionary is an `NSDictionary`\
    \ containing some key-value pairs. It’s entirely up to the code throwing the exception\
    \ to decide what goes in here, although most exception-throwing methods document\
    \ what they will put in user info dictionaries.\n\nYou can use this for passing\
    \ arbitrary information up to wherever the exception is caught. Because it is\
    \ a dictionary, it’s common to use an immutable dictionary—an `NSDictionary`,\
    \ rather than an `NSMutableDictionary`—because the catching code does not expect\
    \ to be able to modify it. You will often use `+dictionaryWithValues:` constructor\
    \ to create a single-use immutable dictionary to throw, if you are attaching a\
    \ dictionary to the exception.\n\nOn recent versions of OS X, the exception object\
    \ also has some extra information that is useful for debugging. Sending it a `-callStackAddresses`\
    \ message will give you an `NSArray` containing `NSNumber`s pointing to the return\
    \ addresses of all of the functions on the stack. This is not particularly useful,\
    \ but the `-callStackSymbols` method, introduced with OS X 10.6, is. It gives\
    \ you the names of all of the functions or methods on the stack when the exception\
    \ was created.\n\nThis latter method is used by the unhandled exception handler,\
    \ which is called whenever aninding exception is not caught, to print a stack\
    \ trace before the program aborts. You may want to use the `NSSetUncaughtExceptionHandler()`\
    \ function to replace this handler with something of your own. If you have an\
    \ error reporting mechanism, then having the back trace from an unhandled exception\
    \ can be very useful.\n\n### Managing Memory with Exceptions\n\n```objc\nid pool\
    \ = [NSAutoreleasePool new];\nid array = [NSArray new];\n@try\n{\n    throw(array);\n\
    }\n@catch (id e)\n{\n    NSLog(@ *\"Caught exception %@\"* , e);\n    e = [e retain];\n\
    \    [pool drain];\n    [e autorelease];\n    pool = nil;\n    @throw;\n}\n@finally\n\
    {\n    [array release];\n    [pool drain];\n}\n```\n*From: releaseexcept.m*\n"
