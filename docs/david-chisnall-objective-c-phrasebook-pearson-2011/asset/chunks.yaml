    # CHAPTER 11: Key-Value Coding


    Having a uniform mechanism for setting and getting keys is useful, but it’s not
    particularly special. The real power of KVC comes from KVO, which lets you monitor
    keys for changes.


    The bindings mechanism uses KVC and KVO to eliminate the need for controllers
    in a lot of cases. When a view wants to modify a model, it uses `KVC`. When the
    model changes, the view gets the notification from `KVO` and updates itself to
    reflect the change. The combination of these two—closely related—technologies
    allows you to have tight connections between objects without tight coupling of
    their designs.


    Registering as a KVO observer is a lot like registering to receive notifications
    (see Chapter 16), but with a few differences. One of the most important is that
    KVO notifications are always sent to the same method. The first method in the
    sample code at the start of this section shows what this should look like.


    In this example, it’s a class method. Most of the time, you will use instance
    methods, but it’s important to remember that classes are objects in Objective-C,
    so you can use them in almost any place where you’d normally use an object.


    This implementation is quite simple; it just logs the new value for the key. The
    second method shows how to register for the notification. The change argument
    in the notification method is a dictionary, which, in this version, contains the
    new value for the key. It only contains the new value because that’s all that
    we asked for.


    ## Ensuring KVO Compliance


    The `options:` parameter in the method for adding the observer is a bitfield.
    You can request just the new value, just the old value, or both.


    You can also request notifications both before and after the change.


    This lets you easily perform tasks such as recording the changes made to an object,
    which is helpful for implementing undo support. If your model objects are KVO
    compliant, you can get notifications of every change, save the old value, and
    then revert it (using `KVC`) later.


    The logic for implementing undo like this can be completely decoupled from the
    implementation details of your model objects.


    ```objc

    [self setValue:@"42" forKey:@"aKey"];

    self.aKey = 12;

    [self willChangeValueForKey:@"aKey"];

    aKey = 47;

    [self didChangeValueForKey:@"aKey"];

    ```

    *From: kvo2.m*


    KVO, like the rest of Objective-C, is not magic.


    If you set a key using the `KVC` accessors, it’s trivial for notifications to
    be sent to observers.


    What happens if you set an instance variable directly? Unfortunately, the answer
    is quite simple: Nothing.


    Setting an instance variable directly is just a store into memory. There is no
    easy way of automatically detecting when a single value in memory has been modified.
    This means you must bracket direct accesses to instance variables with the two
    calls shown in the snippet at the start of this section.


    These will fire off the KVO notifications, if required. Note that you do not need
    to send these messages if you are calling an accessor method. This is one of the
    advantages of the late binding that you find in Objective-C.


    The code that implements KVO is quite complex and uses some of the more advanced
    features of Objective-C. When you register an observer for a key, the set method
    for that key will be replaced by a special version that will handle the notifications.


    KVO is probably the part of the Foundation framework that seems the most like
    magic. It’s worth remembering that KVO does nothing that your own code can’t.
    It does not rely on any undocumented interfaces, compiler modifications, or similar
    tricks. You can implement something equivalent in your own code if you want to.
    You can look at the GNUstep implementation to see how this might be done.


    On both GNUstep and OS X, the KVO mechanism is implemented using `isa-swizzling`.
    This is a trick where the `isa` pointer of an object is switched to point to a
    different class after the object’s creation. Typically, this trick is combined
    with run-time class creation, so you insert a new class as a leaf node of the
    class hierarchy, and make the object’s `isa` pointer point to it.


    Fortunately, the point of systems such as KVO being part of the Foundation framework
    is to free you from needing to know exactly how they work, unless you are particularly
    interested.


    There is one important side-effect of KVO (and other things) being implemented
    using `isa-swizzling`, however. It means you should not depend on an object’s
    `isa` pointer pointing to a specific class or being unmodified.


    If you want to test whether an object is an instance of a particular class, use
    `-isMemberOfClass:` or `-isKindOfClass:`. Send an object a `-class` message to
    get its class, don’t just inspect the `isa` pointer.


    # CHAPTER 12: Handling Errors


    In Java, you can defer error handling by using exceptions. Lisp and Smalltalk
    let you inspect the stack when an error occurs and dynamically fix the code that
    gave you the wrong input.


    Objective-C fits somewhere between C and Java in this respect. Some errors are
    best handled very close to their cause, whereas others can only be handled by
    reporting the cause and exiting.


    ## Exceptions


    Exception handling is quite difficult to implement. When you throw an exception,
    you need to unwind every stack frame between where it was thrown and where it
    is caught. There are a few ways of doing this. In a language with stack introspection
    like Smalltalk, it’s relatively easy. The exception can look at each stack frame
    and perform the unwinding.


    In Java and similar languages, it is commonly implemented by returning two values.
    In a typical Java VM, one register will be reserved for returning the exception
    object. After every call, the JVM will check that that register is zero, and branch
    to the exception-handling code if it isn’t.


    This is not possible in Objective-C, because you need to be able to interoperate
    with C. Some of the stack frames between where the exception is thrown and where
    it is caught might be C, and you can’t expect all C code on the system to be modified
    to return another value if an exception is thrown.


    Another option is something like Microsoft’s structured exception handling (SEH),
    where a linked list of cleanup code addresses is pushed and popped as exception-handling
    blocks are entered and left. When an exception is thrown, this stack is used to
    find the cleanup code to run and to jump to the correct location in the stack.


    This would have been an option for Objective-C, but it’s quite expensive. It requires
    you to run some code whenever you enter and exit an exception-handling block,
    then some more when you throw an exception.


    C does include a pair of calls that let you do something like stack unwinding,
    though. The `setjmp()` call stores the current CPU registers, including the stack
    and frame pointers. The `longjmp()` call reloads them. This has the effect of
    resetting the stack to the state when `setjmp()` was called. This is how Objective-C
    exceptions were traditionally implemented.


    As you can imagine, this was far from ideal. There was no support for performing
    cleanup actions in intervening stack frames. If your Objective-C code called some
    C++ code, which then called Objective-C code again, you could longjmp() over the
    C++ code, preventing it from running destructors.


    The GNU runtime got C++-compatible

