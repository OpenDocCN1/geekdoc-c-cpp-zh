  trans: "\n\n这是 OpenStep 程序员经常遇到的问题之一。例如，在 Solaris、OPENSTEP 和 Windows NT 之间迁移代码需要为每个平台更改许多硬编码的路径。\n\
    \n在 Apple 收购 NeXT 后，他们发布了新版本的 OPENSTEP，其中包含一个 `MacOS` 兼容层和一个名为 Rhapsody 的新用户界面。它使用了与\
    \ OPENSTEP 相同的 NeXT 文件系统层级，根目录下的 `/NeXT` 文件夹包含了该层级结构中非类 UNIX 的部分。\n\n通过 Rhapsody\
    \ DR2，Apple 对目录布局进行了一些重大更改，并引入了现在 OS X 用户熟悉的布局。为了方便操作，并支持 Windows 上的 YellowBox\
    \ (Cocoa)（该产品在不久后被停用），他们引入了 `NSSearchPathForDirectoriesInDomains()` 函数。\n\n该函数返回一个特定用途的目录数组。当你调用此函数时，第一个参数描述了你想要的目录类型。这可能是应用程序目录、库目录等。第二个参数是\
    \ `filesystem domain*`。\n\nOS X 与 OPENSTEP 一样，将文件系统层级划分为若干域，这些域的内容大致相同，但用途不同。这些域是有顺序的，因此你应该优先使用高优先级域中的文件。四个域如下：\n\
    \n*   **User**：该域位于用户主目录下。这里的文件对用户是私有的，并且完全由用户控制。\n*   **Local**：包含本地文件的域。在 OS\
    \ X 上，这包括 `/Library` 目录，该目录可能会被本地系统管理员修改。\n*   **Network**：在该域中看到任何内容非常罕见。你在独立机器或异构网络中的机器上不会看到它。它用于由网络管理员控制的目录。\n\
    *   **System**：最后一个域包含系统文件。通常情况下，你不应该向该域中的任何位置写入内容，尽管你可以从中读取。你所做的任何修改可能会在用户下次更新系统时被撤销。\n\
    \n并不是每个类型的目录都存在于每个域。例如，系统域中没有文档目录，如果存在那里也没有意义。\n\n最后一个参数告诉函数是否要展开路径中的波浪号（tildes）。你几乎总是会在这里传递\
    \ `YES`。\n\n`frameworkLoader.m` 示例展示了在本章中过的几个内容。此示例加载了一个命名的框架。由于框架是包（bundles），你可以使用\
    \ `NSBundle` 来加载它们。此示例首先获取系统中所有 `Library` 目录的列表。然后按顺序检查这些目录，以测试每个目录中是否存在一个名为该框架且扩展名为\
    \ `.framework` 的目录。\n\n如果存在名称正确的对象，示例程序会告诉 `NSBundle` 加载它。你可以使用这段代码在运行时延迟加载框架，而不是显式地链接到它们。\n\
    \n或者，你可以修改代码，在库目录中查找你应用程序的插件目录，在这种情况下，你应该查找 `NSApplicationSupportDirectory`。如果你以包的形式构建插件，将以完全相同的方式加载它们。\n\
    \n```objc\nNSArray *dirs =\nNSSearchPathForDirectoriesInDomains(\n    NSLibraryDirectory,\n\
    \    NSAllDomainsMask,\n    YES);\n\nfor (NSString *dir in dirs)\n{\n    NSString\
    \ *f =\n    [[[dir stringByAppendingPathComponent:@\"*Frameworks\"]\n    stringByAppendingPathComponent:framework]\n\
    \    stringByAppendingPathExtension:@\"*framework\"];\n    // 检查框架是否存在并是一个目录。\n\
    \    BOOL isDir = NO;\n    if ([fm fileExistsAtPath: f isDirectory: &isDir] &&\
    \ isDir)\n    {\n        NSBundle *bundle = [NSBundle bundleWithPath: f];\n  \
    \      if ([bundle load])\n        {\n            NSLog(@\"Loaded bundle %@\"\
    , f);\n            return YES;\n        }\n    }\n}\n```\n*来自：frameworkLoader.m*\n\
    \n## 创建线程\n\n```objc\n-(void)processInNewThread\n{\n    SEL sel = @selector(process:);\n\
    \    [NSThread detachNewThreadSelector:sel\n                             toTarget:self\n\
    \                             withObject:nil];\n}\n```\n*来自：thread.m*\n\nObjective-C\
    \ 中的线程被封装在 `NSThread` 对象中。这些对象封装了 POSIX 线程并提供了一些便利方法。从 10.5 版本开始，创建新线程有两种方法。传统的方法类似于创建\
    \ POSIX 线程的标准方式，而第二种方法旨在让 Java 程序员感到更熟悉。\n\n当你创建一个新的 POSIX 线程时，你会在新线程中调用一个带有 `void*`\
    \ 参数的函数。当你使用 `NSThread` 创建新线程时，你执行类似的操作，向一个对象发送消息，并将另一个对象作为参数。\n\n更像 Java 的创建新线程的方法是派生\
    \ `NSThread` 子类并重写 `main` 方法。你可以创建线程的实例并向它发送 `-start` 消息来启动。\n\n```objc\ndouble\
    \ oldPriority = [NSThread threadPriority];\n[NSThread setPriority:0];\n[[NSThread\
    \ mainThread] setPriority:1];\n```\n*来自：threadPriority.m*\n\n`NSThread` 实现了作为类方法和实例方法的\
    \ `threadPriority` 和 `setPriority` 方法。当发送给类时，它们控制当前线程的优先级。当发送给实例时，它们控制由该对象封装的线程的优先级。\n\
    \n线程的优先级决定了它将获得多少 CPU 时间以及在访问 CPU 之间需要等待多久。通过用于控制线程优先级的低级 POSIX API，你还可以设置调度策略。执行这些操作的函数都是\
    \ POSIX 实时扩展的一部分，该扩展还提供了信号队列等功能。这些功能尚未通过 Objective-C API 暴露。\n\n使用此 API 设置的优先级是\
    \ 0 到 1 之间的双精度浮点值。这些值将被缩放为调度器理解的某些整数范围，因此你应该记住微小的差异会被舍入。\n\nPOSIX 规范为线程定义了两种*竞争范围*（contention\
    \ scopes）。线程的优先级定义了是否允许其获得 CPU 时间的基础值，该值根据它已经拥有了多少以及距离上次拥有多久进行缩放。竞争范围决定了哪些线程竞争\
    \ CPU 时间。在系统竞争范围范围内，线程与系统中的所有其他线程竞争。在进程竞争范围范围内，它仅与同一进程的线程竞争。\n\nOS X 仅实现了系统范围，这意味着高优先级线程会抢夺其他进程中线程的处理器。\n\
    \n"
- fmt: "\nprocesses at a lower priority. If you set a thread priority greater than\
    \ 0.5, remember that this can have an adverse affect on the rest of the system.\n\
    \nThis still won’t cause complete starvation. With OS X 10.6, the highest thread\
    \ priority gives a little bit more than double the amount of CPU time that the\
    \ lowest priority is awarded, in purely CPU-bound tasks. Most tasks will involve\
    \ some time waiting for data from the disk.\n\nThreads in a blocking state do\
    \ not consume any CPU time irrespective of their priority.\n\nThe scheduling policy\
    \ on OS X contradicts the traditional UNIX model, where only the superuser can\
    \ raise the priority of a process.\n\nSomewhat interestingly, the thread priority\
    \ on recent versions of OS X actually has a greater impact on the amount of CPU\
    \ time a thread gets than the priority of the process that owns it. This means\
    \ that, although you cannot raise the process’s priority, you can achieve the\
    \ same effect by raising the priority of all of the threads in your process.\n\
    \nThe original design to prevent normal users from increasing process priority\
    \ was to prevent one user from getting an unfair amount of CPU time.\n\nOS X systems\
    \ tend to be single-user machines, so this is less of an issue, but you can still\
    \ take processor time away from more important tasks owned by the same user. A\
    \ live video capture, for example, is performance sensitive and the user would\
    \ probably be very irritated if your program decided to set its priority high\
    \ enough to cause the capturing application to drop frames.\n\nBe considerate\
    \ when setting thread priorities. In general, you should only use the range between\
    \ 0 and 0.5. Only set a thread above the default level if you have absolutely\
    \ no other option.\n\nDon’t do it just because you are doing something CPU-bound\
    \ and you want it to be fast.\n\n## Synchronizing Threads\n\n```objc\nstatic NSLock\
    \ *lock;\nstatic NSMutableArray *messages;\n\nvoid recordLogMessage(NSString *msg)\n\
    {\n    [lock lock];\n    @try\n    {\n        [messages addObject: msg];\n   \
    \     NSLog(@ *\"%@\"*, msg);\n    }\n    @finally\n    {\n        [lock unlock];\n\
    \    }\n}\n```\n*From: lock.m*\n\nYou can synchronize two threads in several ways.\
    \ The classes that perform this kind of synchronization all conform to the `NSLocking`\
    \ protocol. This defines two methods: `-lock` and `-unlock`.\n\nThe simplest lock\
    \ class is `NSLock`, which implements a `mutual exclusion lock (mutex)`. One thread\
    \ can lock this at a time, so sending it a `-lock` message will cause any other\
    \ thread that sends the same object a `-lock` message to block until you send\
    \ a corresponding `-unlock` message.\n\nThis is useful for protecting critical\
    \ sections that are short. For longer critical sections, `NSRecursiveLock` is\
    \ often more useful. If you send two `-lock` messages to an `NSLock` in the same\
    \ thread, you have a deadlock. You can send as many `-lock` messages as you want\
    \ to an `NSRecursiveLock` as long as you send the same number of `-unlock` messages.\
    \ This is useful in methods that may be called from code that has already acquired\
    \ the lock, as well as from code that hasn’t.\n\nThe problem with these classes,\
    \ traditionally, is that they didn’t integrate well with exception handling. If\
    \ you acquired a lock and then called something that threw an exception, you would\
    \ have problems. The lock would never be released.\n\nWhen Apple introduced the\
    \ new exception-handling keywords, they also introduced `@synchronized`. This\
    \ will lock on an arbitrary object and make sure that the lock is released if\
    \ an exception is thrown.\n\nGenerally speaking, it is a bad idea to use this\
    \ keyword. Although it makes life a little easier, and is familiar to Java programmers,\
    \ the implementation is very inefficient. It needs to associate a lock with the\
    \ object, and it always uses a recursive lock even when this isn’t ideal.\n\n\
    You can achieve the same effect by making sure that you send the `-unlock` message\
    \ in an `@finally` block. You can avoid the `@try` and `@finally` block if you\
    \ are sure that none of the called methods or functions will throw an exception,\
    \ but with the GNU and Modern Apple runtimes they don’t have any run-time penalty.\n\
    \n## Storing Thread-Specific Data\n\n```objc\nNSMutableDictionary *threadDict\
    \ = [[NSThread currentThread] threadDictionary];\n[threadDict setObject: @ *\"\
    default\"* forKey: @ *\"NewKey\"* ];\n```\n*From: threadDict.m*\n\nOnce you have\
    \ threads, you often want to store some data privately to the thread. An example\
    \ of this in Cocoa is the current graphics context, which must be available to\
    \ any code that is drawing, but must not be shared between threads.\n\nTypically,\
    \ you implement this using the `pthread_set_specific()` function, which stores\
    \ a pointer associated with the current thread. This is commonly implemented by\
    \ storing the address of a region of memory in a register and using a fixed offset\
    \ from the start of that region for each bit of thread-specific data. That means\
    \ you need to have space for every thread-local pointer in every thread, even\
    \ if you only set one of them to something other than NULL.\n\nIf Cocoa stored\
    \ the graphics context like this, every single thread would require one word of\
    \ space, even though most programs only need a valid graphics context in one,\
    \ or possibly two, threads.\n\nThe solution to this is the thread dictionary.\
    \ This is a mutable dictionary associated with the thread. You only need one word\
    \ per thread to store this, but you can store as many objects in it as you want.\
    \ The thread dictionary is accessed by sending `-threadDictionary` message to\
    \ the current thread. When the thread exits, the dictionary is destroyed. Because\
    \ dictionaries retain their arguments, this means that any objects only referenced\
    \ from the thread will be freed, after destructors run. Threads will post `NSThreadWillExitNotification`\
    \ before they exit, so you can just observe this if you want to run some cleanup\
    \ code.\n\n**Note:**\nOn most platforms, you can use the `__thread` keyword, a\
    \ GCC extension that stores variables in thread-local storage. Darwin loader does\
    \ not support thread-local sections, so this is not possible on OS X. This will\
    \ probably change soon, as similar functionality is in the next versions of both\
    \ the C and C++ standards.\n\nThe thread dictionary provides a good way of passing\
    \ parameters between nested stack frames. Sometimes you want to set some semi-global\
    \ state that will persist for the duration of a method and be accessible from\
    \ all methods inside that scope. The classical Cocoa example is the graphics context\
    \ object, which is set at the root of the view hierarchy and then modified and\
    \ used by nested calls. In LanguageKit, I use the same pattern to allow AST nodes\
    \ to access the compiler object. In both cases, the lack of tight coupling means\
    \ that the same method—on the same object—can be called in two threads, with different\
    \ contexts.\n\n## Waiting for a Condition\n\n```objc\n- (**void**)addToQueue\n\
    {\n    [condition lock];\n    queueSize++;\n    [condition signal];\n    [condition\
    \ unlock];\n}\n\n- (**void**)main\n{\n    **while** (1)\n    {\n        **id**\
    \ pool = [NSAutleasePool new];\n        [condition lock];\n        **while** (queueSize\
    \ == 0)\n        {\n            [condition wait];\n        }\n        queueSize--;\n\
    \        [condition unlock];\n        NSLog(@ *\"Processed data from queue\"*\
    \ );\n        [pool release];\n    }\n}\n```\n*From: condition.m*\n\nQuite often,\
    \ you want to have one thread sleep and wake up when another thread does something.\
    \ The POSIX thread API provides *condition variables* for this. A condition variable\
    \ is paired with a mutex.\n"
