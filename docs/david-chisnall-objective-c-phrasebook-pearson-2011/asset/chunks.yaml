  trans: "\n与类的布局相同，但你不能在类和结构之间互换使用。\n\n对象和结构之间的区别在于，你可以向类发送消息。这是因为结构中的第一个实例变量是指向类结构的指针。按照惯例，这个实例变量被称为\
    \ `isa`，就像“这个对象是一个 . . .”（this object is a. . .）。如果你定义了一个新的根类，必须记住添加这个实例变量。\n\n\
    与 `self` 和 `_cmd` 隐藏参数一样，`isa` 指针只是另一个实例变量；它不是关键字。将此与 C++ 中调用虚拟方法进行对比。一个具有虚拟方法的\
    \ C++ 对象包含一个指向 `vtable`（虚函数表）的（隐藏）指针。这是一个函数指针的数组。当你调用该方法时，编译器会引用 `vtable` 指针并在正确的偏移量处调用函数。\n\
    \n你无法使用 `vtable` 来获取关于对象的任何信息，而且它的布局是目标平台 ABI 定义的一部分，而不是语言的一部分。`isa` 指针则完全不同。它是一个显式的实例变量，因此像像其他实例变量一样被访问。它指向一个\
    \ `Class`，该 `Class` 是由 Objective-C 运行时头文件提供的 `typedef`，并根据运行时定义为不透明类型或指向公共 C 结构的指针。\n\
    \n如果未提供定义，`Clang` 将其视为内置类型。\n\n## 理解 isa 指针\n\n在类结构精确布局为私有的运行时中，你仍然可以找到用于检查它的函数。这些函数可以告诉你实例变量的偏移量、方法和属性的名称及类型签名、父类等。\n\
    \n你可以查看其他对象上的 `isa` 指针。`id` 类型被定义为 C 结构（无访问控制），其中仅包含指向类的指针，因此你可以像读取结构中的任何其他字段一样读取它。强烈不建议这样做。\n\
    \nObjective-C 对象可能会转发消息，你持有的对象指针可能是一个代理（proxy）。如果你想获取另一个对象的类，应该向它发送 `-class` 消息。这种方法速度较慢，但在存在代理时它不会断开。\n\
    \n你可以通过向对象发送 `-isProxy` 消息来测试该对象是否为代理，但如果你反正要发送一条消息了，不如直接发送一条消息来获取类。\n\n## 第 2\
    \ 章：Objective-C 入门\n\n### 类初始化\n\n```objc\n@implementation Init\n\n+ (**void**)load\n\
    {\n    NSLog(@\"+load called\"* );\n}\n\n+ (**void**)initialize\n{\n    NSLog(@\"\
    +initialize called\"* );\n}\n\n- (**id**)init\n{\n    NSLog(@\"-init called\"\
    * );\n    return self;\n}\n\n@end\n\nint main(**void**)\n{\n    [NSAutoreleasePool\
    \ new];\n    NSLog(@ *\"main() entered\"* );\n    id init = [[Init alloc] init];\n\
    \    init = [[Init alloc] init];\n    return 0;\n}\n```\n*来自：classInit.m* 在 C++\
    \ 中，你可以通过将赋值赋值给全局或静态变量来执行静态初始化。在 C 中，你可以使用扩展，例如 GCC 的 `__attribute__((constructor))`\
    \ 来相同的结果。这两者都会导致特定的函数在 `main()` 函数之前被调用。很难正确使用这些特性。它们的调用顺序是未定义的。Objective-C 有等效的方法。当类在运行时注册时，类的\
    \ `+load` 方法会被调用，且在 `main()` 函数之前。\n\n从此方法发送任意消息是不安全的。类本身、其所有父类以及常量字符串类都保证已加载。其他类可能已经加载，但无法保证，即使它对你有效，如果加载顺序发生微变化，它也可能失效。\n\
    \n更安全的替代方案是 `+initialize` 方法。在向类发送第一条消息时由运行时自动调用。通常，第一条消息可能是类似 `+alloc` 的用于创建类实例，但它也可能是请求类名或单例实例的消息。\n\
    \n`+initialize` 方法允许你对类所需的项进行懒初始化。它不会在 `main()` 函数之前被调用，因此所有内容都已加载，进程处于一个定义良好的状态。\n\
    \n如果你实现了这两个方法，你可以看到执行顺序。首先，在类一加载时就会调用 `+load` 方法。当运行时加载器完成后，它会调用 `main()` 函数。当你向类发送消息时，会调用\
    \ `+initialize` 方法，然后是你实际调的方法，最后你可以向返回的实例发送 `-init` 消息。\n\n```\na.out[2690:903]\
    \ +load called\na.out[2690:903] main() entered\na.out[2690:903] +initialize called\n\
    a.out[2690:903] -init called\n```\n*输出自 classInit.m* 注意，`+initialize` 方法只被调用一次。当你第二次向类发送消息时，它将直接被传递。该调用是线程安全的。如果你从不同的线程向同一个类发送消息，其中一个将阻塞，直到另一个完成。\n\
    \n## 读取类型编码（Type Encodings）\n\n```objc\ntypedef struct _s {\n    int i;\n    float\
    \ f;\n    NSArray *a;\n    char *str;\n    unsigned short shorts[5];\n} s;\n\n\
    int main(**void**)\n{\n    const char *encoding = @encode(s);\n    printf(\"Encoding:\
    \ %s\\n\", encoding);\n    return 0;\n}\n```\n*来自：type.m* Objective-C 的大部分依赖于运行时内省。Objective-C\
    \ 对象可以通过消息进行内省，但 C 类型并非如此。为了这一点，Objective-C 定义了一种将 C 类型编码为字符串的方法。每个基本类型都编码为单个字符。例如，`int`\
    \ 编码为 `\"i\"`，而 `unsigned long long` 编码为 `\"Q\"`。大写字母表示无符号、小写字母表示符号的约定适用于所有整数。这些类型编码可以包含任意复杂的\
    \ C 类型，正如 type.m 示例的输出所示。\n\n```\nEncoding: {_s=if@*[5S]}\n```\n*输出自 type.m* 示例给出了包含基本\
    \ C 类型、对象和 C 数组的结构类型编码。类型编码是由编译器响应 `@encode()` 指令生成的，其用法与 `sizeof()` 类似，接收类型作为参数并返回类型编码。结构本身由一对括号表示。内部是结构的名称，后面跟着等号，以及每个元素的类型编码。接下来的四个字符显示前四个字段的类型编码。这里要注意两点：第一，Objective-C\
    \ 对象都编码为 `\"@\"`，无论其静态类型信息如何。第二，`char*` 被编码为 `*`。所有其他指针都编码为 `^` 后跟指向类型，但 C 字符串有特殊处理。编码的剩余部分是数组。它位于方括号中，元素数量后跟着单个元素的类型。\n"
- fmt: "\nSelectors are the names used to look up methods in a message send. In GNU\
    \ Objective-C, they also include the encoding of the argument types of the message.\
    \ This allows functions to check that they were called with the right argument\
    \ types, which is very useful for distributed objects and a few other things.\n\
    \nmethod or an instance variable, you will get the type encoding. This is very\
    \ useful. In the `EtoileSerialize` framework, I use this information to iterate\
    \ over the type encodings of instance variables and automatically serialize them.\n\
    \n# CHAPTER 2: An Objective-C Primer\n\n## Using Closures\n\n```objc\nint(^getCounter)(void)(void)\n\
    {\n    __block int counter;\n    int(^block)(void) = ^(void) { return counter++;\
    \ };\n    return _Block_copy(block);\n}\n\nint main(void)\n{\n    int(^block)(void)\
    \ = getCounter();\n    block(); block();\n    NSCAssert(block() == 2, @\"Block\
    \ counted incorrectly\");\n    int(^block2)(void) = getCounter();\n    block2();\
    \ block2();\n    NSCAssert(block2() == 2, @\"Block didn’t start from 0\");\n \
    \   return 0;\n}\n```\n*From: block.m*\n\nWith 10.6, Apple introduced *blocks*\
    \ to the C language. Although these are a C language extension, they are most\
    \ often used in conjunction with Objective-C.\n\nBlocks are *closures*. The name\
    \ comes from Smalltalk, where the `BlockClosure` class encapsulates closures.\
    \ The syntax for creating blocks is quite ugly. It is based on the C syntax for\
    \ function pointers, but with a caret replacing the asterisk.\n\nBlocks can be\
    \ used almost exactly like function pointers. You can call them just like functions,\
    \ but you can’t cast them to function pointers because they have a different calling\
    \ convention.\n\nJust like methods, a block has a hidden argument.\n\nIn the example,\
    \ the `getCounter()` function returns a new block that implements a counter.\n\
    \nEvery time you call this block, it returns a value one greater than the last\
    \ time you called it. This works because the `counter` variable in the scope where\
    \ the block was created is declared with the `__block` specifier.\n\nAny variables\
    \ on the stack that blocks reference will be copied to the heap and reference\
    \ counted.\n\nWhen you call `_Block_copy()`, the block itself is copied to the\
    \ heap if it’s on the stack, or has its reference count incremented if it is not.\n\
    \nEach block returned by the `getCounter()` function in the example has a copy\
    \ of the `counter` variable, because it is an automatic (stack) variable, and\
    \ so subsequent calls to the function are creating a new version.\n\nIn the latest\
    \ version of the `Foundation` framework, you will find a lot of methods that take\
    \ blocks as arguments. You can, for example, iterate over an array with a block\
    \ as an argument.\n\nBlocks don’t add any expressiveness to the C language. A\
    \ block is just a function pointer and a data pointer hidden inside a single structure,\
    \ with some extra logic in the compiler to insert the data pointer as a hidden\
    \ argument to the function when it is called.\n\nThis doesn’t mean that blocks\
    \ are not useful. After all, the same is true of Objective-C; it doesn’t let you\
    \ do anything that you can’t do in C, it just adds some syntactic sugar that makes\
    \ some things easier.\n\nLike Objective-C objects, blocks have an `isa` pointer\
    \ and can be sent messages. They are instances of the `NSBlock` private abstract\
    \ class, which implements the `NSCopying` protocol.\n\nMost of the object-like\
    \ behavior of blocks is undocumented. You can store them in Objective-C collections,\
    \ but don’t depend on their ability to understand any specific messages. With\
    \ the latest versions of `Clang`, blocks also support introspection, exposing\
    \ their types as Objective-C type encodings.\n\nWe’ll look at blocks in more detail\
    \ in Chapter 15.\n\n# CHAPTER 3: Memory Management\n\n## Retaining and Releasing\n\
    \n```objc\nNSArray *anArray = [NSArray array];\nanArray = [[NSArray alloc] init];\n\
    [anArray release];\n```\n*From: retainRelease.m*\n\nEvery object that inherits\
    \ from `NSObject` has a reference count associated with it. When this reference\
    \ count reaches 0, it is destroyed. An object created with `+alloc` or any of\
    \ the related methods, such as `+new` or `+allocWithZone:`, begins life with a\
    \ reference count of one.\n\nTo control the reference count of an object, you\
    \ send it `-retain` and `-release` messages. As their names would imply, you should\
    \ use these messages when you want to retain a reference to an object, or when\
    \ you want to release an existing reference. The `-retain` message increments\
    \ the object’s reference count, and the `-release` message decrements it.\n\n\
    You can also send a `-retainCount` message to an object to determine its current\
    \ reference count. It’s tempting to use this for optimization and invoke some\
    \ special cases when you are sure there is only one reference to an object. This\
    \ is a very bad idea. As the name implies, this method tells you the number of\
    \ retained references to the object, not the number of references. It is common\
    \ not to bother sending a `-retain` message to objects when you create a pointer\
    \ to them.\n\n### Assigning to Instance Variables\n\n```objc\n- (void)setStringValue:(NSString*)aString\n\
    {\n    id tmp = [aString retain];\n    string = tmp;\n}\n```\n*From: ivar.m*\n\
    \nThere are a few things that you have to be careful about when using reference\
    \ counting in this way. Consider the following simple set method:\n\n```objc\n\
    - (void)setStringValue:(NSString*)aString\n{\n    [string release];\n    string\
    \ = [aString retain];\n}\n```\n*From: ivar.m*\n\nThis looks sensible. You release\
    \ the old value, then retain the new value and assign it. Most of the time, this\
    \ will work, but in a few cases it won’t, and that can be confusing to debug.\
    \ What happens if the value of `aString` and `string` are the same? In this case,\
    \ you are sending the same object a `-release` message then a `-retain` message.\
    \ If some other code holds references to this object, it will still work, but\
    \ if not then the first message will cause the object to be destroyed and the\
    \ second will be sent to a dangling pointer.\n\nA more correct implementation\
    \ of this method would retain the new object first, as shown at the start of this\
    \ section. Note that you should assign the result of the `-retain` message because\
    \ some objects will return another object when you retain them. This is very rare,\
    \ but it does happen on occasion.\n\nFinally, this method is not thread-safe.\
    \ If you want a thread-safe set method, you need to retain the new value, perform\
    \ an atomic exchange operation on the result and the instance variable, and release\
    \ release the old value.\n\nIn general, however, it is almost impossible to reason\
    \ about code that supports this kind of fine-grained concurrency, and the amount\
    \ of cache churn it causes will offset any performance gains from parallelism,\
    \ so it’s a terrible idea. If you really need it, it’s better to use declared\
    \ properties to synthesize the accessor than try to write it yourself.\n\n## Avoiding\
    \ Retain Cycles\n\n```objc\n- (void)setDelegate:(id)aDelegate\n{\n    delegate\
    \ = aDelegate;\n}\n```\n*From: ivar.m*\n\nThe problem with pure reference counting\
    \ is that it doesn’t detect cycles. If you have two objects that retain references\
    \ to each other, then neither will ever be freed. In general, this is not a major\
    \ problem.\n\nObjective-C data structures tend to be acyclic, but there are some\
    \ common cases where cycles are inevitable. The most common is the *delegation\
    \ pattern*. In this pattern, an object typically implements some mechanisms and\
    \ delegates policy to another object. Most of AppKit works in this way.\n"
