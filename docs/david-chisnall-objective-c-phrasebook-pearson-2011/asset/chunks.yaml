    The NSTimer class encapsulates an event source that generates events at a specific
    time. This is similar in principle to the alarm() system call,


    **Receiving Timer Events** 167


    although you can have several timers scheduled at once.


    You will almost always construct timers using the method from the example at the
    start of this section. This method will create and schedule a new timer in the
    same operation.


    When the time interval elapses, the timer will fire. It will then send a message
    to an object.


    The simplest way of defining this message is by passing a selector, a target,
    and a dictionary when you create the timer. The selector must be for a method
    that takes one argument: an NSTimer instance. You can retrieve the dictionary
    by sending a -userInfo message to the timer.


    There is another constructor that takes an NSInvocation as the argument. This
    is more difficult to use, but is more powerful because it allows any message with
    any arguments to be used.


    The timer object will be autoreleased when you create it like this, but it will
    be retained by the *run loop* object. You can only use timers when you are using
    NSRunLoop. The run loop object sits waiting for events from the kernel—


    for example, timers or data becoming available on file descriptors—and then sends
    messages in response to these events.


    If you are using AppKit or UIKit, you will be using a run loop automatically.
    The NSApplication and UIApplication classes both


    168


    CHAPTER 8: **Dates and Times**


    create a run loop instance internally. These classes register with the run loop
    to receive notifications of user interface events from the display server and
    then pass them on to windows and so on.


    If you are writing a command-line application or a server, you can still use NSRunLoop.
    It is part of the Foundation framework, but you must create it manually and tell
    it to run. This is very simple, and is done in the last line of the -start method
    in the preceding example.


