  trans: "\n\n# 通知 (Notifications)\n\n此扩展需要进行一些更改。普通的通知关联有一个发送者（sender），它是一个指向某些对象的指针。在具有另一个地址空间的进程中，指向对象的指针并不特别有用，因此分布式通知使用字符串作为发送者。这可以是你喜欢的任何内容，但通常是应用程序名称。\n\
    \n通知可以关联字典。在应用程序内部，这些字典可以包含任何对象，但在广播时，它们被限制为可以存储在*属性列表*（property lists）中的对象（见第\
    \ 9 章）。\n\n**注意：**\n\n在 OS X 上，只有一种类型的分布式通知中心，将通知发送给与发送者具有相同用户 ID 的运行应用程序。GNUstep\
    \ 提供了另外两种：一个用于与计算机上所有应用程序通信（无论用户是谁），另一个用于在局域网内广播通知。\n\n分布式通知的递送语义也有些不同。当你发布一个（普通）通知时，它是同步交付的。发送对象已经拥有了\
    \ CPU 的控制权。其方法的栈帧位于栈的顶端，它可以自由地将程序流委托给通知中心，然后由通知中心将其委托给通知监听器。\n\n对于分布式通知，情况并非如此。你不能在中途中断另一个进程正在执行的操作，因此你必须等待到一个合适的点。\n\
    \n分布式通知通过与运行循环（run loop）交互来处理这个问题。要接收分布式通知，你必须使用 `NSRunLoop`。`distributedNotify.m`\
    \ 示例是一个简单的程序，每当它的新实例启动时，就会写入一条日志消息。\n\n该类的 `-init` 方法完成了所有的实际工作。首先，它为分布式通知注册了一个观察者。该对象为\
    \ `nil`，因此它将从任何发送者接收此通知。然后它构建通知。用户信息 字典包含一个键值对，用于存储进程 ID。\n\n发布通知后，它启动了运行循环。程序将处于阻塞状态，直到某些运行循环事件发生。此程序中只有一个事件定义了处理器，因此它所能做的仅仅是（嗯，你可以这样做；信号正是这样做的，但你从信号处理程序中可以做的事情是非常有限的）。\n\
    \n## 在应用程序之间发送通知\n\n```objc\n- (id)init\n{\n    NSDistributedNotificationCenter\
    \ *c = [NSDistributedNotificationCenter defaultCenter];\n    [c addObserver:self\n\
    \             selector:@selector(newCopyStarted:)\n                 name:ProcessDidStart\n\
    \               object:nil\n    suspensionBehavior:NSNotificationSuspensionBehaviorHold];\n\
    \    NSProcessInfo *pinfo = [NSProcessInfo processInfo];\n    NSNumber *pid =\
    \ [NSNumber numberWithInt:[pinfo processIdentifier]];\n    NSDictionary *userInfo\
    \ = [NSDictionary dictionaryWithObject:pid\n                                 key:@\"\
    pid\"];\n    [c postNotificationName:ProcessDidStart\n                       \
    \   object:[pinfo processName]\n                       userInfo:userInfo\n   \
    \                      options:0];\n    [[NSRunLoop currentRunLoop] run];\n}\n\
    ```\n*来自：`distributedNotify.m`*\n\n每当发布 `ProcessDidStart` 通知时，就会接收到 `-newCopyStarted:`\
    \ 消息，这只会在运行此程序的另一个副本时发生。\n\n如果你编译并运行此示例，你会发现它收到了它自己的通知，因此它会告诉你它已经启动。如果你运行另一个副本，你将从每个运行的实例收到一条日志消息，告诉你关于那个新实例的信息。\n\
    \n这是一个非常基础的示例，但很容易使用分布式通知来处理更复杂的事件。例如，我在 XMPPKit 中使用它们，在用户更改在线状态时通知所有运行中的应用程序。其他程序监听此变化，并将新的状态消息推送到微博客站点。\n\
    \n# 网络访问 (Network Access)\n\n## 封装 C 语言 Sockets\n\n```objc\nreturn [[[NSFileHandle\
    \ alloc] initWithFileDescriptor:s closeOnDealloc:YES] autorelease];\n```\n*来自：`NSFileHandle+Socket.m`*\n\
    \n我们在第 13 章中简要查看了 `NSFileHandle` 类，我提到过它封装了一个文件描述符。socket API 是基于 UNIX 的“万物皆文件（即使在不合逻辑时也是如此）”模型设计的，因此\
    \ socket 也是文件描述符。你可以对读取和写入 socket 使用与对任何其他文件描述符使用时相同的函数调用。\n\n你你也可以使用 `NSFileHandle`\
    \ 来封装 socket。这允许你使用低级 API 按照你的精确规格创建 socket，然后使用更抽象的方式与创建的 socket 交互。如果你需要使用低级\
    \ socket API 中任何高层 API 无法方便暴露的部分，那么这是你可以使用的唯一解决方案。在其他情况下，它通常是最方便的。\n\n将你的 socket\
    \ 封装在文件描述符对象中最大的优势是你可以轻松地将其与运行循环集成。这让你能够很容易地编写事件驱动的 socket 代码。\n\n**注意：**\n\n\
    记住，Objective-C 的目标是让 C 语言程序员的生活更轻松。不要为了使用而使用 Objective-C API，只有当它们比 C API 在解决你的特定问题时更有意义时才使用它们。使用仅仅是\
    \ C API 简易封装的 Objective-C API 会增加开销和复杂性，但不会让你的代码更易于维护。如果你在创建 `NSFileHandle` 时将\
    \ `YES` 作为 `closeOnDealloc:` 参数传递，那么当对象被释放时，文件描述符将被关闭。\n\n如果你向你的对象发送一个 `-waitForDataInBackgroundAndNotify`\
    \ 消息，它会被添加到运行循环轮询的文件描述符列表中。在下一次运行循环迭代中，如果有数据在等待，`NSFileHandle` 对象将发布一个通知。如果你为此通知注册了处理器，你就可以读取新数据。\n\
    \n该方法的文档具有某种误导性。它声称该方法将创建另一个线程。事实上，在 OS X 上，运行循环使用 `kqueue()` API，而 GNUstep 可能使用\
    \ `poll()` 或 `select()`。在 OS X 10.6 上，这是使用 *Grand Central Dispatch*（并发调度）来实现发布通知的，但核心功能是相同的。\n\
    \n最后一个优势是你不再需要考虑缓冲区（buffer）了。当你从 socket 读取数据时，你通常需要分配缓冲区并将其指针传递给 `read()` 或 `recv()`\
    \ 系统调用。通过文件描述符对象，你读取的是 `NSData` 实例。如果你编写大量的字符串，你可能考虑为 `NSFileHandle` 添加一个分类，提供\
    \ `-writeUTF8String:` 和 `-readUTF8String` 方法，或者你的协议使用的编码的等效方法，以便能够直接获取和发送字符串。\n\
    \n## 连接服务器 (Connecting to Servers)\n\n```objc\nNSInputStream *in;\nNSOutputStream\
    \ *out;\nNSHost *host = [NSHost hostWithName:@\"example.com\"];\n[NSStream getStreamsToHost:host\
    \ port:80 inputStream:&in outputStream:&out];\n[in open];\n```\n*来自：`nsstream.m`*\n\
    \n"
- fmt: "\nObjective-C provides a set of Java-like stream classes for network communication,\
    \ as well as the low-level UNIX interfaces. Unfortunately, the stream versions\
    \ are not particularly useful. They don’t provide a clean way of adding filters\
    \ like compression or of negotiating encryption in the middle of a connection,\
    \ which a lot of modern protocols require.\n\nThe most distressing limitation,\
    \ however, is that they don’t make it easy to support SRV records. These are DNS\
    \ records that advertise a service to port mapping, as well as a hostname to IP\
    \ address mapping. They are used by DNS-SD, but the IP address shortage makes\
    \ them increasingly common in hierarchical DNS on the public Internet.\n\nIf you\
    \ look up a server address on OS X using the POSIX `getaddrinfo()` function, then\
    \ you provide a host name and service name. The system then maps these to network\
    \ addresses and port numbers on any of the supported protocols.\n\nWhen you construct\
    \ an `NSStream`, you must specify the port number as an integer. This means that\
    \ it will fail on any service that uses DNS SRV records. If you use `getaddrinfo()`\
    \ and then wrap the resulting socket in an `NSFileHandle`, however, it will work\
    \ correctly.\n\nIn EtoileFoundation, we provide a category on `NSFileHandle` that\
    \ allows you to create file handles directly from a host name and protocol name,\
    \ wrapping this call.\n\n```c\nhints.ai_family = PF_UNSPEC;\nhints.ai_socktype\
    \ = SOCK_STREAM;\n// Ask for a stream address.\nerror = getaddrinfo(server, service,\
    \ &hints, & res0);\nif (error) { return nil; }\n\nint s = -1;\nfor (struct addrinfo\
    \ *res = res0; res != NULL && s < 0; res = res->ai_next)\n{\n    s = socket(res->ai_family,\
    \ res->ai_socktype, res->ai_protocol);\n    // If the socket failed, try the next\
    \ address\n    if (s < 0) { continue; }\n\n    // If the connection failed, try\
    \ the next address\n    if (connect(s, res->ai_addr, res->ai_addrlen) < 0)\n \
    \   {\n        close(s);\n        s = -1;\n        continue;\n    }\n}\nfreeaddrinfo(res0);\n\
    ```\n*From NSFileHandle+Socket.m*\n\nThis category is shown in the `NSFileHandle+Socket.m`\
