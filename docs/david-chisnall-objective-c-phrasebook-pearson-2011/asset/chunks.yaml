    \ solutions, both involving autorelease pools. One is to autorelease the old value\
    \ when you set the new one. The other is the definition of the `stringValue` method\
    \ from the start of this section.\n\nThis ensures that the string will not accidentally\
    \ destroyed as a result of anything sent to the object. Another common idiom is\
    \ to substitute `-copy` for `-retain`. If it’s mutable, `-copy` will be equivalent\
    \ to `-retain`.\n\n## Supporting Automatic Garbage Collection\n\nStarting with\
    \ OS X 10.5, Apple introduced automatic garbage collection to Objective-C. This\
    \ can make life easier for programmers, but in most cases it comes with a performance\
    \ penalty. Apple’s collector uses a lot of memory to track live references and\
    \ therefore is not available on the iPhone. It is also not supported with older\
