    \n`Foundation` 框架包含一个名为 `NSCopyObject()` 的函数。逻辑上你可能会认为它会拷贝一个对象，你几乎是对的。它创建一个与原始对象相同类的新对象，然后使用类似\
    \ `memcpy()` 的方法将实例变量拷贝过去。\n\n对于实例变量仅包含基础 C 类型的对象，这种方法运行良好，但对于其他对象效果并不佳。对象指针在拷贝时需要向它们发送\
    \ `-retain` 消息。\n\nC 指针可能需要对其进行一些其他处理，特别是当它们是从某个其他库返回的不透明类型时。\n\n在没有关于对象之间具体关系信息的情况下，`copy`\
    \ 函数无法自动创建真正的拷贝。某些\n\n# 拷贝对象\n\n79\n\n对象甚至不应该支持拷贝。例如，你期望一个封装了套接字（socket）的对象的拷贝语义是什么？你会得到两个封装了同一个套接字的对象吗？\n\
    \n唯一真正知道如何拷贝对象的是对象本身。如果该对象实现了 `NSCopying` 协议，你可以向它发送 `-copyWithZone:` 消息来获取拷贝。该方法接受\
    \ `NSZone` 作为参数。\n\n如今大多数代码并不会使用 `NSZone`。`NSObject` 提供了一个 `-copy` 方法，它只是以默认区域作为参数调用\
    \ `-copyWithZone:`。尽管你可能总是调用 `-copy`，但你应该实现\n\n`-copyWithZone:`。\n\n该方法通常开始于向接收者的\
    \ `isa` 指针发送 `+allocWithZone:` 消息，这会创建一个新实例。它可能会调用初始化方法，也可能自己填充实例变量。\n\n# 注意：\n\
    \n如果你继承自一个实现了 `NSCopying` 协议的父类，那么在你的 `-copyWithZone:` 实现中，你应该向 `super` 发送 `-copyWithZone:`\
    \ 消息，然后只拷贝子类添加的实例变量。\n\n由 `-copy`（或 `-copyWithZone:`）返回的对象，处理方式应该与由 `+alloc`（或\
    \ `+allocWithZone:`）返回的对象相同。它的初始引用计数为 1，因此你必须记住在某处向它发送 `-release` 或 `-autorelease`\
    \ 消息，以避免内存泄漏。\n\n# 归档对象\n\n55\n\n```\nvoid roundTripWithArchiver(id object, Class\
    \ coder, Class decoder)\n{\n    NSData *data = [coder archivedDataWithRootObject:\
    \ object];\n    id copy = [decoder unarchiveObjectWithData: data];\n    NSCAssert(data,\
    \ @\"Archiving failed\");\n    NSCAssert(copy, @\"Unarchiving failed\");\n   \
    \ NSCAssert([object integer] == [copy integer]), @\"Integer wasn’t copied correctly\"\
    );\n    NSCAssert([[object string] isEqual: [copy string]], @\"String wasn’t copied\
    \ correctly\");\n}\n```\n\n*From: archive.m*\n\n通常，你可能程序状态的某些部分比单次调用更持久。你可以在属性列表（property\
    \ lists）中存储一些纯数据对象类型，正如我们在第 7 章中看到的，但存储任意对象呢？\n\n你可以以某种自定义（或公共）格式写入数据，然后从这些数据重新创建对象。然而，仅仅为了让几个对象持久化就定义新的文件格式，这比大多数程序员愿意付出的精力要多。\n\
    \n幸运的是，Foundation 在 `NSCoding` 协议中提供了答案。它定义了两个方法：`-initWithCoder:` 和 `-encodeWithCoder:`。许多标准类都实现了这个协议，你自己实现也相对容易。\n\
    \n作为参数传递给这些对象是一个 `coder`。这是一个封装了某些数据表示的类。在旧系统上，这通常是 `NSArchiver`，但在较新的系统上，它通常是\
    \ `NSKeyedArchiver`。\n\n旧的 `NSArchiver` 接口仅允许你写入流（带类型的）值。然而，键归档（keyed archives）支持存储更像字典的内容。它们允许你存储键值对，然后以不同的顺序将它们读。\n\
    \n支持归档有两个部分。\n\n你的对象必须能够将自己写入归档文件，并且必须能够将自己读回来。\n\n在 `-encodeWithCoder:` 方法中，你必须将对象的所有状态写入\
    \ coder 中。\n\n这并不意味着对象的所有实例变量。某些对象的实例变量仅用于缓存可以从其他地方重构的信息。通常，在唤醒后重构这些信息比存储它们要好。\n\
    \n同时支持键值和非键值编码器是一个好主意。通常，非键值归档器\n\n82\n\n第 4 章：常见的 Objective-C 模式 34\n\n```\n\
    void encodeWithCoder:(NSCoder*)aCoder\n{\n    if ([aCoder allowsKeyedCoding])\n\
    \    {\n        [aCoder encodeInt:integer forKey: @\"integer\"];\n        [aCoder\
    \ encodeObject:string forKey: @\"string\"];\n    }\n    else\n    {\n        [aCoder\
    \ encodeValueOfObjCType:@encode(int) at: &integer];\n        [aCoder encodeObject:string];\n\
    \    }\n}\n```\n\n*From: archive.m*\n\n-被用于瞬态编码（例如，通过网络传输），而键值编码器用于持久化数据。\n\n\
    键值归档器具有更方便的方法来归档基础类型。你可以发送诸如 `encodeInt:forKey:` 的消息。旧式的归档器只有一个方法用于存储基础类型，该方法接受\
    \ Objective-C 类型和变量的指针。\n\n相应的加载方法可能有点复杂。归档器存储了版本，因此如果对应旧版本，它应该检查版本并不同的处理归档。\n\
    \n如果父类遵循 `NSCoding` 协议，你必须要调用这两个方法的父类实现。如果父类没有遵循，但拥有你想要持久化的状态，那么你负责归档这些状态以及子类的实例变量。\n\
    \n归档对象 83\n\n```\n-id initWithCoder:(NSCoder*)aCoder\n{\n    if ([aCoder versionForClassName:[self\
    \ className]] != 0)\n    {\n        [self release];\n        return nil;\n   \
    \ }\n    if ([aCoder allowsKeyedCoding])\n    {\n        integer = [aCoder decodeIntForKey:@\"\
    integer\"];\n        string = [aCoder decodeObjectForKey:@\"string\"];\n    }\n\
    \    else\n    {\n        integer = [aCoder decodeValueOfObjCType:@encode(int)\
    \ at: &integer];\n        string = [aCoder decodeObject];\n    }\n    string =\
    \ [string retain];\n    return self;\n}\n```\n\n*From: archive.m*\n\n当你更改对象的实例变量布局时，向\
    \ `self` 发送 `+setVersion:` 消息。\n\n指定的初始化器 84\n\n第 4 章：常见的 Objective-C 模式\n\n```\n\
    - (id)initWithSelectorName:(NSString*)aSel arguments:(NSArray*)args\n{\n    if\
    \ (nil == (self = [super init]))\n    { return nil; }\n    selector = [aSel copy];\n\
    \    arguments = [args mutableCopy];\n    return self;\n}\n\n- (id)initWithSelectorName:(NSString*)aSel\n\
    {\n    return [self initWithSelectorName:aSel arguments:nil];\n}\n\n- (id)init\n\
    {\n    return [self initWithSelectorName:nil];\n}\n```\n\n*From: designatedInit.m*\n\
    \n"
- fmt: "\ndoes not do anything, it just returns `self`. This means that it is tempting\
    \ to avoid sending an `-init` message to `super` in direct subclasses of `NSObject`.\
    \ This is generally considered bad practice, because a category on `NSObject`\
    \ might replace this method with one that actually does something.\n\nNot all\
    \ classes retain `-init` as their designated initializer. By convention, the initializer\
    \ that takes the most arguments is the designated initializer. All other initializer\
    \ methods will call this one.\n\nThis approach makes subclassing much easier.\n\
    \nA lot of classes provide a number of convenience methods for initialization.\
    \ If you had to override all of these in every subclass, you would end up with\
    \ a lot of code that didn’t add any value.\n\nIf the superclass uses the designated\
    \ initializer pattern, you only need to override one initializer.\n\nThe example\
    \ in this section is taken from the `LKMessageSend` class in `LanguageKit`. This\
    \ is an abstract syntax tree node representing a message send operation. The superclass’s\
    \ designated initializer is `-init`, so this class calls `-init` from its own\
    \ designated initializer. This class overrides `-init`, but the overridden version\
    \ calls this class’s designated initializer.\n\nIf you subclass this class, you\
    \ just have to override the `-initWithSelectorName:arguments:` method, and you\
    \ only need to do that if you add instance variables that need initialization.\
    \ People sending a `-init` message to your class will get an initialized instance\
    \ back.\n\n### Enforcing the Singleton Pattern\n\n```objc\n@implementation Singleton\n\
    \nstatic Singleton *sharedInstance;\n\n+ (void)initialize\n{\n    if ([Singleton\
    \ class] == self)\n    {\n        sharedInstance = [self new];\n    }\n}\n\n+\
    \ (Singleton*)sharedInstance\n{\n    return sharedInstance;\n}\n\n+ (id)allocWithZone:\
    \ (NSZone*)aZone\n{\n    if (sharedInstance && [Singleton class] == self)\n  \
    \  {\n        [NSException raise: NSGenericException format:@\"May not create\
    \ more than one instance of singleton.\"];\n    }\n    return [super allocWithZone:\
    \ aZone];\n}\n\n@end\n```\n*From: singleton.m*\n\nSingletons are the object-oriented\
    \ version of global variables. A singleton class only has one instance. There\
    \ are lots of these in Objective-C, but they all follow the same general pattern.\n\
    \nThe example at the start of this section is a skeleton class that only permits\
    \ a single instance of itself to be created. This follows the convention of returning\
    \ the singleton instance in response to a `+sharedInstance` message. A lot of\
    \ singleton classes put the class name in this message name, in place of Instance.\n\
    \nTo get the shared application object in an AppKit application, for example,\
    \ you will send a `+sharedApplication` message to `NSApplication`. This class\
    \ is a special case of a singleton, because it stores its shared instance in the\
    \ global `NSApp` variable. If the application has already started, you can use\
    \ this variable directly, avoiding the message send to get the application object.\n\
    \nThe most common mistake with singletons is to introduce a race condition in\
    \ creation. This particular singleton is storing an instance of itself in a private\
    \ variable. It it tempting to create this in the `+sharedInstance` method.\n\n\
    That will work fine for single-threaded applications, but what about multithreaded\
    \ ones?\n\nIf you send the `+sharedInstance` message simultaneously from two threads,\
    \ what happens? Both might test the variable, find that it hasn’t been created,\
    \ and then create it. To get around this, you could use a lock.\n\nA much simpler\
    \ solution is to create the instance in the `+initialize` method. This method\
    \ is called by the runtime the first time a message is sent to the class. It is\
    \ the runtime’s responsibility to ensure that this method completes before any\
    \ messages are delivered to the class by other threads.\n\n**Note:** The Apple\
    \ documentation recommends using `@synchronized(self)` in the `+sharedInstance`\
    \ method for creating singletons. That approach is both significantly slower and\
    \ requires more code than the approach proposed in this section, so it has little\
    \ to recommend it.\n\nYou don’t need to override `+allocWithZone:` in a singleton,\
    \ but it provides a little bit extra runtime checking if you do. The sample code\
    \ will throw an exception if you try to allocate a new instance of the class after\
    \ the singleton instance has been created.\n\nNote the tests in both the `+allocWithZone:`\
    \ and `+initialize` methods. These are needed for subclassing. You don’t want\
    \ to throw an exception if someone creates a subclass of your singleton object.\
    \ Subclassing singletons is quite tricky, so you may skip this extra test if you\
    \ don’t want to support it.\n\n### Delegation\n\nObjective-C doesn’t support multiple\
    \ inheritance. This is not a huge limitation, because it’s very hard to use multiple\
    \ inheritance well, but with some problems it seems like the natural solution.\n\
    \nThe idea behind the *delegation pattern* is similar to that behind inheritance\
    \ and prototypes: You allow one object to define some subset of the behavior of\
    \ another object. You won’t see this in the Foundation framework, but it’s very\
    \ common in AppKit or UIKit. Each user interface object uses delegation to allow\
    \ you to define what happens in response to user interface events. Several patterns\
    \ are related to delegation, and they are all related to the general rule that\
    \ you should favor composition over inheritance.\n\n### Providing Façades\n\n\
    ```objc\n@interface Control : View\n{\n    id cell;\n}\n@end\n\n@implementation\
    \ Control\n\n- (id)selectedCell\n{\n    return cell;\n}\n\n- (BOOL)isEnabled\n\
    {\n    return [[self selectedCell] isEnabled];\n}\n\n- (void)setEnabled:(BOOL)flag\n\
    {\n    [[self selectedCell] setEnabled:flag];\n    [self setNeedsDisplay:YES];\n\
    }\n\n@end\n```\n*From: facade.m*\n\nOne very common use for delegation is the\
    \ *façade pattern*. This wraps one or more private or semi-private objects in\
    \ a public interface. This is very commonly used in Objective-C to provide something\
    \ like multiple inheritance, where an object combines behavior from several distinct\
    \ objects, delegating some of its functionality to each one.\n\nThe `NSControl`\
    \ hierarchy in AppKit is a good example of this. Classes in this hierarchy inherit\
    \ behavior from `NSView` and delegate behavior to an `NSCell` subclass. `NSView`\
    \ provides features such as a graphics context, event handling, and interaction\
    \ with the view hierarchy. The cell provides features such as drawing. The example\
    \ at the top of this section is a (very) simplified version of `NSControl`.\n\n\
    When you click on a button in OS X, you are usually clicking on an instance of\
    \ `NSButton`, which is an `NSControl` subclass using an `NSButtonCell` for its\
    \ implementation. As a programmer, you can use controls almost interchangeably\
    \ and you can also reuse the cells that they contain. If you see a button in a\
    \ table or outline view, for example, this is drawn with an `NSButtonCell`, not\
    \ with an `NSButton`.\n"
