    On OS X, you cannot write property lists in the OpenStep format, but you can still
    use the two other forms. In general, you should use the binary format for storing
    private data and the XML format for anything that the user might want to edit
    with other tools.


    These are not hard-and-fast rules. The point of the property list format is that
    you can losslessly


    **Converting Property List Formats** 177


    convert between the representations, so you might use the binary format everywhere—


    because it is denser and faster to parse—and expect the user to convert the property
    list if he wants to modify them.


    You can choose which format you


    use when you write a file using


    NSPropertyListSerialization. This class also, helpfully, tells you what the format
    of the property list is currently when you read it in.


    **Note:**


    The methods used in the example at the start of this section were introduced with
    OS X


    10.6\. If you are using an older version of OS X, you can replace the read method
    that we looked at in the last section and the corresponding write method.


    It’s quite common to want to store property lists in binary format for efficiency.
    Your users will then decide that they want to poke these files in a text editor,
    so they’ll use the plutil tool to convert them to XML format. They will then,
    of course, forget to convert them back, so your program will read them back slowly
    the next time.


    If you are not going to modify a property list every time your program runs, it’s
    worth checking whether the format is still binary when you load it and then rewriting
    it in this format if it isn’t.


