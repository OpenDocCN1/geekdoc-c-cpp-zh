  trans: "\n\n# 错误处理\n\n回到 2004 年的异常处理机制。在该模式下编译的每个函数（无论源语言是什么）都会导出一些 `DWARF` 调试数据，描述栈帧的布局以及如何对其进行回溯（unwind）。这通常被称为*零开销异常处理*，因为它不会对不使用异常处理的代码产生任何运行时开销。如果你在此模式下编译\
    \ C 代码，由于额外的回溯信息，二进制文件会稍微大一点，但除非在 C 代码中抛出异常，否则这些额外数据甚至不会被交换到内存中。\n\n有了这种支持，当 Objective-C\
    \ 异常跨越 C++ 栈帧时，可以在 C++ 中运行清理代码，反之亦然。你还可以使用 GCC 的 `__attribute__((cleanup))` 扩展在\
    \ C 中注册清理代码。\n\nApple 随着 64 位运行时采纳了这一变化。这显著地改变了异常的性能特性。\n\n## 异常的运行时差异\n\n使用 `setjmp()/longjmp()`\
    \ 异常时，进入异常处理区域是昂贵的（需要保存所有寄存器），但抛出异常非常快。然而，这不安全的，因此文档建议捕获异常后通常应该中止程序。异常被设计用于半优雅的异常终止，除非它们在抛出地的附近被捕获了。\n\
    \n对于零开销异常，进入异常处理块是不花成本的。抛出异常非常昂贵，但是安全的。这意味着你可以在代码中放置 `@try` 块而不会减慢任何速度，并在发生任何异常情况时抛出异常。\n\
    \n如果你需要与 Apple 的 32 位运行时兼容，那么避免异常仍然是一个好主意；如果你频繁使用 `@try` 块，它们将增加大量的开销。\n\n**注意：**\n\
    使用旧式异常时，你必须小心为捕获异常后需要访问的任何局部变量指定 `volatile`。如果不这样做，它们可能会恢复到调用 `setjmp()` 时所持的值。\n\
    \n## 抛出和捕获异常\n\n### 异常\n\n```objc\nNSArray *array = [NSArray array];\n\n@try\n\
    {\n    [array objectAtIndex: 0];\n}\n@catch (NSException *e)\n{\n    NSLog(@ *\"\
    Caught exception %@\"* , e);\n}\n```\n*自：exception.m*\n\n旧的 Objective-C 代码可能包含以\
    \ `NS_DURING` 开头的块。这些是定义 `setjmp()` 风格异常处理的旧宏。随着较新版本的 Foundation 框架发布，它们在 `NSException.h`\
    \ 中被定义，以使用新的异常处理关键字。\n\n这些旧宏有几个局限性，即使它们被用作新关键字的包装器。第一，它们只允许捕获 `NSException` 实例。第二，它们没有等同于\
    \ `@finally` 的机制（`finally` 运行清理代码然后继续回溯），尽管你可以通过捕获异常然后重新抛出它模拟这种行为。\n\n这些宏使用起来非常不方便。你必须使用\
    \ `NS_VALUERETURN` 或 `NS_VOIDRETURN` 从 `NS_DURING` 内部返回，以确保你已经从异常处理栈中移除了清理代码。\n\
    \n```objc\n#define NS_DURING\n@try {\n    #define NS_HANDLER\n} @catch (NSException\
    \ *localException) {\n    #define NS_ENDHANDLER\n}\n#define NS_VALUERETURN(v,t)\
    \ return (v)\n#define NS_VOIDRETURN return\n```\n*自：NSException.h*\n\n现在，异常处理代码看起来非常像\
    \ Java 或 C++。但有一些限制。\n\n抛出 `NSException` 以外的对象可能有效，但这是不受支持的。在 OS X 上，这是因为使用旧版运行时编译时抛出的对象可能仍被旧的\
    \ `NS_HANDLER` 宏捕获，该宏期望一个 `NSException` 实例。在 GCC 运行时中（但不是 GNUstep 运行时），可能会抛出一个未在运行时中正确注册的类实例，这会导致回溯库崩溃。完全不支持抛出非对象类型。\n\
    \n抛出异常的最佳方法仍然是向 `NSException` 实例发送 `-raise` 消息。你也可以使用 `@throw` 关键字抛出任意对象，但如果它不起作用不要太惊讶。如果你正在使用\
    \ GNU 运行时或现代 Apple 运行时，它可能会生效，但你正在做一些未经过充分测试的操作。\n\n### 使用异常对象\n\n```objc\n[NSException\
    \ raise: NSGenericException format: @ *\"This is an example\"* ];\n```\n*自：throwexception.m*\n\
    \n`NSException` 类曾用于实现 `longjmp()` 缓冲区栈，并在需要时跳转到栈顶部的缓冲区。现在，回溯完全由运行时和回溯库完成，但 `NSException`\
    \ 仍用于封装异常。\n\n异常有三个组成部分：名称、原因和用户信息字典（user info dictionary）。名称是此类类型异常的唯一标识符。这只是一个字符串，但通常使用符号常量（例如\
    \ `NSRangeException`），以便你可以在捕获异常时对异常名称进行指针比较。\n\n描述（description）是人性的可读的描述。这通常只用于调试，因此本地化并不重要。你理解发生了什么比你的用户理解更重要。最后，用户信息字典是一个包含某些键值对的\
    \ `NSDictionary`。完全取决于抛出异常的代码来决定在其中放入什么，尽管大多数抛出异常的方法都会说明它们会在其中放入什么。\n\n你可以利用此将任意信息传递到捕获异常的地方。因为它是一个字典，通常使用不可变字典（即\
    \ `NSDictionary` 而不是 `NSMutableDictionary`），因为捕获代码并不期望能够修改它。在为异常附加字典时，通常使用 `+dictionaryWithValues:`\
    \ 构造器创建一个一次性的不可变字典。\n\n在最近的 OS X 版本中，异常对象还包含一些对调试有用的额外信息。向它发送 `-callStackAddresses`\
    \ 消息将给你一个包含 `NSNumber` 的 `NSArray`，这些数字指向栈上所有函数的返回地址。这并不是特别有用，但 OS X 10.6 引入的\
    \ `-callStackSymbols` 方法非常有用。它会给你异常创建时栈上所有函数或方法的的名称。\n\n后一种方法被未处理异常处理器（unhandled\
    \ exception handler）使用，当异常未被捕获时，该处理器会在程序中止前打印栈跟踪。你可能想使用 `NSSetUncaughtExceptionHandler()`\
    \ 函数用你自己的处理器来替换它。如果你有一个错误报告机制，那么未处理异常的堆栈跟踪将非常有用。\n\n### 使用异常管理内存\n\n```objc\n\
    id pool = [NSAutoreleasePool new];\nid array = [NSArray new];\n@try\n{\n    throw(array);\n\
    }\n@catch (id e)\n{\n    NSLog(@ *\"Caught exception %@\"* , e);\n    e = [e retain];\n\
    \    [pool drain];\n    [e autorelease];\n    pool = nil;\n    @throw;\n}\n@finally\n\
    {\n    [array release];\n    [pool drain];\n}\n```\n*自：releaseexcept.m*\n\n"
- fmt: "\nException handling makes memory management a bit more difficult. If you\
    \ create a new object in a method and then release it at the end, you must take\
    \ into account the fact that exceptions are a thinly disguised non-local goto\
    \ and that there are suddenly lots of ways to return from your method. Every single\
    \ function call or message send becomes a potential return path.\n\nYou can fix\
    \ this quite easily by adding an `@finally` block at the end of the `@try` block.\
    \ Code in this block will always be executed, whether you exit the `@try` block\
    \ by reaching the end or by throwing an exception.\n\n### Note\n\nIn Java, you\
    \ can use exceptions as a local goto as well, advertising a code path to the VM\
    \ as being unusual, by throwing an exception and catching it in the same method.\
    \ This is also possible in Objective-C, but it’s incredibly inefficient. The `@throw()`\
    \ statement will call the `objc_exception_throw()` function, which will call an\
    \ unwind library function.\n\nThis will then read the DWARF data for the stack\
    \ frame and call the Objective-C personality function. This function will then\
    \ read more of the DWARF data, compare the class of the exception against the\
    \ class of the catch block, and then set the instruction pointer to the address\
    \ of the catch statement.\n\nIn Java, the VM will just translate this into an\
    \ unconditional jump to the catch block. If you must use this pattern, then use\
    \ a C `goto` statement in Objective-C. It’s generally better to avoid it altogether,\
    \ however, and find a solution that doesn’t ignore the ideas of structured programming.\n\
    \nThe other problem you may encounter with exceptions is in rethrowing the exception\
    \ object. Exception objects are usually autoreleased. This means that, with manual\
    \ memory management, they will be deleted when the current autorelease pool is\
    \ deleted. This is not a problem in most code. The autorelease pool you are most\
    \ commonly using persists for the duration of the run loop.\n\nSometimes, however,\
    \ you will create your own autorelease pool. If you drained your autorelease pool\
    \ in an `@finally` block, as appears to be the obvious solution, you would encounter\
    \ a problem. The exception object would be deleted while unwinding through your\
    \ stack frame, and the next stack frame up would probably crash, dereferencing\
    \ an orphaned pointer while looking up the type of the exception.\n\nTo avoid\
    \ this, you need to make sure you retain the exception object before you delete\
    \ the autorelease pool and then autorelease it again afterward. This is one of\
    \ the reasons why it’s a bad idea to throw anything other than an `NSException`\
    \ object. Anyone who follows the suggestion in Apple’s documentation for doing\
    \ this will end up with code that only correctly handles `NSException` objects\
    \ and will prematurely destroy any other object type.\n\nTo implement this correctly,\
    \ you need a catch-all clause: an `@catch` clause with a `id` type. This will\
    \ catch all Objective-C exceptions. Remember that C++ exceptions will still not\
    \ be caught in this block, so you still need an `@finally` block to handle cleanup\
    \ if you are unwinding with a foreign exception. You can set the pointer to the\
    \ autorelease pool to `nil` in the `@catch` clause to prevent it from being released\
    \ twice.\n\n### Passing Error Delegates\n\n```objc\nNSFileManager *fm = [NSFileManager\
    \ defaultManager];\n[fm copyPath: source toPath: destination handler: [ErrorHandler\
    \ new]];\n```\n*From: errordelegate.m*\n\nIn Common Lisp, you have the idea of\
    \ *resumable* exceptions. These are contrasted with unwinding exceptions like\
    \ those found in Objective-C, Java, C++, and so on. A resumable exception does\
    \ not unwind the stack; it runs the exception-handling code and then continues.\n\
    \nIn Objective-C there is no direct analogue, but you can achieve the result by\
    \ passing an *error delegate* as an argument to a method. The older APIs in `NSFileHandle`\
    \ work this way. The last argument to them is an object that is sent messages\
    \ when the operation encounters a problem. This method returns a `BOOL` indicating\
    \ whether the operation should proceed. You can combine this with unwinding exceptions\
    \ in your code by throwing an exception if the error delegate did not handle the\
    \ conditions.\n\nI used this pattern in the LanguageKit framework for reporting\
    \ compiler errors and warnings. When the compiler encounters an error, it calls\
    \ a method in the error delegate. The default implementation of this just dumped\
    \ the message to the console, but other implementations transform the abstract\
    \ syntax tree to remove the error. If this returns `YES`, the compiler backtracks\
    \ and tries the check again. If it returns `NO` the compiler throws an exception,\
    \ which is caught by the code that invoked the compiler.\n\nIn general, you should\
    \ use this pattern anywhere you might encounter a fixable problem in the middle\
    \ of an operation. For example, you could use it while loading a file that references\
    \ other files. If one of the referenced files is missing the default option would\
    \ be to abort. However, an error delegate could provide a new path, either by\
    \ using some fixed translation or by prompting the user.\n\n### Returning Error\
    \ Values\n\n```objc\n- (BOOL)trySomething;\n- (id)tryToDoSomethingWithObject:\
    \ (id)anObject error: (NSError**)e;\n```\n*From: errorReturn.m*\n\n### Using NSError\n\
    \nIn C, a common pattern is to return zero on success and some nonzero value to\
    \ indicate an error condition. This is much less popular in Objective-C, but it\
    \ is relatively common to return a `BOOL` value representing whether an operation\
    \ succeeded. Most of the time, this is done with methods that mutate the receiver\
    \ in some way. When you call this kind of method, it is to affect some change,\
    \ not get a value. An example of this pattern is the `setProperty:forKey:` method\
    \ on `NSStream`. This tries to set a property of the stream and returns `YES`\
    \ if it succeeded. Note that this is the opposite of the C pattern, which returns\
    \ true on failure.\n\n```objc\nNSError *error = nil;\nNSStringEncoding enc;\n\
    NSString *str = [NSString stringContentsOfFile: @\"DoesNotExist\" usedEncoding:&enc\
    \ error:&error];\nif (nil != error) {\n    NSLog(@\"Error: %@\", [error localizedDescription]);\n\
    }\n```\n*From: nserror.m*\n\nA few of the methods that Apple introduced with OS\
    \ X 10.2 take an `NSString**` as an argument. This is used to return a second\
    \ value reporting error. If the variable that this points to is nil after the\
    \ call, the operation succeeded. If not, it contains a string describing error.\
    \ This had some obvious limitations. A string is fine for reporting to the user,\
    \ but it’s not particularly useful for recovering from the error. If you want\
    \ to handle the error in code, you need to parse the string somehow.\n\nWhen Apple\
    \ released Safari, with 10.2.7, they added a new class: NSError. This is almost\
    \ always returned via a pointer passed as the last argument to a method. The error\
    \ object looks quite similar to the exception object. It has a name (called a\
    \ *domain*) and a dictionary associated with it. Unlike the exception object,\
    \ the dictionary has several predefined keys. These include the localized error\
    \ description. You can present this to the user without any extra processing.\n\
    \nError objects also sometimes include a recovery strategy. The *recovery attempter*\
    \ object can try to automatically recover from an error. For some errors this\
    \ is not possible, but often you get an error when you try to do something that\
    \ is possible, but unsafe. When this happens, you should present the error to\
    \ the user and then call the recovery attempter.\n"
