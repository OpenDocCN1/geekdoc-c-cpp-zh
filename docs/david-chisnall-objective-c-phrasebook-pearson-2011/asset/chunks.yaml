  trans: "\n你可以通过 `dispatch_get_main_queue()` 获取此队列的引用。该队列在 OS X 10.6 上用于实现运行循环（run\
    \ loop）。\n\n这是一个 FIFO（先入先出）队列，你可能希望创建类似的队列。FIFO 队列类似于轻量级线程。它按顺序执行，一次执行一个块。线程与队列之间的关系是变化的。取决于各种因素，你的所有队列最终可能在不同的线程上并发运行，也可能全部在单个\
    \ OS 线程上执行。\n\n你通过调用 `dispatch_queue_create()` 创建一个新的 FIFO 队列。当你有一系列需要按定义顺序执行、但与程序其余部分大部分相互独立的任务时，这种方法非常有用。\n\
    \n这有助于减少对显式同步的需求。\n\n本章开头的示例向一个新队列推送了**创建自定义工作队列** 271 三三个递增计数器的块（block）以及一个将其最终值打印到屏幕的块。\n\
    \n这些块之间都是相关的；以错误的顺序执行它们将是一个非常糟糕的主意。通过这种方法，它们彼此之间的执行顺序是有保证的，但对于程序的其余部分则不保证。这意味着除非你计划从队列外部访问计数器，否则你不需要为计数器变量添加任何锁。\n\
    \n![Image 17](img/index-289_1.png)\n\n# 第 16 章：通知\n\n## 请求通知\n\n```objective\n\
    - (**void**)notify: (NSNotification*)note\n{\n    NSLog(@ *\"Received %@\" , note);\n\
    }\n\n- (**void**)registerListener\n{\n    NSNotificationCenter *nc = [NSNotificationCenter\
    \ defaultCenter];\n    [nc addObserver:self\n                 selector:@selector(notify:)\n\
    \                     name: @ *\"Example\"*\n                  object: nil];\n\
    }\n\n- (**void**)dealloc\n{\n    NSNotificationCenter *nc = [NSNotificationCenter\
    \ defaultCenter];\n    [nc removeObserver:self];\n    [super dealloc];\n}\n```\n\
    *来自：notify.m*\n\n为了监听通知，你需要为你的线程向 `NSNotificationCenter` 对象注册这些感兴趣。这是通知的路由点。\n\
    \n当通知被发布时，它会被发送到通知中心，然后通知中心将其转发给所有感兴趣的相关方。\n\n大多数情况下，你会使用默认通知中心。可以为不同的用途创建不同的通知中心，但最常见的是使用标准中心。这通过向\
    \ `NSNotificationCenter` 发送 `+defaultCenter` 消息来获取。\n\n要注册通知，你随后向中心发送 `-addObserver:selector:name:object:`\
    \ 消息。注意此消息中的 `selector` 参数。单个对象可以在不同的方法上接收不同的通知。这非常有用，因为这意味着你不需要测试收到了什么种类的通知，并且可以将不同的事件处理器整洁地分离到不同的方法中。\n\
    \n在注册观察者时，对象或通知名称可以为 `nil`。这允许你注册以接收由特定对象发送的所有消息，或者接收某种特定类型的所有通知（无论其发送者是谁）。\n\n\
    这些功能对调试比任何其他事情都更有用。例如，你可以写一个日志切面（aspect），监听所有特定类型的通知并记录发送者。\n\n监听通知时需要记住的一点重要点是，通知中心不会保留（retain）你的对象。如果你的对象在销毁时仍注册了接收通知，那么当下一次发送其中一个通知时，你的程序将会崩溃。\n\
    \n为了避免这种情况，请确保在你的 `-dealloc` 方法中向通知中心发送 `-removeObserver:` 消息。如果你忘记了这一点，崩溃将不会明显。你会在回溯（back\
    \ trace）中看到很多奇怪的东西，包括通知中心。\n\n## 发送通知\n\n```objective\nNSNotificationCenter *nc\
    \ = [NSNotificationCenter defaultCenter];\n[nc postNotificationName: @ *\"Example\"\
    *\n                      object: @ *\"sender\"*\n                     userInfo:\
    \ nil];\n```\n*来自：notify.m*\n\n发布通知比注册监听它们要简单得多。发布通知对象的标准方法是构造一个 `NSNotification`\
    \ 对象然后发送它。\n\n在实践中，我认为我从未见过执行这种操作的代码。通知中心有一些便利方法，可以在单次操作中构造并发布通知。\n\n发送通知最常见的方法是\
    \ `-postNotificationName:object:userInfo:` 方法。还有一个该方法的简化版本，它省略了 `userInfo:` 参数，并且等同于将\
    \ `nil` 传递给最后一个参数。\n\n注意对象——通知的发送者——是作为参数指定的。这意味着你可能发送声称来自另一个对象的通知。这意味着例如，C 代码可以代表其他对象发送通知。\n\
    \n## 队列通知\n\n```objective\nNSNotificationQueue *nq = [NSNotificationQueue defaultQueue];\n\
    NSNotification *note = [NSNotification notificationWithName: @ *\"Example*\"\n\
    \                               object: @ *\"sender\"*];\n[nq enqueueNotification:\
    \ note postingStyle: NSPostWhenIdle];\n[[NSRunLoop currentLoop] run];\n```\n*来自：notify.m*\n\
    \n有时，你的代码可能会产生大量通知，或者产生不需要立即处理的通知。`NSNotificationQueue` 类解决了这两个问题。\n\n通知队列既可以延迟交付通知，也可以将其合并（coalesce）。与\
    \ `NSNotificationCenter` 不同，队列没有构造通知的便利方法，你必须自己这样做。然后使用三种发布样式之一发布通知。\n\n在这个示例中，通知的交付被推迟，直到运行循环中没有其他事件为止。定时器和文件描述符上的数据就绪具有更高优先级。或者，你可以在下一次运行循环迭代或立即发布。\n\
    \n如果你发送大量相同类型的通知，那么缓存通知对象是一个好主意。反复将相同对象传递给通知队列是非常廉价的，它可以自动发送一次通知。\n\n如果你使用较长的方法队列通知，参数之一是\
    \ `coalesceMask`，它决定了如何合并通知。你可以合并具有相同名称的通知、具有相同发送者的通知，或者兼者。\n\n合并在配合 `NSPostWhenIdle`\
    \ 发布样式时最有用。当你的代码忙碌时，你可以多次发送相同的通知，当没有其他事件需要处理时，通知队列将只发布一个副本。这对于触发某些低优先级记录工作的代码是非常理想的。\n\
    \n## 应用间发送通知\n\n```objective\n[c addObserver:self\n         selector:@selector(newCopyStarted:)\n\
    \             name:ProcessDidStart\n            object:nil\nsuspensionBehavior:NSNotificationSuspensionBehaviorHold];\n\
    ```\n*来自：distributedNotify.m*\n\n通知提供的松耦合非常有用，以至于它在 Foundation 框架内得到了扩展，为应用程序之间的通信提供了一种（简单的）机制。`NSDistributedNotificationCenter`\
    \ 类是 `NSNotificationCenter` 的子类，用于向其他应用程序广播通知。\n\n"
- fmt: "\n# Notifications\n\nThis extension requires some changes. A normal notification\
    \ has a sender associated with it, which is a pointer to some object. A pointer\
    \ to an object is not particularly useful in a process with another address space,\
    \ so distributed notifications use a string as the sender. This can be anything\
    \ that you like, but it’s usually the application name.\n\nNotifications can have\
    \ dictionaries associated with them. Within an application, these dictionaries\
    \ can contain any objects, but for broadcast they are restricted to objects that\
    \ can be stored in *property lists* (see Chapter 9).\n\n**Note:**\n\nOn OS X,\
    \ there is only a single type of distributed notification center, sending notifications\
    \ to applications owned running with the same user ID as the sender. GNUstep provides\
    \ two others, one for communicating with all applications on a computer, irrespective\
    \ of the user, and one for broadcasting notifications across the local network.\n\
    \nThe delivery semantics for distributed notifications are also somewhat different.\
    \ When you post a (normal) notification, it is delivered synchronously. The sending\
    \ object already has control of the CPU. The stack frame for its method is at\
    \ the top of the stack and it is free to delegate program flow to the notification\
    \ center, which then delegates it to the notification listeners.\n\nWith a distributed\
    \ notification, this is not the case. You can’t just interrupt whatever another\
    \ process is doing in the middle of a function and so you must wait until a convenient\
    \ point.\n\nDistributed notifications handle this by interfacing with the run\
    \ loop. To receive distributed notifications, you must be using `NSRunLoop`. The\
    \ `distributedNotify.m` example is a simple program that writes a log message\
    \ whenever a new instance of itself is started.\n\nThe `-init` method of this\
    \ class does all of the real work. First, it registers an observer for a distributed\
    \ notification. The object is nil, so it will receive this notification from any\
    \ sender. Then it constructs the notification. The user info dictionary contains\
    \ a single key-value pair storing the process ID.\n\nAfter it’s posted the notification,\
    \ it starts the run loop. The program will then sit in a blocking state until\
    \ some run loop events happen. Only one event has a handler defined in this program,\
    \ so all that it will ever do is (Well, you can; signals do exactly that, but\
    \ the things you can do from a signal handler are quite limited).\n\n## Sending\
    \ Notifications Between Applications\n\n```objc\n- (id)init\n{\n    NSDistributedNotificationCenter\
    \ *c = [NSDistributedNotificationCenter defaultCenter];\n    [c addObserver:self\n\
    \             selector:@selector(newCopyStarted:)\n                 name:ProcessDidStart\n\
    \               object:nil\n    suspensionBehavior:NSNotificationSuspensionBehaviorHold];\n\
    \    NSProcessInfo *pinfo = [NSProcessInfo processInfo];\n    NSNumber *pid =\
    \ [NSNumber numberWithInt:[pinfo processIdentifier]];\n    NSDictionary *userInfo\
    \ = [NSDictionary dictionaryWithObject:pid\n                                 key:@\"\
    pid\"];\n    [c postNotificationName:ProcessDidStart\n                       \
    \   object:[pinfo processName]\n                       userInfo:userInfo\n   \
    \                      options:0];\n    [[NSRunLoop currentRunLoop] run];\n}\n\
    ```\n*From: `distributedNotify.m`*\n\nreceive a `-newCopyStarted:` message whenever\
    \ a `ProcessDidStart` notification is posted, which will only happen when another\
    \ copy of this program is run.\n\nIf you compile and run this example, you will\
    \ see that it receives its own notification, so it will tell you that it has started.\
    \ If you run another copy, you will get a log message from each running instance\
    \ telling you about the new one.\n\nThis is quite a trivial example, but it’s\
    \ easy to use distributed notifications for more complex events. I use them in\
    \ XMPPKit, for example, to notify all running applications when the user changes\
    \ online state. Other programs listen for this and can push the new status message\
    \ to microblogging sites.\n\n# Network Access\n\n## Wrapping C Sockets\n\n```objc\n\
    return [[[NSFileHandle alloc] initWithFileDescriptor:s closeOnDealloc:YES] autorelease];\n\
    ```\n*From: `NSFileHandle+Socket.m`*\n\nWe looked briefly at the `NSFileHandle`\
    \ class in Chapter 13 and I mentioned that it wrapped a file descriptor. The socket\
    \ API was designed based on the UNIX `everything-is-a-file-even-when-it-doesn’t-make-sense`\
    \ model, so sockets are also file descriptors. You can use the same function calls\
    \ for reading from and writing to a socket that you can use with any other file\
    \ descriptor.\n\nYou can also use an `NSFileHandle` to wrap a socket. This lets\
    \ you use the low-level APIs to create a socket to your exact specifications,\
    \ then use a more abstract way of interacting with the created socket. If you\
    \ need to use any parts of the low-level socket API that are not conveniently\
    \ exposed by the higher-level APIs then this is the only solution that you can\
    \ use. In other cases, it is still often the most convenient one.\n\nThe biggest\
    \ advantage of wrapping your socket in a file descriptor object is that you can\
    \ easily integrate it with the run loop. This lets you very easily write event-driven\
    \ socket code.\n\n**Note:**\n\nRemember that the aim of Objective-C was to make\
    \ life easier for C programmers. Don’t use Objective-C APIs just for the sake\
    \ of it, only use them when they make more sense as a solution to your specific\
    \ problem than the C APIs. Using an Objective-C API that is just a trivial wrapper\
    \ around the C API adds overhead and complexity, but doesn’t make your code easier\
    \ to maintain. If you pass `YES` as the `closeOnDealloc:` argument when you create\
    \ the `NSFileHandle`, then the file descriptor will be closed when the object\
    \ is deallocated.\n\nIf you send a `-waitForDataInBackgroundAndNotify` message\
    \ to your object, it will be added to the list of file descriptors that the run\
    \ loop polls. At the next run loop iteration, if there is data waiting then the\
    \ `NSFileHandle` object will post a notification. If you have registered a handler\
    \ for this notification, then you can read the new data.\n\nThe documentation\
    \ for this method is somewhat misleading. It claims that this method will create\
    \ another thread. In fact, on OS X the run loop uses the `kqueue()` API and GNUstep\
    \ may use `poll()` or `select()` instead. With OS X 10.6, this is implemented\
    \ using *Grand Central Dispatch* to post the notification, but the core functionality\
    \ is the same.\n\nOne final advantage is that you are freed from thinking about\
    \ buffers. When you read data from a socket, you typically have to allocate a\
    \ buffer and then pass a pointer to it to a `read()` or `recv()` system call.\
    \ With a file descriptor object, you read `NSData` instances. If you are writing\
    \ a lot of strings, then you might want to consider adding a category on `NSFileHandle`\
    \ that provides `-writeUTF8String:` and `-readUTF8String` methods, or equivalent\
    \ methods for the encoding that your protocol uses, allowing you to get and send\
    \ strings directly.\n\n## Connecting to Servers\n\n```objc\nNSInputStream *in;\n\
    NSOutputStream *out;\nNSHost *host = [NSHost hostWithName:@\"example.com\"];\n\
    [NSStream getStreamsToHost:host port:80 inputStream:&in outputStream:&out];\n\
    [in open];\n```\n*From: `nsstream.m`*\n"
