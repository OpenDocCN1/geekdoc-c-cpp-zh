  trans: "\n\n# 第 6 章：处理字符串\n\n## 拷贝字符串\n\n```objc\nNSString *staticString = @ *\"\
    a string\"* ;\nNSString *constantString = [staticString copy];\nNSString *stringAlias\
    \ = [constantString retain];\nNSMutableString *mutableString = [stringAlias mutableCopy];\n\
    NSMutableString *mutableStringAlias = [mutableString retain];\n```\n*来源：stringcopy.m*\n\
    \n`C++` 往往比预期的要慢很多的地方之一就是在处理字符串时。在任何具有纯手动内存管理的环境中，人们往往倾向于对对象进行防御性拷贝（defensive\
    \ copy），以保持清晰的所有权规则。\n\n在 Objective-C 中，这种情况并不常见，相反，更多代码深受相反的问题：在应该使用拷贝（copies）的地方保留了可变对象的引用（retaining\
    \ references）。当你向一个 `NSString` 发送 `-copy` 消息时，它的效果与发送 `-retain` 相同。\n\n你可能会奇怪，为什么我们要有两个功能相同的方法？答案很简单：`NSMutableString`\
    \ 是 `NSString` 的子类。如果你向一个 `NSMutableString` 发送 `-retain` 消息，你会增加它的引用计数。如果你发送 `-copy`\
    \ 消息，你会得到一个新对象。情况甚至更加复杂，因为某些 `NSMutableString` 的具体子类支持“写时拷贝”（copy-on-write）行为，因此你会获得两个引用相同数据的对象，并且只有在你修改其中一个对象时，才会生成真正的拷贝。\n\
    \n由于 `NSMutableString` 是 `NSString` 的子类，你可以将指向 `NSMutableString` 的指针传递到任何期望 `NSString`\
    \ 指针的地方。如果你期望一个不可变字符串但收到了一个变字符串，那么无论是拷贝该对象还是仅为它创建另一个引用都并不重要。相反，如果你收到一个可变字符串，你就不应该只保留它的引用，否则可能会导致它在稍后被修改。\n\
    \n重要的一点是，向任何 `NSString` 的子类发送 `-copy` 消息将始终返回一个不可变字符串。如果你想要一个可变字符串，必须使用 `-mutableCopy`。\n\
    \n**注意：**\n\n如果你是从 Java 转过来的，请记住 `NSString` 大约等同于 Java 的 `String` 类，而 `NSMutableString`\
    \ 大约等同于 Java 的 `StringBuffer` 类。\n\nObjective-C 没有等同于 `final` 关键字，因此 `NSString`\
    \ 可能——而且确实有——子类，你可以在任何可以使用不可变字符串的地方使用可变字符串。\n\n这种模式在 `Foundation` 框架的多个地方都可以找到。大多数具有不可变父类和可变子类的类都会实现\
    \ `NSMutableCopying` 协议。\n\n向它们的可变或不可变实例发送 `-mutableCopying` 消息，将为你返回一个可变子类的实例。\n\
    \n## 从模板创建字符串\n\n```objc\nint a = 12;\nfloat b = 42.0;\nconst char *cString =\
    \ *\"words\"* ;\nid object = [NSObject new];\nNSString *string = [NSString stringWithFormat:@\
    \ *\"%d, %f, %s, %*\", a, b, cString, object];\n```\n*来源：formatstring1.m*\n\n\
    如果你有 `C` 语言背景，学到的第一个函数之一可能是 `printf()`。这是一个*可变函数*（variadic function），它接受一个*格式字符串*（format\
    \ string）作为第一个参数。格式字符串的内容随后定义了其他参数的类型。\n\nObjective-C 作为 `C` 的后代，继承了格式字符串的概念。Objective-C\
    \ 的格式字符串几乎与 `C` 的格式字符串完全一样，但有一个额外：`%@` 格式说明符表示匹配的参数是一个对象。\n\n对象应该知道如何描述自己。每个对象都应该响应\
    \ `-description` 消息，该消息返回一个描述该对象的 `NSString`。许多类从 `NSObject` 继承了这一点，后者只返回类名和对象在内存中的地址。其他类提供了更方便的方法。例如，集合类会将其内容以\
    \ NeXT 风格的*属性列表*（property lists）的形式输出。\n\n**注意：**\n\n`GNU 调试器 (gdb)` 对 `-description`\
    \ 方法具有某些内置支持。当你对对象使用 `print-object` 命令（可以缩写为 `po`）时，它会调用对象的 `-description` 方法。执行此操作时要小心，因为它会在调试的进程中运行一些代码，这些代码可能也包含\
    \ bug。然而，当它正常工作时，非常有帮助。我们将在第 18 章中详细讨论调试。\n\n你可以使用行为类似于 `asprintf()` 的*可变方法*从格式字符串创建\
    \ Objective-C 字符串对象。第一个参数是一个包含某些格式说明符的 Objective-C 字符串，其余参数是用于替换格式说明符的变量。`formatstring.m`\
    \ 示例展示了如何将格式字符串用于 `NSString`。\n\n```objc\nint main(int argc, char **argv)\n{\n\
    \    [NSAutoreleasePool new];\n    NSMutableString *str = [NSMutableString stringWithFormat:@\
    \ *\"%d arguments: \"* argc];\n    for (int i=0 ; i<argc ; i++)\n    {\n     \
    \   [str appendFormat:@ *\"%s \", argv[i]];\n    }\n    NSLog(@\"%@\" , str);\n\
    \    return 0;\n}\n```\n*来源：formatstring.m*\n\n此示例从传递给执行文件的参数构建一个字符串，然后将其写入标准错误。注意，我们需要在程序的开头创建一个\
    \ `NSAutoreleasePool`。使用格式字符串会创建一些临时对象，这些对象是自动释放的（autoreleased）。如果你没有自动释放池，将收到一个警告，说这些对象泄漏了。在这个微不足道的程序中，它们反正会泄漏；由于操作系统会在进程退出时回收内存，所以没必要让自动释放池来收回它们。\n\
    \n此示例首先根据传递给程序的参数创建一个可变字符串。然后遍历剩余参数，将每个参数（作为 C 字符串）追加到字符串中。最后，将结果传递给 `NSLog()`。\n\
    \n`NSLog()` 函数也使用格式字符串。直接将 `str` 作为第一个参数是很有诱惑力的。这运行良好良好，直到有人使用带有百分号的字符串作为此程序的参数。这时，函数将查看第二个参数并尝试解释它。不幸的是，并没有第二个参数，因此它将从寄存器读取一个随机值。如果它将其解释为某种数字，问题不大。如果它将其解释为指针（指向\
    \ C 字符串或 Objective-C 对象），几乎会崩溃。通过传递 `%@`，我们告诉 `NSLog()` 只有一个参数，且它是一个对象。\n\n##\
    \ 存储富文本\n\n```objc\nNSDictionary *keyword = [[NSDictionary dictionaryWithObject:@\
    \ *\"keyword*\" forKey:@ *\"type\"* ] retain];\nNSMutableAttributedString *program\
    \ = [NSMutableAttributedString new];\nNSAttributedString *fragment = [[NSAttributedString\
    \ alloc] initWithString:@ *\"int*\" attributes:keyword];\n[program appendAttributedString:fragment];\n\
    ```\n*来源：richText.m*\n\n字符串只是字符列表。在显示字符串之前，你通常需要其他属性。这些属性描述了字体、大小、对齐方式和下划线样式等。\n\
    \n如果你正在编写处理结构化文本的内容——例如 HTML 或另一种形式的语义标记（如 DocBook），那么这些属性可能可能是一级标题或有序列表。\n\n\
    Foundation 提供了一个类，用于为字符串分配任意属性。`NSAttributedString` 类允许你为属性字符串的范围附加字典。\n\n这些字典可以包含你想要的任何任意信息，包括语义标记。\n\
    \n"
