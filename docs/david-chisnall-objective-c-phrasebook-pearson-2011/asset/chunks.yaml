  trans: "\n在第 19 章中，我们将如何使用 Objective-C 的转发机制来快速方便地实现这种外观模式（faade）。通过直接调用包装对象或多个对象的方法来实现它们也是可能的，而且很常见。\n\
    \n这种方法比多继承要灵活得多，因为它允许同一个类与许多不同的代理配合使用。\n\n在 C++ 中，将使用模板类来实现相同的效果。它们有不同的优势。Objective-C\
    \ 版本生成的代码要少得多，这意味着更好的指令缓存利用率。而 C++ 版本则在编译时让某些类别的优化（主要是内联）变得更容易。\n\n# 创建类簇 (Class\
    \ Clusters)\n\n```objc\nstatic Pair *placeHolder;\n\n+ (void*)initialize\n{\n\
    \    if ([Pair class] == self)\n    {\n        placeHolder = [self alloc];\n \
    \   }\n}\n\n+ (id)allocWithZone: (NSZone*)aZone\n{\n    if ([Pair class] == self)\n\
    \    {\n        if (nil == placeHolder)\n        {\n            placeHolder =\
    \ [super allocWithZone: aZone];\n        }\n        return placeHolder;\n    }\n\
    \    return [super allocWithZone: aZone];\n}\n\n- (Pair*)initWithFloat: (float)a\
    \ float: (float)b\n{\n    return [[FloatPair alloc] initWithFloat: a float: b];\n\
    }\n\n- (Pair*)initWithInt: (int)a int: (int)b\n{\n    return [[IntPair alloc]\
    \ initWithInt: a int: b];\n}\n```\n*来自 classCluster.m*\n\n类簇（Class clusters）在\
    \ Objective-C 中非常常见。很多 Foundation 类都是类簇，你可能会发现实现一些自己的很有用。\n\n第 4 章：Objective-C\
    \ 常用模式\n\n类簇是一个隐藏了具体子类的*抽象父类*。这在 Objective-C 中比其他语言更容易实现，因为没有创建对象的关键字。当你向一个类发送消息请求新实例时，该类可能会返回它自己的实例，但也返回某个子类的实例。\n\
    \n如果你使用 `+arrayWithObjects:` 创建 `NSArray`，你可能会得到一个包装简单数组的子类。如果你使用 `+arrayWithArray:`，你可能会得到一个引用另一个数组的。\n\
    \n另一个很好的例子是 `NSNumber`。它包装了一个单一原始值。你可以用两个实例变量来实现这一点：所有可能的类型的联合，并说明哪一个。这将浪费大量空间并变得相当复杂。简单的解决方案是为你支持的每个类型实现不同的子类。\n\
    \n大多数类簇提供命名的构造函数，例如 `+numberWithFloat:`，创建正确子类的实例。如果你通过 `+alloc` 创建它们，通常会得到一个占位类。\n\
    \n示例是 `Pair` 类。它没有声明任何实例变量，并且从被直接使用。如果你向该类发送 `+alloc` 消息，你会得到一个*单例*实例。当你发送初始化消息时，你会得到两个子类之一的。\n\
    \n```objc\n@implementation IntPair\n\n- (Pair*)initWithInt: (int)a int: (int)b\n\
    {\n    first = a;\n    second = b;\n    return self;\n}\n\n- (NSString*)description\n\
    {\n    return [NSString stringWithFormat:@\"(%d, %d)\", first, second];\n}\n\n\
    - (float)firstFloat { return (float)first; }\n- (float)secondFloat { return (float)second;\
    \ }\n- (int)firstInt { return first; }\n- (int)secondInt { return second; }\n\n\
    @end\n```\n*来自 classCluster.m*\n\n这些具体子类都非常简单。它们都声明了两个实例变量：一个是 `int`，另一个是 `float`。它们各提供一个仅从父类调用的初始化器，然后覆盖这些方法。\n\
    \n此示例在父类中没有提供实用的方法。在实际实现中，你可能会在父类中实现比较或算术方法。或者，它们可能会在单独分类中提供。\n\n第 4 章：Objective-C\
    \ 常用模式\n\n类簇隐藏了实现的所有细节。你可以更改子类的任何方面，而不需要修改甚至重新编译使用它们的代码。\n\n这是为什么 Objective-C\
    \ 中的代码复用比 C++ 等语言常见的原因之一。在 Objective-C 中很容易产生具有公共接口和私有实现的代码，而不依赖实现的任何方面。\n\n#\
    \ 使用运行循环 (Run Loops)\n\n定义大多数复杂的 Objective-C 程序结构的设计模式是*运行循环*。通常情况下，运行循环等待来自一个或多个事件源的数据，然后响应它们执行代码，给了一种*事件驱动模型*。\n\
    \nFoundation 框架在 `NSRunLoop` 类中提供了运行循环。如果你正在编写应用程序，通常会为你创建一个该实例。你也可以在命令行工具中显式地创建一个。\n\
    \n应用程序中的主运行循环监听来自窗口服务器的事件，对应于按键、鼠标移动、触摸事件等。其他各种类隐式地向运行循环添加事件源。我们在第 8 章将看到的 `NSTimer`\
    \ 类为运行循环添加了定时器事件源，例如允许你在特定时间执行某些操作。\n\n第 16 章涵盖的通知机制允许你通过运行循环传递程序内任意事件的通知，你还可以使用\
    \ `NSFileHandle` 注册文件描述符活动。运行循环本身与内存管理有关。每个运行循环迭代都有自己的释放池（autorelease pool）。这意味着在运行循环迭代期间发送释放消息的对象将在迭代结束时销毁（除非在其他地方被保留）。由于这一点，以及运行循环用于传递来自用户输入的事件，将单个运行循环迭代中的工作量尽可能保持是一个好主意。\n\
    \n在大多数程序中，你不需要直接与运行循环交互。它在后台运行，而其他类提供了更方便的接口。\n\n```objc\n[[NSRunLoop currentRunLoop]\
    \ run];\n```\n*来自 timer.m*\n\n第 5 章：数字\n\n而在 Java 中，它被显式定义为“32 位有符号补码整数”。除了原始类型外，C\
    \ 还支持通过 `typedef` 关键字为现有类型定义新名称。此最常见的原因是规范没有对任何标准类型要求特定的大小，只需每个类型至少与前一个一样大。特别是，目前部署的平台上\
    \ `int` 分别为 16、32 位和 64 位，所以你不能依赖它们的任何特定大小。\n\nOS X 支持 ILP32 和 LP64 模式。这种缩写用于描述\
    \ C 的\n\n"
- fmt: "\ntypes have which sizes. `ILP32` means that `int`s, `long`s, and pointers\
    \ are 32 bits. `LP64` means that `long`s and pointers are 64-bit quantities, and\
    \ that, implicitly, other values are smaller.\n\nMicrosoft Windows, in contrast,\
    \ is an `LLP64` platform on 64-bit architectures; both `int` and `long` remain\
    \ 32 bits and only pointers and `long long`s are 64 bits. This causes a problem\
    \ if you assumed that you could safely cast a pointer to `long`—something that\
    \ works on almost every platform in the world, including Win32, but does not work\
    \ on Win64.\n\nThe problem of casting a pointer to an integer is a serious one.\
    \ The `long long` type is at least 64 bits, so on any current platform it is guaranteed\
    \ to be big enough to store any pointer, but on any 32- or 16-bit platform it\
    \ can be much too big.\n\n# Storing Numbers in Collections\n\nC99 introduced the\
    \ `intptr_t` typedef, which is exactly the size of a pointer. Apple introduced\
    \ an equivalent: `NSInteger`. This is used throughout the Cocoa frameworks and\
    \ is always the same size as a pointer. There is also an unsigned version, `NSNumber`.\n\
    \nIn GUI code, you will often come across `CGFloat` or `NSFloat`. These are equivalent\
    \ to each other. Both are the size of a pointer, making them `float`s on 32-bit\
    \ platforms and `double`s on 64-bit ones.\n\n```\nNSMutableArray *array = [NSMutableArray\
    \ array];\n[array addObject: [NSNumber numberWithInt: 12]];\n```\n*From: numberInArray.m*\n\
    \nAll of the standard Objective-C collection classes let you store objects, but\
    \ often you want to store primitive types in them as well. The solution to this\
    \ is *boxing*—wrapping a primitive type up in an object.\n\nThe `NSValue` class\
    \ hierarchy is used for this. `NSValue` is a class designed to wrap a single primitive\
    \ value. This class is quite generic, and is an example of a *class cluster*.\
    \ When you create an instance of an `NSValue`, you will get back some subclass,\
    \ specialized for storing different kinds of data. If you store a pointer in an\
    \ `NSValue`, you don’t want the instance to take up as much space as one containing\
    \ an `NSRect`—a C structure containing four `NSFloat`.\n\nOne concrete subclass\
    \ of `NSValue` is particularly important: `NSNumber`. This class is intended to\
    \ wrap single numerical values and can be initialized from any of the C standard\
    \ integer types.\n\nThe designated constructor for both of these classes is `+valueWithBytes:objCType`.\
    \ The first argument is a pointer to some value and the second is the *Objective-C\
    \ type encoding* of the type. Type encodings are strings representing a particular\
    \ type. They are used a lot for introspection in Objective-C; you can find out\
    \ the types of any method or instance variable in a class as a type encoding string\
    \ and then parse this to get the relevant compile-time types.\n\nYou can get the\
    \ type encoding of any type with the `@encode()` directive. This is analogous\
    \ to `sizeof()` in C, but instead of returning the size as an integer it returns\
    \ the type encoding as a C string. One very convenient trick when working with\
    \ type encodings is to use the `typeof()` GCC extension. This returns the type\
    \ of an expression. You can combine it with `@encode()`, like this:\n\n```\nNSValue\
    \ *value = [NSValue valueWithBytes: &aPrimitive objCType: @encode(typeof(aPrimitive))];\n\
    ```\nThis snippet will return an `NSValue` wrapping `aPrimitive`, and will work\
    \ regardless of the type of the primitive. You could wrap this in a macro, but\
    \ be careful not to pass it an expression with side effects if you do.\n\nNote\
    \ that you have to pass a pointer to the primitive value. This method will use\
    \ the type encoding to find out how big the primitive type is and will then copy\
    \ it.\n\nMore often, you will use one of the other constructors. For example,\
    \ if you want to create an `NSNumber` instance from an integer, you would do so\
    \ like this:\n\n```\nNSNumber *twelve = [NSNumber numberWithInt: 12];\n```\n\n\
    The resulting object can then be added to a collection. Unlike `NSValue`, `NSNumber`\
    \ instances are ordered, so you can sort collections containing `NSNumber` instances.\n\
    \n```\nNSArray *a = [NSArray arrayWithObjects:\n    [NSNumber numberWithUnsignedLongLong:\
    \ ULLONG_MAX],\n    [NSNumber numberWithInt: -2],\n    [NSNumber numberWithFloat:\
    \ 300.057],\n    [NSNumber numberWithInt: 1],\n    [NSNumber numberWithDouble:\
    \ 200.0123],\n    [NSNumber numberWithLongLong: LLONG_MIN],\n    nil];\n\nNSArray\
    \ *sorted = [a sortedArrayUsingSelector: @selector(compare:)];\nNSLog(@\"%@\"\
    \ , sorted);\n```\n*From: numberArray.m*\n\nThe `numberArray.m` example stores\
    \ a group of `NSNumber` instances in an array and then sorts them using the `-compare:`\
    \ selector. As you can see from the output, the ordering is enforced irrespective\
    \ of how the number was created.\n\n```\n2010-03-15 14:50:48.166 a.out[51465:903]\
    \ (\n\"-9223372036854775808\",\n\"-2\",\n\"1\",\n\"200.0123\",\n\"300.057\",\n\
    \"12\",\n\"42\"\n)\n```\n*Output from numberArray.m*\n\n# Performing Decimal Arithmetic\n\
    \nC gives you two options for working with numbers: integers and floating-point\
    \ values. Floating-point values are made of two components: a mantissa and an\
    \ exponent. Their value is two to the exponent, multiplied by the mantissa.\n\n\
    The problem with floating-point values is that they are binary. This means that\
    \ their precision is defined in terms of binary digits, which is not always what\
    \ you want. For a financial application, for example, you may need to store amounts\
    \ to exactly four decimal places. This is not possible with floating-point values;\
    \ a value such as 0.1 cannot be represented by any finite binary. A binary number\
    \ is the sum of a set of powers of two, just as a decimal number is a sum of powers\
    \ of ten. With fractional values, the digits after the radix point indicate halves,\
    \ quarters, eighths, and so on. If you try to create a value of 0.1 by adding\
    \ powers of two, you never succeed, although you get progressively closer. Exactly\
    \ the same thing happens when you try to create a third by adding powers of ten\
    \ (a three tenths, plus three hundredths, plus three thousands, and so on).\n\n\
    One solution is to use fixed-point arithmetic.\n\nRather than storing dollars,\
    \ you might store hundredths of a cent. You must then remember to normalize your\
    \ values, and you are limited by the range of an integer type. Objective-C provides\
    \ another option: decimal floating-point types.\n\nThe `NSDecimal` type is a C\
    \ structure that represents a decimal value. Somewhat strangely, there is no C\
    \ API for creating these. You must create an `NSDecimalNumber` instance and then\
    \ send it a `-decimalValue` message.\n\nYou then have two choices for arithmetic.\n\
    \n`NSDecimalNumber` instances are immutable. You can create new ones as a result\
    \ of arithmetic—for example, by sending a `decimalNumberByAdding:` message to\
    \ `one`.\n\nAlternatively, you can use the C API, which modifies the value of\
    \ the structure directly.\n\n```\nNSDecimalNumber *one = [NSDecimalNumber numberWithString:@\"\
    1\"];\nNSDecimalNumber *fortyTwo = [NSDecimalNumber numberWithString:@\"42\"];\n\
    NSDecimal sum = [one decimalValue];\nNSDecimal temp = [fortyTwo decimalValue];\n\
    NSDecimalAdd(&sum, &sum, &temp);\nNSDecimalNumber *result = [NSDecimalNumber numberWithDecimal:sum];\n\
    ```\n*From: decimal.m*\n"
