- fmt: "\nThe simplest way of implementing `NSSet` would be to compare every new object\
    \ to every existing object. This would be painfully slow, however, so fortunately\
    \ `NSSet` doesn’t work this way.\n\nInstead, it uses the `-hash` method. Every\
    \ object is expected to implement this method and return an integer hash value.\n\
    \nIf two objects are equal, they must have the same hash. Collections such as\
    \ `NSSet` put objects into buckets based on their hash values. When testing whether\
    \ an object is already in the set, it just has to test the objects that have the\
    \ same hash.\n\nA good hash is, therefore, important for good performance of these\
    \ collection classes.\n\nFortunately, `NSString`, which is the most commonly used\
    \ object in this kind of collection, already has a good hash implementation.\n\
    \nOne slight problem with this approach is that an object must not change its\
    \ hash while it is in a collection. This is impossible to enforce for mutable\
    \ objects without breaking some of the other rules. It is, therefore, important\
    \ not to modify objects while they are stored in a set.\n\nOne other kind of set\
    \ is `NSCountedSet`, which is a subclass of `NSMutableSet` that supports adding\
    \ the same object multiple times. This adds one method to `NSMutableSet`, `-countForObject:`,\
    \ which returns the number of times a particular object has been added to the\
    \ collection.\n\n**Note:**\n\nIn Java, and some other languages, a counted set\
    \ is called a `bag`.\n\nIt’s worth noting that, because `NSCountedSet` is a subclass\
    \ of `NSSet`, some of its methods are designed to allow `NSCountedSet` instances\
    \ to be used in place of `NSSet` instances. If you send a `-count` message to\
    \ any of the sets created in the example at the start of this section, you will\
    \ get the same value. If you iterate over any of the sets, you will get seven\
    \ objects. You can only tell if an object is in the counted set more than once\
    \ by sending a `-countForObject:` message to the set.\n\n## Creating a Dictionary\n\
    \n```objc\nNSMutableDictionary *dict = [NSMutableDictionary dictionaryWithObjectsAndKeys:\
    \ @ *\"one\", @ *\"1\", @ *\"two\", @ *\"2\", nil];\n[dict setObject: @ *\"three\"\
    * forKey: @ *\"3\" ];\n```\n*From: dictionary.m*\n\nA dictionary, often called\
    \ a `map` or `associative array`, provides a collection of objects indexed by\
    \ other objects. Most commonly, dictionaries are indexed by strings. This is not\
    \ the only option, but there are some restrictions on the classes that can be\
    \ used as keys in dictionaries.\n\nDictionaries are similar to sets, and the same\
    \ constraints apply. Objects used as keys must implement the `-hash` and `-isEqual:`\
    \ methods, returning `YES` on comparison and the same hash value if they are equal.\
    \ The hash value must not change as long as they are in the collection.\n\nAdditionally,\
    \ keys must implement the `NSCopying` protocol. When you add a key-value pair\
    \ to a dictionary, the value will be retained, but the key will be copied. This\
    \ is done to prevent it from being modified accidentally.\n\nIf you pass an immutable\
    \ object, such as an `NSString`, this has the same effect as retaining it. If\
    \ you pass an `NSMutableString`, then the dictionary will use an immutable copy.\n\
    \nFinally, it’s worth remembering that only dictionaries that use strings as keys\
    \ will work with *key-value coding* (see Chapter 11). You should also be very\
    \ careful when using different classes as keys in the same dictionary that their\
    \ comparison methods return the correct values when passed instances of the other\
    \ classes.\n\nThe most common method you will use on a dictionary is `-objectForKey:`,\
    \ which returns the object associated with the given key, or `nil` if there is\
    \ no object set for that key. For mutable dictionaries, you will typically use\
    \ the `-setObject:forKey:` method to set key-value pairs in a dictionary.\n\n\
    ## Iterating Over a Collection\n\n```objc\nNSLog(@ *\"The Objective-C 1 way:\"\
    \ );\nNSEnumerator *e=[a objectEnumerator];\nfor (id obj=[e nextObject]; nil!=obj\
    \ ; obj=[e nextObject])\n{\n    [obj print];\n}\nNSLog(@ *\"Fast enumeration:\"\
    \ );\nfor (id obj in a)\n{\n    [obj print];\n}\nNSLog(@ *\"Using blocks:\" );\n\
    [a enumerateObjectsUsingBlock:^(id obj, NSUInteger idx, BOOL *stop)\n{\n    [obj\
    \ print];\n}];\nNSLog(@ *\"Avoiding enumeration:\" );\n[a makeObjectsPerformSelector:@selector(print)];\n\
    ```\n*From: enum.m*\n\nOne of the most common tasks you perform with collections\
    \ is to iterate over every element in the collection and do some processing. There\
    \ are a lot of ways of doing this in Objective-C. Because it’s such a common task,\
    \ new ways of doing it keep being added.\n\nFor arrays, you can go through every\
    \ single index from 0 to `[array count]` and send an `-objectAtIndex:` message.\
    \ This is very inefficient. The traditional way of enumerating over a collection\
    \ is to use an enumeration; an instance of an `NSEnumerator` subclass.\n\n**Note:**\n\
    \nIf you are coming from Java, mentally substitute the word `iterator` for enumerator\
    \ and you will find most of the patterns you are familiar with still work. You\
    \ can get an enumerator for a collection by sending it an `-objectEnumerator`\
    \ message. This object is very simple. It responds to only two messages, and you’re\
    \ only likely to use one of them: `-nextObject`. This returns the next object\
    \ in the collection, or `nil` if you’ve enumerated all of the objects that collection\
    \ contains.\n\nWith Objective-C 2, Apple introduced *fast enumeration*. You can\
    \ use this with any collections that implement the `NSFastEnumeration` protocol.\
    \ This protocol defines a method for getting several objects with a single send.\
    \ The exact number is defined by the caller and the receiver. The compiler allocates\
    \ a buffer and passes a pointer to it to the receiver. The receiver may then copy\
    \ some objects into this buffer or, if it stores data internally as a C array,\
    \ return a pointer to its internal store.\n\nThe method in this protocol is used\
    \ by a new flow-control construct, the `for in` loop. When you use this, the compiler\
    \ will produce two nested loops. In the outer loop, it will call the fast enumeration\
    \ method, getting the next few objects from the collection. In the inner loop,\
    \ it will iterate over this C array.\n\nYou can use fast enumeration without compiler\
    \ support. The `GSFastEnumeration.h` header in GNUstep provides `FOR_IN` and `END_FOR_IN`\
    \ macros that expand to produce the same code the compiler will use for `for in`\
    \ loops. These macros are quite complicated, so it’s better to not try calling\
    \ the fast enumeration methods yourself.\n\nWith OS X 10.6, Apple introduced another\
    \ new way of iterating over collections: using blocks. Blocks are a new language\
    \ extension to C, but designed for close interoperation with Objective-C. Like\
    \ Objective-C objects, blocks have an `isa` pointer. This points to a private\
    \ class that implements the `NSObject` protocol, so you can store blocks in collections.\
    \ They also support introspection using Objective-C type encodings, although this\
    \ support is not yet part of their public interface on OS X.\n\nMost of the collection\
    \ classes now implement methods for enumeration using blocks. Using these can\
    \ be convenient, although it does limit the portability of your code. You can\
    \ perform concurrent enumerations with blocks, by passing `NSEnumerationConcurrent`\
    \ as the first argument to a method such as `-enumerateObjectsWithOptions:usingBlock:`.\
    \ This is generally only likely to give a performance gain if the block will take\
    \ a long time to execute on each element.\n"
