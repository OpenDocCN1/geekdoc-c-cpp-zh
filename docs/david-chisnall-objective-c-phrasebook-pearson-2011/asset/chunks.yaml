  trans: "\n异常处理让内存管理变得稍微复杂。如果你在方法中创建了一个新对象并在结束时释放它，你必须考虑到一个事实：异常本质上是伪装过的“非局部跳转”（non-local\
    \ goto），并且突然有很多种方法可以返回你的方法。每一个函数调用或消息发送都变成了一个潜在的返回路径。\n\n你可以通过在 `@try` 块末尾添加一个\
    \ `@finally` 块来轻松地解决这个问题。该块中的代码将始终被执行，无论你是通过到达末尾退出 `@try` 块，还是通过抛出异常退出的。\n\n###\
    \ Note\n\n在 Java 中，你也可以将异常用作局部跳转，通过抛出异常并在同一方法中捕获它，向虚拟机宣告某条代码路径是非常的。这在 Objective-C\
    \ 中也是可能的，但效率极低。`@throw()` 语句会调用 `objc_exception_throw()` 函数，该函数会调用一个展开（unwind）库的函数。\n\
    \n这将读取栈帧的 DWARF 数据并调用 Objective-C 的个性函数（personality function）。该函数将读取更多的 DWARF\
    \ 数据，将异常的类与 catch 块的类进行比较，然后将指令指针设置为 catch 语句的地址。\n\n在 Java 中，虚拟机会将此翻译为到 catch\
    \ 块的无条件跳转。如果你必须使用这种模式，请在 Objective-C 中使用 C 语言的 `goto` 语句。然而，最好完全避免，寻找一个不忽视结构化编程理念的解决方案。\n\
    \n你可能会异常遇到的另一个问题是重新抛出异常对象。异常对象通常是自动释放（autoreleased）的。这意味着，在手动内存管理下，它们会在当前自动释放池被删除时被删除。这在大多数代码中并不是问题。你最常用的自动释放池在整个运行循环期间持续存在。\n\
    \n然而，有时你会创建自己的自动释放池。如果你在 `@finally` 块中释放了自动释放池（这似乎是显而易见的解决方案），你会遇到一个问题。异常对象会在展开栈帧时被删除，而上一个栈帧可能会在查找异常类型时因引用了悬空指针而崩溃。\n\
    \n为了避免这种情况，你需要确保在删除自动释放池之前保留（retain）异常对象，并在之后再次对其自动释放。这就是为什么抛出除 `NSException`\
    \ 对象以外的任何对象的坏主意之一。任何遵循 Apple 文档中此类建议的人，最终得到的代码只能正确处理 `NSException` 对象，并过早销毁任何其他对象类型。\n\
    \n要正确实现这一点，你需要一个全捕获语句：一个带有 `id` 类型的 `@catch` 子句。这将捕获所有的 Objective-C 异常。记住，C++\
    \ 异常仍然不会在此块中被捕获，所以如果你在使用外部异常进行展开，仍然需要一个 `@finally` 块来处理清理。你可以在 `@catch` 句中将自动释放池的指针设置为\
    \ `nil`，以防止其释放两次。\n\n### 传递错误代理 (Passing Error Delegates)\n\n```objc\nNSFileManager\
    \ *fm = [NSFileManager defaultManager];\n[fm copyPath: source toPath: destination\
    \ handler: [ErrorHandler new]];\n```\n*来自 errordelegate.m*\n\n在 Common Lisp 中，你有*可恢复*（resumable）异常的概念。这与\
    \ Objective-C、Java、C++ 等中常见的展开异常（unwinding exceptions）形成对比。可恢复异常不会展开堆栈；它运行异常处理代码然后继续执行。\n\
    \n在 Objective-C 中没有直接的对应物，但你可以通过将*错误代理*（error delegate）作为参数传递给方法来实现结果。`NSFileHandle`\
    \ 中的旧版 API 就是这样工作的。它们的最后一个参数是一个对象，当操作遇到问题时会向其发送消息。该方法返回一个 `BOOL` 值，指示操作是否应该继续。你可以通过在错误代理没有处理条件时抛出异常，将此与代码中的展开异常结合起来。\n\
    \n我在 LanguageKit 框架中使用了这种模式来报告编译器错误和警告。当编译器遇到错误时，它会调用错误代理中的一个方法。该方法的默认实现只是将消息转储到控制台，但其他实现会转换抽象语法树以移除错误。如果它返回\
    \ `YES`，编译器会回溯并重新检查。如果它返回 `NO`，编译器会抛出一个异常，该异常由调用编译器的代码捕获。\n\n通常，在操作过程中任何可能遇到可修复问题的地方，都应该使用这种模式。例如，在加载引用其他其他的文件时可以使用它。如果引用的文件之一缺失，默认选项是终止。然而，错误代理可以提供新的路径，通过使用某些修复的翻译或提示用户来实现。\n\
    \n### 返回错误值 (Returning Error Values)\n\n```objc\n- (BOOL)trySomething;\n- (id)tryToDoSomethingWithObject:\
    \ (id)anObject error: (NSError**)e;\n```\n*来自 errorReturn.m*\n\n### 使用 NSError\n\
    \n在 C 语言中，常见的模式是成功时返回零，返回某些非零值表示错误条件。这在 Objective-C 中不那么流行，但返回一个表示操作是否成功的 `BOOL`\
    \ 值是相对常见的。大多数时候，这是通过以某种方式变动接收者的方法来实现的。当你调用这类方法时，是为了产生某种变化，而不是获取一个值。这种模式的例子是 `NSStream`\
    \ 上的 `setProperty:forKey:` 方法。它尝试设置流的属性，如果成功则返回 `YES`。注意，这与 C 语言模式相反，后者在失败时返回\
    \ true。\n\n```objc\nNSError *error = nil;\nNSStringEncoding enc;\nNSString *str\
    \ = [NSString stringContentsOfFile: @\"DoesNotExist\" usedEncoding:&enc error:&error];\n\
    if (nil != error) {\n    NSLog(@\"Error: %@\", [error localizedDescription]);\n\
    }\n```\n*来自 nserror.m*\n\nApple 在引入 OS X 10.2 时引入的少数方法接受一个 `NSString**` 作为参数。这被用于返回报告错误的第二个值。错误对象看起来与异常对象非常相似。它有一个名称（称为*域*，domain）和一个关联的字典。与异常对象不同，字典有几个预定义的键。这些包括本地化错误描述。你可以在不进行额外处理的情况下将其展示给用户。\n\
    \n错误对象有时还包含一个恢复策略。*恢复者*（recovery attempter）对象可以尝试自动从错误中恢复。对于某些错误这是可能的，但通常当你尝试执行某些可能但不安全的操作时，就会遇到错误。当这种情况发生时，你应该将错误展示给用户，然后调用恢复者。\n\
    \n"
- fmt: "If you have used Common Lisp, this pattern will seem familiar as an ad-hoc\
    \ form of restartable exception.\n\n![Image 14](index-243_1.png)\n\n# CHAPTER\
    \ 13: Accessing Directories and Files\n\nthe workspace process is not guaranteed\
    \ to be present—for example, in command-line tools that might be run over a remote\
    \ connection or in server code.\n\nThe UIKit framework doesn’t have an equivalent\
    \ of `NSWorkspace`. If you are targeting Cocoa Touch, you have to use the lower-level\
    \ APIs.\n\n## Reading a File\n\n```objc\nNSData *copy = [NSData dataWithContentsOfFile:\
    \ file];\nNSData *mapped = [NSData dataWithContentsOfMappedFile: file];\nNSData\
    \ *read = [[NSFileHandle fileHandleForReadingAtPath: file] readDataToEndOfFile];\n\
    ```*From: readFile.m*\n\nUNIX systems typically offer two ways of accessing a\
    \ file: The `read()` and `mmap()` system calls. Most other systems—at least those\
    \ that run on hardware with a memory management unit (`MMU`)—have equivalents\
    \ of these. The first copies a stream of bytes from a file into a buffer. The\
    \ second maps the file’s data into a region of memory.\n\nFoundation provides\
    \ two classes that correspond roughly to these operations. The `NSData` class\
    \ encapsulates a region of memory containing untyped data. You can create instances\
    \ of this class from files with a variety of options.\n\nFor small files, you\
    \ can just use the version that wraps the `read()` call and reads a copy of the\
    \ file’s data into memory. For larger files, you may wish to use `+dataWithContentsOfMappedFile:`.\n\
    \nThe advantage of the latter approach is that it interacts very well with the\
    \ operating system’s virtual memory subsystem. If you run out of physical memory,\
    \ you don’t need to allocate swap space for evicting pages that contain data from\
    \ a mapped file; you can just discard them and read them back in the next time\
    \ they are accessed.\n\nThis is very useful if you are on a platform with very\
    \ little memory and no virtual memory. The iPhones before the 3GS, for example,\
    \ only have 128MB of RAM, and none of them have any swap space. If you read a\
    \ 4MB file into memory, you have used up a large chunk of the space available\
    \ to your application.\n\nIf, in contrast, you create a mapped data object representing\
    \ the file, the system will read in the data in 4KB chunks, as it’s needed, and\
    \ evict it when it is no longer required. If you run out of memory when creating\
    \ a new object, for example, the kernel will evict the mapped file from memory\
    \ to make space. It can’t do this if you had read the file, so it would just run\
    \ out of memory and kill your application.\n\nIf you only want to read a bit of\
    \ a file at a time, you should use `NSFileHandle`. This class wraps a file descriptor\
    \ and implements Objective-C versions of the same basic operations that the C\
    \ standard library supports. You can read all of the data from a file handle in\
    \ a single operation, but more often you will read the next available bit.\n\n\
    You can read a fixed-size chunk of data by sending the file handle a `-readDataOfLength:`\
    \ message. Most of the other methods on this class are not particularly interesting\
    \ for reading data from a file; they are intended for interacting with sockets.\
    \ We’ll look at this class again in Chapter 17.\n\n## Moving and Copying Files\n\
    \n```objc\nNSFileManager *fm = [NSFileManager new];\nif (shouldMove) {\n    [fm\
    \ copyItemAtPath: source toPath: destination error: nil];\n} else {\n    [fm moveItemAtPath:\
    \ source toPath: destination error: nil];\n}\n```*From: fileCopy.m*\n\nThe `NSFileManager`\
    \ class encapsulates the filesystem as a whole and lets you manipulate it. This\
    \ class exposes to Objective-C developers the same kind of features that Apple’s\
    \ Finder and the Windows Explorer expose to the user.\n\nPrior to OS X 10.5, the\
    \ methods you used took an object as the last parameter. This object was then\
    \ sent messages while the copy or move operation proceeded. These messages, for\
    \ example, asked whether to proceed after an error.\n\nWith 10.5, Apple decided\
    \ to change the interface considerably. The methods now use the new error-reporting\
    \ pattern that we discussed in Chapter 12, so the last argument is a pointer to\
    \ an `NSError*` used to return an error. The messages are now sent to the object’s\
    \ delegate.\n\nThis means that you must now only use an `NSFileManager` from a\
    \ single thread. Prior to 10.5, this class was an example of the singleton pattern.\
    \ It was very common to cache the return value from the `+defaultManager` method,\
    \ which returned the singleton instance. Now, this is unsafe if code that uses\
    \ the cached version might be called from different threads.\n\nIf you are writing\
    \ new code, you should make sure you create a new `NSFileManager` instance every\
    \ time you want to use it and destroy it afterward, otherwise you may end up with\
    \ messages being sent to the wrong delegate. If you don’t, two threads can concurrently\
    \ set the delegate for the singleton file manager and one receive all of the notifications,\
    \ rather than each receive the notifications it’s interested in.\n\n**Note:**\
    \ This is an example of thoughtless software design. A better solution would have\
    \ been to store the delegate in the thread dictionary (see Chapter 14). If you\
    \ are ever in the position of making similar changes to a singleton class, consider\
    \ this approach, or simply retain the extra parameter for a callback. Don’t require\
    \ invasive changes to existing code to support your new interfaces.\n\nIf you\
    \ use the old, deprecated methods on the file manager, it is thread safe with\
    \ the singleton.\n\nIf you are not calling any methods that send delegate messages,\
    \ it is also safe to use the singleton. This is unfortunate, because it means\
    \ you may need to create a new `NSFileManager` instance when you copy a file,\
    \ even if you already have a pointer to the singleton instance.\n\n## Getting\
    \ File Attributes\n\n```objc\nNSFileManager *fm = [NSFileManager defaultManager];\n\
    NSDictionary *attrs = [fm attributesOfItemAtPath: @ *\"fileAttributes.m\"* error:\
    \ NULL];\nNSString *fileType = [attrs fileType];\nNSNumber *creator = [attrs objectForKey:\
    \ NSFileHFreatorCode];\n```*From: fileAttributes.m*\n\nThe `NSFileManager` class\
    \ wraps most of the standard POSIX manipulation functions. In C, you would typically\
    \ use the `stat()` function to find information about a file.\n\nThis function\
    \ takes a pointer to a structure as an argument and fills it in with information\
    \ about the file.\n\nThe limitation of this is obvious: You can’t add new fields\
    \ to the structure without breaking all existing code that uses it. The `NSFileManager`\
    \ version is much more flexible.\n\nThe `-attributesOfItemAtPath:error:` method\
    \ returns an `NSDictionary`, and it is trivial to add extra entries to a dictionary\
    \ without breaking binary compatibility.\n\nOne thing you will note from this\
    \ example is that we can send a `-fileType` message to the dictionary to get the\
    \ value. This method is part of `NSDictionary` and returns the dictionary entry\
    \ that corresponds to the `NSFileType` key. There are a few other, similar dictionary\
    \ methods.\n\nOn OS X, you have a few more bits of file metadata than on other\
    \ POSIX platforms.\n\nHFS+ stores a creator code and a type code for each file.\
    \ These are not used as much now, but on Classic MacOS they were used instead\
    \ of file extensions to determine the correct application to open a file.\n\n\
    ### Manipulating Paths\n\n```objc\nNSString *home = @ *\"~\"* ;\nNSString *full\
    \ = [home stringExpandingTildeInPath];\nNSString *users = [full stringByDeletingLastPathComponent];\n\
    NSString *file = [users stringByAppendingPathComponent: @ *\"users\"*];\nNSString\
    \ *fileWithExtension = [file stringByAppendingPathExtension: @ *\"db\"* ];\n```*From:\
    \ path.m*\n"
