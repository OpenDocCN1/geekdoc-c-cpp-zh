    对象（objects），我们将在在本章末尾介绍它们，然后你可以将其作为你所提供的对象的名称，并忽略 Bonjour 系统与 DNS 相关的底层实现。对于其他内容，你发布的端口通常更有用，而名称将是你向用户展示的标识。


    你使用 `NSNetServiceBrowser` 类来搜索同等节点。这个类的正确用法稍微有点棘手。发布服务是同步的；你向你的 `NSNetService`
    实例发送一个 `-publish` 消息，服务就会发布。搜索是异步的，并且需要活跃的 `run loop`（运行循环）。


    当你向浏览器发送搜索消息时，它会传输一个 DNS 请求。这可能需要一段时间才能收到响应，而你可能不想在搜索时阻止用户进行任何操作，因此该方法会立即返回。


    当收到响应时，该类将向其代理（delegate）发送带有带有 `NSNetService` 实例的消息，描述它找到的每个服务器。它将继续监听，直到你向它发送
    `-stop` 消息。


    在很多情况下，你永远不会发送这条消息。你可以让浏览器在进程的生命周期内在后台运行，每当局域网出现新节点时，你都会收到通知。然后你可以触发用户界面的更新，显示
    **正在寻找网络节点** 以及新节点。这就是像 iTunes 这样的程序，当新的共享播放列表在网络上出现时，将其添加到库中。


