    *From: singleton.m*


    Singletons are the object-oriented version of global variables. A singleton class
    only has one instance. There are lots of these in Objective-C, but they all follow
    the same general pattern.


    The example at the start of this section is a skeleton class that only permits
    a single instance of itself to be created. This follows the convention of returning
    the singleton instance


    88


    CHAPTER 4: **Common Objective-C Patterns** in response to a +sharedInstance message.
    A lot of singleton classes put the class name in this message name, in place of
    Instance.


    To get the shared application object in an AppKit application, for example, you
    will send a +sharedApplication message to NSApplication. This class is a special
    case of a singleton, because it stores its shared instance in the global NSApp
    variable. If the application has already started, you can use this variable directly,
    avoiding the message send to get the application object.


    The most common mistake with singletons is to introduce a race condition in creation.
    This particular singleton is storing an instance of itself in a private variable.
    It it tempting to create this in the +sharedInstance method.


    That will work fine for single-threaded applications, but what about multithreaded
    ones?


    If you send the +sharedInstance message simultaneously from two threads, what
    happens?


    Both might test the variable, find that it hasn’t been created, and then create
    it. To get around this, you could use a lock.


    A much simpler solution is to create the instance in the +initialize method. This
    method is called by the runtime the first time a message is sent to the class.
    It is the runtime’s responsibility to ensure that this method completes before
    any messages are delivered to


    **Delegation**


    89


    the class by other threads.1


    **Note:**


    The Apple documentation


    recommends using **@synchronized**(**self**) in the


    +sharedInstance method for creating singletons.


    That approach is both significantly slower and requires more code than the approach
    proposed in this section, so it has little to recommend it.


    You don’t need to override +allocWithZone: in a singleton, but it provides a little
    bit extra runtime checking if you do. The sample code will throw an exception
    if you try to allocate a new instance of the class after the singleton instance
    has been created.


    Note the tests in both the +allocWithZone: and +initialize methods. These are
    needed for subclassing. You don’t want to throw an exception if someone creates
    a subclass of your singleton object. Subclassing singletons is quite tricky, so
    you may skip this extra test if you don’t want to support it.


    **Delegation**


    Objective-C doesn’t support multiple inheritance. This is not a huge limitation,
    because it’s very hard to use multiple inheritance 1There is a long-standing bug
    in the GCC runtime that prevents this from working correctly, but it’s fixed in
    the GNUstep runtime.


    90


    CHAPTER 4: **Common Objective-C Patterns** well, but with some problems it seems
    like the natural solution.


    The idea behind the *delegation pattern* is similar to that behind inheritance
    and prototypes: You allow one object to define some subset of the behavior of
    another object.


    You won’t see this in the Foundation framework much, but it’s very common in AppKit
    or UIKit code. Each user interface object uses delegation to allow you to define
    what happens in response to user interface events.


    Several patterns are related to delegation, and they are all related to the general
    rule that you should favor object composition over inheritance.


    This is important for loose coupling, because it makes it much easier to reuse
    the code.


    If you have a C++ class with three superclasses providing some aspects of its
    behavior, then it is a lot harder to modify than an Objective-C class delegating
    aspects of its functionality to three other classes.


