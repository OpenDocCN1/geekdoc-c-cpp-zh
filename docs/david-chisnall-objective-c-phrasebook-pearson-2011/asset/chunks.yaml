    The simplest way of parsing command-line arguments, as we saw in the last chapter,
    is to use the `NSArgumentDomain` in `NSUserDefaults`.


    When an Objective-C program is started, the command-line arguments are all read
    and inserted into a dictionary, which is used by the defaults system.


    This makes it very easy to provide a set of command-line arguments along with
    (configurable) default values. You never interact with the arguments directly
    when you use this approach. Instead, you ask the defaults system for a value for
    a key, and it returns something that may be from a persistent storage location
    or from the command line.


    In the `EtoileFoundation` framework, we provide an `ETGetOptionsDictionary()`
    function, which wraps the standard `getopt()` function. This provides an Objective-C
    way of using UNIX-style command-line arguments. You can use this if you are writing
    a UNIX-style tool in Objective-C. Otherwise, it is better to use the defaults
    system.


    # CHAPTER 10: The Environment


    ## Accessing the User’s Locale


    ```objective-c

    NSLocale *l = [NSLocale autoupdatingCurrentLocale];

    NSString *language = [l objectForKey: NSLocaleIdentifier];

    NSString *humanReadableLanguage = [l displayNameForKey: NSLocaleIdentifier value:
    language];

    ```

    *From: locale.m*


    If your program interacts with the user directly in any way, you will probably
    want to localize it at some point. Objective-C provides a lot of rich facilities
    for doing this.


    The `NSLocale` object encapsulates a locale. There are several ways of getting
    instances of this class. If you send it a `+systemLocale` message, you will get
    the system locale.


    However, this is not something you should normally use. It is the fallback locale
    for when the user’s locale does not work correctly.


    You can get the user’s current locale in two ways. Sending a `+currentLocale`
    message returns a locale object that encapsulates the current locale. If the user
    selects a new locale, a `NSCurrentLocaleDidChangeNotification` will be posted,
    and you can get a new locale object for the new locale.


    Alternatively, you can send an `+autoupdatingCurrentLocale` message to the class.
    This returns a locale object that will always represent the current locale, even
    if it changes. This can be slightly confusing because two subsequent calls to
    the same method with the same argument on this object might return different values.


    It is important to avoid caching data returned from locale objects, if you want
    to support changing locale while the program is running. If you are presenting
    things to the user that remain on the screen, you should make sure that you monitor
    the notification and update them, even if you are using an autoupdating locale
    object.


    ## Supporting Sudden Termination


    ```objective-c

    NSProcessInfo *p = [NSProcessInfo processInfo];

    [p enableSuddenTermination];

    // Do initialization

    [p disableSuddenTermination];

    // Do other things that can’t

    // be interrupted here.

    modifyFiles();

    [p enableSuddenTermination];

    ```

    *From: suddenDeath.m*


    Traditionally, there are two options for process termination. A process can exit
    gracefully, by reaching a safe place to stop and then calling `exit()` or reaching
    the `return` statement in the `main()` function. Alternatively, it can exit abruptly,
    by receiving an unhandled signal, including something like a segmentation fault.


    In both cases, the kernel will reclaim all of its shared resources, but in the
    case of abrupt termination some of these resources may have been left in an inconsistent
    state. A typical example of this is a file in the course of being modified.


    This used to be a big problem with complex applications, such as word processors.
    They would open the file for writing, start modifying it, then crash, leaving
    the file in a state where it was very difficult to recover the contents.


    You can avoid this by using the atomic writing facilities on most Foundation objects,
    which write to a temporary file and then rename it, so the write either succeeds
    entirely or fails entirely—it doesn’t even half succeed.


    With OS X 10.6, Apple introduced the sudden termination mechanism. The theory
    behind this was that a lot of programs spend a lot of time on exit running destructors
    for objects that have no effects other than to release memory that the operating
    system will reclaim anyway. With sudden termination, a process can advertise that
    it doesn’t have any unsaved data. The operating system is then free to kill it
    abruptly, rather than request that it exit gracefully.


    This is particularly useful for long-running background tasks that are idle for
    a long time. They will generally be swapped out by the kernel. When you ask them
    to exit gracefully, a lot of code and data needs to be paged in to handle the
    exit. With sudden termination, the pages in the swap file will just be flagged
    as available for reuse.


    Supporting sudden termination in your application is very easy. You call two methods
    on `NSProcessInfo`, one on either side of some action that can’t be interrupted.


    **Note:** If you use `AppKit` with the `NSDocument` infrastructure, you don’t
    need to do anything. Your application will be marked as not supporting sudden
    termination when any documents have unsaved data.


    These methods are called `-disableSuddenTermination` and `-enableSuddenTermination`,
    but the names are slightly misleading. They don’t actually enable and disable
    sudden termination, they modify a counter. When the counter reaches 0, the application
    is marked as being killable.


    This means that you can use them in different threads or nest them without any
    problems. The counter starts set to one, so you must explicitly send an `-enableSuddenTermination`
    message to the process info object to enable it. If you are creating an application,
    you can avoid this by setting a key in the application bundle’s property list.


    Cocoa applications, as opposed to command-line tools, are typically distributed
    as bundles. These are directories that should be treated as files by graphical
    file managers. NeXT used them very effectively to store binaries for different
    operating systems in the same application, allowing a file server to contain a
    single application for OPENSTEP, Solaris, and even Windows. One of the things
    this bundle contains is a property list, called `info.plist`, which describes
    some attributes about the application, such as the name of its principle class,
    the resources to load at startup, and so on. The sudden termination state is one
    of these attributes.


    # CHAPTER 11: Key-Value Coding


    ## Accessing Values by Key


    ```objective-c

    [object setValue: @"42" forKey: @"integer"];

    int value = [[object valueForKey: @"integer"] intValue];

    NSCAssert(value == 42, @"Value set and retrieved");

    ```

    *From: kvc.m*


    Objects manipulated via KVC look much like dictionaries. The `NSDictionary` class
    is, itself, KVC compliant, although you typically don’t use the KVC methods when
    using it.


    The two most common methods for interacting with KVC-compliant objects are `-valueForKey:`
    and `-setValue:forKey:`. The `-objectForKey:` method on `NSDictionary` behaves
    in almost the same way for retrieving values. The two set methods on `NSDictionary`
    work slightly differently.


    The first thing you will notice is that you get a compile-time warning if you
    use `-setObject:forKey:` on an immutable dictionary. You won’t if you


    a key or key path and have


