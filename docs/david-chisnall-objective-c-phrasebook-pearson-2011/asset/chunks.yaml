    With 10.6, Apple introduced *blocks* to the C


    language. Although these are a C language extension, they are most often used
    in conjunction with Objective-C.


    Blocks are *closures*. The name comes from Smalltalk, where the BlockClosure class
    encapsulates closures. The syntax for creating blocks is quite ugly. It is based
    on the C syntax for function pointers, but with a caret replacing the asterisk.


    Blocks can be used almost exactly like function


    **Using Closures**


    57


    pointers. You can call them just like functions, but you can’t cast them to function
    pointers because they have a different calling convention.


    Just like methods, a block has a hidden argument.


    In the example, the getCounter() function returns a new block that implements
    a counter.


    Every time you call this block, it returns a value one greater than the last time
    you called it. This works because the counter variable in the scope where the
    block was created is declared with the __block specifier.


    Any variables on the stack that blocks reference will be copied to the heap and
    reference counted.


    When you call _Block_copy(), the block itself is copied to the heap if it’s on
    the stack, or has its reference count incremented if it is not.


    Each block returned by the getCounter() function in the example has a copy of
    the counter variable, because it is an automatic (stack) variable, and so subsequent
    calls to the function are creating a new version.


    In the latest version of the Foundation framework, you will find a lot of methods
    that take blocks as arguments. You can, for example, iterate over an array with
    a block as an argument.


    Blocks don’t add any expressiveness to the C


    language. A block is just a function pointer and a data pointer hidden inside
    a single structure, with some extra logic in the compiler to insert


    58


    CHAPTER 2: **An Objective-C Primer**


    the data pointer as a hidden argument to the function when it is called.


    This doesn’t mean that blocks are not useful.


    After all, the same is true of Objective-C; it doesn’t let you do anything that
    you can’t do in C, it just adds some syntactic sugar that makes some things easier.


    Like Objective-C objects, blocks have an isa pointer and can be sent messages.
    They are instances of the NSBlock private abstract class, which implements the
    NSCopying protocol.


    Most of the object-like behavior of blocks is undocumented. You can store them
    in Objective-C collections, but don’t depend on their ability to understand any
    specific messages. With the latest versions of Clang, blocks also support introspection,
    exposing their types as Objective-C type encodings.


    We’ll look at blocks in more detail in Chapter 15.


