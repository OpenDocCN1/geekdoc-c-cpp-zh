    Standard C does not provide a way of getting at program arguments outside of the
    main() function. The GNU C standard library provides some extensions for accessing
    them after program start, and on most UNIX-like platforms you can read them from
    the /proc filesystem, but there’s no simple way of getting them in a portable
    way from C code.


    With Objective-C, you can always get at the arguments by sending an -arguments
    message to NSProcessInfo. This returns an NSArray containing Objective-C strings
    for all of the options. You can then process the arguments in any way you like.


    **Parsing Command-Line Arguments** 189


