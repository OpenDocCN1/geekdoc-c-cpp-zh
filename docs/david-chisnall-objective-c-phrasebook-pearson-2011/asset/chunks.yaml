    ## CHAPTER 2: An Objective-C Primer


    intended to be used with C libraries, rather than as a standalone language. Now,
    most Objective-C code uses something based on the NeXT Foundation framework—either
    Apple’s `Foundation`, the GNUstep Base library, or `libFoundation`—as a standard
    library. This provides things like reference-counted memory management, standard
    data structures, forwarding mechanisms, and so on.


    Much of what you would think of as part of the Objective-C language is really
    provided by the `Foundation` framework. It is possible to use Objective-C without
    Foundation, but it’s the sort of thing people do to prove that they can, not because
    it’s actually an intelligent thing to do.


    ### Declaring Objective-C Types


    ```objc

    NSMutableArray *mutableArray = [NSMutableArray new];

    NSArray *array = mutableArray;

    NSObject *object = array;

    id obj = mutableArray;

    mutableArray = (NSMutableArray*)object;

    mutableArray = obj;

    ```

    *From: cast.m*


    Objective-C, as its name implies, adds objects to C. Specifically, objects following
    the Smalltalk model, which are instances of classes. Objects are always allocated
    on the heap and so are always referenced by pointer.


    In the first implementations of Objective-C, which produced pure C from Objective-C,
    classes were turned into structure definitions describing the layout of the objects.
    You can still see some legacy of this in GCC error messages, which will occasionally
    refer to objects as “structures.”


    In C, you need an explicit cast to turn any structure pointer into any other kind
    of structure pointer. This rule is relaxed slightly for Objective-C. The layout
    of any object is defined by the instance variables `(ivars)` in the root class,
    then by the instance variables in each subsequent class down the hierarchy. Subclasses
    can only add new instance variables, not remove or rearrange ones from the superclasses.
    This means that it is always safe, in terms of memory layout, to cast a pointer
    to an instance of one class to a pointer to an instance of another.


    It is also safe from the perspective of the object-oriented type system; any subclass
    will always respond to all of the messages that the superclass responds to.


    Object pointers in Objective-C are identified by the name of the class, followed
    by a star, just as structure pointers are in C, although without the `struct`
    keyword. You can always cast a pointer to an instance of one class to a pointer
    to an instance of its superclass implicitly.


    This works even for indirect superclasses. For example, `NSMutableArray` is a
    subclass of `NSArray`, which is a subclass of `NSObject`. You can cast an `NSMutableArray`
    to an `NSArray` or to an `NSObject`. Casting in the opposite direction, however,
    requires an explicit cast.


    Objective-C also introduces a new pointer type: `id`. This is roughly analogous
    to `void*`, when it comes to casting rules. You may cast any object pointer to
    `id` and you may cast `id` to any object pointer type, implicitly.


    If you are used to an untyped language, such as Smalltalk, Ruby, or Python, then
    it can be tempting to use the `id` type exclusively. This is mostly safe, although
    there is one exception. Objective-C uses the name of a message for lookup, and
    does not include any type information. This means that you can declare two different
    methods (on different classes) with the same name but different types.


    When the compiler is generating a message send, it uses the type of the receiver
    to determine the layout of the stack frame. When there is only one method advertised
    anywhere with that name, the type information is not required.


    Static typing is also required if you want to access instance variables from outside
    an object, but doing this is generally considered bad style. Although specifying
    static type information is not required, it is often a good idea. Aside from the
    one case just mentioned, it will not affect code generation, but it is used by
    the semantic analysis phase of the compiler. This can help catch some errors at
    compile time.


    For example, if you try adding an object to an `NSArray` instance, the compiler
    will warn you that the object does not respond to the relevant message. This lets
    you check whether you really meant `NSMutableArray`, or if you need to make a
    mutable copy of the array.


    **Note:**


    In C++, it is common to use the `const` keyword to describe objects as immutable.
    In Objective-C, `const` is effectively useless. It specifies that the instance
    variables of an object may not be modified, but this is rarely done. It does not
    alter the messages that can be sent to an object, so an object that is declared
    as `const` remains mutable.


    Most of the time when the distinction between mutable and immutable instances
    is required, Objective-C programmers use the *mutable subclass pattern*, where
    an immutable class has a mutable subclass. You can cast the mutable version to
    the immutable version implicitly, but you cannot make an immutable instance mutable.


    The `Class` type is similar to `id`, but it may refer to classes. In Objective-C,
    a class is an object, so you can always use `id` instead of `Class`, just as you
    can use `id` instead of a specific object type.


    Two other types are defined in the standard Objective-C headers. The `SEL` type
    is used for selectors, which we’ll look at later in this chapter. The last one
    is IMP, which stands for *Instance Method Pointer*. This type refers to a pointer
    to an Objective-C method. Most of the time, you won’t need to use this type at
    all. It is only used for some of the very dynamic features of Objective-C, and
    for optimization. We’ll look at some places where you might use it in Chapter
    19.


    ### Sending Messages


    ```objc

    [anObject autorelease];

    [anObject addObject: anotherObject];

    [anObject setObject: anotherObject forKey: aThirdObject];

    ```

    *From: exampleMessages.m*


    The most important addition to C that Objective-C makes is sending messages. A
    message, as I said in the last chapter, is a high-level flow control construct.

