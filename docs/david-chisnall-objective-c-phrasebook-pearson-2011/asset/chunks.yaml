    Once you have threads, you often want to store some data privately to the thread.
    An example of this in Cocoa is the current graphics context, which must be available
    to any code that is drawing, but must not be shared between threads.


    Typically, you implement this using the pthread_set_specific() function, which
    stores a pointer associated with the current thread.


    **Storing Thread-Specific Data** 253


    This is commonly implemented by storing the address of a region of memory in a
    register and using a fixed offset from the start of that region for each bit of
    thread-specific data. That means you need to have space for every thread-local
    pointer in every thread, even if you only set one of them to something other than
    NULL.


    If Cocoa stored the graphics context like this, every single thread would require
    one word of space, even though most programs only need a valid graphics context
    in one, or possibly two, threads.


    The solution to this is the thread dictionary.


    This is a mutable dictionary associated with the thread. You only need one word
    per thread to store this pointer, but you can store as many objects in it as you
    want. Only threads that have a value associated with a given key need to have
    space to store it.


    The thread dictionary is accessed by sending a -threadDictionary message to the
    current thread. You can then manipulate it like any other dictionary. When the
    thread exits, the dictionary is destroyed. Because dictionaries retain their arguments,
    this means that any objects only referenced from the thread dictionary will be
    freed, after their destructors run.


    You can use this to run code when a thread exits, but it’s not recommended. Threads
    will post an NSThreadWillExitNotification before


    254


    CHAPTER 14: **Threads**


    they exit, so you can just observe this if you want to run some cleanup code.


    **Note:**


    On most platforms, you can use the


    __thread keyword, a GCC extension that stores variables in thread-local storage.
    The Darwin loader does not support thread-local sections, so this is not possible
    on OS X. This will probably change soon, as similar functionality is in the next
    versions of both the C and C++ standards.


    The thread dictionary provides a good way of passing parameters between nested
    stack frames. Sometimes you want to set some semi-global state that will persist
    for the duration of a method call and be accessible from all methods inside that
    scope.


    The classical Cocoa example is the graphics context object, which is set at the
    root of the view hierarchy and then modified and used by all nested calls. In
    LanguageKit, I use the same pattern to allow AST nodes to access the compiler
    object. In both cases, the lack of tight coupling means that the same method—on
    the same object—can be called in two different threads, with different contexts.


