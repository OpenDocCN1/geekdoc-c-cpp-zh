  trans: "\nObjective-C 提供了一组类似于 Java 的流类用于网络通信，以及底层的 UNIX 接口。遗憾的是，这些流版本并没有特别好用。它们没有提供一种整洁的方式来添加压缩之类的过滤器，或者在连接中间进行加密协商，而许多现代协议都有此类需求。\n\
    \n然而，最令人困扰的局限性是它们并不容易支持 SRV 记录。这些是 DNS 记录，用于发布服务到端口的映射，以及主机名到 IP 地址的映射。它们被 DNS-SD\
    \ 使用，但由于 IP 地址的短缺，它们在公用互联网的层级 DNS 中变得越来越常见。\n\n如果你在 OS X 上使用 POSIX 的 `getaddrinfo()`\
    \ 函数查找服务器地址，你只需要提供一个主机名和服务名。系统随后会将这些内容映射到任何支持的协议的网络地址和端口号。\n\n当你构造一个 `NSStream`\
    \ 时，必须将端口号指定为整数。这意味着对于任何使用 DNS SRV 记录的服务，它都将失败。然而，如果你使用 `getaddrinfo()` 然后将生成的\
    \ socket 封装在 `NSFileHandle` 中，它就能正常工作。\n\n在 EtoileFoundation 中，我们为 `NSFileHandle`\
    \ 提供了一个分类，允许你直接从主机名和协议名创建文件句柄，并对该调用进行了封装。\n\n```c\nhints.ai_family = PF_UNSPEC;\n\
    hints.ai_socktype = SOCK_STREAM;\n// 请求一个流地址。\nerror = getaddrinfo(server, service,\
    \ &hints, & res0);\nif (error) { return nil; }\n\nint s = -1;\nfor (struct addrinfo\
    \ *res = res0; res != NULL && s < 0; res = res->ai_next)\n{\n    s = socket(res->ai_family,\
    \ res->ai_socktype, res->ai_protocol);\n    // 如果 socket 失败，尝试下一个地址\n    if (s\
    \ < 0) { continue; }\n\n    // 如果连接失败，尝试下一个地址\n    if (connect(s, res->ai_addr,\
    \ res->ai_addrlen) < 0)\n    {\n        close(s);\n        s = -1;\n        continue;\n\
    \    }\n}\nfreeaddrinfo(res0);\n```\n*来自 NSFileHandle+Socket.m*\n\n该分类在 `NSFileHandle+Socket.m`\
    \ 示例显示。当你调用 `getaddrinfo()` 时，你将服务器和服务类型作为 C 字符串以及一组指示你想要的 socket 类型的提示提供。你会得到一个\
    \ `addrinfo` 结构体数组，其中包含构造连接 socket 所需的信息。这些结构按照解析器认为最佳的顺序排列，因此你通常会尝试每一个，直到找到可以工作的那个。如果你同时拥有\
    \ IPv6 和 v4 连接性，那么只要有指向两者的 DNS 条目，这段代码将尝试两者。\n\n```objectivec\nNSMutableDictionary\
    \ *object = [NSMutableDictionary new];\nNSConnection *conn = [NSConnection new];\n\
    [conn setRootObject: object];\nif ([conn registerName: @\"sharedDict\"])\n{\n\
    \    [[NSRunLoop currentRunLoop] run];\n}\n```\n*来自 doPublish.m*\n\nObjective-C\
    \ 最强大且最未被使用的部分之一是分布式对象系统。如果你向一个对象发送消息，而该对象不知道如何处理该消息，它将接收一个 `-forwardInvocation:`\
    \ 消息，其中一个对象将消息作为参数封装。\n\n就像 Objective-C 中的其他一切一样，你可以对这个对象进行内省。它会告诉你选择器（selector）、参数数量，以及所有参数的类型和值。\n\
    \nFoundation 框架包含一个 `NSDistanceObject` 类，它利用了这一点。远端对象是一个代理，将消息转发给远程对象。远程对象可能在不同的进程中，甚至在不同的计算机上。\n\
    \n如果你将对象作为参数传递给远端对象的消息，那么这些对象可能会被复制，或者在远端创建一个远程代理来回传消息。\n\n使用分布式对象非常简单。任何使用它们的程序都包含两个部分：客户端和服务器。服务器向其他进程提供对象，而客户端连接到服务器并访问它们。\n\
    \n默认情况下，对象仅在本地机器上共享。为了跨网络上共享它们，你必须在注册对象时使用 `NSSocketPortNameServer`。\n\n```objectivec\n\
    NSMutableDictionary *object = (id)[NSConnection rootProxyForConnectionWithRegisteredName:@\"\
    sharedDict\" host: nil];\nNSLog(@\"Object: %@\", object);\n[object setObject:\
    \ @\"aValue\" forKey: @\"aKey\"];\nNSLog(@\"Object: %@\", object);\n```\n*来自 doAccess.m*\n\
    \n### 在网络上共享对象\n\n本章开头的示例显示了一个使用 `NSMutableDictionary` 的简单程序。注意系统为分布式对象添加了 `NSRunLoop`。本章开头的示例显示了一个使用\
    \ `NSMutableDictionary` 的简单程序。注意系统添加...\n\n```objectivec\nNSProcessInfo *pi =\
    \ [NSProcessInfo processInfo];\nNSString *name = [NSString stringWithFormat:@\"\
    %/%@\", [pi hostName()]];\nNSNetService *service = [[NSNetService alloc] initWithDomain:@\"\
    \" type:name port:23];\n[service publish];\n\nNSNetServiceBrowser *sb = [NSServiceBrowser\
    \ new];];\n[ setDelegateDelegate:self\n\nsb searchForServices:: inDomain:@\"\"\
    ];\n```\n*来自 netservice.m*\n\n### 寻找网络节点\n\n多年来，有很多协议被用于在本地网络上寻找服务。NetBIOS 和 AppleTalk\
    \ 在 90 年代中期以前在本地网络上很常见，直到它们开始被 TCP/IP 取代。TCP/IP 协议栈并不包含此类功能。它最接近的方法是广播地址。如果你向广播地址发送数据包，它将发送到本地分段的每个人。这有很多问题：它只在本地分段有效，在交换网络上效率低下，而且是一种非常底层的方法。\n\
    \nIETF 的 ZeroConf 工作组提出了*多播 DNS (mDNS)* 作为此问题的解决方案。DNS 是一种可扩展的发布映射的方式。它最常用于从主机名到\
    \ IP 地址的映射，但也用于电话号码、地理位置信息以及许多其他内容。\n\n通过 mDNS，单个计算机可以在 .local 域发布 DNS 记录。这随后被作为*DNS\
    \ 服务发现* (DNS-SD) 的基础，该标准描述了如何在 DNS 上发布任意服务。你也可以在传统的层级 DNS 中使用此标准，但它与 mDNS 使用时最为有效。\n\
    \n这两个标准的结合通常被称为 *Bonjour*，并通过 `NSNetService` 类暴露给 Objective-C。这允许应用程序发布 DNS-SD\
    \ 记录并查找特定服务的所有记录。\n\n许多应用程序在 OS X 上使用此功能。Safari 使用它共享书签；iChat 使用它寻找无服务器消息的联系人；iTunes\
    \ 使用它共享音乐；系统使用它来寻找共享文件夹和打印机。如果你正在编写任何类型的网络应用程序，你可能会发现使用 NSNetService 向节点发布广告很有帮助。\n\
    \n当你发布服务时，必须指定一个唯一的名称。如果你正在使用分布式...\n\n"
