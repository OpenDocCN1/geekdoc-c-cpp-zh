    *From: date.m*


    The NSDate class encapsulates an absolute time value. This is stored as two components.
    One is a well-defined fixed point: the epoch date. The other is a time interval
    since that epoch.


    Two standard epoch dates are supported by NSDate, both defined in terms of the
    Gregorian calendar. One is the UNIX Epoch, the first of January, 1970\. This epoch
    date was defined with the first UNIX systems and was later incorporated into the
    ISO C standard. The C time() function will return the number of seconds since
    that date.


    The other Epoch time was defined as part of the OpenStep specification, and is
    referred to as the *reference date*. This one is a little


    **Finding the Current Date** 159


    bit less arbitrary; it is the start of the current millennium: the first day of
    2001.


    Part of the point of NSDate is to free you from having to know which reference
    date you are using. You can compare two dates using -compare: or any of the related
    methods irrespective of what epoch they are using internally.


    If you create a new date with +alloc/-init or with +date, it will be set to the
    current time. Dates are mutable objects, but it’s generally better to treat them
    as if they are not.


    There is only one method for modifying dates:


    -addTimeInterval:. This is deprecated in OS


    X 10.6 and can cause problems in older code, because a lot of people tend to forget
    that it’s possible to modify dates and just retain them, rather than copying them.


