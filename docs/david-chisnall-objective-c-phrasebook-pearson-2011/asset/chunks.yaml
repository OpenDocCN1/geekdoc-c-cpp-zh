    const char *macRoman = [str cStringUsingEncoding:NSMacOSRomanStringEncoding];\n\
    ```\n*From: encodings.m*\n\nIn OpenStep, two of the most common methods on `NSString`\
    \ were `-cString` and `+stringWithCString:`. These converted between a C string\
    \ and an Objective-C string. The problem with these methods was that C strings\
    \ are not encoding aware.\n\nA C string is an array of bytes. You can store any\
