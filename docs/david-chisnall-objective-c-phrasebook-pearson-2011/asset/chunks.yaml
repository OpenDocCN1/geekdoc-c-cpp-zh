  trans: "\n分类（category）的定义结构与类的定义相似。分类不能更改类的实例变量，也不能更改其父类，因此 `@interface` 指令中的这些部分被省略了。在类名后的方括号中会添加分类名。在前面的代码中，你可以看到一个简单的分类接口和实现，它为\
    \ `NSObject` 添加了一个 `-log` 方法。然后你可以向任何对象发送 `-log` 消息，并将其输出到控制台。\n\n注意，分类的接口和实现都是可选的。指定一个没有对应实现的分类接口可能是很有用的。如果你只想替换对象中的某些方法，那么指定一个没有接口的实现也是很有用的。\n\
    \n在分类中声明的方法将替换在类中声明的同名方法。这种顺序是有保证的，因此如果发生冲突，分类将始终具有优先级。如果两个分类定义了同一种方法，则被使用的哪一个是未定义的。\n\
    \n分类的一个文档记录较少详尽的特性之一是，它们允许你为类添加协议遵循（protocol conformance）。在 Foundation 框架中，各种集合没有共同的父类，也没有实现共同的协议。\n\
    \n在 EtoileFoundation 框架中，我们为它们都添加了分类，使它们遵循 `ETCollection` 协议。这让我们在需要某些集合但不在乎具体类型的地方可以使用该协议。\n\
    \n`collection.m` 示例展示了此特性的（非常）简化的版本。`Collection` 协议被添加到 `NSSet` 和 `NSArray` 类中。如果你向这两个类的任一实例发送\
    \ `-conformsToProtocol:` 消息，并以 `@protocol(Collection)` 作为参数，它将返回 `YES`。\n\n分类有一个特殊情况，即你声明一个没有名称的分类接口。这被称为*类扩展*（class\
    \ extension）。与其他分类不同（其他分类应该伴随一个指定分类名的独立 `@implementation` 指令），在类扩展中声明的方法预计出现在类的主\
    \ `@implementation` 指令中。你可以用它来前向声明私有方法。\n\n使用最新的 Objective-C 编译器，你还可以在类扩展内部声明实例变量。为了使之生效，你需要在编译时指定\
    \ `-fobjc-nonfragile-abi2` 标志。\n\n### 为类添加方法\n\n```objc\n@protocol Collection\n\
    - (BOOL)isEmpty;\n@end\n\n@interface NSArray (Collection) <Collection>\n@end\n\
    \n@interface NSSet (Collection) <Collection>\n@end\n\n@implementation NSArray\
    \ (Collection)\n- (BOOL)isEmpty\n{\n    return [self count] == 0;\n}\n@end\n\n\
    @implementation NSSet (Collection)\n- (BOOL)isEmpty\n{\n    return [self count]\
    \ == 0;\n}\n@end\n```\n*自: collection.m*\n\n### 使用非正式协议\n\n```objc\n@interface\
    \ NSObject (InformalProtocol)\n- (id)doSomething;\n@end\n\n// 仅限 Objective-C 2:\n\
    @protocol InformalProtocol\n@optional\n- (id)doSomething;\n@end\n```\n*自: informalProtocol.m*\n\
    \n通常情况下，你想定义一组希望让类实现的方法，但这些方法是可选的。这在代理（delegates）中特别常见，在向代理发送消息之前，你会测试该代理是否实现了给定的方法。\n\
    \n在 Objective-C 2 中，协议可以包含声明为可选的方法，但在那之前，使用分类来实现非正式协议是常见做法。如果你为 `NSObject` 创建了一个分类接口，但没有为其提供接口定义，那么编译器将假设每个\
    \ `NSObject` 子类都响应接口中声明的消息，因此当你向对象发送其中任何一个消息时，它不会生成警告。\n\n当然，并不是每个对象真的都会实现这些方法，因此你需要在发送消息之前，确保使用\
    \ `-respondsToSelector:` 来测试对象是否真的实现了它。\n\n### 通过声明属性合成方法\n\nObjective-C 2 的重大新增之一是声明属性（declared\
