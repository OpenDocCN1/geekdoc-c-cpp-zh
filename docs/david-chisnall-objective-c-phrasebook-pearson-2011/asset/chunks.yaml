- fmt: "\nThis is the bit of Objective-C that tends to intimidate people coming from\
    \ languages such as `C++` and `Java`, because the syntax is taken straight from\
    \ Smalltalk and looks quite alien to people more familiar with C syntax. This\
    \ is intentional. There is nothing in `C` that behaves the same way as an Objective-C\
    \ message send, have built-in definitions, so the headers are optional.\n\n##\
    \ Sending Messages\n\nso having new syntax highlights the fact that you also have\
    \ new semantics. Remember that Tom Love described it has a hybrid language, with\
    \ a clear syntax separation between the pure `C` parts and “object land,” which\
    \ has Smalltalk-like syntax to accompany Smalltalk-like semantics.\n\nThe simplest\
    \ kind of message send takes no arguments. An example of this might be the `-count`\
    \ message sent to an array. Note the minus sign before the message name. This\
    \ is the convention used in Objective-C documentation to indicate a message that\
    \ is sent to an instance.\n\nA plus sign is used to indicate a message sent to\
    \ a class, such as `+new` or `+arrayWithObject:`.\n\n```objc\nsize = [anArray\
    \ count];\n```\n\nThis snippet gets the number of elements in an array and stores\
    \ it in the variable `size`. In a language such as `C++` or `Java`, the equivalent\
    \ would be something like this:\n\n```objc\nsize = anArray.size();\n```\n\nThis\
    \ same syntax in Objective-C would be used if `anArray` were a `C` structure and\
    \ the `size` field were a function pointer. Because this means something very\
    \ different to sending a message to an object, the designers thought it would\
    \ be confusing to use the same syntax.\n\nMessages that take one argument look\
    \ very similar. If you wanted to add an object to an Objective-C array, you’d\
    \ use something like this:\n\n```objc\n[anArray addObject: anObject];\n```\n\n\
    Things start to become a bit different when messages have more than one argument.\
    \ As with Smalltalk, every argument has a separate name, so you’d insert the object\
    \ at a specific index, like this:\n\n```objc\n[anArray insertObject: anObject\
    \ atIndex: anIndex];\n```\n\nThis makes Objective-C code very easy to read when\
    \ you understand the basic syntax, because every message tells you what each argument\
    \ is for. If you came across this message in documentation, it would be written\
    \ like this:\n\n`-insertObject:atIndex:`. You can see from the two colons that\
    \ it takes two arguments and from the text before the two colons what those arguments\
    \ should be. As before, the minus sign indicates that this is a message sent to\
    \ an instance.\n\nIf you send a message to an object that doesn’t have a method\
    \ to implement it, then a number of fallback methods are used. In the default\
    \ implementation, the last of these will throw an exception (which you can catch\
    \ at run time and work around). You can also ask an object before you send a message\
    \ whether it knows how to handle it. We’ll take a look at how to do this in Chapter\
    \ 19.\n\nIn Objective-C, like Smalltalk, classes are objects too. You can send\
    \ them messages, just as you would send an object a message. You use the class’s\
    \ name as the receiver when you do this.\n\n**Note:**\n\nIf you send a message\
    \ to `nil`, a constant defined as (`id`)0`, you do not get an error. Instead,\
    \ you get a `0` value returned. This is very useful because you can send a string\
    \ of messages to the result of previous message sends, and if one of them returns\
    \ `nil` in the middle, then the rest will still work. This eliminates the need\
    \ for a lot of tests for `NULL` in Objective-C code.\n\nThe behavior of sending\
    \ a message that returns a structure to `nil` is undefined. If you do this in\
    \ code compiled with `GCC` on `SPARC`, your program will crash with an illegal\
    \ instruction signal. On `OS X`, the structure will be filled with random values,\
    \ just like an uninitialized structure on the stack.\n\nYou should always be careful\
    \ to check that an object is not `nil` before sending it a message that returns\
    \ a structure.\n\nThe most common reason to send a message to a class is to create\
    \ an instance of that class.\n\nClasses are responsible for creating their own\
    \ instances in Objective-C. There is no equivalent of the `new` keyword in `C++`\
    \ or `Java`. The closest equivalent is the `+new` message, which you can send\
    \ to a class. For example, you might create a new mutable array like this:\n\n\
    ```objc\nid anArray = [NSMutableArray new];\n```\n\nAlthough this looks quite\
    \ similar, the language makes no guarantees about what this message will do. Some\
    \ classes may create instances of a subclass, and some may return a singleton\
    \ instance. It’s only by convention that this gives you a new instance of the\
    \ receiver.\n\n## Understanding Selectors\n\n```objc\nSEL new = @selector(new);\n\
    SEL set = @selector(setObject:forKey:);\n```\n*From: selector.m*\n\nIn `C`, you\
    \ refer to functions by name. A function name can also be used as a pointer to\
    \ that function. When you compile `C` code to assembly, the function becomes a\
    \ label, which can be reached via a call instruction or instruction sequence.\n\
    \nFlow control in Objective-C is more dynamic.\n\nYou can take a pointer to a\
    \ method, but most of the time you want to send a specific message to an object,\
    \ rather than call a specific method.\n\nIf you call a specific method, you have\
    \ to make absolutely certain that the receiver really is the class that you expect.\n\
    \nIn `C`, you will often use function pointers as arguments to other functions.\
    \ The called function will then call the one that is passed to it. A common example\
    \ of this is the `qsort()` function in the `C` standard library. This sorts an\
    \ array, using a function to define the ordering between the items.\n\nIn Objective-C\
    \ version, you might want to compare objects by sending them a `-compare:` message,\
    \ rather than using a function pointer.\n\nThe name of a message is referred to\
    \ as the *selector*. This is an abstract representation of the message name, and\
    \ it has the `SEL` type, which is an opaque type. You can create a selector with\
    \ the `@selector()` directive. This takes a constant string representation of\
    \ a message name and turns it into a selector for that message name.\n\nYou can\
    \ use selectors to call a method by name, as we’ll see in Chapter 19. A number\
    \ of methods in the Foundation framework take selectors as arguments. These are\
    \ used in much the same way as `C` functions that take function pointers as arguments,\
    \ for delayed execution, callbacks, sorting collections, and so on.\n\n## Declaring\
    \ Classes\n\nWhen you create a new class, you need to do two things: describe\
    \ its public interface and write its private implementation. You will need three\
    \ Objective-C keywords: `@interface`, `@implementation`, and `@end`.\n\nNote that\
    \ all new Objective-C keywords start with an `@` sign. This is because this symbol\
    \ is not allowed in `C` identifiers. Contrast this with `C++`, which introduces\
    \ identifiers such as `class`, which breaks any `C` code that uses `class` as\
    \ a variable name.\n\nObjective-C inherits the `C` compilation model, where the\
    \ compiler expects a single file and separation is accomplished by making the\
    \ preprocessor combine various files. By convention, interfaces to Objective-C\
    \ classes are put in header files, with a `.h` extension, and implementations\
    \ go in `.m` files. No one can remember why `.m` was chosen.\n\n```objc\n@interface\
    \ Integer : NSObject\n{\n    int integer;\n}\n\n- (int)intValue;\n- (void)addInteger:(Integer*)other;\n\
    @end\n\n@implementation Integer\n- (int)intValue {\n    return integer;\n}\n\n\
    - (void)addInteger:(Integer*)other {\n    integer += [other intValue];\n}\n@end\n\
    ```\n*From: integer.m*\n"
