  trans: "\n实现 `NSSet` 最简单的方法是将每个新对象与每个现有对象都进行比较。然而，这种方法会非常缓慢，所幸运的是 `NSSet` 并不是这样工作的。\n\
    \n相反，它使用了 `-hash` 方法。每个对象都应该实现此方法并返回一个整数哈希值。\n\n如果两个对象相等，它们必须具有相同的哈希值。像 `NSSet`\
    \ 这样的集合根据对象的哈希值将其放入桶（buckets）中。在测试一个对象是否已经在集合中时，它只需要测试具有相同哈希值的对象。\n\n因此，一个良好的哈希算法对于这些集合类的性能至关重要。\n\
    \n幸运的是，作为这类集合中最常用的对象，`NSString` 已经有了良好的哈希实现。\n\n这种方法的一个小问题是，对象在位于集合中时不能改变其哈希值。对于可变对象，在不破坏其他某些规则的情况下是不可能强制执行点的。因此，在对象存储在集合期间不要修改它们是很重要的。\n\
    \n另一种类型的集合是 `NSCountedSet`，它是 `NSMutableSet` 的子类，支持多次添加同一个对象。这为 `NSMutableSet`\
    \ 增加了一个方法 `-countForObject:`，它返回特定对象被添加到集合的次数。\n\n**注意：**\n\n在 Java 以及其他一些语言中，计数集合被称为\
    \ `bag`（袋）。\n\n值得注意的是，由于 `NSCountedSet` 是 `NSSet` 的子类，它的某些方法被设计为允许 `NSCountedSet`\
    \ 实例替代 `NSSet` 实例。如果你向本节开头示例创建的任何集合发送 `-count` 消息，你将得到相同的值。如果你遍历任何集合，将得到七个对象。你只有通过向集合发送\
    \ `-countForObject:` 消息，才能判断一个对象是否在计数集合中出现过多次。\n\n## 创建字典\n\n```objc\nNSMutableDictionary\
    \ *dict = [NSMutableDictionary dictionaryWithObjectsAndKeys: @ *\"one\", @ *\"\
    1\", @ *\"two\", @ *\"2\", nil];\n[dict setObject: @ *\"three\"* forKey: @ *\"\
    3\" ];\n```\n*源自：dictionary.m*\n\n字典（通常称为 `map` 或关联数组）提供了一个由其他对象作为索引的对象集合。最常见的情况是字典通过字符串进行索引。这并不是唯一的选择，但对可用作字典键的类有一些限制。\n\
    \n字典与集合类似，适用相同的约束。用作键的对象必须实现 `-hash` 和 `-isEqual:` 方法，当它们相等时，在比较时返回 `YES` 和相同的哈希值。只要它们在集合中，哈希值就不能改变。\n\
    \n此外，键必须实现 `NSCopying` 协议。当你向字典添加一个键值对时，值会被保留（retained），但键会被复制（copied）。这样做是为了防止键被意外修改。\n\
    \n如果你传递一个不可变对象（如 `NSString`），其效果与保留它相同。如果你传递一个 `NSMutableString`，那么字典将使用一个不可变的副本。\n\
    \n最后，值得记住，只有使用字符串作为键的字典才能配合*键值编码*（key-value coding）工作（见第 11 章）。在同一个字典中使用不同类作为键时，你也应该非常小心，确保在传递其他类的实例时，它们的比较方法能返回正确的值。\n\
    \n你在字典上会用的最常用方法是 `-objectForKey:`，它返回与给定键关联的对象，如果没有为该键设置对象，则返回 `nil`。对于可变字典，你通常会使用\
    \ `-setObject:forKey:` 方法来设置字典中的键值对。\n\n## 遍历集合\n\n```objc\nNSLog(@ *\"The Objective-C\
    \ 1 way:\" );\nNSEnumerator *e=[a objectEnumerator];\nfor (id obj=[e nextObject];\
    \ nil!=obj ; obj=[e nextObject])\n{\n    [obj print];\n}\nNSLog(@ *\"Fast enumeration:\"\
    \ );\nfor (id obj in a)\n{\n    [obj print];\n}\nNSLog(@ *\"Using blocks:\" );\n\
    [a enumerateObjectsUsingBlock:^(id obj, NSUInteger idx, BOOL *stop)\n{\n    [obj\
    \ print];\n}];\nNSLog(@ *\"Avoiding enumeration:\" );\n[a makeObjectsPerformSelector:@selector(print)];\n\
    ```\n*源自：enum.m*\n\n你对集合执行的最常见任务之一是遍历集合中的每个元素并进行一些处理。在 Objective-C 中有很多种方法实现这一点。由于这是一项非常常见的任务，新的实现方法不断被添加。\n\
    \n对于数组，你可以遍历从 0 到 `[array count]` 的每一个索引并发送 `-objectAtIndex:` 消息。这是非常低的。遍历集合的传统方法是使用枚举器（enumeration）；即\
    \ `NSEnumerator` 子类的实例。\n\n**注意：**\n\n如果你是来自 Java，在脑海中将 `iterator` 一词替换为 `enumerator`，你会发现你熟悉的大部分模式仍然有效。你可以通过向集合发送\
    \ `-objectEnumerator` 消息来获取它的枚举器。这个对象非常简单。它只响应两条消息，而你可能只需要使用一个：`-nextObject`。它返回集合中的下一个对象，如果你已经遍历了该集合包含的所有对象，则返回\
    \ `nil`。\n\n通过 Objective-C 2，Apple 引入了*快速遍历*（fast enumeration）。你可以将其用于任何实现了 `NSFastEnumeration`\
    \ 协议的集合。该协议定义了一个通过一次发送获取多个对象的方法。具体数量由调用者和接收者定义。编译器分配一个缓冲区并将指针传递给接收者。接收者可以将某些对象拷贝到缓冲区中，或者如果它内部存储为\
    \ C 数组，则返回内部存储的指针。\n\n该协议中的方法被一个新的控制结构 `for in` 循环使用。当你使用这种结构时，编译器会产生两个嵌套循环。在外层循环中，它将调用快速遍历方法，从集合中获取几个对象。在内层循环中，它将遍历这个\
    \ C 数组。\n\n在没有编译器支持的情况下也可以快速遍历。GNUstep 中的 `GSFastEnumeration.h` 头文件提供了 `FOR_IN`\
    \ 和 `END_FOR_IN` 宏，它们展开后产生编译器用于 `for in` 循环相同的代码。这些宏非常复杂，因此最好不要尝试自己调用快速遍历方法。\n\
    \n通过 OS X 10.6，Apple 引入了另一种遍历集合的新方法：使用 block。block 是 C 语言的一种新扩展，但设计初衷是为了与 Objective-C\
    \ 紧密协作工作。像 Objective-C 对象一样，block 有一个 `isa` 指针。它指向一个实现了 `NSObject` 协议的私有类，因此可以在集合中存储\
    \ block。它们还支持使用 Objective-C 类型编码进行内省，尽管这种支持在 OS X 的公共接口中尚未完全开放。\n\n大多数集合类现在都实现了使用\
    \ block 进行遍历的方法。使用这些方法可能非常方便，尽管它确实限制了代码的可移植性。你可以通过 block 执行并发遍历，通过向 `-enumerateObjectsWithOptions:usingBlock:`\
    \ 等方法的第一个参数传递 `NSEnumerationConcurrent`。通常只有当 block 在每个元素上的执行耗时较长，这种方法才可能带来性能收益。\n"
- fmt: "\nEach collection has different methods for enumeration via blocks. The version\
    \ for arrays takes the index of the object as an argument, the version for dictionaries\
    \ takes both the key and value, and so on. These methods will be slower than the\
    \ other alternatives, because they require the block to be called for each object\
    \ (which has the same overhead as calling a function), but they can be more convenient.\n\
    \nIn some cases, you can avoid enumeration entirely. `NSArray`, for example, implements\
    \ a `-makeObjectsPerformSelector` method, and another version that takes an object\
    \ as a second argument. If all that you are doing while enumerating is sending\
    \ a message to each object, you can use these methods instead of creating a loop.\n\
    \n# Finding an Object in a Collection\n\n```objc\nNSArray *array = [NSArray arrayWithObjects:\
    \ 7\n@\"a\"* , @*\"group\"* , @*\"of\"* , 8\n@\"string\"* , @*\"objects\"* , nil];\n\
    NSSet *set = [NSSet setWithArray: array];\nNSUInteger i = [array indexOfObjectIdenticalTo:\
    \ @\"group\"* ];\nif (NSNotFound == i)\n    i = [array indexOfObject: @\"group\"\
    * ];\nNSString *original = [set member: @\"string\"* ];\n```\nBoth `NSArray` and\
    \ `NSSet` implement the `-containsObject:` method, which returns `YES` if the\
    \ collection contains an object that is equal to the argument. This uses the same\
    \ notion of equality we’ve already covered in relation to collection classes:\
    \ Two objects are equal if sending one an `-isEqual:` message with the other as\
    \ the argument returns `YES`.\n\nIn an array, you probably want to know exactly\
    \ where the object is, rather than simply whether it is present. There are two\
    \ methods for telling you this: `-indexOfObject:` and `-indexOfObjectIdenticalTo:`.\
    \ The second of these uses pointer comparison to determine equality.\n\nAll of\
    \ these are slow in arrays. They all require a linear search, and most of them\
    \ require sending a message to each object. In general, you should only use them\
    \ in small arrays or infrequently called code paths. If you need to perform this\
    \ reverse mapping often, you’re better off using a dictionary or something similar\
    \ to store the inverse relationship.\n\nWith sets, the performance is somewhat\
    \ different. Because sets store objects in buckets according to their hash, a\
    \ set can quickly discount a lot of objects as being different.\n\nObviously,\
    \ because sets are unordered, there is no set method for looking up the index\
    \ of an object. There is, however, a method for looking up the stored object that\
    \ is equal to an object.\n\nThe `-member:` method on `NSSet` returns the stored\
    \ object that is equal to the argument. This is very useful for ensuring uniqueness\
    \ in objects.\n\nThe `unique.m` example shows a method that constructs unique\
    \ constant string objects from C strings. If you pass the same C string to this\
    \ method twice, you will get the same `NSString` instance returned both times.\n\
    \nNote that this function is not thread-safe. There is a potential race between\
    \ testing whether the string is in the set and adding the new one if it isn’t.\
    \ A thread-safe version of this would require you to acquire a lock after the\
    \ `-member:` call, send this message again, and then finally release the lock\
    \ after adding the new object.\n\nIf you are creating a new immutable class, you\
    \ may wish to implement something like this in your constructor. This will trade\
    \ some speed for memory usage in construction, but will mean that you can always\
    \ use pointer comparisons to determine equality, which can be a big speed win\
    \ overall in some cases.\n\n```objc\nstatic NSMutableSet *unique_strings;\n\n\
    NSString *uniqueString(const char** *str)\n{\n    NSString *new = [[NSString alloc]\
    \ initWithUTF8String: str];\n    NSString *old = [unique_strings member: new];\n\
    \    if (nil != old)\n    {\n        [new release];\n        return old;\n   \
    \ }\n    [unique_strings addObject: new];\n    return new;\n}\n```\n*From: unique.m*\n\
    \n# Subclassing Collections\n\nAll of the standard collections are *class clusters*.\
    \ This means that creating a new subclass of them is nontrivial. The superclass\
    \ is abstract, and the concrete subclasses are private (so you can’t subclass\
    \ them).\n\nEach of the collections documents the methods you must implement in\
    \ a subclass. The simplest way of doing this is via delegation: just have an object\
    \ that is the same type as the collection you are subclassing as an instance variable.\
    \ The `typedArray.m` example uses this approach.\n\nThe `TypedArray` class is\
    \ a subclass of `NSMutableArray`. The `realArray` instance variable in this class\
    \ is an `NSMutableArray`. This is created in the class’s designated initializer\
    \ and, just like any other code that creates an `NSMutableArray`, will really\
    \ get an instance of one of the concrete subclasses of this class. The other instance\
    \ variable is a `Class`.\n\n```objc\n- (NSUInteger)count\n{\n    return [realArray\
    \ count];\n}\n\n- (id)objectAtIndex: (NSUInteger)anIndex\n{\n    return [realArray\
    \ objectAtIndex: anIndex];\n}\n```\n*From: checkedArray.m*\n\nUnlike the standard\
    \ array classes, which are heterogeneous, this version requires every object you\
    \ insert to be an instance (or subclass of the class passed to the initializer.\
    \ This version will silently fail if you try to insert other objects, but you\
    \ could easily modify it to throw an exception.\n\nA number of the methods in\
    \ this class are trivial. The `-removeObjectAtIndex:` method, for example, just\
    \ passes the same message to the wrapped array. Others, such as `-insertObject:atIndex:`,\
    \ do the type checking and then call the real array.\n\nThis example implements\
    \ all of the primitive methods in `NSMutableArray`. This means that all of the\
    \ other methods declared on `NSArray` or `NSMutableArray` will work correctly.\n\
    \n```objc\n- (id)initWithType:(Class)aClass\n{\n    if (nil == [super init])\n\
    \    {\n        return nil;\n    }\n    type = aClass;\n    realArray = [NSMutableArray\
    \ new];\n    return self;\n}\n\n- (void)insertObject:(id)anObject atIndex:(NSUInteger)anIndex\n\
    {\n    if (![anObject isKindOfClass: type])\n    {\n        return;\n    }\n \
    \   [realArray insertObject: anObject atIndex: anIndex];\n}\n\n- (void)removeObjectAtIndex:(NSUInteger)idx\n\
    {\n    [realArray removeObjectAtIndex: idx];\n}\n\n- (void)dealloc\n{\n    [realArray\
    \ release];\n    [super dealloc];\n}\n```\n*From: checkedArray.m*\n\n**Note:**\
    \ In C++, the primitive methods would be pure-virtual methods in the superclass,\
    \ and the compiler would prevent you from instantiating the superclass directly,\
    \ or any subclass that did not implement these methods. There is no corresponding\
    \ facility in Objective-C.\n\nA more common reason for subclassing is that you\
    \ want to implement a different data structure for the underlying representation.\
    \ For example, if you are going to insert objects at one end of an array and then\
    \ remove them from the other, you might want to use a resizable ring buffer as\
    \ your array implementation.\n\nIf this is the case, you should still override\
    \ the same methods, but this time replace them with an implementation in terms\
    \ of your own storage mechanism. You can then use your subclass anywhere that\
    \ the superclass can be used—including passing it to other libraries—but your\
    \ own storage will be used.\n"
