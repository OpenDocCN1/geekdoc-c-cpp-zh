    # CHAPTER 18: Debugging Objective-C


    ## Inspecting Objects


    ```objc

    @interface DebugObject : NSObject

    @end


    @implementation DebugObject


    - (NSString*)description

    {

    return @"Not a very helpful message";

    }


    @end


    void debug(id anObject) {}

    ```

    *From: description.m*


    Most of the time, when you debug an Objective-C program, you will be using the
    `GNU debugger` (`GDB`), which has some built-in support for Objective-C. If you
    are using XCode then you are using `GDB` via a graphical front end. You can access
    the command-line interface from the Run menu. This is often useful because XCode
    only provides a GUI for the most common functions of the debugger, not for everything.


    There are two features in GDB that make it well suited to Objective-C. The first
    is that it comes with simple Objective-C parser and interpreter, so you can write
    Objective-C expressions in the debugger and inspect variables in that way. The
    second is the `print-object` command.


    This prints an object. It does this by sending a `-description` message to the
    object, which returns an `NSString` describing the object. This means that it
    will only work on valid objects. If you try using this command with objects that
    are prematurely deallocated or whose memory is corrupted then the debugger will
    either crash, or catch a segmentation violation signal.


    ```bash

    $ gdb ./a.out

    (gdb) break debug

    Breakpoint 1 at 0x100000e4d: file description.m, line 10.

    (gdb) r

    Starting program: a.out

    Breakpoint 1, debug (anObject=0x100111bc0) at description.m:10

    void debug(id anObject) {}

    (gdb) print anObject

    $1 = (id) 0x100111bc0

    (gdb) print-object anObject

    Not a very helpful message

    (gdb) print-object [NSObject new]

    <NSObject: 0x100111c30>

    (gdb) print-object [anObject class]

    DebugObject

    (gdb) print-object [anObject className]

    DebugObject

    (gdb) print-object anObject->isa

    DebugObject

    ```

    *Output from: description.m*


    The default implementation of this method, in `NSObject`, just prints the class
    name and address. Various other standard objects implement it in different ways.
    Collection classes, for example, print their contents in property list format.
    This example returned a very unhelpful message, but in your code you should try
    to provide something a bit more helpful.


    ## Recognizing Memory Problems


    ```objc

    id pool = [NSAutoreleasePool new];

    NSMutableString *str = [NSMutableString stringWithString: @"example"];

    [pool drain];


    pool = [NSAutoreleasePool new];

    NSSet *set = [NSSet setWithObject: str];

    ```

    *From: prematureDealloc.m*


    One of the most common problems in Objective-C is premature deallocation. If you
    omit a `-retain` message somewhere, then you hang onto a pointer without increasing
    its reference count. If something else has a reference to it, or it was autoreleased,
    then this pointer can remain valid for a long time before suddenly becoming invalid.


    When the pointer becomes invalid, you will usually get a crash inside `objc_msgSend()`
    with the Mac runtime, or `objc_msg_lookup()` with the GNU runtime. This happens
    because the runtime tries to look up the method to handle a message, but the class
    pointer is now pointing to something invalid.


    You can find the object that was deallocated quite easily in the debugger by moving
    up the stack until you find the message receiver. You can also use the `NSZombie`
    class. When the `NSZombieEnable` environment variable is set, objects won’t be
    deallocated. Instead, they will have their class set to `NSZombie`, which just
    logs a message whenever it is sent.


    ```bash

    $ gcc -framework Cocoa -g prematureDealloc.m && ./a.out

    Segmentation fault

    $ gdb ./a.out

    (gdb) r

    Starting program: a.out

    Program received signal EXC_BAD_ACCESS, Could not access memory.

    Reason: KERN_INVALID_ADDRESS at address: 0x0000007a0000010

    0x00007fff8296111c in objc_msgSend ()

    (gdb) up 6

    *#6* 0x0000000100000eef in main () at prematureDealloc.m:9*

    NSSet *set = [NSSet setWithObject: str];

    (gdb) print-object str

    Program received signal EXC_BAD_ACCESS, Could not access memory.

    (gdb) print *str

    $2 = {

    <NSString> = {

    <NSObject> = {

    isa = 0x7a0000000

    }, <No data fields>}, <No data fields>}

    (gdb) print-object str->isa

    Cannot access memory at address 0x7a0000000

    (gdb) quit

    $ NSZombieEnabled=YES ./a.out

    a.out[39571:903] *** -[CFString **hash**]: message sent to deallocated instance
    0x100112f00

    ```

    *Output from: prematureDealloc.m*


    Finding the object is, of course, only part of the problem. You also need to work
    out why it was prematurely freed. Often, you can do this quickly by just looking
    in the relevant source files and checking all `-retain` and `-release` messages.
    The static analyzer part of clang can (hopefully) do this automatically. If that
    doesn’t work, then try overriding the class’s `-retain` and `-release` methods,
    adding a breakpoint on them in the debugger, and looking at where is really retained
    and released.


    ## Watching Exceptions


    ```objc

    int throw(void) {

    [NSException raise: @"ExampleException" format: @"Watch this"];

    }

    ```

    *From: throw.m*


    If you read the documentation on `NSException`, you will see this in the `-raise`
    method: All other methods that raise an exception invoke this method, so set a
    breakpoint here if you are debugging exceptions. This was true, until OS X 10.5,
    and remains true on GNUstep. Unfortunately, on newer versions of OS X it is untrue,
    which also makes it more effort if you want to write a category that alters the
    behavior of exception throwing.


    Now, the various exception-throwing bits of OS X Foundation use `@throw` directly.
    This is a tiny bit of syntactic sugar, which calls the `objc_exception_throw()`
    function. This function then invokes the unwinding library code to run all code
    in `@finally` blocks and find the correct handler for the exception.


    ```bash

    (gdb) break [NSException raise]

    Breakpoint 1 at 0x51eb851eb1414

    (gdb) r

    Starting program: a.out

    2010-03-11 14:52:54.519 a.out[39782:a0f] ***

    Terminating app due to uncaught exception ’

    ```

