- fmt: "\nFor localized string, you need to return to the `NSDateFormatter` class.\
    \ This class encapsulates some description of date formats and can perform bidirectional\
    \ conversions between date and string objects.\n\nWhen you create a date formatter,\
    \ you can set the locale either to an explicit locale, or leave it set to the\
    \ user’s current locale. You can then either use one of the standard time and\
    \ date formats for that locale, or specify one explicitly with the `-setDateFormat:`\
    \ method. This takes a template string as an argument, but its use is discouraged\
    \ in most code because it does not account for the locale.\n\nYou have one final\
    \ option for reading dates.\n\nIf you want to read dates from some custom format,\
    \ you can use `NSScanner` to read the components from the string, then construct\
    \ an `NSDateComponents` object and pass this to `NSCalendar` to create the date.\
    \ `NSScanner` is covered in Chapter 5.\n\n## Receiving Timer Events\n\n```objective-c\n\
    - (void)periodic:(NSTimer*)theTimer\n{\n    NSLog(@\"Timer fired\");\n}\n\n- (void)start\n\
    {\n    SEL sel = @selector(periodic:);\n    [NSTimer scheduledTimerWithTimeInterval:1\n\
    \                               target:self\n                               selector:sel\n\
    \                             userInfo:nil\n                              repeats:YES];\n\
    \    [[NSRunLoop currentRunLoop] run];\n}\n```\n*From: timer.m* \n\nThe `NSTimer`\
    \ class encapsulates an event source that generates events at a specific time.\
    \ This is similar in principle to the `alarm()` system call, although you can\
    \ have several timers scheduled at once.\n\nYou will almost always construct timers\
    \ using the method from the example at the start of this section. This method\
    \ will create and schedule a new timer in the same operation.\n\nWhen the time\
    \ interval elapses, the timer will fire. It will then send a message to an object.\n\
    \nThe simplest way of defining this message is by passing a selector, a target,\
    \ and a dictionary when you create the timer. The selector must be for a method\
    \ that takes one argument: an `NSTimer` instance. You can retrieve the dictionary\
    \ by sending a `-userInfo` message to the timer.\n\nThere is another constructor\
    \ that takes an `NSInvocation` as the argument. This is more difficult to use,\
    \ but is more powerful because it allows any message with any arguments to be\
    \ used.\n\nThe timer object will be autoreleased when you create it like this,\
    \ but it will be retained by the *run loop* object. You can only use timers when\
    \ you are using `NSRunLoop`. The run loop object sits waiting for events from\
    \ the kernel—for example, timers or data becoming available on file descriptors—and\
    \ then sends messages in response to these events.\n\nIf you are using `AppKit`\
    \ or `UIKit`, you will be using a run loop automatically. The `NSApplication`\
    \ and `UIApplication` classes both create a run loop instance internally. These\
    \ classes register with the run loop to receive notifications of user interface\
    \ events from the display server and then pass them on to windows and so on.\n\
    \nIf you are writing a command-line application or a server, you can still use\
    \ `NSRunLoop`. It is part of the Foundation framework, but you must create it\
    \ manually and tell it to run. This is very simple, and is done in the last line\
    \ of the `-start` method in the preceding example.\n\n## Working with Property\
    \ Lists\n\nWith OS X, Apple introduced an XML and a binary property list format.\
    \ The XML format is incredibly verbose, but has the advantage that it can be parsed\
    \ by other XML-compatible tools and can be embedded in other XML documents.\n\n\
    The binary representation is very fast to parse and very dense but, being binary,\
    \ is not human-readable.\n\nSome libraries for other languages can handle property\
    \ lists. The `WINGS` library in WindowMaker can read and write them, as can a\
    \ library included with NetBSD. Apple’s Core Foundation framework, and their open-source\
    \ `CFLite` library, can also use them from C code.\n\n### Storing Collections\
    \ in Property Lists\n\n#### Lists\n\n```objective-c\nNSArray *array = [NSArray\
    \ arrayWithObjects:@\"array\", @\"containing\", @\"string\", @\"objects\", nil];\n\
    [array writeToFile:@\"example.plist\" atomically:NO];\n\nNSMutableArray *cycle\
    \ = [array mutableCopy];\n[cycle addObject: cycle];\n[cycle writeToFile:@\"failure.plist\"\
    \ atomically:NO];\n```\n*From: writeplist.m* \n\nThe `NSArray` and `NSDictionary`\
    \ classes implement a `-writeToFile:atomically:` method. These let you trivially\
    \ dump the contents of the collection in a file using the default property list\
    \ format.\n\nThese methods are not magic. They will only work if the collections\
    \ do not contain any types that cannot be stored in a property list.\n\nIf you\
    \ pass `YES` as the second parameter, the method will ensure that the representation\
    \ on disk is always consistent. It will write the property list to a temporary\
    \ file and will then rename this file when the writing is finished.\n\nRunning\
    \ the code from the start of this section will generate an `example.plist` file\
    \ that contains an array as the root element and four strings inside it.\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD\
    \ PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist\
    \ version=\"1.0\">\n<array>\n    <string>array</string>\n    <string>containing</string>\n\
    \    <string>string</string>\n    <string>objects</string>\n</array>\n</plist>\n\
    ```\n*From: example.plist* \n\nWith current versions of OS X, this approach will\
    \ use the XML property list format. As you can see, this is quite verbose. The\
    \ older OpenStep property list format used brackets for arrays and double quotes\
    \ for strings, so it would have been a bit less than half the size.\n\nConverting\
    \ this to the binary format reduces the file size from 294 bytes to 82 bytes.\n\
    \nFor a property list this small, the space reduction is irrelevant. Both formats\
    \ are likely to fit into a single allocation unit on disk, so they will take the\
    \ same amount of on-disk space. The parsing time will be trivial for both.\n\n\
    This is not true with larger property lists, however. Safari, for example, stores\
    \ your history in a binary property list. At the moment, mine is 15MB. If I convert\
    \ it to the XML format, it becomes 34MB. The parsing overhead also increases,\
    \ both in terms of CPU time and memory usage.\n\nUnfortunately, the collection\
    \ classes won’t write out property list versions of themselves in anything other\
    \ than the default (XML) format. Instead, you must use the `NSPropertyListSerialization`\
    \ class, which we’ll look at over the next sections sections\n\nThe property list\
    \ formats are all hierarchical. They do not support writing cyclical data structures.\
    \ The second array in this example contains a pointer to itself. The behavior\
    \ when writing this to a property list is undefined. On OS X, only the elements\
    \ before the recursive pointer are stored in the file. Any objects appearing after\
    \ it are ignored.\n\n### Reading Data from Property Lists\n\n#### Lists\n\n```objective-c\n\
    NSArray *array = [NSArray arrayWithContentsOfFile:@\"example.plist\"];\nNSData\
    \ *data = [NSData dataWithContentsFile:@\"example.plist\"];\nNSMutableArray *mutable\
    \ = [NSPropertyListSerialization propertyListFromData:data\n                 \
    \              mutabilityOption:NSPropertyListMutableContainersAndLeaves\n   \
    \                                                  format:NULL\n             \
