    messages. As their names would imply, you should use these messages when you want
    to retain a reference to an object, or when you want to release an existing reference.
    The -retain message increments the object’s reference count, and the


    -release message decrements it.


    You can also send a -retainCount message to an object to determine its current
    reference count. It’s tempting to use this for optimization and invoke some special
    cases when you are sure there is only one reference to an object. This is a very
    bad idea. As the name implies, this method tells you the number of retained references
    to the object, not the number of references. It is common not to bother sending
    a -retain message to objects when you create a pointer to them on the stack. This
    means that an object


    **Assigning to Instance Variables** 61


    may be referenced in two or more places, even though its retain count is only
    one.


