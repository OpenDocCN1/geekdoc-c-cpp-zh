  trans: "\n如果你用过 Common Lisp，这种模式看起来会很像一种临时的可重启异常（restartable exception）。\n\n![Image\
    \ 14](img/index-243_1.png)\n\n# 第 13 章：访问目录和文件\n\n工作区进程并不保证存在——例如，在可能通过远程连接运行的命令行工具中或在服务器代码中。\n\
    \nUIKit 框架没有等同于 `NSWorkspace` 的东西。如果你针对 Cocoa Touch，则必须使用底层 API。\n\n## 读取文件\n\n\
    ```objc\nNSData *copy = [NSData dataWithContentsOfFile: file];\nNSData *mapped\
    \ = [NSData dataWithContentsOfMappedFile: file];\nNSData *read = [[NSFileHandle\
    \ fileHandleForReadingAtPath: file] readDataToEndOfFile];\n```*来自 readFile.m*\n\
    \nUNIX 系统通常提供两种访问文件的方法：`read()` 和 `mmap()` 系统调用。大多数其他系统——至少是运行在带有内存管理单元（`MMU`）硬件上的系统——都有这些对等物。前者将字节流从文件拷贝到缓冲区。后者将文件数据映射到内存区域。\n\
    \nFoundation 提供了两个大致对应这些操作的类。`NSData` 类封装了一个包含未类型数据的内存区域。你可以通过各种选项从文件创建该类的实例。\n\
    \n对于小文件，你可以直接使用封装了 `read()` 用的版本，它会将文件数据的副本读取到内存中。对于较大的文件，你可能希望使用 `+dataWithContentsOfMappedFile:`。\n\
    \n后一种方法的优势是它与操作系统的虚拟内存子系统交互得非常好。如果你耗尽了物理内存，你不需要为驱逐包含映射文件数据的页而分配交换空间；你只需要丢弃它们，并在下次访问时将它们读回即可。\n\
    \n如果你处于一个内存非常小且没有虚拟内存的平台，这非常有用。例如，3GS 之前的 iPhone 只有 128MB RAM，且它们一个交换空间也没有。如果你将一个\
    \ 4MB 的文件读取到内存中，你就用掉了应用程序可用空间的一大块。\n\n相比之下，如果你创建了一个代表文件的映射数据对象，系统将根据需要以 4KB 为块的读取数据，并在不再需要时将其剔出。例如，如果你在创建新对象时耗尽了内存，内核会将映射文件从内存中剔出以释放空间。如果你已经读取了文件，它就无法这样做，因此只会内存溢出并杀死你的应用程序。\n\
    \n如果你一次只想读取文件的一部分，应该使用 `NSFileHandle`。该类封装了一个文件描述符，并实现了 C 标准库支持的相同基本操作的 Objective-C\
    \ 版本。你可以通过单次操作从文件句柄读取所有数据，但更多时候你将读取下一个可用位段。\n\n你可以通过向文件句柄发送 `-readDataOfLength:`\
    \ 消息来读取固定大小的数据块。该类中的大多数其他方法对于从文件读取数据并不特别有用；它们用于与套接字交互。我们将在 17 章再次查看此类类。\n\n##\
    \ 移动和拷贝文件\n\n```objc\nNSFileManager *fm = [NSFileManager new];\nif (shouldMove)\
    \ {\n    [fm copyItemAtPath: source toPath: destination error: nil];\n} else {\n\
    \    [fm moveItemAtPath: source toPath: destination error: nil];\n}\n```\n*来自\
    \ fileCopy.m*\n\n`NSFileManager` 类封装了整个文件系统并允许你对其进行操作。该类向 Objective-C 开发者暴露了与\
    \ Apple Finder 和 Windows 资源管理器向用户暴露相似的功能。\n\n在 OS X 10.5 之前，你使用的方法接受一个对象作为最后一个参数。在拷贝或移动操作进行期间，会向该对象发送消息。例如，这些消息会询问在错误后是否继续。\n\
    \n从 10.5 版本开始，Apple 决定大幅更改接口。现在的方法使用我们在第 12 章中讨论过的新错误报告模式，因此最后一个参数是一个指向 `NSError*`\
    \ 的指针，用于返回错误。消息现在被发送给对象的代理（delegate）。\n\n这意味着你现在必须在单个线程中使用 `NSFileManager`。在 10.5\
    \ 之前，该类是单例模式的一个用例。缓存 `+defaultManager` 方法的返回值（该方法返回单例实例）在以前是非常常见的做法。现在，如果使用缓存版本的代码可能从不同的线程调用，这样做是不安全的。\n\
    \n如果你正在编写新代码，你应该确保在每次想使用它时都创建一个新的 `NSFileManager` 实例并在之后销毁它，否则你可能会导致消息发送到了错误的代理。如果你不这样做，两个线程可以并发设置单例文件管理器的代理，导致其中一个接收到所有通知，而不是每个都接收它们感兴趣的通知。\n\
    \n**注意：** 这是一个考虑不周的软件设计示例。更好的解决方案是将代理存储在线程字典中（参见第 14 章）。如果你处于对单例类进行类似更改的情况下，请考虑这种方法，或者简单保留额外的参数作为回调。不要要求对现有代码进行侵入性更改以支持你的新接口。\n\
    \n如果你在文件管理器上使用旧的弃用方法，配合单例它是线程安全的。\n\n如果你没有调用任何发送代理的方法，使用单例也是安全的。这很遗憾，这意味着当你拷贝文件时可能需要创建一个新的\
    \ `NSFileManager` 实例，即使你已经有了单例实例的指针。\n\n## 获取文件属性\n\n```objc\nNSFileManager *fm\
    \ = [NSFileManager defaultManager];\nNSDictionary *attrs = [fm attributesOfItemAtPath:\
    \ *\"fileAttributes.m\"* error: NULL];\nNSString *fileType = [attrs fileType];\n\
    NSNumber *creator = [attrs objectForKey: NSreatorCode];\n```\n*来自 fileAttributes.m*\n\
    \n`NSFileManager` 类封装了大部分标准的 POSIX 操作函数。在 C 语言中，你通常使用 `stat()` 函数查找文件信息。\n\n该函数接受一个指向结构的指针作为参数，并从中填充文件信息。\n\
    \n这种局限性显而易见：你无法向结构中添加新字段，而不破坏所有使用它的现有代码。`NSFileManager` 版本要灵活得多。\n\n`-attributesOfItemAtPath:error:`\
    \ 方法返回一个 `NSDictionary`，向字典添加额外的条目而不会破坏二进制兼容是非常简单的。\n\n从这个示例中，我们可以向字典发送 `-fileType`\
    \ 消息来获取值。该方法是 `NSDictionary` 的，并返回与 `NSFileType` 键对应的字典条目。还有其他类似的字典方法。\n\n在 OS\
    \ X 上，你拥有比其他 POSIX 平台更多的文件元数据位。\n\nHFS+ 为每个文件存储了者代码（creator code）和类型代码（type code）。这些现在没有那么频繁使用了，但在\
    \ Classic MacOS 上，它们被用来代替扩展名来确定打开文件的正确应用程序。\n\n### 操作路径\n\n```objc\nNSString *home\
    \ = @ *\"~\"* ;\nNSString *full = [home stringExpandingTildeInPath];\nNSString\
    \ *users = [full stringByDeletingLastPathComponent];\nNSString *file = [users\
    \ stringByAppendingPathComponent: @ *\"users\"*];\nNSString *fileWithExtension\
    \ = [file stringByAppendingPathExtension: @ *\"db\"* ];\n```\n*来自 path.m*\n\n"
- fmt: "\nA lot of UNIX code manipulates paths by using the `sscanf()` and `sprintf()`\
    \ functions. This then causes a lot of problems when you come to port the code\
    \ to Windows or Symbian, for example, where the filesystem layout and path separator\
    \ are different.\n\nOpenStep was designed from the start to be portable across\
    \ different operating system families. The `NSString` class provides a few methods\
    \ designed for manipulating paths.\n\nAlthough these manipulate strings, they\
    \ expose an interface that is more abstract. You can add or remove path components,\
    \ which are single entries in a path (either files or directories). You can also\
    \ modify the file extension.\n\nOn OS X, like any UNIX system, there is a single\
    \ root folder, represented by a single slash subdirectories are separated by a\
    \ slash, and file extensions are separated by a dot. On Windows, there are multiple\
    \ roots, path components are separated by a backslash, but file extensions are\
    \ still separated by a dot.\n\nIf you use the path manipulation methods on `NSString`,\
    \ your code will work correctly irrespective of the filesystem conventions.\n\n\
    Unfortunately, `NSMutableString` does not have a corresponding set of operations.\
    \ You can avoid some of the overhead of creating lots of temporary objects by\
    \ using the `+pathWithComponents:` and `-pathComponents` methods, which construct\
    \ a string from an array of path components, and create an array of path components,\
    \ respectively.\n\nIt’s not worth worrying too much about efficiency in code that\
    \ deals with paths. Pretty much any operation on the filesystem will be a lot\
    \ more expensive than creating a few temporary objects.\n\n# CHAPTER 13: Accessing\
    \ Directories and Files\n\n## Determining if a File or Directory Exists\n\n```objc\n\
    NSFileManager *fm = [NSFileManager defaultManager];\nBOOL isDir;\nif ([fm fileExistsAtPath:\
    \ path isDirectory: &isDir])\n{\n    if (isDir)\n        printf( *\"Folder exists\\\
    n\"* );\n    else\n        printf( *\"File exists\\n\"* );\n}\nelse\n    printf(\
    \ *\"File does not exist\\n\"* );\n```\n*From: fileExists.m*\n\nThe simplest way\
    \ of determining whether a file exists is to try to access it and then check for\
    \ errors. This isn’t particularly elegant, although it is often the safe way to\
    \ work. If you want to provide some feedback to the user about whether an operation\
    \ is expected to work, before trying it, you need an explicit test.\n\nThe `-fileExistsAtPath:isDirectory:`\
    \ method does exactly this. The method’s name is a bit misleading. It tests whether\
    \ a file or directory exists at the specified path, and tells you if it is a directory.\n\
    \nThe second parameter is a pointer to a `BOOL`. If you’re coming from C or C++,\
    \ this will seem quite familiar, but for people coming from languages like Java,\
    \ and by extension Objective-C, only supports returning a single value, but this\
    \ method needs to return two things: whether something exists and whether it is\
    \ a directory. There are a few ways of implementing this. One would be to define\
    \ an enumerated type, with nothing exists, file exists, and directory exists elements.\n\
    \n**Note:** \nDon’t use this mechanism to create temporary files. If you do, there\
    \ is a potential race condition between testing whether the file exists and creating\
    \ it. Use the C library `mkstemp()` function instead. The EtoileFoundation framework\
    \ has a wrapper around this that you can use if you want to stay in object land.\n\
    \nThis would have made all of the code that uses this method simpler, so it’s\
    \ not immediately obvious why it wasn’t done. The answer becomes apparent when\
    \ you realize that you can pass `NULL` as the second argument. If you do this,\
    \ the method will not bother testing whether the object at that path is a directory.\
    \ This is a relatively small saving, so it’s not clear that this was a sensible\
    \ design choice.\n\n## Working with Bundles\n\n```objc\nNSBundle *mainBundle =\
    \ [NSBundle mainBundle];\nNSLog(@ *\"%@ links against: %@\"* , [mainBundle executablePath],\
    \ [NSBundle allFrameworks]);\n```\n*From: bundles.m*\n\nOn Apple System 7 and\
    \ earlier, the filesystem supported two forks: a code fork and a data fork. The\
    \ data fork was used to store arbitrary resources. With Mac OS 8.1, Apple introduced\
    \ HFS+, which supported an arbitrary number of forks, making files effectively\
    \ the same as directories in their ability to contain arbitrary numbers of children.\
    \ NTFS has the same functionality.\n\nOS X still supports resource forks and will\
    \ store the data in a hidden file on filesystems that do not support them, such\
    \ as `UFS` and `FAT`, but their use is not recommended. Copying files that contain\
    \ forks to other filesystems is a problem. If you copy a file to a `FAT` disk\
    \ with OS X and then copy it from that disk with Windows, you will not copy the\
    \ hidden file, so the data in the fork will be lost.\n\nMeanwhile, NeXT went in\
    \ a different direction. If forks make files like directories, why not just use\
    \ directories instead? NeXTSTEP provided functionality like forks on top of a\
    \ standard UNIX filesystem, just by using directories in place of files.\n\nDirectories\
    \ that are supposed to be treated as files are called bundles. To primitive low-level\
    \ filesystem operations, and to other operating systems, they look like directories.\
    \ If you copy an OS X application bundle, for example, to a USB drive and then\
    \ look at it on Windows, it will just like any other directory. When you look\
    \ at it in the Finder, however, it will look like a single file.\n\nThe two kinds\
    \ of bundles you will use in any Objective-C program are frameworks and applications.\
    \ These both contain executable code (a program or a shared library) and a set\
    \ of resources. The exact layout depends on the system. GNUstep uses the older\
    \ NeXT-style bundle layout, whereas OS X uses a slightly simpler one. You can\
    \ quite easily produce bundles that have both the GNUstep and Cocoa layouts, allowing\
    \ the same `.app` bundle to be portable between systems without recompiling.\n\
    \nYou can get the main bundle for an application by sending a `+mainBundle` message\
    \ to `NSBundle`. This is a class that is used to encapsulate bundles. It keeps\
    \ track of all dynamically loaded bundles. Bundles are naturally localizable.\
    \ Resources are stored in different subdirectories for each locale and can be\
    \ loaded on demand. The `-pathForResource:ofType:` method will return the localized\
    \ version of a named resource, with the specified extension, in the bundle’s resources\
    \ directory. You can use this in your code to get the localized version of a resource\
    \ file stored in your application bundle or from any loaded bundles.\n\n**Note:**\
    \ Command-line tools are typically not stored in bundles. They still have a main\
    \ bundle object, however. This object has the directory containing the main executable\
    \ as its path.\n\nIf your code is in a framework, you might want to get resources\
    \ from the framework bundle. This is slightly more complicated than getting code\
    \ from the main bundle. The `+bundleForClass:` method will give you the bundle\
    \ that contains the code for a specified class. If you think you might move a\
    \ class into a framework in the future, it’s a good idea to use this method when\
    \ loading resources.\n\n## Finding Files in System Locations\n\n```objc\nNSArray\
    \ *dirs = NSSearchPathForDirectoriesInDomains(\n    NSLibraryDirectory,\n    NSAllDomainsMask,\n\
    \    YES\n);\n```\n*From: frameworkLoader.m*\n\nOn OS X, the filesystem layout\
    \ is quite well defined. You can probably hard-code paths and expect things to\
    \ work. If you port your code to other platforms, you will find that things break\
    \ quite significantly.\n"
  raw: 'A lot of UNIX code manipulates paths by using the sscanf() and sprintf() functions.
    This then causes a lot of problems when you come to port the code to Windows or
    Symbian, for example, where the filesystem layout and path separator are different.


    OpenStep was designed from the start to be portable across different operating
    system families. The NSString class provides a few methods designed for manipulating
    paths.


    Although these manipulate strings, they expose an interface that is more abstract.
    You can add or remove path components, which are single entries in a path (either
    files or directories). You can also modify the file extension.


    On OS X, like any UNIX system, there is a single root folder, represented by a
    single slash.


    Subdirectories are separated by a slash, and file extensions are separated by
    a dot. On Windows,


    **Manipulating Paths** 235


    there are multiple roots, path components are separated by a backslash, but file
    extensions are still separated by a dot.


    If you use the path manipulation methods on NSString, your code will work correctly
    irrespective of the filesystem conventions.


    Unfortunately, NSMutableString does not have a corresponding set of operations.
    You can avoid some of the overhead of creating lots of temporary objects by using
    the


    +pathWithComponents: and -pathComponents methods, which construct a string from
    an array of path components, and create an array of path components, respectively.


    It’s not worth worrying too much about efficiency in code that deals with paths.
    Pretty much any operation on the filesystem will be a lot more expensive than
    creating a few temporary objects.


