    runtime, constant strings are represented by an instance of a class with three
    instance variables: the isa pointer, a pointer to a C string, and an integer containing
    the length of the C string.


    The runtime library will set the isa pointer to the correct class when the module
    is loaded.


    When you access individual characters in an Objective-C string, you use the unichar
    type.


    This represents a single UTF-16 character. Note that UTF-16 is also a variable-length
