  trans: "\n以较低的优先级处理进程。如果你设置线程优先级大于 0.5，请记住这会对系统的其他部分产生不利影响。\n\n这仍然不会导致完全的饥饿。在 OS\
    \ X 10.6 中，对于纯粹的 CPU 密集型任务，最高线程优先级获得的 CPU 时间比最低优先级分配的略多一倍。大多数任务会涉及一些等待从磁盘读取的时间。\n\
    \n处于阻塞状态的线程无论其优先级如何，都不会消耗 CPU 时间。\n\nOS X 上的调度策略与传统的 UNIX 模型相反，在传统模型中，只有超级用户才能提高进程的优先级。\n\
    \n有趣的是，在 OS X 的最新版本中，线程优先级对线程获取 CPU 时间多少的影响实际上比其所属进程的优先级更大。这意味着，虽然你不能提高进程的优先级，但可以通过提高进程中所有线程的优先级来实现相同的效果。\n\
    \n防止普通用户增加进程优先级的原始设计，是为了防止一个用户获取不公平的 CPU 时间。\n\nOS X 系统倾向于单用户机器，因此这个问题并不严重，但你仍然可以从同一用户拥有的更重要的任务中夺处理器时间。例如，实时视频捕获对性能非常敏感，如果你的程序决定设置足够高的优先级，导致捕获应用程序丢帧，用户可能会非常恼怒。\n\
    \n设置线程优先级时要考虑考虑。通常情况下，你只应该使用 0 到 0.5 之间的范围。只有在绝对没有其他选择的情况下，才将线程优先级设置为高于默认水平。\n\
    \n不要仅仅你正在执行某些 CPU 密集型操作并希望它运行快就这样做。\n\n## 同步线程\n\n```objc\nstatic NSLock *lock;\n\
    static NSMutableArray *messages;\n\nvoid recordLogMessage(NSString *msg)\n{\n\
    \    [lock lock];\n    @try\n    {\n        [messages addObject: msg];\n     \
    \   NSLog(@ *\"%@\"*, msg);\n    }\n    @finally\n    {\n        [lock unlock];\n\
    \    }\n}\n```\n*来自：lock.m*\n\n你可以通过多种方式同步两个线程。执行此类同步的类都遵循 `NSLocking` 协议。该协议定义了两个方法：`-lock`\
    \ 和 `-unlock`。\n\n最简单的锁类是 `NSLock`，它实现了`互斥锁 (mutex)`。一次只能有一个线程锁定它，因此向它发送 `-lock`\
    \ 消息会导致任何其他向该对象发送 `-lock` 消息的线程被阻塞，直到你发送相应的 `-unlock` 消息。\n\n这对于保护较短的临界区域有用。对于较长的临界区域，`NSRecursiveLock`\
    \ 通常更有用。如果你在同一个线程中向 `NSLock` 发送两个 `-lock` 消息，就会死锁。你可以向 `NSRecursiveLock` 发送任意数量的\
    \ `-lock` 消息，只要发送相同数量的 `-unlock` 消息即可。对于可能从已获取锁的代码以及未获取锁的代码中调用的方法非常有用。\n\n传统上，这些类的问题在于它们与异常处理的集成得不好。如果你获取了锁然后调用了抛出异常的内容，你就会遇到问题。锁将永远不会释放。\n\
    \n当 Apple 引入新的异常处理关键字时，它们引入了 `@synchronized`。它会在任意对象上锁定，并确保在抛出异常时释放锁。\n\n通常来说，使用这个关键字是一个坏主意。虽然它让生活变得简单了一些，而且\
    \ Java 程序员对其很熟悉，但其实现非常低效。它需要将锁与对象关联，而且即使在并不理想的情况下，它总是使用递归锁。\n\n你可以通过确保在 `@finally`\
    \ 块中发送 `-unlock` 消息来实现相同的效果。如果你确定所有调用的方法或函数都不会抛出异常，可以跳过 `@try` 和 `@finally` 块，但在\
    \ GNU 和现代 Apple 运行时中，它们没有任何运行时开销。\n\n## 存储线程特定数据\n\n```objc\nNSMutableDictionary\
    \ *threadDict = [[NSThread currentThread] threadDictionary];\n[threadDict setObject:\
    \ @ *\"default\"* forKey: @ *\"NewKey\"* ];\n```\n*来自：threadDict.m*\n\n一旦你有了线程，你通常想为线程私有地存储一些数据。Cocoa\
    \ 中的一个例子是当前图形上下文，它必须对任何绘图代码可用，但不能在线程之间共享。\n\n通常，你使用 `pthread_set_specific()` 函数来实现这一点，它存储一个与当前线程关联的指针。这通常通过在寄存器中存储内存区域的地址，并使用该区域起始的固定偏移量处理每个位线程特定数据来实现。这意味着你需要在每个线程中为每个线程本地指针留出空间，即使你只将其中一个设置为非\
    \ NULL 值。\n\n如果 Cocoa 这样存储图形上下文，那么每个线程都需要一个字的空间，尽管大多数程序只在一个或可能两个线程中需要有效的图形上下文。\n\
    \n此问题的解决方案是线程字典（thread dictionary）。这是一个与线程关联的变变字典。你每个线程只需要一个字来存储它，但你可以在其中存储任意数量的对象。通过向当前线程发送\
    \ `-threadDictionary` 消息可以访问线程字典。当线程退出时，字典会被销毁。因为字典会保留它们的参数，这意味着任何仅从线程引用的对象将在析构函数运行后被释放。线程在退出之前会发布\
    \ `NSThreadWillExitNotification`，所以如果你想运行某些清理代码可以观察它。\n\n注意：\n在大多数平台上，你可以使用 `__thread`\
    \ 关键字，这是一个 GCC 扩展，将变量存储在线程本地存储中。Darwin 加载器不支持线程局部，因此在 OS X 上这是不可行的。这可能会很快改变，因为\
    \ C 和 C++ 标准的后续版本都有类似的功能。\n\n线程字典提供了一种在嵌套栈帧之间传递参数的好方法。有时你想设置一些半全局状态，该状态在方法持续期间有效并被该范围内的所有方法访问。经典的\
    \ Cocoa 例子是图形上下文对象，它在视图层次结构的根部设置，然后由嵌套调用修改和使用。在 LanguageKit 中，我使用相同的模式允许 AST 节点访问编译器对象。在两种情况下，缺乏紧耦合意味着同一个对象的同一个方法可以在两个线程中调用，且上下文不同。\n\
    \n## 等待条件\n\n```objc\n- (**void**)addToQueue\n{\n    [condition lock];\n    queueSize++;\n\
    \    [condition signal];\n    [condition unlock];\n}\n\n- (**void**)main\n{\n\
    \    **while** (1)\n    {\n        **id** pool = [NSAutleasePool new];\n     \
    \   [condition lock];\n        **while** (queueSize == 0)\n        {\n       \
    \     [condition wait];\n        }\n        queueSize--;\n        [condition unlock];\n\
    \        NSLog(@ *\"处理了队列数据\"* );\n        [pool release];\n    }\n}\n```\n*来自：condition.m*\n\
    \n经常，你想让一个线程睡眠并在另一个线程执行某些操作时唤醒它。POSIX 线程 API 提供了条件变量（condition variables）来实现这一点。条件变量与互斥锁（mutex）配对使用。\n"
- fmt: "\nWhen you wait on a condition variable, you first acquire the mutex, then\
    \ atomically release it and sleep on the condition variable. When the condition\
    \ variable is signalled, you wake and atomically reacquire the mutex. You can\
    \ think of condition variables as a way of passing a mutex between threads.\n\n\
    The OpenStep specification included a class encapsulating this low-level primitive:\
    \ `NSConditionLock`. Unlike the POSIX version, which needs to be associated with\
    \ a mutex on each call, this class contains its own mutex and implements the `NSLocking`\
    \ protocol. \n\nThis means that you can use a condition lock as a lock, although\
    \ that would be wasteful. As well as the lock, the condition lock also has an\
    \ integer variable associated with it, representing the condition. When you sleep\
    \ on a condition lock, you can specify a value. Your thread will then not be awoken\
    \ until the condition lock is signalled with this value.\n\nThe condition lock\
    \ is quite convenient when the condition you are waiting for is an integer value,\
    \ but less so in other cases. Often, you want a thread to wake up when an object\
    \ enters a particular state. This is quite easy with the low-level POSIX functions,\
    \ because they expect you to test the condition yourself, but is less easy with\
    \ the `NSConditionLock`.\n\nTo address this, Apple introduced the `NSCondition`\
    \ class. This is a simple wrapper around a POSIX mutex and condition variable.\
    \ You can lock it, sleep on it releasing the lock, and then signal it from another\
    \ thread to wake it up.\n\n### Waiting for a Condition\n\nWhen you wake after\
    \ sleeping on an `NSCondition`, the condition object will be locked. You must\
    \ test your condition and then either unlock the condition object or go back to\
    \ sleep.\n\nYou use the same pattern with condition variables in almost every\
    \ case you will use them.\n\nGenerally, they let you establish a producer-consumer\
    \ relationship between threads. The consumer thread needs to sleep until there\
    \ is some data waiting for it. The producer threads need to wake up the consumer\
    \ thread when there is some data for it.\n\nThe example at the start of this section\
    \ showed two methods on a class. The `-addToQueue` method is expected to be called\
    \ from a producer thread, whereas the `-main` method implements the consumer thread.\n\
    \nThe consumer thread code shows several important features of a threaded object.\
    \ Rather than using `NSRunLoop`, this implements its own run loop, an infinite\
    \ loop, and creates and destroys an autorelease pool at every iteration explicitly.\
    \ In each iteration, it first locks the condition and then, if there is no data\
    \ waiting, releases the lock and sleeps.\n\nA producer thread can then acquire\
    \ the lock and signal the condition. When this happens, the consumer thread will\
    \ be poised to wake up as soon as the lock becomes available. The producer permits\
    \ this by releasing the lock. The consumer thread then gets the next bit of data\
    \ to process and releases the lock. In this example, incrementing and decrementing\
    \ a shared variable is used as a proxy for adding some data to a shared data structure.\n\
    \n**Note:** The sequence of operations required to wake a thread from a condition\
    \ variable is quite expensive, so it’s worth avoiding if possible. For communicating\
    \ between two threads, I generally prefer to use a lockless ring buffer that switches\
    \ to a locked mode after it has been empty for a while.\n\nApple’s Grand Central\
    \ Dispatch implements this model internally, so you can use it without having\
    \ to write the ring buffer code yourself.\n\n![Image 16](index-275_1.png)\n\n\
    ### Binding Variables to Blocks\n\n```c\nint (^add)(int, int) =\n^(int a, int\
    \ b)\n{\n    return a + b;\n};\n```\n*From: blockScope.m*\n\nYou can think of\
    \ functions as a special case of blocks. A function, conceptually, is a block\
    \ that is declared in the global scope. They are implemented in a slightly different\
    \ way, but the differences are very small in this case.\n\nThe simplest case for\
    \ a block, therefore, is equivalent to a function. It takes some arguments, produces\
    \ some output, and doesn’t refer to anything outside of its own scope. The snippet\
    \ at the start of this section shows an example of this kind of block. This declaration\
    \ is at the global scope, and looks like a very verbose form of a function declaration.\n\
    \nThe next kind of block refers to things in the scope of the function where it\
    \ was declared. You can see a block of this in in the rest of `blockScope.m`.\
    \ This block refers to two variables. `counter` is a static variable, which means\
    \ that it is stored in some memory mapped from the program image, just like a\
    \ global. The reference to this in the block will work just like a reference to\
    \ any other static or global; only one copy of the variable exists.\n\n**Note:**\
    \ Although there is only one type of block exposed to the programmer, there are\
    \ two in the implementation. You can find out which kind of block you have by\
    \ inspecting the `isa` pointer, although this is not guaranteed by the public\
    \ API and is subject to change without notice.\n\nIf you create a block that does\
    \ not refer to anything other than its parameters or global variables, then the\
    \ block is statically allocated, and every time it is conceptually created, you\
    \ will get a pointer to the same object. If you create a block that refers to\
    \ things on the stack, then the blocks runtime will create a new copy of it on\
    \ the heap every time that it is created.\n\nThe other variable, `c`, is a local\
    \ variable. This is allocated on the stack in the `getCounter()` function. When\
    \ that function returns, the variable is destroyed. The block still exists, but\
    \ it refers to a copy of the variable. This means that `c` inside the block always\
    \ contains the value it had when the block was created. You can see in the output\
    \ how this works.\n\n```c\nint (*getCounter())(void) {\n    static int counter;\n\
    \    int c = counter;\n    void (*block)(void) = ^(void) {\n        printf(\"\
    current: %d \", counter);\n        printf(\"old: %d\\n\", c);\n    };\n    counter++;\n\
    \    return _Block_copy(block);\n}\n\nint main(void) {\n    void (*block)(void)\
    \ = getCounter();\n    block();\n    void (*block2)(void) = getCounter();\n  \
    \  block2(); block2();\n    block(); block2();\n    return 0;\n}\n```\n*Output\
    \ from blockScope.m*\n```\ncurrent: 1 old: 0\ncurrent: 1 old: 0\ncurrent: 2 old:\
    \ 1\ncurrent: 2 old: 1\ncurrent: 2 old: 0\n```\n\nA traditional closure refers\
    \ to the real variables in the enclosing scope, not copies. You can get this behavior\
    \ by declaring the variable with the `__block` qualifier. The implementation of\
    \ this is very complicated. The variable is moved from the stack into a reference\
    \ counted bit of code in heap memory. This means that every reference to it will\
    \ refer to the same variable. The `blockCapture.m` example demonstrates this,\
    \ with a function that creates two, linked, counters.\n\n```c\ntypedef int (*counter_t)(void);\n\
    \nvoid linkedCounters(counter_t *a, counter_t *b) {\n    __block int c = 0;\n\
    \    *a = ^(void) { return c++; };\n    *b = ^(void) { return ++c; };\n    *a\
    \ = _Block_copy(*a);\n    *b = _Block_copy(*b);\n    c++;\n}\n\nint main(void)\
    \ {\n    counter_t pre, post;\n    linkedCounters(&post, &pre);\n    printf(\"\
    %d %d, %d, %d\\n\", pre(), post(), pre(), post());\n    return 0;\n}\n```\n*From:\
    \ blockCapture.m*\n*Output:*\n```\n1 1, 2, 2\n```\n\nBoth of these counters refer\
    \ to the same variable in memory: one returns it then increments it; the other\
    \ increments it then returns it. When\n"
