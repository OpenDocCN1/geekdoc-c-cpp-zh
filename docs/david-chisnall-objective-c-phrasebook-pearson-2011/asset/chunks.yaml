    \ 字符串，你得到的是用户选择的文本编码，而不是创建文件的人所选择的编码。\n\n这些方法现在都已弃用，取而代之的是接受显式编码参数的方法。需要记住的一点是，任何多字节编码的默认值都是大端，这在\
