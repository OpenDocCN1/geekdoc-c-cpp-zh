  trans: "\n\n```objc\nOBJC_GC_EXPORT id objc_assign_weak(id value, id *location);\n\
    ```\n*源自 `objc-auto.h`*\n\n使用 `-fobjc-gc` 标志，代码将同时支持引用计数和自动垃圾回收。这在你编译框架（framework）时非常有用。你仍然必须记得在正确的位置添加\
    \ `-retain` 和 `-release` 调用，但你框架的用户可以在开启或不开启回收的情况下使用它。\n\n## 与 C 语言互操作\n\n在垃圾回收模式下，并不是所有内存都会扫描。任何通过\
    \ `malloc()` 分配的内存对垃圾回收器都是不可见的。如果你将一个对象指针作为 `void*` 参数传递给 C 函数，而该函数随后将其存储在 `malloc()`\
    \ 分配的内存中，它将对收集器变得不可见，并且即使仍有指向它的引用，它也可能被释放。\n\n## 使用弱引用\n\n通常，你在执行此操作之前会向对象发送一个\
    \ `-retain` 消息，但在垃圾回收模式下这是不起作用的。相反，你必须使用 `CFRetain()` 函数。这会增加对象的引用计数，无论垃圾收集器是否正在运行。\n\
    \n收集器只有在对象的保留计数为零且在追踪内存中找不到任何指向它的引用时，才会释放这些对象。\n\n当你完成了一个位于收集器范围之外的引用后，你需要调用 `CFRelease()`。遗憾的是，这并不是你需要使用这些函数的唯一情况。\n\
    \n在某些情况下，当你将对象作为回调函数的参数传递时，也需要使用它们。\n\n```objc\n@interface WeakDelegate : NSObject\n\
    {\n    __weak id delegate;\n}\n@property __weak id delegate;\n@end\n\n@implementation\
    \ WeakDelegate\n    @synthesize delegate;\n@end\n```\n*源自 `gc.m`*\n\nApple 垃圾回收实现中最棒的特性之一就是存在*置零弱引用（zeroing\
    \ weak references）*。在垃圾回收出现之前的 Objective-C 文档中，未被保留的指针通常被称为“弱（weak）”。这些引用被允许持续到对象生命周期之外。遗憾的是，没有自动的方法可以判断它们是否仍然有效。\n\
    \n**注意：**\n引用计数环境中的弱引用（例如引用代理的引用）通常用于消除循环引用。在追踪环境中不需要这些引用，因此你可以对指向代理的指针以及任何可能出现循环引用的地方使用强引用。\n\
    \n如果你在垃圾回收模式下声明一个 `__weak` 对象指针，你将获得一个置零弱引用。垃圾收集器在判断对象是否仍然存活时不会计算它。如果指向对象的所有引用都是弱引用，它就可以被销毁。之后，读取弱引用将返回\
    \ `nil`。\n\n弱引用最常用于与通知（notifications）等场景。你会对对象保留一个弱引用，只要它在其他地方被引用，你就继续向它发送消息，然后稍后可以让它自动被清理。\n\
    \n## 分配扫描内存\n\nCocoa 现在自带了一些可以让你存储弱引用的集合。旧版本的 Foundation 框架提供了 `NSMapTable` 和\
    \ `NSHashTable` 作为透明的 C 类型，并配有一组用于 C 函数来使用它们。这些接口仍然可用，但从 10.5 版本开始，Apple 将这两个\
    \ C 类型转换为了类。\n\n`NSMapTable` 类型是 `NSDictionary` 的通用形式，可以存储任何指针大小的类型同时作为键和值。\n\n\
    通过垃圾回收，你还可以使用此类来存储指向强或弱对象指针的映射。这对于像 `NSNotificationCenter` 这样的工具非常有用，以便对象在仍注册接收通知时可以被收集，并在发生这种情况时可以自动从通知中心中移除。\n\
    \n```objc\nid *buffer = NSAllocateCollectable(\n    10 * sizeof(id),\n    NSScannedOption);\n\
    ```\n*源自 `gc.m`*\n\n如果你使用 `malloc()` 分配内存，它对垃圾回收器是不可见的。如果你想要（例如）一个包含对象的 C 数组，这就会成为问题。我们已经考虑过这种问题的一种解决方案。你可以对正要存储的对象调用\
    \ `CFRetain()`，对旧值调用 `CFRelease()`，然后交换它们的位置。这并不理想，尽管它能够行得通。\n\n另一个选项是从垃圾回收器分配一块内存区域。`NSAllocateCollectable()`\
    \ 函数与 `malloc()` 类似，但有两个重要的区别。\n\n1. 第一点是它返回的内存是受垃圾回收的。没有对应的 `NSFreeCollectable()`\
    \ 函数。当指向缓冲区的最后一个指针消失时，该缓冲区将被收集。\n\n**注意：**\nApple 收集器不支持内部引用（interior references），因此你必须确保保留一个指向该区域起始位置的指针。指向缓冲区中间位置的指针不会阻止它被释放。\n\
    \n2. 第二点区别是该函数的第二个参数定义了你想要的内存类型。如果你打算将缓冲区用于存储 C 类型，只需在此处传递 零即可。如果你传递了 `NSScannedOption`，返回的缓冲区将被扫描，作为可能的对象指针位置，以及由\
    \ `NSAllocateCollectable()` 返回的其他内存区域的指针。\n\n## 支持两阶段创建\n\n```objc\nNSMutableString\
    \ *buffer = [[NSMutableString alloc] init];\nNSMutableArray *array = [[NSMutableArray\
    \ alloc] initWith\n```\n*源自 `allocInit.m`*\n\n你已经见过的模式之一是*两阶段创建（two-stage creation）*。在传统的、、非\
    \ NeXT 时代的 Objective-C 中，你通过向类发送 `+new` 消息来创建一个对象。当你实现一个新类时，你会重写 `+new` 以调用父类的实现，然后执行该类的初始化。NeXT\
    \ 改变了这一点，将对象的创建和初始化分为两个不同的方法。`+new` 方法仍然有效，但它现在是向类发送 `+alloc` 消息并向返回的对象发送 `-init`\
    \ 消息。\n\n`+alloc` 方法本身默认调用 `+allocZone:`。它接收一个 `NSZone` 作为参数。这是一个封装了分配区域的透明类型。这在\
    \ NeXT 系统上被大量使用，以有效利用这些机器极其有限的内存。它在 OS X 上运行并不理想，而且并不是所有类都支持它，因此在许多现代 Objective-C\
    \ 代码中是一个遗留特性。\n\n当你创建一个新类时，重写 `-init` 方法或提供一个新的指定方法。\n\n**注意：**\n你仍然可以在 GCC 中发现一些旧创建方式的痕迹。当\
    \ `+new` 用于创建对象时，通常创建一个新实例并赋值给类方法中的 `self`。GCC 中有一些代码支持这一点，允许从类方法访问实例变量。该功能在很久以前就被废弃了，所以现在当你尝试这样做时会收到警告。\n\
    \n重写 `+alloc` 是非常罕见的。有时人们这样做是为了实现类级池或强制单例，但这并不寻常。如果你正在实现一个单例类，你可以重写 `+alloc` 以返回一个已存在的实例。我们将在本章后面介绍这一点。\n\
    \n## 拷贝对象\n\n```objc\n@interface Pair : NSObject <NSCopying>\n@property (nonatomic,\
    \ retain) id first, second;\n@end\n\n@implementation Pair\n    @synthesize first,\
    \ second;\n    - (id)copyWithZone:(NSZone*)aZone {\n        Pair *new = [**self**->isa\
    \ allocWithZone: aZone];\n        new.first = first;\n        new.second = second;\n\
    \        return;\n    }\n@end\n```\n\n"
- fmt: "\n```\nreturn new;\n```\n\n14\n\n}\n\n15\n\n`@end`\n\n*From: copy.m*\n\nThe\
    \ `Foundation` framework includes a function called `NSCopyObject()`. You might\
    \ logically expect that this will copy an object, and you’d be almost right. It\
    \ creates a new object with the same class as the original and then uses something\
    \ like `memcpy()` to copy the instance variables over.\n\nThis works fine for\
    \ objects that only have primitive C types as their instance variables, but not\
    \ so well for others. Object pointers need to be sent a `-retain` message when\
    \ they are copied.\n\nC pointers may need some other things done to them, particularly\
    \ if they are opaque types returned from some other library.\n\nWithout information\
    \ about exactly what the relationship between objects is, the `copy` function\
    \ cannot create a true copy automatically. Some\n\n# Copying Objects\n\n79\n\n\
    objects should not even support copying. What, for example, would you expect the\
    \ semantics of copying an object that encapsulates a socket to be? Would you get\
    \ two objects encapsulating the same socket?\n\nThe only thing that really knows\
    \ how to make a copy of an object is the object itself. If the object implements\
    \ the `NSCopying` protocol, you can send it a `-copyWithZone:` message to get\
    \ the copy. This takes an `NSZone` as the argument.\n\nMost code these days doesn’t\
    \ bother with `NSZone`. `NSObject` provides a `-copy` method, which just calls\
    \ `-copyWithZone:` with the default zone as the argument. Although you may always\
    \ call `-copy`, you should implement\n\n`-copyWithZone:`.\n\nThis method normally\
    \ begins by sending an `+allocWithZone:` message to the receiver’s `isa` pointer,\
    \ which creates a new instance. It may then call an initializer, or it might fill\
    \ in the instance variables itself.\n\n# Note:\n\nIf you are inheriting from a\
    \ superclass that implements the `NSCopying` protocol, you should send a `-copyWithZone:`\
    \ message to `super` in your `-copyWithZone:` implementation and then only copy\
    \ the instance variables your subclass added.\n\nAn object returned by `-copy`\
    \ (or `-copyWithZone:`) should be treated in the same way as one returned by `+alloc`\
    \ (or `+allocWithZone:`). Its initial retain count will be one, so you must remember\
    \ to send it a `-release` or `-autorelease` message at some point, to avoid memory\
    \ leaks.\n\n# Archiving Objects\n\n55\n\n```\nvoid roundTripWithArchiver(id object,\
    \ Class coder, Class decoder)\n{\n    NSData *data = [coder archivedDataWithRootObject:\
    \ object];\n    id copy = [decoder unarchiveObjectWithData: data];\n    NSCAssert(data,\
    \ @\"Archiving failed\");\n    NSCAssert(copy, @\"Unarchiving failed\");\n   \
    \ NSCAssert([object integer] == [copy integer]), @\"Integer wasn’t copied correctly\"\
    );\n    NSCAssert([[object string] isEqual: [copy string]], @\"String wasn’t copied\
    \ correctly\");\n}\n```\n\n*From: archive.m*\n\nOften, you need some parts of\
    \ your program’s state to persist for longer than a single invocation. You can\
    \ store some pure-data object types in property lists, as we’ll see in Chapter\
    \ 7, but what about storing arbitrary objects?\n\nYou can write data out in some\
    \ custom (or public) format and then re-create the objects from this. Defining\
    \ new file formats just because you want a few objects to persist is a bit more\
    \ effort than most programmers want to exert, however.\n\nFortunately, Foundation\
    \ provides the answer in the `NSCoding` protocol. This defines two methods: `-initWithCoder:`\
    \ and `-encodeWithCoder:`. A lot of the standard classes implement this protocol,\
    \ and it’s relatively easy to implement yourself.\n\nThe object passed as an argument\
    \ to these methods is a `coder`. This is a class that encapsulates some data representation.\
    \ On older systems, this was typically `NSArchiver`, but on newer ones it will\
    \ usually be `NSKeyedArchiver`.\n\nThe older `NSArchiver` interface just let you\
    \ write a stream of (typed) values. Keyed archives, however, support storing something\
    \ more like a dictionary. They let you store key-value pairs and then read them\
    \ back in a different order.\n\nThere are two parts to supporting archiving.\n\
    \nYour object must be able to write itself to an archive, and it must be able\
    \ to read itself back.\n\nIn the `-encodeWithCoder:` method, you must write all\
    \ of the object’s state to the coder.\n\nThis does not necessarily mean all of\
    \ the object’s instance variables. Some objects have instance variables that are\
    \ just used for caching information that can be reconstructed from elsewhere.\
    \ It is generally better to reconstruct these after awaking than to store them.\n\
    \nIt’s a good idea to support both keyed and non-keyed coders. Often, non-keyed\
    \ archivers\n\n82\n\nCHAPTER 4: Common Objective-C Patterns 34\n\n```\nvoid encodeWithCoder:(NSCoder*)aCoder\n\
    {\n    if ([aCoder allowsKeyedCoding])\n    {\n        [aCoder encodeInt:integer\
    \ forKey: @\"integer\"];\n        [aCoder encodeObject:string forKey: @\"string\"\
    ];\n    }\n    else\n    {\n        [aCoder encodeValueOfObjCType:@encode(int)\
    \ at: &integer];\n        [aCoder encodeObject:string];\n    }\n}\n```\n\n*From:\
    \ archive.m*\n\n-are used for transient encodings (for example, transmission over\
    \ a network), whereas keyed coders are used for persistent data.\n\nKeyed archivers\
    \ have more convenient methods for archiving primitive types. You can send such\
    \ as `encodeInt:forKey:` messages. The older-style archivers only have one method\
    \ for storing primitive types, which takes the Objective-C type and a pointer\
    \ to the variable.\n\nThe corresponding method for loading can be a bit complicated.\
    \ The archiver stores the version, so it should check the version and handle the\
    \ archive differently if it corresponds to an old version.\n\nIt’s also important\
    \ to remember to call the superclass implementation of both of these methods if,\
    \ only if, the superclass conforms to the `NSCoding` protocol. If it doesn’t,\
    \ but does have state that you wish to persist, you are responsible for archiving\
    \ this as well as your subclass’s instance variables.\n\nArchiving Objects 83\n\
    \n```\n-id initWithCoder:(NSCoder*)aCoder\n{\n    if ([aCoder versionForClassName:[self\
    \ className]] != 0)\n    {\n        [self release];\n        return nil;\n   \
    \ }\n    if ([aCoder allowsKeyedCoding])\n    {\n        integer = [aCoder decodeIntForKey:@\"\
    integer\"];\n        string = [aCoder decodeObjectForKey:@\"string\"];\n    }\n\
    \    else\n    {\n        integer = [aCoder decodeValueOfObjCType:@encode(int)\
    \ at: &integer];\n        string = [aCoder decodeObject];\n    }\n    string =\
    \ [string retain];\n    return self;\n}\n```\n\n*From: archive.m*\n\nThe `-initWithCoder:`\
    \ method might need to load archives from older versions of your program, so it\
    \ should check the version and handle the archive differently.\n\n`+setVersion:`\
    \ message to `self` when you change an object’s instance variable layout.\n\n\
    Creating Designated Initializers\n\n84\n\nCHAPTER 4: Common Objective-C Patterns\n\
    \n```\n- (id)initWithSelectorName:(NSString*)aSel arguments:(NSArray*)args\n{\n\
    \    if (nil == (self = [super init]))\n    { return nil; }\n    selector = [aSel\
    \ copy];\n    arguments = [args mutableCopy];\n    return self;\n}\n\n- (id)initWithSelectorName:(NSString*)aSel\n\
    {\n    return [self initWithSelectorName:aSel arguments:nil];\n}\n\n- (id)init\n\
    {\n    return [self initWithSelectorName:nil];\n}\n```\n\n*From: designatedInit.m*\n\
    \n-Most of the classes we’ve looked at so far have been initialized using the\
    \ `-init` method. This method is the *designated initializer* in `NSObject`.\n\
