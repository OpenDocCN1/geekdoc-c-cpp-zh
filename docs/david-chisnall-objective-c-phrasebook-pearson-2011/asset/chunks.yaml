  trans: "\n它不执行任何操作，只是返回 `self`。这意味着，在 `NSObject` 的直接子类中，可能会避免向 `super` 发送 `-init`\
    \ 消息。这通常被认为是一种坏习惯，因为 `NSObject` 的分类（category）可能会将此方法替换为一个实际执行操作的方法。\n\n并不是所有类都将\
    \ `-init` 作为指定初始化器。按照惯例，参数最多的初始化器就是指定初始化器。所有其他初始化方法都会调用这一个。\n\n这种方法使得子类化变得简单得多。\n\
    \n许多类为初始化提供了许多简便方法。如果你必须在每个子类中重写所有这些方法，你最终将产生大量没有额外价值的代码。\n\n如果父类使用指定初始化器模式，你只需要重写一个初始化器。\n\
    \n本节中的示例取自 `LanguageKit` 中的 `LKMessageSend` 类。这是一个表示消息发送操作的抽象语法树节点。父类的指定初始化器是\
    \ `-init`，因此该类在其自己的指定初始化器中调用了 `-init`。该类重写了 `-init`，但重写后的版本调用了该类的指定初始化器。\n\n如果你是该类的子类，你只需要重写\
    \ `-initWithSelectorName:arguments:` 方法，而且只有当你添加需要初始化的实例变量时才需要这样做。向你的类发送 `-init`\
    \ 消息的人将获得一个已初始化的实例。\n\n### 强制单例模式\n\n```objc\n@implementation Singleton\n\nstatic\
    \ Singleton *sharedInstance;\n\n+ (void)initialize\n{\n    if ([Singleton class]\
    \ == self)\n    {\n        sharedInstance = [self new];\n    }\n}\n\n+ (Singleton*)sharedInstance\n\
    {\n    return sharedInstance;\n}\n\n+ (id)allocWithZone: (NSZone*)aZone\n{\n \
    \   if (sharedInstance && [Singleton class] == self)\n    {\n        [NSException\
    \ raise: NSGenericException format:@\"May not create more than one instance of\
    \ singleton.\"];\n    }\n    return [super allocWithZone: aZone];\n}\n\n@end\n\
    ```\n*来自：singleton.m*\n\n单例是全局对象的面向对象版本。单例类只有一个实例。Objective-C 中有很多此类，但它们都遵循相同的通用模式。\n\
    \n本节开头的示例是一个骨架类，它只允许创建自身的实例。这遵循了在响应 `+sharedInstance` 消息时返回单例实例的惯例。许多单例类会在消息名称中使用类名来代替\
    \ `Instance`。\n\n例如，在 AppKit 应用中获取共享应用程序对象，你会向 `NSApplication` 发送 `+sharedApplication`\
    \ 消息。该类是单例的一个特例，因为它将其共享实例存储在全局变量 `NSApp` 中。如果应用程序已经启动，你可以直接使用该变量，从而避免发送消息来获取应用程序对象。\n\
    \n单例最常见的错误是在创建过程中引入了竞态条件。这个特定的单例将自己的实例存储在一个私有变量中。在 `+sharedInstance` 方法中创建它是有诱惑力的。\n\
    \n这对于单线程应用程序运行良好良好，但对于多线程应用程序呢？\n\n如果你从两个线程同时发送 `+sharedInstance` 消息，会发生什么？两者都可能测试变量，发现它尚未被创建，然后创建它。为了解决这个问题，你可以使用锁。\n\
    \n一个更简单的解决方案是在 `+initialize` 方法中创建实例。该方法在运行时第一次向该类发送消息时被调用。确保该方法在其他线程向类投递任何消息之前完成，是运行时的责任。\n\
    \n**注意：** Apple 文档建议在 `+sharedInstance` 方法中使用 `@synchronized(self)` 来创建单例。那种方法比本节建议的方法要慢得多，并且需要更多代码，因此没有什么推荐的。\n\
    \n你不需要在单例中重写 `+allocWithZone:`，但如果你重写了，它会提供一点额外的运行时检查。如果你在单例实例创建后尝试分配该类的新实例，示例代码将抛出异常。\n\
    \n注意 `+allocWithZone:` 和 `+initialize` 方法中的测试。这些测试对于子类化是必要的。如果有人创建你的单例对象的子类，你不希望他们会抛出异常。单例的子类化非常复杂，如果你不想支持它，可以跳过这个额外的测试。\n\
    \n### 委托\n\nObjective-C 不支持多继承。这并不是一个巨大的局限，因为要用好多继承非常困难，但在某些问题上，它似乎是自然的解决方案。\n\
    \n*委托模式*（delegation pattern）背后的思想与继承和原型模式类似：你允许一个对象定义另一个对象行为的子集。你不会在 Foundation\
    \ 框架中看到这个，但在 AppKit 或 UIKit 中非常常见。每个用户界面对象都使用委托来允许你定义响应用户界面事件时发生什么。几种模式与委托有关，它们都与一个通用规则相关：你应该优先考虑组合而非继承。\n\
    \n#### 提供外壳（Façades）\n\n```objc\n@interface Control : View\n{\n    id cell;\n\
    }\n@end\n\n@implementation Control\n\n- (id)selectedCell\n{\n    return cell;\n\
    }\n\n- (BOOL)isEnabled\n{\n    return [[self selectedCell] isEnabled];\n}\n\n\
    - (void)setEnabled:(BOOL)flag\n{\n    [[self selectedCell] setEnabled:flag];\n\
    \    [self setNeedsDisplay:YES];\n}\n\n@end\n```\n*来自：facade.m*\n\n委托的一个非常常见的用途是*外壳模式*（façade\
    \ pattern）。它用公共接口封装了一个或多个私有内部对象。这在 Objective-C 中被广泛用于提供类似多继承的功能，即一个对象结合了多个对象的行为，并将部分功能委托给每一个对象。\n\
    \nAppKit 中的 `NSControl` 层次结构是这里的很好的例子。该层次结构中的类继承自 `NSView`，并将行为委托给 `NSCell` 子类。`NSView`\
    \ 提供了图形上下文、事件处理和与视图层次结构交互的功能。单元则提供了绘图的功能。本节顶部的示例是 `NSControl` 的（非常）简化版本。\n\n当你在\
    \ OS X 上点击按钮时，你通常点击的是 `NSButton` 的实例，它是 `NSControl` 的子类，使用 `NSButtonCell` 进行实现。作为程序员，你可以几乎互换地使用控件，也可以复用它们包含的单元。例如，如果你在表格或大纲视图看到按钮，它是用\
    \ `NSButtonCell` 绘制的，而不是用 `NSButton`。\n\n"
- fmt: "\nIn Chapter 19, we’ll look at using the Objective-C forwarding mechanisms\
    \ to quickly and easily implement this kind of façade. It’s also possible—and\
    \ common—to implement them simply by calling the methods in the wrapped object\
    \ or objects directly.\n\nThis approach is much more flexible than multiple inheritance,\
    \ because it allows the same class to be used with lots of different delegates.\n\
    \nIn C++, you would use template classes to achieve the same effect. These have\
    \ different advantages. The Objective-C version generates a lot less code, which\
    \ translates to better instruction cache usage. The C++ version makes certain\
    \ categories of optimization (primarily inlining) easier at compile time.\n\n\
    # Creating Class Clusters\n\n```objc\nstatic Pair *placeHolder;\n\n+ (void*)initialize\n\
    {\n    if ([Pair class] == self)\n    {\n        placeHolder = [self alloc];\n\
    \    }\n}\n\n+ (id)allocWithZone: (NSZone*)aZone\n{\n    if ([Pair class] == self)\n\
    \    {\n        if (nil == placeHolder)\n        {\n            placeHolder =\
    \ [super allocWithZone: aZone];\n        }\n        return placeHolder;\n    }\n\
    \    return [super allocWithZone: aZone];\n}\n\n- (Pair*)initWithFloat: (float)a\
    \ float: (float)b\n{\n    return [[FloatPair alloc] initWithFloat: a float: b];\n\
    }\n\n- (Pair*)initWithInt: (int)a int: (int)b\n{\n    return [[IntPair alloc]\
    \ initWithInt: a int: b];\n}\n```\n*From: classCluster.m*\n\nClass clusters are\
    \ very common in Objective-C. A lot of the Foundation classes are class clusters,\
    \ and you may find it useful to implement some more of your own.\n\nCHAPTER 4:\
    \ Common Objective-C Patterns\n\nA class cluster is an *abstract superclass* that\
    \ hides concrete subclasses. This is easier in Objective-C than many other languages,\
    \ because there is no keyword for object creation. When you send a message to\
    \ a class asking for a new instance, the class may return an instance of itself,\
    \ but it may also return an instance of some subclass.\n\nIf you create an `NSArray`\
    \ using `+arrayWithObjects:`, you may get a subclass that wraps a simple C array.\
    \ If you create one using `+arrayWithArray:`, you are likely to get one that just\
    \ references the other array.\n\nAnother good example is `NSNumber`. This wraps\
    \ a single C primitive value. You could implement this with two instance variables:\
    \ a union of all of the possible value types and another saying which one it is.\
    \ This would waste a lot of space and be quite complicated. A simpler solution\
    \ is to implement a different subclass for each type that you support.\n\nMost\
    \ class clusters provide named constructors, such as `+numberWithFloat:`, that\
    \ create a new instance of the correct subclass. If you create them with `+alloc`,\
    \ you typically get a placeholder class returned and then get the real object\
    \ in response to the `initialize` message.\n\nThe example is a `Pair` class. This\
    \ does not declare any instance variables and is never used directly. If you send\
    \ a `+alloc` message to this class, you get a *singleton* instance. When you send\
    \ it an initialization message, you get an instance of one of the two private\
    \ subclasses.\n\n```objc\n@implementation IntPair\n\n- (Pair*)initWithInt: (int)a\
    \ int: (int)b\n{\n    first = a;\n    second = b;\n    return self;\n}\n\n- (NSString*)description\n\
    {\n    return [NSString stringWithFormat: @\"(%d, %d)\", first, second];\n}\n\n\
    - (float)firstFloat { return (float)first; }\n- (float)secondFloat { return (float)second;\
    \ }\n- (int)firstInt { return first; }\n- (int)secondInt { return second; }\n\n\
    @end\n```\n*From: classCluster.m*\n\nEach of these concrete subclasses is quite\
    \ simple. They both declare two instance variables: `int`s in one, `float`s in\
    \ the other. They each provide a single initializer, which is called only from\
    \ the superclass, and they then override the methods.\n\nThis example doesn’t\
    \ provide any useful methods in the superclass. In a real implementation, you\
    \ might see methods for comparison or arithmetic implemented in the superclass,\
    \ in terms of the four methods that are shown here. Alternatively, they might\
    \ be provided in a separate category.\n\nCHAPTER 4: Common Objective-C Patterns\n\
    \nThe class cluster hides all of the details of the implementation. You can change\
    \ any aspect of the private subclasses without needing to modify or even recompile\
    \ code that uses them.\n\nThis is one of the reasons why code reuse is a lot more\
    \ common in Objective-C than in languages like C++. It is very easy to produce\
    \ code in Objective-C that has a public interface and a private implementation,\
    \ without any code that uses it depending on any aspects of the implementation.\n\
    \n# Using Run Loops\n\nThe design pattern that defines the structure of most nontrivial\
    \ Objective-C programs is the *run loop*. A run loop, in the general case, waits\
    \ for data from one or more event sources, and then executes code in response\
    \ to them, giving an *event driven model*.\n\nThe Foundation framework provides\
    \ a run loop in the `NSRunLoop` class. If you are writing an application, you\
    \ will typically get an instance of this created for you. You may also create\
    \ one explicitly in command-line tools.\n\nThe main run loop in an application\
    \ listens for events from the window server, corresponding to keypresses, mouse\
    \ movements, touch events, and so on. Various other classes add event sources\
    \ to the run loop implicitly. The `NSTimer` class, which we’ll look at in Chapter\
    \ 8, adds a timer event source to the run loop, for example, allowing you to perform\
    \ some action at a specific time.\n\nThe notification mechanism, covered in Chapter\
    \ 16, lets you deliver notifications of arbitrary events within your program via\
    \ the run loop, and you can also register for notifications of activity on file\
    \ descriptors with `NSFileHandle`.\n\nThe run loop itself is related to memory\
    \ management. Each run loop iteration has its autorelease pool. This means that\
    \ objects that are sent an autorelease message during a run loop iteration will\
    \ be destroyed (unless retained elsewhere) at the end of the iteration. Because\
    \ of this, and the fact that the run loop is used for delivering events from user\
    \ input, it is a good idea to keep the amount of work done in a single run loop\
    \ iteration as small as possible.\n\nIn most programs, you won’t need to interact\
    \ with the run loop directly. It sits in the background, while other classes provide\
    \ a more convenient interface.\n\n```objc\n[[NSRunLoop currentRunLoop] run];\n\
    ```\n*From: timer.m*\n\nCHAPTER 5: Numbers\n\nwhereas in Java it is explicitly\
    \ defined as a “32-bit signed two’s complement integer.” As well as the primitive\
    \ types, C supports defining new names for the existing types via the `typedef`\
    \ keyword. The most common reason for this is that the specification does not\
    \ require a particular size for any of the standard types, merely that each must\
    \ be at least as big as the previous one. In particular, there are platforms currently\
    \ deployed where `int` is 16, 32, and 64 bits, so you can’t rely on any specific\
    \ size for these.\n\nOS X supports ILP32 and LP64 modes. This shorthand is used\
    \ to describe which of the C\n"
