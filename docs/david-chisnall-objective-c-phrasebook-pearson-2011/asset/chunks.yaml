    `-framework`, which specifies a framework bundle containing headers and a shared
    library. This is both a linker and preprocessor option.


    The examples in this book all use the `Foundation` framework. On other platforms,
    this is typically implemented by the GNUstep Base library.


    These platforms typically don’t support the `-framework` option. The `gnustep-config`
    tool provides an alternative. This will print the compiler options needed for
    compiling Objective-C and for linking against the base (`Foundation`) or gui (`AppKit`)
    libraries.


    As with C and C++, you can specify `-c` to just compile the file but not link
    and `-o` to specify the name of the output. If you are compiling more than one
    file, you probably want to use something a bit more advanced than running the
    `clang` compiler from the command line.


    On OS X, you will probably use the `XCode` IDE. This lets you create projects
    with a number of different template types. If you need to compile these on other
    platforms, you can find a tool in the GNUstep repository called `pbxbuild`, which
    will compile them.


    If you are working on some other platform, you can use `GNUstep Make` to build.
    This also works on OS X, so whichever option you choose, you should not have portability
    problems caused by your build system.


