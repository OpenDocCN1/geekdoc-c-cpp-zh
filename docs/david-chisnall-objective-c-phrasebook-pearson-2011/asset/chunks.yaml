    \n如果你以特定的编码存储字符串数据，你通常会使用 `NSData` 实例而不是指针。这是一个非常简单的类，它封装了一个内存区域：一个指针和一个大小。由于它是一个对象，你可以对其进行内省，使用引用计数来处理销毁，并将其存储在集合中。在许多情况下，这比直接使用指针更方便。\n\
    \n## 修剪字符串\n\n```objc\nNSString *str = @\"*a String with leading spaces*\";\n\
    str = [str stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceCharacterSet]];\n\
    str = [str substringFromIndex: 2];\nNSCAssert([str isEqualToString:@\"String with\
    \ leading spaces\"], @\"Trimming failed\");\n```\n*来自: trim.m*\n\n通常，当你有一个字符串时，你想要修剪两端，移除固定数量的字符或来自特定集合的字符。第二种情况的常见示例是移除字符串开头和结尾的空白。Objective-C\
    \ 字符串对象支持许多为此的方法。如果你只是想从字符串的开头或结尾的字符，`NSString` 的 `-substringWithRange:` 方法是最有用的。这将创建一个引用字符串中数据的字符串对象。然而，当你在可变字符串上调用它时，它必须复制字符。\n\
    \n要从特定集合中移除字符，你需要理解 `NSCharacterSet`。正如其名所示，该类封装了一个字符集。你可以从字符串创建这些集合，但也有预定义的代表定义集合的集合。该类的使用方式与\
    \ C 语言中的 `ctype.h` 函数类似。你可以向它发送 `-characterIsMember:` 消息来测试单个字符是否是集合的成员。例如，调用\
    \ C 库函数 `ispunct()` 等同于向通过 `+punctuationCharacterSet` 获取的对象发送 `-characterIsMember:`\
    \ 消息。Objective-C 的版本更冗长，但更通用。字符集对象可以很容易在代码中传递。\n\n## 分割字符串\n\n```objc\nNSString\
    \ *str = @\"A String with\\twords and spaces\";\nNSArray *wordsWithTab = [str\
    \ componentsSeparatedByString:@\" \"];\nNSArray *words = [str componentsSeparatedByCharactersInSet:[NSCharacterSet\
    \ whitespaceCharacterSet]];\n```\n*来自: split.m*\n\n在 Objective-C 中分割字符串的方法种。第一种是显而易见的：只需遍历字符直到找到方便的分割位置，然后使用\
    \ `-substringWithRange:` 创建新标记。这在通用情况下有效，但对于这种本轻而易举的事情来说，费了太多精力。\n\n在 C 语言中，你可以使用\
    \ `strsep()` 函数或已弃用的 `strtok()` 函数在特定集合中的字符出现的任何地方分割字符串。`NSString` 的 `-componentsSeparatedByCharactersInSet:`\
    \ 方法工作方式完全相同，尽管它接受的是 `NSCharacterSet` 参数而不是字符串。你可以通过使用 `+characterSetWithCharactersInString:`\
    \ 构建字符集，使该方法的行为得像 `strtok_r()`。`NSString` 方法返回一个包含子字符串的 `NSArray`。这与 C 函数的作用完全相同；每当有两个相邻的分割符时，你会得到空字符串。\n\
    \n或者，你可以根据特定子字符串的出现来分割字符串。当分割符由多个字符组成时，这非常有用。\n\n"
- fmt: "\n# CHAPTER 6: Manipulating Strings\n\n## Copying Strings\n\n```objc\nNSString\
    \ *staticString = @ *\"a string\"* ;\nNSString *constantString = [staticString\
    \ copy];\nNSString *stringAlias = [constantString retain];\nNSMutableString *mutableString\
    \ = [stringAlias mutableCopy];\nNSMutableString *mutableStringAlias = [mutableString\
    \ retain];\n```\n*From: stringcopy.m*\n\nOne of the places were `C++` tends to\
    \ be much slower than it should is in the handling of strings. In any environment\
    \ where you have pure manual memory management, there is a tendency to defensively\
    \ copy objects to maintain clear ownership rules.\n\nIn Objective-C, this is less\
    \ common, and more code suffers from the opposite problem: retaining references\
    \ to mutable objects when it should have copies. When you send a `-copy` message\
    \ to an `NSString`, it has the same effect as sending `-retain`.\n\nWhy, you might\
    \ be wondering, do we have two methods that do the same thing? The answer is simple:\
    \ `NSMutableString` is a subclass of `NSString`. If you send a `-retain` message\
    \ to an `NSMutableString`, you increment the reference count. If you send a `-copy`\
    \ message, you get a new object. It can be even more complex than that because\
    \ some `NSMutableString` concrete subclasses support copy-on-write behavior, so\
    \ you will get two objects referencing the same data, and only get a real copy\
    \ made when you modify one of them.\n\nBecause `NSMutableString` is a subclass\
    \ of `NSString`, you can pass a pointer to an `NSMutableString` anywhere that\
    \ expects an `NSString` pointer. If you expect an immutable string and are given\
    \ one, it doesn’t matter whether you copy the object or just make another reference\
    \ to it. If, on the other hand, you are given a mutable string, you don’t want\
    \ to just keep a reference to it or you might end up with it being modified later.\n\
    \nIt’s important to remember that sending a `-copy` message to any `NSString`\
    \ subclass will always return an immutable string. If you want a mutable string,\
    \ you must use `-mutableCopy` instead.\n\n**Note:**\n\nIf you are coming from\
    \ Java, remember that `NSString` is roughly equivalent to the Java `String` class\
    \ and `NSMutableString` is roughly equivalent to the Java `StringBuffer` class.\n\
    \nObjective-C has no equivalent of the `final` keyword, so `NSString` may—and\
    \ does—have subclasses, and you can use mutable strings anywhere you would otherwise\
    \ use an immutable string.\n\nThis pattern is found in several places in the `Foundation`\
    \ framework. Most classes that have an immutable superclass and a mutable subclass\
    \ will implement the `NSMutableCopying` protocol.\n\nSending mutable or immutable\
    \ instances of them a `-mutableCopying` message will give you an instance of the\
    \ mutable subclass.\n\n## Creating Strings from Templates\n\n```objc\nint a =\
    \ 12;\nfloat b = 42.0;\nconst char *cString = *\"words\"* ;\nid object = [NSObject\
    \ new];\nNSString *string = [NSString stringWithFormat:@ *\"%d, %f, %s, %*\",\
    \ a, b, cString, object];\n```\n*From: formatstring1.m*\n\nIf you come from a\
    \ `C` background, one of the first functions you learned about was probably `printf()`.\
    \ This is a *variadic function* that takes a *format string* as the first argument.\
    \ The contents of the format string then define the types of the other arguments.\n\
    \nObjective-C, as a descendant of `C`, inherits the idea of a format string. Objective-C\
    \ format strings are almost exactly like `C` format strings, but with one addition.\
    \ The `%@` format specifier indicates that the matching argument is an object.\n\
    \nObjects are expected to know how to describe themselves. Every object should\
    \ respond to a `-description` message, which returns an `NSString` describing\
    \ the object. A lot of classes inherit this from `NSObject`, which just returns\
    \ the class name and the object’s address in memory. Others provide something\
    \ more convenient. For example, the collection classes dump their contents as\
    \ NeXT-style *property lists*.\n\n**Note:**\n\nThe `GNU debugger (gdb)` has some\
    \ built-in support for `-description` methods. When you use the `print-object`\
    \ command (which can be abbreviated to `po`) on an object, it will call its `-description`\
    \ method. Be careful when doing this, because it will run some code in the debugged\
    \ process, which may also contain bugs. However, when it works, it can be very\
    \ helpful. We’ll look at debugging more in Chapter 18.\n\nYou can create Objective-C\
    \ string objects from format strings using a *variadic method* that behaves like\
    \ `asprintf()`. The first argument is an Objective-C string containing some format\
    \ specifiers, and the remaining arguments are the variables that will be used\
    \ in place of the format specifiers. The `formatstring.m` example shows how you\
    \ can use format strings with `NSString`.\n\n```objc\nint main(int argc, char\
    \ **argv)\n{\n    [NSAutoreleasePool new];\n    NSMutableString *str = [NSMutableString\
    \ stringWithFormat:@ *\"%d arguments: \"* argc];\n    for (int i=0 ; i<argc ;\
    \ i++)\n    {\n        [str appendFormat:@ *\"%s \", argv[i]];\n    }\n    NSLog(@\"\
    %@\" , str);\n    return 0;\n}\n```\n*From: formatstring.m*\n\nThis example constructs\
    \ a string from the arguments provided to the executable and then writes it to\
    \ the standard error. Note that we need to create an `NSAutoreleasePool` at the\
    \ start of this program. Using format strings creates some temporary objects,\
    \ which are autoreleased. If you don’t have an autorelease pool, you will get\
    \ a warning that these objects are leaked. In this trivial program, they are leaked\
    \ anyway; there’s no point in telling the autorelease pool to collect them because\
    \ the operating system will reclaim the memory when the process exits.\n\nThis\
    \ example first creates a mutable string containing the number of arguments passed\
    \ to the program. It then loops over the remaining arguments, appending each (as\
    \ a C string) to the mutable string. Finally, it passes the result to `NSLog()`.\n\
    \nThe `NSLog()` function also uses format strings. It’s tempting to just pass\
    \ `str` as the first argument. This will work fine until someone uses a string\
    \ with a percent symbol in it as an argument to this program. Then the function\
    \ will look at the second argument and try to interpret it. Unfortunately, there\
    \ is no second argument, so will read a random value from a register. If it’s\
    \ interpreting this as some kind of number, it’s not a big problem. If it’s interpreting\
    \ it as a pointer (to a C string or Objective-C object), it will almost certainly\
    \ crash. By passing `%@` we tell `NSLog()` that there is only one real argument,\
    \ and that it’s an object.\n\n## Storing Rich Text\n\n```objc\nNSDictionary *keyword\
    \ = [[NSDictionary dictionaryWithObject:@ *\"keyword*\" forKey:@ *\"type\"* ]\
    \ retain];\nNSMutableAttributedString *program = [NSMutableAttributedString new];\n\
    NSAttributedString *fragment = [[NSAttributedString alloc] initWithString:@ *\"\
    int*\" attributes:keyword];\n[program appendAttributedString:fragment];\n```\n\
    *From: richText.m*\n\nA string is just a list of characters. Before you display\
    \ a string, you generally need some other attributes. These attributes describe\
    \ the typeface, the size, the alignment and underline styles, and so on.\n\nIf\
    \ you are writing something that deals with structured text—for example, HTML\
    \ or another form of semantic markup such as DocBook—then these attributes might\
    \ be a level 1 heading, or ordered list.\n\nFoundation provides a class for assigning\
    \ arbitrary attributes to strings. The `NSAttributedString` class lets you attach\
    \ dictionaries to ranges in attributed strings.\n\nThese dictionaries can contain\
    \ any arbitrary information that you want, including semantic markup.\n"
