    \ in Objective-C, you can introspect this object. It will tell you the selector,\
    \ the number of arguments, and the types and values of all of the arguments.\n\
    \nThe Foundation framework includes a class, `NSDistanceObject`, which makes use\
    \ of this. A distant object is a proxy that forwards messages to a remote object.\
    \ The remote objects can be in a different process, or even on a different computer.\n\
    \nIf you pass objects as arguments to a message sent to a distant object, then\
    \ they may be copied, or a remote proxy may be created at the far end forwarding\
    \ message back.\n\nUsing distributed objects is very simple. There are two parts\
