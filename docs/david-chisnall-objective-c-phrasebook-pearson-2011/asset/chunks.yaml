    \ 和 `-setValue:forUndefinedKey:`。\n\n```objc\n@interface KeyFallback : KeyPublic\n\
    {\n    NSMutableDictionary *dict;\n}\n@end\n\n@implementation KeyFallback\n- (id)valueForUndefinedKey:(NSString*)aKey\n\
    {\n    return [dict valueForKey: aKey];\n}\n- (void)setValue:(id)aValue\nforUndefinedKey:(NSString*)aKey\n\
    {\n    [dict setValue: aValue forKey: aKey];\n}\n@end\n```\n来自：kvc.m\n\n这些方法是支持\
    \ KVC 的最后机会。如果你实现了它们，对于所有你不直接支持的键，应该调用父类的实现。如果在根类上调用此方法，它将抛出异常，表示你没有妥善地处理该键。\n\
    \n如果你使用声明的属性来合成访问器方法，你将免费获得 KVC 兼容性。`kvc.m` 示例展示了实现同一个 KVC 属性的所有不同方法。这个示例使用了一个公共类和若干私有子类，它们都支持该属性。你可以交替使用所有这些类的实例，至少在存储该键时是这样。重要的是，你可以使用\
    \ `KeyIVar` 或 `KeyFallback` 类进行原型设计，以后切换到其他内容。\n\n回退方法在原型设计时特别有用。当你开始工作时，创建一个私有的字典实例变量，并通过\
    \ KVC 访问对象上的所有属性。一旦你确定了类真正需要的属性，你就可以用一组访问器替换回退实现，并作为一个独立步骤，将 KVC 调用替换为直接的消息发送。\n\
    \n你可能已经注意到这个示例中的一点点，即 KVC 只处理对象，但实例变量是 `int`。通过某种方式，这仍然有效。这是因为 KVC 执行了*自动装箱 (auto-boxing)*。我们通过将\
    \ `@\"12\"` 作为 `-setValue:forKey:` 的参数来设置此属性。KVC 代码在发现该属性是整数后，向字符串对象发送了 `-intValue`\
    \ 消息。\n\n在反方向上，它构造了一个封装了原始值的 `NSNumber`。如果实例变量或访问器方法使用对象类型，则这段代码会被跳过。注意，KVC 仅访问运行时类型信息，所有对象类型在类型编码中都被编码为\
    \ `\"@\"`。这意味着你可以使用 KVC 将一个 `NSString` 实例设置为声明为 `NSArray` 的实例变量的值。当你尝试这样做时，KVC\
    \ 不会生成任何错误，编译器也是如此。然而，接收者在下一次向字符串发送诸如 `-objectAtIndex:` 的消息时将获得一个异常。\n\n如果你正在为对象类型编写\
    \ KVC 访问器，你可能想要添加一个断言语句来检查对象是否具有兼容的类。\n\n## 理解键路径 (Key Paths)\n\n到目前，我们查看了单个键的值的获取和设置。这非常有用，但它并不能完全展示\
    \ KVC 的灵活性。我们使用 KVC 的大部分工作其实可以在不使用 KVC 的情况下轻松完成。如果你想让一个对象访问另一个对象的特定属性，且不想硬编码，你只需要存储一个选择器（selector）并使用标准的\
    \ Objective-C 消息发送机制来调用它。\n\n如果属性存储在那个对象上，这种方法运行良好，但如果你想要一个间接属性怎么办？你可以存储选择器数组，并使用每个选择器来获取中间对象，但那样太麻烦。\n\
    \n通过 KVC，你可以使用*键路径 (key paths)*。这些是使用点分隔的包含键名的字符串。如果你想访问对象的属性的属性，可以使用键路径在单次操作中完成。\n\
    \n注意：访问声明属性的点表示法与 KVC 记法非常相似，很容易混淆两者。这很遗憾，因为它们完全无关。点表示法生成指向访问方法的消息消息。接收键路径的 KVC\
    \ 方法是更高层的抽象。这是点表示法被广泛讨厌的原因之一。这种相似性遗憾是故意的。在公开发布之前，Apple 员工使用 KVC 术语引用声明的属性，两者应该是密切相关的。\n\
    \n键路径的主要优势是，例如一个通用视图对象只需要存储一个指向模型对象的指针。它不需要指向模型内部各种组件的指针，可以通过键路径访问这些组件。例如，如果你有一个显示人物信息的视图，你可以使用\
    \ `@\"father\"` 和 `@\"mother\"` 键路径连接家族树中的副本。你随后可以在显示祖父母关系的中使用相同的视图和 `@\"father.mother\"\
    ` 键路径，以此类推。\n\n键路径经常用于*Cocoa 绑定 (Cocoa bindings)*。这些是连接模型与视图的通用控制器类。\n\n```objc\n\
    + (void)observeValueForKeyPath:(NSString*)keyPath\nofObject:(id)object\nchange:(NSDictionary*)change\n\
    context:(void*)context\n{\n    NSLog(@\"%@.%@ 现在是 %@\", object, keyPath, [change\
    \ objectForKey: NSKeyValueChangeNewKey]);\n}\n\n+ (void)watchChange\n{\n    NSMutableDictionary\
    \ *dict = [NSMutableDictionary new];\n    [dict addObserver:self\n           \
    \  forKeyPath:@\"aKey\"\n               options:NSKeyValueObservingOptionNew\n\
    \                context:NULL];\n\n    [dict setObject:@\"set as object\" forKey:@\"\
    aKey\"];\n\n    [dict removeObserver:self forKeyPath:@\"aKey\"];\n}\n```\n来自：kvo.m\n\
