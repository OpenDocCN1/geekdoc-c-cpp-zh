  trans: "\n许多 UNIX 代码通过使用 `sscanf()` 和 `sprintf()` 函数来操作路径。当你尝试将代码移植到 Windows 或 Symbian\
    \ 等系统时，会导致很多问题，因为这些系统的文件系统布局和路径分隔符是不同的。\n\nOpenStep 从之初就被设计为可以在不同操作系统家族之间具有移植性。`NSString`\
    \ 类提供了一些用于操作路径的方法。\n\n尽管这些方法操作的是字符串，但它们暴露了一个更抽象的接口。你可以添加或删除路径组件（即路径中的单个条目，文件或目录）。你还可以修改文件扩展名。\n\
    \n在 OS X 上，像任何 UNIX 系统一样，有一个根目录，用单个斜杠 `/` 表示；子目录之间用斜杠分隔；文件扩展名之间用点 `.` 分隔。在 Windows\
    \ 上，有多个根，路径组件之间用反斜杠分隔，但扩展名仍然使用点。\n\n如果你在 `NSString` 上使用路径操作方法，无论文件系统的约定如何，你的代码都能正常工作。\n\
    \n遗憾的是，`NSMutableString` 没有对应的操作 set。你可以通过使用 `+pathWithComponents:` 和 `-pathComponents`\
    \ 方法来避免创建大量临时对象的开销，这两个方法分别从路径组件数组构造字符串，以及创建一个路径组件数组。\n\n在处理路径的代码中，没必要过度担心效率。对文件系统进行的几乎任何操作开销都会比创建几个临时对象大得多。\n\
    \n# 第 13 章：访问目录和文件\n\n## 判断文件或目录是否存在\n\n```objc\nNSFileManager *fm = [NSFileManager\
    \ defaultManager];\nBOOL isDir;\nif ([fm fileExistsAtPath: path isDirectory: &isDir])\n\
    {\n    if (isDir)\n        printf( *\"Folder exists\\n\"* );\n    else\n     \
    \   printf( *\"File exists\\n\"* );\n}\nelse\n    printf( *\"File does not exist\\\
    n\"* );\n```\n*来自： fileExists.m*\n\n确定文件是否存在的最简单方法是尝试访问它并检查错误。这种方法并不优雅，尽管它通常是安全的操作方式。如果你想在尝试操作之前向用户提供关于该操作是否可以执行的反馈，你需要一个显式的测试。\n\
    \n`-fileExistsAtPath:isDirectory:` 方法正是此设计的。该方法的名称有点误导性。它测试指定路径是否存在文件或目录，并告诉你它是否是一个目录。\n\
    \n第二个参数是一个指向 `BOOL` 的指针。如果你来自 C 或 C++，这会看起来非常熟悉，但对于来自 Java 等语言的人来说，而此类语言 Objective-C\
    \ 只支持返回单个值，但此方法需要返回两个结果：对象是否存在以及它是否为目录。实现这种功能有几种方法。一种是定义一个枚举类型，包含“不存在”、“文件存在”和“目录存在”元素。\n\
    \n**注意：** \n不要使用此机制创建临时文件。如果你这样做，在测试文件是否存在和创建文件之间可能会存在潜在的竞态条件。请使用 C 库的 `mkstemp()`\
    \ 函数。EtoileFoundation 框架有一个该函数的封装器，如果你想留在对象世界，可以使用它。\n\n这本会让所有使用该方法的代码变得更简单，因此目前还不清楚为什么没有这样做。当你意识到你可以将\
    \ `NULL` 作为第二个参数传递时，答案就显而易见了。如果你这样做，方法将不再忙于测试路径下的对象是否为目录。这是一个相对小的节省，因此并不清楚这是否是一个明智的设计选择。\n\
    \n## 与包（Bundles）工作\n\n```objc\nNSBundle *mainBundle = [NSBundle mainBundle];\n\
    NSLog(@ *\"%@ links against: %@\"* , [mainBundle executablePath], [NSBundle allFrameworks]);\n\
    ```\n*来自： bundles.m*\n\n在 Apple System 7 及更早版本中，文件系统支持两个分支：代码分支和数据分支。数据分支用于存储任意资源。从\
    \ Mac OS 8.1 开始，Apple 引入了 HFS+，它支持任意数量的分，使得文件在包含任意数量节点的能力与目录相同。NTFS 具有相同的功能。\n\
    \nOS X 仍然支持资源分支，并在不支持这些分支的文件系统（如 `UFS` 和 `FAT`）上将数据存储在隐藏文件中，但不建议使用这种方法。将包含分支的文件拷贝到其他文件系统是一个问题。如果你用\
    \ OS X 将文件拷贝到 `FAT` 磁盘，然后用 Windows 从该磁盘拷贝，你将不会拷贝隐藏文件，因此分支中的数据将会丢失。\n\n同时，NeXT\
    \ 采取了不同的方向。如果分支让文件变得像目录，为什么不直接使用目录呢？NeXTSTEP 在标准的 UNIX 文件系统之上提供了类似分支的功能，仅仅通过使用目录代替文件来实现。\n\
    \n那些应该被视为文件处理的目录被称为“包”（bundles）。对于原始的低级文件系统操作以及其他操作系统来说，它们看起来就像目录。例如，如果你将 OS X\
    \ 应用程序包拷贝到 USB 驱动器并在 Windows 上查看它，它就像任何其他目录一样。然而，当你在 Finder 中查看它时，它看起来像单个文件。\n\
    \n在任何 Objective-C 程序中你会使用的两种包是框架（frameworks）和应用程序（applications）。它们都包含可执行代码（程序或共享库）和一组资源。具体的布局取决于系统。GNUstep\
    \ 使用较旧的 NeXT 风格包布局，而 OS X 使用了稍微简单的布局。你可以很轻松地创建同时具有 GNUstep 和 Cocoa 布局的包，允许 `.app`\
    \ 包在系统之间移植而无需编译。\n\n你可以向 `NSBundle` 发送 `+mainBundle` 消息获取应用程序的主包。这是一个封装包的类。它跟踪所有动态加载的包。包天生支持本地化。资源存储在不同语言的子目录中，并按需加载。pathForResource:ofType:`\
    \ 方法将返回包资源目录中指定扩展名的命名资源的本地化版本。你可以在代码中使用此方法获取存储在应用程序包或任何加载包中的本地化资源文件。\n\n**注意：**\
    \ 命令行工具通常不存储在包中。然而它们仍然有一个主包对象。该对象的路径是主执行文件所在的目录。\n\n如果你的代码在框架中，你可能希望从框架包获取资源。这比从主包获取代码稍微复杂。`+bundleForClass:`\
    \ 方法将给你包含指定类代码的包。如果你以后可能会将类移动到框架中，那么加载资源时使用此方法是一个好主意。\n\n## 在系统位置查找文件\n\n```objc\n\
    NSArray *dirs = NSSearchPathForDirectoriesInDomains(\n    NSLibraryDirectory,\n\
    \    NSAllDomainsMask,\n    YES\n);\n```\n*来自 frameworkLoader.m*\n\n在 OS X 上，文件系统布局非常明确。你可能会硬编码路径并期望其工作。如果你将代码移植到其他平台，你会发现问题变得非常严重。\n"
- fmt: "\nThis was one of the problems that OpenStep programmers encountered quite\
    \ often. Porting code between Solaris, OPENSTEP, and Windows NT, for example,\
    \ required changing a lot of hard-coded paths for each platform.\n\nAfter Apple\
    \ bought NeXT, they released a new version of OPENSTEP with a `MacOS` compatibility\
    \ layer and a new user interface called Rhapsody. This used the same NeXT filesystem\
    \ hierarchy as OPENSTEP, complete with a `/NeXT` folder in the root containing\
    \ the non-UNIX-like parts of the hierarchy.\n\nWith Rhapsody DR2, Apple made some\
    \ significant changes to the directory layout and introduced the layout that is\
    \ now familiar to OS X users. To make life easier, and to support YellowBox (Cocoa)\
    \ for Windows, a product that was discontinued soon after, they introduced the\
    \ `NSSearchPathForDirectoriesInDomains()` function.\n\nThis function returns an\
    \ array of directories for a specific use. When you call this function, the first\
    \ argument describes the kind of directory you want. This might be an applications\
    \ directory, a library directory, and so on. The second is the `filesystem domain*.\n\
    \nOS X, like OPENSTEP, divides the filesystem hierarchy into a number of domains\
    \ that all have roughly the same contents, but for different uses. These are ordered,\
    \ so you should prefer files in higher-priority domains. The four domains are\
    \ as follows:\n\n*   **User**: This domain is inside the user’s home directory.\
    \ Files here are private to the user and completely under the user’s control.\n\
    *   **Local**: The domain containing files local to the machine. On OS X, this\
    \ includes things such as the `/Library` directory that may be modified by the\
    \ local system administrator.\n*   **Network**: It is quite rare to see anything\
    \ in this domain. You will not see it on stand-alone machines, or on machines\
    \ that are part of a heterogeneous network. It is used for directories controlled\
    \ by the network administrator.\n*   **System**: The final domain contains system\
    \ files. In general, you should never write to any location in this domain, although\
    \ you can read from it. Any modifications that you make may be reverted the next\
    \ time the user updates the system.\n\nNot every type of directory exists in every\
    \ domain. For example, there is no documents directory in the system domain, and\
    \ it would not make sense if there were.\n\nThe final argument tells the function\
    \ whether to expand tildes in the paths. You will almost always pass `YES` here.\n\
    \nThe `frameworkLoader.m` example shows several of the things we’ve looked at\
    \ in this chapter. This example loads a named framework. Because frameworks are\
    \ bundles, you can use `NSBundle` for loading them. This example first gets a\
    \ list of all of the `Library` directories in the system. It then looks in them\
    \ in order to test whether a directory exists in each of them that has the name\
    \ of the framework and the `.framework` extension.\n\nIf something with the right\
    \ name exists, the example program tells `NSBundle` to load it. You can use this\
    \ code to lazily load frameworks at run time, rather than linking to them explicitly.\n\
    \nAlternatively, you can modify it to look in a plugins directory for your application\
    \ in the library directory, in which case you should look in `NSApplicationSupportDirectory`.\
    \ If you build plugins as bundles, you will load them in exactly the same way.\n\
    \n```objc\nNSArray *dirs =\nNSSearchPathForDirectoriesInDomains(\n    NSLibraryDirectory,\n\
    \    NSAllDomainsMask,\n    YES);\n\nfor (NSString *dir in dirs)\n{\n    NSString\
    \ *f =\n    [[[dir stringByAppendingPathComponent:@\"*Frameworks\"]\n    stringByAppendingPathComponent:framework]\n\
    \    stringByAppendingPathExtension:@\"*framework\"];\n    // Check that the framework\
    \ exists and is a directory.\n    BOOL isDir = NO;\n    if ([fm fileExistsAtPath:\
    \ f isDirectory: &isDir] && isDir)\n    {\n        NSBundle *bundle = [NSBundle\
    \ bundleWithPath: f];\n        if ([bundle load])\n        {\n            NSLog(@\"\
    Loaded bundle %@\", f);\n            return YES;\n        }\n    }\n}\n```\n*From:\
    \ frameworkLoader.m*\n\n## Creating Threads\n\n```objc\n-(void)processInNewThread\n\
    {\n    SEL sel = @selector(process:);\n    [NSThread detachNewThreadSelector:sel\n\
    \                             toTarget:self\n                             withObject:nil];\n\
    }\n```\n*From: thread.m*\n\nThreads in Objective-C are encapsulated in `NSThread`\
    \ objects. These wrap a POSIX thread and provide some convenience methods. As\
    \ of 10.5, there are two ways of creating new threads. The traditional one is\
    \ similar to the standard way of creating POSIX threads, whereas the second is\
    \ intended to be more familiar to Java programmers.\n\nWhen you create a new POSIX\
    \ thread, you call a function with a `void*` parameter in a new thread. When you\
    \ create a new thread using `NSThread`, you do something similar, sending a message\
    \ to an object, taking another object as the argument.\n\nThe more Java-like way\
    \ of creating a new thread is to subclass `NSThread` and override the `main` method.\
    \ You can then create an instance of your thread and send it `-start` message\
    \ to start it.\n\n```objc\ndouble oldPriority = [NSThread threadPriority];\n[NSThread\
    \ setPriority:0];\n[[NSThread mainThread] setPriority:1];\n```\n*From: threadPriority.m*\n\
    \nThe `NSThread` implements `threadPriority` and `setPriority` methods as both\
    \ class and instance methods. When sent to the class, they control the priority\
    \ of the current thread. When sent to an instance, they control the priority of\
    \ the thread encapsulated by that object.\n\nThe priority of a thread determines\
    \ how much CPU time it will get and how long it has to wait between being access\
    \ to the CPU. With the lower-level POSIX APIs for controlling thread priority,\
    \ you can also set the scheduler policy. The functions for doing this are all\
    \ part of the POSIX realtime extensions, which also provide signal queues and\
    \ so on. This is not exposed (yet) by the Objective-C APIs.\n\nPriorities set\
    \ with this API are double-precision floating-point values between 0 and 1. These\
    \ will be scaled to some integer range that the scheduler understands, so you\
    \ should remember that small differences will be rounded.\n\nThe POSIX specification\
    \ defines two *contention scopes* for threads. A thread’s priority defines a base\
    \ value for whether it should be allowed CPU time, which is scaled based how much\
    \ it has already had and how long since it last had any. The contention scope\
    \ determines which threads compete for CPU time. With a system contention scope,\
    \ the thread competes with all other threads in the system. With a process contention\
    \ scope, it only competes with threads owned by the same process.\n\nOS X only\
    \ implements the system scope, which means that a high-priority thread will steal\
    \ processor time away from threads in other processes.\n"
  raw: 'This was one of the problems that OpenStep programmers encountered quite often.
    Porting code between Solaris, OPENSTEP, and Windows NT, for example, required
    changing a lot of hard-coded paths for each platform.


    After Apple bought NeXT, they released a new version of OPENSTEP with a MacOS


    compatibility layer and a new user interface called Rhapsody. This used the same
    NeXT


    filesystem hierarchy as OPENSTEP, complete with a /NeXT folder in the root containing
    the non-UNIX-like parts of the hierarchy.


    With Rhapsody DR2, Apple made some


    significant changes to the directory layout and introduced the layout that is
    now familiar to OS X users. To make life easier, and to support YellowBox (Cocoa)
    for Windows, a product that was discontinued soon after, they introduced the NSSearchPathForDirectoriesInDomains()
    function.


    This function returns an array of directories for a specific use. When you call
    this function, the first argument describes the kind of directory you want. This
    might be an applications directory, a library directory, and so on. The


    242


    CHAPTER 13: **Accessing Directories and Files** second is the *filesystem domain*.


    OS X, like OPENSTEP, divides the filesystem hierarchy into a number of domains
    that all have roughly the same contents, but for different uses.


    These are ordered, so you should prefer files in higher-priority domains. The
    four domains are as follows:


    **User** This domain is inside the user’s home directory. Files here are private
    to the user and completely under the user’s control.


    **Local** The domain containing files local to the machine. On OS X, this includes
    things such as the /Library directory that may be modified by the local system
    administrator.


    **Network** It is quite rare to see anything in this domain. You will not see
    it on stand-alone machines, or on machines that are part of a heterogeneous network.
    It is used for directories controlled by the network administrator.


    **System** The final domain contains system files.


    In general, you should never write to any location in this domain, although you
    can read from it. Any modifications that you make may be reverted the next time
    the user updates the system.


    Not every type of directory exists in every domain. For example, there is no documents


    **Finding Files in System Locations** 243


    directory in the system domain, and it would not make sense if there were.


    The final argument tells the function whether to expand tildes in the paths. You
    will almost always pass **YES** here.


    The frameworkLoader.m example shows several of the things we’ve looked at in this
