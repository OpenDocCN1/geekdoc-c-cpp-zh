  trans: "\n\n代理（delegate）需要指向对象的引用，而对象也需要指向代理的引用。这立即创建了一个循环。解决这个问题的常见做法是：对象不保留（retain）它们的代理。如果你将一个对象作为参数传递给\
    \ `-setDelegate:` 方法，你需要确保有其他对象持有它的引用，否则它会被过早删除。\n\n# 第 3 章：内存管理\n\n## 自动释放池 (Autorelease\
    \ Pools)\n\n```c\nid returnObject(void)\n{\n    return [[NSObject new] autorelease];\n\
    }\n\nint main(void)\n{\n    NSAutoreleasePool *pool = [NSAutoreleasePool new];\n\
    \    id object = returnObject();\n    [object retain];\n    [pool drain];\n  \
    \  // 对象在此失效。\n    [object release];\n    return 0;\n}\n```\n*来源：`autorelease.m`*\n\
    \n除了循环之外，引用计数最大的问题是，在某些段时间内，没有任何对象真正拥有某个特定的引用。在 C 语言中，由调用者还是被调用者负责分配内存是一个问题。\n\
    \n在像 `sprintf()` 这样的函数中，由调用者分配空间。遗憾的是，调用者并不知道具体需要多少空间，因此增加了 `snprintf()` 变体，让被调用者知道可用空间。\n\
    \n这仍然可能导致问题，因此增加了 `asprintf()` 版本，让被调用者分配空间。\n\n如果是由被调用者分配空间，谁来负责释放它？推测是调用者，但因为调用者并没有创建它，任何检查\
    \ `malloc()` 和 `free()` 调用是否平衡的工具都无法检测到内存泄漏。\n\n在 Objective-C 中，这个问题更为常见。许多方法可能会返回临时对象。如果你返回的是一个临时对象，它需要被释放；但如果你返回的是指向实例变量的指针，则不需要。你可以先保留（retain）这样的指针，但随后你需要记得释放（release）从方法返回的每一个对象。这很快就会变得非常疲惫。\n\
    \n这个问题的解决方案是“自动释放池”（autorelease pool）。当你向一个对象发送 `-autorelease` 消息时，它会被添加到当前活跃的\
    \ `NSAutoreleasePool` 实例。当该实例被销毁时，添加到其中的每个对象都会收到一个 `-release` 消息。\n\n`-autorelease`\
    \ 消息是一个延迟的 `-release` 消息。当你不再需要对某个对象的引用但其他地方可能还需要时，向它发送该消息。\n\n如果你正在使用 `NSRunLoop`，自动释放会在每次运行循环迭代开始时创建，并在结束时销毁。这意味着在当前迭代结束之前，没有任何临时对象会被销毁。如果你正在进行创建大量临时对象的操作，你可能想要创建一个新的自动释放池，如下：\n\
    \n```objc\nid pool = [NSAutoreleasePool new];\n[anObject doSomethingThatCreatesLotsOfObjects];\n\
    [pool drain];\n```\n\n注意，在销毁自动释放池时，你向它发送的是 `-drain` 消息而不是 `-release` 消息。这是因为当你处于垃圾回收模式时，Objective-C\
    \ 运行时会忽略 `-release` 消息。在这种模式下，`-drain` 消息会为收集器提供提示，但不会销毁池。\n\n## 使用带自动释放的构造函数\n\
    \n```objc\n+(id)object\n{\n    return [[[self alloc] init] autorelease];\n}\n\
    ```\n*来源：`namedConstructor.m`*\n\n我在上一节中提到，使用 `+alloc` 创建的对象引用计数为 1。事实上，所有对象的初始引用计数都是\
    \ 1，但使用具名构造函数（如 `+stringWithFormat:` 或 `+array`）创建的对象也会被自动释放（autoreleased）。\n\n\
    如果你通过这些机制之一创建了对象，如果你想保留它，就必须向它发送 `-retain` 消息。如果你不这样做，它将在稍后自动释放池销毁时被收集。\n\n这是一个在你自己的类中需要遵守的重要惯例。如果有人使用具名构造函数创建了你某个类的实例，他会期望不需要手动释放它。一个典型的具名构造函数看起来就像本节开始的那个。\n\
    \n请注意，由于这是一个类方法，`self` 对象将是该类本身。通过向 `self` 发送 `+alloc` 消息而不是向类名，此方法可以自动处理子类。\n\
    \n## 访问器中的自动释放对象\n\n```objc\n-(NSString*)stringValue\n{\n    return [[string retain]\
    \ autorelease];\n}\n```\n*来源：`ivar.m`*\n\n在在 Foundation 中实现的引用计数存在另一个常见问题，即你通常不会保留那些仅在栈上引用的对象。假设你有如下代码：\n\
    \n```objc\nNSString *oldString = [anObject stringValue];\n[anObject setStringValue:\
    \ newString];\n```\n\n如果 `-setStringValue:` 方法按照我之前建议的那样实现，这段代码将会崩溃，因为当你设置新的字符串值时，由\
    \ `oldString` 引用的对象会被删除。这是一个问题。有两种可能的解决方案，都涉及到自动释放池。一种是在设置新值时对旧值进行自动释放；另一种是本节开头\
    \ `stringValue` 方法的。\n\n这确保了字符串不会因为发送给对象的任何操作而被意外销毁。另一个常见的惯例是用 `-copy` 代替 `-retain`。如果它是可变的，`-copy`\
    \ 将等同于 `-retain`。\n\n## 支持自动垃圾回收\n\n从 OS X 10.5 开始，Apple 在 Objective-C 中引入了自动垃圾回收。这可以让程序员的工作变得轻松，但在大多数情况下它会带来性能损失。Apple\
    \ 的收集器使用大量内存来跟踪活动引用，因此在 iPhone 上不可用。它不支持旧版本的 OS X，且对 GNUstep 支持有限，因此如果你想编写可移植代码，应该避免使用垃圾回收。\n\
    \n如果你在垃圾回收模式下编译代码，所有的 `-retain`、`-release` 和 `-autorelease` 消息将被忽略。编译器会自动为每次堆赋值插入运行时函数的调用。代码必须在垃圾回收支持下编译才能使用垃圾收集器。在编译垃圾回收时你有两个选项。如果你使用\
    \ `-fobjc-gc-only` 标志编译，代码将仅支持垃圾回收。\n\n```bash\n$ gcc -c -framework Cocoa -fobjc-gc-only\
    \ collected.m\n$ gcc -c -framework Cocoa -fobjc-gc collected.m\n```\n\n```c\n\
    /* 写屏障（Write barriers）。\n由编译器使用。\n*/\nOBJC_GC_EXPORT id objc_assign_strongCast(id\
    \ val, id *dest);\nOBJC_GC_EXPORT id objc_assign_global(id val, id *dest);\nOBJC_GC_EXPORT\
    \ id objc_assign_ivar(id value, id dest, ptrdiff_t offset);\nOBJC_GC_EXPORT void\
    \ *objc_memmove_collectable(void *dst, const void *src, size_t size);\nOBJC_GC_EXPORT\
    \ id objc_read_weak(id *location);\n```\n\n"
- fmt: "\n```objc\nOBJC_GC_EXPORT id objc_assign_weak(id value, id *location);\n```\n\
    *From: `objc-auto.h`*\n\nWith `-fobjc-gc` flag, the code will support both reference\
    \ counting and automatic garbage collection. This is useful when you are compiling\
    \ a framework. You must still remember to add `-retain` and `-release` calls in\
    \ the correct places, but users of your framework can then use it with or without\
    \ collection.\n\n## Interoperating with C\n\nIn garbage collected mode, not all\
    \ memory is scanned. Anything allocated by `malloc()` is invisible to the garbage\
    \ collector. If you pass an object pointer as a `void*` parameter to a C function,\
    \ which then stores it in `malloc()`’d memory, it becomes invisible to the collector\
    \ and may be freed even though there are still references to it.\n\n## Using Weak\
    \ References\n\nNormally, you would send a `-retain` message to the object before\
    \ doing this, but that won’t work in garbage collected mode. Instead, you have\
    \ to use the `CFRetain()` function. This will increment the object’s reference\
    \ count, irrespective of whether the collector is running.\n\nThe collector will\
    \ only free objects when their retain count is zero and it cannot find any references\
    \ to them in traced memory.\n\nWhen you have finished with a reference that is\
    \ outside of the collector’s scope, you need to call `CFRelease()`. Unfortunately,\
    \ this isn’t the only case when you need to use these functions.\n\nYou also need\
    \ to use them when you are passing an object as an argument for a callback in\
    \ some cases.\n\n```objc\n@interface WeakDelegate : NSObject\n{\n    __weak id\
    \ delegate;\n}\n@property __weak id delegate;\n@end\n\n@implementation WeakDelegate\n\
    \    @synthesize delegate;\n@end\n```\n*From: `gc.m`*\n\nOne of the nicest things\
    \ about Apple’s garbage collection implementation is the existence of *zeroing\
    \ weak references*. Pointers that are not retained are often referred to as “weak”\
    \ in Objective-C documentation that predates the garbage collector. These are\
    \ references that are allowed to persist beyond the lifetime of the object. Unfortunately,\
    \ there is no automatic way of telling whether they are still valid.\n\n**Note:**\n\
    Weak references in a reference counted environment, such as those referencing\
    \ delegates, are commonly used to eliminate retain cycles. These are not needed\
    \ in a tracing environment, so you can use strong references for pointers to delegates\
    \ and anywhere else you might have a retain cycle.\n\nIf you declare an object\
    \ pointer `__weak` in garbage collected mode, you get a zeroing weak reference.\
    \ This is not counted by the garbage collector when determining if an object is\
    \ still live. If all of the references to an object are weak, it can be destroyed.\
    \ Afterwards, reading the weak references will return `nil`.\n\nWeak references\
    \ are most commonly used in connection with things such as notifications. You\
    \ will keep a weak reference to an object and keep sending it messages as long\
    \ as it is referenced elsewhere, then you can have it cleaned up automatically\
    \ later.\n\n## Allocating Scanned Memory\n\nCocoa now comes with some collections\
    \ that let you store weak references. Older versions of the Foundation framework\
    \ provide `NSMapTable` and `NSHashTable` as opaque C types, with a set of C functions\
    \ to use them. These interfaces are still available, but with 10.5, Apple made\
    \ these two C types into classes.\n\nThe `NSMapTable` type is a general form of\
    \ `NSDictionary` that can be used to store any pointer-sized types as both values\
    \ and keys.\n\nWith garbage collection, you can use this class to store mappings\
    \ to and from strong or weak object pointers as well. This is useful for things\
    \ such as `NSNotificationCenter`, so that objects can be collected while they\
    \ are still registered to receive notifications and can be automatically removed\
    \ from the notification center when this happens.\n\n```objc\nid *buffer = NSAllocateCollectable(\n\
    \    10 * sizeof(id),\n    NSScannedOption);\n```\n*From: `gc.m`*\n\nIf you allocate\
    \ memory with `malloc()`, it is invisible to the garbage collector. This is a\
    \ problem if you want, for example, something like a C array containing objects.\
    \ We’ve already looked at one solution to this. You can call `CFRetain()` on the\
    \ object you are about to store and `CFRelease()` on the old value, and then swap\
    \ them over. This is not ideal, although it will work.\n\nThe other option is\
    \ to allocate a region of memory from the garbage collector. The `NSAllocateCollectable()`\
    \ function is similar to `malloc()`, but with two important differences.\n\n1.\
    \ The first is that the memory that it returns is garbage collected. There is\
    \ no corresponding `NSFreeCollectable()` function. When the last pointer to the\
    \ buffer disappears, the buffer will be collected.\n\n**Note:**\nThe Apple collector\
    \ does not support interior references, so you must make sure you keep a pointer\
    \ to the start of the region. Pointers to somewhere in the middle of the buffer\
    \ will not prevent it from being freed.\n\n2. The second difference is that the\
    \ second parameter to this function defines the kind of memory that you want.\
    \ If you are going to be using the buffer for storing C types, you can just pass\
    \ zero here. If you pass `NSScannedOption`, the returned buffer will be scanned\
    \ as a possible location of object pointers, as well as pointers to other memory\
    \ regions returned by `NSAllocateCollectable()`.\n\n## Supporting Two-Stage Creation\n\
    \n```objc\nNSMutableString *buffer = [[NSMutableString alloc] init];\nNSMutableArray\
    \ *array = [[NSMutableArray alloc] initWith\n```\n*From: `allocInit.m`*\n\nOne\
    \ of the patterns you’ve already seen is *two-stage creation*. In traditional,\
    \ pre-NeXT, Objective-C, you create an object by sending the class `+new` message.\
    \ When you implemented a new class, you would override `+new` to call the superclass\
    \ implementation and then perform that class’s initialization. NeXT changed this,\
    \ splitting object creation and object initialization into two different methods.\
    \ The `+new` method still works, but now it sends a `+alloc` message to the class\
    \ and a `-init` message to the returned object.\n\nThe `+alloc` method itself,\
    \ by default, calls `+allocWithZone:`. This takes an `NSZone` as an argument.\
    \ This is an opaque type encapsulating an allocation zone. This was used very\
    \ heavily on NeXT systems, to make efficient use of the very small amount of memory\
    \ these machines came with. It does not work particularly well on OS X, and is\
    \ not properly supported by all classes, so it’s something of a vestigial feature\
    \ in a lot of modern Objective-C code.\n\nWhen you create a new class, you override\
    \ the `-init` method, or provide a new designated initializer.\n\n**Note:**\n\
    You can still find some evidence of the old-style creation in GCC. When `+new`\
    \ was used to create objects, it was common to create the new instance and then\
    \ assign it to `self` in the class method. There is some code in GCC to support\
    \ this, allowing instance variable access from class methods. This feature was\
