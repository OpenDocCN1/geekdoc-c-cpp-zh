  trans: "\n\n# 检查类\n\n注意：\n\n在测试类是否符合协议一致性时，最好使用运行时函数，而不是向它们发送 `+conformsToProtocol:`\
    \ 消息。许多类使用 `+initialize` 进行懒初始化，即使你实际上没有使用该类，向它们发送消息也会导致这段代码被运行。\n\n`objc_getClassList()`\
    \ 函数将给你一个类数组。它接受两个指针作为参数，一个是用于返回类的数组，另一个是缓冲区的大小。如果你用 `NULL` 作为第一个参数调用它，它将不会返回任何类，但它会让你知道共有多少个类。\n\
    \n一旦你有了这个数组，你就可以对它进行迭代并检查这些类。在这个示例中，我只是将类名存储在一个数组中并对其进行排序。在接下来的节中，你将看到如何获取类名并打印每个类的实例变量和方法。\n\
    \n如果你正在寻找符合特定协议的类，那么你应该改用 `class_conformsToProtocol()` 函数。\n\n这会告诉你该类是否符合指定的协议。如果符合，你就可以将其添加到已加载的插件列表中。\n\
    \n## 第 19 章：Objective-C 运行时\n\n### 检查类\n\n```objc\nconst char *name = [className\
    \ UTF8String]; \nprintf(\"%s\\n\\tIvars:\\n\", name); \nClass cls = NSClassFromString(className);\
    \ \nunsigned int ivarCount;\nIvar *ivars = class_copyIvarList(cls, &ivarCount);\
    \ \nfor (unsigned int i=0 ; i<ivarCount ; i++) \n{\n    printf(\"\\t\\t%s\\n\"\
    , ivar_getName(ivars[i]));\n}\nfree(ivars);\nunsigned int methodCount;\nMethod\
    \ *methods = class_copyMethodList(cls, &methodCount);\nprintf(\"%s\\n\\tMethods:\\\
    n\", name);\nfor (unsigned int i=0 ; i<methodCount ; i++) \n{\n    printf(\"\\\
    t\\t%s\\n\", sel_getName(method_getName(methods[i])));\n}\n```\n源自：*classTree.m*\n\
    \n一旦你获得了类的指针（通过枚举所有类、向对象发送 `-class` 消息或使用 `NSClassFromString()`），你就可以检查它。类结构包含了大量关于\
    \ Objective-C 类的信息，所有这些信息对程序员都是可见的。\n\n在旧的运行时，`Class` 是 `struct objc_class` 的\
    \ `typedef`，它定义在一个头头文件中。在更现代的系统中，`Class` 是一个不透明类型，你应该通过一组公共函数与它交互。这使得随着时间演进 ABI\
    \ 变得更容易。类结构的布局可以通过修改编译器和运行时更改，而无需更改任何其他代码。\n\n`classTree.m` 示例打印了系统中所有类的实例变量和方法。你可以访问更多的元数据。例如，实例变量存储了它们的类型以及相对于对象起始位置的偏移。这些信息用于\
    \ KVC 的实现。当你为一个键设置值且允许 KVC 直接访问实例变量时，它会首先找到一个名称匹配的实例变量。然后它会找到类型并确定是否需要对对象进行解箱。最后，它会将\
    \ `ivar` 偏移量加上对象指针，然后在该地址执行赋值。\n\n它对访问器方法（accessor methods）执行类似的操作。\n\n方法存储了它们的名称、类型和方法指针。类型信息非常重要，因为它允许其他代码构建调用帧。通过检查访问器方法的类型，KVC\
