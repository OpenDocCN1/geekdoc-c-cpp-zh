    In C code, the standard library provides an `assert()` macro, which logs a message
    and calls `abort()` when the predicate argument evaluates to false. The Objective-C
    versions are slightly more useful.


    Asserting Expectations 305


    Foundation provides two macros, `NSAssert()` and `NSCAssert()`. If you are using
    C99 (which you should be) then these are variadic, otherwise you will need to
    use the variants, like `NSAssert1()`, that take fixed numbers of arguments. `NSAssert()`
    references `self` and so can only be used in an Objective-C method body. `NSCAssert()`
    can be used in C functions.


    Unlike the C variants, these do not abort when the assertion is false. Instead,
    they send a message to a per-thread assertion handler object. This object is,
    by default, an instance of `NSAssertionHandler` and throws an `NSInternalConsistencyException`
    when you hit an assertion. You can catch this and recover, but most often it will
    reach the top of the stack and cause the program to abort.


    You can create your own subclass of `NSAssertionHandler` and override one or both
    of the assertion-handling methods if you want some other behavior. This example
    ignores assertions in C functions, just logging a message when they are encountered.


