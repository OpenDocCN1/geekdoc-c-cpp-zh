  trans: "\n运行时（runtime）的职责之一是存储所有加载类的表。你可以枚举这个表，逐一查看每个类，也可以使用它通过类名查找类。\n\n后者在实现 `weak\
    \ class references`（弱类引用）时特别别有用。现代 Apple 运行时直接支持这种功能，但该支持尚未通过语言暴露出来，因此目前并不特别有用。弱类引用的设计思想是：你可以选择性使用某个类。\n\
    \n例如，你可能会在一个框架中编写一些代码，该框架使用了 `Foundation` 类，并且如果你链接了 `AppKit`，就可以使用 `AppKit` 类。这样，该框架就可以任何具有\
    \ `Foundation` 实现的地方运行，但在可用 `AppKit` 特性时，它会利用 `AppKit` 的功能。你也可以使用这种机制来避免对第三方框架的依赖。\n\
    \n### 测试对象是否理解某个方法 313\n\n1\n```bash\n$ gcc -framework Foundation -g -std=c99\
    \ weakClass.m && ./a.out\n```\n\n2\n```\na.out[53194:903] Not linked against AppKit\
    \ 3\n```\n\n3\n```bash\n$ gcc -framework Cocoa -g -std=c99 weakClass.m && ./a.out\n\
    ```\n\n4\n```\na.out[53184:903] View: <NSView: 0x1001163b0> *Output from: weakClass.m*\n\
    ```\n\n注意当此示例链接 `Cocoa`（它链接了 `AppKit` 和 `Foundation`）与仅链接 `Foundation` 时输出的差异。如果\
    \ `NSView` 类存在，它会创建一个实例。如果不存在，它只会记录一条消息。\n\n你也可以将此机制用于必须与框架旧版本向后兼容的代码。如果你使用这种机制查找新类，你会得到一个\
    \ `Nil` 值，你可以在可以在类不存在时处理该值。\n\n### 测试对象是否理解某个方法\n\n12\n```objc\nSEL sel = @selector(delegateMethod:);\n\
    if ([delegate respondsToSelector: sel])\n{\n    [delegate delegateMethod: self];\n\
    }\n```\n*来自: respondsToSelector.m*\n\nObjective-C 代码倾向于使用非正式的（informal）`protocols`（协议）。这些是代理可以选择性实现的一组消息。\n\
    \n当你编写使用这些协议的代码时，需要在发送消息之前测试该类是否真的实现了该方法。\n\n**注意：**\n\n这并不完全正确。你只需要在 `@try` 块中发送消息，并在它不理解该方法时捕获抛出的异常。然而，考虑到抛出异常的代价，这并不是推荐的方法。\n\
    \n幸运的是，做到这一点非常简单。`NSObject` 实现了一个 `-respondsToSelector:` 方法，用于测试接收者是否可以处理带有给定\
    \ selector 的消息。\n\n该方法不仅由 `NSObject` 实现，还是 `NSObject` 协议的一部分。其他根类也会实现它。这对于转发（forwarding）来说非常重要。\n\
    \n该方法在 `NSObject` 中调用了 `class_respondsToSelector()` 运行时函数。在其他类中，实现方式是不同的。\n\n\
    如果你直接使用运行时函数，你的代码将会非常脆弱。大多数时候，你想知道的是要发送消息的对象是否能处理该消息，而不是它是否有一个处理该消息的方法。这些在某些语言（如\
    \ C++）中是相同的，但在 Objective-C 中，它们是完全不同的概念。\n\n### 转发消息 315\n\n当你向代理发送 `-respondsToSelector:`\
    \ 消息时，它会测试真实对象是否有对应该 selector 的方法。被代理封装的对象可能是另一个代理，它将进一步转发该请求。\n\n你也可以通过向类发送 `-conformsToProtocol:`\
    \ 消息来测试协议遵循性。注意，这仅测试了该类是否被声明采纳了该协议。类可以采纳协议但不实现它们的所有方法（尽管它们不应该这样做），但更常见的情况是类可以实现协议中的所有方法，而不显式地遵循该协议。\n\
    \n### 转发消息 3\n\n```objc\n@interface Facade : NSObject\n{\n    id delegate;\n}\n\
    @end\n\n@implementation Facade\n- (id)forwardingTargetForSelector:(SEL)aSel\n\
    {\n    return delegate;\n}\n- (void)forwardInvocation: (NSInvocation*)anInv\n\
    {\n    [anInv invokeWithTarget: delegate];\n}\n@end\n```\n*来自: forward.m*\n\n\
    Objective-C 中的消息旨在类似于 Smalltalk 消息，而不是 C 函数。它们是后期绑定的并且是可以被内省的。在最底层，它们使用 C 函数实现，但这是一个实现细节。你可以假装消息是可以在其他对象之间传递、被内省、然后由方法处理的对象。\n\
    \n当你向一个对象发送一个在该对象上没有对应方法的消息时，对象仍有一些方法可以处理它。这些方法在 Objective-C 的发展过程中已经发生了很大变化。\n\
    \n在旧的 Objective-C 代码中，会调用对象的 `-forward::` 方法。这是一个变长方法，要求接收者知道栈帧的结构。NeXT 用 `-forwardInvocation:`\
    \ 替换了它。\n\n在 10.5 版本中，Apple 引入了一种新的、更快的转发机制。如果你的对象实现了 `-forwardingTargetForSelector:`，它将会在带有缺失方法的\
    \ selector 时被调用。\n\n**注意：** GNU 运行时使用的两阶段消息发送机制不支持这种机制，旧版本的 Apple 运行时也是。如果你使用它，最好提供一个使用\
    \ `-forwardInvocation:` 的回退方案。如果你使用的是较新的 Apple 运行时或非脆弱 ABI 的 GNU 运行时，你将获得速度优势。如果不是，代码仍然可以运行，只是很慢。\n\
    \n`-forwardInvocation:` 机制非常灵活，但性能不好。创建对象和解构栈帧的代价是普通发送的数百倍，这意味着你不应该在任何对性能敏感的地方使用它。\n\
    \n`-methodSignatureForSelector:` 方法返回一个代表与消息相关的调用帧的对象。`NSInvocation` 类在创建消息的对象时会使用它。\n\
    \n### 查找类 9\n\n```objc\nint classCount = objc_getClassList(NULL, 0);\nClass *classList\
    \ = calloc(classCount, sizeof(Class));\nobjc_getClassList(classList, classCount);\n\
    for (int i=0 ; i<classCount ; i++)\n{\n    [classes addObject:NSStringFromClass(classList[i])];\n\
    }\nfree(classList);\n[classes sortUsingSelector:@selector(compare:)];\n```\n*来自:\
    \ classTree.m*\n\n查找 Objective-C 类有两种。如果你知道名称，可以直接使用 `NSClassFromString()` 函数。它接收一个字符串对象作为参数并返回该类，如果没有注册同名的类则返回\
    \ `Nil`。\n\n如果你不知道类的名称，那么你需要采取不同的方法。在某些情况下，你可能想知道某个类但并不知道它的名称。例如，如果你有一个插件架构，你可能允许用户指定要加载的\
    \ bundle，然后想要收集特定类的所有子类，或者遵循给定协议的所有类。\n\n"
- fmt: "\n# Inspecting Classes\n\nNote:\n\nWhen you are testing classes for protocol\
    \ conformance, it’s a good idea to use the runtime functions, rather than sending\
    \ them a `+conformsToProtocol:` message. Lots of classes use `+initialize` for\
    \ lazy initialization, and sending them a message will cause this code to be run\
    \ even if you aren’t actually using the class.\n\nThe `objc_getClassList()` function\
    \ will give you an array of classes. This takes two pointers as arguments, one\
    \ is the array that will be used to return the classes, the other is the size\
    \ of the buffer. If you call it with `NULL` as the first argument, then it won’t\
    \ return any classes, but it will let you know how many there are.\n\nOnce you\
    \ have this array, you can iterate over it and inspect the classes. In this example,\
    \ I just store the class names in an array and then sort it. In the next section,\
    \ you’ll see how to take the class names and print the instance variables and\
    \ methods for each class.\n\nIf you were searching for classes that conform to\
