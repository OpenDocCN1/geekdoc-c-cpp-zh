    ## 第一章：Objective-C 哲学


    vtable 被暴露给开发者。与 C++ 不同（vtable 是私有的），Objective-C 允许你检查并修改一切。


    在旧的运行时中，Objective-C 类由 C 结构表示。你可以直接修改它们，或者创建新的并向运行时注册。


    ### 理解对象模型


    Objective-C 拥有类似于 Smalltalk 的对象模型。如果你来自 Java，你会发现这非常容易理解。如果你来自 Simula 系语言（如 C++），你可能会觉得有点困难。

    '
- fmt: '

    Simula did not use the term “object orientation,” but a lot of Simula-like languages
    that postdate Smalltalk have adopted the term, leading to some confusion. Languages
    in this family, such as `C++`, use `virtual function tables (vtables)` to implement
    something that is superficially similar.


    A Simula-style object contains a pointer to its `vtable`, or `vtables` if it has
    superclasses. When you call a virtual function, the compiler creates an offset
    into the `vtable` and then a call to the function at this offset.


    One of the side effects of this difference is that pointer casting in Objective-C
    and `C++` have very different semantics. When you cast a pointer to one object
    type to another in Objective-C, no code is generated. The cast is just a hint
    to the compiler’s type checker.


    In `C++`, however, a pointer cast performs some pointer arithmetic so that code
    that is passed the cast pointer can find the `vtable` at the correct location.
    This means that you can cast any object type to any other object type in Objective-C,
    whereas in `C++` you need to use a special kind of cast.


    This distinction is very important. In Objective-C, the only thing that affects
    the method lookup is the type of the object. In `C++` and other Simula-family
    languages, the lookup is also affected by what the compiler thinks the type of
    the object is.


    ## A Tale of Two Type Systems


    One of the things that can confuse people coming to Objective-C is that it has
    two type systems. This makes sense if you consider the original implementation
    as a preprocessor.


    The Objective-C preprocessor would perform `Strongtalk`-like type checking and
    then the `C` compiler would perform `C` type checking.


    ### C Is Objective-C


    `C` has a structural type system. Type equivalence for primitive types is based
    on whether two types have the same representation. Complex types are never regarded
    as equivalent.


    Objective-C adds an algebraic type system. The type of an object is defined by
    its signature: the messages that it claims it will respond to. You can implicitly
    cast an Objective-C object to its superclass, because it is guaranteed to respond
    to all of the messages that the superclass understands.


    You can explicitly cast objects to other types. You could, for example, cast a
    dictionary object to an array object. As long as you then only send it messages
    that are understood by both dictionaries and arrays, this will work.


    One of the most important features of Objective-C is that it is a pure superset
    of `C`. You can think of `C` as a domain-specific language embedded in Objective-C
    for low-level tasks and a subset of Smalltalk as a domain-specific language embedded
    in Objective-C for high-level tasks.


    There is nothing wrong with solving a problem using pure `C`. One of the mistakes
    that a lot of people make when learning Objective-C is to static type information
    for optimization assume that they must stop using `C`. For a lot of things, the
    `C` solution is the correct one.


    **Note:**


    Objective-C also has a sister language, `Objective-C++`, which has the same relationship
    to `C++` that Objective-C has to `C`. `Objective-C++` is a pure superset of `C++`
    and allows you to call `C++` code from Objective-C objects, and vice versa. Because
    they have very different object models, you cannot subclass an Objective-C class
    with `C++`, or the converse; however, you can use pointers to Objective-C objects
    as fields in `C++` objects and pointers to `C++` objects as instance variables
    in Objective-C objects.


    You can see this in the Cocoa frameworks.


    Not everything is an object. If you ask for a range of characters in a string,
    you will use an `NSRange` structure. This is a `C` structure—not an Objective-C
    object—containing a location and a length. Points, rectangles, and several other
    things are represented in a similar way. If these were objects, then you would
    use more memory, make manipulating them slower, and not really gain any flexibility.


    The Ingalls test for object orientation says that you should be able to create
    a new kind of integer and use this in positioning a window on the screen. Objective-C
    fails this test, but it’s not a very useful example in the real world, because
    most of the time designing new kinds of integers would break a lot of things that
    expect integers to have the standard behavior.


    In Objective-C, you don’t have to use the dynamic behavior, such as late binding
    and polymorphism, in cases where it isn’t useful.


    ## The Language and the Library


    It’s difficult with very dynamic languages to draw the line between the language
    and the library. In Smalltalk, there is no equivalent of an `if` statement in
    the language. The standard library defines `True` and `False` singleton classes,
    which respond to `-ifTrue:` messages taking a closure as an argument. All complex
    flow control structures, such as loops or enumeration, are implemented in terms
    of this.


    Objective-C inherits flow control from `C`, but all of the dynamic behavior is
    supplied by the runtime library. This is different from `C` or `C++`. You can
    compile a freestanding `C` or `C++` binary that doesn’t call any functions in
    `libc` or `libstdc++`. Every Objective-C program that isn’t a pure `C` program,
    however, must link against `libobjc` to work.


    This library traditionally provides three classes: a simple root class, a class
    for constant strings, and a class for protocols. The first of these provides functionality
    that is part of the language in `C++`, Java, and similar environments. The other
    two are classes that may be generated by the compiler.


    Most of the time, you will not use any of these classes. Almost all Objective-C
    code written in the last decade or two uses an implementation of the OpenStep
    Foundation framework. OpenStep was a specification jointly worked out by NeXT
    and Sun to provide a modern object-oriented framework for cross-platform application
    development. NeXT implemented it on their OPENSTEP operating system and on Windows
    NT, whereas Sun shipped an implementation for Solaris. A little bit later, the
    GNU project shipped a third implementation: GNUstep.


    OpenStep defined two frameworks: the Foundation Kit and Application Kit, typically
    shortened to Foundation and AppKit. The Foundation Kit provides the core functionality
    that developers need for all applications, such as collection classes, run loops,
    notification delivery, OS abstraction, and so on. The Application Kit is built
    on top of this and provides extra support for building graphical applications.
    Sun’s implementation didn’t see much development after the initial release. Apple
    bought NeXT a few years later and renamed the OpenStep environment Yellow Box,
    shipping it as a developer environment both in Rhapsody and on Windows. With the
    release of OS X, it was renamed yet again, this time to Cocoa.


    ## The History of Objective-C


    The GNUstep project is still actively developed, but now tracks Apple’s enhancements
    to the OpenStep specification, as well as the core specification. This means that
    the Foundation framework is usable pretty anywhere, although some of the newest
    classes and methods are missing with the GNUstep implementation.


    You can think of the Foundation framework as the Objective-C standard library.
    It provides a lot of features that are required for nontrivial programs. Several
    of the Objective-C 2 features are designed specifically to work with Foundation.

