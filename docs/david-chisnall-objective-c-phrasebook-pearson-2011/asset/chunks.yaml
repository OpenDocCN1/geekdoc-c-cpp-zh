    `-framework`，指定一个包含头文件和共享库的框架包。这既是链接器选项，也是预处理器选项。


    书中的示例都使用了 `Foundation` 框架。在其他平台上，这通常由 GNUstep Base 库实现。


    这些平台通常不支持 `-framework` 选项。`gnustep-config` 工具提供了一个替代方案。它会打印编译 Objective-C 以及链接基础（`Foundation`）或
    GUI（`AppKit`）库所需的编译器选项。


    与 C 和 C++ 一样，你可以指定 `-c` 只编译文件而不进行链接，并使用 `-o` 指定输出的名称。如果你正在编译多个文件，你可能想用比从命令行运行
    `clang` 编译器更高级一点的方法。


    在 OS X 上，你可能会使用 `XCode` IDE。这让你能够创建具有许多不同模板类型的项目。如果你需要在其他平台上编译这些项目，你可以在 GNUstep
    仓库中找到一个名为 `pbxbuild` 的工具，它可以用来编译它们。


    如果你在其他某些平台上工作，可以使用 `GNUstep Make` 进行构建。这在 OS X 上同样有效，因此无论你选择哪种方案，都不应该出现构建系统引起的移植性问题。


    ## 第 1 章：Objective-C 哲学


    ## 第 2 章：Objective-C 入门


    旨在用于与 C 库配合使用，而不是作为一种独立语言。现在，大多数 Objective-C 代码都使用基于 NeXT Foundation 框架的内容——可以是
    Apple 的 `Foundation`、GNUstep Base 库或 `libFoundation`——作为标准库。这提供了诸如引用计数内存管理、标准数据结构、转发机制等功能。


    你认为属于 Objective-C 语言的大部分内容实际上是由 `Foundation` 框架提供的。在没有 Foundation 的情况下使用 Objective-C
    是可能的，但人们这样做是为了证明他们可以做到，而不是因为这实际上是一个明智的选择。


    ### 声明 Objective-C 类型


    ```objc

    NSMutableArray *mutableArray = [NSMutableArray new];

    NSArray *array = mutableArray;

    NSObject *object = array;

    id obj = mutableArray;

    mutableArray = (NSMutableArray*)object;

    mutableArray = obj;

    ```

    *来自: cast.m*


    Objective-C 正如其名，在 C 的基础上增加了对象。具体来说，对象遵循 Smalltalk 模型，即类的实例。对象始终分配在堆上，因此始终通过指针引用。


    在 Objective-C 的早期实现中（这些实现从 Objective-C 生成纯 C 代码），类被转换为描述对象布局的结构定义。你仍然可以在 GCC 错误信息中看到这种做法的遗留，它偶尔会将对象称为“结构体（structures）”。


    在 C 中，你需要显式的类型转换将任何结构体指针转换为其他类型的结构体指针。这一规则在 Objective-C 中被稍微放宽。任何对象的布局都由根类中的实例变量
    `(ivars)` 定义，然后由层次结构中每个后续类中的实例变量定义。子类只能添加新的实例变量，而不能删除或重排父类中的变量。这意味着，从内存布局的角度来看，将指向一个类实例的指针转换为指向另一个类实例的指针总是安全的。


    从面向对象的类型系统的角度来看，这也是安全的；任何子类都将响应父类响应的所有消息。


    Objective-C 中的对象指针通过类名识别，后面跟一个星号，就像 C 语言中的结构体指针一样，但不需要 `struct` 关键字。你始终可以隐式地将指向一个类实例的指针转换为其父类实例的指针。


    这对于间接父类也有效。例如，`NSMutableArray` 是 `NSArray` 的子类，而 `NSArray` 是 `NSObject` 的子类。你可以将
    `NSMutableArray` 转换为 `NSArray` 或 `NSObject`。然而，反方向的转换需要显式转换。


    Objective-C 还引入了一种新的指针类型：`id`。在类型转换规则方面，它大致比比 `void*`。你可以隐式地将任何对象指针转换为 `id`，也可以隐式地将
    `id` 转换为任何对象指针类型。


    如果你习惯于无类型语言（如 Smalltalk、Ruby 或 Python），那么专门只使用 `id` 类型可能很很有诱惑力。这在大多数情况下是安全的，尽管有一个例外。Objective-C
    使用消息名称进行查找，而不包含任何类型信息。这意味着你可以声明两个同名（在不同类中）但类型不同的方法。


    当编译器生成一个消息发送指令时，它使用接收者的类型来确定栈帧的布局。当在任何地方都只有一个以该名称声明的方法时，就不需要类型信息。


    如果你想从对象外部访问实例变量，也需要静态类型，但这样做通常被认为是不良风格。虽然不需要指定静态类型信息，但通常是一个好主意。除了刚才提到的情况外，它不会影响代码生成，但它会被编译器的语义分析阶段使用。这有助于在编译时捕捉一些错误。


    例如，如果你尝试将一个对象添加到 `NSArray` 实例，编译器会警告你该对象不响应相关消息。这让你检查是否真的想用 `NSMutableArray`，或者是否需要为数组创建一个可变副本。


    **注意：**


    在 C++ 中，通常使用 `const` 关键字来描述对象为不可变。在 Objective-C 中，`const` 实际上是没用的。它指定对象的实例变量可能被修改，但很少这样做。它不会改变可以发送给对象的消息，因此声明为
    `const` 的对象仍然是变的。


    在大多数需要区分可变和不可变实例的情况下，Objective-C 程序员使用*可变子类模式*，即一个不可变类有一个可变的子类。你可以隐式地将可变版本转换为不可变，但无法让不可变实例变为可变。


    `Class` 类型与 `id` 相似，但它可以引用类。在 Objective-C 中，类也是对象，因此你始终可以用 `id` 代替 `Class`，就像你可以用
    `id` 代替特定的对象类型一样。


    另外两个类型在标准 Objective-C 头文件中定义。`SEL` 类型用于选择器（selectors），我们将在本章稍后部分讨论。最后一个是 IMP，全称为*实例方法指针
    (Instance Method Pointer)*。这种类型指向 Objective-C 方法的指针。大多数情况下，你根本不需要这种类型。它只用于 Objective-C
    的某些非常动态的功能以及优化。我们将在第 19 章查看你可能用到它的地方。


    ### 发送消息


    ```objc

    [anObject autorelease];

    [anObject addObject: anotherObject];

    [anObject setObject: anotherObject forKey: aThirdObject];

    ```

    *来自: exampleMessages.m*


    Objective-C 对 C 最重要的改进是发送消息。正如我在上章提到的，消息是一种高级的流控制结构。


