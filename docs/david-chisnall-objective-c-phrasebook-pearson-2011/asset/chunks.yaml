    [content]


    如果你只需要执行一次算术运算并将结果存储在对象中，那么第一个选项更为简单。如果你需要执行多个步骤，那么使用 `C` API 会更快。因为这些操作会修改结构，因此不需要你为每个中间步骤创建一个新对象。


    **注意：**


    `C1X` 规范包含了小数类型，某些编译器支持作为扩展的这些类型。`NSDecimal` 类型与这些类型不兼容。在大多数平台上，这并不重要。如果你的目标平台是像
    IBM 的 `POWER6` 这种具有小数算术硬件的设备，那么直接使用小数类型会更好。


    这两种方法都不特别快。小数以数字数组的形式表示，在两个数字归一化之后，会对这些数字进行成对操作。你可以预期其性能与软件浮点数实现相似——可能稍微差一点点，因为
    `NSDecimal` 并没有被广泛使用，因此没有投入大量的精力进行优化。


    `NSDecimalNumber` 是 `NSNumber` 的子类，因此在下一节中我们将会看到的所有将 `NSNumber` 转换为字符串的方法都能如预期工作。你也可以使用访问这些数字对象的标准方法将它们转换为
    `C` 原始类型，但这些方法可能会截断或近似小数值。


    ### 字符串与数字之间的转换


    ```objectivec

    int answer = [@"42" intValue];

    NSString *answerString =

    [NSString stringWithFormat: @"%d" , answer];

    NSNumber *boxedAnswer =

    [NSNumber numberWithInt: answer];

    NSAssert([answerString isEqualToString:

    [boxedAnswer stringValue]],

    @"Both strings should be the same" );

    ```

    *来源：`strtonum.m`*


    在数字和字符串之间转换有多种方法。许多表示简单数据的对象都有如 `-intValue` 的方法，用于返回接收者的整数表示。


    `NSString` 在这一家族中有几个方法。


    如果你有一个包含数值的字符串，你可以向它发送 `-doubleValue`、`-floatValue`、`-intValue` 或 `-longLongValue`
    消息将其转换为这些类型中的任意一种。在 64-bit 安全的 `Foundation` 版本中，你还可以向它发送 `-integerValue` 消息。这将返回一个
    `NSInteger`。


    反向操作（从整数获取字符串）也有几种方法。我们在第 6 节介绍其中一种：`NSString` 上的 `+stringWithFormat:` 方法允许你从任何原始
    `C` 类型构建字符串，就像你使用 `sprintf()` 构建 `C` 字符串一样。


    如果你已经有一个 `NSNumber` 实例中的数字，有两种方法可以获取字符串，其中一种方法是另一种方法的封装。`-descriptionWithLocale:`
    方法返回一个根据指定的语言环境（locale）格式化数字生成的字符串。


    事实上，这本身并没有执行转换。它向一个新的 `NSString` 发送了 `-initWithFormat:locale:` 消息。格式化字符串取决于数字的类型：例如，double
    类型将使用 `@"%0.16g"` 格式字符串进行转换。该格式会使用最多 16 位有效数字，并在需要时使用指数。


    的小数点分隔符取决于语言环境。


    如果你向 `NSNumber` 发送 `-stringValue` 消息，这等同于发送一个以 `nil` 为参数的 `-descriptionWithLocale:`
    消息。这使用了*规范语言环境*（canonical locale），意味着不进行任何本地化，因此结果在任何平台上都是相同的。


    ### 从字符串中读取数字


    ```objectivec

    NSScanner *parser = [NSScanner scannerWithString: @"1 plus 2"];

    int operands[2];

    NSString *operation;

    [parser setCharactersToBeSkipped:[NSCharacterSet whitespaceCharacterSet]];

    [parser scanInt: operands];

    [parser scanCharactersFromSet:[NSCharacterSet letterCharacterSet] intoString:
    &operation];

    [parser scanInt: operands+1];

    ```

    *来源：`scanner.m`*


    任何 `C` 程序员首先学会使用的两个函数之一就是 `printf()` 和 `scanf()`。它们非常、非常相似——一个几乎是另一个的反反——而且它们让你能够构建格式化字符串并从中解析数据。


    我们已经看到 `NSString` 有一个类似于 `sprintf()` 的对应物，所以你可以从格式化字符串和变量构建字符串，但 Objective-C 中等价于
    `sscanf()` 的是什么？


    在给定字符串的情况下，我们如何从中解析值呢？


    答案就在 `NSScanner` 类中。这个类是一个非常强大的分词器类。你创建一个附加到字符串的 `NSScanner` 实例，然后一个接一个地从中扫描值。


    你发送给扫描器的消息具有相同的格式。它们接收一个变量指针并返回一个 `BOOL`，表示执行是否成功。扫描器在字符串中存储当前的扫描索引，并且仅在扫描成功时增加它，因此你可以尝试以不同的方式解析后续字符。你也可以很方便地使用
    `NSScanner` 实现预读和回溯。如果你向它发送 `-scanLocation` 消息，它返回字符串中的当前索引。然后你可以尝试扫描几项内容，遇到错误后通过向它发送
    `-setScanLocation:` 消息来回溯，重置旧索引。


    `NSScanner` 最强大的方法之一是 `-scanCharactersFromSet:intoString:`。它从当前点开始读取字符串，直到遇到一个指定集中不存在的字符。正如我们在第
    6 节将看到的，你可以使用任何任意集合构造 `NSCharacterSet` 实例，或者使用标准集合之一。


    本节开头的示例从字符串中读取了一个数字、一个单词，然后是另一个数字。数字是使用内置的 `-scanInt:` 方法读取的，但单词稍微复杂。它使用了一个 `NSCharacterSet`，在本例中是所有字母的集合。


    这不是示例中使用的唯一 `NSCharacterSet`。该扫描器还配置为跳过空白。发送给扫描器的 `setCharactersToBeSkipped:`
    消息告诉它忽略作为参数的集合中的任何字符。传递空白字符集告诉它跳过调用之间发生的任何空白。


    如果在扫描器开始扫描的位置存在该集合中的字符，它将跳过它们。在解析令牌时，它不会跳过这些字符，因此字符串中的“1 2”会被读取为两个独立的数字，而不是 12。


    ### 创建常量字符串


    ```objectivec

    const char *cstring ="C string";

    NSString *objcstring = @ @"Objective-C string";

    CFStringRef cfstring = CFSTR( *"Core Foundation string"* );

    ```

    *来源：`constantStrings.m`*


    在 OS X 上，Objective-C 字符串与 Core Foundation (CF) 字符串之间是无缝桥接（toll-free bridged）。


    常量 CF 字符串的表示方式与 GNU 运行时 Objective-C 字符串相似，但有几点不同。它们的 isa 指针被设置为 Core Foundation
    框架中存在的外部引用，因此它们不需要 Objective-C 运行时或 Foundation 框架。


    [/content]

