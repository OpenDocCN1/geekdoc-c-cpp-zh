- fmt: "\nto be linked in order to work. They also have a `flags` field, allowing\
    \ their internal representation to be either UTF-8 or UTF-16, depending on which\
    \ is more efficient for their contents.\n\nConstant Objective-C strings are created\
    \ by prefixing a constant C string literal with an at symbol, as in `@*\"string\"\
    `. You can also create constant Core Foundation strings by using the `CFSTR()`\
    \ macro, in both C and Objective-C code.\n\nThis macro calls a compiler built-in\
    \ function which generates a constant string object.\n\n## Comparing Strings\n\
    \n```objc\nNSString *twelve = @*\"12\";\nNSString *twelveFromInt = [NSString stringWithFormat:\
    \ @\"%d\", 12];\nNSNumber *numberTwelve = [NSNumber numberWithInt: 12];\n\nif\
    \ ([twelve isEqualToString: twelveFromInt])\n    NSLog(@*\"Both strings are equal\"\
    );\n\nif (twelve == twelveFromInt)\n    NSLog(@*\"Both strings are identical\"\
    );\n\nif (twelve == @*\"12\")\n    NSLog(@*\"Constant strings are identical\"\
    );\n\nif ([twelve isEqual: numberTwelve])\n    NSLog(@*\"String is equal to number\"\
    );\n```\n*From: CompareStrings.m*\n\nThe simplest and most obvious of comparing\
    \ strings for equality is to use the C comparison operator, `==`. Unfortunately,\
    \ this actually does work sometimes, which can lead to some subtle bugs. It will\
    \ test whether two objects are identical, rather than equal. It will test whether\
    \ they are the same object, not whether they are objects with equal values.\n\n\
    Comparing two pointers is much faster than comparing two strings, and even faster\
    \ than sending a message. In some cases, it may be faster to try a pointer comparison\
    \ first. The result of the pointer comparison is the knowledge that the two strings\
    \ are the same or that they might be the same. It won’t ever tell you that they\
    \ are definitely different. This can make code faster, if you are comparing identical\
    \ strings a lot, but is usually an example of *premature optimization*.\n\nIf\
    \ you want to test two strings for equality, you should use the `-isEqualToString:`\
    \ method.\n\nNote that this expects the argument to be another Objective-C string.\
    \ You can compare any two Objective-C objects by sending them `-isEqual:` messages,\
    \ but it is up to the receiver to decide which other objects it considers to be\
    \ equal.\n\nIn the sample at the start of this section, the compiler will typically\
    \ combine the constant strings, so that `twelve` and the literal `@*\"12\"` will\
    \ be the same object. This is not guaranteed, but there is no good reason for\
    \ the compiler not to do it.\n\nThe comparison between the string and the `NSNumber`\
    \ instance is more interesting. You’d expect this to compare the string to the\
    \ result of sending `-stringValue` to the number, but it doesn’t.\n\nThis is important,\
    \ because equality has to be commutative. If `[a isEqual: b]`, then a lot of code\
    \ will assume that `[b isEqual: a]`. This is especially true in collection classes.\
    \ If you insert two objects into an `NSMutableSet`, for example, where the equality\
    \ holds in one direction but not the other, then the result is undefined.\n\n\
    Often, when you want to compare strings—or, indeed, any objects—you want to find\
    \ out not just whether they are equal, but their ordering. This is where things\
    \ start to get a little complicated for strings. Given two numbers, there is a\
    \ single canonical ordering between them. For strings, there are several well-defined\
    \ strong orderings. Which order should “etoile,” “Étoilé,” and “Etoile” be arranged\
    \ in?\n\nIf you are doing a case-insensitive comparison, the first and last ones\
    \ will have equal rank. Whether accented letters come immediately before or after\
    \ their unaccented variants, or before or after all unaccented letters, depends\
    \ on your locale. When you have a list of files, the user might get irritated\
    \ if you sort “file10” before “file2,” even though that’s the dictionary order\
    \ of the two filenames.\n\nFor simple comparisons, based solely on the character\
    \ values, you can use the `-compare:` method. This, like all other comparison\
    \ results, returns an `NSComparisonResult`, an enumerated type with three possible\
    \ values: `NSOrderedAscending`, `NSOrderedSame`, and `NSOrderedDescending`. If\
    \ you are presenting data to the user, you should use `-localizedCompare:` instead.\
    \ This will return the ordering of the two strings according to the rules defined\
    \ for the user’s chosen language.\n\nBoth of these are wrappers around this general\
    \ comparison method:\n\n```objc\n- (NSComparisonResult)\ncompare:(NSString*)aString\n\
    options:(NSStringCompareOptions)mask\nrange:(NSRange)range\nlocale:(id)locale;\n\
    ```\n\nThis allows you to specify a set of options, such as `NSNumericSearch`\
    \ for sorting 10 after 9, and `NSCaseInsensitiveSearch` for ignoring case. Passing\
    \ a range as the third parameter allows you to restrict the comparison to a substring\
    \ in the receiver, and passing a locale lets you specify the ordering rules for\
    \ non-ASCII characters. It’s worth noting that normally passing nil as a locale\
    \ means either use the current locale or the *canonical locale*. In this case,\
    \ passing nil means use the canonical locale and perform numeric comparisons on\
    \ the character values.\n\n## Processing a String One Character at a Time\n\n\
    ```objc\nfor (NSUInteger i=0 ; i<[aString length] ; i++)\n{\n    unichar c = [aString\
    \ characterAtIndex: i];\n    // Process c\n}\n```\n*From: stringIterateSlow.m*\n\
    \nThe `NSString` class is a class cluster. It is an abstract class, and when you\
    \ create one you get an instance of some private subclass.\n\nTwo primitive methods\
    \ must be implemented by any `NSString` subclass: `-length` and `-characterAtIndex:`.\
    \ The first of these returns the length, and the second returns the character\
    \ at a specific index in the string.\n\nIf you need to do something with every\
    \ character in the string, you can iterate over it in a simple loop, calling this\
    \ method repeatedly. This is quite inefficient, because it requires a message\
    \ send for each character. This is significantly more expensive than accessing\
    \ characters in a C string. This version also sends a `-length` message for every\
    \ character, which is only required if the length might change during iteration.\n\
    \nOne alternative is to get a C string and work on that. You could, for example,\
    \ send a `-UTF8String` message to the string and then process the returned C string.\
    \ Although this sounds reasonable, remember that the string may be quite large\
    \ and may not be stored in UTF-8, so the object may need to convert its internal\
    \ representation to UTF-8, allocate memory to store it, and then have that memory\
    \ cleaned up by the autorelease pool (or the garbage collector) later.\n\nThe\
    \ most efficient way of accessing the characters in a string is `-getCharacters:range:`.\
    \ Methods in Objective-C that start with get usually take a pointer to some space\
    \ allocated by the caller and return the data in that. In this case, the first\
    \ argument is a pointer to a buffer of unichars, which must be big enough to store\
    \ the requested number of characters.\n\nThe next example uses this mechanism\
    \ to count the number of semicolons in the source file. First it loads the source\
    \ code into a string, then it gets the characters ten at a time. Note the double\
    \ loop structure. The outer loop gets blocks of characters and then the inner\
    \ loop iterates over the block. This same structure is generated by the compiler\
    \ when you use *fast enumeration* to iterate over a collection.\n\nThis requires\
    \ one message send for every ten characters. You can trade some more speed for\
    \ a bit more space by increasing the size of the buffer. Note that this buffer\
    \ is allocated on the stack. This is fast, but you should be\n\n```objc\nint semicolons\
    \ = 0;\nNSUInteger length = [str length];\nNSRange range = { 0, 10 };\nwhile (range.location\
    \ < length)\n{\n    // ... implementation\n}\n```\n"
