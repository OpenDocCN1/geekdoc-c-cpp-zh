    files effectively the same as directories in their ability to contain arbitrary
    numbers of children. NTFS has the same functionality.


    OS X still supports resource forks and will store the data in a hidden file on
    filesystems that do not support them, such as UFS and FAT, but their use is not
    recommended. Copying files that contain forks to other filesystems is a problem.


