- fmt: "\nYou can get a reference to this with `dispatch_get_main_queue()`. This queue\
    \ is used on OS X 10.6 to implement the run loop.\n\nThis queue is a FIFO queue,\
    \ and you may wish to create similar queues. A FIFO queue is similar to a lightweight\
    \ thread. It executes sequentially, one block at a time. The relationship between\
    \ threads and queues is variable. All of your queues may end up running concurrently\
    \ on separate threads, or all may be executed on a single OS thread, depending\
    \ on various factors.\n\nYou create a new FIFO queue by calling `dispatch_queue_create()`.\
    \ This is useful when you have a number of things that need to execute in a defined\
    \ order, but are largely independent of the rest of the program.\n\nThis helps\
    \ reduce the need for explicit synchronization.\n\nThe example at the start of\
    \ this chapter pushed **Creating Custom Work Queues** 271 three blocks that incremented\
    \ a counter and one that printed its final value into a new queue.\n\nThese blocks\
    \ are all related; executing them in the wrong order is a very bad idea. With\
    \ this approach, they all execute in a guaranteed order with respect to each other,\
    \ but not with regard to the rest of the program. This means that you don’t need\
    \ to put any lock around the counter variable, unless you plan on accessing it\
    \ from outside of the queue.\n\n![Image 17](index-289_1.png)\n\n# CHAPTER 16:\
    \ Notifications\n\n## Requesting Notifications\n\n```objective\n- (**void**)notify:\
    \ (NSNotification*)note\n{\n    NSLog(@ *\"Received %@\" , note);\n}\n\n- (**void**)registerListener\n\
    {\n    NSNotificationCenter *nc = [NSNotificationCenter defaultCenter];\n    [nc\
    \ addObserver:self\n                 selector:@selector(notify:)\n           \
    \          name: @ *\"Example\"*\n                  object: nil];\n}\n\n- (**void**)dealloc\n\
    {\n    NSNotificationCenter *nc = [NSNotificationCenter defaultCenter];\n    [nc\
    \ removeObserver:self];\n    [super dealloc];\n}\n```\n*From: notify.m*\n\nTo\
    \ listen for notifications, you need to register an interest for them with the\
    \ `NSNotificationCenter` object for your thread. This is the routing point for\
    \ notifications.\n\nWhen a notification is posted, it is sent to the notification\
    \ center and the notification center then forwards it to all of the interested\
    \ parties.\n\nMost of the time, you will be using the default notification center.\
    \ It is possible to create different notification centers for different uses,\
    \ but most commonly you will use the standard one. This is obtained by sending\
    \ a `+defaultCenter` message to `NSNotificationCenter`.\n\nTo register for a notification,\
    \ you then send an `-addObserver:selector:name:object:` message to the center.\
    \ Note the selector argument in this message. A single object may receive different\
    \ notifications on different methods. This is quite useful, because it means that\
    \ you don’t need to test what kind of notification you’ve received and can cleanly\
    \ separate out different event handlers into different methods.\n\nEither the\
    \ object or the notification name can be nil when registering an observer. This\
    \ lets you register either to receive all messages sent by a specific object,\
    \ or all notifications of a specific type, irrespective of their sender.\n\nThese\
    \ are more useful for debugging than anything else. You can, for example, write\
    \ a logging aspect that listens for all notifications of a particular type and\
    \ logs the sender.\n\nOne important thing to remember when you listen for a notification\
    \ is that the notification center does not retain your object. If your object\
    \ is still registered to receive notifications when it is destroyed, then your\
    \ program will crash the next time one of these notifications is sent.\n\nTo avoid\
    \ this, make sure that you send the notification center a `-removeObserver:` message\
    \ in your `-dealloc` method. If you forget this, the crash will not be obvious.\
    \ You will see a lot of strange things in the back trace, including the notification\
    \ center.\n\n## Sending Notifications\n\n```objective\nNSNotificationCenter *nc\
    \ = [NSNotificationCenter defaultCenter];\n[nc postNotificationName: @ *\"Example\"\
    *\n                      object: @ *\"sender\"*\n                     userInfo:\
    \ nil];\n```\n*From: notify.m*\n\nPosting notifications is even easier than registering\
    \ to listen for them. The canonical way of posting a notification object is to\
    \ construct an `NSNotification` object and then send it.\n\nIn practice, I don’t\
    \ think that I’ve ever seen code that does this. The notification center has some\
    \ convenience methods that construct and post notifications in a single operation.\n\
    \nThe most common way of sending a notification is the `-postNotificationName:object:userInfo:`\
    \ method. There is also a simplified version of this that omits the `userInfo:`\
    \ parameter and is equivalent to passing `nil` as the final parameter.\n\nNote\
    \ that the object—the sender of the notification—is specified as a parameter.\
    \ That means that it is possible to send notifications claiming to be from another\
    \ object. This means that, for example, C code can send notifications on behalf\
    \ of other objects.\n\n## Enqueuing Notifications\n\n```objective\nNSNotificationQueue\
    \ *nq = [NSNotificationQueue defaultQueue];\nNSNotification *note = [NSNotification\
    \ notificationWithName: @ *\"Example*\"\n                               object:\
    \ @ *\"sender\"*];\n[nq enqueueNotification: note postingStyle: NSPostWhenIdle];\n\
    [[NSRunLoop currentLoop] run];\n```\n*From: notify.m*\n\nSometimes, your code\
    \ might be generating a lot of notifications, or be generating ones that do not\
    \ need to be handled immediately. The `NSNotificationQueue` class solves both\
    \ of these problems.\n\nNotification queues can both defer delivery of notifications\
    \ and can coalesce them. Unlike `NSNotificationCenter`, the queue does not have\
    \ convenience methods for constructing the notifications, you must do this yourself.\
    \ The notification is then posted with one of three posting styles.\n\nIn this\
    \ example, the notification’s delivery is deferred until there are no other events\
    \ in the run loop. Timers and data becoming ready on file descriptors take priority.\
    \ Alternatively, you can post in the next run loop iteration or immediately.\n\
    \nIf you send a lot of notifications of the same type then it is a good idea to\
    \ cache the notification object. Passing the same object to the notification queue\
    \ repeatedly is quite cheap, and it can automatically send the notification just\
    \ once.\n\nIf you use the longer method for queuing notifications, one of the\
    \ parameters is `coalesceMask`, which determines how notifications should be combined.\
    \ You can combine notifications with the same name, notifications with the same\
    \ sender, or both.\n\nCoalescing is most useful with the `NSPostWhenIdle` posting\
    \ style. You can send the same notification a lot of times when your code is busy\
    \ and then, when there are no other events left to handle, the notification queue\
    \ will post just one copy of the notification. This is ideal for bits of code\
    \ that trigger some low-priority book-keeping work.\n\n## Sending Notifications\
    \ Between Applications\n\n```objective\n[c addObserver:self\n         selector:@selector(newCopyStarted:)\n\
    \             name:ProcessDidStart\n            object:nil\nsuspensionBehavior:NSNotificationSuspensionBehaviorHold];\n\
    ```\n*From: distributedNotify.m*\n\nThe loose coupling provided by notifications\
    \ is so useful that it is extended within the Foundation framework to provide\
    \ a (simple) mechanism for communication between applications. The `NSDistributedNotificationCenter`\
    \ class is a subclass of `NSNotificationCenter` that broadcasts notifications\
    \ to other applications.\n"
