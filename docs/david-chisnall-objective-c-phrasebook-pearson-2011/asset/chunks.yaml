    The design pattern that defines the structure


    **Using Run Loops**


    97


    of most nontrivial Objective-C programs is the *run loop*. A run loop, in the
    general case, waits for data from one or more event sources, and then executes
    code in response to them, giving an *event driven programming* model.


    The Foundation framework provides a run loop implementation in the NSRunLoop class.
    If you are writing an application, you will typically get an instance of this
    created for you automatically.


    You may also create one explicitly in command-line tools.


    The main run loop in an application listens for events from the window server,
    corresponding to keypresses, mouse movements, touch events, and so on. Various
    other classes add event sources to the run loop implicitly. The NSTimer class,
    which we’ll look at in Chapter 8, adds a timer event source to the run loop, for
    example, allowing you to perform some action at a specific time.


    The notification mechanism, covered in Chapter 16, lets you deliver notifications
    of arbitrary events within your program via the run loop, and you can also register
    for notifications of activity on file descriptors with NSFileHandle.


    The run loop itself is related to memory management. Each run loop iteration has
    its own autorelease pool. This means that objects that are sent an -autorelease
    message during a run loop iteration will be destroyed (unless retained elsewhere)
    at the end of the iteration.


    98


    CHAPTER 4: **Common Objective-C Patterns** Because of this, and the fact that
    the run loop is used for delivering events from user input, it is a good idea
    to keep the amount of work done in a single run loop iteration as small as possible.


    In most programs, you won’t need to interact with the run loop directly. It sits
    in the background, while other classes provide a more convenient interface.


