    Environment variables can be accessed in three ways on OS X. Two of them will
    work anywhere, whereas the third will only work on some platforms.


    OS X, like Windows and a lot of UNIX systems, passes the environment into processes
    as a third argument to the main() function. This is a NULL-terminated C array
    of C strings. The C


    **Getting Environment Variables** 187


    and POSIX standards don’t require this third argument to work, so it’s a bad idea
    to rely on it in portable code.


    When a program starts, the run time loader will load all required shared libraries
    and then jump to a special function in the C standard library, typically called
    _start. This then calls main(), but before it does it stores a pointer to the
    environment variables.


    You can access this storage by calling the getenv() C standard function. Alternatively,
    you can access environment variables by sending an -environment message to the
    singleton process info object. This returns a dictionary containing the environment.


    **Note:**


    There is no way of setting environment variables using Objective-C code. Modifying
    the environment is typically done in C code as a preliminary to calling one of
    the exec() family of functions. This only works on UNIX-like platforms and not,
    for example, on Windows or Symbian systems. Therefore, it is discouraged. You
    can set a new dictionary that will be used as the environment of a new child process
    by sending a -setEnvironment: message to NSTask.


