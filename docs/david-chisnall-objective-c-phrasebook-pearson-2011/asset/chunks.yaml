    With KVC, you can use *key paths*. These are simple strings containing key names,
    separated by dots. If you want to access a property of a property of an object,
    then you can do so in a single operation using key paths.


    **Note:**


    The dot notation for accessing declared properties looks very similar to the KVC
    notation, and it’s very easy to confuse the two. This is unfortunate, because
    they are entirely unrelated.


    The dot notation generates message sends to accessor methods directly. The KVC
    methods taking key paths are a higher-level abstraction.


    This is one of the reasons why the dot notation is widely disliked.


    The similarity is, unfortunately, intentional. Before the public release, Apple
    employees were referring to declared properties using the KVC terminology, and
    the two were probably meant to be more closely related.


    The big advantage of key paths is that a generic view object, for example, only
    needs to store one pointer to the model object. It doesn’t need pointers to various
    components inside the model, it can access these via key paths.


    For example, if you had a view for displaying information about a person, you
    could join copies in a family tree using the @ *"father"* and


    @ *"mother"* key paths. You could then use the same view in something displaying
    grandparent


