  trans: "\n\n每个集合类都有不同的通过块（block）进行枚举的方法方法。数组的版本接收对象的索引作为参数，字典的版本同时接收键（key）和值（value），以此此类推。这些方法会比其他替代方案慢，因为它们需要为每个对象调用一次块（这与调用函数的开销相同），但它们可能变得更加方便。\n\
    \n在某些情况下，你可以完全避免枚举。例如，`NSArray` 实现了一个 `-makeObjectsPerformSelector` 方法，以及另一个接收对象作为第二个参数的版本。如果你在枚举时所做的只是向每个对象发送消息，那么你可以使用这些方法来代替创建循环。\n\
    \n# 在集合中查找对象\n\n```objc\nNSArray *array = [NSArray arrayWithObjects: 7\n@\"a\"\
    * , @*\"group\"* , @*\"of\"* , 8\n@\"string\"* , @*\"objects\"* , nil];\nNSSet\
    \ *set = [NSSet setWithArray: array];\nNSUInteger i = [array indexOfObjectIdenticalTo:\
    \ @\"group\"* ];\nif (NSNotFound == i)\n    i = [array indexOfObject: @\"group\"\
    * ];\nNSString *original = [set member: @\"string\"* ];\n```\n`NSArray` 和 `NSSet`\
    \ 都实现了 `-containsObject:` 方法，如果集合包含一个与参数相等的对象，该方法将返回 `YES`。这使用了我们之前在集合类中介绍过的等等性概念：如果向一个对象发送以另一个对象为参数的\
    \ `-isEqual:` 消息并返回 `YES`，则认为这两个对象是等等的。\n\n在数组中，你可能想知道对象的确切位置，而不仅仅是它是否存在。有两个方法可以告诉你这一点：`-indexOfObject:`\
    \ 和 `-indexOfObjectIdenticalTo:`。后者使用指针比较来确定等等性。\n\n这些方法在数组中都是慢的。它们都都需要线性搜索，而且大多数方法都需要向每个对象发送消息。通常情况下，你只应该在小型数组或不频繁调用的代码路径中使用它们。如果你需要频繁执行这种反向映射，最好使用字典或类似结构来存储这种反向关系。\n\
    \n对于集合（sets），性能情况有所不同。由于集合根据哈希值（hash）将对象存储在桶（buckets）中，集合可以快速排除许多不同的对象。\n\n显然，由于集合是无序的，因此没有查找对象索引的集合方法。然而，有一个方法可以查找与某个对象相等的存储对象。\n\
    \n`NSSet` 上的 `-member:` 方法返回与参数相等的存储对象。这对于确保对象的唯一性非常有用。\n\n`unique.m` 示例显示了一个从\
    \ C 字符串构造唯一常量字符串对象的方法。如果你两次向此方法传递同一个 C 字符串，你将每次都获得返回相同的 `NSString` 实例。\n\n注意，此函数不是线程安全的。在测试字符串是否在集合中以及在它不在时添加新字符串之间，存在一个潜在的竞态条件。该方法的线程安全版本需要你在调用\
    \ `-member:` 后获取锁，再次发送此消息，最后在添加新对象后释放锁。\n\n如果你正在创建一个新的不可变类，你可能希望在你的构造函数中实现类似的内容。这将在构造时牺牲一些速度来换取内存使用，但这意味着你始终可以使用指针比较来确定等等性，这在某些情况下整体上可能是一个巨大的速度优势。\n\
    \n```objc\nstatic NSMutableSet *unique_strings;\n\nNSString *uniqueString(const\
    \ char** *str)\n{\n    NSString *new = [[NSString alloc] initWithUTF8String: str];\n\
    \    NSString *old = [unique_strings member: new];\n    if (nil != old)\n    {\n\
    \        [new release];\n        return old;\n    }\n    [unique_strings addObject:\
    \ new];\n    return new;\n}\n```\n*来自: unique.m*\n\n# 集合的类化\n\n所有的标准集合都是*类簇（class\
    \ clusters）。这意味着为它们创建一个新的子类并非易事。父类是抽象的，而具体的子类是私有的（所以你不能对其进行类化）。\n\n每个集合文档都说明了你必须在子类中实现的方法。这样做最简单的方法是通过委托：只需让一个与你正在类化的集合类型相同的对象作为实例变量。`typedArray.m`\
    \ 示例使用了这种方法。\n\n`TypedArray` 类是 `NSMutableArray` 的子类。该类中的实例变量 `realArray` 是 `NSMutableArray`。它在类的指定初始化器中创建，就像任何其他创建\
    \ `NSMutableArray` 的代码一样，它实际上会得到该类的一个具体子类的实例。另一个实例变量是 `Class` 类型。\n\n```objc\n\
    - (NSUInteger)count\n{\n    return [realArray count];\n}\n\n- (id)objectAtIndex:\
    \ (NSUInteger)anIndex\n{\n    return [realArray objectAtIndex: anIndex];\n}\n\
    ```\n*来自: checkedArray.m*\n\n与是异构的标准数组类不同，这个版本要求你插入的每个对象都必须是传递给初始化器的类的实例（或其子类）。如果你尝试插入其他对象，此版本将静默失败，但你可以轻松地修改为抛出异常。\n\
    \n该类中的许多方法是简单易懂的。例如，`-removeObjectAtIndex:` 方法只是向封装的数组传递相同的消息。其他方法，例如 `-insertObject:atIndex:`，则会进行类型检查，然后调用实际数组。\n\
    \n此示例实现了 `NSMutableArray` 中的所有原始方法。这意味着在 `NSArray` 或 `NSMutableArray` 上声明的所有其他方法都能正常工作。\n\
    \n```objc\n- (id)initWithType:(Class)aClass\n{\n    if (nil == [super init])\n\
    \    {\n        return nil;\n    }\n    type = aClass;\n    realArray = [NSMutableArray\
    \ new];\n    return self;\n}\n\n- (void)insertObject:(id)anObject atIndex:(NSUInteger)anIndex\n\
    {\n    if (![anObject isKindOfClass: type])\n    {\n        return;\n    }\n \
    \   [realArray insertObject: anObject atIndex: anIndex];\n}\n\n- (void)removeObjectAtIndex:(NSUInteger)idx\n\
    {\n    [realArray removeObjectAtIndex: idx];\n}\n\n- (void)dealloc\n{\n    [realArray\
    \ release];\n    [super dealloc];\n}\n```\n*来自: checkedArray.m*\n\n**注意：** 在 C++\
    \ 中，原始方法是父类中的纯虚方法，编译器会阻止你直接实例化父类，或实例化任何没有实现这些方法的子类。在 Objective-C 中没有相应的机制。\n\n\
    类化的另一个更常见的原因是你想为底层表示实现一个不同的数据结构。例如，如果你将从数组的一一端插入对象，然后从另一端移除它们，你可能想使用一个可调整大小的环形缓冲区（resizable\
    \ ring buffer）作为你的数组实现。\n\n如果是这种情况，你仍然应该重写相同的方法，但这次要用你自己的存储机制实现来替换它们。然后你可以在任何可以使用父类的地方使用你的子类——包括将其传递给其他库——但将使用你自己的存储。\n\
    \n"
- fmt: '

    absolute times. The definition of an absolute time is quite difficult. Things
    such as time zones and even different calendars make it relatively difficult to
    define an absolute time. Much of the code related to times and dates in the `Foundation`
    framework is designed to solve this problem.


    ### Finding the Current Date


    ```

    NSDate *now = [NSDate date];

    now = [NSDate dateWithTimeIntervalSince1970: time(NULL)];

    ```

    *From: `date.m`*


    The `NSDate` class encapsulates an absolute time value. This is stored as two
    components. One is a well-defined fixed point: the epoch date. The other is a
    time interval since that epoch.


    Two standard epoch dates are supported by `NSDate`, both defined in terms of the
    Gregorian calendar. One is the UNIX Epoch, the first of January, 1970\. This epoch
    date was defined with the first `UNIX` systems and was later incorporated into
    the `ISO C` standard. The C `time()` function will return the number of seconds
    since that date.


    The other Epoch time was defined as part of the OpenStep specification, and is
    referred to as the `reference date`. This one is a little bit less arbitrary;
    it is the start of the current millennium: the first day of 2001.


    Part of the point of `NSDate` is to free you from having to know which reference
    date you are using. You can compare two dates using `-compare:` or any of the
    related methods irrespective of what epoch they are using internally.


    If you create a new date with `+alloc/-init` or with `+date`, it will be set to
    the current time. Dates are mutable objects, but it’s generally better to treat
    them as if they are not.


    There is only one method for modifying dates:


    - `-addTimeInterval:`. This is deprecated in `OS X 10.6` and can cause problems
    in older code, because a lot of people tend to forget that it’s possible to modify
    dates and just retain them, rather than copying them.


    CHAPTER 8: Dates and Times


    ### Converting Dates for Display


    ```

    NSDate *now = [NSDate date];

    NSCalendar *cal = [NSCalendar currentCalendar];

    unsigned int components = NSYearCalendarUnit;

    NSInteger year = [[cal components: components fromDate: now] year];

    NSString *date = [NSDateFormatter localizedStringFromDate: now dateStyle: NSDateFormatterLongStyle
    timeStyle: NSDateFormatterNoStyle];

    ```

    *From: `calendar.m`*


    An `NSDate` stores an absolute time, but your users would probably object if you
    presented them with the number of seconds since `1970-01-01` or `2001-01-01\.
    Unless, of course, your target market is robots.


    Most of the western world standardized on the Gregorian calendar at some point
    over the last few hundred years. The earliest adopters, who presumably got to
    experience all of the bugs, included Spain, Portugal, and Italy in 1582\. The
    most recent was China, in 1929.


    This causes some significant problems for localization. If you have a date that
    represents the 120 years before the UNIX epoch, how do you display it? It would
    be the first of January, 1850 in the Gregorian calendar, but what happens if your
    user’s locale is a country that didn’t adopt the Gregorian calendar until after
    this date?


    A concrete example of this is the October Revolution in Russia, which took place
    on the seventh of November, 1917\. If you present this date to Russian users,
    it will be incorrect, because Russia was still using the Julian calendar at this
    point, which is why they call something that happened in November the October
    Revolution.


    Other locales may not use the Gregorian calendar at all. Most people who own computers
    probably have some experience with the Gregorian calendar, but forcing your users
    to perform the conversion themselves is not a good idea.


    **Note:**


    The `NSCalendarDate` was the older OpenStep way of representing dates for display.
    This class is now deprecated. Unlike an `NSDate`, which stored an abstract time,
    `NSCalendarDate` stored a date in the Gregorian calendar.


    You might need to use one of two classes when converting a date for display. If
    you need to get the individual components of the date in a particular calendar,
    you need to use the `NSCalendar` class. If you want to generate a string value,
    you should use `NSDateFormatter` instead.


    The `NSCalendar` class encapsulates a calendar, a way of mapping between absolute
    times and segmented time periods containing numbered years, months, and so on.
    You use this class to create an `NSDateComponents` object from an `NSDate`. The
    `NSDateComponents` object encapsulates the components of a date with respect to
    a particular calendar.


    The date components object does not store the calendar that it is relative to,
    and so there is no defined way of comparing two date components objects. This
    is intentional. If you are comparing dates, you should compare absolute times
    using `NSDate` objects and only localize them for display. This is a significant
    change from `NSCalendarDate`, which was a subclass of `NSDate`, so did define
    comparisons.


    If you have a date components object, you can then construct a date for display
    using `NSString`’s `+stringWithFormat:`. This is a bad idea. If you generate a
    date such as `1/2/2012`, people in the USA, who use middle-endian format dates,
    will interpret this as the second of January


    The `NSDateFormatter` class solves this problem for you. It has a convenient class
    method `+localizedStringFromDate:dateStyle:timeStyle:` that returns a string containing
    the localized date and time. The second and third arguments describe the level
    of detail required for the date and time, respectively. This can range from not
    displaying anything, through a very terse description, to a long description with
    the month name written out.


    ### Calculating Elapsed Time


    ```

    NSDate *start = [NSDate date];

    sleep(1);

    NSTimeInterval elapsed = 0 - [start timeIntervalSinceNow];

    ```

    *From: `elapsed.m`*


    You can find the difference between two date objects by sending one `-timeIntervalSince:`
    message with the other as the argument. Alternatively, to find how long ago a
    date was, you can send it `-timeIntervalSinceNow` message. This will give a negative
    number if the date is in the past, so to find how much time has elapsed since
    a date was created with `+date` or `+new`, you should subtract this value from
    zero.


    This is not the fastest way of calculating the elapsed time. The `gettimeofday()`
    system call will return the system time in a structure. This avoids the cost of
    creating an object and of sending the message, but it’s a bit more work because
    you need to handle the structure yourself. This structure stores the number of
    seconds and microseconds in separate fields, so the subtraction is more effort
    than just comparing two scalar values.


    ### Parsing Dates from Strings


