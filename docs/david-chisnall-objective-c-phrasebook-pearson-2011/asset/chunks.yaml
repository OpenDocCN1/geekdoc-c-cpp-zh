  trans: '

    正如我们在上一节中看到的，解析命令行参数的最简单方法是使用 `NSUserDefaults` 中的 `NSArgumentDomain`。


    当一个 Objective-C 程序启动时，所有的命令行参数都会读取并插入到一个字典中，该字典由默认系统（defaults system）使用。


    这使得提供一组命令行参数以及一组（可配置的）默认值变得非常简单。在使用这种方法时，你永远不会直接与参数交互。相反，你向默认系统请求某个键的值，它会返回一个可能来自持久化存储位置，也可能来自命令行的内容。


    在 `EtoileFoundation` 框架中，我们提供了一个 `ETGetOptionsDictionary()` 函数，它封装了标准的 `getopt()`
    函数。这提供了一种用 Objective-C 方式来使用 UNIX 风格的命令行参数。如果你正在用 Objective-C 编写 UNIX 风格的工具，可以使用它。否则，最好使用默认系统。


    # 第 10 章：环境


    ## 访问用户的本地区域设置


    ```objective-c

    NSLocale *l = [NSLocale autoupdatingCurrentLocale];

    NSString *language = [l objectForKey: NSLocaleIdentifier];

    NSString *humanReadableLanguage = [l displayNameForKey: NSLocaleIdentifier value:
    language];

    ```

    *来自：locale.m*


    如果你的程序以任何方式与用户直接交互，你可能在某个时刻想要对其进行本地化。Objective-C 提供了许多丰富的设施来实现这一点。


    `NSLocale` 对象封装了一个本地区域设置。获取该类实例有多种种方法。如果你向它发送 `+systemLocale` 消息，你将获得系统的区域设置。


    然而，这通常不是你应该使用的。它是当用户的本地区域设置无法正常工作时的回退区域设置。


    你可以通过两种方式获取用户当前的本地区域设置。发送 `+currentLocale` 消息会返回一个封装了当前本地设置的 locale 对象。如果用户选择了新的本地设置，系统会发布
    `NSCurrentLocaleDidChangeNotification`，你可以为新的本地设置获取一个新的 locale 对象。


    或者，你可以向该类发送 `+autoupdatingCurrentLocale` 消息。这返回一个始终代表当前本地设置的 locale 对象，即使它发生了变化也是如此。这可能会稍微引起困惑，因为对该对象使用相同的参数连续调用两次方法可能会返回不同的值。


    如果你希望支持在程序运行时更改本地区域设置，那么避免缓存从 locale 对象返回的数据是非常重要的。如果你向用户展示保留在屏幕上的内容，你应该确保监控了这些通知并更新了它们，即使你使用的是自动更新的
    locale 对象。


    ## 支持突然终止


    ```objective-c

    NSProcessInfo *p = [NSProcessInfo processInfo];

    [p enableSuddenTermination];

    // 执行初始化

    [p disableSuddenTermination];

    // 执行其他不能在此处

    // 中断的操作

    modifyFiles();

    [p enableSuddenTermination];

    ```

    *来自：suddenDeath.m*


    传统上，进程终止有两种选项。进程可以以优雅的方式退出，即到达一个安全的停止点然后调用 `exit()`，或者到达 `main()` 函数中的 `return`
    语句。或者，它可以突然退出，即通过接收一个未处理的信号，包括类似段错误（segmentation fault）的信号。


    在这两种情况下，内核都会收回它的所有共享资源，但在突然终止的情况下，这些资源中的某些可能处于处于不一致的状态。一个典型的例子是正在修改中的文件。


    这在过去是复杂应用程序（如文字处理器）中的一个大问题。它们会打开文件进行写入，开始修改，然后崩溃，导致文件处于一种很难恢复内容的状态。


    你可以通过使用大多数 Foundation 对象上的原子写入设施来避免这一点，这些设施会将内容写入临时文件然后将其重命名，因此写入操作要么完全成功，要么完全失败——甚至不会部分成功。


    从 OS X 10.6 开始，Apple 引入了突然终止（sudden termination）机制。背后的理论是，许多程序在退出时花费大量时间运行对象的析构函数，而这些对象除了释放操作系统将要收回的内存外没有其他影响。通过突然终止，进程可以声明自己没有任何未保存的数据。这样操作系统就可以自由地直接杀死它，而不是请求它优雅退出。


    这对于长时间空闲的久运行后台任务特别有用。它们通常会被内核交换到磁盘中。当你要求它们优雅退出时，需要将大量的代码和数据调入内存来处理退出。使用突然终止，交换文件中的页面只需被标记为可重用。


    在你的应用程序中支持突然终止非常简单。你可以在 `NSProcessInfo` 上调用两个方法，分别在不能中断的操作的两侧调用。


    **注意：** 如果你配合 `NSDocument` 基础设施使用 `AppKit`，则什么都不需要做。当任何文档有未保存的数据时，你的应用程序将被标记为不支持突然终止。


    这些方法被称为 `-disableSuddenTermination` 和 `-enableSuddenTermination`，但名称略有误导性。它们并没有实际上地启用和禁用突然终止，而是修改一个计数器。当计数器达到
    0 时，应用程序会被标记为可杀死的。


    这意味着你可以在不同线程中使用它们或在产生任何问题的情况下进行嵌套。计数器初始设置为一，因此你必须显式地向 process info 对象发送 `-enableSuddenTermination`
    消息来启用它。如果你正在创建一个应用程序，可以通过在应用程序包的属性列表（property list）中设置键来避免这一点。


    与命令行工具不同，Cocoa 应用程序通常以包（bundles）的形式分发。这些是在图形文件管理器中视为文件的目录。NeXT 曾非常有效地利用它们存储不同操作系统的二进制文件，使得一个文件可以包含
    OPENSTEP、Solaris 甚至 Windows 的应用程序。该包包含的内容之一是一个名为 `info.plist` 的属性列表，它描述了应用程序的一些属性，例如类、启动时加载的资源等。突然终止状态就是这些属性之一。


    # 第 11 章：键值编码 (KVC)


    ## 通过键访问值


    ```objective-c

    [object setValue: @"42" forKey: @"integer"];

    int value = [[object valueForKey: @"integer"] intValue];

    NSCAssert(value == 42, @"值设置并检索成功");

    ```

    *来自：kvc.m*


    通过 KVC 操控的对象看起来非常像字典。`NSDictionary` 类本身也是符合 KVC 标准的，尽管在使用它时通常并不使用 KVC 方法。


    与符合 KVC 标准的对象交互的最常用方法是 `-valueForKey:` 和 `-setValue:forKey:`。`NSDictionary` 的
    `-objectForKey:` 方法在检索值时的行为几乎相同。两个设置方法在 `NSDictionary` 中略有不同。


    你首先会注意到，如果你在不可变字典上使用 `-setObject:forKey:`，会得到编译警告。如果你使用


    一个键或键路径并且有


    '
- fmt: "\nuse `-setValue:forKey:`. This method is implemented by `NSObject`. It will\
    \ fail at run time when you call it on an immutable dictionary, but there will\
    \ be no hint of this at compile time.\n\nThe other big difference is the use of\
    \ `nil`. If you use `nil` as the value with `-setValue:forKey:`, it will delete\
    \ that key. If you do the same for `-setObject:forKey:`, you get an exception.\n\
    \n## Ensuring KVC Compliance\n\n```objc\n@interface KeyPublic : NSObject\n@end\n\
    \n@implementation KeyPublic\n@end\n\n@interface KeyIVar : KeyPublic\n{\n    int\
    \ integer;\n}\n@end\n\n@implementation KeyIVar\n@end\n```\nFrom: kvc.m\n\nWhen\
    \ you use the KVC methods, you almost always call the implementations in `NSObject`.\
    \ These then try to work out how the property should really be accessed.\n\nThe\
    \ first place they will look is at accessor methods. By convention, Objective-C\
    \ classes provide `-property` and `-setProperty:` methods for reading and setting\
    \ the “property.” If your class provides these, they will be called. KVC will\
    \ also look for a few other methods, including things such as `-isProperty` for\
    \ a Boolean property.\n\n```objc\n@interface KeyAccessor : KeyIVar\n@end\n\n@implementation\
    \ KeyAccessor\n- (int)integer\n{\n    return integer;\n}\n- (void)setInteger:(int)aValue\n\
    {\n    integer = aValue;\n}\n@end\n\n@interface KeyProperty : KeyPublic\n@property\
    \ int integer;\n@end\n\n@implementation KeyProperty\n@synthesize integer;\n@end\n\
    ```\nFrom: kvc.m\n\nIf this fails, the class will be sent an `+accessInstanceVariablesDirectly`\
    \ message. If this returns `YES`, the KVC methods will look for an instance variable\
    \ that matches the name of the property and use that. The implementation of this\
    \ method in `NSObject` does return `YES`, so you only need to override it if you\
    \ want to prevent KVC from looking at instance variables.\n\nFinally, if this\
    \ fails, the KVC code will call one of two fallback methods, depending on whether\
    \ you are setting or getting the property. These are `-valueForUndefinedKey:`\
    \ and `-setValue:forUndefinedKey:`.\n\n```objc\n@interface KeyFallback : KeyPublic\n\
    {\n    NSMutableDictionary *dict;\n}\n@end\n\n@implementation KeyFallback\n- (id)valueForUndefinedKey:(NSString*)aKey\n\
    {\n    return [dict valueForKey: aKey];\n}\n- (void)setValue:(id)aValue\nforUndefinedKey:(NSString*)aKey\n\
    {\n    [dict setValue: aValue forKey: aKey];\n}\n@end\n```\nFrom: kvc.m\n\nThese\
    \ methods are the last chance to support KVC. If you implement them, you should\
    \ call the superclass implementation for all keys you don’t support directly.\
    \ This will throw an exception if called on the root class, indicating that you\
    \ don’t properly handle the key.\n\nIf you use declared properties to synthesize\
    \ accessor methods, you will get KVC compliance for free. The `kvc.m` example\
    \ shows all of the different ways in which you can implement the same KVC property.\
    \ This example uses one public class and a number of private subclasses that all\
    \ support the property. You can use instances of all of these classes interchangeably,\
    \ at least when it comes to storing that key. More importantly, you can use something\
    \ like the `KeyIVar` or `KeyFallback` class for prototyping and then switch to\
    \ something else later.\n\nThe fallback method is especially useful when prototyping.\
    \ When you start working, create a private dictionary instance variable and access\
    \ all of the properties on the object via KVC. Once you’ve determined the properties\
    \ your class really needs, you can replace the fallback implementation with a\
    \ set of accessors and, as a separate step, replace the KVC calls with direct\
    \ message sends.\n\nOne thing that you might have noticed about this example is\
    \ that KVC only deals with objects, but the instance variable is an `int`. Somehow,\
    \ this still works. This is because KVC performs *auto-boxing*. We set this property\
    \ by passing `@\"12\"` as an argument to `-setValue:forKey:`. The KVC code sent\
    \ an `-intValue` message to the string object, after finding that the property\
    \ was an integer.\n\nIn the other direction, it constructed an `NSNumber` encapsulating\
    \ the primitive value. If the instance variable or accessor methods use object\
    \ types, this code is bypassed. Note that KVC only accesses the runtime type information\
    \ and all object types are encoded as `\"@\"` in type encodings. This means you\
    \ can use KVC to set an `NSString` instance as the value for an instance variable\
    \ declared as an `NSArray`. KVC won’t generate any errors when you try this, and\
    \ neither will the compiler. The receiver, however, will get an exception the\
    \ next time it sends a message such as `-objectAtIndex:` to the string.\n\nIf\
    \ you are writing KVC accessors for object types, you might want to add an assert\
    \ statement checks whether the object has a compatible class.\n\n## Understanding\
    \ Key Paths\n\nSo far, we’ve looked at getting and setting values for an individual\
    \ key. This is quite useful, but it doesn’t quite demonstrate the full flexibility\
    \ of KVC. Most of what we’ve used KVC for could be done quite easily without KVC.\
    \ If you want one object to access a particular property of another object, and\
    \ don’t want to hard code it, you could just store a selector and use the normal\
    \ Objective-C message-sending mechanism to call it.\n\nThis works fine if the\
    \ property is stored on that object, but what happens if you want an indirect\
    \ property? You could store an array of selectors, and use each one to get the\
    \ intermediate object, but that is cumbersome.\n\nWith KVC, you can use *key paths*.\
    \ These are simple strings containing key names, separated by dots. If you want\
    \ to access a property of a property of an object, then you can do so in a single\
    \ operation using key paths.\n\nNote: The dot notation for accessing declared\
    \ properties looks very similar to the KVC notation, and it’s very easy to confuse\
    \ the two. This is unfortunate, because they are entirely unrelated. The dot notation\
    \ generates message sends to accessor methods directly. The KVC methods taking\
    \ key paths are a higher-level abstraction. This is one of the reasons why dot\
    \ notation is widely disliked. The similarity is, unfortunately, intentional.\
    \ Before the public release, Apple employees were referring to declared properties\
    \ using the KVC terminology, and the two were probably meant to be closely related.\n\
    \nThe big advantage of key paths is that a generic view object, for example, only\
    \ needs to store one pointer to the model object. It doesn’t need pointers to\
    \ various components inside the model, it can access these via key paths. For\
    \ example, if you had a view for displaying information about a person, you could\
    \ join copies in a family tree using the `@\"father\"` and `@\"mother\"` key paths.\
    \ You could then use the same view in something displaying grandparent relations\
    \ with the `@\"father.mother\"` key path, and so on.\n\nKey paths are used a lot\
    \ with *Cocoa bindings*. These are generic controller classes that connect models\
    \ to views.\n\n```objc\n+ (void)observeValueForKeyPath:(NSString*)keyPath\nofObject:(id)object\n\
    change:(NSDictionary*)change\ncontext:(void*)context\n{\n    NSLog(@\"%@.%@ is\
    \ now %@\", object, keyPath, [change objectForKey: NSKeyValueChangeNewKey]);\n\
    }\n\n+ (void)watchChange\n{\n    NSMutableDictionary *dict = [NSMutableDictionary\
    \ new];\n    [dict addObserver:self\n             forKeyPath:@\"aKey\"\n     \
    \          options:NSKeyValueObservingOptionNew\n                context:NULL];\n\
    \n    [dict setObject:@\"set as object\" forKey:@\"aKey\"];\n\n    [dict removeObserver:self\
    \ forKeyPath:@\"aKey\"];\n}\n```\nFrom: kvo.m\n"
