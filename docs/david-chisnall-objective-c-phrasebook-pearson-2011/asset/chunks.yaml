    Often, you need some parts of your program’s state to persist for longer than
    a single invocation. You can store some pure-data object types in *property lists*,
    as we’ll see in Chapter 7, but what about storing arbitrary objects?


    You can write data out in some custom (or public) format and then re-create the
    objects from this. Defining new file formats just because you want a few objects
    to persist is a bit more


    **Archiving Objects** 81


    effort than most programmers want to exert, however.


    Fortunately, Foundation provides the answer in the NSCoding protocol. This defines
    two methods: -initWithCoder: and


    -encodeWithCoder:. A lot of the standard classes implement this protocol, and
    it’s relatively easy to implement yourself.


    The object passed as an argument to these methods is a coder. This is a class
    that encapsulates some data representation. On older systems, this was typically
    NSArchiver, but on newer ones it will usually be NSKeyedArchiver.


    The older NSArchiver interface just let you write a stream of (typed) values.
    Keyed archives, however, support storing something more like a dictionary. They
    let you store key-value pairs and then read them back in a different order.


    There are two parts to supporting archiving.


    Your object must be able to write itself to an archive, and it must be able to
    read itself back.


