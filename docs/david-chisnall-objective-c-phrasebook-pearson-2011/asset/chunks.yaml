- fmt: '

    You can use them without Foundation, but only if you implement something equivalent.


    ## The History of Objective-C


    The term “object oriented” was coined by Alan Kay in the 1960s, and Smalltalk
    was the language that he and others created to demonstrate this style of programming.
    Smalltalk was developed during the 1970s, with the most widespread version being
    released in 1980.


    Smalltalk, however, was very slow. To run it properly, you needed a powerful computer
    such as the Xerox Alto, with 512KB of RAM and ideally at least a `2MHz` processor.


    Brad Cox liked the idea of Smalltalk, but wanted a language that he could use
    on computers that people could afford. His idea was to marry Smalltalk, a high-level
    language encouraging encapsulation, loose coupling, and code reuse, with C. C
    was right at the other end of the spectrum, with little by way of encapsulation,
    no dynamic dispatch, but with one big advantage: It was fast.


    C was based heavily on the PDP-11 instruction set. A very naive C compiler could
    produce quite fast code. This is true even today. Compilers such as `LLVM`, `XLC`,
    and `ICC` put a lot of effort into optimization, but `PCC`, which does almost
    none, still produces reasonably fast code.


    Brad Cox and Tom Love set up StepStone in 1986, selling a product based on Brad’s
    earlier Object Oriented Precompiler. This product, Objective-C, was a preprocessor
    and a small `Objective-C runtime library`. The preprocessor generated C code that
    you could compile with your platform’s C compiler. As recently as 2010, I came
    across a company still using the StepStone compiler in a commercial product.


    In 1988, NeXT bought a license to StepStone’s code and bought the Objective-C
    trademark outright. NeXT then rewrote the preprocessor as a front end to the `GNU
    Compiler Collection` (`GCC`). After some legal wrangling, the Free Software Foundation
    forced them to to release this code, but they kept the runtime library private.


    The GNU project then wrote a replacement for the runtime library, but made some
    changes.


    One was that selectors in the GNU runtime had a type associated with them. On
    NeXT (and Apple) platforms, selectors are just strings.


    This means that the GNU runtime can catch, at run time, some stack corruption
    caused by programmer errors that are invisible to the NeXT runtime.


    The other change was in how message sending works. When you send a message with
    the NeXT runtime, the compiler turns the message send into a call to the `objc_msgSend()`
    function. This looks up the method and then calls it.


    Unfortunately, it is not possible to implement this function in C. It has to be
    written in assembly for every platform and for every calling convention on that
    platform. The GNU solution was to replace this with a `objc_msg_lookup()` function,
    which returns a pointer to the function. This is slightly slower, but means that
    the same code can work on all platforms.


    Objective-C didn’t change much from this point.


    NeXT was purchased by Apple in 1997 and Objective-C adopted as the primary development
    language for the Yellow Box on their new Rhapsody operating system. These were
    later renamed Cocoa and OS X, respectively. In 2003, Apple added some Java-like
    exception handling primitives to the language.


    The next set of upgrades came in 2007, when Apple introduced Objective-C 2. This
    was slightly confusing to older Objective-C programmers, because the previous
    version—the one that NeXT had shipped—had been Objective-C 4. Fortunately, the
    belief that `2` is the number immediately following `4` does not seem to have
    made its way into any of the sorting code in Cocoa.


    Objective-C 2 added a few bits of syntactic sugar. It provided a new way of doing
    enumeration, a way of synthesizing accessor methods, and introduced garbage collection.
    Objective-C 2 is more of a marketing buzzword than a real language. You won’t
    find a compiler switch for selecting it. Some of the features, such as non-fragile
    instance variables, are only available on some runtimes. Others, such as garbage
    collection, are not available on the iPhone.


    Declared properties and fast enumeration are the only Objective-C 2 features that
    work everywhere, including non-Apple platforms.


    ## Cross-Platform Support


    Forcing NeXT to release the Objective-C front end for GCC as Free Software was
    something of a PR coup for the Free Software Foundation. Unfortunately, it was
    not so good from the perspective of long-term cross-platform support. The code
    that NeXT released was terrible and, for the last ten years, has been largely
    ignored by the GCC team.


    GCC has moderately good support for NeXT-era Objective-C, and also supports the
    newer exception-handling keywords. The GNUstep project provides implementations
    of the Foundation and AppKit frameworks that are the core of NeXT and Mac development.


    In 2007, Apple began work on a new compiler.


    `Clang` is a front end for the `Low Level Virtual Machine (LLVM)`, for C-family
    languages: C, Objective-C, and C++. It is much more modular than GCC, and is designed
    to be used for code completion, syntax highlighting, and static analysis as well
    as just compilation. Clang has clean separation between the code used in the different
    layers and isolates the runtime-specific code into separate classes.


    The compiler is only half of an Objective-C implementation. The other half is
    the runtime library. The GNU runtime was developed with GCC and did not implement
    the functions required for Objective-C 2. To remedy this, I wrote a framework
    as part of Étoilé that implemented most of the missing functionality and implemented
    the public runtime APIs that Apple introduced with OS X 10.5.


    This framework is now part of GNUstep. Another copy of it has been merged with
    a fork of the GCC runtime, also developed as part of the GNUstep project. This
    is referred to as either the `GNUstep runtime` or `libobjc2`.


    With Clang, and the runtime provided by the GNUstep project, you get full support
    for most Objective-C 2 features, including non-fragile instance variables. This
    means that you can use Objective-C 2 on Windows, Linux, BSD, Solaris, and so on.
    At least one person has been testing it on QNX, and it may also work on Symbian.


    If you use the GCC version of the runtime, along with the Objective-C 2 framework
    in GNUstep, then you get some things, such as fast enumeration and declared properties,
    but you do not get any of the benefits of the new ABI.


    ## Compiling Objective-C Programs


    ```

    gcc scanner.m

    Undefined symbols:

    *_OBJC_CLASS$_NSAutoreleasePool*, referenced from:

    __objc_classrefs__DATA@0 in ccoRpaJq.o

    *_objc_msgSend*, referenced from:

    _main in ccoRpaJq.o

    ```


    ```bash

    # On OS X

    gcc -framework Foundation scanner.m

    ```


    ```bash

    # On other platforms

    gcc `gnustep-config --objc-flags --base-libs` scanner.m

    ```


    The Clang front end is intended as a drop-in replacement for GCC, so anywhere
    you see gcc in some instructions, you can substitute clang. On OS X, GCC is installed
    in `/usr/bin/gcc`, so it is on your path. With slightly older versions of the
    XCode tools, Clang was installed in `/Developer/usr/bin/clang`, so you may need
    to either specify the full path or add this location to your path. On other platforms
    you will generally find both on your path, if they are installed.


    If you are familiar with compiling C or C++ with either of these compilers, you
    will find compiling Objective-C very familiar. If you just specify a source file
    on the command line, the compiler will attempt to compile and link it as an executable.
    Most of the time, this will not work. Objective-C programs require some other
    libraries. On X, the compiler drivers support an extra option;

