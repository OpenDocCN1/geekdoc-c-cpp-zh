  trans: "\n对于本地化字符串，你需要回到 `NSDateFormatter` 类。该类封装了关于日期格式的一些描述，并可以执行日期和字符串对象之间的双向转换。\n\
    \n当你创建一个日期格式器时，可以将区域设置（locale）设置为显式的区域设置，或者将其保持为用户的当前区域设置。然后，你可以使用该区域的标准时间和日期格式之一，或者通过\
    \ `-setDateFormat:` 方法显式地指定一个。该方法接受一个模板字符串作为参数，但在大多数代码中不建议使用，因为它没有考虑到区域设置。\n\n\
    读取日期你还有最后一个选择方案。\n\n如果你想从某些自定义格式中读取日期，可以使用 `NSScanner` 从字符串中读取组件，然后构建一个 `NSDateComponents`\
    \ 对象并将其传递给 `NSCalendar` 来创建日期。`NSScanner` 在第 5 章中介绍。\n\n## 接收定时器事件\n\n```objective-c\n\
    - (void)periodic:(NSTimer*)theTimer\n{\n    NSLog(@\"Timer fired\");\n}\n\n- (void)start\n\
    {\n    SEL sel = @selector(periodic:);\n    [NSTimer scheduledTimerWithTimeInterval:1\n\
    \                               target:self\n                               selector:sel\n\
    \                             userInfo:nil\n                              repeats:YES];\n\
    \    [[NSRunLoop currentRunLoop] run];\n}\n```\n*来自：timer.m* \n\n`NSTimer` 类封装了一个在特定时间产生事件的事件源。这在原理上类似于\
    \ `alarm()` 系统调用，尽管你可能同时调度多个定时器。\n\n你几乎总是使用本节开头示例中的方法来构建定时器。该方法会在同一个操作中创建并调度一个新的定时器。\n\
    \n当时间间隔结束时，定时器将触发。随后，它将向一个对象发送一条消息。\n\n定义此消息最简单的方法是在创建定时器时传递一个选择器（selector）、一个目标（target）和一个字典。该选择器必须对应一个接受一个参数的方法：该参数类型为\
    \ `NSTimer` 实例。你可以通过向定时器发送 `-userInfo` 消息来获取该字典。\n\n另一个构造函数接受一个 `NSInvocation`\
    \ 作为参数。这种方法更难使用，但更强大，因为它允许使用带有任何参数的任何消息。\n\n当你这样创建定时器对象时，它会被自动释放（autoreleased），但它会被*运行循环*（run\
    \ loop）对象保留。你只有在使用 `NSRunLoop` 时才能使用定时器。运行循环对象等待来自内核的事件——例如定时器触发或文件描述符上的数据变为可用——然后响应这些事件发送消息。\n\
    \n如果你正在使用 `AppKit` 或 `UIKit`，你将自动使用运行循环。`NSApplication` 和 `UIApplication` 类都会在内部创建一个运行循环实例。这些类在运行循环中注册，以接收来自显示服务器的用户界面事件的通知，然后将它们传递给窗口等等。\n\
    \n如果你正在编写命令行应用程序或服务器，你仍然可以使用 `NSRunLoop`。它是 Foundation 框架的一部分，但你必须手动创建它并告诉它运行。这非常简单，在上一个示例的\
    \ `-start` 方法的最后一行中完成。\n\n## 使用属性列表（Property Lists）\n\n在 OS X 上，Apple 引入了 XML\
    \ 和二进制属性列表格式。XML 格式非常冗长，但它的优点是它可以被其他兼容 XML 的工具解析，并可以嵌入到其他 XML 文档中。\n\n二进制表示解析速度非常快且非常紧凑，但由于是二进制格式，它不是人类可读的。\n\
    \n其他语言的一些库可以处理属性列表。WindowMaker 中的 `WINGS` 库可以读写它们，NetBSD 包含的库也是如此。Apple 的 Core\
    \ Foundation 框架以及开源的 `CFLite` 库也可以从 C 代码使用它们。\n\n### 在属性列表中存储集合\n\n#### 列表\n\n\
    ```objective-c\nNSArray *array = [NSArray arrayWithObjects:@\"array\", @\"containing\"\
    , @\"string\", @\"objects\", nil];\n[array writeToFile:@\"example.plist\" atomically:NO];\n\
    \nNSMutableArray *cycle = [array mutableCopy];\n[cycle addObject: cycle];\n[cycle\
    \ writeToFile:@\"failure.plist\" atomically:NO];\n```\n*来自：writeplist.m* \n\n\
    `NSArray` 和 `NSDictionary` 类实现了 `-writeToFile:atomically:` 方法。这些方法让你能够使用默认属性列表格式轻松将集合的内容导出到文件中。\n\
    \n这些方法并不是魔法。只有当集合不包含任何无法存储在属性列表中的类型时，才会生效。\n\n如果你将第二个参数传递为 `YES`，该方法将确保磁盘上的表示始终一致。它会将属性列表写入一个临时文件，并在写入完成后重命名该文件。\n\
    \n运行本节开头的代码将生成一个 `example.plist` 文件，其中包含一个数组作为根元素，内部有四个字符串。\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\"\
    \ \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"1.0\"\
    >\n<array>\n    <string>array</string>\n    <string>containing</string>\n    <string>string</string>\n\
    \    <string>objects</string>\n</array>\n</plist>\n```\n*来自：example.plist* \n\n\
    在当前版本的 OS X 中，这种方法将使用 XML 属性列表格式。如你所见，这非常冗长。旧的 OpenStep 属性列表格式数组使用括号，字符串使用双引号，因此尺寸会小于一半。\n\
    \n转换为二进制格式会将文件大小从 294 字节减到 82 字节。\n\n对于如此小的属性列表，空间缩减无关紧要。两种格式都可能放入磁盘上的单个分配单元中，因此它们占据相同的磁盘空间。解析时间对两者来说都是微不足道的。\n\
    \n然而，对于较大的属性列表情况并非如此。例如，Safari 将你的历史存储在二进制属性列表中。目前，我的记录有 15MB。如果我将其转换为 XML 格式，它会变成\
    \ 34MB。解析开销也会增加，包括 CPU 时间和内存占用。\n\n遗憾的是，集合类不会输出除默认（XML）格式以外的属性列表版本。相反，你必须使用 `NSPropertyListSerialization`\
    \ 类，我们将在后续章节中讨论。\n\n属性列表格式都是层次化的。它们不支持写入循环数据结构。此示例中的第二个数组包含一个指向自身的指针。将其写入属性列表时的行为是未定义的。在\
    \ OS X 上，只有递归指针之前的元素会被存储在文件中。之后的任何对象都会被忽略。\n\n### 从属性列表中读取数据\n\n#### 列表\n\n```objective-c\n\
    NSArray *array = [NSArray arrayWithContentsOfFile:@\"example.plist\"];\nNSData\
    \ *data = [NSData dataWithContentsFile:@\"example.plist\"];\nNSMutableArray *mutable\
    \ = [NSPropertyListSerialization propertyListFromData:data\n                 \
    \              mutabilityOption:NSPropertyListMutableContainersAndLeaves\n   \
    \                                                  format:NULL\n             \
    \                                  errorDescription:NULL];\nNSCAssert([mutable\
    \ isKindOfClass:[NSMutableArray class]], @\"Should have read a mutable array\"\
    );\n[[mutable objectAtIndex: 0] appendString:@\"suffix\"];\n```\n*来自：readplist.m*\n\
    \n从属性列表中读取有两种方法。第一种是使用我们刚刚查看过的写入方法的反向方法。支持属性列表序列化的集合类都有一个\n\n"
- fmt: "\n`-initWithContentsOfFile:`, initializer, as well as a corresponding constructor.\n\
    \nThis sounds easy, but there are some complications. The most important one is\
    \ that property lists do not store any information about mutability. An `NSString`\
    \ and an `NSMutableString`, for example, are stored in exactly the same way.\n\
    \n# Working with Property Lists\n\nWhen you read back a property list, which should\
    \ you get? If you read back an array by sending an `+arrayWithContentsOfFile:`\
    \ message to the `NSArray` class, you get an immutable array. If you send the\
    \ same message to an `NSMutableArray`, you will get a mutable array.\n\nThat’s\
    \ fine for the outer element in the property list, but what about the objects\
    \ inside the array?\n\nIn both of these cases, you will get arrays filled with\
    \ immutable objects. This may not be what you want.\n\nIf you want to read back\
    \ mutable objects, you need to use `NSPropertyListSerialization`. This class handles\
    \ reading and writing property lists and provides much finer-grained control than\
    \ the various collection classes.\n\n**Note:**\n\nIf you read the latest version\
    \ of Apple’s documentation, you will see that the method we use on `NSPropertyListSerialization`\
    \ is marked for future deprecation. This is because it was introduced in the period\
    \ when Apple started using `error:` parameters, but before they introduced the\
    \ `NSError` class. Unfortunately, the method that is recommended to replace it\
    \ does not yet provide equivalent functionality.\n\nWhen you read a property list\
    \ using this class, you can pass a mutability option as a parameter. There are\
    \ three possible options for this. The default is for all of the objects to be\
    \ immutable. The option used in the example at the start of this chapter goes\
    \ to the other extreme, making everything mutable. Appending a suffix to one of\
    \ the strings in the array demonstrates this.\n\nThe third option is somewhere\
    \ in the middle. It makes container objects mutable, but other objects (strings,\
    \ numbers, dates, and so on) immutable. This is useful when you want to modify\
    \ the structure of the property list but not any of the leaf elements.\n\nWhen\
    \ you read a property list in this way, the property list serialization class\
    \ will tell you what the format of the property list was.\n\n## Converting Property\
    \ List Formats\n\n```objectivec\nNSString *file = [NSString stringWithUTF8String:\
    \ argv[1]];\nNSData *data = [NSData dataWithContentsOfFile:file];\nNSPropertyListFormat\
    \ fmt;\nid plist = [NSPropertyListSerialization propertyListWithData: data\noptions:\
    \ 0\nformat: &fmt\nerror: NULL];\n\nif (fmt == NSPropertyListBinaryFormat_v1_0)\n\
    {\n    return 0;\n}\ndata = [NSPropertyListSerialization dataWithPropertyList:\
    \ plist\nformat: NSPropertyListBinaryFormat_v1_\noptions: 0\nerror: NULL];\n\n\
    [data writeToFile: file atomically: NO];\n```\n*From: makebinaryplist.m*\n\nOn\
    \ OS X, you cannot write property lists in the OpenStep format, but you can still\
    \ use the two other forms. In general, you should use the binary format for storing\
    \ private data and the XML format for anything that the user might want to edit\
    \ with other tools.\n\nThese are not hard-and-fast rules. The point of the property\
    \ list format is that you can losslessly convert between the representations,\
    \ so you might use the binary format everywhere—because it is denser and faster\
    \ to parse—and expect the user to convert the property list if he wants to modify\
    \ them.\n\nYou can choose which format you use when you write a file using `NSPropertyListSerialization`.\
    \ This class also, helpfully, tells you what the format of the property list is\
    \ currently when you read it in.\n\n**Note:**\n\nThe methods used in the example\
    \ at the start of this section were introduced with OS X 10.6. If you are using\
    \ an older version of OS X, you can replace the read method that we looked at\
    \ in the last section and the corresponding write method.\n\nIt’s quite common\
    \ to want to store property lists in binary format for efficiency. Your users\
    \ will then decide that they want to poke these files in a text editor, so they’ll\
    \ use the `plutil` tool to convert them to XML format. They will then, of course,\
    \ forget to convert them back, so your program will read them back slowly the\
    \ next time.\n\nIf you are not going to modify a property list every time your\
    \ program runs, it’s worth checking whether the format is still binary when you\
    \ load it and then rewriting it in this format if it isn’t.\n\n## Storing User\
    \ Defaults\n\n```objectivec\nNSUserDefaults *def = [NSUserDefaults standardUserDefaults];\n\
    id persistentString = [def stringForKey: @ *\"example\"* ];\nNSLog(@\"Old value:\
    \ %@\", persistentString);\nif (argc > 1)\n{\n    NSString *new = [NSString stringWithUTF8String:\
    \ argv[1]];\n    [def setObject: new forKey: @ *\"example\"* ];\n    [def synchronize];\n\
    }\n```\n*From: defaults.m*\n\nThe user defaults system is one of the biggest users\
    \ of property lists. If you look in `~/Library/Preferences` directory, you will\
    \ see a lot of property list files. These files store preferences for the current\
    \ user. Every application has its own domain, typically a reverse-DNS notation\
    \ string (for example com.apple.TextEdit). The `NSUserDefaults` class can access\
    \ data from this domain.\n\nThe defaults system will read data from a variety\
    \ of sources. One of the most useful is the command line. You can specify key-value\
    \ pairs as command-line arguments to any X application, which is incredibly useful\
    \ when debugging.\n\n**Note:**\n\nThe defaults system is comparable to the Windows\
    \ registry, but with a few important differences. Both support multiple levels\
    \ of keys (user, system, and network), but the defaults system hides all of this\
    \ from the programmer.\n\nAlthough both look like tree structures, the registry\
    \ is a single database, whereas the defaults system stores data in separate files\
    \ for each domain. This makes it easy to modify defaults with third-party tools\
    \ and means that it scales better because you never need to read more than one\
    \ of these files into memory at once. The downside is that operations on defaults\
    \ are not transactional.\n\nModifying the same domain from two programs simultaneously\
    \ is undefined.\n\nThe defaults system is exposed as a single dictionary. Unlike\
    \ a dictionary, the defaults object has some convenience methods for accessing\
    \ non-object types and for type-checking object types. In the current example,\
    \ we send it a `-stringForKey:` message. This wraps the `-objectForKey:` method,\
    \ but ensures that the return value is a string.\n\nThere are other convenience\
    \ methods, such as `-floatForKey:` and `-setFloat:ForKey:`, which take primitive\
    \ C types and wrap them in `NSNumber` instances before storing them in the defaults\
    \ system.\n\nThe code in this example ends by sending a `-synchronize` message\
    \ to the defaults object. This is not usually necessary. The defaults object will\
    \ be periodically synchronized with the on-disk storage. In this example, however,\
    \ we are not using a run loop (so timers will not work) and are exiting immediately\
    \ after modifying the defaults, so our changes will never be committed to disk\
    \ without this.\n\nRunning this example, you can see that the initial value is\
    \ nil, because there isn’t anything stored in defaults. The value passed as an\
    \ argument to the short program is stored in defaults and retrieved automatically\
    \ the next time it is run.\n\nThis also demonstrates using `NSArgumentDomain`.\n"
