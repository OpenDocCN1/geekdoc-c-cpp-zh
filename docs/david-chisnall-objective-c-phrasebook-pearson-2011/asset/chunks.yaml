    Simula 没有使用“面向对象”这一术语，但许多在 Smalltalk 之后出现的 Simula 类语言都采用了这一术语，这导致了一些混淆。这类家族的语言，例如
    `C++`，使用 `virtual function tables (vtables)` 来来实现表面上相似的功能。


    Simula 风格的对象包含一个指向其 `vtable` 的指针，如果有超类，则指向 `vtables`。当你调用一个虚函数时，编译器会在 `vtable`
    中创建一个偏移量，然后调用该偏移量处的函数。


    这种差异的副作用之一是，Objective-C 和 `C++` 中的指针指针转换具有截然不同的语义。在 Objective-C 中，当你将指针从一种对象类型转换为另一种对象类型时，不会生成任何代码。这种转换只是对编译器的类型检查器的一个提示。


    然而，在 `C++` 中，指针转换会执行一些指针运算，使得传递转换后指针的代码能够找到正确位置的 `vtable`。这意味着在 Objective-C 中，你可以将任何对象类型转换为任何其他对象类型，而在
    `C++` 中，你需要使用一种特殊的转换。


    这种区别非常重要。在 Objective-C 中，影响方法查找的唯一因素是对象的类型。在 `C++` 和其他 Simula 家族语言中，查找还会受到编译器认为的对象类型的影响。


    ## 两个类型系统的故事


    让初学者 Objective-C 的人感到困惑的问题之一是它有两套类型系统。如果你将原始实现视为一个预处理器，这就说得通了。


    Objective-C 预处理器会执行类似于 `Strongtalk` 的类型检查，然后由 `C` 编译器执行 `C` 类型检查。


    ### C 即 Objective-C


    `C` 拥有一个结构化类型系统。基本数据类型的类型等效性基于两个类型是否具有相同的表示。复杂类型永远不会被视为等价。


    Objective-C 增加了一个代数类型系统。对象的类型由其签名定义：即它声称将响应的消息。你可以隐式地将一个 Objective-C 对象转换为其超类，因为保证它会响应超类理解的所有消息。


    你可以显式地将对象转换为其他类型。例如，你可以将一个字典对象转换为数组对象。只要你之后只向它发送字典和数组都能理解的消息，这就能运行。


    Objective-C 最重要的特征之一是它是 `C` 的纯超集。你可以将 `C` 视为嵌入在 Objective-C 中用于低级任务的特定领域语言，并将
    Smalltalk 的子集视为嵌入在 Objective-C 中用于高级任务的特定领域语言。


    使用纯 `C` 解决问题并没有错。许多人在学习 Objective-C 时犯的错误之一是，为了优化考虑静态类型信息，就假设他们必须停止使用 `C`。对于很多事情，`C`
    的解决方案才是正确的。


    **注意：**


    Objective-C 还有一个姐妹语言 `Objective-C++`，它与 `C++` 的关系就像 Objective-C 与 `C` 的关系一样。`Objective-C++`
    是 `C++` 的纯超集，允许你在 Objective-C 对象中调用 `C++` 代码，反之亦然。由于它们拥有完全不同的对象模型，你不能用 `C++` 继承一个
    Objective-C 类，反之亦然；但你可以将 Objective-C 对象的指针作为 `C++` 对象的字段，并将 `C++` 对象的指针作为 Objective-C
    对象的实例变量。


    你可以在 Cocoa 框架中看到这一点。


    并不是所有内容都是对象。如果你请求字符串中的字符范围，你将使用 `NSRange` 结构。这是一个 `C` 结构——而不是 Objective-C 对象——包含一个位置和一个长度。点、矩形以及其他许多东西以类似的方式表示。如果这些是对象，那么你将消耗更多的内存，使操作变慢，并且并不能真正获得任何灵活性。


    面向对象的英格尔测试（Ingalls test）认为，你应该能够创建一种新整数，并将其用于在屏幕上定位窗口。Objective-C 未通过这一测试，但这在现实世界中并不是一个非常有用的例子，因为在大多数情况下，设计新类型的整数会破坏许多期望整数具有标准行为的代码。


    在 Objective-C 中，在不需要动态行为的情况下，你不必使用动态行为（如后期绑定和多态）。


    ## 语言与库


    对于非常动态的语言，很难在语言和库之间划定界限。在 Smalltalk 中，语言中没有等同于 `if` 语句。标准库定义了 `True` 和 `False`
    单例类，它们响应 `-ifTrue:` 消息，并接受闭包作为参数。所有复杂的流控制结构（如循环或枚举）都是基于此实现的。


    Objective-C 继承了 `C` 的流控制，但所有的动态行为都由运行时库提供。这与 `C` 或 `C++` 不同。你可以编译一个独立的 `C` 或 `C++`
    二进制文件，它不调用 `libc` 或 `libstdc++` 中的任何函数。然而，每一个不是纯 `C` 程序的 Objective-C 程序都必须链接 `libobjc`
    才能工作。


    该库传统上提供三个类：一个简单的根类、一个常量字符串类和一个协议类。其中第一个提供的功能在 `C++`、Java 和类似环境中是语言的一部分。另外两个可能是由编译器生成的类。


    大多数时候，你不会使用这些类中的任何一个。过去几年编写的大多数 Objective-C 代码使用 OpenStep Foundation 框架实现。OpenStep
    是 NeXT 和 Sun 联合制定的规范，旨在为跨平台应用开发提供现代面向对象的框架。NeXT 在其 OPENSTEP 操作系统和 Windows 上实现了它，而
    Sun 在 Solaris 上提供了实现。不久后，GNU 项目发布了第三种实现：GNUstep。


    OpenStep 定义了两个框架：Foundation Kit 和 Application Kit，通常简称为 Foundation 和 AppKit。Foundation
    Kit 提供了应用程序所需的核心功能，如集合类、运行循环、通知传递、OS 抽象等。Application Kit 构建在其之上，为构建图形化应用程序提供额外支持。Apple
    在几年后购买了 NeXT 并将 OpenStep 环境重命名为 Yellow Box，作为开发环境发布在 Rhapsody 和 Windows 上。随着 OS
    X 的发布，它再次被命名，这次称为 Cocoa。


    ## Objective-C 的历史


    GNU 项目仍在活跃开发，但现在跟踪 Apple 对 OpenStep 规范的增强，以及核心规范。这意味着 Foundation 框架几乎可以在任何地方使用，尽管
    GNUstep 实现中缺少一些最新的类和方法。


    你可以将 Foundation 框架视为 Objective-C 的标准库。它为非易易程序提供了许多功能。若干 Objective-C 2 特性是专门为与
    Foundation 配合而设计的。


