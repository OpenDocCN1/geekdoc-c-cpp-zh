    ## Objective-C 的历史


    “面向对象”一词由 Alan Kay 在 20 世纪 60 年代提出，Smalltalk 是他和其他人为了演示这种编程风格而创建的语言。Smalltalk
    开发于 70 年代，其最广泛使用的版本于 1980 年发布。


    。


    然而，Smalltalk 运行非常慢。为了正确运行它，你需要一台强大的计算机，例如 Xerox Alto，它拥有 512KB 的内存，并且理想情况下至少配备一个
    `2MHz` 的处理器。


    Brad Cox 喜欢 Smalltalk 的理念，但他希望有一种他可以在人们负担得起的计算机上使用的语言。他的想法是将 Smalltalk（一种鼓励封装、松耦合和代码复用的高级语言）与
    C 语言结合。而 C 语言正处于光谱的另一端，几乎没有封装，没有动态分发，但它有一个巨大的优势：它非常快。


    C 语言高度基于 PDP-11 指令集。一个非常初级的 C 编译器就能产生相当快的代码。这在今天也是如此。诸如 `LLVM`、`XLC` 和 `ICC` 等编译器在优化上投入了大量精力，但几乎不做任何优化的
    `PCC` 仍然能产生相当快的代码。


    Brad Cox 和 Tom Love 于 1986 年创立了 StepStone，销售一种基于 Brad 早期“面向对象预编译程序”的产品。这个产品就是
    Objective-C，它是一个预处理器和一个小型的 `Objective-C runtime library`。该预处理器生成 C 代码，你可以使用对应平台的
    C 编译器对其进行编译。直到 2010 年，我仍遇到过一家在商业产品中使用 StepStone 编译器的公司。


    1988 年，NeXT 购买了 StepStone 代码的许可，并直接买下了 Objective-C 的商标。随后，NeXT 将预处理器重写为 `GNU Compiler
    Collection`（`GCC`）的前端。经过一些法律斗争后，自由软件基金迫使他们发布了这些代码，但他们保留了运行时库的私有性。


    GNU 项目随后编写了运行时库的替代品，但进行了一些更改。


    其中之一是，GNU 运行时中的选择器（selectors）关联了一个类型。在 NeXT（以及 Apple）平台上，选择器只是字符串。


    这意味着 GNU 运行时可以在运行时捕获由于程序员错误导致的某些堆栈损坏，而这些错误在 NeXT 运行时是不可见的。


    另一个更改在于消息发送的实现方式。当你使用 NeXT 运行时发送消息时，编译器会将消息发送转换为对 `objc_msgSend()` 函数的调用。它会查找该方法然后调用它。


    遗憾的是，无法在 C 中实现这个函数。它必须为每个平台以及该平台上的每种调用约定用汇编语言编写。GNU 的解决方案是用 `objc_msg_lookup()`
    函数来替换它，该函数返回一个函数的指针。这虽然稍微慢一点，但意味着相同的代码可以在所有平台上运行。


    Objective-C 从此之后没有发生太大变化。


    NeXT 在 1997 年被 Apple 收购，Objective-C 被采用为其新操作系统 Rhapsody 上 Yellow Box 的主要开发语言。这些后来分别被重命名为
    Cocoa 和 OS X。2003 年，Apple 在语言中添加了一些类似 Java 的异常处理原语。


    下一组升级出现在 2007 年，Apple 引入了 Objective-C 2。这对老牌 Objective-C 程序员来说稍显困惑，因为之前的版本——即
    NeXT 发布的那个——是 Objective-C 4。幸运的是，“`2` 紧跟在 `4` 后面”的想法并没有出现在 Cocoa 的任何排序代码中。


    Objective-C 2 增加了一些语法糖。它提供了一种新的枚举方式、一种自动合成访问器的方法（synthesizing accessor methods），并引入了垃圾回收。Objective-C
    2 与其说更像是一个营销术语，而不是一种真正的语言。你找不到用于选择它的编译器开关。某些功能（如非易碎实例变量，*non-fragile instance
    variables*）仅在某些运行时可用。其他功能（如垃圾回收）在 iPhone 上不可用。


    声明属性和快速枚举是唯一处处运行（包括非 Apple 平台）的 Objective-C 2 特。


    ## 跨平台支持


    强制 NeXT 将 GCC 的 Objective-C 前端作为自由软件发布，对于自由软件基金来说是一次公关上的胜利。遗憾的是，从长期跨平台支持的角度来看这并不理想。NeXT
    发布的代码非常糟糕，在过去的十年里，很大程度上被 GCC 团队忽略了。


    GCC 对 NeXT 时代的 Objective-C 有中等程度的支持，也支持新的异常处理关键字。GNUstep 项目提供了 Foundation 和 AppKit
    框架的实现，这些是 NeXT 和 Mac 开发的核心。


    2007 年，Apple 开始开发一种新编译器。


    `Clang` 是用于 C 家族语言（C、Objective-C 和 C++）的 `Low Level Virtual Machine (LLVM)` 的前端。它比
    GCC 模块化程度得多，并被设计用于代码补全、语法高亮和静态分析，而不仅仅是编译。Clang 在不同层级使用的代码之间有清晰的分离，并将特定的运行时代码隔离到单独的类中。


    编译器只是 Objective-C 实现的一半。另一半是运行时库。GNU 运行时是使用 GCC 开发的，并没有实现 Objective-C 2 所需的函数。为了解决这个问题，我在
    Étoilé 项目中编写了一个框架，实现了大部分缺失的功能，并实现了 Apple 在 OS X 中引入的公共运行时 API。


    这个框架现在是 GNUstep 的一部分。另一个版本的 Objective-C 运行时副本是与 GNUstep 合并的，被称为 `GNUstep runtime`
    或 `libobjc`。


    通过 Clang 配合 GNUstep 提供的运行时，你可以获得对大多数 Objective-C 2 功能的支持，包括非易碎实例变量。这意味着你可以在 Windows、Linux、BSD、Solaris
    等系统上使用它。至少有人在 QNX 上测试过它，它也可能在 Symbian 上运行。


    如果你使用 GCC 版本的运行时配合 GNUstep 中的 Objective-C 框架，你可以获得某些功能，例如快速枚举和声明属性，但无法获得新 ABI
    的任何优势。


    ## 编译 Objective-C 程序


    如果你熟悉如何使用这些编译器中的一种编译 C 或 C++，你就会发现编译 Objective-C 非常熟悉。如果你只是在命令行指定一个源文件，编译器将尝试将其编译并链接为可执行文件。在大多数情况下，这是行不通的。Objective-C
    程序需要其他库。在 X 上，编译器驱动程序支持一个额外选项；


