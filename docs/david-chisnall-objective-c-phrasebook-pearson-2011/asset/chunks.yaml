    underpinnings of the Bonjour system. For other things, the port that you publish
    is often more useful and the name will be something that you will present to users.


    You search for peers using the `NSNetServiceBrowser` class. This is a little bit
    more tricky to use correctly. Publishing services is synchronous; you send a `-publish`
    message to your `NSNetService` instance and the service is published. Searching
    is asynchronous and requires a `run loop` to be active.


    When you send the search message to the browser, it will transmit a DNS request.
