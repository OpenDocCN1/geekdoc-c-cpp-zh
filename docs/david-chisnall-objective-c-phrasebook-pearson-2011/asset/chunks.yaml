    to an NSLock in the same thread, you have a deadlock. You can send as many -lock
    messages as you want to an NSRecursiveLock as long as you send the same number
    of -unlock messages. This is useful in methods that may be called from code that
    has already acquired the lock, as well as from code that hasn’t.


    The problem with these classes, traditionally, is that they didn’t integrate well
    with exception handling. If you acquired a lock and then called something that
    threw an exception, you would have problems. The lock would never be released.


    When Apple introduced the new exception-handling keywords, they also introduced


    **@synchronized**. This will lock on an arbitrary object and make sure that the
    lock is released if an exception is thrown.


    Generally speaking, it is a bad idea to use


    252


    CHAPTER 14: **Threads**


    this keyword. Although it makes life a little easier, and is familiar to Java
    programmers, the implementation is very inefficient. It needs to associate a lock
    with the object, and it always uses a recursive lock even when this isn’t ideal.


    You can achieve the same effect by making sure that you send the -unlock message
    in an


    **@finally** block.


    You can avoid the **@try** and **@finally** block if you are sure that none of
    the called methods or functions will throw an exception, but with the GNU and
    Modern Apple runtimes they don’t have any run-time penalty.


