    David has a great deal of familiarity with Objective-C, having worked both on
    projects using the language and on implementing the language itself. He has also
    worked on implementing other languages, including dialects of Smalltalk and JavaScript,
    on top of an Objective-C runtime, allowing mixing code between all of these languages
    without bridging.


    When not writing or programming, David enjoys dancing Argentine Tango and Cuban
    Salsa, playing badminton and ultimate frisbee, and cooking.


    ## Acknowledgments


    When writing a book about Objective-C, the first person I should thank is Nicolas
    Roard.


    I got my first Mac at around the same time I started my PhD and planned to use
    it to write `Java` code, not wanting to learn a proprietary language. When I started
    my PhD, I found myself working with Nicolas, who was an active `GNUstep` contributor.
    He convinced me that Objective-C and `Cocoa` were not just for Macs and that they
    were both worth learning. He was completely right: Objective-C is a wonderfully
    elegant language, and the accompanying frameworks make development incredibly
    easy.


    The next person to thank is Fred Kiefer. Fred is the maintainer of the `GNUstep`
    implementation of the `AppKit` framework. He did an incredibly thorough (read:
    pedantic) technical review of this book, finding several places where things were
    not explained as well as they could have been. If you enjoy reading this book,
    then Fred deserves a lot of the credit.


    Finally, I need to thank everyone else who was involved in bringing this book
    from my text editor to your hands, especially Mark Taber who originally proposed
    the idea to me.


    ## We Want to Hear from You


    As the reader of this book, *you* are our most important critic and commentator.
    We value your opinion and want to know what we’re doing right, what we could do
    better, what areas you’d like to see us publish in, and any other words of wisdom
