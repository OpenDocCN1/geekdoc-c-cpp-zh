    **id** pool = [NSAutoreleasePool new];


    [anObject doSomethingThatCreatesLotsOfObjects


    ];


    [pool drain];


    Note that you send an autorelease pool a -drain message rather than a release
    message when you destroy it. That is because the Objective-C runtime will ignore
    -release messages when you are in garbage collected mode. The -drain message in
    this mode provides a hint to the collector, but does not destroy the pool, when
    you are in garbage collected mode.


