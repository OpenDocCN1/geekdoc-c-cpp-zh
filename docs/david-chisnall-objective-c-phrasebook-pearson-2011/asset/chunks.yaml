    *From: thread.m*


    Threads in Objective-C are encapsulated in NSThread objects. These wrap a POSIX
    thread and provide some convenience methods.


    As of 10.5, there are two ways of creating new threads. The traditional one is
    similar to the standard way of creating POSIX threads, whereas the second is intended
    to be more familiar to Java programmers.


    When you create a new POSIX thread, you call a function with a **void*** parameter
    in a new thread. When you create a new thread using NSThread, you do something
    similar, sending a message to an object, taking another object as an argument.


    The more Java-like way of creating a new thread is to subclass NSThread and override
    the -main method. You can then create a new instance of your thread object and
    send it a -start message to start it running.


    When you create a new thread, it does not


    **Controlling Thread Priority** 247


    have an autorelease pool in place, so the most common thing to do first is either
    create an autorelease pool, or create a new run loop for the thread.


    Creating a new thread is a relatively expensive operation in Objective-C, just
    as it is in C. The process must get some new memory for the new thread’s stack
    from the kernel, create all of the userspace and kernel data structures for scheduling
    it, and map some additional space for thread-local storage. It’s therefore a good
    idea to keep threads around for a while once you’ve created them.


    Creating a new run loop in the thread is a good way of doing this. You can then
    register timers to fire, monitor file descriptors for new data, and use an event-driven
    style of programming in the new thread.


    **Controlling Thread Priority**


    6


    **double** oldPriority =


    7


    [NSThread threadPriority];


