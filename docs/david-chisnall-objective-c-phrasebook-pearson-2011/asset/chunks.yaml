    AppKit uses this class and defines a few keys for the dictionaries for providing
    presentation markup. You can use this to attach an `NSFont` instance to a range
    of text and have the text system in AppKit display that range of the text in the
    specified font.


    The example constructs a fragment of a program as an attributed string, defining
    attributes for defining keywords. You might then have a transform that takes this
    attributed string and generates one using presentation attributes for display
    in a text view, or another one for generating HTML from this markup.


    It’s important to remember that


    `NSAttributedString` is generic. You can use it for attaching any attributes that
    you want to define to ranges in a string.


