  trans: "\n为了能够工作而进行链接。它们 true 有一个 `flags` 字段，允许其内部表示可以是 UTF-8 或 UTF-16，取决于哪种格式对其内容更有效。\n\
    \n常量 Objective-C 字符串通过在常量 C 字符串字面量前加上 `@` 符号来创建，例如 `@*\"string\"`。你也可以在 C 和 Objective-C\
    \ 代码中使用 `CFSTR()` 宏来创建常量 Core Foundation 字符串。\n\n该宏会调用编译器内置函数，该函数生成一个常量字符串对象。\n\
    \n## 比较字符串\n\n```objc\nNSString *twelve = @*\"12\";\nNSString *twelveFromInt =\
    \ [NSString stringWithFormat: @\"%d\", 12];\nNSNumber *numberTwelve = [NSNumber\
    \ numberWithInt: 12];\n\nif ([twelve isEqualToString: twelveFromInt])\n    NSLog(@*\"\
    Both strings are equal\");\n\nif (twelve == twelveFromInt)\n    NSLog(@*\"Both\
    \ strings are identical\");\n\nif (twelve == @*\"12\")\n    NSLog(@*\"Constant\
    \ strings are identical\");\n\nif ([twelve isEqual: numberTwelve])\n    NSLog(@*\"\
    String is equal to number\");\n```\n*来自：CompareStrings.m*\n\n比较字符串是否相等最简单最直接的方法是使用\
    \ C 比较运算符 `==`。遗憾的是，它有时确实有效，这可能会导致一些微妙的错误。它测试的是两个对象是否**完全相同**（identical），而不是是否相等（equal）。它测试的是它们是否是同一个对象，而不是具有相等值的对象。\n\
    \n比较两个指针比比较两个字符串快得多，甚至比发送消息还要快。在某些情况下，先尝试指针比较可能会更快。指针比较的结果是让你知道这两个字符串是相同的，或者它们可能是相同的。它永远不会告诉你它们绝对是不同的。如果你频繁比较相同的字符串，这可以使代码更快，但这通常是*过早优化*的例子。\n\
    \n如果你想测试两个字符串是否相等，你应该使用 `-isEqualToString:` 方法。\n\n请注意，该方法期望参数是另一个 Objective-C\
    \ 字符串。你可以通过向它们发送 `-isEqual:` 消息来比较任何两个 Objective-C 对象，但哪些其他对象被认为是等等的，取决于接收者的决定。\n\
    \n在节节开的示例中，编译器通常会合并常量字符串，使得 `twelve` 和字面量 `@*\"12\"` 成为同一个对象。这并不是保证的，但编译器没有充分理由不这样做。\n\
    \n字符串与 `NSNumber` 实例之间的比较更有趣。你可能认为这会比较字符串与向数字发送 `-stringValue` 消息的结果，但事实并非如此。\n\
    \n这很重要，因为相等性必须具有交换律。如果 `[a isEqual: b]` 为真，那么很多代码都会假设 `[b isEqual: a]`。这在集合类中尤为如此。例如，如果你向\
    \ `NSMutableSet` 插入两个对象，而相等性在一个方向上成立但在另一个方向不成立，那么结果是未定义的。\n\n通常，当你想要比较字符串——或者确切地说，任何对象——时，你不仅想知道它们是否相等，还想它们的顺序。对于字符串来说，这里开始变得有点复杂了。给定两个数字，它们之间有一个唯一的规范排序。而对于字符串，有几种定义良好的强序关系。“etoile”、“Étoilé”\
    \ 和 “Etoile” 应该按什么顺序排列？\n\n如果你正在进行不区分大小写的比较，第一个和最后一个将具有相同的排名。带重音的字母是紧跟在不带重音的变体之前之后，还是在所有不带重音的字母之前之后，取决于你的区域设置（locale）。当你有一份文件列表时，如果将“file10”排在“file2”之前，用户可能会感到恼火，尽管这是这两个文件名的字典顺序。\n\
    \n对于仅基于字符值的简单比较，你可以使用 `-compare:` 方法。这和所有其他比较结果一样，会返回一个 `NSComparisonResult`，这是一个带有三个可能值的枚举类型：`NSOrderedAscending`、`NSOrderedSame`\
    \ 和 `NSOrderedDescending`。如果你在向用户展示数据，应该使用 `-localizedCompare:`。这将根据为用户所选语言定义的规则返回两个字符串的排序结果。\n\
    \n这两者都是对这个通用比较方法的封装：\n\n```objc\n- (NSComparisonResult)\ncompare:(NSString*)aString\n\
    options:(NSStringCompareOptions)mask\nrange:(NSRange)range\nlocale:(id)locale;\n\
    ```\n\n这允许你指定一组选项，例如用于将 10 排在 9 之后的 `NSNumericSearch`，以及用于忽略大小写的 `NSCaseInsensitiveSearch`。将范围作为第三参数允许你将比较限制在接收者的某个子字符串上，传递区域设置则允许你指定非\
    \ ASCII 字符的排序规则。值得注意的是，通常将 `nil` 作为区域设置意味着使用当前区域设置或*规范区域设置*。在这种情况下，传递 `nil` 意味着使用规范区域设置对字符值进行数值比较。\n\
    \n## 逐字符处理字符串\n\n```objc\nfor (NSUInteger i=0 ; i<[aString length] ; i++)\n{\n\
    \    unichar c = [aString characterAtIndex: i];\n    // 处理 c\n}\n```\n*来自：stringIterateSlow.m*\n\
    \n`NSString` 类是一个类簇（class cluster）。它是一个抽象类，当你创建一个它的实例时，你得到的是某个私有子类的实例。\n\n任何 `NSString`\
    \ 子类都必须实现两个原始方法：`-length` 和 `-characterAtIndex:`。第一个返回长度，第二个返回字符串中特定索引处的字符。\n\n\
    如果你需要对字符串中的每个字符进行操作，可以在简单的循环中遍历它，并反复调用此方法。这非常低效，因为每个字符都需要发送消息。这比访问 C 字符串要开销得多。这个版本对每个字符都会发送\
    \ `-length` 消息，而只有在迭代过程中长度可能会变化时才需要这样做。\n\n另一种替代方案是获取 C 字符串并对其处理。例如，你可以向字符串发送\
    \ `-UTF8String` 消息然后处理返回的 C 字符串。虽然听起来合理，但记住字符串可能很大并且可能不是以 UTF-8 存储，因此对象可能需要将其内部表示转换为\
    \ UTF-8，分配内存存储，之后由自动释放池（或垃圾回收器）清理这些内存。\n\n访问字符串字符最高的方法是 `-getCharacters:range:`。Objective-C\
    \ 中以 `get` 开头的方法通常接收调用者分配的一些空间并将数据返回其中。在这种情况下，第一个参数是一个指向 unichar 缓冲区的指针，它必须足够存储请求的字符。\n\
    \n下一个示例使用此机制计算源文件中的分号数量。首先将源代码加载到字符串中，然后每次获取十个字符。注意这种双循环结构。外层循环获取字符块，然后内层循环遍历块。当你使用*快速枚举*（fast\
    \ enumeration）遍历集合时，编译器会生成相同的结构。\n\n这每十个字符需要一次消息发送。你可以通过增加缓冲区的大小，用额外的空间换取更高的速度。注意此缓冲区是分配在栈上的。这很快，但你应该...\n\
    \n```objc\nint semicolons = 0;\nNSUInteger length = [str length];\nNSRange range\
    \ = { 0, 10 };\nwhile (range.location < length)\n{\n    // ... 实现\n}\n```\n\n"
