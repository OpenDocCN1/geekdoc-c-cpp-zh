  如果程序能够对需要执行的任务做出决策，那么程序将变得有用得多。在 C 语言中做出决策通常涉及对一个或多个变量的值进行测试，例如：“如果 X 大于 Y，则执行任务\
  \ 1，否则执行任务 2”。\n\nC 程序可以使用各种测试来满足许多不同的情况。上例示例使用了 `if-else` 结构，这仅仅是 C 程序可以执行的最简单的测试。\n\
  \n然而，不难想象的是，在做出此决策后，任务 1 或任务 2 也可能是一种 `ifelse` 类型的测试，导致执行其他更专门的任务（可能也包括更多测试）。这在\
  \ C 语言中可以通过使用根据所需的任意数量的嵌套 `if-else` 结构来实现。\n\n`switch` 结构与嵌套的 `if-else` 类似，但当需要根据变量的值选择不同的任务（切换到）时，它更为合适。\n\
  \n1. 条件、选择、或决策控制语句\n2. Switch case 控制语句。\n\n### 1. 选择语句（决策控制结构）\n选择语句允许程序根据表达式的结果或变量的状态，从不同的执行路径集中选择任意一条路径。\n\
  \n1. `if`\n2. `if else`\n3. `nested if else` \n4. `if-else-if`\n\n![](img/image01009.jpeg)\n\
  \n### 2. Switch Case\n```c\nswitch(expression)\n{\n    case 1:\n        statement\
  \ 1 sequence;\n        break;\n    case 2:\n        statement 2 sequence;\n    \
  \    break;\n    case 3:\n        statement 3 sequence;\n        break;\n    case\
  \ n:\n        break;\n    default :\n        default statement sequence;\n}\n```\n\
  决策和 Switch Case 语句允许计算机决定下一个执行哪个语句。\n\n#### 常见编程错误\n1. `if` 语句不包含 `then` 单词。因此，写\
  \ `if(condition) then` 是错误的。\n2. 在 `if` 语句中，条件必须包含在括号内。因此，写 `if condition;` 是错误的。\n\
  3. 在 `if` 语句中，`else` 单词后面没有分号。因此这是一个逻辑错误。现在 `false statement` 将始终执行。\n4. 使用单等号 `=`\
  \ 代替双等号 `==` 被视为逻辑错误。\n5. 在 `switch` 中，跟在 `switch` 后的整数表达式必须包含在括号内。\n\n### 实验练习\n\
