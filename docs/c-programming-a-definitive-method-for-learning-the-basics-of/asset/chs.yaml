  \n\n\n\n在执行过程中，窗口程序会调用多个 API 函数。想象一下，如果这些每一个函数都成为每个程序 `.Exe` 文件的一部分，将会浪费多少磁盘空间。为了避免这种情况，API\
  \ 函数被定义在具有特殊扩展名 `.DLL` 的特殊文件中，`.DLL` 代表动态链接库（Dynamic Link Library）。\n\n这些是二进制文件。`.dll`\
  \ 文件中提供的函数可以在执行期间或安装期间进行链接。当多个程序在 Windows 下运行时，这些函数可以共享并相互调用。\n\n这些函数之间的链接是动态完成的（在执行期间）。这些函数不会成为可执行文件的一部分。因此，`Exe`\
  \ 文件的尺寸不会失控。此外，你还可能需要创建自己的 `DLLs`，因为你做此有有以下两个原因：\n\n(a) 在不同的可执行文件之间共享通用代码。\n(b)\
  \ 将应用程序拆分为称为段（segments）的组件部分。提供易于升级应用程序组件的方法。\n\n### 3. 保持外观和感受一致\n这意味着每个程序都提供了一个一致且半线性的用户界面。结果是用户不需要花费大量的时间来掌握一个新程序。每个程序都占据计算机屏幕上的窗口——一个矩形区域；窗口通过其个人的标题栏进行标识。\n\
  \n大多数程序功能通过程序的菜单启动。如果 `info` 很大，则使用滚动条、对话框来输入某些用户信息。一旦你学会了如何使用一个窗口程序，就可以轻松地理解另一个。键盘和鼠标交互。\n\
  \n### 4. 硬件无关性编程\n正如我告诉你的，窗口程序可以轻松地调用 Windows API 函数，因此应用程序可以轻松与操作系统通信，那么 Windows\
  \ 是如何与硬件通信的呢？\n\n假设我们写了一个程序，其中包含一个菜单项，被选中后应该在窗口中显示字符串“welcome to eve reserch labs\
  \ India”（欢迎来到印度研究实验室）。该菜单项可以通过键盘或鼠标选择。在执行此程序时，它将执行初始化并等待用户输入。\n\n在用户输入任何键或点击鼠标选择菜单项后，按键或鼠标点击正如你所熟悉的\
  \ Visual Basic 编程中那样被称为“事件”（event）。该事件的发生由键盘或鼠标驱动程序感应。现在设备驱动程序会通知 Windows 这一情况。\n\
  \nWindows 随后会通知应用程序该特定事件的发生。这种通知被称为“消息”（message）。因此，操作系统与应用程序进行了通信。\n\n当应用程序接收到消息时，它通过调用\
  \ Windows API 函数与操作系统，显示字符串“welcome to EVC reserch labs India”。此 API 函数反过来与驱动屏幕的显卡驱动程序通信。因此，操作系统和应用程序之间存在双向通信。\n\
  \n### 5. 事件驱动编程模型\n当用户与窗口程序交互时，会发生很多事件。对于每个事件，都会向程序发送消息，程序对此做出反应。由于用户与程序用户界面元素交互的顺序无法预测，因此事件发生的顺序也无法预测。\n\
  \n因此，消息的顺序也变得不可预测。结果是，程序中调用函数（响应不同消息）的顺序是由事件发生的顺序决定的。因此，这种编程模型被称为“事件驱动编程模型”。\n\n\
  用户与应用程序交互的方式可能有成百种。此外，某些事件可能在没有任何用户交互的情况下发生。例如，当我们创建一个窗口时、当窗口内容需要绘制时等都会发生事件。\n\n\
  因此，字面上可能有成百条消息发送到应用程序，从而导致混乱。自然有一个问题随之而来——这些消息按什么顺序被应用程序处理？通过将所有到达应用程序的消息放入“队列”（Queue）中，这种混乱变得有序。队列中的消息按先进先出（`FIFO`）算法顺序处理。\n\
  \n事实上，操作系统维护着几个这样的队列。有一个队列是所有应用程序公共。这个队列被称为“系统消息队列”（system Message Queue）。此外，每个应用程序有一个队列。此类队列被称为“应用程序消息队列”（Application\
  \ Message Queue）。让我们理解维护这么多队列的需求。\n\n当我们点击鼠标并发生事件时，设备驱动程序将消息发布到系统消息队列中。操作系统检索此消息，找出消息是发送给哪个应用程序的。接下来，它将消息发布到点击鼠标所在的应用程序的应用程序消息队列中。\n\
  \n这就是事件驱动编程的全部内容。你的工作是预测用户可能对你的应用程序用户界面对象做什么，并准备一个函数等待，准备在适当的时间执行。至于那个时间何时，除了用户之外没人真的想说。\n\
  \n你首先需要理解的是简单软件编程与窗口 操作系统开发编程之间的区别，窗口编程模型处于“宏”（MACRO）级别，让我们深入探讨，看看为窗口 操作系统环境开发程序时将需要的一些明显问题。\n\
  \n有以下问题：\n(A) 指针的大小\n(B) 整数的大小\n(C) 大量使用 `typedef`\n\n## 1. 指针的大小\n你必须知道，Windows\
  \ 允许多个程序在内存中共存，此时它需要强大的 32 位微处理器来执行这些程序，以及简单的内存来容纳它们。当我们在内存位置存储一个值时，该内存位置的地址必须同时存储在\
  \ `c.p.u` 寄存器中。\n\n最重要的点之一是微处理器可以访问的内存量取决于 cpu 寄存器的大小。这意味着我们可以在 cpu 寄存器中存储 $2^{32}$\
  \ 个唯一地址，结果我们可以使用 32 位访问 4 GB 内存。在我们的程序中，32 位地址必须存储在指针。\n\n#### 2. 整数的大小\n我想告诉你，在\
  \ 16 位环境下整数的大小为 2 字节，另一方面，在 32 位环境下整数的大小为 4 字节。32 位后整数的范围将是 -2147483648 到 +2147483647。由此你认为\
  \ `int` 和 `long int` 之间没有区别，但如果我们想存储人的年龄呢？我们知道年龄很难超过 100，在这种情况下最好使用 `short int`。\n\
  \n\n\n\n\n150. wawpuc 打印 hello！借助 32 位编译器的帮助，例如：ms visual c++ 编译器。\n\n```cpp\n#include<windows.h>\n\
  \nInt_stdcall WinMain(HINSTANCE hlnstance, HINSTANCE hprevlnstance, LPSTR pszCmdline,\
  \ int nCMDShow)\n{\nMessageBox(0,”Hello!”,”Title”,0);\nReturn(0);\n}\n```\n\n##\
  \ 深度脑力训练笔记\n\n1. 对于 32 位操作系统开发，请始终使用 32 位编译器，如 microsoft visual c++；对于 64 位操作系统开发，请使用\
  \ 64 位编译器，好吗！！\n\n2. 我想告诉你们，每个 DOS 程序的执行都从 `main()` 函数开始；另一方面，正如你们之前看到的，每个 Windows\
  \ 程序的执行都从 `WinMain()` 函数开始。\n\n3. `_stdcall` 用在 `WinMain()` 之前它显示了 `WinMain()` 函数使用的调用约定，调用约定指示了两个点：\n\
  \n   (a) 在调用函数时，参数推入栈的顺序（从左到右或从右到左）！\n\n   (b) 调用者函数或被调用函数在调用结束时从栈中移除参数。有很多调用约定，如\
  \ `_cdecl` 和 `_stdcall`，这两种约定都从右到左传递参数。所有的 API 函数都使用 `_stdcall`，如果没有提到，编译器将假设使用\
  \ `_cdecl` 约定，好吗！！\n\n4. `HINSTANCE` 和 `LPSTR` 仅仅是类型定义（typedefs）。第一个是无符号整数，第二个是指向字符的指针。这些类型定义在\
  \ `windows.h` 中。在编写任何 Windows “c” 程序时，该头文件始终包含这些类型定义。\n\n5. `hInstance`、`hpPrevInstance`、`lpszCmdLine`\
  \ 和 `nCmdShow` 是变量名，你也可以使用 `i`,`j`,`k` 等变量名来代替它们。\n\n### 整个程序的解释\n\n`WinMain()`\
  \ 接收四个参数，如下：\n\n- `hInstance`: 这是运行中应用程序的“实例句柄”（instance handle）。Windows 在应用程序启动时创建这个\
  \ ID 数字。我们将在许多 Windows 函数中使用此值来识别应用程序数据。最重要的是，句柄仅仅是一个指向实体的 32 位数字，实体可以是光标或画刷、图标、文件、设备等任何！！\n\
  \n- `hPrevInstance`: 这个参数是早期 Windows 版本的遗留，现在不再使用，因此其值为 0。这仅显示了后兼容性。\n\n- `lpszCmdLine`:\
  \ 这是一个指向字符字符串的指针，包含传递给程序的命令行参数。这类似于 Dos 程序中传递给 `main()` 的 `argv` 和 `argc` 参数。\n\n\
  - `nCmdShow`: 传递给函数的整数值。这个整数告诉程序窗口在首次显示时应该以什么外观出现。\n\n`MessageBox()` 函数：此函数弹出一个消息框，其标题为“Title”，包含消息“Hello!”。\n\
  \n从 `WinMain()` 返回 0 表示成功，返回非零值表示失败。\n\n# 第 ∞ 21 章 – 第二部分 – ∞（编程指南）\n\n## 引言\n\n\
  本章解释了如何编写既能正常运行、又能让其他智能体理解的计算机程序！这两个属性并不是独立的！通常情况下，其他程序员无法理解的程序往往运行得并不好（更不用说它们是维护的噩梦了！）\n\
  \n编写结构化程序（结构化的代码和数据！）对调试代码有极大帮助。以下是结构化程序某些特征的快速回顾。\n\n1. 许多定义良好的函数！\n2. 使用结构化循环结构（即\
  \ `while` 和 `for`）代替 `goto`。\n3. 使用具有单一用途且有意义名称的变量。\n4. 使用结构化数据类型表示复杂数据。\n5. 使用\
  \ ADT（抽象数据类型）或 OOP（面向对象编程）编程范式。\n\n### 1. 如何开始\n\n编程中最常见的错误类型有：\n\n1. 不思考就编程。\n\
  2. 以非结构化的方式编写代码。\n\n让我们顺序来看：\n\n### 1.1 思考编程\n\n当一个真正的程序员（或编程团队）被赋予一个问题时，他们不会立即坐在终端前开始输入代码！他们首先通过思考寻找解决方案的多种方法来设计程序。\n\
  \n编程最大的迷言之一是：我越早开始编码，就能越早产生程序。事实如此！！一个在编码前规划好的程序才会变成一个运行良好的程序。\n\n那么，如何在编码之前设计程序呢？有几种不同的技术。最常用的之一被称为自顶向下设计（top-down\
  \ design）。在这里，首先创建一个程序的大纲。（本质上，首先查看 `main()` 函数的通用形式，然后递归地向下到底层。）关于如何以这种方式编写程序有很多参考文献。\n\
  \n自顶向下设计将程序划分为子任务。每个子任务都是必须解决的较小问题。通过使用算法解决问题。程序中的函数（和数据）实现了该算法。在编写实际代码之前，取一个非常典型的问题并手工追踪算法将如何解决它。这有几个作用：\n\
  \n1. 检查算法是否有效。如果它不起作用，你可以立即寻找另一种算法。注意，如果你立即开始编码，可能在输入了大量行代码后才会发现算法行不通！\n\n2. 确保你理解算法实际上是如何运行的！（如果你无法手工追踪算法，你将无法编写程序来实现它！）\n\
  \n3. 为你提供该算法简短、简单运行的细节，供以后使用。\n\n只有当你确信整个程序看起来没问题时，才开始输入代码。\n\n### 1.2 结构化编程\n\n\
  当程序是结构化的时，它被分成可以单独测试的子单元。这在调试时是一个巨大的优势！子单元的代码可以与程序的其余部分分开调试。我发现编写每个子单元时对其进行调试是非常用的。如果等到整个程序写完才进行调试，调试将困难得多。\n\
  \n必须搜索整个程序的源代码寻找错误。如果单独调试子单元，搜索错误的范围要小得多！ADT 和 OOP 范式也将程序划分为子单元。通常使用这些方法时，子单元比普通的结构化代码更加独立。这有两个主要优势：\n\
  \n1. 子单元更容易单独调试。\n2. 子单元通常可以重用到其他程序中。（因此，一个新程序可以使用早期程序中已经调试过的子单元！）\n\n\n\n\n当然，以下所有的调试方法都可以用于调试子单元，就像它们可以调试整个程序一样。再次，子单元的优势在于它们只是程序的一部分，因此比一次调试整个程序要容易得多！\n\
  \n## 2. 编译程序\n\n在输入程序（或只是程序的[子单元](http://www.drpaulcarter.com/cs/debug.php#structured)）之后，第一步是编译程序。编译过程将你输入的源代码文件转换为机器语言，并存储在对象文件（object\
  \ file）中。这被称为编译。\n\n在大多数系统中，对象文件会自动与系统库链接。这些库包含了语言库部分函数的代码。（例如，C 库包含了 `printf()`\
  \ 函数的代码。）\n\n### 2.1 编译器错误\n\n每种语言都有语法规则。这些规则决定了该语言中哪些语句是合法的，哪些是不合法的。编译器程序的设计用于执行这些规则。当规则被违反时，编译器会打印错误信息且不会创建对象文件。\n\
  \n大多数编译器在发现错误后会继续扫描源文件，并报告发现的其他错误。然而，一旦发现错误，编译器可能会被随后的完全合法的语句所困扰，并将它们报告为错误。这引出了编译器错误的第一条规则：\n\
  \n#### 编译器错误的第一规则\n\n列出的第一个编译器错误总是真实的错误；然而，随后的错误可能不是真实的错误。\n\n当删除第一个错误时，后续错误可能会消失。因此，如果后续的错误信息令人困惑，请忽略它们。修复你确定是错误的错误并重新编译。当其他真实错误被移除后，那些令人困惑的错误可能会神奇般地消失。\n\
  \n如果你有许多错误，第一个错误可能会超出屏幕。解决此问题的一种方法是使用[重定向](http://www.drpaulcarter.com/cs/unix-intro.php#Redirect)将错误保存到文件中。一个问题是错误被写到\
  \ `stderr` 而不是 `>` 重定向运算符所使用的 `stdout`。\n\n要将输出重定向到 `stderr`，请使用 `2>` 运算符。这里是一个示例：\n\
  \n```bash\n$cc x.c 2>errors\n$more errors\n```\n\n编译器只是其他人类创建的程序。它它显示的错误信息往往令人困惑（或干脆是错误的！）。不要假设错误信息所指的行总是真实错误实际所在的行。\n\
  \n编译器从上到下顺序扫描源文件。\n\n有时，直到实际错误下方很多行处，编译器仍然没有检测到错误。编译器往往太愚蠢，无法意识到这一点，并引用了源文件中它意识到某处不对劲的那一行。真实错误在代码中靠早的位置。这引出了编译器错误的第二规则：\n\
  \n#### 编译器错误的第二规则\n\n编译器错误可能由编译器所引用的行之上的任何源代码行引起；但它不会由该行下方的行引起。\n\n在 C（以及 C++）中，不要忘记\
  \ `#include` 预处理器语句会将头文件的代码插入源文件中。头文件中的错误可能会导致引用主源文件中某行的编译器错误。\n\n大多数系统允许将预处理后的代码（C\
  \ 编译器实际编译的代码！）存储在文件中。这允许你确切地看到正在编译的内容。该文件还会显示每个 C 宏是如何展开的。这对于发现通常非常难找到的错误原因非常有帮助。\n\
  \n寻找令人困惑的编译器错误原因的一种有效技术，是删除（或注释掉）之前的代码段，直到错误消失。当错误消失时，最后删除的部分一定导致了该错误。\n\n编译器还可以显示警告。警告不是语法错误；然而，它可能是程序中的逻辑错误。它标记了你程序中合法但可疑的语句。\n\
  \n除非你理解为什么生成该警告，否则你应该将警告视为错误。通常，编译器可以设置为不同的警告级别。将此级别设置得尽可能高对你有利，这样可以让编译器给出尽可能多的警告。请仔细查看这些警告！\n\
  \n#### 大脑洗训练\n\n记住，仅仅因为程序在没有错误或警告的情况下通过了编译，并不意味着该程序是正确的！它仅意味着程序的每一行在语法上都是正确的。也就是说，编译器理解了每个语句想要执行的操作。程序可能仍然存在许多逻辑错误！一篇英文论文在语法上可能是正确的（即：名词、动词等位置正确），但可能是胡言乱语。\n\
  \n### 2.2 链接错误\n\n链接器是一个程序，它将对象文件（包含来自单个源文件的编译后的机器代码）和库（对象文件集合的文件）链接在一起，以创建一个可执行程序。\n\
  \n链接器将对象文件中使用的函数和全局变量与它们在其他对象文件中定义进行匹配。链接器使用函数或全局变量的名字（通常使用术语符号）来执行匹配。\n\n最常见的链接错误是未解析的符号或名称。当使用函数或全局变量，但链接器找不到该名称的匹配时，就会发生这种错误。例如，在\
  \ IBM AIX 系统上，错误信息如下：\n\n```\n0706-317 ERROR: Unresolved or undefined symbols detected:\n\
  Symbols in error (followed by references) are dumped to the load map. The -bloadmap:<filename>\
  \ option will create a load map..\n```\n\n此信息意味着程序引用了名为 `fun`（忽略点）的函数（或全局变量），但从未定义过。这些错误的常见原因有两个：\n\
  \n#### 拼写错误的函数名称\n\n在示例中，有一个名为 `func` 的函数。这并不是编译器错误。一个源文件中的代码可以使用另一个文件中定义的函数。编译器假设任何在引用文件中被引用但未定义的函数都将在另一个文件中定义并链接。\n\
  \n只有在链接阶段才能检查这一假设。（注意，C++ 编译器通常会为此此生成编译器错误，因为 C++ 要求所有引用的函数都有原型声明！）\n\n#### 未链接正确的库或对象文件\n\
  \n链接器必须知道哪些库和对象文件用于形成可执行程序。标准 C 库会自动链接。UNIX 系统（如 AIX 系统）不会自动链接标准 C 数学库！在 AIX 系统上链接数学库，请在编译命令中使用\
  \ `-lm` 标记。例如，编译使用 `sqrt` 的程序：`cc prog.c -lm`。记住，`#include` 语句只向源文件插入文本。它也会链接库是一个常见的误区！\n\
  \n还有与链接相关的 Bug。一种难以的 Bug 发生在函数或全局变量有两个定义时。链接器会选择它找到的定义并忽略另一个。某些链接器在发生这种情况时会显示警告（AIX\
  \ 链接器不会）。另一个与链接相关的 Bug 发生在调用函数参数错误时。链接器在匹配时只查看函数名。它不进行参数检查。这里有一个示例：\n\n```c\n//\
  \ x.c\nint f(int x, int y) {\n    return x + y;\n}\n\n// y.c\nint main() {\n   \
  \ int s = f(3);\n    return 0;\n}\n```\n\n\n\n\n这些类型的错误可以通过原型（prototypes）来防止。例如，如果将原型：`int\
  \ f( int, int);`\n\n被添加到 `y.c` 中，编译器将捕获此错误。实际上，最好的主意是将原型放在头文件中，并在 `x.c` 和 `y.c`\
  \ 中包含它。为什么要使用头文件呢？\n\n这样所有文件使用的原型都是同一个，且只有一个实例。如果在每个源文件中都手动输入一个独立的实例，就无法保证每个实例都是相同的。\n\
  \n如果只有一个实例，它就不可能与自身不一致！为什么要将其包含在 `x.c`（定义函数所在的文件）中呢？为了让编译器能够检查原型，并确保它与函数的定义一致。（补充说明：C++\
  \ 使用了一种名为“名字修饰（name mangling）”的技术来捕捉这类错误。）\n\n## 3. 运行时错误\n\n运行时错误发生在程序运行期间，通常会导致程序中止。在\
  \ `UNIX/Linux` 系统上，中止的程序会创建一个 `coredump`（核心转储）。\n\n`coredump` 是一个名为 `core` 的二进制文件，包含了程序中止时状态的信息。诸如\
  \ `gdb` 和 `dbx` 等调试器可以读取此文件，并告诉你关于程序中止时正在做什么有用信息。运行时错误有几种类型：\n\n### 非法内存访问\n\n这可能是最常见的错误类型。在\
  \ `UNIX/Linux` 下，程序将产生 `Segmentation fault(coredump)` 信息并生成 coredump。\n\n使用 `Win95`\
  \ 或 `NT`，程序也会中止。然而，传统的 `DOS` 不检查非法内存访问；程序继续运行，但结果是不可预测的。\n\n`DOS` 的 Borland/Turbo\
  \ C/C++ 编译器会检查写入 `NULL` 地址的数据。然而，在程序终止之前，不会显示 `NULL pointer assignment` 错误消息。\n\n\
  ### 除以零\n\n所有的操作系统都会检测到此错误并中止程序。\n\n## 4. 调试工具\n\n许多调试程序的方法都是详细地将程序的行为与正确行为进行比较。通常情况下，程序的正常输出不会显示所需的详细信息。调试工具允许你更详细地检查程序的行为。\n\
  \n### 4.1 assert 宏\n\n`assert` 宏是在 C/C++ 程序中放置调试测试的一种快速且简单的方法。要使用此宏，你必须在源文件的顶部附近包含\
  \ `assert.h` 头文件。使用 `assert` 非常简单。格式如下：\n\n```\nassert(boolean (or int) expression);\n\
  ```\n\n如果布尔表达式求值为为真（即非零），则 `assert` 什么都不做。然而，如果它的求值为为假（零），`assert` 会打印一条错误消息并中止程序。例如，考虑以下\
  \ assert：`assert( x != 0 );`\n\n如果 `x` 为零，将显示以下内容：\n\n```\nAssertion failed: x !=\
  \ 0, file err.c, line 6\nAbnormal program termination\n```\n\n然后程序将中止。请注意，实际的断言内容、文件名以及文件中的行号都会被显示。\n\
  \n`assert` 宏对于在程序中加入健全性检查（sanity checks）非常有用。这些是如果程序运行正常，则就应该始终为真的条件。它不应该用于检查用户错误（例如当用户请求读取的文件不存在时）。对于这些运行时错误应该使用普通的\
  \ `if` 语句。\n\n当然，在商用程序中，断言失败对终端用户并没有特别帮助。此外，检查断言会让程序运行速度至少比不检查时慢一点。幸运的是，即使不删除它，也可以禁用\
  \ `assert` 宏。\n\n如果定义了宏 `NDE`（在包含 `assert.h` 的语句上方！），`assert` 宏将什么都不做。如果以后需要启用断言，只需删除定义\
  \ `NDE` 的行即可。（如果使用了这种技术，请确保 `assert` 语句没有执行程序正确运行所需的代码。如果定义了 `NDE`，这些代码将不会执行！）\n\
  \n### 4.2 打印语句\n\n这种久受尊敬的调试方法涉及在程序中大量地插入调试打印语句。打印语句的设计应该能够同时显示程序正在执行哪些代码，以及关键变量的值是多少。\n\
  \n### 4.3 调试器\n\n之前通过添加打印语句进行调试的方法方法有两个缺点：\n\n1. 当添加新的打印语句时，必须重新编译程序。\n2. 输出信息是固定的，在程序运行时无法进行更改。\n\
  \n源码级调试器提供了一种更简单的方法来跟踪程序的执行情况。它们允许人们：\n\n1. 在程序运行时查看任何变量的值。\n2. 当程序到达任何所需的语句时暂停执行。（程序中的此位置被称为\
  \ `breakpoint` 断点）。\n3. 逐语句地单步执行程序。\n\n我强烈建议你无论在什么系统上编程，都学习使用调试器。在调试程序时，调试器可以节省大量时间！\n\
  \n### 4.4 Lint\n\n`lint` 程序检查 C 程序是否存在常见的 bug。它会扫描你的 C 源代码并打印出可能的问题列表。请注意，`lint`\
  \ 非常挑剔！例如，这一行：`printf(\"Hello, World \");`\n\n将产生一条警告消息，因为 `printf` 返回一个未被存储的整数值。`printf`\
  \ 的返回值通常会被忽略，但 `lint` 仍然会产生警告。有几种方法可以让 `lint` 对这条语句满意，其中一种是：\n\n`(void) printf(\"\
  Hello, World \");`-这表示忽略返回值。\n\n### 4.5 步步跟踪（Walk through）\n\n步步跟踪（Walk through）手动检查程序逻辑的过程。程序员和别人（最好是另一个程序员）坐在一起对程序进行例如。通常情况下，程序员本人会在解释程序应该如何工作并仔细查看代码的过程中发现\
  \ bug。\n\n然而，程序员很容易就“知道”程序应该做什么，而对程序实际在做什么视而不见。学生在使用这种方法时需要非常小心。同一个班的两个学生不应该一起对程序进行跟踪。\n\
  \n## 5. 通用技巧\n\n这里有一些调试的通用技巧。\n\n### 5.1 发现 bug\n\n在移除 bug 之前，必须先发现它们！\n\n- 激进地测试程序！\n\
  - 从可以容易手动检查的小问题开始（你应该在规划阶段就想好了！）\n- 程序的每个功能至少测试一次！一次真的足够吗？尽可能以不同的方式测试功能。\n- 不要忘记测试简单的问题。\n\
  - 不要对输入数据做无效假设。\n\n### 5.2 确定 bug 的原因\n\nbug 只能由已经执行执行代码引起。确保你不要在搜索尚未运行的代码上浪费时间。可以使用调试器或打印语句来确定哪些代码已经执行，哪些尚未执行。\n\
  \n- 不要通过盲目修改代码直到它看起来有效来修复 bug。你需要弄清楚为什么一个语句有效而另一个无效。你应该对每一行代码都有一个合理的理由。“没有这一行就不行了”并不是一个合理的理由！\n\
  \n\n\n一个包含大量 bug 和/或严重干扰其功能的程序的程序被认为是有缺陷的（buggy）。详细描述程序中 bug 的报告通常被称为 bug 报告、缺陷报告、故障报告、问题报告、麻烦报告、变更请求等。\n\
  \n# bug 是如何进入软件的\n\n在软件开发项目中，在开发的任何阶段都可能引入“错误”或“故障”。bug 是编程任务中人为因素性质导致的结果。它们源于软件团队在规范制定、设计、编码、数据录入和文档编写过程中产生的疏忽或相互误解。\n\
  \n例如，\n\n在创建一个相对简单的程序来对单词列表按字母顺序排序时，某人的设计可能没有考虑当单词包含连字符时应该发生什么。也许，当将抽象设计转换为选择的编程语言时，\n\
  \n# 预防\n\n软件行业已经投入了大量精力寻找方法，防止程序员在编写软件时无意中引入 bug。这些方法包括：\n\n### 编程风格\n\n虽然程序代码中的拼写错误通常会被编译器捕获，但当程序员犯逻辑错误时，bug\
  \ 通常就会出现。编程风格和防御性编程的各种创新旨在降低这些 bug 发生的概率，或者使其更容易被发现。\n\n在某些编程语言中，所谓的拼写错误（尤其是符号或逻辑/数学运算符）实际上代表了逻辑错误，因为这些编写错误的结构被编译器接受后，其含义与程序员的意图不同。\n\
  \n### 编程技术\n\nbug 经常会导致运行程序的内部数据产生不一致性。可以编写程序使其在运行时检查其自身内部数据的一致性。如果遇到不一致性，程序可以立即停止，以便定位并修复\
  \ bug。或者，程序可以简单地通知用户，尝试修正不一致性并继续运行。\n\n### 开发方法\n\n有多种管理程序员活动的方案，以便产生更少的 bug。其中许多方案属于软件工程学科（该学科也处理软件设计问题）。例如，使用形式程序规范来阐述程序的精确行为，从而消除设计\
  \ bug。\n\n遗憾的是，由于组合爆炸和不确定性问题，对于短程序以外的任何程序，形式化规范都是不实际或可能的[需要引用]。\n\n在现代，流行的方法包括自动化单元测试和自动化验收测试（有时甚至达到测试驱动开发的极端），以及敏捷软件开发（通常与自动化测试结合，在某些情况下甚至是强制要求的自动化测试）。\n\
  \n所有这些方法都旨在引入 bug 和规范不当的需求后尽快捕获它们，这使得它们更容易、更便宜地修复，并在进入生产使用之前至少捕获其中的一部分。\n\n### 编程语言支持\n\
  \n编程语言通常包含帮助程序员防止 bug 的功能，例如静态类型系统、受限命名空间和模块化编程等。例如，当程序员编写（伪代码）`LET REAL_VALUE PI\
  \ = \"THREE AND A BIT\"` 时，尽管在语法上可能是正确的，但代码未能通过类型检查。取决于语言和实现，这可能由编译器或在运行时捕获。\n\n\
  此外，许多最近发明的语言故意排除了容易导致 bug 的功能，代价是让代码比所需的运行慢：其通用原则是，由于摩尔定律，计算机变得越来越快，而软件工程师变得越来越慢；编写简单、更慢的代码比编写“聪明”、晦懂的代码要好得多，特别是考虑到维护成本是巨大的。例如，Java\
  \ 编程语言不支持指针算术；Pascal 等语言的实现以及脚本语言通常具有数组运行时边界检查，至少在调试版本中是。\n\n### 代码分析\n\n代码分析工具通过检查编译器之外的程序文本来发现潜在问题，从而帮助开发者。尽管通常情况下，给定规范寻找所有编程错误的问题是不可解的（参见停机问题），但这些工具利用了人类程序员在编写软件时倾向于犯同类错误的事实。\n\
  \n### 工具\n\n监控软件运行性能的工具（无论是专门为了寻找瓶颈等问题，还是为了确保正确运行）都可能显式地嵌入代码中（可能仅仅是一条简单的 `PRINT\
  \ \"I AM HERE\"` 语句），或者作为工具提供。发现某段代码消耗了大部分时间往往令人感到惊讶，这种对假设的消除可能会导致代码被重写。\n\n###\
  \ 调试\n\n调试是一个寻找并减少计算机程序中 bug 或缺陷（错误）数量的系统化过程，从而使其行为符合预期。寻找和修复 bug（或“调试”）一直是计算机编程的重要部分。早期计算先驱\
  \ Maurice Wilkes 在 20 世纪 40 年代后期意识到，他余生的大部分时间将花在寻找自己程序中的错误上。随着计算机程序变得复杂，bug 变得越来越常见且难以修复。软件测试人员是专业人士，首要任务是寻找\
  \ bug 或编写代码支持测试。在某些项目中，花在测试上的资源可能比开发程序还要。\n\n通常，调试最困难的部分是在源代码中寻找 bug。一旦找到，修复它通常是容易的。存在被称为调试器的程序，它们通过逐行执行代码、观察变量值以及观察程序行为的其他功能来帮助程序员定位\
  \ bug。\n\n如果没有调试器，则可以添加代码将消息或值写入控制台（例如在 C 语言中使用 `printf`）或写入窗口或日志文件，以追踪程序执行情况或显示值。\n\
  \n然而，即使有调试器的帮助，定位 bug 某种程度上也是艺术。程序某部分的 bug 导致完全不同部分的故障并不罕见[需要引用]，这使得追踪它变得特别困难（例如，图形渲染例程中的错误导致文件\
  \ I/O 例程失败），且发生在系统中看似无关的部分。\n\n\n\n`=` 运算符专门用于赋值，并返回被赋值的值。`==` 运算符专门用于比较，并返回一个整数值（0\
  \ 为假，非 0 为真）。由于这些返回值，当用户本意想使用 `==` 却误用了 `=` 时，C 编译器通常不会报错。\n\n例如：\n\n```c\nint x\
  \ = 5;\nif ( x = 6 ) printf(\"x equals 6\\n\");\n```\n\n这段代码输出了 \"x equals 6\"！为什么呢？`if`\
  \ 内部的赋值操作将 `x` 设置为 `6`，并向 `if` 返回值 `6`。由于 `6` 不是 `0`，因此这被解释为真。\n\n让编译器发现此类错误的一种方法是将任何常量（或任何右值表达式）放在左侧。这样，如果使用了\
  \ `=`，它就会变成一个错误：\n\n```c\nif ( 6 = x)\n```\n\n## scanf() 错误\n\n常见的 `scanf()` 错误有两类：\n\
  \n### 1. 忘记在参数上加上取地址符 (`&`)\n`scanf()` 必须拥有用于存储输入的变量地址。这意味着通常需要使用取地址符 `&` 来计算地址。\n\
  \n这是一个示例：\n\n```c\nint x;\nchar * st = malloc(31);\nscanf(\"%d\", &x);         \
  \      /* 需要 & 来传递地址给 scanf() */\nscanf(\"%30s\", st);             /* 这里不需要 &，st\
  \ 本身就指向变量！ */\n```\n\n如上面最后一行所示，有时不需要取地址符才是正确的！\n\n### 2. 对操作数使用了错误的格式\nC 编译器不会检查\
  \ `scanf()` 调用中用的参数是否使用了正确的格式。最常见的错误是为 `double` 类型使用 `%f` 格式（必须使用 `%lf` 格式），以及在字符和字符串之间混淆了\
  \ `%c` 和 `%s`。\n\n## 数组的大小\n\nC 语言中的数组始终从索引 0 开始。这意味着一个定义为 10 个整数的数组：\n\n```c\n\
  int a[10];\n```\n\n其有效索引是从 0 到 9，而不是 10！学生在处理数组时，索引越界的情况非常常见。这可能导致程序出现不可预知的行为。\n\
  \n## 整数除法\n\n与 Pascal 不同，C 使用 `/` 运算符同时处理实数除法整数除法。理解 C 如何确定执行哪种操作非常重要。如果两个操作数都是整数类型，则使用整数除法；否则使用实数除法。例如：\n\
  \n```c\ndouble half = 1/2;\n```\n\n这段代码将 `half` 设置为 0，而不是 0.5！为什么？因为 `1` 和 `2` 是整数常量。要修复这个问题，请将其中至少一个改为实数常量。\n\
  \n```c\ndouble half = 1.0/2;\n```\n\n如果两个操作数都是整数变量且需要实数除法，将其中一个变量转换为 `double`（或\
  \ `float`）。\n\n```c\nint x = 5, y = 2;\ndouble d = ((double) x)/y;\n```\n\n## 循环错误\n\
  \n在 C 中，循环会重复循环语句之后的后续语句。以下代码：\n\n```c\nint x = 5;\nwhile( x > 0 );\nx--;\n```\n\
  \n是一个无限循环。为什么？`while` 面的分号将要重复的语句定义为空空语句（即什么都不做）。去掉分号，循环就能按预期工作。\n\n另一个常见的循环错误是迭代次数多一次或少了一次。请仔细检查循环条件！\n\
  \n## 未使用函数原型\n\n函数原型（Prototypes）告诉编译器函数的重要特征：返回值和函数参数。如果没有提供原型，编译器会假设函数返回 `int`\
  \ 并可以接受任意数量、任意类型的参数。\n\n使用原型的一个重要原因是让编译器检查函数调用中参数列表的错误。然而，如果函数的返回值不是 `int`，则必须使用原型。例如，`sqrt()`\
  \ 函数返回 `double` 而不是 `int`。\n\n以下代码：\n\n```c\ndouble x = sqrt(2);\n```\n\n如果在其它上方没有出现原型：\n\
  \n```c\ndouble sqrt(double);\n```\n\n它将无法正常工作。为什么？在没有原型的情况下，C 编译器假设 `sqrt()` 返回一个\
  \ `int`。由于返回值被存储在 `double` 变量中，编译器会插入代码将该值转换为 `double`。这种转换是不必要的，并且会导致错误的值。\n\n\
  解决此问题的办法是包含包含 `sqrt()` 原型的正确 C 头文件 `math.h`。对于你编写的函数，必须将原型放在源文件的顶部，或者创建一个头文件并包含它。\n\
  \n## 未初始化指针\n\n每当你使用指针时，你都应该回答：它指向什么？如果你无法回答这个问题，它可能没有指向任何变量。这类错误在 UNIX/Linux 上经常会导致段错误（Segmentation\
  \ fault/coredump），在 Windows 下会导致通用故障。（在旧的 DOS 下，任何事情都可能发生！）\n\n这是一个此类错误的示例：\n\n\
  ```c\n#include <string.h>\nint main() {\n    char * st; /* 定义了一个指向字符数组的指针 */\n \
  \   strcpy(st, \"abc\"); /* st 指向哪个数组？ */\n    return 0;\n}\n```\n\n如何正确操作？要么使用数组，要么动态分配数组。\n\
  \n```c\n#include <string.h>\nint main() {\n    char st[20]; /* 定义一个数组 */\n    strcpy(st,\
  \ \"abc\");\n    return 0;\n}\n```\n\n```c\n#include <string.h>\n#include <stdlib.h>\n\
  int main() {\n    char *st = malloc(20); /* 指向分配的数组 */\n    strcpy(st, \"abc\");\
  \ /* 指向数组 */\n    free(st); /* 结束时不要忘记释放！ */\n    return 0;\n}\n```\n\n实际上，第一种方案在需要动态分配时要更好。使用普通数组不容易出错。\n\
  \n## 字符串错误\n\n### 1. 混淆字符常量和字符串常量\n\nC 认为字符常量和字符串常量是不同的。字符常量用单引号，字符串常量用双引号。字符串常量充作为字符串的指针。考虑以下代码：\n\
  \n```c\nchar ch = 'A'; /* 正确 */\nch = \"A\";      /* 错误 */\n```\n\n第二行将字符变量 `ch`\
  \ 赋值为字符串的地址。这应该产生编译器错误。如果将字符串指针赋值给字符常量，也会发生这种情况：\n\n```c\nchar * st = \"A\"; /*\
  \ 正确 */\nconst char * st = 'A'; /* 错误 */\n```\n\n### 2. 使用 == 比较字符串\n\n永远不要使用 `==`\
  \ 运算符来比较字符串的值！字符串是字符数组。数组的名字就像指向字符串的指针（与其他类型的数组一样）。那怎样？考虑以下代码：\n\n```c\nchar st1[]\
  \ = \"abc\";\nchar st2[] = \"abc\";\nif ( st1 == st2 )\n    printf(\"Yes\");\nelse\n\
  \    printf(\"No\");\n```\n\n这段代码输出了 \"No\"。为什么？因为 `==` 运算符比较的是 `st1` 和 `st2` 的指针值，而不是它们指向的数据。比较字符串值的正确方法是使用\
  \ `strcmp()` 库函数（确保包含 `string.h`）。如果将上面的 `if` 语句替换为：\n\n```c\nif ( strcmp(st1,st2)\
  \ == 0 )\n    printf(\"Yes\");\nelse\n    printf(\"No\");\n```\n\n代码将输出 \"Yes\"\
  。由于同样的原因，不要对字符串使用其他关系运算符（`<`、`>` 等）。在这里也使用 `strcmp()`。\n\n### 3. 未对字符串进行终止\n\nC\
  \ 假设字符串是一个带有空字符终止的字符数组。该空字符的 ASCII 值为 0，可以表示为 `0` 或 `'\\0'`。\n\n该值被用于标记字符串中有效数据的结束。如果缺失该值，许多\
  \ C 字符串函数将继续处理有效数据之后的数据，通常会越越字符数组本身的边界，直到在内存中偶然遇到零字节为止！\n\n大多数创建字符串的 C 库字符串函数总是正确地终止它们。有些则不会（例如\
  \ `strncpy()`）。请务必仔细阅读它们的描述。\n\n\n\n\n### 3.4 未为空终止符留留空间\n\nC 语言的字符串在有效数据的末尾必须有一个空终止符（null\
  \ terminator）。一个常见的错误是没有为这个额外的字符分配空间。例如，下面定义的字符串：\n\n```c\nchar str[30];\n```\n\n\
  它实际上只能容纳 29 个（而不是 30 个）数据字符，因为在最后一个数据字符之后必须出现一个空字符。\n\n这在动态分配中也可能导致问题。以下是分配精确大小的字符串以容纳另一个字符串拷贝的正确方法：\n\
  \n```c\nchar * copy_str = malloc(strlen(orig_str) + 1); strcpy(copy_str, orig_str);\n\
  ```\n\n常见的错误是忘记给 `strlen()` 的返回值加 1。`strlen()` 函数返回的是数据字符的数量，不包括空终止符。\n\n这类错误非常难以检测。它可能不会引起任何问题，或者只在极端情况下产生问题。在动态分配的情况下，它可能会破坏堆（程序用于动态分配的内存区域），并导致下一次堆操作（`malloc()`、`free()`\
  \ 等）失败。\n\n## 4. 输入输出错误\n\n#### 4.1 错误地使用 fgetc() 等\n\n`fgetc()`、`getc()` 和 `getchar()`\
  \ 函数都返回一个整数值。\n\n例如，`fgetc()` 的原型是：`int fgetc( FILE * );`\n\n有时这个整数值确实是一个简单的字符，但有一种非常重要的情况，返回值不是字符！\n\
  \n这个值是什么呢？`EOF`。学生中一个常见的误解是文件末尾有一个特殊的 `EOF` 字符。文件末尾并没有存储特殊的字符。`EOF` 是函数返回的整数错误代码。以下是使用\
  \ `fgetc()` 的错误方法：\n\n```c\nint count_line_size( FILE * fp )\n{\n  char ch;\n  int\
  \ cnt = 0;\n  while( (ch = fgetc(fp)) != EOF && ch != '\\n') cnt++;\n  return cnt;\n\
  }\n```\n\n这有什么问题？问题发生在 `while` 循环的条件中。为了说明，这里是重写的循环，展示了 C 语言在后台执行的操作。\n\n```c\n\
  while( (int) ( ch = (char) fgetc(fp) ) != EOF && ch != '\\n')\n  cnt++;\n```\n\n\
  `fgetc(fp)` 的返回值被强制转换为 `char` 以将结果存储在 `ch` 中。然后 `ch` 的值必须强制转换回 `int` 才能与 `EOF` 进行比较。那怎样？\n\
  \n将一个 `int` 值强制转换为 `char` 再转换回 `int` 可能无法还原原始的 `int` 值。这意味着在上面的示例中，如果 `fgetc()`\
  \ 返回了 `EOF` 值，强制转换可能会改变值，导致后续与 `EOF` 的比较为假。\n\n解决方案是什么？如下所示将 `ch` 变量设为 `int`：\n\n\
  ```c\nint count_line_size( FILE * fp )\n{\n  int ch;\n  int cnt = 0;\n  while( (ch\
  \ = fgetc(fp)) != EOF && ch != '\\n') cnt++;\n  return cnt;\n}\n```\n\n现在唯一的隐藏强制转换是在第二次比较中。\n\
  \n```c\nwhile( (ch = fgetc(fp)) != EOF && ch != ((int) '\\n') ) cnt++;\n```\n\n\
  这种强制转换完全没有副作用！所以，这一切的教训是：始终使用 `int` 变量来存储 `fgetc()`、`getc()` 和 `getchar()` 的结果。\n\
  \n#### 4.2 错误地使用 feof()\n\n对于 C 语言中 `feof()` 函数的工作原理存在广泛的误解。许多程序员像使用 Pascal 的 `eof()`\
  \ 函数一样使用它。然而，C 的函数工作方式不同！\n\n区别在哪里？Pascal 的函数如果下次读取因为文件末尾而失败，则返回真。而 C 的函数在上一次函数调用失败时返回真。这里有一个误用\
  \ `feof()` 的示例：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n  FILE * fp = fopen(\"\
  test.txt\", \"r\");\n  char line[100];\n  while( ! feof(fp) ) {\n    fgets(line,\
  \ sizeof(line), fp);\n    fputs(line, stdout);\n  }\n  fclose(fp);\n  return 0;\n\
  }\n```\n\n这个程序会打印两次输入的最后一行。为什么？在读取并打印最后一行之后，`feof()` 仍然返回 0（假），循环继续。下一次 `fgets()`\
  \ 失败，因此持有最后一行内容的 `line` 变量被改变并再次打印。之后，`feof()` 将返回真（因为 `fgets()` 失败了），循环结束。\n\n\
  应该如何修复？一种方法如下：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n  FILE * fp = fopen(\"\
  test.txt\", \"r\");\n  char line[100];\n  while( 1 ) {\n    fgets(line, sizeof(line),\
  \ fp);\n    if ( feof(fp) ) /* 在 fgets() 之后检查 EOF */ break;\n    fputs(line, stdout);\n\
  \  }\n  fclose(fp);\n  return 0;\n}\n```\n\n#### 4.3 在缓冲区中留下字符\n\nC 语言输入通常是缓冲的。这意味着每一行输入都存储在缓冲区中。问题发生在\
  \ `scanf()` 之前没有处理缓冲区中的所有数据。例如，考虑以下代码：\n\n```c\nint x;\nchar st[31];\nprintf(\"\
  输入一个整数: \");\nscanf(\"%d\", &x);\nprintf(\"输入一行文本: \");\nfgets(st, 31, stdin);\n\
  ```\n\n`fgets()` 不会读取输入的文本。相反，它可能会读到一个空行。事实上，程序甚至不会等待 `fgets()` 的输入。为什么？`scanf()`\
  \ 调用读取了整数所需的字符，但它将 `'\\n'` 留在缓冲区中。`fgets()` 随后从缓冲区开始读取数据。\n\n解决方案是什么？一种简单的方法是读取并丢弃缓冲区中的所有字符，直到在\
  \ `scanf()` 调用之后遇到 newline。由于这可能在很多地方使用，将其变为函数是有意义的。这里有一个实现此功能的函数：\n\n```c\n/* dump_line\n\
  * 此函数读取并丢弃文件中当前行的剩余字符。\n* 参数:\n* fp - 用于读取字符的文件指针\n* 前提条件:\n* fp 指向已打开的文件\n* 后置条件:\n\
  * fp 指向的文件位于行尾或文件末尾。\n*/\nvoid dump_line( FILE * fp )\n{\n  int ch;\n  while( (ch\
  \ = fgetc(fp)) != EOF && ch != '\\n' )\n    /* 空函数体 */;\n}\n```\n\n这是使用上述函数修复后的代码：\n\
  \n```c\nint x; char st[31]; printf(\"输入一个整数: \"); scanf(\"%d\", &x); dump_line(stdin);\
  \ printf(\"输入一行文本: \"); fgets(st, 31, stdin);\n```\n\n一种错误的解决方案是使用以下代码：\n\n```c\n\
  fflush(stdin);\n```\n\n这可以通过编译，但其行为在 ANSI C 中是未定义的。`fflush()` 函数仅旨在用于用于输出的流，而不是输入流。这种方法在某些\
  \ C 编译器中似乎有效，但完全不可移植！因此，不应使用它。\n\n\n\n\n\n## 4.4 使用 `gets()` 函数\n\n不要使用此函数！它不知道传递给它的字符串可以安全地存储多少个字符。因此，如果读取的字符过多，内存将被损坏。\n\
  \n互联网上许多被利用的安全漏洞都利用了这一事实！请使用 `fgets()` 函数代替（并从 `stdin` 读取）。但记住，与 `gets()` 不同，`fgets()`\
  \ 不会丢弃输入中的终止换符 `\\n`。\n\n`scanf()` 函数也可以被危险地使用。`%s` 格式可能会覆盖目标字符串。然而，通过指定宽度可以安全地使用它。例如，格式\
  \ `%20s` 读取字符不会超过 20 个。\n\n![](img/image01171.jpeg)\n\n# 第 23 章 – 第二部分\n\n# (使用\
  \ C 语言进行实时软件开发)\n\n## 大脑训练笔记\n\n如果你在任何代码中发现任何错误，不要沮丧，尝试调试（修复它们）。用尽你大脑的每一个脉冲，如果我引导你达到了\
