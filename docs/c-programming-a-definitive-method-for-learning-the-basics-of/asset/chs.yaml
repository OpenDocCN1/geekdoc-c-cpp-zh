  ## 166. 接收密码的 C 程序\n\n这是一个简单的登录程序。在接收密码时，它会使用 `*` 符号掩盖每个字符，并在用户按下回车键后显示密码。\n\n```c\n\
  #include<stdio.h>\n#include<conio.h>\nchar pw[25],ch;\nint i;\n\nvoid main()\n{\n\
  \    clrscr();\n    puts(\"Enter password\");\n    while(1)\n    {\n        if(i<0)\
  \ i=0;\n        ch=getch();\n        if(ch==13) break; /*13 是回键的 ASCII 值*/\n   \
  \     if(ch==8) /*退格键的 ASCII 值*/\n        {\n            putch('\\b');\n       \
  \     putch(NULL);\n            putch('\\b');\n            i--;\n            continue;\n\
  \        }\n        pw[i++]=ch; \n        putch('*'); \n    }\n    pw[i]='\\0';\n\
  \    printf(\"\\n\\n%s\",pw);\n    getch();\n}\n```\n\n### 练习笔记\n\n对于每一个“C”图形化程序，请确保你已经根据你的主板安装了图形驱动程序。否则，将无法运行任何包含图形化程序的程序。\n\
