  \n![](img/image01061.jpeg)\n![](img/image01062.jpeg)\n\n# (字符串 (字符数组))\n\n## 介绍\n\
  \n字符串是字符数组。任何包含双引号之间的字符组（双引号本身）被称为字符串常量。\n\n字符串是以空字符 (`\\0`) 终止的一维字符数组。\n例如：`char\
  \ s[10] = {‘s’,’h’,’i’,’v’,’a’,’m’,’\\0’};`\n\n![](img/image01063.jpeg) S H I V\
  \ A M \\0 p o H\n\n数组中的每个字符占用一个字节的内存，最后一个字符总是 `\\0`。这个 `\\0` 被称为空字符。它定义了字符串的结束。因为这个字符的存在，处理字符串的各种函数能够知道字符串的结束。\n\
  \n因此可以说，给字符串的输入在空字符 `\\0` 处终止。剩余的数组包含垃圾值。\n\n**练习笔记：** 空字符 `\\0` 看起来像输入了两个字符，但编译器将其视为单个字符。它是一个转义序列。\n\
  \n还要记住 ‘0’ 与 `\\0` 是不同的。“0” 的 ASCII 值为 48，而 `\\0` 的 ASCII 值为 0。\n\n### 字符数组初始化\n\
  \n1. `char s[10];`\n2. `char s[7] = {‘s’,’h’,’i’,’v’,’a’,’m’,’\\0’};`\n3. `char\
  \ s[7] = {‘s’,’h’,’i’,’v’,’a’,’m’};`\n4. `char s[7] = “shivam”;`\n5. `char s[ ]\
  \ = {‘s’,’h’,’i’,’v’,’a’,’m’,’\\0’};`\n\n让我们观察字符串的几个重要方面——\n\n1. 在最后一个声明中缺少了空字符，即编译器会在字符串末尾自动添加一个\
  \ `\\0`。\n2. 字符串的大小应该等于字符串中最大字符数加一。\n3. 允许在不指定大小的情况下初始化字符串，就像整数数组一样。在这种情况下，数组的大小将根据初始化的元素数量自动确定。\n\
  \n### 字符串输入\n\n常用的输入函数是 `scanf`。该函数也可以用格式指定符 `%s` 来输入字符串。\n例如：\n`scanf(“%s”,name);`\n\
  \n在输入字符串时，不需要 `&`（地址操作符）。\n\n`scanf` 函数的一个问题是它会在遇到第一个空白字符时结束输入（空白字符包括空格、制表符、回车、分页符、换行符）。\n\
  因此，如果输入以下行作为输入——\nShivam Kumar\n那么只有字符串 “Shivam”会被输入到变量 `name` 中，因为单词 “Shivam” 之后的空格会结束字符串。\n\
  \n很多时候需要读取整行文本，使用 `scanf` 是无法实现的。这可以通过使用 `getchar` 函数来实现。该函数一次读取一个字符并存储在数组中。因此，我们必须使用循环重复使用此函数，直到用户输入空字符或换行字符。\n\
  \n另一个可以输入字符串的函数叫做 `gets()`。它的用法如下：\n```c\nchar name[10];\ngets(name);\n```\n该函数也可以读取空格，从而一次性将整行作为输入。\n\
  \n### 字符串输出\n\n常用的输出函数 `printf()` 也可以用格式指定符 `%s` 用于字符串，将字符串显示在屏幕上。\n```c\nprintf(“%s”,name);\n\
  ```\n**练习笔记** - 也可以使用函数 `puts()`。\n```c\nputs(name);\n```\n\n字符串的精度也可以指定，`%10.3`\
  \ 表示前三个字符打印在宽度为 10 列的字段中。在字符串之前会打印 7 个空格。但如果指定为 (`%-10.4)`，则字符串将左对齐打印，所有的 7 个空格将打印在右侧。\n\
  \n1. 记住，如果字段宽度小于字符串长度，则打印等于字符串长度的字符串。`printf(“%3.4s”,name);` 将打印 4 个字符而不是 3 个。\n\
  2. 小数右侧输入的整数值指定要打印的字符数。\n3. 如果指定的打印字符数为 0，则什么都不打印。\n\n```c\nchar name[10]=”Shivam\
  \ Kumar”; \nprintf(“%s”,name); \nprintf(“%6s”,name); \nprintf(“%12.6s”,name); \n\
  printf(“%-12.6s”,name);\nprintf(“%.2s”,name);\n```\n\n# 一些求解程序\n\n1. **编写程序按升序排序给定列表中的名称。**\n\
