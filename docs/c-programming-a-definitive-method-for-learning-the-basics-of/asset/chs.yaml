  \n# 第 13 章 杂题\n\n## 引言\n\n### 宏\n我们已经知道 `#define` 语句可以用于定义符号常量。因此，常量提供了一种简写形式。`define`\
  \ 语句可以用于定义宏，即它们可以用于替换这些表达式、完整语句或一组语句。\n\n使用宏寻找两个数最大值的程序：\n```c\n#define max(a,b)\
  \ (a>b)?a:b\nmain()\n{\n    int a,b,ans;\n    printf(\"Enter two numbers\");\n \
  \   scanf(\"%d %d\",&a,&b);\n    ans = max(a,b);\n    printf(\"max = %d\",ans);\n\
  }\n```\n该程序包含一个宏 `max`，它代表表达式 `(a>b)?a:b`。当程序编译时，表达式 `(a>b)?a:b` 会替换标识符 `max`。宏的定义通常放置在文件的开头，位于第一个函数定义之前。宏的作用范围是全局的。多行宏也可以通过在每行（最后一行外）末尾放置反斜杠来定义。此特性允许单个宏表示为复合语句。\n\
  \n### 将变量声明为常量\n我们可能希望某些变量的值在程序执行期间不能改变。这可以通过初始化时使用关键字 `const` 声明变量来实现，例如\n```c\n\
  const float PI=3.14;\n```\n此声明告诉编译器 `pi` 的值在程序执行期间不能改变。\n\n### 将变量声明为 volatile\n\
  ANSI 标准定义了另一个限定符 `volatile`，可以显式告诉编译器，变量的值可能会被某些外部源（程序外部）随时更改。\n```c\nvolatile int\
  \ date;\n```\n即使 `date` 没有出现在赋值语句的左侧，其值也可能被某些外部因素改变。\n\n### 注意事项\n记得 `stdio.h` 必须被包含。使用\
  \ `volatile` 变量时，编译器会检查 `volatile const date = 150`。\n\n### 定义符号常量\n我们经常在程序中使用常量。这些常量可以在程序中多次出现。例如\
  \ `pi` 的值始终为 `3.14`：\n```c\n#define PI 3.14\n```\n`#` 称为处理器或编译器指令。我们已经知道 `PI` 是常量，因此在整个程序中保持不变。符号常量也称为常量标识符。对于\
  \ `#define` 语句遵循以下规则：\n- 为了区分变量和符号常量，符号常量使用大写![](img/image0982.jpeg)\n- `#` 与 `define`\
  \ 之间没有空格![](img/image0982.jpeg)\n- `define` 与符号常量之间需要空格![](img/image0982.jpeg)\n\
  - 符号名不带数据类型![](img/image0982.jpeg)\n- `#define` 语句不分号结尾![](img/image0982.jpeg)\n\
  - `#define` 语句可以出现在程序的任何地方，但在使用之前。但它们通常出现在 `main()` 之前。\n\n### 预处理器指令\n预处理器正如其名，是在通过编译器之前处理源代码的程序。\n\
  \n### C 预处理器\n预处理器是一系列在编译开始时执行的特殊语句。这些被称为指令。一些预处理器包括：\n\n1. `#include`：用于包含头文件。\n\
  2. `#define`：该语句用于定义符号常量和宏：即等价于表达式的单一标识符。\n\n例如：\n```c\n#include<stdio.h>\n#define\
  \ area length*width\nmain()\n{\n    int length, width;\n    printf(\"enter length\
  \ and width\");\n    scanf(\"%d %d\",&length,&width);\n    printf(\"\\n area is\
  \ %d\",area);\n}\n```\n\n3. `#if`, `#elif`, `#else` 和 `#endif` 根据一个或多个真假条件允许源程序进行条件编译。它们也与\
  \ `defined` 运算符配合使用。\n\n例如：\n```c\n#if defined(FOREGROUND)\n    #define BACKGROUND\
  \ 0\n#else\n    #define FOREGROUND 0\n#endif\n```\n\n4. `#elif`：`#elif` 用于控制语句中的\
  \ `else if` 子句。\n5. `#else`：\n6. `#endif`：\n7. `#ifdef`：`#ifdef` 等于 `#if defined()`。\n\
  \n\n\n\n\n### 8. #ifndef\n`#ifndef` 等同于 `#ifdefined`。即，“如果未定义”。\n\n### 9. #undef\n\
  `#undef` 指令用于“取消定义”符号常量或宏标识符；即，它抵消 `#define` 指令的效果。\n\n例如：\n\n```c\n#define FOREGROUND\
  \ 7\n#define BACKGROUND 0\nmain()\n{\n//………\n#undef FOREGROUND\n#undef BACKGROUND\n\
  }\n```\n\n**Mind Drill Note**：`#if`, `#ifdef`, `#ifndef` 必须以 `#endif` 结束。\n\n###\
  \ 运算符\n预处理器还包含两个特殊运算符：`defined` `#` 和 `##`。\n\n### 字符串化运算符 (`#`)\n它允许将宏定义中的形式参数转换为字符串。如果宏定义中的形式参数前面跟有此运算符，则相应的实际参数将被自动包裹在双引号中。\n\
  \n### 标记粘贴运算符 (`##`)\n它导致宏定义中的各个项目连接在一起，从而形成一个单一项目。\n\n示例：\n```c\n#define display(i)\
  \ printf(“ x” #i “= %f\\n”,x##i)\n```\n假设该宏通过 `display(3);` 被调用。\n结果将是：`printf(“x3=\
  \ %f\\n”, x3);`\n因此表达式 `x##i` 变成了变量 `x3`，因为 `3` 是参数 `i` 的当前值。\n\n## 多选题\n\n1. **什么是预处理器指令？**\n\
