  \ 得到 `128`。\n3. 编写程序打印三位数的倒序。\n4. 计算 HARISH 先生的总薪。输入他的基本工资。他的 `DA` 是基本工资的 `40%`，`HRA`\
  \ 是基本工资的 `20%`。\n\n### 部分已解题\n\n#### 1. 计算二次方程的实根\n```c\n#include<math.h> /* 使用函数\
  \ sqrt*/\nfloat a,b,c,d,r1,r2;\nprintf(\"enter three numbers: \");\nscanf(\"%f %f\
  \ %f\",&a,&b,&c);\nd=b*b-(4*a*c); \nif(d<0)\n    printf(\"roots are imaginary\"\
  ); \nelse\n{\n    r1=(-b+sqrt(d))/(2*a); /* 计算平方根 */\n    r2=(-b-sqrt(d))/(2*a);\n\
  \    printf(\"The roots are %f %f\",r1,r2);\n}\n```\n\n#### 2. 如果通过键盘输入物品进价和售价，编写程序判断卖家是盈利还是亏损。同时确定他盈利了多少或亏损了多少。\n\
  ```c\nfloat cp,sp; \nprintf(\"Enter the cost price and the seling price of the item:\
  \ \"); \nscanf(\"%f %f\",&cp,&sp);\nif(sp>cp)\n    printf(\"profit is Rs. %.2f\"\
  ,sp); /*%.2f 用于打印两位小数*/\nelse if(cp > sp)\n    printf(\"loss is Rs %.2f\",cp-sp);\
  \ \nelse  \n    printf(\"No Profit No Loss\");\n```\n\n#### 3. 编写程序创建一个计算器，它可以进行加法、减法、乘法、除法和取模（余数）。\n\
