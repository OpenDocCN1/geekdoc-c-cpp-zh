  \n14. 编写一个程序使用条件运算符判断通过键盘输入的年份是否为闰年。\n\n![](img/image01029.jpeg)\n\n# 章节\n## ∞ 4\
  \ ∞\n## (控制语句（循环）)\n\n## 引言\n有时我们希望代码的某部分执行多次。我们可以在程序中重复编写代码，也可以使用循环。显而易见，如果我们需要执行某些代码执行百次或更多次，那么重复代码是不现实的。或者，我们可以在循环内部使用重复代码。\n\
  \n```\nwhile(not a hundred times)\n{ code \n}\n```\n\n循环会重复程序的某些部分，直到达到指定的次数或满足某个特定条件。换句话说，你可以认为：循环是重复单条语句或一组语句的过程，直到满足循环终止的某些条件。\n\
  \nC 语言中有了几种循环命令。我们将在接下来的章节中介绍这些命令。\n\n循环包含四个部分：\n1. 初始化。\n2. 条件。\n3. 语句。\n4. 递增或递。\n\
  \n不要忘记，循环是重复单条语句或一组语句的过程，直到满足循环终止的某些条件。\n\n### 循环类型\n- **入口控制循环**：在执行语句之前检查条件的循环。因此，如果初始条件为假，循环甚至一次都不会运行。例如：`for`\
  \ 循环、`while` 循环。\n- **出口控制循环**：在执行语句之后才检查条件的循环。因此，如果初始条件为假，循环至少会运行一次。例如：`do while`\
  \ 循环。\n\n### while 循环\nC 有三种循环，`while` 是其中最简单的一种。它接收一个条件（在括号内，与 `if` 语句一样）并对其进行求值。如果条件为真（非零，如之前所示），则执行循环体。条件会再次求值，如果仍为真，则再次执行循环体。此过程一直持续，直到条件最终为假。然后执行将跳转到循环后的第一条语句。\n\
  \n`while` 循环由一个条件和一个必须在循环中运行的单条命令或命令块组成。正如我们之前提到的，命令块是一系列包含在两个左右大括号内部的命令。\n\n在 `while`\
  \ 循环中，条件会被求值，如果为真，则执行循环语句。在执行语句和递增或递减之后，再次测试循环条件。这种重复执行语句、递增或递减以及测试条件的过程会持续进行，直到条件最终变为假，循环的控制权转移到下一条语句。\n\
  \n再次，如果循环体需要多条语句，则必须使用开始和结束括号。它是所有循环中最简单的。该循环的使用方法如下：\n\n```\ninitialize; while(condition)\n\
  {\n    statement;\n    increment or decrement;\n}\n```\n\n`while` 循环是一种入口控制循环。条件会被求值，如果为真，则执行循环语句。在执行语句和递增或递减之后，再次测试循环条件。这种重复执行语句、递增或递减以及测试条件的过程会持续进行，直到条件最终变为假，循环的控制权转移到下一条语句。\n\
  \n\n\n\n\n```c\nprintf(\"Enter the value of N \"); scanf(\"%d\",&n); i=1; while(i<=n)\n\
  {\n    printf(\"%d,\",i); i++;\n}\nprintf(\"\\b \"); /*to remove the comma (,) printed\
  \ at the last */\n```\n\n## do while 循环\n\nC 语言中的 `do while` 循环是 `while` 循环的“倒置”版本。`while`\
  \ 是先有条件后循环体，而 `do while` 是先有循环体后条件。\n\n这意味着在达到条件之前必须执行循环体。因此，保证循环体至少执行一次。如果条件为假，则循环体将不再执行。\n\
  \n它是一种退出控制循环。循环的使用方法如下：初始化；\n\n```c\ndo\n{\n    statement;\n    increment or decrement;\n\
  }\nwhile(condition);\n```\n\n在这里，`condition` 在执行语句和递增或递减之后进行测试。因此，在这种类型的循环中，程序首先评估循环体，然后才测试条件。因此，即使\
  \ `condition` 在开始为假，语句也会至少执行一次。它是一种退出控制循环。\n\n```c\nint j = 5; printf(\"start\\\
  n\");\ndo\nprintf(\"j = %i\\n\", j--); while(j > 0); printf(\"stop\\n\");\n```\n\
  \n**输出** – `start j = 5 j = 4 j = 3 j = 2 j = 1 stop` 示例\n\n## 打印序列 1, 2, 3, 4,\
  \ 5, …………..N 的程序\n\n```c\nint i,n;\nprintf(\"Enter the value of N \"); scanf(\"\
  %d\",&n); i=1; do {\n    printf(\"%d,\",i); i++;\n} while(i<=n);\nprintf(\"\\b \"\
  ); /*to remove the comma (,) printed at the last */\n```\n\n**练习笔记-** 最重要的一点是，`do\
  \ while` 保证至少执行一次。\n\n## for 循环\n\n正如我之前提到的，C 编程语言中有许多种循环。我们将在本节中学习 `for` 循环。\n\n\
  “`for 循环`”与 `while` 循环类似，但它更复杂。“`for 循环`”由一个决定循环运行次数的控制语句和一个命令部分组成。命令部分可以是单个命令，也可以是一个命令块。\n\
  \n**练习笔记-** 记住 `for` 循环将循环的要素元素封装在一个语句中。欲需更多示例，请参阅本书的最后一章。\n\n`for` 循环也是一种入口控制循环，提供了一种更简洁的循环控制结构。循环的使用如下：\n\
  \n```c\nfor (initialize; condition; increment or decrement)\n{\n    statement;\n\
  }\n```\n\n初始化部分仅在“`for 循环`”开始时执行一次。我们可以在这里初始化一个循环变量。\n\n测试 `condition` 是循环最重要的部分。如果该\
  \ `condition` 有效（真），循环将继续运行。如果 `condition` 失效（假），则循环将终止。\n\n每次“命令”部分在每个循环周期中都会执行一次。我们使用这部分来达到终止循环的最终条件。\n\
  \n例如，我们可以增加或减少循环变量的值，使得在指定次数的循环后循环条件失效，从而“`for 循环`”可以终止。\n\n在这一步，我们用 `for` 循环重写了示例\
  \ 3-1。只需注意，我们不再需要通过 `I=I+1` 来增加循环变量。它现在包含在“`for 循环`”条件句中（`i++`）。\n\n### 示例 –\n\n\
  ```c\n#include<stdio.h> \n#include<conio.h>\n\nmain()\n{\n    int i=0; for(i=0;i<100;i++\
  \ ) printf(\"\\ni=%d\",i); system(\"pause\");\n}\n```\n\n**练习笔记-** `stdio.h` – 标准输入输出。\n\
  **练习笔记-** `conio.h` – 控制台输入输出。\n**练习笔记-** 本质上，你只需要记住必须分隔该结构三个部分的两个分号字符。\n\n**示例\
  \ –**\n编写一个程序，获取工作日的温度并计算该周的平均温度。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
  main() {\n    int count=0;\n    float num=0,sum=0,avg=0; for(count=0;count<7;count\
  \ ++)\n    {\n        printf(\"Enter temperature : \");\n        scanf(\"%f\",&num);\
  \ sum=sum+num;\n    } \n    avg=sum/7;\n    printf(\"\\nAverage=%f\\n\",avg); system(\"\
  pause\");\n}\n```\n\n**示例 -**\n下例示例将使用循环打印从 1 到 10 的乘法表。\n\n```c\n#include<stdio.h>\n\
  main()\n{\n    int i,j;\n    for(i=1;i<=10;i++)\n        for(j=1;j<=10;j++)\n  \
  \          printf(\"%d*%d=%d\\t\",i,j,i*j);\n}\n```\n\n## 与 while 比较\n\nC 语言中的 `do\
  \ while` 循环是 `while` 循环的“倒置”版本。`while` 是先有条件后循环体，而 `do while` 是先有循环体后条件。\n\n这意味着在达到条件之前必须执行循环体。因此，保证循环体至少执行一次。如果条件为假，则循环体将不再执行。\n\
  \n它是一种退出控制循环。循环的使用方法如下：初始化；\n\n```c\ndo\n{\n    statement;\n    increment or decrement;\n\
  }\nwhile(condition);\n```\n\n在这里，`condition` 在执行语句和递增或递减之后进行测试。因此，在这种类型的循环中，程序首先评估循环体，然后才测试条件。因此，即使\
  \ `condition` 在开始为假，语句也会至少执行一次。它是一种退出控制循环。\n\n```c\nint j = 5; printf(\"start\\\
  n\");\ndo\nprintf(\"j = %i\\n\", j--); while(j > 0); printf(\"stop\\n\");\n```\n\
  \n**输出 –** `start j = 5 j = 4 j = 3 j = 2 j = 1 stop` 示例 \n\n## 打印序列 1, 2, 3, 4,\
  \ 5, …………..N 的程序\n\n```c\nint i,n;\nprintf(\"Enter the value of N \"); scanf(\"\
  %d\",&n); i=1; do {\n    printf(\"%d,\",i); i++;\n} while(i<=n);\nprintf(\"\\b \"\
  ); /*to remove the comma (,) printed at the last */\n```\n\n**练习笔记-** 最重要的一点是，`do\
  \ while` 保证至少执行一次。\n\n## for 循环\n\n正如我之前提到的，C 编程语言中有许多种循环。我们将在本节中学习 `for` 循环。\n\n\
  “`for 循环`”与 `while` 循环类似，但它更复杂。“`for 循环`”由一个决定循环运行次数的控制语句和一个命令部分组成。命令部分可以是单个命令，也可以是一个命令块。\n\
  \n**练习笔记-** 记住 `for` 循环将循环的要素元素封装在一个语句中。欲需更多示例，请参阅本书的最后一章。\n\n`for` 循环也是一种入口控制循环，提供了一种更简洁的循环控制结构。循环的使用如下：\n\
  \n```c\nfor (initialize; condition; increment or decrement)\n{\n    statement;\n\
  }\n```\n\n初始化部分仅在“`for 循环`”开始时执行一次。我们可以在这里初始化一个循环变量。\n\n测试 `condition` 是循环最重要的部分。如果该\
  \ `condition` 有效（真），循环将继续运行。如果 `condition` 失效（假），则循环将终止。\n\n每次“命令”部分在每个循环周期中都会执行一次。我们使用这部分来达到终止循环的最终条件。\n\
  \n例如，我们可以增加或减少循环变量的值，使得在指定次数的循环后循环条件失效，从而“`for 循环`”可以终止。\n\n在这一步，我们用 `for` 循环重写了示例\
  \ 3-1。只需注意，我们不再需要通过 `I=I+1` 来增加循环变量。它现在包含在“`for 循环`”条件句中（`i++`）。\n\n### 示例 –\n\n\
  ```c\n#include<stdio.h> \n#include<conio.h>\n\nmain()\n{\n    int i=0; for(i=0;i<100;i++\
  \ ) printf(\"\\ni=%d\",i); system(\"pause\");\n}\n```\n\n**练习笔记-** `stdio.h` – 标准输入输出。\n\
  **练习笔记-** `conio.h` – 控制台输入输出。\n**练习笔记-** 本质上，你只需要记住必须分隔该结构三个部分的两个分号字符。\n\n**示例\
  \ –**\n编写一个程序，获取工作日的温度并计算该周的平均温度。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
  main() {\n    int count=0;\n    float num=0,sum=0,avg=0; for(count=0;count<7;count\
  \ ++)\n    {\n        printf(\"Enter temperature : \");\n        scanf(\"%f\",&num);\
  \ sum=sum+num;\n    } \n    avg=sum/7;\n    printf(\"\\nAverage=%f\\n\",avg); system(\"\
  pause\");\n}\n```\n\n**示例 -**\n下例示例将使用循环打印从 1 到 10 的乘法表。\n\n```c\n#include<stdio.h>\n\
  main()\n{\n    int i,j;\n    for(i=1;i<=10;i++)\n        for(j=1;j<=10;j++)\n  \
  \          printf(\"%d*%d=%d\\t\",i,j,i*j);\n}\n```\n\n## 与 while 比较\n\nC 语言中的 `do\
  \ while` 循环是 `while` 循环的“倒置”版本。`while` 是先有条件后循环体，而 `do while` 是先有循环体后条件。\n\n这意味着在达到条件之前必须执行循环体。因此，保证循环体至少执行一次。如果条件为假，则循环体将不再执行。\n\
  \n它是一种退出控制循环。循环的使用方法如下：初始化；\n\n```c\ndo\n{\n    statement;\n    increment or decrement;\n\
  }\nwhile(condition);\n```\n\n在这里，`condition` 在执行语句和递增或递减之后进行测试。因此，在这种类型的循环中，程序首先评估循环体，然后才测试条件。因此，即使\
  \ `condition` 在开始为假，语句也会至少执行一次。它是一种退出控制循环。\n\n```c\nint j = 5; printf(\"start\\\
  n\");\ndo\nprintf(\"j = %i\\n\", j--); while(j > 0); printf(\"stop\\n\");\n```\n\
  \n**输出 –** `start j = 5 j = 4 j = 3 j = 2 j = 1 stop` 示例 \n\n## 打印序列 1, 2, 3, 4,\
  \ 5, …………..N 的程序\n\n```c\nint i,n;\nprintf(\"Enter the value of N \"); scanf(\"\
  %d\",&n); i=1; do {\n    printf(\"%d,\",i); i++;\n} while(i<=n);\nprintf(\"\\b \"\
  ); /*to remove the comma (,) printed at the last */\n```\n\n**练习笔记-** 最重要的一点是，`do\
  \ while` 保证至少执行一次。\n\n## for 循环\n\n正如我之前提到的，C 编程语言中有许多种循环。我们将在本节中学习 `for` 循环。\n\n\
  “`for 循环`”与 `while` 循环类似，但它更复杂。“`for 循环`”由一个决定循环运行次数的控制语句和一个命令部分组成。命令部分可以是单个命令，也可以是一个命令块。\n\
  \n**练习笔记-** 记住 `for` 循环将循环的要素元素封装在一个语句中。欲需更多示例，请参阅本书的最后一章。\n\n`for` 循环也是一种入口控制循环，提供了一种更简洁的循环控制结构。循环的使用如下：\n\
  \n```c\nfor (initialize; condition; increment or decrement)\n{\n    statement;\n\
  }\n```\n\n初始化部分仅在“`for 循环`”开始时执行一次。我们可以在这里初始化一个循环变量。\n\n测试 `condition` 是循环最重要的部分。如果该\
  \ `condition` 有效（真），循环将继续运行。如果 `condition` 失效（假），则循环将终止。\n\n每次“命令”部分在每个循环周期中都会执行一次。我们使用这部分来达到终止循环的最终条件。\n\
  \n例如，我们可以增加或减少循环变量的值，使得在指定次数的循环后循环条件失效，从而“`for 循环`”可以终止。\n\n在这一步，我们用 `for` 循环重写了示例\
  \ 3-1。只需注意，我们不再需要通过 `I=I+1` 来增加循环变量。它现在包含在“`for 循环`”条件句中（`i++`）。\n\n### 示例 –\n\n\
  ```c\n#include<stdio.h> \n#include<conio.h>\n\nmain()\n{\n    int i=0; for(i=0;i<100;i++\
  \ ) printf(\"\\ni=%d\",i); system(\"pause\");\n}\n```\n\n**练习笔记-** `stdio.h` – 标准输入输出。\n\
  **练习笔记-** `conio.h` – 控制台输入输出。\n**练习笔记-** 本质上，你只需要记住必须分隔该结构三个部分的两个分号字符。\n\n**示例\
  \ –**\n编写一个程序，获取工作日的温度并计算该周的平均温度。\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
  main() {\n    int count=0;\n    float num=0,sum=0,avg=0; for(count=0;count<7;count\
  \ ++)\n    {\n        printf(\"Enter temperature : \");\n        scanf(\"%f\",&num);\
  \ sum=sum+num;\n    } \n    avg=sum/7;\n    printf(\"\\nAverage=%f\\n\",avg); system(\"\
  pause\");\n}\n```\n\n**示例 -**\n下例示例将使用循环打印从 1 到 10 的乘法表。\n\n```c\n#include<stdio.h>\n\
  main()\n{\n    int i,j;\n    for(i=1;i<=10;i++)\n        for(j=1;j<=10;j++)\n  \
  \          printf(\"%d*%d=%d\\t\",i,j,i*j);\n}\n```\n\n## 跳跃语句\n\n循环执行一组语句，直到条件变为假。循环重复的次数是预先决定的。但有时在特定条件为真时跳过部分部分或终止循环，C\
  \ 支持四种跳转语句：\n\ni. `break`。\nii. `continue`。\niii. `goto`。\niv. `return`。\n\n###\
  \ break\n\n用于在循环内部，直接跳出循环。我们已经在 `switch` 语句在使用 `break`。它用于跳过循环的后续执行，并将程序控制转移到循环后的语句。\n\
  \n### continue\n\n有时在特定条件为真时跳过语句的执行。`continue` 不终止循环，而是跳转到下一次迭代。在 `for` 循环中 `continue`\
  \ 将控制带到下一个递增或递减，但在 `while` 或 `do while` 循环中 `continue` 导致循环控制直接跳转到条件。\n\n### goto\n\
  \n它还用于从程序的某部分跳转到另一部分或退出深度嵌套循环。但使用 `goto` 不是好做法，因为它会让逻辑复杂化并使长程序变得不可读。\n\n### return\n\
  \n用于函数返回某些值，并从调用的函数定义跳转到调用函数定义。\n\n### exit()\n\n它不是跳转语句。它用于终止程序或直接退出程序，而不执行中间语句。它是包含在\
  \ `stdlib.h` 和 `process.h` 中的库函数。`exit` 使用如下：`exit( )`\n\n\n\n\n\n任何循环，无论条件如何，都可以使用\
  \ C 语言的关键字 `break` 跳出。我们之前看到过下面的循环：\n\n```c\nprintf(\"enter an integer: \"); while(scanf(\"\
  %i\", &j) != 1) { \n    while((ch = getchar()) != '\\n') ;\n    printf(\"enter an\
  \ integer: \");\n    break; \n}\n```\n\n### break 实际上是 Goto！\n\n它并不一定能很好地解决问题，因为你现在使用了等同于\
  \ `goto` 的语句！`goto` 是现代编程的祸害，由于其紧密的关系，某些公司禁止使用 `break`。如果非要使用，也应该节制使用，过度使用可能会产生“意大利面条代码”（spaghetti\
  \ code）。\n\n### break, switch 与循环\n\n这与 `switch` 语句中使用的 `break` 关键字完全相同。如果在循环内部的\
  \ `switch` 语句放置了 `break`，则 `break` 将强制退出 `switch` 而不是循环。没有办法改变这一点。\n\n### continue\n\
  \n\"continue\" 语句\n\n练习笔记 – `continue` 语句可以在循环中使用。与 `break` 命令一样，“continue”改变了程序的执行流。然而，它并没有终止循环。它只是跳过循环当前迭代的剩余部分，并返回循环的起点。\n\
  \n```c\n#include<stdio.h> \nmain() {\n    while((ch=getchar())!='\\n') {\n     \
  \   if(ch=='.') continue;\n        putchar(ch); \n    }\n    system(\"pause\");\n\
  }\n```\n\n在上面的示例中，程序接受所有输入，但删除了其中的 `.` 字符。文本会在你输入时回显，但主输出会在你按下回车键（等同于插入一个 `\"\\\
  n\"` 字符）后打印。正如我们之前提到的，这是因为 `getchar()` 函数是一个缓冲输入函数。\n\n当 `break` 强制立即退出最近的嵌套循环时，`continue`\
  \ 关键字则导致循环进入下一次迭代。在 `while` 和 `do--while` 循环中，它会直接跳转到条件处并重新评估它。在 `for` 循环中，它会跳转到循环的更新部分，执行该部分，然后重新评估条件。\n\
  \n### continue 实际上是 Goto-\n\n适用于 `break` 使用的语句同样适用于 `continue`。它只是 `goto` 的另一种形式，应该谨慎使用。过度使用\
  \ `continue` 可能会导致产生意大利面条代码而不是代码。事实上，上面的循环可以很容易地写成：\n\n```c\nfor(j = 1; j <= 10;\
  \ j++) if(j % 3 != 0) printf(\"j = %i\\n\", j);\n```\n\n### continue, switch 与循环\n\
  \n`break` 对 `switch` 语句有影响，而 `continue` 没有这种影响。因此，放在循环内 `switch` 语句中的 `continue`\
  \ 将影响循环。\n\n练习笔记 – `if (then) else` - 注意分号；`switch` 可以测试整数值；`while`、`do while`、`for`\
  \ - 再次注意分号。\n\n## 回答以下问题\n\n1. `for` 循环的三个部分是：\n   a. `i` __________ 表达式\n   b.\
