  \n```c\n#include<stdio.h> \n#include<conio.h>\nint factorial(int); /* function prototype*/\n\
  void main()\n{\n  int a,fact;\n  printf(\"\\n Enter number\");\n  scanf(\"%d\",&a);\n\
  \  fact=factorial(a);\n  printf(\"Factorial value=%d\",fact);\n  getch();\n}\nint\
  \ factorial(int x)\n{\n  int f=1;\n  int i;\n  for(i=x;i>=1;i--) f=f*i; \n  return(f);\n\
  }\n```\n\n# 19. 使用递归函数计算阶乘。\n\n```c\n#include<stdio.h>\n#include<conio.h>\nint rec(int);\
  \ /* function prototype*/\nvoid main()\n{\n  int a,fact;\n  printf(\"\\n Enter number\"\
  ); \n  scanf(\"%d\",&a);\n  fact=rec(a);\n  printf(\"Factorial value=%d\",fact);\n\
  \  getch();\n}\nint rec(int x)\n{\n  int f;\n  if(x==1) return(1); \n  else f=x*rec(x-1);\n\
  \  return(f);\n}\n```\n\n# 20. 使用函数构建计算器。\n\n```c\n#include<stdio.h> \n#include<conio.h>\n\
