  \ n 个字符设置为给定字符 |\n\n### 2. 用户自定义函数\n由我们定义的函数被称为用户自定义函数。`main()` 函数也是用户自定义函数，因为 `main()`\
  \ 的定义是由我们定义的。例如：\n\n```c\nint power(int, int);\nmain() {\n    int n, p, ans;\n \
  \   printf(\"输入数字及其幂幂\");\n    scanf(\"%d%d\", &n, &p);\n    ans = power(n,p);\n\
  \    printf(\"%d\", ans);\n    getch();\n}\n\nint power(int n, int p) {\n    int\
  \ ans=1, i;\n    for(i=1; i<=p; i++) {\n        ans = ans * n;\n    }\n    return(ans);\n\
  }\n```\n\n参数为二维数组的函数：\n```c\nvoid mat_sum(int m1[][10], int r1, int c1, int m2[][10],\
  \ int r2, int c2, int m3[][10]) {\n    int i, j;\n    if(r1 != c1 && r2 != c2) {\n\
  \        printf(\"无法求和\");\n        exit();\n    }\n    for(i=0; i<r1; i++) {\n\
  \        for(j=0; j<c1; j++) {\n            m3[i][j] = m1[i][j] + m2[i][j];\n  \
  \      }\n    }\n}\n```\n上述函数可以在 `main()` 中调用为 `mat_sum(m1,r1,c1,m2,r2,c2,m3);`。\n\
  \n### 递归\n如果函数体内的某个语句调用了函数本身，则该函数是递归的。有时被称为“循环定义”，递归是指函数在定义中调用自己。递归函数应该包含两个部分：递归语句和\
  \ 终止条件。\n\n\n\n\n\n假设我们要计算一个整数的阶乘。如我们所知，一个数字的阶乘是 1 到该数字之间所有整数的乘积。4 的阶乘可以表示为 `4!\
  \ = 4 * 3!`，其中 `!` 代表阶乘。因此，一个数字的阶乘可以用它自身的形式表示。因此这可以使用递归来实现。\n\n例如：\n```c\nint fact\
  \ (int); /*函数定义 */\nmain()\n{\n    int n,ans;\n    printf(\"Enter a number: \");\
  \ \n    scanf(\"%d\",&n);\n    ans = fact(n); /*函数调用 */\n    printf(\"factorial\
  \ = %d\",ans); \n    getch();\n}\n\nint fact(int n)\n{\n    if(n == 0) /*终止条件*/\
  \ return (1);\n    return (n*fact(n-1)); /*递归语句*/\n}\n```\n\n现在让我们评估这个程序：\n假设当程序控制权从\
  \ `main()` 函数传递给 `fact` 函数时，`n` 的值为 3。由于 `n` 不等于 0，因此条件为假，并执行递归语句。\n\n`3*fact(2)`\n\
  现在 `fact(2)` 是调用函数，因此程序的控制权再次到达定义的开头。终止条件仍然为假，因此执行递归语句。\n\n`2*fact(1)`\n再次 `fact(1)`\
  \ 是调用函数，因此程序的控制权再次到达定义的开头。终止条件仍然为假，因此执行递归语句。\n\n`1 * fact(0)`\n\n现在条件为真，调用函数（`fact(0)`）的答案将是\
  \ 1，依此类推。因此，操作序列将是：\n`fact(3)=3 * fact(2) fact(2)=2 * fact(1) fact(1)=1 * fact(0)`\n\
  （注：原文此处缺少等号，译文保持原样或保持逻辑一致）\n\n当我们使用递归程序时，会使用栈（stack）来组织数据。栈是一种后进先出（LIFO）数据结构。这意味着存储在栈中的最后一个项（`push`\
  \ 操作）将是第一个出来的项（`pop` 操作）。\n\n在上面的程序中，当调用 `fact(2)` 时，值 3 将存储在栈中。同样，当调用 `fact(1)`\
  \ 时，值 2 将存储在栈中 3 之上。\n\n现在当 `fact(0)` 返回 1 时，它将乘以栈中的第一个值，即 1。此结果将乘以栈中第二个等待处理的值，即\
  \ 2，依此类推。\n\n当一个函数在它的定义中调用另一个函数时，这被称为链（chaining）。递归是一种特殊的链，其中函数调用它自己。\n\n例如：\n```c\n\
  main()\n{\n    printf(\"expert\\n\");\n    main();\n}\n```\n执行时，程序将给出如下输出：\nexpert\n\
  expert\n\n任何递归函数的执行都可以无限持续下去，因此为了使执行走向结束，应用了终止条件。使用递归函数是为了解决那些通过对对子集连续应用相同的解决方案来表示解决方案的问题。但递归函数也有其缺点：\n\
  1. 这些函数更耗时，因此程序的执行速度较慢。\n2. 由于栈的形成，占用了更多的内存空间。\n\n### 填空\n1. 函数在 __ 时将控制权返回给调用函数。\n\
