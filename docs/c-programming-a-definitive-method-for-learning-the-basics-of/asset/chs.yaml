  {\n    int a,b=3;\n    a=cube(b++);\n    printf(\"%d %d”,a,b);\n}\n```\n**输出: 27\
  \ 4**\n\n10. **4. #define MESS junk**\nmain()\n{\n    printf(“MESS”);\n}\n```\n\
  **输出: MESS**\n\n11. **5. #define PRINT(int) printf(\"%d”,int)**\nmain()\n{\n   \
  \ int x=2,y=3, z=4;\n    PRINT (x);\n    PRINT (y);\n    PRINT (z);\n}\n```\n**输出:\
  \ 2 3 4**\n\n12. **6. 你将如何定义上面的 `PRINT` 宏，使其输出：x=2 y=3 z=4？**\n**答案: `#define PRINT(int)\
