  \ C 库中创建并插入自己的函数。正如大家所知，我们大多数时候使用标准库函数，有时使用用户自定义函数。但我在这里想向你们展示的核心是：我们如何将自己编写的“C”函数添加到漂亮的“C”标准库中？\n\
  \n是的，这是可能的，这是 C 编程中的一种专家方法。将我们的自定义函数添加到标准 C 库后，我们可以随时地访问它们，步骤如下：\n\n### 第一步\n大多数\
  \ C 编译器在编译器工具中提供了一个特殊的选项菜单，通过该工具我们可以轻松地完成此任务。我想 Turbo c/c++ 编译器中提供了一个名为 `tlib.exe`\
  \ 的工具，即 Turbo Librarian。让我们使用该工具将函数添加到 C 库中。\n\n### 第二步\n在这里我们将 `factorial()` 函数添加到\
  \ C 库中\n\n(a) 在某个文件中编写 `factorial()` 函数定义，可以是 `fact.c`：\n\n```c\nint factorial(int\
  \ num)\n{\n  int i,f=1;\n  for(i=1;i<=num;i++) f=f*i;\n  return(f);\n}\n```\n\n\
  (b) 使用 Alt+f9 编译 `fact.c` 文件，现在会自动创建一个名为 `fact.obj` 的新文件，其中包含编译后的机器码。\n\n(c) 通过执行以下命令将函数添加到库\
  \ `maths.lib` 中：`c:\\>tlib maths.lib+c:\\fact.obj`\n\n\n\n\n\n在这里，`maths.lib` 是库文件名，`+`\
