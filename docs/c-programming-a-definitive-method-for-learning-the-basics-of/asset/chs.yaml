  \ 指令有什么区别？**\n`#include<conio.h>`\n`#include\"conio.h\"`\n\n**答案：**\n`include “conio.h\"\
  `：此指令不仅会在当前目录查找，还会在搜索路径设置的指定的目录列表中查找 `conio.h`。\n`#include<conio.h>`：此指令仅会在指定的目录列表中查找\
  \ `conio.h`。\n\n2. **指出在预处理阶段 swap 宏会被展开成什么。代码能通过编译吗？**\n```c\n#define swap (a,\
  \ b, c) (c t; t=a; a=b; b=t)\nmain()\n{\n    int x=10,y=20;\n    swap(x,y);\n  \
  \  printf(\"%d %d”,x,y);\n}\n```\n**答案：** 展开为 `(c t; t=a; a=b; b=t)`。该代码无法编译，因为不能在括号内声明变量\
  \ `t`。\n\n\n\n\n现在，如果我们如下所示两次包含此文件，它将只包含一次。\n\n### 9. 在包含时，头文件在哪里被搜索的？\n\n**答案：**\
  \ 如果使用 `< >` 包含头文件，文件将在预定义的包含路径中搜索（该路径也可以更改）。如果使用 `\" \"` 语法包含，除了预定义路径外，还会在当前目录中搜索文件（通常是调用编译器的所在目录）。\n\
  \n![](img/image01164.jpeg)\n\n判断对或错：\n\na. 如果要包含的文件不存在，预处理器会抛出错误信息。\nb. 预处理器可以捕获简单的错误，如缺少声明、嵌套注释或大括号不匹配。\n\
  c. 如果头文件被包含两次，是否会导致错误。\nd. 下面的程序会无限次地打印该条消息吗？\n```c\n#define INFINITELOOP while\
  \ (1)\nmain()\n{\n    INFINITELOOP\n    printf(\"\\nMatrix\");\n}\n```\ne. 下面的程序能成功编译吗？\n\
  ```c\nmain()\n{\n    printf(\"Matrix\" \"computers\");\n}\n```\n**答案：**\na. True,\
  \ b. False, c. False, d. True, e. True\n\n![](img/image01165.jpeg)\n\n# 第 14 章\n\
  \n# (存储类)\n\n## 引言\n\n存储类决定了变量的内存位置。内存位置可以是：\n1. 主内存 (RAM)。\n2. CPU 寄存器。\n\n它决定了变量的默认值（零值或垃圾值）。它还决定了变量的作用域和生命周期。作用域指声明产生作用的区域，换句话说，该特定变量可以使用。\n\
  \n四种不同的作用域是全局、函数、块和原型。\n\n有 4 种存储类：\n1. 自动存储类 (`auto`)\n2. 静态存储类 (`static`)\n3.\
  \ 外部存储类 (`extern`)\n4. 寄存器存储类 (`register`)\n\n### 自动存储类\n\n在函数内部声明的变量默认具有自动存储类。它由垃圾值初始化。\n\
  声明方式为：`int a` 或 `auto int a;`；`void prn();`\n\n```c\nmain()\n{\n    int a = 5;\n\
  \    printf(\"%d \", a);\n    prn();\n    prn();\n    prn();\n}\nvoid prn()\n{\n\
  \    int a = 10;\n    a++;\n    printf(\"%d \", a);\n}\n```\n输出：`5 11 11`\n在上面的示例中，两个变量名称相同，但它们有不同的作用域。`prn()`\
  \ 中的变量 `a` 是局部作用域，因此每次调用 `prn()` 都会生成 `a` 的新副本。\n\n### 静态存储类\n\n只有当程序需要变量的值在不同函数调用之间持久（例如递归函数）时，才使用静态存储类。变量声明为：`static\
  \ int b;`；静态变量具有局部作用域和全局生命周期。静态变量定义在单个函数内部，因此与自动变量的作用域相同。它们对于函数是局部。它们在整个程序生命周期内保留其值。因此，如果一个函数退出稍后重新进入，定义在该函数内的静态变量将返回它们以前的值。\n\
  \n```c\nvoid prn();\nmain()\n{\n    prn();\n    prn();\n    prn();\n}\nvoid prn()\n\
  {\n    static int a = 10;\n    a++;\n    printf(\"%d \", a);\n}\n```\n输出：`11 12\
  \ 13`\n在上面的示例中，只会创建一个变量 `a` 的副本，并且在每次调用 `prn()` 时都会使用这个唯一的副本，因此它会增加变量 `a` 的上一次函数调用值。\n\
  \n## 外部存储类\n\n在所有函数外部声明的变量具有外部存储类。`extern` 存储类应仅用于程序中所有函数使用的变量。现在不需要在所有函数中传递变量了。\n\
  \n但不建议将所有变量都存储为 `extern`，因为它们将在程序生命周期内保持活跃，从而浪费了大量内存。外部变量声明为 `extern int c;`；当一个程序的变量必须在某些其他程序中使用时，例如：\n\
  \n| File1.c | File2.c |\n| :--- | :--- |\n| `#include \"File2.c\"` | `/*extern declaration*/`\
  \ |\n| `int a; /*Variable definition */` | `extern int a;` |\n| `main(){ a= 5; func();\
  \ printf(\"%d\",a); }` | `void func(){ a=10; }` |\n\n**输出：** `10`\n`a` 在 `File1.c`\
  \ 中获得内存，因为它是在调用它的函数外部作为外部变量定义的，且其作用域是全局的。两个文件中使用的 `a` 是同一个。但当我们编译 `File2.c` 时，我们必须通知编译器\
  \ `a` 来自外部（不分配内存），如果我们将其声明为 `int a`，编译器将将其视为新变量。\n\n### 寄存器\n\n可用的 CPU 寄存器很少，甚至比微处理器正在使用的还要少。但计算机访问\
  \ CPU 寄存器的速度非常快，因此程序执行得非常快。因此，它最适合需要多次使用的循环计数器。然而，如果寄存器是空闲的，`auto` 存储类会被使用，执行继续。CPU\
  \ 寄存器是 2 字节。所以它们的范围等于 `int`。即使我们说 `float`，声明为 `register int d;`。\n\n## 总结\n\n| 存储类\
  \ | 内存 | 作用域 | 生命周期 |\n| :--- | :--- | :--- | :--- |\n| Auto | 主内存 (RAM) | 局部 |\
  \ 局部 |\n| Static | 主内存 (RAM) | 局部 | 全局 |\n| Extern | 主内存 (RAM) | 全局 | 全局 |\n| Register\
  \ | CPU 寄存器 | 局部 | 局部 |\n\n以下程序的输出是什么：\n\n```c\nmain()\n{\n    static int c = 5;\n\
  \    printf(\"\\n c = %d\",c--);\n    if (c !=0)\n    main();\n}\n```\n输出：`5 4 3\
  \ 2 1`\n因为首先打印 `c=5` 然后减 1 调用 main，但这里 `c` 定义为 `static`，所以控制不会进入初始化，此条件将为五次，每次 `c`\
  \ 都被打印然后减 1，所以 `c` 将是 `5 4 3 2 1`。\n\n```c\nmain()\n{\n    int i,j;\n    for( i\
  \ = 1; i<5; i++)\n    {\n        j = g(i);\n        printf(\"\\n%d\",j);\n    }\n\
  }\nint g( int x){{\n    static int v = 1;\n    int b = 3;\n    v+=x;\n    return(v+x+b);\n\
  }\n```\n输出：`6 9 13 18`\n\n```c\nmain()\n{\n    int x = 20;\n    {\n        int x\
  \ = 30;\n        printf(\"%d \",x);\n    }\n    printf(\"\\n %d\",x);\n}\n```\n\
  输出：`30 20`\n因为当控制执行内部的 printf 时，它将打印 30，因为局部变量优先，当控制离开此块时作用域结束，这里 `x =20` 并被打印。\n\
  \n```c\nmain()\n{\n    extern int i;\n    i=20;\n    printf(\"%d\",sizeof(i));\n\
  }\n```\n输出：`Error extern int i is adeclaration and not definition`\n\n```c\nmain()\n\
  {\n    extern int a;\n    printf(\"%d\",a);\n}\nint a=20;\n```\n输出：`20`\n\n\n\n\n\
  ## 问题\n\n1. `extern` 存储类变量在定义之前的函数中是不可用的，除非该变量在这些函数中被显式声明。\n\n2. 自动存储类变量的值在不同的函数调用之间持续存在。\n\
  \n3. 如果 CPU 寄存器可用，则寄存器存储类变量被视为静态存储类变量。\n\n4. `register` 类变量不能持有 `float` 值。\n\n5.\
  \ 如果我们尝试对 `float` 变量使用 `register` 存储类，编译器将抛出错误信息。\n\n6. 如果变量 `x` 定义在所有函数之外，且变量 `x`\
  \ 也被定义为某个函数的局部变量，则全局变量的优先级优于局部变量。\n\n7. 自动变量的默认值为 0。\n\n8. `static` 变量的生命周期直到控制权保持在其定义的块内。\n\
  \n9. 如果要定义一个全局变量，则在其声明中必须使用 `extern` 关键字。\n\n10. `register` 变量的地址是无法的。\n\n### 答案\n\
  \n1. 正确\n2. 错误\n3. 错误\n4. 正确\n5. 错误\n6. 错误\n7. 错误\n8. 错误\n9. 错误\n10. 正确\n\n![](img/image01168.jpeg)\n\
  \n# 第 ∞ 15 章（算法）\n\n## 引言\n\n### 算法 1：两个数之和\n1. 读取 `A` 和 `B`。\n2. 设置 `SUM:=A + B`。\n\
  3. 输出 `SUM`。\n4. 退出。\n\n### 算法 2：两个数中的最大值\n1. 读取 `A` 和 `B`。\n2. 如果 `A > B`，：\n \
  \  设置 `MAX:=A`。\n   否则：\n     设置 `MAX:=B`。\n   [结束 If 结构]\n3. 输出 `MAX`。\n4. 退出。\n\
  \n### 算法 3：三个数中的最大值\n1. 读取 `A`, `B`, `C`。\n2. 如果 `A > B`，：\n   如果 `A > C`，：\n  \
  \   设置 `MAX:=A`。\n   否则：\n     设置 `MAX:=C`。\n   [结束 If]\n   否则：\n   如果 `B > C`，：\n\
  \     设置 `MAX:=B`。\n   否则：\n     设置 `MAX:=C`。\n   [结束 If]\n3. 输出 `MAX`。\n4. 退出。\n\
  \n### 算法 4：从用户输入百分比并打印等级（使用 Else if）\n1. 读取 `P`。\n2. 如果 `P>=90`，：\n   设置 `GRADE:=’A’`。\n\
  \   如果 `P >= 70`，：\n     设置 `GRADE := ‘B’`。\n   其他如果 `P>=50`，：\n     设置 `GRADE:=’C’`。\n\
  \   否则：\n     设置 `GRADE:=’F’`。\n   [结束 If Else 结构]。\n3. 输出 `GRADE`。\n4. 退出\n\n###\
  \ 算法 5：使用 for 循环打印 1 到 N 的序列\n1. 读取 `N`。\n2. 对于 `I:=1 to N` 重复步骤 3：\n3. 输出 `I`。\n\
  [结束步骤 2 循环]\n4. 退出。\n\n### 算法 6：使用 while 循环打印 1 到 N 的序列\n1. 读取 `N`。\n2. 设置 `I:=1`。\n\
  3. 当 `I<=N` 时：\n   输出 `I`。\n   设置 `I:=I+1`。\n4. 退出。\n\n### 算法 7：使用 do while 循环打印\
  \ 1 到 N 的序列\n1. 读取 `N`。\n2. 设置 `I:=1`。\n3. 执行：\n   输出 `I`。\n   设置 `I:=I+1`。\n当 `I<=N`。\n\
  4. 退出。\n\n### 算法 8：十进制转二进制\n1. 读取 `N`。\n2. 设置 `B:=0`。\n3. 设置 `I:=1`。\n4. 当 `N>=0`\
  \ 时：\n   设置 `N:=N/2`。\n   设置 `B:=B*10 + remainder`。\n5. 输出 `B`。\n6. 退出。\n\n### 算法\
  \ 9：反转给定数字的数字\n1. 读取 `N`。\n2. 设置 `REV:=0`。\n3. 当 `N>=0` 时：\n   设置 `N:=N/10`。\n \
  \  设置 `REV:=REV*10 + remainder`。\n4. 输出 `REV`。\n5. 退出。\n\n### 算法 10：验证给定数字是否为质数\n\
  1. 读取 `N`。\n2. 设置 `PRIME:=1`。\n3. 对于 `I:=2` 到 `N/2`：\n   如果 `N % I=0`：\n     设置\
  \ `PRIME:=0`。\n     中断。\n4. 如果 `PRIME=1`：\n   打印该数是质数。\n否则：\n   打印该数不是质数。\n5. 退出。\n\
  \n### 算法 11：数组中的线性搜索\n\n### 算法 12：使用函数计算阶乘\n1. 读取 `N`。\n2. 设置 `ANS:=1`。\n3. 对于 `I:=1`\
  \ 到 `N`：\n   设置 `ANS:=ANS*I`。\n4. 返回 `ANS`。\n\n![](img/image0169.jpeg)\n\n# 第 ∞\
