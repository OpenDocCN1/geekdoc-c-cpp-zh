  \n![](img/image01045.jpeg)\n\n# 一维数组\n\n## 介绍\n数组（ARRAY）是相似数据项或元素的集合。或者说数组是在单个名称下连续存储的同类数据元素的集合。\n\
  \n### 数组的需要\n当相同类型和性质的变量较多时，很难处理它们。因此我们需要数组。让我们通过示例来理解数组的使用：\n```c\nint i,a;\nfor(i=1;i<=5;i++)\n\
  {\n    printf(\"Enter the no.\");\n    scanf(\"%d\",&a);\n}\n```\n在上面的程序中，一旦给 `a`\
  \ 分配新值，旧值就会丢失。因此，我们目前为止使用的所有变量都是如此。因此，如果我们想保存所有值，我们需要数组。例如，如果我们想存储 5 个数字，我们可以定义数组\
  \ `int a[5]`。数组是在同相同名称下连续存储的元素的集合。\n\n### 数组声明\n`int a[6];`\n`a` 是数组名，`int` 是类型，`6`\
  \ 是大小。\n\n### 数组初始化\n| 声明 | 描述 |\n| :--- | :--- |\n| `int a[5];` | /*该数组包含随机值*/\
  \ |\n| `int a[5]={10,20,30,40,50};` | /*该数组包含 10,20,30,40,50 值*/ |\n| `int a[5]\
  \ = {0,0,0,0,0};` | /*该数组包含 0,0,0,0,0 值*/ |\n| `int a[5] = {0};` | /*该数组包含 0,0,0,0,0\
  \ 值*/ |\n| `int a[5] = {1};` | /*该数组包含 1,0,0,0,0 值*/ |\n| `int a[5] ={10, , 30};`\
  \ | /*该数组包含 10,0,30,0,0 值*/ |\n| `int a[ ] = {10,20,30};` | /*该数组的大小将被假设为 3*/ |\n\
  | `int a[3] = {10,20,30,40};` | /*初始化过多错误*/ |\n| `static int a[5];` | /*该数组包含 0,0,0,0,0\
  \ 值*/ |\n\n![](img/image1046.jpeg)\n\n\n\n如果初始化次数超过数组的大小，则会报“初始化过多”的错误。\n\n## 数组的局限性\n\
  \n1. 形成的数组是同质的。也就是说，整数数组中只能存储整数值，而浮点数组中只能存储浮点值，且字符数组只能存储字符。因此，没有数组可以包含两种数据类型的值。\n\
  2. 在声明数组时，传递数组的大小是强制性的，且该大小必须是一个常量。这会导致内存短缺或浪费。\n3. 在数组中插入或删除元素需要移动元素。\n4. 数组不检查其边界：在\
  \ `C` 中，没有检查来判断输入数组的值是否超过了数组的大小。使用超出数组范围下标输入的数据将简单地放在数组之外，可能会位于其他数据或程序本身之上。\n\n\
  这至少会导致不可预知的结果，而且不会有错误消息警告程序员越界了数组大小。在某些情况下，程序可能会挂起。因此，以下程序可能会产生非预期的结果：\n\n```c\n\
  int a[10],i;\nfor(i=0;i<=20;i++)\n    a[i]=i;\n```\n\n# 一些求解程序\n\n### 1. 写一个程序打印\
  \ n 个数数的平均值。\n\n```c\nint a[50],n,i,sum=0;\nfloat avg;\nprintf(\"Enter the number\
  \ of elements in the array: \");\nscanf(\"%d\",&n);\n/*输入并计算数组和*/\nfor(i=0;i<n;i++)\n\
  \    /*数组中的第一个元素编号为 0，所以最后一个元素比数组的大小少 1*/\n    {\n        printf(\"Enter number\
  \ %d\",i+1);\n        scanf(\"%d\",&a[i]);\n        sum += a[i];\n    }\navg=(float)sum/n;\
  \ /*将 sum 从整数转换为浮点数*/\nprintf(\"average = %f\",avg);\n```\n\n### 2. 写一个程序，在一维数组（无序）的指定位置插入一个元素。\n\
  \n```c\n#define SIZE 20\nmain()\n{\n    int n,i,a[SIZE],item,pos;\n    printf(\"\
  enter no. of elements in the array: \");\n    scanf(\"%d\",&n);\n    /*输入数组*/\n\
