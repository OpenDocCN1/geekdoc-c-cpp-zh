  \ 此处 `a` 是数组，`p` 是指针。\n\n# 你的结构知识\n\n 结构与联合体（枚举、位域、类型定义）\n\n## 引言\n数组是存储相同类型的常用方法。除了数组，还有更多派生类型可以存储信息：结构、联合体、位域。\n\
  \n结构可以被定义为一种派生类型，可以在单个单元中表示不同的类型。结构中的每个数据项被称为成员。通过使用 `struct` 关键字定义结构，如下：\n\n```c\n\
  struct student\n{\n    int roll;\n    char name [10];\n    float per;\n} s1,s2;\n\
  ```\n结构成员不是变量，因此它们没有分配内存。只有在声明对象时才会分配空间（例如 `s1` 和 `s2`）。\n\n脑力训练-`struct` 关键字声明了一个结构\
  \ `student`，它包含了三个细节`roll`、`name`。这些字段被称为成员或元素。该结构命名为 `student`，该名称被称为结构标签。\n\n\
  ### 变量/对象声明\n`struct student s1,s2;`\n结构变量可以与定义时一起声明：\n\n```c\nstruct student\n\
  {\n    int roll;\n    char name[50];\n    float marks;\n} s1,s2;\n```\n\n关于结构的几点：\n\
  1. 结构定义以分号结束。\n2. 虽然整个定义被视为一个语句，但每个成员都在定义内部作为独立语句声明（也称为模板）。\n3. 标签名可以在结构定义时声明，也可以在之后的\
  \ `main()` 函数中声明。\n\n### 使用成员\n在数组中，我们使用下标运算符 `[]` 访问数组的单个元素。结构使用不同的方案。它使用点或周期运算符（`.`）。因此要引用上述结构中的\
  \ `marks`：\n\n### `s1.marks`\n在这里变量名在点之前，成员名在点之后。\n\n\n\n\n\n```c\nstruct student\n\
  {\n    int roll;\n    char grade;\n    int marks;\n};\n\nmain()\n{\n    struct student\
  \ s1={2, 'A', 89};\n    printf(\"Address of roll=%u\",&s1.roll);\n    printf(\"\
  Address of grade=%u\",&s1.name);\n    printf(\"Address of marks=%u\",&s1.marks);\n\
  }\n```\n\n这里是程序的输出：\nAddress of roll=65518\nAddress of grade=65520\nAddress of marks=65521\n\
  \n| S1.roll | s1.grade | s1.marks |\n| :--- | :--- | :--- |\n| 2 | A | 89 |\n| 65518\
  \ | 65520 | 65521 |\n\n## 使用数组的结构\n\n```c\nstruct student\n{\n    int roll;\n  \
  \  char name[50];\n    int marks;\n};\n\nmain()\n{\n    struct student s1;\n   \
  \ printf(\"Enter the data for student:\");\n    scanf(\"%d %s %d\",&s1.roll,s1.name,&s1.marks);\n\
  \    printf(\"Rollnumber=%d,\\nname=%s\\nmarks=%d\",s1.roll, s1.name,s1.marks);\n\
  }\n```\n\n在上面的结构定义中，使用了一个数组来存储学生的名字。虽然 `scanf` 中在变量名前面总是包含 `&`，但字符串没有 `&` 运算符。\n\
  \n## 结构体数组\n\n```c\nstruct student\n{\n    int roll;\n    char name[50];\n    int\
  \ marks;\n} s[10];\n```\n\n上面的定义使用了对象数组来存储 10 个学生的数据。\n\n## 结构体初始化\n\n```c\nstruct\
  \ student s1={1,\"ajay\",75.5};\nstruct student s2[3]={{1,\"ajay\",75.5}, {2,\"\
  vijay\",75.5},{1,\"akash\",75.5}};\n```\n\n### 脑力操练 (Mind Wash Drill)\n如果我们只初始化了结构的某些成员，其他成员将被自动初始化为零。\n\
  \n## 结构中的结构（嵌套结构）\n\n结构中的结构被称为结构的嵌套。当一个结构对象是另一个结构的成员时，这就是嵌套。\n\n```c\nstruct date\n\
  {\n    int d;\n    int m;\n    int y;\n};\n\nstruct employee\n{\n    int id;\n \
  \   struct date dob;\n    struct date doj;\n} e1;\n\nmain()\n{\n    printf(\"Enter\
  \ id of employee\");\n    scanf(\"%d\",e1.id);\n    printf(\"Enter date of birth\"\
  );\n    scanf(\"%d%d%d\",&e1.dob.d, &e1.dob.m,&e1.dob.y);\n}\n```\n\n### 脑力操练 (Mind\
  \ Wash Drill)\n在上面的示例中，我们也在 `employee` 的定义内部定义了结构。\n\n## 结构与指针\n\n```c\nstruct student\
  \ s1,*p;\np = &s1; s1.roll = 5;\n(*p).roll = 7; or p->roll = 7; printf(\"%d\",s1.roll);\n\
  ```\n\n### 脑力操练 (Mind Wash Drill)\n当通过对象访问结构成员时（Object.member），使用点 (`.`) 运算符。当通过指针访问结构成员时（Pointer->member），使用箭头\
  \ (`->`) 运算符。\n\n```c\nstruct box\n{\n    int feet;\n    int inches;\n};\n\nvoid\
  \ swap(struct box *, struct box *);\n\nmain()\n{\n    struct box b1,b2;\n    clrscr();\n\
  \    /*输入第一个对象*/\n    printf(\"Enter height in feet & inches of box 1\");\n    scanf(\"\
  %d%d\",&b1.feet,&b1.inches);\n    /*输入第二个对象*/\n    printf(\"Enter height in feet\
  \ & inches of box 2\");\n    scanf(\"%d%d\",&b2.feet,&b2.inches);\n    swap(&b1,&b2);\n\
  \    printf(\"After swap height of 1ST box- %d feet %d inches\\n\",b1.feet, b1.inches);\n\
  \    printf(\"After swap height of 2ND box- %d feet %d inches\\n\",b1.feet, b1.inches);\n\
  \    getch();\n}\n\nvoid swap(struct box *p1, struct box *p2)\n{\n    int t;\n \
  \   /*交换英尺*/\n    t = p1->feet;\n    p1->feet = p2->feet;\n    p2->feet = t;\n \
  \   /*交换英寸*/\n    t = p1->inches;\n    p1->inches = p2->inches;\n    p2->inches\
  \ = t;\n}\n```\n\n## 联合体 (Union)\n\n联合体也是派生类型。它们也被用于将多个变量组合在一起。但区别在于联合体的所有成员共享同一内存，因此联合体同一时刻只有一个成员存储有效值。联合体是一种用于在不同时间存储不同类型数据的变量。联合体非常像结构。联合体中定义的不同变量被称为联合体的成员。它们需要相同的数据类型。如果一个成员包含一个值，而另一个成员被赋值一个值，那么第一个值会被第二个值覆盖。编译器分配足够的内存来容纳联合体最大的成员。由于内存空间是共享的，这是一种内存内存。\n\
  \n### 语法\n```c\nunion <联合体类型> <名称>\n{\n    <类型> <变量名>;\n}\n```\n\n### 示例：\n```c\n\
  union data\n{\n    char c;\n    int i;\n    long l;\n    float f;\n} d1,d2;\n```\n\
  \n### 脑力操练 (Mind Wash Drill)\n在上面的示例中，`d1` 和 `d2` 各获得 4 字节，因为联合体最大的成员是 4 字节。如果有多个最大的字节，只考虑一个。\n\
  \n### 脑力操练 (Mind Wash Drill)\n在上面的声明中，`union` 是关键字。\n\n### 脑力操练 (Mind Wash Drill)\n\
  点运算符用于访问联合体的成员。例如：\n```\nd.c='a';\nd.i=10;\nd.l=65534;\nd.f=72.456;\n```\n如果你在这个联合体的\
  \ `f` 成员中存储某些内容然后访问 `i` 成员，`i` 的值不可预测。\n\n## 结构与联合体的区别\n\n| | 结构 (Structure) | 联合体\
  \ (Union) |\n| :--- | :--- | :--- |\n| 1. | 关键字是 `struct`。 | 关键字是 `union`。 |\n|\
  \ 2. | 结构对象获得的内存等于所有成员内存之和。 | 联合体对象获得的内存等于联合体最大成员的内存。 |\n| 3. | 所有成员可以同时使用。 | 只有一个成员可以存储有效值。\
  \ |\n\n## 枚举类型 (Enumerated Data Type)\n\n枚举类型是一种具有用户指定常量值的数据类型。其语法与结构或联合体相似：用于定义常量。关键字是\
  \ `enum`。后面跟着枚举器类型。该数据类型允许的名称列表。这些值包含在大括号内并用逗号分隔。\n\n### 示例 –\n\n1. `enum bool{FALSE\
  \ ,TRUE};` /*`false` 和 `true` 是值为 0 和 1 的常量。这种编号是自动完成的*/\n```c\nenum bool b1,b2;\
  \ /*enum bool 对象*/\nb1=FALSE; or b1=TRUE;\n```\n\n2. `enum dow{SUN,MON,TUE=5,WED,THU,FRI,SAT};`\
  \ /*自动编号将为 SUN=0,MON=1,TUE=5,WED=6 等以此类推*/\n\n声明枚举类型不分配存储空间，仅描述了\n\n\n\n\n用户指定的数据类型以及大括号中给定的关联整数常量。默认情况下，第一个值赋值为\
  \ 0，第二个值赋值为 1，第三个值赋值为 3，依此类推。\n\n*   **洗脑练习**：我们也可以在联合体（union）中提供重复的值。\n*   **洗脑练习**：我们可以在联合体中提供浮点数。\n\
  \n### 位域字段 (Bit Fields)\n\n如果程序中的一个变量只需要存储两个值 `1` 或 `0`，我们只需要一个位来存储它。同样，如果变量要存储从\
  \ `0` 到 `3` 的取值，那么只需要两个位，因为 `0` 到 `3` 之间数字的二进制表示都是两位。如果值的范围是从 `0` 到 `7`，则需要四位。\n\
  \n但如果我们存储一个整数，将将使用 2 个字节，这会浪费大量内存，因为没有专门用于处理位（bits）的数据类型。然而，当有多个变量的值可以打包到单个内存位置时，我们可以使用“位域字段”。\n\
  \n假设我们想存储关于俱乐部成员的以下数据。每个成员可以拥有以下数据：\n1. 男性性或女性。\n2. 已婚、未婚、寡妇或离婚。\n3. 拥有八种爱好中的一种（板球、足球等）。\n\
  4. 可以从十六种方案中的任一种中选择（年度方案、月度方案等）。\n\n如果我们在性别中用 `0` 或 `1` 代替 `Male`、`Female`，这将节省一些字节。同样地，其他值也可以转换为数字。\n\
  \n这意味着我们需要一个位来存储性别，两个位来存储婚姻状况，三位来存储爱好，四位来存储方案。因此，我们总共需要 10 个位，这样我们可以将上述所有信息打包到两个字节中。\n\
  \n因此，声明如下：\n\n```c\nstruct employee\n{\n    int gender:1;\n    int mar_status:2;\n\
  \    int hobbies:3;\n    int scheme:4;\n};\n```\n\n上述声明中的冒号告诉编译器我们正在谈论位域字段，冒号后面的数字告诉分配给每个变量的位数。\n\
  \n### 类型定义 (Typed)\n\nC 语言提供了 `typedef` 结构，它允许程序员为内置或用户定义的数据类型提供别名（相同名称）。`typedef`\
  \ 就像给数据类型起了一个昵号。程序变得易于追踪和理解。`typedef` 的通用用法是：\n\n`typedef 旧类型 新类型;` 例如：\n\n`typedef\
  \ int age;`\n\n在这里 `age` 变成了 `int` 的别名。因此我们可以用 `age` 代替 `int`。\n`age a1,a2;` 或 `int\
  \ a1,a2;`\n\n现在 `age` 可以用来定义 `int` 变量 `a1` 和 `a2`。\n\n#### 洗脑练习\n\n在 `typedef` 的语法中，首先是关键字\
  \ `typedef`，然后是数据类型，最后是用户为该类型提供的名称。`typedef` 仅用于数据类型创建别名。在 `typedef` 中，不能定义变量，也不会分配存储。\n\
  \n例如，写成这样是错误的：`Typedef int age a1,a2;` /*无效*/\n\n#### 使用结构的 typedef：\n\n```c\ntypedef\
  \ struct student\n{\n    int roll;\n    char name[50];\n    int marks;\n}st;\n\n\
  main( )\n{\n    st s1,s2;\n    or\n    struct student s1,s2;\n}\n```\n\n`typedef`\
  \ 名称可以与结构的标签名（tagname）相同。\n\n#### typedef 和代码可移植性\n\n`typedef` 可以提高代码的可移植性。假设我们有一个应用程序，假设所有整数都由\
  \ 16 位存储单元表示。在计算机系统 A 上，`int` 可能使用 32 位；在另一个系统 B 上，`int` 可能使用 16 位。\n\n因此，\n\n```c\n\
  /*在计算机系统 A 上*/ /*整数有 16 位*/\ntypedef short int INTEGER;\n\n/*在计算机系统 B 上*/ /*整数有\
  \ 32 位*/\ntypedef int INTEGER;\n```\n\n在整个程序中，我们变量声明中使用 `INTEGER` 代替 `short int`。这个\
  \ `typedef` 可以放在名为 `port.h` 的文件中，然后包含在需要整数的文件中。\n\n### 填空\n\n1. ` ` 是一组分组为单个单元的变量的异构集合。\n\
  2. ` ` 为结构提供了蓝图。\n3. 只有当声明 ` ` 时，才会为结构分配内存。\n4. 结构的成员元素可以通过 ` ` ` ` 进行访问。\n5. 结构指针可以声明为\
  \ ` `。\n6. 结构 了程序的 ` `。\n7. 结构在 ` ` 中应用。\n8. 结构的大小是 ` `。\n9. 异构对象的集合仍称为 ` `。\n10.\
  \ 联合体的所有成员共享 ` `。\n11. 联合体的大小是 ` `。\n12. `typedef` 用于创建 ` `。\n13. `typedef` 的语法是\
  \ ` `。\n\n### 答案\n\n1. `struct` 所有数据的总和\n2. `struct` 成员和子-结构\n3. `.` (点运算符) 或 `->`\
  \ (箭头运算符)\n4. `memory space` (内存空间)\n5. `struct tag_name` 最大内存空间\n6. `ptr_to_pointer`\
  \ 由其中一个成员所需的\n7. `system` (系统)\n8. `new data type` (新数据类型) 编程\n9. `union` 别名\n10.\
  \ `largest memory space` (最大的内存空间)\n11. `required by one of its members` (其中一个成员所需的)\n\
  12. `alias` (别名)\n13. `typedef oldtype newtype;`\n\n### 已解决的题目\n\n1. 编写一个比较两个日期的程序。为了存储日期，使用一个包含三个成员\
  \ `day`、`month` 和 `year` 的结构。如果日期相等显示“Equal”，否则“Unequal”。\n\n```c\nstruct date\n\
  {\n    int day, month, year;\n};\n\n/*检查日期的函数*/\ncheck_date(struct date *dt)\n\n\
  main()\n{\n    int chkdt;\n    struct date d1, d2;/*要比较的日期*/\n    printf(\"\\nEnter\
  \ dates:\");\n    chkdt = check_date(&d1);\n    if(chkdt == 0) exit();\n    fflush(stdin);\n\
  \    chkdt = check_date(&d2);\n    if(chkdt == 0) exit();\n    /*比较结构*/\n    if((d1.day\
  \ == d2.day)&& (d1.month == d2.month)&&(d1.year == d2.year))\n        printf(\"\\\
  nDate are Equal\");\n    else\n        printf(\"\\nDate are Unequal\");\n    getch();\n\
  }\n\ncheck_date(struct date *dt)\n{\n    printf(\"\\nEnter date(dd)\");\n    scanf(\"\
  %d\",&dt->day);\n    printf(\"\\nEnter month(mm)\");\n    scanf(\"%d\",&dt->month);\n\
  \    printf(\"\\nEnter date(yyyy)\");\n    scanf(\"%d\",&dt->year);\n    if((dt->day\
  \ >31 || dt->day<0) || (dt->month >12 || dt->month < 0) || (dt->year > 9999 || dt->year\
  \ < 1000)) {\n        printf(\"\\nImproper date entered\");\n        return(0);\n\
  \    }\n    return(1);\n}\n```\n\n2. 下列代码的输出是什么？\n\n```c\nmain( )\n{\n    struct\n\
  \    {\n        int n;\n        char name[20];\n        int age;\n        float\
  \ sal;\n        char message[50];\n        char message2[50];\n    }m;\n    struct\
  \ emp e={“Matrix\"};}; // 注意：此处原文代码可能存在定义错误\n    printf(\"%d %f\",e.age,e.sal);\n\
  \    m.n = 1;\n    strcpy(m.message1,”you can win”);\n    strcpy( m.message2, “If\
  \ you believe”);\n/*假设结构位于地址 2005*/\n    printf(\"\\n%u %u %u\",&m.n,m.message1,m.message2);\n\
  }\n```\n\n\n\n\n```c\nstruct gos {\n    int n;\n    char mess1[50];\n    char mess2[50];\n\
  } m1 = {2, \"If you are driven by success\", \"make sure that it is a quality drive\"\
  };\n\nvoid main() {\n    struct gos m2, m3;\n    m2 = m1;\n    m3 = m2;\n    printf(\"\
  \\n%d %s %s\", m1.n, m2.mess1, m3.mess2);\n}\n```\n**输出:** 2 If you are driven to\
  \ by success make sure it is quality drive.\n\n**解析:** 对象结构体 `m1` 在结构体创建时初始化。在主程序中创建了另外两个对象\
  \ `m2` 和 `m3`，并将 `m1` 复制到 `m2`，然后将 `m2` 复制到 `m3`，因此 `m1` 被复制到了 `m2` 和 `m3` 中，输出与打印\
  \ `m1` 的成员时相同。\n\n1. 0.000000\n2. 垃圾值\n3. 错误\n4. 以上都不是\n\n**解法:** 0.000000\n\n**解析:**\
  \ 当自动结构体被部分初始化时，结构体的剩余元素将初始化为 0。\n\n```c\nstruct emp {\n    char name[20];\n   \
  \ int age;\n}\n\nint fun(int aa) {\n    int bb;\n    bb = aa * aa;\n    return (bb);\n\
  }\n\nvoid main() {\n    int a;\n    a = fun(20);\n    printf(\"\\n%d\", a);\n}\n\
  ```\n**解析:** 结构体定义末尾缺少分号，编译器认为 `fun()` 将返回 `struct emp` 类型的值，但实际上它试图返回一个 `int`。这导致了类型不匹配，从而产生错误。\n\
  \n6. `f(struct emp);` 在 `printf()` 中更改 `struct emp` 的成员对输出不会产生影响。\n\n一个对象可以赋值给另一个对象，但不能用于其他操作中。\n\
  \n```c\nstruct emp {\n    char name[20];\n    int age;\n};\n\nvoid main() {\n  \
  \  struct emp e = union a {\"matrix\", 30};\n    {\n        f(e);\n        int i;\n\
  \    }\n    char ch[2];\n    f(struct emp ee);\n    union a z = 52;\n    printf(\"\
  %s %d\", ee.name, ee.age);\n    printf(\"%d %d\", z.ch[0], z.ch[1]);\n}\n```\n**解析:**\
  \ 发生错误，**输出:** 0 2。52 的二进制值可以通过在函数 `f()` 之前声明结构体来修复。\n\n**问题:** 结构体（structure）、联合体（union）和枚举（enum）之间的相似之处是什么？\n\
  **答案:** 它们都允许定义新类型。\n\n**问题:** 以下声明有效吗：\n```c\ntypedef struct s {\n    int a;\n\
  \    float b;\n} s;\n```\n**问题:** 结构体可以包含指向自身的指针吗？\n**答案:** 可以，这样的结构被称为引用结构体。\n\n\
  **问题:** 指出以下代码中的错误（如有）：\n```c\ntypedef struct {\n    int data;\n    link;\n} *link;\n\
  ```\n**答案:** `typedef` 为类型定义了一个新名称，在这种情况下，错误是 `typedef` 在定义之前无法使用。在给定的代码中，`typedef`\
  \ 声明尚未定义 `link` 字段。\n\n**问题:** 你将如何消除上述问题？\n**答案:** 要修复这个问题，必须先给结构体赋予一个名称（`struct\
  \ node`）。然后如下所示将 `link` 字段声明为简单的 `struct node *`：\n```c\ntypedef struct node {\n\
  \    int data;\n    link;\n} *link;\n```\n消除问题的另一种方法是将 `typedef` 声明与结构体解耦：\n```c\n\
  struct node {\n    int data;\n    link;\n};\ntypedef struct node *link;\n```\n另一种消除问题的方法是在结构体之前使用\
  \ `typedef`，在这种情况下，你应该在声明 `link` 字段时使用 `link`，如下所示：\n```c\ntypedef struct node *link;\n\
  struct node {\n    int data;\n    link;\n};\n```\n在这种情况下，你定义了一个涉及 `struct node`\
  \ 的新 `typedef`，尽管 `struct node` 尚未完全定义；你是被允许这样做的。\n\n**问题:** `void modify(struct\
  \ emp*)`\n```c\nstruct emp {\n    char name[20];\n    int age;\n};\n\nvoid main()\
  \ {\n    struct emp e = {\"Sanjay\", 35};\n    modify(&e);\n    printf(\"%s %d\"\
  , e.name, e.age);\n}\n\nvoid modify(struct emp *p) {\n    strupr(p->name);\n   \
  \ p->age = p->age + 2;\n}\n```\n**答案:** 在定义结构体之前，函数 `modify()` 的声明中提到了 `struct emp`。要解决这个问题，只需在结构体之后声明函数，或者在原型前添加\
  \ `struct emp` 语句。\n\n**问题:** 以下代码有效吗：\n```c\n#include<alloc.h>\nstruct emp {\n\
  \    int len;\n    char name[1];\n};\nmain() {\n    char newname[] = \"Rahul\";\n\
  \    struct emp *p = (struct emp *) malloc(sizeof(struct emp) - 1 + strlen(newname)\
  \ + 1);\n    p->len = strlen(newname);\n    strcpy(p->name, newname);\n    printf(\"\
  %d %s\", p->len, p->name);\n}\n```\n**答案:** 是的，程序为结构体分配了空间，使得 `name` 字段可以容纳请求的名字（而不是结构体声明建议的那样）。\n\
  \n**问题:** 上述程序有更好的写法吗？\n**答案:** 实现该问题的最佳方法是使用字符指针而不是数组，如下：\n```c\n#include<alloc.h>\n\
  struct emp {\n    int len;\n    char *name;\n};\nmain() {\n    char newname[] =\
  \ \"Rahul\";\n    struct emp *p = (struct emp *) malloc(sizeof(struct emp));\n \
  \   p->len = strlen(newname);\n    p->name = malloc(p->len) + 1;\n    strcpy(p->name,\
  \ newname);\n    printf(\"%d %s\", p->len, p->name);\n}\n```\n显然，将长度和字符串存储在同一块内存中的便利性已经丢失，释放此结构体的实例需要调用两次\
  \ `free()` 函数。\n\n**问题:** 你如何释放上面分配的内存？\n**答案:** `free(p->name);` `free(p);`\n\n\
  **问题:** 下列程序的输出是什么？\n```c\nmain() {\n    struct emp {\n        char *n;\n      \
  \  int age;\n    };\n    struct emp e1 = {\"David\", 23};\n    struct emp e2 = e1;\n\
  \    strupr(e2, n);\n    printf(\"%s\", e1.n);\n}\n```\n**答案:** 当结构体赋值、传递或返回时，复制是单体式的。这意味着任何指针字段的副本将指向相同的地方。换句话说，所指向的内容不会被复制。因此，通过\
  \ `e2.n` 更改名称时，它会自动更改 `e1.n`。\n\n\n\n\n\n# 回答\n\n回答：结构体不能使用内置的 `==` 和 `!=` 运算符进行比较。这是因为编译器没有一种单一且良的方法来实现结构体比较。逐字节比较可能会比较到结构体中未使用的填充字节（padding）中的位数据（这种填充用于用于保持后续字段的对齐正确）。逐字段比较对于大型结构体来说，可能需要大量不可接受的重复代码。此外，任何编译器生成的比较都无法期望在所有情况下都能恰当地比较指针字段；例如，对于\
  \ `char *` 字段，通常使用 `strcmp()` 而比使用 `==` 更恰当。\n\n## 问题：你如何检查两个结构体变量的内容是否相同？\n\n回答：\
  \ \n```c\nstruct emp {\n    char n[20];\n    int age;\n};\nmain()\n{\n    struct\
  \ emp e1= {“David”, 23};\n    struct emp e2;\n    scanf(\"%s %d”,e2.n, &e2.age);\n\
  \    if(structcmp(e1, e2) == 0)\n        printf(“The structures are equal”);\n \
  \   else\n        printf(“Structures are unequal”);\n}\n\nstructcmp( struct emp\
  \ x, struct emp y)\n{\n    if(strcmp(x.n, y.n) == 0)\n        if(x.age == y.age)\n\
  \            return(0);\n    return(1);\n}\n```\n简而言之，如果你需要比较两个结构体，你必须编写自己的函数来逐字段地执行比较。\n\
  \n## 问题：编译器是如何实现结构体传递和返回的？\n\n回答：当结构体作为参数传递给函数时，整个结构体通常会被推入栈中。为了避免这种开销，许多程序员更倾向于传递结构体的指针而不是实际的结构体。结构体通常从函数的一个位置通过编译器提供的、额外的函数“隐藏”参数所指向的位置返回。\n\
  \n## 问题：我该如何从数据文件中读/写结构体？\n\n回答：要写入结构体，我们可以使用如下所示的 `fwrite()`：`fwrite(&e, sizeof(e),1,fp);`\
  \ 其中 `e` 是一个结构体变量。相应的 `fread()` 调用可以从文件中读回该结构体。\n\n调用 `fwrite()` 时，它从地址 `&e` 写入\
  \ `sizeof(e)` 字节。然而，使用 `fwrite()` 写入为内存镜像的数据文件是不具有可移植性的，特别是当它们包含浮点字段或指针时。这是因为结构体的内存布局取决于机器和编译器。不同的编译器可能使用不同数量的填充，而且基本类型的大小和字节顺序在不同机器上各异。因此，作为内存镜像写入的结构体不一定能被运行在其他机器上的程序（甚至由其他编译器编译的程序）重新读回，如果你写入的数据文件将来会在机器之间交换，那么这是一个重要问题。\n\
  \n## 问题：如果使用 `fwrite()` 将以下结构体写入文件，`fread()` 能成功读回它吗？\n\n```c\nstruct emp {\n  \
  \  char *n;\n    int age;\n};\nstruct emp e = {“Suj”, 5}; FILE *fp;\nfwrite(&e,\
  \ sizeof(e), 1,fp);\n```\n回答：不能，因为结构体包含指针，当使用 `fwrite()` 将结构体写入磁盘时，只有 `n` 中存储的值会被写入（而不是它指向的字符串）。当这个结构体被读回时，读回的是该地址，内存中该地址不太可能存在预期的字符串。\n\
  \n## 问题：以下程序会输出结构体的大小为 7 字节吗？\n\n```c\nstruct ex {\n    char ch;\n    int i; long\
  \ a;\n};\n```\n回答：不能，编译器可能会通过对第一个 `char` 填充另一个字节来在结构体中留空，仅仅是为了确保随其后的整数存储在偶数位置。此外，在\
  \ `integer` 之后可能会有额外的字节，以确保 `long integer` 存储在 4 的倍数的地址上。这样做是因为许多不同值的机器要求数据必须进行适当的对齐。某些机器根本无法执行非对齐访问。你的编译器可能提供一种扩展来让你控制结构体的紧凑性（即是否进行填充），也许通过\
  \ `#pragma` 实现，但没有标准方法。如果你担心浪费空间，可以通过从大到小的顺序排列结构体的成员来最大限度地减少填充的影响。你有时可以通过使用位域（bitfields）来获得大小和对齐获得更多控制，尽管它们也有自己的缺点。\n\
  \n```c\nmain()\n{\n    struct a {\n        int category:5;\n        int scheme:4;\n\
  \    };\n    printf(“size = %d”, sizeof(struct a));\n}\n```\n回答：`size= 2`。由于我们在结构体使用了位域，且总位数超过了\
  \ 8 位（准确来说是 9 位），因此结构体的大小报告为 2 字节。\n\n## 实验练习 – (WAP- 写一个程序)\n\n1. 编写一个程序存储 10 名员工的信息，并根据用户输入的员工编号显示员工的信息。\n\
  2. 编写一个程序使用结构体接受并打印学生的成绩。\n3. 编写一个程序，该函数接收两个 `date(day, month, year)` 结构体对象作为参数，并返回日期较大的结构体。\n\
  4. 编写一个程序使用结构体 `point(x, y)` 来建模一点。定义三个点，让用户输入其中两个点的值。然后将第三点设置为另外两个点的和，并显示新点的值。与程序的交互可能如下：输入\
  \ p1 的坐标：2 3 输入 p2 的坐标：6 8 p1+p2 的坐标为：8 11\n5. 编写一个程序向给定的日期增加给定的天数。尽可能使用结构体。\n6.\
  \ 为 20 条选民记录给出必要的声明，每个记录包含四个数据值，即：编号、姓名、地址、年龄。使用上述声明编写一个程序段，打印年龄超过 60 岁的所有选民的编号和姓名。（假设数据类型合适。）\n\
  \n# C 中的控制台输入输出\n\n## 引言\n\n### getchar 函数（单字符输入）\n\n`getchar()` 用于将单个字符输入计算机。`getchar()`\
  \ 函数是标准输入输出库的一部分。它从标准输入设备（通常是键盘）返回一个字符。该函数不需要任何参数。\n\n语法：`字符变量 = getchar();`\n\n\
  ### putchar 函数（单字符输出）\n\n`putchar()` 用于将单个字符传输到标准输出设备（通常是显示器）。它是标准 C I/O 库的一部分。传输的字符通常表示为字符类型变量。它必须作为参数跟在函数后面，并放在括号内。\n\
  \n语法：`putchar(字符变量);`\n\n### scanf 函数（输入数据）\n\n`scanf()` 可用于输入任何数值值、单个字符和字符串的组合。`scanf()`\
  \ 从标准输入设备读取数据并将其存储在计算机内存中。该函数返回成功输入的数据项数。\n\n语法：`cnt=scanf(\"控制字符串\", arg1,arg2,arg3……argn);`\
  \ 其中 `cnt` 的值将是成功输入的数量 & 控制字符串是一个\n\n\n\n\n`string` 用于格式化，而 `arg1`、`arg2`…… 是表示单个输入数据项的参数。参数以变量或数组的形式写入，其类型与控制字符串中相应的字符组匹配。每个变量名之前必须有一个取地址符（`&`）。\n\
  \n## printf 函数（写入输出数据）\n\n此函数可以用于输出数值、单个字符和字符串的任何组合。它的目的是显示数据。`printf()` 将数据从计算机内存移动到标准输出设备。\n\
  \n### 语法\n```c\nprintf(\"control string\",arg1,arg2………argn);\n```\n\n这里 `control\
  \ string` 指一个包含格式信息的字符串，`arg1`、`arg2` 等是表示单个输出数据项的参数。\n\n`control string` 可以包含一个标志，它会影响输出的外。标志必须紧跟在百分号（`%`）之后。常用的标志包括：\n\
  \n- `-`: 数据项在字段内左对齐（为了填充最小字段宽所需的空白格将添加在数据项之后，而不是之前）。\n- `+`: 每个有符号的数值数据项前都会有一个符号（`+`\
  \ 或 `-`）。如果没有这个标志，只有负数值数据项前会有符号。\n- `0`: 导致前导零出现而不是前导空格。仅适用于在最小尺寸大于数据项的字段内右对齐的数据项。\n\
  - `' '`（空格）: 每个正有符号的数值数据项前都会有一个空白格。如果两个标志都存在，此标志会被 `+` 标志覆盖。\n- `#`（配合 `o-` 和 `x-`\
  \ 类型转换）: 导致八进制和十六进制数据项分别被 `o` 和 `ox` 前缀引导。\n- `#`（配合 `e-`、`f-` 和 `g-` 类型转换）: 导致所有浮点数都包含一个小数点，即使该数据项是一个整数。\n\
  \n 可选的格式指定符\n\n1. 字段宽指定符告诉 `printf()` 在打印值时屏幕上应该使用多少列。例如：\n\n```c\nint a=5;\nprintf(\"\
  %10d\",a);\n```\n这会给整数 `a` 分配一个 10 列的字段宽。由于该值无法占据整个 10 列，它将右对齐，并在左侧留下空白格。\n因此输出为：\n\
  ```\n 5\n```\n\n2. 如果在格式指定符中给出负号：\n```c\nint a=5;\nprintf(\"%-10d\",a);\n```\n这意味着输出应该左对齐，在右侧留出空间。如果声明如下，请显示每个以下\
  \ `printf` 语句产生的输出：\n```c\nfloat a=2.5, b=0.00005, c=3000;\n```\n\n(i) `printf(\"\
  %f %f %f\", a, b, c);`\n输出：`2.500000 0.000050 3000.000000`\n注意每个 `float` 数字在小数点后使用六位。\n\
  \n(ii) `printf(\"%8f %8f %8f\", a, b, c);`\n输出：`2.500000e+00=5.000000e-05 3.000000e+03`\
  \ （注：此处示例输出似乎有误，通常为科学计数法形式）\n\n(iii) `printf(\"%e %e %e\", a, b, c);`\n输出：`2.5000e+00\
  \ 5.0000e-05 3.000e+03`\n\n(iv) `printf(\"%12.4e %12.4e %8.3e\", a, b, c);`\n输出：`2.500000\
  \ +0.000050 %ø8f`\n\n(v) `printf(\"%-8f %+8f %ø8f\", a, b, c);`\n输出：`2.500000 +0.000050\
  \ %ø8f`\n\n(vi) `printf(\"%#8f %8f %8f\", a, b, c);`\n输出：`2.500000 0.000050 3000.000000`\n\
  \n(vii) `printf(\"%g %g %g\", a, b, c);`\n输出：`2.5 5e-05 3000`\n\n(viii) `printf(\"\
  %#g %#g %#g\", a, b, c);`\n输出：`2.50000 5.00000e-05 3000.00`\n\n### 示例\n这是一个定义了使用整数和浮点数、小数、八进制、十六进制数标志的简单程序：\n\
  \n```c\n#include<stdio.h>\n#include<conio.h>\n\nmain()\n{\n    int i =23;\n    float\
  \ x=12.0, y=-3.3;\n    int p=234, q=0177, r=0xa8c;\n    printf(\"%6d %7.0f %10.1e\\\
  n\",i,y);\n    printf(\"%-6d %-7.0f %-10.1e\\n\",i,y);\n    printf(\"%8u %8o %8x\\\
  n\",p,q,r);\n}\n```\n\n\n\n\n# 通过 C 进行文件处理\n\n```c\nscanf(\"%c\", &i); scanf(\"\
  %d\", &ch); printf(\"%c %d\",ch, i);\n```\n**输出：** 你将没有机会为第二个 `scanf()` 语句输入字符。解决此问题的方法是在第二个\
  \ `scanf()` 之前加上以下语句：`fflush(stdin);`。\n\n这将把上一个 `scanf()` 产生的回车键从输入流（即键盘）中冲刷掉，变为\
  \ `%5d`。\n\n## 10. 可以在 `scanf()` 格式字符串中指定变量字段宽度吗？\n\n**输出：**\n\n不可以。在 `scanf()`\
  \ 格式字符串中 `%` 符号后的 `*` 用于抑制赋值。也就是说，当前的输入字段会被扫描，但不会被存储。\n\n## 11. 在 `fgets()` 和 `gets()`\
  \ 中，哪个函数使用是安全的？\n\n**输出：**\n`fgets()` 是。因为与 `fgets()` 不同，`gets()` 无法告知存储提供字符串的缓冲区大小。因此，始终存在缓冲区溢出的。\n\
  \n---\n\n## 指出以下程序段中的错误（如有）：\n\n![](img/image01135.jpeg)\n\n### 1. main()\n```c\n\
  main() {\n    int i;\n    char a[] = \"Hello\";\n    while(a != '\\0') {\n     \
  \   printf(\"%c\",*a);\n        a++;\n    }\n}\n```\n\n### 5. main()\n```c\nmain()\
  \ {\n    int dd,mm,yy;\n    printf(\"\\n Enter day,moth and year\\n\");\n    scanf(\"\
  %d %*c %d %*c%d\",&dd,&mm,&yy);\n    printf(\"The date is:%d-%d-%d\",dd,mm,yy);\n\
  }\n```\n**输出：** 无错误。\n\n### 6. main()\n```c\nmain() {\n    ![](img/image01136.jpeg)\n\
  \    char buffer[50];\n    int no = 97;\n    double val = 2.34174;\n    char name[10]\
  \ = \"Shweta\";\n    ![](img/image01137.jpeg)![](img/image01138.jpeg)\n}\n```\n\
  **输出：** 错误。\"Lvalue required\"，因为数组不能自增。\n\n### 2. main()\n```c\nmain() {\n    double\
  \ dual;\n    scanf(\"%f\",&dual); \n    printf(\"\\nDouble Value = %lf\",dual);\n\
  }\n```\n**输出：** 无错误，但输出将是 -0.000000。因为 `double` 占用 8 字节，而 `float` 占用 4 字节。\n\n###\
  \ 3. main()\n```c\nmain() {\n    int evel;\n    scanf(\"%d\\n\",&n); \n    printf(\"\
  \\nInterger Value = %d\",evel);\n}\n```\n**输出：** 错误。未定义符号 `n`。\n\n### 4. main()\n\
  ```c\nmain() {\n    char *mess[5];\n    sprintf(buffer,\"%d %lf %s\",&no,val,name);\n\
  \    printf(\"\\n%d %lf %s\",no,val,name);\n    sscanf(buffer,\"%4d %2lf %s\",&no,val,name);\n\
  \    printf(\"\\n%s\",buffer);\n    printf(\"\\n%d %lf %s\",no,val,name);\n}\n```\n\
  **输出：** 无错误。因为 `sprintf()` 将变量打印到指定的字符串中（例如，从字符串读取并转换并存储在变量数组中，当我们打印 buffer 时）。\n\
  \n---\n\n## 回答以下问题：\n\n**1) 为了在数组 `char str[100]` 中接收字符串“We have got the guts!!”，你会使用以下哪个函数？**\n\
  a) `scanf(\"%s\",str)`\nb) `gets(str)`\nc) `getche(str)`\nd) `getchar(str)`\n**输出：**\
  \ `gets(str)`\n\n**2) 如果要通过键盘接收单个键，你会使用哪个函数？**\n**输出：** `scanf()`\n\n**5) `getchar()`、`fgets()`、`getch()`\
  \ 和 `getche()` 之间有什么区别？**\n**输出：** 它们都从键盘接收一个字符。它们之间有细微区别：`getchar()` 在输入字符后需要按回车键。`fgets()`\
  \ 与 `getchar()` 相同，而 `getch()` 在不按回车键的情况下从键盘接收字符。\n\n---\n\n# 通过 C 进行文件处理\n\n##\
  \ 引言\n到目前，我们一直使用 `scanf` 和 `printf` 函数来读写数据。这些是面向控制台的输入输出函数，始终使用键盘和屏幕作为目标位置。数据量较小时没有问题。但在现实问题中涉及大量数据，在这种情况下，面向控制台的输出和输入操作有两个主要问题：\n\
  \nA. 处理大量数据非常耗时。\nB. 程序一旦关闭或计算机关，所有数据就会丢失。为了克服这些问题，我们使用文件处理。文件可以用于存储硬盘上的数据，这样数据就可以永久保存，即使计算机关闭也不会被删除。\n\
  \n文件可以定义为磁盘上的一个位置，用于存储一组相关数据。对文件可以执行许多操作：\n- 命名。\n- 打开文件。\n- 从文件中读取数据。\n- 向文件中写入数据。\n\
  - 关闭文件。\n\n让我们看看一些文件操作函数：\n\n| 函数名 | 操作 |\n| :--- | :--- |\n| `fopen()` | 创建新文件或打开现有文件。\
  \ |\n| `fclose()` | 关闭文件。 |\n| `fgetc()` | 从文件中读取一个字符。 |\n| `fputc()` | 向文件中写入一个字符。\
  \ |\n| `fprintf()` | 向文件中写入数据。 |\n| `fscanf()` | 从文件中读取数据。 |\n| `fgetw()` | 读取一个整数。\
  \ |\n| `fputw()` | 写入一个整数。 |\n| `fseek()` | 将位置设置为文件的指定位置。 |\n| `ftell()` | 给文件的当前位置（即从开始的字节数）。\
  \ |\n| `rewind()` | 将位置置回文件开头。 |\n| `fwrite()` | 向文件中写入数据。 |\n| `fread()` | 从文件中读取数据。\
  \ |\n| `feof()` | 测试是否到达文件末尾。 |\n| `fflush()` | 刷新。 |\n| `Remove()` | 删除文件。 |\n\
  | `Rename()` | 更改文件名或路径。 |\n| `ferror()` | 测试文件是否发生错误。 |\n\n### 打开文件\n在从硬盘上的文件读取或写入信息之前，我们必须打开文件。使用\
  \ `fopen()` 函数打开文件，并传入模式告诉编译器我们要写入、读取或修改该文件。`fopen()` 函数执行三个任务：\n1. 磁盘搜索文件。\n2.\
  \ 将文件从硬盘加载到名为 `buffer` 的内存区域。\n3. 设置一个指向缓冲区中第一个字符的指针。\n\n### 缓冲区的需要\n缓冲区是内存中的一个临时区域，文件在此保留一段时间以便快速访问。每次都去硬盘读取一个字符并打印到屏幕，然后再次去硬盘访问下一个字符，效率较低。在这里缓冲区派上了用场，每当我们打开一个文件时，内容会被复制到这个临时区域，然后从缓冲区而不是磁盘读取字符；同样，逐个将字符写入磁盘也会浪费时间，因此缓冲区用于写入字符，然后将其传输到硬盘。`fopen()`\
  \ 收集文件名、文件大小和打开模式的信息，然后将文件的地址返回给名为 `fp` 的文件指针。可以解释为：\n\n```c\nFILE *fp;\nfp=fopen(\"\
  file_name\",\"mode\");\n```\n这里 `FILE` 是头文件 `stdio.h` 中定义的常量，因此必须使用 `#include<stdio.h>`。\n\
  \n### 读取文件\n使用 `fgetc()` 函数读取从硬盘（部分或全部）带入缓冲区的文件内容。`fgetc()` 的用法如下：\n\n```c\nch=\
  \ fgetc(fp);\n```\n\n\n\n\n\n`fgetc()` 用于从指针的当前位置读取字符。指针现在会向前移动一位，以便指向下一个字符。由 `fgetc()`\
  \ 读取的字符被赋值给变量 `ch`。\n\n我们在无限 `while` 循环中使用此 `fgetc()`，但在文件末尾时必须跳出循环。这是通过一个放置在文件末尾的特殊字符实现的。该字符的\
  \ ASCII 值为 26。该字符本身不会被直接返回，而是会返回一个名为 `EOF` 的宏。这个 `EOF` 也定义在 `stdio.h` 中。`fgetc()`\
  \ 也可以用 `getc()` 替换。\n\n在以 `\"r\"` 模式打开文件时，我们可能会遇到问题，如果磁盘上不存在指定名称的文件。同样，以 `\"w\"\
  ` 模式打开文件也可能由于许多原因失败，例如磁盘空间不足、写保护或磁盘损坏。现在，如果文件没有打开，`fopen()` 函数将返回 `NULL`（定义在 `stdio.h`\
  \ 中，并用作 `# define NULL 0`）。\n\n文件打开模式有：\n- `\"r\"`：以只读模式打开已存在的文件。\n- `\"w\"`：以只写模式打开一个新文件。\n\
  - `\"a\"`：以追加模式打开已存在的文件。\n- `\"r+\"`：以读写模式打开已存在的文件。\n- `\"w+\"`：以读写模式打开一个新文件。\n\
  - `\"a+\"`：以读和追加模式打开已存在的文件。\n\n### 向文件写入字符\n\n函数 `fputc()` 用于将屏幕上的字符打印到文件中。要在文件中打印字符串，则使用函数\
  \ `fputs()`。\n\n![](img/image00982.jpeg) `fputc(ch,fp);` 此处 `ch` 是字符的名字，`fp` 是文件指针。\n\
  \n![](img/image00982.jpeg) `fputs(s,fp);` 此处 `s` 是字符串的名字，`fp` 是文件指针。\n\n让我们尝试一个简单的程序：\n\
  \n```c\n#include<stdio.h>\nmain() {\n    FILE *fp; /*声明文件指针*/\n    fp = fopen(\"\
  sample.dat\",\"r\"); /*以读模式打开文件 sample.dat*/\n    if(fp==NULL)\n        printf(\"\
  file cannot be opened\");\n    else {\n        ………\n        fclose(fp);\n    }\n\
  }\n```\n\n### 关闭文件\n\n当我们完成文件读取后，需要关闭它。这是通过 `fclose()` 实现的。其用法为：`fclose(fp);`。\n\
  \n关闭文件不需要文件名。`fclose()` 函数执行了三个主要任务：\n![](img/image00982.jpeg) 缓冲区中的字符将写入磁盘上的文件。\n\
  ![](img/image00982.jpeg) 在文件末尾将写入一个 ASCII 值为 26 的字符。\n![](img/image00982.jpeg) 缓冲区从文件中被消除。\n\
  \n#### 1. 编写一个程序统计文件中字符、空格、行的数\n\n```c\n#include<stdio.h>\nmain() {\n    FILE *fp;\n\
  \    char ch;\n    int lines=0,tab=0,characters=0;\n    fp=fopen(\"text.c\",\"r\"\
  );\n    while(1) /*无限循环*/ {\n        ch = fget(fp);\n        if(ch==EOF)\n     \
