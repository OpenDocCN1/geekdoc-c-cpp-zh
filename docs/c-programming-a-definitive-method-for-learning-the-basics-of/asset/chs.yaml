  \ \");\n    scanf(\"%d %d\",&item,&pos);\n    pos--; /*数组从 0 开始*/\n    for(i=n-1;i>=pos;i--)\n\
  \        a[i+1]=a[i]; /*插入*/\n    a[pos]=item; /*输出*/\n    for(i=0;i<n+1;i++)\n\
  \        printf(\"\\n%d\",a[i]);\n}\n```\n\n### 3. 写一个程序读取一个整数数组。程序应该显示出现在偶数下标和奇数下标位置的元素。\n\
