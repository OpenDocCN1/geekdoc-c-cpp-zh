  \n```c\nint a = 5;\n```\n\n在这里 `a` 是变量名，变量的值为 `5`，而变量的地址为 `100`（假设）。\n\n![](img/image01092.jpeg)\n\
  \n## 大脑洗练练习表 – 声明指针\n\n![](img/image01093.jpeg)\n\n1. 使用星号 `*` 声明指针。\n2. 声明一个整数：`int\
  \ I;`。\n3. 声明一个指向整数的指针：`int *p;`。\n\n![](img/image01094.jpeg)\n4. 关于 `int* p;` 中符号的位置存在一些争议。\n\
  \n第一步是知道如何声明指针。这是通过使用 C 语言的乘法字符 `*` 实现的（显然它并没有执行乘法运算）。`*` 放在关键字 `int` 和变量名之间的某个位置。它创建的不是整数，而是一个指向整数的指针。\n\
  \n## 大脑洗练练习表 –\n\n上方和下方的表格将帮助你通过指尖理解指针的概念。\n\n| Int | *pi; | /* pi 是一个指向 int 的指针\
  \ */ |\n| :--- | :--- | :--- |\n| long int | *p; | /* p 是一个指向 long int 的指针 */ |\n\
  | Float* | pf; | /* pf 是一个指向 float 的指针 */ |\n| Char | c, d, *pc; | /* c 和 d 是 char，pc\
  \ 是指向 char 的指针 */ |\n| double* | pd, e, f; | /* pd 是指向 double 的指针，e 和 f 是 double\
  \ */ |\n| char* | start; | /* start 是一个指向 char 的指针 */ |\n| char* | end; | /* end\
  \ ... |\n\n变量的声明告诉编译器：\n1. 在内存中预留空间来存放整数值。\n2. 将名称 `a` 与此内存位置关联。\n3. 在此位置存储值 `5`。\n\
  \n## 指针和间接运算符 –\n\n与指针使用的两个基本运算符是：\n1. 地址运算符 `&`\n2. 间接运算符 `*`\n\n```c\nmain()\n\
  {\n    int a = 5;\n    int *p; /*指针声明*/\n    p= &a; /*将变量 a 的地址拷贝给指针 p*/\n    *p\
  \ = 10; /*通过间接或使用指针改变变量 a 的值\n    printf(\"%d\", a); printf(\"%d\",*p);\n    printf(\"\
  %d\",*(&a));\n}\n```\n\n大脑洗练 - 上述程序中所有的 `printf` 语句输出均为 10。由于变量 `p` 不是像其他整数变量那样的普通变量，它是存储另一个变量（在此情况下为\
  \ `a`）地址的变量。由于 `p` 是变量，编译器必须为这个变量提供内存。任何类型的指针在内存中都占用两个字节。\n\n```c\nint *p1; float\
  \ *p2; char *p3;\n```\n所有指针 `p1`、`p2`、`p3` 各占用 2 字节。\n\n## 内存与指针 -\n\n假设为 `int`、`float`、`char`\
  \ 声明了三个指针。这三个指针在内存中都会占据 2 字节。这是因为所有内存地址都是从 0 到 65536 的整数值。因此我们可以说，指针指针类型如何，都是以整数值的形式存储地址，且每个整数只需要两个字节。\n\
  \n```c\nmain()\n{\n    int a = 5,*p1;\n    float b=2.5,*p2;\n    char c='a',*p3;\n\
  \    p1= &a;\n    p2 = &b;\n    p3=&c;\n    printf(\"%d\",sizeof(p1));\n    printf(\"\
  %d\",sizeof(p2));\n    printf(\"%d\",sizeof(p3));\n}\n```\n输出：2 2 2\n\n## 指针与地址\
  \ -\n\n```c\nmain()\n{\n    int a = 5;\n    int *p;\n    p= &a;\n    *p = 10;\n\
  \    printf(\"%d\", p); /*以整数形式打印指针 p 中的地址 */\n    printf(\"%u\",p); /*以无符号整数形式打印指针\
  \ p 中的地址 */\n    printf(\"%x\",p); /*以十六进制形式打印指针 p 中的地址 */\n    printf(\"%x\",p);\
  \ /*以十六进制形式打印指针 p 中的地址 */\n}\n```\n输出：-12, 65524, fff4, FFF4\n\n让我们评估一下输出。第一个答案是一个负值，这是因为指针的范围是从\
  \ 0 到 65536，而变量是从上到下分配内存的，即从 65536、65535、65534 等一直到 0。\n\n变量 `a` 存储在地址 65524，如果我们使用格式说明符\
  \ `%d` 打印存储在指针 `p` 中的变量 `a` 的地址，就会打印出一个负值，因为该地址超过了 `int` 的限制。如果使用 `%u`，地址将以无符号整数的形式打印。`%x`\
  \ 或 `%X` 用于以十六进制形式打印地址，区别在于大小写。\n\n## 指针在表达式中使用 -\n\n像任何其他变量一样，指针可以在表达式中使用：\n1.\
  \ 指针允许加减整数。`sum + p1;`\n2. 同样允许赋值操作：`sum+= p1;` 此外还有自增自减：`++p;` 和 `p--;` 让我们通过以下代码演示对指针进行加减操作：\n\
  ```c\nmain()\n{\n    int a[5]={10,20,30,40,50},*p;\n    p=a;\n    printf(\"%d\"\
  ,++p); /*对指针进行加 1*/\n    printf(\"%d\",p--); /*对指针进行减 1*/\n    printf(\"%d\",*p);\
  \ /*解引用当前指针*/\n}\n```\n输出：20 20 20\n\n3. 如果 `p1` 和 `p2` 都指向同一个数组，那么 `p2-p1` 给出它们之间的元素个数。`*p3\
  \ = p2 - p1;`\n\n4. 指针还可以进行比较，例如 `p1>p2`、`p1==p2`、`p1!=p2`。这些比较在处理字符串或数组时有用。\n5.\
  \ 两个指针不能相乘或除除。\n\n## 大脑洗练 –\n\n空指针是一个特殊的指针值，已知不指向任何地方。这意味着任何其他有效指针（指向任何变量、数组单元或任何其他事物）永远不会与空指针相等。使用空指针的另一种方法是使用任何标准头文件，包括\
  \ `<stdio.h>`、`<stdlib.h>` 和 `<string.h>`。为了将指针初始化为空指针，可以使用如下代码：\n```c\n#include\
  \ <stdio.h>\nint *p = NULL;\n```\n在检查所指向的值之前，为了测试它是否为空指针，可以使用如下代码：\n```c\nif(p !=\
  \ NULL)\nprintf(\"%d\\n\", *p);\n```\n也可以通过常量 0 来引用空指针，你会看到某些代码直接设置空指针：\n```c\n\
  int *p = 0;\n```\n此外，由于 C 语言中“真”的定义是非 0 的值，你会看到使用简写代码测试非空指针：\n```c\nif(p)\nprintf(\"\
  %d\\n\", *p);\n```\n这与我们之前的示例含义相同；`if(p)` 等同于 `if(p != 0)` 等同于 `if(p != NULL)`。\n\
  \n## 指针的指针 –\n\n指针存储变量的地址，同样，指针的地址也可以存储在另一个指针中。\n\n```c\nmain()\n{\n```\n\n\n\n\n\
  ```c\nint a=5; int *p1; /*指向整数的指针*/\nint **p2; /*指向指针的指针的指针*/\nint ***p3; /*指向指针的指针的指针的指针*/\n\
  p1= &a;\np2= &p1;\np3 =&p2;\n\nprintf(\"%d\",a); /*输出 = 5*/\nprintf(\"%d\",*p1);\
  \ /*输出 = 5*/\nprintf(\"%d\",**p2); /*输出 = 5*/\nprintf(\"%d\",***p3); /*输出 = 5*/\
  \ \nprintf(\"%u\",*p2); /*将打印 p1 的地址*/\n```\n\n# 指针与数组\n\n当声明一个数组时，编译器会分配一个基地址和足够的存储空间，以便在连续的位置包含数组中的所有元素。\n\
  \n基地址是数组第一个元素（索引 0）的位置。假设我们如下所示声明数组 `a`：\n\n```c\nstatic int a[5]={10,20,30,40,50};\n\
  ```\n\n假设数组 `a` 的基地址为 100，且每个整数需要两个字节。\n\n| [0] | [1] | [2] | [3] | [4] |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| 10 | 20 | 30 | 40 | 50 |\n| 100 | 102 | 104 |\
  \ 106 | 108 |\n\n名称 `a` 被定义为指向第一个元素 `a[0]` 的常量指针，因此 `a` 的值为 100，即存储 `a[0]` 的位置。也就是说\
  \ `a` 等于 `&a[0]`，等于 100。\n\n如果我们将指针 `p` 声明为整数指针，那么可以让指针 `p` 指向数组 `a`：\n\n```c\n\
  p= a;\n 或 p = &a[0];\n```\n\n现在我们可以使用 `p++` 从一个元素移动到另一个元素来访问此数组的每个值。`p` 和 `a` 之间的关系所示：\n\
  \n- `p` 等于 `&a[0]` (=100)\n- `p+1` 等于 `&a[1]` (=102)\n- `p+2` 等于 `&a[2]` (=104)\n\
  - `p+3` 等于 `&a[3]` (=106)\n- `p+4` 等于 `&a[4]` (=108)\n\n在处理数组时，我们可以使用数组索引或指针来访问元素。因此，我们可以如下方式指向数组的第三个元素：`a[2]`\
  \ 或 `*(p+2)`（记住数组索引从 0 开始）。\n\n# 指针与函数\n\n如前所述，将数组作为参数传递的函数使用了引用传递机制。编写一个程序（WAP）来交换两个数字。\n\
  \n![](img/image01095.jpeg)\n![](img/image01096.jpeg)\n\n在引用传递中-\n\n![](img/image00982.jpeg)\
  \ 函数原型被声明为指针。\n\n![](img/image00982.jpeg) 在函数定义中使用解引用指针。\n\n![](img/image00982.jpeg)\
  \ 当调用函数时，地址作为实际参数传递。\n\n### 常见错误\n\n指针在初始化之前包含垃圾地址。如果我们尝试解引用此指针，它不会产生任何错误，但它会跳转到该地址并在那里赋值。这是一个编译器无法检测的逻辑错误。\n\
  \n# 内存分配\n\n1. 静态内存分配。\n2. 动态内存分配。\n\n使用数组的传统方法是带大小声明数组，由于数组的大小必须是一个常量，这会导致内存浪费或短缺，因为数组是在程序编译时分配内存的。\n\
  \n## 总结\n\n编译时分配的内存称为静态内存。这些问题可以通过使用指针来克服。指针可以用于程序执行时分配内存，这被称为动态内存。因此，动态内存可以描述为运行时分配内存的过程。C\
  \ 语言本身不具备这种功能，但可以使用头文件 `alloc.h` 将其包含在程序中。\n\n| 函数 | 任务 |\n| :--- | :--- |\n| `malloc()`\
  \ | 分配请求的字节数并将起始地址返回指针。 |\n| `calloc()` | 分配请求的字节数，将其初始化为零并将起始地址返回指针。它分配非连续内存。 |\n\
  | `realloc()` | 通过增加或减少字节数来重新分配大小，并将起始地址返回指针。 |\n| `free()` | 释放之前分配的空间。 |\n\n###\
  \ 分配内存块 (malloc)\n\n可以使用函数 `malloc` 分配一块内存。`malloc` 函数预留一个指定大小的内存块并返回一个 `void` 类型的指针。这意味着我们可以将该内存块的基地址赋值给任何类型的指针。`malloc`\
  \ 的通用语法为：\n\n```c\nP= (cast type*) malloc(byte size);\n```\n\n现在让我们来看一个例子：\n\n```c\n\
  P=(int*)malloc (10 * sizeof(int));\n```\n\n这里，函数 `malloc` 返回一个整数类型的指针 `P`，分配了 `10\
  \ * sizeof(int)` 字节的内存。\n\n\n\n\n\n```c\n#include<stdio.h>\n#include<conio.h>\n\
  #include<string.h>\nmain()\n{\n    char str[20], news[20];\n    char *s, *t;\n \
  \   int pos, n, i;\n    printf(\"Enter the string:\");\n    scanf(\"%s\",str);\n\
  \    printf(\"Enter the position and number of characters to extract:\");\n    scanf(\"\
  %d%d\",&pos,&n);\n    s=str;\n    t=news;\n    if(n= =0)\n        n=strlen(str);\n\
  \    s=s+pos-1;\n    for(i=0;i<n;i++)\n    {\n        *t=*s;\n        s++;\n   \
  \     t++;\n    }\n    *t='\\0';\n    printf(\"The substring is: %s\\n\",news);\n\
  \    getch();\n}\n```\n\n## 2. 编写一个程序对 4x4 矩阵的所有元素进行排序\n\n```c\nint mat[4][4], *arr,\
  \ i, j, t;\nprintf(\"Enter the elements of 4x4:\");\n/*matrix input*/\nfor(i=0;\
  \ i<4; i++)\n{\n    for(j=0; j<4; j++)\n    {\n        printf(\"Enter element %d\
  \ %d\",i+1,j+1);\n        scanf(\"%d\",&mat[i][j]);\n    }\n}\n/*sort the elements\
  \ of the matrix*/\narr = mat; /*Base address of the matrix array*/\n/*使用指针打印输入的输入的矩阵*/\n\
  printf(\"\\nThe matrix formed is…\\n\");for(i=0; i<15; i++)/*number of passes*/\n\
  {\n    for(j=i+1; j<16; j++)\n    {\n        if(*(arr +i)>*(arr+j))\n        {\n\
  \            t = *(arr+i);\n            *(arr+i)= *(arr+j);\n            *(arr+j)=t;\n\
  \        }\n    }\n}\n/*print the sorted matrix*/\nprintf(\"\\n The matrix is:\\\
  n\");\nfor(i=0; i<4; i++)\n{\n    for(j=0; j<4; j++)\n    {\n        printf(\"%d\"\
  ,mat[i][j]);\n    }\n    printf(\"\\n\");\n}\nprintf(\"\\n\\Press any key to exit…\"\
  ); getch();\n```\n\n## 3. 编写一个程序输入任意字符串并删除其中存在的额外空格\n\n```c\n#include<stdio.h>\n\
  #include<conio.h>\n#include<string.h>\nmain()\n{\n    static char s1[50];\n    char\
  \ s2[50];\n    char *s, *t;\n    int i, l;\n    printf(\"Enter a string\");\n  \
  \  gets(s1);\n    s=s1;\n    t=s2;\n    l=strlen(s);\n    for(i=0;i<=l-1;i++)\n\
  \    {\n        if(*s= = ‘ ’/*check for a blank*/\n        {\n            if(*(s+1)!='\
  \ ')\n            {\n                *t=*s;\n                t++;\n            }\n\
  \            s++;\n        }\n        else\n        {\n            *t=*s;\n    \
  \        t++;\n            s++;\n        }\n    }\n    *t='\\0';\n    printf(\"\
  Original Statement:%s\\n\",s1);\n    printf(\"Modified Statement:%s\",s2);\n   \
  \ getch();\n}\n```\n\n## 4. 编写一个程序使用指针连接两个字符串。不要使用 strcat 函数。\n\n```c\nmain()\n\
  {\n    char s1[20],s2[20],*p1,*p2;\n    /* Input 1st string*/\n    printf(\"Enter\
