  \n1. 数组 `num[26]` 有二十六个元素。\n2. 表达式 `num[1]` 指定数组中的第一个元素。\n3. 在声明时必须初始化数组。\n4. 表达式\
  \ `num[7]` 指定数组中的第八个元素。\n5. 浮点变量的地址始终是一个整数。\n\n答案：\n1. 错误\n2. 错误\n3. 错误\n4. 正确\n\
  5. 正确\n\n### 1. 如果 `a[i]=i++` 是未定义行为，那么根据相同的原因 `i=i+1` 也应该是未定义行为。但它不是。为什么？\n\n答案：如果一个对象要在表达式内部被修改，那么同一个表达式内对它的所有访问必须是为了计算要存储的值。表达式\
  \ `a[i]=i++` 是不允许的，因为对 `i` 的访问之一（`a[i]` 中的那个）与最终存储在 `i` 中的值无关。在这种情况下，编译器不知道访问应该发生在存储增加后的值之前还是之后。表达式\
  \ `i=i+1` 是允许的，因为访问 `i` 是为了确定 `i` 的最终值。\n\n### 2. 在所有范围内提到数组名都会给出基地址吗？\n\n答案：不是，可以说数组名包含了它的基地址。但数组在两种情况下不会给出其基地址：\n\
  1. 当数组名与 `sizeof` 操作符一起使用时。\n2. 当数组名是 `&` 操作符的操作数时。\n\n### 3. 对于一个 10 个整数数组，表达式\
  \ `a` 和 `&a` 是否？\n\n答案：不是，尽管这两个表达式在上面的问题中给出相同的结果，但它们的含义完全不同。`a` 给出第一个 int 的地址，而\
  \ `&a` 给出 int 数组的地址。由于它们恰好相同，所以表达式的结果是相同的。\n\n### 实验练习 – 编写程序 (WAP)\n\n1. 编写程序使用冒泡排序法对一维数组进行排序。\n\
