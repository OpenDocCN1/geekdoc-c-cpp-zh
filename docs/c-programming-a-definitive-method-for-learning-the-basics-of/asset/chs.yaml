  1:\\tAdd\\n2:\\tSubtract\\n3:\\tMultiply\\n4:\\tDivide\\n5:\\tModulus\\nEnter your\
  \ choice: \"); \nscanf(\"%d\",&ch); \nswitch(ch)\n{\n    case 1:\n        printf(\"\
  %d\\n\",a+b);\n        break;\n    case 2:\n        printf(\"%d\\n\",a-b);\n   \
