  /*输入*/\nfor(i=0;i<n;i++)\n{\n    printf(\"Enter the number %d\",i);\n    scanf(\"\
  %f\",&a[i]);\n}\nfor(i=n-1;i>=0;i--)\n    printf(\"%.2f, \",a[i]);\n```\n\n### 5.\
  \ 给了一些重复的数字，写一个程序按递增顺序打印它们及其它们的频率。\n\n```c\n#define SIZE 100\nmain()\n{\n    int\
  \ a[SIZE],b[SIZE],freq[SIZE],i,j,k,n,found,t;\n    printf(\"Enter how many numbers\"\
  );\n    scanf(\"%d\",&n); /*输入数组*/\n    for(i=0;i<n;i++)\n    {\n        printf(\"\
  enter element %d \",i+1);\n        scanf(\"%d\",&a[i]);\n    }\n    for(i=0,k=0;i<n;i++)\n\
  \    {\n        found = 0;\n        for(j=0;j<k;j++)\n        {\n            if(a[i]\
  \ == b[j])\n            {\n                freq[j]++;\n                found = 1;\n\
  \                break;\n            }\n        }\n        if(found == 0)\n    \
  \    {\n            b[k] = a[i];\n            freq[k++] = 1;\n        }\n    }\n\
  \    for(i=0;i<k-1;i++)\n        for(j=i+1;j<k;j++)\n            if(freq[i] < freq[j])\n\
  \            {\n                t = b[i];\n                b[i] = b[j];\n      \
  \          b[j] = t;\n                t = freq[i];\n                freq[i] = freq[j];\n\
  \                freq[j] = t;\n            }\n    for(i=0;i<k;i++)\n        printf(\"\
  %d\\t%d\\n\",b[i],freq[i]);\n}\n```\n\n### 6. 写一个程序将数组 a 和 b 合并到第三个数组 c 中。\n\n```c\n\
  #define SIZE 20\nmain()\n{\n    int n1,n2,i,j,k,a[SIZE],b[SIZE],c[SIZE];\n    /*在第一个数组输入*/\n\
  \    printf(\"Enter no. of elements in the first array: \");\n    scanf(\"%d\",&n1);\n\
  \    for(i=0;i<n1;i++)\n    {\n        printf(\"Enter the element %d: \",i+1);\n\
  \        scanf(\"%d\",&a[i]);\n    }\n    /*在第二个数组输入*/\n    printf(\"\\nEnter no.\
  \ of elements in the second array: \");\n    scanf(\"%d\",&n2);\n    for(i=0;i<n2;i++)\n\
  \    {\n        printf(\"Enter the element %d: \",i+1);\n        scanf(\"%d\",&b[i]);\n\
  \    }\n    /*合并*/\n    for(i=0,j=0,k=0;i<n1&&j<n2;k++)\n    {\n        if(a[i]\
  \ < b[j])\n            c[k]=a[i++];\n        else\n            c[k]=b[j++];\n  \
  \  }\n    /*第一个列表剩余部分*/\n    while(i<n1)\n        c[k++]=a[i++];\n    /*第二个列表剩余部分*/\n\
  \    while(j<n2)\n        c[k++]=b[j++];\n    /*输出*/\n    for(i=0;i<(n1+n2);i++)\n\
  \        printf(\"%d\\n\",c[i]);\n}\n```\n\n### 7. 写一个程序从给定的数字列表中找到第 k 小的数：\n\n\
