  %d\",i);` 输出：`1,2,3,4,5`\n16. `int i=1; while( )` 输出：空屏\n\n### 常见错误\n1. `while`\
  \ 语句不包含 `do`。\n2. `break` 和 `continue` 语句仅影响内层循环。例如：\n```c\nfor(.) /* 循环 1*/\n{\n\
  \    for(...) /* 循环 2*/\n    {\n        .....\n        break;\n        .....\n \
  \   }\n}\n```\n`break` 会导致退出循环 2 而不是循环 1 (image0133.jpeg)。\n\n## 以下程序的输出是什么？\n\n\
  1.\n```c\nint i =1; while( i<= 10);\n{\n    printf(\" \\n%d\",i);\n    i++;\n}\n\
  ```\n输出：无限循环。在上面的程序中 `while` 后面出现了 `;`，理解为 `while(10)`，体内没有递增，所以条件保持为真。\n\n```c\n\
  int a =4, b, c; while(a>=0)\n{\n    a--;\n    b++;\n    if( a ==b)\n        continue;\n\
  \    else\n        printf( \\n %d %d\",a,b);\n}\n```\n输出：\n3 1\n0 4\n1 5 (image0134.jpeg,\
  \ image0135.jpeg, image0136.jpeg) 在上面的程序中首先 `a = 4,b = 0`，当检查条件时变为真并执行循环体，`a` 减少\
  \ 1 `b` 增加 1，所以 `a = 3 b = 1`，现在再次检查条件导致无限循环，且由于空语句没有输出。\n\n```c\nchar ch;\nwhile(ch\
  \ =0; ch<=255;ch++)\n    printf(\"\\n %d-%c\",ch,ch);\n```\n输出：错误。在上面的程序中 `while`\
  \ 循环被用于 `for` 的位置，由于语法不同导致错误。\n\n```c\nint a =4;while( a ==1)\n{\n    a = a-1;\n\
  \    printf(\"%d\",a);\n    --a;\n}\n```\n输出：无输出，因为第一次条件就为假，控制立即离开循环体，不执行任何操作。\n\
  \n```c\nint a =4,b,c;b = --a; c = a--; printf(\"\\n%d %d %d\",a,b,c);\n```\n输出：2\
  \ 3 3 (image0137.jpeg) 在上面的程序中 `a = 4`，现在我们理解了前增和后增后减。\n\n\n\n\n`a == b` 为假，控制流跳转到\
  \ `else` 块并打印 `a` 和 `b` 的值分别为 3 和 1。现在当控制流再次到达循环末尾时，它跳转到条件判断，此时条件仍然为真，再次执行循环体，结果为\
  \ `a = 2` 和 `b = 2`。当检查条件 `a == b` 时，它变为真，使用 `continue` 语句继续循环，控制流跳转到循环条件，该条件为真是因为\
  \ `a = 2` 大于 0。再次执行循环体，执行 `a = 1`、`b = 3` 并打印，因为 `if` 中的条件为假，控制流从循环末尾跳转到为真的条件，此时\
  \ `a = 0` 和 `b = 4`，两者不相等，因此被打印。重复检查条件时，它为真并执行 `a = -1` 和 `b = 5`，两者不相等并通过 `else`\
  \ 块打印，此时再次检查条件时变为假，因为 `a = -1` 不大于或等于 0，并跳出循环。\n\n### 11\n```c\nint a = 4, b = 0,c;\
