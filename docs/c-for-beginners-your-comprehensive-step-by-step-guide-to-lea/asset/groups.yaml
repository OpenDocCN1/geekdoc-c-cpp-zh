    \nIn C++, a binary operator is an operator that takes two operands. Some common\
    \ examples of binary operators include +, -, *, /, and % .\n\nHere is an example\
    \ of using binary operators in C++:\n\n```\nint a = 3;\nint b = 4;\nint c = a\
    \ + b;  // c is now 7\nint d = a - b;  // d is now -1\nint e = a * b;  // e is\
    \ now 12\nint f = b / a;  // f is now 1\nint g = b % a;  // g is now 1\n```\n\n\
    In C++, you can also overload binary operators for user-defined types. This allows\
    \ you to define custom behavior for the operators when they are used with your\
    \ own types.\n\nHere is an example of overloading the + operator as a member function:\n\
    \n```\nclass Vector2\n{\npublic:\n    Vector2(float x, float y) : x_(x), y_(y)\
    \ {}\n\n    Vector2 operator+(const Vector2& other) const\n    {\n        return\
    \ Vector2(x_ + other.x_, y_ + other.y_);\n    }\n\nprivate:\n    float x_;\n \
    \   float y_;\n};\n```\n\nIn this example, the Vector2 class has an overloaded\
    \ + operator that adds the x and y components of the two Vector2 objects.\n\n\
    To use this overloaded operator, you can use the normal operator syntax:\n\n```\n\
    Vector2 v1(1, 2);\nVector2 v2(3, 4);\nVector2 v3 = v1 + v2;  // v3 is now (4,\
    \ 6)\n```\n\nBinary operator overloading can be useful for making your code more\
    \ readable and intuitive. However, you should be careful when overloading binary\
    \ operators, as it can be confusing for users of your code if the operators behave\
    \ unexpectedly. It is generally a good idea to overload binary operators in a\
    \ way that is consistent with their standard behavior.\n\n## Assignment\n\nIn\
    \ C++, the assignment operator ( = ) is used to assign a value to a variable.\n\
    \nHere is an example of using the assignment operator in C++:\n\n```\nint a =\
    \ 3;  // Initialize a to 3\na = 4;  // Assign a new value to a\n```\n\nIn the\
    \ first line, the = operator is used to initialize the variable a to the value\
    \ 3. In the second line, the = operator is used to assign a new value to a, overwriting\
    \ the previous value.\n\nYou can also use the assignment operator to chain assignments,\
    \ like this:\n\n```\nint a, b, c;\na = b = c = 0;  // Assign 0 to a, b, and c\n\
    ```\n\nIn this example, the assignment operator is used to assign the value 0\
    \ to all three variables in a single line of code.\n\nYou can also use the assignment\
    \ operator to assign the value of an expression to a variable, like this:\n\n\
    ```\nint a = 3;\nint b = 4;\nint c = a + b;  // c is now 7\n```\n\nIn this example,\
    \ the = operator is used to assign the result of the expression a + b (which is\
    \ 7) to the variable c.\n\nThe assignment operator is an important part of C++\
    \ and is used extensively in most programs. It allows you to assign values to\
    \ variables and modify their values as needed.\n\n## Function call\n\nIn C++,\
    \ a function call is an expression that invokes a function and optionally passes\
    \ arguments to the function. The syntax for a function call is the name of the\
    \ function followed by a list of arguments in parentheses.\n\nHere is an example\
    \ of a function call in C++:\n\n```\nint add(int x, int y)\n{\n    return x +\
    \ y;\n}\n\nint a = 3;\nint b = 4;\nint c = add(a, b);  // c is now 7\n```\n\n\
    In this example, the function add takes two integer arguments, x and y, and returns\
    \ their sum as an integer. The function is called by using its name followed by\
    \ the arguments in parentheses. The return value of the function is assigned to\
    \ the variable c.\n\nYou can also use function calls as part of expressions, like\
    \ this:\n\n```\nint a = 3;\nint b = 4;\nint c = add(a, b) * 2;  // c is now 14\n\
    ```\n\nIn this example, the function call add(a, b) is used as part of an expression\
    \ that multiplies the return value by 2. The result of the expression is then\
    \ assigned to the variable c.\n\nFunction calls are an important part of C++ and\
    \ are used extensively in most programs. They allow you to reuse code and divide\
    \ a large program into smaller, more manageable pieces.\n\n## Subscripting\n\n\
    In C++, subscripting (also known as indexing) is a way to access individual elements\
    \ of an array or container using the [] operator.\n\nHere is an example of using\
    \ subscripting to access elements of an array in C++:\n\n```\nint arr[5] = {1,\
    \ 2, 3, 4, 5};\n\nint a = arr[0];  // a is now 1\nint b = arr[2];  // b is now\
    \ 3\nint c = arr[4];  // c is now 5\n```\n\nIn this example, the [] operator is\
    \ used to access the elements of the arr array. The first element of the array\
    \ has an index of 0, the second element has an index of 1, and so on.\n\nYou can\
    \ also use subscripting to modify the elements of an array:\n\n```\nint arr[5]\
    \ = {1, 2, 3, 4, 5};\n\narr[0] = 10;  // arr is now {10, 2, 3, 4, 5}\narr[2] =\
    \ 20;  // arr is now {10, 2, 20, 4, 5}\narr[4] = 30;  // arr is now {10, 2, 20,\
    \ 4, 30}\n```\n\nSubscripting is a powerful and convenient way to access and modify\
    \ the elements of an array or container in C++. It is used extensively in many\
    \ programs to manipulate data stored in arrays and containers.\n\n## Member access\n\
    \nIn C++, member access is a way to access the data members and member functions\
    \ of a class or structure using the . or -> operator.\n\nHere is an example of\
    \ using member access to access data members of a class in C++:\n\n```\nclass\
    \ Point\n{\npublic:\n    Point(int x, int y) : x_(x), y_(y) {}\n\n    int getX()\
    \ const { return x_; }\n    int getY() const { return y_; }\n\nprivate:\n    int\
    \ x_;\n    int y_;\n};\n\nPoint p(1, 2);\n\nint a = p.x_;  // a is now 1\nint\
    \ b = p.y_;  // b is now 2\n```\n\nIn this example, the Point class has two data\
    \ members, x_ and y_, and two member functions, getX and getY, that return the\
    \ values of these data members. The data members are accessed using the . operator,\
    \ and the member functions are called using the . operator and parentheses.\n\n\
    You can also use member access to call member functions of a class:\n\n```\nPoint\
    \ p(1, 2);\n\nint a = p.getX();  // a is now 1\nint b = p.getY();  // b\n```\n\
    \n## Classes and structs\n\nIn C++, classes and structs are user-defined types\
    \ that allow you to define your own custom data types.\n\nA class is a user-defined\
    \ type that can contain data members (variables) and member functions (functions\
    \ that are part of the class). Classes are defined using the class keyword, like\
    \ this:\n\n```\nclass Point\n{\npublic:\n    Point(int x, int y) : x_(x), y_(y)\
    \ {}\n\n    int getX() const { return x_; }\n    int getY() const { return y_;\
    \ }\n\nprivate:\n    int x_;\n    int y_;\n};\n```\n\nIn this example, the Point\
    \ class has two data members, x_ and y_, and two member functions, getX and getY,\
    \ that return the values of these data members.\n\nA struct is similar to a class,\
    \ but it has all members public by default. Structs are defined using the struct\
    \ keyword, like this:\n\n```\nstruct Point\n{\n    int x;\n    int y;\n};\n```\n\
    \nIn this example, the Point struct has two data members, x and y, which are both\
    \ public.\n\nYou can create an instance of a class or struct using the new operator\
    \ or by declaring a variable of the class or struct type, like this:\n\n```\n\
    Point p1(1, 2); // Create an instance of Point using constructor\n\nPoint *p2\
    \ = new Point(3, 4); // Create an instance of Point using new\n\nPoint p3; //\
    \ Create an instance of Point with default constructor\n```\n\nClasses and structs\
    \ are an important part of C++ and are used extensively in many programs to define\
    \ custom data types and encapsulate data and functionality.\n\n## what is class\n\
    \nIn C++, a class is a user-defined type that can contain data members (variables)\
    \ and member functions (functions that are part of the class). Classes are defined\
    \ using the class keyword, like this:\n\n```\nclass Point\n{\npublic:\n    Point(int\
    \ x, int y) : x_(x), y_(y) {}\n\n    int getX() const { return x_; }\n    int\
    \ getY() const { return y_; }\n\nprivate:\n    int x_;\n    int y_;\n};\n```\n\
    \nIn this example, the Point class has two data members, x_ and y_, and two member\
    \ functions, getX and getY, that return the values of these data members.\n\n\
    You can create an instance of a class using the new operator or by declaring a\
    \ variable of the class type, like this:\n\n```\nPoint p1(1, 2); // Create an\
    \ instance of Point using constructor\n```\n\n```\nPoint *p2 = new Point(3, 4);\
    \ // Create an instance of Point using new\n```\n\n```\nPoint p3; // Create an\
    \ instance of Point with default constructor\n```\n\nClasses are an important\
    \ part of C++ and are used extensively in many programs to define custom data\
    \ types and encapsulate data and functionality.\n\n## what struct\n\nIn C++, a\
    \ struct is a user-defined type that is similar to a class, but all members are\
    \ public by default. Structs are defined using the struct keyword, like this:\n\
    \n```\nstruct Point\n{\n    int x;\n    int y;\n};\n```\n\nIn this example, the\
    \ Point struct has two data members, x and y, which are both public.\n\nYou can\
    \ create an instance of a struct by declaring a variable of the struct type, like\
    \ this:\n\n```\nPoint p1 = {1, 2};  // Create an instance of Point using initializer\
    \ list\n```\n\n```\nPoint p2;  // Create an instance of Point with default values\n\
    ```\n"
  mdcn: "\n\n递增和递减运算符重载对于使你的代码更具可读性和直观性是有用的。然而，在重载这些运算符时应格外小心，因为如果运算符行为异常，会让使用你代码的用户感到困惑。一般来说，以与标准行为一致的方式重载这些运算符是一个好主意。\n\
    \n## 二元运算符\n\n在 C++ 中，二元运算符是接受两个操作数的运算符。一些常见的二元运算符示例包括 +、-、*、/ 和 % 。\n\n以下是 C++\
    \ 中使用二元运算符的示例：\n\n```\nint a = 3;\nint b = 4;\nint c = a + b;  // c is now 7\n\
    int d = a - b;  // d is now -1\nint e = a * b;  // e is now 12\nint f = b / a;\
    \  // f is now 1\nint g = b % a;  // g is now 1\n```\n\n在 C++ 中，你也可以为用户定义的类型重载二元运算符。这允许你在将它们与自己的类型一起使用时为运算符定义自定义行为。\n\
    \n以下是将 + 运算符作为成员函数重载的示例：\n\n```\nclass Vector2\n{\npublic:\n    Vector2(float\
    \ x, float y) : x_(x), y_(y) {}\n\n    Vector2 operator+(const Vector2& other)\
    \ const\n    {\n        return Vector2(x_ + other.x_, y_ + other.y_);\n    }\n\
    \nprivate:\n    float x_;\n    float y_;\n};\n```\n\n在这个示例中，Vector2 类有一个重载的 +\
    \ 运算符，它将两个 Vector2 对象的 x 和 y 分量相加。\n\n要使用此重载运算符，可以使用正常的运算符语法：\n\n```\nVector2\
    \ v1(1, 2);\nVector2 v2(3, 4);\nVector2 v3 = v1 + v2;  // v3 is now (4, 6)\n```\n\
    \n二元运算符重载对于使你的代码更具可读性和直观性是有用的。然而，在重载二元运算符时应格外小心，因为如果运算符行为异常，会让使用你代码的用户感到困惑。一般来说，以与标准行为一致的方式重载二元运算符是一个好主意。\n\
    \n## 赋值\n\n在 C++ 中，赋值运算符（ = ）用于将值赋给变量。\n\n以下是 C++ 中使用赋值运算符的示例：\n\n```\nint a =\
    \ 3;  // Initialize a to 3\na = 4;  // Assign a new value to a\n```\n\n在第一行，=\
    \ 运算符用于将变量 a 初始化为值 3。在第二行，= 运算符用于为 a 分配一个新值，覆盖之前的值。\n\n你也可以使用赋值运算符来链式赋值，像这样：\n\
    \n```\nint a, b, c;\na = b = c = 0;  // Assign 0 to a, b, and c\n```\n\n在这个示例中，赋值运算符用于在一行代码中将值\
    \ 0 分配给全部三个变量。\n\n你也可以使用赋值运算符将表达式的值赋给变量，像这样：\n\n```\nint a = 3;\nint b = 4;\n\
    int c = a + b;  // c is now 7\n```\n\n在这个示例中，= 运算符用于将表达式 a + b 的结果（即 7）赋给变量 c。\n\
    \n赋值运算符是 C++ 的重要组成部分，在大多数程序中被广泛使用。它允许你为变量赋值并根据需要修改它们的值。\n\n## 函数调用\n\n在 C++ 中，函数调用是一个表达式，它调用一个函数并可选地向函数传递参数。函数调用的语法是函数名后跟括号中的参数列表。\n\
    \n以下是 C++ 中函数调用的示例：\n\n```\nint add(int x, int y)\n{\n    return x + y;\n}\n\n\
    int a = 3;\nint b = 4;\nint c = add(a, b);  // c is now 7\n```\n\n在这个示例中，函数 add\
    \ 接受两个整数参数 x 和 y，并返回它们的和作为整数。函数通过使用其名称后跟括号中的参数来调用。函数的返回值被赋给变量 c。\n\n你也可以将函数调用作为表达式的一部分使用，像这样：\n\
    \n```\nint a = 3;\nint b = 4;\nint c = add(a, b) * 2;  // c is now 14\n```\n\n\
    在这个示例中，函数调用 add(a, b) 被用作乘以返回值的表达式的一部分。表达式的结果随后被赋给变量 c。\n\n函数调用是 C++ 的重要组成部分，在大多数程序中被广泛使用。它们允许你重用代码并将大型程序划分为更小、更易管理的部分。\n\
    \n## 下标\n\n在 C++ 中，下标（也称为索引）是一种使用 [] 运算符访问数组或容器中单个元素的方式。\n\n以下是使用下标访问 C++ 中数组元素的示例：\n\
    \n```\nint arr[5] = {1, 2, 3, 4, 5};\n\nint a = arr[0];  // a is now 1\nint b\
    \ = arr[2];  // b is now 3\nint c = arr[4];  // c is now 5\n```\n\n在这个示例中，[] 运算符用于访问\
    \ arr 数组的元素。数组的第一个元素的索引为 0，第二个元素的索引为 1，以此类推。\n\n你也可以使用下标来修改数组的元素：\n\n```\nint\
    \ arr[5] = {1, 2, 3, 4, 5};\n\narr[0] = 10;  // arr is now {10, 2, 3, 4, 5}\n\
    arr[2] = 20;  // arr is now {10, 2, 20, 4, 5}\narr[4] = 30;  // arr is now {10,\
    \ 2, 20, 4, 30}\n```\n\n下标是访问和修改 C++ 中数组或容器元素的强大且方便的方式。它在许多程序中被广泛用于操作存储在数组和容器中的数据。\n\
    \n## 成员访问\n\n在 C++ 中，成员访问是一种使用 . 或 -> 运算符访问类或结构的数据成员和成员函数的方式。\n\n以下是使用成员访问访问 C++\
    \ 中类的数据成员的示例：\n\n```\nclass Point\n{\npublic:\n    Point(int x, int y) : x_(x),\
    \ y_(y) {}\n\n    int getX() const { return x_; }\n    int getY() const { return\
    \ y_; }\n\nprivate:\n    int x_;\n    int y_;\n};\n\nPoint p(1, 2);\n\nint a =\
    \ p.x_;  // a is now 1\nint b = p.y_;  // b is now 2\n```\n\n在这个示例中，Point 类有两个数据成员\
    \ x_ 和 y_，以及两个成员函数 getX 和 getY，它们返回这些数据成员的值。数据成员使用 . 运算符访问，成员函数使用 . 运算符和括号调用。\n\
    \n你也可以使用成员访问来调用类的成员函数：\n\n```\nPoint p(1, 2);\n\nint a = p.getX();  // a is now\
    \ 1\nint b = p.getY();  // b\n```\n\n## 类和结构体\n\n在 C++ 中，类和结构体是用户定义的类型，允许你定义自己的自定义数据类型。\n\
    \n类是用户定义的类型，可以包含数据成员（变量）和成员函数（属于类的函数）。类使用 class 关键字定义，像这样：\n\n```\nclass Point\n\
    {\npublic:\n    Point(int x, int y) : x_(x), y_(y) {}\n\n    int getX() const\
    \ { return x_; }\n    int getY() const { return y_; }\n\nprivate:\n    int x_;\n\
    \    int y_;\n};\n```\n\n在这个示例中，Point 类有两个数据成员 x_ 和 y_，以及两个成员函数 getX 和 getY，它们返回这些数据成员的值。\n\
    \n结构体类似于类，但默认情况下所有成员都是公开的。结构体使用 struct 关键字定义，像这样：\n\n```\nstruct Point\n{\n  \
    \  int x;\n    int y;\n};\n```\n\n在这个示例中，Point 结构体有两个数据成员 x 和 y，它们都是公开的。\n\n你可以使用\
    \ new 运算符或通过声明类或结构体类型的变量来创建类或结构体的实例，像这样：\n\n```\nPoint p1(1, 2); // Create an\
    \ instance of Point using constructor\n\nPoint *p2 = new Point(3, 4); // Create\
    \ an instance of Point using new\n\nPoint p3; // Create an instance of Point with\
    \ default constructor\n```\n\n类和结构体是 C++ 的重要组成部分，在许多程序中被广泛用于定义自定义数据类型并封装数据和功能。\n\
    \n## what is class\n\n在 C++ 中，类是用户定义的类型，可以包含数据成员（变量）和成员函数（属于类的函数）。类使用 class 关键字定义，像这样：\n\
