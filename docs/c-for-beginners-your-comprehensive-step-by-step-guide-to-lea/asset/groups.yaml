    # Chapter one


    # basic concepts


    # C++ type system


    In C++, data is stored and manipulated using various data types. These data types
    determine the size and layout of memory used by the variables, as well as the
    set of operations that can be performed on them.


    C++ has a rich type system that includes both built-in types and user-defined
    types.


    Built-in types include:


    +   - Integer types: These represent whole numbers and include `char`, `short`,
    `int`, `long`, and `long long`. Each of these types has a different size, with
    `char` being the smallest and `long long` being the largest.

    - Floating-point types: These represent numbers with fractional parts and include
    `float`, `double`, and `long double`. These types also have different sizes, with
    `float` being the smallest and `long double` being the largest.

    - Boolean type: This represents a true/false value and is represented by the `bool`
    type.

    - Character types: These represent individual characters and include `char` and
    `wchar_t`. `char` is used for ASCII characters and `wchar_t` is used for wide
    characters, which can represent characters from a variety of different alphabets.


    User-defined types in C++ include:


    +   - Classes: A class is a user-defined data type that allows you to define your
    own data fields and methods.

    - Structures: A structure is similar to a class, but the data fields and methods
    are public by default.

    - Enumerations: An enumeration is a user-defined type that consists of a set of
    named constants.

    - Typedef: The `typedef` keyword allows you to define a new name for an existing
    data type. This can be used to create more readable or expressive names for complex
    types.


    C++ also supports type casting, which allows you to convert a value from one data
    type to another. This can be useful when working with different data types that
    need to be used together, but care must be taken when using type'
  - '[PAGE 5]


    casting, as it can lead to loss of precision or other unexpected behavior if not
    used correctly.


    # Scope


    In C++, the scope of a variable refers to the part of the program in which the
    variable is visible or can be accessed. A variable''s scope is determined by the
    location of its declaration in the program.


    There are two main types of scope in C++: local scope and global scope.


    A local variable is one that is declared within a function or block of code. Local
    variables are only visible within the function or block in which they are declared,
    and they are only accessible from the point of their declaration to the end of
    the block. When the function or block ends, the local variable is destroyed and
    is no longer accessible.


    A global variable is one that is declared outside of any function or block of
    code. Global variables are visible throughout the entire program and can be accessed
    from any function or block of code. However, it is generally considered good programming
    practice to minimize the use of global variables, as they can make the program
    more difficult to understand and maintain.


    C++ also supports nested scopes, where a block of code is defined within another
    block of code. In this case, variables declared in the inner block are only visible
    within that block, but they may also be accessed from the outer block.


    The scope of a variable is an important concept in C++, as it determines the visibility
    and accessibility of the variable within the program. Understanding the scope
    of variables is essential for writing efficient and maintainable code.


    # Header files


    In C++, a header file is a file that contains declarations of functions, variables,
    and other constructs that can be used in a C++ program. Header files are typically
    denoted by the .h suffix and are included in a C++ source file using the #include
    directive.'
  - '[PAGE 6]


    Header files are used for a variety of purposes in C++. They can be used to declare
    functions and variables that are defined in another source file, allowing them
    to be used in multiple files without duplication of code. They can also be used
    to declare functions and variables that are implemented in a library, allowing
    them to be used in a program without the need to link the library into the program.


    Header files can also be used to define macros, which are short pieces of code
    that are replaced by the preprocessor with their corresponding expanded form.
    Macros are often used to define constants and other values that need to be used
    in multiple places in a program.


    One of the main advantages of using header files is that they allow code to be
    organized and reused more easily. By separating declarations from definitions
    and placing them in a separate header file, it is possible to use the same code
    in multiple programs without having to copy and paste it. This makes it easier
    to maintain and update the code, as changes only need to be made in a single location.


    Some examples of standard C++ header files include <iostream>, which provides
    input and output streams for reading and writing data, and <string>, which provides
    functions and classes for working with strings. There are many other header files
    available in the C++ standard library, as well as in third-party libraries, that
    provide a wide range of functionality for various tasks.


    # Translation units and linkage


    In C++, a translation unit is a source file and all the header files that it includes,
    along with any header files included by those header files, and so on. The process
    of turning a translation unit into an executable program is called compilation.


    During compilation, the preprocessor processes the #include directives in the
    translation unit, inserting the contents of the included header files into the
    source file. The resulting expanded source file is then passed to the compiler,
    which translates it into object code.


    Object code is a machine-readable representation of the program that can be executed
    by the computer. However, object code is not in a form that can be directly executed
    by the operating system. Instead, it must be combined with'
