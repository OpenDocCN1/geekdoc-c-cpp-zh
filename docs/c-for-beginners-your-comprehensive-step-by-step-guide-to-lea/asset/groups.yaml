    \n## 委托构造函数\n\n在 C++ 中，委托构造函数是一种特性，允许类的一个构造函数在其初始化过程中调用同一类的另一个构造函数。这在你想要提供多种构造对象的方式，或在另一个构造函数中重用一个构造函数的初始化代码时很有用。\n\
    \n要使用委托构造函数，可以使用 : 语法，后跟要调用的构造函数的名称以及要传递给它的参数。被调用的构造函数在调用构造函数的函数体执行之前执行，并且可以初始化数据成员并根据需要执行其他任务。\n\
    \n下面是一个带有委托构造函数的类的示例：\n\n```\nclass Point\n{\npublic:\n    Point(int x, int y)\
