    # Member access control


    In C++, you can use the public, private, and protected keywords to specify the
    access control for the members of a class.


    The public keyword specifies that the members following it are accessible from
    outside the class. This means that you can access the member functions and data
    members of an instance of the class from outside the class using the . operator.


    The private keyword specifies that the members following it are only accessible
    from within the class. This means that you cannot access the data members directly
    from outside the class, but you can access them through member functions.


    The protected keyword specifies that the members following it are only accessible
    from within the class and its derived classes. This means that you cannot access
    the data members directly from outside the class, but you can access them through
    member functions in the class and its derived classes.


