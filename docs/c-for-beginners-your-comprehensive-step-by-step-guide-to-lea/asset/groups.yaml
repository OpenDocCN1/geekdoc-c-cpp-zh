    x is not positive\" 打印到控制台。\n\nswitch 语句是 C++ 中的另一种选择语句，用于根据变量的值执行代码块。switch 语句的语法如下：\n\
    \n```\nswitch (expression) {\n    case value1:\n    // code to be\n```\n\n## if-else\
