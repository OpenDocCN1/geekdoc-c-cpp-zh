    \ the type of an expression at runtime. It returns a `std::type_info` object that\
    \ describes the type of the expression.\n\nHere is an example of how the `typeid`\
    \ operator can be used:\n\n```\n#include <iostream>\n#include <typeinfo>\n\nint\
    \ main()\n{\n    int x = 10;\n    double y = 3.14;\n    std::string z = \"hello\"\
    ;\n\n    std::cout << \"typeid(x).name() = \" << typeid(x).name() << std::endl;\n\
    \    std::cout << \"typeid(y).name() = \" << typeid(y).name() << std::endl;\n\
