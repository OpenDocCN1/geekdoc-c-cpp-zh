    \ // primary expression: variable y\nstd::cout << z << std::endl; // primary expression:\
    \ variable z\nstd::cout << f(x, y) << std::endl; // primary expression: function\
    \ call f(x, y)\n```\n\n在此示例中，我们有三个变量：x 的类型为 int，y 的类型为 double，z 的类型为 std::string。我们在单独的\
    \ std::cout 语句中使用每个变量作为初级表达式。我们还使用函数调用 f(x, y) 作为初级表达式。\n\n需要注意的是，初级表达式不包括需要额外运算符求值的表达式，例如算术表达式或逻辑表达式。例如，x\
