    \nint main()\n{\n    Point p(1, 2);\n    std::cout << \"x = \" << p.getX() <<\
    \ \", y = \" << p.getY() << std::endl;\n    return 0;\n}\n```\n\n在此示例中，Point 类有一个析构函数，它没有参数或返回类型并且不执行任何任务。析构函数由编译器在\
    \ main 结束时 p 对象超出作用域时自动调用。\n\n析构函数是 C++ 的重要组成部分，并在许多程序中被广泛使用，以在对象被销毁时释放资源并执行其他任务。你可以在类中定义析构函数，以在对象被销毁之前执行清理对象所需的任何任务。\n\
    \n## 成员函数概述\n\n在 C++ 中，成员函数是在类内定义并操作类的数据成员的函数。它们是类接口的重要组成部分，用于提供类的行为和功能。\n\n成员函数具有以下几个区别于其他类型函数的特征：\n\
    \n- 1. 成员函数在类定义内部定义，并且可以访问类的私有数据成员。这使它们能够操作对象的内部状态并提供所需的行为和功能。\n- 2. 成员函数使用 .\
    \ 或 -> 运算符调用，具体取决于对象是引用还是指针。这使你能够在对象上调用成员函数并访问其数据成员。\n- 3. 成员函数可以声明为 const，这意味着它们不会修改对象的数据成员，并且可以在\
    \ const 对象上调用。这使你能够定义不修改对象状态并且可以在 const 上下文中调用的函数。\n\n下面是一个带有一些成员函数的类的示例：\n\n\
    ```\nclass Point\n{\npublic:\n    Point(int x, int y) : x_(x), y_(y) {}\n    ~Point()\
    \ {}\n\n    int getX() const { return x_; }\n    int getY() const { return y_;\
    \ }\n    void setX(int x) { x_ = x; }\n    void setY(int y) { y_ = y; }\n\nprivate:\n\
    \    int x_;\n    int y_;\n};\n\nint main()\n{\n    Point p(1, 2);\n    std::cout\
    \ << \"x = \" << p.getX() << \", y = \" << p.getY() << std::endl;\n    p.setX(3);\n\
    \    p.setY(4);\n    std::cout << \"x = \" << p.getX() << \", y = \" << p.getY()\
    \ << std::endl;\n    return 0;\n}\n```\n\n## virtual 说明符\n\n在 C++ 中，virtual 说明符用于在类中声明虚成员函数。虚成员函数是可以被派生类重写的成员函数，从而允许它们提供自己的函数实现。\n\
    \nvirtual 说明符用于在基类中成员函数的声明中，并且在派生类中函数被标记为 override 以指示它正在重写基类实现。\n\n下面是一个带有虚成员函数的类的示例：\n\
    \n```\nclass Shape\n{\npublic:\n    virtual void draw() = 0;\n};\n\nclass Circle\
    \ : public Shape\n{\npublic:\n    void draw() override { std::cout << \"Drawing\
    \ a circle\" << std::endl; }\n};\n\nclass Square : public Shape\n{\npublic:\n\
    \    void draw() override { std::cout << \"Drawing a square\" << std::endl; }\n\
    };\n\nint main()\n{\n    Shape *s1 = new Circle();\n    s1->draw();\n\n    Shape\
    \ *s2 = new Square();\n    s2->draw();\n\n    delete s1;\n    delete s2;\n   \
    \ return 0;\n}\n```\n\n在此示例中，Shape 类有一个纯虚成员函数 draw，它使用 virtual 说明符声明并且没有实现。Circle\
    \ 和 Square 类派生自 Shape 并通过将其标记为 override 来提供自己的 draw 函数实现。\n虚成员函数是 C++ 的重要组成部分，并在许多程序中被广泛使用以支持多态性和运行时多态性。它们允许你为一组相关类定义通用接口，并为每个类提供不同的实现，具体取决于其特定的行为和功能。\n\
    \n## override 说明符\n\n"
