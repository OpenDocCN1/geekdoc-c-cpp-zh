    class MyClass\n{\npublic:\n    MyClass(bool b) : b_(b) {}\n\n    bool getValue()\
    \ const { return b_; }\n\nprivate:\n    bool b_;\n};\n\nMyClass operator!(const\
    \ MyClass& obj)\n{\n    return MyClass(!obj.getValue());\n}\n```\n\nIn this example,\
    \ the MyClass class has a member function called getValue that returns the value\
