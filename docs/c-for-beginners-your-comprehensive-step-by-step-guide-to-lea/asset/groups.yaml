    \ x_;\n    float y_;\n};\n```\n\nIn this example, the Vector2 class has an overloaded\
    \ - operator that negates the x and y components of the Vector2 object.\n\nTo\
    \ use this overloaded operator, you can use the normal operator syntax:\n\n```\n\
