    \ << \"x = \" << x << std::endl;\n    std::cout << \"y = \" << y << std::endl;\n\
    \n    std::cout << \"x++ = \" << x++ << std::endl;\n    std::cout << \"y-- = \"\
    \ << y-- << std::endl;\n\n    std::cout << \"x = \" << x << std::endl;\n    std::cout\
    \ << \"y = \" << y << std::endl;\n\n    return 0;\n}\n```\n\n该程序的输出将为：\n\nx =\
    \ 10\ny = 10\nx++ = 10\ny-- = 10\nx = 11\ny = 9\n\n在此示例中，我们有两个变量 x 和 y，均初始化为 10。我们使用后缀增量运算符\
    \ x++ 将 x 的值增加 1，并使用后缀减量运算符 y-- 将 y 的值减少 1。\n\n后缀增量和减量运算符返回操作数在被增量或减量之前的值。这就是为什么\
    \ x++ 和 y-- 的输出为 10，即使 x 和 y 的值分别被增量和减量。\n\n需要注意的是，后缀增量和减量运算符的优先级低于大多数其他运算符，因此它们通常与其他运算符组合使用。例如：\n\
    \n```\nint a = 10;\nint b = 20;\nint c = a++ + b;  // c = 30, a = 11\nint d =\
    \ a-- - b;  // d = -1, a = 10\n```\n\n在此示例中，c 的值计算为 10 + 20 = 30，并在计算完成后将 a 的值递增到\
