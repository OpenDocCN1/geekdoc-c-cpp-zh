    when an object of the class is created by moving the contents of another object.
    A move assignment operator is a special member function that is called when an
    object is assigned to another object by moving the contents of the original object.


    Move constructors and move assignment operators are used to perform a move of
    an object, which means that they transfer the contents of the original object
    to the new object without making a copy. This is more efficient than making a
    copy because it avoids the overhead of copying the data members of the object.


