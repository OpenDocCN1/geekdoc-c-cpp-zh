    \n使用 reinterpret_cast 的语法如下：\n\n```\ndestination_type value = reinterpret_cast<destination_type>(expression);\n\
    ```\n\n其中 destination_type 是 expression 的值将被转换成的类型，而 expression 是要转换的值。\n\n以下是使用\
