    \ called on the Circle object. If the Shape object is not a Circle, the dynamic_cast\
    \ operator will return a null pointer and the Draw method will not be called.\n\
    \n### bad_cast exception\n\nThe bad_cast exception is a type of exception that\
    \ is thrown by the dynamic_cast operator in C++ when it fails to perform a downcast\
    \ conversion from a base class to a derived class.\n\nThe bad_cast exception is\
    \ defined in the stdexcept header and is derived from the exception class. It\
    \ can be caught using a try - catch block, like any other exception:\n\n```\n\
    #include <iostream>\n#include <stdexcept>\n\nint main() {\n    try {\n       \
    \ Shape *shape = new Shape;\n        Circle *circle = dynamic_cast<Circle*>(shape);\n\
    \    } catch (std::bad_cast& e) {\n        std::cout << \"Error: \" << e.what()\
    \ << std::endl;\n    }\n    return 0;\n}\n```\n\nIn this example, the dynamic_cast\
    \ operator will fail to convert the Shape object to a Circle object, and will\
    \ throw a bad_cast exception. The exception will be caught in the catch block,\
    \ and the error message will be printed to the console.\n\nIt's important to note\
    \ that the bad_cast exception will only be thrown if the dynamic_cast operator\
    \ fails to perform the conversion. If the conversion is successful, the bad_cast\
    \ exception will not be thrown.\n\n### static_cast operator\n\nThe static_cast\
    \ operator in C++ is used to perform a safe, explicit type conversion. It can\
    \ be used to convert values between compatible types, such as converting an int\
    \ to a float, or to convert a pointer to a base class to a pointer to a derived\
    \ class.\n\nThe syntax for using static_cast is as follows:\n\n```\ndestination_type\
    \ value = static_cast<destination_type>(expression);\n```\n\nWhere destination_type\
    \ is the type to which the value of expression will be converted, and expression\
    \ is the value to be converted.\n\nHere is an example of using static_cast to\
    \ convert an int to a float :\n\n```\n#include <iostream>\n\nint main() {\n  \
    \  int x = 5;\n    float y = static_cast<float>(x);\n    std::cout << \"y = \"\
    \ << y << std::endl;\n    return 0;\n}\n```\n\nIn this example, the value of x\
    \ is converted from an int to a float using the static_cast operator, and the\
    \ result is stored in the float variable y. The output of this program will be\
    \ \"y = 5.0\".\n\nIt's important to note that static_cast does not perform any\
    \ runtime checks to ensure that the conversion is valid. It is the responsibility\
    \ of the programmer to ensure that the conversion is safe and will not result\
    \ in undefined behavior.\n\n### const_cast operator\n\nThe const_cast operator\
    \ in C++ is used to remove the const or volatile attribute from a variable. It\
    \ can be used to cast away the const or volatile qualifier from a pointer or reference,\
    \ allowing the value to be modified.\n\nThe syntax for using const_cast is as\
    \ follows:\n\n```\ndestination_type value = const_cast<destination_type>(expression);\n\
    ```\n\nWhere destination_type is the type to which the value of expression will\
    \ be converted, and expression is the value to be converted.\n\nHere is an example\
    \ of using const_cast to remove the const attribute from a const int :\n\n```\n\
    #include <iostream>\n\nint main() {\n    const int x = 5;\n    int *y = const_cast<int*>(\
