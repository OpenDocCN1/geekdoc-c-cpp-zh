    \n以下是 C++ 中函数重载的示例：\n\n```\nint add(int x, int y)\n{\n    return x + y;\n}\n\n\
    double add(double x, double y)\n{\n    return x + y;\n}\n\nstd::string add(const\
    \ std::string& x, const std::string& y)\n{\n    return x + y;\n}\n```\n\n在此示例中，函数\
    \ add 被重载了三次。第一个版本接受两个整数参数并返回整数。第二个版本接受两个 double 参数并返回 double。第三个版本接受两个字符串参数并返回字符串。\n\
    \n要调用这些函数中的一个，可以使用正常的函数调用语法，C++ 编译器将根据你传递的参数类型自动选择函数的正确版本。例如：\n\n```\nint a =\
