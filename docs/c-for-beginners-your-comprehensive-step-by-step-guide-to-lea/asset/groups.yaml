    \ std::cout << \"x + y = \" << x + y << std::endl; } 为变量 y 创建了一个新的作用域，该变量只能在复合语句内访问。该程序的输出将是\
    \ \"x + y = 15\"。\n\n复合语句是 C++ 的重要组成部分，用于将语句分组并为变量创建新的作用域。它们通常与选择和迭代语句结合使用，以创建作为一个单元执行的代码块。\n\
    \n## 第九章\n\n## 选择语句\n\n在 C++ 中，选择语句用于根据条件的值执行不同的代码块。C++ 中有两种选择语句：if 语句和 switch\
