    \n标准转换由编译器自动应用，程序员无需显式指定它们。它们是 C++ 类型系统的重要组成部分，因为它们允许不同类型的值在许多上下文中互换使用。理解标准转换的工作原理对于编写正确且高效的\
    \ C++ 代码至关重要。\n\n## Chapter II\n\n## built-in types\n\n## Built-in types\n\n在\
    \ C++ 中，内置类型是一组由语言提供并由编译器直接实现预定义类型。内置类型也被称为“基本类型”或“值类型”，因为它们是语言提供的最基本类型，通常存储在栈上的内存中。\n\
    \nC++ 标准库提供了几种内置类型，包括以下：\n\n- bool : 一个布尔类型，表示 true 或 false。\n- char : 一个字符类型，表示单个字符。\n\
    - int , short , long , 和 long long : 各种大小的整数类型。\n- float 和 double : 各种精度的浮点类型。\n\
    - void : 一种特殊类型，表示值的缺失。\n\n内置类型是 C++ 中的一个重要概念，因为它们构成了语言中许多其他类型的基础。理解内置类型的工作原理以及如何使用它们对于编写高效且正确的\
    \ C++ 代码至关重要。\n\n以下是 C++ 中使用内置类型的示例：\n\n```\nint x = 5;      // x is a value of\
    \ type int\nchar c = 'a';   // c is a value of type char\nbool b = true;  // b\
    \ is a value of type bool\n\nfloat f = 3.14; // f is a value of type float\ndouble\
    \ d = 1.23456789; // d is a value of type double\n```\n\n## Data type ranges\n\
    \n在 C++ 中，数据类型的范围是它可以表示的值的集合。数据类型的范围由其大小和编码方式决定。\n\nC++ 标准库提供了几种内置类型，每种都有其特定的值范围。以下表格显示了\
    \ C++ 中一些常见内置类型的范围：\n\n| Type | Size (bytes) | Minimum value | Maximum value |\n\
    |---|---|---|---|\n| bool | 1 | false | true |\n| char | 1 | -128 | 127 |\n| wchar_t\
    \ | 2 or 4 | implementation-defined | implementation-defined |\n| char16_t | 2\
    \ | 0 | 65535 |\n| char32_t | 4 | 0 | 4294967295 |\n| short | 2 | -32768 | 32767\
    \ |\n| int | 4 | -2147483648 | 2147483647 |\n| long | 4 or 8 | implementation-defined\
    \ | implementation-defined |\n| long long | 8 | -9223372036854775808 | 9223372036854775807\
    \ |\n| float | 4 | 1.17549e-38 | 3.40282e+38 |\n| double | 8 | 2.22507e-308 |\
    \ 1.79769e+308 |\n| long double | 8 or 10 or 16 | implementation-defined | implementation-defined\
    \ |\n\n在使用 C++ 时，了解数据类型的范围很重要，因为使用超出其范围的值可能导致未定义行为。了解数据类型的范围对于选择给定任务的适当类型也很重要，因为使用范围更大的类型可能会带来更好的性能或更准确的结果。\n\
    \n## nullptr\n\n在 C++ 中，`nullptr` 是一个表示空指针值的特殊关键字。它在 C++11 中引入，作为使用整数常量 `0` 或宏\
    \ `NULL` 表示空指针更安全、更明确的方式。\n`nullptr` 的类型为 `std::nullptr_t`，这是一种特殊类型，可以隐式转换为任何指针类型。这允许\
    \ `nullptr` 在期望指针的各种上下文中使用，例如初始化指针时或将指针传递给函数时。\n\n"
