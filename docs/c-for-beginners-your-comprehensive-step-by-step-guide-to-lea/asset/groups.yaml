    \ 0 1 4 9 16\n\n    return 0;\n}\n```\n\n# Semantics of expressions\n\nIn C++,\
    \ the semantics of an expression refer to the meaning and behavior of the expression\
    \ when it is evaluated. The rules for evaluating expressions in C++ are determined\
    \ by the operator precedence and associativity rules, as well as the types and\
    \ values of the operands.\n\nHere are some general rules for evaluating expressions\
    \ in C++:\n\n+   1. Parentheses can be used to override the default precedence\
    \ and associativity rules. Expressions within parentheses are always evaluated\
    \ first.\n2. Unary operators are evaluated before binary operators. For example,\
    \ in the expression !x + y, the logical NOT operator (!) is applied to x before\
    \ the addition operator (+) is applied to x and y.\n3. Binary operators are evaluated\
    \ in order of precedence, from highest to lowest. For example, in the expression\
    \ x + y * z, the multiplication operator (*) has a higher precedence than the\
    \ addition operator (+), so y and z are multiplied first.\n4. Operators with the\
    \ same precedence are evaluated from left to right (for left-associative operators)\
    \ or from right to left (for right-associative operators). For example, in the\
    \ expression x = y = z, the assignment operator (=) is right-associative, so z\
    \ is assigned to y first, then the result of that assignment is assigned to x."
  md: "\n## Ellipsis and variadic templates\n\nIn C++, an ellipsis ( ... ) is used\
    \ to indicate a variadic function, which is a function that can take a variable\
    \ number of arguments. An ellipsis is used in the function's parameter list to\
    \ denote the variable number of arguments.\n\nHere is an example of a variadic\
    \ function in C++:\n\n```\n#include <iostream>\n#include <string>\n\nvoid print_all(const\
    \ char* fmt, ...)\n{\n    va_list args;\n    va_start(args, fmt);\n\n    while\
    \ (*fmt) {\n        if (*fmt == '%') {\n            ++fmt;\n            if (*fmt\
    \ == 'd') {\n                std::cout << va_arg(args, int);\n            } else\
    \ if (*fmt == 's') {\n                std::cout << va_arg(args, const char*);\n\
    \            } else if (*fmt == 'f') {\n                std::cout << va_arg(args,\
    \ double);\n            }\n        } else {\n            std::cout << *fmt;\n\
    \        }\n        ++fmt;\n    }\n\n    va_end(args);\n}\n\nint main()\n{\n \
    \   print_all(\"%d %s %f\", 10, \"hello\", 3.14);\n    return 0;\n}\n```\n\nIn\
    \ this example, we have a function called print_all that takes a variable number\
    \ of arguments. The first argument is a const char* called fmt , which specifies\
    \ the format of the remaining arguments. The ellipsis ( ... ) in the parameter\
    \ list indicates that there can be any number of additional arguments. Inside\
    \ the function, we use the va_list , va_start , va_arg , and va_end macros to\
    \ access the variable arguments. The va_list type is used to hold the list of\
    \ arguments, and the va_start macro is used to initialize the va_list with the\
    \ first argument after fmt . The va_arg macro is used to retrieve the next argument\
    \ from the list, and the va_end macro is used to clean up the va_list when we\
    \ are finished with it.\n\nIn this example, we use a loop to iterate over the\
    \ characters in the fmt string. If we encounter a % character, we increment the\
    \ pointer to the fmt string and check the next character to determine the type\
    \ of the next argument. If the next character is d, we print the next argument\
    \ as an int, if it is s, we print the next argument as a const char*, and if it\
    \ is f, we print the next argument as a double.\n\nThe output of this program\
    \ would be:\n\n10 hello 3.14\n\n## Postfix expressions\n\nIn computer science,\
    \ a postfix expression is an expression in which each operator follows its operands.\
    \ This is in contrast to an infix expression, in which operators are placed between\
    \ their operands.\n\nFor example, the infix expression \"2 + 3 * 4\" would be\
    \ written as \"2 3 4 * +\" in postfix notation.\n\n## Expressions with unary operators\n\
    \nUnary operators are operators that act on a single operand. In C++, there are\
    \ several unary operators, including:\n\n- ++ (increment operator)\n- -- (decrement\
    \ operator)\n- + (unary plus)\n- - (unary minus)\n- ! (logical NOT)\n- ~ (bitwise\
    \ NOT)\n- * (dereference operator)\n- & (reference operator)\n\nHere is an example\
    \ of how to use the unary increment operator ( ++ ) in C++:\n\n```\n#include <iostream>\n\
    \nusing namespace std;\n\nint main()\n{\n    int x = 10;\n\n    // Prefix increment:\
    \ value is incremented, then used\n    cout << ++x << endl; // Outputs 11\n\n\
    \    // Postfix increment: value is used, then incremented\n    cout << x++ <<\
    \ endl; // Outputs 11\n    cout << x << endl; // Outputs 12\n\n    return 0;\n\
    }\n```\n\nThe unary decrement operator ( -- ) works in a similar way.\n\nYou can\
    \ use the unary plus and minus operators to change the sign of a value:\n\n```\n\
    int x = 10;\ncout << +x << endl; // Outputs 10\ncout << -x << endl; // Outputs\
    \ -10\n```\n\nThe logical NOT operator ( ! ) can be used to invert the truth value\
    \ of a boolean expression:\n\n```\nbool x = true;\ncout << !x << endl; // Outputs\
    \ false\n```\n\nThe bitwise NOT operator ( ~ ) can be used to invert the bits\
    \ of an integer value:\n\n```\nint x = 10; // Binary representation: 00000000000000000000000000001010\n\
    cout << ~x << endl; // Outputs -11 (11111111111111111111111111110101)\n```\n\n\
    The dereference operator ( * ) is used to access the value stored at a memory\
    \ address:\n\n```\nint x = 10;\nint *ptr = &x; // ptr holds the memory address\
    \ of x\ncout << *ptr << endl; // Outputs 10 (the value stored at the memory address\
    \ held by ptr)\n```\n\nThe reference operator ( & ) is used to get the memory\
    \ address of a variable:\n\n```\nint x = 10;\nint *ptr = &x; // ptr holds the\
    \ memory address of x\ncout << ptr << endl; // Outputs the memory address of x\n\
    ```\n\n## Expressions with binary operators\n\nBinary operators are operators\
    \ that act on two operands. In C++, there are several binary operators, including:\n\
    \n- + (addition)\n- - (subtraction)\n- * (multiplication)\n- / (division)\n- %\
    \ (modulus)\n- = (assignment)\n- += (addition assignment)\n- -= (subtraction assignment)\n\
    - *= (multiplication assignment)\n- /= (division assignment)\n- %= (modulus assignment)\n\
    - == (equal to)\n- != (not equal to)\n- > (greater than)\n- < (less than)\n- >=\
    \ (greater than or equal to)\n- <= (less than or equal to)\n- && (logical AND)\n\
    - || (logical OR)\n- & (bitwise AND)\n- | (bitwise OR)\n- ^ (bitwise XOR)\n- <<\
    \ (left shift)\n- >> (right shift)\n\nHere is an example of how to use some of\
    \ these operators in C++:\n\n```\n#include <iostream>\n\nusing namespace std;\n\
    \nint main()\n{\n    int x = 10, y = 5;\n\n    // Arithmetic operators\n    cout\
    \ << x + y << endl; // Outputs 15\n    cout << x - y << endl; // Outputs 5\n \
    \   cout << x * y << endl; // Outputs 50\n    cout << x / y << endl; // Outputs\
    \ 2\n\n    // Assignment operator\n    int z = x;\n    cout << z << endl; // Outputs\
    \ 10\n\n    // Comparison operators\n    cout << (x == y) << endl; // Outputs\
    \ false\n    cout << (x != y) << endl; // Outputs true\n    cout << (x > y) <<\
    \ endl; // Outputs true\n    cout << (x < y) << endl; // Outputs false\n\n   \
    \ // Logical operators\n    cout << (x > 0 && y < 10) << endl; // Outputs true\n\
    \    cout << (x > 0 || y > 10) << endl; // Outputs true\n\n    // Bitwise operators\n\
    \    cout << (x & y) << endl; // Outputs 0 (binary:\n00000000000000000000000000001010\
    \ & 00000000000000000000000000000101 =\n00000000000000000000000000000000)\n  \
    \  cout << (x | y) << endl; // Outputs 15 (binary:\n00000000000000000000000000001010\
    \ | 00000000000000000000000000000101 =\n00000000000000000000000000001111)\n  \
    \  cout << (x ^ y) << endl; // Outputs 15 (binary:\n00000000000000000000000000001010\
    \ ^ 00000000000000000000000000000101 =\n00000000000000000000000000001111)\n\n\
    \    return 0;\n}\n```\n\n## Constant expressions\n\nIn C++, a constant expression\
    \ is an expression that can be evaluated at compile time, rather than at runtime.\
    \ Constant expressions are typically used to initialize variables with fixed values\
    \ or to specify array sizes.\nThere are several ways to create constant expressions\
    \ in C++:\n\n- 1. Using constants: Any literal value (such as 42, 3.14, or 'A')\
    \ is a constant expression.\n- 2. Using const variables: A variable that is declared\
    \ with the const keyword is a constant expression. For example:\n- 3. Using constexpr\
    \ variables: A variable that is declared with the constexpr keyword is a constant\
    \ expression. For example:\n- 4. Using enums: Enumeration constants are treated\
    \ as constants in C++. For example:\n- 5. Using constexpr functions: A function\
    \ that is declared with the constexpr keyword and meets certain criteria (such\
    \ as having a single return statement) can be used in constant expressions. For\
    \ example:\n\n```\nconst int x = 42;\nconst double pi = 3.14;\nconst char c =\
    \ 'A';\n```\n\n```\nconstexpr int x = 42;\nconstexpr double pi = 3.14;\nconstexpr\
    \ char c = 'A';\n```\n\n```\nenum Colors { Red, Green, Blue };\n\nconstexpr Colors\
    \ favoriteColor = Green;\n```\n\n```\nconstexpr int square(int x)\n{\n    return\
    \ x * x;\n}\n\nconstexpr int x = square(5); // x is 25\n```\n\nHere is an example\
    \ of how to use a constant expression to initialize an array in C++:\n\n```\n\
    #include <iostream>\n\nusing namespace std;\n\nconstexpr int N = 5; // N is a\
    \ constant expression\n\nint main()\n{\n    int arr[N]; // arr has 5 elements\n\
    \n    for (int i = 0; i < N; i++)\n        arr[i] = i * i;\n\n    for (int i =\
    \ 0; i < N; i++)\n        cout << arr[i] << \" \"; // Outputs 0 1 4 9 16\n\n \
    \   return 0;\n}\n```\n\n## Semantics of expressions\n\nIn C++, the semantics\
    \ of an expression refer to the meaning and behavior of the expression when it\
    \ is evaluated. The rules for evaluating expressions in C++ are determined by\
    \ the operator precedence and associativity rules, as well as the types and values\
    \ of the operands.\n\nHere are some general rules for evaluating expressions in\
    \ C++:\n\n- 1. Parentheses can be used to override the default precedence and\
    \ associativity rules. Expressions within parentheses are always evaluated first.\n\
    - 2. Unary operators are evaluated before binary operators. For example, in the\
    \ expression !x + y, the logical NOT operator (!) is applied to x before the addition\
    \ operator (+) is applied to x and y.\n- 3. Binary operators are evaluated in\
    \ order of precedence, from highest to lowest. For example, in the expression\
    \ x + y * z, the multiplication operator (*) has a higher precedence than the\
    \ addition operator (+), so y and z are multiplied first.\n- 4. Operators with\
    \ the same precedence are evaluated from left to right (for left-associative operators)\
    \ or from right to left (for right-associative operators). For example, in the\
    \ expression x = y = z, the assignment operator (=) is right-associative, so z\
    \ is assigned to y first, then the result of that assignment is assigned to x.\n"
  mdcn: "\n\n## 省略号和可变参数模板\n\n在 C++ 中，省略号（ ... ）用于表示可变参数函数，即可以接受可变数量参数的函数。省略号用于函数参数列表中以表示可变数量的参数。\n\
    \n以下是 C++ 中可变参数函数的示例：\n\n```\n#include <iostream>\n#include <string>\n\nvoid print_all(const\
    \ char* fmt, ...)\n{\n    va_list args;\n    va_start(args, fmt);\n\n    while\
    \ (*fmt) {\n        if (*fmt == '%') {\n            ++fmt;\n            if (*fmt\
    \ == 'd') {\n                std::cout << va_arg(args, int);\n            } else\
    \ if (*fmt == 's') {\n                std::cout << va_arg(args, const char*);\n\
    \            } else if (*fmt == 'f') {\n                std::cout << va_arg(args,\
    \ double);\n            }\n        } else {\n            std::cout << *fmt;\n\
    \        }\n        ++fmt;\n    }\n\n    va_end(args);\n}\n\nint main()\n{\n \
    \   print_all(\"%d %s %f\", 10, \"hello\", 3.14);\n    return 0;\n}\n```\n\n在此示例中，我们有一个名为\
    \ print_all 的函数，它接受可变数量的参数。第一个参数是 const char* 类型的 fmt ，它指定了剩余参数的格式。参数列表中的省略号（\
    \ ... ）表示可以有任意数量的额外参数。在函数内部，我们使用 va_list 、 va_start 、 va_arg 和 va_end 宏来访问可变参数。\
    \ va_list 类型用于保存参数列表， va_start 宏用于将 va_list 初始化为 fmt 之后第一个参数。 va_arg 宏用于从列表中检索下一个参数，\
    \ va_end 宏用于在我们完成使用后清理 va_list 。\n\n在此示例中，我们使用循环遍历 fmt 字符串中的字符。如果我们遇到 % 字符，我们将\
    \ fmt 字符串的指针递增并检查下一个字符以确定下一个参数的类型。如果下一个字符是 d，我们将下一个参数作为 int 打印，如果是 s，我们将下一个参数作为\
    \ const char* 打印，如果是 f，我们将下一个参数作为 double 打印。\n\n此程序的输出为：\n\n10 hello 3.14\n\n\
    ## 后缀表达式\n\n在计算机科学中，后缀表达式是一种表达式，其中每个运算符都跟在其操作数之后。这与中缀表达式形成对比，在中缀表达式中，运算符放置在其操作数之间。\n\
    \n例如，中缀表达式 \"2 + 3 * 4\" 将在后缀记法中写成 \"2 3 4 * +\"。\n\n## 包含一元运算符的表达式\n\n一元运算符是作用于单个操作数的运算符。在\
    \ C++ 中，有多个一元运算符，包括：\n\n- ++ （递增运算符）\n- -- （递减运算符）\n- + （一元加）\n- - （一元减）\n- !\
    \ （逻辑非）\n- ~ （按位非）\n- * （解引用运算符）\n- & （引用运算符）\n\n以下是如何在 C++ 中使用一元递增运算符（ ++ ）的示例：\n\
    \n```\n#include <iostream>\n\nusing namespace std;\n\nint main()\n{\n    int x\
    \ = 10;\n\n    // Prefix increment: value is incremented, then used\n    cout\
    \ << ++x << endl; // Outputs 11\n\n    // Postfix increment: value is used, then\
    \ incremented\n    cout << x++ << endl; // Outputs 11\n    cout << x << endl;\
    \ // Outputs 12\n\n    return 0;\n}\n```\n\n一元递减运算符（ -- ）的工作方式类似。\n\n你可以使用一元加和减运算符来改变值的符号：\n\
    \n```\nint x = 10;\ncout << +x << endl; // Outputs 10\ncout << -x << endl; //\
    \ Outputs -10\n```\n\n逻辑非运算符（ ! ）可用于反转布尔表达式的真值：\n\n```\nbool x = true;\ncout <<\
    \ !x << endl; // Outputs false\n```\n\n按位非运算符（ ~ ）可用于反转整数值的位：\n\n```\nint x =\
    \ 10; // Binary representation: 00000000000000000000000000001010\ncout << ~x <<\
    \ endl; // Outputs -11 (11111111111111111111111111110101)\n```\n\n解引用运算符（ * ）用于访问存储在内存地址中的值：\n\
    \n```\nint x = 10;\nint *ptr = &x; // ptr holds the memory address of x\ncout\
    \ << *ptr << endl; // Outputs 10 (the value stored at the memory address held\
    \ by ptr)\n```\n\n引用运算符（ & ）用于获取变量的内存地址：\n\n```\nint x = 10;\nint *ptr = &x; //\
    \ ptr holds the memory address of x\ncout << ptr << endl; // Outputs the memory\
    \ address of x\n```\n\n## 包含二元运算符的表达式\n\n二元运算符是作用于两个操作数的运算符。在 C++ 中，有多个二元运算符，包括：\n\
    \n- + （加法）\n- - （减法）\n- * （乘法）\n- / （除法）\n- % （取模）\n- = （赋值）\n- += （加法赋值）\n- -=\
    \ （减法赋值）\n- *= （乘法赋值）\n- /= （除法赋值）\n- %= （取模赋值）\n- == （等于）\n- != （不等于）\n- > （大于）\n\
    - < （小于）\n- >= （大于或等于）\n- <= （小于或等于）\n- && （逻辑与）\n- || （逻辑或）\n- & （按位与）\n- | （按位或）\n\
    - ^ （按位异或）\n- << （左移）\n- >> （右移）\n\n以下是如何在 C++ 中使用其中一些运算符的示例：\n\n```\n#include\
    \ <iostream>\n\nusing namespace std;\n\nint main()\n{\n    int x = 10, y = 5;\n\
    \n    // Arithmetic operators\n    cout << x + y << endl; // Outputs 15\n    cout\
    \ << x - y << endl; // Outputs 5\n    cout << x * y << endl; // Outputs 50\n \
    \   cout << x / y << endl; // Outputs 2\n\n    // Assignment operator\n    int\
    \ z = x;\n    cout << z << endl; // Outputs 10\n\n    // Comparison operators\n\
    \    cout << (x == y) << endl; // Outputs false\n    cout << (x != y) << endl;\
    \ // Outputs true\n    cout << (x > y) << endl; // Outputs true\n    cout << (x\
    \ < y) << endl; // Outputs false\n\n    // Logical operators\n    cout << (x >\
    \ 0 && y < 10) << endl; // Outputs true\n    cout << (x > 0 || y > 10) << endl;\
    \ // Outputs true\n\n    // Bitwise operators\n    cout << (x & y) << endl; //\
    \ Outputs 0 (binary:\n00000000000000000000000000001010 & 00000000000000000000000000000101\
    \ =\n00000000000000000000000000000000)\n    cout << (x | y) << endl; // Outputs\
    \ 15 (binary:\n00000000000000000000000000001010 | 00000000000000000000000000000101\
    \ =\n00000000000000000000000000001111)\n    cout << (x ^ y) << endl; // Outputs\
    \ 15 (binary:\n00000000000000000000000000001010 ^ 00000000000000000000000000000101\
    \ =\n00000000000000000000000000001111)\n\n    return 0;\n}\n```\n\n## 常量表达式\n\n\
    在 C++ 中，常量表达式是在编译时而不是在运行时可以求值的表达式。常量表达式通常用于用固定值初始化变量或指定数组大小。\n在 C++ 中创建常量表达式有几种方法：\n\
    \n- 1. 使用常量：任何字面值（例如 42、3.14 或 'A'）都是常量表达式。\n- 2. 使用 const 变量：使用 const 关键字声明的变量是常量表达式。例如：\n\
    - 3. 使用 constexpr 变量：使用 constexpr 关键字声明的变量是常量表达式。例如：\n- 4. 使用枚举：枚举常量在 C++ 中被视为常量。例如：\n\
    - 5. 使用 constexpr 函数：使用 constexpr 关键字声明并满足某些条件（例如具有单个 return 语句）的函数可用于常量表达式。例如：\n\
    \n```\nconst int x = 42;\nconst double pi = 3.14;\nconst char c = 'A';\n```\n\n\
    ```\nconstexpr int x = 42;\nconstexpr double pi = 3.14;\nconstexpr char c = 'A';\n\
    ```\n\n```\nenum Colors { Red, Green, Blue };\n\nconstexpr Colors favoriteColor\
    \ = Green;\n```\n\n```\nconstexpr int square(int x)\n{\n    return x * x;\n}\n\
    \nconstexpr int x = square(5); // x is 25\n```\n\n以下是如何在 C++ 中使用常量表达式初始化数组的示例：\n\
    \n```\n#include <iostream>\n\nusing namespace std;\n\nconstexpr int N = 5; //\
    \ N is a constant expression\n\nint main()\n{\n    int arr[N]; // arr has 5 elements\n\
