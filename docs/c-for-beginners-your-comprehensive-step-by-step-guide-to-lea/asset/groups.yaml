  mdcn: "\n\n结构体通常用于定义不需要类提供的封装和保护的简单数据结构。然而，结构体也可以包含成员函数，并且在许多情况下可以像类一样使用。\n\n结构体是\
    \ C++ 的重要组成部分，在许多程序中被广泛用于定义自定义数据类型并将相关数据组合在一起。\n\n## 类成员概述\n\n在 C++ 中，类是一种用户定义的类型，可以包含数据成员（变量）和成员函数（属于类的函数）。类使用\
    \ class 关键字定义，如下所示：\n\n```\nclass Point\n{\npublic:\n    Point(int x, int y) :\
    \ x_(x), y_(y) {}\n\n    int getX() const { return x_; }\n    int getY() const\
    \ { return y_; }\n\nprivate:\n    int x_;\n    int y_;\n};\n```\n\n在此示例中，Point\
    \ 类有两个数据成员 x_ 和 y_，以及两个成员函数 getX 和 getY，用于返回这些数据成员的值。\n\n类定义中的 public 关键字指定其后的成员可以从类外部访问。这意味着你可以使用\
    \ . 运算符从类外部访问 Point 类实例的成员函数和数据成员。\n\n类定义中的 private 关键字指定其后的成员只能从类内部访问。这意味着你不能直接从类外部访问数据成员，但可以通过成员函数访问它们。\n\
    \n你可以使用 new 运算符或声明类类型的变量来创建类的实例，如下所示：\n\n```\nPoint p1(1, 2);  // Create an instance\
    \ of Point using constructor\n\nPoint *p2 = new Point(3, 4);  // Create an instance\
    \ of Point using new\n\nPoint p3;  // Create an instance of Point with default\
    \ constructor\n```\n\n类是 C++ 的重要组成部分，在许多程序中被广泛用于定义自定义数据类型并封装数据和功能。\n\n## 成员访问控制\n\
    \n在 C++ 中，你可以使用 public、private 和 protected 关键字来指定类成员的访问控制。\n\npublic 关键字指定其后的成员可以从类外部访问。这意味着你可以使用\
    \ . 运算符从类外部访问类的实例的成员函数和数据成员。\n\nprivate 关键字指定其后的成员只能从类内部访问。这意味着你不能直接从类外部访问数据成员，但可以通过成员函数访问它们。\n\
    \nprotected 关键字指定其后的成员只能从类内部及其派生类访问。这意味着你不能直接从类外部访问数据成员，但可以在类及其派生类中的成员函数中访问它们。\n\
    \n以下是类定义中使用访问控制的示例：\n\n```\nclass Point\n{\npublic:\n    Point(int x, int y) :\
    \ x_(x), y_(y) {}\n\n    int getX() const { return x_; }\n    int getY() const\
    \ { return y_; }\n\nprivate:\n    int x_;\n    int y_;\n};\n```\n\n在此示例中，Point\
    \ 类有两个公共成员函数 getX 和 getY，可以使用 . 运算符从类外部调用。x_ 和 y_ 数据成员是私有的，这意味着它们只能从类内部访问。\n\n\
    访问控制是 C++ 的重要组成部分，用于指定类的哪些成员可以从类外部访问。它允许你封装数据和功能并控制其使用方式。\n\n## 什么是友元\n\n在 C++\
    \ 中，友元函数是可以访问类的私有和受保护成员的函数。友元函数不是类的成员函数，但它可以访问类的内部实现细节。\n\n你可以在类定义中使用 friend 关键字将函数声明为类的友元，如下所示：\n\
    \n```\nclass Point\n{\npublic:\n    Point(int x, int y) : x_(x), y_(y) {}\n\n\
    \    friend int distance(const Point &p1, const Point &p2);\n\nprivate:\n    int\
    \ x_;\n    int y_;\n};\n\nint distance(const Point &p1, const Point &p2)\n{\n\
    \    int dx = p1.x_ - p2.x_;\n    int dy = p1.y_ - p2.y_;\n    return sqrt(dx\
    \ * dx + dy * dy);\n}\n```\n\n在此示例中，Point 类有一个私有数据成员 x_，以及一个友元函数 distance，可以访问\
    \ x_ 数据成员。distance 函数不是 Point 类的成员函数，但它可以像成员函数一样访问 Point 类的私有数据成员。\n\n当你希望允许函数访问类的私有数据成员，但又不想将该函数设为类的成员函数时，友元函数很有用。它们还用于在\
    \ C++ 中实现运算符重载。\n\n友元函数是 C++ 的重要组成部分，在许多程序中被广泛用于实现高级编程技术和运算符重载。\n\n## private\n\
    \n在 C++ 中，private 关键字用于指定类成员的访问控制。声明为 private 的类成员只能从类内部访问，不能直接从类外部访问。\n\n以下是类定义中使用\
    \ private 关键字的示例：\n\n```\nclass Point\n{\npublic:\n    Point(int x, int y) : x_(x),\
    \ y_(y) {}\n\n    int getX() const { return x_; }\n    int getY() const { return\
    \ y_; }\n\nprivate:\n    int x_;\n    int y_;\n};\n```\n\n在此示例中，Point 类有两个公共成员函数\
    \ getX 和 getY，可以使用 . 运算符从类外部调用。x_ 和 y_ 数据成员是私有的，这意味着它们只能从类内部访问。\n\nprivate 访问控制用于封装数据和功能并控制其使用方式。它允许你将类的实现细节隐藏在外部代码之外并保护数据的完整性。\n\
    \nprivate 关键字是 C++ 的重要组成部分，在许多程序中被广泛用于指定类成员的访问控制。\n\n## protected\n\n在 C++ 中，protected\
    \ 关键字用于指定类成员的访问控制。声明为 protected 的类成员只能从类内部及其派生类访问，不能直接从类外部访问。\n\n以下是类定义中使用 protected\
    \ 关键字的示例：\n\n```\nclass Point\n{\npublic:\n    Point(int x, int y) : x_(x), y_(y)\
    \ {}\n\n    int getX() const { return x_; }\n    int getY() const { return y_;\
    \ }\n\nprotected:\n    int x_;\n    int y_;\n};\n```\n\n```\nclass ColorPoint\
    \ : public Point\n{\npublic:\n    ColorPoint(int x, int y, int color) : Point(x,\
    \ y), color_(color) {}\n\n    int getColor() const { return color_; }\n\nprivate:\n\
    \    int color_;\n};\n```\n\n在此示例中，Point 类有两个公共成员函数 getX 和 getY，可以使用 . 运算符从类外部调用。x_\
    \ 和 y_ 数据成员是受保护的，这意味着它们只能从 Point 类及其派生类内部访问。\n\nColorPoint 类派生自 Point 类，可以访问 x_\
    \ 和 y_ 数据成员。然而，这些数据成员不能从 ColorPoint 类外部访问。\n\nprotected 访问控制用于允许派生类访问其基类的数据和功能，同时仍然将实现细节隐藏在外部代码之外。它是\
    \ C++ 中继承机制的重要组成部分，在许多程序中被广泛用于指定类成员的访问控制。\n\n## public\n\n在 C++ 中，public 关键字用于指定类成员的访问控制。声明为\
    \ public 的类成员可以从类外部访问，可以直接使用 . 运算符访问。\n\n以下是类定义中使用 public 关键字的示例：\n\n```\nclass\
    \ Point\n{\npublic:\n    Point(int x, int y) : x_(x), y_(y) {}\n\n    int getX()\
    \ const { return x_; }\n    int getY() const { return y_; }\n\nprivate:\n    int\
    \ x_;\n    int y_;\n};\n```\n\n在此示例中，Point 类有两个公共成员函数 getX 和 getY，可以使用 . 运算符从类外部调用。x_\
    \ 和 y_ 数据成员是私有的，这意味着它们只能从类内部访问。\n\npublic 访问控制用于指定类的哪些成员可以从类外部访问。它允许你向外部代码公开类的数据和功能并控制其使用方式。\n\
    \npublic 关键字是 C++ 的重要组成部分，在许多程序中被广泛用于指定类成员的访问控制。\n\n## 大括号初始化\n\n在 C++ 中，大括号初始化是使用花括号\
    \ {} 初始化变量和对象的一种方式。它允许你在创建变量或对象时指定变量的值或对象构造函数的参数。\n\n"
