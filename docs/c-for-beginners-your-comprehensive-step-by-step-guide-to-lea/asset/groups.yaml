  - '[PAGE 18]


    In C++, the range of a data type is the set of values that it can represent. The
    range of a data type is determined by its size and the way it is encoded.


    The C++ standard library provides several built-in types, each with a specific
    range of values it can represent. The following table shows the range of some
    common built-in types in C++:


    | Type | Size (bytes) | Minimum value | Maximum value |

    |---|---|---|---|

    | bool | 1 | false | true |

    | char | 1 | -128 | 127 |

    | wchar_t | 2 or 4 | implementation-defined | implementation-defined |

    | char16_t | 2 | 0 | 65535 |

    | char32_t | 4 | 0 | 4294967295 |

    | short | 2 | -32768 | 32767 |

    | int | 4 | -2147483648 | 2147483647 |

    | long | 4 or 8 | implementation-defined | implementation-defined |

    | long long | 8 | -9223372036854775808 | 9223372036854775807 |

    | float | 4 | 1.17549e-38 | 3.40282e+38 |

    | double | 8 | 2.22507e-308 | 1.79769e+308 |

    | long double | 8 or 10 or 16 | implementation-defined | implementation-defined
    |


    It is important to be aware of the range of a data type when working with C++,
    as using a value outside of its range can lead to undefined behavior. Understanding
    the range of a data type is also important for choosing the appropriate type for
    a given task, as using a type with a larger range may result in better performance
    or more accurate results.


    # nullptr


    In C++, `nullptr` is a special keyword that represents a null pointer value. It
    was introduced in C++11 as a safer and more explicit way to represent a null pointer
    than the use of the integer constant `0` or the macro `NULL`.

    `nullptr` has type `std::nullptr_t`, which is a special type that can be implicitly
    converted to any pointer type. This allows `nullptr` to be used in a variety of
    contexts where a pointer is expected, such as when initializing a pointer or when
    passing a pointer to a function.'
