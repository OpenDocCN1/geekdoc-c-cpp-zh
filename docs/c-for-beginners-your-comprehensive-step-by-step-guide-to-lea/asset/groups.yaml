    A type is considered standard-layout if it is a type that satisfies the following
    conditions:


    +   - It is a trivial type.

    - It has no non-static data members of type non-standard-layout class (or array
    of such types).

    - It has no virtual functions and no virtual base classes.


    A type is considered a POD (Plain Old Data) type if it is a type that satisfies
    the following conditions:


    +   - It is a standard-layout type.

    - It has no non-static data members of type non-POD class (or array of such types).

    - It has no user-defined copy assignment operator and no user-defined destructor.


    Trivial, standard-layout, and POD types are important concepts in C++, as they
    have specific behavior and properties that can be relied upon by the programmer.
    For example, trivial types can be memset to zero and copied using memcpy, while
    standard-layout types can be passed to C functions and can be used to implement
    union types. POD types can be used to implement C-style structs and can be initialized
    with a brace-enclosed initializer list.


    Understanding the behavior and properties of trivial, standard-layout, and POD
    types is important for writing efficient and correct C++ code, particularly when
    working with low-level hardware or systems, or when interfacing with C code.


    # what is Value types


    In C++, a value type is a type that holds a value and is typically stored in memory
    on the stack. Value types are also known as "fundamental types," as they are the
    most basic types provided by the language.


    The standard C++ library provides several value types, including the following:


    +   - bool : a boolean type that represents true or false.

    - char : a character type that represents a single character.

    - int , short , long , and long long : integer types of varying sizes.'
