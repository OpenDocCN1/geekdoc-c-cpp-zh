    \ \"dff s\"，这表示接下来的三个参数是整数，第四个参数是字符串。\n\n要调用此函数，可以使用 ... 记法传入额外参数。以下是示例：\nprint(\"\
    dff s\", 10, 3.14, 5.67, \"hello\"); // Outputs \"10 3.14 5.67 hello\"\n\n可变参数函数在需要向函数传递可变数量参数时很有用，但它们也可能比具有固定参数的函数更难使用和维护。通常建议尽可能使用固定参数函数，仅在必要时使用可变参数函数。\n\
