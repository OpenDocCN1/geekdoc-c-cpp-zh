    \    return 0;\n}\n```\n\n该程序的输出为：\n\np: (10, 20)\nq[0]: (1, 2)\nq[4]: (9, 10)\n\
    \n在此示例中，new 运算符用于为单个 Point 对象和一个 Point 对象数组动态分配内存。delete 运算符用于在不再需要时释放内存。成员访问运算符\
