    \ abs(\n```\n\n## Standard conversions\n\n在 C++ 中，标准转换是由编译器执行的预定义隐式类型转换。标准转换是一组预定义规则，规定不同类型的值如何相互转换。\n\
    \nC++ 中有三种标准转换：\n\n1. Lvalue-to-rvalue conversion：此转换应用于左值（引用内存位置的表达式）以生成右值（不引用内存位置的表达式）。此转换通常应用于对象以允许它们用作右值，例如当它们作为参数传递给函数或用作赋值运算符的右操作数时。\n\
