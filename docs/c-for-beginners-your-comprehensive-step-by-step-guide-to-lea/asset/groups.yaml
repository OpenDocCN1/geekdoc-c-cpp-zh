  mdcn: "\n\n## 快速开始\n## C++\n面向初学者\n\n你的全面分步指南，学习 C++ 的一切\n\n![](img/574a0c5ef35f7474b7a0f010b8a2211a_0_0.png)\n\
    \n> \"让我们一起出发\"\n\n## C++ for beginners\n\n你的全面分步指南，学习 C++ 的一切\n\nDaniel Harder\n\
    \n## 引言\n\nC++ 是一种高性能编程语言，广泛应用于各种应用中，例如操作系统、网页浏览器和视频游戏。它由 Bjarne Stroustrup 于\
    \ 1979 年开发，是 C 编程语言的扩展，增加了面向对象特性和其他增强功能。\n\nC++ 是一种静态类型、编译型语言，这意味着它比 Python 或\
    \ JavaScript 等动态类型语言更高效。它也是一种非常富有表现力的语言，允许程序员编写既高效又易于阅读的代码。\n\nC++ 的关键特性之一是对面向对象编程（OOP）的支持。在\
    \ OOP 中，数据和行为被封装在“对象”中，这些对象可用于建模现实世界概念，并通过方法相互交互。C++ 也支持过程式编程，这是一种更传统的编程风格，专注于编写函数来执行特定任务。\n\
    \nC++ 是一种功能强大且灵活的语言，但对初学者来说也可能复杂且难以学习。它需要对计算机科学概念有良好的理解，以及对变量、数据类型、循环和控制结构等编程概念的坚实基础。然而，一旦你对这些概念有牢固的理解，C++\
    \ 将是一种非常有回报的学习和使用语言。\n\n## 第一章\n### 基本概念\n### C++ 类型系统\n\n在 C++ 中，数据使用各种数据类型进行存储和操作。这些数据类型决定了变量使用的内存大小和布局，以及可以对其执行的操作集合。\n\
    \nC++ 拥有丰富的类型系统，包括内置类型和用户定义类型。\n\n内置类型包括：\n\n- 整数类型：这些表示整数，包括 `char`、`short`、`int`、`long`\
    \ 和 `long long`。每种类型大小不同，`char` 是最小的，`long long` 是最大的。\n- 浮点类型：这些表示带小数部分数字，包括\
    \ `float`、`double` 和 `long double`。这些类型也有不同的大小，`float` 是最小的，`long double` 是最大的。\n\
    - 布尔类型：这表示真/假值，由 `bool` 类型表示。\n- 字符类型：这些表示单个字符，包括 `char` 和 `wchar_t`。`char` 用于\
    \ ASCII 字符，`wchar_t` 用于宽字符，可表示各种不同字母表的字符。\n\nC++ 中的用户定义类型包括：\n\n- 类：类是一种用户定义的数据类型，允许你定义自己的数据字段和方法。\n\
    - 结构体：结构体与类类似，但数据字段和方法默认是公开的。\n- 枚举：枚举是一种用户定义的类型，由一组命名常量组成。\n- Typedef：`typedef`\
    \ 关键字允许你为现有数据类型定义一个新名称。这可用于为复杂类型创建更易读或更具表现力的名称。\n\nC++ 还支持类型转换，允许你将值从一种数据类型转换为另一种数据类型。这在处理需要一起使用不同数据类型时很有用，但使用类型转换时必须谨慎，因为如果使用不当，可能导致精度丢失或其他意外行为。\n\
    \n### 作用域\n\n在 C++ 中，变量的作用域是指变量在程序中可见或可访问的部分。变量的作用域由其在程序中的声明位置决定。\n\nC++ 中主要有两种作用域：局部作用域和全局作用域。\n\
    \n局部变量是在函数或代码块内声明的变量。局部变量仅在声明它的函数或块内可见，并且只能从声明点访问到块结束。当函数或块结束时，局部变量被销毁，不再可访问。\n\
    \n全局变量是在任何函数或代码块之外声明的变量。全局变量在整个程序中都可见，可以从任何函数或代码块访问。然而，通常认为良好的编程实践是尽量减少全局变量的使用，因为它们会使程序更难以理解和维护。\n\
    \nC++ 还支持嵌套作用域，其中一个代码块定义在另一个代码块内。在这种情况下，在内部块中声明的变量仅在该块内可见，但也可能从外部块访问。\n\n变量的作用域是\
    \ C++ 中的一个重要概念，因为它决定了变量在程序中的可见性和可访问性。理解变量的作用域对于编写高效且可维护的代码至关重要。\n\n### 头文件\n\n\
    在 C++ 中，头文件是一个包含可在 C++ 程序中使用的函数、变量和其他构造的声明的文件。头文件通常以 .h 后缀表示，并使用 #include 指令包含在\
    \ C++ 源文件中。\n\n头文件在 C++ 中用于多种目的。它们可用于声明在另一个源文件中定义并可在多个文件中使用的函数和变量，而无需代码重复。它们也可用于声明在库中实现并可在程序中使用而无需将库链接到程序中的函数和变量。\n\
    \n头文件还可用于定义宏，即由预处理器替换为其对应展开形式的短代码片段。宏常用于定义需要在程序多处使用的常量和其他值。\n\n使用头文件的主要优点之一是它使代码更易于组织和重用。通过将声明与定义分离并将其放在单独的头文件中，可以在多个程序中使用相同的代码，而无需复制粘贴。这使得维护和更新代码变得更容易，因为更改只需在一个位置进行。\n\
    \n标准 C++ 头文件的一些示例包括 <iostream>，它提供用于读取和写入数据的输入输出流，以及 <string>，它提供用于处理字符串的函数和类。C++\
    \ 标准库中还有许多其他头文件，以及第三方库中提供的头文件，为各种任务提供广泛的功能。\n\n### 翻译单元和链接\n\n在 C++ 中，翻译单元是一个源文件及其包含的所有头文件，以及这些头文件包含的头文件，等等。将翻译单元转换为可执行程序的过程称为编译。\n\
    \n在编译期间，预处理器处理翻译单元中的 #include 指令，将包含头文件的内容插入到源文件中。然后，将生成的展开源文件传递给编译器，将其翻译成目标代码。\n\
    \n目标代码是计算机可执行的程序的机器可读表示。然而，目标代码并不是操作系统可以直接执行的形式。相反，它必须与其他目标代码文件和库结合起来创建可执行程序。此过程称为链接。\n\
    \nC++ 中有两种链接：内部链接和外部链接。\n\n内部链接是指仅在单个翻译单元内可见的符号（变量和函数）。这些符号通常用于不打算从其他翻译单元访问的实现细节。通过使用\
