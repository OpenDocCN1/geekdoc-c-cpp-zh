    \ and an overridden function:\n\n```\nclass Shape\n{\npublic:\n    virtual void\
    \ draw() = 0;\n};\n\nclass Circle : public Shape\n{\npublic:\n    void draw()\
    \ override { std::cout << \"Drawing a circle\" << std::endl; }\n};\n\nint main()\n\
    {\n    Shape *s = new Circle();\n    s->draw();\n    delete s;\n    return 0;\n\
    }\n```\n\nIn this example, the Shape class has a pure virtual member function\
    \ draw that is declared with the virtual specifier and does not have an implementation.\n\
