    \    }\n    return 0;\n}\n```\n\n在此示例中，for 循环用于执行代码块 10 次。循环变量 i 初始化为 0，并在每次迭代前检查条件\
    \ i < 10。如果条件为真，则执行代码块并将循环变量递增 1。这将导致循环执行 10 次，i 的值每次增加 1。该程序的输出将是 0 到 9 的数字，每行一个。\n\
    \nfor 循环是执行特定次数的代码块的有用工具，常在迭代次数已知时使用。重要的是在循环中包含一个最终会使条件变为假的语句，否则循环将成为无限循环。\n\n\
    ## 基于范围的 for 语句\n\n在 C++ 中，基于范围的 for 循环是一种用于遍历范围内元素的迭代语句。基于范围的 for 循环的语法如下：\n\n\
    ```\nfor (range_declaration : range_expression) {\n    // code to be executed\n\
    }\n```\n\nrange_declaration 是为范围中的每个元素声明的变量，而 range_expression 是指定要遍历范围的表达式。\n\
    \n以下是 C++ 中使用基于范围的 for 循环的示例：\n\n```\n#include <iostream>\n#include <vector>\n\
    \nint main() {\n    std::vector<int> numbers = {1, 2, 3, 4, 5};\n    for (int\
    \ number : numbers) {\n        std::cout << number << std::endl;\n    }\n    return\
