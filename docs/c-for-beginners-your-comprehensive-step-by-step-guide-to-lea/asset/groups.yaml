    \nint main() {\n    int x = 5;\n    if (x > 0) {\n        std::cout << \"x is\
    \ positive\" << std::endl;\n    } else {\n        std::cout << \"x is not positive\"\
    \ << std::endl;\n    }\n    return 0;\n}\n```\n\n在此示例中，if 语句用于根据 x 的值执行不同的代码块。如果\
