    \ 运算符只能与具有已定义类型的表达式一起使用。它不能与具有未定义或不完整类型的表达式一起使用，例如未初始化的变量或具有不完整类类型的变量。\n\n例如：\n\
    \n```\nint x;\nstd::cout << \"typeid(x).name() = \" << typeid(x).name() << std::endl;\
