    \ 函数混合使用可能导致未定义行为。\n\n## 按位取反运算符：~\n\n在 C++ 中，~ 运算符是按位取反运算符，用于对整数值执行按位 NOT 操作。它是一个一元运算符，接受一个整数操作数并返回一个整数值，该值是按位\
    \ NOT 操作的结果。\n\n按位取反运算符 ~ 通过翻转其操作数的所有位来否定操作数的值。如果操作数是一个 n 位整数，~ 运算符返回一个 n 位整数，其所有位都被翻转。例如，0000\
    \ 1100（十进制 12）的按位取反是 1111 0011（十进制 243）。\n\n以下是如何在 C++ 中使用按位取反运算符的示例：\n\n```\n\
    #include <iostream>\n\nint main() {\n    int x = 12;\n    int y = ~x;\n\n    std::cout\
    \ << \"x: \" << x << std::endl;\n    std::cout << \"y: \" << y << std::endl;\n\
    \n    return 0;\n}\n```\n\n该程序的输出为：\n\nx: 12\ny: -13\n\n在此示例中，按位取反运算符 ~ 用于否定 x\
    \ 变量的值。~ 操作的结果存储在 y 变量中并打印到控制台。\n\n请注意，按位取反运算符的优先级高于按位与、或和异或运算符 &、| 和 ^，因此它通常在这些运算符之前求值。例如，表达式\
    \ ~x & y 等价于 (~x) & y，而表达式 x | ~y 等价于 x | (~y)。\n\n## 指向成员的运算符：.* 和 ->*\n\n在 C++\
