  mdcn: "\n\nclasses.\n\n如果一个类型满足以下条件，则认为该类型是标准布局类型：\n\n- 它是一个平凡类型。\n- 它没有非静态数据成员是非标准布局类类型（或此类类型的数组）。\n\
