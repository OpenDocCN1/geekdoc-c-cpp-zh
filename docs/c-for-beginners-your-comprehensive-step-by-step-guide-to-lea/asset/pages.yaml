    # General rules for operator overloading


    In C++, there are a few general rules to follow when overloading operators:


    +   1. Overload operators only for types that make sense. For example, it does
    not make sense to overload the + operator for a type that represents a database
    connection.

    2. Overload operators in a way that is consistent with their standard behavior.
    For example, if you overload the + operator for a type that represents a complex
    number, it should add the real and imaginary parts of the numbers.

    3. Avoid overloading operators that change the fundamental behavior of the operator.
    For example, it is generally not a good idea to overload the = operator to perform
    some other operation, as this can be confusing for users of your code.

    4. Use the const keyword appropriately when overloading operators. This will allow
    you to use the overloaded operator on const objects and prevent users from modifying
    the object accidentally.

    5. Be aware of the precedence and associativity of the operators you are overloading.
    This will ensure that your overloaded operators behave as expected when used in
    expressions with other operators.


    By following these general rules, you can ensure that your operator overloading
    is clear, intuitive, and consistent with the standard behavior of the operators.
    This will make your code easier to understand and maintain.


    # Overloading unary operators


    In C++, you can overload unary operators (operators that take a single operand)
    by defining member functions or non-member functions with the appropriate names.'
