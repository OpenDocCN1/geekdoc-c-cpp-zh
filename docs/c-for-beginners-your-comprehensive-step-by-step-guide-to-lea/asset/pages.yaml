  md: "# Multiplicative operators and the modulus operator\n\nIn C++, the *, /, and\
    \ % operators are the multiplicative operators and the modulus operator, respectively,\
    \ which are used to perform multiplication, division, and modulus operations on\
    \ integer and floating-point values. They are binary operators that take two operands\
    \ and return a value that is the result of the multiplication, division, or modulus\
    \ operation.\n\nThe * operator is the multiplication operator, which multiplies\
    \ its operands and returns the product. The / operator is the division operator,\
    \ which divides its first operand by its second operand and returns the quotient.\
    \ The % operator is the modulus operator, which returns the remainder of the division\
    \ of its first operand by its second operand.\n\nHere is an example of how to\
    \ use the multiplicative operators and the modulus operator in C++:\n\n```\n#include\
    \ <iostream>\n\nint main() {\n    int x = 10;\n    int y = 3;\n    double z =\
    \ 5.5;\n\n    std::cout << \"x * y = \" << (x * y) << std::endl;\n    std::cout\
    \ << \"x / y = \" << (x / y) << std::endl;\n    std::cout << \"x % y = \" << (x\
    \ % y) << std::endl;\n    std::cout << \"x * z = \" << (x * z) << std::endl;\n\
    \    std::cout << \"x / z = \" << (x / z) << std::endl;\n    std::cout << \"z\
    \ / x = \" << (z / x) << std::endl;\n\n    return 0;\n}\n```\n\nThe output of\
    \ this program will be:\n\nx * y = 30\nx / y = 3\nx % y = 1\nx * z = 55\nx / z\
    \ = 1.81818\nz / x = 0.55\n\nIn this example, the multiplicative operators *,\
