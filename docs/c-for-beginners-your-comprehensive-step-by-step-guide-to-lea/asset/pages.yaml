    \ parts of a program.\n\nThere are four storage classes in C++:\n\n+   1. auto\
    \ : This is the default storage class for local variables. It specifies that the\
    \ variable is created and destroyed automatically when it goes out of scope.\n\
    2. static : This storage class specifies that the variable or function has a fixed\
    \ memory location and a lifetime that spans the entire duration of the program.\
    \ It is often used to create variables that retain their value between function\
    \ calls.\n3. register : This storage class specifies that the variable should\
