  md: '# Chapter V


    # Built-in operators, precedence, and association


    In C++, operators are special symbols that perform specific operations on one,
    two, or three operands, and produce a result. Operators can be classified as unary,
    binary, or ternary based on the number of operands they require.


    C++ has a set of built-in operators that are predefined by the language and are
    available for use in any program. These operators can be grouped into the following
    categories:


    +   1. Arithmetic operators: These operators perform arithmetic calculations on
    operands, such as addition, subtraction, multiplication, and division.

    2. Comparison operators: These operators compare two operands and return a Boolean
    value indicating whether the comparison is true or false.

    3. Logical operators: These operators perform logical operations on operands,
    such as AND, OR, and NOT.

    4. Bitwise operators: These operators perform bitwise operations on operands,
    such as AND, OR, XOR, and NOT.

    5. Assignment operators: These operators assign a value to a variable.

    6. Increment and decrement operators: These operators increase or decrease the
    value of a variable by 1.

    7. Conditional operator: This operator selects one of two operands based on a
    Boolean condition.


    Operators have a precedence, which determines the order in which they are evaluated
    in an expression. Operators with higher precedence are evaluated before operators
    with lower precedence.


    Operators also have an associativity, which determines the order in which they
    are evaluated when they have the same precedence. Operators with left-to-right
    associativity are evaluated from left to right, whereas operators with right-to-left
    associativity are evaluated from right to left.


