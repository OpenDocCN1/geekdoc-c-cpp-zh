    # Pimpl idiom for compile-time encapsulation


    In C++, the Pointer to IMPLEmentation (Pimpl) idiom is a design pattern that is
    used to achieve compile-time encapsulation of implementation details. It is used
    to hide the implementation details of a class from the public interface, while
    still allowing the class to be used in a type-safe manner.


    The basic idea of the Pimpl idiom is to define the public interface of a class
    in a header file, and to define the implementation details in a separate source
    file. The implementation details are accessed through a pointer to a forward-declared
    class that is defined in the implementation file.


    # Portability at ABI boundaries


    In C++, the Application Binary Interface (ABI) defines the conventions and rules
    for the interaction between different software components at the binary level.
    It specifies how data is laid out in memory, how function calls and returns are
    made, and other low-level details that are necessary for different software components
    to interoperate.


    When writing portable C++ code, it is important to consider the ABI at the boundaries
    between different software components, such as libraries, executables, and shared
    objects. Different compilers and platforms may have different ABIs, and it is
    important to ensure that your code is compatible with the ABIs of the platforms
    you are targeting.


    There are several ways to ensure portability at ABI boundaries in C++:


    +   1. Use a stable ABI: Some platforms, such as Linux and Windows, have stable
    ABIs that are supported by multiple compilers. By using a stable ABI, you can
    ensure that your code is compatible with different compilers and platforms.

    2. Use a cross-platform ABI: There are several cross-platform ABIs available,
    such as the Itanium C++ ABI, that are supported by multiple compilers on different
    platforms. By using a cross-platform ABI, you can ensure that your code is portable
    across different platforms.

    3. Use a versioning system: Some systems, such as the ELF versioning system on
    Linux, allow you to specify different versions of your code'
