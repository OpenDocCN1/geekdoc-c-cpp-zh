    \ of the program by reducing access time to the variable. However, it is not guaranteed\
    \ that the variable will actually be stored in a register, and the number of registers\
    \ available is often limited.\n4. extern : This storage class specifies that the\
    \ variable or function is defined in another translation unit and is being declared\
    \ in the current translation unit. It is often used to share variables and functions\
