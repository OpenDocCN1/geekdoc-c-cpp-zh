  md: "# Chapter Eleven\n\n# Operator overloading\n\nIn C++, operator overloading\
    \ is a feature that allows you to redefine the behavior of operators for user-defined\
    \ types. This can be useful for making your code more readable and intuitive by\
    \ allowing you to use operators like +, -, *, and / with your own types.\n\nHere\
    \ is an example of operator overloading in C++:\n\n```\nclass Vector2\n{\npublic:\n\
    \    Vector2(float x, float y) : x_(x), y_(y) {}\n\n    Vector2 operator+(const\
    \ Vector2& other) const\n    {\n        return Vector2(x_ + other.x_, y_ + other.y_);\n\
    \    }\n\n    Vector2 operator-(const Vector2& other) const\n    {\n        return\
    \ Vector2(x_ - other.x_, y_ - other.y_);\n    }\n\n    Vector2 operator*(float\
    \ scalar) const\n    {\n        return Vector2(x_ * scalar, y_ * scalar);\n  \
    \  }\n\nprivate:\n    float x_;\n    float y_;\n};\n```\n\nIn this example, the\
    \ Vector2 class has three overloaded operators: +, -, and *. These operators allow\
    \ you to add, subtract, and multiply Vector2 objects using the familiar +, -,\
    \ and * operators.\n\nTo use these overloaded operators, you can use the normal\
    \ operator syntax:\n\n```\nVector2 v1(1, 2);\nVector2 v2(3, 4);\n\nVector2 v3\
    \ = v1 + v2;  // v3 is now (4, 6)\nVector2 v4 = v1 - v2;  // v4 is now (-2, -2)\n\
    Vector2 v5 = v1 * 2;  // v5 is now (2, 4)\n```"
