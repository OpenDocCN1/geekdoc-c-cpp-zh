    # Assignment


    In C++, the assignment operator ( = ) is used to assign a value to a variable.


    Here is an example of using the assignment operator in C++:


    ```

    int a = 3;  // Initialize a to 3

    a = 4;  // Assign a new value to a

    ```


    In the first line, the = operator is used to initialize the variable a to the
    value 3. In the second line, the = operator is used to assign a new value to a,
    overwriting the previous value.


    You can also use the assignment operator to chain assignments, like this:


    ```

    int a, b, c;

    a = b = c = 0;  // Assign 0 to a, b, and c

    ```


    In this example, the assignment operator is used to assign the value 0 to all
    three variables in a single line of code.


    You can also use the assignment operator to assign the value of an expression
    to a variable, like this:


    ```

    int a = 3;

    int b = 4;

    int c = a + b;  // c is now 7

    ```


    In this example, the = operator is used to assign the result of the expression
    a + b (which is 7) to the variable c.


    The assignment operator is an important part of C++ and is used extensively in
    most programs. It allows you to assign values to variables and modify their values
    as needed.'
