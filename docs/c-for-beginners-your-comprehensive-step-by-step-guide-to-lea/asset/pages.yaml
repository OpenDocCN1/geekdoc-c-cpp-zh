    # basic concepts


    # C++ type system


    In C++, data is stored and manipulated using various data types. These data types
    determine the size and layout of memory used by the variables, as well as the
    set of operations that can be performed on them.


    C++ has a rich type system that includes both built-in types and user-defined
    types.


    Built-in types include:


    +   - Integer types: These represent whole numbers and include `char`, `short`,
    `int`, `long`, and `long long`. Each of these types has a different size, with
    `char` being the smallest and `long long` being the largest.

    - Floating-point types: These represent numbers with fractional parts and include
    `float`, `double`, and `long double`. These types also have different sizes, with
    `float` being the smallest and `long double` being the largest.

    - Boolean type: This represents a true/false value and is represented by the `bool`
    type.

    - Character types: These represent individual characters and include `char` and
    `wchar_t`. `char` is used for ASCII characters and `wchar_t` is used for wide
    characters, which can represent characters from a variety of different alphabets.


    User-defined types in C++ include:


    +   - Classes: A class is a user-defined data type that allows you to define your
    own data fields and methods.

    - Structures: A structure is similar to a class, but the data fields and methods
    are public by default.

    - Enumerations: An enumeration is a user-defined type that consists of a set of
    named constants.

    - Typedef: The `typedef` keyword allows you to define a new name for an existing
    data type. This can be used to create more readable or expressive names for complex
    types.


    C++ also supports type casting, which allows you to convert a value from one data
    type to another. This can be useful when working with different data types that
    need to be used together, but care must be taken when using type'
