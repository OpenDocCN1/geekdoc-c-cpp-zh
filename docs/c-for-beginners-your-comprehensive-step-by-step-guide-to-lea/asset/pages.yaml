    # Scope


    In C++, the scope of a variable refers to the part of the program in which the
    variable is visible or can be accessed. A variable''s scope is determined by the
    location of its declaration in the program.


    There are two main types of scope in C++: local scope and global scope.


    A local variable is one that is declared within a function or block of code. Local
    variables are only visible within the function or block in which they are declared,
    and they are only accessible from the point of their declaration to the end of
    the block. When the function or block ends, the local variable is destroyed and
    is no longer accessible.


    A global variable is one that is declared outside of any function or block of
    code. Global variables are visible throughout the entire program and can be accessed
    from any function or block of code. However, it is generally considered good programming
    practice to minimize the use of global variables, as they can make the program
    more difficult to understand and maintain.


    C++ also supports nested scopes, where a block of code is defined within another
    block of code. In this case, variables declared in the inner block are only visible
    within that block, but they may also be accessed from the outer block.


    The scope of a variable is an important concept in C++, as it determines the visibility
    and accessibility of the variable within the program. Understanding the scope
    of variables is essential for writing efficient and maintainable code.


    # Header files


    In C++, a header file is a file that contains declarations of functions, variables,
    and other constructs that can be used in a C++ program. Header files are typically
    denoted by the .h suffix and are included in a C++ source file using the #include
    directive.'
