    # Transfers of control


    In C++, transfers of control are used to change the flow of execution in a program.
    There are several types of transfers of control in C++, including:


    +   - **Conditional statements**: Conditional statements are used to execute a
    block of code conditionally based on the value of a boolean expression. The if
    statement is used to execute a block of code if a condition is true, and the if-else
    statement is used to execute one block of code if a condition is true and another
    block of code if the condition is false.


    +   - **Iteration statements**: Iteration statements are used to execute a block
    of code repeatedly. The while loop is used to execute a block of code while a
    condition is true, the do-while loop is used to execute a block of code at least
    once and then repeatedly while a condition is true, and the for loop is used to
    execute a block of code a specific number of times.


    +   - **Jump statements**: Jump statements are used to transfer control to a different
    point in the program. The break statement is used to terminate a loop or switch
    statement and transfer control to the next statement following the loop or switch,
    the continue statement is used to skip the remainder of the current iteration
    of a loop and transfer control to the next iteration, the goto statement is used
    to transfer control to a labeled statement in the same function, and the return
    statement is used to terminate a function and return a value to the calling function.


    +   - **Exception handling**: Exception handling is used to handle errors or exceptional
    circumstances that may occur during the execution of a program. The try statement
    is used to enclose a block of code that may throw an exception, the throw statement
    is used to throw an exception, and the catch statement is used to handle an exception
