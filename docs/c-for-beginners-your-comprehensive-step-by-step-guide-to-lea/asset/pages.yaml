    \ header and is derived from the exception class. It can be caught using a try\
    \ - catch block, like any other exception:\n\n```\n#include <iostream>\n#include\
    \ <stdexcept>\n\nint main() {\n    try {\n        Shape *shape = nullptr;\n  \
    \      std::cout << \"Type of shape: \" << typeid(*shape).name() << std::endl;\n\
    \    } catch (std::bad_typeid& e) {\n        std::cout << \"Error: \" << e.what()\
    \ << std::endl;\n    }\n    return 0;\n}\n```\n\nIn this example, the typeid operator\
    \ is used on a null pointer, which has a deleted type. This will cause the bad_typeid\
    \ exception to be thrown, which will be caught in the catch block and the error\
