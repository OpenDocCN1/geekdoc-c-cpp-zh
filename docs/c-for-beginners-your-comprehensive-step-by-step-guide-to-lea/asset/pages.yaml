  md: "# the fourth chapter\n\n# Declarations and definitions\n\nIn C++, declarations\
    \ and definitions are two different concepts that refer to the way in which variables,\
    \ functions, and other entities are introduced and used in a program.\n\nA declaration\
    \ is a statement that introduces an entity and specifies its type, name, and other\
    \ attributes. It does not allocate any memory or execute any code. A declaration\
    \ can be made using the extern keyword, which indicates that the entity is defined\
    \ in another translation unit.\n\nA definition is a statement that creates an\
    \ entity by allocating memory and executing code. It must include a declaration,\
    \ and it can also include additional details such as an initial value or a function\
    \ body. A definition must be made in only one translation unit, but it can be\
    \ declared in multiple translation units using the extern keyword.\n\nHere is\
    \ an example of a declaration and definition in C++:\n\n```\n// Declare a global\
    \ variable\nextern int x;\n\nint main() {\n    // Define a local variable\n  \
