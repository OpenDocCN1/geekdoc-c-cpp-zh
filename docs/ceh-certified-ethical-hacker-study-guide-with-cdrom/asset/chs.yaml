  \ 练习 9-2 使用 `Metasploit` 执行缓冲区溢出攻击\n- 练习 10-1 安装并使用 WLAN 嗅探工具\n- 练习 10-2 MAC 地址欺骗\n\
  - 练习 11-1 查看关于开锁的视频\n- 练习 12-2 审计您组织的物理场所安全\n- 练习 12-1 配置并编译内核\n- 练习 12-2 使用 Live\
  \ CD\n- 练习 12-3 检测监听的网络端口\n- 练习 13-1 安装并使用 `KFSensor` 作为蜜蜜罐\n- 练习 14-1 查看数字证书\n\
  - 练习 14-2 使用 `WinMD5` 计算文件哈希\n- 练习 15-1 查看渗透测试工具框架\n- 练习 15-2 查看渗透测试报告框架示例\n\n#\
  \ 引言\n\n认证道德黑客（`CEH`）考试由国际电子商务顾问委员会（`EC-Council`）开发，旨在提供一种全范围内认可的方法来认证安全专业人员的能力。`CEH`\
  \ 认证授予那些已获得对系统和网络进行安全审计和渗透测试所需的知识水平和安全技能的人。\n\n`CEH` 考试定期更新，以确保认证适用于最新的黑客工具和漏洞。这是非常有必要的，因为\
  \ `CEH` 必须熟悉最新的攻击和利用手段。截至本文编写时，考试的最新版本为第 6 版。第 6 版考试目标已反映在书中。\n\n# 什么是 CEH 认证？\n\
  \n创建 `CEH` 认证的目的是提供一种广泛的认证，其意义在于它旨在认证对许多不同制造商/供应商的能力。该认证专为安全官、审计师、安全专业人员、站点管理员以及任何每天处理网络基础设施安全的人员设计。\n\
  \n道德黑客的目标是通过攻击系统本身来帮助组织采取预防措施，同时保持在法律范围内。这种哲学源于通过像小偷一样思考来抓住小偷的成熟实践。\n\n道德黑客的定义类似于渗透测试。道德黑客通常受雇于组织，并信任可以使用黑客的方法尝试渗透网络和或计算机系统。在美国和其他大多数国家，黑客行为是犯罪。\n\
  \n你只需要通过一次考试即可成为 CEH。但获得此认证并不意味着你可以提供服务——这只是第一步。通过获得 `CEH` 认证，你将能够获得更多经验，建立对网络的兴趣，并随后追求深层次的网络知识和认证。\n\
  \n有关最新的考试价格和注册程序更新，请拨打 Thomson Prometric （866-776-6387 或 800-776-4276），或 Pearson\
  \ VUE（877-680-3926）。你也可以访问 [www.2test.com](http://www.2test.com) 或 [www.prometric.com](http://www.prometric.com）（针对\
  \ Thomson Prometric）或 [www.vue.com](http://www.vue.com）（针对 Pearson VUE）获取更多信息或在线注册。如果你对考试范围或相关的\
  \ EC-Council 计划有进一步的问题，请参考 EC-Council 网站 [www.eccouncil.org](http://www.eccouncil.org)。\n\
  \n# 谁应该购买这本书？\n\n《认证道德黑客学习指南》旨在为经验丰富的安全专业人员提供学习工具，帮助他们获取通过认证考试所需的信息。本学习指南可以与更完整的学习计划、计算机培训课程件或教室/实验室环境结合使用，也可以作为那些希望在考试前进行复习的人的复习工具。我们的目标不是给出答案，而是识别出你可能被测试的主题。\n\
  \n\n\n\n\n如果你想成为一名 CEH（认证伦理黑客），这本书绝对是你需要的。然而，如果你只是想尝试通过考试而不真正理解伦理黑客的基础知识，那么本指南并不适合你。它是为那些想要建立通过考试所需的技能和知识基础，并将其所学知识应用于现实世界的人而编写的。\n\
  \n# 如何使用本书和光盘\n\n我们在书中和 CD 光盘中包含了多项测试功能。这些工具将帮助你记住重要的考试内容，并为参加实际做好准备：\n\n- **章节复习题**：为了在阅读书籍的过程中测试你的知识，每章的末尾都有复习题。当你完成每一章后，回答复习题并检查你的答案——正确答案出现在最后一个复习题后的页面。你可以回去重新阅读你错题涉及的章节，以确保在下次测试这些材料时能正确回答。\n\
  - **电子闪卡**：你会在 CD 上找到闪卡问题，以便你随时随地复习。这些是简短的问答，就像你可能在学校学习时使用的闪卡一样。你可以在电脑上回答它们，或将其下载到\
  \ Palm 设备上进行快速方便的复习。\n- **测试引擎**：CD 中还包含 `Sybex Test Engine`。使用这个自定义的测试引擎，你可以预先识别薄弱环节，然后利用这些强大的测试功能制定出稳固的学习策略。我们详尽的\
  \ `readme` 文件将引导你完成快速、简单的安装过程。\n\n除了做章节复习题外，你还会找到模拟题。参加这些模拟考试时，就像参加实际考试一样（不携带任何参考资料）。完成第一场考试后，进入下一场以巩固你的应试技巧。如果你回答正确率超过\
  \ 90%，你就可以准备好参加认证考试了。\n\n**PDF 版可搜索书籍**：CD 包含 `PDF`（`Adobe Acrobat`）格式的整本书，因此你可以轻松地在任何电脑上阅读。如果你必须旅行并温习任何关键术语，且有一台带有\
  \ `CD-ROM` 驱动器的笔记本电脑，你可以通过此资源来实现。\n\n# 参加 CEH 考试提示\n\n以下是成功考试的一些通用建议：\n\n- 随身携带两种身份证件。其中一种必须是照片身份证，例如驾驶执照。另一种可以是主信用卡或护照。两种形式都必须包含签名。\n\
  - 早点到达考试中心，以便你可以放松并复习学习材料，特别是与考试信息相关的表格和列表。\n- 仔细阅读问题。不要受到过早下结论的诱惑。确保你确切知道问题要求的是什么。\n\
  - 不要留有任何未回答的问题。未回答的问题会按对你不利的标准评分（扣分）。\n- 将会有有多个正确答案的问题。当有多个一个正确答案时，屏幕底部的消息将提示你“选择两个项”或“选择所有适用项”。务必阅读显示的消息以知道你必须选择多少个正确答案。\n\
  - 在回答你不确定的单选题时，使用排除法先排除掉明显错误的答案。这样做在你需要进行有推测的猜测时，会增加你的胜算几率。\n- 有关考试的最新价格和注册程序的更新，请访问\
  \ EC-Council 网站：[www.eccouncil.org](http://www.eccouncil.org)。\n\n# CEH 考试目标\n\n\
  在本书每一章的开头，我们包含了在 EC-Council 网站上显示的完整 CEH 目标列表。提供这些内容是为了方便参考，并确保你正按照目标进行。\n\n![note.eps](img/note_fmt.gif)\n\
  \n考试目标可能会在任何时间无需事先通知而更改，并由 EC-Council 完全决定。请访问 EC-Council 网站的 CEH 认证页面（`www.eccouncil.org/certification/certified_ethical_hacker.aspx`）获取最新的考试目标列表。\n\
  \n## 伦理与法律\n\n- 理解伦理黑客术语。\n- 定义伦理黑客的职业角色。\n- 理解伦理黑客涉及的不同阶段。\n- 识别不同类型的攻击技术。\n- 列出伦理黑客的五个阶段。\n\
  - 什么是黑客主义（hacktivism）？\n- 列出不同类型的黑客分类。\n- 定义成为伦理黑客所需的技能。\n- 什么是漏洞研究？\n- 描述实施伦理黑客的方法。\n\
  - 理解黑客行为的法律影响。\n- 理解 `18 U.S.C. § 1030` 美国联邦法。\n\n## 足迹探测（Footprinting）\n\n- 定义足迹探测（footprinting）术。\n\
  - 描述信息收集方法。\n- 描述竞争情报。\n- 理解 `DNS` 枚举。\n- 理解 `Whois`、`ARIN` 查询。\n- 识别不同类型的 `DNS`\
  \ 记录。\n- 理解 `traceroute` 如何在足迹探测中应用。\n- 理解电子邮件跟踪如何工作。\n- 理解网络爬虫如何工作。\n\n## 扫描（Scanning）\n\
  \n- 定义端口扫描（port scanning）、网络扫描（network scanning）和漏洞扫描（vulnerability scanning）等术语。\n\
  - 理解 CEH 扫描方法论。\n- 理解 ping 扫描（ping sweep）技术。\n- 理解 `nmap` 命令开关。\n- 理解 `SYN`、`stealth`、`XMAS`、`NULL`、`IDLE`\
  \ 和 `FIN` 扫描。\n- 列出 `TCP` 通信标志类型。\n- 理解战争号技术（war dialing）。\n- 理解 抓取（banner grabbing）和\
  \ `OF` 指纹识别技术。\n- 理解如何使用代理服务器。\n- 理解匿名匿名工具如何工作。\n- 理解 HTTP 隧道（HTTP tunneling）技术。\n\
  - 理解 IP 欺骗（IP spoofing）技术。\n\n## 枚举（Enumeration）\n\n- 什么是枚举？\n- 什么是空会（null sessions）？\n\
  - 什么是 SNMP 枚举？\n- 枚举涉及的步骤有哪些？\n\n## 系统攻击（System Hacking）\n\n- 理解密码破解。\n- 理解不同类型的密码。\n\
  - 识别各种破解工具。\n- 理解权限提升。\n- 理解键盘记录器（keyloggers）和其他间谍软件。\n- 理解如何隐藏文件。\n- 理解根内核（rootkits）。\n\
  - 理解隐写术（steganography）。\n- 理解如何隐藏踪迹并抹除证据。\n\n## 木马与后门（Trojans and Backdoors）\n\n\
  - 什么是木马？\n- 什么是公开通道和秘密通道？\n- 列出不同类型的木马。\n- 木马攻击的迹有哪些？\n- 理解 Netcat 木马如何工作。\n- 什么是封装（wrapping）？\n\
  - 反向连接木马如何工作？\n- 防止木马的防御措施有哪些？\n- 理解规避技术。\n\n## 嗅探器（Sniffers）\n\n- 理解受嗅探影响的协议。\n\
  - 理解主动嗅探和被动嗅探。\n- 理解 ARP 毒（ARP poisoning）。\n- 理解 ethereal 捕获和显示过滤器。\n- 理解 MAC 泛洪。\n\
  - 理解 DNS 欺骗技术。\n- 描述嗅探防御措施。\n\n## 拒绝服务（Denial of Service）\n\n- 理解 DoS 攻击的类型。\n-\
  \ 理解 DDoS 攻击如何工作。\n- 理解 Bot/僵尸网络如何工作。\n- 什么是 Smurf 攻击？\n- 什么是 SYN 洪水？\n- 描述 DoS/DDoS\
  \ 防御措施。\n\n## 社会工程（Social Engineering）\n\n- 什么是社会工程？\n- 常见的攻击类型有哪些？\n- 理解翻垃圾搜索。\n\
  - 理解反向社会工程。\n- 理解内部攻击。\n- 理解身份盗取。\n- 描述网络钓鱼攻击。\n- 理解 URL 混淆。\n- 社会工程防御措施。\n\n##\
  \ 会话劫持（Session Hijacking）\n\n- 理解欺骗与劫持。\n- 列会话劫持的类型。\n- 理解序列预测（sequence prediction）。\n\
  - 执行会话劫持的步骤有哪些？\n- 描述你会如何防止会话劫持。\n\n### 攻击 Web 服务器\n\n\n\n\n\n# 学习目标\n\n* 列出 Web\
  \ 服务器漏洞的类型。\n* 理解针对 Web 服务器的攻击。\n* 理解 `IIS` Unicode 漏洞利用。\n* 理解补丁管理技术。\n* 理解 Web\
  \ 应用扫描器（Web Application Scanner）。\n* 什么是 `Metasploit Framework`？\n* 描述 Web 服务器的加固方法。\n\
  \n## Web 应用漏洞\n\n* 理解 Web 应用程序的工作原理。\n* Web 应用程序攻击的目标。\n* 攻击的剖析。\n* Web 应用程序威胁。\n\
  * 理解 Google 黑客攻击（Google hacking）。\n* 理解 Web 应用程序防御措施。\n\n### 基于 Web 的密码破解技术\n\n\
  * 列出身份验证类型。\n* 什么是密码破解器？\n* 密码破解器是如何工作的？\n* 理解密码攻击——分类。\n* 理解密码破解的防御措施。\n\n### SQL\
  \ 注入\n\n* 什么是 SQL 注入？\n* 理解执行 SQL 注入的步骤。\n* 理解 `SQL Server` 漏洞。\n* 描述 SQL 注入的防御措施。\n\
  \n### 无线攻击\n\n* `WEP`、`WPA` 认证系统及破解技术的概述。\n* 无线嗅探器及 `SSID`、`MAC` 欺骗的概述。\n* 理解非法访问点（Rogue\
  \ access points）。\n* 理解无线攻击技术。\n* 描述保护无线网络的方法。\n\n## 病毒与蠕虫\n\n* 理解病毒和蠕虫的区别。\n* 理解病毒的类型。\n\
  * 病毒如何传播并感染系统。\n* 理解防病毒规避技术。\n* 理解病毒检测方法。\n\n## 物理安全\n\n* 物理安全入侵事件。\n* 理解物理安全。\n\
  * 为什么需要物理安全？\n* 谁负责物理安全？\n* 影响物理安全的因素。\n\n## Linux 攻击\n\n* 理解如何编译 Linux 内核。\n* 理解\
  \ `GCC` 编译命令。\n* 理解如何安装 `LKM` 模块。\n* 理解 Linux 加固方法。\n\n## 规避 IDS、蜜罐和防火墙\n\n* 列入侵检测系统的类型及规避技术。\n\
  * 列出防火墙和蜜罐规避技术。\n\n### 缓冲区溢出\n\n* 基于栈的缓冲区溢出概述。\n* 识别不同类型的缓冲区溢出及检测方法。\n* 缓冲区溢出变异技术概述。\n\
  \n## 密码学\n\n* 密码学和加密技术的概述。\n* 描述公钥和私钥如何生成。\n* `MD5`、`SHA`、`RC4`、`RC5`、`Blowfish`\
  \ 算法概述。\n\n## 渗透测试方法\n\n* 渗透测试方法的概述。\n* 列渗透测试步骤。\n* `Pen-Test` 法律框架概述。\n* `Pen-Test`\
