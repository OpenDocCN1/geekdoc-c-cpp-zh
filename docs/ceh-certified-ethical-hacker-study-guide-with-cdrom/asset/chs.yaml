  \ routes`\n\n## 17. 保护 Linux root 账户的推荐方法是什么？（选择所有适用项。）\nA. 禁止除系统控制台以外的直接 root 登录。\n\
  B. 将 `su` 的使用限制单个组。\nC. 安装 `su protect` 以防止误用 `su` 命令。\nD. 为任何需要安装程序的用户授予管理员权限。\n\
