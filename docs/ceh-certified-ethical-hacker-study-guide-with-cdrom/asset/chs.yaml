  \n\n\n\n### 14. 你将如何破解一个基于 cookie 安全的系统？\n\nA. 将 `cookie ID` 注入网页 URL 中并连接回服务器。\n\
  B. 对 cookie 使用的加密算法进行暴力破解，并将其重放给服务器。\nC. 拦截客户端与服务器之间的通信并修改 cookie，使服务器认为存在一个具有更高权限的用户。\n\
  D. 删除 cookie，重新建立与服务器的连接，并访问高级别的权限。\n\n### 15. Windows 在开箱即用（未经过配置）时极度不安全；在使用它之前，你必须执行以下哪些操作？（选择所有适用项）\n\
  \nA. 确保新安装的 Windows 通过安装最新的服务包（service packs）进行补丁。\nB. 为 Adobe Acrobat、Macromedia\
  \ Flash、Java 和 WinZip 等应用程序安装最新的安全补丁。\nC. 安装个人防火墙并锁定未使用的端口防止其连接到你的计算机。\nD. 为病毒毒软件安装最新的特征码。\n\
  E. 创建一个具有复杂密码的非管理员用户并登录此账户。\nF. 你可以开始使用你的电脑了，因为戴尔（Dell）、惠尔-惠普（Hewlett-Packard）和\
  \ IBM（IBM）等供应商已经安装了最新的服务包。\n\n### 16. 以下哪项是补丁管理和安全工具？\n\nA. MBSA\nB. BSSA\nC. ASNB\n\
  D. PMUS\n\n### 17. 如何保护网页表单中的 GET 方法？\n\nA. 在使用 `GET` 方法发送数据之前对数据进行加密。\nB. 永远不要在脚本包含包含信息。\n\
  C. 使用 `HTTPS SSLv3` 发送数据而不是普通的 HTTPS。\nD. 在发送数据时将 `GET` 替换为 `POST` 方法。\n\n### 18.\
  \ 缓冲区溢出的两种类型是什么？\n\nA. 基于栈的缓冲区溢出\nB. 活跃缓冲区溢出\nC. 动态缓冲区溢出\nD. 基于堆的缓冲区溢出\n\n### 19.\
  \ 多态代码（polymorphic shellcode）是如何工作的？\n\nA. 它通过掩码 IDS 特征将工作指令反转为相反顺序。\nB. 它将代码 转换为\
  \ Unicode，使用加载器（loader）转换回机器码，然后执行该代码。\nC. 它通过对代码进行 XOR 异或运算加密代码，使用加载器代码解密，然后执行解密后的代码。\n\
  D. 它将代码压缩为普通指令，使用加载器代码解压代码，然后执行该代码。\n\n### 20. 密码在 Linux 中存储在哪里？\n\nA. `/etc/shadow`\n\
  B. `/etc/passwd`\nC. `/bin/password`\nD. `/bin/shadow`\n\n### 21. 以下哪项是 IDS 绕过技术？\n\
  \nA. IP 路由或数据包丢\nB. IP 分段或会话拼接\nC. IDS 欺骗或会话组装\nD. IP 拼接或数据包重组\n\n### 22. 正或错：数字签名仅仅是使用公密钥而不是私钥加密的消息。\n\
  \nA. 正确\nB. 错误\n\n### 23. 每家公司都需要以下哪些文档？\n\nA. 信息安全策略 (ISP)\nB. 信息审计策略 (IAP)\nC.\
  \ 渗透测试策略 (PTP)\nD. 用户合规策略 (UCP)\n\n### 24. 黑客工具 Netcat 是做什么的？\n\nA. `Netcat` 是一个灵活的数据嗅器/记录器，用于检测攻击。`Netcat`\
  \ 是一个基于数据包捕获 (`libpcap`) 的嗅器/记录器，可以作为轻量级入侵检测系统。\nB. `Netcat` 是一个强大的网络监控和数据采集工具。该程序允许你转储匹配给定表达式的网络流量。\n\
  C. `Netcat` 被称为 TCP/IP 的瑞士军刀。它是一个简单的实用，使用 TCP 或 UDP 协议跨网络连接读取和写入数据。\nD. `Netcat`\
  \ 是基于 SATAN（安全集成网络工具）的安全评估工具。\n\n### 25. 哪个工具是文件和目录检查器，可以帮助系统管理员和用户监控指定一组文件的任何更改？\n\
  \nA. `Hping2`\nB. `DSniff`\nC. `Cybercop`\nD. `Tripwire`\n\n### 26. 以下哪一个 Nmap 命令会对\
  \ `target.example.com` 所在的 C 类地址中的每台机器启动 SYN 扫描，并尝试确定每个正在运行的主机运行的是什么操作系统？\n\n```\n\
  nmap -v target.example.com\n```\n```\nnmap -sS -O target.example.com/24\n```\n```\n\
