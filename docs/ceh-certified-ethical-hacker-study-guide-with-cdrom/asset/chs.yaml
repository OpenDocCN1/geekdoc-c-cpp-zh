  20. C. Linux 系统中的密码存储在 shadow 文件。\n\n# 第 13 章 绕过网络安全：规避 IDS、蜜罐和防火墙\n\n## 本章涵盖 CEH\
  \ 目标\n* 列出入侵检测系统的类型和规避技术\n* 列出防火墙类型和蜜罐规避技术\n\n入侵检测系统 (IDS)、防火墙和蜜罐都是用于确保黑客无法访问网络或系统的安全措施。IDS\
  \ 和防火墙都是数据包过滤设备，并根据预定义的规则监控流量。蜜罐是一个虚假的目标系统，用于引诱黑客离开价值目标。与其它安全机制一样，IDS、防火墙和蜜罐的性能取决于其设计和实现。熟悉这些设备的工作原理非常重要，因为它们是常见的攻击目标。\n\
  \n## IDS 类型及规避技术\n入侵检测系统 (IDS) 检查流量并寻找已知攻击签名或异常行为模式。包嗅探器查看并监控流量，是 IDS 的内置组件。当公司的安全事件列表触发事件时，IDS\
  \ 通过传真、电子邮件或手机提醒命令中心或系统管理员。入侵预防系统 (IPS) 在检测到可疑流量时启动应对措施，如拦截流量。IPS 自动对入侵做出响应，并允许自动化拒绝访问的功能。\n\
  \nIDS 主要有两种类型：\n\n### 基于主机\n基于主机的 IDS (HIDS) 是位于单个主机上的应用程序，根据特定操作系统的已知签名列表过滤流量或事件。HIDS\
  \ 包括 Norton Internet Security 和 Cisco Security Agent。许多虫和木马可以关闭 HIDS。HIDS 也可以直接安装在服务器上，以检测针对企业资源和应用程序的攻击。\n\
  \n### 基于网络\n基于网络的 IDS (NIDS) 是位于网络软件设备。它们专门用于入侵检测，以检测传统防火墙无法检测的所有类型的恶意网络流量和计算机使用。这包括针对有漏洞服务的网络攻击；针对应用程序的数据攻击；基于主机的攻击（如权限提升、未经授权的登录和访问敏感文件）；以及恶意软件。NIDS\
  \ 是被动系统：IDS 传感器检测到潜在的安全违规，记录信息并在控制台上发出警报。\n\n\n\n\n网络入侵检测系统（IDS）在网络架构中的位置如图图 13-1\
  \ 所示。网络 IDS 传感器可以位于防火墙和 Internet 之间的第一个检测点，或者位于半私有 DMZ 中，用于检测针对组织服务器的攻击。最后，网络 IDS\
  \ 可以位于内部私有网络，用于检测针对这些服务器的可能攻击。\n\n图 13-1: 基于网络的 IDS\n\n![f1301.eps](img/f1301_fmt.gif)\n\
  \nIDS 可以执行签名分析或异常检测来确定流量是否为可能的攻击。签名检测 IDS 将流量与已知的签名和误用模式进行匹配。签名是识别单个数据包或一系列数据包的模式，这些数据包在组合时会执行攻击。采用异常检测的\
  \ IDS 根据人员的正常业务模式寻找入侵尝试，并在访问系统、文件、登录等行为出现异常时发出警报。\n\n黑客可以通过更改流量使其不匹配已知签名来规避 IDS。这可能涉及使用不同的协议，例如用\
  \ `UDP` 代替 `TCP`，或用 `HTTP` 代替 `ICMP` 来传递攻击。此外，黑客可以将一次攻击拆分成几个较小的数据包以通过 IDS，但在接收站重组时将导致系统被攻破。这被称为“会话拆分”（session\
  \ splicing）。其他规避检测的方法包括插入额外数据、使用加密对地址或数据进行混淆，或者去同步并接管当前客户端的会话。\n\n### 攻击工具\n\n`ADMmutate`\
  \ 获取一个攻击脚本并创建一个不同的——但功能等效的——脚本来执行攻击。新脚本不在已知攻击签名的数据库中，因此可以绕过 IDS。\n\n### 理解 Snort\
  \ 规则和输出\n\n对于 CEH 考试，你应该熟悉 Snort 规则和输出。你可能需要阅读 Snort 规则或输出，并就该规则正在执行的操作或输出指示了什么种类型的攻击回答问题。\n\
  \nSnort 是一种部署在 Linux 和 Windows 系统上的实时数据包嗅探器、HIDS（主机 IDS）和流量日志工具。Snort 可以分析协议、执行内容搜索/匹配，并检测各种攻击和探测，例如缓冲区溢出、隐蔽端口扫描、CGI\
  \ 攻击、SMB 探测、OS 指纹识别尝试等。你可以在 `snort.conf` 文件中配置 Snort 和 IDS 规则。安装和运行 Snort 的命令是：\n\
  \n```\nsnort –l c:\\snort\\log –c C:\\snort\\etc\\snort.conf –A console\n```\n\n\
  Snort 由两个主要组成部分组成：\n\n- **Snort 引擎 (Snort Engine)**：一种利用模块化插件架构的 IDS 检测引擎。\n- **Snort\
  \ 规则 (Snort Rules)**：一种描述要收集流量的灵活规则语言。\n\n`Snort Engine` 以源代码和针对流行的 Linux 发行版及 Windows\
  \ 的二进制文件形式分发。注意的是，引擎和规则是分开分发的。Snort IDS 引擎和规则可以从 [snort.org](http://www.snort.org)\
  \ 下载。安装方法和软件依赖因操作系统而异，因此本章不包含 Snort 实验。详细的安装说明可以在 [snort.org](http://www.snort.org)\
  \ 找到。\n\n### 配置 Snort\n\nSnort 有一个配置文件：`snort.conf`。它通常位于 `/etc/snort`。该文件包含需要根据特定安装进行修改并针对你想告警的事件进行自定义的变量。文件变量按以下部分组织：\n\
  \n- 网络变量\n- 预处理器 (Preprocessors)\n- 后处理器 (Postprocessors)\n- 规则 (Rules)\n\n需要根据你的网络自定义的\
  \ `snort.conf` 文件变量列表 13-1](#9780470642887c13.xhtml_table13-1)。\n\n| 变量 | 含义 |\n\
  | :--- | :--- |\n| `HOME_NET` | 本地 IP 空间 |\n| `EXTERNAL_NET` | 外部 IP 空间 |\n| `SMTP`\
  \ | 你的 SMTP 服务器 |\n| `HTTP_SERVERS` | 你的 Web 服务器 |\n| `SQL_SERVERS` | 你的 SQL 服务器\
  \ |\n| `DNS_SERVERS` | 你的 DNS 服务器 |\n| `RULE_PATH` | 包含规则文件的目录 |\n\n以下是使用 `192.168.1.0`\
  \ 作为家庭网络的 Snort 示例配置：\n\n```\nvar HOME_NET 192.168.1.0/24\nvar EXTERNAL_NET any\n\
  var SMTP $HOME_NET\nvar HTTP_SERVERS $HOME_NET\nvar SQL_SERVERS $HOME_NET\nvar DNS_SERVERS\
  \ $HOME_NET\nvar RULE_PATH /etc/snort/rules\n```\n\n以下是配置文件中标识的规则位置：\n\n```\ninclude\
  \ $RULE_PATH/exploit.rules\ninclude $RULE_PATH/scan.rules\ninclude $RULE_PATH/ftp.rules\n\
  include $RULE_PATH/telnet.rules\ninclude $RULE_PATH/smtp.rules\ninclude $RULE_PATH/rpc.rules\n\
  include $RULE_PATH/dos.rules\ninclude $RULE_PATH/ddos.rules\ninclude $RULE_PATH/dns.rules\n\
  include $RULE_PATH/web-cgi.rules\ninclude $RULE_PATH/web-cgi.rules\ninclude $RULE_PATH/iis.rules\n\
  include $RULE_PATH/frontpage.rules\ninclude $RULE_PATH/sql.rules\ninclude $RULE_PATH/netbios.rules\n\
  include $RULE_PATH/coldfusion.rules\ninclude $RULE_PATH/iis.rules\ninclude $RULE_PATH/attack.rules\n\
  ```\n\n#### Snort 规则\n\nSnort 规则是用于根据流量生成警报的。规则头部包含以下字段：\n\n- `<action>`\n- `<protocol>`\n\
  - `<src>`\n- `<dest>`\n\n这是一个带有选项的 TCP 规则示例：\n\n```\nalert tcp $EXTERNAL_NET any\
  \ -> $HOME_NET 23\n```\n\n这条 Snort 规则对外部空间（任何端口）发往本地空间（23 端口）的 TCP 流量生成警报。其后是 Snort\
  \ 选项：\n\n- `msg:\"TELNET SGI format\"`：指定消息。\n- `flags:A+`：匹配 ACK 标志。\n- `content:\"\
  bin/sh\"`：匹配数据包负载中的字符串。\n- `clasype:attempted-admin`：为警报分配高权限尝试类别。\n\n#### Snort\
  \ 输出\n\n对于 CEH 考试，理解 Snort 输出报告是非常重要的。这里有一个 Snort 警报的示例。首先是时间戳：\n\n`04/21-19:26:37.353790`\n\
  \n这些是源和目的 MAC 地址：\n\n`0:8:2:FB:36:C6 -> 0:6:5B:57:A6:3F`\n\n接下来是以太网类型（`0x800` 表示以太网）和长度：\n\
  \n`type:0x800 len:0x3C`\n\n此行指定了源 IP `202.185.44.43` 到目的 IP `202.128` 以及源端口 `445`\
  \ 和目的端口 `2202`：\n\n`202.185.44.43:445 -> 202.185.44.28:2202`\n\n此行说明协议为 `TCP`，生存时间（TTL）为\
  \ `128`：\n\n`TCP TTL:128`\n\n接下来是服务类型、ID、IP 长度数据包长度：\n\n`TOS:0x0 ID:17467 IpLen:20\
  \ DgmLen:41 DF`\n\n`A` 表示 ACK 标志开启，因此数据包是对之前一个数据包的确认：\n\n`A`\n\n在此行中，`Seq` 是序列号，`Ack`\
  \ 是对之前数据包的编号响应：\n\n`Seq:0x9D08DD67 Ack:0x8EB1E02`\n\n最后，在最后一行中 `Win` 是窗口大小，TCP 长度为\
  \ `2000`：\n\n`Win:0x3FE1 TcpLen:2000`\n\n![note.eps](img/note_fmt.gif)\n\n在很多情况下，在\
  \ CEH 考试中阅读和解释 Snort 输出报告只需要知道 TCP 标志和 TCP 常用端口号。\n\n\n\n\n\n防火墙是一种软件程序或硬件设备，它能够允许或拒绝对网络的访问，并遵循管理员设置的规则来引导数据包在网络中的允许去向。边界硬件防火墙设备（图\
  \ 13-2）设置在信任网络连接到不信任网络（如互联网）的边界边缘，或者设置在两个网络之间。软件防火墙则保护个人电脑、系统或主机免受来自网络进入网卡（`NIC`）的非授权或恶意数据包的影响。\n\
  \n图 13-2： 边界硬件防火墙\n\n![f1302.eps](img/f1302_fmt.gif)\n\n蜜罐（图 13-3）是位于网络非军事化区（`DMZ`）内部的诱饵箱，由安全专业人员设置，用于诱捕或协助定位黑客的位置，或者将他们从真实的目标系统引开。\n\
  \n图 13-3： 蜜罐位置\n\n![f1303.eps](img/f1303_fmt.gif)\n\n蜜罐是一个恶意攻击者可能会尝试攻击的诱饵系统；系统软件可以记录有关攻击者的信息，例如\
  \ `IP` 地址。这些信息可以用于在攻击期间或攻击后尝试定位攻击者。蜜罐的最佳位置是 `DMZ` 上的防火墙之前，使其对黑客具有吸引力。具有静态地址的蜜罐被设计成像真实的生产服务器（参见图\
  \ 13-4）。练习 13-1 将引导你完成蜜罐的安装和使用。\n\n图 13-4： 蜜罐\n\n![f1304.eps](img/f1304_fmt.gif)![realworld.eps](img/realworld_fmt.gif)\n\
  \n## 寻找蜜罐\n\n几年前，我曾为一家大型公司进行无线网络安全审计。我开车在企业园区内扫描开放的接入点（`APs`），对于我的无线扫描嗅探器能看到如此多开放未安全的\
  \ `APs`，我感到有些惊讶。我发现了 30 多个可以连接并获取网络访问的 `APs`。\n\n当然，连接到 `APs` 后的下一步是扫描网络。因此，作为安全审计的一部分，我从外部连接并对整个网络范围运行端口扫描；我发现了几个开启端口的系统。有一个邮件服务器和几个\
  \ Web 服务器，以及一个没有完全打补丁的域控制器。根据审计范围，我只需要报告发现的漏洞，而不需要尝试利用我在系统中发现的运行的服务。我很惊讶这样一个大机构在开放的无线网络上竟然会有如此容易被发现的漏洞。我在安全审计报告中记录了所有目标系统以及漏洞端口和服务。\n\
  \n第二天，当我向客户提交报告时，IT 经理简单地说：“很好，你们发现了我们的蜜罐网络，现在去寻找真实的系统吧。”他们获取了网络上发现的所有非法 `APs`，并将它们重定向到一个单独的\
  \ `VLAN`。在在重定向的 `VLAN` 上，他们创建了虚拟系统（即蜜罐）来吸引潜在的黑客。这些蜜罐可以让黑客忙于尝试攻击蜜罐系统而无法获取任何真实数据，同时真实的服务却不受影响。\n\
  \n## 练习 13-1：安装和使用 KFSensor 作为蜜罐\n\n1. 从 [www.keyfocus.net](http://www.keyfocus.net)\
  \ 下载并安装 `KFSensor` 试版。\n2. 打开并运行 `KFSensor`。将弹出一个窗口启动配置向导。点击 `Next` 继续。\n\n![g1301.tif](img/g1301_fmt.jpg)\n\
  3. 点击 `Next` 选择所有端口。\n\n4. 在 `Domain Name` 字段中输入你的 `name.com`（或你选择的其他域名）并点击 `Next`。\n\
  \n![g1302.tif](img/g1302_fmt.jpg)\n5. 在 `Send To` 和 `Send From` 字段中输入你的邮箱地址以接收来自\
  \ `KFSensor` 的邮件警报。\n\n![g1303.tif](img/g1303_fmt.jpg)\n6. 从 `Port Activity` 下拉列表中选择\
  \ `8 hours`。在 `Network Protocol Analyzer` 下拉列表中选择 `Enable Packet Dump Files`。其他选项保持默认值。\n\
  \n![g1304.tif](img/g1304_fmt.jpg)\n7. 点击 `Next` 接受默认设置安装为系统服务。\n\n![g1305.tif](img/g1305_fmt.jpg)\n\
  8. 点击 `Finish` 完成向导配置。\n9. `KFSensor` 的 `Main scenario` 应该出现在左侧。你可能会在左侧看到 `KFSensor`\
  \ 的 `Main scenario`。\n10. 防火墙是一种软件程序或硬件设备，它能够允许或拒绝对网络的访问，并遵循管理员设置的规则来引导数据包在网络中的允许去向。边界硬件防火墙设备（图\
  \ 13-2）设置在信任网络连接到不信任网络（如互联网）的边界边缘，或者设置在两个网络之间。软件防火墙则保护个人电脑、系统或主机免受来自网络进入网卡（`NIC`）的非授权或恶意数据包的影响。\n\
  11. 你可能会在左侧看到 `KFSensor` 的 `Main scenario`。\n12. 你可能会在左侧看到 `KFSensor` 的 `Main scenario`。\n\
  13. 你可能会在左侧看到 `KFSensor` 的 `Main scenario`。\n\n### 攻击工具\n\n`007 Shell` 是一种 隧道程序，允许黑客使用隐蔽通道进行攻击并绕过防火墙规则。\n\
  \n`ICMP Shell` 是一种类似于 telnet 的程序，黑客利用它通过 `ICMP` 命令与系统建立连接，而这些命令通常是被防火墙允许的。\n\n`AckCmd`\
  \ 是一个仅使用 `TCP ACK` 数据包通信的客户端/服务器程序，这些通常可以通过防火墙。\n\n`Covert_TCP` 是黑客用来通过在 IP 头部隐藏数据，逐字节地通过防火墙发送文件的程序。\n\
  \n`Send-Safe Honeypot Hunter` 是一种蜜罐检测工具，用于检查代理服务器是否存在蜜罐。\n\n### 应对措施\n\n`Specter`\
  \ 是一种蜜罐系统，可以在黑客攻击系统时自动捕获其机器的信息。\n\n`Honeyd` 是一个开源蜜罐，它在网络上创建虚拟主机供黑客攻击。\n\n`KFSensor`\
  \ 是一种基于主机的入侵检测系统，可作为蜜罐使用，并可以模拟虚拟服务和木马安装。\n\n`Sobek` 是一种数据采集蜜罐工具，可以捕获攻击者的击键。\n\n\
  `Nessus` 漏洞扫描器（[www.nessus.org](http://www.nessus.org)）也可以用于检测蜜罐。\n\n\n\n\n入侵检测系统（IDS）可以是基于网络或基于主机的。实施这两种类型的系统对于保护服务器上的贵贵数据免受攻击至关重要。在这两种情况下，保持规则和定义的更新都是关键的，以确保\
  \ IDS 拥有最新的攻击向量来比较流量。防火墙也可以是基于网络或主机的，在许多情况下，网络设备和系统软件会同时执行 IDS 检测和防火墙动作。仅仅在网络或服务器上部署了防火墙和\
  \ IDS，就不应该产生虚假的安全感；隧道技术和加密可以绕过 IDS 和防火墙，因为设备无法读取真实的流量报头和数据。认证黑客大师（CEH）会使用此类技术尝试绕过防火墙和\
  \ IDS 的保护。\n\n## 考试要点\n\n- **掌握 IDS 的两种主要类型。** IDS 可以是基于主机的或基于网络的。基于主机的 IDS 针对特定操作系统并保护单个系统。基于网络的\
  \ IDS 可以保护整个网络。\n- **能够定义蜜罐系统（Honeypot）。** 蜜罐系统位于 DMZ 中，作为一个易受主机，并发布服务和软件以诱骗黑客入侵系统。\n\
  - **能够定义防火墙（Firewall）。** 防火墙是一种数据包过滤设备，将流量与规则列表进行比较，并过滤从不可信网络到可信网络的流量。\n- **理解如何检测蜜罐。**\
  \ 可以通过系统信息与代理服务器中的已知蜜罐列表对比来检测蜜罐。\n- **理解 IDS 如何工作。** IDS 可以执行异常分析或基于特征的检测。\n- **知道如何执行防火墙规避技术。**\
  \ 可以通过如 `ICMP` 或 `HTTP` 等协议来携带攻击流量。另一种技术是将数据包分成几个较小的数据包，使得整个攻击字符串无法被检测。\n\n## 复习题\n\
