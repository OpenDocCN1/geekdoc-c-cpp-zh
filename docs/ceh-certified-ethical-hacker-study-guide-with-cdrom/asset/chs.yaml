  \n## 19. 哪种人对组织安全的构威胁最大？\n\nA. 黑帽客\nB. 不满的员工\nC. 脚本小子\nD. 灰帽客\n\n## 20. 下列哪项应该包含在伦理黑客报告中？（选择所有适用）\n\
  \nA. 测试结果\nB. 风险分析\nC. 法律文件\nD. 伦理披露\n\n## 复习题答案\n\n1. A. `白帽客` 是“好”人，他们使用自己的技术用于防御目的。\n\
  2. C. `白盒测试` 是在了解系统内部的情况下进行的安全审计。\n3. D. `侦察` 是收集执行攻击所需的必要信息。\n4. D. `物理访问` 测试对物理基础设施的访问。\n\
  5. B. 随着安全性的增加，使用会变得越困难且功能越少。\n6. A. `不满的员工` 拥有允许他们发起强大攻击的信息。\n7. A, B, C. 安全评估计划的三个阶段是准备、安全评估和结论。\n\
  8. B. `黑客行动主义` 由声称为了政治或社会目的进行黑客攻击的人员实施。\n9. B. `美国法典`中的`第 18 卷`最常用于起诉黑客。\n10. A.\
  \ 来自互联网的攻击被称为`远程攻击`。\n11. A. `信息自由法案`确保了许多文件和记录的公开，可以作为潜在目标信息的丰富来源。\n12. A, B, D.\
  \ 发送垃圾邮件、安装和使用键盘记录器以及实现弹出窗口均被`SPY ACT`所禁止。\n13. B. 签署`NDA`协议对于确保测试获得授权以及伦理黑客有权访问客户系统至关重要。\n\
  14. D. `评估目标`是作为安全分析主体的系统、程序或网络。它是伦理黑客攻击的靶。\n15. A. `破解者`是使用黑客技术进行破坏性目的的黑客。\n16.\
  \ C. `MAC 地址欺骗`是一种用于绕过`MAC 地址过滤器`的`身份验证攻击`。\n17. A. `爱国者法案`在许多情况下（包括计算机黑客）授权拦截语音通信。\n\
  18. A, B, C. 关于测试过程的所有信息、在网络或系统中发现的漏洞以及建议的防御措施都应该包含在伦理黑客报告中。\n19. B. `不满的员工`由于他们拥有的信息和访问权限，对组织安全构成了最大的威胁。\n\
  20. A, B. `测试结果`和`风险分析`都应该包含在伦理黑客报告中。\n\n# 第 2 章 收集目标信息：侦察、足迹扫描与社会工程\n\n## 本章涵盖的\
  \ CEH 考试目标：\n\n- 定义足迹扫描的概念\n- 描述信息收集方法\n- 描述竞争情报\n- 理解 DNS 枚举\n- 理解 `Whois`、`ARIN\
  \ 查询`\n- 理解不同类型的 DNS 记录\n- 理解 `traceroute` 如何用于足迹扫描\n- 理解邮件跟踪如何工作\n- 理解网络爬虫如何工作\n\
  - 什么是社会工程？\n- 常见的攻击类型有哪些？\n- 理解翻找垃圾\n- 理解反向社会工程\n- 理解内部攻击\n- 理解 身份窃取\n- 描述钓鱼攻击\n\
  - 理解网络诈骗\n- 理解 URL 混淆\n- 社会工程防御措施\n\n\n\n\n\n`reconnaissance`（侦察）一词源于军事领域，意味着通过直接观察（通常由经过侦察训练的侦员或军事情报人员进行）收集和聚集有关敌人组成和能力的信息，主动寻求敌人的意图。在伦理黑客领域，`reconnaissance`适用于信息收集过程。`Renaissance`\
  \ 是一个统称，指监控黑客攻击目标并收集有关他们如何、何时以及在何处做某事的信息。通过识别人员或系统的行为模式，敌人可以发现并利用漏洞。\n\n![realworld.eps](img/realworld_fmt.gif)\n\
  \n## 使用侦察获取物理访问\n\n每个工作日的下午 3 点，联邦快递（Federal Express）的司机都会在 `Medical Associates,\
  \ Inc.` 办公所在地大楼的装货平台停。当司机将卡车倒回大楼后门时，他会按门铃让安保人员知道已到达门口。由于大楼的安全人员认识这名司机——因为他每天都在大约同一时间来这里取送货物——他们会远程解锁大门并允许司机进入。一名黑客坐在停车场里的汽车里观察这一过程，并记录了进入大楼的物理进入程序。\n\
  \n第二天，当联邦快递司机被允许进入建筑时，黑客提着一个大纸箱走向门口。司机自然地为黑客开门，因为他提着一个看起来很重、很大的箱子。他们交换了寒暄，黑客走向电梯直上\
  \ `Medical Associates` 的办公室。黑客在前往目标办公室时，将纸箱留在大楼的走廊里。\n\n一旦他到达 `Medical Associates`\
  \ 办公室的前台，他要求与办公室经理面谈，他之前已经在公司网站上查到过该经理的名字。前台人员离开座位去寻找办公室经理，黑客越过桌子，将一个包含黑客工具的 `USB\
  \ drive` 插入该人员电脑的后部。由于电脑没有密码锁定，他双击 `USB drive` 图标，黑客软件便静静地安装在前台人员的电脑上。他拔掉 `USB drive`，并在在未被察觉的情况下迅速离开办公套间和大楼。\n\
  \n这是一个说明 `reconnaissance` 和对人员行为模式的理解如何使黑客能够获取物理访问（在本例中是通过木马化的系统访问 `Medical Associates`\
  \ 网络）并绕过安全检查点的示例。\n\n## 理解竞争情报\n\n竞争情报意味着对竞争对手的产品、营销和技术进行信息收集。大多数竞争情报对被调查的公司来说是非侵入性的，且本质上是无害的——用于产品比较，或作为销售和营销策略，以更好地了解竞争对手如何定位其产品或服务。存在多种用于竞争情报收集的工具，黑客可以使用它们收集有关潜在目标的信息。\n\
  \n在练习 `2.1` 到 `2.3` 中，我将向你展示如何使用 `SpyFu` 和 `KeywordSpy` 在线工具收集有关目标网站的信息。`SpyFu`\
  \ 和 `KeywordSpy` 会提供网站的关键词。这允许你对网站进行一些信息收集。我使用这两个工具是因为它们易于使用且完全是被动的，这意味着潜在目标无法检测到信息收集行为。\n\
  \n### 练习 2-1：使用 SpyFu\n\n要使用 `SpyFu` 在线工具收集竞争情报信息：\n\n1. 访问 `[www.spyfu.com](http://www.spyfu.com)`\
  \ 网站，并在搜索字段中输入目标的网站地址：\n\n![g0201.tif](img/g0201_fmt.jpg)\n\n2. 查看报告并确定有价值的关键词、链接或其他信息。\n\
  \n### 练习 2-2：使用 KeywordSpy\n\n要使用 `KeywordSpy` 在线工具收集竞争情报信息：\n\n1. 访问 `[www.keywordspy.com](http://www.keywordspy.com)`\
  \ 网站，并在搜索字段中输入目标的网站地址：\n\n![g0202.tif](img/g0202_fmt.jpg)\n\n2. 查看报告并确定有价值的关键词、链接或其他信息。\n\
  \n另一个用于执行竞争情报和信息收集的有用工具是 `EDGAR` 数据库。这是一个包含所有上市公司 `SEC` 备案文件的数据库。可以通过查看 `SEC` 备案文件中的联系名称和地址来收集信息。在练习\
  \ `2-3` 中，我将向你展示如何使用 `EDGAR` 数据库收集潜在目标的信息。\n\n### 练习 2-3：使用 EDGAR 数据库收集信息\n\n1.\
  \ 使用 `Google` 确定公司的股票代码。\n\n2. 打开浏览器访问 `[www.sec.gov](http://www.sec.gov)`。\n\n\
  3. 在页面右侧，点击 `EDGAR Filers` 链接。\n\n![g0203.eps](img/g0203_fmt.gif)\n\n4. 点击 `Search\
  \ For Filings` 菜单并输入公司名称或股票代码以搜索备案信息。例如，你可以了解公司在哪里注册，以及是谁提交了备案。\n\n5. 使用 `Yahoo!`\
  \ 黄页电话（[`yp.yahoo.com`](http://yp.yahoo.com)`）查看你找到的任何员工姓名是否列有地址或电话号码。\n\n6. 使用\
  \ `Google Groups` 和招聘网站搜索你找到的姓名。新闻组中是否有发布任何 `IT` 职位或其他信息，可以指示该组织拥有何种类型的网络或系统？\n\n\
  网站 `[www.Netcraft.com](http://www.Netcraft.com)` 是另一个被动信息收集的好来源。该网站将尝试确定运行 Web 服务器的操作系统和版本。该工具将在后续章节进行讨论。\n\
  \n## 信息收集方法论\n\n信息收集可以分为七步（见图 2-1）。侦察是在挖掘初始信息和定位网络范围的前两步中进行的。\n\n图 2-1： 信息收集的七步\n\
  \n![f0201.eps](img/f0201_fmt.gif)![note.eps](img/note_fmt.gif)\n\n其他信息收集步骤将在第三章“收集网络和主机信息：扫描与枚举”中介绍。\n\
  \n### 侦察\n\n侦察定义为创建组织网络和系统蓝图或地图的过程。信息收集也从确定目标系统、应用程序或物理位置开始。一旦知道了这些信息，就可以通过非侵入的方法收集有关组织的特定信息。例如，组织自己的网页可能会提供人员目录或员工简介，如果黑客需要使用社交工程攻击来达到目标，这些信息可能非常有用。\n\
  \n黑客在侦察阶段寻找的信息是任何可以提供网络架构、服务器和应用程序类型线索的内容。在发动攻击或利用之前，必须揭示操作系统和版本以及应用程序类型，以便对目标实施最有效的攻击。以下是侦察期间针对目标收集的一些信息：\n\
  \n*   域名\n\n*   网络区块\n\n*   网络服务和应用程序\n\n*   系统架构\n\n*   入侵检测系统\n\n*   身份验证机制\n\n\
  *   特定的 IP 地址\n\n*   访问控制机制\n\n*   电话号码\n\n*   联系地址\n\n一旦汇总了这些信息，黑客就能更深入了解该组织、有价值信息的存储处以及如何访问它们。\n\
  \n## 侦察工具\n\n\n\n\n足迹探测（Footprinting）可以使用黑客工具（应用程序或网站）完成，这些工具允许黑客被动地定位信息。通过使用这些足迹探测工具，黑客可以获取目标的一些基础信息或“足迹”。通过首先对目标进行足迹探测，黑客可以排除掉对目标系统或网络无效的工具。例如，如果一家图形设计公司使用所有的\
  \ Macintosh ，那么所有针对 `Windows` 系统的黑客软件都可以排除。足迹探测不仅通过消除某些工具集来加快黑客过程，还能通过针对任务使用正确的工具来减少黑客尝试，从而最大限地减少被检测的机会。\n\
  \n对于本章的练习，你将对一家目标公司进行侦察和信息收集。我建议你使用你自己的组织，但由于这些工具是被动的，因此可以使用任何组织名称。\n\n一些用于足迹探测和信息收集的常用工具如下：\n\
  \n*   域名查询\n*   `Whois`\n*   `NSlookup`\n*   `Sam Spade`\n\n在我们在我们讨论这些工具之前，请记住，开源信息也可以提供关于目标的丰富信息，例如电话号码和地址。执行\
  \ `Whois` 请求、搜索域名系统 (`DNS`) 表以及使用其他查询网络工具都是开源足迹探测的形式。这些信息中的大部分非常容易获取，且是合法的。\n\n\
  ## 对目标进行足迹探测\n\n足迹探测是攻击前准备阶段的一部分，涉及收集有关目标环境和架构的数据，通常目的是寻找侵入该环境的方法。足迹探测可以揭示系统漏洞并识别利用这些漏洞的难易。这是黑客收集计算机系统及其所属公司信息最简单的方法。这个准备阶段的目的是尽可能地了解系统、其远程访问能力、端口和服务以及其安全的任何特定方面。\n\
  \n### 使用 Google 收集信息\n\n黑客也可以通过 Google 搜索或 Yahoo! 人搜索来定位有关员工或组织本身的信息。\n\nGoogle\
  \ 搜索引擎可以以创意的方式进行信息收集。使用 Google 搜索引擎检索信息被称为 Google 黑客攻击（Google hacking）。访问 `[`groups.google.com`](http://groups.google.com)`\
  \ 搜索 Google 新组。可以使用以下命令让 Google 搜索引擎收集目标信息：\n\n*   `site`：搜索特定的网站或域名。在冒号后提供你想搜索的网站。\n\
  *   `filetype`：仅在特定类型文件的文本内搜索。在冒号后提供你想搜索的文件类型。文件扩展名前不要包含句号。\n*   `link`：在超链接中搜索搜索词并识别链接的页面。\n\
  *   `cache`：识别网页的版本。在冒号后提供网站的 URL。\n*   `intitle`：在文档标题内搜索术语。\n*   `inurl`：仅在文档的\
  \ URL（网络地址）内搜索。搜索词必须跟在冒号后面。\n\n例如，黑客可以使用以下命令来定位某些类型的漏洞 Web 应用程序：\n\n`INURL:[\"parameter=\"\
  ] with FILETYPE:[ext] and INURL:[scriptname]`\n\n或者，黑客可以使用搜索字符串 `intitle:\"BorderManager\
  \ information alert\"` 来寻找 Novell BorderManager 代理/防火墙服务器。\n\n![note.eps](img/note_fmt.gif)\n\
  \n有关执行 Google 搜索的更多语法，请访问 `[www.google.com/help/refinesearch.html](http://www.google.com/help/refinesearch.html)`。\n\
  \n博客、新闻组和新闻稿也是寻找公司或员工信息的好地方。企业招聘公告可以提供有关公司在其网络上可能使用的服务器或基础设施设备类型的信息。\n\n获取的其他信息可能包括正在使用的互联网技术、所使用的操作系统和硬件、活跃的\
  \ IP 地址、电子邮件地址和电话号码以及公司政策和程序。\n\n![note.eps](img/note_fmt.gif)\n\n通常，黑客花费 90% 的时间对目标进行分析和收集信息，花费\
  \ 10% 的时间发动攻击。\n\n### 理解 DNS 遍历\n\nDNS 遍历是定位组织所有 `DNS` 服务器及其相应记录的过程。公司可能同时拥有内部和外部\
  \ `DNS` 服务器，这些服务器可以产生用户名、计算机名称和潜在目标系统的 IP 地址等信息。\n\n`NSlookup`、`DNSstuff`、美国互联网数字分配机构\
  \ (`ARIN`) 和 `Whois` 均可获取可执行 DNS 遍历的信息。\n\n#### NSlookup 和 DNSstuff\n\n你应该熟悉的一个强大工具是\
  \ `NSlookup`（参见 `图 2-2`）。该该工具查询 `DNS` 服务器的记录信息。它包含在 Unix、Linux 和 Windows 操作系统中。如\
  \ `Sam Spade` 等黑客工具也包含 `NSlookup` 工具。\n\n基于从 `Whois` 收集的信息，你可以使用 `NSlookup` 查找服务器和其他主机的额外\
  \ IP 地址。使用来自 `Whois` 的权威名称服务器信息 (`AUTH1.NS.NYI.NET`)，你可以发现邮件服务器的 IP 地址。\n\n图 2-2:\
  \ `NSlookup`\n\n![f0202.tif](img/f0202_fmt.jpg)\n\n易用工具的爆炸使得黑客变得简单，如果你知道使用哪些工具。`DNSstuff`\
  \ 是这些工具之一。与其使用带有复杂参数的 `NSlookup` 工具来获取 DNS 信息，只需访问 `[www.dnsstuff.com](http://www.dnsstuff.com)`\
  \ 即可进行 DNS 搜索。`图 2-3` 显示了 `dnsstuff.com` 的示例 DNS 搜索。\n\n![f0203.tif](img/f0203_fmt.jpg)\
  \ (sic)\n\n此搜索显示了 `www.eccouncil.org` 的所有别名记录以及 Web 服务器的 IP 地址。你甚至可以发现所有的名称服务器和关联\
  \ IP 地址。\n\n### 理解 Whois 和 ARIN 查询\n\n`isis` 源自 Unix 操作系统，但现在可以在许多操作系统、黑客工具包以及互联网上找到。该工具识别注册用于电子邮件或网站的域名。统一资源定位符\
  \ (URL)，例如 `[www.Microsoft.com](http://www.Microsoft.com)`，包含域名 (`Microsoft.com`)\
  \ 和主机名或别名 (`www`)。\n\n域名注册机构 (`ICANN`) 要求注册域名以确保只有一个公司使用特定的域名。`Whois` 工具查询注册数据库以检索有关域名注册个人或组织的联系信息。\n\
  \n#### 黑客工具\n\n`Whois` 是一种信息收集程序，允许你查找有关 IP 地址、主机名或域名的可用信息，包括国家、州或省、市、网络提供商名称、管理员和技术支持联系信息。`SmartWhois`\
  \ 是基础程序的图形版本。\n\n在练习 2-4 中，我将向你展示如何使用免费的 `Whois` 工具。\n\n练习 2-4: 使用 Whois\n\n使用 `Whois`\
  \ 工具收集有关注册商或域名的信息：\n\n\n\n\n\n1. 访问 `DNSStuff.com` 网站并向下滚动到页面底部的免费工具。\n\n![g0204.tif](img/g0204_fmt.jpg)\n\
  \n2. 在 `WHOIS Lookup` 字段中输入目标公司的 URL，并点击 `WHOIS` 按钮。\n\n3. 检查结果并确定以下信息：\n   - 注册地址\n\
  \   - 技术和 DNS 联系人\n   - 联系邮箱\n   - 联系电话号码\n   - 过期日期\n\n4. 访问公司网站，查看 `WHOIS` 中的联系信息是否与网站上列出的任何联系人姓名、地址和电子邮件地址匹配。\n\
  \n5. 如果匹配，使用 `Google` 搜索员工姓名或电子邮件地址。你可以了解该组织使用的电子邮件命名规则，以及是否存在任何不应公开的内。\n\nARIN\
  \ 是一个数据库，其中包含了如静态 IP 地址所有者等信息。可以使用 `Whois` 工具查询 `ARIN` 数据库，例如位于 [www.arin.net](http://www.arin.net)\
  \ 的工具。\n\n插图 2-4 显示了对 [www.yahoo.com](http://www.yahoo.com) 的 `ARIN Whois` 搜索。注意，地址、电子邮件和联系信息都包含在此\
  \ `Whois` 搜索中。伦理黑客可以使用这些信息找出谁负责某个 IP 地址，以及哪个组织拥有该目标系统；或者，恶意黑客可以使用这些信息对该组织进行社会工程攻击。作为安全专业人员，你需要意识到\
  \ `ARIN` 等可搜索数据库中向公开的信息，并确保恶意黑客无法利用这些信息对网络发起攻击。\n\n插图 2-4: [www.Yahoo.com](http://www.Yahoo.com)\
  \ 的 `ARIN` 输出\n\n![f0204.tif](img/f0204_fmt.jpg)![note.eps](img/note_fmt.gif)\n\n\
  请注意，北美以外的其他地理区域也有它们自己的 Internet 注册机构，例如 `RIPE NCC`（欧洲、中东和中亚部分地区）、`LACNIC`（拉丁美洲和加勒比\
  \ Internet 地址注册机构）以及 `APNIC`（亚太网络信息中心）。\n\n### 分析 Whois 输出\n\n运行 `Whois` 的简单方法是连接到网站（例如，[www.networksolutions.com](http://www.networksolutions.com)）并进行\
  \ `Whois` 搜索。列表 2-1 是对网站 [www.eccouncil.org](http://www.eccouncil.org) 进行 `Whois`\
  \ 搜索输出。\n\n![note.eps](img/note_fmt.gif)\n\n本书中的联系人姓名和服务器名称已更改。\n\n列表 2-1: `www.eccouncil.org`\
  \ 的 `Whois` 输出\n\n```\nDomain ID:D81180127-LROR\nDomain Name:ECCOUNCIL.ORG\nCreated\
  \ On:14-Dec-2001 10:13:06 UTC\nLast Updated On:19-Aug-2004 03:49:53 UTC\nExpiration\
  \ Date:14-Dec-2006 10:13:06 UTC\nSponsoring Registrar:Tucows Inc. (R11-LROR)\nStatus:OK\n\
  Registrant ID:tuTv2ItRZBMNd4lA\nRegistrant Name:John Smith\nRegistrant Organization:International\
  \ Council of E-Commerce Consultants\nRegistrant Street1:67 Wall Street, 22nd Floor\n\
  Registrant Street2:\nRegistrant Street3:\nRegistrant City:New York\nRegistrant State/Province:NY\n\
  Registrant Postal Code:10005-3198\nRegistrant Country:US\nRegistrant Phone:+1.2127098253\n\
  Registrant Phone Ext.:\nRegistrant FAX:+1.2129432300\nRegistrant FAX Ext.:\nRegistrant\
  \ Email:forum@eccouncil.org\nAdmin ID:tus9DYvpp5mrbLNd\nAdmin Name:Susan Johnson\n\
  Admin Organization:International Council of E-Commerce Consultants\nAdmin Street1:67\
  \ Wall Street, 22nd Floor\nAdmin Street2:\nAdmin Street3:\nAdmin City:New York\n\
  Admin State/Province:NY\nAdmin Postal Code:10005-3198\nAdmin Country:US\nAdmin Phone:+1.2127098253\n\
  Admin Phone Ext.:\nAdmin FAX:+1.2129432300\nAdmin FAX Ext.:\nAdmin Email:ethan@eccouncil.org\n\
  Tech ID:tuE1cgAfi1VnFkpu\nTech Name:Jacob Eckel\nTech Organization:International\
  \ Council of E-Commerce Consultants\nTech Street1:67 Wall Street, 22nd Floor\nTech\
  \ Street2:\nTech Street3:\nTech City:New York\nTech State/Province:NY\nTech Postal\
  \ Code:10005-3198\nTech Country:US\nTech Phone:+1.2127098253\nTech Phone Ext.:\n\
  Tech FAX:+1.2129432300\nTech FAX Ext.:\nTech Email:forum@eccouncil.org\n```\n\n\
  ### 获取网络地址范围\n\n每个伦理黑客都需要学会查找子网掩码。此任务可以通过追踪 `ARIN` 或互联网分配数字 (`IANA`) 等注册机构来完成。\n\
  \n### 识别 DNS 记录类型\n\n列表描述了常见的 DNS 记录类型及其用途：\n- `A` (地址)：将主机名映射到 IP 地址\n- `SOA` (起始区域)：识别负责域名的\
  \ DNS 服务器\n- `CNAME` (规范别名)：提供额外的别名\n- `MX` (邮件交换)：识别邮件服务器\n- `SRV` (服务)：识别如目录的服务\n\
  - `PTR` (指针)：将 IP 地址映射到主机名\n- `NS` (名称服务器)：识别其他名称服务器\n\n### 使用 Traceroute 进行足迹扫描\n\
  \n`traceroute` 是一种大多数操作系统都提供的数据跟踪工具。它通过向路径上的每个跳数（路由器）发送 Internet 控制消息协议 (`ICMP`)\
  \ 回显来实现，直到到达目标地址。当 ICMP 消息从路由器返回时，路径上每个路由器的生存时间 (`TTL`) 都会减 1。这允许黑客确定路由器距离发送者有多少跳数。\n\
  \n使用 `traceroute` 的一个问题是，当它遇到防火墙或包过滤路由器时会超时（用星号表示）。尽管防火墙阻止了 `traceroute` 工具发现网络内部的主机，但它会提醒伦理黑客防火墙的存在；随后可以使用绕过防火墙的技术。\n\
  \n`Sam Spade` 和许多其他黑客工具包含 `traceroute` 的版本。Windows 操作系统使用 `tracert hostname` 语法来执行\
  \ traceroute。插图 2-5 是跟踪 [www.yahoo.com](http://www.yahoo.com) 的 `traceroute` 输出示例。\n\
  \n插图 2-5: [www.yahoo.com](http://www.yahoo.com) 的 `Traceroute` 输出\n\n![f0205.tif](img/f0205_fmt.jpg)\n\
  \n\n\n\n`tracert` 命令用于识别通往目标网络路径上的路由器。由于路由器通常根据其物理位置命名，`tracert` 的结果可以帮助定位这些设备。\n\
  \n# 黑客工具\n\n`NeoTrace`、`VisualRoute` 和 `VisualLookout` 都是具有 GUI 或视觉界面的数据包跟踪工具。它们在地图上绘制数据包传输的路径，并可以视觉化地识别路由器和其他网络设备的位置。这些工具的工作原理与\
  \ `traceroute` 类似，执行相同的信息收集；然而，它们提供了结果的可视化表示。\n\n## 理解邮件追踪\n\n`email-tracking` 程序允许邮件发送者了解收件者是否阅读、转发、修改或删除了邮件。大多数\
  \ `email-tracking` 程序通过在电子邮件地址后添加域名来工作，例如 `readnotify.com`。邮件中会附带一个收件者察觉的单像素图形文件。然后，当对邮件执行操作时，该图形文件会连接回服务器并向发送者通知该操作。\n\
  \n### 黑客工具：Visualware\n`Visualware` 的 `eMailTrackerPro`（[www.emailtrackerpro.com/]）和\
  \ `MailTracking`（[http://mailtracking.com/]）是允许道德黑客跟踪邮件消息的工具。当你使用这些工具发送邮件、转发邮件、回复邮件或修改邮件时，原始邮件产生的操作和痕迹会被记录下来。发送者将收到一封自动生成的邮件，告知对被追踪邮件执行的所有操作。\n\
  \n## 理解网络爬虫\n\n垃圾邮件发送者以及任何其他兴趣从互联网收集电子邮件地址的人都可以使用 `web spiders`（网络爬虫）。`web spider`\
  \ 爬取网站并收集电子邮件地址等特定信息。`web spider` 使用如 `@` 符号等语法定位电子邮件地址，然后将它们复制到列表中。这些地址随后被添加到数据库，并在以后可能用于发送未经请求的邮件。\n\
  \n`web spiders` 可用于定位互联网上的各种信息。黑客可以使用 `web spider` 自动化信息收集过程。防止你的网站被爬虫爬取的一种方法是在网站根目录下放置\
  \ `robots.txt` 文件，并列出你想要防止被爬取的目录。\n\n# 社会工程学\n\n社会工程学是一种侵入系统或网络的非技术方法。它是欺骗系统用户并说服他们执行对黑客有用的行为的过程，例如提供可以用于破解或绕过安全机制的信息。理解社会工程学非常重要，因为黑客可以使用它来攻击系统的人为因素，并绕过技术安全措施。这种方法可以在攻击之前或攻击期间用于收集信息。\n\
  \n社会工程工程师通常使用电话或互联网来欺骗人们透露敏感信息，或使他们做违反组织安全政策的事情。通过这种方法，社会工程工程师利用了人信任言语的自然倾向，而不是利用计算机安全漏洞。人们通常认为用户是安全链中最薄弱的环节；这一原则使得社会工程学成为可能。\n\
  \n以下是 Kapil Raina 讲述的一个社会工程学案例，他目前是 `VeriSign` 的安全专家，该案例基于他在前任雇主处的真实工作经历：\n\n几年前的一个早晨，一群陌生人走进一家大型货运公司，并在离开时获得了该公司整个公司网络的访问权限。他们是如何做到的？通过从该公司的几位不同员工那里一点一点地获取少量的访问权限。首先，他们在尝试进入场所之前就对公司进行了两天的研究。例如，他们通过拨打人力资源部门了解了关键员工的名字。接着，他们假装丢失了前门的钥匙，一个男人让他们进去。然后，他们在进入第三层受控区域时“丢失”了身份证，微微一笑，一位友好的员工为他们打开了门。\n\
  \n这些陌生人知道首席财务官（CFO）不在城，因此他们进入他的办公室并从他未锁的电脑上获取财务数据。他们翻找公司的垃圾，找到了各种实用文档。他们向一名清洁工要了一个垃圾桶来装物品，并用手将所有数据带出了建筑。这些陌生人研究过\
  \ CFO 的声音，因此他们能够打电话假装是 CFO，并且听起来很匆忙，急切地需要他的网络密码。从那里开始，他们使用常规的技术黑客工具获得了系统的超级用户访问权限。\n\
  \n在这种情况下，这些陌生人是网络顾问，在任何其他员工都不知情的情况下，为 CFO 执行安全审计。他们从未没有从 CFO 那里获得任何特权信息，但通过社会工程学获得了他们想要的所有访问权限。\n\
  \n社会工程学最危险的部分是，那些拥有认证流程、防火墙、虚拟专用网络和网络监控软件的公司仍然容易受到攻击，因为社会工程学并不直接攻击安全措施。相反，社会工程学攻击绕过了安全措施，转而针对组织中的人为因素。\n\
  \n## 操纵的艺术\n\n社会工程学包括外部人员基于建立不当信任关系来获取敏感信息或不当访问权限。社会工程工程师的目标是欺骗某人提供价值的信息或对信息的访问权限。社会工程学利用人性的特质，例如乐于助人的愿望、信任人的倾向以及对惹麻烦的恐惧。能够融入并看起来是组织一部分的黑客在社会工程学攻击中是最成功的。这种融入的能力通常被称为操纵的艺术。\n\
  \n人们通常是安全链中最薄弱的环节。成功的防御取决于建立良好的政策，并培训员工遵循这些政策。社会工程学是最难防御的攻击形式，因为公司不能仅依靠硬件或软件保护自己。\n\
  \n# 社会工程学攻击类型\n\n社会工程学可以分为两种常见类型：\n\n### 人工型\n基于人的社会工程学指的是通过与人之间的互动来获取所需信息。例如，拨打帮助台并尝试获取密码。\n\
  \n### 计算机型\n基于计算机的社会工程学指的是尝试获取所需信息的计算机软件。例如，向用户发送一封邮件并要求他们在网页上重新输入密码以确认。这种社会工程学攻击也称为\
  \ `钓鱼`（phishing)。\n\n## 冒充员工或合法用户\n在这种类型的社会工程学攻击中，黑客假装成系统的员工或合法用户。黑客可以通过假装成清洁工、员工或承包商来获得物理访问。进入设施后，黑客从垃圾桶、桌面或计算机系统中收集信息。\n\
  \n\n\n\n## 冒充重要用户\n在此类攻击中，黑客伪装成重要用户，例如高管或高层经理，他们需要立即协助以访问计算机系统或文件。黑客会使用恐吓手段，让低层员工（如帮助台工作人员）帮助他们获取系统的访问权限。大多数低级员工不会质疑一个看起来处于权威地位的人。\n\
  \n## 使用第三人称\n通过使用第三人称方法，黑客伪装成自己拥有来自授权源的许可可以使用某个系统。如果所谓的授权源正在休假或无法联系进行核实，这种攻击将尤为有效。\n\
  \n## 拨打技术支持\n致电技术支持寻求协助是一种经典的社会工程技术。帮助台和技术支持人员接受过帮助用户的训练，这使他们成为社会工程攻击的绝佳猎物。\n\n\
  # 窥视偷\n窥视偷是一种在用户登录系统时，通过在其背后（观察其肩膀）来收集密码的技术。黑客可以观察合法用户登录，然后使用该密码获取系统的访问。\n\n# 翻垃圾桶\n\
  翻垃圾桶涉及在垃圾中寻找写在纸张或计算机打印输出上的信息。黑客通常可以找到密码、文件名或其他机密信息。\n\n# 反向社会工程\n一种更高级的获取非法信息的方法被称为反向社会工程。使用这种技术，黑客创建一个看起来处于权威地位的人设，让员工向黑客索要信息，而不是相反。例如，黑客可以冒充帮助台员工，让用户向他们提供密码等信息。\n\
  \n![realworld.eps](img/realworld_fmt.gif)\n\n## 社会工程演示\n某计算机安全研究所现场演示的协调员展示了帮助台的脆弱性，他拨通了一家电信公司的电话，经过多次转接后到达帮助台。“今晚值班主管是谁？”“哦，是\
  \ Betty。”让我和 Betty 说话。[他被转接了]“嘿 Betty，今天过得不好？”“不，怎么了？”“你们系统崩溃了。”Betty 说：“我的系统没有崩溃，运行良好。”他说：“最好注销。”她注销了。他说：“现在重新登录。”她再次登录。他说：“我们这里甚至没有显示任何波动，显示没有变化。”他说：“再次注销。”她做了。“Betty，我必须以你的身份在这里登录，以查明你的\
  \ ID 发生了什么。把你的用户 ID 和密码给我。”\n\n于是，这位帮助台的高级主管告诉了他她的用户 ID 和密码。在几分钟内，黑客就能通过捕获流量和破解密码获取可能需要花费几天才能获得的信息。通过社会工程获取信息比通过技术方法要容易得多。\n\
  \n## 基于计算机的社会工程\n基于计算机的社会工程攻击包括以下内容：\n\n* 邮件附件\n* 虚假网站\n* 弹出窗口\n\n### 内部攻击\n如果黑客找不到其他攻击组织的方法，下一个最佳选择是通过入聘成为员工来渗透组织，或者寻找一个心不满的员工来协助攻击。内部攻击可能是非常强大的，因为员工拥有物理访问权限，并且能够在组织内自由移动。例如，某人穿着制服冒充送货人员，进入送货室或装卸平台。另一种可能性是有人冒充清洁小组成员，他们拥有进入建筑内部的权限，并且通常能够在办公室区域移动。作为最后手段，黑客可能会贿赂或以其他方式强制员工参与攻击，提供密码等信息。\n\
  \n### 身份盗窃\n黑客可以冒充员工或盗取员工的身份来实施攻击。在翻垃圾桶或窥视偷中收集的信息，结合伪造的 ID 卡，可以使黑客进入组织。创建一个可以不受质疑地进入建筑的人设是身份盗窃的目标。\n\
  \n### 钓鱼攻击\n钓鱼攻击涉及发送电子邮件，通常伪装成银行、信用卡公司或其他金融机构。该邮件要求收件者确认银行信息或重置密码或 码。用户点击邮件中的链接会被重定向到一个虚假网站。黑客随后能够捕获这些信息并将其用于财务收益或实施其他攻击。声称发送者拥有大量钱财但需要你帮助将钱汇出境的邮件就是钓鱼攻击的例子。这些攻击利用普通人，其目的是让他们向黑客提供银行账户访问代码或其他机密信息。\n\
  \n### 在线诈骗\n一些提供免费优惠或其他特殊交易的网站可能会诱骗受害者输入用户名和密码，这些密码可能与其访问工作系统时使用的相同。一旦用户在网站表单中输入信息，黑客就可以使用这些有效的用户名和密码。\n\
  \n邮件附件可用于向受害者系统发送恶意代码，可能会自动执行诸如软件记录器之类的程序来捕捉密码。病毒、木马和虫可以包含在精心设计的电子邮件中，以诱受害者打开附件。邮件附件被视为基于计算机的社会工程攻击。\n\
  \n这是一封试图说服接收者打开不安全附件的邮件示例：\n\n```\nMail server report.\n我们的防火墙确定包含蠕虫副本的电子邮件正从你的计算机发送。\n\
  现在这种情况在很多计算机上发生，因为这是一种新的病毒类型（网络蠕虫）。\n利用 Windows 中的新漏洞，这些病毒会在不知不觉的情况下感染计算机。\n在渗透计算机后，病毒会收集所有电子邮件地址并向这些电子邮件地址发送自身的副本。\n\
  请更新你的计算机和以消除蠕虫。\n顺颂商祺，\n客户支持\n```\n\n## URL 混淆\nURL（统一资源定位符）通常用于 Web 浏览器的地址栏。通俗地说，它就是网站地址。URL\
  \ 混淆是在一个看似合法的网站中隐藏一个虚假的 URL。例如，`204.13.144.2/Citibank` 网站看起来像是花银行的合法网站，但实际上不是。URL\
  \ 混淆用于钓鱼攻击和某些在线诈骗，以使诈骗看起来更真实。网站地址可能看起来是真实的财务名称或标志，但链接指向一个虚假网站。\n\n通过使用十六进制或十进制表示，恶意链接中的地址可以被混淆。例如，地址\
  \ `192.168.10.5` 以十进制看起来像 `3232238085`。同一个地址在 IP 十进制中看起来像 `C0A80A05`。这种转换需要你多次将\
  \ `3232238085` 除以 `16`。每次余数都会揭示地址，从最低位开始。\n\n以下是解释：\n\n```\n3232238085 / 16 = 202014880.3125\
  \ (.3125 × 16 = 5)\n202014880 / 16 = 12625930.0 (.0 × 16 = 0)\n12625930 / 16 = 789120.625\
  \ (.625 × 16 = 10 = A)\n789120 / 16 = 49320.0 (.0 × 16 = 0)\n49320.0 / 16 = 3082.5\
  \ (.5 × 16 = 8)\n3082 / 16 = 192.625 (.625 × 16 = 10 = A)\n192 / 16 = 12 = C\n```\n\
  \n\n\n\n了解如何对抗社会工程学对于任何认证伦理黑客来说都至关重要。有很多方法可以实现这一点。\n\n记录并强制执行的安全策略以及安全意识计划是任何信息安全计划中最关键的组成部分。如果良好的政策和程序没有对员工进行教学和强化，它们就是无效的。需要将政策传达给员工以强调其重要性，然后由管理层强制执行。在接受安全意识培训后，员工将致力于支持组织的安全策略。\n\
  \n公司安全策略应涵盖如何以及何时设置和终止账户、多久更改一次密码、谁可以访问什么信息，以及如何处理违反策略的行为。此外，策略还应说明上述任务的帮助热台程序，以及识别员工的流程（例如，使用员工编号或其他信息来验证密码更改）。纸质文档的销毁和物理访问限制是安全策略应涵盖的额外领域。最后，策略应涵盖技术领域，例如调制调器的使用和病毒控制。\n\
  \n强大的安全策略的优点之一是它消除了员工在面对黑客请求时做出判断的责任。如果请求的操作被策略禁止，员工有准则可以拒绝。\n\n社会工程学最重要的反击措施是员工教育。所有员工都应接受如何保护机密数据的培训。管理团队参与安全策略的制定和实施，以便他们能够充分理解并在整个组织范围内支持它。公司安全意识策略应要求所有新员工通过安全入职培训。应要求通过年度课程为员工提供复习和更新的信息。\n\
  \n增加参与度的另一种方法是通过包含安全意识文章的月度通讯报。\n\n## 总结\n\n在本章中，你学习了如何向伦理黑客迈第一步。以侦察、足迹扫描（footprinting）和社会工程学形式进行的信息收集，对于尽可能地了解目标是必要的。通过遵循信息收集方法，伦理黑客可以确保他们没有遗漏任何步骤和价值信息。在信息收集阶段花费的时间是非常值得的，这可以加速并产生成功的黑客攻击利用。\n\
  \n## 考试要点\n\n了解如何搜索公司的新闻、新闻稿、博客和新闻组帖子。搜索目标公司或组织的招聘公告，以确定系统版本和其他关键信息，例如防火墙或 `IDS`\
  \ 类型以及服务器类型。可以使用 `Google hacking` 从这些位置收集信息，使黑客能够快速定位有关目标的信息。\n\n利用所有可用的公共资源定位目标公司的信息，并收集有关其网络和系统安全的数据。\n\
  \n使用 `Yahoo! People search` 或其他互联网搜索引擎查找目标公司的员工。\n\n了解如何查询 `DNS` 的特定记录信息。了解如何使用\
  \ `DNSstuff`、`NSlookup` 或 `Sam Spade` 查询 `DNS` 服务器的记录信息，例如主机和 IP 地址。\n\n理解如何对个人或公司信息执行\
  \ `Whois` 查询。了解如何使用 `ARIN`、`LACNIC`、`RIPE NCC`、`APNIC` 和 `Whois` 数据库定位注册商和公司联系信息。\n\
  \n了解如何查找目标公司的外部和内部域名。你应该能够使用 `NeoTrace`, `VisualRoute` 进行跟踪。\n\n理解基于人类和基于计算机的社会工程学的区别。\n\
  \n## 复习题\n\n1. 哪些是区域注册？\nA. `APNIC`, `LACNIC`\nB. `MOSTNIC`, `RIPE NCC`\nC. `APNIC`,\
  \ `ARIN`\nD. `LACNIC`, `RIPE NCC`\n\n2. 以下哪项是不易被检测到的足迹扫描？\nA. `Whois`\nB. `Traceroute`\n\
  C. `Ping sweep`\nD. `Host scanning`\n\n3. 以下哪些工具用于足迹扫描？（选择 3 项）\nA. `Whois`\nB.\
  \ `Sam Spade`\nC. `NMAP`\nD. `SuperScan`\nE. `NSlookup`\n\n4. 足迹扫描后的下一个直接步骤是什么？\n\
  A. `Scanning`\nB. `Enumeration`\nC. `System hacking`\nD. `Bypassing an IDS`\n\n\
  5. 哪些是关于公司的良好信息来源？选择所有适用）\nA. `Newsgroups`\nB. `Job postings`\nC. `Company website`\n\
  D. `Press releases`\n\n6. `traceroute` 是如何工作的？\nA. 它使用 `ICMP` 目标不可达消息来获取路由器名称。\n\
  B. 它向路由器发送一个特制的 IP 数据包以确定距离目的地的跳数。\nC. 它使用一种会被网关拒绝的协议来确定位置。\nD. 它使用 `ICMP` 消息中的\
  \ `TTL` 值来确定距离发送者的跳数。\n\n7. 什么是足迹扫描？\nA. 测量伦理黑客的鞋码\nB. 通过收集目标信息来累积数据\nC. 扫描目标网络以检测操作系统\n\
  D. 绘制目标网络的物理布局\n\n8. `NSlookup` 可用于收集关于以下哪项的信息？\nA. 主机名和 IP 地址\nB. `Whois` 信息\n\
  C. `DNS` 服务器位置\nD. 域名服务器类型和操作系统\n\n9. 以下哪项是社会工程学的一种？\nA. `Shoulder surfing`\nB.\
  \ `User identification`\nC. `System monitoring`\nD. `Face-to-face communication`\n\
  \n10. 哪个是社会工程学的例子？\nA. 用户为潜在黑客推开办公室大门\nB. 电话帮助热台并说服他们重置用户账户密码\nC. 在受害者系统上安装硬件键盘记录器以捕获密码\n\
  D. 使用破解的密码访问数据库\n\n11. 防止社会工程攻击的最佳方法是？\nA. 安装防火墙防止端口扫描\nB. 配置 `IDS` 以检测入侵尝试\nC.\
  \ 增加帮助热台的人员\nD. 员工培训和教育\n\n12. 以下哪项是反向社会工程学的最佳示例？\nA. 黑客假装成权威人士以获取用户提供的信息。\nB. 帮助热台员工假装成权威人士。\n\
  C. 黑客试图让用户更改密码。\nD. 用户更改密码。\n\n\n\n\n## 复习习题\n\n13. 使用弹出窗口获取用户提供信息是哪种类型的社会工程攻击？\n\
  \nA. 基于人的 (Human-based)\nB. 基于计算机的 (Computer-based)\nC. 非技术的 (Nontechnical)\nD.\
  \ 强制性的 (Coercive)\n\n14. 黑客伪装成系统上的合法用户称为什么什么？\n\nA. 冒充 (Impersonation)\nB. 第三人授权\n\
  C. 帮助台 (Help desk)\nD. 合法用户 (Valid user)\n\n15. 执行安全策略的最佳理由是什么？\n\nA. 它增加了安全性。\n\
  B. 它使安全更难以执行。\nC. 它消除了员工做出判断的责任。\nD. 它降低了安全性。\n\n16. 为了获取密码和用户名而伪造网站是哪种类型的社会工程攻击？\n\
  \nA. 基于人的 (Human-based)\nB. 基于计算机的 (Computer-based)\nC. 基于网络的 (Web-based)\nD. 基于用户的\
  \ (User-based)\n\n17. 翻垃圾桶（Dumpster diving）可以被视为哪种类型的社会工程攻击？\n\nA. 基于人的 (Human-based)\n\
  B. 基于计算机的 (Computer-based)\nC. 物理访问 (Physical access)\nD. 基于纸的 (Paper-based)\n\n\
  18. 哪种信息收集工具会提供关于 Web 服务器操作系统的信息？\n\nA. `NSlookup`\nB. `DNSlookup`\nC. `tracert`\n\
  D. `Netcraft`\n\n19. 哪种工具是员工姓名和地址信息的良好来源？\n\nA. `NSlookup`\nB. `Netcraft`\nC. `Whois`\n\
  D. `tracert`\n\n20. 哪个工具只适用于上市公司？\n\nA. `EDGAR`\nB. `NSlookup`\nC. `Netcraft`\n\
  D. `Whois`\n\n### 复习习题答案\n\n1. D. 四个互联网注册机构分别是 `ARIN`（美国数字数字注册）、`RIPE NCC`（欧洲、中东和中亚部分）、`LACNIC`（拉丁美洲和加勒比互联网地址注册中心）和\
  \ `APNIC`（亚太网络信息中心）。\n2. A. `Whois` 是列出的唯一不会触发 `IDS` 告警或被组织检测到的工具。\n3. A, B, E.\
  \ `Whois`、`Sam Spade` 和 `NSlookup` 都用于被动收集目标信息。`NMAP` 和 `SuperScan` 是主机和网络扫描工具。\n\
  4. A. 根据 `CEH` 方法论，扫描发生在足迹扫描（footprinting）之后。枚举和系统破解发生在足迹扫描之后。绕过 `IDS`发生在攻击循环的后期。\n\
  5. A, B, C, D. 新闻组、职位公告、公司网站和新闻稿都是收集信息的良好来源。\n6. D. `Traceroute` 使用 `TTL` 值来确定路由器距离发送者有多少跳数。在正常情况下，每个路由器都会将\
  \ `TTL` 减 1。\n7. B. 足迹扫描是收集有关目标组织的信息。足迹扫描不是扫描目标网络或绘制目标网络的物理布局。\n8. A. `NSlookup`\
  \ 查询 `DNS` 服务器以获取主机名和 IP 地址等 `DNS` 记录。\n9. A. 在列出的选项中，窥视屏幕（shoulder surfing）被视为一种社会工程学。\n\
  10. B. 打电帮助台并说服他们重置用户账户密码是社会工程学的示例。扶门而入和安装键盘记录器是物理访问入侵的示例。使用破解的密码访问数据库是系统破解。\n11.\
  \ D. 员工培训和教育是防止社会工程攻击的最佳方法。\n12. A. 当黑客伪装成权威人物以获取用户主动索要信息时，这是反向社会工程的示例。\n13. B.\
  \ 弹出窗口是利用计算机从用户获取信息的方法。其他选项不需要访问计算机。\n14. A. `Impersonation` 涉及黑客伪装成系统上的合法用户。\n\
  15. C. 安全策略消除了员工对潜在社会工程攻击做出判断的责任。\n16. B. 网站伪造是基于计算机的社会工程攻击形式，因为它需要计算机来实施攻击。\n17.\
  \ A. 翻垃圾桶是基于人的社会工程攻击，因为它是由人类执行的。\n18. D. `Netcraft` 网站将尝试确定目标的操作系统和 Web 服务器类型。\n\
  19. C. `Whois` 将列出给定网站的联系人、地址和电话。\n20. A. `EDGAR` 是 `SEC` 的文件数据库，仅适用于上市公司。\n\n#\
  \ 第 3 章：收集网络和主机信息：扫描与枚举\n\n## 本章涵盖的 CEH 考试目标：\n\n* 定义端口扫描、网络扫描和漏洞扫描术语\n* 理解 `CEH`\
  \ 扫描方法论\n* 理解 ping 扫描（ping sweep）技术\n* 理解 `nmap` 命令开关\n* 理解 `SYN`、stealth、`XMAS`、`NULL`、`IDLE`\
  \ 和 `FIN` 扫描\n* 列出 `TCP` 通信标志类型\n* 理解拨号上网（war-dialing）技术\n* 理解横幅抓取（banner grabbing）和操作系统指纹识别\n\
  * 理解如何使用代理服务器发起攻击\n* 匿名代理是如何工作的？\n* 理解 HTTP 隧道技术\n* 理解 IP 欺骗技术\n* 什么是枚举？\n* 什么是空会（null\
  \ sessions）？\n* 什么是 `SNMP` 枚举？\n* 执行枚举涉及哪些步骤？\n\n扫描是主动破解的第一阶段，用于定位目标系统或网络。枚举是扫描后的后续步骤，用于识别计算机名称、用户名和共享。扫描和枚举在本章中一起讨论，因为许多工具同时执行这两个步骤。\n\
  \n### 扫描\n\n在侦察和信息收集阶段完成后，进行扫描。信息收集阶段尽可能完整，以确定要扫描的目标。扫描是定位网络上活跃并响应的过程。扫描也用于确定 IP\
  \ 地址。扫描工具用于收集有关系统的信息，如 IP 地址、操作系统和服务。\n\n表 3-1：扫描类型\n\n| 扫描类型 | 目的 |\n| --- | ---\
  \ |\n| 端口扫描 | 确定开放端口和服务 |\n| 网络扫描 | 识别网络中的 IP 地址 |\n| 漏洞扫描 | 发现目标系统的已知漏洞\n\n端口扫描是识别系统中可用\
  \ `TCP/IP` 端口的过程。端口扫描工具让黑客了解给定系统的可用服务。机器上的每个服务或应用程序都关联一个已知端口。端口分为三个范围：\n\n* 已知端口：0-1023\n\
  * 注册端口：1024-49151\n* 动态端口：49152-65535\n\n例如，端口扫描工具识别端口 80 开放，表明该系统运行着 Web 服务器。黑客需要熟悉已知端口号。\n\
  \n### 常见端口号\n\n在 Windows 系统上，已知端口号位于 `C:\\windows\\system32\\drivers\\etc\\services`\
  \ 文件中。`services` 是一个隐藏文件。要查看它，需要在 Windows 资源管理器中显示隐藏文件，并双击文件名用记事本打开。`CEH` 考试要求熟悉常用应用程序的已知端口号；请熟悉以下应用程序的端口号：\n\
  \n* `FTP`, 21\n* `Telnet`, 23\n* `HTTP`, 80\n* `SMTP`, 25\n* `POP3`, 110\n* `HTTPS`,\
  \ 443\n\n以下列表包含了一些并非 `CEH` 考试中但在实际渗透测试中有用的额外端口号：\n\n\n\n\n\n- `Global Catalog Server\
  \ (TCP)`, 3269 and 3268\n- `LDAP Server (TCP/UDP)`, 389\n- `LDAP SSL (TCP/UDP)`,\
  \ 636\n- `IPsec ISAKMP (UDP)`, 500\n- `NAT-T (UDP)`, 4500\n- `RPC (TCP)`, 135\n\
  - `ASP.NET Session State (TCP)`, 42424\n- `NetBIOS Datagram Service (UDP)`, 137\
  \ and 138\n- `NetBIOS Session Service (TCP)`, 139\n- `DHCP Server (UDP)`, 67\n-\
  \ `LDAP Server (TCP/UDP)`, 389\n- `SMB (TCP)`, 445\n- `RPC (TCP)`, 135\n- `DNS (TCP/UDP)`,\
  \ 53\n- `IMAP (TCP)`, 143\n- `IMAP over SSL (TCP)`, 993\n- `POP3 (TCP)`, 110\n-\
  \ `POP3 over SSL (TCP)`, 995\n- `RPC (TCP)`, 135\n- `RPC over HTTPS (TCP)`, 443\
  \ or 80\n- `SMTP (TCP/UDP)`, 25\n\n## 网络扫描\n网络扫描是一种识别网络上活动主机的程序，其目的是攻击这些主机，也可以作为网络安全评估。主机通过其单独\
  \ IP 地址进行识别。网络扫描工具尝试识别网络上所有存活或响应的主机及其对应的 IP 地址。\n\n### 漏洞扫描\n漏洞扫描是主动识别网络上计算机系统漏洞的过程。通常，漏洞扫描器首先识别操作系统和版本号，包括可能已安装的服务包。然后，扫描器会识别操作系统中的缺陷或漏洞。在随后的攻击阶段，黑客可以利用这些缺陷来获取系统的访问权限。\n\
  \n虽然扫描可以快速识别网络上哪些主机正在监听并处于状态，但它也是被入侵检测系统（`IDS`）识别的快速方法。扫描工具探测 `TCP/IP` 端口以寻找开放端口和\
  \ IP 地址，这些探测可以被大多数安全入侵检测工具识别。网络扫描和漏洞扫描通常也能被检测，因为扫描器必须通过网络与目标系统进行交互。\n\n取决于扫描应用程序的类型和扫描速度，`IDS`\
  \ 将检测到扫描并将其标记为 `IDS` 事件。某些扫描工具具有不同的模式来尝试对抗 `IDS`，并且更有可能在不被发现的情况下进行扫描。作为一名 `CEH`，你的工作是尽可能收集多的信息并尝试保持不被发现。\n\
  \n## CEH 扫描方法论\n作为一名 `CEH`，你应当熟悉图 3-1 所示的扫描方法论。这种方法论是黑客扫描网络的过程。它确保了没有任何系统或漏洞被忽略，并确保黑客收集了执行攻击所需的所有信息。\n\
  \n我们将在本书中介绍这种扫描方法论的各个阶段，从下一节的前三个步骤开始——检查系统是否存活、检查开放端口以及识别服务。\n\n图 3-1: CEH 扫描方法论\n\
  \n![f0301.eps](img/f0301_fmt.gif)\n\n### Ping 扫描技术\n`CEH` 扫描方法论从检查网络上的存活系统开始，这意味着这些系统对探测或连接请求有响应。确定系统是否存活的最简单（但不一定最准确）的方法是对\
  \ IP 地址范围进行 ping 扫描。所有响应 ping 回复的系统都被认为在网络上是存活的。ping 扫描也被称为互联网控制消息协议（`ICMP`）扫描，因为\
  \ `ICMP` 是 `ping` 命令使用的协议。\n\n`ICMP` 扫描（或 ping 扫描）是向网络上的所有主机发送 `ICMP` 请求或 `ping`\
  \ 包，以确定哪些主机已上线并对 ping 响应。`ICMP` 最初是用于在互联网上的主机之间发送测试消息和错误消息的协议。它已演变为由每个操作系统、路由器、交换机或基于网协议（`IP`）的设备使用的协议。使用\
  \ `ICMP` 回显请求（Echo request）和回显应（Echo reply）作为主机之间连接测试的能力通过 `ping` 命令内置于每个启用 `IP`\
  \ 的设备中。这是一种检查两个主机之间连接性的快速粗略测试，被广泛用于故障排除。\n\n`ICMP` 扫描的一个处是它可以并行运行，这意味着所有系统同时被扫描；因此它可以在整个网络上快速运行。大多数黑客工具包含\
  \ ping 扫描选项，这本质上意味着对网络上的每个主机执行 `ICMP` 请求。响应 ping 响应的系统在网络上存活并正在监听。练习 3-1 显示了如何使用内置的\
  \ `windows` 工具执行 ping 扫描。\n\n这种方法的一个严重问题是，个人防火墙软件和基于网络的防火墙可以阻止系统响应 ping 扫描。越来越多的系统配置了防火墙软件，它们会阻止\
  \ ping 尝试并通知用户网络上正在运行扫描程序。另一个问题是计算机必须开启才能被扫描。\n\n![realworld.eps](img/realworld_fmt.gif)\n\
  \n### 扫描攻击的迹象\nBob 在出差期间连接网络并在笔记本电脑上工作。他正在使用酒店的免费无线接入访问互联网。正他他发送电子邮件时，他注意到 Windows\
  \ XP 系统托盘出现了一个弹窗。窗口显示“Windows 检测到并阻止了针对你的计算机的入侵尝试”。他关闭了弹窗继续写邮件。随后他又看到了另一个类似消息的弹窗。他开始担心自己的电脑被黑客入侵了。他决定关掉笔记本电脑，以便无法进行连接尝试。\n\
  \n##### 黑客工具\nPinger、Friendly Pinger 和 `WS_Ping_Pro` 都是执行 `ICMP` 查询的工具。你应该熟悉所有这些工具。\n\
  \n练习 3-1：使用 Windows Ping\n使用 `Windows` 内置的 `ping` 命令测试与另一个系统的连接性：\n\n1. 在 `Windows`\
  \ 中打开命令提示符。\n2. 输入 `ping www.microsoft.com`。\n\n![g0301.tif](img/g0301_fmt.jpg)\n\
  \n超时（timeout）表示远程未响应、关闭或 ping 被拦截。响应（reply）表示系统存活并对 `ICMP` 请求有响应。\n\n### 检测 ping\
  \ 扫描\n几乎任何 `IDS` 或入侵防御系统（`IPS`）都会检测并警告安全管理员网络上正在发生 ping 扫描。大多数防火墙和代理服务器阻止 ping 响应，因此黑客无法仅通过\
  \ ping 扫描准确判断系统是否可用。如果系统对 ping 扫描没有响应，必须使用更深入端口扫描。\n\n## 扫描端口和识别服务\n检查开放端口是 `CEH`\
  \ 扫描方法论的第二步。端口扫描是检查开放端口的方法。端口扫描的过程涉及探测主机的每个端口以确定哪些端口是开放的。相比 ping 扫描，端口扫描通常能提供关于主机和系统漏洞更有价值的信息。\n\
  \n服务识别是扫描方法论的第三步；它通常使用与端口扫描相同的工具执行。通过识别开放端口，黑客通常还可以识别与该端口关联的服务。记住本章之前讨论的已知端口号。\n\
  \n### 端口扫描防御措施\n防御措施是安全管理员用于检测并可能阻止网络上主机进行端口扫描的流程或工具集。应实施以下防御措施以防止黑客在端口扫描期间获取信息：\n\
  \n\n\n\n\n-   应当遵循适当的安全架构，例如实施 `IDS` 和防火墙（`firewalls`）。\n-   伦理黑客使用他们的工具集来测试已实现的扫描对策措施。一旦部署了防火墙，就应该对网络上的主机运行端口扫描工具，以确定防火墙是否正确检测并停止端口扫描活动。\n\
  -   防火墙应该能够检测到由端口扫描工具发送的探测。防火墙应执行状态检测检测，这意味着它会检查数据包的内容，而不仅仅是 `TCP` 头部，以确定流量是否允许通过防火墙。\n\
  -   应使用网络 `IDS` 来识别某些常用黑客工具所使用的 `OS` 探测方法。\n-   应仅保持需要的端口开放。其余端口应被过滤或阻塞。\n-   应对对使用这些系统的组织人员进行适当的安全意识培训。他们还应该了解他们需要遵守的各种安全策略。\n\
  \n## nmap 命令开关\n\n`nmap` 是一个免费的开源工具，可以快速、高效地执行 ping 扫描、端口扫描、服务识别、IP 地址检测和操作系统检测。`nmap`\
  \ 的优点可以在单个会话中扫描大量机器。它支持许多操作系统，包括 `Unix`、`Windows` 和 `Linux`。\n\n由 `nmap` 扫描确定的端口状态可以是\
  \ `open`、`filtered` 或 `unfiltered`。`open` 意味着目标机器接受该端口上的传入请求。`filtered` 意味着防火墙或网络过滤器正在筛选该端口并防止\
  \ `nmap` 其是否开放。`unfiltered` 意味着端口确定为关闭，且没有防火墙或过滤器干扰 `nmap` 的请求。\n\n`nmap` 支持多种类型的扫描。表\
  \ 3-2 详细说明了一些常见的扫描方法。\n\n### 表 3-2： Nmap 扫描类型\n\n| nmap 扫描类型 | 描述 |\n| --- | ---\
  \ |\n| TCP connect | 攻击者与目标系统建立完整的 `TCP` 连接。最可靠的扫描类型，但最容易被检测。`open` 端口用 `SYN/ACK`\
  \ 回复，而关闭端口用 `RST/ACK` 回复。 |\n| XMAS tree scan | 攻击者通过发送 `XMAS`-树数据包来检查 `TCP` 服务，之所以命名是因为所有“灯”都亮了，意味着\
  \ `FIN`、`URG` 和 `PSH` 标志被设置（这些标志的意义将在本章稍后讨论）。关闭端口用 `RST` 标志回复。 |\n| SYN stealth\
  \ scan | 这种扫描被称为半开放扫描。攻击者发送 `SYN` 包并接收 `SYN/ACK` 回复。如果端口关闭，则收到 `RST`。这种扫描具有隐蔽性，因为它不建立完整的\
  \ TCP 握手。 |\n| Null scan | 这种扫描不设置任何标志。端口将被确定为关闭的，且没有防火墙或过滤器干扰 `nmap` 的请求。 |\n|\
  \ Windows scan | 这种扫描类似于半开放扫描，可以绕过防火墙。 |\n| ACK scan | 这种扫描用于映射防火墙规则。在 `Unix` 系统上有效。\
  \ |\n\n`nmap` 命令有许多开关来执行不同类型的扫描。常用的开关列在 表 3-3 中。\n\n### 表 3-3：  nmap 命令开关\n\n| nmap\
  \ 命令开关 | 执行的操作 |\n| --- | --- |\n| -sT | TCP 连接扫描 |\n| -sS | SYN 扫描 |\n| -sF | FIN\
  \ 扫描 |\n| -sX | XMAS 树扫描 |\n| -sN | Null 扫描 |\n| -sP | Ping 扫描 |\n| -sU | UDP 扫描\
  \ |\n| -sO | 操作系统扫描 |\n| -sA | ACK 扫描 |\n| -sW | Windows 扫描 |\n| -sR | RPC 扫描 |\n\
  | -sL | 列表/DNS 扫描 |\n| -sI | 空闲扫描 |\n| -Po | 不 ping |\n| -sPT | TCP ping |\n| -sPS\
  \ | SYN ping |\n| -PI | ICMP ping |\n| -PB | TCP 和 ICMP ping |\n| -PT | ICMP 时间戳\
  \ |\n| -PM | ICMP 网络掩码 |\n| -oN | 正常输出 |\n| -oX | XML 输出 |\n| -oG | 可 grep 的输出 |\n\
  | -oA | 所有输出 |\n| -T0 | 极速扫描，两次扫描间隔 300 秒 |\n| -T1 | 隐秘扫描，两次扫描间隔 15 秒 |\n| -T2 |\
  \ 礼貌扫描，两次扫描间隔 0.4 秒 |\n| -T3 | 正常扫描 |\n| -T4 | 激进扫描，超时 300 秒，每 1.25 秒探测一次 |\n| -T5\
  \ | 疯狂扫描，超时 75 秒，每 0.3 秒探测一次 |\n\n\n\n\n\n`URG` 紧急。数据包中的数据必须快速处理。\n\n`FIN` 完成。不再有传输。\n\
  \n`RST` 重置。重置连接。\n\n黑客可以尝试通过使用标志（flags）而不是完成正常的 TCP 连接来绕过检测。表 3-4 中的 TCP 扫描类型被某些扫描工具用于，通过设置一个或多个标志来诱导系统响应。\n\
  \n### 表 3-4: TCP 扫描类型\n\n| XMAS 扫描 | 黑客发送的标志 |\n| --- | --- |\n| XMAS 扫描 | 所有标志均设置\
  \ (ACK, RST, SYN, URG, PSH, FIN) |\n| FIN 扫描 | FIN |\n| NULL 扫描 | 未设置任何标志 |\n| TCP\
  \ 连接/全打开扫描 | SYN，然后是 ACK |\n| SYN 扫描 / 半打开扫描 | SYN，然后是 RST |\n\n### 攻击工具\n\n`IPEye`\
  \ 是一个 TCP 端口扫描器，可以执行 `SYN`、`FIN`、`Null` 和 `XMAS` 扫描。它是一个命令行工具。\n\n`IPEye` 探测目标系统的端口并响应\
  \ `closed`、`reject`、`drop` 或 `open`。`Closed` 表示对面有一台计算机，但它没有在该端口监听。`Reject` 表示防火墙拒绝了该端口的连接（发送重置信号）。`Drop`\
  \ 表示防火墙丢弃了所有到达该端口的数据包，或者对面没有计算机。`Open` 表示某种服务在该端口上监听。这些响应有助于黑客识别响应的系统类型。\n\n`IPSecScan`\
  \ 是一个工具，可以扫描单个 IP 地址或地址范围，寻找启用了 IPSec 的系统。\n\n`NetScan Tools Pro`、`hping2`、`KingPingicmpenum`\
  \ 和 `SNMP Scanner` 都是扫描工具，也可以用于操作系统指纹识别（后文将讨论）。\n\n`Icmpenum` 不仅使用 `ICMP Echo` 包探测网络，还使用\
  \ `ICMP Timestamp` 和 `ICMP Information` 包。此外，它还支持对响应包进行欺骗和嗅探。当防火墙拦截 `ICMP Echo`\
  \ 包但未能拦截 `Timestamp` 或 `Information` 包时，`Icmpenum` 是扫描网络的极佳工具。\n\n`hping2` 工具值得关注，是因为它除了操作系统指纹识别外，还包含许多其他功能，如\
  \ TCP、用户数据报协议 (UDP)、ICMP 和原始 IP ping 协议、traceroute 模式以及在源和目标系统之间发送文件的能力。\n\n`SNMP\
  \ Scanner` 允许你扫描执行 ping、DNS 和简单网络管理协议 (SNMP) 查询的主机范围或列表。\n\n练习 3-2 显示了如何使用 AngryIP\
  \ 扫描执行端口扫描。\n\n### 练习 3-2：免费 IPTools 端口扫描\n\n使用端口扫描工具确定活动活动主机的监听端口：\n\n1. 从 [www.angryip.org/w/Download](http://www.angryip.org/w/Download)\
  \ 下载 `Angry IP Scanner`。\n2. 在 `Host` 或 `IP Address` 字段输入目标系统的 IP 地址，或输入你实验室系统的范围或\
  \ IP 地址，然后点击 `Start` 对标准端口进行常规（全连接）扫描。\n\n![g0302.tif](img/g0302_fmt.jpg)\n\n##\
  \ 拨号技术\n\n拨号攻击（War-Dialing）是指拨号调制解调器号码以寻找开启调制解调器连接的过程，该连接提供远程访问以便对目标系统发起攻击。“拨号攻击”一词源于互联网早期，当时大多数公司通过拨号调制解调器连接到互联网。拨号攻击被纳入一种扫描方法，是因为它可以找到另一个可能比主互联网连接安全性更弱的网络连接。许多组织设置了远程访问调制解调器，这些设备现在已经过时，但未能移除这些远程访问服务器。这为黑客提供了一个进入网络的简单途径，且安全机制弱得多。例如，许多远程访问系统使用密码验证协议\
  \ (`PAP`)，它以明文发送密码，而不是使用加密密码的新型虚拟专用网络 (`VPN`) 技术。\n\n拨号攻击工具的工作原理是：公司对拨入端口的控制没有像防火墙那样严格，而且连接调制解调器的机器随处可见，即使那些解调器已不再使用。许多服务器仍然保留有连接电话线的调制解调器，作为主互联网连接失败的备份。这些可用的调制解调器连接可以被拨号攻击程序用于远程访问系统和内部网络。\n\
  \n![realworld.eps](img/realworld_fmt.gif)\n\n### 使用遗忘的调制解调器连接进行拨号\n\n几年前，我为一家金融服务公司进行网络安全审计。他们让我对现场进行实地安全审计巡查。当我经过营销部门的一个办公桌时，我注意到有一根电话线从桌子周围伸出来连接到墙上的插座。我询问了调制解调器的使用情况，因为我试图确定电话线缆的原因。他们告诉我，他们以前在某些计算机上使用拨号上网接入互联网，但两年前他们将整个办公室切换到了高速\
  \ `T1` 连接。当我们进一步探索时，结果发现使用那台电脑的员工仍然通过拨号连接使用 `AOL` 来检查她的个人邮箱账户。这让每个人都非常惊讶，当安装新的互联网连接时，没有人检查过是否将所有的拨号连接都移除。这就是拨号攻击在某些情况下仍然有效的典型例子。\n\
  \n### 攻击工具\n\n`THC-Scan`、`PhoneSweep` 和 `TeleSweep` 是识别电话号码并拨号目标以与计算机连接的工具。这些工具通常通过预设的常用用户名和密码来尝试访问系统。大多数远程访问拨入连接没有密码保护，或者使用非常原始的安全措施。\n\
  \n## 标志抓取与操作系统指纹识别\n\n标志抓取和操作系统识别（也可以定义为 TCP/IP 栈指纹识别）是 CEH 扫描方法的第四步。指纹识别过程允许黑客识别网络上特别脆弱或高价值的目标。黑客正在寻找访问系统或网络的简单方法。标志抓取是建立连接并读取应用程序发送的标志或响应的过程。许多电子邮件、FTP\
  \ 和 Web 服务器会对 `telnet` 连接响应软件名称和版本。这有助于黑客对操作系统和应用程序进行指纹识别。例如，Microsoft Exchange\
  \ 邮件服务器只会安装在 Windows OS 上。\n\n主动栈指纹是最常见的指纹识别形式。它涉及向系统发送数据以观察系统的响应。它基于不同的操作系统厂商实现\
  \ TCP 栈的方式不同，响应会根据操作系统而异。然后将响应与数据库进行对比以确定操作系统。主动栈指纹是可检测的，因为它反复尝试连接同一个目标系统。\n\n被动栈指纹识别更具隐蔽性，它通过检查网络流量来确定操作系统。它使用嗅探技术而非扫描技术。被动栈指纹识别通常不会被\
  \ IDS 或安全系统检测到，但准确性不如主动指纹识别。\n\n\n\n\n\n`SolarWinds Toolset`、`Queso`、`Harris Stat`\
  \ 和 `Cheops` 都是网络管理工具，可用于检测操作系统、绘制网络拓图、列出网络上运行的服务、执行通用端口扫描等。\n\n这些工具可以在 GUI 界面中绘制整个网络的拓图，包括路由器、服务器、主机和防火墙。大多数此类工具可以发现\
  \ IP 地址、主机名、服务、操作系统和版本信息。\n\n`Netcraft` 和 `HTTrack` 是用于识别操作系统指纹的工具。这两者都用于确定操作系统和\
  \ Web 服务器软件的版本号。\n\n`Netcraft` 是一个网站，通过定期轮询 Web 服务器来确定操作系统版本和 Web 服务器软件版本。`Netcraft`\
  \ 可以为黑客识别 Web 服务器软件中的漏洞提供实的信息。此外，`Netcraft` 还备有一个反钓鱼工具栏和 Web 服务器验证工具，你可以使用它们来确保你使用的是真实的\
  \ Web 服务器而不是伪造的服务器。练习 3-3 显示了如何使用 `Netcraft` 识别操作系统或 Web 服务器。\n\n`HTTrack` 会整理原始网站的相对链接结构。你在浏览器中打开镜像网站的页面，然后就可以像在线查看一样通过链接跳转来浏览网站。`HTTrack`\
  \ 还可以更新现有的镜像站点并恢复中断的下载。\n\n### 练习 3-3：使用 Netcraft 识别 Web 服务器的操作系统\n\n1. 打开网页浏览器并访问\
  \ `Netcraft` 网站：`[www.netcraft.com](http://www.netcraft.com)`。\n\n![g0303.tif](img/g0303_fmt.jpg)\n\
  \n2. 在屏幕左上角的 `What’s That Site Running?`（该站点正在运行什么？）字段中输入网站名称。\n\n3. 向滚动到 `Hosting\
  \ History`（托管历史），查看服务器上运行着什么操作系统和 Web 服务器软件。\n\n## 匿名扫描\n\n准备代理服务器是 CEH 扫描方法论的最后一步。代理服务器是指在黑客和目标计算机之间充当中间人的计算机。\n\
  \n使用代理服务器可以让黑客在网络上变得匿名。黑客首先连接到代理服务器，然后通过现有的代理连接请求连接到目标计算机。本质上，是代理在请求访问目标计算机的权限，而不是黑客的计算机。这让黑客能够匿名浏览\
  \ Web 或隐藏其攻击。\n\n## 破解工具\n\n`SocksChain` 是一个让黑客通过代理服务器链进行攻击的工具。此的主要目的是隐藏黑客的真实 IP\
  \ 地址，从而最大限地减少被检测的机会。当黑客通过多个代理服务器串联工作时，定位黑客会变得困难得多。通过多个代理服务器的日志跟踪攻击者的 IP 地址是一项复杂且繁琐的工作。如果其中一个代理服务器的日志文件丢失或不完整，链就会断，黑客的\
  \ IP 地址将保持匿名。\n\n`Anonymizers`（匿名器）是利用充当 Web 代理服务器的网站来尝试使 Web 浏览匿名的服务。第一个匿名化软件工具由\
  \ `Anonymizer.com` 开发；由 `Lance Cottrell` 于 1997 年创建。匿名化工具会在用户上网时移除其计算机上的所有身份识别信息，从而确保用户的隐私。\n\
  \n要匿名访问网站，黑客将网站地址输入匿名化软件中，由匿名化工具对请求进行去标识化处理。\n\n### 练习 3-3：使用 Netcraft 识别 Web 服务器的操作系统\n\
  \n1. 打开网页浏览器并访问 `Netcraft` 网站：`[www.netcraft.com](http://www.netcraft.com)`。\n\n\
  ![g0303.tif](img/g0303_fmt.jpg)\n\n2. 在屏幕左上角的 `What’s That Site Running?`（该站点正在运行什么？）字段中输入网站名称。\n\
  \n3. 向滚动到 `Hosting History`（托管历史），查看服务器上运行着什么操作系统和 Web 服务器软件。\n\n\n\n\n\nSMB Auditing\
  \ Tool 是一款用于 Windows 和服务器消息块（`SMB`）平台的密码审计工具。Windows 使用 `SMB` 在客户端和服务器之间进行通信。SMB\
  \ Auditing Tool 能够识别 Windows 系统上的用户名并破解密码。\n\nNetBIOS Auditing Tool 是另一个 NetBIOS\
  \ 枚举工具。它被用于对运行 NetBIOS 文件共享服务的远程服务器进行各种安全检查。\n\n## 空会话 (Null Sessions)\n\n当你在不提供任何用户名或密码的情况下登录系统时，就会发生空会话。NetBIOS\
  \ 空会话是一种存在于通用互联网文件系统（`CIFS`）或 `SMB` 中的漏洞，具体取决于操作系统。\n\n![note.eps](img/note_fmt.gif)\n\
  \nMicrosoft Windows 使用 `SMB`，而 Unix/Linux` 系统使用 `CIFS`。\n\n一旦黑客使用空会话对系统建立 NetBIOS\
  \ 连接，他们就可以利用 Null 用户账户轻松地获取所有用户名、组、共享、权限、策略、服务等的完整转储数据。Windows 中的 `SMB` 和 `NetBIOS`\
  \ 标准包含了通过 `TCP` 端口 `139` 返回系统信息的 API。\n\n将 NetBIOS 空会话连接到 Windows 系统的一种方法是使用隐藏的进程间通信共享（`IPC$`）。该隐藏共享可以通过\
  \ `net use` 命令访问。如前所述，`net use` 命令是 Windows 内置命令，用于连接到另一台计算机上的共享。空引号（`\"\"`）表示你想在没有用户名和密码的情况下进行连接。要使用\
  \ `net use` 命令对 IP 地址为 `192.21.7.1` 的系统使用内置匿名用户账户和空密码建立 NetBIOS 空会话，语法如下：\n\n```\n\
  C: > net use \\\\192.21.7.1 \\IPC$\" /u:\"\"\n```\n\n一旦成功完成 `net use` 命令，黑客就获得了一个通道，其上可以使用其他黑客工具和技术进行攻击。\n\
  \n作为一名 CEH（认证黑客专家），你需要了解如何防御 NetBIOS 枚举和空会话。我们将在下一节中讨论这一点。\n\n## NetBIOS 枚举与空会话防御措施\n\
  \nNetBIOS 空会话使用目标机器上的特定端口号。空会话需要访问 `TCP` 端口 `135`、`137`、`139` 和/或 `445`。一种防御措施是在目标系统上关闭这些端口。这可以通过在网络连接属性中取消接口上的\
  \ `TCP/IP WINS` 客户端，通过禁用单个主机上的 `SMB` 服务来实现。实施此防御措施，请执行以下步骤：\n\n1. 打开网络连接属性。\n2.\
  \ 点击 `TCP/IP` 然后点击`Properties”（属性）按钮。\n3. 点击`Advanced”（高级）按钮。\n4. 在 `WINS` 选项卡上，选择`Disable\
  \ NetBIOS Over TCP/IP`禁用 TCP/IP 上的 NetBIOS）。\n\n安全管理员还可以直接编辑`Registry`注册表）以限制匿名用户登录。实施此防御措施，请遵循以下步骤：\n\
  \n1. 打开 `regedt32` 并导航到 `HKLM\\SYSTEM\\CurrentControlSet\\LSA`。\n2. 选择 `Edit ⇒ Add\
  \ Value`。输入以下值：\n   - 值名称：`RestrictAnonymous`\n   - 数据类型：`REG_WORD`\n   - 值：`2`\n\
  \n最后，可以将系统升级到 Windows XP 和最新的 Microsoft 安全补丁，这将防止 NetBIOS 空会话漏洞的发生。\n\n## SNMP 枚举\n\
  \nSNMP 枚举是使用 SNMP 枚举目标系统上的用户账户的过程。SNMP 使用两种主要类型的软件组件进行通信：位于网络设备上的`SNMP agent` SNMP\
  \ 代理，以及与代理通信的`SNMP management station` SNMP 管理工作站。\n\n几乎所有网络基础设施设备（如路由器和交换机，包括 Windows\
  \ 系统）都包含一个管理系统或设备的 `SNMP agent`。`SNMP management station` 向代理发送请求。\n\n（注：此处原文似乎存在重复或逻辑断层，以下内容根据原文内容逻辑进行翻译）\n\
  \nNetBIOS 空会话使用目标机器上的特定端口号。空会话需要访问 `TCP` 端口 `135`、`137`、`139` 和/或 `445`。一种防御措施是在目标系统上关闭这些端口。这可以通过在网络连接属性中取消接口上的\
  \ `TCP/IP WINS` 客户端，通过禁用单个主机上的 `SMB` 服务来实现。实施此防御措施，请执行以下步骤：\n\n1. 打开网络连接属性。\n2.\
  \ 点击 `TCP/IP` 然后点击`Properties`属性）按钮。\n3. 点击`Advanced`高级按钮。\n4. 在 `WINS` 选项卡上，选择`Disable\
  \ NetBIOS Over TCP/IP`禁用 TCP/IP 上的 NetBIOS）。\n\n安全管理员还可以直接编辑`Registry`注册表以限制匿名用户登录。实施此防御措施，请遵循以下步骤：\n\
  \n1. 打开 `regedt32` 并导航到 `HKLM\\SYSTEM\\CurrentControlSet\\LSA`。\n2. 选择 `Edit ⇒ Add\
  \ Value`。输入以下值：\n   - 值名称：`RestrictAnonymous`\n   - 数据类型：`REG_WORD`\n   - 值：`2`\n\
  \n最后，可以将系统升级到 Windows XP 和最新的 Microsoft 安全补丁，这将防止 NetBIOS 空会话漏洞的发生。\n\n## SNMP 枚举\n\
  \nSNMP 枚举是使用 SNMP 枚举目标系统上的用户账户的过程。SNMP 使用两种主要类型的软件组件进行通信：位于网络设备上的`SNMP agent` SNMP\
  \ 代理，以及与代理通信的`SNMP management station` SNMP 管理工作站。\n\n几乎所有网络基础设施设备（如路由器和交换机，包括 Windows\
  \ 系统）都包含一个管理系统或设备的 `SNMP agent`。\n\nSNMP 管理工作站向代理发送请求。\n\n（注：原文后续段落存在大量重复和混乱，翻译已按原文字面意思保留结构）\n\
  \n\n\n\n\n### 2. 在连接（Connection）菜单中，选择 `Authenticate`（验证）。在相应的框中输入用户名、密码和域名。你可以使用\
  \ `Guest` 帐户或任何其他域帐户。\n\n### 3. 身份验证成功后，通过从浏览（Browse）菜单中选择 `Search`（搜索）选项来枚举用户和内置组。\n\
  \n## 黑客工具\n\n`User2SID` 和 `SID2User` 是两个命令行工具，用于查找 Windows 服务标识符（通过用户名输入查找 SID，反之亦然）。\n\
  \n`Enum` 是一个命令行枚举工具。它利用空会话（null sessions），并可以检索用户名、机器名、共享情况、组和成员列表、密码以及本地安全策略（Local\
  \ Security policy）信息。`Enum`  same 能够对单个账户进行暴力破解字典攻击。\n\n`UserInfo` 是一个用于收集用户名的命令行工具，也可用于创建新用户账户。\n\
  \n`GetAcct` 是一个基于 GUI 的工具，用于枚举系统上的用户账户。\n\n`Smbbf` 是一个 SMB 暴力破解工具，尝试确定用户账户以及空密码账户。\n\
  \n## 总结\n\n在完成信息收集阶段后，扫描和枚举是黑客过程中的后续步骤。扫描和枚举工具通常是主动信息收集工具，因此会导致黑客被发现。出于此原因，存在许多工具和技术用以减少被检测的机会，并降低黑客被识别的概率。\n\
  \n在扫描和枚举阶段，会发现有关主机和目标网络的信息。作为下一步，将枚举出的主机和网络信息将用于开始攻击目标系统或网络。下一章将重点介绍系统黑客和获取目标系统的访问。\n\
  \n## 考试要点\n\n- 了解三种扫描类型及其防御措施。端口扫描、网络扫描和漏洞扫描是三种扫描类型。实施防火墙，通过阻止 ping 扫描（ping sweeps）和如\
  \ `nmap` 等端口扫描工具来防止内部系统被扫描。IDS 和 IPS 可以提醒管理员网络上正在发生的扫描。\n\n- 了解如何确定网络上哪些系统是存的。了解如何使用\
  \ ICMP 查询工具进行 ping 扫描以确定哪些系统正在响应。ping 扫描具有局限性，某些系统可能对 ICMP 查询没有响应。\n\n- 了解如何使用 `nmap`\
  \ 进行端口扫描。学习使用 `nmap` 命令执行 `nmap` 扫描的开关。例如，`nmap -sS` 执行 SYN 扫描。\n\n- 理解不同扫描类型的用途和局限性。确保你熟悉\
  \ TCP 连接、SYN、NULL、IDLE、FIN 和 XMAS 扫描，以及每种类型应在何时使用。\n\n- 理解 TCP 三次握手的过程。TCP 连接过程始于向目标系统发送\
  \ `SYN` 包。目标系统用 `SYN+ACK` 包作为响应，源系统向目标回传一个 `ACK` 包。这完成了一次成功的 TCP 连接。\n\n- 了解战争拨号（war\
  \ dialing）的用途。战争拨号用于测试拨入远程访问系统的安全性。随机拨打号码尝试建立不安全的调制调器连接并获取网络访问。\n\n- 了解如何使用主动和被动方法进行操作系统指纹识别。主动指纹识别意味着向系统发送请求查看其响应（例如\
  \ banner 抓取 banner grabbing）。被动指纹识别是检查发送和来自系统的流量以确定操作系统。\n\n- 了解如何使用匿名代理、HTTP 隧道和\
  \ IP 欺骗来实现匿名。使用网站匿名器隐藏源地址，使访问网页的系统看起来是匿名的。HTTP 隧道和 IP 欺骗是黑客可能使用的隐藏物理地址或协议的方法。它们对于规避防火墙和混淆黑客身份或行踪非常有用。\n\
  \n- 理解如何枚举用户账户。枚举涉及通过 SMB/CIFS 或 NetBIOS 漏洞对系统建立活动连接并查询系统信息。\n\n- 注意系统中可以枚举的信息类型以及枚举防御措施。黑客枚举的信息类型包括网络资源和共享、用户和组以及应用程序和\
  \ banner。使用防火墙拦截端口 `135` 和 `139`，或修复注册表以防止空会话。关闭 SNMP 服务，或更改默认的读取和读取/写入社区名称。\n\n\
  - 理解空会话（null sessions）。使用空密码连接到系统被称为空会话。黑客经常使用空会话连接到目标系统，然后在系统中运行枚举工具。\n\n- 了解枚举工具的类型以及如何识别漏洞账户。可以使用\
  \ `SNMPUtil` 和 `Enum` 等工具执行 NetBIOS 和 SNMP 枚举。可以使用 `User2SID`、`SID2User` 和 `UserInfo`\
  \ 等工具识别漏洞用户账户。\n\n- 了解如何在 Windows 2000 上执行 DNS 区域传输。可以使用 `NSlookup` 执行 DNS 区域传输。\n\
  \n## 复习题\n\n1. FTP 使用哪个端口号？\nA. 21\nB. 25\nC. 23\nD. 80\n\n2. HTTPS 使用哪个端口号？\nA.\
