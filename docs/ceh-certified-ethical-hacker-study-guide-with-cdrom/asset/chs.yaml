  A. 列出帮助和文档\nB. 手动配置程序\nC. 执行系统维护\nD. 安装程序\n\n### 13. Linux 系统源文件位于哪个目录？\nA. source\n\
  B. `src`\nC. sys\nD. system\n\n## 14. 用于列出所有当前运行进程的 Linux 命令是什么？\nA. `ps`\nB. `list\
