  C. 一个从 CD 运行应用程序的 Linux 工具\nD. 一个制作 CD 的 Linux 应用程序\n\n### 6. 哪种攻击可以伪装成 LKM？\nA.\
  \ DoS\nB. 木马病毒 (Trojan)\nC. 垃圾邮件病毒\nD. Rootkit\n\n### 7. 下列哪项是使用 Linux 的原因？\nA.\
  \ Linux 没有安全漏洞。\nB. Linux 的安全补丁始终保持最新。\nC. 没有 Rootkit 能够感染 Linux 系统。\nD. Linux 灵活且可以修改。\n\
  \n### 8. 下列哪项不是加固 Linux 的方法？\nA. 物理上保护系统。\nB. 维护当前的补丁水平。\nC. 修改默认密码。\nD. 安装所有可用的服务。\n\
