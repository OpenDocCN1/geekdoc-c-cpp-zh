  17. C. `ip.dst == www.google.com` 将仅捕获到 www.google.com 的流量。\n18. A. 密码位于应用层。\n19.\
  \ B. Wireshark 以前被称为 Ethereal。\n20. A, B. Cain & Abel 可以执行嗅探和数据包生成。\n\n## 第章：拒绝服务与会话劫持\n\
  \n 本章涵盖的 CEH 考试目标\n\n*   理解 DoS 攻击的类型\n*   理解 DDoS 如何工作\n*   理解机器人/僵尸网络如何工作\n* \
  \  什么是“smurf”攻击？\n*   什么是“SYN”洪水攻击？\n*   描述 DoS/DDoS 应对措施\n*   理解欺骗与劫持\n*   列出会话劫持的类型\n\
  *   理解序列预测\n*   执行会话劫持的步骤有哪些？\n*   描述如何防止会话劫持\n\n在拒绝服务（DoS）攻击期间，黑客通过过载资源或阻止合法用户访问系统，导致系统无法使用或显著降低系统速度。这些攻击可以针对单个系统或整个网络，并且通常是成功的。这种攻击针对的是可用性。\n\
  \n会话劫持是一种黑客手段，当攻击者接管会话会对用户产生临时 DoS。会话劫持被黑客用于在用户建立验证会话后接管。会话劫持还可以用于实施中间人攻击，即黑客插在服务器和合法客户端之间并拦截所有流量。\n\
  \n本章解释了 DoS 攻击、分布式拒绝服务（DDoS）攻击以及会话劫持的要素，例如欺骗方法、TCP 三次握手、序列号预测以及黑客如何使用工具进行会话劫持。此外，在本章结束将讨论\
  \ DoS 和会话劫持的应对措施。\n\n\n\n\n\nDoS 攻击是黑客试图淹没用户或组织系统的尝试。作为一名认证黑客专家（CEH），你需要熟悉 DoS 攻击的类型，并理解\
  \ DoS 和 DDoS 攻击的工作原理。你还需要熟悉机器人（`BOTs`）和机器人网络（`BOTNETs`），以及精灵鱼攻击（smurf attacks）和\
  \ SYN 洪泛。最后，作为一名 CEH，你需要熟悉各种 DoS 和 DDoS 的防御措施。\n\nDoS 攻击主要分为两类：\n\n*   由单个系统发送到单个目标的攻击（简单\
  \ DoS）\n*   由多个系统发送到单个目标的攻击（分布式拒绝服务，或 DDoS）\n\nDoS 的目的不是获取对机器或数据的未授权的访问权限，而是防止服务的合法用户使用该服务。DoS\
  \ 攻击可能会导致以下后果：\n\n*   用流量淹没网络，从而阻止合法的网络流量。\n*   中断两台机器之间的连接，从而阻止访问服务。\n*   防止特定个人访问服务。\n\
  *   中断对特定系统或人员的服务。\n\n不同的工具使用不同的流量来淹没受害者，但结果是相同的：由于系统上的服务或整个系统正忙于响应海量的请求，导致用户无法使用。\n\
  \n![realworld.eps](img/realworld_fmt.gif)\n\n### 拒绝服务攻击\n\n2008 年 5 月 28 日晚上，我工作的公司（`alfasystems.com`）突然断开了互联网连接。他们的\
  \ Web 服务器无法再从互联网访问。\n\n在攻击开始的一分钟内，Alpha Systems 的工程师就清楚他们正在遭受某种“数据包洪泛”攻击。在查看了他们的\
  \ `Cisco` 路由器的日志文件后，显示连接互联网的两个 `T1` 中继接口都以 1.54 Mbps 的最大速率接收着某种流量，而他们的出站流量已下降到接近零。他们淹没在恶意流量的洪流中，合法流量无法出去。Alpha\
  \ Systems 是拒绝服务攻击的受害者，这种攻击通常被称为 `DoS`。工程师们知道他们必须采取行动来停止攻击，并让 Web 服务器恢复正常并供客户访问。但没有人真的知道该怎么办，因为这种情况以前在系统中从未发生过。这时，有人想到了路由器的包过滤功能。\n\
  \n幸运的是，由于这种 `DoS` 攻击很容易被过滤，Alpha Systems 能够剔除坏数据包并将服务恢复到近乎正常的运行。两分钟内，Alpha Systems\
  \ 的工程师对他们的路由器应用了“暴力”过滤器，关闭了所有 `UDP` 和 `ICMP` 流量，`alfaystems.com` 立即恢复了互联网。\n\n最后确定，他们的服务器遭受了\
  \ 474 台受安全侵害的 `Windows` PC 的攻击，这些 PC 包含了远程控制“僵尸”，这是一场由这数百台个人 PC 协作产生的经典 `DoS` 攻击。\n\
  \n`DoS` 攻击通常是最后的手段。它被认为是一种低级攻击，因为它并不能让黑客获取任何信息，而是骚扰目标并中断其服务。当从多个系统同时发送时（`DDoS 攻击`），`DoS`\
  \ 攻击可能具有破坏性并产生重大影响。\n\n### 黑客工具\n\n`死亡之 ping`（Ping of Death）是一种通过发送多个 `IP` 数据包导致系统锁死的攻击，这些数据包在重组时对于接收系统来说太大了。`死亡之\
  \ ping` 会导致尝试访问受攻击服务器的客户端发生 `DoS`。\n\n`SSPing` 是一个向目标系统发送多个大型分片互联网控制消息协议（`ICMP`）数据包的程序。会导致接收数据包的计算机在尝试重组分片时冻结。\n\
  \n`LAND` 攻击向系统发送数据包，其源 `IP` 设置为匹配目标系统的 `IP` 地址。结果是系统尝试响应自己，导致系统创建循环——这将占用系统资源并最终可能导致操作系统崩溃。\n\
  \n`CPUHog` 是一种 `DoS` 攻击工具，消耗目标系统上的 `CPU` 资源，使用户无法使用。\n\n`WinNuke` 是一个寻找开启了端口 `139`\
  \ 的目标系统并向该端口上的系统发送垃圾 `IP` 流量的程序。这种攻击也被称为越界攻击（`OOB`），会导致 `IP` 栈过载——最终系统崩溃。\n\n`Jolt2`\
  \ 是一个 `DoS` 工具，它发送大量分片数据包到目标系统，导致用户无法使用。\n\n`WinNuke` 是一个程序寻找开启了端口 `139` 的目标系统，并向该端口上的系统发送垃圾\
  \ `IP` 流量。这种攻击也被称为越界攻击（`OOB`），会导致 `IP` 栈过载——最终系统崩溃。\n\n`Jolt2` 是一个 `DoS` 工具，发送大量分片数据包到目标系统，导致用户无法使用。\n\
  （注：原文文本中部分段落重复，翻译时已根据“不要重复输出原文”的原则进行去重处理）\n\n\n\n\nStacheldraht 与 TFN 类似，包含了 ICMP\
  \ 泛洪、UDP 泛洪和 TCP SYN 攻击选项。它还在攻击者和代理系统（次级受害者）之间提供了一个安全的 telnet 连接（使用对称密钥加密）。这防止了系统管理员截获并识别此类流量。\n\
  \nMstream 使用设置了 ACK 标志的伪造 TCP 数据包来攻击目标。它由一个处理器（handler）和一个代理部分（agent portion）组成，但访问处理器需要密码保护。\n\
  \n受攻击的服务是主受害者的服务；而用于发起攻击的受损系统是次级受害者。这些向主受害者发送 DDoS 攻击的受损系统被称为僵尸（zombies）或 BOT。它们通常通过另一种攻击被攻破，然后在特定时间或特定条件下对主受害者发起攻击。由于攻击源自多个\
  \ IP 地址，追踪攻击来源可能非常困难。\n\n通常，DDoS 由三部分组成：\n\n*   主节点/处理器（Master/handler）\n*   从节点/次级受害者/僵尸/代理/BOT/机器人网络（Slave/secondary\
  \ victim/zombie/agent/BOT/BOTNET）\n*   受害者/主受害者（Victim/primary victim）\n\n主节点是攻击发起者。从节点是被主节点攻破并受控制的主机。受害者是目标系统。主节点指示从节点对受害者系统发起攻击。请参见图\
  \ 7-1。\n\n图 7-1: DDoS 攻击中的主节点与从节点\n\n![f0701.eps](img/f0701_fmt.gif)\n\nDDoS 分两个阶段。在入侵阶段，黑客攻破全球不同网络中的弱弱系统，并在这些受损的从节点系统上安装\
  \ DDoS 工具。在 DDoS 攻击阶段，从节点系统被触发，导致它们对主受害者发起攻击。请参见图 7-2。\n\n图 7-2: Bot 或僵尸系统\n\n![f0702.eps](img/f0702_fmt.gif)\n\
  \n### BOT/机器人网络的工作原理\n\nBOT 是 web robot（网络机器人）的缩写，是一种具有智能的自动化软件程序。垃圾邮件者经常使用 BOT\
  \ 自动在新闻组中发布垃圾信息或发送电子邮件。BOT 也可以作为远程攻击工具。大多数情况下，BOT 是与网页交互的 Web 软件代理。例如，爬虫（蜘蛛）是收集网页信息的网络机器人。\n\
  \n最危险的 BOT 是那些为了恶意目的隐蔽地安装在用户计算机上的程序。\n\n某些 BOT 通过即时消息、互联网中继聊天（IRC）或其他 Web 接口与互联网服务的其他用户通信。这些\
  \ BOT 允许 IRC 用户使用纯英语提问，然后形成适当的回复。此类 BOT 通常可以处理许多任务，包括报告天气；提供邮政编码信息；列出体育比分；转换单位（如货币）等。\n\
  \nBOTNET（机器人网络）是一组 BOT 系统。机器人网络有多种用途，包括 DDoS 攻击；创建或滥用简单邮件传输协议（SMTP）邮件中继发送垃圾邮件；互联网营销欺诈以及盗取应用程序序列号、登录\
  \ ID 和信用卡号等财务信息。通常，BOTNET 指一组为了运行 BOT 旨在发起协同 DDoS 攻击的受损系统。请参见图 7-3。\n\n图 7-3: 分布式\
  \ DoS 攻击结构\n\n![f0703.eps](img/f0703_fmt.gif)\n\n### Smurf 攻击与 SYN 泛洪\n\nSmurf 攻击向广播\
  \ IP 地址发送大量 ICMP Echo（ping）流量，其源地址伪造为受害者。该 IP 网络上的每个次级受害者主机都会用 Echo 回复响应 ICMP Echo\
  \ 请求，使流量按响应主机的数量成倍增加。在多访问广播网络上，数百台机器可能会对每个数据包做出响应。这创建了一个放大的 ping 回复 DoS 攻击，淹没了主受害者。IRC\
  \ 服务器是互联网上 smurf 攻击的主要受害者。\n\nSYN 泛洪攻击发送 TCP 连接请求的速度快于机器处理的速度。攻击者为每个数据包创建一个随机源地址，并设置\
  \ SYN 标志以请求从伪造的 IP 地址向服务器建立新连接。受害者对伪造的 IP 地址做出响应，然后等待永远不会到达 TCP 确认。因此，受害者的连接表因等待回复而填满；表满后，所有新连接都会被忽略。合法用户也会被忽略且无法访问服务器。\n\
  \n可以通过使用 `netstat` 命令检测到 SYN 泛洪攻击。遭受 SYN 泛洪攻击的系统的 `netstat` 输出示例在图 7-4 所示。\n\n以下是一些用于防止\
  \ SYN 泛洪攻击的方法：\n\n*   **SYN Cookies**：SYN cookies 确保服务器在完成成功的三次握手之前不分配系统资源。\n* \
  \  **RST Cookies**：本质上是服务器用错误的 SYN ACK 响应客户端的 SYN 帧。随后客户端应生成一个 `RST` 包。\n*   **Micro\
  \ Blocks**：微块通过仅为连接记录分配极小空间来防止泛洪攻击。\n*   **栈调整（Stack Tweaking）**：这种方法涉及更改 TCP/IP\
  \ 栈以防止泛洪攻击。栈调整技术包括选择性地丢弃进入连接或在栈释放内存。\n\n图 7-4: SYN 泛洪攻击下的 netstat 输出\n\n![f0704.tif](img/f0704_fmt.gif)\n\
  \n在练习 7-1 中，你将学习如何防止 SYN 泛洪攻击。\n\n1. 点击开始 ⇒ 运行并输入 `regedit` 运行注册表编辑器。\n2. 导航到 `HKLM\\\
  System\\CurrentControlSet\\Services\\Tcpip\\Parameters` 注册键。\n3. 向注册键添加 `SynAttackProtection=2`\
  \ DWORD 值。\n4. 关闭 `regedit` 程序。\n\n此更改将允许操作系统处理更多的 SYN 请求。当 `SynAttackProtection`\
  \ 的值为 2 时，Windows 在完成三次握手之前延迟创建套字。此更改将有效防止 SYN 泛洪攻击占用资源。\n\n### DoS/DDoS 措施\n\n\
  有多种方法可以检测、停止或防止 DoS 攻击。以下是常见的安全功能：\n\n*   **入站过滤（Network-Ingress Filtering）**：所有网络访问提供商都应实施入站过滤，防止下游网络向互联网注入伪造地址的数据包。虽然这不能阻止攻击发生，但它可以更容易追踪攻击源并快速终止攻击。大多数\
  \ IDS、防火墙和路由器都提供入站过滤功能。\n*   **流量速率限制**：市场上的许多路由器具有某些功能，可以限制某些流量消耗的带宽。这有时被称为流量整形。\n\
  *   **入侵检测系统**：使用入侵检测系统（IDS）来检测与从节点、主节点或代理机器通信的攻击者。这可以让你了解网络中的机器是否被用于发起已知攻击，但可能无法检测此类攻击的新变体。大多数\
  \ IDS 供应商都有针对 Trinoo、TFN 或 Stacheldraht 网络流量的特征码。\n\n\n\n\n\n## 自动化网络追踪工具\n在网络中追踪带有伪造地址的数据包流是一项耗耗时的任务，它需要所有承载流量的网络协作，并且必须在攻击进行期间完成。\n\
  \n## 主机审计与网络审计工具\n目前已有文件扫描工具可以尝试检测系统中是否存在已知的 DDoS 工具客户端和服务器二进制文件。网络扫描工具则尝试检测你网络中主机上运行的\
  \ DDoS 代理。\n\n### DoS 扫描工具\n`Find_ddos` 是一个用于扫描本地系统的工具，可能可能包含 DDoS 程序。它可以检测多种已知的\
  \ DoS 攻击工具。\n\n`S` 通过检查网络服务来收集有关远程主机和网络的信息。这包括有关网络信息服务的信息，以及潜在的安全漏洞，例如设置或配置不当的网络服务、系统或网络工具中的已知漏洞、常见漏洞与暴露（`CVE`）数据库中列出的系统漏洞，以及弱的策略决策。\n\
  \n`RID` 是一个免费的扫描工具，用于检测 `Trinoo`、`TFN` 或 `Stacheldraht` 客户端的存在。\n\n`Zombie Zapper`\
  \ 指示僵尸程序进入睡眠，从而停止它们的攻击。你可以使用攻击者停止攻击时相同的命令。\n\n## 会话劫持\n会话劫持是指黑客在用户成功通过服务器验证后控制用户会话。会话劫持涉及识别客户端/服务器通信的当前会话\
  \ ID 并接管客户端会话的攻击。会话劫持是通过执行序列号预测的工具实现的。序列号预测的细节将在本章稍后的序列号预测部分进行讨论。\n\n欺骗攻击与劫持攻击不同。在欺骗攻击中，黑客进行嗅探并监听从发送者到接收者在网络中传输的流量。然后，黑客利用收集到的信息来伪造或使用合法系统的地址。劫持则涉及主动将另一个用户踢下线以执行攻击。攻击者依赖合法用户建立连接并进行身份验证。之后，攻击者接管会话，合法用户的会话会被断开。\n\
  \n会话劫持涉及以下三个步骤以持续攻击：\n\n1. **追踪会话**：黑客识别一个打开的会话并预测下一个数据包的序列号。\n2. **使连接不同步**：黑客向合法用户系统发送一个\
  \ TCP 重置（`RST`）或结束（`FIN`）数据包，导致其关闭会话。\n3. **注入攻击者数据包**：黑客向服务器发送带有预测序列号的 TCP 数据包，服务器将其接受为合法用户的下一个数据包。\n\
  \n黑客可以使用两种类型的会话劫持：主动和被动。主动劫持与被动劫持的主要区别在于黑客对会话的参与程度。在主动攻击中，攻击者找到一个活跃的会话，并使用预测 TCP\
  \ 会话中使用的下一个序列号的工具接管该会话。\n\n在被动攻击中，攻击者劫持一个会话，然后观察并记录合法用户发送的所有流量。被动会话劫持本质上就是嗅探。它收集密码等信息，然后使用这些信息作为独立会话进行身份验证。\n\
  \n### TCP 概念：三次握手\nTCP 的两个关键特性是可靠性和数据包的有序交付。为了实现这些目标，TCP 使用确认（`ACK`）数据包和序列号。操纵这些数字是\
  \ TCP 会话劫持的基础。为了理解会话劫持，让我们回顾之前章节描述的 TCP 三次握手：\n\n1. 合法用户与服务器建立连接。这是通过合法用户向服务器发送一个设置了\
  \ `SYN` 位和用户初始序列号（`ISN`）的数据包实现的。\n2. 服务器接收此数据包并返回一个设置了 `SYN` 位和服务器 `ISN` 的数据包，外设置了\
  \ `ACK` 位以标识用户的 `ISN` 增加了一个值 1。\n3. 合法用户通过返回一个设置了 `ACK` 位并将服务器的 `ISN` 增加 1 的数据包来确认服务器。\n\
  \n该连接可以由于超时或收到带有 `FIN` 或 `RST` 标志的数据包而从任何端关闭。\n\n收到带有 `RST` 标志的数据包后，接收系统关闭连接，并丢弃该会话的所有传入数据包。如果数据包中设置了\
  \ `FIN` 标志，接收系统将执行关闭连接，而在关闭连接期间收到的任何数据包仍会被处理。发送带有 `FIN` 或 `RST` 标志的数据包是劫持者关闭客户端与服务器之间会话并模拟客户端接管会话的最常用方法。\n\
  \n### 序列号预测\nTCP 是一种面向连接的协议，负责将数据包流重组为原始预期顺序。每个数据包都必须分配一个唯一的会话号，以便接收机器将数据包流重组为原始预期的顺序；这个唯一数字被称为序列号。如果数据包乱序到达（这在互联网上经常发生），则使用\
  \ `SN` 来正确流数据包。正如刚才所示，启动 TCP 会话的系统发送一个设置了 `SYN` 位的数据包。这被称为同步数据包，包含了客户端的 `ISN`。`ISN`\
  \ 是一个伪随机生成的数字，具有超过 40 亿种可能的组合，但在统计学上它是有重复可能的。\n\n当发送 `ACK` 数据包时，每台机器都会使用被确认数据包的\
  \ `SN` 加上增量。这不仅正确地确认了特定数据包的接收，还告诉发送者下一个预期的 TCP 数据包 `SN`。在三次握手中，增值为 1。在正常数据通信中，增量等于数据的字节数（例如，如果你传输了\
  \ 45 字节的数据，`ACK` 将使用传入数据包的 `SN` 加上 45 进行响应）。\n\n`图 7-5` 展示了 TCP 三次握手期间使用的序列号和确认号。\n\
  \n\n\n\nJuggernaut 是一个可用于劫持 `TCP` 会话的网络嗅探器。它运行在 Linux 操作系统上，可以监控所有的网络流量，也可以通过提供如密码之类的关键词进行查找。该程序显示所有活跃的网络连接，攻击者随后可以选择一个会话进行劫持。\n\
  \n`Hunt` 是一个可用于嗅探和劫持网络活跃会话的程序。`Hunt` 执行连接管理、地址解析协议 (`ARP`) 欺骗、连接重置、连接监控、介质访问控制 (`MAC`)\
  \ 地址发现以及 `TCP` 流量嗅探。\n\n`TTYWatcher` 是一种会话劫持实用程序，允许劫持者将被盗的会话返回给合法用户，仿佛从未被劫持过一样。`TTYWatcher`\
  \ 仅适用于 Sun Solaris 系统。\n\n`IP Watcher` 是一种会话劫持工具，允许攻击者监控连接并接管会话。该程序可以监控网络上的所有连接，允许攻击者实时查看会话的精确副本。\n\
  \n`T-Sight` 是一种用于 Windows 的会话监控和劫持工具，可以在发生网络入侵或破解尝试时提供帮助。通过 `T-Sight`，系统管理员可以实时监控所有网络连接并观察任何可疑活动。`T-Sight`\
  \ 还可以劫持网络上的任何 `TCP` 会话。出于安全考虑，En Garde Systems 仅向预定的 IP 地址授权此软件。\n\n远程 TCP 会话重置工具显示当前的\
  \ `TCP` 会话和连接信息，例如 IP 地址和端口号。该工具主要用于重置 `TCP` 会话。\n\n## 会话劫持带来的危险\n\n`TCP` 会话劫持是一种危险的攻击：大多数系统都容易受到这种攻击，因为它们使用\
  \ `TCP/IP` 作为主要的通信协议。较新的操作系统尝试通过使用伪随机数生成器计算 `ISN` 来防止会话劫持，从而使序列号更难以猜测。然而，如果攻击者能够嗅探数据包，这种安全措施就是无效的，因为嗅探提供了执行此类攻击所需的信息。\n\
  \n以下是为什么 CEH（认证黑客）意识到会话劫持很重要的原因：\n\n*   大多数计算机都容易受到攻击。\n*   很少有足够的防御措施可以有效防止它。\n\
  *   会话劫持攻击启动简单。\n*   劫持是非常危险的，因为在攻击期间可以收集大量信息。\n\n### 防止会话劫持\n\n为了防御会话劫持攻击，网络应该采用多种防御。最有效的保护是加密，例如互联网协议安全\
  \ (`IPSec`)。这也可以防御任何依赖于嗅探的其它攻击向量。攻击者可能被动地监控你的连接，但他们无法解释加密数据。其他防御措施包括使用加密应用程序，如安全外壳\
  \ (`SSH`，一种加密的 telnet）和安全套接层 (`SSL`，用于 `HTTPS` 流量）。\n\n你可以通过减少访问你网络的潜在方法来帮助防止会话劫持——例如通过消除对内部系统的远程访问。如果网络有需要连接以执行工作的远程用户，请使用经过隧道协议和加密保护的虚拟专用网络\
  \ (`VPNs`)（如第 3 层隧道协议 [`L3TP]`/点点隧道协议 [`PPTP]` 和 `IPSec`）。\n\n使用多重安全措施始终是对任何潜在威胁的最佳对策。仅采用任何一种防御措施可能是不够的，但它们结合起来保护你的企业，将使除最专业和最投入的攻击者之外的任何攻击成功率降至最低。以下是防止会话劫持应采用的防御措施清单：\n\
  \n*   使用加密。\n*   使用安全协议。\n*   限制入连接。\n*   最小化远程访问。\n*   采用强身份验证。\n*   教育员工。\n* \
  \  为不同账户维护不同的用户名和密码。\n*   使用以网交换机而非集线器来防止会话劫持攻击。\n\n## 总结\n\n拒绝服务攻击用于使系统或网络无法使用，被视为对用户数据可用性的攻击。当其他黑客尝试失败时，黑客可能会采用\
  \ `DoS` 攻击作为攻击系统的一种。尽管黑客可能无法通过 `DoS` 获取数据，但黑客可以阻止合法用户访问数据。`DoS` 攻击尤其是 `DDoS` 攻击很难应对。最佳选择是尝试通过使用防火墙或\
  \ `IDS` 上的流量过滤来防止攻击。\n\n黑客利用会话劫持来截获用户的连接，并将自己置于合法用户和服务器之间。会话劫持涉及预测序列号、拦截合法的 `TCP/IP`\
  \ 数据并将其替换为黑客的攻击利用程序。会话劫持是一种用于收集价值用户数据的危险攻击，大多数运行 `TCP/IP` 栈的系统都受到会话劫持。\n\n## 考试要点\n\
  \n*   了解 `DoS` 和 `DDoS` 攻击的目的。`DoS` 攻击的目的是向目标系统发送大量流量，导致用户无法访问该系统。分布式拒绝服务 (`DDoS`)\
  \ 攻击是许多系统向一个目标发起的协调攻击，而 `DoS` 涉及单个系统对目标的攻击。\n*   了解如何防止 `DoS` 攻击。网络流量过滤、`IDS` 和审计工具都是检测和防止\
  \ `DoS` 攻击的方法。\n*   了解 `DDoS` 的两个阶段。在第一阶段，系统被破解并安装了 `DDoS` 工具，使系统变成僵尸或从隶；这被称为入侵阶段。第二阶段涉及对受害者系统发起攻击。\n\
  *   了解 `DDoS` 攻击中的僵尸（zombie）、从隶（slave）和主节点（master）分别代表什么。僵尸或从隶是被黑客破解的系统，可以被命令参与向目标系统发送\
  \ `DDoS` 攻击。主节点是 `DDoS` 攻击场景中的控制系统，它告诉僵尸何时发起攻击。\n*   理解会话劫持和欺骗。会话劫持涉及在用户身份验证后接管其会话以获取系统访问。欺骗涉及伪造数据包的源地址，该地址通常是从嗅探的网络流量中推断出来的，而劫持指的是受的会话——通常是攻击者让用户离线的场景。\n\
  *   理解序列号在会话劫持攻击中的重要性。发起会话劫持攻击需要猜测或定位序列号。序列号用于数据包排序，并允许接收站正确重组数据。\n\n\n\n理解会话劫持（session\
  \ hijacking）的危险和应对措施。大多数计算机容易受到会话劫持攻击，而且现有的措施并不总是有效。机密和重要信息，如密码、账户信息和信用卡号可以通过会话劫持攻击获取。使用加密、强身份验证和安全协议；限制入站连接；尽量减少远程访问连接；培训员工；并为不同的账户维护唯一的用户名和密码。\n\
  \n## 复习题\n\n1. 哪种方法是防止拒绝服务攻击的方法？\nA. 静态路由\nB. 流量过滤\nC. 防火墙规则\nD. 个人防火墙\n\n2. 什么是僵尸网络（zombie）？\n\
  A. 用于发起 DDoS 攻击的被入侵系统\nB. 黑客的计算机\nC. DDoS 攻击的受害者\nD. 作为 DDoS 攻击目标的的被入侵系统\n\n3. `Trinoo`\
  \ 工具使用什么协议执行 DoS 攻击？\nA. TCP\nB. IP\nC. UDP\nD. HTTP\n\n4. DDoS 攻击的第一阶段是什么？\nA.\
  \ 侵入（Intrusion）\nB. 攻击（Attack）\nC. DoS\nD. 寻找目标系统\n\n5. 哪种工具可以运行八种不同的 DoS 攻击？\n\
  A. 死亡 Ping（Ping of Death）\nB. `Trinoo`\nC. `Targa`\nD. `TFN2K`\n\n6. 什么是小颜人攻击（smurf\
  \ attack）？\nA. 使用伪造源地址发送大量 ICMP 流量\nB. 使用伪造源地址发送大量 TCP 流量\nC. 使用伪造源地址发送大量 TCP 连接请求\n\
  D. 发送大量 TCP 连接请求\n\n7. 什么是 LAND 攻击？（选择所有适用。）\nA. 发送超大 ICMP 包\nB. 向受害者发送数据包，其源地址设置为受者的\
  \ IP 地址\nC. 向受害者发送数据包，其目的地址设置为受者的 IP 地址\nD. 发送源地址和目的地址相同的数据包\n\n8. 什么是死亡 Ping（Ping\
  \ of Death）？\nA. 发送在重组后大到让系统无法理解的数据包\nB. 发送导致缓冲区溢出的极大数据包\nC. 快速发送数据包以填满接收缓冲区\nD.\
  \ 发送分片偏移超出范围的 TCP 包\n\n9. 拒绝服务攻击是如何工作的？（选择所有适用。）\nA. 破解密码，导致系统崩溃\nB. 模拟合法用户\nC.\
  \ 防止合法用户使用系统或服务\nD. 尝试破解身份验证方法\n\n10. DoS 攻击的目标是什么？\nA. 从远程系统捕获文件\nB. 使系统或网络失效\n\
  C. 利用 TCP/IP 协议栈中的漏洞\nD. 使用隐藏共享执行木马\n\n11. 下列工具哪一个仅用于太阳 Solaris（Sun Solaris）系统？\n\
  A. `Juggernaut`\nB. `T-Sight`\nC. `IP Watcher`\nD. `TTYWatcher`\n\n12. 什么是序列号（sequence\
  \ number）？\nA. 指示数据包在数据流中位置的数字\nB. 一种从发送站向接收站发送信息的方法\nC. 黑客为了劫持会话而随机选择的数字\nD. 用于重构\
  \ UDP 会话的数字\n\n13. 在会话劫持攻击期间可以获得哪些类型的信息？（选择所有适用。）\nA. 密码\nB. 信用卡号\nC. 机密数据\nD. 身份验证信息\n\
  \n14. 下列哪项是黑客执行会话劫持攻击的关键信息？\nA. 会话 ID\nB. 会话次数\nC. 序列号\nD. 源 IP 地址\n\n15. 下列哪种工具是运行在\
  \ Linux 操作系统上的会话劫持工具？\nA. `Juggernaut`\nB. `Hunt`\nC. `TTYWatcher`\nD. `TCP Reset\
  \ Utility`\n\n16. 下列哪项是防止会话劫持的最佳对措施？\nA. 端口过滤防火墙\nB. 加密\nC. 会话监控\nD. 强密码\n\n17.\
  \ 下列哪项最准确地描述嗅探（sniffing）？\nA. 收集数据包以定位 IP 地址，从而启动会话劫持攻击\nB. 分析数据包以定位序列号并开始会话劫持\n\
  C. 监控 TCP 会话以启动会话劫持攻击\nD. 定位易受会话劫持攻击的主机\n\n18. 什么是会话劫持？\nA. 监控 UDP 会话\nB. 监控 TCP\
  \ 会话\nC. 接管 UDP 会话\nD. 接管 TCP 会话\n\n19. 向会话劫持攻击的受害者发送什么类型的数据包会使其关闭连接端？\nA. FIN 和\
  \ ACK\nB. SYN 或 ACK\nC. SYN 和 ACK\nD. FIN 或 RST\n\n20. 什么是 ISN？\nA. 初始会话号\nB. 初始序列号（Initial\
  \ sequence number）\nC. 初始会话序列号\nD. 指示序列号\n\n## 复习题答案\n\n1. B. `Traffic filtering`\
  \ 是防止 DoS 攻击的方法。静态路由无法防止 DoS 攻击因为它不执行任何流量过滤或拦截。防火墙规则和个人防火墙无法阻止与 DoS 攻击相关的流量，但有助于检测攻击。\n\
  2. A. `zombie` 是用于发起 DDoS 攻击的被入侵系统。\n3. C. `Trinoo` 使用 `UDP` 向目标系统泛洪数据。\n4. A. 侵入阶段入侵并招募僵尸系统，用于协调攻击阶段。\n\
  5. C. `Targa` 能够发送八种不同的 DoS 攻击。\n6. A. 小颜人攻击发送源地址为受造的大量 ICMP 请求帧。\n7. A, B. LAND\
  \ 攻击向受害者发送源地址为受害者系统的数据包，导致受害者响应自身。\n8. A. 死亡 Ping 发送的数据包在重组后太大，导致系统崩溃。\n9. C. 拒绝服务攻击通过防止合法用户访问系统来实现。\n\
  10. B. DoS 攻击的目标是使系统过载并停止响应。\n11. D. `TTYWatcher` 用于在 Solaris 系统上执行会话劫持。\n12. A.\
  \ 序列号指示数据包在数据流中的位置，以便接收站重组数据。\n13. A, B, C. 密码、信用卡号和其他机密数据可以在会话劫持攻击中获取。无法获取身份验证信息，因为会话劫持发生在用户身份验证之后。\n\
  14. C. 为了执行会话劫持攻击，黑客必须知道下一个数据包使用的 `sequence number`，以便服务器接受该数据包。\n15. A. `Juggernaut`\
  \ 运行在 Linux 操作系统上。\n16. B. 加密使黑客在会话劫持尝试期间收集的信息变得不可读。\n17. B. 嗅探通常用于定位序列号，这是进行会话劫持所需的。\n\
  18. D. 最常见的会话劫持形式是接管 TCP 会话的过程。\n19. D. 向受害者发送 `FIN` 和 `RST` 包以使其连接不同步并关闭现有连接。\n\
  20. B. `ISN` 是主机发送的初始序列号，它是后续数据包使用的序列号的起点。\n\n## 第 8 章 Web 攻击：Google、Web 服务器、Web\
  \ 应用漏洞及基于 Web 的密码破解技术\n\n本章涵盖 CEH 考试目标：\n\n* 列出 Web 服务器漏洞类型\n* 理解针对 Web 服务器的攻击\n\
  * 理解 IIS Unicode 漏洞\n* 理解补丁管理技术\n* 理解 Web 应用扫描器\n* 什么是 Metasploit 框架？\n* 描述 Web\
  \ 服务器加固方法\n* 理解 Web 应用的工作原理\n* Web 应用攻击的目标\n* 攻击剖析\n* Web 应用威胁\n* 理解 Google 攻击\n\
  * 理解 Web 应用应对措施\n* 列出身份验证类型\n* 什么是密码破解器？\n* 密码破解器是如何工作的？\n* 理解密码攻击——分类\n* 理解密码破解应对措施\n\
  \n\n\n\n本章介绍了黑入 Web 服务器以及利用 Web 服务器和 Web 应用程序漏洞的基础知识。还涵盖了基于 Web 的密码破解技术。\n\nWeb\
  \ 服务器和 Web 应用程序具有极高的被攻击风险。其首要原因是，运行 Web 服务器软件的系统必须在互联网上公开可访问。Web 服务器无法被完全隔离，并且在某种程度上必须对合法用户可用。一旦\
  \ Web 服务器被攻破，系统就可以为黑客提供进入网络的另一个门径。不仅是 Web 服务器软件，运行在 Web 服务器上的应用程序也极易受到攻击并可能被利用。由于其功能性，Web\
  \ 服务器比其他系统更容易被访问且受保护较少，因此更容易被利用。\n\nWeb 服务器上的目标信息通常位于 Web 服务器的数据库中；该数据库通过 Web 应用程序访问。因此，Web\
  \ 服务器和 Web 应用程序密不可分。攻击 Web 服务器通常是为了获取 Web 应用程序底层的数据。\n\n## Web 服务器的工作原理\n\nWeb 服务器使用超文本传输协议（`HTTP`）和安全超文本传输协议（`HTTPS`）允许\
  \ Web 客户端连接到它们并查看和下载文件。`HTTP` 是 TCP/IP 栈中的应用层协议。`HTTP` 和 `HTTPS` 是 Web 客户端访问位于互联网\
  \ Web 服务器上的网页时使用的主要协议。超文本标记语言（`HTML`）是用于创建网页的语言，允许这些页面在 Web 客户端的浏览器软件中渲染。\n\n`HTTP`\
  \ 协议的运行方式如图 8-1](#9780470642887c08.xhtml_figure8-1)。\n\n图 8-1: HTTP 协议组件\n\n![f0801.eps](img/f0801_fmt.gif)\n\
  \n1. Web 客户端最初使用 `TCP` 端口 `80` 打开到 Web 服务器 IP 地址的连接。\n2. Web 服务器等待客户端的 `GET` 请求，请求该网站的主页。\n\
  3. Web 服务器用 Web 服务器主页的 `HTML` 代码进行响应。\n4. 客户端处理 `HTML` 代码，Web 客户端浏览器软件在客户端设备上渲染页面。\n\
  \n理解 Web 服务器的工作原理——以及它们是如何被黑入的——是你作为 CEH（认证道德黑客）工作的重要部分。这包括了解它们的漏洞，以及理解黑客可能使用的攻击类型。此外，你还应该知道何时使用补丁管理技术，并理解用于加固\
  \ Web 服务器的方法。\n\n我们将在接下来的章节中查看所有这些主题。\n\n## Web 服务器漏洞类型\n\nWeb 服务器和其他系统一样，可以被黑客攻破。Web\
  \ 服务器中最常利用的漏洞如下：\n\n#### Web 服务器软件配置不当\n使用微软 Internet 信息服务（`IIS`）作为 Web 服务器时的一个常见问题是使用了默认网站。默认网站的权限是开放的，这意味着默认设置使网站容易受到攻击。例如，`everyone`\
  \ 组中的所有用户对默认网站目录中的所有文件具有完全控制权限。一旦在服务器上安装了 `IIS`，编辑并限制权限是至关重要的，因为默认系统用户 `IUSR_COMPUTERNAME`\
  \ 是 `everyone` 组的成员。因此，任何访问默认网站的人都可以访问默认网站文件夹中的所有文件，并对这些文件拥有“执行”和“完全控制”等危险权限。参阅练习\
  \ 8-1 以学习如何在 `IIS` 中禁用默认网站。\n\n### 操作系统或应用程序漏洞，或编程代码中的缺陷\n所有程序（包括 `OS` 和 Web 服务器应用程序）都应该定期进行补丁或更新。对于\
  \ Windows 系统，这包括安全补丁、热修复和 `Windows Updates`。一旦这些补丁经过测试，就可以自动或手动应用到系统中。\n\n### 存在漏洞的默认安装\n\
  操作系统和 Web 服务器软件设置在安装后不应保持默认值，而应持续更新。\n\n黑客利用这些漏洞来访问 Web 服务器。由于 Web 服务器通常位于非军事化区（DMZ）中——这是两个数据包过滤设备之间的公共访问区域，组织的客户端系统可以轻松访问——因此对\
  \ Web 服务器的利用为黑客提供了更易访问内部系统或数据库的机会。\n\n### 练习 8-1：在 Internet 信息服务中禁用默认网站\n\n要在 `IIS`\
  \ 中禁用默认网站并添加新站点，请按照以下步骤操作：\n\n1. 在你的 Windows 服务器或虚拟机 (`VM`) 上打开 `IIS`。\n2. 在左窗格中选择\
  \ `Web Sites`（网站）。\n3. 在右窗格中右键点击默认网站，从上下文菜单中选择 `Stop`（停止）。现在默认网站已停止。\n4. 要创建新站点，在左窗格中右键点击\
  \ `Web Sites` 并选择 `New ⇒ Web Site`（新建 ⇒ 网站）。\n\n![g0801.tif](img/g0801_fmt.jpg)\n\
  \n5. 启动网站向向。向导中有一个更改网站目录权限的屏幕。\n\n![g0802.tif](img/g0802_fmt.jpg)![note.eps](img/note_fmt.gif)\n\
  \n网站伪装（Website cloaking）是 Web 服务器根据用户的 IP 地址显示不同类型网页的能力。\n\n在许多情况下，收集组成网站的所有或部分文件是有用的。一种方法是右键点击任何网页并从上下文菜单选择\
  \ `View Source`（查看源代码）。此命令将打开一个显示源代码的窗口。然后你可以将文本文件保存为本地机器的文件。这种方法可行，但并不是复制整个网站文件的实用方法。一个名为\
  \ `BlackWidow` 的易用程序可以让该过程变得简单得多。\n\n练习 8-2：使用 BlackWidow 复制网站\n\n1. 从 [www.softbytelabs.com](http://www.softbytelabs.com)\
  \ 下载并安装 `BlackWidow` 。\n2. 打开 `BlackWidow` 程序。\n3. 在 `BlackWidow` 地址栏中输入目标网站地址：\n\
  \n![g0803.tif](img/g0803_fmt.jpg)\n4. 点击 `BlackWidow` 工具栏上的 `Scan` 按钮。\n5. 点击 `Structure`\
  \ 标签。\n6. 浏览网站结构。右键点击文件或文件夹并选择 `Copy Selected Files` 将网站复制到电脑。\n\n![g0804.tif](img/g0804_fmt.jpg)\n\
  \n### 攻击 Web 服务器\n\nWeb 服务器通常监听 `TCP` 端口 `80` (`HTTP`) 和 `TCP` 端口 `443` (`HTTPS`)。由于这些端口对\
  \ Web 客户端开放可用，Web 客户端和 Web 服务器之间的任何防火墙或数据包过滤设备必须允许指向这些端口的流量。Web 应用程序位于 Web 服务器软件之上，允许访问额外的端口。\n\
  \n针对 Web 服务器的初始信息收集步骤之一是指纹识别。指纹识别尝试收集有关 Web 服务器的信息，例如 `OS` 和 Web 服务器软件及版本。练习 8-3\
  \ 将教你如何使用指纹识别。\n\n### 练习 8-3：指纹识别\n\n1. 在 Windows PC 的命令提示符上输入：\n```\ntelnet <IPaddress>\
  \ 80\n```\nIP 地址是目标 Web 服务器的地址。也可以使用 URL 代替 IP 地址。\n\n2. 接下来，在 telnet 窗口输入：\n```\n\
  HEAD/HTTP/1.0\n```\n然后按回车。\n\n随后将返回 Web 服务器 banner。banner 看起来如下：\n\n```\nServer:\
  \ Microsoft-IIS/5.0\nDate: Fri, 14 Aug 2009 1:14:42 GMT\nContent-Length:340\nContent-Type:\
  \ text/html\n```\n\n\n\n\nBanner 取（Banner grabbing）的结果通常会识别 Web 服务器类型和版本。这些信息非常重要，因为可以针对该\
  \ Web 服务器类型和版本识别漏洞。Banner 取后的下一步是攻击 Web 服务器或攻击 Web 应用程序并获取对服务器上数据的访问。\n\n针对 Web\
  \ 服务器的一种良性但可见的攻击类型是篡改（defacement）。黑客篡改网站纯出于快乐以及增加自己的声誉，而不是收集任何有用数据。篡改网站意味着黑客利用了\
  \ `OS` 或 Web 服务器软件的漏洞，然后修改网站文件以显示该网站已被入侵。黑客通常会在网站首页显示他们的黑客名称。\n\n### 允许黑客篡改网站的常见网站攻击包括：\n\
  \n*   通过中间人攻击捕获管理员凭据\n*   通过破解攻击破解管理员密码\n*   使用 `DNS` 攻击将用户重定向到不同的 Web 服务器\n*  \
  \ 攻破 `FTP` 或电子邮件服务器\n*   利用导致漏洞的 Web 应用程序漏洞\n*   配置错误的 共享\n*   利用弱权限\n*   在防火墙或路由器攻击后重新路由客户端\n\
  *   使用 `SQL injection` 攻击（如果 `SQL` 服务器和 Web 服务器是同一系统）\n*   使用 `telnet` 或 `Secure\
  \ Shell (SSH)` 侵入\n*   执行 `URL poisoning`，将用户重定向到不同的 URL\n*   使用 Web 服务器扩展或远程服务侵入\n\
  *   拦截客户端与服务器之间的通信并更改 `cookie`，使服务器认为有一个具有更高权限的用户（适用于启用 cookie 的安全）\n\n练习 `8-4`\
  \ 将引导你了解如何使用 `Metasploit Framework` 利用 Web 服务器漏洞。\n\n![warning.eps](img/warning_fmt.gif)\n\
  \n在安装 `Metasploit` 之前，确保机器或 `VM` 已完全关闭所有杀毒程序和防火墙。否则，杀毒程序可能会阻止 `Metasploit` 的某些组件，导致其无法正常运行或打开。正如我们在本书引言的实验设置指南中提到的，你永远不要在生产机器上安装\
  \ `Metasploit`。请使用 `VM` 或实验测试机来运行此软件。\n\n### 练习 8-4：使用 Metasploit 攻击 Web 服务器漏洞\n\
  \n1.  在你的 `Windows XP` 或 `Vista` 电脑或 `VM` 上下载并安装 `Metasploit 3.2`（[[www.metasploit.com`](http://www.metasploit.com)）。\n\
  2.  安装 `Metasploit` 时选择所有默认选项。\n3.  在程序文件夹下的 `Metasploit 3` 文件夹中选择 `Online Update`\
  \ 选项。\n4.  在线更新完成后，打开 `Metasploit 3` 文件夹中的 `Metasploit GUI` 文件。\n\n![g0805.tif](img/g0805_fmt.jpg)\n\
  \n5.  展开 `Exploits` 下的 `Windows` 文件夹，然后展开 `IIS` 文件夹。\n6.  双击 `ms03_007_ntdll_webdav`\
  \ 漏洞。`MSF Assistant Wizard` 启动。\n\n![g0806.tif](img/g0806_fmt.jpg)\n\n7.  点击前进按钮进入向导的下一个屏幕。\n\
  8.  从 `Payload` 下拉列表中选择 `Windows/Exec`，然后点击前进。\n9.  在 `RHOST` 字段中输入目标 `IIS` Web\
  \ 服务器的 IP 地址。为了使此 payload 起效，该服务器应该是未补补的 `Windows 2000` 版本。如果不是，请选择服务器脆弱的另一个 payload。\n\
  10. 在 `CMD` 字段中输入 `sol.exe`。这是将在远程目标主机上运行的可执行文件。`sol.exe` 是纸牌游戏，所有的 Windows 操作系统都应该包含它。payload\
  \ 将传递到目标系统。在这种情况下，它类似于在 `IIS` 服务器的命令行提示符中输入 `sol.exe`。显然，这个可执行文件是良性的，但此练习说明了更危险的可执行文件（如病毒或木马）将如何在目标系统上运行。\n\
  \n![g0807.tif](img/g0807_fmt.jpg)\n\n11. 点击前进按钮进入向导的下一个屏幕。\n12. 点击 Apply 按钮。漏洞将出现在\
  \ `Jobs` 下，直到它传递到目标系统。\n13. 在 `Windows IIS Server VM` 或 `IIS PC` 上确认 `Solitaire`\
  \ 程序正在运行。如果程序没有运行，请确认 `IIS` 服务器上已安装 `Solitaire` 并再次尝试 `Metasploit` 漏洞攻击。\n\n###\
  \ 攻击 Internet 信息 Server\n\n`Windows IIS` 是最流行的 Web 服务器软件产品之一。由于运行 `IIS` 的 Web 服务器流行且众多，可以针对\
  \ `IIS` 服务器发起许多攻击。针对 `IIS` 的三种常见攻击如下：\n\n*   目录遍历（Directory traversal）\n*   源码泄（Source\
  \ disclosure）\n*   缓冲区溢出（Buffer overflow）\n\n`directory-traversal` 攻击的基础是 Web 客户端被限制\
  \ `Windows 文件系统` 中的特定目录。Web 客户端的初始目录被称为 Web 服务器上的根目录。此根目录通常存储通常被称为 `Default` 或 `Index`\
  \ 的首页，以及 Web 服务器的其他 `HTML` 文档。根目录的子目录包含其他类型的文件；例如，脚本可能包含用于 Web 服务器的动态脚本文件。Web 服务器应该允许用户仅访问根的这些特定目录和子目录。然而，`directory-traversal`\
  \ 攻击允许访问文件系统的其他目录。\n\n运行 `IIS` 的 `Windows 2000` 系统容易受到 `directory-traversal` 攻击，也称为\
  \ `Unicode exploit`。`IIS` 中允许目录遍历的漏洞仅发生在未打补的 `Windows 2000` 系统中，并影响 `CGI` 脚本和 Internet\
  \ Server API 扩展（如 `.asp`）。漏洞的存在是因为 `IIS` 解析器没有正确解释 `Unicode`，从而让黑客获得了系统级访问权限。\n\n\
  本质上，`Unicode` 将任何语言的字符转换为通用的十六进制规范。然而，`Unicode` 被解释了两次，而解析器只扫描一次生成的请求（在第一次解释之后）。因此，黑客可以通过\
  \ `IIS` 溜入文件请求。例如，在相对路径中使用 `%c0%af` 代替斜杠就利用了 `IIS` 漏洞。在某些情况下，该请求让黑客访问他们本不应该看到的文件。`Unicode\
  \ directory traversal` 漏洞允许黑客添加、更改或删除文件，或在服务器上上传并运行代码。在系统上添加或运行文件的能力使黑客能够在系统上安装木马或后门。\n\
  \n![note.eps](img/note_fmt.gif)\n\n`IIS Unicode exploit` 是一个过时的漏洞，本文将其作为概念证明提出——即证明该漏洞存在并可以被利用。\n\
  \n`Buffer overflow` 攻击并不是 Web 服务器所有，也可以针对其他类型的系统。`buffer overflow` 涉及发送比 Web 服务器处理能力的数据（通常以文本字符串的形式）。`buffer\
  \ overflows` 的主要切入点是 Web 服务器上的 Web 表单。`Buffer overflows` 和应对措施将在下一章中详细介绍。\n\n`Source\
  \ disclosure` 攻击发生在服务器应用程序的源代码可以被收集时。`Source disclosure` 攻击可能导致黑客识别应用程序类型、编程语言和其他其他应用程序特定信息。所有这些信息都可以让潜在的黑客识别漏洞和可以传递到\
  \ Web 服务器的潜在利用程序。再次，黑客的大部分时间花在收集目标信息上，以识别利用的最佳切入点。\n\n### 使用源码泄露攻击整合一切\n\n\n\n\n\
  \n执行源码泄露攻击的一个示例是针对 Web 服务器运行 `BlackWidow`，并将所有文件复制到本地目录。通过审查来自 `BlackWidow` 的源文件，你可以获取服务器名称、IP\
  \ 地址和版本号。此外，额外的信息收集工具（如 `Netcraft`）可以帮助发现 `OS`、Web 服务器软件类型和版本。还可以收集有关服务器上运行的 JavaScript（`.js`\
  \ 文件）或活动服务器页面（`.asp` 文件）的额外信息。根据 Web 服务器应用程序和漏洞，可以使用 `Metasploit` 向服务器发送有效荷。根据补丁级别和漏洞情况，该有效荷可能是相当无害的，也可能严重到足以让黑客获取贵贵数据。应对源码泄露攻击和其他类型攻击的最佳措施是将\
  \ `OS`、Web 服务器以及所有服务器应用程序补丁到最新水平，并维护活跃的补丁管理计划。\n\n`CEH` 必须了解所有的信息收集技术，以识别 Web 服务器和\
  \ Web 中的潜在漏洞。这些知识对 `CEH` 来说如此重要，是因为他们需要防御同样的攻击并实施应对措施来防止攻击。\n\n## 补丁管理技术\n\n补丁管理在防止和减轻针对\
  \ Web 服务器及 Web 应用程序的攻击风险方面起着关键作用。补丁管理是更新系统供应商所需的适当补丁热修复的过程。适当的补丁管理涉及选择如何安装和验证补丁，并在安装之前在非生产网络上对这些补丁进行测试。\n\
  \n你应该维护应用到每个系统的所有补丁的日志。为了方便安装补丁，你可以使用 `PatchLink`、`St. Bernard Software`、`Microsoft`\
  \ 以及其他软件供应商提供的自动化补丁管理系统来评估你的系统并决定部署哪些补丁。\n\n![realworld.eps](img/realworld_fmt.gif)\n\
  \n## Web 服务器管理员入职的第一周\n\n作为一家拥有 40 名员工的小型公司的新入职网络管理员，我的职责是审查包含两台服务器的小网络配置和补丁。该公司在\
  \ `Windows 2000` 服务器上使用 `IIS 5.0`，该服务器已为客户提供了三年的公司网站。服务器是在我加入员工三年前由一家咨询公司安装和配置的。网站内容由营销助理定期更新，但对服务器没有进行过任何其他更新。\n\
  \n因此，我开始对 Web 服务器进行更新和补丁管理。该公司没有防火墙来保护互联网连接，且 `Windows Server OS` 自安装以来未应用过任何补丁或热修复。`IIS`\
  \ Web 服务器软件也已过时。这一切给组织构成了巨大的安全风险，补丁管理是保护 Web 服务器及其运行其上的应用程序的最高优先级任务。\n\n当我应用安全补丁和热修复时（先是\
  \ `OS` 然后是 `IIS`），我发现恶意软件（如 `Code Red` 蠕虫和许多病毒）已经攻击了系统。花费几天时间应用补丁、热修复并更新病毒定义后，Web\
  \ 服务器才更新到位。对于这家小公司来说，幸运的是，我在网络损坏或发生严重安全漏洞之前，将 `OS` 和 Web 服务器软件更新到了，并实施了补丁管理系统。\n\
  \n## 黑客工具\n\n`N-Stalker Web Application Security Scanner` 允许你对 Web 应用程序进行大量漏洞评估，包括跨站脚本、`SQL\
  \ injection`、缓冲区溢出和参数篡改攻击。\n\n`Metasploit Framework` 是用于测试或破解操作系统或 Web 服务器软件的免费工具。漏洞可以作为插件使用，并可以在\
  \ `Windows` 或 `Unix` 平台执行测试。`Metasploit` 原本是一个命令行程序，但现在有了 浏览器界面。使用 `Metasploit`，黑客可以编写自己的漏洞，也可以利用标准漏洞。\n\
  \n`CORE IMPACT` 和 `SAINT Vulnerability Scanner` 是用于测试和破解操作系统及 Web 服务器软件的商业漏洞工具。\n\
  \n## Web 服务器加固方法\n\nWeb 服务器管理员可以做很多来加固服务器（提高安全性）。以下是增加 Web 服务器安全性的方法：\n\n*   重命名管理员账户并使用强密码。在\
  \ `Windows` 中重命名管理员账户，打开 `User Manager`，右键点击 `Administrator` 账户并选择 `Rename`。\n*\
  \   禁用默认网站和 FTP 站点。禁用默认网站的过程在本章前面已描述过：在 `IIS Manager` 中右键点击默认网站并选择 `Stop`。相同的过程适用于默认\
  \ FTP 站点。\n*   从服务器上移除未使用的应用程序，例如 `WebDAV`。可以通过 `Windows` 控制面板中的 `Add/Remove Programs`\
  \ 移除服务器上不必要的应用程序。\n*   在 Web 服务器的配置设置中禁用目录浏览。\n*   在网站上添加法律声明，让潜在攻击者意识到入侵网站的后果。\n\
  *   对操作系统和 Web 服务器软件应用最新的补丁、热修复和服务程序包。\n*   对 Web 表单和查询字符串的输入进行边界检查，以防止缓冲区溢出或恶意输入攻击。\n\
  *   禁用远程管理。\n*   使用脚本将未使用的文件扩展名映射到 `404`（未找到文件）错误消息。\n*   启用审计和日志记录。\n*   在 Web\
  \ 服务器和互联网之间使用防火墙，并仅允许必要的端口防火端口（如 `80` 和 `443`）。\n*   在向 Web 服务器发送数据时，将 `GET` 方法替换为\
  \ `POST` 方法。\n\n## Web 应用程序漏洞\n\n除了了解黑客如何利用 Web 服务器，`CEH` 熟悉 Web 应用程序漏洞也非常重要。在本节中，我们将讨论\
  \ Web 应用程序如何工作，以及 Web 应用程序攻击的目标。我们还将分析 Web 应用程序攻击的构造以及一些真实的 Web 应用程序威胁。最后，我们将查看\
  \ Google 黑客攻击和你应该熟悉的应对措施。\n\nWeb 应用程序是位于 Web 服务器上的程序，为用户提供除网站之外的功能。数据库查询、网络邮箱、讨论组和博客都是\
  \ Web 应用程序的示例。\n\nWeb 应用程序使用客户端/服务器架构， 浏览器作为客户端，Web 服务器作为应用程序服务器。`JavaScript` 是实现\
  \ Web 应用程序的流行方式。由于 Web 应用程序应用广泛，任何拥有浏览器的用户都可以与站点程序进行交互。\n\n\n\n\n\nWeb 服务器上存在许多\
  \ Web 应用程序威胁。以下是最常见的威胁及其防御措施：\n\n### 跨站脚本 (Cross-Site Scripting)\n输入 Web 表单的参数会被\
  \ Web 应用程序处理。变量的错误组合可能导致任意命令执行。防御措施：验证 Cookie、查询字符串、表单字段和隐藏字段。\n\n![note.eps](img/note_fmt.gif)\n\
  \n防御跨站脚本的一种对策是使用服务器脚本将左、右尖角字符（`<` 和 `>`）替换为 `&lt;` 和 `&gt;`。防御 SSL 攻击的对策是安装代理服务器并在代理处终止\
  \ SSL 连接，或安装硬件 SSL 加速器并在该层终止 SSL 连接。\n\n### SQL 注入\n在 URL 中插入 SQL 命令会导致数据库服务器转储（dump）、修改、删除或在数据库中创建信息。SQL\
  \ 注入将在第 9 章“攻击应用程序：SQL 注入与缓冲区溢出”中进行详细介绍。防御措施：验证用户变量。\n\n### 命令注入\n黑客在 Web 表单中插入编程命令。防御措施：使用针对特定编程语言的库。\n\
  \n### Cookie 投毒与嗅探\n黑客损坏或窃取 Cookie。防御措施：不要在 Cookie 中存储密码；实施 Cookie 超时；以及对 Cookie\
  \ 进行身份验证。\n\n### 缓冲区溢出\n大量数据通过 Web 表单发送到 Web 应用程序以执行命令。缓冲区溢将在第 9 章中详细介绍。防御措施：验证用户输入长度；执行边界检查。\n\
  \n### 身份验证劫持\n黑客在用户身份验证后窃取会话。防御措施：使用 SSL 加密流量。\n\n### 目录遍历/Unicode\n黑客通过 Web 浏览器或\
  \ Windows 资源管理器浏览系统上的文件夹。防御措施：为 Web 服务器上的私有文件夹定义访问权限；应用补丁和热修复。\n\n### 攻击工具\n\n`Instant\
  \ Source`允许黑客查看并编辑 HTML 源代码。它可以从浏览器内部直接使用。\n\n`Wget`是一个命令行工具，黑客可以用它下载包含所有文件的整个网站。黑客可以离线查看源代码并在对真实\
  \ Web 服务器发起之前测试某些攻击。\n\n`WebSleuth` 使用爬虫技术索引整个网站。例如，`WebSleuth`可以从网站的不同页面抓取所有的电子邮件地址。\n\
  \n`BlackWidow`可以扫描并映射网站的所有页面，以创建站点概况。\n\n`SiteScope`映射出 Web 应用程序内部的连接，并辅助程序的解构。\n\
  \n`WSDigger`是一个 Web 服务测试工具，包含了针对 SQL 注入、跨站脚本和其他 Web 攻击的示例攻击插件。\n\n`Burp`是一个基于 Windows\
  \ 的 Web 应用程序自动化攻击工具。它还可以用于猜解 Web 应用程序的密码并执行中间人攻击。\n\n### Google 黑客 (Google Hacking)\n\
  \nGoogle 黑客是指使用 Google 强大的搜索引擎来定位高价值目标，或搜索如密码等贵贵信息。\n\n许多工具，如[`johnny.ihackstuff.com`](http://johnny.ihackstuff.com)和`Acunetix\
  \ Web Vulnerability Scanner`，包含一个在数据库中组织的 Google 黑客术语列表，以便于搜索（参见练习 8-5）。例如，您可以在\
  \ Google 搜索引擎中输入词`password`或`medical records`并查看可用信息。许多时候，Google 可以直接从私有数据库或文档中提取信息。\n\
  \n### 练习 8-5：使用 Acunetix Web Vulnerability Scanner\n\n1. 从[www.acunetix.com](http://www.acunetix.com)下载并安装`Acunetix\
  \ Web Vulnerability Scanner`。\n\n2. 打开 Web 扫描器并选择`File ⇒ New Scan`以打开`Scan Wizard`：\n\
  \n![g0808.tif](img/g0808_fmt.jpg)\n\n3. 按照向导提示进行操作；接受初始扫描的默认值。\n\n4. 扫描完成后查看扫描报告。注意报告中的\
  \ Web 服务器和应用程序漏洞。\n\n![g0809.tif](img/g0809_fmt.jpg)\n\n5. 使用向导创建另一个扫描，并将目标指向实验室\
  \ Web 服务器或 Web 服务器虚拟机。查看并分析您的实验室 Web 服务器的扫描报告。\n\n### 基于 Web 的密码破解技术\n\n作为一名认证伦黑客（CEH），你需要熟悉黑客用于破解基于\
  \ Web 的密码的技巧。这包括能够列出各种身份验证类型、了解什么是密码破解器、识别密码破解技术的分类，并了解可用的防御措施。我们将在接下来的章节中详细介绍。\n\
  \n### 身份验证类型\n\nWeb 服务器和 Web 应用程序支持多种身份验证类型。最常见的是`HTTP 身份验证`。`HTTP 身份验证`有两种类型：`basic`（基本）和`digest`（摘要）。`基本\
  \ HTTP 认证`以明文发送用户名和密码，而`摘要认证`对凭据进行哈希处理并使用挑战-响应模型进行身份验证。\n\n此外，Web 服务器和 Web 应用程序支持以下类型的身份验证：\n\
  \n- **NTLM 身份验证**：这种类型使用`Internet Explorer`和`IIS` Web 服务器，使得`NTLM`更适用于使用 Microsoft\
  \ 操作系统的内网内部身份验证。`Windows 2000`和`2003`服务器利用`Kerberos 认证`作为更安全的选项。\n- **基于证书的身份验证**：这种类型使用`x.509`证书进行公/私钥技术。\n\
  - **基于令牌的身份验证**：令牌（如`SecurID`）是一种显示 60 秒身份验证的硬件设备；用户使用代码登录网络。\n- **生物识别身份验证**：这种类型使用指纹、眼睛虹膜或手印等物理特征来验证用户。\n\
  \n### 密码攻击与密码破解\n\n三种类型的密码攻击如下：\n\n- **字典 (Dictionary)**：使用字典中可以找到的密码\n- **暴力破解\
  \ (Brute-Force)**：猜解使用字母、数字和特殊字符的复杂密码\n- **混合 (Hybrid)**：使用数字或特殊字符代替字母的字典单词\n\n\
  密码破解器旨在解密密码或禁用保护的程序。密码破解器依赖字典搜索（攻击）或暴力破解方法来破解密码。\n\n字典攻击的第一步是生成密码列表。黑客通常使用字典生成器或从网上下载的字典创建此列表。接下来对字典列表进行哈希或加密。将其与黑客试图破解的哈希密码进行比较。黑客可以通过从有线或无线网络嗅探，或直接从系统硬盘上的安全账户管理器（SAM）或影子密码文件中获取哈希密码。最后，程序显示未加密的密码版本。字典破解器只能发现字典单词。\n\
  \n如果用户实施了强密码，则可以实施暴力破解破解。暴力破解破解器会尝试字母、数字和特殊字符的所有组合，由于排列组合巨大，比字典攻击慢得多。练习 8-6 将引导你使用一个名为`Brutus`的密码破解器。\n\
  \n#### 练习 8-6：使用密码破解器\n\n1. 从[www.hoobie.net](http://www.hoobie.net)下载并安装`Brutus`。\n\
  \n2. 打开`Brutus`并在目标字段中输入 Web 服务器地址。\n\n![g0810.tif](img/g0810_fmt.jpg)\n\n3. 点击`Start`按钮并在屏幕底部的正身份验证结果字段中查看密码。\n\
  \n\n\n\nWebcracker 是一种使用字典列表尝试登录 Web 服务器的工具。它通过寻找“HTTP 302 object moved（对象移动）”响应来猜测密码。通过这种响应，工具可以确定所使用的身份验证类型并尝试登录系统。\n\
  \n破解密码的最佳防御措施是实施强密码，长度至少为八个字符（旧标准为六个），并包含字母和数字。用户名和密码应该保持不同，因为许多用户名是以明文传输的。需要大写字母、小写字母以及数字或特殊字符的复杂密码更破解。你应该实施如\
  \ Kerberos 或令牌（tokens）等强身份验证机制来保护传输中的密码。\n\n## 总结\n\n随着互联网的日益普及，Web 服务器和 Web 攻击一直是最受关注的问题。客户使用\
  \ Web 服务器和互联网来研究公司、在线购物、访问银行和投资公司的数据库，并进行许多其他数据库搜索。随着这些用量的增加，潜在的目标信息变得越来越有价值。信用卡号、个人信息和社安号码是黑客的终极目标，而所有这些信息都存储在\
  \ Web 应用程序数据库中。\n\nWeb 服务器和 Web 攻击是黑客试图攻破 Web 服务器安全并投放能够获取价值信息的漏洞的方法。CEH（认证伦理黑客）需要精通识别潜在漏洞以及防止\
  \ Web 服务器攻击的防御措施。\n\n## 考试要点\n\n- 了解 Web 服务器漏洞的类型。配置错误、操作系统或应用程序的漏洞和缺陷、操作系统和 Web\
  \ 服务器软件的默认安装、缺乏补丁管理以及缺乏适当的安全策略和程序都是 Web 服务器漏洞。\n- 了解常见的 Web 应用程序威胁。跨站脚本（XSS）、SQL\
  \ 和命令注入、Cookie 投毒和嗅探、缓冲区溢出、身份验证劫持和目录遍历都是常见的 Web 应用程序威胁。\n- 理解 Google 黑客攻击。Google\
  \ 黑客涉及使用 Google 搜索引擎来定位密码、信用卡号、医疗记录或其他机密信息。\n- 理解补丁管理技术。补丁管理对于确保系统更新最新的安全修复至关重要。应该定义并遵循测试、应用和记录系统补丁的流程。\n\
  - 了解 Web 服务器的各种身份验证机制。HTTP 基础认证和摘要认证、NTLM、令牌、生物识别和证书都是对 Web 服务器进行身份验证的方法。\n- 理解密码破解器的工作原理。密码破解器使用哈希字典文件来破解密码。\n\
  - 了解密码攻击的类型。字典攻击、混合攻击和暴力破解是三种密码攻击类型。\n\n## 复习题\n\n1\\. 下列哪些是 HTTP Web 身份的类型？（选择所有适用项。）\n\
  A. 摘要 (Digest)\nB. 基础 (Basic)\nC. Windows\nD. Kerberos\n\n2\\. 下列哪个是缓冲区溢出攻击的防御措施？\n\
  A. 输入字段长度验证\nB. 加密\nC. 防火墙\nD. 使用 Web 表单\n\n3\\. 显示每 60 秒变化一次登录信息的硬件设备被称为 ____________________。\n\
  A. 登录器\nB. 身份验证服务器\nC. 生物识别认证\nD. 令牌 (Token)\n\n4\\. 哪个是常见的 Web 服务器漏洞？\nA. 限制用户账户\n\
  B. 默认安装\nC. 开放共享\nD. 无目录访问\n\n5\\. 密码 P@SSWORD 可以使用哪种类型的攻击破解？\nA. 暴力破解\nB. 混合\n\
  C. 字典\nD. 零日漏洞利用\n\n6\\. 下列哪个是身份验证劫持的防御措施？\nA. 身份验证日志\nB. Kerberos\nC. SSL\nD. Active\
  \ Directory\n\n7\\. 为什么 Web 服务器比其他系统更容易受到攻击？\nA. Web 服务器总是可访问的。\nB. 攻击 Web 服务器不需要很高的黑客能力。\n\
  C. Web 服务器通常放置在安全的 DMZ 中。\nD. Web 服务器很容易被利用。\n\n8\\. 驻留在 Web 服务器上的客户端/服务器程序被称为 ____________________。\n\
  A. 互联网程序\nB. Web 应用程序\nC. 补丁\nD. 配置文件\n\n9\\. 哪个是目录遍历攻击的防御措施？\nA. 强制执行文件夹权限。\nB.\
