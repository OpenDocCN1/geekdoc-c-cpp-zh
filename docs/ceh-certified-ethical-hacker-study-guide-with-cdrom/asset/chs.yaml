  \n出现 CD 界面。该界面允许您只需点击两次即可访问内容。\n\n# 故障排除\n\nWiley 已尝试提供可以在大多数具有最低系统要求的计算机上运行的程序。遗憾的是，您的计算机可能不同，某些程序由于某些原因无法正常运行。\n\
  \n最可能的两个问题是：运行所需的程序没有足够的内存（`RAM`），或者有其他程序正在运行影响了程序的安装或运行。如果您收到如“内存不足”或“安装无法继续”的错误消息，请尝试以下一个或多个建议，然后重新尝试软件：\n\
  \n* 关闭计算机上运行的所有防病毒软件。安装程序有时会模拟病毒活动，可能会让您的计算机错误地认为自己受到了病毒感染。\n* 关闭所有运行中的程序。运行的程序越多，提供给程序的内存就越少。安装程序通常会更新文件和程序；因此如果您保持其他程序运行，安装可能无法正常工作。\n\
  * 让本地电脑商店为您的计算机添加更多 `RAM`。诚然，这是一个剧烈且有些昂贵的步骤。然而，增加内存确实可以提高计算机运行速度，并允许更多程序同时运行。\n\n\
