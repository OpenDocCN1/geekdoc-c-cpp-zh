  \ A. `ICMP` 超时类型为 11，代码为 0。更多信息，请参阅第 3 章。\n\n# 第 1 章：道德黑客、伦理与法律导论\n\n## 本章涵盖的 CEH\
  \ 考试目标：\n* 理解道德黑客的专业术语\n* 定义道德黑客的职业角色\n* 理解参与道德黑客涉及的不同阶段\n* 识别不同类型的黑客技术\n* 列出道德黑客的五个阶段\n\
  * 什么是黑客主义（hacktivism）？\n* 列出不同类型的黑客分类\n* 定义成为道德黑客所需的技能\n* 什么是漏洞研究？\n* 描述实施道德黑客的方法\n\
  * 理解黑客行为法律影响\n* 理解美国联邦法 `18 USC §1030`\n\n大多数人认为黑客拥有非凡的技能和知识，使他们入侵计算机系统并发现有价值的信息。“黑客”一词让人联想到年轻计算机天才的形象，他们在电脑屏幕前输入几条命令——砰的一声！电脑就输出了密码、账号或其他机密数据。实际上，一个优秀的黑客（或作为道德黑客的安全专业人员）只需要理解计算机系统是如何工作的，并知道使用何种工具来发现安全漏洞。本书将教你许多黑客用于收集价值数据和攻击计算机系统的相同技术和软件工具。\n\
  \n黑客的世界及其运作方式对大多数计算机和安全专业来说是未知的。黑客使用特殊的计算机软件来获取信息。通过学习黑客使用的相同技术和软件工具，你将能够防御网络恶意攻击。\n\
  \n本章的目标是带你进入黑客的世界，并定义讨论安全时使用的术语。\n\n## 定义道德黑客\n\n下一节将解释道德黑客的目的是以及道德黑客的具体工作。如前所述，道德黑客必须始终以专业的方式行动，以与恶意黑客区分开来。获得客户的信任并在渗透测试期间采取所有预防措施确保不对其系统造成损害，是成为专业人士的关键。道德黑客的另一个核心组成部分是在访问计算机系统之前，始终获得数据所有者的许可。\n\
  \n\n\n\n\n当我告诉人们我是一个伦理黑客时，我通常会听到冷笑和诸如“那是自矛盾”之类的评论。很多人问：“黑客行为可以是伦理的吗？”是的！这最能描述我作为一个安全专业人员所的工作。我使用与恶意黑客相同的软件工具和技术来寻找计算机网络和系统中的安全漏洞。然后，我应用必要的修复或补丁，以防止恶意黑客获取数据。这是一个无止的循环，因为计算机系统中不断被发现新的漏洞，而软件供应商也会不断创建补丁来缓解攻击风险。\n\
  \n伦理黑客通常是安全专业人员或网络渗透员，他们将黑客技能和工具集用于防御和保护目的。作为安全专业人员的伦理黑客会使用黑客可能用于破坏网络的工具来测试其网络和系统的漏洞。任何计算机专业人士都可以学习伦理黑客技能。\n\
  \n`cracker`（破坏者）一词描述的是利用黑客技能和工具集进行破坏性或攻击性目的的海客，例如传播病毒或执行拒绝服务（`DoS`）攻击，以破坏或导致系统和网络。这些黑客不再仅仅是为了好玩，有时他们为了损害企业声誉、盗取或暴露信用卡信息，同时减慢业务流程并损害组织的完整性而获得报。\n\
  \n![note.eps](img/note_fmt.gif)\n\n黑客可以分为三类：\n\n*   `White Hats`（白帽）：好人，伦理黑客\n*\
  \   `Black Hats`（黑帽）：坏人，恶意黑客\n*   `Gray Hats`（灰帽）：好坏黑客；取决于情况\n\n伦理黑客通常属于白帽类，但有时他们是成为安全专业人员的前灰帽，他们现在以伦理的方式使用自己的技能。\n\
  \n## 白帽\n\n白帽是好人，即将黑客技能用于防御目的的伦理黑客。白帽黑客通常是具有黑客知识和工具集知识的安全专业人员，他们利用这些知识定位漏洞并实施应对措施。白帽黑客是考试的首选人。白帽是在获得数据所有许可的情况下进行黑客的人。在开始任何黑客活动之前获得许可是关重要的。这正是安全专业人员与白帽与不可信任的恶意黑客的区别。\n\
  \n## 黑帽\n\n黑帽是坏人：即为了非法或恶意目的使用其技能的恶意黑客或 `crackers`。他们带有恶意意图入侵或以违反远程系统的系统完整性。在获得未经授权的访问后，黑帽黑客破坏重要数据，拒绝合法用户的服务，并为他们的目标制造麻烦。黑帽黑客和\
  \ `crackers` 很容易与白帽黑客区分开，因为他们的行为是恶意的。这是黑客的传统定义，也是大多数人认为黑客的样子。\n\n## 灰帽\n\n灰帽是根据情况可能从事攻击或防御工作的黑客。这是黑客与\
  \ `cracker` 之间的分界线。灰帽黑客可能只是对黑客工具和技术感兴趣，并不是恶意的黑帽。灰帽是自封的伦理黑客，他们主要出于好奇对黑客工具感兴趣。他们可能想强调系统中的安全问题或教育受害者让他们妥善地保护系统。这些黑客正在为他们的“受害者”提供帮助。例如，如果在投资银行提供的服务中发现漏洞，黑客通过给银行一个纠正漏洞的机会是在帮助该银行。\n\
  \n从一个更具争议的角度来看，一些人认为黑客行为本身是不符合伦理的，就像入室盗窃一样。但“伦理”黑客排除破坏行为的信念至少缓解了那些自认为是“良性”黑客的行为。根据这种观点，进入系统然后向系统操作员准确说明是如何操作的以及如何堵住漏洞，可能是“黑客式”礼貌最高的形式之一；黑客正作为一个不付薪且未经请求的特种队（一组受雇进行安全审计的小组）。这种方法让许多伦理黑客陷入了法律麻烦。在参与伦理黑客活动时，请确保你了解法律和你的法律责任。\n\
  \n许多自封的伦理黑客试图以顾问的身份进入安全领域。大多数公司并不看好带着机密数据出现在门口，并提议“为了价格”“修复”安全漏洞的人。其反应从“感谢提供这些信息，我们会修复问题”到报警警察逮捕这个自封的伦理黑客不等。\n\
  \n白帽和灰帽的区别在于那一个“许可”一词。虽然灰帽可能有良好的意图，但如果没有正确的许可，他们就不再被认为是伦理的。\n\n现在你已经理解了黑客的类型，让我们来看看黑客是做什么的。这看起来可能很简单——他们黑入计算机系统——但有时并不那么简单或模糊。这里有一个应该遵循的流程，以及一些需要记录的信息。在下一节中，我们将看看黑客，最重要的是伦理黑客在做什么。\n\
  \n## 伦理黑客做什么？\n\n伦理黑客的动机各异，但他们的目的通常与 `crackers` 相同：他们试图确定入侵者在目标网络或系统上可以看到什么，以及黑客可以使用这些信息做什么。这种测试系统或网络安全性的过程被称为\
  \ `penetration test`（渗透测试），或 `pen test`。\n\n黑客入侵计算机系统。与广传的神话相反，这样做通常并不涉及神秘的黑客式才华横溢，而是坚持不懈地重复一些相当为人知的技巧，这些技巧利用了目标系统安全性中的常见漏洞。`pen\
  \ test` 不过是使用与恶意黑客相同的工具执行这些相同的步骤，以查看使用黑客工具和技术可以暴露哪些数据。\n\n许多伦理黑客作为负责防御恶意活动的安全团队的一部分，检测恶意黑客活动。在受雇后，伦理黑客会询问组织要保护什么、防止谁的，以及公司愿意为了保护投入多少资源。然后就可以围绕需要保护的数据和潜在风险建立\
  \ `penetration test plan`。\n\n记录各种测试的结果对于产生 `pen test` 的最终产品：`pen test report` 至关重要。获取潜在价值信息的截图或保存日志文件对于在\
  \ `pen test report` 中向客户展示发现至关重要。`pen test report` 是系统中所有风险的汇总。关于 `pen test report`\
  \ 内容的更多细节将在本书最后一章讨论。\n\n## 攻击者试图实现的目标\n\n无论是由伦理黑客还是恶意黑客实施，所有攻击都是尝试突破计算机安全。安全性由四个基本元素组成：\n\
  \n*   `Confidentiality`（机密性）\n*   `Authenticity`（真实性）\n*   `Integrity`（完整性）\n* \
  \  `Availability`（可用性）\n\n\n\n\n\n黑客的目标是利用系统或网络中的漏洞，在安全四个要素中的一个或多个方面寻找弱点。例如，在执行拒绝服务（`DoS`）攻击时，黑客攻击的是系统和网络的可用性要素。虽然\
  \ `DoS` 攻击有许多形式，但其主要目的是消耗系统资源或带宽。涌入目标系统的大量信息本质上会迫使其关闭，从而拒绝为系统的合法用户提供服务。尽管媒体关注 `DoS`\
  \ 攻击的目标，但实际上，此类攻击有许多受害者——包括最终目标以及入侵者所控制的系统。\n\n信息窃取（例如在数据跨信誉网络以明文传输时窃取密码或其他数据）属于机密性攻击，因为它允许预期接收者之外的人员获取数据。这种窃取不仅限于网络服务器上的数据。笔记本电脑、磁盘和备份磁带都面临风险。这些公司拥有的设备充满了机密信息，可以为黑客提供有关组织所实施的安全措施的信息。\n\
  \n位翻转攻击（Bit-flipping attacks）被视为完整性攻击，因为数据在传输过程中或在计算机系统中存储时可能被篡改；因此，系统管理员无法验证数据是否如发送者所意的那。位翻转攻击是对加密密码的攻击：攻击者改变密文以导致明文发生可预测的变化，尽管攻击者本身并不能获知明文。这种攻击的目标不是密码本身，而是某条消息或系列消息。在极端情况下，这可能变成针对使用该密码的通道上所有消息的\
  \ `DoS` 攻击。当攻击者知道消息格式时，这种攻击尤为危险。当位翻转攻击应用于数字签名时，攻击者可能可以将一张注明“我欠你 $10.00”的期票更改为“我欠你\
  \ $10,000”的期票。\n\n`MAC` 地址欺骗是一种身份验证攻击，因为它允许在实施了媒体访问控制（`MAC`）过滤（例如在无线网络上）的情况下未经授权设备连接到网络。通过伪造合法无线站的\
  \ `MAC` 地址，入侵者可以冒充该站的身份并使用网络。\n\n# 道德黑客的技能 set\n\n能够在恶意黑客领先一步的道德黑客必须是计算机系统专家，对计算机编程、网络和操作系统有非常深入的了解。对针对性极强的平台（如\
  \ `Windows`、`Unix` 和 `Linux`）的深入知识也是一项要求。耐心、坚持和巨大的毅力是道德黑客的重要特质，因为大多数攻击要产生效果需要很长时间和高度的专注。网络技术、Web\
  \ 编程和数据库技能在执行道德黑客和漏洞测试时都是非常有用的。\n\n大多数道德黑客都是全才型，在计算机和网络方面拥有广泛的知识。在某些情况下，道德黑客将作为“红队小组”（tiger\
  \ team）的一部分被雇佣测试网络和计算机系统并寻找漏洞。在这种情况下，团队的每个成员将有不同的专长，道德黑客可能在计算机系统和网络的某个领域需要更专业的技能。大多数道德黑客对安全领域和相关问题了如指，但不一定对防止攻击的防御措施有强大的掌握。\n\
  \n# 道德黑客术语\n\n理解并定义术语是 `CEH` 责任的重要部分。这些术语是作为道德黑客身份的安全专业人员进行交流的语言。这种黑客的“语言”是学习本书后续章节中概念的基础。在本节中，我们将讨论你参加\
  \ `CEH` 认证考试需要熟悉的若干术语：\n\n- **威胁（Threat）**：可能导致安全潜在泄露的环境或情况。道德黑客在执行安全分析时会寻找并优先考虑威胁。恶意黑客及其使用的软件和黑客技术本身就是组织信息安全的威胁。\n\
  \n- **利用程序（Exploit）**：利用漏洞、故障或弱点的软件或技术，导致计算机系统上出现未经授权的访问、权限提升或拒绝服务。恶意黑客正在计算机系统中寻找利用程序，以为为初始攻击打开大门。大多数利用程序是短小的计算机代码字符串，在系统上执行时会暴露漏洞。经验丰富的黑客会创建自己的利用程序，但对于道德黑客来说并不需要任何编程技能，因为许多黑客软件程序都有现成的利用程序，可以针对计算机系统或网络发动。利用程序是通过漏洞突破\
  \ IT 系统安全性的定义方式。\n\n- **漏洞（Vulnerability）**：软件缺陷、逻辑设计或实现错误的存在，可能导致意料之外且非预期的事件对系统执行有害或破坏性的指令。编写利用程序代码是为了针对漏洞并导致系统发生故障，以获取贵贵数据。\n\
  \n- **评估对象（Target of Evaluation, TOE）**：作为安全分析或攻击对象的系统、程序或网络。道德黑客通常关注高价值的 `TOEs`，即包含账号、密码、社会安全号码或其他机密数据的系统。道德黑客的目标是针对高价值的\
  \ `TOEs` 测试黑客工具，以确定漏洞并进行补丁，以防止利用和敏感数据的泄露。\n\n- **攻击（Attack）**：当系统根据漏洞被攻破时，攻击就会发生。许多攻击通过利用程序持续。道德黑客使用工具寻找由于操作系统、网络配置或系统上安装的应用程序而可能受到利用程序的系统，并防止攻击。\n\
  \n将利用程序交付到计算机系统有两种主要方法：\n\n1. **远程（Remote）**：利用程序通过网络发送，并在无需预先访问漏洞系统的情况下利用安全漏洞。从外部发起的针对企业计算机系统或网络的黑客攻击被认为是远程的。大多数人在听到黑客一词时会想到这种攻击，但实际上大多数攻击属于下一类。\n\
  \n2. **本地（Local）**：利用程序直接交付到计算机系统或网络，这需要预先访问漏洞系统以提高权限。信息安全策略的设计应确保只有需要访问信息的人才被允许访问，并且他们拥有执行工作职责所需的最低级别权限。这些概念通常被称为“按需知道”和“最小权限”，如果使用得当，可以防止本地利用。大多数黑客尝试发生在组织内部，由员工、承包商或其他信任职位的人实施。为了让内部人员发动攻击，他们必须拥有比按需所需许可更高的权限。\n\
  \n# 道德黑客攻击的阶段\n\n道德黑客的过程可以分为五个不同的阶段。在本书的后部分，黑客软件程序和工具将归类到每个步骤中。\n\n\n\n\n\n伦理黑客遵循的流程与恶意黑客相似。无论黑客的意图如何，获取并维持计算机系统访问的步骤都是相似的。图\
  \ 1-1 描述了黑客在攻击计算机系统时通常遵循的五个阶段。\n\n图 1-1: 黑客的阶段\n\n![f0101.eps](img/f0101_fmt.gif)\n\
  \n## 黑客阶段\n\n黑客通常分为五个不同的阶段。\n\n## 第 1 阶段：被动和主动侦察\n\n被动侦察涉及在目标个人或公司不知情的情况下收集有关潜在目标的信息。被动侦察可以简单到观察一栋建筑，以识别员工进入离开建筑的时间。然而，大多数侦察是在电脑前完成的。\n\
  \n当黑客在寻找潜在目标的信息时，他们通常会对个人或公司进行互联网搜索以获取信息。我相信你们中的许多人曾对自己的名字或潜在雇主进行过同样的搜索，或者只是为了收集某个主题的信息。这种过程用于收集有关攻击边界（TOE）的信息时，通常被称为信息收集。社会工程和垃圾翻找也被视为被动信息收集方法。\n\
  \n嗅探网络是被动侦察的另一种手段，可以产生有用信息，如 IP 地址范围、命名规范、隐藏的服务器或网络以及系统或网络上的其他可用服务。嗅探网络流量类似于监控建筑：黑客观察数据流，以查看某些交易何时发生以及流量流向何处。嗅探网络流量是许多伦理黑客常用的切入点。一旦他们使用某些黑客工具并看到通信网络上明文传输的所有数据时，他们就会渴望学习并看到更多内容。\n\
  \n嗅探工具简单易用，并能产生大量的价值信息。本书中的整一章（第 6 章“从网络收集数据：嗅探器”）专门介绍了这些工具，这些工具从字面上来说让你看到网络上传输的所有数据。很多时候，这包括用户名、密码和其他敏感数据。对于许多网络管理员和安全专业人员来说，这通常是一个大开眼界的体验，并会导致严重的安全担忧。\n\
  \n主动侦察涉及探测网络以发现网络上的单个主机、IP 地址和服务。。这一过程比被动侦察具有更高的被检测风险，有时被称为“摇摇门把”。主动侦察可以给黑客提供有关已实施安全措施的指示（正门锁了没？），但该过程也增加了被捕获或至少引起怀疑的概率。许多执行主动侦察的软件工具可以追溯到运行这些工具的计算机，从而增加了黑客被检测的几率。\n\
  \n被动和主动侦察都可以发现可用于攻击的有用信息。例如，通常很容易找到公司使用的 Web 服务器类型和操作系统（OS）版本号。这些信息可能使黑客能够在该操作系统版本中找到漏洞，并利用该漏洞以获得更多访问权限。\n\
  \n## 第 2 阶段：扫描\n\n扫描涉及利用侦察期间发现的信息，并用其来检查网络。黑客在扫描阶段可能使用的工具包括：\n\n*   拨号器\n*   端口扫描器\n\
  *   互联网控制消息协议 (ICMP) 扫描器\n*   Ping 范围扫描 (Ping sweeps)\n*   网络映射器\n*   简单网络管理协议 (SNMP)\
  \ 扫描器\n*   漏洞扫描器\n\n黑客正在寻找任何可以帮助他们攻击目标的信息，例如：\n\n*   计算机名称\n*   操作系统 (OS)\n*   已安装软件\n\
  *   IP 地址\n*   用户账户\n\n![note.eps](img/note_fmt.gif)\n\n扫描中使用的方法和工具将在第 3 章“收集网络和主机信息：扫描与枚举”中详细讨论。\n\
  \n## 第 3 阶段：获取访问\n\n第 3 阶段是真正的黑客发生的时候。侦察和扫描阶段暴露的漏洞现在被利用以获取目标系统的访问权限。黑客攻击可以通过局域网（LAN）（无论是有线还是无线）、PC\
  \ 的本地访问；互联网或离线方式传递到目标系统。示例包括基于栈的溢出、拒绝服务和会话劫持。这些主题将在后面的章节中讨论。获取访问在黑客世界中被称为“拥有系统”，因为一旦系统被破解，黑客就有了控制权，并可以随所欲地使用该系统。\n\
  \n## 第 4 阶段：维持访问\n\n一旦黑客获得了目标系统的访问权限，他们希望保留该权限以供未来的利用和攻击。有时，黑客会通过后门、根内核和木马固化其独占访问，以防御其他黑客或安全人员。一旦黑客拥有了系统，他们就可以将其作为基础发起额外的攻击。在这种情况下，被拥有的系统被称为僵尸系统。\n\
  \n## 第 5 阶段：掩盖踪迹\n\n一旦黑客能够获取并维持访问，他们就会掩盖踪迹以避免被安全人员发现，继续使用被拥有的系统，移除黑客证据或避免法律行动。黑客试图删除攻击的所有痕迹，例如日志文件或入侵检测系统（IDS）报警。攻击此阶段的活动示例包括：\n\
  \n*   隐术\n*   使用隧道协议\n*   修改日志文件\n\n用于攻击目的的隐术、隧道协议和修改日志文件将在后面的章节讨论。\n\n## 识别黑客技术类型\n\
  \n有很多方法和工具用于定位漏洞、运行利用程序和破坏系统。一旦在系统中发现漏洞，黑客就可以利用该漏洞并安装恶意软件。木马、后门和根内核都是恶意软件（malware）的形式。在漏洞被利用后，恶意软件会被安装在被破解的系统中。\n\
  \n缓冲区溢出和 SQL 注入是获取计算机系统访问的另外两种方法。缓冲区溢出和 SQL 注入主要用于针对包含数据库应用程序服务器。\n\n这些技术和攻击方法将在后面的章节中分别讨论。许多方法非常复杂，以至于整章（第\
  \ 9 章“攻击应用程序：SQL 注入与缓冲区溢出”）专门用于解释这些攻击和相关技术。\n\n大多数黑客工具利用以下四个领域的弱点：\n\n### 操作系统\n\
  许多系统管理员使用默认设置安装操作系统，导致产生未修复的潜在漏洞。\n\n### 应用程序\n开发者在编写代码时，应用程序通常不对漏洞进行充分测试，这可能会留下许多黑客可以利用的编程缺陷。大多数应用程序开发是“功能驱动”的，这意味着程序员面临截止日期，必须在最短时间内交付最稳健的应用程序。\n\
  \n### 封装代码\n许多市售软件带有普通用户并不知晓额外功能，这些功能可以被用来利用系统。例如，Microsoft Word 中的宏允许黑客从应用程序内部执行程序。\n\
  \n\n\n\n\n配置错误的系统也可能被错误配置，或者被留在最低的安全设置，以增加用户使用的便利性；这可能导致漏洞和攻击。\n\n![note.eps](img/note_fmt.gif)\n\
  \n本书将在后面的章节中深入介绍所有这些技术和黑客工具。在学习所有与攻击相关的技术之前，了解攻击类型和安全基础知识是必要的。\n\n# 识别伦理黑客类型\n\n\
  伦理黑客在模拟攻击或渗透测试期间，使用许多不同的方法攻破组织的安全性。大多数伦理黑客在以下攻击方法中的一种或几种有特长。在与客户进行初始讨论时，应该问的问题之一是是否有特定的关注领域，例如无线网络或社会工程学。这使得伦理黑客能够根据客户的需求定制执行的测试。否则，安全审计应包括尝试通过以下所有方法访问数据。\n\
  \n以下是攻击最常见的切入点：\n\n### 远程网络\n远程网络黑客试图模拟入侵者通过互联网发起攻击。伦理黑客试图破解或寻找网络外部防御的漏洞，例如 `firewall`、`proxy`\
  \ 或 `router` 漏洞。互联网被认为是最常见的黑客媒介，而实际上大多数组织已经加强了安全防御，足以防止来自公共网络的黑客。\n\n### 远程拨号网络\n\
  远程拨号网络黑客试图模拟入侵者针对客户的调制解器池发起攻击。战争拨号（War dialing）是通过重复拨号寻找开放系统的过程，是此类攻击的示例。许多组织已将拨号连接替换为专用互联网连接，因此这种方法不再像过去那样相关了。\n\
  \n### 本地网络\n局域网（`LAN`）黑客模拟具有物理访问权限的人利用本地网络获得额外的未经授权的访问。伦理黑客必须获得本地网络的直接访问才能发起此类攻击。无线局域网（`WLANs`）属于此类，由于无线电波穿过建筑结构，增加了一种全新的攻击途径。由于\
  \ `WLAN` 信号可以在建筑外识别和捕获，黑客不再需要获得建筑和网络的物理访问即可对 `LAN` 发起攻击。此外，`WLAN` 的巨大增长已成为许多组织日益增加的攻击来源和潜在风险。\n\
  \n### 被盗设备\n被盗设备攻击模拟关键信息资源（如员工拥有的笔记本电脑）被盗。通过偷取笔记本电脑可以获得 `usernames`、`passwords`、安全设置和加密类型等信息。这通常是许多组织忽视的领域。一旦黑客访问了在安全域授权的笔记本电脑，就可以收集大量信息，例如安全配置。很多时候，笔记本电脑丢失后报告得不够快，导致安全管理员无法将设备锁定在网络之外。\n\
  \n# 社会工程学\n社会工程学攻击通过电话或面对面交流收集用于攻击的信息，检查组织员工的安全性和完整性。社会工程学攻击可用于获取 `usernames`、`passwords`或其他组织安全措施。社会工程学场景通常包括黑客拨打帮助热线并说服热线员工提供机密安全信息。\n\
  \n### 物理侵入\n物理侵入攻击试图破坏组织的物理场所。获得物理访问权限的伦理黑客可以直接在目标网络的系统上植病毒、`Trojans`、`rootkits`\
  \ 或硬件键盘记录器（用于记录击键的物理设备）。此外，黑客还可以收集未存储在安全位置的机密文件。最后，对建筑的物理访问将允许黑客在网络上部署流氓设备，例如无线访问点。这些设备随后可以被黑客用于从远程位置访问\
  \ `LAN`。\n\n# 理解测试类型\n\n在执行安全测试或渗透测试时，伦理黑客会对系统使用一种或多种类型的测试。每种类型都模拟了对目标组织具有不同知识水平的攻击者。类型如下：\n\
  \n### 黑盒\n黑盒测试涉及在对网络基础设施或待测系统无预先知识的情况下进行安全评估和测试。测试模拟来自组织安全边界外的恶意黑客发起的攻击。黑盒测试可能花费最长的时间和最大的精力，因为没有给测试团队提供信息。因此，信息收集、侦察和扫描阶段将花费大量时间。这种测试类型的优点是它最接近于模拟真实恶意攻击者的方法和结果。缺点主要是测试团队花费的时间以及因此产生的额外成本。\n\
  \n### 白盒\n白盒测试涉及在对网络基础设施完全了解（如网络管理员所拥有的）的情况下进行安全评估和测试。这种测试比其他两种方法快得多，因为伦理黑客可以直接跳到攻击阶段，从而跳过所有的信息收集、侦察和扫描阶段。许多安全审计由白盒测试组成，以避免黑盒测试的额外时间和费用。\n\
  \n### 灰盒\n灰盒测试涉及在内部进行安全评估和测试。测试检查内部人员对网络的访问范围。此测试的目的是模拟最常见的攻击形式，即从网络内部发起的攻击。其理念是测试或审计给予员工或承包者的权限级别，并查看这些权限是否可以提升更高级别。\n\
  \n除了黑客可以使用的各种技术类型外，还有不同类型的攻击。攻击可以分类为被动或主动。被动和主动攻击都用于网络安全基础设施和主机。主动攻击会改变其正在攻击的系统或网络，而被动攻击试图从系统中获取信息。主动攻击影响数据的可用性、完整性和真实性；被动攻击违反了机密性。\n\
  \n除了主动和被动分类，攻击还被分为内部攻击或外部攻击。图 1-2 显示了被动/主动攻击与内部/外部攻击之间的关系。从组织边界内部产生的攻击是内部攻击，通常是由“内部人员”获取了比预期的更多的资源。外部攻击源于安全边界之外，例如互联网或远程访问连接。\n\
  \n图 1-2： 攻击类型\n\n![f0102.eps](img/f0102_fmt.gif)![note.eps](img/note_fmt.gif)\n\n\
  # 安全、功能性与易用性三角形\n\n\n\n\n\n作为一名安全专业人员，很难在添加安全屏以防止攻击与允许系统对用户保持功能性之间取得平衡。安全性、功能性和易用性三角形代表了安全性、功能性以及系统对用户的易用性之间的平衡（参见图\
  \ 1-3）。通常情况下，随着安全性的增加，系统的功能性和对用户的易用性就会降低。\n\n图 1-3： 安全性、功能性和易用性三角形\n\n![f0103.eps](img/f0103_fmt.gif)\n\
  \n在理想的世界里，安全专业人员希望所有系统都拥有最高级别的安全性；然而，有时这并非可能的。过多的安全屏会使用户难以操作系统并阻碍系统的功能。\n\n![realworld.eps](img/realworld_fmt.gif)\n\
  \n## 可用性 vs 安全性\n\n假设为了进入公司的办公室，你必须先通过停车场入口处的哨兵检查站验证你的车牌号，然后在进入大楼时出示胸牌，接着使用密码进入电梯，最后用钥匙解锁办公室门。你可能会觉得这些安全检查太严厉了！这些检查中的任何一项都可能导致你被留，从而错过重要的会议——例如，如果你的车在修理厂而你开的是租用车，或者你忘记带了进入大楼、电梯或办公室门的钥匙或胸牌。这就是可用性与安全性之间张力的例子。\n\
  \n在许多情况下，如果安全检查太严厉，人们将完全绕过它们。例如，人们可能会把门顶住以便重新进入大楼。当我在渗透测试期间进行物理安全审计时，我只是提着箱子走向大楼门口；人们总是会为提着东西的人开门。这仅仅是人性的，也是黑客绕过安全措施的一种简单方法。\n\
  \n## 漏洞研究与工具\n\n漏洞研究是发现可能导致系统攻击的漏洞和设计缺陷的过程。存在许多网站和工具可以帮助白帽子黑客维护针对系统或网络的最新漏洞及可能的利用程序的列表。系统管理员必须关注最新的病毒、木马和其他常见的漏洞，以充分保护他们的系统和网络。此外，通过熟悉最新的威胁，管理员可以学习如何检测、预防和从攻击中恢复。\n\
  \n漏洞研究与道德黑客攻击的区别在于，研究是被动地寻找可能的安全漏洞，而道德黑客攻击是尝试可以收集哪些信息。这类似于入侵者在视察大楼，看到地面的一扇窗户并心想：“嗯，也许可以用它作为切入点。”道德黑客会去尝试打开窗户，看它是否未锁以及能否提供进入大楼的权限。接下来，他们会在通过大楼进入的房间寻找任何有价值的信息。每次进入系统和增加访问级别都会为额外的利用或攻击提供脚点。\n\
  \n## 道德黑客报告\n\n网络渗透测试或安全审计的结果是道德黑客报告或渗透测试报告。这两个名称均可，且可以交叉使用。该报告详细说明了黑客活动的结果、执行的测试类型以及使用的黑客方法。结果将最初与客户同意的预期进行比较。识别出的任何漏洞都会详细说明，并提出应对措施。出于安全考虑，此文档通常以纸质格式交付给组织。\n\
  \n道德黑客报告的细节必须保密，因为它们凸显了组织的安全风险和漏洞。如果这份文档落入坏人手中，其结果对组织来说可能是灾难性的。它本质上为某人提供了组织所有安全弱点的路线图。\n\
  \n## 如何做到道德\n\n道德黑客攻击通常以结构化和组织化的方式进行，通常作为渗透测试或安全审计的一部分。测试系统和应用程序的深度宽度通常由客户的需求和关注点决定。许多道德黑客是虎队小组（tiger\
  \ team）的成员。虎队小组共同工作，执行涵盖网络、物理和系统入侵所有方面的全面测试。\n\n道德黑客必须遵循某些规则，以确保满足所有的道德和法律义务。道德黑客必须执行以下操作：\n\
  \n*   获得客户的授权，并有签署的合同，允许测试人员执行测试。\n*   在测试过程中披露机密信息的情况下，与客户维护并遵守非保密协议（`NDA`）。\n\
  *   在执行测试时保持保密。收集的信息可能包含敏感信息。绝不向第三方披露任何关于测试的信息或公司机密数据。\n*   执行测试但不超出约定的限制范围。例如，只有在事先与客户达成共识的情况下，才作为测试的一部分运行\
  \ `DoS` 攻击。如果由于测试导致服务器或应用程序对客户不可用，组织可能会面临收入损失、声誉损害甚至更严重的后果。\n\n以下步骤（见图 1-4）是执行组织安全审计的框架，并将有助于确保测试以组织、高效且符合道德的方式进行：\n\
  \n1. 与客户交流，讨论测试期间需要解决的需求。\n2. 与客户准备并签署 `NDA` 文档。\n3. 组织道德黑客团队，并制定测试计划。\n4. 执行测试。\n\
  5. 分析测试结果并准备报告。\n6. 向客户演示报告结果。\n\n图 1-4： 安全审计步骤\n\n![f0104.eps](img/f0104_fmt.gif)\n\
  ![note.eps](img/note_fmt.gif)\n\n深度渗透测试和安全审计信息在 EC-Council 的许可渗透测试（`LPT`）认证中进行了讨论。\n\
  \n## 执行渗透测试\n\n许多担任安全专业人员角色的道德黑客利用其技能来执行安全评估或渗透测试。这些测试和评估分为三个阶段，通常顺序如下：\n\n![g0101.eps](img/g0101_fmt.gif)\n\
  \n### 准备阶段涉及道德黑客与组织之间的正式协议。该协议应包括测试的完整范围、使用的攻击类型（内部或外部）以及测试类型：`白盒`、`黑盒`或`灰盒`。\n\n\
  ### 执行安全评估在此阶段，测试被执行，随后测试人员准备一份关于漏洞和其他发现的正式报告。\n\n### 结论在此阶段，向组织展示发现的结果，并提供任何改进安全的建议。\n\
  \n注意，道德黑客并不“修复”或修补他们在评估目标中发现的任何安全漏洞。这是执行安全审计或渗透测试时的常见误解。道德黑客通常不执行任何补丁修复或应对措施实施。最终目标或交付物实际上测试结果以及对相关风险的分析。测试是导致报告中发现的原因，并且必须良好记录。\n\
  \n\n\n\n\n与大众认知相反，执行渗透测试的伦理黑客必须非常有组织性且高效，他们必须通过截图、复制黑客工具输出或打印重要的日志文件来记录每项发现。伦理黑客必须非常专业，并提交一份详尽的报告，以便在他们的职业中获得尊重。关于执行渗透测试的更多信息，可以参阅第\
  \ 15 章“执行渗透测试”。\n\n## 定义黑客主义 (Hacktivism)\n\n黑客主义（Hacktivism）是指为了某种事业而进行的黑客。这些黑客通常具有社会或政治议程。他们的意图是通过黑客活动传递信息，同时为自己的事业和自己赢得知名度。\n\
  \n许多此类黑客参与诸如破坏网站首页、创建病毒以及实施 `DoS`或其他破坏性攻击等活动，以增加其事业的事声。黑客主义通常针对政府机构、政治团体以及任何被这些团体或个人认为“坏的”或“错误”的实体。\n\
  \n## 保持合法\n\n伦理黑客应该了解未经授权入侵系统的惩罚。在收到目标机构签署的法律文件、明确允许伦理黑客执行黑客活动之前，不应开始任何与网络渗透测试或安全审计相关的伦理黑客活动。伦理黑客需要谨慎使用他们的黑客技巧，并意识到误用这些技术的后果。\n\
  \n![realworld.eps](img/realworld_fmt.gif)\n\n## 黑客尝试的责任\n\n一家证券经纪公司运营的网站遭受了黑客攻击。由于攻击，该公司的客户在几小时内无法进行交易。攻击当天，股市波动，许多客户尝试买卖股票均无果。客户非常不悦，并指责公司未能防止、检测并从攻击中恢复。\n\
  \n在这种情况下，黑客是过错方。但经纪公司本身呢？客户依赖公司的网站进行交易。经纪公司及其网络提供商是否会面临因停机导致金钱损失的不满客户的诉讼？由于未能防止网站驱动的交易系统关闭，经纪公司是否应承担任何责任？本章讨论的某些法律将解决黑客攻击后的此类责任问题。\n\
  \n计算机犯罪可以大致分为两类：通过计算机便利的犯罪和以计算机为目标的犯罪。\n\n关于计算机犯罪的最重要的美国法律在以下章节中描述。尽管 `CEH` 考试具有国际范围，但请确保你熟悉这些美国法规以及黑客行为的处罚。记住，意图并不能让黑客凌于法律之上；即使是伦理黑客可能因违反这些法律而被起诉。\n\
  \n### 网络安全增强法案与 SPY 法案\n\n2002 年网络安全增强法案规定，对“鲁莽”危害他人生命的黑客实行终身监禁。通过攻击交通系统、电力公司或其他公共服务或公用设施的计算机网络造成生命威胁的恶意黑客可以根据该法被起诉。\n\
  \n2007 年《安全防止网络侵入法案》（`SPY ACT`）涉及计算机系统上间谍软件的使用，并在本质上禁止以下行为：\n\n*   在未获得授权的情况下获取计算机的远程控制\n\
  *   使用计算机向人们发送未经请求的信息（通常称为垃圾邮件）\n*   将网络浏览器重定向到未经用户授权的另一个网站\n*   显示导致用户必须关闭浏览器的广告（弹出窗口）\n\
  *   使用击键记录收集个人信息\n*   更改浏览器的默认主页\n*   误导用户点击网页链接，或复制类似的网页以误导用户\n\n`SPY ACT` 的重要性在于，它开始将烦人的弹出窗口和垃圾邮件视为不仅仅是骚扰，而是真实的黑客尝试。`SPY\
  \ ACT` 为起诉在邮件中使用垃圾邮件、弹出窗口和链接的黑客奠定了基础。\n\n### 18 USC §1029 和 1030\n\n美国法典按标题对美国法律进行分类和定义。第\
  \ 18 节详细说明了“犯罪与刑事程序”。第 `1029` 节“与接入设备相关的欺诈及活动”规定，如果你为了实施欺诈并获得价值超过 1000 美元的服务或产品而生产、销售或使用伪造接入设备或电信仪器，你就违反了法律。第\
  \ `1029` 节将滥用计算机密码和其他接入设备（如令牌卡）定罪。\n\n第 `1030` 节“与计算机相关的欺诈及活动”禁止未经许可访问受保护的计算机并造成损害。该法将未经授权人员传播病毒、蠕虫以及入侵计算机系统的行为定罪。\n\
  \n![note.eps](img/note_fmt.gif)\n\n第 `1029` 和 `1030` 节法律的全文作为附录包含在书中供你参考。\n\n###\
  \ 美国州法律\n\n除了联邦法律外，许多州都有自己的与黑客以及审计计算机网络和系统相关的法律。在执行渗透测试时，请审查相关的州法律，以确保你处于法律的正确一方。在许多情况下，签署的测试合同和\
  \ `NDA`（保密协议）足以说明测试的意图和性质。\n\n国家安全研究所拥有一个网站，其中列出了所有适用于计算机犯罪的州法律。URL 为：\n\n`http://nsi.org/Library/Compsec/computerlaw/statelaws.html`\n\
  \n### 联邦经理财务廉洁法案\n\n1982 年《联邦经理财务廉洁法案》（`FMFIA`）基本上是一项责任法，确保管理财务账户的人员以极其负责的方式操作，并确保资产得到保护。这一描述可以解释为涵盖保护资产免受黑客尝试的所有衡量措施。该法案本质上确保了\n\
  \n*   资金、财产和其他资产免受浪费、损失、未经授权的使用或挪用。\n*   成本符合法律。\n\n`FMFIA` 对伦理黑客非常重要，因为它将资金和其他资产的适当使用责任归于机构。因此，该法律要求管理层对组织的安全负责，并确保针对黑客攻击采取适当的防护措施。\n\
  \n### 信息自由法 (FOIA)\n\n《信息自由法》（`5 USC 552`）或 `FoIA` 使许多关于组织的信息和文件公开。大多数记录和政府文件可以通过\
  \ `FOIA` 获取。当你对潜在目标进行侦察和信息收集时，任何使用该法案获取的信息都是合法的。\n\n### 联邦信息安全管理法 (FISMA)\n\n《联邦信息安全管理法》（`FISMA`）基本上赋予了伦理黑客执行其测试类型的权力，并成为政府机构的强制性要求。\n\
  \n`FISMA` 要求每个联邦机构制定、记录并实施全面的信息安全计划，为支持该机构运营和资产的信息及信息系统提供安全，包括由其他机构、承包商或其他来源提供或管理的信息。信息安全计划必须包含以下内容：\n\
  \n\n\n\n\n### 安全需求与策略\n\n- 定期对由于未经授权的访问、使用、披露、中断、修改或破坏支持该机构运营和资产的信息及信息系统而可能造成的风险和损害程度进行评估。\n\
  - 制定基于风险评估的政策和程序，以成本效益的方式将信息安全风险降低至可接受水平，并确保信息安全在每个机构信息系统的整个生命周期内得到解决。\n- 根据实际情况制定子计划，为网络、设施、信息系统或信息系统组提供充分的信息安全。\n\
  - 进行安全意识培训，告知人员（包括承包商和其他支持该机构运营和资产的信息系统用户）与其活动相关的相关的信息安全风险，以及他们在遵守旨在降低这些风险的机构政策和程序方面的责任。\n\
  - 定期对信息安全政策、程序和实践的有效性进行测试和评估（包括清单中规定的每个机构信息系统的管理、运营和技术控制），频率取决于风险程度，但至少每年一次。\n-\
  \ 建立一个计划、实施、评估和记录补救措施的流程，以解决机构信息安全政策、程序和实践中的任何缺陷。\n- 检测、报告和响应安全事件的程序（包括在造成实质性损害之前减轻与此类事件相关的风险，并与联邦信息安全事件响应中心，以及在适当根据法律或根据总统指示与执法部门、相关监察长以及任何其他机构或办公室进行通知和协商）。\n\
  - 确保支持该机构运营和资产的信息系统连续性的计划和程序。\n\n本法案为伦理白帽黑客提供了职业保障，使其能够对政府机构和其他组织进行持续的安全审计。\n\n\
  ## 法律框架\n\n### 1974 年隐私法案\n《1974 年隐私法案》（`5 USC 552a`）确保个人信息不被泄露，并确保政府机构在没有获得相关信息人士事先书面同意的情况下披露信息。\n\
  \n### 美国爱国法案 (USA PATRIOT Act)\n该法案的正式名称为《2001 年通过提供所需的适当工具拦截和阻止恐怖主义来统一和加强美国爱国法案》（`USA\
  \ PATRIOT Act`），它授予政府在计算机黑客和其他类型的调查中拦截语音通信的权限。《爱国法案》的制定主要是为了应对恐怖活动，但也可以被解释为一种发现和防止黑客尝试的监听机制。\n\
  \n### 政府纸质消除法案 (GPEA)\n1998 年的《政府纸质消除法案》（`GPEA`）要求联邦机构在与政府机构互动时，允许人们选择使用电子通信的选项。`GPEA`还鼓励使用电子签名。当价值的政府信息以电子格式存储时，黑客的目标和风险也随之增加。\n\
  \n### 其他国家的网络法\n其他国家都有各自的关于信息保护和黑客攻击的适用法律。当你对国际组织进行渗透测试时，必须检查主权国家的法律，以确保测试在在该国是合法的。由于互联网和远程攻击的使用，地区和国际边界可以被迅速跨越。当你执行外部远程攻击时，数据可能存储在另一个国家的服务器上，该国的法律可能适用。未患于其胜于医，因此在对国际实体进行渗透测试之前应做好研究。在某些国家，法律可能比美国更宽松，这一事实在您进行信息收集时可能对你有利。\n\
  \n## 总结\n\n伦理黑客不仅仅是运行黑客工具并获取系统的未经授权访问以查看可以看到哪些内容。当由安全专业人员执行时，伦理黑客涵盖了侦察和信息收集的所有方面、结构化的方法以及攻击后分析。伦理黑客需要对系统和工具有深入知识，以及大量的耐心和克制，以确保不对目标系统造成任何损害。黑客攻击可以以伦理的方式进行，事实上，政府和私营部门也要求这样做以确保系统安全。\n\
  \n## 考试要点\n\n- 理解基本术语：`threat`（威胁）、`exploit`（利用）、`vulnerability`（漏洞）、`target`（目标）以及`attack`（攻击）。\n\
  - 区分伦理黑客与攻击：伦理黑客是安全专业人员，攻击是为了造成损害的。\n- 了解黑客分类：了解谁是好人，谁是坏人（在黑客世界中）。对于考试来说，了解不同黑客的分类至关重要：了解`black-hat`（黑帽）、`white-hat`（白帽）和`gray-hat`（灰帽）。\n\
  - 了解黑客阶段：`active reconnaissance`（主动侦察）、`scanning`（扫描）、`gaining access`（获取访问）、`maintaining\
  \ access`（维持访问）和`covering tracks`（掩盖踪）是黑客的五个阶段。\n- 了解攻击类型：了解主动和被动攻击的区别。攻击者的位置是主动和被动攻击的区别。\n\
  - 了解黑客攻击类型：黑客可以通过远程网络、远程拨号网络或本地网络，或通过社会工程、被盗设备或物理访问进行攻击。了解`黑盒`、`白盒`或`灰盒`测试技术。\n\
  - 了解伦理黑客报告的内容：伦理黑客报告包含已执行的攻击活动、发现的网络或系统漏洞以及应采取的应对措施。\n- 了解法律影响：`2002 年网络安全增强法`可用于起诉危及他人生命的伦理黑客。\n\
  - 了解适用于计算机入侵的法律：《美国法典》第 18 卷第 1029 和 1030 条对黑客有严格的惩罚。\n\n## 复习题\n\n1. 下列哪种陈述最好描述白帽黑客？\n\
