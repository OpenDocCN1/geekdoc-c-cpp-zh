- "# CEH 道德黑客认证学习指南 [附 CDROM]\n\n\n\n![](img/cover.jpg)\n\n![封面](img/cover.jpg)\n\n\
  \n# CEH: 认证伦理黑客学习指南\n![首页](img/title_page.gif)\n\n# 关于作者\n\nKimberly Graves 于 1995\
  \ 年毕业于美国大学，主主修政治学，辅修计算机信息技术。Kimberly 很快发现，她学位中的技术领域将是一条比局限于“华盛顿带区（政治圈）”内部的工作更有趣且更具挑战性的职业道路。\n\
  \n从担任弗吉尼亚亚州阿灵格顿的一家计算机培训公司的技术讲师开始，Kimberly 利用在该职位上获得的经验和资历，开始稳定地积累其他认证，她现在与客户和学生的日常互动中会使用这些认证。在获得第一份工作后的短短几个月内获得\
  \ Novell 认证工程师认证（`CNE`）后，Kimberly 在网络和安全方面的专业知识不断增长，已涵盖微软、英特尔、Aruba Networks、EC-Council、Cisco\
  \ Systems 和 CompTIA 的认证。\n\n在 IT 行业累计投入了超过 15 年后，Kimberly 积累了超过 25 个讲师级网络和安全认证。她曾担任华盛顿特区多个教育机构的兼职教授，同时担任多个安全认证计划的主题专家。最近，Kimberly\
  \ 利用她的 `Security+`、`认证无线网络关联师 (CWNA)`、`认证无线安全专业人员 (CWSP)`、`认证道德黑客 (CEH)` 和 `认证信息系统安全专业人员\
  \ (CISSP)` 证书为美国退军人事务部、美国空军和国家安全局（NSA）教学并开发课程材料。Kimberly 目前与全国领先的无线供应商合作，培训下一代无线安全专家。2007\
  \ 年，Kimberly 创立了 Techsource Network Solutions，以更好地服务客户需求并提供额外的网络和安全咨询服务。\n\n# 练习目录\n\
