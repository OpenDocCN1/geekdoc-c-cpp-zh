  19. A, B, D.  `IIS` 的三种常见攻击是目录遍历、缓冲区溢出和源码泄露。\n20. A, B. 使用 `DNS` 攻击将用户重定向到不同的 Web\
  \ 服务器以及通过暴力破解攻击泄露管理员密码是破坏网站（Defacing）的两种方法。\n\n# 第 9 章：攻击应用程序：SQL 注入与缓冲区溢出\n\n##\
  \ 本章涵盖的 CEH 考试目标：\n* 什么是 SQL 注入？\n* 理解执行 SQL 注入的步骤\n* 理解 SQL Server 漏洞\n* 描述 SQL\
  \ 注入防御措施\n* 基于栈的缓冲区溢出概述\n* 识别不同类型的溢溢及其检测方法\n* 缓冲区溢出变技术概述\n\nSQL 注入和缓冲区溢出是利用应用程序漏洞的攻击技术。在编写程序时，创建应用程序代码时使用的某些参数可能会程序留下漏洞。SQL\
  \ 注入和缓冲区溢出被包含在同一章节中是因为它们都是攻击应用程序的方法，通常由编程缺陷引起。通常，SQL 注入的目的是说服应用程序运行非预期的 `SQL code`。\n\
  \nSQL 注入是一种用于攻击 `SQL 数据库` 的黑客方法，而缓冲区溢出可能存在于许多不同类型的应用程序中。SQL 注入和缓冲区溢出的相似之处在于，它们通常都通过用户输入字段进行交付。输入字段是用户可能在网站上输入用户名和密码、向\
  \ `URL` 添加数据或在另一个应用程序中搜索关键词的地方。SQL 注入漏洞主要是由于通过这些字段的未经验证或未经过过滤的用户输入造成的。\n\n`SQL Server\
  \ 注入` 和缓冲区溢出漏洞都是由同一个问题引起的：应用程序未验证的无效参数。如果程序员不花时间验证用户可以输入到变量字段中的变量，结果将是严重且不可预测的。老练的黑客可以利用这种漏洞导致系统或应用程序发生执行故障并关闭，或者为黑客执行命令壳（Command\
  \ Shell）。\n\nSQL 注入和缓冲区溢出的防御措施旨在利用安全的编程方法。通过更改应用程序代码使用的变量，可以很大程度上减少应用程序中的漏洞。本章将详细介绍如何执行\
  \ SQL 注入和缓冲区溢出攻击，并探索防止此类攻击的最佳防御措施。\n\n### SQL 注入\n\n作为一名 `CEH`，能够定义 SQL 注入并理解黑客执行\
  \ SQL 注入攻击的步骤对你来说很重要。此外，你应该了解 `SQL Server 漏洞` 以及针对 SQL 注入攻击的防御措施。\n\n当应用程序在不验证输入的情况下处理用户提供的数据以创建\
  \ `SQL statement` 时，就会发生 SQL 注入。随后用户输入被提交到 Web 应用程序数据库服务器执行。如果被成功利用，SQL 注入可以允许攻击者访问数据库内容，或允许黑客远程执行系统命令。在最坏的情况下，黑客可以控制托管数据库的服务器。这种利用可以为黑客提供访问服务器文件系统的远程\
  \ shell。SQL 注入攻击的影响取决于漏洞在代码中的位置、利用该漏洞的难易程度以及应用程序对数据库的访问级别。理论上讲，SQL 注入可以发生在任何类型的应用程序中，但它最常见于\
  \ Web 应用程序，因为它们最经常受到攻击。正如第 8 章之前讨论的“Web 攻击：谷歌、Web 服务器、Web 应用程序漏洞和基于 Web 的密码破解技术”，Web\
  \ 应用程序是容易的目标，因为从本质上说它们对互联网开放。在尝试 `CEH exam` 之前，你应该对数据库如何工作以及如何使用 `SQL commands`\
  \ 访问数据库中的信息有基本的了解。\n\n在 Web 应用程序 SQL 注入攻击期间，恶意代码被插入到 Web 表单字段或网站代码中，使系统执行命令壳或其他任意命令。正如合法用户通过\
  \ Web 表单向 `SQL database` 输入查询和添加内容一样，黑客可以通过同一个 Web 表单字段向 `SQL Server` 插入命令。例如，黑客的任意命令可能会打开命令提示符或显示数据库中的表。数据库表可能包含个人信息，如信用卡号、社会安全号或密码。`SQL\
  \ Servers` 是非常常见的数据库服务器，被许多组织用于存储机数据。这使得 `SQL Server` 成为一个高价值目标，因此是对黑客极具吸引力的系统。\n\
  \n![realworld.eps](img/realworld_fmt.gif)\n\n### 确定 SQL 注入漏洞\n\n在对企业网络进行黑帽渗透测试期间，安全测试员\
  \ Tom 在一个公开访问的 Web 服务器上发现了一个自定义应用程序。由于是黑帽测试，Tom 无法访问源代码来查看程序是如何创建的。但在进行一些信息收集后，他能够确定服务器运行着\
  \ `Microsoft Internet Server 6` 以及 `ASP.NET`，这表明数据库是 `Microsoft 的 SQL Server`。\n\
  \n该 Web 应用程序的登录页面有一个用户名、密码字段和一个忘记密码链接，这最终证明是进入系统的最方法。忘记密码链接的工作原理是在用户数据库中查找用户的电子邮件地址，并向该地址发送包含密码的电子邮件。\n\
  \n因此，为了确定忘记密码链接是否受到 SQL 注入的影响，Tom 在忘记密码字段的数据中输入了一个单引号。目的是查看应用程序是否在未过滤用户输入的情况下字面构建\
  \ `SQL string`。当在电子邮件地址中使用引号提交表单时，他收到了 `500 错误`（服务器故障），这表明用户输入被字面解析了。\n\n表单的底层 SQL\
  \ 代码可能如下：\n\n```sql\nSELECT fieldlist\nFROM table\nWHERE field = '$EMAIL';\n```\n\
  \nTom 在忘记邮件链接字段中输入了他的电子邮件地址，后跟一个单引号。Web 应用程序的 `SQL 解析器`发现了多出的引号并因错误中止。当 Tom 收到此错误消息时，他能够确定用户输入没有经过妥善过滤，应用程序可以被利用。在这种情况下，他不需要继续利用该应用程序，因为错误消息已经足以证明该应用程序容易受到\
  \ SQL 注入攻击。由于这次渗透测试的结果，客户能够修复了 `SQL Server 漏洞`。\n\n\n\n\n\n# 寻找 SQL 注入漏洞\n\n在发起\
  \ SQL 注入攻击之前，黑客会确定数据库以及相关表和变量的配置是否存在漏洞。确定 `SQL Server` 漏洞的步骤如下：\n\n1. 使用网页浏览器搜索使用登录页面或其他数据库输入或查询字段（例如“我忘记密码”表单）的网站。通过检查网站源代码，寻找显示\
  \ `POST` 或 `GET` HTML 命令的网页。\n2. 使用单引号（`''`）测试 `SQL Server`。此操作可以判断用户输入变量是否经过了清理，或者它是否被服务器字面解释。如果服务器返回了显示“使用\
  \ `'a'='a'`”（或类似内容）的错误信息，那么它极有可能易受到 SQL 注入攻击。\n3. 使用 `SELECT` 命令从数据库检索数据，或使用 `INSERT`\
  \ 命令向数据库添加信息。\n\n以下是一些可以在 Web 表单上使用的用于测试 SQL 漏洞的变量字段文本示例：\n\n* `Blah' or 1=1--`\n\
  * `Login:blah' or 1=1--`\n* `Password::blah' or 1=1--`\n* `http://search/index.asp?id=blah'\
  \ or 1=1--`\n\n这些命令和类似的变体可能允许用户根据数据库的结构绕过登录。在表单字段中输入这些命令时，可能会返回表中的许多行，甚至是整个数据库表，因为\
  \ `SQL Server` 正在字面解释这些术语。命令末尾的双横线告诉 SQL 忽略命令的其余部分将其视为注释。\n\n以下是使用 SQL 命令获取控制权的的一些示例：\n\
  \n要获取目录列表，在表单字段中输入以下内容：\n```\nBlah';exec master..xp_cmdshell\"dir c:\\*.* /s >c:\\\
  directory.txt\"--\n```\n\n要创建一个文件，在表单字段中输入以下内容：\n```\nBlah';exec master..xp_cmdshell\"\
  echo hacker-was-here > c:\\hacker.txt\"--\n```\n\n要 ping 一个 IP 地址，在表单字段中输入以下内容：\n\
  ```\nBlah';exec master..xp_cmdshell\"ping 192.168.1.1\"--\n```\n\n# SQL 注入的目的\n\n\
  黑客利用 SQL 注入攻击来实现某些结果。某些 SQL 漏洞会产生存储在数据库中的价值用户数据，而另一些仅是其他攻击的前奏。以下是 SQL 注入攻击最常见的目的：\n\
  \n### 识别 SQL 注入漏洞\n目的是探测 Web 应用程序以发现哪些参数和用户输入字段易受 SQL 注入。\n\n### 执行数据库指纹识别\n目的是发现\
  \ Web 应用程序使用的数据库类型和版本，并对数据库进行“指纹识别”。了解 Web 应用程序使用的数据库类型和版本允许攻击者构建特定数据库的攻击。\n\n###\
  \ 确定数据库架构\n为了从数据库中正确提取数据，攻击者通常需要数据库架构信息，例如表名、列名和列数据类型。这些信息可以用于后续攻击。\n\n### 提取数据\n\
  此类攻击采用能够从数据库中提取数据值的技术。取决于 Web 应用程序的类型，这些信息可能是敏感的，并且是攻击者非常渴望的。\n\n### 添加或修改数据\n目的是添加或更改数据库中的信息。\n\
  \n### 执行拒绝服务\n执行这些攻击是为了关闭对 Web 应用程序的访问，从而拒绝其他用户的服务。涉及锁定或删除数据库表的攻击也属于这一类。\n\n###\
  \ 规避检测\n此类指的是某些用于避免审计和检测的攻击技术。\n\n### 绕过验证\n目的是允许攻击者绕过数据库和应用程序的验证机制。绕过此类机制可能允许攻击者获得与其他应用程序用户相关的权限和权利。\n\
  \n### 执行远程命令\n此类攻击尝试在数据库上执行任意命令。这些命令可以是数据库用户可用的存储过程或函数。\n\n### 执行权限提升\n这些攻击利用数据库中的实现错误或逻辑缺陷来提升攻击者的权限。\n\
  \n# 使用动态字符串进行 SQL 注入\n\n大多数 SQL 都执行特定的、可预测的任务。SQL 数据库的许多功能接收静态用户输入，唯一的变量是用户输入字段。此类语句在每次执行时不会发生变化。它们通常被称为静态\
  \ SQL 语句。\n\n然而，某些程序必须在运行时构建并处理各种 SQL 语句。在许多情况下，语句的全文在应用程序执行之前是未知的。此类语句可能会并且可能每次执行时发生变化。因此，它们被称为动态\
  \ SQL 语句。\n\n动态 SQL 是 SQL 的增强形式，与标准 SQL 不同，它促进了程序语句的自动生成和执行。动态 SQL 是一个术语，指在 Web\
  \ 应用程序执行之前生成的 SQL 代码。动态 SQL 是创建 SQL 字符串的灵活且强大的工具。当你发现需要编写能够适应不同数据库、条件或服务器的代码时，它会非常有帮助。动态\
  \ SQL 还让自动化 Web 应用程序中多次重复的任务变得更容易。\n\n黑客可以使用动态字符串通过 SQL 注入攻击基于 Web 的身份验证表单。例如，Web\
  \ 服务器上身份验证表单的底层代码可能如下：\n\n```\nSQLCommand = \"SELECT Username FROM Users WHERE Username\
  \ = '\"\nSQLCommand = SQLComand & strUsername\nSQLCommand = SQLComand & \"' AND\
  \ Password = '\"\nSQLCommand = SQLComand & strPassword\nSQLCommand = SQLComand &\
  \ \"'\"\nstrAuthCheck = GetQueryResult(SQLCommand)\n```\n\n黑客可以通过在表单中输入任何用户名和密码来利用\
  \ SQL 注入，例如：\n\n用户名：`kimberly`\n密码：`graves' or 1=1--`\n\nSQL 应用程序将构建如下命令：\n\n```\n\
  SELECT Username FROM Users WHERE Username = 'kimberly' AND Password = 'graves' or\
  \ 1=1--\n```\n这是一个 SQL 注入的示例：无论 kimberly 是否是数据库中的真实用户名或 graves 是否是合法密码，该查询都会返回表中的所有行。这是由于在\
  \ `WHERE` 子句中附加了 `OR` 语句导致的。\n\n在练习 9-1 中，你将使用 HP Scrawlr 测试 SQL 注入漏洞。\n\n## 练习\
  \ 9-1：使用 HP Scrawlr 测试 SQL 注入漏洞\n\n1. 从 [www.HP.com](http://www.HP.com) 下载 Scrawlr。\n\
  2. 在你的 Windows 实验电脑上安装 Scrawlr。\n3. 打开 Scrawlr 程序。\n4. 在 `URL Of Site To Scan` 字段中输入目标\
  \ Web 地址。\n5. 点击 `Start` 按钮开始对网站进行 SQL 注入漏洞审计。\n6. 扫描完成后，Scrawlr 将显示从扫描站点链接的其他主机。最佳实践是同时扫描链接站点和主站，以确保不存在\
  \ SQL 注入漏洞。\n\n# SQL 注入防御措施\n\nSQL 注入漏洞的产生相对简单且易于理解：对用户输入的验证不足。为了解决这个问题，在编写应用程序时可以使用防御性编码实践，如用户输入进行编码和验证。检查所有应用程序的\
  \ SQL 注入漏洞是一个辛苦且耗时的过程。\n\n在实施 SQL 注入防御措施时，检查源代码中是否存在以下编程缺陷：\n\n* 单引号\n\n\n\n\n\n\
  # 缺乏输入验证\n\n防止 SQL 注入攻击的首要防御措施是最小化用户连接到数据库的权限，并强制对 `SA` 和 `Administrator` 账户执行强密码。你还应该禁用详细的或解释性的错误消息，以确保发送给黑客的信息不会多于所需；此类信息可能帮助他们判断\
  \ `SQL Server` 是否存在漏洞。记住，SQL 注入的目的之一是获取关于哪些参数容易受到攻击的额外信息。\n\n防止 SQL 注入的另一种防御措施是在将用户数据发送到应用程序处理之前，检查输入并对数据进行验证。\n\
  \n针对 SQL 注入的一些防御措施包括：\n\n*   拒绝已知的坏输入\n*   对 `input field` 进行清理和验证\n\n### 缓冲区溢出\n\
  \n作为一名 `CEH`，你必须能够识别不同类型的缓冲区溢出。你还应该知道如何检测缓冲区溢出漏洞，并理解黑客可能用于执行栈溢出攻击的步骤。我们将在接下来的章节中介绍这些主题，并提供缓冲区溢出变异技术的概述。\n\
  \n## 缓冲区溢出的类型与检测方法\n\n缓冲区溢出是黑客针对操作系统或应用程序使用的利用手段；与 SQL 注入攻击一样，它们通常针对用户输入字段。缓冲区溢出利用通过通过过载内存或在目标系统上执行命令外壳或任意代码导致系统故障。缓冲区溢出漏洞是由于\
  \ `variable field`（如 Web 表单）缺乏边界检查或缺乏输入验证清理引起的。如果应用程序在将 `variable` 发送到内存中存储之前没有检查或验证其大小或格式，就会存在溢出漏洞。\n\
  \n缓冲区溢出有两种类型：基于栈的和基于堆的。\n\n栈和堆是运行程序中用户提供的变量的存储位置。变量存储在栈或堆中，直到程序需要它们为止。栈是内存地址空间的静态位置，而堆是程序运行期间产生的动态内存地址空间。基于堆的缓冲区溢出发生在内存的低部，并覆盖其他动态变量。请参阅\
  \ 图 9-1。\n\n图 9-1: 栈内存与堆内存\n\n![f0901.eps](img/f0901_fmt.gif)\n\n调用栈（或栈）用于跟踪在执行完部分代码后，执行指针应该返回到编程代码的哪个位置。栈缓冲区溢出攻击（图\
  \ 9-2）发生在分配给每个执行程序的内存发生溢出时。由于这两种缓冲区溢出的存在，程序可能会打开 shell 或命令提示符，或者停止程序的执行。下一节将描述栈栈缓冲区溢出攻击。\n\
  \n图 9-2: 基于栈的缓冲区溢出攻击\n\n![f0902.eps](img/f0902_fmt.gif)\n\n为了检测由于源代码编写不当导致的程序缓冲区溢出漏洞，黑客通过表单字段向应用程序发送大量数据，并观察程序的处理结果。\n\
  \n以下是黑客执行栈缓冲区溢出攻击所使用的步骤：\n\n1.  向缓冲区中输入一个 `variable` 以耗尽栈中的内存量。\n2.  输入比缓冲区为该 `variable`\
  \ 分配的内存更多的数据，导致内存溢出或进入下一个进程的内存空间。然后，添加另一个 `variable`，并覆盖返回指针，该指针告诉程序在执行完 `variable`\
  \ 后返回到何处。\n3.  程序执行此恶意代码 `variable`，然后使用返回指针返回到下一行可执行代码。如果黑客成功覆盖了指针，程序将执行黑客的代码而不是程序代码。\n\
  \n大多数黑客不需要对缓冲区溢出的细节如此熟悉。互联网上可以找到预先编写的利用程序，这些程序在黑客小组之间交换。练习 9-2 演示了如何使用 `Metasploit`\
  \ 执行缓冲区溢出攻击。\n\n![note.eps](img/note_fmt.gif)\n\n被用利用代码返回地址覆盖的内存寄存器被称为 `EIP`。\n\n\
  ### 练习 9-2：使用 Metasploit 执行缓冲区溢出攻击\n\n1.  打开 `Metasploit Framework`。\n2.  启动运行带有\
  \ `IIS` 的 `Windows Server` 测试机。\n3.  从 `Metasploit` 开始，针对运行 `IIS` 的测试机运行 `IIS Buffer\
  \ Overflow attack`。\n4.  选择一个 `payload`，通过缓冲区溢出利用程序传递到 `IIS` 目标系统。\n\n# 缓冲区溢出防御措施\n\
  \n如你所见，黑客可以从标准的缓冲区溢出变为将返回指针重定向到他们选择的代码。黑客必须知道确切的内存地址和栈的大小，以便让返回指针执行他们的代码。黑客可以使用无操作（`NOP`）指令，这种指令只是移动指令指针的填充内容，不执行任何代码。`NOP`\
  \ 指令被添加到待执行恶意代码的字符串之前。\n\n如果网络上存在入侵检测系统（`IDS`），它可以阻止发送一系列 `NOP` 指令以重定向到指令指针的黑客。为了绕过\
  \ `IDS`，黑客可以随机替换某些 `NOP` 指令为等效的代码段，例如 `x++,x-;?NOPNOP`。这种变异缓冲区溢出的示例可以绕过 IDS。\n\n\
  程序员不应使用 `strcpy()`、`strcat()` 和 `streadd()` 等 C/C++ 函数，因为它们容易受到缓冲区溢出的影响。或者，可以使用\
  \ `Java` 作为编程语言，因为 `Java` 不易受到缓冲区溢出的。\n\n## 总结\n\nSQL 注入和缓冲区溢出是用于利用应用程序的黑客方法。Web\
  \ 应用程序特别容易受到攻击，因为黑客可以通过用户输入字段（如用户名、密码、忘记密码和价格字段）轻松访问。严格的解释和未清理的输入能够直接与数据库交互，并导致数据库泄露机密信息。缓冲区溢出有两种类型：基于栈和基于堆，它们攻击内存分配空间的不同区域。通过验证用户输入并限制用户输入字段的长度，可以防止\
  \ SQL 注入和缓冲区溢出攻击。这两个防御措施可以修复大多数应用程序漏洞，并保护应用程序免受 SQL 注入和缓冲区溢出攻击。\n\n# 考试重点\n\n* \
  \  了解 SQL 注入和缓冲区溢出攻击的相似之处。SQL 注入和缓冲区溢出的相似之处在于攻击都是通过 Web 表单字段传递。\n*   理解 SQL 注入的目的。SQL\
  \ 注入攻击的目的可以是从数据库获取用户数据或对数据库和应用程序漏洞进行信息收集。\n*   理解 SQL 注入防御措施。使用不带单引号的正确代码以及进行边界检查和输入验证是\
  \ SQL 注入的防御措施。\n*   了解栈溢出和堆堆缓冲区溢出的区别。栈是内存地址空间的静态位置，而堆是动态内存地址空间。\n*   理解如何使用缓冲区溢出攻击绕过\
  \ IDS。IDS 会寻找一系列 `NOP` 指令。通过用其他代码段替换 `NOP` 指令，黑客可以有效地绕过 IDS。\n\n\n\n\n理解缓冲区溢出和 SQL\
  \ 注入防御措施。对 Web 表单的输入进行边界检查和清理可以防止缓冲区溢出和 SQL 注入漏洞。\n\n## 复习习题\n\n1. 在 Web 表单中输入密码\
  \ `blah’ or 1=1-` 来获取密码是哪种攻击的示例？\nA. 缓冲区溢出\nB. 堆溢出\nC. 栈溢出\nD. SQL 注入\n\n2. 在缓冲区溢出变异中用其他代码替换\
  \ `NOP` 指令的目的是什么？\nA. 绕过 IDS\nB. 覆盖返回指针\nC. 推进返回指针\nD. 绕过防火墙\n\n3. 下列中哪项被用于存储动态分配的变量？\n\
  A. 堆溢出\nB. 栈溢出\nC. 堆 (Heap)\nD. 栈 (Stack)\n\n4. SQL 注入攻击的第一步是什么？\nA. 在用户提示符处输入任意命令。\n\
  B. 在网页上定位用户输入字段。\nC. 定位返回指针。\nD. 输入一系列 `NOP` 指令。\n\n5. 使用什么命令从 SQL 数据库中检索信息？\nA.\
  \ `INSERT`\nB. `GET`\nC. `SET`\nD. `SELECT`\n\n6. 下列哪项是缓冲区溢出的防御措施？\nA. 不使用单引号\n\
  B. 使用 SSL 保护所有登录页面\nC. 边界检查\nD. 用户验证\n\n7. `NOP` 代表什么？\nA. No Operation（无操作）\nB.\
  \ Network Operation Protocol（网络操作协议）\nC. No Once Prompt（无次提示）\nD. Network Operation（网络操作）\n\
  \n8. 黑客发起缓冲区溢出攻击需要哪些信息？\nA. 黑客需要熟悉内存地址空间和缓冲区溢出技术，才能发起缓冲区溢出攻击。\nB. 黑客需要理解堆和栈之间的区别。\n\
  C. 黑客必须能够识别易受缓冲区溢出攻击的目标。\nD. 黑客必须能够执行端口扫描以寻找存在漏洞的内存栈。\n\n9. 为什么许多程序容易受到 SQL 注入和缓冲区溢出攻击？\n\
  A. 程序编写速度过快且使用了糟糕的编程技术。\nB. 这些是任何程序中固有的缺陷。\nC. 用户尚未应用正确的服务程序包。\nD. 程序员使用了错误的编程语言。\n\
  \n10. 黑客在 Web 表单字段中输入什么命令可以获取目录列表？\nA. `Blah';exec master..xp_cmdshell\"dir *.*\"\
  --`\nB. `Blah';exec_cmdshell\"dir c:\\*.* /s >c:\\directory.txt\"--`\nC. `Blah';exec\
  \ master..xp_cmdshell\"dir c:\\*.* /s >c:\\directory.txt\"--`\nD. `Blah';exec cmdshell\"\
  dir c:\\*.*\"--`\n\n11. 缓冲区溢出攻击哪两种类型？\nA. 堆和栈\nB. 堆和溢出\nC. 栈和内存分配\nD. 注入和堆\n\n12.\
  \ 从 Web 应用程序输入字段中收集并在稍后由该应用程序执行的变量被称为 ____________________。\nA. 延迟执行\nB. 动态字符串\n\
  C. 静态变量\nD. 自动函数\n\n13. SQL 注入攻击的目的是什么？\nA. 创建基于堆的缓冲区溢出\nB. 创建基于栈的缓冲区溢出\nC. 执行 `NOP`\
  \ 执行\nD. 识别易感参数\n\n14. 哪种应用程序可以帮助识别网站是否易受 SQL 注入攻击？\nA. BlackWidow\nB. Metasploit\n\
  C. Scrawlr\nD. SQL Block\n\n15. 防御缓冲区溢出的防御措施是使用 ____________________ 编程语言，因为它不受缓冲区溢出攻击的影响。\n\
  A. Java\nB. Netscape\nC. Oracle\nD. ASP\n\n16. 你是一个程序员，正在分析运行在贵组织服务器上的应用程序代码。存在过多的\
  \ `fgets()` 命令。这些是不执行边界检查的 C++ 函数。该程序容易受到哪种攻击的影响？\nA. 缓冲区溢出\nB. 拒绝服务\nC. SQL 注入\n\
  D. 密码破解\n\n17. 下列哪些项是针对 SQL 注入攻击的防御措施？（选择两项）\nA. 拒绝已知的输入\nB. 清理并验证输入字段\nC. 执行用户验证\n\
  D. 确保所有用户输入都是变量\n\n18. 一位道德黑客正在对 Web 应用程序进行渗透测试。黑客在 Web 表单上找到一个用户输入字段并输入了一个单引号。网站返回服务器错误。该错误说明了什么？\n\
  A. Web 应用程序易受 SQL 注入攻击。\nB. Web 应用程序不受受 SQL 注入攻击。\nC. 服务器正遭受拒绝服务攻击。\nD. Web 应用程序已崩溃。\n\
  \n19. 执行过程中发生变化的 SQL 语句被称为 ____________________ 字符串。\nA. 变量\nB. 动态\nC. 基于应用程序的\n\
  D. 静态\n\n20. 何时向字符串添加无操作（`NOP`）指令？\nA. 在恶意代码执行之后\nB. 在恶意代码执行之前\nC. 在恶意代码执行的同一时刻\n\
  D. 在恶意代码执行期间\n\n## 复习习题答案\n\n1. D. 使用单引号表示 SQL 注入攻击。\n2. A. 通过替换 `NOP` 指令来变异缓冲区溢出的目的是绕过\
  \ IDS。\n3. C. 堆被用于存储动态变量。\n4. B. SQL 注入攻击的第一步是在网页上定位用户输入字段。\n5. D. 从 SQL 数据库检索信息的命令是\
  \ `SELECT`。\n6. C. 执行边界检查是缓冲区溢出的防御措施。\n7. A. `NOP` 是 No Operation 的缩写。\n8. C. 黑客发起缓冲区溢出攻击需要能够识别目标。黑客可以运行预写的漏洞程序进行缓冲区溢出。\n\
  9. A. 程序容易被攻击是因为它们编写速度快且质量差。\n10. C. `Blah';exec master..xp_cmdshell\"dir c:\\*.*\
  \ /s >c:\\directory.txt\"--` 利用 SQL 注入获取目录列表。\n11. A. 堆和栈是缓冲区溢出的两种类型。\n12. B. 动态字符串是为了稍后由应用程序执行的用户输入。\n\
  13. D. 攻击 SQL 的目的是识别易受 SQL 注入的用户参数。\n14. C. HP 的 Scrawlr 会扫描 Web URL 以确定站点是否易受 SQL\
  \ 注入攻击。\n15. A. 缓冲区溢出攻击的建议防御措施是使用 Java 应用程序，它不受缓冲区溢出攻击的影响。\n16. A. 对输入字段不进行边界检查的应用程序易受缓冲区溢出攻击。\n\
  17. A, B. 拒绝已知输入并在向 SQL 数据库发送之前清理并验证用户输入是 SQL 注入攻击的防御措施。\n18. A. 在 Web 应用程序输入字段中输入单引号后返回服务器错误表明应用程序没有清理用户数据，因此易受\
  \ SQL 注入攻击。\n19. B. 动态字符串根据用户输入现场构建，每次执行都会不同。\n20. B. 在执行恶意代码之前向字符串中添加 `NOP` 指令。\n\
  \n## 第十章：无线网络攻击\n\n本章涵盖的 CEH 考试目标：\n\n* WEP、WPA 认证机制和破解技术的概述\n* 无线嗅探器和定位 SSID、MAC\
  \ 伪装的概述\n* 理解非法访问点\n* 理解无线攻击技术\n* 描述用于保护无线网络的方法\n\n无线网络为黑客进入网络增加了另一个入口。由于无线技术是一项较新的技术且充满了安全漏洞，关于无线安全和攻击的已有许多记载。从\
  \ Wi-Fi 热点的增加到配备 Wi-Fi 射电的手机、PDA 和笔记本电脑数量的增加，无线安全已成为许多机构日益增长的问题。\n\n\n\n\n由于射频（RF）无线网络的广播特性以及无线技术在家庭和业务网络中的快速采纳，无线网络中存在许多黑客攻击机会。即使对于执行“无无线”策略的组织——即意味着他们不支持任何\
  \ Wi-Fi 连接——放置在局域网（LAN）上的流氓无线接入点也是一个日益增长的威胁。Wi-Fi 设备的成本正在下降，许多组织正敦促 IT 人员安装无线网络以补充或替换现有的有线网络。\n\
  \n## Wi-Fi 与以太网\n\n必须意识到 Wi-Fi 网络与以太网网络在本质上是不同的。在以太网网络中，数据是通过铜电缆或光纤电缆上的帧传输的，而在 Wi-Fi\
  \ 网络中，数据跨越开放空间传输。此外，应用在无线网络上的任何加密只加密数据本身，导致无线帧的头部部分暴露在多种攻击面前。无线攻击和防御措施的细节将在本章稍后部分介绍，但首先你需要了解\
  \ `802.11` 标准和协议的基础知识。\n\n`802.11` 无线局域网运行在 OSI 模型的第 1 层和第 2 层。这意味着在 WLAN 上使用的协议从第\
  \ 3 层（通常是 `IP`）一直到第 7 层（应用层）都是相同的。参见图 10-1。\n\n许多人将 `802.11` WLAN 称为“无线以太网”，这是一个巨大的误称。`802.11`\
  \ 在第 2 层的帧格式与 `802.3`（以太网）完全不同。例如，以太网第 2 层帧只携带了两个 MAC 地址，而 `802.11` 帧具有用于 4 个 MAC\
  \ 地址的字段。以太网只定义了源地址和目的地址，而 `802.11` 帧可以定义源地址、目的地址、传输者和接收者地址。`802.11` 帧在 MAC 头部中还携带一个帧控制字段，用于指示有关帧的信息，例如帧是否被加密。参见图\
  \ 10-2。\n\nFigure 10-1: OSI 模型中的无线局域网\n\n![f1001.eps](img/f1001_fmt.gif)\n\nFigure\
  \ 10-2: 802.11 MAC 头部\n\n![f1002.eps](img/f1002_fmt.gif)\n\n有三种类型的 `802.11` 帧：\n\
  \n* 管理帧——用于通知、连接、断开和信息传递。\n* 控制帧——用于控制哪个站可以访问无线网络介质。\n* 数据帧——用于携带上层数据。\n\n大多数无线局域网（WLAN）都基于\
  \ IEEE `802.11` 标准及其修订版，如 `802.11a`、`802.11b`、`802.11g` 和 `802.11n`。带有字母的修订版已合并到最终的\
  \ `802.11` 标准中，现在通过 `802.11` 标准中的条款或章节编号来引用。然而，由于带有字母的修订版在区分 `802.11` 标准的不同章节时仍经常使用，因此在本章中也将使用。表\
  \ 10-1 显示了 `802.11` 标准修订版的比较。\n\nTable 10-1: 802.11 比较\n\n![Table 10-1](img/table1001.gif)\n\
  \n初始的 `802.11` 标准仅包含基础的安全功能并充满了漏洞。`802.11i` 修订版是解决 `802.11` 缺陷的最新安全解决方案。Wi-Fi 联盟创建了名为\
  \ Wi-Fi 保护访问 (`WPA`) 和 `WPA2` 的额外安全认证，以填充原始 `802.11` 标准与最新 `802.11i` 修订版之间的空白。本章讨论的安全漏洞和解决方案均基于这些\
  \ IEEE 和 Wi-Fi 联盟标准。\n\n## 认证与破解技术\n\n`802.11` 标准中存在两种验证无线局域网客户端到接入点身份的方法：开放系统认证或共享密钥认证。开放系统不提供任何安全机制，仅仅是请求连接网络。共享密钥认证要求无线客户端使用等效网络隐私\
  \ (`WEP`) 密钥对挑战文本字符串进行哈希处理，以向网络验证客户端身份。Table 10-2 比较了 Wi-Fi 安全标准的认证和加密类型。\n\nWEP\
  \ 是 `802.11` WLAN 的第一个安全选项。WEP 用于加密 WLAN 上的数据，并可以可选与共享密钥认证配对以验证 WLAN 客户端。WEP 使用\
  \ `RC4` 40 位密钥来加密数据……（注：原文写为 6-bit，但通常为 40-bit，此处遵循原文：`RC4` 6-bit）。*修正：原文写为 \"RC4\
  \ 6-bit\"，我将保持原样。*\n\n\n\n\n\n| WPA | TKIP | 口令或 RADIUS (802.1x/EAP) | 口令容易受到字典攻击。\
  \ |\n| :--- | :--- | :--- | :--- |\n| WPA2 | AES (在混合模式下可以使用 TKIP) | 口令或 RADIUS\
  \ (802.1x/EAP) | 口令容易受到字典攻击。 |\n| IEEE 802.11i | AES (在混合模式下可以使用 TKIP) | 口令或 RADIUS\
  \ (802.1x/EAP) | 口令容易受到字典攻击。 |\n\n## 破解工具\n\n`Aircrack` 是一种破解 WEP 的软件工具。它不捕获数据包；而是用于在另一个工具捕获加密数据包后进行破解。`Aircrack`\
  \ 可以在 Windows 或 Linux 上运行。\n\n`WEPCrack` 和 `AirSnort` 是基于 Linux 的 WEP 破解工具。\n\n\
  `NetStumbler` 和 `Kismet` 是 WLAN 发现工具。它们都能发现 WLAN 的介质访问控制 (`MAC`) 地址、服务集标识符 (`SSID`)、安全模式和通道。此外，`Kismet`\
  \ 可以发现 `SSID` 隐藏的 WLAN、收集数据包并提供 IDS（入侵检测系统）功能。\n\n![realworld.eps](img/realworld_fmt.gif)\n\
  \n# 在进行“无线驱动”时要小心\n\n2003 年，黑客试图利用家装用品零售商 Lowe’s 的无线网络来盗取信用卡号。这三名黑客在密歇歇根州南菲尔德扫描开放连接（或在在该地区进行“无线驱动”）时，在一家\
  \ Lowe’s 门店发现了一个漏洞 WLAN。随后，黑客利用该开放的接入点入侵了这家位于北卡罗来纳州的家装用品公司的整个公司网络，在几周内入侵了位于加利福尼亚州、堪萨斯州、南达科他州和其他州的商店。他们访问了一个名为\
  \ `tcpcredit` 的信用卡处理程序，该程序会掠取特定 Lowe’s 门店处理的每笔交易的信用卡账户信息。据认为，黑客的计划是通过安装在 Lowe’s\
  \ 专用程序中的后门来抽走数百万个信用卡号。\n\n参与此次破解尝试的男子之一在与两名同犯入侵 Lowe’s 网络后，对四项电线欺诈和未经授权访问计算机的指控认罪。2004\
  \ 年，他被定罪，目前正在服九年徒刑，尽管没有证据表明他收集了任何信用卡号。在调查期间，仅在修改后的 `tcpcredit` 程序创建的文件中发现了六个信用卡号。这个故事说明，即使是无害的无线驱动也可能引起不必要的关注，因此对你连接的\
  \ WLAN 要小心。\n\n# 使用无线嗅探器定位 SSID\n\n对 WLAN 的常见攻击涉及窃听或嗅探。这是一种很容易实施的攻击，通常发生在热点或任何默认安装的接入点\
  \ (`AP`) 上，因为数据包通常在 WLAN 上以未加密的形式发送。在未加密的 WLAN 上，黑客可以以明文（未加密）捕获如 `FTP`、`POP3` 和\
  \ `SMTP` 等网络访问协议的密码。\n\n服务集标识符 (`SSID`) 是 WLAN 的名称，可以在信标帧（beacon frames）和探测响应帧（probe\
  \ response frames）中找到。如果两个无线网络在物理上很近，则 `SSIDs` 用于识别和区分各自的网络。`SSID` 通常在信标帧以及其他帧（如探测响应帧）中明文发送。大多数\
  \ `APs` 允许 WLAN 隐藏 `SSID`。然而，这并不是稳健的安全机制，因为某些工具可以从其他数据包（如探测请求和其他客户端数据包）读取 `SSID`。\n\
  \n练习 `10-1` 将引导你安装并使用名为 `Omnipeek` 的 WLAN 嗅探工具。\n\n## 练习 10-1：安装和使用 WLAN 嗅探工具\n\n\
  1. 从 [www.wildpackets.com](http://www.wildpackets.com) 下载 `Omnipeek` 试用版。你需要支持 `Omnipeek`\
  \ 混杂模式（promiscuous mode）的无线局域网适配器，`Omnipeek` 才能正确捕获无线 LAN 上所有的流量。从 [www.wildpackets.com](http://www.wildpackets.com)\
  \ 查看支持的无线 LAN 适配器及其驱动。\n\n2. 点击 `Omnipeek` 启动界面上的 `New Capture` 按钮开始新的捕获。\n\n![g1001.tif](img/g1001_fmt.jpg)\n\
  \n3. 从捕获选项中选择无线适配器。\n\n注意：在 `Adapter` 标签页上，`WildPackets API` 必须列出描述 `Yes`，否则适配器将在\
  \ `Omnipeek` 中无法正常工作，如下：\n\n![g1002.tif](img/g1002_fmt.jpg)\n\n4. 点击 `802.11` 标签页，初始选择扫描所有通道。稍后一旦确定了要监控的特定\
  \ WLAN，你可以选择只捕获该通道上的流量。\n\n![g1003.tif](img/g1003_fmt.jpg)\n\n5. 点击 `OK` 开始捕获。捕获窗口将显示正在被捕获的帧。双击帧以查看更多细节。\n\
  \n6. 点击 `stop capture` 按钮停止捕获。从帧上方的工具栏选择 `Display filter` 下拉按钮（看起来像一个漏斗）。选择 `POP`。\n\
  \n7. 点击 `stop capture` 按钮停止捕获。点击 `Adapter` 标签页，`WildPackets API` 必须列出描述 `Yes`，否则适配器将在\
  \ `Omnipeek` 中无法正常工作，如下：\n\n![g1002.tif](img/g1002_fmt.jpg)\n\n*(注：此处由于原文逻辑重复，翻译已已指令，，，，，，，已按格式翻译翻译。)*\n\
  \n\n\n\n\n非法接入点（Rogue access points）是指未经授权连接到网络的 WLAN 接入点。非法 AP 在网络中开启了一个无线漏洞。黑客可以植入非法\
  \ AP，或者员工也可能在无意中通过将接入点插入网络而创建一个安全漏洞。产生的非法 AP 可被任何能连接到该 AP 的人员使用，包括黑客，从而让他们访问有线局域网（LAN）。这就是为什么组织扫描非法接入点至关重要的原因。即使是那些拥有“无无线”策略的组织，也需要进行无线扫描，以确保没有非法\
  \ AP 连接到网络。\n\n非法 AP 可能是存在的最危险的无线威胁，因为它们为潜在黑客提供了直接访问有线局域网的机会。连接到非法 AP 的客户端通常会直接从网络或\
  \ AP 获取 IP 地址，然后流量被直接桥接到有线局域网。从那里，黑客可以对有线 LAN 上的目标进行扫描、枚举和系统攻击。目前存在检测和移除非法接入点的措施，所有组织都应该实施这些措施。\n\
  \n许多基于企业 WLAN 控制器的管理解决方案都具有检测非法接入点的能力。这些基于控制器的解决方案包括通过接入点、传感器/监视器或两者来监控空气环境的能力。接入点本质上在客户端连接时必须保持在某个通道上以提供服务，而传感器和监视器能够持续扫描频段内所有通道的空气环境，以捕捉可能的非法接入点无线传输。将这些无线\
  \ MAC 地址与在网上接收到的地址进行比较，以确定该 AP 是否连接到与无线入侵检测系统（`WIDS`）或无线入侵防护系统（`WIPS`）相同的 LAN。某些\
  \ WIPS 还可以向尝试连接到非法 AP 的客户端发送伪造的去认证帧，从而阻止客户端连接到非法 AP——由此防止客户端通过非法 AP 发送数据。叠加式 WIDS/WIPS\
  \ 系统也可以通过对非法 AP 的位置进行三角定位来检测非法接入点。\n\n企业级 WLAN WIPS 和叠加式 WIPS 只是临时的检测和抑制方案。首要目标应该是定位非法\
  \ AP 并将其从网络中移除。\n\n## 恶孪生或 AP 伪装（AP Masquerading）\n\n黑客可以使用基于软件的 AP 创建一个看起来像真实接入点的\
  \ AP。这被称为恶孪生攻击（Evil Twin attack）或 AP 伪装。\n\n## 无线攻击技术\n\n大多数无线黑攻击可以归类如下：\n\n###\
  \ 破解加密和身份验证机制\n这些机制包括破解 WEP、WPA 预共享密钥认证密码以及思科的轻量级 EAP 认证（`LEAP`）。黑客可以使用这些机制通过窃取的凭据连接到\
  \ WLAN，或者捕获其他用户的数据并进行解密或加密。防止此类攻击的方法是实施更强的加密类型，例如 AES。\n\n### 窃听或嗅探\n此类攻击涉及从未加密的\
  \ WLAN 或热点中捕获密码或其他机密信息。防止此类攻击的方法是使用 SSL 应用层加密或 VPN 来保护用户数据。\n\n### 拒绝服务（DoS）\n可以在物理层执行\
  \ DoS，方法是使用 RF 发射器产生比 AP 更强的 RF 信号，导致经批准的 AP 故障，从而使用户连接到非法 AP。可以在逻辑链路控制（`LLC`）层执行\
  \ DoS，方法是生成去认证帧（`deauth` 攻击）、持续生成伪帧，或让无线网卡发送持续的原始 RF 流（昆士兰攻击）。防御措施是在你的 WLAN 周围强制安全边界，并使用\
  \ `IDS` 检测并移除 DoS 攻击源。\n\n### AP 伪装或欺骗\n非法 AP 通过使用相同的 SSID 设置或网络名称伪装成合法 AP。防止 AP\
  \ 伪装的措施是使用 `WIDS` 来检测和定位伪造的 AP。\n\n### MAC 欺骗\n黑客伪装成合法的 WLAN 客户端，通过欺骗另一个用户的 MAC\
  \ 地址来绕过 MAC 过滤。`WIDS` 可以检测 MAC 欺骗，未使用 MAC 过滤也是避免 MAC 欺骗攻击的方法。\n\n### 植入非法接入点\n最危险的攻击是植入非法\
  \ AP 以允许黑客访问目标 LAN。防御措施是使用 `WIPS` 检测并定位非法 AP。\n\n如果 AP 没有得到妥善保护，无线网络将为黑客进入网络提供便利途径。有许多方法可以攻击或利用\
  \ WLAN 的漏洞。针对这些许多攻击也有有效的防御措施。下一节将详细介绍保护无线网络的最佳方法。\n\n## 无网络安全\n\n与有线网络技术相比，无线网络是一项相对新的技术，安全选项较少。安全方法可以按\
  \ OSI 模型相应的层分类。\n\n第 2 层（或 MAC 层）安全选项如下：\n* 静态 WEP（不推荐）\n* WPA\n* WPA2/802.11i\n\
  \n第 3 层（或网络层）安全选项如下：\n* `IPSec`\n* `SSL VPN`\n\n第 7 层（或应用层）安全选项如下：\n* 安全应用程序，如 Secure\
  \ Shell (`SSH`)、基于 SSL 的 HTTP (`HTTPS`）和 FTP/SSL (`FTPS`）\n\n![note.eps](img/note_fmt.gif)\n\
  \n由于 WEP 许多许多漏洞，不应作为 WLAN 的唯一安全机制。\n\n## 保护家庭无线网络\n\n许多设置家庭无线网络的人急于完成工作，以便尽快让互联网连接可用。市场上的小型办公室、家庭办公（`SOHO`）网络产品使设置快速简单，但并不一定安全。配置额外的安全功能对某些家庭用户来说可能耗时且不直观，因此他们可能完全不实施任何安全机制。\n\
  \n如今无线网络产品无处不在且价格廉价，几乎任何人都可以花费 100 美元的设备在几分钟内设置好 WLAN。无线网络的广泛使用意味着在你的家庭或办公室 WLAN\
  \ 范围内可能有几十个潜在的网络入侵者。大多数 WLAN 硬件的设置已经变得非常简单，许多用户只需插上电源就开始使用网络而不考虑安全性。然而，花额外的时间配置无线路由器或接入点的安全功能是值得的。以下建议将提高你家庭无线网络的安全性：\n\
  \n更改默认管理员密码和用户名\n在配置家庭接入点时，你通常使用网络浏览器访问配置界面。几乎所有的路由器和接入点都有登录设备并修改任何配置设置时所需的管理员密码。为了设置这些设备，制造商提供了默认用户名和密码。许多默认登录信息非常简单（例如\
  \ `username=admin` 和 `password=admin`），并且对互联网上的黑客广为人知。大多数设备使用较弱的默认密码，如“password”或制造商名称，有些设备根本没有默认密码。你应该尽快更改家庭\
  \ AP 的默认密码。\n\n\n\n\n\n使用 WEP/WPA 加密。大多数 Wi-Fi 设备支持某种形式的加密。加密技术会对通过无线网络发送的消息进行扰乱处理，使得黑客无法轻易读取。你应该配置与你的无线客户端兼容的最强形式的加密。802.11\
  \ 的 `WEP`（有线等效隐私保护）加密具有众为人知的漏洞，这使得拥有正确设备的坚决用户相对容易破解加密并访问无线网络。保护你的 WLAN 的更好方法是使用\
  \ `WPA`（Wi-Fi 保护访问）。`WPA` 提供了更好的保护，而且更易使用，因为你的密码字符不再像 `WEP` 那样仅限于 0–9 和 A–F。（注：`WEP`\
  \ 也可以使用 ASCII 密钥。）\n\n更改默认 `SSID`。接入点使用名为 `SSID` 的网络名称向无线用户发布网络。制造商通常在出厂时为产品设置相同的\
  \ `SSID`。例如，Linksys 设备的 `SSID` 通常为“Linksys”。仅仅知道 `SSID` 本身并不能让邻居侵入你的网络，但这是一个开始。更重要的是，当有人发现默认\
  \ `SSID` 时，通常是网络配置不当的标志。在配置网络无线安全时，你应该立即更改默认的 `SSID`。\n\n不要自动连接到开放 Wi-Fi 网络。连接到开放\
  \ Wi-Fi 网络（如免费无线热点或未知 WLAN）会将你的计算机暴露在安全风险中。大多数计算机都有一个设置，允许这些连接在自动发生而不通知你。大多数版本的\
  \ Windows 会重新连接到以前连接过的 `SSID`。除非临时情况，否则不应启用此设置。\n\n在你的笔记本电脑和家庭接入点上启用防火墙设置。大多数路由器包含内置防火墙功能，但也存在禁用选项。确保你的路由器防火墙已开启。你应该在连接到路由器的每台计算机上安装并配置个人防火墙软件。\n\
  \n降低你的 WLAN 发射功率。你不会在所有无线路由器和接入点上找到此功能，但某些设备允许你降低 WLAN 发射功率，从而缩短信号范围。（通常此功能仅企业级接入点可用。）虽然通常无法精细地调整信号以使其不泄漏到家或办公场所之外，但通过反复尝试，你通常可以限制信号到达场所以外的距离，最大限度地减少外部人员访问你\
  \ WLAN 的机会。这通过将无线单元限制在你的场所内，还将提高你接入点的吞吐量。\n\n禁用远程管理。大多数 WLAN 路由器都具有通过互联网进行远程管理的能力。理想情况下，只有当该功能允许你定义特定的\
  \ IP 地址或有限范围的地址来访问路由器时才使用。否则，任何地方的任何人都可能发现并访问你的路由器。根据原则，除非你绝对需要此功能，否则最好关闭远程管理。\n\
  \n## 总结\n\n无线网络的增长受到便利性和日益增加的移动劳动动力的推动。越来越多的员工在家里或在途中工作，组织正在构建更大的企业 WLAN 以支持员工更强的流动性。过去，许多组织因为内在的缺乏安全性和技术不成熟而避免使用\
  \ WLAN。\n\n`802.11n` 的批准有望为无线局域网提供更高的速度，使其与现有的以太网局域网媲。这种速度的提升只会增加使用无线进行业务应用的组织数量，并增加安全风险。\n\
  \n最近，WLAN 安全机制已经成熟到企业和政府办公室开始采用 WLAN 技术的程度。通过适当的安全机制和实施，WLAN 可以达到高标准的安全。通过仔细遵循安全建议和应对措施，你可以保护你的\
  \ WLAN 免受攻击。\n\n## 考试要点\n\n- 理解使用 WLAN 的内在安全漏洞。RF 是广播介质，类似于集线器环境，因此所有流量都能被黑客捕获。\n\
  - 理解 IEEE `802.11` 标准中实现的安全解决方案。`WEP`、共享密钥和 `MAC` 过滤器是原始 IEEE `802.11` 标准提供的安全解决方案。\n\
  - 理解 Wi-Fi 联盟提供的安全解决方案。`WPA` 和 `WPA2` 是 Wi-Fi 联盟设备安全认证。\n- 知道 WLAN 上 `SSID` 的用途。`SSID`\
  \ 识别网络名称，应作为安全机制使用。\n- 知道哪些安全机制不应用于 WLAN 安全。`WEP` 和 `MAC` 过滤器不应作为保护 WLAN 的唯一手段。\n\
  \n## 复习题\n\n1\\. 以下哪种安全解决方案对加密和身份验证使用相同的密钥？\nA. `WPA`\nB. `WPA2`\nC. `WEP`\nD. `802.11i`\n\
  \n2\\. `WEP` 代表什么？\nA. Wireless Encryption Protocol\nB. Wired Equivalent Privacy\n\
  C. Wireless Encryption Privacy\nD. Wired Encryption Protocol\n\n3\\. 什么使得 `WEP`\
  \ 易被破解？\nA. 加密和身份验证使用相同密钥\nB. 密钥长度\nC. IV 的缺陷\nD. `RC4`\n\n4\\. `WPA` 使用哪种加密形式？\n\
  A. `AES`\nB. `TKIP`\nC. `LEAP`\nD. 共享密钥\n\n5\\. `WPA2` 使用哪种身份验证形式？\nA. 仅限密码\nB.\
  \ `802.1x/EAP/RADIUS`\nC. 密码或 `802.1x/EAP/RADIUS`\nD. 密码\n\n6\\. 在 WLAN 上 `SSID`\
  \ 的用途是？（此处此处原文选项不完整，应根据语意翻译）\n\n7\\. `802.11` 最类似于哪种安全标准？\nA. `WPA2`\nB. `WPA`\n\
  C. `TKIP`\nD. `AES`\n\n8\\. 发送 deauth 帧的设备正在执行哪种攻击？\nA. 拒绝服务\nB. 破解\nC. 嗅探\nD. MAC\
  \ 欺骗\n\n9\\. 针对 WLAN 最危险的攻击类型是？\nA. `WEP`\nB. 恶意接入点\nC. 监听\nD. MAC 欺骗\n\n10\\. `802.11i`\
  \ 实现在哪层？\nA. 第 1 层\nB. 第 2 层\nC. 第 3 层\nD. 第 7 层\n\n11\\. 以下哪个是家庭网络的最佳选项？\nA. `WEP`\n\
  B. 共享密钥认证\nC. `WPA-Personal`\nD. `WPA-Enterprise`\n\n12\\. 你刚为办公室安装了一个接入点。你应该立即采取哪些步骤来保护你的\
  \ WLAN？\nA. 欺骗你的客户端 MAC 地址。\nB. 修改 AP 管理密码。\nC. 将 AP 通道改为 11。\nD. 将 `SSID` 设置。\n\
  \n13\\. 连接任何 WLAN 时，可以在笔记本电脑上做什么来增加安全性？（双选）\nA. 安装并配置防火墙软件。\nB. 禁用自动连接功能。\nC. 使用\
  \ `WEP`。\nD. 使用 `MAC` 过滤。\n\n14\\. `SSID` 在 WLAN 的用途是？\nA. 安全 WLAN\nB. 管理 WLAN 设置\n\
  C. 识别 WLAN\nD. 配置 WLAN AP\n\n15\\. 实施“无无线”策略的最佳方法是？\nA. 安装防火墙。\nB. 禁用无线适配器。\nC.\
  \ 使用 `WIDS/WIPS`。\nD. 仅连接开放 AP。\n\n16\\. 以下哪个用于欺骗 MAC 地址的程序？\nA. `MAC Again`\nB.\
  \ Big MAC\nC. `TMAC`\nD. `WZC`\n\n17\\. 以下哪些用于保护 WLAN 热点数据的第 7 层应用安全协议？\nA. `HTTPS`\n\
  B. `HTTP`\nC. `FTP`\nD. `VPN`\n\n18\\. `WIPS` 使用哪种帧来防止 WLAN 用户连接到恶意接入点？\nA. 断开\n\
  B. 取消身份验证 (Deauthentication)\nC. 禁用\nD. 拒绝\n\n19\\. `WPA` 密码可以由哪些字符集组成？\nA. 仅 a–z\
  \ 和 A–Z\nB. 仅 a–z\nC. 仅 a–z, A–Z 和 0–9\nD. 仅 0–9\n\n20\\. 以下哪项是使用 `WEP` 的应对措施？\n\
  \n\n\n\n\n## 复习题\n\nA. 使用至少 20 个字符的强 `WEP` 密钥。\nB. 使用不重复任何字符的 `WEP` 密钥。\nC. 使用 `WPA`\
  \ 代替 `WEP`。\nD. 在 `WEP` 中实现预共享密钥。\n\n## 复习题答案\n\n1. `C`.`WEP` 加密和认证使用相同的密钥。\n2.\
  \ `B`.`WEP` 是 Wired Equivalent Privacy（无线等隐私）的缩写。\n3. `C`.`WEP` 可以被破解，是因为在部署 `RC4`\
  \ 时对 `IV` 的使用缺乏复杂。\n4. `B`.`WPA` 使用 `TKIP`。\n5. `C`.`WPA2` 在个人模式下使用密码，或在企业模式下使用\
  \ `802.1x/EAP/RADIUS`。\n6. `A`.`802.11i` 与 `WPA2` 几乎相同。\n7. `D`.`VPN` 是用于 `WLAN`\
  \ 的第三层安全解决方案。\n8. `A`.设备可以通过发送持续的 `deauth frames` 执行 `DoS` 攻击。\n9. `B`. 恶意 `AP`\
  \ 是 `WLAN` 最危险的攻击，因为它为黑客提供了进入网络的开放大门。\n10. `B`.`802.11i` 是二层技术。\n11. `C`.`WPA-Personal`\
  \ 在家庭网络上具有最强身份验证和加密。`WPA-Enterprise` 需要 `RADIUS` 服务器，大多数家庭用户没有能力设置和配置它。\n12. `B`.在安装新\
  \ `AP` 时，应立即更改 `AP` Web 上的 `Admin` 密码。\n13. `A, B`. 安装和配置个人防火墙软件以及禁用自动连接功能是增加 `WLAN`\
  \ 连接安全性的两种方法。\n14. `C`. 服务集标识符 (`SSID`) 用于向无线用户标识 `WLAN`。\n15. `C`. 使用无线入侵检测系统或保护系统是执行“无无线”策略的最佳方法。\n\
  16. `C`.`TMAC` 是用于伪造 `MAC address` 的程序。\n17. `A`.`HTTPS` 是 `HTTP` 的安全版本，通常用于保护 `WLAN`\
  \ 热点上的数据。\n18. `B`.`WIPS` 使用 `Deauthentication frames` 来防止用户连接到恶意 `APss`。\n19. `C`.`WPA`\
  \ 密码可以是字母数字并包含 `a–z`、`A–Z` 和 `0–9`。\n20. `C`. 使用 `WPA` 是应对 `WEP` 弱点的措施。\n\n# 第 11\
  \ 章：物理现场安全\n\n### 本章涵盖的 CEH 考试目标\n\n* 物理安全漏洞事件\n* 理解物理安全\n* 为什么需要物理安全？\n* 谁对物理安全负责？\n\
  * 影响物理安全的因素\n\n物理安全可能是 IT 安全中防止机密敏感数据丢失或被窃的关键领域。如果一个组织未能执行足够的物理安全，所有其他技术安全措施（如防火墙和入侵检测系统\
  \ `IDSs`）都可能被绕过。俗话说：“一旦进入内部，你就拥有了网络。”通过通过物理方式保护你的网络和组织，你可以防止他人偷取笔记本电脑或磁带驱动器等设备、在系统上放置硬件键盘记录器以及在网络上部署恶意接入点。物理安全很大程度上依赖人员的执行，因此容易受到社交工程攻击的影响，例如跟随员工进入建筑而无需提供正确的钥匙或凭据（从而绕过物理安全检查）。\n\
  \n本章将探讨物理安全的必要性，并定义谁负责规划和执行物理安全。\n\n### 物理安全的组成部分\n\n物理安全是保护人员、硬件、程序、网络和数据免受可能对企业、机构或协会造成严重损失或损害的物理情况和事件。这包括免受火灾、自然灾害、入室、盗窃、破坏和恐怖主义的侵害。\n\
  \n相比黑客、病毒、木马和间谍软件等更具技术性的问题，物理安全往往被忽视（其重要性被低估）。然而，物理安全漏洞可以在攻击者几乎完全没有技术知识的情况下实施。此外，事故和自然灾害是日常生活的一部分，从长期来看是不可避免的。\n\
  \n物理安全有三个主要组成部分：\n\n* 可以在潜在攻击者的路径上设置障碍，并针对事故和环境灾害对场所加固。此类措施包括多道锁、栅栏、墙壁、防火箱和水喷淋器。\n\
  * 可以建立监控和通知系统，如照明、热传感器、烟雾探测器、入侵检测器、报警器和摄像头。\n* 可以实施方法来捕获攻击者（最好在造成任何损害之前），并从事故、火灾或自然灾害中快速恢复。\n\
  \n似乎每天都有新闻报道描述另一家著名的政府机构或大型公司泄露了客户信息或机密员工信息。例如，笔记本电脑可能在入室抢劫案中被盗，或在员工旅行期间从酒店客房内被盗。这些机密或敏感信息在黑客手中可能是危险的。\n\
  \n在物理安全中，像所有安全措施一样，最好的方法是分层防御。你不应该 100% 地依赖单一控制措施来保护你的关键资产。以下是物理安全分层方法优于单一物理机制的两个例子。\n\
  \n第一个例子是守卫是唯一的防御机制。如果他睡着了或休息计划休息，入侵者就有机会在不被察觉的情况下直接进入你的数据中心。更好的安全措施是要求人员持有唯一的 ID\
  \ 牌才能进入大门。接下来，她受到守卫的检查，被摄像头记录，然后需要一把独立的钥匙才能进入数据中心。在这个例子中，有四层防御。\n\n在第二个安全示例中，一名员工买不起笔记本电脑，因此他决定把公司的电脑带回家玩他最喜欢的游戏。他在回家的火车或巴士上分心了，忘记了装有笔记本电脑的包。笔记本电脑没有设置任何安全控制，且包含敏感数据。如果在这种情况下遵循了最佳实践，将存在多层防御来防止和阻止该个人将笔记本电脑离开环境。应该有一项可接受的使用策略，以强调从场所带走公司财产和敏感数据的重要性及其影响。笔记本应该启用多因素身份验证和磁盘加密，这样在丢失或被盗时，其存储上的数据对其他人来说是无用的。如果环境特别敏感，可以在所有移动设备中放置追踪器，一旦它们离开办公室达到不可接受的距离，就会触发报警以通知安全人员。\n\
  \n建立多道防至关重要，因为部署的防御层越多，你受威胁的影响就越小。同样重要的是，即使你为资产设置了许多层逻辑安全控制，如果获得了物理访问权限，这些控制通常可以被快速地绕过。\n\
  \n设备盗窃是最常见的物理安全攻击之一。大多数人并没有预计自己的电脑会被盗，并且忽略锁定主机系统；相反，他们依赖标准的网络安全机制。\n\n许多内部攻击是物理安全漏洞的结果。一旦黑客获得了服务器、单个客户端系统或网络端口的物理访问权限，结果可能是灾难性的。此外，此类漏洞难以识别、追踪或定位。由于物理安全不足导致的常见安全漏洞如下：\n\
  \n* 安装恶意软件，如键盘记录器、病毒、木马、后门或根内核程序。\n\n\n\n\n\n* 识别并捕获验证或身份凭据，如密码或证书\n* 物理连接到有线网络以嗅探敏感数据，如密码和信用卡号\n\
  * 访问系统以收集用于破解系统本地存储密码的数据\n* 有机会部署恶意访问点，用以创建一个可以访问有线网络的开放无线网络\n* 盗取纸质或电子文档\n* 盗取敏感传真信息\n\
  * 翻垃圾桶攻击（强调了粉碎重要文件的必要性）\n\n### 物理安全漏洞的迹象可能包括但不限于：\n\n* 未经授权或无法解释的门禁报警\n* 监控摄像头录得到未经授权的人员\n\
  * 门锁或外部围栏围受损坏\n* 围栏内外出现车辆或人员的证据\n* 无法解释的通信中断\n* 丢失或无法说明的设备\n\n### 理解物理安全\n\n通常情况下，安全措施可以分为以下三类：\n\
  \n#### 物理措施\n防止访问系统的物理措施包括安保人员、照明、围栏、锁和报警器。设施接入点应受到限制，并应通过闭路电视（`CCTV`）摄像头和报警器进行监控/保护。设施入口应仅限授权人员进入。对笔记本电脑系统以及移动介质（如移动驱动器、备份带和磁盘）的访问应受到限制和保护。电脑屏幕的放置位置应确保路人无法看到，并应实施和执行相关策略，要求用户因任何原因离开电脑时锁定系统。存有高度敏感数据的计算机系统应保护在封闭且锁定的区域内，例如带有机架式机箱和锁的凭据访问室。\n\
  \n### 技术措施\n在所有远程客户端系统、网络和服务器上应实施技术安全措施，如防火墙、`IDS`、间谍软件内容过滤以及病毒和木洛马扫描。访问控制等技术安全措施通过使用身份验证、密码以及文件和文件夹权限来实现。其他技术控制可以通过计算机软件（如病毒扫描和主机防火墙）来实现。从本质上说，技术控制是指任何通过计算机硬件或软件实现的安全机制。\n\
  \n### 运营措施\n运营安全通过管理控制来解决，例如可接受使用策略、招聘政策和安全策略。分析威胁和执行风险评估的运营安全措施应成为组织安全策略中记录的流程。\n\
  \n技术和运营安全措施将在本书的其他章节中讨论。技术防御措施列在本书的每一章中（第一章和最后一章除外）。\n\n你需要物理安全措施与其他类型安全（如技术或运营安全）相同：防止黑客获取你的网络和信息。黑客可以很容易通过物理安全措施的缺陷获取此类访问权限。此外，数据可能会因自然原因丢失或损坏，因此风险经理在规划适当的安全措施时必须将自然灾害考虑在内。物理安全措施旨在防止以下情况：\n\
  \n* 未经授权访问计算机系统\n* 从系统中窃取数据\n* 损坏存储在系统中的数据\n* 自然原因导致的数据丢失或系统损坏\n\n![realworld.eps](img/realworld_fmt.gif)\n\
  \n### VA 笔记本电脑被盗数据\n\n2006 年，退伍军人事务部（VA）一名数据分析师家中被盗一台笔记本电脑，该员工违反部门规定将电脑带回了。笔记本电脑包含了约\
  \ 2650 万名美国退伍军人的数据。\n\n据信，这是一次随机抢劫，偷走电脑的人并不知道电脑里有这些数据。小偷偷走了他的笔记本电脑和外部硬盘，硬盘包含了 1975\
  \ 年后退伍的每位退伍军人的姓名、出生日期和社会安全号码。\n\nVA 评论说，该员工“从 VA 带回了大量的电子数据，这是他未经授权的。这违反了我们的规章、制度和政策。”这一安全漏洞说明了你最私人的数据如何轻易落入身份窃取者之手。\n\
  \n漏洞被发现后，几个退伍军人团体对 VA 发起了法律诉讼。现在三年后，双方已达成协议。能够证明遭受实际损害（例如导致身体症状的情绪痛苦，或信用监控费用）的退伍军人将有权获得高达\
  \ 1,500 美元的赔偿。这项和解为 VA 总计带来了 2000 万美元的成本。这只是说明物理场地安全和执行政策对于维护个人数据安全有多么重要的一个例子。被发现未能保护其受托数据的组织可能面临巨额罚款。\n\
  \n组织中的以下人员应对物理安全负责：\n\n* 组织的物理安全官\n* 信息系统专业人员\n* 首席信息官\n* 员工\n\n本质上，组织中的每个人都有责任执行物理安全策略。设定物理安全标准和实施物理安全措施是物理安全官的责任。\n\
  \n组织有责任对所有员工进行安全意识培训。防止物理安全攻击的最佳防御措施是培训员工对物理安全漏洞保持警惕。\n\n物理安全受到物理安全控制之外因素的影响。影响组织物理安全的因素包括：破坏、盗窃以及地震、火灾、洪水等自然原因。安全专业人员需要意识到这些风险因素并做出相应计划。许多组织建立了业务连续性计划（（BCP`）或灾难恢复计划（`DRP`）以应对这些可能性。\n\
  \n### 物理场地安全防御措施\n\n有一些简单的方法可以提高组织的物理安全。许多时候，提高安全性涉及执行已存在的指南。人们往往在执行执行政策和程序一段时间后会变得松散。为了维持高水平的安全，组织中的每个人必须保持警惕，保护组织的数据资产。\n\
  \n应实施以下防御措施以确保强大的物理场地安全：\n\n锁好服务器房。在使用技术机制锁定服务器之前，甚至在第一次启动它们之前，你应该确保服务器机房门装有良好的锁。当然，如果不用，世界上最好的锁也毫无用处，因此你还需要制定策略，要求在房间无人时锁好这些门。策略应规定谁拥有进入的钥匙或钥匙代码。服务器房是你物理网络的心脏，拥有该房间内服务器、交换机、路由器、电缆和其他设备物理访问权限的人可以造成巨大的破坏。\n\
  \n\n\n\n\n# 设置和监控视频监控\n\n锁上机房的门是一个良好的第一步，但有人可能会破入，或者拥有授权访问的人员可能会滥用权限。你需要一种方法来知道谁在什么时候进出了。使用签到/签到表是实现这一目标最基本的方法，但这种方法有很多缺点。心有恶意意图的人可能会直接绕过它。\n\
  \n比签到表更好的解决方案是集成到锁定设备中的身份验证系统，这样就需要智能卡、令牌或生物识别扫描才能打开门锁，并记录每位进入人员的身份。视频监控摄像头应放置在一个难以被篡改或关闭的地点，同时又能够良好地观察到进出人员，并应作为签到表或电子访问控制系统的补充。监控摄像头可以进行持续监控，也可以使用运动检测技术仅在有人移动时进行记录。它们甚至可以被设置为：在不应该有运动的情况下（例如下班后）检测到运动时，发送电子邮件或手机通知。\n\
  \n## 确保最脆弱的设备位于锁好的房间内\n\n你必须物理保护的不只是服务器。其他网络设备也需要安全防护。黑客可以将笔记本电脑连接到集线器，并使用嗅探软件捕获在网络中传输的数据。确保尽可能多的网络设备都位于那个锁好的房间内。如果不加安全措施，布线室和电话室将成为易受攻击的目标。\n\
  \n## 安全工作站\n\n黑客可以使用任何连接到网络且未安全的计算机来访问或删除对你的业务非常重要的信息。空闲办公位或空旷办公室的工作站——例如那些正在休假或离开公司尚未被替换的人员使用的工作站，或者外部人员易于访问的位置——例如前台接待处——是特别脆弱的。\n\
  \n断开并/或移除未使用的计算机，并/或锁上空办公室的门，包括员工午餐或请假期间暂时空空的办公室。对于必须留在开放区域（有时员工看不见的地方）的计算机，可以启用智能卡或生物识别读取器，使未经授权的人员难以登录。\n\
  \n## 防止入侵者打开计算机\n\n服务器和工作站都应该受到防盗的保护，防止他们打开机箱并夺走硬盘。在口袋里带走硬盘比提一整台塔式电脑离开现场要容易得多。许多计算机配有机箱锁，以防止在没有钥匙的情况下打开机箱。\n\
  \n## 保护便携设备\n\n笔记本电脑和手持设备构成了特殊的物理安全风险。小偷可以轻易偷走整台电脑，包括存储在其磁盘上的任何数据以及可能保存的网络登录密码。如果员工在办公桌前使用笔记本电脑，他们离开时应该随身带，或使用线锁将其固定在固定装置上。当员工离开区域时，可以将手持设备锁在抽屉或保险箱内。还有运动传感器报警器可以在你的便携设备被移动时提醒你。\n\
  \n对于包含敏感信息的便携设备，全盘加密、生物识别读取器以及在被盗的笔记本电脑连接到互联网时“拨回”的软件可以作为物理预防措施的补充。\n\n![note.eps](img/note_fmt.gif)\n\
  \n许多手机在设备丢失或被盗时具有远程擦除的能力。\n\n## 备份\n\n备份重要数据是灾难恢复中的一个基本要素，但不要忘记这些备份磁带、磁盘或光盘上的信息可能会被公司以外的人员窃并使用。许多\
  \ IT 管理员将备份放在机房服务器旁边。它们至少应该锁在抽屉或保险箱内。理想情况下，一组备份应该保存在异地，你必须留心确保它们在异地地点是安全的。\n\n不要忽视这样一个事实：某些员工可能会在软盘、USB\
  \ 闪盘或外部硬盘上备份他们的工作。如果允许或鼓励这种做法，请确保有政策要求备份随时锁定。\n\n## 禁用移除式介质驱动器\n\n为了防止员工将公司信息复制到移除式介质，你可以禁用或移除软驱器、USB\
  \ 端口和其他连接外部驱动器的方法。仅仅断开线可能无法震慑技术高明的员工。某些组织甚至用胶水或其他物质填充端口以永久防止其使用，尽管有一些软件机制可以禁止这样做并允许管理员重新启用驱动器。\n\
  \n## 保护你的打印机\n\n你可能没有考虑到打印机存在安全风险，但今天许多打印机会将文档内容存储在自身的内置内存中。如果黑客偷了打印机并访问该内存，他或她可能复制最近打印的文档。打印机像存储重要信息的服务器和工作站一样，应该位于安全位置并螺栓固定，以免有人带走它们。\n\
  \n还要考虑员工打印出来的文档的物理安全。最好的方法是实施立即粉碎任何不需要的打印文档的政策，即使那些不包含机密信息的文档也是如此。这建立了一种习惯，并让终端用户无需承担决定是否粉碎文档的责任。\n\
  \n## 为所有员工和承包商执行胸卡制度\n\n启动包含员工照片的胸卡计划并对特定的访问区域进行颜色编码。承包商和访客也应该佩戴胸卡，并在整个访问期间接受护送、观察和监督。所有员工询问任何没有佩戴可见身份证的人员应该是标准政策。\n\
  \n### 警惕“尾随者”（tailgaters）\n\n这些人等候有访问权限的人员进入控制区域（例如带锁的门的区域），然后跟随授权人员通过门门。尾随者在不使用自己的钥匙、卡钥匙或锁的组合的情况下进入。站在大外的抽烟者似乎特别容易发生“尾随”。\n\
  \n\n\n\n请检查以下物理场所安全清单，以评估贵组织的物理安全状况。\n\n## 公共停车区域\n\n- 在适当的情况下，是否对员工、租户和公共停车区域进行了明确的标识？\n\
  - 夜间照明水平是否充足？测试：在现有的光照条件下，你是否可以舒适地阅读报纸？\n- 停车场区域和入口是否可以被尽可能多的人观察？\n- 在人员进入场所的所有时段，停车区域是否都已完全照明？\n\
  - 在适当的情况下，停车区域是否已妥善设置告示，允许执法人员在必要时采取执法行动？例如：限制停车区、残疾人车。\n\n## 限制区域\n\n- 是否安装了围栏和锁门等屏障，以防止未经授权的车辆和行人进入限制区域？\n\
  - 是否已指示员工报告限制区域内的未经授权人员以及其他可疑人员和活动？\n- 限制区域是否已妥善设置告示以防止未经授权的人员进入？\n- 限制区域附近是否显著显示了户外标识？\n\
  - 报告可疑活动的电话号码的标识是否位于易于观察的位置？\n\n### 存储区域\n\n- 室外存储区域和院场是否完全封闭？\n- 围栏和墙壁是否完好？\n-\
  \ 围栏高度是否足够？\n- 大门是否完完好？\n- 存储区域和院场在黑暗期间是否提供了充足的照明？\n- 大门是否用高安全性挂锁或类似的锁定设备固定？\n-\
  \ 大门打开时，挂锁是否已锁好到位？\n- 高价值存储区域是否由电子安全系统保护？\n\n## 建筑外部\n\n- 公共入口是否通过走道和标识明确定义？\n-\
  \ 景观设施是否维护良好，以确保建筑周围视线良好？\n- 植物是否经过了修剪，以消除门、窗户、走道及物业其他脆弱区域附近的潜在藏身之处？\n- 树木或其他景观是否提供了通往建筑屋顶或其他楼层的路径？\n\
  - 树木和植物是否保持修剪，以防止它们干扰照明和视线？\n- 垃圾桶和垃圾围栏是否产生了盲点或隐蔽区域？\n- 周边围栏的设计是否能保持从街道的可见性？\n-\
  \ 外部私有区域是否与公共区域易区分？\n\n### 照明\n\n- 建筑外部和其他关键区域在黑暗期间的照明是否达到了建议水平？\n- 在黑暗期间，所有门窗开口及其他脆弱点是否都保持了适当的照明水平？\n\
  - 是否已建立维护检查计划，以确保灯具在任何时候都处于良好工作状态？\n\n### 门\n\n- 所有外门是否为金属、金属玻璃或实心木质设计？\n- 所有不使用的门是否已永久封死？\n\
  - 所有不用于从外部进入的门是否已拆除外部五金件？\n- 所有门的设计是否确保无法通过破窗窗（玻璃或轻质面板）来触及锁具释放装置？\n- 玻璃推门是否配备了辅助插销锁和防撬起装置？\n\
  - 裸露的合页是否带有不可拆卸的销钉？\n- 是否尽可能使用了高质量的弹簧锁？\n- 锁具的设计或门框的结构是否使得门无法通过撑开框架来强行打开？\n- 钥匙是否仅发放给实际需要的人员？\n\
  - 是否已制定相关政策，规定所有在营业期间不需要解锁的门在不使用时必须关闭并加固？\n\n### 窗户\n\n- 不使用的窗户是否已永久封死？\n- 窗锁的设计或位置是否确保无法通过破碎玻璃来破解？\n\
  - 在适当的情况下，是否利用带刺灌木或类似植物等景观设施来防止进入脆弱的窗户？\n- 在必要时，黑暗期间可进入的窗户是否提供了充足的照明？\n- 屋顶梯和其他屋顶进入点是否已移除或加固以防止未经授权的使用？\n\
  - 卷帘门和平拉门是否安装妥当并用高质量的锁定设备固定？\n- 建筑内外的设备用间是否已妥善加固？\n\n## 公共访问区域\n\n- 安保和/或接待区的位置是否可以观察所有公共入口？\n\
  - 建筑的所有公共区域是否都有清晰标记？\n- 公共区域与非公共区域之间的边界是否定义明确？\n- 是否安装了安全屏障，以防止在公共和非公共区域之间随意移动？\n\
  - 所有通往办公室和其他非公共区域的门是否都通过电子锁或密码锁等高质量锁定设备加固？\n- 在发生犯罪活动或非法侵入风险较高的区域是否雇佣了安保人员？\n- 内部公共卫生间是否可以从附近的办公室或接待区观察到？\n\
  \n## 办公室安全\n\n- 你是否将办公室钥匙限制给实际需要的人员？\n- 你是否保留了所有办公室钥匙处理情况的完整且最新的记录？\n- 你是否有完善的程序从离职员工处收回钥匙？\n\
  - 你是否使用某种锁定设备固定所有打字机、计算器、计算机和类似物品？\n- 你是否禁止复制办公室钥匙（除非是你专门书面要求订购的钥匙）？\n- 你是否要求所有办公室钥匙都标记为“勿复制”，以防止合法的锁匠在在你不知情的情况下制作副本？\n\
  - 你是否已制定政策，规定钥匙不会无人看守地放在桌子或柜子上——并且你是否执行了该政策？\n- 你是否已制定政策，设施钥匙和钥匙扣上不会标记标识其所属设施的信息？\n\
  - 你是否要求在不使用时将文件柜钥匙从锁中取出并放在安全位置？\n- 你是否有一位负责人负责钥匙管理计划？\n- 你是否在丢弃敏感文件前对其进行粉碎处理？\n\
  - 在不使用时，你是否将装有重要材料的公文包和包锁在安全的地方？\n- 你是否坚持进入你设施的所有供应商和维修人员必须提供合规身份证明？\n- 你是否每天晚上都清理桌面上的重要文件？\n\
  - 你是否经常更换保险箱的密码？\n- 计算机访问是否仅限于授权人员？\n- 你是否建立了员工胸证制度？\n- 如果你在下班后雇用了安保人员，你是否定期进行不打招呼访问以确保他们工作正常？\n\
  \n## 报警系统\n\n- 你的建筑是否配备报警系统？\n- 报警系统是否经过了美国实验室（UL）认证？\n- 系统是否每天进行测试？\n- 系统是否会报告给报警公司中心监控站或警方设施？\n\
  - 系统在断电时是否具有自动备用电源？\n- 系统是否不存在误报情况？\n- 系统是否采用了防篡改技术？\n\n## 发生安全漏洞后的应对措施\n\n即使组织采取了物理场所防御措施，安全漏洞仍可能发生。如果发生了此类事件，贵组织应采取以下建议步骤以防止再次发生：\n\
  \n- 建立物理安全事件响应流程，包括威胁识别、响应、恢复和事后审查，以管理物理攻击或安全事件。\n- 制定政策、标准和程序以支持物理安全事件响应流程。\n\n\
  \n\n\n-   识别利益相关者——包括安全事件响应小组、组织内部人员以及可能参与管理和审查信息安全事件的外部人员。\n\n## 总结\n请记住，网络安全始于物理层面。世界上所有的防火墙都无法阻止能够获得你的网络和计算机物理访问权限的入侵者，因此既要锁好门，也要做好防范。未经授权的人员对公司数据的物理访问是对组织安全的侵害。一旦有人获得了你数据的物理访问权限——无论是被盗的笔记本电脑、丢失的文件还是介质——你就会受到进一步攻击的威胁，更不用说会有大量的负面宣传了。实施物理场所安全措施以在攻击发生前将其至关重要。\n\
  \n## 考试要点\n- 理解通过物理访问可以进行的攻击。物理访问使黑客具备了破解密码、安装恶意无线接入点和盗取设备的能力。\n- 了解影响物理安全执行的某些因素。破坏行为、盗窃和自然原因会影响物理安全的执行。\n\
  - 了解谁对物理安全负责。组织的安全官、信息系统专业人员、首席信息官和员工都对物理安全负责。\n- 理解物理安全的必要性。物理安全对于防止未经授权访问建筑或计算机系统、数据被盗窃、存储在系统上的数据损坏，以及由于自然原因导致的数据丢失或系统损坏是必要的。\n\
  \n## 复习题\n1. 谁负责实施物理安全？（选择所有适用项）\nA. 建筑物所有者\nB. 首席信息官\nC. IT 管理员\nD. 员工\n\n2. 下列哪些因素影响物理安全？\n\
  A. 网络中使用的加密\nB. 洪水或火灾\nC. IDS（入侵检测系统）的实施\nD. 防火墙配置\n\n3. 以下哪些是物理安全设计用于防止的？（选择所有适用项）\n\
  A. 盗取机密数据\nB. 从内部攻击系统\nC. 从互联网攻击系统\nD. 获取未经授权区域的物理访问\n\n4. 以下哪项通常是最容易被忽视的安全领域之一？\n\
  A. 运营\nB. 技术\nC. 互联网\nD. 物理\n\n5. 黑客在网络上安装恶意无线接入点以便从建筑外嗅探有线网络流量，造成了哪种类型的安全漏洞？\n\
  A. 物理\nB. 技术\nC. 运营\nD. 远程访问\n\n6. 在渗透测试期间，哪个安全领域通常受到的关注最少？\nA. 技术\nB. 物理\nC. 运营\n\
  D. 无线\n\n7. 黑客可以对物理安全控制薄弱的组织实施以下哪些攻击？\nA. 拒绝服务\nB. 射频干扰\nC. 硬件键盘记录器\nD. 标志抓取（Banner\
  \ grabbing）\n\n8. 哪种访问允许存储在本地系统上的密码被破解？\nA. 物理\nB. 技术\nC. 远程\nD. 拨入\n\n9. 下列哪项是物理安全漏洞的示例？\n\
  A. 从 Web 服务器应用程序获取信用卡号\nB. 攻击 SQL Server 以定位信用卡号\nC. 盗取笔记本电脑以获取信用卡号\nD. 从无线热点发送的封包中嗅探信用卡号\n\
  \n10. 黑客获得物理访问权限后可以执行哪种类型的攻击？\nA. 通过翻找垃圾桶寻找密码\nB. 盗取设备\nC. 执行 `S attack` 攻击\nD.\
  \ 执行会话劫持\n\n11. 检测到物理安全漏洞后最重要的任务是什么？\nA. 锁上建筑外所有的门。\nB. 关闭服务器以防止进一步的攻击尝试。\nC. 报警开始调查。\n\
  D. 收集信息进行分析，以防止未来的漏洞发生。\n\n12. 下列哪项是防止物理安全攻击的建议措施？\nA. 锁上服务器房。\nB. 夜晚断开服务器与网络的连接。\n\
  C. 不允许任何人进入服务器房。\nD. 实施多次 ID 检查以进入服务器房。\n\n13. 哪些物理措施可以防止服务器硬盘被盗窃？（选择所有适用项）\nA.\
  \ 锁上服务器房门。\nB. 锁服务器机箱。\nC. 为服务器添加软件防火墙。\nD. 对所有访客强制执行证件检查。\n\n14. 没有自己的证件或钥匙却跟随员工进入锁门区域的人称什么？\n\
  A. 尾随者（Tailgater）\nB. 随从者\nC. 访客\nD. 客人\n\n15. 在检测到物理场所安全漏洞后，应该采取以下哪些措施？\nA. 实施安全意识培训。\n\
  B. 建立安全响应小组。\nC. 识别利益相关者。\nD. 执行渗透测试。\n\n16. 下列哪些项应该采取物理保护？（选择所有适用项）\nA. 网络聚集器/交换机\n\
  B. 可移动介质\nC. 机密文件\nD. 备份带\nE. 以上所有\n\n17. 下列哪些项是保护便携设备的物理方法？（选择所有适用项）\nA. 强用户密码\n\
  B. 防止盗窃的电锁\nC. 运动感应报警器\nD. 个人防火墙软件\n\n18. 下列哪些项是物理安全措施旨在防止的？\nA. 自然原因导致的数据丢失或系统损坏\n\
  B. 员工和承包商对数据的访问\nC. 对客户数据库的物理访问\nD. 通过互联网访问员工数据库\n\n19. 下列哪项可能是由于缺乏物理安全引起的？\nA.\
  \ Web 服务器攻击\nB. SQL 注入\nC. 对防火墙的攻击\nD. 实施恶意接入点\n\n20. 下列哪项是物理漏洞的迹象？\nA. 监控摄像头记录到未经授权的人员\n\
  B. 入侵检测日志记录入侵者访问数据库\nC. 杀病毒程序扫描出电脑上有木马\nD. 员工非法访问薪资数据库\n\n## 复习题答案\n1. B, C, D.\
  \ 首席信息官包括 IT 管理员内的所有员工负责实施物理安全。\n2. B. 洪水或火灾会影响物理安全；其他选项都是技术安全问题。\n3. A, B, D. 物理安全旨在防止他人盗取机密数据、从内部攻击系统以及获取未经授权区域的物理访问。技术安全防御来自互联网的攻击。\n\
  4. D. 物理安全是最容易被忽视的安全领域之一。\n5. A. 为了放置无线接入点，黑客需要拥有物理访问。\n6. B. 在渗透测试期间，物理安全通常受到的关注最少。\n\
  7. C. 黑客获得客户端系统的物理访问后，可以安装硬件键盘记录器来捕密码或其他机密数据。\n8. A. 物理访问允许黑客破解本地系统上的密码。\n9. C.\
  \ 盗取设备是物理安全漏洞的示例。\n10. B. 盗取设备需要物理访问。\n11. D. 检测到物理安全漏洞后最重要的任务是收集信息进行分析，以防止未来的攻击。\n\
  12. A. 锁上服务器房是防止物理安全漏洞的简单措施。\n13. A, B, D. 锁上服务器房和机箱以及对所有访客强制执行证件检查是物理控制。软件防火墙是技术控制。\n\
  \n\n\n\n\n15. C. 在物理场所安全泄露后，需要识别事件响应过程中的利益相关者。在检测到下一次物理场所安全泄露之前，实施安全意识培训，建立安全响应团队并进行渗透测试。\n\
  \n16. E. 网络集线器和交换机、移动媒体、机密文档以及所有备份磁带在使用后应进行物理安全并销毁。\n\n17. B, C. 电缆锁和运动报警器是防止便携设备被盗的物理防御措施。\n\
  \n18. A. 物理安全措施旨在防止因自然原因的数据丢失或系统损坏。\n\n19. D. 缺乏物理安全可能允许黑客在网络上部署恶意无线接入点。\n\n20.\
  \ A. 安全摄像机记录到的未授权人员是物理场所安全泄露的迹象。\n\n# 第 12 章：破解 Linux 系统\n\n## 本章涵盖的 CEH 考试目标：\n\
  \n*   理解如何编译 Linux 内核\n*   理解 GCC 编译命令\n*   理解如何安装 LKM 模块\n*   理解 Linux 加固方法\n\n\
  Linux 凭借其开源和灵活性（任何人都可以修改它），成为系统管理员喜爱的操作系统。由于 Linux 的开源特性，有许多不同的版本，被称为发行版（distros）。几个\
  \ Linux 发行版已成为稳健的商业操作系统，用于工作站和服务器。流行的商业发行版包括 Red Hat、Debian、Mandrake 和 SUSE；一些常见的免费版本是\
  \ Gentoo 和 Knoppix。\n\nLinux 的灵活性和开源特性，加上 Linux 应用程序的增加，使其成为许多系统的首选操作系统。尽管 Linux\
  \ 的内在安全性高于 Windows 操作系统，但它也存在可以被利用的漏洞。本章将介绍开始使用 Linux 作为操作系统的基础知识，以及如何加固系统以防御攻击。\n\
  \n## Linux 基础\n\nLinux 质程度上基于 Unix，任何熟悉在 Unix 环境工作的人都应该可以使用 Linux 系统。大多数发行版都包含了所有的标准命令和实用。\n\
  \nLinux 系统内置许多文本编辑器，包括 `vi`、`ex`、`pico`、`jove` 和 `GNU emacs`。许多 Unix 用户偏于像 `vi`\
  \ 这样“简单”的编辑器。但由于年代久远，vi 有许多局限性，许多现代编辑器（如 `emacs`）在近年来变得流行。\n\n大多数基础 Linux 工具都是 GNU\
  \ 软件，这意味着它们向社区免费分发。GNU 工具还支持 BSD 和 UNIX 系统标准版本中没有找到的高级功能。然而，GNU 工具 旨在保持与 BSD 兼容。\n\
  \nShell（壳）是一个命令行程序界面，允许用户输入命令，并由系统执行用户的命令。此外，许多 Shell 提供了诸如作业控制（同时管理多个进程的能力）、输入和输出重定向以及编写\
  \ Shell 脚本的命令语言。Shell 脚本是用 Shell 的命令语言编写的程序，类似于 MS-DOS 批处理文件\n\nLinux 提供多种类型的 Shell。Shell\
  \ 之间最重要的区别是命令语言。例如，C SHell (`csh`) 使用类似于 C 语言语言的命令语言。经典的 Bourne SHell (`sh`) 使用另一种命令语言。对\
  \ Shell 的选择通常基于它提供的命令语言，并决定了用户可以使用哪些功能。\n\nGNU Bourne Again Shell (`bash`) 是 Bourne\
  \ Shell 的变体，它包含了许多高级功能，如作业控制、命令历史、命令和文件名自动补全以及编辑文件的接口。另一个流行的 Shell 是 `tcsh`，它是 C\
  \ Shell 的一个版本，具有类似于 `bash` 的高级功能。其他 Shell 还包括 `zsh`（一个类 Bourne 的小型 shell）；Korn Shell\
  \ (`ksh`)；BSD 的 `ash` 以及 Plan 9 的 shell `rc`。\n\n如果你主要是 Windows 用户，在 Linux 文件系统中的移动可能需要一点时间适应。表\
  \ 12-1 中的命令将帮助你开始导航 Linux 文件系统。\n\n### [表 12-1：] Linux 文件系统导航\n\n| 命令 | 用途 |\n|\
  \ --- | --- |\n| `cd ..` | 在大多数 Unix shell 中用于返回上一级目录。在 `cd` 和两个点 (`..`) 之间有一个空格是非常重要的。\
  \ |\n| `cd -` | 在 Korn shell 中用于返回上一个目录。 |\n| `ls -a` | 列出目录的所有内容，包括隐藏文件。 |\n| `ls\
  \ -l` | 列出关于文件的所有信息，如权限、所有者、大小和最后修改日期。 |\n| `cp` | 复制文件。 |\n| `mv` | 移动文件。 |\n|\
  \ `mkdir` | 创建新目录。 |\n| `rm` | 删除文件或目录。 |\n\n大多数 Linux 文件系统通过通用目录组织。表 12-2 中的目录位于大多数\
  \ Linux 发行版中。\n\n### [表 12-2：] Linux 目录\n\n| 目录 | 内容 |\n| --- | --- |\n| `bin` |\
  \ 二进制（可执行）文件 |\n| `sbin` | 系统二进制 |\n| `etc` | 配置文件 |\n| `include` | 包含头文件 |\n| `lib`\
  \ | 库文件 |\n| `src` | 源代码文件 |\n| `doc` | 文档 |\n| `man` | 手册（帮助）文件 |\n| `share` |\
  \ 共享文件 |\n\nLinux 网络命令与 Windows 命令类似。对于 CEH 考试，你应该熟悉表 12-3 中的命令。\n\n### [表 12-3：]\
  \ Linux 网络命令\n\n| 命令 | 描述 |\n| --- | --- |\n| `arp` | 用于查看映射到 IP 地址的 ARP 表 |\n|\
  \ `ifconfig` | 用于查看网络接口配置 |\n| `netstat` | 显示网络连接和套接摘要 |\n| `nslookup` | 将域名解析为\
  \ IP 地址 |\n| `ping` | 测试 IP 连通性 |\n| `ps` | 列出所有运行进程 |\n| `route` | 列出路由表 |\n| `shred`\
  \ | 安全删除文件 |\n| `traceroute` | 跟踪到达目的地的路径 |\n\n## 编译内核\n\n由于 Linux 的开源，源代码是免费分发的。源代码以二进制文件的形式提供，必须编译后才能作为操作系统运行。用户可能重新编译\
  \ Linux 内核出于三个：\n\n*   你可能拥有非常新的硬件，你的发行版光 中没有它的内核模块。\n*   你可能遇到了某种在操作系统修订版本中修复的错误。\n\
  *   你可能某些需要新版本系统的软件应用程序。\n\n编译自己的 Linux 内核对于灵活性非常有帮助，但用户应该注意从哪里下载源代码。某些可能会在源代码中添加恶意或感染的代码、木马或其他后门。出于安全考虑，请仅从已知且信任的网站下载\
  \ Linux。\n\n在练习 12-1 中将编译 Linux 内核，练习 12-2 显示如何创建 USB 可启动的 Linux 发行版。\n\n### 练习\
  \ 12-1：配置和编译内核\n\n要下载、配置并编译 Linux 内核，请遵循以下步骤：\n\n\n\n\n1. 找到操作系统的最新版本文件并将其下载到 Linux\
  \ 系统的 `/usr/src` 目录。然后使用 `tar zxf` 命令对其进行解压。\n\n2. 下一步是配置 Linux 内核。切换目录到 `/usr/src/Linux`\
  \ 并输入 `make menuconfig`。此命令会编译几个程序，然后快速弹出一个窗口。窗口菜单允许你更改内核配置的许多方面。\n\n![g1201.tif](img/g1201_fmt.jpg)\n\
  \n3. 在完成所有必要的更改后，保存配置并在命令行提示符处输入 `make dep`；`make clean`。这些命令中的第一个命令会构建内核源码中的依赖关系树。这些依赖关系可能受到你在配置步骤中选择的选项的影响。`make\
  \ clean` 命令会清除之前编译内核时留下的任何不需要的文件。\n\n4. 执行命令 `make zImage` 和 `make modules`。这些操作可能需要很长时间的时间，因为它们正在编译内核。\n\
  \n5. 最后一步是安装新内核。在基于 Intel 的系统上，使用命令将内核安装到 `/boot`：\n\n```\ncp /usr/Linux/src/arch/i386/boot/zImage\
  \ /boot/newkernel\n```\n\n6. 执行命令 `make modules_install`。这将模块安装到 `/lib/modules`\
  \ 中。\n\n7. 编辑 `/etc/lilo.conf` 以添加如下所示的内容：\n\n```\nimage = /boot/newkernel\nlabel\
  \ = newread-only\n```\n\n8. 在下次重启时，在 `lilo` 中选择新内核，它将加载新内核。如果运行正常，将其移动到 `lilo.conf`\
  \ 文件的第一个位置，这样它每次都会默认启动。`Lilo` 是大多数 Linux 用户用于启动 Linux 系统的引导加载程序。\n\n“lilo.conf”文件的示例（通常位于\
  \ `/etc/`）：\n\n```text\n# 这行是一个注释行\n\n#LILO 全局部分\n    boot = /dev/hda2\n    timeout\
  \ = 500\n    prompt\n    default = linuxbox #\"linuxbox\" 是默认内核\n    vga = normal\n\
  \    read-only\n#End of section 全局部分结束\n\n# 可启动内核\"vmlinuz-2.0.36-1\" 位于目录\"/boot/\"\
  \n\n# 第一个内核\n    image = /boot/vmlinuz-2.0.36-1\n    label = linuxbox\n    vga =\
  \ normal\n    root = /dev/hda2\n#内核一部分结束\n```\n\n![note.eps](img/note_fmt.gif)\n\
  \n如果你是 Linux 新手，Live CD 是一个很好的选择。使用 Live CD，你可以在不向系统安装 Linux 的情况下测试和使用操作系统。要使用 Live\
  \ CD，请先访问 [www.distrowatch.com](http://www.distrowatch.com) 选择发行版。然后下载 ISO 文件并将其写入\
  \ CD。该 CD 可以放入任何系统并启动到一个功能完整的 Linux 版本。\n\n### 练习 12-2：使用 Live CD\n\n在本次练习中，你将创建一个\
  \ Linux Live USB 启动盘。本质上，操作系统将从 USB 盘启动，然后你将拥有一个功能完整的 Linux 系统来学习如何使用某些 Linux 命令。\n\
  \n1. 从 [sourceforge.net](http://sourceforge.net) 下载 `UNetbootin`。\n2. 运行 `UNetbootin`\
  \ 程序。\n3. 选择 Distribution（发行版）单选按钮并点击下拉菜单。\n\n![g1202.tif](img/g1202_fmt.jpg)\n\
  4. 从下拉菜单中选择 Linux 版本。CEH 工具推荐的 Linux 发行版是 BackTrack，但请检查 [distrowatch.com](http://distrowatch.com)\
  \ 网站以了解每个发行版包含哪些工具。另一个选项是下载自己的 Linux ISO 文件并选择 `Disk Image`（磁盘镜像）单选按钮。\n5. 将空白 USB\
  \ 驱动器插入计算机。USB 盘上的所有数据都将被擦除，请确保它不包含任何你想保留的文件。确保你的 USB 盘足够大以包含整个 ISO 镜像。\n6. 选择 `USB\
  \ Drive` 作为类型，并选择你的 USB 盘对应的驱动器号。\n7. 点击 OK，等待 `UNetbootin` 完成格式并将发行版文件复制到驱动器上。\n\
  \n### GCC 编译命令\n\nGNU 编译器集 (`GCC`) 是一种命令行编译器，它接收源代码并将其生成为可执行文件。你可以从 [`gcc.gnu.org`](http://gcc.gnu.org)\
  \ 下载它（许多 Linux 发行版也包含版本的 `GCC`）。`GCC` 可用于编译和执行 C、C++ 和 FORTRAN ，以便它们能够在 Linux 系统上运行。\n\
  \n以下是用 `GCC` 编译 C++ 代码作为应用程序的命令：\n\n```\ng++ filename.cpp –o outputfilename.out\n\
  ```\n\n使用 `GCC` 编译 C 代码作为应用程序的命令如下：\n\n```\ngcc filename.c –o outputfilename.out\n\
  ```\n\n### 安装 Linux 内核模块\n\nLinux 内核模块 (`LKMs`) 允许你在无需重新编译内核的情况下为你的操作系统添加功能。加载 LKM\
  \ 的命令是 `modprobe`。\n\n## Linux 加固方法\n\n加固（Hardening）是通过修改来提高系统安全性的过程。通过采用这些方法，可以让\
  \ Linux 变得更加安全。\n\n保护任何服务器（无论 Linux 还是 Windows）的第一步是确保它位于安全区域，例如网络运营中心，这可以防止黑客获得物理访问。\n\
  \n下一个显而易见的安全措施是使用密码且不泄露用户名。管理员应确保系统没有空密码，通过检查 `/etc/shadow` 来验证。\n\n默认的安全立场 `deny\
  \ all`（拒绝所有）是加固系统免受攻击的好方法。在应用 `deny all` 后，管理员可以为特定用户开放访问。通过先使用 `deny all` 命令，可以确保用户不会获得他们不应拥有的权限。拒绝所有用户访问网络的命令如下：\n\
  \n```\nAll:All>>/etc/hosts.deny\n```\n\n加固 Linux 服务器的方法是移除未使用的的服务并确保系统已修复最新的漏洞。管理员还应经常检查系统日志，查看任何异常。\n\
  \n以下是改进 Linux 服务器安全的其他建议步骤：\n\n### 操作系统选择与安装\n* 使用广泛认可且良好的 Linux 发行版。\n* 设置磁盘分区（或逻辑卷），考虑任何安全因素。\n\
  * 在初始操作系统安装后，应用自安装媒体创建以来发布的操作系统补丁。\n* 设置并启用 `iptables`。\n* 不要安装不必要的应用程序或服务。\n* 如果适用，启用高安全性/可信操作系统版本。\n\
  * 使用密码保护引导加载程序（如 `lilo` 或 `GRUB`）。\n* 如需要启用单用户模式密码。\n\n#### 本地文件系统安全\n* 查看不适当的文件和目录权限，并修复发现的问题。最重要的问题包括：\n\
  \    * 组写入或全局写入的系统执行文件和目录\n    * 组写入或全局写入的用户目录\n* 为本地文件系统选择挂载选项（如 `nosuid`），以利用操作系统提供的安全功能。\n\
  * 对系统中存在的敏感数据进行加密。\n\n配置并禁用服务\n\n\n\n\n\n- 移除或禁用所有不需要的服务。服务通过几种不同的方式启动：在 `/etc/inittab`\
  \ 内部、通过系统启动脚本、或通过 `inetd`。在可能的情况下，应从系统中完全删除不需要服务的软件。\n- 在可用时，使用安全版本的守护进程（daemons）。\n\
  - 如果可能，将服务器进程作为为该目的创建的特殊用户运行，而不是以 `root` 运行。\n- 在适当的情况下，通过 `chroot` 机制在隔离的目录树中运行服务器。\n\
  - 如果可能，为服务设置最大实例数量。\n- 为所有服务指定访问控制和日志记录。必要时安装 `TCP Wrappers`。仅允许所需的最小访问。在 `/etc/hosts.deny`\
  \ 中添加条目以拒绝所有人的访问（这样只有在 `/etc/hosts.allow` 中允许的访问才会被）。\n- 使用提供的任何服务用户级访问控制。例如，`cron`\
  \ 和 `at` 子系统允许你限制哪些用户可以使用它们。有些人建议将 `at` 和 `cron` 限制为管理员。\n- 加固所有服务的安全性，无论它们看起来是否与安全相关（例如打印服务）。\n\
  \n## 加固 root 账户\n- 选择一个安全的 root 密码，并计划定期更改密码。\n- 如果可能，将 `su` 命令的使用限制在一个组内。\n- 使用\
  \ `sudo` 或系统角色在需要时授予其他普通用户有限的 `root` 权限。\n- 除了系统控制台外，防止直接登录 `root` 用户。\n\n## 定义用户账户密码选择和老化设置\n\
  - 根据需要设置默认用户账户限制。\n- 在 `/etc/skel` 中设置默认用户初始化文件，以及系统范围的初始化文件。\n- 确保不应任何人登录的管理员和其他系统账户已禁用密码，并使用\
  \ `/bin/false` 或其他非登录 shell。\n- 移除不需要的预定义默认账户。\n\n## 加固远程身份认证\n- 禁用 `/etc/hosts.equiv`\
  \ 和 `.rhosts` 免密认证。\n- 使用 `ssh` 及其命令进行所有的远程用户访问。禁用 `rlogin`、`rsh`、`telnet`、`ftp`、`rcp`\
  \ 等。\n\n## 执行持续系统监控\n- 配置 `syslog` 设施。将 `syslog` 消息发送或复制到中央 `syslog` 服务器以实现冗余。\n\
  - 启用进程计数（process accounting）。\n- 安装 `Tripwire`，对其进行配置并记录系统基准数据。将数据写入可移动介质，然后从系统中移除。最后，配置\
  \ `Tripwire` 每天运行。\n- 设计并实施监控日志信息以检测安全相关事件的计划。\n\n## 执行杂项活动\n- 从系统中移除剩余的 `kernel`\
  \ 源代码或额外的软件包。\n- 将新主机添加到其他系统的安全配置中、路由器访问控制列表等。\n- 检查任何已安装软件的供应商（vendor）安全更新。\n\n\
  练习 12-3 显示了如何在 Linux 系统上检测监听端口。\n\n### 练习 12-3：检测监听的网络端口\n加固 Linux 最重要的任务之一是检测并关闭不需要的网络端口。本练习将向你展示如何获取监听网络端口列表（TCP\
  \ 和 UDP 套接字）。\n\n1. 启动你在之前的练习中创建的 `BackTrack Linux` USB 器。注意，本次练习不需要 `BackTrack`。这些命令在任何\
  \ Linux 安装上都有效。\n2. 打开命令行窗口并输入 `netstat -tulp`。此命令将显示你系统上的开放端口列表。\n\n![g1203.tif](img/g1203_fmt.jpg)\n\
  \n列出程序正在监听的所有 TCP 和 UDP 套接字的另一种方法是使用 `lsof`。运行此命令的语法为：\n\n```bash\nlsof -i -n |\
  \ egrep 'COMMAND|LISTEN|UDP'\n```\n\n3. 加固 Linux 安装的下一步是禁用未使用的服务。所有运行级别（runlevel）服务的启动/停止脚本都可以在\
  \ `/etc/init.d` 目录下找到。例如，如果你不知道 `atd` 服务的作用，请进入 `/etc/init.d` 并打开 `atd` 文件。在脚本中查找启动程序的行。在\
  \ `atd` 脚本中，守护进程 `/usr/sbin/atd` 行启动了二进制文件 `atd`。在知道了该服务启动的程序名称后，可以通过运行 `man atd`\
  \ 来查看 `atd` 的在线页面。这将帮助你找到更多关于系统服务的信息。\n\n要永久禁用一个服务（在本例中为运行级别服务 `nfs`），请输入以下命令：\n\
  \n```bash\nchkconfig nfs off\n```\n\n![realworld.eps](img/realworld_fmt.gif)\n\n\
  ## 破解默认的 Linux 安装\n我在一家小型咨询公司工作，那里的大多数顾问都是 Windows 系统的专家，但缺乏其他操作系统的经验。我们的一个客户想用\
  \ Linux 建立电子商务网站，因此，由于我们公司想留住这个客户，我们同意为他们安装 Linux 系统。由于没有顾问具有丰富的 Linux 经验，系统在安装时使用了许多默认选项和标准服务。\n\
  \n新系统安装后不久，电子商务门户遭到黑客攻击，客户数据库被破坏。黑客泄露了客户的个人信息和信用卡号。此外，该公司遭受了拒绝服务攻击（DoS），客户无法访问网站，导致了业务损失。\n\
  \n攻击发生后另一另一专事安全的咨询公司进行了一些法证分析，并确定用户的访问权限被设置为默认值，黑客利用了这一点进行攻击。该咨询公司建议我们组织未来应该加固 Linux。\n\
  \n## 总结\n理解 Linux 的基础是非常重要的，许多应用程序和 Web 服务器运行在 Linux 上。对于 CEH 考试，你应该熟悉如何使用该操作系统以及加固默认安装应采取的步骤。Live\
  \ CD 或 U 盘是学习使用基础工具的好方法。\n\n## 考试要点\n- 理解 Linux 在市场上的应用。Linux 已成为流行的平台、服务器和工作站。\n\
  - 选择如何使用 Linux Live CD。下载 ISO 文件。将其写入 CD 并从 CD 启动系统。\n- 选择创建 Linux 系统的步骤。下载二进制文件并编译\
  \ Linux 源码；然后安装编译好的 OS。\n- 选择如何加固 Linux 系统。使用良好的发行版、更改默认密码、禁用 root 登录、使用 `iptables`、使用\
  \ `HIDS`、应用最新修复并监控日志文件以加固 Linux。\n- 理解 LKM 的用途。LMs 为 Linux 系统添加功能，但应仅来自良好的来源。\n\
  - 了解 GCC 编译。GCC 编译器用于从源代码创建可执行应用程序。\n\n## 复习题\n1. LKM 代表什么？\nA. Linux Kernel Module\n\
  B. Linux Kernel Mode\nC. Linked Kernel Module\nD. Last Kernel Mode\n\n2. 使用哪个 GCC\
