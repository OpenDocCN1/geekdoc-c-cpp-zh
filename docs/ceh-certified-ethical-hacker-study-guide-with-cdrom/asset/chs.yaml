  12. D. `HOME_NET` 变量在 `snort.conf` 文件中用于识别本地网络。\n\n13. A. 规则位置通过 `snort.conf` 文件中的\
  \ `RULE_PATH` 变量进行识别。\n\n14. D. 规则动作、协议、源地址和目的地址都包含在 Snort 规则头部中。`HOME_NET` 是在 `snort.conf`\
  \ 文件中定义内部网络的变量。\n\n15. C. 此 Snort 选项通过为该告警分配“尝试管理员”（attempted-admin）攻击类，赋予了其高优先级。\n\
  \n16. A, C. 安装 Snort 时，需要分别安装 Snort 规则和 Snort 引擎。\n\n17. A. 攻击签名是一种用于识别单个数据包或一组组合后执行攻击的数据包模式。\n\
  \n18. B. 隧道技术（Tunneling）是一种用于规避 IDS 签名匹配的方法。\n\n19. A. `A` 表示 ACK 标志已设置。\n\n20.\
  \ B. 目的地址为 192.168.1.4:1244，1244 表示客户端端口号。源端口 443 表示一个 HTTPS 服务器。\n\n# 第 14 章：密码学\n\
  \n### 本章涵盖的 CEH 考试目标\n* 密码学和加密技术概述\n* 描述公钥和私钥如何生成\n* MD5、SHA、RC4、RC5、Blowfish 算法概述\n\
  \n密码学是对加密和加密算法的研究。在实际意义上，加密是将信息从可理解的形式（明文）转换为不可理解的形式（密文），反之亦然。加密的目的是使数据对于不知道解密消息秘密的拦截者或窃听者不可读。加密试图确保通信的机密性。密码学定义了用于加密的技术。本章将讨论加密算法和密码学。\n\
  \n## 密码学与加密技术\n\n加密可以用于在数据传输过程中或存储在硬盘时进行加密。密码学是通过通过数学方式打乱数据来保护信息的研究，使得在不知道用于加密它的数学公式的情况下，数据无法被解密。这种数学公式被称为加密算法。密码学由两个单词组成：crypt（意为秘密或隐藏）和\
  \ graphy（意为写作）。密码学（Cryptography）字面意思是“秘密或隐藏的文字”。\n\n明文是可读且可理解的数据，而密文是加密过程产生的乱序文本。密文应该是不可读的，且不显示任何重复的模式，以确保数据的机密性。图\
  \ 14-1 显示了明文与密文的对比。\n\n图 14-1: 明文与密文\n\n![f1401.eps](img/f1401_fmt.gif)\n\n数据安全有三个关键要素。机密性、完整性和认证性被称为\
  \ CIA 三要素（图 14-2）。数据加密提供了机密性，意味着数据只有授权用户才能读取。消息哈希提供了完整性，确保所发送的数据与接收到的数据是相同的一致的，且信息在传输过程中未被修改。消息数字签名提供了认证性（确保用户确实如其所自称）以及完整性。消息加密和数字签名共同提供了机密性、认证性和完整性。\n\
  \n图 14-2: CIA 三要素\n\n![f1402.eps](img/f1402_fmt.gif)\n\n加密算法可以使用简单的字符打乱方法，例如替换法（用其他字符替换字符）和易位法（改变字符的顺序）。加密算法是基于替换和易位的数学计算。\n\
  \n以下是一些早期的密码系统：\n\n### 凯撒密码\n一种简单的替换密码（图 14-3）。\n\n图 14-3: 替换密码\n\n![f1403.eps](img/f1403_fmt.gif)\n\
  \n### 巴什密码 (Atbash Cipher)\n古代希伯来人使用的巴什密码（图 14-4）是一种替换密码，它通过将使用的每个字母替换为字母表末尾距离相同的另一个字母来工作；例如，A\
  \ 会发送为 Z，B 会发送为 Y。\n\n图 14-4: 巴什密码\n\n![f1404.eps](img/f1404_fmt.gif)\n\n### 维吉纳密码\
  \ (Vigenere Cipher)\n16 世纪法国密码学家布莱斯·维吉纳（Blaise de Vigenere）创建了一种多表密码来克服简单密码的缺点。维吉纳密码（图\
  \ 14-5）使用表格来增加可用替换值。替换表由“A”到“Z”的列组成。为了获得密文，首先选择明文的列，然后选择行。行和列的交叉点就是密文。\n\n图 14-5:\
  \ 维吉纳密码\n\n![f1405.eps](img/f1405_fmt.gif)\n\n### 维纳姆密码 (Vernam Cipher)\n1917 年，AT&T\
  \ 贝尔实验室工程师吉尔特·维纳姆（Gilbert Vernam）试图改进维吉纳密码，最终创建了维纳姆密码，或“一次性垫”。维纳姆密码是一种加密算法，其中明文与长度相同的随机密钥（或“垫”）相结合。一次性垫是唯一被证明无法通过暴力破解破解的算法。\n\
  \n### 隐藏密码 (Concealment Cipher)\n隐藏密码创建了一个以某种方式隐藏的消息。例如，以下段落包含秘密信息：\n\n我一直尝试给 Sally\
  \ 买一些漂亮的珠宝，如金子或银耳环，但现在价格上涨了。密钥是查看句子中的六个字。\n\n## 加密类型\n\n两种主要的加密类型是对称加密和非对称密钥加密。\n\
  \n### 对称加密\n对称加密意味着发送方和接收方使用相同的密钥来加密和解密数据。密钥（可以是数字、单词或仅是一串随机字母）应用于消息文本，以特定的方式更改内容。这可能只是简单地在字母表中移动几个位置。只要发送方和接收方知道该密钥，他们就可以加密和解密使用该密钥的所有消息。\n\
  \n对称加密的缺点是没有安全的方法可以在多个系统之间共享密钥。使用对称加密的系统需要使用离线方法将密钥从一个系统传输到另一个系统。这在互联网等大型环境中是不现实，因为客户端和服务器不在同一个物理位置。\n\
  \n对称加密的优点是快速的批量加密。对称加密的缺点包括：\n\n* 密钥分发\n* 可扩展性\n* 安全性有限（仅提供机密性）\n* 不提供不可否赖性，意味着无法证明发送者的身份\n\
  \n对称算法示例示例：\n\n* DES（数据加密标准）\n* 3DES\n* AES（高级加密标准）\n* IDEA（国际数据加密算法）\n* Twofish\n\
  \n\n\n\n\n# RC4 (Rivest Cipher 4)\n\n非对称（或公共）密钥加密的创建是为了解决对称密钥管理和分发的弱点。但密钥密钥存在一个问题：如何在像互联网这样本质不安全的网络上安全地交换它们呢？任何知道密钥的人都可以解密消息，因此保持密钥密钥的安全至关重要。非对称加密使用一对相关的密钥，称为密钥对。公钥可以提供给任何可能向你发送加密消息的人。第二个私钥则保持保密，只有你知道它。\n\
  \n任何使用公钥加密的消息（文本、二进制文件或文档）只能使用匹配的私钥进行解密。任何使用私钥加密的消息只能使用匹配的公钥进行解密。这意味着你不需要担心在互联网上传输公钥，因为它们在本质上是任何人都可以获取的。然而，非对称加密的问题是它比对称加密慢。加密和解密消息内容需要多的处理能力。\n\
  \n非对称密钥加密中两个密钥之间的关系基于复杂的数学公式。创建密钥对的方法一种是使用质数分解。另一种方法是使用离散对数。非对称加密系统基于充当陷门的单向函数。本质上，加密是单向的，因为同一个密钥无法解密它所加密的消息。相关的私钥提供了使解密可行的信息。关于函数的信息包含在公钥中，而关于陷门的信息包含在私钥中。任何拥有私钥的人都知道陷门函数并可以计算公钥。\n\
  \n要使用非对称加密，需要一种传输公钥的方法。典型技术是使用 `X.509` 数字证书（也简单称为证书）。证书是一个标识用户或服务器的信息文件，包含组织名称、颁发证书的机构以及用户的电子邮件地址、国家和公钥。\n\
  \n当服务器和客户端需要安全的加密通信时，它们通过网络向对方发送查询，对方会回传一份证书的副本。可以从证书中提取出对方的公钥。证书也可以被用于唯一地标识持有者。\n\
  \n## 非对称加密可以用于\n\n*   数据加密\n*   数字签名\n\n非对称加密可以提供\n\n*   机密性\n*   身份验证\n*   不可否认性\n\
  \n非对称密钥加密的优点包括\n\n*   密钥分发\n*   可扩展性\n*   机密性、身份验证和不可否认性\n\n非对称密钥加密的弱点是过程很慢，且通常需要长得多的密钥。由于其运行缓慢，它只适用于少量数据。\n\
  \n## 流式加密器与块加密器\n\n块加密器和流式加密器是两种类型的加密器。块加密器是通过加密固定数量（或“块”）数据来运行的加密器。最常见的块大小是 64\
  \ 位数据。这块数据或数据块被作为一个明文单元进行加密。当使用块加密进行加密和解密时，消息被分为若干位块。然后将这些块通过以下一种或多种混乱方法：\n\n* \
  \  替换\n*   置换\n*   混淆\n*   扩散\n*   `S-boxes`\n\n流式加密将单位数据作为连续的数据位流进行加密。流式加密的执行速度通常比块加密快，且适用于硬件使用。流式加密器通过\
  \ `XOR`（异或）操作将明文位与伪随机加密位流相结合。`XOR` 过程（参见图 14-6）是是逐位比较明文和密钥，并根据 `XOR` 逻辑创建密文。如果明文和密钥密钥是相同的位，则结果为\
  \ 0；如果它们不同（例如 1 和 0），那么生成的加密位就是 1。\n\n图 14-6: 异或表\n\n![f1406.eps](img/f1406_fmt.gif)\n\
  \n## 生成公钥和私钥\n\n当客户端和服务器使用非对称加密时，双方都会创建自己的密钥对，总共四个密钥：服务器的公钥、服务器的私钥、客户端的公钥和客户端的私钥。系统的密钥对具有数学关系，允许使用一个密钥加密的数据可以使用另一个密钥解密。这些密钥具有基于质数分解的数学关系，每个密钥都可以用于解密用另一个密钥加密的数据。当客户端和服务器想要相互身份验证并共享信息时，它们会各自将自己的公钥发送给远程系统，但它们从不共享私钥。每条消息都使用接收者的公钥加密。只有接收者的私钥才能解密消息。服务器将使用客户端的公钥向客户端加密消息。解密消息的唯一密钥由客户端持有，这确保了机密性。\n\
  \n创建数字证书需要公钥基础设施 (`PKI`)。`PKI` 是一个由硬件；软件；用于管理、创建、存储和分发密钥的策略以及数字证书组成的框架。此外，完整的 `PKI`\
  \ 解决方案（如图 14-7](#9780470642887c14.xhtml_figure14-7))涉及对称算法、非对称算法、哈希和数字身份验证（通常是证书）。\n\
  \n图 14-7: 证书机构\n\n![f1407.eps](img/f1407_gif)\n\n公钥加密的主要优点是可以促进未知双方之间的通信，这一过程是通过\
  \ `PKI` 信任层次关系实现的。`PKI` 基础设施的重要部分如下：\n\n*   数字证书\n*   证书机构\n*   证书的生成和销毁\n*   密钥管理\n\
  \n![realworld.eps](img/realworld_gif)\n\n## 理解证书机构\n\n使用证书机构 (`CA`) 来验证客户端类似于提供驾执照进行身份识别。当我乘坐飞机旅行时，我必须出示有效的身份证来证明我的身份。机场安全人员通常要求第三方（如州）颁发身份证明，例如驾执照。安全人员可能会对我用数码相机和彩色打印机在家制作的身份卡产生怀疑。他们也不会接受图书馆卡作为身份证明，因为它可能不包含关于我的所有必要信息。颁发驾执照的州非常类似于证书机构：一个被信任的验证我身份的第三方。证书本身类似于驾执照，因为它包含了验证我身份所需的所有信息。\n\
  \n\n\n\n\n* 主体公钥信息 (Subject Public Key Information)\n* 公钥算法\n* 主体公钥\n* 发行者唯一标识符（可选）\n\
  * 主体唯一标识符（可选）\n* 扩展（（可选）\n\n在练习 14-1 中，你将查看来自安全网站的数字证书。\n\n## 练习 14-1：查看数字证书\n\n\
  连接到任何需要登录的网站，例如银行、邮箱或电子商务网站。如果你没有安全网站的登录账号，可以在 [www.gmail.com](http://www.gmail.com)\
  \ 免费创建一个 Google 邮箱（Gmail）。如果你正在创建 Gmail 账户，你需要更改设置始终使用 HTTPS 以保护你的电子邮件。使用 SSL 登录后，你将能够从\
  \ Web 服务器查看 `x.509` 证书。\n\n1. 打开 Internet Explorer 并登录安全网站。\n2. 点击 `Page`（页面）菜单并选择\
  \ `Properties`（属性），或点击 Internet Explorer 屏幕右下角的黄色锁图标。\n3. 点击页面属性页上的 `Certificates`（证书）按钮。\n\
  \n![g1401.tif](img/g1401_fmt.jpg)\n\n4. 点击 `Details`（详细信息）标签查看所有证书字段。点击每个字段查看其值。\n\
  \n![g1402.tif](img/g1402_fmt.jpg)\n\n5. 确定证书的发行者。\n6. 确定证书的有效期。\n7. 查看证书的公钥。\n\n\
  ![g1403.tif](img/g1403_fmt.jpg)\n\n## 加密的其他用途\n\n完整性（Integrity）是 CIA 三要素的组成部分之一，确保信息保持不变并以真实的原始形式存在。哈希（Hash）是提供消息完整性的常用方法。哈希是将字符字符串转换为代表原始数据的较短固定长度值。它类似于完整数据的简写版本。\n\
  \n用于数字签名的常用哈希算法包括：\n\n* `SHA-1`\n* `MD5`\n* `RIPEMD-160`\n\n## 练习 14-2：使用 WinMD5\
  \ 计算文件哈希值\n\n1. 从 [www.blisstonia.com/software/WinMD5](http://www.blisstonia.com/software/WinMD5)\
  \ 下载并安装 `WinMD5`。\n2. 运行 `WinMD5.exe` 程序。\n\n![g1404.tif](img/g1404_fmt.jpg)\n\n\
  3. 点击 WinMD5 中的 `File` 菜单并选择 `Open`。从你的系统中选择任意文件。\n\n![g1405.tif](img/g1405_fmt.jpg)\n\
  \n以下是一个文件错误的 `MD5` 哈希值示例：\n\n![g1406.tif](img/g1406_fmt.jpg)\n\n如果你从互联网下载了文件，你可能担心文件不完整或已损坏。确保发送的文件与接收的文件相同的方法之一是通过\
  \ `MD5` 哈希算法。`MD5` 哈希是文件的指纹。你可以比较两个文件的指纹来查看文件本身是否相同。\n\n你必须拥有文件的正确指纹才能将收到的文件与原始文件进行比较；否则，你无法判断文件是否完整。当你下载一个大文件时，它可能包含另一个名为\
  \ `MD5SUM` 或类似名称的文件。该文件包含了正确的指纹。将 `MD5SUM` 文件拖入 `WinMD5` 会自动进行指纹对比。\n\n`MD5SUM`\
  \ 程序允许你计算文件的 `MD5` 哈希值。它还方便指纹与存储在 `MD5SUM` 文件中的正确指纹进行对比。例如，红帽为其所有大型可下载文件提供了 `MD5SUM`\
  \ 文件。\n\n当你执行哈希计算时，两个具有相同摘要的消息极不可能出现。然而，如果确实发生了并且两条消息产生了相同的哈希值，则被称为碰撞（Collision）。碰撞允许对该算法进行密码攻击。\n\
  \n## 加密算法\n\n算法的密钥长度从 40 位到 448 位不等。密钥越长，加密算法越强。使用暴力破解法破解 40 位密钥需要从 1.4 分钟到 0.2\
  \ 秒不等，取决于处理计算机的性能。相比之下，破解 64 位密钥需要 50 年到 37 天不等，同样取决于处理器的速度。目前，任何长度超过 256 位的密钥都被认为是不可破解的。\n\
  \n消息摘要算法 5 (`MD5`)、安全哈希算法 (`SHA`)、`RC4`、`RC5` 和 `Blowfish` 都是用于加密的不同数学算法名称。作为 CEH（认证伦黑客），你需要熟悉这些算法：\n\
  \n### MD5\n`MD5` 是一种哈希算法，使用随机长度的输入生成 128 位摘要。它常用于为文档和电子邮件创建数字签名，以证明来源的完整性。数字签名过程涉及创建文档的\
  \ `MD5` 消息摘要，然后由发送者的私钥对其进行加密。在数字签名过程中，`MD5` 消息摘要是用私钥加密的。\n\n### SHA\n`SHA` 也是一种消息摘要，生成加密数据的\
  \ 160 位摘要。`SHA` 耗的时间比 `MD5` 稍长，并认为认为更强大。\n\n* `SHA-0`：任意长度\n    * 输出：160 位指纹或摘要\n\
  * `SHA-1`：任意长度\n    * 输出：160 位指纹或摘要\n* `SHA-2`：任意长度\n    * 输出：256 位指纹或摘要\n\n###\
  \ RC4 和 RC5\n`RC4` 是一种对称密钥，是一种流加密，意味着它每次加密一个位。它使用随机排列和变量密钥大小。`RC5` 是下一代算法：它使用变量块大小和大小。\n\
  \n### Blowfish\n`Blowfish` 是一种 64 位块加密，意味着它分块加密数据。它比流加密更强，密钥在 32 到 448 位之间。\n\n\
  ### MAC 和 HMAC\n`MAC`（消息认证码）要求发送者和接收者共享一个秘密密钥。\n\n`HMAC`（哈希消息认证码）的设计初衷是免疫多碰撞攻击。`HMAC`\
  \ 的功能是使用哈希算法（如 `MD5` 或 `SHA-1`）并使用对称密钥修改初始状态。\n\n### 数字签名\n数字签名（参见图 14-8](#9780470642887c14.xhtml_figure14-8））基于公钥加密，用于验证消息的真实性和完整性。数字签名通过将内容通过哈希算法创建。该值然后用发送者的私钥加密。接收接收消息时，解密加密值并计算预期的消息哈希。\n\
  \n值匹配以：\n* 确保消息有效性\n* 证明其是由认为的方发送的\n* 证明只有该方拥有私钥\n\n[图 14-8：] 数字签名过程\n\n![f1408.eps](img/f1408_fmt.gif)\n\
  \n## 密码攻击\n\n密码攻击是通过发现算法、协议或密钥管理的漏洞来规避加密系统安全性的方法。以下是攻击者可以执行的密码攻击：\n\n### 密文攻击\n\
  这种攻击要求攻击者获取多个使用相同加密算法加密的消息。纯密文攻击的关键特征是：\n* 攻击者没有相关的明文。\n* 攻击者尝试通过寻找模式和使用统计分析来破解。\n\
  \n### 明文攻击\n这种攻击要求攻击者拥有或多个消息的明文和密文。目标是发现密钥。如果你知道消息的部分明文，就可以这种攻击。\n\n\n\n\n\n# 选择明文攻击\
  \ (Chosen–Plain Text Attack)\n这类攻击发生在攻击者对其选择的明文进行加密的情况下。攻击者可以分析加密后的密文输出。\n\n###\
  \ 选择密文攻击 (Chosen–Cipher Text Attack)\n这类攻击发生在攻击者可以解密其选择的密文消息部分的情况下。攻击者可以使用解密后的消息来发现密钥。\n\
  \n### 重放攻击 (Replay Attack)\n重放攻击发生在攻击者拦截加密密钥并在以后重新使用它们，以便对他们可能无法访问的消息进行加密或解密。\n\n\
  ### 暴力破解攻击 (Brute-force Attack)\n暴力破解涉及尝试所有可能的组合（如密钥或密码），直到找到正确的解决方案。暴力破解攻击通常是成功的，但需要时间且成本高昂。\n\
  \n## 总结\n加密学的目的是防止未经授权查看信息的人获取秘密。加密的目标是在保持这些信息私密性的同时，确保它们可以在互联网等不安全网络上不受干扰且不经更改地传输。在许多情况下，加密只是延迟查看信息一段时间的一种手段，直到这些信息不再有用。对称加密的密钥主要用于执行批量数据加密，而非对称密钥用于将密钥安全地传输到系统中。\n\
  \n## 考试要点\n*   **定义两种加密类型。** 对称密钥加密和非对称密钥加密是加密加密类型。\n*   **理解加密期间混乱数据的方法。** 替换和置位法是加密的基础，用于在加密过程中打乱数据。\n\
  *   **识别常见的加密算法。** `MD5`、`SHA`、`RC4`、`RC5` 和 `Blowfish` 是常见的加密算法。\n*   **了解公钥和私钥是如何生成的。**\
  \ 公钥和私钥作为密钥对同时创建，用于加密和解密数据。用密钥对一个成员加密的数据只能由另一个成员解密。\n*   **了解加密学的定义。** 加密是通过数学过程打乱数据的方法（称为加密算法）对数据进行加密的过程。\n\
  \n## 复习题\n1. 公私密钥对中有几个密钥？\nA. 1\nB. 2\nC. 3\nD. 4\n\n2. 对称密钥加密需要几个密钥？\nA. 1\nB.\
  \ 2\nC. 3\nD. 4\n\n3. 以下哪些密钥长度被认为是不可破解的？（选择所有适用）\nA. 512\nB. 256\nC. 128\nD. 64\n\
  \n4. 什么算法无论输入长度如何都输出 128 位的消息摘要？\nA. `SHA`\nB. `MD5`\nC. `RC4`\nD. `RC6`\n\n5. 什么算法根据变长长度输入输出\
  \ 160 位的密钥？\nA. `SHA`\nB. `MD5`\nC. `RC4`\nD. `RC6`\n\n6. 数字签名过程中使用的是哪种算法？\nA. `RC4`\n\
  B. `RC5`\nC. `Blowfish`\nD. `MD5`\n\n7. 什么是加密学？\nA. 计算机科学研究\nB. 数学研究\nC. 加密研究\n\
  D. 加密算法的创建\n\n8. 在加密密钥中更改某些字符顺序的过程是什么？\nA. `Transposition`（置换）\nB. `Subtraction`（减法）\n\
  C. `Substitution`（替换）\nD. `Transrelation`（转换关系）\n\n\n\n\n\n# 定义安全评估\n\n渗透测试人员对组织的整体安全态势进行评估，以揭示真实攻击者破坏网络或应用程序时可能导致的后果。安全评估可以分为安全审计、漏洞评估或渗透测试。每种安全评估都根据评估范围要求执行评估的人员具备不同的技能。\n\
  \n安全审计和漏洞评估通过使用专用工具对 IP 网络和主机进行扫描，以寻找已知的安全漏洞。这些工具用于定位活动系统、列举用户并识别操作系统和应用程序，旨在寻找常见的安全配置错误和漏洞。\n\
  \n漏洞评估或安全评估仅识别潜在的漏洞，而渗透测试则尝试获取网络访问。安全评估的一个例子是观察一扇门并思考如果这扇门没锁，是否允许有人获得未经授权的访问；而渗透测试则是尝试打开这扇门看看它通向哪里。渗透测试通常能更好地反映网络或系统的弱性，但它更具侵入性，因此更有可能对网络服务造成干扰。\n\
  \n### 渗透测试\n\n安全评估有两种类型：外部评估和内部评估。外部评估测试并分析公开可用信息，进行网络扫描和枚举，并从网络边界外部（通常通过互联网）运行利用程序。内部评估是在组织内部对网络进行的，测试人员充当具有网络访问权限的员工，或作为对环境一无所知的黑客。\n\
  \n黑帽渗透测试通常面临遇到意外问题的较高风险。建议团队制定应急预案，以便有效利用时间和资源。\n\n如果您没有合格或经验丰富的测试人员，或者您被要求执行特定的评估以满足审计要求（例如《健康保险流通与责任法案》`HIPAA`），您可以外包渗透测试。\n\
  \n聘用评估的组织必须指定评估范围，包括要测试和不测试的内容。例如，渗透测试可以是仅限于非军事化区（`DMZ`）前 10 个系统的定向测试，也可以是发现尽可能多漏洞的全面评估。在工作范围内，应定义服务水平协议（`SLA`），以确定在发生严重服务中断时将采取的行动。\n\
  \n聘评估团队的其他术语可以规定所需的行为规范、需要遵循的程序以及组织与测试团队之间的交互（或缺乏交互）。\n\n安全评估或渗透测试可以使用若干种工具（通常是免费软件或共享软件）手动进行，尽管测试也可能包含复杂的付费软件。另一种方法是使用更昂贵的自动化工具。使用手动测试评估组织的安全态势有时比仅使用基于标准模板的自动化工具更好的选择。公司可以从分析信息的经验人士专业知识中受益。虽然自动化方法可能更快更简单，但在审计过程中可能会遗漏某些内容。然而，手动方法需要计划、调度和详尽的文档记录。\n\
  \n真正的“黑客行为”与渗透测试唯一的区别在于许可。执行渗透测试的人员获得执行渗透测试的书面许可是至关重要的。\n\n![realworld.eps](img/realworld_fmt.gif)\n\
  \n# 在渗透测试前确保您已获得许可\n\n大约八年前，我在一家拥有约 500 名用户的组织担任网络管理员。我的老板问我是否会对比该组织的边界网络进行安全评估。我告诉他给我一封邮件，描述他希望从评估中得到的结果，几小时后，我开始疯狂地进行扫描。\n\
  \n在初步审查后，我发现前任管理员在防火墙中设置了几个“允许所有”例外。我们的组织与另一个组织共享连接、数据、服务器和设施，该机构的工作与我们非常相似。一旦我完成审查并修复了许多问题后，我的老板向其他经理汇报了进度，他们决定让我测试另一个组织的边界。我首先要求他们确保我们有进行该项测试的授权。一两天后，我的经理告诉我可以开始测试了。管理层担心有人会攻击另一个组织，并通过我们的专用线路隧道渗透到我们的网络中。\n\
  \n我没有获得执行测试的书面授权副本（即那张非常重要的“免死牌”）。\n\n在扫描期间，我发现一个网络——没有防火墙且大多数服务器未打补丁——运行着 `IIS`\
  \ Web 服务，仅有防病毒软件保护。该网络还运行着 `Oracle` 数据库。\n\n一旦我以 `admin` 身份登录服务器，我就停止了在该机器和网络上的任何操作，因为进一步进行任何操作都没有意义。我写了一份报告提交给了我的经理。\n\
  \n大约一个月后，我们的一名员工在报纸上看到另一个组织“被黑了”。州检察长办公室介入，我和我的经理面临了起诉威胁。最终，我和我的经理什么都没有发生。这个故事的启示：始终随身携带你的免死牌，并确保你有一个签字副本。千万不要听任何人的口。\n\
  \n# 渗透测试步骤\n\n渗透测试包括三个阶段：\n\n* 攻击前阶段 (Preattack phase)\n* 攻击阶段 (Attack phase)\n\
  * 攻击后阶段 (Postattack phase)\n\n攻击前阶段涉及侦察或数据收集。这是渗透测试人员的第一步。从 `Whois`、`DNS` 和网络扫描中收集数据可以帮助你绘制目标网络，并提供有关系统运行的操作系统和应用程序的重要信息。渗透测试涉及定位\
  \ `IP` 段并使用 `Whois` 域名查找查找人员联系信息，以及枚举有关主机的信息。这些信息随后可以用于创建详细的网络拓扑并识别目标。你还应该测试网络过滤设备以寻找合法流量，对代理服务器进行压力测试，并检查防火墙的默认安装，以确保默认用户\
  \ ID、密码和来密码已禁用或更改，且不允许远程登录。\n\n接下来是攻击阶段，在此阶段工具的范围从利用型到响应型不等。它们被专业黑客用于监控和测试系统及安全性。这些活动包括但不限于以下内容：\n\
  \n### 渗透边界\n此活动包括查看错误报告、通过伪造包伪造响应来检查访问控制列表，以及使用 `SSH`、`FTP` 和 `telnet` 等各种协议评估协议过滤规则。测试人员还应该测试缓冲区溢出、`SQL`\
  \ 注入、输入验证漏洞、输出清理以及 `DoS` 攻击。除了执行软件测试外，您应该分配时间测试内部 Web 应用程序和无线配置，因为内部威胁是今天最大的安全威胁。\n\
  \n\n\n\n\n# 获取目标\n这组活动比漏洞扫描或审计更具侵入性且更具挑战性。你可以使用如 `CORE IMPACT` 这样的自动化利用工具，或尝试通过社会工程获取的合法信息访问系统。此活动还包括测试安全策略的执行情况，或使用密码破解和权限提升工具来获取对受保护资源的访问权限。\n\
  \n### 权限提升\n一旦获取了用户账户，测试人员就可以尝试赋予该用户账户网络上系统的更多权限或权利。许多黑客工具能够利用系统中的漏洞并创建一个具有管理员权限的新用户账户。\n\
  \n## 执行、植入与撤回\n这是测试的最后阶段。你的黑客技能体现在不中断业务流程的情况下，对系统或网络进行权限提升。留下痕迹可以显示你在何处获得了对受保护资源的更大访问权限。许多公司不希望你留下痕迹或执行任意代码，此类限制在开始测试之前就会识别并达成一致。\n\
  \n攻击后阶段涉及将系统恢复到测试前的正常配置，这包括删除文件、清理因创建漏洞而产生的 `Registry` 表项，以及移除共享和连接。\n\n最后，你分析所有结果并创建两份安全评估报告，一份留存，另一份给管理层。这些报告包含了你的目标、观察结果、所采取的所有活动以及测试活动的结果，并可能对漏洞提出修复建议。\n\
  \n练习 15-1 显示了一个全面的渗透测试框架。\n\n## 练习 15-1：查看渗透测试工具框架\n\n1. 打开网页浏览器访问 [www.vulnerabilityassessment.co.uk](http://www.vulnerabilityassessment.co.uk)。\n\
  \n![g1501.tif](img/g1501_fmt.jpg)\n\n2. 点击顶部附近的 `Pen Test Framework` 链接。\n\n3. 展开\
  \ `Network Footprinting` 部分并查看子标题。\n\n![g1502.tif](img/g1502_fmt.jpg)\n\n4. 继续向下查看主标题，展开渗透测试框架的每个子标题。你可以使用此列表来定位渗透测试过程中每一步所需的所有工具。\n\
  \n## 渗透测试法律框架\n渗透测试人员必须意识到黑客攻击攻击的法律后果，即使是以伦理方式进行的。我们在第 1 章中探讨了适用于黑客的法律。伦理黑客在执行渗透测试时必须与客户签署的文件列如下：\n\
  \n* 工作范围，用于确定要测试的内容\n* 非保密协议，以防测试人员看到机密信息\n* 责任免 true，免除伦理黑客因渗透测试引起的任何行为或服务中断的责任\n\
  \n## 自动化渗透测试工具\n2006 年对黑客邮件列表进行的一项调查创建了一份漏洞扫描工具前 10 名列表；有 3000 多人参与了调查。创建该列表的 Fyodor\
  \ ([`insecure.org/fyodor/`](http://insecure.org/fyodor/)) 表示：“任何安全领域的人员都应该查看此列表并研究他们不熟悉的工具。”以下工具应被视为黑客工具箱中的顶级渗透测试工具：\n\
  \n* **Nessus**：这款免费网络漏洞扫描器拥有超过 11,000 个可用插件。`Nessus` 包含了远程和本地安全检查、具有 `GTK` 图形界面的客户端/服务器架构，以及一种用于编写自定义插件或理解现有插件的嵌入脚本语言。\n\
  * **GFI LANguard**：这是一个用于 `Windows` 的商业网络安全扫描器。`GFI LANguard` 扫描 `IP` 网络以检测运行哪些机器。它可以确定主机操作系统、正在运行的应用程序、安装了哪些\
  \ `Windows` 服务包、是否缺少任何安全补丁等。\n* **Retina**：这是来自 `eEye` 的商业漏洞评估扫描器。与 `Nessus`一样，`Retina`\
  \ 会扫描网络上的所有主机并报告发现的任何漏洞。\n* **CORE IMPACT**：`CORE IMPACT` 是一种自动化渗透测试产品，被广泛认为是最强大的可用利用工具（它也非常昂贵）。它拥有大型且定期更新的专业漏洞数据库。在其功能中，它可以利用一台机器，然后通过该机器建立加密隧道以访问并利用其他机器。\n\
  * **ISS Internet Scanner**：这是一种应用层的漏洞评估。`Internet Scanner` 可以识别你网络上超过 1,300 种网络设备，包括桌面电脑、服务器、路由器/交换机、防火墙、安全设备和应用路由器。\n\
  * **X-Scan**：`X-Scan` 是一种通用的支持多线程插件的网络漏洞扫描器。它可以检测服务类型、远程操作系统类型和版本，以及弱的用户名和密码。\n\
  * **SARA**：`Security Auditor’s Research Assistant` (`SARA`) 是一种源自 `System Administrator\
  \ Tool for Analyzing Networks` (`SATAN`) 扫描器的漏洞评估工具。通常每月发布两次。\n* **QualysGuard**：这是一种基于\
  \ Web 的漏洞扫描器。用户可以通过易用的 Web 界面安全地访问 `QualysGuard`。它具有超过 5,000 项漏洞检查以及基于推理的扫描引擎。\n\
  * **SAINT**：`Security Administrator’s Integrated Network Tool` (`SAINT`) 是一种商业漏洞评估工具。\n\
  * **MBSA**：`Microsoft Baseline Security Analyzer` (`MBSA`) 构建在 `Windows Update Agent`\
  \ 和 `Microsoft Update` 基础之上。它确保与其他 `Microsoft` 产品的一致性，平均每周扫描超过 300 万台计算机。\n\n除了此列表外，你应该熟悉以下漏洞利用工具：\n\
  \n* **Metasploit Framework**：这是一个用于开发、测试和使用利用代码的开源软件产品。\n* **Canvas**：`Canvas` 是一种商业漏洞利用工具。它包含\
  \ 150 个漏洞。\n\n## 渗透测试交付物\n渗透测试结束时的交付物是渗透测试报告。报告应包含以下内容：\n\n* 按风险程度排序的发现列表\n* 对发现的分析\n\
  * 对发现的结论或解释\n* 针对发现的修复措施\n* 提供证据的日志文件\n* 组织安全态的执行摘要\n* 测试人员姓名及测试日期\n* 任何正面发现或良好的实施\n\
  \n练习 15-2：查看渗透测试报告框架\n\n1. 打开网页浏览器访问 [www.desktopauditing.com](http://www.desktopauditing.com)。\n\
  \n2. 点击左侧的 `IT Security Audit Report and Findings Template` 链接。\n\n![g1503.tif](img/g1503_fmt.jpg)\n\
  \n3. 直到页面底部并点击 `Download` 链接。\n\n![g1504.tif](img/g1504_fmt.jpg)\n\n4. 使用示例报告作为创建你自己的安全审计报告的模板。\n\
  \n## 总结\n安全审计或渗透测试是运行安全网络环境必不可的一部分。让像 CEH 这样受信任且知识丰富的个人对系统、应用程序和组件进行测试至关重要，以确保组织能够解决所有的安全发现。组织可以利用渗透测试报告作为衡量其实施安全计划成功与的标准，并对数据安全进行改进。\n\
  \n## 考试要点\n* 能够定义安全评估。安全评估是一种使用黑客工具确定组织安全态的测试。\n* 了解渗透测试交付物。渗透测试发现的渗透测试报告应包含改进安全的建议、正面发现和日志文件。\n\
  \n\n\n\n\n# 了解渗透测试的法律要求。渗透测试人员应让签署免责声明、工作范围和保密协议。\n\n# 列出渗透测试步骤。`Preattack`（攻击前）、`attack`（攻击）和`postattack`（攻击后）是渗透测试的三个阶段。\n\
  \n# 了解两种安全评估。安全评估可以在内部或外部进行。\n\n## 复习题\n\n1\\. 渗透测试的目的是什么？\nA. 模拟入侵者获取提升权限所采用的方法\n\
  B. 查看是否可以获取机密网络数据\nC. 测试组织的安全态势以及策略和程序\nD. 获取密码\n\n2\\. 安全评估类别包括以下哪些？（选择所有适用项。）\n\
  A. 白帽评估\nB. 漏洞评估\nC. 渗透测试\nD. 安全审计\nE. 黑帽评估\n\n3\\. 对于能够从安全专业人员经验中获益的组织，哪种测试是最佳选择？\n\
  A. 自动化测试工具\nB. 白帽和黑帽测试\nC. 手动测试\nD. 自动化测试\n\n4\\. 哪种审计类型测试组织的安全实施情况和访问控制？\nA. 防火墙测试\n\
  B. 渗透测试\nC. 资产审计\nD. 系统审计\n\n5\\. 从黑客的角度来看，道德黑客的目标是什么？\nA. 确定组织的安全态势\nB. 发现并渗透无效参数\n\
  C. 发现并盗取可用系统资源\nD. 在网络上留下标记以证明已获得访问\n\n6\\. 渗透测试的第一步是什么？\nA. 通过扫描创建网络地图。\nB. 定位网络的远程访问连接。\n\
  C. 与客户签署工作范围、`NDA` 和免责声明。\nD. 执行物理安全审计以确保物理场所安全。\n\n7\\. 哪些工具不是渗透测试人员工具箱中必不可少的？\n\
  A. 密码破解器\nB. 端口扫描工具\nC. 漏洞扫描工具\nD. Web 测试工具\nE. 数据库评估工具\nF. 以上均为\n\n8\\. 哪些不是攻击前被动侦察阶段预期的结果？（选择所有适用项。）\n\
  A. 目录映射\nB. 竞争情报收集\nC. 资产分类\nD. 获取目标\nE. 产品/服务供应\nF. 执行、植入和撤回\nG. 社会工程学\n\n9\\.\
  \ 一旦获取目标，想要确认漏洞已被利用的公司的下一步是什么？（选择所有适用项。）\nA. 使用能够利用漏洞并留下标记的工具。\nB. 编写报告告知管理层漏洞所在的位置。\n\
  C. 在漏洞系统上提升权限。\nD. 在漏洞系统上执行命令以与网络上的另一个系统通信并留下标记。\n\n10\\. 给管理层的评估报告可能包含以下哪些内容？（选择所有适用项。）\n\
  A. 建议的修复方法或纠正措施。\nB. 负责安全的人员姓名。\nC. 详细的分步骤应对措施。\nD. 渗透测试的发现。\n\n11\\. 什么使得渗透测试与黑客攻击不同？\n\
  A. 使用的工具\nB. 攻击的位置\nC. 所有者的许可\nD. 恶意意图\n\n12\\. 开始渗透测试之前应该签署哪些文件？（选择两个。）\nA. 免责声明\n\
  B. 保密协议\nC. 免受损害协议\nD. 合同协议\n\n13\\. 渗透测试的另一个名称是什么？\nA. 合规审计\nB. 网络审计\nC. 安全审计\n\
  D. 验证审计\n\n14\\. 渗透测试报告的第一部分是什么？\nA. 发现\nB. 修复\nC. 合规性\nD. 执行摘要\n\n15\\. 哪种安全评估的测试方式就像测试人员是该组织内部工作的员工一样？\n\
  A. 内部评估\nB. 黑帽测试\nC. 全知识测试\nD. 组织审计\n\n16\\. 哪种类型的测试遇到意外问题的风险更高？\nA. 白帽测试\nB. 黑帽测试\n\
  C. 灰帽测试\nD. 内部评估\n\n17\\. 外包渗透测试的原因之一是什么\nA. 特定的审计要求\nB. 风险较低\nC. 发现更多\nD. 有效的应对措施\n\
  \n18\\. 渗透测试在哪个阶段进行扫描？\nA. `Preattack` 阶段\nB. 信息收集阶段\nC. `attack` 阶段\nD. 指纹识别阶段\n\
  \n19\\. 渗透测试工作范围中的哪个部分定义了在发生严重服务中断时应采取的行动？\nA. 服务需求\nB. 服务水平协议 (`SLA`)\nC. 最低性能水平\n\
  D. 回滚计划\n\n20\\. 哪种自动化渗透测试工具可以识别网络上的设备，包括桌面、服务器、路由器/交换机、防火墙、安全设备和应用程序路由器？\nA. `ISS\
  \ Internet Scanner`\nB. Core Impact\nC. Retina\nD. Nessus\n\n## 复习题答案\n\n1\\. C.\
  \ 渗透测试旨在测试组织整体的安全态势，并查看其是否根据安全策略做出响应。\n2\\. B, C, D. 安全评估可以由安全审计、漏洞评估或渗透测试组成。\n\
  3\\. C. 手动测试最好，因为专业的安全专业人士可以计划、测试设计并进行详尽的记录以记录测试结果。\n4\\. B. 渗透测试会产生一份关于组织安全态势的发现报告。\n\
  5\\. A. 道德黑客试图确定组织的安全态势。\n6\\. C. 渗透测试的第一步始终应该是让客户签署工作范围、`NDA` 和免责声明。\n7\\. F. 在有效的评估中，必须使用所有这些工具来发现漏洞。\n\
  8\\. D, F. 获取目标以及执行、植入和撤回是主动侦察阶段的一部分。\n9\\. A, D. 获取目标后的下一步是使用能够利用漏洞并留下标记的工具，或在漏洞系统上执行命令与网络上的另一个系统通信并留下标记。\n\
  10\\. A, D. 评估将包含渗透测试的发现，并可能包含修复漏洞的纠正建议。\n11\\. C. 所有者的许可是黑客攻击与渗透测试之间的区别。\n12\\\
  . A, B. 渗透测试人员在开始测试之前应让客户签署免责声明、工作范围和保密协议。\n13\\. C. 安全审计是渗透测试的另一个名称。\n14\\. D.\
  \ 执行摘要应该是渗透测试报告的第一部分。\n15\\. A. 内部评估是在组织内部进行的网络，测试人员作为具有某些访问权限的员工。\n16\\. B. 黑帽渗透测试遇到意外问题的风险更高。建议团队制定应急计划以有效利用时间和资源。\n\
  17\\. A. 如果你没有合格或经验丰富的测试人员，或者需要执行特定的评估以满足审计要求（如 `HIPAA`），可以外包渗透测试。\n18\\. A. 从 `Whois`、`DNS`\
  \ 和网络扫描中收集数据可以帮助你映射目标网络，并在 `Preattack` 阶段提供有关运行中的操作系统和应用程序的重要信息。\n19\\. B. 在工作范围内，应定义服务水平协议\
  \ (`SLA`)，以确定发生严重服务中断时将采取的行动。\n20\\. A. `ISS Internet Scanner` 是一种应用程序漏洞评估。`Internet\
  \ Scanner` 可以识别网络上超过 1300 种网络设备，包括桌面、服务器、路由器/交换机、防火墙、安全设备和应用程序路由器。\n\n## 附录：关于配套光盘\n\
