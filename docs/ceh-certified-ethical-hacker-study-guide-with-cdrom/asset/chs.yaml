  D. 配置防火墙\n\n4. Banner 抓取（Banner grabbing）是什么的例子？\nA. 被动操作系统指纹识别\nB. 主动操作系统指纹识别\n\
  C. 足迹探测（Footprinting）\nD. 应用分析\n\n5. 扫描的三种类型是什么？\nA. 端口、网络和漏洞\nB. 端口、网络和内核\nC. 灰色、黑色和白色\n\
  D. 服务器、网络\n\n6. 仅使用 ICMP 查询扫描的主要问题是什么？\nA. 端口不可用\nB. 协议不可靠\nC. 系统由于防火墙不响应\nD. 服务不存在\n\
  \n7. TCP RST 命令的作用是什么？\nA. 启动连接\nB. 将连接恢复到之前的状态\nC. 完成连接\nD. 重置连接\n\n8. TCP 连接的正确顺序是什么？\n\
  A. SYN-ACK-ACK\nB. SYN-FIN\nC. SYNACK\nD. SYN-PSH-ACK\n\n9. 设置所有标志位的包是哪种扫描？\nA.\
  \ 全开\nB. SYN 扫描\nC. XMAS\nD. TCP 连接\n\n10. 每 5 分钟执行 `nmap` SYN 扫描的正确命令是？\nA. `nmap\
  \ -ss`\nB. `nmap -sS`\nC. `nmap fast`\nD. `namp sneaky`\n\n11. 为了防止黑客使用 SMB 会话攻击，会在防火墙上拦截哪些\
  \ TCP 和 UDP 端口？\nA. 167 和 137\nB. 80 和 23\nC. 139 和 445\nD. 1277 和 1270\n\n12. 攻击者为什么要对端口\
  \ 137 进行扫描？\nA. 定位目标主机上的 FTP 服务\nB. 检查 Windows 系统上的文件和打印共享\nC. 发现网络上的代理服务器\nD. 发现具有\
  \ NetBIOS 空会话系统\n\n13. SNMP 是用于管理网络基础设施设备的协议。SNMP 读写社区名称用于什么？\nA. 查看配置信息\nB. 修改配置信息\n\
  C. 监控设备错误\nD. 控制 SNMP 管理站\n\n14. 为什么网络安全团队担心开启端口 135–139？\nA. SMB 已开启，系统受到空会话影响\n\
  B. SMB 未开启，系统受到空会话影响\nC. Windows RPC 已开启，系统受到 Windows DCOM 远程访问影响\nD. Windows RPC\
  \ 未开启，系统受到 Windows DCOM 远程访问影响\n\n15. 在 CEH 攻击周期中枚举用户之后的步骤是哪个？\nA. 破解密码\nB. 权限提升\n\
  C. 扫描\nD. 掩盖踪迹\n\n16. 什么是枚举？\n\n\n\n\n\n## 复习习题\n\nA. 识别网络上的活动系统\nB. 破解密码\nC. 识别用户和机器名称\n\
  D. 识别路由器和防火墙\n\n17. 用于从 SID 查找用户名的命令行工具是哪个？\nA. `UsertoSID`\nB. `Userenum`\nC. `SID2User`\n\
  D. `GetAcct`\n\n18. 哪种工具可以在 Windows 上执行 DNS 区域传输？\nA. `NSlookup`\nB. `DNSlookup`\n\
  C. `Whois`\nD. `IPconfig`\n\n19. 什么是空会话（null session）？\nA. 使用管理员用户名和密码连接到系统\nB.\
  \ 使用 admin 用户名和密码连接到系统\nC. 使用随机用户名和密码连接到系统\nD. 无用户名密码连接到系统\n\n20. SNMP 枚举的防御措施是什么？\n\
  A. 从设备中删除 SNMP 代理。\nB. 在防火墙上关闭 `135` 和 `139` 端口。\nC. 在防火墙上关闭 `80` 和 `443` 端口。\n\
  D. 在代理设备上启用 SNMP 只读安全。\n\n## 复习习题答案\n\n1. A. `FTP` 使用 `TCP` 端口 `21`。这是一个已知端口号，可以在\
  \ Windows 服务文件中找到。\n2. A. `HTTPS` 使用 `TCP` 端口 `443`。这是一个已知端口号，可以在 Windows 服务文件中找到。\n\
  3. B. 拨号入侵（War dialing）涉及拨打一系列号码，希望调制解调器能接听。它可以用于测试远程访问系统的安全性。\n4. A. 标志抓取（Banner\
  \ grabbing）是不可检测的；因此它被视为被动操作系统指纹识别。\n5. A. 端口、网络和漏洞是扫描的三类型。\n6. C. 系统可能不响应 `ICMP`，因为它们安装了拦截响应的防火墙软件。\n\
  7. D. `TCP-RST` 命令重置 `TCP` 连接。\n8. A. `SYN` 数据包之后是 `SYN-ACK` 数据包。然后，通过 `ACK` 完成成功的\
  \ `TCP` 连接。\n9. C. `XMAS` 扫描设置了所有标志位。\n10. B. 命令 `nmap -sS -paranoid` 每 300 秒（即\
  \ 5 分钟）执行一次 `SYN` 扫描。\n11. C. 封禁 `NetBIOS` 空会话使用的端口。这些是 `139` 和 `445`。\n12. D. 端口\
  \ `137` 用于 `NetBIOS` 空会话。\n13. B. `SNMP` 读写社区名称是用于更改设备配置的密码。\n14. A. `135` 到 `139`\
  \ 范围内的端口表示系统正在运行 `SMB` 服务，并且易受到空会话攻击。\n15. A. 密码破解是枚举用户后 CEH 攻击循环的下一步。\n16. C. 枚举（Enumeration）是在查找网络上的用户名、机器名称、网络共享和服务的的过程。\n\
  17. C. `SID2User` 是用于从 `SID` 查找用户名的命令行工具。\n18. A. `NSlookup` 是 Windows 工具，可启动 `DNS`\
  \ 区域传输，将所有 `DNS` 记录发送到黑客系统。\n19. D. 空会话涉及在没有用户名和密码的情况下连接到系统。\n20. A. `SNMP` 枚举的最佳防御措施是从设备上删除\
  \ `SNMP` 代理。这样做可以防止其响应 `SNMP` 请求。\n\n# 第 4 章：系统攻击：密码破解、权限提升和文件隐藏\n\n### 本章涵盖的 CEH\
  \ 考试目标\n* 理解密码破解的技术\n* 理解不同类型的密码\n* 识别各种密码破解工具\n* 理解权限提升\n* 理解键盘记录器和其他间谍软件技术\n*\
  \ 理解如何隐藏文件\n* 理解根基工具（rootkits）\n* 理解隐身术技术\n* 理解如何掩盖踪迹并删除证据\n\n在本章中，我们将研究系统攻击的各个方面。正如你在第\
  \ 3 章回顾的“收集网络和主机信息：扫描与枚举”，系统攻击循环由六步组成。第一步——枚举在上一章中讨论过。本章涵盖了剩下的五个步骤：\n* 破解密码\n* 权限提升\n\
  * 执行应用程序\n* 隐藏文件\n* 掩盖踪迹\n\n### 获取密码的最简单方法\n许多攻击尝试始于获取目标系统的密码。密码是访问系统所需的关键信息，而用户通常会选择容易猜的密码。许多人重复使用密码或选择一个简单的密码（例如宠物的名字）来帮助他们记忆。由于这种人为因素，如果已知目标的一些信息，大多数密码猜解都是成功的。信息收集和侦察可以帮助提供有助于黑客猜测用户密码的信息。\n\
  \n一旦猜出或破解了密码，它就可以成为权限提升、执行应用程序、隐藏文件和掩盖踪迹的起点。如果猜密码失败，则可以手动或使用字典、暴力破解等自动化工具破解密码，这些方法将在本章稍后介绍。\n\
  \n### 密码类型\n使用多种类型的密码来提供系统访问。组成密码的字符可以属于以下任何一类：\n* 仅字母\n* 仅数字\n* 仅特殊字符\n* 字母和数字\n\
  * 仅字母和特殊字符\n* 仅数字和特殊字符\n* 字母、数字和特殊字符\n\n强密码较不容易受到攻击。创建密码时应应用 EC-Council 提出的以下规则以保护免受以下攻击：\n\
  * 不得包含用户帐户名的任何部分\n* 长度至少为八个字符\n* 必须包含来自以下至少三个类的字符：\n    * 非字母数字符号 `$@#`\n    * 数字\n\
  \    * 大写字母\n    * 小写字母\n\n黑客可能使用不同类型的攻击来识别密码并获得对系统的进一步访问权限。密码攻击的类型如下：\n网络交换的在线窃听。被动在线攻击包括嗅探、中间人攻击和重放攻击。\n\
  在线猜解管理员密码。主动在线攻击包括自动密码破解。\n离线字典攻击、混合攻击和暴力破解。\n电子窥视、键盘嗅探和社交工程学。\n\n我们将在接下来的章节中详细查看这些每种攻击。\n\
  \n### 被动在线攻击\n被动在线攻击也称为在有线或无线网络上嗅探密码。被动攻击对终端用户是不可检测的。密码在验证过程中被捕获，然后可以与字典文件或单词列表进行比较。用户帐户密码在网络传输时通常会哈希或加密，以防止未经的访问和使用。如果密码受加密或哈希保护，可以使用黑客工具箱中的特殊工具来破解算法。\n\
  \n破解密码哈希将在本章稍后的“攻击”部分中讨论。\n\n另一种被动在线攻击被称为中间人攻击（MITM）。在中间人攻击中，黑客拦截验证请求并将其转发到服务器。通过在客户端和服务器之间插入嗅探器，黑客能够嗅探两个连接并在过程中捕获密码。\n\
  \n重放攻击也是被动在线攻击；它发生在黑客在通往验证服务器的途中拦截密码，然后捕获并重新发送验证包以进行后续验证。通过这种方式，黑客不需要破解密码或通过中间人攻击学习密码，而是捕获密码并在以后重用密码-验证包以以客户端身份进行验证。\n\
  \n### 主动在线攻击\n\n\n\n\n\n获取系统管理员权限最简单的方法是假设管理员使用了简单的密码，并对其进行猜破解。密码破解是一种主动的在线攻击。它依赖于创建密码时的人为因素，并且仅对弱密码有效。\n\
  \n在第 3 章中，当我们讨论系统黑客攻击的枚举阶段时，你学习了 `NetBIOS` 枚举和空会话（null sessions）的脆弱性。假设 `NetBIOS`\
  \ TCP `139` 端口已打开，破解 Windows NT 或 Windows 2000 系统最有效的方法是密码破解。这是通过尝试连接到枚举的共享（`IPC$`\
  \ 或 `C$`）并尝试用户名和密码组合的。常用的 `Administrator` 账户和密码组合是 `Admin`、`Administrator`、`Sysadmin`\
  \ 或 `Password` 等单词，或者是空密码。\n\n黑客可能会首先尝试连接到默认的 `Admin$`、`C$` 或 `C:\\Windows` 共享。例如，要连接到隐藏的\
  \ `C:` 器共享，请在运行框（开始 ➪运行）中输入以下命令：\n\n```\n\\\\ip_address\\c$\n```\n\n自动化程序可以快速生成字典文件、单词列表，或者字母、数字和特殊字符的所有可能组合，然后尝试使用这些凭据登录。大多数系统通过在账户锁定之前对系统设置最大登录尝试次数来防止此类攻击。\n\
  \n在接下来的章节中，我们将更深入地讨论黑客如何执行自动化密码破解，以及针对此类攻击的防御措施。\n\n## 执行自动化密码破解\n\n为了加快破解破解，黑客使用自动化工具。自动化密码破解的一种简单方法是使用基于标准\
  \ `NET USE` 语法的 Windows Shell 命令。创建一个简单的自动化密码破解脚本，请执行以下步骤：\n\n1. 使用 Windows 记本文创建一个简单的用户名和密码文件。可以使用\
  \ `Dictionary Generator` 等自动化工具创建此单词列表。将文件保存在 `C:` 盘上命名为 `credentials.txt`。\n\n\
  2. 使用 `FOR` 命令管道化此文件：\n\n```\nC:\\> FOR /F\"token=1, 2*\" %i in (credentials.txt)\n\
  ```\n\n3. 输入 `net use \\\\targetIP\\IPC$ %i /u: %j` 使用 `credentials.txt` 文件尝试登录目标系统的隐藏共享。\n\
  \n![note.eps](img/note_fmt.gif)\n\n攻击者使用 `FOR` 命令的另一个示例是使用命令语法 `((i=0; i<11; i++));\
  \ do dd if=/dev/random of=/dev/hda && dd if=/dev/zero of=dev/hda done` 用零擦除硬盘内容。该擦除命令还可以使用命令\
  \ `$ wipe -fik /dev/hda1` 执行硬盘上数据的擦除。\n\n## 防御密码破解\n\n防御密码破解和密码攻击有两种方案。智能卡和生物识别都为用户自行创建密码时固有的不安全性增加了一层安全保障。\n\
  \n用户还可以使用生物识别进行身份验证和确认。生物识别使用指纹、手部几何扫描和视网膜扫描等物理特征作为凭据来验证用户。\n\n智能卡和生物识别都使用双因素认证，在验证用户时需要两种形式的标识（例如实际智能卡和密码）。通过要求用户物理拥有的（在本例中为智能卡）和用户知道的（他们的密码），增加了安全性，且认证过程不会受到密码攻击。\n\
  \n![note.eps](img/note_fmt.gif)\n\n`RSA Secure ID` 是一种利用令牌和密码的双因素认证系统。\n\n## 离线攻击\n\
  \n离线攻击在密码所在或使用的实际计算机以外的位置执行。离线攻击通常需要物理接触计算机并将密码文件从系统复制到可移动介质上。黑客随后将文件带到另一台计算机上进行破解。存在多种类型的离线密码攻击，如\
  \ 表 4-1 所示。\n\n表 4-1: 离线攻击\n\n| 攻击类型 | 特点 | 示例密码 |\n| --- | --- | --- |\n| 字典攻击\
  \ | 尝试使用字典单词列表中的密码 | Administrator |\n| 混合攻击 | 用数字或符号替换密码中的字符 | Adm1n1strator |\n\
  | 暴力破解 | 尝试字母、数字和特殊字符的所有可能组合 | Ms!tr245@F5a |\n\n字典攻击是最简单、最快的攻击类型。它用于识别字典中可以找到实际单词作为密码。通常情况下，攻击使用包含可能单词的字典文件，并使用身份验证过程中相同的算法对其进行哈希处理。然后，将哈希后的字典单词与用户登录时或服务器文件中存储的密码进行比较。只有当密码是实际字典单词时，字典攻击才有效；因此，这种攻击具有某些局限性。无法用于包含数字或其他符号的强密码。\n\
  \n如果无法通过字典攻击找到密码，混合攻击是黑客尝试的下一级攻击。混合攻击从字典文件开始，用数字和符号替换密码中的字符。例如，许多用户会在密码末尾添加数字 `1`\
  \ 以满足强密码的要求。混合攻击旨在发现密码中的此类异常。\n\n最耗时的攻击类型是暴力破解攻击，它尝试大写和小字母、数字和符号的所有可能组合。由于组合极多，暴力破解是三种攻击中最慢的。然而，暴力破解是有效的；只要有足够的时间处理能力，所有密码最终都能识别。\n\
  \n![note.eps](img/note_fmt.gif)\n\n彩虹表是已经哈希处理过的单词列表。彩虹表通过预计算常用字符串的哈希来加速密码的发现和破解。例如，彩虹表可以包含从\
  \ `a` 到 `z` 或 `A` 到 `Z` 的字符。本质上，彩虹表工具是哈希破解器。传统的暴力破解器按顺序尝试所有明文密码。现在可以用这种方法破解复杂的密码。彩虹表的思想是提前完成所有破解时的计算。\n\
  \n## 非电子攻击\n\n非电子攻击（或非技术攻击）是不采用任何技术知识的攻击。这种攻击可以包括社交工程学、窥视、键盘监听和翻垃圾桶。\n\n社交工程学是与人面对面或通过电话互动的艺术，让他们泄露密码等价值信息。社交工程学利用了人的本性和帮助他人的愿望。许多，帮助台是社交工程攻击的目标，因为他们的工作是帮助他人——恢复或重置密码是帮助台的常见功能。防御社交工程攻击的最佳方法是对所有员工进行安全意识培训并建立重置密码的安全程序。\n\
  \n社交工程学在第 2 章“收集目标信息：侦察、足迹扫描与社交工程学”中有更详细的讨论。\n\n\n\n\n\n# 窥视攻击\n\n窥视攻击（Shoulder\
  \ surfing）是指在他人输入密码时从其背后窥视。当黑客距离用户和系统很近时，这种方法非常有效。使用某些从特定角度难以看清电脑屏幕的特殊屏幕保护可以减少窥视攻击。此外，提高员工意识并进行培训几乎可以完全消除这类攻击。\n\
  \n![realworld.eps](img/realworld_fmt.gif)\n\n## 窥视攻击\n\nSue 是一家繁忙诊所的接待员。当她正在电脑前工作时，一位花送货员进了办公室。他告诉\
  \ Sue 他有一束花要送给史密斯医生。这是他在进入候诊室时在办公室正门上看到的医生名字。\n\nSue 那天很忙，史密斯医生正在给病人看诊，因此她告诉花送货员可以把花放在桌子上，她会确保医生收到。送货员说他需要等待，并将花直接交给送货单上列出的人员。于是，Sue\
  \ 请他在候诊室等，直到史密斯医生有空收花。当 Sue 回头回到电脑完成她已经开始写的一封邮件时，她正想着眼前的工作而分心。她快速输入了解锁其 Windows\
  \ 工作站的密码。花送货员在转身去候诊室坐下之前停顿了一小会儿。在他停顿期间，他看到了 Sue 输入的解锁屏幕的五位密码。通过这种方式，他辨别出了她的密码并继续了黑客攻击。该密码是通过窥视攻击收集的，这是一种社会工程手段。\n\
  \n翻找垃圾桶（Dumpster diving）的黑客会从垃圾中寻找信息，例如密码，这些密码可能写在纸条上。同样，关于粉碎重要文档的安全意识培训，可以防止黑客通过翻找垃圾桶来收集密码。\n\
  \n## 破解密码\n\n手动破解密码涉及尝试使用不同的密码登录。黑客遵循以下步骤操作：\n\n1. 找到一个有效的用户账户（例如 `Administrator`\
  \ 或 `Guest`）。\n2. 创建一个可能密码的列表。\n3. 按概率从高到低对密码进行排序。\n4. 输入每个密码。\n5. 重复尝试，直到找到正确的密码为止。\n\
  \n黑客也可以创建一个脚本文件来尝试列表中的每个密码。这仍然被视为手动破解，但非常耗时且通常无效。\n\n破解密码的更有效的方法是获取对系统上密码文件的访问权限。大多数系统会对密码进行哈希处理（单向加密）以便存储在系统中。在登录过程中，用户输入的密码将使用相同的算法进行哈希处理，然后与文件中存储的哈希密码进行比较。黑客可以尝试获取存储在服务器上的哈希算法的访问权限，而不是尝试猜测或识别密码。如果黑客成功，他们就可以解密存储在服务器上的密码。\n\
  \n![note.eps](img/note_fmt.gif)\n\n密码存储在 Windows 系统的安全账户管理器（`SAM`）文件中，存储在 Linux\
  \ 系统的密码影子文件（shadow file）中。\n\n## 黑客工具\n\n`Legion` 自动化 NetBIOS 会话中的密码猜测。`Legion`\
  \ 扫描多个 IP 地址范围以查找 Windows 共享，并提供了一个手动字典攻击工具。\n\n`NTInfoScan` 是一个针对 `NT 4.0` 的安全扫描器。该漏洞扫描器会生成一份关于目标系统上发现的安全问题和其他信息的\
  \ HTML 格式报告。\n\n`L0phtCrack` 是由 @stake 软件分发的密码审核和恢复包，该软件现由赛门铁（Symantec）所有。它在本地网段执行服务器消息块（`SMB`）包捕获并记录单个登录会话。`L0phtCrack`\
  \ 包含字典、暴力和混合攻击能力。赛门铁近期停止了 `L0phtCrack` 工具的，但可以在网上找到。\n\n`LC5` 是另一个良好的密码破解工具。`LC5`\
  \ 是 `L0phtCrack` 的合适替代品。\n\n`John the Ripper` 是一个设计用于破解 Unix 和 NT 密码的命令行工具。破解出的密码不区分大小写，可能无法真实的混合大小写密码。\n\
  \n`KerbCrack` 由两个程序组成：`kerbsniff` 和 `kerbcrack`。嗅探器监听网络并捕获 Windows 2000/XP 的 Kerberos\
  \ 登录。破解器可以使用暴力破解或字典攻击从捕获文件中找到密码。\n\n## 理解 LAN Manager 哈希\n\nWindows 2000 使用 NT LAN\
  \ Manager (`NTLM`) 哈希处理来确保网络中传输过程中的密码的安全。根据密码的不同，`NTLM` 哈希可能很弱且容易破解。例如，假设密码是 `123456abcdef`。当此密码用\
  \ `NTLM` 算法加密时，它首先被转换为全大写：`123456ABCDEF`。密码用空字符（空白）填充以使其长度达到 14 个字符：`123456ABCDEF__`。在密码加密之前，这\
  \ 14 位字符串被一分为两半：`123456A` 和 `BCDEF__`。每个字符串分别加密，然后将结果合并：\n\n`123456A = 6BF11E04AFAB197F`\n\
  `BCDEF__ = F1E9FFDCC75575B15`\n\n哈希值为 `6BF11E04AFAB197FF1E9FFDCC75575B15`。\n\n![note.eps](img/note_fmt.gif)\n\
  \n密码的第一部分包含字母和数字，`L0phtCrack` 破解需要 24 小时。后半部分只包含字母符号，只需要 60 秒即可破解。如果密码少于七位，哈希的后半部分始终为\
  \ `AAD3B43B5`。\n\n## 破解 Windows 2000 密码\n\nWindows 中的 `SAM` 文件包含用户名和哈密码。它位于 `system32\\\
  config` 目录下。运行时文件是被锁定的，因此黑客无法尝试复制。\n\n复制文件的一种方法是启动到 DOS 或 Linux 等替代系统。或者，也可以从恢复目录复制文件。如果系统管理员使用\
  \ Windows 的 `RDISK` 功能备份系统，则会在该目录下创建一个名为 `SAM._` 的压缩副本。要扩展此文件，在命令行提示符中使用以下命令：\n\n\
  ```\nC:\\>expand sam._\n```\n\n解压缩后，可以使用 `L0phtCrack` 等工具对 `SAM` 文件运行字典、混合或暴力攻击。与\
  \ `Lphtcrack` 类似的工具是 `Ophcrack`。\n\n### 练习 4-1：使用 Ophcrack 破解密码\n\n1. 从 [`ophcrack.sourceforge.net/`](http://ophcrack.sourceforge.net/)\
  \ 下载并安装 ophcrack。\n2. 运行 ophcrack 程序并在 `Preferences` 选项卡下将线程数设置为运行 ophcrack 的计算机的核心数加一。如果你更改了此值，必须退出并重启\
  \ ophcrack 以保存更改。\n\n注意：此步骤可选，但它可以加快破解过程。\n\n3. 点击 `Load` 按钮添加哈希。有多种添加哈希的方法：\n*\
  \ 手动输入哈希（单个哈希选项）\n\n\n\n\n\n*   导入包含使用 `pwdump`、`fgdump` 或类似的第三方工具创建的哈希文本文件（`PWDUMP\
  \ File` 选项）\n*   从 `SYSTEM` 和 `SAM` 文件中提取哈希（`Encrypted SAM` 选项）\n*   从 ophcrack\
  \ 运行的计算机转储 `SAM`（`Local SAM` 选项）\n*   从远程计算机转储 `SAM`（`Remote SAM` 选项）\n\n注意：对于 `Encrypted\
  \ SAM` 选项，`SAM` 位于 Windows 的 `system32/config` 目录下，只能在未运行的 Windows 分区上进行访问。对于 `Local\
  \ SAM` 和 `Remote SAM` 选项，你必须以管理员权限登录想要转储 `SAM` 的计算机。\n\n4. 点击 `Tables` 按钮。\n5. 点击\
  \ `enable`（绿色和黄色）按钮。\n6. 使用向上和向下方向键对你将使用的彩虹表进行排序。请记住，将彩虹表存储在硬盘等快速介质上将显著加快破解过程。\n\
  7. 点击 `Crack` 按钮开始破解过程。你将在 ophcrack 窗口底部的框中看到破解进度。发现密码时，它将显示在 `NT Pwd` 字段中。你可以随时点击\
  \ `Save` 按钮保存破解会话的结果。\n\n## 将 SMB 登录重定向到攻击者\n\n在网络上发现密码的另一种方法是将服务器消息块（`SMB`）登录重定向到攻击者的计算机，这样密码就会发送给黑客。为了实现这一点，黑客必须嗅探来自服务器的\
  \ `NTLM` 响应，并欺骗受害者尝试使用攻击者的计算机进行 Windows 验证。一种常用技术是向受害者发送一封带有伪造 `SMB` 服务器链接的电子邮件。当点击链接时，用户会在不经意的情况下通过网络发送他们的凭据。\n\
  \n*   `SMBRelay`：从入站 `SMB` 流量中捕获用户名和密码哈希的 `SMB` 服务器。`SMBRelay` 还可以执行中间人（MITM）攻击。\n\
  *   `SMBRelay2`：与 `SMBRelay` ，但使用 `NetBIOS` 名称而不是 IP 地址来捕获用户名和密码。\n*   `pwdump2`：从\
  \ Windows 系统的 `SAM` 文件中提取密码哈希的程序。提取出的密码哈希随后可以通过 `L0phtCrack` 来破解密码。\n*   `Samdump`：另一个从\
  \ `SAM` 文件中提取 `NTLM` 哈希密码的程序。\n*   `C2MYAZZ`：一种让 Windows 客户端以明文发送密码的间谍程序。当用户连接服务器资源时，它会显示用户名及其密码。\n\
  \n## SMB 中继中间人攻击与防御措施\n\nSMB 中继 `MITM` 攻击是指攻击者设置带有中继地址的伪造服务器。当受害者客户端连接到伪造服务器时，`MITM`\
  \ 服务器拦截调用、对密码进行哈希处理，并将连接传递给受害者服务器。图 4-1 插释了这样的攻击。\n\n图 4-1: SMB 中继中间人攻击\n\n![f0401.eps](img/f0401_fmt.gif)\n\
  \nSMB 中继防御措施包括配置 Windows 2000 使用 `SMB` 签名，这会导致它对每个 `SMB` 通信块进行加密。\n\n## 破解工具\n\n\
  *   `SMBGrind` 通过删除重复并提供一种针对特定用户而无需手动编辑转储文件的方法，增加了嗅探转储上 `L0phtCrack` 会话的速度。\n* \
  \  `SMBDie` 工具通过发送特殊制的 `SMB` 请求使运行 Windows 2000、XP 或 NT 的计算机崩溃。\n*   `NBTdeputy`\
  \ 可以在网络上注册 `NetBIOS` 计算机名称并响应基于 TCP/IP 的 NetBIOS (`NetBT`) 名称查询请求。它简化了 `SMBRelay`\
  \ 的使用。可以使用计算机名称而不是 IP 地址引用中继。\n\n### NetBIOS DoS 攻击\n\n`NetBIOS` 拒绝服务 (`DoS`) 攻击向目标\
  \ Windows 系统上的 `NetBIOS` 名称服务发送 `NetBIOS` 名称释放消息，强制系统发生名称冲突，导致该名称无法再次使用。这本质上阻止了客户端参与\
  \ `NetBIOS` 网络，并为该系统创建了网络 `DoS`。\n\n## 破解工具\n\n`NBName` 可以禁用整个局域网并防止机器重新加入。受该工具感染的\
  \ `NetBIOS` 网络上的节点会认为它们的名称已被其他机器占用。\n\n创建更安全且易记密码的另一种方法是遵循可重复的模式，这将能够在需要时重新创建密码。\n\
  \n1. 从一个好的短语开始，例如：`Maryhadalittlelamb`\n2. 将每隔字符更改为大写，得到 `MaRyHaDaLiTtLeLaMb`\n\
  3. 将 `a` 更改为 `@` 并将 `i` 更改为 `1`，得到 `M@RyH@D@L1TtLeL@Mb`\n4. 丢弃每隔一对，得到一个安全的可重复密码\
  \ `M@H@L1LeMb`。\n\n现在，你有了一个符合所有要求的密码，但在必要时可以被“重新制作”。\n\n## 密码破解防御措施\n\n应该实施尽可能强的密码以防止密码破解。系统应强制执行\
  \ 8–12 位字母数字密码。相同密码的使用时长将在下一节中讨论。\n\n为了防止存储在服务器上的密码哈希算法被破解，你必须小心对服务器进行物理隔离和保护。系统管理员可以使用\
  \ Windows 中的 `SYSKEY` 实用程序保护存储在服务器硬盘上的哈希。还应该监控服务器日志以发现针对用户账户的暴力破解攻击。\n\n系统管理员可以实施以下安全措施来降低暴力破解的效果：\n\
  *   永远不要留下默认密码。\n*   永远不要使用字典中可以找到密码。\n*   永远不要使用与主机名、域名或通过 Whois 可以的任何内容相关的密码。\n\
  *   永远不要使用与爱好、宠物、亲属或生日相关的密码。\n*   作为最后手段，使用字典中超过 21 个字符的单词作为密码。\n\n![note.eps](img/note_fmt.gif)\n\
  \n该主题将在本章后的“监控事件日志”部分进一步讨论。\n\n在接下来的章节中，我们将考虑采取的两种措施来加强密码并防止破解。\n\n### 密码更改间隔\n\n\
  密码应在一段时间后过期，以便强制用户更改。如果密码间隔设置得太低，用户将忘记当前的密码；结果是系统管理员将频繁重置用户的密码。另一方面，如果允许使用密码太久，可能会损害安全性。推荐的密码更改间隔是每\
  \ 30 天。此外，大多数安全专业人员建议不要允许重复最后三个密码。\n\n![note.eps](img/note_fmt.gif)\n\n管理员应该监控事件查看器日志，以识别在发生之前或期间的任何入侵尝试。通常，在发生成功入侵或密码攻击之前，系统日志中会记录多次失败尝试。安全日志的好坏取决于监控它们的系统管理员的水平。\n\
  \n`VisualLast` 等工具可以帮助网络管理员解读和分析安全日志文件。`VisualLast` 为 NT 事件日志提供了更深入的见解，使管理员能够更准确、高效地评估网络活动。该程序旨在允许网络管理员查看并报告用户的登录和注销时间；这些事件可以根据时间范围进行搜索，这对于寻找入侵细节的安全分析师来说是无价的。\n\
  \n\n\n\n\n位于 `c:\\windows\\system32\\config\\Sec.Event.Evt` 的事件日志包含了攻击者破解尝试的轨迹。\n\
  \n# 了解键盘记录器和其他间谍软件技术\n\n如果所有收集密码的尝试都失败了，那么键盘记录器就是黑客的首选工具。键盘记录器（keyloggers）可以通过硬件或软件实现。硬件键盘记录器是连接键盘到电脑的小型硬件设备，并将每次按键记录保存到文件中或硬件设备的内存中。为了安装硬件键盘记录器，黑客必须对系统具有物理访问权限。\n\
  \n软件键盘记录器是位于键盘硬件和操作系统之间的隐身软件，以便它们记录每一次按键。软件键盘记录器可以通过木马或病毒部署在系统上。\n\n![note.eps](img/note_fmt.gif)\n\
  \n将在第 5 章“在目标系统上安装软件：间谍软件、木马、后门、病毒和蠕虫”中讨论使用木马和病毒。\n\n### 攻击工具\n\nSpector 是一种间谍软件，记录系统在互联网上进行的所有操作，就像摄像头一样。Spector\
  \ 每小时自动对计算机屏幕上的任何内容拍摄数百张快照，并将这些快照存在系统硬盘的隐藏位置。可以使用 Anti-spector 检测并删除 Spector。\n\n\
  eBlaster 是一种互联网间谍软件，可以捕获传入和出的电子邮件并立即将其转发到另一个电子邮件地址。eBlaster 还可以捕获即时消息对话双方的内容、执行按键记录并记录访问过的网站。\n\
  \nSpyAnywhere 允许你查看系统活动和用户操作、关机/重启、锁定/冻结，甚至浏览远程文件系统的工具。SpyAnywhere 让你可以控制远程系统上打开的程序和窗口，并查看浏览历史和相关信息。\n\
  \nInvisible KeyLogger Stealth (IKS) Software Logger 是一个高性能虚拟设备驱动程序 (VxD)，静默运行在 Windows\
  \ 95、98 或 ME 操作系统的底层。所有按键都记录在一个二进制按键文件中。\n\nFearless Key Logger 是一种木马，它留在内存中以捕获所有用户按键。捕获的按键存储在日志文件中，可供黑客检索。\n\
  \nE-mail Keylogger 记录在目标系统上发送和接收的所有电子邮件。可以通过发送者、收件者、主题和时间/日期查看电子邮件。邮件内容和任何附件也会被记录。\n\
  \n# 提升权限\n\n权限提升是黑客循环的第三步。权限提升基本上意味着为用户账户增加权利或权限。简单来说，权限提升是将普通用户账户变为管理员账户。\n\n通常，管理员账户具有更严格的密码要求，其密码受到更严密的保护。如果无法找到具有管理员权限的账户用户名和密码，黑客可能会选择使用低权限账户。在这种情况下，黑客必须提升该账户的权限。\n\
  \n这是通过首先使用非管理员用户账户获取访问（通常通过之前讨论过的方法之一收集用户名和密码），然后将账户权限提升到管理员级别来实现。\n\n### 攻击工具\n\
  \n`GetAdmin.exe` 是一个将用户添加到本地管理员组的小程序。它使用低级 NT 内核。`Hk.exe` 是一个利用 Windows 漏洞的工具。`GetAdmin.exe`\
  \ 是一个将用户添加到本地管理员组的程序。`Hk.exe` 是一个利用 Windows 漏洞的工具。\n\n一旦黑客获得了管理员权限，我们在后续章节来看看他们可以做什么。\n\
  \n## 执行应用程序\n\n一旦黑客获得了管理员权限，他们做的下一件事就是执行应用程序。\n\n### 攻击工具\n\n`PsExec` 是一个连接到远程系统并执行其文件的程序。`Remoxec`\
  \ 是一个执行程序的程序。\n\n### 缓冲区溢出\n\n缓冲区溢出是利用应用程序代码漏洞的黑客尝试。本质上，缓冲区溢出攻击向应用程序中的字段变量发送过多信息，这会导致应用程序错误。大多数情况下，应用程序不知道该执行什么操作，因为它被溢出数据覆盖了。因此，它会执行溢出数据中的命令，或显示命令提示允许用户输入下一个命令。\n\
  \n![note.eps](img/note_fmt.gif)\n\n缓冲区溢将在第 9 章“攻击应用程序：SQL 注入和缓冲区溢出”中详细讨论。\n\n# 了解根内核\
  \ (Rootkits)\n\n根内核是一类经常用于在受感染的系统上隐藏工具的程序。根内核包括所谓的后门，帮助攻击者随后更方便地访问系统。例如，根内核可以隐藏一个应用程序，当攻击者连接到系统上的特定网络端口时产生\
  \ shell。后门还可以允许由非特权用户启动的进程执行通常保留给管理员的函数。根内核经常用于让根内核的程序人员查看并访问需要用户名和登录信息的网站。\n\n\
  根内核有几种类型，包括以下：\n\n### 内核级根内核\n内核级根内核通过添加代码和/将部分内核代码替换为修改后的代码来在计算机系统中隐藏后门。这通常通过设备驱动程序或可加载模块向内核添加新代码来实现，例如\
  \ Linux 中的可加载内核模块或 Windows 中的设备驱动程序。内核级根内核特别危险，因为在没有适当软件的情况下很难检测到它们。\n\n### 库级根内核\n\
  库级根内核通常通过补丁、挂钩（hook）或替换系统调用版本来隐藏可能允许识别黑客身份的信息。\n\n### 应用程序级根内核\n应用程序级根内核可能会将普通的应用程序二进制文件替换为木马化的伪品，或者使用挂钩、补丁、注入代码或其他手段修改现有应用程序的行为。\n\
  \n\n\n\nWindows NT/2000 rootkit 是作为一种内核模式驱动程序构建的，可以在运行时动态加载。该 rootkit 在 NT 内核核心区域以系统权限运行，因此它可以访问操作系统的所有资源。rootkit\
  \ 还可以隐藏进程、隐藏文件、隐藏注册表项、拦截在系统控制台上输入的按键、发出调试中断导致蓝屏死亡（BSOD），以及重定向 EXE 文件。\n\n该 rootkit\
  \ 包含一个名为 `root.sys` 的内核模式设备驱动程序和一个名为 `DEPLOY.EXE` 的启动程序。在获取目标系统的访问后，攻击者将 `root.sys`\
  \ 和 `DEPLOY.EXE` 复制到目标系统并执行 `DEPLOY.EXE`。这样做会安装并启动 rootkit 设备驱动。攻击者稍后会在目标机器上删除 `DEPLOY.EXE`。随后，攻击者可以使用\
  \ `net stop root` 和 `net start root` 命令随时停止和重启 rootkit。一旦 rootkit 启动，`root.sys`\
  \ 文件将不再出现在目录列表中；rootkit 会拦截用于文件列表的系统调用，并从显示中隐藏所有以 `root_` 开头的文件。\n\n## Rootkit 嵌入式\
  \ TCP/IP 栈\n\nWindows NT/2000 rootkit 的新功能是一个无状态 TCP/IP 栈。它通过根据输入数据包中的判断连接状态来工作。rootkit\
  \ 有一个硬编码的 IP 地址 (10.0.0.166)，并对其进行响应。rootkit 使用原始以太网连接到系统的网卡，因此非常强大。目标端口并不重要；黑客可以\
  \ `telnet` 到系统上的任何端口。此外，多个人可以同时登录 rootkit。\n\n## Rootkit 应对措施\n\n所有 rootkit 都需要目标系统的管理员访问权限，因此密码安全至关重要。如果您检测到\
  \ rootkit，应该备份关键数据，并从可信源重新安装操作系统和应用程序。管理员还应该准备好文档齐全的自动化安装程序和可信的恢复介质。\n\n另一种应对措施是使用\
  \ MD5 校验和工具。文件的 MD5 校验和是一个 128 位的值，类似于文件的指纹。（存在极小的概率为两个不同的文件获得完全相同的校验和。）该算法的设计使得文件数据中即使只改变一个位，也会产生不同的校验和值。此功能对于比较文件和确保其完整性非常有用。另一个很好的特性是校验和的固定长度，无论源文件的大小如何。\n\
  \nMD5 校验和可以确保文件没有被更改。如果在系统中发现了 rootkit，这对于检查文件完整性非常有用。诸如 `Tripwire` 等工具通过实现 MD5\
  \ 校验和来识别受 rootkit 影响的文件。\n\n### 应对工具\n\n`Tripwire` 是一个用于 Unix 和 Linux 操作系统的文件系统完整性检查程序。除了代表每个目录和文件内容的一个或多个加密校验和外，`Tripwire`\
  \ 数据库还包含允许您验证访问权限和文件模式设置、文件所有者用户名、文件最后访问日期和时间以及对项目进行的最后修改的信息。\n\n## 隐藏文件\n\n黑客可能想要隐藏系统上的文件以防止被检测。这些文件随后可能被用于对系统发起攻击。在\
  \ Windows 中隐藏文件有两种方法。第一种是使用 `attrib` 命令。要使用 `attrib` 命令隐藏文件，请在命令提示符输入输入：\n\n```\n\
  attrib +h [file/directory]\n```\n\n在 Windows 中隐藏文件的另一种方法是使用 NTFS 备用数据流。Windows NT、2000\
  \ 和 XP 使用的 NTFS 文件系统具有一项名为“备用数据流”的功能，允许数据存储在与正常可见文件相关联的隐藏文件中。流的大小不受限制；一个正常文件可以链接到多个流。\n\
  \n### NTFS 文件流\n\nNTFS 文件流允许在合法文件内部创建一个隐藏文件。隐藏文件不会出现在目录列表中，但合法文件会显示。用户通常不会怀疑该合法文件，但隐藏文件可以用于存储或传输信息。在练习\
  \ 4-2 中，你将学习如何使用 NTFS 文件流来隐藏文件。\n\n### 练习 4-2：使用 NTFS 文件流隐藏文件\n\n注意：此练习仅在使用 NTFS\
  \ 文件系统的系统上有效。\n\n要创建并测试 NTFS 文件流：\n\n1. 在命令行中，输入 `notepad test.txt`。\n2. 在文件中放入一些数据，保存文件并关闭记事本。执行第\
  \ 1 步将打开记事本。\n3. 在命令行中中，输入 `dir test.txt` 并记录文件大小。\n4. 在命令行中，输入 `notepad test.txt:hidden.txt`。在记事本中输入一些文本，保存文件并关闭它。\n\
  5. 再次检查文件大小（它应该与步骤 3 中相同）。\n6. 打开 `test.txt`。你只看到原始数据。\n7. 在命令行中输入 `type test.txt:hidden.txt`。将显示语法错误信息。\n\
  \n### 攻击工具\n\n`makestrm.exe` 是一种将数据从文件移动到链接到原始文件的备用数据流的实用。\n\n### NTFS 流应对措施\n\n\
  要删除流文件，可以将文件复制到 FAT 分区，然后将其复制回 NTFS 分区。当文件移动到 FAT 分区时，流将会丢失，因为它是 NTFS 的功能，因此只存在于\
  \ NTFS 分区上。\n\n### 应对工具\n\n你可以使用 `lns.exe` 检测 NTFS 流。`LNS` 会报告包含数据流的文件的存在和位置。\n\n\
  ## 理解隐写技术\n\n隐写是将数据隐藏其他类型数据（如图像或文本文件）中的过程。隐藏数据最流行的方法是利用图形。攻击者可以使用隐写在图形文件中嵌入任何信息，制作炸弹的指令、秘密账号或测试答案。任何想象的文本都可以隐藏在图像中。在练习\
  \ 4-3 中，你将使用 Image Hide 在图像中隐藏文本。\n\n### 攻击工具\n\n`ImageHide` 是一种在图像中隐藏大量文本的隐写程序。即使添加了字节，图像大小也没有增加。图像在普通图形程序中看起来一样。它可以加载并保存文件，因此能够绕过大多数嗅探器。\n\
  \n`Blindside` 是一种在 BMP 位图中图中隐藏信息的隐写应用程序。它是一个命令行工具。\n\n`MP3Stego` 在 MP3 文件的压缩过程中隐藏信息。数据经过压缩、加密，然后隐藏在\
  \ MP3 位流中。\n\n`Snow` 是一种空白隐写程序，通过在行尾添加空白在 ASCII 文本中隐藏消息。由于文本查看器通常看不到空格和制表符，消息对观察者来说被有效隐藏了。如果使用了内置加密，即使检测到消息也无法读取。\n\
  \n`CameraShy` 适用于 Windows 和 Internet Explorer，允许用户存储在普通 GIF 图像中的审查或敏感信息。\n\n`Stealth`\
  \ 是用于 PGP 文件的过滤工具。它去除头部的标识信息，之后该文件即可用于隐写。\n\n### 练习 4-3：使用 ImageHide 在图像中隐藏数据\n\n\
  使用 ImageHide 在图像中隐藏数据：\n\n1. 下载并安装 `ImageHide` 程序。\n2. 在 `Image Hide` 程序中添加图像。\n\
  3. 在 `ImageHide` 底部的字段中添加文本。\n4. 使用 `ImageHide` 在图像中隐藏文本。\n\n隐写可以被某些程序检测，尽管很难。检测的第一步是定位包含隐藏文本的文件，这可以通过分析图像模式和调色板的变化来实现。\n\
  \n\n\n\n`Stegdetect` 是一种用于检测图像中隐写术内容的自动化工具。它能够检测在 JPEG 图像中隐藏信息的各种隐写术方法。\n\n`Dskprobe`\
  \ 是 Windows 2000 安装光盘上的一个工具。它是一个底层硬盘扫描器，可以检测隐写术。\n\n## 掩盖踪迹和擦除证据\n\n一旦入侵者成功获取了系统的管理员权限，他们就会试图掩盖自己的足迹，以防止其在系统中的存在（无论当前还是过去）被发现。黑客还可能尝试移除其在系统上的身份或活动证据，以防止执法部门追踪其身份或位置。为了防止被检测，黑客通常会擦除任何已记录的错误消息或安全事件。禁用审计和清除事件日志是黑客用来掩盖足迹和规避检测的两种方法。\n\
  \n入侵者在获得管理员权限后做的第一件事就是禁用审计。Windows 审计会将某些事件记录在存储在 Windows 事件查看器中的日志文件中。事件可以包括登录系统、访问应用程序或事件日志。管理员可以选择系统上实施的记录级别。黑客想要确定所实施的记录级别，以查看他们是否需要清除指示其在系统上存在的事件。\n\
  \n## 黑客工具\n\n`Auditpol` 是包含在用于系统管理员的 Windows NT 工具包中的工具。该工具可以从 Windows 命令行禁用或启用审计。它还可以用于确定系统管理员所实施的记录级别。\n\
  \n入侵者可以轻松擦除 Windows 事件查看器中的安全日志。包含一个或极少数事件的事件日志是可疑的，因为这通常意味着其他事件已被清除。在禁用审计后，清除事件日志仍然是必要的，因为使用\
  \ `Auditpol` 工具会在事件日志中留下一个条目，指示审计已被禁用。目前有多种工具可以清除事件日志，或者黑客也可以在 Windows 事件查看器中手动进行操作。\n\
  \n## 黑客工具\n\n`elsave.exe` 实用程序是一个清除事件日志的简单工具。它是基于命令行的。\n\n`WinZapper` 是攻击者可以用来从\
  \ Windows 2000 安全日志中选择性擦除事件记录的工具。`WinZapper` 还能确保在程序运行时不会记录任何安全事件。\n\n`Evidence\
  \ Eliminator` 是一个用于 Windows PC 的数据清理系统。它可以防止不需要的数据在系统中被永久隐藏。它可以清理回收站、 缓存、系统文件、临时文件夹等。`Evidence\
  \ Eliminator` 也可以被黑客用于在攻击后从系统中证据。\n\n## 总结\n\n对目标系统的实际黑入可以分解为简单的步骤。猜测或破解密码、提升权限、隐藏文件和掩盖足迹都是黑客过程的一部分。正是这些步骤通常会为黑客发现最有价值的信息。然而，信息收集和扫描步骤不应被忘记，因为它们对于获取有关目标及其弱点的最多信息至关重要。良好的信息收集可以大大提高黑客步骤的成功和速度。\n\
  \n## 考试要点\n\n- 理解密码安全的重要性。实施密码更改间隔、强字母数字密码以及其他密码安全措施对网络安全至关重要。\n- 了解不同类型的密码攻击。被动在线攻击包括嗅探、中间人攻击和重放攻击。主动在线攻击包括被动和自动化的密码猜测。离线攻击包括字典攻击、混合攻击和暴力破解。非电子攻击包括窥视（肩窥）、键盘嗅探和社会工程学。\n\
  - 理解各种类型的离线密码攻击。字典攻击、混合攻击和暴力破解攻击都是离线密码攻击。\n- 了解防御密码猜测的方法。智能卡和生物识别是增加安全性和防御密码猜测的两种方法。\n\
  - 理解非电子攻击类型之间的区别。社会工程学、窥视和翻垃圾查找都是非电子攻击的类型。\n- 了解攻击者如何消除黑客活动证据。清除事件日志和禁用审计是攻击者用来掩盖足迹的方法。\n\
  - 意识到隐藏文件是泄露敏感信息的手段。隐写术、NTFS 数据流和 `attrib` 命令都是黑客可以隐藏和盗取文件的方法。\n\n## 复习题\n\n1. 在图像中隐藏文本的过程称为什么？\n\
  A. 隐写术 (Steganography)\nB. 加密 (Encryption)\nC. 间谍软件\nD. 键记录\n\n2. 什么是 rootkit？\n\
  A. 用于获取 Windows 系统根权限的简单工具\nB. 一个向 SMB 中继发送信息的木马\nC. 一种影响系统文件（包括内核和库）的侵入性程序\nD.\
  \ 执行缓冲区溢出的工具\n\n3. 为什么黑客想要掩盖自己的足迹？\nA. 防止另一个人使用他们在 目标系统上安装的程序\nB. 防止被检测或发现\nC. 防止黑客尝试\n\
  D. 防止其他黑客使用他们的工具\n\n4. 什么是权限提升？\nA. 创建一个具有更高权限的用户账户\nB. 创建一个具有管理员权限的用户账户\nC. 创建两个用户账户：一个高权限，一个低权限\n\
  D. 增加用户账户的权限\n\n5. 隐藏文件的两种方法是哪两种？（选择所有适用项）\nA. NTFS 文件流\nB. `attrib` 命令\nC. 隐写术\n\
  D. 加密文件系统\n\n6. 推荐的密码更改间隔是多少？\nA. 30 天\nB. 20 天\nC. 1 天\nD. 7 天\n\n7. 针对密码 `T63k#s23A`，哪种类型的密码攻击最成功？\n\
  A. 字典攻击\nB. 混合攻击\nC. 密码猜测\nD. 暴力破解\n\n8. 下列哪种是被动在线攻击？\nA. 密码猜测\nB. 网络嗅探\nC. 暴力破解攻击\n\
  D. 字典攻击\n\n9. 为什么在使用 `auditpol` 命令关闭日志后需要清除事件日志？\nA. `auditpol` 命令会在事件日志中留下一个条目。\n\
  B. `auditpol` 命令在清除日志之前停止。\nC. `auditpol` 依赖事件日志来确定是否正在记录。\nD. 运行命令后不需要清除日志。\n\n\
  10. 在系统中安装硬件键盘记录器需要什么？\nA. 系统的 IP 地址\nB. 管理员用户名和密码\nC. 对系统的物理访问\nD. 对系统的 Telnet\
  \ 访问\n\n11. 获取密码简单的方法是？\nA. 暴力破解\nB. 猜测\nC. 字典攻击\nD. 混合攻击\n\n12. 哪种命令用于掩盖目标系统的足迹？\n\
  A. `elsave`\nB. `coverit`\nC. `legion`\nD. `nmap`\n\n13. Snow 是什么类型的黑客程序？\nA. 密码破解器\n\
  B. 权限提升\nC. 间谍软件\nD. 隐写术\n\n14. 黑客获得系统管理员权限后做的第一件事是什么？\nA. 创建新用户账户\nB. 修改管理员密码\n\
  C. 复制重要数据文件\nD. 禁用审计\n\n15. 下列哪个程序是隐写术检测工具？\nA. `Stegdetect`\nB. `Stegoalert`\n\
  C. `Stegostopper`\nD. `Stegorama`\n\n16. 哪种措施工具会检测 NTFS 流？\nA. Windows 安全管理器\nB.\
  \ LNS\nC. `Auditpol`\nD. RPS\n\n17. 哪个程序用于创建 NTFS 流？\nA. StreamIT\nB. `makestrm.exe`\n\
  C. NLS\nD. Windows 资源管理器\n\n18. 为什么在使用 `auditpol` 命令关闭日志后，清除事件日志很重要？\nA. 会留下一个管理员已登录的条目。\n\
  B. 会留下一个正在进行黑客尝试的条目。\n\n\n\n\nC. 创建一个条目指示审计已禁用。\n\nD. 否则系统将关闭。\n\n### 19. 最危险的 rootkit（根内核）类型是什么？\n\
  \nA. 内核级\nB. 库级\nC. 系统级\nD. 应用级\n\n### 20. 使用 `attrib` 命令隐藏文件的命令是什么？\n\nA. `attrib\
  \ +h [file/directory]`\nB. `attrib +h [file/directory]`\nC. `attrib hide [file/directory]`\n\
  D. `hide [file/directory]`\n\n## 复习题答案\n\n1. A. `Steganography`（隐术）是将文本隐藏在图像中的。\n\
  2. C. `rootkit` 是一种修改操作系统核心（内核 `kernel`）和库的程序。\n3. B. `Hackers`（黑客）掩盖自己的踪迹以防止身份或位置被发现。\n\
  4. D. `Privilege escalation`（权限提升）是一种增加用户账户权限的黑客方法。\n5. A, B. `NTFS` 文件流和 `attrib`\
  \ 命令是用于隐藏文件的两种黑客技术。\n6. A. 为了安全性和易用性的最佳平衡，应该每 30 天更改一次密码。\n7. D. `brute-force attack`（暴力攻击）尝试每种字母、数字和符号的组合。\n\
  8. B. `Network sniffing`（网络嗅探）是一种被动在线攻击，因为它无法被检测。\n9. A. 必须清除 `event log`（事件日志），因为\
  \ `auditpol` 命令会在 `event log` 中创建一个条目，指示日志已禁用。\n10. C. `hardware keylogger`（硬件键盘记录器）是一种将键盘连接到\
  \ `PC` 的适配器。黑客需要物理接触 `PC` 才能插入硬件键盘记录器。\n11. B. 获取密码简单的方法是猜密码。因此创建强密码且不重复使用密码非常重要。\n\
  12. A. `elsave` 是用于清除 `event log` 并掩盖黑客踪迹的命令。\n13. D. `Snow` 是一种 `steganography`\
  \ 程序，用于将数据隐藏在文本文件的空白处。\n14. D. 黑客在获得系统管理级访问后应该做的第一件事是禁用系统审计，以防止检测并尝试掩盖踪迹。\n15. A.\
  \ `Stegdetect` 是一种 `steganography` 检测工具。\n16. B. `LNS` 是一种用于检测 `NTFS` 流的 `NTFS`\
  \ 应对工具。\n17. B. `makestrm.exe` 是用于创建 `NTFS` 流的程序。\n18. C. 在禁用审计后清除 `event log` 非常重要，因为会创建一个指示审计禁用的条目。\n\
  19. A. `kernel-level rootkit`（内核级内核）是最危险的，因为它感染了系统的核心。\n20. B. `attrib +h [file/directory]`\
  \ 是使用 `hide` 属性隐藏文件的命令。\n\n# 第 5 章：木马、后门、病毒和蠕虫\n\n## 本章涵盖的 CEH 考试目标：\n\n* 什么是 `Trojan`（木马）？\n\
  * 显性信道和隐蔽信道是指什么意思？\n* 列出不同类型的 `Trojans`\n* `Trojan` 攻击的迹象是什么？\n* 理解 “Netcat” `Trojan`\
  \ 是如何工作的\n* “wrapping”（封装）是指什么意思？\n* 反向连接 `Trojans` 是如何工作的？\n* 防止 `Trojans` 的应对技术有哪些\n\
  * 理解规避技术\n* 理解 `Trojan` 和 `virus`（病毒）之间的区别\n* 理解 `virus` 如何传播\n* 理解 `virus` 方法\n\
  \n`Trojans` 和 `backdoors`（后门）是感染系统的两种方式。`Trojan` 是一种看似无害但实际上具有破坏性的程序。在许多情况下，它是随另一个程序一起安装的。`Trojans`\
  \ 和 `backdoors` 很常见是因为它们允许黑客访问系统。`Trojans` 和 `backdoors` 是恶意软件的类型。`Trojan` 可以嵌入到恶意程序中。`Trojans`\
  \ 和 `backdoors` 经常用于破坏系统。`Trojans` 和 `backdoors` 用于获取系统的访问权限。`Trojans` 和 `backdoors`\
  \ 经常用于在系统上建立 `backjan`（后门）。\n\n`backdoor` 是黑客在目标系统上安装的一个程序或一组相关程序，以便稍后访问系统。`backdoor`\
  \ 可以嵌入在恶意的 `Trojan` 中。在系统上安装 `backdoor` 的目的是让黑客在他们选择的时间访问系统。关键在于黑客知道如何在不被察觉的情况下进入\
  \ `backdoor`，并能够利用它进一步攻击系统。\n\n添加新服务是 Windows 操作系统伪装 `backdoors` 最常用的技术。在安装 `backdoor`\
  \ 之前，黑客必须调查系统以找到正在运行的服务。在大多数情况下，黑客安装 `backdoor`，添加一个新服务并给它一个不起眼的名称，或者更好的是选择一个从未使用过且被手动激活或完全禁用的服务。\n\
  \n### 表 5-1：常见的木马程序\n\n| Trojan | 协议 | 端口 |\n| :--- | :--- | :--- |\n| `BackOrifice`\
  \ | UDP | 3137 或 3138 |\n| `Deep Throat` | UDP | 2140 或 3150 |\n| `NetBus` | TCP\
  \ | 12345 或 12346 |\n| `Whack-a-Mole` | TCP | 12361 或 12362 |\n| `NetBus 2` | TCP\
  \ | 20034 |\n| `GirlFriend` | TCP | 21544 |\n| `Master’s Paradise` | TCP | 3129,\
  \ 40421, 40422, 40423, 和 40426 |\n\n\n\n远程访问木马（RATs）是一类后门程序，用于对被攻破的机器进行远程控制。它们为用户提供看似实用的功能，同时在受害者的计算机上开启一个网络端口。一旦\
  \ `RAT` 启动，它就会像一个可执行文件一样运行，与负责启动进程的某些 `Registry`（注册表）键交互，有时还会创建自己的系统服务。与常见的后门不同，RATs\
  \ 会将自身挂钩到受害操作系统中，并且总是包含两个文件：客户端文件和服务器文件。服务器安装在被感染的机器上，而客户端则由入侵者用于控制受控的系统。\n\nRATs\
  \ 允许黑客随时控制目标系统。事实上，系统被利用的迹象之一就是系统上出现了异常行为，例如鼠标自动移动，或在空闲的系统上出现弹出窗口。\n\n# 关于练习木马的警告\n\
  \n我刻意在这一节关于木马和后门的章节中省略了任何分步操作的练习题，因为我不希望提倡任何人在生产系统中安装这些程序并导致数据丢失。然而，学习如何使用这些工具及其能力的最佳方法是安装它们并进行测试。因此，以下是我利用木马和后门学习道德黑客技巧的建议。\n\
  \n找一台你不打算再次使用的旧电脑，或者为你的笔记本电脑买第二块硬盘（这就是我的做法）。安装未启用任何服务包或更新的 `Windows XP` 操作系统。不要安装任何病毒扫描软件或防火墙。下一步是真正疯狂安装本章列出的所有木马、根基程序和后门工具。这将让你自由地学习和测试这些工具，而不会被试图保护你计算机的病毒扫描或个人防火墙所拦截。完成后，你可以重新安装\
  \ Windows，或者直接将硬盘更换为你的生产硬盘。\n\n如果你正在寻找一台小型便宜的计算机作为测试机，最后的建议是购买一台运行 `Windows XP`\
  \ 的廉价笔记本电脑，并用它来安装和测试工具。\n\n# 明道与隐蔽道\n\n明道（overt channel）程序在计算机系统或网络内部通信的正常合法方式。隐蔽道（covert\
  \ channel）则以非预期的方式使用程序或通信路径。\n\n木马可以使用隐蔽道进行通信。某些客户端木马使用隐蔽道向受控系统的服务器组件发送指令。这有时会让木马的通信难以破解和理解。一个毫无察觉的入侵检测系统（`IDS`）嗅探木马客户端与服务器之间的传输，不会将其标记为任何异常。通过使用隐蔽道，木马可以在不被发现的情况下通信或“回家”，黑客也可以在不被发现的情况下向客户端组件发送命令。\n\
  \n![realworld.eps](img/realworld_fmt.gif)\n\n## 使用隐蔽道\n\n杰米亚·丹顿（Jeremiah Denton）是越南战争期间的战俘，他利用隐蔽道在捕获者不知情的情况下通信。丹顿接受了一位日本电视记者的采访，最后采访的录像带到了美国。当美国情报人员查看磁带时，其中一人注意到丹顿以一种异常的方式眨着眼睛。他们发现他正在用摩斯密码闪烁字母。字母是\
  \ `T-O-R-T-U-R-E`，丹顿反复闪烁这些字母。这是一个利用隐蔽道在不被发现的情况下发送通信消息的真实案例。\n\n另一个通过计算机通过隐蔽道传递信息的例子是利用文件的特性来传递信息，而不是文件本身。一个计算机隐蔽道的示例是创建一个看似无害的\
  \ `16 bytes` 大小的计算机文件。该文件可以包含任何数据，因为那些并不是重要信息。然后可以将文件通过电子邮件发送给另一个人。再次，这看起来足够无害，但真正的通信是数字\
  \ `16`。文件大小才是重要数据，而不是文件的内容。\n\n某些隐蔽道依赖于名为 `tunneling`（隧道）的技术，该技术允许一个协议承载在另一个协议之上。控制消息协议（`ICMP`）隧道是一种使用\
  \ `ICMP echo-request` 和 `echo-reply` 来携带攻击者可能想要使用的任何负载的方法，试图隐蔽地访问或控制受控的系统。`ping`\
  \ 命令是一个广泛接受的故障排除工具，它使用 `ICMP` 协议。由于这个原因，许多路由器、交换机、防火墙和其他数据包过滤器允许 `ICMP` 协议通过设备。因此，`ICMP`\
  \ 是隧道协议的极佳选择。\n\n# 黑客工具\n\n`Loki` 是一种黑客工具，通过 `ICMP` 提供 shell 访问，这使其比基于 TCP 或 UDP\
  \ 的后门难以检测得多。从网络来看，有一系列 `ICMP` 数据包正在跨网络发送。然而，黑客实际上是从 `Loki` 客户端发送命令并在服务器上执行它们。\n\n\
  # 木马的类型\n\n木马可以被创建并执行不同的攻击。以下是一些最常见的木马类型：\n\n*   **远程访问木马 (RATs)**：用于获取对系统的远程访问。\n\
  *   **数据发送木马**：用于在系统上寻找数据并交付给黑客。\n*   **破坏性木马**：用于删除或损坏系统上的文件。\n*   **拒绝服务木马**：用于发起拒绝服务攻击。\n\
  *   **代理木马**：用于通过其他系统隧道流量或发起攻击攻击。\n*   **FTP 木马**：用于创建 `FTP` 服务器以便将文件复制到系统。\n* \
  \  **安全软件禁用木马**：用于停止反病毒软件。\n\n# 反向连接木马的工作原理\n\n反向连接木马（Reverse-Connecting Trojans）允许攻击者从外部访问内部网络上的机器。黑客可以在内部网络的系统上安装一个简单的木马程序，例如反向\
  \ Web 服务器。内部服务器会定期（通常每 60 秒）尝试访问主系统以获取命令。如果攻击者在主系统中输入了内容，该命令就会被提取并在内部系统中执行。反向 Web\
  \ 服务器使用 `HTTP`。它是危险的，因为它很难检测：看起来就像是客户端从内部网络浏览网页。\n\n\n\n\n\n# 木洛马程序\n\n`NetBus`\
  \ 是一个 Windows GUI 木洛马程序，功能与 Donald Dick 类似。它会添加注册表键 `HKEY_CURRENT_USER\\NetBus Server`\
  \ 并修改 `HKEY_CURRENT_USER\\NetBus Server\\General\\TCPPort` 键。如果 `NetBus` 被配置为自动启动，它会在\
  \ `HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\RunServices`\
  \ 中添加一个名为 `NetBus Server` 的注册表项。\n\n`SubSeven` 是一种木马程序，可以配置为在感染的计算机连接到互联网时通知黑客，并能向黑客提供有关系统的信息。这种通知可以通过\
  \ IRC 网络、`ICQ` 或电子邮件完成。`SubSeven` 会导致系统运行变慢，并在感染的系统上生成错误消息。\n\n`Back Orifice 2000`\
  \ 是一种远程管理工具，攻击者可以使用 GUI 界面通过 TCP/IP 连接控制系统。`Back Orifice` 不会出现在任务列表或进程列表中，它会将自己复制到注册表中，以便在每次计算机启动时运行。它运行的文件名在安装前是可以配置的。`Back\
  \ Orifice` 修改了 `HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\\
  RunServices` 注册表键。`BackOrifice` 插件为 `BackOrifice` 程序增加了功能。插件包括加密强度极强的 Triple DES\
  \ 加密、带有可选鼠标和键盘控制的远程桌面、拖放式加密文件传输、类似 Explorer 的文件系统浏览、图形化远程注册表编辑、可靠的 UDP 和 ICMP 通信协议，以及通过使用\
  \ `ICMP` 代替 TCP 和 UDP 实现隐藏能力。\n\n`BoSniffer` 看起来是 `Back Orifice` 的修复程序，但实际上是一个安装了\
  \ `SpeakEasy` 插件的 `Back Orifice` 服务器。如果在目标系统上运行 `BoSniffer.exe`，它会尝试使用随机用户名登录到通道\
  \ `#BO_OWNED` 的预设 IRC 服务器。然后它会每隔几分钟宣布一次其 IP 地址和自定义消息，以便黑客社区可以将该系统作为未来攻击的僵尸。\n\n\
  `ComputerSpy Key Logger` 是黑客可以用来记录计算机活动的程序，例如访问的网站；`ICQ`、`MSN`、`AOL`、`AIM` 以及 `Yahoo!\
  \ Messenger` 或网邮箱的登录名和密码；当前运行或执行的应用程序；互联网聊天；以及电子邮件。该程序甚至可以按间隔对整个 Windows 桌面拍摄快照。\n\
  \n`Beast` 是一种运行在为 `WinLogon.exe` 服务分配的内存中的木马。一旦安装，该程序就会插入 `Windows Explorer` 或 `Internet\
  \ Explorer` 中。`Beast` 最显著的特征之一是全功能木马，这意味着客户端、服务器和服务器编辑器存储同一个应用程序中。\n\n`CyberSpy`\
  \ 是一种 telnet 木马，它将自己复制到 Windows 系统目录并在注册表中注册自己，以便在每次感染的系统重启时启动。完成后，它会通过电子邮件或 `ICQ`\
  \ 发送通知，然后开始监听之前指定的 TCP/IP 端口。\n\n`Subroot` 是一种远程管理木马，黑客可以使用它通过 TCP 端口 `1700` 连接到受害者系统。\n\
  \n`LetMeRule!` 是一种远程访问木马，可以配置为监听目标系统上的任何端口。它包含一个攻击者用于控制目标系统的命令行提示符。它可以删除特定目录中的所有文件，在远程主机上执行文件，或查看并修改\
  \ `Registry`。\n\n`Firekiller 2000` 会禁用反病毒程序和软件防火墙。例如，如果 `Norton AntiVirus` 在任务栏中处于自动扫描模式，且\
  \ `AtGuard Firewall` 已激活，该程序在执行时会停止两者，并使硬盘上的两个安装都无法使用。它们必须重新安装才能恢复功能。`Firekiller\
  \ 2000` 适用于所有的防护软件，包括 `AtGuard`、`Norton AntiVirus` 和 `McAfee Antivirus`。\n\n`Hard\
  \ Drive Killer Pro` 程序提供了完全且永久破坏任意 DOS 或 Windows 系统上所有数据的能力。该程序一旦执行，会在几秒内删除文件、感染并重启系统。重启后，无论硬盘大小如何，连接到系统的所有硬盘都会在一到两秒内以不可恢复的方式进行格式化。\n\
  \n## Netcat 木马是如何工作的\n\n`Netcat` 是一种使用命令行界面在目标系统上打开 TCP 或 UDP 端口的木马。黑客随后可以 telnet\
  \ 到这些开放的端口并获得目标系统的 shell 权限。练习 5-1 显示了如何使用 `Netcat`。\n\n![note.eps](img/note_fmt.gif)\n\
  \n对于 CEH 考试，了解如何使用 `Netcat` 至关重要。确保在尝试考试之前下载 `Netcat` 工具并练习相关命令。\n\n### 练习 5-1：使用\
  \ Netcat\n\n下载适用于你系统的 `Netcat` 版本。针对所有 Windows 操作系统都有多个版本的 `Netcat`。此外，`Netcat`\
  \ 最初是为 Unix 系统开发的，并在许多 Linux 发行版中，包括 `BackTrack`。\n\n![g0501.tif](img/g0501_fmt.jpg)\n\
  \n`Netcat` 需要在客户端和服务器端运行。连接的服务器端通过 `-l` 属性启用，用于创建监听端口。例如，使用以下命令在服务器上启用 `Netcat`\
  \ 监听：\n\n```\nnc -L -p 123 -t -e cmd.exe\n```\n\n在 `Netcat` 客户端上，运行以下命令连接到服务器：\n\
  \n```\nnc <ip address> <port>\n```\n\n客户端随后应该打开一个来自服务器的命令行提示符。\n\n异常系统行为通常是木马攻击的迹象。诸如程序在没有用户启动的情况下启动；光驱驱打开或关闭；壁纸、背景或屏幕保护程序自动更改；显示翻转以及浏览器程序打开奇怪或意外的网站都是木马攻击的迹象。任何非由用户发起的活动都可能是木马攻击的迹象。\n\
  \n![realworld.eps](img/realworld_fmt.gif)\n\n### 病毒或木马感染的迹象\n\nCarrie 在工作中使用电脑时发现电脑运行缓慢。当她打开\
  \ `Microsoft Word` 文件时，系统会显示错误消息，然后她无法使用程序的某些功能。在过去的 24 小时内没有收到任何新邮件；她通常每天收到 50\
  \ 多封邮件，所以这看起来有点异常。最后，她的一个客户说上周收到了她发的重复邮件，这很奇怪。\n\n于是，Carrie 了公司网络管理员 John，让他检查她的电脑，确定是什么导致了运行缓慢以及\
  \ `Microsoft Outlook` 的问题。John 查看了 Carrie 的电脑，发现病毒定义是 6 个月前的。反病毒程序不断弹出窗口显示病毒定义已过期，但\
  \ Carrie 只是忽略并一直关闭这些弹出窗口。John 更新了病毒定义并运行了全系统扫描。反病毒程序确定系统被感染了 114 个病毒和木马。反病毒程序能够清理感染并将电脑恢复到先前的未感染状态。John\
  \ 在测试 `Microsoft Outlook` 以确保其正常工作时，注意到了几封来自在线占星服务、娱乐网站和在线游戏网站的邮件。John 从她的电脑中删除了几个可疑程序。\n\
  \n向所有工作站推送病毒更新的网络软件、防止未经授权软件安装的网络控制以及用户安全意识培训可以防止此类事件的发生。\n\n\n\n\n\n封装器（Wrappers）是用于投放木马的软件软件包。封装器将一个合法文件与木马文件绑定。合法软件和木马都会合并成单个可执行文件，并在程序运行时一同进行安装。\n\
  \n通常情况下，游戏或其他动画化安装程序被用作封装器，因为在安装木马的过程中，这些程序可以娱乐用户。这样一来，用户就不会察觉到木马在系统中安装时产生的处理变慢——用户只会看到合法应用程序正在安装。\n\
  \n## 黑客工具\n\n`Graffiti` 是一种可以被封装木木马的动画游戏。在木马于后台安装时，它通过动画游戏娱乐用户。\n\n`Silk Rope 2000`\
  \ 是一个封装器，将 `BackOrifice` 服务器和其他任何指定的应用程序相结合。\n\n`ELiTeWrap` 是一种用于 Windows 的高级 EXE\
  \ 封装器，用于安装和运行程序。`ELiTeWrap` 可以创建一个安装程序，将文件提取到目录，并执行显示帮助菜单或将文件复制到目标系统的程序或批文件。\n\n\
  `Icon Converter Plus` 是一种在各种格式之间转换图标的转换程序。攻击者可以使用此类应用程序来伪装恶意代码或木马，欺骗用户执行它，使其误认为是合法应用程序。\n\
  \n## 木马制作工具包和木马制作器\n\n几种木马生成工具让黑客能够创建自己的木马。此类工具包帮助黑客构建可以自定义的木马。这些工具如果执行不当，可能会非常危险并适得其反。黑客创建的新木马通常具有一个额外优点：由于它们不匹配任何已知签名，可以躲避病毒扫描和木马扫描工具的检测。\n\
  \n野可用的一些木马工具包包括 `Senna Spy Generator`、`Trojan Horse Construction Kit v2.0`、`Progenic\
  \ Mail Trojan Construction Kit` 和 `Pandora’s Box`。\n\n## 木马防御措施\n\n大多数商业防病毒程序都具有反木马能力以及间谍软件检测和删除功能。这些工具可以在启动时自动扫描硬盘，在后门和木马程序造成破坏之前检测它们。一旦系统被感染，清理起来就会变得困难，但您可以使用市售工具进行清理。\n\
  \n尽管有多种商业防病毒或木马删除工具可用，但我个人推荐使用 `Norton Internet Security`（图 5-1）。`Norton Internet\
  \ Security` 包含了个人防火墙、入侵检测系统、防病毒、反间谍软件、反钓鱼和电子邮件扫描。`Norton Internet Security` 还会清除系统中的大多数木马。\n\
  \n图 5-1： Norton Internet Security\n\n![f0501.eps](img/f0501_fmt.gif)\n\n安全软件的工作原理是拥有已知恶意软件（如木马和病毒）的签名。通过恶意软件定义来实现。在安装和使用任何个人安全软件或防病毒及反木马软件时，您必须确保软件具有所有当前的定义。为了确保可以使用最新的补丁和修复，您应该将系统连接到互联网，以便软件持续更新恶意软件定义和修复。\n\
  \n使用商业应用程序清理系统而非使用免费工具是重要的，因为许多免费删除工具可能会进一步感染系统。此外，许多商业安全软件包含入侵检测组件，该组件将执行端口监控，并识别已打开的端口或已更改的文件。\n\
  \n## 端口监控和木马检测工具\n\n`fport` 报告所有开放的 TCP/IP 和 UDP 端口并将其映射到所属应用程序。您可以使用 `fport` 快速识别未知的开放端口及其关联应用程序。\n\
  \n`TCPView` 是一个 Windows 程序，显示系统上所有 TCP 和 UDP 端点的详细列表，包括本地地址、远程地址以及 TCP 连接的状态。当 `TCPView`\
  \ 运行时，它会列出所有活动的 TCP 和 UDP 端点，并将所有 IP 地址解析为其域名版本。\n\n`PrcView` 是一个进程查看器工具，显示 Windows\
  \ 下运行的进程的详细信息。`PrcView` 带有命令行版本，可以使用它编写脚本来检查进程是否正在运行，如果是，则杀死。\n\n`Inzider` 是一个实用的工具，列出\
  \ Windows 系统中的进程以及每个进程监听的端口。`Inzider` 可能会发现到一些木马。例如，`BackOrifice` 将自己注入其他进程中，因此它在任务管理器中不会作为独立进程可见，但它确实有一个正在监听的开放端口。\n\
  \n`Tripwire` 验证系统完整性。它会自动计算所有关键系统文件或任何要监控修改文件的加密哈希值。`Tripwire` 通过创建系统的基准快照来工作。它定期扫描这些文件，重新计算信息，并查看信息是否发生了变化。如果有变化，软件会报警。\n\
  \n`Dsniff` 是一组用于网络审计和渗透测试的工具。`Dsniff`、`filesnarf`、`mailsnarf`、`msgsnarf`、`urlsnarf`\
  \ 和 `WebSpy` 被动监控网络中的感兴趣数据，如密码、电子邮件和文件传输。`Arpspoof`、`dnsspoof` 和 `macof` 有助于拦截由于二层交换导致攻击者通常无法获取的网络流量。`Sshmitm`\
  \ 和 `webmitm` 通过利用临时即用公密钥基础设施 (PKI) 中的弱绑定，对重定向的安全 Shell (SSH) 和基于 SSL 的 HTTP (HTTPS)\
  \ 会话实施主动的中间人攻击。这些工具将在第 6 章“从网络收集数据：嗅探”中详细讨论。\n\n## 使用系统文件验证系统\n\nWindows 2003 包含一个名为\
  \ Windows 文件保护 (WFP) 的功能，它可以防止文件被替换。WFP 在尝试覆盖 `SYS`、`DLL`、`OCX`、`TTF` 或 `EXE` 文件时检查文件完整性。这确保只使用微软验证的文件。\n\
  \n另一个工具 `sigverif` 用于检查哪些文件具有数字签名。在练习 5-2 中，我们将使用该工具。\n\n### 练习 5-2：签名验证\n\n我们将运行\
  \ `sigverif` 并将其结果与任务管理器中当前运行的进程进行比较：\n\n1. 按 `Ctrl+Alt+Del` 并选择任务管理器。\n2. 点击“进程”选项卡。注意任何异常进程及其使用的\
  \ CPU 时间。持续使用高百分比 CPU 的进程可能表明存在病毒或感染。\n\n![g0502.tif](img/g0502.jpg)\n\n3. 点击任务管理器中的“性能”选项卡以查看\
  \ CPU 使用情况。\n\n![g0503.tif](img/g0503.jpg)\n\n4. 点击“开始”⇒“运行”。\n5. 输入 `sigverif`，并点击“确定”。\n\
  \n![g0504.tif](img/g0504.jpg)\n\n6. 在 `sigverif` 程序中，选择“高级”查看签名验证报告。\n\n![g0505.tif](img/g0505.jpg)\n\
  \n7. 点击“查看日志”按钮查看报告。\n\n![g0507.tif](img/g0507.jpg)\n\n\n\n\n\n### 系统文件检查器 (System\
  \ File Checker)\n系统文件检查器是另一种基于命令行工具，用于检查木马程序是否替换了文件。如果 `System File Checker` 检测到文件已被覆盖，它将从\
  \ `Windows\\system32\\dllcache` 文件夹中检索一个已良好的文件并覆盖未经验的文件。运行 `System File Checker`\
  \ 的命令是 `sfc/scannow`。\n\n### 病毒和蠕虫\n病毒和蠕虫可用于感染系统并修改系统，以允许黑客获得访问权限。许多病毒和蠕虫带有木马和后门。通过这种方式，病毒或蠕虫成为载体，允许木马和后门等恶意代码从系统传输到系统，就像人之间的接触导致病毒传播一样。\n\
  \n病毒和蠕虫在许多方面是相似的，它们都是恶意软件（malware）的形式。病毒感染另一个可执行文件，并利用该载体程序来传播自己。病毒代码被注入到先良的程序中，并在程序运行时进行传播。病毒载体程序的示例有宏、游戏、电子邮件附件、Visual\
  \ Basic 脚本和动画。\n\n蠕虫在许多方面与病毒相似，但不需要载体程序。蠕虫可以自我复制并从受感染的主机移动到另一个主机。蠕虫自动从一个系统传播到另一个系统，但病毒需要另一个程序传播。病毒和蠕虫都在终端用户不知或非意愿的情况下执行。\n\
  \n# 病毒类型\n病毒根据两个因素进行分类：它们感染什么以及如何感染。病毒可以感染系统的以下组件：\n\n* 系统扇区\n* 文件\n* 宏（例如 Microsoft\
  \ Word 宏）\n* 伴随文件（支持系统文件，如 `DLL` 和 `INI` 文件）\n* 磁盘簇\n* 批文件（`BAT` 文件）\n* 源代码\n\n\
  病毒通过与外部系统的交互进行感染。病毒需要由另一个可执行程序携带。通过附加到良性可执行文件，病毒可以在用户或系统运行该可执行文件时传播得非常快。病毒根据其感染技术分类如下：\n\
  \n* **多态病毒 (Polymorphic Viruses)**：这些病毒在每次感染时都以不同的方式加密代码，并可以变为不同的形式以尝试规避检测。\n* **隐形病毒\
  \ (Stealth Viruses)**：这些病毒隐藏了正常的病毒特征，例如修改文件的原始日期和时间戳，以防止病毒被发现是系统上的新文件。\n* **快速和慢感染者\
  \ (Fast and Slow Infectors)**：这些病毒通过极快或极慢的感染来规避检测。这有时允许程序在不被防病毒软件检测到的情况下感染系统。\n\
  * **稀疏感染者 (Sparse Infectors)**：这些病毒只感染少数系统或应用程序。\n* **加壳病毒 (Armored Viruses)**：这些病毒经过加密以防止检测。\n\
  * **多部分感染病毒 (Multipartite Viruses)**：这些高级病毒会创建多次感染。\n* **空隙/填充病毒 (Cavity/Space-Filler\
  \ Viruses)**：这些病毒附加到文件的空白区域。\n* **隧道病毒 (Tunneling Viruses)**：这些病毒通过不同的协议发送或加密，以规避检测或允许其通过防火墙。\n\
  * **伪装病毒 (Camouflage Viruses)**：这些病毒看起来像另一个程序。\n* **NTFS 和活动目录病毒 s**：这些病毒专门攻击 Windows\
  \ 系统上的 `NTFS` 文件系统或活动目录。\n\n攻击者可以编写不会被防病毒软件检测的自定义脚本或病毒。由于病毒的检测和删除是基于程序的特征码（signature）的，黑客只需要更改病毒的特征码或外观即可防止检测。病毒特征或定义是防病毒软件判断系统是否被病毒感染的方法。在病毒被检测到防病毒公司有机会更新病毒定义之前，病毒将不会被发现。在用户更新防病毒软件之前可能还会过去更多时间，导致系统容易受到感染。这使得攻击者可以在一段时间内规避防病毒检测和删除。防止病毒感染的关键措施是在防病毒软件中维护最新的病毒定义。\n\
  \n最老的病毒之一是 Melissa 病毒，它通过 Microsoft Word 宏传播。Melissa 通过附加到 Word 文档感染许多用户，当文件被复制或通过电子邮件发送时，病毒随文件传播。\n\
  \n病毒骗局（Virus Hoaxes）是发送给用户的电子邮件，通常带有关于病毒攻击的警告。病毒骗局邮件通常对病毒造成的破坏做出荒奇的断言，然后提供从 Microsoft\
  \ 或 Norton 等知名公司下载修复补丁。其他骗局则建议用户删除某些关键系统文件以移除病毒。当然，如果用户遵循这些建议，将会产生负面后果。一些最常见的病毒骗局如表\
  \ 5-2 所示：\n\n### 表 5-2：常见病毒骗局\n\n| 名称 | 可执行文件 | 描述 |\n| --- | --- | --- |\n| 反基督\
  \ (Antichrist) | (无) | 这是一个骗局，警告说是 Microsoft 和 McAfee 发现的名为“Antichrist”的病毒，告诉用户它是通过主题为“SURPRISE?!!!!!!!!!!”的电子邮件安装的，随后它会破坏硬盘的零号扇区，使其无法使用。\
  \ |\n| 百威时青蛙 (Budweiser Frogs) | `BUDSAVER.EXE` | 据说会删除用户的硬盘并窃取用户的用户名和密码。 |\n| Goodtimes\
  \ 病毒 (Goodtimes virus) | (无) | 1994 年互联网用户之间开始流关于名为“Good Times”的计算机病毒的警告。据说 Goodtimes\
  \ 病毒是通过主题为“Good Times”或“Goodtimes”的电子邮件传输的，因此有了这个名字，警告建议删除任何此类未读邮件。警告中描述的病毒并不存在，但警告本身实际上具有病毒特征。\
  \ |\n\n\n\n\n\n# SULFNBK.EXE 警告\n\n`SULFNBK.EXE`（Setup Utility for Long File Name\
  \ Backup，即长文件名备份设置实用程序）是 Microsoft Windows 操作系统（Windows 98 和 Windows Me）中用于恢复长文件名的内部组件。该组件在\
  \ 2000 年初作为一封邮件骗局的主题而声名在外。该骗局声称 `SULFNBK.EXE` 是一个病毒，并提供了定位和删除该文件的指令。虽然这些指令有效，但它们是多余的，并且（在某些少数情况下，例如当长文件名损坏需要恢复时）可能会导致系统故障，因为\
  \ `SULFNBK.EXE` 并不是病毒，而是一个操作系统组件。\n\n要确定封有关病毒的邮件是否真实，请查阅网站 [home.mcafee.com/virusinfo](http://home.mcafee.com/virusinfo)\
  \ 上的病毒骗局列表。\n\n## 病毒检测方法\n\n使用以下技术来检测病毒：\n\n- 扫描\n- 使用校验和进行完整性检查\n- 基于病毒特征的拦截\n\n\
  病毒检测和清除的过程如下：\n\n1. 将攻击识别为病毒。并非所有异常行为都能归因于病毒。\n2. 使用 `handle.exe`、`listdlls.exe`、`fport.exe`、`netstat.exe`\
  \ 和 `pslist.exe` 等工具跟踪进程，并映射受影响系统的共同点。\n3. 通过寻找被修改、替换或删除的文件来检测病毒负载。应检查新文件、更改的文件属性或共享库文件。\n\
  4. 获取感染媒介并将其隔离。然后，更新你的防病毒定义并重新扫描所有系统。\n\n在练习 5-3 中，我们将创建一个测试病毒。\n\n## 练习 5-3：创建一个测试病毒\n\
  \n可以通过在记事本中输入以下代码并将文件保存为 `EICAR.COM` 来创建一个测试病毒。当你尝试打开、运行或复制它时，你的杀病毒程序应该会有反应。\n\n\
  ```\nX5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*\n```\n\
  \n防止蠕虫感染系统与病毒非常相似。蠕虫更容易停止，因为它们会自动传播，这意味着它们不需要用户干预即可安装并继续传播恶意软件。可以使用包含蠕虫定义的反恶意软件检测蠕虫。最重要的是，需要阻止蠕虫的传播。为了做到这一点，管理员可能需要将系统离线。从网络系统中清除蠕虫的最佳实践是：先将计算机从网络中移除，然后运行安全软件来清除蠕虫。\n\
  \n## 总结\n\n木马、后门、病毒和蠕虫都是用于感染系统的恶意软件形式，会导致数据损坏或感染系统，以便黑客获得对系统的进一步访问权限。病毒的类型、感染方式以及它们的用途都是\
  \ CEH 考试的考试目标。\n\n防止恶意软件感染系统的最佳方法是确保安装互联网安全软件，并更新病毒和木马签名及定义。此外，通过对用户进行安全意识培训可以避免恶意软件，防止他们打开和运行任何不熟悉或无法验证的文件。\n\
  \n## 考试要点\n\n- 理解木马的定义。木马是随软件传输到目标系统的恶意代码。\n- 理解什么是隐信道（covert channel）。隐信道以非预期的方式使用通信。ICMP\
  \ 隧道、反向 WWW Shell 和中间人攻击是常见的隐信道。\n- 理解后门的定义。后门通常是木马的一个组件。它用于在初始系统漏洞被发现并移除后维持访问权限。它通常表现为在受攻击系统上开启端口。\n\
  - 理解什么是木马及其工作原理。木马主要用于获取并保留目标系统的访问权限。木马通常深藏于系统内部，并修改注册表以使其实现作为远程管理工具的用途。\n- 了解木马的最佳防御措施。安全意识和预防措施是防御木马的最佳手段。\n\
  - 理解病毒与蠕虫的区别。病毒必须附着在其他程序上，而蠕虫会自动传播。\n- 理解不同类型的病毒。多态型、隐形、快速感染型、慢感染型、稀疏感染型、装甲、多部分、空洞、隧道、伪装、NTFS\
  \ 和 AD 病毒都是病毒类型。\n\n## 复习题\n\n1. 什么是封装（wrapper）？\nA. 被植入木马的系统\nB. 用于将木马和合法软件合并为单个执行文件的程序\n\
  C. 用于将木马和后门合并为单个执行文件的程序\nD. 访问被植入木马系统的方法\n\n2. 后门和木马之间的区别是什么？\nA. 木马通常为黑客提供后门。\n\
  B. 后门必须先安装。\nC. 木马不是访问系统的方法。\nD. 后门仅通过病毒提供，而不通过木马提供。\n\n3. Tini 默认使用哪个端口？\nA. 12345\n\
  B. 71\nC. 7777\nD. 666\n\n4. 哪种是木马和后门的防御措施？\nA. 在连接网络时扫描硬盘，并教育用户不要安装未知软件。\nB. 实现网络防火墙。\n\
  C. 实现个人防火墙软件。\nD. 教育系统管理员使用不带防火墙系统的风险。\nE. 在启动时扫描硬盘。\n\n5. 如何从系统中清除蠕虫？\nA. 扫描硬盘。\n\
  B. 购买杀毒工具。\nC. 重启系统。\nD. 卸载所有应用程序。\n\n6. 什么是 ICMP 隧道？\nA. 通过 HTTP 发送 ICMP\nB. 通过其他协议发送\
  \ ICMP\nC. 显性信道\nD. 使用 HTTP 发送命令\n\n7. 什么是反向 WWW Shell？\nA. 使用 HTTP 的隧道\nB. 使用 HTTP\
  \ 连接服务器到客户端\nC. 使用 HTTP 发送命令\nD. 通过防火墙连接\n\n8. 什么是隐信道？\nA. 以非预期的方式使用通信\nB. 隧道软件\n\
  C. 木马清除工具\nD. 按预期方式使用通信\n\n9. 系统文件验证的目的是\nA. 查找文件\nB. 确定文件是否被更改或修改\nC. 发现是否安装了后门\n\
  D. 移除木马\n\n10. 下列哪是隐信道的示例？\nA. 反向 WWW Shell\nB. 防火墙\nC. SNMP 遍历\nD. 信息隐藏\n\n11.\
  \ 病毒和蠕虫的区别是什么？\nA. 病毒可以感染引导扇，而蠕虫不能。\nB. 蠕虫会自动传播，而病毒必须附于电子邮件。\nC. 蠕虫会自动传播，而病毒必须附着在其他程序上。\n\
  D. 病毒用 C++ 编写，而蠕虫用 shell 代码编写。\n\n12. 哪种病毒会修改自身以规避检测？\nA. 隐形病毒\nB. 多态病毒\nC. 多部分病毒\n\
  D. 装甲病毒\n\n13. 哪种病毒通过 Word 宏传播？\nA. Melissa\nB. Slammer\nC. Sobig\nD. Blaster\n\n\
  14. 哪种蠕虫影响 SQL 服务器？\nA. Sobig\nB. SQL Blaster\nC. SQL Slammer\nD. Melissa\n\n15.\
  \ 下列哪项描述了装甲病毒？\nA. 隐藏的\nB. 隧道\nC. 加密的\nD. 隐形的\n\n16. 检测病毒的三种方法是\nA. 扫描\nB. 完整性检查\n\
  C. 病毒特征对比\nD. 防火墙规则\nE. IDS 异常检测\nF. 嗅探\n\n17. 病毒感染系统的哪些组件？（多选）\nA. 文件\nB. 系统扇区\n\
  C. 内存\nD. CPU\nE. DLL 文件\n\n18. 下列哪些项是病毒攻击的最佳迹象？（多选）\nA. 任何异常行为\nB. 程序异常打开或关闭\n\
  C. 奇怪的弹出窗口消息\n\n\n\n\n\n# D. 正常的系统操作，因为大多数病毒都在后台运行\n\n19. 可以引起多次感染的病毒被称为哪种病毒？\n\
  A. 多部分病毒 (Multipartite)\nB. 隐身病毒 (Stealth)\nC. 伪装病毒 (Camouflage)\nD. 多感染病毒 (Multi-infection)\n\
  \n20. 下列哪是规避杀病毒软件的方法？\nA. 编写自定义病毒脚本。\nB. 编写自定义病毒特征。\nC. 编写自定义病毒规避程序。\nD. 编写自定义病毒检测程序。\n\
  \n## 复习题答案\n\n1. B. Wrapper（壳）是一种用于将木马和合法软件合并成单个可执行文件的软件，以便在安装其他软件时安装木马。木马安装后，该系统被认为“被植入木马的（Trojaned）”。后门是访问植入木马系统的方法，可以作为木马行为的一部分。\n\
  \n2. A. 木马首先感染系统，通常包含一个用于日后访问的后门。后门不是独立安装的，而是木马的一部分。木马是黑客访问系统的一种方式。\n\n3. C. Tini\
  \ 默认使用端口 `7777`。Doom 使用端口 `666`。\n\n4. A. 最佳预防措施是扫描网络连接和后门在硬盘上已知的木马，并教育用户不要安装任何未知软件。在启动时扫描硬盘是检测木马的好方法，但无法防止其安装。用户教育是安全性的一个重要组成部分，但并不能始终且一致地防止木马攻击。\n\
  \n5. B. 要移除木马，你应该使用商业工具。许多免费软件工具包含木马或其他恶意软件。仅重启系统不会移除系统中的木马。卸载并重新安装应用程序不会移除木马，因为病毒感染的是操作系统。\n\
  \n6. B. ICMP 隧道涉及发送看起来是 ICMP 命令但实际上是木马通信的包。显式通道（Overt channel）通过正常的通信路径（如电子邮件）发送数据。在\
  \ HTTP 等其他协议内发送或隧道化 ICMP 不被视为 ICMP 隧道。\n\n7. B. 反向 WWW 壳程序（Reverse WWW shell）是从受感染系统上的木马服务器组件到黑客系统上的木马客户端的连接。使用隧道或通过防火墙连接网站不被视为反向\
  \ WWW 壳。\n\n8. A. 隐蔽通道（Covert channel）是以非传统方式使用协议或通信通道。隧道软件是使用隐蔽通道的一种方式，但并不一定定义所有的隐蔽通道。按照原始意图使用通信通道被视为显式通道。\n\
  \n9. B. 系统文件验证跟踪对系统文件进行的更改，并确保木马没有覆盖关键系统文件。不使用系统文件验证定位系统文件和后门。要移除木马，你应该使用商业删除工具。\n\
  \n10. A. 反向 WWW 壳程序是隐蔽通道的一个示例。防火墙漫游（Firewalking）是枚举防火墙的规则、允许的流量和开放端口。隐写术（Steganography）是将信息隐藏在文本或图形中。SNMP\
  \ 举用于识别网络设备上的 SNMP MIB 设置。\n\n11. C. 蠕虫可以自动复制自己，但病毒必须附在另一个程序上。病毒并不总是通过电子邮件传播，也可以附在其他程序上，或通过欺骗用户直接安装。病毒和蠕虫都可以感染引导扇。编程语言不用于将恶意软件分类为病毒或蠕虫。\n\
  \n12. B. 多态病毒通过修改自身来规避检测。隐身病毒隐藏正常的病毒特征以防止检测。多部分病毒（Multipartite viruses）是创建多次感染或感染多个文件或或的病毒。加壳病毒（Armored\
  \ viruses）使用加密来规避检测。\n\n13. A. Melissa 是一种通过 Word 宏传播的病毒。Slammer 和 Blaster 实际上是蠕虫感染，而不是病毒。Sobig\
  \ 是另一种类型的病毒。\n\n14. C. SQL Slammer 是一种攻击 SQL 服务器的蠕虫。Melissa 通过使用宏影响 Word 文件。并不存在名为\
  \ SQL Blaster 的蠕虫。\n\n15. C. 加壳病毒是经过加密的。它们在本质上不是通过隧道传输，也不会像隐身病毒那样改变特征。此外，加壳病毒没有以任何其他方式隐藏。\n\
  \n16. A, B, C. 扫描、完整性检查和病毒特征比较是检测病毒感染的三种方法。防火墙、IDS 异常检测和嗅探都工作在 OSI 模型的较低层次，无法检测病毒。\n\
  \n17. A, B, E. 病毒可以影响文件、系统扇区和 DLL 文件。内存和 CPU 不会被病毒感染。\n\n18. B, C. 木马、后门、间谍软件和其他恶意软件可以导致系统运行异常。任何在没有用户干预的情况下打开或关闭程序的象、程序无响应、异常错误消息或弹出窗口都可能表明任何类型的恶意软件感染了系统。但并非所有的异常行为都能归因于病毒。\n\
  \n19. A. 多部分病毒可以引起多次感染。隐身病毒隐藏正常的病毒特征以防止检测。伪装和多感染不是病毒的类别。\n\n20. A. 自定义病毒脚本可用于规避检测，因为该脚本不会匹配病毒特征。\n\
  \n# 第 6 章：从网络收集数据：嗅探器\n\n## 本章涵盖的 CEH 考试目标：\n\n*   理解易受嗅探攻击的协议\n*   理解主动嗅探和被动嗅探\n\
  *   理解 ARP 投毒\n*   理解以太网捕获和显示过滤器\n*   理解 MAC 泛洪\n*   理解 DNS 欺骗技术\n*   描述针对嗅探的防御措施\n\
  \n嗅探器是一种数据包捕获或帧捕获工具。它基本上是在数据从网络上的主机之间传输时对其进行捕获和显示。通常，嗅探器拦截网络上的流量并以命令行或 GUI 格式显示。大多数嗅探器会同时显示第\
  \ 2 层（帧）或第 3 层（数据包）头部以及数据载荷。某些嗅探器会解析数据包并将包流重组为原始数据，例如电子邮件或文档。\n\n嗅探器用于捕获两个系统之间传输的流量，它们也可以提供许多其他信息。根据嗅探器的使用方式和安全措施，黑客可以使用嗅探器发现网络上传输的用户名、密码和其他机密信息。几种黑客攻击和各种攻击工具都需要使用嗅探器来从目标系统获取信息。\n\
  \n## 理解主机到主机通信\n\n所有主机到主机网络通信都基于 TCP/IP 数据通信模型。TCP/IP 模型是一个 4 层模型。TCP/IP 模型映射到旧的\
  \ 7 层 OSI 模型。大多数应用程序使用 TCP/IP 协议族进行主机到主机的数据通信。\n\n\n\n\n在正常的网络操作中，应用层数据被封装，并在数据开头添加一个包含地址信息的头部。数据中还会添加一个包含源和目的\
  \ `IP` 地址的 `IP` 头部，以及一个包含源和目的 `MAC` 地址的 `MAC` 头部。`IP` 地址用于将流量路由到相应的 `IP` 网络，而 `MAC`\
  \ 地址则确保数据被发送到目标 `IP` 网络上的正确主机。通过这种方式，流量跨越互联网从源主机发送到目标主机，并确保递送到正确的主机。邮政系统的工作原理非常相似。邮件通过邮政编码路由到相应的区域，然后在邮政编码内将邮件递送到特定的街道和门号。`IP`\
  \ 地址类似于邮政编码，用于将邮件投递到区域地区，而街道和门号则就像网络上该特定站点的 `MAC` 地址。\n\n图 6-1 TCP/IP 模型\n\n![f0601.eps](img/f0601_fmt.gif)\n\
  \n地址系统确保了准确递送到接收者。在正常的网络操作中，主机不应该接收针对其他主机的数据，因为数据包应该只被预期的接收者接收。简单来说，数据只应该被具有正确 `IP`\
  \ 和 `MAC` 地址的站点接收。然而，我们知道嗅探器确实会接收并非针对它们的数据。\n\n![realworld.eps](img/realworld_fmt.gif)\n\
  \n## 邮件递送与黑客有什么关系？\n\n在现实世界中，有时邮件不会递送给预期的接收者。我确定你都曾打开过邮箱箱，发现一封写给你的邻居或以前住在你地址的人的信封。这种情况在我家里经常发生。大多数人只会把邮件留在箱子里，让邮政递员重新递送，或者将信封物理上交给邻居。计算机网络中也可能发生同样的情况，由于递送错误或其他网络故障，应用层数据无法到达其预期的接收者。\n\
  \n预期的接收者未收到邮件的另一个原因是有人正在进行侦察并观察你的邮箱箱。假设你不在家，邮政递员将你的邮件投到了邮箱箱里。在街上或附近建筑观察邮箱箱的人可以等邮件投递后，然后从箱子里拿走邮件或仅仅是某封特定的信封。如果黑客执行了某些侦察并知道每天邮件递送的时间，这种方法将会特别有效。黑客随后可以检查并读取信封中的信息，如果他们试图掩盖踪迹，只需重新封好信封并将其放回邮箱箱即可。\n\
  \n在网络上嗅探数据的情况与此相似。数据被拦截、读取，然后发送给预期的接收者，或者直接丢弃。\n\n除了理解网络地址外，理解 `TCP` 头部的格式也很重要。图\
  \ 6-2 显示了 `TCP` 头部格式。\n\n图 6-2 TCP 头部格式\n\n![f0602.eps](img/f0602_fmt.gif)\n\n`TCP`\
  \ 头部由以下字段组成：\n\n*   **源端口 (Source Port)**：16 位，源端口号。\n*   **目的端口 (Destination Port)**：16\
  \ 位，目的端口号。\n*   **序列号 (Sequence Number)**：32 位，此段中第一个数据字节的序列号（`SYN` 存在除外）。如果 `SYN`\
  \ 存在，则序列号为初始序列号 (`ISN`)，第一个数据字节为 `ISN+1`。\n*   **确认号 (Acknowledgment Number)**：32\
  \ 位，如果 `ACK` 控制位被设置，此字段包含该段发送者期望接收的下一个序列号的值。\n*   **数据偏移量 (Data Offset)**：4 位，`TCP`\
  \ 头部中 32 位单词的数量。这指示了数据开始的位置。\n*   **预留位 (Reserved)**：6 位，预留供未来使用。必须为 0。\n*   **控制位\
  \ (Control Bits)**：6 位\n    *   `URG`：紧急指针字段有效\n    *   `ACK`：确认字段有效\n    *   `PSH`：推送功能\n\
  \    *   `RST`：重置连接\n    *   `SYN`：同步序列号\n    *   `FIN`：发送者无更多数据\n*   **窗口 (Window)**：16\
  \ 位，从确认字段中指定的字节开始的数据字节数，该段的发送者愿意接收的数量。\n*   **校验和 (Checksum)**：16 位，校验和字段是所有字段的计算结果，以确保所有数据均已接收且数据在传输过程中未被修改。\n\
  *   **紧急指针 (Urgent Pointer)**：16 位，此字段通信紧急指针的当前值，作为此段中序列号的正偏移量。紧急指针指向紧急数据之后字节的序列号。此字段仅在设置了\
  \ `URG` 控制位的段中才被解释。\n*   **选项 (Options)**：可变，选项可能会占用 `TCP` 头部末尾的空间，且长度为 8 位的倍数。\n\
  \n在引用 `TCP` 头部字段的长度时，8 位组成一个字节。一个半字节（Nibble）小于一个字节，一个字（Word）大于一个字节。\n\n在下一节中，我们将探讨嗅探器如何操作网络以捕获非预期的接收者的流量。\n\
  \n## 嗅探器的工作原理\n\n嗅探器通过捕获并非针对嗅探器系统 `MAC` 地址而是针对目标 `MAC` 地址的数据包来工作，这被称为混杂模式。通常情况下，网络上的系统只读取发送给其\
  \ `MAC` 地址的数据。然而，许多黑客工具会将 `NIC` 设置为混杂模式。在混杂模式下，`NIC` 读取所有流量。混杂模式通过安装特殊软件在网卡上启用。许多用于嗅探的黑客工具包含一个混杂模式驱动程序。并非所有的\
  \ Windows 驱动程序都支持混杂模式，因此在使用黑客工具时要确保支持该模式。\n\n任何不加密数据的协议都容易受到嗅探。`HTTP`、`POP3`、简单网络管理协议\
  \ (`SNMP`) 和 `FTP` 等协议经常被嗅探器捕获供黑客查看，以获取用户名和密码等贵贵信息。\n\n\n\n\n针对网络嗅探器的最佳安全防护是加密。虽然加密不能防止嗅探，但它使得在嗅探攻击期间捕到的任何数据变得无效，因为黑客无法解释这些信息。如\
  \ `AES`、`RC4` 或 `RC5` 等加密技术可 VPN 技术，并常用于防止网络嗅探。\n\n## 防护工具\n\n`NetIntercept` 是一种垃圾邮件和病毒防火墙。它具有高级过滤选项，并能在识别新垃圾邮件时学习和适应。它还能拦截并隔离最新的电子邮件病毒和木马，防止木马被安装并可能安装嗅探器。\n\
  \n`Sniffdet`是一套用于 TCP/IP 网络环境中远程嗅探器检测的测试集。`Sniffdet` 实现了针对混杂模式运行或带有嗅探器的机器的各种测试。\n\
  \n`WinTCPKill` 是一个适用于 Windows 的 TCP 连接终止工具。该工具需要使用嗅探器来嗅探目标的入站和出口流量。在交换网络中，`WinTCPKill`\
  \ 可以使用 ARP 缓存投毒工具执行 ARP 欺骗。\n\n## 绕过交换机的局限性\n\n由于以太网交换机的工作方式，在交换网络上进行嗅探收集有用信息更为困难。由于大多数现代网络已从集线器升级为交换机，在交换网络上进行嗅探需要更多的努力。一种方法是使用\
  \ ARP 投毒欺骗交换机将数据发送到黑客的计算机。\n\n## ARP 如何工作\n\nARP 允许网络将 IP 地址转换为 MAC 地址。当局域网上使用 TCP/IP\
  \ 的主机尝试联系另一个主机时，它需要目标主机的 MAC 地址或硬件地址。它首先查看 ARP 缓存检查是否已拥有该 MAC 地址；如果没有，它会广播一个 ARP\
  \ 请求：“谁拥有我要找的 IP 地址？”如果拥有该 IP 地址的主机听到 ARP 查询，它会返回自己的 MAC 地址，然后就可以使用 TCP/IP 开始对话。\n\
  \nARP 投毒是一种用于攻击以太网的技术，它可能让攻击者嗅探交换局域网上的数据帧，或完全停止流量。ARP 投毒利用 ARP 欺骗，其目的是向以太局域网发送虚假的或伪造的\
  \ ARP 消息。这些帧包含错误的 MAC 地址，会误导网络交换机等网络设备。结果是发往某台机器的帧可能会被错误发送到另一台机器（允许数据包被嗅探）或发送到不可达的主机（拒绝服务攻击，或\
  \ `DoS`）。ARP 欺骗也可用于中间人攻击，其中所有流量通过 ARP 欺骗转发通过一个主机，并对密码和其他信息进行分析。\n\n## ARP 欺骗和投毒防护措施\n\
  \n为了防止 ARP 欺骗，可以将网关的 MAC 地址永久添加到系统的 ARP 缓存中。你可以在 Windows 系统上通过在命令行使用 `ARP -s` 命令并附加网关的\
  \ IP 和 MAC 地址来实现这一点。这样做可以防止黑客覆盖 ARP 缓存以对系统执行 ARP 欺骗，但由于系统数量众多，在大型环境中可能难以管理。在企业环境中，可以在交换机上开启端口安全功能，允许每个交换端口仅对应一个\
  \ MAC 地址。\n\n在练习 6-1 中，你将使用 `Wireshark` 嗅探流量。\n\n### 练习 6-1：使用 Wireshark 嗅探流量\n\n\
  1. 从 [www.wireshark.org](http://www.wireshark.org) 下载并安装 `Wireshark` 的最新稳定版本。\n\n\
  2. 点击 `Capture`（捕获）菜单，选择 `interfaces`（接口）。\n\n![g0601.tif](img/g0601_fmt.jpg)\n\n\
  3. 点击显示正在发送和接收数据包的接口旁的启动按钮。如果你有多个具有数据活动的接口，请选择其中一个——最好是活动频繁的接口。\n\n4. 点击数据包以分析单个数据包。详细头部将显示在数据包捕获屏幕下方。\n\
  \n5. 展开数据包的每个头部（`IP`、`TCP`）并识别地址信息。\n\n如果在集线器而非交换机上执行此练习，将产生更多的网络流量。可以使用无线网络，因为无线局域网是一个共享网络网段，类似于集线器的工作方式。\n\
  \n## 黑客工具\n\n`Wireshark` 是一款免费的嗅探器，可以从有线或无线局域网连接捕获数据包。该软件以前称为 `Ethereal`。`Wireshark`\
  \ 是一个常用且流行的程序，因为它是免费的，但也有一些缺点。未经训练的用户可能会发现很难在 `Wireshark` 中编写过滤器来仅捕获特定类型的流量。\n\n\
  `Snort` 是一种入侵检测系统 (`IDS`)，也具有嗅探功能。它可以用于检测各种攻击和探测，例如缓冲区溢出、隐身端口扫描、通用网关接口 (`CGI`) 攻击、服务器消息块\
  \ (`SMB`) 探测和操作系统指纹识别尝试。\n\n`WinDump` 是 `tcpdump` 的 Windows 版本，`tcpdump` 是 Unix\
  \ 的命令行网络分析器。`WinDump` 完全兼容 `tcpdump`，可以根据各种规则观察、诊断并将网络流量保存到磁盘。\n\n`EtherPeek` 是一款非常强大的有线网络嗅探器，具有广泛的过滤和\
  \ TCP/IP 会话跟踪功能。`EtherPeek` 的最新版本已重命名为 `OmniPeek`。\n\n`WinSniffer` 是一款高效的密码嗅探器。它监控入站和出口网络流量，并解码\
  \ `FTP`、`POP3`、`HTTP`、`ICQ`、简单邮件传输协议 (`SMTP`)、`telnet`、互联网消息访问协议 (`IMAP`) 以及网络新闻传输协议\
  \ (`NNTP`) 的用户名和密码。\n\n`Iris` 是一种高级数据分析器，用于、组织和报告所有网络流量。\n\n## Wireshark 过滤器\n\n\
  `Wireshark` 是一款免费的嗅探器，可以从有线或无线局域网连接捕获数据包。该软件以前称为 `Ethereal`。`Wireshark` 是一个常用且流行的程序，因为它是免费的，但也有一些缺点。未经训练的用户可能会发现很难在\
  \ `Wireshark` 中编写过滤器来仅捕获特定类型的流量。\n\n`Wireshark` 是一个非常强大的工具，可以提供网络和上层数据。它使用 `pcap`\
  \ 网络库捕获数据。\n\n在练习 6-1 中，你安装了 `Wireshark` 并开始捕获数据包。为了缩小 Wireshark 收集的信息，可以使用过滤器。这些过滤器限制了捕获的信息。\n\
  \n以下是一些 Wireshark 过滤器的示例：\n\n`ip.dst eq www.wireshark.org` 设置仅捕获指向 [www.wireshark.org](http://www.wireshark.org)\
  \ Web 服务器的数据包。\n\n`ip.src == 192.168.1.1` 设置仅捕获来自 192.168.1.1 主机的数据包。\n\n`eth.dst\
  \ eq ff:ff:ff:ff:ff` 设置仅捕获二层广播数据包。\n\n`host 172.18.5.4` 设置仅捕获来自或指向 IP 地址 172.18.5.4\
  \ 的流量。\n\n`net 192.168.0.0/24` 设置仅捕获来自或指向 IP 地址范围的流量。\n\n`port 80` 设置仅捕获目标端口 80\
  \ (`HTTP`) 的流量。\n\n`port 80 and tcp[((tcp[12:1] & 0xf0) >> 2):4] = 0x47455420` 设置过滤器以捕获\
  \ HTTP GET 请求。该过滤器在 TCP 头部之后寻找字节“G”、“E”、“T”和“ ”（十六进制值 47, 45, 54 和 20）。`tcp[12:1]\
  \ & 0xf0) >> 2` 计算 TCP 头部长度。\n\n练习 6-2 展示了你如何在 Wireshark 中编写过滤器。\n\n### 练习 6-2：创建一个\
  \ Wireshark 过滤器以捕获指向或来自特定 IP 地址的流量\n\n1. 打开 `Wireshark`。\n\n2. 点击活跃的网络接口以捕获流量。\n\
  \n3. 点击 `Capture`（捕获），然后选择 `filters`（过滤器）。\n\n\n\n\n\n![g0603.tif](img/g0603_fmt.jpg)\n\
  \n4. 点击新建按钮创建一个新过滤器。\n5. 在过滤器名称字段中为新过滤器命名。\n6. 在过滤器字符串字段中输入 `host IP IPaddress`。\n\
  7. 点击 `OK`。\n8. 选择捕捉菜单并点击 `start` 开始捕获。\n\n重复上述步骤，使用以下字符串创建过滤器：\n\n`net 192.168.0.0/24`\
  \ 用于捕获进入或离开 IP 地址范围的流量。\n`src net 192.168.0.0/24` 用于捕获来自 IP 地址范围的流量。\n`dst net 192.168.0.0/24`\
  \ 用于捕获发往 IP 地址范围的流量。\n`port 53` 用于仅捕获 DNS (`port 53`） 流量。\n`host www.example.com\
  \ and not (port 80 or port 25)` 用于捕获你服务器上的非 HTTP 和非 SMTP 流量。\n`port not 53 and not\
  \ arp` 用于捕获除 ARP 和 DNS 以外的所有流量。\n`tcp portrange 1501-1549` 用于捕获端口范围内的流量。\n`not broadcast\
  \ and not multicast` 仅捕获单播流量。如果你只想查看进出你机器的流量，此方法有助于消除网络上的噪声。\n\n在 Wireshark 中练习编写过滤器，以仅捕获一种类型的协议流量或来自特定源\
  \ IP 或 MAC 地址的流量。使用你电脑的 IP 或 MAC 地址来测试过滤器是否正常工作。\n\n在尝试 CEH 考试之前，理解如何创建这些过滤器非常重要。\n\
  \n## 理解 MAC 泛洪和 DNS 欺骗\n\n交换机网络上的数据包嗅探器无法像在集线器网络上那样捕捉所有流量；相反，它捕捉来自或进入系统的流量。需要使用额外的工具来捕捉交换机网络上的所有流量。基本上有两种方法执行主动嗅探并让交换机将流量发送到运行嗅探器的系统：\n\
  \n- `ARP Spoof` 该方法涉及使用网络网关的 MAC 地址，从而在嗅探系统上接收所有旨在发往网关的流量。黑客还可以向交换机注入大量流量，使其停止作为交换机运行，而是变回集线器模式，将所有流量发送到所有端口。这种主动嗅探攻击允许运行嗅探器的系统捕捉网络上的所有流量。\n\
  \n![note.eps](img/note_fmt.gif)\n\n许多交换机已经经过修补或重新设计，不再受泛洪漏洞的影响。\n\n- `DNS Spoofing\
  \ (or DNS Poisoning)` 这种技术（DNS 欺骗）可以欺骗 DNS 服务器认为它已经收到了真实信息，而实际上并没有收到。一旦 DNS 服务器被投毒，信息通常会缓存一段时间，将攻击的影响扩散到服务器的用户。当用户请求某个网站\
  \ URL 时，会在 DNS 服务器上查找地址以找到对应的 IP 地址。如果 DNS 服务器被攻破，用户将被重定向到请求网站的其他网站，例如虚假网站。\n\n\
  要执行 DNS 攻击，攻击者利用 DNS 服务器软件的漏洞，该漏洞可以使其接受错误信息。如果服务器不正确验证 DNS 响应以确保其来自权威源，服务器最终会在本地缓存错误的条目，并向后续请求的用户提供这些条目。\n\
  \n这种技术可用于将受害者的任意内容替换为攻击者选择的内容。例如，攻击者在指定的 DNS 服务器上污染目标网站的 IP 地址 DNS 条目，将其替换为黑客控制的服务器的\
  \ IP 地址。黑客随后在该服务器上的文件创建伪条目，名称与目标服务器上的文件匹配。这些文件可能包含恶意内容，例如蠕虫或病毒。电脑引用了被投毒 DNS 服务器的用户会被欺骗，认为内容来自目标服务器，并在不知情的情况下下载了恶意内容。\n\
  \nDNS 欺骗技术类型类型如下：\n\n- `Intranet Spoofing`（内网欺骗）充当同一内部网络上的设备\n- `Internet Spoofing`（互联网欺骗）充当互联网上的设备\n\
  - `Proxy Server DNS Poisoning`（代理服务器 DNS 投毒）修改代理服务器上的 DNS 条目，使用户重定向到不同的主机系统\n- `DNS\
  \ Cache Poisoning`（DNS 缓存投毒）修改任何系统上的 DNS 条目，使用户重定向到不同的主机\n\n## 黑客工具\n\n`EtherFlood`\
  \ 用于向以太网交换机注入流量，使其变回集线器。通过这种方式，黑客能够捕捉网络上的所有流量，而不仅仅是像交换机那样仅捕捉进出其系统的流量。\n\n`dsniff`\
  \ 是一组 Unix 可执行工具，旨在执行网络审计以及网络渗透。`dsniff` 包含了以下工具：`filesnarf`、`mailsnarf`、`msgsnarf`、`urlsnarf`\
  \ 和 `webspy`。这些工具被动监控脆弱的共享网络（例如嗅探器位于外部防火墙后的局域网），寻找感兴趣的数据（密码、电子邮件、文件等）。\n\n`Sshmitm`\
  \ 和 `webmitm` 实现针对被重定向的安全 Shell (`SSH`) 和 HTTPS 会话的主动中间人攻击。\n\n`Arpspoof`、`dnsspoof`\
  \ 和 `macof` 工作于拦截交换机网络流量，由于交换机机制，这些流量通常是嗅探程序无法获取的。为了绕过二层数据包交换问题，`dsniff` 欺骗网络，使其认为它是必须通过的网关。\n\
  \n`IP Restrictions Scanner (IRS)` 用于发现为特定服务设置的 IP 限制。它结合了 ARP 投毒和 TCP 隐身扫描技术来发现访问控制列表\
  \ (ACL)、IP 过滤器和防火墙规则。\n\nsTerm 是一个 telnet 客户端，具有独特的功能：它可以在不发送真实 IP 和 MAC 地址的情况下与目标主机建立\
  \ telnet 会话。通过 ARP 投毒、MAC 欺骗和 IP 欺骗，`sTerm` 可以有效绕过 ACL、防火墙规则和 IP 限制。\n\n`Cain &\
  \ Abel` 是适用于 Windows 的功能黑客工具。它通过嗅探网络恢复各种密码；使用字典或暴力破解破解加密密码；记录网络语音 (VoIP) 对话；解码加密密码；发现缓存密码；分析路由协议。最新版本包含了许多新功能，例如\
  \ ARP 投毒路由 (`APR`)，它能够在交换局域网中进行嗅探。该版本的嗅探器还可以分析加密协议，如 SSH-1 和 HTTPS，并包含了各种身份验证机制的过滤器。\n\
  \n`Packet Crafter` 是用于创建自定义 TCP/IP/UDP 包的工具。该工具可以更改包的源地址进行 IP 欺骗，并控制 IP 标志（如校验和）和\
  \ TCP 标志（如状态标志、序列号和确认号）。\n\n`SMAC` 是用于更改系统 MAC 地址的工具。它让黑客在执行攻击时可以欺骗 MAC 地址。\n\n\
  `MAC Changer` 是在 Unix 上用于欺骗 MAC 地址的工具。它可以将网络接口设置为特定的 MAC 地址、随机设置 MAC、设置另一个厂商的 MAC、设置同一厂商的其他\
  \ MAC、设置同类型的 MAC，或显示供选择的厂商 MAC 列表。\n\n`WinDNSSpoof` 是一个适用于 Windows 的简单 DNS ID 欺骗工具。要在交换机网络上使用它，你必须能够嗅探攻击计算机的流量。因此，它可能需要与\
  \ ARP 欺骗或泛洪工具配合使用。\n\n\n\n\n\n分布式 DNS 洪水通过发送大量查询来创建 DoS 攻击，导致 DNS 瘫。如果 DNS 守护程序记录了错误的查询，这种攻击的影响将被放大。\n\
  \n## 总结\n\n嗅探是 CEH（认证伦理黑客）工具包中不可或缺的工具。嗅探可以用于被动收集信息并捕获密码等珍贵数据。嗅探的优势是它可以被动进行，且在被动模式下使用时几乎无法被检测。如果被动嗅探无法获得\
  \ CEH 想要收集的信息，则可以使用更具攻击性的嗅探方法，例如 ARP 投毒和 DNS 欺骗。但请注意，这些主动方法可能会被检测到并警报安全人员网络正受到攻击。\n\
  \n## 考试要点\n\n*   理解嗅探器的工作原理。嗅探器在混杂模式下运行，这意味着它无论数据帧中指定的目标 MAC 地址是什么，都会捕获所有流量。\n*\
  \   理解在通过集器器连接的共享网络与交换机网络中进行嗅探的区别。所有流量都由集器器广播，但会由交换机进行分段。要在交换机网络上进行嗅探，必须使用泛洪或 ARP\
  \ 欺骗工具。\n*   了解数据包（packets）和帧（frames）的区别。数据包在 OSI 模型的第 3 层创建，而帧在第 2 层创建。\n*   理解地址解析协议（ARP）的工作原理。ARP\
  \ 通过在网络上广播请求，根据已知的 IP 地址查找 MAC 地址。\n*   了解主动嗅探和被动嗅探的区别。主动嗅探用于欺骗交换机使其表现像集器器一样工作，从而将流量转发给攻击者。被动嗅探则捕获已经在共享网络上广播的数据包。\n\
  \n## 复习题\n\n1. 什么是嗅探？\nA. 在网络上发送损坏的数据以欺骗系统\nB. 捕获并破解网络上的流量\nC. 破坏目标系统上的 ARP 缓存\n\
