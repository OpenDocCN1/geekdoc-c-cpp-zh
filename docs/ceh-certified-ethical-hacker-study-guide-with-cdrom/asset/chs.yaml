  \    B. 异常检测\n    C. 流量识别\n    D. 协议分析\n\n11. 你正在查看一份 snort 输出报告，看到一个具有以下地址信息的条目：`168.175.44.80:34913\
  \ -> 142.155.44.28:443`。目标地址是什么类型的服务器？\n    A. HTTP\n    B. FTP\n    C. SSL\n  \
