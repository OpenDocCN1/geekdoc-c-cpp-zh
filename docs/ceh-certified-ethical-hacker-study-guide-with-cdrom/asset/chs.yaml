  D. 可写的用户主目录\n\n### 19. 使用哪个 Cat 命令可以加固 Linux 系统的文件系统？\nA. `Cat\"source=All:destination=All\"\
  \ >> /etc/hosts.deny`\nB. `Cat\"All:All\" >> /etc/hosts.deny`\nC. `Cat\"Any:Any\"\
  \ >> /etc/hosts.deny`\nD. `Cat\"All:All\" /etc/hosts.deny`\n\n### 20. 应该检查哪个文件以确保\
  \ Linux 系统中的用户没有空密码？\nA. 密码文件 (Password file)\nB. Passwd 文件\nC. Shadow 文件\nD. Shdw\
  \ 文件\n\n## 复习题答案\n1. A. `LKM` 代表 `Linux Kernel Module`（Linux 内核模块）。\n2. D. `g++\
