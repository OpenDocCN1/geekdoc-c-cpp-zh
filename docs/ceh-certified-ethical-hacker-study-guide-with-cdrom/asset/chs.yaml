  \ 产品的信息，请拨打 `(877) 762-2974`。\n\n## 术语表\n\n### A\n\n**访问控制列表 (ACL)**：一张表，维护了授予用户或组关于文件目录、单个文件或网络资源访问的详细权限或访问权限列表。\n\
  \n**接入点 (AP)**：一种创建无线连接中心点的无线通信硬件设备。\n\n**主动攻击 (active attack)**：可以被检测到的攻击，因此被认为留下了痕迹。\n\
  \n**活动目录 (AD)**：一种 Windows 目录，存储有关网络上资源的信息，并提供了一种集中组织、管理和控制这些资源访问的方法。\n\n**地址解析协议\
  \ (ARP)**：一种 TCP/IP 协议，用于根据提供的 IP 地址解析节点的物理地址。\n\n**代理程序 (agent)**：执行指定函数的软件例程，例如在后台等待并在指定事件发生时执行某操作。\n\
  \n**匿名器 (anonymizer)**：一种允许用户在不被代理服务器检测到的情况下访问其他网站的网站。\n\n**匿名的 (anonymous)**：没有已知的名称、身份或来源。\n\
  \n**反木马软件 (anti-Trojan)**：专门设计用于帮助检测和移除木马病毒的软件。\n\n**防病毒软件 (antivirus)**：尝试识别、防止和移除计算机中病毒的程序。\n\
  \n**存档 (archive)**：包含历史价值记录、文档或其他材料的地方或集合。\n\n**审计 (auditing)**：检查计算机系统以验证程序并查看数据是否损坏或显示不准确。\n\
  \n### B\n\n**后门 (backdoor)**：为了允许访问而故意留在系统安全性中的漏洞。黑客在系统被破解后可能会创建后门。\n\n**横标抓取 (banner\
  \ grabbing)**：一种允许黑客识别目标服务器运行的操作系统或应用程序的技术。获取横标的请求通常会被防火墙允许，因为它使用了 Telnet 等合法连接请求。\n\
  \n**黑帽 (black hat)**：恶意黑客。\n\n**黑盒测试 (black-box testing)**：在未知内部结构的情况下对系统或网络进行测试。\n\
  \n**缓冲区 (buffer)**：用于存储数据的内存区域。\n\n**缓冲区溢出 (buffer overflow)**：程序写入分配的缓冲区空间之外的情况。这会导致其他有效内存被覆盖。缓冲区溢出可能是由于漏洞、配置不当以及接收程序输入时缺乏边界检查引起的。\n\
  \n**缺陷 (bug)**：触发特定程序故障的软件或硬件错误。\n\n### C\n\n**缓存 (cache)**：一种快速存储缓冲区，如位于计算机中央处理器。\n\
  \n**调用过程 (calling procedure)**：将控制权传递给另一个软件例程的软件例程。当这些例程位于不同的计算机上时，系统通常使用远程过程调用\
  \ (`RPC`) 库。也指函数调用和子程序。\n\n**证书颁发机构 (CA)**：发布数字证书的组织或程序。\n\n**客户端 (client)**：访问远程计算机远程服务的系统或软件进程。\n\
  \n**通用网络文件系统/服务器消息块 (CIFS/SMB)**：Microsoft Windows 和 IBM OS/2 操作系统使用的文件共享标准。\n\n\
  **措施 (countermeasure)**：为了抵消另一种行动而采取的行动。通常是对漏洞的修复。\n\n**隐蔽通道 (covert channel)**：以非标准方式传输通信的通道，通常难以被检测。这种通信形式经常通过以非预期方式使用通道来违反安全策略。\n\
  \n\n\n\n\n### C\n`cross-site scripting` 跨站脚本。一种用于执行恶意脚本的计算机安全漏洞。\n\n- `daemon` 守护进程。驻留在计算机上并处理请求的后台程序。\n\
  - `database` 数据库。为了便于访问和分析而组织的数据集合。\n- `decryption` 解密。将加密数据转换为明文的过程。\n- `demilitarized\
  \ zone (DMZ)` 非军事化区。位于组织内部网络和外部网络（通常是互联网）之间的网络区域。大多数公开的服务器（如 Web 服务器和 FTP 服务器）都位于\
  \ DMZ 中。\n- `digital certificate` 数字证书。包含个人信息的凭据，如名称、公钥、过期日期以及颁发证书的证书机构机构的数字签名。\n\
  - `digital signature` 数字签名。使用个人私钥加密的消息哈希值。用于验证消息的真实性。\n- `DNS enumeration` DNS 遍历。从\
  \ DNS 服务器中定位 DNS 记录。\n- `domain name` 域名。在互联网上识别公司或机构的唯一名称。\n- `Domain Name System\
  \ (DNS)` 域名系统。将字母域名转换为数字 IP 地址的名称解析系统。\n\n### E\n- `encryption` 加密。尝试对信息进行编码以防止未经授权访问的过程。\n\
  - `enumeration` 遍历。创建项目列表或清单。\n- `Ethernet` 以太网。一种用于局域网（LAN）的基于帧的计算机网络技术。它定义了物理层的布线和信号、帧格式，以及\
  \ OSI 模型中介质访问控制（MAC）和数据链路层的协议。\n- `exploit` 漏洞利用。利用计算机程序安全漏洞的定义程序或程序。\n- `Extended\
  \ Stack Pointer (ESP)` 扩展栈指针。用于访问作为参数传递给子程序的参数的位置标识符。\n\n### F\n- `Fiber Distributed\
  \ Data Interface (FDDI)` 光纤分布式数据接口。局域网数据传输的标准。\n- `File Allocation Table (FAT)`\
  \ 文件分配表。用于 DOS、Windows 和 OS/2 的文件系统。它跟踪数据在磁盘上的存储。\n- `firewalking` 防火墙探测。一种收集受防火墙保护的远程网络信息的方法。防火墙探测使用类似路由跟踪的\
  \ IP 数据包分析，确定数据包是否能从攻击者主机通过数据包过滤设备/防火墙到达受害者主机。\n- `firewall` 防火墙。为执行访问控制列表（ACL）而创建的规则，旨在防止对私有网络的未经授权访问。\n\
  - `footprinting` 足迹扫描。收集目标信息以识别弱点。\n- `fragmentation` 分片。将较大的消息拆分为较小的块，以便更高效地发送或存储数据。\n\
  - `FreeBSD` 一种基于 Unix 的免费开源操作系统。\n- `File Transfer Protocol SSL` 文件传输协议 SSL。一种安全形式的\
  \ FTP 软件，使用安全套接层/传输层安全（SSL/TLS）协议来保护控制连接和数据连接。\n\n### G\n- `gateway` 网关。能够决策的软件或硬件，根据通用规则允许或拒绝访问。防火墙是第\
  \ 3 层和第 4 层网关。\n- `GET` 一种用于从 Web 服务器请求文件的 HTTP 命令。\n- `gray hat` 灰帽。根据需要将技能用于防御或攻击目的的黑客。\n\
  \n### H\n- `hacktivism` 黑客行动主义。为了某种目的而黑客——例如，为了关闭儿童色情网站而进行黑客攻击。\n- `hash` 哈希。将字符字符串转换为称为消息摘要数字的函数。\n\
  - `Hierarchical File System (HFS)` 层次结构文件系统。用于 Mac OS X 的文件系统。它以从上到下的组织结构存储数据。\n\
  - `honeynet` 蜜罐网络。呈现为大型蜜罐的整个虚拟网络。\n- `honeypot` 蜜罐。设计用于吸引探测、攻击和潜在利用的系统。由于蜜罐会吸引攻击，它们可能会成为负担。然而，通过在网络上部署蜜罐，你可以获得有关恶意黑客甚至脚本小子如何访问系统的海量信息。这些信息可以改进安全性和或帮助安全专业人员追踪黑客。\n\
  - `hybrid attack` 混合攻击。一种结合了暴力破解和字典攻击特征的密码攻击。混合攻击的特点包括使用字典词项，用数字或特殊字符代替字母，或在单词后附加数字。\n\
  - `Hypertext Transfer Protocol (HTTP)` 超文本传输协议。一种促进浏览万维网的通信协议。\n- `Hypertext Transport\
  \ Protocol Secure (HTTPS)` 安全超文本传输协议。HTTP 协议的安全版本，用于访问安全的 Web 服务器。\n\n### I\n- `Institute\
  \ of Electrical and Electronics Engineers (IEEE)` 电气电子工程师学会。一个组织（有时称为 IEE），创建有助于社会技术使用进步的标准。它包括工程师、科学家和学生。\n\
  - `Internet Control Message Protocol (ICMP)` 互联网控制消息协议。一种用于发送错误和控制消息的封装 IP 包。`ping`\
  \ 命令使用 ICMP 回请求和 ICMP 响应来验证连通性。\n- `Internet Protocol Security Architecture (IPSec)`\
  \ IP 安全架构。一种层协议，在互联网上提供带有身份验证和加密的安全隧道通信。它通常用于创建虚拟网络（VPN）。\n- `intrusion detection\
  \ system (IDS)` 入侵检测系统。一种监控通过计算机网络的数据包的机制。IDS 可以作为系统进出交易的安全检查进行监控。\n- `iris scanner`\
  \ 虹膜扫描仪。一种带有小型摄像机的生物识别设备，通过检查眼睛虹膜进行认证。\n\n### K\n- `Kerberos` 一种计算机网络身份验证协议。\n-\
  \ `keylogger` 键盘记录器。一种记录用户输入信息的软件或硬件设备。数据保存在日志文件中，黑客可以检索这些文件。\n\n### L\n- `Lightweight\
  \ Directory Access Protocol (LDAP)` 轻量级目录访问协议。用于访问简单目录结构的协议。\n- `local area network\
  \ (LAN)` 局域网。由地理区域内的系统节点和外围设备组成。\n- `logic bomb` 逻辑炸弹。只有在系统或程序环境中满足特定条件时释放延迟负载的程序。\n\
  \n### M\n- `malicious` 故意有害。\n- `mantrap` 人笼。通常用于高安全性设施的安全入口。陷阱通常涉及一系列必须通过的门，入侵者可以通过锁门被扣留。\n\
  - `Multipurpose Internet Mail Extensions (MIME)` 多用途邮件扩展。一种允许在邮件中传输多种形式数据（如音频、二进制或视频）的通信协议。\n\
  \n### N\n- `NetBSD` 第一种自由发布的开源 BSD Unix 操作系统。\n- `Network Address Translation (NAT)`\
  \ 网络地址转换。将多个 IP 地址映射到属于 NAT 设备的单个 IP 地址的技术。这种方法经常用于连接多个计算机到互联网。\n- `Network Basic\
  \ Input/Output System (NetBIOS)` 网络基本输入输出系统。一种提供 PC 与网络之间通信的接口。它由 IBM 创建并被微软采用。NetBIOS\
  \ 包含名称服务、会话服务和数据报服务。\n- `network interface card (NIC)` 网卡。一种为物理介质或介质类型提供上层通信的物理和二层设备。也称为网络适配器。\n\
  - `network scanning` 网络扫描。枚举网络可用主机或 IP 地址。\n- `NOP` 无操作。一种告诉处理器什么都不做的命令。几乎所有处理器都有执行空操作的\
  \ NOP 指令。在 Intel 架构中，NOP 指令长度为字节，在机器码中翻译为 `0x90`。长段 NOP 指令称为 NOP 滑块或滑块。CPU 在回到主事件（位于返回指针之前的事件）之前什么都不做。\n\
  - `NT LAN Manager (NTLM)` NT LAN 管理器。一种用于多种微软网络协议中身份验证目的的挑战/响应身份验证协议。\n\n\n\n\n\n\
  ### null session 空会话 匿名用户在未识别的系统中对网络共享进行的未经身份验证的连接。\n\n### O\n### Open Systems Interconnection\
  \ (OSI) 开放系统体系国际标准组织（ISO）创建的一种标准，它描述了在两个网络设备之间交换数据时具有不同职责的七层体系结构。\n### OpenBSD 一种基于\
  \ Unix 的开源操作系统，具有许多可用的安全措施。\n### overt channel 明明信道 计算机系统或网络内部可见且定义的通信路径，用于数据传输。\n\
  \n### P\n### passive attack 被动攻击 一种在不直接与系统交互的情况下违反系统安全的攻击。\n### password cracker\
  \ 密码破解器 设计用于解码密码的程序。\n### patch 补丁 用于修复计算机程序中漏洞的短指令集。\n### personal identification\
  \ number (PIN) 个人识别码 在双重身份验证时经常作为次要身份的字母数字值。\n### phraselist 密码句列表 密码破解工具用于尝试破解密码时使用的密码短语列表。\n\
  ### physical security 物理安全 用于防止攻击者访问设施、资源或存储在物理介质上的信息的非数字方法和机制。它可以简单如锁上的门，也可以复杂如包括武装守在内的多层安全防护。\n\
  ### ping 一种常见的连接验证工具，使用 `ICMP` 消息测试目标的响应。它被称为“分组网络分组器”（Packet InterNet Groper）。\n\
  ### ping sweep Ping 扫描 对 IP 地址范围进行扫描，显示哪些 IP 地址正在使用，哪些未使用。Ping 扫描可能包括为每个活动 IP 地址检索\
  \ `DNS` 名称。\n### Point-to-Point Protocol (PPP) 点点协议 一种用于用户和 ISP 之间的串行链路上传输 IP 包的协议。\n\
  ### policy 策略 组织指定的作为行为、操作或性能基础的一系列规则和条例。\n### port scanning 端口扫描 通过探测端口并查看系统响应来识别运行在系统上的服务。这种技术可以用于发现指示计算机或网络设备弱点的服务。\n\
  ### POST 用于向 Web 服务器发送文本以进行处理的 HTTP 命令。\n### Post Office Protocol 3 (POP3) 邮局协议\
  \ 3 邮件客户端程序从邮件服务器检索邮件的标准接口。\n### Pretty Good Privacy (PGP) 良好的隐私保护 一个为电子邮件和文件存储应用提供加密例程的软件包。\n\
  ### private key 私钥 执行公钥加密公式的一半。它用于创建数字签名并解密用相应的公钥加密的数据。\n### probing 探测 彻底的调查或检查。\n\
  ### process 进程 在内存中执行时具有唯一可标识性的实体。\n### protocol 协议 控制并启用通信、连接和数据传输的约定或标准。\n###\
  \ proxy server 代理服务器 代表其他运行的系统。代理服务器通常是网络的焦点，可能包含防火墙。\n### public key 公钥 执行公钥加密公式的一半。用人的公钥加密的消息只能用个人的私钥解密。\n\
  \n## R\n### remote access 远程访问 一种通过电话线或互联网从远程位置访问系统或网络的通信方法。\n### Request for Comments\
  \ (RFC) 征意见 对感兴趣的话进行专业讨论的征求。在开发互联网社区使用的协议、系统或程序标准时，通常会发布 RFC。\n### rootkit Root\
  \ 后门 入侵者在访问计算机系统后使用的工具集。这些工具协助攻击者实现各种恶意目的。Rootkit 已针对所有常见的操作系统（包括 Linux、Solaris\
  \ 和 Windows）以及连接网络的游戏系统进行了开发。\n\n## S\n### script 脚本 包含有序命令的文本文件，用户可以在键盘上交互式地执行。\n\
  ### Secure Hash Algorithm (SHA) 安全哈希算法 一种加密消息摘要算法，类似于 Ron Rivest 开发的哈希函数消息摘要族。\n\
  ### Secure Shell (SSH) 安全外壳 使用 OSI 模型第 7 层为 Windows 和 Unix 生成安全登录的软件。\n### Security\
  \ Accounts Manager (SAM) 安全账户管理器 Windows 架构中存储用户名、密码和权限的数据库。\n### security token\
  \ 安全令牌 用于多因素身份验证的小型物理设备，可以存储加密密钥和/或用于身份验证的生物识别数据。\n### Sendmail 用于 Unix 的 `SMTP`\
  \ 实现。\n### Serial Line IP (SLIP) 串行线路 IP 一种用于拨号接入 `TCP/IP` 网络的通信协议。它通常用于访问互联网，以及在局域网之间提供拨号访问。\n\
  ### server 服务器 网络中为客户端应用程序和/或计算机提供服务的计算机系统。\n### Server Message Block (SMB) 服务器消息块\
  \ 一种用于在计算机之间共享文件、打印机、串行端口以及命名管道和邮件槽等通信抽象的协议。\n### session 会话 用户与系统之间或两台计算机之间的活动通信。它也指\
  \ OSI 模型第 5 层（会话层）。\n### sheep dip 消毒站 一台安装杀病毒软件的独立计算机，在严格控制的规范下用于在介质设备连接到网络之前进行检查。\n\
  ### shell Shell 命令行语言解释器，是操作系统内核与用户之间的接口。\n### shellcode 壳码 可以与操作系统交互后退出的汇编代码。黑客经常使用\
  \ shellcode 来启动漏洞，例如基于栈的溢出。\n### shredding 碎碎 物理破坏硬盘盘片，以确保内容永远无法恢复。\n### Simple\
  \ Mail Transfer Protocol (SMTP) 简单邮件传输协议 发送电子邮件时使用的网络协议。\n### Simple Network Management\
  \ Protocol (SNMP) 简单网络管理协议 一种应用层协议，用于促进网络设备管理信息库 (`MIB`) 中管理信息的设置/读取。\n### Simple\
  \ Object Access Protocol (SOAP) 对象对象协议 一种使用 HTTP 或 SMTP 作为传输交换 XML 基消息的协议。\n###\
  \ smart card 智能卡 嵌入微处理器和存储空间的设备，通常配合访问代码进行基于证书的身份验证。\n### social engineering 社会工程\
  \ 利用人类本性的弱点欺骗人员泄露用户 ID、密码或其他机密艺术。\n### spyware 间谍软件 意在未经用户许可的情况下干预或监控计算机使用的恶意软件。恶意软件不会像蠕虫和木马那样自我复制。\n\
  ### steganography 隐写术 在图像、音频或视频文件中隐藏信息的实践。它是隐蔽信道的一种形式。\n### System Integrity Verifier\
  \ (SIV) 系统完整性验证器 监控系统文件哈希以确定文件是否被更改，例如入侵者修改或覆盖了系统文件。Tripwire 是最流行的 SIV 之一。\n\n##\
  \ T\n### TCP/IP 一组为 OSI 模型第 3 层和第 4 层通信定义的协议族。TCP/IP 是计算机在互联网上通信的标准通信方法。\n### Telnet\
  \ 用于与计算机创建远程会话的应用。\n### Temporal Key Integrity Protocol (TKIP) 密钥完整性协议 IEEE 802.11i\
  \ 和 WPA 定义的 Wi-Fi 网络加密标准，旨在取代 WEP。TKIP 的结构旨在不替换旧硬件的情况下提供更安全的解决方案。\n### third party\
  \ 第三方 在委托人之间的交易或其他关系中间接参与的人、小组或企业。\n### threat 威胁 具有对信息系统造成危害能力的故意或无意行为。\n### time\
  \ bomb 时间炸弹 逻辑炸弹的一种，具有延迟负载，通过达到某个预设时间触发，可以一次或定期触发。\n\n\n\n\n\n# 生存时间 (TTL)\n`IP`\
  \ 头部中的一个字段，表示传输的数据包的有效时间。`TTL` 定义了数据包在被丢弃之前可以经过的路由器跳数。如果数据包被路由器丢弃，则会向发送者生成一个 `ICMP`\
  \ 错误消息。\n\n# 时间戳\n一个表示日期和时间的数字。记录时间戳对于跟踪计算机上发生的事件至关重要。\n\n# 路由追踪\n一种用于追踪到目标系统路径的工具。\n\
  \n# 流量\n跨越网络介质进行传输的数据。\n\n# 木马\n一个看似有用或无害的程序，但实际上包含嵌入的隐藏代码，用于利用或破坏运行该程序的的计算机。\n\n\
  # 隧道技术\n将一个协议或会话封装在另一个协议的数据结构中。\n\n# 隧道病毒\n一种试图隧道到防病毒软件下方以避免被检测的病毒。\n\n# U\n## 统一资源定位符\
  \ (URL)\n定义 Web 服务器（`HTTP` 服务器）上文件路径的地址。\n\n## 用户数据报协议 (UDP)\n运行在 `OSI` 模型第 4 层的无连接、不可靠的\
  \ Internet 协议。\n\n# V\n## 病毒\n旨在破坏用户计算机的恶意代码。病毒是寄生性的，附着在其他文件或引导扇上。它们需要文件的移动来感染其他计算机。\n\
  \n## 病毒欺骗信息\n以病毒之名进行的恐吓。创建者试图引起恐惧，有时会鼓励用户删除系统文件。\n\n## 病毒特征码\n形成可识别二进制模式的唯一位串。这种模式就像指纹一样，可用于检测和消灭病毒。\n\
  \n## 漏洞\n计算机软件、操作系统或架构中的错误或故障，这些可以被利用，从而导致系统遭到破坏。\n\n### 漏洞扫描\n在网络上搜索具有已知漏洞的设备、进程或配置。\n\
  \n# W\n## 自动拨号器\n一种恶意应用程序，在随机拨打电话号码的同时尝试检测计算机调制调器的响应。\n\n## WiFi 涂鸦\n一种通过在公共场所（任何人都可以轻易进入的地方）绘制符号，为他人识别\
  \ `Wi-Fi` 网络的关键特征，并鼓励开放访问的技术。\n\n## Web 服务器\n通过 `HTTP` 协议向浏览器交付网页并向应用程序交付其他文件的计算机。\n\
  \n## Web 爬虫\n扫描网站以获取特定信息（如电子邮件帐户）。\n\n## 白盒测试\n在已知内部结构的情况下对软件、系统或网络进行测试。也称为玻璃盒测试。\n\
  \n## Wi-Fi\n来自 `Wi-Fi` 联盟的一种认证，用于促进 `802.11` 网络（包括 `802.11a`、`802.11b`、`802.11g`\
  \ 和 `802.11n`）无线设备的互操作性。该术语由 `Wi-Fi` 联盟普及。\n\n## 有线等加密 (WEP)\n一种无线局域网（`WLAN`）的技术过时协议。`WEP`\
