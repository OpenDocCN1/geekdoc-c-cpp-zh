  - "[PAGE 7]\n\n![](img/364f62702bba0f9efdd5ce92b1a6d6f9_7_0.png)\n\n# # What Does\
    \ Code Look Like?\n\nEvery coding language looks slightly different. Many use\
    \ symbols and special acronyms. Often, programming instructions may be tough to\
    \ read for an untrained coder. Here is an example from the Java programming language.\
    \ This code writes the words “Hello World!” on the screen. Writing a “Hello World”\
    \ program is a common first step for coders studying a new programming language.\n\
    \n```\n```java\npublic class HelloWorld\n{\n    public static void\nmain(String[]\
    \ args) {\n        System.out.\nprintln(\"Hello World!\");\n    }\n}\n```\n```\n\
    \na way that a computer can understand. Coders write in a variety of different\
    \ programming languages. These languages use different sets of words, numbers,\
    \ and symbols to make up their instructions. Hundreds of programming languages\
    \ are in use today.\n\nModern computers have been around for only a few decades,\
    \ but the idea of programming languages has a long history. One of the first people\
    \ to think about coding was the pioneering Ada Lovelace. She carried out her work\
    \ in the early 1800s."
