    - 楚泽，康拉德，9，10\n\n惊人的技术突破时刻都在发生。科学家和工程师将新想法变为现实，企业则将其付诸实践。《科技快讯：高科技》探索了一些正在改变现代世界的非凡设备和系统。探索这些高科技发明的历史、发明者在过程中遇到的障碍，以及这些技术如何融入社会文化。每本书都包含快速事实、词汇表、索引以及获取更多信息的资源。\n\
    \n## 编程\n\n编程是用计算机能理解的语言向计算机发出指令的过程。它释放了现代技术的力量，使计算机能够完成程序员所能设想的任何任务。学习编写代码正成为我们高科技世界中一项重要技能。\n\
