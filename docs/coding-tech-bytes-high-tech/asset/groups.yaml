    # # A World of Computers


    For hundreds of years, machines have made life easier for people. In the 1800s,
    trains made it easier to move cargo and passengers over long distances. In the
    1900s, home appliances made it easier to store and prepare food. Today, the machine
    that makes the biggest difference in people’s everyday lives is the computer.


    Computers make a wide assortment of tasks easier. People use them to send and
    receive messages, pictures, and videos. Students use them to write papers, and


    workers use them to create budgets. Computers are used for relaxation, too. People
    watch movies and play games on them. One of the most useful things about computers
    is that they can be used for so many tasks. This flexibility comes from programs
    and coding.


    A program is a set of instructions that a computer carries out. Some programs
    let users create documents or spreadsheets. Other programs play movies or music.
    Some are thrilling video games. Coding is the process of writing the instructions
    that'
