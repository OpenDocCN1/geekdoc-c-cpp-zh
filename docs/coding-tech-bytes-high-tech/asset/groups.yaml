    \ |\n\n## 目录\n\n- **第1章：** 计算机的世界 — 4\n- **第2章：** 什么是代码？ — 14\n- **第3章：** 现实世界中的编程\
    \ — 22\n- **第4章：** 面向未来的编程 — 31\n- **术语表** — 43\n- **更多信息** — 44\n- **索引** — 46\n\
    - **关于作者** — 48\n\n注：文中以**粗体**显示的词语在术语表中有定义。\n\n## 计算机的世界\n\n数百年来，机器让人们的生活更加便利。19世纪，火车让长途运输货物和乘客变得更加容易。20世纪，家用电器让储存和准备食物变得更加方便。如今，对人们日常生活影响最大的机器是计算机。\n\
    \n计算机让各种各样的任务变得更容易。人们用它们发送和接收消息、图片和视频。学生用它们写论文，工作人员用它们制作预算。计算机也用于放松。人们在上面看电影、玩游戏。计算机最有用的特点之一是它们可以用于如此多的任务。这种灵活性来自程序和编程。\n\
    \n程序是计算机执行的一组指令。有些程序让用户创建文档或电子表格。其他程序播放电影或音乐。有些则是刺激的电子游戏。编程是编写构成这些程序的指令的过程。通过构思新型程序，程序员拓展了计算机的潜力。\n\
    \n![](img/364f62702bba0f9efdd5ce92b1a6d6f9_6_0.png)\n\n*计算机和平板电脑出现在美国大多数学校和家庭中。*\n\
    \n计算机无法理解用普通英语写成的指令。程序员必须学会以计算机能理解的方式编写程序。程序员用各种不同的编程语言编写程序。这些语言使用不同的单词、数字和符号组合来构成指令。如今有数百种编程语言在使用中。\n\
    \n### 代码长什么样？\n\n![](img/364f62702bba0f9efdd5ce92b1a6d6f9_7_0.png)\n\n每种编程语言看起来都略有不同。许多语言使用符号和特殊缩略词。对于未受过训练的程序员来说，编程指令往往可能难以阅读。下面是\
    \ Java 编程语言的一个示例。这段代码在屏幕上写出“Hello World!”这几个字。编写“Hello World”程序是程序员学习一门新编程语言时常见的第一个步骤。\n\
    \n```java\npublic class HelloWorld {\n    public static void main(String[] args)\
    \ {\n        System.out.println(\"Hello World!\");\n    }\n}\n```\n\n现代计算机出现只有几十年，但编程语言的思想已有悠久历史。最早思考编程的人之一是先驱阿达·洛芙莱斯。她在19世纪初开展了自己的工作。\n\
    \n### 创造最初的代码\n\n洛芙莱斯出生于1815年。她接受的是非传统的成长教育。与同时代大多数女孩不同，她受到鼓励去学习数学和科学。在学习期间，她结识了科学家查尔斯·巴贝奇。巴贝奇设计了一种可用于数学计算的机械装置。\n\
    \n巴贝奇的机器被称为差分机。它与今天的计算机大不相同。它不使用电力、电路和微芯片，而是使用杠杆和齿轮。它可以快速完成一个人手工计算需要数小时的数学问题。用户会为问题设置装置的初始参数，然后转动曲柄让机器运转起来。\n\
    \n然而，完整的机器在巴贝奇有生之年并未建成。\n\n### 你知道吗？\n\n> 阿达·洛芙莱斯是英国著名诗人拜伦勋爵的女儿。阿达年幼时，拜伦离开了家庭。她的母亲担心阿达会像父亲一样喜怒无常、难以捉摸。她认为让阿达专注于学习数学和科学可以防止这种情况。\n\
    \n### 制造更复杂的机器\n\n自洛芙莱斯时代以来，计算机和编程已经取得了长足发展。20世纪40年代，德国发明家康拉德·楚泽创造了被认为是第一台现代计算机的机器。它被称为\
    \ Z3，能够存储并执行指令。\n\n美国编程先驱格蕾丝·霍珀在第二次世界大战期间从事早期计算机工作。她后来帮助开发了 UNIVAC I 计算机和一种名为\
    \ COBOL 的编程语言。霍珀曾在美国海军预备役服役，帮助美国海军开发和使用早期计算机。她最终晋升为海军少将。\n\n![](img/364f62702bba0f9efdd5ce92b1a6d6f9_10_0.png)\n\
