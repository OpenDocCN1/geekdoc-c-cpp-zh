    ## Linus Torvalds


    When most people get a new computer, they use whatever operating system the computer
    comes with. Today’s most common operating systems are Windows and macOS. Another
    popular operating system, Linux, dates back to 1991. In that year, a Finnish student
    named Linus Torvalds decided he could make his own operating system. It soon became
    known as Linux. Torvalds made it free to use. Torvalds’ major innovation was that
    it was easy for other coders to make changes to Linux. These changes are shared
    online. Over time, the development of Linux split into several different branches.
    Different groups of coders took the operating system in different directions.
    These different versions of Linux are known as distributions. Major distributions
    used today include Fedora and Ubuntu.


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_22_0.png)


    *Torvalds with the mascot of Linux, a penguin*


    Thinking like a programmer is useful for more than just coders. Thinking logically,
    splitting up problems, and collaborating with others are good things for anyone
    to do when working on any sort of daily task.


    ## Coding in the Real World


    Coding is literally all around us. Because most of the world runs on computers,
    coding is an important part of keeping information safe and secure. But criminals,
    sometimes called hackers, can use their coding skills to break the law. Coding
    skills are also valuable at major businesses for keeping track of vast amounts
    of data. At the same time, code plays a role in entertaining people, making amazing
    special effects possible.


    ### Encryption


    Security is a major issue online. People may send e-mails about sensitive information.
    They may look up personal health-care data or access their bank accounts. If these
    systems were not secure, someone may be able to steal data or even money. Luckily,
    coders have developed **encryption** programs to help keep information safe online.


    Encryption software works by obscuring the true contents of messages sent online.
    For instance, a program might turn each letter in a message into another letter.
    Every *A* may become a *B*, and every *N* may become a *Q*. The word *an* would
    appear as *bq* instead. The person receiving the message would have software that
    knows which letters are which. The message would be unscrambled. But if a person
    intercepted the message, they would see only the unreadable encrypted message.


    Programmers who work on encryption software have to adapt to new situations. Criminals
    or spies may attempt to break the encryption systems. If they succeed, they can
    read the encrypted text, which may include passwords, bank account numbers, and
    sensitive information. Encryption software has to be on the cutting edge at all
    times to keep data safe.


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_25_0.png)


    Online banking and shopping require encryption to keep people’s data safe.


    ### Apps that Save Lives


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_24_0.png)


    Part of being a programmer is thinking of how real-world problems can be solved
    using code. Some of these problems are simple. For example, a person who needs
    to keep a budget may develop a budgeting program. Other types of programs may
    be designed to save lives. One such app has information on how to survive a natural
    disaster. Another has a host of first aid information in case of an emergency.
    Many apps are also designed for use by doctors, especially in rural areas. Some
    apps can be used to help with the diagnosis of a disease. For example, an app
    was developed to identify instances of milky eyes in pictures. This can be a sign
    of a type of eye cancer. By always looking out for problems in the world, programmers
    can create software that helps people live safer and healthier lives...


    ### Hacking


    Not all programmers have good intentions. Some programs are specifically designed
    to let users get access to information they aren’t supposed to see. Other programs
    are designed to annoy users or even steal money. These are known as malware. One
    major type of malware is known as a virus.


    Viruses are pieces of code that are typically hidden inside another file. For
    example, a programmer may add virus code to a music file. When a person downloads
    that file and plays the song, the computer also carries out the instructions in
    the virus’s code. Once on the computer, viruses can wreak havoc. They may delete
    files or steal information. They may prevent a computer from being used until
    the user pays the hacker money. They may even allow the hacker to control the
    computer. Companies create antivirus software to find and delete viruses from
    computers. A constant struggle exists between hackers and antivirus coders.


    ### Big Data


    In recent years, computer programmers have been dealing with the phenomenon known
    as big data. Social networks, businesses, schools, scientists, and others are
    collecting huge amounts of data all the time. Programmers have learned how to
    manage all that information and make it useful.


    One of the biggest sets of data on the planet is owned by Facebook. The social
    networking website, which began in 2004, had approximately 1.8 billion users by
    2016. These users share photos, talk with friends, and fill their profile pages
    with the celebrities and brands they like most. Facebook uses all this data to
    help advertisers target users’ specific interests. The company also collects information
    about how people use Facebook, even recording how long users hold the mouse over
    certain parts of the page. It uses this kind of information when redesigning how
    the website looks.


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_26_0.png)


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_27_0.png)


    Social media apps often store huge amounts of data about their users.


    ### Making Movies with Code


    Computers and programming have revolutionized the movie industry. This revolution
    is clear in today’s incredible special effects. Programmers in this field are
    often artists and designers, too. Computer-generated special effects first came
    to film in the 1970s. One of the first major milestones was the 1973 movie *Westworld*.
    In that movie, artists worked with programmers to create a scene from the point
    of view of a robot. The robot could sense body heat. Programmers made a short
    sequence where the whole screen is red, except a patch of yellow and orange where
    a human is standing.


    > **DID YOU KNOW?**

    >

    > Facebook stores all the data it collects in large facilities called data centers.
    By 2016, it had built four data centers. One of them was a building measuring
