  mdcn: "\n\n## HoloLens：将增强现实带入家庭\n\n计算机公司微软创造了一款名为 HoloLens 的增强现实设备。HoloLens 是一副用户可佩戴的大眼镜。透过眼镜，用户能在自身环境中看到三维物体。想象一块手机屏幕悬浮在半空中。你可以点击电子邮件应用，它就会打开，让你无需使用键盘即可撰写信息。微软还认为，增强现实技术可以供艺术家使用。雕塑家可以在\
    \ HoloLens 应用中设计一座马雕像。然后，这座雕像可以由三维打印机制作出来。HoloLens 带来的编程机会巨大，但需要大量工作。由于 HoloLens\
    \ 旨在供普通人使用，程序员将让大量用户测试他们的作品。\n\n![](img/364f62702bba0f9efdd5ce92b1a6d6f9_40_0.png)\n\
    \n*这张微软宣传照片展示了一位摩托车设计师使用 HoloLens 在桌面上查看她的创作。*\n\n这个生物确实存在于用户的环境中。\n\n然而，程序员使用增强现实不仅仅是为了制作游戏。有些人设计了一种观察旧世界的新方式。当考古学家发现古代遗迹时，他们可能会尝试描述或勾勒这些遗迹曾经可能的样子。借助增强现实程序，他们可以看到这些复原景象叠加在遗迹本身上。走在希腊遗迹中的人可以举起手机或平板电脑，看到这个地方在公元前500年时的样子。\n\
    \n### 你知道吗？\n\n真正智能的机器人所需的人工智能将不仅仅拥有知识。它还需要拥有情感。未来最逼真的机器人将被编码为懂得何时表现出悲伤、暴躁或快乐。\n\
    \n## 人工智能\n\n当今编程领域的一个主要研究领域是人工智能。在这一领域，程序员致力于创建能够自行解决问题并适应新情况的智能软件。简单版本的人工智能造就了现代电子游戏中富有挑战性的电脑对手。这些对手经过编程，能够适应玩家行为所造成的新情况。例如，在橄榄球游戏中，人工智能可能会根据用户的比赛风格调整其球队的防守。制造更智能的机器人是人工智能的另一项应用。机器人吸尘器会学习如何清洁房间、如何避开障碍物，以及何时返回基座为电池充电。\n\
    \n![](img/364f62702bba0f9efdd5ce92b1a6d6f9_42_0.png)\n\n然而，程序员还有许多其他方式将智能技术带给世界。计算机\
    \ Watson 是最著名的人工智能机器之一。它由 IBM 公司经过多年硬件和软件开发而打造。Watson 于2011年参加了智力竞赛节目 *《危险边缘》*。它击败了两名人类选手。IBM\
    \ 后来调整 Watson，使其智能应用于医疗保健领域。它会分析各种各样的患者数据，然后向医生提出建议。2016年，IBM 宣布 Watson 也将开始从事天气预报工作。\n\
    \n![](img/364f62702bba0f9efdd5ce92b1a6d6f9_43_0.png)\n\n### 自修改代码\n\n当一个程序成为自己的程序员时，会发生什么？尽管人类程序员努力使软件完美运行，但他们无法预见可能出现的每一个问题。与其让程序员返回并重写代码，自修改程序可以直接重写自己的代码。人们希望这种智能软件能够自我调整以执行复杂任务。例如，美国政府希望制造出能够基于大量复杂信息评估形势的自学习计算机。计算机能存储的数据量远超人类分析师。一台能够访问所有这些信息的智能、可适应计算机，或许能够在自然灾害或战争等高风险情境中提出最佳决策建议。\n\
    \n### 编码新世界\n\n随着计算机和电子设备变得越来越复杂，编码也必须随之调整。程序员将继续开发创新的新软件，以便在这些机器上运行。从动画电影到虚拟电子游戏再到天气预报，代码在我们数字化的未来中有着几乎无穷无尽的用途。\n\
    \n## 词汇表\n\n- **二进制**（BYE-nary）：一种仅由1和0组成的数字系统。\n- **编译器**（com-PIE-ler）：一种将代码转换为可在计算机上运行程序的软件程序。\n\
    - **加密**（en-CRIP-shun）：将信息转换为一种防止其被读取的形式的过程。\n- **操作系统**（OP-er-ay-ting SIS-temz）：计算机上最基础的软件，帮助其他软件与硬件协同工作。\n\
    - **处理器**（PRAW-sess-er）：计算机中执行程序指令的部分。\n- **智能手机**（SMART-fonez）：具有大触摸屏和强大处理器、可运行应用的手机。\n\
    - **三维的**（three-duh-MENSH-un-uhl）：具有高度、宽度和深度。\n- **网络浏览器**（WEB brow-zerz）：允许用户访问万维网（互联网的一部分）的软件程序。\n\
    \n## 更多信息\n\n### 书籍\n\n- 希瑟·莱昂斯和伊丽莎白·特威代尔，*《学习编程》*。明尼苏达州明尼阿波利斯：Lerner Publications，2017年。本书为初学程序员提供了一些基础知识，解释了算法、循环和变量等概念。\n\
    - 乔恩·伍德科克，*《Scratch 编程游戏：构建你自己的计算机游戏的逐步可视化指南》*。纽约：DK，2016年。这本面向新程序员的指南展示了如何使用\
    \ Scratch 编程语言构建程序。用户可以创建拼图、迷宫和其他互动游戏。\n- 肖恩·麦克马纳斯，*《10堂简单课程教你编程：学习如何设计和编写你自己的计算机游戏》*。加利福尼亚州莱克福里斯特：Walter\
    \ Foster Jr.，2015年。这本实用指南分解了新程序员应学习的十项关键技能。读者将能够创建游戏和网页。\n- 塔米·加涅，*《计算机科学中的女性》*。明尼苏达州明尼阿波利斯：Abdo\
    \ Publishing，2017年。本书收录了女性在计算机科学许多领域（包括编程）做出非凡工作的例子。\n- 特蕾丝·纳伯，*《计算机如何改变历史》*。明尼苏达州明尼阿波利斯：Abdo\
    \ Publishing，2016年。在本书中，探索计算机如何从昂贵的、房间大小的机器变成数百万人每天随身携带在口袋里的东西这一惊人故事。\n\n### 网站\n\
    \n- **代码学院**（https://www.codecademy.com/）代码学院网站提供许多不同编程语言的免费课程，包括 Python、Java\
    \ 和 Ruby。\n- **Made w/Code**（https://www.madewithcode.com/）由科技公司谷歌运营的 Made w/Code\
    \ 网站收录了许多有趣好玩的编程项目。\n- **编程一小时**（https://code.org/learn）编程一小时的网站提供了数十个编程教程的链接。许多教程以热门角色为主角，例如《星球大战》电影和《我的世界》中的角色。\n\
    - **Scratch**（https://scratch.mit.edu/）麻省理工学院（MIT）运营这个编程网站，该网站使用一种名为 Scratch 的易学编程语言向用户介绍编程概念。\n\
    - **Lightbot**（https://lightbot.com/）在 Lightbot 网站上，用户可以使用基本编程概念解决谜题，从而帮助自己像程序员一样思考。\n\
