  - "[PAGE 10]\n\n# Building More  \nComplex Machines\n\nSince Lovelace’s day, computers\
    \ and coding have come a long way. In the 1940s, German inventor Konrad Zuse created\
    \ what is considered the first modern computer. Called the Z3, it could remember\
    \ and carry out instructions.\n\nUS programming pioneer Grace Hopper worked with\
    \ early computers during World War II. She later helped in the development of\
    \ the UNIVAC I computer and a programming language called COBOL. Hopper served\
    \ in the US Naval Reserve, helping the US Navy develop and use early computers.\
    \ She eventually rose to the rank of rear admiral.\n\n![](img/364f62702bba0f9efdd5ce92b1a6d6f9_10_0.png)\n\
    \nAda Lovelace is often considered the first computer programmer."
