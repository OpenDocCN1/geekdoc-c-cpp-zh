    ## The First Home Computers


    The companies Apple and IBM made early personal computers. Some ads showed the
    computers as being useful in the kitchen. Users could store recipes and create
    meal plans with them. Other ads showed how useful computers could be for home
    budgets. These early computers were not as easy to use as today’s machines. The
    user often needed to have programming knowledge to use them. Today, most users
    never see the code behind the programs they use. All these instructions are carried
    out behind the scenes.


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_12_0.png)


    *Early personal computers were much bulkier than the ones used today.*


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_13_0.png)


    *The Internet connects computer users all over the world.*


    One part of the Internet is the World Wide Web. It is a set of interconnected
    pages that Internet users can access online. Another use for the Internet is e-mail,
    a system for sending and receiving messages. Using the Internet, coders could
    now share programs with other users. They could also write programs for the World
    Wide Web.


    **Smartphones** and tablets changed the programming landscape in the 2000s. Programs,
    also known as apps, turned these devices into powerful tools for both work and
    fun. And new programming tools made coding accessible to more people than ever
    before.


    Today, the future of programming is bright. Computers, smartphones, and tablets
    can be found in practically every part of society. These machines make modern
    life more efficient and fun. Inventive coders will continue to make new advances,
    creating innovative programs that unlock the potential of our computerized world.


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_14_0.png)


    *Some smartphone apps let users listen to music.*


    ## What Is Code?


    When using a computer, a person interacts with two related things: hardware and
    software. The computer’s hardware is made up of its physical parts. The screen,
    keyboard, and mouse are all hardware. The parts inside the computer, such as the
    processor and memory, are also hardware.


    The computer’s software is made up of all the programs it runs. Some programs
    manage how the hardware and software work together. These are called **operating
    systems**. Other programs include word processors, **web browsers**, and games.


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_15_0.png)


    *Web browsers allow users to access social media, videos, search engines, and
    more.*


    Each programming language has its own strengths and weaknesses, and each is best
    for different kinds of programs. Some work well for making video games, while
    others are better suited for simple programs on desktop computers. A few of today’s
    major languages include C#, Python, Java, and Swift.


    > **DID YOU KNOW?**

    >

    > The first computer science department in the United States was at Purdue University
    in Indiana. In October 1962, the department opened its doors. Today, virtually
    every university and college has its own computer science program.


    Regardless of the language, all code has the same basic function. Code is a list
    of instructions for the computer processor to follow. Processors can handle instructions
    only in **binary**—long sequences of ones and zeroes. The most basic programming
    language, machine code, consists of only ones and zeroes. Binary instructions
    can be extremely difficult for coders to write and read. To make programming easier,
    people have developed programming languages that use symbols, letters, and words.
    Before these instructions go to the processor, they are converted into the equivalent
    series of ones and zeroes.


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_17_0.png)


    *Searching for errors can be a challenging part of programming.*


    ### Finding Errors


    Programmers use compiler software to convert a program into binary. They feed
    in the code they wrote, and the compiler spits out the ones and zeroes that a
    processor can understand. Compiler software also helps programmers find errors
    in their code. If something is mistyped or formatted incorrectly, a compiler can
    often catch the problem. This is known as a syntax error. A piece of software
    may have thousands of lines of code, so it is not unusual for errors to appear.


    Errors in code look different than typos in regular text. The language C# uses
    symbols such as %, {, }, &, and \*. These symbols can tell a program to go look
    in a specific area to find information. Accidentally leaving out a single \* could
    bring a program to a sudden halt. When a programmer tries to run software and
    it doesn’t work at all, he or she knows a syntax error may be lurking somewhere
    in the code.


    Another type of programming error is called a runtime error. This is a problem
    that occurs while a program is running. The program may seem to run normally at
    first, but some of its features might not be working correctly. Problems like
    these are also known as bugs.


    > **DID YOU KNOW?**

    >

    > Major programs, such as operating systems, can include huge amounts of code.
    This can make finding tiny errors difficult. Microsoft’s Windows XP operating
    system was made up of 45 million lines of code!


    ### Dealing with Bugs


    The use of the term bug to describe general errors predates computers. One of
    its early uses in computer errors came from an incident in September 1947. Technicians
    were working on a US military computer. At that time, computers were the size
    of entire rooms. Something went wrong with the computer, and the workers searched
    for the problem. They found that a moth had gotten stuck in one of its parts and
    caused the issue. Computer pioneer Grace Hopper wrote in the log book, “First
    actual case of bug being found.”


    In computers, a bug can cause a game to crash. It may cause a music app to suddenly
    skip songs. It might make a video chat suddenly disconnect. But some bugs can
    be much more serious. One of these happened on September 23, 1983.


    On that date, alarm bells sounded in a Russian military base. The base’s software
    said that the United States had just launched nuclear missiles at Russia. Commanders
    thought they might need to fire their own missiles. This would result in a devastating
    war. But Lieutenant Colonel Stanislaus Petrov did not think the missiles were
    really coming. It turned out a software bug had made the alarms sound. A software
    error could have led to a war. Instead, Petrov was able to guess that something
    wasn’t quite right.


    Living in a world of computers means knowing that sometimes software will not
    work as intended. There will be errors and mistakes in the code. In a process
    called debugging, coders find and fix these errors to make their software work
    better.


    ### Thinking Like a Programmer


    Programming is not just a job. It is also a mindset. Thinking like a programmer
    makes it easier to code successfully.


    There are many aspects to thinking like a programmer. First, programmers should
    keep in mind that they are writing code that computers need to understand. Unless
    there is a flaw in the hardware, computers don’t make mistakes. They do exactly
    what their instructions say. Errors in these instructions are the source of problems.
    Programmers must logically think about how the computer will interpret their instructions
    to prevent such issues.


    ### HTML


    One of the most common ways of writing things on the World Wide Web involves the
    HyperText Markup Language (HTML). At first HTML may look like code, but it actually
    just describes what a website will look like. HTML gives web browsers instructions
    on the size, typeface, arrangement, and formatting of text and pictures online.
    Though HTML isn’t a programming language, it works together with programming languages
    to make exciting websites. A programming language called JavaScript is used to
    make websites more interactive. JavaScript is different from the similarly named
    Java programming language. JavaScript code is sometimes added directly into the
    HTML text that makes up a website.


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_20_0.png)


    *HTML is the language that makes up most websites.*

