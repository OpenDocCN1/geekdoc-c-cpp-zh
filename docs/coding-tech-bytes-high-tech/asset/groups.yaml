    ## Code Bootcamps


    With so many coding jobs, the need for talented programmers is growing. Though
    a person can get a college degree in programming, other educational pathways have
    become available. One such method is a coding bootcamp. Bootcamps are intense,
    immersive classes in programming. Some are only nine weeks long. They usually
    focus on the specific kind of programming needed for a job. For example, if a
    person is looking for a job writing mobile apps, a bootcamp will focus on app
    programming. Bootcamps are becoming particularly popular among young people, as
    well as in developing countries. In places where unemployment is high, this style
    of training can be a quick way to find a new career.


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_31_0.png)


    A teacher works with a student at a code bootcamp.


    data research, or an entertaining movie or video game, code is a major part of
    our world. Learning how code works is critical to understanding how computers
    have changed modern life. The flexibility of programming means that computers
    can tackle just about any task coders can dream up.


    ## Coding for Tomorrow


    Students learn to read and write in school. But what if they learned to code,
    too? Many schools are beginning to teach coding in the classroom. And students
    of all ages can use online tools to start learning programming in their free time.
    As computers continue to reach into almost every part of daily life, learning
    about code is becoming more important. Even if a student does not want to become
    a programmer, knowing how code works will help them understand the world in which
    he or she lives.


    ### Hour of Code


    In 2013, an organization called Code.org was formed. Its goal is to bring coding
    to as many people as possible. The group particularly targets students who may
    not otherwise have access to computer science education. Many of their events
    are focused on recruiting girls and people of color. Because coding is such an
    important part of the digital world, it is important to make sure everyone has
    an equal opportunity to learn about it.


    Code.org is home to Hour of Code. This 60-minute program is designed to introduce
    students of all ages to coding and computer science. If a student is interested,
    he or she can go on to more advanced coding lessons. By 2017, more than 300 million
    people worldwide had tried the Hour of Code.


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_33_0.png)


    Tim Cook, the head of computer company Apple, watches as kids participate in an
    Hour of Code event at an Apple Store.


    People can access the Hour of Code at home, but each year, Code.org also hosts
    a worldwide Hour of Code event. The event takes place during the Computer Science
    Education Week at the beginning of December. Partners such as Disney, Apple, and
    Google help spread the word. In 2016, Disney made a new Hour of Code lesson based
    on the animated film *Moana*. Microsoft made several tutorials related to the
    popular game *Minecraft*. A group of athletes, including Kobe Bryant and Serena
    Williams, helped promote a sports-themed lesson. And in Apple Stores across the
    world, students could participate in a one-hour coding lesson.


    ### DID YOU KNOW?


    Coding websites sometimes feature challenges to help students sharpen their skills.
    They give users real-world coding problems to solve, helping them learn to think
    like a programmer.


    These early coding lessons often use a concept called block coding. This means
    students don’t have to jump straight into writing code. Instead, they move blocks
    labeled with commands around the screen. These blocks may say “move forward” or
    “turn left.” The character on the screen then follows the actions. This helps
    students understand the basic process of giving logical instructions to the computer.
    As the lessons progress, the challenges become more complex and more block commands
    are added. Eventually students begin writing actual code.


    ## Learning to Code in School


    In schools across the country, coding is becoming a common subject. Alongside
    math and social studies, kids are learning the basics of how to make computer
    programs. Most of these courses are in middle and high schools. The number of
    schools offering programming classes is expected to rise in the coming years.


    Students also learn to code in after-school and summer programs. One of these
    is CS@SC Summer Camps, held at the University of Southern California. The weeklong
    camps are designed to give students from preschool to high school early exposure
    to coding, helping them think about how computers work in their daily lives. Students
    learn what computer science is and how programs are written. They also get a preview
    of what college life is like.


    Learning how to program has advantages beyond preparing students for coding careers.
    It also teaches students to think like a programmer, which can improve their problem-solving
    skills in other areas. Coding can give students another set of critical thinking
    tools, especially when thinking about how to tackle big projects of all kinds.


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_36_0.png)


    Experts predict there will be a major demand for programmers in the future. Students
    who aren’t exposed to programming in high school may not have the chance to see
    if it is interesting to them. Giving students the chance to code early means that
    many more may choose to pursue computer science. This can help satisfy the future
    need for coders.


    ## Coding for a Mobile Future


    ### DID YOU KNOW?


    Computers and coding have enabled a new type of acting in Hollywood movies. It
    is known as motion capture. An actor is covered with a bunch of white or green
    dots. Special sensors record how the dots move as the actor performs in a scene.
    The facial movements are then transferred to a digital character, such as an alien
    or a magical beast. The end result is similar to acting with a high-tech mask.


    By the late 2010s, the hottest trend was wearable technology. Devices such as
    the FitBit or the Apple Watch are worn on the wrist. Some track fitness information,
    such as heart rate or running distance. Others can send messages or play music.
    The future is likely to bring devices that are even smaller and more capable.
    Imagine jewelry that is connected to a phone. A person could answer a call with
    a tap on an earring. Coding for these devices will require a lot of creative thinking.
    One of the biggest hurdles with wearable technology is battery life. Small devices
    can fit only small batteries. Smart, efficient programming can help these items
    run on less power, extending the battery life.


    ## Coding for Virtual Spaces


    Another field that will require creative coding is virtual reality. Virtual reality
    immerses the user in an entirely different world. A user puts on a headset and
    is transported to a virtual location. Small screens in front of the eyes create
    the illusion of being in a three-dimensional environment. Headphones produce noises
    that sound as if they are coming from specific directions. And when the user turns
    his or her head, the screens and headphones work together to match this movement
    in the virtual world.


    In virtual reality, the user moves through a landscape and interacts with virtual
    objects. For example, with the headset on, a user may be exploring a house. When
