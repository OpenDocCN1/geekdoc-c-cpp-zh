    # DID YOU KNOW?


    Konrad Zuse built his early computers and programming languages alone. He worked
    in the 1940s, when Germany was fighting World War II. Some of his inventions were
    destroyed by bombs during the war.


    Scientists and engineers continued to build improved computers. By the 1950s,
    there was an explosion of coding languages. Computer company IBM released FORTRAN
    in 1957. Updated versions of this language are still in use


    today. In the 1960s, programming grew beyond solving mathematical problems. Computers
    became powerful enough for coders to make drawings or animation. These early roots
    eventually led to modern computer-animated movies.


    In the 1970s and 1980s, personal computers became widely available. Millions of
    people now had computers in their homes. Programming was no longer only for experts
    in labs or universities. People could learn to create their own games or other
    programs.


    The 1990s brought the Internet, changing the world of computers forever. The Internet
    is a framework connecting computers around the world. Data travels from one computer
    to another across this vast network. One of the major uses'
