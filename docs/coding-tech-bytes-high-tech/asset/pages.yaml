    trains made it easier to move cargo and passengers over long distances. In the
    1900s, home appliances made it easier to store and prepare food. Today, the machine
    that makes the biggest difference in people’s everyday lives is the computer.


    Computers make a wide assortment of tasks easier. People use them to send and
    receive messages, pictures, and videos. Students use them to write papers, and


