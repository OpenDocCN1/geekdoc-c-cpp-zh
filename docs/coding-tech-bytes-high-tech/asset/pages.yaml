- pgno: 19
  md: 'In computers, a bug can cause a game to crash. It may cause a music app to
    suddenly skip songs. It might make a video chat suddenly disconnect. But some
    bugs can be much more serious. One of these happened on September 23, 1983.


    On that date, alarm bells sounded in a Russian military base. The base’s software
    said that the United States had just launched nuclear missiles at Russia. Commanders
    thought they might need to fire their own missiles. This would result in a devastating
    war. But Lieutenant Colonel Stanislaus Petrov did not think the missiles were
    really coming. It turned out a software bug had made the alarms sound. A software
    error could have led to a war. Instead, Petrov was able to guess that something
    wasn’t quite right.


    Living in a world of computers means knowing that sometimes software will not
    work as intended. There will be errors and mistakes in the code. In a process
    called debugging, coders find and fix these errors to make their software work
    better.


