    # # Finding Errors


    Programmers use compiler software to convert a program into binary. They feed
    in the code they wrote, and the compiler spits out the ones and zeroes that a
    processor can understand. Compiler software also helps programmers find


    errors in their code. If something is mistyped or formatted incorrectly, a compiler
    can often catch the problem. This is known as a syntax error. A piece of software
    may have thousands of lines of code, so it is not unusual for errors to appear.


    Errors in code look different than typos in regular text. The language C# uses
    symbols such as %, {, }, &, and \*. These symbols can tell a program to go look
    in a specific area to find information. Accidentally leaving out a single \* could
    bring a program to a sudden halt. When'
  merge: -1
  img_proc: true
