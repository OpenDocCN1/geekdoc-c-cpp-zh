  md: '# # HoloLens: Bringing Augmented Reality into the Home


    Computer company Microsoft created an augmented reality device called HoloLens.
    The HoloLens is a set of big glasses that a user can wear. Through the glasses,
    the user sees three-dimensional objects in his or her environment. Imagine a phone''s
    screen floating in midair. You could click on the e-mail app and it would open,
    allowing you to write a message without using a keyboard. Microsoft also thinks
    the augmented reality technology could be used by artists. A sculptor could design
    a statue of a horse in a HoloLens app. That statue then could be created by a
    three-dimensional printer. The programming opportunities with HoloLens are huge,
    but they will require a lot of work. Since the HoloLens is meant to be used by
    everyday people, programmers will have a lot of users test their creations.


    ![](img/364f62702bba0f9efdd5ce92b1a6d6f9_40_0.png)


