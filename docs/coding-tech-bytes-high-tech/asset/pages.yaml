- pgno: 8
  md: '# # Creating the First Code


    Lovelace was born in 1815. She had a nontraditional upbringing. Unlike most girls
    of her time, she was encouraged to learn math and science. During her studies,
    she met scientist Charles Babbage. Babbage had designed a mechanical device that
    could be used for mathematics.


    Babbage’s machine was known as the Difference Engine. It was much different from
    today’s computers. Rather than electricity, circuits, and microchips, it would
    use levers and gears. It could quickly carry out math problems that would take
    a person hours to calculate by hand. The user would set the device to the initial
    settings for the problem, then turn a crank to put the machine into motion.


    # ## DID YOU KNOW?


    > > Ada Lovelace was the daughter of Lord Byron, a famous British poet. Byron
    left the family when Ada was a child. Her mother worried Ada would become moody
    and unpredictable like her father. She felt that having Ada focus on studying
    math and science would prevent this.


    However, the full machine was not built during Babbage’s lifetime.'
  merge: -1
  img_proc: true
