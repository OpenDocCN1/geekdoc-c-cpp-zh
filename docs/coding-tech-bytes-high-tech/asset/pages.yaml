- pgno: 44
  md: '# # GLOSSARY


    **binary** (BYE-nary): A number system that consists solely of ones and zeroes.


    **compiler** (com-PIE-ler): A software program that translates code into a program
    that can run on a computer.


    **encryption** (en-CRIP-shun): The process of turning information into a form
    that prevents it from being read.


    **operating systems** (OP-er-ay-ting SIS-temz): The most basic software on a computer
    that helps the other software work together with the hardware.


    **processor** (PRAW-sess-er): The part of the computer that carries out the instructions
    of programs.


    **smartphones** (SMART-fonez): Cell phones that have a large touchscreen and a
    powerful processor and can run apps.


    **three-dimensional** (three-duh-MENSH-un-uhl): Having height, width, and depth.


    **web browsers** (WEB brow-zerz): Software programs that allow a user to access
    the World Wide Web, part of the Internet.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# FOR MORE INFORMATION


    # Books


    Heather Lyons and Elizabeth Tweedale, *Learn to Program*. Minneapolis, MN: Lerner
    Publications, 2017. This book provides some basic information for beginning programmers,
    explaining concepts such as algorithms, loops, and variables.


    Jon Woodcock, *Coding Games in Scratch: A Step-by-Step Visual Guide to Building
    Your Own Computer Games*. New York: DK, 2016. This guide for new programmers shows
    how to build programs with the Scratch programming language. Users can create
    puzzles, mazes, and other interactive games.


    Sean McManus, *How to Code in 10 Easy Lessons: Learn How to Design and Code Your
    Very Own Computer Game*. Lake Forest, CA: Walter Foster Jr., 2015. This helpful
    guide breaks down ten key skills that new programmers should learn. Readers will
    be able to create games and web pages.


    Tammy Gagne, *Women in Computer Science*. Minneapolis, MN: Abdo Publishing, 2017.
    This book includes examples of women doing incredible work in many areas of computer
    science, including coding.


    Therese Naber, *How the Computer Changed History*. Minneapolis, MN: Abdo Publishing,
    2016. In this book, discover the amazing story behind how computers went from
    expensive, room-sized machines to something that millions of people carry with
    them in their pockets every day.'
  merge: -1
  img_proc: true
