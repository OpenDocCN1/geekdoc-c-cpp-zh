  md: "a programmer tries to run software and it doesn’t work at all, he or she knows\
    \ a syntax error may be lurking somewhere in the code.\n\nAnother type of programming\
    \ error is called a runtime error. This is a problem that occurs while a program\
    \ is running. The program may seem to run normally at first, but some of its features\
    \ might not be working correctly. Problems like these are also known as bugs.\n\
    \n> **DID YOU KNOW?**\n> \n> Major programs, such as operating systems, can include\
