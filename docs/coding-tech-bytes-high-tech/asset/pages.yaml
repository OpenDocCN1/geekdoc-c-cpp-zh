  md: '# # HTML


    One of the most common ways of writing things on the World Wide Web involves the
    HyperText Markup Language (HTML). At first HTML may look like code, but it actually
    just describes what a website will look like. HTML gives web browsers instructions
    on the size, typeface, arrangement, and formatting of text and pictures online.
    Though HTML isn’t a programming language, it works together with programming languages
    to make exciting websites. A programming language called JavaScript is used to
    make websites more interactive. JavaScript is different from the similarly named
    Java programming language. JavaScript code is sometimes added directly into the
    HTML text that makes up a website.


