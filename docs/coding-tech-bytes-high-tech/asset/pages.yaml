    \ Windows XP operating system was made up of 45 million lines of code!\n\n# Dealing\
    \ with Bugs\n\nThe use of the term bug to describe general errors predates computers.\
    \ One of its early uses in computer errors came from an incident in September\
    \ 1947. Technicians were working on a US military computer. At that time, computers\
    \ were the size of\n\nentire rooms. Something went wrong with the computer, and\
    \ the workers searched for the problem. They found that a moth had gotten stuck\
    \ in one of its parts and caused the issue. Computer pioneer Grace Hopper wrote\
    \ in the log book, “First actual case of bug being found.”"
