  \ 免费下载 `Fiddler2`，它支持对 HTTPS 进行调试并需要 `.NET 2.0` 或更高版本。运行安装程序会在 IE 的“工具”菜单中添加 `Fiddler2`\
  \ 选项；选择 `Fiddler2` 会在独立的窗口中打开该应用程序。\n\n图 4.6 显示了 `Fiddler2` 捕获了一个 `MERGE` 请求的 HTTP\
