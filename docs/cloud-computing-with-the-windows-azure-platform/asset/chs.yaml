  \ 2 章：理解 Windows Azure 平台架构\n## 第 3 章：分析 Windows Azure 操作系统\n## 第 4 章：扩展 Azure 表和\
  \ Blob 存储\n\n# 第 1 章：概述云计算的角色\n\n云计算一术语意味着通过公共互联网的 `TCP/IP` 连接访问第三方提供的远程计算服务。网络图中的云符号最初代表任何类型的多用户网络，但在\
  \ 20 世纪 90 年代中期专门与公共互联网相关联。例如，以下是维基百科截至 2009 年 1 月中旬对云计算的第一个段落定义：\n\n> 云计算是基于互联网（“云”）的计算机技术开发和使用（“计算”）。它是一种计算风格，通过互联网以“服务”的形式向用户提供资源，这些用户无需对支持他们的技术基础设施（“云端”）具有知识、专业知识或控制权。\n\
  \n高纳（Gartner）将云计算定义为：\n\n> 在互联网上以服务形式提供的可扩展 IT 相关能力。\n\n上述定义涵盖了几乎所有常见的基于互联网的活动，从个人发送电子邮件和查看网页，到零售商为在线购物处理信用卡和借记卡费用。谷歌首席执行官埃里克·施密特（Eric\
  \ Schmidt）在 2006 年 8 月 9 日搜索引擎策略会议接受丹尼·苏利文采访时缩小了定义（转录自 `http://bit.ly/wday4`、`www.google.com/press/podium/ses2006.html`）：\n\
  \n> [现在]有趣的是，出现了一种新兴的新模型，你们大家在这里是因为你们是这个新模型的一部分。我不认为人们已经真正理解这个机会到底有多大。它始于这样一个前提：数据服务和架构应该在服务器上。我们称之为云计算——它们应该在某处的“云”中。而且，如果你有正确的浏览器或正确的访问方式，无论你拥有\
  \ PC、Mac、手机、黑莓手机还是什么——或者仍待开发的新设备——你都可以访问云。有很多公司从中受益。显然，想到了 Google、Yahoo!、eBay、Amazon。计算和数据等都在服务器中。[**强调处已添加**]\n\
  \n。\n\n施密特先生被许多人认为是 2008 年及以后在其具化语境下“云计算”一术语的首位使用者，但该术语直到 2007 年 9 月左右才达到 Google\
  \ Trends 服务的收录门槛（参见 图 1.1）。施密特先生在上述引言中假设，云计算服务器提供的数据服务是由拥有服务器的组织定义的，特别是 Google、Yahoo!、eBay\
  \ 和 Amazon。\n\n图 1.1 根据 Google Trends 服务报告的 2000 年至 2008 年云计算、Windows Azure、Amazon\
  \ EC2 和 Google App Engine 术语的全球流量。\n\n![1.1](img/c01f001.jpg)\n\n亚马逊发布了其弹性计算云 (`EC2`)\
  \  Web 服务，这是第一个允许用户在互联网云中运行自己的自定义程序（而不仅仅是托管网站）的服务，于 2006 年 8 月 23 日发布。IDC（一家良好的市场分析公司）在\
  \ 2008 年 10 月底预测，云计算服务支出将增长三倍，并在 2012 年达到 420 亿美元，届时将占 IT 总支出的 9%。IDC 预计云计算支出将加速增长并占据三分之一。\n\
  \n使用 Windows Azure 的云计算涵盖了 Windows Azure 提供的面向企业的云计算服务，如 图 1.2 所示，Azure 在 2008 年专业开发者会议（PDC）上发布了其社区技术预览（CTP），此前曾被称为“RedDog”或偶尔被称为“Stratus”。\n\
  \n![1.2](img/c01f002.jpg)\n\n具体而言，本书涵盖：\n\n*   Windows Azure：实现虚拟化 Windows Server\
  \ 2008 的操作系统。\n*   Azure 服务：提供结构化表、任意 blob 和队列的持久存储。\n*   SQL 服务：在云中实现 SQL 报告和分析服务。\n\
  *   NET 服务：包括访问控制、总线和服务工作流服务。\n*   Windows Azure 工具包 (`SDK`)：实现 Azure 开发。\n*   Windows\
  \ Azure Visual Studio 工具：提供 Visual Studio 2008 项目模板。\n\n本书未涵盖 Live 环境（LOE，此前称为 Mesh\
  \ 环境 MOE）及其 Live 服务，因为这些是面向消费者的功能。也没有深入介绍 SharePoint 服务、CRM 服务或 Office 应用程序（OBA），因为这些是在生产\
  \ Fabric 上运行并使用 Azure 服务持久化状态的微软私有应用程序。本书的内容针对 图 1.3 中被划掉的 Azure 服务。\n\n图 1.3 面向企业的\
  \ Azure 平台和 SDK 功能。本书未涵盖的功能已划掉。\n\n![1.3](img/c01f003.jpg)\n\n本书是根据第四版（2009 年 5\
  \ 月）及之后的 Windows Azure SDK 和 Windows Azure Visual Studio 工具 CTP 编写的。\n\n第 2 章“理解\
  \ Windows Azure 平台架构”以及第一部分“介绍 Windows Azure 平台”的其余章节描述了 Windows Azure 的底层架构及其面向企业的功能库。\n\
  \n为什么要将应用程序和服务迁移到云端？\n\n云计算正在获得大量的媒体报道，引发了层层不断的会议，增加了 IT 管理的关注和大量的软件开发人员资源，因为它让小型、中型企业能够：\n\
  \n*   通过减少部署固定 IT 资产（如服务器、交换机和路由器）的时间并消除这些资产相关的增量资本投资，更快地将新产品或服务推向市场。\n*   快速进行市场测试并在市场、产品或服务不符合预期时通过快速失败来限制损失。\n\
  *   在初步市场测试结果出来后再进行长期规划。\n\n\n\n\n\n-   将为了适应周期性使用峰值而产生的额外容量资本支出（例如宣布季节性折扣或新软件版本后出现的峰值）替换为基于用量的按月付费。\n\
  \n如果初始市场测试成功，从云端提供软件应用程序或服务可以让业务部门快速部署新产品，并几乎立即扩展应用程序或服务以满足客户需求。对于高级管理层，采用云计算的关键在于其能够将\
  \ IT 资本投资转换为基于用量的运营支出。\n\n## 云计算的祖先\n\n在客户端，许多计算机硬件和软件供应商接受了通过设计和营销网络化无盘工作站（也称为瘦客户端）来打破\
  \ PC 市场中 `Microsoft/Intel` 霸权的挑战。`Microsoft` 将其自己的瘦 Internet 客户端作为 `Web TV` 顶盒提供，并使用带有\
  \ `Zero-Administration Windows`（又简称 `ZAW`）的 `NetPC` 客户端连接到局内网。这些客户端设计通过消除本地固定硬盘降低了成本，并依赖网络服务器来加载应用程序和存储用户文件。然而，瘦客户端的价格还不够低，无法从无处不在的\
  \ `Windows PC` 手中获得大量的市场份额。\n\n新的笔记本电脑平台在云计算获得广泛关注之际恰出现在笔记本 PC 市场，似乎提供了足够的成本激励来实现规模化生产。笔记本电脑通常提供容量小于主流笔记本或固态硬盘（`SSDs`）的传统硬盘。\n\
  \n应用服务供应商（`ASPs`）和网络托管公司最早根据需要租赁服务器 CPU 周期和存储空间。这些较大的组织预计将参与云计算市场。\n\n## 无盘工作站与瘦客户端\n\
  \n`Oracle` 在 20 世纪 90 年代提出的网络计算机（`NC`）概念可能是云计算最直接的祖先。`Oracle` 在 1996 年为“网络计算机”一词注册了商标，用于业务用途的无盘网络客户端，并建立了“网络计算机参考规范”。该配置规范要求所有\
  \ `NC` 设备都支持 `HTML`、`HTTP`、`Java` 以及其他与互联网相关的标准。`NC` 相比 `PC` 的价格优势（如果有的话）不足以在企业中建立重大的市场，而且拨号连接的糟糕体验阻碍了消费者对\
  \ `NetPC` 的使用。\n\n`Microsoft` 和 `Intel` 产生了一种名为 `NetPC` 的竞争标准，以与 `NC` 规范竞争。1997\
  \ 年，`Dell Computer` 推出了一款密封式 `PC`，没有软盘驱动器、`CD 驱动器`或其他可选组件，运行 `Windows NT 4.0 Workstation`。`Compa`\
  \ 和 `HP` 在 1997 年年中引入了运行 `ZAW` 的类似 `NetPC` 工作站。\n\n`Sun Microsystems` 拥有注册商标的“网络即计算机”格号，促成了其用\
  \ `JavaStations` 替代 `PC` 的倡议，该设备使用了运行在 `SPARC` 处理器上的 `Java` 操作系统。`IBM` 通过 `Network\
  \ Stations` 涉足了无盘工作站市场。`JavaStations` 和 `Network Stations` 与 `NC` 具有相同的技术问题。`Wyse\
  \ Technology, Inc.` 原是大型主机和微型计算机终端制造商，在 20 世纪 90 年进入 PC 市场，随后扩展到 `NC` 领域。\n\n这些瘦客户端具有足够的计算能力运行网络浏览器和从\
  \ Web 按需下载的几个简单应用程序，但依赖于网络磁盘存储。`Oracle` 首席执行官 `Larry Ellison` 在 2000 年左右放弃了 `NC`\
  \ 项目，`Sun` 也放弃了 `JavaStation`。`NetPCs` 和 `ZAW` 的境地并不好；在这些美国瘦客户端“朝圣者”中，只有 `Wyse`\
  \ 在 2009 年仍在生产大量用于业务的专用瘦客户端工作站。\n\n随着 `VMware Inc.` 发布 `VMware View Open Client`，瘦客户端可能会回归，这是一种最近开源的桌面基础设施客户端，允许将\
  \ `Linux` 桌面或笔记本电脑连接到由 `VMware View` 管理的托管虚拟 `Windows` 桌面。`Gartner` 预测：\n\n*   到\
  \ 2013 年，将购买约 5000 万份托管虚拟桌面的用户许可。\n*   瘦客户端终端将占托管虚拟桌面部署用户设备的约 40%。\n\n## Web TV\
  \ 及其克隆体或后代\n\n`Microsoft` 于 1997 年 8 月收购了 `WebTV Networks`，该公司运营一家在线消费者网络服务，并授权了一种传统电视机作为显示器的无盘工作站设计。当时，`WebTV\
  \ Networks` 有约 15 万订阅用户；`Sony` 和 `Philips` 都在授权生产 `WebTV` 顶盒。`Microsoft` 在 2001\
  \ 年购买了 `WebTV Networks` 的用户用于 `Microsoft Network`（`MSN`），终止了 `Sony Electronics`\
  \ 和 `Philips Consumer Electronics` 的授权，并将 `WebTV` 品牌改为 `MSN TV`。`Thomson` 仍是 `RCA`\
  \ 品牌下唯一的美国顶盒授权商。\n\n`America Online` 在 2000 年推出了 `AOL-TV`，这是 `WebTV` 的仿品。1999 年，`AOL`\
  \ 与 `Liberate Technologies`（前身为 `NCI` 或 `Network Computers, Inc.`，`NetChannel` 等瘦客户端系统的创建者）合作，为其顶盒编写软件。据报道，`AOL`\
  \ 在 1997 年 12 月曾以 6500 万美元报价 `NetChannel`，但谈判破裂了，`AOL` 停止了对 `NetChannel` 的资金支持。在\
  \ 1998 年 5 月 3 日关闭对其 1 万名订阅者的服务后，`AOL` 最终支付了 2900 万美元购买 `NetChannel`。`Thomson` 是\
  \ `NetChannel` 顶盒的生产者，但 `Philips` 制造了 `AOL-TV` 的顶盒，售价为 249.95 美元。`AOL-TV` 的订阅费用为每月\
  \ 14.95 美元，此外还有当时时每月 21.95 美元的 PC 服务费。\n\n2004 年，当 `MSN TV 2` 带有运行 `Windows CE`\
  \ 操作系统的顶盒推出，并提供宽带接入以及拨号上网连接时，分析师估计 `MSN TV` 有约百万订阅用户。\n\n截至 2009 年初，`RCA MSN TV\
  \ 2` 互联网和媒体播放器的建议零售价（MSRP）为 199.95 美元，可通过 `Amazon.com` 和其他少数零售商在线购买，但当时处于 `Microsoft`\
  \ 的缺货状态。（Circuit City 作为唯一的商店 MSN TV 2 零售商，于 2009 年 1 月自愿清算。）`Microsoft` 在 PressPass\
  \ 上的 `MSN Services Fact Sheet` 页面自 2006 年 5 月以来没有变化，这可能表明 `Microsoft` 对继续投入资源开发\
  \ MSN 2 缺乏兴趣。\n\n## 笔记本客户端\n\n笔记本电脑是为无线网络、接入互联网、长电池寿命和物理坚固性设计的小型 PC。笔记本电脑平台源于 `Nicholas\
  \ Negroponte` 的“每个孩子一台电脑`OLPC`）计划，其使命是“通过为世界上最贫困的孩子提供一台耐用、低成本、低功耗、联网的电脑，创造协作、快乐、自主的学习机会。”原始\
  \ `OX-1` 型号于 2007 年底大规模生产，目标是在 2008 年向第三世界国家提供 100 美元的价格。`OX-1` 特是 `AMD CPU`、1200\
  \ x 900 像素、7.5 英寸（对角线）`LCD` 显示、256MB `DRAM`、用于 `Linux` 操作系统的 1GB `ROM`、1GB 闪存内存、数字存储（`SD`）卡槽以及\
  \ `802.11b/g` 和 `802.11s`（网状）无线通信。2009 年初，大量采购的价格在 50 个不发达国家约为 219 美元，在其他管辖区为 259\
  \ 美元。\n\n`Intel` 的 `Classmate PC` 设计与 `OLPC OX-1` 一样是为新兴市场设计的，为近 300 美元的实际售价类别提供了信誉。`Acer\
  \ Aspire One`、`Asus Eee PC`、`Dell Inspiron Mini` 和 `HP Mini` 型号根据显示尺寸、`SSD` 容量和其他规格，价格范围约为\
  \ 300 美元到 400 美元不等。2009 年初，`AT&T` 为购买 `Dell Inspiron Mini 9` 并办理 `AT&T` 数据计划的用户提供了\
  \ 349 美元的邮寄补贴，这使得笔记本电脑的价格降到了 99 美元。其他运营商可能会效仿 `AT&T`，提供类似于 `iPhone` 的硬件补贴来获取移动数据用户。\n\
  \n\n\n\n预计 2010 年，搭载 Intel Atom 处理器并运行 Google Chrome OS 操作系统的笔记本电脑将会出现。\n\n其他组装商在其型号名称中加入了“Cloud（云）”；例如，Everex\
  \ 在 2008 年初推出了其售价 399 美元的 CloudBook 电脑。《纽约纽约时报》的记者 Brad Stone 和 Ashlee Vance 在 2009\
  \ 年 1 月 25 日的《200 美元笔记本电脑打破了商业模式》一文中指出：\n\n更具实验性但成本更低的技术，如笔记本电脑、基于互联网的软件服务（称为云计算）以及虚拟化技术（虚拟化允许公司在每台物理服务器上运行更多软件），正在兴起……\n\
  \nPC 行业唯一的亮点是笔记本电脑。来自高盛（Gartner）研究公司的分析师表示，2008 年第三季度笔记本电脑的出货量已增至 440 万台，而去年第一季度仅为\
  \ 50 万台。分析师认为，尽管全球处于深度衰退，今年（2009 年）销售额可能会翻倍。\n\n市场研究机构 DisplaySearch 预测，低于 300 美元的笔记本电脑全球销量将从\
  \ 2007 年的 100 万台增加到 2009 年的 1400 万台。到 2010 年，笔记本电脑和智能手机可能将连接云计算虚拟服务器的大多数客户。\n\n\
  ## 应用服务商与软件服务\n\nASP（应用服务商）市场推动了 20 世纪 90 年末的互联网泡沫，但 ASP 也是 2000 年初泡沫破裂后规模最大的市场细分之一。随着面向服务的架构（`SOA`）受到软件开发人员和企业\
  \ IT 部门的关注，ASP 逐渐被称为软件即服务（`SaaS`）提供商。通常公认的有五种 ASP 市场细分：\n\n*   **专业类 ASP**：通常提供单一应用程序，例如信用卡或其他支付处理、客户关系管理（`CRM`）、人力资源管理系统（`HRMS`）、文字处理、电子表格、数据库或时间表服务。Google\
  \ Apps 为商务用户提供每用户每年固定费的基于网页的电子邮件、日历、文字处理、电子表格和演示文模块，而 `Salesforce.com` 租用 `CRM`\
  \ 能力，`Intuit` 则按每月订阅者计费提供其 `QuickBase RDBMS`。\n*   **企业类 ASP**：提供广泛的专业 ASP 解决方案。例如，`Microsoft`\
  \ 租用 `Microsoft SharePoint Services`、`Microsoft Dynamics CRM Services` 以及 `Office\
  \ Business Applications`（`OBAs`），以及在线的 `Windows Live` 服务。\n*   **垂直市场类 ASP**：为特定客户类别提供多种软件解决方案，例如医疗或牙科诊所、保险经纪、教会信徒、住宅或商业建筑，或个人财务管理。\n\
  *   **本地市场类 ASP**：在有限的地理区域内为小型服务企业（如餐厅、酒馆和酒吧）提供地理位置标记营销服务。\n\nASP 通常按每位订阅者收取固定月费，其中包含软件许可费。“过度使用”的附加费并不常见，但提供商通常会为辅助性的“按点菜式”服务收取高不成比例的费用。需要提供商培训客户用户的应用程序通常涉及安装费、年度承诺、最低付款额等。\n\
  \n## Web 托管服务\n\nWeb 托管服务自 1991 年左右以来可用，是所有云计算先驱中产量最丰富的；估计美国有约 50,000 服务托管了 100\
  \ 个或更多网站。Web 托管服务提供操作系统、Web 服务器实现、电子邮件处理、内容存储、高速互联网连接及相关服务，根据消耗的资源，月费从免费到数千美元不等。Web\
  \ 托管服务分为以下几类：\n\n*   **共享服务器托管**：在单台物理服务器和一个操作系统实例上运行多个网站。由于多个服务在共享资源（包括相同的操作系统实例）上运行，共享服务器托管对单个网站知识产权的保护相对较少。大多数免费和低价（每月\
  \ 30.00 美元及更低）的服务使用共享服务器托管。基础月费中通常包含高达 1GB 的内容存储和每月 1TB 左右的互联网流量，并对额外的存储和流量收取附加费。安装费并不常见。\n\
  *   **虚拟专用服务器（`VPS`）**：也称为专用虚拟服务器托管，在虚拟化实例中隔离操作系统和 Web 服务器，允许网站在逻辑上从一台或一组物理机器上的其他网站隔离开。`VPS`\
  \ 托管提供额外的安全性，费用每月约 40 美元起，并具有增加的存储和流量限制。小型电子商务网站通常使用 `VPS` 托管。有些公司对 `VPS` 托管收取小额安装费。\n\
  *   **专用服务器托管**：将一台物理 Web 服务器租给运营商，通过内容隔离来增加安全性，费用每月约 200 美元起，月费取决于所提供的资源。专用服务器托管的安装费很常见。\n\
  *   **机房托管（托管服务中心/Colocation）**：将网站运营商的服务器和存储硬件安置在数据中心大楼内，通常位于受限制访问的围栏内。这是 Web 托管类别中唯一托管公司不拥有\
  \ Web 和应用程序服务器的类别。机房提供商提供互联网连接、电力、冷却、防火防、数据备份和其他安全服务。Col 托管通常用于大型内容导向型网站以及中型或较大的电子商务网站。安装费和月费根据面积、功耗和互联网流量计算。\n\
  \n泡沫破裂时，机房设施遭受了重创，若干此类组织宣布破产。`Exodus Communications` 是早期大型专用服务器托管和机房设施之一，曾创下 `NASDAQ`\
  \ 连续 13 个季度增长率超过 40% 的记录，随后在 2001 年 9 月互联网泡沫期间申请了破产保护重组。\n\n`Rackspace Hosting,\
  \ Inc.` 是一家大型 Web 托管公司，提供 `VPS` 托管（其称为云托管）并专门从事托管托管（包括专用服务器托管和 Colocation），目标是中小企业（`SMBs`）。`Rackspace`\
  \ 于 2008 年 2 月推出了其 `Mosso` 部门以竞争云计算市场。该公司在 2008 年 10 月收购了在线备份服务 `JungleDisk` 和虚拟化服务器提供商\
  \ `Slicehost`，以增强其对抗 `Amazon Web Services'` `EC2`、`Simple Storage Services` 和 `Elastic\
  \ Block Storage` 的竞争力。到 2009 年初，`Rackspace` 为全球客户管理超过 40,000 台服务器和设备。\n\n## 云计算与一切皆服务\n\
  \n云计算服务与许多其他 `SOA` 实现一样，是可组合的。维基百科将高度组合系统定义为“提供可重组组件的系统，这些组件可以以各种组合进行选择和装配，以满足特定的用户需求。使组件可组合的关键属性是：它是自包含的（模块化的），即它可以独立部署……；它可能与其他组件协作，但依赖组件是可替换的。它还必须是无状态的，这意味着它将每个请求视为独立的事务，与先前的任何请求无关。”\n\
  \n以下是有助于交付云计算的通认的重组组件：\n\n\n\n\n\n## 云计算模型\n\n## 存储即服务 [storage] \n`FaaS` 通常被称为数据存储即服务\
  \ (`DaaS`)，允许用户在高度可扩展的分层文件系统中存储各种数据类型的文件，并并通过互联网以各种多用途互联网邮件扩展 (MIME) 类型的形式检索这些文件。`FaaS`\
  \ 是最早的云服务之一。诸如 SmugMug、DropBox、Ozmo 和 HolaServers 等互联网初创公司使用亚马逊云服务（Amazon Web Services）的简单存储服务\
  \ (`S3`) 来存储图像和其他文件，并向用户收取少量或不收取访问费用。Microsoft Live SkyDrive 是一家 `FaaS` 提供商，为用户提供高达\
  \ 25GB 的免费文件存储。\n\n数据存储即服务或数据库即服务的术语意味着结构化存储，并至少具备某些关系型数据库管理系统 (`RDBMS`) 功能，例如查询能力、主键和外键索引以及通过模拟\
  \ `JOINs` 实现的实体关联。商业云服务，如亚马逊云服务 (`AWS`)、Google App Engine (`GAE`) 和 Windows Azure，提供了索引化的实体-属性-值\
  \ (`EAV`) 表和与 `SQL` 有某些关系的查询语言。微软表示 SQL Azure 数据库 (`SADB`) “在云端提供高度可扩展的面向网络的分布式数据库服务，用于存储和处理关系查询。”`SADB`、亚马逊\
  \ SimpleDB 和 `GAE` 的 `DataStore` 提供了高级功能，使其能够被称为数据库即服务 (`DBaaS`)。\n\n### 软件即服务\n\
  `SaaS` 通过互联网以订阅或基于使用的定价模型向终端用户交付捆绑好的或等同的商业软件应用程序，而不是针对特定版本的传统终身许可。示例包括 Microsoft\
  \ Office Live、Microsoft Exchange Online、Microsoft SharePoint Online、Microsoft Dynamics\
  \ CRM Online 和 [Salesforce.com](http://Salesforce.com)。微软是早期的 SaaS 支持者，曾提供基于 `SOAP`\
  \ 的网络服务，但逐渐转向推广“软件加服务” (`S+S`)。应用即服务是 `SaaS` 的同义词。\n\n### 软件加服务\n`S+S` 是微软的营销术语，指由微软或托管合作伙伴作为托管服务提供的传统许可本地部署软件。托管合作伙伴可以提供虚拟化的私有微软服务器应用程序（如\
  \ `Exchange` 或 `SQL Server`），或为微软托管的应用程序提供增值服务。`S+S` 的特征是客户能够在本地运行等同的服务。`S+S` 最有趣的的例子是亚马逊云服务的\
  \ `EC2` 运行着 Windows Server 2003 和带有 `SQL Server [Express]` 2005，并带有 Elastic Block\
  \ Store 数据存储以及用于亚马逊机器镜像 (`AMIs`) 和 `EBS` 快照备份的 `S3` 存储。\n\n### 基础设施即服务\n`IaaS` 通过网络（通常是互联网，但不必须）提供传统的数据中心资源，如高度可扩展的虚拟化计算能力、内存和存储，并且通常采用订阅或按需定价模型。`IaaS`\
  \ 也称为公用计算。互联网交付的云示例包括亚马逊云服务、GoGrid 和 Flexiscale。通过内网交付的 `IaaS` 或 `PaaS` 称为私有云。\n\
  \n### 通信即服务\n`CaaS` 提供面向服务、可配置、可调度、可预测且可靠的通信能力，以及网络安全、用于流量隔离或专用带宽的虚拟覆盖网络动态配置、保证的消息延迟、通信加密和网络监控。`CaaS`\
  \ 对于满足服务水平协议 (`SLAs`) 至关重要，但通常被认为是 `SaaS`、`S+S` 或 `IaaS` 的组件。\n\n### 监控即服务\n`MaaS`\
  \ 通知用户云计算或网络中断、错误或减慢。例如，Cloud Status 是一个简单的 iPhone 应用程序，监控亚马逊云服务、Google App Engine\
  \ 和 Twitter 的状态，并报告服务是正常、有问题还是已宕。`MaaS` 可以包含用于网络漏洞评估或用于验证 SLA 合规性以及每月使用费用的准确性的审计组件。某些\
  \ `MaaS` 服务的供应商（如 RightScale）还提供实例部署自动化，以便在需求高峰期增加运行的 `AMI` 实例数量，并在需求下降时减少数量。\n\n\
  ### 平台即服务\n`PaaS` 通常包含至少三个不同元素：\n\n*   **工具即服务 (TaaS)**：提供基于 Web 的开发工具和语言，例如 Microsoft\
  \ Visual Studio（用于 Visual C#、Visual Basic、`IronPython` 和 `IronRuby`）或开源 `Eclipse`（主要用于\
  \ `Java`）。Windows Azure Tools for VS 2008 包含了创建 Web、Worker、Web 和 Worker 以及云顺序流服务的模板，这些服务可以在本地（开发者）或云（生产环境）Windows\
  \ Azure 实例 (`fabric`) 下运行。Google App Engine 提供托管的 Python 变体以及 webapp 和 `Django`\
  \ 框架。\n*   **虚拟化运行时应用平台**：允许在云中运行应用程序，通常位于 `IaaS` 之上并作为 `SaaS` 交付。亚马逊 `EC2` 拥有 32\
  \ 位和 64 位 Linux 发行版、带有 `SQL Server 2005` 的 Windows Server 2003 R2 以及 Oracle 数据库的预构建\
  \ `AMIs`，以及 64 位 `OpenSolaris`。Windows Azure 运行在带有自定义版本微软 `Hyper-V` 管理程序的 Windows\
  \ Server 2008 上。Google App Engine 提供 `Python`。\n*   **FaaS**：在亚马逊的 Elastic Block\
  \ Store、`SimpleDB` 或 `S3`、Google 的 `BigTable` 或 Windows Azure Storage Services 表和\
  \ blob 中持久化运行时应用程序的状态。\n\n### 万物即服务\n根据维基百科，`EaaS`、`XaaS` 或 `aaS` 是云计算的一个子集，它将 `EaaS`\
  \ 定义为“一种能够跨网络调用可重用、细粒度软件组件的概念”。该定义中缺失的是组件之间的编排交互以解决业务问题，这通常被称为集成即服务。\n\nHP 是万物即服务的主要倡导者之一。HP\
  \ Labs 2008 年创新研究计划中的研究课题之一“主题 22：在全局服务生态系统中创建业务运营环境”开头提到以下两段：在这项应用研究项目中，HP Labs\
  \ 正在研究在“万物即服务”模型下可能的客户服务生命周期和体验，并对实现这些所需的知识产权进行原型设计。HP Labs 在该研究领域的目标是解决业务任务迁移到互联网服务时必须克服的技术挑战。\n\
  \n\n\n\n\n`cloud computing`（云计算）一术尚未获得一个让所有参与者——观察者、供应商和消费者——都能认可的定义、技术 set 或抽象层。诸如\
  \ `SOA`、`utility computing`（公用计算）或 `open services`等泛指性术语并不精确，无法准确识别云计算模型。这种情况促使信息科学家尝试创建一种云计算本体论。根据维基百科，“本体论涉及关于哪些实体存在或可以被认为存在的问题，以及这些实体如何根据相似性和差异进行分组、在层次结构中建立关联并划分。”\n\
  \n为了应对这一挑战，来自加利福尼亚大学圣塔芭芭拉分校的博士候选生 Lamia Youseff，以及位于纽约州约克敦的`IBM T.J. Watson Research\
  \ Center`的研究员 Maria Butrico 和 Dilma Da Silva 在 2008 年发表了一篇名为《迈向统一云计算本体论》的研究论文，论文建立了图\
  \ 1.4 所示的五层模型，用以定义 `SaaS`、`PaaS`、`IaaS`、`DaaS`、`CaaS` 和 `HaaS` 之间的关系。\n\n图 1.4 《迈向统一云计算本体论》研究论文中描述的云计算五层结构。\n\
  \n![1.4](img/c01f004.jpg)\n\n以下是书中使用的 Youseff 五层本体模型的高级概览：\n\n*   Youseff 及其同事将顶层\
  \ `Cloud Application Layer`（云应用层）指定为通过 Web 门户访问 `SaaS` 应用（如 `Salesforce CRM` 和 `GAE`）入口。\n\
  *   云应用开发者使用 `Cloud Software Environment Layer`（云软件环境层），该层为编程语言和一组应用程序接口（`APIs`）“促进环境与云应用之间的交互”，这导致了平台即服务（PaaS）的名称。`Cloud\
  \ Software Environment Layer` 构建在 `Software Kernel`（软件内核）和 `Firmware/Hardware`（固件/硬件）层之上，并提供计算服务（`IaaS`）、数据存储（`DaaS`）和通信服务（`CaaS`）。虚拟机（`VMs`）通常交付\
  \ `IaaS`，尽管 `Windows Azure` 提供了运行 `Windows Server 2008` 的专用服务器选项。然而，有人认为 `CaaS`\
  \ 能力属于较低的 `Firmware/Hardware`（`HaaS`）层，因为由于没有 `CaaS`，离线的 `HaaS` 是不可行的。\n\n作者将带有\
  \ `Apex` “按需”编程语言的 `Salesforce CRM` 以及支持 `Python` 的 `GAE` 分类在前两层。[Salesforce.com](http://Salesforce.com)\
  \ 将 [Force.com](http://Force.com) 指定为一种 `PaaS` 产品，截至 2009 年初，它支持来自独立软件供应商（`ISVs`）的\
  \ 800 多个应用程序和 80,000 多个自定义应用程序。`GAE` 要求至少熟悉 `Python` 编程才能提供有用服务，但承诺未来将支持其他语言。`Windows\
  \ Azure Platform` 的名称及其对 `Visual Studio 2008` 的依赖使得微软的云产品完全处于 `PaaS` 类别。`Windows\
  \ Azure` 支持任何符合 `Common Language Runtime`（`CLR`）的编程语言。Youseff 的研究论文在 2009 年初尚未引用\
  \ `Azure`。\n\n*   `Software Kernel` 可以实现为 `OS kernel`、`hypervisor`（虚拟机监控程序）、虚拟机监控器和/或集群中间件，或这些系统的各种组合。尽管网格应用在早期云计算实现中发挥了重要作用，但网格已让\
  \ `hypervisor` 成为云计算的首选软件内核，因为后者从服务中抽象了硬件特殊性。加入 `CaaS` 使这一层等同于传统的 `VPS` Web 托管。\n\
  *   `Firmware/Hardware` 层是构成云骨干的物理计算、交换和路由硬件。`HaaS` 供应商代表其租户操作、管理和升级硬件，租户提供自己的操作系统和应用程序软件，并按\
  \ `GB` 对数据进入和出站收费，类似于 Web 服务器托管。租赁消除了用户投资建设和管理数据中心的需求，并可能降低电力和保险成本。\n\n其他公认和自封的云计算“思想领袖”提供了许多云计算定义和本体论。例如，Blue\
  \ Mountain Labs 的 David Linthicum 在其 2009 年 1 月 18 日的博客文章《定义云计算框架》中提出并简要描述了以下 10\
  \ 个主要云计算组件（[`bit.ly/iYgXc`](http://bit.ly/iYgXc), [`cloudcomputing.sys-con.com/node/811519`](http://cloudcomputing.sys-con.com/node/811519)）：\n\
  \n*   `Storage-as-a-Service`（存储即服务）\n*   `Platform-as-a-Service`（平台即服务）\n*   `Database-as-a-Service`（数据库即服务）\n\
  *   `Integration-as-a-Service`（集成即服务）\n*   `Information-as-a-Service`（信息即服务）\n*\
  \   `Security-as-a-Service`（安全即服务）\n*   `Process-as-a-Service`（过程即服务）\n*   `Management/Governance-as-a-Service`（管理/治理即服务）\n\
  *   `Application-as-a-Service`（应用即服务）\n*   `Testing-as-a-Service`（测试即服务）\n\n根据云计算互操作性论坛（CCIF）的使命与目标页面（[`bit.ly/YAmDP`](http://bit.ly/YAmDP),\
  \ [`groups.google.com/cloudforum/web/ccif-mission-goals`](http://groups.google.com/cloudforum/web/ccif-mission-goals)），该论坛的成立是为了实现一个能够无缝协作的计算生态系统。“重点将放在创建一个允许两个或多个云平台以统一方式交换信息的框架/本体论。”CCIF\
  \ 的 Google 小组在 2009 年初约有 550 名成员。为云计算创建详细的分类不可避免地会陷入红皇后竞赛：“你必须尽力跑才能留在原地。”Youseff\
  \ 的五层模型可能足够使用，直到云计算进入青少年期或 CCIF 产生替代方案。\n\n刘易斯·卡罗尔《爱丽丝镜镜奇游》中的红皇后说：“你必须尽力跑才能留在原地。如果你想去别的地方，你必须跑得快一倍。”\n\
  \n根据维基百科，红皇后原理可以重述为：“对于进化系统来说，需要持续开发以保持与其共同进化的系统的适应性。”\n\n### 云计算担忧\n\n隐私和安全是 IT\
  \ 经理在尝试通过 `PaaS`、`IaaS`、`SaaS` 或任何云计算服务组合降低预算并提高可扩展性面临的两个主要治理问题。InformationWeek\
  \ 杂志在 2008 年底对 456 名“业务技术人士”进行的调查显示，只有 18% 的人使用云服务，34% 的人没有兴趣。超过一半的受访者对安全表示担忧；性能、控制、供应商锁定和支持是关于云计算的下四个最受关注的问题。SaaS\
  \ 也面临同样的质疑，但 `Salesforce.com` 和 `AWS` 的成功证明治理问题是可以克服的。\n\n以下是 Mike Fratto 在 2009\
  \ 年 1 月 26 日的 InformationWeek 文章《云控制》中提出的保护云数据“五个快速修复方案”，该文章得出了调查结论：\n\n1. 定义你的治理需求：是内部的、外部的法律法律？列出需求以及如何满足。\n\
  2. 对你的数据进行分类：在确定哪些数据可以安全地放入云端之前，首先要根据敏感性和类型进行分类和标记。\n\n\n\n\n\n3. **明智选择**：识别能够满足你的处理和治理需求的云供应商。引导业务领导者放弃其他供应商，无论其定价有多有吸引力。\n\
  \n4. **设定限制**：定义服务提供商对你的数据可以进行的操作。未经你的许可，禁止将处理工作外包给第三方是基本要求。\n\n5. **将规则书面化**：发布政策和程序，规定哪些云供应商可以接收什么类型的数据。\n\
  \n云治理最重要的元素之一是确定数据在云端时的存储位置。正如 Fratto 在其文章中所观察到的，`SaaS` 和其他云提供商可能会将数据存储在另一个组织控制的服务器上。通过计算服务外包数据存储或备份可能会导致你的组织与其原始数据之间产生两个或多个层级的隔离。\n\
  \n行业团体（例如支付卡行业 `PCI`）要求银行、在线商户和会员服务提供商（`MSPs`）遵守一系列安全标准来保护持卡人信息，这些标准包括万事达站点数据保护（`SDP`）和\
  \ Visa 持卡人信息安全计划（`CISP`）。1996 年美国《健康保险与责任法案》（`HIPAA`）为所有医疗相关数据的电子交换（`EDI`）、安全性和机密性建立了标准机制。如果不知道谁物理持有你的信用卡数据，将无法通过\
  \ `PCI` 审计，这可能导致商户无法接受信用卡或借记卡支付；这无疑会导致罚款或其他制裁。然而，这些安全和隐私问题也适用于外包传统的数据输入和处理，这种做法正变得越来越普遍，并且并非云计算所特有。\n\
  \n美国国家标准与技术研究院（`NIST`）正在考虑识别最基本的标准和架构，以便联邦机构能够创建或购买互操作的云计算能力。NIST 的使命是“提供标准和技术，保护信息系统免受信息机密性、过程完整性以及信息和服务可用性方面的威胁，从而建立对信息技术（`IT`）系统的信任和信心。”NIST\
  \ 的《云计算与标准展望》报告列出了潜在联邦云基础设施的以下特征：\n\n* 机构将拥有云实例“节点”。\n* 节点将为运行云应用程序提供相同的软件框架。\n\
  * 节点将参与联邦云基础设施建设。\n* 联邦基础设施将促进并采用云架构（非专有）。\n* “最低标准”指的是在确保节点互操作性和应用程序可移植性的同时，不抑制创新，从而限制云部署的规模。\n\
  \n随后，NIST 发布了他们的《云计算工作性定义草案 v13`（`http://bit.ly/10TNdu`, `http://csrc.nist.gov/groups/cloud-computing/cloud-def-v14.doc`）以及《有效安全地使用云范式演示\
  \ v18`（`http://bit.ly/17PKbM`, `http://csrc.nist.gov/groups/cloud-computing/cloud-computing-v22.ppt`）。预计奥巴马白宫将成为第一个主要的云计算服务联邦政府用户。\n\
  \n在编写此书时，还没有非专有的云架构标准；节点互操作性是一个名为统一云接口（`UCI`）的 CCIF 分离项目的目标（`http://bit.ly/EHRrp`,\
  \ `http://code.google.com/p/unifiedcloud`），该项目由 `Enomaly` 的创始人 Reuven Cohen（`http://bit.ly/16DldY`）并兼任首席技术官启动。根据\
  \ Cohen 的说法，`UCI` 的“概念是提供一个单一接口，可用于检索所有多云资源的统一表示，并根据需要控制这些资源”。Cohen 在项目的 `UCI_Requirements`\
  \ Wiki 中写道：\n\n统一云接口（`UCI`）的关键驱动力是“用一个抽象统治一切”——一个用于其他 API 的 API。`UCI` 将是一个单一的抽象，可以通过统一接口涵盖整个架构栈以及新兴的云中心技术。语义模型为\
  \ `UCI` 带来的能力是能够将像亚马逊云服务之类的云端 API 与现有协议和标准连接起来，无论底层 API 或技术的采用程度如何。其目标很简单：编写一次应用程序，即可出于任何原因在任何时间、任何地方进行部署。\n\
  \nCohen 认为“你无法定义的东西就无法标准化”，因此云计算分类法/本体论将在 `UCI` 中起着重要作用。最终目标似乎是防止云供应商锁定，使已部署的 `PaaS`、`IaaS`\
  \ 或 SaaS` 项目能够快速从外部云迁移到私有云，或迁移到另一个供应商的云基础设施，且产生最小的不便或成本。\n\nNIST 承诺在 2009 年及以后创建这些额外的“特别出版”：\n\
  \n* 云架构安全\n* 云应用程序安全\n* 在云中实现并执行取证分析\n* 在云架构中实现安全监控集中\n* 通过服务水平协议从第三方云架构获取安全性\n\
  * 安全合规框架与云计算（例如，`HIPAA`、`FISMA`、`SOX`）\n\n你可以通过计算机安全部门计算机安全资源中心出版页面上的特别出版物（800 系列）链接找到这些出版物的草案版本（`http://bit.ly/17d9qq`,\
  \ `http://code.google.com/p/unifiedcloud`）。\n\n如果 NIST 能为互操作的非专有云架构制定一套非专有的安全特性，信息技术实验室将对云计算做出重大贡献。\n\
  \n### 总结\n\n云计算是一项新兴技术，有望在 2009 年和 2010 年达到“下一个首选”的地位。IDC 在 2008 年 10 月发现云计算正“加速采用，并有望在未来五年内获取\
  \ IT 支出的增长”。\n\n\n\n\n定义通用云计算是困难的，因为目前还没有一套被广泛认可云服务本体论或分类法。`SOA` 引入了`软件即服务`（SaaS）以及微软的\
  \ `Software+Services` 实现，但平台、基础设施、计算、存储、通信和硬件作为服务，在云计算提供“一切即服务”（Everything as a\
  \ Service）的尝试中也占有一席。三位信息科学家提出了一个五层模型，包含了 `SaaS`、`PaaS`、`IaaS`、`DaaS`、`CaaS` 和 `HaaS`。\n\
  \n云符号意味着通过公共互联网进行无限制或受限访问。因此，云应用程序和数据的安全是高层管理主要的治理关注之一。今天的云主要依赖于基于令牌的用户身份验证和授权方案，但与企业目录集成的联邦访问控制已在大多数云供应商的计划之中。另一个问题是供应商锁定，因为目前不存在云互操作性标准，且此类标准可能永远无法达成一致。不信任现有互联网访问控制协议的组织可以在企业防火墙后创建自己的本地“私有云”，但这样做需要对\
  \ IT 基础设施进行资本投资，并抵消了云计算的主要理由。\n\n# 第 2 章\n\n## 理解 Windows Azure 平台架构\n\nWindows\
  \ Azure 平台是微软的`平台即服务`（`PaaS`）产品，运行在位于微软数据中心并相关的网络基础设施上，并连接到公共互联网。该平台由一个高度可扩展（弹性的）云操作系统、数据存储织以及通过物理或逻辑（虚拟化）`Windows\
  \ Server 2008` 实例交付的相关服务组成。Windows Azure 软件开发包（`SDK`）提供了云端服务的开发版本，以及在 Windows Azure\
  \ 中开发、部署和管理可扩展服务所需的工具和 `APIs`，包括用于标准化 Azure 应用程序的 `Visual Studio 2008` 或 `2010`\
  \ 模板。图 2.1 展示了该平台的主要云组件和开发者组件。\n\n图 2.1 Windows Azure 平台和 `SDK` 的组件。带有星号（*）标记的服务在本书\
  \ 2009 年年中编写时尚不可用。\n\n![2.1](img/c02f001.jpg)\n\n根据微软的介绍，Azure 的主要用途是：\n\n 为现有的封装应用程序添加\
  \ Web 服务能力\n* 以最少的本地资源向 Web 端构建、修改和分发应用程序\n* 在场外执行服务，例如大容量存储、批处理、密集型或高量计算等\n* 快速且廉价地创建、测试、调试和分发\
  \ Web 服务\n* 降低构建和扩展本地资源的成本和风险\n* 减少 IT 管理的投入和成本\n\n微软在 2008 年 10 月底发布 Azure 时的经济环境决定了成本降低——上述列表中反复提到——将是小型、中型企业级\
  \ IT 部门采用它的主要动力。\n\n微软设计 Azure 平台是为了让 `.NET` 开发者能够利用他们在使用 `Visual Studio 2008+`\
  \ 中创建 `ASP.NET Web` 应用程序和 `Windows Communication Framework`（`WCF`）服务的经验。Web 应用程序项目运行在沙箱版本的\
  \ `Internet Information Services`（`IIS`） 7 中；不支持基于文件系统的网站项目，但预计在 PDC 2009 上宣布“持久驱动器”。Web\
  \ 应用程序和基于 Web 的服务运行在部分信任的代码访问安全（Code Access Security）中，这大致对应于 `ASP.NET` 的中等信任，并限制了对某些操作系统资源的访问。Windows\
  \ Azure `SDK`（2009 年 3 月 CTP）允许可选的全信任代码访问，以便调用非`.NET` 代码、使用需要全信任的 `.NET` 库以及使用命名管道进行进程间通信。微软承诺在云平台上支持执行\
  \ Ruby、`PHP` 和 `Python` 代码。初始开发平台发布限制在 `Visual Studio 2008+` 作为开发环境，并计划在未来支持 `Eclipse`\
  \ 工具。Azure 平台支持 Web 标准和协议，包括 `SOAP`、`HTTP`、`XML`、`Atom` 和 `AtomPub`。\n\n## Windows\
  \ Azure 开发者门户\n\n开发者将 `ASP.NET` 应用程序迁移到云端的初始切入点是 `http://bit.ly/PbtOV (https://windows.azure.com/Cloud/Provisioning/Default.aspx)`\
  \ (`http://bit.ly/PbtOV%20(https://windows.azure.com/Cloud/Provisioning/Default.aspx)`）上的\
  \ Windows Azure 开发门户，登录需要使用 Windows Live ID。Azure 社区技术预览（CTPs）需要单独的 `GUID` 令牌：\n\
  \n* Windows Azure，包括：\n    * Azure 托管服务\n    * 存储账户\n* `SQL Azure`\n* Live Services，包括：\n\
  \    * Live Framework：社区技术预览\n    * Live Services：现有 APIs\n\n`Live Services: Existing\
  \ APIs` 不是 CTP，且不需要令牌；每个 Windows Azure 账户都会获得一个 `Compute Only Live Services: Existing\
  \ APIs` 账户。截至 2009 年初，一个 Windows Azure 令牌允许你拥有一个托管服务账户、两个存储账户，以及一个托管部署和一个托管部署实例。你通过\
  \ Microsoft Connect 页面请求 Azure 令牌，通过点击开发门户的“Summary - My Projects”页面上的 `Billing`\
  \ 链接访问该页面。\n\n图 2.2 显示 2009 年 1 月 CTP 的账户页面，用于 `SQL Azure`、`.NET` 服务和 `Live Services`。该页面允许你兑换邮件提供的\
  \ Azure 和 `Live Framework` CTP 令牌，以及用于指定何时何时接收应用程序警报、通讯和门户更新的 `Live Alerts` 页面。\n\
  \n图 2.2 2009 年 7 月 CTP 的开发门户 Summary - Windows Azure。\n\n![2.2](img/c02f002.jpg)\n\
  \n2009 年 3 月 CTP 引入了地理位置，允许账户持有者指定存储托管和服务存储账户的数据中心。本书编写时有两个选择：`USA-Northwest`（华盛顿州昆西）和\
  \ `USA-Southeast`（圣安东奥）。你将一组托管服务和存储账户添加到亲和组（Affinity Group）中，以服务和服务存储运行在同一个数据中心，从而提高性能。\n\
  \n图 2.3 显示了兑换了多个 Windows Azure 令牌的令牌页面。你将从 Azure 成员处收到的 `GUID` 粘贴到 `Resource Token\
  \ ID` 框中，并点击 `Claim Token` 将一个或多个实体添加到列表中。\n\n![2.3](img/c02f003.jpg)\n\n如果你想开发支持\
  \ `Live Framework` 的网站或支持 Mesh 的 Web 应用程序，请通过电子邮件向 `meshctpe@microsoft.com` 请求 `Live\
  \ Framework` CTP 令牌。在收到并兑换 `Live Framework` 令牌后，从 `Live Services SDK` 页面上的链接下载并安装\
  \ `Live Framework SDK` 和 `Live Framework Tools for Visual Studio` 的最新 CTP。你必须兑换\
  \ `Live Framework` 令牌才能下载 `Live SDK` 和工具。\n\n\n\n\n你不需要 Windows Azure 账户即可测试 Azure\
  \ 托管服务（Hosted Services）和存储服务（Storage Services），因为正如后续章节所示，Azure 开发平台会在你的开发计算机上模拟\
  \ Azure 云服务。\n\n### 在 Azure 开发平台中创建和运行项目\n\nAzure Cloud Fabric 和 Azure Storage Services\
  \ 不支持基于云的开发或调试操作，因此 Azure SDK 以开发织网（DF）和开发存储（DS）应用程序的形式提供了本地副本，这些程序是由 Windows Azure\
  \ SDK 安装的。该 SDK 还会安装一个 `Programs\\Windows Azure SDK [Month 2009 CTP]` 菜单，以及一组示例应用程序和包装类库，用以简化应用程序编程。\n\
  \n要安装并运行 SDK，必须存在 `.NET Framework 3.5 SP1` 以及 `SQL Express 2005` 或 `2008`，并且必须在\
  \ `Windows Server 2008`、`Windows Vista SP2` 或 `Windows 7 RC` 或更高版本下，为 `IIS 7.0`\
  \ 启用 `ASP.NET` 和 `WCF HTTP Activation`。Windows Azure SDK CTPset 说明包含设置这些选项的指令。SDK\
  \ 并非强制性的，因为可以使用任何支持 HTTP 请求和响应的操作系统和编程语言。然而，你会发现使用 SDK 的 `.NET APIs` 和库进行应用程序和存储开发比直接处理\
  \ HTTP 要简单得多。\n\n### 安装 Windows Azure SDK 和 Visual Studio 工具\n\n在安装 Windows Azure\
  \ SDK 后，你必须下载并安装 Windows Azure Tools for Visual Studio，以便为 Web 云服务、Worker 云服务、Web\
  \ 和 Worker 云服务以及工作流服务（Workflow Service）项目添加模板。后面的“在 Visual Studio 2008 中使用 Azure\
  \ 模板”章节描述了这些模板之间的差异。\n\n你可以从 Microsoft Windows Azure 主页底部的链接 `[`bit.ly/A7Uza`](http://bit.ly/A7Uza)`\
  \ (`[www.microsoft.com/azure/windowsazure.mspx](http://www.microsoft.com/azure/windowsazure.mspx))\
  \ 下载当前版本的 Windows Azure SDK 和 Windows Azure Tools for Visual Studio。\n\n### 安装并编译\
  \ Windows Azure SDK 示例应用程序\n\n安装 Windows Azure SDK 不会安装其示例应用程序，示例包含在 `\\Program\
  \ Files\\Microsoft Windows Azure SDK\\v1.0\\samples.zip` 文件中。通过将 `samples.zip` 解压到你有写入权限的文件夹来安装示例文件。本书使用了提取到\
  \ `C:\\Windows Azure SDK Samples` 文件夹的示例。\n\n下面的表格描述了示例应用程序。\n\n运行 CloudDrive 示例需要\
  \ Windows PowerShell。\n\n解压 `samples.zip` 的文件夹还包含以下三个命令文件，你可以从 `\\Programs\\Windows\
  \ Azure SDK\\Windows Azure SDK` 命令提示符中运行它们：\n\n* `buildall.cmd` 在不使用 Visual Studio\
  \ 的情况下构建所有示例项目；`buildall.cmd` 运行 `BuildAll` 项目，该项目不是示例。\n* `creatables.cmd` 调用 `buildall.cmd`\
  \ 并为使用表存储（Table Storage）的示例创建数据库和数据表。\n* `rundevstore.cmd` 调用 `creatables.cmd` 并启动开发存储，将其指向由\
  \ `creatables.cmd` 创建的数据库。运行开发存储将启动 Blob（二进制大对象）、队列（Queue）和表服务，见后文“开发存储”章节。\n\n\
  最简单的选项是执行 `rundevstore.cmd`。\n\n| 项目名称 | 项目描述 |\n| :--- | :--- |\n| AspProviders\
  \ Sample | 提供一个示例库，其中包含 ASP.NET Membership、Role、Profile 和 Session State 程序的程序的实现。\
  \ |\n| AspProvidersDemo Sample | 一个利用 ASP.NET 提供程序示例库的简单服务。 |\n| CloudDrive Sample\
  \ | 一个 Windows PowerShell 提供程序，允许通过命令行访问 Blob 存储和队列服务资源，就像它们是通过网络驱动器可用的文件系统资源一样。\
  \ |\n| DistributedSort Sample | 一个分布式排序服务，演示了 Blob 存储和队列服务的使用。 |\n| HelloFabric\
  \ Sample | 一个演示 WebRole 和 WorkerRole 的简单服务，并使用 Windows Azure 运行时 API 从运行的实例与织网（fabric）交互。\
  \ |\n| HelloWorld Sample | 演示如何对服务进行打包以部署到织网。 |\n| PersonalWebSite Sample | 演示如何将\
  \ ASP.NET Web 应用程序迁移到 Windows Azure 环境。 |\n| StorageClient Sample | 一个示例客户端库，为 Blob、队列和表存储的\
  \ REST API 操作提供 .NET 包装类。该示例还包含一个可以测试库功能的控制台应用程序。 |\n| Thumbnails Sample | 一个演示\
  \ WebRole 和 WorkerRole 的服务。WebRole 为用户提供上传照片的前端应用程序并向队列添加工作项。WorkerRole 从队列中获取工作项并在指定目录创建缩略图。\
  \ |\n\n### 开发织网（Development Fabric）\n\nDF 包含以下执行文件：`DFAgent.exe`、`DFLoadBalancer.exe`、`DFMonitor.exe`\
  \ 和 `DFService.exe`，Azure SDK 安装程序默认将其安装在开发 PC 的 `\\Program Files\\Windows Azure\
  \ SDK\\v1.0\\bin\\devfabric` 文件夹中。通过以下操作启动 DF 后，任务管理器的进程页将显示这四个进程正在运行：\n\n* 选择 `Programs\\\
  Windows Azure SDK\\Development Fabric` 来启动开发织网服务及其 UI (`DFUI.exe`)。\n* 如果任务栏通知区域存在\
  \ DF 图标，右键点击该图标并选择“启动开发织网服务”（参见图 2.4）。\n* 在 Visual Studio 中编译并运行启用 Azure 的应用程序。\n\
  \n图 2.4 鼠标悬停（上方）或右键点击（下方）任务栏上的 DF 图标后显示的消息。\n\n图 2.5 显示了在 VS 2008 中调试的两个 Web 应用程序（称为部署）。织网会自动分配部署编号（616\
  \ 和 617）。当你停止调试时，相应的应用程序项从 DFUI 中消失。\n\n### 开发存储（Development Storage）\n\nWindows\
  \ Azure 平台支持三种可扩展持久存储：\n\n* 非结构化数据（Blob）\n* 结构化数据（表）\n* 应用程序、服务或两者之间的消息（队列）\n\n\
  执行 `rundevstore.exe` 或在 Visual Studio 中编译运行 Azure 用户代码将启动所有三个服务，即使你的项目只需要一种，并显示如图\
  \ 2.6 所示的开发存储 UI。\n\n图 2.6 打开的开发存储 UI (DSUI) 应用程序显示了 `rundevstore.exe` 程序为三个 Azure\
  \ 服务分配的默认端口以及用于存储开发架构的默认表名。\n\n### Azure 服务定义文件和服务配置文件\n\n在开发框架中运行的 Azure 应用程序可以访问存储在本地开发存储或上传到\
  \ Azure 云存储中的数据。应用程序将在项目 `ServiceConfiguration.cscfg` 文件中作为端点指定的位置中查找端口号和存储的数据。\n\
  \n\n\n\n\nAzure 项目的 `ServiceDefinition.csdef` 文件定义了一组标准的输入端点和配置设置，其值存储在 `ServiceConfiguration.cscfg`\
  \ 文件中。Listing 2-1 显示了当您基于 Visual Studio 的 Windows Azure 工具标准模板创建 Azure 项目时，`ServiceDefinition.csdef`\
  \ 文件的默认内容，并强调了重要值：\n\nListing 2-1: 默认 `ServiceDefinition.csdef` 文件内容\n\n```xml\n\
  <ServiceDefinition name=\"SampleWebCloudService\"\n  xmlns=\"http://schemas.microsoft.com/ServiceHosting/2008/10/ServiceDefinition\"\
  >\n  <WebRole name=\"WebRole\">\n    <InputEndpoints>\n      <!-- 在云端运行时，http 必须使用\
  \ 80 端口，https 必须使用 443 端口 -->\n      <InputEndpoint name=\"HttpIn\" protocol=\"\
  http\" port=\"80\" />\n    </InputEndpoints>\n    <ConfigurationSettings>\n    \
  \  <Setting name=\"AccountName\"/>\n      <Setting name=\"AccountSharedKey\"/>\n\
  \      <Setting name=\"BlobStorageEndpoint\"/>\n      <Setting name=\"QueueStorageEndpoint\"\
  />\n      <Setting name=\"TableStorageEndpoint\"/>\n    </ConfigurationSettings>\n\
  \  </WebRole>\n</ServiceDefinition>\n```\n\n`InputEndpoint` 的值仅适用于云存储。\n\nListing\
  \ 2-2 是 SampleWebCloudService Web 应用程序的 `ServiceConfiguration.cscfg` 文件内容，强调了开发存储（Development\
  \ Storage）的默认配置值：\n\nListing 2-2: 默认 `ServiceConfiguration.cscfg` 文件内容\n\n```xml\n\
  <?xml version=\"1.0\"?>\n<ServiceConfiguration serviceName=\"SampleWebCloudService\"\
  \nxmlns=\"http://schemas.microsoft.com/ServiceHosting/2008/10/ServiceConfiguration\"\
  >\n  <Role name=\"WebRole\">\n    <Instances count=\"1\"/>\n    <ConfigurationSettings>\n\
  \      <Setting name=\"AccountName\" value=\"devstoreaccount1\"/>\n      <Setting\
  \ name=\"AccountSharedKey\" value=\"Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMw====\"\
  />\n      <Setting name=\"BlobStorageEndpoint\"      value=\"http://127.0.0.1:10000/\"\
  />\n      <Setting name=\"QueueStorageEndpoint\"    value=\"http://127.0.0.1:10001/\"\
  />\n      <Setting name=\"TableStorageEndpoint\"      value=\"http://127.0.0.1:10002/\"\
  />\n      <!--<Setting name=\"AccountName\" value=\"oakleaf\"/>\n           <Setting\
  \ name=\"AccountSharedKey\" value=\"3elV1ndd ... Coc0AMQA==\" />\n           <Setting\
