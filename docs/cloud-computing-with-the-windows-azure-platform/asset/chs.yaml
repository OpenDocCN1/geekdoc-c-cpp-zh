  <entry xmlns=\"http://www.w3.org/2005/Atom\">\n  <id>uuid:61006d59-4ea2-4e16-82d1-6dfea136bb15;id=12865</id>\n\
  \  <title type=\"text\">myhttpqueue</title>\n  <updated>2009-05-26T21:33:25Z</updated>\n\
