  \n## 分析 .NET 服务 SDK 的 EchoSample\n\nMicrosoft .NET 服务 SDK (2009 CTP) 包含了 `\\Program\
  \ Files\\Microsoft . Services SDK\\Samples\\ServiceBus` 下的多个项目。`GettingStarted`\
  \ 文件夹包含 `C#` 和 VB 版本的 `Echo` 服务。`Echo` 服务是一个包含 `Server` 和 `Client` 项目的 `WCF` 解决方案。该服务接收客户端的字符串并回显（参见\
  \ 图 10.3）。\n\n图 10.3 这个简单的 Web 服务（上方）和客户端（下方）通过 `SB` 解决方案名称和密码进行身份验证，并在客户端和服务之间回显字符串。\n\
  \n![10.3](img/c10f003.jpg)\n\n### 检查服务项目的 EchoContract.cs、EchoService.cs 和 Program.cs\
  \ 文件\n\n`EchoService.sln` 的服务 `C#` 项目引用了 `\\Program Files\\Microsoft . Services\
  \ SDK (2009 CTP)\\Assemblies\\Microsoft.ServiceBus.dll`，并包含三个文件：`EchoContract.cs`、`EchoService.cs`\
  \ 和 `Program.cs`。列表清单 10-1 显示了 `EchoContract.cs` 的内容，它定义了 `IEchoContract` 和 `IEchoChannel`\
  \ 接口。\n\n`EchoContract.cs` 文件对于服务和客户端项目是完全相同的。\n\n\n\n\n\nListing 10-2 定义了 `EchoService`\
  \ WCF 服务，它继承了 `IEchoContract` 并指定了所执行的操作，将文本字符串返回给客户端。\n\n### Listing 10-2:](#9781118058756c10.xhtml_c10_pgml_anc_0002)\
  \ `Service\\EchoService.cs` 类文件的内容\n\n```csharp\nnamespace Microsoft.ServiceBus.Samples\n\
  {\n    using System;\n    using System.ServiceModel;\n    [ServiceBehavior(Name\
  \ = \"EchoService\",\n        Namespace = \"http://samples.microsoft.com/ServiceModel/Relay/\"\
  )]\n    class EchoService : IEchoContract\n    {\n        public string Echo(string\
  \ text)\n        {\n            Console.WriteLine(\"Echoing: {0}\", text);\n   \
  \         return text;\n        }\n    }\n}\n```\n\nService 项目的 `App.config` 文件与\
  \ WCF 服务应用程序项目的文件的相同，但 `netTcpRelayBinding` 属性值外，该值指定了中继服务并在 Listing 10-3 中突出显示。\n\
  \n### Listing 10-3:](#9781118058756c10.xhtml_c10_pgml_anc_0003) `Service\\App.config`\
  \ 文件的内容；指定 `RelayService` 的属性值已突出显示\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\" ?>\n<configuration>\n  <system.serviceModel>\n    <services>\n      <!--\
  \ Application Service -->\n      <service name=\"Microsoft.ServiceBus.Samples.EchoService\"\
  >\n        <endpoint contract=\"Microsoft.ServiceBus.Samples.IEchoContract\"\n \
  \                     binding=\"netTcpRelayBinding\" />\n      </service>\n    </services>\n\
  \  </system.serviceModel>\n</configuration>\n```\n\n根据 .NET 服务库文档，`Microsoft.ServiceBus.NetTcpRelayBinding`\
