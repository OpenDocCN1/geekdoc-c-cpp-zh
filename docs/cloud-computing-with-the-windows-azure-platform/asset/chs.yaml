  \n# 在服务总线队列中持久化消息\n\n`SB` 的主要应用是作为发送者和活动监听器之间的瞬时中继。如果发送者发布消息时监听器未活动状态，消息将会丢失。如果发送者发布消息的速度于监听器处理的速度，也会发生消息丢失。为了解决这些问题，.NET\
  \ Services 团队在 .NET Services SDK 的 2009 年 3 月 CTP 中引入了 `SB Queues` 和 `SB Routers`。`SBQs`\
  \ 和 `SBRs` 是可发现的、持久化的 `SB` 对象，它们独立于监听器的生命周期。[图 11.1] 展示了 `SBQ` 的组件及其关系；后续章节将描述 `SBRs`，它们也可以也可以使用\
  \ `SBQs`。\n\n本章交替使用“监听器 (listener)”和“接收者 (receiver)”这两个术语。\n\n[图 11.1] `SBQ` 组件的关系。\n\
  \n![11.1](img/c11f001.jpg)\n\n# 使用 QueueManagementClient 类创建 SBQs\n\n与其他 .NET Services\
  \ 类似，其基础 API 是带有 `HTTP GET` 和 `POST` 方法的 REST，以及用于定义 `SBQs` 的 AtomPub 扩展。.NET Services\
  \ SDK 的 `Microsoft.ServiceBus` 命名空间（`Microsoft.ServiceBus.dll`）提供了下所示的封装类，以简化使用特定策略创建\
  \ `SBQs` 以及通过客户端访问队列的操作。\n\n| 队列类 | 描述 |\n| :--- | :--- |\n| `QueueClient` | 提供对\
  \ `SBQ` 的客户端访问 |\n| `QueuePolicy` | 指定 `SBQ` 的规则和约束集 |\n| `QueueManagementClient`\
  \ | 允许客户端管理 `SBQs` |\n\n[Listing 11-1] 显示了使用上述类的 C# 代码骨架。\n\n[Listing 11-1:] `QueueMangementClient`\
  \ 类方法的 C# 代码骨架\n\n```csharp\npublic static class QueueManagementClient\n{\n    public\
  \ static QueueClient CreateQueue(TransportClientEndpointBehavior credential, Uri\
  \ queueUri, QueuePolicy queuePolicy);\n    public static void DeleteQueue(TransportClientEndpointBehavior\
  \ credential, Uri queueUri);\n    public static QueueClient GetQueue(TransportClientEndpointBehavior\
  \ credential, Uri queueUri);\n    public static QueuePolicy GetQueuePolicy(TransportClientEndpointBehavior\
  \ credential, Uri queueUri);\n    public static DateTime RenewQueue(TransportClientEndpointBehavior\
  \ credential, Uri queueUri, TimeSpan requestedExpiration);\n}\n```\n\n以下是根据 .NET\
  \ Services SDK 队列项目的 `Readme.htm` 创建新队列的步骤：\n\n1. 创建 `QueuePolicy` 实例并定义队列的名称和所需属性。<QueuePolicy>`\
  \ 元素在 `http://schemas.microsoft.com/ws/2007/08` 中定义。\n2. 从 `AccessControlService`\
  \ 获取用于 `SB` 解决方案的安全令牌。\n3. 测试解决方案中是否存在同名的队列。\n4. 如果指定的队列不存在，将序列化的 `QueuePolicy`\
  \ 嵌入到 ATOM 1.0 `<atom:entry>` 中，并使用 `content-type application/xml;type=entry` 将该项\
  \ `POST` 到指定的 URI。请求必须携带 `X-MS-Identity-Token` 头部，且相应的身份必须对覆盖队列 URI 的范围具有 `Manage`\
  \ 权限。\n\n如果队列创建成功，`POST` 请求将返回 `201 (created)` 状态码并带有 `Location` 头部。location 头部包含你在应用程序中需要保留的队列管理\
  \ URI，以便访问队列的元数据和管理功能。如果无法创建队列，请求可能会产生表中描述的 HTTP 状态码之一。\n\n[Listing 11-2:] 获取 `SB`\
  \ 安全令牌的 HTTP 请求和响应头\n```http\nGET /issuet.aspx?u=oakleaf-sb HTTP/1.1\nHost: accesscontrol.windows.net\n\
  Connection: Keep-Alive\nHTTP/1.1 200 OK\nCache-Control: private\nContent-Length:\
  \ 40\nContent-Type: text/plain\nServer: Microsoft-IIS/7.0\nX-AspNet-Version: 2.0\n\
  Set-Cookie: ASP.NET_SessionId=jjqly45uxe5r3;path=/HttpOnly\nX-Powered-By: ASP.NET\n\
