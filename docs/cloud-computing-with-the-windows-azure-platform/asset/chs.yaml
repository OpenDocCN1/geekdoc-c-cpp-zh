  \ 图 9.20）。点击“保存”保存您的更改，并在信赖方策略页面中查看已添加的策略。\n\n在本地机器上保存各个 `InformationCard.crd` 文件的副本，以便在需要时导入\
  \ CardSpace 存储中，是一种良好的做法。\n\n图 9.20 在“创建新策略”表单上勾选“站点 ID”和“组”框。\n\n![9.20](img/c09f020.jpg)\n\
