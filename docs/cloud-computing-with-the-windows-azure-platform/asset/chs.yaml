  \n`Entity`（实体）是 Azure 表的单元，因此更改属性值需要替换所有属性值，而不是只更新发生变化的的属性（字段）值。`Entities` 不支持投影；`GET`\
  \ 操作仅返回完整的实体，而 `POST` 或 `PUT` 操作仅创建完整的实体。\n\n图 4.6 `Fiddler2` 捕获来自 `SampleWebCloudService`\
