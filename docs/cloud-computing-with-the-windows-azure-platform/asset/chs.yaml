  \ Table Services”节描述了实体的复合主键，它由字符串 `PartitionKey` 和 `RowKey` 值组成。\n\n\n\n\n![4.9](img/c04f009.jpg)\n\
  \n图 4.10 `TableStorageHelpers`, `ParameterValidator`, `TableStorageConstants` 和\
  \ `DataServiceUtilities` 类图。\n\n![4.10](img/c04f010.jpg)\n\n## 使用代码在表不存在时创建新表\n\n\
  当需要访问表的 Web 或 Worker 云端服务会话启动时，`Global` 类的 `Application_BeginRequest` 事件处理程序会调用\
  \ `FirstRequestInitialization` 类的 `Initialize()` 方法，该方法转调用 `ApplicationStartUponFirstRequest()`\
  \ 方法。此方法执行 `StorageAccountInfo.GetDefaultTableStorageFromConfiguration()` 和 `TableStorage.CreateTablesFromModel()`\
  \ 方法，如果表不存在，则根据其类定义生成表。列表 4-1 是来自 `Global.asax.cs` 文件的代码，确保在应用程序启动时每个会话仅调用一次这些方法：\n\
  \n开发存储不支持从项目代码中动态创建表。相反，你必须右键点击云服务并选择 `Create Test Storage Tables` 命令，通过反射创建 SQL\
  \ Server Express 表。\n\n| 类 | 描述 |\n| :--- | :--- |\n| `TableStorage` | Azure 结构化或半结构化存储\
  \ API 的入口。`TableStorage` 对象提供了创建、列出和删除表的方法。 |\n| `TableStorageTable` | 创建具有指定名称的表。\
  \ |\n| `TableStorageEntity` | 添加具有指定 `PartitionKey` 和 `RowKey` 值的实体。 |\n| `TableStorageDataServiceQuery`\
  \ | 定义一个可以处理分页结果延续令牌的查询。 |\n| `TableStorageDataServiceContext` | 为带有安全信息（`AccountName`\
  \ 和 `SharedKey`）的表创建 `DataServiceContext` 对象。 |\n| `TableStorageHelpers` | 包含错误处理的辅助类和方法，用于测试属性是否可以插入到表中。\
  \ |\n| `ContextRef` | 用于避免对上下文对象进行长时间引用的辅助类。 |\n| `TableRetryWrapperException` |\
  \ `StorageClient` 和 `StorageServer` 异常的包装器，指示需要重试。 |\n| `ParameterValidator` | 如果参数为\
  \ null 或零长度则抛出 `ArgumentException`。 |\n| `TableStorageConstants` | 包含测试属性、表名和表查询的常量。\
  \ |\n| `DataServiceUtilities` | 支持 ADO.NET Data Services 惯的特殊要求。 |\n\n列表 4-1: 在\
  \ Azure Storage 中不存在创建 CustomerTable (Global.asax.cs)\n\n```csharp\nnamespace SampleWebCloudService_WebRole\n\
  {\n    public class Global : System.Web.HttpApplication\n    {\n        void Application_BeginRequest(object\
  \ sender, EventArgs e)\n        {\n            HttpApplication app = (HttpApplication)sender;\n\
  \            HttpContext context = app.Context;\n            // 尝试执行首次请求初始化\n  \
  \          FirstRequestInitialization.Initialize(context);\n        }\n    }\n \
  \   class FirstRequestInitialization\n    {\n        private static bool s_InitializedAlready\
  \ = false;\n        private static Object s_lock = new Object();\n        // 仅在首次请求时初始化\n\
  \        public static void Initialize(HttpContext context)\n        {\n       \
  \     if (s_InitializedAlready)\n            {\n                return;\n      \
  \      }\n            lock (s_lock)\n            {\n                if (s_InitializedAlready)\n\
  \                {\n                    return;\n                }\n           \
  \     ApplicationStartUponFirstRequest(context);\n                s_InitializedAlready\
  \ = true;\n            }\n        }\n    }\n    private static void ApplicationStartUponFirstRequest(HttpContext\
  \ context)\n    {\n        // 在使用表之前确保表存在。\n        StorageAccountInfo account =\
  \ StorageAccountInfo.GetDefaultTableStorageFromConfiguration();\n        TableStorage.CreateTablesFromModel(typeof(CustomerDataServiceContext),\
  \ account);\n    }\n}\n```\n\n有关上述代码的更多详细信息，请参博客文章“Azure Storage Services Test Harness:\
  \ Table Services 7 – Testing for Table Existence at App Startup Only”([`bit.ly/16iS6b`](http://oakleafblog.blogspot.com/2008/11/azure-storage-services-test-harness_231.html))。调用此方法会消耗大量资源，因此每个会话执行超过一次是非常关重要的。\n\
  \n`Customers.cs` 类文件包含模型的代码，该代码根据实现 `IQueryable<T>` 的 `CustomerDataModel` 类创建表。类的默认构造函数接受一个\
  \ `GUID` 作为 `RowKey` 值并将类名分配给 `PartitionKey`；带参数的构造函数接受 `PartitionKey` 和 `RowKey`\
  \ 字符串值以创建复合主键。\n\n任何实现 `IQueryable<T>` 的类都是 `CreateTablesFromModel()` 方法的源。`TableStorage`\
  \ 类会反射下方列表中的 `CustomerDataServiceContext` 类并为每个 `IQueryable<T>` 属性创建一个表。表的实体具有根据\
  \ `IQueryable<T>` 类型 `T` 生成的属性。列表 4-2 是 `Customers.cs` 文件中的代码，用于创建 `CustomerTable`\
  \ 和 `DataService` 对象。\n\n\n\n\n\n```csharp\nserviceContext.RetryPolicy =\n    RetryPolicies.RetryN(3,\
  \ TimeSpan.FromSeconds(1));\n}\n\npublic IEnumerable<CustomerDataModel> Select()\n\
  {\n    // Page.Prerender 事件处理程序填充 GridView\n    // 此方法是 ObjectDataSource 必需的\n \
  \   return null;\n}\n\npublic void Delete(CustomerDataModel itemToDelete)\n{\n \
  \   serviceContext.AttachTo(CustomerDataServiceContext.\n        CustomerTableName,\
  \ itemToDelete, \"*\");\n    serviceContext.DeleteObject(itemToDelete);\n    serviceContext.SaveChanges();\n\
  }\n\npublic void Insert(CustomerDataModel newItem)\n{\n    serviceContext.AddObject(CustomerDataServiceContext.\n\
  \        CustomerTableName, newItem);\n    serviceContext.SaveChanges();\n}\n}\n\
  }\n#endregion\n}\n```\n\n`CreateTablesFromModel()` 方法将 `PartitionKey`、`RowKey` 和\
  \ `Timestamp` 属性（特性）添加到类属性所指定的属性中。\n\n如第 2 章所述，Azure Tables 支持具有下表所示 .NET 数据类型的属性：\n\
  \n| 数据类型 | 描述 |\n| :--- | :--- |\n| Binary | 大小至 64KB 的字节数组 |\n| Bool | 布尔值 |\n\
  | DateTime | 以 UTC 时间表示的 64 位值，范围从 1600/1/1 到 9999/12/31 |\n| Double | 64 位浮点数值\
  \ |\n| GUID | 128 位全局唯一标识符 |\n| Int | 32 位整数 |\n| Long | 64 位整数 |\n| String | 大小至\
  \ 64KB 的 UTF-16 编码值 |\n\n## 使用 HTTP POST 方法在表不存在时创建新表\n\n在`Listing 4-3` 中，是 Fiddler2\
  \ 在启动 WebRole 或 WorkerRole 时，由 `Listing 4-1` 和 `4-2` 生成的并捕获的 POST 请求的 HTTP 请求头和\
  \ AtomPub 格式正文。\n\n**Listing 4-3：** 创建不存在的新 CustomerTable 的 HTTP POST 请求\n\n```http\n\
  POST /Tables HTTP/1.1\nUser-Agent: Microsoft.ADO.NET Data Services\nx-ms-date: Thu,\
  \ 26 Feb 2009 22:03:42 GMT\nAuthorization: SharedLite oakleaf:i8WF7XrpgB9IY7EBcTqgI9FSjaDJhuVQMg=\n\
  Accept: application/atom+xml,application/xml\nAccept-Charset: UTF-8\nDataServiceVersion:\
  \ 1.0;NetFx\nMaxServiceVersion: 1.0;NetFx\nContent-Type: application/atom+xml\n\
  Host: oakleaf.table.windows.net\nContent-Length: 499\nExpect: 100-continue\nConnection:\
  \ Keep-Alive\n<?xml version=\"1.0\" encoding=\"utf-8\" standalone=\"yes\"?>\n<entry\
  \ xmlns:d=\"http://schemas.microsoft.com/ado/2007/08/dataservices\"\n       xmlns:m=\"\
  http://schemas.microsoft.com/ado/2007/08/dataservices/metadata\"\n       xmlns:http://www.w3.org/2005/Atom\"\
  >\n  <title/>\n  <updated>2009-02-26T22:03:42.233961Z</updated>\n  <author>\n  \
  \  <name/>\n  </author>\n  <id/>\n  <content type=\"application/xml\">\n    <m:properties>\n\
  \      <d:TableName>CustomerTable</d:TableName>\n    </m:properties>\n  </content>\n\
  </entry>\n```\n\n所有三个 Azure 数据服务都使用 `SharedKey` 授权，但 Azure Tables 也接受来自代码（例如使用 ADO.NET\
  \ Services .NET 客户端的 .NET 封装器）的替代 `SharedKeyLite` 格式。为了防止对主或备授权密钥的未经授权访问，代码通过使用\
  \ `HMAC-SHA256` 算法（`http://msdn.microsoft.com/en-us/library/system.security.cryptography.hmac256.aspx`）对基于哈希的方法代码（Method\
  \ Code）的请求头编码创建字符串值，从而创建 `SharedKey` 和 `SharedKeyLite` 值。`StorageClient` 类库的 `Authentication.cs`\
  \ 文件包含生成这些键值的代码。\n\n`Listing 4-4` 是表已存在时返回的 AtomPub 格式的 HTTP 响应头和 HTTP 409 错误正文。\n\
  \n**Listing 4-4：** CustomerTable 已存在时的 HTTP POST 响应\n\n```xml\n<?xml version=\"\
