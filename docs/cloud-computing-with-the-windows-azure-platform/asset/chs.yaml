  \ 设置的使用，该设置不适用于本地存储。\n\n## 分析 AspProviders 库的类\n\n`AspProviders` 示例类库包含了七个 Azure\
  \ 特有的类文件，它们是为云 Web 应用程序添加 ASP.NET 成员功能的起点。这些类中的三个类——`TableStorageMembershipProvider`、`TableStorageRoleProvider`\
  \ 和 `TableStorageSessionProvider` 包含了 `TableNameDataServiceContract` 类，这些类继承自 `TableStorageDataServiceContract`\
  \ 类。因此，这些类会自动根据派生类定义的结构生成 Membership、Role 和 Session 表格。\n\n`TableStorageMembershipProvider`\
  \ 管理用户配置文件，因此不需要 `Profile` 表。\n\n## TableStorageMembershipProvider 类\n\n`TableStorageMembershipProvider`\
  \ 类将用户数据存储在由 Azure Table Services 管理的成员表中。为了防止在 Web 应用程序或数据中心软件更新期间出现停机，Web 应用程序被托管在一个或多个数据中心的至少两个\
  \ Web 服务实例上。运行在这两个（或多个）Web 服务实例上的 `TableStorageMembershipProvider` 实例访问成员表中的相同用户数据（状态）。图\
  \ 6.8 显示了典型 `MembershipRow` 项的部分内容。\n\nDavid Pallman 的 Azure Storage Explorer 应用程序（`AzureStorageExplorer.sln`）是一个\
  \ Windows Presentation Foundation 前端，用于显示 Azure 本地和云存储中的表、blob 和队列值。你可以从 [`bit.ly/ErrGT`](http://bit.ly/ErrGT)、[www.codeplex.com/azurestorageexplorer](http://www.codeplex.com/azurestorageexplorer)\
  \ 下载该程序的二进制文件和源代码。\n\n图 6.8 Azure Storage Explorer 显示了作者 Member 表数据的部分。\n\n![6.8](img/c06f008.jpg)\n\
  \n`PartitionKey` 值未出现在 图 6.8 中，它是 `ApplicationName`、字面量 `a` 以及作为 `RowKey` 的空值的组合。这种方法为每个行创建一个唯一的分区，确保了成员数据的可扩展性，可以扩展到数百万行。\n\
  \n`TableStorageMembershipProvider.cs` 文件的类图如图 6.9](#9781118058756c06.xhtml_c06_fig_0009)\
  \ 所示，包含了 `TableStorageProvider`、图 6.8 中的 `MembershipRow`、`DataContext` 以及 `EmailComparer`\
  \ 类。`EmailComparer` 类用于每个成员的电子邮件测试。\n\n图 6.9 TableStorageMembershipProvider 的类图。\n\
  \n![6.9](img/c06f009.jpg)\n\n## TableStorageRole 类\n\n`Roles` 表存储了如图 6.10](#9781118058756c06.xhtml_c06_fig_0010)\
  \ 所示的 `Role-name` 行和 `UserRole` 行。图 6.10 的上面板显示了 `DbAdmin` (1)、`DbReader` (2) 和\
  \ `DbWriter` (3) 的 `Role` 行。注意 `PartitionKey` 属性是 图 6.8 中 `ApplicationName` 和字面量\
  \ `a` 的组合，`RowKey` 属性是字面量 `62`，这为 Web 应用程序创建一个唯一的分区。\n\n图 6.10 的下面板显示了 `Role` 的三行属性。\n\
  \n![6.10](img/c06f010.jpg)\n\n列表 6-6 用户的属性：\n```\nPartitionKey: ApplicationName\n\
  RowKey: DbAdmin\nTimestamp: 3/30/2005 9:47:05 PM\n```\n\n`TableStorageRoleProvider.cs`\
  \ 文件的类图如图 6.9](#9781118058756c06.xhtml_c06_fig_0009) 所示，定义了 `TableStorageRoleProvider`、`RoleRow`\
  \ 和 `RoleContext`——这些对应于 `TableStorageMembershipProvider` 文件。图 6.8 显示了这些类的方法。\n\n\
  ## TableStorageProvider 类\n\n`sessioncontainer` 中的 blob 以明文存储配置名称并以加密字节数组存储值；每个用户可以零到一个配置，因此不需要\
  \ `Profiles` 表。`Membership` 表的 `BlobName`、`ProfileCreated`、`ProfileLastUpdated`\
  \ 和 `ProfileSize` 属性存储管理详情。图 6.12 显示了内容。\n\n`WROX\\Chapter06\\AspProvidersDemo`\
  \ 示例项目中的表单重新格式化以匹配 `WROX\\Chapter06\\AzureTableHarness` 项目的颜色。图 6.12 在 `MyProfile.aspx`\
  \ 页面上查看用户的属性对。\n\n图 6.13 配置 blob 中的明文属性名称（`Country`、`Gender`、`Age`）和编码值。\n\n\n\n\
  \n在持久化二进制对象（blob）中存储未加密的个人身份信息（PII）会话状态，可能违反了第 5 章“获取和审计合规性”章节及相关章节中讨论的政府法规行业规则。\n\
  \n图 6.15 会话 blob 的行属性-值管理对。\n\n![6.15](img/c06f015.jpg)\n\n会话状态通过自定义序列化过程会将话字典的内容转换为二进制\
  \ blob，并存储在 `sessionprovidercontainer` 容器中。序列化和反序列化支持 .NET 原始类型，包括 `String`、`Boolean`、`DateTime`、`TimeSpan`、`Int16`、`Int32`、`Int64`、`Byte`、`Char`、`Single`、`Double`、`Decimal`、`SByte`、`UInt16`、`UInt32`、`UInt64`、`Guid`\
  \ 和 `IntPtr`，并将这些类型直接写入 blob 中。`BinaryFormatter` 序列化对象类型，速度比处理原始类型要慢。图 6.16 显示了仅包含几个字符串值的序列化会话字典的不透明字节数组的\
  \ Base64Binary 编码表示。\n\nMichael Volodarsky 在 MSDN Magazine 上发表的文章《Fast, Scalable,\
  \ and Secure Session State Management for Your Web Applications》（[`bit.ly/DIMCS`](http://bit.ly/DIMCS),\
  \ [`msdn.microsoft.com/en-us/magazine/cc163730.aspx`](http://msdn.microsoft.com/en-us/magazine/cc163730.aspx)）提供了更多关于\
  \ ASP.NET 会话状态管理的详细信息，包括对 ASP.NET 2.0 会话分区的解释。\n\n图 6.16 会话状态 blob 的 Base64Binary\
  \ 编码表示部分。\n\n![6.16](img/c06f016.jpg)\n\n## 将 AspProvidersDemo 的数据源移动到云端\n\n列表 6-7\
