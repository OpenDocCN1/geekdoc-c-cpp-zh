  \ Wrox 网站。\n\n本章描述了 `SBQ` 和 `SBR` 组件的基本功能和实现，并基于 .NET Services SDK 的示例解决方案提供了简单的\
  \ C# 演示项目。所有示例都使用了你在第 9 和第 10 章中学的 .NET 访问服务 (ACS) 和服务总线 (SB) 技术。\n\n你可以在 MSDN .NET\
