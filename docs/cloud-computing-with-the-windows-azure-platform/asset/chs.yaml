  \ 数据库迁移架构和数据到 SQL Azure\n\nGeorge Huey 的 SQL Azure 迁移向导 (`SQLAzureMW`) 为 SQL Server\
  \ Management Studio (`SSMS`) 脚本向导提供了一种更高效的替代方案，用于生成符合该服务当前数据定义语言 (DDL) 限制的 SQL Azure\
  \ 架构。（章节更新时版本为 3.1.8）。你可以从 CodePlex 下载当前的二进制文件、源代码或两者（[`bit.ly/POxqs`](http://bit.ly/POxqs),\
  \ [`sqlazuremw.codeplex.com/`](http://sqlazuremw.codeplex.com/)）；由微软公共许可 (`Ms-PL`)\
  \ 管理该软件的使用。你可以了解更多关于 `SQLAzureMW` 的信息，并观看 George Huey 在 Wade Wegner 的 2009 年 12\
  \ 月 15 日发布的“SQL Azure 迁移向导重大更新”文章([`bit.ly/aFvlwz`](http://bit.ly/aFvlwz), [`blog.wadewegner.com/index.php/2009/12/15/significant-updates-to-the-sql-azure-migration-wizard/`](http://blog.wadewegner.com/index.php/2009/12/15/significant-updates-to-the-sql-azure-migration-wizard/))中的视频演示。OakLeaf\
  \ System 博客在 2010 年 1 月 23 日发布的“使用 SQL Azure 迁移向导 v3.1.3/3.1.4 处理 AdventureWorksLT2008R2\
  \ 示例数据库”文章([`bit.ly/5j0dLC`](http://bit.ly/5j0dLC), [`oakleafblog.blogspot.com/2010/01/using-sql-azure-migration-wizard-v313.html`](http://oakleafblog.blogspot.com/2010/01/using-sql-azure-migration-wizard-v313.html))提供了早期版本的详细说明。v3.1.4\
  \ 和 v3.1.8 之间有非常小的变化。\n\n`SQLAzureMW` 生成一个 T-SQL 脚本，类似于 `SSMS` [Express] 脚本向导创建的脚本，并在\
  \ `NotSupportedByAzureFile.Config` 文件([`bit.ly/noVkS`](http://bit.ly/noVkS), [`rogerjenn.googlepages.com/NotSupportedByAzureFile.xml`](http://rogerjenn.googlepages.com/NotSupportedByAzureFile.xml))\
  \ 中应用一组正则表达式 (regex)，以移除或修改 `SADB` 不支持的语句。例如，文件中 `<TableStatement>` 组中的以下元素会将 NOT\
  \ FOR REPLICATION 修饰符替换为 `WarningMessage`：\n\n```xml\n<NotSupported Text=\"\\sNOT\\\
  sFOR\\sREPLICATION\" ReplaceWith=\"\" SeverityLevel=\"0\"\nReplaceString=\"true\"\
  \ DisplayWarning=\"true\" WarningMessage=\"Removed ‘NOT FOR \nREPLICATION’ 因为此版本的\
  \ SQL Server 不支持该。” />\n```\n\n前文提到的“使用 SQL Azure 迁移向导 v3.1.3/3.1.4 处理 AdventureWorksLT2008R2\
  \ 示例数据库”文章演示了复制本地 SQL Server 2008 架构并向运行微软数据中心中的 AdventureWorksLT2008 SQL Azure\
  \ 数据库的最常见工作流。`SQLAzureMW` 使用 `BCP` 在使用 T-SQL 语句创建表后填充数据。\n\n## 使用批量拷贝过程填充 SADB 表\n\
  \n`SADB` 2009 年 8 月的 CTP 不支持 SQL Server 的命令行批量拷贝进程 (`bcp.exe`) 程序进行高速批量 INSERT 操作。2009\
  \ 年 10 月的功能完全 CTP 引入了对 `bcp.exe` 和 `INSERT… BULK` 命令的支持。“迁移数据库到 SQL Azure”上手实验室的练习\
  \ 2，“使用 BCP 进行数据导入和导出”提供了详细说明：\n\n* 任务 1 — 使用 BCP 将数据从 SQL Azure 导出\n* 任务 2 — 从现有数据库删除数据\n\
  * 任务 3 — 使用 BCP 将数据导入 SQL Azure\n\n以下是任务 3 的命令行指令，用于将数据从 `Customer.dat` 文件加载到 SQL\
  \ Azure `HolTestDB.SalesLT.Customer` 表：\n\n```bash\nbcp HolTestDB.SalesLT.Customer\
  \ in Customer.dat -S [YOUR_ASSIGNED_SERVER].database.net -U [YOUR_USER_ID]\n```\n\
  \n\n\n\n外部工具使用 `BULK` 修饰符上传二进制数据流。根据 Books Online 的介绍，“此选项并非用于如 `SQL Server Management\
  \ Studio`、`SQLCMD`、`OSQL` 或数据访问应用程序接口（如 `SQL Server Native Client`）。[强调已添加].”然而，Stan\
  \ Kitsis 在 2009 年 8 月 24 日和 29 日对 SQL Azure-Getting Started 论坛上的一个问题回复写道：\n\n正如在其他几个线程中提到的，我们也正在实现对\
  \ `bcp` 和 `INSERT BULK` 语句的支持（不要与 `BULK INSERT` 混淆）。因此，你可能也想考虑它们作为选项……\n\n`BULK\
  \ INSERT` 与 `INSERT…BULK` 的不同在于，数据文件的解析是由服务器完成的，而不是客户端。我们不支持 `BULK INSERT` 的原因是它要求你对物理服务器拥有访问权限——`filepath`\
  \ 是相对于服务器的。\n\n在本章节更新时，并没有看到在 SQL Azure 中使用 `INSERT…BULK` 命令的示例。\n\n# 分分表以克服数据库大小限制\n\
  \n维基百科简要地将分片（sharding）描述为“数据库或搜索引擎中一种水平分区的方法”，并继续给出了这一更详细的描述：\n\n水平分区是一种设计原则，将数据库表中的行分开存储，而不是按列拆分（如规范化所示）。每个分区形成一个分片（shard）的一部分，该分片可能位于单独的数据库服务器或物理位置。其优点是每个表中的行数减少了（这减少了索引大小，从而提高了搜索性能）。如果分片是基于数据的某些真实世界方面（例如，欧洲客户与美国客户），则可能很容易且自动地推断出适当的分片成员，并仅查询相关的分片。\n\
  \n在实践中，分片比上述定义描述的困难得多。尽管长期以来一直通过硬编码来实现分片（特别是当行具有明显的分组特征时，如前面的示例所示），但这通常缺乏灵活性。人们希望支持自动分片，这包括在添加代码支持方面，以及在识别需要单独分片的候选对象方面。当使用分布式计算在多个服务器之间平衡负载（无论是出于性能还是可靠性考虑）时，分片方法可能也有。\n\
  \n根据地理位置、日期、产品类型或类似的列式数据对大型数据库表进行分片是一种常见做法。例如，你可能会按国家或地区对客户以及相关的联系、订单和发票表进行分片。大型组织可能需要按州、县、区等进行更细粒度的分片。这些分区技术被称为值范围。或者，也可以根据哈希值或表查找创建分区，以均衡多个服务器上分片的大小。Dare\
  \ Obasanjo 在 2009 年 1 月 16 日发布的文章[构建可扩展数据库：各种数据库分片方案的优缺点]（[`bit.ly/bQC9Q`](http://bit.ly/bQC9Q),\
  \ [`www.25hoursaday.com/weblog/2009/01/16/BuildingScalableDatabasesProsAndConsOfVariousDatabaseShardingSchemes.aspx`](http://www.25hoursaday.com/weblog/2009/01/16/BuildingScalableDatabasesProsAndConsOfVariousDatabaseShardingSchemes.aspx)）讨论了垂直、水平、基于范围、键或哈希以及基于字典的分区的优缺点。\n\
  \n跨分片数据访问是昂贵的，因此缓慢变化（参考）的数据通常会复制到每个持有相关数据的服务器上。例如，如果客户的订单头和详细数据按位置分片，则每个持有分片的数据库都将包含一个包含该位置销售的所有产品的的产品表。这显然会导致大量的数据冗余，并要求实时同步产品表的更新，以便强制订单行项目与产品表之间的引用完整性。由于\
  \ SADB 为了高可用性的数据复制，冗余数据的影响增加了三倍。通过在行项目中添加所需的产品数据来反规范化数据是一种替代方案，这可能会产生更高效的查询和磁盘空间利用。Obasanjo\
  \ 在他 2009 年 9 月 10 日后来的文章[构建可扩展数据库：反规范化、NoSQL 运动与 Digg]中讨论了这个问题（[`bit.ly/2l5loC`](http://bit.ly/2l5loC),\
  \ [`www.25hoursaday.com/weblog/2009/09/10/BuildingScalableDatabasesDenormalizationTheNoSQLMovementAndDigg.aspx`](http://www.25hoursaday.com/weblog/2009/09/10/BuildingScalableDatabasesDenormalizationTheNoSQLMovementAndDigg.aspx)）。\n\
  \n扇出查询（Fan-out queries）在多个数据库上并行运行并在客户端通过 `UNION ALL` 操作合并结果集，这种查询在 SADB 的未来版本之前将不会支持。随着负载的增加，你可以通过增加更多服务器并在每个服务器上放置较少分区来扩展数据访问。根据以下摘要，由本书技术编辑\
  \ David Robinson 在 PDC 2009 上的[使用 Microsoft SQL Azure 数据库扩展 Web 应用程序]会议（[`bit.ly/akdTCG`](http://bit.ly/akdTCG),\
  \ [`microsoftpdc.com/Sessions/SVC06`](http://microsoftpdc.com/Sessions/SVC06)）为分区和扇出了更多见解：\n\
  \nMicrosoft SQL Azure 和 Windows Azure 平台提供了所有必要的构建模块，用于开发和托管丰富的 Internet 应用，可以为互联网规模的用户群提供服务，同时存储几乎无限的数据。\n\
  \n## SQL Azure、分片与 NHibernate\n\nSimon Munro 在 2009 年 9 月 10 日发布的文章分片的困扰, [`simonmunro.com/2009/09/10/the-trouble-with-sharding/`](http://simonmunro.com/2009/09/10/the-trouble-with-sharding/))讨论了与实现可扩展数据库相关的分片相关的问题。\n\
  \nAyende Rahien 在 2009 年 9 月 6 日发布的文章 SQL Azure、分片与 NHibernate：寻求志愿者, [`ayende.com/Blog/archive/2009/09/06/sql-azure-sharding-and-nhibernate-a-call-for-volunteers.aspx`](http://ayende.com/Blog/archive/2009/09/06/sql-azure-sharding-and-nhibernate-a-call-for-volunteers.aspx))观察到：\n\
  \n我非常惊讶地听到 SQL Azure 每个数据库有 10GB 的限制。这极大地减少了我猜测 SQL Azure 所承担的工作量。根据推测，我认为它仅仅是数据库的复制实例，而不是云端真正的\
  \ SQL。\n\n在云端工作的良好前提之一是你可以获得透明的扩展。10GB 的限制并不是透明的。微软的回答似乎是你需要实现分片。也就是说，你将逻辑数据库分布在多个物理数据库上。\n\
  \n通常这在物理数据库实例上这样做，目的是加速应用程序，因为你可以并行化查询。在这种情况下，你需要这样做，因为每个数据库都相当小。\n\n\n\n\n拥有功能完整的\
  \ NHibernate Shards 意味着你可以在 SQL Azure 上获得透明扩展。有趣的地方在于，这并不涉及大量的思考或设计，这条路已经有人走过了，唯一的工作就是进行迁移。\n\
  \n而且，为了提供激励，我愿意为所有完成 Hibernate Shards 迁移的主要贡献者捐赠 `NH Prof` 许可证。\n\nAyende 在他的“云端上的\
  \ NHibernate：SQL Azure”文章（[`bit.ly/98UAXr`](http://bit.ly/98UAXr), [`ayende.com/Blog/archive/2009/09/05/nhibernate-on-the-cloud-sql-azure.aspx`](http://ayende.com/Blog/archive/2009/09/05/nhibernate-on-the-cloud-sql-azure.aspx)）中在下文之前提到：\n\
  \n> 我刚刚在 SQL Azure 上运行了 NHibernate 测试套件。我很高兴地告诉大家，它运行良好良好（It Just Works*）。\n\n>\
  \ 感谢微软，能够在如此不同的条件下，创建一个与 SQL Server 极其相似的环境。\n\n> * 唯一的警告是某些 Schema 导出脚本在 SQL Azure\
  \ 上执行失败，看起来 `drop table` 在 SQL Azure 上的行为略有不同，它不会立即删除表，而在实际发生之前似乎会有延迟（特别是当你使用不同的连接来检查表是否存在时）。\n\
  \n考虑到 SADB 前身 SQL Data Services (SDS) 和 SQL Server Data Services (SSDS) 的历史，Ayende\
  \ 对 SADB 数据库最大大小的惊讶并没有根据的。SDS CTP 将一个 `Container`（大致对应于 SADB 数据库）限制为“2 GB 的聚合非 blob\
  \ 数据”（[`bit.ly/9drJCv`](http://bit.ly/9drJCv), [`msdn.microsoft.com/en-us/library/cc512388.aspx`](http://msdn.microsoft.com/en-us/library/cc512388.aspx)），用以为实体组提供事务一致性。另一方面，微软表示\
  \ Windows Azure EAV 表可以扩展到“数十亿行”。通过 `PartitionKey` 值对这些表进行分片，可以支持负载均衡，并允许在快照隔离下对单个分区进行事务更新。\n\
  \n`/WindowsAzurePlatformKit/Demos/SQLAzureScalingOutWithDbSharding/` 文件夹包含用于“通过数据库分片扩展\
  \ SQL Azure”演示项目的示例文件和代码。该项目允许你选择目标国家或订单日期作为分片标准。\n\n## 创建 SADB 登录名和用户并分配角色\n\n\
  `/WindowsAzurePlatformKit/Demos/SQLAzureManagingLoginsAndSecurity/` 文件夹包含一个“在 SQL\
  \ Azure 中管理登录和安全”演示，它解释了如何通过在 SSMS [Express] 中针对 SADB 实例的主数据库执行 `CREATE LOGIN HoLTestUser\
  \ WITH PASSWORD='REPLACE_HoLTestUser_PASSWORD'` T-SQL 语句，来创建一个新的 SADB `HolTestUser`\
  \ 登录名。\n\n不不符合 SQL Server 2008 复杂度要求的密码会返回错误。以下是 SQL Server Books Online“密码策略”章节中的密码复杂度要求：\n\
  \n* 密码不包含用户帐户名的全部或部分。帐户名的一部分定义为三个或更多连续的字母或数字字符，两端由空白字符（如空格、制表符和回车）或以下任何字符分隔：逗号（,）、句号（.）、连字符（-）、下划线（_）或井号（#）。\n\
  * 密码至少有八个字符长。\n* 密码包含以下四个类别中的三类字符：\n    * 拉丁大写字母（A 到 Z）\n    * 拉丁小写字母（a 到 z）\n \
  \   * 十进制数字（0 到 9）\n    * 非字母数字字符，例如：感叹号（!）、美元符号（$）、数字符号（#）或百分比符号（%）。\n\n该演示还展示了从\
  \ `HoLTestDB` 用户数据库执行 `CREATE USER HoLTestUser FOR LOGIN HoLTestUser`，然后执行 `EXEC\
  \ sp_addrolemember ‘db_owner', ‘HoLTestUser’`，将 `HoLTestUser` 分配给 `db_owner` 固定数据库角色。根据\
  \ SQL Server 2008 Books Online（[`bit.ly/U5t9C`](http://bit.ly/U5t9C), [`msdn.microsoft.com/en-us/library/ms189121.aspx`](http://msdn.microsoft.com/en-us/library/ms189121.aspx)），SQL\
  \ Server 2008 支持下表所示的固定数据库角色：\n\n| 固定数据库角色 | 安全权限 |\n| :--- | :--- |\n| `db_accessadmin`\
  \ | 为 Windows 登录、Windows 组组 SQL Server 登录添加或删除访问。 |\n| `db_backupoperator` | 备份数据库。\
  \ |\n| `db_datareader` | 对数据库中的任何表或视图运行 `SELECT` 语句。 |\n| `db_datawriter` | 在所有用户表中添加、删除或更改数据。\
  \ |\n| `db_ddladmin` | 在数据库中运行任何数据定义语言 (DDL) 命令。 |\n| `db_denydatareader` | 不能读取数据库内用户表中的任何数据。\
  \ |\n| `db_denydatawriter` | 不能在数据库内用户表中添加、修改或删除任何数据。 |\n| `db_owner` | 在数据库上执行所有允许的配置和维护活动，并删除数据库。\
  \ |\n| `db_securityadmin` | 修改角色成员身份并管理权限。 |\n\n### 总结\n\n为新的 SADB 克隆本地数据库的架构并导入历史数据可能是新\
  \ SQL 开发者面临的首要任务。尽管 SQL Azure 团队成员承诺在商业版 SQL Azure 版本发布时提供“自动部署到 Windows Azure 的\
  \ API”，但开发者可能需要为 SADB 处理 T-SQL 脚本。\n\n本章早期描述了当你尝试运行由 SSMS [Express] 查询向导生成的 T-SQL\
  \ 脚本时将面临的问题。SQL Server 2008 的 T-SQL 语法与 SADB 支持的数据类型之间的巨大差异要求对自动生成的脚本进行大量编辑以消除执行错误。George\
  \ Huey 的开源 SQL Azure 迁移向具有极大减少或消除手动编辑创建和填充 SADB 表的自动生成脚本的潜力。\n\nSADB 的 2009 年 8\
  \ 月 CTP 是本章原始版本的基础，它不支持 SQL Server 的批量复制工具或 SQL Server 2008 R-2 的新 `INSERT…BULK`\
  \ 命令。2009 年 10 月的 CTP 同时支持 `bcp` 和 `INSERT…BULK`。查询向导生成的 `INSERT` 操作适用于填充几千行数据，但你可能更希望使用\
  \ `bcp` 从 SADB 表中导入和导出数据。在编写本章时，`bcp` 是备份 SADB 表用于灾难恢复的最实用方法。\n\n索引\n\nA\n\n*aaS.\
