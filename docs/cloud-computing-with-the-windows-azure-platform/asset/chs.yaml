  Date: Thu, 26 Feb 2009 22:26:09 GMT\n```\n\n## 存储和检索 Blob\n\n使用 Azure Blob 服务比操作表要简单得多。图\
  \ 4.12 显示了从 SkyDrive 下载 BMP 和 ZIP 实体，AzureBlobTest 项目在 Windows Azure 上运行。\n\nSkyDrive\
  \ 复选框默认勾选，使 SkyDrive 为该下拉列表的源。点击列表中的 `bmp` 项目会生成一个 URL，例如 `http://oakleaf2.blob.core.windows.net/oakleaf2/2009-02-26T19:53:07.7481188Z.bmp\
  \ Target=\"_Blank\"`，在新窗口中打开 BMP 文件。Blob URI 使用 `http://servicename.blob.core.windows.net/containername/[path/]blobname.ext`\
  \ 格式。`containername` 是你从 Hosted Service Token 创建 Azure 账户时给的 Project Label。\n\n\n\
  \n\n\n`RFC 2046` 的作者预见到需要许多额外的子类型，并将互联网分配编号机构（IANA）指定为媒体类型的注册机构。IANA 的 MIME 媒体类型页面\
  \ ([`bit.ly/nnCIb`](http://bit.ly/nnCIb), [www.iana.org/assignments/media-types/](http://www.iana.org/assignments/media-types/))\
  \ 列出了当前的内容类型以及指向当前子类型的链接。当本书编写时，IANA 已添加了不能用于 `Content-Type` 头的示例、作为已注册 MIME 媒体类型的模型，以及针对大多数类型的大量子类型。\n\
  \n以 `x-` 开头的媒体类型和子类型被分类为实验性（私有）值，供一致同意的系统使用。强烈建议将实验性值作为顶级类型；大多数 `x-` 值都是应用子类型。大多数\
  \ Azure 特有的元数据使用 `x-ms-*` 或类似的实验性 HTTP 头部，例如 `x-ms-date: Thu, 26 Feb 2009 21:05:25\
  \ GMT`。\n\n| 类别 | 类型 | RFC 2046  |\n| :--- | :--- | :--- |\n| Discrete | Text |\
  \ 文本信息；子类型 `plain` 表示数据不包含任何格式化命令。 |\n| Discrete | Image | 图像数据，需要显示设备来查看信息；`RFC\
  \ 2046` 定义了初始的 jpeg 和 gif 子类型。 |\n| Discrete | Audio | 音频数据，需要音频输出设备来“显示”数据；`RFC\
  \ 2046` 定义了一个初始的基础子类型。 |\n| Discrete | Video | 视频数据，需要显示动态图像的能力；`RFC 2046` 定义了初始的\
  \ mpeg 子类型。 |\n| Discrete | application | 不符合任何其他类别的离散数据。`RFC 2046` 定义了初始的 octet-stream\
  \ 和 PostScript 子类型。 |\n| Composite | Multipart | 由多个独立数据类型的实体组成的数据。 |\n| Composite\
  \ | Message | 经过封装的消息。 |\n\n# StorageClient 类库的 Blob Storage 和 REST Blob Storage\
