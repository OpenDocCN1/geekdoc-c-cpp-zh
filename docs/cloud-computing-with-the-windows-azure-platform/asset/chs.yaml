  \n## 使用配置向导验证演示先决条件\n\nHello Windows Azure 演示的配置向导测试你的计算机对于运行 SSIS 演示所需组件的配置。必须安装全文搜索以启用配置向导。\n\
  \n要运行配置向导，执行以下操作：\n\n1. 导航到 `\\WindowsAzurePlatformKit\\Demos\\MovingDataUsingSSIS\\\
  scrips` 文件夹并双击 `StartHere.cmd` 图标打开配置向导。\n\n\n\n\n\n2. 点击“下一步”打开“步骤摘要”窗口，并点击“下一步”来测试配置。图\
  \ 13.7 显示了已安装所有先决条件的配置向导。\n\n3. 点击“下一步”并“关闭”以退出向导。\n\n如果缺少任何先决条件，向导通常会提供安装的链接或说明。请参考\
  \ Windows Azure 论坛上的“如果安装了 2008 R2 版本，Windows Azure 训练包配置向导需要下载 BIDS 和 SSIS 2008”线程\
  \ ([`bit.ly/9YNtTP`](http://bit.ly/9YNtTP), [`social.msdn.microsoft.com/Forums/en-US/windowsazure/thread/20c1e3a8-1c36-445d-a056-20840f184abf/`](http://social.msdn.microsoft.com/Forums/en-US/windowsazure/thread/20c1e3a8-1c36-445d-a056-20840f184abf/))\
  \ 查看有关缺少 BIDS 和 SSIS 2008 先决条件的问题。\n\n请参考 OakLeaf Systems 博客上 2010 年 1 月 19 日发布的“Windows\
  \ Azure 平台训练包（2009 年 12 月）StartHere.cmd 程序抛出异常”帖子 ([`bit.ly/86tMGw`](http://bit.ly/86tMGw),\
  \ [`oakleafblog.blogspot.com/2010/01/windows-azure-platform-training-kit.html`](http://oakleafblog.blogspot.com/2010/01/windows-azure-platform-training-kit.html))\
  \ 查看有关在 `\\WindowsAzurePlatformKit\\Demos\\MovingDataUsingSSIS\\scrips` 文件夹之外运行\
  \ `StartHere.cmd` 时的问题。\n\n图 13.7 完成配置向导的先决条件测试。\n\n![13.7](img/c13f007.jpg)\n\n\
  ## 使用 SSMS 创建 T-SQL 脚本以填充 SADB 数据库\n\nSSMS 具有自动生成创建数据库架构和填充表的 T-SQL 脚本的能力。你可以像之前处理\
  \ Northwind 数据库那样在 SSMS [Express] 中执行脚本，或者通过 SQL Server 集成服务 (SSIS) 包结合针对主数据库的其他\
  \ T-SQL 命令执行它（例如 `DROP DATABASE DatabaseName` 和 `CREATE DATABASE DatabaseName`），从而避免在数据库生成操作中涉及\
  \ SQL Azure 门户。\n\n要生成一个在 SADB 中为 AdventureWorksLT2008 数据库创建架构并上传表和其他对象数据的脚本，请执行以下操作：\n\
  \n1. 选择开始 ⇒ 所有程序 ⇒ SQL Server 2008 ⇒ SQL Server Management Studio 来启动 SSMS，然后连接到本地\
  \ AdventureWorksLT2008 数据库。\n\n2. 如果你选择了“启动时打开新查询窗口”选项（如本章较早推荐的那样），打开对象资源管理器，点击工具栏上的“连接到对象资源管理器”按钮，并连接到本地\
  \ AdventureWorksLT2008 数据库。\n\n3. 右键点击任何数据库节点并选择“任务 ⇒ 生成脚本”以打开脚本向导，点击“下一步”跳过欢迎对话框。\n\
  \n4. 在“选择数据库”列表中选择 AdventureWorksLT2008 数据库，并勾选“脚本选择数据库对象”选项（参见图 13.8）。\n\n5. 点击“下一步”打开“选择脚本选项”对话框，并接受默认脚本选项，但下表中的除外（参见图\
  \ 13.9）：\n\n| 脚本选项 | 值 | 非默认值的原因 |\n| :--- | :--- | :--- |\n| 将 UDDT 转换为基类型 | True\
  \ | SQL Azure 不支持用户定义数据类型。 |\n| 编写扩展属性 | False | SQL Azure 不支持扩展属性。 |\n| 编写 USE\
  \ DATABASE | False | SQL Azure 不支持 `USE DATABASE` 命令。 |\n| 编写数据 | True | 生成用于添加数据的\
  \ INSERT 语句是一个非常重要的功能。 |\n\n6. 点击“下一步”打开“输出选项”对话框，并选择“脚本到新查询窗口”选项。\n\n7. 点击“下一步”打开“生成脚本进度”对话框，然后点击“完成”生成脚本。一两分钟后，对话框将如图\
  \ 13.10 所示出现。\n\n图 13.8 设置“特定数据库对象”选项，并在处理本地 AdventureWorksLT2008 数据库时省略用户定义数据类型和\
  \ XML 架构集。\n\n![13.8](img/c13f008.jpg)\n\n图 13.9 设置脚本选项以处理本地 AdventureWorksLT2008\
  \ 数据库。\n\n![13.9](img/c13f009.jpg)\n\n图 13.10 在 Visual Studio 2008 中创建 CloudSalesImport\
  \ 项目。\n\n![13.10](img/c13f010.jpg)\n\n点击 SSMS 的执行按钮运行脚本会产生 100 多个错误，这是由于脚本选项无法处理的限制。未来的\
  \ SQL Azure 版本可能会消除手动修正 SSMS 生成的 T-SQL 语法的需要。即使不能，后文“从本地 AdventureWorksLT2008 数据库迁移架构和数据”节描述的\
  \ SQL Azure 迁移向导也可能能够完成。\n\n## 使用预置的 SQL 脚本填充 Azure 数据库\n\n幸运的是，工具包随带了一个与 SADB 兼容的脚本\
  \ `AdventureWorksLT2008.sql`，位于 `\\Azure\\Chapter13`。执行以下操作使用此修正脚本创建并填充新的 SQL Azure\
  \ 数据库：\n\n1. 如果你已经在 SQL Azure 实例中创建了 AdventureWorksLT2008 数据库，请使用 SQL Azure 门户将其删除。\n\
  \n2. 在 SQL Azure 门户中使用“在 SADB 中生成 Northwind 数据库”节所述的方法创建一个空的 AdventureWorksLT2008\
  \ 数据库。\n\n3. 启动 SSMS [Express]，并在连接到 AdventureWorksLT2008 SQL Azure 数据库的新查询窗口中打开\
  \ `AdventureWorksLT2008.sql`。\n\n4. 点击执行。\n\n忽略脚本末尾故意引入的非致命错误，这是由于在索引视图时尝试执行不支持的\
  \ `SORT IN TEMP DB` 选项引起的。\n\n## 设计将数据从 SQL Azure 导入本地 SQL Server 表的包\n\nSADB v1\
  \ 不支持 `BACKUP` 或 `RESTORE` 操作，因此备份 SADB 数据需要将其导入具有相同或相似架构的本地或网络可用的 SQL Server 数据库，以便备份云端生成的数据。要开始包的设计过程，请执行以下操作：\n\
  \n1. 从开始 ⇒ 所有程序 ⇒ SQL Server 2008 ⇒ SQL Server Business Intelligence Development\
  \ Studio 命令启动 SQL Server Business Intelligence Development Studio (BIDS)。\n\n2.\
  \ 通过文件 ⇒ 新建 ⇒ 项目 打开新项目对话框。\n\n3. 在项目类型列表中选择业务智能项目。\n\n4. 在模板窗中选择集成服务项目。\n\n5. 在解决方案名称文本框中输入\
  \ `CloudSalesImport`（参见图 13.10）。\n\n6. 点击确定创建 `CloudSalesImport` 解决方案。双击解决方案资源管理器中的\
  \ `package.dtsx` 节点以打开设计器窗口。\n\n\n\n\n\n如果你在完成第 6 步后收到图 13.11 所示的错误消息并对该错误消息进行搜索，可以在\
  \ SQL Server Integration Services 论坛中找到关于“无法在 bids 2008 中创建新的 ssis 项目”的线程 ([`bit.ly/1a6iLj,`](http://bit.ly/1a6iLj)\
  \ [`social.msdn.microsoft.com/Forums/en-US/sqlintegrationservices/thread/420a44b3-86ec-4aca-8165-cf5ed5e2d8d4`](http://social.msdn.microsoft.com/Forums/en-US/sqlintegrationservices/thread/420a44b3-86ec-4aca-8165-cf5ed5e2d8d4))。该线程中的回复引导你参考知识库文章\
  \ 818419，“BUG：当你在 XML Schema 设计器中移动元素时，收到‘CustomMarshalers not found’错误消息”([`bit.ly/124hEI,`](http://bit.ly/124hEI)\
  \ [`support.microsoft.com/kb/818419`](http://support.microsoft.com/kb/818419))。此\
  \ KB 文章适用于 Visual Studio 2002 和 2003，在本章更新时，其最后修订时间为 2007 年 5 月 16 日。然而，文章确实指向了问题根源，即在安装\
  \ SQL Server 2008 之前安装 Visual Studio 2010 Beta 版本会导致 `msadds.dll` 和相关设计器库之间的版本冲突。\n\
  \n搜索“msdds.dll”会在 Microsoft Connect 的“mscorsvw - msiexec.exe - 无休止的安装” bug 报告 481903\
  \ ([`bit.ly/fbeRK,`](http://bit.ly/fbeRK) [`connect.microsoft.com/VisualStudio/feedback/ViewFeedback.aspx?FeedbackID=481903`](http://connect.microsoft.com/VisualStudio/feedback/ViewFeedback.aspx?FeedbackID=481903))\
  \ 中找到结果，该报告准确描述了 `msdds*.dll` 库的位置和版本问题。对于 VS 2010 Beta 1 或 2 的此问题，唯一可靠的解决方法是移除\
  \ VS 2010 Beta 安装，移除 SQL Server 2008，安装 VS 2008 和 VS2008 SP1，然后重新安装 SQL Server 2008\
  \ 和 SQL Server 2008 SP1。\n\n图 13.11 由 VS 2008 和 2010 设计器文件版本问题导致的错误消息。\n\n![13.11](img/c13f011.jpg)\n\
  \n以下是 `CloudSalesImport` 包设计过程中基本操作的摘要：\n\n1. 为本地（机机的）AdventureWorksLT2008 数据库创建一个\
  \ OLE DB 连接管理器。\n2. 为 SADB（云端）AdventureWorksLT2008 数据库创建一个 ADO.NET 连接管理器。\n3. 使用\
  \ `DELETE FROM SalesLT.SalesOrderDetail` T-SQL 语句删除本地 `SalesMart.SalesOrderDetail`\
  \ 表中的所有记录，以符合引用完整性约束。\n4. 使用 `DELETE FROM SalesLT.SalesOrderHeader` T-SQL 语句删除本地\
  \ `SalesMart.SalesOrderHeader` 表中的所有记录。\n5. 将所有 SADB（云端）`SalesMart.SalesOrderHeader`\
  \ 行导入本地 `SalesMart.SalesOrderHeader` 表，在此过程中将 `CreditCardApprovalCode` 字段的数据类型从\
  \ `nvarchar` 改为 `varchar`。\n6. 将所有 SADB（云端）`SalesMart.SalesOrderDetail` 行导入本地 `SalesMart.SalesOrderDetail`\
  \ 表。\n\n## 为本地（源）和 SADB（云端）数据库创建连接管理器\n\nSSIS 包工作流需要管理器对象。要创建新的 OLE DB 和 ADO.NET\
  \ 连接管理器，请执行以下操作：\n\n1. 打开空的 `CloudSalesImport` 包并选择“控制流（Control Flow）”选项卡，在“连接管理器”面板内部右键点击并选择\
  \ `New OLE DB Connection` 打开“配置 OLE DB 连接管理器”对话框。\n2. 点击 `New` 打开“连接管理器”对话框，在“服务器名称”组合框中输入\
  \ `localhost`，接受默认的 `Use Windows Security` ，从“选择或输入数据库”列表中选择 `AdventureWorksLT2008R2`，点击\
  \ `Test Connection` 验证连接性，并点击 `OK` 关闭消息（参见图 13.12）。点击 `All` 按钮显示所有连接管理器属性。\n3. 在“连接管理器”面板中，右键点击\
  \ `localhost.AdventureWorksLT2008R2` 并重命名为 `LocalDB.AdventureWorksLT2008R2`。\n4.\
  \ 在“连接管理器”面板内部右键点击并选择 `New ADO.NET Connection` 打开“配置 ADO.NET 连接管理器”对话框。\n5. 点击 `New`\
  \ 打开“连接管理器”对话框，在“服务器名称”组合框中输入 `SADB` 连接字符串，包括 `tcp:` 前缀。选择 `SQL Authentication`，在框中输入密码，从“选择或输入数据库”列表中选择\
  \ `AdventureWorksLT2008R2`，点击 `Test Connection` 验证连接性，并点击 `OK` 关闭消息（参见图 13.13）。\n\
  6. 在“连接管理器”面板中，右键点击 `localhost.AdventureWorksLT2008R2` 并将其重命名为 `CloudDB.AdventureWorksLT2008R2`。\n\
