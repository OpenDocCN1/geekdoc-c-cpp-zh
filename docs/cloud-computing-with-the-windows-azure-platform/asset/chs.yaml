  </error>\n```\n\n### 向表添加实体\n\n从本地关系型数据库上传数据到 Azure Tables 是 IT 迁移到云时面临的主要任务之一。在编写本书时，还没有微软支持的工具（如\
  \ SQL Server Integration Services SSIS）用于上传表。因此，云开发者可能需要编写自己的 WebRoles 或 WorkerRoles。\n\
  \n`Figure 4.1` 显示了部署到第一个云托管服务的 SampleWebService，在点击 Count 按钮验证 91 条数据后表的状态。\n\n\
  ### 使用代码添加实体\n\n`Listing 4-5` 是 SampleWebService 项目中 Create 按钮的代码。`btnCreateCustomers()`\
  \ 方法使用 `_Default` 类在 `LimogFunctions.cs` 中的 `CreateListWithRowKey()` 函数将 91 个 Northwind\
  \ 客户行添加到 `CustomerTable`。\n\n`Limog` 是 LINQ 内存生成器的缩写，是一个来自 WROX 专业 ADO.NET 3.5 与\
  \ LINQ 以及 Entity Framework 项目。你可以在博客“Azure Storage Services Harness: Table Services\
  \ 5 – Generating Classes/Collection Initializers with LIMOG v2”中了解更多关于 Limog 的信息（`http://bit.ly/RIJrs`,\
  \ `http://oakleaf.blogspot.com/2008/11/azure-storage-services-harness_21.html`）。\n\
  \n**Listing 4-5：** 从 Collection<T> 向表添加 91 个实体的代码\n\n```csharp\nnamespace SampleWebService_WebRole\n\
  {\n    public partial class _Default : System.Web.UI.Page\n    {\n        // 从对象初始化器单独创建所有\
  \ CustomerTable 实体\n        // 设置 customersView GridView 的 DataSource\n        protected\
  \ void btnCreateCustomers_Click(object sender, EventArgs e)\n        {\n       \
  \     Stopwatch timer = new Stopwatch();\n            timer.Start();\n         \
  \   List<CustomerDataModel> custDataModel = null;\n            if (chkRowKeyPK.Checked)\n\
  ```\n\n\n\n\n\n```cs\n// Object initializer includes PartitionKey and RowKey values\n\
  custDataModel = CreateCustomerListWithRowKey();\nelse\n    // Use default constructor\n\
  \    custDataModel = CreateCustomerList();\nforeach (CustomerDataModel newItem in\
  \ custDataModel)\n{\n    if (newItem.CustomerID == null)\n        newItem.CustomerID\
  \ = newItem.RowKey;\n    serviceContext.AddObject(CustomerDataServiceContext.CustomerTableName,\
  \ newItem);\n}\n// Persist entities in the Azure Table\nserviceContext.SaveChanges();\n\
  // Bind DataGridView to custDataModel\ncustomersView.DataSource = null;\ncustomersView.DataSourceID\
  \ = \"customerData\";\ncustomersView.DataBind();\ntxtTime.Text = (timer.ElapsedMilliseconds\
  \ / 1000D).ToString(\"0.000\");\nbtnCreateCustomers.Enabled = false;\nbtnUpdateCusts.Enabled\
  \ = true;\n}\n}\n```\n\n`serviceContext.AddObject()` 方法将 `custDataModel` 列表的当前成员添加到\
  \ `serviceContext` 中。调用 `serviceContext.SaveChanges()` 方法会将缓存的实体保存到 `CustomerTable`\
  \ 中。\n\n如果你需要关系型 JOIN 的等效操作，必须上传依赖记录，例如每个客户的最后几个订单，以及你上传的每个订单的所有订单详情。Azure 团队承诺在未来的版本中对主键以外的实体值提供二级索引。\n\
