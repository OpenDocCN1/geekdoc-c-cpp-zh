  \n将类名（如 `OrderType`）替换为父表的 `RowKey` 值，并在类名后跟一个数字数字后缀作为子表的唯一 `RowKey` 值，这是一种通用的惯做法。例如，当勾选“Use\
  \ Single OrderDetails Table”复选框时，添加到 `OrderDetailTable` 的 `OrderType` 实体将 `OrderType`\
  \ 作为其 `RowKey` 值。添加到 `OrderDetailTable` 的 `DetailType` 实体将 `DetailType_##` 作为其 `RowKey`\
  \ 值，其中 `##` 是两位数字的项目序列号。图 7.2 显示了在单个 `OrderDetailTable` 中添加 100 个 `OrderType` 实体和\
  \ 282 个 `DetailType` 实体后的示例项目表单。\n\n图 7.2 从客户端 SQL Server 实例上传数据到云端 Azure `OrderDetailTable`\
  \ 后的 Windows 表单测试测试程序。\n\n![7.2](img/c07f002.jpg)\n\n## 利用实体组事务优势\n\n早期的 Azure 表版本仅支持对具有相同\
  \ `PartitionKey` 的单个实体类型的 ACID（原子性、一致性、隔离性和持久性）事务。较新的表版本（2009 年 5 月 CTP 的 `v 2009–04–14`\
  \ 及更高版本）支持实体组事务（EGTs）。EGTs 支持对具有相同 `PartitionKey` 值的批父子实体进行创建、更新和删除操作的 ACID 事务。以下是\
  \ Table Service API“执行实体组事务”主题中 EGT 的要求（[`bit.ly/kfWtD`](http://bit.ly/kfWtD), [`msdn.microsoft.com/en-us/library/dd894038.aspx`](http://msdn.microsoft.com/en-us/library/dd894038.aspx)）：\n\
  \n*   作为事务部分执行的所有实体必须具有相同的 `PartitionKey` 值。\n*   实体在事务中只能出现一次，且对其只能执行一次操作。\n* \
  \  事务最多包含 100 个实体，其总有效负载大小可能不超过 4 MB。\n*   表服务不支持更改集中的链接操作。\n\nADO.NET Data Services\
  \ 规范的“批请求”主题（[`bit.ly/14mlEO`](http://bit.ly/14mlEO), [`msdn.microsoft.com/en-us/library/cc668802.aspx`](http://msdn.microsoft.com/en-us/library/cc668802.aspx)）将批定义为“一个创建、更新和删除（CUD）操作的容器，称为更改集，以及一个查询操作（即批内的检索操作）”。更改集代表“一个或多个\
  \ CUD 操作”。\n\n单个批支持多个 `Insert Entity`、`Update Entity`、`Merge Entity` 和 `Delete Entity`\
  \ 操作，这些操作可以按任何顺序发生。批内只能发生一次查询操作。\n\n要使用 `StorageClient` 示例库将 CUD 操作封装在事务中，请在 `Context`\
  \ 对象上调用 `AddObject()`、`UpdateObject()` 和 `DeleteObject()` 方法后，为您的 `SaveChanges()`\
  \ 方法调用添加 `SaveChangesOptions.Batch` 参数。如果你使用的是库的早期版本，可能需要将 列表 7-4 中的高亮代码添加到 `StorageClient`\
  \ 库的 `TableStorage.cs` 文件中，以便在处理请求时添加 `x-ms-version` 请求头：\n\n列表 7-4: 添加最小表版本头以支持\
  \ EGT 的代码\n\n```csharp\nprivate void DataContextSendingRequest(object sender, SendingRequestEventArgs\
  \ e)\n{\n    HttpWebRequest request = e.Request as HttpWebRequest;\n    request.Headers.Add(\"\
  x-ms-version\", \"2009–04–14\");\n}\n```\n\nSteve Marx 的博客文章“Sample Code for Batch\
  \ Transactions in Windows Tables”（[`bit.ly/j2VXy`](http://bit.ly/j2VXy), [`blog.marx.com/posts/sample-code-for-batch-transactions-in-windows-tables`](http://blog.marx.com/posts/sample-code-for-batch-transactions-in-windows-tables)）提供了简单表的\
  \ EGT 示例。\n\n## 上传表\n\n正如前面的章节所述，Azure Data Services 使用 `POST` 方法向表插入实体。列表 7-5 是由\
