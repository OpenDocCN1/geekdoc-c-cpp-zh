  \n## 献词\n本书献给我的妻子 Alexandra。\n期待我们的二十五周年结婚。\n\n## 关于作者\n![2.1](img/ffirsuf001.jpg)\n\
  \nRoger Jennings 是一位作者和顾问，专攻 Microsoft .NET n 层数据库应用程序以及基于 SQL Server 的数据密集型 Windows\
  \ Communication Foundation (WCF) Web 服务。他一直是大多数版本 Visual Basic 的 Beta 测试员，从 Visual\
  \ Basic 2.0 专业扩展（代号为 Rawhide）开始，以及自 4.21 版本起的 SQL Server 以及所有版本的 Visual Studio。\n\
  \nRoger 编写的 26 本与计算机相关的书籍已有超过 125 万册英文在印，并已翻译成 20 多种语言。他为 Wiley/Wrox 出版了《Professional\
  \ ADO.NET 3.5 with LINQ and the Entity Framework》和《Expert One-on-One Visual Basic\
  \ 2005 Database Programming》；为 SAMS Publishing 出版了三版的《Database Developer's Guide\
  \ to Visual Basic》和两版的《Access Developer's Guide》；为 QUE Publishing 出版了 11 版《Special\
  \ Edition Using Microsoft Access》（特版）和两版的《Special Edition Using Windows NT 4.0 Server》（特版）。他还为\
  \ QUE 写过关于 Windows 3.1 多媒体、Windows 95 和 Windows 2000 Server 的面向开发者的书籍；为 Osborne\
  \ McGraw-Hill 写过 Active Directory 策略和 Visual Basic Web 服务；为 Microsoft Press 写过《Microsoft\
  \ Office InfoPath 2003 SP-1》。Roger 担任 Redmond Media Group 的 Visual Studio Magazine\
  \ 及其前身 Fawcette Technical Publications 的 Visual Basic Programmer's Journal 特约编辑超过\
  \ 15 年。他的文章也发表在 Redmond Magazine，并为 Redmond Developer News 撰写“TechBriefs”和封面故事。\n\
  \nRoger 拥有 30 多年的计算机相关经验，始于由 Wang 700 计算器以及后的 Wang BASIC 微型驱动的实时医疗数据采集和化学过程控制系统。他是\
  \ OakLeaf Systems（一家位于加州北部的软件咨询公司）的主开发人员，也是 OakLeaf Systems 博客 ([`oakleafblog.com`](http://oakleafblog.com))\
  \ 的作者。联邦法规 (CFR) ASP.NET Web 服务获得了 Microsoft .NET 水平解决方案奖（[`bit.ly/Balng`](http://bit.ly/Balng),\
  \ [www.microsoft.com/presspass/features/2002/aug02-07netwinners.mspx](http://www.microsoft.com/presspass/features/2002/aug02-07netwinners.mspx)）。\n\
