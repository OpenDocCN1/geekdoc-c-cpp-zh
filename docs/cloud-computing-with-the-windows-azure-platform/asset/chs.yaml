  \ 方法将消息写入虚拟操作系统的事件日志，Azure 或 .NET 服务无法访问该日志。日志项是调试运行在 Azure Fabric 中的服务的唯一方法，因此\
  \ Azure 团队提供了一种将事件日志项持久化到 blob 的方法。要将日志复制指定容器（本例中为 `oakleaf2`）中的 blob，请打开托管服务（`oakleaf2host`），点击生产服务的\
  \ `Configure` 按钮打开 `ServiceName – Production Deployment – Azure Blob Test – Service\
  \ Tuning` 页面，输入容器名称并点击 `Copy Logs` 按钮（见图 4.16）。在正常情况下，复制过程将在一两分钟内完成。\n\n**图 4.16**：从虚拟操作系统的事件日志复制到指定的容器名称。\n\
  \n![4.16](img/c04f016.jpg)\n\n## 使用工具查看内容和日志 Blob\n\n存在多种工具可以查看和复制 Azure 托管服务的 XML\
  \ 日志数据。许多工具具有操作系统或其他限制，这使得它们的用性较小。Bill Lodin 的 Windows Azure Log Viewer 可以在 Windows\
  \ Vista 下运行，并过滤 blob 以仅列出日志文件；该项目的更多信息和源代码可以在 [`bit.ly/WykNP`](http://bit.ly/WykNP),\
  \ [`msdn.microsoft.com/en-us/azure/dd63760.aspx`](http://msdn.microsoft.com/en-us/azure/dd63760.aspx)\
  \ 获取。图 4.17 显示了 SkyDrive 在 2009 年 1 月 5 日临时故障期间发生的错误日志。\n\nAzure 为每个至少发生一次日志项的 15\
  \ 分钟周期创建一个日志 blob。\n\n**图 4.17**：使用 Bill Lodin 的 Windows Azure Log Viewer 在容器中显示错误\
  \ blob 列表。\n\n![4.17](img/c04f017.jpg)\n\n点击 `Save to XML` 按钮会将 blob 的内容写入您选择的 XML\
