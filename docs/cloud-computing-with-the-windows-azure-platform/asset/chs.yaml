  \ Queues 的真实服务通常会在单个项目中组合 `WorkerRole` 和 `WebRole`。`Program Files\\Windows Azure\
  \ SDK\\v1.0\\samples.zip` 存档中的 `Thumbnails` 文件夹包含了示例服务 `Thumbnails.sln` 的源代码。`Thumbnails.sln`\
  \ 结合了 `Web` 和 `WorkerRoles`，将图形文件从用户本地文件系统上传到 Azure Blobs。\n\n\n\n\n\n</ConfigurationSettings>\n\
  </Role>\n</ServiceConfiguration>\n\n`ServiceDefinition.csdef` 文件中包含针对 `WebRole`\
  \ 和 `WorkerRole` 的重复 `<Role>` 部分。\n\n对于需要大量计算资源的工作进程，将 `WorkerRoles` 的初始实例数量指定为\
  \ `WebRoles` 的两倍是一种常见做法。\n\n## Thumbnail_WebRole 方法和事件处理程序\n\n下表描述了 `Thumbnail_WebRole`\
  \ 项目的方法和事件处理程序。\n\n| 方法或事件处理程序名称 |  |\n| --- | --- |\n| `CreateOnceContainerAndQueue()`\
  \ | 测试开发存储（Development Storage）创建用于原始图像和缩略图的 photogallery blob 容器，以及一个用于处理添加新图像后产生的消息的\
  \ thumbnailmaker 队列 |\n| `GetPhotoGalleryContainer()` | 创建并返回 photogallery BlobContainer\
  \ |\n| `GetThumbnailMakerQueue()` | 创建并返回 thumbnailmaker 队列 |\n| `submitButton_Click()`\
  \ 事件处理程序 | 添加包含用户选择的图像文件的 photogallery blob，并将带有 blob 命名的消息放入 thumbnailmaker 队列\
  \ |\n| `Page_PreRender()` 事件处理程序 | 刷新缩略图 `ListView.DataSource` 属性值并应用 `ListView.DataBind()`\
  \ 方法 |\n\n当 `Default.aspx` 在客户端浏览器中打开时，`Page_Prerender` 事件每秒（或更多）触发一次。这些事件的实际计时取决于客户端\
  \ Internet 连接的下载和上传速度以及 `thumbnails` BlobContainer 中缩略图的数量。\n\n## Thumbnail_WorkerRole\
  \ 方法和事件处理程序\n\n下表描述了 `Thumbnail_WorkerRole` 项目的方法和事件处理程序。\n\n| 方法名称 | 说明 |\n| ---\
  \ | --- |\n| `Start()` | 在应用程序启动时创建 photogallery BlobContainer 和 thumbnailmaker\
  \ 队列，并在五秒的 while 循环中测试本地开发存储存储 blobs 和队列的能力；如果成功，则通过一个秒的 while 循环测试新消息，这会导致回传（postback）。如果发现新消息，则调用\
  \ `CreateThumbnail()` 方法向容器中添加缩略图 blob 并删除该消息。 |\n| `CreateThumbnail()` | 从常见图形格式的位图\
  \ `Stream` 创建一个最大宽度或高度为 128 像素的 `*.jpg` 缩略图 `Stream`。浏览对话框的图片类型支持 `*.jpg`、`*.jpeg`\
  \ 和 `*.png` 格式。 |\n| `GetHealthStatus()` | 未实现或未使用。开发环境和 Azure 持续轮询此值以确定角健康状态。 |\n\
  \n上述 `Start()` 方法覆盖了默认的 `System.Threading.Start()` 方法。\n\n`CreateThumbnail()` 方法使用了\
  \ `HighQualityBicubic` 插值算法、`AntiAlias` 平滑模式和 `HighQuality` 像素偏移模式，这是质量最高且计算最密集的组合。\n\
