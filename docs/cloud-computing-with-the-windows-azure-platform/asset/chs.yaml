  \ [`bit.ly/qIT1S`](http://bit.ly/qIT1S), [`blogs.msdn.com/drobinson/default.aspx`](http://blogs.msdn.com/drobinson/default.aspx)。\n\
  \n\n\n\n\nMike Amundsen 是一位国际知名的作者和讲师，他穿梭于美国和欧洲，就 `.NET`、互联网、团队开发等广泛的话题进行演讲和教学。他已出版了十余部著作；他最受欢迎的作品包括《21\
  \ 天用 Visual Basic 自学数据库程序设计》、《Using Visual InterDev》以及《ASP.NET for Developers》。在不旅行时，Mike\
  \ 会待在位于肯塔基州的家中，与妻子和三个孩子一起度过。Mike 与 Subbu Allamaraju 正在编写《RESTful Web Services Cookbook》，该书将由\
  \ O'Reilly Media 于 2009 年底出版。Mike 的 `mca` 博客地址为 [www.amundsen.com/blog/](http://www.amundsen.com/blog/)。\n\
  \nWrox 执行编辑 Bob Elliott 说服我开始为 Wiley/Wrox 编写 `.NET` 开发者书籍。作为本书以及我在此之前的两本 Wiley/Wrox\
  \ 书籍的项目编辑，Adaobi Obi Tulton 确保了各章节的编写进度不会落后计划太远，以便在 2009 年微软专业开发者大会上正式宣布 `Windows\
  \ Azure Platform` 发布到网络之前交付本书。\n\n# 引言\n\n云计算在 2008 年年中成为一个热门话题，并到 2009 年年中已达到顶级流行词的地位。作为其受欢迎程度的证明，2009\
  \ 年 8 月中旬在 [Bing.com](http://Bing.com) 上搜索“cloud computing”返回了 9200 万次结果。几乎没有哪一周全球范围内某处没有举办一场云计算会议。《富布斯》（Forbes）和《商业周报》（Business\
  \ Week）等主流商业杂志经常刊登云计算专题文章和综合特别报告，例如《商业周报》 2009 年 6 月 5 日出版的《云计算对业务的大爆炸》，该文展示了 Serena\
  \ Software、Optum Health、Genentech、可口可乐企业和 Info Tech 使用云服务的案例（[`bit.ly/uecfb`](http://bit.ly/uecfb),\
  \ [www.businessweek.com/magazine/toc/09_24/B4135cloud_computing.htm](http://www.businessweek.com/magazine/toc/09_24/B4135cloud_computing.htm)）。在该周早些时候，微软首席执行官\
  \ Ray Ozzie 在硅谷丘奇尔俱乐部（Churchill Club）发表了关于“云计算的潜力”的演讲（[`bit.ly/g2wqn`](http://bit.ly/g2wqn),\
  \ [www.churchillclub.org/eventDetail.jsp?EVT_ID=820](http://www.churchillclub.org/eventDetail.jsp?EVT_ID=820)）。TechCrunchIT\
  \ 的 Leena Rao 在 2009 年 6 月 4 日的文章中引用了 Ozzie 的话（[`bit.ly/1h01j`](http://bit.ly/1h01j),\
  \ [www.techcrunchit.com/2009/06/04/liveblogging-microsofts-ray-ozzie-on-the-potential-of-cloud-computing](http://www.techcrunchit.com/2009/06/04/liveblogging-microsofts-ray-ozzie-on-the-potential-of-cloud-computing/))：\n\
  \n从本质上说，`Windows Azure` 的本质……使人们能够以尽可能小的更改封装现有的 Windows Server 工作负载，从而移动到公有云或私有云环境中。它正在制定程序设计模式和基础设施——这就是理想的云计算结构面貌，这就是你如何构建一个具有弹性伸缩能力的程序等等……\n\
  \n当被主持人 Steven Levy 问到“有多少家公司可以构建大型云？”时，Ozzie 回答道：\n\n没多少。我不知道 Amazon {。他们是领导者。他们做了令人惊叹的工作。但\
  \ [Windows] 服务器企业级部署的规模是非常巨大的。我们有许多使用 `Exchange` 和 `SharePoint` 的公司想要进入这一基础设施……这是一项巨大的投资。\n\
  \n亚马逊云服务（Amazon Web Services）是当今云计算领域的“80 磅大象”，它在基础设施即服务（IaaS）市场已运营了三年，拥有 2006 年\
  \ 11 月宣布的弹性计算云（`EC2`）以及 2006 年 3 月开始的简单存储服务（`S3`）。谷歌是平台即服务（PaaS）业务的首批参与者之一，拥有由 Python\
  \ 驱动的 Google App Engine（`GAE`），该平台现在支持 Java 作为编程语言。GAE 在 2008 年 4 月初限制为 10,000 名开发者，并在\
  \ 2008 年 5 月 28 日向所有人开放。根据 Wikipedia，软件即服务（SaaS）的典范 [Salesforce.com](http://Salesforce.com),\
  \ Inc. 在 2009 年年中拥有 55,400 名客户关系管理（CRM）客户和超过 150 万名订阅者。Verizon 是 2009 年 6 月首批宣布进入云计算即服务（CaaS）业务的电信公司之一。在本书编写期间正处于被甲骨文收购过程中的\
  \ Sun Microsystems 以及 IBM 都是 Windows Azure 潜在的 PaaS 竞争对手。\n\nOzzie 针对 Levy 的问题“与其他科技公司相比，你们云计算的竞争优势是什么？”给出了以下列表：\n\
  \n1. 技术：微软研究院一直在做伟大的工作。\n2. 操作系统。\n3. 存储投资，因为搜索。\n4. 开发者优势：专注于微软技术栈的数百万开发者。如果我们能向他们证明我们拥有良好的基础设施，他们就会部署。在硬件合作伙伴那里也有机会。\n\
  5. 企业级：Exchange 和 SharePoint 是省钱的好方法。\n\n本书重点关注上述列表的第 4 项。微软在云计算方面的竞争优势取决于其利用使用\
  \ Visual Studio (`VS`) 2008 和 2010 的开发者技能，将本地应用程序和服务迁移到 Azure。从 VS 的解决方案管理器发布到 Azure\
  \ 托管环境只需点击鼠标。从托管环境到生产环境是单键操作，会自动创建两个数据副本以实现高可用性。在流量激增时配置额外的实例，并在需求减少时收缩，也是自动的。\n\
  \n《使用 Windows Azure 平台进行云计算》一书的早期章节简要讨论了将许多 IT 操作迁移到云端的业务合理性，并处理了棘手的云安全问题。然而，本书侧重于\
  \ Windows Azure 存储服务（表、blob 和队列）以及 Web 应用（WebRoles 和 WorkerRoles）的实际编程，以及 .NET Services，包括访问控制服务、总线队列和路由器以及工作流。Azure\
  \ 团队在后期决定从 SQL Server Azure Database 的权威-容器-实体（ACE）数据模型转向 SADB 的全关系型账户-服务器-数据库模型，并在本书印刷截止后才发布了第一个社区技术预览版（CTP）。因此，本书关于管理和编程\
  \ SADB 以及 Data Hub 的最后两个章节以及示例源代码可以在 Wrox 网站 [www.wrox.com](http://www.wrox.com)\
  \ 下载。Azure 团队从 .NET Services 2009 年 7 月 CTP 开始从功能集中删除了工作流，因为 .NET Framework 4 将配备一个大幅改进的工作流引擎。工作流将在\
  \ .NET 4 正发布后恢复。\n\nSQL Server DBA 和数据库架构师可以利用 SQL Azure、微软同步框架以及新命名的 Data Hub（原代号\
  \ Huron）发挥他们的 Trans-SQL 长。Data Hub 在本地、移动和 Azure 数据库之间同步架构和表行。开发机上的 SQL Server 管理工具只需更改登录对话框中的服务器\
  \ DNS 名称即可连接到 SQL Server 数据库。管理 SADB 通过 TCP 端口 1433 上的 SQL Server 传统传输数据流 (`TDS`)\
  \ 协议运行 T-SQL，并使用 .NET `SqlClient` 类。或者，ADO.NET Data Services（原 Project Astoria）通过\
  \ HTTP[S] 提供对 SADB 数据的 RESTful 访问。\n\n\n\n\n\n.NET 开发人员、软件架构师和开发管理人员是本书的主要读者，但 IT\
  \ 执行人员和经理可能也会发现关于 Windows Azure 服务审计治理和安全的详细信息非常有用。例如，第 5 章“迁移到 Azure 云服务时最小化风险”观察了对云治理和安全审计的需求，并随后描述了审计标准声明\
  \ (`SAS`) 70 I 型和 II 型证明，以及微软数据中心在 2009 年年中获得的 `ISO/IEC 27001:2005` 认证。\n\n微软是第一个为其数据中心同时获得\
  \ `SAS` 70 I 型和 II 型证明以及 `ISO/IEC 27001:2005` 认证的主要 PaaS 云服务提供商。\n\n## 本书涵盖的内容\n\
  \n《基于 Windows Azure 平台的云计算》涵盖涵盖了使用 `Visual Studio 2008`、`.NET Framework 3.5`、`Windows\
  \ Azure Software Development Kit (SDK)`、`.NET Services SDK`、`SQL Azure SDK` 和 `ADO.NET\
  \ Data Services` 进行服务端和客户端编程。在适用的情况下使用本地的 `Azure Development Fabric`，并使用云端的 `Azure\
  \ Production Fabric`。示例程序说明了使用 `Azure blobs`、`tables` 和 `queues` 进行数据存储和检索；使用 `ASP.NET\
  \ membership` 和 `Azure Access Control Services` 对用户进行身份验证和授权；使用 `Service Bus` 及其队列和路由器连接服务与客户端；以及使用\
  \ `.NET Services` 和 `VS` 的图形化 `Workflow Designer` 实现工作流。大部分示例代码使用了示例 `StorageClient`\
  \ 库，通过传统的 `.NET` 对象简化编程，而不是原始的 `HTTP` 请求和响应。\n\n在编写本书时，`.NET 4` 和 `VS 2010` 处于 Beta\
  \ 测试阶段，且 `Azure Fabric` 不支持需要 `.NET 4` 特性的项目。使用 `VS 2010` 和 `2008` 开发或部署 Azure 项目或服务没有显著差异。\n\
  \n## 本书的结构\n\n本书分为四个部分，每部分包含二到五章。大多数章节建立在你从章节中获得的知识之上。因此，建议按顺序阅读。以下是各部分及其章节内容的简要描述。\n\
  \n### 第一部分：Windows Azure 平台简介\n\n第一部分致力于通用的云计算主题、Windows Azure 基础设施和 `Azure Storage\
  \ Services`。\n\n*   **第 1 章**“云计算的角色概述”从云计算的定义及其估计市场规模开始，讨论了将应用程序和服务迁移到云端的原因，概述了云计算的历史及其祖先（如\
  \ `Oracle's Network Computer`），然后继续描述了各种 `aaS` 变体，例如“数据即服务 (DaaS)”、“软件即服务 (SaaS)”以及微软的“软件+服务”，以及云计算的本体论。本章以关于美国国家标准与技术研究院\
  \ (`NIST`) 的《云计算草案工作定义 v13》和《有效且安全地使用云计算范式的演示 v22》（发布于 `[`bit.ly/KQ2ZZ`](http://bit.ly/KQ2ZZ)`、`[`csrc.nist.gov/groups/SNS/cloud-computing/index.html`](http://csrc.nist.gov/groups/SNS/cloud-computing/index.html)`）的细节作为结束。\n\
  \n*   **第 2 章**“理解 Windows Azure 平台架构”从描述 Windows Azure 平台的组件开始，包括用于管理托管应用程序和服务的\
  \ `Azure Development Portal`，以及实现 `Developer Fabric` 和 `Developer Storage` 以在开发人员计算机上模拟云服务的\
  \ `Azure Development Platform`。随后介绍了 `Windows Azure SDK` 以及通过 `Windows Azure Tools\
  \ for Visual Studio` 添加到 `VS 2008` 中的模板，本章继续介绍了关于 `.NET Services`、`Service Bus`、`Workflow\
  \ services` 以及将解决方案部署到 Azure 云的细节。\n\n*   **第 3 章**“分析 Windows Azure 操作系统”深入研究了\
  \ `Azure Fabric Controller`，它处理应用程序/服务的部署、负载均衡、操作系统/数据复制和资源管理。随后描述了物理节点与逻辑角色及其托管的服务之间的关系，以及如何为新的生产项目创建宿主机和虚拟机\
  \ (`VMs`)。接着讨论了升级域（upgrade domains）的作用（它支持对 Windows Azure 操作系统进行滚动服务软件更新和补丁），以及用于高可用服务的故障域（fault\
  \ domains），以及底层架构在多租户环境中如何维护租户隐私。本章以以供 Azure 使用的 Windows Server 虚拟化细节作为结束。\n\n*\
  \   **第 4 章**“扩展 Azure 表和 Blob 存储”解释了如何创建 Azure 存储账户，描述了如何使用 `Fiddler2` 网络调试代理查看\
  \ `HTTP` 请求和响应消息，分析了示例 `C# StorageClient` 库如何简化存储编程，然后详细介绍了将 Azure 表和 blobs 用作 `WebRoles`\
  \ 数据源的编程技术。源代码包含了部署到云端的表（`[oakleaf.cloudapp.net](http://oakleaf.cloudapp.net)`）和\
  \ blobs（`[oakleaf2.cloudapp.net](http://oakleaf2.cloudapp.net)`）的示例 `C#` 解决方案。\n\
  \n## 第二部分：在企业中利用云服务\n\n第二部分向你展示如何通过传输和存储数据加密、基础云身份验证和授权技术解决企业规模的业务问题，提高 Azure 表的可扩展性并实现事务，以及通过\
  \ Azure 队列和 `WorkerRoles` 并行处理计算操作。\n\n*   **第 5 章**“迁移到 Azure 云服务时最小化风险”首先讨论了加州大学伯克利分校白皮书《云端之上：伯克利分角的云计算视角》中的“云计算增长的\
  \ 10 大阻碍与机遇”、服务水平协议 (`SLAs`) 以及 `NIST` 对 IT 相关风险的定义，以及联邦机构部署云服务的计划。随后分析了相关法规，例如《格拉姆-莱奇-布莱利法案\
  \ (`GLB`)》、《萨班斯-奥克斯法案 (`SOX`)》、《健康保险流动性与责任法 (`HIPAA`)》和《反腐败法》，以及需要审计的支付行业数据安全标准\
  \ (`PCC-DSS`)。随后提供了实现 `WebRoles` 的安全套接层 (`SSL`) 传输加密、Azure Data Services 的 `TLS`\
  \ 以及 Azure Storage Services 中个人信息加密的代码。本章以关于审计符合法规和行业标准的章节结束。\n\n*   **第 6 章**“对服务用户进行身份验证和授权”向你展示如何使用\
  \ `AspProviders` 类库以及 `TableStorageMembershipProvider`、`TableStorageRoleProvider`、`TableStorageProfileProvider`\
  \ 和 `TableStorageSessionProvider` 类将 `.NET` 身份验证和角色管理适配到 Azure `WebRoles`。本章以 `ASP.NET\
  \ Membership` 服务与 Azure 服务的细节结束。\n\n*   **第 7 章**“优化 Azure 表的可扩展性和性能”描述了如何选择 `PartitionKey`\
  \ 和 `RowKey` 值的最佳组合（这些值对应于关系表的复合主键），如何处理关联实体（子或父实体），以及利用 Azure 团队在 Windows Azure\
  \ 2009 年 5 月 CTP 中引入的实体组事务 (Entity Group Transactions)。提供了使用 `ADO.NET Data Services`\
  \ 上传同构（父或子实体）和异构（父和子实体）表的示例，并附带性能比较。本章以在链接的父/子 `ASP.NET DataGrid` 控件中显示异构实体的代码结束。\n\
  \n\n\n\n\n* 第 8 章“使用 Azure 队列进行通信”解释了将计算服务卸载到一个或多个 `WorkerRoles` 的优势，并描述了如何使用 `QueueStorage`、`MessageQueue`、`QueueProperties`\
  \ 和 `Message` 类以及 `MessageReceivedEventHandler` 委托创建并处理 Azure 队列。该章还描述了如何增强 `Thumbnails.sln`\
  \ 示例解决方案，并在轮询 blob 更新时尽量减少网络流量。位于 [oakleaf5.cloudapp.net/](http://oakleaf5.cloudapp.net/)\
  \ 的最终照片库 Azure 队列测试框架示例项目包含一个通过队列从本地图形文件添加图像 blob 的 `GridView`。\n\n# 第三部分：应对高级 Azure\
  \ 服务技术\n\n第三部分介绍了使用 Microsoft .NET Services SDK 编程 .NET 服务成员——访问控制服务 (ACS)、.NET\
  \ 服务总线 (SB) 和工作流服务 (WF)。\n\n* 第 9 章“使用 .NET 访问控制服务验证用户”将 ACS 描述为托管在 Windows Azure\
  \ 中的安全令牌服务基础设施，用于验证凭据并发布令牌。该章将向你展示如何配置和创建 .NET 服务解决方案，使用微软的 [FederatedIdentity.net](http://FederatedIdentity.net)\
  \ 网站创建联合信息卡凭据，使用 Geneva Server beta 2 为自己的组织创建信息卡，以及使用 CardSpace 信息卡通过 ACS 进行用户身份验证和授权。\n\
  \n* 第 10 章“通过 .NET 服务总线互连服务”解释了如何使用 SB 及其各种消息模式来穿越防火墙和网络地址转换 (NAT) 设备，同时通过互联网连接\
  \ Windows Azure 和其他应用程序。编程主题包括使用 SB 继继消息、通过 Atom 馈使使服务公开可发现，以及使用配置文件指定 `WSHttpRelayBinding`。\n\
  \n* 第 11 章“探索 .NET [工作流服务和] 服务总线队列与路由器”解释了如何使用 `QueueManagementClient` 类在服务总线队列\
  \ (SBQs) 中持久化消息，并使用服务总线路由器 (SBR) 传递消息。该章的在线版本（将在 .NET 4 发布后提供）将使用 `CheckScoreWorkflow.sln`\
  \ 示例项目引入 WF 云端应用架构和 .NET 服务门户的工作流管理页面。\n\n# 第四部分：使用 SQL Azure 服务（仅限在线）\n\n微软 SQL\
