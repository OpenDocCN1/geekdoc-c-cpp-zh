  ```\n\n### 12 个加密实体中的第一个实的响应头\n\n```http\nHTTP/1.1 200 OK\nCache-Control: no-cache\n\
  Transfer-Encoding: chunked\nContent-Type: application/atom+xml;charset=utf-8\nServer:\
  \ Table Service Version 1.0 Microsoft-HTTPAPI/2.0\nx-ms-request-id: e7d86f70-aa3f-4b51-da82-bf94\n\
  x-ms-continuation-PartitionKey: \nx-ms-continuation-RowKey: \nDate: Mon, 23 Mar\
  \ 2009 18:03:12\n```\n\n\n\n\n\n示例项目的 `Customers.cs` 文件包含了 `CustomerDataModel` 类，该类代表表的对象模型，它是你对其成员应用\
  \ `Encrypt` 和 `Decrypt` 方法进行 CRUD 操作的核心对象。`CustomerDataModel` 类继承自 `StorageClient`\
  \ 类库中的 `TableStorageEntity` 抽象类。\n\n[列表 5-14] 显示了 `CustomerDataModel` 成员访问器（getters\
  \ 和 setters）的代码，包括处理 PII（个人身份信息）的方法。重点标记的 `getArg` 和 `setArg` 方法调用以及方法分别处理解密和加密。将\
  \ `_Default.isCreateCusts` 标志位设置为 `true`，以防止在 `Get` 操作紧接 `Set` 操作之后时进行解密，这种情况通常发生在添加新实体或更新实体时。\n\
  \n### 列表 5-14：CustomerDataModel 成员的加密和解密代码\n\n```csharp\npublic class CustomerDataModel\
  \ : TableStorageEntity\n{\n    public string base64Regex =\n        \"^((?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$\"\
  ;\n\n    // 默认无参数构造函数\n    public CustomerDataModel() : base()\n    {\n        RowKey\
  \ = Guid.NewGuid().ToString();\n        PartitionKey = \"Customers\";\n    }\n\n\
  \    // 部分参数构造函数\n    public CustomerDataModel(string partitionKey, string rowKey)\n\
  \        : base(partitionKey, rowKey)\n    {\n    }\n\n    public string CustomerID\
  \ { get; set; }\n\n    // 加密的个人身份信息\n    private string companyName;\n    public\
  \ string CompanyName\n    {\n        get\n        {\n            return getArg(companyName);\n\
  \        }\n        set\n        {\n            companyName = setArg(value);\n \
  \       }\n    }\n\n    // 获取处理处理器\n    public string getArg(string getVar)\n  \
  \  {\n        if (getVar != null)\n            if (Regex.IsMatch(getVar, base64Regex))\n\
  \                if (_Default.isCreateCusts)\n                    // 从对象获取加密值\n\
