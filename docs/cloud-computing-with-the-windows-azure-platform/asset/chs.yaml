  \nWindows Azure SDK（2009 年 CTP）引入了实体组事务（EGT），允许对同一实体组中的实体执行事务性的插入、更新、合并和删除操作。实体组是同一张表中具有相同\
  \ `PartitionKey` 值的实体集合。\n\n2009 年 CTP 版本的 SDK 开发环境在开发存储中不支持 EGT。2009 年 CTP 的示例\
  \ `StorageClient` 封装实现不支持 EGT，因此你无法通过使用 `StorageClient` 对象的常规 .NET 代码执行 EGT。\n\n\
  ### 查询特定实体或多个实体\n\n\n\n\n\n查询可能是生产环境 Azure Tables 上常见的操作。后续章节描述了如何使用 C# 代码和 HTTP\
  \ GET 方法来返回分页的 LINQ to REST 查询结果集，并将其显示在 `SampleWebCloudService` 项目的 `GridView`\
  \ 控件中。\n\n分页代码改编自 Steve Marx 的 2008 年 11 月 12 日的博客文章 Paging Over Data in Windows\
  \ Azure Tables, [`blog.smarx.com/posts/paging-over-data-in-windows-azure-tables`](http://blog.smarx.com/posts/paging-over-data-in-windows-azure-tables))）。\n\
  \n## 使用代码查询实体分页\n\n如前所述，ADO.NET Data Services 客户端使用 LINQ to REST 语法生成 HTTP GET 方法。LINQ\
  \ to REST 使用 Astoria 查询选项、操作符和函数的子集来编码查询字符串。下表显示了 LINQ to REST 查询支持的 ADO.NET Data\
  \ Services 方法、属性、标准查询操作符、比较操作符和布尔操作符：\n\nLINQ to REST 是 LINQ to ADO.NET Data Services\
  \ 的非正式缩写。\n\n值得注意的是，它并不支持 Order By、Group By、Skip 以及以及许多其他 LINQ 标准查询操作符。`Select`\
  \ 必须返回完整的实体；如前所述，不支持投影（projections）。查询最多返回 1,000 个项目，因此 `Take(1000)` 是上限。`NextPartitionKey`\
  \ 和 `NextRowKey` 属性值为应用 `Take()` 方法的分页操作提供了起始位置。ADO.NET Data Services v1 不支持聚合函数，如\
  \ `Count()` 或 `Sum()`。\n\n| 类别 | 支持的方法、属性、查询操作符或比较操作符 |\n| :--- | :--- |\n| 数据查询方法\
  \ | `AddQueryOption`, `BeginExecute`, `EndExecute`, `GetEnumerator` |\n| 数据查询属性\
  \ | 支持所有的 ADO.NET `DataServiceQuery` 属性 |\n| 标准查询操作符 | `From`, `In`, `Where`, `Select`\
  \ (无投影), `Take` (有限制), `First`, `FirstOrDefault` |\n| 比较操作符 | `Equal`, `GreaterThan`,\
  \ `GreaterThanOrEqual`, `LessThan`, `LessThanOrEqual`, `NotEqual` |\n| 布尔操作符 | `And`,\
  \ `AndAlso`, `Not`, `Or` |\n\n[Listing 4-8:] `Default.aspx.cs` 后置文件中的代码用于为 `GridView`\
  \ 填充 12 个或更少的 `Customer` 实体分页。\n\n```csharp\nnamespace SampleWebCloudService\n{\n\
  \    public partial class _Default : System.Web.UI.Page\n    {\n        // 多处使用\n\
  \        StorageAccountInfo account = null;\n        CustomerDataContext serviceContext\
  \ = null;\n        public bool skipPreTime = false;\n\n        protected void Page_Load(object\
  \ sender, EventArgs e)\n        {\n            // 获取一次 StorageAccountInfo\n    \
  \        account = StorageAccountInfo.GetDefaultTableFromConfiguration();\n    \
  \        serviceContext = new CustomerDataContext(account);\n            serviceContext.RetryPolicy\
  \ = RetryPolicies.RetryN(3, TimeSpan.FromSeconds(1));\n        }\n\n        protected\
  \ void Page_PreRender(object sender, EventArgs e)\n        {\n            // 每次获取\
  \ 12 个客户的一页\n            Stopwatch timer = new Stopwatch();\n            timer.Start();\n\
  \            // 写入 LINQ to REST 查询\n            int pageSize = 2;\n            var\
  \ query = (DataServiceQuery<Customer>)new CustomerDataContext(account).Table.Take(pageSize);\n\
  \            // 请求延续令牌\n            var continuation = Request[\"ct\"];\n      \
  \      if (continuation != null)\n            {\n                // ct 看起来类似于 \"\
  <partitionKey>/<rowKey>\"\n                string[] tokens = continuation.Split('/');\n\
  \                var partitionToken = tokens[0];\n                var rowToken =\
  \ tokens[1];\n                // 这些成为请求中的延续令牌 (ct) 参数\n                query = query.AddQueryOption(\"\
  NextPartitionKey\", partitionToken).AddQueryOption(\"NextRowKey\", rowToken);\n\
  \            }\n            var result = query.Execute();\n            // 转换为 QueryResponse\
  \ 并读取自定义头部\n            var qor = (QueryOperationResponse)result;\n            string\
  \ nextPartition = null;\n            string nextRow = null;\n            qor.Headers.TryGetValue(\"\
  x-ms-continuation-NextPartitionKey\", out nextPartition);\n            qor.Headers.TryGetValue(\"\
  x-ms-continuation-NextRow\", out nextRow);\n            if (nextPartition != null\
  \ && nextRow != null)\n            {\n                nextLink.NavigateUrl = string.Format(\"\
  ?ct={0}/{1}\", nextPartition, nextRow);\n                txtNextPartitionKey.Text\
  \ = nextPartition;\n                txtNextRowKey.Text = nextRow;\n            \
  \    btnCreateCustomers.Enabled = false;\n                btnDeleteAll.Enabled =\
  \ true;\n            }\n            else\n            {\n                txtNextPartitionKey.Text\
  \ = null;\n                txtNextRowKey.Text = null;\n                nextLink.Visible\
  \ = false;\n            }\n        }\n    }\n}\n```\n（注：提供的代码块在源码中存在一些格式残留/重复，我在保持原有逻辑的基础上对其清理）。\n\
