  \n### 删除实体\n\n最后一个 CRUD 操作是删除实体。`.NET` 客户端库在 `Where` 表达式中不支持通配符，因此删除时必须遍历要删除的实体集合，并逐个标记它们进行删除，如列表\
  \ 4-17 所示。\n\n### 列表 4-17：删除 CustomerTable 中所有 Customer 实体的代码\n\n```csharp\n// 分别删除所有\
  \ CustomerTable 实体\n// 重置 customersView GridView 的数据源\nprotected void btnDeleteAll_Click(object\
  \ sender, EventArgs e)\n{\n    Stopwatch timer = new Stopwatch();\n    timer.Start();\n\
  \    skipPreRenderTime = true;\n    var results = from c in serviceContext.CustomerTable\n\
  \                  select c;\n    TableStorageDataServiceQuery<CustomerDataModel>\
  \ query =\n        new TableStorageDataServiceQuery<CustomerDataModel>\n       \
  \   (results as DataServiceQuery<CustomerDataModel>);\n    IEnumerable<CustomerDataModel>\
  \ queryResults = query.ExecuteAllWithRetries();\n    foreach (var result in results)\n\
  \    {\n        serviceContext.DeleteObject(result);\n    }\n    serviceContext.SaveChanges();\n\
  \    customersView.DataSource = null;\n    customersView.DataSourceID = \"customerData\"\
  ;\n    customersView.DataBind();\n    btnCreateCustomers.Enabled = true;\n    btnUpdateCusts.Enabled\
  \ = false;\n    txtTime.Text = (timer.ElapsedMilliseconds / 1000).ToString(\"0.000\"\
  );\n}\n```\n\n调用 `SaveChanges()` 方法会通过多个 `DELETE` 请求和响应将实体从其表中删除，这与列表 4-18 和 19\
  \ 类似。\n\n### 列表 4-18：针对 CustomerTable 的 DELETE 请求\n\n```http\nDELETE /CustomerTable(PartitionKey='Customer',RowKey='ALFKI')\
