  \n### 标准化信息卡术语\n\n`IMI1.0` 命名空间（http://schemas.xmlsoap.org/ws/2005/05/identity/）与\
  \ `WS-Trust`、`WS-SecurityPolicy` 和 `WS-Addressing` 规范相关。`IMI 1.0` 命名空间 2019 年 2\
  \ 月的委员会草案 02 定义了与下表所示信息卡相关的术语。\n\n| 术语 | 定义 |\n| :--- | :--- |\n| 信息卡模型 | 指使用包含元数据的`信息卡`，用于从`身份提供者`处获取`数字身份`声明，并在用户控制下将其传递给`依赖方`。\
  \ |\n| 信息卡 | 为终端用户提供`数字身份`的视觉表示。`信息卡`包含对 `IP/STS` 的引用，该实体负责颁发包含该`数字身份``声明`的`安全令牌`。\
  \ |\n| 数字身份 | 一方对另一方所做的一组`声明`。 |\n| 声明 | 关于`主体`的信息，由`身份提供者`对该`主体`进行的断言。 |\n| 主体\
  \ | 由`身份提供者`对其做出`声明`的个人或实体。 |\n| 服务请求者 | 代表想要通过数字网络获取服务的实体运行的软件。 |\n| 依赖方 (RP) |\
  \ 提供所需服务并依赖`数字身份`的网络实体。 |\n| 身份提供者 (IP) | 提供`依赖方`使用的`数字身份`声明的网络实体。 |\n| 安全令牌服务 |\
  \ 一个 `WS-Trust` 端点。 |\n| 身份提供者安全令牌服务 (IP/STS) | 由`身份提供者`运行的用于颁发令牌的`安全令牌服务`。 |\n\
  | 依赖方安全令牌服务 (RP/STS) | 由`依赖方`运行的用于接收和颁发令牌的`安全令牌服务`。 |\n| 身份选择器 (IS) | 服务请求者可使用的软件组件，用户通过它控制并分发其`数字身份`（例如\
  \ `CardSpace \"Geneva\"`）。 |\n| 信任身份 | 关于主体可验证的`声明`（例如`名称`、`身份`、`密钥`、`权限`、`能力`等）。\
  \ |\n| 安全令牌 | 代表`声明`的集合。 |\n| 签名令牌 | 由特定权威断言并加密背书的`安全令牌`（例如 X.509 证书、Kerberos 票据或自签`信息卡`）。\
  \ |\n| 未签名令牌 | 未经特定权威加密背书的`安全令牌`（例如由用户名和密码等共享密钥支持的`安全令牌`）。 |\n| 所有权证明 | 用于证明过程的数据，以证明安全令牌发送者拥有本应只有其已知的信息。\
  \ |\n| 完整性 | 保证信息在传输过程中未被修改的过程。 |\n| 机密性 | 保护数据使只有授权的操作者或`安全令牌所有者`可以查看的过程。 |\n|\
  \ 摘要 | 字节流的加密校验和。 |\n| 签名 | `所有权证明`与`摘要`的加密绑定。（这涵盖了对称密钥和公密钥签名；因此，并不总能实现不可否认性）。 |\n\
  \n在本章的剩余部分，你会遇到大部分这些术语。\n\n#### 使用 ACS 使用托管的 CardSpace 凭证\n\n图 9.10 显示了在使用由第三方 `IP`\
  \ 颁发的托管 `CardSpace 信息卡`时，`服务请求者`、`访问控制解决方案`和`依赖方`之间的七种主要交互。\n\n![9.10](img/c09f010.jpg)\
  \ 使用托管 `CardSpace 凭证` 的服务请求者、访问控制解决方案和依赖方之间的七种主要交互。\n\n\n\n\n# 为 oakleaf-acs 解决方案配置\
