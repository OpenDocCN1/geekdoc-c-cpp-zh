  \ 中用你的值替换 `wll_appid` 和 `wll_secret` 的值。\n\n## 为 Visual Studio 安装 Windows Live Tools\n\
  \n为 Microsoft Visual Studio 2008+ 安装 Windows Live Tools 是可选的，因为 Default.aspx 页面中的\
  \ WebAuth 代码会从 [`login.live.com/controls/`](http://login.live.com/controls/) 导入\
  \ WebAuth.htm 登录控件到 IFRAME 中。Windows Live Tools 为 VS 工具箱添加了一个 Windows Live 组，其中包含\
  \ `IDLoginStatus` 和 `IDLoginView` ASP.NET 控件，以及 MessengerChat、SilverlightStreamMedia\
  \ 和 Contacts 控件，以及 Virtual Earth 组，这些内容都与 WLID 无关。安装还会 VS 的新建项目对话框中添加一个 Windows\
  \ Live ID Web Role 模板（参见图 6.26）。\n\n图 6.26 由 Windows Live Tools for VS 添加的 Windows\
  \ Live ID Web Role 模板。\n\n![6.26](img/c06f026.jpg)\n\n要下载并安装适用于 VS 2008+ 的最新 Windows\
  \ Live Tools，请访问 [dev.live.com/tools/](http://dev.live.com/tools/) 并点击 Download\
  \ 链接。\n\n### IDLoginStatus 控件\n\n`IDLoginStatus` 控件 ([`bit.ly/Q3Cew`](http://bit.ly/Q3Cew),\
  \ [`msdn.microsoft.com/en-us/library/cc305086.aspx`](http://msdn.microsoft.com/en-us/library/cc305086.aspx))\
  \ 替代了 WebAuth 示例项目使用的导入 WebAuth.htm 控件。该控件为用户提供登录链接；点击该链接将他们带到 WLID 登录页面，他们在那里使用\
  \ WLID 登录。在 WLID 服务验证身份后，他们将被重定向到你在 Azure 服务开发者门户注册项目时指定的返回 URL 值的页面。下表列出了描述了 `IDLoginStatus`\
  \ 控件的参数。\n\n| LoginStatus 参数 | 描述 |\n| :--- | :--- |\n| ID | 必填。控件的唯一标识符（默认值 = `IDLoginStatus1`）。\
  \ |\n| ApplicationContext | 可选。包含状态字符串。 |\n| ApplicationID ConfigKey | 必填。指定 `wll_appid`\
  \ 名称的字符串。 |\n| ApplicationSecret ConfigKey | 必填。指定 `wll_secret` 名称的字符串。 |\n| AutomaticallyConvert\
  \ | 可选。设置为 `True` 以自动登录。 |\n\n下表列出了描述了 `LoginStatus` 属性。\n\n| LoginStatus 属性 | 描述\
  \ |\n| :--- | :--- |\n| Action | 包含三个值之一的字符串，指定用户执行的操作：登录时为 `Login`；注销时为 `Logout`；话过期时为\
  \ `Clear`。 |\n| ApplicationUserID | 用户的唯一标识字符串。 |\n| TimeStamp | 代表上次验证时间的整数（从 1970\
  \ 年 1 月 1 日起）。 |\n| LoggedInLiveID | 如果用户登录，则值为 true；否则值为 false。 |\n\n`IDLoginStatus`\
  \ 还会触发服务端和客户端事件。\n\n### IDLoginView 控件\n\n`IDLoginView` 控件 ([`bit.ly/Q3Cew`](http://bit.ly/Q3Cew),\
  \ [`msdn.microsoft.com/en-us/library/cc305086.aspx`](http://msdn.microsoft.com/en-us/library/cc305086.aspx))\
  \ 是启用 WLID 认证的另一种方案。它支持将 Windows Live ID 与 ASP.NET 成员配置关联，并提供了适用于匿名或登录用户的六种模板。\n\
  \n## 创建并测试初始 LiveIDCloudService\n\n为现有网站实现 WLID 认证包含五个基本步骤：\n\n1. 创建一个带有 Windows\
  \ Live Web Role 和 Default.aspx 页面、空 `WindowsLiveLogin.cs` 类以及空 `webauth_handler.aspx`\
  \ 页面的云服务。\n2. 从 WebAuth.sln 网站示例中复制代码到 Default.aspx、WindowsLiveLogin.cs 和 webauth_handler.aspx，将\
  \ Default.aspx 的 IFRAME 代码替换为 `LoginStatus` 控件，并使用默认 `wll_appid` 和 `wll_secret`\
  \ 值在开发织上进行测试。\n3. 使用 Azure 服务开发者门户向 WLID 服务注册 `http://localhost:81/webauth_handler.aspx`，将\
  \ `Res.Redirect(LoginPage)` 指令更改为现有的 Azure 托管服务着陆页（例如 `http://oakleaf.cloudapp.net`），并测试授权处理页面。\n\
  4. 将需要保护的页面及相关代码复制或移动到示例项目中，根据需要更改页面名称，并将 `Res.Redirect([`oakleaf.cloudapp.net`](http://oakleaf.cloudapp.net))`\
  \ 指令指向复制的页面（如果原始页面是 Default.aspx，则需要重命名）。此时，你的 Web 应用程序的原始着陆页是安全的，因此你可以将应用程序部署为生产托管服务。\n\
  \n以下章节提供了详细的逐步分说明，用以保护现有的 Azure 托管服务（oakleaf_host）。\n\n### 创建新的云服务和 Web Role\n\n\
  \n\n\n按照以下步骤创建示例 Web 及其空页面和类文件：\n\n1. 如果你之前还没有执行过，请下载并运行 `webauth-cs-1.2.msi` 或更高版本的文件，然后在\
  \ VS 2008+ 中打开 WebAuth 网站，以提供要粘贴到示例项目中的网页和类文件的代码。\n2. 创建一个新的 C# 空白云服务（Blank Cloud\
  \ Service）项目，并命名为 `LiveIDCloudService` 或类似的名称。\n3. 向项目添加一个新的 Windows Live Web 角色（Web\
  \ Role），并命名为 `LiveIDWebRole`；接受 `Default.aspx` 作为其网页名称。\n4. 向项目添加 `WindowsLiveLogin.cs`\
