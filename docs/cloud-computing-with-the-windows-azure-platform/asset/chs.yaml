  \ 数据库\n\nSQL Server 2008 Books Online 对 SQL Server 集成服务（SSIS，以前称为数据转换服务 DTS）描述如下：\n\
  \nMicrosoft Integration Services 是一个构建企业级数据集成和数据转换解决方案的平台。你使用集成服务通过复制或下载文件、响应事件发送电子邮件、更新数据仓库、清理和挖掘数据，以及管理\
  \ SQL Server 对象和数据来解决复杂的业务问题。包可以单独运行，也可以与其他包协同工作以满足复杂的业务需求。集成服务可以从各种源（如 XML 数据文件、平面文件和关系数据源）提取并转换数据，然后将数据加载到一个或多个目标。\n\
  \n集成服务包含了一系列丰富的内置任务和转换；用于构建包的工具；以及用于运行和管理包的集成服务程序。你可以使用图形化集成服务工具创建解决方案而无需编写任何代码；或者你可以对扩展的集成服务对象模型进行编程以编程创建包并编写自定义任务和其他包对象。\n\
  \nSSIS 是 SQL Azure 2009 年 8 月 CTP 中移动数据进入或出的两种方法之一，也是当时将数据从 SQL Azure 移动到本地数据库的实用方法。你无法从\
  \ SSMS [Express] 的对象资源管理器中启动脚本向导，因为 CTP 不支持 SQL Azure 连接到对象资源管理器。\n\nSSIS 是 SQL\
  \ Server 2008 开发版及更高版本的组件，不包含在 SQL Server 2008 Express 中。你可以从 [`bit.ly/150Zu5`](http://bit.ly/150Zu5)\
