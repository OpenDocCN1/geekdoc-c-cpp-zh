  />\n  <link rel=\"self\" href=\"https://oakleaf-sb.servicebus.windows.net/MyHttpQueue/!(queue)\"\
  />\n  <link rel=\"queuehead\" href=\"https://oakleaf-sb.servicebus.windows.net/MyHttpQueue/!(queue/head)\"\
  />\n  <link rel=\"queuecontrol\" href=\"https://oakleaf-sb.servicebus.windows.net/MyHttpQueue/!(queue/control)\"\
  />\n  <QueuePolicy xmlns=\"http://schemas.microsoft.com/ws/2007/08/connect\" xmlns:i=\"\
  http://www.w3.org/2001/XMLSchema-instance\">\n    <Discoverability>Public</Discoverability>\n\
  \    <ExpirationInstant>2009-05-26T22:33:25.1328918Z</ExpirationInstant>\n  </QueuePolicy>\n\
  </entry>\n```\n\n### HTTP 状态码\n\n| 代码 | 名称 | HTTP 状态描述 |\n| :--- | :--- | :--- |\n\
  | 400 | 错误请求 (Bad Request) | 策略格式错误或无效。 |\n| 403 | 禁止访问 (Forbidden) | 客户端未提供 X-MS-Identity-Token\
  \ 头部、提供的令牌（token）已不再可使用，或提供的身份无权在此位置创建队列。 |\n| 409 | 冲突 (Conflict) | 给定位置已存在不兼容策略的队列，或者该位置被路由器或\
  \ Service Bus 监听器占用。 |\n| 415 |不支持的媒体类型 (Unsupported Media Type) | 请求未携带所需的 content-type\
  \ 头部。 |\n| 500 | 内部服务器错误 (Internal Server Error) | Service Bus 服务内部条件的处理失败。 |\n\n\
  在本章中选择 `HttpQueueSample` 进行分析的原因之一是，Web 调试器（如 `Fiddler2`）能够捕获并显示客户端与服务之间的大部分或全部流量。\n\
  \n### 测试驱动 HttpQueueSample 解决方案\n\n`..\\HttpMessages\\C#35\\HttpQueueSample.sln`\
  \ 解决方案是 `\\Program Files\\.NET Services SDK (July 2009 CTP)\\Samples\\ServiceBus\\\
  ExploringFeatures\\Queues\\` 和 `\\WROX\\Azure\\Chapter11\\Queues` 文件夹六示例项目之一。根据\
  \ `Readme.htm` 文件：\n\n> 本示例演示了如何使用纯 HTTP 请求使用 Microsoft .NET Services Service Bus\
  \ 队列功能。\n\n此示例展示了一个简单的消息生产者（发送者）和两种类型的消息消费者，它们利用 Service Bus REST 协议来发现现有或创建新队列，并展示了如何向队列发送消息，以及通过破坏性读取和非破坏性读取（预览/锁定）从队列中检索消息。\n\
  \nService Bus 中的队列是自由格式的消息队列，可以接受、存储并允许检索除 `GET`（以及 `HEAD`）之外的任何 HTTP 方法的纯 HTTP\
  \ 请求消息。由于队列是提供发送者和接收者解耦的单向消息原语，因此 `GET` 对于队列来说没有意义，因为队列无法访问其承载的消息接收者的资源表示。\n\n`HttpQueueSample`\
  \ 解决方案由以下三个项目组成：\n\n*   **Sender (发送者)**：向用户请求 SB 解决方案名称和帐户密码，如果 `https://SolutionName.servicebus.windows.net/MyHttpQueue/`\
  \ 不存在则创建一个新队列，并允许用户输入文本消息入队。\n*   **Consumer (消费者)**：发现或创建 `MyHttpQueue` 队列并对其轮询消息进行破坏性读取，这会将消息出队列。\n\
  *   **PeekLockConsumer (预览锁定消费者)**：发现或创建 `MyHttpQueue` 队列并对其轮询消息；它会随机决定出队列消息还是对未解锁的消息加锁。\n\
  \n截至 2009 年 7 月 CTP，最大允许尺寸限制为 60KB。后续版本的消息大小预计取决于系统配置以及客户服务计划中可用元数据的影响。\n\n你可以按照任何顺序运行这三个项目。最常见的顺序是\
  \ `Sender` 然后是 `Consumer`，这会将入队的消息供 `Consumer` 读取。要执行此序列，请按照以下步骤操作：\n\n1. 在 VS 2008\
  \ SP1 或更高版本中打开 `\\WROX\\Azure\\Chapter11\\Queues\\HttpMessages\\C#35\\HttpQueueSample.sln`，并将\
  \ `Sender` 设置为启动项目并按 F5。\n2. 在解决方案资源管理器中右键点击 `Consumer` 项目，选择“调试”->“新建实例”以打开 Consumer\
  \ 窗口。\n3. `Sender` 控制台入队，输入简短消息并按回车。\n4. 观察你在步骤 4 中输入的消息出现在 Consumer 窗口的最后一行（见图\
  \ 1.2）。\n\n### 探索 HttpQueueSample 解决方案\n\n两个控制台项目都从 ACS 获取身份令牌，测试对象（队列或工作流）是否存在，创建消息对象并向队列或工作流发送消息。`Listing\
  \ 1-5` 显示了 `Sender` 项目中 `Main` 方法的代码。\n\n\n\n\n```csharp\n// Added: Inspect the\
  \ default QueuePolicy property values if set\nvar authorization = queuePolicy.Authorization;\n\
  var enqueueTimeout = queuePolicy.EnqueueTimeout;\nvar maxConcurrentReaders = queuePolicy.MaxConcurrentReaders;\n\
  var maxDequeueRetries = queuePolicy.MaxDequeueRetries;\nvar maxMessageAge = queuePolicy.MaxMessageAge;\n\
  var maxMessageSize = queuePolicy.MaxMessageSize;\nvar maxQueueCapacity = queuePolicy.MaxQueueCapacity;\n\
  var maxQueueLength = queuePolicy.MaxQueueLength;\nvar overflow = queuePolicy.Overflow;\n\
  var poisonMessageDrop = queuePolicy.PoisonMessageDrop;\nvar transportPolicy = queuePolicy.TransportProtection;\n\
  Console.WriteLine(\"Enter text to put into a queue message. Press [enter] to exit.\"\
  );\nstring input = Console.ReadLine();\nwhile (input != String.Empty)\n{\n    try\n\
  \    {\n        // Send message\n        HttpWebRequest sendRequest =\n        \
  \    HttpWebRequest.Create(queueUri) as\n            HttpWebRequest;\n        sendRequest.Method\
  \ = \"POST\";\n        sendRequest.Headers.Add(\"X-MS-Identity-Token\",\n      \
  \      token);\n        sendRequest.ContentType =\n            \"text/plain;charset=utf-8\"\
  ;\n        using (var sendStream =\n            sendRequest.GetStream())\n     \
  \   {\n            using (var writer = new StreamWriter(sendStream,\n          \
  \  Encoding.UTF8))\n            {\n                writer.Write(input);\n      \
  \          writer.Flush();\n            }\n        }\n    }\n    sendRequest.GetResponse().Close();\n\
  \    Console.WriteLine(\"Sent: {0}\", input);\n    }\n    catch (Exception e)\n\
  \    {\n        Console.WriteLine(\"Error: \" + e.Message);\n    }\n    input =\
  \ Console.ReadLine();\n}\n// Exit and leave the queue persisted for the consumer.\n\
  // GetAuthenticationToken() method\n// GetHttpQueue() method\n// GetParentUri()\
  \ method\n// HttpCreateQueue() method\n// SDK Utility methods\n```\n\n队列是 `QueuePolicy`\
  \ 的实例。下表列出了 `QueuePolicy` 类的成员及其默认值。默认值 `2,147,483,647` (`int32.MaxValue`) 代表无限值。\n\
  \n| 属性名称 | 说明 | 默认值 |\n| :--- | :--- | :--- |\n| Authorization | 获取或设置当前实例的授权策略。（继承自\
  \ `JunctionPolicy`）。 | 必需 |\n| Discoverability | 决定在什么情况下以及何时可以通过 Atom feed 发现节点。（继承自\
  \ `JunctionPolicy`） | Managers |\n| EnqueueTimeout | 获取或设置入队超时。 | 10 秒 |\n| ExpirationInstant\
  \ | 获取或设置过期时间点。（继承自 `JunctionPolicy`）。 | 24 小时后 |\n| MaxConcurrent-Readers | 获取或设置最大并发读取数。\
  \ | `2,147,483,647` |\n| MaxDequeueRetries | 获取或设置出队重试次数。 | `2,147,483,647` |\n\
  | MaxMessageAge | 获取或设置最大年龄。 | 10 分钟 |\n| MaxMessageSize | 获取或设置最大大小。（继承自 `JunctionPolicy`）。\
  \ | `61,440` |\n| MaxQueueCapacity | 获取或设置队列容量。 | `2,097,152` |\n| MaxQueueLength\
  \ | 获取或设置队列长度。 | `2,147,483,647` |\n| Overflow | 获取或设置溢出策略，指示当缓冲区达到容量并超时时的消息处理方式。\
  \ | `Incoming-Message` |\n| PoisonMessageDrop | 获取或设置毒消息丢弃端点。 | `null` |\n| TransportProtection\
  \ | 获取或设置传输保护类型。（继承自 `JunctionPolicy`）。 | AllPaths |\n\n只有通过代码显式设置的 `QueuePolicy`\
  \ 值才会出现在该实例的 Atom 发现 `<feed><entry>` 的 `<QueuePolicy>` 组中，如列表 1-6 所示。https://oakleaf-sb.servicebus.windows.net/feed\
  \ xmlns=\"http://www.w3.org/2005/Atom\"><title type=\"text\">Publicly Listed Services</title><subtitle\
  \ type=\"text\">This is the list of publicly-listed services currently available</subtitle><id>uuid:ff9bc499-19aa-4e4-a1da-d8c2af34ea;id=340</id><updated>2009-05-27T19:46:45Z</updated><generator>Microsoft®\
  \ .NET Services - Service Bus</generator><entry><id>uuid:ff9bc499-19aa-4e4-a1da-d8c2af34ea;id=341</id><title\
  \ type=\"text\">myhttpqueue</title><updated>2009-05-27T19:46:45Z</updated><link\
  \ rel=\"alternate\" href=\"https://oakleaf-sb.servicebus.windows.net/MyHttpQueue/\"\
  /><link rel=\"self\" href=\"https://oakleaf-sb.servicebus.windows.net/MyHttpQueue/(queue)\"\
  /><link rel=\"queuehead\" href=\"https://oakleaf-sb.servicebus.windows.net/MyHttpQueue/(queue/head)\"\
  /><link rel=\"queuecontrol\" href=\"https://oakleaf-sb.servicebus.windows.net/MyHttpQueue/(queue/control)\"\
  /><QueuePolicy xmlns=\"http://schemas.microsoft.com/ws/2007/08/connect\" xmlns:i=\"\
  http://www.w3.org/2001/XMLSchema-instance\"><Discoverability>Public</Discoverability><ExpirationInstant>2009-05-27T20:08:25.2308651Z</ExpirationInstant></QueuePolicy></entry></feed>`\n\
  \n`<link rel=\"alternate\">...` 链接指向队列的尾部，客户端在此提交消息，而 `<link rel=\"queuehead\">...>`\
  \ 指向从此处接收消息的头部。\n\n### 使用 Service Bus 路由器投递消息\n\n路由器将消息从一个或多个发布者转发到一个或多个订阅者，创建一个发布/订阅消息模型，并支持向所有订阅者的可选多播。发布者使用\
  \ `HTTP` 发送消息。\n\n\n\n\n*   `QueueSubscriber` 向用户请求 SB 解决方案名称和账户密码，如果 `https://SolutionName.servicebus.windows.net/MyHttpRouter/`\
  \ 不存在，则会创建一个新队列，并等待发布者将消息放入队列。`QueueSubscriber` 的 `Main()` 方法代码几乎与 Listing 11-5\
  \ 中的代码完全相同。\n*   `HttpPushSubscriber` 使用 `WS2007HttpRelayBinding` 在 SB 上创建一个唯一命、面向面向的\
  \ HTTPS Web 服务端点。该端点模拟可能已存在于 Azure Fabric 中的 SOAP 1.2 端点。推送订阅者端点并不要求使用 SB。\n\n路由器和队列架构非常相似；因此，`HttpRouter`\
  \ 的 `Publisher` 项目代码（在 Listing 11-7 中部分显示）与 `HttpQueueSample` 的 `Sender` 代码非常相似。`Router`\
  \ API 提供了 `RouterClient`、`RouterManagementClient`、`RouterPolicy`、`RouterSubscription`\
  \ 以及其他 `Router…` Helper 类；除了 `RouterSubscription` 外，所有类都有对应的 `Queue…` 类。\n\n###\
  \ Listing 11-7: HttpRouter.Publisher 项目的 Main() 方法代码\n\n```csharp\nnamespace  Microsoft.Samples.ServiceBus\n\
  {\n    using System;\n    using System.Linq;\n    using System.Net;\n    using System.ServiceModel.Syndication;\n\
  \    using System.Text;\n    using System.Xml;\n    using Microsoft.ServiceBus;\n\
  \    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            // Get solution name and service account password\n            Console.Write(“Your\
  \ Solution Name: ”);\n            string solutionName = Console.ReadLine();\n  \
  \          Console.Write(“Your Solution Password: ”);\n            string solutionPassword\
  \ = ReadPassword();\n            // Create the service URI based on the solution\
  \ name\n            Uri routerUri = ServiceBusEnvironment.\n                CreateServiceUri(“https”,\
  \ solutionName,\n                “/MyHttpRouter/”);\n            Uri subscriptionsUri;\n\
  \            Uri routerManageUri;\n            // Get the existing router or create\
  \ a new one\n            string token = HttpGetAuthenticationToken(solutionName,\n\
  \                solutionPassword);\n            RouterPolicy routerPolicy = HttpGetRouter(token,\
  \ routerUri,\n                out subscriptionsUri);\n            if (routerPolicy\
  \ == null)\n            {\n                // Create a new policy with an expiration\
  \ of 1 hour\n                routerPolicy = new RouterPolicy();\n              \
  \  routerPolicy.Expiration = DateTime.UtcNow +\n                    TimeSpan.Hours(1);\n\
  \                routerPolicy.MaxSubscribers = int.MaxValue;\n                routerPolicy.MessageDistribution\
  \ =\n                    MessagePolicy.AllSubscribers;\n                routerPolicy.TransportProtection\
  \ =\n                    TransportPolicy.None;\n                routerPolicy.Discoverability\
  \ =\n                    DiscoverabilityPolicy.Public;\n                routerManageUri\
  \ = HttpCreateRouter(token,\n                    routerUri,\n                  \
  \  routerPolicy);\n            }\n            Console.WriteLine(“Enter some text\
  \ to put into a message. Press [enter] to exit.”);\n            string input = Console.ReadLine();\n\
  \            while (input != String.Empty)\n            {\n                try\n\
  \                {\n                    // Send the message\n                  \
  \  HttpWebRequest sendRequest =\n                        HttpWebRequest.Create(routerUri+“status=”+\n\
  \                        Uri.EscapeDataString(input)) as HttpWebRequest;\n     \
  \               sendRequest.Method = “POST”;\n                    sendRequest.Headers.Add(“X-MS-Identity-Token”,\n\
  \                        token);\n                    sendRequest.ContentLength\
  \ = 0;\n                    sendRequest.GetResponse().Close();\n               \
  \     Console.WriteLine(“Sent: {0}”, input);\n                }\n              \
  \  catch (Exception e)\n                {\n                    Console.WriteLine(“Error:\
  \ ” + e.Message);\n                }\n                input = Console.ReadLine();\n\
  \            }\n            // Exit and leave the router alive until it expires\n\
  \            // HttpGetAuthenticationToken() method\n            // HttpGetRouter()\
  \ method\n            // GetParentUri() method\n            // HttpCreateRouter()\
  \ method\n            // ReadPassword() method\n        }\n    }\n}\n```\n\n注意 `RouterPolicy`\
  \ 实例显式设置了几个路由器特定的属性值（已重点标记），以及 `TransportProtection`，后者也是 QueuePolicy 的成员。`MessageDistributionPolicy.AllSubscribers`\
  \ 枚举指定了多播分发。\n\n运行 `HttpRouter.sln` 解决方案与运行 `HttpQueueSample.sln` 类似。按下 `F5` 生成解决方案并运行\
  \ `Publisher` 项目。输入消息后启动 `QueueSubscriber` 项目不会显示该消息，因为 `QueueSubscriber` 会创建监听器的队列。图\
  \ 11.4 显示了在打开 `QueueSubscriber` 窗口之前发送路由器消息 #1，以及之后发送路由器消息 #2 的结果。\n\n图 11.4 在打开\
  \ `QueueSubscriber` 控制台之前发送了路由器消息 #1；之后发送了路由器消息 #2。\n\n![11.4](img/c11f004.jpg)\n\
  \n正如你所预期的，`RouterPolicy` 的 HTTP POST 请求头和 Atom 格式负载（如 Listing 11-8 所示）与新的 `QueuePolicy`（参考\
  \ Listing 11-6）非常相似。\n\n\n\n\n图 11.5 显示 IE8 在运行 `Publisher` 和 `QueueSubscriber`\
  \ 项目后显示的 `https://oakleaf-sb.servicebus.windows.net/` Atom 馈。\n\n图 11.5 IE8 在运行\
  \ `HttpRouter` 解决方案的 `Publisher` 和 `QueueSubscriber` 项目后展示的 Atom 1.0 馈。\n\n![11.5](img/c11f005.jpg)\n\
  \n### 总结\n\n.NET Services 支持在 Azure Fabric 中以程序化方式持久化对象的三个功能：`.NET Workflow Service`\
  \ 以及 `.NET Service Bus` 的队列和路由器。.NET Services 还提供了 `.NET Services Portal` 页面来管理工作流类型和这些类型的实例；截至\
  \ 2009 年 3 月的 CTP 为止，队列和路由器还没有管理界面。\n\nWindows Azure 平台的 `Workflow Service` (WFS)\
  \ 页面对该服务的描述如下：“Workflow Service 是一个在云端运行工作流的大规模主机。它提供了一套针对发送、接收和处理 HTTP 以及 Service\
  \ Bus 消息而优化的活动；一套用于部署、管理和跟踪工作流实例执行情况的托管工具；以及一组管理 API。工作流 (WFs) 可以熟悉的 Visual Studio\
  \ 2008 工作流设计器来构建。”本章的电子版将演示如何创建和运行 WFS 解决方案，并分析代码和消息以使用工作流管理 API 创建工作流。\n\n当开发者开始测试\
  \ SB 时，显然需要另外两个功能来使 SB 适应 Windows Azure 环境：`Service Bus Queues` (SBQs) 用于持久化消息以进行异步交付，以及\
  \ `Service Bus Routers` (SBRs) 用于将消息路由到多个监听器甚至更多。路由器为来自选定发送者的消息实现了可组合的发布/订阅模型。订阅者可以添加队列以确保监听器临时离线时消息不会丢失。本章的后半部分通过\
  \ RESTful HTTP 消息演示了 SBQs 和 SBRs。.NET Services SDK 还安装了队列和路由示例解决方案，它们会将消息封装在 SOAP\
  \ 1.1/1.2 封中。\n\n## 第四部分\n\n### 使用 SQL Azure 服务（仅限在线）\n\n### 第 12 章：管理 SQL Azure\
  \ 账户和数据库\n\n### 第 13 章：利用 SQL Azure 数据库的关系特性\n\n## 第 12 章：管理 SQL Azure 账户和数据库\n\n\
  SQL Azure 是 SQL Server 团队对一组高度可扩展云服务的命名，这些服务基于自定义版本的 SQL Server 2008 以及相关服务，并托管在微软数据中心。SQL\
  \ Azure 旨在提供企业级数据中心的能力，而无需物理设施的资本成本、管理或维护的运营费用，以及服务器和数据库许可证费用。SQL Azure 通过将你的数据的共三个冗余副本复制到不同的物理服务器来实现高可用性。SQL\
  \ Azure 通过将数据分区为 10GB 或更小的数据库，在保持事务一致性的同时实现了可扩展性。\n\n当本章在 2010 年 1 月更新时，这些服务中的第一项——`SQL\
  \ Azure Database` (SADB) v1（一种可扩展且可用的关系型数据库）作为商业产品发布。最终，SQL Azure 将由以下服务组成：\n\n\
  * `SQL Azure Database` 提供核心 SQL Server 数据库能力（在 PDC 2009 发布）。\n* `Azure Data Sync`\
  \ 通过 `Microsoft Sync Framework` 实现云端本地 SQL Server 以及 SQL Azure 数据库的同步。第 13 章描述了\
  \ `Azure Data Sync`。\n* `Business Intelligence` (BI) 和 `Reporting Services` (RS)\
  \ 目前没有 CTP 或发布计划。\n\n本章重点关注创建 SQL Azure 账户、连接到 SADB v1 服务器，以及使用 `SQL Server Management\
  \ Studio` (SSMS) 2008 R2 2009 年 11 月 CTP [Express] 和 `sqlcmd` 工具创建用户数据库。本章是在 SADB\
  \ 发布到 Web (RTW) 并作为收取服务费用商业产品后编写的。当你连接到商业版本时，你在创建账户时指定的信用卡每月将 1GB 以内的数据库大小收取 9.99\
  \ 美元（Web 版），对于 10GB 的空间每月收取 99.99 美元（商业版），此外每 GB 数据进入收取 0.10 美元，每 GB 数据出站收取 0.15\
  \ 美元。\n\n微软提供了几种折扣服务计划，提供免费的 Windows Azure 计算和存储配额；具有不同数量数据库的 SADB 账户；以及数据进入、出站、Service\
  \ Bus 连接和访问控制事务。这些计划在 Windows Azure 定价信息页面（`http://bit.ly/1TeCsu`, `http://www.microsoft.com/windowsazure/offers/`）中说明。微软合作伙伴网络的注册成员可获得额外折扣，MSDN\
  \ Premium 订阅者可获得大多的免费配额。Azure 定价信息页面上的链接指向了关于这些额外福利的更多信息。\n\n\n\n\n\n最初的 SSDS 架构师选择了由一组层次化的\
  \ `Authority`、`Container` 和 `Entity`（`ACE`）对象实现的 `实体-属性-值`（`EAV`）数据模型，而不是传统的关系型数据模型，因为\
  \ `EAV` 数据库可以扩展到极大的规模，Google 的 `BigTable` 和 Yahoo 的 `Hadoop` 便是典型。这种方法的问题在于，潜在客户在尝试区分\
  \ SSDS 表与 `Azure Data Services` 提供的类似 EAV 表时会遇到困难。此外，Azure 营销团队极力推崇利用开发者在 `.NET`\
  \ 编程和 `Visual Studio` 方面的经验，减轻将传统的 `ASP.NET` 和基于 `.NET` 的服务从本地数据中心迁移到云端的负担。开发者及其管理层更感兴趣于利用他们的关系型数据库设计和\
  \ `Transact-SQL`（`T-SQL`）查询技能，而不是扩展性增加的潜力。架构师和开发者对 `EAV` 表的“最终一致性”属性也存在担忧，而非 `SQL\
  \ Server` 集群的即时、事务性更新一致性。\n\n2008 年 10 月 27 日，Ray Ozzie 宣布 Windows Azure 将成为微软新的平台即服务（`PaaS`）云计算竞争产品的名称。SSDS\
  \ 在 `PDC 2008` 上被重命名为 `SQL Data Services`（`SDS`）。\n\n微软的营销人员以仔细倾听用户（包括数百万开发者）并根据用户反馈采取行动而闻名。SSDS\
  \ 团队在大一年后终于意识到他们 `EAV` 方法的错误，并于 2009 年 3 月 10 日宣布了对 SSDS 计划的中途修正。同一天，本书的技术编辑 David\
  \ Robinson 在现的 SQL Azure 团队博客上发布了关于“新 `SDS` 特性的真实细节”的帖子（[`bit.ly/AW3Jm`](http://bit.ly/AW3Jm),\
  \ [`blogs.msdn.com/ssds/archive/2009/03/10/9469228.aspx`](http://blogs.msdn.com/ssds/archive/2009/03/10/9469228.aspx)）：\n\
  \n> 今天，我们公布了作为 `SDS` 一部分的加速交付核心关系型数据库功能的计划细节。在过去的几周里，关于 `SDS` 有相当大的讨论，能够更广泛地分享这些细节太棒了。\n\
  \n> 回想一年前的 `Mix 08`，Nigel Ellis 走台向社区介绍了 `SDS`，当时它是一个灵活的基于实体的云数据库，您可以使用标准的互联网协议进行访问。我们在发布此公告时承诺将带来更多关系型能力——事实它们也做到了。但我们从\
  \ `TAP` 合作伙伴和其他早期采用者那里收到的普遍反馈是，需要一种作为服务交付的关系型数据库。这是极具价值的反馈，并促使我们更积极地研究交付这些功能的方法。由于这些工作以及我们自此以后在产品团队取得的进展，我们宣布\
  \ `SDS` 将作为服务提供完整的关系型数据库能力。\n\n`SDS` 团队在 2009 年 7 月 9 日更改了名称并将服务重命名为 `SQL Azure`。\n\
  \n关于 `SDS` 从 `EAV` 变为关系型数据模型的更多细节，请参阅 2009 年 2 月 24 日的“SQL Data Services 的中途修正”([`bit.ly/85YOa`](http://bit.ly/85YOa),\
  \ [`oakleafblog.blogspot.com/2009/02/mid-course-correction-for-sql-data.html`](http://oakleafblog.blogspot.com/2009/02/mid-course-correction-for-sql-data.html))以及\
  \ 2009 年 3 月 10 日的“SQL Data Services 放弃 REST 改用 `TDS` API 并令我惊叹”([`bit.ly/gWgyB`](http://bit.ly/gWgyB),\
  \ [`oakleafblog.blogspot.com/2009/03/sql-data-services-abandons-rest-for-tds.html`](http://oakleafblog.blogspot.com/2009/03/sql-data-services-abandons-rest-for-tds.html))帖子。\n\
  \n## 审查当前的 SQL Azure 数据库文档和资源\n\nMSDN 的 `SQL Azure Database` 文档可在在线访问 [`bit.ly/12N3Mp`](http://bit.ly/12N3Mp),\
  \ [`msdn.microsoft.com/en-us/library/ee336279.aspx`](http://msdn.microsoft.com/en-us/library/ee336279.aspx)，包含以下章节：\n\
  \n*   “介绍 SQL Azure Database”\n*   “SQL Azure Database 概念”\n*   “开发者指南”\n*   “指南与局限性”\n\
  *   “Transact-SQL 参考”\n*   “SQL Azure Database 版权和法律信息”\n\n“Transact-SQL 参考”章节特别有用，因为它包含了受支持、部分支持和不支持的\
  \ `T-SQL` 保留字列表。\n\nWindows Azure 团队于 2009 年 12 月 23 日发布了 `Windows Azure Platform\
  \ Training Kit–December [2009] Update` 下载，地址为 [`bit.ly/3Nwdbn`](http://bit.ly/3Nwdbn),\
  \ [`www.microsoft.com/downloads/details.aspx?FamilyID=413E88F8-5966-4A83-B309`](http://www.microsoft.com/downloads/details.aspx?FamilyID=413E88F8-5966-4A83-B309)。该工具包提供了以\
  \ `.pptx` 或 `.docx` 格式的以下 SQL Azure 特有元素：\n\n*   什么是 SQL Azure？\n*   SQL Azure 简介\n\
  *   使用 SQL Azure 构建应用程序\n*   使用 SQL Azure 进行扩展扩展\n*   准备您的 SQL Azure 账户\n*   连接到\
  \ SQL Azure\n*   在 SQL Azure 中管理登录和安全\n*   在 SQL Azure 中创建对象\n*   将数据库架构迁移到 SQL\
  \ Azure\n*   使用 `SSIS` 将数据移入和移出 SQL Azure\n*   构建简单的 SQL Azure\n*   使用分片扩展 SQL Azure\n\
  *   上操实验室\n*   将应用程序迁移到 SQL Azure\n\n您可以在 [`bit.ly/ARC3N`](http://bit.ly/ARC3N),\
  \ [`social.msdn.com/forums/en-US/ssdsstarted/`](http://social.msdn.com/forums/en-US/ssdsstarted/)\
  \ 找到 SQL Azure 入门论坛。\n\n## 创建或升级 Windows Azure 和 SQL Azure 账户\n\nWindows Azure 团队将\
  \ 2010 年 1 月 4 日定为 Windows Azure、`SDS` 和 Azure AppFabric 的发布日，公告如下：\n\n*   Windows\
  \ Azure 博客 ([`bit.ly/6HsovV`](http://bit.ly/6HsovV), [`blogs.msdn.com/windowsazure/archive/2010/01/04/sign-up-for-a-windows-azure-platform-offer-today-and-get-visibility-into-your-usage.aspx`](http://blogs.msdn.com/windowsazure/archive/2010/01/04/sign-up-for-a-windows-azure-platform-offer-today-and-get-visibility-into-your-usage.aspx))\n\
  *   SQL Azure 博客 ([`bit.ly/61OS6H`](http://bit.ly/61OS6H), [`blogs.msdn.com/ssds/archive/2010/01/04/9943474.aspx`](http://blogs.msdn.com/ssds/archive/2010/01/04/9943474.aspx))\n\
  *   Windows Azure Platform AppFabric 博客 ([`bit.ly/6a9xuS`](http://bit.ly/6a9xuS),\
  \ [`blogs.msdn.com/netservices/archive/2010/01/04/announcing-windows-azure-platform-commercial-offer-availability-and-updated-appfabric-pricing.aspx`](http://blogs.msdn.com/netservices/archive/2010/01/04/announcing-windows-azure-platform-commercial-offer-availability-and-updated-appfabric-pricing.aspx))\n\
  \n以下步骤将使用 Windows Live ID 创建新的商业 Windows Azure、`SADB` 和 Azure AppFabric（原 `.NET\
  \ Services`）账户，或者如果您使用创建过免费 CTP 账户的 Live ID 账户，则会将该 CTP 账户及其项目升级为商业状态。\n\n\n\n\n\
  \n接下来的步骤和截图基于 OakLeaf 博客于 2010 年 1 月 5 日发布的“如何创建和激活新的 Windows Azure 和 SQL Azure\
  \ 账户或升级现有账户”文章（[`bit.ly/4riEfv`](http://bit.ly/4riEfv), [`oakleafblog.blogspot.com/2010/01/how-to-create-and-activate-introductory.html`](http://oakleafblog.blogspot.com/2010/01/how-to-create-and-activate-introductory.html)）。\n\
  \n1. 使用你的 Windows Live ID 登录 Windows Azure 开发门户的 SQL Azure 项目查看页面（[`bit.ly/4riEfv`](http://bit.ly/4riEfv),\
  \ [`sql.azure.com/ProjectViewer.aspx`](https://sql.azure.com/ProjectViewer.aspx))，并点击右上角的\
  \ `Billing`链接（参见图 12.1）以打开 Microsoft Online 服务门户 (MOCP) 落地页。\n\n图 12.1 SQL Azure\
  \ 项目查看页的 `Billing`链接。\n\n![12.1](img/c12f001.jpg)\n\n或者，直接浏览到 MOCP 落地页（[`bit.ly/nPKPg`](http://bit.ly/nPKPg),\
  \ [`mocp.microsoftonline.com/site/default.aspx`](https://mocp.microsoftonline.com/site/default.aspx)）并点击\
  \ `Continue` 打开入门页面（参见图 12.2）。\n\n图 12.2 Microsoft Online 服务客户门户的入门页面。\n\n![12.2](img/c12f002.jpg)\n\
  \n2. 如果你尚未登录，点击 `Sign In`链接并使用你的 Windows Live ID 登录。如果你正在创建一个新账户，必须完成联系信息、公司信息和服务使用地址表。\n\
  \n3. 点击 `Services`选项卡并点击 `Windows Azure Platform`链接（参见图 12.3）。\n\n图 12.3 用于应用 `Windows\
  \ Azure Platform`过滤器的 `Services`选项卡。\n\n4. 点击任何 `Rate Plan`链接以打开定价信息页（参见图 12.4）。\n\
  \n图 12.4 Windows/SQL Azure 四个定价信息页之一。\n\n![12.4](img/c12f004.jpg)\n\n5. 如果你不符合合作伙伴网络折扣或\
  \ MSDN Premium 特惠的条件，点击三个免费或付费账户之一的 `Buy`按钮，完成并跳转到第 8 步。\n\n（Windows Azure Platform\
  \ 入门优惠提供非常有限的计算小时和小型存储配额。两个付费计划需要同意六个月的有效期。）\n\n6. 如果你有 MSDN Premium 订阅，点击 `Special\
  \ Offers for MSDN Windows Azure Platform Benefits`链接打开 MSDN 订阅者 Windows Azure Platform\
  \ 权益页面（参见图 12.5）。\n\n图 12.5 此页解释了为 MSDN 订阅者提供的临时折扣。\n\n![12.5](img/c12f005.jpg)\n\
  \n7. 滚动到页面底部的网格，了解前八个月入门权益计划的详细信息，以及入门计划过期后三个级别的持续计划。\n\n8. 点击 `My Account`链接打开我的账户页面（参见图\
  \ 12.6）。\n\n图 12.6 `My Account`页面确认了你的 MSDN 订阅并提供了 Windows Azure Platform 链接。\n\n\
  ![12.6](img/c12f006.jpg)\n\n9. 点击 `Windows Azure Platform`链接打开 MOCP 订阅购物车页面，该页面已根据情况添加了\
  \ Windows Azure Platform MSDN 订阅详情——本例中为 MSDN Premium（参见图 12.7）。\n\n图 12.7 购物车页的账单信息窗显示了适用于你订阅级别的\
  \ MSDN 权益。\n\n![12.7](img/c12f007.jpg)\n\n10. 勾选框以确认你将为超出配额的使用付费。\n\n根据 Windows\
  \ Azure Platform 的一篇文章，当你达到配额的 75% 时，将通过 Windows Live ID 电子邮件通知你。点击 `Checkout`，提供信用卡数据并完成交易以打开确认订单页面（参见图\
  \ 12.8）。\n\n图 12.8 购物车页的账单信息总结了你的订阅。\n\n![12.8](img/c12f008.jpg)\n\n11. 点击 `Confirm\
  \ Order`打开需求页面，在需求列表中选择 `Activate`（参见图 12.9）。\n\n图 12.9 激活 MOCP 需求。\n\n![12.9](img/c12f009.jpg)\n\
  \n12. 如果你创建一个新账户，必须指定系统管理员名称、电子邮件和密码。点击 `Go`激活订阅并显示激活页面（参见图 12.10）。\n\n图 12.10 激活页面让你查看详情。\n\
  \n![12.10](img/c12f010.jpg)\n\n13. 点击 `Finish`完成激活过程。几分钟后，你将通过电子邮件收到确认消息（参见图 12.11）。\n\
  \n图 12.11 这样的消息确认了你的新账户。\n\n![12.11](img/c12f011.jpg)\n\n14. 点击开发者门户的 SQL Azure\
  \ 链接显示升级后的 SQL Azure 项目（参见图 12.12）。\n\n图 12.12 Windows 摘要页面包含你账户的链接。\n\n![12.12](img/c12f012.jpg)\n\
  \n15. 如果你使用不同的 Windows Live ID 开始新账户，接受使用条款打开 `Create Server`页面，输入系统管理员用户名和密码，再次输入密码，并在列表中选择微软数据中心以提供你的数据库（参见图\
  \ 12.13）。\n\n图 12.13 提供系统管理员凭据并为服务器选择数据中心。\n\n![12.13](img/c12f013.jpg)\n\n在本更新时，只有美国南部中部（德克萨斯州安东尼奥）、北欧（爱尔兰）和东南亚（新加坡）数据中心支持\
  \ SQL Azure 账户。预计 2010 年初更多微软数据中心将支持 SQL Azure。\n\n为了防止暴力破解攻击通过常用用户名（如 `SA`、`Admin`\
  \ 和 `Root`）成功，SQL Azure 禁止使用这些名称。\n\n18. 对于新账户，点击 `Create Server` 将新的 SQL Azure\
  \ 服务器添加到账户中。这可能需要几分钟才能完成并显示我的项目页面。\n\n\n\n\n19. 点击项目名称——在本例中为 OakLeaf Azure MSDN\
  \ Subscription——以打开服务器管理页面，该页面列出了所有已升级为商业状态的 CTP 数据库（如果有），以及支持单个服务器的账户主数据库（参见 图\
  \ 12.14）。\n\nSQL Azure 不会向你的账户收取主数据库的费用。图 12.14 所示的 AdventureWorksLT 数据库仅包含几个表。\n\
  \n图 12.14 升级现有的 SQL Azure CTP 项目将升级原始数据库。\n\n![12.14](img/c12f014.jpg)\n\n## 设置服务器防火墙\n\
  \nSQL Azure 服务器提供可自定义的防火墙，根据调用者的 IP 地址控制对服务器的 TCP/IP 访问。防火墙还允许或禁用 Windows Azure\
  \ 服务（如 Web 和 Worker 角色）对服务器的访问。\n\n要允许 Windows Azure 服务访问新的或升级的服务器，请点击 SQL Azure\
  \ 垂直标签打开服务器管理页面，点击其“防火墙设置”标签并勾选“允许 Microsoft 服务访问此服务器”复选框，这将添加一个默认 IP 地址范围从 `0.0.0.0`\
  \ 到 `0.0.0.0` 的 `MicrosoftServices` 规则。该规则允许任何微软托管的服务尝试连接到服务器（参见 图 12.15）。\n\n图\
  \ 12.15 勾选复选框可允许任何微软托管的服务尝试连接到 SQL Azure 服务器。\n\n![12.15](img/c12f015.jpg)\n\n要允许客户端应用程序尝试通过互联网连接到服务器，请点击“添加规则”按钮打开“添加防火墙规则”表单，然后输入规则名称和要接受的\
  \ IP 地址范围（参见 图 12.16）。\n\n添加防火墙规则表单包含了供参考的调用计算机 IP 地址。然而，互联网防火墙仅对具有固定 IP 地址的客户端有效。大多数互联网服务提供商（ISP）使用动态主机配置协议（DHCP）从分配的区块向客户端计算机分配\
  \ IP 地址。除非你知道 ISP 分配的 IP 地址范围，否则必须通过指定从 `0.0.0.0` 到 `255.255.255.255` 的范围来允许所有入站地址。\n\
  \n防火墙设置会缓存五分钟，因此更改可能不会立即生效。\n\n图 12.16 通过指定允许的 IP 地址范围，允许客户端应用程序尝试连接到 SQL Azure\
  \ 服务器。\n\n![12.16](img/c12f016.jpg)\n\n## 创建用户数据库\n\n在“我的项目”页面上，点击“项目名称”列中的项以打开服务器管理页面，该页面允许你向服务器添加或从服务器上删除数据库。点击“创建数据库”打开对话框，你可以为用户数据库命名（参见\
  \ 图 12.17）。\n\n服务器管理页面连接到所选服务器的默认主数据库。SQL Azure 为服务器分配兼容 DNS 的名称。SQL Azure 不允许数据库管理员或用户直接向\
  \ master 添加对象。\n\n图 12.17 SQL Azure Portal 用于添加或删除用户数据库的服务器管理页面。\n\n![12.17](img/c12f017.jpg)\n\
  \n输入用户数据库名称并点击“创建”以关闭对话框、将用户数据库添加到服务器，并在选择用户数据库时启用“删除数据库”按钮（参见 图 12.18）。\n\n图 12.18\
  \ SQL Azure Portal 在添加空的 Northwind 用户数据库后的服务器管理页面。\n\n![12.18](img/c12f018.jpg)\n\
  \n或者，你也可以在 SSMS 2008 R2 [Express] 中打开主数据库，并执行 `CREATE DATABASE DatabaseName` 或 `DROP\
  \ DATABASE DatabaseName` T-SQL 命令来创建或删除用户数据库。\n\n后文“使用 SSMS 2008 R2 [Express] 连接到\
  \ SADB 主和用户数据库”章节描述了具体操作。\n\n```\nCREATE DATABASE DatabaseName\nDROP DATABASE DatabaseName\n\
  ```\n\n\n\n\n\n### 4. SADB 不支持 T-SQL 的 `USE` 命令，因此它要求你指定要连接的数据库。因此，点击 `Options >>`\
  \ 按钮展开对话框。在 `Connect to Database`（连接到数据库）组合框中，接受 `<default>`，或输入 `master` 以连接 `master`\
  \ 数据库或现有用户数据库的名称，并勾选 `Encrypt Connection`（加密连接）复选框（参见图 12.22）。\n\nSADB 连接默认使用传输安全协议\
  \ (TLS) 进行加密，但勾选 `Encrypt Connection` 复选框将使你组织的数据安全审计员满意。\n\n### 5. 点击 `Connect`\
  \ 打开连接，并点击 `New Query` 打开查询编辑器面板。通过检查高亮的状态栏，验证你在上一步中指定的数据库是否处于激活状态。注意工具栏上的 `Available\
  \ Databases`（可用数据库）列表是禁用的。\n\n图 12.21 在标准的 `Connect to Server` 对话框中指定 SADB 登录参数。\n\
  \n![12.21](img/c12f021.jpg)\n\n图 12.22 为加密连接指定 SADB 数据库。\n\n![12.22](img/c12f022.jpg)\n\
  \n要对系统视图运行测试查询，请执行 `SELECT * FROM sys.all_objects` 命令（参见图 12.23）。\n\n为了节省资源消耗，SADB\
  \ 在在活动五分钟后自动关闭连接。要重新打开已关闭的连接，请点击 SQL 编辑器工具栏最左侧的 `Connect` 或 `Change Connection`\
  \ 按钮。\n\n图 12.23 状态栏标识连接的固定数据库名称。\n\n![12.23](img/c12f023.jpg)\n\n### 配置服务器防火墙\n\
  \nSQL Azure 将防火墙规则存储在 `master` 数据库的 `sys.firewall_rules` 系统视图中。你可以通过登录 SSMS 2008\
  \ R2 并将 `Connect to Database` 值设置为 `master`，同时执行 `SELECT * FROM sys.firewall_rules`\
  \ 查询来获取当前生效规则集的详细（参见图 12.24）。\n\n图 12.24 在 master 数据库上执行 T-SQL 查询以检索生效的防火墙规则。\n\n\
  ![12.24](img/c12f024.jpg)\n\nSQL Azure 提供了两个系统存储过程，用于按名称创建或更新和删除服务器规则：\n\n*   运行\
  \ `exec sp_set_firewall_rule N‘Allow Windows Azure’,‘0.0.0.0’,‘0.0.0.0’` 创建或更新命名规则。\n\
  *   运行 `exec sp_delete_firewall_rule N‘Allow Windows Azure’` 删除指定的命名规则。\n\n### 确定服务器使用情况\n\
  \n`sys.database_usage` 系统视图列出了你的数据库使用历史，包含时间（日期）、`sku`（Web 或 Business）和 `quantity`（正在使用的数据库数量）列。`sku`\
  \ 或 `quantity` 的每次更改都会添加新行（参见图 12.25）。\n\n图 12.25 从服务器的 master 数据库检索你的数据库使用历史。\n\
  \n![12.25](img/c12f025.jpg)\n\n### 使用 sqlcmd 工具配合 SADB\n\n`sqlcmd` 工具是 SSMS 的替代方案，允许你在命令行提示符下管理数据库连接。在\
  \ Windows 命令提示符处输入或粘贴带有有效服务器管理员凭据的以下指令，可以打开在本章之前创建的 SADB 服务器上运行的 Northwind 数据库连接：\n\
  \n```\nsqlcmd -S k8jv7gpmwb.database.windows.net -U rogerj@k8jv7gpmwb -P Pas$w0rd\
  \ -d Northwind\n```\n\n下表描述了常用的 `sqlcmd` 命令行参数：\n\n| 参数 | 说明 |\n| :--- | :--- |\n\
  | -? | 显示语法摘要 |\n| -S | 服务器（使用完整的 DNS 名称） |\n| -U | 以 login@servername 格式的服务器管理员名称（仅限名称）\
  \ |\n| -P | 服务器管理员密码 |\n| -d | 用户数据库名称（默认为 master） |\n| -i | 查询输入 (T-SQL) 文件路径\\\
  名称 |\n| -o | 查询输出文件路径 |\n\n|图 12.26 执行 `sqlcmd -?` 的结果 |\n\n|图 12.26 显示 `sqlcmd`\
  \ 的 Windows 命令提示符 |\n\n![12.26](img/c12f026.jpg)\n\n连接 SADB 后，使用 `sqlcmd` 执行批处理\
  \ T-SQL 语句。在顺序编号 #> 提示符处输入有效的 T-SQL 命令并按回车。输入 `GO` 并按回车执行命令。输入 `quit` 或 `exit` 关闭会话。[图\
  \ 12.27 使用 `sqlcmd` 在 Northwind 数据库中显示表列表 |\n\n![12.27](img/c12f027.jpg)\n\n###\
  \ SADB 与 SQL Server 2008 的比较\n\nSADB 数据库是虚拟对象，管理数据库、表、索引、调优、登录和角色，但不物理存储。SADB 处理数据复制；数据丢失后的还原是自动的。\n\
  \nSADB 阻止直接操作物理资源的语句和选项，例如 `RESOURCE GOVERNOR`、文件组引用以及某些服务器选项。尝试设置 `SET ANSI_NULLS\
  \ ON` 会产生错误消息（注：原文此处为 generate，根据语境应为不支持，即尝试设置 `SET ANSI_NULLS ON` 会产生错误消息）。\n\n\
  已弃的数据类型（如 `text`、`ntext` 和 `image`）不受支持，但你可以用 `varchar(max)`、`nvarchar(max)` 和 `varbinary(max)`\
  \ 替代它们。SADB 目前不允许使用 SQL Server 2008 的 `geography` 和 `geometry` 空间数据类型。如果你需要加密数据，必须在客户端进行加密；SADB\
  \ 不支持 SQL Server 2005 引入的列级或行级加密，或 SQL Server 2008 的透明数据加密 (TDE)。\n\nMSDN SQL Azure\
  \ 文档中的“Transact-SQL 参考”章节（[`bit.ly/15Ja0Q`](http://bit.ly/15Ja0Q), [`msdn.microsoft.com/en-us/library/ee336281.aspx`](http://msdn.microsoft.com/en-us/library/ee336281.aspx)）包含了支持、部分支持和不支持的\
  \ T-SQL 语句表格。\n\n### 总结\n\nSQL Azure Database 是 SQL Azure 的基本元素。SADB 在微软大多数新建的数据中心与\
  \ Windows Azure 平台一起运行，提供高扩展性和可用性的关系计算资源。SADB Web 版支持大小最大 1GB 的事务一致数据库；Business\
  \ 版限制为 10GB 或更小。\n\n\n\n\n\nCTP 版本需要从 Microsoft Connect 站点请求邀请以获得令牌，该令牌可以在 SQL Azure\
  \ 门户中免费兑换为具有多个数据库的单个服务器。商业版于 2010 年 1 月 4 日发布，需要提供信用卡以支付每月 9.99 美元（Web 版）或每月 99.99\
  \ 美元（商业版）的费用，此外每 GB 的入数据费用为 0.10 美元，每 GB 的出数据费用为 0.15 美元。MSDN Premium 订阅用户和愿意承诺六个月订阅的用户提供特殊价格优惠。\n\
  \nSADB 自动为每个服务器分配唯一的 DNS 地址。SQL Server Management Studio 2008 [Express] 和 `sqlcmd`\
  \ 命令行工具通过 `TCP` 协议在 `1433` 端口上，使用 SQL Server 传统的表格型数据流（Tabular Data Stream）格式通过加密传输连接到\
  \ SADB。使用 `TDS` 允许开发者仅通过更改连接字符串，即可将开发连接从本地 SQL Server 2005 或 2008 [Express] 实例切换到云端的\
  \ SADB 数据库。`SSMS 2008 R2 [Express]` 支持对 SQL Azure 数据库进行全功能管理。\n\n微软管理 SADB 的物理基础设施，如服务器实例、磁盘驱动器和文件以及备份和恢复操作，因此许多\
  \ `T-SQL DDL` 命令不受支持。然而，开发者对数据库、表、索引、调优、查询优化、登录、用户和角色具有完全控制权。SADB 不支持已弃和新的 SQL Server\
  \ 2008 空间数据类型，也不提供数据加密或压缩。\n\n# 第 13 章\n\n## 利用 SQL Azure 数据库的关系型特性\n\n云端关系型数据库管理系统（RDBMS）相对并不常见，因为很难实现\
  \ IT 部门的企业级扩展和可用性能力，这些传统的无模式实体-属性-值（EAV）数据存储（如 Google App Engine 的 datastore 和 Amazon\
  \ Web Services 的 SimpleDB）所期待。Google 提供了一种名为 `GQL` 的类 SQL 查询方言，Amazon 提供了一组 SimpleDB\
  \ API 调用来模拟简单的类 SQL `SELECT` 语句。这两种查询“语言”都无法达到 ANSI SQL 的能力，即为特定结构提供定制复杂的结果集并具有精确、可预测的组成。这些表也缺乏关系型\
  \ `INNER` 或 `OUTER JOIN` 的概念，但 App Engine 的 datastore 可以通过 `db.Key` 模拟多一关联，通过 `list(db.Key)`\
  \ 数据类型模拟一对多关联。\n\n2008 年 5 月 6 日发布在 OakLeaf Systems 博客上的“比较 Google App Engine、Amazon\
  \ SimpleDB 和 Microsoft SQL Server Data Services”文章（[`bit.ly/LtvxN`](http://bit.ly/LtvxN),\
  \ [`oakleafblog.blogspot.com/2008/04/comparing-google-app-engine-amazon.html`](http://oakleafblog.blogspot.com/2008/04/comparing-google-app-engine-amazon.html)）描述了当时这三种\
  \ EAV 数据存储在能力上的差异。SQL Server Data Services（在本书编写时更名为 SQL Data Services）将在微软于 2009\
  \ 年底发布 SQL Azure 作为商业产品时退役。\n\n在查询关系型或 EAV 云端表之前，你必须指定关系型模式或定义实体及其属性，并向表或实体集合中填充数据。大多数早期的云数据库或数据存储将基于本地数据库的模式，并包含至少少量的历史数据。无疑，与使用\
  \ EAV 表作为数据存储相比，在云端运行数据密集型应用程序使用 RDBMS 会更快、更简单。本章涵盖了将模式和数据从本地 SQL Server [Express]\
  \ 实例迁移到运行微软数据中心 Windows Azure Fabric 上的 SQL Azure 数据库 (SADB)，以及针对 SADB 执行 `DML`\
  \ 和 `DQL` 查询。\n\n在本章于 2009 年秋季时，从本地数据库迁移模式和数据到云端 SADB 本质上是一个手动过程。Windows Azure 宣传师\
  \ Steve Marx 在 2008 年 8 月 26 日的推文中表示：“自动部署到 Windows Azure 的 API 将在发布前到来”（[`bit.ly/TMzGE`](http://bit.ly/TMzGE),\
  \ [`twitter.com/smarx/status/3561513228`](https://twitter.com/smarx/status/3561513228)）。在本章于\
  \ 2010 年 2 月底更新时，用于将 SQL Server 2005+ 数据库迁移至或从 SQL Azure 的 API 尚未到达，但 SQL Server\
  \ 宣传师 George Huey 开发了一个 SQL Azure 迁移向应用程序，随后的“从本地 AdventureWorksLT2008 数据库迁移模式和数据到\
  \ SQL Azure”章节对其进行了描述。Microsoft Sync Framework 团队（[`bit.ly/arQOZJ`](http://bit.ly/arQOZJ),\
  \ [`msdn.microsoft.com/en-us/sync/default.aspx`](http://msdn.microsoft.com/en-us/sync/default.aspx)）开发了\
  \ SQL Azure Data Sync，并在 2009 年 11 月发布了针对 SQL Azure 的 Sync Framework Power Pack\
  \ CTP 版本（[`bit.ly/duYCXp`](http://bit.ly/duYCXp)）。Microsoft Sync Framework 博客（[`bit.ly/b8SurT`](http://bit.ly/b8SurT),\
  \ [`msdn.microsoft.com/en-us/sync/`](http://msdn.microsoft.com/en-us/sync/))）提供了使用\
  \ SQL Azure Data Sync 填充本地版本版本数据库的示例。OakLeaf 博客于 2010 年 1 月发布的“使用 SQL Data Sync\
  \ 同步本地和 SQL Azure 示例数据库”（[`bit.ly/4uhNeb`](http://bit.ly/4uhNeb), [`oakleafblog.blogspot.com/2010/01/synchronizing-on-premises-and-sql-azure.html`](http://oakleafblog.blogspot.com/2010/01/synchronizing-on-premises-and-sql-azure.html)）是一个详细的图教程。\n\
  \n## 创建并填充 SADB 数据库\n\n云数据库（无论使用关系型还是 EAV 模型）的一个主要问题是用现有的历史或参考数据填充。对于大型数据集，如临床研究数据、遗传信息、个人健康记录\
  \ (PHR)、电子医疗记录 (EMR) 以及用于商业智能 (BI) 应用的事务数据，这一问题尤为突出。\n\n通过广域网（WAN）向远程数据库添加行的速度受限于源文件或表到目标表之间的带宽。大多数大型组织在数据中心和互联网之间拥有多个\
  \ 1.544Mbps 数字信号 1 (DS1 或 T1) 或更连接；个人通常使用上传速度低于 T1 但下载速度快多的 DSL 或电缆连接。为了避免大表极长的上传（或下载）时间，亚马逊服务（AWS）提供了\
  \ AWS Import/Export 服务的版本，该服务依赖在源数据中心和亚马逊数据中心之间运输高速磁盘驱动器。\n\nAWS Import/Export 服务详情页（[`bit.ly/hKCp6`](http://bit.ly/hKCp6),\
  \ [`aws.amazon.com/importexport/`](http://aws.amazon.com/importexport/)）包含下表，显示了常用连接速度下传输\
  \ 1TB 表的时间：\n\n| 可用互联网连接 | 80% 网络利用率下传输 1TB 的理论最小日数 | 何时考虑 AWS Import/Export? |\n\
  | :--- | :--- | :--- |\n| T1 (1.544 Mbps) | 82 天 | 100GB 或更多 |\n| 10 Mbps | 13 天\
  \ | 600GB 或更多 |\n| T3 (44.736Mbps) | 3 天 | 2TB 或更多 |\n| 100 Mbps | 1 到 2 天 | 5TB\
  \ 或更多 |\n| 1,000 Mbps | 少于 1 天 | 60TB 或更多 |\n\n```\n\nAWS Import/Export 服务是传统“肉网络”（sneakernet）文件传输方法的的复杂扩展。在本章于\
  \ 2010 年 2 月底更新时，微软尚未提供类似的服务。\n\n\n\n\n\n在本书编写时，SQL Azure 数据库的最大大小为 10GB，但将大型源文件或表分片到多个数据库是一项常见做法。随后的“分表以克服数据库大小限制”章节描述了将大表划分为可管理单元的几种方法。SQL\
  \ Azure 团队成员已在会议现场非正式地向与者保证，未来版本的最大大小将增加到“几十 GB”。\n\n你可以预计，向 SADB 批量上传数据（使用通过 TCP\
  \ 端口 1433 的 SQL Server 传统表数据流 (TDS) 协议）对于相同的数据量会比 REST 或 SOAP 协议更快，因为后者的开销字符要大得多。微软于\
  \ 2009 年底启用使用批量拷贝过程 (BCP) 向 SQL Azure 上传数据。随后的“使用批量拷贝过程填充 SADB 表”章节简要描述了 SQL Azure\
  \ 迁移向如何利用 BCP 在 SQL Azure 和本地 SQL Server 数据库之间传输数据。\n\n## 使用 `instnwind.sql` 脚本在\
  \ SADB 中生成 Northwind 示例数据库\n\n自动创建 SQL Server 数据库架构的最常用方法是执行一个包含系列 T-SQL DDL 命令的脚本，以添加表、列、主键和外键约束、默认值、索引、触发器、视图、存储过程和其他数据库对象。如果复杂表的行数少于约\
  \ 1,000 行，则包含 `INSERT` 语句来填充脚本创建的空表，并测试它们与源数据的兼容性是切行的。\n\nSQL Server 2000 Northwind\
  \ 和 pubs 示例数据库下载包 ([`bit.ly/o7IAJ`](http://bit.ly/o7IAJ)) 中包含的 `instnwind.sql` 脚本为\
  \ Microsoft Access 的原始 Northwind 数据库生成表、关系、视图和存储过程，以及五个额外的表：`CustomerCustomerDemo`、`CustomerDemographics`、`EmployeeTerritories`、`Regions`\
  \ 和 `Territories`。\n\n## 使 `instnwind.sql` 符合 SADB T-SQL DDL 限制\n\n`/WROX/Azure/Chapter13`\
  \ 文件夹包含 `InstnwindFromNorthwind.sql`，这是 `instnwind.sql` 的版本，删除了额外的表，并进行了以下修改以适应\
  \ SADB 对 T-SQL DDL 语句的限制：\n\n* 删除了以 `USE Northwind` 结尾的 `USE master` 和 `CREATE DATABASE`\
  \ 命令，因为 SADB 不支持 T-SQL 的 `USE` 命令、文件名指令或其他相关的数据库级命令。你可以使用 SQL Azure 门户快速 `CREATE`\
  \ 和 `DROP` 数据库。\n* 删除了 `if exists()` 函数，因为 SADB 用 `sys.tables`、`sys.views`、`sys.procedures`\
  \ 和相关的系统表替换了 `sysobjects`。删除并创建数据库然后运行整个过程比修改每个函数更容易。更多关于语法差异，请参见随后的“更新使用 sysobjects\
  \ 参数的 IF EXISTS() 测试”章节。\n* 如第 12 节所述，`varchar(max)`、`nvarchar(max)` 和 `varbinary(max)`\
  \ 数据类型取代了 `text`、`ntext` 和 `image` 数据类型。\n* 没有此类索引的表必须添加聚集主键索引，因为 SADB 不支持堆表（heap）。所有原始\
  \ Northwind 表都有聚集主键索引。被删除的额外表具有显式的 `PRIMARY KEY NONCLUSTERED` 索引。\n\nSQL Azure “Transact-SQL\
  \ Reference (SQL Azure Database)”主题 ([`bit.ly/15Ja0Q`](http://bit.ly/15Ja0Q), [`msdn.microsoft.com/en-us/library/ee336281.aspx`](http://msdn.microsoft.com/en-us/library/ee336281.aspx))\
  \ 包含了定义支持、部分支持和不支持的 T-SQL 语句的章节。\n\n`InstnwindFromNorthwind.sql` 有 9,000 行，大小为 935KB；原始\
  \ `instnwind.sql` 脚本有 9,885 行，大小为 2.01MB。\n\n## 更新使用 sysobjects 参数的 IF EXISTS()\
  \ 测试\n\n针对 SQL Server 2000 的 `instnwind.sql` 对象存在性原始样式如下：\n\n```sql\nif exists (select\
  \ * from sysobjects where id = object_id('dbo.Order Details')\n    and sysstat &\
  \ 0xf = 3)\n    drop table \"dbo\".\"Order Details\"\n```\n\nSQL Server 2005 和 2008\
  \ 也能按预期执行此类命令。SADB 不识别 `sysobjects` 表，因此所需的语法如下：\n\n```sql\nIF EXISTS (SELECT *\
  \ FROM sys.tables WHERE name = 'Order Details'\n    AND type = 'U')\n    DROP TABLE\
  \ [Order Details]\n```\n\n`U` 是用户对象的代码，用于将其与系统对象区分。用视图、触发器、函数或过程替换表，并相应更改 `DROP`\
  \ 命令的参数。\n\n## 在 SSMS 中运行 `InstnwindFromNorthwind.sql`\n\n要在 SSMS 2008 [Express]\
  \ 中运行 `InstnwindFromNorthwind.sql`，请执行以下操作：\n\n1. 打开 SQL Azure 门户，选择你在第 12 节创建的项目，点击\
  \ `Manage` 链接打开服务器管理页面。\n2. 如果你在第 12 节创建了 Northwind 数据库并为其添加了任何对象，在 Database Name\
  \ 列表中选择 `Northwind`，点击 `Drop Database` 按钮并确认选择。\n3. 点击 `Create Database` 按钮，在 `Name\
  \ Your Database` 框中输入 `Northwind`，然后点击 `Create`。\n4. 打开 SSMS 2008 [Express]，如果出现\
  \ `Connect to Database` 对话框，点击 `Cancel`。\n5. 选择 `File ⇒ Open` (`Ctrl+O`)。\n6. 导航到\
  \ `/WROX/Azure/Chapter13` 并双击 `InstnwindFromNorthwind.sql` 将其显示在查询编辑器中。\n7. 在登录框中完成缺失的登录信息，验证文本框中指定了\
  \ `Northwind` 且勾选了 `Encrypt`（参见第 12 节的“使用 SSMS 连接到 SADB”）。\n8. 点击 `Connect`，确认虚假的\
  \ `NULL` 错误消息，并验证对象管理器中出现了 `dbo.Northwind`。\n9. 点击 `Execute` 运行脚本。\n\n\n\n\n\n2.\
  \ 点击 `AdventureWorks2008R2AZ.zip` 链接并接受 MS-PL 许可协议，下载并保存 `.zip` 文件（10.5MB）到你的 `\\\
  UserName\\Downloads` 文件夹。\n\n3. 将文件提取到默认的 `\\UserName\\Downloads\\AdventureWorks2008R2AZ`\
  \ 文件夹，以创建 `…\\AdventureWorks2008R2AZ\\DW` 和 `…\\AdventureWorks2008R2AZ \\LT` 子文件夹，这些文件夹包含了用于创建和填充数据库的\
