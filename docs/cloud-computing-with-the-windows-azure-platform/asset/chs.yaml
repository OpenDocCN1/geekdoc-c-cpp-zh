  \ 从对象解密值\n                    return EncryptDecrypt.Decrypt(getVar);\n         \
  \   else\n                // 获取明文值\n                return getVar;\n        else\n\
  \            return null;\n    }\n\n    // 设置处理处理器\n    public string setArg(string\
  \ setVar)\n    {\n        if (Regex.IsMatch(setVar, base4Regex))\n            return\
  \ setVar;\n        else\n            return EncryptDecrypt.Encrypt(setVar);\n  \
  \  }\n\n    private string contactName;\n    public string ContactName\n    {\n\
  \        get\n        {\n            return getArg(contactName);\n        }\n  \
  \      set\n        {\n            contactName = setArg(value);\n        }\n   \
  \ }\n\n    private string contactTitle;\n    public string ContactTitle\n    {\n\
  \        get\n        {\n            return getArg(contactTitle);\n        }\n \
  \       set\n        {\n            contactTitle = setArg(value);\n        }\n \
  \   }\n\n    private string address;\n    public string Address\n    {\n       \
  \ get\n        {\n            return getArg(address);\n        }\n        set\n\
  \        {\n            address = setArg(value);\n        }\n    }\n\n    private\
  \ string postalCode;\n    public string PostalCode\n    {\n        get\n       \
  \ {\n            return getArg(postalCode);\n        }\n        set\n        {\n\
  \            postalCode = setArg(value);\n        }\n    }\n\n    private string\
  \ phone;\n    public string Phone\n    {\n        get\n        {\n            return\
  \ getArg(phone);\n        }\n        set\n        {\n            phone = setArg(value);\n\
  \        }\n    }\n\n    private string fax;\n    public string Fax\n    {\n   \
  \     get\n        {\n            return getArg(fax);\n        }\n        set\n\
  \        {\n            fax = setArg(value);\n        }\n    }\n\n    // 非个人身份数据\n\
  \    public string City { get; set; }\n    public string Region { get; set; }\n\
  \    public string Country { get; set; }\n}\n```\n\n### 分析加密的性能\n\n正如你预期的，加密对表 CRUD\
  \ 操作产生了严重影响，尽管删除操作受影响较小。下表列出了在 Azure Fabric（生产环境）和 Developer Fabric 中，开启和不开启加密的情况下执行示例项目五个操作功能所需的时间（秒）。\n\
  \n使用 AES 的 128 位数据块大小进行加密会导致数据负载平均增加两个字节。Base64 编码每三个字节一组会增加四个字节负载；公式为 `Base64Bytes\
  \ = ((UTF8Bytes + 3 – (UTF8Bytes MOD 3)) / 3) × 4`。加密和解密数据的 CPU 周期对性能的损失影响远大于负载大小。你可以通过在计数实例时添加标志来防止解密和加密，从而提高\
  \ `Count` 操作的速度。\n\n![c05nt001.jpg](img/c05nt001.jpg)\n\n盐值（Salt values）会导致 LINQ\
  \ 约束中的编码字面量无法与加密列协作，因为盐会导致相同值进行两次加密产生不同的密文。对加密属性值执行 LINQ `orderby` 操作不会产生预期的项目顺序，因此无法进行范围搜索。微软表示计划在\
  \ Azure Tables v1 中引入二级索引，但在本书编写时尚未提供测试，二级索引的行为可能会受到加密的负面影响。\n\n### 分析加密\n\n你可以添加存储原始明文值的哈希属性，然后进行等值搜索。为了防止字典攻击，你可以添加基于哈希的消息认证码（HMAC）。`System.Security.Cryptography.HMAC`\
  \ 类拥有 `ComputeHash()` 和 `Create()` 成员。Azure 团队将二级索引定义为非主键属性。\n\n### 客户端加密与 SQL Server\
  \ 加密的对比\n\nSQL Server 2005 引入了列级和行级加密（称为单元加密），以及密钥管理。我在《Visual Studio Magazine》2005\
  \ 年 8 月期发表的“在 Yukon 中加密和解密”文章（[`bit.ly/OseDw`](http://bit.ly/OseDw), [`visualomagazine.com/features/article.php?editorialsid=1296`](http://visualomagazine.com/features/article.php?editorialsid=1296)）描述了\
  \ SQL Server 自包含加密的过程，并提供了一个可下载的项目 项目。加密列必须使用 `varbinary` 数据类型。\n\n列级加密操作对性能的影响不如客户端操作那样剧烈，但它们会干扰索引性能。加密列上的\
  \ T-SQL `WHERE` 和 `ORDER BY` 子句需要 HMAC，并表现出与 Azure Tables 的问题。哈希值列无法进行范围搜索。Laurentiu\
  \ Cristofor 在 2005 年 12 月的博客文章“SQL Server 2005：搜索加密数据”中（[`bit.ly/M16qG`](http://bit.ly/M16qG),\
  \ [`blogs.msdn.com/lcris/archive/2005/12/22/506931.aspx`](http://blogs.msdn.com/lcris/archive/2005/12/22/506931.aspx)）描述了这些以及关于单元加密的其他问题。\n\
  \nSQL Azure 团队在 2009 年 3 月 12 日针对“SDS 是否支持数据库加密、证书和密钥管理？”的问题回答如下：“数据库加密？最初不支持，但它在列表中，正如我们演示的那样——如果有足够的客户需求，这将是\
  \ v1 之后我们将添加的内容之一。”([`bit.ly/cTWjP`](http://bit.ly/cTWjP), [`blogs.msdn.com/ssds/archive/2009/03/12/9471765.aspx`](http://blogs.msdn.com/ssds/archive/2009/03/12/9471765.aspx))。\n\
  \n\n\n\n\n在编写此书时，微软正处于将 SDS 从一个使用实体-属性-值（EAV）数据模型的自定义版本 `SQL Server 2005` 升级为完全关系\
  \ `SQL Server 2008`。`SQL Server 2008` 增加了透明数据加密（`TDE`），它在 `SQL Server` 数据引擎和文件系统之间建立了一个加密层。相比单元级加密，`TDE`\
  \ 加密整个数据库（包括备份和日志文件）的主要优势在于它在文件和内存之间移动时进行页面级的加密解密，且不会增加数据大小。`TDE` 解决了哪些数据是个人身份信息（PII）哪些不是的问题；所有内容都是加密的。\n\
  \n`TDE` 的主要架构标准之一是能够在 `SQL Server 2008` 开发期间，以数据库管理员（DBA）最少的精力满足 PCI-DSS、SB 1386\
  \ 以及其他进程法律的要求。遗憾的是，SDS 将不支持 `TDE`。\n\n你可以通过“SQL Server 2008 企业版中的数据库加密”技术文章（[`bit.ly/3wcuXw`](http://bit.ly/3wcuXw),\
  \ [`msdn.microsoft.com/en-us/library/cc278098.aspx`](http://msdn.microsoft.com/en-us/library/cc278098.aspx)）、Laurentiu\
  \ Cristofor 在 2007 年 10 月发布的“SQL Server 2008: 透明数据加密功能——快速概述”博客文章（[`bit.ly/zf9Uk`](http://bit.ly/zf9Uk),\
  \ [`blogs.msdn.com/lcris/archive/2007/10/03/sql-server-2008-transparent-data-encryption-feature-a-quick-overview.aspx`](http://blogs.msdn.com/lcris/archive/2007/10/03/sql-server-2008-transparent-data-encryption-feature-a-quick-overview.aspx)）以及\
  \ Joe Yong 在 2008 年 1 月发布的“SQL Server 2008 TDE：你可以使用的加密！”博客文章（[`bit.ly/ACOKb`](http://bit.ly/ACOKb),\
  \ [`blog.scalabilityexperts.com/2008/01/08/93/`](http://blog.scalabilityexperts.com/2008/01/08/93/)）来了解更多关于\
  \ `TDE` 的信息。\n\n## 针对监管和行业标准的合规审计\n\nSOX 第 404 节要求“在公司最近财年年底，对发行人财务报告的内部控制结构和程序的有效性进行评估”。根据维基百科，美国证券交易委员会（SEC）的解释性指南要求“管理层和外部审计师负责在自上而下的风险评估的背景下进行他们的评估，这要求管理层的评估范围和收集的证据都基于风险”。正如早前的“萨班斯-奥克斯利法案”章节所述，管理层必须“[理解交易流程（包括\
  \ IT 方面），并足以识别可能产生错误陈述的点”。\n\n未报告违反保护受保护健康信息（PHI）中个人身份信息（PII）的 HIPAA 法规，或未能加密所有与信用卡交易相关的存储\
  \ PII，将极大增加执法行动的风险，这可能威胁到公司的财务稳定性。数据中心或网络中断导致对云端应用、存储或两者的访问被长时间中断，可能会导致严重的负面财务影响。保证财务报表准确性的管理层和独立审计师对错误陈述承担共同责任。公司目前的内部\
  \ IT 控制和程序可能满足针对本地应用和数据的 SOX “内部控制报告”的充分性要求。然而，管理层或独立审计师不太可能有权访问云服务提供商的设施和操作人员，以便对离线\
  \ IT 操作进行此类评估。\n\n## 审计标准第 70 号（SAS 70）\n\n美国注册公共会计师协会（ICPA）的《审计标准第 70 号：服务机构》（`SAS\
  \ 70`）——“信息技术对审计师在财务报表审计中考虑内部控制的影响”，要求独立财务审计师将信息技术作为整体内部控制的一部分。\n\n`SAS 70` I 类或\
  \ II 类规定了对服务机构（如云服务提供商）的检查，该检查代表该机构已对其提供的服务的控制目标和活动通过了深度审计。`SAS 70` 维基百科（[`en.wikipedia.org/wiki/SAS_70`](http://en.wikipedia.org/wiki/SAS_70））对两种\
  \ `SAS 70` 审计类型的定义如下：\n\n*   I 类服务审计师报告包含了服务审计师对服务机构已运行的控制描述的呈现公平性的意见，以及控制设计对于实现指定控制目标的适用性的意见。\n\
  *   II 类服务审计师报告包含了 I 类服务审计师报告中的包含信息，还包含了服务审计师对特定控制在审查期间内是否有效运行的意见。\n\nSOX 关于内部控制充分性的陈述为期为一年，因此需要\
  \ II 类报告。如果你有足够的筹码，你应该要求 `SAS 70` 审计说明 GLB、SOX、HIPAA 和 PCI-DSS 的合规范围，并描述服务公司如何建立控制目标以满足其提供的服务水平协议（SLAs）。\n\
  \n`SAS 70`（[httpwww.sas70.com/index2.htm](http://www.sas70.com/index2.htm)）是一个专注于\
  \ SAS 70 审计标准和第三方保证的网站。Frederick Green 的论文《遵守萨班斯-奥克斯利法案和 SAS 94：应用安全在内部控制中的关键作用》（[`bit.ly/AMVgr`](http://bit.ly/AMVgr),\
  \ [www.nysscpa.org/committees/emergingtech/sarbanes_act.htm](http://www.nysscpa.org/committees/emergingtech/sarbanes_act.htm)）解释了\
  \ SAS 94 如何与 SOX 相关。\n\n## ISO/IEC 27001:2005 标准\n\n`ISO/IEC 27001`（信息技术—安全技术—信息安全管理体系—要求）是信息安全管理体系（ISMS）的国际标准。根据\
  \ ISO 27001 网站（[www.27001.com](http://www.27001.com)）：\n\n*   一个符合 `ISO/IEC 27001`\
  \ 的系统将提供一种系统方法来确保企业信息的可用性、机性和完整性。通过识别和应对组织信息资产的所有潜在风险来实施控制。\n*   该标准借鉴了来自 40 多个国家的各类大型组织信息安全从业人员的专业知识和经验，建立了信息安全的最佳实践。并日益被企业用于证明监管合性和有效的业务风险管理，同时帮助他们为所有新和新兴的法规做好准备和定位。\n\
  *   通过 `ISO/IEC 27001`认证的 ISMS 将确保你符合所有相关法律，包括适用的 HIPAA、GLBA、SB 1386 以及其他州数据泄露法、PIPEDA、FISMA、欧盟安全港法规等。\n\
  *   通过 `ISO/IEC 27001`认证的 ISMS 将确保你建立了成功的 SOX s404 报告所依赖的通用控制环境。\n\n`ISO/IEC 27001:2005`\
  \ 意在与 `ISO/IEC 27002:2005`（信息技术—安全技术—信息安全管理规范）结合使用，后者曾被确定为 `ISO/IEC 17799`。`ISO/IEC\
  \ 27002:2005` 列出了安全控制目标并推荐了一系列特定的安全控制措施。\n\n\n\n\n\n微软全球基础服务业务与风险管理部门总经理 Charlie\
  \ McNerney 于 2009 年 5 月 27 日在全球基础服务团队博客上发布了《保障微软云基础设施》（[`bit.ly/VeAWD`](http://bit.ly/VeAWD),\
  \ [`blogs.technet.com/gfs/archive/2009/05/27/securing-microsoft-s-cloud-infrastructure.aspx`](http://blogs.technet.com/gfs/archive/2009/05/27/securing-microsoft-s-cloud-infrastructure.aspx)）。该文章宣布了\
  \ 2009 年 5 月出版的《保障微软云基础设施》白皮书（[`bit.ly/18TKFy`](http://bit.ly/18TKFy), [www.globalfoundationservices.com/security/documents/SecuringtheMSCloudMay09.pdf](http://www.globalfoundationservices.com/security/documents/SecuringtheMSCloudMay09.pdf)）以及“独立的第三方验证……确保微软云基础设施获得了\
  \ SAS 70 Type I 和 Type II 证明以及 ISO/IEC 27001:2005 认证”。\n\n尽管 McNerney 写道：“我们自豪成为首批获得基础设施\
  \ ISO 27001 认证的大型在线服务提供商之一”，但在本书编写时，搜索其他云厂商声称其 PaaS 或 IaaS 服务获得 ISO/IEC 27001 认证的声明，并未返回任何匹配结果。\n\
  \n## 服务水平协议与业务中断风险\n\n章节开头附近的“数据可用性最大化和安全风险最小化”主题简要地描述了典型的 SLA。对于提供计算、网络和存储服务的异地\
  \ IT 提供商来说，SLA 是必不可少的。在本书编写时，对于云计算用户而言，要获得业务中断风险的覆盖是非常困难的。随着云计算成为一种被认可的业务实践，且精算师能够预测各种时长的服务商停机概率，由于意外保险公司无疑将竞争提供业务中断的保障。\n\
  \n### 总结\n\n从本地数据中心迁移到云计算和数据存储服务（例如由 `Windows Azure Platform` 提供的服务），需要大量的前期分析，这已经超出了传统的应用程序开发和数据库管理的领域。由于对数据安全和完整性的担忧，高级管理层和\
  \ IT 人员可能会成为将选择性计算和数据存储操作移出本地的主要障碍。由微软、亚马逊和谷歌等具有主要互联网影响力的组织运营的数据中心，其安全性可能与潜在的企业级客户数据中心相当，甚至更高。\n\
  \n政府机构和既有公司的共同目标是规避风险；因此，政府机构对云计算的兴趣以及最终的采用，将验证私营部门利用云服务的决策。NIST 的信息技术实验室处于开发面向联邦机构云计算标准的最前沿。由\
  \ NIST 开发的标准可能会成为未来行业规范的基准。\n\n《GLB 法案》和《HIPAA 法》包含了保护美国居民非公开信息和个人身份信息的联邦法规；加利州的\
  \ `SB 1386` 要求在发生未经授权访问加州居民的 PII（个人身份信息）时进行通知。`PCI-DSS` 规定了结合卡片 ID 号最小化信用卡和借记卡持卡人\
  \ PII 暴露风险的程序。SOX 法案要求实施内部控制以减少财务风险的错误陈述；违反任何政府法规或 `PCI-DSS` 标准无疑意味着财务危险，而管理层或独立审计师在发布年度\
  \ SOX 合规报告时可能对这些危险无所知。\n\n数据在互联网上传输时泄露风险最大。带有 SSL 或 TLS 加密的安全 `HTTPS` 协议已证明在互联网上进行个人银业务和信用卡购买操作是安全的。对于\
  \ Azure 托管服务，通过使用 Visual Studio 的 `MakeCert.exe` 命令行工具和 IE 8 的证书对话框，可以很容易实现 `HTTPS`。在数据中心内部或之间的数据服务启用\
  \ `HTTPS` 只需更改项目 `ServiceConfiguration.cscfg` 文件中的几个字符。\n\n章节的 `AzureTableTestHarness.sln`\
  \ 示例应用程序演示了使用 .NET 3.5 的 `AesManaged` 加密提供程序类对 Azure 表中的 PII 进行客户端侧对称加密和解密的技术。对\
  \ Northwind Customers 表中的 `CompanyName`、`ContactName`、`ContactTitle`、`Address`、`PostalCode`、`Phone`\
  \ 和 `Fax` 等属性进行 PII 加密并不涉及大量的额外代码，但它会对大多数 CRUD 操作造成大规模的性能损失。\n\n如果 Azure 团队能够在 `SQL\
  \ Azure Database v1` 中实现 SQL Server 2005 的服务器端单元级加密，你将能够以更少的开发和测试时间以及更好的性能实现针对 HIPAA、`PCI-DSS`\
  \ 和 `SB 1386` 合规的 PII 加密解密。SQL Server 2008 透明数据加密的可用性将通过在线加密和解密整个数据库，使合规变得更加简单。\n\
  \n微软似乎是第一个由独立审计师提供 SAS 70 证明和 ISO/IEC 27001:2005 认证的 PaaS 商。这些审计至少在某种程度上补偿了微软进入云计算服务市场的后期劣势。\n\
  \n## 第 6 章：对服务用户进行身份验证和授权\n\n第 4 章“扩展 Azure 表和 Blob 存储”以及第 5 章“迁移到 Azure 云服务时风险最小化”中的示例项目页面供任何知道云服务名称的人使用；它们完全不需要用户验证或基于角色的授权。很少有现实服务允许公共访问。至少它们会要求生产用户作为一个或多个角色（如用户、读者、写入者、主管或管理员）的成员登录。运行在\
  \ Windows Azure 上的 WebRole 的安全访问常用方法是使用针对云基础设施定制的 ASP.NET Membership 服务实现。\n\n全规模实现\
  \ ASP.NET Membership 服务和角色管理的替代方案是基本的 Windows Live ID (WLID) 身份验证。2009 年 5 月对 Azure\
  \ 服务开发门户的更新简化了 WLID 验证，通过为您创建每个托管服务项目自动添加 Live Services 项目。Windows Live ID Web 验证\
  \ SDK 1.2 和适用于 Visual Studio 2008 的 Windows Live 工具提供了示例代码和 ASP.NET 控件，用于 Azure\
  \ 项目的 WLID 验证。\n\n### 利用 ASP.NET Membership 服务\n\n“Membership 简介”在线帮助主题描述了一套预构建的验证凭据设施，这些设施存储在\
  \ SQL Server [Express] 表中，用于访问网站。ASP.NET Membership 服务能够：\n\n*   创建新用户和密码。\n*  \
  \ 存储成员信息（用户名、密码和支持数据）。默认情况下成员使用 SQL Server，但可以适应 Active Directory 或其他数据存储。\n*  \
  \ 更改和重置密码。\n*   向应用程序识别已身份验证的用户。\n\n\n\n\n\n你可以在 ASP.NET 安全论坛（[`forums.asp.net/25.aspx`](http://forums.asp.net/25.aspx)）查看并发布关于成员的问答。\n\
  \n## ASP.NET 登录控件\n\n以下 ASP.NET 登录控件允许你创建一个完整的身份验证系统，且只需要少量代码：\n\n* `ChangePassword`\
  \ 允许用户通过提供原始密码来更改密码，然后创建并确认新密码。\n* `CreateUserWizard` 控件从新用户处收集用户名、密码、确认密码、电子邮件别名、安全问题和安全问题答案信息。默认情况下，该向导会将新用户添加到系统。\n\
  * `Login` 包含用于输入用户名和密码的文本框，以及一个复选框，该复选框允许用户使用 ASP.NET 成员身份存储其身份，以便在下次启动服务时进行自动身份验证。\n\
  * `LoginStatus` 为未身份验证的用户显示登录链接，为已验证的用户显示注销链接。\n* `LoginName` 如果用户使用 ASP.NET 成员身份或带有\
  \ Windows 身份验证的 Windows 帐户登录，则显示用户的登录名。\n* `LoginView` 允许你通过自定义的 `AnonymousTemplate`\
  \ 或 `LoggedInTemplate` 向匿名用户和登录用户显示不同的信息。\n* `PasswordRecovery` 允许用户通过向其创建账户时使用的电子邮件地址发送消息来找回密码。\n\
  \n# 用户角色和个人资文件管理\n\n你可以将 ASP.NET 成员服务与 ASP.NET 角色管理服务集成，以对已验证的用户进行授权。在线帮助主题“使用角色对授权进行管理”（[`bit.ly/12DSA6`](http://bit.ly/12DSA6),\
  \ [`msdn.microsoft.com/en-us/library/9ab2fxh0.aspx`](http://msdn.microsoft.com/en-us/library/9ab2fxh0.aspx)）描述了如何利用\
  \ ASP.NET 角色管理功能。默认的角色提供程序存储是 SQL Server。\n\n同样，你可以将 ASP.NET 成员服务与用户配置文件集成，以实现针对单个用户的应用程序特定自定义。在线帮助主题“ASP.NET\
  \ 配置文件属性概览”（[`bit.ly/FkAby`](http://bit.ly/FkAby), [`msdn.microsoft.com/en-us/library/2y3fs9xs.aspx`](http://msdn.microsoft.com/en-us/library/2y3fs9xs.aspx)）描述了如何集成用户的配置文件。\n\
  \n`..\\..\\AspProvider` 文件夹包含一个 ASP.NET 提供程序示例：Windows Azure ASP.NET 提供程序页面（`providers-extended-readme.mht`），解释了\
  \ Windows Azure 和 SQL Server 成员提供程序之间的差异。\n\n# 将 ASP.NET 身份验证和角色管理适配 Windows Azure\
  \ Web Role\n\n在 Windows Azure 数据中心部署你的 Web Role 可以在 Azure 数据服务或 SADB 表中存储用户数据。在创建新的托管服务时，创建或指定\
  \ Azure Blob、表和队列存储服务是常见做法，因此 Azure 存储服务是首选默认。如果你利用地理服务，多个托管服务实例的表和 blob 可以轻松访问存储在相同或不同数据中心的存储服务中的相同角色和配置文件数据。\n\
  \n负载均衡可能会导致来自单个用户的 HTTP 请求转发到一个或多个数据中心的不同机器。因此，会话状态提供程序必须将会话数据保留在单个的可复制会话 blob 中，以确保用户在整个会话期间会话状态的一致。\n\
  \nWindows Azure SDK 包含两个与成员相关的示例项目：`AspProviders.sln`（包含 `ASPProviders.dll` 和 `StorageClient.dll`\
  \ 类库）以及 `AspProvidersDemo.sln`（添加了 `AspProvidersDemo` 和 `AspProvidersDemo_WebRole`\
  \ 项目以演示如何向 Web Role 中添加成员服务）。\n\n`\\Program Files\\Windows Azure SDK\\v1.0\\Samples.zip`\
  \ 文件包含 11 个示例项目，演示了许多高级 Windows Azure 平台功能。后续章节假设你将文件提取到未受保护的位置 `C:\\Azure Samples`。\n\
  \n# 在本地运行 Windows Azure SDK 的 AspProvidersDemo 服务\n\n要首次构建并运行 `AspProvidersDemo.sln`\
  \ 项目，请执行 `buildme.cmd` 和 `runme.cmd` 以打开 `Default.aspx` 页面，如图图 6.1 所示。\n\n图 6.1\
  \ `AspProvidersDemo` 服务的默认页面，列出了六个可用页面。\n\n![6.1](img/c06f001.jpg)\n\n点击标题中的 `Login`\
  \ 链接或页面列表中的第一项，将显示图图 6.2 所示的消息。\n\n图 6.2 当你开始使用该表单但尚未为本地存储创建项目数据库时，会出现此消息。\n\n![6.2](img/c06f002.jpg)\n\
  \n点击 OK 将消此此消息，创建 `AspProvidersDemoDB` 数据库并打开 `Login` 页面（参见图 6.3）。\n\n图 6.3 如果你在此步骤或后续步骤遇到错误，请右键点击解决方案中的\
  \ `AspProvider` 并选择 `Create Tables` 以创建存储。\n\n图 6.3 `AspProvidersDemo` 服务，用于已注册和未注册用户。\n\
  \n![6.3](img/c06f003.jpg)\n\n点击 `Create User` 链接打开 `CreateNew.aspx` 页面，并为 `CreateWizard`\
  \ 表单添加所有必要字段。与大多数身份验证系统不同，用户名是区分大小写的。密码和问题的答案在表中经过了哈希加密。\n\n图 6.4 在 `Membership`\
  \ 表中添加新用户。\n\n![6.4](img/c06f004.jpg)\n\n点击 `Create User` 进入下一步，该步骤提供了三个内置角色：`Countrymen`、`Family`\
  \ 和 `Friends`。选择其中一个内置角色并点击 `Finish`，将成员添加到 `Members` 和 `Roles` 表中并返回到 `Default.aspx`\
  \ 页面。`AspProvidersDemo` 在 `AssignUserToRoles` 步骤中允许添加但不删除用户的角色。\n\n图 6.5 在注册过程中为新用户添加角色。\n\
  \n![6.5](img/c06f005.jpg)\n\n在 `ManageRoles.aspx` 页面上你可以新角色但不删除角色。对于本章的示例项目，添加 `DbAdmin`、`DbReader`\
  \ 和 `DbWriter` 角色，它们将对应于 SQL Server 的内置 `db_owner`、`db_datareader` 和 `db_datawriter`\
  \ 数据库角色（参见图 6.6）。\n\n图 6.6 为三个默认角色添加三个数据相关角色。\n\n![6.6](img/c06f006.jpg)\n\n# 与\
  \ AspProvidersDB 数据库的操作\n\n删除不需要的角色（如 `Countrymen`、`Family` 和 `Friends`）的最简单方法是在\
  \ SQL Server Management Studio [Express] 中打开 `AspProvidersDB` 数据库。数据库包含三个用户表：`dbo.Membership`、`dbo.Roles`\
  \ 和 `dbo.Sessions`，如图图 6.7 所示。每个表在 `PartitionKey` 和 `RowKey` 列上都有聚集复合索引。\n\n尽管 `Membership`\
  \ 和 `Roles` 表的 `UserName` 值与 `Membership` 或 `Sessions` 表的 `BlobName` 值之间存在明显的关系，但默认情况下数据库不会强制执行引用完整性约束。\n\
  \n图 6.7 Membership、Roles 和 Sessions 表的数据库图。\n\n![6.7](img/c06f007.jpg)\n\n要移除上一节中提到的\
  \ `Countrymen`、`Family` 和 `Friends` 角色以及你添加的初始用户，请执行以下操作：\n\n\n\n\n\n1. 右键点击对象资源管理器中的\
  \ `Roles` 节点并选择 `Open Table`（打开表）以显示包含六个角色的数据表。选择 `Countrymen`、`Family` 和 `Friends`\
  \ 行并删除它们。\n\n2. 右键点击对象资源管理器中的 `Members` 节点，选择 `Open Table`（打开表），记录 `UserID` 唯一标识符以及加密的\
  \ `Password`、`PasswordSalt` 和 `PasswordAnswer` 单元格，然后删除你在上一节中添加的用户。\n\n3. 对你的管理账户重复上一节的操作，但在最后一步添加\
  \ `DbAdmin`、`DbReader` 和 `DbWriter` 角色。\n\n## 在 Web.config 文件中探索 Azure 特定成员元素和属性\n\
  \n`AspProviderDemo_WebRole` 项目的 `Web.config` 文件在 `<system.web>` 节下包含几个组，其具有特定于 ASP.NET\
  \ Web 云服务项目的默认属性值。\n\n### 成员程序节\n\n`Listing 6-1` 显示了 `<membership>` 节，并重点突出了云服务特定的属性值：\n\
  \n`Listing 6-1:` web.config 文件中 `<membership>` 节的默认元素和属性值\n\n```xml\n<system.web>\n\
  \  <membership defaultProvider=\"TableStorageMembershipProvider\"\n      userIsOnlineTimeWindow\
  \ = \"20\">\n    <providers>\n      <clear/>\n      <add name=\"TableStorageMembershipProvider\"\
  \n        type=\"Microsoft.Samples.ServiceHosting.AspProviders._\n          TableStorageMembershipProvider\"\
  \n        description=\"Membership provider using table storage\"\n        applicationName=\"\
  AspProvidersDemo\"\n        enablePasswordRetrieval=\"false\"\n        enablePasswordReset=\"\
  true\"\n        requiresQuestionAndAnswer=\"false\"\n        minRequiredPasswordLength=\"\
  1\"\n        minRequiredNonalphanumericCharacters=\"0\"\n        requiresUniqueEmail=\"\
  true\"\n        passwordFormat=\"Hashed\"\n      />\n    </providers>\n  </membership>\n\
  </system.web>\n```\n\n延续行字符表示超过等宽行上可打印字符数量的属性值。\n\n`userIsOnlineTimeWindow` 的值是在\
  \ `LastActivityDateUtc` 时间戳值之后，用户被认为在线状态的分钟数。\n\n`minRequiredPasswordLength` 的默认值\
  \ `1` 显然是不合适的，应该被设置为 `6` 到 `8` 之间的值。\n\n### 角色管理器、配置文件和其他话状态节\n\n角色管理器、配置文件和会话存储在理论上是可选的，但大多数项目至少需要\
  \ `<roleManager>` 和 `<sessionState>` 节（参见 `Listing 6-2`）。\n\n`Listing 6-2:` web.config\
  \ 文件中 `<roleManager>`、`<profile>` 和 `<sessionState>` 节的默认元素和属性值\n\n```xml\n<system.web>\n\
  \  <roleManager enabled=\"true\" defaultProvider=\"TableStorageRoleProvider\"\n\
  \      cacheRolesInCookie=\"true\" cookieName=\".ASPLES\" cookieTimeout=\"30\"\n\
  \      cookiePath=\"\" cookieSSL=\"false\" SlidingExpiration = \"true\"\n      cookieProtection=\"\
  All\">\n    <providers>\n      <clear/>\n      <add name=\"TableStorageRoleProvider\"\
  \n        type=\"Microsoft.Samples.ServiceHosting.AspProviders._\n          TableStorageRoleProvider\"\
  \n        description=\"Role provider using table storage\"\n        applicationName=\"\
  AspProvidersDemo\"\n      />\n    </providers>\n  </roleManager>\n  <profile enabled=\"\
  true\" defaultProvider=\"TableStorageProfileProvider\"\n      inherits=\"UserProfile\"\
  >\n    <providers>\n      <clear/>\n      <add name=\"TableStorageProfileProvider\"\
  \n        type=\"Microsoft.Samples.ServiceHosting.AspProviders._\n          TableStorageProfileProvider\"\
  \n        description=\"Profile provider using structured storage\"\n        applicationName=\"\
  AspProvidersDemo\"\n      />\n    </providers>\n    <properties>\n      <add name=\"\
  Country\" type=\"string\"/>\n      <add name=\"Gender\" type=\"string\"/>\n    \
