  \nAzure Queue 提供了一个可靠的交付系统来支持异步工作调度。队列是 Azure 服务提供的用于持久化交互指令的唯一方法；表和 blob 仅持久化状态。\n\
  \n单个 StorageAccount 可以容纳无限数量的 MessageQueue，每个 MessageQueue 可以持久化无限数量的消息，消息可以存储高达\
  \ 8KB 的内容。你可以将大于 8KB 的消息存储在 blob 中，并用 blob 的 Name 属性值替换内容。队列具有 REST API，这使得任何语言编写的应用程序都能通过互联网或内网上的\
  \ HTTP 或 HTTPS 请求和响应消息来访问队列。StorageClient 库让开发者将 Azure Queue 视为 .NET 对象。\n\n\n\n\
  \n\n维基百科将 `SAML` 描述为“一种基于 XML 的标准，用于在安全域之间交换身份验证和授权数据，即在身份提供者（断言的生产者）和服务提供提供者（断言的消费者）之间。”`SAML`\
  \ “是 OASIS 安全服务技术委员会的产物，并已成为企业身份管理领域中许多 Web 单点登录（SSO）解决方案的终极标准。”有关 SAML 技术委员会（TC）的更多信息请参阅\
  \ [`bit.ly/Xsv31`](http://bit.ly/Xsv31) 和 [www.oasis-open.org/committees/tc_home.php?wg_abbrev=security](http://www.oasis-open.org/committees/tc_home.php?wg_abbrev=security)。`saml.xml.org`\
  \ 网站（[`saml.xml.org/`](http://saml.xml.org/))）是开发者获取 `SAML` 资源的主要来源。\n\n`ACS` 是托管在\
  \ `Windows Azure` 中的一种 `STS` 基础设施，用于验证凭据并发布令牌。每个 `.NET Services` 解决方案都有一个私有的、隔离的\
  \ `STS` 可用。`ACS` 还提供了一个基于声明（claims-based）规则的角色授权框架。将 `ACS` 与 `Azure WebRole` 或其他\
  \ `.NET` 集成需要安装 `Windows Identity Foundation`（`WIF`，以前称为“Geneva”框架），该框架在本书编写时处于\
  \ Beta 2 版本。`WIF` 实现了 `System.IdentityModel` 命名空间以简化基于声明的应用程序。它基于 `Windows Communication\
  \ Foundation`（`WCF`）基础设施来实现 `WS-Trust`，并带有一个名为 `WS-Federation Authentication Module`（`FAM`）的\
  \ `HttpModule`，简化了在基于浏览器的应用程序中实现 `WS-Federation`。\n\n正如本章后面提到的，在本书编写时 `System.IdentityModel`\
  \ 命名空间与 `Windows Azure` 不兼容。\n\n`WS-Federation` 是一种 Web 服务（`WS-*`）规范，用于从各种来源（域）联合身份，以简化安全\
  \ Web 站点和基于 SOAP 的服务的共享。本章演示了如何由基于 `WCF` 的 SOAP 客户端和 Web 服务使用微软当前的 `WS-Federation`\
  \ 实现功能。`WS-Federation` 还定义了在浏览器环境中表达 `WS-Trust` 协议和 `WS-Federation` 扩展的语法。这种语法为\
  \ Web 服务和基于浏览器的应用程序联合身份操作提供了一种通用方法。\n\n尽管 `ACS` 目前拥有用户名/密码、`Windows CardSpace v1`\
  \ 自发行信息卡以及 `X.509` 证书的凭据存储，但 `.NET Services` 团队并没有长期让 `ACS` 作为身份提供者的计划。`ACS` 未来将使用\
  \ `Windows Live Identity Services`（`WLID`）。\n\n本章随后的章节描述了如何创建用于 `ACS` 测试的联合 `CardSpace`\
  \ 凭据。`ACS` 内置支持 `Windows Live ID`（`WLID`）凭据。\n\n## 创建 .NET Services 解决方案\n\n在利用\
  \ `ACS` 和“Geneva”框架功能之前，你必须创建一个 `.NET Services` 解决方案。`.NET Services` 解决方案提供了所有的三个\
  \ `.NET Services`——`ACS`、`ServiceBus` 和 `Workflow Services`，除 `ACS` 以外的服务将在后面的章节中讨论。`.NET\
  \ Services` 在 2009 年 3 月的社区技术预览（CTP）中通过针对大多数操作的 `HTTP/HTTPS` 请求和响应消息获得了 `RESTful\
  \ API`。\n\n要配置一组 `.NET Services`，请访问 [`portal.ex.azure.microsoft.com/`](http://portal.ex.azure.microsoft.com/)\
  \ 并接受使用条款以打开 `My Subscriptions` 页面。点击 `Add Solution` 链接打开 `Create Solution` 页面，在文本框中输入解决方案唯一的名称（本示例类似于\
  \ `oakleaf-acs`），点击 `Validate Name` 链接测试唯一性（参见图 9.1），并点击 `OK` 将解决方案添加到 `My Subscriptions`\
  \ 页面并开始配置过程（参见图 9.2）。\n\n`.NET Service Service 解决方案的名称将成为 `DNS` 名称的一部分，因此必须遵循 `DNS`\
  \ 命名规则。解决方案名称必须以字母开头，随后是字母和数字的组合，但禁止以 `xn`、`Xn`、`xN` 或 `XN` 前缀开头。允许的特殊字符只有连字符（`-`）。解决方案名称必须唯一，因此你不能创建一个\
  \ `oakleaf-acs` 解决方案；请替换你自己的解决方案名称以防止冲突。\n\n`Access Control Service` 和 `Service\
  \ Bus Registry` 之间 `Status` 列中的空白将在随着 `.NET Framework 4` 发布恢复 `Workflow Services`\
  \ 时被一个 `Workflow Service` 链接填充。`Workflow Services` 曾在 2009 年 7 月的 `.NET Services`\
  \ `CTP` 及之后的版本中被临时移除。\n\n点击 `Access Control Service` 链接打开 `Manage the Microsoft\
  \ .NET Access Control` 页面（参见图 9.3）。\n\n图 9.1 为 .NET Services 解决方案分配名称。\n\n图 9.2\
  \ Create Solution 页面显示你添加的每个服务。\n\n图 9.3 一段时间后，Windows Azure 将配置 .NET 解决方案并打开其管理页面。\n\
  \n## 安装 .NET SDK 和其他工具\n\n下载并安装 .NET SDK 是启用使用 `ServiceBus` 或 `Workflow` 服务的 `ACS`\
  \ 示例所需的。`Azure Management Tools` 和 `Azure Service Kit` 是可选的，但你会发现它们的内容有助于了解更多关于\
  \ .NET Services 和 Azure 应用程序的身份管理知识。\n\n在本书编写时，.NET Services SDK 的最新版本是 2009 年 7\
  \ 月的。SDK 包含了 `Microsoft.ServiceBus` 程序集、`C#` 和 `VB` 示例代码以及初步的 `ACS` 文档。你可以从此处获取最新版本的\
  \ SDK，它会创建一个程序组：[`bit.ly/bL2xY`](http://bit.ly/bL2xY)、[`go.microsoft.com/fwlink?LinkID=12948`](http://go.microsoft.com/fwlink?LinkID=12948)。.NET\
  \ Services 开发中心位于 [`bit.ly/bhAKT`](http://bit.ly/bhAKT)、[`msdn.microsoft.com/en-us/azure/netservices.aspx`](http://msdn.microsoft.com/en-us/azure/netservices.aspx)，而\
  \ .NET Services – 技术讨论论坛位于 [`bit.ly/2T98wb`](http://bit.ly/2T98wb)。\n\n.NET Services\
  \ SDK 的 Java 和 Ruby 版本分别可获取自：[`bit.ly/Zjwx`](http://bit.ly/Zjwx) 和 [www.schakra.com/stuff-we-do/jdotnetservices.html](http://www.schakra.com/stuff-we-do/jdotnetservices.html)。\n\
  \n## Azure 管理工具（可选）\n\nAzure 管理工具提供了微软管理控制台（MMC）色插和 Windows PowerShell 命令行，允许用户配置和管理\
  \ .NET 访问控制服务以及 .NET 工作流服务。这些工具允许你在 MMC 图形界面中查看和更改 .NET 访问控制范围和规则，而不是在 .NET Services\
  \ 门户页面中操作，并部署和查看工作流。\n\n\n\n\nVittorio Bertocci 在 2008 年 1 月发表的博客文章通过 Azure 服务管理控制台查看\
  \ .NET 访问服务的视觉之旅, [`blogs.msdn.com/vbertocci/archive/2009/01/08/a-visual-tour-of-the-net-access-control-service-via-azure-services-management-console.aspx`](http://blogs.msdn.com/vbertocci/archive/2009/01/08/a-visual-tour-of-the-net-access-control-service-via-azure-services-management-console.aspx))\
  \ 向您展示了如何使用 Azure 门户中的“管理 Microsoft .NET 访问服务”页面，替代插件 GUI 中繁琐的配置范围和角的过程。\n\n###\
  \ Azure 服务训练套件（可选）\n\nAzure 服务训练套件包含了实操实验室（HOLs）、PowerPoint 演示文稿和演示，旨在帮助您学习如何使用\
  \ Windows Azure 平台。IntroAccessControlService HOL 以及 IntroNetServices 和 IndentityAccessControlServices\
  \ 演示文稿均适用于本章内容。您可以从 [`bit.ly/DAZKt`](http://bit.ly/DAZKt), [`go.microsoft.com/fwlink/?LinkID=130354`](http://go.microsoft.com/fwlink/?LinkID=130354)\
  \ 下载最新的 Azure 服务训练套件。\n\n### Microsoft “Geneva” Beta 2（安装前请验证兼容性）\n\nMicrosoft “Geneva”的\
  \ Beta 2 版本于 2009 年 6 月发布，并可在 [`bit.ly/4xUgjs`](http://bit.ly/4xUgjs), [www.microsoft.com/downloads/details.aspx?displaylang=en&FamilyID=118c3588-9070-426a-b655–6cec0a92c10b](http://www.microsoft.com/downloads/details.aspx?displaylang=en&FamilyID=118c3588-9070-426a-b655–6cec0a92c10b)\
  \ 下载。“Geneva”由以下三个组件组成：\n\n*   Windows Identity Foundation（“Geneva”框架）：用于构建使用声明（claims）做出用户访问决策的\
  \ .NET 应用程序\n*   Active Directory Federation Services（“Geneva”服务器）：安全令牌服务 (STS)，用于颁发和转换声明、启用联合以及管理用户访问\n\
  *   Windows CardSpace（Windows CardSpace “Geneva”）：帮助用户导航访问决策，并供开发者为用户构建身份验证体验\n\n\
  您可以从 [`bit.ly/qseXe`](http://bit.ly/qseXe), [`connect.microsoft.com/site/sitehome.aspx?SiteID=642`](https://connect.microsoft.com/site/sitehome.aspx?SiteID=642)\
  \ 下载上述组件以及“Geneva”白皮书和概述。ClaimsBased-Access-Platform（代号为“Geneva”）的基于声明的访问平台（CBA）论坛位于\
  \ [`bit.ly/ADmws`](http://bit.ly/ADmws), [`social.msdn.microsoft.com/Forums/en-US/Geneva/threads/`](http://social.msdn.microsoft.com/Forums/en-US/Geneva/threads/)，而更新频率较低的\
  \ MSDN “Geneva”团队博客位于 [`bit.ly/xcK6h`](http://bit.ly/xcK6h), [`blogs.msdn.com/card/default.aspx`](http://blogs.msdn.com/card/default.aspx)。Channel\
  \ 9 在 [`bit.ly/14hig7`](http://bit.ly/14hig7), [`channel9.msdn.com/identity/`](http://channel9.msdn.com/identity/)\
  \ 的“The Id Element”节目中提供了对微软产品组员及其他人关于身份、ACS 和“Geneva”的采访。\n\nMicrosoft “Geneva”\
  \ Beta 1 与 Windows Azure 平台（2009 年 3 月 CTP）不兼容，使用“Geneva”框架的 WebRole 应用程序无法在 Azure\
  \ 生产环境中运行。有关此问题的更多信息，请参阅 Vittorio Bertocci 于 2009 年 4 月 1 日发表的博客文章声明与云：请包涵我们的失误,\
  \ [`blogs.msdn.com/vbertocci/archive/2009/04/01/claims-and-cloud-pardon-our-dust.aspx`](http://blogs.msdn.com/vbertocci/archive/2009/04/01/claims-and-cloud-pardon-our-dust.aspx))。\n\
  \n一位微软技术支持代表在 Windows Azure 论坛报告称，Windows CardSpace “Geneva”与 Windows Vista 和 Windows\
  \ 7 自带的 Windows CardSpace 程序兼容。卸载“Geneva”框架将恢复原始的 Windows CardSpace 程序。请参见“Windows\
  \ Cardspace “Geneva” (Beta 2) 与 Windows Cardspace (Default) 控制面板程序不兼容”错误报告，[`bit.ly/e408T`](http://bit.ly/e408T),\
  \ [`connect.microsoft.com/site/sitehome.aspx?SiteID=642`](https://connect.microsoft.com/site/sitehome.aspx?SiteID=642)。微软于\
  \ 2009 年 7 月 13 日宣布了对“Geneva”的变更。\n\n\n\n\n![9.6](img/c09f006.jpg)\n\n点击 `Edit Profile\
  \ Information`（编辑配置文件信息）链接以打开声明配置页的扩展版本。在 `First Name`（名）和 `Last Name`（姓）文本框中输入虚假信息，接受默认的\
  \ `Email Address`（电子邮件），并在 `Group`（组）文本框中输入 `Domain Users`。通过勾选四个相关的复选框将它们标记为您的默认配置文件（参见图\
  \ 9.7）。\n\n图 9.7 用于配合 Azure Services Training Kit 的 `Federation.sln` HOL 使用的、带有默认条目的声明配置页。\n\
