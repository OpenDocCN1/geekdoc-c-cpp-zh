  客户端项目的 `App.config` 文件与服务器项目的文件相同，区别在于将 `<services>` 替换为 `<client>`，将 `Service`\
  \ 替换为 `Endpoint`，并增加了 `name=\"RelayEndpoint\"` 属性键值对，如 Listing 10-4 中突出所示。\n\n###\
