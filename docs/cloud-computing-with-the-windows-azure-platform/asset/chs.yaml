  Azure\\Chapter06\\LiveIDSampleCloudService` 项目，以验证 `TargetURL` 页面的安全技术，并参考 [`bit.ly/vIVlh`](http://bit.ly/vIVlh)\
  \ 以及 [`oakleafblog.blogspot.com/2009/06/problems-deploying-webrole-with-windows.html`](http://oakleafblog.blogspot.com/2009/06/problems-deploying-webrole-with-windows.html)\
  \ 获取更多部署详情。这篇 OakLeaf 博客文章包含一个在 Windows Azure Production Fabric 上运行的 `LiveIDSampleCloudService`\
  \ 现场演示链接。\n\n### 项目概述与注册详情\n\n#### 1.1 LiveIDSampleCloudService.sln 项目\n为了简单起见，`LiveIDSampleCloudService.sln`\
  \ 项目未包含注册页面，也没有将用户名和其他详情与每个应用程序生成的唯一 ID 关联的代码（该 ID 会显示在图 6.25 的注销消息中）。现实世界的应用需要一个注册页面向\
  \ `RegisteredUsers` 表添加行，其中 `RowKey` 值为唯一 ID，`Status` 属性指示用户是否已登录。当用户登录应用程序时，代码将检查该用户的行是否存在。如果存在，则将该用户标记为已登录；如果不存在，则要求用户进行注册。\n\
  \n### 总结\n\n#### 2.1 ASP.NET Membership Services\n`.NET` 2.0 及更高版本中的 ASP.NET Membership\
  \ Services 消除了开发人员编写和重写代码以存储和验证 Web 身份验证授权凭据的需求。成员程序默认使用 SQL Server 表来存储用户 ID、密码、角色成员、配置文件和会话状态。Windows\
  \ Azure SDK 包含一个示例 `AspProviders.dll` 类库和一个 `AspProviderDemo.sln` Web 应用，它们演示了如何在不使用\
  \ `.NET Access Control Service (ACS)` 的情况下，为 Windows Azure Web 应用添加身份验证和授权功能。\n\n\
  #### 2.2 AspProviderDemo.sln Web 应用\n`AspProviderDemo.sln` Web 应用提供了一个 `Default.aspx`\
  \ 页面，其中包含六个与成员相关的表单链接：`Login.aspx`、`ChangePassword.aspx`、`CreateNewWizard.aspx`、`ManageRoles.aspx`、`MyProfile.aspx`\
  \ 和 `MySession.aspx`。`AspProviderDemo` 的表单没有统一的主题，但添加级联样式表 (`CSS`) 样式以符合现有页面外观并不困难。\n\
  \n#### 2.3 与现有应用程序集成\n在对 `AspProviderDemo` 完成样式后，可以将 `AspProvider` 库、`AspProviderDemo`\
  \ 表单以及 `Web.config` 导入到 Azure Web 应用中，例如第 5 章中的 `AzureTableTestHarnessSSL`。通过添加引用\
  \ `StorageClient` 和 `AspProvider`，并对 `Web.config` 以及 `ServiceConfiguration.cscfg/ServiceDefinition.csdef`\
  \ 进行少量调整，可以允许 `DbReader`、`DbWriter` 和 `DbAdmin` 类的成员运行原始 `AzureTableTestHarnessSSL`\
  \ 页面更高权限的功能。\n\n#### 2.4 WLID 身份验证\n许多组织将倾向于使用带有 WLID 身份验证的单点登录。实现 WLID 身份验证需要从\
  \ `WLID Web Authentication SDK 1.2` 或更高版本的 `WebAuth` 示例网站项目中复制代码，并可选地使用 Microsoft\
  \ Visual Studio 2008 或更高版本的 Windows Live Tools 中的 `LoginStatus` 控件。本章以编写的逐步说明结束。\n\
  \n# 第 7 章：优化可扩展性与性能\n\n### 7.1 理解 Azure 表\n许多组织将倾向于使用带有 WLID 身份验证的单点登录。实现 WLID 身份验证需要从\
  \ `WLID Web Authentication SDK 1.2` 或更高版本的 `WebAuth` 示例网站项目中复制代码，并可选地使用 Microsoft\
  \ Visual Studio 2008 或更高版本的 Windows Live Tools 中的 `LoginStatus` 控件。本章以编写的逐步说明结束。\n\
  \n### 7.2 可扩展性与性能\n许多组织将倾向于使用带有 WLID 身份验证的单点登录。实现 WLID 身份验证需要从 `WLID Web Authentication\
  \ SDK 1.2` 或更高版本的 `WebAuth` 示例网站项目中复制代码，并可选地使用 Microsoft Visual Studio 2008 或更高版本的\
  \ Windows Live Tools 中的 `LoginStatus` 控件。本章以编写的逐步说明结束。\n\n### 7.3 分区与局部性\n许多组织将倾向于使用带有\
  \ WLID 身份验证的单点登录。实现 WLID 身份验证需要从 `WLID Web Authentication SDK 1.2` 或更高版本的 `WebAuth`\
  \ 示例网站项目中复制代码，并可选地使用 Microsoft Visual Studio 2008 或更高版本的 Windows Live Tools 中的 `LoginStatus`\
  \ 控件。本章以编写的逐步说明结束。\n\n### 7.4 主键与实体\nAzure 表的复合主键由 `PartitionKey` 和 `RowKey` 组成，提供了一个唯一的实体\
  \ ID（也称为对象 ID），用于识别和排序实体。`PartitionKey` 值用于识别用于负载均衡的分区。\n\n### 7.5 选择分区键\n`PartitionKey`\
  \ 值可以可以是字符串，其 `Length` 属性值范围在 `0KB` 到 `32KB` 之间，且不能包含以下字符：\n\n*   `/`\n*   `\\`\n\
  *   `#`\n*   `?`\n\n如果你预计表最终包含的实体数量可能超过单个 Azure 节点合理承载的范围，你应该计划按单个父实体来分配 `PartitionKey`\
  \ 值，例如通过 `UserID`、`CustomerID`、`CreditCardID`、`OrderID` 或 `ProductID`。为父子实体分配分相同的\
  \ `PartitionKey` 值可以确保它们维护在相同的局部区域中，从而提高处理速度。\n\n\n\n\n\nAzure 表格文档并未包含建议的或绝对的单个\
  \ Azure 节点可容的最大分区大小。例如，如果你正在编写一个类似于 Twitter 的社交网络服务（在本书编写时，该服务可能有约四百万用户），那么一个包含\
  \ 2KB 图像和 1KB 文本的用户配置实体，总大小将达到 12GB。而像 Facebook 这样成功的网站，在同一时期拥有约 1.5 亿用户，将生成一个 750GB\
  \ 的表格。\n\n子实体（例如 `Customers` 的 `Orders` 和 `LineItems`）可以分别通过 `OrderID` 和 `OrderID\
  \ + LineItemID` 的自然 `RowKey` 值来标识。\n\n自然键值源自实体键值。替代方案是使用 `GUID` 或自动生成的、通过程序分配的顺序代理键值，这类似于\
  \ SQL Server 的 `identity` 列属性。\n\n将具有 `CustomerID`（作为 `PartitionKey`）的实体实体并将 `Orders`\
  \ 和 `LineItems` 作为同一张表中的子实体，可能会提供最佳的分区方案，特别是当后续 Azure 发布更细粒度的地理位置服务时。包含特定国家或地区记录的表可以分配给最近的数据中心，例如\
  \ `NorthwestUS`（华盛州昆西）或 `SouthwestUS`（德克萨斯州圣安东奥）。\n\n本章的示例项目是 `\\WROX\\Azure\\Chapter07\\\
  UploadOrderEntitiesWinform.sln`。它的 `Orders` 和 `OrderDetails` 表基于 Northwind 数据库的\
  \ `Orders` 和 `Order Details` 表，预计可以在 `.\\SQLEXPRESS` 实例中找到。Azure 表具有计算唯一 `PartitionKey`\
  \ 值，按降序 `Order` 序列交付 `Order` 实体。`(int.MaxValue - OrderID).ToString().PadLeft(10,\
  \ '0')` 表达式生成了 10 个字符固定宽度且左零填充的字符串，以便在 `OrderID` 值超过九位数时保持排序一致。`RowKey` 值设置为 `String.Empty`。图\
  \ 7.1 显示了在向 `OrderTable` 和 `DetailTable` 表中添加 100 个 `Order` 实体和 282 个 `OrderDetail`\
  \ 实体后示例项目的表单。\n\n降序序列允许应用 LINQ 标准查询运算符 (SQO) `Take(n)` 在查询中返回 n 个最近的订单，例如 `(from\
  \ c in ordContext.OrderTable select c).Take(10)`。\n\n图 7.1 从客户端 SQL Server 实例上传数据到云端\
  \ `OrderTable` 和 `DetailTable` Azure 表后的 Windows-form 测试测试机架。\n\n![7.1](img/c07f001.jpg)\n\
  \n## 添加 Row Keys\n\n单个父实体 ID 值（`OrderID`）可能对应多个子实体（如 `OrderDetails`），因此它们需要 `RowKey`\
  \ 值来保持唯一性。关系型 `Order Details` 表具有复合主键，由 `OrderID + ProductID` 值组成。因此，对于小于 1000000\
  \ 的 `ProductID` 值，可以通过 `ProductID.ToString().PadLeft(6, '0')` 表达式创建自然的 `RowKey`\
  \ 值。\n\n另一种方案是使用代理顺序项目号，对于最多有 99 个不同项目的服务，通过 `ItemNumber.ToString().PadLeft(2, '0')`\
  \ 等表达式将其转换为左填充的字符串。本章示例项目中的 `DetailTable` 使用了这种替代表达式来计算 `RowKey` 值。\n\n## 处理关联实体\n\
  \nAzure 表格不支持实体关联（关系），尽管 ADO.NET Data Services 和 AtomPub 传输传输格式通过 `$expand` 查询选项支持\
  \ 1:n、1:1 和 n:1 关联，该选项会内联返回关联实体的链接以及 AtomPub `<link rel= ... />` 元素。如果你的子实体有一个属性值等于父实体的\
  \ `PartitionKey` 值（或 `PartitionKey` 加上 `RowKey` 值），你可以在对实现 `IEnumerable` 或 `IQueryable`\
  \ 的内存序列进行查询时，使用 LINQ join SQO 执行与 $expand 选项近似等效的操作。\n\n示例项目的初始版本将父实体和子实体存储在不同的表中，以简化在\
  \ `DataGridView` 控件中显示关联的 `DetailTable` 实体。来自 `OrderClasses.cs` 文件的 Listings 7-1\
  \ 和 7-2 代码定义了 `OrderTable` 和 `DetailTable` 的结构：\n\nListing 7-1: 为 `OrderTable` 父表定义\
  \ `OrderDataModel` 类的代码\n\n```csharp\n// 由 LINQ 内存对象生成器 (LIMOG) v2 生成 OrderType\
