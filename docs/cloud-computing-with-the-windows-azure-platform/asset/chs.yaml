  ```\n\n强调的值用于开发存储，被注释的值用于带有 Windows Azure 帐户的云数据存储。使用 XML 注释简化了在开发环境和云环境之间的切换。\n\
  \n\n\n\n### Eric Brewer 的 CAP 定理\n\n([`bit.ly/18p9Ym`](http://bit.ly/18p9Ym), [www.cs.berkeley.edu/∼brewer/cs262b-2004/PODC-keynote.pdf](http://www.cs.berkeley.edu/~brewer/cs262b-2004/PODC-keynote.pdf))\
  \ 表示对于共享数据系统的三个属性——数据一致性、系统可用性和网络分区容能力——只能同时实现其中两个。例如，一个不容忍网络分区的数据库可以使用传统的 RDBMS\
  \ 技术（如 ACID 事务）来实现一致性和可用性。大型分布式系统（如 Amazon 和 Google 使用的系统）需要网络分区，因此只能通过放弃可用性来实现一致性，反之亦然。Brewer\
  \ 提议用 `BASE` 替代 `ACID`；`BASE` 是基本可用（basically available）、软状态（soft-state）和最终一致性（eventual\
  \ consistency）的缩写。\n\n图 2.8 在 SQL Server Management Studio 2005 中显示了导入到 Azure `CustomerTable`\
  \ 的 Northwind 示例数据库 `Customers` 表的列（属性）。右窗格底部以复合主键形式显示的 `PartitionKey` 和 `RowKey`\
  \ 属性形成了一个复合实体（对象）标识符，该标识符在表中必须唯一；RDBMS 会为新添加或更新的实体（行）更新 `Timestamp` 值。Azure 将 `PartitionKey`、`RowKey`（字符串）和\
  \ `Timestamp`（日期）值视为元数据，并要求这些属性存在于所有表中。未显示的元数据值包括 `NextRowKey` 和 `NextPartitionKey`，应用程序使用它们进行数据分页。剩余的\
  \ `nvarchar(1000)` 属性是属性包（property bag）的成员，具有可选的用户提供的值。属性包实体的数据类型可以是 `Binary`、`Bool`、`DateTime`、`Double`、`GUID`、`Int`、`Long`\
  \ 或 UTF-16 编码的 `String`。\n\n实体可以拥有 255 个属性，包括三个元数据（系统）属性。实体数据值的总大小限制为 2MB。\n\n图\
  \ 2.8 SQL Server Management Studio 2005 显示了从 Northwind Customers 表创建并保存到 Developer\
  \ Storage 中 Azure 表格的列（属性）。\n\n![2.8](img/c02f008.jpg)\n\n表支持 `GET`、`PUT`、`MERGE`、`POST`\
  \ 和 `DELETE` 操作。用于 `GET` 方法从云存储返回表的基 URI 是 `http://AccountName.table.core.windows.net/Tables('TableName')`。查询表达式返回带有\
  \ URI 的过滤后的实体集，例如 `http://AccountName.table.core.windows.net/TableName$filter=QueryExpression`。ADO.NET\
  \ Data Services 定义了查询表达式语法。用于 ADO.NET Data Services 的 .NET 客户端库（`System.Data.Services.Client.dll`）允许你使用\
  \ LINQ 标准查询操作符的子集生成包含查询表达式的 URI。白皮书《在表存储中使用 .NET 客户端库》（([`bit.ly/I37Ix`](http://bit.ly/I37Ix),\
  \ [`msdn.microsoft.com/en-us/library/dd179445.aspx`](http://msdn.microsoft.com/en-us/library/dd179445.aspx))描述了客户端库类和使用\
  \ LINQ 进行查询。查询最多返回 1,000 个实体；通过结合 `NextContainerKey` 和 `NextRowKey` 值（称为延续令牌）进行分页，可以向应用程序返回超过\
  \ 1,000 个实体。\n\n对于 Development Storage，将 `AccountName.table.core.windows.net` 替换为\
  \ `127.0.0.1:10002/devstoreaccount1`。\n\n图 2.9 是 OakLeaf Systems Azure Table Services\
  \ 示例项目页面的屏幕截图，在 Development Fabric 中显示了 12 个 `CustomerTable` 实体的第一页以及用于插入新 BOGUS\
  \ 客户实体的用户输入数据。你可以在 [`oakleaf.cloudapp.net/`](http://oakleaf.cloudapp.net/) 测试该应用程序的生产版本，并在随后的“Web\
  \ 云服务”部分中了解更多关于其结构的信息，在第 7 章“优化 Azure 表的可扩展性和性能”中分析其代码。\n\n图 2.9 在 Development Fabric\
  \ 中运行的 OakLeaf Systems Azure Table Services 示例项目（`SampleCloudWebService`）的 `Default.aspx`\
  \ 页面。\n\n![2.9](img/c02f009.jpg)\n\n### Azure Blob Services\n\nBlob 存储二进制数据，如图像、XML\
  \ 文档、压缩（zip 或 gzip）文件和其他内容，作为存储账户关联的容器内的任意字节数组。容器是用户定义的 blob 集合，它只有属性，其中包括其包含的 blob\
  \ 列表。容器不直接存储数据。\n\n以下 `GET` URI 返回名为 `ContainerName` 的容器中的所有 blob：`http://AccountName.blob.core.windows.net/ContainerName$comp=list`。使用\
  \ `http://AccountName.blob.core.windows.net/ContainerName` 读取特定 blob。\n\n对于 Development\
  \ Storage，将 `AccountName.blob.core.windows.net` 替换为 `127.0.0.1:10000/devstore1`。你可以通过上传一系列块创建大于\
  \ 64MB 的 blob。图 2.10 显示了 OakLeaf Systems Blob Services 测试工具在上传两组位图文件后的默认页面。\n\n\
  `Upload Time` 是向流传输 blob 数据的时间（秒）；`Create Time` 是从流创建 blob 的时间（秒）。由于应用程序与 SkyDrive\
  \ 之间的互联网连接更好，云存储的上传时间远短于图 2.10 所示。\n\n图 2.10 在 Development Fabric 中运行的 OakLeaf Systems\
  \ Blob Services 测试工具（`AzureBlobTest`）的 `Default.aspx` 页面。\n\n![2.10](img/c02f010.jpg)\n\
  \n### Azure Queue Services\n\nAzure 队列是大小为 8KB 的消息，任何访问存储账户的客户端或应用程序都可以按照先来顺序访问。Azure\
  \ 队列具有与 blob 类似的 REST API。例如，以下 `GET` URI 返回存储账户 AccountName 的所有队列：`http://AccountName.queue.core.windows.net$comp=list`。使用\
  \ `http://AccountName.queue.core.windows.net/QueueName` 获取一个或多个消息。指定可选的 `numofmessages`\
  \ 参数可以获取 2 到最多 32 个消息。\n\n`Put Message` 操作通过调用类似于 `http://AccountName.queue.core.windows.net/QueueName/messages`\
  \ 的方法向云队列添加消息，请求体由一个或多个以下 XML 片段组成：\n\n```xml\n<QueueMessage>\n    <MessageText>message-content</MessageText>\n\
  </QueueMessage>\n```\n\n其中 `message-content` 是可以 UTF-8 编码的字符串。二进制内容必须经过 Base64 编码。\n\
  \n\n\n\n\n图 2.11 显示了 Photo Gallery Azure Queue Services Test Harness 程序的默认页面。`Queue\
  \ Name` 是一个数字日期/时间等效值，后跟一个 GUID，以便按创建日期升序自动排序。`Type` 是消息内容的多部分互联网邮件扩展 (MIME) 类型。`ETag`\
  \ 是用于支持乐观一致性的日期/时间代码。你可以在 [`oakleaf5.cloudapp.net/`](http://oakleaf5.cloudapp.net/)\
  \ 测试运行 `AzureQueueTest` 应用，在随后的“Worker Cloud Services”部分了解更多关于它的结构，并在第 8 章分析它的代码。\n\
  \n图 2.11 运行在开发织网（Development Fabric）中的 Photo Gallery Azure Queue Services Test Harness\
  \ 的 `Default.aspx` 页面。\n\n![2.11](img/c02f011.jpg)\n\n### 为 Visual Studio 2008 使用\
  \ Azure 模板\n\n下载 Windows Azure Tools for Visual Studio 会向“新建项目”对话框中添加“云服务”模板节点。双击\
