  \ 的主要动力之一是在波动需求下最大化可扩展性，并为 `WebRole` 和 `WorkerRole` 提供巅峰性能。最大化可扩展性需要注意表分区的当前大小，其不应超过单个\
  \ Azure 节点的存储容量。你通过选择一组 `PartitionKey` 值来实施负载均衡的分区策略，使得表分区（局部性）的大小处于 Azure Fabric\
  \ 集群的舒适范围内。灵活属性允许 `Azure Tables` 存储具有不同属性的多个实体类型。在分区中存储单个父项和多个后代（子）项是控制最终分区大小的有效方法。Azure\
  \ Fabric 为应用程序快速访问单个表中的多个相关分区。\n\n单个分区内的唯一 `RowKey` 值为分区内的实体标识符和订单实体提供了等同于复合主键。许多应用程序需要或倾向于按降序排列实体，这需要从\
  \ `NumericType.MaxValue` 计算 `PartitionKey` 以及可能的 `RowKey` 值。这种技术按 OrderID 降序序列对实体进行排序，从而允许应用\
  \ LINQ 的 `Take(n)` 操作符返回最后 `n` 个实体。\n\n用包含父实体和子实体的表代替独立的父表和子表，可以显著提高删除性能，并推导出提高子实体更新操作的性能。本的示例项目将删除\
  \ Northwind 数据库中 Orders 和 Order Details 的父子实体所需的时间减少了三分之一。示例项目还演示了如何编写查询以分离父子实体，以便在单独的数据绑定网格控件中显示。\n\
  \n### 第 8 章：使用 Azure Queues 进行消息传递\n\n`Azure Queues` 为云服务组件之间提供可靠的异步消息传递。将 `WorkerRole`\
  \ 项目的计算操作分发以提高服务的可扩展性是 `Azure Queues` 最常用的用途，它还可以通过在计算密集型任务中引入额外节点来辅助 Azure Fabric\
  \ 的负载均衡功能。将计算卸载到 `WorkerRole` 可以加速云端 `WebRole` 页面对用户请求的响应。本章将向你展示如何结合 `WebRole`、`WorkerRole`\
  \ 和 `Queue` 来创建一个所谓的 Azure 托管复合应用程序。\n\n队列是三  Azure 数据模型中最简单的。单个 `http://servicename.core.windows.net`\
  \ 服务账户支持无限数量的唯一命名队列。此外，队列可以包含无限数量的消息，每条消息可以包含高达 8MB 的字符串或二进制负载。你的应用程序可以以键/值对的形式为队列分配额外的\
  \ 8MB 最大自定义元数据。单个消息不支持自定义元数据，但具有最长七天的寿命（生存时间或 `TTL`）。像 `Azure Tables` 和 `Blobs`\
  \ 一样，`Queues` 提供了 RESTful 应用程序编程接口 (`API`)，允许多个平台和编程语言在开发和 Azure Fabric 上运行时对其进行操作。`Queues`\
  \ 同时支持 `HTTP` 和 `HTTPS`（带有传输层安全的安全 HTTP，`TLS`）协议。\n\n图 8.1 展示了一个简单的工作流，使用单个队列将云端\
  \ Web 应用程序（`WebRole`）和本地 Windows 客户端计算服务卸载到一对 `WorkerRoles` 上。`WebRole` 和客户端应用将工作请求消息入队，然后由两个\
  \ `WorkerRoles` 中的任一个开始处理。当两个 `WorkerRoles` 完成其工作时，它们会向适当的容器中添加新 blob 或在表中添加新实体。`WebRole`\
  \ 和客户端随后处理并显示新的 blob 或实体。\n\n图 8.1 用于从云端 `WebRole` 和本地 Windows 客户端分发类似计算请求的 `Azure\
  \ Queue` 图解。\n\n![8.1](img/c08f001.jpg)\n\n### 创建和处理 Azure Queues 和消息\n\n`StorageClient`\
  \ 库包含一个 `Queue.cs` 文件，其中定义了下表所示的队列相关的 .NET 类和事件处理器：\n\n| 类或事件处理器 | 描述 |\n| :---\
  \ | :--- |\n| `QueueStorage` | `QueueStorage` 的工厂方法。 |\n| `MessageQueue` | 此类的实例代表用户存储账户中的队列。\
  \ |\n| `QueueProperties` | `MessageQueue` 的默认属性。 |\n| `Message` | 此类的实例代表队列中的单条消息。\
  \ |\n| `MessageReceivedEventHandler` 委托 | 通过定期轮询传入消息来监听传入消息。 |\n\n图 8.2 是上述队列相关类以及事件委托及其\
  \ `EventArgs` 的类图。\n\n![8.2](img/c08f002.jpg)\n\nStorageClient 库的队列相关类和事件委托。\n\n\
  ### 列出存储账户的队列\n\n`RestQueue.cs` 文件中的 `QueueStorageRest` 和 `QueueRest` 类分别继承自 `Queue.cs`\
  \ 中的 `QueueStorage` 和 `MessageQueue` 类。\n\n存储账户级别只有一个队列相关的 `StorageClient` 方法：`ListQueues()`。要列出特定存储账户（示例为\
  \ `oakleaf3`）的队列，请使用 [`oakleaf3.core.windows.net?comp=list`](http://oakleaf3.core.windows.net?comp=list)\
  \ 作为 URI 调用 HTTP GET 方法。列表 8-1 包含了 `MessageQueue.ListQueues()` 方法的 HTTP 请求和响应消息。\n\
  \n\n\n\n\n# [列表 8-1] 获取 oakleaf3 账户队列列表的 HTTP 请求和响应消息\n\n```http\nGET /comp=list&maxresults=50&timeout=30\
