  \ `http://ServiceName.CloudApp.net/Default.aspx`。删除 `Default.aspx` 页面并不能解决问题。要强制\
  \ `Login.aspx` 为启动页，请将 Listing 6-10 所示的元素添加到 `Web.config` 的 `<webServer>` 组中：\n\n\
  ```xml\n<defaultDocument enabled=\"true\">\n    <files>\n        <clear />\n   \
  \     <add value=\"Login.aspx\" />\n    </files>\n</defaultDocument>\n```\n\n对 `Default`\
  \ 类的 `Page_PreRender` 事件处理程序进行微调可以防止在显式调用 `../Default.aspx` 时显示 `GridView`。详细信息请参见示例项目的\
  \ `Default.aspx.cs` 文件。\n\n图 6.20 显示了未登录用户没有 `GridView` 的页面。\n\n图 6.20 对于未身份验证用户的\
  \ `Default.aspx` 页面。\n\n![6.20](img/c06f020.jpg)\n\n你可以在 `http://oakleaf4.cloudapp.net/`\
  \ 运行升级版的 `AzureHarness` 服务。\n\n### 使用 Windows Live ID 进行身份验证\n\n大多数 Windows 用户至少有一个用于登录微软和其他在线服务的\
  \ `WLID`。正如本章开头提到的，2009 年 5 月对 Azure 服务门户的更新将 Live ID 与托管服务解耦。这从托管服务页面中删除了 Live\
  \ Services 部分和 Application ID 字段。该部分移动到了新的 `Live Services: Existing APIs` 项目，该项目指定了托管服务的域、指向其\
  \ URL，并提供了 `Application ID` 和 `Secret Key` 值。门户添加此新项目，并为其分配与相应托管服务相同的名称（参见图 6.21）。\n\
  \n所有 Web 应用（不仅仅是 Azure 项目）都使用在 Azure 服务门户中创建的 `Live Services: Existing APIs` 项目向\
  \ `WLID` 服务注册。\n\n图 6.21 由 Azure 服务门户为托管服务添加的 `Live Services: Existing APIs` 项目。\n\
  \n![6.21](img/c06f021.jpg)\n\n### 下载 WLID Web Authentication SDK 1.2\n\n微软将 Windows\
  \ Live ID Web Authentication SDK 1.2 (`http://bit.ly/Z9KKG`, `www.microsoft.com/downloads/details.aspx?FamilyID=E565FC92-D5F6-4F5F-8713-4DD1C90DE19F&displaylang=en`)\
  \ 称为“在各种类型的网站上实现 Live ID 登录的平台无关接口”。它提供 ASP.NET (C# 和 VB)、Java、Perl、Python 和 Ruby\
  \ 的独立下载。\n\n\n\n\n\n```xml\n<appSettings>\n  <add key=\"wll_appid\" value=\"00163FFF80003301\"\
