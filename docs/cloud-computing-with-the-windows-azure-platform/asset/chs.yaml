  \ 5-11 所示。\n\n### 使用 AesManaged 加密类解密加密字符串的方法\n\n```csharp\npublic static string\
  \ Decrypt(string base64Input)\n{\n    try\n    {\n      //byte[] encryptBytes =\
  \ UTF8Encoding.UTF8.GetBytes(input);\n      byte[] encryptBytes = Convert.FromBase64String(base64Input);\n\
  \      byte[] saltBytes = UTF8Encoding.UTF8.GetBytes(\"S0d1umChl0r1de\");\n    \
  \  // 使用 PBKDF2 标准进行基于密码的密钥生成\n      Rfc2898DeriveBytes rfc = new Rfc2898DeriveBytes(\"\
  K3yPassw0rd!\", saltBytes);\n      // 高级标准对称加密算法\n      AesManaged aes = new AesManaged();\n\
  \      // 设置 AES 参数\n      aes.BlockSize = aes.BlockSizes[0].MaxSize;\n      aes.KeySize\
  \ = aes.KeySizes[0].MaxSize;\n      aes.Key = rfc.GetBytes(aes.KeySize / 8);\n \
  \     aes.IV = rfc.GetBytes(aes.BlockSize / 8);\n      // 解密\n      ICryptoTransform\
  \ decryptTrans = aes.CreateDecrypt();\n      // 输出流，也可以是 FileStream\n      MemoryStream\
  \ decryptStream = new MemoryStream();\n      CryptoStream decryptor = new CryptoStream(decryptStream,\
  \ decryptTrans, CryptoStreamMode.Write);\n      // 写入、刷新、清除并关闭解密器\n      decryptor.Write(encryptBytes,\
  \ 0, encryptBytes.Length);\n      decryptor.Flush();\n      decryptor.Clear();\n\
  \      decryptor.Close();\n      // 从解密后的字节创建 UTF 字符串\n      byte[] decryptBytes\
  \ = decryptStream.ToArray();\n      string decryptedString = UTF8Encoding.UTF8.GetString(decryptBytes,\
  \ 0, decryptBytes.Length);\n      return decryptedString;\n    }\n    catch (Exception\
  \ exDecr)\n    {\n      string msg = \"AES Decryption error: \" + exDecr.Message;\n\
  \      if (RoleManager.IsRoleManagerRunning)\n        RoleManager.WriteToLog(\"\
  Critical\", msg);\n      return base64Input;\n    }\n}\n```\n\n列表 5-9 和 5-11 基于\
  \ H. Soderlund 的一个 C# 示例（Encrypt / Decrypt in Silverlight, http://bit.ly/128fNZ,\
  \ http://silverlight.net/forums/14449/49982）。该项目解密每页 12 个实体。列表 5-12 是获取前 12 个实体的\
  \ HTTP 请求。\n\n### 来自 OakLeaf3 表前 12 个实体的请求头\n\n```http\nGET /CustomerTable()?top=12\
