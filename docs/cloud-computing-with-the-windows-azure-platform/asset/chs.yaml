  \ `201` 响应消息的负载约为请求消息负载大小的 1.3 倍。对于一个 UTF-8 大小约为 159 字节的关系型表记录，两个负载的组合大小为 3157 字节，加上\
  \ 973 字节的报头。假设返回结果被丢弃，则插入消息的开销为 `(4130 – 159) * 100/4130 = 96.2%`。换句话说，请求和响应消息的大小大约是未压缩数据的\
  \ 26 倍。增加的开销会导致数据流量费用的显著增加，因此在确定将关系型数据迁移到 Azure Tables 的预算之前，测量预期的消息大小非常重要。\n\n\
