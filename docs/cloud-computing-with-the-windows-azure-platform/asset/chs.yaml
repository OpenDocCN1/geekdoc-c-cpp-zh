  \ `Save`（保存）返回 `Manage Relying Party Policies`（管理依赖方策略），点击 `Manage Relying Party\
  \ Policies`链接打开依赖方页面，该页面包含 HTTPS 和 HTTP 策略的 `Edit/View`（编辑/查看）按钮。点击不安全的 `http://relyingparty.federatedidentity.net`\
  \ 实体方的 `EditView` 按钮打开 `Edit a Policy`（编辑策略）页面。勾选您想要发布的配置文件项复选框，点击 `Browse`（浏览），并导航到包含在\
  \ Azure Services Toolkit 中的 ACS 公钥文件（参见图 9.8，该图仅显示了前五项）。\n\n图 9.8 为示例 Federated\
  \ Identity Http Sample Relying Party 创建策略。\n\n![9.8](img/c09f008.jpg)\n\n证书位于 `\\\
  AzureServicesKit\\Labs\\IntroAccessControlService\\Assets\\accesscontrol.windows.net.cer`。\n\
  \n点击 `Save`（保存）保存您的更改并返回 `Edit Profile Information/Manage Relying Party Policies`\
  \ 页面。点击 `Download Your Username/Password`（下载您的用户名/密码）卡片按钮打开 `InformationCard.crd`\
  \ 文件的文件下载对话框，并在询问是否要在本地计算机上保存带有 Windows CardSpace 的卡片时点击 `Yes`。这将 CardSpace 信息卡片凭据添加到\
  \ Windows CardSpace 面板中（参见图 9.9）。Vista 及更高版本的操作系统具有 Windows CardSpace 应用程序，用于为支持此身份协议的应用选择\
  \ CardSpace 凭据。\n\n![9.9](img/c09f009.jpg)\n\n对证书支持的卡片重复上述步骤，这需要您点击链接以生成并下载 `FederatedIdentity.pfx`，并点击\
