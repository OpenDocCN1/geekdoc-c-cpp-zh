  \n## 将成员服务集成到 Azure 服务\n\n如果无法自定义你自己的 `AspProviderDemo.sln` 项目并导入其文件，那么将 ASP.NET\
  \ 成员服务集成到现有的 `WebRole` 项目中将是一个大问题。然而，由于必须从 `AspProviderDemo_WebRole` 复制到 `ExistingProjectName_WebRole`\
  \ 并集成到最终解决方案的文件很多，导入和修改这些文件相当复杂。\n\n### 复制和集成成员相关文件\n\n`/ROX/Azure/Chapter06/AzureTestHarness`\
  \ 文件夹包含第 5 章的 `AzureTestHarness.sln` 项目，该项目已升级了大部分来自 `AspProviderDemo_WebRole` 的\
  \ `.aspx`、`.aspx.cs` 和 `.designer.cs` 文件。集成两个项目的策略如下：\n\n1.  将 `/ROX/Azure/Chapter05/AzureTestHarness`\
  \ 复制到 `/ROX/Azure/Chapter06`。\n2.  编译并运行目标项目以验证性。\n3.  将目标项目的 `Web.config` 重命名为\
  \ `Web.config.bak`。\n4.  将 `/ROX/Azure/Chapter05/AzureTestarness` 和 `Common` 项目复制到\
  \ `/ROX/Azure/Chapter06`。\n5.  将 `/ROX/Azure/Chapter06/AzureTestarness/ChangePassword.aspx`、`CreateNewWizard.aspx`、`Login.aspx`、`Manage.aspx`、`MyProfile.aspx`\
  \ 和 `MySession.aspx` 以及相应的 `.aspx.cs` 文件添加到 `AzureTestarness`。\n6.  在 `AzureTestarness_WebRole`\
  \ 中添加每个 `.aspx` 和 `Web.config` 文件。\n7.  右键点击 `AzureTestarness_WebRole` 的 `References`\
  \ 节点，点击 `Projects` 选项卡，选择 `AspProviders`、`Common` 和 `StorageClient` 库，然后点击确定以添加图\
  \ 6.17。\n8.  打开复制的 `Web.config` 文件，将所有的 `applicationName=\"AspProviderDemo\"` 更改为\
  \ `applicationName=\"AzureTestarness\"`。\n9.  打开服务配置文件，添加 `<Setting name=\"allowInsecureRemoteEndpoints\"\
  \ value=\"false\"/>`。\n10. 打开配置文件，添加 `<Setting name=\"allowInsecureRemoteEndpoints\"\
  \ />`。\n11. 右键点击 `Login.aspx` 页面并设置为。\n12. 按 `F5` 并等待表单出现。\n13. 之前输入的用户名和密码不适用于新的\
  \ `AzureTestarness` 应用程序，因此点击“新建用户”创建一个虚假账户。\n\n图 6.17 为 AspProviders、Common 和 StorageClient\
  \ 库添加。\n\n![6.17](img/c06f017.jpg)\n\n## 自定义 AzureTestarness 项目的 `Default.aspx`\
