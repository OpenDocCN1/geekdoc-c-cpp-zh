  \ 对象最重要的五个消息级别方法。\n\n| MessageQueue.Method() | 描述 |\n| :--- | :--- |\n| `MessageQueue.PutMessage\
  \ (Message, MessageTTL)` | 在队列尾部添加新消息。`MessageTTL` 指定消息的生存间隔。消息可以以文本或二进制（字节数组）格式存储，但消息内容仅以\
  \ Base64 编码格式返回。 |\n| `MessageQueue.ApproximateCount()` | 获取队列中近似的数量以及其他可选的队列元数据（如果存在）。\
  \ |\n\n\n\n\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `MessageQueue.GetMessage[s] ([NumOfMessages,\
  \ VisibilityTimeout])` | 从队列头部检索一个或多个 `NumOfMessages` 消息，并可选地使这些消息在指定的 `VisibilityTimeout`（秒）内变为不可见，默认值为\
  \ 30 秒，最大为两小时。此方法返回 `PopReceipt`。从队列返回的消息顺序是不保证一致的，且消息可能会被多次返回。 |\n| `MessageQueue.PeekMessage[s]\
  \ ([NumOfMessages])` | 从队列头部检索一个或多个 `NumOfMessages` 消息，但不会使消息对其他调用者不可见。此操作会为每个返回的消息返回一个\
  \ `PopReceipt`。 |\n| `MessageQueue.DeleteMessage (PopReceipt)` | 删除与之前的 `GetMessage`\
  \ 调用返回的 `PopReceipt` 关联的消息。未被删除的消息将在 `VisibilityTimeout` 周期结束后后重新出现在队列中。 |\n| `MessageQueue.Clear()`\
  \ | 删除队列实例中的所有消息。调用者应重试此操作，直到其返回 `true` 为止，以确保队列中不再留任何消息。 |\n\n### 向队列添加消息\n\nListing\
