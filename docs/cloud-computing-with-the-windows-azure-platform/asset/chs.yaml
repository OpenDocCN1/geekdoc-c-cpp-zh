  \n6.  点击“检索（Retrieve）”更新 CardSpace 凭据。\n\n7.  点击“发送（Send）”将令牌发送到您的 ACS 解决方案并返回消息，如\
  \ 图 9.26 所示。\n\n图 9.26 返回的消息。\n\n![9.26](img/c09f026.jpg)\n\n### 总结\n\nNET Services\
  \ 是托管在 Windows Azure 中的三个高度可扩展的服务，适用于 .NET 开发者：.NET 访问控制（ACS）、.NET 服务总线（Service\
  \ Bus）和 .NET 工作流服务（Workflow Service）。ACS 与该服务总线交互，以减少为外部用户访问的安全服务所需的复杂编程。在编写本书时，.NET\
  \ 工作流服务已从 .NET Services SDK 中临时移除；当微软发布 .NET 4.0 时将重新启用。\n\nACS 是一种安全令牌服务，支持多种方法基于声明的用户身份验证和授权，包括用户名/密码组合、Windows\
  \ Live ID、Windows CardSpace、X.509 证书或第三方颁发的 SAML 安全令牌。ACS 对第三方 STS 的识别实现了外部用户身份验证和授权的联邦。本章的示例利用微软的\
  \ Identity Lab 模拟商业第三方联邦 STS。\n\n本章开始介绍了如何从 Windows Azure 开发者门户配置 .NET Services\
  \ 解决方案，以及下载所需的 .NET Services SDK 以及可选的管理工具和培训包。\n\n本章结束时详细说明了如何借助 Identity Lab 的帮助创建\
  \ Windows CardSpace 信息卡示例，并使用该卡片根据 Azure 服务培训包的实践实验实现简单的 ACS/Service Bus 联邦身份应用程序。\n\
  \n\n\n\n\n# 使用 .NET Service Bus 互服务\n\n第 9 章在 .NET 访问控制服务 (`ACS`) 的背景下向你介绍了 .NET\
  \ Service Bus (`SB`)。本章将侧重于介绍如何使用 `SB` 及其各种消息模式，在穿越防火墙和网络地址转换 (`NAT`) 设备的同时，通过互联网连接\
  \ Windows Azure 以及其他应用程序。\n\n.NET Service Bus 在 Biz Talk Services 的 Beta 阶段测试阶段曾被称为互联网服务总线（Internet\
  \ Service Bus）。Biz Talk Services 是 Biz Talk Labs ([`labs.biztalk.net`](http://labs.biztalk.net))\
  \ 孵化项目的一部分，并于 2008 年重命名为 .NET Service Bus。\n\n`SB` 通过将企业级应用与双向消息织网或总线集成（该总线专为通过互联网进行服务集成而设计），增强了行业标准的企业服务总线\
  \ (`ESB`) 模式（参见 图 10.1）。\n\n图 10.1 .NET 服务的总线通过联邦安全和访问控制功能扩展了传统的企业服务总线模式。\n\n![10.1](img/c10f001.jpg)\n\
  \n`SB` 提供以下功能或服务：\n\n* 通过 .NET 访问控制服务 (`ACS`)、Windows CardSpace 以及可选的 Windows 身份基础结构\
  \ (`WIF`) 和活动目录联合身份服务 (`ADFS`) 实现联邦身份验证和访问控制*\n* 一致的服务和服务端命名，以简化消息的中继或路由\n* 服务注册表，简化防火墙后\
  \ `NAT` 客户端和其他用户的发现工作\n* 通用的消息织网，提供多种通信选项，包括发布/订阅 (`pub/sub`) 或发送/监听功能\n* 使用 RESTful\
  \ HTTP 请求/响应、SOAP、`WS-*` 和 Windows 通信框架 (`WCF`) 协议进行消息传递\n* 通过 .NET 服务工作流服务 (`WFS`)\
  \ 与服务编排集成，根据预定义的业务流程或工作流处理消息\n\n`SB` 协调服务之间身份管理、命名规范、消息格式和通信协议的差异。一旦服务加入总线，总线上的任何其他客户端或服务都可以通过互联网与其连接，无论其是否有直接与其他服务或客户端通信的能力。\n\
  \n本章要求熟悉 ASP.NET Web 服务和 `WCF` 概念，但并不要求读者具备 `WCF` 开发专家。\n\n## 创建 .NET 服务解决方案并安装先决条件\n\
  \n按照第 9 章“创建 .NET 服务解决方案”部分的操作，但解决方案名称除外；第 9 章的访问控制服务解决方案名称为 `oakleaf-acs`；对于本示例，解决方案的名称为\
  \ `oakleaf-sb`。\n\n你无法使用 `oakleaf-sb` 作为解决方案名称，因为所有解决方案名称必须是全局唯一的。\n\n当你点击管理服务页面上的“Service\
  \ Bus”按钮时，Microsoft .NET Service Bus 概述页面会显示“终端快速参考”部分，其中包含你所选解决方案名称的典型 `SB` 终端\
  \ URI 示例（参见 图 10.2）。\n\n图 10.2 Microsoft .NET Service Bus 概述页面的“终端快速参考”部分提供了终端 URI\
  \ 示例。\n\n![10.2](img/c10f002.jpg)\n\n`oakleaf-sb` 解决方案拥有 DNS 根命名空间 `sb://oakleaf-sb.servicebus.windows.net`。对于你选择的解决方案名称，`SB`\
  \ 终端快速参考提供了典型的 `SB` 终端 URI 示例（参见 图 10.2）。\n\n（注：原文此处逻辑似乎存在重复或乱码，翻译已根据语意进行平顺处理）\n\
