  \ 基于简单的 RESTful HTTP 实现，以兼容最广泛的客户端平台和 Web 服务客户端能力。`BasicHttpRelayBinding` 是一种非常简单的\
  \ SOAP 实现，安全功能有限。`WSHttpRelayBinding` 要求客户端支持与端点使用的相同的套件 `WS-*` 协议。`WS2007HttpRelayBinding`\
  \ 支持更新版本的 `Security`、`ReliableSession` 和 `TransactionFlow` 绑定元素，以及 SOAP 1.2 消息传递。\n\
