  \ Web Roles。图 2.12 显示了 Visual Studio 2008 显示了一个已添加两个 `WebRoles` 和两个 `WorkerRoles`\
  \ 的新项目。Windows Azure SDK (2009 年 7 月 CTP) 增加了在云服务中添加每种类型多个角色的能力。每个角色都是一个独立的 Windows\
  \ Azure CPU 实例，因此在云端运行该项目的最低成本为每小时 4 × $0.12 = $0.48。\n\n图 2.12 Visual Studio 2008\
  \ 的“新建项目”对话框覆盖了“新建云服务项目”对话框，显示了一个包含四个云服务角色的解决方案。\n\n![2.12](img/c02f012.jpg)\n\n\
  只有在安装了 Windows Azure Tools for Visual Studio、Live Framework SDK 和 Live Framework\
  \ Tools 后，“新建项目”对话框的“项目类型”格中才会出现 Live Framework 节点。Live Framework 模板是启用网的 Web （Mesh-Enabled\
  \ Web Application）和 Silverlight 启用网的 Web 应用。\n\n在图 2.12 所示的角色下双击 OK，将打开一个在解决方案管理器中包含\
  \ `WebRole` 和 `WorkerRole` 项目的新解决方案，如图 2.13 所示。\n\n图 2.13 解决方案管理器显示了由两个 `WebRoles`\
  \ 和两个 `WorkerRoles` 添加五个五个。\n\n![2.13](img/c02f013.jpg)\n\n解决方案的 `Roles` 节点包含指向每个\
  \ `WebRole` 项目的项目（该项目为应用程序提供 ASP.NET UI），每个 `WorkerRole` 用于不需要 UI 或使用 `WebRole`\
  \ 的 ASP.NET 页面作为其 UI 的计算操作。\n\n云服务的引用包括 `Microsoft.ServiceHosting.ServiceRuntime`\
  \ 命名空间，它包含下表列出的类：\n\n| 类或枚举 | 类或枚举说明 |\n| :--- | :--- |\n| `RoleEntryPoint` | 提供管理服务的初始化、启动和停止的方法，以及监控服务健康的方法\
  \ |\n| `RoleException` | 当角色内发生无效操作时抛出错误 |\n| `RoleManager` | 提供记录消息和发出警报、检索服务配置设置以及返回本地存储资源位置的方法\
  \ |\n| `RoleStatus` | 提供有关角色当前状态信息的枚举：健康 (Healthy)、不存在 (NonExistent)、已启动 (Started)、正在启动\
  \ (Starting)、正在停止 (Stopping) 或不健康 (Unhealthy) |\n\n### Web 云服务和客户端封装类库\n\n使用 `WebRole`\
  \ 模板的项目提供 ASP.NET `Default.aspx` 页面作为默认云应用程序 UI 的起点。图 2.14 显示了在 VS 2008 中打开的 `SampleWebCloudService`\
  \ 项目，该项目有一个 `WebRole` 项目。\n\n图 2.14 VS 2008 显示了 Web 云服务的两个默认项目以及 `Common` 和 `StorageClient`\
  \ 封装类库。\n\n![2.14](img/c02f014.jpg)\n\n该服务包含了来自 `HelloFabric` 示例应用程序的 `Common` 类库，以帮助记录应用程序问题。应用程序日志是调试在云端运行的应用程序的唯一实用手段。此服务集成了\
  \ `HelloFabric` 示例应用程序中的 `Common` 类库，以协助记录应用程序问题。应用程序日志是调试在云端运行的应用程序的唯一实用手段。`StorageClient`\
  \ 项目包含了 `StorageClient` 类库，用于 ADO.NET Blob、队列和表存储。\n\n### 利用辅助服务\n\nWindows Azure\
  \ 平台包含了三组辅助服务：`.NET Services`、`SQL Database` 和 Live Services。早期 `.NET Services`\
  \ 和 `SQL Database` (`SADB`) 需要邀请码，从 CTP 3 开始已取消了 `.NET Services` 的邀请要求，请访问 .NET\
  \ Services 开发者页面：[`bit.ly/e3knd`](http://bit.ly/e3knd) ([`portal.azure.com/View.aspx`](https://portal.azure.com/View.aspx))，点击“注册\
  \ (Sign Up)”链接打开“创建解决方案”页面，分配一个唯一的 `Solution Name`（参见图 2.15），点击“创建解决方案”按钮，即可开始 `.NET\
  \ Services` 和 `SQL Database`。\n\n图 2.15 用于 .NET Services 的“创建解决方案”页面允许你创建一个包含一个或多个\
  \ .NET 服务的“解决方案”。\n\n![2.15](img/c02f015.jpg)\n\n####NET Services\n\nMicrosoft .NET\
  \ Services 是一组由 Windows Azure 与存储服务一同托管的可扩展面向开发者的服务。.NET Services 为云端 Web 和 Worker\
  \ 应用程序提供关键的基础组件。\n\n.NET 访问控制、总线和服务工作流服务利用 Web 标准 Atom、AtomPub、SOAP、WS-* 和 HTTP\
  \ 协议，因此任何具有可靠 Internet 的应用程序都可以它们，并且与其他流行的编程语言（如 Java 和 Ruby）兼容。\n\n\n\n\n\n## 访问控制服务\n\
  \n微软声称，访问控制服务 (ACS) “提供了一种控制 Web 应用程序服务的简易方法，同时与基于标准的身份提供者集成，包括企业目录和如 Windows Live\
  \ ID 等网络身份系统”。Service Bus 服务依赖于基于声明的身份模型进行用户身份验证和基于角色的访问控制。ACS 的优势在于，你可以编写一组声明式规则，将传入的安全声明转换为基于声明的联合身份，从而最大限度地减少开发人员的工作量。ACS\
  \ 依赖于著名的用户账户存储库，例如 `Live ID`、`Active Directory` 或支持 `Atom`、`AtomPub`、`SOAP` 或 `WS-*`\
  \ 以及 `HTTP` 协议的其他存储库。\n\nWindows Azure 门户提供了 ACS 的管理界面。位于 [`bit.ly/Co8NG`](http://bit.ly/Co8NG)\
  \ ([www.microsoft.com/azure/accesscontrol.mspx](http://www.microsoft.com/azure/accesscontrol.mspx))\
  \ 的 `.NET Access Control Service` 页面提供了额外 ACS 资源的链接。\n\n你可以通过以下文档了解更多关于 ACS 的信息：\n\
  \n* MSDN 库中的“Microsoft .NET Access Control Service”帮助主题，位于 [`bit.ly/17IjY`](http://bit.ly/17IjY)\
  \ ([`go.microsoft.com/fwlink/?LinkID=131222`](http://go.microsoft.com/fwlink/?LinkID=131222))。\n\
  * 来自 [`bit.ly/bhAKT`](http://bit.ly/bhAKT) 下载白皮书链接的 `Introduction to Microsoft .NET\
  \ Access Control.docx` 文件和“A Developer's Guide to the Microsoft .NET Access Control\
  \ Service”（[`msdn.microsoft.com/en-us/azure/netservices.aspx`](http://msdn.microsoft.com/en-us/azure/netservices.aspx)）。\n\
  \n第 6 章“服务用户的验证与授权”包含了描述如何保护 WebRole 应用程序章节，第 9 章“使用 .NET Access Control Services\
  \ 对用户进行验证”专门介绍了 ACS。\n\n### Service Bus\n\n微软表示，`.NET Service Bus` (`SB`)（最初被称为\
  \ `BizTalk Services`） “能够轻松通过互联网将应用程序连接在一起。在总线（注册的服务可以跨越任何网络拓扑被轻松发现和访问。” SB 使用 `Windows\
  \ Communication Foundation` (`WCF`) 实现了企业服务总线 (`ESB`) 应用程序模式。然而，它减少了配置和编写使用 `WCF`\
  \ 创建云与本地应用程序之间双向连接的 SaaS 项目所需的编程工作。当新服务连接到总线时，总线上的所有其他应用程序和服务都可以与其连接，即使它们之前无法直接连接。`SBS`\
  \ 提供了一个集中的、负载平衡的中继服务，支持行业标准的传输协议和 Web 服务标准，包括 `SOAP`、`SOAP` 和 `WS-*`。\n\n`.NET Services\
  \ SDK` (2009 年 3 月 CTP) 增加了 `Service Bus Queues` (`SBQs`) 和 `Routers` (`SBRs`)，这些是可发现的、持久化的\
  \ `SB` 对象，独立于监听器的生命周期。与其他 .NET Services 一样，基础 API 利用 `HTTP GET` 和 `POST` 方法以及 `AtomPub`\
  \ 扩展来来定义 `SBQs`，它是 `Queue Storage Services` 的轻量级版本。`SBRs` 将消息从一个或多个发布者转发到一个或多个订阅者，以创建一个带有可选多播到所有订阅者的发布/订阅消息模型。发布者从一个或多个发布者向一个或多个订阅者发送消息，创建一个带有可选多播到所有订阅者的发布/订阅消息模型。发布者从一个或多个发布者向一个或多个订阅者发送消息。\
  \ .NET Services 团队提供了关于 `SBQs` 和 `SBRs` 的详细信息。\n\n以下是关于 `SBS` 的其他来源：\n\n* MSDN 库中的“Microsoft\
  \ .NET Access Control Service”帮助主题，位于 [`bit.ly/17IjY`](http://bit.ly/17IjY) ([`go.microsoft.com/fwlink/?LinkID=131222`](http://go.microsoft.com/fwlink/?LinkID=131222))。\n\
  * 来自 [`bit.ly/bhAKT`](http://bit.ly/bhAKT) 下载白皮书链接的 `Introduction to Microsoft .NET\
  \ Access Control.docx` 文件和“A Developer's Guide to the Microsoft .NET Access Control\
  \ Service”（[`msdn.microsoft.com/en-us/azure/netservices.aspx`](http://msdn.microsoft.com/en-us/azure/netservices.aspx)）。\n\
  \n.NET Services 团队提供了关于 `SBQs` 和 `SBRs` 的详细信息，这些是可发现的、持久化的 SB 对象，独立于监听器的生命周期。与其他\
  \ .NET Services 一样，基础 API 利用 `HTTP GET` 和 `POST` 方法以及 `AtomPub` 扩展来定义 `SBQs`，它是\
  \ `Queue Storage Services` 的轻量级版本。`SBRs` 将消息从一个或多个发布者转发到一个或多个订阅者，以创建一个带有可选多播到所有订阅者的发布/订阅消息模型。\n\
  \n### Workflow Services\n\n微软将 `.NET Workflow` (WFS) 描述为 “云端运行工作流的高扩展主机”。 WFS 协调\
