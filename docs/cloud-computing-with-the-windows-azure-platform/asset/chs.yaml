  \ Jupiter Images/Digital Vision\n\n## 致谢\n非常感谢技术编辑 Dave Robinson 和 Mike Amundsen\
  \ 在各章节通过多次社区预览和 SQL Azure Database 中期调整期间提供的修正和建议。\n\nDavid Robinson 是 SQL Azure\
  \ Database (SADB) 团队的高级计划经理。David 负责多项工作，包括驱动产品功能、代码示例，最重要的向客户展示 SADB 和云计算所提供的价值。David\
