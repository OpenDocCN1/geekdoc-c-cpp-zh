  \ Service”（[`msdn.microsoft.com/en-us/azure/netservices.aspx`](http://msdn.microsoft.com/en-us/azure/netservices.aspx)）。\n\
  \n### SQL Azure\n\nSQL 服务是基于 SQL Server 2008 的高扩展、按需关系型数据库管理、商业智能 (BI) 和报告实用程序。`SQL\
  \ Server Integration Services` (`SSIS`)、`SQL Analysis Services` (`SSAS`) 和 `Reporting\
  \ Services` (`SSRS`) 计划于 2010 年实施。\n\n### SQL Data Services 和 SQL Azure Database\n\
  \n`SQL Azure Database` (`SADB`) 在微软于 2008 年初的 MIX08 大会上宣布 `SSDS` 为独立的数据库服务 (`DaaS`)\
  \ 时最初被称为 `SQL Server Data Services` (`SSDS`)。`SSDS` 的初始架构实现了无模式的 `EAV` 表，类似于 Azure\
  \ `Table Services`，并采用非关系的“权威-容器-实体” (`ACE`) 模型。`SSDS` 团队认为，潜在的 Azure 采用者想要 `EAV`\
  \ 模型的简单性，而不是 `SQL Server` 表和其他数据库对象的关系型功能。\n\n\n\n\n\nSSDS 团队最终意识到了他们的错误，并于 2008\
  \ 年初决定放弃无模式数据库和 EAV 模型。关于这一方向转变的首条消息出现在 2009 年 2 月 23 日 MSDN 开发者会议访问旧金山期间，当时联合 1105\
  \ Media 在凯悦假日酒店举办了 Visual Studio Live! 会议（参阅 [“SQL Azure 数据库的中途修正](http://bit.ly/85YOa)](http://bit.ly/85YOa),\
  \ [`oakleafblog.blogspot.com/2009/02/mid-course-correction-for-sql-data.html)`](http://oakleafblog.blogspot.com/2009/02/mid-course-correction-for-sql-data.html)）。）。新命名为\
  \ SQL Azure 数据库 (SADB) 的团队在 2009 年 3 月通过 MIX ‘09 上的演示，以及在 5 月的 Tech*Ed 2009 上的演示展示了更多\
  \ SADB 细节（参阅 [“Microsoft SQL Azure 数据库新特性十张幻灯片 (DAT202) Tech*Ed 2009 会场](http://bit.ly/nPLUB)](http://bit.ly/nPLUB),\
  \ [`oakleafblog.blogspot.com/2009/05/ten-slides-from-whats-new-in-microsoft.html)`](http://oakleafblog.blogspot.com/2009/05/ten-slides-from-whats-new-in-microsoft.html)）。）。\n\
  \n根据微软 SADB 宣教员 David Robinson 在 2009 年 5 月 6 日于微软企业开发者和解决方案会议上的演讲，SADB 将提供以下 SQL\
  \ Server 功能：\n\n* 表、索引和视图\n* 存储过程和触发器\n* 约束\n* 表变量\n* 会话临时表 (`#t`)\n\n以下功能将不包含 v1\
  \ 版本的范围之内：\n\n* 分布式事务\n* 分布式查询\n* CLR 支持\n* Service Broker\n* 空间数据类型\n* 物理服务器访问或目录\
  \ DDL 和视图\n\nDavid Robinson 是本书的技术编辑。\n\n当本书出版时，SADB 尚未发布公共 CTP（合作技术计划），因此两个 SADB\
  \ 章节可以从 [www.wrox.com](http://www.wrox.com) 的书籍页面下载：第 12 章“管理 SQL Azure 账户、数据库和\
  \ DataHub”以及第 13 章“利用 SQL Azure 数据库的关系型特性”。\n\n### 获取 SADB v1 私有 CTP 账户\n\n要获取 SADB\
  \ v1 私有 CTP 的邀请，请点击 SADB SQL Azure 数据库 (SADB)页面上的“加入邮件列表”链接（[`bit.ly/YDtQJ`](http://bit.ly/YDtQJ),\
  \ [go.microsoft.com/fwlink/?LinkID=149681&clcid=0x09)](http://go.microsoft.com/fwlink/?LinkID=149681&clcid=0x09)），位于\
  \ [`bit.ly/VdpIn`](http://bit.ly/VdpIn), [`msdn.microsoft.com/en-us/sqlserver/dataservices/default.aspx)`](http://msdn.microsoft.com/en-us/sqlserver/dataservices/default.aspx)，该链接将带你进入\
  \ Microsoft Connect 页面并完成调查卷。如果你使用当前活跃的 Windows Live ID 完成过 SSDS 账户的调查卷，将打开原始调查卷（只读）；在这种情况下，SADB\
  \ 团队表示你将自动收到邀请。\n\nSSDS beta 账户不适用于 SADB v1 数据库。\n\n### 向 Azure 云部署应用程序和服务\n\nWindows\
  \ Azure 平台的主要优势之一是，可以将你通过开发存储（Development Storage）和 Fabric 服务创建的应用程序轻松部署到 Azure（云）服务。大多数云应用程序和服务都需要访问数据、持久化状态或两者，且均以表、blob\
  \ 或队列的形式存在。大多数高度可扩展的应用程序同样需要可扩展的数据。\n\n当你创建一个数据密集型应用程序时，你的应用程序可能包含某些代码，以便将数据从传统源（如本地或在线数据库、图像文件、网页、生产力应用文档，或所有这些数据类型）导入到\
  \ Azure 存储服务。例如，OakLeaf Systems Azure Blob Services 测试 Harness 示例应用程序包含代码，可以将存储在\
  \ Windows Live SkyDrive 公共文件夹中的特定图像 (`*.bmp`) 和存档 (`*.zip`) 集合，或客户端文件系统中的任何文件导入\
  \ Azure Blobs。\n\nOakLeaf Systems Azure Table Services 示例项目包含对象初始化代码，用于生成模拟 Northwind\
  \ Customers（客户）表记录的实体。\n\n### Azure 存储服务\n\n从开发环境切换到 Azure 云存储只需修改 `ServiceConfiguration.cscfg`，将\
  \ `AccountName` 值更改为云存储项目名称，并将 `BlogStorageEndpoint`、`QueueStorageEndpoint`、`TableStorageEndpoing`\
  \ 或三个值均更改为 [`blob.core.windows.net`](http://blob.core.windows.net),[`queue.core.windows.net`](http://queue.core.windows.net)\
  \ 或 [`table.core.windows.net`](http://table.core.windows.net)，如前面的“Azure 服务定义和服务配置文件”部分所示。在云中存储所有数据的原始数据和至少两个副本可以确保数据的可靠性和连续性。\n\
  \n上一个段落假设你的应用程序可以向云上传适当的数据或在云中生成数据。\n\n### 将项目发布到 Azure 云\n\n当你在在线创建一个新的托管项目时，Windows\
  \ Azure 会为其分配一个 GUID。在 2009 年 5 月 CTP 之前，Windows Azure 会分配一个 16 字符的十六进制应用程序 ID，例如\
  \ `000000004C00F2`。你可以从门户页面复制 ID 值并粘贴到门户属性页的文本框中，如图 2.17 所示。\n\n\n\n\n将应用程序 ID 粘贴到门户属性页后，右键点击主项目节点并选择\
  \ `Publish`（发布），将打开项目 `...\\bin\\Debug\\Publish` 文件夹的资源管理器窗口，其中显示了 `ProjectName.cspkg`\
  \ 和 `ServiceConfiguration.cscfg` 文件，以及 Windows Azure 的阶段部署页面（参见图 2.18）。\n\n你可以对项目的阶段版本和生产版本使用相同的标签，但为了清晰建议使用不同的标签。\n\
  \nFigure 2.18 从开发织构（Development Fabric）向云织构（Cloud Fabric）的阶段服务部署托管 Azure 项目，需要指定包和配置文件、为项目输入标签并点击\
  \ `Deploy`（部署）按钮。\n\n![2.18](img/c02f018.jpg)\n\n几分钟或更久（取决于你的项目包的大小和互联网连接情况后），阶段\
  \ WebRole 将变为 `Allocated`（已分配）。点击 `Run`（运行）将项目置于启动（Started）模式。（参见图 2.19）。\n\n点击\
  \ `Configure`（配置）允许你编辑 `ServiceConfiguration.cscfg` 文件或导入替换文件。例如，可以通过更改 `Instance\
  \ count` 值来增加或减少部署的实例数量。微软建议运行两个项目实例，以确保即使在流量较小时也能具有最大的可用性。\n\nFigure 2.19 将项目部署到阶段服务后，点击\
  \ `Run` 将其置于启动（Started）角色，然后点击 `Web Site URL` 链接在 Windows OS 操作系统下进行测试。\n\n![2.19](img/c02f019.jpg)\n\
  \n点击 `Run` 在阶段模式下实例化项目，这将启动一个 `Initializing`（初始化中）的 WebRole，一两分钟后，将阶段项目置于启动（Started）WebRole。点击\
  \ `Staging Private Web Site URL` 链接在浏览器中测试该 WebRole（参见图 2.20）。\n\nFigure 2.20 OakLeaf\
  \ Azure Blob Services 测试项目在隐藏 URL [`b9c10b0d715d4812a9e13bbcde538947.cloudapp.net/`](http://b9c10b0d715d4812a9e13bbcde538947.cloudapp.net/)\
  \ 处的阶段性部署。\n\n![2.20](img/c02f020.jpg)\n\n通过点击两个包图标之间的按钮，并在询问“你确定要与生产部署交换吗？”时点击\
  \ `OK`，将阶段版本交换为生产版本。\n\n在将其放入生产环境后暂停阶段实例，以避免在微软发布 Windows Azure 时在阶段和生产实例上产生运行时间费用。\n\
  \n### 总结\n\n微软在 2008 年 10 月底的 2008 年专业开发者大会（PDC）上推出了 Windows Azure 云操作系统以及 Windows\
  \ Azure 平台提供的其他服务。Windows Azure 运行在微软快速扩展的数据中心集合中，直接与 Amazon Web Services 和 Google\
  \ App Engine 竞争。Azure 团队设计了系统和 API，以利用 .NET 开发者在 C#、VB 和 Visual Studio 2008 及后续版本的经验。\n\
  \n本书编写时，Windows Azure 处于私人社区技术预览（CTP）阶段，因此想要访问微软云操作系统的用户需要 `GUID` 令牌或邀请码，可用于兑换 Azure\
  \ 托管项目、Azure 存储项目、.NET 服务、SQL Azure 数据库或 Windows Live 服务。获取大多数 Azure 令牌的复杂过程于 Microsoft\
  \ Connect，但通常需要 Windows Azure 论坛中微软代表的介入。Windows Live ID 提供 Azure CTP 用户的身份验证和授权。\n\
  \n如果你没有云计算所需的令牌和邀请，可以通过下载并安装 Windows Azure 和 .NET Services SDK 来测试注定由 Windows Azure\
  \ 托管的项目、blobs、队列和表。这些 SDK 包含了文档和示例项目，你可以在运行 Windows Vista 或 Windows Server 2008\
  \ 的 PC 上，在开发织构下配合开发本地存储来运行它们。利用目前仅在云端提供的 `SADB` 需要一个包含用户名和密码的邀请。\n\nAzure 存储服务将结构化或半结构化数据持久为实体-属性-值表，将不同内容类型的文件持久为\
  \ blobs，并将项目之间的消息持久为队列。管理存储服务的官方 API 基于与平台无关的 REST 并调用 `GET`、`POST`、`PUT`、`MERGE`\
  \ 和 `DELETE` 方法。.NET 服务为需要这些能力的企业级项目提供访问控制、消息总线和工作流组件。实时环境（Live Operating Environment）提供了针对个人消费者的\
  \ Windows Live 和 Mesh 服务集成。\n\n2009 年年中，SQL Server Data Services 经历了从其原始帐户（Account）、容器（Container）、实体（Entity）架构到\
  \ SQL Azure Database v1（也称为“云端 SQL Server”）的剧烈迁移。新版本实现了大部分 SQL Server 2008 功能并支持\
  \ T-SQL。Azure 团队设计了基于互联网的服务门户，使配置变得简单快速。\n\n## 第 3 章 分析 Windows Azure 操作系统\n\nWindows\
  \ Azure 是一种运行在数据中心数千个 Windows Server 2008 物理实例上的“云层”操作系统。在 Azure 平台上开发和部署应用程序或服务不需要了解操作系统的工作原理。然而，对\
  \ Azure 架构的基本了解有助于你设计利用操作系统特性实现最大性能、扩展性和安全的应用程序。\n\n### Windows Azure OS 概\n\n数据中心的物理服务器运行高级版本的微软\
  \ Hyper-V 虚拟机程序，通过虚拟化物理实例交付一个集群织构，称为 Azure 织构控制器（FC），它处理应用程序部署、负载均衡、操作系统/数据复制和资源管理。`FC`\
  \ 部署项目、根据需要自动添加实例、管理软件升级并处理故障以维护项目可用性。\n\n早期 Azure CTP 未实现响应变化的动态服务实例管理。你需要在 `ServiceConfiguration.cscfg`\
  \ 文件中指定实例数量，然后在 Azure 服务门户中重新部署修改后的文件。\n\n\n\n角色（Roles）是应用程序中可运行的组件；角色实例运行在架构节点上，并通过通道连接各个角色。`WebRole`\
  \ 实例通过 Internet 信息服务 (`IIS`) 7 接受 HTTP 或 HTTPS 请求，并使用 `ASP.NET`、`ASP.NET MVC` 或\
  \ Silverlight UI 响应。`WorkerRoles` 响应从 `Azure Queues` 中接收到的 `WebRoles` 或 `.NET Services`\
  \ 的请求消息提供批处理服务。每个 `WebRole` 或 `WorkerRole` 都被分配到其独立的虚拟机 VM 和服务器核心，以隔离租户数据，如图 3.1\
  \ 所示。\n\n`WorkerRoles` 无法接受来自外部网络的入站连接，因此它们必须使用 `Azure Queues` 与 `WebRoles` 或 `.NET\
  \ Services` 通信。`WorkerRoles` 可以向外部网络发送出站消息。\n\n图 3.1 Azure 在两台物理服务器上部署了三个 `WebRole`\
  \ 实例和三个 `WorkerRole` 实例，带有 FC 代理管理每组实例的负载均衡。\n\n![3.1](img/c03f001.jpg)\n\n根据 Erick\
  \ Smith 在 2009 年微软专业开发者大会 (PDC) 上的演讲“深入内部：云计算托管环境内部”(Under the Hood: Inside the\
  \ Cloud Computing Hosting Environment, ES19) ([`bit.ly/16xSNH`](http://bit.ly/16xSNH),\
  \ [`channel9.msdn.com/pdc2008/ES19/`](http://channel9.msdn.com/pdc2008/ES19/))，FC\
  \ 维护着其管理的 Microsoft 数据中心内物理和虚拟机、负载均衡器、路由器和交换机的清单图。图的边是各种类型的互连；例如，网络线、串行线和电源线。开发者通过声明式服务模型指定服务的拓扑结构——角色的数量和连接性、各种硬件组件的属性和位置，以及所需的故障/更新域数量和每个角色的最大实例数。Smith\
  \ 说：“FC 从裸机开始管理服务周期。”Windows Azure 的管理功能类似于 Google App Engine (GAE) 用于其 Web 应用程序的功能，以及\
  \ RightScale 为 Amazon Web Services (AWS) 提供的功能；如前面的章节所述，GAE 和 AWS 是 Azure 的主要竞争对手。\n\
  \nAzure CTP 将项目限制为最多 2,000 个运行实例小时，单个生产应用程序最多支持 8 个实例，并且在单个故障和更新域内最多有一个 WebRole\
  \ 和（可选的）一个 `WorkerRole`。测试人员可以通过向 azquotas@microsoft.com 发送邮件来申请这些限制的豁免。\n\n早期的\
  \ CTP 将应用程序限制在自定义版本的 ASP.NET 中等信任代码访问安全 (CAS) 下运行托管的 .NET 3.5 代码。微软承诺未来将支持 Python、Ruby、PHP、原生代码和\
  \ Eclipse 工具。2009 年 5 月的 CTP 引入了在全信任下运行应用程序的选项。\n\nAzure 角色实例的故障域（fault domains）代表单点故障，例如机架；用于执行滚动软件升级的更新域（update\
  \ domains）；或跨多个故障域运行的补丁（参见图 3.2）。最终，你将能够使用 Oslo 的特定领域语言工具指定你的服务模型，并将模型存储在 Oslo 仓库中。\n\
  \n在 PDC 2008 发布的初始 CTP 未暴露服务模型；相反，Microsoft Visual Studio 的 Windows Azure Tools\
  \ 插件贡献了 `WebRole`、`WorkerRole` 和 `Workflow` 的常用 Azure 角色模板，如第 2 节所述。\n\n图 3.2 故障域由共享公共硬件的物理服务器组成，例如一机架服务器。Azure\
  \ 为了可靠性，存储所有数据的一个主副本和至少两个副本拷贝。更新域由来自多个故障域的一组服务器组成。\n\n![3.2](img/c03f002.jpg)\n\n\
  ## Windows Azure 服务的生命周期\n\nWindows Azure 基础设施由运行在服务器上的虚拟机 (`VMs`) 组成。图 3.3 显示了物理节点和逻辑角色之间的关系。图\
  \ 3.3 响应心跳事件调和逻辑节点、逻辑实例、逻辑角色。图 3.3 基于 2008 年的“深入内部：云计算托管环境”会话。图 3.3 逻辑节点所使用的 FC\
  \ 数据结构。图 3.3 逻辑节点、逻辑实例、逻辑角色。\n\n![3.3](img/c03f003.jpg)\n\n### 逻辑节点、角色和服务的约束\n\n\
  逻辑节点、角色和服务的约束包括：\n*   角色可以分配给节点。\n*   单个角色实例可以分配给节点。\n*   节点必须足够的资源。\n*   兼容的环境。\n\
  *   节点必须位于适当的故障域。\n*   节点必须健康。\n\n### 创建主机虚拟机和第一个虚拟机\n\n当你添加生产应用程序时，FC 通过下载维护操作系统\
  \ (`MOS`) 来启动物理服务器。初始启动时，服务器启动虚拟磁盘 (`VHD`) OS，FC Agent 加载客体操作系统镜像并部署角色。随后 FC Agent\
  \ 配置服务器的基础设施，例如负载均衡器。冗余的网络组件提供了高可靠性和可用性。\n\n添加虚拟机的过程封装在事务中。如果过程中的任何操作失败，所有之前的操作将回滚。根据\
  \ Azure 团队，“FC 主要通过托管代码实现。”\n\n### 向主机虚拟机添加虚拟机\n\n如果新项目的 `ServiceConfiguration.cscfg`\
  \ 文件中的 `<Instances count=\"n\">` 元素大于 1，或者 FC Agent 检测到现有实例将无法处理负载，则 FC Agent 通知\
  \ AFC 添加另一个虚拟机。主机虚拟机复制本地客体操作系统镜像以创建新的虚拟机，该虚拟机接收适当的角色。FC Agent 重复配置新虚拟机基础设施的过程。特定角色的新虚拟机通常被添加到不同故障域的物理服务器上。\n\
  \n所有配置和取消配置的操作都在数据中心并行进行，以快速响应需求波动、硬件故障或两者。早期的 CTP 不支持动态虚拟机分配和逻辑角色实例的添加或删除。未来的版本将支持指定角色实例的最小最大数量。\n\
  \n### 维护角色实例健康\n\nFC 负责通过检查状态并添加或删除角色实例来保持服务运行。\n*   FC 为每个节点维护一个状态机。\n*   角色实例描述决定节点的目标状态。\n\
  *   内部或外部事件会导致节点移动到不同的状态。\n*   FC 缓存每个节点的最后状态。\n*   负载均衡器探测节点以确定每个节点的操作并向 FC 报告故障。\n\
  *   FC Agent 响应心跳事件协调缓存和实际状态。\n*   如果实际状态和目标状态不同，在心跳事件期间 FC Agent 尝试使节点更接近其目标状态。\n\
  \n\n\n\n- `FC` 会检测节点何时达到其目标状态。\n- 如果故障节点离线，`FC` 会尝试恢复它。\n- 如果 `FC` 无法恢复故障节点，它将在其他硬件上寻找或创建一个合适的替代品，并通知其他角色实例配置已发生更改。\n\
  \n当节点发生故障时，服务状态不会被维护。如果保存故障逻辑角色实例的状态至关重要，您的应用程序应该定期将状态（例如缓存）持久化到 `Azure tables`\
  \ 或 `blobs`。\n\n# 升级服务软件和 Windows Azure\n\n对 Windows Azure 系统的滚动服务软件升级和补丁是在一次一个\
  \ `Upgrade Domain`（升级域）的运行服务中通过事务进行的。`FC` 会并行向该 `Upgrade Domain` 中的所有节点部署资源，因此该\
  \ `Upgrade Domain` 中的所有更新的服务在升级期间会临时离线，同时新的逻辑角色实例将绑定到物理节点。升级域的数量决定了升级期间的服务损失百分比，这通常发生得非常快。要最大限度地减少升级对性能的影响，需要大量的\
  \ `Upgrade Domains`；这意味着每个服务都有许多角色实例。\n\n当您将升级后的项目从 `Staging` 移动到 `Production` 时，服务软件升级是自动的；某些服务器升级和补丁需要数据中心人员的干预。\n\
  \n# 安全保护和服务与数据\n\n在 20 世纪 90 年代，甚至在 21 世纪的前五年里，企业 IT 部门有权拒绝普通员工通过组织网络访问互联网。在许多情况下，这种限制甚至适用于高层管理。IT\
  \ 管理人员简单地说，对网络安全和数据隐私的威胁对组织的生存构成了不可接受的风险。执行经理在目睹了敏感数据反复被黑客破解后，全盘接受了 IT 专家的判断。分支机构通过从电信运营商处租赁的昂贵\
  \ `T-1` 或更慢的线路连接到中央数据中心。移动用户则受到拨号连接到分支或家庭办公室速度限制的更大阻碍。IT 部门的重点是边界安全，通过使用严格的 `Network\
  \ Access Control (NAC)` 参数来将“坏人”隔在公司网络之外。防止办公员工通过组织内网连接互联网导致了许多秘密的拨号连接和网络黑客攻击，这些行为在长时间内都避了\
  \ IT 部门的雷达。\n\n根据 Forrester Research 的研究，“NAC 是硬件和软件技术的结合，根据其对策略的合规性动态控制客户端系统对网络的访问。”\n\
  \n为了适应日益增长的销售团队、支持远程办公员工，并顺从本地员工对业务相关信息的高速互联网访问需求，这些需求逐渐克服了 IT 部门的反对意见。允许用户及其应用程序通过有限的开放\
  \ `TCP` 端口连接到互联网的防火墙为 IT 和公司管理层提供了安全幻觉。防火墙使 `SaaS` 客户关系管理 (`CRM`) 应用程序（如 [Salesforce.com](http://Salesforce.com)）以及第三方基于\
  \ `SOAP` 的 Web 服务得以蓬勃发展。今天，很少有少数大型组织的内部网络没有（无论是有意还是无意）连接到互联网。\n\n# 对云计算提供商安全声明的依赖\n\
  \n对潜在云计算采用者的调查表明，缺乏安全性是组织至少部分计算和数据存储操作迁移到云端的首要障碍。加利福尼亚大学伯克利分校可靠自适应分布式 (`RAD`) 系统实验室团队于\
  \ 2009 年 2 月发布的白皮书《云端之上：伯克利对云计算的视角》（[`bit.ly/iSOer`](http://bit.ly/iSOer), [`d1smfj0g31qzek.cloudfront.net/abovetheclouds.pdf`](http://d1smfj0g31qzek.cloudfront.net/abovetheclouds.pdf)）列出了以下为“云计算增长十大障碍”的前三名：\n\
  \n1. 服务可用性\n2. 数据锁定\n3. 数据机密性和可审计性\n\n大多数 IT 部门认为，允许第三方交付服务意味着他们失去了对数据如何安全、审计和维护的控制，而且他们无法执行无法控制的内容。然而，IDG\
  \ News Service 的 James Niccolai 在 2009 年 2 月 19 日的一篇名为“云安全担忧被放大了，有人这么说”的文章写道（[`bit.ly/C12ll`](http://bit.ly/C12ll),\
  \ [`oakleafblog.blogspot.com/2009/02/security-issues-receive-main-focus-at.html`](http://oakleafblog.blogspot.com/2009/02/security-issues-receive-main-focus-at.html)）：\n\
  \n说这话听起来可能像异端邪说，但在云计算环境中过度担心安全是可能的，IDC 云计算论坛的发言者在周三如是说。\n\n根据 IDC 的研究，安全是 IT 管理人员在考虑云部署时提到的首要关注点，其次是性能、可用性以及将云服务与内部\
  \ IT 集成的能力。\n\n“我认为许多对云的安全反对本质上是情绪化的，是本能，”埃森哲（一家全球性管理咨询、技术服务和外包公司）云计算总监 Joseph Tobolski\
  \ 说，“有些人为云安全列出了一份需求清单，而他们对自己的数据中心甚至没有这些要求。”\n\n接受第三方对云端数据进行安全、审计和维护的关键在于透明度。云计算提供商（如\
  \ `Microsoft`）必须详细说明其与安全相关的实践，并在其服务水平协议 (`SLAs`) 中包含保证的数据安全、审计、可用性和可靠性水平。\n\n微软的\
  \ Charlie McNney 在其 2009 年 5 月 27 日发布的“安全保护微软云基础设施”的文章中宣布（[`bit.ly/VeAWD`](http://bit.ly/VeAWD),\
  \ [`blogs.technet.com/gfs/archive/2009/05/27/securing-microsoft-s-cloud-infrastructure.aspx`](http://blogs.technet.com/gfs/archive/2009/05/27/securing-microsoft-s-cloud-infrastructure.aspx)，“微软的云基础设施其数据中心实现了审计标准\
  \ (SAS) 70 I 型和 II 型认证，以及 ISO/IEC 27001:2005 认证”。第 5 章“迁移到 Azure 云服务时风险最小化”描述了 `SAS\
  \ 70` 和 `ISO/IEC 27001:2005` 要求以及这些认证和证书的重要性。\n\n微软于 2009 年 7 月旬宣布了其 `Windows Azure`、`SQL\
  \ Azure` 和 `.NET Services` 的 SLA（[`bit.ly/16lKsY`](http://bit.ly/16lKsY), [www.microsoft.com/azure/pricing.mspx](http://www.microsoft.com/azure/pricing.mspx))\n\
  \n# 隔离多个租户的私有数据\n\n防止来自相同服务的组织的未授权用户访问应用程序数据的安全，是独立软件供应商 (`ISVs`) 在云计算中采用虚拟化最重要的动力之一。`Windows\
  \ Azure` 实现了一些多租户计算，也称为多租户功能。维基百科对这些功能的描述如下（[`bit.ly/bbgGH`](http://bit.ly/bbgGH),\
  \ [`en.wikipedia.org/wiki/Multi-tenant`](http://en.wikipedia.org/wiki/Multi-tenant)）：\n\
  \n\n\n\n\n多租户（Multitenancy）是软件架构中的一种原则，指单个软件实例运行在软件即服务（SaaS）供应商的服务器上，并为多个客户组织（租户）提供服务。多租户与多实例架构形成对比，后者为不同的客户组织建立独立的软件实例（或硬件系统）。在多租户架构中，软件应用程序的设计目标是能够对对其数据和配置进行虚拟划分，以便每个客户组织都能在一个自定义的虚拟应用程序实例上工作。\n\
  \n任职 `Azure` 的微软架构师 Gianpaulo Carrara 在其 2006 年 2 月 26 日的博客文章《Multi-Tenancy, metadata\
  \ driven everything and you are my #1 customer》中引入了多个租户数据混合的问题（链接：[`bit.ly/gbmKG`](http://bit.ly/gbmKG),\
  \ [`blogs.msdn.com/gianpaolo/archive/2006/02/26/539717.aspx`](http://blogs.msdn.com/gianpaolo/archive/2006/02/26/539717.aspx)）：\n\
  \n在纯多租户架构中，托管应用程序的单个实例能够为所有客户（租户）提供服务。与对每个请求行为都相同的更传统的“云端”Web 应用程序或 Web 服务不同，多租户架构允许在\
  \ UI（品牌化）、业务规则、业务流程和数据模型层进行针对特定租户的配置。这必须在不更改代码的情况下实现，因为所有租户共享相同的代码，因此将软件的定制化转变为软件的配置化。正如你所想象的，这驱动了对“元数据驱动一切”的明确需求。另一个主要挑战是在同一数据基础设施中共同存放多个租户的持久化数据（进行“混合”与“去混合”）。\n\
  \n换句话说，多租户应用程序的挑战在于：它的表现就像是完全为单个租户服务，但实际上是在同一个代码库上并行为所有客户提供服务。我将这种方法称为“你是我的头号客户”，这意味着每个客户都认为自己是头号客户，但实际上他们都由一位才华的客户代表提供服务。\n\
  \n这种架构的主要优势至少有两点：(a) 底层基础设施是共享的，允许通过负载的最优重新划分实现巨大的规模效应；(b) 因为昂贵的基础设施和应用程序开发成本是共享的，“企业级”应用程序也可以提供给非常小的企业，允许[其]触达市场的长尾。\n\
  \nCarraro 在 2008 年 7 月的“Software + Services for Architects”网络研讨会（链接：[`bit.ly/1addvS`](http://bit.ly/1addvS),\
  \ [`msdn.microsoft.com/en-us/architecture/aa699384.aspx`](http://msdn.microsoft.com/en-us/architecture/aa699384.aspx)）讨论了在“自力更生”与采用私有云和公共云计算的软件+服务方法之间平衡\
  \ SLA 的权衡。\n\n2008 年初，另一位微软架构师 Eugenio Pace 编写了一个多租户 `ASP.NET` 项目，使用 `SQL Server\
  \ Data Services (SSDS)`（`SQL Azure Database (SADB)` 的前身）代替 `SQL Server 200x` 作为数据源。Pace\
  \ 从 2008 年 3 月开始编写的五部分“Litware HR on SSDS”教程博客文章，描述了传统的（非云）多租户 Web 应用程序如何使用云 `S[S]DS`\
  \ 数据存储实现通用的多租户数据访问。该教程以一个 11 分钟的“LitwareHR on SSDS 端到端演示”结 n（链接：[`bit.ly/7BHKI`](http://bit.ly/7BHKI),\
  \ [`blogs.msdn.com/eugeniop/archive/2008/04/27/end-to-end-demo-of-litwarehr-on-ssds.aspx`](http://blogs.msdn.com/eugeniop/archive/2008/04/27/end-to-end-demo-of-litwarehr-on-ssds.aspx)），演示了如何自定义和使用单个租户站点，该站点具有专用的\
  \ `S[S]DS` 容器用于数据存储。\n\n设计多租户 `Azure` 应用程序并不是一个直观的过程，因为 `Azure Hosted Service` 的\
  \ `ServiceConfiguration.cfgfg` 文件指定了存储服务和实例数量。在编写此书时，微软尚未提供关于在 `Windows Azure` 上运行多租户项目的官方架构指导。\n\
  \n## 确保 Fabric 控制器（Fabric Controller）可用性\n\n`Azure FC` 是一个高可用故障转移集群，运行在五到七台机器上，每台机器都运行一个简化版的\
  \ `Azure OS` 核心。\n\n`FC` 集群实现了：\n\n*   具有自动故障转移的复制状态\n*   从故障主或次级 `FC` 节点无缝切换到新的主\
  \ `FC` 节点\n*   当所有 `FC` 副本都失败时继续服务\n*   通过“根 FC”实用程序进行滚动集群软件升级，该实用程序还负责管理集群\n\n\
  图 3.4 是一个具有两个次级 `FC` 节点的 `FC` 集群图（比最小值少三个）。\n\n图 3.4 一个具有主节点和两个次级节点的 `FC` 集群图。\n\
  \n![3.4](img/c03f004)\n\n以下是 图 3.4 中组件的描述：\n\n*   `FC Core` 负责心跳、状态和资源分配\n*   `Object\
  \ Model` 提供逻辑\n*   `Replication system` 用于 `FC`\n*   `Disks` 是 `FC` 成员的磁盘\n\n###\
  \ 为 Windows 服务器虚拟化\n\n服务器虚拟化的目标是最大化服务器利用率，在今天使用商品化服务器的情况下，利用率通常低于 50%。多租户通过在单台物理服务器上运行多个应用程序和服务，提高了每美元和每瓦特的性能。如果没有服务器虚拟化，随着硬件的普及，利用率将会降低。多租户允许\
  \ `Azure` 运行多个和和服务。\n\n图 3.5 描述了 `Windows Server 2008` 的 `Hyper-V hypervisor v1`；`Azure`\
  \ 运行五到七个客户分区。\n\n图 3.5 微软 `Hyper-V hypervisor v1` 具有一个主机 `VM` 和两个 `VM`。\n\n![3.5](img/c03f005)\n\
  \n以下是 图 3.5 组件的描述：\n\n*   `Guest OS` 是应用程序和服务的服务器操作系统（Windows Server 2008 Enterprise，带\
  \ IIS 7、.NET Fx 3.5 以及其他 Azure 扩展）。\n*   `Services` 是运行在 `guest OS` 上的自定义（Azure）应用程序和服务。\n\
  *   `Virtualization Stack (VSP, 虚拟化服务提供者)` 是虚拟化栈暴露的提供者，为 `child partition` 提供 I/O\
  \ 等资源或服务。\n*   `Virtualization Stack (VSC, 虚拟化客户端或消费者)` 是客户加载的用于消费资源或服务的软件模块。对于\
  \ I/O 设备，`虚拟化客户端`可以是操作系统内核加载的设备驱动程序。\n\n\n\n\n\n- `VMBus` 是一种共享内存 I/O 总线，实现了虚拟机（VMs）之间的高通信。\n\
  - `NICs` 是物理网络接口卡。\n- `CPUs` 是物理中央处理器，通常具有一个或多个核心。\n- `Disk(s)` 是用于根分区和客户分区的物理固定磁盘。\n\
  \nHyper-V 的主页位于 [`bit.ly/DnJtW`](http://bit.ly/DnJtW) 和 [www.microsoft.com/virtualization/default.mspx](http://www.microsoft.com/virtualization/default.mspx)。\n\
  \n# 在非微软数据中心部署 Azure 虚拟机管理程序\n\nIT 和通用管理层对于将云端应用程序和服务锁定在单一供应商处有严重的顾虑，并认为认为在多个平台即服务（PaaS）或基础设施即服务（IaaS）云平台上部署应用程序、服务、数据或这三者是非常困难甚至是不可能的。例如，`GAE`\
  \ 仅支持 `Python` 作为其编程语言。`AWS` 支持 `Windows Server 2003`，并且未来可能会兼容 `Windows Server\
  \ 2008`，但在没有适当虚拟机管理程序的情况下，你无法模拟服务器实例的多租户化。`Azure` 虚拟机管理程序是微软内部专属产品，`FC` 也是如此，因此将项目从\
  \ `Azure` 迁移到 `AWS` 需要对底层代码和部署方法进行重大修改。从一个供应商的云迁移大量数据到另一个更是挑战性。\n\nReuven Cohen\
  \ 创建了一个云计算互操作性论坛 Google Group（[`bit.ly/DBcJQ`](http://bit.ly/DBcJQ), [`groups.google.com/group/cloudforum`](http://groups.google.com/group/cloudforum)），旨在“定义一个通过应用程序集成和利益相关者合作来实现具有互操作性的企业级云计算平台的组织”。\n\
  \n2009 年 1 月底，微软云基础设施服务（Azure）团队主管 Hoi Vo 写了一篇博客文章（[`bit.ly/pfQSu`](http://bit.ly/pfQSu),\
  \ [`blogs.msdn.com/windowsazure/archive/2009/01/29/design-principles-behind-the-windows-azure-hypervisor.aspx`](http://blogs.msdn.com/windowsazure/archive/2009/01/29/design-principles-behind-the-windows-azure-hypervisor.aspx)），列出了\
  \ Windows Azure 虚拟机管理程序设计的三个原则：\n\n1. **高效（Efficient）**：尽可能将工作推给硬件。任何百分比的收益一旦乘以数万台机器，对我们来说都将意义重大。因此，我们可以利用新的处理器特性来为托管应用程序节省\
  \ `CPU` 周期。\n2. **极小足迹（Small footprint）**：移除所有不适用于我们特定云场景的功能。这保证了我们不必担心更新或修复不需要的代码，意味着减少了主机的变动或重启需求。所有关键代码路径也针对我们的\
  \ Windows Azure 场景进行了高度优化。\n3. **紧密集成（Tight integration）**：Windows Azure 虚拟机管理程序与\
  \ Windows Azure 内核进行了紧密优化。这是实现我们技术栈所需的扩展性和性能水平所需的。\n\nVo 表示，由于 `Azure` 虚拟机管理程序针对数据中心的标准服务器硬件设计进行了优化，因此不适合部署在微软数据中心之外。然而，`Azure`\
  \ 虚拟机管理程序的性能改进功能，如二级地址翻译（SLAT），将进入未来的 Hyper-V 版本。\n\n### 总结\n\nWindows Azure 操作系统基于\
  \ `Windows Server 2008 Enterprise Edition`，该系统运行在 `Fabric Controller` 之上，该控制器由自定义版本的微软\
  \ `Hyper-V` 虚拟机管理程序创建。`Azure Fabric` 为每个 `Hosted Service` 提供至少一个服务器 `CPU` 核心、1.7GB\
  \ 内存、100Mbs 网络连接、 250GB 临时存储（重启期间不会持久化），以及一个在早期的社区技术预览版中提供的、具有 50GB 持久存储的 `Azure\
  \ Storage Service` 账户。在发布版本中，`Hosted Services` 将能够通过付费请求并获取额外的资源和服务实例。\n\n`FC` 处理应用程序/服务的部署、负载均衡、操作系统/数据复制以及资源管理。它还部署项目，并在发布版本中自动添加实例以满足需求，管理项目软件升级，并处理服务器故障以维护项目可用性。`FC`\
  \ 将每个角色分配到其自己的虚拟机；角色实例运行在 fabric 节点上，通道连接各个角色。`WebRole` 实例接受 HTTP 或 HTTPS 请求，并使用\
  \ `ASP.NET`、`ASP.NET MVC` 或 `Silverlight` UI 进行响应。`WorkerRoles` 根据接收来自 `WebRoles`\
  \ 或 `Azure Queues` 中 `.NET Services` 的请求消息提供批处理服务。`FC` 运行在由五到七台服务器组成的高可用集群上以确保最大的可靠性。\n\
  \n和服务和存储被部署在 `Failure Domains`（故障域）中，其成员具有共同的故障点。存储占用主节点，主节点会复制到不同 `Failure Domains`\
  \ 中的至少两个其他节点上。对 Windows Azure 操作系统的滚动式服务软件升级和补丁是在一次对单个 `Upgrade Domain`（升级域）中的运行的服务进行。`FC`\
  \ 并行向 `Upgrade Domain` 的所有节点部署资源，因此 `Upgrade Domain` 中的所有已更新的服务在升级期间会临时离线。\n\n管理层对于将本地计算和数据存储迁移到云端的顾虑中，安全性和可用性是首要考虑。应用程序和存储安全性取决于云数据中心组件，这些组件比大多数本地数据中心更能抵抗攻击和未经授权的访问。云供应商必须提供服务水平协议，以消除潜在客户对迁移计算和数据存储的担忧。\n\
  \n云供应商锁定是考虑云计算的 IT 部门面临的另一个问题。平台即服务（如 `Windows Azure Platform`）比基础设施即服务（以 `Amazon\
  \ Web Services` 的 `EC2` 为代表）具有更高的锁定率，因为微软没有提供用于本地的自定义 虚拟机管理程序。`Windows Azure SDK`\
  \ 的开发 Fabric 不用于内部。\n\n# 第四章\n\n## Scaling Table and Blob Storage\n\n实现高扩展性需要云应用程序是无状态的，以便不依赖数据中心的负载均衡设备或软件将特定请求路由到特定的逻辑节点。然而，大多数应用程序和服务访问持久化在表中的数据，以及用于存储非结构化数据（如图像和文本文档）的二进制大型对象（blob）。\n\
  \n`Azure Storage Services` 为以下三种类型的数据提供高度扩展的持久存储：\n\n* **Tables** 是使用实体-属性-值（EAV）数据模型的结构化表格数据；实体所有属性值的最大大小为\
  \ 1MB。实体可以分组到存储分区中，分区维护在单一位置。\n* **Blobs** 由存储在字节数组中的非结构化文件数据组成；容器以分级分组存储大小达 50GB\
  \ 的单个 blob，模拟目录结构。只有 blob 容器及其内容可以公开。\n* **Queues** 包含存储在表的无限消息，供全局服务（通常是 Worker\
  \ 云服务）处理；消息的最大大小为 8KB。消息通常在读取它们的进程处理它们后被删除。队列是第八章“使用 Azure 队列”的主题。\n\n\n\n\n为了确保可用性和可靠性，所有存储的数据都由一个主节点和两个多个副本组成，存储在不同的故障域（Fault\
  \ Domains）中。当微软开放 Azure 服务平台供通用使用时，数据可以复制到多个数据中心，以确保在数据中心被毁时能够访问。\n\nSQL Azure Database\
  \ (`SADB$，以前称为 `SQL Data Services`、`SDS` 和 SQL Server Data Services，`SSDS`）是 Azure\
  \ Tables 的替代方案，提供了关系型表的许多功能。微软对 `SADB` 存储和网络入/出流量收取费用。`SADB` 是第 12 章“管理 SQL Azure\
  \ Database 账户、数据库和 DataHub”以及第 13 章“利用 SQL Azure Database 的关系特性”的主题。\n\n### 创建存储账户\n\
  \n早期的 Azure CTP 为测试人员的每个托管服务（Hosted Service）账户提供了两个存储账户。单个存储账户为表（tables）、二进制对象（blobs）和队列（queues）提供独立的\
  \ `URI`。当你作为请求注册 Azure 测试版账户的结果收到一个令牌 `GUID` 时，并按照第 2 章“Windows Azure 开发者门户”节所述创建托管服务账户，该\
  \ `token` 允许你创建两个具有不同前缀名的存储账户。\n\n## 使用托管服务令牌创建第一个存储账户\n\n要使用令牌创建存储账户，点击 `Account`\
  \ 选项卡及其 `Manage My Tokens` 链接打开 `Tokens` 页面，将 `token GUID`复制并粘贴到 `Resource Token\
  \ ID` 框中，并点击 `Claim Token` 为 `GUID` 为受限实体（Gated Entity）的存储账户组添加 `Compute Only` 桶，如图\
  \ 4.1 所示。\n\n图 4.1 Azure 开发者门户的 Tokens 页面，带有用于托管服务令牌的初始存储账户。\n\n![4.1](img/c04f001.jpg)\n\
  \n点击 `Claim Token` 和 `Continue` 按钮将打开 `My Projects` 页面。点击 `Project Name` 链接打开项目页面并点击\
  \ `New Service` 链接打开 `Project | Create a new service component` 页面，其中包含存储账户和托管服务的选项（参见图\
  \ 4.2）。\n\n图 4.2 在 Tokens 页面点击 Claim Token 按钮，使用对于第一个存储账户有效的令牌，将进入项目页面。\n\n![4.2](img/c04f002.jpg)\n\
  \n存储账户选择显示了你已兑取的托管服务令牌可用的存储账户数量（`project(s) remaining)`）。点击 `Storage Account` 图标打开\
  \ `Create a Project – Project Properties` 页面。输入唯一的 `Project Label` 并添加 `Project\
  \ Description`，如图 4.3 所示。\n\n图 4.3 在 Create a Project – Project Properties 页面为新的\
  \ blob 存储账户分配唯一的 Project Label。\n\n![4.3](img/c04f003.jpg)\n\n点击 `Next` 按钮打开 `Create\
