  \ AdventureWorksDWAZ2008R2 需要大约 25 分钟。\n\n生成数据库后，在 SSMS 中连接到你的 SQL Azure 实例并执行 `SELECT\
  \ * FROM dbo.ErrorLog` 查询，以验证过程是否无错误完成（参见 图 13.4）。\n\n使用 SSIS 填充本地 AdventureWorksLT2008\
