  ```\n\nURL 编码使用 `%20` 替换查询字符串中用于分隔 LINQ to REST 比较操作符及其参数所需的空格字符。\n\n### 示例列表 4-13：针对\
  \ Listings 4-12 请求的 HTTP GET 响应\n\n```http\nHTTP/1.1 200 OK\nCache-Control: no-cache\n\
  Transfer-Encoding: chunked\nContent-Type: application/atom+xml;charset=utf-8\nServer:\
  \ Table Service Version 1.0 Microsoft-HTTPAPI/2.0\nx-ms-request-id: eb64479-9245-4bec-d0a64a5e4c5\n\
  Date: Sun, 01 Mar 2009 18:09:49 GMT\n```\n\n为了简洁起见，省略了响应正文。\n\n| Execute…() 方法 |\
  \ 调用时的操作 |\n| :--- | :--- |\n| `Execute()` 或 `ExecuteWithRetries()` | 返回前 1,000\
  \ 个实体。 |\n| `ExecuteAll()` 或 `ExecuteAllWithRetries()` | 使用续期标记（continuation tokens）每\
  \ 1,000 个实体一组返回所有实体。 |\n| `ExecuteWithRetries()` 和 `ExecuteAllWithRetries()` | 查询使用\
  \ `TableDataServiceContext` 对象上设置的重试策略。 |\n\n## 通过替换值更新实体\n\nUpdate Customers 按钮用于切换在所有实体的\
  \ `CompanyName` 值上添加或移除加号（`+`）后缀。如前所述，实体是 Azure Tables 的基本单元，因此 REST API 定义了一个新的\
  \ `MERGE` 方法，该方法要求请求体包含所有实体的值，而不仅仅是需要更新的属性。`PartitionKey` 和 `RowKey` 值是不可变的，无法更新。在不允许自定义方法的情况下，ADO.NET\
  \ Data Services 库使用 POST 动词隧道和请求头来处理诸如 `MERGE` 等自定义方法的情况。你可以从 Pablo Castro 的“Merge\
  \ vs. Replace Semantics”中了解更多关于 `MERGE` 和 `PUT` 方法之间的差异。\n\n### 使用代码更新实体\n\n为了方便使用，SampleWeb\
  \ 项目有一个 Update 按钮，它执行 [Listing 4-14] 中的代码来切换 `CompanyName` 属性的加号后缀。\n\n```csharp\n\
  // Updates all entities individually the current page\nprotected void btnUpdate_Click(object\
  \ sender, EventArgs e)\n{\n  Stopwatch timer = new Stopwatch();\n  timer.Start();\n\
  \  // Create the service context against\n  CustomerDataContext serviceContext =\
  \ new CustomerDataContext(account);\n  serviceContext.RetryPolicy = RetryPolicies.N(3,\
  \ TimeSpan.FromSeconds(1));\n  var results = from c in serviceContext.CustomerTable\n\
  \                select c;\n  TableStorageDataServiceQuery<CustomerDataModel> query\
  \ =\n      (results as DataServiceQuery<CustomerDataModel>);\n  IEnumerable<CustomerDataModel>\
  \ queryResults =\n      query.ExecuteAllWithRetries();\n  // Toggle them as updated\n\
  \  foreach (var result in queryResults)\n  {\n    if (result.CompanyName.Contains(\"\
  +\"))\n    {\n      result.CompanyName = result.CompanyName.Substring(0, result.CompanyName.Length\
  \ - 1);\n    }\n    else\n    {\n      result.CompanyName += \"+\";\n    }\n   \
  \ serviceContext.Update(result);\n  }\n  serviceContext.SaveChanges();\n  // Display\
  \ the current page\n  customersView.DataSource = null;\n  customersView.DataSourceID\
  \ = \"data\";\n  customersView.DataBind();\n  txtTime.Text = (timer.ElapsedMilliseconds\
  \ / 1000).ToString(\"0.000\");\n}\n```\n\n### 使用 MERGE 方法更新实体\n\n[Listing 4-15]\
