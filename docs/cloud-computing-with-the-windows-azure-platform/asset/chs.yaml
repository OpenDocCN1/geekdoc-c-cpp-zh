  \ LINQ 的 `where` 和 `take()` 标准查询操作，用于检索 `Country` 属性值为 USA 的前八个 Customer 实体。`Page_Load`\
  \ 事件处理程序分配了 `serviceContext` 实例。\n\n### 示例列表 4-11：检索并显示美国前八个 Customer 实体的代码\n\n\
  ```csharp\n// Retrieve and display first eight Customer entities in the USA\nvar\
  \ results = (from c in serviceContext.CustomerTable\n              where c.Country\
  \ == \"USA\"\n              select c).Take(8);\n\nTableStorageDataServiceQuery<CustomerDataModel>\
  \ query =\n   new TableStorageDataServiceQuery<CustomerDataModel>\n      (results\
  \ as DataServiceQuery<CustomerDataModel>);\n\nIEnumerable<CustomerDataModel> result\
  \ = query.ExecuteAllWithRetries();\n\ncustomersView.DataSourceID = null;\ncustomersView.DataSource\
  \ = result;\ncustomersView.DataBind();\n```\n\n执行上述代码将生成 [Listing 4-12] 和 [4-13]\
  \ 中的 HTTP GET 请求和响应。下表描述了 `TableStorageDataServiceQuery` 对象支持的四个 `Execute…()` 方法：\n\
  \n### 示例列表 4-12：针对美国前八个 Customer 实体的 HTTP GET 请求\n\n```http\nGET /CustomerTable()?$filter=Country%20eq%20'USA'$&$top=8\
  \ HTTP/1.1\nUser-Agent: Microsoft ADO.NET Data Services\nx-ms-date: Sun, 01 Mar\
  \ 2009 18:10:19 GMT\nAuthorization: SharedKeyLite oakleaf:RzHMRAy/Hj/Dn/Z7UZKacAY2Y4LnVC6MMvOt7YF+Xtc=\n\
  Accept: application/atom+xml,application/xml\nAccept-Charset: UTF-8\nDataServiceVersion:\
