  \n### 以 1MB 块将 Blob 上传到 Azure 服务\n\n大小大于 64MB 的 Blob 必须以 4MB 或更小的块上传到 Azure Blob\
  \ Storage；您可以在单次操作中上传小于 64MB 的文件。使用块（blocks）来组装大 Blob 允许并行上传以提高性能，并在连接出现问题时能够恢复上传。\n\
  \n执行 `blobContainer.CreateBlob(properties, fileBlob, true);` 指令会为每个 1MB 或更小的块生成\
  \ PUT 请求头和响应头，其与 `[Listings 4-23]` 和 `4-24` 中所示的类似。\n\n### [Listing 4-23] 向 Azure\
  \ Blob Storage 上传 2.36MB 位图 Blob 的 1MB 块的 HTTP PUT 请求\n\n```http\nPUT /oakleaf2store/2009-02-26T21%3a04%3a55.8384887Z.bmp?comp=block&blockid=AQAAAA%3d%3d&timeout=30\
  \ HTTP/1.1\nx-ms-date: Thu, 26 Feb 2009 21:05:25 GMT\nContent-Type: image/bmp\n\
  x-ms-meta-FileName: AzureBlob1024.bmp\nx-ms-meta-CreateTime: 0.000\nx-ms-meta-Submitter:\
  \ Azure User\nx-ms-meta-UploadTime: 8.932\nAuthorization: SharedKey oakleaf2:frBWGtgXfH8bjaexWvBm5Z+wpFnWtrS5TKduk4wrzL0=\n\
  Host: oakleaf2.blob.core.windows.net\nContent-Length: 1048576\nExpect: 100-continue\n\
  ```\n\n### [Listing 4-24] 上传到 Azure Blob Storage 的 2.36MB 位图 Blob 的 1MB 块的 HTTP\
  \ PUT 响应\n\n```http\nHTTP/1.1 201 Created\nTransfer-Encoding: chunked\nContent-MD5:\
  \ m10f0+eN72dLslV53O6qpQ==\nServer: Blob Service Version 1.0 Microsoft-HTTPAPI/2.0\n\
  x-ms-request-id: 33363ac5-daf7-4ced-8194-b6d15bde008c\nDate: Thu, 26 Feb 2009 21:04:06\
  \ GMT\n```\n\n### 下载选定的 Blob\n如前所述，在 `GridView` 列中点击图像类型 Blob 的文件名将在其单独的窗口中打开图像。应用程序类型的\
  \ Blob 通常会打开一个文件对话框。\n\n### 在浏览器或对话框中打开选定的 Blob\n`Listing 4-25` 中 `Default.aspx`\
