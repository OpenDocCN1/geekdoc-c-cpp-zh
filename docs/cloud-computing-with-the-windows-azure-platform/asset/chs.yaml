  \n## 迁移到客户端检测新增的缩略图\n\nSteve Marx 在 2009 年 4 月 22 日的“Scalability and Cost Issues\
  \ with Windows Azure and WorkerRole Projects – Live Demo”博客文章（http://oakleaf.blogspot.com/2009/04/scalability-issues-with-azure.html）中建议改进。他建议使用\
  \ AJAX 远程过程调用（RPC，而非 HTTP）调用 Web 服务器，询问刚刚上传的 blob 是否已有缩略图。一旦有了缩略图，就触发 UpdatePanel\
  \ 异步回回，然后停止轮询。这种方法让上传的用户能立即看到缩略图，但其他用户必须手动刷新浏览器才能看到新增的缩略图。\n\n以下 建议的步骤：\n\n1. 在\
  \ `FileUpload` 和 `Button` 控件下方添加 `HiddenField` 以存储新 blob 的名称：\n```asp\n<asp:HiddenField\
  \ ID=\"uploadedBlobName\" runat=\"server\" />\n```\n\n2. 在 `submitButton_Click`\
  \ 事件处理程序中添加设置 `uploadedBlobName` 值的代码：\n```csharp\nuploadedBlobName.Value = props.Name\n\
  ```\n\n3. 添加一个静态方法处理轮询：\n```csharp\n[WebMethod]\npublic static bool IsThumbnailReady(string\
  \ name)\n{\n  return BlobStorage.Create(StorageAccountInfo.GetDefaultBlobAccountFromConfiguration()).\n\
  \  GetBlobContainer(\"photogallery\").\n  DoesBlobExist(string.Format(\"thumbnails/{0}\"\
  , name));\n}\n```\n\n4. 为 `ScriptManager` 添加 `EnablePageMethods=\"true\"` 以启用静态方法：\n\
  ```asp\n<asp:ScriptManager ID=\"sm1\" runat=\"server\" EnablePageMethods=\"true\"\
  \ />\n```\n\n5. 在 `</body>` 元素后添加客户端脚本来执行轮询：\n```javascript\n<script type=\"text/javascript\"\
  >\n    Sys.WebForms.PageRequestManager.getInstance()\n    .add_loaded(function(sender,\
  \ args) {\n      if (args.get_updated() == '') {\n        var blobname = get('<%=uploadedBlobName.ClientID').value;\n\
  \        if (blobname != '') {\n          checkReady(blobname);\n        }\n   \
  \   }\n    });\n    function checkReady(blobname) {\n      PageMethods.IsThumbnailReady(blobname,\
  \ function(result) {\n        if (result) {\n          doPostBack('<%=up1.ClientID\
  \ %>', '');\n        } else {\n          setTimeout(function() { checkReady(blobname)\
  \ }, 1000);\n        }\n      });\n    }\n</script>\n```\n\n添加上述代码会在提交新图像 blob 后每秒进行一次轻量级的“缩略图准备好了吗”探测。该操作包含\
