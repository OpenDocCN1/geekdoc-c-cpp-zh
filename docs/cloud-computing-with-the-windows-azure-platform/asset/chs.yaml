  \ 的 `FileURI`，如 `http://oakleaf2.blob.core.windows.net/oakleaf2store/2009-02-26T19:53:07.748188Z.bmp`\
  \ Target=\"_blank\"，以便在新窗口中打开 BMP 文件。\n\n### 在 GridView 中删除选定的 Blob\n`Listing 4-28`\
  \ 包含了从当前列表中找到选定的 Blob 并调用 `Delete()` 方法将其删除的代码。\n\n#### [Listing 4-28] GridView\
  \ 控件中删除 Blob 的代码（不可扩展）\n```csharp\n// 处理 DeleteItem 命令\nprotected void RowCommandHandler(object\
  \ sender, GridViewCommandEventArgs e)\n{\n    if (e.CommandName == \"DeleteItem\"\
  )\n    {\n        // 清空状态消息\n        statusMessage.Text = null;\n        // 获取 计数\n\
  \        IEnumerable<object> blobList = blobContainer.ListBlobs(String.Empty, false);\n\
  \        if (blobList.Count() > 3)\n        {\n            // 多用户可能有超出范围的索引值\n \
  \           try\n            {\n                int index = Convert.ToInt32(e.CommandArgument);\n\
  \                if (index < fileView.DataKeys.Count)\n                {\n     \
  \               string blobName = (string)fileView.DataKeys[index].Value;\n    \
  \                if (blobContainer.DoesBlobExist(blobName))\n                  \
  \  {\n                        // 开始删除耗时\n                        sw.Reset();\n \
  \                       sw.Start();\n                        blobContainer.DeleteBlob(blobName);\n\
  \                        lblTime.Text = (sw.ElapsedMilliseconds / 1000D).ToString(\"\
  ###0.000\");\n                    }\n                }\n            }\n        \
  \    catch (Exception ex)\n            {\n                statusMessage.Text = \"\
  无法删除项目。\" + ex.Message;\n                if (doWriteLogs)\n                {\n \
  \                   RoleManager.WriteToLog(\"Error\", statusMessage.Text);\n   \
  \             }\n            }\n        }\n    }\n    else\n    {\n        statusMessage.Text\
  \ = \"你必须在 GridView 中保留至少 3 个 Blob 供其他用户使用。\";\n    }\n}\n\nUpdateFileList();\n\
  }\n```\n\n\n\n\n列表中所使用的删除方法是不可扩展的，因为它依赖于 `blobList` 在选择到执行 `DeleteBlob()` 方法之间的间隔内保持不可变性。该间隔可能只有微秒或更短，但它在处理过程中引入了不可接受的不确定性。如果\
  \ `e.Command` 返回的是 GridView 的索引值而不是索引位置，则可以使用该值配合 `DoesBlobExist` 测试来删除 blob，而不会产生不确定性。\n\
  \n# 使用 HTTP DELETE 请求删除 GridView 中选中的 Blob\n\n执行 `DeleteBlob()` 方法会生成 HTTP DELETE\
  \ 请求和响应头，详见列表 4-29 和 4-30。\n\n列表 4-29: 来自 Azure Blob Storage 的 2.36MB 位图 blob 的\
  \ HTTP DELETE 请求\n\n```\nDELETE /oakleaf2store/2009-02-26T20%3a10%3a00.7204059Z.bmp?timeout=30\
  \ HTTP/1.1\n\nx-ms-date: Thu, 26 Feb 2009 20:38:27 GMT\n\nAuthorization: SharedKey\
  \ oakleaf2:o4KZgoYFlaUymMACWp7NTmx81PzVR3Ydg5bHErVDUVQ=\n\nHost: oakleaf2.blob.core.windows.net\n\
  \nContent-Length: 0\n```\n\n列表 4-30: 来自 Azure Blob Storage 的 2.36MB 位图 blob 的 HTTP\
  \ DELETE 响应\n\n```\nHTTP/1.1 202 Accepted\n\nServer: Blob Service Version 1.0 Microsoft-HTTPAPI/2.0\n\
  \nx-ms-request-id: 03717cbb-dc34-4b97-b7aa-a3f3d8e353a3\n\nDate: Thu, 26 Feb 2009\
  \ 20:38:47 GMT\n\nContent-Length: 0\n```\n\n# 利用新的 Copy Blob 和 Get Blob List 方法\n\
  \nWindows Azure SDK (2009 年 5 月 CTP) 引入了新的 Copy Blob PUT 和 Get Blob List GET 请求方法。与用于表的\
  \ Copy Blob 的新 EGTs 一样，你必须指定值为 `2009-04-14` 的 `x-ms-version` 请求头。Copy Blob 将 blob\
  \ 复制到存储账户内的目标位置；Get Blob List 检索作为 blob 部分已上传的块列表；2009 年 5 月的 CTP 版本允许你指定已提交、未提交或所有块的列表。\n\
  \nCopy Blob 的在线帮助请参阅 [`bit.ly/u0e5y`](http://bit.ly/u0e5y), [`msdn.microsoft.com/en-us/library/dd894037.aspx`](http://msdn.microsoft.com/en-us/library/dd894037.aspx)，Get\
  \ Blob List 请参阅 [`bit.ly/sQxbA`](http://bit.ly/sQxbA), [`msdn.microsoft.com/en-us/library/dd179400.aspx`](http://msdn.microsoft.com/en-us/library/dd179400.aspx)。\n\
  \n2009 年 5 月 CTP 的开发环境以及示例 `StorageClient` 封装器的实现不支持 Copy Blob 或 Get Blob List 操作，因此你无法使用使用\
  \ `StorageClient` 对象的传统 .NET 代码来执行这些方法。\n\nSteve Marx 的文章“新 Windows Azure Blob 特性的示例代码”([`bit.ly/JjRuS`](http://bit.ly/JjRuS),\
  \ [`blog.smarx.com/posts/sample-code-for-new-windows-azure-blob-features`](http://blog.smarx.com/posts/sample-code-for-new-windows-azure-blob-features))\
  \ 包含了一个更新后的 `StorageClient` 库和一个演示这两个方法的简单测试程序。\n\n## Azure Blobs 的后期更改\n\nAzure\
  \ 团队于 2009 年 8 月 11 日宣布了针对 `x-ms-version` 的以下三个新功能：Azure Blobs 的 `2009-7-17`：\n\n\
  *   **使用 PutBlockList 更新 Blob**：使用 `PutBlockList` 更新 blob 的内容，这允许你对现有 blob 添加块、删除块、替换块、重排现有块顺序或这些操作的任意组合。你只需要上传想要添加或更改的块。\n\
  *   **根 Blob 容器 (Root Blob Container)**：所有存储账户现在都可以有一个根 blob 容器。这允许应用程序使用域名地址存储和引用\
  \ blob，例如示例所示：\n    * [`myaccount.blob.core.windows.net/picture.jpg`](http://myaccount.blob.core.windows.net/picture.jpg)\n\
  *   **共享访问签名 (Shared Access Signatures)**：你使用存储账户密钥对请求的规范化处理计算哈希值以创建一个签名。该签名可以作为\
  \ URL 用于提供 blob 的访问。例如，要创建一个容器，请执行以下 `PUT`：\n    [`myaccount.blob.core.windows.net/picture.jpg`](http://myaccount.blob.core.windows.net/picture.jpg)?se=2009-07-17&sr=c&sp=r&sig=xUXiV0M0G6\n\
  \n\n\nAzure Tables 使用无模式的 `Entity-Attribute-Value`（实体-属性-值）数据模型，而不是常用的关系模型，因为固定架构的关系表难以扩展到\
  \ TB 或 PB 级，且在达到这些规模后进行重构也非常困难。所有表都包含三个系统属性（属性）：`PartitionKey`、`RowKey` 和 `Timestamp`。分区定义了表一致性的单元；`PartitionKey`\
  \ 和 `RowKey` 值定义了表的复合主键。自定义属性是一个属性包，其成员可以在表内发生变化。Google App Engine 的 Data Store\
  \ 和 Amazon Web Service 的 SimpleDB 使用 EAV 数据模型，并使用模拟 SQL 子集的查询语言来返回结果集。Azure 使用 `LINQ`\
  \ to REST` 查询，结合 `ADO.NET Data Services` 和 `StorageClient` 类来返回实体集合。本章节提供了使用 `LINQ`\
  \ 或 REST API 在 Azure Tables 上进行 CRUD 操作的示例。\n\nAzure Blobs 由长度最高 50GB 的字节节（命名字节数组）组成，适用于任何注册或实验性的媒体类型。64MB\
  \ 或更小的数组可以直接存储在 blob 中；大数组通过上传多个长度不超过 4MB 的块来创建。从块组装 blob 允许并行上传块并在中断后恢复块组装。命名的容器可以存储无限数量的\
  \ blob，并可被指定为公开或私有可读。本章节包含了使用 REST API 或访问 `StorageClient` 类的 `.NET` 代码创建、检索和删除\
  \ blob 的示例。\n\n## 第二部分：在企业中利用云服务\n\n### 第 5 章：迁移到 Azure 云服务时的风险最小化\n### 第 6 章：服务用户的身份验证与授权\n\
  ### 第 7 章：优化 Azure Tables 的扩展性与性能\n### 第 8 章：使用 Azure Queues 进行通信\n\n## 第 5 章：迁移到\
  \ Azure 云服务时的风险最小化\n\n前面的章节提到，Windows Azure 平台利用开发者 `Visual Studio` 的 `C#` 或 `VB`\
  \ 编程知识的能力是 Windows Azure 平台的主要卖点，它必须与根深蒂固的云计算对手进行竞争——例如 Amazon Web Services 的弹性计算云\
  \ (`EC2`) 和 Google App Engine。你可能会从 Azure 的营销材料中推断出，只需获取现有的 `ASP.NET` 网站，调整其 `Web.config`\
  \ 设置和 SQL Server 连接字符串，然后将其上传到微软数据中心部署到 Windows Azure 即可。\n\n一如既往，现实与营销宣传大相径庭。正如你在本章中看到的，获得管理层的认可可能比开发一个全新的项目或升级现有项目花费更多的时间精力。其他障碍包括：\n\
  \n*   从 `ASP.NET` 网站迁移到 Web 项目\n*   将数据迁移到 `Azure Tables`、`Blobs` 或 `SQL Data Services`\
  \ 数据库\n*   将 Web 项目移动到 Azure 托管服务并连接到 `Azure` 或 `SQL Azure Database`\n*   说服 IT\
  \ 和企业管理层在 Windows Azure 中托管应用程序不会带来重大的业务中断或违反法规的风险\n\n至少在 Azure 的早期阶段，你会发现最后一项是到目前为止最难克服的问题。\n\
  \n### 绕过云计算的障碍\n\n你进行 Azure 开发的第一步是说服 IT 和高层管理人员云是现有或新项目的合适托管环境。最初的反对可能与寄托给第三方提供比你本地\
  \ IT 部门更好的应用程序可用性有关。在存储和传输过程中保持有价值业务信息的完全机密性，是所有关于云计算意向的管理调查中的首要关注。尽管仅使用微软或大部分使用微软的企业习惯了\
  \ Windows 锁定，但管理层无疑会对应用程序在多个提供商云之间的可迁移性感兴趣。\n\n《云之上：伯克利视角下的云计算》（Above the Clouds:\
  \ A Berkeley View of Cloud Computing）是加州大学伯克利校可靠适应分布式系统实验室（也称为 `RADLab`；[`http://radlab.cs.berkeley.edu/`](http://radlab.cs.berkeley.edu/)）于\
  \ 2009 年 2 月发布的白皮书，其受到广泛关注部分是因为中中立。“云之上”包含了以下表格，说明了 IT 高管和高层管理人员在考虑为组织采用云计算时最关心的的问题：\n\
  \n| 云计算增长的 10 大障碍与机遇 | | |\n| :--- | :--- | :--- |\n| 1 | 服务可用性 | 使用多个云提供商；利用弹性防止分布式拒绝攻击\
  \ |\n| 2 | 数据锁定 | 标准化 `APIs`；使用兼容软件以实现突发计算 |\n| 3 | 数据机密性和可审计性 | 部署加密、`VLANs`、防火墙；地理位置数据存储\
  \ |\n| 4 | 数据传输瓶颈 | 使用隔夜快递传输磁盘；数据备份/存档；高带宽交换机 |\n| 5 | 性能不可预测性 | 改进的 `VM` 支持；闪存；群组调度\
  \ `VMs` |\n| 6 | 可扩展存储 | 发明一种可扩展的存储器 |\n| 7 | 大型分布式系统中的 Bug | 发明一种依赖分布式 `VMs` 的调试器\
  \ |\n| 8 | 快速扩展 | 发明一种依赖 `ML` 的自动伸缩器；使用快照进行保护 |\n| 9 | 声誉/命运共担 | 提供类似电子邮件那样的声誉保护服务\
  \ |\n| 10 | 软件许可 | 按需付费许可；批量使用销售 |\n\n接下来的章节将涉及上述列表中大多数云计算观察者认为最顽固的障碍。\n\n`ML` 是一种通用的函数式编程语言，也是元语言的缩写。\n\
  \nBernard Golden 为 CIO 网站撰写的文章《云计算：伯克利能教给你什么》（Cloud Computing: What UC Berkeley\
  \ Can Teach You）发表于 [`http://bit.ly/PCLZA`](http://bit.ly/PCLZA)），是从 IT 管理的角度对该白皮书进行的评论。\n\
  \n### 最大化数据可用性与最小化安全风险\n\n如今的云基础设施可用性可能优于企业本地 IT 服务。可用性通常用“几个 9”来衡量，例如，四个 9 代表服务可用时间为\
  \ 99.99%。30 天有 43200 分钟，因此实现四个 9 可用性意味着每月最多允许 4.32 分钟（43200 分钟的 0.01%）的计划或非计划停机。\n\
  \n电信系统和数据中心通常设计为实现五个 9 可用性，这对应于每月少于 30 秒的停机。云计算供应商最终必须签署服务水平协议（SLA），规定具体的应用程序可用性。客户想要五个\
  \ 9，但看起来供应商可能只提供三个 9；例如，微软在 2009 年 7 月中宣布其 SLA 将涵盖两个或多个 Azure 服务实例 99.95% 的运行时间保证，并提供存储服务\
  \ 99.9% 的可用性。同样，Amazon Web Services 为 `EC2` 保证 99.95% 的运行时间，为 `S3` 保证 99.9%。当本书编写时，Google\
  \ 尚未为 Google App Engine 发布 SLA。\n\n\n\n\n无论适用的 SLA 如何，您的应用程序从灾难性故障中恢复（需要从备份副本中恢复应用程序、数据或两者）所需的时间可能远长于停机时间。Azure\
  \ 提供了三次复制的数据故障转移集群，并在发生故障时运行 `Hosted Application` 实例。集群化应用和复制数据的真实世界恢复时间仍有待测量。\n\
  \n《云之上》（Above the Clouds）的作者记录了 2008 年亚马逊简单存储服务 (`S3`)、Google App Engine 和 Gmail\
  \ 的停机机事件，并在出版物的表 7 中列出了停机解释，并附有以下注释：“请注意，尽管这些停机引起了负面宣传，但很少有企业 IT 基础设施能达到这种水平。”\n\
  \n### IT 相关风险的定义\n\n美国国家标准与技术研究院 (`NIST`)（前身为国家标准局）将 IT 相关的风险定义为：\n\n考虑到以下因素的净任务影响：(1)\
  \ 特定威胁源实施（意外触发或蓄意利用）特定信息系统漏洞的概率，以及 (2) 如果这种情况发生将会产生的影响。IT 相关风险的产生由于以下原因导致的法律责任或任务损失：\n\
  \n1. 未经授权的（恶意或意外）信息泄露、修改或破坏。\n2. 无意错误和遗漏。\n3. 自然灾害或人为灾害导致的 IT 中断。\n4. 在 IT 系统的实施和运行中未能尽到注意和勤勉。\n\
  \n上述定义是美国国家标准与技术研究院特别出版物 (`NIST SP`) 800-53 修订第 2 版的一部分，该文件提供了通过采用安全控制来保护联邦政府内部信息系统的指南。这些指南适用于所有处理、存储或传输联邦信息的信息系统的方面，但由\
  \ `44 United States Code (U.S.C), Section 3542.` 定义的国家安全系统除外。`NIST 800-53 Rev. 2`\
  \ 旨在联邦机构实现联邦信息处理标准 (`FIPS`) 200（联邦信息和信息系统最低安全要求）基准提供指导。\n\n联邦政府在 IT 计划方面历史复杂，有许多采用新技术的显性失败尝试。然而，云计算的成功部署以及随之而来的旨在减少公共部门\
  \ IT 风险的治理系统，将改善可用性和安全性问题，并推动私营部门的采用。联邦对私营部门云计算的贡献可能集中在维护数据可用性和安全性的正式标准上。联邦和许多州政府对识别个人的数据有隐私法规。\n\
  \n奥巴马政府对云计算提案可能比其前任更有。例如，《ComputerWorld》杂志记者 Patrick Thibodeau 在 2009 年 3 月 5 日在其名为《新联邦\
  \ CIO Vivek Kundra 想要 Web 2.0 政府》的文章中报道：\n\n```\n美国政府首位 CIO Vivek Kundra 今天介绍自己为一个将通过采用消费级技术并确保政府数据开放可访问，从而采取积极行动改变联邦政府\
  \ IT 使用情况的人。\n```\n\nKundra 还想利用云计算等技术来打击政府对大额合同面子工程的文化，以及其雇佣最终“长期在职名单上”承包商的做法。\n\
  \nAzure Web 服务通过对存储的数据进行至少三次复制，并为不同的 Microsoft 数据中心提供副本的可选地理位置以提供灾难恢复服务，确保应用程序的可用性。\n\
  \n### NIST 的构想\n\n第一章“云计算关注”部分介绍了“云计算与标准的观点” (`http://bit.ly/x054z`, `http://csrc.nist.gov/groups/SMA/ispab/documents/minutes/2008-12/cloud-computing-standards_ISPAB-Dec2008_P-Mell.pdf`)，这是\
  \ `NIST` 信息技术实验室 Peter Mell 和 Tim Grance 的演示文稿。该演示以基于标准的云计算的联邦定义开始，并提出了一个“想法：联邦政府确定最低标准和架构，以便机构能够创建或购买互操作的云能力。”随后简要列出了采用云计算的益处和方法，这些方法同样适用于私营部门。\n\
  \n该演示结束时列出了将在 2009 财年创建的 `NIST 特别出版物 (SPs)` 列表：\n\n* 云计算概览\n* 云计算安全问题\n* 云架构安全\n\
  * 云应用安全\n* 在云中实现并执行法证调查\n* 在云架构中实现安全监控集中\n* 通过服务水平协议从第三方云架构获取安全性\n* 安全合规框架与云计算（例如，`HIPAA`、`FISMA`\
  \ 和 `SOX`）\n\n随后，`NIST` 发布了他们的 `NIST 云计算工作定义草案 v13` (`http://bit.ly/10TNdu`, `http://csrc.nist.gov/groups/SNS/cloud-computing/cloud-def-v14.doc`)\
  \ 和 `有效且安全地使用云计算范式的演示 v18` (`http://bit.ly/17PKbM`, `http://csrc.nist.gov/groups/SNS/cloud-computing/cloud-computing-v22.ppt`)。\n\
  \n当这本书在 2009 年初编写时，`NIST` 出版物页面上只有少数上述的 `SPs` 以草案或最终形式可用（`http://bit.ly/sJECD`,\
  \ `http://csrc.nist.gov/publications/`）。请关注这些页面以获取待处理的标准；`NIST` 经常更新其出版物列表。\n\n\
  ### 国防部潜在的云计算部署\n\n国家安全局由信息保障架构与系统工程小组首席架构师 Chris Kubic 提供的“国防部云计算安全挑战”简报描述了潜在的军事云应用\
  \ (`http://bit.ly/171BzF`, `http://csrc.nist.gov/groups/SMA/ispab/documents/minutes/2008-12/cloud-computing-IA-challenges_ISPAB-Dec2008_C-Kubic.pdf`)，这些应用部分包含以下：\n\
  \n* 网络网络防御：传感器数据存储、分析、态势感知\n* 共同作战态图的战场感知：部队、任务、车辆、武器、供应品的状态；未来——自主（无人）武器系统\n* 战术情报、监视、侦察\
  \ (`ISR`) 馈数据的存储/处理；根据用户的访问权限创建定制化视图\n* 仿真与视觉化：任务规划与训练\n\n军事和其他安全密集型机构对云计算的战术化使用将减少\
  \ IT 组织对云计算本质上不可靠且不安全的担忧。\n\n### 获取和审计监管合规性\n\n\n\n\n目前美国有若干项与数据安全和隐私相关的法律法规生效。这些包括《格拉姆-莱奇-布莱利法案》（`GLB\
  \ Act`）、《萨班斯-奥克斯法案》（`SOX`，又称为 2002 年公共公司会计改革和投资者保护法案）、《健康保险流动性与责任性法案》（`HIPAA`）以及《反海外腐败法》。英国的伦敦交易所联合准则和南非的《南非公司治理报告》（`King\
  \ II`）监管着财务报告的透明度。欧洲共同体的第 `95/46/EC` 号指令关于保护个人数据，旨在保护数字信息及其通信中的个人隐私。\n\n以下是三项最重要的联邦监管合规指令以及一项涉及身份管理、风险评估或两者的关键私营部门标准。大多数机构都会实施一项计划，以确保敏感数据的安全性、机密性（当信息涉及员工或消费者的个人身份时为隐私性）和完整性。这些计划通常需要接受独立安全审计师的定期测试，以确保合规。\n\
  \n## 格拉姆-莱奇-布莱利法案\n\n`GLB Act` 将非公开信息定义为包括消费者的姓名、地址、电话号码、出生日期、社会安全号码，以及从消费者向金融机构提供此类信息的任何申请或表格中获得的任何其他信息。`GLB\
  \ Act` 将至少以下类型的机构视为金融机构：非银行抵押贷款贷款人、贷款经纪人、某些财务或投资顾问、债务催收员、税表编制人员、银行和房地产结算服务提供商。\n\
  \n根据维基百科，`GLB` 的“保护规则”（`Safeguards Rule`，“`Subtitle A：非公开个人信息的披露”，编码为 `15 U.S.C.\
  \ Sections 6801–6809`）“要求金融机构制定一份书面信息安全计划，说明公司如何准备以及计划继续保护客户的非公开个人信息。（保护规则也适用于不再是该金融机构消费者的个人信息）”。\n\
  \n信息安全计划必须包含：\n\n*   开发、监控和测试一项旨在确保信息安全的程序\n*   根据信息收集、存储和使用方式的变化，根据需要调整保护措施\n*\
  \   对每个处理非公开信息的部门构建详尽的`risk management`\n*   指定至少一名员工来管理保护措施\n\n显然，将此类信息从本地数据中心移动到第三方的云数据中心将涉及\
  \ `GLB` 报告和合规审计流程的变更。\n\n## 萨班斯-奥克斯法案\n\n`SOX` 仅适用于上市公司，是由国会为了应对一系列大型企业欺诈事件而通过的，主要是针对\
  \ 2000 年至 2004 年间 `Enron`、`WorldCom` 和 `Tyco` 实施的行为。`SOX` 旨在提高公司报告的透明度。其规定旨在：\n\n\
  *   减少或消除同时提供服务的独立财务审计师的利益冲突，以及接受投资银行家报酬的证券分析师的利益冲突\n*   加强董事会审计委员会对独立财务审计师的监督\n\
  *   通过大幅增加预算加强`证券交易委员会`（`SEC`）的监督\n*   要求将员工股票期权作为运营费用进行记账\n\n根据维基百科（[`bit.ly/skaSn`](http://bit.ly/skaSn)，[`en.wikipedia.org/wiki/Sarbanes-Oxley_Act`](http://en.wikipedia.org/wiki/Sarbanes-Oxley_Act)），`公共会计监督委员会`（`PCAOB`）于\
  \ 2007 年 7 月 25 日批准了针对公共会计师的第 5 号审计标准。`SEC` 也于 2007 年 6 月 27 日发布了其解释性指南。后者通常与 `PCAOB`\
  \ 的指南一致，但旨在为管理层提供指导。管理层和独立审计师都有责任在自上下的风险评估范围内进行评估，这要求管理层将其评估范围和收集的证据基于风险。这使得管理层在评估方法上有更大的裁量权。这两项标准要求管理层：\n\
  \n*   在重大错报风险的背景下，评估与重大账户和相关声明相关的选内部控制的设计和运行有效性\n*   理解交易流程（包括 IT 方面），并足以识别可能产生错报的点\n\
  *   评估公司级（实体级）控制，这些对应于`特德德委员会指导组织委员会`（`COSO`）框架（[www.coso.org/](http://www.coso.org/)）的组件\n\
  *   进行欺诈风险评估\n*   评估旨在防止或检测欺诈的控制，包括管理层违背控制\n*   评估期末财务报告过程的控制\n*   根据公司的规模和复杂性调整评估范围\n\
  *   根据能力、客观性和风险等因素依赖管理层的工作\n*   对财务报告内部控制的充分性得出结论\n\n`SOX` 的一个核心原则是数据完整性。将财务交易和相关数据从公司现场移动到云数据中心并不一定会增加风险。然而，它确实会影响交易流程，并可能影响财务报告内部控制的充分性。\n\
  \n## 健康信息技术与 HIPAA\n\n奥马政府计划在五年内让所有美国居民转向电子健康记录（`EHRs`），这在奥马总统于 2009 年 2 月 17 日签署生效的《美国恢复与再投资法案》（`ARRA`）中为`健康信息技术`（`HIT`）拨付了\
  \ 190 亿美元的专项资金。总体而言，联邦隐私/安全法（`HIPAA`）得到了扩大以保护患者健康信息，`HIPAA` 隐私和安全法将直接适用于覆盖实体的业务伙伴。`ARRA`\
  \ 还禁止在没有患者书面授权的情况下出售患者的健康信息，但在涉及研究或公共卫生活动或“部长在法规中认为同样必要和适当的有限情况下除外”。\n\n部长出售患者健康信息的无限权利引发了隐私倡导者的严重反对。\n\
  \n`HIPAA` 的隐私规则规定了受保护健康信息（`PHI`）的使用和披露。`PHI` 是由覆盖实体持有的关于健康状况、医疗服务提供或医疗支付的、可以关联到个人的信息。`PHI`\
  \ 被解释为个人电子病历（`EMR`）或支付历史的任何部分，但 `HIPAA` 在下列表中列出了 18 种 `PHI` 标识符。覆盖实体包括与本章涵盖的交易传输任何电子健康信息的医疗计划、保健清理机构和医疗保健提供者。\n\
  \n这 18 种 `PHI` 标识符在本书书写时如下：\n\n1. 姓名。\n\n\n\n\n\n2. 所有比州更小的地理划分，包括街道地址、城市、县、选区、邮政编码及其相应的地理代码，但邮政编码的前三数字除外，如果根据美国人口普查局目前的公开数据：(1)\
  \ 由所有具有相同前三位数的邮政编码组成的地理单元人数超过 20,000 人；且(2) 所有此类人数为 20,000 人或少的地理单元的邮政编码的前三位改为`000`。\n\
  \n3. 与个人直接相关的日期（年份外），包括出生日期、入院日期、出院日期、死亡日期；以及所有超过 89 岁的年龄指示此类年龄的所有日期元素（包括年份），但此类年龄和元素可以合并为\
  \ 90 岁及以上的单一类别。\n\n4. 电话号码。\n\n5. 传真号码。\n\n6. 电子邮件地址。\n\n7. 社会安全号码。\n8. 医疗记录号。\n\
  9. 医疗计划受益人编号。\n10. 账号。\n11. 证书/许可证号码。\n12. 车辆识别码和序列号，包括车牌号。\n13. 设备识别码和序列号。\n14.\
  \ 网页通用资源定位符 (URL)。\n15. 互联网协议 (IP) 地址码。\n16. 生物识别码，包括指纹和声纹。\n17. 全脸照片图像和任何可比的图像。\n\
  18. 任何其他唯一标识码、特征或代码（注意：这并不指调查人员为编码数据而分配的唯一代码）。\n\n用于替换数据集中标识符的任何代码都不能从与个人相关的任何信息和主代码推导出，且推导出代码的方法不能公开。例如，唯一代码不能包含社会安全号码的最后四位（按顺序）。\n\
  \n从上述列表的长度可以看出，电子健康记录（EHR）或电子病历（EMR）主标头记录中的大量数据必须加密，以符合 HIPAA 关于使个人身份识别信息匿名化的要求。\n\
  \nNIST 特别出版物 800-122，“保护个人身份信息 (PII) 机密性指南”(`[`bit.ly/sc2G3`](http://bit.ly/sc2G3)`,\
  \ `[`csrc.nist.gov/publications/drafts/800-122/Draft-SP800-122.pdf`](http://csrc.nist.gov/publications/drafts/800-122/Draft-SP800-122.pdf)]`)，将\
  \ PII 定义为：\n\n可用于区分或追踪个人身份的信息，例如其姓名、社会安全号码、生物识别记录等，或者当其与特定个人关联或可链接到特定个人的其他个人或识别信息结合用时，例如出生日期和地点、母亲的姓等。\n\
  \n欧盟指令 95/46/EC，“关于处理个人数据时保护个人以及此类数据自由流动的指令”(`[`bit.ly/188e0N`](http://bit.ly/188e0N)`,\
  \ `[www.cdt.org/privacy/eudirective/EU_Directive_.html](http://www.cdt.org/privacy/eudirective/EU_Directive_.html)]`)\
  \ 将 PII 定义为：\n\n第 2a 条：‘个人数据’是指任何与已识别或可识别的自然人（‘数据主体’）相关的信息；可识别的人是指可以直接或间接被识别的人，特别是通过参考识别码或与其物理、生理、心理、经济、文化或社会身份特定的一个或多个因素来识别的人。\n\
  \n2009 年《美国恢复与再投资法》(ARRA) 由奥巴马总统于 2009 年 2 月 17 日签署生效，该法包含了第 XIII 《经济与临床健康信息技术法》(HITECH\
  \ Act)，该法案拨了 220 亿美元联邦资金用于推进健康信息技术的使用。HITECH 法的 D 子标题修改了 HIPAA 管理健康相关安全和隐私法规的适用性，如下：\n\
  \n*   HIPAA 受覆盖实体的业务伙伴现在独立受 HIPAA 约束。\n*   业务伙伴现在须与受覆盖实体承担相同的民事和刑事处罚。\n* 增加了对未安全数据泄露的通知要求。\n\
  \n数据泄露通知的要求与后文“加州议会法案 1386 号”中描述的加州居民个人信息的要求相似。“未安全”的个人健康信息通常指未加密或未以使未经授权的人无法读取的方式保护的信息。然而，卫生和人类服务部被指示就“未安全”和其他关键术语的含义发布指南。\n\
  \n### 支付卡行业数据安全标准 (PCI-DSS)\n\n支付卡行业 (PCI) 有一套数据安全标准 (`PCI-DSS`)，由 PCI 安全标准委员会 (`PCI-SSC`)\
  \ 管理，其五位创始成员是美国运通、Discover Financial Services、JCB International、MasterCard Worldwide\
  \ 和 Visa Inc.。`PCI-DSS` v1.2 于 2008 年 10 月 1 日生效，v1.1 的日落日期为 2008 年 12 月 31 日。\n\
  \n根据维基百科 (`[`bit.ly/W7pv2`](http://bit.ly/W7pv2)`, `[`en.wikipedia.org/wiki/PCI_DSS`](http://en.wikipedia.org/wiki/PCI_DSS)]`)\
  \ 和 PCI 网站 (`[`bit.ly/139Lrk`](http://bit.ly/139Lrk)`, `[`www.pcisecuritystandards.org/security_standards/pci_dss.shtml`](https://www.pcisecuritystandards.org/security_standards/pci_dss.shtml)]`)，`PCI-DSS`\
  \ v1.2 定义了处理、存储或传输支付卡数据的商的控制目标和合规要求，如下表所示：\n\n| 控制目标 | 要求 |\n| :--- | :--- |\n|\
  \ 构建和维护安全网络 | 1. 安装并维护防火墙配置以保护卡数据。 |\n| | 2. 不要使用供应商提供的默认密码和其他安全参数。 |\n| 保护卡数据 |\
  \ 3. 保护存储的卡数据。 |\n| | 4. 在开放公共网络上加密传输卡数据。 |\n| 维护漏洞管理计划 | 5. 在受恶意软件影响的所有系统中使用并定期更新反病毒软件。\
  \ |\n| | 6. 开发和维护安全的系统和应用程序。 |\n| 实施强访问控制措施 | 7. 根据业务需要限制对卡数据的访问。 |\n| | 8. 为访问计算机的人分配唯一\
  \ ID。 |\n| | 9. 限制对卡数据的物理访问。 |\n| 定期监控和测试网络 | 10. 跟踪和监控对网络资源和卡数据的访问。 |\n| | 11.\
  \ 定期测试安全系统和流程。 |\n| 维护信息安全政策 | 12. 维护涉及信息安全的政策。 |\n\n上述要求仅适用于持卡主账号（通常为 16 位）的商户。如果商户使用支付网关组织来消除处理支付卡交易的需求，则不适用这些要求。PCI\
  \ 的有效支付应用程序列表页面 (`[`bit.ly/GtXl6`](http://bit.ly/GtXl6)`, `[`www.pcisecuritystandards.org/security_standards/vpa/vpa_approval_list.html?mn=&vn=0&ap=1&rg=0`](https://www.pcisecuritystandards.org/security_standards/vpa/vpa_approval_list.html?mn=&vn=0&ap=1&rg=0)]`)\
  \ 在 2009 年 3 月 13 日列出了 24 个网关供应商和 26 个支付应用程序，其中 25 个应用程序被标记为“适用于新部署”。\n\nPCI 自我评估问卷\
  \ (SAQ)\n\n\n\n\n\nPCI 为那些不需要由合格安全评估师（QSA）进行现场数据安全评估的商户提供了自评估调查问卷（SAQ）。这是一种旨在帮助商户和服务提供商自评估其对\
  \ PCI DSS 合从性的验证工具。下表列出了五种 SAQ 验证类型、描述以及适用的 SAQ 版本。\n\n| SAQ 验证类型 | 描述 | SAQ |\n\
  | :--- | :--- | :--- |\n| 1 | 无卡交易（电子商务或邮购/电话）商户，所有持卡人数据功能均已外包。（这永远不适用于面对商户。） |\
  \ A |\n| 2 | 仅保留印记且不存储电子持卡人数据的商户。 | B |\n| 3 | 独立拨号终端商户，不存储电子持卡人数据。 | B |\n| 4 |\
  \ 支付应用程序系统连接到互联网的商户，不存储电子持卡人数据。 | C |\n| 5 | 所有其他商户（不包括上述 SAQ A-C 的描述）以及所有支付品牌定义为符合完成\
  \ SAQ 条件的服务提供商。 | D |\n\n使用被主要支付卡公司认可的安全支付网关来处理信用卡交易的商店，其服务器上不处理、存储或传输任何信用卡信息；也没有访问支付卡\
  \ ID 的权限。此类商户可以使用 SAQ 验证类型 1 和 SAQ 版本 A，这只需要证明：\n\n* 商户未在商户场所存储、处理或传输任何持卡人数据，而是完全依赖第三方服务提供商来处理这些功能。\n\
  * 处理持卡人数据存储、处理和或传输的第三方服务提供商已确认符合 PCI DSS。\n* 商户不以电子格式存储任何持卡人数据。\n* 如果商户存储了持卡人数据，此类数据仅为纸质报告或收据副本，且不通过电子方式接收。\n\
  \n### PCI 优先方法框架\n\n拥有小型或没有 IT 组织的商户表示，他们需要一个获取 PCI-DSS 合规的路线图。为此，PCI 在 2009 年 3\
  \ 月发布了“优先方法”框架，以帮助尚未完全符合 PCI DSS 的商户在合规之路上理解并降低风险。该框架侧重于下列出的安全里程碑，以防止面临持卡人数据安全的最高风险因素和升级的威胁：\n\
  \n* 如果不需要，就不要存储。\n* 保护边界。\n* 保护应用程序。\n* 监控并控制对系统的访问。\n* 保护存储的持卡人数据。\n* 完成剩余的合规工作，并确保所有控制到位。\n\
  \nPCI 针对 DSS 1.2 的优先方法页面（[`bit.ly/14AS9p`](http://bit.ly/14AS9p), [`www.pcisecuritystandards.org/education/prioritized.shtml`](https://www.pcisecuritystandards.org/education/prioritized.shtml)）提供了指南文档和\
  \ Excel 工作表的链接，以辅助该框架的使用。\n\n## 加州参议院第 1386 号法案\n\n加州参议院第 1386 号法案，也称为《加州信息实践法》或《加州安全泄露通知法》，要求任何在加州经营业务并许可或拥有关于任何加州居民计算机化个人信息的实体，必须遵守特定的数据安全监管标准，包括：\n\
  \n* 将个人数据定义为个人的名字首字母或姓氏，并结合该个人的社会安全号码、驾驶执照号码或加州身份卡号码、账户号码、信用卡或借记卡号，并结合任何允许访问个人财务账户的必要安全代码、访问代码或密码。\n\
  * 通知任何未加密个人数据被未经授权实体获取的加州居民，并向该居民披露泄露的个人数据。\n\n任何对所有实例个人数据都进行加密的受影响公司或机构不受 SB 1386\
  \ 通知要求的限制。\n\nSB 1386 未定义 `encrypt` 或 `encryption` 术语，因此所采用的加密方法所提供的安全性程度可能取决于司法判定。\n\
  \n### 马萨诸塞州和内华达州的数据隐私法\n\n2008 年，内华达州和马萨诸塞州通过了数据隐私法，要求对个人数据进行加密。内华达修订法规第 597.970\
  \ 条 ([`bit.ly/xzeIJ`](http://bit.ly/xzeIJ), [www.leg.state.nv.us/NRs/NRS-597.html#NRS597Sec970](http://www.leg.state.nv.us/NRs/NRS-597.html#NRS597Sec970))\
  \ 要求所有企业对电子传输的个人身份识别客户数据进行加密。马萨诸塞州 201 CMR 17.00：联邦州居民个人信息保护标准 ([`bit.ly/jZTxA`](http://bit.ly/jZTxA),\
  \ [www.mass.gov/?pageID=ocaterminal&L=4&L0=Home&L1=Consumer&L2=Privacy&L3=Identity+Theft&sid=Eoca&b=terminalcontent&f=reg201cmr17&csid=Eoca](http://www.mass.gov/?pageID=ocaterminal&L=4&L0=Home&L1=Consumer&L2=Privacy&L3=Identity+Theft&sid=Eoca&b=terminalcontent&f=reg201cmr17&csid=Eoca))\
  \ 要求对笔记本电脑和其他便携设备上的个人信息进行加密。这些法律也适用于州外公司。\n\n这些法律将个人信息定义为个人姓名与驾驶执照、信用卡信息或社会安全号码的结合。《华街日报》2008\
  \ 年 10 月 16 日的《新数据法》文章提供了更多细节。像加州的 SB 1386 一样，内华达州规定了加密强度。\n\n## 为 Web 角色实现实现套接层传输\n\
  \nAzure 服务可以通过传输层安全 (TLS) 使用安全 HTTP 协议 (HTTPS) 对存储账户进行加密传输。要启用 HTTPS，请将 5-1 强调的行添加到\
  \ `ServiceDefinition.csdef` 文件中：\n\n```xml\n<!-- 在云端运行时，http 使用端口 80，https 使用端口\
  \ 443 -->\n<InputEndpoint name=\"HttpIn\" protocol=\"http\" port=\"80\" />\n<InputEndpoint\
  \ name=\"HttpsIn\" protocol=\"https\" port=\"443\" />\n```\n\n如果您启用了 HTTPS 传输，必须为开发工厂创建一个自签名\
  \ SSL 证书，将其添加到个人存储区，然后在项目的 SSL 属性页启用 SSL 连接。为了避免关于证书不受信任的警告信息，请将证书添加到受信任的根证书颁发机构。后面的“为开发工厂创建自签名证书”章节描述了如何创建此类证书。\n\
  \n需要自签名证书是因为证书私钥在开发环境中是不安全的。\n\n\n\n\n\n[Listing 5-2] 包含了为生产 Web Role 建立 TLS 的请求头，该\
  \ Web Role 拥有一个由你创建的测试根证书机构创建的服务器证书。强调了指定 TLS/SSL 的 TCP 端口 `443`。\n\n### [Listing\
  \ 5-2:] 为 WebRole 建立 TLS 连接的请求头\n\n```\nCONNECT oakleaf3.cloudapp.net:443 HTTP/1.0\n\
  User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.0; Trident/4.0; GTB6;\n\
  SLCC1; .NET CLR 2.0.50727; Media Center PC 5.0; .NET CLR 3.5.21022;\n.NET CLR 3.5.30428;\
  \ .NET CLR 3.5.30729; .NET CLR 3.0.30618; MS-RTC LM 8;\nInfoPath.2; OfficeLiveConnector.1.3;\n\
  OfficeLivePatch.1.3)\nProxy-Connection: Keep-Alive\nContent-Length: 0\nHost: oakleaf3.cloudapp.net\n\
  Pragma: no-cache\n```\n\n[Listing 5-3] 显示了 Fiddler2 从 oakleaf3 生产托管服务截获的响应头，其中通过高亮的\
  \ Tls 字符指定了 TLS 安全协议。\n\n### [Listing 5-3:] 使用你的证书为 WebRole 建立 TLS 连接的响应头\n\n```\n\
  HTTP/1.1 200 Connection Established\nTimestamp: 11:06:30:0857\nFiddlerGateway: Direct\n\
  This is a HTTPS CONNECT Tunnel. Secure traffic flows through this connection.\n\
  Secure Protocol: Tls\nCipher: Aes 128bits\nHash Algorithm: Sha1 160bits\nKey Exchange:\
  \ RsaKeyX 1024bits\n== Client Certificate ==========\nNone.\n== Server Certificate\
  \ ==========\n[Subject]\n  CN=oakleaf3.cloudapp.net\n[Issuer]\n  CN=OakLeaf CA,\
  \ O=OakLeaf Systems, OU=Development, L=Oakland, S=CA, C=US\n[Serial Number]\n  8A6ED385CA220E9942CCDD3960F4ADC6\n\
  [Not Before]\n  3/20/2009 4:05:42 PM\n[Not After]\n  3/20/2017 4:05:41 PM\n[Thumbprint]\n\
  \  248187B259A5BDCFEDE23843FC1E66D4239C59D2\n```\n\n发行者（根证书机构）是 OakLeaf CA，测试服务器证书的通用名称（`CN`）是生产服务的\
  \ URI。你可能会发现，在服务开发期间，使用测试证书（商业服务器证书）比使用来自商业证书机构（`CA`）如 Go Daddy、Comodo 或 Thawte\
  \ 的商业服务器证书更方便。安全服务的所有用户都必须将测试根证书机构添加到他们的受信任的根证书颁发列表中。\n\n商业 CA 需要你所请求证书的域名的所有权证明。在大多数情况下，所有权证明由域名内的电子邮件地址表示，例如上述示例中的\
  \ `alias@cloudapp.net`，CA 向该地址发送证书请求的响应。显然，此程序对 Azure 不起作用，因此你必须为你拥有的域名名获取商业证书，然后将\
  \ `servicename.cloudapp.net` 指定为 DNS CNAME 记录。\n\nTLS v1.1 是 SSLv3 的后续版本，是 2006\
  \ 年 4 月 IETF RFC 4346《传输层安全 (TLS) 协议版本 1.1》的主题。SSLv3 通常使用 128 位 RC4（也称为 ARC4 或 ARCFOUR）加密算法；TLS\
  \ v1.1 协商 Web 服务器和浏览器支持的 `CipherSuite`。带有 TLS v1.1 或 SSLv3 加密以及 128 位密钥的 HTTPS 被认为足够安全，可以保护消费者银行和支付卡交易的互联网传输。符合\
  \ SB 1386 的免条件需要个人信息以加密数据的形式存储。“128 位”指定了加密密钥的长度。正如 RFC 4346 所述，在设计 SSLv3 和 TLS\
  \ 1.0 时，美国限制了包含某些加密算法的加密软件的出口。为了符合这些规定，设计了一系列加密套件以降低的（40 位）密钥长度运行。由于计算机性能的进步，这些算法现在弱得令人不可接受，出口限制已经放宽以允许\
  \ 128 位密钥。\n\n[图 5.1] 显示了 AzureTableHarness 服务的 SSL 页面，其中包含 Development Fabric 的\
  \ `https://127.0.0.1/` 环回（`localhost`）的自签名证书，以及用于 `https://oakleaf3.cloudapp.net`\
  \ 生产 URL 的测试证书。[图 5.1] 在项目的 SSL 页面中为 Development 和 Azure Fabrics 指定了自签名证书和测试证书。\n\
  \n### 为 Azure Data Services 启用 TLS\n\n在开发带有个人身份识别数据的服务期间，需要使用 HTTPS 进行数据传输以确保安全模式，但在托管服务和数据服务位于同一数据中心的完整生产服务中，可能不需要。传输\
  \ Blobs、Tables 和 Queues 的启用 TLS 需要将项目 `ServiceConfiguration` 文件中的 `http` 更改为 `https`，如\
  \ [Listing 5-4] 中的高亮字符所示。\n\n[Listing 5-4:] 为 HTTP、队列和传输启用 SSL\n\n```\n<Setting\
  \ name=\"BlobEndpoint\" value=\"https://blob.windows.net\" />\n<Setting name=\"\
  QueueEndpoint\" value=\"https://queue.windows.net\" />\n<Setting name=\"TableEndpoint\"\
  \ value=\"https://table.windows.net\" />\n```\n\n[Listing 5-5:] 为 Tables 建立 SSL\
  \ 连接\n\n```\nCONNECT oakleaf3.cloudapp.net:443 HTTP/1.0\nUser-Agent: Mozilla/4.0\
  \ (compatible; MSIE 8.0; Windows NT 6.0; Trident/4.0; GTB6;\nSLCC1; .NET CLR 2.0.50727;\
  \ Media Center PC 5.0; .NET CLR 3.5.21022;\n.NET CLR 3.5.30428; .NET CLR 3.5.30729;\
  \ .NET CLR 3.0.30618; MS-RTC LM 8;\nInfoPath.2; OfficeLiveConnector.1.3;\nOfficeLivePatch.1.3)\n\
  Proxy-Connection: Keep-Alive\nContent-Length: 0\nHost: oakleaf3.cloudapp.net\nPragma:\
  \ no-cache\n```\n\n你不需要为 Data Services 证书，因为由 Microsoft Authority 颁发的证书对于 `servicename.windows.net`\
  \ 是有效的，这正如 [Listing 5-6] 中的 Subject 通配符（`*`）所示。\n\n[Listing 5-6:] 为 Tables 建立 SSL\
  \ 连接\n\n```\nHTTP/1.1 200 Connection Established\nTimestamp: 10:21:13:4337\nFiddlerGateway:\
  \ Direct\nThis is a HTTPS CONNECT Tunnel. Secure traffic flows through this connection.\n\
  Secure Protocol: Tls\nCipher: Aes 128bits\nHash Algorithm: Sha1 160bits\nKey Exchange:\
  \ RsaKeyX 1024bits\n== Client Certificate ==========\nNone.\n== Server Certificate\
  \ ==========\n[Subject]\n  CN=*.table.windows.net\n[Issuer]\n  CN=Microsoft Secure\
  \ Server Authority, DC=redmond, DC=corp, DC=microsoft, DC=com\n[Serial Number]\n\
  \  5A501E5F00050000E869\n[Not Before]\n  10/7/2008 1:32:39 PM\n[Not After]\n  10/7/2009\
  \ 1:32:39 PM\n[Thumbprint]\n  708BFA75C5EFADD0DA55E88C75352CD6E4E2562F\n```\n\n\
  Microsoft Server Authority 是由 Microsoft Internet Authority 颁发的中间证书机构，而后者是由 GTE CyberTrust\
  \ Global 根颁发的。注意上述 Microsoft 证书的短暂（一年）寿命，相对于 [Listing 5-3] 测试证书的八年有效期。\n\n### 为\
  \ Development Fabric 创建自签名证书\n\nInternet Explorer 的 Internet Options 对话框 Content\
  \ 页面有一个 Certificates 按钮，可以打开证书对话框。Mozilla Firefox 在其 Options、Advanced、Encryption\
  \ 页面上提供了类似的 View Certificates 按钮。服务器身份验证证书必须由证书对话框受信任的根证书颁发列表中的机构颁发，以避免出现质疑真实性的信息。对于生产服务，你需要一个你拥有的域名的证书，例如由列表上的某一个机构颁发的\
  \ `mydomain.com`，以及一个指向 `servicename.cloudapp.net` 的 CNAME DNS 记录。对于 Development\
  \ Fabric，你必须为 Cassini Development Web 服务器创建一个自签名证书。\n\n\n\n\n\nJim Nakashima 编写的《在\
  \ Windows Azure 上启用 SSL 连接》白皮书 ([`bit.ly/GbnSh`](http://bit.ly/GbnSh), [`msdn.microsoft.com/en-us/library/dd203056.aspx`](http://msdn.microsoft.com/en-us/library/dd203056.aspx))\
  \ 解释了如何为生产和开发服务器设置 SSL 连接。Scott Guthrie 的博客文章《提示/技巧：使用自签名证书在 IIS 7.0 上启用 SSL》([`bit.ly/2pJ3xG`](http://bit.ly/2pJ3xG),\
  \ [`weblogs.asp.net/scottgu/archive/2007/04/06/tip-trick-enabling-ssl-on-iis7-using-self-signed-certificates.aspx`](http://weblogs.asp.net/scottgu/archive/2007/04/06/tip-trick-enabling-ssl-on-iis7-using-self-signed-certificates.aspx))\
  \ 展示了如何使用 `IIS 7.0` 为 `localhost` 创建自签名证书。这两篇文章都没有解释如何使用 `MakeCert.exe` 创建具有自定义域名的证书。\n\
  \n如前所述，在开发开发织体（Development Fabric）中运行的安全服务的默认 URL 为 `https://127.0.0.1/`，但 IE8 的证书对话框不允许你指定除默认\
  \ `localhost` 或机器账户名称以外的 `CN`。如果你使用 `localhost` 证书，每次编译和运行项目时都必须忽略警告消息。要指定自定义 `CN`，你必须使用\
  \ `Visual Studio 2008 Command Prompt` 通过 `VS 2008` 的 `MakeCert.exe` 命令行工具，使用以下参数创建证书：\n\
  \n```\nmakecert.exe -n “CN=127.0.0.1” -pe -ss My -sr CurrentUser -sky exchange -m\
  \ 96 -a sha1 -eku 1.3.6.1.5.5.7.3.1 -r\n```\n\n下表解释了上述参数值：\n\n| 参数 | 说明 |\n| :---\
  \ | :--- |\n| -n “CN=127.0.0.1” | 证书的 x509 名称，通常为 Web 服务器 URL |\n| -pe | 标记生成的私钥为可导出\
  \ |\n| -ss My | 指定存储输出证书的证书存储 |\n| -sr CurrentUser | 指定证书存储位置（`CurrentUser` 或 `LocalMachine`）\
  \ |\n| -sky exchange | 密钥类型（exchange 或 signature） |\n| -m 96 | 证书有效期（以月为单位） |\n\
  | -a sha1 | 算法（默认为 md5 或 sha1） |\n| -eku 1.3.6.1.5.5.7.3.1 | 增强密钥对象标识符（所有用途） |\n\
  | -r | 创建自签名证书 |\n\n开发 Web 服务器要求自签名证书位于 `CurrentUser` 存储区。\n\n在运行上述命令后，打开证书对话框将会在你的个人证书列表中显示该自签名证书，所示\
  \ 图 5.2 所示。\n\n图 5.2 添加到个人证书列表的自签名证书。\n\n![5.2](img/c05f002.jpg)\n\n### 将颁发者导入到受信任的根证书实体列表\n\
  \n要将证书颁发者添加到受信任的根证书实体，请执行以下操作：\n\n1. 点击证书对话框中的“导出”按钮启动证书导出向导，点击“下一步”打开导出私钥对话框。\n\
  2. 选择“是，导出私钥”选项并点击“下一步”打开导出文件对话框。\n3. 选择“个人信息交换 – PKCS #12 (.PFX)”选项，勾选“尽可能包含证书路径中的所有证书”和“导出所有扩展属性”复选框，点击“下一步”打开密码对话框。\n\
  4. 输入并确认密码以加密私钥，点击“下一步”打开导出文件对话框。\n5. 点击“浏览”并导航到你的 `Users\\UserName\\Documents`\
  \ 文件夹，添加一个 `ServerCerts` 或类似的文件夹，将文件命名为 `127-0-0-1DevCert.pfx` 等，并点击“保存”导出证书并打开完成证书导出向导对话框。\n\
  6. 点击“完成”关闭向导。\n7. 点击证书对话框中的“受信任的根证书实体”选项卡和“导入”按钮启动证书导入向导，点击“下一步”打开导入文件对话框。\n8.\
  \ 在列表中选择“个人信息文件 (*.pfx)”，浏览并打开第 5 步保存的文件，点击“下一步”打开密码对话框。\n9. 输入你在第 4 步中指定的密码，勾选“将此密钥标记为可导出”和“生成所有扩展属性”复选框，点击“下一步”打开证书存储对话框。\n\
  10. 选择“将所有证书放入下列存储”选项，并在证书存储列表中选择“受信任的根证书实体”，点击“下一步”打开完成证书导入向导对话框。\n11. 点击“完成”创建新的受信任的根证书实体（参见图\
  \ 5.2）。\n\n\n\n\n\n- `DESCryptoServiceProvider` 定义了对数据加密标准 (DES) 算法的加密服务提供程序 (CSP)\
  \ 版本的封装。\n- `RC2CryptoServiceProvider` 定义了对 `RC2` 算法 CSP 实现的封装。\n- `RijndaelManaged`\
  \ 访问 `Rijndael` 算法的托管版本，`AES` 正基于该算法。`AES` 具有 128 位（16 字节）的固定块大小以及 128、192 或 256\
  \ 位的密钥；`Rijndael` 可以指定为 32 位任意倍倍的块大小和密钥大小，最小为 128 位，最大为 256 位。\n- `TripleDESCryptoServiceProvider`\
  \ 定义了对 TripleDES 算法 CSP 版本的封装。\n\n`AES` 是一项联邦标准，因此它很可能被联邦和州机构接受为保护个人身份信息的适当手段。你可以从这些算法的维基百科条目中了解更多关于上述加密算法的信息。\n\
  \n## 使用 AES 加密和解密字符串\n\n`\\WROX\\Azure\\Chapter05` 文件夹中的 `AzureTableTestHarnessSSL.sln`\
  \ 项目基于第 4 章的 `SampleWebCloudService.sln` 项目。该项目在创建或更新实体时使用 `AesManaged` 加密 Northwind\
  \ Customers 表中的 PII（个人身份信息），并在 `GridView` 控件显示和批量更新时对其进行解密。`AesManagedEncryption.cs`\
  \ 文件包含 `EncryptDecrypt` 类，它为 UTF-8 编码的字符串提供了 `Encrypt` 和 `Decrypt` 方法，`StorageClient`\
  \ 的 HTTP 请求头将其指定为 `Accept-Charset` 头，响应将其交付为 `Content-Type: application/atom+xml;charset=utf-8`。加密后的字节作为\
  \ Base64 编码字符串交付。\n\n### 将明文加密为密文\n\n基于密码的密钥派生函数 (`PBKDF2`) 根据密码和盐字节数组的组合创建共享秘密（加密/解密）密钥。盐字节表示从密码派生的大密钥集中的索引。它不需要保密。在接下来的示例中，密码和盐是嵌入的字面量字符串。使用公钥对对密码进行加密可以增加安全性，Windows\
  \ 数据保护 API (`DPAPI`) 可以为私钥提供安全存储。\n\n`PBKDF2` 是 RSA 实验室公钥加密标准 (`PKCS`) #5 v2.0 的一部分，由\
  \ IETF 发布为 `RFC 2898`（([www.ietf.org/rfc/rfc2898.txt](http://www.ietf.org/rfc/rfc2898.txt))）。关于\
  \ `DPAPI` 的更多信息，请参见 MSDN 上的“Windows 数据保护”白皮书 ([`msdn.microsoft.com/en-us/library/ms995355.aspx`](http://msdn.microsoft.com/en-us/library/ms995355.aspx))）。\n\
  \n编写本书时，Azure Fabric 不支持 `DPAPI` 安全。\n\n[Listing 5-8] 包含加密代码，返回 Base64 编码的密文。\n\n\
  #### Listing 5-8：使用 `AesManaged` 加密类加密明文 UTF8 字符串的方法\n\n```csharp\npublic static\
  \ string Encrypt(string input)\n{\n    try\n    {\n        // Plaintext string input\n\
  \        string data = input;\n        // Convert to an array of UTF-8 bytes\n \
  \       byte[] utfData = UTF8Encoding.UTF8.GetBytes(data);\n        byte[] saltBytes\
  \ = UTF8Encoding.UTF8.GetBytes(\"S0d1umChl0r1de\");\n        // Use the PBKDF2 standard\
  \ for password-based key generation\n        Rfc2898DeriveBytes rfc = new Rfc2898DeriveBytes(\"\
  K3yPassw0rd!\", saltBytes);\n        // Advanced Encryption Standard symmetric encryption\
  \ algorithm\n        AesManaged aes = new AesManaged();\n        // Set AES parameters\n\
  \        aes.BlockSize = aes.LegalBlockSizes[0].MaxSize;\n        aes.KeySize =\
  \ aes.LegalKeySizes[0].MaxSize;\n        aes.Key = rfc.GetBytes(aes.KeySize / 8);\n\
  \        aes.IV = rfc.GetBytes(aes.BlockSize / 8);\n        // Encryption\n    \
  \    ICryptoTransform encryptf = aes.CreateEncryptor();\n        // Output stream,\
  \ can be a FileStream\n        MemoryStream encryptStream = new MemoryStream();\n\
  \        CryptoStream encryptor = new CryptoStream(encryptStream, encryptf, CryptoStreamMode.Write);\n\
  \        // Write, flush, clear and close the encryptor\n        encryptor.Write(utfData,\
  \ 0, utfData.Length);\n        encryptor.Flush();\n        encryptor.Clear();\n\
  \        encryptor.Close();\n        // Create a byte array and convert it to a\
  \ Base64-encoded string\n        byte[] encryptBytes = encryptStream.ToArray();\n\
  \        string encryptedString = Convert.ToBase64String(encryptBytes);\n      \
  \  return encryptedString;\n    }\n    catch (Exception exEncr)\n    {\n       \
  \ string msg = \"AES error: \" + exEncr.Message;\n        if (RoleManager.IsRoleManagerRunning)\n\
  \            RoleManager.WriteToLog(\"Critical\", msg);\n        return input;\n\
  \    }\n}\n```\n\n调用 `CryptoStream.Clear()` 方法是调用 `IDisposable.Dispose`。\n\n调用 `CryptoStream.Clear()`\
  \ 方法是调用 `IDisposable.Dispose`。[Listing 5-9] 显示了请求头和 `AES` 属性的 `CompanyName`、`ContactName`、**128\
  \ 位**、**192 位**或 **256 位**。#### Listing 5-9：向表 3 添加加密实体的 HTTP 请求头和负载\n\n```\nPOST\
  \ /CustomerTable HTTP/1.1\nUser-Agent: Microsoft ADO.NET\nx-ms-date: Sun, 22 Mar\
