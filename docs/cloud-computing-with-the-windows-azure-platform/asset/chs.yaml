  \n## 将 FederatedIdentity.net 配置为识别的令牌发行者\n\nIP 联合要求你的 ACS 解决方案信任你并非由自己为解决方案创建的每个\
  \ IP。将第三方 IP 配置为识别的令牌发行者是 图 9.13 步骤 0 的元素之一。执行以下操作将 [`FederatedIdentity.net`](http://FederatedIdentity.net)\
  \ 配置为 `oakleaf-acs` RP/STS 解决方案的 `ServiceBus` 服务的识别发行者：\n\n1. 导航到管理解决方案页面（此示例为 [`bit.ly/1wGpH`](http://bit.ly/1wGpH),\
  \ [`accesscontrol.ex.azure.microsoft.com/`](https://accesscontrol.ex.azure.microsoft.com/)），使用你用于创建\
  \ `oakleaf-acs` 解决方案的凭据登录，导航并点击 `oakleaf-acs` 解决方案的访问服务链接以打开 `Solution: oakleaf-acs`\
  \ 页面，点击管理范围（Manage Scopes）按钮打开范围页面，并打开解决方案名称列表（参见 图 9.11）。\n\n   Scopes 是 ACS 规则的命名集合。`Scopes`\
  \ 使得管理特定解决方案或项目的规则变得更加简单。\n\n2. 在解决方案名称列表中选择 `servicebus`，为 `ServiceBus` 项目添加新的\
  \ [`http://oakleaf-acs.servicebus.windows.net`](http://oakleaf-acs.servicebus.windows.net)\
  \ 范围，并点击管理链接打开范围管理：规则页面（参见 图 9.12）。\n\n3. 点击 `Issuers` 链接打开范围管理：发行者页面，并点击 `Add Issuer`\
  \ 按钮打开范围管理：添加发行者页面。\n\n4. 在 `DisplayName` 文本框中输入此示例的友好名称（此示例为 `FederatedIdentityNet`），并在\
  \ `Issuer URI` 和 `Certificate URL` 文本框中输入发行者的 URI，[`https://ipsts.federatedidentity.net/MgmtConsole/`](https://ipsts.federatedidentity.net/MgmtConsole/)（参见\
  \ 图 9.13）。\n\n   你不能添加与现有发行者具有相同 URI 的新发行者。因此，如果你已向 Windows CardSpace 存储添加了 [`ipsts.federatedidentity.net`](http://ipsts.federatedidentity.net)\
