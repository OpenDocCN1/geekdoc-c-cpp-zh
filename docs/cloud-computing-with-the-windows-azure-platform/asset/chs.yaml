  # 使用或封装 Azure 服务的 API\n\n你不需要托管服务即可利用 Azure 的扩展功能。事实上，你可以使用任何流行的语言如 `PHP`、`Python`、`IronPython`、`Ruby`、`IronRuby`、`Java`、`C#`\
  \ 或 `Visual Basic` 访问存储账户及其数据，通过调用 HTTP 的 `GET`、`POST`、`PUT` 等标准方法与网络资源交互。正如你将在后续章节中看到的，直接使用官方\
  \ `REST` API 需要向 `HttpRequestWebRequest` 传递许多头部字符串，并解析 `HttpRequestWebRequest` 返回的字符串。\n\
  \n使用“魔术字符串”而不是对象编程违背了 .NET 强类型面向对象的方法论。因此，Azure Tables 支持受限的功能集，可以使用 ADO.NET Data\
  \ Services 客户端库（以前现在仍称为 `Astoria`）通过 LINQ to REST 方言访问表存储数据。SQL Azure Database (`SADB`)\
  \ 也支持 `Astoria` 接口。`Astoria` 使用 Atom 订阅格式 ([www.ietf.org/rfc/4287.txt](http://www.ietf.org/rfc/4287.txt))\
  \ 获取表数据，并使用 Atom 发布协议 (`AtomPub`，[www.ietf.org/rfc/5023.txt](http://www.ietf.org/rfc/5023.txt))\
  \ 进行表插入、更新和删除，如第 2 章所述。\n\n## 使用 Fiddler2 显示 HTTP 请求和响应头部及内容\n\n一种捕捉运行在开发织（Development\
  \ Fabric）中的 Azure 项目与 Azure 数据存储之间 HTTP 头部和内容的日志工具对于调试数据操作代码至关重要。本书中的示例使用 IE 7 和\
  \ `Fiddler2` 代理来监控和调试数据访问。根据其开发者 Eric Lawrence（微软 Internet Explorer 团队成员）的说法：\n\n\
  Fiddler 是一种 Web 调试代理，记录计算机与互联网之间所有的 HTTP(S) 流量。Fiddler 允许你检查 HTTP(S) 流量、设置断点并对传入或导出的数据进行“调试”。Fiddler\
  \ 包含一个强大的事件驱动脚本系统，并可以使用任何 .NET 语言进行扩展。Fiddler 是免费软件，可以调试几乎任何应用程序的流量，包括 Internet\
  \ Explorer、Mozilla Firefox、Opera 以及数千种其他程序。\n\n\n\nFiddler 并不是微软的产品，但有两篇针对它的 Internet\
  \ Explorer 开发技术文章可以参考：“Fiddler PowerToy – 第 1 部分：HTTP 调试”([`bit.ly/zZJjz`](http://bit.ly/zZJjz),\
  \ [`msdn.microsoft.com/en-us/library/bb250446.aspx`](http://msdn.microsoft.com/en-us/library/bb250446.aspx))\
  \ 和 “Fiddler PowerToy – 第 2 部分：HTTP 性能”([`bit.ly/H9dAD`](http://bit.ly/H9dAD), [`msdn.microsoft.com/en-us/library/bb250442.aspx`](http://msdn.microsoft.com/en-us/library/bb250442.aspx))。你可以从\
