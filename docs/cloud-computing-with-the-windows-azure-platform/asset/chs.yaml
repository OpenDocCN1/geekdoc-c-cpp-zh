  \n![9.18](img/c09f018.jpg)\n\n## 作为信赖方在 FederatedIdentity.net 上注册\n\nIP 地址 `[ipsts.federatedidentity.net](http://ipsts.federatedidentity.net)`\
  \ 是一个审计 STS（安全令牌服务），并维护着一个其愿意发送令牌的信赖方（RP）列表。要向 IP-STS 添加新声明（claim），请登录 `[`ipsts.federatedidentity.net/MgmtConsole`](https://ipsts.federatedidentity.net/MgmtConsole)`，点击“管理信赖方”（Manage\
  \ Relying Parties）按钮打开信赖方策略页面，点击“编辑/查看”，并验证每个策略的“选择要发布的声明”（Select Claims to Release）列表中至少勾选了默认（default）和组（Group）声明复框（参见\
  \ 图 9.19）。\n\n图 9.19 在信赖方页面上验证所需的所选声明是否存在。\n\n![9.19](img/c09f019.jpg)\n\n如果未勾选“组”（Group），请在返回信赖方策略页面之前将其勾选。\n\
