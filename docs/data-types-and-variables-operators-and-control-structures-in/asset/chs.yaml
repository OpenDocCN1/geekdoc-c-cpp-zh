  \n###运算符关键字\n- C++ 中的某些运算符有对应的关键字。\n- 示例：`and` 对应 `&&`，`or` 对应 `||`，`not` 对应 `!`。\n\
  \n### 使用 sizeof 运算符\n- `sizeof()` 函数用于获取数据类型或变量的大小。\n- 示例：`cout << sizeof(int);`\n\
  \n## 使用条件运算符\n- 条件运算符（? :)）是 if-else 语句的简写方式。\n\n## 使用省略号运算符\n\n\n\n\n\n*   省略号\
  \ (`...`) 用于在函数参数中表示数量不定的参数。\n*   用于变长函数。\n\n## 使用作用域解析运算符\n\n*   `::` 运算符用于定义函数。\n\
  *   `::` 运算符用于在类外定义函数、在存在同名局部变量时访问全局变量，或访问类的静态变量。\n\n## 使用 new 和 delete 运算符\n\n\
  *   `new` 运算符用于动态内存分配，它在程序运行时分配内存。\n*   `delete` 运算符用于释放通过 `new` 分配的内存。\n*   语法：\n\
  ```cpp\nint* ptr = new int; // 为 int 分配内存\ndelete ptr; // 释放分配的内存\n```\n*   对于数组，使用\
  \ `new[]` 和 `delete[]`。\n```cpp\nint* arr = new int[10]; // 为包含 10 个 int 的数组分配内存\n\
  delete[] arr; // 释放分配的内存\n```\n\n## If 语句\n\n*   用于根据某些条件做出决策。\n*   语法：`if (condition)\
  \ {statements}`\n\n## Else 语句\n\n*   配合 `if` 语句使用，当 `if` 条件为假时执行。\n*   语法：\n```cpp\n\
  if (condition) {statements}\nelse {statements}\n```\n\n## Else if 语句\n\n*   如果初始的\
  \ `if` 条件为假，则检查额外的条件。\n*   语法：\n```cpp\nif (condition1) {statements}\nelse if (condition2)\
  \ {statements}\nelse {statements}\n```\n\n## 嵌套 if 语句\n\n*   另一个 `if` 或 `else if`\
  \ 语句内部的 `if` 语句。\n*   当检查多级条件时有用。\n\n## Switch 语句\n\n*   用于从多个代码块中选择一个执行。\n*   语法：\n\
  ```cpp\nswitch (expression) {\ncase constant1:\n    // 代码\n    break;\ncase constant2:\n\
  \    // 代码\n    break;\n// ...\ndefault:\n    // 代码\n}\n```\n\n## 嵌套 Switch 语句\n\
  \n*   另一个 `switch` 语句内部或 `case` 块内部的 `switch` 语句。\n\n## For 循环\n\n*   重复特定次数的代码块。\n\
  *   语法：`for (initialization; condition; increment/decrement) {statements}`\n\n##\
  \ While 循环\n\n*   只要条件为真，就重复执行代码块。\n*   语法：`while (condition) {statements}`\n\n\
  ## Do-While 循环 \n\n*   与 `while` 类似，但在执行语句后检查条件。\n*   语法：\n```cpp\ndo {statements}\n\
  while (condition);\n```\n\n## 嵌套循环\n\n*   另一个循环内部的循环。外层循环每执行一次，内层循环都会执行其所有的迭代。\n\
  \n## 基于范围的 For 循环\n\n*   用于遍历范围内（如数组、容器）的元素。\n*   语法：`for (declaration : range)\
  \ {statements}`\n\n## 使用 Break 控制循环\n\n*   `break` 语句用于提前停止循环。\n*   退出当前循环并将执行转移到紧随循环其后的语句。\n\
  \n## 使用 Continue 控制循环\n\n*   `continue` 语句跳过循环的剩余部分，并将控制权移回循环开头进行下一次迭代。\n\n## 使用\
  \ Goto 跳到标签\n\n*   `goto` 语句将控制权转移到带有标签的语句。\n*   由于降低了可读性和维护性，通常不建议使用。\n\n## 使用条件运算符（三元运算符）\n\
  \n*   编写 `if-else` 语句的简写方式。\n*   语法：`condition ? expression_if_true : expression_if_false;`\n\
  \n## 使用枚举的 Switch Case\n\n*   枚举值可以用于 switch case，以使代码更清晰且更不容易出错。\n\n## 使用 Try/Catch\
  \ 处理错误\n\n*   `try` 块包围可能抛出异常的代码。\n*   `catch` 块捕获异常并处理它们。\n*   语法：\n```cpp\ntry\
  \ {\n    // 代码\n}\ncatch (exception_type e) {\n    // 处理异常\n}\n```\n\n## 多个 Catch\
  \ 块\n\n*   可以使用多个 `catch` 块来分别处理不同类型的异常。\n\n## 抛出异常\n\n*   `throw` 关键字用于抛出异常。\n\
  *   语法：`throw exception;`\n\n## 自定义异常\n\n*   可以创建用户定义的异常类，通常派生自 `std::exception`\
  \ 类。\n\n## Finally 块\n\n*   在 Java 等语言中，`finally` 是一个在 `try-catch` 块之后始终执行的块，无论是否发生异常。C++\
  \ 不支持 `finally`。\n\n## 函数提前返回\n\n*   `return` 语句可以结束函数执行，并在到达函数末尾之前将控制权交给调用者。\n\n\
  ## 使用 Exit 退出程序\n\n*   可以使用 `cstdlib` 中的 `exit()` 函数终止程序执行。\n\n## 多个变量的 For 循环\n\
  \n*   你可以在 `for` 循环中使用多个循环变量。\n*   语法：`for (int a=0, b=0; a<n && b<m; ++a, ++b)`\n\
  \n## Assert 宏\n\n*   `assert` 宏用于调试目的。\n*   如果其参数表达式为假，它会写入错误消息并终止程序。\n\n## 静态 If\
  \ (If Constexpr)\n\n*   `if constexpr` 是 C++17 的特性，执行编译时检查。\n*   它在模板编程中用于丢弃无法实例的分。\n\
  \n## 处理信号\n\n*   信号是传递给进程的软件中断。\n*   C++ 可以使用 `csignal` 库中的 `signal()` 函数处理信号。\n\
  \n## 使用 Setjmp/Longjmp 非局部跳转\n\n*   `setjmp()` 和 `longjmp()` 用于执行非局部跳转。\n*   使用\
  \ `setjmp` 会使代码难以理解。\n\n## Noreturn 关键字\n\n*   `[[noreturn]]` 是 C++11 属性，表示函数不返回。\n\
  *   用于不预期返回的函数。\n\n## 使用 Goto 控制循环\n\n*   在循环中使用 `goto` 可以允许复杂的控制流，但通常不建议这样做。\n\n\
  ## 循环内部的 Try/Catch\n\n*   可以在循环内部使用 `try-catch` 块处理每次迭代的异常。\n\n## 重新抛出异常\n\n*  \
  \ 在 `catch` 块中，不带参数的 `throw` 语句会重新抛出处理的异常。\n\n## 捕获所有异常\n\n*   `catch(...)` 块可以捕获所有类型的异常。\n\
  \n## 嵌套 Try/Catch 块\n\n*   `try-catch` 块可以嵌套。内部 `catch` 块捕获异常后，如果可以将其传递给外层的 `catch`\
  \ 块。\n\n## Uncaught_Exception 函数\n\n*   `std::uncaught_exception()` 是 C++17 之前的函数，用于检查是否存在未捕获的异常。\n\
  *   在 C++17 之后使用 `std::uncaught_exceptions()`。\n\n## 使用 Noexcept 关键字避免异常\n\n*  \
  \ `noexcept` 关键字指定函数不会异常。\n*   用于性能敏感代码和某些资源管理。\n\n## 构造函数和析构函数的异常\n\n*   如果构造函数抛出异常，对象的初始化未完成。\n\
  *   如果析构函数抛出异常且未被捕获，程序将终止。析构函数应避免抛出异常。\n\n## 异常规范\n\n*   在 C++11 之前，异常规范 `throw(type)`\
  \ 可指定函数可能抛出的异常，但它们已被废弃。\n\n## 在 Switch 语句中使用枚举类\n\n*   可以在 switch case 中使用强类型枚举（`enum\
  \ class`），这可以提高类型安全性和清晰度。\n\n## 使用带有初始化器的 If\n\n*   从 C++17 开始，`if` 语句可以包含初始化器。\n\
  *   语法：`if (init; condition) {statements}`\n\n## 使用带有初始化器的 Switch\n\n*   从 C++17\
  \ 开始，`switch` 语句也可以包含初始化器。\n*   语法：`switch (init; condition) {cases}`\n\n## 变长模板\n\
  \n*   变长模板是以类型安全的方式接收可变参数的模板。\n\n## 循环中的逗号运算符\n\n*   逗号运算符允许在循环的初始化和迭代部分放置多个语句。\n\
  \n\n\n\n\n* 要跳出嵌套循环，可以考虑使用 `goto` 语句，或者将循环封装在函数中并 `return`。\n\n## 继续外层循环\n* 要从内层循环跳转到外层循环的下一次迭代，可以考虑使用\
  \ `goto` 语句，或者将循环封装在函数中并 `return`。\n\n## Duff 设备 (Duff’s Device)\n* `Duff’s device`\
  \ 是一种用于手动实现循环展开的优化技术。\n\n## 变长数组 (VLA)\n* `VLAs` 是可以在运行时确定长度的数组。\n* 标准 C++ 不直接支持，但某些编译器将其作为扩展提供。\n\
  \n## 函数 try 块 (Function Try Block)\n*  own 级 `try-catch` 块可用于捕获函数体以及构造函数初始化列表中抛出的异常。\n\
  \n## 使用 Register 关键字\n* `register` 是一个关键字，意在提示编译器将变量存储在 CPU 寄存器中。然而，现代编译器通常会忽略这一提示，并且从\
  \ C++17 开始，`register` 关键字已弃用。\n\n## Auto 关键字\n* `auto` 关键字用于自动类型推导，这在处理复杂类型或提高代码可维护性时非常有用。\n\
  \n## 退化 (Decay)\n* 类型 `decay` 是 C++ 类型系统的一个属性，在某些上下文中，数组和函数类型会自动退化为指针类型。\n\n## Switch\
  \ 语句中的默认标签\n* `switch` 语句中的 `default` 标签在其他 case 都不匹配时作为备选情况。\n\n## Main 中的 return\
  \ 语句\n* `main()` 函数中的 `return` 语句用于向操作系统指示程序的终止状态。\n\n## Atexit 函数\n* `atexit()`\
  \ 函数注册一个在程序正常终止时被调用的函数。\n\n## 使用 For Each 遍历容器\n* 范围 for 循环（`for-each loop`）用于遍历容器中的元素。\n\
  \n## 使用迭代器遍历容器\n* `Iterators`（迭代器）提供了一种顺序访问容器中元素的方法，而无需暴露其底层表示。\n\n## 使用 Goto 创建显式控制流图\n\
  * 虽然可行，但通常不建议使用 `goto` 创建显式控制流图，因为可能会导致“意大利面条代码”。\n\n## 重复 Switch 语句直到接收有效输入\n*\
  \ 要接收到有效输入前重复 `switch` 语句，可以将 `switch` 封装在循环中，仅在接收到有效输入时从循环中 `break`。\n\n## 创建事件循环\n\
  * 事件循环是一种编程结构，用于等待并分发程序中的事件或消息。它通常涉及一个将事件分发给处理程序的 `while-true` 循环。\n\n## 使用循环等待条件\n\
  * 可以使用循环等待某个条件，循环会持续直到条件满足。\n\n## 使用 Switch 语句检查多个标志位\n* 虽然可行，但使用 `switch` 语句检查多个标志位会导致代码变得复杂。使用\
  \ `if-else` 语句或位操作可能是更好的选择。\n\n## 使用 Switch 创建状态机\n* 使用 `switch` 语句创建状态机，其中不同的状态由\
  \ `case` 标签表示，通过更改 `switch` 变量来执行状态转换。\n\n## While True 循环\n* `while(true)` 创建一个无限循环，必须使用\
  \ `break`、`return` 或 `exit` 来控制。\n\n## For (;;) 循环\n* `for(;;)` 同样创建一个无限循环，类似于 `while(true)`。\n\
  \n## 循环不变式 (Loop Invariants)\n* `loop invariant` 是一个初始为真且在循环每次迭代后仍保持为真的条件。它们对于证明算法的正确性至关重要。\n\
  \n## 循环中前缀和后置自增的区别\n* 前缀自增（`++i`）增加 `i` 的值然后返回 `i`，而后置自增（`i++`）增加 `i` 的值但返回原始值。\n\
  \n## 使用 Try/Catch 忽略异常\n* 异常可以捕获并忽略，但这通常是一种坏习惯，因为它可能会隐藏错误。\n\n## 使用 #if 和 #endif\
  \ 进行条件编译\n* 条件编译允许根据编译时评估的条件，在程序中包含或排除代码块。它通常与预处理器指令如 `#if`、`#ifdef`、`#ifndef` 和\
  \ `#endif` 一起使用。\n\n"
