  \n1. **日志或报告**：当异常发生时，你可能想要记录或报告异常详情。然而，如果异常已经在被抛出或捕获，再次记录或报告同一个异常可能是不恰当的。通过使用 `uncaught_exception`，你可以判断是否存在活跃异常并决定是否记录/报告。\n\
