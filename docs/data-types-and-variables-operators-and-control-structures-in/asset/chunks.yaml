    from anywhere in the program, local variables can only be accessed within the
    function they are declared in, and block scope variables can only be accessed
    within the block they are declared in. Attempting to access a variable outside
    its scope will result in a compilation error.


    # Understanding Type Conversion


    Here’s an example program in C++ that demonstrates explicit and implicit type
    conversion, along with a discussion on the potential pitfalls of automatic type
    conversion:


    #include <iostream>


    int main() {


        // Implicit Type Conversion


        int num1 = 10;


        double num2 = num1;  // Implicitly converts int to double


        std::cout << "Implicit Type Conversion: " << num2 << std::endl;


        // Explicit Type Conversion


        double num3 = 15.75;


        int num4 = static_cast<int>(num3);  // Explicitly converts double to int


        std::cout << "Explicit Type Conversion: " << num4 << std::endl;


        // Potential Pitfalls of Automatic Type Conversion


        int num5 = 10;


        double num6 = 2.5;


        double result1 = num5 / num6;  // Automatic type conversion during division


        std::cout << "Automatic Type Conversion (Division): " << result1 << std::endl;


        int num7 = 5;


        int num8 = 2;


        double result2 = num7 / num8;  // Automatic type conversion during division


        std::cout << "Automatic Type Conversion (Division): " << result2 << std::endl;


        return 0;


    }


    In this program, we have examples of both implicit and explicit type conversion.


    1.  Implicit Type Conversion: It occurs when the compiler automatically converts
    one type to another without any explicit conversion by the programmer. In the
    program, num1 is implicitly converted to a double and stored in num2 when assigning
    num1 to num2.


    2.  Explicit Type Conversion: It occurs when the programmer explicitly specifies
    the type conversion using casting operators. In the program, num3 is explicitly
    converted to an int using the static_cast<int>(num3) syntax and stored in num4.


    Now, let’s discuss the potential pitfalls of automatic type conversion:


    1.  Loss of Precision: Automatic type conversion may lead to loss of precision.
    For example, in the division operation num5 / num6, both num5 and num6 are of
    different types (int and double), and the result will be automatically converted
    to double. However, if you intended to have a precise integer division, this automatic
    conversion may yield an unexpected result.


    2.  Unexpected Results: Automatic type conversion can sometimes lead to unexpected
    results. In the division operation num7 / num8, both num7 and num8 are integers,
    but the result is automatically converted to double. If you were expecting an
    integer result, automatic type conversion can cause confusion.


    To avoid these pitfalls, it’s important to be aware of the types involved in operations
    and explicitly convert them when necessary. Explicit type conversions using casting
    operators, like static_cast, help ensure that the conversion is performed as desired,
    providing more control and reducing the chances of unexpected behavior.


    Note: It’s important to handle potential division by zero errors and consider
    other factors, such as overflow and underflow, when performing type conversions
    and calculations in your programs.


    # Working with Constants


    Constants in C++ are used to represent values that cannot be modified during the
    execution of a program. They provide a way to define fixed values that remain
    constant throughout the program’s execution.


    In C++, there are two ways to declare constants: using the const keyword and using
    the constexpr keyword.


    const Variables: The const keyword is used to declare a constant variable. It
    can be applied to any variable, including fundamental types, user-defined types,
    and pointers. Once a variable is declared as const, its value cannot be changed.


    Here’s an example of using const variables in C++:


    #include <iostream>


    int main() {


        const int MAX_VALUE = 100;


        const double PI = 3.14159;


        // MAX_VALUE = 200;  // Error: Cannot modify a const variable


        // PI = 3.14;        // Error: Cannot modify a const variable


        std::cout << "Max value: " << MAX_VALUE << std::endl;


        std::cout << "PI: " << PI << std::endl;


        return 0;


    }


    In the above example, MAX_VALUE and PI are declared as const variables. Any attempt
    to modify these variables will result in a compilation error.


    constexpr Variables:


    The constexpr keyword is used to declare a constant expression that can be evaluated
    at compile-time. It is typically used when the value of a constant is known at
    compile-time and can be computed using only constant expressions.


    Here’s an example of using constexpr variables in C++:


    #include <iostream>


    constexpr int factorial(int n) {


        if (n <= 1)


            return 1;


        else


            return n * factorial(n - 1);


    }


    int main() {


        constexpr int SIZE = 10;


        constexpr int FACTORIAL_5 = factorial(5);


        // SIZE = 20;       // Error: Cannot modify a constexpr variable


        std::cout << "Size: " << SIZE << std::endl;


        std::cout << "Factorial of 5: " << FACTORIAL_5 << std::endl;


        return 0;


    }


    In the above example, SIZE is declared as a constexpr variable with a value of
    10\. FACTORIAL_5 is also declared as a constexpr variable, but its value is computed
    at compile-time using the factorial function.


    Note that constexpr variables are evaluated at compile-time, so they can be used
    in contexts that require constant expressions, such as array sizes or template
    arguments.


    Both const and constexpr variables provide a way to define constants in C++. The
    choice between them depends on whether the value of the constant is known at compile-time
    or runtime.


    # Creating and Using Enumerated Types


    In C++, an enumerated type, also known as an enum, is a user-defined type that
    consists of a set of named constants called enumerators. These enumerators are
    typically used to represent a finite set of values that a variable can take.


    Here’s an example program that declares and uses an enumerated type in C++:


    #include <iostream>


    enum Month {


      January,


      February,


      March,


      April,


      May,


      June,


      July,


      August,


      September,


      October,


      November,


      December


    };


    int main() {


      Month currentMonth = May;


      std::cout << "The current month is: ";


      switch (currentMonth) {


        case January:


          std::cout << "January";


          break;


        case February:


          std::cout << "February";


          break;


        case March:


          std::cout << "March";


          break;


        case April:


          std::cout << "April";


          break;


        case May:


          std::cout << "May";


          break;


        case June:


          std::cout << "June";


          break;


        case July:


          std::cout << "July";


          break;


        case August:


          std::cout << "August";


          break;


        case September:


          std::cout << "September";


          break;


        case October:


          std::cout << "October";


          break;


        case November:


          std::cout << "November";


          break;


        case December:


          std::cout << "December";


          break;


      }


      std::cout << std::endl;


      return 0;


    }


    In this program, we define an enum called Month that represents the twelve months
    of the year. Each month is assigned a default integer value starting from 0 (January)
    to 11 (December).


    Inside the main() function, we declare a variable currentMonth of type Month and
    assign it the value May. We then use a switch statement to print the name of the
    current month based on the value of currentMonth. In this case, it will output
    “The current month is: May”.


    Enumerated types are useful when you want to restrict the possible values a variable
    can take. They improve code readability by providing meaningful names for constants
    and help catch errors at compile-time if an invalid value is assigned to an enum
    variable.'
