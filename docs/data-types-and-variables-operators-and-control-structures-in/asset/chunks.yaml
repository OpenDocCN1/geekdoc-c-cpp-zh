    \ \"Bitwise NOT: \" << ~value << endl;\n\n    // 地址运算符\n    int* ptr = &num;\n\
    \    cout << \"Address of num: \" << ptr << endl;\n\n    return 0;\n}\n```\n\n\
    输出：\n```\nInitial value of num: 5\nAfter increment: 6\nAfter decrement: 5\nUnary\
