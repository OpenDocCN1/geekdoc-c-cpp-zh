    \ \"x: \" << x << std::endl;\n    std::cout << \"y: \" << y << std::endl;\n  \
    \  std::cout << \"z: \" << z << std::endl;\n    std::cout << \"result: \" << result\
    \ << std::endl;\n    return 0;\n}\n```\n\n关于逗号运算符的关键点：\n- 逗号运算符从左到右求值表达式。\n- 逗号表达式的最终值是最右侧表达式的值。\n\
    \n# 自增和自减运算符\n\n这是一个 C++ 示例程序，演示了自增和自减运算符的使用，以及前缀和后置之间的区别：\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n    int num = 5;\n\n    // 前缀自增\n    int result1\
    \ = ++num;\n    std::cout << \"Prefix increment: \" << result1 << std::endl; //\
    \ 输出: 6\n\n    // 后置自增\n    int result2 = num++;\n    std::cout << \"Postfix increment:\
    \ \" << result2 << std::endl; // 输出: 6 (num 变为 7)\n\n    // 前置自减\n    int result3\
    \ = --num;\n    std::cout << \"Prefix decrement: \" << result3 << std::endl; //\
    \ 输出: 6\n\n    // 后置自减\n    int result4 = num--;\n    std::cout << \"Postfix decrement:\
    \ \" << result4 << std::endl; // 输出: 6 (num 变为 5)\n\n    return 0;\n}\n```\n\n\
    在此程序中，我们初始化了一个为 5 的整数变量 `num`。\n- **前缀运算符 (`++`, `--`)** 在表达式使用值之前对变量进行增或自减。在\
    \ `++num` 的情况下，`num` 变为 6，然后 `result1` 被赋值为 6。\n- **后置运算符 (`++`, `--`)** 在表达式使用当前值后对变量进行增或自减。在\
    \ `num++` 的情况下，`result2` 被赋值为当前值（6），然后 `num` 变为 7。\n\n"
- fmt: "\nThe difference between prefix and postfix versions lies in the order of\
    \ evaluation. Prefix operators modify the variable before its value is used, whereas\
    \ postfix operators modify the variable after its value is used. This difference\
    \ becomes more apparent when these operators are used in larger expressions or\
    \ loops.\n\n# Logical Operators\n\nHere’s an example program in C++ that demonstrates\
