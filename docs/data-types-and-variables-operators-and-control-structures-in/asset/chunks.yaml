    \    int i, j;\n    for (i = 0, j = 10; i < j; i++, j--) {\n        std::cout\
    \ << \"i = \" << i << \", j = \" << j << std::endl;\n    }\n    return 0;\n}\n\
    ```\n\nIn this program, we have a `for` loop that initializes two variables `i`\
    \ and `j` using the comma operator, and also increments `i` and decrements `j`\
    \ using the comma operator within the loop statement.\n\nThe comma operator in\
    \ C++ allows multiple expressions to be evaluated and separated by commas. It\
    \ evaluates the expressions from left to right, discarding the value of all expressions\
