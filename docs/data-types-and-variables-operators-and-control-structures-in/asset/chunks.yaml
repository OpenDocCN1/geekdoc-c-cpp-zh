    \ `*ptr`。\n\n存储在 `ptr` 中的内存地址对应的值是 10，通过对指针解引用来访问。\n\n获取变量的地址是通过使用 `&` 运算符跟随变量名完成的。在示例中，`&num`\
    \ 获取 `num` 的地址，`ptr` 存储了该地址。\n\n# 指针和间接运算符\n\n这是一个演示指针和间接运算符使用的示例：\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n    int num = 10;\n    int *ptr;\n    ptr\
    \ = &num;\n    std::cout << \"Value at memory address \" << ptr << \": \" << *ptr\
