  raw: '5.  Assignment Operators: These assign a value to a variable. The simple assignment
    operator is “=”. Other assignment operators include +=, -=, *=, /=, %=, etc.


    6.  Unary Operators: These operate on a single operand. Unary operators in C++
    include increment (++), decrement (–), and not (!).


    7.  Ternary or Conditional Operator: This operator operates on three operands.
    It is a shorthand for the if-else statement and is represented as ?:.


    8.  Other Operators: These include the sizeof operator, which returns the size
    of the operand, and the comma operator, which allows multiple expressions to be
    evaluated as one statement.


    # Operator Precedence and Associativity in C++


    Understanding operator precedence and associativity is crucial for using C++ operators
    effectively. Operator precedence defines the order in which operators are evaluated
    when an expression has multiple operators. For example, multiplication (*) and
    division (/) have higher precedence than addition (+) and subtraction (-).


    Associativity rules come into play when two operators have the same precedence.
    It determines the direction in which the operators are evaluated. Most operators
    in C++ have left-to-right associativity, except assignment and conditional operators,
    which have right-to-left associativity.


    # Overloading Operators in C++


    One of the powerful features of C++ is the ability to overload most operators.
    Operator overloading allows operators to have user-defined meanings on user-defined
    types (classes). This provides a natural and intuitive way of implementing operations
    on user-defined data structures, improving code readability and maintainability.


    Understanding and mastering the use of operators is fundamental to proficient
    C++ programming. Whether you are performing arithmetic operations, comparing values,
    or manipulating bits, operators in C++ offer a powerful and versatile toolset
    for your programming arsenal. As you delve deeper into C++, remember that the
    key to mastering these operators lies in practice and application, so keep coding!


    # Arithmetic Operators


    Here’s an example program in C++ that uses all the arithmetic operators and explains
    their function and precedence:


    #include <iostream>


    int main() {


      int a = 10;


      int b = 5;


      // Addition


      int sum = a + b;


      std::cout << "Addition: " << a << " + " << b << " = " << sum << std::endl;


      // Subtraction


      int difference = a - b;


      std::cout << "Subtraction: " << a << " - " << b << " = " << difference << std::endl;


      // Multiplication


      int product = a * b;


      std::cout << "Multiplication: " << a << " * " << b << " = " << product << std::endl;


      // Division


      int quotient = a / b;


      std::cout << "Division: " << a << " / " << b << " = " << quotient << std::endl;


      // Modulus


      int remainder = a % b;


      std::cout << "Modulus: " << a << " % " << b << " = " << remainder << std::endl;


      // Precedence


      int result = a + b * 2 - 3 / 2 % 2;


      std::cout << "Precedence: " << a << " + " << b << " * 2 - 3 / 2 % 2 = " << result
    << std::endl;


      return 0;


    }


    Explanation of arithmetic operators and their precedence:


    1.  Addition (+): Adds the values on both sides of the operator.


    2.  Subtraction (-): Subtracts the value on the right side from the value on the
    left side.


    3.  Multiplication (*): Multiplies the values on both sides.


    4.  Division (/): Divides the value on the left side by the value on the right
    side.


    5.  Modulus (%): Calculates the remainder when the value on the left side is divided
    by the value on the right side.


    Precedence of arithmetic operators:


    1.  Multiplication (*), Division (/), and Modulus (%): These operators have the
    highest precedence and are evaluated before addition and subtraction.


    2.  Addition (+) and Subtraction (-): These operators have lower precedence than
    multiplication, division, and modulus, so they are evaluated after them.


    In the example program, the expression a + b * 2 - 3 / 2 % 2 demonstrates operator
    precedence. According to the precedence rules, multiplication and division have
    higher precedence than addition and subtraction. Therefore, b * 2 and 3 / 2 are
    evaluated first. Then, the modulus operator % is evaluated. Finally, the addition
    and subtraction are performed, resulting in the final value stored in the result
    variable.


    # Assignment Operators


    Here’s an example program that demonstrates the use of all assignment operators
    in C++ and provides an explanation of the shorthand they offer:


    #include <iostream>


    int main() {


        int a = 10;


        int b = 5;


        // Assignment operator (=)


        int c = a;


        std::cout << "c = " << c << std::endl;


        // Addition assignment operator (+=)


        c += b;  // Equivalent to: c = c + b;


        std::cout << "c += " << b << " => c = " << c << std::endl;


        // Subtraction assignment operator (-=)


        c -= b;  // Equivalent to: c = c - b;


        std::cout << "c -= " << b << " => c = " << c << std::endl;


        // Multiplication assignment operator (*=)


        c *= b;  // Equivalent to: c = c * b;


        std::cout << "c *= " << b << " => c = " << c << std::endl;


        // Division assignment operator (/=)


        c /= b;  // Equivalent to: c = c / b;


        std::cout << "c /= " << b << " => c = " << c << std::endl;


        // Modulus assignment operator (%=)


        c %= b;  // Equivalent to: c = c % b;


        std::cout << "c %= " << b << " => c = " << c << std::endl;


        // Bitwise AND assignment operator (&=)


        c &= b;  // Equivalent to: c = c & b;


        std::cout << "c &= " << b << " => c = " << c << std::endl;


        // Bitwise OR assignment operator (|=)


        c |= b;  // Equivalent to: c = c | b;


        std::cout << "c |= " << b << " => c = " << c << std::endl;


        // Bitwise XOR assignment operator (^=)


        c ^= b;  // Equivalent to: c = c ^ b;


        std::cout << "c ^= " << b << " => c = " << c << std::endl;


        // Left shift assignment operator (<<=)


        c <<= b; // Equivalent to: c = c << b;


        std::cout << "c <<= " << b << " => c = " << c << std::endl;


        // Right shift assignment operator (>>=)


        c >>= b; // Equivalent to: c = c >> b;


        std::cout << "c >>= " << b << " => c = " << c << std::endl;


        return 0;


    }


    Explanation of shorthand operators:


    1.  Assignment operator (=): Assigns the value on the right-hand side to the variable
    on the left-hand side. It is the most basic assignment operator.


    2.  Addition assignment operator (+=): Adds the value on the right-hand side to
    the variable on the left-hand side and assigns the result back to the left-hand
    side variable. It is a shorthand for variable = variable + value.


    3.  Subtraction assignment operator (-=): Subtracts the value on the right-hand
    side from the variable on the left-hand side and assigns the result back to the
    left-hand side variable. It is a shorthand for variable = variable - value.


    4.  Multiplication assignment operator (*=): Multiplies the variable on the left-hand
    side by the value on the right-hand side and assigns the result back to the left-hand
    side variable. It is a shorthand for variable = variable * value.


    5.  Division assignment operator (/=): Divides the variable on the left-hand side
    by the value on the right-hand side and assigns the result back to the left-hand
    side variable. It is a shorthand for variable = variable / value.


    6.  Modulus assignment operator (%=): Calculates the remainder of the division
    between the variable on the left-hand side and the value on the right-hand side.
    It assigns the result back to the left-hand side variable. It is a shorthand for
    variable = variable % value.


    7.  Bitwise AND assignment operator (&=): Performs a bitwise AND operation between
    the variable on the left-hand side and the value on the right-hand side. It assigns
    the result back to the left-hand side variable. It is a shorthand for variable
    = variable & value.'
