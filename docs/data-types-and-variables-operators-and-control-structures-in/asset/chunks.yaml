    \n需要注意的是，`break` 语句只会终止包含它的最内层循环。如果你有嵌套循环，`break` 语句只会跳出最内层循环。如果你想同时跳出多个嵌套循环，可以使用如标签循环（labeled\
    \ loops）或标志位（flags）等额外技术。\n\n# 使用 Continue 控制循环\n\n这里有一个 C++ 示例程序，演示了如何使用 `continue`\
    \ 语句跳到循环的下次迭代：\n\n```cpp\n#include <iostream>\n\nint main() {\n    for (int i\
    \ = 1; i <= 10; i++) {\n        if (i % 3 == 0) {\n            continue;  // 跳过循环体的剩余部分并进入下一次迭代\n\
    \        }\n        std::cout << i << \" \";\n    }\n    return 0;\n}\n```\n\n\
    在这个程序中，我们有一个从 `1` 迭代到 `10` 的 `for` 循环。循环内部有一个 `if` 条件，使用取模运算符（`%`）检查当前值 `i` 是否能被\
    \ 3 整除。如果条件为真，就会遇到 `continue` 语句。\n\n`continue` 语句会导致程序立即跳转到循环的下次迭代，跳过循环体内的任何剩余语句。在这种情况下，当\
    \ `i` 能被 3 整除时，`continue` 语句会跳过打印 `i` 值的 `std::cout` 语句。因此，能被 3 整除的数字（3、6 和 9）不会被打印。\n\
    \n该程序的输出为：\n\n1 2 4 5 7 8 10\n\n当你想要根据特定条件跳过某些迭代时，`continue` 语句在循环控制中非常有用。它允许你控制循环并在满足某些条件时跳过某些代码块。\n\
    \n通过使用 `continue`，你可以在满足特定条件时避免不必要的计算或操作，从而提高代码效率。它有助于降低代码复杂度，并使代码更易读、简洁。\n\n\
    需要注意的是，`continue` 语句只影响它所处的当前循环。如果你有嵌套循环，`continue` 语句将跳到它所属的最内层循环的下次迭代。\n\n#\
    \ 使用标签配合 Goto\n\n这里有一个使用 `goto` 语句的 C++ 示例程序：\n\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\nint main() {\n    int num;\n    input:\n    cout <<\
    \ \"输入一个正整数：\";\n    cin >> num;\n    if (num <= 0) {\n        cout << \"无效数字。请重试。\"\
    \ << endl;\n        goto input;\n    }\n    cout << \"你输入的数字是：\" << num << endl;\n\
    \    return 0;\n}\n```\n\n在这个程序中，`goto` 语句被用于实现一个简单的输入验证循环。如果用户输入非正数，程序将显示错误消息并跳回\
    \ `input` 标签，要求用户再次输入。\n\n`goto` 语句允许无条件地跳转到同一函数内的标签语句。然而，使用 `goto` 可能会产生若干影响，并且在现代编程实践中通常会被避免使用：\n\
    \n1. **可读性与可维护性**：使用 `goto` 可能会使代码更难阅读和理解。它会创建复杂的控制流，并使程序逻辑难以追踪，从而导致维护问题。大量使用\
    \ `goto` 的程序可能会变得错综复杂难以调试。\n2. **面条代码**：使用 `goto` 可能会导致所谓的“面条代码”，即控制流不可预测地跳跃。这使得代码难以推理，并可能引入难以追踪和修复的\
    \ bug 和逻辑错误。\n3. **结构化编程**：20 世纪 70 年代结构化编程原则的引入导致了循环（`for`、`while`、`do-while`）和条件（`if`、`switch`）等控制结构的发展。与使用\
    \ `goto` 控制流相比，这些结构提供了更结构化、更易读的代码，更便于维护和理解。\n4. **替代控制结构**：大多数编程语言都提供了可以替代 `goto`\
