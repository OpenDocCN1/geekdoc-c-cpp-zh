    # Logical Operators


    Here’s an example program in C++ that demonstrates the use of logical operators
    and how they are used in controlling program flow with conditional statements:


    #include <iostream>


    using namespace std;


    int main() {


        int num;


        cout << "Enter a number: ";


        cin >> num;


        // Logical AND operator (&&)


        if (num > 0 && num <= 100) {


            cout << "The number is between 1 and 100." << endl;


        }


        // Logical OR operator (||)


        if (num < 0 || num > 100) {


            cout << "The number is less than 0 or greater than 100." << endl;


        }


        // Logical NOT operator (!)


        bool isPositive = (num > 0);


        if (!isPositive) {


            cout << "The number is not positive." << endl;


        }


        return 0;


    }


    In this program, we have used three different logical operators:


    1.  Logical AND (&&): The condition num > 0 && num <= 100 uses the logical AND
    operator to check if num is greater than 0 and less than or equal to 100\. If
    both conditions are true, it prints the message indicating that the number is
    between 1 and 100.


    2.  Logical OR (||): The condition num < 0 || num > 100 uses the logical OR operator
    to check if num is less than 0 or greater than 100\. If either of the conditions
    is true, it prints the message indicating that the number is less than 0 or greater
    than 100.


    3.  Logical NOT (!): We create a boolean variable isPositive that holds the result
    of the condition num > 0\. Then we use the logical NOT operator to check if isPositive
    is false. If it is false (i.e., num is not positive), it prints the corresponding
    message.


    These logical operators are essential in controlling program flow with conditional
    statements. They allow us to combine and evaluate multiple conditions to determine
    the behavior of the program. By using logical operators, we can create complex
    conditions and make decisions based on the combined outcome of those conditions.


    # Manipulating Bits with Bitwise Operators


    Here’s an example program in C++ that demonstrates various bit manipulations using
    bitwise operators:


    #include <iostream>


    using namespace std;


    void displayBinary(unsigned int num) {


        for (int i = 31; i >= 0; i--)


            cout << ((num >> i) & 1);


        cout << endl;


    }


    int main() {


        unsigned int a = 5; // 00000000000000000000000000000101


        unsigned int b = 3; // 00000000000000000000000000000011


        // Bitwise AND


        unsigned int result = a & b; // 00000000000000000000000000000001


        cout << "Bitwise AND: ";


        displayBinary(result);


        // Bitwise OR


        result = a | b; // 00000000000000000000000000000111


        cout << "Bitwise OR: ";


        displayBinary(result);


        // Bitwise XOR


        result = a ^ b; // 00000000000000000000000000000110


        cout << "Bitwise XOR: ";


        displayBinary(result);


        // Bitwise NOT


        result = ~a; // 11111111111111111111111111111010


        cout << "Bitwise NOT: ";


        displayBinary(result);


        // Bitwise left shift


        result = a << 2; // 00000000000000000000000000010100


        cout << "Bitwise left shift: ";


        displayBinary(result);


        // Bitwise right shift


        result = a >> 1; // 00000000000000000000000000000010


        cout << "Bitwise right shift: ";


        displayBinary(result);


        return 0;


    }


    This program demonstrates various bitwise operators:


    *   The bitwise AND operator (&) performs a logical AND operation on each pair
    of corresponding bits. It can be used for bit masking and extracting specific
    bits from a number.


    *   The bitwise OR operator (|) performs a logical OR operation on each pair of
    corresponding bits. It can be used for setting specific bits in a number.


    *   The bitwise XOR operator (^) performs a logical XOR (exclusive OR) operation
    on each pair of corresponding bits. It can be used for toggling bits or performing
    bitwise addition/subtraction.


    *   The bitwise NOT operator (~) performs a bitwise negation, flipping each bit
    of the operand.


    *   The bitwise left shift operator (<<) shifts the bits of the left operand to
    the left by a specified number of positions, filling the vacated bits with zeros.


    *   The bitwise right shift operator (>>) shifts the bits of the left operand
    to the right by a specified number of positions, filling the vacated bits differently
    based on the type (sign-extension for signed types and zero-fill for unsigned
    types).


    Real-world scenarios where bitwise operators are useful include:


    1.  Bit manipulation: Bitwise operators are frequently used in low-level programming,
    embedded systems, and device drivers to manipulate individual bits of registers
    and flags, perform data encoding/decoding, or handle binary protocols.


    2.  Bit flags and masks: By using bitwise operators, you can define and manipulate
    flags or masks efficiently. Each bit represents a specific setting or state, allowing
    you to combine multiple flags into a single value and perform operations such
    as enabling, disabling, or checking various options.


    3.  Optimizations: In some cases, bitwise operations can provide faster and more
    memory-efficient solutions compared to arithmetic or logical operations. They
    can be used to replace costly mathematical calculations or complex branching conditions.


    4.  Data compression: Bitwise operations are essential in compression algorithms
    such as Huffman coding or run-length encoding, where data is efficiently represented
    using a minimal number of bits.


    5.  Cryptography: Bitwise operators are used in cryptographic algorithms, such
    as encryption and decryption algorithms, to manipulate binary data at the bit
    level, perform bitwise substitutions, or generate random numbers.


    Remember that bitwise operators should be used with caution, as they can make
    code less readable and prone to errors if not used correctly.


    # Operator Casting


    In C++, operator casting allows you to convert one data type to another. There
    are two types of casting: implicit casting (also known as automatic casting) and
    explicit casting. Implicit casting is performed by the compiler automatically
    when it can safely convert one type to another. On the other hand, explicit casting
    is performed by the programmer, specifying the type conversion explicitly.


    Here’s an example program that demonstrates operator casting and explicit type
    conversion:


    #include <iostream>


    int main() {


        double number = 3.14159;


        int integer = static_cast<int>(number); // Explicitly cast double to int


        std::cout << "Number: " << number << std::endl;


        std::cout << "Integer: " << integer << std::endl;


        return 0;


    }


    In the above program, we have a double variable called number initialized with
    the value 3.14159\. We want to convert this double value to an int value. To do
    this, we use explicit casting by using the static_cast keyword.


    The line int integer = static_cast<int>(number); explicitly casts number to an
    int. The static_cast operator is used to perform the type conversion.


    After the explicit cast, we output the original double value and the converted
    int value using std::cout.


    When you run this program, the output will be:


    Number: 3.14159


    Integer: 3


    As you can see, the double value 3.14159 is converted to an int value 3 using
    explicit casting.


    Explicit type conversion can be useful when you want to control the type conversion
    explicitly and handle any potential loss of precision or other issues that may
    occur during the conversion process. It allows you to explicitly specify how a
    value should be converted from one type to another.'
