    \n## 使用 Try/Catch 处理错误\n\n*   `try` 块包围可能抛出异常的代码。\n*   `catch` 块捕获异常并处理它们。\n*\
    \   语法：\n```cpp\ntry {\n    // 代码\n}\ncatch (exception_type e) {\n    // 处理异常\n\
    }\n```\n\n## 多个 Catch 块\n\n*   可以使用多个 `catch` 块来分别处理不同类型的异常。\n\n## 抛出异常\n\n* \
    \  `throw` 关键字用于抛出异常。\n*   语法：`throw exception;`\n\n## 自定义异常\n\n*   可以创建用户定义的异常类，通常派生自\
    \ `std::exception` 类。\n\n## Finally 块\n\n*   在 Java 等语言中，`finally` 是一个在 `try-catch`\
    \ 块之后始终执行的块，无论是否发生异常。C++ 不支持 `finally`。\n\n## 函数提前返回\n\n*   `return` 语句可以结束函数执行，并在到达函数末尾之前将控制权交给调用者。\n\
    \n## 使用 Exit 退出程序\n\n*   可以使用 `cstdlib` 中的 `exit()` 函数终止程序执行。\n\n## 多个变量的 For\
    \ 循环\n\n*   你可以在 `for` 循环中使用多个循环变量。\n*   语法：`for (int a=0, b=0; a<n && b<m; ++a,\
    \ ++b)`\n\n## Assert 宏\n\n*   `assert` 宏用于调试目的。\n*   如果其参数表达式为假，它会写入错误消息并终止程序。\n\
    \n## 静态 If (If Constexpr)\n\n*   `if constexpr` 是 C++17 的特性，执行编译时检查。\n*   它在模板编程中用于丢弃无法实例的分。\n\
    \n## 处理信号\n\n*   信号是传递给进程的软件中断。\n*   C++ 可以使用 `csignal` 库中的 `signal()` 函数处理信号。\n\
    \n## 使用 Setjmp/Longjmp 非局部跳转\n\n*   `setjmp()` 和 `longjmp()` 用于执行非局部跳转。\n*   使用\
    \ `setjmp` 会使代码难以理解。\n\n## Noreturn 关键字\n\n*   `[[noreturn]]` 是 C++11 属性，表示函数不返回。\n\
    *   用于不预期返回的函数。\n\n## 使用 Goto 控制循环\n\n*   在循环中使用 `goto` 可以允许复杂的控制流，但通常不建议这样做。\n\
    \n## 循环内部的 Try/Catch\n\n*   可以在循环内部使用 `try-catch` 块处理每次迭代的异常。\n\n## 重新抛出异常\n\n\
    *   在 `catch` 块中，不带参数的 `throw` 语句会重新抛出处理的异常。\n\n## 捕获所有异常\n\n*   `catch(...)`\
    \ 块可以捕获所有类型的异常。\n\n## 嵌套 Try/Catch 块\n\n*   `try-catch` 块可以嵌套。内部 `catch` 块捕获异常后，如果可以将其传递给外层的\
    \ `catch` 块。\n\n## Uncaught_Exception 函数\n\n*   `std::uncaught_exception()` 是\
    \ C++17 之前的函数，用于检查是否存在未捕获的异常。\n*   在 C++17 之后使用 `std::uncaught_exceptions()`。\n\
    \n## 使用 Noexcept 关键字避免异常\n\n*   `noexcept` 关键字指定函数不会异常。\n*   用于性能敏感代码和某些资源管理。\n\
    \n## 构造函数和析构函数的异常\n\n*   如果构造函数抛出异常，对象的初始化未完成。\n*   如果析构函数抛出异常且未被捕获，程序将终止。析构函数应避免抛出异常。\n\
    \n## 异常规范\n\n*   在 C++11 之前，异常规范 `throw(type)` 可指定函数可能抛出的异常，但它们已被废弃。\n\n## 在 Switch\
    \ 语句中使用枚举类\n\n*   可以在 switch case 中使用强类型枚举（`enum class`），这可以提高类型安全性和清晰度。\n\n##\
    \ 使用带有初始化器的 If\n\n*   从 C++17 开始，`if` 语句可以包含初始化器。\n*   语法：`if (init; condition)\
    \ {statements}`\n\n## 使用带有初始化器的 Switch\n\n*   从 C++17 开始，`switch` 语句也可以包含初始化器。\n\
    *   语法：`switch (init; condition) {cases}`\n\n## 变长模板\n\n*   变长模板是以类型安全的方式接收可变参数的模板。\n\
    \n## 循环中的逗号运算符\n\n*   逗号运算符允许在循环的初始化和迭代部分放置多个语句。\n\n"
- fmt: "\n* To break out of nested loops, consider using a `goto` statement, or wrap\
    \ the loops in a function and use `return`.\n\n## Continuing the Outer Loop\n\
    * To skip to the next iteration of the outer loop from inside an inner loop, consider\
    \ using a `goto` statement, or wrap the loops in a function and use `return`.\n\
    \n## Duff’s Device\n* `Duff’s device` is an optimization technique used to manually\
    \ implement loop unrolling.\n\n## Variable Length Array (VLA)\n* `VLAs` are arrays\
    \ that can be declared with a length determined at runtime.\n* Not supported directly\
    \ in standard C++, but some compilers offer it as an extension.\n\n## Function\
    \ Try Block\n* Function-level `try-catch` blocks can be used to catch exceptions\
    \ thrown in the function body and from initializer lists in constructors.\n\n\
    ## Using the Register Keyword\n* `register` is a keyword that was intended to\
    \ be a hint to the compiler to store the variable in a CPU register. However,\
    \ modern compilers often ignore this hint, and as of C++17, the `register` keyword\
    \ is deprecated.\n\n## The Auto Keyword\n* `auto` keyword is used for automatic\
    \ type deduction, which is very useful when dealing with complex types or to make\
    \ code more maintainable.\n\n## The Decay Keyword\n* Type `decay` is a property\
    \ of the C++ type system where arrays and function types automatically decay to\
    \ pointer types in certain contexts.\n\n## Default Label in a Switch Statement\n\
    * The `default` label in a `switch` statement is used as a fallback case when\
    \ none of the other cases match.\n\n## The Return Statement in Main\n* The `return`\
    \ statement in `main()` function is used to indicate the termination status of\
    \ a program to the operating system.\n\n## The Atexit Function\n* `atexit()` function\
    \ registers a function to be called when the program terminates normally.\n\n\
    ## Looping Over a Container with For Each\n* A range-based for loop (`for-each\
    \ loop`) is used to traverse elements in a container.\n\n## Iterating Over a Container\
    \ with an Iterator\n* `Iterators` provide a way to access elements in a container\
    \ sequentially without exposing its underlying representation.\n\n## Explicit\
    \ Control Flow Graphs with Goto\n* Although possible, it’s generally recommended\
    \ not to use `goto` for creating explicit control flow graphs due to the potential\
    \ for “spaghetti code.”\n\n## Repeating a Switch Statement Until a Valid Input\n\
    * To repeat a `switch` statement until valid input is received, wrap the `switch`\
    \ in a loop and `break` from the loop only when valid input is received.\n\n##\
    \ Creating an Event Loop\n* Event loop is a programming construct that waits for\
    \ and dispatches events or messages in a program. It usually involves a `while-true`\
    \ loop that dispatches events to their handlers. \n\n## Waiting for a Condition\
    \ with a Loop\n* A condition can be waited upon with a loop that continues until\
    \ the condition is met.\n\n## Checking Multiple Flags with a Switch Statement\n\
    * Although it can be done, checking multiple flags with a `switch` statement can\
    \ lead to complex code. Using `if-else` statements or bit manipulation may be\
    \ a better option.\n\n## Creating a State Machine with Switch\n* A state machine\
    \ can be created with a `switch` statement where different states are represented\
    \ by `case` labels, and state transitions are performed by changing the `switch`\
    \ variable.\n\n## The While True Loop\n* `while(true)` creates an infinite loop\
    \ that must be controlled using `break`, `return` or `exit`.\n\n## The For (;;)\
    \ Loop\n* `for(;;)` also creates an infinite loop, analogous to `while(true)`.\n\
    \n## Loop Invariants\n* A `loop invariant` is a condition that is initially true\
    \ and remains true after each iteration of a loop. They’re crucial in proving\
    \ the correctness of algorithms.\n\n## The Difference Between Prefix and Postfix\
    \ Increment in Loops\n* Prefix increment (`++i`) increments the value of `i` and\
    \ then returns `i`, while postfix increment (`i++`) increments the value of `i`,\
    \ but returns the original value.\n\n## Ignoring Exceptions with Try/Catch\n*\
    \ Exceptions can be caught and then ignored, but this is generally bad practice\
    \ as it can hide errors.\n\n## Conditional Compilation with #if and #endif\n*\
    \ Conditional compilation allows blocks of code to be included or excluded from\
    \ the program depending on conditions evaluated at compile time. It’s often used\
    \ with preprocessor directives such as `#if`, `#ifdef`, `#ifndef`, and `#endif`.\n"
  raw: '*   To break out of nested loops, consider using a goto statement, or wrap
    the loops in a function and use return.


    Continuing the Outer Loop


    *   To skip to the next iteration of the outer loop from inside an inner loop,
    consider using a goto statement, or wrap the loops in a function and use return.


    Duff’s Device


    *   Duff’s device is an optimization technique used to manually implement loop
    unrolling.


    Variable Length Array (VLA)


    *   VLAs are arrays that can be declared with a length determined at runtime.


    *   Not supported directly in standard C++, but some compilers offer it as an
    extension.


    Function Try Block


    *   Function-level try-catch blocks can be used to catch exceptions thrown in
    the function body and from initializer lists in constructors.


    Using the Register Keyword


    *   register is a keyword that was intended to be a hint to the compiler to store
    the variable in a CPU register. However, modern compilers often ignore this hint,
    and as of C++17, the register keyword is deprecated.


    The Auto Keyword


    *   auto keyword is used for automatic type deduction, which is very useful when
    dealing with complex types or to make code more maintainable.


    The Decay Keyword


    *   Type decay is a property of the C++ type system where arrays and function
    types automatically decay to pointer types in certain contexts.


    Default Label in a Switch Statement


    *   The default label in a switch statement is used as a fallback case when none
    of the other cases match.


    The Return Statement in Main


    *   The return statement in main() function is used to indicate the termination
    status of a program to the operating system.


    The Atexit Function


    *   atexit() function registers a function to be called when the program terminates
    normally.


    Looping Over a Container with For Each


    *   A range-based for loop (for-each loop) is used to traverse elements in a container.


    Iterating Over a Container with an Iterator


    *   Iterators provide a way to access elements in a container sequentially without
    exposing its underlying representation.


    Explicit Control Flow Graphs with Goto


    *   Although possible, it’s generally recommended not to use goto for creating
    explicit control flow graphs due to the potential for “spaghetti code.”


    Repeating a Switch Statement Until a Valid Input


    *   To repeat a switch statement until valid input is received, wrap the switch
    in a loop and break from the loop only when valid input is received.


    Creating an Event Loop


    *   Event loop is a programming construct that waits for and dispatches events
    or messages in a program. It usually involves a while-true loop that dispatches
    events to their handlers.


    Waiting for a Condition with a Loop


    *   A condition can be waited upon with a loop that continues until the condition
    is met.


    Checking Multiple Flags with a Switch Statement


    *   Although it can be done, checking multiple flags with a switch statement can
    lead to complex code. Using if-else statements or bit manipulation may be a better
    option.


    Creating a State Machine with Switch


    *   A state machine can be created with a switch statement where different states
    are represented by case labels, and state transitions are performed by changing
    the switch variable.


    The While True Loop


    *   while(true) creates an infinite loop that must be controlled using break,
    return or exit.


    The For (;;) Loop


    *   for(;;) also creates an infinite loop, analogous to while(true).


    Loop Invariants


    *   A loop invariant is a condition that is initially true and remains true after
    each iteration of a loop. They’re crucial in proving the correctness of algorithms.


    The Difference Between Prefix and Postfix Increment in Loops


    *   Prefix increment (++i) increments the value of i and then returns i, while
    postfix increment (i++) increments the value of i, but returns the original value.


    Ignoring Exceptions with Try/Catch


    *   Exceptions can be caught and then ignored, but this is generally bad practice
    as it can hide errors.


    Conditional Compilation with #if and #endif


    *   Conditional compilation allows blocks of code to be included or excluded from
    the program depending on conditions evaluated at compile time. It’s often used
    with preprocessor directives such as #if, #ifdef, #ifndef, and #endif.'
