  raw: 'Unary operators are operators that work with only one operand. In C++, there
    are several unary operators available:


    1.  Increment (++): The increment operator increments the value of its operand
    by one.


    2.  Decrement (–): The decrement operator decreases the value of its operand by
    one.


    3.  Plus (+): The unary plus operator represents the identity operation, indicating
    no change in the operand’s value.


    4.  Minus (-): The unary minus operator negates the value of its operand, changing
    a positive value to negative and vice versa.


    5.  Logical NOT (!): The logical NOT operator reverses the logical state of its
    operand. If the operand is true, it returns false, and if the operand is false,
    it returns true.


    6.  Bitwise NOT (~): The bitwise NOT operator performs a bitwise negation on its
    operand, flipping each bit from 0 to 1 and vice versa.


    7.  Address (&): The address-of operator returns the memory address of its operand.


    Here’s an example program demonstrating the use of unary operators:


    #include <iostream>


    using namespace std;


    int main() {


        int num = 5;


        cout << "Initial value of num: " << num << endl;


        // Increment operator


        num++;


        cout << "After increment: " << num << endl;


        // Decrement operator


        num--;


        cout << "After decrement: " << num << endl;


        // Unary plus operator


        num = +num;


        cout << "Unary plus: " << num << endl;


        // Unary minus operator


        num = -num;


        cout << "Unary minus: " << num << endl;


        // Logical NOT operator


        bool flag = true;


        cout << "Logical NOT: " << !flag << endl;


        // Bitwise NOT operator


        int value = 10;


        cout << "Bitwise NOT: " << ~value << endl;


        // Address-of operator


        int* ptr = &num;


        cout << "Address of num: " << ptr << endl;


        return 0;


    }


    Output:


    Initial value of num: 5


    After increment: 6


    After decrement: 5


    Unary plus: 5


    Unary minus: -5


    Logical NOT: 0


    Bitwise NOT: -11


    Address of num: 0x7ffee5f556d4


    Unary operators are useful in various situations. Some common use cases include:


    1.  Incrementing or decrementing a variable: Unary increment and decrement operators
    are often used in loops or other scenarios where you need to modify the value
    of a variable by a fixed amount.


    2.  Changing the sign of a value: The unary minus operator is handy for changing
    the sign of a numeric variable. It can be used to convert a positive value to
    negative or vice versa.


    3.  Logical and bitwise operations: Unary operators like logical NOT and bitwise
    NOT are useful for performing logical and bitwise operations on variables or expressions.


    4.  Taking the address of a variable: The address-of operator is used to obtain
    the memory address of a variable. It is often used in pointer-related operations.


    These are just a few examples of how unary operators can be used in C++. They
    provide powerful tools for manipulating values and performing various operations
    on them.


    # Understanding the Volatile Keyword


    Here’s an example program in C++ that demonstrates the use of the volatile keyword:


    #include <iostream>


    #include <thread>


    #include <chrono>


    volatile bool flag = false;


    void toggleFlag() {


        while (true) {


            flag = !flag;


            std::this_thread::sleep_for(std::chrono::milliseconds(500));


        }


    }


    int main() {


        std::thread t(toggleFlag);


        while (true) {


            if (flag) {


                std::cout << "Flag is true" << std::endl;


            } else {


                std::cout << "Flag is false" << std::endl;


            }


            std::this_thread::sleep_for(std::chrono::milliseconds(100));


        }


        t.join();


        return 0;


    }


    In this program, we have a global variable flag declared as volatile bool. The
    volatile keyword is used to indicate to the compiler that the variable can be
    modified by external entities that are not known to the compiler, such as interrupt
    handlers or other threads. It instructs the compiler not to optimize or cache
    the variable.


    In the toggleFlag function, we continuously toggle the value of flag using a loop
    and a delay of 500 milliseconds. In the main function, we periodically check the
    value of flag and print a corresponding message. Both the toggleFlag function
    and the main function are executed in separate threads.


    The use of volatile in this program is essential to ensure that the changes made
    to flag in one thread are immediately visible to the other thread. Without the
    volatile keyword, the compiler might optimize the code by caching the value of
    flag in a register, causing the main thread to read stale values and not reflect
    the updates made by the toggleFlag thread.


    In multithreaded programs, the volatile keyword is useful when sharing data between
    threads without using synchronization mechanisms like mutexes or atomic operations.
    However, it is important to note that volatile alone does not provide thread safety.
    It only guarantees that the variable will be read and written directly from/to
    memory. Synchronization mechanisms should still be used to ensure proper coordination
    and consistency in multithreaded environments.


    In addition to multithreaded programs, the volatile keyword is often used when
    working with interrupt handlers. Interrupt handlers are functions that are called
    asynchronously in response to hardware or software events. Since these handlers
    can be invoked at any time, variables accessed within them should be declared
    as volatile to ensure that their values are not cached or optimized away by the
    compiler.


    Overall, the volatile keyword serves as a directive to the compiler, indicating
    that a variable’s value can change unexpectedly by external entities, and it should
    be read from and written to memory directly.


    # Using Lambda Expressions


    Here’s an example program in C++ that demonstrates the use of lambda expressions:


    #include <iostream>


    int main() {


        // Declare and initialize an integer variable


        int x = 5;


        // Define a lambda expression that increments a given number by ''x''


        auto incrementByX = [x](int num) {


            return num + x;


        };


        // Use the lambda expression to increment a number


        int result = incrementByX(10);


        // Print the result


        std::cout << "Result: " << result << std::endl;


        return 0;


    }


    In this example, we define a lambda expression called incrementByX that takes
    an integer parameter num and returns the sum of num and the captured variable
    x. The captured variable x is accessed inside the lambda expression using the
    [x] syntax.


    Lambda expressions in C++ provide a way to encapsulate small pieces of functionality
    or behavior. They are anonymous functions that can be defined inline within the
    code and can capture variables from their surrounding scope.


    In this case, the lambda expression encapsulates the functionality of incrementing
    a number by a fixed value (x). By capturing the variable x, the lambda expression
    is able to access and use its value. This allows us to create a function-like
    object (incrementByX) that can be used to increment numbers by the captured value
    of x.


    Lambda expressions are particularly useful in scenarios where you need a small,
    self-contained piece of functionality that doesn’t need to be defined separately
    as a named function. They provide a concise way to define such functionality inline,
    improving code readability and reducing the need for boilerplate code.


    Note that lambda expressions are a feature introduced in C++11 and onwards, so
    make sure you’re using a compiler that supports this feature.


