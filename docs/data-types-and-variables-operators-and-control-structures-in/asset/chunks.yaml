    \ != obj2) {\n        std::cout << \"obj1 is not equal to obj2\";\n    }\n   \
    \ return 0;\n}\n```\n\n在这个示例中，`MyClass` 代表一个有一个成员变量 `value` 的自定义类。我们将关系运算符 `<`,\
