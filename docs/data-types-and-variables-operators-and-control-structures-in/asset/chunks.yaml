    *   Used to iterate over elements in a range (like arrays, containers).


    *   Syntax: for (declaration : range) {statements}


    Loop Control with Break


    *   break statement is used to stop the loop prematurely.


    *   Exits the current loop and transfers execution to the statement immediately
    following the loop.


    Loop Control with Continue


    *   continue statement skips the remaining part of the loop and moves the control
    back to the start of the loop for next iteration.


    Going to Labels with Goto


    *   goto statement transfers control to the labelled statement.


    *   It’s generally discouraged due to reducing readability and maintainability.


    Using the Conditional (Ternary) Operator


    *   A shorthand way of writing an if-else statement.


    *   Syntax: condition ? expression_if_true : expression_if_false;


    Switch Case with Enumerations


    *   Enumeration values can be used in switch cases for clearer and less error-prone
    code.


    Handling Errors with Try/Catch


    *   try block encloses code that might throw an exception.


    *   catch block catches exceptions and handles them.


    *   Syntax:


    try {


        // code


    }


    catch (exception_type e) {


        // handle exception


    }


    Multiple Catch Blocks


    *   More than one catch block can be used to handle different types of exceptions
    separately.


    Throwing Exceptions


    *   throw keyword is used to throw exceptions.


    *   Syntax: throw exception;


    Custom Exceptions


    *   User-defined exception classes can be created, usually derived from the std::exception
    class.


    The Finally Block


    *   In other languages like Java, finally is a block that is always executed after
    a try-catch block, whether an exception occurred or not. C++ does not support
    finally.


    Early Function Return


    *   return statement can be used to end function execution and return control
    to the caller before reaching the end of the function.


