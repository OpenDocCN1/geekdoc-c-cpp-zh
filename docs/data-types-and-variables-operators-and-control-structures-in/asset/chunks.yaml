    # Handling Signals


    In C++, handling signals involves defining signal handlers that are responsible
    for responding to specific signals raised by the operating system. Signals can
    be used for interprocess communication (IPC) in various ways. Let’s discuss how
    signals can be used for IPC and then provide an example program.


    Signals for Interprocess Communication (IPC):


    1.  Process Termination: Signals like SIGTERM and SIGINT can be used to request
    the termination of a process. By handling these signals, a process can perform
    cleanup operations or notify other processes before exiting gracefully.


    2.  Synchronization: Signals can be employed to synchronize processes. For example,
    a process can send a specific signal to another process to indicate that it has
    completed a critical section of code, and the receiving process can proceed accordingly.


    3.  Event Notification: Signals can be used to notify processes about specific
    events. A process can raise a signal when an event occurs, and other processes
    can handle that signal to react accordingly. This allows processes to communicate
    without polling or busy waiting.


    4.  Error Handling: Signals can be used to communicate errors between processes.
    For instance, a process encountering an error condition can send a signal to another
    process, indicating that an error has occurred and providing relevant information.


    Now, let’s look at an example program that handles the SIGINT signal to gracefully
    terminate a process:


    #include <iostream>


    #include <csignal>


    // Signal handler function


    void signalHandler(int signal) {


        if (signal == SIGINT) {


            std::cout << "Received SIGINT signal. Terminating gracefully." << std::endl;


            // Perform cleanup operations here if necessary


            // ...


            exit(signal); // Terminate the process


        }


    }


    int main() {


        // Register signal handler


        std::signal(SIGINT, signalHandler);


        std::cout << "Running the program. Press Ctrl+C to terminate." << std::endl;


        // Simulating a long-running process


        while (true) {


            // Perform some tasks


        }


        return 0;


    }


    In the example above, we define a signalHandler function that is triggered when
    the SIGINT signal (generated by pressing Ctrl+C in the terminal) is received.
    Inside the handler, we display a message and perform any necessary cleanup operations
    before calling exit() to terminate the process gracefully.


    By registering the signalHandler function using std::signal(SIGINT, signalHandler),
    we instruct the operating system to call our custom handler when the SIGINT signal
