    \n在 `std::cout` 语句中，我们使用间接运算符（也称为解引用运算符），由星号 `*` 表示，来访问 `ptr` 所内存的值。通过对 `ptr`\
    \ 进行解引用 `*ptr`，我们可以获得该地址存储的值。\n\n"
