    In the Counter class, we define two versions of each operator: prefix and postfix.


    The prefix increment operator (++c) increments the count value and returns a reference
    to the modified object. It changes the value of the object and then returns the
    modified object itself. This means that the incremented value is immediately available
    for use.


    The postfix increment operator (c++) also increments the count value but returns
    a copy of the original object before the increment. It creates a temporary copy,
    increments the value, and then returns the copy. The original value is used for
    the current expression, and the incremented value will be available in subsequent
    expressions.


    Similarly, the prefix decrement operator (—c) and postfix decrement operator (c—)
    work in the same way but decrement the count value instead.


    When using the increment and decrement operators, it’s important to understand
