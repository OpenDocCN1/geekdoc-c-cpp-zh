    \ C++ 中很少使用。\n\n1. **错误处理**：`setjmp` 和 `longjmp` 的主要用途之一是错误处理，特别是在无法或不希望使用异常的情况下。它们提供了一种处理异常情况的替代机制。然而，在现代\
    \ C++ 中，异常是处理错误的推荐方法，因为它们提供了更健壮且表达丰富的错误管理。\n2. **复杂的控制流**：非局部跳转（non-local jumps）的另一个用例如管理复杂的控制流。然而，非局部跳转会让代码难以理解和维护。它们可能会导致意外行为，难以推理程序的执行。因此，在\
    \ C++ 编程中通常不建议使用它们。\n3. **与 C 的兼容性**：C++ 支持 C 标准库，`setjmp` 和 `longjmp` 是其一部分。它们在\
    \ C++ 中的存在允许 C 和 C++ 之间的代码互操作。然而，在现代 C++ 代码库中，倾向于使用 C++ 特有的构造，如异常、`RAII`（资源获取初始化）和智能指针来处理错误处理和资源管理。\n\
    4. **C++ 中的替代方案**：C++ 提供了更强大、更安全的构造来处理异常情况，如异常、`try-catch` 块和 `RAII`。与 `setjmp`\
    \ 和 `longjmp` 相比，这些机制提高了代码的可读性、维护性和错误处理能力。\n\n结论是，虽然 `setjmp` 和 `longjmp` 存在于\
    \ C++ 中并用于非局部跳转，但它们在现代 C++ 代码库中很少使用。语言提供了更复杂的机制，如异常和 `RAII`，它们提供了更好的控制流管理和错误处理，使得在大多数情况下使用\
    \ `setjmp` 和 `longjmp` 变得没有必要。\n\n# Noreturn 关键字\n\n在 C++ 中，`[[noreturn]]` 属性用于指示函数不会返回到其调用者。它通常用于执行操作且不期望将控制流返回给调用代码的函数。\n\
    \n这里是一个演示 `[[noreturn]]` 属性使用的示例程序：\n\n```cpp\n[[noreturn]] void exitProgram()\
    \ {\n    // 执行一些清理或错误处理任务\n    // ...\n    std::exit(0); // 终止程序\n}\n\nint main()\
    \ {\n    exitProgram();\n    std::cout << \"This line will not be reached.\" <<\
    \ std::endl;\n    return 0;\n}\n```\n\n在这个示例中，`exitProgram()` 函数被标记为 `[[noreturn]]`，指示它不会返回。它执行了一些必要的清理或错误处理任务，然后使用\
    \ `std::exit()` 终止程序。调用 `exitProgram()` 后，程序流永远不会到达打印“This line will not be reached.”的后续行。\n\
    \n`[[noreturn]]` 属性提供了若干益处：\n\n1. **编译器优化**：将函数标记为 `[[noreturn]]` 允许编译器执行某些优化，例如消除假设控制流将在函数调用之后继续的代码。\n\
    2. **代码清晰度和文档**：通过显式声明函数不返回，你可以让代码更具自解释性，让阅读代码的其他人员更容易理解。它作为文档的形式，指示了函数的预期行为。\n\
    3. **静态分析工具**：静态分析工具利用 `[[noreturn]]` 属性来检测潜在的 Bug 或死代码。如果标记为 `[[noreturn]]` 的函数无意中返回了，静态分析工具可以发出警告或错误。\n\
    \n谨慎使用 `[[noreturn]]` 并且仅对确实打算不返回的函数使用它是非常重要的。标记可能存在意外路径通向非返回状态的函数可能会误导开发者并阻碍代码维护。在对程序流有清晰理解且能够提供有意义益处（例如改进代码优化和文档）时使用该属性。\n\
    \n注意，`[[noreturn]]` 属性并不由编译器强制执行，这意味着仍然可能调用标记为 `[[noreturn]]` 的函数，并通过 `longjmp`\
    \ 或类似技术跳出它以继续程序执行。然而，这样做是未定义行为，应该被避免。总而言，`[[noreturn]]` 是 C++ 中一个实用的属性，用于指示不返回的函数。\n\
    \n# 使用 Goto 控制循环\n\n这里有一个使用 `goto` 进行控制的 C++ 程序示例：\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    int count = 0;\nloop:\n    count++;\n    std::cout << count\
    \ << std::endl;\n    if (count < 10) {\n        goto loop;\n    }\n    return\
    \ 0;\n}\n```\n\n在这个程序中，`goto` 语句用于跳回 `loop` 标签。`count` 变量递增直到达到 10。\n\n现在，让我们讨论\
    \ C++ 中 `goto` 的风险和潜在用途：\n\n### 使用 goto 的风险\n1. **代码复杂性**：`goto` 的使用会让代码变得复杂且难以理解，特别是当用于复杂的控制流时。\n\
    2. **意外跳转**：误用 `goto` 会导致意外跳转，产生 Bug。\n3. **难以跟踪控制流**：当大量使用 `goto` 时，跟踪程序的流变得困难。\n\
    \n### goto 的用途\n1. **错误处理**：在某些情况下，`goto` 可用于错误处理和资源清理。例如，如果函数发生错误，可以使用 `goto`\
    \ 跳到公共区域以释放资源。\n2. **跳出嵌套循环**：在处理嵌套循环时，`goto` 可以一次跳出多个循环。这在其他控制语句很麻烦的情况下非常有用。\n\
    3. **性能优化**：在少数情况下，使用 `goto` 可以通过避免必要的检查产生更高效的代码。然而，应该谨慎这样做。\n\n需要注意的是，在现代编程实践中通常不建议使用\
    \ `goto`。它通常被视为一种代码异味（code smell），并可以用结构化的控制构造（如循环、条件判断和函数）来替代，这些构造使代码更易读、更易维护且不易出错。\n\
    \n# 循环中的 Try/Catch\n\n这里有一个演示在循环内部使用 `try-catch` 块的 C++ 程序示例：\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n    int numbers[] = {1, 2, 3, 4, 5};\n    int divisor\
    \ = 0;\n    for (int i = 0; i < 5; i++) {\n        try {\n            int result\
    \ = numbers[i] / divisor;\n            std::cout << \"Result: \" << result <<\
    \ std::endl;\n        } catch (std::exception& e) {\n            std::cout <<\
    \ \"Exception caught: \" << e.what() << std::endl;\n        }\n    }\n    return\
    \ 0;\n}\n```\n"
