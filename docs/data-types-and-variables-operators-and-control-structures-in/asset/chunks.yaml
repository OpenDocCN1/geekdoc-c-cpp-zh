    \ in destructor\");\n    }\n};\n\nint main() {\n    try {\n        MyObject obj;\n\
    \    } catch (const std::exception& e) {\n        std::cout << \"Caught exception:\
    \ \" << e.what() << std::endl;\n    }\n    return 0;\n}\n```\n\n在这个程序中，`MyObject`\
    \ 类有一个会抛出 `std::runtime_error` 异常的构造函数，以及一个同样抛出相同异常的析构函数。在 `main` 函数中，我们创建了一个\
    \ `MyObject` 实例，由于构造函数抛出了异常，控制流转移到 `catch` 块，在那里捕获异常并打印错误信息。\n\n现在，让我们讨论一下在构造函数和析构函数中处理异常的挑战：\n\
    \n1.  **构造函数异常**：当构造函数中发生异常时，对象尚未完全构造。这意味着对于部分构造的对象将不会调用其析构函数。如果在抛出异常之前已经分配了资源，这可能会导致资源泄漏或状态不一致。在抛出异常之前，确保对任何分配的资源进行适当清理是非常关重要的。\n\
    2.  **析构函数异常**：在析构函数中抛出异常会带来严峻挑战。如果在栈回溯期间（即在按照构造的反序顺序析构其他对象期间）发生异常，程序将通过调用 `std::terminate`\
    \ 异常终止。这样做是为了防止级联异常和潜在的内存泄漏。因此，通常建议在析构函数中捕获异常，并记录或优雅地处理它们，而不是重新抛出。\n3.  **异常安全**：在构造函数和析构函数中处理异常需要仔细注意异常安全。这意味着即使在抛出异常时，对象必须保持一致的状态。回滚构造函数所做的任何更改并释放已获取的资源以防止泄漏。使用适当的\
    \ RAII（资源获取即初始化）技术（如智能指针和容器）有助于确保异常安全。\n4.  **适当的错误处理**：构造函数和析构函数应该恰当地处理异常，以便向调用者提供清晰的错误信息，或记录异常以供调试。在这些特殊的成员函数中捕获异常应谨慎行之，确保它们不会隐藏关键错误或导致静默失败。\n\
    \n通过理解这些挑战并遵循异常处理的最佳实践，你可以构建出健壮且可靠的代码，有效地处理构造函数和析构函数中的异常。\n\n# 异常规范\n\n在 C++ 中，异常规范（exception\
    \ specifications）用于声明函数可能抛出的异常类型。它们在函数声明中使用 `throw` 关键字进行指定。\n\n这里是一个展示异常规范用例的示例程序：\n\
    \n```cpp\n#include <iostream>\n\nvoid throwException(bool throwExc)\n{\n    if\
    \ (throwExc)\n        throw 42; // 抛出一个整数异常\n}\n\nint main()\n{\n    try {\n \
    \       throwException(true);\n    }\n    catch (int ex)\n    {\n        std::cout\
    \ << \"Caught exception: \" << ex << std::endl;\n    }\n    return 0;\n}\n```\n\
    \n在上面的示例中，`throwException` 函数具有一个异常规范，说明它可以抛出 `int` 类型的异常。在函数内部，我们使用 `throw` 关键字抛出一个整数异常。在\
    \ `main` 函数中，我们捕获异常并打印其值。\n\n现在，让我们讨论为什么异常规范在 C++ 中被废弃。异常规范在 C++ 早期版本中引入，但从 C++11\
    \ 标准开始已被废弃。废弃异常规范有几个原因：\n\n1.  **缺乏强制执行**：异常规范最初旨在作为一种指定函数所抛出异常类型的合约。然而，C++ 编译器并没有执行这些规范，导致它们不可靠。如果函数抛出了意之外的异常类型，将调用\
    \ `unexpected()` 函数，而不是按照规范传播异常。\n2.  **意外后果**：异常规范会对代码产生意外后果。例如，如果一个函数的异常规范没有包含某种异常类型，它将导致调用\
    \ `std::unexpected()` 函数，这可能导致程序终止。这种行为是不受欢迎的，并且使得在存在异常时难以推断程序的行为。\n\n"
- fmt: "\n## 3. Flexibility and compatibility\nException specifications limited the\
    \ flexibility and evolution of code. If a function’s exception specification changed,\
    \ all the callers of that function needed to be updated as well. This tight coupling\
    \ hindered the ability to make changes to exception handling without breaking\
    \ existing code. Instead, C++ emphasizes the use of dynamic exception specifications\
    \ and runtime checks, allowing greater flexibility and compatibility.\n\nInstead\
    \ of exception specifications, C++ recommends using exception handling mechanisms\
    \ like `try-catch` blocks and more expressive features introduced in newer standards.\
    \ Modern C++ encourages the use of exception handling best practices, such as\
    \ catching specific exception types, using `RAII` (Resource Acquisition Is Initialization)\
    \ for resource management, and providing meaningful exception messages.\n\nTo\
    \ summarize, exception specifications have been deprecated in C++ due to their\
    \ lack of enforcement, unintended consequences, and their impact on code flexibility\
    \ and compatibility. It is recommended to use exception handling mechanisms like\
    \ `try-catch` blocks and adhere to modern exception handling practices.\n\n# Using\
    \ Enum Classes in Switch Statements\n\nHere’s an example of a C++ program that\
    \ uses an `enum class` in a switch statement:\n\n```cpp\n#include <iostream>\n\
    \nenum class DayOfWeek {\n    Monday,\n    Tuesday,\n    Wednesday,\n    Thursday,\n\
    \    Friday,\n    Saturday,\n    Sunday\n};\n\nvoid printDay(DayOfWeek day) {\n\
    \    switch (day) {\n        case DayOfWeek::Monday:\n            std::cout <<\
    \ \"It's Monday!\" << std::endl;\n            break;\n        case DayOfWeek::Tuesday:\n\
    \            std::cout << \"It's Tuesday!\" << std::endl;\n            break;\n\
    \        case DayOfWeek::Wednesday:\n            std::cout << \"It's Wednesday!\"\
    \ << std::endl;\n            break;\n        case DayOfWeek::Thursday:\n     \
    \       std::cout << \"It's Thursday!\" << std::endl;\n            break;\n  \
    \      case DayOfWeek::Friday:\n            std::cout << \"It's Friday!\" << std::endl;\n\
    \            break;\n        case DayOfWeek::Saturday:\n            std::cout\
    \ << \"It's Saturday!\" << std::endl;\n            break;\n        case DayOfWeek::Sunday:\n\
    \            std::cout << \"It's Sunday!\" << std::endl;\n            break;\n\
    \        default:\n            std::cout << \"Invalid day.\" << std::endl;\n \
    \           break;\n    }\n}\n\nint main() {\n    DayOfWeek today = DayOfWeek::Tuesday;\n\
    \    printDay(today);\n    return 0;\n}\n```\n\nIn this program, we define an\
    \ `enum class` called `DayOfWeek` with seven possible values representing each\
    \ day of the week. The `printDay` function takes a `DayOfWeek` parameter and uses\
    \ a `switch` statement to print a corresponding message based on the provided\
    \ day.\n\nNow, let’s discuss the type safety benefits of `enum classes`:\n\n1.\
    \ **Scoped Naming**: `enum classes` introduce a scoped naming mechanism, which\
    \ means that the enumerators (e.g., `Monday`, `Tuesday`) are part of the enumeration’s\
    \ type. In the example above, `DayOfWeek::Monday` refers to the `Monday` enumerator\
    \ within the `DayOfWeek` enumeration. This prevents naming conflicts and improves\
    \ code clarity.\n2. **Strong Typing**: `enum classes` provide strong typing, meaning\
    \ that the enumerators have their own distinct type. In the example, `DayOfWeek::Monday`\
    \ has the type `DayOfWeek`, not just an integer like traditional enums. This prevents\
    \ accidental assignment or comparison with unrelated enum values or integers,\
    \ enhancing type safety.\n3. **Compile-Time Checks**: `enum classes` enable the\
    \ compiler to perform additional compile-time checks. When using an `enum class`\
    \ in a `switch` statement, the compiler can detect missing or duplicate case labels\
    \ and generate warnings or errors accordingly. This helps catch potential logic\
    \ errors early in the development process.\n4. **Explicit Conversion**: `enum\
    \ classes` require explicit conversion to integral types, providing better control\
    \ over how the enumeration values are used. In the example, you cannot directly\
    \ assign an integer value to a `DayOfWeek` variable without explicit casting,\
    \ which reduces the risk of unintentional assignments and enhances type safety.\n\
    \nOverall, using `enum classes` in switch statements and throughout the codebase\
    \ offers improved type safety by providing stronger typing, better scoping, compile-time\
    \ checks, and explicit conversions. These benefits contribute to more robust and\
    \ less error-prone code.\n\n# Using If with Initializer\n\nHere’s an example program\
    \ that demonstrates the use of an `if` statement with an initializer in C++:\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    if (int x = 5; x > 0) {\n \
    \       std::cout << \"positive.\" << std::endl;\n    } else {\n        std::cout\
    \ << \"non-positive.\" << std::endl;\n    }\n    return 0;\n}\n```\n\nIn this\
    \ program, the `if` statement includes an initializer `int x = 5`. There are a\
    \ few reasons why you might want to use the `if` statement with an initializer:\n\
    \n1. **Limited scope**: The variable declared in the initializer is only visible\
    \ within the `if` statement. It does not pollute the surrounding scope, which\
    \ can help naming conflicts with other variables.\n2. **Initialization in place**:\
    \ By combining the initialization and condition in one place, you keep related\
    \ code together, making it easier to read.\n3. **Avoid accidental use of uninitialized\
    \ variables**: Initializing the variable within the `if` statement ensures that\
    \ it has a valid value when used. This can be particularly useful simple.\n\n\
    It’s worth noting that this feature is only available in C++17. If you’re working\
    \ with an older compiler, you may need to use alternative approaches.\n\n# Using\
    \ Switch with Initializer\n\nHere’s an example program that demonstrates the use\
    \ of a `switch` statement with an initializer in C++:\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    int choice = 2;\n    switch (int i = choice) {\n        case\
    \ 1:\n            std::cout << \"You chose 1.\" << std::endl;\n            break;\n\
    \        case 2:\n            std::cout << \"You chose 2.\" << std::endl;\n  \
    \          break;\n        case 3:\n            std::cout << \"You chose 3.\"\
    \ << std::endl;\n            break;\n        default:\n            std::cout <<\
    \ \"Invalid option.\" << std::endl;\n            break;\n    }\n    return 0;\n\
    }\n```\n\nIn this code, we use the initializer feature of the `switch` statement\
    \ in C++17. The variable `i` is declared and initialized with the value of `choice`\
    \ inside the switch statement itself.\n"
  raw: '3.  Flexibility and compatibility: Exception specifications limited the flexibility
    and evolution of code. If a function’s exception specification changed, all the
    callers of that function needed to be updated as well. This tight coupling hindered
    the ability to make changes to exception handling without breaking existing code.
    Instead, C++ emphasizes the use of dynamic exception specifications and runtime
    checks, allowing greater flexibility and compatibility.


    Instead of exception specifications, C++ recommends using exception handling mechanisms
    like try-catch blocks and more expressive features introduced in newer standards.
    Modern C++ encourages the use of exception handling best practices, such as catching
    specific exception types, using RAII (Resource Acquisition Is Initialization)
    for resource management, and providing meaningful exception messages.


    To summarize, exception specifications have been deprecated in C++ due to their
    lack of enforcement, unintended consequences, and their impact on code flexibility
    and compatibility. It is recommended to use exception handling mechanisms like
    try-catch blocks and adhere to modern exception handling practices.


    # Using Enum Classes in Switch Statements


    Here’s an example of a C++ program that uses an enum class in a switch statement:


    #include <iostream>


    enum class DayOfWeek {


        Monday,


        Tuesday,


        Wednesday,


        Thursday,


        Friday,


        Saturday,


        Sunday


    };


    void printDay(DayOfWeek day) {


        switch (day) {


            case DayOfWeek::Monday:


                std::cout << "It''s Monday!" << std::endl;


                break;


            case DayOfWeek::Tuesday:


                std::cout << "It''s Tuesday!" << std::endl;


                break;


            case DayOfWeek::Wednesday:


                std::cout << "It''s Wednesday!" << std::endl;


                break;


            case DayOfWeek::Thursday:


                std::cout << "It''s Thursday!" << std::endl;


                break;


            case DayOfWeek::Friday:


                std::cout << "It''s Friday!" << std::endl;


                break;


            case DayOfWeek::Saturday:


                std::cout << "It''s Saturday!" << std::endl;


                break;


            case DayOfWeek::Sunday:


                std::cout << "It''s Sunday!" << std::endl;


                break;


            default:


                std::cout << "Invalid day." << std::endl;


                break;


        }


    }


    int main() {


        DayOfWeek today = DayOfWeek::Tuesday;


        printDay(today);


        return 0;


    }


    In this program, we define an enum class called DayOfWeek with seven possible
    values representing each day of the week. The printDay function takes a DayOfWeek
    parameter and uses a switch statement to print a corresponding message based on
    the provided day.


    Now, let’s discuss the type safety benefits of enum classes:


    1.  Scoped Naming: Enum classes introduce a scoped naming mechanism, which means
    that the enumerators (e.g., Monday, Tuesday) are part of the enumeration’s type.
    In the example above, DayOfWeek::Monday refers to the Monday enumerator within
    the DayOfWeek enumeration. This prevents naming conflicts and improves code clarity.


    2.  Strong Typing: Enum classes provide strong typing, meaning that the enumerators
    have their own distinct type. In the example, DayOfWeek::Monday has the type DayOfWeek,
    not just an integer like traditional enums. This prevents accidental assignment
    or comparison with unrelated enum values or integers, enhancing type safety.


    3.  Compile-Time Checks: Enum classes enable the compiler to perform additional
    compile-time checks. When using an enum class in a switch statement, the compiler
    can detect missing or duplicate case labels and generate warnings or errors accordingly.
    This helps catch potential logic errors early in the development process.


    4.  Explicit Conversion: Enum classes require explicit conversion to integral
    types, providing better control over how the enumeration values are used. In the
    example, you cannot directly assign an integer value to a DayOfWeek variable without
    explicit casting, which reduces the risk of unintentional assignments and enhances
    type safety.


    Overall, using enum classes in switch statements and throughout the codebase offers
    improved type safety by providing stronger typing, better scoping, compile-time
    checks, and explicit conversions. These benefits contribute to more robust and
    less error-prone code.


    # Using If with Initializer


    Here’s an example program that demonstrates the use of an if statement with an
    initializer in C++:


    #include <iostream>


    int main() {


        if (int x = 5; x > 0) {


            std::cout << "x is positive." << std::endl;


        } else {


            std::cout << "x is non-positive." << std::endl;


        }


        return 0;


    }


    In this program, the if statement includes an initializer int x = 5;. The variable
    x is initialized with the value 5 within the if statement itself.


    The use of an initializer in an if statement is a C++17 feature known as “if with
    initializer.” It allows you to declare and initialize a variable right within
    the condition of the if statement.


    There are a few reasons why you might want to use the if statement with an initializer:


    1.  Limited scope: The variable declared in the initializer is only visible within
    the scope of the if statement. It does not pollute the surrounding scope, which
    can help improve code clarity and avoid naming conflicts with other variables.


    2.  Initialization and condition in one place: By combining the initialization
    and the condition in the if statement, you can keep related code together, making
    it easier to read and maintain. This can be particularly useful when the initialization
    is simple and directly related to the condition.


    3.  Avoid accidental use of uninitialized variables: Initializing the variable
    within the if statement ensures that it has a valid value when used inside the
    if block. This can help prevent bugs caused by accidentally using uninitialized
    variables.


    It’s worth noting that this feature is most useful when the variable’s scope is
    limited to the if statement, and you don’t need to reuse the variable outside
    of it. If you need to use the variable later in the code, it’s generally better
    to declare it outside the if statement.


    Remember that the if statement with initializer is only available in C++17 and
    later versions. If you’re working with an older compiler, you may need to use
    alternative approaches to achieve similar behavior.


    # Using Switch with Initializer


    Here’s an example program that demonstrates the use of a switch statement with
    an initializer in C++:


    #include <iostream>


    int main() {


        int choice = 2;


        switch (int i = choice; i) {


            case 1:


                std::cout << "You chose option 1." << std::endl;


                break;


            case 2:


                std::cout << "You chose option 2." << std::endl;


                break;


            case 3:


                std::cout << "You chose option 3." << std::endl;


                break;


            default:


                std::cout << "Invalid option." << std::endl;


                break;


        }


        return 0;


    }


    In this code, we use the initializer feature of the switch statement in C++17\.
    The variable i is declared and initialized with the value of choice inside the
    switch statement itself.


    Now, let’s discuss the benefits of this feature:


    1.  Reduced code duplication: Prior to C++17, if you wanted to introduce a new
    variable inside the switch statement, you had to use curly braces to create a
    new scope. With the initializer feature, you can declare and initialize a variable
    directly within the switch statement without the need for additional braces. This
    helps reduce code duplication and improves code readability.


    2.  Tighter scope: By declaring the variable directly within the switch statement,
    you limit its scope to the switch block. This helps prevent unintended use of
    the variable outside the switch statement, reducing the chances of bugs caused
    by variable scope-related issues.'
