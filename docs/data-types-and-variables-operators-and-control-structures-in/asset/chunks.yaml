        }


        if (obj1 > obj2) {


            std::cout << "obj1 is greater than obj2\n";


        }


        if (obj1 <= obj2) {


            std::cout << "obj1 is less than or equal to obj2\n";


        }


        if (obj1 >= obj2) {


            std::cout << "obj1 is greater than or equal to obj2\n";


        }


        if (obj1 == obj2) {


            std::cout << "obj1 is equal to obj2\n";


        }


        if (obj1 != obj2) {


            std::cout << "obj1 is not equal to obj2\n";


        }


        return 0;


    }


