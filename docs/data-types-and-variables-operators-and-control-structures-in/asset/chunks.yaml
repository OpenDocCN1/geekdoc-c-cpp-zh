    \ outer loop\n            }\n            std::cout << \"Nested loop iteration:\
    \ \" << j << std::endl;\n        }\n    }\n    return 0;\n}\n```\n\nIn this program,\
    \ we have an outer loop controlled by the variable `i` and a nested loop controlled\
    \ by the variable `j`. We want to skip to the next iteration of the outer loop\
