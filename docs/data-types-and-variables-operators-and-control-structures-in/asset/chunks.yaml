- fmt: "\n* Ellipsis (`...`) is used to denote a variable number of arguments in function\
    \ parameters. \n* Used for variadic functions.\n\n## Using the Scope Resolution\
    \ Operator\n\n* The `::` operator is used to define a function.\n* The `::` operator\
    \ is used to define a function outside a class, to access a global variable in\
    \ the presence of a local variable with the same name, or to access a class’s\
    \ static variable.\n\n## Working with New and Delete Operators\n\n* `new` operator\
    \ is used for dynamic memory allocation, which allocates memory during program\
    \ runtime.\n* `delete` operator is used to free memory allocated with `new`.\n\
    * Syntax:\n```cpp\nint* ptr = new int; // Allocate memory for an int\ndelete ptr;\
    \ // Free the allocated memory\n```\n* For arrays, use `new[]` and `delete[]`.\n\
    ```cpp\nint* arr = new int[10]; // Allocate memory for an array of 10 ints\ndelete[]\
    \ arr; // Free the allocated memory\n```\n\n## If Statement\n\n* Used to make\
    \ decisions based on certain conditions.\n* Syntax: `if (condition) {statements}`\n\
    \n## Else Statement\n\n* Accompanies an `if` statement and executes when the `if`\
    \ condition is false.\n* Syntax:\n```cpp\nif (condition) {statements}\nelse {statements}\n\
    ```\n\n## Else if Statement\n\n* Checks additional conditions if the initial `if`\
    \ condition is false.\n* Syntax:\n```cpp\nif (condition1) {statements}\nelse if\
    \ (condition2) {statements}\nelse {statements}\n```\n\n## Nested if Statement\n\
    \n* `if` statement inside another `if` or `else if` statement.\n* Useful when\
    \ multiple levels of conditions need to be checked.\n\n## Switch Statement\n\n\
    * Used to select one of many code blocks to be executed.\n* Syntax:\n```cpp\n\
    switch (expression) {\ncase constant1:\n    // code\n    break;\ncase constant2:\n\
    \    // code\n    break;\n// ...\ndefault:\n    // code\n}\n```\n\n## Nested Switch\
    \ Statement\n\n* A `switch` statement inside another `switch` statement or inside\
    \ a `case` block.\n\n## For Loop\n\n* For repeating a block of code a specific\
    \ number of times.\n* Syntax: `for (initialization; condition; increment/decrement)\
    \ {statements}`\n\n## While Loop\n\n* Repeats a block of code as long as a condition\
    \ is true.\n* Syntax: `while (condition) {statements}`\n\n## Do-While Loop\n\n\
    * Similar to `while`, but the condition is checked after the execution of the\
    \ statements.\n* Syntax:\n```cpp\ndo {statements}\nwhile (condition);\n```\n\n\
    ## Nested Loops\n\n* A loop inside another loop. The inner loop executes its entire\
    \ iterations for every single iteration of the outer loop.\n\n## Range-Based For\
    \ Loop\n\n* Used to iterate over elements in a range (like arrays, containers).\n\
    * Syntax: `for (declaration : range) {statements}`\n\n## Loop Control with Break\n\
    \n* `break` statement is used to stop the loop prematurely.\n* Exits the current\
    \ loop and transfers execution to the statement immediately following the loop.\n\
    \n## Loop Control with Continue\n\n* `continue` statement skips the remaining\
    \ part of the loop and moves the control back to the start of the loop for next\
    \ iteration.\n\n## Going to Labels with Goto\n\n* `goto` statement transfers control\
    \ to the labelled statement.\n* It’s generally discouraged due to reducing readability\
    \ and maintainability.\n\n## Using the Conditional (Ternary) Operator\n\n* A shorthand\
    \ way of writing an `if-else` statement.\n* Syntax: `condition ? expression_if_true\
    \ : expression_if_false;`\n\n## Switch Case with Enumerations\n\n* Enumeration\
    \ values can be used in switch cases for clearer and less error-prone code.\n\n\
    ## Handling Errors with Try/Catch\n\n* `try` block encloses code that might throw\
    \ an exception.\n* `catch` block catches exceptions and handles them.\n* Syntax:\n\
    ```cpp\ntry {\n    // code\n}\ncatch (exception_type e) {\n    // handle exception\n\
    }\n```\n\n## Multiple Catch Blocks\n\n* More than one `catch` block can be used\
    \ to handle different types of exceptions separately.\n\n## Throwing Exceptions\n\
    \n* `throw` keyword is used to throw exceptions.\n* Syntax: `throw exception;`\n\
    \n## Custom Exceptions\n\n* User-defined exception classes can be created, usually\
    \ derived from the `std::exception` class.\n\n## The Finally Block\n\n* In other\
    \ languages like Java, `finally` is a block that is always executed after a `try-catch`\
    \ block, whether an exception occurred or not. C++ does not support `finally`.\n\
    \n## Early Function Return\n\n* `return` statement can be used to end function\
    \ execution and return control to the caller before reaching the end of the function.\n\
    \n## Exiting a Program with Exit\n\n* `exit()` function from `cstdlib` can be\
    \ used to terminate program execution.\n\n## For Loop with Multiple Variables\n\
    \n* You can use multiple loop variables in a `for` loop.\n* Syntax: `for (int\
    \ a=0, b=0; a<n && b<m; ++a, ++b)`\n\n## The Assert Macro\n\n* `assert` macro\
    \ is used for debugging purposes.\n* If its argument expression is false, it writes\
    \ an error message and aborts the program.\n\n## Static If (If Constexpr)\n\n\
    * `if constexpr` is a C++17 feature that performs a compile-time check.\n* It’s\
    \ useful in template programming for discarding branches that can’t be instantiated.\n\
    \n## Handling Signals\n\n* Signals are software interrupts delivered to a process.\n\
    * C++ can handle signals using the `signal()` function from the `csignal` library.\n\
    \n## Non-local Jumps with Setjmp and Longjmp\n\n* `setjmp()` and `longjmp()` are\
    \ used to perform non-local jumps.\n* Using `setjmp` can make code harder to understand.\n\
    \n## The Noreturn Keyword\n\n* `[[noreturn]]` is a C++11 attribute that indicates\
    \ a function does not return.\n* Useful for functions where control is not expected\
    \ to return back.\n\n## Loop Control with Goto\n\n* Using `goto` in loops can\
    \ allow for complex control flow, but it’s generally discouraged.\n\n## Try/Catch\
    \ Inside a Loop\n\n* You can use `try-catch` block inside a loop to handle exceptions\
    \ for each iteration.\n\n## Re-throwing Exceptions\n\n* In a `catch` block, `throw`\
    \ statement without an argument rethrows the handled exception.\n\n## Catching\
    \ All Exceptions\n\n* A `catch(...)` block can be used to catch all types of exceptions.\n\
    \n## Nested Try/Catch Blocks\n\n* `try-catch` blocks can be nested. An inner `catch`\
    \ block catches the exception, and if it cannot handle it, the exception is passed\
    \ to the next outer `catch` block.\n\n## The Uncaught_Exception Function\n\n*\
    \ `std::uncaught_exception()` is a pre-C17 function that checks if an exception\
    \ is uncaught.\n* In C++17 and later, use `std::uncaught_exceptions()` instead.\n\
    \n## Avoiding Exceptions with the Noexcept Keyword\n\n* `noexcept` keyword specifies\
    \ that a function does not throw exceptions.\n* Useful in performance-critical\
    \ code and for certain types of resource management.\n\n## Exceptions in Constructors\
    \ and Destructors\n\n* If a constructor throws an exception, the object’s initialization\
    \ is not completed.\n* If a destructor throws an exception, and it’s not caught,\
    \ the program will terminate. Destructors should generally avoid throwing exceptions.\n\
    \n## Exception Specifications\n\n* Before C++11, exception specifications `throw(type)`\
    \ could be used to indicate which exceptions a function might throw, but they’ve\
    \ been deprecated.\n\n## Using Enum Classes in Switch Statements\n\n* Strongly\
    \ typed enums (`enum class`) can be used in switch cases, which can improve type-safety\
    \ and code clarity.\n\n## Using If with Initializer\n\n* As of C++17, if-statements\
    \ can include an initializer.\n* Syntax: `if (init; condition) {statements}`\n\
    \n## Using Switch with Initializer\n\n* As of C++17, switch-statements can also\
    \ include an initializer.\n* Syntax: `switch (init; condition) {cases}`\n\n##\
    \ Variadic Templates\n\n* Variadic templates are templates that can take a variable\
    \ number of arguments in a type-safe way.\n\n## The Comma Operator in Loops\n\n\
    * The comma operator allows multiple statements to be placed in the initialization\
    \ and iteration parts of a loop.\n"
