    \ << endl;\n    return 0;\n}\n``` 在在此程序中，用户会被提示输入两个数字（`num1` 和 `num2`）。程序随后使用各种关系运算符来比较这些变量的值。\n\
    \n程序中使用的关系运算符有：\n\n*   `<` (小于)：如果 `num1` 小于 `num2`，返回 `true`，否则返回 `false`。\n\
    *   `>` (大于)：如果 `num1` 大于 `num2`，返回 `true`，否则返回 `false`。\n*   `<=` (小于等于)：如果 `num1`\
    \ 小于等于 `num2`，返回 `true`，否则返回 `false`。\n*   `>=` (大于等于)：如果 `num1` 大于等于 `num2`，返回\
    \ `true`，否则返回 `false`。\n*   `==` (等于)：如果 `num1` 等于 `num2`，返回 `true`，否则返回 `false`。\n\
    *   `!=` (不等于)：如果 `num1` 不等于 `num2`，返回 `true`，否则返回 `false`。\n\n程序的输出将使用关系运算符显示这些比较的结果。\n\
    \n注意：关系运算符（`<`, `>`, `<=`, `==` 和 `!=`）根据比较结果返回布尔值（`true` 或 `false`）。在上面的程序中，该布尔值随后通过\
    \ `cout` 打印到控制台。\n\n# 移位运算符\n\n这是一个 C++ 示例程序，演示了移位运算符的使用，并解释了如何使用它们来实现对 2 的幂的高效乘法和除法：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    int num = 10;\n    // Left\
    \ shift operator for multiplication\n    int result = num << 2;\n    std::cout\
    \ << \"Result of left shift (multiplication): \" << result << std::endl;\n\n \
    \   // Right shift operator for division\n    int quotient = num >> 2;\n    std::cout\
    \ << \"Result of right shift (division): \" << quotient << std::endl;\n\n    return\
    \ 0;\n}\n``` 在此程序中，我们有一个初始化为值 `10` 的变量 `num`。我们将使用移位运算符来演示对 2 的幂的乘法和除法。\n\n左移运算符（`<<`）执行二进制左移，实际上是将数字乘以\
    \ 2 的右侧操作数的幂次方。在示例中，`num << 2` 将 `num` 的二进制表示向左移动两位，结果为 `40`（`10 * 2²`）。\n\n右移运算符（`>>`）执行二进制右移，实际上是将数字除以\
    \ 2 的右侧操作数的幂次方。在示例中，`num >> 2` 将 `num` 的二进制表示向右移动两位，结果为 `2`（`10 / 2²`）。\n\n使用移位运算符进行对\
    \ 2 的幂的乘法和除法是高效的，因为可以作为位操作来实现，这通常比传统的乘法和除法操作快。它之所以有效是因为将数字的二进制表示向左移动相当于乘以 2，而向右移动相当于除以\
    \ 2。\n\n# 三元运算符\n\n这是一个 C++ 程序示例，使用三元运算符根据条件在两个值之间进行选择：\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    int number;\n    std::cout << \"Enter a number: \";\n    std::cin\
    \ >> number;\n    // Using ternary operator\n    std::string result = (number\
    \ % 2 == 0) ? \"even\" : \"odd\";\n    std::cout << \"The number is \" << result\
    \ << std::endl;\n    return 0;\n}\n``` 在此程序中，用户会被提示输入一个数字。三元运算符 `(number % 2 ==\
    \ 0) ? \"even\" : \"odd\"` 用于判断该数字是偶数还是奇数。如果条件 `(number % 2 == 0)` 为真，则结果为 \"\
    even\"，否则为 \"odd\"。\n\n# 类型转换运算符\n\n这是一个 C++ 示例程序，演示了如何通过隐式和显式转换使用移位运算符：\n\n```cpp\n\
    #include <iostream>\n\nclass Distance {\nprivate:\n    int feet;\n    float inches;\n\
    \npublic:\n    // Constructor\n    Distance(int ft = 0, float in = 0) : feet(ft),\
    \ inches(in) {}\n\n    // Conversion operator for float\n    operator float()\
    \ const {\n        float total = feet + inches / 12.0;\n        return total;\n\
    \    }\n};\n\nint main() {\n    Distance d(5, 10.5);\n\n    // Implicit conversion\n\
    \    float totalDistance = d;\n    std::cout << \"Total distance: \" << totalDistance\
    \ << \" feet\" << std::endl;\n\n    // Explicit conversion\n    int intDistance\
    \ = static_cast<int>(totalDistance);\n    std::cout << \"Integer distance: \"\
    \ << intDistance << \" feet\" << std::endl;\n\n    return 0;\n}\n``` 在此示例中，我们有一个表示英尺和英寸距离的\
    \ `Distance` 类。类定义了一个转换运算符 `operator float()`，可以将 `Distance` 对象转换为浮点数。这允许我们隐式地将\
    \ `Distance` 对象转换为浮点数。\n\n在 `main()` 函数中，我们创建了一个值为 5 英尺 10.5 英寸的 `Distance` 对象\
    \ `d`。随后我们将 `Distance` 对象赋值给浮点数变量 `totalDistance`。由于 `Distance` 类中定义的转换运算符，此赋值触发了隐式类型转换。`totalDistance`\
    \ 变量将保存以尺为单位的总距离。\n\n接下来，我们使用 `static_cast` 运算符演示显式转换。我们将浮点值 `totalDistance` 转换为整数值\
    \ `intDistance`，使用 `static_cast<int>(totalDistance)`。这种显式转换允许我们截断小数部分并获得以尺为单位的整数距离。最后，我们在控制台打印总距离和整数距离。\n\
    \n隐式类型转换在编译器检测到兼容类型时自动完成。在这种情况下，`Distance` 对象通过转换运算符隐式转换为浮点数。\n\n显式类型转换（也称为强制类型转换）通过类型转换运算符（如\
    \ `static_cast`）手动执行。它允许程序员指定类型之间的特定转换，这可能导致精度丢失或表示形式的变化。\n\n"
- fmt: "\nUnary operators are operators that work with only one operand. In C++, there\
    \ are several unary operators available:\n\n1. Increment (`++`): The increment\
    \ operator increments the value of its operand by one.\n2. Decrement (`–`): The\
    \ decrement operator decreases the value of its operand by one.\n3. Plus (`+`):\
    \ The unary plus operator represents the identity operation, indicating no change\
    \ in the operand’s value.\n4. Minus (`-`): The unary minus operator negates the\
    \ value of its operand, changing a positive value to negative and vice versa.\n\
    5. Logical NOT (`!`): The logical NOT operator reverses the logical state of its\
    \ operand. If the operand is `true`, it returns `false`, and if the operand is\
    \ `false`, it returns `true`.\n6. Bitwise NOT (`~`): The bitwise NOT operator\
    \ performs a bitwise negation on its operand, flipping each bit from 0 to 1 and\
    \ vice versa.\n7. Address (`&`): The address-of operator returns the memory address\
    \ of its operand.\n\nHere’s an example program demonstrating the use of unary\
    \ operators:\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\
