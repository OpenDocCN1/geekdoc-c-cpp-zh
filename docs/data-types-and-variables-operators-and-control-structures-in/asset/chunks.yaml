    # Array Declaration and Initialization


    Here’s an example program in C++ that demonstrates the declaration and initialization
    of an array:


    #include <iostream>


    int main() {


        // Declare and initialize an array of integers


        int numbers[5] = {1, 2, 3, 4, 5};


        // Print the array elements


        for (int i = 0; i < 5; ++i) {


            std::cout << numbers[i] << " ";


        }


        std::cout << std::endl;


        return 0;


    }


    In this program, we declare an array named numbers of size 5, which means it can
    store 5 integers. We initialize the array with the values {1, 2, 3, 4, 5} using
    the curly braces initializer list. Each value is separated by a comma.


    Arrays in C++ are derived data types. They are derived from the fundamental data
    types and can be thought of as a collection of elements of the same data type.
    In the example program, we declared an array of integers (int), but arrays can
    also be declared for other data types like char, float, or even user-defined types.


    The array declaration consists of two parts: the data type of the elements and
    the name of the array. In the example, the data type is int, and the array is
    named numbers. The size of the array is specified inside square brackets [5],
    indicating that the array can hold 5 integers.


    Arrays are zero-indexed, which means the first element of the array has an index
    of 0, the second element has an index of 1, and so on. In the program, we use
    a for loop to iterate over the array elements and print them using std::cout.


    It’s important to note that when initializing an array, the number of elements
    in the initializer list must match the size of the array. If the initializer list
    has fewer elements, the remaining elements are automatically initialized to zero
    for numeric types (int, float, etc.) or to the null character (’\0’) for character
    arrays (char).


    # Multidimensional Arrays


    In C++, a multidimensional array is an array that has more than one dimension.
    It is essentially a table-like structure with rows and columns, or in general,
    a collection of elements organized in multiple dimensions.


    To declare a multidimensional array in C++, you need to specify the number of
    dimensions and the size of each dimension. Here’s the general syntax:


    type arrayName[size1][size2]...[sizeN];


    Here, type represents the data type of the elements in the array, arrayName is
    the name of the array, and size1, size2, …, sizeN represent the sizes of each
    dimension. You can have any number of dimensions as needed.


    To access elements in a multidimensional array, you use the indices corresponding
    to each dimension. The indices start from 0 and go up to the size of each dimension
    minus 1\. Here’s an example:


    #include <iostream>


    int main() {


      int arr[3][4];  // Declaring a 2D array with 3 rows and 4 columns


      // Assigning values to the elements of the array


      arr[0][0] = 1;


      arr[0][1] = 2;


      arr[0][2] = 3;


      // ... and so on


      // Accessing and printing the elements of the array


      for (int i = 0; i < 3; i++) {


        for (int j = 0; j < 4; j++) {


          std::cout << arr[i][j] << " ";


        }


        std::cout << std::endl;


      }


      return 0;


    }


    In this example, we have declared a 2D array named arr with 3 rows and 4 columns.
    We then assign values to the elements using the indices arr[rowIndex][columnIndex].
    Finally, we use nested loops to access and print the elements of the array.


    You can extend this concept to higher-dimensional arrays by adding more dimensions
    and accessing elements using the appropriate number of indices.


    # Array of Characters


    Here’s an example program in C++ that uses an array of characters to store and
    print a string:


    #include <iostream>


    int main() {


        // Declare and initialize an array of characters


        char str[] = "Hello, world!";


        // Print the string


        std::cout << str << std::endl;


        return 0;


    }


    In this program, we declare an array of characters str and initialize it with
    the string “Hello, world!”. The array automatically allocates enough memory to
    store the characters of the string. The size of the array is determined by the
    length of the string plus one extra character for the null terminator (’\0’),
    which marks the end of the string.


    The std::cout << str statement prints the contents of the array as a string.


    Now, let’s discuss the difference between a string and an array of characters.


    In C++, a string is a high-level abstraction provided by the Standard Library
    (std::string), which represents a sequence of characters. It provides various
    member functions and overloads operators to perform string operations conveniently.
    Strings can dynamically resize themselves, making them more flexible than arrays
    of characters.


    On the other hand, an array of characters is a low-level construct, often represented
    as a null-terminated sequence of characters (char[] or char*). It is a fixed-size
    collection of characters that can be used to store and manipulate strings. Arrays
    of characters require manual memory management and lack the built-in string manipulation
    capabilities provided by the std::string class.'
