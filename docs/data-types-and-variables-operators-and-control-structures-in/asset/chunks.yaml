    \ to print the current time and date:\n\n```cpp\n#include <iostream>\n#include\
    \ <ctime>\n\nint main() {\n    // Get the current time\n    time_t currentTime\
    \ = time(nullptr);\n\n    // Convert the time to a string representation\n   \
    \ char* formattedTime = ctime(&currentTime);\n\n    // Print the time and date\n\
    \    std::cout << \"Current time: \" << formattedTime;\n\n    return 0;\n}\n```\n\
    \nIn this program, we first declare a `time_t` variable called `currentTime` and\
    \ assign it the current time using the `time()` function with `nullptr` as the\
    \ argument. This function returns the current time as a `time_t` value.\n\nNext,\
    \ we use the `ctime()` function to convert the `time_t` value to a string representation.\
    \ The `ctime()` function takes a `time_t` pointer as an argument and returns a\
