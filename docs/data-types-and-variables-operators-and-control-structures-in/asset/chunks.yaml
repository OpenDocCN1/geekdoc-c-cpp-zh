    # Operator Overloading Basics


    Operator overloading is a feature in C++ that allows you to redefine the behavior
    of operators when applied to objects of a user-defined class. It enables you to
    use the familiar syntax of operators like +, -, *, /, etc., with custom objects,
    making your code more intuitive and expressive.


    To illustrate the concept of operator overloading, let’s create a simple class
    called Complex that represents complex numbers. We will overload the addition
    operator (+) to add two Complex objects.


    #include <iostream>


    class Complex {


    private:


        double real;


        double imag;


    public:


        Complex(double r = 0.0, double i = 0.0) : real(r), imag(i) {}


        Complex operator+(const Complex& other) {


            Complex result;


            result.real = real + other.real;


            result.imag = imag + other.imag;


            return result;


        }


        void display() {


            std::cout << real << " + " << imag << "i" << std::endl;


        }


    };


    int main() {


        Complex c1(2.0, 3.0);


        Complex c2(4.0, 5.0);


        Complex c3;


        c3 = c1 + c2;


        c3.display();


        return 0;


    }


    In the above code, we define a class Complex with two private data members real
    and imag, representing the real and imaginary parts of a complex number. The constructor
    initializes these members with default values of 0.0.


    We then overload the addition operator using the member function operator+. This
    function takes a constant reference to another Complex object (other) and returns
    a new Complex object (result) that represents the sum of the two complex numbers.
    The sum is computed by adding the corresponding real and imaginary parts of the
    two objects.


    The display member function is provided to print the complex number in the format
    “real + imagi”.


    In the main function, we create three Complex objects: c1, c2, and c3\. We assign
    the sum of c1 and c2 to c3 using the overloaded + operator. Finally, we display
    the result.


    The rules for operator overloading in C++ are as follows:


    1.  Operator overloading is done by defining a member function or a non-member
    function (friend function) with the keyword operator followed by the operator
    symbol to be overloaded.


    2.  The operator function must be a non-static member function of the class or
    a non-member function defined outside the class (in which case, it needs to be
    declared as a friend function in the class).


    3.  For binary operators such as +, -, *, /, etc., the left operand is passed
    implicitly as the calling object, and the right operand is passed explicitly as
    a parameter to the operator function.


    4.  Unary operators, such as ++, –, etc., only take the calling object as an implicit
    parameter.


    5.  Overloaded operators can be used with other objects of the same class or with
    built-in types.


    6.  The return type of the overloaded operator function depends on the operator
    being overloaded and the desired behavior.


    7.  Some operators, like assignment (=) and function call (()), have specific
    rules for overloading. They require specific return types and signatures.


    It’s important to use operator overloading judiciously and follow common programming
    conventions to ensure clarity and maintainability of the code.


    # Operator Precedence and Associativity


    Here’s a C++ program that demonstrates the precedence and associativity of operators:


    #include <iostream>


    int main() {


        int a = 10, b = 5, c = 2;


        int result1 = a + b * c;  // Multiplication (*) has higher precedence than
    addition (+)


        int result2 = (a + b) * c;  // Parentheses () can be used to override the
    default precedence


        std::cout << "Expression 1: " << a << " + " << b << " * " << c << " = " <<
    result1 << std::endl;


        std::cout << "Expression 2: (" << a << " + " << b << ") * " << c << " = "
    << result2 << std::endl;


        return 0;


    }


    In the program above, we have three variables a, b, and c. We use these variables
    to create two different expressions:


    1.  result1 = a + b * c: This expression demonstrates that the multiplication
    operator * has higher precedence than the addition operator +. So, b * c is evaluated
    first, and then the result is added to a.


    2.  result2 = (a + b) * c: This expression uses parentheses ( ) to override the
    default precedence. Here, a + b is evaluated first due to the parentheses, and
    then the result is multiplied by c.


    When we run this program, the output will be:


    Expression 1: 10 + 5 * 2 = 20


    Expression 2: (10 + 5) * 2 = 30


    The precedence and associativity rules control the order of operations in an expression.
    The precedence determines which operators take precedence over others when evaluating
    an expression. Operators with higher precedence are evaluated first. In the example
    above, the multiplication operator * has higher precedence than the addition operator
    +, so b * c is evaluated before adding it to a.


    The associativity, on the other hand, determines the order in which operators
    with the same precedence are evaluated. In C++, most operators have left-to-right
    associativity, meaning they are evaluated from left to right when they have the
    same precedence. For example, in the expression a + b + c, the + operators have
    the same precedence, and they are evaluated from left to right.


    However, parentheses can be used to override the default precedence and associativity
    rules. By using parentheses, we can control the order of evaluation and ensure
    that certain operations are performed before others.


    Understanding precedence and associativity is crucial for writing correct expressions
    and getting the desired results in programming. It helps to clarify the order
    of operations and prevent ambiguity in complex expressions.


    # Overloading Arithmetic Operators


    In C++, you can overload arithmetic operators for a custom class to provide custom
    behavior for mathematical operations involving objects of that class. To do this,
    you need to define member functions or friend functions for the desired arithmetic
    operators.


    Here’s an example of how you can overload the arithmetic operators for a custom
    class called MyClass:


    class MyClass {


    private:


        int value;


    public:


        MyClass(int val) : value(val) {}


        int getValue() const {


            return value;


        }


        // Overloading the addition operator ''+''


        MyClass operator+(const MyClass& other) const {


            int result = value + other.value;


            return MyClass(result);


        }


        // Overloading the subtraction operator ''-''


        MyClass operator-(const MyClass& other) const {


            int result = value - other.value;


            return MyClass(result);


        }


        // Overloading the multiplication operator ''*''


        MyClass operator*(const MyClass& other) const {


            int result = value * other.value;


            return MyClass(result);


        }


        // Overloading the division operator ''/''


        MyClass operator/(const MyClass& other) const {


            int result = value / other.value;


            return MyClass(result);


        }


    };


    In this example, the MyClass class has a single private member variable value
    of type int. The class provides a constructor to initialize value and a getter
    function getValue().


    The class then defines overloaded operators for addition (+), subtraction (-),
    multiplication (*), and division (/). Each operator function takes a reference
    to another MyClass object as a parameter and returns a new MyClass object as the
    result of the operation.


    You can now use these overloaded operators to perform arithmetic operations on
    MyClass objects. For example:


    int main() {


        MyClass obj1(5);


        MyClass obj2(3);


        MyClass sum = obj1 + obj2;


        MyClass difference = obj1 - obj2;


        MyClass product = obj1 * obj2;


        MyClass quotient = obj1 / obj2;'
