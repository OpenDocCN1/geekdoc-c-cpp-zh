  trans: "\n\n*   省略号 (`...`) 用于在函数参数中表示数量不定的参数。\n*   用于变长函数。\n\n## 使用作用域解析运算符\n\n\
    *   `::` 运算符用于定义函数。\n*   `::` 运算符用于在类外定义函数、在存在同名局部变量时访问全局变量，或访问类的静态变量。\n\n## 使用\
    \ new 和 delete 运算符\n\n*   `new` 运算符用于动态内存分配，它在程序运行时分配内存。\n*   `delete` 运算符用于释放通过\
    \ `new` 分配的内存。\n*   语法：\n```cpp\nint* ptr = new int; // 为 int 分配内存\ndelete ptr;\
    \ // 释放分配的内存\n```\n*   对于数组，使用 `new[]` 和 `delete[]`。\n```cpp\nint* arr = new int[10];\
    \ // 为包含 10 个 int 的数组分配内存\ndelete[] arr; // 释放分配的内存\n```\n\n## If 语句\n\n*   用于根据某些条件做出决策。\n\
