- fmt: "\nUnderstanding and leveraging control structures in C++ is fundamental to\
    \ creating effective programs. Whether you’re just starting on your programming\
    \ journey or you’re an experienced coder looking to brush up on your skills, gaining\
    \ proficiency with control structures will significantly enhance your coding capabilities.\
    \ In fact, the better you understand control structures, the more complex and\
    \ flexible your programs can become.\n\n# If Statement\n\nHere’s an example program\
    \ in C++ that demonstrates the use of an if statement:\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    int number;\n    std::cout << \"Enter a number: \";\n    std::cin\
    \ >> number;\n    if (number > 0) {\n        std::cout << \"The number is positive.\"\
    \ << std::endl;\n    }\n    std::cout << \"End of program.\" << std::endl;\n \
    \   return 0;\n}\n```\n\nIn this program, we prompt the user to enter a number\
    \ and store it in the `number` variable. The `if` statement is used to perform\
    \ a conditional check on the value of `number`. If the value is greater than 0,\
    \ the statement inside the `if` block will be executed. In this case, it will\
    \ print “The number is positive.”\n\nIf the condition inside the `if` statement\
    \ is true, the code block following the `if` statement will be executed. Otherwise,\
    \ if the condition is false, the code block will be skipped, and the program will\
    \ continue with the next statement after the `if` block.\n\nThe `if` statement\
    \ allows us to control the flow of the program based on certain conditions. It\
    \ helps us make decisions and execute specific blocks of code only when certain\
    \ conditions are met. By using `if` statements, we can create programs that exhibit\
    \ different behaviors based on the values of variables or the result of expressions.\n\
    \n# Else Statement\n\nHere’s an example program in C++ that demonstrates the use\
    \ of an else statement in combination with an if statement:\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n    int number;\n    std::cout << \"Enter a number:\
    \ \";\n    std::cin >> number;\n    if (number > 0) {\n        std::cout << \"\
    The number is positive.\" << std::endl;\n    } else {\n        std::cout << \"\
    The number is zero or negative.\" << std::endl;\n    }\n    return 0;\n}\n```\n\
    \nIn this program, the user is prompted to enter a number. The program then checks\
    \ if the entered number is greater than zero using the `if` statement. If the\
    \ condition evaluates to true, it prints “The number is positive.” Otherwise,\
    \ if the condition evaluates to false, it executes the code within the `else`\
    \ block and prints “The number is zero or negative.”\n\nThe `else` statement is\
    \ used in combination with the `if` statement to specify an alternative set of\
    \ statements to execute when the condition in the `if` statement is false. It\
    \ provides a way to handle the “else” case when the condition is not met. The\
    \ `else` block is optional and can be omitted if there is no action needed when\
    \ the condition is false.\n\nBy using an `else` statement, you can create branching\
    \ logic in your program. If the condition in the `if` statement is satisfied,\
    \ the code within the `if` block is executed. Otherwise, the code within the `else`\
    \ block is executed. This allows you to perform different actions based on the\
    \ outcome of a condition.\n\n# Else if Statement\n\nHere’s an example of a C++\
    \ program that uses an else if statement:\n\n```cpp\n#include <iostream>\n\nint\
    \ main() {\n    int num;\n    std::cout << \"Enter a number: \";\n    std::cin\
    \ >> num;\n    if (num > 0) {\n        std::cout << \"Number is positive.\" <<\
    \ std::endl;\n    } else if (num < 0) {\n        std::cout << \"Number is negative.\"\
    \ << std::endl;\n    } else {\n        std::cout << \"Number is zero.\" << std::endl;\n\
    \    }\n    return 0;\n}\n```\n\nIn this program, the user is asked to enter a\
    \ number. The program then checks the value of the `number` using an `if-else\
    \ if-else` structure.\n\nHere’s how the `else if` statement works:\n\n- The `if`\
    \ statement is the first condition to be checked. If the condition inside the\
    \ `if` statement is true (i.e., the number is greater than zero), the code block\
    \ within the `if` statement will be executed, and the program will print “Number\
    \ is positive.”\n- If the condition in the `if` statement is false, the program\
    \ moves on to the next condition, which is the `else if` statement. If the condition\
    \ inside the `else if` statement is true (i.e., the number is less than zero),\
    \ the code block within the `else if` statement will be executed, and the program\
    \ will print “Number is negative.”\n- If both conditions are false, the program\
    \ executes the `else` block.\n\nBy using `else if` statement, you can create multiple\
    \ conditions that are checked sequentially. This is useful when you have multiple\
    \ conditions.\n\n# Nested if Statement\n\nHere’s an example program in C++ that\
    \ demonstrates the use of nested statements:\n\n```cpp\n#include <iostream>\n\n\
    int main() {\n    int x = 5;\n    int y = 10;\n    if (x > y) {\n        std::cout\
    \ << \"greater than y.\" << std::endl;\n    } else {\n        if (x < y) {\n \
    \           std::cout << \"less than y.\" << std::endl;\n        } else {\n  \
    \          std::cout << \"equal to y.\" << std::endl;\n        }\n    }\n    return\
    \ 0;\n}\n```\n\nIn this program, we have a nested `if` statement. If the first\
    \ condition is true, the program prints “greater than y.” If it’s false, it enters\
    \ the `else` block and checks `x < y`. If this condition is true, it prints “less\
    \ than y.” Finally, if both are false, it executes “equal to y.”\n\n### Implications\
    \ and potential pitfalls of nested conditionals\n\n1. **Complexity**: Nested `if`\
    \ statements can make code more complex and harder to read and understand.\n2.\
    \ **Code duplication**: Nesting `if` can result in code duplication if the same\
    \ conditions need to be checked at multiple levels.\n3. **Performance impact**:\
    \ Nested `if` statements may have a performance impact if the conditions are computationally\
    \ expensive.\n4. **Logical errors**: Mistakes in writing nested conditions can\
    \ lead to errors.\n5. **Alternative design patterns**: In some cases, nested `if`\
    \ statements can be replaced with alternative patterns like switch statements.\n\
    \nTo mitigate the pitfalls of nested conditionals, it’s important to follow good\
    \ programming practices such as writing clean code, using meaningful names, and\
    \ considering alternative control structures when appropriate.\n\n# Switch Statement\n\
    \nHere’s an example program in C++ that demonstrates the use of a switch statement:\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    int choice;\n    std::cout\
    \ << \"Enter a number between 1 and 3: \";\n    std::cin >> choice;\n    switch\
    \ (choice) {\n        case 1:\n            std::cout << \"You selected option\
    \ 1.\" << std::endl;\n            break;\n        case 2:\n            std::cout\
    \ << \"You selected option 2.\" << std::endl;\n            break;\n        case\
    \ 3:\n            std::cout << \"You selected option 3.\" << std::endl;\n    \
    \        break;\n        default:\n            std::cout << \"Invalid choice.\"\
    \ << std::endl;\n            break;\n    }\n    return 0;\n}\n```\n"
