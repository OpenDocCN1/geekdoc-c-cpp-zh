    zero:


        std::cout << "The number is zero." << std::endl;


        goto end;


    end:


        std::cout << "Program ends." << std::endl;


        return 0;


    }


    In this program, the goto statement is used to jump to specific labels (positive,
    negative, zero, and end) based on the value entered by the user.


    However, the use of goto is generally discouraged in modern programming practices.
    Here’s why:


    1.  Complexity and Readability: The use of goto statements can lead to code that
    is difficult to understand and reason about. It makes the control flow of the
    program less explicit, making it harder to follow and maintain. As programs grow
    in size and complexity, the use of goto can result in spaghetti code that is hard
    to debug and modify.


    2.  Structured Programming: The use of goto can violate the principles of structured
    programming, which promotes code organization and control flow through structured
    constructs like loops and conditional statements. By relying on goto, the program
