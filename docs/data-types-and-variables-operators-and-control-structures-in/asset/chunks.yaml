    \n函数对象（Functor objects）通常用于需要将类函数的行为作为数据存储的场景中。它们可以被作为参数传递给其他函数、存储在容器中，或者在期望调用对象的算法中用谓词。与普通函数指针相比，使用函数对象的优势在于它们可以存储状态信息并拥有内部成员。\n\
    \n重载函数调用运算符允许你创建灵活且强大的对象，这些对象可以像函数一样被调用，为表示复杂行为提供了一种简洁且表现力的方式。\n\n# 重载不等运算符\n\n\
