    Lambda 表达式在不需要单独定义为命名函数的小功能场景下特别有用。它们提供了联定义定义功能的简洁方式，提高了代码的可读性并减少了模板代码。\n\n请注意，lambda\
    \ 表达式是 C++11 及以后引入的特性，请确保你使用的是支持该特性的编译器。\n\n# 使用运算符\n\n这里有一个使用 C++ 新运算符关键字的示例程序：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    int age;\n    std::cout <<\
