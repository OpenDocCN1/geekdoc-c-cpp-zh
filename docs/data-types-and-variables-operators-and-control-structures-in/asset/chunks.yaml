    \n# 重载关系运算符\n\n在 C++ 中，你可以为自定义类重载关系运算符，以实现对用户定义类型的直观比较。重载这些运算符允许你以有意义的方式比较自定义类的对象。以下是一个为自定义类重载关系运算符的示例程序：\n\
