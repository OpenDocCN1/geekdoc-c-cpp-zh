    # Loop Control with Continue


    Here’s an example program in C++ that demonstrates the use of the continue statement
    to skip to the next iteration of a loop:


    #include <iostream>


    int main() {


        for (int i = 1; i <= 10; i++) {


            if (i % 3 == 0) {


                continue;  // Skip the rest of the loop body and move to the next
    iteration


            }


            std::cout << i << " ";


        }


        return 0;


    }


    In this program, we have a for loop that iterates from 1 to 10. Inside the loop,
    there’s an if condition that checks if the current value of i is divisible by
    3 using the modulo operator (%). If the condition is true, the continue statement
    is encountered.


    The continue statement causes the program to immediately jump to the next iteration
    of the loop, skipping any remaining statements within the loop body. In this case,
    when i is divisible by 3, the continue statement skips the std::cout statement,
    which prints the value of i. Consequently, the numbers divisible by 3 (3, 6, and
    9) are not printed.


    The output of this program will be:


    1 2 4 5 7 8 10


    The continue statement is useful in loop control when you want to skip certain
    iterations based on specific conditions. It allows you to control the flow of
    the loop and bypass certain code blocks when certain conditions are met.


    By using continue, you can improve the efficiency of your code by avoiding unnecessary
    computations or operations when specific conditions are satisfied. It helps in
    reducing the complexity of the code and can make it more readable and concise.


    It’s important to note that the continue statement only affects the current loop
    it is placed in. If you have nested loops, the continue statement will skip to
    the next iteration of the innermost loop it belongs to.


    # Going to Labels with Goto


    Here’s an example of a program in C++ that uses the goto statement:


    #include <iostream>


    using namespace std;


    int main() {


        int num;


        input:


        cout << "Enter a positive number: ";


        cin >> num;


        if (num <= 0) {


            cout << "Invalid number. Please try again." << endl;


            goto input;


        }


        cout << "The number you entered is: " << num << endl;


        return 0;


    }


    In this program, the goto statement is used to implement a simple input validation
    loop. If the user enters a non-positive number, the program displays an error
    message and jumps back to the input label, asking the user for input again.


    The goto statement allows for an unconditional jump to a labeled statement within
    the same function. However, using goto can have several implications and is generally
