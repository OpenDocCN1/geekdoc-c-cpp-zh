    1.  Bitwise AND (&): Performs a bitwise AND operation between two integers, resulting
    in a new integer where each bit is set if and only if the corresponding bits in
    both operands are set. This operation is often used to mask certain bits or extract
    specific information from a bit pattern.


    2.  Bitwise OR (|): Performs a bitwise OR operation between two integers, resulting
    in a new integer where each bit is set if either of the corresponding bits in
    the operands is set. It is commonly used to set specific bits or combine different
    bit patterns.


    3.  Bitwise XOR (^): Performs a bitwise exclusive OR operation between two integers,
    resulting in a new integer where each bit is set if and only if the corresponding
    bits in the operands differ. It can be used for flipping bits or performing conditional
    operations.


    4.  Bitwise NOT (~): Performs a bitwise complement operation on an integer, resulting
    in a new integer where each bit is flipped (i.e., 0s become 1s and vice versa).
    It is often used for inverting bits or creating bit masks.


    5.  Left shift (<<): Shifts the bits of an integer to the left by a specified
    number of positions. The shifted bits are filled with zeros. This operation effectively
    multiplies the integer by 2 raised to the power of the shift amount.


    6.  Right shift (>>): Shifts the bits of an integer to the right by a specified
    number of positions. The shifted bits can be filled with zeros or the sign bit
    (in case of signed integers). This operation effectively divides the integer by
    2 raised to the power of the shift amount.


    These bitwise operations are useful in various scenarios, such as:


    *   Manipulating individual bits or groups of bits within an integer representation.


    *   Building efficient data structures, such as bitsets or bit arrays.


    *   Optimizing code by performing bitwise operations instead of more costly arithmetic
    operations.


    *   Implementing low-level protocols or encoding schemes that rely on bitwise
    manipulation.


    It’s important to note that bitwise operations are highly dependent on the binary
    representation of integers and may exhibit different behavior for signed and unsigned
    types. Care should be taken to ensure the desired semantics and avoid potential
    pitfalls, such as signed integer overflow.


    # Understanding Type Sizes


    Here’s a C++ program that prints the size of each data type:


    #include <iostream>


    int main() {


        std::cout << "Size of char: " << sizeof(char) << " byte(s)" << std::endl;


        std::cout << "Size of short: " << sizeof(short) << " byte(s)" << std::endl;


        std::cout << "Size of int: " << sizeof(int) << " byte(s)" << std::endl;


        std::cout << "Size of long: " << sizeof(long) << " byte(s)" << std::endl;


        std::cout << "Size of long long: " << sizeof(long long) << " byte(s)" << std::endl;


        std::cout << "Size of float: " << sizeof(float) << " byte(s)" << std::endl;


        std::cout << "Size of double: " << sizeof(double) << " byte(s)" << std::endl;


        std::cout << "Size of long double: " << sizeof(long double) << " byte(s)"
    << std::endl;


        std::cout << "Size of bool: " << sizeof(bool) << " byte(s)" << std::endl;


        return 0;


    }


    When you run this program, it will display the size of each data type in bytes.
    The sizeof operator is used to determine the size of a data type in C++. The program
    will output something like:


    Size of char: 1 byte(s)


    Size of short: 2 byte(s)


    Size of int: 4 byte(s)


    Size of long: 4 byte(s)


    Size of long long: 8 byte(s)


    Size of float: 4 byte(s)


    Size of double: 8 byte(s)


    Size of long double: 16 byte(s)


    Size of bool: 1 byte(s)


    Now, let’s discuss how data type sizes can vary across different systems.


    Data type sizes can vary across different systems due to differences in hardware
    architectures, operating systems, and compilers. Here are a few factors that can
    contribute to variations in data type sizes:


    1.  Hardware architecture: Different hardware architectures might have different
    alignment requirements or native word sizes, which can influence the size of certain
    data types. For example, on some systems, int may be 2 bytes, while on others
    it could be 4 bytes.


    2.  Operating system: The underlying operating system can also affect data type
    sizes. For instance, on some systems, long may be 4 bytes, while on others it
    might be 8 bytes.


    3.  Compiler implementation: Compilers have some freedom in determining the sizes
    of data types. They can choose to align data types differently or provide different
    representations for certain types. Compiler options or flags can also influence
    the size of data types.


    4.  Compiler-specific extensions: Some compilers offer their own extensions or
    additional data types, which may have different sizes. These extensions may not
    be available on other compilers or systems, leading to further variations.


    To ensure portability and avoid assumptions about data type sizes, it’s good practice
    to use the <cstdint> header and the fixed-size integer types like int32_t or uint64_t,
    which guarantee a specific size regardless of the platform.


    In summary, data type sizes can vary across systems due to hardware architecture,
    operating system differences, compiler choices, and extensions. It’s important
    to consider these variations when writing portable code and rely on fixed-size
    integer types when size consistency is required.


    # Variable Input from User


    In C++, you can use the std::cin stream object to receive input from the user.
    Here’s an example program that demonstrates how to get user input into variables
    using std::cin:


    #include <iostream>


    int main() {


        int num;


        std::string name;


        std::cout << "Enter a number: ";


        std::cin >> num;


        std::cout << "Enter your name: ";


        std::cin >> name;


        std::cout << "You entered the number: " << num << std::endl;


        std::cout << "Your name is: " << name << std::endl;


        return 0;


    }


    Let’s go through the code step by step:


    1.  We include the <iostream> header, which provides input/output stream functionality.


    2.  In the main() function, we declare two variables: num of type int and name
    of type std::string. These variables will hold the user’s input.


    3.  We use std::cout to display a prompt message asking the user to enter a number.


    4.  We use std::cin to read the user’s input and store it in the num variable.


    5.  Next, we display a prompt message asking the user to enter their name.


    6.  Again, we use std::cin to read the user’s input and store it in the name variable.


    7.  Finally, we use std::cout to display the values of the variables num and name.'
