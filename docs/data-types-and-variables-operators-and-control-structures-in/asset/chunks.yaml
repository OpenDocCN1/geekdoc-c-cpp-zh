    value. We overload the relational operators (<, >, <=, >=, ==, and !=) as member
    functions of the class.


    Each overloaded operator takes a constant reference to another object of the same
    class as its argument. It compares the value of the current object (this) with
    the value of the other object and returns the appropriate result.


    By overloading these operators, we can now use them to compare objects of type
    MyClass directly. The comparisons become more intuitive and align with our expectations
    when working with user-defined types.


    Keep in mind that overloading the relational operators should be done with care.
    The comparisons should adhere to the expected behavior and maintain consistency
    to avoid confusion.


    # Overloading the Array Subscript Operator


    In C++, you can overload the array subscript operator ([]) to provide array-like
    access into user-defined types. This allows you to use the familiar array indexing
    syntax to access elements of your custom class objects.


    Here’s an example of how you can overload the array subscript operator:


    #include <iostream>


    class MyClass {


    private:


        int array[5]; // Example array in the class


    public:


        // Overloading the array subscript operator


        int& operator[](int index) {


            if (index >= 0 && index < 5) {


                return array[index];


            } else {


                // Handle out-of-bounds access here (e.g., throw an exception)


                throw std::out_of_range("Array index out of bounds");


            }


        }


    };


    int main() {


        MyClass obj;


        // Assign values to the array using the overloaded subscript operator


        for (int i = 0; i < 5; ++i) {


            obj[i] = i + 1;


        }


        // Access and print the values using the overloaded subscript operator


        for (int i = 0; i < 5; ++i) {


            std::cout << "obj[" << i << "] = " << obj[i] << std::endl;


        }


        return 0;


    }'
