    2. 递减 (`–`)：递减运算符将其操作数的值减 1。\n3. 正号 (`+`)：一元加运算符表示恒等操作，表示操作数的值没有变化。\n4. 负号 (`-`)：一元负运算符对其操作数的值取反，将正值变为负值，反之亦然。\n\
    5. 逻辑非 (`!`)：逻辑非运算符反转其操作数的逻辑状态。如果操作数为 `true`，则它返回 `false`；如果操作数为 `false`，则它返回\
    \ `true`。\n6. 按位取反 (`~`)：按位取反运算符对其操作数进行按位取反，将每个位从 0 翻转为 1，反之亦然。\n7. 地址 (`&`)：地址运算符返回其操作数的内存地址。\n\
    \n这里有一个演示一元运算符使用的示例程序：\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nint main() {\n    int num = 5;\n    cout << \"Initial value of num: \" << num\
    \ << endl;\n    // 递增运算符\n    num++;\n    cout << \"After increment: \" << num\
    \ << endl;\n\n    // 递减运算符\n    num--;\n    cout << \"After decrement: \" << num\
    \ << endl;\n\n    // 一元加运算符\n    num = +num;\n    cout << \"Unary plus: \" <<\
