    *   语法：\n```cpp\ndo {statements}\nwhile (condition);\n```\n\n## 嵌套循环\n\n*   另一个循环内部的循环。外层循环每执行一次，内层循环都会执行其所有的迭代。\n\
    \n## 基于范围的 For 循环\n\n*   用于遍历范围内（如数组、容器）的元素。\n*   语法：`for (declaration : range)\
    \ {statements}`\n\n## 使用 Break 控制循环\n\n*   `break` 语句用于提前停止循环。\n*   退出当前循环并将执行转移到紧随循环其后的语句。\n\
    \n## 使用 Continue 控制循环\n\n*   `continue` 语句跳过循环的剩余部分，并将控制权移回循环开头进行下一次迭代。\n\n##\
