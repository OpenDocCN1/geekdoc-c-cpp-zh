  trans: "\n\n## 1. 未知次数的迭代\n\n*   当迭代次数无法提前确定时，`while` 循环非常有用。\n*   条件在运行时动态评估，允许循环持续运行直到满足特定条件。\n\
    *   在示例程序中，循环会一直持续直到 `count` 达到 5。\n*   如果条件基于用户输入、文件处理或任何动态因素，循环可以适应不断变化的条件。\n\
    \n确保 `while` 循环内部的条件最终变为 `false` 是非常重要的；否则循环可能会无限运行，导致死循环。通常的做法是在循环的代码块内修改循环控制变量（例如示例中的\
    \ `count`），以确保条件最终会变为 `false`。\n\n`while` 循环是一种强大结构，允许你重复执行一段代码块，直到满足特定条件。它们功能多变，常用于无法预知迭代次数的各种编程场景。\n\
    \n## Do-While 循环\n\n这里有一个使用 `do-while` 循环的 C++ 示例程序：\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    int count = 0;\n    do {\n        std::cout << \"Count: \"\
    \ << count << std::endl;\n        count++;\n    } while (count < 5);\n    return\
    \ 0;\n}\n```\n\n在该程序中，我们有一个初始化为 0 的变量 `count`。`do-while` 循环至少执行一次代码块，只要条件 `count\
    \ < 5` 为 `true`，它就会继续循环。在循环内部，打印 `count` 的当前值，然后将其加 1。\n\n该程序的输出将：\nCount: 0\n\
    Count: 1\nCount: 2\nCount: 3\nCount: 4\n\n现在让我们讨论 `while` 循环和 `do-while` 循环之间的区别：\n\
    \n1. **执行顺序**：在 `while` 循环中，首先检查条件，如果为 `true`，则执行代码块。在 `do-while` 循环中，首先执行代码块，然后检查条件。这意味着无论条件如何，`do-while`\
    \ 循环都会至少执行一次代码块。\n2. **终止检查**：由于 `while` 循环在代码块之前检查条件，如果初始条件为 `false`，则代码块可能完全不执行。另一方面，`do-while`\
    \ 循环保证代码块至少执行一次，因为条件检查发生在代码块之后。\n3. **控制流**：在某些场景下，选择 `while` 还是 `do-while` 循环取决于所需的控制流。如果你需要执行一段代码然后检查条件，那么\
    \ `do-while` 循环是合适的。如果你想先检查条件再执行代码块，`while` 循环更为合适。\n4. **用途**：当你想要根据特定条件重复代码块时，常用\
    \ `while` 循环。`do-while` 循环通常用于你想至少执行一次操作，然后根据条件重复该操作。\n\n需要注意的是，`while` 和 `do-while`\
    \ 循环都是退出控制循环（exit-controlled loops），这意味着条件分别在循环迭代的开始或结束处检查。\n\n## 嵌套循环\n\n这里有一个使用嵌套循环的\
    \ C++ 程序示例：\n\n```cpp\n#include <iostream>\n\nint main() {\n    const int rows\
    \ = 3;\n    const int cols = 4;\n    // 嵌套循环用于遍历行和列\n    for (int i = 0; i < rows;\
    \ i++) {\n        for (int j = 0; j < cols; j++) {\n            std::cout << \"\
    Row: \" << i << \", Column: \" << j << std::endl;\n        }\n    }\n    return\
    \ 0;\n}\n```\n\n在该程序中，我们有两个嵌套的 `for` 循环。外层循环负责行，内层循环遍历列。通过组合这些循环，我们可以遍历多维结构。\n\
    \n嵌套循环在处理多维数据（如矩阵或网格）时特别有用。外层循环控制对行的迭代，而内层循环遍历每行内部的列。这种安排允许我们系统地访问多维结构中的每个元素。\n\
    \n此外，嵌套循环还可以处理复杂的重复模式。例如，你可以拥有多个层级的嵌套来处理三维或更高维度的数据。每个额外的嵌套循环都代表了数据结构中的一个额外维度。\n\
    \n嵌套循环也可以用于更复杂的重复模式。例如，你可以在循环内部使用条件语句来控制流。通过结合条件和嵌套循环，你可以实现复杂的算法或遍历数据结构的特定区域。\n\
    \n然而，需要注意的是，过度的嵌套会导致代码更难以阅读和理解。在利用嵌套循环处理复杂重复与保持代码可读性之间取得平衡至关重要。\n\n## 基于范围的 for\
    \ 循环\n\n这里有一个使用基于范围的 `for` 循环的 C++ 示例：\n\n```cpp\n#include <iostream>\n#include\
    \ <vector>\n\nint main() {\n    std::vector<int> numbers = {1, 2, 3, 4, 5};\n\
    \    for (int number : numbers) {\n        std::cout << number << \" \";\n   \
    \ }\n    return 0;\n}\n```\n\n在该程序中，我们有一个名为 `numbers` 的 `std::vector`。基于范围的 `for`\
    \ 循环遍历集合中的每个元素。\n\n基于范围的 `for` 循环优势如下：\n\n1. **简单**：语法简单直观。消除了显式处理索引的需求，使代码更易读。\n\
    2. **清晰**：通过在循环头中声明循环变量（在本例中为 `number`），其作用域限制在循环体内。\n3. **可读性**：它更清晰地表达了意图，而不是专注于如何迭代。\n\
    4. **避免差一错误**：由于循环直接代表集合的元素，因此不需要担心依赖索引操作时可能发生的差一错误（off-by-one errors）。\n\n总来说，C++\
    \ 中基于范围的 `for` 循环简化了遍历过程，使得代码更加简洁易于维护。\n\n## 使用 break 控制循环\n\n在 C++ 中，`break`\
    \ 语句用于提前退出循环，无论循环条件是否满足。当循环内部遇到 `break` 语句时，循环立即终止，程序继续执行后续语句。\n\n这里有一个演示使用 `break`\
    \ 提前退出循环的示例程序：\n\n```cpp\n#include <iostream>\n\nint main() {\n    int number;\n\
    \    // 读取打印数字的循环\n    while (true) {\n        std::cout << \"输入一个数字 (0 退出): \"\
    ;\n        std::cin >> number;\n        if (number == 0) {\n            std::cout\
    \ << \"退出循环。\" << std::endl;\n            break; // 如果数字为 0 则退出循环\n        }\n\
    \        std::cout << \"你输入了：\" << number << std::endl;\n    }\n    std::cout\
    \ << \"程序结束。\" << std::endl;\n    return 0;\n}\n```\n\n"
- fmt: "\nThe `break` statement is useful when you need to terminate a loop prematurely\
    \ based on a certain condition. It provides a way to exit the loop immediately\
    \ without waiting for the loop condition to become false. This can be helpful\
    \ in situations where you want to stop processing or iterating over a set of elements\
    \ once a specific condition is met.\n\nIt’s important to note that the `break`\
    \ statement only terminates the innermost loop that encloses it. If you have nested\
    \ loops, the `break` statement will only break out of the innermost loop. If you\
    \ want to break out of multiple nested loops simultaneously, you can use additional\
    \ techniques like labeled loops or flags.\n\n# Loop Control with Continue\n\n\
    Here’s an example program in C++ that demonstrates the use of the `continue` statement\
    \ to skip to the next iteration of a loop:\n\n```cpp\n#include <iostream>\n\n\
    int main() {\n    for (int i = 1; i <= 10; i++) {\n        if (i % 3 == 0) {\n\
    \            continue;  // Skip the rest of the loop body and move to the next\
    \ iteration\n        }\n        std::cout << i << \" \";\n    }\n    return 0;\n\
    }\n```\n\nIn this program, we have a `for` loop that iterates from `1` to `10`.\
    \ Inside the loop, there’s an `if` condition that checks if the current value\
    \ of `i` is divisible by `3` using the modulo operator (`%`). If the condition\
    \ is true, the `continue` statement is encountered.\n\nThe `continue` statement\
    \ causes the program to immediately jump to the next iteration of the loop, skipping\
    \ any remaining statements within the loop body. In this case, when `i` is divisible\
    \ by 3, the `continue` statement skips the `std::cout` statement, which prints\
    \ the value of `i`. Consequently, the numbers divisible by 3 (3, 6, and 9) are\
    \ not printed.\n\nThe output of this program will be:\n\n1 2 4 5 7 8 10\n\nThe\
    \ `continue` statement is useful in loop control when you want to skip certain\
    \ iterations based on specific conditions. It allows you to control the flow of\
    \ the loop and bypass certain code blocks when certain conditions are met.\n\n\
    By using `continue`, you can improve the efficiency of your code by avoiding unnecessary\
    \ computations or operations when specific conditions are satisfied. It helps\
    \ in reducing the complexity of the code and can make it more readable and concise.\n\
    \nIt’s important to note that the `continue` statement only affects the current\
    \ loop it is placed in. If you have nested loops, the `continue` statement will\
    \ skip to the next iteration of the innermost loop it belongs to.\n\n# Going to\
    \ Labels with Goto\n\nHere’s an example of a program in C++ that uses the `goto`\
    \ statement:\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main()\
    \ {\n    int num;\n    input:\n    cout << \"Enter a positive number: \";\n  \
    \  cin >> num;\n    if (num <= 0) {\n        cout << \"Invalid number. Please\
    \ try again.\" << endl;\n        goto input;\n    }\n    cout << \"The number\
    \ you entered is: \" << num << endl;\n    return 0;\n}\n```\n\nIn this program,\
    \ the `goto` statement is used to implement a simple input validation loop. If\
