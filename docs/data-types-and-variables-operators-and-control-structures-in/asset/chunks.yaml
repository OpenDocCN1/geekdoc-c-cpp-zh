  trans: "\n\n2. **自动迭代**：循环会自动处理迭代过程，抽象了管理迭代器或索引变量的细节。这减少了差一错误（off-by-one errors）或其他常见的循环相关错误的概率。\n\
    \n3. **只读迭代**：循环变量通常被声明为 `const`，这确保了容器元素在循环内部不能被修改。这有助于防止意外修改，并促进更安全的函数式编程。\n\
    \n4. **通用迭代**：“for each”循环可以用于各种容器类型，包括数组、vector、列表（list）、集合（set）、映射（map）以及支持迭代自定义类型。这允许对不同类型的集合使用一致且通用的迭代方法。\n\
    \n5. **易于理解**：通过使用“for each”循环，代码的意图变得更加清晰，因为循环是专门为遍历容器中的每个元素而设计的。这增强了代码的可读性，让其他开发者更容易理解和维护代码库。\n\
    \n总的来说，“for each”循环提供了一种更直观、表达更丰富的容器迭代方式，减少了样板代码并提高了代码的清晰度。当你需要对容器的每个元素执行操作，而不需要显式的索引操作或修改容器本身时，它们变得特别有用。\n\
    \n# 使用迭代器遍历容器\n\n这里有一个 C++ 示例程序，演示了如何使用迭代器遍历容器：\n\n```cpp\n#include <iostream>\n\
    #include <vector>\n\nint main() {\n    std::vector<int> numbers = {1, 2, 3, 4,\
    \ 5};\n    // 使用迭代器遍历 vector\n    std::vector<int>::iterator it;\n    for (it\
    \ = numbers.begin(); it != numbers.end(); ++it) {\n        std::cout << *it <<\
    \ \" \";\n    }\n    std::cout << std::endl;\n    return 0;\n}\n```\n\n在这个示例中，我们有一个名为\
    \ `numbers` 的 `std::vector`，其中包含一些整数。我们声明了一个类型为 `std::vector<int>::iterator` 的迭代器\
    \ `it`，它是通过对 `numbers` vector 调用 `begin()` 获取的。`begin()` 函数返回指向容器第一个元素的迭代器。我们还使用\
    \ `end()` 来获取表示容器结束的迭代器（指向最后一个元素之后）。\n\n然后，我们在 `for` 循环中使用迭代器遍历容器。循环一直持续到迭代器 `it`\
    \ 到达容器末尾，我们在每次迭代中通过 `++it` 增加迭代器。在循环内部，我们使用 `*it` 访问当前迭代器位置的值并打印它。\n\n现在，让我们讨论一下迭代器的使用以及它们与\
    \ for-each 循环的比较：\n\n迭代器提供了一种以通用方式访问和操作容器内元素的方法，而不取决于具体的容器类型。它们允许你遍历容器并执行读取、修改和删除元素等各种操作。\n\
    \n### 迭代器的优点：\n\n1. **灵活性**：迭代器提供了一种灵活访问容器元素的方法。它们允许以正向或反向方向遍历容器、跳过元素或跳转到特定位置。\n\
    2. **修改**：迭代器可以用于修改容器中的元素。通过对迭代器进行解引用并赋值新值，可以直接更改元素。\n3. **通用性**：迭代器在不同容器类型之间提供了统一的接口。你可以对\
    \ vector、list、set、map 等各种容器使用相同的迭代器语法。\n\n另一方面，基于范围的 for 循环（range-based for loop），称为\
    \ for-each 循环，是 C++11 引入的一种方便结构，简化了容器的迭代。这里是相同 vector 的示例：\n\n```cpp\nfor (int\
    \ num : numbers) {\n    std::cout << num << \" \";\n}\nstd::cout << std::endl;\n\
    ```\n\n### for-each 循环的优点：\n\n1. **简单性**：for-each 循环的语法简洁且易读。它会自动处理迭代器的创建、初始化和终止，使代码更具可读性且不易出错。\n\
    2. **安全性**：for-each 循环确保你不会越越容器的边界。循环会自动遍历容器的所有元素，而不需要显式的迭代器操作。\n\n比较这两种方法，迭代器对迭代过程提供了更多的灵活性控制。当你需要执行高级操作（如修改或根据特定条件跳过元素）时，它们是合适的。另一方面，for-each\
    \ 循环提供了一种更简单、更安全的方法来遍历整个容器，而不需要显式的迭代器管理。\n\n值得提到的是，从 C++11 开始，如果你对迭代过程需要更多控制，基于范围的\
    \ for 循环也可以配合迭代器使用。例如，你可以使用 `auto` 代替显式指定迭代器类型：\n\n```cpp\nfor (auto it = numbers.begin();\
    \ it != numbers.end(); ++it) {\n    std::cout << *it << \" \";\n}\nstd::cout <<\
    \ std::endl;\n```\n\n这结合了 for-each 循环的简单性与使用迭代器的灵活性。\n\n# 使用 Goto 创建显式控制流图\n\n\
    这是一个使用 `goto` 语句创建显式控制流图的 C++ 程序示例：\n\n```cpp\n#include <iostream>\n\nint main()\
    \ {\n    int num;\n    std::cout << \"输入一个数字：\" ;\n    std::cin >> num;\n    if\
    \ (num > 0)\n        goto positive;\n    else if (num < 0)\n        goto negative;\n\
    \    else\n        goto zero;\n\npositive:\n    std::cout << \"这是一个正数。\" << std::endl;\n\
    \    goto end;\n\nnegative:\n    std::cout << \"这是一个负数。\" << std::endl;\n    goto\
    \ end;\n\nzero:\n    std::cout << \"这是一个零。\" << std::endl;\n    goto end;\n\n\
    end:\n    std::cout << \"程序结束。\" << std::endl;\n    return 0;\n}\n```\n\n在这个程序中，`goto`\
    \ 语句根据用户输入跳转到特定的标签（`positive`、`negative`、`zero`、`end`）。\n\n然而，现代编程中通常不建议使用 `goto`。原因如下：\n\
    \n1. **复杂性与可读性**：`goto` 使用会导致难以理解和推理的代码。随着程序规模和复杂性的增加，`goto` 会导致代码难以调试和修改。\n2.\
    \ **结构化编程**：`goto` 的使用违反了结构化编程原则，该原则通过循环和条件语句来组织代码和控制流。依赖 `goto` 会使程序失去有助于理解的结构。\n\
    3. **易出错**：`goto` 语句可能会引入微妙的 bug 和错误。它们会导致意外的控制流，使得难以判断程序的正确性。特别是当使用 `goto` 跳过初始化或清理代码时，会导致资源泄漏和未定义行为。\n\
    \n与其使用 `goto`，不如采用结构化编程实践，并利用循环、条件语句和函数来实现所需的控制流。这些结构化构造使代码更具可读性、可维护性且易于推理，减少了引入错误的概率。\n\
    \n例如，在给定的程序中，可以将 `goto` 语句替换为 `if-else` 语句或 `switch` 语句，在不牺牲可读性和维护性的情况下实现相同的控制流。\n\
    \n# 重复 switch 语句直到输入有效\n\n这里有一个 C++ 示例程序，它会重复 switch 语句直到接收有效输入，并以后用户的方式处理无效输入：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    char choice;\n    do {\n  \
    \      // 显示菜单\n        std::cout << \"菜单：\" << std::endl;\n        std::cout\
    \ << \"1. 选项一\" << std::endl;\n        std::cout << \"2. 选项二\" << std::endl;\n\
    \        std::cout << \"3. 退出\" << std::endl;\n        std::cout << \"输入你的选择：\"\
    ;\n        std::cin >> choice;\n\n        switch (choice) {\n            case\
    \ '1':\n                std::cout << \"你选择了选项一。\" << std::endl;\n            \
    \    break;\n            case '2':\n                std::cout << \"你选择了选项二。\"\
    \ << std::endl;\n                break;\n            case '3':\n             \
    \   std::cout << \"正在退出...\" << std::endl;\n                return 0;\n      \
    \      default:\n                std::cout << \"无效的选择，请重试。\" << std::endl;\n \
    \       }\n    } while (choice != '3');\n\n    return 0;\n}\n```\n\n"
