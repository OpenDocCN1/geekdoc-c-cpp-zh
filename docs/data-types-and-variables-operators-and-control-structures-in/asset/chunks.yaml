    *   As of C++17, switch statements can also include an initializer.


    *   Syntax: switch (init; condition) {cases}


    Variadic Templates


    *   Variadic templates are templates that can take a variable number of arguments
    in a type-safe way.


    The Comma Operator in Loops


    *   The comma operator allows multiple statements to be placed in the initialization
    and iteration parts of a loop.


    Breaking Out of Nested Loops'
