    # Iterating Over a Container with an Iterator


    Here’s an example program in C++ that demonstrates the use of iterators to iterate
    over a container:


    #include <iostream>


    #include <vector>


    int main() {


        std::vector<int> numbers = {1, 2, 3, 4, 5};


        // Using iterators to iterate over the vector


        std::vector<int>::iterator it;


        for (it = numbers.begin(); it != numbers.end(); ++it) {


            std::cout << *it << " ";


        }


        std::cout << std::endl;


        return 0;


    }


    In this example, we have a std::vector named numbers containing some integers.
    We declare an iterator it of type std::vector<int>::iterator, which is obtained
    by calling begin() on the numbers vector. The begin() function returns an iterator
    pointing to the first element of the container. We also use end() to get an iterator
    representing the end of the container (one past the last element).


    We then iterate over the container using the iterator in a for loop. The loop
    continues until the iterator it reaches the end of the container, and we increment
    the iterator using ++it in each iteration. Inside the loop, we access the value
    at the current iterator position using *it and print it.


    Now, let’s discuss the use of iterators and how they compare to for-each loops:


    Iterators provide a way to access and manipulate elements within a container in
    a generic manner, irrespective of the specific container type. They allow you
    to iterate over the container and perform various operations like reading, modifying,
    and deleting elements.


    Advantages of Iterators:


    1.  Flexibility: Iterators provide a way to access elements of a container in
    a flexible manner. They allow traversing a container in both forward and backward
    directions, skipping elements, or jumping to specific positions.


    2.  Modification: Iterators can be used to modify elements in the container. By
    dereferencing the iterator and assigning a new value, you can change the element
    directly.


    3.  Generic: Iterators provide a consistent interface across different container
    types. You can use the same iterator syntax for various containers like vectors,
    lists, sets, maps, etc.


    On the other hand, the range-based for loop, also known as the for-each loop,
    is a convenient construct introduced in C++11 that simplifies iteration over containers.
    Here’s an example using the same vector:


    for (int num : numbers) {


        std::cout << num << " ";


    }


    std::cout << std::endl;


    Advantages of for-each loops:


    1.  Simplicity: The syntax of the for-each loop is concise and easy to read. It
    automatically handles the iterator creation, initialization, and termination,
    making the code more readable and less error-prone.


    2.  Safety: For-each loops ensure that you don’t accidentally go beyond the bounds
    of the container. The loop automatically iterates over all the elements of the
    container without the need for explicit iterator manipulation.


    Comparing the two approaches, iterators offer more flexibility and control over
    the iteration process. They are suitable when you need to perform advanced operations
    like modification or skipping elements based on specific conditions. On the other
    hand, for-each loops provide a simpler and safer way to iterate over the entire
    container without the need for explicit iterator management.


    It’s worth mentioning that starting from C++11, range-based for loops can also
    be used with iterators if you need more control over the iteration process. For
    example, you can use auto instead of explicitly specifying the iterator type:


    for (auto it = numbers.begin(); it != numbers.end(); ++it) {


        std::cout << *it << " ";


    }


    std::cout << std::endl;


    This combines the simplicity of the for-each loop with the flexibility of using
    iterators.


    # Explicit Control Flow Graphs with Goto


    Here’s an example of a C++ program that uses the goto statement to create an explicit
    control flow graph:


    #include <iostream>


    int main() {


        int num;


        std::cout << "Enter a number: ";


