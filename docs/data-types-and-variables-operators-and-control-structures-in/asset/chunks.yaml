    # Overloading Relational Operators


    In C++, you can overload relational operators for a custom class to enable intuitive
    comparisons of user-defined types. Overloading these operators allows you to define
    how the objects of your custom class should be compared in a meaningful way.


    Here’s an example program that demonstrates overloading the relational operators
    for a custom class:


    #include <iostream>


    class MyClass {


    private:


        int value;


    public:


        MyClass(int val) : value(val) {}


        // Overloading the less than operator (<)


        bool operator<(const MyClass& other) const {


            return value < other.value;


        }


        // Overloading the greater than operator (>)


        bool operator>(const MyClass& other) const {


            return value > other.value;


        }


        // Overloading the less than or equal to operator (<=)


        bool operator<=(const MyClass& other) const {


            return value <= other.value;


        }


        // Overloading the greater than or equal to operator (>=)


        bool operator>=(const MyClass& other) const {


            return value >= other.value;


        }


        // Overloading the equal to operator (==)


        bool operator==(const MyClass& other) const {


            return value == other.value;


        }


        // Overloading the not equal to operator (!=)


        bool operator!=(const MyClass& other) const {


            return value != other.value;


        }


    };


    int main() {


        MyClass obj1(5);


        MyClass obj2(10);


        if (obj1 < obj2) {


