    \ 条件为假时执行。\n*   语法：\n```cpp\nif (condition) {statements}\nelse {statements}\n\
    ```\n\n## Else if 语句\n\n*   如果初始的 `if` 条件为假，则检查额外的条件。\n*   语法：\n```cpp\nif (condition1)\
    \ {statements}\nelse if (condition2) {statements}\nelse {statements}\n```\n\n\
    ## 嵌套 if 语句\n\n*   另一个 `if` 或 `else if` 语句内部的 `if` 语句。\n*   当检查多级条件时有用。\n\n##\
    \ Switch 语句\n\n*   用于从多个代码块中选择一个执行。\n*   语法：\n```cpp\nswitch (expression) {\n\
