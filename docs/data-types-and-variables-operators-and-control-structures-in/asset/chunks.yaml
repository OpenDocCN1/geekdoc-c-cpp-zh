    be executed. In this case, it will print “The number is positive.”


    If the condition inside the if statement is true, the code block following the
    if statement will be executed. Otherwise, if the condition is false, the code
    block will be skipped, and the program will continue with the next statement after
    the if block.


    The if statement allows us to control the flow of the program based on certain
    conditions. It helps us make decisions and execute specific blocks of code only
    when certain conditions are met. By using if statements, we can create programs
    that exhibit different behaviors based on the values of variables or the result
    of expressions.


    # Else Statement


    Here’s an example program in C++ that demonstrates the use of an else statement
    in combination with an if statement:


    #include <iostream>


    int main() {


        int number;


        std::cout << "Enter a number: ";


        std::cin >> number;


        if (number > 0) {


            std::cout << "The number is positive." << std::endl;


        } else {


            std::cout << "The number is zero or negative." << std::endl;


        }


        return 0;


    }


    In this program, the user is prompted to enter a number. The program then checks
    if the entered number is greater than zero using the if statement. If the condition
    evaluates to true, it prints “The number is positive.” Otherwise, if the condition
    evaluates to false, it executes the code within the else block and prints “The
    number is zero or negative.”


    The else statement is used in combination with the if statement to specify an
    alternative set of statements to execute when the condition in the if statement
    is false. It provides a way to handle the “else” case when the condition is not
    met. The else block is optional and can be omitted if there is no action needed
    when the condition is false.


    By using an else statement, you can create branching logic in your program. If
    the condition in the if statement is satisfied, the code within the if block is
    executed. Otherwise, the code within the else block is executed. This allows you
    to perform different actions based on the outcome of a condition.


    # Else if Statement


    Here’s an example of a C++ program that uses an else if statement:


    #include <iostream>


    int main() {


        int num;


        std::cout << "Enter a number: ";


        std::cin >> num;


        if (num > 0) {


            std::cout << "Number is positive." << std::endl;


        } else if (num < 0) {


            std::cout << "Number is negative." << std::endl;


        } else {


            std::cout << "Number is zero." << std::endl;


        }


        return 0;


    }


    In this program, the user is asked to enter a number. The program then checks
    the value of the number using an if-else if-else structure.


    Here’s how the else if statement works:


    *   The if statement is the first condition to be checked. If the condition inside
    the if statement is true (i.e., the number is greater than zero), the code block
    within the if statement will be executed, and the program will print “Number is
    positive.”


    *   If the condition in the if statement is false, the program moves on to the
    next condition, which is the else if statement. If the condition inside the else
    if statement is true (i.e., the number is less than zero), the code block within
    the else if statement will be executed, and the program will print “Number is
    negative.”


    *   If both the if and else if conditions are false, the program executes the
    code block within the else statement, and it will print “Number is zero.”


    By using the else if statement, you can create multiple conditions that are checked
    sequentially, allowing the program to choose the appropriate code block based
    on the first condition that evaluates to true. This construct is particularly
    useful when you have multiple mutually exclusive conditions that you want to check
    in a specific order.


    # Nested if Statement


    Here’s an example program in C++ that demonstrates the use of nested if statements:


    #include <iostream>


    int main() {


        int x = 5;


        int y = 10;


        if (x > y) {


            std::cout << "x is greater than y." << std::endl;


        } else {


            if (x < y) {


                std::cout << "x is less than y." << std::endl;


            } else {


                std::cout << "x is equal to y." << std::endl;


            }


        }


        return 0;


    }


    In this program, we have a nested if statement. If the first condition x > y is
    true, the program prints “x is greater than y.” If it’s false, it enters the nested
    if statement and checks the condition x < y. If this condition is true, it prints
    “x is less than y.” Finally, if both conditions are false, it executes the else
    block and prints “x is equal to y.”


    Implications and potential pitfalls of nested conditionals:


    1.  Code complexity: Nested if statements can make code more complex and harder
    to read and understand, especially when there are multiple levels of nesting.
    It can lead to code that is difficult to maintain and debug.


    2.  Code duplication: Nesting if statements can result in code duplication if
    the same conditions need to be checked at multiple levels. This can make the code
    less maintainable and increase the chances of introducing bugs.


    3.  Performance impact: Nested if statements may have a performance impact if
    the conditions are computationally expensive or if the nesting is excessive. In
    such cases, it’s important to consider code optimization techniques or alternative
    approaches to improve performance.


    4.  Logical errors: Mistakes in writing nested conditions can lead to logical
    errors. It’s crucial to ensure that the conditions and their logical relationships
    are correctly defined to avoid unintended behavior.


    5.  Alternative design patterns: In some cases, nested if statements can be replaced
    with alternative design patterns like switch statements, lookup tables, or polymorphism.
    These alternatives can result in cleaner and more maintainable code.


    To mitigate the pitfalls of nested conditionals, it’s important to follow good
    programming practices such as writing clean and modular code, using meaningful
    variable names, commenting complex sections, and considering alternative control
    flow structures when appropriate.


    # Switch Statement


    Here’s an example program in C++ that demonstrates the use of a switch statement:


    #include <iostream>


    int main() {


        int choice;


        std::cout << "Enter a number between 1 and 3: ";


        std::cin >> choice;


        switch (choice) {


            case 1:


                std::cout << "You selected option 1." << std::endl;


                break;


            case 2:


                std::cout << "You selected option 2." << std::endl;


                break;


            case 3:


                std::cout << "You selected option 3." << std::endl;


                break;


            default:


                std::cout << "Invalid choice." << std::endl;


                break;


        }


        return 0;


    }'
