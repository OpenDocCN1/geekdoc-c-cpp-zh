    \ menu options, and any other situation where you have a fixed set of possible\
    \ values that need to be identified by name rather than raw numbers.\n\n# Bit\
    \ Manipulation\n\nHere’s an example program in C++ that demonstrates bitwise operations\
    \ on integer variables:\n\n```cpp\n#include <iostream>\n\nint main() {\n    int\
    \ a = 5; // 0101 in binary\n    int b = 3; // 0011 in binary\n    // Bitwise AND\n\
    \    int resultAnd = a & b;\n    std::cout << \"Bitwise AND: \" << resultAnd <<\
    \ std::endl; // Output: 1\n\n    // Bitwise OR\n    int resultOr = a | b;\n  \
    \  std::cout << \"Bitwise OR: \" << resultOr << std::endl; // Output: 7\n\n  \
    \  // Bitwise XOR\n    int resultXor = a ^ b;\n    std::cout << \"Bitwise XOR:\
    \ \" << resultXor << std::endl; // Output: 6\n\n    // Bitwise NOT\n    int resultNotA\
    \ = ~a;\n    std::cout << \"Bitwise NOT (A): \" << resultNotA << std::endl; //\
    \ Output: -6\n    int resultNotB = ~b;\n    std::cout << \"Bitwise NOT (B): \"\
    \ << resultNotB << std::endl; // Output: -4\n\n    // Left shift\n    int leftShifted\
    \ = a << 2;\n    std::cout << \"Left Shift: \" << leftShifted << std::endl; //\
    \ Output: 20\n\n    // Right shift\n    int rightShifted = a >> 1;\n    std::cout\
    \ << \"Right Shift: \" << rightShifted << std::endl; // Output: 2\n\n    return\
    \ 0;\n}\n```\n\nLet’s discuss each bitwise operation and its use cases:\n\n1.\
    \ Bitwise AND (`&`): Performs a bitwise AND operation between two integers, resulting\
    \ in a new integer where each bit is set if and only if the corresponding bits\
    \ in both operands are set. This operation is often used to mask certain bits\
    \ or extract specific information from a bit pattern.\n2. Bitwise OR (`|`): Performs\
    \ a bitwise OR operation between two integers, resulting in a new integer where\
    \ each bit is set if either of the corresponding bits in the operands is set.\
    \ It is commonly used to set specific bits or combine different bit patterns.\n\
    3. Bitwise XOR (`^`): Performs a bitwise exclusive OR operation between two integers,\
    \ resulting in a new integer where each bit is set if and only if the corresponding\
    \ bits in the operands differ. It can be used for flipping bits or performing\
    \ conditional operations.\n4. Bitwise NOT (`~`): Performs a bitwise complement\
    \ operation on an integer, resulting in a new integer where each bit is flipped\
    \ (i.e., 0s become 1s and vice versa). It is often used for inverting bits or\
    \ creating bit masks.\n5. Left shift (`<<`): Shifts the bits of an integer to\
    \ the left by a specified number of positions. The shifted bits are filled with\
    \ zeros. This operation effectively multiplies the integer by 2 raised to the\
    \ power of the shift amount.\n6. Right shift (`>>`): Shifts the bits of an integer\
    \ to the right by a specified number of positions. The shifted bits can be filled\
    \ with zeros or the sign bit (in case of signed integers). This operation effectively\
    \ divides the integer by 2 raised to the power of the shift amount.\n\nThese bitwise\
    \ operations are useful in various scenarios, such as:\n\n* Manipulating individual\
    \ bits or groups of bits within an integer representation.\n* Building efficient\
    \ data structures, such as bitsets or bit arrays.\n* Optimizing code by performing\
    \ bitwise operations instead of more costly arithmetic operations.\n* Implementing\
    \ low-level protocols or encoding schemes that rely on bitwise manipulation.\n\
    \nIt’s important to note that bitwise operations are highly dependent on the binary\
    \ representation of integers and may exhibit different behavior for signed and\
    \ unsigned types. Care should be taken to ensure the desired semantics and avoid\
    \ potential pitfalls, such as signed integer overflow.\n\n# Understanding Type\
    \ Sizes\n\nHere’s a C++ program that prints the size of each data type:\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n    std::cout << \"Size of char: \" << sizeof(char)\
    \ << \" byte(s)\" << std::endl;\n    std::cout << \"Size of short: \" << sizeof(short)\
    \ << \" byte(s)\" << std::endl;\n    std::cout << \"Size of int: \" << sizeof(int)\
    \ << \" byte(s)\" << std::endl;\n    std::cout << \"Size of long: \" << sizeof(long)\
    \ << \" byte(s)\" << std::endl;\n    std::cout << \"Size of long long: \" << sizeof(long\
    \ long) << \" byte(s)\" << std::endl;\n\n    return 0;\n}\n```\n\n# Variable Input\
    \ from User\n\nIn C++, you can use the `std::cin` object to receive input from\
    \ the user. Here’s an example program that demonstrates how to get input into\
    \ variables using `std::cin`:\n\n```cpp\n#include <iostream>\n#include <string>\n\
    \nint main() {\n    int num;\n    std::string name;\n    std::cout << \"Enter\
    \ a number: \";\n    std::cin >> num;\n    std::cout << \"Enter your name: \"\
    ;\n    std::cin >> name;\n    std::cout << \"You entered the number: \" << num\
    \ << std::endl;\n    std::cout << \"Your name is: \" << name << std::endl;\n\n\
    \    return 0;\n}\n```\n\nLet’s go through the code step by step:\n\n1. We include\
    \ the `<iostream>` header, which provides input/output stream functionality.\n\
    2. In the `main()` function, we declare two variables: `num` of type `int` and\
    \ `name` of type `std::string`. These variables will hold the user’s input.\n\
    3. We use `std::cout` to display a prompt message asking the user to enter a number.\n\
    4. We use `std::cin` to read the user’s input and store it in the `num` variable.\n\
    5. Next, we display a prompt message asking the user to enter their name.\n6.\
    \ Again, we use `std::cin` to read the user’s input and store it in the `name`\
    \ variable.\n7. Finally, we use `std::cout` to display the values of the variables\
    \ `num` and `name`.\n"
