    Next, we use a loop to extract the individual arguments from the va_list using
    va_arg(args, int). This function retrieves the next argument of the specified
    type (int in this case) from the va_list. We add each argument to the sum variable.


    After processing all the arguments, we call va_end(args) to clean up the va_list.


    Finally, we calculate the average by dividing the sum by the number of arguments
    and return it.


    In the main function, we demonstrate how to use the calculateAverage function
    with different numbers of arguments. The program outputs the calculated averages.


    Note that variadic functions can be powerful tools, but they should be used with
    caution, as they can be error-prone if not used correctly. It’s important to ensure
    that you provide enough information to the variadic function to correctly process
    the variable arguments.


    # Using the Scope Resolution Operator


    In C++, the scope resolution operator (::) is used to access global variables
    and define functions outside a class. Let’s take a look at how it works:


    Accessing Global Variables:


    #include <iostream>


    int globalVariable = 10; // Global variable


    int main() {


        int globalVariable = 5; // Local variable with the same name


        std::cout << "Local variable: " << globalVariable << std::endl;


        std::cout << "Global variable: " << ::globalVariable << std::endl;


        return 0;


    }


    In the above example, we have a global variable named globalVariable declared
    outside the main function. Inside the main function, we have a local variable
    with the same name. To access the global variable instead of the local one, we
    use the scope resolution operator :: followed by the variable name (::globalVariable).


    Defining Functions Outside a Class:


    #include <iostream>


    class MyClass {


    public:


        void myFunction(); // Function declaration inside the class


    };


    void MyClass::myFunction() {


        std::cout << "This is myFunction() defined outside the class." << std::endl;


    }


    int main() {


        MyClass obj;


        obj.myFunction();


        return 0;


    }


    In this example, we define a class called MyClass and declare a member function
    myFunction() inside the class. To define the function outside the class, we use
    the scope resolution operator :: followed by the class name (MyClass::myFunction()).
    This allows us to separate the declaration and definition of the function, making
    the code more organized.


    The scope resolution operator is a powerful tool in C++ that helps differentiate
    between local and global variables and allows us to define functions outside a
    class while still associating them with the class.


    # Working with New and Delete Operators


    Below is an example program in C++ that demonstrates the use of new and delete
    operators for dynamic memory allocation:


    #include <iostream>


    int main() {


        // Allocate an integer dynamically using new operator


        int* dynamicInt = new int;


        *dynamicInt = 42;


        std::cout << "Dynamic integer value: " << *dynamicInt << std::endl;


        // Deallocate the memory using delete operator


        delete dynamicInt;


        dynamicInt = nullptr;


        // Allocate an array of integers dynamically using new operator


        int size = 5;


        int* dynamicArray = new int[size];


        std::cout << "Enter " << size << " integers:" << std::endl;


        for (int i = 0; i < size; i++) {


            std::cin >> dynamicArray[i];


        }


        std::cout << "Dynamic array values: ";


        for (int i = 0; i < size; i++) {


            std::cout << dynamicArray[i] << " ";


        }


        std::cout << std::endl;


        // Deallocate the memory using delete[] operator


        delete[] dynamicArray;


        dynamicArray = nullptr;


        return 0;


    }


    In this program, we start by using the new operator to dynamically allocate an
    integer (dynamicInt). We assign a value of 42 to it and print the value. Afterward,
    we use the delete operator to deallocate the memory.


    Next, we allocate an array of integers (dynamicArray) with a size of 5 using the
    new operator. We prompt the user to enter 5 integers, store them in the array,
    and then print the array values. Finally, we deallocate the memory for the array
    using the delete[] operator.


    Dynamic memory allocation in C++ allows you to allocate memory at runtime, rather
    than at compile time. It provides flexibility in managing memory resources and
    is useful when the size or lifetime of an object is not known at compile time.
    The new operator is used to allocate memory dynamically, and it returns a pointer
    to the allocated memory. The delete operator is used to release the dynamically
    allocated memory and prevent memory leaks.


    It’s important to note that when dynamically allocating an array, as shown with
    dynamicArray, the delete[] operator should be used instead of delete. Failing
    to do so can lead to undefined behavior.


    Remember to always deallocate dynamically allocated memory using delete or delete[]
    to avoid memory leaks and free up resources when they are no longer needed. Additionally,
    setting the pointer to nullptr after deletion is a good practice to prevent accidental
    use of deallocated memory.


    # III


    # Control Structures in C++


    # Introduction to Control Structures in C++


    One of the fundamental areas you should understand deeply is control structures.
    This article will walk you through this fundamental concept in C++, focusing on
    what control structures are, their importance, types, and practical examples of
    their use.


    Control structures are instrumental in C++. They are responsible for determining
    the flow of execution within a program, effectively controlling how statements
    or instructions are executed. They can alter the linear execution sequence, making
    it conditional or repeating based on specific conditions.


    Without control structures, a C++ program would simply execute each line of code
    sequentially, leaving no room for dynamic behavior. With them, you can make decisions,
    repeat instructions, and perform complex tasks, making your program more flexible
    and efficient.


    There are three types of control structures in C++: sequence, selection, and repetition.


    Sequence control structures execute code in the exact order that it appears in
    the program. It’s the simplest form of control structure and is the default structure
    in most C++ programs.


    Selection control structures offer the ability to make decisions and execute different
    blocks of code based on certain conditions. These structures include the ‘if’,
    ‘if-else’, and ‘switch’ statements.


    Repetition control structures, also known as loops, repeatedly execute a block
    of code until a specific condition is met or is no longer true. Loops include
    the ‘for’, ‘while’, and ‘do-while’ loops.


    To illustrate, imagine a program designed to read user inputs. The sequence control
    structure will be used to dictate the order in which instructions are executed.
    If the program is designed to check if the user input is a certain value, a selection
    control structure will be used. Finally, if the program needs to continue reading
    user inputs until a specific condition is met, a repetition control structure
    would be utilized.'
