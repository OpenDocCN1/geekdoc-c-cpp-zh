    \n总而言之，在 C++ 中使用自定义异常提供了灵活性、更好的错误处理和改进的代码组织，使你的程序变得更加健壮且易于维护。\n\n# Finally 块\n\
    \n在 C++ 中，没有像其他编程语言那样的内置 “finally” 块。然而，你可以结合 `try-catch` 块和 RAII（资源获取即初始化）原则来实现类似的行为。\n\
    \nRAII 原则规定，资源的获取和释放应该与对象的生命周期绑定。利用这一原则可以确保无论是否抛出异常，某些代码都会执行。这是一个示例：\n\n```cpp\n\
