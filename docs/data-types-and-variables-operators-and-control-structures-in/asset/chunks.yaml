  raw: 'Here’s an example program in C++ that demonstrates the use of relational operators
    for comparing variables:


    #include <iostream>


    using namespace std;


    int main() {


       int num1, num2;


       cout << "Enter the first number: ";


       cin >> num1;


       cout << "Enter the second number: ";


       cin >> num2;


       cout << endl;


       // Relational operators


       cout << "Relational Operators:" << endl;


       cout << "num1 < num2 : " << (num1 < num2) << endl;


       cout << "num1 > num2 : " << (num1 > num2) << endl;


       cout << "num1 <= num2: " << (num1 <= num2) << endl;


       cout << "num1 >= num2: " << (num1 >= num2) << endl;


       cout << "num1 == num2: " << (num1 == num2) << endl;


       cout << "num1 != num2: " << (num1 != num2) << endl;


       return 0;


    }


    In this program, the user is prompted to enter two numbers (num1 and num2). The
    program then uses various relational operators to compare the values of these
    variables.


    The relational operators used in this program are:


    *   < (less than): Returns true if num1 is less than num2, and false otherwise.


    *   > (greater than): Returns true if num1 is greater than num2, and false otherwise.


    *   <= (less than or equal to): Returns true if num1 is less than or equal to
    num2, and false otherwise.


    *   >= (greater than or equal to): Returns true if num1 is greater than or equal
    to num2, and false otherwise.


    *   == (equal to): Returns true if num1 is equal to num2, and false otherwise.


    *   != (not equal to): Returns true if num1 is not equal to num2, and false otherwise.


    The output of the program will display the results of these comparisons using
    the relational operators.


    Note: The relational operators (<, >, <=, >=, ==, and !=) return a boolean value
    (true or false) depending on the outcome of the comparison. In the program above,
    the boolean value is then printed to the console using cout.


    # Shift Operators


    Here’s an example program in C++ that demonstrates the use of shift operators
    and explains how they can be used for efficient multiplication and division by
    powers of two:


    #include <iostream>


    int main() {


        int num = 10;


        // Left shift operator for multiplication


        int result = num << 2;


        std::cout << "Result of left shift (multiplication): " << result << std::endl;


        // Right shift operator for division


        int quotient = num >> 2;


        std::cout << "Result of right shift (division): " << quotient << std::endl;


        return 0;


    }


    In this program, we have a variable num initialized with the value 10\. We will
    use the shift operators to demonstrate multiplication and division by powers of
    two.


    The left shift operator (<<) performs a binary shift to the left, effectively
    multiplying the number by 2 raised to the power of the right operand. In the example,
    num << 2 shifts the binary representation of num two positions to the left, resulting
    in 40 (10 * 2^2).


    The right shift operator (>>) performs a binary shift to the right, effectively
    dividing the number by 2 raised to the power of the right operand. In the example,
    num >> 2 shifts the binary representation of num two positions to the right, resulting
    in 2 (10 / 2^2).


    Using shift operators for multiplication and division by powers of two is efficient
    because it can be implemented as a bitwise operation, which is generally faster
    than traditional multiplication and division operations. It works effectively
    because shifting the binary representation of a number to the left multiplies
    it by 2, while shifting it to the right divides it by 2.


    # Ternary Operator


    Here’s an example of a C++ program that uses the ternary operator to choose between
    two values based on a condition:


    #include <iostream>


    int main() {


        int number;


        std::cout << "Enter a number: ";


        std::cin >> number;


        // Using ternary operator


        std::string result = (number % 2 == 0) ? "even" : "odd";


        std::cout << "The number is " << result << std::endl;


        return 0;


    }


    In this program, the user is prompted to enter a number. The ternary operator
    (number % 2 == 0) ? “even” : “odd” is used to determine whether the number is
    even or odd. If the condition (number % 2 == 0) is true, the value “even” is assigned
    to the result variable; otherwise, the value “odd” is assigned.


    The ternary operator is a shorthand notation for simple if-else statements. It
    provides a concise way to express conditional expressions. The syntax of the ternary
    operator is as follows:


    (condition) ? value_if_true : value_if_false


    If the condition is true, the expression evaluates to value_if_true, and if the
    condition is false, it evaluates to value_if_false.


    The ternary operator is useful in situations where you have a simple conditional
    expression and you want to assign a value based on the result of that condition.
    It can make your code more concise and easier to read, especially for simple if-else
    statements that involve assigning values to variables.


    However, it’s important to note that the ternary operator is not always the best
    choice. If your if-else statement involves more complex logic or multiple statements,
    it’s generally better to use the regular if-else construct for better readability
    and maintainability. The ternary operator should be used judiciously and when
    it enhances the clarity of the code.


    # Type Conversion Operators


    Here’s an example program in C++ that demonstrates the use of type conversion
    operators and discusses implicit and explicit type conversions:


    #include <iostream>


    class Distance {


    private:


        int feet;


        float inches;


    public:


        // Constructor


        Distance(int ft = 0, float in = 0) : feet(ft), inches(in) {}


        // Conversion operator for float


        operator float() const {


            float total = feet + inches / 12.0;


            return total;


        }


    };


    int main() {


        Distance d(5, 10.5);


        // Implicit type conversion


        float totalDistance = d; // Converts Distance object to float using conversion
    operator


        std::cout << "Total distance: " << totalDistance << " feet" << std::endl;


        // Explicit type conversion


        int intDistance = static_cast<int>(totalDistance); // Converts float to int
    using static_cast


        std::cout << "Integer distance: " << intDistance << " feet" << std::endl;


        return 0;


    }


    In this example, we have a class called Distance that represents a distance in
    feet and inches. The class defines a conversion operator operator float() that
    converts a Distance object to a float value. This allows us to convert a Distance
    object to a float implicitly.


    In the main() function, we create a Distance object d with a value of 5 feet and
    10.5 inches. We then assign the Distance object to a float variable totalDistance.
    This assignment triggers the implicit type conversion because of the conversion
    operator defined in the Distance class. The totalDistance variable will hold the
    total distance in feet.


    Next, we demonstrate explicit type conversion using the static_cast operator.
    We convert the float value totalDistance to an int value intDistance by using
    static_cast<int>(totalDistance). This explicit conversion allows us to truncate
    the fractional part and obtain the integer distance in feet.


    Finally, we print the total distance and the integer distance to the console.


    Implicit type conversion happens automatically by the compiler when it detects
    a compatible type. In this case, the Distance object is implicitly converted to
    a float using the conversion operator.


    Explicit type conversion, also known as type casting, is performed manually using
    type casting operators like static_cast. It allows the programmer to specify a
    specific conversion between types, which may involve losing precision or changing
    the representation.


    Note that the conversion operator in the example is a member function of the Distance
    class, and it returns the converted value. The conversion operator is specified
    using the operator keyword followed by the target type (float in this case).


