    the ternary operator to check whether the number is even or odd. If the condition
    (number % 2 == 0) evaluates to true, the string “even” is assigned to the result
    variable; otherwise, the string “odd” is assigned. Finally, the result is printed
    to the console.


    The conditional operator, also known as the ternary operator (? :), provides a
