  trans: "\n\n## 3. 灵活性与兼容性\n异常规范限制了代码的灵活性和演进。如果函数的异常规范发生变化，所有该函数的调用者也需要相应更新。这种紧耦合阻碍了在不破坏现有代码的情况下对异常处理进行修改的能力。相反，C++\
    \ 强调使用动态异常规范和运行时检查，从而提供了更大的灵活性兼容性。\n\nC++ 建议使用 `try-catch` 块等异常处理机制，而不是异常规范，并在新标准中引入了更具表达力的特性。现代\
    \ C++ 鼓励使用异常处理的最佳实践，例如捕获特定异常类型、使用 `RAII`（资源获取初始化）进行资源管理以及提供有意义的异常信息。\n\n总结来说，由于缺乏强制执行、意外后果以及对代码灵活性和兼容性的影响，异常规范在\
    \ C++ 中已被弃用。建议使用 `try-catch` 块等异常处理机制并遵循现代异常处理实践。\n\n# 在 switch 语句中使用枚举类 (Enum\
    \ Classes)\n\n这是一个在 switch 语句中使用 `enum class` 的 C++ 程序示例：\n\n```cpp\n#include\
    \ <iostream>\n\nenum class DayOfWeek {\n    Monday,\n    Tuesday,\n    Wednesday,\n\
    \    Thursday,\n    Friday,\n    Saturday,\n    Sunday\n};\n\nvoid printDay(DayOfWeek\
    \ day) {\n    switch (day) {\n        case DayOfWeek::Monday:\n            std::cout\
    \ << \"It's Monday!\" << std::endl;\n            break;\n        case DayOfWeek::Tuesday:\n\
    \            std::cout << \"It's Tuesday!\" << std::endl;\n            break;\n\
    \        case DayOfWeek::Wednesday:\n            std::cout << \"It's Wednesday!\"\
    \ << std::endl;\n            break;\n        case DayOfWeek::Thursday:\n     \
    \       std::cout << \"It's Thursday!\" << std::endl;\n            break;\n  \
    \      case DayOfWeek::Friday:\n            std::cout << \"It's Friday!\" << std::endl;\n\
    \            break;\n        case DayOfWeek::Saturday:\n            std::cout\
    \ << \"It's Saturday!\" << std::endl;\n            break;\n        case DayOfWeek::Sunday:\n\
    \            std::cout << \"It's Sunday!\" << std::endl;\n            break;\n\
    \        default:\n            std::cout << \"Invalid day.\" << std::endl;\n \
    \           break;\n    }\n}\n\nint main() {\n    DayOfWeek today = DayOfWeek::Tuesday;\n\
    \    printDay(today);\n    return 0;\n}\n```\n\n在该程序中，我们定义了一个名为 `DayOfWeek` 的\
    \ `enum class`，它包含七个代表每周每一日的可能值。`printDay` 函数接收一个 `DayOfWeek` 参数并使用 `switch` 语句根据提供的日期打印相应的消息。\n\
    \n现在，让我们讨论 `enum classes` 的类型安全优势：\n\n1. **作用域命名 (Scoped Naming)**：`enum classes`\
    \ 引入了作用域命名机制，这意味着枚举成员（例如 `Monday`, `Tuesday`）是枚举类型的一部分。在上面的示例中，`DayOfWeek::Monday`\
    \ 指 `DayOfWeek` 枚举中的 `Monday` 成员。这防止了命名冲突并提高了代码清晰度。\n2. **强类型 (Strong Typing)**：`enum\
    \ classes` 提供了强类型，意味着枚举成员有自己独特的类型。在示例中，`DayOfWeek::Monday` 的类型是 `DayOfWeek`，而不是像传统枚举那样仅仅是整数。这防止了与无关枚举值或整数的意外赋值或比较，增强了类型安全。\n\
    3. **编译时检查 (Compile-Time Checks)**：`enum classes` 允许编译器执行额外的编译时检查。在 `switch` 语句中使用\
    \ `enum class` 时，编译器可以检测缺失或重复的 case 标签，并相应生成警告或错误。这有助于在开发过程早期发现潜在的逻辑错误。\n4. **显式转换\
    \ (Explicit Conversion)**：`enum classes` 要求显式转换为整数类型，从而对枚举值的使用方式提供了更好的控制。在示例中，在没有显式类型转换的情况下，无法直接将整数值赋值给\
    \ `DayOfWeek` 变量，这降低了意外赋值的风险并增强了类型安全。\n\n总的来说，在 switch 语句和整个库中使用 `enum classes`\
    \ 通过提供更强的类型、更好的作用域、编译时检查和显式转换，提供了更高的类型安全性。这些优势有助于编写出更健壮、更不容易出错的代码。\n\n# 使用带初始化器的\
    \ if (If with Initializer)\n\n这是一个演示在 C++ 中使用带初始化器的 `if` 语句的程序示例：\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n    if (int x = 5; x > 0) {\n        std::cout\
    \ << \"positive.\" << std::endl;\n    } else {\n        std::cout << \"non-positive.\"\
    \ << std::endl;\n    }\n    return 0;\n}\n```\n\n在该程序中，`if` 语句包含一个初始化器 `int x\
    \ = 5`。你可能想要使用带初始化器的 `if` 语句有几个原因：\n\n1. **有限的作用域**：在初始化器中声明的变量仅在 `if` 语句内可见。它不会污染周围的作用域，有助于避免与其他变量的命名冲突。\n\
    2. **原地初始化**：通过将初始化和条件结合在一个处，你可以保持相关代码在一起，使其更容易阅读。\n3. **避免意外使用未初始化的变量**：在 `if`\
    \ 语句内部初始化变量可以确保它在使用时具有有效值。这在简单场景下特别有用。\n\n需要注意的是，此功能仅在 C++17 中。如果你在使用旧版本的编译器，可能需要使用替代方法。\n\
    \n# 使用带初始化器的 switch (Switch with Initializer)\n\n这是一个演示在 C++ 中使用带初始化器的 `switch`\
    \ 语句的程序示例：\n\n```cpp\n#include <iostream>\n\nint main() {\n    int choice = 2;\n\
    \    switch (int i = choice) {\n        case 1:\n            std::cout << \"You\
    \ chose 1.\" << std::endl;\n            break;\n        case 2:\n            std::cout\
    \ << \"You chose 2.\" << std::endl;\n            break;\n        case 3:\n   \
    \         std::cout << \"You chose 3.\" << std::endl;\n            break;\n  \
    \      default:\n            std::cout << \"Invalid option.\" << std::endl;\n\
    \            break;\n    }\n    return 0;\n}\n```\n\n在该代码中，我们使用了 C++17 `switch`\
    \ 语句的初始化器功能。变量 `i` 在 `switch` 语句内部声明并用 `choice` 的值进行初始化。\n\n"
