    \ (+)、减法 (-)、乘法 (*)、除法 (/) 和取模 (%)。\n2. 关系运算符：这些运算符用于比较两个操作数。它们包括等于 (==)、不等于 (!=)、大于\
    \ (>)、小于 (<)、大于等于 (>=) 和小于等于 (<=)。\n3. 逻辑运算符：用于逻辑运算，这些包括逻辑与 (&&)、逻辑或 (||) 和逻辑非\
    \ (!)。\n4. 位运算符：位运算符对整数的二进制表示进行操作。它们包括位与 (&)、位或 (|)、位异异 (^)、位取反 (~)、左移 (<<) 和右移\
    \ (>>)。\n\n"
