- fmt: "\nIt is going to be a long and possibly overwhelming journey for some. I did\
    \ my very best trying to assemble examples for the most important concepts of\
    \ this fundamental programming language. I originally planned this collection\
    \ to be just a few volumes, but considering the amount of detail I wanted to go\
    \ into for each individual concept, it ended up being a bit extensive.\n\nI will,\
    \ therefore, do my best to make these materials accessible to the readers in volumes\
    \ sorted by the simplicity of the fields that are being discussed, as well as\
    \ how fundamental they are for you to grasp the language.\n\nIf you are just starting\
    \ with `C++, the book you are currently reading is probably the right place for\
    \ you. Here we will cover the most important concepts for beginners, although\
    \ some more advanced information can also be found here. I will, for this reason,\
    \ advise you not to take a linear strategy of learning when using this book series.\
    \ Of course, as always, the best way to learn the material is by practicing programming\
    \ on your compiler. In this book, as well as the rest of the books in this series,\
    \ you will find tons of programming examples that will (hopefully) be able to\
    \ guide you on your way to becoming an independent `C++` programmer.\n\nRemember,\
    \ nobody will ever know everything there is to know about programming, and that\
