    \ the innermost loop, which is the nested loop in this case. However, if you have\
    \ multiple levels of nested loops and want to skip to a specific outer loop, you\
    \ would need to label the outer loop and use that label with the `continue` statement.\n\
    \nWhen the condition `j == 2` is met, the program will print the message indicating\
