    and the program prints an error message. Without exception handling, the program
    would terminate abruptly when encountering such an error.


    By using exceptions, we can gracefully handle errors, provide informative error
    messages, and take appropriate actions to recover from exceptional conditions,
    ensuring the program’s stability and reliability.


