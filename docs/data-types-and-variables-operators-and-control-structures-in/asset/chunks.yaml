    # Bitwise Operators


    Here’s an example program in C++ that demonstrates the use of bitwise operators
    and explains how they operate on binary representations of integers:


    #include <iostream>


    using namespace std;


    void displayBinary(unsigned int num) {


        if (num > 1) {


            displayBinary(num / 2);


        }


        cout << num % 2;


    }


    int main() {


        unsigned int a = 10; // Binary representation: 1010


        unsigned int b = 5;  // Binary representation: 0101


        // Bitwise AND


        unsigned int resultAnd = a & b;


        cout << "Bitwise AND: ";


        displayBinary(resultAnd);


        cout << endl;


        // Bitwise OR


        unsigned int resultOr = a | b;


        cout << "Bitwise OR: ";


        displayBinary(resultOr);


        cout << endl;


        // Bitwise XOR


        unsigned int resultXor = a ^ b;


        cout << "Bitwise XOR: ";


        displayBinary(resultXor);


        cout << endl;


        // Bitwise NOT


        unsigned int resultNotA = ~a;


        cout << "Bitwise NOT of a: ";


        displayBinary(resultNotA);


        cout << endl;


        unsigned int resultNotB = ~b;


        cout << "Bitwise NOT of b: ";


        displayBinary(resultNotB);


        cout << endl;


        // Left shift


        unsigned int resultLeftShift = a << 2;


        cout << "Left shift of a by 2: ";


        displayBinary(resultLeftShift);


        cout << endl;


        // Right shift


        unsigned int resultRightShift = a >> 2;


        cout << "Right shift of a by 2: ";


        displayBinary(resultRightShift);


        cout << endl;


        return 0;


    }


    Explanation:


    *   The program uses two unsigned integers, a and b, to perform bitwise operations.


    *   The displayBinary function is a recursive function that displays the binary
    representation of a number.


    *   Bitwise AND (&) compares the corresponding bits of a and b. It sets each bit
    of the result to 1 if both bits are 1; otherwise, it sets the bit to 0.


    *   Bitwise OR (|) compares the corresponding bits of a and b. It sets each bit
    of the result to 1 if either of the bits is 1; otherwise, it sets the bit to 0.


    *   Bitwise XOR (^) compares the corresponding bits of a and b. It sets each bit
    of the result to 1 if the bits are different; otherwise, it sets the bit to 0.


    *   Bitwise NOT (~) flips the bits of the operand. It changes each 1 to 0 and
    each 0 to 1.


    *   Left shift (<<) shifts the bits of the left operand (a) to the left by the
    number of positions specified by the right operand. The vacant positions are filled
    with zeros.


    *   Right shift (>>) shifts the bits of the left operand (a) to the right by the
    number of positions specified by the right operand. The vacant positions are filled
    depending on the type of shift (logical or arithmetic).


    When you run the program, it will display the binary representations of the results
    obtained from the bitwise operations on a and b.


    Note: The program assumes a 32-bit unsigned integer. The number of bits may vary
    depending on the system you are using.


    # Comma Operator


    Here’s an example program that demonstrates the use of the comma operator in C++:


    #include <iostream>


    int main() {


        int x = 5, y = 10, z = 15;


        int result = (x += 2, y += 3, z += 4);  // comma operator used here


        std::cout << "x: " << x << std::endl;


        std::cout << "y: " << y << std::endl;


        std::cout << "z: " << z << std::endl;


        std::cout << "result: " << result << std::endl;


        return 0;


    }


    In this program, we have three variables x, y, and z, each initialized with different
    values. We use the comma operator in the line:


    int result = (x += 2, y += 3, z += 4);


    The comma operator allows us to combine multiple expressions into a single expression.
    In this case, we have three expressions separated by commas within the parentheses.
    Each expression is evaluated from left to right, and the result of the rightmost
    expression is assigned to the variable result.


    The sequence point introduced by the comma operator ensures that all the expressions
    separated by commas are evaluated in a defined order. In this example, the expressions
    (x += 2), (y += 3), and (z += 4) are evaluated in that order. The comma operator
    guarantees that the side effects (such as the increment of x, y, and z) of each
    expression are applied before the next expression is evaluated.


    After executing the program, the output will be:


    x: 7


    y: 13


    z: 19


    result: 19


    As you can see, the values of x, y, and z have been incremented by the respective
    amounts specified in the expressions within the comma operator. The final value
    of result is the value of the rightmost expression (z += 4), which is 19 in this
    case.


    It’s worth noting that the comma operator is not commonly used in everyday programming
    and is typically seen in specific cases where it provides concise or efficient
    code.


    # Increment and Decrement Operators


    Here’s an example program in C++ that demonstrates the use of increment and decrement
    operators, along with the difference between prefix and postfix versions:


    #include <iostream>


    int main() {


        int num = 5;


        // Prefix increment


        int result1 = ++num;


        std::cout << "Prefix increment: " << result1 << std::endl; // Output: 6


        // Postfix increment


        int result2 = num++;


        std::cout << "Postfix increment: " << result2 << std::endl; // Output: 6 (num
    is now 7)


        // Prefix decrement


        int result3 = --num;


        std::cout << "Prefix decrement: " << result3 << std::endl; // Output: 6 (num
    is now 6)


        // Postfix decrement


        int result4 = num--;


        std::cout << "Postfix decrement: " << result4 << std::endl; // Output: 6 (num
    is now 5)


        return 0;


    }


    In this program, we have an integer variable num initialized with the value 5\.
    We then demonstrate the use of both prefix and postfix increment and decrement
    operators.


    Prefix increment (++num) and decrement (—num) operators are applied to the variable
    before its value is used in an expression. In other words, the value is incremented
    or decremented first and then used. For example, in the line int result1 = ++num;,
    the value of num is incremented to 6 before it is assigned to result1\. Similarly,
    in the line int result3 = —num;, the value of num is decremented to 6 before it
    is assigned to result3.


    Postfix increment (num++) and decrement (num—) operators are applied to the variable
    after its value is used in an expression. In other words, the value is used first
    and then incremented or decremented. For example, in the line int result2 = num++;,
    the current value of num (5) is assigned to result2, and then num is incremented
    to 6\. Similarly, in the line int result4 = num—;, the current value of num (6)
    is assigned to result4, and then num is decremented to 5.'
