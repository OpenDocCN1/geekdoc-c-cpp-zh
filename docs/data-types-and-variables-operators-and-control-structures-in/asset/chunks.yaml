    and handle the exception. This process is called “unwinding the stack.” The exception
    is propagated through the call stack until a suitable catch block is found.


    In the example program, the main function calls divide(10, 0), which throws an
    exception due to division by zero. The program then enters the catch block and
    prints an error message.


    Exceptions provide several advantages over traditional error-handling mechanisms:


    1.  Separation of Error Handling Code: Exceptions allow you to separate error
    handling code from normal program logic. You can focus on writing the main logic
    of your program and handle exceptional cases separately.


    2.  Error Propagation: Exceptions can be propagated through multiple levels of
    function calls automatically. You don’t have to explicitly check for errors at
    each intermediate level; you can let the exception propagate until an appropriate
    handler is found.


    3.  Stack Unwinding: When an exception occurs, the stack is unwound, and local
    objects’ destructors are called, ensuring proper cleanup of resources.


    4.  Flexible Error Handling: Exceptions can be caught and handled at various levels
    of the program. You can have multiple catch blocks to handle different types of
    exceptions or handle exceptions differently based on the context.


    It’s important to note that when throwing exceptions, it’s crucial to provide
    relevant and informative error messages to aid in debugging and troubleshooting.


    # Custom Exceptions


    Here’s an example of a C++ program that defines and throws a custom exception:


    #include <iostream>


    #include <exception>


    class MyException : public std::exception {


    public:


        virtual const char* what() const noexcept {


            return "Custom Exception: Something went wrong!";


        }


    };


    int main() {


        try {


            throw MyException();


        }


        catch (const std::exception& e) {


            std::cout << e.what() << std::endl;


        }


        return 0;


    }


    In this program, we define a custom exception called MyException, which is derived
    from the standard std::exception class. The MyException class overrides the what()
    function to provide a custom error message.


    In the main() function, we throw an instance of MyException using the throw keyword.
    The catch block then catches the exception and prints the error message using
    the what() function.


    Now, let’s discuss the benefits of using custom exceptions:


    1.  Improved Error Handling: Custom exceptions allow you to define and throw specific
    exceptions that accurately represent the nature of the error or exceptional condition
    that occurred in your program. This helps in better error handling and allows
    you to provide meaningful error messages to users or developers who encounter
    those exceptions.


    2.  Modularity and Code Organization: By creating custom exceptions, you can encapsulate
    error-related logic within specific exception classes. This promotes modularity
    and improves code organization since different exceptions can be defined for different
    error scenarios, making it easier to understand and maintain your codebase.


    3.  Selective Exception Handling: Custom exceptions enable selective exception
    handling. By catching specific custom exceptions, you can choose to handle them
    differently based on your program’s requirements. For example, you might want
    to perform different actions or display different error messages based on the
    type of exception thrown.


    4.  Better Error Reporting: Custom exceptions can carry additional information
    beyond just an error message. You can add member variables and methods to your
    custom exception classes to provide more details about the error, such as error
    codes, timestamps, or relevant data. This additional information can aid in troubleshooting
    and debugging when exceptions occur.


    5.  Integration with Existing Exception Hierarchy: By deriving custom exceptions
    from the standard exception classes, like std::exception, you can integrate them
    seamlessly into the existing exception hierarchy. This allows you to handle both
    standard and custom exceptions using a common exception handling mechanism.


    Overall, using custom exceptions in C++ provides flexibility, better error handling,
    and improved code organization, making your programs more robust and maintainable.


    # The Finally Block


    In C++, there is no built-in “finally” block like in some other programming languages.
    However, you can achieve similar behavior using a combination of try-catch blocks
    and the RAII (Resource Acquisition Is Initialization) principle.


    The RAII principle states that resource acquisition and release should be tied
    to the lifetime of an object. This principle can be leveraged to ensure that certain
    code runs regardless of whether an exception is thrown or not. Here’s an example:


    #include <iostream>


    class FinallyBlockExample {


    public:


        FinallyBlockExample() {


            // Resource acquisition


            std::cout << "Acquiring resource" << std::endl;


        }


        ~FinallyBlockExample() {


            // Resource release


            std::cout << "Releasing resource" << std::endl;


        }


    };


    void someFunction() {


        FinallyBlockExample example;  // Resource acquired here


        try {


            // Code that may throw an exception


            throw std::runtime_error("Some error occurred");


        } catch (const std::exception& e) {


            // Exception handling


            std::cout << "Exception caught: " << e.what() << std::endl;


        }


        // The instance of FinallyBlockExample will be destructed here,


        // ensuring the "Release resource" code runs regardless of exception


    }


    int main() {


        someFunction();


        return 0;


    }


    In this example, the FinallyBlockExample class is used to acquire and release
    a resource. The constructor is responsible for acquiring the resource, and the
    destructor is responsible for releasing it. Within the someFunction function,
    a FinallyBlockExample object is created, acquiring the resource. If an exception
    is thrown within the try block, it is caught and handled in the catch block. However,
    after the catch block, the FinallyBlockExample object goes out of scope and its
    destructor is automatically called, ensuring the resource is released even if
    an exception occurs.


    This approach allows you to achieve similar functionality to a “finally” block,
    where code that needs to run regardless of exceptions can be placed in the destructor
    of an object.


    The use of a “finally” block or its equivalent can be beneficial in situations
    where you need to perform cleanup or release resources, such as closing files,
    releasing memory, or releasing locks. By encapsulating the resource acquisition
    and release within an object’s lifetime, you ensure that the cleanup code is executed
    regardless of any exceptions that may be thrown.


    Note that the RAII approach with destructors is not limited to handling exceptions;
    it also provides a convenient and deterministic way of managing resources in general,
    making code more robust and less prone to resource leaks.


    # Early Function Return


    Here’s an example program in C++ that demonstrates the use of an early return
    in a function:


    #include <iostream>


    bool isPositive(int num) {


        if (num > 0) {


            return true;  // Early return if num is positive


        }


        // If num is not positive, no need to check further'
