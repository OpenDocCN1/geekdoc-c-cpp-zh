    \ of `i` and `j`.\n4. After each iteration, the control variables are updated\
    \ using the update expressions (`i++` and `j--`), incrementing `i` by 1 and decrementing\
    \ `j` by 1.\n5. The loop continues until the loop condition evaluates to false,\
    \ at which point the program exits the loop and continues with the rest of the\
    \ code.\n\nNow let’s discuss the use cases for having multiple control variables\
    \ in a loop:\n\n1. **Simultaneous iteration**: Sometimes, you may need to iterate\
    \ over multiple sequences or arrays. Having multiple control variables allows\
