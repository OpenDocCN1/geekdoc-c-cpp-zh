    code, and the catch block is used to catch and handle any exceptions that occur.


    Exceptions provide a mechanism for handling errors and exceptional situations
    in a program. Instead of checking for errors at every step, which can clutter
    the code and make it harder to read, we can use exceptions to handle errors in
    a centralized and structured manner.


    When an exceptional condition occurs, such as a runtime error or an invalid input,
    an exception can be thrown. This interrupts the normal flow of the program and
    transfers control to the nearest enclosing try block that can handle the exception.
    The catch block then catches the thrown exception and executes the code within
    it.


    Exception handling allows us to separate the error handling logic from the regular
    program flow, making the code more readable and maintainable. It also enables
    us to handle different types of exceptions differently by using multiple catch
    blocks, each responsible for a specific type of exception.


