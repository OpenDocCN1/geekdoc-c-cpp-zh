    Functor objects are often used in situations where you need to store function-like
    behavior as data. They can be passed as arguments to other functions, stored in
    containers, or used as predicates in algorithms that expect callable objects.
    The advantage of using functors over regular function pointers is that functors
    can store state information and have internal member variables.


    Overloading the function call operator allows you to create flexible and powerful
    objects that can be invoked as if they were functions, providing a concise and
    expressive way to represent complex behavior.


    # Overloading the Inequality Operator


    In C++, overloading the inequality operator (!=) allows you to define custom comparison
    logic for objects of a class. To demonstrate this, let’s create a simple class
    called Person that represents a person with a name and age. We will overload both
    the equality and inequality operators for this class.


    #include <iostream>


    #include <string>


    class Person {


    private:


        std::string name;


        int age;


    public:


        Person(const std::string& name, int age)


            : name(name), age(age) {}


        bool operator==(const Person& other) const {


            return name == other.name && age == other.age;


        }


        bool operator!=(const Person& other) const {


            return !(*this == other);


        }


    };


    int main() {


        Person p1("Alice", 25);


        Person p2("Bob", 30);


        Person p3("Alice", 25);


        if (p1 == p2) {


            std::cout << "p1 and p2 are equal." << std::endl;


        } else {


            std::cout << "p1 and p2 are not equal." << std::endl;


        }


        if (p1 != p3) {


            std::cout << "p1 and p3 are not equal." << std::endl;


        } else {


            std::cout << "p1 and p3 are equal." << std::endl;


        }


        return 0;


    }


    In the Person class, we have defined the operator== and operator!= functions.
    The operator== compares the name and age of two Person objects to determine if
    they are equal. The operator!= simply negates the result of operator== by using
    the ! (logical NOT) operator.


    In the main() function, we create three Person objects: p1, p2, and p3\. We then
    use the overloaded operators to compare these objects. If p1 is equal to p2, we
    print that they are equal. Otherwise, we print that they are not equal. Similarly,
    we compare p1 and p3 using the != operator to check if they are not equal.


    By overloading both the equality and inequality operators, we provide a convenient
    way to compare objects of our custom class. The inequality operator complements
    the equality operator by allowing us to check if two objects are not equal, providing
    a more comprehensive comparison capability.


    # Overloading Type Conversion Operators


    Let’s start by creating a custom class called MyClass and then proceed to overload
    the type conversion operators.


    #include <iostream>


    class MyClass {


    private:


        int value;


    public:


        MyClass(int val) : value(val) {}


        // Overloading the conversion operator for int type


        operator int() const {


            return value;


        }


        // Overloading the conversion operator for double type


        operator double() const {


            return static_cast<double>(value);


        }


    };


    int main() {


        MyClass obj(42);


        // Implicit conversion to int


        int intValue = obj;


        std::cout << "intValue: " << intValue << std::endl;


        // Implicit conversion to double


        double doubleValue = obj;


        std::cout << "doubleValue: " << doubleValue << std::endl;


        return 0;


    }


    In this example, we have a class MyClass with a single private member value of
    type int. We then proceed to overload the type conversion operators for int and
    double types.


    The conversion operators are member functions of the class MyClass that do not
    take any arguments. They are declared with the operator keyword followed by the
    desired type to convert to. Inside the conversion operator, we simply return the
    appropriate value after performing any necessary conversions.


    In the main() function, we create an instance of MyClass called obj with a value
    of 42\. We can then use implicit conversions to convert obj to int and double
    by assigning it to variables of those types.


    The output of the program will be:


    intValue: 42


    doubleValue: 42.0


    By overloading the type conversion operators, we allow for intuitive conversions
    between our custom class and built-in types. This allows objects of our class
    to be used in the same way as built-in types, making the code more readable and
    easier to use.


    # Pointers and Address Operator


    Here’s an example program in C++ that demonstrates the use of pointers and the
    address operator:


    #include <iostream>


    int main() {


        int num = 10;  // Declare an integer variable


        // Declare a pointer and assign the memory address of the variable ''num''
    to it


        int* ptr = &num;


        // Print the value and memory address of the variable ''num''


        std::cout << "Value of num: " << num << std::endl;


        std::cout << "Memory address of num: " << &num << std::endl;


        // Print the value and memory address using the pointer


        std::cout << "Value pointed by ptr: " << *ptr << std::endl;


        std::cout << "Memory address stored in ptr: " << ptr << std::endl;


        return 0;


    }


    In this program, we have an integer variable named num which is assigned a value
    of 10\. Then, we declare a pointer ptr of type int*. The & operator is used to
    get the memory address of the num variable, and we assign that address to the
    pointer ptr using the assignment operator =.


    To print the value and memory address of the num variable, we use the std::cout
    statement along with the << operator. To print the memory address stored in the
    pointer ptr, we simply use ptr. To access the value pointed by the pointer, we
    use the * operator before the pointer name (*ptr).


    When you run this program, you’ll see the output displaying the value and memory
    address of num, as well as the value pointed by the pointer and the memory address
    stored in the pointer. The memory address of the variable num and the memory address
    stored in the pointer ptr will be the same.


    Getting the memory address of a variable is done by using the address operator
    & followed by the variable name. In the example, &num retrieves the memory address
    of the variable num, and ptr stores that address.


    # Pointers and Indirection Operator


    Here’s an example program that demonstrates the use of pointers and the indirection
    operator in C++:


    #include <iostream>


    int main() {


        int num = 10;   // an integer variable


        int *ptr;       // a pointer variable


        ptr = &num;     // storing the address of num in ptr


        // Accessing the value at a certain memory address using the indirection operator


        std::cout << "Value at memory address " << ptr << ": " << *ptr << std::endl;


        return 0;


    }


    In this program, we have an integer variable num initialized to 10 and a pointer
    variable ptr. The ptr variable is declared as a pointer to an integer using the
    asterisk (*) symbol.


    To access the value at a certain memory address, we assign the address of num
    to the pointer ptr using the address-of operator (&). This operation is called
    “taking the address of num.”


    In the std::cout statement, we use the indirection operator (also known as the
    dereference operator), denoted by the asterisk (*), to access the value stored
    at the memory address pointed to by ptr. By dereferencing ptr with *ptr, we can
    obtain the value stored at that address.


    When the program runs, it will output the memory address of num and the value
    stored at that address.


    Note: The memory address printed may be represented in hexadecimal format.


