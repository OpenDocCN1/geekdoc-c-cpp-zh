  raw: 'In this program, the user is prompted to enter a number between 1 and 3\.
    The switch statement is used to evaluate the value of choice and execute the corresponding
    code block based on the chosen option. If the entered value matches one of the
    case labels, the corresponding code block is executed. Otherwise, the code inside
    the default case is executed.


    Now, let’s discuss when to use switch statements over if-else chains. Switch statements
    are useful in the following scenarios:


    1.  Multiple options: When you have multiple options to compare against a single
    expression, a switch statement can be more concise and readable compared to a
    long chain of if-else statements. It allows you to group related cases together
    and make the code easier to understand.


    2.  Constant expressions: Switch statements work well with constant expressions.
    The cases in a switch statement are typically evaluated at compile time, making
    it more efficient than evaluating if-else conditions at runtime. If you have a
    fixed set of possible values, a switch statement can be a better choice.


    3.  Testing a single variable: Switch statements are designed to test a single
    variable against different values. If you have a single variable that you need
    to check against multiple cases, a switch statement provides a clearer and more
    structured approach.


    However, there are situations where if-else chains are more appropriate:


    1.  Range of values: If you need to check for a range of values or complex conditions,
    if-else chains offer more flexibility. Switch statements can only evaluate equality
    against a single variable, while if-else conditions can handle a wider range of
    conditions.


    2.  Non-integer values: Switch statements in C++ can only be used with integral
    types (like integers and characters) or enumerations. If you need to test conditions
    involving floating-point numbers, strings, or other non-integer types, if-else
    chains are the way to go.


    3.  Multiple conditions: If you have multiple conditions that need to be evaluated
    in combination, if-else chains provide a more flexible approach. You can use logical
    operators (&&, ||) to combine conditions and express complex logic.


    In summary, switch statements are suitable when you have a single variable to
    compare against multiple constant values, while if-else chains are more flexible
    when dealing with complex conditions, ranges of values, or non-integer types.


    # Nested Switch Statement


    Here’s an example program in C++ that demonstrates the use of nested switch statements:


    #include <iostream>


    int main() {


        int outerChoice, innerChoice;


        std::cout << "Enter outer choice: ";


        std::cin >> outerChoice;


        switch (outerChoice) {


            case 1:


                std::cout << "Outer choice 1 selected.\n";


                std::cout << "Enter inner choice: ";


                std::cin >> innerChoice;


                switch (innerChoice) {


                    case 1:


                        std::cout << "Inner choice 1 selected.\n";


                        break;


                    case 2:


                        std::cout << "Inner choice 2 selected.\n";


                        break;


                    default:


                        std::cout << "Invalid inner choice.\n";


                }


                break;


            case 2:


                std::cout << "Outer choice 2 selected.\n";


                break;


            default:


                std::cout << "Invalid outer choice.\n";


        }


        return 0;


    }


    In this program, we have an outer switch statement that selects different actions
    based on the value of the outerChoice variable. Inside the case 1 of the outer
    switch, there is a nested switch statement that further selects actions based
    on the value of the innerChoice variable.


    Nested switch statements introduce additional complexity to the code. As the number
    of nested switches increases, the code becomes harder to read, understand, and
    maintain. It can lead to increased code duplication and reduced code modularity.


    However, nested switch statements can be useful in certain scenarios. They can
    be helpful when dealing with complex and hierarchical decision structures, where
    multiple choices need to be made based on different variables or conditions. In
    such cases, nested switches can provide a structured and organized way to handle
    the decision-making process.


    It’s important to note that in many cases, using nested switch statements can
    be avoided by using alternative control structures such as if-else statements,
    loops, or function calls. These alternatives often provide more flexibility and
    clarity in code implementation. Therefore, nested switch statements should be
    used judiciously and only when they provide a clear and concise solution to the
    problem at hand.


    # For Loop


    Here’s an example program in C++ that uses a for loop:


    #include <iostream>


    int main() {


        // Using a for loop to iterate a known number of times


        for (int i = 0; i < 5; i++) {


            std::cout << "Iteration " << i + 1 << std::endl;


        }


        return 0;


    }


    The structure of a for loop in C++ can be broken down into three parts: initialization,
    condition, and update. Here’s the general syntax:


    for (initialization; condition; update) {


        // Code to be executed in each iteration


    }


    Let’s break down the parts:


    1.  Initialization: This is where you initialize a loop control variable (usually
    an integer) before the loop starts. In the example above, int i = 0 initializes
    the loop control variable i to 0.


    2.  Condition: The condition is evaluated at the beginning of each iteration.
    If the condition is true, the loop body is executed. If it’s false, the loop terminates,
    and the program continues with the next statement after the loop. In the example,
    the condition is i < 5, which means the loop will execute as long as i is less
    than 5.


    3.  Update: The update statement is executed at the end of each iteration, just
    before the condition is checked again. It allows you to modify the loop control
    variable. In the example, i++ increments the value of i by 1 after each iteration.


    In the program above, the for loop iterates five times because the condition i
    < 5 is true for values of i from 0 to 4\. Inside the loop body, the statement
    std::cout << “Iteration " << i + 1 << std::endl; prints the current iteration
    number. The output will be:


    Iteration 1


    Iteration 2


    Iteration 3


    Iteration 4


    Iteration 5


    After the fifth iteration, the condition i < 5 becomes false, and the loop terminates.
    Finally, the program exits by returning 0 from the main function.


    For loops are commonly used when you know the number of iterations in advance,
    such as iterating over elements in an array, performing a fixed number of calculations,
    or repeating a task a known number of times.


    # While Loop


    Here’s an example of a C++ program that uses a while loop:


    #include <iostream>


    int main() {


        int count = 0;


        while (count < 5) {


            std::cout << "Count: " << count << std::endl;


            count++;


        }


        return 0;


    }


    In this program, we have a while loop that will execute the code block as long
    as the condition count < 5 is true. The initial value of count is 0.


    Let’s discuss the structure and use of while loops in C++:


    1.  Structure:


    *   The while loop starts with the keyword while followed by a condition inside
    parentheses.


    *   The condition is evaluated before each iteration of the loop. If the condition
    is true, the code block inside the loop is executed. If the condition is false,
    the loop is exited, and program control continues with the next statement after
    the loop.


    *   The code block is defined by enclosing statements within curly braces {}.


    1.  Execution:


    *   When the program reaches the while loop, it checks the condition.


    *   If the condition is true, the code block is executed.


    *   After executing the code block, the program returns to the beginning of the
    while loop and checks the condition again.


    *   This process continues until the condition becomes false.'
