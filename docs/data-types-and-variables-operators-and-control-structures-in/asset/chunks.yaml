    \n# 重载下标运算符\n\n在 C++ 中，你可以重载下标运算符 `[]` 为用户定义类型提供类似数组的访问。这允许你使用熟悉的索引语法来访问自定义类对象的元素。以下是一个如何重载下标运算符的示例：\n\
