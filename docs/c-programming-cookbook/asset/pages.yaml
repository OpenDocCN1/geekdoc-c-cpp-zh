  md: '# Recipe 8: Avoid Deadlocks


    # Situation


    A deadlock could occur in our program because of the number of threads that use
    common data structures or input/output devices. Consider two threads, one of which
    needs resources A and B in order to continue, and the other of which needs resources
    B and A in order to continue. It is possible for threads to become stuck waiting
    for each other forever if they lock the first resource before trying to lock the
    second.


    # Practical Solution


    Multithreaded programs including our application rely on avoiding deadlocks to
    keep running smoothly and responsive. When many threads cannot move forward because
    they are all waiting for the other thread to release a resource that they require,
    this situation is called a deadlock. Your application''s performance and reliability
    could take a major hit in this scenario. Developers working with concurrent systems
    must possess the ability to recognize possible deadlocks and implement techniques
    to prevent them.'
  merge: -1
  img_proc: true
