  md: '# Defining Abstract Class


    An abstract class in C++ is created by declaring at least one function as a pure
    virtual function, which is denoted by = 0 at the end of its declaration. Such
    a class cannot be instantiated directly but can be used as a base class for other
    classes that implement the pure virtual functions.


    ```

