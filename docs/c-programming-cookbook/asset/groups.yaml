    \        std::cout << comments[i] << std::endl; // Direct access\n    }\n\n  \
    \  // Using range-based for loop for iteration\n    for (const auto& comment :\
    \ comments) {\n```\n\n## 方案 3：使用 list 和 forward_list\n\n### 情境\n\n在某些场景中，你可能需要从元素序列中的任意位置进行高效插入和删除，而由于\
