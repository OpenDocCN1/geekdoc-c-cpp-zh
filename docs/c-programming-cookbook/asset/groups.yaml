  mdcn: "\nC++ 的多态能力，使我们能够使用单一函数名和多种参数类型来定义多种行为。最后，在函数中使用 auto 关键字展示了向类型推断的转变，这简化了代码语法，同时提高了可维护性和可读性。\n\
    \n本章的一个重要目标是向你介绍 C++20 中的高级函数方法，以提高代码效率、可读性和可复用性。我们在本章学到的技能将使我们能够构建更具表现力、更动态且类型安全的\
    \ C++ 应用程序；这将赋予我们应对最困难编程问题的信心。\n\n## 第 3 章：面向对象编程实战\n\n### 引言\n\n本章的目标是让你深入理解使用\
