    \nA lambda expression in C++ can be thought of as a concise way to write an inline\
    \ function that can be used for short snippets of code that are not going to be\
    \ reused elsewhere. It's particularly useful for passing as an argument to functions,\
    \ especially those that take function pointers or functors, like many of the standard\
