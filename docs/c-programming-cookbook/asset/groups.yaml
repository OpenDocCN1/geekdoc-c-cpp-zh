    # Reference Counting


    std::shared_ptr uses reference counting to keep track of how many shared_ptr instances
    own the same object. This count is incremented when a new shared_ptr is copied
    from another that owns the object and decremented when a shared_ptr is destroyed
    or reset.


    # Cyclic References


    One potential pitfall of std::shared_ptr is the possibility of cyclic references,
    where two or more objects owned by std::shared_ptr instances refer to each other,
    preventing their destruction. To break such cycles, std::weak_ptr can be used
    for back-references or in situations where an owning relationship is not required.


    # Benefits


    Automatic Resource Management: Ensures proper resource cleanup, reducing the risk
    of memory leaks.


    Shared Ownership Semantics: Facilitates scenarios where objects need to be accessed
    by multiple parts of a program without strict ownership hierarchy.


    Thread Safety: Operations on std::shared_ptr itself (copying, assignment, destruction)
    are thread-safe with respect to other operations on the same std::shared_ptr object.'
