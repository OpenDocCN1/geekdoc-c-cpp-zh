    \n到本章结束时，你将学会如何在 C++ 中运用 OOP 原则来创建健壮、可维护且高效的应用程序。通过贴近实际的示例和解决方案，你将准备好借助面向对象设计和\
    \ C++20 能力的力量来面对现实世界中的编程难题。\n\n### 配方 1：使用类与对象的基础知识\n\n**场景**\n\n类和对象是面向对象编程（OOP）的构建块，它使你能够将数据和行为划分为更小、更易管理的部分。为了构建组织良好、可扩展且高效的应用程序，了解如何创建和使用类和对象至关重要。绕过过程式编程，并站在软件中现实世界实体及其交互的角度思考，需要这一关键步骤。\n\
    \n**实用解决方案**\n\n作为学习 C++20 面向对象编程的第一步，让我们为应用程序创建一个简单的类。为了开始在 GiforGits 系统中表示用户，我们可以创建一个\
    \ User 类，用于存储有关用户及其操作的所有详细信息。\n\n```cpp\n#include <iostream>\n#include <string>\n\
    \nclass User {\nprivate:\n    std::string name;\n    int id;\n\npublic:\n    //\
