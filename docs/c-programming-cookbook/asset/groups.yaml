    \ of `std::shared_ptr` is its ability to share ownership of an object. This shared\
    \ ownership ensures that the object remains alive as long as there is at least\
    \ one `std::shared_ptr` instance pointing to it. The memory is deallocated when\
    \ the reference count drops to zero, which happens when the last `shared_ptr`\
    \ pointing to the object is destroyed or assigned a new object.\n\n### Creating\
    \ and Using std::shared_ptr\n\nA `std::shared_ptr` can be created using the `std::make_shared`\
    \ function, which allocates the object and returns a `std::shared_ptr` that owns\
    \ it. `std::make_shared` is preferred over direct use of the `std::shared_ptr`\
    \ constructor because it performs a single allocation for both the object and\
    \ its control block, improving performance.\n\n```cpp\n#include <iostream>\n#include\
    \ <memory>\n\nclass Widget {\npublic:\n    Widget() { std::cout << \"Widget constructed\\\
    n\"; }\n    ~Widget() { std::cout << \"Widget destroyed\\n\"; }\n    void display()\
    \ const { std::cout << \"Displaying Widget\\n\"; }\n};\n\nvoid processWidgets(std::shared_ptr<Widget>\
    \ widget) {\n    widget->display();\n    // The widget is not destroyed here,\
    \ as the ownership is shared\n}\n\nint main() {\n    auto widget = std::make_shared<Widget>();\n\
    \    processWidgets(widget);\n    // Widget is destroyed automatically when the\
    \ last shared_ptr (widget)\n    // is out of scope\n    return 0;\n}\n```\n\n\
    ### Reference Counting\n\n`std::shared_ptr` uses reference counting to keep track\
    \ of how many `shared_ptr` instances own the same object. This count is incremented\
    \ when a new `shared_ptr` is copied from another that owns the object and decremented\
    \ when a `shared_ptr` is destroyed or reset.\n\n### Cyclic References\n\nOne potential\
    \ pitfall of `std::shared_ptr` is the possibility of cyclic references, where\
    \ two or more objects owned by `std::shared_ptr` instances refer to each other,\
    \ preventing their destruction. To break such cycles, `std::weak_ptr` can be used\
    \ for back-references or in situations where an owning relationship is not required.\n\
    \n### Benefits\n\n- **Automatic Resource Management:** Ensures proper resource\
