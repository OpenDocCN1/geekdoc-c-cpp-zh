    out as a paradigm that combines data (attributes) and methods (functions) that
    operate on the data into a single unit known as a class, while restricting access
    to certain of the object''s components. Not only is it about encapsulating data
    and the functions that process it, but it''s also about protecting an object''s
    internal state from outside interference. Encapsulation in C++ is accomplished
    using the available access modifiers: private, protected, and public. To promote
    data integrity and minimize the danger of unexpected behavior, they allow us specify
    the scope and visibility of class members, which ensures that sensitive data remains
    concealed from outside access.


