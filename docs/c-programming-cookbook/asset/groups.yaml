    \nfriend void displayUserInfo(const User& user);\n\n// Declaring a friend class\n\
    \nfriend class UserLogger;\n\npublic:\n\nUser(std::string userName, int userId)\
    \ : name(userName), id(userId) {}\n\n};\n\n// Friend function definition\n\nvoid\
    \ displayUserInfo(const User& user) {\n\n    std::cout << \"User Name: \" << user.name\
    \ << \", User ID: \" << user.id\n    << std::endl;\n\n}\n\n// Friend class method\
    \ definition\n\nvoid UserLogger::logUserInfo(const User& user) {\n\n    std::cout\
    \ << \"[LOG] User Name: \" << user.name << \", User ID: \" <<\n    user.id <<\
    \ std::endl;\n\n}\n\nint main() {\n\n    User alice(\"Alice\", 1);\n\n    displayUserInfo(alice);\
    \ // Direct access to private members of User\n\n    UserLogger::logUserInfo(alice);\
    \ // Access through a friend class\n\n    return 0;\n\n}\n```\n\n在上述给定示例程序中，displayUserInfo\
    \ 是一个非成员函数，已通过 friend 关键字获得对 User 类私有成员的访问权限，从而允许它读取私有数据并显示用户信息。类似地，UserLogger\
    \ 是一个友元类，它有一个静态方法，也可以访问 User 的私有数据。这个设置展示了友元函数和类如何与一个类紧密交互，同时保持其成员对程序其余部分的封装。\n\
    \n### 关键要点\n\n友元函数和类是特定场景下的强大工具，在这些场景中，直接访问类的私有或受保护成员是合理的。请少量且审慎地使用这些特性，因为它们可能损害封装，并通过在类或函数之间创建紧密耦合而使代码维护更具挑战性。\n"
