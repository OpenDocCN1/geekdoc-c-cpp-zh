    # Recipe 8: Perform Cache-Friendly C++ Coding


    # Situation


    When writing high-performance C++, optimizing code for cache utilization is essential.
    Caches in modern CPUs are multi-tiered and much quicker than main memory access.
    By minimizing the frequency of cache misses—which happen when computation-related
    data is not present in the cache and must be retrieved from slower memory—efficient
    cache utilization can significantly boost application performance. In this recipe,
    we will look at ways to make C++ code that is cache-friendly by reducing cache
    misses and making data local as much as possible.


    # Practical Solution


    # Understanding Cache Usage


    A CPU cache stores a small amount of memory close to the processor to speed up
    the access to frequently used data.


    The principle of locality is:'
  - '[PAGE 375]


    Temporal Locality: The tendency of a processor to access the same memory locations
    repeatedly over a short period.


    Spatial Locality: The tendency of a processor to access memory locations that
    are close to those it has recently accessed.


    # Strategies for Cache-Friendly Code


    Data Structure Alignment and Padding: Ensure that data structures are aligned
    to cache line boundaries and consider padding them to avoid false sharing in multithreading
    scenarios. False sharing occurs when multiple threads modify variables that, although
    independent, reside on the same cache line, leading to unnecessary cache invalidation
    and reduced performance.


    Sequential Memory Access: Access memory sequentially rather than randomly. Sequential
    access patterns are more predictable and allow the prefetching mechanisms of modern
    CPUs to load data into cache proactively.


    Minimize Memory Footprint: Use compact data structures and minimize the size of
    hot data. Smaller data structures that fit within a cache line are accessed more
    quickly, reducing cache misses.


    Loop Nesting and Iteration Order: Consider the memory layout of multi-dimensional
    arrays or data structures when nesting loops. Access data in an order that corresponds
    to its layout in memory to improve spatial locality.'
