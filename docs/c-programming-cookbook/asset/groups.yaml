    return userCount;\n\n}\n\nvoid displayUserInfo() const {\n\nstd::cout << \"User\
    \ Name: \" << name << std::endl;\n\n}\n```\n\n在上述给定代码片段中，userCount 是 User 类的静态成员变量，初始化为\
    \ 0。每次创建 User 对象时，构造函数会将其递增；每次销毁 User 对象时，析构函数会将其递减。静态方法 getUserCount 提供对该计数的访问，而不需要类的实例\n\
    \n### 理解静态成员\n\n静态成员变量：由类的所有实例共享。它们适合表示该类所有对象共有的数据。\n\n静态方法：无需类的实例即可调用。它们只能访问静态成员或其他静态方法。\n\
    \n静态成员和方法通过类名和作用域解析运算符访问，如所示。这强调了这些成员属于类本身，而不是类的任何实例。在你需要维护全局状态或在“GitforGits”应用中提供与类相关的实用工具时，这种能力非常宝贵。\n\
    \n## 配方 8：创建友元函数和友元类\n\n### 情境\n\n有时应用需要向外部函数或类授予访问另一个类的私有和受保护成员的权限。在这种情况下，了解友元函数和友元类如何工作至关重要。使用这些\
    \ C++ 特性，受信任的非成员函数或类可以以受控方式突破封装限制，访问类的私有和受保护区域。通过谨慎使用这些特性，你可以执行需要访问类内部结构的操作，而无需将其公开。\n\
    \n### 实用解决方案\n\n### 理解静态成员\n\nC++ 中类的静态成员由该类的所有实例共享。它们属于类本身，而不是任何对象实例，并且无需创建类的实例即可访问。静态成员适合存储类范围的信息，静态方法只能访问静态成员。\n\
    \n### 实现友元函数和友元类\n\n```cpp\n#include\n\n#include\n\nclass User;\n\nclass UserLogger\
    \ {\n\npublic:\n\nstatic void logUserInfo(const User& user);\n\n};\n\nclass User\
