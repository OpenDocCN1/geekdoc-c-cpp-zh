    \ 0; i < indent.level; ++i) os.put(' ');\n        return os;\n    }\n};\n```\n\
    \n#### Usage\n\n```cpp\nstd::cout << Indenter(4) << \"Indented Text\\n\";\n```\n\
    \nThe above sample program showcases how to create a custom manipulator Indenter\
    \ that adds indentation to the output, enhancing readability, especially for hierarchical\
