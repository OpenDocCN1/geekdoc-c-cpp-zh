    # Recipe 3: Using std::shared_ptr


    # Situation


    std::shared_ptr is a type of smart pointer provided by the C++ Standard Library
    that manages a dynamically allocated object through a shared ownership model.
    Multiple std::shared_ptr instances can own the same object, and the managed object
    is destroyed automatically once the last shared_ptr owning it is destroyed or
    reset. This feature makes std::shared_ptr ideal for use cases in our application
    where objects are accessed by multiple owners or parts of the program.


    # Shared Ownership


    The fundamental characteristic of std::shared_ptr is its ability to share ownership
    of an object. This shared ownership ensures that the object remains alive as long
    as there is at least one std::shared_ptr instance pointing to it. The memory is
    deallocated when the reference count drops to zero, which happens when the last
    shared_ptr pointing to the object is destroyed or assigned a new object.


    # Creating and Using std::shared_ptr'
