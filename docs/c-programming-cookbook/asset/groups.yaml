    // Function declaration\nvoid greetUser();\n\nint main() {\n    greetUser();\n\
    \    return 0;\n}\n\n// Function definition\nvoid greetUser() {\n    std::cout\
    \ << \"Welcome to GitforGits!\" << std::endl;\n}\n```\n\n这个 greetUser 函数在被调用时会打印一条问候消息。void\
    \ 返回类型表示它不返回值。\n\n### 函数重载\n\n函数重载允许多个函数具有相同的名称但不同的参数（参数类型或数量不同）。它使函数能够对不同数据类型执行类似操作。\n\
    \n```cpp\n#include <iostream>\n#include <string>\n\n// Overloaded functions\n\
    void display(int i) {\n    std::cout << \"Displaying int: \" << i << std::endl;\n\
    }\n\nvoid display(double d) {\n    std::cout << \"Displaying double: \" << d <<\
    \ std::endl;\n}\n\nvoid display(std::string s) {\n    std::cout << \"Displaying\
    \ string: \" << s << std::endl;\n}\n\nint main() {\n    display(10); // Calls\
    \ display(int)\n    display(10.5); // Calls display(double)\n    display(\"GitforGits\"\
    ); // Calls display(std::string)\n    return 0;\n}\n```\n\n在上面的代码片段中，display 函数被重载以处理\
    \ int、double 和 std::string 类型，展示了多态性。\n\n### 默认参数\n\n函数中的默认参数允许你用比函数定义所接受的更少的参数来调用函数。对于任何被省略的参数，将使用默认值。\n\
    \n```cpp\n#include <iostream>\n#include <string>\n\n// Function with default argument\n\
    void logMessage(std::string message = \"Default log message\") {\n    std::cout\
    \ << message << std::endl;\n}\n\nint main() {\n    logMessage(\"Welcome to GitforGits!\"\
    ); // Uses provided argument\n    logMessage(); // Uses default argument\n   \
    \ return 0;\n}\n```\n\n这个函数既可以用自定义消息调用，也可以不带任何参数调用，在后一种情况下会使用默认消息。此特性增强了函数的灵活性，并简化了常见用例的调用。\n\
    \n### 融入“Welcome to GitforGits!”程序\n\n我们不妨用一个显示当前版本的函数来更新我们的“Welcome to GitforGits!”软件？我们可以使用重载来接受数字或文本版本标识符，而对于典型情况，可以使用默认参数：\n\
    \n```cpp\n#include <iostream>\n#include <string>\n\n// Function declarations\n\
    void displayVersion(int version);\nvoid displayVersion(std::string versionDetail);\n\
    void greetUser(std::string name = \"Guest\");\n\nint main() {\n    displayVersion(20);\
    \ // Display numerical version\n    displayVersion(\"Version 20.0 - Stable\");\
    \ // Display version detail\n    greetUser(); // Greet a guest user\n    greetUser(\"\
    Alice\"); // Greet a specific user\n    return 0;\n}\n\n// Display version number\n\
    void displayVersion(int version) {\n    std::cout << \"GitforGits C++ Version:\
    \ \" << version << std::endl;\n}\n\n// Display version detail\nvoid displayVersion(std::string\
    \ versionDetail) {\n    std::cout << \"GitforGits \" << versionDetail << std::endl;\n\
    }\n\n// Greet user with optional name\nvoid greetUser(std::string name) {\n  \
    \  std::cout << \"Welcome to GitforGits, \" << name << \"!\" << std::endl;\n}\n\
    ```\n\n在这个增强版本中，displayVersion 被重载以接受整数或字符串，从而实现灵活的显示选项。此外，greetUser 包含一个默认参数，使其在可能未提供用户姓名的情况下也能灵活适用。\n\
    \n本配方涵盖了构建和使用函数的原理、重载实现多态的强大能力，以及默认参数为函数调用带来灵活性的便利。随着我们扩展“Welcome to GitforGits!”示例，这些\
    \ C++ 编程的基本原则将使我们能够轻松处理日益复杂的逻辑和功能。\n\n## 配方 6：命名空间与预处理器\n\n### 情境\n\n随着“Welcome\
    \ to GitforGits!”应用程序变得越来越复杂，组织代码对于确保清晰性并避免命名冲突变得越来越重要。命名空间和预处理器指令正是在这里发挥作用。命名空间允许你将逻辑相关的实体（例如函数和类）分组到一个命名作用域下，从而防止命名冲突。另一方面，预处理器指令提供了一种包含文件、定义宏以及有条件地编译程序部分内容等方法。理解这些概念对于管理大型代码库以及让代码更具模块化和可维护性至关重要。\n\
    \n### 实用解决方案\n\n### 使用命名空间\n\n命名空间通过将标识符包含在命名作用域中来防止命名冲突。例如，std 命名空间包含所有标准 C++\
    \ 库名称。要为“Welcome to GitforGits!”项目创建并使用你自己的命名空间，可以采用以下方法：\n\n```cpp\n#include\
    \ <iostream>\n\nnamespace gitforgits {\n    void greet() {\n        std::cout\
    \ << \"Welcome to GitforGits!\" << std::endl;\n    }\n\n    // Further functions\
    \ and classes related to GitforGits can be added here\n}\n\nint main() {\n   \
    \ // Accessing the greet function within the gitforgits namespace\n    gitforgits::greet();\n\
    \    return 0;\n}\n```\n\n使用命名空间，我们将 greet 函数封装在自己的自定义作用域内。这种方法可防止与其他库或程序其他部分发生潜在的命名冲突。\n\
    \n### 探索预处理器指令\n\n预处理器指令是代码中包含的行，它们不属于 C++ 语言本身，而是给预处理器的指令。这些指令可以包含头文件、定义常量或有条件地编译部分代码。\n\
    \n- **包含头文件**：`#include` 指令用于将文件内容包含到程序中。这通常用于包含标准库头文件或你自己的用于类定义的头文件。\n- **定义宏**：`#define`\
    \ 指令允许你定义宏，宏是赋予名称的代码片段。当代码中使用该名称时，它会被替换为相应的代码片段。\n- **条件编译**：`#if` 和 `#else` 指令让你有条件地编译部分代码。这对于调试或为不同平台编译代码很有用。\n\
    \n"
