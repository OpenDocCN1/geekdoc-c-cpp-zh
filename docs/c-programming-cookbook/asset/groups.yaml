    \ 等方法可控制 vector 的大小和容量。\n\n以下是使用 vector 实现动态数组的示例程序：\n\n```cpp\n#include <iostream>\n\
    #include <vector>\n#include <string>\n\nint main() {\n\n    std::vector<std::string>\
    \ comments;\n\n    // Adding comments to the vector\n    comments.push_back(\"\
    Initial commit\");\n    comments.push_back(\"Implemented login feature\");\n \
    \   comments.push_back(\"Fixed bugs reported by users\");\n\n    // Accessing\
