    \ User 对象。为此，我们可以使用静态方法来处理静态数据或执行对类很重要的操作。\n\n### 实用解决方案\n\n类中的静态成员和方法由该类的所有实例共享，作用于类级别而非实例级别。C++\
    \ 面向对象编程的这一特性特别适用于以下场景：你希望在一类的所有对象之间一致地维护某份数据，或无需必然拥有该类实例即可调用功能。在我们的应用上下文中，静态成员可用于跟踪全局状态或\n\
    \n```cpp\npublic:\n\nUser(std::string userName) : name(userName) {\n\nuserCount++;\
