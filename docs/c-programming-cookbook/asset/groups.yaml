    \ id << std::endl;\n    }\n};\n\nint main() {\n    // Creating an object of the\
    \ User class\n    User user1(\"Alice\", 1);\n    // Calling a method of the object\n\
    \    user1.displayUserInfo();\n    return 0;\n}\n```\n\n在上述代码片段中，User 类封装了两个私有数据成员：name\
    \ 和 id，分别表示用户的姓名和标识号。它包含一个用于初始化这些成员的构造函数，以及一个用于打印用户信息的公共方法 displayUserInfo。这种基本结构展示了类和对象如何协同工作：类充当蓝图，而对象是带有实际数据的蓝图实例。\n\
    \n这种方法不仅使代码更易管理、更易理解，还为利用继承、多态和封装等更高级的 OOP 特性奠定了基础。\n\n### 配方 2：应用构造函数和析构函数\n\n\
