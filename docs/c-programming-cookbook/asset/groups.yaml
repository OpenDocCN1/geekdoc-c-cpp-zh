    # ## Recipe 4: Using std::weak_ptr


    # ## Situation


    std::weak_ptr is a smart pointer provided by the C++ Standard Library that complements
    std::shared_ptr by holding a non-owning ("weak") reference to an object that is
    managed by. This mechanism is crucial for breaking cyclic dependencies among shared
    objects, which can lead to memory leaks since the reference count never reaches
    zero. Understanding how to use std::weak_ptr effectively is essential for managing
    complex relationships in applications like our application without compromising
    memory management.


    # ## Breaking Cycles with std::weak_ptr


    std::weak_ptr is designed to break cyclic references. When two or more objects
    refer to each other with they keep each other alive indefinitely, creating a memory
    leak. std::weak_ptr allows one side of the relationship to be a weak link, not
    contributing to the reference count, thereby allowing objects to be destroyed
    properly.


