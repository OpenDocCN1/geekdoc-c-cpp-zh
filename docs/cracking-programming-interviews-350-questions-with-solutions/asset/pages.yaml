  md: '# ### 6.1. Compute Next Higher Number


    Compute the previous lower number of a given integer using the same digits.


    Let the input integer sequence be:


    $\{1,\ 2,\ 4,\ 2,\ 3,\ 5\}$


    Here $n = 6$. We observe the following property for index $i = 2$:


    +   1. $a[2] = 4 < 2 = a[3]$, i.e., $a[i] < a[i + 1]$.


    +   2. $2, 3, 5$ is a non-decreasing sequence, i.e., $a[i + 1..n - 1]$ is non-decreasing.


    +   3. $3$ is the value of the sequence $2, 3, 5$ which is immediately smaller
    than $4$ such that the next value $5$ is greater than (or equal to) $4$. Let us
    denote this index as $j(4)$, i.e., $a[j] = 3$ and $a[j + 1..n - 1] \geq a[j]$.


    +   4. Hence the next permutation can be achieved by swapping $a[i]$ with $a[j]$
    $\Longrightarrow$ $1, 2, 3, 2, 4, 5$ is a lower permutation than the original
    sequence.


    +   5. Please note that $2, 4, 5$ is a non-decreasing sequence. Hence the previous
    lower permutation can be achieved by reversing this part to look like $5, 4, 2$.


    +   6. Hence the previous lower permutation is


    $\{1,\ 2,\ 3,\ 5,\ 4,\ 2\}$


    So, the process to achieve the previous lower permutation can be summarized as
    below:


    +   1. Compute an index $i$, $0 \leq i < n$ such that $a[i + 1..n - 1]$ is a non-decreasing
    sequence and $a[i] < a[i + 1]$.


    +   2. Compute an index $j$, $i < j < n$ such that $a[j] < a[i]$ and $a[j + 1..n
    - 1] \geq a[i]$.


    +   3. Swap $a[i]$ and $a[j]$. Now $a[i + 1..n - 1]$ is a non-decreasing sequence.


    +   4. Reverse $a[j + 1..n - 1]$ to make it a decreasing sequence hence to bring
    the just previous higher one.'
