- pgno: 245
  md: '# Algorithm 65 Maximum sub-array sum using prefix array


    ```

    ```text

    1: function MAXSUBARRAY(a[0..n − 1])

    2:     minprefixsum ← 0

    3:     currmaxsum ← 0

    4:     prefix[0] ← 0

    5:     for i ← 0, n − 1 do

    6:         prefix[i] ← prefix[i − 1] + a[i]

    7:         cand ← prefix[i] − minprefixsum

    8:         currmaxsum ← max(currmaxsum, cand)

    9:         minprefixsum ← min(minprefixsum, prefix[i])

    10:    end for

    11:    return max_so_far

    12: end function

    ```

    ```


    Based on the above algorithm, we can easily extend it to find K-maximum subarray
    in one dimensional case. Instead of having a single variable that safeguards the
    minimum prefix sum, we maintain a list of K minimum prefix sums, sorted in non-decreasing
    order. The merged list of two sorted sequences x and y are denoted by merge(x,
    y).


    # Algorithm 66 K-Maximum sub-array sum using prefix array


    ```

    ```text

    1: function KMAXSUBARRAY(a[0..n − 1])

    2:     for k ← 1, K do

    3:         min[k] ← −∞

    4:         M[k] ← −∞

    5:     end for

    6:     sum[0] ← 0

    7:     min[1] ← 0

    8:     M[1] ← 0

    9:     for i ← 1, n do

    10:        sum[i] ← sum[i − 1] + a[i]

    11:        for k ← 1, K do

    12:            cand[k] ← sum[i] − min[k]

    13:        end for

    14:        M ← K largest elements of merge(M, cand)

    15:        insert sum[i] into min

    16:    end for

    17: end function

    ```

    ```


    As we need to perform n iterations, the total time complexity is O(Kn). When K
    = 1, result is comparable to O(n) time of Kadane’s algorithm and prefix array.'
