- pgno: 148
  md: 'The post office opens at \(t_0\).


    Customer \(i\) arrives at moment \(a[i]\) and requests a service of \(b[i]\) time
    units. Customers are served in the order of their arrival.


    The desk officers are never idle when a customer is waiting for service, the post
    office closes as soon as all \(n\) customers have been served.


    Write a program to compute the total amount of time during which at least one
    customer is waiting for service.


    # Solution


    It is requested to compute \(r\), where \(r\) is the total amount of time during
    which at least one customer is waiting for service.


    One of the few openings to the solution of this problem seems to be to study how
    \(r\) functionally depends on the traits of the individual customers. Thus we
    are led to define, \(\forall i: 0 \leq i < n\), \(s_i\) as the moment at which
    the service of customer \(i\) begins, in terms of which we can grasp the wait
    in the occasion of customer \(i\) by the length of the interval \((a[i], s_i)\).


    If the \(n\) intervals defined like this are colored black on a time axis which
    is white to begin with, then we agree, assuming that black plus black gives black,
    that the value of \(r\) to be computed is the total length of whatever looks black.


    i.e., \(r\) is the length of the superposition of the intervals \((a[i], s_i)\):
    \(0 \leq i < n\).


    We observe two properties of the numbers \(s_i\):


    \(0 \leq i < n: a[i] \leq s_i\)


    \(s_0 \leq s_1 \leq \cdots \leq s_{n-1}\)


    The first one stems from the thought that a customer’s service cannot start before
    its arrival, and the second one from the rule that customers are served in the
    order of their arrival.


    Now let us think towards the computation of the \(s\)-sequence.


    We imagine that, upon its arrival, a customer \(i\) finds the residues of what
    could have happened in the past: a chaotic variety of possibilities, like a not
    yet opened post office or zero, more or even four desks occupied or a perhaps
    empty queue or combinations of these.


    What matters about the earlier customers \(j: 0 \leq j < i\) is their departure
    times: these entirely describe the changing occupancy of the four desks. More
    specifically, even, as inspired from \(s_0 \leq s_1 \leq \cdots \leq s_{n-1}\),
    the only aspect determinative of the moment \(s_i\) is the fourth largest departure
    time among those earlier customers; this describes the earliest instant at which
    a desk is available to customer \(i\).


    Thus we are led to define, \(\forall i: 4 \leq i < n\),'
  merge: -1
