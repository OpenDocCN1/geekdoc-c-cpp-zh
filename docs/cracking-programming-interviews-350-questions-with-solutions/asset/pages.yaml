    # **Question 207**　 default template parameters


    Review the program.


    ```

    1 template<class T1, class T2 = int> class A;

    2 template<class T1 = int, class T2> class A;

    ```


    # Solution of Question 207


    The set of default template-arguments available for use with a template declaration
    or definition is obtained by merging the default arguments from the definition
    (if in scope) and all declarations in scope in the same way default function arguments
    are.

    Hence the program is equivalent to


    ```

