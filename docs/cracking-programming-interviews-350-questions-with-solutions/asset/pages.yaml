    # Invariant


    Looking at the precondition and postcondition, it is not that difficult to figure
    out that during the execution of the algorithm, x is guaranteed to be confined
    within some rectangular region of a, i.e.,


    $$0 \le i \le p \le m-1 \;\&\&$$

    $$0 \le q \le j \le n-1 \;\&\&$$

    $$x \in a[i..p,q..j]$$


    In simple words, the invariant implies that


