    # ### Problem Description


    Imagine two rooms with no visibility between them. In one room there are n numbered
    light switches \(s_1, s_2, \ldots, s_n\). In the other room there are n numbered
    light bulbs \(l_1, l_2, \ldots, l_n\). It is known that each switch turns on and
    off to exactly one bulb but we do not know anything about the wiring between the
    switches and the bulbs. Initially we are in the room with the switches. Our job
    is to tell the exact wiring, i.e. which switch operates which bulb. We are allowed
    to press any switches and then go to the room with the bulbs and perform an observation.
    We are not allowed to touch the bulbs : our only source of information is the
    observation of the bulbs.


    The switches are such that their physical appearance does not change when toggled
    so we have no way of knowing beforehand whether pressing a certain switch leads
    to turning on or turning off of a bulb. Every switch has, of course, two states
    only, as any normal light switch.


    Describe an algorithm that discovers the wiring with minimum number of observations,
    i.e. with minimum visits to the room with the bulbs. The algorithm should work
    iteratively, at each iteration simulating toggling some switches and then simulating
    an observation by calling some function Observe. The toggling is simulated by
