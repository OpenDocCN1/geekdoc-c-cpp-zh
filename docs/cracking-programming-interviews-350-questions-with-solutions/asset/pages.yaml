- pgno: 348
  md: '# Solution of Question 16


    Yes.


    A template parameter be used in the declaration of subsequent template parameters
    and their default arguments.


    For example,


    ```

    1 template<typename T1, T1* ptr , typename T2 = T1>

    2 struct A {};

    3

    4 template<typename T> void alloc_memory(T* ptr = new T);

    ```


    Please note that a template parameter can be used also in the specification of
    base classes, like


    ```

    1 template<typename T>

    2 struct Base {};

    3

    4 template<typename T>

    5 struct Derived : Base<T> { };

    6

    7 template<typename T>

    8 struct A : T { };

    ```


    The use of a template parameter as a base class implies that a class used as a
    template argument must be defined and not just declared when the class template
    is instantiated.


