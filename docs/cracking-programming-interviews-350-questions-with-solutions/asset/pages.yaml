    \ +$$\n$$\\ldots$$\n\n$$prefix[k - 1] - prefix[k - 2] +$$\n$$prefix[k] - prefix[k\
    \ - 1]$$\n\n$$=$$\n\n$$prefix[k] - prefix[l - 1]$$\n\nHence the sum of a[l..k]\
    \ to be equal to zero, we should have\n\n$$prefix[k] = prefix[l - 1]$$\n\nHence\
    \ the sum closest to zero can be found by locating the two closest elements in\
    \ prefixa.\n\nLet us formalize the above algorithm as follows:\n\n+   1. Compute\
    \ prefix array with index of original array as well, so it is a collection of\
    \ pair(value, index). $O(n)$\n\n+   2. Sort the above prefix array by value. $O(n\\\
    log n)$\n\n+   3. Compute pair-wise diff by value. Prepare absolute values to\
    \ get a measure of how far/close these are to zero. $O(n)$\n\n+   4. The closest\
