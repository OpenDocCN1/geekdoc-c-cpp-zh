    # # 1.21 Switch Bulb Problem


    # ## Problem Description


    There are three switches outside a room that control three electrical bulbs inside
    the room. They each hang on a long wire so you have to be careful not to bump
    into them when you enter the room! You know that there is a one-to-one connection
    between the switches and the bulbs. Each switch controls precisely one bulb. You
    also know that the switches are in the off position and the room is dark. Now
    we shut the door and you can''t see anything inside the room.


    Your task is to figure out which switch connects to which bulb, but you face a
    rather imposing constraint: you only get to make one trial. You can set the switches
    any way you like and then you have to enter the room. You can examine the room
    and based on this examination you have to be able to tell us which switch controls
    which bulb. Note that you''re not allowed to go back out and touch any of the
    switches again after you''ve entered the room. You can do anything you like with
    the switches, but once you open the door to the room, that''s it.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Solution


    At first you might think that this is an impossible problem! After all, if you
    don’t touch any of the switches, then it would be pointless to enter the room,
    since you already know it is dark in the room and there will be no way to figure
    out which switch goes with which bulb. So you have to do something with the switches.
    But what?


    If you flip only one switch to the *on* position and then open the door, certainly
    one of the bulbs will be lit, but you won’t be able to distinguish which of the
    two remaining switches goes with which of the two remaining bulbs.


    Similarly, if you flip some pair of switches to the *on* position, you’ll know
    from the light that remains unlit which switch it corresponds with, but you won’t
    be able to differentiate between the two bulbs that are lit and the two switches
    that you flipped. What a dilemma.


    The crux of the issue here is to *start with the right model*. The preceding thinking
    relies on a model that captures only one attribute of light bulbs, namely whether
    they are *on* or *off*. But light bulbs have other attributes. Like what?


    *How about temperature?*


    There was nothing in the description above that restricted our attention just
    to the illumination of the bulb. In fact, that’s really only part of your becoming
    illuminated about the problem.


    Once we include the bulbs’ temperatures in our model, the problem really is quite
    easy to solve. All you have to do is


    +   1. set two switches to the *on* position,

    +   2. wait a few minutes, then

    +   3. switch one of these to the *off* position and

    +   4. enter the room.


    When you do, one of the bulbs will be *on*, and the other two will be *off*. One
    of those two unlit bulbs, however, is going to be *hot* and that does make it
    very easy to give the proper answer. But watch your fingers and don’t get burned!


