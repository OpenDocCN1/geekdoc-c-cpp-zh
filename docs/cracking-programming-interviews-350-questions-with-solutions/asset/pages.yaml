  md: '# Problem


    Repeat the previous problem with the additional restriction that the elements
    smaller than *b* should precede elements equal to *b* which themselves should
    precede elements greater than *b*.


    # Solution


    We need three boundaries to divide our segment into four parts.


    +   1. The first part contains elements smaller than *b*

    +   2. the second part contains only elements equal to *b*

    +   3. the third part may contain anything, and

    +   4. the fourth part contains only elements greater than *b*.


    Please note that we can get a more symmetric solution using a *fourth* boundary.


    At each step we consider the left element of the third part (just to the right
    of the second boundary).


    # Algorithm 58 Re-arranging an array revisited


    ```

    ```text

    1: function REARRANGE-ARRAY(a[1..n], b)

    2:     l ← 0

    3:     m ← 0

    4:     r ← n

    5:     Invariant : a[1..l] < b; a[l + 1..m] = b; a[r + 1..n] > b

    6:     while m ≠ r do

    7:         if a[m + 1] == b then

    8:             m ← m + 1

    9:         else if a[m + 1] > b then

    10:            swap(a[m + 1], a[r])

    11:            r ← r − 1

    12:        else

    13:            swap(a[m + 1], a[l + 1])

    14:            l ← l + 1

    15:            m ← m + 1

    16:        end if

    17:    end while

    18: end function

    ```

    ```'
