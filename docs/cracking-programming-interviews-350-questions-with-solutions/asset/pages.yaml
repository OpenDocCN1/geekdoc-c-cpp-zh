  md: '# Solution of Question 171


    The array has the same lifetime as any other temporary object, except that initializing
    an `initializer_list` object from the array extends the lifetime of the array
    exactly like binding a reference to a temporary.


    +   - For v1 and v2, the `initializer_list` object is a parameter in a function
    call, so the array created for `{ 1, 2, 3 }` has full-expression lifetime.

    +   - For i3, the `initializer_list` object is a variable, so the array persists
    for the lifetime of the variable.

    +   - For i4, the `initializer_list` object is initialized in a constructor’s
    initializer, so the array persists only until the constructor exits, and so any
