  md: "# Algorithm 63. Kadane’s 1D Algorithm\n\n```\n```text\n1: function KADANE1D(start,\
    \ end)\n2:     max_so_far ← 0\n3:     max_ending_here ← 0\n4:     while start\
    \ ≠ end do\n5:         max_ending_here ← max(max_ending_here + *start, 0)\n6:\
    \         max_so_far ← max(max_so_far, max_ending_here)\n7:         start ← start\
    \ + 1\n8:     end while\n9:     return max_so_far\n10: end function\n```\n```\n\
    \n# C++11 Implementation\n\nProgram 4.4: Implementing Kadane’s Algorithm\n\n```\n\
    ```cpp\n#include <algorithm>\n\ntemplate <typename ForwardIterator>\ntypename\
    \ std::iterator_traits<\n    ForwardIterator>::value_type\nkadane1d(ForwardIterator\
    \ start,\n         ForwardIterator end)\n{\n    typedef typename std::iterator_traits<\n\
    \        ForwardIterator\n    >::value_type value_type;\n\n    value_type max_so_far\
    \ = 0,\n               max_ending_here = 0;\n\n    while (start != end)\n    {\n\
    \        max_ending_here =\n            std::max(max_ending_here + *start++,\n\
    \                     0);\n        max_so_far =\n            std::max(max_so_far,\
    \ max_ending_here);\n    }\n    return max_so_far;\n}\n```\n```\n\n# Usage\n\n\
    Program 4.5: Implementing Kadane’s Algorithm\n\n```\n```cpp\n#include <iostream>\n\
    #include <array>\n#include <vector>\n#include <forward_list>\n#include \"kadane1d.hpp\"\
    \n```\n```"
