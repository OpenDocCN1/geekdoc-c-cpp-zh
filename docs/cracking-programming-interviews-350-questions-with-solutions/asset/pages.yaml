    **Algorithm 79** Weighted Median

    1: function WEIGHTED-MEDIAN(A)

    2:   k ← 1

    3:   s ← 0

    4:   while s + w_k < 1/2 do

    5:     s ← s + w_k

    6:     k ← k + 1

    7:   end while

    8:   return x_k

    9: end function

    ```


    The loop invariant of this algorithm is that \(s\) is the sum of the weights of
    all elements less than \(x_k\):


    \[

    s = \sum_{x_i < x_k} w_i

    \]


    We prove this is true by induction. The base case is true because in the first
    iteration \(s = 0\). Since the list is sorted, for all \(i < k\), \(x_i < x_k\).
    By induction, \(s\) is correct because in every iteration through the loop \(s\)
    increases by the weight of the next element.


    The loop is guaranteed to terminate because the sum of the weights of all elements
    is 1. We prove that when the loop terminates \(x_k\) is the weighted median using
    the definition of weighted median.


    Let \(s''\) be the value of \(s\) at the start of the next to last iteration of
    the loop: \(s = s'' + w_{k-1}\). Since the next to last iteration did not meet
    the termination condition, we know


    \[

    s'' + w_{k-1} < \frac{1}{2}

    \]


    \[

    \sum_{x_i < x_k} w_i = s < \frac{1}{2}

    \]


    Note that if the loop has zero iterations this is still true since \(s = 0 < \frac{1}{2}\).
    This proves the first condition for being a weighted median. Next we prove the
    second condition. The sum of the weights of elements greater than \(x_k\) is


    \[

    \sum_{x_i > x_k} w_i = 1 - \left( \sum_{x_i < x_k} w_i \right) - w_k = 1 - s -
    w_k

    \]


    By the loop termination condition,


    \[

    \begin{aligned}

    \sum_{x_i < x_k} w_i &= s \le \frac{1}{2} - w_k \n-s &\ge -\frac{1}{2} + w_k \n1
    - s - w_k &\le \frac{1}{2} \n\sum_{x_i > x_k} w_i &\le \frac{1}{2}

    \end{aligned}

    \]'
