    +   - p.e = 1 if x is on the clockwise side of e,

    +   - p.e = 0 if x is on e, and

    +   - p.e = −1 if x is on the counterclockwise side of e.


    To begin with, we give an algorithm that is linear in the number of vertices of
    u. With e in the domain of the clockwise directed boundary lines of u, we have
    on account of u''s convexity


    +   - in.u ≡ e : p.e = 1

    +   - on.u ≡ e : p.e ≥ 0 ∧ e : p.e = 0

    +   - out.u ≡ e : p.e = −1


