    # 1.5  The Non-Crooks Problem


    # Problem Description


    Array $f[0..F-1]$ contains the names of people who work at Cornell, in alphabetical
    order. Array $g[0..G-1]$ contains the names of people on athletic teams, in alphabetical
    order. Thus, neither array contains duplicates and both arrays are monotonically
    increasing:


    $f[0] < f[1] < f[2] < \cdots < f[F-1]$


    $g[0] < g[1] < g[2] < \cdots < g[G-1]$


    Count the number of people who are presumably not crooks: those that appear in
    at least one array but not in both.


    # Solution


    The result assertion is


    $R := (i : 0 \le i < F : f[i] \notin g[0..G-1]) + (j : 0 \le j < G : g[j] \notin
    f[0..F-1])$


    We would expect to write a program that sequences up the two arrays together,
    in some synchronized fashion, performing a count as it goes. Thus, it makes sense
    to develop an invariant by replacing the two constants $F$ and $G$ of $R$ as follows:


    $0 \le h \le F \land 0 \le k \le G \land (i : 0 \le i < h : f[i] \notin g[0..G-1])
    + (j : 0 \le j < k : g[j] \notin f[0..F-1])$'
