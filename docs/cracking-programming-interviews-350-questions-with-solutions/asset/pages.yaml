    +   3. greater than


    The height of such a tree corresponds to the worst-case number of comparisons
    made by the algorithm it represents, which in turn is a lower bound on the running
    time of that algorithm. We therefore want a lower bound of Ω(n log n) on the height,
    H, of any decision tree that solves nuts bolts problem mentioned in earlier section.


    To begin with, note that the number of leaves L in any ternary tree must satisfy
    L ≤ 3^H. Next, consider the following class of inputs.


    Let the input array of nuts N be fixed and consist of n nuts in increasing sorted
    order, and consider one potential input for every permutation of the bolts. In
    order to match the nuts and bolts, our algorithm must in this case essentially
    sort the array of bolts.


    In our decision tree, if two different inputs of this type were mapped to the
    same leaf node, our algorithm would attempt to apply to both of these the same
    permutation of bolts with respect to nuts, and it follows that the algorithm could
    not compute a matching correctly for both of these inputs.


    Therefore, we must map every one of these n! different inputs to a distinct leaf
    node, i.e.


    L ≥ n!

    ⟹ 3^H ≥ n!

    ⟹ H ≥ log₃ n!

    ⟹ H = Ω(n log n)


    Please note that base of logarithm doesn’t matter in complexity, it is a kind
    of constant, so we will ignore this too.


    In particular, at least Ω(n log n) comparisons are needed. This is a lower bound
    for the expected number of comparisons in any randomized algorithm for the problem
    as well.


    A simple modification of Randomized Quicksort shows that there are simple randomized
    algorithms whose expected number of comparisons (and running time) are O(n log
    n):


    +   - pick a random bolt

    +   - compare it to all the nuts

    +   - find its matching nut, thus splitting the nuts into three parts:

    +       1. nuts smaller for the bolt

    +       2. nuts exactly fit with the bolt

    +       3. nuts bigger for the bolt'
