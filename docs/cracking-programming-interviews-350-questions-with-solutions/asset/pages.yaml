    # *** Question 140 alignment specifier


    What is alignment specifier(s)?


    # **Solution of Question 140**


    An alignment-specifier may be applied to a variable or to a class data member,
    but it can not be applied to a bit-field, a function parameter, the formal parameter
    of a catch clause, or a variable declared with the register storage class specifier.
    An alignment-specifier may also be applied to the declaration of a class or enumeration
    type. An alignment-specifier with an ellipsis is a pack expansion.


    When the alignment-specifier is of the form `alignas( assignment-expression );`:


    +   - the assignment-expression should be an integral constant expression


    +   - if the constant expression evaluates to a fundamental alignment, the alignment
    requirement of the declared entity is the specified fundamental alignment


    +   - if the constant expression evaluates to an extended alignment and the implementation
    supports that alignment in the context of the declaration, the alignment of the
    declared entity should be that alignment'
