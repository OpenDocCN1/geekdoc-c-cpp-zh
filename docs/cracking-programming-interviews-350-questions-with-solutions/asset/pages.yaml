  md: "# ### *** Question 220    all_of algorithm\n\nImplement the STL algorithm *all_of*\
    \ using *find_if_not* and *find_if*.\n\n# ### Solution of Question 220\n\n```\n\
    ```cpp\ntemplate<typename InputIterator, typename Predicate>\ninline bool\nall_of(InputIterator\
    \ first , InputIterator last ,\n        Predicate pred)\n{\n    return last ==\
    \ std::find_if_not(first , last ,\n        pred);\n}\ntemplate<typename InputIterator\
    \ , typename Predicate>\ninline bool\nall_of(InputIterator first , InputIterator\
    \ last ,\n        Predicate pred)\n{\n    return last == std::find_if( first ,\
    \ last , std::\n        not1(pred));\n}\n```\n```\n\n# ### *** Question 221  \
    \  is_partitioned algorithm\n\nImplement the STL algorithm *is_partitioned* with\
    \ the interface\n\n```\n```cpp\ntemplate<typename InputIterator , typename Predicate>\n\
    bool is_partitioned(InputIterator first ,\n        InputIterator last , Predicate\
    \ p);\n```\n```\n\nIt returns true if\n\n+   - if [first, last) is partitioned\
    \ by the unary predicate p, i.e. if all elements that satisfy p appear before\
    \ those that do not. Or,\n+   - if [first, last) is empty.\n\nIn other words,\
    \ all the items in the sequence that satisfy the predicate are at the beginning\
    \ of the sequence.\n\n# ### Solution of Question 221\n\nThere are two phases of\
    \ this algorithm:\n\n+   1. Find the first occurrence of the element which does\
    \ not satisfy the predicate. The algorithm `std::find_if_not` perfectly fits the\
    \ bill here.\n+   2. None of the elements should satisfy the predicate starting\
    \ from the element found above. `std::none_of` can be used to get this job done\
    \ easily."
