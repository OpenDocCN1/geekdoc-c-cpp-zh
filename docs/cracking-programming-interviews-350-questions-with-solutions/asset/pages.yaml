- pgno: 223
  md: '# 4.1. String Edit Distance


    We have that $Damerau\ edit\ distance(S_1,S_2)=1$ as now a single transposition
    of the characters $S_1[0]=''c''$ and $S_1[1]=''a''$ is enough to convert $S_1$
    into $S_2$, i.e.


    $$\text{transpose “ca” “cat”} \Longrightarrow \text{“act”}$$


    Both the Levenshtein and the Damerau edit distance suit well the technique of
    dynamic programming. We begin by discussing the dynamic programming algorithm
    for the Levenshtein edit distance.


    Let $D(i,j)$ be the edit distance of the strings $S_1[1..i]$ and $S_2[1..j]$,
    i.e., $D(i,j)$ denotes the minimum number of edit operations needed to transform
    the first $i$ characters of $S_1$ into the first $j$ characters of $S_2$.


    If $S_1$ has $m$ characters and $S_2$ has $n$ characters, then the edit distance
    is $D(m,n)$.


    # Recurrence : Computing the Levenshtein edit distance


    We will compute $D(m,n)$ by solving the more general problem of computing $D(i,j)$
    for all combinations of $i$ and $j$, where $i$ ranges from $0$ to $m$ and $j$
    ranges from $0$ to $n$.


    The base conditions are:


    +   - $D(i,0)=i$, i.e., the only way to transform the first $i$ characters of
    $S_1$ to $0$ characters of $S_2$ is to delete all the $i$ characters of $S_1$.

    +   - $D(0,j)=j$, i.e., the only way to transform the $0$ characters of $S_1$
    to the first $j$ characters of $S_2$ is to insert the $j$ characters of $S_2$
    into $S_1$.


    Then $D(i,j)$ is the minimum of the following three possibilities:


    +   1. $D(i-1,j-1)+\delta(i,j)$, where $\delta(i,j)$ is the cost associated with
    either substitution cost (or matching zero cost), i.e.,

    +      a) $\delta(i,j)=1$ if $S_1[i] \ne S_2[j]$

    +      b) $\delta(i,j)=0$ if $S_1[i] = S_2[j]$

    +   2. $D(i,j-1)+1$, i.e., deletion cost of the character $S_2[j]$

    +   3. $D(i-1,j)+1$, i.e., deletion cost of the character $S_1[i]$


