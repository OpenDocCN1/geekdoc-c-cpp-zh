  md: '# 5.3. Party Problem


    Indecision lead to situations where Alice will go to a party if Bob goes and Bob
    will go if Alice goes, but neither ends up going, since neither knows the other''s
    conditions for attending.


    To encourage more social behavior, the Student Invitational Party Board (SIPB)
    is developing a web service to help organize party going. For a given party, each
    student registers if he definitely wishes to attend or if he conditionally wishes
    to attend depending on whether a sufficient quorum of friends also attends. Specifically,
    the student indicates his condition on a SIPB party by giving a threshold $t \ge
    0$ and a list $L$ of $t$ or more other students such that he agrees to attend
    if at least $t$ of the students on $L$ also attend. Some of the students on $L$
    may not register, in which case we assume that they will not attend. At some designated
    time before the party, the SIPB service emails a message to each registered student
    whether the student should attend. The service guarantees that if all students
    who are emailed positive responses attend, then all the attendees'' conditions
    are satisfied. We assume that a student is honor-bound to attend if his condition
    is satisfied, and that he doesn''t register for conflicting parties.


    The SIPB party service wishes to process the database of conditions so that as
    many people go to a given party as possible. Thus, in the Alice and Bob example,
    both should be sent a positive response. Model the problem formally, and give
    an efficient algorithm to select as many party-goers as possible subject to the
    students'' conditions. For bonus points, devise a more general set of conditions
    that can be efficiently processed by a similar algorithm.


    # Solution


    # Model


    Let $L_i$ and $t_i$ be the list and threshold submitted by student $i$. Algorithm
    PARTY accepts as input a directed graph, $G(V,E)$. $G$ is represented as an array
    of adjacency lists. That is, $Adj[v]$ lists neighbors of $v$. In addition to a
    name, each vertex has attributes $Slack$ and $Attend$. There is an edge $e_{ij}
    \in E$ (from $v_i$ to $v_j$) if and only if student $i$ appears in list $L_j$.
    That is, student $j$''s attendance may depend on student $i$''s attendance. We
    define $Slack[i] = |L_i| - t_i$. We initialize, $Attend[i] = true$. We use one
    key additional data structure, $Q$, which holds indices recently discovered not
    to be attending the party. Initially $Q$ is empty.


    ```

