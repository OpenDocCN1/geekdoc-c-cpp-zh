  md: "# Solution of Question 47\n\nThe hierarchy of values associated with an expression\
    \ looks like:\n\n![](img/78e1bff64796dccbf49e7c84b8201fb2_378_0.png)\n\nFigure\
    \ 8.1: Expression Value Category Taxonomy\n\n+   1. *lvalue*: This name came because\
    \ earlier meaning was associated with its appearance in the left-hand side of\
    \ an assignment.\n+      - An *lvalue* designates a function or an object.\n+\
    \      - If *ptr* is a pointer to an object or a function, then `*ptr` is an *lvalue*\
    \ expression.\n+      - The result of calling a function whose return type is\
    \ an *lvalue* reference is an *lvalue*.\n+   \n+   2. *xvalue*: It stands for\
    \ an *expiring value*.\n+      - The result of calling a function whose return\
    \ type is an *rvalue* reference is an *xvalue*.\n+      - It refers to an object,\
    \ usually near the end of its lifetime, so that its resources may be moved.\n\
    +   \n+   3. *glvalue*: It stands for *generalized lvalue*. Thus it refers to\
    \ either an *lvalue* or *xvalue*. glvalues can also have incomplete types.\n+\
    \   \n+   4. *rvalue*: This name came because earlier meaning was associated with\
    \ its appearance in the right-hand side of an assignment.\n+   \n+      It is:\n\
    +      - an xvalue\n+      - a temporary object\n+      - a subobject\n+     \
    \ - a value that is not associated with an object.\n+   \n+   5. *prvalue*: It\
    \ stands for *pure rvalue*, i.e., an rvalue that is not an xvalue."
