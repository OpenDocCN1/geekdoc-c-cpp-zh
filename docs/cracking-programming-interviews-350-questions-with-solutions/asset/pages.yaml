  md: "[\n\n**Deducing-Conditional-Statement**  \n**Deducing Conditional Statement**\
    \  Let us start with finding complement of the condition, i.e., search still continues.\
    \ It is not that difficult to see that the complement should maintain the invariant\
    \ and lead towards the result, i.e.,\n\n$Invariant \\land complement\\text{-}of\\\
    text{-}condition \\Longrightarrow Postcondition$\n\n# Revisiting Postcondition\n\
    \n$(0 \\leq i \\leq m-1 \\land 0 \\leq j \\leq n-1 \\land x = a[i,j])$\n\nAs could\
    \ be seen above, *Postcondition* consists of 2 parts¹:\n\n+   1. $(0 \\leq i \\\
    leq m-1 \\land 0 \\leq j \\leq n-1 \\land x = a[i,j])$  \n+   2. $(i = m \\land\
    \ x \\neq a)$\n\n# Establishing Postcondition\n\nTo establish first part of postcondition,\
    \ the complement of the condition can be $i < m$ and $x = a[i,j]$.\n\nAnd to establish\
    \ second part of postcondition, it can be $i = m$.\n\n# Complement of condition\n\
    \nPutting together, this looks like:\n\n$i = m \\lor (i < m \\land x \\neq a[i,j])$\n\
    \nLet us take its complement again to reach to the condition, i.e., complement\
    \ of the complement of the condition $\\Longrightarrow$ condition.\n\n# Condition\n\
    \n$(i \\neq m \\land (i \\geq m \\text{ or } x \\neq a[i,j]))$\n\nBut this condition\
    \ has to be evaluated only when the variant is true, i.e., only when $i \\leq\
    \ m$, because as discussed above\n\n$Invariant \\land complement\\text{-}of\\\
    text{-}condition \\Longrightarrow Postcondition$\n\nSo the condition can be simplified\
    \ further to look like\n\n$i \\neq m \\land (i = m \\text{ or } x \\neq a[i,j])$\n\
    \n¹ i.e. 2 disjunctions"
