  md: "```\nB::~B()\nD::operator delete\n```\n\nSince member allocation and deallocation\
    \ functions are static they cannot be virtual. However, when the cast-expression\
    \ of a delete-expression refers to an object of class type, because the deallocation\
    \ function actually called is looked up in the scope of the class that is the\
    \ dynamic type of the object, if the destructor is virtual, the effect is the\
    \ dynamic type of the object.\n\nHere, storage for the non-array object of class\
    \ D is deallocated by `D::operator delete()`, due to the virtual destructor (i.e.,\
    \ `delete bp` calls `D::operator delete(void*)`).\n\nPlease note that access to\
    \ the deallocation function is checked statically. Hence, even though a different\
    \ one might actually be executed, the statically visible deallocation function\
    \ is required to be accessible. If `B::operator delete()` had been private above,\
    \ the delete expression would have been ill-formed.\n\n# **** Question 198    \
    \ base class initializer\n\nReview the program?\n\nProgram 13.15: base class initializer\n\
