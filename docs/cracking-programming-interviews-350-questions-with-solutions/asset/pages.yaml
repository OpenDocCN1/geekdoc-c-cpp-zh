  md: "+   2. static\n+   3. thread_local\n+   4. extern\n+   5. mutable\n\n# ***Question\
    \ 102    inline function***\n\nWhat is an inline function?\n\n# Solution of Question\
    \ 102\n\n+   - A function declaration with an inline specifier declares an inline\
    \ function\n+   \n+   - The inline specifier indicates to the implementation that\
    \ inline substitution of the function body at the point of call is to be preferred\
    \ to the usual function call mechanism. An implementation is not required to perform\
    \ this inline substitution at the point of call.\n+   \n+   - A function defined\
    \ within a class definition is an inline function. The inline specifier may not\
    \ appear on a block scope function declaration.\n+   \n+   - If the inline specifier\
    \ is used in a friend declaration, that declaration will be a definition or the\
    \ function has previously been declared inline.\n+   \n+   - An inline function\
    \ is defined in every translation unit in which it is odr-used and has exactly\
    \ the same definition in every case.\n+   \n+   - If a function with external\
    \ linkage is declared inline in one translation unit, it is declared inline in\
    \ all translation units in which it appears.\n+   \n+   - An inline function with\
    \ external linkage shall have the same address in all translation units.\n+  \
    \ \n+   - A static local variable in an extern inline function always refers to\
    \ the same object.\n+   \n+   - A string literal in the body of an extern inline\
    \ function is the same object in different translation units.\n+   \n+   - A type\
    \ defined within the body of an extern inline function is the same type in every\
    \ translation unit."
