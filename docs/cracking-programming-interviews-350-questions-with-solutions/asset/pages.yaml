    # ### Solution


    # #### Introduction


    Finding the occurrences of a given query string (pattern) from a possibly very
    large text is an old and fundamental problem in computer science. It emerges in
    applications ranging from text processing and music retrieval to bioinformatics.
    This task, collectively known as *string matching*, has several different variations.
    The most natural and simple of these is *exact string matching*, in which, like
    the name suggests, one wishes to find only occurrences that are exactly identical
    to the pattern string. This type of search, however, may not be adequate in all
    applications if for example the pattern string or the text may contain typographical
    errors. Perhaps the most important applications of this kind arise in the field
    of bioinformatics, as small variations are fairly common in DNA or protein sequences.


    Other related areas of applications include(but not limited to)


    +   - stochastic transduction

    +   - syntactic pattern recognition

    +   - spelling correction

    +   - string correction'
