    # ## 1.18 The Celebrity Problem


    # ### Problem Description


    Among n persons, a *celebrity* is defined as someone who is known by everyone
    but does not know anyone. The problem is to identify the celebrity, if one exists,
    by asking questions only of the form, “Excuse me, do you know the person over
    there?” The assumption is that all the answers are correct, and that even the
    celebrity will answer. The goal is to minimize the number of questions.


    # ### Solution


    Since there are n(n−1)/2 pairs of persons, there is potentially a need to ask
    n(n−1) questions, in the worst case, if the questions are asked arbitrarily. It
    is not clear that we can do better in the worst case.


    # ### Graph based approach


    We can use a graph-theoretical formulation. We can build a directed graph G =
