    x is lexicographically less than y, regardless of the lengths of the two strings.
    We take advantage of this property by sorting the strings on the first letter,
    using counting sort. We take an empty string as a special case and put it first.
    We gather together all strings with the same first letter as a group. Then we
    recurse, within each group, based on each string with the first letter removed.


    The correctness of this algorithm is straightforward. Analyzing the running time
    is a bit trickier. Let us count the number of times that each string is sorted
    by a call of counting sort. Suppose that the i^th string, s_i, has length l_i.
    Then s_i is sorted by at most l_i + 1 counting sorts. (The +1 is because it may
    have to be sorted as an empty string at some point; for example, ab and a end
    up in the same group in the first pass and are then ordered based on b and the
    empty string in the second pass. The string a is sorted its length, 1, time plus
    one more time.) A call of counting sort on t strings takes Θ(t) time (remembering
    that the number of different characters on which we are sorting is a constant.)
    Thus, the total time for all calls of counting sort is


    $$ O(∑_{i=1}^{m}(l_i+1)) = O(∑_{i=1}^{m} l_i + m) = O(n+m) = O(n) $$


    Please note that ∑_{i=1}^{m} l_i = n and m ≤ n.


