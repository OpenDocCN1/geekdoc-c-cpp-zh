  md: "# std::next_permutation\n\nThe following version (STL) takes a sequence defined\
    \ by the range `[first,last)` and transforms it into the next permutation which\
    \ is found by assuming that the set of all permutations is lexicographically sorted\
    \ with respect to `comp`. If such a permutation exists, it returns true. Otherwise,\
    \ it transforms the sequence into the smallest permutation, that is, the ascendingly\
    \ sorted one, and returns false.\n\nProgram 6.2: next_permutation\n\n```\n```cpp\n\
    template <typename BidirectionalIterator>\nbool next_permutation(\n        BidirectionalIterator\
    \ first,\n        BidirectionalIterator last)\n{\n    BidirectionalIterator i\
    \ = last;\n    if (first == last || first == --i)\n        return false;\n\n \
    \   while (true)\n    {\n        BidirectionalIterator i1 = i;\n        if (*--i\
    \ < *i1)\n        {\n            BidirectionalIterator j = last;\n           \
    \ while (!(*i < *--j))\n                std::iter_swap(i, j);\n            std::reverse(i1,\
    \ last);\n            return true;\n        }\n        if (i == first)\n     \
    \   {\n            std::reverse(first, last);\n            return false;\n   \
    \     }\n    }\n}\n```\n```\n\nProgram 6.3: reversing a sequence\n\n```\n```cpp\n\
    template <typename BidirectionalIterator>\ninline void\nreverse(BidirectionalIterator\
    \ first,\n        BidirectionalIterator last,\n        bidirectional_iterator_tag)\n\
    {\n    while (first != last)\n    {\n        if (first == --last)\n          \
    \  break;\n        swap(*first, *last);\n        ++first;\n    }\n}\n```\n```"
