    *For any graph G = (V, E), for any U ⊆ V, U is an independent set iff V ∖ U is
    a vertex cover.*


    # **Solution**


    First assume U is an independent set. Assume V ∖ U is not a vertex cover. It follows
    there is an edge (u, v) such that u ∈ V ∖ U and v ∈ V ∖ U. But that is equivalent
    to saying there is an edge (u, v) such that u ∈ U and v ∈ U. By definition, U
    is not an independent set, contrary to the initial assumption.


    Now assume V ∖ U is a vertex cover. Assume U is not an independent set. Negating
    the definition of independent set, we derive ∃u ∈ U ∃v ∈ U : (u, v) ∈ E. The definition
    of vertex cover says that for every edge, at least one of its vertices is in the
    cover. Since V ∖ U is a vertex cover and (u, v) is an edge, u ∈ V ∖ U or v ∈ V
    ∖ U. It follows u ∈ U or v ∈ U, contrary to the previous conclusion that u ∈ U
    and v ∈ U. ■


    *For any graph G = (V, E) with n vertices, if m is the size of a minimum vertex
    cover and t is the size of a maximum independent set, then m + t = n. Furthermore,
    every minimum vertex cover U trivially gives us a maximum independent set, namely
    V ∖ U, and vice versa.*


