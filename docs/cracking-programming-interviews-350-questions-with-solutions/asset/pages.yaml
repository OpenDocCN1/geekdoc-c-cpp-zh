  md: '# Complexity


    At most 3(n - 1) questions will be asked:


    +   1. n - 1 questions in the first phase to eliminate n - 1 persons, and then

    +   2. at most 2(n - 1) questions to verify that the candidate is indeed a celebrity.


    Notice that the size of the input is not n, but rather n(n - 1), which is the
    number of entries of the matrix. This solution shows that it is possible to identify
    a celebrity by looking at only O(n) entries in the adjacency matrix, even though
    a priori the solution may be sensitive to each of the n(n - 1) entries.


    # Remarks


    The key idea in this elegant solution is to reduce the size of the problem from
    n to n - 1 in a clever way. Do not start by simply considering an arbitrary input
    of size n - 1 and attempting to extend it. Select a particular input of size n
    - 1.


    # Uniqueness of Celebrity


    > In a set S of n people, there can be only one celebrity.


    Assume for contradiction that there are two celebrities C₁ and C₂ in S. By definition
    of celebrity, everyone knows a celebrity. Therefore ∀a ∈ S − {C₁}, a knows C₁.
    Because C₂ ∈ S − {C₁}, C₂ knows C₁. But celebrities don''t know anyone. Therefore,
    C₂ is not a celebrity. This contradicts our assumption that C₂ was a celebrity.
    Therefore the assumption is false. Therefore, we cannot have two celebrities.


    The first algorithm is based on a brute-force approach. We essentially look at
    each pair of people to see if they know each other. If we find a person that knows
    nobody but is known by all the others, that person is a celebrity:'
