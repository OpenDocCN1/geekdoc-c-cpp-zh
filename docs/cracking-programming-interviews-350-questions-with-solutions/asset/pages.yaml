    \n+   - xor is commutative and associative (so the order in which it's done is\
    \ irrelevant).\n+   - a number xored with itself will always be zero.\n+   - zero\
    \ xored with a number will be that number.\n\nSo, if we simply xor all the values\
    \ together, all of the ones that occur twice will cancel each other out (giving\
    \ 0) and the one remaining number (value) will xor with that result (0) to give\
    \ value.\n\nProgram 2.9: Find the number not occurring twice in an array\n\n```\n\
    #include <vector>\n#include <iostream>\n\nsize_t get_orphan(std::vector<int> &\
