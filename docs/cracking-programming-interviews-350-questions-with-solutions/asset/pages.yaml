  md: '+   - A static member function can not be made virtual.


    +   - There can not be a static and a non-static member function with the same
    name and the same parameter types.


    +   - A static member function can not be declared const, volatile, or const volatile.


    # *** Question 176     static member data


    What are the properties of a static member data?


    # Solution of Question 176


    +   - A static data member is not part of the subobjects of a class. If a static
    data member is declared `thread_local` there is one copy of the member per thread.
    If a static data member is not declared `thread_local` there is one copy of the
    data member that is shared by all the objects of the class.


    +   - The declaration of a static data member in its class definition is not a
    definition and may be of an incomplete type other than cv-qualified void. The
    definition for a static data member appears in a namespace scope enclosing the
    member''s class definition. In the definition at namespace scope, the name of
    the static data member is qualified by its class name using the scope resolution
    operator, i.e., `::` operator. The initializer expression in the definition of
    a static data member is in the scope of its class.


    +   - Once the static data member has been defined, it exists even if no objects
    of its class have been created.


    +   - If a non-volatile const static data member is of integral or enumeration
    type, its declaration in the class definition can specify a brace-or-equal-initializer
    in which every initializer-clause that is an assignment-expression is a constant
    expression. A static data member of literal type can be declared in the class
    definition with the `constexpr` specifier; if so, its declaration shall specify
    a brace-or-equal-initializer in which every initializer-clause that is an assignment-expression
    is a constant expression. In both these cases, the member may appear in constant
    expressions. The member is still be defined in a namespace scope if it is odr-used
    in the program and the namespace scope definition does not contain an initializer.


    +   - There is exactly one definition of a static data member that is odr-used
    in a program. Unnamed classes and classes contained directly or indirectly within
    unnamed classes can not contain static data members.'
