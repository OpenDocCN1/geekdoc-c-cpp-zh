  md: '# Proof of correctness


    Our algorithm starts off by comparing $a[\lfloor k/2\rfloor]$ and $b[\lceil k/2\rceil]$:


    +   - Suppose $a[\lfloor k/2\rfloor] > b[\lceil k/2\rceil]$. Then:

    +     - In the union of $a$ and $b$ there can be at most $k-2$ elements smaller
    than $b[\lceil k/2\rceil]$, i.e., $a[1,\ldots,\lfloor k/2\rfloor-1]$ and $b[1,\ldots,\lceil
    k/2\rceil-1]$, and we must necessarily have $s_k > b[\lceil k/2\rceil]$.

    +     - Similarly, all elements $a[1,\ldots,\lfloor k/2\rfloor]$ and $b[1,\ldots,\lceil
    k/2\rceil]$ will be smaller than $a[\lfloor k/2\rfloor]$. But these are $k$ elements,
    so we must have $s_k < a[\lfloor k/2\rfloor+1]$.


    This shows that $s_k$ must be contained in the union of the subarrays $a[1,\ldots,\lfloor
    k/2\rfloor]$ and $b[\lceil k/2\rceil+1,\ldots,k]$.


    In particular, as we discarded $\lceil k/2\rceil$ elements smaller than $s_k$,
    then $s_k$ will be the $\lfloor k/2\rfloor$-th smallest element in this union.


    We can then find $s_k$ by recursing on this smallest problem.


    +   - The case $a[\lfloor k/2\rfloor] < b[\lceil k/2\rceil]$ is symmetric.

    +   - The last case, which is also the base case of the recursion, is $a[\lfloor
    k/2\rfloor] = b[\lceil k/2\rceil]$, for which we have $s_k = a[\lfloor k/2\rfloor]
    = b[\lceil k/2\rceil]$.


