    # ## Contract the rectangular region


    We have to choose a rectangular region a[i..p, q..j] that contains x followed
    by making this region smaller till x is found.


    Initial bounded searchable region is represented by :


    ```

    i = 0    p = m - 1    q = 0    j = n - 1

    ```


    Looking at bounds of the rectangle, there are 4 ways to march towards contracting
    it:


    +   - if a[i, j] < x then since the row is ordered ⟹ i ← i + 1, because if a[i,
    j] > x, then all the entries of that row is also greater than x. Please note that
    its execution will maintain the stated invariant if x is not found in a[i, 0..n-1],
    i.e., in i^th row.

    +   - if a[p, q] > x ⟹ p ← p - 1

    +   - if a[p, q] < x ⟹ q ← q + 1

    +   - if a[i, j] > x ⟹ j ← j - 1


    These conditions are also known as guards[?].


