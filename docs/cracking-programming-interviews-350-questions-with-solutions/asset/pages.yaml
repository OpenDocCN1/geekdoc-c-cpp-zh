    # ### Question 142 carriage_dependency attribute


    What is *carriage_dependency* attribute?


    # ### Solution of Question 142


    The attribute-token *carries_dependency* specifies dependency propagation into
    and out of functions. It appears at most once in each attribute-list and no attribute-argument-clause
    is present. The attribute may be applied to the declarator-id of a parameter-declaration
    in a function declaration or lambda, in which case it specifies that the initialization
    of the parameter carries a dependency to each value-to-value conversion of that
    object. The attribute may also be applied to the declarator-id of a function declaration,
    in which case it specifies that the return value, if any, carries a dependency
    to the evaluation of the function call expression.


    The first declaration of a function will specify the *carries_dependency* attribute
    for its declarator-id if any declaration of the function specifies the *carries_dependency*
    attribute. Furthermore, the first declaration of a function shall specify the
    *carries_dependency* attribute for a parameter if any declaration of that function
    specifies the *carries_dependency* attribute for that parameter. If a function
    or one of its parameters is declared with the *carries_dependency* attribute in
    its first declaration in one translation unit and the same function or one of
    its parameters is declared without the *carries_dependency* attribute in its first
    declaration in another translation unit, the program is ill-formed.


    The *carries_dependency* attribute does not change the meaning of the program,
    but may result in generation of more efficient code.


    For example:


    ```

    ```cpp

    // Translation unit A.


    struct foo { int* a; int* b; };


    std::atomic<struct foo *> foo_head[10];


    int foo_array[10][10];


    [[ carries_dependency ]] struct foo* f(int i)

    ```

