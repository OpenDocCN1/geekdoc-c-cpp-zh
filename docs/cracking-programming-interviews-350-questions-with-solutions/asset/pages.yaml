  md: '# ## 2.14 Finding the majority


    # ### The majority problem


    We are given a set S of n objects (n ≥ 1), each of which has a color. Furthermore,
    we are told that there is a majority color in S, i.e., a color that occurs strictly
    more than n/2 times. We denote this majority color by mc(S). Our task is to find
    an element of S whose color is equal to mc(S). We are only allowed to use the
    operation same_color. This operation takes two arbitrary elements, say x and y
    of S, and returns the value


    same_color(x, y) = { true, if x and y have the same color; false, otherwise. }    (2.1)


    In particular, we cannot determine the color of any element of S.


    # ### The basic algorithm


    Our algorithm will be based on the following observation.


    # ### Observation 1


    Let x and y be two elements of S that have different colors. Then there is a majority
    color in the set S ∖ {x,y}, and


    mc(S) = mc(S ∖ {x,y})


    # ### Proof


    Assume that mc(S) = red. Let k be the number of red elements in S. Then we know
    that k > n/2. We have to show that the set S ∖ {x,y} contains more than (n-2)/2
    red elements.


    **Case 1**  Neither x nor y is red. In this case, the number of red elements in
    S ∖ {x,y} is equal to k > n/2 > (n-2)/2.


    **Case 2**  Exactly one x and y is red. In this case, the number of red elements
    in S ∖ {x,y} is equal to k-1 > n/2 - 1 = (n-2)/2. ■


    # ### Invariant


    We maintain the following invariant:


    +   1. S is the disjoint union of three sets N, I, and D.

    +   2. All elements of I have the same color.'
