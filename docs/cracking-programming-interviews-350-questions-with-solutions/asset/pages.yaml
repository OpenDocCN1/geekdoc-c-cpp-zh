  md: 'game is played between $x_i$ and $x_j$ such that $j > i$, then the maximal
    of $x_i$ and $x_j$ is put in position $j$.


    In the first round, processor $P_i$ compares $x_{2i-1}$ to $x_{2i}$, $1 \leq i
    \leq \frac{n}{2}$, and exchanges them if necessary; in the second round, $P_i$
    compares $x_{4i-2}$ to $x_{4i-1}$, $1 \leq i \leq \frac{n}{4}$, and so on. Please
    note that each number is involved in only one game at a time.


    The running time of this simple algorithm is clearly $O(\log n)$.


    Let''s try now to minimize the number of processors.


    The algorithm we just presented requires $\left\lfloor\frac{n}{2}\right\rfloor$
    processors, and we have


    $$T\left(n,\left\lfloor\frac{n}{2}\right\rfloor\right)=\lceil\log_2 n\rceil.$$


    Since the sequential algorithm achieves


    $$T(n,1)=n-1,$$


    the efficiency of the parallel algorithm is


    $$E\left(n,\frac{n}{2}\right)=\frac{n}{\log_2 n}.$$


    If $\frac{n}{2}$ processors are available anyway, then this algorithm is simple
    and efficient, for example, if the maximum finding algorithm is a part of another
    algorithm that requires them.


    With some modifications, however, we can achieve a parallel time of $O(\log n)$
    with $O(1)$ efficiency.


    The total number of comparisons required for this algorithm is $n-1$, the same
    as the sequential algorithm. The reason for the low efficiency is that many processors
    are idle in later rounds. We can improve the efficiency by reducing the number
    of processors and performing load balancing in the following way.


    Suppose that we use only about $\frac{n}{\log_2 n}$ processors. We divide the
    input into $\frac{n}{\log_2 n}$ groups and assign a group to each processor. In
    the first phase, each processor finds the maximum in its group, using the sequential
    algorithm that takes about $\log_2 n$ steps. It remains now to find the maximum
    among about $\frac{n}{\log_2 n}$ maximums, but there are now enough processors
    to use the tournament algorithm.


    The running time of this algorithm is


    $$T\left(n,\left\lfloor\frac{n}{\log_2 n}\right\rfloor\right)=2\log_2 n,$$


    assuming that $n$ is a power of 2.


    The corresponding efficiency is $E(n)\approx\frac{1}{2}$.'
