  md: '# 2.11  The Problem of the Circular Racecourse


    # Problem Description


    Given two integer arrays $p[0..N-1]$ and $q[0..N-1]$, $N \ge 1$, such that


    $$\forall i:0 \le i < N : p[i] \ge 0 \land q[i] > 0,$$


    and


    $$\sum_{i=0}^{N-1} p[i] = \sum_{i=0}^{N-1} q[i]$$


    Along a circular racecourse are $N$ pits, clockwise numbered from 0 through $N-1$.
    The amount of petrol available at pit $i$ equals $p[i]$, whereas the amount of
    petrol needed to travel from pit $i$ to the clockwise next pit equals $q[i]$.


    Write a program to determine all pits from which a car, with an initially empty
    and sufficiently large tank, can start and complete the whole course in clockwise
    direction.


    # Solution


    A necessary and sufficient condition for the car to round the circuit, when starting
    at pit $k$ is


    $$(p[k]-q[k]) \ge 0,$$


    so that pit $k+1$ can be reached, and


    $$(p[k]-q[k])+(p[k+1]-q[k+1]) \ge 0$$


    so that pit $k+2$ can also be reached and


    ⋮


    $$(p[k]-q[k])+(p[k+1]-q[k+1])+\cdots+(p[k+N-1]-q[k+N-1]) \ge 0$$


    so that pit $k+N$, which is pit $k$, can be reached as well.


    We can formulate this condition a little bit more precisely by writing


    $$C(k,N):(\forall h:0 \le h < N : \sum_{i=k}^{k+h}(p[i]-q[i]) \ge 0)$$


    Now we could proceed by checking for each pit $k$ whether or not $C(k,N)$ is fulfilled.
    Such a progression, however, would be too much wasteful, because up to $N^2$ partial
    sums which are in the game, are mutually strongly dependent.


    In order to do better, we might observe that, for instance,


    $$\sum_{i=k}^{k+h}(p[i]-q[i])=\left(\sum_{i=0}^{k+h}-\sum_{i=0}^{k-1}\right)(p[i]-q[i])$$'
  merge: -1
  img_proc: true
