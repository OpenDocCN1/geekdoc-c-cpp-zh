  md: '# 1.2  Generating Permutation Efficiently


    # Problem Description


    Design a program that will generate the n! permutations of the values from 0 through
    n−1 in such an order that the transition from one permutation to the next is always
    performed by exactly one swap of two neighbors.


    # Solution


    # Reduction Approach(to inversion)


    In a permutation each pair of values such that the larger value precedes the smaller
    one, presents a so-called inversion. In particular: the one and only permutation
    with zero inversions is the one in which the values are placed in monotonically
    increasing order.


    The notion of inversions can be expected to be relevant here because the swapping
    of two neighbors changes the total number of inversions: i.e. the number of pairs
    in the wrong order: by (plus or minus) 1, and it is, therefore, suggested to


    *characterize each permutation by its inversions.*


    This can be done by introducing an inversion counters inversion[i] for 0 ≤ i <
    n, where inversion[i] equals the number of inversions between the value i and
    the values smaller than i.


    In other words, inversion[i] equals the number of numbers < i, that are placed
    at the wrong side of i, so we can say that


    *inversion[i] = the number of inversions between the value i and smaller values.*


    From this definition


    $$0 \leq \mathit{inversion}[i] \leq i$$


    follows;


    *the total number of inversions of a permutation is the sum of the corresponding
    inversion[i] values.*


    i.e. The total number of inversions of the permutation is the sum of all the inversion[i]
    values.


    So it is obvious that:


    +   1. Each permutation defines the inversion[i] values uniquely, and

    +   2. The inverse[i] define the permutation uniquely.'
