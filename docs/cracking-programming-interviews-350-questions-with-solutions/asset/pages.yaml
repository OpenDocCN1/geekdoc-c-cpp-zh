    \nWhen a *dynamic_cast* is used in a constructor (including the *mem-initializer*\
    \ or *brace-or-equal-initializer* for a non-static data member) or in a destructor,\
    \ or used in a function called (directly or indirectly) from a constructor or\
    \ destructor, if the operand of the *dynamic_cast* refers to the object under\
    \ construction or destruction, this object is considered to be a most derived\
    \ object that has the type of the constructor or destructor’s class.\n\nIf the\
    \ operand of the *dynamic_cast* refers to the object under construction or destruction\
    \ and the static type of the operand is not a pointer to or object of the constructor\
    \ or destructor’s own class or one of its bases, the *dynamic_cast* results in\
    \ undefined behavior.\n\nHere,\n\n+   - `typeid(*this)` is `type_info` for B.\n\
