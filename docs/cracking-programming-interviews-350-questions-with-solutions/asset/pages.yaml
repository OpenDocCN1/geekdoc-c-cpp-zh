  md: "```\n    lca of a and a : a\n    lca of j and c : a\n    lca of d and c : a\n\
    ```\n\n# ### Constant Time LCA\n\nThe *LCA* problem is then, given a rooted tree\
    \ *T* for preprocessing, preprocess it in a way so that the *LCA* of any two given\
    \ nodes in *T* can be retrieved in constant time. Let us present a preprocessing\
    \ algorithm that requires no more than linear time and space complexity.\n\nWe\
    \ make the following two assumptions on our computational machine model. Let *n*\
    \ denote the size of our input in unary representation:\n\n+   1. All arithmetic,\
    \ comparative and logical operations on numbers whose binary representation is\
    \ of size no more than log n bits can be done in *constant time*.\n+   2. We assume\
    \ that finding the left-most bit or the right-most bit of a log n sized number\
    \ can be done in *constant time*.\n\n# ### Complete Binary Tree\n\nOur discussion\
    \ begins with a particularly simple instance of the *LCA* problem, *LCA* queries\
    \ on complete binary trees. We will use our knowledge of solving the *LCA* problem\
    \ on complete binary trees and expand it later on, to solve the *LCA* problem\
    \ on any arbitrary rooted tree *T*.\n\nLet *B* denote a complete binary tree with\
    \ *n* nodes. The key thing here is to encode the unique path from the root to\
    \ a node in the node itself. We assign each node a *path number*, a *log n* bit\
    \ number that encodes the unique path from the root to the node.\n\n**Path Number**\
    \ For each node *v* in *B* we encode a *path number* in the following way:\n\n\
    +   - Counting from the left most bit, the i'th bit of the path number for *v*\
    \ corresponds to the i'th edge on the path from the root to *v*.\n+   - A 0 for\
    \ the i'th bit from the left indicates that the i'th edge on the path goes to\
    \ a left child, and a 1 indicates that it goes to a right child.\n+   - Let *k*\
    \ denote the number of edges on the path from the root to *v*, then we mark the\
    \ *k+1* bit (the height bit) of the path number 1, and the rest of the *log n\
    \ - k - 1* bits 0."
