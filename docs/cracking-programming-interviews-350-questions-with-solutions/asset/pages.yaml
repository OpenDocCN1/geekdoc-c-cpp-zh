- pgno: 284
  md: '# ### 6.4 Random-number generation


    Your algorithm may include an initialization phase to preprocess the array $A$.
    After the preprocessing phase, the user can make any number of calls to your random-number
    generator, each of which should return a random integer according to the distribution
    $A$. The highest priority in your design is to make your random-number generator
    run as fast as possible, but your preprocessing phase should be efficient as well.
    Analyze both the time for preprocessing and the time for actual random-number
    generation.


    # Solution


    First, we present an algorithm based on generating random variates from a given
    probability distribution by inverting the cumulative distribution function. This
    algorithm uses $\Theta(n)$ preprocessing time and then takes $\Theta(\log n)$
    time for actual generation of a random number according to the distribution $A$.


    ```

    Algorithm 76 Random number generation using binary search


    1:  function RAND-BINARY(A)

    2:      C[1] ← A[1]

    3:      for i ← 2 to n do

    4:          C[i] ← C[i − 1] + A[i]

    5:      end for

    6:      u ← UNIFORM()

    7:      return BINARYSEARCH(C, 1, n, u)

    8:  end function

    ```


    BINARYSEARCH in line 7 returns $r$ such that $C[r − 1] \leq u < C[r]$.


    This implies $\Pr[X = r] = \Pr\{C[r − 1] \leq u < C[r]\} = C[r] − C[r − 1] = A[r]$,
    which establishes correctness. BINARY-SEARCH takes $\Theta(n)$ preprocessing time
    (lines 2–5), while lines 6–7 take $\Theta(\log n)$ time.


    Our next algorithm is based on expressing a given probability distribution as
    a weighted sum of some other probability mass functions that are easy to generate
    from (using the inversion technique mentioned above), and then selecting one of
    these probability functions according to the weights followed by generating (easily)
    from it. We give an algorithm that performs the preprocessing in time $\Theta(n^2)$,
    but generates random numbers from the distribution $A$ in time $\Theta(1)$. The
    idea is that if we write a probability mass function as an equally weighted mixture
