  md: "# 4.1. String Edit Distance\n\n+   - string similarity\n+   - string classification\n\
    +   - pronunciation modeling\n+   - Switchboard corpus\n+   - string permutations\n\
    \nThe field of approximate string matching, which has been a research subject\
    \ since the 1960's, answers the problem of small variation by permitting some\
    \ error between the pattern and its occurrences. Given an error threshold and\
    \ a metric to measure the distance between two strings, the task of approximate\
    \ string matching is to find all substrings of the text that are within (a distance\
    \ of) the error threshold from the pattern.\n\n# Edit Distance\n\nIn this solution\
    \ we concentrate on approximate string matching that uses so called *unit-cost\
    \ edit distance* as the metric to measure the distance between two strings. *Edit\
    \ Distance* between the string S_1 and S_2 is defined in general as the minimal\
    \ cost of any sequence of edit operations that transforms S_1 into S_2 or vice\
    \ versa.\n\nThere are various types of edit distance metrics available:\n\n+ \
    \  - *Levenshtein edit distance*: The allowed edit operations are:\n+     1. insertion,\n\
    +     2. deletion or\n+     3. substitution\n+   \n+     of a single character,\
    \ and each operation has the cost 1. This type of edit distance is sometimes called\
    \ *unit-cost edit distance*. *Levenshtein edit distance* is perhaps the most common\
    \ form of edit distance, and often the term edit distance is implicitly assumed\
    \ to it.\n\n+   - *Damerau edit distance*: Otherwise identical to the *Levenshtein\
    \ edit distance*, but allows also the fourth operation of transposing two adjacent\
    \ characters. A further condition is that the transposed characters must be adjacent\
    \ before and after the edit operations are applied.\n\n+   - *Weighted/generalized\
    \ edit distance*: Allows the same operations as the Levenshtein/Damerau edit distance,\
    \ respectively, but each operation may have an arbitrary cost."
