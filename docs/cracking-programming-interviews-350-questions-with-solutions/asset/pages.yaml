    # *** Question 65    Dynamic Cast vs void


    What is the result of dynamic_cast<T>(v) when T is a pointer to void ?


    # Solution of Question 65


    +   - The result is a pointer to the most derived object pointed to by v, or

    +   - a run-time check is applied to see if the object pointed or referred to
    by v can be converted to the type pointed or referred to by T.


    # *** Question 66    Dynamic Cast Run-time Check


    What is the result of dynamic_cast<T>(v) when T is a pointer to a class A ?


    # Solution of Question 66


    +   - If, in the most derived object pointed (referred) to by v, v points (refers)
    to a public base class subobject of a A object, and if only one object of type
    A is derived from the subobject pointed (referred) to by v the result points (refers)
    to that A object.

    +   - Otherwise, if v points (refers) to a public base class subobject of the
    most derived object, and the type of the most derived object has a base class,
    of type A, that is unambiguous and public, the result points (refers) to the A
    subobject of the most derived object.

    +   - Otherwise, the run-time check fails.'
