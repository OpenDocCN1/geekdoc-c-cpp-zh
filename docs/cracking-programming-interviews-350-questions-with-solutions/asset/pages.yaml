  md: '# Maximum 2D subarray problem


    # Problem


    Design and implement an efficient program to find a contiguous 2D sub-array within
    a two-dimensional array of integers which has the largest sum.


    Bentley has given a nice algorithm based on Kadane’s one dimensional algorithm
    to solve this problem in two-dimensional array thus making it look like Kadane’s
    2D algorithm.


    It applies Kadane’s algorithm to every possible row interval, summing over the
    rows in each interval to produce one dimensional array for Kadane’s algorithm
    to find the optimal column sum. One of the central idea of Bentley’s algorithm
    is the *prefix sum*, which aims to avoid repeating summations when processing
    subsequent row intervals.


    The 1D Kadane’s algorithm is run on the elements of each row of the array (*row₁,
    row₂ … rowₘ*) considered as a 1D stream, then on the sum of each pair of rows
    (*row₁ + row₂, row₁ + row₃ … row₁ + rowₘ*). The solution is given by the maximal
    sum produced by the 1D Kadane’s algorithm on these cases. If *x₁* and *x₂* are
    the pointers to the beginning and end of the maximal sub-stream, and *Rowᵢ* and
    *Rowⱼ* are the two added rows for which the sum is maximal, then the solution
    is delimited by the rectangle given by the upper-left (*Rowᵢ, x₁*) and the lower-right
    corners (*Rowⱼ, x₂*). This algorithm can be summarized as below:


    +   1. Compute the *prefix array* in the dimension of length m. This requires
    *O(mn)* computations.


    +   2. If the maximum sub-array is between *Rowᵢ* and *Rowⱼ*, inclusive, then
    there are \(\frac{m(m+1)}{2}\) such pairs.


    +   3. The sum of elements in the array between *Rowᵢ* and *Rowⱼ* for a given
    column is already computed as a part of our prefix sum. So each column sum looks
    like a single element of a one dimensional array across all columns, i.e., it
    looks like a one dimensional array with one row and *n* columns.


    +   4. Apply Kadane’s 1D algorithm on such pairs to get the maximum sub-array
    as described above. Thus total time complexity is *O(m²n²)*.


    Let us formalize the algorithm as follows:


    +   1. Let us denote the input array as *a[0..m, 0..n]*, i.e., it has m rows and
    n columns. Let *aᵢ* denote the *iᵗʰ* row of this array.'
