    # Arrays


    # 2.1 The Plateau Problem


    # Problem Description


    The array $b[0..n-1]$ has $n$ elements, may have duplicate elements, and is sorted.
    A *plateau* of length $p$ is a sequence of $p$ consecutive elements with the same
    value. Find the length of the *longest plateau* in $b$.


    # Solution


    The value $p$ is the length of the longest plateau if there is a sequence of $p$
    equal values and no sequence of $p+1$ equal values. i.e.


    +   - $b[0..n-1]$ contains a plateau of length $p$, and

    +   - $b[0..n-1]$ does not contain a plateau of length $p+1$


    Because the array is sorted, a subsection $b[k..j]$ is a *plateau* if and only
    if its end elements $b[k]$ and $b[j]$ are equal, i.e.


    $$

    0 \le k \le n-p : b[k] = b[k+p-1]

    $$


    $$

    \text{and}

    $$


    $$

    0 \le k \le n-p-1 : b[k] \ne b[k+p]

    $$


    Therefore,


    $p$ is the length of the longest plateau of $b[0..i] \iff b[i-p..i]$ is not a
    plateau


    $\Longrightarrow$ this holds


    $\Longleftrightarrow\ b[i-p] \ne b[i]$


    The length of the *plateau* of an array of length 1 is obviously 1. Using this
    fact, we can develop an invariant as follows:'
