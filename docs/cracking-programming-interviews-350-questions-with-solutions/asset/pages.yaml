  md: '# Inductive Approach


    Let’s try the straightforward induction approach. We assume that we know the mode
    of a multiset with n − 1 elements, and try to find the mode of an n element multiset.
    This is not easy since there may be several elements with the highest multiplicity;
    the nth element may break the tie. Suppose that the induction hypothesis states
    that we know all the elements with the highest multiplicity. Then, we can determine
    whether the nth element breaks the tie, but it may also increase the multiplicity
    of another number, which


    # 2.16 Circular Array


    A circular array A[1, . . . , n] is an array such that n ≥ 3 and A[1] and A[n]
    are considered to be adjacent elements just like A[1] and A[2], A[2] and A[3],
    etc., are adjacent. We are given a circular array A[1, . . . , n] of non-negative
    integers.


    # Problem


    For any i, j ∈ {1, 2, . . . , n} such that i ≠ j, dist(i, j) = max{|i−j|, n−|i−j|}.
    Design a linear time algorithm that computes a maximum number t such that for
    some i, j ∈ {1, 2, . . . , n}, i ≠ j, t = A[i] + A[j] + dist(i, j).


    # Solution


    ```

    ~~~text

    Algorithm 54 Circular Array Algorithm

    1: let B[0 . . . n] and C[1 . . . n] be linear arrays of nonnegative integers

    2: B[0] ← 0

    3: for i ← 1 to n do

    4:     B[i] ← max{B[i−1], A[i] − (i−1)}

    5:     C[i] ← B[i−1] + A[i] + (i−1)

    6: end for

    7: x ← max{C[i] | 1 ≤ i ≤ n}

    8: for i ← 1 to n do

    9:     B[i] ← max{B[i−1], A[i] + (i−1)}

    10: end for

    11: C[n] ← A[n] + 1

    12: for i ← n−1 downto 2 do

    13:     C[i] ← max{C[i+1], A[i] + n − (i−1)}

    14: end for

    15: y ← max{B[i] + C[i+1] | 1 ≤ i ≤ n−1}

    16: return max{x, y}

    ~~~

    ```'
