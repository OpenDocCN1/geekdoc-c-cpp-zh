    # **Question 48**   alignment


    What is an *alignment*?


    # Solution of Question 48


    An *alignment* is the number of bytes between successive addresses at which a
    given object can be allocated.


    +   - Every alignment value is a non-negative integral power of two.

    +   - It is represented as an integral constant of the type `std::size_t`.

    +   - The alignment requirement of a complete type, an array or a reference to
    a complete object type can be found using an *alignof* expression.

    +   - fundamental alignment ≤ `alignof(std::max_align_t)` < extended alignment.


    # **Question 49**   lvalue to rvalue conversion


    What is lvalue-to-rvalue conversion?


    # Solution of Question 49


    Technically it is glvalue to prvalue conversion.


    +   - For a complete type T, which is not a function or array can be converted
    to a prvalue.

    +   - For incomplete type, the conversion has undefined behavior.

    +   - For a class type T, glvalue should be either an object of type T or an object
    of a type derived from T.

    +   - The object should be initialized.

    +   - For a non-class type T, the type of the prvalue is without any const and/or
    volatile version of type T.

    +   - For a class type T, the type of the prvalue is T.'
