  md: "# 3.1. Lowest Common Ancestor (LCA) Problem\n\nWe denote the prefix bits in\
    \ the path number, those that correspond to edges on the path from the root, as\
    \ the *path bits* of the path number.\n\n+   1. First we calculate `path(u) XOR\
    \ path(v)` and find the left most bit which equals 1.\n+   2. If there is no such\
    \ bit then `path(u) = path(v)` and so `u = v`, so assume that the *k*'th bit of\
    \ the result is 1.\n+   3. If both the *k*'th bit in `path(u)` and the *k*'th\
    \ bit in `path(v)` are path bits, then this means that `u` and `v` agree on *k-1*\
    \ edges of their path from the root, meaning that the *k-1* prefix of each node’s\
    \ path number encodes the path from the root to `lca(u,v)`.\n\n![](img/78e1bff64796dccbf49e7c84b8201fb2_215_0.png)\n\
    \n**path(u) XOR path(v) =**\n\n```text\n  0010\nXOR 0111\n  ----\n  0101\n```\n\
    \nTherefore,\n\n`path(lca(u,v)) = 0100`\n\nwhere the first bit is the height bit\
    \ and the remaining bits are padded bits."
