    # 4.3. Max Sub-Array Problem


    # Problem


    Design and implement an efficient program to find a contiguous subarray within
    a one-dimensional array of integers which has the largest sum. Please note that
    there is at least one positive integer in the input array.


    # Kadane’s Algorithm


    There is scanning algorithm known as Kadane’s algorithm which keeps track of the
    maximum sum subarray by starting at the leftmost element and scanning through
    to the rightmost element. It works in a dynamic programming set-up because it
    has an optimal substructure, i.e., the maximum sum subarray up to the $(i-1)$th
    element is used to find maximum sum subarray up to $i$th element.


    The algorithm accumulates a partial sum in `max_ending_here` and updates the current
    maximum `max_so_far` appropriately. It is increased by the value contained in
    $i$th index as far as it keeps it positive, it is reset to zero otherwise.


    If all elements of an array are non-negative, this problem is trivial, as the
    entire array represents the solution. Similarly, if all elements are non-positive,
    the solution is empty with value 0. So we consider a data set containing both
    positive and negative values.'
