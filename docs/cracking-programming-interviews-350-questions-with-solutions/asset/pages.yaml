- pgno: 222
  md: '+   * *Hamming distance* : Allows only the operation of substituting a character,
    and each substitution has the unit cost.

    +   * *Longest common subsequence* : Measures the similarity between S1 and S2
    by the length of their longest common subsequence. This is in effect equivalent
    to allowing the edit operations of deleting or inserting a single character with
    the unit cost.


    For the sake of simplicity, we will consider two different kinds of edit distances:


    +   1. *Levenshtein edit distance* and

    +   2. *Damerau edit distance*.


    These two, and especially the *Levenshtein edit distance*, are the most commonly
    used forms of unit-cost edit distance.


    # **Levenshtein edit distance**


    The unit-cost *Levenshtein edit distance* between the strings S1 and S2 can be
    defined as the minimum number of single-character insertions, deletions and substitutions
    needed in transforming S1 into S2 or vice versa.


    For example, if S1 = “cat” and S2 = “act”, then there are two ways to transform
    S1 into S2 with exactly two operations:


    +   1. either

    +       a) delete S1[1] = ‘c’, i.e., “cat” ⟹ “at”

    +       b) insert a ‘c’ between the present S1[1] = ‘a’ and S1[2] = ‘t’, i.e.,
    “at” ⟹ “act”

    +   2. or.

    +       a) substitute S1[1] = ‘c’ with an ‘a’, i.e., “cat” ⟹ “aat”

    +       b) and substitute the present S1[2] = ‘a’ with a ‘c’, i.e., “aat” ⟹ “act”


    So, in either case, *Levenshtein edit distance*(S1, S2) is 2.


    # **Damerau edit distance**


    In similar fashion, the unit-cost *Damerau edit distance* can be defined as the
    minimum number of single-character insertions, deletions or substitutions or transpositions
    between two permanently adjacent characters that are needed in transforming S1
    into S2 or vice versa.


    Continuing with the same example of strings S1 = “cat” and S2 = “act”,'
