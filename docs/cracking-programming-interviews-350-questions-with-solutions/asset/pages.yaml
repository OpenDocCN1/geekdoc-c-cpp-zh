  md: '+   2. Let us denote $i^{th}$ row of the prefix array as $prefixa_i$, which
    stands for $a_1 + a_2 ... a_i$.

    +   3. Please note that $prefixa_i = prefixa_{i-1} + a_i$, where $i ∈ 1..n$. As
    described earlier, the computation of prefix array requires $mn$ additions. Hence

    +      $a_i = prefixa_i - prefixa_{i-1}$

    +   4. It is easy to see that the sum over the rows $l$ and $k$, i.e. $a[l..k]$
    can be computed as $a_l + a_{l+1} ... a_{k-1} + a_k =$

    +      $prefixa_l - prefixa_{l-1} +$

    +      $prefixa_{l+1} - prefixa_l +$

    +      ⋮

    +      $prefixa_{k-1} - prefixa_{k-2} +$

    +      $prefixa_k - prefixa_{k-1} =$

    +      $prefixa_k - prefixa_{l-1}$

    +      These consists of $m(m+1)/2$ pairs.

    +   5. Kadane''s 1D algorithm is applied on $prefixa_k - prefixa_{l-1}$ for each
    interval $[l,k]$ to find the maximum sum. Thus overall time complexity is $O(m^2
    n)$.


