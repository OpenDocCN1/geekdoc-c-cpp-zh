    # ## 2.6 Interpolation Search


    In binary search, the search space is always cut in half, which guarantees the
    logarithmic performance. However, if during the search we find a value that is
    very close to the number we are searching for, say, x, it seems more reasonable
    to continue the search in that neighborhood instead of blindly going to the next
    half point. In particular, if x is very small, we should start the search somewhere
    in the beginning of the sequence instead of at the halfway point.


    Interpolation search is a method of retrieving a desired record by key in an ordered
    sequence by using the value of the key and the statistical distribution of the
    keys.


    Consider the way we open a book when we are searching for a certain page number,
    say 200, and the book consists of 800 pages. Page 200 is thus around the one-fourth
    mark, and we use this knowledge as an indication of where to open the book. We
    will probably not hit page 200 on the first try; suppose that we get page 250
    instead. We now cut the search to a range of 250 pages, and we will presume that
    the desired page is at about the 80 percent mark between page 1 and 250. We now
    try to go back about (1/5)th of the way. We can continue this process until we
    get close enough'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'to page 200, that we can flip one page at a time. This is exactly the

    idea behind interpolation search. Instead of cutting the search space

    by a fixed half, we cut it by an amount that seems the most likely to

    succeed. This amount is determined by interpolation.


    Given a file of 1000 records with keys X_1 < X_2 < ... < X_1000 uniformly

    distributed between 0 and 1, our task is to find an index i | X_i = 0.7.

    It is reasonable to expect that about 0.7 × 1000 = 700 keys are less

    than or equal to 0.7 and the required record should be near the 700^{th}

    record.


    However, looking into the file may reveal that X_700 = 0.68 < 0.7.

    Although we have not retrieved the record, we can deduce that the

    desired index lies between 700 and 1000. The corresponding keys are

    uniformly distributed between 0.68 and 1. The new file contains 300

    records. P_2 = (0.7−0.68)/(1−0.68) = 0.0675 is the probability that these records

    have smaller or equal keys; therefore we should now look at the 300 ×

    0.0675 ≈ 20^{th} record of the new file.


    This process is continued by using the same method; at each iteration

    either the record is found or the length of the files is decreased.


    Interpolation search was first suggested by Peterson as a method for

    searching in sorted sequences stored in contiguous storage locations.'
