    The algorithm for matching nuts and bolts works as follows:


    +   - Find a c-approximate median s of the n given nuts (constant c will be determined
    later). This requires O(n) nut-and-bolt comparisons.

    +   - Find the bolt b corresponding to s.

    +   - Compare all nuts to b and all bolts to s. This gives two piles of nuts (and
