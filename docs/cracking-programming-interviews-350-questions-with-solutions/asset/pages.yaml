  md: "# Chapter 11\n\n# Namespaces\n\n# **Question 122**    unnamed namespace\n\n\
    What is *unnamed namespace*?\n\n# Solution of Question 122\n\nAn *unnamed-namespace*\
    \ is a namespace without any name with potential to replace usage of static keyword.\n\
    \nAn *unnamed-namespace-definition* behaves as if it were replaced by\n\n```\n\
    inline namespace unique { /* empty body */ }\nusing namespace unique;\nnamespace\
    \ unique { namespace-body }\n```\n\nwhere inline appears if and only if it appears\
    \ in the unnamed-namespace-definition, all occurrences of unique in a translation\
    \ unit are replaced by the same identifier, and this identifier differs from all\
    \ other identifiers in the entire program.\n\nAlthough entities in an *unnamed\
    \ namespace* might have external linkage, they are effectively qualified by a\
    \ name unique to their translation unit and therefore can never be seen from any\
    \ other translation unit.\n\n```\nnamespace\n{\n    int a;\n}\n\nvoid func()\n\
    {\n\n```"
