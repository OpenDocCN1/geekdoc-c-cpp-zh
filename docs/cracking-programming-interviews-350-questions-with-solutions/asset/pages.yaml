  md: '```

    Algorithm 35 Celebrity Algorithm Optimized

    1: Input : set S of n people

    2: Output : a celebrity, or no celebrity if there is no celebrity.

    3: Candidates ← S

    4: while |Candidates| > 0 do

    5:     Choose A and B | A ∈ Candidates and B ∈ Candidates

    6:     if A knows B then

    7:         Candidates ← Candidates - {A}

    8:     else

    9:         Candidates ← Candidates - {B}

    10:    end if

    11: end while

    12: Let C be the only remaining element of Candidates

    13: for all α ∈ S - {C} do

    14:     if α does not know C or C knows α then

    15:         return "No Celebrity"

    16:     end if

    17:     return C

    18: end for

    ```


    The first loop here runs *n - 1* times because every time around the loop we eliminate
    a possibility (and we stop when there is one possibility left). The second loop
    runs for *n - 1* times also because we let α take on |S| - 1 different values.
    Therefore the overall running time is in O(n).


    The elimination phase maintains a list of possible celebrities. Initially it contains
    all n people. In each iteration, we delete one person from the list. We exploit
    the following key observation: *if person 1 knows person 2, then person 1 is not
    a celebrity; if person 1 does not know person 2, then person 2 is not a celebrity.*
    Thus, by asking person 1 if he knows person 2, we can eliminate either person
    1 or person 2 from the list of possible celebrities. We can use this idea repeatedly
    to eliminate all people but one, say person. We now verify by brute force whether
    a celebrity: for every other person i, we ask person whether he knows person i,
    and we ask persons i whether they know person. If person always answers no, and
    the other people always answer yes, the we declare person as the celebrity. Otherwise,
    we conclude there is no celebrity in this group.


