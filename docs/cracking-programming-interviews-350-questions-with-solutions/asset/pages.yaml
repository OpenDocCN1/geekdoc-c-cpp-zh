    First try replacing the expression $a + 1$ by a fresh variable $b$ to yield


    $a^2 \le n < b^2$


    Clearly, $b$ must be greater than $a$ if this predicate is to be true. Moreover,
    the predicate can be established by executing $a \leftarrow 0$ and $b \leftarrow
    n+1$. Hence, $b$ is bounded by $a+1$ and $n+1$, and the invariant is


    $P: a < b \le n + 1 \land 0 \le a^2 \le n < b^2$


    The condition $B$ for the loop, obtained by investigating $P \land \neg B \Rightarrow
