  md: '# ## Improved Algorithm


    The root of the tree is a major bottleneck in the computation. Most of the information
    must pass through the root, but the root has only two connections and all leaves
    are at distance $h-1$ from it. If we cannot improve the connections, we should
    at least make the root as busy as possible. In the algorithm we just described,
    the root and the leaves are active for one step and then remain idle for about
    $2h$ steps. We can improve this algorithm by making all processors busy all the
    time. We do that by initiating new iterations in every step even before the previous
    iterations are completed. All those iterations will proceed in a pipeline fashion
    up and down the tree.


    The reason this pipeline improves the running time is the following. It takes
    $2h-2$ steps to select one pivot :


    +   - $h-1$ steps to reach the root, and

    +   - $h-1$ steps for the root to broadcast the result.


    If we start another tournament in the second step and run it in parallel to (but
    one step behind) the first one, then we can select two pivots in $2h-1$ steps.
    We can select $h$ pivots in $3h-2=O(\log n)$ steps. All those pivots can be used
    to eliminate elements. Thus instead of cutting the search space by about half
    with one pivot, we cut it to about $1/(h+1)$ of its original size with $h$ pivots
    and we do it without spending significantly more time. We can also interleave
    the different phases. The leaves start a new tournament at each step (until the
    $k$ smallest is found) and the tournament pushes the rest of the computation.


    An example of this process is given below (which proceeds from left to right top
    down).'
