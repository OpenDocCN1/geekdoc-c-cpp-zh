    # K-Maximum Sub-array problem


    # Problem


    Design and implement an efficient program to find the $K$ subarrays with largest
    sums. Please note that the maximum subarray problem for a one- or two-dimensional
    array is to find the array portion that maximizes the sum of array elements in
    it.


    Let us revisit our prefix array concept as $a[l..k] = prefixa[k] - prefixa[l -
    1]$. To find the maximum sub-array $a[l..k]$, we have to find the indices $l$
    and $k$ which maximizes sum of the entries $a[l..k]$. Let us denote $minprefixa[i]$
    as a minimum prefix array for the sub-array $a[0..i - 1]$. $max(a[l..k]) = max(prefixa[k]
    - prefixa[l - 1]) = max(prefixa[k] - minprefixa[k])$. So to compute the maximum
    sub-array all we need to do is to accumulate the prefix sums along with maintaining
    minimum of the preceding prefix sums which could be subtracted from the accumulated
    prefix sums to get the maximum sum so far.'
