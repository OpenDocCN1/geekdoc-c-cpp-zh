- pgno: 325
  md: 'to their parent node. The rank of the pivot is the number of 1s that are sent
    up. Summing *n* numbers up the tree is easy to do. The root can then broadcast
    the rank down the tree, and each leaf can determine whether or not its number
    should be eliminated. Overall, there are four *waves* of communication per iteration:


    +   1. up the tree to choose a pivot;

    +   2. down the tree to broadcast it;

    +   3. up the tree to compute its rank;

    +   4. down the tree to broadcast the rank.


    The problem is that, after some elements are eliminated, the tournament is no
    longer fair. In the extreme case, all elements in one-half of the tree, except
    for one, are eliminated. The remaining element in that half will be promoted to
    the root without competition. It will then be chosen with probability 1/2, while
    other elements are chosen with much smaller probabilities.


    We want to preserve the uniform randomness of the choice. We can preserve it in
    the following way.


    Processors associated with values that have been eliminated in previous rounds
    send up a *nil* value. Any element always wins against a *nil* value. Every competing
    element has an associated counter, which is initially 1. The counter indicates
    the number of (*real*) opponents that participated in the part of the tournament
    involving this element (i.e., the number of elements in the subtree that have
    not yet been eliminated). When an element wins a game at some node in the tree,
    it is promoted upward, and the losing element''s counter is added to its counter.
    Every game is now played with a biased coin according to the counters of the competing
    elements.


    For example, if *x* wins its first game (say, against *y*) and *z* advances by
    default, then *x*''s counter is 2 and *z*''s counter is 1. If *x* now plays against
    *z*, then the game is played with 2 : 1 bias toward *x*. Overall, *z* has a probability
    of 1/3 of winning this game, and both *x* and *y* have probability of 1/2 × 2/3
    = 1/3 of winning both their games. This process guarantees that the final choice
    is uniformly selected among the participating elements.


    # ## Complexity


    The number of (parallel) steps involved in each phase is equal to *four* times
    the height of the tree. Since this algorithm eliminates elements in exactly the
    same way as the sequential algorithm, the expected number of phases is still O(log
    *n*). The expected running time is thus O(log^2 *n*).'
