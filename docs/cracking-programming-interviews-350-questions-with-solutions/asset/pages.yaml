    \ in which the declaration is an alias-declaration declares the identifier to\
    \ be a alias template. An alias template is a name for a family of types. The\
    \ name of the alias template is a template-name.\n\nWhen a template-id refers\
    \ to the specialization of an alias template, it is equivalent to the associated\
    \ type obtained by substitution of its template-arguments for the template-parameters\
    \ in the type-id of the alias template.\n\nFor example\n\n```\n    1 template<class\
    \ T> struct Alloc { /* ... */ };\n    2 template<class T> using Vec = vector<T,\
    \ Alloc<T>>;\n    3 Vec<int> v; // same as vector<int, Alloc<int>> v;\n```\n\n\
