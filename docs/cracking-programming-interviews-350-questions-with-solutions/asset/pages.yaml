- pgno: 173
  md: '+   3. There is a majority color in the set $N \cup I$.

    +   4. $mc(S) = mc(N \cup I)$.


    # Notation


    +   * N ≡ *Not seen yet*

    +   * I ≡ *Identical colors*

    +   * D ≡ *Discarded*


    Here is the basic version of our algorithm:


    ```

    Algorithm 50 Find Majority Simple Algorithm

    1:  N ← S

    2:  I ← ∅

    3:  D ← ∅

    4:  while N ≠ ∅ do

    5:      if I == ∅ then

    6:          move one element from N to I

    7:      else

    8:          x ∈ N

    9:          y ∈ I

    10:         if same_color(x, y) then

    11:             move x from N to I

    12:         else

    13:             move y from I to D

    14:             move x from N to D

    15:         end if

    16:     end if

    17: end while

    18: return an arbitrary element of I

    ```


    # A simple representation of the algorithm


    Until now, we did not specify how the sets N, I, and D are represented. There
    turns out to be a very simple way to do this: Let the elements of S be stored
    in an array A[1...n]. We will use two indices i and j to represent the sets N,
    I, and D:


    +   1. $0 \leq i \leq j - 1 \leq n$

    +   2. $D = A[1..i]$

    +   3. $I = A[i + 1..j - 1]$

    +   4. $N = A[j..n]$'
