  md: "# 3.1. Lowest Common Ancestor (LCA) Problem\n\n+   - `lca(S)` precedes all\
    \ nodes in `S` in the tree's preordering, and follows all nodes in `S` in the\
    \ tree's postordering.\n+   - If `S = A ∪ B` with `A` and `B` both nonempty, then\
    \ `lca(S) = lca(lca(A), lca(B))`. For example, `lca(u,v,w) = lca(lca(u,v),w)`.\
    \ (The lca shares this property with the similar-sounding lowest common multiple\
    \ and greatest common divisor; and this property can be used to compute the lca\
    \ of arbitrarily large sets using only binary lca computations.)\n+   - `d(u,v)\
    \ = h(u) + h(v) − 2h(lca(u,v))`, where `d` represents the distance between two\
    \ nodes and `h` represents the height of a node.\n\n# Simple Solution\n\nGiven\
    \ `P` as parent of a node and `r` as the root of the tree, we can easily find\
    \ `lca` of the nodes `u` and `v` by computing the two sequences:\n\n+   1. `u,\
    \ P(u), P(P(u)), …, r`\n+   2. `v, P(v), P(P(v)), …, r`\n\nThe first element of\
    \ the longest common suffix of these two sequences is then trivially the `lca`.\n\
    \nTime complexity of this algorithm is `O(h)` where `h` is the height of the tree.\
    \ For a quite balanced tree, `h` is `O(log |V|)` else it is `O(|V|)` for a degenerate\
    \ tree.\n\n# C++ Implementation\n\n# Tree Structure\n\n*Program 3.1: Simple n-ary\
    \ tree*\n\n```\n```cpp\n#ifndef TREE_HPP\n#define TREE_HPP\n\n#include <memory>\n\
