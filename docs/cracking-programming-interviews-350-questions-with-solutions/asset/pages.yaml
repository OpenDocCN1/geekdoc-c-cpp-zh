    ```\n\n# ## 2.15 Mode of a Multiset\n\n# ### Problem\n\nLet S = (x₁, x₂, …, xₙ)\
    \ be a multiset of (not necessarily distinct) elements from a totally ordered\
    \ set. A *mode* of a multiset is defined as an element that occurs most frequently\
    \ in the multiset (there may be more than one mode). The number of times an element\
    \ occurs is called its *multiplicity*. The mode is thus the element with the highest\
    \ multiplicity.\n\n*Find a mode of a given multiset S.*\n\n# ### Solution\n\n\
    Our goal is to minimize the number of comparisons. One possible way to find the\
    \ mode is to use sorting. Once the elements are sorted, we can scan the sorted\
    \ sequence and count the multiplicities (equal elements will be consecutive in\
    \ the sorted sequence). We will see that sorting is not always necessary. The\
    \ reason for thinking that sorting may not be required is that finding the majority\
    \ can be done in linear time, whereas sorting requires *O(n log n)* time. This\
    \ leads us to suspect that, if the multiplicity of the mode is high, then there\
    \ may be a fast way of finding it without sorting."
