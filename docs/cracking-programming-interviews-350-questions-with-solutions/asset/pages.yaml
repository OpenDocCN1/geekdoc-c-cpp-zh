  md: '# Lemma


    Under the current naming conventions, $A_b^{(m)}$ is complete, and $A_b^{(m-1)}$
    is almost complete. Furthermore, the missing number in $A_b^{(m-1)}$ is obtained
    from the missing number in $A_b^{(m)}$ by removing the least significant bit (i.e.,
    shift right).


    # Proof


    First we will see an example and then make a formal proof. To use the previously
    given example with $n=10$, $m=4$, missing number $6=0110_b$, and $A$ as


    ![](img/78e1bff64796dccbf49e7c84b8201fb2_183_0.png)


    the two derived subarrays: $A_0^{(3)}$ and $A_1^{(3)}$ are respectively:


    ![](img/78e1bff64796dccbf49e7c84b8201fb2_183_1.png)


    ![](img/78e1bff64796dccbf49e7c84b8201fb2_183_2.png)


    Obviously, $A_0^{(3)}$ is almost complete and $A_1^{(3)}$ is complete: column
    $\{0\ 1\}$ is missing from it. The last significant bit of the missing number
    in $A$ is 0; if we did not know which is the missing number, we could deduce that
    its least significant bit is 0 by computing the aforementioned $\Delta=5-5=0$.
    Indeed, $A_0^{(3)}=A^{(3)}$ is the array that is almost complete. And indeed the
    missing number in it $0110_b$ is obtained from $0110_b$ by shift right.


    Let us prove it. It is clear that if $A$ is a complete array of size $n$, both
    $A_0^{(m-1)}$ and $A_1^{(m-1)}$ are not complete. If $n$ is odd then they contain
    the same columns (possibly in different order left to right), otherwise $A_1^{(m-1)}$
    contains one column more and the other columns are the same.'
