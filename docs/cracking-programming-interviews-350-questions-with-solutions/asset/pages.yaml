  md: '+   - *randomized*


    A *deterministic algorithm* is one that always behaves the same way given the
    same input: the input completely determines the sequence of computations performed
    by the algorithm.


    Normally, when we talk about the running time of an algorithm, we mean the worst-case
    running time. This is the maximum, over all problems of a certain size, of the
    running time of that algorithm on that input:


    $T_{worst-case}(n) = max_{X:|X|=n} T(X)$


    On extremely rare occasions, we will also be interested in the best-case running
    time:


    $T_{best-case}(n) = min_{X:|X|=n} T(X)$


    So let us try understanding the meaning of *average case*. The average-case running
    time is best defined by the expected value, over all inputs X of a certain size,
    of the algorithm''s running time for X:


    $T_{average-case}(n) = E_{X:|X|=n}[T(X)] = Σ_{|X|=n} T(X).Pr[X].$


    *Randomized algorithms*, on the other hand, base their behavior not only on the
    input but also on several random choices.


    The same randomized algorithm, given the same input multiple times, may perform
    different computations in each invocation. This means, among other things, that
    the running time of a randomized algorithm on a given input is no longer fixed,
    but is itself a random variable.


    When we analyze randomized algorithms, we are typically interested in the worst-case
    expected running time. That is, we look at the average running time for each input,
    and then choose the maximum over all inputs of a certain size:


    $T_{worst-case expected}(n) = max_{X:|X|=n} E[T(X)].$


    It''s important to note here that we are making no assumptions about the probability
    distribution of possible inputs. All the randomness is inside the algorithm, where
    we can control it.


    Suppose we want to find the nut that matches a particular bolt. The obvious algorithm
    can be: test every nut until we find a match. This requires exactly *n - 1* tests
    in the worst case. We might have to check every bolt except one; if we get down
    the the last bolt without finding a match, we know that the last nut is the one
    we are looking for.


    As far as time complexity of this algorithm is concerned, this algorithm will
    look at approximately *n/2* nuts on average.'
