    \ simultaneously finding maximum and minimum of the sequence?\n\nNaively, we can\
    \ get this done in two passes : once for finding maximum and another for finding\
    \ minimum : total of 2n - 2 comparisons. But we can definitely do better if we\
    \ confine ourselves to a single pass and reply on maintaining maximum and minimum\
    \ elements seen so far. Instead of picking one element and probing it against\
    \ the current maximum or minimum, we can rather examine two elements at a time\
    \ treating them as pairs. The process goes like this:\n\n+   1. Maintain the minimum\
    \ and maximum of elements seen so far.\n+   2. Don't compare each element to the\
    \ minimum and maximum separately, which requires two comparisons per element.\n\
    +   3. Pick up the elements in pairs.\n+   4. Compare the elements of a pair to\
    \ each other.\n+   5. Then compare the larger element to the maximum so far, and\
    \ compare the smaller element to the minimum so far.\n\nThe above requires only\
    \ three comparisons per two elements. Setting up the initial values for the min\
