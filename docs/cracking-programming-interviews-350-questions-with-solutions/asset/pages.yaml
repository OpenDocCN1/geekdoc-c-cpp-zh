    # Solution


    We will solve this using dynamic programming. Let $start(T_j)$ and $end(T_j)$
    denote the start and end time, respectively, of interval $T_j$. First, sort the
    intervals in increasing order of start time. This takes $O(n \log n)$ time. Of
    course, we can avoid this step if the intervals are already sorted in this order.
    This seems reasonable since the recorder encounters the time intervals in increasing
    order of their start times.


    Our subproblems have the following form: find a non-overlapping set of intervals
    $S = \{T_j, T_{j+1}, \ldots, T_n\}$ such that the quantity (henceforth called
    the objective function)


    $$\sum_{T_i \in S} m_i$$


    is maximized. Thus, there are $n$ subproblems, one for each $1 \leq j \leq n$.
    Let $n_j$ be the smallest value of $j''$ such that $start(T_{j''}) > end(T_j)$.
    That is, if the instrument is played during interval $T_j$, then the earliest
    interval that the instrument can be played next is $T_{n_j}$. Let $\phi_j$ be
    the maximum value of the objective function for the subproblem $\{T_j,T_{j+1},\ldots,T_n\}$.
    The answer to the original problem is $\phi_1$.


    In any optimal subset of non-overlapping intervals for the subproblem $\{T_j,T_{j+1},\ldots,T_n\}$,
    there are two possible cases for time interval $T_j$. It is easy to see that the
    objective function for both these cases.


    **Case 1:** The instrument is not played during interval $T_j$. Then, the value
    of the objective function for the optimal subset is equal to $\phi_{j+1}$.


    **Case 2:** The instrument is played during interval $T_j$. Then, the earliest
    interval during which it can be played next is $T_{n_j}$. In this case, the value
    of the objective function for the optimal subset is $m_j + \phi_{n_j}$.


    Combining the above two cases, we have


    $$\phi_j = \max(\phi_{j+1}, m_j + \phi_{n_j})$$


