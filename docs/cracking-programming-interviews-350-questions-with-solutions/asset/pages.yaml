- pgno: 217
  md: 'been changed to protect the guilty. The photographer stealthily takes pictures
    of Clintwood, and he marks each picture with the time *t* it was taken. Roll tells
    the photographer to mark each especially scandalous pictures with a big, red X,
    because these pictures will be used in future negative advertisements. Roll requires
    a data structure that contains the Clintwood pictures and supports the following
    operations:


    +   - **INSERT(x):** Inserts picture *x* into the data structure. Picture *x*
    has an integer field `time[x]` and a boolean field `scandalous[x]`.

    +   - **DELETE(x):** Deletes picture *x* from the data structure.

    +   - **NEXT-PICTURE(x):** Returns the picture that was taken immediately after
    picture *x*.

    +   - **SCANDALOUS(t):** Returns the first scandalous picture that was taken after
    time *t*.


    Describe an efficient implementation of this data structure. Show how to perform
    these operations, and analyze their running times. Be succinct.


    # Solution


    To allow us to implement these operations efficiently, we’ll use a *red-black
    tree* representation keying photographs by time, and augmenting each node *x*
    with these additional fields:


    +   - `scandalous?[x]`

    +   - `max − scand − time[x]`


    The field *max − scand − time[x]* stores the time when the latest scandalous picture
    in the subtree rooted at *x* was taken. It contains either an integer time, or
    NIL if there are no scandalous pictures in the subtree. We implement the operations
    (all in *O(log n)* running time) on this data structure as follows:


    +   - **INSERT(x):** Place *x* in the tree, keyed by `time[x]`, just like in a
    regular red-black tree. Update `max − scand − time` fields if necessary after
    rotations. This can be done in *O(1)* time.

    +   - **DELETE(x):** Just like INSERT(x); do what’s normally done in a red-black
    tree, taking care to fix `max − scand − time` fields after deleting node *x*.
    When a node is encountered where `max − scand − time[n] = time[x]` and `scandalous?[x]
    = TRUE`, look at the node’s children and set `max − scand − time[n] ← max(max
    − scand − time[right[n]], max − scand − time[left[n]])`.

    +   - **NEXT-PICTURE(x):** Just like SUCCESSOR(x) in a red-black tree.'
