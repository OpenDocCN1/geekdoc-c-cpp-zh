  md: '# # Chapter 13


    # # Classes


    # ## \*\* Question 172    trivial class


    What is a *trivial class*?


    # ### Solution of Question 172


    A trivially copyable class is a class that:


    +   - has no non-trivial copy constructors,

    +   - has no non-trivial move constructors,

    +   - has no non-trivial copy assignment operators,

    +   - has no non-trivial move assignment operators, and

    +   - has a trivial destructor


    A *trivial class* is a class that has a default constructor, has no non-trivial
    default constructors, and is trivially copyable. In particular, a trivially copyable
    or trivial class does not have virtual functions or virtual base classes.


    # ## \*\* Question 173    *this* pointer


    What is *this* pointer?


    # ### Solution of Question 173


    In the body of a non-static member function, the keyword *this* is a *private*
    expression whose value is the address of the object for which the function is
    called.


    +   - The type of *this* in a member function of a class X is X*.

    +   - If the member function is declared const, the type of *this* is const X*.'
