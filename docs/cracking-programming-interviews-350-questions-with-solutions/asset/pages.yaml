  md: 'by a divide and conquer algorithm that compares the medians of the two arrays
    and then discards the lower half of the array with the smaller median and the
    upper half of the array with the bigger median. The algorithm proceeds likewise
    until both arrays are reduced to 2 elements each. Then we solve the reduced problem
    in constant time. In case the size is odd, by upper and lower half we mean, the
    subarray from one end until and excluding the median. It is easy to show this
    dichotomy brings the size of the array down to 2 regardless of what the initial
    n is, because the iterator n ← n/2 reaches 2 regardless of the starting value
    of n.


    Now consider a more general version of this problem where the arrays are X[1,
    . . . , p] and Y[1, . . . , q] for possibly unequal values of p and q. Let us
    call Z the array that would be obtained if we merged X and Y. Let m = p + q. The
    essence is the fact that we can check in Θ(1) time whether X[i] is the median
    of Z, for any i such that 1 ≤ i ≤ p. According to our definition of median, the
    median is greater than or equal to [m] elements of an m-element array. Having
    that in mind, clearly if X[i] is the median then:


    +   - X[i] is greater than or equal to i - 1 elements of X.

    +   - X[i] is greater than or equal to j = [m] - i + 1 elements of Y.


    It takes only constant time to check if Y[j] ≤ X[i] ≤ Y[j + 1]. To avoid excessive
    boundary checks, pad X and Y at the left side with -∞ and with +∞ at the right
    side. If that is fulfilled we have found the median and it is X[i]. Otherwise,
    we binary search in X to see if the median is in X. If that fails, the median
    must be from Y, and we can repeat the analogous process with X and Y swapped.


    ```

    Algorithm 55 Find Median of two sorted array

    1: function COMMON-MEDIAN(X[1, ..., p], Y[1, ..., q]) ▷ sorted arrays

    2:     m ← p + q

    3:     k ← MEDIAN-BIN-SEARCH(X, Y, 1, p)

    4:     if k > 0 then

    5:         return X, k

    6:     end if

    7:     k ← MEDIAN-BIN-SEARCH(Y, X, 1, q)

    8:     return Y, k

    9: end function

    ```'
