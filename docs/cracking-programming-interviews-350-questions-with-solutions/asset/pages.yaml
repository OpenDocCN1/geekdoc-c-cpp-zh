    $L$ had a carry. The final sum $S_C$ is the same as $S$, except that $L$ is replaced
    by $L_C$.


    We solve a problem of size $n$ by two subproblems of size $n/2$ and a constant
    number of conquer steps. Since the two subproblems can be solved in parallel;
    assuming that the processors can access different bits independently; we obtain
    the recurrence relation:


    $T(n,n)=T(n/2,n/2)+O(1)$


    which implies that


    $T(n,n)=O(\log n)$


    # 7.2 Find Maximum


    # Problem Description


    Find the maximum among $n$ distinct numbers, given in an array.


    # Solution


    The straightforward sequential algorithm for finding the maximum requires $n-1$
    comparisons. We can think of a comparison as a game played between two numbers,
    with the larger of the two winning.


    The maximum finding problem is thus equivalent to running a tournament with the
    winner being the maximum of the whole set.


    An efficient way to run a tournament in parallel is to use a tree. The players
    are divided into pairs for the first round with possibly one player sitting out,
    in case of an odd number of players; all the winners are again divided into pairs,
    and so on, until the finals.


    The number of rounds is $\lceil\log_2 n\rceil$.


    We can obtain a parallel algorithm from the tournament by assigning a processor
    to every game thinking of the processor as the referee of the game. We have to
    ensure, however, that each processor knows the two competing numbers. This can
    be arranged by putting the winner of the game in the larger indexed position of
    the two players. That is, if the'
