    the following problem:


    > which modifications of the inversion value correspond to a swap of neighbors


    Each swap of two neighbors changes exactly one inversion[i] value by 1, viz. with
    i == the larger of the two values swapped. The value of inversion[i] is to be
    increased if the swap increases the number of inversions; otherwise it is to be
    decreased.


