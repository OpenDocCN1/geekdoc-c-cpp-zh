  md: '# Chapter 7


    # Parallel Algorithms


    # 7.1  Parallel Addition


    # Problem Description


    Find the sum of two n-bit binary numbers.


    # Solution


    The regular sequential algorithm starts at the least significant bits, and adds
    two bits at a time with a possible carry. It seems that we cannot be sure of the
    outcome of the ith step until the two i − 1 least significant bits are added,
    since there may or may not be a carry. Nevertheless, it is possible to design
    another algorithm.


    We use induction on n. It will not help much to go from n−1 to n, since this implies
    an iterative sequential algorithm. The divide and conquer approach has a much
    better potential for parallel algorithms, since it may be possible to solve all
    smaller parts in parallel.


    Suppose that we divide the problem into two subproblems of size n/2 assuming that
    n is a power of 2 for simplicity. We can find the sums of the two pairs in parallel.
    But we still have the problem of the carry. If the sum of the least significant
    pair has a carry, we have to change the sum of the most significant pair.


    The key observation here is that there are only two possibilities: we either have
    a carry or we do not. Therefore, we can strengthen the induction hypothesis to
    include both cases.


    The modified problem is to find the sum of the two numbers with and without an
    initial carry.


    Suppose that we now solve this modified problem for both pairs. We get four numbers:


    +   1. **L**: the sum of the least significant pair with no initial carry.'
