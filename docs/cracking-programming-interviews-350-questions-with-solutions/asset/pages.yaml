  md: "# Partitioning\n\nIt is very much clear by now that the key part in this algorithm\
    \ is *partition* step as it is in *quicksort*. So before we jump to *randomized\
    \ part*, let us go through *deterministic version*.\n\n```\n```text\nAlgorithm\
    \ 69 Partitioning a sequence\n1: function PARTITION(a, l, r)\n2:     p ← a[r]\n\
    3:     i ← l − 1\n4:     for j ← l, r − 1 do\n5:         if a[j] ≤ p then\n6:\
    \             i ← i + 1\n7:             swap(a[i], a[j])\n8:         end if\n\
    9:     end for\n10:    return i + 1\n11: end function\n```\n```\n\n*partition*\
    \ always selects the last element a[r] in the sequence a[l..r] as the *pivot*:\
    \ partitioning element. It partitions the sequence into four regions, some of\
    \ which may be empty.\n\n**Loop Invariant:**\n\n+   - ∀x ∈ a[l..i] : x ≤ *pivot*\n\
