  md: '# Algorithm 43 The Welfare Crook Program


    ```

    1: function WELFARE-CROOK(f, g, h)

    2:     i ← 0; j ← 0; k ← 0;

    3:     while f[i] ≠ g[j] and g[j] ≠ h[k] do

    4:         if f[i] < g[j] or f[i] > h[k] then

    5:             i ← i + 1

    6:         else if g[j] < h[k] or g[j] < f[i] then

    7:             j ← j + 1

    8:         else if h[k] < f[i] or h[k] < g[j] then

    9:             k ← k + 1

    10:        end if

    11:    end while

    12: end function

    ```


    The above program can be simplified to:


    # Algorithm 44 The Welfare Crook Program Simplified


    ```

    1: function WELFARE-CROOK(f, g, h)

    2:     i ← 0; j ← 0; k ← 0;

    3:     while f[i] ≠ g[j] and g[j] ≠ h[k] do

    4:         if f[i] < g[j] then

    5:             i ← i + 1

    6:         else if g[j] < h[k] then

    7:             j ← j + 1

    8:         else if h[k] < f[i] then

    9:             k ← k + 1

    10:        end if

    11:    end while

    12: end function

    ```


    Upon termination: f[i] = g[j] = h[k] and the following hold:

    i = iᵥ and j = jᵥ and k = kᵥ.


