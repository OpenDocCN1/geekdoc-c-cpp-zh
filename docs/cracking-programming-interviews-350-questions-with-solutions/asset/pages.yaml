  md: '![](img/78e1bff64796dccbf49e7c84b8201fb2_203_0.png)


    In the tree drawn above, $a(i)=\{i,e,b,a\}$.


    The set of common ancestors $ca(u,v)$ of nodes $u$ and $v$ is defined as


    $$ca(u,v)=a(u)\cap a(v)$$


    The lowest common ancestors $lca(u,v)$ is a common ancestor of $u$ and $v$ with
    maximal depth, i.e. e-order common ancestors $ca(u,v)=\{x_1,\ldots,x_k\}$ according
    to their level:


    $$l(x_1)<l(x_2)<\ldots<l(x_k)$$


    where $l(u)$ is the level of a node, $x_1$ is the root vertex $r$ and $x_k$ is
    the least common ancestor.


    Properties of the lowest common ancestor can be summarized as:


    +   - $lca(\{u\})=u$


    +   - **Identity:** $\forall u\in V:lca(u,u)=u$


    +   - **Commutativity:** $\forall u,v\in V:lca(u,v)=lca(v,u)$


    +   - Number of different lca pairs


    $$\binom{n}{2}=\frac{n(n-1)}{2}$$


    +   - If neither $u$ nor $v$ is an ancestor of the other, then $u$ and $v$ lie
    in different immediate subtrees of $lca(u,v)$, i.e., the child of the $lca$ of
    which $u$ is a descendant is not the same as the child of the $lca$ of which $v$
    is a descendant. Please note that the $lca$ is the only node in the tree for which
    this is true.


    +   - The entire set of common ancestors of $S=\{v_1,v_2,\ldots,v_n\}$ is given
    by $lca(S)$ and all of its ancestors all the way up to the root of the tree. In
    particular, every common ancestor of $S$ is an ancestor of $lca(S)$.'
