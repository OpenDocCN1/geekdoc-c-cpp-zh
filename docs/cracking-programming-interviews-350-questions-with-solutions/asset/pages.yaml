    \ $S_1[i]$ and $S_2[j]$. Hence, to fill in one cell takes a constant number of\
    \ cell examinations, arithmetic operations and comparisons. Because there are\
    \ $m × n$ cells in the table computed above, so total time complexity of $D(m,n)$\
    \ is $O(mn)$.\n\n# ### Recurrence : Computing the Damerau edit distance\n\n+ \
    \  - $D(i,0)=i$\n+   - $D(0,j)=j$\n\nThen $D(i,j)$ is one of the following three\
    \ possibilities:\n\n+   1. $D(i-1,j-1)$ if $S_1[i] == S_2[j]$\n+   2. $1 + min(D(i-2,j-2),D(i-1,j),D(i,j-1))$\
    \ if $S_1[i-1..i] == reverse(S_2[j-1..j])$\n+   3. $1 + min(D(i-1,j-1),D(i-1,j),D(i,j-1))$\
    \ otherwise.\n\nWe leave the implementation of this algorithm as an exercise to\
    \ the reader.\n\n# ### Space Optimization\n\nThese basic dynamic programming algorithms\
    \ clearly have a run time and space consumption of $O(mn)$, as they fill $O(mn)$\
    \ cells and filling a single cell takes a constant number of operations and space.\
    \ It is simple to diminish the needed space into $O(m)$ when column-wise filling\
    \ order of $D$ is used. When column $j$ is filled, only the cell values in one\
    \ or two previous columns are needed, depending on whether the Levenshtein or\
    \ the Damerau distance is used. This means that it is enough to have only column\
    \ $(j-1)$ or also column $(j-2)$ in memory when computing column $j$, and so the\
    \ needed space is $O(m)$."
