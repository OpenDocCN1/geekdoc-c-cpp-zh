    \n+   - Sequence $s_1$ is less than sequence $s_2$, written as\n+   \n+     $s_1.\
    \ < s_2$, if, when viewed as decimal numbers with the decimal point to the extreme\
    \ left, $s_1$ is less than $s_2$.\n+   \n+     For example, $101. < .1011$ because\
    \ $.101 < .1011$.\n+   \n+   - In a similar manner, we write $101. = .101000$,\
    \ because $.101 = .101000$. Appending a *zero* to a sequence yields an equal sequence;\
    \ appending a *one* yields a larger sequence.\n+   \n+   - Any *good sequence*\
    \ $s$ to be printed satisfies $0. < s < .00001$, and must begin with 00000.\n\n\
    The program below iteratively generates, in order, all *good sequences* satisfying\
