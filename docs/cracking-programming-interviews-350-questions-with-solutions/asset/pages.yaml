  md: '*u* knows person *v*. We define a *sink* of a directed graph to be a vertex
    with indegree n - 1 and outdegree 0.


    *A celebrity corresponds to a sink of the graph.*


    We note that a graph can have at most one sink. The input to the problem corresponds
    to an n × n adjacency matrix, whose ij entry is 1 if the i^th person knows the
    j^th person, and 0 otherwise.


    With this formulation, the problem can be reworded as:


    > > *Given an n × n adjacency matrix, determine whether there ∃ an i | all the
    entries in the i^th column (except for the (ii)^th entry) are 1, and all the entries
    in the i^th row (except for the (ii)^th entry) are 0.*


    **Inductive approach** The base case of two persons is simple. Let us consider
    the difference between the problem with n - 1 persons and that with n persons.
    We assume that we can find the celebrity among the first n - 1 persons by induction.
    Since there is at most one celebrity, there are three possibilities :


    +   1. the celebrity is among the first n - 1

    +   2. the celebrity is the n^th person, or

    +   3. there is no celebrity.


    The first case is the easiest to handle. We need only to check that the n^th person
    knows the celebrity, and that the celebrity does not know the n^th person. The
    other two cases are more difficult because, to determine whether the n^th person
    is the celebrity, we may need to ask 2(n - 1) questions. If we ask 2(n - 1) questions
    in the n^th step, then the total number of questions will be n(n - 1), which is
    what we are trying to avoid so far ! We definitely need another approach.


    The trick here is to consider the problem backward. It may be hard to identify
    a celebrity, but it is probably easier to identify someone as a non-celebrity.
    After all, there are definitely more non-celebrities than celebrities. If we eliminate
    someone from consideration, then we reduce the size of the problem from n to n
    - 1. Moreover, we do not need to eliminate someone specific; anyone will do. Suppose
    that we ask Alice whether she knows Bob. If she does, then she cannot be a celebrity;
    if she does not, then Bob cannot be a celebrity. We can eliminate one of them
    with one question.


    We now consider again the three cases with which we started. We do not just take
    an arbitrary person as the n^th person. We use the idea in the last paragraph
    to eliminate either Alice or Bob, then solve the problem for the other n - 1 persons.
    We are guaranteed that case 2 will not occur, since the person eliminated cannot
    be the celebrity.'
