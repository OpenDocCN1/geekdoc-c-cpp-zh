    # ** Question 38    linkage


    What is linkage ?


    # Solution of Question 38


    When a name, introduced by a declaration in another scope, related to anyone of
    the following refers to the same


    +   - object

    +   - reference

    +   - function

    +   - type

    +   - template

    +   - namespace

    +   - value


    then it is said to have a *linkage*.


    There are two types of linkages:


    +   1. *external linkage*

    +       When a name denotes an entity which can be referred to by names from either
    of these units

    +       a) scopes of other translation units, or

    +       b) other scopes of the same translation unit.

    +       then it is said to have an *external linkage*.

    +       For example

    +       - the name of a variable declared by a block scope *extern* declaration.

    +       - a member function, static data member, a named class or enumeration
    of class scope, or an unnamed class or enumeration defined in a class-scope typedef
    declaration such that the class or enumeration has the typedef name for linkage
    purposes, has external linkage if the name of the class has external linkage.

    +       - All namespaces except an unnamed namespace or a namespace declared directly
    or indirectly within an unnamed namespace.'
