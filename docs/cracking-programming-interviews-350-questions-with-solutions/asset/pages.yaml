    # **Reduction to Single Source Shortest Path Problem**


    The solution given by dynamic programming approach involves constructing a table
    of size m × n , where each entry correspond to a *partial edit* and the goal is
    to compute the *rightmost bottom entry*, i.e., D(m,n), of the table.


    Another way to look at the problem is to consider each entry of the table as a
    vertex of a directed graph. Thus a vertex corresponds to a *partial edit*. There
    is an edge (i, j) if the partial edit corresponding to j involves one more edit
    operation than the partial edit corresponding to i . A simplified directed graph
    may depict insertions as horizontal edges, deletions as vertical edges and substitutions(or
    replacements) as diagonal edges.


    Hence the string edit distance problem is reduced to a single source shortest
    path problem as finding a shortest path from the vertex (0,0) to the vertex (m,n).
    We leave the implementation details as an exercise to the reader.


