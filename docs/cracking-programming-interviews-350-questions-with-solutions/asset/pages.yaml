  md: "If the function is omitted the rest of the program prints *10* and *20* respectively.\n\
    \n# **Question 152**     type of function\n\nIs the following statement true?\n\
    \nThe type of the functions denoted by\n\n`int (*)(const int p, decltype(p)*)`\n\
    \nis same as that by\n\n`int (*)(int, const int*)`\n\n# Solution of Question 152\n\
    \nYes. Because the type of a function is determined using the following rules:\n\
    \n+   - The type of each parameter (including function parameter packs) is determined\
    \ from its own *decl-specifier-seq* and *declarator*.\n+   \n+   - After determining\
    \ the type of each parameter, any parameter of type *array of T* or *function\
    \ returning T* is adjusted to be *pointer to T* or *pointer to function returning\
    \ T*, respectively.\n+   \n+   - After producing the list of parameter types,\
    \ any top-level cv-qualifiers modifying a parameter type are deleted when forming\
    \ the function type.\n+   \n+   - The resulting list of transformed parameter\
    \ types and the presence or absence of the ellipsis or a function parameter pack\
    \ is the function’s *parameter-type-list*.\n\nPlease note that this transformation\
    \ does not affect the types of the parameters.\n\n# **Question 153**     type\
