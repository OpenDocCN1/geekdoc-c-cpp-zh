  md: '# ### 2.3. The Welfare Crook Problem


    people on welfare in New York City. Practically speaking, all three lists are
    endless, so no upper bounds are given. It is known that at least one person is
    on all three lists. Write a program to locate the first such person, i.e., the
    one with the alphabetically smallest name.


    # Solution


    To get at the essence of the problem, consider searching three ordered arrays
    (with no upper bound) $f[0..\infty]$, $g[0..\infty]$, and $h[0..\infty]$ for the
    least value that is on all three of them; this least value is known to exist.
    Since the lists $f$, $g$ and $h$ are fixed, we will use the fact that they are
    alphabetically ordered. Using $iv$, $jv$ and $kv$ to denote the least values satisfying


    $$f[iv] = g[jv] = h[kv]$$


    So the postcondition can be written as


    $$i = iv \text{ and } j = jv \text{ and } k = kv$$


    and, invariant looks like


    $$0 \leq i \leq iv \text{ and } 0 \leq j \leq jv \text{ and } 0 \leq k \leq kv$$


    And the bound function is


    $$t = iv - i + jv - j + kv - k$$


    The initialization is $i \leftarrow 0, j \leftarrow 0, k \leftarrow 0$.


    The simplest ways to decrease the bound function are $i \leftarrow i + 1, j \leftarrow
    j + 1, k \leftarrow k + 1$.


    The relation $i + 1 \leq iv$, together with the invariant mentioned above, means
    that $f[i]$ is not the crook and this is true if $f[i] < g[j]$. Since the crook
    does not come alphabetically before $g[j]$, if $f[i]$ comes alphabetically before
    $g[j]$, then $f[i]$ cannot be the crook.


    Similarly, if $g[j] < h[k]$ is also possible.


    So, the program looks like:'
