    # C++ 语言比其他语言增长更快：计算机编程入门简单上手方法 引言


    计算机编程是设计和编写计算机程序的过程。作为一种技能组合，它包含了许多不同的任务和技术，但我们的教程并不打算向你展示所有内容。相反，它们的目的是提供基础的、实用的技能，帮助你理解并编写反映你在世界中所看到的和使用的属性的代码。


    ## 你想要了解


    我们的编程教程假设你完全没有任何编程经验。然而，它们确实要求你对计算机和网络浏览器的使用有基本的了解。例如，你应该习惯于下载和打开文件，并使用文本编辑软件。如果你对这些技能没有信心，可以考虑先花些时间学习这些教程：


    - 计算机基础

    - 互联网基础


    只要你对这些基础了于胸，就应该准备好开始学习编程了。


    ## 这些教程将涵盖的内容


    这些教程专门针对一种特定的编程：Web 开发。当你访问网站时，无论你使用的是笔记本电脑、智能手机还是任何设备，你实际上都在看代码，这些代码可能是由互联网开发者编写的，并且你的浏览器正在解释这些代码，以便你在屏幕上看到你看到的内容。这些教程将向你展示如何开始编写
    Web 开发中使用的三种常用代码，这些代码共同构成了你每天看到的典型网站：HTML、CSS 和 JavaScript。


    ## 网站的组成部分


    想象你访问的每个网站都可能是一个人。每个人在外观、行为和说话方式上都是不同的，但它们通常由等同的基础部分组成。


    ### HTML


    如果你将一个网站想象成个人，那么你会认为 HTML 是它的骨架。HTML 是你在网页上看到的几乎所有内容的核心。虽然它本身看起来没什么什么，但它构成了基石，所有其他部分都建立在其之上。一个特别简单的网站的
    HTML 可能看起来像这样：


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>一个极其简单的网站</title>

    </head>

    <body>

    <p>这是一个极其简单的网站。</p>

    </body>

    </html>

    ```


    ## C++ 语言比其他语言增长更快


    C++ 编程语言已经存在了很长一段时间，这表明它已经积积了大量的遗留代码。但这种语言的持续流行不仅仅是因为开发者试图维护旧的应用程序和平台；正如 TIOBE
    指数的最新更新所表明的，C++ 正在积极增长。具体而言，C++ 在过去的 12 个月中增长了 1.48%，达到（根据 TIOBE 的估计） 7.11% 的市场份额。这看起来可能不是爆炸式的增长，但它击败了列表上的每一种“大”语言，包括一直流行的
    Python（它在过去一年中增长了 0.59%）。虽然 C++ 目前在 TIOBE 总排名中位第四，但 C 排名第一（占比 15.95%），已经超过了 Java（占比
    13.48%）。


    C++ 强劲表现背后的原因是什么？这是一个棒的问题，但伴随排名的注释表明最近的一些更新与此有关：“我认为新的 C++20 标准可能是导致这一现象的原因之一。特别是新的模块功能，它正在取代极其糟糕的
    include 机制。C++ 以积极的态势优于诸如 R (+1.33%) 和 C# (+1.18%) 等其他语言。”


    为了获得其排名，TIOBE 利用了来自多个聚合器和搜索引擎的数据，包括 Google、Wikipedia、YouTube 和 Amazon。一种语言要进入排名，必须是图灵完备的，拥有自己的
    Wikipedia 词条，并在 Google 上搜索“programming”时获得至少 5,000 次点击。这种方法多年来吸引了一批批评者，他们认为排名与其说是衡量这些语言的“热度”，不如说是实际使用量。无论如何，Python
    和 C++ 这样的“大”语言倾向于保持在高排名，而较小的语言往往会经历排名的剧烈波动。


    C++ 起源于“带类的 C”，但在过去的几十年里，它已经成功地远离了 C 语言。如果你正在学习这种语言，它还有详尽的文档（你将购买官方标准）以及许多教程和课程。


    计算机编程入门简单上手方法


    计算机病毒是由计算机必须执行的一系列指令构的。这些指令可能包含存储这些指令所需的其他重要数据。因此，编程方法涉及指令的定义，以及数据的定义。为了让计算机返回数据，你必须熟悉编程基础，以及关于数据的三个基本要素：


    1. 需要执行的指令。

    2. 执行这些指令的顺序。

    3. 执行指令所需的数据。


    编程的第一阶段基本上涉及纸面处理。在这个阶段，你甚至不需要使用计算机，然而，如果你使用文字处理系统，你就可以将工作写到计算机文件中而不是纸上。你会尝试这样做，这样在你开始指示电脑执行之前，你就能清楚、更具体地发现你想让计算机执行什么。


    请记住，计算机将完全按照给出的指令执行。它不能理解你想要什么；它只会执行你想让它尝试做的事。因此，在你的程序进入计算机之前，你想要尝试几个步骤，包括：


    - 定义问题：在指示计算机尝试这样做之前，你希望先熟悉它。你想清楚地告诉计算机它必须完成什么，或者通过它执行的所有活动得到。

    - 识别答案：如果你已经知道计算机将产生什么结果，你应该深入检查你拥有的知识，并确定你所需的知识。你还需要定义逻辑过程、方程和其他方法，以便你处理原始输入文件并你想实现的最终结果。

    - 映射答案：编程的阶段必须按照正确的顺序排列。不要忘记动作的顺序对于动作本身同样重要。在将答案组织成正确的顺序时，你将在考虑各种选择。当你完成问题定义以及设计和映射答案后，下一个任务就是开始用一种或几种计算机语言编写程序代码。


