    It refers to the beforehand declaration of the syntax or signature of an identifier,
    variable, function, class, etc. before its usage (done later within the program).
    In `C++`, Forward declarations are usually used for Classes. In this, the category
    is pre-defined before its use in order that it are often called and employed by
