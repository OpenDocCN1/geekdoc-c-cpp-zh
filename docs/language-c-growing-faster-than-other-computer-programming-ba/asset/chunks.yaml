    # 编程概述


    在继续之前，你首先想要选择你想要使用的可能语言，这也是因为考虑到特定的计算机平台。通常，计算机语言针对各种类型的任务进行了优化。因此，首先选择最适合所需任务的语言是非常关重要的。事实上，学习编程基础是任何一个准程序员为了武装自己而采取的积极举措，特别是如果他想在在该领域追求职业生涯。


    热门编程语言：`C` 占据主导地位，但排名第三的 `Python` 在每月编程语言指数中由于整个格局的细粒度波动，正在追赶 `Java`。其最新指数还将细粒度的变化也识别为长期趋势。软件质量保证公司每月发布其热门编程语言指数，以详细说明不断演变的格局中的变化。最近发布了其
    10 月份的最新更新指数。它使用一系列指标，包括在 Amazon、YouTube、Wikipedia、Bing、Google、Yahoo 和百度上的搜索，来确定排名。总体而言，自
    9 月份报告以来，前 10 名没有发生位置移动，尽管存在细粒度的数据波动和长期变化需要注意。


    ## 热门编程语言：10 月份指数


    在最新指数中，`C` 仍位居第一，评分为 `16.95%`，代表比 2019 年 10 月增长了 `0.77%`。`C` 继续保持上个月的最高地位，上个月该编程语言的评分为
    `15.95%`。在 2019 年 10 月，`C` 排名第二，与指数一致。


    `Java` 在最新排名中位列第二，评分为 `12.56%`。总体而言，`Java` 自去年 10 月以来发生了 `4.32%` 的负增长；这是前 50 名中最重要的波动（负向或正向）。`Python`
    仍位第三，评分为 `11.28%`。该指数指出这通常是 `Python` 自 2001 年来的最高排名。`Python` 自去年 10 月以来记录了 `2.19%`
    的正增长；是前 50 名中记录的最大增长。按顺序，`C++`、`C#`、`Visual Basic` 和 `JavaScript` 剩余的前七名。


    `C++`、`C#`、`Visual Basic` 和 `JavaScript` 在 2019 年 10 月的评分中处于相同的顺序。排名第八的编程语言 `PHP`
    比 2019 年 10 月的排名上升了一位。最新排名中排名第九的语言 `R` 自 2019 年 10 月以来飙升了六位。按顺序，`PHP`、`R` 和 `SQL`
    完成了剩余的前十名。


    ## 跨越数十年的长期变化


    使用 12 个月的年度平均值，也提供了有关几十年来位置变化的信息，说明了排名的长期波动。基于这些平均值，某些编程语言在近 30 年里一直位居最高位，而另一些在最近几十年中激增。


    编程语言 `C` 在 2020 年、2015 年、2010 年、2005 年、2000 年、1995 年和 1985 年排名第一或第二，与这些滚动年度平均值一致。有趣的是，`Java`
    在 1995 年排名第 29，在 2000 年跃升至第三，然后在 2005 年升至第二，使用这些年度平均值。`Python` 在 1995 年排名第 15，在
    2000 年下降到 21，并在 2005 年飙升至第六，与滚动年度平均值一致。


    ## 在 6 小时内学习 6 种语言编程，花费少于 35


    在过去，如果你懂一些 `HTML` 可能还有一点 `Java`，就会称自己为程序员。虽然这些语言仍在在使用，但编程世界已经变得更加多语言化。在当今的就业市场上成为一名程序员，你希望精通所有主要的方言。好消息是，编程语言不像口语语言。你在这核心命令上花费的时间越长，你就会变得越“流利”，前提是你有一个合适的老师。因此，“完整一小时编码者包”（Complete
    One Hour Coder Bundle）对于坐在办公桌前的知识丰富的程序员来说是下一个非常棒的东西。


    这套在线课程可能是对六种最流行的语言进行的一种旋风之旅。它是从网页设计到系统工程等一切领域职业的良好开始，而且每个课程只需要一小时。以下是你将学到的：


    *   **C++**: 这种极其多功能的语言兼容面向对象的编程，使其成为几乎任何高质量软件开发的理想选择。

    *   **CSS**: 如果你正在考虑网页设计行业，熟悉级联样式表（Cascading Style Sheets）可能是必不可少的。没有更好的方法了，可以让你你的网站看起来完全像你想要的样子，并让你的更改在各个页面之间保持一致。

    *   **HTML**: 如果你打算从事任何高质量的网络编码工作，熟悉术语是一项要求，这门基础课程将为你提供制作第一个网站所需的所有内容。

    *   **Java**: 几乎用于任何地方和各种硬件，这门入门课程侧重于移动开发。网络应用、移动游戏等都以 `JavaScript` 为基础。该程序包中的课程将带你在一小时内轻松地从第一行代码过渡到复杂的循环和数组。

    *   **Python**: 这种可读性最高的语言之一也是最强大的语言之一。`Python` 应用于从简单应用到深度学习算法的各个领域，你将在这个速成课程中看到。如果你是一个喜欢通过实践来发现问题的自学型人才，真的没有比这个包更好的起点了。PCMag
    的读者可以以 34.99 美元获得整个一小时编码包，比原价优惠 97%。


    ## C++ 编程基础


    `C++` 可能是一种通用编程语言，并在如今广泛使用。它是命令式的、面向对象的并具有泛型特性。然而，要精通任何编程语言，必须先理解该语言的基础。因此，以下是
    `C++` 的基础，它们将帮助你入门：


    ### C++ 基础语法和第一个程序

    学习 C++编程通常简化为在文本编辑器中编写程序并以正确的扩展名保存（`.CPP`, `.C`, `.CP`），然后使用编译器或在线 IDE 编译程序。


    ### C++ 基础输入输出

    C++ 自带库，为我们提供了某些执行输入输出的方法。在 `C++` 中，输入输出是在字节序列中或更常称为流中执行的。两个关键字 `count` 和 `cin`
    经常用于获取输入和打印输出。这两个是 C++中获取输入输出的最基本方法。


    ### C++ 注释

    良好的文档是程序员的良好习惯。它使程序更具可读性，更容易发现错误。良好的文档的一个重要部分是注释。在编程中，注释可能是计算机程序文本文件中的程序员可读的解释注释。这些语句不会被编译器和解释器执行。


    ### C++ 数据类型和修饰符

    所有变量在声明时使用数据类型来限制存储的种类。因此，我们可以说数据类型是告诉变量它可以存储什么知识。每当在 `C++` 中定义变量时，编译器都会为该变量分配一些内存。每个数据类型都需要特定的内存。


