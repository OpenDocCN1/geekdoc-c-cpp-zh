  \n考虑到其规模，Facebook 是一个相对扁平的组织。但当时的 Facebook 广告（FB Ads）仍有大约三种等级分明的角色。首先是高级管理层，其成员终生沉浸在穿插着邮件间隙的会议风暴中，并在扎克伯格（Zuck）/谢丽尔（Sheryl）与其他人之间形成中层管理骨干。这包括\
  \ Gokul、Boland、Badros 以及房间里的大多数其他人。其次是产品和工程团队，他们的成员通常花时间在工程楼层改代码和开发产品。这就是我和所有真正构建过东西的人。最后，是销售和运营人员，他们像是一支小军队，占据着校园内冷清的建筑以及同样冷清的海外办公室。最低的一层尽管经常是\
  \ Facebook 面向世界的面孔，并头衔诸如“Facebook 欧洲中东及非洲负责人”等华丽头衔，但对构建什么产品没有实际影响，他们那里主要是为了做样子。\n\
  \n“重定向”（Retargeting）是广告术语，指根据用户在网上浏览的内容向其展示广告的做法。简单来说，这是一种令人毛骨悚然的策略：向你展示你刚刚在 Amazon\
  \ 或在线购物网站看过的产品的广告。在本文描述的会议期间，这种定位比仅仅向你展示你看过的产品版本要复杂得多，但这个术语实际上是代码，意味着根据你在 B、C、D\
  \ 网站上的行为（甚至可能是在实体店的线下的行为）来预测你在 A 网站的体验。\n\n“量化”（Quant）是量化分析师或量化交易员的缩写。这些金融工程师将流体力学或概率论的数学模型回收到脏钱的世界中。现在他们绝对充斥着华尔街，金融的某些领域，例如极速的高频交易世界，没有他们就无法存在。对他们世界最真实的视角是由高盛策略团队创始人\
  \ Emanuel Derman 在他的经典著作《我的量化师生活》（*My Life as a Quant*）中写下的。\n\n对于幸灾乐祸的人来说，生活是一场永无止境的盛宴。当美国历史上最大的庞氏骗局马多夫丑闻在\
  \ 2008 年底爆发时，事实证明埃利·维塞尔人类基金会（Elie Wiesel Foundation for Humanity）将其所有资产都投入了马多夫。埃利的儿子伊利沙（Elisha）是该基金会的财务。这让我想起一个关于复杂情感的笑话：看到你岳母开着你的新保捷撞下悬崖。对于这样一个高尚的事业遭受损失很遗憾，但对于伊利沙·维塞尔（Elisha\
  \ Wiesel）来说，额，这不可能发生在比他更好的人身上了。\n\n但等等，幸灾乐祸爱好者，还有更多！我的前老板 RTM 截至 2016 年 1 月正处于保释状态，等待性侵未成年人的审判。据指控他在公共泳池猥亵了一群女孩。在被证明有罪之前无罪（当然了）。已经被定罪的是我的前交易员马特·泰勒（Matt\
  \ Taylor），他也会坐几次牢。他自顾自，，通过在交易所证券中建立巨额头寸，冒着数十亿美元公司资金的风险来增加他的回报和年终奖金，以此欺骗了高盛的风险系统和我（他的量化师）。他在联邦监狱服了刑，现在在佛罗里达经营一家泳池清洁业务。我的华尔街同事真是一群优秀的人。\n\
  \nCentury 21 是位于曼哈顿金融区北部边界的一个令人爱的怀旧百货商店。它唯一的真正卖点是一件 40 美元的 Hugo Boss 衬衫，你必须在现场场试穿（别针还插在布料里，很快就会扎进你的身体）。\n\
  \n小林武（Takeru Kobayashi）是一个身材矮小的日本男人，他在这项令人作呕的“运动”——竞技中持有大部分重大纪录。他开创了许多创新的进食技巧，如本文描述的浸入法。2009\
  \ 年，他在康尼岛著名的汉热狗店曾在 10 分钟内吃掉了 64 个汉热狗。\n\n而里奇·罗森布姆（Rich Rosenblum）变成如何了，那个拥有拉布莱式汉堡胃耐力的男人？他最终成为了高盛的董事总经理，并晋升为其高级石油期权交易员。资本主义奖励天才。\n\
  \n时代精神（Zeitgeist），如果原谅我用极客梗的话，它就像《星球大战》中塔吐星上的那个酒吧。你可能可能会从厕所那里上乙型肝炎。在阳光明媚的周六下午，它的露天花园是旧金山最好的聚会场所。光是那里的二手大麻烟雾就能让你飘得像风筝一样。\n\
  \n\n\n\n虽然在迈阿密的古巴流亡者摇篮中长大，但我出生于南加州，这让我比大多数硅谷居民更像加州人。\n\n营销人员使用“转化”（conversion）来表示销售，就像摩门教人称呼拯救灵魂一样。\n\
  \n`CrunchBase` 是一个关于人物和公司的数据库，它是硅谷的“名人录”（如果我用这个词时不会作呕的话）。`CrunchBase` 的母级媒体 `TechCrunch`（由此得名）是硅谷这场狂欢节的日常新闻和八卦杂志。\n\
  \n“吃自己的狗粮”（dogfooding）一词的起源据认为源于 80 年代的微软公司，该短语源于当时的 `Alpo` 狗粮广告，广告中洛恩·格林（Lorne\
  \ Greene）向可能持怀疑态的公众保证他自己的狗吃的就是 Alpo。因此，“dogfood”成为了硅谷术语，指代使用自家的产品，并意味着这是一种信任票。\n\
  \n再给你们介绍一些创业公司术语：产品大致分为两个初始版本，“alpha”（Alpha 版）和“beta”（Beta 版）。“Alpha”是一个非常不完整且可能充满\
  \ Bug 的 的版本，只有非常大胆（或者说是愚蠢）的测试客户（“alpha 客户”）才敢于尝试。“Beta”仍然是一个初始版本，但已经修复了大部分早期缺陷。因此，“beta\
  \ 客户”是一个早期客户，但他们使用的产品仍未完全达到正式运行版本。\n\n他在一种被称为“锤状指”（mallet finger）的常见棒球损伤中，打断了我的左无名指，恰好在最后一个关节处。在很快我会告诉你们的与\
  \ `Adchemy` 期间的后期斗争中，我曾用另一只手故意弯曲那个关节，感受由于骨折愈合不良带来的钝痛，以此提醒自己我面对的是什么样的对手。\n\n在 IPO\
  \ 或收购等“流动性事件”之前离开的创业公司员工有一段固定的期限（通常为 90 天），要么行使他们的期权（通常需要花费高昂成本），要么失去他们收到的任何股权补偿，无论他们在公司工作了多久。看待创业公司工作的方式是：你通过自己的劳动和时间，赢得了以最后一轮融资的价格投资公司的权利，就像公司的初始风险投资人所做的那样。这才是你赚取的真实报，许多前员工在决定是否掏出这笔钱时非常苦恼。如果你从一开始就不投资一家公司，那么你为它工作就是愚蠢的，因为创业公司的现金补偿通常远低于市场水平。\n\
  \n`Y Combinator` 的名字来自形式数学逻辑这一奇诡世界中的一种函数。通俗地说，它是一种递归函数：换句话说，就是将自身作为参数的函数。我想 PG 在这个名字中的意图是\
  \ `Y Combinator` 是一家能产生更多初创公司的公司，而它确实变成了这样。\n\n这个数字在 2010 年大约在 30 左右，但到 2015 年已接近\
  \ 100。\n\n在技术领域，平民所理解的“黑客行为”（hacking）——即非法入侵并弄乱计算机系统——只是这个词的次要含义。它的首要意思是系统和软件的构建，带有一种粗糙修补而非精工细意的内涵。“我破解了一台旧\
  \ Windows 机器来运行 Apple OS X，”一个黑客可能会对某个特别有趣的临时凑方案（kludge）这样说。当然，“kludge”就是黑客行为的一种实例。\n\
  \n风险投资人（简称 VCs）是创业公司赌场里的赌徒，他们从最早阶段就开始为初创公司提供资金，早期投资仅相当于一辆新车或更低，到后期融资额甚至可达数亿美元。\n\
  \n2010 年左右的条形码读取问题尚未完全解决。一家名为 `RedLaser` 的公司很快解决了这个问题，并几乎立即被 `eBay` 收购。\n\n鲜为人知的事：`Y\
  \ Combinator` 的校友是所有 `Y Combinator` 申请的第一读者，本质上是第一道过滤器。\n\n\n\n初创公司连续进行多轮融资，金额越来越高，公司估值也越来越大，按照松散定义的\
  \ A、B、C 等阶段进行。定义这些轮次的融资规模范围（例如，约 200 万美元到 600 万美元为 A 轮）在不断变化，这取决于当时风投市场的慷慨程度。“种子”资金先于此；它是第一笔投入的资金，也是我们大多数人在离开\
  \ YC 之后筹集的资金。与胸罩尺寸不同，这些字母在达到某个点后并不会真的翻倍（例如变成双 E），尽管考虑到某些公司臃肿且稀释的股权结构表，它们似乎本该如此。\n\
  \n“老子钱”（Fuck-you money）是你需要的、对所有人说“去你的”的钱，并且可以在旧金山或西雅图这样的宜居城市以中产阶级的水平财务独立生活的资金。在本书结束之前，我们对此会有更多论述，因为它曾以令人向往的距离出现，随后却消失了，可能永远消失。\n\
  \n从 2015 年开始，YC 租了计算机历史博物馆的巨大阶梯教室，消除了进行几轮演示的需要。现在，一批公司也包含近一百家公司，该机构已经发展到如此程度。\n\n\
  在哈佛，这被称为“贝克学者”（Baker Scholar）；在斯坦福，这被称为“阿杰杰·米勒学者”（Arjay Miller Scholar）；如果你以成绩前\
  \ 10% 毕业，这就是 MBA 蛋糕上额外的锦上添花。这些是那些认真对待 MBA 课程、并认为内容实际上有意义的人，而不是假设精英 MBA 的全部精髓在于策划的人脉网络和为新职业方向提供助推（在斯坦福，这实际上是你每年支付\
  \ 7 万美元买到的东西）。像这样的人通常最终会进入风险投资领域，那里是有纪律和野心但缺乏实际才华的人的最后堡垒。\n\n帕洛阿尔托（Palo Alto）在西班牙语中是“高木子”，指的是一棵千年老红杉树，它曾是皇家大道（El\
  \ Camino Real）沿线的标志。这条路是西班牙人在殖民化加利福尼亚州时修建的王道，现在是贯穿于他们建立的所有旧传教区（现为城市）的主干道。这棵树仍然位于帕洛阿尔托市中心几个街区之外，距离斯坦福校园仅一步之遥。\n\
  \n与女性的类比失效了，因为与女性不同，你诱惑越多的投资者进入你疯狂的习俗，其他人就越可能加入。这反映了科技投资者像旅鼠（lemming）一般的本性，他们中的大多数人几乎称不上这个头衔。\n\
  \n“股权表”（cap table）是资本结构表，一份列出每位股权所有者（投资者、创始人或员工）以及他们持有公司份额的列表。它是任何公司最重要的文件之一。表格中的每位成员都将精确到小数点后知道自己的数字。\n\
  \n所洛门·海克斯斯（Solomon Hykes）的公司 `DotCloud` 制造计算机基础设施管理工具，并最终演变为 `Docker`，这是系统部署和管理的新范式。后来成为其旗舰的产品实际上是一个内部项目的开源衍生品，该项目获得了出意料的（且推测是令人惊讶的）全行业范围认可，而其原始的\
  \ YC 产品却在落后。到 2015 年，该产品已变得如此成功，`Docker` 获得了“独角兽”地位，意味着估值超过十亿美元，成为硅谷最有前景的公司之一，并成为我们\
  \ YC 批次中无可置疑的冠军。然而，在此过程中，他们在一次创始人变动中失去了一位联合创始人塞巴斯蒂安·帕尔（Sebastien Pahl）。即使是最好的公司也会遭受初创公司的戏剧。\n\
  \n费尔奇半导体（Fairchild Semiconductor）在美国科技史上占据着传奇般的地位。它由威廉·肖克利（William Shockley）创立，他是诺贝尔奖获得者，也是电子时代核心产物——晶体管的发明者。费尔奇以招募并得罪了最终变为英尔克的团队而闻名。肖克利的职业生涯结束于关于科学种族主义和优生学的争论中。他非常著名地为一个由公认的天才和奥林匹克运动员组成的精子库贡献了他的种子。在他去世时，他是一个名誉扫地、心力交瘁的老人，与所有家人和同事疏远；他的孩子是通过报纸讣得知他去世的。亲爱的读者，不要来加利福尼亚寻找理智。\n\
  \n是的，我变成了“安德鲁”（Andrew），这可能是我名字最离谱的英语化方式。`AZ` 的名字也被拼错了。\n\n据报道，吸烟户 `Motwani` 离开了他与两个孩子一起住的阿瑟瑟顿（Atherton）房屋。他的妻子第二天早晨在他的小池子里发现他溺水。县法医测量他血液中的酒精浓度极高。\n\
  \n硅谷有一种陈调，做初创公司就像从悬崖上跳下并在半途中制造飞机。悬崖有多高以及你在死亡前有多少时间，完全取决于你筹集了多少钱。在我们案例中，还有人向我们开枪。\n\
  \n温克莱沃斯双胞胎（Winklevoss twins）是 Facebook 想法的起源者，美国财富的后裔，两人都是奥林匹克级的赛舟运动员，似乎是从伊恩·弗莱明的小书中走出来的。他们对最终的和解提出上诉，声称\
  \ Facebook 在判决时欺骗了 Facebook 股票的价值。法院不同意。\n\n这个难忘的词出自硅谷的权势律师泰德·王（Ted Wang），当法律纠纷开始时他发誓“绝不吃狗屎！”他大错特错。\n\
  \n外部资金的内部术语是“LP”，或“有限合伙人”。这些是巨大的家族基金（想想 Google 创始人和沃尔顿家族）、投资组合和养老基金，作为更大且通常更保守的投资策略的一部分，他们将部分资金分配到投机性的、高回报的投资中。他们是“有限”合伙人，是因为虽然他们签了启动资金的支票，但对最终的投资决策没有（官方）影响，并有合同义务将资金留多年。\n\
