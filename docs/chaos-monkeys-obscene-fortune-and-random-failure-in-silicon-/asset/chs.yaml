  \ Brothers` 工作，每天早上来时必须准备好“准备咬掉熊的屁股”。\n\n这是华尔街术语，指的是那些只公开推崇自己目前持有资产的人，他们自私地推销自己的利益，而不是提供客观的分析或建议。这是当\
  \ `Bloomberg` 或 `CNBC` 上的那些满嘴跑子的专家推销某些股票时，他们所遭受的尖锐批评。\n\n这并非绝对、完全正确。有些少数基金被称为“长青基金”，它们每年通过新投资者或之前投资的回报进行注资。\n\
