  \n### 面试过程\n\n有趣的是，Twitter 正在利用其内部的初创公司成员来筛选新人。我的一半面试官来自 Twitter 第二次也是最最近的收购。DabbleDB\
  \ 是一家由加拿人创立的数据库公司，于 2010 年 6 月被收购。我的名单里会有两个创始人，而那帮兄弟每人会有一个创始人，以及纯 Twitter 工程师。\n\
  \n我们再次穿过南公园到达 Twitter，经历了那整套消失墨水名牌环节。就像审讯一样，我们立即被分开并带到不同的房间。\n\n我从面试中记得很少，除了一个 DabbleDB\
  \ 工程师的一句评论。在回答完压力问题后，我问他：“所以，你最喜欢 Twitter 的什么？”\n\n到目前为止，我们已经建立了不错的关系，于是他点点头眨眨眼说道：“嗯，你知道的，在\
  \ Facebook 和 Google 这样的公司里，他们提供早餐、午餐和晚餐。在 Twitter，他们只提供早餐和午餐。”\n\n\n\n我内心一阵扭曲。所以，那个大卖点是没人需要加班到深夜，这样我们就能拥有那种虚幻般的工作与生活平衡？我微微一笑，以维持这种温暖的氛围。但那句评论比任何事情都更决定了我的选择。我不会在一家每天都不愿工作到下午六点以后的公司身上，赌上我一生中最大的职业机会。\n\
  \n我和哥几个们在几小时后回到 AdGrok 聚会。在过去的几天里，我们一直在对 Twitter 的想法进行预热，并兴奋地勾勒出未来的 Twitter 广告产品需要什么样才能成功。他们的心情相对不错，并且对那几次会议留下了深刻印象。\n\
  \n这听起来可能像是在自私地进行合理化，但我坚信，一个我去 Facebook、哥几个们去 Twitter 的混合交易，绝对是 AdGrok 最理想的结果。\n\n\
  然而，这里有一个细微的细节：我必须向他们宣布交易中关于 Facebook 的部分，以及我不会跟着哥几个们去 Twitter 的事实。正如前面提到的，我骗了他们，告诉他们\
  \ Facebook 全盘拒绝了我们，包括他们和我。我起初这样做是因为出于恐慌的胆怯，但经过进一步考虑，我意识到，如果他们知道真相，去 Twitter 可能会让他们压力大到窒息。为了让主计划得以实施，他们必须获得来自\
  \ Twitter 的邀约，所以这个小谎言确保了那的发生。但我对我所采取的这种违背诚实的自由必须付出代价，而清账的时间已迫在眉睫。\n\n2011 年 4 月\
  \ 14 日，周四\n\nJess 了一了一封邮件，主题是：“通话”，目的是为了和她以及 Kevin Weil 安排一些时间。\n\n*太棒了！*\n\n记住：如果你在进行电话通话，交易仍然有效。电话代表“是”，邮件代表“否”。\n\
  \n我走到 Townsend 街去接电话。\n\nJess 极具说服力的语气在前两秒内就告诉了我需要需要的信息。Twitter 想要购买 AdGrok，这次是真的。她承诺在二十四小时内提供一份条款清单（term\
  \ sheet）。我们以前从 Twitter 那里听过这话，但这一次我相信他们。一个明显的迹象是：Jess 回电询问了关于股权表（cap table）的细节。这意味着他们已经在考虑拟议交易中投资者与创始人的比例，这是比较重要的高层参数之一。\n\
  \n是时候向哥几个们坦白了。我从道德上无法再为这种欺骗辩护。\n\n有一种独特的西班牙流派绘画风格被称为 *desengaño*。“*Desengaño*”字面上的意思是“去欺骗”，详细来说，它最好翻译为“幻灭”，或“对残酷真相的揭示”。*desengaño*\
  \ 通常描绘的是日常生活中揭露的人类各种欺骗：一个年轻人撞见他心爱的爱人与好朋友私通，一个商人抓到合伙人从收银台偷钱，等等等等。它们旨在作为日常生活中具有启发性的道德教训，并升华为艺术形式。*enganado*（“被欺骗的人”）通常带着夸张的背叛表情，近乎于爆发的愤怒。其隐含意义是，这场戏的下一幕将是某种纠正性的道德行动，例如用折叠刀（*navaja*）进行的决斗，或是被戴铐的小偷在街上耻辱地游行。\n\
  \n我希望那天下午在 AdGrok 办公室即将展开的场景并不配得上维拉斯奎的关注。\n\n“嘿，我们需要聊聊，”对着他们的背影说道。他们转过身，带着疑惑的表情。考虑到我们经历的起起伏伏，他们预见到任何事情，从另一场诉讼到我出柜成为一个渴望跨性别的人。\n\
  \n“所以，记得我说过 Facebook 拒绝了我们吗？嗯，那并不完全真实。”\n\n我开始勾勒情况：我是如何和 Facebook 在一起，以及为什么在过去的两周里向他们隐瞒了这一切。\n\
  \n在一段死一般的沉默后，他们的反应比我预想的要理解。\n\n“你们知道，我曾觉得 Facebook 这件事比你们表现的要复杂，”Argyris 惊讶地说道。\n\
  \n在平息之后，或者至少还没有爆发，我向他们解释说我的未来在 Facebook，并且我有理由相信——我正处于如履薄冰——如果我们尝试，就能完成这项交易。\n\n\
  这效果并不好。哥几个们恐慌了；如果 Twitter 意识到这一点，那么。这回起了我们之前的争吵。\n\n*Diego，快上吧！*\n\n\n\n\n不过 Tillman\
  \ 并非等闲之辈，在拥挤的交通中，显而易见的动力悬殊变得无关紧要。关键在于超车，取决于是否愿意挤进汽车之间，以及是否能利用交通中极微小的空隙。当我们从八车道的\
  \ `101` 高速公路下，进入通往 Stinson 的双车道弯曲的 `1` 号公路时，我正领先在他前面。尽管发动机动力学惊人，但 `Tesla` 的操控性并不好：电池让这辆车变得沉重，尽管它小到我几乎快挤不进去，而且在转弯时会有转向不足。我沉浸在脑中的汽车评测中，没有注意到\
  \ Tillman 正准备从我车后超车。当我看到那辆 `Cooper` 从左侧一闪而过时，即使是 `Tesla` 的加速度也不快到无法拦截它，现在我只能眼睁跟在他屁股后面。\n\
  \n`Fuck!`\n\n失败比死还糟糕。但我对此也无能为力，因为通往 Stinson 的路以弯曲和狭窄而闻名，悬崖般的落差让任何严重的失误都会导致毁灭。更别提超车了，假设我能控制这辆超速加速的\
  \ `Tesla` 通过弯道，毕竟周五下午的交通极其拥堵。\n\n终于，在接近小小的 Muir Beach 小镇、距离 Stinson 仅几英里的地方，我发现了一个（违法的）机会。路段足够直，可以看到大约百码外的距离。如果有任何车从左侧开出来，我们都会在昂贵残骸的爆炸中丧命。在确保不引起\
  \ Tillman 某的情况下，我横穿过双黄实线，将 `Tesla` 的车头猛地切入对面车道，开启了“曲速驱动”。请记录在：在 2011 年 4 月 15 日（报税日！）当地时间下午约\
  \ 3 点，我不负责任地在道路错误侧疾驰穿过 Muir Beach，时速达到三三位数。整个小镇在 `Roadster` 狭小的车窗望去，就像是三秒钟的残影。\n\
  \nTillman 现在完蛋了。没有超车道，没有虚线中心线，道路现在由平缓的弯道而非山路发夹弯组成，他永远无法对 `Tesla` 完成超车。\n\n`Ha!`\n\
  \n几分钟后，我停在 Stinson 的 Sand Dollar 门口，立刻吸引了一群骑自行车的当地孩子围过来，他们对着那辆火红色的 `Roadster` 发出惊叹和赞叹。汽车电池似乎只剩下四分之一，仪表盘闪烁着各种我不懂的警告。没关系。在对\
  \ Tillman 进行了足够的戏耍、喝了啤酒、吃了生蚝后，我们回了旧金山。\n\n我不确定能否在电池基本耗尽的情况下把车开回来，我开得像老奶奶一样，直到到达\
  \ Lombard 街。在那里，我遇到了一辆敞篷版 `Porsche 911`，双进气口预示着它是涡轮增压型号。这可是一台真正的赛车。旧金山是一个大多居住着胆小鬼的城市，所以想找一场像样的街头赛车非常困难。司机年纪较大且大大肉，但衣服很昂贵——我猜他可能是搞房地产或某种像广告公司之类的老派创业。电动汽车让引擎加速声的挑战变得不可能，所以我并不指望会有什么反应，当我并排在他身边时，直接踩了油门。\n\
  \n他看到我来了。在我后面一秒后他猛踩加速，比赛开始了。Lombard 街上人满为患，但在移动。每个红灯都是一场加速赛，`Tesla` 和 `Porsche`\
  \ 穿梭在那些在通勤和生活中昏昏欲睡的早高峰工蜂蜂群中。这个老混蛋很会开车，显然对街头决斗并不陌生。当我们到达三车道 Lombard 街的尽头时，我在他后面几辆车的位置。灯变黄了，他轰鸣着冲了，而我前面的慢速车决定停下。被困在中间，我完蛋了。`Porsche`\
  \ 发出的引擎声听起来如真空般的声音，随后它转弯消失在 Van Ness 街。\n\n即使赢得了一场比赛，也总会有下一场，而且总会有人车更快，不是吗？这个老家伙很清楚这一点，这就是为什么他会和我我这种鲁莽的小混蛋赛车。他可能有妻子、孩子、房产以及所有中产阶级的东西，但当他在后视镜里看到挑战者时，他就会抛开这一切，只为了那点尖锐的橡胶摩擦声。他通过实施犯罪般的鲁莽驾驶、危险驾驶和“展示时速”（用加州刑法典的说法）来冒着他所拥有的一切，这一事实无关紧要。他不是通过拒绝全投入的挑战才得到那辆\
  \ `Porsche` 的。亲爱的读者，你也不会。\n\n回到 Moscone Center 下方的停车场时，`Getaround` 的用户们正在等待他们的大奖级租赁车归还。他们似乎并不好奇我如何在三小时的租期内、在只行驶了\
  \ 50 英里的情况下，就能让一辆 `Tesla` 完全没电（正常续航有 200 多英里）。`Getaround` 首席执行 Jessica Scorpio：如果你正在读到这里，表示极其迟缓的歉意。\n\
  \n当我回到电脑前恢复理智时，有两封邮件在等我：一封来自 `Twitter` 的 Kevin Thau，另一封来自 Gokul，都附有文档。\n\n### 2011\
  \ 年 4 月 16 日，周六\n\n“你是想告诉我，这个坑投资者的交易方案你完全没有参与建议吗！？”\n\n我差点得把手机拿远耳朵。Sacca 刚刚审阅了我转发的\
  \ `Twitter` 条款清单。\n\n我正在习惯性的紧张踱步路段活动：在阿拉勒梅达的第 9 街来回走动，在 British Trader 房子的前面。我做了一个可能是错误的决定，搬回和她以及\
  \ Zoë 一住。\n\n“这跟我没关系，Chris。这些是我们看到的第一批真实条款。”\n\n`Twitter` 对 Sacca 如此不在乎，以至于默认采用了一份极大偏袒创始人的条款清单，这就是为什么硅谷最著名的投资者现在正在对我大大大。\n\
  \nSacca 生气得对吗？\n\n`Twitter`（难得）履行了它的广告词承诺，我们的交易金额大约为 1000 万美元。然而，分配给投资者的金额并非股权结构表中预期的\
  \ 200 万左右，而是可怜的 100 万。\n\n正如我很快学到的，这是一种常见的策略。你廉价买下公司，通过设计让投资者获得极少收益，然后将真实价值塞进员工的入职报价方案中。`TechCrunch`\
  \ 会报道该公司以 X 万美元出售，但从技术上说，它的售价仅为 X 的 10%，而其余部分进入了创始人丰厚的签约奖和带有重重限制的归属计划。\n\n其运作方式是这样的：\n\
  \n收购公司完全不在乎资金如何在投资者和员工之间进行分配。正如我们回顾过的，他们关心的是每个高价值人才（即工程师和产品经理）的价格。如果这个能解决，且支付形式是他们偏好的（或愿意接受的）现金与股权混合，这笔交易对他们来说就是很好。当你认真讨论交易时，每家收购公司心中都有这样一个目标单价。作为交易谈判员，你的任务是尽可能地接近那个价格。\n\
  \n\n\n\n然而，创始人们有着更为微妙的观点。这种小规模的交易不太可能改变人生，称不上是“老子自由基金（fuck-you money）”。在收购公司休息并完成股权归属后，你可能会再次投入初创企业的斗争，需要融资，并再次生活在初创生态系统中。搞砸你的投资者，消息很快就会传开。此外，你可能与投资者之间存在着真实的情感纽带。毕竟，在没人支持你时，他们往往站在你身边，并且像\
  \ Sacca 一样，可能帮助了公司的出售。因此，创始人面临着一个相当棘手的道德选择。他们可以选择回报投资者在时间和金钱上的投入，但他们本质上是从自己的腰包里掏钱。在最后阶段，这场交易对于创始人和投资者来说完全是一场零和博弈。\n\
  \n为了让你了解收购公司对投资者是有多冷漠，请记住，Sacca 被报道是 Twitter 创始人之后最大的股东，也是该公司的发声支持者。他曾帮助安排了公司的最后一轮融资，并以某种臭名昭著的方式，帮助内部人士早期向华街投机者卖出他们的\
  \ Twitter 股票。明确地说，这是一种恩惠，因为它让许多为 Twitter 工作了多年的员工在漫长的 IPO 过程之前获得了流动性。由于许多高知名初创企业存在这种二级市场，这一事实表明，在当前的科技泡沫中，权力平衡在多大程度上已经从投资者和华街转向了创始人和员工。\n\
  \nAdGrok 的交易对 Sacca（以及 Twitter）来说不过是一笔零头钱，但当涉及到自尊时，姿态至关重要。所以 Sacca 大吼大叫是有其道理的。另一方面，他的基金在六个月内资金翻了一倍。但这对\
  \ Sacca（或他的有限合伙人投资者）来说还不够。情况更糟了。\n\n“Chris，还有一件事。事实证明，Facebook 想聘用我，这与 Twitter 的交易无关。他们拒绝了其他部分，但他们想要我。”\n\
  \n>暂停<\n\n“什么！！”\n\n“是的。我不会说我完全被买定了。但他们想让我去 Facebook。”\n\n显然，我在满口谎言。\n\n“你觉得 Twitter\
  \ 会怎么想？如果没有我的话，他们还会接受 AdGrok 吗？”\n\n“你疯了。你会毁掉这整笔交易的！他们当然不会没有我的情况下接受 AdGrok。你只是 .\
  \ . . 你只是 . . . ”\n\n他挂掉了我的电话。我们再也不会说话了。\n\n然后就是 Facebook 的问题。\n\n### 复制性投资组合\n\n\
  在金融领域，有一个被称为“复制投资组合（replicating portfolio）”的概念。这是一组股票、债券、衍生品以及任何其他模仿某些资产组合回报的——尽管由不同部分组成——的资产。此类组合通常由量化分析师构想出来，例如为了从某只股票的上涨中获利，而无需在某些公司已满负荷的资产负债表上持有实际股份（即所谓的“股权交换”）。\n\
  \n对于 Facebook，我曾尝试让 Gokul 给我一个关于我 Twitter 交易部分的复制投资组合。事实上，我曾直率地告诉他（其实是个虚张），我不会为了任何事情而放弃\
  \ Twitter。而 Facebook 确实做到了。将交易定价为 Facebook 公市前的股票价格 `$32` 左右，我们的价值是 `230 万美元`，这大约是等\
  \ Sacca 大吼完完后，我在 AdGrok 中 `25 percent` 股权的价值。这些数字看起来已经达到了理想状态。\n\n我当场做出了那个酝酿数日的最终决定。我要加入那群穿连帽的人。我们会设法让\
  \ Twitter 那一边运作起来。目前看来，我们在交易上处于主动地位，即使没有我，交易可能也会完成。现在没有比现在更好的出击时机了。\n\n“Gokul，我是\
  \ Antonio。”\n\n有了交易在谈，不用担心在周六早晨打电话。\n\n“感谢你发给我正式报价。我很高兴看到我们基本上达到了该去的位置。”\n\n“所以，你准备好加入了吗？”Gokul\
  \ 问。我很快发现，Gokul 的紧迫感并不是某种暂时的交易行为，而是实际上他管理整个职业生活的方式。\n\n“我很愿意加入 Facebook，Gokul。”\n\
  \n“太棒了，哥们！我们非常期待你的加入。请确保尽快给我发一份签好的副本。”\n\n话语听起来很伟大，宝贝，但点线上的签名才能让世界运转。\n\n“没问题，Gokul。”\n\
  \n就这样这样。AdGrok 的闹剧即将结束。\n\n## 2011 年 4 月 18 日，周一\n\n在正午这个戏剧性的时刻，我们与 Twitter 交易团队举行了首次意向书后（post-term\
  \ sheet）会议。\n\n在周六承诺后，我立即向哥们确认了离开 FB 的消息。这并不意外。如果他们不开心，他们就掩饰起来，但我注意到电话中他们声音里似乎带着恐惧。\n\
  \n在通往 Twitter 的第三街的走路上，我们最后演习了一次行动计划。我将在会议的前几分钟内宣布我不参与这笔交易的事实。讨论一个包含我但不会发生的交易是没有意义的。我不应该宣布我要去哪里，而是在机会允许时直接离开房间，同时确保冷静地将\
  \ CEO 的接子交给 `MRM`。\n\n事实完全并非如此。\n\n\n\n\n半小时后，Twitter 回了电话。MRM 接了电话；我不再参与其中的进程了。我沉浸在这一刻。他们两个都守在\
  \ Matt 的手机旁，手机开着免提，注视着 Jess Verrilli 的每一个字。MRM 记录下了相关的交易数字，然后向 Jess 重复了一遍以无准确。\n\
  \n哇。报价在 500 万美元左右。这比我预期的要高得多。这和一个多周前的交易价格一样，当时 Sacca 和我还费力说服那帮小子不要接受。\n\nTwitter\
  \ 正在非常弱地打出他们手中的王牌。在我抛出了一枚反映内部斗争激烈、足以杀死估值的炸弹后，他们在一个小时内就回了电话。如果他们有胆量，本该让 AdGrok 陷入沉默状态，连续几天忽略所有电话和邮件，让那帮小子沉浸在恐惧和焦虑中。在冷处理之后，他们可能可以用一张\
  \ 20 美元的星巴克礼品卡买下 AdGrok。然而，他们在一小时内就回来了，给出了一个略高于原价的报价。Twitter 的表现就像扑克职业选手所说的“跟注站”（call\
  \ station），而且还是很弱的一种。那帮小子拿到的钱比他们希望的得多，而且超过了他们愿意出售的价格。尽管双方都表现得笨拙无能，这笔交易正在达成。AdGrok\
  \ 已经死了：那帮小子和 Twitter 仅仅在为葬礼的价格讨价。\n\n接着我感受到了那种刺痛感。\n\n我在 Facebook 那里得到的只有收件箱里的录取录取信，以及\
  \ Gokul 承诺公司会履行报价的保证。我刚刚羞辱了 Twitter，又让它最大的股东——也就是 Chris Sacca——脸贴在了那堆新鲜、温暖的排便上。那帮小子对钱已经按捺待了，现在没人能阻挡他们；他们会接受\
  \ Twitter 提供的任何交易，无论有没有我（可能根本没有）。我需要立即接受 Facebook 的报价，但在那之前，需要一位雇佣律师过一遍。\n\n硅谷的职位\
  \ Offer 可能是如此复杂——每一份对个人来说都是一次微型收购，包含了现金、期权、归属时间、知识产权协议等等——以至于有一整类律师专门帮助你谈判“卖掉你自己”。\n\
  \n我联系了我们谈过的每一个死的律师——Fenwick、Orrick，还有我们那个廉价的合同律师——寻求推荐。\n\n半小时内，我接上了新雇的雇佣律师的电话。“我有一封录取信，需要知道要不要签。公司其他部分正被竞争对手收购。我是\
  \ CEO 兼创始人。你需要什么？”\n\n“录取信、你与现雇主的股票购买协议，以及你的雇佣合同，”她简短地回答道。\n\n那时，那帮小子正四处跑动，整理公司文件，并紧张地接听电话推进交易。我正用我们那缓慢、破旧的扫描仪扫描成堆的文件，偶尔出去打打自己的电话。\n\
  \n事情带上了一种末末日般的、“德国人来了”的色调，又可能是 1979 年德黑美国大使馆安全室里最后几分钟的氛围。一组在向关注方传输关键信息，另一组则在收集、扫描和销毁信息，同时计划如何撤离。\n\
  \n一个小时过去了，我的律师终于回了邮件。“你需要立即接受 Facebook 的报价。你还需要在此辞职，否则你将违反两份合同中的竞业协议。”\n\n时钟显示是下午\
  \ 2:45。\n\n我迅速拨通了 Facebook 公司发展部 Amin 的电话，看他什么时候能到。硅谷的交易员像小镇银行家一样，日程很轻松；他五点就下班了。\n\
  \n我必须赶上 3:07 往 Palo Alto 的 Caltrain 才能准时到达。我不可能让这笔交易过夜。\n\n那帮小子正埋头讨论交易的某个方面——现在是他们的交易了——我没有打断他们，拿上自行车头盔，走出了我工作、担心并偶尔在此睡过的办公室。\n\
  \n在火车上（我是仅差一分钟赶上的），我开始在 iPhone 上写辞职邮件。一小时后，我骑着嘎吱作响的自行车在 Palo Alto 的加州大道上奔驰，回到 Facebook\
  \ HACK 标志处。我手机里的邮件准备就绪，就在 Facebook 发展部的人从玻璃门探出头时，我按了发送。\n\n我当失业游民了整整五分钟。Amin Zoufonoun\
  \ 的下属 Dale Dwelle 与我闲聊，而我心里在想：*快点，把那些死的表格给我！* 合同签完后，他再次送我出去。\n\nAdGrok，我们的初创公司宝宝，实际上已经死了。在漫长的一年里第一次，我无所事事地走进加州明媚的午后。\n\
  \n这笔交易成了一个硅谷的小奇闻，让报道过它的科技记者感到困惑；直到今天仍然收到关于它的问题。简短的版本是：我完全是个白痴，而这笔交易打得非常糟糕，是靠着虚张和幸福的无知完成的，而不是靠精明的计算。\n\
  \n### 高明的打应该是这样的：\n\n-   秘密继续谈判两笔交易，以榨出最后的筹码，并大幅增加 Twitter 报价的提前比例，包含单次触发加速或大量的预付款。然后接受\
  \ Twitter 的交易，在上班第一天辞职，然后走人。\n\n\n\n\n说根底，AdGrok 仅仅是 Facebook 一场漫长且充满压力的工作面试（Twitter\
  \ 的那些哥们也是如此）。我们都声称“卖掉”了 AdGrok，但实际上，AdGrok 仅仅是获得那些真正带给我们巨大财务回报的 Offer 的筹码——那些如果没有它们，我们根本无法获得的\
  \ Offer。大公司的企业发展部门，在涉及与小公司的交易时，其实只是腰包更鼓的华丽版 HR 招聘人员。这是那些被收购公司自命不凡的创始人往往不会提到的另一个小细节。\n\
  \n如果我当时执行了最优策略，我对 AdGrok 的回报率可能会比最终的结果多出几十万甚至数百万美元。此外，额外的现金或 Twitter 股票将成为我在 Facebook\
  \ 上全押仓的对冲。\n\n道德，这种如果真的存在于这个技术妓院里的话，确实是一项昂贵的爱好。\n\n# 第三部分\n\n## 快速行动，打破现状\n\nFacebook\
  \ 最初初并不是为了成为一家公司而存在的。它的建立是为了完成社交使命——让世界变得更加开放和连接紧密。\n\n——马克·扎克伯格，Facebook Inc. IPO\
  \ 文件（2012 年）\n\n### 训练营\n\n一旦跨越门槛，英雄便进入了一个充满奇妙流体、模糊形态的梦幻景观，在那里，他必须在一系列考验中生存下来。英雄在进入这一区域之前，得到了此前遇到的超自然帮助者提供的建议、护身符和秘密特工的暗中协助。最初进入考验之地的出发，仅仅代表了这段漫长且真正危险的启蒙征服与启示时刻之路的开始。现在必须杀掉巨龙，跨越令人惊讶的障碍——一次又一次，再又一次。与此同时，会有许多初步的胜利、无法企及的狂喜以及对那片奇妙土地的瞬间瞥见。\n\
  \n——约瑟夫·坎贝尔，《千千面的英雄》\n\n### 2011 年 4 月 25 日\n\n在 Facebook 后来占据的那个“城中之市”的校园之前，公司位于帕洛奥托低端地区的两栋建筑内，就在斯坦福校区的东侧。其中一栋位于\
  \ `California Avenue`，汇聚了扎克、工程部、广告部以及几乎所有参与实际产品开发的人。另一栋建筑面向另一条干道 `Page Mill Road`，驻扎着销售、法务、运营以及所有参与\
  \ Facebook 机器非技术方面的人员。一队整洁的白色穿梭巴士在两栋楼之间往返接，偶尔会有 Facebook 员工走完这半英路来锻炼，或者只是为了偶尔看看阳光。\n\
  \n被称为 `on-boarding` 的全天会议在非技术大楼举行，所以得坐白色穿梭巴士前往 `Page Mill Road`。会议室命名为 `Pong`（没错，旁边的房间叫\
  \ `Ping`），那是一个用于演示的大型房间。后墙上有一个高台，长窄的桌子像树篱一样，从右到左横跨整个房间。一如既常，我选择坐在第一排，就在演讲者的鼻子底下，这样我就能捕捉每一个肌肉抽动并进行真实的衡量。\n\
  \n一个 HR 人员做了一些介绍性的废话之类的，然后直接进入了第一位演讲者环节——我的大老板，Facebook 的产品负责人：Chris Cox。\n\nCox\
  \ 长得像高斯林或德普那样的帅哥：一种被包裹在可爱外壳里的温和阳刚之气，为女性欲望量身定制。在 Facebook 内部有一个反复出现的笑话，每当他在 Facebook\
  \ 的公关活动上登场时，Twitter 上就会爆发出一阵惊叹的赞叹声。他口才极好，并将其发挥得极其完美，围绕 Facebook 和媒体的未来编织了一段充满魅力的叙述。作为第一位演讲者，他显然是为了让我们灌输我们被选中帮助构建的那个宏大愿景。\n\
  \n“什么是 Facebook？为我定义它，”他问道，几乎在他出现的一刻就挑战着那一排专注的脸孔。\n\n“它是一个社交网络。”\n\n“错！完全不是那样。”\n\
  \n他扫视着观众，寻找另一个答案。\n\n由于表述极其清晰，我我怀疑她是个托儿，一个年轻、活泼的实习生走出来说：“它是你的个人报纸。”\n\n“完全正确！它是我应该阅读和思考的内容，每天亲自送达给我。”\n\
  \n随后，他开始了硅谷人常用的套路，将一个产品置于先前技术的历史连续体中，而当前讨论的产品是这一辉煌胜利凯旋中最终且不可避免的终章。广播和电视是去中心化的大众消费媒体，在那个时代具有革命性，但最终是欠缺的。日益关注焦点和碎片化的媒体——如《汽车与驾驶》等专题杂志，或者你所在社区带有社区分栏的当地报纸——延续了这种个性化不断增强的趋势。然而，Facebook\
  \ 是现代媒体真正的目的论终点。\n\nFacebook 是*你的《纽约时报》*，是你的频道，供你阅读和写作，也供世界其他所有人——从硅谷的风投人到华尔街的银行家，再到在耕田的印度农民。每个人都会关注他们朋友的频道，就像人们曾经拨动旧阴射线电视机的旋钮一样，并生活在一个个性化社交通信的媒介世界里。至于所提到的新闻报道是由《华尔街日报》撰写的，那是偶然的：你的朋友\
  \ Fred 发布了它，你的另一个朋友 Andy 评论了它，你的妻子把它分享给了她的朋友。这是新 Facebook 员工第一次品尝到这样一个世界，这个世界不是通过报纸、书籍，甚至是政府或宗教等传统机构来解读，而是通过个人关系图谱来解读。你和你的朋友将重新定义名人、社会价值，以及那个不安的灵长类大脑中一整天应该运转的内容。\n\
  \n安迪·沃霍尔错了的。在未来，我们并不会都只有名十五分钟；我们将 24 小时地为十五个人而成名。这是一个新的范式，即使外界尚未意识到这一点。Facebook\
  \ 的员工——我们这少数幸运的人——知道即将到来怎样的世界，而我们将帮助创造它。\n\n这是一个精彩的推演，观众席上的年轻人如痴如醉。任务完成后，Cox 露出了一个电影明星般的微笑，随即消失在舞台上，无疑是去参加他那天剩下的十几个会议了。\n\
  \n\n\nPedram 来这里是为了详细阐述同样的价值观。我们从 `Cox` 那里获得了一种那种预言式的愿景，正是产品经理会做出的那种诱惑性的宣传。现在，是时候听听那些让这一愿景成为现实的军事美德了，那是工程师的职责。\n\
  \nPedram 是一个高大阔肩、穿着 Facebook T 恤、看起来经常健身的人，他用一种咄咄逼人的语气命令我们：“无论你在上一份工作中学了什么，无论你带着什么样的政治手段和狗鬼，统统把那些垃圾留在脑后吧。”\n\
  \nPedram 接着用他日益增长的热情描述了这个全新的 Facebook 世界：在这个世界，真理是唯一的价值，无私的协作是规则（“不要担心谁得功”），每个人都对\
  \ Facebook 的所作为拥有所有权（技术上，如果不是财务上）。\n\n这正是入职培训、以及更广泛地说，整个 Facebook 真正天才之处。人们加入 Facebook，就像在埃利斯岛的移民一样，抛弃旧的、过时的文化，取而代之的是一种噬一切的新文化。入职体验的设计恰恰就像新美国人在国旗和政府官员面前宣的公民宣誓。它几乎是宗教性的，被绝对真诚地从字面上予以对待。即便在一个充满不屑蔑视的文化中，我也从未听过任何人在入职时或我工作的几年里，对\
  \ Facebook 及其价值观说过过一句嘲讽的胡话。就像美国人对待“我们的军队”、母亲身份和宪法一样，某些事物被神圣化了，没人敢嘲笑它们。\n\n在一个缺乏超越价值的后历史时代发达世界里，其神庙看起来像北朝鲜的杂货店，空荡荡的货架上没有任何神灵或英雄，这种企业法西斯主义令人陶醉。除了我们面前的新的\
  \ `iPhone` 和 `MacBook` 笔记本电脑，我们还收到了一个笔记本包，里面只有一样东西：一件印有标志性 `Klavika` 字体 `FACEBOOK`\
  \ 字样的蓝色 T 恤。在任何一天，Facebook 一半的员工都会穿着他们的 T 恤，许多人甚至还会拍摄孩子穿着 Facebook 连体衣作为他们社交媒体首秀的照片（当然，还会发在\
  \ Facebook 上）。褐衫党变成了蓝衫党，我们都成了这个新社交媒体“冲锋队”（`Sturmabteilung`）。\n\n愤世嫉俗是无能者的最后避难所。我引用这种绝对主义倾向不是为了廉价的讽刺笑话，不是为了那个酷到不在学校、又酷到不相信任何事的自大文青。不，我引用它是因为我和坐在\
  \ `Pong` 里的其他人一样受到了诱惑，甚至更甚。人类对永恒项目的需求——那些超越自我、赋予意义和目的的目标——自金字塔时代以来并没有改变。现在的唯一区别在于所谓的圣地的性质，以及实现它的手段。\n\
  \n在在经历了 `Cox` 的辞令和 `Pedram` 的严厉告诫后，我们休息了一会儿。\n\n实习生们成群聚在一起，看起来像老相识；我假设他们是在 `Berkeley`、`Stanford`、`MIT`\
  \ 或其他地方互相认识的。想象一下你是一个十九岁的本科生，整个生活都被 `Facebook`、`Twitter`、`Instagram` 等某种混合物所调和，突然生活并工作在这一巨兽的心脏部位。如果我在那个年纪能获得这样的机会，你用用胶带也封不住我的嘴。\n\
  \n`Pong` 外是校园里点缀的许多微型厨房之一。它们之所以被称为“微型”，只是与每天供应三餐的咖啡厅厨房相比；它们并不是真正的厨房，因为那里什么都不煮。它们主要提供的是包装食品，要么导致高血压要么导致糖尿病，这些构成了一个中度自我毁灭的大学大学生的主食。作为对湾区地区精致情感的妥协，那里还有水果碗和坚果或燕麦片盒。我当时并没有意识到，Facebook\
  \ 正在走向全方位、完全的 `Google` 级别的员工款待，厨房里的食物随着时间的推移会变得越来越高端，从 `Snickers` 变成 `Toblerone`，从\
  \ `Doritos` 变成地道的辣印度 `chaat` 零食。咖啡也改进了，放弃了通用的企业烘焙，转而采用 `Philz Coffee`，这是一家起源于潮流的\
  \ Mission 区的当地风味咖啡馆。等我离开时，校园里将有一家完整的 `Philz` 零售店，作为咖啡因补给站、社交聚集点和非正式会议场所。但那是遥远的未来。\n\
  \n血糖水平回升，我们又回了 `Pong`。\n\n一个长相印度人的、留着卷发的男人平静地坐在前排的一张椅子上。这个人不需要介绍，他在 Facebook 之外领域比\
  \ `Pedram` 甚至 `Cox` 更有名气。他是 `Chamath Palihapitiya`，对 Facebook 的成功贡献最大的人之一。作为 `Growth`\
  \ 团队负责人，通过鼓励加好友等行为为 Facebook 争取新用户，他将 Facebook 从一个主要供大学生使用的小网络变成了全球性的在线身份标识，到那时人数已接近十亿。\n\
  \n他还是一名富有竞争心的扑克玩家，主持着硅谷最传奇的家庭牌局，局中有由全明星级别的投资者和企业家组成的常客，偶尔还会有职业扑克选手或明星运动员。扑克是那个广为人知的\
  \ `Chamath` 故事背景，我听过多次，它或许最能说明了他像鲨鱼般的竞争心。\n\n在通宵的高额赌局后，`Chamath` 赢了五万美元走出来。他决定需要一台德国滚轮车，于是去了一家\
  \ `BMW` 经销商。销售员看到一个穿得破烂的孩子，给了他冷脸并拒绝了试驾。于是 `Chamath` 去了街对面的的 `Mercedes` 经销商。在那里，他们没有冷落他，他直接现金买了一辆车。\n\
  \n\n\n正如耶稣对门徒说话一样，Facebook 经常以寓言的形式传授其文化精髓。这里的寓言涉及一个误入歧途 Facebook 员工，他向科技媒体泄露了即将发布的产品消息。扎克（Zuck）通过一封全员邮件做出了回应，主题是“请辞职”，这在任何人的收件箱里都是一个惊人的存在。这封邮件在\
  \ `Pong` 屏幕上被投影出来并逐行播放，鼓励泄露信息的人立即辞职，并对该行为者的卑劣本性进行了严斥，强调了他或她是如何背叛团队的。这个故事的寓意——一个关于浪子的寓言，但换成了一个不宽恕的父亲——很明确：别招惹\
  \ Facebook，否则保安就会像赶走深夜 Taco Bell 墨西哥店里的闹闹醉汉一样把你赶出门。\n\n### 传授的教训，轮到了 Facebook 优先事项中仅次于第二的时刻：谨慎。\n\
  \n作为 `NSA`（美国国家安全局）之外最大的个人数据收集者，Facebook 极易遭受毫无原则的内部滥用。这种滥用不仅不符合伦理，而且如果关于一个嫉妒的员工跟踪他的妻子，或不成熟的实习生查看名人信息的消息传出，其带来的公关打击将是毁灭性的且极其尴尬的。事实上，人们对这种被称为\
  \ Facebook 的类药物服务充满戒备，他们与它分享最私密的人类体验，但潜意识里又怨恨又恐惧它。任何稍不严格谨慎的行为都会威胁到撤销那数亿用户授予这个深蓝色盒子的、调解他们生活的微弱通行证。\n\
  \n我个人至少知道过一个人在这件事上栽了跟头，在“安保”（Facebook 内部安全部门的称呼）发现他们在没有正式理由查看个人资料后被解雇了。事实就是：只要你敢试，我们就会抓到你，你离开的速度会快到我们需要派遣清理小组来移走你办公桌上还发热的咖啡杯。\n\
  \n人群沉默地接受了这一切，最多只是偶尔会发出低声细语或邻里间的窃窃私语。第一几位演讲者激昂的嗡嗡声尚未消散；这场人力资源（HR）会议就像是你在从一个特别狂欢派对结束后开车回家时必须进行的醉驾检查。警察似乎很好相处，尽管略显严厉，他们正执行着他们的脚本。\n\
  \n### 接着，我们进入了精彩的轻浮话题。\n\n在这里，男性（奇怪地）占据了主导，站起来面对新员工。\n\n想象一下 Facebook 的公司场景：大楼里挤满了年轻的、情感笨拙的男性极客，其中点缀着可能占人口\
  \ 10% 的年轻女性。这可能会出什么错呢？\n\nFacebook 并没有严厉地监管这个性与法律雷区中的每一步，而是倾向于制定基本准则。我们的 `HR 人员`\
  \ 委婉但明确地表示，我们可以邀请同事约会一次，但“不”就是“不”，在那之后你再也没有机会了。邀请一次后，你的任务就结束了，任何超出此范围将受到制裁。\n\n\
  *所以你只有一次射门机会，对吧？* 我心想。最好明智地利用那一次机会。\n\n接下来是对女性的警告。我们的男性 HR 权威人士在女性女性同僚的偶尔支持下，开始了一场关于避免穿着会令同事“分心”的服装的演讲。我后来得知，经理确实偶尔会把女性员工拉到一边，严厉斥责。其中一个例子发生在\
  \ `Ads` 部门，一个看起来大约十六岁的实习生经常穿着热短裤进来。这几乎是不恰当得可笑，但这就是我们那个放无忌的时代。\n\n### 作为大结局 . . .\
  \ 猥亵！\n\n在我们作为员工必须签署的奇特表格之一，有一份免除 Facebook 任何猥亵责任的声明。我们在 Facebook 期间看到的或听到的任何内容，都不能成为诉讼的对象。我不清楚这是因为，例如，我们在筛选时会遇到网站上的色情内容，还是因为那种“兄弟文化”的遗迹——这种文化偶尔会伴随着色情笑话，或某人在欢乐时光后穿着内衣昏过去而回响。\n\
  \n“我们不想创造一种每天都有人去 HR 投诉的文化。如果有人说了什么，就当面指出。希望到此为止，你就可以继续你的工作了。”\n\n表演结束。我们都拿上福利包、笔记本电脑和手机，逃命地离开了那里。\n\
  \n回到我在 `Ads` 区域的新办公桌，我启动了笔记本电脑。已经有两封邮件在等待了。一封是形式上的，简单写着“欢迎来到 Facebook”。另一封是来自任务跟踪系统的邮件，表明我被分配了几个要修复的\
  \ bug。像其他每个工程师一样，尽管我也是一名产品经理，但我需要通过工程训练营——这是一门为期六周的课程，它将一个 `n00b`（新手）吸收进去，产出一个 Facebook\
  \ 工程师。它也是一种筛选机制，为管理层提供了对潜在糟糕招聘的首要警示。通过前端代码、后端基础设施以及之间一切内容的加速课程，我们学会了 Facebook 的方式。这家公司似乎有一种基因里的倾向，去自酿酿其技术栈中的几乎每一个元素，偶尔使用开源语言或工具，但随后对其进行定制，直到它们变得比任何其他事物都更像\
  \ Facebook。由于即使是经验丰富的工程师也来自一个完全不同的宇宙，因此对他们进行灌输“唯一真理”是必要的。对于刚出校园、对真实生产工程如何运作一无所知的毕业生来说，他们的整个技术世界观将被塑造成以符合\
  \ Facebook 的观点。从那以后，即使在其他公司工作，他们也会带着那些偏见和态度，就像那是上帝启示的真理一样。现在在 Facebook 的 Google\
  \ 员工肯定也做了同样。我有五个 bug 要修复。我甚至不知道如何编写 `PHP`，这是 Facebook 编写的前端语言。在那个年代，那是臭名的烂语言和开发环境，选择它仅仅是因为那是扎克（Zuck）作为一个黑客所知道的。\n\
  \n遵循在线文档，我成功设置了一个 `dev server`，即我进行开发的机器，就像一个个人沙盒。然后，我从 `main repository` 拉取了整个版本的\
  \ Facebook 代码，并通过编辑器浏览了所有内容。\n\n为了好玩，我把 `Like` 按钮的文字改成了一个猥亵词，保存了代码，在浏览器中点击 `Reload`（它指向我私有的\
  \ Facebook 版本），确实，我现在可以和 Web 上的一切交配了。\n\n创造影响力。运运青睐勇者。\n\n我正走在道路上。\n\n\n\n\nMBA\
  \ 风格的职位描述应该是“产品首席执行官”，因为那些商学院的呆子们迷恋缩写词头衔。这是许多公司对该角色的定义，而且并不完全错误，尽管这让这份工作看起来比实际要体面得多。\n\
  \n一个更具说明性的描述是“狗屎伞”。如果你想象一场爆发的、结块状的泻如倾雨，像上帝降临的圣经式报罚一样倾下，这大致就是你在初创公司或像 Facebook 这样大型、知名且复杂的组织中所处的处境。你，我亲爱的产品经理，是你工程团队的公用仆人，当他们伏在键盘上疯狂打字时，你在他们头顶举着一把巨大的、笨重的\
  \ `paramerde`（遮阳伞）。\n\n根据定义，你所做的是除了手手键盘写代码之外的所有需要做的事情。这意味着要与隐私法律团队参加无休止的会议，对你的产品将要做什么提供高度筛选和经过编辑的版本，并解释它如何符合某种远古时期的法律准则。这意味着要向满屋子微笑且脑子空空的销售人员推销，以便他们开始为客户泵水，并将资金引入你的新产品宝宝中。这意味着要与其他产品经理周旋，要么为了诱导产品变更，要么为了讨要一些工程资源。这意味着要在与高级管理层的高级会议上为产品站台，并试图将其像一个快速掉落的俄罗斯方块一样，置入他们世界原始的蓝图中。这意味着当其他产品经理找来寻求好处时，保护你的团队免受他们的侵扰，或者争辩降低你产品计划中某些元素的优先级，以换取他们计划中的某些元素。\n\
  \n作为产品经理，如果你能说服工程师构建你规定的东西，你就完蛋了。但如果你做不到，你就就像一个失去对军队控制的独裁者。无论你背后是否有联合国或教会的支持（即如果管理层已经封你为领袖），你早晚都会出现在行决队面前。Facebook\
  \ 广告团队中最可怜的景象莫过于那些失去了工程师信任的 经理们。他们名义上负责某些产品领域，却就像是被占领国家的流亡政府：坐在那里，摆着职位的全部派头，到处发送电子邮件和路线图，却一无产出。\n\
  \n在内部，这是一份卑微、卑躬屈膝的工作。\n\n在外部，情况则是另一回事。\n\n作为一名 Facebook 产品经理，你就像一个阿富汗军阀或海盗船长：在任何外人看来都极其可怕，是整个公司和行业的灾星，但实际上几乎无法控制你那小帮工程师混混兵，而且离叛变仅一步之遥。对外部世界来说，你的工作很容易：一封只有两行的邮件就能让任何公司的高级管理层几乎瞬间地在\
  \ Facebook 的接待区里焦切地候着。我曾这样构思过许多这样的初创公司，尽管我迟到且态度恶劣，他们依然在奉承中战战兢兢，要求并获得了对他们整个产品和业务模式的完整演示，然后在的一场四十五分钟的会议后将他们打发走。\n\
  \nFacebook 是每个人床上的八百磅大猩猩。在你能让这只大猩猩做点事的范围内，你就拥有了所有人的关注。Facebook 产品经理中最卑劣的人误认为这种权力是自己的。这种不可理喻的装腔作势充斥在每个产品管理团队中，但\
  \ Facebook 这种无懈可击的既得利益让他们比比常更繁荣。\n\n### 我的特定产品是什么？\n\n我新发现的领域是针对 Facebook 广告系统的广告投放（Targeting）。投放是广告主用于定义一组用户时使用的数据和工具集。它在本质上可以是人口统计学的（例如，三十到四十岁的女性）、地理性的（佛罗里达州萨拉索塔五英里内的人），甚至可以基于\
  \ Facebook 个人资料数据（你是否有孩子；即你是否属于妈妈群体？）。\n\n可以说，投放是数据与金钱道路交汇的地方。用物理学类比，压力是单位面积上的力，同样地，变现是每个像素的数据量：你为每平方英寸屏幕空间带来的数据越多，该广告的价值就越高。投放就是将这些数据应用到屏幕空间的方式，它是将纯数据转化为现实现金的炼金术。\n\
  \n由于更多（优质）数据意味着更多的钱，因此衡量 Facebook 的单广告变现情况就是衡量该数据-现金转换过程运行良好程度的指标。为此，在正式工作的第一周，我启动了公司的营收仪表板。这些面板是一系列内部网站，仅供高级管理层或广告部门员工访问。访问基于“按需知情”原则，因为总营收是敏感的；每个人都知道\
  \ Facebook 终将上市，即使不确定确切时间，而外人士会渴望非法窥视这些数字。\n\n所有的营收仪表板都是黑色的，配有黄色或白色字体，非常像你在华尔街交易桌上看到的彭博终端。它们可以根据地理位置、广告产品、时间段以及任何与广告系统运行相关的属性进行切片和细分。\n\
  \n我进入顶层仪表板。正如我最终学到的那样，Facebook 为每个领域都有一份高层报告，无论是广告、增长还是其他，定义成功的关键数字都用大号黄字标在屏幕左上角。月活跃用户（Facebook\
  \ 的*衡量*标准）、每日收入、移动用户——无论是哪种概括你所所属的 Facebook 世界健康的指标——它就在那里，带着不可置疑的终局性呈现出来。\n\n*等一下！什么？*\n\
  \n我再次查看，以确保我没有将报告范围缩小到某个该死的国家。我点击了刷新。\n\n不是。由于 Facebook 法律部门的原因，我无法与你们分享的可怜数字是 Facebook\
  \ 的平均 CPM（千次展示成本）。\n\n这简直是狗屎。\n\n\n\n\n\n这是我加入 Facebook 广告（Ads）时的人员状况：大约三十名工程师和一名设计师，分布在十几个产品产品中，以六位产品经理为核心分为几个大领域，其中就包括我之一。这整个热闹的马戏团由我的老板\
  \ `Gokul Rajaram` 运营，他似乎总是在同时写三封邮件，并参加至少两场会议，一场是面的，另一场通过 Skype 或他的手机。\n\n`Gokul`\
  \ 是广告部门名义上的产品负责人，这意味着他是那个“产品按摩师”，负责为 Facebook 在广告业务中实际构建的内容提供整体方向，并管理产品经理本身——在当时，那人是一群难以管教的家伙，每个人都有自己的一块微型产品领地。\n\
  \n我们拥有的并不是什么整体的广告策略，而是空气中弥漫的一种模糊感觉，一种集体情绪，就像倾斜的地板一样，倾向于让更多人走向某一方而非另一方。就 `Targeting`（投放）和相关团队（如\
  \ `Optimization`（优化）——由面试过我的那个以色列人运营）而言，这里看起来像是一个由随机路线图和产品想法组成的、随遇而安的马戏团。从这种喧闹的混乱中涌出的许多想法有趣且令人兴奋；但许多纯粹是怪异的且几乎毫无效果。许多地方神话（大多没有数据支持）围绕着\
  \ Facebook 分享的魔力价值，或为你的 Facebook 页面建立受众的价值盛行。\n\n正如每个产品经理都有一个产品营销经理（PMM）围绕该团队的创作编写营销故事一样，营销部门也有一个类似于\
  \ `Gokul` 的对应人物。`Brian Boland`（我们在第一次和扎克（Zuck）会议时已经见过他了）坐在 `Gokul` 旁边，管理着日益壮大的 `PMMs`\
  \ 队伍（用 Facebook 的术语来说）。在 Facebook 广告部门的每个团队，一个 `PMM` 都会与一个 `PM` 配对，就像产品端的 `Twiddledum`\
  \ 对应的营销端 `Twiddledee`。`Sales`（销售部门）是一支被组织成多层级结构、分布在几十个区域办公室的军队，被隔绝在外，向 `David Fischer`\
  \ 汇报，他是谢尔尔（Sheryl）在 Google 时的成员之一。除了 `Fischer` 对 `Sheryl` 的输入外，`Sales` 纯粹是任何生成产品的下游消费者，从\
  \ `Boland` 的其中一个 `PMM` 那里获得预处理过的推销方案。\n\n在加入 Facebook 之前，我唯一一次在大公司工作的经历是在 `Goldman\
  \ Sachs` 的交易平台，那里是如此怪诞且特立独行，以至于对我现在所处的这种政治氛围来说，经验非常糟糕。我会非常熟悉这类 `Gokul`/`Boland`\
  \ 类型的人，因为我的一半工作都花在试图操纵（通常是无效的）他们的情感和感知上。\n\n每个为 Facebook 产品贡献贡献的人都向 `Gokul` 或 `Boland`\
  \ 汇报：产品经理（包括我）向 `Gokul` 汇报，`PMMs` 向 `Boland` 汇报，工程师向他们的当地工程经理汇报，后者又向广告工程经理 `KX`（`AdGrok`\
  \ 在我第一次面试 Facebook 时就推介过）汇报。这个管理层共同运营着广告业务，无论结果好坏。\n\n## 实践中的企业舞蹈\n\n这种在很大程度上没有编排的企业舞蹈在实践中是如何演变的？\n\
  \n遵循 `Gokul` 模式的 Facebook 广告产品管理意味着每周一次产品经理会议。当时，是六到八个人围坐桌子旁，讲述他们那周的工作。这带有某种张扬、炫耀的特质，几乎就像一场\
  \ `Y Combinator` 的晚餐会，在会上，你被要求展示你在 Facebook 广告蛋糕中特定部分上不断不断加速的进展。当我和一群 PM 同事一起走去参加另一场每周\
  \ `Gokul` 会议的微演示日（mini–Demo Day）时，我会在脑中排练我的脚本。\n\n此外，每月还有一次全员产品经理会议，旨在创造某种程度的跨公司凝聚力。这些会议由（还能有谁？）`Chris\
  \ Cox` 主持，他因那段入职演讲而闻名，当时是 Facebook 产品负责人。这是将 `YC-Demo-Day-style` 风格的会议提升到了公司层面，充满了圆滑的销售辞令，每次都有\
  \ PM 团队中不同的阶段性当红宠儿上台，赢得阵阵掌声。每场会议上，都会有人根据其他 `PMs` 的推荐获得卓越 `PM-ship`（产品经理精神）团队奖。`Cox`\
  \ 有一种奇怪的习惯，他通过反复挥动手臂来鼓掌，使手指在每次旋转时剧烈地击响，这成了全屋人接继鼓掌的信号。\n\n## 变现使命\n\n广告团队的任务非常简单：赚更多的钱，但在此过程中不要得罪用户。Facebook\
  \ 的变现侧仍然受困于那种典型的早期初创公司的从属角色——这种公司大多面向消费端，且 CEO 厌恶肮臭的铜臭（注：原文为 grubby lucre，意指卑鄙的钱财）。就像一个耐心的母亲跟在她那具有破坏性的蹒跚幼儿身后，并随手捡起丢弃的玩具，`Ads`\
  \ 被要求利用公司面向用户端推出的任何新功能来赚钱。那些产品在设计时并没有考虑变现；事实上，它们充其量是围绕用户参与的经过研究的产物，最坏的情况下则是扎克这位任何“愿景型”产品负责人或扎克本人所吐露的最新脑力产物。广告团队随后被迫将这些产品（无论成功失败）转化为金。从中建立起一项可行的业务，就像试图从\
  \ `Home Depot` 随机挑选零件来盖一栋房子：如果你运气好或非常有主见，你可能做到，但更有可能你最终只会得到一个没人想住的奇形小屋。直到 2012 年左右，Facebook\
  \ 广告恰恰是如此。\n\n这就是 IPO 之前的 Facebook 产品经理生活，尽显风华。\n\n## 闭塞的世界\n\n通过在 `Ads` 内部的对话以及我参与的各种会议，我开始认为自己进入了一个平行宇宙，一个意料之外的社交媒体迷地带。所以我像我常做的那样，通过\
  \ `Facebook` 和 `LinkedIn` 探听大家的背景，以了解我所处这家公司的性质。\n\n很显然，广告团队中没有任何人曾在任何广告公司工作过。唯一的例外是那些可能做过出版端技术的\
  \ Google 人。这非常奇怪，原因有二：广告技术是一个圈子的世界，而且每个广告产品经理或工程师的简历里都满了在某家广告公司的任职经历。它还是一个相当闭塞的世界，外部人士很少进入，内部人士也很少离开，被行业忠诚度束缚在将像素转化为金的业务中。\n\
  \n\n\n\n最终，这种无知将在一个名为 `Open Graph` 的赌注公司产品及其变现孪生产品 `Sponsored Stories` 的兴衰达到其华丽的巅峰，在后的章节中，你会听到很多关于这两者的故事。\n\
  \n不过，正如我对待 `Twitter` 一样，我会做一个明确的申明：这里的陈述，甚至后期更具指责性的陈述，在当时都是真实的（或者至少在我看来是真实的）。科技公司，即使是规模较大的公司，也是动态的野兽。它们变化极快。`Facebook`\
  \ 的救赎之处——那种在过去拯救了它并在未来也将其拯救它的魔力倾向——是它快速适应变化情况的能力，或适应其自身大胆产品押注结果的能力。在 2011 年和 2012\
  \ 年大部分时间里，`Facebook` 的广告产品是一个烂摊，对于最不挑剔的广告商来说其价值未经证明，而且对于大多数试图实际推动销售的营销人员来说，除了几家烦人的游戏公司外完全毫无用。其变现能力非常可怜，广告单元本身小得荒谬且毫无吸引力，提供的管理工具也充满漏洞且使用起来痛苦万分。\n\
  \n但 `Facebook` 会变得非常聪明，非常迅速。\n\n到 2013 年初，这家公司就确切地发现了它的价值所在，而这与 2011 年左右 `Ads` 团队充斥的任何拜占庭式的胡言乱语，或者它它向资金雄厚的广告商推销的公开营销材料无关。`Facebook`\
  \ 基本上拥有在线广告的未来。它是如何从广告零蛋变为英雄的，是这个故事的核心。\n\n## Google *Delenda Est*\n\n天才本身产生原创思想的能力，正如一个女性单身无法生育一样微小。外部环境必须使天才得以结实，并像在某种意义上成为其后代的父亲。\n\
  \n—— *亚瑟·叔本华，“论才华”，《文学艺术》*\n\n### 2011 年 6 月\n\n`Mark Zuckerberg` 是一个天才。\n\n并不是在虚构电影《社交网络》中所描绘的那种阿斯伯格式的、自闭症式的、那种具有非凡能力的认知天才。那是一种缩小了原始含义的现代定义。\n\
  \n我也不会声称他是`乔布斯式`的产品天才。任何声称是这样的人都必须解释那挤满被遗忘的`Facebook`产品失败坟墓。还记得“Home”吗？那是为`Android`手机提供的`Facebook`功能主屏幕，于\
  \ 2013 年大张旗鼓地推出，`Zuck`与即将失望的智能手机制造商`HTC`的 CEO 一同出现？或者`Facebook`在 2012 年对`HTML5`的错误押注，这让移动应用的运行缓慢到了令人沮丧的爬行速度？还有`Facebook`的第一个搜索版本，仅限英文，主要用途是查看你朋友的单身女性朋友，并且已经停用了？还有独立的移动应用\
  \ `Paper`，它是对 `Flipboard` 的无耻抄袭？还有一些我无法说名字的未发布产品消耗了大量资源，在`Zuck`改变主意并关掉它们后在内部死掉。\n\
  \n如果他是一个产品天才，那么有很多偶然性可以抵消他的神圣的疯狂。\n\n不。我提交他是一个产品天才。（注意：提供的剩余文本包含重复/碎片化的句子；关于 Facebook\
  \ 文化演变及其领导层地位的核心叙述已根据指令保留。）\n\n\n\n\nFacebook 充满了真正的信徒，他们真的、真的、真的不是为了钱，而且真的、真的绝不会停止，直到地球上的每个男人、女人和孩子都盯着一个带有\
  \ Facebook Logo 的蓝框窗。如果你仔细想想，这比单纯的贪婪要可怕得多。贪婪的人总能以某种价格被收买，他的行为是可以预测的。但真正的狂热分子呢？他是无法被收买的，没人知道他疯狂的幻象会让他和追随者做出什么。\n\
  \n这就是我们所要讨论的马克·埃利特·扎克伯格（Mark Elliot Zuckerberg）和他创立的公司。\n\n2011 年 6 月，Google 推出了一个显而易见的\
  \ Facebook 复制品——`Google Plus`。它极其地嵌入到 `Gmail` 和 `YouTube` 等其他 Google 产品中，旨在所有 Google\
  \ 服务的用户整合到一个在线身份中，就像 Facebook 对整个互联网做的那样。考虑到你在 Google 用户体验中几乎处处可见 `Google Plus`\
  \ 注册按钮，其网络指数级增长的可能性是非常真实的。而且，该产品本身相当不错，在某些方面甚至比 Facebook 好。照片分享更好，更倾向于严肃的摄影师，而且大部分设计更简洁、更极简。Google\
  \ Plus 的另一个加分项是：它没有广告，因为 Google 可以用其付费搜索金矿 `AdWords` 来进行补贴。这是无情垄断者经典的“左手洗右手”策略，就像\
  \ 90 年代微软利用 `Windows` 的收入来用 `Explorer` 击败 `Netscape Navigator`。通过拥有搜索，Google 将也将资助社交媒体的扩张。\n\
  \n这一突如其来的举有些令人惊讶。多年来，Google 对 Facebook 的不屑一顾闻名，其搜索垄断的坚固堡垒让它感到不可侵越。但随着从 Google 流向\
  \ Facebook 的昂贵人才单向游行没有尽头的持续，Google 变得紧张了。公司就像国家：人口实际上只用脚投票，要么来，要么走。Google 实施了一项政策：任何获得\
  \ Facebook 录用邀请的理想 Googler 都会被一份丰厚的 Google 反向报价立即击败（留住）。当然，这导致了一批 Googler 涌向 Facebook\
  \ 面试，仅为了将获得的 Offer 作为谈判筹码来提高他们在 Google 的薪水。但许多人是真的离开了。Facebook 的 Googler 就像罗马帝国兴起时的希腊人：他们带来了大量的文明和技术文化，但很清楚谁将在不不久的将来统治世界。\n\
  \nGoogle Plus 是 Google 终于开始关注 Facebook 并正面对抗这家公司，而不是通过阴暗的招募花招和在技术会议上的刻薄贬低。它像一颗炸弹一样击中了\
  \ Facebook。扎克伯格将其视为一种生存威胁，堪比于 1961 年苏联在古巴部署核武器。这是大敌向我们自身半球的进军，它比其他任何事物都紧抓住了扎克伯格。他宣布了“封锁”（Lockdown），这是我任期间第一次也是唯一一次。正如向新入职员工所说明的那样，封锁是一种追溯到\
  \ Facebook 最早期的战争状态，当公司面临某些竞争或技术威胁时，没有人离开离开。\n\n你可能会问，封锁是如何正式宣布的？在 Google Plus 发布的当天下午\
  \ 1:45，我们收到一封邮件，指示我们在“水族馆”（Aquarium）周围聚集。实际上，在技术上，它指示我们聚集在“封锁”标志周围。这是一个霓虹灯，固定在水族馆上部的玻璃立方体上方，几乎就像公路公路旅馆上的“无空房”标志。当公司的人聚集完毕时，那个灯牌已经亮起，向我们预示了即将发生什么。\n\
  \n扎克伯格通常是个糟糕的演讲者。他的演讲语得像一个习惯于只分析语言内容的人，而且快得像一个没有时间进行修辞修饰的极其敏捷大脑。这基本上是极客语（geek-speak），是那些同时打开四个屏幕电脑代码的人所说的英语。他的举止是冷漠且与观众脱节的，然而但他保持着那种近乎病态的强烈凝视。这是一种令人不安的目光，让不仅仅一个访谈者不可挽回地动摇（通常是某些正在遭受严厉产品评审的可怜员工），而且这种目光出现在他出席的每一个《财富》（*Fortune*）或《时代》（*Time*）封。人们很容易在这种目光中投射出一个令人骨悚然的人格。那个不幸的第一印象，加上电影《社交网络》（*The\
  \ Social Network*）中的刻板刻画，可能是围绕 Facebook 动机的无处不在的怀疑和偏执产生了一半的原因。但偶尔，扎克伯格会有一个充满魅力且清醒伟大的时刻，那将是震撼的。\n\
  \n2011 年的“封锁”演讲并没有承诺成为那种时刻之一。它是在执行管理人员座椅的办公桌旁的开放空间完全即兴发表的。Facebook 所有的工程师、设计师和产品经理都聚在他周围，神情专注；那场面让人联想到一位将军在战场上向士兵发表讲话。\n\
  \n他告诉我们，对用户的竞争现在将是直接且零和博弈的。Google 推出了一个竞争产品；一方获得任何东西，另一方就会失去。当世界对 Facebook 和 Google\
  \ 版本的 Facebook 进行现场测试，并决定更喜欢哪一个时，提高我们的水平取决于我们每一个人。他模糊地暗示了我们将根据这个新竞争对手所考虑的产品变更。然而，真正的要点是让每个人追求更高可靠性、用户体验和网站性能的标杆。\n\
  \n在一个首要格言是“完成胜过完美”（DONE IS BETTER THAN PERFECT）和“完美是好东西的敌人”（PERFECT IS THE ENEMY\
  \ OF THE GOOD）的公司里，这代表了路线的纠正，转向了对质量的关注，而这种关注通常会输给发布的驱动力。这是扎克伯格在 Facebook 遭受某些尴尬\
  \ Bug 或宕机后偶尔发出的那种让你保持房间整洁的唠叨父亲式提醒。\n\n在结束了又一串陈词滥调调后，他切换了节奏，并引用了他在哈佛及之前学习的古代经典，爆发出一阵修辞。“你们知道吗，我最喜欢的罗马演说家之一每场演讲都以这句话结尾：Carthago\
  \ delenda est。‘迦太基必须被摧毁。’由于某种原因，我现在想到了这个。”他停顿了一下，一阵笑声席卷席间。\n\n上述演说家当然是老卡多（Cato the\
  \ Elder），一位著名的罗马元老，也是对迦太人的攻击者，他们要求摧毁罗马在第三布匿战争中的伟大竞争对手。据报道，无论主题是什么，他都以这句话结尾。\n\n\
  Carthago delenda est。迦太基必须被摧毁！\n\n\n\n\nFacebook 模拟研究实验室（Facebook Analog Research\
  \ Laboratory）立即行动，制作了一张海报，上面在一个风格化的罗马军团头盔上，用命令式的粗体字体写着 `CARTHAGO DELENDA EST`（迦太基必须毁灭）。这家临时搭建的印刷店印刷了各种海报和单品，通常在深夜和周末半秘密地发放，那种方式让人联想起苏联的“地下出版”（samizdat）。艺术本身总是是出色的，既唤起了二战时期宣传海报的机械排字风格，又有当代互联网设计感，并配有仿古的标志。这是\
  \ Facebook 的宣传部，最初在没有任何官方许可或预算的情况下，于一个闲置的仓库空间启动的。在许多方面，它是 Facebook 价值观的最好典范：反叛传统却又在军事化特质上令人振奋。\n\
  \n迦太基海报很快贴满了整个校园，并几乎同样被偷光。公司宣布咖啡馆将在周末开放，并严肃地提出让往返帕洛阿尔托和旧金山的班车在周末也运行。这将 Facebook\
  \ 成为一家真正的全天候公司；无论通过何种手段，员工都被预期要到岗尽职。在一个被视为对少数有家庭的员工的仁让步中，公司还宣布欢迎家庭在周末访问并在咖啡馆用餐，让孩子们至少在周末下午能看到爸爸（是的，大多是爸爸）。英国交易员\
  \ Trader 和 Zoë 来看过，无论怎么看，我们并不是那里唯一的几个家庭。常见的场景是：一个穿着带有 Logo 连帽衫的疲惫 Facebook 员工，在回到办公桌之前，与他的妻子和两个孩子度过一小时的高质量时光。\n\
  \nFacebook 内部小组层出不穷，剖析 Google Plus 产品的每一个元素。在 Plus 上线的当天，我注意到一个名为 `Paul Adams` 的广告产品经理在一间狭小的会议室里与扎克伯格以及几位高层成员进行亲密交谈。众所周知，在他跳槽到\
  \ Facebook 之前，`Paul` 曾是 Google Plus 的产品经理之一。现在产品已经发布，他不再受到与 Google 的保密协议的限制，Facebook\
  \ 正由他向领导层介绍该产品的公开特性。\n\nFacebook 可没在开玩笑。这是一场全面战争。\n\n我决定进行一些侦察。周日早晨上班途中，我错过了 `101`\
  \ 号公路的帕洛阿尔托出口，而是下到了山景城（Mountain View）。我沿着 Shoreline 路走去，进入了广阔的 Google 园区。五彩色的 Google\
  \ Logo 随处可见，笨笨的 Google 色彩自行车散落在庭院里。我以前来这里看过朋友，知道哪里可以找到工程大楼。我走向那里，思考了一下停车场。\n\n它是空的。完全是空的。\n\
  \n有趣。\n\n我回到 `101` 号公路北向，开车前往 Facebook。\n\n在加利尼亚大道大楼，我不得不寻找停车位。停车场满了。\n\n一眼就能看出哪家公司在拼死战。\n\
  \n*迦太基必须毁灭！*\n\n# 纵身直入\n\n当我跃入深渊时，我是脚朝天、头向前冲进去的，并对这种堕落的姿态感到愉悦，认为这是一种美。\n\n—— 费奥多·陀思妥耶斯基，《兄弟们》\n\
  \n## 2011 年 8 月\n\n是时候发布我的第一个 Facebook 产品了。\n\n我加入 Facebook 时，正值一个名为 `Kitten`（小猫）的产品计划初期，这完全在我的目标范畴之内。正如“潜水运动”、“雷达”和“激光”一样，`Kitten`\
  \ 最初是一个缩写，其起源或或少已被人遗忘；现在这个名字仅指代 Facebook 话题提取（topic-extraction）技术的现状。话题提取是支撑巨大互联网技术（例如\
  \ `Google Search`）的关键但无趣的人工智能挑战之一，但永远不会获得像自动驾驶那样酷炫计划的关注。本质上，它是一种程序化的方法，将人类文本（如信息、网页或社交媒体帖子）复杂的术语映射到语义分类字典中。例如，你的状态更新“老虎真的成功在美网公开赛上击中了那个球”会自动映射到“老虎·伍兹斯”、“高尔夫”和“美网公开赛”等类别。在一个充斥讽刺、拼写错误、俚语和双关语的人类语言极其难以理解的世界里，快速对用户生成的内容进行分类是一种尖端的黑客手段。在广告领域，目标是将点过老虎·伍兹斯页面或分享过高尔夫相关文章链接的人放入“高尔夫”定位分段中，让高尔夫相关的广告商可以触达。\n\
  \n个人轶事：我在 Facebook 做的第一个产品决策与 `Kitten` 有关。上班的第一周，我被分配领导每周一次的定位团队会议，涉及十几个工程师、产品营销人员和外部产品经理。说我一头雾水都是轻描淡写；幸运的是，团队的惯性或或少程度上推动了会议进行，涵盖了由代管定位的产品经理提供的议程主题列表。当对一个明确的产品决策产生分歧时，所有的目光突然转向了我。\n\
  \n问题是这样的：这些从页面名称和用户行为中巧妙提取出的新奇定位话题，将如何被标注在广告商用于配置广告的定位用户界面中？Facebook 已经有了诸如“足球”和“时尚”等文本字符串形式的“兴趣”定位；我们需要通过某种方法来部署这些特殊的“超级”关键词，它们代表了数十个或数百个其他相关的含义类别。\n\
  \n团队的一部分人想要完全抛弃原始关键词，强迫所有广告商采用这种未经测试的技术，这在广告商挣扎着采用新功能时造成了重大的运营挑战。另一派则希望简单地在现有关键词的基础上发布新功能，并以某种方式对其进行特别指定，无论是通过用户界面设计，还是通过其他手段。\n\
  \n我很快发现，产品经理作为裁决者的角色——在产品团队内部对立派系之间调解，或者在迷失于底层技术细节的工程师之间传达最终用户的声音——基本上就是这份工作的核心日常职。被十几双眼睛瞬间吸引注意力，脑海中还记忆着\
  \ Twitter 交易那段苦涩的回忆，我毫不犹豫地建议道：“保留旧关键词。将 Facebook 使用关键词的 20% 收入迁移到一个完全全新的范式是不可行的。在标记方面，使用井号符号（#），就像\
  \ Twitter 标签一样。用户已经习惯将 #Golf 视为高尔夫这一高层抽象概念的超级符号；这只是借用 Twitter 的成果。此外，这会挺有趣的——让 Twitter\
  \ 标签成为 Facebook 上可以购买的商品。”\n\n\n\n这一想法在房间里蔓延，最终赢得了大家的点头赞同。成千上万投入了数亿美元数营销资金的广告商，现在将进入“#嘻哈音乐”，而不是进入“Eminem”、“50\
  \ Cent”、“Drake”以及一串无穷无尽的关联关键词——而这些关键词是他们通过大量的试错，昂贵地确定的与其目标受众相关的。界面不需要更改（Facebook\
  \ 的设计资源一来就是出了名的紧张），这意味着我们可以很快上线，无需考虑任何突如其来的采纳挑战。我们只需要做的就是拼命推销这些新的定位标签（hashtags），并训练用户优先使用这些标签，而不是他们已纳入\
  \ Facebook 营销工作流的陈旧关键词。这意味着我们需要依靠产品营销人员去施压我们的合作伙伴和最大的广告商，让他们认为“#动作电影”是自民主和抗生素以来最火的东西。\n\
  \n在加入 Facebook 工作的第二天，我就已为一个 Facebook 产品赋予了具体的外部形式。\n\n这听起来可能微不足道，从大局来看，它也确实有如此。但在各种实现方案之间技术难度的平庸权衡、工程时间的优先级排序、用户感知的反复无测，以及营销新产品的需求，都是产品经理日常工作的家常便饭。华丽的新旗舰产品发布，就像意气风发的史蒂夫·乔布斯在会议室舞台上诞生的新款\
  \ iPhone 一样，吸引了主流头条新闻和非技术普通人的关注，就像猪听到��水桶的撞击声一样。但硅谷真正行进的节奏，技术进步的实际工作步，是前线产品经理在会议室或工程办公区与团队聚在一起，就像每一部伟大的战争电影中领着排队的中尉一样，思考该构建什么、如何构建，以及构建后如何售卖。成千上万这样的团队遍布在硅谷，这才是技术开发工作真正完成的方式。\n\
  \n到 8 月初，在我加入两个月后，Kitten 似乎已经准备好上线了。就像知道何时停止编辑并最终出版一本书一样，知道何时上线充其是一门微妙的艺术，最坏的情况下只是一场醉后的硬币掷。有时你并没有完成一个产品，只是放弃了目前对其进行改进的任何希望，然后让它推出去。产品经理要么给那些急于让自己的作品见日的工程师踩下刹车，要么反过来通过鞭策和驱使让完美主义工程师停止纠结代码，并去获取一些真实的用户。通常情况下，无论是在初创公司还是像\
  \ Facebook 这样激进的公司，都应该有一种对上线的文化偏好。完美往往是好的敌人，正如 Facebook 的海报在每面墙上大喊着的那样：完成优于完美（DONE\
  \ IS BETTER THAN PERFECT）。很少有公司因为上线过早而灭亡；最坏的情况下，你只会面临一次性的产品尴尬（就像 Apple 的第一版 iPhone\
  \ Maps 应用那样）。然而，有无数公司因为失去发布勇气而灭亡，在自我怀疑、犹豫和内部不决定的昏迷状态中冻结。正如生活如此，商业亦是然：保持行动优于不作为的偏好。\n\
  \n带着这个念头，我们将 Kitten 定定于 2011 年 8 月 1 日上线。产品营销人员编织了他们诱人的故事，产品经理（也就是我）四处奔波，确保每个人都知道发生了什么，工程师们偷偷提交了最后的修改（可能没有告诉产品经理）。然后，在一个晴朗的早晨，一位\
  \ Kitten 工程师操纵了关口逻辑，使仅限员工可以看到新的广告投放，而任何 Facebook 的广告商都可以将资金投向我们新的标签定位细分市场。当天稍晚些时候，新的定位面向了所有用户，Kitten\
  \ 正式进入了产品市场。\n\n由于一些微小的技术 Bug 以及一两个团队的不知情，出现了一些轻微的动荡，但除此之外，一个影响 Facebook 五分之一收入的重要新功能顺利上线了。虽然这次成功与我的能力仅微乎其微，但我收到了广告领导层的赞誉，因为我在加入短短几周内完成了一次激进的产品发布。本质上说，我赢得了勋章：我安全地交付了市场似乎渴望的新产品，在尊重工程团队的同时，并对未来的迭代制定了计划。总而言之，这就是\
  \ Facebook 对产品经理的期望。\n\n\n\n这是一个理解 Facebook 及其伴随的数据变现挑战的最佳比喻。想象你正处于美国任何大城市市华中心一家嘈杂、繁忙的酒吧里。人们在和朋友聊天，也许在结交新朋友，拍些奇怪的照片，搭讪漂亮的人等等。Facebook\
  \ 就是那家酒吧，也是欧洲的每一家酒吧、中东的每个繁忙咖啡馆，以及拉丁美洲的每个咖啡馆。Facebook 就是人类聚在一起、八卦、调情、分享和创造体验的喧闹集会。\n\
  \n现在，想象你拥有每一场发生对话的书面转字录，以及每个人的匿名 ID。你知道他们在哪里，以及正在和谁聊天。作为 Facebook 广告投放的产品经理，这实际上就是你拥有的全部。\n\
  \n听起来量很大，对吧？\n\n其实并没。问问自己，当你坐在最爱的廉价酒吧里黏糊糊的桌子旁和朋友在一起时，多久会提到任何具有商业意义的话？如果世界上每个大品牌的首席营销官和每个商户都在你耳后偷听，他们的集体耳朵会有多久会竖起来？实际上，我完全知道有多频繁；这是我加入\
  \ Facebook 时做的最早的研究之一。\n\n简短的版本是“一点也不怎么频繁”。没有人会说：“我真的很喜欢这双阿迪达 Adizero Boston Boost\
  \ 5 鞋的脚感，我觉得你也应该买双。”（阿迪达！快进来，趁她心脆弱的时候和她建立一些品牌价值！）或者某些非常易于解析的句子，比如“我需要在 7 月 13 日飞往波士顿，23\
  \ 日返回，并希望花费不超过三百五十美元。”（携程！快快，快给出一个机票报价！）\n\n而且当这些情况真的发生时，事情并不像看起来那么简单。我几乎可以向你保证，当字符串\
  \ `Obama` 出现在信息或帖子中，且位于周五晚上阿拉巴马马州某家 Facebook 版酒吧里时，半数情况下前面会跟着词 `fucking`，你可能不应该把这个人加入你的\
  \ ` #Democratic Party`（民主党）投放集群，除非你想让他划掉每一张将占据他 Facebook 体验的该死的微笑奥马照片。顺便提一下，由于所有的负面反馈，这将导致奥马广告的投放量暴跌，这意味着他们的客户经理很快就会给你发邮件，问为什么他们无法消耗预算，而去你妈的，那是你的问题，你将变得讨厌阿拉巴马州的每一个该死的乡巴佬，以及讨厌奥马竞选活动如此严密地监控他们的广告数据。\n\
  \n噢，忽略任何前面带有 `fucking` 的有趣词的提及？好主意。那如果信息里写道：“奥马真是个了不起的总统，对吧？”并伴随着一个撇笑呢？当然，你并没有在文字中看到那个撇笑。该死。我上次检查时，还没有人写出能标记反讽式陈述的\
  \ `HumanSarcasm` 代码模块。而且互联网上的讽刺、谎言、糟糕的冷笑话和双关语比高中啦拉啦队大会还要多。\n\n噢，顺便说一下，你还需要用世界上每一种语言解决这个问题，因为国际化的\
  \ Facebook 就是那样的。你的格林尼语（Tigrinya）怎么样？\n\n最后这一点不仅仅是一个修辞性的反问回答，它值得推敲。\n\n如果你问任何 Facebook\
  \ 员工为什么在公司工作，第一个答案会是“规模”、“数量”的变体——本质上是因为 Facebook 拥有数亿、很快将达到数十亿的用户。公司非广告、面向用户的一侧可以推出任何随机的功能或产品，仅仅因为身处\
  \ Facebook，你瞬间就拥有了数亿用户，尽管这个产品可能是一个“定时炸弹”（而 Facebook 当时如此大胆且鲁莽，它发射了很多炸弹）。这些数字除了 Google\
  \ 之外在任何地方无法获得，这些数字让你之前可能待过的任何初创公司相形见��，在那里你有十万用户就算幸运了。\n\n然而，当你处于广告端时，这种规模反而对你不利。从\
  \ Gokul 的管理理念中可以明显看出（这种理念本质上是“要么做大，要么回家”），我们被赋予的任务是找到一个像 Google AdWords 那样的突破性产品，它将彻底改变\
  \ Facebook 的命运。考虑到 Facebook 的收入，那已经非常巨大了（记住：十亿乘以任何数字……），想要通过任何产品在损益表上产生显著影响是非常困难的。\n\
  \n无数的想法被提出来，要么是由某些心肠好的工程师或销售人员，甚至是投放团队的成员提出的：大多数是小众用例，能让某些细分广告主受益，并总共可能产生 2000 万美元的收入。这在初创公司是一笔巨款，因为这意味着你的产品一启动就有\
  \ 5000 万用户，但在 20 亿年收入的计划中，这微不足道，不值得投入精力启动。\n\n将用户按国选区分组，并允许政治广告主针对特定的投票站？\n\n*不。*\
  \ 听起来不错，但那时 Facebook 上的政治预算相对较小，而且每四年一次选举时才会出现。\n\n使用西班牙语姓名字典，并结合源自美国信息中的西班牙语使用，创建一个“西班牙裔集群”，以吸引那些试图从这一购买力增长的人群中获利的广告主？\n\
  \n*不。* 属于这个分类的人并不多，而且无论如何，测试并没有显示西班牙裔广告的参与度大幅增加。用户对这些广告感到既困惑又惊喜，但并没有点击。\n\n使用地理数据判断某人是否在远远旅行，然后向该人员投放“旅行意向者”板块的广告——即那些对机票和酒店有更高要求的富裕商务旅客？\n\
  \n*还是不！* 由于各种原因，地理数据非常复杂，在这里不值得讨论，而且显然，我们简单的启发式方法无法定位那个持有公司信用卡、热爱腿部空间和迷你吧的人。\n\n\
  即使这些想法中有一个奏效了（这只是所讨论的大量想法中的极小部分），其财务影响仍然很小。Facebook 早期的收入几乎每年翻倍，即使是现在，每年也增长惊人的 30%\
  \ 或更多。作为产品经理，为了赚你的酒钱，你必须让收入指标增长至少 5% 左右。这意味着你每年需要产生大约 1 亿美元的收入，这等同于高盛等银行的二三名华尔街交易员。算上你的增长、来自优化（Optimization）带来的\
  \ 5% 增长、20% 的用户增长以及其他新产品带来的任何其他 5% 的增益，Facebook 就能度过不错的一年。但这意味着想法的门槛确实非常高。\n\n作为产品经理，你就像一个投资组合经理，对一组组想法下注，希望押中赢家，而这往往仅仅基于直觉。\n\
  \n\n\n\n# 2011 年 9 月 3 日\n\n第二次生命的诞生远没有第一次那么剧烈。尽管仍带有某种风险，但你至少知道了这种风险的滋味，不再用“自己能以某种方式控制进程”的想法来欺骗自己。这是一场豪赌——脐带可能会缠在婴儿的脖子上——而你对此无能为力。\n\
  \n自从我从 British Trader 之前的住处搬到旧金山的一处临时租住房后，我通过电话得知了分娩的消息，冲回了奥克兰凯撒太平洋医疗中心（Kaiser Permanente）医院的同一个产房。这次出生不像\
  \ Zoë 的那次，并没有在看完一集《纸牌屋》（House of Cards）的时间结束，而是我一直担心的那种缓慢苦战。\n\n在经历了紧张又昏睡的三十个小时后，我得了一个儿子。\n\
  \n我和 British Trader 在取名上陷入了和以前对 Zoë Ayala 时完全相同的僵局争论。希伯来文化和西班牙裔文化的双重限制在男性身上几乎是不可能的，因此谈判迅速演变成了互不相让的个人喜好之。\n\
  \n此外还有割礼的问题。British Trader 的犹太教背景要求割礼，但她本人却含糊其辞。看着我儿子的小鸡鸡，我突然对割礼的念头感到倒退了。\n\n*你想对它做什么？*\n\
  \n我用放弃第一个名字的否决权（我仍然拥有完全的中间名权利）换取了割礼决定的专属权。British Trader 选择了她个人最喜欢的名字“诺亚”（Noah），我喜欢这个名字，既是因为它出自圣经，也是因为它名字中蕴含着造船的背景。\n\
  \n我选择了 Pelayo 作为中间名，为了纪念 8 世纪的西哥特族贵族，他发起了长达七世纪的将西班牙从伊斯兰统治中解放出来的斗争。就这样，Noah Pelayo\
  \ 出降于世，我也成了一个既有儿子又有女儿的父亲。\n\n我父亲的建议，也许就像书中的建议一样，通常是关于生活中不该做什么的指令，而我通常都不予理会。但偶尔他也会有清醒卓越的时刻，在我童年那片贫瘠的郊区荒野中掉落一些富有启发性的宝石。\n\
  \n其中一个宝石是关于讨论当时蓬勃发展的迈阿密毒品贸易。那是狂热的 80 年代，批发毒品走私在迈阿密是一项半可行的职业选择，尽管对于一个家庭男人来说，这是短暂的。在我们松散的社交圈子里有几个人从事这一行业，包括不止一个邻居。\n\
  \n“当一个 `marimbero`（大麻贩子）的问题不在于个人风险，而在于他们可以找你的家人。他们可以找上你，”他指着我说。\n\n众所周知，在交易失败或货物遗失后，`marimberos`，特别是那些哥伦比亚野蛮人会找你的家人，抢走你的女儿或儿子，然后一个接一个寄给你他们的手指，直到你付钱为止。我父亲坚持从事利润率较低的房地产买卖，我的手指因此安全地留在了身体上。\n\
  \n当我思考我的新孩子以及生他的女人时，这段记忆在脑海中回荡。British Trader 的浪漫之火依然在燃烧，如果需要随时可以重新点燃。但那样的话就是完全陷入了中产阶级家庭的生活：有共同财务、对昂贵学校的预期、房贷，以及定居生活中整套贪婪机制。对我来说，只有无所求的人才是真正自由的。在我财务独立（例如拥有\
  \ `fuck-you money` 辞职金）或成为一家盈利企业的船长之前，我仅仅是一个奴隶，我的束缚是有代价交换的，不仅被尿布和学费锁死，也被归属计划锁死。\n\
  \n就像当一个迈阿密的 `marimbero` 一样，在 Facebook 工作并成为父亲似乎是一个残酷的权衡，至少在我心里是这样。诚然，薪水很高，但如果你将生活水平提高到与收入匹配的程度，你就受制于行业以及运营该行业的人。我陷入了深度循环，可以追溯到高盛的日子——被那些为了昂贵生活方式而抵押自己的专业同僚包围。在我想出新的营销点子之前，Facebook\
  \ 没法寄给我 Zoë 的手指，但他们确实可以切断资助 Zoë 在梅洛帕克那每月 2,500 美元幼儿园学费的股权红利火车。我真的想成为像威利·洛曼（Willy\
  \ Loman）那样的人吗？在结束了糟糕的一天后回到家里，喝瓶啤酒，但在看着 Zoë 的眼睛后觉得这一切都是值得的，然后第二天又一次闷脸地忍受老板的气？因为当我们把湾区的房贷、帕洛奥托的约会之夜以及两所幼儿园的费用计入现金流表时，情况就会变成那样。\n\
  \n我所有三十岁以上的 Facebook 同事都在那条依赖的船上。Facebook 说跳，他们只能问“跳多高？”而他们确实跳了，背诵着任何企业剧本，跳过雇主要求的任何圈圈和障碍，甚至低到给新生儿穿上印有\
  \ Logo 的连体衣，并在发在 Facebook 上的照片会获得同样受奴役的同事们在线上的掌声。\n\n你你无疑会觉得这种论点是自私的，是一个自私坏蛋为了正当化他的自我主义而进行的咆哮，也许你是对的。然而，在一个我厌恶的暴君父亲手下长大，我从未停止梦想过逃离他压抑的存在，我发现服从于另一个主人的想法令我感到反感。更不用说，出于个人历史的原因，我再也不想再次经历任何家庭状况，无论是作为孩子还是父母。\n\
  \n在家庭方面，我仍然住在旧金山周围的一系列临时租住房里，但事情很快就会“锚定”了。我买了一艘 37 英字的帆船，资金来自 Facebook 交易中的预付现金。这艘船出人意料地位于巴尔摩，所以我让它横跨美国运到了奥克兰，在船厂花了几个月时间重新安装了索具并下水。在旧金山湾最南端的码头找到了停泊点，距离红木城的\
  \ Facebook 只有几英里，我从船骑自行车上班。\n\n\n\n\n从职业角度来看，我已完全融入了这里（至少在表面上如此）。我的日常工作服已退化为牛仔裤、T\
  \ 恤和一件 Facebook 拉链抓绒衫，这套装备即使在 Facebook 的基层标准中也显得格外显眼。在工作方面，我继续着我那西西弗式的任务：通过某种方式回收用户数据来提高我们低廉的点击率。那时的\
  \ Facebook 广告非常丑陋，是像邮票一样大小的图文组合，位于用户屏幕的最右侧，大部分被用户无视。当时，在新闻动态（News Feed）中加入商业内容的想法仍然被视为亵渎，而且在礼貌的场合中是不被提及的。在\
  \ Facebook 广告投放中使用外部数据的想法同样是异端邪说，甚至根本不被考虑。\n\n### IPO 之前的混沌时期\n\n在这一混沌时期，在 IPO 期间强制执行的营收和产品纪律之前，Facebook\
  \ 广告产品团队继续按照 Gokul 领导下随心所欲的节奏运行。产品经理（PM）经常在另一个产品经理离开、被解雇或转调到其他项目后，被随机分配产品，无论他们是否有能力领导该团队，或者该产品是否应该存在。通过这种“产品轮盘”，我接手了广告审核与质量（Ads\
  \ Review and Quality）团队，此外还有广告投放（Ads Targeting）团队。\n\n就像美国国土安全部一样，广告审核与质量团队有一个巨大的头衔，其中隐藏着相当大的权力，但也充满了许多日常的滑稽式无能。就像那些捍卫我们边界的高尚灵魂一样，广告审核（简称为\
  \ Ads Review）是 Facebook 广告团队的守护者，负责识别色情广告、点击欺诈、支付欺诈以及各种将资金转化为蓝色横幅像素的猫腻。\n\n### 团队运营与挑战\n\
  \n该团队由两名过度劳的工程师组成，他们编写所有的代码，从欺诈专家用于巡查广告的前端用户界面，到将广告推送到潜在消费者屏幕上的复杂机器学习算法。它还涉及位于德克萨斯州奥斯汀和印度班加罗尔的风险与欺诈团队。这些运营“专家”负责对预处理和预过滤的照片进行实际扫描，接受培训以识别违反\
  \ Facebook 广告政策的行为。有些违规行为是轻微的；例如在图像中包含文字，广告商会这样做来塞入更多引人注目的广告文案。有些违规行为在布朗式的意义上更具普遍性。我们记忆难忘的一次漏检违规行为是一家以色列的美容院，他们发布了一张女性修剪非常整齐的阴部照片。它看起来是光滑且几乎是抽象的，以至于审核员没有看出那是什么。\n\
  \n### 众包审核机制\n\n在这种情况下，审核功能实际上是由用户自己进行众包的。各处愤怒的“道德卫士”们会点击广告右上角的 `X`，然后愤地留下反馈。软件会计算负面反馈的率，并对引用的最极端理由给予最高权重。\n\
  \n\n\n此时屏幕上，丹启动了一个工具的演示，那个工具本质上就是那样：加载 Web 应用时，会显示大量用户照片，`User Ops` 的“分析师”可以轻松点击并将它们消除，就像在花园里拔草一样。那些图像将永远被放逐，包括那些由老练的垃圾邮件者和可疑广告类型制作的细微颜色变化或裁剪版本。他在演示时边走过房间，点击了一张小猫的照片——显然，小猫代表了他们通常过滤的色情图片——那只小猫消失了，那只小猫图像的所有变体也消失了。点击、封禁、刷新，点击、封禁、刷新。女士们先生，这是一台运行良好的“猫猫机器”。\n\
  \n突然，谢尔尔打断道：“那么，这些小猫是怎么回事？”\n\n丹有些吃惊，他抬头盯着谢尔尔，显然很困惑。\n\n“为什么所有的坏照片都是猫？”\n\n丹平直地回答道：“我们在演示中使用猫来代替坏照片，因为真实的坏照片是……你懂的……有点……色情。”\n\
  \n“没错，”谢尔尔说，“但为什么是猫而不是别的什么？”\n\n房间里陷入了死一般的寂，三十多双从勉强掩饰的手机和笔记本电脑中露出的不安的眼睛盯着丹和他的猫猫机器。你几乎能听到所有人在心里齐声质问：*没错，这些小猫到底有什么问题？*\n\
  \n丹抬头看着屏幕，仿佛是第一次注意到那些小猫照片，然后转向谢尔尔，几乎是低声回答道：\n\n“额……为了演示之目的，我们不展示真正糟糕的照片……所以工程师们用猫代替。因为，你懂的……猫和猫咪就像，p——”\n\
  \n他直接停在了那里，但他几乎在位“精益运营女王”谢尔尔·桑德伯面前说出了“pussy（阴部/小猫）”。\n\n“明白了！”她吐口道。在深吸了一口气之后（仿佛准备进行连珠炮式的），她继续道：“如果那个团队里有女性，她们绝不会、绝对不会选择那些照片作为演示图的。我觉得你应该立即换掉它们！”\n\
  \n这波攻势还没结束，丹就低下了头，正对着一个小笔记本疯狂地记录着。人们可以想象笔记本上写着：`现在就换掉那些猫的照片！` 看起来看起来像个被责备的四十岁孩子。\n\
  \n我内心快要崩溃。在这种以前所未有的管理层愤怒和产品经理愚蠢面前，你可以感觉到房间里每个人身上散发出的尴尬或压抑的笑意。向谢尔尔演示“猫猫过滤器”。*史诗级的！*\n\
  \n丹拖着步子完成了剩下的演示，然后轮到我了。在那个无能的巅峰之后，很难再把事情搞砸了。我顺滑地翻过幻灯片，停留在最关键的画面上：一张关于审核广告数量与人工工时的对比图表。前者呈右上角趋势（更多广告！），后者是平直的（更少昂贵的人力成本！）。广告审核的世界一切正常。我在其他演示中昏昏欲睡，并在第一个机会就溜之大开了。\n\
  \n### 安全的角色\n\n广告审核（Ads Review）只是 Facebook 安全团队之一，他们肩负着一项艰巨的任务：保护全球四分之一的互联网——这正是\
  \ Facebook 所代表的——免受骗子、江湖骗子、色情贩子、性捕猎者、暴力犯以及各种人类人渣的侵害。这是一场高尚的斗争（尽管我本人对参与缺乏热情），其战斗者大多在阴影中工作。正如所有的警察或间谍机构一样，Facebook\
  \ 安全团队的失败被广为传扬，但成功却很少被宣扬。你会为你朋友的哺乳照片被标记而抱怨连连，却没注意到你的新闻动态流里完全没有色情内容。这是一份不讨好闲的工作，吸引了那些具有某种牧羊犬心态的人，或者仅仅是那些像《犯罪心理探》里的人一样，本身就是流氓和黑客，但却更愿意将自己的技能用于善意的人。\n\
  \n我们的社交阴影战士确实有一个展示：Facebook 内部有一个小组，名字极具挑衅性叫 `Scalps@Facebook`。它本质上是一个在线奖品柜，里面摆满了被制品的罪犯、性捕猎者、跟踪狂和家暴者，这些都是\
  \ FB 安全团队配合执法部门成功抓获的。奇怪的地方在于，这些帖子展示了涉嫌犯罪犯的个人资料，并附有某种自豪的描述，说明“罪犯”是如何被追踪到的，以及哪些当地执法机构参与了协作。因此，Facebook\
  \ 员工会在动态流中随机看到堕落欲望的罪恶面孔：菲律宾或阿肯肯斯州的某个男人，以及他试图诱导十四岁女孩见面的犯罪前科，还有一两行字表明他已被迅速送进了法律系统的深渊。\n\
  \n### 认知与现实\n\n那么，为什么 Facebook 不承担更多这种保护的角色呢？\n\n我不知道官方答案，但我可以推测。如果 Facebook 公开其在阻止犯罪方面的真实努力，人们可能会将这个蓝框窗口与某些捕食性变态联系在一起。目前，许多人与\
  \ Facebook 的关系是模糊的。\n\n想象一下头条：“Facebook 本月抓获了 36 名性捕猎者。”威斯康星州一位戴着眼镜的四十多岁的母亲，盘着头发，紧握着珍珠，向丈夫宣布道：“亲爱的，我认定我们应该让梅根别玩那个\
  \ Facebook 了，你看，那里到处都是变态分子。”\n\n这固然是一个荒谬的观点。当罪犯利用电话系统作案时，没人会认为 AT&T 应该被关闭；当恐怖分子通过邮件寄炸弹时，没人会认为美国邮政局应该受到监管。但普通的\
  \ Facebook 用户认为这项服务是某种轻率的玩具，而不是与自来水同等的社会公共事业，因此认为如果它似乎带有任何犯罪的迹象，我们就可以将其关闭。\n\n就像中情局并不恰好推销他们在某个荒凉之地气化一辆汽车并防止下一次恐怖悲剧发生的无人机袭击一样，Facebook\
  \ 对它为用户所做的一切保护他们免受人性中最恶劣的行为保持沉默。如果你必须对某个被错误标记的帖子抱怨，也请为 Facebook 安全团队想想，那些在守望塔上的专注极客们。他们关押的坏蛋可能（甚至更多）比你当地的执法机构，而且他们在没有得到用户感谢的情况下保持着警惕。也许至少有一次，请为你自己的\
  \ Facebook 体验感到惊，惊讶它几乎完全没有色情、垃圾邮件、仇恨言论和各种人类垃圾，并思考必须存在什么样的卓越系统和专业知识，才能让数百人 24 小时全天候地保护\
  \ 15 亿用户（全人类的五分之一）的在线体验。\n\n# 隐私的自恋\n\n当他（纳西瑟斯）饮水时，他看到了池中的倒影——并爱了；爱着一个没有实体的想象身体，因为他认为镜中的影子是有生命的、值得去爱的。\n\
  \n但为什么，噢愚蠢男孩，要如此虚幻地捕捉这转瞬即逝的形式？移开目光，你就会失去你的爱，因为吸引你眼睛的只是你倒映出来的影像。它来并等待；它没有生命；只要你离开，它也会离开。\n\
  \n——奥维德，《变形记》\n\n2011 年 12 月\n\n如果这段时期 Facebook 的生活在随机的偏离中显得混乱，那是因为它确实是随机且不可预测的。\n\
  \n作为 Facebook 产品经理的生活，与其说是担任某个稳固工业巨头的副将，倒不如说是被持续不断的内外力量所冲击着。\n\n\n\n\n内在动力在于你在 Gokul-land\
  \ 内部临时人员与产品层级中地位的波动，也取决于你所管理并推向成功（或至少是迅速失败）的产品的命运。\n\n特别是在我负责的领域，我们经常盲目地穿梭在潜在法律问题的雷区中，并被鼓励这样做，将其视为创新的风险成本。在我在\
  \ `Facebook` 的整个职业生涯中，我一直与 `Facebook` 的隐私和法律团队陷入一场持续的争论，争论我们哪些可以做、哪些不能做，不断消除他们的法律顾虑，并试图找到某种法律准则，来宽恕（或至少能合理地辩护）我们对用户数据的下一次侵占。\n\
  \n然而，在一天，在我们几乎没有怎么催促的情况下，这一切演变成了那种生死攸关的对峙之一，`Facebook` 在通往统治互联网的忙碌过程中经历过许多这样的时刻。\n\
  \n### 记单位\n\n华尔街交易员生活的奇特之处在于货币价值的快速重新校准。一切——无论是利润还是风险——都以百万美元为单位衡量，通常被称为一个“块”（buck）：“我们在希腊交易中亏了十块”；“约翰尼·傻蛋今年的奖金是两块。”一个相当于美国家庭中位数收入二十倍的金额变成了基本的记账单位，超过这个数字（如果你足够严谨的话），你可以使用小数。\n\
  \n`Facebook` 拥有类似的“富得性忧”，但体现在用户而非美元。我从未听过使用任何像“块”这样的组合术语，但数百万用户的数量在产品和测试组之间流转，就像一美元或两美元扑克牌桌上的筹码一样。对于任何消费级初创公司来说都是重要的用户里程碑，在\
  \ `Facebook` 内部却成了最细微的记账单位。\n\n### 新西兰测试床\n\n作为一个地理上的分支：`New 西兰`经常被用作新面向用户产品的测试床。它是完美的选择，因为那里使用英语，在社交图谱方面相对孤立（即大多数朋友链接都是国内的），而且坦率地说，它缺乏新闻性，因此任何关于新\
  \ `Facebook` 功能的传闻或报道泄露回美国和欧洲等真实目标市场的风险都很低。*Aotearoa* 是新西兰的原始毛利语词汇，大致翻译为“Facebook\
  \ 测试集”。因此，这个拥有壮丽峡湾和清澈高山湖的绿色岛屿国家，品尝着来自梅洛帕克一个二十三岁 `Facebook` 工程师空想出来的任何随机产品。\n\n###\
  \ 变现与指标\n\n当然，在广告领域，情况大不相同。正如我们之前讨论过的，从变化的角度来看，并非所有用户都是平等的。`Facebook` 的绝大部分收入来自美国和欧洲；其他国家仅占一小部分。不成熟的广告市场、电子商务基础设施尚处于胚胎阶段，以及较低的整体财富水平，意味着新的优化技巧或定位数据对这些国家的影响微乎其微。因此，`Ads`\
  \ 团队会从富裕的广告市场中划分出一批 `FB` 用户群，并给他们投放不同版本的广告系统，以衡量新功能的效果，就像在临床药物试验中测试受试者一样。\n\n感兴趣的性能指标包括点击率，这是对用户兴趣的粗略衡量。更有说服力的是用户点击并购买后产生的实际下游变现——假设\
  \ `Facebook` 获得了转化数据，但实际上它经常没有，因为 `Facebook` 并没有转化跟踪系统。\n\n同样重要且与金钱完全无关的是整体使用率。由于你不想用过度或分心的广告让用户精疲力竭，变现和使用之间往往存在一种难以平衡的零和博弈。\n\
  \n在经过了足够的时间后，所有这些指标——点击率、变现、使用率等等——都会在测试组和正常组之间进行比较。测试组使用的切片越大，你等待的时间就越短，因为“数据速度”更快。然后，产品改进就会被宣布为成功或失败。\n\
  \n### 监管冲突\n\n测试组使用的切片越大，你等待的时间就越短，因为“数据速度”更快。然后，产品改进就会被宣布为成功或失败。\n\n在 `Ads` 团队的这一系列胡搞乱闹中，我陷入了我的第一场严肃的隐私纠纷。`爱尔兰`是\
  \ `Facebook` 数据和隐私政策的官方欧盟监管机构。作为广告投放领域糟糕产品经理的一员，我有一项不受欢迎的任务：要参加每一个与一个叫 `Gary` 的男人的电话会议，他显然是那里单人数据保护办公室。\n\
  \n这个充满窒息感的天主教氛围和马铃薯饥荒的国家，是如何成为自 DNA 以来最大的个人数据聚集地的监管机构的，这是一个奇特的故事。`爱尔兰`在 21 世纪 00\
  \ 年代中期作为“凯尔特老虎”崛起以及随后的房地产崩溃后，积极鼓励美国公司选择`都柏林`作为它们的欧洲基地。`爱尔兰`提供了税收优惠（企业税率非常低）、受过教育（且渴望工作）的人才储备，以及理性的法律框架。结果是，都柏林东部的水码头被\
  \ `Facebook`、`Google` 和 `Airbnb` 等美国科技公司殖民，每家公司都在闪闪的新的高大楼办公室里运行（大部分）它们的销售和运营团队。\n\
  \n\n\n所以，爱尔兰人——这 450 万甚至填不满一个 Facebook 测试集的人——在数据库层面上卡住了我们，我们需要安抚他们。在一个不寻常的决定中，爱尔兰和\
  \ Facebook 决定公布审计结果，因此你可以自由阅读官方报告的结论。其核心在于，Facebook 曾尝试过的某些类型的定向投放（尽管尚未完全部署）必须在约定的审计期结束时（即\
  \ 12 月底）之前停止。我们有几周时间来处理好这一切，并确保我们站在爱尔兰人这一边。\n\n鉴于代码的深不可测和数据的蔓延，我问了广告业务的“祖父级”人物之一荣岩（Rong\
  \ Yan），他在 Facebook 工作了整整两年，问我们是否正在进行任何我们已同意停止的定向投放。荣岩在广告系统的运作方面拥有绝对的权威性，他斩截了地否认了我们正在积极这样做，他说我们顶多只是在过去做过实验。对此我很满意，并向爱尔兰人和那里的高级广告团队保证，无需担心协议中的这一点。\n\
  \n### 给有志成为产品经理的人士的启示\n\n这里有一个给你们这些有志成为产品经理的重大教训：你具备技术背景的主要原因不是为了帮助从技术上设计开发中的系统；如果你在做那个，那么你的\
  \ PM 做法就错了。不，你具备技术背景是因为你能看出来工程师什么时候在对你扯扯，而这种情况经常发生。有时是无意的（就像荣岩那样），是由于沟通不畅、记忆力不好或主观愿望（工程师和任何人一样容易产生这种）。有时更具隐蔽性，是他们用消极攻击的方式来不同意产品方向（“那会耗尽我们所有的服务器”），或者是懒惰（“建立那个是不可能的”）。产品经理存在的意义就是对任何此类可能杀死产品的断言进行“嗅觉测试”。\n\
  \n爱尔兰数据协议的最后一天黎临了，此时 Facebook 已同意实施所有必要的更改，我对自己终于尽了自己的份，平定了我们经历的那场 Facebook 公司“肠造术手术”感到相当满意。一点微偏执的瘙痒，几乎像一种超感官的刺痛性怀疑，让我思考，尽管发生了大量的工程对话，我们是否真的涵盖了所有基础工作。毕竟，我冒着风险向爱尔兰数据机构和\
  \ Facebook 管理层保证，定向团队完全符合我们的约束框架，而他们接受了我的保证。\n\n随着那种刺痛加剧，我打开了一个终端窗口，基础的命令行界面（想象一下你在多部电脑黑客电影中看到的场景），这仍然访问许多\
  \ Facebook 远程服务器的方式。\n\n我对后端广告系统的运作方式足够了解，可以登录并查看各种机器。定向表定义了 Facebook 广告系统使用的定向细分，并构成了连接流量与钱袋的逻辑胶水。如果底层定向逻辑的数据库表不一致（例如，不该缺失的表行缺失），广告投放将停止运行，广告将不再出现在每个\
  \ Facebook 页面。\n\n注意：这种定向的存在并不是问题——Facebook 对爱尔兰人完全透明的——仅仅是它在约定的截止日期时间之后依然存在。这让我想起了香港动作片里的英雄，我脑补出他用精准的旋风踢扫了一满屋子的混混，救了女孩和装有秘密文件的公文包，然后开着法拉利冲向\
  \ Facebook，坐在电脑前让广告系统运行起来。\n\n“嘿，红……你介意帮我盯着屏幕看一眼，确保我没做什么蠢事吗？这挺重要的。”\n\n这是一个简单的执行命令。本该是例行公，如果不是因为它运行在实时生产数据库上，并且构成了\
  \ 20 亿美元支出的核心。而且我已经好几年没写过 SQL 写入命令了。如果搞砸了，那将是一个 SEV1，即一级严重漏洞，意味着无论值班的是是谁，都会从他们所处的任何床、马桶、度假海滩或醉迷中被惊醒，并被要求手忙脚乱拯救\
  \ FB 的巨船。\n\n你是一个产品经理：所有的责任，完全没有权力。修复它。\n\n我输入了 `UPDATE TABLE SET . . .` 等命令，摧毁了每一个可能的违禁定向投放。\n\
  \n“看起来好吗，红？”\n\n红透过他的设计师眼镜审视着我的命令行。\n\n“不错！看起来不错……”\n\n深吸一口气。向 `ALTER` 的圣母玛利亚、MySQL\
  \ 命令的圣母娘祈祷吧。\n\n```\n<enter>\n```\n\n广告区域的灯光闪烁了一下。\n\n实际上，并没有闪烁。但我的心漏跳了一拍。几分钟过去了。快速看一眼实时仪表板，显示一切正常。我们并没有刚刚短路\
  \ Facebook 的赚钱机器。\n\n“太棒了！”红说，然后回了自己的办公桌。\n\n去我去，去爱尔兰人，去那个爱尔兰数据保护专员。我关上笔记本电脑，让红留守阵地。该去\
  \ Rose & Crown 喝杯啤酒了。\n\n“Facebook 给我看 X 的广告，我在乎这个吗？看他们的定向有多糟糕。”\n\n或者：“Facebook\
  \ 刚刚给我看了指甲油广告，我昨天刚做了指甲并给朋友发了短信。他们是在读我的短信吗，还是在看卫星照片并追踪我？”\n\n\n\n\nFacebook 实际上是他们最不需要担心的问题，而且它是这场竞争中唯一真正关乎用户的参与。意乎意料的是，那些对无关广告抱怨最多的人，也是那些在广告太精准、甚至让人感到\
  \ `creepy`（毛骨悚然）时会抱怨的牢骚者。无疑，他们中技术略微精通的人也运行着广告拦截软件，并反对增加数据收集——而这种收集本改进广告并使其更具相关性。如果他们自己发布内容，或者从事为全球\
  \ 24/7 全天候提供全人类数字化社交生活的业务，他们就会意识到那个蓝色框浏览器标签页背后是有人为成本的，而且这绝对不是免费的。拦截广告等同于偷窃，或者至少是在在不付过路费的情况下运行收费站。\n\
  \n噢，省省你那套愿意为 Facebook 付而不是看广告的说法吧。目前 Facebook 应该向你收多少钱都还不清楚。广告拍卖和针对你注意力的动态市场的整个意义就在于弄清楚这个问题。设定使用费就像\
  \ `IBM` 宣布它将为每个想要买股票的投资者指定一个价格，而不是将价格发现交给股票交易所的开放市场。广告是除了极少数出版商外唯一行之有效的商业模式，而那些出版商仅限于精英内容生产阶层的《经济学人》和《华尔街日报》，他们才成功地向用户收费。如果你想通过互联网与世界互动，那就去面对广告。\n\
  \n隐私对 Facebook 来说，就像核武器之于伊朗：这是一个持续挥之不去的阴云，外人即使并不了解却对其深痴迷，而且是几乎任何与外部玩家对话的起点。由于 Facebook\
  \ 利用你的数据进行牟利这似乎是每个爱管闲事的非营利活动分子和政府官员关注的问题，这意味着我四分之一的时间花在了思考法律问题，并与 Facebook 的隐私团队制定策略。如果一个产品改变了\
  \ Facebook 使用数据的方式（而且作为一个产品经理，如果你不推推数据使用的边界，你就没有尽到职责），那么你可能会受到 Facebook 数据政策的限制。数据政策的变更是一场达到奥斯卡奖级别的策划制作，绝不能小视。十亿用户从未读过他们所同意的用户协议，这一事实并不重要。这个世界的律师们确实读过，而那才是该文档真正的目标受众。\n\
  \n但这似乎并不重要。现实是：对于这些新奇的数据隐私之类，几乎没有任何法律先例，这种法律空白被自谋其利的“标准组织”所填补，这些组织名义上实施了理性秩序，但实际上只为某些议程服务。因此，正如产品本身一样，Facebook\
  \ 以及拥有定义条款优势的主要广告参与者（例如 `Google`、`Apple`）都在边走边造。\n\n觉得这很疯狂？听听这个。\n\n多亏于 2009 年的一场隐私风波，`Zuck`\
  \ 承诺对数据政策的任何更改都将由用户投票——`投票！`。所以，当我们放弃从 Facebook 专有数据中榨钱，并激进地扩大广告团队对数据的使用时，举行一次公投是有很有的。是的，真的。数字民主，Facebook\
  \ 领地的公民们！\n\n于是，在 2011 年底，Facebook 举行了一场选举。待投票的措施中包括 `. . .` 永远废除选举。民主可以选择自杀。询问人们关于数据政策的变化就像询问关于\
  \ `IRS`（美国税务局）税法的变化：所涉及的政策是一个巨大的、毛茸茸的怪兽，没人真正理解它，而且默认情况下人们倾向于维持现状，而不是考虑某些不确定的未来变化。对\
  \ Facebook 来说幸运的是，民主原始条款之一规定，必须有 30% 的用户参与结果才具有约束力。到 2011 年，Facebook 的用户量已超过十亿，这意味着大约\
  \ 3 亿人——几乎是最近一次美国大选选民人数的三倍——需要参与。机会很渺茫，但谁知道呢？如果某个猫视频可以疯传，或者那些关于拥有你数据的、每年像流感一样席卷\
  \ Facebook 的毫无意义的声明，那么也许投票也可以。\n\n我们不必担心。新政策的采纳结果以压倒性多数失败了：90% 的投票者 `反对` Facebook\
  \ 生存所需的新数据政策。但是 `. . .` 几乎没有人投票。甚至没有达到用户的 30%。因此，投票结果被“予以考量”——我们的意思是“被忽略”。并感谢我们这么做了吧；否则\
  \ Facebook 现在就会陷入麻烦，因为后来推出的那些拯救公司的产品在旧数据政策下是不可能实现的。\n\n尽管有所有这些戏剧，尽管每一个法律细节都是正确的，但仍要处理围绕隐私的公关压力，而且通常是最愚蠢的那种。让我给你们举个例子，摘自\
  \ FB 早期的记忆：\n\n我经常收到忙于脚乱的 Facebook 公关团队关于定位功能的催促，因为在《洛杉矶时报》或其他人向 `他们` 询问我们的定位能力之后。产品经理总是是推卸责任链条上的最后一环，所以去处理它吧，`PM`。\n\
  \n故事通常是这样的：记者（或她的某个“消息来源”）在她丈夫表弟的大学室友发了一张自己穿 49 队球衣的照片后，看到了旧金山 49 队的广告。`难道我们在广告定位中使用了上传的照片吗！！？？`\n\
  \n这感觉就像被指控生了斯嘉莱特·约翰逊的孩子。我真希望我甚至没被怀疑做过那种事。\n\n想一下。从某些手机照片中挑选出橄榄球衣并确定相关的兴趣主题（例如 49\
  \ 队），根据你分享的大量垃圾信息将其分配给家庭/社交树中的正确成员，这将是一项堪比登月计划的图像识别和机器学习成就。Facebook 广告定位如此简单，以至于这种想法是荒谬的，但无论如何否认都无法阻止那些记者带着他们的“啊！”案例继续纠缠。\n\
  \n真正的答案当然是，49 队在那个周末有比赛，这解释了表弟穿球衣的情况，以及 49 队代理公司正在开展广泛定位的营销活动。\n\n\n\nFacebook 并不出售你的数据；它在购买数据。它通过向广告商提供服务来实现，激励他们让\
  \ Facebook 收集你在 Facebook 之外产生的数据。事实上，正如我们很快看到的，Facebook 是人类历史上已知的最嫉妒用户数据的守护者之一。它是一个永远无法离开的数据黑洞。\n\
  \nFacebook 的所有技术都是这样设计的，而且永远不会改变。如果你停下来片刻，意识到 Facebook 为了任何钱、以任何金额将它的用户数据交给任何人将多么多么自杀式的愚蠢，你就会意识到“Facebook\
  \ 出售你的数据”这个梗是有多么陈词滥调。\n\n## 我们是野蛮人还是怎么？(#nav.xhtml_rch32)\n\n把自己化为兽的人，便可以摆脱做人的痛苦。\n\
  \n—萨缪尔·约翰逊\n\n### 2011 年 12 月 15 日\n\n像寄居蟹一样，成功的公司会长出一系列变得越来越大的壳。\n\n到 2011 年底，`1601\
  \ California Avenue` 的地点已经显得非常拥挤了。人们在 `Ads` 区域挤得水水不融，整栋楼看起来有些破旧。对于任何一家忙碌的科技公司来说，这都很典型——他们太关注那些重要的指标，根本没空理会角落里看起来像双重杀人留下的地毯污渍（实际上那是由于匆忙清理过的欢乐酒时间呕吐物）。会议室里弥漫着太多人在里面睡觉（或别的）留下的汗味，咖啡馆也像施汤厨房一样拥挤。\n\
  \nFacebook 的“命名阶层”（nomenklatura）决定我们应该搬家，而 Facebook 的新耶路撒冷将是那个过时的科技巨人“太阳系统”（Sun\
  \ Microsystems）的遗弃遗址。鉴于那个校园的惨状，公司必须分阶段搬入，工程团队最后到达。\n\n当终于轮到我们时，当然，没有人真的为搬家做好准备，尽管我们在几周前就收到了管理这次朝圣之旅的设施团队发来的邮件。到了最后的关头头，下午四点半左右（我们需要在五点前离开大楼），现场陷入了彻底混乱。\n\
  \n人们开始把堆积的垃圾塞进纸箱。首先是他们桌子上的所有破烂。如果你住在 Facebook，你会留着很多书、偶尔一张的女友照片、来源不明的毛绒玩具、从销售会议上积累的马克杯或鼠标垫等公司周边品，也许还有你在公司外进行团建活动中做的随机杂物。接着是团队玩具，如滑板和陆军枪。然后是区域装饰，这些东西似乎在任何\
  \ Facebook 产品团队周围像苔藓一样长出来：来自`模拟研究实验室`（Analog Research Laboratory）的海报，像供你工程经理的胶板祭坛之类的幽默道具（是的，真的），或是当地地下酒酒吧的酒柜。\n\
  \n突然间，变成了各种东西，而且不仅仅是放进搬家箱里。人们从墙上撬下公司艺术品，扯下会议室的名字牌，把所有这些塞进笔记本电脑包、垃圾袋，以及他们计划带回家的任何其他东西。\n\
  \n情况变得如此失控，以至于一次，`Ads` 部门唯一的管理员 `Aileen Cureton`（当时整个团队只有一个管理员，而不是每个执行官都有一个）站了起来，用她模仿最像海军陆战队训练教官的嗓门，开始对着那些横冲撞撞的破坏者吼，让他们放下正在搬运的所有破烂。她的吼没有被理会；在十五分钟内，办公室就被搜刮一空。\n\
  \n由于经历过几次激进的示威和暴乱（多亏于 90 年代后期在巴斯克地区的学习经历），我不能完全说这正走向那种真正的烧车、橡胶弹飞行的合法群体暴力混乱，但对于美国企业文化在其\
  \ 21 世纪初的痴呆期，这已经足够接近那种程度了。\n\n然后一个主意跳了出来。\n\n有一组会议室靠近 `Zuck` 和高层，它们的名字据称灵感源于在那栋楼被占用期间，“倒向”了\
  \ Facebook 使用率的一系列国家，其中包括那个夭折的西班牙裔种族的“母国”（madre patria），即我所属的人民的原始家园。总统宫周围的区域不会最后才被革命性暴力攻陷吗？也许它还在那里……\n\
  \n我穿过掠夺的混乱现场，遇到了 `Mick Johnson`。这位是最初的 `YC` 同事，通过他的官方介绍和非官方建议开启了我的 Facebook 之缘。他当时正带着微笑，手里拿着\
  \ `AUSTRALIA`（澳大利亚）。冲向那组会议室，我发现一扇又一扇门上贴着匆忙撕下的胶带。几乎所有的牌子都不见了。\n\n但不是我想要的那一个。\n\n\
  拔出随身携带的索鱼刀，对着石膏板用力，将牌子撬了下来。像个小偷一样把它塞进裤子前面，藏在我的 Facebook 抓绒外套下面，在 `Aileen` 愤怒的雷达范围之外，我悄悄回了\
  \ `Ads` 区域。\n\n当大家都离开大楼，暴乱终于平息时，我回到船上，在右舷的一排圆窗上安装了 `SPAIN`（西班牙，附带纹理盲文）。它那亮黄色的公司化无调性和无衬线字体，衬托出红木和雪松温暖而深邃的棕色。最后，重要的是我们从一段经历中带走了什么——即使那是用一把破旧的索鱼刀从墙上撬下来的。\n\
  \n出于某种原因，Facebook 总是对办公室涂鸦艺术痴迷。早期，`Sean Parker` ——一位 Facebook 早期的军师，他曾是 `Zuck` 的顾问兼临时首席执行官，并在《社交网络》中由\
  \ `Justin Timberlake` 形象性地演绎——曾请著名的壁画画家 `David Choe` 在帕洛奥托最初的 Facebook 办公室绘制以性暗示为主题的壁画。\n\
  \n\n\n\n一个年长的男士，无疑是一个拥有漫长 LinkedIn 简历且在圣马特奥有一套抵押房屋的工程经理，他正牵着孩子的手，而上述孩子在条洁净如初的白色走廊上喷射出一条连续的红线，就像汉塞尔和格蕾特留下的面包屑路径一样。\n\
  \n一位野心勃勃的工程师在当时广告部与增长部之间、一条最繁忙的干道之间的公共广场上设了摊位。他手里拿着漫画书场景的打印件作为指南，开始勾勒一个超人从一团人物和形状中先一步冲出的拳头。像一个出色的壁画画家一样，他正忙于最初的线条素描，在他突然离开之前，他只来得及给部分区域涂上颜色。它看起来像米开朗基《最后的审判》中的耶稣，一个扭曲的形状将周围的宇宙甩飞四周。\n\
  \n有些团队进入了产品开发模式，围绕某个核心主题构思艺术愿景。产品经理负责处理胶带、记号笔和模板等后勤事宜，而工程师们则负责实际工作。这是 Facebook 产品开发的微缩版。其中一幅描绘了一个巨大的独角兽头部，位于一个像算法生成的复杂镶嵌图案之上。这些几乎是唯一勉强被称为“艺术”的尝试。\n\
  \n这种混乱持续了整整两天。\n\n那个周末，扎克伯格又发了一封全员邮件（也许是发在所有人所属的 Facebook 内部群组里），要旨是：我信任你们去创作艺术，而你们这群混蛋干的却是破坏这个地方。这无疑是事实。现在这里看起来像旧米申区（Mission）的一条小巷，而不是世界上最有前途的科技初创公司的办公室。更糟糕的是：旧米申区确实有一些史诗级的壁画；而\
  \ Facebook 的艺术只能和被炸毁的贫民窟内部的东西相比。\n\n根据他自己的报告，扎克花了两时间走遍了整个 FB 园区，标记了所有要拆除的东西。确实，到了周一，有一条厚厚的蓝色美纹胶带标记着每一个构思拙劣的尝试，或者每一个充满欢乐的破坏行为。扎克可能用光了十卷那种东西。\n\
  \n立刻，Facebook 的老员工之一、企业文化的守护者罗迪·林赛在代码审查系统内部创建了一个注释宏。代码审查工具是 Facebook 工程师观察世界并完成\
  \ 90% 工作的方式，他们提交代码供工程团队考虑，在那里代码会引发激烈辩论，几乎就像在在线论坛上一样。这些宏是极客表情符号，是一些幽默或具有启发性的图像或 GIF，通常让人联想起廉价的网络迷因。有成百个这样的宏，它们就像工程评论的字谜游戏，要么鼓励某人大胆发布新功能，要么贬义地侮辱某些代码编写者的能力。在当时，输入\
  \ `bluetape` 会产生一张墙上的蓝色美纹胶带图像，表示为了美观和/或理智应该删除某段代码。\n\n这就是 Facebook 文化：大量大胆的、不寻常的实验，大多数是失败的，但也有显著的成功；立即进行路线调整以剪掉失败部分，然后通过文化内化这些经验。那些糟糕的壁画和\
  \ `bluetape` 对于 Facebook 就像 `Like` 按钮（以及 `Beacon`）一样核心。\n\n## 死亡\n\n“这是一个辉煌的时刻，但我有一种恐惧的预感，总有一天，同样的命运将降临在我的国家身上。”\
  \ 很难找到比这更具政治风范、更深刻的话语了。因为在我们最大的胜利和对敌人最大的灾难时刻，能够反思自身的处境和可能可能的反转，并且在成功的季节记住命运的无常，这就像一个伟大而完美的人，简而言之，是一个值得被记住的人。\n\
  \n—波波尼，《通史》\n\n#### 2012 年 1 月\n\n如前，我们那新崭新、刚被破坏的校园曾被一个过时的科技巨头——太阳微系统公司（Sun Microsystems）占据。这现在是老历史了，但太阳公司曾制造过驱动互联网的*服务器*。无论是位于全球数据机房内提供\
  \ Web 服务的快速（且昂贵）机器，还是放在科学家或工程师等高端用户办公桌上的强大机器（每台机器都配有全套开发工具以产生更多的互联网技术），太阳公司曾是 21\
  \ 世纪初科技热潮的代名词。然而，它自满自足了，当运行在通用硬件上的 `Linux` 成为大多数明智科技公司（包括 `Google`）的首选基础设施时，太阳公司没有采取任何行动来阻止导致其灭绝的浪潮。\n\
  \n当我们搬进梅洛帕克时，许多会议室门和公共空间上都有 `Sun` 的标志。扎克伯格没有把它们全部移除，而是保留几个。它们就像企业的“死亡终念”（memento\
  \ mori），提醒员工 Facebook 也会走向灭绝，并有一天被缩减为 Logo 和周边商品。\n\n最大的这类化石可以在带有巨大 `Like` 按钮的 Facebook\
  \ 标牌后面找到，那个按钮上有一个无处不在的蓝色大拇指，聚集了一群几乎 24 小时不停的自拍游客。在 Facebook 唯一面向公众的标牌背面，有一个比球桌大的标志，那是曾经代表精良、新数字未来的标志。它像某些历史文物一样破旧、剥落。当\
  \ Facebook 进驻时，管理层并没有更换原始标牌，而是简单地将其翻了过来，并故意忽略了涂漆或覆盖背面。上面写着 `SUN MICROSYSTEMS`，以及那个由\
  \ `S` 字形组成的方形形标志，那个标志曾出现在你加载的每一个 Web 页面顶部。\n\n*这一切终将过去。* 太阳公司遭受的遭遇也可能在我们身上发生，所以扎克伯格含蓄的意思是：“快速行动，打破常规！”（MOVE\
  \ FAST AND BREAK THINGS!）。\n\n也许连强大的 Facebook `Like` 按钮，有一天也会像谢莱诗中奥西曼迪斯雕像碎片上的铭文一样被看待——那是人类野心短暂性的沉思：一个狂妄的挣扎，被遗忘和抛弃。\n\
  \n每天早上，我从停在红德城的帆船骑自行车六英里到达园区，园区坐落在伸入旧金湾南部潮汐湿地的人造海堤上。这听起来可能并不如画：它是两英里沿着红德城港混凝土采石场的尘土骑行，两英里穿过一个被忽视的水滨社区的卡车干扰，然后（最后）是两英里受保护的湿地（如果藻类爆发，闻起来就像营厕所）。\n\
  \n\n\n\n这些大巴是湾区（以及，我敢说，是整个经济）正在发生状况的隐喻，对于那些反技术抗议者来说，这种象征意义显而易见，考虑到他们偶尔会砸碎大巴的车窗。一群人获得了一套商品和服务，而那些腰间别着科技公司工牌的人则获得了完全不同的另一套。\n\
  \n想象一下这一场景吧，硅谷的旅行者：任务区的 24 街和瓦伦西亚街（现在是文青青年聚集地，但在历史上是一个贫困的墨西哥人社区）。白色的包车大巴刻意没有贴标志，它们与摇摇晃晃、破旧不堪的\
  \ `SF Muni` 公交车争夺站台空间。一组车是为 alpha-plus-plus 级的旧金山居民准备的，配备了舒适的座椅和`Wi-Fi`。另一则是为平民准备的，唯一的空座旁至少坐着一个失禁的流浪汉，正神志不清地胡言乱语。不过要小心！考虑到至少有三家公司提供企业班车，你必须确保上对了车（由于缺乏标识，这说起来容易做起来难）。上错了车，你就会发现自己去了\
  \ `Google` 或 `Genentech`。当然，这种情况确实发生了，而且经常发生。当车被“渗透”时，有人会在 `Facebook Commute` 群组里发帖指示车上有\
  \ `Google` 间谍，要求大家保持安静并隐藏屏幕。那些间谍后来怎么了，我不太清楚。我不会惊讶于 `HR` 在车上留了招聘人员，就像国际航班上的 `FAA`\
  \ 空中警员一样，以便在门关上的瞬间就将他们招揽为新员工。\n\n在我住在旧金山期间（取决于当时和女朋友之间的矛盾进展如何），在等车时，我会通过猜猜聚在一起的人群属于哪家公司来消遣时间。久而久之，你建立了一个心理模型：`Googlers`\
  \ 看起来年纪更大、更书呆气（你可以通过寻找他们幼稚公司工牌上的那堆彩色球来作弊），而 `Facebookers` 则更年轻、更带点叛逆。一旦上车，你就会开始处理一天的邮件（工程师则是处理代码），在车身颠簸的同时，希望能够避开上午九点左右在南向方向汇聚的拥堵。\n\
  \n### 进入 `Facebooklandia`，在接下来的十二小时左右内你都不会离开这里，你会直奔咖啡馆，享用在校园内三顿免费餐中的第一顿。如果你是一个产品经理，很可能在第一场会议前的十五分钟里一边检查邮件一边赶忙吃饭；你的第一场会议是六到十二场中的第一场，此外还有两到三场突发会议。你的\
  \ `Microsoft Calendar` 通过公司配 `iPhone` 的语音提醒主宰你的生活，以及你同事的日历，像第一次世界大战期间的一百码无人地一样被争夺。你一在日历上空出一个会议时段，有人很可能就会给你发一个邀请来填满它（有一个内部工具可以帮助解决这种持续的日历拼图游戏）。\n\
  \n笑话在于，在 `Facebook` 工作的最大优势是不需要解释为什么你整天呆在 `Facebook` 上。除了对产品进行各种测试，`Facebook` 的大部分协作工作都是通过\
  \ `Facebook` 本身完成的。每个产品团队都有一个内部 `Facebook` 小组，可能有几个，对应产品中每一类“股东”子集（例如销售、市场和工程）。\n\
  \n*拉稀了！*\n\n这是那种定义文化的 `Facebook` 内部笑话之一。如果你蠢到在那群粗鲁无礼之辈中让你的笔记本电脑处于未锁定状态或无人看管，那么任何人都有完全权利打开你的浏览器（浏览器里至少开了两三个\
  \ `Facebook` 标签页），并发布一条涉及日常胃肠任务的状态更新（出于某种原因，“果冻/Jell-O”是稍微体面一点的替代方案）。\n\n从办公桌抬头，看到又一个和\
  \ `Zuck` 那里完全一模一样的通用白色平面，迎接你的是？产品团队聚集在他们的产品和工程经理周围；`Ads` 层似乎在不断地扩张到其他楼层和走廊，是这些团队构成的补丁布。你像堆里的蚂蚁一样，熟悉通往和你合作的三个四个部门的路线。高级管理层坐在一组办公桌前，靠近那一刻任何在\
  \ `Ads` 权贵阶中的人员（人员变动非常频繁）。这是你作为产品经理的原生栖息地。\n\n### 初创企业的成熟\n\n人们说，当我们第一次认真意识到自己会死时，童年就结束了。对于一家初创公司来说，也有类似的成熟时刻，通常就在扩张性成功的边缘，创始人们意识到他们的创造已经离开了组织上的幼年期。\n\
  \n为什么 `Facebook` 和 `Twitter` 要收购像 `AdGrok`、`FriendFeed` 和 `Aardvark` 这样的小公司？我们已经讨论过，在硅谷这个过热的技术人才市场中，企业并购本质上是通其他手段进行的招聘。但还有另一个动机：通过将他们的企业\
  \ DNA 与初创创业者的勇气和胆识混合，他们重振了内部文化，并增加了通常在他们的招聘储备人才中找不到的特质（即聪明但顺从的工程专业毕业生）。这就像在澳大利亚刻意地将精良的欧洲纯种品种与野生的丁戈犬混合，育出了聪明且体态匀称的澳洲牧羊犬。\n\
  \n几乎无例外（尽管有例外），初创产品会消失在收购公司的巨口中，再也不见。但那些创始和早期员工，在资源极其匮乏的情况下擅长从无到有，他们将技术才华和产品胆识带入了一个已经忘记其开创根基的臃肿组织中。\n\
  \n理论上是这样。\n\n虽然许多此类收购对象最终在 `Facebook` 获得了成功的职业生涯，但那些成功的人要么被 `Zuck` 赋予了随心所欲的空间（例如\
  \ `Instagram` 团队），要么必须适应新环境并收敛一下初创的野性。至于两者都没做的人……我们先不往前看了。开始时这些对我来说并不清楚；相反，作为一名“成功的”初创创业者加入意味着你拥有大量的社交资本。每个人都对我像一个巡游的冠军。但在内心，我觉得自己像船难的幸存者：寒冷、湿透、双手颤抖，肩上盖着毯毯，不知道到底发生了什么鬼。我是如何从一个正在发生的狂野无边的\
  \ `AdGrok` 难变成免费汉堡和使命宣言的企业天堂的，这是一个本体谜题。但初创企业的第一个规则也适用于 `Facebook` 这样快节奏、竞争激烈的职场：表现得你属于那里，即使你并不。\n\
  \n一天早晨，所有员工发现办公桌上有一本 4×6 英寸装的红书。标题是《Facebook 最初并不是为了成为公司》，这是 `Zuck` 最终会包含在 `Facebook`\
  \ 自己的文档中的响亮宣言。书中是对企业价值观的精美反思，大部分是典型的 Facebook 办公室场景的趣味并置（一个在沙发上睡着的的工程师）、`Facebook`\
  \ 历史上具有启发性的文物（早期 Facebook 员工聚集在简陋餐桌旁的照片）以及略显俗气的励志日历风格素材照片（震撼的广角夜空）。内容要么是更具传奇色彩的\
  \ Facebook 轶事（工程师们如何说服记者 Facebook 要推出一个可以传真照片的传真按钮），要么是字体精美的 `Facebook` 福音摘录（“灵者得地”、“我们不是为了赚钱而创造服务，赚钱是为了创造服务”）。\n\
  \n倒数第二页最好地捕捉了这种精神。在黑色背景上，用白色无衬线字体写着：\n\n\n\n\n\n如果我们不创造出那个终结 Facebook 的东西，别人也会这样做。\n\
  \n“拥抱变化”是不够的。它必须深深植根于我们的本性，以至于仅仅谈论它都显得是多的。互联网并不是一个友善的地方。那些无法跟上潮流的事物甚至连留下遗迹的奢侈都没有，它们会直接消失。\n\
  \n记住这一点，FB 的士兵们。\n\n在成千上万的小细节中，公司不断提醒着人们失败的代价。Facebook 对死亡的意识就像一个计划长生不的人。然而，死亡并没有引发恐惧；它只是提醒人们为了遏制腐朽所需的纪律。我以前和以后都从未见过哪家公司在确保原始价值观的延续上如此痴狂。它就像是每天都处于独立日的美国：\n\
  \n> 我们的工作永无结束\n> 让它变得更快\n> 如果你无畏，你会做什么？\n> 这段旅程仅完成了 1%\n\n就像那个天真的的新兵一样，我把这些价值观记在了心上。但也像那个新兵一样，我后来才意识到\
  \ Facebook 的现实要复杂得多。\n\n### 野蛮的哈欠\n\n填满时间——这就是幸福；填满时间，不留任何一丝悔恨或认可的空间。\n\n——拉尔夫·华尔德·爱默生，《经验》\n\
  \n#### 2012 年 1 月\n\n### 赛道\n\n赛车是一项令人振奋的追求。你开着那辆你平时任性在街道上飙驰的性能车，穿过布满坑洼的繁忙街道和坡度不佳的弯道，突然处在一个完美的路面上，在弧度完美的大弯道中穿行，可以尽情狂野。赛道的本质在于，你始终踩着油门或刹车，要么在弯道中冲出，要么为了过弯突然停下。不需要花精力寻找警察或那个开着\
  \ Accord 的慢速老老太太，意味着你完全专注于你的车辆、赛道以及侧向拉你的离心力。如果你进入了心流，那是人、机器与物理世界的一种超脱的融合，带你超越自我，进入一个点状的意识。你全身是紧绷的肌肉和抽动的神经，像一头被拴在机器里的野兽，没有过去，没有未来，只有那时速\
  \ 130 英里的瞬间。\n\n再加上赛道上另外二十四个和你一起疯狂加速的机械控变态们，你就获得了一张直达自己心理红线的十圈门票。当你终于离开赛道进入维修区时，过热的汽车会散发焦焦的车片和离合器味，潮湿的衣服被汗水粘在身上，你用颤抖的手摘掉驾驶手套。肾上腺素消退的感觉会袭来，让你想起第一次打架后的时刻，或者你第一次真正的交欢。\n\
  \n然后你开车回家。\n\n你的心理物理学已经重新校准，你默认会深踩油门，在一个看似很舒适的巡航速度下稳定下来……每 110 英里。在右侧车道飞驰了一段时间后，你被迫为了某个不负责任的混蛋突然刹车，他正以——噢，速度表在骗我吗？——时速\
  \ 80 英里，比限速快了十英里。然后你环顾四周，审视你新的驾驶环境。一切感觉极其缓慢；就像你在爬行。你不敢相信这是时速 80 英里。你感到愤愤。\n\n* *\
  \ 这种速度下怎么会有人出车祸？*\n* * 我基本上可以用胶带把方向盘固定住，上去睡一觉，也能回到家。*\n* * 这些傻瓜根本不会开车，应该吊销执照，而且限速至少应该是\
  \ 100 英里。*\n\n你意识到，在过去的几个小时里，你和大多数人生活在不同的世界，而现在你处于一个……移动得……像糖蜜一样……慢……的世界。\n\n###\
  \ 转型：从初创公司到大公司\n\n这就是从初创公司进入大公司的感受。\n\n即使是 Facebook，其在企业中年期仍保持快速移动、不断迭代的文化是令人赞叹且独特的，它也仅仅是一条德国风格的高速公路，而不是赛道。那几个工程师违规行动、不顾扎克伯意愿发布\
  \ Facebook Video 的日子早已一去不返。大多数车辆以限速行驶，大量的卡车占据着右车道，极少数驾驶员在左车道以全速行驶（这仅由 Zuck 个人发放不限速的通行证，任何其他敢超车的人都会面临职业生涯的危险）。\n\
  \n一家平庸的公司感觉像美国高速公路：最初建造良好，但现在充斥着许多由于长期忽视维修以及不理解车道规范的驾驶员引起的问题。左车道上那辆破旧的 Town Car\
  \ 正以时速 45 英里行驶并阻塞交通，那个开着改装底盘 Supra 和喷火排气管的哥们在右侧路肩车道半路飞驰而过，卡车在中间车道超车，尽管它们之间的速度差仅有两英里。\n\
  \n当你从初创公司加入 Apple 或 Google 时，你早晨在物理和比喻上都是顺着 101 号公路向南行驶：在某种程度上在移动，但基本上是一群无差别车辆中的一员，在变道前都会信号，尊重\
  \ HOV（高共乘）道，并绕开那些混蛋。\n\n在最糟糕的情况下（咳，甲骨文），你的大公司就像高峰时段德里的 Paharganj 社区：一片噩梦般的三人力车、出租车、卡车、行人和牛的乱杂，所有人都在试图去某个地方，尽管喇叭和人声此起彼伏，但没有人在移动。\n\
  \n\n\n\n为了衡量进度，我在 MacBook 的仪表板上放了一个倒计时器程序，用来计算到我首次股权归属的时间——在那之后之后，我已经无法想象自己还会留在那儿。时钟以分钟、小时和天为单位，我经常查看它，特别是在参加完一场充满企业黑话和呆木状态、极具挑战性的会议之后。\n\
  \n俗话说，“闲心作乱是魔鬼的游乐场”，因此这段时间我开始投入正事，就像某些产品经理做的那样——试图勾引我的产品营销经理。\n\nPMMess（我们这样称呼她）的曲线从上到下由一系列交替的贝塞尔曲线组成：凸、然后是凹，接着又是凸，这种垂直方向的起伏让你无法移开目光。与\
  \ Facebook 大大多数女性（或者说是整个湾区的女性）不同，她知道如何穿衣；从脖部到膝盖的四十年代风格修身连衣裙是她的常装。她的金发衬托着橄榄色的皮肤，明亮的蓝色眼睛在她那张稚气的脸上像大灯一样闪烁着。\n\
  \n尽管 Facebook 内部的沟通中普遍充斥着匆忙且缺乏教养的状态，但她在邮件拼写和使用上有着近乎迷人的完美主义。我们会调情式地互相斗嘴，讨论 `CPM`\
  \ 究竟是首字母词还是缩写词，以及我为了回应某些乏味的公司对话而写的、华丽过头的某种辞藻，究竟是借代还是比喻。\n\n和我一样，PMMess 也会陷入几阵颓靡的、酒精驱动的自我毁灭中，这通常以某种毫无节制的肉体行为终结。已经有几次，这种行为涉及了我们，尽管仅停留在相对\
  \ PG 级的路边亲吻程度。是时候达成交易了。\n\n那时候 Facebook 的周五下午有一种欢乐时光的氛围。扎克伯格（Zuck）会举行全公司问答，员工可以提前对问题提建议或投票，以便向这位总司令提问。我会根据入选的问题（这些问题会发布在\
  \ Facebook 内部群组里）偶尔参加，并在结束后在那群二十三岁穿着连帽衫的人群赶到之前，冲光他们供应的任何桶廉价啤酒。广告部门的人会在某个时候穿过来，如果天气允许，他们会聚在户外野餐桌旁：Mark\
  \ Rabkin、Fidji Simo（当时是营销人员，后来是产品经理）、Brian Boland 等——这些是广告部那种真正可以一起喝几杯的酷，在当时是非常罕见的。\n\
  \n在这些非正式的庭院闹剧中，一个特别活跃的团队是广告产品营销团队。他们属于广告部，但与 Boland 的“黑手党”是不同的“组织”，由性格随和的中西部人 Mike\
  \ Fox 领导。该团队在 Facebook 架构中的角色很有趣。尽管社交媒体有着各种先锋的姿态，它仍必须涉足诸如阿肯萨斯州的本顿维尔或密歇根州奥伯恩希尔之类的地方，并说服那些销售或制造实际物品（分别是沃尔玛和克莱斯勒）的公司在\
  \ Facebook 上花钱。向通用汽车的首席执行官推销 Facebook 就像教一个亚马逊部落人如何使用收音机：只要你用他们的语言来包装，并将其融入他们神圣的任何奇异神话中，都是可能的。Fox\
  \ 与同他的手下 Doug Frisbie、Dan Tretola 和 Galyn Burke 是前往那些疲惫的肉身与钢铁巨头的使者。\n\nFox 的团队在每个欢乐时光总是全员出动。PMMess\
  \ 是这场营销狂欢中频繁的同谋者。在举办扎克问答的咖啡馆周围的野餐桌旁“热身”后，这小组就会离开前往别处继续大乱。\n\n目的地：影子淑女酒吧（Shady Lady\
  \ Bar），这是 Facebook 那种拼凑出来的酒吧文化中最具史诗感的产物之一。它看起来像爱荷华州迪莫因市的一座艾尔克会所（Elks Lodge）的内部，配有落魄的\
  \ 70 年代明星的签名照片（例如伯特·雷诺兹），以及一个铺着软胶乙烯和层压板的柜台。这家酒吧从加利福尼亚大道迁入后，在 10 号楼重新获得了活力。10 号楼位于校园环形建筑群的末端；它是\
  \ Facebook 的官方入口和接待处，同时也容纳了运营或法律等随机团队。接待大厅加上非工程师，意味着在周五晚上七点，那里那里比莫哈维沙漠还要荒凉。此时，Fox\
  \ 那帮人加上 PMMess 已经喝得不醉了，我们接管了那个空间。希望能找到除问答活动中提供的大众啤酒以外的东西，我打开冰箱，发现自己正盯着一瓶未开的 `Thunderbird`，那是廉价酒中的极品。老天，我甚至从未见过它，只是听说过。其他也完全是劣质酒。唯一运转的水龙头流出的东西像\
  \ `Coors Light`。这家酒吧可能是一件概念艺术品，而不是一个运作的水水口。\n\n然而，这里真正的兴奋剂是穿着紧身连衣裙的 PMMess。通过我现在已不记得的手段，我设法引导她离开了马戏团，走向周围排废弃的办公桌。色欲再次被勾起，突然隐私变得弥足珍贵。在没有失去全身贴合的情况下，我伸手推开了几码外墙里嵌入的一扇神秘门。那是一个装满了清洁用品和\
  \ Facebook 生活杂物的杂储物间：宣传海报、极客玩具和包装箱。\n\n轻轻地将我们俩拉进室内，我关上门，战斗继续。\n\n由于 PMMess 比我矮一个多头，这需要一些扭曲。漆黑一片意味着我们失去了任何平衡感，我们都略微失衡了。黑暗和她的距离，让这更像是一次头撞。我的额头先撞上了她的胸口，我们都向后靠在墙上，我弯着腰。\n\
  \n文胸支撑了。\n\n*胜利属于我！*\n\n相互肉欲的引擎正在轰鸣，但我并不觉得转得还不够高，足以尝试肉体结合。对我来说，在 Facebook 的扫帚间里啪啪几下也太出格了。\n\
  \n事情在酝酿中而非爆发。踩下色情的刹车，我推开门门留了一缝；四周安全了。我小心地将重量压在空闲的脚上，我先离开，PMMess 在几秒钟后随其后。\n\n回到淑女酒吧，那里只有十步之遥，我们没有被发现，在没有引起任何人显露挑眉的情况下重新回了战斗之中。这又是一个普通的\
  \ Facebook 周五。我看着 PMMess，她那双猫科般的眼睛流露出温暖和同谋的喜悦。\n\n\n\n\n在 Shady Lady 酒吧欢乐时光的热潮消退后，我们放弃了营销团队，回到了广告区，漫步在刚完工的庭院，在奇特的长椅或墙边停下，继续我们的亲热。从专业角度来看，这并非明智之举，但幸运的是，在周五晚上十点，即使是\
  \ `Facebook` 也处于空闲状态，这并没有产生任何负面影响（除了 `Ads` 团队的一些闲话之外）。\n\n通常情况下，在那个时间点或清醒程度下，这种场景本会发生在走在任务区的瓦莱西亚斯街（Valencia\
  \ Street）上，并会有一个更加动感的结局。但相反，我们都像理智、勤奋的专业人士一样回到了办公桌前。\n\n即使在课外活动方面，`Facebook` 也不是一个赛场。\n\
  \n## 公开上市\n\n越强大的阶级，越是声称自己不存在，其权力首要被用来执行这一主张。\n\n——居伊·德波尔，《景观社会》\n\n### 2012 年 2\
  \ 月 1 日\n\n`Mark` 发送的邮件总是让人振奋。他通常更喜欢 `FB` 消息，因此邮件意味着有严肃的事情发生。今天早晨指令的第一几行——不要分享这封邮件的内容，否则\
  \ `Sec` 就会来找你——并没有平息那一刻的警报。\n\n“Sec”当然是指内部安全机构，他们负责捕捉查看用户资料或泄露机密信息的人。就像东德的史塔（Stasi）一样，所有生活在其辖范围内的人都知道自己正被监视着。\n\
  \n邮件指示我们在下午四点在“帐篷”内集合。由于校园主庭院仍在施工中，`Facebook` 在一个如足球场大的停车场里搭建起了一个类似于大型福音派复兴帐篷的建筑，作为全公司的动员大堂。于是，人群在四点五分涌入门内，听取来自我们宗教之先知的消息。我像往常一样到了，在最后一排找了一个座位。\n\
  \n`Mark` 首先宣布公司正式提交上市申请。现场爆发了自发的欢呼声，迫使他停顿了一下。接着，在他一次比较啰嗦的演讲中，他警告说，上市也将带来公众监督的干扰目光，包括不少少的嘲笑。这是\
  \ `Facebookers` 在他们受保护的自尊心中从未被迫忍受过的东西。\n\n考虑到股价等琐事可能带来的潜在干扰，以及《华尔街日报》对一项他们显然完全不理解的服务可能发表的任何言论，`Zuck`\
  \ 有一条信息要传达：*专注于我们的使命！*\n\n作为古巴流亡者的后代，这一场景让我想起了一段集体文化记忆：革命初期，`Castro` 在身穿橄榄绿军装的随从簇拥下，在挂满旗帜的讲台上发表了极具镜头感的胜利演讲。那种转瞬即变的即时感，那种历史在眼前被创造的火花，如潮水般欢呼的人群，`Castro`\
  \ 脸上充满魅力的扭曲。那种感觉仿佛宇宙合谋在你面前*那里*发生了一件伟大的事情，而你因为在场而成为了其中的一部分。这就是 1959 年初那些迷醉的日子里，`Glinn`\
  \ 和 `Korda` 的照片向你传出的，这也是为什么这些照片令世界着迷，至今仍装饰着柏林或拉帕斯某些困惑不安的不满分子的卧室。\n\n在哈瓦那，我的表亲们被迫听取关于在单一维度个人崇拜内部维持核心价值观的啰嗦演讲。在梅洛公园，我坐在一个挤满穿着统一\
  \ `Facebook` 周边商品制服的帐篷里，做着同样的事情。\n\n回到哈瓦那，我的表亲们盯着破旧建筑和摇摇晃晃、吐着烟气的公交车侧面的 `Che` 和 `Fidel`\
  \ 的海报。旁边还有一些激昂的海报，采用那种只有古巴人仍在怀抱的、奇妙复古的社会主义现实主义设计：*一切为了革命！胜利永远属于我们！祖国或死亡，我们必将胜利！*\n\
  \n与此同时，我正走在 `Facebook` 内部，周围是 `Mark` 的拓版肖像和同样具有号召力的海报：勇行且大胆！量力而行！创造影响力！\n\n在它们的极端情况下，资本主义和共产主义变得等同：\n\
  \n由受尊崇且不可质疑的领导人所传授的精辟理想所驱动的无尽劳作，并由因遵循上述原则而被选出的领导阶层付诸实践，对其愿意磨碎任何磨坊所需的原料的行为给予丰厚回报？\n\
  \n两者皆然。\n\n一个（大部分）顺从的、迎合现有生产体系的媒体，将其框架为唯一可能的这种体系？\n\n没错！\n\n为了系统的有效运行而牺牲家庭和个人生活的士兵，并通过该系统内晋升的棱镜来看待自己唯一的人类价值？\n\
  \n欢迎来到 `Facebook` 人民共和国。\n\n但你在资本主义下可以简单的辞职，而在共产主义下却无处可逃，你会抗议道。\n\n至于资本主义下实际退出的能力：看看西雅图或旧金山的房价，以及一份良好的美国教育的成本，考虑\
  \ `Amazon` 或 `Facebook` 员工是否真的能跳出他们的跑步机。我从未见过有人真的做到了，但我认识很多人。\n\n问问你普通的家庭供养者，即使是那些双收入家庭，问他们是否觉得可以随心所欲辞职。他们生孩子时仅仅勉能休几周假，更不用说退出了。换工作无非是换了锁链的颜色。\n\
  \n正如永远睿智的 `@gselevator` 所引用的：在共产主义下，人们排队买面包，而在资本主义下，他们排队买 iPhone。当然，iPhone 比面包好，资本主义国家的生活水平显然更高，但从工人阶级的角度来看，任何一种生活体验的相似性都非表面而已。\n\
  \n现实是，资本主义、共产主义以及其他任何宏大的意识形态都汲取了相同的人类驱动——创始人或革命者的自恋性权力意志，以及大众对于成为比自己更大事物的渴望——尽管结果截然不同。民族社会主义、技术未来主义、布尔什维主义、伊斯兰国、泛阿拉伯主义、公社、约翰斯敦、十字军、文明使命、白人负担、福音派基督教、天命论、西班牙法兰西主义、后期圣徒教会、古巴革命——这个拥有千面孔的反派，将偏执狂狂躁的冲动与追随者在迷人故事中扮演角色的渴望结合在一起。\n\
  \n\n\n\n\nNaomi 在和 Cox 低声交谈间隙，正对着笔记本电脑快速敲击着，几乎没理会 Zuck 式的长篇大论。我越过她的肩膀看向屏幕。她正在向下滚动一封包含多个链接的邮件，并逐一点击它们，让它们在浏览器中逐个开启新标签页。点击马拉松结束后，她开始缓慢地在标签页之间切换，用鉴定师的眼光审视着每一个。它们是房产挂牌信息，每一处都是旧金山的一处房产。我捕捉到了其中一个的地址，打开我的\
  \ MacBook，利用我们那伟大的敌人 Google 查了该地址。这个位置位于金刚高地（Diamond Heights）一个尚可但并非绝佳的，那里是许多科技极客喜欢的、安静的社区。房产中介显然做了他们的`Google`\
  \ 课，挂牌信息很容易找到。它是对维多利亚范式的一种现代主义解构主义尝试（这种新建筑很可能取代了旧建筑）：全黑色石材、染色木材和波纹锌板，仅淋约透出一些飘窗的抽象概念，但本质上是不对称的怪物。标价：2,400,000\
  \ 美元。\n\n*“在我们上市期间，我们需要保持专注，”*这位社交媒体的*指挥官*说道。\n\n每一家极其成功的科技公司都经历过同样的挣扎，以防止人们被潜在的股价分心。让\
  \ Facebook 这类公司与众不同的之处在于，财富差距的持续扩大，因为早期员工留了下来，而不断壮大的公司雇用了薪水尚丰的助手，但他们无法获得任何改变命运的财富。\n\
  \n在一个完全由消费定义的社会里，富有和不富的 Facebook 人之间讨论金钱的难度，堪比于瑞典无政府主义者与伊斯兰国分子讨论政治哲学。因此，规矩是完全不在公开场合谈论它。人们当然会在私下里讨论。在无疑有许多这类群体中，有一个名为`NR250`\
  \ 的组织，它或是一本关于如何变得富有的协作指南。标题源自“新富（New Rich）”，而 250 则是指最初涉及的约 250 名员工——传闻是这么说的（而且此时，这已不仅仅是早期\
  \ Facebook 员工了）。是的，从所有意义上说，他们都是名副其实的暴发户，根据所有报告（有多位成员向我透露过底），他们的表现也确实如此。如何通过`LLC`\
  \ 购买土地以掩盖你正在囤积庄园、马威夷最好的度假胜地、如何预订或租赁私人飞机、哪些是高端信用卡等等。但在校园里，只字不提。\n\n在日常生活中，这就像著名的`Google`按摩师邦妮·布朗（Bonnie\
  \ Brown）在自传中关于该公司面临的财富二分对局面所写的那样：\n\n并肩工作的 Google 员工之间产生了一种鲜明的对比。当一个人盯着屏幕看当地电影的放映时间时，另一个人正在预订周末飞往伯利斯的机票。周一早晨的对话会变成什么样呢？\n\
  \n然而，这个统治阶级的成员却激烈地否认自己的存在。自然地，如果你对南方白人进行种族主义的调查，他们会固执地坚持南方是平权的典范。英国上层阶级会宣布他们的国家是精英治国的模范。只要我使用“特权”一词时不会觉得自己像个社会正义战士并在嘴里作呕，这种特权的受益者`<heave>`就永远意识不到它。就像谚语中的鱼看不见浮的水一样，`FB`\
  \ 贵族并没有意识到自己在公司层级中的傲然地位。\n\n在更正式的层，这种态度意味着 Facebook 多年来没有提供 `401(k)` 匹配这类基础福利。正如我曾向英国交易员开玩笑的，当她问\
  \ Facebook 有没有养老金计划时，`IPO` 就是养老金。当然，这对许多 Facebook 人来说并非如此，因为后来的员工（包括这一位）在公司上市时无法获得改变命运的财富。Facebook\
  \ 最终确实承诺匹配退休金，但关于这一话题的内部辩论揭示了“有钱者”与“更有钱者”之间的裂痕。有些人不理解这个问题（更有钱者），而有些人则担心`Stanford`\
  \ 的学费以及负担起相对简朴的圣马特奥（San Mateo）的房产（有钱者，某种意义上）。\n\n有趣的是，那些不富有的人是如何拥抱这套系统的，即使他们并不是我们所有人加入的这种新秩序的受益者。初级员工被热情和无知所吸引，但中层管理水平的资深员工很清楚。他们知道自己过的是一种生活方式，但他们的老牌主管（这并不一定更有才华）过的完全是另一种。\n\
  \n这是一个马克思主义论点的教科书级案例：资本家将财产所有者的价值观灌输给他们的管理阶层，同时保留大部分劳动成果，以便与被剥削的无产阶级结盟，尽管经理和工人之间的共同点比他们与高级领导层的共同点要多。即使是那些公司成熟期入职、最拥护公司的\
  \ Facebook（或`Amazon` 或`Google`）中层，也意识到与早期员工和创始人——公司的真正所有者——相比，他的收入简直微不足道。然而，经理们却站在监督者的一一边，反对他们每天并肩工作的人。无论你对实践中的马克思主义怎么看，它准确地描述了我们当代的技术资产阶级社会。\n\
  \n正如公司一样，国家也是如此：国家的对话也忽略了富人与勉强维持生活的人之间近乎地质级的社会经济鸿沟。Facebook 仅仅是美国的缩影。\n\n*“专注于我们的使命！”*\n\
  \n当飞碟未出现时\n\n一个坚守信念的人是很难改变的。告诉你不同意，他会转身。向他展示事实或数据，他会质疑你的来源。诉诸逻辑，他会无法理解你的观点。\n\n\
  ——莱昂·费格曼等，《预言失效》（*When Prophecy Fails*）2012 年 3 月\n\n1956 年，社会学家莱昂·费格曼对一个围绕名为马丁（Martin）的芝加哥主妇形成的教派进行了了研究。马丁引导来自不同“频率平面”的外星生物的信息，她通过自动写作记录了这些信息。她的信息预测一场灾难性的洪水将在\
  \ 1954 年 12 月 21 日毁灭美国。预言者的信徒将通过外星飞船获得拯救，被带往他们被选中的更高境界。\n\n随着时间的推移，教派的成员不断增加，随着末日的临近，成员们辞去工作，任房产和生意荒废，为了末日疏远了不相信他们的家人。当飞碟和随之而来的末日在规定的日期没有出现时，教派的信徒并没有失去信仰。相反，这次经历加强了他们的信念，将其锻造成成一个紧密的虚假信仰联盟。教派的残余至今依然存在。\n\
  \n\n\n\n\n注：以下叙述的目的并不是对 Facebook 进行刻薄的嘲讽，也不是为了以此为乐而享受一个尴尬的失败。这是一个案例研究，说明了即使是非常智能的公司，在市场预期和盲目自大的双重压力下，也会暂时陷入疯狂，相信仙子或飞碟。每家大公司都曾在某种产品愚行为的幻觉状态中挣扎，直到现实最终追上幻觉时才猛然惊醒。以下是对\
  \ Facebook 重大变现迷失行为、其在营销技术领域的首次重大尝试以及其彻底失败的描述。\n\n## 初衷\n从表面上看，最初的想法是个好主意。\n\n##\
  \ 2010 年左右的 Facebook\n首先，我们必须回到 2010 年左右的 Facebook 世界，那时你用来跟踪前任或未来男友的产品与现在完全不同。那是\
  \ Facebook 世界里简单的时代：移动端使用率很低，App 漏洞多且运行缓慢。“页面”（Pages）是 Facebook 上唯一许可的商业表达形式，每个页面都是品牌或企业的某种简化版个人简介（记住，我们现在所享有的、数据丰富且强大的\
  \ `Timeline` 当时尚未发布）。其他人让内容进入你动态流的唯一方式是：朋友发布、非朋友在照片中标记你，或者你点过的页面发布了热门内容。当时没有办法付费并直接进入用户的动态流。少量的广告是位于页面右侧、像邮票一样的小东西，通常是某些令人心烦或无关的内容，比如游戏或手机套餐之类的低价值产品。你在\
  \ Facebook 上唯一能表达的“动作”是 `Like`（点赞）；没有任何在 `Spotify` 上玩游戏或听音乐的功能。这一切都是后来才有的。当时互联网其他地方并没有\
  \ `Like` 按钮能将你的情绪实时传输到动态流（以及你朋友的动态）中。\n\n## 广告格局\nFacebook——或者确切地说，是 Zuck——将 `News\
  \ Feed` 视为互联网不可不可侵的神圣之地，贪图财利的肮手在这里没有立足之地。当时 Facebook 是如何赚钱的？有两种方式，每种方式都反映了广告界的高层二元对立。\n\
  \n### 广告代理与点赞\n广告代理公司是商业品味的调节者，他们住在纽约，拿着巨额报酬去花巨钱，他们说服知名品牌为自己的 Facebook 页面购买 `Likes`。像\
  \ `Starbucks`（Sheryl 就在其董事会）或 `Burberry`（那些卖 4000 美元羊绒大衣的）通常会支付 1000 万美元，只为自己的页面获得\
  \ 500 万个 `Likes`。Facebook 的销售人员会推销 `Likes` 的神奇力量，就像天主教神父讲道圣体奇迹一样——面包和酒变成了身体和血。然而，从未有人完全解释过\
  \ `Likes` 如何转化为实际的销售额。这是 Facebook 信仰的奥秘之一，信徒必须简单接受这是超越人类理解的。试图去衡量其中任何内容（就像对多罗纳裹布进行放射碳定年一样）都会成为精神上的扫兴，并破坏魔法，所以闭嘴付钱吧。\n\
  \n### 直接响应广告主\n你记得，直接响应广告主（那些现在正向你推销毛衣或飞往波士顿机票的人）当时在 Facebook 上的占比微乎其微。Facebook\
  \ 的定位系统非常薄弱，没有人实际上能在这 Facebook 上直接销售任何东西（除了上述的 `Likes`）。唯一成功让 Facebook 广告奏效的直接营销人员是\
  \ `FB` 游戏平台上的开发者（例如 `Zynga`）。在 Facebook 的“兴趣”定位中，噪音中存在着一些信号，精明的营销人员通过成千上万的广告和数百万美元从中提取。例如，一家大型游戏公司发现，点过各种能量饮料的人对\
  \ `Mafia Wars` 风格的游戏转化率非常高。基本上，像 `Monster` 这样的能量饮料是那种没头脑的年轻男性的代名词，他们玩着社交游戏全盛时期流行的那些愚蠢黑帮暗杀游戏，而这些游戏现在大多已被遗忘。这是一个\
  \ Facebook 版的“啤酒与尿布”式真理，以那种营销人员喜爱的方式表现得显而易见。然而，性能的提升微小得荒谬，而且与更广泛的网络上定位精准的广告相比，Facebook\
  \ 广告的参与率是令人怜悯的（尽管 Facebook 内部没有人至少在公开场合意识到这一点）。\n\n## 搜索与平台\n与此同时，Facebook 的核心产品在\
  \ `Search` 和 `Platform` 上启动了大胆举措，得到了 Zuck 随意的批准，这是 `Ads` 永远无法获得的。就像被邀请参加富有家庭花园派对的穷亲戚一样，`Ads`\
  \ 缩在 Facebook 的庆祝活动之外，显得紧张、不确定，并对被迫穿的那件破旧外套感到羞脸。\n\n## Open Graph 豪博\n那么，这到底是一场什么样的大型企业豪博？\n\
  \n它涉及一个名为 `Open Graph` 的名称模糊的产品，其第一个版本在我加入公司的一年前在 Facebook 开发者会议 `F8` 上发布。稍后的版本增加了伴随“Like”的动词词典，将\
  \ Facebook 的词汇扩展到“播放”、“收听”、“观看”或“购买”等。这是你在网上所做的一切的全新“主-谓-宾”语言。“Antonio García Martínez\
  \ 在 Spotify 上听了 Wax Tailor 的《Only Once》。”不再仅仅是通过 `Like` 表达某种模糊的认可，Facebook 用户现在可以广播他们正在做的一切，这需要外部开发协助，他们将\
  \ Facebook 的新语法构建到自己的产品中。通过这种方式，这些开发者让他们的产品变得“社交化”，并可能具有病毒式传播。作为将数据全速注入 Facebook\
  \ 的交换，那些外部开发者——像 `Spotify` 这样的音乐播放器，或像《华盛顿邮报》这样的出版商——获得了 `News Feed` 的分发，从而引导更多用户进入他们的内容和服务。\n\
  \n## 变现之梦\n无论如何，那是梦想。\n\n这方面的变现几乎肯定不是你想象的那样。挖掘或出售数据并不是重点。通过对 Google `AdWords` 的模糊类比（其中推广结果会出现在搜索结果旁边），某些\
  \ `Open Graph` 故事的分发会被“提升”，并在用户的动态流中更频繁地出现。`Zynga` 和 `Eminem` 理论上会付费让他们的故事获得提升，并让你（用户）更频繁地与他们的产品或内容互动。你从未见过任何在其他情况下你看不到的故事；你只是更有可能看到它，也许看到得更频繁。每当用户看到或点击这样的“赞助故事”（Sponsored\
  \ Story，这是变现产品的名称）时，广告主就会被收费。\n\n记住：那时，有人点赞你的页面以及你发布某些内容，是商业内容出现在 `News Feed` 中的唯一方式。`Sponsored\
  \ Stories` 只是推了它一把，它提供了一点帮助，让它出现在你的目标用户面前（这些用户最初是通过点赞你才加入的）。当然，这不仅仅是 `Likes`。这是你玩\
  \ `FarmVille`，这是你在 `Spotify` 上听的一首歌，这是你在 `Socialcam`（一个早已被遗忘的社交视频网站）上看的视频。这是你在 Facebook\
  \ 上做的、甚至在 Facebook 之外的、被 Facebook 合作伙伴摄取的每一件事。最终，这将包括你在互联网上进行的每一个动作的动词，从吃披萨到和妻子做爱（嗯，也许吧）。这一切都可以通过\
  \ `Ads` 系统进行提升。能出什么岔子呢？\n\n\n\n\n\n“赞助故事”（Sponsored Stories）是一个经典的、完全站不住脚的“双奇迹”式创业构想。第一个奇迹是世界上所有的公司都在努力与\
  \ Facebook 集成并交出数据，而对它们自身的收益却充满怀疑。第二个奇迹是这些公司的营销人员放弃了他们旧的工作流程和成功神话，转而追求新奇的范式——一种未经证明且无法证明效用的范式，仅仅是因为\
  \ Facebook 是这么说的。因此，就像任何“双奇迹”式的创业构想一样，它几乎注定失败。\n\n然而，这并没有阻止广告团队。\n\n尽管 Facebook\
  \ 多年来一直举办上述的 F8 开发者大会——其举办与否取决于其平台和开发者生态系统的健康状况——但 Facebook 直到那时只举办过一次正式的营销会议。这次会议起了一个一个毫无想象力的缩写\
  \ FMC，首届也是唯一一次此类会议于 2012 年 2 月在纽约举行，那里是广告界的“梵蒂冈”，当时正是“赞助故事”闹剧达到高潮（或者实际上是处于谷底）。\n\
  \n一场盛大、华目的表演——想象一下苹果的产品发布会甚至是一场摇滚演唱会（结尾还有演出）——被选在纽约曼哈顿上西区、中央公园旁边的美国自然历史博物馆举行。奇怪的是，像我这样的核心产品工程师和经理在现场并没有真正的角色——那是属于营销经理和销售人员的——而我们被强迫承担一些琐碎的任务，比如帮助人们在门口签到。\n\
  \n“是的，请过来这里刷一下你的通行证并签到 Facebook 登录，”我会对某家控股公司的首席执行官说，那是一个靠着花别人的钱却毫无效率为生的职业丑角。\n\n\
  这是一场排场程度对于 Facebook 来说显得极不寻常的表演。\n\n现场有一条光线昏暗的“时间线走廊”（Timeline Hallway），你用会议通行证刷卡并识别身份。你的\
  \ Facebook 用户 ID 与你的会议注册相关联；刷卡的一瞬间，墙上的显示器亮起，了近期发布的“时间线”的流畅演示。就像经历濒死一样，你看到自己的一生从遥远的过去到最近的记忆在你眼前闪过，还有你朋友、新生孩子、婚礼等照片。人们被惊为观止——谁会不喜欢一场“关于你的电影节”呢？——并在他们刚刚见证过的时间线摘要上分享他们的签到，将这种“元”属性推向了极致。\n\
  \n我脱离了那场充满滑稽辞令盛宴——Facebook 的产品营销经理（PMM）和销售人员正与品牌营销负责人和代理机构总经理闲聊天——侧身绕过一道丝绒绳，探索了那座昏暗的博物馆。\n\
  \n自然历史博物馆是这类典型的 19 世纪用于教学式展示和标本制作的老派纪念碑之一。整个展厅都致力于展示那些前电影时代（更不用说前互联网时代）的世界陈产物：做得看起来像塞伦盖蒂平原或阿塔斯卡马沙漠的微缩景观，里面挤满了山羚、野马，还有一对看起来很像家畜的犀牛。我在想，这家博物馆还能说服多少活人去盯着那些被填充的尸体看？而\
  \ Facebook 等公司（博物馆正向它们推销其尊贵的房产）则正忙于彻底摧毁人类大脑中必要的注意力持续时间。\n\n这场应酬盛宴的主旨演讲由谢尔（Sheryl）发表，她用了\
  \ 45 分钟时间发表了一系列令人遗忘的 Facebook 老调。。重点不在于内容，而是看到“大谢尔”本人。这是一种类似奥普拉的明星味道，是为了让从曼哈顿中部开车到上西区的行程变得合理。\n\
  \n紧随谢尔之后的是相对的小红保罗·亚当斯（Paul Adams），他是广告团队的一位产品经理。亚当斯正作为这个勇敢的新社交媒体世界中的“马尔科·格拉德威尔”（Malcolm\
  \ Gladwell）而声名鹊起，他出版了一名为《分组：小朋友群体如何成为社交网络影响的关键》（Grouped: How Small Groups of Friends\
  \ Are the Key to Influence on the Social Web）的书。像格拉德威尔一样，他从关系网络的社会学研究中挑选出几个半原创结论，并将其编织成关于媒体和消费未来的宏大叙事，并以碎片化的形式喂给媒体买方人员的大脑。其核心观点是：新的想法和产品通过不断变化的社交影响者网络传播，而弄清楚这个网络并利用朋友之间的相互影响，是让你的声音被听到或产品被卖出的关键。这完美契合了宏大的“开放图谱-赞助故事”幻象——即\
  \ Facebook 那些带有你朋友脸的奇特小广告，正是你想要渴望一辆价值 60000 美元的 BMW 3 系 M 类轿跑所需要的。\n\n当然，如果保罗在某种程度上真的相信\
  \ Facebook 的剧本，而仅仅是利用它来推销他的书和个人品牌，那么他就完全错了，Facebook 自己的研究也揭示了这一点。在会议开始之前，Facebook\
  \ 研究团队发表了一篇关于点击行为对比的论文，研究了 Facebook 目前正向齐聚的代理机构精英们大肆推销的这种“社交背景”的影响。\n\n根据 Facebook\
  \ 研究的说法，加入社交背景（即在文字广告中加入“你的朋友 Joe 赞过”）与没有朋友笑脸脸的类似广告相比，点击率提升了约 40% 到 60%。这听起来很多，而且确实比毫无效果要好得多。但在实践中，这是一个糟糕的消息。Facebook\
  \ 广告的点击率低得惨忍睹，主要是因为它们糟糕的定位投放。0.05% 的点击率是平均水平；如果达到 0.11% 的率，你就可以在 SoMa 的 Alexander's\
  \ 餐厅点松露牛排了（当然，是用客户买单）。与展示广告相比，Facebook 广告甚至排不上号数；即使是定位最差的广告（例如那些愚蠢的“打猴子”伪游戏横幅），其点击率也有至少\
  \ 0.1%，而使用第一方数据和丰富动态创意素材的精准投放广告，其点击率高达 1% 或更高。这意味着，如果你真的在做账的话（许多 FB 广告主并没有这样做），Facebook\
  \ 广告的表现低了 20 倍。因此，性能提升 60% 虽然不错，但与真正的精准投放带来的提升相比，简直微不足道。\n\n\n\n\n然而，正如我早前的观点，赞助故事（Sponsored\
  \ Stories）带来的性能提升（如果这些提升在 Facebook 数据科学团队完美的测试条件之外真的存在过的话）在实时广告投放的日常嘈杂中并不显著。因此，合作伙伴们正苦于如何让广告商向这种全新的、酷炫的热宠进行投资。Facebook\
  \ 的反应基本上是告诉他们：再抓紧那只鹅，把管子往喉子里插得深一点。\n\n尽管存在着这些失败的迹象和根本性的错误方向，我们还是来到了这个大型快消品博览会。保罗·亚当斯（Paul\
  \ Adams）站在舞台上，背景是一个风格化的社交网络图像，就像《帕顿传》中的乔治·C·斯科特站在巨大的美国国旗前慷慨陈词，向媒体精英宣讲他们在这一场我们都被征入的社交媒体战争中的爱国义务。我所能做的只是环顾四周，凝视那些入迷的脸庞，对这一切的欺骗深感不可信。在科技领域的产品营销中，那条老掉舰队街格言就是铁律：永远不要让事实阻碍一个好故事。\n\
  \n结业晚宴在博物馆内部巨大的海洋生命大厅举行。被引人入胜却完全被忽视的海洋生物展品环绕，其中包括一个挂在天花板上的等比例蓝鲸模型，Facebook 的营销军正诱惑着酒后微醺的纽约媒体精英。在某个时刻，艾莉西亚·凯斯（Alicia\
  \ Keys）和一台钢琴突然出现在巨大画廊的一侧，仿佛是被空运过去的。派对进入了高潮，甚至 Facebook 人也停止了假装销售任何东西。我不知道这个叫 Keys\
  \ 的人是谁，也不知道为什么我周围的每个销售都兴奋得坐立不安。大型人群会引发我与生俱来的厌世情绪，当人潮变成暴乱时，我打了一辆 Uber 逃离了那里。当我回到平熨斗区的\
  \ Ace 酒店时，我的动态流里已经有一百张相同的照片：一个在聚光灯下的女人正坐在钢琴前，在蓝鲸之下，周围是数百个欢呼的人。“世界上最棒的事情了，”社交媒体的大字们嗡嗡作道。对于那些过着糟糕、低薪生活，整天都在排练一部他们从未出演过的电影剧本的销售人员来说，这就是他们在\
  \ Facebook 工作的原因之一。最终每个人都得到了自己的表演。\n\n### 赞助故事的疯狂\n\n现在我们很容易看出赞助故事的疯狂。那种狂热式的产品开发带来的狂喜挣扎在很多方面都很像迷雾。就像迷雾一样，当你处其中时，你无法真正看清它。迷雾遮蔽了你视野的最远端，但你周围的一切看起来都很正常。雾团的真实密度只有从远处、从隔离开才能看到。广告部门内部没有人——从谢尔尔（Sheryl）到刚从\
  \ Google 挖来的顶级广告高层，再到像我这样的产品经理——曾对这个完全不可思议的商业模式提出质疑。\n\n当时的布恩·博兰登（Brian Boland）广告产品营销副总裁，也是古库尔（Gokul）的营销对应人物，他的桌上放着一瓶伏特（Veuve\
  \ Clicquot），上面贴着一张便利签，预测着“赞助故事将带来 10% 的收入”。正如 Facebook 上许多失败或停滞的产品项目一样，博兰登正领导着这场盲目的冲锋。赞助故事的目标是在\
  \ `2011` 年底前达到 Facebook 收入的十分之一。然而，这些数字根本没有接近过。我一直很好奇那瓶酒去哪儿了；我猜博兰登静地把它带回家，在回想起那些恳求的邮件和客户推销时将其喝光了。\n\
  \n### 谢尔尔会议\n\n作为对到底该干什么鬼事的集体构思的一部分，我参加了随后到来的长系列“谢尔尔会议”中的第一场。谢尔尔在广告架构中的角色很有趣。在那段时间，她的会议室——其名字\
  \ `Only Good News`（只有好消息）很快带上了讽刺的色彩——将作为广告部门内部任何产品方向争议的终审法庭（而且争议非常多）。由于扎克（Zuck）几乎完全将变现管理权外包给了她，她就是社交媒体基督的牧师，扎克王座的副督。她代表他的领导层面，并策划如何最好地获得他的青睐，这是一项价值十亿美元的技能，她在这方面远超所有人。\n\
  \n2012 年 3 月的一个晴朗日子，广告高层加上几个像我这个谦卑的通讯员一样的相关的产品经理，聚集在谢尔尔的领地讨论日益恶化的收入状况。IPO 就在几个月后。前瞻性增长并不是市场通过泄露的\
  \ FB 收入秘密数字所预期的，FB 的收入在历史上几乎每年翻倍。赞助故事已经彻底失败了，Facebook 能提供的只有更多关于 Facebook 页面和粉丝对品牌魔力效应的童话。这些童话被相信了一段时间，世界上最大的品牌预算方——宝丽奇、福特、星巴克、宝马——把钱花在了他们不知道如何处理的“点赞”上，而这些点赞充其量只是向用户的新动态里发垃圾信息的许可。\n\
  \n会议接近结束时，谢尔尔终于爆发了：\n\n> “够了！星巴克不会每年为‘点赞’花掉一千万美元。再没人会那样做了！”\n\n她当然是对的。买赞的时代正式结束了。收入增长正在崩盘。如果\
  \ Facebook 不变出新花样，我们就完蛋了。\n\n## 肿瘤变现\n\n为了增长而增长是癌症细胞的意识形态。\n\n—爱德华·阿比，《归乡之路》\n\n\
  ## 2012 年 3 月\n\n突如其来的收入焦虑会滋生许多怪物，以及少数优秀的产品。正如我经常与古库尔共处的情况一样，我被交了一个产品怪物，在这个充斥着怪物的季节里，它是最贪婪、最不可思议的新型收入想法。这个想法特别引人注目，因为它让我与\
  \ Facebook 最重要的群体产生了接触和冲突——那个被归功于 Facebook 成功的团队。\n\n那个团队被简单地称为 `Growth`（增长）。\n\n\
  生命中有三件必然的事：死亡、税收和 Facebook 的用户增长。\n\n广告团队将用户转化为金。增长团队将钱转化为用户。他们共同构成了 Facebook 平衡的阴阳。恰恰如此，在我们从加利福尼亚大道搬后，这两个团队占据了\
  \ 17 号大楼相对的侧翼。\n\nFacebook 全范围内唯一可靠的营销人员不在广告部门，而在增长团队。比如像亚历克斯·舒尔茨（Alex Schultz）这样的人，一个身材魁梧、嗓门很大、光着头、眼神犀利的英国人。或者是布恩·皮普格拉斯（Brian\
  \ Piepgrass），一个说话温和、总是微笑的加拿大人，从未上过大学，但他管理着每年超过一亿美元的营销支出。这些人精通所有的门路。在广告部门的任何人甚至知道什么是实时广告交易平台（尽管这些平台已存在多年）之前，增长团队就已经利用这些平台来重新定位那些几乎注册了\
  \ Facebook 却因为网络分心等偶然因素而点击了其他地方的用户。\n\n增长团队利用每一个心理学技巧、每种视觉幻术，将一对眼睛变成 Facebook 用户\
  \ ID。像最顶尖的直接响应营销人员一样，他们将点击率和转化率精确到小数点后三位，并维护着详尽的用户数据库。无论是通过斯金纳心理学还是帕甫洛夫心理学，他们都能计算出最佳频率发送关于\
  \ Facebook 内事件的提醒（如提及或朋友的新动态），以获得最佳反应。他们会与移动运营商达成协议，以便在数据服务糟糕的国家促进 Facebook 的用户体验。\n\
  \n\n\n\n是“增长”（Growth）团队维护着一张世界地图，就像《风险王国》极晚期阶段的棋盘一样，追踪着 Facebook 的全球统治进程。在这个阶段，增长团队尚未成功扭转的国家要么是奇特的、独裁的，要么腐败的（或三者兼有）：俄罗斯、缅甸、越南和伊朗。增长团队的人每天都投入到狂热的征战中，试图让这些国家也变成\
  \ Facebook 蓝。一个接一个，每个国家都屈服于他们无情的管理，而社交网络领域的追随者（`Hi5`、`Orkut`、`MySpace`）像某些奇特且被遗忘的海鸟一样消失了。\n\
  \n现实情况是，Facebook 如此成功，以至于地球上的人类快用光了。思考一下数字：`Internet` 上大约有三十亿人，后者广义地定义为任何形式的网络数据、文本、浏览器、社交媒体等。在这些人中，有六亿是中国人，因此\
  \ Facebook 实际上无法触达他们。在俄罗斯，得益于 `Vkontakte` 和其他模仿者的社交网络，Facebook 在该国九千万 `Internet`\
  \ 用户中的份额也很小，尽管它仍可能赢得那场战斗。这留下了约 23.5 亿等待 Facebook 采摘的人。\n\n虽然对于接入联网的、活跃的阶层来说，Facebook\
  \ 似乎无处不在，但它的使用率对于即使根深蒂固的 `Internet` 用户来说也并非普及。例如在美国，作为公司最成熟且粘性最高的市场，只有四之三的 `Internet`\
  \ 用户活跃于 `FB`。`FB` 与 `Internet` 用户的比例在其他国家更糟，因此即使在某个市场实现了 `FB` 全饱和，也不意味着 Facebook\
  \ 的全面采纳。让我们（非常）乐观地假设任何市场的渗透率都能达到美国水平。剔除中国和俄罗斯，并考虑到 25% 永远不会加入或留下的用户（正如美国的情况一样），全球大约剩下\
  \ 18 亿潜在的 Facebook 用户。就这些了。\n\n2015 年第一季度，Facebook 宣布其拥有 14.4 亿用户。根据 2014 年公布的数据，`FB`\
  \ 以每年约 13% 的速度增长，且这一速度正在放缓。即使假设这种增长能持续到 2016 年，这意味着它还剩一年的用户增长空间，然后就结束了：Facebook\
  \ 在 `Internet` 上的人类用光了。\n\n公司可以通过两种方式解决这个问题：制造更多人类（这对 Facebook 来说很难），或者连接地球上剩余的人类。这就是\
  \ `Internet.org` 存在的原因，这是 Facebook 发起的一项带有模糊公共精神且颇具争议的活动，旨在为整个印度接入免费的 `Internet`，巴西和非洲等地区也将紧随其后。2014\
  \ 年初，Facebook 收购了英国航空航天公司 `Ascenta`，该公司专门从事太阳能无人机业务。Facebook 计划在发展中国家上空派遣一支配备 Wi-Fi\
  \ 的无人机机军，为他们提供 `Internet`。想象一下，超轻碳纤维飞机在非洲稀瓦纳草原不断嗡嗡飞过，而当地人在看守牲群的同时查看他们的 Facebook\
  \ 动态。\n\nFacebook 无法等待发展中国家达到第一世界的网络连接标准，因此它必须为他们创造这种标准，利用发达国家的广告收入来补贴这支新空军的部署。随着时间的推移，变现将随使用而来，正如一贯如此。金钱追随目光，即使缓慢。\n\
  \n最终，俄罗斯、伊朗、印度、巴西和非洲部分地区将服于增长团队耐心的管理。那时，马克·扎克伯格就像在印度河畔的年轻亚历山大帝一样，为没有更多世界可以征服而流泪。\n\
  \n这一切听起来非常虚幻，所以这里有一个关于“广告与增长”辩证法的真实案例来阐明：\n\n### 广告与增长的辩证法：LOX 案例\n\n在 Facebook\
  \ 期间偶然管理的各种奇特产品中，有一个特别为相关。让我们先预判一下。登出体验（`LOX`）是 Facebook 在 2012 年年中 IPO 期间的“完全绝望了，现在就多赚点钱”的产品之一。\n\
  \n基本上情况是这样的：当你登出 Facebook 时，看到的不是普通的 Facebook 登录/注册页面，而是你会看到等同于普通 Facebook 页面上半部分的内容；即我们从自己的\
  \ Facebook 个人资料中熟悉的封面图和页眉。这个想法是将这个空间卖给最富有且最愚蠢的广告商——数字媒体的遗留录取生：品牌营销人员。品牌营销人员像政客一样，是拿钱花别人钱的人。在这种情况下，他们所谓的目标是提高“品牌意识”，那是那种透明且近乎无形的物质，让你在获得奖金或晋升时，渴望一只价值\
  \ 10,000 美元的劳力士潜水员。\n\n另一个同样急切、据称会吞噬 `LOX` 的营销人员是以好莱坞为中心的机构，他们希望大肆宣布另一部电影“反人类罪”的上映。登出体验是\
  \ Facebook 试图向那些营销人员呈现一个诱人的目标，等同于大型横幅广告或全屏覆盖。\n\n`LOX` 这个名字带点 `Scott Shapiro` 的产品营销天才，源于\
  \ Facebook 广告产品以鸟类或鱼类命名的历史传统。鉴于这是一种被保存的 Facebook（即你在已经登出后看到它），`FB` 鲑鱼变成了 `FB LOX`，一个产品就此诞生了。\n\
  \n到目前为止，这充满了雇佣色彩。\n\n#### 问题何？\n\n在广告部门，我们完全没有意识到 `FB` 上登出页的重要性。\n\n一点背景：在大多数发展中国家，人们并不拥有台式电脑，他们的手机是非智能手机的垃圾（当然，这正在逐渐改变）。因此，人们像巴西或印度或其他任何地的背包客那样做：使用网吧或其他公共电脑。他们登录，每小时使用一段时间\
  \ Facebook，然后登出。他们留下的是登出屏幕，而这恰恰是世界上浏览器上最常见的网页。真的。你走进世界上任何地方的图书馆或咖啡馆，屏幕都会闪烁着 Facebook\
  \ 的蓝色。这也是这些国家新 Facebook 用户产生的方式，更不用说引导现有用户使用 Facebook 了。我们广告部门甚至还没有开始体会这一事实。\n\n\
  \n\n\n最终，这场广告与增长之间的恶性斗争的结果是：我们只能在某些国家运行 `LOX` 单元——在增长部门已经击败了所有其他社交媒体竞争者的地方；而在另一些地方，战斗依然略显胶着。因此，由因\
  \ `LOX` 命名而闻名的 Scott Shapiro 策划的销售剧本中，这种广告单元仅出现在像美国这样 Facebook 已经大获全胜的国家，而不会出现在巴西，在巴西，Google\
  \ 那个可怜的早期社交媒体尝试产物 `Orkut` 的尸体还很温暖。这就是我所陷入的变现与增长之间永恒的拉锯战，而我很乐意在第一个机会就放弃它。几周后，我们推出了\
  \ `LOX`，销售团队开始推行了它，而我再也没有关注过它一眼。\n\n# 大觉醒\n\n又叫他们地上强弱、富足和贫的、自由的和奴的，都在他们右手或额头上受了记号；凡没有这记号或兽名的人，就不能买卖……\
  \ . .\n\n—《启示录》13:16–17\n\n## 2012 年 3 月\n\n每个孩子学会的第一件事是什么？我们给新宠物传授的第一课是什么？什么让我们瞬间从任何沉思中抽离，无论这种沉思有多深？\n\
  \n一个名字。\n\n这很简单，但当你思考它时，它是神奇的：你说出一个特殊的词，那个人（或狗，或婴儿）就会转头并将注意力投向你。这是不自主的，却又如此根本，它几乎就是自我意识的定义：我知道我是谁，并且被叫时我会回应。我们表达自我的核心是名字；每本语言教科书都从模拟对话\
  \ `my name is .. . . je m’appelle .. . . ich heiße.` 开始。它是我们身份认同的核心；没有什么能比由于政治迫害或监禁而失去名字更丧失人性了，就像那种在残暴的流水线上被简化为一个非人性的数字。没有了名字，*我们*就不再是*我们*自己了。\n\
  \n现代广告只是选择性的称呼，这就是为什么它是如此迷人的原始。这怎么说呢？我们认为截然不同的各种营销渠道之间，唯一的区别在于我们称呼目标受众时使用的名称。广告的运作实际上是名字的呼唤与响应，某些机制比其他机制要高效得多。\n\
  \n### 那么这些名字是什么？\n\n在直邮广告世界中，它是我们附在一封三等邮件上的邮寄地址。例如，如果 `Bed Bath & Beyond` 想用它那极妙的\
  \ 8 折优惠券之一引起我的注意，它会喊道：\n\n```\nAntonio García Martínez\n1 Clarence Place #13\nSan\
  \ Francisco, CA 94107\n```\n\n如果它想在我的移动设备上找到我，我那里的名字是：\n\n```\n38400000-8cf0-11bd-b23e-10b96e40000d\n\
  ```\n\n那是我几乎不可变的设备 ID，每天在移动广告交易平台上广播数百次。\n\n在我的笔记本电脑上，我的名字是这个：\n\n```\n07J6yJPMB9juT0war.AWXGQnGPA1MCmThgb9wN4vL0Upg.BUUtWg.rg.FTN.0.AWUxZtUf\n\
  ```\n\n这是 `Facebook` 重定向 cookie 的内容，它根据你的网络浏览记录向你投放广告。\n\n尽管这可能显而易见，但这些密钥每一个都关联着我们大量的个人行为数据：我们访问过的每一个网站、我们在实体店购买的许多物品，以及我们使用过的每一个\
  \ App 以及我们在那里做了什么。\n\n然而，这些密钥及其关联数据的持久性非常重要。我们更换物理地址的频率低于清除浏览器中 cookie 的频率，也低于 `McAfee`\
  \ 为我们清理的频率。更换设备介于两者之间，这就是为什么移动端的数据隐私问题比桌面端要挑战得多。\n\n目前营销领域正在发生的最大的、在 `Facebook`、`Google`、`Amazon`\
  \ 和 `Apple` 内部产生数百百亿美元投资和无休止计谋的事情，就是如何将这些不同的名称集连接在一起，以及由谁控制这些链接。仅此而已。除了在各大数字巨头之间为了控制身份、定位和归因的这场《权力的游戏》般的权力斗争外，其他一切都是寄生的旁边戏，几乎不值得花精力去关注。\n\
  \n移动、桌面和线下：每个营销人员都在追逐其消费者目标的三个虚幻且不完整的形象，就像一个打醉了酒的拳击手看到三个自己并向每个方向乱挥重拳。但在这一切背后，只有一个人：一个充满需求、欲望和焦虑的紧张个体，他的物种进化于一个充满满齿掠食者和狩猎采集者式丰荒交替的石器时代世界，而现在他正面临着时间转逝后的挑战。\n\
  \n### 这在实践中是如何运作的？\n\n假设你在上班时在 `Target` 网站浏览某个东西，但你不想买，因为老板在身边。利用 `Facebook` 提供的身份，`Target`发现你在回家的路上正在智能手机上玩游戏。它接管了你几秒的应用体验（这种完全的设备接管被称为“插页广告”）。即使在潜意识中内化了这些消费号召，最终当你回到家里使用个人电脑时，你会被促使购买那件东西。\n\
  \n或者，为了在这里展示我们的身份信息，你在一周后顺路去商店时买了它。你使用积分卡支付物品，你在卡片上输入了地址和电话。通过我们很快就会谈到的接入技术，`Target`\
  \ 已经将这些关联到你的浏览器和移动设备，形成了关于你完整的在线和线下画像。\n\n### 接着会发生什么？\n\n那次销售的收入（无论是在线还是实体店）都会归功广告主支付的移动广告展示。由于这种跨越所有设备的身份桥梁，广告主清楚哪些付费媒体影响了你的消费。广告服务器（即那个在手机游戏中向你展示广告的公司）理解哪一组闪烁的像素——世界上最虚拟的东西——让你花了真金白银。突然，游戏商卖给你的那个移动广告展示因此变得价值倍。\n\
  \n听起来很有老大哥的味道，你可能会这样想。但现在谁才是真正的老大哥？\n\n`Facebook` 或 `Google`？不，完全不是。`NSA` 和整个斯诺登式的监控国家？也许吧，如果你经常访问圣战网站。`FBI-CIA`\
  \ 机构？既是又不是。他们花了十年才抓到 `本拉登`，并且在 `Silk Road` 创始人犯下一些笨拙错误后，才关掉了那些在线卖毒的人。\n\n\n\n\n\
  我认为，现代“老大哥”的角色实际上是由你可能从未听说过的公司扮演的。这些公司的名称如 `Axciom`、`Experian`、`Epsilon`、`Merkle`\
  \ 和 `Neustar` 等。自 20 世纪 60、70 年代直销营销时代开启以来，这些公司一直在追踪整个美国消费者。他们知道你的姓名、地址、电话号码、电子邮件地址、教育程度、大致收入、家庭中的其他成员及其年龄和消费模式，以及你属于哪种消费群体——而且在互联网出现之前，他们就开始积累这些信息了。\n\
  \n但更有趣的。\n\n他们从大多数大型零售商那里吸收所谓的客户关系管理（`CRM`）数据，这基本上是每一位客户的“犯罪案底”——对他们来说，这是数据的圣杯。他们补充任何不完整的数据，构建越来越准确的个人画像，为线上线下打造目标细分市场，并利用这些细分在他们无无尽的消费者数据库中寻找相似的人。与斯塔西（Stasi）的档案（现已前东德人可以访问）不同，除少数例外外，没人可以访问这些记录。\n\
  \n## 这一切重要吗？\n\n我们生活在一个社会中，你的文化、宗教或政治认同已被你的消费模式所取代（“足球妈妈”、“iPad 世代”、“纳斯卡爸爸”）。事实上，像\
  \ `Nielsen` 这样的公司已经构建了详细的消费者，根据家庭规模、教育、收入、居住等多个维度进行组织，并赋予了有趣的名称，如“环路婴儿（Beltway Boomers）”和“乡村休闲者（Country\
  \ Casuals）”。这些被营销为“PRIZM 细分市场”，形成了一种消费预测星座，据称允许营销人员根据人口统计学原型定制他们的诱导策略。\n\n你消费；因此，你存在。这些公司是那种非互联网商业身份的守护者，坦率地说，在这个资本主义世界里，关于你的其他信息并没那么重要。想想：哪种信息被发布在你家乡的告示牌上会最让你感到恐惧：你过去十年选举期间的投票记录，还是你在\
  \ `Walmart`（或 `Amazon`）的购买历史？\n\n确是如此。\n\n## 监控体系\n\n而且这个庞大的全国监控体系如何在没有任何一丝监督或监管的情况下存在的呢？是邮政，女士们先生们。没错，就是那些卖邮票的人。\n\
  \n听听。\n\n根据邮政局自己的数据，直邮广告仅邮资一项就为其带来了超过 170 亿美元的收入，支撑了一个本会破产的机构。整个直销行业——即你扔掉的那些在邮件里的垃圾——如果你考虑到设计、打印、目标数据和邮资，其年产值无疑超过了\
  \ 500 亿美元。\n\n为了让你直观感受，`Google` 一年的收入仅略多于此。2014 年，在线营销人员在展示广告上花费了约 190 亿美元（基本上是除\
  \ `Google` 和 `Facebook` 之外的互联网）。所以我们在线下场边还有近乎另一个 `Google`、三个互联网或三个 `Facebooks` 规模的资金在等待。\n\
  \n考虑一下这一点，特别是如果你像我一样，生活在当代数字生活的特征——像素和电子构成的漩涡中。对于直邮，你必须砍掉一棵树，将其制成纸，聘请设计师，在上面打印一些漂亮的东西，妥善包装或装入信封，然后支付邮政局大约\
  \ `$.20` 的批量费用进行发送。算算账。这相当于大约 `$1,000 CPM`（每千次展示成本）。大多数在线媒体的售价大约在 `$1 CPM` 左右，可能稍高。这意味着在线广告即使效率比邮件低一千倍也可以幸存，并且在你的营销回报方面仍然能够收支。\n\
  \n问问自己：你最近做过哪一个？点击广告并在网上买了东西（尽管这很罕见），还是回复了一封邮件推销？\n\n*没错。*\n\n所以有一堆高达 500 亿美元的资金正等待着投向数字媒体，只要它们能弄清楚如何将其拥有的所有数据转化为一种在线身份的形式。\n\
  \n## 数据入库\n\n这正在发生。某种程度上。\n\n描述这种巫术的术语是“数据入库（data on-boarding）”，其运作方式如下：`Datalogix`、`Neustar`\
  \ 和 `LiveRamp` 等公司购买二线社交网络（`Hi5` 或 `Orkut`，有人用过吗？）、电子邮件通讯、约会网站（提示：`Match.com` 不仅仅靠订阅赚钱）或任何个人信息（如姓名和地址）与浏览器相遇的地方。这意味着，这些入库公司在你与电子邮件或你拥有账户的网站交互时，实际上在你浏览器加载的任何内容上都放置了一个微小的图像（通常只是空白区域）——在任何了解你线下细节的地方。这就足够让他们植入一个\
  \ cookie 或读取一个已经存在的 cookie。由于他们从你阅读的通讯邮件中知道你的电子邮件是 `agm@gmail.com`，或者从 `Match.com`\
  \ 知道你的名字是 `Antonio García Martínez`，他们知道将该浏览器 cookie 与你的各种个人信息关联起来。这些个人信息存储在数据库中，与其对应的浏览器\
  \ cookie 在一起，形成了一座从现实世界的你到浏览器版本的你的桥梁。它可能是以哈希（hashed）形式存储的，但那只是隐私戏；如果每个人都同意相同的哈希函数，无论如何存储都无所谓。\n\
  \n这种 cookie 和个人信息之间的关联，每天会数以万次出售并转卖给任何愿意付费的人。使用我们上面对“键”的描述，我们将一个物理地址、电话号码或法律名称关联到一个在线设备上：原子变成了比特，反之亦然。\n\
  \n## 为什么这很重要？\n\n想想：`Facebook` 和 `Google` 这样的媒体出版商只是更高效的邮局版本。他们为了钱传递信息。如果你要求，他们甚至会给你提供回执。不同的是他们用于发送信息的地址。在我们的媒介时代，`Facebook`\
  \ 或 `Google` 用户 ID 是比姓名或地址更好的联系你的方式。\n\n顺便说，这一切都是公开的，并且在 `Facebook` 的新闻稿中有充分记录。它只是不被理解，而且没有人考虑。但人们也许应该考虑。\n\
  \n\n\n\n\n我想你们会同意，我现在以一种非常直接且清晰的方式阐述了这段关于数字营销的冗长论述。然而，Facebook 得出这些结论的过程却一点也不直接，或清晰可言。事实上，这项作为\
  \ Facebook 争夺数字主权战略计划的大计划，经历了整整一年的狂热辩论、与数十家广告公司无休止的会议，以及全速的产品开发——而这些产品在开始的那一刻就改变了方向。\n\
  \nFacebook 上最受欢迎的帖子之一曾宣布`每一天感觉都像过了一周`，事实确实如此。Facebook 的工作就像一个让人完全投入其中的跳水现场（mosh\
  \ pit），当你终于晚上十点下班（每天都是）时，感觉自己仿佛某种程度上活过了五天。每个月都像一年。而一年呢？嗯，你可以想象那是什么感觉。\n\n从产品角度来看，最直接负责\
  \ Facebook 数字营销愿景的人有 `Brian Boland`、`Mark Rabkin`、`Mathew Varghese`、`Brian Rosenthal`\
  \ 和我。此外还有来自 `Ben Reesman`、`Hari Manikarnika` 和 `Gary Wu` 的大力协助，他们我领导的一个团队的工程师，该团队开创了解决身份问题的新颖方法。值得停顿一下来介绍一下这些人物。\n\
  \n### 人物登场\n\n`Boland` 我们已经见过了。他当时担任 `Ads` 的产品营销总监，很快就会升任 `Ads Technology` 的副总裁。\n\
  \n`Rabkin` 是个有趣的人物。他是美国从勃列日涅夫时期收割的大批科技人才中苏联犹太人的后裔，是 Facebook 广告领域一颗冉起的工程管理之星。我们最初合作是因为他管理对定位至关重要的广告基础设施，通过许多产品合作，我们变得亲近。所有野心勃勃的男人要么想让父亲开心，要么想在老爹脸上来拳。Rabkin\
  \ 是前者，他认真对待表现反馈，去读研究生是为了讨好上述父亲，并普遍认同权威。我是后者，而这最终导致了我们的分歧（更不用说塑造了我们对 Facebook 管理层的不同态度）。\n\
  \n`Varghese` 是一位 Google 的产品经理，拥有电气工程博士学位和数据背景。其他地方的经历让他对 Facebook 那些狭隘的废话产生了免疫力，当我被其他产品吞噬后，他最终接管了定位团队。\n\
  \n`Rosenthal` 是定位团队中一位非常有能力且平易相处的工程经理，他管理着从这一构思过程中产生的两个工程团队之一。他代表了 Facebook 工程的顶尖水平：不拘礼但不尊重，胜任而不傲慢，有野心而不自我中心。\n\
  \n### 寻求外部情报\n\n我们最终是如何进入正轨的？Facebook 摸清事情的方式：通过诚意存疑的会议从潜在收购者和合作伙伴那里获取信息，然后研究如何黑进外部世界以让自己有利。顺便说一句，这是每个拥有现有优势的大公司都会做的。\n\
  \n于是，这团队中的某些成员带着这样或那的产品营销人员或工程师，访问或会见了该领域的每一家公司，我是真的每一家。名为 `Turn` 和 `MediaMath`\
  \ 的公司分别为广告代理构建了领先的程序化广告购买技术——产品界面看起来像 `F-16` 的驾驶舱——他们耐心向我们介绍了他们世界的每一个技术和业务方面。第三方定位数据的市场领导者，一家名为\
  \ `BlueKai` 的数据经纪商，系统地引导我们了解了其数据管道的每一个部分。与 `Acxiom` 和 `Epsilon` 的会议解释了他们如何存储全球所有的消费者信息，并以极的定位精度使用它们。\n\
  \n这个世界里的科技公司异常精明，他们比我们更清楚 Facebook 如何将其数据变现。在这些最初的会议中，我们微妙地（或至少我们认为是这样）提出了引导性和启发性的问题，而这些公司非常耐心地回答了所有问题。在好几次场合，我捕捉到某个眼神或听到某个无意的评论，揭露了他们对我们的无知是何么不可置信。我信他们回到办公室后对我们愚蠢的问题大笑一场。但我们是\
  \ Facebook，所以他们必须对我们保持微笑，并在每场会议上都表现得慷慨大方。\n\n### 与 Experian 的会议\n\n那些来自直邮世界的旧派公司在技术上没那么精通。我还记得我们与\
  \ `Experian` 的第一次会议。他们完全不知道状况是怎么回事，我确定无论 `Boland` 或 `Rob Daniel`（我们的业务开发人员）首先联系的是，可能都不是该公司的正确切入点，但总之，他们派了一支相对初级的\
  \ B 组。考虑到 Facebook 正在构思的史诗级数据整合，这对他们是一个浪费时间的错误，但我们还是就当时的会议继续了。这支令人生畏的直邮矛的尖端由两个人组成：一个和蔼、像母亲一样的女人叫\
  \ `Carmen`，以及一个皱巴巴、邋里遢的家伙，我不记得他的名字了。\n\n值得注意的是，`Experian` 位于伊利诺伊州的 `Schaumberg`（芝加哥的一个远郊；我得查一下），他们为了这次会议从腹地飞过来。\n\
  \n“我带了这些给你们。享用！”`Carmen` 把盒子塞进我怀里，植物植物油那令人作呕的味道直冲我的鼻腔。\n\n“啊……这些是？”我脸上挂着挤微笑问道。\n\
  \n“饼干！”`Carmen` 说。她看起来是一个喜欢烘焙食品的女性。\n\n“噢哈……”我说着低头看。\n\n那是一个红白条纹的盒子，上面贴着当地面包店的名字。看起来像是那种产中西部式“普鲁斯特玛德琳”的小镇老机构。“Schultz\
  \ 面包店。始于 1929。”之类东西。\n\n为了缓解这种尴尬，我试着开个幽默：\n\n“但我以为我们是带着饼干来交易的……”\n\n`Carmen` 和 `邋遢家伙`\
  \ 看着我，露出了那种在你断拍时的礼貌微笑。整个提议的关系显然是 `Experian` 的个人数据与 Facebook Cookie 数据的巨大交换（因为 Facebook\
  \ 知道你使用的每一个浏览器）。`Experian` 为交易带来了在物理世界中购买的所有信息，以及你的姓名、电子邮件和地址，而 Facebook 将告诉它你在上网的情况；因此，即浏览器\
  \ Cookie。但他们并没有得到这些……或者在随后的会议中得到任何东西。\n\n对于那些在 Facebook 围墙花园之外建立了我们无法理解建筑的老练广告技术专家来说，我们是一无所知的。然而，我们与这些直邮人士生活在不同的世界。Facebook\
  \ 就像困在中间，试图同时向两个方向移动。\n\n### 门外的蛮人\n\n```\n耶和对约书亚说：这…… “你们的兵要绕城而行，每天绕城走一次。这样做六天。…………\
  \ 到第七天，你们要绕城走七圈，祭司要吹号角。\n\n“当你们听到号角的声时，全都要大声欢呼，城墙就倒塌了，每人都要直直向前走。”\n—约书亚记 6:3-5\n\
  ```\n\n\n\n\n现实情况是：Facebook 广告系统落后、笨拙、多漏洞且运行缓慢。如果你根据它类似于之前的哪个广告技术前身来对其定性，那么从数据的实际价值和定位能力来看，它就像\
  \ 2007 年左右的 Yahoo。如果扎克伯格（Zuck）对广告有所了解（尽管他很大程度上并不了解），从纯技术而非资金层面来看，他很可能会对 Facebook\
  \ 广告系统的这种原始状态感到尴尬。正如我以前说过的，十亿级别的数字仍然是一个巨大的数字，所以 Facebook 仍然创造着可观的收入，但如果你问任何一个广告技术创业者\
  \ 2012 年年中 Facebook 的状况，他们可能会用心掩不住的轻笑来回答。\n\n当然，这种状况在内部甚至没有得到任何认可。Facebook 广告部门并不知道自己不知道什么。这家公司就像富二代：缺乏技能，但继承的家产丰厚，无论他的想法多么古怪，每个人都必须与他打交道才能参与其中。\n\
  \n从外部广告界嫉妒的眼光来看，多年来 Facebook 与任何外部数据源完全隔绝，没有真实的追踪或归因分析来确定哪些 Facebook 广告奏效（以及在哪里奏效）。现在，我们提议通过现有所有的在线数据，将互联网四分之一的内容变为可定位的。你看过或买过的任何产品，关于你在线阅读或浏览习惯的所有已知信息——现在都将进入你的\
  \ Facebook 体验中。\n\n实现这一点有两种方法。\n\n第一种最终被称为“自定义受众”（Custom Audiences，简称 CA），是现有广告系统的扩展。就像我们之前讨论的数据“入驻”（on-boarding）一样，它是将姓名、地址和电子邮件等线下数据与\
  \ Facebook 用户结合的方法。这是它最初且唯一的意图，尽管它很快就演变成了更多功能。\n\n第二种更有趣的方法——Facebook 交易所（Facebook\
  \ Exchange，简称 FBX），将成为数字媒体程序化接管的终终章：一个实时交易所，将全球广告数据以一个一个用户、一次一次广告展示的方式连接到 Facebook\
  \ 体验中。\n\n### 它是如何运作的？\n\n在 CA 的案例中，广告主必须上传电子邮件地址、电话号码、姓名或其他个人身份信息（PII）列表，并手动创建一些定位聚类（例如“上个月买过东西的人”）。Facebook\
  \ 的技术由于是基于回收的定位技术进行草拟的，非常陈旧且缓慢，并且经常崩溃。\n\n在 FBX 的案例中，它将成为眼球的纽约证券交易所，人类欲望每天实时进行数十亿次的金钱交易。有了这条从外部世界到\
  \ Facebook 全部的实时管道，这家公司将从定位一个两年前不小心点过 Jay-Z 的人，转变为定位一个刚刚在 Zappos 的三只不同的鞋子之间做出选择的人，或者读了一篇关于新款雅田\
  \ Miata 的文章，或者在 eBay 上买过东西的人，就这么简单！\n\nFacebook 需要——迫切需要！一个实时广告交易所。\n\n这种规模的变动只有通过\
  \ Facebook 广告高层的最高层级才能批准。因此，有必要向广告高层推销一种大多数人从未听说过、更不用理解的技术。等级的无知是决策极不稳固的基础，所以领导层必须以某种方式向他们传达出“被理解”的感知。现在看来很难相信，但在当时\
  \ Facebook 没人了解重定向营销（retargeting），增长团队除外，他们住在自己的世界里。\n\n我将成为该产品的内部推动者，在 Facebook\
  \ 内部的动荡中寻找资源和共识。我还会确保所有合适的人都参加会议和推介环节。但必须有一个外部人士担任市场发声筒。这个人必须对程序化广告世界了如指掌，同时又具备那种不那么油腻的销售技巧和技术实力，足以说服\
  \ Facebook 的工程师和产品经理。在广告领域寻找一个既懂行又值得信赖的玩家，就像在地狱里寻找雪球一样。但随后，我想起了一个人。\n\n扎克·科利留乌斯（Zach\
  \ Coelius）是硅谷广告界较具色彩的人物之一。他本是一个来自明尼苏达州的中西部男孩，在 2005 年凭空出现在旧金山，并通过在旧金山南马区（SoMa）参加由富有的天使投资人举办的高额扑克游戏，让自己在风险投资（VC）领域声名鹊起。在扑克桌上赢光了他们的钱后，他会以投资的形式从他们那里获取更巨额的资金。他和姐姐创办了一家公司，做一些时髦但毫无意义的想法，但在\
  \ 2006 年，他察觉到了广告风向的转变。他与其他几家变成竞争对手的公司一起，启动了一个“需求方平台”（DSP）：这是一种复杂的广告购买技术，像股票经纪人一样与交易所对接，为广告买家服务。\n\
  \n当时我几乎不认识扎克，只互动过一次，但那一次互动就留下了深刻印象。在 AdGrok 的时期，我参加一个每两周一次的低额扑克游戏，游戏在 SoMa 的各家早期初创公司之间轮换。我们玩的扑克变种是德州扑克（Hold\
  \ ’Em），那是当时流行的扑克玩法，在大多数锦标赛中都玩。每个玩家发两张牌，通过一组公共牌来完成通常的五张扑克牌。\n\n两张桌坐着大约十几个技术极客，游戏正在进行，这时一个穿着印有“TRIGGIT”字样红色\
  \ T 恤的棕发男人出现了。他坐在两张桌之间，二没招呼，就开始在每张桌上打一局。他的打法极具侵略性——扑克迷所说的“松进激型”（loose aggressive）——将一场社交游戏变成了一场街斗。我一直设法避免这种失控的攻势，直到我拿到了两张\
  \ A。偷看了一眼，我决定慢玩（slowplay），下注没有我该做得那么激进，仅仅是为了让玩家留在场内。感觉到桌整体实力较弱，那个红衫男人扔下一大堆筹码，像往常一样激进地下注。我跟注并加了一个大额，诱导他跟进，并触发了慢玩陷阱。扎克看了我一眼就弃牌了。其他人也这么做。我收了由于压制了一手王牌而赢到的（小额）注码，然后半开玩笑地问他为什么撤得那么突然。\n\
  \n“因为你手里有一手王牌。从你看牌的那一刻起我就知道了，”他回答道。\n\n我翻开两张 A 展示给桌上。“确实如此，”我说，对他读穿我的能力感到既佩服又尴尬。\n\
  \n当然，此时我已经把衣服和名字联系在了一起，知道我在和谁交道。在那一刻，我想起了 AdGrok 首席投资者罗塞尔·西格尔曼（Russell Siegelman）曾随口提过的话：他投资过\
  \ Triggit，但后来被其激进的 CEO 挤出了局。利用这个桥梁，我向扎克提到我们有共同的投资者，淡化了扎克那次小政变的事实。\n\n他随口纠正了我——Russ\
  \ 是一个前投资者了——但借此我们开始聊起广告。\n\n两年后，他是我在实时广告世界唯一认识的人。如果他能看穿我，那么他就能看穿那些坐在 Facebook 会议桌上的“鱼”。我仔细地应对了\
  \ Facebook 广告高管们满满的日程和刻薄的行政人员，找到了一个广告部门所有重要人物都有空的一小时时段，并邀请扎克过来向齐聚一堂的 Facebook 名要人物进行推介。\n\
  \n\n\n会议开始前五分钟，我亲自召集了那些重量级来宾：`KX`、`Hegeman`（广告优化的传奇人物）、`Boland`、`Rabkin` 以及十几个工程师。在\
  \ Facebook，会议出席率就像冰毒徒承诺戒毒一样不可靠，所以有时必须拉一拽绳子。\n\nZach 展现了一场精彩的表演。整整一个小时里，他用程序化广告购买的广度和深度让广告管理团队如痴如醉，涵盖了直接营销和品牌广告主。这是\
  \ Facebook 在其上市公司未来道路上需要的闪亮噱头。我们跳过了华丽的销售推销，转而专注于所有实时数据和决策所带来的酷炫（这就是你如何推销那套工程密集型管理方案的），以及许多描绘业务案例的白板流程图。会议在一场罕见的狂欢中结束了。整个通常对\
  \ Facebook 之外的广告世界完全不感兴趣的管理层级，突然被点燃并兴奋不已。\n\n我将确保在接下来的几天里充分利用这股热情，随后跟进了一整套产品和业务案例，重申了\
  \ Facebook（终于）进入真实广告投放领域的必要性。感觉就像再次回了 Y Combinator 的 Demo Day，但观众是 Facebook 的产品和工程领袖，而且结果更加成功。\n\
  \n### 2012 年 5 月 4 日\n\n五周。\n\n我们为 Facebook 交付一个实时广告交易所只有五周时间。\n\n如果我们在 6 月 15 日之前交付，那就是第二季度（`Q2`）的结束，我们就可以准备在\
  \ `Q3`（IPO 后的第一个完整季度）入账收入。如果我们锁定了广告主的采用，那么我们就能从规模巨大的 `Q4` 中获利，那时每个零售商为了在圣诞购物季达标，都会在广告上挥霍数如如山的金钱。这是一个极其疯狂的时间表，但别无选择。\n\
  \n自从 Zach 的演讲之后，“赞助故事”（Sponsored Stories）已经彻底死掉了，公司也不再对 Facebook 的“仙女粉”抱有任何幻想。\n\
  \n我只给了三个工程师来完成这项心心勃勃的任务。\n\nBen Reesman 看起来像个在洛杉矶做数百万美元房地产交易的人，而不是一个为 Facebook 不断扩张且极渴求的广告基础设施编写复杂后端代码的人。他为\
  \ `FBX` 进行了第一次代码更改，让 Facebook 的数据存储能够接受投放伪名——也就是给你这个 Facebook 用户的昵号——我们很快就会开始每天发送几十亿次这种信息。他是一个“兄弟程序员”（Brogrammer），他自豪地带着这个头衔。这是一类受过教育、社交良好的兄弟会男孩，他们编写\
  \ `PHP` 或 `C++`，同时还保持着弗吉尼亚大学（UVA）Alpha Tau Omega 兄弟会大三学生的着装和卫生习惯。在许多方面，他是人们在想到程序员时所想到的那种不修边幅地下室生活的对立面。想象一下《动物房子》（*Animal\
  \ House*）中约翰·贝鲁希饰演的 Bluto，但更瘦一点，而且拥有计算机科学教育（可能还戴着一副 200 美元的眼镜）。代码、卷发和女孩，这些是当天的优先事项，按顺序排列。这反映了一个现实：编程早已不再是社交孤立独行者的失败者堡垒，现在甚至是橄榄球队长实现阶层流动和精英主义的途径。每当涉及到真钱和地位时（正如现在这样），那些渴望地位的男性绝不会缺席，无论任务是什么。\n\
  \nFacebook 在这个梗词的创造中发挥了重要作用。一位名为 `Nick Schrock` 的 Facebook 高级工程师创建了一个名为“兄弟编程”的 Facebook\
  \ 页面，该页面在 Facebook 之外也获得了崇拜地位。作为其“兄弟气”十足的体现，它曾戏仿过 Facebook 自己的服务条款（一份不断被争论和重写的相当严肃的法律文件），用“兄弟程序员语”对其进行了改写并公开发布。（示例行文：“我们非常他妈在乎你的隐私，所以我们写了这些。读读它，让你知道我们要对你发的那些烂事干些什么。”）科技生态系统和像\
  \ *TechCrunch* 这样的记录者（他们永远对科技领域女性的悲惨状况感到痛苦不已）开始对这种文化的腐蚀影响大声疾呼。（一些内部的笑话还热心地建议，可以为女性版的“兄弟程序员”开一个页面，他们被称为“hogrammers”，或者更礼貌一点，叫“brogrammettes”。）\n\
  \nFacebook 成熟并变得“严肃”的迹象之一，是 CTO 强迫 `Schrock` 删除了该页面，以免它被视为性别歧视和不友好。对于 Facebook 废除了它其中一个奇特的文化产物，我感到非常失望（至少在\
  \ Reesman 和我之间如此）。\n\n### 下一个 FBX 游击战士是 Hari。\n\nShreehari “Hari” Manikarnika 是我到达\
  \ Facebook 之前唯一认识并一起工作过的工程师。在加入被厌恶的 `Adchemy` 之前，他曾在 `Yahoo` 当过工程师；在我跳槽 `AdGrok`\
  \ 之前，他曾和我一起处理过一些搜索技术。当他也意识到 `Adchemy` 是一艘漏之舟时，我和我前 `AdGrok` 的合伙人试图招募他：`AZ` 和 `MRM`\
  \ 去了 Twitter，我去 Facebook。在与 `Hari` 和他的妻子进行了一场长达 16 小时的狂欢后（始于 `Zeitgeist` 活动，结束于凌晨\
  \ 4 点我在使命区的一场装装派对上装成警察），我说服了他加入 Facebook。从别人盘子里偷吃的食物味道更好，我为战胜了我的前合伙人感到非常快乐。\n\n\
  最后，还有 Gary。\n\n`Gary Wu` 和我从进入 Facebook 的第一天起就在投放小组一起工作了。他身材瘦削，平时很文静，但在讨论技术问题时非常激烈且有主见。我在\
  \ Facebook 见过的唯一一次跨房间的争吵是在 `Gary` 和一个不知如何惹了他的俄罗斯工程师之间。通常在这种情况下，通常在我们的每日站会上，当我们回顾每个人的任务和进展时，`Gary`\
  \ 的眼睛变得细细而专注，并出一连串带有重口音的评论，通常在发言者结束之前。这是一个严厉但必要的现实检查，特别是考虑到 Gary 对广告系统的全面了解。\n\n\
  这就是我拥有的军队。感觉就像回到了 Y Combinator，只不过有 Facebook 窒息的存在笼罩在我们上方。`FBX` 项目的代号将是 `Owl`（猫鹰）。为了士——毕竟我是一个全能产品经理——我从\
  \ Amazon 订了一个等尺寸的猫鹰模型，实际上是一个驱鸽的鸟人。Reesman 将它命名为 `Trackie the Owl`，它坐在 `FBX` 区域窗边。太阳能电池板驱动一个小电机旋转它的头部，表面上是为了驱赶鸟类。由于色玻璃和狭窄庭院的合谋让办公室保持阴暗，电量仅足以让头部偶尔移动，导致这个塑像在意想不到的时刻突然活过来，吓得任何毫无防备的邻居魂大跳。\n\
  \n\n\n\nFBX 的真实需求远比那些荒诞的团队建设稻草人周边商品要复杂得多。\n\n`FBX` 不仅仅是一个新的广告功能。它是一套与现有的 Facebook\
  \ 系统并行的完全全新的广告系统。该交易所将拥有数十亿行数据的独立数据存储，反映了我们与外部世界进行的各种数据对接。`FBX` 代码本身与 Facebook 广告内部任何代码都不同，它必须实时联系全球的机器进行竞价和广告投放，并以同样的速度对竞价做出反应，这一切每天发生数百亿次，每秒数十万次。广告本身的创建和上传方式将有所不同，允许广告主获得这种梦寐以求（且在\
  \ `FBX` 出现之前不可能）的能力：针对每个用户和每种广告体验进行动态微调。广告统计——这项保持预算流动至关重要的枯燥计数任务——必须独立存在，并为广告主及其会计部门服务。更不用说还有整套内部工具和仪表板来监控我们创造的这头巨兽的健康状况，确保竞价没有丢失，或者我们向合作伙伴发送过多的竞价请求。\n\
  \n### 业务端\n\n在业务方面，我们（我指的是那些高高在上的产品经理“我们”）必须寻找广告软件公司作为合作伙伴，并通过一系列文档、规范和集成测试将他们入驻。我们必须为他们的广告主编写一套销售话术，以便他们能反过来向客户推销，并说服他们这个新奇的交易所值得花钱。在此期间，我们还需要构建一个产品，尽可能降低广告主的采用门槛，这绝非易事。由于由于某些原因（我在此不再详述），Facebook\
  \ 的广告环境与标准的程序化交易所完全不同。广告本身不同，Facebook 对数据泄露的限制不同，交易所的运作方式也与你普通的广告交易所不同。在几个月内，我们必须为\
  \ Facebook 开辟一条完全独立的收入渠道，而几乎没有得到 Facebook 管理层的支持，同时还要安抚 `FBX` 合作伙伴，诱导他们的广告主花钱，而前提是误导性的\
  \ `FBX` 是公司的一项长期战略。\n\n### 问题\n\n问题归结为一点：我曾向广告领导层承诺在 2012 年实现 1 亿美元的收入，以提振 IPO 后的季度表现。这就是换取这些匮乏资源所做的交易。战斗开始了。\n\
  \nIPA > IPO\n\n越是限制自我，就越接近无限；这些人尽管看起来如此不世俗，却像白蚁一样钻进自己特定的材料中，在微观世界里构建出一个奇异且完全独特的世界形象。\n\
  \n——斯蒂芬·瑞格，《象棋故事》\n\n### 2012 年 5 月 17 日\n\n#### 该给 Jimmy 打电话了。\n\nJimmy 是我在 Willows\
  \ 超市的异域啤酒供应商。Willows 是梅洛公园的一家当地家庭杂货店，它通过发展活跃的精酿啤酒业生存了 Whole Foods 连锁店的冲击。市场位于 Willow\
  \ 路，起点于 24 卡拉的帕洛托郊外，然后穿过同样“金光闪闪”的梅洛公园，路过肯·凯西（Ken Kesey）曾工作过并为《越抓疯人笼》提供灵感的退退伍军人医院。就像在进行一场异域狩猎一样，Willow\
  \ 路随后横跨了东帕洛托——那是一个曾是整个湾区谋杀率最高的贫民窟（当地有两所学校以塞萨·查韦斯和非裔美国宇航员隆·麦奈尔命名），最后到达 Facebook 的大门，那里有一个巨大的“点赞”标志，周围环绕着形之不散的游客群。\n\
  \nJimmy 像个真正的经销商一样，全小时候接听。在某个随机（对他而言如此）的周五凌晨十二点半来电，这没什么。付款？别担心……把酒桶拿走，回来再给钱就行。\n\
  \n情况是这样的：Facebook 终于要上市了。这意味着 Facebook 将首次在 NASDAQ 上交易。为了复制老派资本主义的戏剧性——在过去交易所是一个充满交易者的物理空间，他们的一天从开市钟开始——NASDAQ\
  \ 用它自己纯属装饰性的大钟标记了这一时刻，大钟在纽约时代广场上隆隆作响地敲响，而那神神化的场景被投影在俯瞰这片游客俗气熔炉的广告牌屏幕上。\n\n### IPO\
  \ 策略\n\n但扎克（Zuck）有自己的的想法。\n\n身着西装出现在纽约对于这样一家扭转历史的公司来说将是一种降级。不，IPO 流程将在 Facebook\
  \ 内部举行。\n\n没错。Zuck 和 `FB` 高层想在 Facebook 自己的庭院里上演他们进入科技天堂的登仪式。这就像拿破和他的加冕仪式，他坚持在自己的巴黎后院举行，而不是在兰斯大教堂（那里自十世纪以来就一直是举行仪式的地方）。此外，类似于拿破从教皇庇九世手中夺过查理曼的皇冠并加冕自己和约瑟芬一样，不需要\
  \ NASDAQ 或华尔街的任何外部祝福。Zuck 将亲自策划这场演出，并在他心爱的水族缸旁亲自按下鸣钟按钮。\n\n从那一刻起，Facebook 将拥有一个面向公众的股价，那些不像\
  \ Zuck 那么狂热，或者净资产不像他那样多出三个逗号的员工，很容易变得软弱并担心那个波动的数字。为了确保没人盯着 IPO 股票价格，高层在一天之前晚上宣布了一场黑客松。理论是，如果每个人都通宵熬写代码，那么他们第二天就会精疲力竭，睡过交易的第一天。正如\
  \ Facebook 许多精妙的理论一样，事实证明要复杂得多。\n\n#### 黑客松之夜\n\n作为一个没用的产品经理，我几乎没有什么可以为这场赛前准备做出的贡献。我曾难忘地在办公室酿过啤酒，并决定招募一支队伍酿一批。我们升级了饮酒设施，我为团队买了一个真正的水龙头和啤酒桶冷却器，我在里面装了当地酿造的\
  \ IPA 和一系列比利时啤酒。酿酒的第一条规则：你必须在制作时边边喝。\n\n大日子之到，我在庭院正中央摆起了摊位，就在那家通宵营业的咖啡馆前面。巨大的、冒着热气的酿酒罐和火焰燃烧炉无疑吸引了注意力。旁边的啤酒水龙头也有帮助。Zuck\
  \ 走过，看了一眼场景，摇了摇头继续走开。Boland 和我因为在“自定义受众（Custom Audiences）”项目上的密切合作，正处于短暂的友好互动中，他留了下来并提供帮助。PMMess\
  \ 也在来回穿梭，尽管那份感情似乎已经彻底冷却了。她老板 Boland 的出现——他们之间的关系一直模糊不清——并没有让情况变得好过。。\n\n我为不断涌入的广告部同事们倒啤酒，甚至包括路过的\
  \ Facebook 员工。空气中弥漫着那种狂欢节般的氛围，人类在转瞬即逝的时刻与同类实现了慷慨的情谊，是宇宙如此仁慈眷顾我们的一种节日庆典，是同类灵长类类之间的交融。\n\
  \n然后啤酒光了。\n\n酒还需要一些时间（我们绝不会再尝试用 Facebook 那糟糕的管道系统再次来冷却它了），而缺酒是大忌。这时我打了 Jimmy 的电话。酒源搞定了，我问\
  \ Boland 能不能开车，因为由于刚刚结束的那场比利时液体之旅，我开始看到重影了。\n\n\n\n\n\n我爬进他那辆破旧的 `Volvo` 旅行车，车内磨损的棕色皮革座椅被无数孩子和周末足球赛之行糟蹋了。这辆车看起来就像有很多人和他们匆忙的餐食都在里面吃过一样。为了打破在狭窄空间内坐在一起的尴尬亲密感，我有些心不在焉地问他住在哪里。“阿瑟瑟顿（Atherton），”他回答道，那是顶级社区，谢尔尔（Sheryl）和其他其他真正的科技巨头都住在那里。“我们是租的，”他很快补充道，也许是注意到了我惊讶的神情。\n\
  \n当面对不受欢迎的社交场合时（大多数情况都是如此），我会默认切换到特里·格鲁斯（Terry Gross）式的采访记记者姿态。\n\n“那么，你是如何从`Microsoft`来到`Facebook`的？”\n\
  \n“谢尔尔招募并说服了我。”\n\n啊。这也许可以解释为什么他的嘴唇对她闭得严丝合缝。\n\n“进展如何？”\n\n“嗯，她基本上是这样说服我的：‘听着，我要么是现在雇你让你来`Facebook`工作，要么一年后我雇你去给我现在正提供给你这份工作的老板打工。’\
  \ 这就说服了我。”\n\n噢，谢尔尔·桑德伯（Sheryl Sandberg）和她的手段。这就是你诱惑这个世界的`Bolands`家族的方式：为他们提供一个他们本以为会错过的阶梯。\n\
  \n等我拿到波兰（Boland）的非正式简历时，我们已经到达了`Willows`。一瞬间，我理解了拥有自己酒吧或餐厅的魅力，就像那些无所事的富人经常做的那样。你只需要走进去，拿你想要的。这和波兰和我做的大同小异：凌晨一点，和最后一刻买卫生棉和尿尿布的人一起，大摇着走进`Willows`，报着吉米（Jimmy）的名字。我们像是那里的主的主人一样，拎走了一桶他们最好的`IPA`，把它扔进他`Volvo`的后备箱，然后一路冲回了园区。\n\
  \n快进两个小时后。\n\n第二桶啤酒现在也正式没戏了。那种由涡酒精和贪婪驱动的狂醉的最初冲劲已经消退。这种这实际上是一场有成效工作的黑客松的假象正变得越来越薄。关于“黑客之道”的一种奇怪的虚伪之处在于，公司太大了，以至于大多数员工根本没有能力对任何事情进行黑客操作，工程师的数量被各种类型的公司追随者远远超过。通常情况下，这些非黑客会缺席这种极客式的深夜仪式，但你不能错过这场\
  \ IPO 前的派对，所以每个销售员、行政人员、运营专家和 IT 帮助台的工作人员一直持续到深夜，在那儿徘徊，无事可做。无疑，公司忽略了安排任何稍微与节日或音乐有关的活动。`Facebook`的斯巴达式美德与庆祝活动格格不入，即使在他们公司神化的时刻也是如此。这些人中的许多第二天将变得真正的、流动的金钱。在任何一家正常的公司里，人们会在办公桌上吸可卡因并在会议室里狂欢。`Facebook`则并非如此。公司纪律得到了维持。\n\
  \n快进两个小时后。现在是凌晨五点，深夜了。\n\n我考虑过去船上睡觉，但担心错过大时刻。为了保持清醒，我在校园里绕圈，再次遇到了波兰，这次他手里拿着一瓶十二年单麦威士忌。他与`PMMess`正待在`Ads`和`Growth`之间开放区域的一张桌旁，那里依然挂着那幅还没画完的《超人》壁画，那画是在喷漆之夜出现的。\n\
  \n他们邀请我加入，虽然我从不是威士忌爱好者，但拒绝是不礼貌的。于是这三个不可能的组合是如何度过大活动前的最后一个小时的。一个路过的前`Ads`工程师发了一张我的照片：我看起来神情癫狂且不修边幅，黑眼圈很大，手里拿着一个纸杯。我穿着`Facebook`的制服——一件带标志的拉链外套，为了这个场合，我在里面套了一件旧的`AdGrok`T\
  \ 恤。\n\n此时我只处于半意识状态。我们已经开始为了准时交付`FBX`而疯狂熬夜，我在睡眠方面的亏空真的是希腊级别的规模。但加加州新的一天那晨曦的红色光芒破晓了！时刻临近了！\n\
  \n我们都散到户外，那里聚集了一群人。一夜之间，`Facilities`架起了一个看起来像摇滚演唱会的舞台，有一个足球场大小的屏幕，由脚手架和灯光围成。在它的底部立着一个柱子形的讲台，配有一个玻璃讲台。嵌入玻璃中的那个按钮是`Zuck`用来触发公共公司诞生的按钮。讲台后上方是三个图标的图像，正是那些烦人的通知创造了这个数十亿美元的帝国：两个人类形象，代表朋友请求；代表的消息气泡；以及一个代表点赞和评论的地球。这三位一体在内部被称为“宝石”，出现在`Facebook`的每一种形式中，无论是手机还是桌面，它们上弹出的红色通知现在是世界上的操作条件糖果。舞台上的效果让场景本身看起来就像一个`Facebook`页面。\n\
  \n随着黎明越来越明亮，院子满了，很快就人挤肉。积极的情绪恢复了，人群中充满了八卦式的期待和偶尔的欢叫声，异常嘈杂。讲台周围可以看到动静，很快`Facebook`的领导层开始逐一出现：`Zuck`、`Sheryl`、`David\
  \ Fischer`、`Elliot Schrage`、`Pedram Keyani`、`Chris Cox`（`Keyani`和`Cox`都向我介绍过入职）、`Javier\
  \ Olivan`（`Growth`负责人）、`Greg Badros`（当时负责`Ads`）等等。\n\n现在是早上`6:25`，历史即将被创造。\n\n场景以政治集会风格投影在大屏幕上，让院子里的每个人都能跟上。\n\
  \n突然间，一个响亮的女声宣布场景也在纽约时报广场播放！NASDAQ 的使者们（有人穿着 FacebookT 恤）将`Zuck`介绍为公司的“愿景家”，仿佛他需要介绍一样。\n\
  \n恢复安静，`Zuck`拿起麦克风：“几分钟后，我将敲响这个铛，然后我们都回去工作。”\n\n*专注于我们的使命！*\n\n`Zuck`发表了几段庆祝性的辞，在欢呼声中几乎听不见。\n\
  \n\n\n\n丘吉尔在一次议会演讲中曾提到：“人们说，民主是除了我们一直尝试过的其他所有形式之外，所有政体形式中最糟糕的一种。”\n\n同样，资本主义是管理生产资料最糟糕的形式，除非有更糟糕的方法。我们应该视其为这种本质，而不是把它变成与瑜伽和约翰·奥利弗并列的“蓝州世俗宗教”。\n\
  \n我对资本主义最大的不满是什么？它让万物丧失了神圣性，剥夺了世界的奇奇感，只留下一个庸俗的市场。廉化任何东西最快的方法——无论是女性、人情，还是艺术品——就是给它贴上价格标签。而这正是资本主义的本质：一个忙碌的蔬菜商拿着贴标机穿行于他的商店里——*咔嚓！咔嚓！*——鸡蛋\
  \ 4.10 美元，Sightglass 的咖啡 5 美元，Mission 地区一间破旧的一室公寓每月租金 5,000 美元。\n\n你觉得我在夸大吗？\n\n\
  停下来想一刻，这整场 IPO 仪式到底是为了什么。第一次，`Facebook` 的股票将拥有公开价格。在所有的浮华和欢呼中，这正是市场先生带着他的贴标机过来，然后——*咔嚓！*——给\
  \ `Facebook` 贴上了每股 38 美元的标签。每个人对此都欣喜若狂。这是科技行业的高光时刻之一，也是我们这个时代“一生一次”的时刻之一。在后现代主义时代之前，只有源自古老的神圣仪式、战争的胜利，或者通过共同的歌曲、舞蹈或艺术对意义文化的直接体验，才会引发任何人的狂欢。现在，我们被一种疯狂的狂喜所驱动，因为我们有了价格标签，而我们一生的努力通过标签的存在这一事实得到了验证。这是每位创业者内心熊熊的野心：有一天创造出一个社会认为值得贴上价格标签的组织。\n\
  \n在历史的黄昏，在自由民主资本主义那疲惫的死胡同里，至少在西方文明的边缘，这是我们剩下的唯一真实价值。为发富的聪明人鼓掌吧，希望你也是他们之一。\n\n在一个企业化文化意义彻底破产的世界里，这种世界的居民渴求诸如“火人节”这样具有人工意义的人为仪式，难道不奇怪吗？我们应该对他们固守某些身份——那些似乎是从\
  \ `Facebook` 广告投放系统中提取出来的消费模式集群（如“文青千禧一代”、“都市妈妈”、“富裕的郊区人士”）感到惊讶吗？\n\n奥特塔·加盖特曾写道：“人类扮演悲剧，是因为他们不相信文明世界中正在上演的悲剧是真实的。”对于那些感受到真实悲剧召唤的人来说，那些诗人曾在在诗句中捕捉的悲剧、父亲曾传授给儿子的悲剧，IPO\
  \ 这种戏码注定显得苍白无力。那个欢呼的广场上的人群不可避免的后代，是否有一天会和他们的祖先聚在一起，也许在壁炉前，问道：“嘿，爷爷，参加 `Facebook`\
  \ IPO 是什么感觉？”就像前几代询问诺曼迪登陆或西部边疆的拓荒一样？\n\n我怀疑。即便作为这场虚假弥撒的参与者，当暂时的快感很快让位于疲劳和隐隐宿醉中时，我也在想，当文化不再能产生这种奇观时，会发生什么。\n\
  \n\n\n\n这种无差异阈值的细微波动在宏观尺度上微不足道。真正的转变发生在财富阶梯的第一个真正台阶上。“**老子钱**”（Fuck-you money）就像是你个人创业中达到了盈亏平衡点，意味着你不再受制于外力。试着想象一下那个转折点吧。\n\
  \n在公司上市的第一天，我坐在那里看着股价时，并没有完全意识到这一切，但我很快就意识到了。我不仅会看到自己的财富在迅速变化（即使不是完全以那种“老子钱”的方式），周围每个人的财富也会随之改变。从那些略显荒诞的深夜狂欢（我记得其中还有一顿双份牛排晚餐和几笔四位数的餐厅账单），到停车场里迅速积累的保时捷、雪罗维特，甚至偶尔出现的几辆法拉利，尽管公司内部大声提倡严谨纪律，但事情确实带上了某种颓废的气息。\n\
  \n那都是以后的事了。那时，我似乎终于要过上维持水平以上的生活，银行里的钱也不再仅仅是小钱。我迅速切换到 `Mac` 上的倒计时器，那是我加入公司时设置的针对第一年归属的倒计时。7\
  \ 月 15 日，我就能拿到总额的分之一，大约在两个月后。这时间简直等不及了。\n\n噢，还有我们前一天晚上酿造的啤酒？我把它命名为“IPO IPA”。就像 IPO\
  \ 本身一样，它有点失望，远不如扎克克的“湿桌子 IPA”。两周后，我们还是把那桶喝光了，但感觉更多是出于责任，而非其他。不知为何，这种带着良好友谊精神以及淋湿\
  \ CEO 办公桌的幽默感，产出了比那场紧张的 IPO 集团庆典更好的产品。\n\n## 首次公开募股：重新评估 (#nav.xhtml_rch41)\n\n\
  价格和其他其他一切一样，沿着阻力最小的路线移动。它们会做最容易的事。\n\n—埃德·莱费尔（Edwin Lefèvre），《股票交易员回忆》\n\n### 2012\
  \ 年 5 月 18 日\n\n关于 IPO 的报道，即使来自所谓的精明科技和财经媒体，也提醒了人们那条残酷的人生教训：有人为生是写关于钱的新闻标题，而另一些人则是挣钱的人。《财富杂志》宣布了《Facebook\
  \ IPO 的失误》；《富布斯》咆哮着《马克·扎克伯格的 Facebook 大失误》；《创投酷》吟诵着《Facebook 开市日表现失望》，这是一家来自硅谷内部的小报，本该表现更理智的。\n\
  \n尽管有这样的标题，Facebook 的 IPO 并非惨败；它毫无疑问是金融史上最成功的科技 IPO。如果你不理解为什么，那么你不懂 IPO 是如何运作，你应该继续读下去。\n\
  \n### 到底什么是 IPO？\n\n一家公司决定想在公开市场“浮动”部分股权，允许员工和创始人出售私人股份以支付他们多年来的报酬，并出售公司库中的股票以让银行账户有进笔钱。大型投资银行（例如我的前雇主\
  \ `Goldman Sachs`）组成一个所谓的“承销团”（“黑手党”可能是更准确的词），他们提议实际上从 Facebook 手处购买这些股票，然后将其卖入资本市场，通常是通过他们的销售团队推给富有的客户或机构投资者。该承销团要么保证价格（“无责任承诺”），要么承诺尽可能获得最好的价格（“尽力而为”）。\n\
  \n在前一种情况下，银行承担真实的执行风险，如果不能在开市日制造出股票的“飙升”，就会亏损。为了降低风险，银行说服发行公司预期一个较低的价格，同时通过对市场最深处的钱袋进行狂热的销售推销，抬高市场能够承受的真实价格。因此，认为股票在开市日的上涨是因为人们的呼喊和意料之外的兴趣绝对是愚蠢的。就像《卡萨罗力卡》中的雷诺上尉一样，华尔街银行家们震惊——*太震惊了！*——在他们刚刚操纵的市场中，竟然会有如此巨大且正向的价格偏差。\n\
  \n为了证明大多数 IPO 中运作的完全欺骗性，让我们问自己一个问题：在金融世界中是否存在其他情况下，银行负责从一开始（*ab initio*）设定公平的市场价格，并且这种做法通常是有效的？\n\
  \n事实上，有的。这在每天早上成千上万股票在公开交易所开始交易时都会发生。`IBM` 当天第一个价格是如何设定的？在现场交易员时代，负责交易该股票的“专家”会权衡买方和卖方的意愿量，并计算出一个合理的“中间价”。然后他们在市场开市时，以略低于该价格买入，略高于该价格卖出，通过他们在每笔交易中赚取的狭窄买卖差价来提供他们获得报酬的流动性。现代电子交易所用算法取代了人工流程，但本质上是一样的。开市时，交易从一夜投机和虚构价格波动的杂烩中平滑地启动到真实的交易和股份易手。在美国交易所，多久能看到开市时\
  \ 20% 到 30% 的价格波动？基本上从未，除非是在市场崩盘或 9/11  {之类的灾难性事件之后。\n\n鉴于华尔街银行在金钱和声誉面临风险时（通常情况下）运作有序市场方面的高精湛技艺，他们突然发现无法设计一个开市价不飙升\
  \ 20% 的 IPO，难道不很奇怪吗？即使假设存在无处不在的估计误差，他们总能发现无法设计一个开市价不飙升 20% 的 IPO，这难道也不令人震惊吗？\n\n\
  Facebook 撕碎了通常的剧本。\n\n股票以 `42` 开市，以 `38.37` 收市，这让财经媒体陷入了一片尖叫的抱怨中，并完美地坑了那些银行家。\n\n\
  谈判远、远高于我的薪资水平，所以我不知道 Facebook 当时的首席财务官 David Ebersman 是如何强迫或诱导银行家提供一个高且公平的价格，并在本质上在这个过程中坑了他们自己的。但他以及\
  \ Facebook 这一边的任何其他人都应该因此获得诺贝尔经济学奖。他们甚至在费用上上挤压了银行家。噢，是的：除了通过公开的价格操纵收割你们之外，银行家还赚取一笔固定费用。Facebook\
  \ 的承销团接受了仅 1% 的适度费用，而不是通常有时高达 7% 的更典型费用。\n\n## 闪电少年 (#nav.xhtml_r42)\n\n120 毫秒大约是人类眨眼时间的三之一。\n\
  \n\n\n\n这就是我们必须应对的限制。当交易所发出请求时，`FBX` 合作伙伴返回竞价和广告的时间就只有这么多。而这个拍卖过程每天会发生五百亿次，大约每秒发生五十万次。如果超过这个时间，就会威胁到\
  \ Facebook 页面的加载速度。如果你在发布后的扎克（Zuck）演示现场，发现 `FBX` 广告的加载比页面其他部分慢了那么一点点——或者更糟，导致整个页面加载缓慢——那么你就已经坐上了通往\
  \ Dropbox 的快车，离开时别让 Facebook 的大门撞到你的屁股就行了。\n\n这 120 毫秒包含了网络延迟，这意味着比特流从 Facebook\
  \ 管道流向外部互联网，到达 `FBX` 合作伙伴机器所在地，并返回所花费的时间。\n\n这构成了一个严峻且看似不可逾越的技术挑战。当时 Facebook 通过位于北卡罗来纳州、加利尼亚州和俄勒冈州的数据中心为全球提供服务，欧洲的营销人员和他们海量的数据必须与美国的机器通信，而且通常跨越两个海岸。为了理解其可行性，我计算了北卡罗来纳州与阿姆斯特丹（许多欧洲技术托管在当地的服务器集群）之间的球面距离，看看在理论上是否可能响应广告拍卖请求。光速极快（每秒\
  \ 299,792,458 米），但还不够快。单程需要 23 毫秒，而且这还是假设从 Facebook 机器到广告商之间在大圆线上运行着无损光纤，这是对现实极极其荒谬的简化。从东岸机器进行距离测试（Ping）显示，更真实的单程旅行时间为\
  \ 60 毫秒。这种相对论是无法超越的，在我公司工作期间，我们在欧洲一直在亏钱，因为许多请求直接超时了，导致 `FBX` 无法参与拍卖。\n\n如果你读过迈克尔·刘易斯（Michael\
  \ Lewis）的《闪电》（*Flash Boys*），书中详细描述了交易所发生的超快速高频交易，你会记得他在开头提到一个对冲基金，该基金从纽约到芝加哥之间铺设了一根光纤电缆。其目标是在这两个金融中心之间的常规互联网路径上缩短几毫秒，从而比其他高频交易公司获得毫秒级的优势。据报道，成本高达\
  \ 3 亿美元，这说明了其中的利益关系。\n\n你会发现，我将程序化媒体与华尔街的类比不仅仅是历史性的；它是一个反映业务和技术现实的精确比较。`FBX` 是媒体界的“闪电侠”，以光速交易人类注意量子。每当你加载\
  \ Facebook 新页面时（更不用说大多数网页），光信号跨越全球到达数百台等待机器，它们就像皇家号手队列一样，宣告你的即将到来。\n\n那么这些跨越全球的竞价请求会如何呢？假设它们没有淹在大西洋海底电缆中。在每天数十亿请求中监听你出现的人被称为“需求方平台”（`DSPs`），他们是这个实时媒体世界的股票经纪人，受雇于想要向你出售产品的广告商或代理机构。`DSP`\
  \ 快速解析竞价请求，并查询其关于你的所有已知信息：你浏览过的网站、遗弃的购物车、你获取过但从未采取行动机票报价。所有信息都在那里，并通过针对该目的高度优化的先进数据库在毫秒内返回。这些数据中的大部分甚至不是相关广告商直接观察到的。公司已经达成交易，获得了在具有商业价值的网站上租用网页小部分的权利，足以触及你的浏览器查看你是是谁。这些数据经纪人将你放入某些定位分组中——例如，“旅游意向者”（即即将要在酒店上花钱的人），然后将其作为“第三方数据”转卖。由于每个人通过你的\
  \ Web 浏览器都有一个伪名，而这个浏览器是 Facebook、Google 以及其他人广为人知的，因此这些数据可以被用来定位你。这这一切都是匿名的（在 Facebook\
  \ 数据从不泄露的意义上），但它包含了你在网上做的一切。这一切都是进入广告肉碎机的定位香肠原料的更多调料，并且每秒被交易数百万次（无论你是否知道或喜欢）。\n\n\
  来自 Facebook Exchange 的实时、毫秒级竞价，随后进入了 Facebook 代表非 `FBX` 广告商举行的常规广告拍卖。此时，Facebook\
  \ 凭借它所有引以为傲的数据，仅仅变成了拍卖中的又一个 `DSP`，只是又一个经营业务的经纪人。区别在于，Facebook 广告系统的其他拥有 Facebook\
  \ 的那套数据，而 `FBX` 广告商（无论拍卖中有多少个）拥有他们来自非 Facebook 世界的自有数据。由于 Facebook 广告系统和外部世界现在都通过\
  \ `FBX` 接收广告请求，我们将外部广告商置于与 Facebook 平等的地位，让强者（或高出价者）获胜。\n\n我将其视为一种特性。Facebook 将其视为一个漏洞。\n\
  \n这是 `FBX` 不可原谅的罪：它允许外部人员能够与 Facebook 广告机制同步优化和定位广告，像 Facebook 一样选择定位对象、在哪个页面以及以何种频率进行。这种外部方与\
  \ Facebook 之间的平等是管理层无法忍受的。尽管吹嘘 Facebook 的数据有多么，但管理层不愿与外部数据硬碰，因为他们怀疑自己会输。事实也大多时候如此：`FBX`\
  \ 广告商的竞价通常高于系统其他部分的竞价。当然，他们的竞价更高：`FBX` 知道你刚刚看中了一个 Spade 手包，或者上周买过尿布；而 Facebook 反而只知道你去年点过金·瑞的粉丝页。\n\
  \n\n\n回想 2008 年高盛信贷危机的深远影响。高盛本可以推动那个显而易见的技术步骤，即在交易所交易信贷衍生品，这将带来更大的成交和透明度，并减轻监管压力。但高盛会放弃由它（唯有它）所看到的交易流所形成的信息不对称优势吗？它会放弃在与紧密的经纪人网络一起，几乎随意地对信用风险进行定价的能力，从而有效地操纵市场以自其利，而不是提供一个开放的市场吗？\n\
  \n当然不。Facebook 在关键时刻也绝不会这样做。\n\n不过，在 6 月 15 日，我并没有考虑这些。因为那天是 `FBX` 首次成功竞价落地的日子，对手是\
  \ `FBX` 较好的伙伴公司之一 `TellApart`。我们成功了——我们用大约五周的工程工作，为 Facebook 构建了一个广告交易所和一个并行的广告系统，总共花费了两个月的产品构思。`FBX`\
  \ 桌旁的气氛非常高。猫头鹰 Tracker（Trackie the Owl）终于能吃到它梦以求的老鼠了。当然，初始交易量很小，而未来六个月我们所有人关注的将是如何尽快增加竞价量和资金，并让\
  \ `FBX` 成为 Facebook 变现愿景的核心。但最终，这场竞赛变成了仅仅让 `FBX` 变得足够大，大到 Facebook 那帮疯狂的管理层也无法杀掉它。`FBX`\
  \ 从出生那一刻起就在为生存而战。\n\n# 全裸的 Facebook\n\n 猛牛终将要背负枷锁。\n\n—威廉·莎士，《仲夏夜之梦》\n\n### 2012\
  \ 年 10 月 9 日\n\n对于 Facebook 来说，2012 年底是一个值得回味的时刻。处于初创公司婴儿期与大公司成年期之间的，Facebook 在\
  \ IPO 这一年闪烁着短暂的青春期光芒，永不再复。\n\n那种感觉如何？\n\n<beep!>\n\n微软日历，那个残酷的监工，提醒我有一场会议。\n\n自从\
  \ 6 月份与有限的合作伙伴推出 `FBX` 以来，我们开始尽可能多地招纳。每一个新增的合作伙伴意味着增加一组广告商，这为我提供了更多的资金、预算和内部筹码，以便我利用\
  \ `FBX` 有利。\n\n与潜在的 `FBX` 合作伙伴的每次会议，基本上都变成了我与他们的产品团队见面，并规定他们他妈的要做什么——而且混蛋们，你们最好告诉我我想听的什么，否则就得滚出\
  \ Facebook 岛，反正你们压根就没被邀请进来。这种方法在某种程度上起效了，特别是在早期，因为每个外部合作伙伴都在争夺进入第一波或第二波阵队的声望。\n\n\
  ### 亚马逊除外。\n\n在那里，那种一直脆弱但又具有战略意义的关系凌驾了我对 `FBX` 的产品经理“领主裁判权”（droit du seigneur）。那就是手机提醒我要参加的那场会议，我由于沮丧地叹息，放下手头事情去过去。\n\
  \n借用帕尔斯顿勋爵关于大国的话，像 Facebook 这样的公司没有永恒的盟友也没有永久的敌人，他们只有永恒且持久的利益。尽管 Facebook 运行了各种“合作伙伴计划”，但它并没有真正的伙伴公司，更不用说真正的朋友了。它认为世界充满了要么构成生存威胁的可怕敌人（这种敌人只有几个），要么是提供便利临时联盟的公司。Facebook\
  \ 的恩宠总是有条件的，而一家把恩宠视为理所当然的公司确实很愚蠢。\n\n亚马逊显然属于前者。\n\n杰夫·贝索斯是一个疯狂的领导者，在他的世界愿景实现之前不择手段，他并曾激励、劝说或恐吓一支军队来实现这一愿景。扎克看向西雅图的贝索斯，或者山景城的\
  \ Google 的拉里·普林奇，或者（过去）库比蒂的 Apple 的史蒂夫·乔布斯，他看到的不仅仅是一家科技公司和一个首席执行官。他在那些男人身上看到了自己的影子，这令他恐惧。科技或媒体世界的其他玩家可以被算计、被技术击败，或被收编或收买，但这些顶级公司不行。面对亚马逊或\
  \ Google，Facebook 的军队必须严密结成方阵，并可能要与一个对等的敌人战斗，对方的 CEO 和扎克一样都是自杀式战士（*迦太必须被毁！*）。\n\n\
  （Twitter 甚至没有进入这个世界观，仅仅是一个分心项。扎克曾著名地嘲讽这家公司是“辆开进金矿的小丑车”，那可能也是 Facebook 内部最后一次考虑过它。）\n\
  \n因此，与这些大国公司进行的任何业务开发过程总是一场类似于军控条约的艰苦谈判：大量的内部场面和仪式；在长长的、拥挤的会议桌上进行的没完没了的会议；以及很少的增量进展。当合同终于产出时，律师们会来回反复修改，上面布满了拒绝某项条款的红线。\n\
  \n这完全理有如此。这些公司无疑是聪明的，考虑问题的跨度是十年而非大多数科技公司的（最多）几年，并且有能力在不顾 Facebook 意愿的情况下推进自己的议程。噢，虽然我们都假装是朋友，但根本没人愚蠢到相信这一点。\n\
  \n与亚马逊的会议进展顺利，至少在工程和产品层面是如此。涉及的具体团队被称为 `A9`，它是亚马逊的子公司，全权负责那个巨兽的搜索和广告技术。有效来说，它是构建亚马逊\
  \ `DSP` 的私有内部技术——那家让亚马逊可以在互联网任何地方购买广告并将你带回亚马逊购物篮的经纪商。这家公司在广告上花费了数亿美元，它可以极大地为我们开启\
  \ `FBX` 收入。自然地，`A9` 将成为开发任何 `FBX` 技术的团队，因为它已经在 Google 的交易所上做过了。\n\n亚马逊的工程师非常敏锐、博学，对程序化广告购买世界了如指掌。他们瞬间就理解了，我期待着让他们在我们新生的平台上构建他们复杂的工具，并让\
  \ Facebook 与 Google 争夺他们无尽的广告预算。\n\n然后业务部门的人介入了。\n\n`A9` 由马特·比特斯（Matt Battles）管理，他在整个三个小时的会议（以及随后的会议）中显露出自己是一个类似斯文加利（Svengali）的人物，掌握着我们提议合作中所有重要的技术和产品细节，并采取了一种冷漠且精于算的怀疑态度。他对于提议的计算表现出刻意的回避，仿佛是为了强调达成这笔交易对\
  \ Facebook 来说对亚马逊更有意义（事实可能如此）。\n\n我们 Facebook 的业务开发人员以及亚马逊的合作伙伴经理也反映了这种玩扑克的姿态，每个人采取了各自审视和怀疑的公司立场。这两个巨头警惕地互相圈视，谁也不愿意放下隐藏的武器去握手。\n\
  \n\n\n\n就这样，公司之间的僵局持续了……几个月。亚马逊最终会加入 `FBX`，其广告支出将让那个永无止境的 `FBX` 仪表板受益，但那是在许多会议和合同谈判之后的事情。\n\
  \n至于另一个 Facebook 的强力竞争对手——Google 呢？\n\n关于 `Google Plus` 的最初传闻不仅令人担忧，而且人们越来越明确，他们进军社交媒体并非为了击败某个讨厌人的新秀而付出的半心之力。正如过去一年通过媒体或\
  \ Google 员工缓慢泄露的那样，Google 所有的内部产品团队都在向 `Google Plus` 倾斜。即使是当时和现在 Web 上访问最频繁的 `Search`，也被卷入了这场战斗，并据称将拥有社交功能。`Search`\
  \ 结果将根据你通过 `Google Plus` 连接的关系而异，你分享的任何内容——照片、帖子、甚至与 `Friends` 的聊天记录——都将作为 Google\
  \ 日益强大且神秘的搜索算法的一部分。\n\n这是一个令人震惊的消息，对 Google 员工来说更是如此。`Search` 是公司的招牌产品，是神圣不可，是取代图书馆和百科全书的人类知识的一行神谕。\n\
  \n从所有角度来看（Google 的信息安全显然没有 Facebook 那么），这在内部引起了相当大的动荡。2012 年 1 月，在一次公司范围的问会上，Google\
  \ 创始人 `Larry Page` 强有力地应对这一新方向，平息了内部异议，并向 Google 员工下达了通牒。\n\n“这就是我们要走的道路——一个跨越所有的单一、统一且‘美丽’的产品。如果你得不到这些，那你可能应该去别的地方工作。”\n\
  \n随着挑战的发出，Google 产品很快通过一个独特的指标进行排名——它们对 Google 的社交愿景贡献了多少？——并被相应地整合或丢弃。\n\n作为围绕这一新产品的新芽阶段媒体诱惑的一部分，Google\
  \ 发布了惊人的使用数据。到 2012 年 9 月，Google 宣布该服务拥有 4 亿注册用户和 1 亿活跃用户。`Facebook` 甚至还没有达到 10\
  \ 亿用户，而且公司花了四年时间才达到 1 亿用户这一里程碑，而 Google 只用了一年就做到了。这在 `Facebook` 内部引起了近乎恐慌的情绪，但战场上的现实与\
  \ Google 的描述大不相同。\n\n这场竞争让这家搜索巨头如此措手不及，他们沉溺于对 `Facebook` 带来的威胁的所未有的生存焦虑中，以至于放弃了对数据等工程基石的常有的冷静客观，开始伪造使用数据来给外部世界留下印象（无疑也是为了恐吓\
  \ `Facebook`）。\n\n这是经典的新产品骗局，是不道德创业者的“假装成功直到真的成真”（fake it till you make it），旨在通过投射当下（想象中）成功的形象，同时讨好虚心和未来（真实）成功的机会。\n\
  \n这些数字最初被严肃对待了——毕竟，认为 Google 能迅速提高使用量并不荒谬——但过了一段时间，即使是 `FBX` 内部那些多疑的内部人士（更不用说外界了）也意识到\
  \ Google 在注水数据，就好像 `Enron` 会计做营收报告那样。使用量在某种程度上取决于观察者的观点，而 Google 将任何在日常 Google 体验中哪怕点击过一次\
  \ `Google Plus` 按钮的人都视为“用户”。考虑到 `Google Plus` 按钮像阴暗山坡上的蘑菇一样一夜之间在 Google 用户体验中到处蔓延，只要\
  \ Google 用户检查一下电子邮件或上传一张私人照片，就可以声称拥有了“使用量”。现实是，`Google Plus` 用户很少发布内容或与发布的内容互动，他们绝不会反复回来，就像药物实验中著名的实验鼠为了获得另一滴可卡因水而不断按杆子（就像他们在\
  \ `Facebook` 上做的那样）。\n\n为了进一步煽动斗志（以及内部恶作剧），`Google Plus` 的灵魂人物成为了 Facebook 式蔑视的完美目标。`Vic\
  \ Gundotra` 曾是 `Microsoft` 高管，在微软那里险恶的企业场阶梯上攀爬后跳槽 Google。是他向 `Larry Page` 耳边低语了一连串恐惧的言语，是他批准了该项目，也是他领导了这项紧迫且自上而下的努力（这在\
  \ Google 内部是不寻常的），以便在雄心勃勃的一百内交付产品。\n\n这个人在无数媒体采访和 Google 赞助的活动中大声为 `Google Plus`\
  \ 背书时，散发出一种令人反感的自得自乐。对于 Facebook 员工来说，最受侮辱的是他在任何公开声明中都刻意忽略提及这个社交媒体巨头，仿佛他现在在 Google\
  \ 高高云云的存在意义根本不存在一样。就像某些奥威尔式的文案作家一样，通过工程语言和感知来适应一个不存在的虚构现实，Google 绝不会在任何公开声明中明确提到\
  \ Facebook 这只“房间里的大象”。“网络是为了社交，”`Gundotra` 吟诵道。“圈是为了对的人准备，”他继续说道，指的是 `Google Circles`，这是一种无耻地从\
  \ Facebook 长期被忽视的 `Lists` 功能复制来的社交联系组织方式。\n\n在 `Facebook` 内部，`Vic` 扮演了奥威尔《1984 年》中\
  \ `Emmanuel Goldstein` 的角色，每当有人发布他那些支持 Google 的言论链接时，他在 Facebook 内部群组中遭受了许多嘲讽和讥笑，这就像是一场社交媒介化的“两分钟仇恨”。这已经超越了单纯的商业竞争，变成了许多\
  \ Facebook 员工的个人斗争，他们将自己的身份与公司联系在一起，`Facebook` 是他们自己的表达（还是反过来？）。\n\n“Gokul，我只有三个人来创建一个整个平台和业务，并在几个月内产生数千万美元的收入。”^(*)\n\
  \n这一场景是我与我的正式经理 `Gokul` 多多每周一次一对面面的最后时刻，尽管在那些混乱的日子里，他的管理很大程度上是象征性的.^(†)\n\n“三个人，Antonio！这就像电影《300\
  \ 个》。你是斯巴特人，哥们。斯巴特人！你可以的。”\n\n“Gokul，你知道斯巴特人在温泉比尔战斯战役中输了，对吧？”\n\n\n\n我回到 FBX 组，无法为团队提供任何资源方面的额外支持。尽管\
  \ FBX 有着良好的开端，且公众和媒体对该产品表现出浓厚兴趣，但 Facebook 并不愿意投入除几名工程师和少数兼职支持人员以外的任何资源。这似乎有些不协调，但符合当时\
  \ Facebook 的时代精神。尽管 FBX 初始前景巨大，且我的愿景是将其定位为 Facebook 未来广告投放产品的核心，但它当时仍被视为一种仓促的营收权宜之计，旨在产生公司为了完成\
  \ IPO 后财务数据所需的现金。在为期一年多的游说中，管理层没有一个比我高一级的人真正理解、更不用说积极支持当时正在接管整个广告世界的实时程序化广告购买技术了。在它能`right\
  \ now!` 产生收入的范围内，它只得到了 Gokul 和 Rabkin 的冷淡支持，以及销售部门的容忍——无论如何，销售部门是根据产品部门的信号行动。我天真的假设是，只要我能把\
  \ FBX 变成一家十亿美元的企业，就能说服那些固执的（或者说是故意的无知）的 Facebook 管理层意识到这一被忽视的机遇，舆论也会随之转变。\n\n这这显然是疯狂的。金钱确实很重要，但至少在\
  \ Facebook 内部，只有当说的话属于更大、更被接受的叙事的一部分时，它才会说话。\n\n正如在 AdGrok 期间的诉讼一样，我保护工程师们免受这些政治纷扰，假装我们梦出的所有奇妙功能（其中许多到此时已经实现，并产生了一系列专利）终有一天见到光日是理所当然的。\n\
  \n但事实上，是我们对抗全世界，以及对抗 Facebook 管理层。\n\n### 成为某人，还是做某事，我会选择哪一个？\n\n人偶尔会到达人生的十字路口。\n\
  \n一条路通向“做某事”，对他的组织和世界产生影响。忠于自己的价值观和愿景，与那些帮助建立这一愿景的人并肩作战。当所有人都怀疑他时，他必须信任自己，而作为回报，他将承受来自职业圈的蔑视。他不会受到上级的青睐，也不会赢得那些保守主义同僚的礼貌赞扬。但也许，仅仅也许，他有机会是正确的，并创造出持久的价值，这种价值将超越任何组织（即使是所谓的颠覆性组织）中固有的平庸共识。\n\
  \n另一条路通向“成为某人”。他将获得优厚的产品，获得组织对那些列入定义其世界道德价值的典型美德清单的“组织人”所给予廉价赞誉。他将获得同僚的掌声，尽管令人惊讶的是，这种官方赞扬的流量极少能转化为任何人记得的实际产品，更不用说对组织的整体事业有所推动了。\n\
  \n我确实有选择。我不能说我没有。\n\n我有退路可走，本可以离开 FBX。\n\n我所要做的只是闭嘴、低头做事，对 FBX 之后被交给我的任何烂产品都付衍了事，并按照\
  \ Facebook 的剧本学习如何成为一个合格的产品经理。如果其中某一个产品“成功”了，我甚至可能重振我的职业生涯。在迅速僵化的 Facebook 文化中，人只要顺波大流就能过得很好。\n\
  \n此外，这关乎切利益。\n\n考虑一下股份的数量，以及在本文写作时（即 2015 年 12 月），Facebook 的价值几乎是我与 AdGrok 达成交易时的四倍。我有两个孩子，他们的母亲通过朝九晚五的企业工作为他们提供生活，尽管仅仅是勉强维持。她在伦敦担任交易员的黄金时代早已过去，现在的薪水只是公司机器里一个标准的\
  \ MBA 水平。根据加州的州的抚养准则，我每月都会贡献一笔现金，但将是我尚未归属的 Facebook 股票将支付私立高中和斯坦福大学的费用，这样 Zoë 和\
  \ Noah 就不必像我当年那样，从经济舱通过“后门”溜进这个国家的精英阶层了。\n\n除非我再次从帽子里变出一个初创公司，否则任何意外之财只能来自我在疯狂追逐\
  \ FBX 时如此轻率冒险的 Facebook 股票。但自尊驱动，荣誉迫使，而执着强化了被节制和判断可能削弱的意志。面对一系列反对者，我的反应一如既往：加倍投入，坚持到底。\n\
  \n就像 Boyd 上军一样，我会选择“做某事”，而不是“成为某人”，并将自己系在 FBX 之船的桅杆上，无论它将我带向何方，无论未来付出什么代价。\n\n###\
  \ 2013 年 1 月 16 日\n\n这真是一场耻辱。\n\nOmnicom 是全球最大的广告公司之一，其高级领导层正坐在 17 号大楼长会议桌的另一侧。\n\
  \n我这一边坐着广告部门的高级领导层（他们只在面对这种重量级客人时集体出现），以及参与了新颖的 FBX 和自定义受众（Custom Audiences）业务（这些业务引起了大量外部关注）的产品经理和工程师（Mathew\
  \ Varghese、我，以及那个格格不入的工程师）。\n\n有四家广告公司，所谓的控股公司，它们是统治媒体世界的数百家小型公司的伞形组织。它们的总收入达数百亿，控制的媒体总支出是这个数字的许多倍。这些是广告界的大脑——如果这个世界还拥有任何大脑的话——而且他们非常精明且对谎言免疫。坐在桌首位的是\
  \ Josh Jacobs，他是 Omnicom 的“交易台”Accuen 的负责人。没错，随着程序化媒体的兴起及其类交易所的实时市场的出现，即使是那些老牌广告公司也在建立类似于华尔街的业务部门。\n\
  \n\n\n在过去的六个月里，Facebook 内部就 `CA` 与 `FBX` 的方向展开了一场激烈的辩论。我之前提到的这场辩论的核心可以归结为：当 Facebook\
  \ 涉外部数据领域——桌面浏览、移动应用安装、商店线下购买等时，它应该建立一个开放系统，允许广告主将数据带入 Facebook，同时保护 Facebook 的用户隐私并防止数据泄露到外部世界？还是像过去那样，试图尽可能地接管广告管理栈，即使这意味着要推出低劣的产品，并排挤掉最终广告主以外的所有公司？\n\
  \n这对营收的影响（这可以说是是辩论中最重要的问题）将是极其严重的。\n\nBoland 所支持的完全“封闭”的栈涉及 `Custom Audiences`（自定义受众）产品的扩展版，需要多年才能建成。此外，说服广告主使用它也需要多年时间，因为他们通常倾向于使用独立的广告投放和交付工具，而不依赖于像\
  \ Facebook 这样的单一发布商。而且，单是惯性就会让他们不愿使用，因为当时正在接管在线媒体的实时技术（`FBX` 就是这种体现）正迅速成为精细广告投放的主导模式。\n\
  \nOmnicom 及其财力雄厚的广告主想要的是他们所谓的“数据可移植性”；即在任何地方使用他们宝贵的第一方数据或高价获取的第三方数据的能力，无论是在 Facebook\
  \ 上还是在《纽约时报》上。通过构建一个某个摇摇欲坠的技术大厦，然后通过该技术限制对 Facebook 库存的访问，Facebook 实际上是在维持它多年经营的“围墙花园”。这会封死我们最初通过\
  \ `Facebook Exchange` 在墙上开出的狭口，而正是这个狭口创造了导致这次会议的兴奋点。\n\nFacebook 要想说服全球的 Omnicom\
  \ 公司——并泛而言，每一个精尖的广告主——采用 Boland 的封闭栈方向，唯一的方法就是通过使用 Facebook 的身份和跨设备数据产生多得多的价值，以让广告主忍受\
  \ Facebook 那些难用技术的苦果。由于这种独特的 Facebook 身份的价值仍不完全为人知，这代表了一种风险。\n\n另一种方案是 `FBX` 团队（我指的是我，几乎只有我）正在大声倡导的“开放”栈。通过构建与不断增长的标准一致的技术，我们将使广告主的采用变得近乎瞬时。`FBX`\
  \ 团队已经秘密地构建（但尚未发布）了能够跨浏览器和移动设备安全暴露 Facebook 身份的基础技术。这仅仅是开启的问题，我几个月来一直督促 Facebook\
  \ 管理层这么做。\n\n引用我们那个可能过度使用的金融类比，想象一下 Facebook 是一家像富国达（Fidelity）这样的大型金融服务公司。Facebook\
  \ 在“封闭”计划中提议的是：Facebook 不仅仅想提供其独特的基金、股票和债券投资；它还想运行交易这些投资的交易所、在交易所进行买卖的经纪人、以及用于登录和交易的股票交易工具，以及投资平台周围的整个金融系统——即银行、支票账户、信用卡等等。如果你想购买\
  \ Facebook 投资基金，从你的借记卡到你的 `401(k)` 退休账户，一切都将被标记为“Facebook”，并且仅与其他带有 Facebook 标记的产品一起工作。Facebook\
  \ 将作为一个自己的金融世界存在，与你来自任何富盛（Schwab）或美国银行的世界完全隔绝。\n\n如果你想在这个由 Facebook 拥有并运营的金融帝国中购买\
  \ Facebook 基金以外的东西怎么办？Facebook 最终也会允许你这样做，但只能通过它的交易所和购买工具。所以你可以买几股 Google 或通用汽车的股票，但你仍然需要登录\
  \ Facebook 购买平台。\n\n### 这行得通吗？\n\n嗯，也许吧。如果 Facebook 的投资产品性能是如此独特，而且如果你购买外部股票和债券的能力实际上通过\
  \ Facebook 平台实际上得到了*放大*（而不是通过其他所有购买这些大宗商品的方法），那么，是的，人们就会忍受将整个财务生活搬到 Facebook 世界的麻烦。更不用说，他们还会忍受这种移动所带来的真实锁定风险。（一旦你所有的财务细节和数据都在\
  \ Facebook 内部，你脱离这头巨兽并将业务转移到他处的能力将受到严重限制。）\n\n在技术方面，这个决定也有重大影响。继续我们的类比，Facebook\
  \ 在技术上类似于内布拉斯加州奥马哈的某个当地信用合作社，尽管其存款余额可以与美国银行媲美。如果它想与整个金融世界竞争，它必须提供人类所知的每种银行服务，即使有\
  \ Facebook 那非人类的工程速度，这也需要时间。\n\n从营收来看，这意味着整个身份愿景的货币价值在多年后才能实现。考虑到这种结构远比其部分之和要得多，只有当这一切都存在时，它才具有真实价值。如果你只能在\
  \ Facebook 上使用其出色的、以人为中心的精准投放，而不能在互联网的其他地方使用，那么 `Custom Audiences` 有什么价值？如果 Facebook\
  \ 有一个广告服务器（我们稍后会讨论这意味着什么）并且它只在 Facebook 上运行，谁会在意呢？广告主仍然需要旧的广告服务器在 Google 控制的网页属性和任何其他地方显示广告。这种在\
  \ Facebook 蓝调中、一切都在 Facebook 上运行的闪亮愿景将需要多年才能实现。\n\n相比之下，开放计划的价值将瞬时实现。如果 `FBX` 能够访问我们在\
  \ `Custom Audiences` 方面构建的身份匹配，更不用说移动端的广告库存，那么这个交易所就可以作为范围内在线身份的中央结算中心。我们构思的所有关于在线和线下身份的内容，由于\
  \ `FBX` 的开放和标准化特性，可以在几周内实现。\n\n\n\n\n虽然当时并没有和 Omnicom 一起在那个房间里，但一股新的力量此时正在广告团队中显现，这种力量将改变\
  \ Facebook 广告的一切。在我介绍这位具有变革性的人物之前，有一点关于 Facebook 文化至关重要，我们到为止仅触及了这一点，但你需要理解：\n\n\
  ### Facebook 的拿破仑帝国\n\nFacebook 是一个在基调和风格上都是拿破仑式的帝国。就像任何宫廷政治的巢穴一样，一个人与那个处于盛会中心、皇帝的距离远近，直接取决于他的制度地位。只要进入了\
  \ Facebook 这“少年君主”（Boy Dynast）的轨道，你的产品就能通过含蓄的皇室赐福而获得制度性的动力：工程师会被分配给你，其他产品会被取消或被挤走，最重要的是，你成为了帝国宫廷星空中的一颗恒星。即使你的产品失败了（很多产品都是\
  \ Facebook 选子核心圈的死产物或奇形怪状的后代），你依然能活到发布下一个产品并影响另一天，光芒未减，声誉无损。扎克的宫廷中有几位王子：布莱克·罗斯（Blake\
  \ Ross）、贾斯汀·沙弗勒（Justin Shaffer）、萨姆·莱辛（Sam Lessin），以及更多像我这样隐居在广告荒野的普通人只能在远处观望的人。\n\
  \n幸运的是，Facebook 本身充当了自己宫廷内斗的社交版：员工之间近乎狂热的 Facebook 使用率意味着，每一位名媛与扎克的首次亮相，或者在 In-N-Out\
  \ 汉堡的每一场王室宴会，对所有人皆可见。就像一个坐在吧凳上通过浏览小报寻找皇室新闻的英国人一样，Facebook 的平民会在 Facebook 贵族中尽可能关注或关注他们，并紧贴玻璃，目睹这场皇室盛宴的展开。\n\
  \n### 安德鲁·“Boz”·博斯沃崛起\n\n在那些王子中，他是同者之首——安德鲁·“Boz”·博斯沃（Andrew “Boz” Bosworth），扎克在哈佛大学的助教。据他在加州北部的一个马场上长大，是一个高大、秃头的霸道者，双臂布满了纹身，曾是哈佛武道道的成员，但随着年龄增长变得日益粗壮。在参与广告业务之前，他是新闻动态（News\
  \ Feed）初始版本的工程大脑大脑，这一事实他在每次第一次会面时从不忘记提及。他是第一个进入广告部门工作的“扎克的朋友”，大家都明白他被派遣来收拾广告团队在巴德罗斯（Badros）和戈库尔（Gokul）领导下那种毫无方向的混乱泥潭。\n\
  \n从这个意义上说，Boz 简直是天赐之神，自从他掌权以来，广告团队更不用说 Facebook 的财务一直从他果断的权威中受益。正如我希望自己描述的那样，从 2011\
  \ 年到 2013 年初，Facebook 的变现策略主要体现在其完全的缺失（除了失败的“赞助故事”实验外）。正如威廉·戈尔林《蝇兽之王》中的英国小学生一样，当产品经理和工程师被遗留在无政府状态下自为生时，没多久，一块巨石就会掉在那个胖弱的胆小鬼身上，一个腐烂的猪头被欢快地展示着。Boz\
  \ 就像书中杀戮高潮中出现的英国军官：那些处于真正崩溃边缘的野性男孩们醒了，决定重新拿起文明。\n\n这大致就是 2013 年初 Boz 开始出现在广告会议并最终接管一切发生的情况。突然之间，广告部门无需求助于警长谢丽尔（Sheriff\
  \ Sheryl）就能做出决策，因为我们有了自己的总督，我们自己的扎克官方主教，来主持广告业务。\n\n### 广告贵族制度\n\n但贵族制度也有负面影响。\n\
  \n几乎滑稽的是，而且违背了 Facebook 的所有传统，Boz 用自己的名字命名了他的个人会议室：`LiveBoz`。那里装修得像一个个人的男士洞穴，有沙发和低矮咖啡桌，而不是大多数会议室那种直立的\
  \ Aeron 椅子和长桌，那是我们对产品方向进行最后一次也是最激烈的辩论的地方。他似乎在私生活中还有一支专业摄影师随队，随之产生的大量狗仔照点缀着他的 Facebook\
  \ 时间线，看起来就像介于一张永恒的婚礼专辑和一场正在直播的好莱坞电影首映之间（但他自己之外几乎没有名人）。\n\n在凯瑟琳·洛斯（Katherine Losse）关于早期\
  \ Facebook 生活的平庸的第一手记录《少年国王们》中，她描述了一群哈佛招兵的黑党。他们是核心员工，并将继续成为未来 Facebook 的骨干。根据所有报道，早期\
  \ Facebook 的氛围充满了兄弟情（bro-y），并弥漫着年轻荷尔蒙男性典型的开玩笑式暴力。哈佛黑党成员之一养成了威胁其他工程师的习惯，说如果他们搞砸了就会“打他们的脸”。那个人就是\
  \ Boz，正如我在与一位透露细节的 Facebook 老员工讨论此事时猜到的那样。\n\n*Quod licet Bozi, non licet bovi.*（神灵可以做的事，牛却是不被允许的。）\n\
  \n### 学习曲线\n\nBoz 可能是 Facebook 的的一位神，但他绝不是一个广告专家，因为他对变现领域一无所知。这并不是什么缺陷；除了广告团队外，Facebook\
  \ 大多数人不知道 Facebook 是如何赚钱的，免费食物和班车是谁买单的。大多数人乐于现状，并幸福地将这种忧虑外包给广告团队和谢丽尔，继续专注于他们负责的面向用户的产品部分。\n\
  \n作为一种快速入职的方式，Boz 被邀请与产品营销人员和经理一起参加客户会议。一方面，这有点不可荒唐。除了扎克的信任，他对于这份工作完全没有任何资质。\n\n\
  另一方面，我们在自骗谁呢？这是广告技术，不是轨道力学；一个思维敏捷的技术人员，在充满行动的职业中学习（而非创造）新技术和商业模式，可以掌握足够的基础知识来做出（大多数）明智决策——如果整个团队拼命培训你的话。这基本上就是这种情况，从\
  \ 2012 年底开始，Boz 越来越多地参与广告策略和一般的邮件政治。起初他保持沉默，在适应新课题和政治格局后，他很快变得非常活跃。\n\n但在这一切发生之前，Facebook\
  \ 广告部门多功于波兰（Boland）经历了一个突如其来、出乎意料、改变一切的时刻。\n\n---\n\n### 阿特拉斯耸肩\n\n阿特拉斯和他的全部躯体都变成了石头。他的胡须和头发变成了森林，手臂和肩膀变成了悬崖，头部变成了山峰。他的每一个部位都在增大，直到他变成了一座山，整个天空星辰落在他的肩上。\n\
  \n——托马斯·布尔芬奇，《布尔芬奇神话》\n\n2013 年 2 月 28 日\n\n你知道马尔科·麦克林（Malcom McLean）是谁吗？\n\n我打赌你不知道。但那个人对我们经济的影响比本世纪任何其他人都要大。\n\
  \n麦克林是集装装箱的发明者，即那些在来自中国的货运船上堆成山的金属箱子。集装箱的伟大之处在于，物理货物运输的整个工作流程被标准化在同一个 8×8×40 英子的箱子里。制造商将货物装在八英尺宽的托盘上直接放入集装箱。当集装箱装在铁路车上时，它就变成了货运车；当它到达这里时，通过遍布现代港口的巨型设备直接吊上船。集装箱在船上像乐高一样堆叠着，到达另一个港口后被装在卡车上，然后运往目的地。这是通用的：无论船停靠在新加坡还是奥克兰，其货物都将通过集装箱化的魔法被快速装卸。集装箱化让我们的全球供应链成为可能。\n\
  \n这和广告有什么关系？\n\n\n\n\n\n现代数字广告也已经采用了容器化的方案——或者更准确地说，是一系列方案。它们被称为用于桌面端广告的互联网广告局（`IAB`）广告单元，以及用于移动端的移动营销协会（`MMA`）广告单元。它们具有以像素为单位的标准尺寸——728×90、300×250\
  \ 等，与网络上的每条横幅广告尺寸一致，移动端也有其他尺寸。\n\n就像货运一样，标准化的尺寸意味着今天运行在 `time.com` 上的广告，明天也可以运行在\
  \ `Yahoo Finance` 或《纽约时报》网站上。这意味着广告周围的大部分技术架构也运行得非常高效：为你提供广告中闪烁像素的广告服务器都兼容这些标准尺寸。那些根据发布者、广告尺寸和页面位置对你的数据进行切分分析的分析软件也假定了标准尺寸的存在。这是应用在付费媒体上的容器化，而且通常情况下，它是有效的。\n\
  \n但确实有些船认为自己要么太大、要么太重要，而不愿接受容器——要么因为它们不喜欢容器摆在甲板上的样子，要么因为它们声称运输货物真的只是副业，而不是人生的使命。所以，如果你想通过这些船运输任何东西，突然必须将所有内容重新包装成这些船所接受的任何任意、随机容器。\n\
  \n这种情况在广告业务中被我们礼貌地称为“原生广告格式”。这些船是如 `Google Search`、`Facebook` 和 `Twitter` 等产品。可能因为它们最初是不考虑变现、以用户为中心的病毒式营销手段（`Facebook`、`Twitter`），又因为它们非常有意识地违背了现行的标准，基本上是因为它们可以那样做（`Google\
  \ Search`），最终结果就是标准广告格式无用武之地。\n\n选择原生格式为这些平台带来了两个巨大的摩擦，特别是对于任何试图将传统的广告交易平台挂载到其库存上的人来说（正如我们在\
  \ `Facebook` 通过 `FBX` 所的那样，而 `Twitter` 现在正尝试通过 `MoPub` 这样做）。这两种摩擦一种是显而易见的创意差异（即广告本身在视觉上必须与它们的标准化对应物有所不同），另一种是更微妙的差异，涉及到广告世界中广告的投放和计数的方式。我相信，围绕后一点的斗争将决定未来的广告帝国。\n\
  \n## 为什么广告服务器很重要？\n\n乍看之下，它们似乎无关紧要。继续我那个（现在可能有些牵强的）航海比喻，它们仅仅是移动箱子的集装箱吊。但事实上，它们扮演着重要得的角色。\n\
  \n看：广告主不信任它的代理商，代理商不信任它的交易台，交易台不信任它使用的广告购买软件，而广告购买技术公司不信任交易所。让这个不诚实的世界诚实的唯一办法就是存在一个公认的真理来源。那个神谕就是广告服务器。如果一个营销人员想要在美国东部接触一百万人，在周四下午四点到十点之间向每人展示不超过四次广告（顺便说一下，这是电影的常见购买时间，电影总在周五上线），那么只有当广告服务器报告显示他确实得到了这些时，该营销人员才会满意。广告服务器不仅仅是一个按需吐出像素的数据服务器；它还是决定在何时、向谁、以什么频率以及在互联网何处交付内容的会计系统。\n\
  \n这仅仅是为了那些想要产生大范围、广泛影响的相当没脑的品牌营销购买。对于追踪绩效的营销人员（如在线零售商），广告服务器衡量标准的暴政更为严重，因为它在定义营销金额之外，还定义了营销资金的单位。\n\
  \n### 一个让它更简单的技术寓言\n\n你是否曾开车在公路上看到那些路边广告牌？你知道的：`MCDONALD’S`，右转四英路！即使我们没有没有意识地处理这些冲击视网膜的图像，我们的潜意识——那个产生神圣与不洁欲望的摇篮——已经记录了它。在四英路之后，当那些金色拱门出现时，你会更倾向于停下来买那个预制的油炸汉堡。那个路牌对你根据提示采取行动贡献了微乎其微的概率。如果你移除它会怎样？与路牌在那里相比，会有多少汉堡没被购买？这是一个很小的数字，但是可以测量的。\n\
  \n在在线世界，看到那个预告牌被称为“展示量”（viewthrough）：即对广告的物理观看，但没有产生任何立即行动。在看到金色拱门时驶下高速被称为“点击量”（clickthrough）：即在营销提示后的立即行动。展示量与点击量的相对价值是一个微妙的测量问题，我们不需要在这里放慢脚步。但请思考一下，对于试图决定是买更多广告牌，还是在场地和店面装饰上花更多钱的人来说，特权其中一种意味着什么。\n\
  \n在一个我们知道人们很饿且我们有选择场地来设置麦当劳的世界里，我们会投资在租金和店面装饰上，因为我们已经知道我们捕捉到了一个虚弱、饥饿的时刻（例如，在棒球场或购物场的食品广场）。我们不需要在整个球场或商场到处设立告示。我们知道人们很饿，知道他们聚集在哪里；我们只需要支付待在那里的代价。\n\
  \n在一个不确定人们是否饥饿、且广告既是诱导也是信息传递的世界里，我们会在到处贴满广告牌，希望引导消费者进入商店，而不必太担心是否恰好捕捉到了饥饿的人。我们正在制造需求，而不是在利用需求，这是大多数公路上发生的情况。因此，我们每隔一英里就有广告牌，但商店却隔了三十英里。\n\
  \n## 这为什么重要？\n\n`Google` 源于搜索世界，在那里人们只需输入请求。`Google` 需要做的只是让那个人到达商店。点击的价值是巨大的且昂贵的（这就是为什么\
  \ `Google` 疯狂印钱）。展示量对他们来说价值为零。事实上，它的价值之低，以至于当查询看起来没有商业价值时，`Google` 选择不显示广告。大约一半的查询旁边没有广告；你可以测试一下。它的广告服务器只计算点击。它的手册明确规定：“点击胜过展示”，Google\
  \ 在每一次演示中都强调这一点。\n\n`Facebook` 反而崇拜展示量价值。由于 `Facebook` 没有关于意图的真实数据（即它不知道你想要什么），它制造欲望而不是利用欲望。因此在\
  \ `Facebook` 的会计中，展示量确实很有价值，它非常想为其插入到你信息流中的那张漂亮图片（或很快就会视频）获得功劳，即使你没有点击它。\n\n\n\n\
  \n那件事当时让我有点自以为是，回想起来，放弃它是我的短视之举。我当时全身心地投入到让 `FBX` 取得成功，完全深信只要我们让 `FBX` 的规模扩张比 `Custom\
  \ Audiences` 快，我就能强迫 Facebook 管理层承认我们那不可避免的程序化未来的正确性。\n\n但到了 2012 年底，Gokul 已经意识到，让我继续担任\
  \ `Custom Audiences` 的产品经理无异于“信狐盗羊来筑鸡窝”。最坏的情况下，我会忽视这项任务（我偶尔会这样做），最好的情况下，我会构建出留有后门和逃生口的技术，并在稍后在\
  \ `FBX` 产品中利用并回收这些后门，而那才是真正的出路。对我来说，`Custom Audiences` 唯一有价值的地方在于它能够通过姓名、电话号码和邮寄地址等个人身份识别信息将在线与线下连接起来的独特能力，这种数据关联能力我也曾徒劳地尝试在\
  \ `FBX` 上实现。(*)\n\nBoland 肯定在剥夺我的职责方面也推波助澜。我和我已经因为 `Custom Audiences` 在我们各自投放愿景中的角色而变成了激烈的敌手，在抄了从\
  \ Sheryl 在内的所有广告部高层在内的邮件中，你来我来长长且充满火药味的邮件。我是攻击 Boland 愿景的唯一反抗者。由于 `Custom Audience`\
  \ 是他提议的结晶，旨在完成 `FBX` 显然做得更好的事情——即将外部投放数据与 Facebook 广告结合——我担任其产品经理的日子注定用尽了。千万不要太低估那些嘴唇像被胶水粘在一起的中层经理。\n\
  \n接着，Boland 给整个 Facebook 抛出了一个变圈球。他曾多次神秘地前往西雅图。当时 Facebook 在西雅图的办公室非常小，而且主要是工程部门。由于\
  \ Boland 从来不真正与工程师交谈，这成了一个谜团。\n\n但有一天，公司宣布我们正就收购 `Atlas` 进行激烈谈判，这是微软的广告服务器，也是谷歌广告服务器竞争对手\
  \ `DoubleClick for Publishers` 的追随者。\n\n然而，当消息在广告团队中传播时，几个涉及外部广告领域的产品经理无论如何，都跑到\
  \ IT 帮助台，恳求或借一台 Windows 笔记本电脑，以查看这个我们所谓的要买的东西。信你不信，微软的 `Atlas` 只运行在特定版本的 `Internet\
  \ Explorer` 上（如果你太年轻记不起来，那是一个浏览器）。遗憾的是，不像复古服装，用户界面永远不会老到能再次变得时尚。它既陈旧又过时，流程如此复杂，以至于专业的广告人士都会在那片混乱中迷失。但多亏于起步早和多年的存在时间，它拥有\
  \ 20% 的市场份额和数千家外部出版商，这才是真正的吸引力。\n\n这整笔交易是由（惊喜吧！）Boland 和他在微软的前同事们策划的。正如本章前面描述的原因，广告服务器是整个极其噬人的\
  \ Facebook 广告技术栈的基石，而他此时促成交易并让 Facebook 投入，是这在“封闭”与“开放”的平衡秤上投下的另一块砝码。\n\n据传 `Atlas`\
  \ 正在与程序化领域的另一家大型广告技术公司进行收购谈判，因此交易进展非常仓促，在大多数人意识到我们要买它之前，它就已经成了一个既定事实。作为一种向全体员工的公告，并为这桩公司婚姻提供一个“有话直说，否则保持沉默”的论坛，Greg\
  \ Badros（当时仍正式主管广告部）在 `Atlas` 谈判进入白热化的 2 月底，召集了所有高层人员和产品经理召开会议。\n\n广告部所有重要人物都聚集在一个规模较大的会议室里。这说明广告团队已经成长得如此巨大，那里可能有四到五十人，而且是无地立足。两年前的同一个会议甚至填不满一张中等大小会议桌的座位，更不用说一个大房间了。\n\
  \n谁负责合同细节的人读出了高层条款，由于这些内容大多无关，且我对 Facebook 法律部门的厌恶邮件容忍度有限，我就省略了。接着，Badros 简述了 `Atlas`\
  \ 的简史，提到微软在 2007 年作为一项价值 62 亿亿美元的大型收购的一部分收购了这家名为 `aQuantive` 的公司，该公司当时是广告技术的混合体。按照典型的微软风格，他们没能利用其巨额投资，让\
  \ `aQuantive` 的一个又接一个部分在藤上腐烂，只有 `Atlas` 因为在广告领域确立了稳定的地位而最终幸存下来。但现在，微软连这也想退出。\n\n\
  Badros 随后用一个会计事实总结了这段肮脏的故事：“所以，微软在 2007 年以 62 亿美元购买了他们，然后计提了 61 亿美元的价值，而现在，我们就在这里了。”\n\
  \n有人喊出了显而易见的问题：“等等……那么在这一切中，`Atlas` 的价值在哪里？”\n\nBadros 反驳道：“就是这。1 亿……那就是 `Atlas`。那就是我们要买的东西。”\n\
  \n不安的笑声在房间里蔓延，Facebook 广告管理层消化着他们正在捡微软残渣这一事实。这也是一个严酷的提醒，提醒人们在签支票方面谁才是真正的老大。Facebook\
  \ 迄为止最大的广告技术收购只是微软的一个会计进位误差。\n\n在那场会议上没有人提出重大的反对意见，而且在非常短的时间内，Facebook 就竞胜了名单中的其他其他人，交易被宣布（或被选择性地泄露）。\n\
  \n许多非 Facebook 员工在私下中谨慎地表达了对这次收购的不相信，质疑我们如何能买这样的东西。\n\n\n\n当然，我对他进行了一次彻底的 Facebook\
  \ 挖掘，一直溯到他在哈佛时期，一直直到婴儿期。多亏了 Facebook 标签 `#tbt`，我看到了他那理想化且经过媒体处理的自传：从加州北部农村到哈佛，再到\
  \ Facebook。我还审视了他的管理哲学，或者说，是他对这一哲学的公开认知。他显然是那种严厉但公正的、以直率和诚实为傲的人之一。毕竟，真理就写在他的身上。\n\
  \n对我而言，在物理教科书之外，我发现“真理”是一种相当稀有的商品，特别是在科技领域。我注意到，那些最大张旗鼓相信真理的人，往往异常地他们他们珍视的任何经过包装的谎言。\n\
  \n对话很快转向我在广告团队的职责。在 Facebook，绩效评估周期每半年一次，每年的 2 月和 8 月都会出现惯常的政治斗争，以确保你的粉丝对你进行评估，而你最大的反对者则没能完全做到。\n\
  \n“你是一个非常有争议的人物，安东尼奥。我读了你团队成员的评价，然后是管理层的评价。他们完全对立。一个爱你，另一个则恨死你。”\n\n*呵呵，废话。*\n\n\
  我完全可以想象那些反馈，尽管我没被告知具体的作者：Reesman、Hari、以及 Gary 等 FBX 团队的人都对我的奉献和产品领导力赞誉不绝口；而 Gokul\
  \ 和 Boland 则指责我粗鲁、不服从、自以为是的、傲慢，以及对当前 Facebook 策略的腐蚀性批评。\n\n“你说得对，Boz。我在这里确实结了朋友，也结了敌人。但我的目标一直是为\
  \ Facebook 提供最好的广告系统。”\n\n这在严肃意义上是事实。我几乎不记得在 Facebook 之前的生活是什么样了，而且由于我在那里度过了整个生命，留下了一条毁灭的足迹：两个被忽视的孩子，两个被我拒绝了真诚之爱的女人，两艘在疏于中腐烂的船，以及由于冷漠和我对\
  \ Facebook 事业的投入，校园之外的任何智力或生活都无于存在。不要被我在书中对 Facebook 的刻薄对待所误导；每一个愤世嫉俗者的内心都住着一个心碎的理想主义者。如果说我现在是一个尖酸的批评者，那是因为曾经几何时候，就像\
  \ Lucifer 在坠落前是最骄傲的天使一样，我也曾为 Facebook 而活，甚至比大多数人都要疯狂。\n\n我们转向困扰我们所有人的“开放与封闭”之题。虽然他在这个问题上模棱其辞，但他表达了坚定的意图要尽快得出结论，结束困扰广告部门每一个前瞻性决定的不确定性。这是古代德尔斐预言之一，取决于情况，可以从积极也可以从消面的角度解读。\n\
  \n之后，我们站起来，在小桌子上握了手。这场会议闻起来像是与黑手党头人在事情恶化之前的最后一次会，他要么开始释放杀手，要么给出无法拒绝的提议。我不喜欢这种味道，一点也不喜欢。\n\
  \n### 2013 年 4 月 4 日\n\nBoz，直播。又是。这次是在 LiveBoz 里。\n\n聚在一起的都是在 2013 年 Facebook 大辩论中拥有发言权的人：Boland、Gokul、Varghese、Boz、Scott\
  \ Shapiro 和我。声称的目的是最终（最终！）让 Boz 向 Sheryl 给出一个最终建议。尽管在过去的几个月里我们与 Sheryl 有过许多大肆宣扬的“最终”会议，但我们还没有达成结论。\n\
  \n考虑到 Boz 那“男人窝”式的充满哥们风的装饰，会议很快演变成一场男人的口水之争，这并不意外。\n\n“自定义受众（Custom Audiences，简称\
  \ CA）现在远领先于 FBX，”Boland 开始说道。\n\n*呵呵，废话，蠢货。是我、Scott 和 Hari 对抗你以及你所管理或影响的整个 Facebook\
  \ 销售和运营组织，以及运行投放系统和 `API` 的工程团队，所有这些都支持自定义受众，而我只有一个工程师。FBX 竟然还能留在入选名单中简直是个奇迹。*\n\
  \n撇开我对这种不公平竞争的愤恨，Boland 实际上是错的，而且出于他可能并不理解的微妙原因。\n\n“那只有在你把自定义受众的收入算作真正的增量时才是如此。我认为这种说法至少是有些牵强了。你的自定义受众营收仪表板上的数字不是真实收入。如果我们进行比较，它们应该至少打半，”我反驳道。\n\
  \nBoland 和我对视着充满敌意，Boz 以其管理者、和平者的角色插了话，发表了安抚性的话。\n\n#### 现状\n\n在过去的几个月里，自从分别在盛夏季发布以来，FBX\
  \ 和 CA 的收入都在快速增长，且最初并鼓持平。然而，从大约 12 月开始，在纸面上（或在 Facebook 的营收仪表板上，这才是最重要的），CA 的收入已经大幅超过了\
  \ FBX 的收入。原因不言而喻。\n\n正如之前提到的，FBX 的技术挑战远远大于 CA。我们正在创建一个全新的广告基础设施，而 CA 仅仅是依靠现有的 Facebook\
  \ 投放技术在滑行，回收了大量已经存在的投放逻辑。我很清楚；那是我过去一年里一直在构建的东西。尽管它的技术很笨拙，但它标志着 Facebook `API` 和接口内部基础功能的扩展，这意味着现有的\
  \ Facebook 广告商可以轻松地在上面投入资金。他们可以直接通过 Facebook 的广告购买界面（没有 FBX 对应产品）或通过 Facebook 广告合作伙伴的第三方广告购买工具来实现，这些合作伙伴是被\
  \ Facebook 施压支持 CA 功能的。\n\nFBX 设计初衷是与更习惯实时交易的外部广告世界无缝协作，但它并非没有技术和采用问题。正如我解释过的，FBX\
  \ 需要偏离标准的程序化剧本，例如不同的广告格式。这需要 FBX 团队进行多次史诗级的黑客操作，试图将整个独立演化的广告系统强行嵌入在线重定向的行业标准。在经历了几个恼人的月份并提交了几项专利后，我们已经在很大程度上取得了成功，但这种围绕市场需求的收敛迭代是\
  \ Facebook 文化非常缺乏耐心的。\n\n此外，你必须理解广告商的心理以及他们对世界的简单分类。过去如此，现在也是，广告预算按渠道分配的——电视、广播、Facebook、Google、户外牌等——几乎就像是给某个选民群的专款政府拨款。虽然广告的类型（即在线重定向）无论通过\
  \ CA 还是 FBX 在抽象层面上是完全相同的，但投入 CA 的支出仍然属于“Facebook”预算；因此，无论哪个代理机构负责预算，都可以在业务和技术上轻松地将支出引导到那里，而不会引起太多麻烦。\n\
  \n\n\n在 FBX 的世界，情况完全不同：我们正在与预算竞争支出，而这些预算大部分被拨留给了 Google 和它的实时广告平台 `AdX`，这正是大多数重定向营销的实际运作方式。这是一件好事，因为\
  \ FBX 的支出是真正的“增量”（用 Facebook 的术语来说）；也就是说，FBX 的收入是那些原本不会花在 Facebook 上的新资金。当然，这些钱以前是花在招人厌的\
  \ Google 身上的，这一事实让它们变得更加诱人。增量支出——新钱！——是当时 Facebook 的的圣杯。事实上，增量是 Facebook 内部任何新广告产品面临的挑战。诚然，你的仪表板显示了\
  \ `$X 百万` 的支出，但你如何知道这些钱无论如何都不会花在 Facebook 上呢？如果发布新产品仅仅是为了将相同的支出分配到一组新的篮子里，那是毫无意义的。这就是为什么\
  \ `Boland` 的数据大部分是虚假的收入。每美元中最多只有五分是真正的新钱，其余部分来自无论如何都会花在 Facebook 上的预算。\n\nFBX 支出\
  \ 100% 的增量属性是管理层的一大卖点，但如前提到的，这意味着我们必须说服 `Zappos` 或任何人（无论是直接还是通过我们的代理——FBX 合作伙伴），明确将支出分配到\
  \ Facebook 上，而不是其他实时渠道。此外还有另一个事实是，广告主必须设计新的广告素材来运行这些活动，这对于一个尚未经证明的渠道来说意味着额外的工作。现有的所有零售商以前在\
  \ Facebook 上花钱时都吃过亏头，并且对各自的 Facebook 惨剧仍记忆犹新。由于大多数零售商的生死取决于圣诞购物季期间第四季度的表现，他们不倾向于尝试任何真正新颖的东西。因此，`CA`\
  \ 感受到的第四季度支出激增比 FBX 明显得多，结果就是 FBX 已经落后了。这削弱了我在 `LiveBoz` 正在进行的这场扑克游戏中的筹码。\n\n*如果我每天能有\
  \ 100 万美元的支出来堵住 Boland 的嘴，这场会议很快就会结束了*，我心想。\n\n但我并没有。不过，仍希望。得益于我们在 `2013` 年发布的为了进一步促进采用的新功能，FBX\
  \ 迅速恢复，强劲的增长回到了 `Q1`。与此同时，`CA` 在强劲的 `Q4` 之后开始消靡。`Boland` 的团队除了让系统没那么慢的后端调整外，没有发布过什么新东西。仅仅“不完全糟糕”并不是一个很有说服力的销售推辞。\n\
  \n在最初的相互抨击之后，会议很快演变成了通常的、毫无定论的企业仪式，`Boz` 重申了他的格言，即我们很快就会得出结论。他发誓要咨询坐在这里的每一个人，然后向\
  \ `Sheryl` 提交一份正式建议。`Sheryl` 要么做决定，要么让他来做。\n\n停下来思考一下。\n\n当一个 `Gokul`、`Boland` 或\
  \ `Fischer` 是什么感觉？\n\n你目睹了优秀的工程师和产品人员来来去，因为你的招聘人员从每所顶尖学校招到了最优秀的应届毕业生。你在强大且市场领先的组织内部的特权地位让你接触到每一个行业趋势和参与者，并让你的的人脉充斥着充满权力和影响力的名单。你能够让任何公司的高层出现并交付讨好且揭示性的产品演示，这意味着你了解行业内正在发生的一切，精确到产品中点击按钮的颜色。\n\
  \n然而，你就在那里，嘴唇像水管法兰一样锁在某个大人物的屁股上，像被拴在磨坊里的牛一样缓慢行进，磨着大公司机器所需的谷物。\n\n为什么会这样？\n\n我告诉你为什么。\n\
  \n因为你毫无疑问是你组织中最缺乏胆量也最缺乏创新的人，因为在你生活的充满机会的环境中，雄心勃勃且有能力的人已经离开去追求它。存在一种负向选择，奶油（或最初漂浮起的任何东西）不断被撇去，而你就是多年持续撇去后剩下的。从大公司\
  \ A 跳到大公司 B 只是表面功夫，因为这至少是一次平调，如果不是晋升的话。你发现，在大公司里，重要的是避免成为裁员或大裁的受害者，并且表现得对公司的任务至关重要且处于关键。你掌握了“向上管理”的艺术：即控制你上方管理层的情感和认知。你很好反馈很好，并确保被看到迅速对这些反馈采取行动。如果你有下属，你在内部支持他们的职业生涯（确保他们知道你在这样做），并试图将他们塑造成为像你一样的人——那些在组织上有效且被公认的人。在所有非病态的组织中，你下属的成功将反映你的优秀，并创造你自己的成功。你确保与同级经理建立结盟和友谊，特别是在销售或业务开发等你需要推进业务议程的组织中。当组织中出现一个低效且无能的成员时，你不是面指他们是痴并尽可能开除他们，而是将反馈传给他们的经理，并学会绕过他们的无能。如果这种无能没有直接影响到你或你的团队，你就视而不见，专注于你所控制的杠杆。\n\
  \n你是中层管理：你是创建该组织的愿景者和冒险者，与那些将此视为工作的宗教新信徒之间不可或缺的一层，你是他们接触企业文化和权威的第一缕气息。\n\n如果你比大多数中层经理更聪明（例如\
  \ `Gokul`），你会努力建立一种个人品牌，使其既能提升你的声望，又能给组织带来良好影响，且通过一种刻意谦逊的方式，以消除对你认为自己是“明星”的担忧。如果失败了，名片上的标志是你最强大的资产，你需要尽可能依靠它获利，直到你把它换成另一个（理想情况下是更好的）。\n\
  \n2013 年 4 月 12 日\n\n场景是在“只有好消息”会议室。\n\n我们回到了起点，但情况已大不相同。阵容几乎一样：`Gokul`、`Boland`、`Rabkin`、`Sheryl`，以及现在的\
  \ `Boz`。我已经打出了最后一张牌。尽管我们拥有的资源很少，我们通过奉承或欺骗让 FBX 合作伙伴在这一平台上投入尽可能多的资金。\n\n\n\n虽然 FBX\
  \ 已经取得了一定的成功，我也因能以少办成事而赢得了赞誉，但房间里那些过去的 FBX 粉丝现在没有再愿意为它的未来投入任何内部社会资本了，更不用说它所代表的整体程序化方向了。如果\
  \ Sheryl 同意将目前仅限于“自定义受众”（Custom Audiences）的数据关联扩展到 FBX，甚至将移动广告库存（这一后来主导了 Facebook\
  \ 变现化的产品）放到 FBX 上，那么还有成功的机会。假设 FBX 继续按照目前的健康速度增长，最终无论在增量现实中还是在仪表板数据上，它都将远超自定义受众的支出。如果\
  \ Sheryl 不同意，那就意味着 FBX 及其周围一切的终结：技术本身、我们获得专利的创新 IP、我们争取到的预算、FBX 合作伙伴为整合所做的工作，以及这一切更宏大的愿景。全为乌有。我们已经全线押注在抽出的那张牌上。\n\
  \n“你想继续吗，Boz？”Sheryl 向坐在我对面的 Boz 打了示意。\n\n“在和所有相关人员（包括自定义受众和 FBX 团队）交谈后，我认为我们不应该在\
  \ FBX 上发布身份匹配，而是继续仅在自定义受众中进行。这是我的建议。”\n\n这将是一个很短的会议。\n\n“这里的每个人都为这次讨论做出贡献，对吧？”Sheryl\
  \ 环顾桌桌。我们都点了点头。\n\n“好吧，如果你是这么想的，Boz，那我们就这么办。”\n\n我捕捉到了 Boz 的眼神；他移开了目光。\n\n没有人移动，也没有发言。在经历了几个月的讨论后，很难相信一个决定竟然已经做出了。\n\
  \nSheryl 最后补充道，仿佛在试图把我们从神昏中唤醒：“所以就这样了。FBX 上没有自定义受众。FBX 上也不有移动库存。我们将保持原样，继续仅在自定义受众上推进身份识别。”\n\
  \n我向窗外望去，是一条通往主庭院的小巷，巨大的 HACK 标志指向天空，像是一道神圣的律法。\n\n嗯，我确实 `HACKed` 了。\n\n在处理了一些我心不在焉没记录的收尾手续后，大家都起身离开了。已经没什么可讨论的了。Gokul\
  \ 看了我这边一眼，但在我们目光交汇的瞬间就移开了视，冲出了房间。在我还没来得及赶上之前他就离开了大楼。\n\n我漫步进 FBX 区域，或者说是那里残存的部分。\n\
  \n这个我赌上了整个 Facebook 职业的产品，现在实际上正处于生命维持状态。\n\n这是两年来第二次，我在午后时分离开办公室，无事可做。\n\n*Adiós,*\
  \ Facebook\n\n每个美丽的女人背后，都有一个厌倦了和她的男人。\n\n—拉丁美洲谚语\n\n### 2013 年 4 月 12 日——当天晚\n\n\
  在 Facebook 的股权归属是按季度的，这意味着我在每年 1 月、4 月、7 月和 10 月的 15 日收到我总股权包的十二分之一。在归属日日前一天辞职，你就会错过一个季度的价值。在归属日后一天加入，你也会错过。这是一种奇特的分批付款系统，很大程度上非常糟糕，尤其是当某笔付款等同于三年的美国平均家庭收入时。漏掉一天，一个普通城市的住房首付款就这么没了（当然，不是旧金山）。\n\
  \n我 Mac 仪表板上的倒计时器显示我入职已整整两年。我的下一次（也是最后一次）归属日是 4 月 15 日（纳税日！）。然而截至今天，我已经超出了 Facebook\
  \ 的留客期限，而且几个月前，我已经耗尽了耐心。是时候离开了。\n\n在这些撤出的时刻，人必须非常小心，确保扫掉那些从 Facebook 大桌上掉落的最后几碎屑。我对\
  \ Gokul 的信任程度还没我扔掉他的远，因此我需要提防任何最后的小动作。Gokul 一是对 FBX 和我是温和的支持者，但像每个中间经理一样，他的忠诚对象是权力层。而且，尽管他表现出那种傻热忱，他终究是个阴谋家。恶魔认同类，既然他不再需要我了，没有理由他现在不会抽我的脚。\n\
  \n在和 Sheryl 会议结束后，立刻离开了办公室，并发邮件给 Gokul 告诉我要周一请假。我在休假时他是不能解雇我的。我不确定是在归属日的当天开始还是结束归属。周一是\
  \ 15 号，但 24 小时可以产生天壤之别。最好等到 16 号，看到那些股票在我的 Schwab 账户里静躺后再辞职。\n\n如果我辞职，还不清楚是否能和平分手，所以周末去清理办公桌和积攒的杂物是合理的。有多个\
  \ Facebook 员工在刚离开公司后就被直接赶出了大门。不需要那种悲伤的画面：离职员工收拾着他的公司咖啡杯，就像那是他突然失去生活的遗迹。我把所有、所有东西都装进了两个大塑料袋里，除了我的电脑，什么都没留下。\n\
  \n那台啤酒机，见证过两次现场酿造和无数次购买的桶装啤酒，它要随我一起走。我把我那辆改装过的丰田 Tacoma 越野卡——被撞得稀烂，看起来像塔利比人用来攻占喀布尔的工具——倒在正门口。我推着啤酒机出去，保安没有发出明显的警报，我把它搬到了卡车货箱上。到目前为止，一切顺利。\n\
  \n到了周二，股票已经在我的 Schwab 账户里了。没什么可再等的了，所以我最后去了一次 Facebook 总部（用公司术语来说，门洛帕克办公室称为“MPK”）。\n\
  \n还有电脑数据清理的问题。\n\nFacebook 的 IT 政策异常地松散。尽管禁止使用像 `Dropbox`、`Evernote` 甚至 `Google\
  \ Apps` 这样不安全的程序，但每个人都是，包括高级管理层。尽管如此，这种行为在官方上属于违规。是时候删除证据了。\n\n我先将每个个人文件以及其他文件放入\
  \ `Secure Empty Trash`（安全清空垃圾桶）。这并不是简单地将文件与文件目录取消链接，而是用随机数据覆盖文件，使复活几乎不可能。\n\n为什么要这么偏执？我的机器上甚至连一点引起怀疑的内容都没有。但正如我已经发现的，即使你不犯错也可能被起诉。尽管有那些漂亮的海报，这家公司根本不在乎我，如果它觉得合适，会像踩虫子一样把我压扁。\n\
  \n在删除程序运行时，我最后看了一眼 FBX 的收入仪表板。收入仪表板，这个小贱人！过去一年统治我生活的数字集合。不过我我笑了。我们即将达到第二个大的收入里程碑，准时达成。\n\
  \n*不能说我没让你赚到钱！*\n\n哔！\n\n是 Gokul 发来的 `FB Messenger`。我们的一对一安排在下午 4 点，现在是好 4 点 2 分。\n\
  \n“你来参加一对一吗？”\n\n这很奇怪。Gokul 不仅因迟到所有会议而闻名，而且通常对下属的一对一会议漠不在乎。我因为各种紧急事项错过了很多次，他从未提醒过我。\n\
  \n我切换回磁盘覆盖界面。70% . . . 80% . . . 90% . . . 完成。\n\n我砰地关上笔记本电脑，走下楼。\n\n\n汤米回到了老板的家里，到处都是拍着肩膀的寒暄声，还有那种毕业典礼或颁奖仪式前那种紧张的客套。汤米被带进仪式现场\
  \ . . 却发现了一间空屋。正当他意识到这是一个圈套时，一颗子弹贯穿了他的额头，他重重地倒在地上，变成了一滩血。他过去犯了太多的罪，不至于被宽恕，但他知道得太多，也不可能被放过。\n\
  \n我这辈子从未被解雇过，但我一直怀疑，在极端情况下，那种感觉会有点像那个场景。我离并不远。\n\n当我注意到房间里 `Gokul` 旁边有个火辣妹时，那种“汤米时刻”降临了。紧接着我反应过来。“妈的。Gokul，你这个臭不可闻的小混蛋。你竟然都不让我体面辞职。”\n\
  \n在 `Facebook` 很少有那种传统意义上有魅力的女性。那里的几位女性也极少穿着连衣裙或踩高跟鞋这种展现女性特质的服装上班。在会议室里，一个打扮精致的\
  \ `deuxième sexe` 成员，比一把短管 `.38 Special` 轮手还要像清晰的死神使。\n\n`Gokul` 报出了一个尴尬的微笑，在我坐下的瞬间就冲出了大门。\n\
  \n我看向桌子对面。如果她的眼神是想让我卸下防备，那她要么更有乳沟，要么更有魅力。当她读着她的脚本时，我死死地盯着她。\n\n“我们提供一份补偿方案 . . .\
  \ .”\n\n在这里，她切换到了那种职业操纵者（如推销员或政客）常用的虚伪低语，以此对个人亲密关系进行廉价的开价。“我们只向极少数员工提供这种方案 . . .\
  \ .”\n\n她将一份看起来像合同的文件推过桌子。\n\n`非诋毁条款. . . . $30,000 . . . . 自本文件日期起一年内，你将不会 . .\
  \ .`\n\n*哈！*\n\n我识破了这个骗局。这散发着独特的 `Gokul` 式的臭味，就像路死的臭鼬的味道。我知道我生生于夸张的批评，并且擅长用措辞得体的\
  \ `Facebook` 帖子来吸引注意力，`Gokul` 决定贿赂我让我闭嘴。这个额外的封口条款将加强 `Facebook` 在选择起诉我时起诉我的能力。\n\
  \n仅仅因为我有偏执症，并不意味着他们不是在对付我。好在我运行了 `disk overwrite`（磁盘覆写）。\n\n我在想要不要让 `Miss HR` 把那笔贿赂卷成根漂亮的小管，塞进她的屁股里。理智占据了上风。“我会考虑的，”我说，并把那张纸陷阱推回了她那边的一侧。\n\
  \n剩下的都是 HR 的模板内容：`归还所有 Facebook 硬件 . . . 不招揽 Facebook 员工 . . . 转让所有 Facebook 知识产权\
  \ . . .`\n\n行了行了。我为你构思的那些创意，还有为我工作的工程师。现在都是你们的。目前。\n\n走出会议室时，巧的是，我和 HR 代表碰上了一位来自\
  \ `FBX` 合作伙伴公司的员工。我曾向 `Facebook Ads` 管理层暗示过我们应该挖她，然后亲口说服了她在 `Facebook` 的辉煌前景。她紧张地看了我一眼，我说了“你好”并笑了笑，这时另一个\
  \ HR 女士护送她进入了面试室。\n\n“你知道的，你不应该和 `Facebook` 员工道别。那是个坏主意，”`Miss HR` 说。\n\n“那是多亏了我才挖到的一个\
  \ `Facebook` 合作伙伴员工，”我尖锐地回答道。\n\n这个人不太聪明：`FB` 员工不是带着访客证并在护送下进来的。\n\n我们到了我的办公桌，那里难得一次一洁不染，由于我周末的维护而闪闪发光。桌上除了我的\
  \ `laptop` 外什么都没有。\n\n“你的笔记本电脑在哪？”\n\n“就在那儿，”我指着说。\n\n“你的手机在哪？”\n\n“在家里。”\n\n“你的笔记本电脑在哪？”\n\
  \n“我忘在家里了。”\n\n“你的证件在哪？”\n\n“我也忘在家里了。”\n\n\n\n\n\nAlex Gartrell 和我手拉手，像小女孩一样在街上蹦蹦跳跳唱着一首我不记得的小调子。Gartrell\
  \ 是个典型的中西部人，凭借橄榄球奖学金就读卡内基梅隆大学，那是美国最好的计算机科学系之一。他是 Facebook 的基础设施工程师，也是这些城市饮酒狂欢活动的常客同伙。\n\
  \n正当我们大声唱着欢快的双人赞歌时，突然：\n\n*砰！*\n\n我的脚发出一声响响，像绷紧的索断裂，突然间我无法走路了。小组继续留下我向前，而我蹒蹒跚地走向一个消防栓，我坐在那个不舒服且尖尖的顶端上，等着一直掉在队伍后面的以色列心理学家路过并营救我。\n\
  \n第二天去急诊的结果给出了那类令人沮丧的衰老诊断：我撕裂了足底筋膜，那是连接足弓的结缔组织，是人类运动的减震器和弹簧。判刑结果：坐在屁股上八周。\n\n当我这种被迫在沙发上静止了两周时，科技界传来一个大消息。Twitter\
  \ 正在收购全球最大、最复杂的实时移动广告交易平台 MoPub。\n\n我以前曾接触过 MoPub：Facebook 按照它看待任何成功的初创公司时那种不置定的态度，在两年前就对它进行过调研。我曾面试过它的\
  \ CEO `Jim Payne`，应聘一个产品经理职位。Facebook 拒绝了 MoPub，但我对其留下了深刻印象。在初次见面的一年后，当 FBX 处于高速运转状态时，我曾多次敲开\
  \ MoPub 的门，与 `Jim` 和他的产品负责人 `Herman Yang` 讨论产品问题，那时我还在愚蠢地试图说服 Facebook 将其移动广告库存放到\
  \ FBX 上。MoPub 运营交易平台、以及移动数据和定位中那些深奥的怪癖，比任何人都懂得透彻。\n\nTwitter 收购 MoPub 的意图完全显而易见：它正在做我曾试图说服\
  \ Facebook 去做。将它的社交媒体网络与实时交易平台相结合，这就是 Twitter 版的 FBX。考虑到这次收购规模之令人咋舌（根据当时 Twitter\
  \ 的股价，泄露的数字为 3.5 亿美元），这一决策必然得到了高层的大力支持。FBX 团队和我曾构思了整个愿景——如何以安全的方式公开定位数据，在一个技术步骤中解决整个在线身份问题，让广告主在广告投放和定位方面获得前所未有的控制和灵活性，同时保护\
  \ Facebook 用户数据和广告主关系等长期战略资产……现在有人真的要做到了。\n\n除了坐在那里抱怨我的脚外无事可做，我花了两天时间梳理对这次收购的思考。如果不是成为“混沌猴子之神”Reesman\
  \ 以及那无处不在的混混戏团的受害者，我怀疑自己不会有那种精力。\n\n这篇文章本身发表在 Medium 上——那个当时深受极客人士流行的“思想领导力”新频道——取得了巨大的成功。它显然在\
  \ Twitter 和 MoPub 内部都传开了来，交易中的重量级人物如 `Adam Bain` 和 `Jim Payne` 都在转发它，这意味着从初级销售员在内的每一个人都在转发。\n\
  \n显然，我判断对了：Twitter 正在利用 MoPub 的技术构建“超级 FBX”。考虑到收购案的敏感性，加上联邦贸易委员会可能对垄断行为进行调查，相关公司的高管无法就其原因或计划发表评论。然而，他们完全可以指向一篇由外人士写的、充满赞誉且富有洞察力的博文。这正是他们所做的。我在沙发上度过了三天，兴奋地处理着社交媒体上的混乱——转发、评论、澄清、新关注——这一切作为人类心理雷达上一个新起点的喧嚣与嘈杂，那个总是死得太早的亮斑。\n\
  \n鉴于这个意料之外的契机，是时候采取计策了。由于 AdGrok 的那些运作，我仍然留有 `Kevin Weil` 和 `Adam Bain` 的邮箱地址。自从我退出\
  \ AdGrok 交易后，我们就没说过过话；我假设自己在 Twitter 所有人眼里已经彻底完蛋了。Deep Tweet 告诉我，Twitter 的 CEO `Dick\
  \ Costolo` 在在 AdGrok 交易期间甚至发了一封全公司邮件，将我的背离解释为懦弱的人格缺陷。\n\n我带着些许忐忑给 `Adam` 和 `Kevin`\
  \ 写了一封安解的邮件，祝贺他们取得了这项天才般的交易。最坏的情况会被忽略。最好的情况可能是完全不同的结果。`Adam` 回复了，建议在 Twitter 公司面谈。\n\
  \n于是，在 AdGrok 剧变两年后，我来到了位于第九街和市场街交汇处的 Twitter 新办公室。这家公司已经超出了 Folsom 办公室的需求，在与旧金山那总是分裂式无能的市政管理层多次争执后，他们选择留在旧金山市范围内，尽管该市威胁要对像万圣节糖一样发放的股票期权征税。新办公室就在旧金山那个味臭味熏的城市景观南方——金钱区（Tenderloin）。随着\
  \ Twitter 进驻那里，以及随之而来的中产/文青青年服务经济（如 5 美元的咖啡、精酿啤酒和昂贵的公寓，无疑将为了服务那里及其员工而出现），当地的调子手将那片贫民窟重新命名为“Twitter\
  \ 区”（Twitterloin）。当旧金山拥有 IPO 时，谁还需要城市更新或半吊子的城市规划？\n\n胸牌再次挂回脖子上，我在接待区招呼了 `Adam Bain`\
  \ 的助理，被带到了一间会议室。透过会议室的窗户，我发现了这两个男人，我上次和他们说话是在我追求他们和他们的公司时，而现在他们正被我追求。\n\n*这将会非常有意思*。\n\
  \n周围充满了礼貌的握手和微笑。`Adam` 和 `Kevin` 坐在圆桌的对面，我身后是白板，他们身后是落地窗，窗外可以看到工程师办公区。\n\n在一个小时内，我解释了\
  \ Twitter 在收购 MoPub 后将面临的所有技术、法律和业务问题。尽管我几乎没有什么个人功劳，在那一刻，我成了将实时交易平台嫁接到社交媒体上的全球专家。没有人比我更懂这个小众领域，因为我是曾尝试过此事的唯一团队领导者。\n\
  \n\n\n\n\n几天后，Kevin 发来邮件，提议让我加入 Twitter 担任顾问。这一切都将秘密进行，不进行公开。。如果媒体问起，Twitter 必须承认我是顾问，但除此之外，对外界将字字不提。我需要的只是每两周与各个产品经理开一次会议，他们将负责构建\
  \ `Twitter-MoPub` 集成，且会议过程必须谨慎进行。在入职期间，我不拥有公司 ID 或电子邮件地址，或任何其他官方的 Twitter 身份。我每次都会以访客的身份从正门进入，这会让大楼前台那些效率低下的守卫感到有些小小的头疼。\n\
  \n很诱人。但像往常一样，给我看数据，宝贝。\n\nTwitter 很快提供了这些数据。这不再是两年前那个需要一个月才能制定条款清单的公司。薪水是每季度一千股，每年约\
  \ 16 万美元（按照当时上市前每股 40 美元的 Twitter 估值计算）。这一切仅仅是为了偶尔出现在 Twitter 办公室，并传达我对实时广告购买本质的看法。\n\
  \n你怨恨那个人，总有一天，你成了那个人，并纳闷自己是怎么走到那一步的。我已经在某种程度上进入了那个顾问圈，那里的人只需露面就能获得巨额报酬。硅谷有整整一类人物，他们仅仅如此，并且不为其他而生。在薪酬方面，没有什么能比得上优胜劣制。\n\
  \n不过，也有几个小插曲。\n\n但在几个月前，我还是 Facebook 的员工，在 Twitter 最强大的竞争对手那里构建完全相同的产品。我当时仍受 Facebook\
  \ 保密协议的约束，禁止泄露我在那里所做的任何事情。\n\n此外，我是 `Nanigans` 的顾问，并即将成为其产品副总裁，该公司是 Facebook 最大的变现合作伙伴。`Nanigans`\
  \ 是向贪婪的 Facebook 机器注入资金的大管道之一，它与 Facebook 紧密合作，既创建新的 `Facebook Ads` 功能，又通过 `Nanigans`\
  \ 复杂的购买工具为大预算广告主提供这些功能。在 Facebook 与任何人的合作范围内，与 `Nanigans` 的关系几乎是最亲密的了。\n\n如果你好奇的话，是的，这完全是一场出于报复的工作，目标是尽可能将大量支出从\
  \ Facebook 转移到其他渠道，这种狭隘的报复心甚至不亚 Murthy。我在 `Nanigans` 的贡献是领导产品团队构建用于在 `Google` 和\
  \ `Twitter-MoPub` 上购买的实时购买工具，并将公司的产品多样化，不再局限于 Facebook。在智力上，处在买卖方程的另一侧非常迷，实际上是在构建购买技术，以与我曾构建的实时销售技术进行对接。然而，真正的动力是将我最初通过\
  \ `FBX` 从 `Google` 转移到 Facebook 的资金，多亏 `Nanigans`（及其背后财力雄厚的广告主阵容）现在能够随处购买广告，回到 `Google`。*只有被取代的东西才会被毁灭。*\n\
  \n考虑到所有复杂的忠诚关系，从 Facebook 家族转向 Twitter 家族（同时名义上仍留在 `Nanigans` 的 Facebook 家族内部）不是一步小步，而且图中的任何人，无论是\
  \ Facebook 还是 `Nanigans`，都不会对此感到非常高兴。Twitter 所要求的几乎触及了违反保密协议，以及绝对的公司背叛。*仅仅*是如此，这就是硅谷的运作方式。\n\
  \n我没有经过谈判就签署了录取通知书，并邮件给 `Kevin Weil` 表达我渴望开始 Twitter 工作的热情。他回馈了这种兴奋，并建议了一个时间与 Twitter\
  \ 的 `Ads` 产品团队见面。\n\n我现在为 Twitter 工作，违背 Facebook 的利益，而两年前我刚刚做了极具侮辱性的相反行为。与此同时，我也为\
  \ Facebook 最大的广告合作伙伴和最大的现金来源工作。\n\n确实是无国家的机器之地。\n\n## 结语：人谋事，天笑之\n\n期望往往落空，且往往在\n\
  它承诺最丰厚的地方。\n\n—威廉·莎士比亚，《结局皆圆满》\n\n### 2016 年 1 月\n\n### 那么这一切结果如何？\n\n2013 年的“Facebook\
  \ 广告大辩论”最终变得无关紧要，或者说，这是一场意义更在于战略和长期考虑，而非战术和即时的辩论。\n\n尽管 Facebook 作为节省季度利润的金矿经历了层层风雨，但推动股价走出\
  \ IPO 后低迷期的因素并非 `Custom Audiences`（自定义流量）或 `FBX`。第三个产品——Facebook 在其忙乱的 IPO 期间推出的唯一其他新型广告产品，代号为“Neko”，才是那个救星。该产品本身像许多产品一样，仅仅是两个原本不相关的领域的结合：Facebook\
  \ 令人上瘾的 `News Feed`（新闻动态）以及 Facebook 移动端 App 的广告库存，而不是桌面网站。仅此而已：当用户使用移动设备时在 `News\
  \ Feed` 中投放广告——这救了 Facebook。\n\n这场政变最有责任的人是一个名字不可思议的产品经理，叫 `Fidji Simo`。她是我的两个“办公室妻子”之一（是的，我是一个办公室摩尔门教），她在\
  \ Facebook `Ads` 部门从一名低级的产品营销人员开始职业生涯。她非常迅速且巧妙地爬升了 Facebook 的企业阶梯，获得了在 `Ads` 与公司其他部门重叠的产品经理职位，将自己置于更大的\
  \ Facebook（以及扎克）聚光灯下。她是一半西西里人，一半法国人：后者意味着黑色的、定制的连衣裙和像吧凳一样高的高跟鞋；前者意味着一种通过几个世纪家族斗争演化出的强大政治能力，完美适应了\
  \ Facebook 的管理文化。\n\n回想起来，很清楚 Facebook 为什么在移动端取得了成功。\n\n#### 首先是数据。\n\n在桌面端，浏览器及其\
  \ Cookie 池（即使是数据经纪人甚至 Facebook 这样的第三方也可以从中读取和写入）意味着每个 Web 浏览器都有大量数据在流动。你在 `Kelley\
  \ Blue Book` 网站上为你的车估价，或在 `fandango` 上搜索电影放映时间，这件事不仅 `Fandango` 或 `Kelley` 知道，整个数据经纪人和目标投放者也都知道。\n\
  \n在移动端，Web 浏览器通常不接受第三方 Cookie，这意味着当你在移动浏览器上访问 `nytimes.com` 时，除了《纽约时报》之外，没有人能读取或写入关于你的数据。这与桌面浏览器上盛行的数据混乱形成对比。此外，该移动浏览器通常无法访问你的唯一设备\
  \ ID，正如我们将看到的，这是移动广告世界中真正关重要的标识符。\n\n#### 第二，应用作为核心移动体验的胜利。\n\n\n\n\n可以这样想：从数据的角度来看（如果不是技术角度的话），一个\
  \ App 就像是某个特定公司构建的独特浏览器，该公司构建它是为了让你体验其特定的网站。你实际上在手机上拥有几百个独特的浏览器，通过它们阅读内容并购买商品或服务。再次对比桌面端，在桌面端，你拥有\
  \ `Chrome` 或 `Safari`（或少数浏览器之一），通过它们浏览成千上万个网站，所有数据都在浏览器的 Cookie 池中混合在一起，并以无数种方式被抽走并转售。\n\
  \n在移动端 App 中，这种数据“大混斗”并不存在，因为所有数据都孤立在生成这些数据的 App 内部。如果你在 `Candy Crush Saga` 中玩到了第\
  \ 47 ，在 `Redfin` 房地产 App 上搜索过房源，或者在 `Amazon` 的移动电商 App 上买过东西，这些数据就生于死于这些 App 内部，永不离开。这意味着在移动端，至少从数据角度来说，你与少数\
  \ App 建立了第一方关系，仅此而已——没有数据中间商。\n\n如果你知道移动数据是如何存储的，这其实是违反直觉的：在移动端，每个设备都有一个唯一的 ID，它与你手中持有的物理硬件相关。理论上，营销人员可以出售所有这些数据，将其与你的设备\
  \ ID 关联，然后利用它在 `Facebook` 或移动广告交易平台上对你进行投放。\n\n这种情况并没有发生，原因有两个：首先，像 `Apple` 这样的公司对其平台拥有垄断控制权，作为允许新\
  \ App 进入 `Apple App Store` 的审核流程的一部分，`Apple` 可以限制这种魔法设备 ID 的使用。通常，`Apple` 表现出对用户非常保护（史蒂夫·乔布斯对广告冷淡，甚至可以说是敌视），并且非常致力于击败任何针对数据的二级市场。\n\
  \n其次，App 开发者自己像保护自己的财产一样嫉妒地守护着数据，不愿分享，宁愿自己将数据的价值变现，而不是追求出售它们（可能卖给竞争对手）所带来的短期收益。\n\
  \n所有这些关于详细数据讨论的总结是：虽然我关于 Facebook 数据价值存疑的说法在桌面端是正确的（在 `Facebook` 出现并推销“赞”之前，桌面端已经有一个成熟且大多体面的数据市场），但在移动端完全不是如此。在移动端，投放数据是稀缺的，而且存在时质量也很差，以至于像年龄和性别这样的基础投放，对于那些一直盲目摸索、极度缺乏数据的移动营销人员来说都是天赐。当\
  \ `Facebook Ads` 推出自 IPO 以来唯一真正新新的产品——`Facebook Audience Network` 时，这一点得到了极大的证实。\n\
  \n`AN`（正如它所称的）很容易理解：它只是由 `Facebook` 数据驱动、运行在 `Facebook` 其他 App 上的 `Facebook Ads`。因此，它是对\
  \ `Facebook` 数据价值最纯净的测试。\n\n这些活动的表现（从广告商的点击率和发行者的实际变现 CPM 方面）都非常好，这表明在移动数据盲人之地，那个只了一眼睛的\
  \ Facebook 人确实是王。\n\n这是 `Facebook` 在移动端取得成功的第二个宏观原因，它再次凸显了桌面世界和移动世界之间深层的结构性差异：在桌面端，即使是像《纽约时报》这样的领先发行者在\
  \ Web 端的变现方面也面临困难，并不断尝试各种付费墙方案，以通过将纸质向数字的突发流量变现，来阻止其底线的持续流血。结果，高质量的发行者通常将广告作为支柱，帮助其尚未想通商业模式的数字业务变现。对于广告商来说，这意味着即使是《时尚杂志》和《纽约时报》这样的顶级发行商，广告库存也是触手可及的。\n\
  \n在移动端，领先的 App 发行者（主要是游戏公司和少数移动电商公司）擅长用户变现，他们依赖于 `App Store` 代表的门禁控制和支付便利性（例如，“下载需要\
  \ $3.99，你不喜欢就滚蛋”），以及一种精明的变现文化。那些从报业转型的数字发行者在试图理解“互联网这玩意儿”时，还在擦手上的墨水，而领先游戏公司内部的营销人员对他们的\
  \ `CACs` 和 `LTVs` 清楚到小数点后三位。结果，唯一使用广告变现的移动 App 是那些无法说服用户付费的免费、垃圾长尾游戏，或者是将变现外包给现有网络和交易平台的二线社交网络。例如，在很一段时间内（可能现在也是），最受尊敬的移动广告交易所中最大的广告库存来源是\
  \ `Grindr`，这是一个同性恋交友 App，上面充满了半裸男子为了临时性行为而摆拍的无尽自拍。你想为你新款牙齿白剂的广告投在一个滥用类固醇的壮汉拉着他半勃起的阴茎的图像下方吗？我想没没有。\n\
  \n此外，正如你可能注意到的，移动端的广告格式要么是微小且具有微妙侵入性的（例如屏幕底部边缘那些闪烁的小条，阻碍你滚动），要么是巨大且烦人的（例如被称为“插屏广告”的全屏覆盖）。\n\
  \n这意味着，虽然在桌面端，具有吸引人格式的高质量发行者在与 `Facebook` 竞争，但在移动端，可选择非常匮乏。非侵入性但时尚的广告，与你朋友的有机内容完美结合，出现在像\
  \ `Facebook` 这样的 App 体验中（它具有极高的关注度和疯狂的参与率，Facebook 新闻消息的点击率轻松达到个位数百分比），是非常有竞争力的。这意味着\
  \ Facebook 从一开始就拥有移动端优势。\n\n这些活动的表现（从广告商的点击率和发行者的实际变现 CPM 方面）都非常好，这表明在移动数据盲人之地，那个只了一眼睛的\
  \ Facebook 人确实是王。\n\n\n\n\n当时，多位内部人士向我透露了他们对该策略的担忧：变现 `News Feed`（信息流）终有终结的一天，到那时\
  \ Facebook 该怎么办？内部甚至有预测在估算那一时刻何时会到来——当这些广告领域的先驱们到达了这片新广告大陆西缘的太平洋时，就会意识到这片土地的狂热和收入暴涨已经结束。\n\
  \n但，意料之外的事情再次发生了。\n\n即使在广告已经完全渗透到普通用户的移动端体验中后，Facebook 的收入也没有停止增长。鉴于卓越的表现，广告商预算的增加推高了对这种如今相对稀缺商品的需求。得益于\
  \ `Optimization` 团队持续的工程进步，以及来自 `News Feed Ads` 等产品的新数据，Facebook 在移动端广告投放方面正变得越来越出色，仅凭纯数学模型就驱动了收入增长。察觉到未来的趋势后，Facebook\
  \ 重新调整了整个 `Ads` 团队，专注于移动端，挤压每一个大小的广告主，让他们在 Facebook 移动广告上投入尽可能。这是那种在速度和专注度上令人叹为观止的瞬间转型之一，其灵活性在过去多次拯救过\
  \ Facebook，公司完全可以为此自豪。在同规模的上市公司中，如果有的话，可能没几家能完成如此突然的航向调整。\n\n即便在近乎纯移动端的 Facebook\
  \ 急然崛起之后，即便在那片新的像素领地被卖给出价最高者之后，Facebook 的收入继续增长，取悦了投资者并推推着股价不断攀升。当然，这一切在 2013 年初还根本没有任何任何迹象（无论\
  \ Facebook 现在如何声称），当时书中描绘的、Sheryl 会议室里的自尊心斗争正进行得如火如荼。\n\n然而，这就是硅谷成功的本质：你尝试十种方法，大多基于随机的直觉、少数关键的产品洞察以及你们文化所推崇的任何内部神话。其中七个遭遇了惨败失败、被停止，并很快被悄悄扫入“永恒今天”的遗忘地毯下。两个表现尚可，或或少是因为你所想的理由，但它们并没有让你的成功指标实现突破。而另外一个，由于你只有在事后才发现的原因，变成了一个巨大的、变革性的成功。健忘的科技媒体围绕这些过程编织了叙事谬误，从目光坚毅的产品构思到完美无缺的技术执行，编造出一个虚构的戏剧性弧线。原本在那个踉跄的半盲者手中发生的极概率横财，变成了坚定的远见者必然的胜利。世界封你为天才，而你也开始表现得像个天才。当下一次使用量或收入危机来临时，你重复这个实验，在硅谷的大桌上投掷你的产品骰子。在某一点，你没有找到解决危机的赢家，庄家收走了你剩下的筹码，你就破产了。公司倒闭，你的\
  \ Logo 被回收，作为企业死亡的提醒。然后所有人都疑惑这样一个公认的天才怎么可能失败，并思考人才的转瞬即逝。\n\n那一天也将降临 Facebook。在某些方面，它已经发生了；Facebook\
  \ 只是花钱买开了它。\n\n### 战略收购\n\n2012 年，一个名为 `Instagram` 的照片分享应用向扎克伯格展示了他从未过的东西：一条用户增长曲线——持续向右上方延伸——看起来像\
  \ Facebook 自身流星般的早期增长。在跨越整个周末的谈判后，Facebook 以 10 亿美元收购了它，击败了 Twitter 自己的 `Jack Dorsey`，据报道后者此前几个月一直在追求\
  \ `Instagram` 的首席执行 `Kevin Systrom`。\n\n2014 年，另一个应用也可以吹嘘出同样令人生畏的增长曲线，而且用户数量更多。`WhatsApp`\
  \ 在美国较少为人知，但在海外几乎与短信（SMS）成为同义名词，它利用一个规模较小的团队和一个非常基础的应用建立了一个国际帝国，其独特卖点是让你的手机号码成为你的用户身份。就像\
  \ Instagram 一样，扎克开启了职业模式，诱惑了 `WhatsApp` 的创始人 CEO `Jan Koum`，并在 2014 年 10 月以 190\
  \ 亿美元的令人惊舌的价格收购了这家公司。\n\n这两个应用——一个用于文青风、带有色彩滤镜的照片分享，另一个用于在短信费用昂贵的价格敏感型市场中进行平实的聊天——是大公司往往会错过的完全全新的市场方向。`WhatsApp`\
  \ 和 `Instagram` 卖掉了，但总有一天会到来，一个横跨全球应用的领导者——这种通过电子和无线电波进行*智人* 交流的新范式——将被证明像扎克伯格本人一样固执和傲慢。到时候，Facebook\
  \ 将无法通过花钱摆脱麻烦，而是必须通过构建来解决，这要困难得多。\n\n### FBX 的兴起\n\n关于这场戏中的宝贝 `FBX` 又是怎样的？\n\n`FBX`\
  \ 的收入在我 Facebook 任期结束时刚刚显示出爆发性增长的迹象，在我离开后的几个月进入了正轨，到 2014 年初达到约 5 亿美元，这一切完全是。这意味着\
  \ `FBX` 是 Facebook 历史上增长最快的新产品之一，仅次于上述的 `News Feed` 横财。而且它是由少数人开发的，而 `News Feed`\
  \ 广告则需要一支军队来创建和维护。\n\n除了在（现在）零工程投入的情况下产生大量收入收益外，`FBX` 还作为 Facebook 观察日益程序化世界的窗口。有了\
  \ Facebook 墙上的这个缺口，就像高盛观察所有的买卖订单一样，广告团队可以解读竞争对手并构建出替代品。然而，通过选择性地暴露跨设备身份和移动端库存（Facebook\
  \ 世界的瑰宝）于自己的产品，Facebook 正在引导广告商使用其笨拙的替代品，而不是深受推崇的 `FBX` 技术。尽管存在持久的对立，`FBX` 依然顽固地存在，利润丰厚且具有战略意义无法关闭（至少目前如此），这让广告部门的那些人对此感到非常沮丧。\n\
  \n我现在说这些是为了以后打他们的脸：最终 Facebook 将不得不完全支持所有库存的程序化交易所。他们处于技术历史错误的一侧；人类欲望与在线资本的实时互动将长期存在。\n\
  \n该，甚至华尔街也看清了形势。记得我们描述过危机后高盛考虑但拒绝了在交易所交易信用违约的想法吗？那是衍生品市场不可避免的演进。2013 年，高盛最终与洲际交易所\
  \ (`ICE`) 合作——这是一个交易从燃油到橙汁一切产品的先锋电子交易所——通过 `ICE` 为高盛客户结算欧洲信用违约交易。也许 Facebook 有一天会证明自己是像高盛一样的领导者和创新者。\n\
  \n\n\n\n当 Google Plus 的灵魂人物 Vic Gundotra 突然宣布离开公司时，Google 发出了投降的信号。Facebook 内部响起了“当当当，巫婆死啦”的胜利欢呼，每个人都为这一威胁的消失而松了一口气。\n\
  \nVic 的离开是一个再明显不过的信号，表明 Google 已经放弃了社交领域，败给了一家此前被其忽视、甚至被公开鄙视的公司之手。当公司同时宣布，许多 Google\
  \ Plus 产品团队（例如聊天应用 `Hangouts` 或照片分享应用 `Photos`）将被并入 Google 的移动操作系统 `Android` 团队时，这一点得到了进一步证实。Google\
  \ 将其美化为 Google Plus 不再是一个“产品”，而是一个“平台”，一种通用的工具，旨在增强用户跨越 Google 广泛系列产品的使用体验。\n\n\
  这就像一位将军宣布他的军队并没有在撤退，而是在“倒退式前进”。Facebook 的每人都看穿了这种保全面子的公关辞藻游戏。Google Plus 结束了；Facebook\
  \ 赢了。这种围墙结阵的防御策略取得了胜利。\n\n## Twitter 大军\n\n关于穿蓝连帽衫的人够了。那 Twitter 大军呢？\n\n2016 年\
  \ 1 月，正当本书即将完稿之际，Twitter 经历了又一次高层管理变动，就像它所闻名的、某种东方独裁者的宫廷政变。`Kevin Weil` 和 `Alex\
  \ Roetter` 是我们在 `AdGrok` 交易中的最初联系人，他们升任负责工程和产品这两个双引擎公司引擎，随后立即离开了 Twitter，还有其他一些高级高管。令人震惊的是，`Weil`\
  \ 离开去担任 `Instagram` 的产品负责人，这是一家与 Twitter 明明竞争的 Facebook 公司，当时 Twitter 的用户量正处于危险的平台期。`Adam\
  \ Bain` 留在 Twitter 担任 `COO`，而 `Jess`——那个引发了整场 `AdGrok` 剧变的女人——继续在 Twitter 负责企业发展，像买罐头西红柿一样买入公司和人才。硅谷的那些“无状态机器”依然在转动。\n\
  \n## 前 AdGrok 成员\n\n截至 2016 年 3 月，这帮哥们还是 Twitter 的工程师，并且已经获得了他们四年的期权承诺。考虑到邀约金额、这些期权享有优惠收税待遇、Twitter\
  \ 在 `IPO` 锁定期结束后很久才突破每股 `$50` 的事实，以及他们作为高绩效员工获得的额外股权奖励，他们的最终收获确实非常丰厚。\n\n`MRM` 毫无困难就能还清房贷，不再担心孩子的大学学费，并终于过上此前在科技行业二十年未曾赋予他的闲适生活。\n\
  \n`Argyris` 方面，如果他想要，可以在雅典实现那个咖啡馆加唱片店的幻想，而且远不止于。`Simla` 和他很快就会孩子，在旧金山和雅腊各买公寓，并过上典型的旧金山科技精英的特权生活。\n\
  \n我们现在还算保持着联系；`Argyris` 和我的关系比 `MRM` 多得多，但根据你读到的内容，这并不意外。他们设原了由于我制造的那场交易剧变给他们造成的任何冒犯。毕竟，最后对他们来说结果非常好。\n\
  \n## 我的结局\n\n相比之下，几乎一无所有。\n\n回想一下，Facebook 的报价是受限股票，按普通收入征税。\n\n同样回想一下，Facebook\
  \ 的 `IPO` 与 Twitter 不同，它以 `$38` 的高价上市，然后在 `$30` 左右徘徊了一年，偶尔跌至 `$18`。那次 `IPO` 对于担心稀释的员工和内部人士来说是极好的，但对于想要套现（像我这样）并离开硅谷赌场的人来说并不是。由于锁定期限制，内部人士在\
  \ `IPO` 几个月后才能出售股票，那时 `FB` 的价格只有 `$20`。因此，假设成本基础为 `$38`，我按最高边际税率（加上巨额加州州税）缴税，而我实际上是以低价卖出的，相当于为没赚到的钱交了税。从小处说，这也是第一批科技潮中破产者的困境：他们在价格高时交税，却在价格便宜时卖出股票。\n\
  \n我通过 Facebook 股票获得的那些虚假的 `AdGrok` 收益相对较少。那三年无休止的每天 16 小时的挣扎，无论是为了 `AdGrok` 还是为了\
  \ `Facebook`（而且讨厌其中大部分时间，显而易见），大多都是徒劳。所以你看，这帮哥们和我面临着完全不同的财务未来。\n\n部分原因归于科技行业薪酬的复杂变幻和公共股价的随机波动。但大多数情况下，这是因为我在两年内被\
  \ Facebook 的机器嚼碎并吐了出来，而这帮哥们却在 Twitter 那片田园诗歌般的文青牧场上博弈了四年且仍在持续——那里正是我竭力挣扎和策划想要避开的地方，而我为了它换取了一场恐怖秀，尽管我为他们创造了赚钱机器，他们却无情地拒绝了我。谁说因果报不存在？\n\
  \n## 转折点\n\n说到不公的报应，生活很快发生了转折，如果没有这次转折，你就读不到这本书。2014 年夏天，我母亲被意外诊断出肝癌，我睁睁看着她——起初缓慢，然后突然去世。一阵来自坟地的微风突然吹过了那些覆盖在“某一天”的尘埃中的青春梦想，让它们重新闪发出最初的光芒。我退出了所有的职业义务，卖掉了一切，投入到两个全心投入注的目标中：第一，完成你手中的这本书，它的最初草稿可以追溯到过去，但它的完成需要一年的流浪写作和编辑。第二，驾驶一艘小船环绕世界。这是一个从小就开始培养的梦想，那时我白天在比斯凯湾驾驶我的\
  \ `Optimist` 小船，晚上读着罗宾·李·格雷姆的冒险故事。`Graham` 是一位美国海员，他在 1970 年在一艘名为 `Dove` 的 24 英寸船上完成了单人环球，成为完成此类航程的最年轻的人。\n\
  \n为了这个目标，当我终于凑齐了最基本的资金时，我先后准备了两艘用于这种航行的船，随后在书中描述的事件期间疏忽地让它们在码头腐烂，一次是为了 `AdGrok`，另一次是为了\
  \ `Facebook`。这些船随后被卖掉，既是为了掩盖我对船舶和个人抱负的忽视，也是为了收回成本。\n\n在我母亲去世不久，我买了一艘坚固的 40 英尺横桁帆船。那艘船就像我的女儿一样（以第一个进入金山山的欧洲人命名的\
  \ `Ayala`），将不会遭受同样的命运。通过 2015 年，我度过了蜷缩在屏幕前的马拉松式写作时光，穿插着在 `Ayala` 甲板上工作的尘土的日子，安装或修理某件昂贵的海洋设备。引用西奥多尔·赫茨尔的话：“如果你渴望它，它就不是梦想；如果你不渴望它，它将永远是一个梦想。”将梦想变为现实正是企业家和产品经理的意义所在；而这一次，它们终于成了我自己的梦想，而不是纯粹的公司或逐利性梦想。\n\
  \n就这样，我从这个偶然闯入的舞台谢幕，希望如此，并消失在太平洋的汹涌波涛中，那是我们将失去的唯一逃离社交媒体的避风港。\n\n华盛顿州，奥卡拉斯岛\n\n###\
  \ 致谢\n\n感谢 British Trader，她不仅承担了抚养孩子的大部分责任，还在我们最艰难的时刻提供了宝贵的建议。遗憾的是，家庭就像船只，只能容一位船长。\n\
  \n\n\n\n感谢以色列心理学家，我在书中关于 Facebook 的那部分里长期受苦的伙伴，若没有她温暖的照料，我永远无法挺过那段地狱般的经历。正如你们的人曾经写过的：“才德，谁能得着？她的身价远胜于珍珠。她口出智慧，仁爱的律法在她舌上。”你无尽的仁慈本值得一个更有价值的目标。\n\
  \n最后在伴侣方面，感谢法国建筑师，她是第一个阅读手稿的人，并在我处理截止日期时，她非常耐心地应对了她的怀孕。我怀疑你对这一切的看法，正如你们的同胞拉信所写道：“在经历了如此难以忘的甜蜜之后。那个如此珍视我的人，竟然背叛了我！噢！我太爱他了，以无法恨他。”\n\
  \n献给我们那永无止境的爱恨，它们总是如此热烈，如此令人陶醉。\n\n老话说，人生是一场马拉松，而不是一场短跑。而这本书这两者兼具。从达成交易到制作成实体书花费了十个月，这段时间大约是\
  \ `AdGrok` 创立到卖出的时长。之所以能如此迅速开局，要归于我的经纪人斯隆·哈里斯（Sloan Harris），她从第一刻就看到了这部作品初期的潜力。无论是在华尔街还是硅谷，我从未见过在斯隆的精通代理下比\
  \ `Chaos Monkeys` 包装得更好、卖得更好的产品。\n\n感谢 HarperCollins 出版的詹妮弗·巴斯（Jennifer Barth），我的编辑，她优雅且专业地处理了我那放肆的文笔和性格。如果没有她的“巨大”帮助（包括删掉十几个“massive”一词的使用），`Chaos\
  \ Monkeys` 的可读性会减半。\n\n如果 `Chaos Monkeys` 有一个戏剧性的概念瞬间，那是凯特·李（Kate Lee，时任 ICM 代理，现任职\
  \ Medium）给我发邮件，关于我第一篇爆火的 `AdGrok` 博客文章，建议我写本书。谷歌将那封邮件归类为垃圾邮件，我只是随机搜索被拦截的邮件才发现了它。如果我没那么做，你就看不到这些文字了。感谢凯特·李最初的鼓励、多年来的温柔催促，以及对我早期\
  \ Medium 文章的编辑（其中一些内容最终出现在这里）。你真正培育了那个想法，使其从一个单纯吸引眼球的博客变成了一本书。\n\n写作的背景延伸自硅谷（通常是在相关事件发生后愤怒地打字），到几个月或几年后在巴塞罗那、柏林和华盛顿州奥卡斯岛的沉思式涂鸦。\n\
  \n特别感谢圣胡安群岛西北之冠上的那颗翡翠：奥卡斯岛（Orcas Island）。它是如此美丽而迷人，这个马蹄形的避风港是理想的作家隐居地，拥有崎岖的山峰、翠绿的森林、多风的海域和温暖的当地人。不要改变，奥卡斯；你是后现代互联网时代所有疾病的解药。\n\
  \n特别感谢华盛顿州贝灵 Aslan 酿酒厂的大师们，他们的 `Batch 15 IPA` 是本书大部分写作期间阴暗多雨的太平洋西北部冬季主要的精神食。没有了那种啤酒的柑橘酸味，`Chaos\
  \ Monkeys` 的长度会减半，趣味也会减半。\n\n我希望能以某种方式感谢硅谷生态系统本身：投资者、科技媒体、律师、线人、顾问，以及我在这些页面中交替结交或诋的各种人物。直说吧：我们的关系是纯粹的便利，我利用了你们，正如你们利用了我。正如人们所说，理想的交易是双方离开时都觉得稍微被坑了。为我们完美的交易干杯。\n\
  \n感谢马特·麦肯（Matt McEachen）和阿格里斯·齐姆尼斯（Argyris Zymnis），我在创业战壕中的战友。我告诉过你们，这个 `Y Combinator`\
  \ 会大火的。\n\n感谢保罗·格拉姆（Paul Graham）、杰西卡·利文森（Jessica Livingston）、萨姆·奥特曼（Sam Altman）以及其他参与\
  \ `AdGrok` 传奇的 `Y Combinator` 合伙人和创始人。在这个充斥着巨大的贪婪和伪装成慈善创机会主义的硅谷世界里，你们是我遇到过的唯一的忠诚与理想。\n\
  \n最后，感谢我以前 Facebook 的同事们，他们为这本书提供了如此有趣的群像，并占据了我两年的生命。你们中的许多人会在出版后无疑将我逐出。记住：比被议论更糟糕的事是不被议论。你们觉得在\
  \ 2116 年，他们会对 Facebook 说什么（如果有的话）？在愤怒点击“删除好友”按钮时，思考一下吧。\n\n## 索引\n\n本电子版的页码与其创建的版本不匹配。要找到特定条目，请使用您电子书读器的搜索工具。\n\
