  \ Twitter 本身在 2006 年诞生的地方，是在公园的一个滑梯上举行的一次脑风暴会议期间产生的。这种讽刺是极其显眼的。\n\n在有些尴尬的犹豫和对绿色桌面的低头观察后，我们终于开始交谈。可能第一次，我让兄弟们面对一个事实：自从发布前近一个月以来，我们没有发布过任何东西，而且团队技术方面的投入似乎在减弱。考虑到\
