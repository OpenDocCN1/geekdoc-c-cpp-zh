- "# 混沌猴子：硅谷的暴利财富与随机失败\n\n\n\n\n\n\n## 作者的话\n\n本作中描述的事件（除纽约的一个场景外）均发生在 2010 年 3 月至\
  \ 2014 年 10 月期间的旧金山地区及周边。此叙述基于当时的存档邮件、Facebook 帖子和消息、推文以及博客文章。任何引用自邮件、短信或消息的对话均为逐字记录。如果是引用自对话或电话，，则是根据记忆重建的。虽然这些重建并非完全精确，但我已尽力捕捉每个描绘场景的精神和意义。对于那些可能在在场但认为我误解了事件的人，我邀请你们写下自己的竞争性叙述。共同努力，我们可能会达成一套被称为“历史”的共同的谎言。\n\
  \n注：为了保护真正的罪犯者，文中省略了一些名字。\n\n## 献辞\n\n致我所有的敌人：\n\n没有你们，我无法完成这一切。\n\n致 Zoë Ayala\
  \ 和 Noah Pelayo，\n\n你们是我交付过的唯一持久的产品。\n\n最后，致 Rachel Caïdor。\n\n*Lo prometido es\
  \ deuda.*（承诺必行。）\n\n\n## 序言：分叉路的花园\n\n——归于卡斯蒂利的阿尔方索·X 世，“智者”\n\nFacebook 高层指挥部区域是一个完全普通的办公桌集群，仅因为萨姆·莱斯辛（Sam\
  \ Lessin，扎克的部下之一）存放的一堆体育器材而显得与众不同。类似的桌集群像树篱丛一样排列，向视觉所及之处延伸到 16 号楼构成的巨大 L 型建筑的两个分支。装修是标准的硅谷科技风：工业风长毛地毯、露出的通风管道和覆盖有阻燃涂层的钢梁的裸天花板，以及偶尔的自制装置艺术品：一面令人威严的乐高墙，上面有员工留下的积木状壁画；另一面墙则贴满了内部打印店生产的、带有模糊奥威尔风格的海报。\n\
  \n在 16 号楼的精确转角处是“水族馆”（Aquarium），这是 Facebook 的玻璃墙王座，扎克格每天在这里坐镇。它伸入主庭院内，让路过的 Facebook\
  \ 员工在散步去午餐时可以瞥一眼领袖。据报道，它的窗户是防弹的。“水族馆”入口外是一个临时大厅，配有沙发和几本时尚的咖啡桌书，而时刻守候的 Facebook 廷臣们却顾不上这些，正忙演示文稿或演示进行最后的微调。与“水族馆”相邻的一个微型厨房像园区内随处可见的厨房一样，储备了充足的柠檬味运动饮料，这是扎克的官方饮料。\n\
  \n在 Facebook 园区内，地理位置决定命运，你与扎克的物理距离近远说明了你的重要性。L 型建筑的边缘分布着 Facebook 五位业务部门领导的专属会议室。扎克的办公桌邻居是谢丽尔·班德格（Sheryl\
  \ Sandberg，Facebook 首席运营官 COO）、安德鲁·“波兹”·博斯沃（Andrew “Boz” Bosworth，新闻流的工程总监）以及迈克·斯科罗普弗（Mike\
  \ Schroepfer，Facebook 首席技术官 CTO）。那天下午，当我从庭院走进来时，他们都没有坐在办公位上。\n\n\n\n\n\n### 背景\n\
  \n与 Facebook 许多面向用户的部门不同，广告团队被隔离开远，就像是一双流汗的内裤，被安置在另一栋楼里。这种情况最终会改变，广告团队的成员将占据扎克（Zuck）和谢尔尔（Sheryl）办公桌附近的黄金地带。不过，那是很久之后的事，我被拉入的高级管理层会议都需要在地层穿过庭院。\n\
  \n这个“Facebook 香榭丽舍”的中心是 `H-A-C-K` 这几个字母，它们实际上镶嵌在构成庭院的混凝土板中，长度至少有一百英尺。这些字母的角度为了在\
  \ `Google Maps` 的校园卫星图像上清晰可见，看起来就像是 Facebook 人的最高戒律。\n\n我今天的任务是与扎克开会，会议安排在谢尔尔的会议室举行，由于某种我从未探明的原因，那个房间被命名为“只有好消息”。我绕过行政办公桌周围的一堆运动器材，走进了会议室的玻璃方块。房间里有一张长长的白色桌子，两侧放着几十把昂贵的\
  \ Aeron 椅子，一面墙上是平板显示屏，另一面则是白板。除了最重要的两个人外，大多数与会人员都已坐好。\n\n# 与会人员\n\nGokul Rajaram\
  \ 是 `Ads` 的产品管理负责人也是我的老板，他正以他常有的抽动、焦虑的姿态缩着身体；他从不离手的手机中分出一纳秒的时间，抬头看向我。Gokul 旁边坐着\
  \ Brian Boland，一个留着平头、秃顶的男人，想象他大学时期可能打过摔跤，舒适的企业生活让他变得中年发福。Boland 负责 `Ads` 团队的产品营销，该团队负责在任何\
  \ `Ads` 产品交给销售团队之前，为其包装上一层厚厚的、润色过的废话，然后由销售团队再将其推给广告商。\n\nGreg Badros 坐在稍远处，盯着他的手机，他曾是\
  \ Google Google 员工，负责过 `Search` 和 `Ads`，但在这两个领域似乎都与其缺席多于出席。Mark Rabkin 是 `Ads` 的工程经理，也是\
  \ Facebook 广告团队的早期员工，职级和态度上与我最近。从我加入 Facebook 的第一天起，他就是我的密切合作者，他像一个没那么邪恶版的弗拉基米·普京。Elliot\
  \ Schrage 坐在他的常位，靠近桌末右侧。Schrage 拥有一个听起来很高大且模糊的头衔，但在所有事务上都是谢尔尔的顾问。他五十多岁，穿着纽扣衬衫和“商务休闲”风的长裤，在这一群穿着抓绒衫和牛仔裤的技术大咖中显得格格不入；他可能被误认为是东海岸某家老牌事务所的高级律师——这正是他在加入\
  \ Google 和“谢尔尔圈”（Sherylsphere）之前的职业。\n\n我在谢尔尔那群亲信的对面的另一端坐下，打开了 Facebook 配配的 `MacBook\
  \ Pro`，紧张地提醒自己会议的提纲。议程是向扎克推销我构思的三个新广告投放想法，这些想法构成了公司（希望）很快进行的一项重大变现赌注。\n\nCamille\
  \ Hart 是谢尔尔无所不能的行政助理（或 `admin`），她四处走动，在笔记本电脑上敲击着，协调着参会者。\n\n# 会议动态\n\n“费舍尔在哪？”谢尔尔推门而入，坐在桌子末端问道。\n\
  \n如果没有 Elliot Schrage 和 David Fischer 这两个“小团体”（minyan，她从 Google 挖过来的随从），会议就无法开始。Camille\
  \ 冲出去去找他。\n\n大多数人保持沉默，摆弄着手机或笔记本电脑。Boland 和谢尔尔低声商量着我们即将演示的幻灯片状态。我们已经向她预演过我们的产品，并调整了话术以最大限程度地吸引扎克。任何涉及\
  \ `Ads` 的扎克会议都需要经过一些“预嚼”和“投喂”。原因很简单：当时 `Ads` 并不是他关心的事，我想他把这些会议更多看作是义务性的苦差，而非其他。在\
  \ Facebook 广告部门的一年里，我只见过一次这位以极端微观管理闻称的创始人兼执行官出现在 `Ads` 领域：那是他正绕着大楼走圈，以完成他每日万步的目标。这与从\
  \ Facebook 面向用户端的产品经理那里听到的八卦形成了鲜明对比——当在一个扎克关心的产品上，人们所处的光芒中心是多么令人枯萎。\n\n在我们的会前会议中，谢尔尔透露了关于展示我们计划最佳方式的各种暗示。她对她的老板了如指掌。这位女性非常擅长担任强势而强大的男人的守门人和牧羊人，无论是担任刺头的美国财政部长拉里·萨默斯（Larry\
  \ Summers）的办公厅主任，还是担任扎克的首席运营官。凭借她导航和管理 Facebook 这种复杂组织中瞬息万变且分裂的政治格局的能力，以及她为扎克塑造信息的能力，她既是事实上也是法律上运营\
  \ Facebook 广告业务的人。随着关于 Facebook 变现未来的辩论变得越来越极化和激烈，这些会议变得像谢尔尔的最高法院，那是唯一一个冲突观点可以得到发表并有望获得解决的地方。\n\
  \n费舍尔进来了：他身材消瘦，仪表堂，是 Facebook 发型最精致的男人。他最初是谢尔尔在财政部的一员，最初在 `U.S. News & World Report`\
  \ 当记者开始职业生涯，然后像许多 Facebook 的高层员工一样加入了 Google。作为 Facebook 的销售与运营副总裁，他为谢尔尔管理整个销售团队，在我在公司期间，我很少听到他除了企业陈词和\
  \ MBA 术语（`斯坦福商学院 2002 届`，`当然`）之外的任何话。\n\n\n\n\n\nFacebook “点赞”和“分享”按钮的普及，意味着在美国这样一个成熟市场中，Facebook\
  \ 已经覆盖了近半数的网页。当你穿梭于网络各个角落时，从在 `zappos.com` 购物鞋子到在 `nytimes.com` 阅读新闻，Facebook 随处都能看到你，仿佛它在所有城市街道都安装了闭路电视。Facebook\
  \ 的服务条款到目前为止禁止将产生的数据用于商业目的，但这项大胆的提议建议取消这种自我设的限制。尽管这听起来既不吉祥又强大，但并不保证能成功，因为这些数据的实际价值是未知的。\n\
  \n对于 Facebook 数据的价值，我知一二。一年前，我被聘为 Facebook 的首位 `ads` 定位产品经理，负责通过任何可行的法律手段将 Facebook\
  \ 的用户数据转化为资金。这项任务证明比听起来要困难得多。几个月来，我与定位团队一直在测试和吸收每一条 Facebook 用户数据——帖子、签到、分享链接、朋友、`Likes`（点赞）——看看它们是否能提高\
  \ Facebook 广告的投放和交付效果。几乎没有例外，没有一项数据能使变现程度得到大幅提高。惨淡的结论是，Facebook 虽然被认为是用户数据的丰富宝库，但实际上并没有多少商业价值数据。社交插件数据尽管具有不吉祥且无处不在的特性，也可能落入同样令人沮丧的类别。\n\
  \n## 激进的提议\n\n第二和第三项提议从业务角度（而非法律角度）来看更为激进，反映了这种严峻的现实。计划是将 Facebook 的 `Ads` 体验与完全在\
  \ Facebook 之外产生的数据相结合。到目前为止，Facebook 上的所有广告都使用 `FB` 数据，但这项提议将涉及挖掘“外部”数据，如浏览历史、在线购物和实体店的线下购买。从历史上看，Facebook\
  \ 一直是一个围墙花园，广告主无法在 Facebook 上使用他们的数据或在其他地方使用 Facebook 数据。从数据的角度来看，就像 Facebook 消失在互联网生态系统中，躲在一个由自己完全控制的岛屿上。通过两种不同的技术机制——一个大致符合现有的\
  \ `Ads` 系统，另一个则复杂得多——我们正提议最终跨越这道鸿沟。这两项提议在抽象层面上是等价的；但在执行和业务层面，它们截然不同，并且对广告市场需要完全不同的方法。\n\
  \n## 决策会议\n\nZuck（扎克伯格）和 Sheryl（莎莉）讨厌演示 PPT PPT，所以有人把我准备好的幻灯片打印出来并装成整齐的小包。Boland（博兰德）在第一页将过去几个月的辩论和会议总结成易于理解的要点。那便是所有人看到的全部。我那些详尽的技术图纸，以及数据流和外部集成点的演示说明，正如我预料的那样，完全被忽视了。Sheryl\
  \ 不会关心技术细节，而 Zuck 无论如何也没有耐心去过一遍。正如我在 Facebook 多次观察到的，正如我想象在从业务到政府的所有组织中都是如此，影响数千人和数十亿美元收入的高层决策将是根据直觉、任何历史政治斗争的残留物，以及向那些忙碌、不耐烦或感兴趣（或三者兼有）的人提供有说服力信息的能力做出的。\n\
  \nBoland 尽力演示了总结幻灯片，略去了关于隐私和法律监管的无休止辩论，这些讨论消耗了每个人无数的时间。如果广告已经让 Zuck 昏昏欲睡，那么隐私权衡会让他从他的\
  \ Aeron 人学椅上摔下来。无论 Zuck 批准什么，我们来通过工程实现法律运作。\n\n“所以，我们认为使用插件数据会让我们赚更多钱吗？”Zuck 问。\n\
  \nBoland 和 Gokul 转向我，这通常是给房间里级别最低但信息最丰富的人——即实际的产品经理——发话的信号。\n\n我的大脑反应就像冬日里的一辆旧卡车，无法启动，徒劳地空动着。\n\
  \n“嗯，这取决于 . . . . 我的意思是，影响变现的因素有很多。我们还没有真正做过控制的 `A/B` 测试，因为这在法律上很敏感，但这些数据在某些方面可能是独特的。当然，还有关于\
  \ `Like` 按钮在数据维度上是否处于我们想要的位置的问题，因为——”\n\n“你为什么不直接回答问题？”Zuck 脱口而出，打断了我。\n\n恐慌产生专注。\n\
  \n“考虑到最近的经验，我认为它不会产生太大影响，”我平淡地回答道。\n\n沉默，我们都在等待 Zuck 会说什么。\n\n“你可以这样做，但不要用‘Like’按钮，”他终于说道。\n\
  \n这句话在房间里弥漫。\n\n“所以对重定向（retargeting）说可以，但反对使用社交插件，”Sheryl 重申道，与其说是断言，不如说是问 Zuck。\n\
  \n“对。”\n\n这就是他关于这件事所说的全部。\n\n仍然未决定的是 Facebook 将追求两项提议中的哪一个。一年后，在同一间会议室里，聚集大致相同的人员，我们终于决定了那个问题。Facebook\
  \ 花费了令人抓狂的一年才决定“是否要决定”。当最终决定出来时，将导致我被踢出 Facebook，并改变未来多年 Facebook 获钱的方式。\n\n但在那时，在那个周五的下午，我内心非常兴奋。最后两个月的计策终于奏效了。我们可以构建我所提议的那个魔法定位设备，它将结合两个伟大的互联网数据流——Facebook\
  \ 和外部世界，并改变一切。\n\n我看了 Gokul 一眼，他点点头。Sheryl 转向议程上的下一项。这是她与 Ads 团队以及 Zuck 之间的每周会议。产品评审被排得满满当当。其他产品经理进入房间，等待轮到。我尽可能谨慎地离开\
  \ Aeron 椅子，滑出门门。我接到了行动指令。\n\n***\n\n# 第一部分\n\n## 扰乱和平\n\n人类生活中痛苦和混乱的根源，似乎源于对一个永久处境与另一个之间差异的高估。贪婪高估了贫穷与财富之间的差异；野心高估了私人地位与公共地位之间的差异；虚荣高估了无名与广泛声誉之间的差异。受这些极端情感影响的人，不仅对其实际处境感到痛苦，而且往往为了达到他所愚蠢崇拜的东西而扰乱社会的和平。\n\
  \n——亚当·斯密，《道德情感论》\n\n***\n\n# 资本主义的承办者\n\n`商业信用`是现代的产物，其最高境界仅属于那些最开明、治理良好的国家。它建立起了军队，装备了海军，并在战胜了纯数字的力量后，在智慧、财富和良好的经营的基础上建立了国家优势。\n\
  \n—丹尼尔·韦斯特，美国参议院演讲，1834 年 3 月 18 日\n\n***\n\n2007 年 11 月\n\n“嘿！现在的风险如何？”\n\n我从四排覆盖着蓝色代码流窗口的显示器前抬头，那是一个只有少数人能理解的金融矩阵，但其输出结果驱动着世界的运转。说话的人是\
  \ Jonathan Mann，在交易员术语中被称为 `JMann`。他肩上架着一根高尔夫杆，双臂搭在两，像一个亵渎的金融基督。\n\n\n\n\n信用利差——即全球最大公司的\
  \ FICO 评分——正在爆炸式增长，这意味着世界的金融信仰正在萎缩。“被钉受刑”是一个非常恰当的比喻。\n\n“不确定。我们会调查的，`JMann`，”我回答道，几乎没有从我的四块电脑屏幕上抬起头。他布满血丝的眼睛盯着我看了，然后退回到自己的办公桌旁，那上面的屏幕比我的还要多。\n\
  \n`JMann` 在高盛工作，交易信用指数。这些指数本质上是对大型公司信用押注的集合，类似于共同基金。与股票世界不同，信贷世界的定价并非取决于对未来价值的某种模糊预感，而是取决于对企业破产的未来概率的感知。在信贷的领域里，一直以来只有葬礼，没有婚礼或婴儿洗礼派对。通过赌注死亡，我们是博彩的殡仪师，赌这家或那家公司是生是死。\n\
  \n不过，`JMann` 故障的指数并不是我的真正问题。通用汽车是我的问题。西南航空是我的问题。福特汽车是我的问题。我透过屏幕看向 Charlie McGarraugh，这位耶鲁大学的数学系研究生交易航空公司和汽车公司。我是他的量化男仆，为那些支付我们奖金的晦涩衍生品构建复杂的定价模型，并维护数据的顺畅流动，以便我们洞察这个残酷的世界。像今天这样的日子如往常一样，他正处于一种焦虑交加的状态，大声叫喊着报价，要么是对大厅的人，要么是对着电话耳机大喊。他的初级交易员\
  \ Rob Jackson 坐在他旁边，向风险系统输入交易，由我编写的代码进行消化，产出定价模型，让交易员们在这个危机万足的世界中穿行，并引导更多的交易。\n\n\
  美国航空的全额信誉和信用价值值几何？无论 Charlie McGarraugh 怎么说，它就值多少钱，因为他是高盛航空信贷市场的“做市者”。作为公众认知的经纪人，他既是市场的渠道，也是市场的驯兽师，他虽然受到自己无法控制的市场力量的冲击，但同时也根据他掠夺性的设计在扭曲市场。\n\
  \n两年来，Charlie 一直在赌注美国贫弱汽车行业的衰落，以及几家航空公司的终结。我们离真正的巨额横财，只差一次类似福特 Pinto 式的安全召回，或者几个月的高昂航空油价。人们完全可以想象如果\
  \ Bloomberg 终端上闪过一条美航飞机坠山山的新闻，Charlie 那张苍白的脸上会露出怎样的讽刺微笑。多亏有我，他可以确切地知道如果发生那种事我们会赚多少钱。但尽管住房信贷危机日益严重，汽车和飞机等行业仍然具有信誉价值。那些该死的飞机依然停留在空中，油价保持低位，没有人搞清楚\
  \ 2008 年的庞特 Vibe 到底是个什么破东西。\n\n即使在大厅里每个人都被恐惧和贪婪的持续抽搐支配，理性偶尔也会胜出。就像一个落魄的酒鬼在另一场宿醉后的迷雾中凝视着沾满呕吐渍的床单，你偶尔会问自己：我是怎么变成这里的？我怎么能这样对待自己？人性在哪里？\n\
  \n在伯克利物理学博士项目中挣扎了五年后，我加入了高盛。那时，我的研究生津贴（还需缴纳所得税！）是 19,000 美元的这笔巨款。\n\n2005 年高盛的平均薪水为\
  \ 521,000 美元，这还包含了工资单上的每一个交易员、销售员、投资银行家、秘书、邮件员、擦鞋匠和擦窗工。我从那间肮脏的研究生宿舍里带走的少数东西之一，是迈克尔·刘易斯的《谎言者的扑克》，那是华尔街交易类的经典，作为参考。\n\
  \n### 我入职时的工作是什么？\n\n我是高盛企业信用交易台的定价量化师。这意味着我负责为全球最大的信用交易机构交易各种信用衍生品建模和定价。稍后我们会介绍什么是衍生品。在高盛，“什么”比“谁”更重要。\n\
  \n高盛在华尔街银行中与众不同之处在于它大多保持着合伙人制管理结构。因此，每个入职员工都是由特定的合伙人雇用的，你是那个合伙人的的人。我的封建领主是一个矮矮、秃顶、眼神犀利且名字异常圣经化的人：`Elisha\
  \ Wiesel`。`Elisha` 正是 `Elie Wiesel` 的独子，后者是著名的大屠杀幸存者，其恐怖的著作《夜》是许多美国高高中生的必读物。他的父亲可能是大屠杀领域的巨人和公共知识分子，但他的儿子是一个残忍、贪婪的小混蛋。\n\
  \n他的副手，也就是我的老板，来自家乡佛罗里达州的加州理工学院数学系毕业生。`Ryan McCorvie`（根据内部消息系统中每个人通用的三个字母缩写，他被称为\
  \ `RTM`）高高且瘦长，细细的手臂从一个大肚子的外胚型体躯中伸出来。他唯一的一点个人色彩是前臂上的无限大符号纹身，在高盛工作时会刻意盖住。\n\n### 这场戏中的其他人物\n\
  \n交易员们狡猾且机敏，但技术造诣很低，注意力集中程度像一个喝了能量饮料和软糖的 ADHD 多动症孩子。他们的角色是与高盛客户及其他竞争对手的交易员进行交易，发布买卖证券及其衍生品的报价，同时对头寸进行对冲，并用公司的钱进行明智赌注。这就像在飞速行驶的火车顶上跳踢格舞的同时杂耍火锯。\n\
  \n销售人员完全是些群蠢货，集体智商安全地处于双位数。他们唯一的作用就是诱惑和讨好客户进行潜在交易，表现出精通交易的浅薄外表，然后溜到交易员那里，为客户讨要特价。\n\
  \n而量化师——在高盛内部他们被称为“策略师”或简称为 `strats`——大多是像我这样为了金钱出卖灵魂的失败科学家，在经历了多年的高级相对论和量子力学训练后，突然发现自己一个挥着高尔夫球杆的大猩交易员正俯在肩膀上问风险报告在哪里。我们是量化赋能者，为古老的买卖业务提供现代计算的闪新祝福。但给交易员提供复杂的模型和快速的计算机，就像给青少年提供手枪和伏特忌一样。量化师唯一发光的时刻是当棘手的交易出现，困惑的交易员寻求帮助时。这些交易就像看廉价色情片中特写的插入镜头：你几乎分不清哪头是尾，哪个部分是哪个部分，或者更重要的是，到底是谁在操弄谁。\n\
  \n\n\n\n\n量化交易员是这场狂欢宴中的太监。是高层金融色情片场上的润滑剂。我们就像是每部好莱坞二战电影中无处不在的英国人：为了增添一点格调和异域风情，但对剧情并没有实质性的影响（除非只是为了方便地替某个反派挡几子弹）。\n\
  \n回报也是享有的。当市场呈现出一幅如波斯画作般的末日景象时，高盛的每一个格头小兵、士官和将军都会紧结成阵，形成一个由贪婪组成的希腊方阵。与华尔街街几乎所有其他银行不同，高盛实际上可以将其跨部门、跨资产类的风险计算到小数点后五位。合伙人的大部分财富都集中在高盛股票中，他们开了紧张的会议，并制定了一个拯救这艘沉没之舟的计划。人情被动用。客户被压榨。风险迅速被对冲，头寸被清空。尽管一片混乱（以及《骗子扑克》中所有关于戏剧性的承诺），我很少看到有人失去冷静超过两秒。我们是在流血，但别人在死去，你会感到庆幸能坐在这一代最大金融盛宴的头排观众。\n\
  \n### 什么是衍生品？\n在这里，我来为你创建一个。我只是在一张纸上签了我的名。如果由于你（以及希望其他的一万个人）手里拿着这本书，导致我的写作声誉随之大起，那么那张纸就变成了一份签名，并且在不不的将来可能值数千美元。相反，如果我在完全默默无名中去世，那个签名就一文不值；甚至负值，你都得花钱让人把它处理掉。值得注意的细节是，这种衍生品本身不具有任何内在价值，它的价值完全取决于其他某些东西：在这种情况下，是我的作者声望。同样重要的是它的价值波动范围有多大；银行家会称之为“高杠杆”。它可能一无所有，也也可能价值数千。即使我成功了，我写作技能的基础价值也会在一个相对窄的范围内波动，但在文学永生的这种极不可能的事件中，那个衍生品的价值确实可能非常高（或者一文不值）。\n\
  \n### 那么什么是信用违约互换（CDS）？\n`CDS` 就像车险，只不过它保护的是别人借出的一笔钱，而不是一堆被称为汽车的玻璃和钢铁。某个混蛋划了你的车并毁了价值\
  \ 500 美元的价值；保险合同会付给你那笔钱。车被盗了？保单会赔汽车的总价值。信用违约互换在表面上的运作方式相同。你以`bond`的形式借钱给别人。他们没有还你钱，或者只还了一部分？那个卖给你\
  \ `CDS` 的家伙会让你恢复如初，让你收回因贷款而遭受的损失。\n\n然而，相似性到此为止。\n\n与车险不同，对于 `CDS`，任何人都可以为你的车购买保单，即使他或她对它没有实质利益。换句话说，车主以外的人也可以为它投保。他们不仅可以投保，还可以承保——也就是说充当他们自己的微型\
  \ `GEICO`——并承诺赔偿损失。如果考虑到风险，保险价格太高，且在某些方面定价严重失误，那么那些贪婪的市场参与者将乐意卖给你一些。也许他们知道你把车停在一个原本危险的社区的车库里，因此对你来说保险贵得没必要。或者相反：他们是劫车贼，并计划偷它，想既从偷你的车中获利，又从理赔保险金中获利。因此，他们在实施盗窃之前就购买了保单。\n\
  \n### “信用”的概念\n“Credit”（信用）是拉丁语动词 `credere`（相信）的现在时第三人称单数变位。它是金融世界中最异常、最有趣的事情。类似的信念跳跃支撑着生活中每一桩人类交易：你的妻子可能会背叛你，但你希望并非如此。你付款的在线商店可能不会给你发货，但你信任并非如此。信用衍生品只是将这种信念以金融和合同的形式，针对企业实体进行的显性化封装。与其他金融证券（如\
  \ `IBM` 股票或`石油期货`）不同，信用衍生品甚至不是某种有形商品的理论价值。它是对一个完全无形物的感知价值，是对履行某些未来义务概率的感知。\n\n###\
  \ 从华尔街到广告技术\n在科技生涯早期，人们经常问我如何从华尔街转向广告技术。这样的人几乎肯定对这两个行业一无所知，否则答案将显而易见。我一直都在做着同样的事：为人类的感知定价，无论是对\
  \ `General Motors` 债券，还是对 `Zappos` 上心仪的一双鞋。无论哪种方式区别都是一样的；只是钱堆的规模变了。\n\n### 城堡大战\n\
  由于一个我很快就会忘记的随机原因，2006 年初，我走进高盛位于 `Broad Street 85 号` 总部内部的利率交易大厅，闻到了一种令人胃翻倒海的快餐油味。两整排办公桌，曾由神情紧张、对着电话简短交谈的交易员占据，现在被一群看起来穿着最体面\
  \ `Century 21` 行装的喧闹孩子营团占据了。一群穿着完全不是 `Century 21` 精致行装的交易员围着他们，就像私刑暴的开端。高盛抵押贷款策略董事总经理艾兰·布拉齐尔（Alan\
  \ Brazil）正在发放小纸包装的油饼，就像一位第一次世界大战的指挥官在进攻前向士兵分发弹药一样。\n\n这当然是城堡汉堡大吃大赛。\n\n所有的交易都从利率掉期（最小名义金额：5000\
  \ 万美元）转变为赌哪个高盛信徒在一个小时内吃下最多的城堡汉堡。赌注结构是典型的拉斯维加式赌注，赌在不吐的情况下能吃多少个汉堡。周围的人群变成了一群狂吼、比划的、兴奋贪婪的群体，严肃的交易员互相打信号，并在笔记本上记录下交易，就像他们处理百万美元头寸一样。\n\
  \n赔率看好的是名叫里奇·罗森伯（Rich Rosenblum）的年轻分析师，他采用了`小林技巧`来吞下那些小油饼。这涉及到将它们对半，并将那满是面团油腻的糊物浸入杯水中进行预湿，以便于吸入。\n\
  \n冷门的一个是一个来自普林斯顿的金发女实习生，她看起来可能只只有十二个汉堡重。一群朋友在她的投注单大侧进行买入，为她投下高得离谱的数字，而他们都知道她在普林斯顿学校俱乐部的秘密记录——这是顶级的内幕交易。\n\
  \n\n\n\n她就这么冲了过去！一口吃过了十五个汉堡，并向二十个冲击，让所有人大吃一惊。在二十二个时，她与当时的领先者里奇（Rich）平手。接着，意想不到的一幕发生了：她旁边那个看起来不太舒服的胖亚洲男孩开始喷射式地吐出汉堡块。汉堡大赛的老大哥阿兰·布拉齐尔（`Alan\
  \ Brazil`）立刻拿来塑料垃圾桶，接住那团狼藉。那个金发女孩的支持团队为了名利，明是有意地加入了这场汉堡黑洞竞赛，他们开始疯狂地挥动双臂，为她助威，以此分散她对隔壁“呕吐大乱斗”的注意力。如果她注意了那场呕吐雨，可能会引发一场呕吐的连锁反应！`Alan`明智地把那个亚洲男孩和呕吐桶移出了地面。记分榜显示，`Rosenblum`的计数达到了二十六个，但这位来自普林斯顿的金发女孩成功地达到了她内幕交易骗局赌注的上限，这正是她整个博彩集团所需的一切。随着一小时结束，人群陷入了疯狂，而紧接着整个骚乱就消散了，每个人都急着回到电话和风险报告面前。整整一天，交易大厅闻起来都像深炸锅内部的味道。资本主义无情地向前迈进。^]\n\
  \n当然，赌注并不仅停留在汉堡。分析师们会被要求参加俯卧撑比赛，并对总数进行大小赌投注。因此，在交易大厅里随意的地走动、忙于资本主义的重大工作时，你可能会绊倒一个交易分析师和一个特别健壮的销售副总裁，他们因用力而满脸通红，汗水浸透了平整的衬衫，在一小时内完成了第\
  \ 237 个俯卧撑，周围充斥着叫喊的赌注声。\n\n周五下午，为了打破周末前的低迷情绪，整个交易小组都会玩一个有趣的游戏。每个人把自己的公司工牌扔进袋子里，并投入大约二十到一百美元不等的资金（职位越高付得越多）。然后，首席交易员会从袋里一个一个取出工牌并叫出名字。袋子里最后一个工牌的所有者赢得全部资金。这是赢者通吃制，最后不分奖金。当只剩下二十左右的工牌时，情况变得`really`\
  \ 有意思起来：一群人聚在一起，交易开始了。袋子里还留有工牌的人会将自己的工牌卖给出价最高者，尽早离场并变现，而不是承担被淘汰的风险。工牌的公平价值是一个简单的计算：如果奖金有`$2,000`且剩下\
  \ 10 个工牌，那么一张工牌的期权就只是 `$2,000 ÷ 10 = $200`。但市场的交易方式并非如此；工牌不可避免地溢价卖出，而且过程越接近结束（即剩余工牌数量越少），按百分比计算的溢价越高。在心理上，人们会不理性地为了大额回报而出高价，且回报的可能性越大，他们支付的溢价就越高。此外，还有结构性力量在起作用：那是纽约周五下午，人们想拿着现金在周末挥霍。我敢打赌，用彼得·卢格（Peter\
  \ Luger）的那块牛排如果是用交易大厅的钱买的，味道会更好。赢者会（如果可以的话）揣下一叠二十元和百元钞，每个人都拿了自己的工牌。到下午五点，交易大厅变成了一座鬼城。\n\
  \n对于讽刺爱好者来说，华尔街提供了无尽的乐趣。对收益的全力、无拘束且崇高的追求，就像青春期期的性爱：那是你满脑想的，也是你唯一想的。但尽管如此，仍然要维持公司的体面。我们是在做上帝的工作，记得吧。（从样子看，上帝显然也在做高盛的工作。）因此，在一场竞争激烈的周五下午俯卧撑和工牌宾果游戏后，一份关于办公室礼仪的备忘录发到了整个大厅。其核心内容是提醒交易大厅内禁止赌博。这让我想起《疯狂的博士》中那个经典场景：由乔治·C·斯科特（George\
  \ C. Scott）扮演的角色在五角楼的控制室里与俄罗斯大使发生摔跤，并被严厉地告斥道：“先生们，你们不能在这里打架。这是战争室！”\n\n妓院里也不准打啪的，亲爱的同志们！\n\
  \n在华尔街工作期间，我有幸见证了一个具有时代意义的历史转型的尾声。鉴于我在衍生品市场中的角色，这种转型是从远处观察到的，但它的影响是深远的，且与我们的故事有关。\n\
  \n2000 年 9 月，在本文描述的事件发生很久以前，高盛收购了一家拥有数十年历史的公司`Spear, Leeds & Kellogg`。`SLK` 是一家老牌证券商和市场做市商，运营着交易所股票和期权的市场。它雇佣了大量的交易员和职员，那是一群穿着彩色夹克的人，在像芝加哥商品交易所那样的人群拥挤区域中忙碌地互相比划。那几百名交易员由几位仅在几台机器上运行基础期权定价模型的程序员来提供服务。\n\
  \n到 2007 年，那几百名交易员消失了。取而代之的是两名交易员、二十名构建和维护模型的量化师，以及数百台运行代码的极速机器。那些仍然出现在几个交易所、穿着彩色夹克的人呢？就像自然历史博物馆里的恐龙化石，他们那里只是为了展示。他们被昂贵的、闪烁的盒子取代了，这些盒子被尽可能靠近真实的交易所，并用能购买、租赁或埋在地下的最短电缆连接。\n\
  \n在这个新世界里，唯一的速度限制是摩尔定律和爱因斯坦的相对论：业务逻辑的速度取决于微芯片计算的速度，以及光脉冲在光电缆中传输的速度。这里的核心见解是，发生在`SLK`身上的事情并非某种特殊的领域性创新，而是整个世界变化的预兆。在未来，任何发生非凡决策的地方都将是计算机之间的对话，而人类仅参与编写逻辑。金融业率先看到了这种创新，因为风险很高，且增量计算优势的价值巨大。\n\
  \n\n\n信贷衍生品则有所不同。针对通用汽车（General Motors）违约的保护仅于此，即针对明确且一次性事件的保证。唯一变化（即使在标准化的时间窗口内）的是保单的持续时间（例如，三个月或三年）。继续用汽车来类比，当保险公司为你的破车投保时，它并不会考虑特征、汽车颜色、轮毂、购后改装和悬挂的空气清新的无限种组合。它只知道车辆的品牌、型号、年份、位置以及投保价值。仅此而已。将其拆分来，车险实际上只有几百类；信用违约互换（（CDS）也是如此。\n\
  \n那么，为什么不在交易所像我们交易 `Google` 股票那样交易 `CDSs` 呢？这个问题在 2008 年金融世界陷入火海时被提出。交易台内部的私语是，政府将利用这场危机来监管我们这个“荒野西部”的市场。高盛（Goldman）曾短暂地考虑过采取主动，通过自我监管转向交易所交易市场。但它决定不这样做，其原因我在\
  \ `Facebook` 再次看到：作为一个由少数几者主导的市场既得者，拥有完全的信息不对称，并拥有在市场上定价而非仅仅接受定价的能力，几乎没有动力增加透明度。买卖价差——即高盛在买卖同一件物品时的价格差异——在信贷衍生品上是巨大的。高盛仅需将一张纸从左手传到右手，从风险的卖方转变为买方，就能赚取巨额。虽然在交易所交易可能会增加总交易量并提高利润，但开放化会破坏高盛对信贷市场的特权视野，并使其面临新秀的竞争，更不用说面临财务监管了。即使开放性做法增加了市场的总规模，高盛也觉得拥有一个一个小市场比仅仅参与一个大市场更令舒适。因此，许多市场过去和现在都是低效的，因为这种低效对于运营市场的人来说是非常有利的，即使在短期内是如此。\n\
  \n正如我最终看到的，华尔街和硅谷之间有着惊人的相似之处。\n\n我羡慕宗教人士。\n他们的内心世界是如此有福。如果你是基督徒，就按照`Gospel` 所言做，过基督般的生活，拯救就属于你。如果你是正统犹太人，穿全黑并戴上`Borsalino`帽，勾选你那份\
  \ 613 条`mitzvoth`，你就可以怀着平静的心情等待弥赛者。在望向无神的、星点点的夜空时，不会有生存焦虑的啃噬。\n\n华尔街甚至比宗教更简单。\n\
  你作为一个人的全部价值由一个数字定义：你老板在年底告诉你的薪酬数字。`Wall Street` 的薪酬机制如下：你的`base salary` 实际上相当普通，但`bonus`\
  \ 才是真正的钱所在。那笔奖金完全取决于裁量，变化范围可以从零到你`base salary` 的几倍不等。\n\n所以，到了 12 月中旬，交易台上的所有人都在合伙人办公室外排队，就像圣诞弥撒的圣体队列一样，等待着从那张巨大的`Wall\
  \ Street`桌上分得的一小块面包。一整年的血、汗、泪水都浓缩在那一刻。而整个纽约经济都随着那奖金鼓的节拍前进。\n\n没有了那个数字，你在纽约阶层中的特权地位就消失了。汉普顿的房子没了。上西区的双层公寓没了。你孩子那学费`30,000`的学前班也没了。这就是为什么`Wall\
  \ Street` 具有那种“鼠笼旅馆”的特质：人们入住，但很少退房。当你经历了几个奖金周期，并在 1 月中月中旬看到那叠钞票进入你的银行账户时，你就无法想象没有它的生活了——这正是`Wall\
  \ Street` 银行高级管理层所希望的。如果`Wall Street` 的投资银行家是狗，他们会炫耀自己昂贵的项圈和牵绳作为地位的象征，而没有意识到真正的用途。在大局中，我的项圈很微不足道，但足以让我的脖子磨出血。\n\
  \n有一天，在交易台空闲时阅读《纽约时报》，我的脑海中浮出了这种犬类的思考。对于一个活跃的市场参与者来说，《纽约时报》的财经版是如此过时且反应迟缓，它完全像是一本历史书。这就是为什么我注意到最近获得资助的硅谷初创公司是非常偶然的。考虑到来自街头传来的那些瘟疫般的消息，一个乐观的标题一定像闪烁的灯牌一样亮眼。\n\
  \n\n\n坐在高盛银行 47 楼的食堂里，俯瞰着曼哈顿下城和纽约港的 360 度全景，我们闲聊着这场金融僵尸末日引发的各种内部闹剧。最后，我们尴尬地谈到了我要离开这里的话题。在高盛，我就像大牛屁上的一只小蝇，但至少在我们小圈子里，我要离开这个“游戏场”去一家不靠谱的加州初创公司是个受关注的话题。大多数人认为我疯了。\n\
  \n“斯科特，你难道没想过出去闯闯，做自己的事情，而不是干这种大公司的工作吗？”我问道，指了指周围那些像蜜蜂一样的工人，他们正埋头吃着那些理智的沙拉，然后准备回到交易蜂巢。\n\
  \n“我父母经营一家小家族企业，我亲眼看着他们经历了所有的压力……那些起起伏伏。他们生活中的不确定性对他们来说太可怕了。我无法想象自己去经历那些。高盛并不完美，但它会存在很久。我不想生活在不安全感中。”\n\
  \n在几个月内，斯科特·韦因斯坦（Scott Weinstein）在高盛长达二十年的职业生涯戛然而止。他的最后一份工作是在银行贷款部，那项业务在金融灾难中遭受了巨大损失。银行贷款组内部气氛紧张，斯科特与首席交易员之间的一次争论升级变成了私人恩怨。斯科特被解雇了——就这样这样。正如这类事的常态，斯科特很快在另一家银行找到了一份相当的职位，但这种寻求安全感的忠实员工却被裁员的讽刺感一直令我挥之不去。\n\
  \n在我在初创公司和大公司的所有职业经验中（包括特别是在 Facebook 期间），我总是倾向于——一百倍倾向于——承受市场的严苛、运气的无常和用户的反复无常，也不愿在大公司的人气选拔政治中周旋，被周围那些仅凭诡计和表象就在生活中获得成功的平庸之辈包围。斯科特·韦因斯坦那不幸的例子是他（或任何其他人）给我的最好的建议，而我忽视了它，并付出了极大的危险。\n\
  \n那顿午饭一周后，我从和（现已）女友合住的公寓里搬清了，跳进一辆敞篷 `BMW`，朝着夕阳的方向开了六天，回到加州，迎接等待着我的冒险。\n\n# 人类注意力交易所\n\
  \n景观是资本积累到足以变成图像的程度。\n\n——盖·德波尔（Guy Debord），《景观社会》\n\n## 2008 年 4 月 24 日\n\n“从一百开始倒数，但每隔个数数一个，”克莱恩警官（Officer\
  \ Klein）命令道。她穿着警察配发的漆皮鞋，身高五英尺二。我努力不看她那装饰着制服和勋章的胸部。我那大脑萎缩的状态也无济于事。\n\n“100, 93, 86,\
  \ 79, 72, 65, 58, 51, 44, 37, 30, 23, 16, 9, 2 . . 我需要数负数吗？”我诚恳地问道。多年来靠数学为生，我可以数一整晚，即使在醉得烂醉的情况下。\n\
  \n“你受过什么程度的教育？”克莱恩警官问道。我觉得这个问题很有深意。\n\n有些警察是欺凌者，通过警徽满足他们的施虐欲。然而，大多数警察其实只是反动分子，相信宇宙中某种简单的曼德二元论，即每个人本质上非善即恶。作为秩序的誓约守护者，这些警察保护财产及其贵族所有者免受暴力和盗窃；他们将道德的麦子和壳分开，辨别出坏罪犯和正直的公民。这种判断是他们的使命，他们的职业，并且背后有那个支付制服和警车的某个偏远小镇的鼎力支持。为了赢得他们的宽大，你只需要被认为是一个暂时误入歧途并闯入黑暗的“好人”。只需轻轻推一把，就能让你重回正轨。\n\
  \n而这正是我做的。\n\n“博士级别。事实上，你可以看到这里我的同事。我们在这一地区一家风险投资支持的初创公司工作。这是我们公司的欢乐饮酒时间。我是那里的研究科学家，”我说，指了指几个出来围观新员工被捕戏码的\
  \ `Adchemy` 员工。我正试图把我的体面像香水一样喷在身上。\n\n克莱恩警官犹豫地站在那里。\n\n就在这时，她的援兵——一个脖子很粗、当代布尔·康纳（Bull\
  \ Connor）——那个现在出现在许多拍摄视频中的原初权威人物——介入了进来。\n\n“先生，你能对着这个吹吗？”他命令道，递过一段白色塑料管，就像那是我刚刚喝掉的那些龙舌酒一样。\n\
  \n无论是酒精测试仪还是香蕉，当你对着某个东西吹气时，你无法与人眼神交流。那太诡异了。所以当我对着法律的小装置吹气时，我看向了模糊的远方。\n\n请大家鼓掌！\n\
  \n“0.91，”布尔·康纳宣布。\n\n该死。加州驾驶时的血液酒精含量上限是 0.8。\n\n这个场景需要一些解释。\n\n每个周四，一个由最年轻、最单身的\
  \ `Adchemists` 构成的活跃核心会在当地的某个小酒馆举行欢乐饮酒时间。请相信我的话，在波西米亚式的研究生生活和拿着公司 `AmEx` 的放荡华尔街生活之间，我由于欢乐饮酒时间造成的肝脏损伤足以让我赢得此名声。\n\
  \n\n\n\n“好吧，警官，要不我们打辆出租车，你看着我上车，然后我们就今晚收工？”我提议道。\n\n粗脖子警官思考了片刻，然后点了点头。\n\n这在没有 Uber\
  \ 的时代，所以我赶紧“拨打、打电话、打电话，你这混蛋！*”，免得他们改变主意。那辆“醉酒移动车”停了，我向聚在一起的 Adchemy 成员以及警官 `Klein`\
  \ 和“粗脖子”挥了挥手，上车了。八十美元后，我回了旧金山的科尔谷，回到了我与两个嬉皮女孩合租的那间漏风的维多利亚式公寓里。\n\n进入硅谷生活一周后，我学到的教训是：如果你想成为初创创业者，就要习惯在弱势地位进行谈判。很快，我将面临许多比说服警察让我打出租车要棘手得多的局面。如果你玩转创业的游戏，你也会如此。\n\
  \n第二天早上，我不光是宿醉，实际上还处于微醉状态。公司全员大会定于当天中午举行，全体员工聚在一起听取新交易和员工动态，并通常接受 CEO `Murthy Nukala`\
  \ 的精神动员。我必须准时，否则将面临同事向警方报失人口的风险，而且显得像个包子。我精疲力竭的大脑迟迟意识到车还停在马特尼奥的某个地方。花了一百三十美元并经历了过度的阳光后，我站在我那辆四轮巴伐利亚座骑旁，那里就是我昨晚战胜法治现场；十五分钟后，我参加全员大会时迟到了五分钟，这是可以接受的范围内。\n\
  \n当我走进公司会议现场时，聚集的人群角落传出一阵低语，对我我竟然不仅活着而且没被关起来感到惊讶或好笑。公司的传闻工厂在那个早上忙坏了。我当时看起来可能和我感觉上一样醉且像防腐剂一样。`Murthy`\
  \ 开始了他每周的演说。资本的齿轮依然在运转。\n\n每一种新的媒体形式最初都会模仿过去的形式。最早的广播节目只是人们在直播中读书或演奏器，完全没有使用巧妙的音效或剪辑。最早的电视节目是最初出现在广播电中的问答节目，只有参赛者的头部特照。没有复杂的摇摇镜头或跳切；仅仅是在言语之上增加了一张脸。\n\
  \n互联网广告与先前的报纸广告具有相似的原始相似性。最早的此类广告于 1836 年刊在巴黎报纸《新闻报》（La Presse）上。广告最初是一种用来降低报纸售价并夺取市场份额的策略。这是一种成功的策略，很快被所有报纸效仿。广告本身是广告主创建内容的矩形框，放置在常规内容的下方或侧面，并通过其块状的边框和巨大、俗目的字体与正文区分开来。\n\
  \n听起来像你最近在 `nytimes.com` 上看到的广告吗？\n\n当然，广告并不是这种现象发生的唯一场所。我们将航天器称为“船”（ships），是因为它们与海上航行者相似，并且考虑到太空旅行在知识上源于航海导航的数学和工程。这种模仿仅仅是我们这个疯狂而又聪明的物种从一种技术玩具到另一种玩具的有机演进的结果。\n\
  \n同样，营销人员将网站和移动应用程序称为“发布者”（publishers），这是对广告世界起源于墨水和新闻纸的一种古老反映。“发布者”仅仅是将目光带到拍卖台上的实体，无论它是通过获得普利策奖的写作，还是通过一个你发射愤怒小鸟去攻击敌对猪猪的游戏。在互联网广告的早期，发布者发挥着关键且强大的作用。在\
  \ 21 世纪初，像 `Yahoo` 这样的网站拥有整支销售团队（就像报纸现在那样），直接将那些小小的字符和图像卖给广告主。仅仅为了卖掉一个“插入订单”（insertion\
  \ order，行业术语，且也是一个绝妙的双关语），就有无数的传真和邮件飞来飞去。定位能力为零；充其量，人们可以指定网站的某个部分让广告出现（例如，电影板块）。数据分析和归因——回答谁看了并最终购买了什么的问题——同样不存在。互联网与高公路广告牌之间的唯一区别在于，你不需要物理性地把一张海报贴在某处。\n\
  \n到 2008 年，这一切都改变了，这就是为什么像我这样以前的华尔街量化师会在 `Adchemy`。一家名为 `Right Media` 的公司允许广告主根据用户在特定网站上的行为（例如将东西放入购物车）将用户细分为特定的聚类。`Right\
  \ Media` 发明了在线世界与特定发布者之间实时数据同步的概念，它甚至允许你标记来到你网站（或其他任何地方）的用户，并在以后再次找到他们。它在 2007 年被\
  \ `Yahoo` 收购，并开发了第一种“程序化”（programmatic）媒体购买技术；“程序化”意味着通过计算机相互对话来控制媒体，而不是人类通过销售电话对话。此外，人们可以根据年龄、性别和地理位置等用户人口统计数据对广告进行定位。媒体购买不再是在汽车或房地产板块放一个方框，而是关于在任何地方以任何方式找到特定的用户。所有这些数据被发布者和广告主生成、存储和使用，为那些曾经为信用衍生品定价的人留出了空间，让他们转而对人类注意力进行同样的操作。\n\
  \n还有其他事情正在发生。\n\n在媒体领域，钱仅仅是易耗的弹药；数据才是力量。有了这种新的程序化技术，允许每一次广告展示和用户都能被逐一审查和定位，这种力量正不可避免地从发布者（注意力的所有者）转移到广告主（购买注意力的人）身上。如果我关于你购买和浏览了什么的广告主数据，比你当时在\
  \ `Yahoo` 上或你据是俄亥俄州的三十五岁男性的发布者数据更重要，那么权力就在我广告主的手中，决定媒体的价格和吸引力，而不是发布者。事实证明（正如 `Facebook`\
  \ 在 2011 年痛苦地意识到的那样，这构成了本书的高潮），这种“第一方”广告主数据——`Amazon` 等公司关于你的数据——比任何发布者数据都有价值。\n\
  \n\n\n\n\n无论是品牌营销人员在推销新的 `BMW X5`，还是游戏开发者让玩家在虚拟商品上花费真钱，亦或是有人在销售在线护理学位，唯一的区别在于这些不同目标发生的时间跨度——换句话说，就是关注与行动之间的时间。\n\
  \n如果时间跨度非常短，例如在 `nordstroms.com` 浏览并购买衬衫，这被称为“直接响应”广告或“DR”广告。如果时间跨度非常长，例如让你相信在没有昂贵的\
  \ `Burberry` 大衣光环之外的生活是无法过下去的，这被称为“品牌广告”。请注意，两者的目标是相同的：让你用你可能并不拥有的钱去买你可能并不需要的狗东西。\n\
  \n在前一种情况下，轨迹是易于追踪的，因为“转化”通常发生在网上，且通常是在点击了投放给你的那条广告之后。在后一种情况下，采用的媒体是多管齐下的策略，包括超级碗广告、互联网广告、邮寄邮件、免费钥匙扣以及上帝知道的其它的任何东西。此外，转化发生在最初接触媒体很久之后，而且通常是在线下物理空间进行的，例如在汽车经销商处。由于使用的媒体多样，且从接触到销售之间流过了几个月或几年，追踪和归因要困难得多。因此，品牌广告预算远大于直接响应广告，它们却以一种令人尴尬的大规模广攻形式花掉，几乎没有经过任何形式的针对或追踪。\n\
  \n现在你已经了解关于广告的一切。剩下的都是技术细节，以及由代理机构编造的自我推销的废话。从正式来说，你已经和那些管理我们媒体世界的少数几家机构的媒体大亨们一样知情了。\n\
  \n这里有一点你可能并不知道：每当你访问 `Facebook`、`ESPN.com` 或任何地方时，你都在释放一场关于资金、数据和像素的疯狂争夺，这涉及到海底光纤电缆、世界上顶级的数据库技术，以及贪婪陌生人对你所了解的一切。每。一。次。\n\
  \n### RTB 交易的魔法\n\n想象一下，每当你访问 `CNN.com` 时，就像有一份关于你大脑中一份股份的新卖单被传输到了股票交易所。想象一下：人类注意力的个体量子被一点点售卖，就像那数百万股\
  \ `通用汽车` 的股票一样，每天交易数十亿次。\n\n记得 `Spear, Leeds & Kellogg` 吗（高盛收购的一家老牌经纪公司），以及那些正在消失（或已消失）的交易员吗？这家公司在几年内从数百名交易员和两名程序员变成了二十名程序员和两名交易员。同样的过程在\
  \ 2009 年左右的媒体世界刚刚开始，并在现在，2016 年正全速运转。\n\n作为这一转变的一部分，`Adchemy` 浪费努力的最后狂欢之一正发生在 `RTB`\
  \ 领域。一位名叫 `Matthew McEachen` 的工程师（`Adchemy` 最优秀的人之一）和我建立了一个 `RTB` 竞价引擎，它与 `Google`\
  \ 巨大的广告交易所（媒体界的纽约证券交易所）交流，并以每秒十万次请求的速度提交报价和广告。我们被要求这样做，仅仅为了圆 `Murthy` 向潜在合作伙伴撒的某些废话，称我们是一家实时广告购买公司。正如\
  \ `Adchemy` 的许多事情一样，这项技术将是被抛弃的，但我在那里获得的知识——通过仔细研读 `Google` 的 `RTB` 技术文档并让我们的代码通过\
  \ `Google` 无情的集成测试——会让我在多年后领先于 `Facebook` 那群无所知的产品团队好几个光年。\n\n如果你在那时告诉我，我不会相信你，但有一天，我竟然在为\
  \ `Google` 最大的广告交易所对手 `Facebook Exchange` 编写技术文档并运行集成测试。但在那些黑暗的日子里，我离那非常远、非常远。\n\
  \n## 学会游泳\n\n一场空洞的盛宴；一场戏剧；羊群，牛群；丢掷在狗群中的骨头；扔进鱼池的碎屑；负重劳作的蚂蚁；惊恐逃窜的老鼠；被丝线操纵的木偶；这些就是生活。\n\
  \n在这一切之中，你必须采取立场，态度良好且不蔑视，但始终意识到，一个人的价值并不超过其抱负的价值。\n\n—马可·奥勒留，《沉思》\n\n2010 年 2 月\n\
  \n第一个离开沉没船的不是老鼠。而是那些会游泳的船员。\n\n到 2010 年 1 月，事实已经非常清楚：`Adchemy` 是一个彻底的失败，是一个在 `Murthy`\
  \ 虚荣祭坛上牺牲的人力大祭品。现实经验是极具启发性的，但学费很高。\n\n问题的第一个迹象是外部可见的，是任何有经验的初创企业从业者都能察觉到的症状：除了 `Murthy`\
  \ 之外，公司早期的没有任何人留在了那里。其他任何一个联合创始人或早期员工都离开了。正如冯内古特在《蓝胡须》中所写的，在知道某人为了生存做了些什么之前，永远不要相信大屠杀的幸存者。确实，在这种情况下，`Murthy`\
  \ 不仅仅是一个幸存者，而是上述那场屠杀的作者。\n\n就像斯大林时期的苏联修改涉及党内宠儿的照片，从历史中删除现在被清洗的受害者一样，初创公司也会从其在线“团队”页面上删除前创始和员工。这家初创公司的官方历史（至少从它自己的描述来看）只会提到目前的领导层，并重新编写一个关于当前团队是上帝安排的人才组合、将把初创企业推向云层的叙事。这完全是胡扯，但这就是他们告诉你的党的口号。在\
  \ `CrunchBase` 或 `LinkedIn` 上进行谨慎查询，或给专业联系人发邮件，才能揭示真相。\n\n### 失败的迹象\n\n这是第二个迹象：初创公司在赚钱，而且赚了很多。你没听错。这是另一个典型的\
  \ `Adchemy` 问题，尽管相对罕见。`Adchemy` 制作的软件自动化并优化了运行广告活动这项艰巨任务。在硅谷，有一种技术术语叫做“吃狗粮”（dogfooding），基本上意味着使用自己的自己的产品。在这种情况下，这种想法是让营销团队实际上运行营销活动，然后通过在线世界中一个合法但略显可疑的地下领域——“线索生成”行业，卖给潜在客户。`Adchemy`\
  \ 本身不卖任何东西，它只是通过广告找到的人员列表卖给那些真正卖东西的人，例如出售抵押贷款贷款或向`菲尼克斯大学` 出犯罪学学位。\n\n正如信托基金只会让毒瘾者的螺旋变得更持久、更痛苦一样，一个不改进产品的产生资金的业务通过维持这场戏推迟了不可避免的失败，而实际上增加了失败的可能性。这种策略在公司解决核心程序缺陷时可以维持公司生存，但它非常棘手，并且需要绝对的管理纪律，以确保不会对公司创立是为了完善的产品失去关注。\n\
  \n\n\n\n\n第三，Adchemy 的实际产品没有任何客户。\n\n一个公司彻底失败最明显的迹象是：该公司的季度报告中出现了一组新的企业 Logo，每一个\
  \ Logo 都是一个备受期待的 Beta 客户，据称未来将为使用量或营收带来爆发性增长。对于某一份季度报告来说这没问题，但在经历了一年不断变化的 Beta 客户名单后，却没有任何一个能转变为拥有合同和经常性收入的正式客户，那么你就是在追逐幻影。你看到的只是销售团队在不断筛选潜在客户时，其线索列表的\
  \ Logo 版本。\n\n## 与直觉相反，绝症症的最后一种征兆竟然是忠诚的员工。\n\n尽管管理不善，Adchemy 二百多名员工中的许多人对穆蒂（Murthy）和公司都有着强烈的忠诚感。其中许多人都是高技能的专业人士，本可以在其他地方就业，但他们不仅忍受了公司糟糕的管理，还忍受了赤裸裸的虐待。穆蒂发脾气是传奇性的，他经常侮辱员工，并在某些情况下无故解雇他们。他有一次毫无警告地向我扔过棒球，结果打断了我的手指（我当时正站在落地窗前，被迫接住了一个快速球），然后仅仅为了好玩，公开场合嘲笑了我好几个月。然而，他的许多员工仍然对公司赞誉有加，甚至行使了期权购买公司股票，导致他们在公司倒闭时失去了大部分生活积蓄。即使在辞职或被解雇后，前员工还会举办\
  \ Adchemy 校友欢乐时光并聚在一起，就像某种巡回演出一样。这里有一个教训：当一家公司的员工留存策略是在培养斯德哥尔摩综合征时，你进错公司了。\n\n圣奥古斯认为，通往天堂救赎的最佳方法是认往地狱之路并避开它。亲爱的读者，请考虑我为你走过的各种地狱之路，然后反其道而行之。\n\
  \n如果每个人都相信民主或宗教等幻觉，它们在某种程度上就会变成真实——这比幻觉只是某人脑中一个自大的神经元火花时要真实得多。如果你认为自己是盖茨或马斯克，但并未被视为这样，那么你就进入了感知到的不公的领域。你给自己分配了某个价值，但社会对你的排名却是另一个。社会认知与你自身之间的这种差异，就是你感受到的不公。将这个差距乘以你的自我，你就得到了在创业过程中将投入的愤怒总量。\n\
  \n正是在这样一个充满愤怒的状态下，我开始准备我们的 Y Combinator 申请。\n\n我和另外两名 Adchemy 员工在社交上很合拍，几个月来一直在不断讨论创业想法。其中一个你已经见过了：马修·麦凯森（Matthew\
  \ McEachen），又名 MRM，我曾一起建立了实时竞价引擎。他是公司任职最久、产出最高的工程师，我们曾合作过多个项目，他担任首席工程师，我担任研究科学家。另一个是阿基格里斯·齐姆尼斯（Argyris\
  \ Zymnis），他是斯坦福大学著名人工智能实验室的应届毕业生。由于他高水平的机器学习大脑和编码技能，他是 Adchemy 的明日之星之一。\n\n然而，除了午餐时的对话和奇怪的周日电话外，我们还没有形成任何清晰的业务想法。周一在拖延时，我决定读保罗·格拉姆（Paul\
  \ Graham）的一篇文章。内行人士称他为 PG，他在 Web 早期创立了一家名为 Viaweb 的在线商店构建器，该公司在 1997 年以 4000 万美元左右出售，最终变成了雅虎购物（Yahoo\
  \ Shopping）。在收购后的自由时期，他创立了硅谷最令人置信的机构之一：Y Combinator。\n\n每年两次，Y Combinator 接收几十个创业希望者，进入一个只能被描述为“创业训练营”的项目。他们被给予极少资金，目标是在三个月内交付产品。有些人带着几行拼凑的代码和一个想法就进来了；另一些则带着一整套已经完成融资的运行良好的业务。三个月后，他们都会在\
  \ Demo Day 演示日进行路演，这是金山地区风险投资日历上的重大盛事。\n\nPG 是创业福音的头号门徒（甚至说是救世主），除了马克·安德烈森（Marc\
  \ Andreeson）之外，他是科技圈中唯一拥有不会引发文学性作呕反射的散文风格的人。他清晰的文章摒弃了任何自我表现和伪装，读起来就像是一本技术创业的操作手册。由于他在哲学和形式逻辑方面的背景，他逻辑严密的论述读起来几乎像三段论，就像一场苏格拉底式的对话，他在剖析融资轮、招聘、现金流和产品开发。\n\
  \n由于忘记了他的文章库的 URL，我在浏览器中输入了 `ycombinator.com`。这个极简主义的网站有一张极客的照片，几个指向媒体报道的链接，以及一个标题极其诱人的标题：`申请以获得资金。截止日期\
  \ 2010 年 3 月 3 日。`\n\n*这不很了吗？*\n\n想法 #1：我们应该申请。\n想法 #2：今天是 3 月 1 日。\n\n\n\n\n顺便提一下，向风险投资人（或科技圈的任何人）表现你创业初期的有多幼稚的最快方法，要么声称你正处于“隐身”状态——即你的想法如此珍贵，以至于无法公开；要么在讨论之前就强迫别人签署保密协议。你还不如直接在额头上纹上\
  \ `LOSER`（失败者）三个字，这样省得大家的麻烦。引用一位硅谷智者的话说，如果你的主意真的好，它不会被偷走，你反而得把它命塞进别人的嘴里。\n\n不过，在此记录一下，这是我们想出来的方案：\n\
  \n营销面临的巨大挑战之一是线上世界与线下世界之间的隔阂。你通过互联网购买的东西和你的数字人格，与你亲身购买的东西是完全分离的，这两条数据流很少有交集。想象一下，如果广告商知道你在当地的\
  \ `Walmart` 买了一大包 SUV 尺寸尿布，他们该如何向你投放不同的网络广告呢？反之，如果你在网上搜索某个电子产品，你如何知道它正躺在当地的 `Best\
  \ Buy` 店里等候购买，而不是让你在等 `Amazon Prime` 等上两三天？我们的想法总结起来就是建立一个应用，让本地店主可以扫描产品的条形码，然后立即生成一个在线广告活动，宣传该产品在当地有售的事实。\n\
  \n这里给你们一些创业教学：\n\n当面对任何创业想法时，问问自己一个简单的问题：要让它成功需要发生多少奇迹？\n\n如果答案是 `zero`，那么你不是在看创业，你只是在经营像洗衣店或货运这样的普通生意。你只需要资本和最基本的执行，在假设市场是双向的情况下，你就能获得利润。\n\
  \n要成为一家创业公司，需要奇迹发生。但需要精确数量的奇迹。\n\n大多数成功的创业公司只依赖一个奇迹。对于 `Airbnb` 来说，是让人们允许陌生进入他们的空闲卧室和周末小屋。这是一个用户行为上的奇迹。对于\
  \ `Google` 来说，是创建一个比目前任何服务都好得倍的搜索服务。这是一个技术奇迹。对于 `Uber` 或 `Instacart` 来说，让人们通过网站或手机预订并支付现实世界的服务。这是一个消费者工作流上的奇迹。对于\
  \ `Slack` 来说，让人们工作起来就像他们以前和女朋友聊天一样。这是一个业务工作流上的奇迹。\n\n对于大多数消费级 App 的开发者（例如 `Instagram`）来说，奇迹非常简单：让用户使用你的应用，然后意识到你对人类大脑与键盘或触摸屏交互的独特处理所带来的财务价值。那是\
  \ `Facebook` 的奇迹，让美国每个大学生在它成立早期都使用它的平台。虽然在规模化过程中需要大量的技术诀窍——如果他们搞砸了，他们就会完蛋——但这并不是他们成功的原因。这种奇迹的独特性和完全的反复无常，使得投资面向消费的应用程序就像买彩票。这确实是一个胜算几率微乎其微的用户增长轮盘。\n\
  \n一个一个糟糕的创业想法的典型迹象是，它至少需要两个（或更多！）奇迹才能成功。这就是我们想法的问题所在。我们需要执行多如一本《圣经》的奇迹：\n\n- 小微企业主必须通过我们来完成所有的营销。\n\
  - 我们必须解决 `用手机扫描条形码` 的问题。\n- 我们必须生成一个全面的零售产品数据库，包含价格、评论和型号等相关的元数据。\n- 我们必须根据该产品数据库程序化生成广告活动。\n\
  - 我们必须设计世界上最好的小企业营销和活动管理工作流，一个让即使是不精通营销的人也能成功的流程。\n\n这只是开始，就有五个奇迹（更不用说像融资和与合伙人相处等实际问题了）。这多出了四个奇迹。其中任何一个奇迹都可能涵盖一整个获得融资的创业公司的努力，事实上，我可以在上面的每一行后面都标注两三家尝试过该目标的创业公司。而我们竟然在提议让三个胆小如鼠、没有商业人脉或钱的人来搞定所有五个。尽管在我们愚蠢的幼稚中，我们在\
  \ `YC` 面试后不久就意识到了这一点，这就是为什么我们最终采取了那个经典的创业动作：`pivot`（转型）。\n\n这绝对是经典的创业术语，值得花时间研究一下。你在\
  \ `Wired` 或 `Fast Company` 上读到关于某个创业公司不可阻挡且实至名归地征服世界的奉承小说时，没有至少会读到一次这个词。\n\n“转型”本应该让人想起芭蕾舞者的\
  \ `demi détourné`（半转体），一种优雅的路线改变，看起来（希望如此）是有意的。现实中，创业公司的 `pivot` 是一场恐慌的冲刺，就像`泰坦尼克号`乘客发现了最后一个开放的救生筏。这甚至不是一次性的：由于自\
  \ `Plan A` 以来我们经历了多次转向，我们的最终产品非正式命名为 `Plan J`。但亲爱的读者，这就是事实：我们完成了一次“转型”。`Plié!`（绷脚）！\n\
  \n但我们想得太早了。这一切只有在与 `Paul Graham` 多次漫步之后才会变得清晰，而那时甚至还没有获得与他交流的权利。\n\n回到我一边写 `Y Combinator`\
  \ 申请一边躲在 `Adchemy` 里的状态。如果我对 `YC` 和 `Paul Graham` 文章的解读是正确的，那么一个扔炸弹的无政府主义颠覆者，结合冷酷的执行力和不不经犯的奇想——一种技术赋能的十二岁男孩——正是\
  \ `YC` 创业者的画像。\n\n我们正是以这种精神回答了 `YC` 申请中我喜欢的问题：\n\n你曾破解过什么（非计算机）系统？\n\n我对 `Craigslist`\
  \ 的在线交友广告实施了中间人攻击。我发布了一个女性寻找男性的广告，以及一个男性寻找女性的广告。我将来自真实男性的邮件传递给虚拟女性，伪装成虚拟男性对真实女性的回复，基本上交叉了邮件流。在某一点，我将每个真实的人从我的虚拟邮箱地址转移到对应的异性别的真实邮箱地址。我怎么知道呢，这是否导致了一段婚姻，因为在重新连接邮件流后，我再也没有见过那些邮件。\n\
  \n剩下的问题也是如此的。\n\n这个雏形想法的响亮口号源自个人历史：我们正在建立“广告界的高盛”，这真是一个极其夸大其词的说法。这种“X 之 Y”的公式——其中\
  \ X 和 Y 是两个易懂的事物，但它们的交点是新颖或引人入胜的——也是经典的 Y Combinator 思维。`PG` 在他向投资者演示的文章中实际上建议过这种修辞。它现在已经非常陈词了，但在某一个时期，就像任何梗一样，它经历过一个几乎被主流完全接受的时期。即使现在你偶尔听到它：“自行车界的\
  \ Uber”；男内裤界的 “Netflix”；等等。这是一种让你立刻理解你那怪异科技业务混合体的方法，即使只是部分。\n\n\n\n此外，这是一项荣誉，而且是一个极难获得的荣誉。每当某个精英俱乐部的会员名手可得时，我都会拼命争夺它，哪怕仅仅是为了在被录取时将其拒绝。毕竟，正如卓越的哲学家\
  \ `G. Marx` 所说：如果一个俱乐部愿意让像我这样卑微的人成为成员，那这个俱乐部能有多好呢？\n\n如果你在 2010 年 3 月 7 日晚上站在奥克兰的\
  \ `Broadway` 街和 `MacArthur Boulevard` 街的交叉路口，你会看到一个奇特的景象。一个大着孕肚的女子痛苦地弯着腰，几乎无法行走，正被一个高大、留着山羊胡男人半抱半拖着穿过街道。那个女人几乎站不住，在艰难穿过最后几百英尺的路程时，需要停下来，紧紧抓住那个男人或任何固定物体。每隔十步左右，女人就会蜷缩身体痛苦地喘息，导致一切停滞。那个男人同时试图观察交通状况、防止他的女性伴侣倒下、拖着一个大行李箱，并引导这整个摇摇晃晃的组合走向急诊室门口。亲爱的读者，那个留着山羊胡的男人就是我。女人曾是伦敦城的衍生品交易员。\n\
  \n她怀孕三十七周了。\n\n我们认识三十九周了。\n\n在再次快进之前，让我们先倒回。\n\n“人生就是当你制定其他计划时所发生的事情。”\n\n如果你在在线约友网站上看到这句话作为标语的简介，请注意，你将面临一场该死的改变人生的约会。我在搜索关键词\
  \ `sailing` 时发现了 `British Trader` 的个人资料。主题性搜索（例如，`physics`、`PhD`、`beer`）是我寻找哪怕一点点共同点并以此构建自我介绍信息的方式。\n\
  \n当时，在线约友网站主要通过其成员的人口统计特征来区分自己。`Craigslist` 是给性工作者、`Fremont` 的胖女孩和连环杀手准备的。`OkCupid`\
  \ 是给住在 `Mission` 地区合租公寓里的穷酸斯斯克女孩准备的。`Match.com` 是给那些忙于“挑选丈夫”这项传统的职业女性准备的。选择你的受众，然后写下你的广告文案。我的内容侧重于航海和户外探险。完全没有提到换尿布和送托儿所。在某种程度上，广告真实。\n\
  \n她有模糊的斯拉夫族面部颧骨和猫科般的眼睛。她的 `Match` 个人照片是她站在船舵旁，这瞬间让她的吸引力提升了五倍。信息交流变成了晚餐约会。晚餐约会变成了看歌剧。一个周五傍晚，她穿着最体面的职业装，不打而招呼地出现在造船厂。我那只\
  \ 26 英尺的单体 `Moksha` 被拖到了陆地上，我正忙碌地为它进行远洋航行的改装。我满身灰尘和油渍，欢迎她来到我的船。她爬上那不稳定的十二英尺梯子到达\
  \ `Moksha` 的甲板，由于船底有深龙骨，甲板高于地面。\n\n然后，是一场浪漫的转折。\n\n下周末，一个高大、身材修长的男人把他的船停在我我的船旁边。他是一个强壮且神气风发的的南非人，他走过来，我们开始聊起船。我们处得异常投机，并在当地一家有红白格子桌布的意大利餐厅，用啤酒和披萨继续我们无休止的聊船话题。\n\
  \n命运弄人，他是 `British Trader` 的前男友，最近毫无情面地抛弃了她。这事关很严肃。正如我最终从 `British Trader` 那里了解到的，他们在从未结婚的情况下尝试过要孩子。他们无法怀孕的事让\
  \ `British Trader` 确信自己是不育的。\n\n我和他结束了喝酒吹牛，回到各自的船上工作。当我正在涂船底漆时，我抬头看去，看到一个火辣女孩正在和我那个新南非朋友聊天。我只看到了她穿牛仔裤的臀部。鉴于我对她的解剖结构尚不全面，我没有认出她。当然，那是\
  \ `British Trader`，她顺路来到造船厂随机查看一下我的进度。鉴于 `East Bay` 只有一个可以进行深度改装的大型造船厂，遇到她近期的男友并非完全不可能的巧合。\n\
  \n由于我和她前男友建立联系而感到怪异，她决定结束这段萌芽中的浪漫。但一周后，她又改变了主意。我和她以及她的女性闺蜜一起吃了午餐。我表现出最好的社交行为，通过了她朋友的测试。下一次邀请是在她家里吃晚餐。当我带着一瓶酒和微笑出现在她家门口时，她打开了门，她显然化了浓妆，喷了香水，穿着一件迷人的连衣裙。当门打开的那一刻，我知道我搞定她了。\n\
  \n这段持续几周的、在一个新的浪漫关系之初完成的现代蜜月，按部就班地进行。并没有真正的惊喜，除了 `British Trader` 在床上喜欢被身体主导，考虑到她阿尔法女母般的外表，这有点小意外。对于一个女性来说，我的每一个女朋友都是明智、有野心且独立的。直到最近，她们都比我成功得多、富有得多。然而，在生理需求迫切的时刻，上演了无数场景，让人想起弗拉纳尔的画作《锁》（*Le\
  \ Verrou*）：一个正被掠夺的侍女，半在反抗半在顺从，在掠食者爱人的怀里被猛烈地抓住，后者砰地关上了卧室的门闩。\n\n这种邂会转变为关系的背景是一个由\
  \ `British Trader` 买下的简易翻新旧平屋，她利用了公司的搬迁包。她让《老屋改造》里的 `Bob Vila` 看起来像个该死的娘娘。她从一个房间里拆掉了华丽且定制的嵌入式架子和展示柜，并将它们安装在另一个房间。地板露出了木板。唯一尚可居住的房间是厨房（由她负责，经常涂油）。她的床是一张特大号宽度的廉价床垫，位于一个剥光到墙的房间里。地板落满了石膏粉，而在事后，我唯一能做的就是在石膏粉上的泡沫垫边缘艰难地保持平衡。晨间洗漱在唯一的浴室里进行，那里空空的窗框盖着塑料。角落里一个模制的塑料淋浴间和一个看起来孤独的白色陶瓷马桶，是这个看起来像花园内部的地方唯一的文明迹。受孕场景要么是上述的泡沫垫，或者是硬木厨房台面。\n\
  \n\n\n\n湾区的大多数女性都是软弱无力的，受宠过度且天真，尽管她们自称很世俗，但大多满口胡言。她们拥有那套自私的权利女性主义，不断地炫耀自己的独立，但现实是，一旦发生瘟疫爆发或外敌入侵，她们会立刻变成那种你愿意用一箱弹药或一桶柴油来换取的无用负担。\n\
  \n相比之下，“英国商人”（British Trader）是那种在末日世界后能成为有用盟友的女性，无论需要做什么工作——无论是木工、畜牧，还是对着脊背来一枪——她都能胜任。简而言之，你想把自己的基因车系在她血脉这匹奔腾野马上。这就是为什么在七月一个随机的周六，我并没有比预中那么紧张。当时我准时出现在午餐约现场，发现她反常地情绪低落。她抱怨说感到恶心，状态不太对。\n\
  \n也许是显得太随性了，当我从她沙发上拿起当地报纸时，我建议道：“嗯，也许你可以做个孕检吧。”\n\n像任何在安全性规则上玩命的男性一样，我也经历过不少惊魂时刻。我正处于那部剧的第四季：一个满脸泪水的女人\
  \ X 在性行为发生两周后出现，说她“月经没来”（就像我说我“错过了公交车”一样）。这种情况从未有过任何结果，而且在第三次出现后，你只想说：“听着，女人，除非你怀里抱着一个大哭的婴儿且长得像我，否则我们没话可说。”\n\
  \n她很快就会拥有一个了。\n\n“嗯，我确实去看医生了，”她立刻回答道。\n\n对于一个随意的周六早午餐来说，气氛变得有些预兆不妙。\n\n“啊……然后呢？”\n\
  \n“我怀孕了。”\n\n砰！\n\n一个生命。\n\n*该死*，我想。\n\n我能听到上帝在他那拱顶形的避难所里大笑。生活确实在你正制定其他计划时所发生的事情。\n\
  \n根据她的描述，“英国商人”在听到医生的消息后流了泪，她只是去做了一次例行检查。没错，老调调了。看着她那双坚毅的绿绿色眼睛，我知道这个孩子即将见到天日了。\n\
  \n与其说是对“英国商人”的真爱，不如说是出于某种残留的天主教罪恶感和西班牙裔的骑士精神，我租出了我在使命区（Mission）的那间单室波西米亚风格公寓（那里曾住着我的嬉皮女孩家庭），并搬进了她那已经变成工地的家。我会努力经营这种家庭化的父母生活的。\n\
  \n如果你要跳入深渊，就一头扎进去。\n\n“英国商人”在担架上昏迷了，正在出血。我愈发惊地看着红色的血迹在大腿上勾勒出血色的蜘蛛网。护士们像外国邮局里无聊的官僚一样走来走去，谈论着文书和天气。\n\
  \n分娩的进展是以厘米的。宫口开了 7 厘米：打麻药太晚了，做流行的呼吸练习也太晚了。表演时间到了。\n\n我邀请任何有哲学倾向的人见证人类的出生，观察不可阻挡的力量遭遇不可逾越的物体，且互都不让。现代医学在解决这个肉身之躯的悖论方面作用有限。我面前这血腥、尖叫的画面，与我一百年前在西班牙北部乡村烛光下出生的奶奶相比，唯一的区别在于，护士会定期撕开那种塑料装的矿油小包（就像丹尼餐厅的沙拉酱一样），倒在下方剧烈抽动、肿大的肉块上。\n\
  \n这是一场大汗淋漓、指关节发白的事业，被穿心的剧痛尖声所打破，尖声在整个产产部回荡，护士们关上的沉重大门并不能将其压制。我静静地陷入了某种《广告狂人》式的怀旧，怀念那个男人只是在另一个房间紧张地走动、抽烟，而让肮脏的任务完成的日子。\n\
  \n经过两个小时的战斗，旧肉血腥地让位于新肉，佐伊·阿亚拉（Zoë Ayala）来到这个世界。\n\n作为某种扭曲的离别礼物，我荣幸剪了脐带。它像男人的手指一样粗，深紫色的核心覆盖着一层黄色薄膜，在我的小剪刀下屈服了，当我剪断母子之间最后的肉体连接时，发出了悦耳的*咔嚓*声。\n\
  \n佐伊大声嚎哭起来。护士把她放在一个不锈钢秤上，上方顶着两个红外加热灯，就像麦当劳的薯薯条站一样。量完身高和体重后，她用一条厚棉毯像卷饼饼一样包裹起佐伊。她把这个“婴儿卷饼”放在我怀里。\n\
  \n佐伊第一次安静下来，紧紧的襁褓骗了她，让她在几分钟里以为回了母亲子宫的温暖怀抱。她看起来不可置信地小而脆弱，还没有准备好面对冷酷的世界。\n\n出乎意的是，YC\
  \ 邀请了我们面试。通过一封简短的邮件和一个极简主义日程预约工具的链接，冒险真正开始了。\n\n我抢到了最后一个面试名额，就在面试的最后一天——3 月 29 日——赌上了通常的选举投票策略：在任何名单上要么排第一，要么排最后。于是，在周日傍晚，我们紧张地出现在\
  \ YC 总部，那是位于山景市一个完全平庸区域的一处工业空间。\n\n没有任何仪式感，我们被要求进入面试室，四位 YC 合伙人坐在桌子后面，像军事调查委员会一样。在场的当然有保罗·格雷厄（Paul\
  \ Graham），以及他的妻子杰西卡·利文斯顿（Jessica Livingston），她也是一位合伙人。杰西卡曾为她的书《创业之路》（Founders at\
  \ Work）对世界上最成功的企业家进行了一系列全面的面试。\n\n罗伯特·塔潘·莫里斯（Robert Tappan Morris，PG 简称为 RTM）也在场。他是计算机史的活化石，在\
  \ 1988 年创造了世界上第一个病毒，并因此根据当时产生的计算机欺诈法被起诉。定罪后，他与 PG 一起创立了 Viaweb，这家公司的收购资助了这家基金。目前他是麻理工学院的计算机科学教授，但他仍参与\
  \ YC 的决策。PG 对 RTM 的一句赞美既绝对又简洁：“他从未出错。”\n\n特雷弗·布莱威尔（Trevor Blackwell）是最后一位第四位合伙人，另一位\
  \ Viaweb 创始人。他还是 Anybots 的创始人，这家机器人公司租赁了我们所在的建筑，YC 也成为了那里不断扩张的租客。空间内的 Anybots 实验室看起来像《终结者》系列中的场景，存放着一堆随时可能活过来的天网式机器人设备。\n\
  \n“所以你们想创造广告界的高尔登银行，是吧？”PG 在我们进门的那一刻就挑战道。\n\n由于这个突如其开头，我尝试按照我们的计划，由我来前 30 秒推销大致想法，然后演示我们熬了几个通宵夜拼凑出来的技术。\n\
  \n我才讲了 15 秒，问题就开始了。\n\nPG：“你们如何将在线点击连接到店里的实体？”\n\n在我们回答完之前，特雷弗就插话道：“你们什么意思是在全美买广告太贵了？”\n\
  \nRTM：“你们到底如何能扫描产品并知道什么在卖？”\n\nPG：“所以你们到底是怎么赚钱的？”\n\n就这样持续下去。我们中的一个人试图回答一个问题，但当我们刚开始时，另一个问题又来了，另一个人又了进来。\n\
  \n整个过程演变成了像是一群政治立场混合的醉汉对以色列-巴勒斯坦问题的激烈讨论。\n\n\n\n\n当我跳出来回答任何悬而未决的问题，或者为某个兄弟的说法背书时，我一直关注着左边的时钟。那时钟很大，就像在体育赛事上看到那种一样，它正无情地从十分分钟倒数到零，那是我们拥有的全部时间在此期间，Jessica\
  \ 一言不发，只是冷冷地从一侧观察着我们。\n\n经过又一番争论，在没有进行任何演示的情况下，时间到了。\n\n“我们会谈谈这件事并在今天给你们回复，”`PG`\
  \ 终于宣布道。\n\n就此结束。回想起来，那是我生命中最重要的十分分钟。\n\n站在外面，我们沉浸在那种集体失败的令人胃翻倒海的感觉中。偶然地，我们遇到了 `Mixpanel`\
  \ 的创始人之一，那是许多从 `YC` 毕业并取得巨大成就的成功初创公司之一。`YC` 的校友经常来参加面试，试图缓解申请者的紧张情绪，并在面试过程中提供更好的信号。`Mixpanel`\
  \ 的创始人恰恰反其道而行，他攻击我们的主意、营销计划和商业模式。\n\n在这两轮辱骂结束后，自杀协议离我们只有一步之遥。\n\n“去妈的。我们去喝啤酒吧，”我提议道。\n\
  \n“好，走吧，”`Argyris` 应和。\n\n`MRM` 在心情不好时会缩成一团，他选择回家陪孩子。\n\n那家啤酒店是当时硅谷唯一算像样的啤酒酒吧，那是一个充满瘟气但很舒适的混凝土砖坑，把自己装扮成英国风格，挂着足球横幅，屏幕上放着英超联赛。`Rose\
  \ & Crown` 受少数徘徊在帕罗奥托附近的潮酷斯坦福研究生的欢迎，幸运的是，它倾向于排斥那些穿着 Abercrombie & Fitch 衣服的 VC 幼虫。\n\
  \n正当一杯 `Weihenstephaner` 撞到我的手，我正在狭窄的啤酒花园寻找长凳时，电话响了。我不认识那个号码。\n\n“我是来自 `YC` 的 `Paul\
  \ Graham`。我们想资助你们。”\n\n震惊。不可置信。\n\n“啊……额……那个……其中一个联合创始人不在。我可能应该先问问他。”\n\n错误的答案！\n\
  \n我们像白痴一样，没有在内部决定我们是否决定投入。哥几个们，尤其是 `MRM`，对这桩 `YC` 生意并不买账。\n\n“你需要先问问他？”\n\n“让我五分钟后给你回电。”\n\
  \n写回忆录的一个主要痛苦之处在于，历史学家要的任务是重新阅读你的个人文本、信息和邮件存档。在思考早期的版本的自己时，你会发现那个年轻而光辉的你实际上是个彻头彻尾的呆痴。年老的你，回到你年轻的耳边低语，发出的不是赞美和鼓励，而是侮辱和严厉的警告。\n\
  \n我告诉 `Argyris` 这个消息，在他提问时打断了他。我必须打电话给 `MRM`。\n\n“喂？”他回答道，背景听起来像是一场比赛。他的孩子在踢足球。\n\
  \n“伙计，`YC` 想资助我们。你加入吗？”\n\n实际上花了一些说服工作。如果我记忆没错，我甚至把它包装成一个临时的方案，如果需要，我们可以退出。\n\n\
  回拨 `PG` 的电话，我惊恐地听到了他的语音信箱。我用尽量不慌慌的语气留下了接受提议的信息，并给 `Harjeet Taggar` 发了后续邮件，他是前 `YC`\
  \ 创始人，负责帮助管理面试流程。\n\n我们进了。\n\n`Rose & Crown` 慵懒的周日午人群冷冷地看着我打电话给 `British Trader`\
  \ 宣布消息。我们不仅成功抛弃了 `Adchemy` 这艘沉没之船，在我们疯狂逃离那艘即将变成残骸的船的过程中，拦截了另一艘经过的船只。\n\n# 抛弃沉船\n\
  \n任何没有革命基因的人，或者没有革命热血的人。任何没有具备适应革命努力和英雄主义的勇气、心脏或大脑的人。让他们走吧！我们不要他们！我们不需要他们！\n\n—菲德尔·卡斯特罗，1980\
  \ 年 5 月在古巴马里尔的演讲\n\n### 2010 年 4 月 23 日\n\n这里有更多创业建议：如果你离开初创公司周围的戏剧性让你联想起某位试图翻越围墙的前东德国人，或者古巴人劫持飞机飞往迈阿密，那么你在离开时应该像那个东德国人或古巴人一样狂喜若狂。\n\
  \n我们决定一起去 `Murthy` 的办公室提交辞呈，并带着某种模糊的想法，认为这代表了一个统一战线。在没有太多警告的情况下，我们以某个微弱的借口进入了他的办公室。我不记得是谁先说话的——我想是我——但我们宣布了离开\
  \ `Adchemy` 并开始自己的事业的计划。`Murthy` 开始长篇大论地指责我们是多么是么天真的蠢傻子。\n\n“投资条款清单（term sheet）中要看的五点是什么？我打赌你甚至都不知道，”他直视着我挑战道。\n\
  \n我读过不少商业协议指南，但现在不是测试那相当薄弱知识的时候。不过，`Murthy` 只是越说越劲。\n\n“你要意识到当你去找风险投资人时，他要做的第一件事就是给我打电话，我会告诉他对你们的看法，”他指着自己的手机说，“你们不是建立公司的合适人。”\n\
  \n马克·吐温的一句著名的励志名言指出，小人总是贬低你的抱负，而伟大的人让你觉得也可以变得伟大。`Murthy` 无疑是个小人。在他轮训式的结束后，我们都怀疑这是否是我们做过的最好的决定。我们耷着肩膀，低着头，走出了他的办公室。\n\
  \n随后发生的是来自 `Adchemy` 不断的骚扰。`Matt` 和 `Argyris` 承担了大部分，这也是应该。根据我们的代码库统计数据，`Mceachen`\
  \ 写了公司一半的代码。作为 11 号员工，他是每个产品团队中那种典型的人物：大猩猩、胡子男、知道所有可以运行的脚本以及尸体埋在哪里的专家。对于公司制造的每一个产品，他都是那样的人——负责那些隐藏在数十万行代码中、不被需要的、脱节且随机的功能。\n\
  \n\n\n\n“因为我们没有产品。我们没有客户。Adchemy 独立产出的任何东西，甚至连一个付费客户都没有。”\n\nChander 从他的办公桌旁猛地站。\n\
  \n“我们当然有付费客户，”他一边说，一边对着显示器上满是 Logo 的 PowerPoint 幻灯片疯狂地比划着。那些幻灯片是 Murthy 最近一次季度动员大会的素材。“你怎么能这么说！？”他结结地问道。\n\
  \n我闭了闭嘴，越过 Chander，看向窗外的福斯特城（Foster City）和圣马特内奥桥（San Mateo bridge）。\n\n“我想尝试一下自己的事业，”我提议道，引用了一个不那么敏感的动机。\n\
  \n“听着，你对创业一窍都不懂，”他开始说道，接着开始了一番长论，指责我们是无所知的新手。\n\n他用一个和解的姿势结束道。“至于 McEachen，他确实出了一些问题，但我们一直在尝试与他合作来改进状况……”\n\
  \nMcEachen 和 Chander 确实合不来。McEachen 善良、诚恳的态度，以及对客观技术真理的绝对忠诚，与 Chander 对权力和控制的热爱严重冲突。McEachen\
  \ 对从实习生到 CTO 的每一个人都保持同样的坦诚和开放，在那里，只有理性和数据才是王道。而 Chander 则像普鲁士将军对士兵期待的那样，要求顺从，转而又对\
  \ Murthy 表现出谄媚的忠诚。多亏了 Chander，公司已经失去了那位非常有干的分析部门主管。其他人很快也会随之而去。\n\n在他发完那番令人气馁的咆哮后，我们尴尬地对视了片刻。他的手臂猛地抬起，示意我可以走了。当我走出门口时，那个畏畏扭扭的小矮子甚至没有站起来。\n\
  \n这一幕被如实报告给了 Murthy，在接下来的几天里，管理层非常小心地把我排除在会议之外，并远离产品团队。我猜他们担心我会传播关于这家公司“无产品化”的理论。难得的是，我保持了沉默。\n\
  \n在紧张的一周后，一切都尘埃落定，只剩下争吵。Murthy 和 Chander 对 McEachen 和我都发了一了火，但一无无获。我们将在几天内离开。\n\n\
  遗憾的是，Argyris 并不会那么容易脱身。Murthy 像许多摇摇欲坠的创业公司一样，正在进行另一个重大的产品赌注，这是一系列赌注中的一个，注定要扭转 Adchemy\
  \ 的命运（“这次不一样”）。Argyris 的算法工作绝对是这个拯救公司的新方向的核心，他的离开意味着将推迟或放弃那次赌注。为了留住他的最后一种诡计手段，Adchemy\
  \ 利用了一个关键点：Argyris 不是美国公民。\n\n### 劳动力制度的历史\n\n美国的移民签证制度等同于契约奴役，一种农隶制。这种中世纪制度在美国有着悠久的历史。在北美革命之前，迁往英国殖民地的欧洲移民有一半是以契约仆人的身份进来的。那些在欧洲没有前景的贫穷儿童或年轻人，通过出售多年的劳动力来换取前往美洲的机会。在大洋彼岸，雇主会从运他们过来的船长手中购买这些人，然后他们被征召服或交给工匠学徒。仆役可以像奴隶一样被买卖。同样像奴隶一样，仆役会受到肉体惩罚，包括鞭打；他们未经许可不能结婚，且他们的合同受法律保护；逃跑的仆役会被捕获并送回。如果女仆人怀孕，合同将延长，以补偿误工的时间。在合同结束时，仆役会获得他们的“自由费”（一小笔现金）并被释放去在新的故乡寻找机遇。\n\
  \n硅谷并没有发生太大变化。\n\n### H-1B 系统\n\n美国的高级移民技术工人实际上只有一种入境方式：著名的 `H-1B` 签证。该签证每年的额度很小，但它是每年成千上万外国人实现“美国梦”的门票。`H-1B`\
  \ 的有效期从三到六年不等，允许外国人证明自己并最终申请永久居留，即通俗所说的“绿卡”。\n\n就像旧时代主从船上买下仆人一样，科技公司被要求为外国员工支付巨额费用。许多公司，特别是较小的初创公司，不愿麻烦，只雇用美国公民，这是一种被强加的、无人提及的本土主义，而且可能是非法的。那些知道自己能存在足够久以收回投资的大公司才是这种农隶制的真正受益者。像\
  \ `Oracle`、`Intel`、`Qualcomm` 和 `IBM` 这样规模大但平庸的科技机构，很难招聘到美国顶级人才，因此大量雇用外国工程师。按人工时虚报项目成本的咨询公司，如\
  \ `Accenture` 和 `Deloitte`，则利用他们的外国劳工，这些人在不被遣逐的情况下无法辞职。通过支付相对低于 `H-1B` 规定的薪水，同时吞下高额的咨询费，这些公司从签证壁垒创造的人为就业垄断中获利。对于移民签证持有者来说，这是一个极其糟糕的交易，但他们忍受了五左右窒息的、剥削性的劳动，以此作为进入科技第一世界的入场券。在那之后，他们就自由了。每个人都会立即放弃在\
  \ `Intel` 战船桨位上的位置，但总有人在等待接替。\n\n严格来说，`H-1B` 签证是非移民且暂时的，因此这种移民入会的“磨炼”是非法的。然而，每个人都在从中获利，包括政府，他们收取了数千美元的申请费。整个系统充满了制度化的谎言、政治阴谋和非法但被忽视的操纵，美国科技行业竟然还存在简直是个奇迹。\n\
  \n### 前行之路\n\n于是，我们无知地涉入了这个充斥着脚镣撞击声和拍卖师叫卖声的繁华奴隶市场。如果 Argyris 要加入我们尚未命名的公司，他需要一个工作签证。事实上，别说工作：一旦\
  \ Adchemy 终止他的聘，他甚至无法留在美国。移民法规定，前 `H-1` 持有者必须离开该国。\n\n有出路吗？\n\nArgyris 是一位自豪的希腊人，展现了令人赞叹的南欧企业精神和嗅探法律漏洞的技巧，他找到了解决方案。他的长期土其女友\
  \ Simla 正在持 `F-1` 学生签证在斯坦福大学攻读博士。如果他们结婚，Argyris 就能获得 `F-2` 学生配偶签证的资格。这不会让他正式在美国工作，但能让他留在那那里。\n\
  \n唯一的变数是，额，领证。Simla 证明自己非常配合并同意了，尽管在市政厅举行的“婚礼”在官方上是非正式的。我提议的单身派对被否决了。希腊人娶了土耳人，尽管有着追溯到希罗多德时代的地缘政治冲突，我们还有第三个创始人。\n\
  \n除了一个愚蠢的错误。\n\n在我们离开 Adchemy 的最后一周结束之际，Murthy 和 Chander 会把 Argyris 关在办公室里试图“折磨”他，在他脑海中充斥着未来的黑暗愿景：\n\
  \n*你正在为一个疯狂的项目赌掉你的未来，Argyris。*\n\n*你在最需要你的时候放弃了 Adchemy，Argyris。*\n\n*当你离开 Adchemy，你的\
  \ `H-1` 签证将被取消，你将被离开美国，失去你在这里建立的一切，Argyris。*\n\nArgyris 尽力忍受了这些磨炼。但在最后一点，他没忍住，脱口而出：“签证不是问题。我会通过我妻子拿\
  \ `F-2`。随便吧！”\n\n\n\n\n这让 Chander 和 Murthy 警觉了起来。他们咨询了公司的内部法律顾问，这些法律顾问像任何科技公司的顾问一样，对美国移民法了如指掌。他们告诉\
  \ Argyris，持 `F-2` 签证工作是非法的。\n\n严格来说，这种说法并不完全真实。`F-2` 签证持有者被留在美国并成为美国公司的投资者（Argyris\
  \ 很快就变成了这样，因为创始人通过以极廉的价格购买股份来正式对公司“投资”）。而且鉴于我们几乎没有钱，我们并没有给自己发工资，所以 Argyris 并没有在正式意义上“工作”。就像许多来自国外的初创创始人一样（他们许多人对这个国家的经济和技术成功做出了无法衡量的贡献），Argyris\
  \ 在我们设办好 `H-1` 签证之前，一直生活在法律灰色地带。\n\n然而，对于 Adchemy 来说，这一切都是无关紧要。\n\n作为正直的企业公民，他们觉得有义务——*有义务！*——向移民局举报他们的前员工正试图违反移民法（尽管再次强调，我们从技术上并没有这样做）。\n\
  \n他不想被举报给移民当局，对吧？\n\n考虑一下这一点：一家拥有数百名员工、对上市寄予厚望的科技公司，竟然威胁要将 Argyris 举报给令人生畏的美国移民和海关执法局。该机构被称为一个听起来冷骨悚然的缩写\
  \ `ICE`，负责逮捕外国人并将他们关禁，或者让他们送上飞离美国的首班飞机。Adchemy 实际上在强迫 Argyris，就像加州中央谷某一个不择手段的水果采摘队领领对待非法农工做的那样。\n\
  \n更讽刺的是：Murthy Nukala 和 Chander Sarna 本身也是经济移民，他们几年前才离开家乡印度来到美国。他们都曾被迫应对美国的签证系统，遭受过\
  \ `H-1` 的债务奴役，并受于某些赞助公司的脸色。而现在，他们坐在这里，这些曾经的奴隶变成了奴主，正对 Argyris 挥舞着签证鞭子。\n\nArgyris\
  \ 值得赞扬的是，他对这种屈辱性的待遇感到忍无可忍了。他并没有屈服，而是硬起头来，最后一次进入 Adchemy，告诉他们去吃蛋吧，如果他们想举报就随他们去。事情就此结束了。如果\
  \ Adchemy 真的举报了他，我们可能永远不会知道，但很快，在我们那家尚未成立的公司中办好 Argyris 的签证身份后，这就不重要了。\n\n在最后一天的最后一个小时，像他那样的圣人般的\
  \ McEachen 去了 Murthy 的办公室告别。他在公司投入了四多年的生命，目睹了它从一个狭小的共享空间成长到高端办公大楼宽敞的楼层。我不耐烦地等在紧急出口楼梯旁，以避免遇到任何其他员工。\n\
  \n大约十分钟后，他出来了，看起来非常惊讶，或者也许像是心魂未定。\n\n“他甚至连抬头都没看一眼。”\n\n他说这句话时声音颤抖了。他哀求地看着我。那一刻，我以为他真的会哭出来。\n\
  \n“他什么都没说，也没有握我的手。”\n\nMatt McEachen 是 Adchemy 最优秀、最高产的工程师，直到他离开这个公司大部分代码的作者，受到的待遇比一个合同清洁工还要糟糕。我惊叹于这样一个世界：在这个世界里，心心、勤奋但天真的工程师们经常被那些诱他们加入初创公司、言辞圆滑的创业家们所操纵，当他们失去利用价值时就被抛弃了。每个\
  \ Jobs 都有他的 Wozniak。我不能完全说我当时在某种程度上没有对他做同样的事。他只是用 Murthy 换成了我。\n\n工程师在代码上如此聪明，但在人性动机上却如此迟钝。他们少读读尼尔·斯蒂芬森，多读读莎比亚和帕特里夏·海斯密，会对他们更好。\n\
  \n现在没时间搞哲学了。我们决定了。\n\n“哥，赶紧离开这鬼地方。”\n\n我推开紧急出口，我们冲下楼梯，经过五层楼到达地面，离开了那场噩梦。但 Adchemy\
  \ 确实会在我们身上留下长远的阴影。\n\n精通业务的读者此时会对我们的天真付笑，嘲笑我们在审视那些自以为反抗的企业装潢和权力时，表现出的学生般的崇畏。\n\n\
  我们的问题在于，我们从未知道过香肠是如何制造的。我们从未触及世界的杠杆，哪怕是一点。\n\n现实是，硅谷的资本主义非常简单：\n\n- 投资者是金钱比时间多的人。\n\
  - 员工是时间比金钱多的人。\n- 创业者仅仅是具有诱惑力的中间人。\n- 初创公司是用别人的钱进行的商业实验。\n- 营销就像性爱：只有失败者才会为之买单。\n\
  - 公司文化是不言自明的事。\n- 没有真正的规则，只有法律。\n- 成功能原谅一切罪恶。\n- 向你泄密的人，也会泄露关于你的秘密。\n- 优胜淘汰是一场闹剧。\n\
  \n\n\n\n食物\n\n晚餐的内容被保罗·格拉姆（Paul Graham）礼貌地称为“米饭上的糊糊”：那是一种偶尔难吃、偶尔又美味的炖菜，将各种随机食材拌在一碗米饭上。PG\
  \ 或其他合伙人之一会亲自分发食物，创始人们排成一条蜿蜒的队伍，就像大萧条时期的汤厨房一样。YC 的主空间有一个完整的厨房，据说 PG 实际上会亲手烹饪那些“糊糊”——或者至少在早期是这么做的。那种带有豌豆和某种神秘鱼肉的奶油状物无疑是最糟糕的。那几周日子很不好。微波炉加热的腻灰膏味道肯定更好些。大家一致认为，意大利面上的肉丸是全球最高点（这已经是一句很高的评价了）。\n\
  \n你显然去那里不是为了食物，甚至不是为了陪伴那位杰出的演讲者。\n\nYC 真正的卖点是以下这些：接触 YC 合伙人、接触 YC 创始人网络、一种可以信赖的声望，以及\
  \ `Demo Day`（演示日）。\n\n随着故事的进展，合伙人的价值将会变得清晰。\n\nYC 公司网络的价值在于，它本质上构成了大科技世界的私人微观世界。这通常被局外人士嘲笑为“YC\
  \ 黑手”。\n\n“黑手”是一个贬义词，让人联想到穿着运动道服的俄罗斯人猛灌伏特加，对着备用手机大吼大叫，并用沙哑的斯拉夫语口调彼此低声耳语。YC 周围存在一种集体防御的感觉，如果受到威胁，他们确实知道如何结群结队。\n\
  \n然而，真正的网络效应是这样的：随着 YC 公司池每年的扩大，你可能仅通过 Y Combinator 公司就能重现我们互联网时代所使用的 80% 的消费者技术和基础设施技术。无论你有什么需求，无论是系统监控工具、移动开发工具，甚至是营销工具（“你听过我们的产品\
  \ `AdGrok` 吗？”），你都能找到一家 YC 公司来满足。鉴于你是自己的一员，你可以获得极佳的服务和巨大的折扣。你还可以确定，无论你正在构建什么，都会获得\
  \ YC 网络中其他人的优先采用，这为你提供了一批即时的聪明且耐心的用户，以及可以在路演包（pitch deck）中展示的令人印象深刻的 Logo。这种“自用”\
  \ YC 产品的倾向直接源自高层。如果有一天 YC 资助了一航空公司，我怀疑 PG 只会坐那一家，别的都不坐。\n\n至于那种可以信赖的声望的价值，我们很快就能看到那了。\n\
  \n### 商业模式\n\n那么我们在 Y Combinator 构建的是什么呢？\n\n要理解这一点，我们需要最后一次关于在线媒体的讲，然后我就会从教学的讲台上走下来。我保证，之后就是纯粹的金钱、性与死亡了。\n\
  \nGoogle 如何能够每年创造 7000 亿美元的收入，超过了卢森堡或白俄罗斯的 GDP？它发明了名为 `Google Search`（谷歌搜索）的魔法网站，全人类都去那里告诉\
  \ Google 他们想要什么：“尼康 D300 相机”。“在线护理学位”。亚特兰大的的离婚律师”。这是一个由三个和四个单词组成的欲望和需求的世界，一切都渴望被满足，且都由等待开启的钱包支撑。在购买的最后一个时刻，在欲望的顶峰注入自己，Google\
  \ 邀请你点击广告。你每点击一次，它的收银机就会响一次。\n\n它甚至不需要弄清楚搜索查询值多少钱并据此定价。它只是在每次查询发生的时刻，对每个输入的搜索查询进行拍卖。最终结果是，Google\
  \ 每天运行数十亿次关键词及配套出价的拍卖。通过查看出价并估计点击概率，Google 取两者的乘积（即每次查询能赚取的金额）并选取最高的。然后，它显示广告主为该关键词创建并上传到\
  \ Google 的关联广告。\n\n实际打印纸币可能比这更难。\n\n### 关键词营销\n\n那么在 Google 的术语中，有多少这样的搜索查询（或“关键词”）呢？\n\
  \n1989 年出版并在此不断补充的第二版《牛津英语字典》包含 291,000 个词条。《Woordenboek der Nederlandsche Taal》（荷兰语词典）是一部荷兰语字典，也是世界上最大的单语词典，达\
  \ 50,000 页，包含 431,000 个词条。这两个作品在那些由词典学家变为文字商人（即搜索引擎营销人员）所维护的关键词列表面前都显得微不足道。就像投资组合经理保留一组具有理论价格和当前价格的资产一样，付费搜索经理维护着带有美元符号值的百科全书词列表，并不断调整出价以反映实际性能。这些列表的数量实际上以百万计，看起来像这样：\n\
  \n| **关键词** | **单点击成本** | **单次点击收入** |\n| :--- | :--- | :--- |\n| “divorce lawyer\
  \ in reno” | $1.45 | $0.90 |\n| “nevada cheap divorce” | $0.75 | $1.10 |\n| “nevada\
  \ divorce lawyer” | $5.55 | $2.75 |\n\n就像低买高卖的经典选股者一样，我们的搜索引擎营销人员像修剪盆景一样精选和修剪关键词列表，买更多表现良好的关键词，少买表现较差的。如果点击后销售产生的收入超过了成本，出价和预算就会上升，反之亦然。收入与成本的比率被称为“支出回报率”（`ROAS`）。\n\
  \n\n\n\n\n# 所以我们的切入点是什么？\n\n非常简单。Google 赚取的巨额财富并不是通过它提供的简单广告购买工具形成的。那些工具对于经验丰富的营销人员来说太初级了。中介公司，就像交易所的经纪人一样，为那些每年在\
  \ Google 关键词上花费数百万美元的人提供了复杂的工具。然而，小企业——比如在 `Etsy` 上开网店的定制珠宝制作者、当地的管道维修工——并没有这样的工具，因为\
  \ Google 粗糙的工具对他们来说也太困惑，而且关键词拍卖又太动态了。这就像金融世界有像 `Goldman`（高盛）这样的大投资银行，却没有供普通投资者使用的\
  \ `Charles Schwab`（嘉信理）。由于 Google 大部分收入来自其他领域，无论如何都没有耐心或内部文化来为小型广告主创建工具，它所提供的工具复杂得令人生畏且毫无作用。这里突出的问题就像互联网服务提供商的“最后一公里”问题；需要某种技术才能将数据从宽带光电缆传输到想要流媒体\
  \ `Netflix` 的家庭用户。我们将成为那个最后一个环节，让家庭小店最终能够在 `Google` 上花钱，而不是浪费掉一些实验性预算，然后因为表现糟糕的关键词或不明智的竞价而精疲力竭。\n\
  \n## 竞争\n\n我们面临很多竞争。一家名为 `Clickable` 的公司（已倒闭）拥有一支明星广告投资者阵容，并筹集了超过 3200 万美元来解决同一个难题。`Lexity`（已倒闭）由一位前\
  \ `Yahoo` 高管创立，筹集了 600 万美元。`Trada`（已倒闭）采取了一种有趣的众包解决方法，建立了一个市场，让广告主可以轻松找到活动经理来负责\
  \ `Google` 搜索广告活动的日常管理。它筹集了 1900 万美元，其中包括来自 `Google Ventures`（GVC）的资金，而这正是它所连接广告主的伙伴公司的风险部门。\n\
  \n你会注意到这里有许多亡者。我们当时并不知道，但没有人能弥补 `Google` 与小企业宇宙之间的“最后一公里”差距；直到今天，这仍然是一个未解决的问题。尽管有这些技术万能论主义，但并不是每个问题都有工程解决方案。当然，这并不意味着你不能卖出一个解决方案。\n\
  \n## Mountain View 的日子\n\n遵循 `YC` 的法则，我们会在 `YC` 总部附近进行训练营，远离旧金山那些迷人的干扰。\n\n我为我们找到了一个便宜的一居室公寓作为办公室，位于\
  \ `Mountain View` 主干道 `Castro Street` 西三个街区的地方。除了作为 `Google` 的家乡之外，`Mountain View`\
  \ 只是从旧金山到圣何塞的 `101` 号公路和 `Caltrain`（通勤火车）沿线城镇中的其中之一。比起高档的 `Palo Alto`（帕洛奥图）或 `Menlo\
  \ Park`（门洛公园），这里更平民、更具工人阶级色彩，那里住了几家初创公司以及 `Fenwick & West` 律师事务所——遗憾的是，我们会对这个实体变得非常熟悉。市中心正是\
  \ `Red Rock Coffee`，它是半岛最极极客、最具初创风的咖啡馆，他们武器化的糖加咖啡因摩卡将支撑我们度过接下来的几周。\n\n我刚搬出我在 `SF`（旧金山）的单身公寓，和英国交易员以及小\
  \ `Zoë`住在一起（此时我们的关系很微妙但仍有希望），而且还有多余的家具。我们的公司总部很快有了一个折叠床、一个我们直接扔在地上的、极具“蒂华纳性妓院风格”的床垫，以及三张用来自\
  \ `Home Depot`（家得）的廉价室内门和锯架制成的桌子。我们用 `YC` 给的小硬币买了一些电脑硬件——显示器、给哥们们的新机器——然后开始没命地写代码。\n\
  \n## 定义 GrokBar\n\n在公寓里的第一个周，当我们等待 `Argyris` 从 `Adchemy` 抽身时，我和 `MRM` 在两张大的 4×8\
  \ 英寸马克笔板上勾勒出了 `AdGrok` 产品（名为 `GrokBar`）的愿景。\n\n我们最初对 `GrokBar` 的讨论实际上可以追溯到 4 月 16\
  \ 日我写给哥们们的一封邮件，当时我们还在 `Adchemy`，那是对最近停用的 `DiggBar` 的一次无颜无耻的抄袭。这是一个运行在用户浏览器内的特殊窗口，允许他或她“Digg”（`Facebook\
  \ Like` 的早期版本）一段内容。它不需要网站所有者在他们的网站上包含特殊的 `Digg` 代码，也不需要用户将 URL 剪粘贴到 `digg.com`，浏览用户只需作为其正常浏览行为的一部分进行评论和“Digg”内容。这就像是冲浪网页的人有一个头显示器，无论他在在线的哪里，都能显示出互联网对每件内容的观点。\n\
  \n考虑到它的出身，早期的 `GrokBar` 与 `DiggBar` 非常相似，因为它会在用户浏览自己的在线商店时伴随其后。它被固定在浏览器面板的顶部，纤细且相对不引人注目，列出了你正在运行的\
  \ `Google Ads` 的统计数据。当你浏览你的在线商店时，统计数据会根据你查看的产品页面对数据进行划分，提供了一个上下文视图，显示 `Google` 上的哪些广告驱动了该产品的销售，价格是多少。就像\
  \ `Digg` 显示你的朋友对文章的评论和点赞一样，`GrokBar` 向你展示 `Google` 如何为该产品页面引入流量，人们为了到达那里搜索了哪些关键词，以及你为搜索结果旁边显示广告支付了多少钱。\n\
  \n## 如何销售\n\n但如何销售它？\n\n大多数初创公司决定攻入小型企业（SMB）市场，因为他们认为那里是容易进入的目标。企业级销售太难，销售周期太长，而且大公司对初创公司缺乏信任（也许是合理的）。因此，他们卖给那些深受政治家喜爱的、美国价值观的神圣基石：普通老夫妇（Mom\
  \ and Pop）。虽然老夫妇确实可能尝试任何事物，而且典型的软件和服务的质量会让意大利电话公司看起来像尖端产品，但事实也是老夫妇非常无常，他们可能会取消对有用的服务的订阅。此外，考虑到每笔交易只能赚取五十到一百美元，这些小钱意味着任何高触达的销售流程都是不可扩展的。因此，你必须以某种方式扩展销售，要么与已经拥有\
  \ `SMB` 关系的人合作（例如 `Salesforce` 或报纸的广告部门），要么在拥有小企业客户的现有平台上构建，前提这对于你的技术是可能的。\n\n在我们案例中，我们在伙伴关系方面几乎没有成功，在建筑方面也取得了小规模的成功。但这把故事说得太快了。让我们回到\
  \ `Mountain View` `Oak Street` 上那个破旧的一居室，三个心惊胆胆的人正在拼命舀水救命。\n\n\n\n\n联合创始人之间的关系远超你在平庸的企业生活中常见的典型职业同事情谊。你可以把这种军事比喻推得太远了——毕竟在这里没有人在承受炮火攻击，我们在自欺欺人呢？——但初创体验确实具有某种“战友”般的、“战壕”式的色彩。除了坐在你旁边的另一个同样可怜的蠢蛋，没人相信你正在做的事情，如果你不成功，他也和你一样惨。除了你们共同的幻觉，没有任何东西能维持这个实体的运转。而你们就坐在那里，工作着，发着火，完成着人生中最出色、也最不考虑周全的工作。\n\
  \n## 最终你对联合创始人会有有多了解？\n\n情况发展到了这种程度：当我去我们的洗手间时，我能看出是谁最后用过的厕所。那间卫生间铺着典型的 80 年代水磨石地板，贴着廉价的瓷砖，是一间极其不洁的厕所，三个压力极大的男人整天都在这里解手。`MRM`\
  \ 的粪臭闻起来更像草味和农场味，符合他以素食为主的饮食。`Argyris` 的则没那么像堆肥，而是更像潮湿、病态的人类味道。\n\n只要时间足够，你对联合创始人的了解比他们的母亲和伴侣还要多。在考虑那个你想和他一起申请\
  \ `Y Combinator` 的同事时，请深思这一点。\n\n## 你可能会说，这些都太感性。那金钱方面是怎么运作的？头衔呢？\n\n问得好，这是你应该和潜在的联合创始人一起回答第一个问题。\n\
  \n如既往常，我们是一群缺乏经验的笨蛋，犯了每个初创创业团队都会犯的经典错误：即我们平分了股权。对半、或者三分之一、或者什么——公平就是公平，对吧？\n\n###\
  \ 这导致了以下局面：\n\n在 `AdGrok`，每一个重大决策都变成了这个群体决策的“自嗨圈”，这对于细微的产品调整和日常琐事来说没问题，但对于战略愿景和企业文化等大问题来说绝对是致命的。如果我们必须在后期进行某些产品转型——如果我们不是深信不疑，很可能不得不这样做——我们三个人根本不可能达成共识。这类决策不是数据驱动的协作结论，不是由电子表格和饼图驱动的。不，它们是大胆的、直觉的、赌上公司命运的举措，由个人决定，类似于风暴中的船长，或市场波动中的华尔街交易员。你的生存与灭亡取决于此类决策，它们很可能是错的，但不做决策比做出错误的决策更致命。\n\
  \n简而言之，`AdGrok` 在创始人动态方面完全是一个烂团子，这在很大程度上是因为我们在股权上是平等的，因此在权力上也是平等的。更糟糕的是，因为我们三个人，我们通常会形成两个人的派系来反对一个异见者。我个人而言，我会经历这样一段时间和\
  \ `Argyris` 关系亲密（当然是反对 `MRM`），然后又回到支持 `MRM` 而反对 `Argyris`。这简直是疯了。\n\n## 从我们的失误中学习吧，亲爱的读者！\n\
  \n事实应该是这样的：要么你和你的创始人之间实现了某种“瓦尔康式”的心灵感，你们的大脑在某些成长性生活经历（如军事或艰难获得的工作经验）的熔炉中焊接在了一起；要么由一个人主导局面（至少拥有\
  \ 51% 的股权）。仅此而已。\n\n### 那头衔呢？\n\n在早期，唯一的头衔是 `CEO`。其他人无论自称自己为“克苏鲁神圣光荣大领袖”对结果都没有影响。初创公司是仁慈的独裁政。就像海盗船一样（其战利品的分配在那个时代是令人惊讶的平等），初创公司比他们的传统对手更平等地分配所有权（和责任）。但像海盗船一样，初创公司有一个船长。他基本上是根据法令统治的，当然也受到现代职场所有表面礼节的调节，再加上任何值得上薪水的员工都能轻松地在其他地方找到工作。但他仍然拥有统治。如果对他的信任真的受到动摇，其他创始人（以及更重要的董事成员）可以兵变，并合谋将其撤职。但在那之前，尽管早期初创公司会发生所有激烈的辩论，`CEO`\
  \ 拥有最终决定权。每个人必须接受这一点，否则就退出进程。\n\n在我们与 `PG` 的第一次会面中，形式是在山景城（Mountain View）工业区 `YC`\
  \ 办公楼周围散步，我正焦虑地分享我们对要构建什么的困惑。在那些早期，我们正在跳一整场产品“转型”芭蕾。\n\n十分分钟后，他停下来。\n\n“我认为这里真正的问题是，你们没有明确的领导者。”\n\
  \n他指向我，继续说道：“从这次对话来看似乎是你，但我想你应该先弄清楚这个问题。”\n\n我已经是名义上的 `CEO`，但只得到了兄弟们微弱的支持，特别是 `MRM`，他仍然认为职业资历在科技领域意味着什么（从我上高中开始他就在科技行业里了）。这次与\
  \ `PG` 的会面将巩固我对这一头衔的声张。\n\n我们在我们批次的其他公司身上见过无数次这种情况。我太在意 `YC` 的*缄如守口*（omertà），所以不会指名道姓他们，但在大约三十家公司中（我知道的，可能更多），至少有六家公司的领导层存在激烈争议。就像某些第三世界的政府一样，他们要么因为内斗而崩溃，要么遭受内部政变，导致一些创始人被扫地出门外。`PG`\
  \ 足够远见，仅凭几秒钟的演示或在第一次会面（就像他对我们做那样）就诊断出了这个问题。在一个难忘的案例中，我认识两个创始人，当一年后不可避免的冲突发生时，他们已经筹了一笔钱并接近收购。场面非常糟糕，但那是他们本该早得早解决的问题。正如\
  \ `PG` 告诉我们大家的那样：*要一个领导者！*\n\n## 那么，我的战友们是什么样的？\n\n`Matthew McEachen` 是一个真正的工程师，可以阐述几乎任何主题，从某些硬件驱动程序的奥秘到\
  \ `Apple` 最新 `OS X` 的细枝末节。他是那种看到路牌挂在杆子旁摇摇欲坠，就会停下来掏出一把 `Leatherman`（多功能刀）把路牌拧回去的人，无论他之前在做什么。只要在技术上可行，他在技术上就能做到。他还有相当的设计底子，创作了我们的第一个\
  \ Logo、网站、名片，以及任何需要审美者触感的东西。\n\n从负面方面来说，他对自己在 `AdGrok` 架构中的重要性有过高的评价，认为自己是我们所做一切事情的引擎，因为他是资深技术人员。然而，初创公司的意义远不止你对数据库技术的选择，`Argyris`\
  \ 和我确实在各自的领域发挥了作用（他负责技术方面，我负责其他一切）。更糟糕的是，他很容易被任何出现的闪亮科技玩意儿分散注意力，并像许多一线工程师那样，投入全部精力消除某个单一的技术\
  \ Bug，或者改进我们基础设施中某个无关紧要的部分，而这些在整体计划中是微不足道的。\n\n\n\n\n尽管他在技术领域拥有丰富的职业经验，但他却让我想起一个大学年纪的实习生，有着那种童子军式的世界观以及浅薄的商业和政治见解。他在情感上非常脆弱，必须时刻保持开心才能发挥生产力，无论这指的是要监控家里妻子和孩子的动态，还是得对付那个永远好斗的\
  \ Argyris 以免让他烦扰他。如果他心神不宁或不开心，他的效率就会降低——而我们大多数时候都处于心神不宁且不开心的状态。\n\nArgyris 是一个 `Stanford\
  \ PhD`，毕业于一个著名的机器学习实验室。他是一个名副其实的技术侦察专家，能够胜任从编写算法到破解服务器配置文件的任何工作（并且对这两者都乐此不疲）。对于一家早期初创公司来说，他是理想人选，是一个在任何情况下都是财富的多能型黑客。Adchemy\
  \ 是他毕业后的第一份工作，他在那里甚至待不到一年就跳到了 AdGrok。他将未经磨砺的青春活力和生命带到了 AdGrok。\n\n但反面是，Argyris 脾气古怪、情绪阴晴不定，且好斗到会挑架的地步。我认同他的个人风格，你也可以对他对我提出同样严厉的批评。那种整个阴暗的、拉丁/地中海式的风格也是我常有的情绪状态，但我（某种程度上）意识到这种风格在刻板的英格-撒逊世界里行不通。很多时候，Argyris\
  \ 在大多数会议中带来的热量多于光亮，很多产品讨论都会因为他突如其来的爆发而付诸炬，这种爆发就像某种情绪简易装置（IED），事后只留下满地的烟雾残骸和断肢残躯。我和经常几乎会大打出手，但以那种疯狂的拉丁方式，我们很快就会和好，稍后去喝杯啤酒。这种情绪热更严重且更持久的影响是，它让\
  \ MRM 感到沮丧，他会在家里呆一段时间来平复那种大体的糟糕氛围（这只会让 Argyris 和我更加愤怒）。\n\nArgyris 还倾向于随某一天的心情决定做什么。Matt\
  \ 作为 CTO 和最资深的技术人员，本应该介入并管理他的注意力，但他实际上没有那个胆量这样做，这需要我介入并偶尔大声制止 Argyris。这些对峙会让所有人变得面色阴沉，对士气毫无益处。\n\
  \n此外，或许更严重的是，这帮哥们儿之间经常私下争吵。我完全不想扮演什么调和者的角色，认为两个成年人应该直接把他们该死的工作关系解决，这样我们才能继续接下来的表演。\n\
  \n### 人性问题\n\n人们进入初创公司时，认为技术问题就是挑战。在实践中，技术问题是容易的，除非你无能，或者真的处于人类知识的极端边缘——例如，把人送上火星。不，初创公司中的每一个真正问题都是人性问题，因此它们最难解决，因为它们通常没有真正的解决方案，更不用说现成的软件修复方案。初创公司是群体心理学的实验。作为\
  \ CEO，你既是治疗师型的领导者，又是最需要治疗的患者。\n\n正如 YC 合伙人 Geoff Ralston 告诉我们的：人们并不会真正改变，他们只是变得更更好的演员。\n\
  \n对于你们在接下来的章节中将看到我们面临的所有生存挑战，最终击败 AdGrok 的并不是外部敌人。不。而是我们的本性，是我们在每天早晨在镜子里看到的那些男人。\n\
  \n#### 速度是一种特性\n\n> “如果一切看起来都在控制之中，那说明你跑得不够快。”\n> —Mario Andretti，F1 赛车手\n\n####\
  \ 2010 年 7 月\n\n有一天让我们确切意识到正处于什么种类的烂境中。在初创公司的奥征之旅中，我们品尝过不同口味的糟糕——“屎味冰淇”基本上是创业的精髓——但这一次是焦虑和自我怀疑的深渊，是内心那只啃咬的啮鼠，用“我真的能搞定吗？”的念头噬着你的肠胃。\n\
  \n作为对他们投资的人员进行的初步测试，YC 宣布我们将举办一个“原型日”（Prototype Day），这是一个简短的演示，用来向其他 YC 团队展示我们在做什么，并（一如既往地）促使我们更快地开发产品。对于当时的\
  \ AdGrok 来说，“原型”都是慷慨的描述了。我们的应用甚至几乎无法运行。它没有所谓的“生产”版本。唯一可以运行的版本指向 URL `localhost:3000`，这是技术不成熟的典型标志。它基本上是运行在一台机器上的随机代码堆。\n\
  \n每个团队都有九十秒时间展示他们的进展并向本期的其他成员介绍自己。地点就是我们杰出的演讲者进行每周训话的地方，投影仪对着前面的墙。其他团队会坐在通常晚餐时坐的长凳上。有些演示展示的是完成的产品，有些处于早期，但似乎没有人像我们这样落后这么多。\n\
  \n然后突然轮到我们了。我插上笔记本电脑，在浏览器中打开了我们粗糙的工具，退后一步面对观众——结果立刻绊倒了投影仪的电源线，猛地将其从插座上拔出，导致投影仪横向扫过桌子，我在过程中也差点摔倒。屏幕变白了，房间陷入了黑暗，AdGrok\
  \ 的所有人开始手忙脚乱地咒骂着试图重新打开。等我们弄好时，我只剩下十秒钟，其中可能只有五秒是演示。这初秀完全是一个彻尾的闹剧。\n\n活动结束后，那帮哥们儿没少埋落我，我严重怀疑我们的能力（更准确地说，我的能力）能否搞定这件事。我们回到\
  \ AdGrok 时，每个人都面如死灰。\n\n这里是创业游戏教给你们的一个教训：\n\n还记得高中时有一群广受欢迎的孩子，他们总是是关注的中心，追求拉拉队员，之类的吗？还记得五年后你回到家乡，偶然撞见其中一个戴着名牌、穿着浅蓝色牛津衫的人，在当地的沃尔玛担任助理经理吗？也许他已经和那个拉拉队员结婚了，她在生下三个孩子后胖了六十磅，他们现在住在那种你曾有心逃离的破郊区房子里，过着无味的生活？也许结果并不糟糕：那个拥有精心策划的课外活动组合的优等生，十年后成了你所在名牌机构的平级同事，和你一样。\n\
  \n初创公司也是如此。\n\n以我们本期的一家公司为例吧。我应该先说明一下，我喜欢这家公司，认识这些创始人，并且仍然在使用他们的现有产品，它非常有用。我们来这里不是为了嘲讽这些男人，而仅仅引用他们作为一个常见现象的例子。\n\
  \n\n\n\n仅仅过去了两年（剧透预警！）：我当时是 Facebook 少数几个产品经理之一，负责构建那里的造钱机器。Rapportive 的使命已经完成，正在寻找一个软着陆的机会。我将\
  \ Rahul 介绍给了 Facebook 的企业发展团队。Facebook 决定放弃了，但 LinkedIn 没有。Rapportive 最终以一种和我们相似的“收购人才”方式退出了。\n\
  \n有一个犹太民间故事，讲述一位圣经时期的国王派遣他的一位智者去创作一句咒语，使其既能谦虚骄傲的人，又能安慰不幸的人。在市场搜寻后，我们的智者咨询了当地的珠宝商，最后带着一枚刻字的戒指回到国王面前。国王紧握戒指读道：`THIS\
  \ TOO SHALL PASS`（这一切终将过去）。所以，当你为自己的苦恼思考同行和竞争对手所谓的胜利，或为难得的创业成功感到高兴时，请记住这一点。这一切很快就会过去，而且比你想象的快得多。\n\
  \n对于初创公司来说，媒体关注就像性爱。只有两种：好的……以及更好的。一个创始人宁愿因公开同性恋、恋童或兽交被捕（`baaaaa!`），也不愿让自己的公司被媒体忽视。到目前为止，我们的媒体足迹几乎为零。早期的初创公司更多是包装而非实质。现在是时候大放异彩了。\n\
  \n在那帮伙子离开公寓后，我留下一间空荡、狼藉不堪的一居室公寓，背景音是楼上又在举办另一场神秘聚会的印度人的吵闹声。我的个人理论是他们在开看色片的派对，因为派对开始时伴随着大量的尖叫和跺脚声，然后突然安静下来，就像我青少年时期参加过的类似派对。我在布满划痕的地木地板上沉思地踱步。在第一篇文章中，我可能触碰的最敏感神经线是什么？除了那喷涌而出的自恋之泉——纽约人膨胀的自尊心，还能是什么？噢，创业之神正在微笑！\n\
  \n### 背景 \n在前一天晚上的晚餐会上，Ron Conway 提到他对纽约的创业氛围留下了深刻。PG 也对此发表过一些随意的评论。想起我在高盛的日子，我想象了纽约在创业方面所有极其糟糕的问题：缺乏风投、崇尚投机而非建设的文化、华尔街带走了顶人才，当我宣布离开华尔街加入创业公司时收到的冷笑目光。任何认为纽约是创业肥沃土壤的人都从未在那里生活或工作过。PG\
  \ 是我们的天才导师，但像许多才华横溢的人一样，他偶尔也会犯下严重且离谱的错误，而这就是其中之一。\n\n缪斯女神疯狂地低语着她们的想法，我开始打字。相关的脚注之后是一段有趣的轶事，接着是带有诽谤的过度概括。在在那帮伙子离开后连续敲了两个晚上后，我搞定了。\n\
  \n### 尝尝：\n#### 开源与闭源\n\n***\n\n纽约的整个经济都建立在信息垄断之上。华尔街银行之所以赚得盆满，是因为他们对交易产品的市场流有内部消息。文学经纪人利用稀缺的出版渠道机会与大量充满希望的作者之间套利。房产中介（这些是*租赁*房产的中介，而不是出售房产）在您签署租约时通常会收取\
  \ 15% 的佣金，赚入整整两个月的工资（即，超过 `$5000`），仅仅是为了获得告诉您哪里有空房的特权。\n\n在纽约，这些垄断无人挑战。\n\n在旧金山，人们不会给房产皮条子支付两个月的租金：他们创建了\
  \ `Craigslist` 并让皮条子过时。\n\n还能为了点击量推销什么？还有什么迷因在国家时代精神中闪过？\n\n噢！\n\n除了我的前雇主，那只用触手在各地侵犯处女并抢劫饥饿婴儿的大乌鱼？伟大的资本主义邪恶：`Goldman\
  \ Sachs`。所有人都会为它的处决欢呼。想象一下对它内部真实生活的猎奇兴趣，以及对其嘲讽的喜悦。这将是一场令人兴奋的禁忌揭秘盛宴。\n\n纽约的科技和 `Goldman\
  \ Sachs` 的生活，将是我们进入企业驱动的、雇佣式文字的前两次尝试——用那个难听的营销人员的话来说，之为“内容营销”。\n\n根据领先的公关神话，发布当天周几的选择至关重要。媒体热潮将取决于它在启动的行业回声室内的规模和共鸣。因此，你希望在发布后有几个完整的工作日来让那种回声发挥出来。周一太早了，因为大家还在倒时差、宿醉或因周末而昏昏欲睡，并且忙于赶邮件和会议。到周四，人们已经在考虑周末了，并可能早早离开参加本周的第一场欢乐时光。周五是用来掩埋新闻的，而不是发布新闻的。那是人们被解雇发布糟糕财报的时候。\n\
  \n我们会在周二发布，这留下了最长的时间让公关爆发在互联网上回响，跨越所有层级的互联网连接，从同化的互联网半人到堪萨斯州的祖母。\n\n太平洋标准时间上午九点左右，我导航到互联网上那个老牌但小众的角落：`Hacker\
  \ News`。这是一个由 `Y Combinator` 自托管的类似于 Reddit 的留言板，它是超级技术极客、忙碌的 `YC` 创始人以及那类既感到沮丧又道貌岸是的伪装者（被称为“想创业者”）的奇混合体。我发布了文章，同时请求几个朋友给文章点赞以获得一些初始热度。几分钟内，它就成了\
  \ `Hacker News` 上的热门帖子，被世界上每一个严肃（以及不严肃）的年轻科技宅看到。然后 `Scoble` 推特了它，事情就彻底失控了。\n\n\n\
  \n\n最后，MRM 在远程博客服务器上获得了一个命令行提示。通过几条执行极其缓慢的命令，他成功地将博客复制到其他部署快速的 Amazon 机器上，并将毫无阻拦的网络流量洪流立即重定向到所有新机器。MRM，这位工程师中足智多谋的救星，如果必要的话，可能可以在一台微波烤箱上运行\
  \ Linux。\n\n我在我的电脑上访问博客并验证了这一点。它运行正常……我们再次上线了。现在是时候礼貌地回复那些友好的推文了，并煽动黑粉让那些病毒式的话题持续下去。帖子本身迅速积累了数十条、最终是数百条评论，有赞的也有反对的，而且同样有用。到结束时，我们获得了数千名注册用户。那些刚刚出现的、带有标题党色彩媒体（如\
  \ `Business Insider`）毫无廉耻地抄袭了最精彩的段落，并围绕它们撰写了整篇文章，利用我们的公关势头。来自电视节目 `20/20` 的一名制片人（那还在吗？）从纽约打来电话。来自\
  \ `Business Insider`、名叫 Courtney Comstock（名字像个色情明星）的记者也打来电话，就纽约科技界提出了后续问题（她后来也写了关于我那篇关于高盛的文章）。斯德哥尔摩的一个随机科技会议邀请我去演讲，并报销费用。人们将帖子转发给像\
  \ Chris Dixon 这样著名的纽约投资者，并要求他们评论。社交媒体的丘陵上充斥着 AdGrok 的声响，我觉得自己就像是《惊魂博士》结尾的斯莱姆·皮金斯（Slim\
  \ Pickens）：尖叫着、嚎叫着，挥舞着我的牛仔帽，骑着原子弹坠落，渴望着那朵巨大的蘑菇云。\n\n作为一种策略，它的效果比预期要好。AdGrok 的流量呈指数级增长，就像斐波那契的兔子一样。我们每天达到五万次页面访问，这对于《大西洋报》来说不算什么，但对于一个直到一天前只有……额……每天十左右页面访问的初创公司来说已经很多了。（如果我们是受虐狂的话，我们本可以查看\
  \ Web 服务器日志并发现这些访问中有一半源自 AdGrok 或我们的家人。）\n\n一如既往，当好牌出现时，加倍投入。\n\n我们的弹药库里还有第二篇关于高盛的文章。我在关于纽约科技界的那篇文章中包含了一个指向高盛文章的链接，但很少有人谈论它。公关海啸在周三顺利地达到了顶峰，并持续到该周的剩余时间。到周一时，集体大脑就会转向下一个有趣的帖子，我们需要重新点燃大家的兴趣。\n\
  \n这篇帖子将是系列超级病毒式博客文章的开篇，这些文章将把 AdGrok 推入初创企业的版图（如果不是完全进入客户市场）。每三到四周，从人类思维厕所里排出的另一股气体性气体（又名：我）就会出现，并把我们推向\
  \ Hacker News（科技极客的《时尚杂志》）的顶部，在转瞬即逝的科技流行圈中引发再次轰动。直到 AdGrok 结束，像“goldman sachs”和“fuck\
  \ you”（我曾写过一篇关于永远不可捉摸的目标——“老子钱”的文章）这样的搜索词将是引导用户点击我们网站的最热门词汇。这让 MRM 无奈地抓狂。但嘿——我没看到每天有五万人排队使用我们构建的产品。只要能找到眼球，我们哪里都要。\n\
  \n由于亚马逊云服务的近乎灾难，再加上几次停机和服务器崩溃，MRM 建议我们经常运行一个“混沌猴子”（chaos monkey）。这是一个由 Netflix 创建并开源的软件工具，旨在测试产品或网站应对随机服务器故障的恢复能力（正如我们刚刚在博客上见证的那样）。\n\
  \n为了理解混沌猴子的功能和名称，请想象一下：一只黑猩猩在数据中心里横冲直撞，那是运行从 Google 到 Facebook 的所有设备的、闪烁着灯光的空调仓库。它在到处拔扯电缆，在到处砸碎箱子，通常会拆毁整个地方。软件混沌猴子执行的是相同内容的虚拟版本，在意外的时间关闭随机机器和进程。挑战在于让你的特定服务——Facebook\
  \ 消息、Google 的 Gmail、你初创公司的博客，无论是什么——都能在猴子的破坏中生存下来。\n\n从象征意义上说，技术企业家是社会的混沌猴子，拔掉了从出租车执照（Uber）到传统酒店（Airbnb）再到约会（Tinder）的一切插头。一个又一个行业仅仅通过风险投资支持的创业冒险和匆忙交付的软件被击败。硅谷是圈养混沌猴子的动物园，它们的数量随着时间的推移不断增长。随着风险资本的爆炸，并不缺香蕉来喂它们。社会面临的问题是，它是否能完好地从这些创业混沌猴手中生存下来，以及要付出怎样的人类代价。\n\
  \n## D 日\n\n在这个世界上，你唯一拥有的就是你能卖出的东西。\n\n——亚瑟·米勒，《推销员之死》\n\n### 2010 年 8 月 26 日\n\n\
  无论是否公正，生活中总有一些特定的时刻，在这些时刻，我们的性格会被衡量和评估：一场至关重要的入学考试、一次在大牌导演面前的试镜、一次难以获得的工作面试。有时，我们甚至不知道那个时刻是决定命运的支点之一：与我们未来伴侣的第一次约会，致命事故发生前的一刻。\n\
  \nY Combinator 的路演日（Demo Day）正是这样一个关键事件。\n\n你向生活的轮盘投掷你的小白色小球，它要么变成赢家，要么变成输家——你也是如此。如果你像我这样是一个处于劣势的局外人（如果你不是，你只能认为这是理所当然），你能最好的希望就是能在最大的轮盘上占有一席。好吧，这一点我们已经实现了，但我们不知道我们的白色小球会停在哪里。\n\
  \n路演日的活动规则如下：YC 批次中的三十多家公司每家都有两半分钟的时间向聚集的硅谷风投精英展示或演示其产品和愿景。由于 Y Combinator 的空间非常小，演示将分三波进行，按参与者的重要性递减排列（例如，Sequoia\
  \ 出第一波，Comcast Ventures 出最后一波）。公司按预先分配但随机顺序进行，整个演示马拉赛持续两个小时，中间休息两次。\n\n\n\n我已经练习了那个路演（pitch），以至于多年来我甚至在梦都在重复那份剧本，所以正式开始时并没有波澜壮阔。AdGrok\
  \ 的路演很简单：`Google AdWords` 代表着一条巨大的财富河流，其中很大一部分完全没有被开发或被任何人触及，它从世界流向 Google，其流势宏伟壮丽。我们将占领其中的一部分。即使我们分到的只是一小部分，也足以满足初创公司对贪婪的梦想。\n\
  \n为了娱乐，或者可能是为了衡量质量，YC 管理层在我们排练后，在创始人之间进行了一次匿名投票，选出最佳路演。AdGrok 获得第二名，紧随其后的是 Rapportive，后者那精炼的原型日（Prototype\
  \ Day）路演让我非常沮丧。这和我像查理·卓林一样被电线绊倒、一边展示一个并不存在的产品的结果相比完全不同，不是吗？\n\n1996 年的夏天，我在潘普洛纳参加了“奔牛”。\n\
  \n海明威对整件事的描述过度了。首先，并没有所谓的“奔牛”。那是一个名为圣费尔敏节（San Fermín，以潘普洛纳的主保圣人命名）的城市节日，其中一系列斗牛只是整体欢乐活动中的附属部分。为了将斗牛从镇边缘的牛圈运到斗牛场，那些永不切实际的西班牙人决定直接让牛冲过街道。同样按照典型的西班牙风格，当地的\
  \ *mozos*（小伙子）决定在奔跑的牛前面冲跑以证明他们的男子气。快进几百年，这现在已经成了落后欧洲青年的狂欢节。\n\n这件事情的几何构造是这样的：粗壮的木制栅栏比你本人还高，排列在路线的街道两侧。那天早晨八点，当地警察在必要时用警棍驱散了路上的醉汉和游客。他们留了一处靠近市政厅的入口，供所有潜在的跑者进入。然后，他们关闭了栅栏。任何留在里面的人都是冒着生命危险。在接下来的十分钟里，没有人会试图救你，而在那段粗糙的铺卵石街道上，既没有上帝，也没有法律。\n\
  \n在牛群释放前的那十个不留情的分钟里，我站在那里。那种感觉是一种刺痛的剧烈：生命以那种颗粒状、黑白片的方式慢了下来，就像你在做极度危险的事情时，你的大脑模仿\
  \ JFK 刺杀录像的方式一样。成年汉们面色苍白、低着头，思考着自己的生死，也许是他们第一次。有些人看起来对战斗很兴奋。另一些人只是忙于最后的准备，比如拉伸身体，那可能更多是心理上的而非身体上的。很快，我们听到了蹄子踩在铺卵石上的咔哒声，开始亡命逃生。\n\
  \n你会指责我夸大其实，但在演示日（Demo Day）在 Y Combinator 空间外等待的感觉也是一样的。那是一个反常炎热的日子，气温几乎有 100 华氏度，YC\
  \ 搭建起了一个简易帐篷为我们遮挡阳光。\n\n在彩演中，我们犯了一个暴露牌意图的微小错误，并穿了定制的 ADGROK 衬衫。等真正的演示日到来时，*每一个*初创公司都提交了加急订单并穿着印有\
  \ Logo 的 T 恤。由于每家公司为自己的周边商品选择了一种背景色，那焦虑的人群现在由两个或三个人的小团体组成，他们都穿着颜色编码的 T 恤：一群由看起来不健康的极客组成的微型帮派。人们在到处游荡，等待自己的演示，要么保持警觉并背诵着路演词，要么斜靠着玩着笔记本电脑或手机，或者昏倒在地板上预示着不可避免的结局。\n\
  \n轮到我们后，我站在“下一个”的展位旁，由 Y Combinator 的 CFO——一个名叫 Kirsty、从不慌乱且活泼的英国人将我连接到麦克风上。上一个路演的礼貌掌声平息，我走上台。在操作笔记本电脑的人示意下，我表现得就像刚刚静脉注射了一把柯因一样。截图飞驰而过，所有当前客户的\
  \ Logo、增长率、700 亿美元市场、Google 只是第一步——甚至在我们偷偷溜进去的一张半裸女性照片上引起了恰当的笑声（一家内衣公司正在使用 AdGrok\
  \ 销售豪华文胸）。一切都按照练习进行，甚至更好。如果 VC 们在 AdGrok 之前还在打瞌，那么在之后他们绝对完全清醒了。两半分钟后，结束了。\n\n然后，我们等待。\n\
  \n这些紧密编排的演示穿插着缓解内急的休息时间，期间，初创团队被释放到硅谷资本的顶端，去推销他们的商品。总之，大约有 150 名创始人，每个演示日分组中至少有同样多的投资者，因此在每个休息期间以及随后的几个小时里，空间内绝对是人贴肉肉。\n\
  \n人群是一片身穿 Logo T 恤和牛仔裤的二十多岁极客组成的滚滚海洋，以及穿着衬衫和西裤的富有白人（他们几乎全都是富有白人）。所有人都在向各个方向社交、交谈并倾听，当你走动时，真的得用肘挤开密集的两个人、三个人或更多人的组合。这是一个由贪婪和圆滑说服组成的\
  \ mosh pit，野心在交换金钱，金钱在（希望）为未来交换更多的金钱。男们也加入了战斗，双手都在收集名片和名字。这是我生命中最惊险也最恐怖的几个小时，而接下来的几周和几个月将充斥着那种混乱交通的回。\n\
  \n# 天使的集会\n\n是的，他与天使搏斗，并得胜了；他哭泣，向……哀求——《何西雅书》12:4\n\n### 2010 年 9 月\n\n“就在这儿，哥们儿，我们应该看这里。”\n\
  “我没看到。”\n“我们在标记处，就是这里，”我半带绝望地重复道。\n“给他们打电话，”MRM 提议道。\n“该死，五点五了。我们迟到了。”\n\n不可避免的结论是，我们在去第一次会议的路上迷路了。而且既迷路又迟到。我们约定在洛斯阿尔托斯乡村俱乐部北部的星巴克见面，那里是投资者每天进行午间锻炼的地方，我们充满心地离开了\
  \ AdGrok 总部，毫无疑问相信 Google Maps 会引导我们正确的方向。\n\n当时是 MRM 开着他的那辆本田 Accord 家用车，我坐在副驾驶，通过一个很快就会被证明是背信弃义\
  \ Google Maps 进行导航。\n\n随着恐慌情绪日益加剧，我打电话过去，问星巴克是否就在我们正傻傻盯着的那个有路牌的街道上。\n\n“噢，是的……Google\
  \ 认为我们在那边那儿，但实际上我们不在。我们在二街。抱歉……”\n\n*我们真是完蛋了。*\n\n\n\n他就读于麻省学院，拥有哈佛 MBA 学位，并获得了贝克学者（Baker\
  \ Scholar）的额外荣誉。他在微软拥有一段漫长的职业生涯，在那里监督了 `MSN` 的创立——那是 Facebook 摧毁那个世界之前，一个具有消息和电子邮件功能的、类\
  \ Yahoo 风格的内容门户网站；以及 `salon.com`。随后，他在 Kleiner Perkins Caufield & Byers（`KPCB`，业内知人士简称为“Kleiner”）待了十年，那里是与红杉资本（Sequoia）并列的另一个顶级风险投资公司。在投资公司并担任董事会之后，西格尔曼（Siegelman）转而全职从事私人天使投资——当然，此外他还是一名严肃的自行车运动员；每一位手里只有钱和时间的硅谷超级富豪精英，似乎都会花大量时间来完美完善某种健康但无用的技能，例如公路自行车或风筝浪板。他身材矫健，带着战时军队精英士兵那种精瘦、结实分明感。Argyris\
  \ 和我将他定型为 `IDF`（以色列国防军）的伞兵：强大、可靠，且带有一丝威慑力。“以色列伞兵”成了他的办公室绰号。\n\nRuss 投资自己的钱，除了自己的净值外，他不不对任何事或任何人负责。如果你能让他的钱翻倍，他会很开心。如果能翻四倍，他会欣喜若狂，尽管越多越好。如果看起来公司即将倒闭，他希望拿回钱，而不是简单地将其注销。Russ\
  \ 是那种在最初的狂热中，为 `Oracle`、`Sun` 和 `eBay` 等公司写下第一张支票的人：那时的“天使”确实像某种从天而降、长着翅膀的超自然生物，奇迹般地启动了你的创业实验。正因如此，他们是理性的，因为他们只是想要让资金获得良好的回报，而不是为了他们的基金获得百倍的回报。他们还非常投入；这不仅仅是利用他人的钱在风险投资组合中五十次赌注之一，而是他们真正的真金白（skin\
  \ in the game），而这些本金是他们玩那场游戏赢来的。\n\n考虑到他老派的性格，我们经历了了这类天使人所进行的漫长且有些随意的审查流程。他找了那些参与搜索营销的朋友来帮忙，帮我们打听虚实，看看我们是否清楚自己在做什么。他把我们拟议的路线图给其他朋友看，以判断是否与该领域既有者（例如\
  \ `Facebook`）的做法相符。我和他在电话中进行了长时间的长谈，互相试探，看是否具备了进行无摩擦合作工作所需的个人化学反应。\n\n幸运的是，我们在 `Demo\
  \ Day` 之前就联系了 Russ（我们最初的会议因为 `Google Maps` 找不着星巴克而作废），后来这变成了与他及其个人智囊团的一系列会议。因此，所有这些跌跌撞撞的尽职调查在我们其他投资者加入之前就完成了。正如我们很快发现的，时机就是一切，如果我们没有在之前的几周里一直在培养\
  \ Russ（他也在培养我们），我们就会失去这个后来成为我们领投投资人和公司救星的小天使了。\n\n在我们成功通过他仓忙安排的障碍赛场后，他终于邀请我去他位于老帕罗阿尔托（Old\
  \ Palo Alto）的家中。即使在 `PA` 这个特权范围内，地位也存在高低之分。老帕罗阿尔托是硅谷精英居住的地方。史蒂夫·乔布斯（Steve Jobs）和\
  \ Google 联合创始人 `Larry Page` 都曾住在老 `PA`。宽阔的林荫大道隐藏着味味佳的都铎式、工艺美术风格或仿西班牙式的豪宅，这些房子通常位于微型院落内（YC\
  \ 导师 `Paul Graham` 就住在这样的房子里）。地块出奇地小——帕罗阿尔托并不一直是超级富豪的聚居地，远非如此——但如果你想要宽敞的庄园，无论如何你会住在更像乡村的阿瑟顿（Atherton）或伍德赛德（Woodside），许多精英在开始生更多孩子时也是去那里。\n\
  \n位于 `Santa Rita Avenue` 的房子没有让人失望。这是一栋翻新过的 `Craftsman` 建筑，布满了山墙和拱窗，并用昂贵的石材和木材装饰点缀。Russ\
  \ 穿着他常穿的旧 T 恤和短裤在门口接我，看起来像刚完成了一次长骑行（他很可能是这样）。室内像男爵一样华华，包含一个高耸开阔的空间，而由于被茂密的植被部分遮挡，外部并没有因此这种感觉。\n\
  \n我们路过 Russ 的办公室，那里铺满了像亚马逊森林般的硬木护墙板，绕过一个由优美曲线扶手构架的宏伟楼梯，进入了开放式的客厅。Russ 的儿子在邻壁的休息室里玩视频游戏，当\
  \ Russ 领我坐在餐桌旁时，我假装性微笑打了个招呼。我们坐在角桌的两边，Russ 坐在主位，开始处理我们达成交易的微妙事务。我们正处于（尽管你无疑已经厌了“融资即约会”的类比）风投资人与创业者追求关系的第三次约会：是时候要么采取行动，要么就放弃了。\n\
  \n“所以，你想以什么样的估值上限（cap）融资？打算筹多少？”\n\n啊——估值上限！Russ 我终于在谈正事了。\n\n这个数字——对于第一次筹资的早期公司来说，这是唯一最重要的数字。值得花时间提一下。\n\
  \n创业公司是用他人的钱进行的业务实验。\n\n以下是资助这项实验的方法：\n\n第一笔资金被称为 `seed round`（种子轮），就像发芽一棵巨大的红杉树。从历史上看，这笔钱来自所谓的亲人和家人，或者来自像\
  \ Russ 这样的天使，或者来自像 `Chris Sacca` 这样（我们很快就会看到）的“伪天使”。从微不足道的 `Adrok` 到强大的 `General\
  \ Motors`（通用汽车），都是通过债务和股权的混合获得资金的。在创业世界，第一笔资金通常是债务形式，这非常背直觉。\n\n所有早期公司，除了那些从一开始就募集大量资金的公司外，都通过所谓的\
  \ `convertible note`（可转换票据）融资。尽管名字很高级，但它本质上是带利率的债务。如果公司被收购或融资更多资金，该票据将转换为股权，使你成为真正的者而非债权人。听起来比实际要复杂。归结底就是：我“借”了你\
  \ `$100,000` 来办公司。\n\n这是一个简单的例子，数字是为了方便解释，而非商业现实。\n\n投资者给你写了一张 `$100,000` 的支票。一年，在达到了一些产品或使用里程碑后，你们以\
  \ `$10 million` 的估值融资了 `$1 million`（典型的种子轮后融资，被称为 `series A`）。那笔债务——最初的 `$100,000`——转换为公司的股权。鉴于估值为\
  \ `$10 million`，而投资者投入了 `$100,000`，他现在拥有公司 `1%` 的股份。\n\n从投资者的角度来看，这实际上是有问题的。假设你是泡沫时期最热门的创业公司，以某个疯狂的估值\
  \ `$100 million` 融资。那么，可怜我们可的天使投资者吧；他只得到了公司 `0.1%` 的股份。从本质上说，公司做得越好，他得到的越少。\n\n\n\
  \n\n\n# 进入投资者的伟大朋友：估值上限（Cap）\n\n`cap` 规定了公司估值的最高上限，用于在公司获得更多投资资金时计算投资者的股份。在我们之前的例子中，假设最初的\
  \ 100,000 美元投资是在 300 万美元的上限下进行的。那么，尽管公司后来以 1000 万美元的估值进行融资，天使投资者的股份仍为 `$100,000\
  \ ÷ $3 million = 3.3%`，这要大得多。天使投资者的每股有效价格是上限价格（而非估值价格），与那些直接出资的投资者相比，他获得了股权上的巨大折扣。因此，从本质上（即使在合同现实中并非如此），上限被视为天使投资时公司估值的代名词。早期创业者会谈论他们的上限数字，就像那是真实的公司估值一样，但实际上，它只是一个假设计算的输入值，未来可能发生也可能发生。\n\
  \n# 股权融资 vs 债务融资\n\n通过股权而非债务为公司融资是另一回事。在带有上限的票（capped note）中，没有通用的约定价值。你可以像蜜蜂在花丛间采集花粉一样在不同的投资者之间游，在不同的上限上签署票据，且无人知。但在定价股权轮（priced-equity\
  \ rounds）中，所有人必须就股份价格和总出售金额达成一致，并且所有人必须同时签字。通常有一个轮领者（通常是该轮中最大的投资者），他将帮助你把其他投资者这些“猫咪”赶进交易中。此外，合同法律工作更复杂，因此也更昂贵。然后银行汇款完成，你的钱就到账了。打个比方，带上限的票就像必须连续诱惑五个女性，而股权轮则是要说服五个女性和你一起五人行。后者的难度比前者呈指数级增长。\n\
  \n# 对估值的痴迷\n\n为什么对上限或实际估值如此痴迷？这比仅仅为了一个大数字而进行的权力斗争更重要吗？\n\n是的，因为每个创业者的大敌人、隐藏在每份股权表中的反派，是那个逐渐萎缩的的怪物：稀释！这指的是一个显而易见的数字事实：公司在某些方面就像一块大大的、奶油十足的芝士蛋糕。你和你的联合合者最初可能拥有它的\
  \ 90%（留 10% 给最终的员工期权池），但你获得的资金越多，创始人的份额就越小。估值越高（或上限越高），即使给你的资金金额相同，投资者所拿到的也就越少。因此，随着每一轮融资的进行，你的那块芝士蛋糕会变得越来越小，无论投资者通过债务还是股权获取他们的份额——这就是为什么创业者苦苦努力将上限（或估值）保持得尽可能高。这实际上是在设定他们所出售的那几块芝士蛋糕的价格，以及它的尺寸。价格越高，为了获得同样的资金现金，他们需要卖出的芝士蛋糕就越少。\n\
  \n# 谈判中的谈判\n\nRuss 和 我在他那餐桌上正要谈判的——坐落在帕罗奥托富裕阶层宠爱的温暖怀抱中——正是 AdGrok 芝士蛋糕的价格，或者说是这个决定一切的伪估值。2010\
  \ 年夏天，对于入选的 YC 精英们来说，一个良好的上限在 600 万美元左右。一个出色的上限在 800 万美元左右，只有像 Hipmunk 这样（一家 Reddit\
  \ 创始人二次创业的旅游初创公司）真正火热的公司才能接近那个数字。YC 的中等水平（我们所在的地方）在 300 万到 400 万美元之间。当这场餐桌对话发生时，Demo\
  \ Day 已经结束，我们正在和几位投资者交谈。我探过他们，意识到我们安全地处于 300 万美元上限的范围内，也许更高。所以对于他对融资的回答：\n\n“Russ，我们正在募集\
  \ 50 万到 75 万美元，上限为 400 万美元。我知道我们谈过 300 万，但我认为现在其他投资者不是那个价。”\n\nRuss 赌上了自己的钱，对这个消息感到有些沮丧。\n\
  \n“这听起来很贵。”\n\n停顿。\n\n“等你和其他投资者达成结果告诉我……” 随后横向摇了摇头。\n\n我能为创业游戏带来的少数技能之一，就是我察觉人性弱点的能力。就像男人鞋上的新鲜狗屎，隔着房间都能闻到，而我能闻到。Russ\
  \ 的犹豫和摇头的头部是一个明显的信号：如果推得当，他会接受 400 万；我们只需要提供一种紧迫感。\n\n我们很快就会产生灼切的紧迫感——尽管这不会按我们预期的方式推动上限。\n\
  \n# Sacca 的对比\n\nAdGrok 的另一位大投资者与我们那位以色列伞兵形成了案例式的对比。Chris Sacca 过去和现在都是硅谷最著名的天使投资人之一。他是一个活跃且有主见的社交媒体红人、早期\
  \ Google 员工，也是 Twitter 和 Uber 的早期投资者，他是早期投资领域少数几颗恒星之一。他在你股权表中 24K 纯金的名字创造了那种至关但又难以捉摸的奇迹。\n\
  \n\n\n\n\n隔间的双方都站起身离开，Sacca 向门口冲去，然后迅速左转，沿楼梯走向二层楼。我们悠闲地走出餐厅，两人对事情进展得如此顺利仍感到很震惊。在门槛处，我们碰上了\
  \ `Solomon Hykes`，他是我们 `YC` 班的一位创始人。我们匆忙地打了招呼，然后有些愚蠢地宣布我们是来见 Sacca 的。“我也是，”他说，并跃上楼梯往二层楼去。\n\
  \n这以后成了这些会议的常态：在去往见知名投资人的途中，遇到 `YC` 的同学。感觉就像每个人都在参加一场遍布整个湾区的某种“速配”活动，在从旧金山到门洛帕克的各种咖啡馆和会议室，试图寻找那种紧迫的相互契合，以促成下一次会议（如果有必要）或一张支票（如果可能）。\n\
  \n对我们来说，此时就是一个胜利，由于是融资赛中的第一个，这种胜利意义更加重大。Sacca 已经在囊中了，我们现在在 `cap table` 上拥有了一个金牌名字。但如果我们想把这件事做对，就需要去追逐更多的钱。\n\
  \n## 沙丘之丘\n\n| 夏洛克: | 从人身上取的一磅肉 |\n| :--- | :--- |\n| | 并不那么值钱，也不那么有利， |\n| | 不如羊肉、牛肉或山肉。我说，\
  \ |\n| | 为了赢得他的青睐，我提出这份友谊： |\n| | 如果他接受，那很好；如果不接受，再见； |\n| | 出于我的爱，求你不要错怪我。 |\n\
  | 安东尼: | 是，夏洛克，我将在这份契约上封印。 |\n| | 威廉·莎士，《威尼斯商人》 |\n\n### 2010 年 9 月\n\n提到威尼斯人：我们今天所知的现代银行业的一切，都起源于文艺复兴早期和中期的意大利北部城国家。当时的银行家是犹太人；其中许多是由于\
  \ 1492 年西班牙“天主教王室”发布驱逐令而逃离的塞法法迪犹太人。教会禁止基督徒从事高利放贷，这为犹太人带来了意想不到的意外之财，形式是宗教上被许可的放贷垄断。在其他方面，他们受到迫害和压迫，被迫佩戴区分性的身份标识，被禁止拥有土地和大多数行业，并被禁止居住在城墙内。到\
  \ 1516 年，犹太人证明了自己太好用了，威尼斯执政官考虑让他们居住在城内的问题。他们被允许在名为 `Ghetto Nuovo` 的一个肮脏、混乱的城市区域居住（`Ghetto`\
  \ 的意思是“铸造厂”，指的是该地区前任住户留下的渣堆）。晚上被锁在犹太区的围墙后，犹太人在白天从事放贷业务，而基督徒则前往这个本该恶臭的区域借取现金。\n\n\
  现代硅谷的“犹太区”，虽然遗憾地没有像以前威尼斯那样有住在紧锁大门后的金钱人物，但那里是 `Sand Hill Road`。这是一条蜿蜒的双车道沥油马路，从帕洛尔托延伸到门洛帕克，这片乏味的郊区景观挤满了手持电脑、脑海中计划着精妙推销方案的创业创业者。\n\
  \n在纽约，有一个老笑话说 `Wall Street` 始于墓地，止于河流。在硅谷，具有同样的象征意义，`Sand Hill Road` 始于一个购物中心，止于一个粒子加速器。购物中心是\
  \ `Stanford Shopping Center`，这是一座为了高端消费而建郊区纪念碑，建立在曾属于参议员莱兰德·斯坦福葡萄园的土地上。在二战之后，在它从中获得丰厚利润的科技热潮之前，`Stanford\
  \ University` 曾是一所平庸且财务拮据的机构，它试图通过将土地租给开发商来复兴。由此产生的购物中心自豪地立在这一山谷顶尖学术机构旁，有力地提醒着人们硅谷底层的价值观（更不用说斯坦福的学生和员工了）。\n\
  \n粒子加速器是 `Stanford Linear Accelerator Center`，简称 `SLAC`。由于风险投资人和富裕校友倾向于资助 `Googles`\
  \ 而不是获得诺贝尔奖（`SLAC` 有几项），该设施由`美国能源部`资助。其加速粒子的运行轨道沿着 `Sand Hill Road`，穿过 `Interstate\
  \ 280`，进入定义硅谷西部边界的 `Santa Cruz Mountains` 丘陵。\n\n最后，那里有一家高级妓院：`Rosewood Sand Hill`，这是一个坐落在\
  \ `SLAC` 和 `Sand Hill–Interstate 280` 交汇处之间的豪华餐厅和酒店综合体。`Sand Hill` 的周四晚上作为“猎母之夜”闻名，年长而孤独的女性（以及明确上班的年轻女性）聚集在一起，诱捕\
  \ `Sand Hill` 的富裕阶层。\n\n所以你看到，`Sand Hill` 上有各种进取者和交际花，试图从开着 `Audi R8` 的男人那里捞到下一笔横财。我仅仅是众多投机者中的又一个。\n\
  \n我们第一次大额机构风投会议是与 `Sequoia` 进行。`Sequoia` 由 `Don Valentine` 于 1972 年创立，他本身是 `Fairchild\
  \ Semiconductor` 等第一代硅谷公司的一部分，`Sequoia` 是绝对的精尖，是风险投资界的“教中之首”。\n\n\n\n\n接待台的女员美得令人目目口呆。我指的是那种“在前往纽约时装周的路上迷了路”的美。她们记录了我们的名字，并带我们进入一间会议室。接着我看到了墙上的东西。\n\
  \n真正的展品，绝对的压轴之宝，让这一切看起来仅仅像是一座博物馆的艺术品，是挂在每一面墙上的装框公司 Logo 打印画和融资轮纪念碑。\n\n“纪念碑”是指那些廉价的刻字亚丙烯砖块，用于纪念美国企业阶层中高风险生活里的某笔交易。在华尔街，它们标志着某些股票或债券交易的银团化（例如一次\
  \ `IPO` 或债券发行），并以不同程度的嘲讽或严肃，点缀着许多投资银行家的办公桌。在硅谷，这片没有讽刺的土地，它们被严肃对待，并满了任何极其成功的风投公司的墙壁。因此，那块纪念\
  \ `Google` 首轮 2500 万美元融资的纪念碑，正散发着它神圣的祝福光芒，仿佛墨西哥城大教堂的瓜达卢佩圣母像。每个宗教都需要其奇迹和崇高圣人的故事供大众崇拜；而资本主义的奇迹仅仅汇聚成纳斯达克的股票代码，而不是圣物。\n\
  \n`Apple`、`Atari`、`Google`、`Oracle`、`Yahoo`、`YouTube`、`Zappos`、`PayPal`、`Kayak`、`Instagram`、`Airbnb`、`Dropbox`、`LinkedIn`——这些公司\
  \ Logo 挂在大尺寸的框中，是成功的美国资本主义和企业胜利的微卢浮宫。这种震撼人心的仪式，大概是为了看看我们是否配得上他们的传奇。\n\n火辣接待员把我们安置在一个会议室里，我和那男孩们紧张地沉默着，不知道会发生什么。Bryan\
  \ 很快就出现了；他神采奕奕、长相帅气且形象整洁，拥有风投的所有配置。就读于 Bellarmine Prep（圣何塞的一所耶稣会男校，和我一样）、`Princeton`、摩根斯坦（Morgan\
  \ Stanley）、`Google`，然后是 `Sequoia`。他散发着一种贵族的从容，夹杂着一丝狼性的创业敏锐（也许是伪装的，也许不是），这似乎是大多数高端风投的标配气场。我们向他介绍了\
  \ `AdGrok` 产品的现状（这次是一个可运行的演示）、愿景和机会。他礼貌地听着，时而安静地点头，并提出相关的问题。作为一个曾经在 `Google` 从职过所谓“在线销售与运营”部门的人，他立刻掌握了市场问题。\n\
  \n最终，`Sequoia` 选择了不投资，据说是因为对 `Kenshoo` 进行了竞争性投资，那是一家开发某种类似搜索营销工具的以色列公司。根据 `Sequoia`\
  \ 的邮件，他们喜欢在自己的公司之间留出“空白”。那是那种既是事实又是礼貌谎言的话之一。无论如何，`Sequoia` 在沟通中表现得极其准时且礼貌，甚至在随后还提供了几次非常有帮助的介绍。在风投领域，正如在生活中，通常是无能且缺乏安全感的人才是混蛋；而大师级且成功的人——更不用说那些被公认为该领域最优秀的人——都是在玩长局。你永远不知道下一个\
  \ `Airbnb` 会从哪里出现。\n\n投资银行家有他们的高尔夫，华尔街交易员有壁球，而新的风投/创业科技精英则有风板运动。风板是放风筝和冲浪的结合，涉及到站在连接与小飞机翼一样长的\
  \ U 型风筝的浮动雪板上，它威胁着要把你带往永无之地。像大多数贵族运动一样，它需要大量昂贵的设备和进入特定房地产的权限。在这种情况下，这些房地产通常是 `Crissy\
  \ Field`，旧金山最傲慢社区马里纳区的水滨公园。\n\n当我开着那艘 40 英尺的帆船驶过该区域时，那种闯入风板运动员占领的水域并解决几个风投的诱惑几乎是不可抵抗的。他们就在北美最大的自然风洞前，在游艇和集装箱船之间之字形穿梭。偶尔有人会累了，或者被风筝绳缠住，在浮标上避难。这时，路过的船就会救起那个湿透的科技精英免于溺水或死于大白鲨（大白鲨偶尔会出现在金门大桥的海口）。\n\
  \n自然地，硅谷精英聚会之一完全围绕着风板运动展开。`Charles River Ventures` 的高级风投家里 `Bill Tai`（连同职业风板运动员\
  \ `Susi Mai`）在夏威夷举办了名字双关的 `MaiTai` 风板训练营。就像硅谷的一切事物一样，它融合了某种嬉皮士式的回归自然的超验主义（该组织支持多个海洋慈善）、美国对运动的痴迷，以及创业者的强硬拼搏。\n\
  \n与东方的游艇俱乐部不同，那里进入保守派阶层的门槛是由出生或资产负债表决定的，而进入 `MaiTai` 是通过社交资本、个人品牌和/或某种无法言喻的酷来购买的，这种酷感通常表现为行业内认知的“思想领导力”。正如那里的许多其他事情一样，只要你能让别人接受你提供的任何替代货币，硅谷就永远会为你再来一轮。我认识几个与会者，他们正是那些无处不在的硅谷玩家——在提供和接受风险投资之间跳跃；总是在创立一家初创公司，顾问另一家，或者在它们之间进行交易——他们是紧密世界的典范。\n\
  \n因 `MaiTai` 闻名的 `Bill Tai` 是我们融资目标之一。在 Demo Day 漫长的演说中段，我注意到第一排最右侧有一个黑发身影。就像政客会发现人群中那个入迷的家伙并专门针对他说话一样（既为了精炼信息，也为了集中表达），我也锁定了他和他疯狂记录的样子作为一种修辞支柱。结果证明他是\
  \ `George Zachary`，`Charles River Ventures` 的合伙人。\n\n\n\n当我从 Y Combinator 的 Demo\
  \ Day 走下舞台时，立刻有两个投资者跟了上来。其中一个是前面提到的 Chris Sacca；另一个是 Ben Narasin。他从密集的投资者人群中冲了出来，当我悠闲地走下舞台时，他跟在我身后。我有些局促地站在\
  \ YC 门外，向他介绍了我们详尽的路演版本，他全神贯注地听着，并伴随着断续式的问题，这是投资者表现出诚意兴趣的明显信号。\n\nNarasin 体型瘦削，骨架很小，圆丝框眼镜后是一双明亮的蓝眼睛，留着剪短的卷发。他穿着一套工作服：纽扣衫、白色或卡其色的棉质长裤、一种系有小锚图案（类似童子军穿的那种）的扣带，以及——至关重要的——`Sperry\
  \ Top-Siders` 蓝色皮鞋，没穿袜子。在随后的几个月相处期间，我从未见过他穿过别的衣服。\n\n他的那种紧迫感和语速让你以为他有纽约背景，但他实际上是一个来自亚特兰大的南方人，为了上大学去了波士顿，后来因为对时尚感兴趣才来到纽约。在世纪\
  \ 90 年代后期，在第一波互联网热潮初期，他是 `fashionmall.com` 的创始人兼主要股东。这家公司为高端服装零售商制作 `Web` 商店，在当时，在线销售东西的概念还是一项堪比广义相对性的创新突破。他在崩盘前恰恰合适的时机让公司上市并赚到了一笔巨款，这意味着此后他开启了那种有钱且有品位的享乐主义者的半退休生活：成为美食和葡萄酒作家。\n\
  \n在其中的某个时刻，他来到西部开始投资公司。他目前就职于名为 `TriplePoint Capital` 的风险投资公司，在那里负责他们新但不断增长的种子轮“业务”。`TriplePoint`\
  \ 在风投领域是一个小小的异类，因为它向那些有真实资本支出需求（如车队）的科技公司提供债务融资（你必须偿还的钱！））。它刚刚进入股权投资领域，但嘿，所有酷的孩子都在做，而且我们有资产负债表来支持，所以为什么不呢？它聘佣了\
  \ Narasin 来领导种子轮业务并寻找交易，因此在 Demo Day 之后我们经历了创业者与 VC 的临时约会后，他请我来向他的投资经理进行演示。\n\n\
  ### 关于 VC 头衔和等级的说明\n\nVC 行业用各种花哨的头衔来装点自己：“经理（associate）”、“董事（principal）”、“分析师（analyst）、合伙人（partner）、运营合伙人（operating\
  \ partner）、管理合伙人（managing partner）、普通合伙人（general partner）等。主要的区别在于一个人是否获得所谓的“分成（carry）”。简单来说，分成是公司所投资基金的财务收益的一部分。\n\
  \n从创业者的角度来看，这些都是噪音。对你来说，重要的是面前那个穿着羊毛半拉链衫、内穿整洁白衬衫的微笑脸，是否有能力在`周一合伙人会议`上展示并捍一项交易，并引导其他决策合伙人达成一致。VC\
  \ 机构的其他人就和热情的接待员没多大。\n\n一个看穿假象的快速方法：问你那个伪装成有影响力的人：“你有决策权吗？”如果他或她稍有一丝犹豫或闪烁，你就是在和一个跟班说话（无论他或她表现得如何）。他或她唯一的用途就是带你找到真正拥有权力的人；其他一切都是狗屁。所以，如果你的目标是获得一张真正的投资支票，请绕开这类人。可以争论的是（这也是\
  \ YC 的经典建议），甚至不要接受无法对上述问题诚实回答“是”的人的面谈。你是在浪费时间。\n\n### 回到剧情\n\n当我开着我那辆饱受虐的`BMW 敞篷车`驶向另一群普通的双层办公楼，并停在那些普锐斯、波时捷和特斯拉之间时，我感觉自己像在重演《Sand\
  \ Hill VC 秀》的戏码。\n\n进入室内后，我的眼睛必须适应阴凉的黑暗。接待员完全不是模特级别的`Sequoia` 水准，更像你在牙科诊所看到的人。我对\
  \ VC 世界并不太了解，不足以将其解读为好信号还是坏信号。装修按`Sand Hill`的标准来说是很暗的：有很多黑色大理石瓷砖、一张灰色地毯和结构不明的黑色办公桌。我被独自留在一间大会议室里，可能就是`周一上午合伙人会议`发生的地点，等待\
  \ Narasin 的助理。整个地方的氛围非常安静，几乎绝对寂静。没有电脑风扇或通风系统的嗡嗡声。这是 VC 办公室最引人注目的特征之一：即使在正午，它们也是完全静止的，像一个空空的博物馆或图书馆。\n\
  \nNarasin 的助理出现了：印度裔，毕业于某所美国学校的 MBA，标准的入职 VC。显然，我们有几个共同的专业人脉，他们为我说了几句好话。这强调了在硅谷培养人脉的重要性。与华尔街不同——华尔街的职业人脉基本上是在你出生于纽约里（Rye）的富裕子宫里时就已经形成了，并把你推向了安德弗弗、耶鲁、高盛一辈子的既定轨道（或者不是），在硅谷，事情更具流动性和随性。任何能够结交加州风格式的浅层朋友并发表几篇博客文章，同时收集社交媒体认可的回声的投机者，都和任何`哈佛精英俱乐部`的成员一样属于精英。当然，你也可以同样容易地失去地位，这是东岸精英需要担心的。\n\
  \n（引文如下……）\n\n2010 年 9 月 10 日\n\n我们正带着庆祝 Demo Day 之后的心情坐在 Argyris 位于 Mission 区的客厅里，那里是我们编写出第一个一次性原型的地方，那个原型启动了我们整个\
  \ YC 冒险。啤酒已经开了，我们仍然沉浸在那种在兴奋和恐惧之间跳动的、令人陶醉的创业高潮中。\n\n我的电话响了。\n\n“我是 Rodger Cole。”\n\
  \n\n\n\nRodger 是 `Fenwick & West` 的合伙人，这是硅谷三大律所之一。正如我们很快将探讨的那样，我们以一种近乎不可议的方式请到了他为我们辩护，随后甚至有效地让我们为这项特权支付了费用。\n\
  \n律师打来的不速电话从不是好事。我在 `Argyris’s` 的宜家椅上坐直了，在心理上做好了准备。\n\n“我很抱歉通知你，今天 `Adchemy` 在`圣塔克拉拉县法院`对你提诉了。”\n\
  \n作为我们的记录案律师，`Rodger` 已经收到了法院文件。“我现在把它们发给你。”\n\n我检查了电子邮件，邮件就在那里：\n\n```\nSUPERIOR\
  \ COURT OF CALIFORNIA\nCOUNTY OF SANTA CLARA\n\nADCHEMY, INC.\nPlaintiff\n\nv.\n\
  \nANDREW F. GARCIA-MARTINEZ\nMATTHEW R. McEACHEN\nARGYRIOS ZYMNIS\nELECTRON MINE\
  \ d/b/a ADGROK\n\nFOR MISAPPROPRIATION OF TRADE SECRETS; BREACH OF CONTRACT; INTENTIONAL\
  \ INTERFERENCE WITH CONTRACTUAL RELATIONS; BREACH OF THE DUTY OF LOYALTY; & INJUNCTIVE\
  \ RELIEF\n```\n\n那一串加粗的罪名就是我们的犯罪记录。它几乎涵盖了硅谷员工可能犯的所有可起诉行为，而这些行为主要归结为盗取知识产权。由于 `AdGrok`\
  \ 在付费搜索营销领域与 `Adchemy` 存在竞争，我们的前公司正以此作为起诉的借口。不过，这很大程度上出于 Murthy 的自大自为。\n\n我们曾收到过预警，`Adchemy`\
  \ 在几周前就发过法律仇恨邮件，那种对雇佣协议限制的威胁性列举，就像是企业诉讼中越过船头的警告射。这促使我们与 `Fenwick` 建立了先发制的关系，这也是为什么\
  \ `Rodger` 会出现在那里接收诉讼文件的原因。我曾希望 `Adchemy` 行动会缓慢，慢到足以让我们完成 `Demo Day` 的融资。我内心那个终身的马基雅维利迷粉丝想起了*主君论*中那句令人难忘的话：战争是无法避免的；它只是推迟到为了某人的利益。我原以为这会被推迟到对我们有利，但我们显然低估了\
  \ `Murthy` 的报复心。\n\n### 个人责任与风险\n\n最令人震惊的是，我们被单独列为个人被告。这并不是公司层面的事情，我们无法躲在公司面纱后面。这些指控是个人的，我们将在财务上失去一切。\n\
  \n`Wilson Sonsini Goodrich & Rosati`，这所硅谷最昂贵且最强大的律所，已被聘请通过诉讼来“杀死”我们。在那时，我们银行里可能只有\
  \ `$2,000`。与顶尖硅谷律师交道一小时的费用大约是 `$800`。走出这个困境的唯一办法是融资并用那笔钱来保护自己。但 `Murthy` 以其精湛的施虐心理，将诉讼时间精准地定在了糟糕的时刻：在我们融资能力的巅峰，恰在\
  \ `YC Demo Day` 之后。现在，那种好不容易得来的势头全部消失了。\n\n我们彻底完蛋了。\n\n### 世界末日场景\n\n我是一个灾难性思考者。我喜欢末日电影和僵尸入侵电影。《狂狂战士》（又名《疯狂野麦克斯\
  \ 2》）可能是我最喜欢的动作电影。《28 日后》紧随其后。不知道这反映了对全人类的杀之恨，还是仅仅对无政府和社会崩溃的偏好。无论如何，我总是预想最坏的情况。\n\
  \n以下是我认为在即将到来的法律崩塌中，`AdGrok` 会发生的情况：\n\n`MRM` 有家庭要养，而且没有胃气进行持久斗争，他会辞职并找一份普通工作。\n\
  \n想想看：他银行里有一点现金，但在建立 `AdGrok` 期间，他一直在花那笔钱维持生活。除了某间简易住房的股权，他现在一无所有。如果我们输了官司并送进监狱，他的整个家庭将付出代价。空手道消失了，学校旅行消失了，也许连房子本身也会消失。整个家庭都会被毁掉。\n\
  \n那么，如果他真的离开了呢？\n\n`Argyris` 和我会苦苦支撑，他负责技术方面，我负责其他所有事情。如果我们没运气拿到资金，我们就把我的博客和营销专长尽可能地让\
  \ `Adchemy` 难堪。凭借我对纽约科技、`Goldman Sachs` 之类的见解，我们已经吸引了数千名读者的庞大粉丝群，其中许多是爱八卦的硅谷内部人士。这种肮脏的法律纠纷一定会吸引那群喋喋且爱评判的人。我们会公布每一份带有荒谬指控的法律文件。\n\
  \n如果那仍然无济于事，情况看起来非常糟糕，会发生什么？\n\n记住：我们在诉讼中被列为个人被告，并对任何判决的赔偿金承担全部个人责任。涉案的被盗取的 `Adchemy`\
  \ 知识产权尽管实际上一文不值，但在获得数千万美元资金后才开发，法院会认为其价值同等金额。由于要支付民事赔偿，我们将彻底破产。不仅是破产，我们更会债台高筑。我们在硅谷的名声将无法挽救地败坏，因为我们会被视为商业秘密窃取者，简直是科技世界的性捕食者。在没有职业前景的情况下，没有办法支付任何判决的赔偿。\n\
  \n在最终的末日来临时，`Argyris` 会飞往希腊，一路上诅咒美国，并且永不再回来。诉讼不会随他去那里。\n\n而我呢？\n\n我已经通过 `Goldman`\
  \ 的职位切断了在华尔街的路，所以无法回到那里了。英国可以照顾我，但在可预见的未来我将穷困潦倒。我真正的恐惧，也是我从未与兄弟们分享过的，是 `Murthy`\
  \ 会在他那操纵性的愤怒中，以极其优厚的条件为他们提供回工作。他们会抛弃我。\n\n\n\n\n此外，大公司拥有必须小心维护的价值公共品牌，而这些品牌可能会受到像你们这样规模的小公司的攻击，特别是在像硅谷这样关系紧密、看重外表的生态系统中。\n\
  \n美国人依然热衷“弱者逆袭”，当一个傲慢的既得者被一个拥有说服力故事的拼搏初创公司挑战时，会有多少盟友涌现出来，这会让你感到惊讶。\n\n只要你保持团队的凝聚力和共同的目标感，并具备基本的生存本领，你就能比过、战胜并气败任何企图摧毁你的公司。那些无无一所有的人为了获胜将不择手段。\n\
  \n在我们宣布离职前不久，Adchemy 的一位早期投资者兼导师以一种近乎不可思议的方式去世了^(*)拉吉夫·莫特万（Rajeev Motwani）是一位传奇的斯坦福计算机科学教授，曾指导过无数学生和企业家，包括\
  \ Google 的创始人。他是公司的形象顾问，穆蒂（Murthy）对他意外离世表现了极大的哀悼。\n\n在经历了所有阻止我们离开的威胁和强迫后，穆蒂就像一个家暴的丈夫带花回家试图掩盖一切一样，主动向我们介绍了一位硅谷顶尖的法务律师——来自\
  \ Fenwick & West 律师事务所的泰德·王（Ted Wang）。穆蒂手忙脚乱地宣称，这份送别礼物是对拉吉夫的死后致敬。说这些话时，他的眼睛甚至可能泛了泪光。\n\
  \n我立刻约了泰德电话，告知我们对那个把我们聚在一起的男人的恐惧。我不相信穆蒂会如此轻易让我们离开。\n\n泰德证明是一个精明且学识渊博的硅谷玩家。从早期开始，在应对穆蒂时，他的声音就是明智的建议。当这种冲突在三个月后升级为全面的诉讼时，他毫不犹豫地让\
  \ Fenwick 律师事务所加入了战斗，这与其说是因为 AdGrok 作为初创公司的价值，不如说是因为对这种违反硅谷非正式规则的行为感到愤怒。一家大公司不会仅仅因为自己有能力就起诉一家小公司。这是初创公司竞技场上的欺凌，而泰德·王绝不姑忍。\n\
  \n一旦法律子弹开始密集发射，泰德向我们介绍了另一位 Fenwick 的合伙人罗杰·科尔（Rodger Cole）。科尔是 Fenwick 的诉讼律师，是执行实际战斗的前线士兵。他并不是你预期的那种意气风扬的法律斗士，他完全冷静且冰冷的态度导致我们称他为“送葬者”。\n\
  \n不过，仍然存在支付的小问题。泰德喜欢我们，但还没到愿意免费帮忙的地步。泰德和“送葬者”每小时收费大约在 600 到 700 美元之间。但我们与泰德建立的关系比银行里的钱更有价值，我们那可怜的弱者角色也是如此。我们必须以某种方式令人信服地利用这一点。\n\
  \n事实证明，如果没有 Fenwick 律师事务所，我们永远无法进行防御。说穆蒂因为那一点点善意而受到惩罚简直是保守说法。此处的教训是：如果你打算做一个自大狂妄、反社会的混蛋，就做得彻底一点，直接杀掉你的敌人，而不是给他们一根骨头，指望以后出事时再来杀死他们。他们很可能会把那根骨头变成武器。\n\
  \n*¡不容失败！\n\n正如世界的运行规律，问题只出现在力量平等的双方之间，而强者随心所欲，弱者受其所苦。\n\n—修昔西德，《伯罗奔奔尼尼战争史》\n\n\
  ## 2010 年 10 月\n\n在头顶着诉讼的情况下筹款，就像穿着一件印着“我是艾滋病毒阳性，你呢？”的 T 恤走进单身酒吧。这对你的前景可不是好兆。\n\n\
  你不能不告诉潜在投资者，尽管你可以推迟告诉他们，直到他们贪婪的小笔正悬停在虚线上方——那时你再投下炸弹，并希望他们不要尖叫着逃跑。我对所有一直在洽谈并即将成交的投资者进行了一次悲伤的点名，并告诉了他们这个消息。他们许多人退出了。\n\
  \n有些人留了下来，尽管关系很微妙，但他们想知道更多关于诉讼及其潜在成本。尽管我们努力淡化它——这只是经营成本！——但他们想要细节。因此，我不得不让他们接通“送葬者”的电话，由他给他们一个经过剪辑的局势说明，然后我希望他们能回我的电话。\n\
  \nRuss 和 Sacca 凭着永恒的信誉，在问题出现的迹象面前并没有退出。他们口头承诺的资金最多；Russ 是这轮融资的预期领头人和支票金额最大的，而 Sacca\
  \ 是我们的大牌。但我这个华尔街量化师的心里清楚，如果我们成功筹到资金，这种风险将以某种方式体现在我们的融资条款中。\n\n为了得到我可以（可能）向投资者展示的损害控制估算，我让“送葬者”准备了一份诉讼过程中每一步的详细清单，以及相应的费用，一直到完整的陪审团审判。数字是惊人的。仅仅进入实际审判就要花费我们\
  \ 50 万美元，之后还需要另外 50 万美元或更多。总来看，整个诉讼（包括判决和最终收尾）大约需要 150 万美元，跨越未来的 18 个月。\n\n正如任何有抱的\
  \ CEO 会做的那样，我做了一个 Excel 表格，因为真理隐藏在表格数据之中。\n\n\n\n\n\nRuss 曾提出主导本轮融资，因此对于我们能否完成此事至关重要，看到预测数据后，他似乎特别宽慰。他可能是刻意无视了这些数据，否则是我一个电话接一个电话地磨平了他。令我哑口惊讶的是，他提议继续主导本轮融资，但估值上限是\
  \ 200 万美元，而不是我们在他早餐角里讨论过的 400 万美元。此外，由于他不想向一具“尸体”注入资金，他为投资设定了条件：我们必须再找到至少 20 万美元的额外投资者资金——这样他和和其他人加起来，至少会有\
  \ 50 万美元的军费。\n\nRuss 的反向报价提供了一丝希望。通过将我们的有效估值减半，我们筹集的资金至少足够支付自己的报酬并维持机器运转。我们在种子轮中卖出的公司股份（约\
  \ 22%）将远高于常水平，这在进行 `series A` 融资时会引起人的注意。投资者不喜欢看到上一轮的投资者购买了公司大部分股份。这意味着他们在自己的轮次中能获得的股份会更少，或者创始人必须放弃大量股份来填补新投资者的份额，从而降低他们成功的动力。此外，投资者喜欢在转给你一大笔钱时感觉你是他们的小跟班或小弟，而另一群有钱人也抓着你的命门，这会削弱那种所有权感。\n\
  \n此时，`series-A` 的戏剧已经安全地处于“我们希望拥有的问题”类别中。如果我们真的能走到那一步，自然会解决它。这就像是在死于癌症时担心自己的胆固醇。因此，现在的问题减少为寻找另外\
  \ 20 万美元，并看看能否通过某种方式减轻法律账单——要么与 `Fenwick` 谈判达成协议，要么击败 `Murthy`。\n\n在金钱方面，如果我们能说服\
  \ `Sacca` 将投资从 10 万美元增加到 20 万美元，我们就达标了。或者再拉拢更多投资者。归结底，在经历了大量的人为紧迫感和投资者的分而治之后，这其实是两者兼之的结果。`Sacca`\
  \ 写了一张比计划更大的支票，我们在本轮融资中还获得了一些追随者。\n\n### 这里简要插叙一段，让你们感受一下科技界的疯狂\n\n还记得 `Ben Narasin`\
  \ 吗？就是不穿袜子穿 `Top-Siders` 鞋的那个？他带我们过了 `TriplePoint` 的合伙人会议，并拿到了肯定的答复。正如这些种子轮情况下经常这样做，提供交易来源的风险投资人会通过自己的现金以及基金自身的投资来亲自参与。因此，虽然\
  \ `TriplePoint` 最终会给我们汇款，但 `Ben` 想现在就给我们一张支票。也许受到 `Ben` 食品和酒类写作副业的启发，我提议在 `Loló`\
  \ 见面，那是这类散发着跨文化婚姻味道的烹饪融合实验餐厅。土耳其墨西哥塔帕斯菜以及被描述为万花筒式俗气的装饰，构成了我们曾收过的唯一一张纸质支票的背景。但对 `Narasin`\
  \ 一如既往，事情从不简单，在经过半小时断促的交谈后，他意识到自己实际上没带支票簿。\n\n“噢，等一下，等等……我想我有一张备用支票。”\n\n他从卡其裤里掏出一个看起来很旧的皮钱包，在里面掏找着。他掏出一张褪色且皱巴巴的单页纸，那是有些人塞在钱包里备用的应急支票，以防发现自己没有现金。\n\
  \n“我把支票抬头写谁的名字？”\n\n支票来自一个 `Schwab` 账户，无疑那是处理他日常银行事务以及可能偶尔买入的股票的小额零用金。\n\n“`Electron\
  \ Mine Inc.`，”我回答道，使用了我们最初的注册名称（我们营销用的名称已经改了六次了）。\n\n沉思一下这一类人，他们会随手写下一张随意的皱巴巴的 5\
  \ 万美元支票。\n\n当我终于把钱拿到我发烫的小手里时，`Narasin` 通过展示他钱包里的孩子照片来分散注意力，他在翻找那张“救我出狱”支票时，已经把这些照片散落在吧台上。\n\
  \n“看……这就是你正在工作的人。”\n\n他继续向我们进行详尽的自豪父亲式的介绍。我看了眼同来的 `MRM`，希望他不要说些失礼的话。\n\n办完后，我们走进了\
  \ Mission 区那充满臭味和阳光的街道。\n\n“那么，我们为我的孩子工作呢，哈？” `MRM` 问。\n\n当然 `MRM` 会这么说。像很多硬核工程师一样，这个人无法撒谎和/或不懂社交场合。我很庆幸他保持了整整三十秒沉默。\n\
  \n### `AdGrok` 火堆上的更多木柴\n\n下一笔钱来自一个更神秘、尽管没前一个那么有趣的来源。\n\n我在 `YC` Demo Day 的某次游荡中发现了他。他瘦削的身材、合身的欧式衬衫和昂贵的发型使他从周围的穿衣灾难中脱颖而出。我的推测是对的：`Chris\
  \ Kile` 是瑞士人，代表 `Ace & Company`，那是一个在《音乐之声》故乡运营的透明家族基金。关于资金的来源，我从他那里得到的最多信息就是据称涉及一笔埃及移动电信的财富。或者至少故事是这样的。我确定的是，当该敲响小钱罐时，我们的小不足道的业务账户收到了一笔来自瑞士私人银行的汇款。\n\
  \n\n\n\n\n这变成了一场充满火药味的、反复无常的电话游戏，一个接一个电话地，交替打给 Russ 或 Ted，电话那头的每个人都比上一个更愤怒，谁也不肯向对方让半步。\n\
  \n“嗨，Ted，我是安东尼奥，”我一边宣布，一边在阿拉勒梅的第九街上走着我那非官方的焦虑*苦路*（*via dolorosa*），这条路紧邻着英国商人的别墅。“听着，投资者已经到位了，我们有钱维持公司运营，但不够付诉讼的费用。”\n\
  \n“我绝对不会为一场诉讼买单，尤其是让某个富翁从中获利。”\n\n情况就是这样。\n\n最后，通过计谋、贪婪和简单的固执，我们说服了 Fenwick 接受 AdGrok\
  \ 的股份来换取他们的辩护。\n\n他们将预付 25 万美元的法律费用（本质上是贷款），换取一定比例的股权和一少数股权期权。对我们来说，这是一次奇妙的交易。如果诉讼失败公司彻底完蛋，我们一分钱都不会还。如果我们赢了诉讼，我们将支付一小部分股权，获得所有的上收益，并活下来继续战斗。操，即使我们必须得交出公司的一半，我们也会接受这笔交易。\n\
  \n对 Fenwick 来说更糟：如果我们以某种方式逃脱了诉讼，并且在使用量、收入或运气上大获全胜，我们可以直接从利润或下一轮融资中用现金支付 Fenwick\
  \ 的账单。这笔交易没有预付罚金（就像某些债券或抵押贷款那样），我们只需通过现金回购股权来消除他们对我们股权的权利。由于 Fenwick 获得的股权是按我们目前的估值计算的，这与以低廉入场价回购早期投资者的没有区别。\n\
  \n换句话说，我们向 Fenwick 卖了一张百万分之一机会赢得 25 万美元的彩票……票价仅为 25 万美元。最好的情况下他们收支平衡，最坏的情况下我们他们什么都不欠，而其之间的任何情况都是\
  \ Fenwick 给 AdGrok 的礼物。我量化的大脑对这种风险的完全定价错误感到眩晕。这就像是物理定律被颠覆了，而我正目睹一头大象在筷子尖上跳芭蕾舞。这些条款对于我们这些理想化的法律救星来说简直糟糕极了，这是一场完全提前润滑好的、彻底的交易。\n\
  \n*好吧，你可以把人从高盛带走，但你无法把高盛从这个人身上带走，对吧？*\n\n“Ted，非常感谢你的慷慨报价。我们乐意接受这些条款。请立即发送聘用函。”\n\
  \n成交。\n\n我们银行里有钱支付工资、租金和服务器费用，我们的法律辩护现在有了补贴。AdGrok 挺过了它的第一个生存威胁，尽管我们还没有彻底退出战斗。\n\
  \n是时候彻底解决 Murthy 了。\n\n变变态人格的方法没有比创业公司更糟糕了。如果你知道更好的方法，我洗耳恭听。\n\n## 微软垄\n\n微软是如何获得\
  \ PC 桌面垄断地位、创造了数十亿美元的财富，并确保了持续数十年的技术霸权的？\n\n简而言之：比尔·盖斯来自西雅图的富裕贵族。在 20 世纪 80 年代初，他的母亲是联合基金（United\
  \ Way）执行委员会成员，当时 IBM 的首席执行官是约翰·奥佩尔。这让威廉·亨利·盖斯三世（她的儿子）获得了一个与 IBM 会面的机会，为 IBM 具有划时代意义的产品——IBM\
  \ PC 提供代码编译器。然而，IBM 真正想要的是操作系统，即管理内存和运行程序的核心代码。盖斯当时的初创公司微软实际上还没有任何完整的操作系统，他诚实地向\
  \ IBM 推荐了加里·基尔达尔（Gary Kildall）经营的公司，在计算机领域真正的钱还在硬件时，基尔达尔是操作系统的先驱。\n\n在一个带有传奇色彩的故事中，基尔达尔正在驾驶他的私人飞机时，IBM\
  \ 的代表亲自敲响了他办公室的门。他的妻子（公司的业务经理）拒绝签署 IBM 那份侵略性的非保密协议并把他们打发走了，于是 IBM 才不情愿地回到盖斯那里询问操作系统。盖斯嗅到了机会，提议提供一个操作系统，雇佣了一名当地西雅图程序员来克隆基尔达尔操作系统，然后将其称为\
  \ `QDOS`（快速粗略操作系统），最终作为 `DOS`（磁盘操作系统）随 IBM PC 出货。盖斯正确地怀疑其他硬件公司会模仿 IBM 将软件与硬件分开捆绑的做法，因此保留了这段被破解和复制的\
  \ `DOS` 的版权。结果，在硬件可以互换但软件不可互换的新计算世界中（而非相反，那是 1980 年的现状），收益归了盖斯和微软所有，而不是 IBM。\n\n\
  这种许可许的安排演变成了我们现在所知的微软，它发展到提供从文字处理（我们还能用这个词吗？）到浏览器、日历以及所有其他打工人软件武器库在内的一切产品。而基尔达尔呢？IBM\
  \ 最终通过将其（原始）操作系统与微软的一起提供来给了一点甜头，但这太少也太晚了，而且失败了。\n\n回到三十年后：盖斯现在作为一个伟大的慈善家访问非洲并独自治愈了疟疾。基尔达尔最终死于酒精，在蒙特雷的一家摩托车酒吧神秘地去世——可能是一场醉斗——年仅五十二岁。引用巴尔扎的话：“无故产生的巨大财富的秘密是一个被遗忘的罪行，因为这个罪行做得非常恰当。”没有比这隐藏得更好的罪行了。\n\
  \n## 史蒂夫·乔布斯\n\n如果我根据那些详尽的传记，尝试简要描述一下乔布斯的罪行，那将填满书的剩余部分。\n\n一个代表性的轶事：1975 年，斯蒂芬·乔布斯（Steven\
  \ Jobs）是一个（字面上的）臭希皮士，刚从印度朝圣回来，在雅达担任低级技员。他是一个傲慢且具有破坏性的存在，除了雅达的首席执行官诺兰·布什贝尔（Nolan\
  \ Bushnell）外，得罪了所有人。布什贝尔想将《Pong》这个引发视频游戏革命的传奇双人游戏变成单机版本，该版本最终被称为 `Breakout`（老读者一定记得）。布什贝尔宣布，谁能设计出运行该游戏的软硬件组合，就能获得\
  \ 700 美元的奖励，每节省一个芯片还能获得 1000 美元的奖金（芯片以前很贵）。\n\n乔布斯说服了他后来的苹果联合创始人史蒂夫“沃兹”沃兹尼克（Steve\
  \ “Woz” Wozniak）承担该项目，规定必须在四天内完成，以配合他的社交日程（他得去乌托邦公社摘苹果）。沃兹拼命工作，而乔布斯负责测试设计好的电路的人力劳动，他们按时完成了任务。然而，乔布斯从未告诉过沃兹关于奖金的事，只提到了基础奖金。他给了沃兹\
  \ 350 美元，克扣了这位让这一切成为可能的合作伙伴，并用这笔偷来的资金资助了他的自己的生活。\n\n史蒂夫·乔布斯充满了勃勃的野心、冷酷的权力意志和自恋的自我感觉；根据所有与他共事过的人描述，他是一个平庸的工程师，拥有良好的眼光，能够识别出他人身上自己不具备的天赋，并让他们为自己拼命工作，同时击败竞争对手。在这个意义上，他是成功创业\
  \ CEO 的绝对典范，尽管不像人们通常认为那样。\n\n噢，扎克伯格呢？\n\n\n\n\n\n正如现在公开记录的那样，Facebook 的想法（并不是说主意本身值多少钱）是从一群自命不凡的常春藤子弟（现在已是知名的天使投资人）那里偷来的，他们曾雇佣他来实现这个想法。他执行了，但随后决定自己更喜欢这个想法，并据为己有。最终，Facebook\
  \ 为上述常春藤成员支付了数千万美元的损害赔偿（尽管在和解中显然仍然克扣了他们的钱）。\n\n我们现在可以从盖茨和乔布斯那种所谓的高端走下来了。\n\n在这件事上，你必须相信我：几乎每一个早期初创公司的故事都充满了像我这样的故事。通过电话谈判、不留任何法律痕迹的幕后交易；对投资者或合伙人的背地背叛；对轻信员工的诱惑和欺骗，让他们本质上处于白干的状态（例如\
  \ `Adchemy` 本身）。我所描绘的 `AdGrok` 画面——而且它的源头还有更肮鄙的事，不用担心——并不是什么奇怪的特例；它是绝对的法则。科技初创领域尽管标榜透明、原则性的创新，以及对压烫衬衫和陈旧社会习俗的反叛，但实际上是一个令人惊讶的反动群体。其成员像维多利亚时代的女士扑粉一样，爱慕荣、自鸣并保护自己的公众形象，并拒绝承认任何与他们良好营销的外表相悖的事物。当然，这并不比传统行业或政治更糟，但也绝不更好。\n\
  \n在 `AdGrok` 的案例中，这意味着任何诡计、任何阴险的手段都是不被禁止的。在初创公司的游戏中，没有真正的规则，只有法律，而且还是执行力很弱的法律。最终，成功会原谅一切罪过，就像它原谅盖茨和乔布斯一样，并且继续对无数初创创业者如此。\n\
  \n毕竟，我们真的会怪大卫使用弹石来对抗高入云的巨人歌利亚吗？\n\n# 狗屎明治\n\n创业公司就像在吃玻璃并凝视死亡的深渊。\n\n—埃隆·马斯克，PayPal、特斯拉和\
  \ SpaceX 创始人\n\n## 2010 年 10 月\n\n`Adchemy` 正拿着法律枪指着我们的头。`Fenwick & West` 为我们提供了另一把枪，但现实情况是我们负担不起长期的对峙，这不仅是因为钱，更是因为时间。赢的唯一方法是微妙地找到\
  \ `Murthy` 的致命命门，并将一把冰冷、锋利的刀抵在上面，直到他看到理性的光芒。鉴于公司灭绝和个人财务破产是其他选择，任何手段都是可以接受的。\n\n\
  科技公司无论规模多大都有两个弱点：他们的投资者和潜在的业务伙伴。前者通过个人影响以及他们经常占据董事会投票席位的现实，甚至能影响最固执的公司领导者。如果创始人在融资时缺乏筹码，`CEO`\
  \ 在董事会就会处于少数地位，他必须根据投票董事成员的意愿而服务。这就是 `CEO` 如何被投票下台的，就像议会民主国家的首相通过不信任投票下台一样。如果保住工作取决于取悦他人，即使你的名片上写着“CEO”，你的脖子上也套了一个系着绳子的项圈，而那根绳子可以被拉拽。\n\
  \n另一个弱点是潜在的业务伙伴。发布新产品是一回事，但交易才是初创公司将橡胶投入收入赛道的地方。如果产品是企业软件，正如 `Adchemy` 那样，这意味着一年几笔交易就是公司的全部商业生计。几份大合同就维持了长期价值。如果这些是合作伙伴关系而非交易——即（通常是）大公司和小公司之间一种近乎婚姻的结合——那么赌注就更高了。这些合作伙伴关系，就像某些潜在的皇室联姻一样，取决于贪婪、长期战略和某种相互诱惑的微妙结合。像诉讼这种丑陋的现实，无论多么琐小，都会消解魔力，并让实力更强的伙伴逃之夭夭。即使是拥有数十亿资本的大型公司也害怕公开羞辱和法律泥潭。\n\
  \n所以，我们有一个必须去争取的致命命门。\n\n## 现在来谈谈刀子。\n\n在 `Adchemy` 的一名员工在喝酒时，曾不无意中向我泄露了 `Adchemy`\
  \ 正在与 `Microsoft` 进行一项大笔交易。这是一个新闻。此前销售员 `Murthy` 成功诱导进入资金池的唯一一笔大而蠢的钱来自 `Accenture`。`Adchemy`\
  \ 正面临着巨额亏损，除了线索生成业务外，没有转化为实际产品收入的机会。为了让这个骗局维持下去，`Murthy` 需要拉进另一个人。一些大笔资金。五千万，甚至更多。`Microsoft`\
  \ 是一个显而易见的选择，因为其平庸的搜索引擎 `Bing` 总是渴望从 `Google` 巨头手中夺赢得广告商和用户。鉴于我们在 `Adchemy` 期间目睹的展示广告领域的彻底灾难，显然\
  \ `Murthy` 正在将注意力转向更成熟的搜索市场，作为他最后的业务赌注。通过利用 `Microsoft` 在搜索业务上的自卑心理，`Murthy` 正在给自己争取一些财务氧气。我们必须找到接触\
  \ `Microsoft` 的方法。\n\n对于我们的第二把刀子，是 `VCs`。`Adchemy` 的风险投资赞助者是两家绝对的一流蓝筹公司：`August\
  \ Capital` 和 `Mayfield Fund`。这些基金的合伙人 `August` 的 `John Johnston`，他那滑稽的美国上裔名字与他的外表和背景相匹配。在\
  \ `Mayfield`，是 `Yogen Dalal`，他是典型的印度理工学院和斯坦福大学的结合体，这种组合遍布许多硅谷的董事会。得益于当时席卷硅谷且如今已司常到不值一提的资金趋势，我们对这些硅谷玩家拥有筹码。\n\
  \n原因如下：传统上，早期初创公司的资金是创业者个人财富、朋友和家人或商业“天使”的专属领域。在原始形式下，天使投资人是富有的人，通常也是前创业者，为了趣味或利润在胚胎公司中投机。\n\
  \n大多数公司在这一阶段就死掉了。成功的公司会在 `series A` 轮获得第一笔“真正的”且巨额的资金。那里的数字大得多，数百万美元，超出了大多数富人的范围。从历史上看，大多数职业风险投资者不会在种子阶段捣乱，有些甚至不参与像\
  \ `series A` 这样的早期投资。拥有数亿美元外部资金可供投资时，`VC` 主宰们不会浪费时间去写 5 万美元的小支票。\n\n\n\n\n\n随着 2010\
  \ 年左右科技泡沫的兴起——我们现在仍见证着其愈演愈烈的高度——整个剧本都发生了变化。谷歌和硅谷的一连串收购让许多硅谷参与者一跃成为富大翁。在硅谷这种自我维持的天才光环中，这种财富渴望创造更多的科技财富，导致了早期天使投资人资金的出现了一种近乎尴尬的过剩。许多这些初创公司的发掘者不仅投入了自己的自己的钱，还募集了\
  \ 2000 万到 4000 万美元之间的小额基金，以扩大对雏芽公司的持股。以前对一笔交易只写 2,000 美元支票的天使投资人，现在可以轻而易举地写出 20\
  \ 万美元甚至更高的支票（例如，我们的哥们 Sacca）。与此同时，`Y Combinator`等加速器的流行，加上对创业作为一种职业的普遍接受，意味着大量技术高超的工程师和产品人才放弃了企业职业轨迹，开始构建令人兴奋的产品。`Amazon\
  \ Web Services` 这种即用即用的按计算的出现，加上像 `Ruby on Rails` 这种现成的 Web 开发框架，意味着新想法比以往任何时候都更容易测试。许多创业者选择“卖铲子”而非“挖金”，创造了更复杂的软件构建模块来支撑创新，例如像\
  \ `Parse` 这样的后端服务，以近乎指数的方式加速了初创公司的爆发式增长。\n\n### 融资动态的转变\n\n这一切变化的最终结果是，种子轮的规模现在已经达到了以前\
  \ A 轮的水平；一家成立两个月、拥有极具说服力的 CEO 并募集了 200 万美元且称之为“种子轮”的公司不再是什么令人惊讶的新闻。由于上市时间缩短且技术发展迅速，那公司可以在六个月内达成其里程碑，并进行下一轮融资。有这么多各种规模和层级的资金等待投资，最优秀的创业者拥有了选择投资者的奢侈，而不是反之亦然，而许多投资者发现自己正焦虑地试图进入这些轮次。\n\
  \n由于合同规定某一轮的投资者有权在下一轮中进行投资，加上投资者与创业者之间的个人关系，那些想要进入超额认购 A 轮的投资者必须在种子轮就到场，才能获得那个位置。在向上发展的各种融资级别中情况也是如此。这意味着，以前会说“孩子，等你们融资\
  \ A 轮或 B 轮时再找我”的 VC，基本上被那些从公司还只是两个躲在破办公室里的男人时就开始培养和支持公司的投资者挡在了热门公司之外。`Mayfield`\
  \ 和 `August` 这样的重量级基金知道这一点，并开始进行种子轮投资，并不是为了拥有公司的一小部分（他们可以写整天的小额支票也投不完全部资金），而仅仅作为未来真正轮次的一种期权。\n\
  \n### 项目源流的重要性\n\n这（终于）引出了我们的核心点：在日常运营中，一个 VC 的生命线不是钱，而是项目源流（deal flow）。能够第一眼看到潜在的\
  \ `Uber` 或 `Airbnb`，是区分顶尖 VC 与平庸之者的关键。鉴于 `Y Combinator` 在吸引顶尖创业者方面的巨大成功，它对硅谷最优质的早期项目源流拥有几乎垄断的控制权。由于由于前述的后续投资现象，今天的早期项目源流会转化为明天的后期项目源流，`Y\
  \ Combinator` 是硅谷现在和未来最佳交易的守门人。\n\n就像对某些干旱农业地区的供水控制一样，谁拥有上游水闸最大的控制权，谁就控制了其他一切——这就是\
  \ `Y Combinator` `Demo Day` 的代表意义。因此，那些强大且傲慢、想要参加 `Y Combinator` 路演会的 VC 们，必须对一个穿着拖鞋、对胡话反感且对文字极有天赋的长得像熊一样的男人下跪、磕头膜拜。那个人毫无疑问是\
  \ `Paul Graham`，人类人类历史上最精明的科技投资者。在那些绝望的日子里，我们首先向 `Paul Graham` 寻求了我们那个生存性问题的帮助。\n\
  \n### 来自 Paul Graham 的保护\n\n像所有父母一样，`PG` 假装平等地爱他所有的初创孩子。现实是，有些公司获得的关注比其他公司多。考虑到他这种有条件的爱，考虑到我们冲突中那种暴躁、混乱的本质，他是否会跑去救助\
  \ `AdGrok` 尚存疑虑。毕竟，我们是那批公司中平平中矩的一个，而不是 `Hipmunk` 或 `InDinero` 那样的高飞者。\n\n我们不必担心。即使我们是家族里最不受宠的私生，`Papa\
  \ PG` 也动用了所有的保护欲。在一个表面关系和圆滑胡话成为规则的世界里，没有什么比看到真正的忠诚发挥作用更可怕的。`PG` 为我们的事业动员了 `YC` 的整个网络。\n\
  \n这更令人印象深刻了，因为我曾将 `PG` 误认为一种长辈式的、学术的存在，沉溺于关于初创公司的深度文章，举办创始人晚宴并签几张支票。这与事实完全不符。`Y\
  \ Combinator` 是那种毫不留情的权力玩家，他们会记住那些过去对投资组合公司产生过冲突、或散布过 `YC` 不良形象的投资者的名字，并将他们列入任何\
  \ `YC` 活动的黑名单，或从 `YC` 创始人的脑海中抹除。这样做时几乎不考虑他们的资金规模或在硅谷的影响力，导致不止一个自命不凡的 VC 在一顿训斥后哑口无言，或者因为公司创始人收到了\
  \ `PG` 的警告而被排除在某轮融资之外。\n\n残酷的现实是：想要在这个世界上拥有影响力，你需要愿意并能够奖励你的朋友并惩罚你的敌人。\n\n### 园区里的会议\n\
  \n所以，我们带着如释重负的心情得知 `Paul Graham` 给 `Murthy` 讨论此事。`Murthy` 对外人极尽谄媚，但对内却像个暴君，他在回复中称自己是\
  \ `YC` 的多年粉丝。随后出现了一段冗长的邮件记录（我没被抄送）。\n\n最后，`PG` 给我的一封邮件：\n\n“周六来家里见我。独自来，别带其他人。”\n\
  \n另一个创业教训：\n\n当你面临某些压力巨大、耗时且风险巨大的挑战时，要把公司的其他人隔离开来。他们可能无法产生价值，而随之而来的不确定性会在你最需要的时候侵蚀他们的效率。无论外界发生什么——诉讼、资金问题、丧尸末日——不要让它感染公司的心态并成为内部叙述的首要任务。\n\
  \n于是，我独自来到位于老帕洛托的 `PG` 园区。那里是深受加州建筑师喜爱的新西班牙风格，斯坦福大学本身就是一个很好的例子。\n\n园区似乎没有正门。我绕过它跨越的转角寻找可以敲的地方。有一辆自行车靠在墙上，头盔挂在车把上，随意丢在一扇敞开的小门旁。我探性地走了进去。\n\
  \n`Paul Graham`，硅谷最成功的科技投资者，从园区巨大的厨房里出来，穿着他那身永恒的制服：一件旧的橙色 Polo、卡其短裤和人字鞋（没穿袜子）。我从未见过这个人穿过其他衣服。\n\
  \n几乎没有任何铺垫或问候，`PG` 直接开始道：“我去过 `Wilson Sonsini` ... 可能是骑自行车出现的人。”\n\n\n\n\n我转过头去，至少给他们留一点社交隐私，但我暗自觉得很好笑。我想是\
  \ `YC` 的合伙人也会为了谁吃了剩下的意大利面条而争执不休。\n\n午餐风波解决后，`PG` 分享了他的反 `Adchemy` 战斗计划。简而言之：`YC`\
  \ 会谴责 `Adchemy` 的 `VCs`，并宣布除非他们解决这个问题，否则 `YC` 将永远不再与他们做生意。了解 `PG` 的性格，我知道他们不仅会被取消\
  \ `Demo Day` 的邀请，`PG` 可能还会引导公司向其他基金寻求资金。鉴于许多（甚至大多数）`YC` 的融资轮次都有投资者超额认购，一个被放逐的投资者可以被排除，而不会对融资公司造成任何损害。说到底，支票是来自\
  \ `August` 还是 `Sequoia`，谁真的会在乎呢？无论哪种，钱都是绿的。这意味着那些基金将开始大范围地向竞争对手输送 `YC` 的项目，而且正如我们之前回顾的，在早期阶段被拒之门外可能意味着在利润更丰厚的后期阶段也将面临同样的命运。`PG`\
  \ 就要这样直接把他们的一大块项目源全部冲进马桶。\n\n我笑了，想象着 `Mayfield` 和 `August` 的合伙人们在听到 `PG` 向他们下达最后通牒时，那种气急败坏的模样。`YC`\
  \ 竟然愿意为了 `AdGrok` 这种微不足道的小事，与硅谷投资界一些最显赫鼎鼎的人物断交。读者，你们可能生活在 21 世纪经济生活的寻常领域，那里像“以牙还牙”的互惠原则维持着社会规范，所以这看起来可能没什么。但在硅谷这种消极攻击性的人气竞争中，有人真的会为你挺身而出——真正的挺身而出，比如告诉大人物去滚蛋——这比火堆里的雪花还要罕见，也转瞬即逝。\n\
  \n我连声向 `PG` 致谢，然后他回到厨房吃他的午饭了。\n\n我决定不告诉伙伴们关于这次会议的任何事情。如果 `PG` 的推动无果，只会让他们感到失望。\n\
  \n“割蛋式”申请流程：开始。\n\n下一把“刀”需要一些解释。巧的是，它也涉及了一位（未来的）`YC` 负责人，但在当时他只是像我一样的一个初创创始人，尽管是一个非常出色的创始人。\n\
  \n（注：后续文本内容逻辑混乱且大量重复，已未翻译。）\n\n\n\n\n从一种极度恐慌、濒临崩溃的起点开始，AdGrok 现在已经将 Adchemy 包围。\n\
  \n一方，一位实力雄厚的硅谷法律高手正在进行一场传统的法律斗争，种种迹象表明，我们有能力打赢整场诉讼。“送葬者”（The Undertaker）向圣克拉拉拉县法院发了措辞严厉的信，反驳\
  \ Adchemy 的指控，提议提供我们的外部审计代码作为清白的证据，并启动了痛苦的敌对性质证程序（那是一场耗费灵魂、浪费时间的对峙，即使是 Murthy 个人也会深陷其中）。\n\
  \n另一边，Murthy 的金主们可能正对着他大吼，让他停止当混蛋，尊重硅谷不成文的规则——即不要轻率地与初创公司挑起昂贵的战斗。亏了 PG 将这些金钱主驱逐出演示日（Demo\
  \ Day）的殿堂，以及这对他们未来的交易流意味着什么，VC 们的生计正因为 Murthy 的胡闹而面临风险。顺便问一下，你们到底为什么不在关注我们的投资——那家垂奄末息的\
  \ Adchemy 呢？\n\n最后，Murthy 迫切需要的下一个大合作伙伴，也是他作为一个拥有问题初创企业的企业家所能打出的最后底牌，正告诉他：交易取决于能否解决\
  \ AdGrok 的烂局，否则没门。\n\n我愿意支付我在 AdGrok 一半的股份，只为了看看 Murthy 在考虑 AdGrok 与 Adchemy 关系状态时的表情。\n\
  \n## 创业需要什么？\n\n这绝对不是智力。\n\n我曾是伯克利物理博士班中排后三分之一的学生，我参加了三次初级考试才通过。我认识的大多数创始人确实非常狡猾且反应敏捷，但与我在学术界遇到的某些认证天才相比，他们并赢不了任何菲尔兹奖奖或诺贝尔奖。\n\
  \n这绝对不是技术技能。我是一个糟糕的程序员，充其量只能写出一些完成产品的粗糙原型。有些创始人是技术大师，但我怀疑大多数人并不是他们各自计算机科学课程的顶尖学生（假设他们确实是是受过正式教育的话）。\n\
  \n这并非独特的产品或市场愿景。任何用 Google 的广告购买工具用了五分钟的人，就能意识到那块垃圾是一个每年产生 700 亿美元收入的机器，从而看到 AdGrok\
  \ 的价值。有些初创想法非常有远见，比如 Airbnb，但很多像 Dropbox 那样，仅仅是现有技术的极佳执行版本。\n\n## 成功创始人的两种特质\n\n\
  在我极其有限的经验中，有两种特质能将处于不同层面的成功初创创始人区分开，从被遗忘的微不足道（如 AdGrok）到改变时代（如 SpaceX）。\n\n### 1.\
  \ 偏执的专注\n首先，是能够偏执且痴迷地专注于某件事，且仅此此件事，并以牺牲生活中中其他一切为代价。我生活、呼吸、排泄的都是 AdGrok。多亏了专注于 AdGrok，当我身处\
  \ Mountain View 的那个大穴里时，我通过 Skype 窗口看着女儿长大。除了参加那些充满奉承和酒精的技术活动外，我没有其他社交生活；在那些活动中，我会穿着\
  \ AdGrok 的 T 恤，与我并不真正关心的人进行技术性的闲谈。我没有任何爱好或户外活动，除了偶尔去一次健身房。我那艘投入了两年金钱和周末修复的帆船，在阳光下慢慢腐烂。我除了科技媒体外什么都不读。电影更是别想。至于女士们？虽然我名义上还和英国交易员（British\
  \ Trader）保持关系，但我的阴茎在解剖学上等同于我的尾骨：过去时代的无用遗迹。\n\n### 2. 韧性\n其次，是承受和忍受无尽辱骂的能力。我是在一个比我大十岁的姐姐的虐待照顾下长大的，她乐于释放无休止的嘲讽和凌辱。我的父亲是一个各方面都很专横的男人。我在一所充满野蛮霸凌者和冷漠疏离的神父的男天主教学校度过了多年。我们除了互相殴打和自慰，什么都不做。在一个昂贵的城市里，作为一个一文无钱的研究生，我一无所有地撑过了六年，然后在华尔街竞争最激烈的交易员上，在历史上最大的市场灾难中生存了三年。简简而言之：在白领苦难的有限范围内，没有什么是我无法长时间承受的。\n\
  \n## 坚毅的现实\n\n你可能会问，我为什么表现得这么扫兴？创业里应该有些乐趣吧，对吗？\n\n当然，有些时候企业家的生活会让你觉得自己掌握了世界。。你刚刚从一位受人尊敬的投资者那里拿到了你见过的最大支票，`boom!`，那笔钱就活如生地出现在了你之前空如的银行账户里。你发布了一个产品或写了一篇火遍全网的博客，在那个闪光的时刻，你是科技界的焦点。但这些时刻被无数次噬咬的怀疑、令人作呕的焦虑和无尽的劳作所远远淹没。如果你和合伙人的关系很好，那么这种同情谊可以支撑你。事实上，正如体育或战争一样，那种不让伙伴失望的强烈欲望往往是让你坚持的唯一动力。但如果你没有合伙人，或者那种兄弟般的关系不存在，那么维持整个架构运行的唯一东西就是纯的、顽固的死脑筋。你每天起床，被打了一耳光，第二天又回来继续。\n\
  \n但与偏执的专注这种一旦成年后极难塑造的性格特质不同，这种东西——称其为坚毅、毅力或任何名字——是可以学习的。如果你觉得自己内心不具备那种力量，那就骑自行车横跨美国，划船横跨海洋，或者加入陆战队。无论付出什么代价让自己惊讶。顺便说一句，有敌人是有帮助的。虽然爱是美的情感，但为了证明某些批评者错误的复仇欲望，或对敌人的生存恐惧而建立的帝国、写下的书籍、纠正的错误、赢得战斗和实现的理想，远比世界上所有的爱都要。爱伟大，但恨和恐惧持续得更久。\n\
  \n\n\n\n\nMurthy 走向了他应得的遗忘。他在硅谷历史上唯一拥有的篇章就是这一章，我为他写下的这一章。\n\n至于 `AdGrok` 和那帮哥们，是时候考虑真正的发布了。\n\
  \n## 转折点\n\n当 `AdGrok` 成功让自己脱离生存危机时，我与英国交易员（British Trader）的关系正处于压力和相互摩擦的煎熬之中。我已经受够了她的傲慢指责和那副刻板的坚毅。与她以及\
  \ Zoë *同居*（en concubinage）的生活，与其说是某种波西米亚式的家庭情景剧，倒不如说是在女王军队中服役。她哥哥确实是英军的一名军官。甚至不是骑兵卫队（Grenadier\
  \ Guards），那些穿着红色夹克、戴着高耸熊皮帽、在白金汉宫前英姿飒爽的汉们。家里的生活节奏随着 Pimm's 汽水、周日烤肉、早晨的马蹄酱、节日的肉馅派而波动，并且每当那个老太婆在\
  \ BBC 电台（“the Beeb”）上发表某些爱国主义胡话时，他们就听女王的演讲。\n\n英国交易员想要成为绝对的船长的愿望这很好，但一艘船或一家公司只有一个船长。如果她想要那个角色，她可以自己去打理房子。\n\
  \n仿佛就在昨天发生的一样，我记得这段萌芽家族剧的结局变得清晰的时刻。那是一个周六的早晨，是从创业的狗事中获得的短暂喘息。当我煎煎饼或大欧姆蛋时，NPR 广播里正响着《Car\
  \ Talk》。空气中那种感觉，在我的生命中如此罕见，某种稳定与宁静，像明媚的晨光一样闪烁，也同样转瞬即逝。\n\n英国交易员和 Zoë 在后院闲逛，检查番红菜园，或者可能是鸡舍。推开后门（那扇门松手就会作响并啪啪一声关上），我看到英国交易员抱着\
  \ Zoë 走进来。她们从我起床之前就在外面了（对我来说在旧金山又熬了一个深夜），这是我那天第一次见到 Zoë。随着婴儿期的结束，她那海蓝色的眼睛慢慢变成了棕色，凌乱的棕发，以及即便在最年幼时，她脸上总是带着那种顽皮的喜悦。当她朝我微笑时，那两脸颊。就像生活中其他任何事物一样，她引发出我一种不加质疑的微笑，那种任何事情都无法从你脸上抹去的微笑。\n\
  \n“你现在再也不像以前见到我那样笑了，”英国交易员打趣道，怀里抱着 Zoë 擦肩我进了门。\n\n事实确实如此。我之所以留在阿拉拉梅达（Alameda），唯一的理由就是那个棕发的小包，很快，光这样也不够了。\n\
  \n## 离开\n\n大约在 2010 年底，`Adchemy` 闹剧以胜利告终时，我决定受够了居住的这间英式营房般的卧室，并宣布我要离开这个家庭，离开英国交易员。\n\
  \n这一声明引发了你所想象的所有戏剧性和激情。在经历了惯常的忙乱和争吵后——考虑到我们共同加速的生活（一个孩子，一栋装修过的房子，一场诉讼，一家公司，大多是计划之外的），争吵比平时更激烈——我在旧金山找到了一个阁楼转租房。\n\
  \n我曾宣布过，打算最晚不于 12 月 1 日离开前线，将我的少数行李搬到 Potrero Hill，并专注于我们新解放的创业公司。12 月 3 日，我回到家里收拾最后一些物品，我们陷入了那种相互纵容的关系终尾声中——部分是激情，部分是怀旧，许多最近分手的人对此都有负罪。\n\
  \n## 意外的转折\n\n快两个月后，回到 2011 年 2 月，当时 `AdGrok` 正为 `Adchemy` 战争的正式结束而欢呼，嘲弄地履行着和解协议下的法律义务。英国交易员突然告知我她又怀孕了；日历上的推算将我们直接带回了\
  \ 12 月我搬出去时的困境，那是我们在分手后那段毫无亲密的荒漠后的最后幽会。在经过短暂的争论后，英国交易员确认了她想要孩子的意愿，无论我对此事的想法如何。\n\
  \n我意识到，也许这次最近的生育实验——也是第一次——是英国交易员计划的，她正处于绝经期的边缘，一个拥有一切手段唯独缺少意愿男性伴侣的职业女性——如果是这样，我就通过温暖的微笑和顺从的大腿骗入了父亲的陷阱，这是书上最古老的花招。无论是骗子还是受骗者，我们在这个世界上要么是某种阴谋的主体，要么是客体。我们唯一的希望是策划方案获得的利润大于作为他人计划中龙套的成本；按照这个速度，我每要一个孩子就需要一家创业公司。\n\
  \n## 对 AdGrok 的影响\n\n说起这个，这是如何影响 `AdGrok` 的呢？\n\n我的第一个想法是不告诉那帮哥们；他们会比我更压力大，而我需要他们在即将到来的产品发布中保持警觉和高效。我的第二个想法是，好吧，那又怎样？我已经深陷风险之中；用华尔街的量化术语来说，我们的回报特征绝对是二元元的：要么取得巨大的成功，获得百万美元的结果，要么就此廉地失败。\n\
  \n在其中多增加一个孩子又如何？我将既有继承人和备用胎。一点冗余，无论是在技术上还是遗传上，都百无害处。\n\n***\n\n> 我观察到有些男人就像体育场上糟糕的跑步者，在接近目标时放弃了目标；而恰恰是在那个时刻，他们比其他任何时候都更能确保战胜对手。\n\
  >\n> — 留波比留，《史》\n\n## 2011 年 3 月\n\n距离我们被 `YC` 录取已经快满一年了，距离公司成立十个月，距离我们发布 `AdGrok`\
  \ 七个月，距离我们融资六个月，而距离我们正式将 Murthy 埋入化粪池仅一个月。\n\n\n\n\n\n# 发布\n\n只有一个问题：3 月 7 日，周一，是\
  \ Zoë 的周岁。距离我们获得融资几乎恰好一年了，而 Zoë 在我们那场糟糕到极点的 YC 面试之前刚刚出生。如既往一样，当在创业公司和任何其他事情之间做出权衡时，赢的是创业公司。小\
  \ Zoë 甚至不会记得她的第一个生日，如果我们能顺利完成这次 AdGrok 之举，这笔钱将会在二十一年后支付她哈佛大学毕业的费用。Zoë，如果你正在读这些，请接受我这迟迟的道歉。\n\
  \n周一，那几个家伙采取了行动，部署了新代码。记者们发布了重构的新闻稿。一小波新用户注册了，引发了一轮由我们轮流提供的客户支持聊天（“我尝试链接我的 Google\
  \ 账户但不起用 . . .”）。得益于我们本质上是买来的媒体报道，AdGrok 在几天内技术版图中微弱地占据了一席之地。发布了！\n\n在 Y Combinator\
  \ 的巢穴里，白板上一张褪色的画正对着主餐厅/会议室。它描绘了 `X` 和 `Y` 轴简单的 L 型形状，以及一条从左到右延伸的曲线，代表时间的流逝。高度代表初创公司的经营状况，形状最初从零开始急剧上升，达到一个标记为“发布！”的顶点。顶点之后是突然的崩盘，然后是一个几乎横跨整个图表的低迷平原。在经过了长时间的平直状态后，曲线略微上扬，然后再次下降（标签为：“配置错误的分析代码”），接着以稳定的速度增长，直到“收购”。在发布高峰和缓慢起飞之间那个巨大的、令人心慌的空间，用大写字母写着不安的字样：“绝望之谷”（THE\
  \ TROUGH OF DESPAIR）。\n\n把自己想象成创业创始人一刻：你成功拼凑出了产品，可能获得了一些风投资金。你发布了，获得了一波公关热度，一切都在全力运转。你打开追踪使用情况的分析仪表板，看到似乎有像海洋一样感兴趣的用户在点击并玩弄着你费尽心力交付的每一个功能。\n\
  \n然后几周过去了。\n\n媒体周期已经转向了其他新的、更亮眼的事物。你的分析图表看起来就像心脏病发作患者的心率监测仪。新用户的注册速度已经减慢到发布前的那种微弱流量。\n\
  \n如果你是这方面的新手，你脑子里会有关于创业成功的天真模型。人类喜欢秩序感和意义：戏剧第二幕发生的事情必须源于第一幕。好人最终获胜，坏人受到惩罚。如果我们从《财富》（*Fortune*）封面上看到像\
  \ Dropbox 的 Drew Houston 那样带着微笑的企业家，我们就假设 (A) 他因为才华而待在那里，(B) 他是通过一系列理性行为到达那里的，在因果链中一个胜利接一个胜利。\n\
  \n然而，这种这类童话在发布后就被证明仅仅是它们所追随的幻想。你花费了几个月的时间并在产品上赌上了职业生涯，然后在短暂的兴奋之后，你意识到它到底是一个多么扭形且出身不明的狗屎。这种危机杀死了\
  \ 90% 或以上的幸免了创始人分歧、代码交付失败和融资失败初期瘟疫的创业公司。这道几乎无法跨越的鸿沟，是 *TechCrunch* 或其他科技杂志上所有“发生了什么？”帖文的背后——当某些看似不可阻挡的创业公司突然宣布停止运营并归还投资者剩余资金时，这些文章就会出现。它的创始和管理层无法通过绝望之谷，就像某些试图穿越荒凉沙漠、迷失的英国探险家一样，公司基本上放弃并死去了。\n\
  \n这种失败显然并非仅仅是因为缺乏胆量。它可能是一家采用免费增模式（freemium）的公司，需要大量免费用户升级为付费会员，但不知道如何获取所有这些用户。它也可能是一家服务公司，拥有大量用户，但不知道如何扩大业务规模（例如一家无法招聘和留住高质量清洁工的家政服务公司）。未能跨越深谷的原因有无数，但它几乎涉及到无法可扩展地获取或服务用户的某种障碍。\n\
  \n## 解决方案是什么？\n\n流行的答案是你需要找到所谓的“产品市场匹配”（product-market fit），这是一种华丽的说法，意味着你需要构建一种人们愿意付钱的东西。事实证明这非常困难，因为在要求他们之前，你不知道他们会为什么付钱，而且如果你构建的东西真的是创新的，就没有历史可以可循。幸运的是，软件业务的迭代周期很快（我们不需要在这里重新调整铣床），并且从某个大致正确的起点开始，我们可以收敛到最终产品，就像对方程的解进行连续猜测。我们迭代得越快，就能向那个神话般的完美匹配点迈出越多的步。每一步都意味着工资、服务器成本和流失时间的开支。当现金余额归零时，游戏就结束了，我们输了。然而，如果我们足够接近那种完美的产品市场匹配——用户为产品支付的钱超过了其运营成本（以及最初获取这些用户的成本），我们就逃脱了财务上的自由落体。回想我们那个陈词滥调：创业公司就像在跳下悬崖后制造飞机；达到所谓的正向“运行率”（run\
  \ rate），就像终于装上了翅膀，启动了引擎，看着这台机器实际上维持或增加了高度（无论它造得有多糟糕）。\n\n\n\n\n你们有哪些共同的朋友或人脉？他们认识你为了职业原因而维持的那些混蛋朋友，还是那些你真正尊重的人？正如在马基雅维时代一样，现在，衡量一个人的标准取决于他所交的朋友。\n\
  \n他们常在哪里出没？品味廉价还是昂贵？他们是否有像《朱利叶·凯撒》中卡西斯那种“消瘦而饥饿的神情”，在破旧的塔可饼店吃饭，或者靠拉面或食品替代品等廉价主食生活？那些才是真正危险的人，他们生活得像有组织犯罪的刀手、游击战士或海上水员——吃着糟糕的食物，住在廉价、破烂的临时住所里——完全不在乎生活质量。这些人是值得畏惧的，因为他们不需要对手可以剥夺的任何东西。或者，他们曾在\
  \ `Benu`、`Saison` 和 `Quince` 有过打卡记录？如果他们并不独立，那么他们就是无害的工具；他们会尽一切努力维持那场真菌肉酱、鲋和橘皮鲍鱼的巡游永不停歇。\n\
  \n在随时间推移的照片中，他们看起来是什么样的？他们看起来健壮健康吗？穿着印有公司品牌的、紧贴臀部的骑行服，在一条风景优美的 `Skyline Boulevard`\
  \ 上参加集体骑行？他们是否保持着稳定的工作与生活平衡，定期安排两小时的锻炼，并留出周四约会之夜的时间？或者，他们看起来像被蓝鲸吞进去，在它的消化系统里穿行了三天？\n\
  \n全心的投入，就像无私的爱一样，是唯一重要的类型。那些骑自行车、忙于约会之夜的人绝不会为一家公司或一个想法付出一切，他们只不过是安于现状的资产阶级，无论他们披着什么样的“颠覆性创新者”的外壳——这些外壳通常是冗长的博客文章，或一满满商学院水平的空谈书籍。然而，那些看起来可以像流浪汉的人，才是创业领域的“神风特队”，他们会为创业事业付出一切，只有死亡或监狱才能阻止他们。\n\
  \n他们是所谓的美国统治精英层吗？他们是否来自美国特权的城市群岛：`马里兰州的切维·查斯`、`伊利诺伊州的温内特卡`、`加利福尼亚州的提伯伦`、`纽约州的斯卡斯代尔`等等？或者他们来自`加利福尼亚州的维萨利亚`，或`华盛顿州的奇马库`？他们是否读过以航天员或总统命名的高中？他们的就读学校名字是否带有“Day”或“Prep”字样，或者符合特定的公式“The——School”，其中空白处是某个宏伟的/或听起来很盎格鲁的名字？如果是这样，他们玩的是缓慢稳健的长期游戏，逐渐积累社会资本和个人品牌，像蚂蚁为过冬储食一样。他们是如何进入科技精英的优越圈子的？是坐着上阶级的旅游巴士从`常藤学院`一路走向咨询/或金融行业并精疲力竭，还是从某个偏僻地区杀出一条，仅凭胆量和/或闪电战成功赢得了席位？后者令人敬畏，前者……则不如此。\n\
  \n在与那些决定你整个财务未来以及后代未来的人坐下之前，你应该比他们的母亲更了解他们。了解他们想要什么——是金钱、权力、各种口味的社交认可，还是仅仅是一段舒适的生活——你就能预测他们最终行为的\
  \ 90%。\n\n所有这些窥探对你来说似乎很奇怪或不符合道德？我要说明的是，这些都是公开记录，而且在拍摄这部尽职调查电影的过程中没有违反任何法律。\n\n###\
  \ 回到 AdGrok 与 Twitter 的第一次约会\n\n杰西卡，当时是构成 `Twitter` 企业发展团队的单人军，她曾是`斯坦福大学`的校一级曲棍球运动员。她的父亲是西雅图的一位内科医生，她在那里长大。家庭住所位于西雅图一个华华的`华盛顿湖`岸，是一栋五间卧室、三间浴室的房子。这也能解释了她高中名字里的“Prep”。这确实是地道的西岸绅族。如果你非要知道的话，她显然正在与一位\
  \ `Twitter` 工程师交往，而那个人最终（剧透预警！）面试了我。\n\n当时，`Twitter` 位于 `Folsom Street` 上一栋看起来普通的高层办公楼内，位于`第三街`\
  \ 和 `第四街` 之间，在 `AdGrok` 以北几个街区。我步行过去，走了一条风景优美的路线，带我穿过一条小巷，跨过 `Brannan`，穿过一条有一个菲律宾共济会庙的侧街（那是你偶尔会在科技时代之前的旧金山看到的那些无法解释的遗迹），直接到达\
  \ `South Park` 的中场线。\n\n`South Park` 是城市沙漠中的一片宁静绿洲，让人们想起在伦敦某些社区发现的小巧而私密的公园。这并非偶然。`South\
  \ Park` 开发于 19 世纪 50 年代，正是这种舒适的伦敦联排房屋与公园开发的仿品。\n\n一条椭圆形道路环绕着一个绿草公园，里面有树木、长椅和一个不协调的游乐场（不协调是因为半径半里内可能没有孩子）。到\
  \ 2011 年，这里一直是旧金山创业热潮的中心，创业公司的 Logo 从二楼窗户探出来，出现在午餐时间穿梭其中的忙碌极客们的 T 恤上。几家设计和建筑公司在不断上涨的租金中生存了下来，因为他们在科技时代之前的\
  \ 90 年代对该地区进行了绅士化，赶走了曾经占据 `SoMa` 的流浪汉和毒瘾者。\n\n我到了 `Third Street` 和 `Folsom`。再往前一个街区就是`旧金山现代艺术博物馆\
  \ (SFMOMA)`，它的永久展品平淡无奇，但坐落在由瑞士建筑师 `Mario Botta` 设计的惊艳建筑内。`SFMOMA` 是该市唯一严肃的艺术场所；除了博物馆和可能的交响乐团，这座城市是一片文化沙漠。但有了\
  \ `Google`，谁还需要高高 n 呢？\n\n面对 `SFMOMA` 的是 `Moscone Center`，它以旧旧金山市长`乔治·莫斯科尼` 命名，他在\
  \ 1978 年在市厅的办公室内被暗杀，还有加利福尼亚州第一位公开恋恋的选任官员`哈维·米尔`。这是一个横跨两个市街的巨大建筑群，汇聚了你能说出的所有主要科技会议。`Oracle`、`Apple`、`Salesforce`、`Google`\
  \ 都在那里举办产品活动，还有各种小众活动，如 `GDC`（游戏）、`JavaOne`（Java 语言）和 `RSA`（网络安全）。如果你有任何科技职业，总有一天你会戴上印有公司品牌的挂绳和胸牌，走进科技会议这场安排严密的资本主义盛宴，那里有一系列有先排好的的产品发布、“炉边谈话”以及临时搭建的促销活动贫民窟。\n\
  \n我左转进入 `Folsom`，再往前走一个街区，就进入了 `795 Folsom` 那栋看起来完全普通的制混凝土建筑的大厅。`Twitter` 只占据了两个楼层，但正如它占据的每栋建筑一样，正在逐渐扩张。穿着制服的安保人员守在前台，有两次安全检查，在大厅层一次，通过后你将获得一个名字贴和一个指定的电梯。到达楼层后，接待员会收起你的大厅名字贴，并给你一个\
  \ `Twitter` 的胸牌。胸牌上有一个延迟墨水印章：它会随着时间的推移而褪色，并在几小时后消失，确保你无法将其留存并重复使用。\n\n\n\n\n正如我很快发现的那样，这是惯例，我被要求签署一份保密协议，这使得我哪怕泄露厨房的墙纸设计或透露在\
  \ Twitter 内部获得的任何知识（无论是感性的还是技术性的）都是违法的。\n\n然后我开始了等待。两个穿得极其讲究且神情紧张的人和我一起等待，可能可能是应聘者。咖啡几上放着大开本咖啡书，是关于数据科学新世界和风景摄影的艺术类大部。接待区本身使用了格雅的回收木材护墙，那个小小的\
  \ Twitter 鸟标志无处可见，甚至包括了接待处微型厨房里那些优雅的黑色咖啡杯。\n\nJess 出现了，她和网上的宣传照一模一样。她脸上带着挥之不去的微笑，有着那种精力充沛热情的性格，像极终身运动员一样将内啡肽水平推到了人类极限。\n\
  \n“午饭前想先转转吗？”她提议道。\n\n我怎么能拒绝呢？在前往咖啡馆的路上，我们穿过了办公室。\n\n### 工作空间\n作为一个工作空间，它是典型的旧金山酷初创公司风格。长排的共享办公桌，上面点缀着每位员工科技公司的\
  \ `mise en place`：大显示器、Aeron 椅子、散落的书籍和个人物品。阁楼式天花板裸露混凝土，管道（无论是字面上的还是互联网的）呈长距离横穿，粗壮的亮蓝色\
  \ `RJ45` 电缆束与喷漆的铸铁管并排在一起。有很多做旧的木材和热轧钢家具。合成材料制成的仿鹿头头，还有那些噩梦般的鸟群——不是那种平淡的公司 Logo，而是你在那种真正的亨特·S·汤普森式的迷幻发作中才会看到的鸟群——分布在裸露的墙上，通常是某种蓝色的粉色调。公司食堂延续了这种考究的设计，但到了这种程度，我已经用不出更可爱的词来描述在\
  \ Restoration Hardware 看到的那些破事了，所以你可以自己想象一下。\n\n我后来得知，Twitter 创始人兼首席执行官 Ev Williams\
  \ 的妻子 Sara Morishige 是公司高度统一的设计美学的幕后手。这绝对不是许多科技公司那种充满直男气息的垃圾堆。\n\n### 会见 Twitter\n\
  此时 Twitter 大约有四百员工，所以按“大”科技公司的标准来看规模相对较小。尽管如此，而且当时 Twitter 的收入还微乎其微，咖啡馆依然产出时尚又健康的食物，从“舒适”型（自制盐渍熏心牛肉三明治）到更高级的（设计师蔬菜配香煎金枪鱼）。我随手拿了一个离我最近的，找了个座位。\n\
  \n我向 Jess 推销了 `AdGrok` 的软实力，并描述了我们成功的（！）发布和未来的产品计划。我们愉快地聊了聊我的博客文章，她是这些文章的活跃读者。我们是在在一篇特别火的文章之后，互相关注并发送了消息，才第一次真正“相遇”的。\n\
  \n在这场礼貌但平淡的午餐接近尾声时，那个让 Twitter 盈利的男人出现了：这是在这个充满幸运巧合的季节里的随机偶遇。Adam Bain 身高高、发型精致、衣着格外显眼，即使在一个外表比其他大多数时候都重要的公司里也是如此。他是一个备受议论的、从福克斯挖槽来的新人，在福克斯，他领导了鲁珀特帝国所有的数字变现工作。在一个充满单速车和刻意做旧木头（以及人）的文青潮流世界里，他是那个盯着收银台的成年人。\n\
  \nJessica 介绍了我们。\n\n“那么，你们在忙什么？”他问道，从繁忙的日程中抽出了宝贵的分钟。\n\n我恐慌地意识到，我午饭没带 `AdGrok` 的笔记本电脑，因此没有准备好进行临时演示。\n\
  \n砸了！\n\n*永远在成交，老娘们（Always be closing, motherfucker）。*\n\n但我们有办法。\n\n`MRM` 一直是个富有创意的工程师，知道如何从同一段代码中提取六种不同的价值，他为\
  \ `GrokBar` 编写了一个由 `AdGrok` 托管的演示网站，允许在任何机器上包括平板电脑或手机上进行演示。\n\n“我可以在你的笔记本电脑上演示给你看吗？”我问道，指了指他像抱着安全毯一样随身携带的那台半折叠机器，就像一个典型的经理级高管会做的那样。\n\
  \n“可以。”\n\n接管 Bain 的机器，我演示了足够多的 `GrokBar` 来让他印象深刻，引导他查看平滑的性能数据表格和折线图，在我导航我们的演示电商网站时，所有数据都在优雅地更新。我将产品的现实包裹在足够的营销糖分中，好让这剂药好下肚。随机偶遇结束，他前往了下一个会议。\n\
  \nJess 送我出大门回到接待区。一名保安像门卫镖一样守在门口，在我离开时特意拿走了我胸牌上写有隐形墨水的胸牌。\n\n回到办公室，`Argyris` 正在独自工作。正如以令人不安的频率发生的那样，`MRM`\
  \ 决定留在家，放弃从他海边小镇的通勤。总会有各种理由，但 Argyris 和我都不买账（Argyris 尤其如此）。绝望之谷正在吞噬牺牲者。\n\n“那么，和\
  \ Jess 吃午饭得怎么样？”Argyris 心不在焉地问道，眼睛没有抬离屏幕。\n\n我站在他旁边引起了他的注意。\n\n“你觉得卖给 Twitter 怎么样？”\n\
  \n## 2011 年 3 月 22 日，周二\n吃午饭后，Jess 通过正式邮件向 Twitter 的两个关键人物介绍了我：Kevin Weil 和 Alex\
  \ Roetter，他们都是当时初创的广告团队的工程师。我在和 Jess 第一次约会时感受到的那种公司吸引力的奇异触动，显然得到了回馈。我被介绍为一个他们应该立即聊聊的“狠角色（badass）”。\n\
  \n正如我希望在工作中许多免责声明中说清楚的那样，我的技术生涯一点也不“狠角色”。我所取得的微小成功纯粹是因为运气，加上在关键时刻是个冷酷的小坏蛋。不，我提到这一点是为了强调大公司对小公司日益增长的兴趣，就像人们对新的感情对象、房子或汽车所产生的那种迷人的魅力一样。你感兴趣的对象展示他们的商品并试图诱惑你，但过了某个点，你这个买家才是诱惑自己收购的人。\n\
  \n与 Kevin 的礼貌邮件变成了提议的午餐，这次是全队。于是，`AdGrok` 的总部全体从 `GrokPad` 赶到了 Twitter，有些紧张，不知道预期什么。入场程序重复，我们在\
  \ Twitter 主餐厅午餐的喧闹中围坐在一个圆桌旁。\n\nKevin Weil 是哈佛学院的优等毕业生，和我一样，在登上科技过山车之前从物理学博士项目中辍学（他在斯坦福大学）。Alex\
  \ Roetter 是一个资深 Google 员工，曾是 `AdSense` 的创始工程团队成员。他们都是广告团队的部门经理，是让科技公司一线军队运转的副将。在他们和\
  \ `AdGrok` 的男孩们之间，对话很快转向了 `AdGrok` 面临的技术挑战：扩展我们的后端，以及最重要的，处理 Google 有时挑剔的 Ads API。\n\
  \n`API` 是“应用程序编程接口”，它是外部人员可以运行的一组函数和子程序，以便在公司服务之上构建自己的第三方服务。\n\n\n\n\n例如，`Twitter\
  \ API` 允许人们构建一种工具，收集你所有的推文，并以一种优雅且实用的方式展示它们的互动数据（例如，`retweets, favorites`）。实际上，这是当这些计算机属于不同公司时，它们之间相互通信的方式。在广告系统中，它是开发者为复杂的营销人员构建工具，用以创建和管理广告的方式。由于像\
  \ `Google` 和 `Facebook` 这样大型发行商提供的原生接口通常并不可用，或者是为小型广告主设计的，因此广告 API 是变现策略中至关重要的一部分，因为它本质上是接入大部分收入的“管道”。在我们故事的这个阶段，Twitter\
  \ 还没有广告 API。它几乎没有任何广告，仅在一年前才推出了“推广推文”。当然，人们对此疑言片语，认为它会在某个时刻向开发者开放 API，而 `Kevin`\
  \ 对这个话题的关注似乎证实了这一点。\n\n突然，坐在我右侧的 `Kevin` 打断了技术闲聊，看向我。“也许你应该加入我们那件事。”\n\n“加入你们？怎么加入？”我问道。\n\
  \n“就像收购你一样，”`Kevin` 微笑着说。\n\n虽然在 `Jess lunch` 之后我曾有过预感，但实际上从一位 Twitter 工程师口中听到这句话，完全是另一回事。\n\
  \n“呃，我想我们得好好谈谈这件事，`Kevin`，”我说，喉咙不由自主地收紧。\n\n回到 `GrokPad` 后，我们聚在一起讨论。这是我们第一次在任何半严肃的语境下听到“收购”这个词。由于我们完全是门外汉，完全不知道如何解读它，所以我把这个消息告诉了我们信任的人，或者至少是那些在这种情况下该做什么的人。\n\
  \n`PG` 是我发出的第一封邮件。如所预料，他对整件事持看空态度，认为这会分分散精力，并建议我们忽略它，习惯于说“不”。他是正确的，从这个意义上说，任何优秀的初创公司在兴起过程中都会收到几十个收购报价。我用“报价”这个词时很谨慎；公司会提到这种可能性，但整个过程往往只是利用创始人的时间对公司进行解剖的借口，是大公司为了保持相关性而做的市场情报工作，以防止被新秀者措手不及。他还私下建议我让伙计们远离任何关于收购的闲谈。\n\
  \n接着，我联系了 `Sacca`。\n\n到那时，`AdGrok-Sacca` 的关系已经冷淡了很多，我不明白为什么。在 `Adchemy war` 早期的几次邮件交流后，他就沉默了。他忽略了任何向其前雇主\
  \ `Google` 请求引荐的请求，或者任何其他请求。与 `Russ` 和 `Ben` 不同（他们每周甚至每天都会参与进来，甚至在我们第一次参加会议时也出来支持这项工作），`Sacca`\
  \ 在 `AdGrok` 基本上是不处于缺席状态。\n\n这一切即将发生变化。\n\n在我联系他几分钟后，他拨打来电话询问发生了什么。我告诉他了这些突如其来的收购传闻。随后他打回了电话，透露了那场午餐中发生内内幕：显然，Weil\
  \ 正在即兴地提出一个没有人正式同意的潜在收购报价。\n\n在接后的几周里，`Sacca` 在任何时候都会打电话，通常是在他坐在出租车后座时；凌晨两点还有短信。我们都对这种转变感到有些困惑，而且每个人都有些不愿将命运寄托于他那傲慢的存在。虽然在我们资金短缺的时期他是受欢迎的，但现在他要求一种他尚未通过汗水股权或建立信任的面面交流完全获得的信任。但\
  \ `Sacca` 是一个专业的投资者。\n\n\n\n亚当·贝恩（Adam Bain）将成为首席运营官（`COO`），负责公司的日常业务及销售。杰斯·维里里（Jess\
  \ Verrilli）将成为企业发展总监，那个手握巨额支票并被赋予尽可能收购人才和技术的使命的人。\n\n一家公司构建什么（产品副总裁 `SVP`）、如何构建（工程副总裁\
  \ `SVP`）、该最终的产品如何在运营上运行（`COO`）以及收购哪些其他公司（企业发展部）：这些是任何大型科技公司的核心职，而我们在 2011 年忙碌的 48\
  \ 小时中结识的广告团队成员，到 2015 年将成为 Twitter 的这些核心领导层。\n\n这听起来可能并不那么不可思议。\n\n在许多在原本面向用户的产品上挂载广告业务模式的科技公司里，广告团队往往是公司最薄弱的团队。广告被视为一种“必要的恶”，而营销并不酷，所以那些作为招聘“炮灰”的\
  \ 22 岁天才少年并不会加入其中。远见的 CEO 不在乎钱，只在乎用户体验，并且通过查看使用仪表板而非收入报表来管理。那些能够重新点燃反复无常的 App 使用率的大胆产品计划会被批准，其资源由\
  \ CEO 的行政命令进行分配。与此同时，广告团队就像一个追赶特别任性孩子的保姆，被动地四处奔波，试图将产品开发过程中产出的任何东西变现。\n\n但 Twitter\
  \ 是不同的。广告团队实际上是组织中最具活力、最准备就绪交付且最忙碌的团队。虽然 Twitter 的核心产品多年没有变化，但广告团队一直因定期发布新产品而充满朝气，要么比\
  \ `Facebook` 等竞争对手领先一步，要么后一步，但始终在运转和迭代。他们还说服了公司管理层在广告技术领域进行雄心勃勃（且规模惊人）的收购。\n\n这就是\
  \ Twitter Ads，因此其领导层最终成为公司领导层，尽管在消费互联网公司中这很独特，但并不令人意外。\n\n## 2011 年 3 月 25 日，周五\n\
  \n当 Twitter 向我们寄来那份创业计划中不可或缺的——一份公司级 `NDA` 时，事情真正进入了正轨。这实际上是企业界的 Snapchat 消息模式：你可以看一眼，但这条信息必须有效地从你的脑中被删除（或者至少永远不要离开脑子）。\n\
  \n情况开始变得严肃了，我们需要一位律师。不需要像 `Undertaker`（掘墓人）或 `Wang`（王）那样的诉讼律师——我们不想再测试他们的慷慨程度了——而是一个擅长公司治理这类礼貌工作的律师。\n\
  \n巧的是，在几周前，我曾担心我们的公司文件。注册是我自己完成的，因为那帮哥们在处理租金、工资或任何涉及官僚主义事务的现实交付物时简直是没救了。但当然，我并不完全清楚自己在做什么，只是使用了\
  \ `Y Combinator` 的默认注册表格，并从一家 `Kinko’s` 传真了这一切。整个过程总共大约花了两个小时，从预留公司名称到获得特拉华州（`Delaware`）的确认。如果我们以后进行真正的\
  \ `series A` 融资或被收购，我们的公司事务必须井井有条，否则这种混乱可能会导致交易失败。\n\n在这一时刻发生很久以前，我们非常有幸见到了 Twitter\
  \ 首次收购对象的创始人，那是一家名为 `Mixer Labs` 的地理定位技术创业公司。一位创始人是埃拉德·吉尔（Elad Gil），一位 `YC` 投资者和著名博主，他对早期创业游戏的雄辩且富有见解的见解我经常读之如魔。另一位是奥斯曼·拉拉基（Othman\
  \ Laraki），一位前 `Google` 产品经理，当时是 `Twitter Growth` 团队的成员。他们后来都升到了 Twitter 的高级副总裁职位，而且都是并购（`M&A`）和创业领域精明且经验丰富的运营者。他们还是创业公司社交资本的敏锐交易者，并主动提供时间偶尔为我们提供建议，不涉及任何正式报酬。\n\
  \n从他们那里，我们幸运地结识了米切尔·祖克利（Mitchell Zuklie），他向我们介绍了律师事务所 `Herrington & Sutcliffe`（注：原文此处逻辑可能有误，此处对应翻译）。通过半小时的电话沟通……\n\
  \n\n\n\n所以你可以看到，我们这里存在两种类型的误译：一种是作为外交润滑剂以达成交易的刻意误译，另一种是更严重的误译，它让双方都认为自己同意了完全不同的事情。\n\
  \n硅谷世界几乎是一个完美的类比，而且我们也有自己的交易买办人（dragomans）。\n\n### 沟通的两个渠道\n\n当一笔交易真正启动时，事态就会呈现出某种卡尔沃沃（Le\
  \ Carré）式的间谍戏色彩。交易中，总有两个沟通渠道在运作：\n\n1. 第一种是正式渠道，通常涉及电子邮件和附件文档，参与者从创始人到公司发展发展团队，以及可能相关的产品团队。\n\
  2. 第二种是非正式且秘密的。由于没有更好的词汇，我们称其为“密谋”（scheming）。\n\n这种密谋要么通过电话要么面对面进行，不涉及电子邮件或即时消息。根据法律说明，在加利福尼亚州录音电话是违法的，此类录音通常不能作为法庭证据，除非带有搜查令的刑事审判。因此，当密谋开始时，这个\
  \ 99.9% 通都通过电子邮件、消息和社交媒体等异步渠道进行的初创公司世界突然变得老派起来，所有的通信都是在闭门会议室里通过低声电话进行的。那时你就知道自己真的陷入了某些非常棘劲的烂事中；反之，如果你还在就这事发邮件，那其实并没有什么真正的进展。\n\
  \n另一个渠道部分有点像冷战剧剧，部分又像极了某次你向四年级级级宣布你打算在第六节体育课后亲吻贝基·沃克勒（Becky Walker），以及随之而来的所有八卦和私下交谈。随着事件的进展，这种戏码变得越来越幼稚，最终让你确信——仿佛在你初创事业的轨迹走到现在时还需要更多证明一样——人类即便在经济精英阶层那种云端的高处，本质上也是恐惧的、需要关注的、玩过家家并假装成成人的孩子。\n\
  \n### 科技 vs 华尔街\n\n现在，如果这发生在华尔街并涉及上市公司，并且人们像即将被收购的初创公司创始人、员工和投资者这样参与了一场复杂的、高度选择性的“电话游戏”，在内部信息之间穿梭，意图明显是为了私人获利（无论是实际现金还是仅仅是影响力），我们所有人都会被关进监狱，或者至少被起诉。但从一开始，就很清楚这在科技圈是常态，没人眼睛都不眨一下。你要么参与并在交易中扮演某种角色，要么就不参与，因为你担心违反保密协议被解雇，但无论哪种情况，没有人在这里说教。而且妈的，也没有对其中任何事情进行监管。\n\
  \n### “深度推文”（Deep Tweet）的崛起\n\n鉴于我们正在进入的这种道德明暗对比，有必要在这部回忆录中诞生第一个也是唯一一个复合角色。到目前为止，我们已经点了一些\
  \ Twitter 内部人士，但其他未具名的内部人士也参与了其中。如果每个人都是有罪的，那么就没有人是有罪的。从今以后，任何为了算账、帮助交易达成或出于我们只能猜测的私人动机向我们提供信息的\
  \ Twitter 内部人士或其他利益方，都将被统称为——听好了——的“深度推文”（Deep Tweet）。\n\n是的，深度推文。\n\n深度推文为我们提供了\
  \ Twitter 真实估值的内幕，以及它在何种条件下刚刚筹到了大量资金。我们的股份占总流通股的几比例，董事会的内部运作，以及为什么 Twitter 从外面看最终似乎像这样一个极其肮脏的混乱团（答案是：因为它内部就是一个混乱团）。董事会与管理层之间以及内部的战斗，通常在功能失调的董事会上举行，每位大牌董事成员都带着他的随从出席。埃文·威廉姆斯（Ev\
  \ Williams）和比兹·斯通（Biz Stone）心理上都已经不在状态（事实上，两人都在两个月内离开了 Twitter）。在产品副总裁杰森·戈尔德曼（Jason\
  \ Goldman）离开后，几乎没有产品领导。每家科技公司在经历突如其来的、爆发性的增长时都会经历的各种内部混乱，并勤勉地向外界隐瞒，呈现出一个完美无缺的外部画布，准备让记者们绘制他们纯净的叙事谬误壁画。\n\
  \n### 初创游戏的现实\n\n但公平竞争呢？一位有道德感的读者问道。\n\n遗憾的是，初创公司的游戏并不是按照奎因伯侯爵（Marquess of Queensberry）的规则进行的。初创企业创业者，你是面对歌利亚人的大卫，是\
  \ 1948 年战争期间新生的以色列，是阿拉莫之战的克罗雷特，是塞罗庇之战的斯巴塔人。选择一个你最喜欢的关于绝望的实力悬殊的比喻：那就是你。根据任何理性的衡量，初创公司在开始之前就该死了。所以，如果收购公司某个心不满的内部人士在酒吧里拦住你并开始吐底，你就为他再买一杯啤酒并凑近身体。你需要每一个能获得的优势。\n\
  \n### 中心咖啡馆（Epicenter Café）\n\n作为当地色彩，这些“深度推文”会议实际上在哪里举行？除了上述无法记录的电话之外，我们偶尔会面面。一个会议地点位于哈里森街（Harrison）第三街和第四街之间的\
  \ `Epicenter Café`（中心咖啡馆）。\n\n搞笑的是，它位于一家针对严重精神疾病和药物成瘾者的公共心理健康诊所隔壁。另一边是 `SoMa Whole\
  \ Foods`，那些薪过高的科技宅（包括我这个谦卑的通讯员）在那里吃着昂贵的食物。无论你沿着哈里森街从东还是从西靠近中心咖啡馆，你都会穿梭在那些花六美元买有机芦笋水的初创公司文青人之间，或者是那些认为法国斗犬正在策划杀死他们的银河阴谋的人类碎片之间。通常，由于盛行的“破旧时尚风”（shabby-chic）审美，你无法立即区分科技文青和毒瘾发作的流浪汉。（正如老练的\
  \ `SoMa` 老兵开玩笑说的：流浪汉有 `Android` 手机，而科技宅有的是 `iPhone`。）\n\n中心咖啡馆对“深度推文”有利，因为它是 Twitter\
  \ 的非官方咖啡馆。当时，Twitter 的总部位于福尔斯姆街（Folsom）的餐厅后面。咖啡馆有一个可以直接进入 Twitter 的后门，所以当你到达时，你的联系人就在那里等着。点一些深灵魂的咖啡，在周围敲击着\
  \ `MacBooks` 的典型自闭症人群的包围下，与“深度推文”一搏，讨论你们在科技丛林中的争斗。\n\n\n\n\n\n# 收购大战\n\n我问你们，一个成年男人到处跑跑去击一个球，这合理吗？扑克才是唯一适合成年人的游戏。在那里，你的牌要对抗所有人，而每个人的牌也要对抗你的牌。团队合作？谁曾通过团队合作发过财？致富的方法只有一种，那就是击败与你竞争的人。\n\
  \n——W. 索默特·毛奥姆，“同花顺”\n\n## 2011 年 3 月 27 日，周日\n\n“作为 Twitter 的员工，这不符合我的利益，但我建议你尝试为你的公司举办一场拍卖。”当这场收购派对即将开始时，Deep\
  \ Tweet 在我耳边低声说道。\n\n作为 CEO，我有信托责任为股东获取最大价值，而自然地，我就是其中最大的股东之一。“信托”（fiduciary）这个词很有趣。它源自拉丁语\
  \ `fiduciarius`，意为“约束性的信任”。在法律上，它指的是一方代表另一方行动，拥有完全的代理权并被假定。在实践中，每当 CEO 声称做某事是他们的“信托责任”时，意味着他们正在赋予自己一种坑害某人的道德许可。当然，这正是我准备对\
  \ Twitter 做的事情。\n\n### 我们急了什么？\n\n只要 Twitter 的进展超过了探索阶段，且假设公司真的想要我们，它就会在桌上放出一份条款清单（term\
  \ sheet）。紧随其后的将是一份不招揽协议（no-shop contract），这意味着对公司的任何实际出售行为已完成。不招揽协议是一份单独的合同或是条款清单中的一个条款，规定公司在谈判和尽职调查期间不能招揽其他收购者。这类协议通常为期六十天，在法院是可执行的，有些甚至带有罚金。其点在于，在双方进行严肃的讨价业务之前，让公司的自我推销活动暂停。\n\
  \nDeep Tweet 的建议及时且正确，为了在桌上拥有可以用来对付 Twitter 的实质性报价，我们需要尽快开始这一过程。事实上，我们已经迟了，因为任何其他公司行动速度可能都比这块掉进我们怀里的\
  \ Twitter “礼物”要慢。\n\n我敲响了硅谷的每一扇门，任何我能获得介绍的地方（以及大多数我无法获得的地方），为了推销这家公司。我向 Google 的每一个熟人索要介绍，甚至通过\
  \ Russ 来向他们的并购部门人员推销我们自己。我问了 Sacca，她忽略了我的询问；正如我们后来所知的，这是一个只谈论自己持仓头寸的人。直到最后，尽管我们的整个产品都是构建在其之上，我们连一封邮件回复都没有从\
  \ Google 得到。\n\n我找了微软的初创企业传道士一个名叫 Joel Franusic 的小奇迹创造者，让他引我们进入雷德蒙的收购团队。他们回复了，我们在下周找时间进行了了远程推演。\n\
  \n然后，当然，还有 Facebook。\n\n我没有注意到，我们 YC 批次中的另一家名为 Whereoscope 的公司，其创始人 CEO 现在已经在 Facebook\
  \ 了。那公司开发移动应用，用于追踪你的位置，要么是在社交上与女朋友分享，要么是为了那些偏执的市场群体：例如，青少年的父母。那个 CEO 是一个叫 Mick Johnson\
  \ 的家伙，他在 YC 的巅峰成就是就是在 Demo Day 演讲结束时放了一个自己用空手拳击碎混凝土块的视频。无论外表还是态度，他都让我想起《斗牛士》中年轻的塞尔··克罗斯。（如果你看过这部电影，这应该会引起恐惧。）\n\
  \n我记得某天，Whereoscope 径无踪迹地消失了，尽管当时有关于正在进行秘密交易的传闻。其结果是，Johnson 竟然以一种神奇的方式重新出现在 Facebook\
  \ 担任产品经理。\n\n我给他发了一封邮件，在信中我构思了一个足以引起任何收购公司兴趣的魔力公式：我们“正在进行中（in play）”，需要在 Facebook\
  \ 错过这个绝佳机会之前，与相关产品团队的成员交谈。他向我介绍了了广告界的巨星 Gokul Rajaram，这个男人以不止一种方式影响了我的生活。\n\n##\
  \ 2011 年 3 月 29 日，周二\n\n场景：埋在 Twitter 某处、一个令人幽闭的狭小的会议室里。Jess Verrilli 和 Kevin Thau（Twitter\
  \ 业务发展副总裁）坐在我的对面，看起来有些尴尬。我预料会有坏消息。\n\n情况如下：\n\nChris Sacca 凭借他无限的交易智慧告诉他们我们有另一份正在进行中的报价，这是一个赤裸裸的谎言。但如果\
  \ Twitter 给给我们一份条款清单，我们绝对可以变幻出另一份报价。所以你看，这并不是真的一个谎言，而仅仅是一个尚未完全出生的事实，只需要接收者的轻信就能使其成真。“Fake\
  \ it till you make it（假装成你做得到，直到你真的做到了）”是硅谷被反复提到的格言。\n\n结果，Twitter 觉得屁股后面着火了，必须达成一项交易。我给他们读了那份备忘录（灵自\
  \ PG 对潜在收购的蔑视邮件），除非条款从一开始就具有吸引力，否则我们甚至不愿接受收购的“肠造瘘术”。因此，在我在上周三与 Adam Bain 的那场兄弟情般的约会之后，我规定需要尽早看到条款清单。Jess\
  \ 实际上承诺在周五提供一份。\n\n但 Twitter 并没有交付。我们得到的只有一份触发了电话会议的非保密协议（NDA），除此之外再无他物。我去向 Sacca\
  \ 诉苦，她承诺 Twitter 会很快生成一份条款清单。她做出了非常生气的样子，并誓会给我回复。\n\n在打了 Sacca 电话后在巷子里徘徊时，我环顾四周，确保没有我认识的\
  \ Twitter 员工在附近，并查看了邮件和日历。\n\n前一天，Facebook 发来邮件，提议我们过去见见他们广告团队的一些成员。这将是一次正式的推演。Mick\
  \ 对 Gokul 的介绍取得了成果。Gokul 的助理今天早上确认了会议：我们定在明天下午。\n\n我要确保 Twitter 这次真的得快起来了。我沿着第三街向南走，这条路正成为\
  \ Twitter 和 AdGrok 之间频繁往来的路径。\n\n五百万美元！想想看吧。一笔巨款。\n\n但真的吗？\n\n\n\n\n在诉讼之前，我们一直在以\
  \ 400 万美元的上限（即名义估值）进行融资，即便在这笔交易进行期间，刚结完训练营的 YC 公司融资额也超过了 500 万美元。当时硅谷被收购工程师的市场价格在每人\
  \ 50 万到 200 万美元之间。这指的是（可能）四年的总股权归属。而那 90,000 到 150,000 美元左右的工资仅够付房租和买啤酒，并不包含在报价的总额内内。\n\
  \n因此，用 500 万美元换来三名员工加上 Twitter 可能用到的知识产权，再加上 YC 光环加持以及通过我们那辉煌的博客所展示的“思想领导力”溢价，这实在太便宜了。我们冒了从财务状况到精神健康的所有风险，就为了每人多出一百万，而这还是需要四年才能赚够的钱。\n\
  \n但我可以想象出那几个男孩消化这份提议的样子，可能身边还围着各自的哥们。他们对此会有完全不同的看法。\n\n对于 `Argyris` 来说，这意味着考虑在雅典的公寓，以及他想和新妻子\
  \ `Simla` 一开一家咖啡馆兼黑胶唱片店的幻想。他本身出身于富家，但这意味着他在毕业后不久就能实现自己的财务独立。\n\n对于 `MRM` 来说，这意味着还清房贷，不用再为孩子的空道课程费用发愁，更不用说以后的大学补助了。这将是在他漫长、辛苦但并不特别丰厚的职业生涯中获得过的最高收入。`AdGrok`\
  \ 最初几个月的无薪月份已经耗光了他仅有的那点积蓄。这会改变一切。\n\n### 关于我们的投资者，他们的数字是多少？\n\n在我们绝望且估值过低的种子轮融资中，我们实际上向他们卖了公司\
  \ 22% 的股份。假设按比例分配交易，他们将获得大约 100 万美元的税前。考虑到他们投资了不到 50 万美元，这意味着是 100% 的回报。他们在短短六多个月内让资金翻了一番；对于任何诚实的人来说，这都是笔可观的钱。\n\
  \n然而，我们的一些投资者的看法完全不同，这些原因凸显了我早之前划分的旧派天使人和更现代的微型 VC 版本之间的区别。对于 `Russ` 来说，他投资的是自己的钱，本质上像一个扑克厅里精明的赌徒一样在玩这类人的市场，这是一份很棒的回报。他会拿走现金（如果最后拿到的是\
  \ `Twitter` 的股票），可能把它们卖掉，然后投资其他公司，以此增加回报，同时也也会遭受偶尔的亏损。\n\n`Sacca` 对潜在交易持有完全不同的态度。这就是为什么\
  \ `Sacca`（或任何真正的 VC）会迫使你模仿他自己那种扭曲的风险偏好——这种偏好倾向于十倍回报，即使这会略微增加完全失败的机会。对于有限合伙人来说，两倍回报根本不够酷，这不正是他们起初把钱交给\
  \ `Sacca` 的原因。\n\n创始人和投资者的风险预期往往会产生严重错位。我讨厌体育类比喻，但这里有一个比喻可以解释这个至关重要的点：大多数 VC 玩的是一种版本的棒球，其中唯一的得分方式就是在你击球时击出全垒。他们不在乎你是否因三振而丢脸或陷入贫困，他们不在乎你是否击出一个稳健的平击球让你上二垒。对他们来说，三振和上垒同样毫无意义，因此无论球数如何或对手是谁，他们都会促使你进行所谓的“为了全场挥击”。\n\
  \n这种“全有或无”方法的原因在于他们基金的结构。VC（或像 `Sacca` 这样所谓的天使）募集一笔基金，从中拨出若干项投资。除非对同一家公司进行加注（如果公司再次融资时基金里还有钱，他们可能会这样做），否则这些投资实际上是“投出去后就不管了”的。基金的总利润将根据那些最初注码的回报来计算。不像对冲基金组合经理（他们会将一笔好注的收益滚入下一笔注中，将一系列收益复合成真正巨大的数字），VC\
  \ 并不会从一家公司的退出中提取流动性并将其投入到另一家公司中。从本质上说，这就是为什么“要么大干要么回家”的策略让硅谷世界运转起来，以及为什么企业家们迫使自己成为下一个\
  \ `Airbnb`，要么一无所有。那些违背这一点、创造了具有经常性收入但增长相对缓慢的长期业务的企业家会被贬低为仅仅经营“生活方式业务”，这在 VC 圈是一个脏词。当然，企业家们非常乐意经营一家产生收入并以低税红利形式产生现金的企业，并将一生奉给滑雪、吉他或任何事情。但他们的投资者会因此恨恶他们，企业家也会因此遭受社会资本的损失，并可能发现自己无法为下一个项目筹集资金。\n\
  \n就个人而言，我非常高兴 `Sacca` 以机构投资者的身份会几乎不可避免地反对这笔交易，并成为我的大棒，逼着那几个男孩拒绝它。当时我可能甚至无法从自己身上掏出\
  \ 5,000 美元的个人资金，但对于一家由三个人和一堆代码组成的只有九个月历史的公司来说，500 万美元显然不够。这个阶段公司的市场价格远高于此，而这个小的前高盛量化分析师只以市场价或更优的价格出售。\n\
  \n单凭我一个人，我斗不过那些男孩*以及* `Russ`。但 `Sacca`——那个大嗓门的、有主见的 `Sacca`——会说服他们放弃。\n\n### 获得喜爱\n\
  \n你们要派人去探查我赐给以色列子民的南地；从他们各支派中派一人，每人在他们派中作首领。\n\n——数记记 13:2\n\n#### 2011 年 3 月 30\
  \ 日，周三\n\nFacebook 总部的入口处滑动门上写着 `HACK` 字样，就像大教堂的门楣浮雕，但那里不是基督审判或最后的晚餐，而是一个创作和构建的指令。\n\
  \n建筑本身是一个通用的商业空间，与遍布在南湾的所有其他统称为“硅谷”的大型仓库/办公室并无二致。\n\n一旦进入 `HACK`，右侧的一个平板屏幕会显示全球\
  \ Facebook 好友活动的实时动画。每当有人在 Facebook 上接受好友时，一条细白线就会连接两个朋友的位置。地球图像看起来就像有一群异域蜘蛛在地球上织了一张网，而这张网每几秒钟就会重新织一次，持续永恒。\n\
  \n\n\nGokul 的管理员带领我们穿过了一个看似建筑中心的中殿，那是一条宽敞的画廊，错落着一排排办公桌和相邻的（还能什么？）Aeron 椅子。右侧是“Facebook\
  \ 墙”，那是一个不断滚动的访客签名墙，字密到几乎变成了一片纯黑。嵌入中殿后部和侧面的高窗，以及通用的白色墙，让空间显得明亮通透。光面混凝土地上铺设的橡胶地砖让这里感觉像是一个它可能真的是半完工的工厂空间。\n\
  \n加入我们队伍的最重要人物是 Amin Zoufonoun，他是 Facebook 的企业发展负责人。他刚从 `Google` 被挖角过来，这是他在 Facebook\
  \ 的第一周。作为一名老练的交易手，他在 Google 做过几十笔甚至上百笔交易，而那里是硅谷产出率最高的买方公司。\n\n同样重要的是这次会议的官方东道主金康兴（Kang-Xing\
  \ Jin），他是 Facebook 的老兵，于 2006 年加入，当时还有一群哈佛毕业生也加入了这里，他们是被劝离开辍学扎克的母校的。目前他是 Facebook\
  \ 广告的工程经理，尽管我们当时并没有完全意识到，他是 Facebook 货币化的关键人物。\n\n“叫我 KX，或者叫‘Kon-Sin’，就像我家乡康康斯星州，”他提议道，露出那种转瞬即发的微笑，这种笑容会从本无表情的脸上迸发。我猜他最多只有二十多岁，身材消瘦，戴着方形丝框眼镜，眼神犀利。\n\
  \n房间里的其他人还包括 Ambar Pansari，`Ads API` 的产品经理，该领域是 Facebook 团队与我们这种广告购买工具最相关的领域。在场的还有\
  \ Nipun Mathur，Facebook `API` 计划的产品营销经理，我之前曾多次尝试从他那里套取 `API access` 权限。\n\n准备工作很短。我钻进会议桌中心的一个凹槽隔层，那里的\
  \ `Mac chargers`、`Lenovo chargers` 和投影仪电缆像老鼠窝一样一团乱麻地缠在一起。每个视频输出插头的适配器都用扎带固定在 `cable`\
  \ 上，以防止它们被带走。\n\n找出正确的一个插进我那台贴满 `ADGROK-sticker` 的 `Mac`，我开始了早已排练就的演示。我们精美的折线图瞬间加载，Google\
  \ 关键词及其出价和相关的广告素材渲染得完美无缺，我从容地导航过一个合作伙伴网站，该网站通过销售昂贵的手机壳赚取数百万美元，我几乎背下了他们的在线目录。他们看起来确实留下了深刻印象；KX\
  \ 特别兴奋。满场欢笑声，房间里充满了那种小组刚分享完一个好笑话或喜欢的旧故事后略微节日的氛围。\n\n团队中的一个成员问我们打算如何在 Facebook 内部使用这项技术——就在这时，Amin\
  \ 戳破了这种不断升温的赞爱泡沫，提到我们之所以来是因为我们有外部的兴趣。他没多说，直接出来询问我们还在和谁交谈，直直盯着我，我后来意识到那是他的“职业脸”。这很有趣：KX\
  \ 的神情在严肃的专注中会突然转为轻浮，而 Amin 则恰相反：亲切愉快的神情会突然转为深不可测的算计。\n\n“我想你可以猜到是谁，Amin。”我指了指屏幕，屏幕上\
  \ `GrokBar` 内部仍然闪烁着 Google 关键词。\n\n“啊……” 他挑了起边眉毛。\n\n“不过 Amin，像你一样，我们也想成为未来的一部分，而不是过去，”我说，指代他离开山景城那家小搜索公司才仅仅三天。\n\
  \n他的表情恢复了交易手那种刻意的亲和力。\n\n他吞下了我随口抛出的诱饵。他以为我们手里有来自 Google 的诚意报价。我很想声称这是某种精明的预设行动，但事实上，这完全是随兴之举，仅仅基于一种偷偷的怀疑：虽然公司\
  \ X 可能害怕 Y，而 Y 害怕 Z，但科技界的每个人都害怕 Google。\n\nAmin 最近从这家搜索巨头加入 Facebook 有一个重大原因：每当有人（特别是像\
  \ Amin 这样显然是被挖角的高管）离开公司去竞争对手那里，他会留下一股霉运连连的气味。他前团队的每个人都提着警心，至少在前几周内不太可能参与那种通常联系跨越工作和公司的非正式信息共享。结果就是，Amin\
  \ 在 Google 没有了后渠道，而且对 Google 到底在做什么（或没做什么）基本上是盲目的，因为那里没有人会和他保持交谈。这让他很容易受到像我们这种整个产品都建立在\
  \ Google 之上的公司的赤裸裸的欺骗。我那的一句随口说的话，可能对随后发生的事情负有一半责任。\n\n表演结束，小组散开，每个人都走向自己的下一次会议。Amin\
  \ 在出去时把我拉到一边，向我保证很快会联系。\n\n在加利福尼亚大道，距离 Facebook 的 `HACK` 大大约一百英尺外，团队在 `AdGrok Mobile\
  \ Conference Room`（即 MRM 的本田 Accord 内部）重聚。我们欠 Sacca 一个电话关于 Twitter 的口头报价。我建议不要向\
  \ Sacca 提到我们两分钟前开过的 Facebook 会议。\n\n从样子看，Sacca 不仅仅是这笔交易的单纯顾问，他将成为一个真正的玩家，推动事情向一方或另一方发展（无论好坏）。从他对\
  \ Twitter 的极力支持来看，显然他正在引导我们达成某个结果，如果他知道 Facebook 的事，老天知道他会让自己陷入其中。Facebook 有半数员工是来自\
  \ Google 的，他可能认识其中的很多人，因为他自己也是一名知名的 Google 员工。\n\n\n\n\n\n交易的风波暂时平息，我们都回了办公室。那天晚上我写了三封邮件。第一封是写给\
  \ `Sacca` 的卑微且充满歉意的邮件，向他保证我并没有参与这笔交易，而且我们一定会拒绝它。我还为那几个男孩辩护了他们，我觉得 `Sacca` 对他们进行了不公平的批评，并指出他们是出色的建造者，但不是扑牌玩家。\n\
  \n其次，我给 `Jessica` 写了一封冗长且充满外交辞令的邮件，表示我们对 `$5 million` 价格的交易不感兴趣。我带着许多 `voulez-vous`（你愿意吗）的意味，礼貌地提醒她我们有工作要做，我们无法负担交易讨论所带来的干扰。\n\
  \n最后，我给 `Facebook` 写了信。\n\n那天晚上，`Amin` 如他承诺那样发送了邮件，向我介绍了他负责交易的下属 `Dale Dwelle`，后者将负责后勤工作。我们已经过了第一道障碍，`Facebook`\
  \ 对团队和产品留下了深刻印象。这一天是成功的。由于他们理解我们对另一笔未命名但被暗示过的交易的紧迫需求——明确一下，那是我刚刚拒绝掉的那笔——他们将致力于加快他们的收购流程。我们是否可以在周五，即在不到四十八小时内，进行一整天的面试？我回答说可以，并要求提供关于面试官的更多信息。我们必须像对待\
  \ `Twitter` 那样对他们进行全面的尽职调查，再次冲锋吧，亲爱的朋友们，再次冲锋——这次是为了 `Facebook`。\n\n## 被戳了（Getting\
  \ Poked）\n\n如果你只能擅长一件事，那就擅长撒谎……因为如果你擅长撒谎，你就什么都擅长。\n\n—@gselevator, 2013 年 7 月 25\
  \ 日\n\n## 2011 年 4 月 1 日，周五\n\n想知道被 `Facebook` 这样的公司收购是什么体验吗？\n\n它是这样运作的：\n\n由于这种早期的“收购性招聘”（acqui-hire）与其说是“收购”不如说是“招聘”，`Facebook`\
  \ 在乎的每位员工都必须经过普通的招聘筛选，就像你单个人申请时会经历的那样。你们作为一个整体出现，这一事实只是改变了经济效益。我们过去曾有工会，会给工人一种被称为`集体谈判`的魔法东西。现在，成为一家热门的初创公司就是你的工会，唯一需要的会费就是你在初创公司期间的整个生命。欢迎来到我们新的集体主义，同志（tovarish）。然而，通过将人才打包，你仅仅由于杠杆作用就掌握了溢价——不喜欢价格？那我们都不在桌面上。\n\
  \n你们那些没在睡觉的人可能会问：如果你们中有些人在面试中表现良好，而另一些表现不好呢？嗯，你们跳得太快了。让我们看看 `Groksters` 如何。\n\n\
  当你收到由任何管理后勤的 `admin` 发来的面试邀请时，务必提前一天索要面试官名单，这样你就可以完成本该做的“书管理员之子”式的作业——即跟踪每一个面试官。\n\
  \n### 为什么呢？\n\n就像任何面试一样，无论是硬核的技术/工程面试，还是那种花哨的产品经理面试，挑战都非常简单：要么你无能，挣扎着无法为面试题提供一个你希望是正确的答案；要么你并不无能，你的大脑会产生两个或三个答案。取决于你的面试官，其中每一个都可能是正确的。真理在世界上只存在于数学证明和物理实验室。在其他任何地方，这实际上是一个观点问题，如果它演变成集体意见，它就会被名不其实地冠以大写的“真理”之名。因此，你需要确定你所处环境的局部真理是什么。你通过观察肢体语言并理解你的对手浸泡在其中的智力调料（如果有的话）来做到这一点。记住这一点，你从你可以抛出的三个备选答案中做出选择。\n\
  \n再停顿解释一下，然后我们继续。\n\n这些面试还有另一个更微妙的目的。如果你获得了一份被你接受的工作，那么那天与一排“折磨者”度过的一天实际上是一种入会式的磨练仪式，就像施给想要加入帮派成员的集体毒打一样。这很奇怪，但你会对那段经历产生某种依恋，它是对你在最终工作中取得成功所需的团队建设的快速启动。面试官将永远记住他或她帮助引进了一位最终成为宝贵员工的人。公司也会关注这种经历，并试图在挑战与追求之间找到微妙的平衡，以吸引最优秀的人才。许多人在面试后会写博客文章，剖析\
  \ `Apple`、`Google` 或 `Facebook` 等旗舰公司的各种怪癖，以及它们是公平的、残酷的还是仅仅随机的。在许多方面，面试过程就是公司的门面。\n\
  \n## 开始表演。\n\n我的第一个面试官是 `Alon Amit`。他是以色列人（显然的），在加入 `Google` 最终加入 `Facebook` 之前，他在耶路撒冷获得了数学博士\
  \ `PhD`。就像每个三十多岁的以色列男性一样，他矮矮、秃秃、身材魁梧，面无表情，像胶合板一样坚硬。不过，正如大多数以色列人（sabras）的典型，当我表现出任何不是笨蛋的迹象时，他热和了起来。他建议我们去外面面试，于是我们并排坐在长椅上，心不在焉地盯着\
  \ `Facebook` 后院里那个看起来很惨的排球场，那里似乎没有人用。\n\n接下来是 `Rohit Dhawan`。另一个 `Goler`（以色列人俚语），他有着那种打理得非常体面自信的气质，像是一个认为自己已经精通所在领域的人（当然，他是\
  \ `Penn` 的毕业生）。他的切入点是分析能力，他问了我一个经典的 `Enrico Fermi` 脑筋急转弯，关于芝加哥的钢琴调。他的版本是估计空中有多少飞机。这只需要对机场数量和每天的航班进行粗略假设，然后通过量纲分析得到接近现实的一个数量级，我们在十分钟内就搞定了。\n\
  \n为定量科学背书：现实是，大多数人类都能维持食物、穿衣和娱乐自己，却无法制定一个经得起知人士审查的理性论点，无法推导出三段论的结论，也无法理解数学证明。在任何定量领域进行高级学习，就像在其他人都在换频道和吃奥利奥时，你在海军训练营中生存；你并不需要担心俯卧测试。即使当智力测试被用作全球科技公司精英阶层的筛选时，只要你理解问题空间，你就不会落伍。因此，即使别的无，准的物理学家或数学家，请放心，你知道走出那漫长的学术隧道后，你将完胜大多数人。\n\
  \n在剩下的半小时里，我们坐在会议室的两张易椅上，讨论了 `BMW` 以及 `3 系`与`5 系`的相对优缺点，以及 `M 级` 升级是否真的值钱（我的观点是：值得）。\n\
  \n下一个是 `Jared Morgenstern`。这是我第一次接触到真正的 `Facebook` 老兵。他是一个 `哈佛` 人，像最初团队的许多成员一样，他在一家大公司收购了他的初创社交媒体网站后，由于收购后的无聊在\
  \ `2006` 年加入了 `Facebook`。`Mark` 诱使他成为 `Facebook` 设计团队最早的成员之一。他身材修长且结实，他一话不发地走进房间，要求我为\
  \ `Facebook` 设计一个音乐应用。尽管我的设计感仅限于早上挑选两只大致不相干的袜子，但我设法地混过了关。\n\n\n\n\n\n作为一项随机的智力测试，他接着让我解释那种允许两部手机在同时摇动时相互通信的配对应用是如何工作的。他在简历上看到了物理背景，想以此考察我的智力水平。一如既往，你如何推销自己，决定了别人如何买单你。这个问题很容易，而且和\
  \ Rohit 一样，面试很早就结束了。\n\n我当时只是模糊地意识到，每场面试都是为了测试理想中 Facebook 产品经理的一项典型技能。在这个“十二宫位”中有五个种迹象。我刚通过了“设计师”类的一关，还有几个关要过。\n\
  \n和每场面试一样，招聘人员在准时出现，并带我走向另一个房间。这种房间的频繁变动我归咎于最后一刻的安排。在房间之间的空隙，我观察了周围环境。对于这样一家处于后期的公司来说，这里看起来、感觉起来（以及闻起来）仍然像\
  \ `AdGrok` 那种初创期的临时拼凑设备：通用的办公桌杂乱无章地推在一起组成岛，电缆到处都是，咖啡盘里残留着食物，有污渍且破旧的地毯，到处散落着滑板、速力枪和各种男童，看起来像私人团队酒吧的地方堆放着酒瓶。整个地方看起来就像公然违反了职业安全健康条例（OSHA）。并不是我有什么异议。\n\
  \nJustin Shaffer 是下一个审问者。他比我高，大概有六英尺四，留着一头浓密的卷发和三天的胡渣，他与我握手，在他屁股坐到椅子之前就开始问我关于 `AdGrok`\
  \ 的问题。有多少用户？收入情况如何？你们在优化什么？后续步骤是什么？就是如此……感觉我就像又在向一个一个人的风险投资人推销，不得不重新推销整个创业项目（我确实是这样）。\n\
  \n随着“水刑”的持续，我开始注意到一种闻起来像劣质古龙水水的傲气气息。我后来才意识到，我闻到的是他那种“扎克的朋友 (FoZ)”的身份，而我显然对这种身份基因性过敏。事实证明，某些过敏在接触后会恶化。\n\
  \n但他看起来头脑很敏捷，并问了一些关于“创业福音”的标准问题，而我像圣经学者一样背下了这些内容。根据我面试前的调查，他本人几年前被收购入职，而且还是来自大大棒联盟（MLB），是跨大陆招募的小型但不断增长的纽约\
  \ Facebook 团队的一部分。他的问题列表结束了，我们都以每小时 120 英里的速度交谈，这场自尊自意的斗争在半小时内结束了。“聊得很愉快！”他宣布道，然后冲出了门外。\n\
  \n回想起来，我意识到他在嗅探硅谷最模糊、也无疑最令人心虚的概念之一，即“文化契合度”（cultural fit）。文化契合度就像天主教三位一体中的圣灵，是那种神秘的无形的东西，难以构想，更不用说定义，但对于科技公司的工作至关重要。理论上，它衡量的是候选人在协作方面、产品开发风格以及总体目标（“一个更开放、更连接的世界”）方面的价值观与公司价值观的匹配程度。由于在大多数科技公司自我膨大的观点中，他们的企业“文化”是独特的，价值就像一个未曾接触的亚马逊部落一样，因此它被誉为支撑他们高昂估值的精确基石。因此，候选人与该文化的契合程度极其重要。精通\
  \ `C++` 编程语言是不够的——你还得在思想和精神上成为我们的一员。\n\n但实际上，通常是这样：\n\n*   一个会破坏你每周欢乐时光气氛的女性候选人？——“文化契合。”\n\
  *   一个说话轻声的印度或中国工程师，安静且有能力，但缺乏美国人几乎像穿蓝牛仔一样普遍具备的那种激进的自恋？——“文化契合。”\n*   一个来自你从未听说过的破烂大学的自学少年，没有从哈佛或斯坦福获得那种云淡风轻的自带优越感的光环？——“文化契合。”\n\
  \n事实就是如此。\n\nShaffer 机关枪般的提问和傲慢让我乱了阵神。我怀疑自己没有通过他的筛选，我需要清醒一下头脑。这一天全是在狭小、灰色、发臭的房间里的一系列审讯。关塔河摩式的氛围让人精疲力竭。尽管签到时有国家安全局\
  \ (`NSA`) 级别的安全检查，而且我们像谁也丢不掉的烫陷阱土豆一样被递交，但下一场面试没有人出现。显然没有大餐可吃，我走开试着找点东西吃。\n\n走在腐臭发烂的地毯上（看起来最后一次清理还是在里根政府时期），我找到了其中一个微型茶水间。架子上的唯一看起来像真食物的东西是一罐\
  \ `Campbell’s 鸡肉汤`，我打开它，倒进咖啡杯里，放进微波炉。我干掉了那团温热的糊糊，然后去了男厕所，方便的是，它就在我的“汤水食堂”旁边。直奔小便池并拉开拉链；释放膀胱，并想着菲德尔·卡斯特罗的脸。在进行这一切时，我注意到背景中笔记本电脑键盘的敲击声。这是一个微型浴室，布局幽闭，每个只有两个马桶、洗手池和尿池。一个隔间里的人正裤子褪到脚踝，屁股坐在马桶上，对着笔记本电脑飞速敲击。这不是在和女朋友聊天。不。这是整整二十秒钟的疯狂打字，然后是两秒钟的思考停顿，又是几行文字的写就。\n\
  \n我完成了自己的任务后，走向洗手池。水龙头旁的两个大桶装满了一次性牙刷和小管牙膏。我瞥了一眼垃圾桶，发现了几个被丢弃的牙刷包装。*它们确实经常用。*\n\n\
  留意时间，我回到会议室/审讯室，等待我的最后一位面试官。结果是 Gokul 本人。在那个时期，Gokul Rajaram 是广告技术领域传奇的幕后操手。作为所谓的\
  \ `AdSense` 教父，Google 在 `AdWords` 之后的次要金矿，Gokul 是各大会议的的常客，也是几乎每一个值得讨论的科技公司的顾问或投资者。\n\
  \n他本人也是通过小型收购入职进入 Facebook 的，尽管那实际上只是他在 Google 工作和进入 Facebook 之间的一次职业休整。毕业于印度理工学院\
  \ (`IIT`)，随后获得美国 MBA，他是那种标准的印度技术人员，也可能是该国除钢铁和塔塔之后最有价值的出口。\n\n“如果我们雇佣你，你对 Facebook\
  \ Ads 修改的第一件事是什么？”Gokul 的开场像朝鲜外交官那样圆润和铺垫。\n\n“我会建立一个转化追踪系统。难以置信你们竟然还没有。”\n\n转化追踪系统是一种软件，可以告诉你广告是否在驱动转化（或营销术语中的“销售”）方面起了作用，并让你能够根据性能调整营销活动。一个没有转化追踪的广告系统就像一辆没有后视镜的汽车；不，它像一辆甚至没有后窗或侧窗的汽车。你只能向前看，快乐地行驶，甚至不知道身后发生了什么，或者你刚刚撞了什么。这对自己和他人都是危险的，而且\
  \ Facebook Ads 管理层是如此脱节，这件事竟然从未被优先考虑。\n\n从 Gokul 的微笑来看，结论显然是 . . . 正答案！\n\n\n\n\n\
  对话就此继续，涵盖了 Facebook 广告系统的各种潜在方面，以及公司需要构建的内容。\n\n是那个神致洋溢的 `Gokul`——我很快发现他几乎总是这种神情——送我出了大门。我和伙伴们是分别到达的，本以为会在不同的时间离开，也各自回到了\
  \ `GrokPad`。在那里，我们对比了笔记。`MRM` 和 `Argyris` 对这次经历的评价并不算高。事实上，很明显，这家公司散发出的那种法西斯式的氛围让他们非常反感。从我们访问他们的开发者活动起，无论是作为产品还是作为公司，他们从未真正喜欢过\
  \ `Facebook`。一整天的霸凌并没有对他们产生任何好感。\n\n# 分叉路径的各种未来\n\n天国好像君王为儿子预备了婚宴……但当王进来看客时，他发现那里有一个没有穿婚礼礼服。他问：“朋友，你没穿婚礼礼服是怎么进进来的？”那人哑口无言。于是王对仆人说：“把他的手脚捆起来，丢到外面的黑暗里，那里有哭泣和咬牙。”因为被请的多，被选的少。\n\
  \n——马太福音 22:2, 11–14\n\n## 2011 年 4 月 5 日，周二\n\n千万美元。\n\n`Twitter` 正式回到了赛场。他们终于带着一份真正的报价回来了。虽然我们还没有看到正式的条款清单——而魔鬼隐藏在细节之中——但显然，`Twitter`\
  \ 现在正处于 2011 年科技泡沫的（不）理智范围内。我们的拖延策略奏效了。即使是我和 `Sacca` 也无法否认这不是一个极具吸引力的报价。\n\n当我正处于那种兴奋的顶点中时，电话响了。\n\
  \n“你好，Antonio！”\n\n那是下午六点半，这是期待已久的 `Amin` 打来的电话，汇报我们在 `Facebook` 那天如地狱般的面试情况。\n\n\
  “所以，我和工程师们谈过了，我们有了最终反馈。”\n\n在 `Aaron Sorkin` 改编的这个故事电影里，这时小提琴应该开始拉响那种营造紧张感的哀鸣了。\n\
  \n“我很抱歉告诉你，我们不会继续推进 `AdGrok` 的交易。对 `Argyris` 和 `Matt` 的反馈褒贬不一，我不认为现在可行。”\n\n“妈的！”\n\
  \n创业者，就在你那满是伤痕的脸上再挨一脚吧。\n\n“为了 `AdGrok` 的考虑，你能告诉我具体的反馈是什么吗？”我结结地问道。\n\n`Amin` 语气变成了那种人们常用的、略微压抑且紧张的密谋口吻，仿佛躲在灌木丛里，而实际上我假设他正坐在一间闭门会议室里。他开始进行一些免费的翻译。`Argyris`\
  \ 本是一个可能的人选，但 `Matt` 绝对被否了。显然，`MRM` 是一个才华横溢的工程师，但 `Facebook` 对工程卓越有非常具体的观念。此外，还有一点模糊的“文化契合度”阻碍。\n\
  \n在这一整天的面试之后，我本以为 `MRM` 和 `Facebook` 的相处会像伯克利的嬉皮士和海军陆战队侦察狙击手一样困难，事实我是对的。\n\n“听到这个消息很遗憾，`Amin`。感谢你以及\
  \ `Facebook` 各位的时间。”\n\n“等一下。虽然对工程师的反馈是那样，但对你的反馈不同。我们希望你加入 `Facebook Ads` 团队。你的表现非常出色，每个人都觉得你是一个极有力的候选人。”\n\
  \n我的大脑在这一刻卡顿了一下。有疑虑时就装作深沉。\n\n“额……`Amin`，正如你所理解，我对 `AdGrok` 和我们面临的另一笔交易都有一定的承诺。我得考虑一下。”\n\
  \n“你考虑考虑吧。但再次强调，我们真的希望你来 `Facebook`。”\n\n我抬头看向我们带窗户的办公室。为了寻求隐私，我特意把自己隔绝在阳台上。`Argyris`\
  \ 在里面，忧心忡地皱着眉看着我。他渴望答案的程度和我一样。我比起两个手指，口型示意“两分钟”，表示我还需要一点时间。他点了点头，回到了屏幕前。\n\n我妈的该怎么办？我不能告诉伙伴们这些，至少现在还不行。\n\
  \n我悄悄地假装在调整手机，挂了电话并拨通了 `British Trader`。虽然我在几个月前就搬走了，我们已经正式分手，但我们仍保持定期联系。你不会仅仅切断和孩子的母亲的联系，而且她还想听听\
  \ `AdGrok` 的故事。\n\n“嘿，怎么了？”\n\n“听着，`Facebook` 不要那几个人，但他们想要我。`Argyris` 在这里。我不知道该怎么办。”\n\
  \n作为一个石油行业的女性，`British Trader` 完全不在科技圈，对其中的复杂性知之甚少。但她对职业环境下的人性有敏锐的洞察。此外，考虑到我完全缺乏大多数人类边界或道德，她对我的行为提供了一个主流的理智标准。\n\
  \n“别告诉伙伴们。这会摧毁他们的信心。你得想办法处理好。”\n\n我们来回回，我描述了更多细节，她分享了她的看法。\n\n我看了表。快晚上七点了。几分钟后，`Argyris`\
  \ 就会飞快地离开去和 `Sim` 度过共时光。\n\n\n\n\n这里有另一个数据点供你参考：为了争取 Facebook，我几个月来一直在关注该公司的 `Google\
  \ Alerts`。其中一条特别引起了我的注意。2010 年 10 月，佛罗里达州的一位母亲因为婴儿哭闹干扰了她的 `FarmVille` 游戏，将婴儿摇死了。一位母亲亲手摧毁了她生来被设定去爱的东西，只为了继续响应由某个愚蠢游戏触发的\
  \ Facebook 通知。那些让母亲为了更频繁使用它们而杀害婴儿的产品（假设它们是合法的），在这个世界上是不可能失败的。Facebook 就像合法的冰毒，而且是互联网规模的。这样的公司当然能想出各种卖鞋的方法。Twitter\
  \ 倒挺可爱的，但它还没有产生伤亡率，无论那个叫 Lady Gaga 的人发了多少推。\n\n就选 Facebook 吧。\n\n但 Twitter 为 `AdGrok`\
  \ 给出了实力的报价，而 Facebook 还没有对任何东西给出过实力的报价。\n\n是那些办公室装修华丽却混乱无章的文青，他们自行车架上放着几千美元的单车，还有那个“失败之鲸”？还是那些身负帝国使命、穿着连帽衫、边拉屎边写代码的兄弟会？到底是哪一个？可能两者兼顾吗？\n\
  \n关于科技生活的另一个真相：任何声称硅谷是精英治学的人，都是那些通过非精英手段（如偶然性、加入特权群体的身份，或是某些隐藏的绝对行诈行为）从中获得巨额利润的人。由于运气从未站在我这一边，我也没有特权群体可以依靠，那么只能靠行诈了。\n\
  \n管理一桩涉及 Facebook 和 Twitter 的合并交易，就像试图让一个早泄症和一个冷感女性同时达到高潮：几乎不可能，处处充满危险，并且需要一双极其稳健的手。\n\
  \n我们在之前的叙述中提到过 Mick Johnson。他的公司曾属于我的 `YC` 批，并在几个月前由于神秘原因消失了，随后 Mick 奇迹般地重新出现在了\
  \ Facebook 内部。他最初对 `Facebook Ads` 的引荐开启了这出肥皂剧的序幕。\n\n我们都喜欢米芽啤酒，所以在 `Creamery` 喝着几杯\
  \ `Lagunitas` 时，他分享了他的公司发生的内幕。\n\n他和他的澳洲联合创始人 James 有很长的合作历史。他们钻研移动端多年，试图找到一些能留住市场的东西。在每月赚\
  \ 2000 美元（或更少）两年后，James 不干了。他正准备和女朋友认真发展，并且厌倦了创业公司的工作。他们同意公司必须卖掉。于是 Mick 鼓起勇气投身人才收购市场。他们向所有人推销自己，与\
  \ Twitter、`Zynga`、`Google`、`Facebook` 以及较小的公司经历了 `M&A` 流程。\n\n他们在 `Zynga` 和 Twitter\
  \ 那里进展最快，Twitter 甚至对整个公司给出了直接报价。Mick 对 Twitter 并不感冒，不想去那里。Mick 动用一些关系后，在 Facebook\
  \ 获得了一次引荐。Facebook 让 Mick 和 James 经历了 `M&A` 的重重考验，最后给出了一个仅针对 Mick 一人的报价。`Zynga`\
  \ 也给出了报价，但是针对整个公司的，这使得严肃竞买者增加到了三个。听起来熟悉吗？\n\n随后发生的是一场极其复杂的讨价还价，足以让索马里海海盗的赎金谈判显得井然有序。这一切的最终结论是：Mick\
  \ 将去 Facebook，而 `Zynga` 将得到 James 和公司。这里的主要问题是，`Zynga` 和 Facebook 都必须为了达成交易而做出让步，但双方都不想通过为混合出售提供更多价值来补贴对方的收购。他们认为自己正与一家他们并不特别喜欢的公司进行零和博弈。最终的条款（我从未从\
  \ Mick 那里打听清楚）是一些奇怪的组合：预付款、在两家公司分别独立归属计划的股权，以及一项让投资者获得回报的附属交易。\n\n正如我后来所学到的，我的情况并不罕见，尽管并不被公开讨论。拥有收购资金且胆于使用这些资金的公司会在交易中竞标他们想要的东西。你带着你的团队和产品进来；他们进行审查，然后说：“我们要\
  \ A 和 B，但不要 C，而且我们不在乎技术。”然后他们为你想要的东西给出一笔总款，而你被留通过双头买卖、回购或其他方式坑定某人以达成交易。公司——像 Facebook\
  \ 和 Google 这样的地方经常这样做——只关心每位工程师（或产品人员）的净价，而不是绝对成本。而且他们完全不在乎投资者得到了什么。许多早期收购都是以这种秃鹫式的方式展开的。\n\
  \n我之所以把 Mick 的例子记在心里有两个原因：\n\n### 第一点\n他确实做到了。他聚集了一圈硅谷的领先公司，并让他们相互斗争，直到他得到了他和他联合创始人想要的交易。在\
  \ `Zynga` 准备就绪期间，他坚持了下来，甚至冒着损害自己和 Facebook 交易的风险。他做到了连 Paul Graham 都从未见过、并建议他无法做到的事情。此外，他在完全弱势的地位上以精湛的技巧展示了自己的底牌。他的公司几乎没有增长，好不容易筹的小资金也快用完了。如果交易失败，他就彻底完蛋了。他唯一的真正力量就是让\
  \ `Zynga` 和 Facebook 进入同一个房间并开战。\n\n### 第二点\n我通过例子学习他的建议的第二个理由是因为我喜欢 Mick。在一个充斥着古怪、孤僻、自我中心、自恋的创业创始人的城市里，他看起来像个正实在的人，一个可以信赖的朋友。他无法从我的交易中获得任何好处，帮助我只是为了回馈同样困境中的创业创始人。当我们喝光杯中的酒时，我确信如果\
  \ Mick 能搞定这样的交易，我也行。\n\n但有代价吗？\n\n在这一场 `AdGrok` 闹剧发生很久之后，我听到一个东海岸的科技男完美地总结了当时西海岸科技界的主流态度：“他们那里就像没有记忆一样。那是无状态机器之地。”\n\
  \n背景补充一下：`State`（状态）是一个技术术语，指程序或函数运行所需保存在内存中的数据。`state machine`（状态机）是一种计算的抽象模型，其中计算过程在系列状态之间交替，每个状态由一组特定的指令或数据定义，并在外部刺激的触发下在各种状态之间转换。因此，`stateless\
  \ machine`（无状态机器）是一种仅根据某些指令处理的设备，对先前的历史一无所知，就像一个失忆症一样。我们这位东海岸人的讽刺点在于，加州人无法产生怨恨或积怨，无论对方的行为是多么无礼。相反，他们对慷慨的行为也不特别赏报。\n\
  \n\n\n\n正如每一个新到加利福尼亚的人所体会到的，他们对你那种表面上阳光的“Hi!”其实是在说：“去你的蛋，我不在乎。”不过这也是一把双刃剑。如果你在他们的婚礼上缺席，他们不会怪你的你；而在通往正念瑜伽课的路上，他们会直接越过无浪汉。在这个社会里，男女都住在自己自给自足的泡泡里，不依赖家庭或宗教等传统锚点，并且很大程度上不受收入不平等或叙利亚内战等外部社会力量的影响。“想开点，哥们”被提升到了生活哲学的高度。最终，硅谷的态度是一种由自私驱动的赋能式无秩序状态，尊重一些名义上关于进步或集体技术努力的“感觉良好”原则，但实际上，追求的是一种通过资本主义棱镜折射的持续自我发展：拥有资本结构表和归属计划的嬉皮。\n\
  \n### 那么，硅谷会对我的背叛怎么看？为了完成这件事，我牺牲了多少？\n\n我想，那些资本主义嬉皮士会接纳我的，我只需要取得起码的成功。这个“无国家机器之乡”将继续运转，吞噬人才和金钱，输出产品，他们仍然很乐意把我也磨进其中。\n\
  \n#### 2011 年 4 月 6 日，周三\n\n我决定在我们忙碌的共处时光中，第一次欺骗我的共同合伙人。\n\n正如许多此类谎言一样，合理化的理由是为了更大的利益。由于我们经历了所有破事，那帮兄弟已经压力大到过度呼吸的地步了，而现在我们正把一切都赌在这个极极不稳定的收购流程上，这个过程随时可能崩溃。如果他们意识到这次\
  \ Twitter 的收购对他们来说真的是生死存亡，他们会崩溃的。因此，作为 CEO，你要做的就是把公司的压力内化，让它吞噬你，而不是别人。\n\n这个高妙的合理化理由如何？\n\
  \n更何况，Facebook 的提议是否是真实的还并不清楚。我们信神，其他人请向我出录取意书。我今天早上给 `Gokul` 打了电话，提到 Facebook 的兴趣让我受若若，但在看到录取意书之前，我甚至无法开始操纵交易的另一方来促成这件事。\n\
  \n但今天，是属于 Twitter 的一天。\n\n### 尽职调查\n\n任何收购流程的一部分都是广义上所谓的“尽职调查”。它分为技术和法律两种形式，是收购公司所进行的一番窥探，以确保它确实得到了它所认为得到的东西。在技术方面，这意味着理解公司的“技术栈”；即驱动产品的一系列相互关联的用户界面和后端服务器技术。它甚至可能详细到与初创公司的工程师进行逐行代码审查。在如今，在初创公司里你可以伪造很多东西，因为有\
  \ `Amazon Web Services` 和各种现成的后端组件，让任何能力尚算合格的笨蛋都能搭建一个具有功能的 Web 应用。在早期初创公司中，对增长的智能规划很稀有，但对于大型快速扩张的科技公司来说，这是游戏规则。等待一个团队从技术青少年期成长为成熟人才，即使对于大公司来说也太久了。\n\
  \n作为第一步，Twitter 邀请我们作为一个小组，与一群报告给 `Kevin Weil` 的工程师进行技术交流。我们在一个紧张且混乱的小小时里，与 Twitter\
  \ Ads 团队的高级工程师们被锁在一个房间里，向他们展示了让 `AdGrok` 成为可能的后端技术栈。我在这里使用了公司的“我们”，因为这完全是那帮兄弟的表演。我已经很久没碰过\
  \ `AdGrok` 的代码了，关于它我没什么可以说的。虽然会议看起来进展顺利，但我们与 Twitter 深入合作的事实强调了我们在 `AdGrok` 投资方面正接近一个无法回头的点。\n\
  \n“听着，我们得搞清楚我们是在卖还是怎么，”当我们离开 Twitter 办公室的听力范围后说道。\n\n我们坐在南公园的野餐桌旁，那帮兄弟坐在我的对面。这就是\
  \ Twitter 本身在 2006 年诞生的地方，是在公园的一个滑梯上举行的一次脑风暴会议期间产生的。这种讽刺是极其显眼的。\n\n在有些尴尬的犹豫和对绿色桌面的低头观察后，我们终于开始交谈。可能第一次，我让兄弟们面对一个事实：自从发布前近一个月以来，我们没有发布过任何东西，而且团队技术方面的投入似乎在减弱。考虑到\
  \ `AdGrok` 技术端与一切事物之间偶尔存在的隔阂（即他们与我之间），我想确认他们也有同样的感觉。\n\n他们并没有不同我的意见。\n\n`MRM` 本人似乎心不在焉，已经几周没有在新代码方面交付任何东西了。`Argyris`\
  \ 和我讨论过这件事，但到目前为止，我们做的只是在他迟到的早上给他打电话，让他赶紧滚去 `AdGrok`。`Argyris` 履行了他的那部分，但两人已经失去了那种从我们在破陋的山景市公寓里起初就驱动\
  \ `AdGrok` 开发的奇妙心智同步。开发团队是科技公司的引擎。如果他们完蛋了，我们就没救了。如果这个引擎无法修复恢复生产力，那么该在我们现在还可以的时候把公司卖掉了。\n\
  \n我从一个看向另一个：他们看起来疲惫、担心，并且厌倦了初创公司游戏。他们同意我们应该把收购流程走到最后。我们必须把 `AdGrok` 卖给 Twitter，否则。\n\
  \n#### 推特不是背书\n\n如果你想诱惑一个美丽的女人，去追求她——西班牙谚语\n\n#### 2011 年 4 月 13 日，周三\n\n我决定在我们忙碌的共处时光中，第一次欺骗我的共同合伙人。\n\
