  # 创意孵化器\nPaper 以及许多其他失败应用背后的内部创意孵化器被称为 Creative Labs，旨在重新捕捉企业年轻化时期的创意活力。它在 2015\
  \ 年 12 月被彻底关闭。\n\n对于一家如此迷信自己产出的公司来说，这并不意外：产品最常用的测试集竟然是员工自己，而且有一种简单的方法可以将产品限制仅供内部使用。\n\
  \n“一枪一杀”是美国海军陆战队侦察狙击手（该兵种精英射击手的单位）的格 motto。这也是大多数守法猎人的准则。\n\nFacebook 广告的右上角有一个可点击的菜单，包含一个\
  \ `X` 按钮，允许用户留下负面反馈。Facebook 利用此来过滤广告。\n\n优化\n优化是广告数据硬币中相对于“投放”的另一面。后者涉及广告主利用自己的知识和用户数据来选择哪个用户看到哪条广告；前者则涉及广告网络（在这种情况下是\
  \ Facebook）利用其关于用户行为的数据来选择谁看到什么广告。两者之间存在着既共生又对立的“亦敌”关系。网络更倾向于通过优化来亲自控制广告投放；而广告主则希望通过投放来控制其资金支出方向的权力（以及建立内部营销知识库的能力）。在一个完美优化的世界里，投放将变得不再（反之亦然）。\n\
  \n`Marimbero` 是迈阿密古巴俚语中对大型毒贩的称呼，等同于更常用的词“narco”。`la marimba` 来源不详，是整个毒品交易的俚语（迈阿密在其中占有很大份额）。奇怪的是，“marimba”的标准西班牙语（和英语）意思是是一种南美洲常见的类似木制木琴的乐器。当我从迈阿密“搬”到美国（即去大学上学）并遇到一个自称痴迷于“muh-rim-buh”的业余音乐家时，引起了相当困惑。我当时感到震惊。\n\
  \n一个万圣节，我们之后会遇到的一个广告工程师 Ben Reesman 扮成了我参加万圣节。他对破旧牛仔裤和抓绒衫的选择简直神到位（当然，我们拍了张对比照并发到了\
  \ Facebook 上）。\n\nFacebook 的会议名称按地理位置分为不同的主题，通常是幽默的混合词，类似于合成词误用。例如，有一个主题将《星球大战》与酒精类饮料相结合，产生了诸如\
  \ `Jar Jar Drinks`、`Sith on the Beach` 以及（我最喜欢的）`It’s a Trappe!` 等精品。在这种情况下，`PC\
  \ Load Letter`（这是旧式激光打印机上的错误信息，在喜剧经典电影《办公室空间》中引发了一场摧毁打印机的暴动）代表“纸盒加载字母”，而且（我推测，但不记得了）附近的会议室也参与了相同主题。\n\
  \nA/B 测试\n这种被称为 `A/B testing` 的分流测试对于任何互联网应用或网站都是常见的。在一个严谨负责的公司里，这是测试任何变更的方法，无论是为了用户参与度，还是为了由于代码更改导致的服务器负载。\n\
  \nBeacon\n是 Facebook 标志性的产品惨剧。Beacon 于 2007 年推出，在在线（过度）分享普及之前，它会将你的网页浏览活动发布到你的动态消息中。被经常引用的\
  \ Beacon 灾难是一个真实的买婚戒指的男士，他的准未婚妻通过 Facebook 发现了他即将求婚的消息。太尴尬了！Beacon 导致了一场集体诉讼，并很快被正式关闭。在旧校园里，Facebook\
  \ 有一系列以构思失败的灾难命名的会议室：`Land War in Southeast Asia`、`Knife to a Gun Fight` 以及 . .\
  \ Beacon！\n\n那以后，情况变得更严重了。Facebook 现在有一支海军了！有一艘 Facebook 轮船服务于日益受欢迎的奥克兰。它从东湾的阿拉拉米达穿过风浪，到达\
  \ Facebook 正北的码头，我把船就停在那里，那里有另一辆往返校园的校车在等候。官方的 Facebook 航空公司（从洛杉矶或西雅图飞入员工）也不会太远了。\n\
  \n\n\n正如书中的其他陈述一样，这句话在所指的时间点是真实的。那个可怜的广告部门（Ads）很快就会赢得彩票（或者更准确地说，提供中奖奖金），不再挤在茶水池旁。但要到达那里还需要一段时间。\n\
  \n`F8` 的读音是“eff-ait”，而不是“fate”，这个名字源于工程师在黑客松（hackathons）中度过的八小时——那些全公司范围的通宵编码活动产生了\
  \ Facebook 一些比较随机（且成功）的产品。\n\n这篇名为《社交广告中的社交影响：来自现场实验的证据》的最终发表在计算机协会（Association\
  \ for Computing Machinery）的一场电子商务会议上，作者包括 Eytan Bakshy、Dean Eckles、Rong Yan 和 Itamar\
  \ Rosenn。Facebook 的数据团队绝对是顶尖的，既有已经名声显赫的学者，也有年轻、前途无限的博士生，他们对于能够手手 Facebook 庞大的私有数据库感到欣若不已。该团队的论文（如此篇）始终是执行严密的实验，经常揭穿某些社交媒体的常识——而这些常识往往源自\
  \ Facebook 内部。\n\n这种做法的理由最好用一句伪传来表达，这句话通常归功于汽车先驱亨利·福特，并被自诩远见者的人引用：“如果我问客户想要什么，他们会说‘更快的马’。”这里的观点是，真正具有预测性的产品领导者可以判断用户想要什么，即使用户本身并无法真正构想出来。Facebook\
  \ 广告在这种集体幻想下运行了多年，并且在某种程度上依然如此。\n\n也许最显著的是，中国并不是“Facebook 蓝”。中国政府有封锁 Facebook 的明确政策，社交媒体空白被当地的模仿者填补了。\n\
  \n一个关于企业生活的日常插曲：虽然整个身份愿景是集体努力的结果，但这个将 Facebook 身份比作同一个人不同名称（而 Facebook 是其全球信使者）的比喻是我创作的，并在早期的幻灯片中首次提出的。在随后不久举行的一个与\
  \ Sheryl 的会议上，Boland 还是一个典型的 Sheryl 追随者，从群邮件中拿走了我的幻灯片，将个人细节替换成了自己的（甚至精确到了他在 Atherton\
  \ 的家庭地址！），并向 Sheryl 展示了这一愿景。当 Boland 当着我的面演示它时，我处于愤怒和幽默之间的挣扎（他显然甚至没有提前提过）。那些迟钝的中层经理和他们的诡计！\n\
  \n数据持续的时间越长，用户和政治家就越担心。在移动设备领域，用于追踪和定位于你的 `device ID` 是（大部分）永久的，并且与你手中的物理设备关联。如果\
  \ Facebook 不小心泄露了你喜欢“Kanye West”或你是一个三十四岁的男性的事，那么这些数据将与你的 `device ID` 关联，并被无廉心的外部人员永远利用。浏览器\
  \ Cookie 最多持续几周，并不存在那种威胁。\n\n哈希（Hashing）是我们在互联网上许多工作的核心计算机科学概念。在非常形式的形式，它是一个将任意输入映射到稳定数值输出的函数。它是一种加密的、防泄露的数据比较方式，而无需交出所有信息。你可以检查身份的等性，而无需暴露身份本身（对于不匹配的人）。把它想象成一个数据安全套：动作仍然发生，但没有共享额外数据。\n\
  \n你可能知道安信（Experian）是决定你财务信誉的三大征信机构之一。那只是他们业务的一面，而且规模较小。另一部分业务是追踪你用他们帮你获得的信贷所购买的一切。\n\
  \n在 FBX 构思和孕育期间那个疯狂的月份的某个深夜凌晨两点，我创造了 `FBX` 这个名字和缩写。我记得某种营销说辞提到过带 X 的品牌名会脱颖而出。此外，这是对\
  \ Google 交易平台 `AdX` 的调侃引用。对于初创公司创始人来说，拥有共同投资者就像来自两个通过婚姻结合的家庭。这不是血缘关系，但是一种共同纽带，可以带来投资者的介绍和可能的相互帮助。\n\
  \n“鱼”（fish）是指桌上的傻瓜或受骗者，被老练的玩家利用。正如俗语说，如果你环顾四周看不清谁是傻瓜，那么你就是那个傻瓜。\n\n对 Reesman 公平，尽管他符合潮流，但他远不是一个兄弟会男孩（frat\
  \ boy），实际上是在异常情况下离开大学的（而且从未正式读过高中）。他卓越的编程技能是自学的，天赋完全是天生的。像梅尔维的小说一样，他的故事的一部分记录并隐藏在他手臂上的纹身中，那是一系列位元，字面上的\
  \ `1` 和 `0`，用二进制表示他生活中的各种事件。\n\n明确一下，“curls”指的是二头肌弯举，这是健身房老鼠们的标志性运动，而许多“兄弟会程序员”（brogrammers）正是如此。\n\
  \n这是一个真实故事：当我搬上船时，我必须把家庭酿酒设备放在某个地方，于是我把它存在了 Facebook 校园。在一次黑客松期间，在其他精酿啤酒变态者的帮助下，我部署了五加仑酿酒设备，期间一直在排掉了可观的比时啤酒储备。当到需要冷却煮好的原汁啤酒时，我们将大卷铜管连接到\
  \ `Building 16` 二楼厨房的水龙头上。当我们得知雨正落在扎克伯（Zuck）的桌子上（以及其他每个高层人员的桌子上），那里就在厨房正下方时，安保人员带着恐慌的脸冲了进来。显然，我们的高压冷却冲破了厨房的管道。无无畏惧，我们勇敢的啤酒小队（当时处于相当醉酒的状态）完成了酿造，并将大储桶留在了广告\
  \ 区域发酵。那天早上四点左右，当我恢复清醒并想起我作为这个项目产品经理的职责时，我向扎克发了一封道歉邮件，承诺用一瓶酒作为补偿。我们的恶作剧并没有任何后果，我仍然欠扎克一瓶，因为我们最后把啤酒装进了桶里（味道非常好；我们在一小时内就喝光了）。*快速行动，打破常规*——包括管道。\n\
  \n从技术上说，这并不完全准确。IPO 之后有一个“锁定期”（通常为 180 天，但可以更短），员工等内部人员无法合法出售股票。这意味着员工必须不耐烦地看着公司股价波动——他们的净资产随之波动——在此期间无法进行任何交易。\n\
  \n如果你在疑惑，是的，有所谓的“供应侧平台”（`SSP`）。它是 `DSPs` 和其他买家接入的卖方技术，它帮助出版者将其网站和应用变现。该技术通常是实时交易平台。在许多方面，`FBX`\
  \ 是一个 `SSP`，但与大多数尽可能签署更多出版者的 `SSPs` 不同，它只有一个大客户：Facebook 本身。\n\n\n\n这并不意味着 `FBX`\
  \ 对 `FB` 收入的边际贡献像出价差异那样巨大。像大多数在线广告拍卖一样，Facebook 运行的是“二价拍卖”。其经济细节是博士级别的水平，但本质上，这意味着你支付的是次高出价的金额，而不是你的实际出价。如果算一笔账，这意味着整体上是一个得多的价格发现机制。要真正增加总收入，你需要在广告展示售出的“清算价格”附近有足够的出价密度，从而推高总支付价格。如果没有密度，所有这些高价对底线毫无用处。因此，我们的目标是增加\
  \ `FBX` 外部竞价兴趣与 `FB` 带入广告量之间的重叠。这就是我们 `FBX` 团队痴迷的。\n\n在原始 `FBX` 合作伙伴列表中，最令人印象深刻的公司之一\
  \ `TellApart` 奇怪的是在 2015 年卖给了 `Twitter`。\n\n`A9` 是一个数字词（numeronym），硅谷命名美学中常见的修辞。它代表“Algorithms”（字母“A”加上其他九个字母），因为复杂的计算机指令是\
  \ `Amazon` 在这个量化营销新世界成功的关键。顶级风险投资公司 `a16z`（代表“A(ndreessen Horowit)z”）遵循了类似的逻辑。这种古怪的缩写一定满足了极客内心深处的某种深度强迫症（OCD）。\n\
  \n重要的 Facebook 合作伙伴（`Apple`、`Amazon`、`Zynga` 等）被分配了永久的联络人员，几乎就像美国国务院向外国派遣大使一样。他们在生活中的角色不仅是向（往往是）敌对的外部势力代表\
  \ Facebook 的观点，还要向往往忽视事事的 Facebook 为外部公司的利益争取。他们还帮助其他公司应对 Facebook 内部错综复杂的政治斗争，以实现某些互利共赢的目标。这些大使非常了解他们的外国势力，有些甚至变得有点“本土化”（就像在国外呆太久的外交一样），像认同\
  \ Facebook 的议程一样认同他们所代表对象的计划。\n\n科技领域的大多数产品，至少在互联网领域，都是以半成品状态启动的，即所谓的 `MVP` 或“最小可行性产品”。这是你能够提供且仍能理智地称你的创造为产品的最低功能水平。在\
  \ `FBX` 的情况下，这意味着实时拍卖可以通过我们设计的基础广告购买协议运行，但我们没有任何妥善管理这头“巨兽”所需的监控工具、调试工具或错误通知，也没有我们梦寐以求的高级功能，例如跨浏览器身份匹配。所有这些都将在发布后的九个月内，由一个非常极度劳累的工程师（`Hari`）和一个实习生来完成。\n\
  \n“一对一”（One-on-one）是 Facebook 语，指的是员工与经理之间的会议，这代表了公司内部发生的大部分“管理”工作。这些会议通常被认真对待，如果你恰好走进在咖啡馆桌旁或会议室里进行的会议，按照惯例给经理和下属组合留出空间。当然，这些会议对\
  \ `Gokul` 来说是笑话，他主要问承诺的收入何时能实现。\n\n我花了大约两个月说服 `Gokul` 和 `Boland`，`FBX` 按设计设计并没有“泄露”任何\
  \ Facebook 数据，平息了他们对数据隐私毫无根据担忧。我认为除了 `FBX` 团队本身外，Facebook 没有任何人甚至在抽象层面上真正理解过 Facebook\
  \ 广告交易所是如何运作的。\n\n美国军事史学者会认出这些是 `Col. John Boyd` 的话，他是一位著名的军事飞行员和冲突理论家。他好斗、不守常的性格让他赢得了军方高层的直观愤怒，尽管他对美国军事战略做出了贡献（这些战略至今仍在教中），并且参与了如\
  \ `F-15`、`F-16` 和 `A-10` 等传奇飞机的设计，但他从未晋升到校上以上。然而，空军从未正式否认过他，他拥有二十四年的飞行员和军官职业。\n\n\
  “栈”（Stack）是一个带点极客术语。它指的是构成产品整个基础的关联技术 set。该名称的垂直性是为了捕捉许多软件的“堆叠”性质；即驱动你所看到的用户界面的代码、连接代码与数据库的技术胶水，以及数据库技术本身。另一个经常被引用的栈是网络栈：浏览器渲染通过\
  \ `HTTP` 获取的 `HTML`，运行在 `TCP`（传输控制协议）之上，通过 `IP`（互联网协议）路由，然后通过你的 `Wi-Fi` 路由器和电缆连接发送到本地。广告栈则是一个更复杂的由交易所、优化、定位、广告服务器和跟踪组成的时钟组件组合。白板上的原理图就像一个鲁布黄金堡装置（Rube\
  \ Goldberg device）。\n\n作为这种营销欺诈的一个例子，`Boland` 作为闭环愿景的坚定捍卫者，后来在 Facebook 官方公关批准的帖子中记录道，“这并不是闭环与开放的问题，而是整合的问题。”他的收件箱里有数百封旧邮件（很多由我编写），主题行里写着“封闭”和“开放”。\n\
  \n以防这让你感到困惑，简要提一下数据匹配。在 `Custom Audiences` 中，广告主上传一份名单（可能多达数百万），作为回报获得一个可以投放广告的大型定位细分。在\
  \ `FBX` 数据匹配中，对于每个名字，Facebook 会返回一个伪名，该伪名将通过我们之前讨论过的实时交换机制，在每次广告出现在 Facebook 上时被用于识别你。在\
  \ `Custom Audiences` 中，这就像向一座城市的所有人口发送一条通用信息；在 `FBX` 中，这就像通过定制信息向城市里的每一个人点名发送。换句话说，这是断头台和手术刀的区别，正如你在尝试切除肿瘤时所预期的不同结果一样。\n\
  \n“技术债”（Technical debt）是软件开发中经常使用的概念。想象一下，每当工程师对某段代码进行快速粗糙的修复时——那种可能会某天爆炸并需要再次修复的黑客手段——就会有一本隐形的账本，针对未来的工程时间借出一笔贷款。工程师现在可以借钱来让火车重新运行，但账单以后会到期，通常带有利息。\n\
  \n*Ad majorem Dei gloriam*（“为了上帝更大的荣耀”）是天主教耶稣耶稣会的座右铭。这一信仰的知识分子先锋——耶稣会，是幕后从 17 世纪为了保护他们在巴拉圭的任务而引发的战争（在罗伯特·德尼罗主演的电影《使命》中有令人记忆的记录），到对\
  \ `Descartes` 和 `Subcomandante Marcos` 等杰人物和叛徒的教育。直到今天，他们仍然经营着全球大学网络，包括 `Georgetown`、`Boston\
  \ College` 和 `Fordham`，以及遍布整个欧洲、拉丁美洲和美国的无数中学，培养着从硅谷到智利圣地道的精英。`Fidel Castro` 和我毕业于同一所耶稣会学校（卡斯特罗夺取权力后关闭了那所学校，它在\
  \ 60 年代搬迁到了迈阿密），我当年必须在很多作业顶部写上“AMDG”。\n\n\n\n\n\n# #tbt（即“回顾周四”）是 Facebook 上一种常见的做法，用户会发布自己很久以前的照片，通常是在\
  \ Facebook 出现之前的照片。\n\n除了那个真心爱我的“英国交易员”（British Trader）之外，还有关于那位“以色列心理学家”的事。出于考虑，我在这里大多省略了那个故事，但在\
  \ Facebook 工作期间，我与一位前职业摄影师、后转变为以色列国防军（IDF）士兵的心理医生曾有过一段热烈的恋情。我在 Facebook 的最后一年是住在她位于帕洛奥托的小工作室里度过的。这段关系在工作压力下崩溃了，在我离开后走向了缓慢而痛苦的终结，但在那之前，经历了无数次戏剧性的分手、反复和再反复。\n\
  \nGokul 目前是 Square 的产品和工程负责人，Square 是一家由 Twitter 创始人 Jack Dorsey 创立并领导的时尚且快速发展的支付公司。2015\
  \ 年 11 月，Square 上市了。Gokul 明智地交易了自己的股权。\n\n# 这很可能是胡言。Gokul 持有的广告技术投资比硅谷所有的风险 总和还要多。就像情景喜剧里的老梗一样，我经常会在公共广告打印机/扫描仪上发现\
  \ Gokul 粗心留下的已签署顾问协议。他跨越的立场和利益冲突比维也纳会议上的梅特尼尼还要多。确实，每一项投资都必须通过 Facebook 冲突委员会的审查，他们拥有绝对的否决权。在公司上市后，他们可能变得更加保守和禁止性。或者也许他只是在奉承我。Gokul\
  \ 也经常这样做。\n\n# “人摧毁的只有他所取代的东西。”作者是拿破仑三世，关于推翻第二法国共和国并将其为第二法兰帝国。\n\n# Fidji Simo 也实行办公室多夫制。众周知的是，她会与当时\
  \ Facebook 内部政治地位上升的人结交，非常公开地与那个人进行社交（当然，这一切在 Facebook 上都有记录）。就像煤井里的社交金丝雀一样，她暂时的社交圈总能揭示当时广告部门谁是核心人物。\n\
  \n由于纯主义者无疑会对这种简化处理感到不安，这里需要说明一下：严格来说，设备 ID（在苹果世界被称为 `IDFA`，或广告 `ID`）实际上是一个由软件生成的字母数字字符串（例如，“236A005B-700F-4889-B9CE-999EAB2B605D”），它与你的手机关联，并在你运行的所有\
  \ App 中通用。历史上，它是一个不可变的物理参数，但这种情况在 2012 年隐私担忧增加时发生了变化。现在它是软件生成的，以便你通过更改它来退出广告。但从任何角度来看，它几乎就像盖在手机电路板上的序列号。\n\
  \n提交后，苹果会审核 App 的实际操作及其调用的函数，包括获取设备 `IDFA` 的函数。如果你似乎以不可接受的方式使用它（苹果的规则故意很模糊，且他们的解释几乎是塔勒模式的辩论话题），那么你的\
  \ App 就会被拒绝，通常理由不明确。这是现代技术中罕见的瓶颈点之一，一个玩家仅仅通过反复无常的命令进行统治。\n\n`CAC` 是“客户获取成本”，`LTV`\
  \ 是“生命周期价值”。前者是获取用户下载并登录你的 App 的营销成本。后者是在用户整个生命周期内，你从该用户身上获得的收入。如果 `LTV` 与 `CAC`\
  \ 的比例大于 1，那么作为一个 App 发布商，你是成功的，因为流入大于流出（暂不考虑开发和服务器成本，并假设这个“生命周期”不会太长）。任何 App 营销人员对这两个数字的了解都应该超过他们孩子的名字。\n\
  \n这是一个半偶然的天才之举。首先，它将安全和用户运营问题（例如：标记发送垃圾邮件的虚假用户、为真实用户找回忘记的密码）外包给了运营商（例如 `AT&T`），他们将人与电话号码的映射作为其业务的一部分进行建立和维护。其次，这意味着增长团队一直存在的让用户连接到其他用户的任务变得微不足道：只需吸取用户手机中的联系列表，那个人就立即“好友”了他认识的所有人（而不是\
  \ Facebook 那种通过伪广告促使你添加多年未见的同学业务）。据报道，`WhatsApp` 放弃通常的用户名-密码组合虚假用户身份，是因为其创始人兼执行官\
  \ Jan Koum 经常忘记他的 `Skype` 密码，并想完全消除登录过程。\n\n这是一段很快变成传闻的硅谷暖消息：Jan Koum 在其家人从乌克兰移民后经常领取食品券的福利办公室门上，签署了那份价值数十亿美元交易的文件。正是这些轶事故事温暖了技术自由主义者的心，并为他们那种激烈的资本主义（在硅谷几乎是必须的）赋予了正义功绩制的印记。\n\
  \n这是我泄露给我的。根据 Facebook 广告系统的增长来建模 `FBX` 的规模（客户预算的去向、信息帖子中 `FBX` 相关的比例等），可以得出大致相同的数字。\n\
