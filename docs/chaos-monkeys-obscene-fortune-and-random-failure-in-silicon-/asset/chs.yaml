  \ Google 创造了可观的收入流。\n\n在硅谷的奋斗中，一个令人惊讶的真实细节是，一个人可以调动一支由律师、会计师、工程师、公关人员、上市公司投机者、合作伙伴关系人员组成的军队——所有让硅谷赚钱机器运转的这些人——而无需与他们任何一个见过面。在参与\
  \ `AdGrok` 的规模史诗般的阵容中，我可能只见过其中的一半人。其他人对我来说，除了电话和邮件之外，从未存在过。\n\n我人生中第一次（也是最后一次）援引那位知识分子伪装者\
