    \ 和 #ifndef 词项分别表示“如果已定义”和“如果未定义”；#elif 来自“else if”。\n\n表达式 #line 前面是一个整数，表示程序中下一行的行号，还可选一个程序名，该名称也会出现在上述行中。一个示例是\
    \ #line 12 “Alphanum.cpp”。\n\n#if defined() 指令的作用与 #ifdef 相同，但允许复合语句，使用‘&&’、‘||’等。\n"
