    ### 数组——符号“[ ]”


    与 Pascal 不同，Pascal 要求把数组声明为 ‘array’ 类型的变量，而 C 语言把矩阵（数组）仅看作另一种类型的变量，例如 char；区分使用单个“字符”的字符串变量与存储一串字符的变量的，是类型声明中是否出现方括号。


    声明 char k; 告诉编译器变量 k 中存储一个字符。而 char k[30]; 语句表明变量 k 存储最多 29 个字符的字符串，总是保留最后一个位置（即第
    30 个位置，编号 30）给空字符。因此，k[30] 语句建立了一个有 30 个位置的一维数组，位置从 0 到 29。


    我们常把一维的向量称为矩阵，因此“矩阵”一词更恰当地指二维、三维或更高维的情况。一个名为 joan 的数组——为第一维保留 20 个位置，为第二维保留 35
