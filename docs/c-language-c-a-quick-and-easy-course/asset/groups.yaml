    ## 第 8 章


    ### 逻辑运算符


    ### 符号“&&”、“||”和“!”


    通常，在命令的条件执行中，我们需要编写复合条件，使用连接词 AND 和 OR 以及副词 NOT，它们被称为布尔运算符，因为 George Boole 在 1848
    年（《逻辑的数学分析》）将它们数学化了。在 C 语言中，正如我们所看到的，这些词分别用符号“&&”、“||”和“!”表示。还有几个其他连接词作为这三种基本关系的派生，其中主要的是蕴含（或“IMP”）、等价（或“EQU”）和异或（“XOR”）。


    对于任意两个语句 s 和 p，我们可以在逻辑中证明：(a) `s IMP p` 等价于 `(NOT s) OR p`，(b) `s EQU p` 等价于 `(s
    IMP p) AND (p IMP s)`，以及 (c) `s XOR p` 等价于 `(s AND NOT p) OR (p AND NOT s)`。


    让我们在 C 中取语句 `k == 1`、`k != 1`、`m%9 > 0`、`m%5 == 1` 和 `m%3 != 0`。你可以编写下面的迷你程序：


    - i) `main(){int k=1,m=1; while((k==1)||(m%9>0)){for(m=1;m<9;m++)printf("\n Hi!");}}`

    - ii) `main(){int k=1,m=1; if(((k!=1)||(m%5==1))&&((m%5!=1)||(k==1)))puts("Hi!");}`

