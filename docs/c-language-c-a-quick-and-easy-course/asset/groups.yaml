    1，移动了 5 位。


    除了上面列出的类型之外，C 语言还包含一些类别的修饰符或称数据类型，有的很简单，有的比较复杂。它们是：


    ```c

    enum name {int1, ..., intn}

    auto type var;

    register char var, or register int var;

