    \ C 语言中的表示法）。\n\n现在让我们将一个 16 进制数转换为十进制，例如数字 0xDE2。\n\n0xDE2 =13*16²+14*16¹+2*16⁰\
    \ =13*256+14*16+2*1=3554.\n\n（注意 D=13 且 E=14。）\n\n## 二进制到十六进制\n\n数字 16 是 2 的四次方，即\
    \ 16 = 2⁴，因此，二进制数的四位数字对应于十六进制的一位数字。\n\n这里有一个例子：\n00010001\n    1       1\n我们有：00010001(2)\
    \ =11(16)。（它是十进制的数字 17。）\n\n更多例子：\n\n- a) 01000011......01000011(2)=43(16)\n-\
