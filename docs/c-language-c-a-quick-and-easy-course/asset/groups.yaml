    # # APPENDIX C

    ## Binary arithmetic: bits and bytes


    The ENIAC computer, built at the Pennsylvania State University in 1945, already
    used binary arithmetic as base of its architecture. This arithmetic admits only
    two digits, zero and one (hence the name), and was invented by Leibniz, who invented
    also the multiplication machine.


    The representation within the computer is given as follows: Circuit ON corresponds
    to the number 1; circuit OFF corresponds to the number zero.


    As there is no other digit greater than 1, all numbers besides 2 are written with
    the use of two or more digits.


    We have:


    1                        1                        10

    +0                       +1

    +1

    1 (for 1)               10 (for 2)               11 (for 3)


    and so on. Whenever we add 1+1, the result is zero and 1 “goes up”, such as in
    base 10 when we add 9+1, since 9 is the last digit of that base.


    Each space to be occupied by a binary digit is called a bit (contraction of “binary
    digit”), word created for this purpose, by Professor Claude Shannon, of MIT (Massachusetts
    Institute of Technology).


    Each sequence of eight bits form one “byte”.


    Representation of a byte:


    |___|___|___|___|___|___|___|___|


    In binary digits:


    |1|0|1|1|0|0|1|0|


    To convert to the base 10:


    10110010(2) = 1*2^7 + 0*2^6 + 1*2^5 + 1*2^4 + 0*2^3 + 0*2^2 + 1*2 + 0*2 =

    = 2^7 + 2^5 + 2^4 + 2 = 178.'
  - '[PAGE 117]


    (This is the so-called polynomial notation of number. In powers of ten, the polynomial
    notation would be 178 = 1*10² + 7*10 + 8.)


    To turn the base ten to binary base we divide the number by two and took the remainder
    (the first time gives the unit). We repeat the process for transforming the quotient
    in dividend, until the quotient is zero. (Of course, the machine does it for us,
    but it is not comfortable to ignore such a simple process.)


    Example: Write 300 in base two.


    ![](img/a9b60755682bc3cf43c528c679efbca7_117_0.png)


    (last digit – the unit) first digit (remainder)


    The number 300 is written in binary base as 100101100(2).


    Another example: Write 57 in base two.


    ![](img/a9b60755682bc3cf43c528c679efbca7_117_1.png)


    We have: 57=111001(2) first digit


    If we type a letter (alphanumeric character), this character is immediately associated
    with a number, the ASCII code, and this is transformed into binary base number.
    In microcomputers we have the ASCII, but the old mainframe code used is EBCDIC.


    Eight-bit computers are those whose architecture allows you to process information
    in eight by eight bits. Those of 16 bits do it in 16 by 16 and so on.


    +   - Eight bits: MSX, Apple, etc.

    +   - 16 bits: IBM-PC, Amiga, etc.

    +   - 32 bits: IBM PC-AT 386DX, IBM PC-AT 486DX, etc.

    +   - 64 bits: IBM PS1, Pentium, etc.


