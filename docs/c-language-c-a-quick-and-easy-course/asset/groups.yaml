    \n要将十六进制转换为二进制，只需记住每个十六进制数字对应四个二进制数字，然后将每个数字转换为四位。\n\n示例：将 0xBC5 转换为二进制数。\n\n\
    B(16)=11  11|2  5|2  2|2  1|2  B(16)=1011(2)\n  1 5  1 2  0 1  1 0\n\nC(16)=12\
