    \ / Cacildo\nMarques — 圣保罗：Amazon Sistema CreateSpace，2016年。\nISBN 978-1530254842\n\
    1. C（计算机编程语言）I. Marques，Cacildo II. 标题\n\nCDD-005.1\n\n## C语言之父——以及母亲们\n- 布莱兹·帕斯卡（Blaise\
    \ Pascal，1623-1662）\n  计算器\n- 戈特弗里德·威廉·莱布尼茨（Gottlob Wilhelm Leibniz，1646-1716）\n\
    \  二进制算术\n- 艾达·拜伦（Ada Byron，1815-1851）\n  程序设计\n- 艾伦·图灵（Alan Turing，1912-1934）\n\
    \  纸计算机\n- 阿隆佐·丘奇（Alonzo Church，1903-1995）\n  编程语言\n- 康拉德·楚泽（Konrad Zuse，1910-1995）\n\
    \  二进制计算机\n- 格蕾丝·穆雷·霍珀（Grace Murray Hopper，1906-1992）\n  编译器\n- 丹尼斯·M. 里奇（Denis\
    \ M. Ritchie，1941-2011）\n  C语言\n\n![](img/a9b60755682bc3cf43c528c679efbca7_6_0.png)\n\
    ![](img/a9b60755682bc3cf43c528c679efbca7_6_1.png)\n\n## 前言\n\n没有人能仅凭一本书就学会严肃的学问。如果在课堂上，教师采用了学生手头的那本书，并且这似乎足以学会，那么这种“足够”是因为教师扮演了第二本书的角色——一本会说话的书，实时展开讲解。\n\
    \n因此，如果这是读者学习编程语言的第一本书，作者并不声称无需任何其他来源就能教会你C语言。不过，既然这里介绍的内容几乎涵盖了C语言的全部资源，那么学习者只需在遇到任何疑问时查阅互联网，搜索相关主题的示例即可。手捧一本书的最大优势在于，内容按教学顺序组织得井井有条，从易到难，从常用到少见。\n\
    \n学习编程语言要从现有的程序入手，要么将它们作为模型，要么对它们进行修改和改编。如果读者遵循本材料的建议，不跳节，而是按照给出的顺序，最好逐字敲入这里展示的程序和小程序，并完成学习结束时的练习，也就是说，完整阅读并应用所呈现的项目，那么他将准备好创建自己的程序，并掌握内容。如果你还想把原始C语言的每个保留字都牢记于心，那将是一笔很好的收获，因为在其他语言中，这些词的数量总是更多。\n\
    \n输入代码时必须非常小心。对计算机而言，半个单词都不行。缺少一个逗号、把逗号换成冒号、输入了带有特殊格式的引号、缺少一条指令或语句——所有这些都会使程序失效。在故障程序的反馈中，按行号和命中顺序出现的第一条提示才是相关信息。不应在后续行的错误代码上浪费时间，因为它们受执行顺序中第一个错误的影响。例如，如果单词“main”被输入为大写，在关于该词的警告之后会出现多条错误消息，但优先的是修复这第一个失败，这样后续的消息如果仍然存在，才有意义。\n\
    \n在大学第一年，编程老师并不把学生视为入门级学徒，而是至少把他视为具备中等水平的人，有时甚至把他视为专家，就像音乐学院那样。就理工科和工程学院而言，很难理解这种高期望从何而来，但教训是：学生必须学会追赶要求，忘掉高中时代——那时老师布置的任务简短，而且还容忍拖延。事实是，作为练习布置的首批程序已经是篇幅可观的成果，往往一整页甚至更多。如果你正处于这种情况，你可以从这本书开始，在自己的电脑上练习。\n\
    \n初学者最终会学到一种新语言，用来与机器对话，也用来与其他开发者交流。在掌握一门语言的同时，人让机器服从自己的命令，舒适自如，这与接受命令的是一个有血有肉的人不同——因为你无法知道这个人在接受指派时心里在想什么。我们不应忘记的是与同行互动的自然性，而不是工业化的界面。记住这一点，我们就可以投身于编程学习，它基于C和C++语言，尽管之前已有多种语言。尽情享受吧！\n\
