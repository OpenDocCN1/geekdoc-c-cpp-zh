    \n%2d%5.2f%12.2f%9.2f%9.2f%9.2f\"；其中 %2d 用于整数参数（1-20）的值，后续格式按上述顺序对应各函数。\n- 2)\
    \ 编程中需要探索的一个有趣之处是：不使用不等号符号也能判断两个值中哪个更大。这可以利用绝对值函数实现。假设程序已通过随机函数生成两个数字 a 和 b，你需要知道哪个最小。下面的小程序使用\
    \ stdlib.h 和 time.h 获得这两个数。使用“time”是为了让随机值取决于程序执行的时刻，否则 rand() 的值将总是重复。\n\n```\n\
    main() { int a,b; srand(time(NULL)); a=10*rand()/32767;\n b=10*rand()/32767; printf(\"\
    \\n% d %d\",a,b);}\n```\n\n要判断最小值，常规代数中的公式为 m = (a+b-|a-b|)/2，转换为 C 即：m = (a+b-abs(a-b))/2。如果想得到最大值而非最小值，只需把\
    \ abs() 函数前的减号换成“+”。\n\n留给读者的练习是构建这个程序：回顾一下，它通过随机函数管理两个数字 a 和 b，然后在不使用符号“<”的情况下判断这两个值中哪个最小，并打印该结果。\n\
    \n## 第10章\n\n## 预处理指令\n\n### 符号“#”\n\n预处理器在程序被传给编译器之前对源代码进行分析和操作。这些任务包括文本字符串、合并、条件编译执行、指令信号以及将其他文件包含到源程序中。\n\
    \n预处理指令应在程序中占用独立行，并使处理器能够获知编译之前要完成的任务。默认指令如下：#define、#undef、#include、#if、#ifdef、#else、#elif、#ifndef、#if\
