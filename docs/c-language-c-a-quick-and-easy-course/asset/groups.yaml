    And what happens, in any language, when the programmer assigns a value given to
    the variable x and needs to change the value by one that was assigned to the variable
    y? Because if we make y = x, the value previously stored in y disappears, and
    we will not have how to rescue it to put it in x. This is solved with the techniques
    named “swap”. The most common is to introduce a third variable, w, for example.
    We attribute the value of x to w, and then deposited in x the value of y. Then
    we attach to y the value that was stored in w, which was the old value of x.


    A classic use of this swap technique is necessary for the program to calculate
    the Highest Common Factor (HCF) of two numbers. To compute this value, we divide
    the largest of them by the smaller, and, if the result, the quotient, is not 1,
    we return to the division, now of the divider by the remainder. We repeat this
    step, making the division of the divider by the remainder, until obtaining quotient
    1. The last divider then will be the sought HCF.


