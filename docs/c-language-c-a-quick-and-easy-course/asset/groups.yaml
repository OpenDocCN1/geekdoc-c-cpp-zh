    2、d = 3；但在月份 *enum* `{January = 1, Feb, Mar, Apr}` 中，January = 1、Feb = 2，依此类推。


    *auto* 类型声明一个局部变量，它只在函数被调用时有效。既然是在所讨论的函数内声明，它就已经是自动的，无需再额外说明。


    *register* 类型会把变量放入处理器寄存器中，从而提高程序运行速度，但不能与指针一起使用。*extern* 变量类型在程序中供全局使用，必须声明在各模块之外。*static*
    变量在程序执行期间保持其值不变。声明为 *const* 的名称在程序执行期间的任何时候都不能改变它的值。*volatile* 变量类型具有与 *const*
    相反的性质。*signed* 修饰符用于 `int` 和 `char` 类型，其作用与 `unsigned` 相反；`unsigned` 用于声明无符号变量。


