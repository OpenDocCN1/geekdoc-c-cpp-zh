    ## 第 1 章


    ## 编译器


    高级语言分为编译型和解释型。用解释型语言编写的程序由处理器逐行读取并执行。而编译型语言编写的程序由处理器以整体方式运行，因此运行速度快得多。


    在屏幕上编写并调试好的程序的第一种呈现形式称为“源程序”；如果编程代码是解释型语言，程序就以此状态执行。相反，如果我们使用的是编译型语言，就需要让源程序进入编译阶段；该阶段将其转换为目标程序，并给它分配一个通常带有
    .OBJ 扩展名的名称，例如 CONTROL.OBJ。执行这一过程的程序称为编译器；编译器有不同版本，可用于 C 语言、C++、Clipper、Delphi、Visual
    Basic 或许多其他代码。


    然而，编译阶段并不是程序开发的最后一步。带有 .OBJ 扩展名的程序称为目标程序；要成为可执行程序，它必须经过链接编辑过程，并获得 .EXE、.DLL、.COM
    等扩展名。


    C 语言配备的是编译器，而不是解释器，因此它是一种能够创建执行速度非常快的程序的语言。C 源程序具有 .CPP（C++ 或 C Plus Plus）扩展名，或者干脆是
    .C 扩展名。


    ### 结构化语言


    在 C 中，便于编译器工作的因素之一是：这种语言有利于编写结构化程序，即按模块设计、这些模块可以组合或相互配合的程序，从而避免使用由 goto 语句造成的流程偏离，尽管这类指令仍然是该语言的一部分。


    程序开发的基本质量标准是机器运行时间的经济性和内存占用。给定一个程序的两个版本时，优先选择最能满足该标准的版本；因此，以结构化形式编写的程序会得分，除非它无谓地浪费时间和内存。


    源程序输入完成后，应保存为文件格式，并因此获得一个名称；该名称应为 1 到 8 个字符，以字母或下划线（“_”）开头，后跟字母或数字。对于任何 C 编译器，其扩展名应为
    .C；对于 C++ 编译器，则可以是 .CPP。


    C++ 编译器提供合适的编程环境，以窗口和按钮组织，在其中可以输入、编译、链接编辑和运行程序；后三个步骤可使用键盘或仅用鼠标完成。我们可以通过标记（高亮）文本、将其传送到剪贴板——Ctrl
    + Ins 键——再将其粘贴到 C++ 屏幕——Shift + Ins 键——的技术，在 C++ 环境中复制程序片段；之后必须取消标记——Ctrl + KH
    键。


    Borland Turbo C++ 编译器的环境被称为集成开发环境（IDE），并且是名为 BIN 的目录的一部分。要进入该目录，请在 DOS 提示符下键入
    cd \TurboC\BIN 并按回车键。进入该目录后，通过键入 BC 并按 Enter 即可访问该环境；这只是进入 Turbo C++ 环境的方式之一。显然，如果在启动（引导）时，AUTOEXEC.BAT
    文件的“Path”中包含“C:\TurboC\BIN;”字样，那么只需在任意目录提示符下键入 BC 并按 Enter——无论是在根目录、Windows 运行处还是某个陌生目录——即可立即进入
    C++ 环境。要激活任意 BC 环境窗口，只需按 F10 和方向键（¬、_、®）。对于其他品牌的 C++ 编译器，以类似方式操作，并相应调整这些命令词。顺便说一下，Microsoft
    使用 Alt 激活窗口。


    获取 Borland TurboC++ 3.0：http://winworldpc.com（用 7z 解压，然后使用 WinImage）


    ### 编译


    不过，没有什么能阻止人们采用旧方式操作：在任何文字处理器中，或直接在 DOS 中，输入带 .C 扩展名的程序，并在操作系统提示符处直接进行编译和链接编辑。例如，一个名为
    TEST1.C、记录在当前目录中的程序，可以通过键入 C TEST1.C、CL TEST1.C 或 TC TEST1.C 来编译，具体取决于你调用编译器时使用的是
    C、CL 还是 CT，甚至是 EC、CC、BCC 或 LC 等其他名称。Borland TurboC++ 3.0 编译器使用 TCC 命令在命令行下工作。因此，如果
    TEST1.C 位于 \TurboC\Progs 文件夹中，而我们当前位于 \TurboC\bin 中，只需执行 TCC \TurboC\Progs\TEST1.C，程序就会编译该文件，并在当前目录中生成文件
    TEST1.EXE。现在在命令行中键入名称 TEST1，它就会开始运行。


    读者也可以下载适用于 Windows 或 Linux 的 GNU 编译器 GCC（GNU 编译器集合）。使用它时，编译在命令提示符下完成。如果它安装在 Mingw
    文件夹中，应通过键入 CD \Mingw\bin 进入 Bin 子目录。如果你的软件源存储在 \Mingw\Programs 文件夹中，并且例如其中记录了
    Newtest.c 程序，那么要编译它，你应在其中键入

