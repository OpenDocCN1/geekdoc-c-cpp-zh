    In the area of Data Structure many fine programming techniques are studied, including
    the linked allocation, storage of stacks and rows, the tree traversals (pre-order,
    in-order and post-order) and various processes of search in files. A rudimentary
    way to search is to compare the value you want with the values of the file in
    ascending order of indices. If the data are stored in the 1st index or records,
    the search will be fast, but if it is in a higher level, the research will be
    done in almost all file elements. On average, there is a number of at least n/2
    comparisons for a file of n elements.


