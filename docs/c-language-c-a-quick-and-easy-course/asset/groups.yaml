    \ n, p; printf(\"The HCF is %d\",Hcf(n,p));}\n```\n\n交换技术的另一种方式使用一个有些令人惊讶的特性。给\
    \ x 赋两个变量之和 x + y。然后给 y 赋 x-y，此时它表示和减去 y，即 x + y - y。此时 y 具有原 x 的值。由于新的 x 存储初始和，只需减去新的\
    \ y（即旧 x），令 x = x-y。例如，若有 x = 7、y = 5，做 x = 7+5，得 x = 12；然后做 y = x-y，此时表示 12-5，于是\
    \ y = 7；现在 x = x-y，即 12-7，得到 x = 5。\n\n### 练习\n\n- 1) 创建一个程序，以整数 1-20 为参数，在表格中按百分之一精度（%2f）打印平方根\
