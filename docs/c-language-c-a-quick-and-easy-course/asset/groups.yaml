    # Arguments of functions


    When a function receives a value to be processed, we use to name it ‘argument’.
    The variables inside a function intended to receive external values are called
    ‘parameters’. In a program, variables declared within the function prototypes
    are automatic variables, even if you do not use the word auto, because they act
    only when the function is called, without existing out of it.


    # The argc and argv parameters


    Also the main() function can take parameters beyond the word void. They are the
    special argc (“argument count”) and argv (“argument vector”), which receive content
    external to the program.


    The terms from the command line, for example, may be transferred to the main()
    program through these arguments, as in the mini-program below:


    ```

    main(int argc, char *argv[]){int i;printf("Number:%d\n",argc);

    for(i=0;i<argc;i++)printf("\n%d: %s\n",i,argv[i]);}

    ```


    If you are using an environment (IDE), the words typed in “argument”, of the Run
    tab, will be the contents of the successive positions of the vector argv[], the
    next time you run the mini-program. The terms argc and argv are variable, and
    can be replaced by other words.


