    ### 文件处理——fopen() 函数


    对于磁盘或终端设备、端口和打印机中数据的输入/输出（即 I/O），C 语言有两种处理形式：由 ANSI 定义的标准输入/输出（或称高级 I/O），以及系统级输入/输出；后者已被
    UNIX 操作系统采用，但未包含在 ANSI 标准中。


    I/O 流称为 stdout（标准输出）、stdin（标准输入，键盘）、stderr（错误输出）、stdaux（辅助设备）和 stdprn（打印机）。


    高级 I/O 也称为缓冲 I/O，因为字节流（‘stream’）在被传送到最终目的地之前会存储在缓冲区中。


    用于按 I/O 标准处理文件的 stdio.h 头文件函数有：


    | clearerr() | fputc() | getchar() | scanf() |

    |---|---|---|---|

    | fclose() | fputs() | gets() | setbuf() |

    | feof() | fread() | perror() | setvbuf() |

    | ferror() | freopen() | printf() | sprintf() |

    | fflush() | fscanf() | putc() | sscanf() |

    | fgetc() | fseek() | putchar() | tmpfile() |

    | fgetpos() | fsetpos() | puts() | tmpnam() |

    | fgets() | ftell() | remove() | ungetc() |

    | fopen() | fwrite() | rename() | vfprintf() |

    | fprintf() | getc() | rewind() | vprintf() |

    |  |  |  | vsprintf() |


    除了 stdio.h 头文件中的上述函数外，还有 EOF、NULL 和 SEEK_SET 等常量。


    打开文件的默认函数是 fopen()。该函数应按语法 `FILE *fopen(char *name, char *mode)` 使用，其中 *name 是指向文件名的指针，*mode
    告诉计算机文件是文本模式还是二进制模式，以及打开是用于读取还是写入。如果出错，该函数返回 NULL。


    文件模式有以下符号：


    | 符号 | 模式 | 符号 | 模式 |

    |---|---|---|---|

    | "r" | 读取（''read''） | "ab" | 在二进制文件中追加 |

    | "w" | 写入（''write''） | "r+", "w+", "a+" | 读取并 |

    | "a" | 追加（''append''） |  | 记录 |

    | "rb" | 二进制读取 | "r+b", "w+b", "a+b" | 同上，二进制文件 |

    | "wb" | 二进制记录 |  |  |


    在某些编译器中，必须写成 “rb+”、“wb+” 和 “ab+”，而不是 “r+b”、“w+b” 和 “a+b”。


    fopen() 函数的逆操作是 fclose()，它关闭任何先前打开的文件。如果文件无法关闭，它返回 EOF；如果一切正常，它返回零。它必须按语法 `fclose(FILE
    *stream)` 使用。


    使用头文件 stdio.h 和 stdlib.h，你可以尝试下面的小程序：


    ```

    main(){FILE *a; a=fopen("file1.xxx", "w"); if(!a) { puts("Error!"); exit(1);}
    else printf("Success!"); fclose(a);}

    ```


    然后它会写入一个空文件，因为没有向其中放入任何内容。在命令行中，你可以请求目录（DIR）并确认 FILE1.XXX 在那里。下面的小程序可用于删除它。


    ```

    main(){int k; k=remove("file1.xxx"); if(k!=0) { puts("Error!"); exit(1);} else
    puts("Success!");}

    ```


    另一个具有相同布局和相同条件的上述小程序本可用于在删除 FILE1.XXX 文件之前更改其名称，只需将语句 `k=remove("file1.xxx");`
    改成类似下面的内容：


    k=rename("file1.xxx", "newname.xxx");


    ### 在文件中写入


    如果 fopen() 和 fclose() 打开和关闭文件，那么哪些函数适合让我们向文件中写入和读取数据呢？这些函数是 fwrite() 和 fread()。它们应按如下方式使用：`type
    fwrite(void *p, size, n, FILE *stream);` 和 `type fread(void *p, size, n, FILE
    *stream);`，其参数依次表示缓冲区地址、该缓冲区的字节大小、该大小对象的数量以及一个 FILE 指针。


    在给出演示 fwrite() 和 fread() 的示例程序之前，我们先展示字符操作函数必须如何书写。如果 c 是字符，这些函数应这样写：`int getc(FILE
    *stream);`、`int getchar(void);`、`int putc(const int c, FILE *stream);`、`int putchar(const
    int c);`、`int ungetc(int c, FILE *stream);`、`int fgetc(FILE *stream);` 和 `int
    fputc(int c, FILE *stream);`。


    getc() 函数与 fgetc() 一样，从任意文件读取一个字符，而 getchar() 从标准输入设备（通常是键盘）读取一个字符。因此，`getchar(void)`
    等同于 `getc(stdin)`。


    这可以在下面的小程序中看到：


    ```

    main() {char c; printf("\nType character:"); c=getc(stdin); printf("Tecla: %c\n",c);
    fflush(stdin); printf("Type Enter."); while((c=getchar())!=''\n''){} }

    ```


    fflush() 函数将输出内容记录到文件中，并清除缓冲区，释放缓冲区，即使其中可能有错误消息。


    现在，取 s 为字符串，我们有函数 `char *gets (char *s);`、`int puts(const char *s);`、`char *fgets(char
    *s, int n, FILE *stream);` 和 `int fputs(const char *s, FILE *stream);`。


    你可以尝试以下代码：


    ```

    main() {char s[256]; puts("Type a phrase: "); gets(s); printf("\nThe phrase is:
    \n,%s",s);}

    ```


    ### 格式化输入


    stdio.h 中包含的 scanf() 系列有三个表达式：`int fscanf(FILE *stream, const char *format);`、`int
    scanf(const char *format, ...);` 和 `int sscanf(const char *s, const char *format,
    ...);` 后一个函数将字符串转换为二进制文件。这里的省略号由 const char *format 中这些变量的序列填充。在这些函数内部，参数需要指向地址。


    下面是一个示例小程序：


    ```

    main(){char m[80]; puts("Type phrase: ");scanf(stdin, "%s",&m);

    printf("\n Repeating: %s",m); fflush(stdin);}

    ```


    scanf() 函数只将字符串内容中直到第一个空格之前的部分赋给相应变量，因此句子中的单词必须用某种下划线符号连接。短语可以是：I_have_learnt_C_language。


    ### 格式化输出


    scanf() 系列的这些函数的逆函数是 fprintf()、printf() 和 sprintf()。它们应按以下语法使用：`int fprintf(FILE
    *stream, const char *format, ...);`、`int printf(const char *format, ...);` 和 `int
    sprintf(char *s, const char *format, ...);` 注意，除了对文件的调用（FILE *stream）之外，fprintf()
    函数与 printf() 和 sprintf() 类似。


    下面是一个示例小程序，其中名称 n 在 fscanf() 中前面没有 ‘&’，因为数组名已经是其第一个元素的地址。


    ```

    main(){char n[80];int i; printf("\nType name and height in cm:\n");

    fscanf(stdin,"%s% d",n,&i);

    fprintf(stdout,"Name: %s\n Height: %d cm",n,i);}

    ```


    ### 错误处理函数


    标准错误处理函数是 stdio.h 文件中的 clearerr()、ferror() 和 perror()，此外还有 string.h 中包含的 strerror()
    函数。第一个函数按 `void clearerr(FILE *stream);` 使用，它清除错误指示符并将其重置为零，同时断开文件结束指示符。第二个函数写成
    `int ferror(FILE *stream);` 形式，检查所讨论流中的错误；如果没有错误则返回零，如果检测到错误则返回非零值。错误类型由 perror()
    函数标识。它的语法为 `void perror(const char *s);`，在标准错误输出设备 stderr 中显示字符串 *s，以及与 errno
    对应的消息。strerror() 函数按 `char *strerror(int errnum);` 形式使用，返回与 errnum 参数给出的错误号相关联的错误消息。

