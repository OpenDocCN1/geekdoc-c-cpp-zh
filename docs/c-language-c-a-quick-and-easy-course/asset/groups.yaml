    in the most productive imaginable way: the file is split down at the middle, by
    the average of its limit-indices; then the process is repeated on the left side
    or the right side, one that is not discarded in the comparison (for this, the
    file must be ordered). Continuing this operation, the sought datum (element) is
    found in the shortest possible time.


