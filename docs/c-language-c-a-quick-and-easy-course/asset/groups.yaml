    ## 第12章：特殊算法


    数学家花拉子密（Al-Khowarizmi），波斯阿拉伯裔，发展了重要的代数技术，包括最早的方程求解方法，他无意中留给了我们两个源自其名字的词：“算法”（algorithm）和“算术”（algorism）。第一个词是
    algorism 与 arithmos（希腊语中表示数字的词）的融合。算法是一个建立在算术、代数或逻辑基础上的过程，能够为问题提供解决方案或执行某些计算。例子包括在小学一年级学到的求和算法，以及高中最后一年学到的
    Briot-Ruffini 算法。如果算法不存在，计算机科学肯定也不会存在。


    ### 递归


    用户定义函数与编程技术带来的便利之一是递归。递归函数是调用自身的函数。在某些情况下，时间和空间的节省是巨大的。


    下面的程序使用了一个递归的小例子，它计算给定数字的阶乘。n 的阶乘公式是 n! = n(n-1)(n-2) ... 3 × 2 × 1。因此，对于给定的正整数值，阶乘就是从
    1 到该数字的序列的乘积。在程序中，n 的连续递减和乘积通过递归获得。


    ### 示例程序 #12A


    ```c

    /* Program "Factori.cpp" */

    #include <stdio.h>

    #include <stdlib.h>

    float Factori(int n) {

    if (n==0) return 1;

    else return n*Factori(n-1);}

    ```


