    ### C++ iostream.h 头文件


    Turbo C++ 有一个强大的 I/O 函数头文件，称为 iostream.h，它由早期名称 stream.h 发展而来。iostream.h 文件包含类
    ios、istream_withassign、iostream_withassign、ostream、ostream_withassign 和 streambuf。其中有
    74 个函数，我们可以找到 allocate、base、cout、flush、setf、hex、peek、put、read、width、write 和 ws。


    当我们把类的使用引入编程工作（类是复合语句的一种，如 struct 和 union）时，C++ 的特定特性是有用的并带来优势，这在“面向对象编程”（OOP）中完成，用于带窗口的系统。如果类是类型声明，那么对象就是该类的任何元素。教授这种高级编程哲学所需的技术将需要另一本书，专门讨论该主题。


    ### 系统级输入和输出


    UNIX 定义的非缓冲 I/O，即低级 I/O，使用 open() 函数而不是 fopen() 来打开文件。这里用于关闭文件的逆函数是 close()，对应于
    ANSI 标准 fclose()。这里的文件指针 FILE * 被简单的文件名取代，函数返回的值是一个称为文件描述符的整数，用于标识正在处理的文件。函数语法是
    int open(fname, mode)，其中 mode 是一个描述操作类型的整数，但由于因编译器而异，应替换为其名称，即大写字母代码。mode 的选项有：


    | 选项 | 描述 |

    |--------|-------------|

    | O_APPEND | 指向末尾，用于追加 |

    | O_CREAT | 创建新文件 |

    | O_RDONLY | 以只读方式打开 |

    | O_RDWR | 以读写方式打开 |

    | O_TRUNC | 清空文件并打开 |

    | O_WRONLY | 仅以写入方式打开 |

    | O_BINARY | 以二进制模式打开 |

    | O_TEXT | 以文本模式打开 |

    | O_IWRITE | 允许记录 |

    | O_IREAD | 允许读取 |


    包含这些选项以及 open() 和 close() 函数的头文件是 fcntl.h。其中包含的其他函数有 read()、write()、tell()——它提供文件指针位置——以及
    lseek()，它将指示器定位在某个位置。


    需要非常注意不要将高级声明式 I/O 与这些非缓冲 I/O 混合使用，因为不能同时使用这两种处理方式。I/O 系统虽然是大多数编译器的组成部分，但已逐渐被放弃，转而采用标准
    ANSI 用法。


