    ## The for statement


    Using the for statement in C offers more powerful capabilities than what happens
    with the same statement in other languages. As C has a very short form of this
    command, the reader should see an example in Pascal, which uses it in a very similar
    way to the other languages. To make a loop to rotate from 1 to 100 in Pascal,
    we have for example: for i := 1 to 100 do begin y = ln(i); end;


    In C language, the example is written as:


    ```

    main( ) {int i; float y; for(i=1;i<=100;i++) {y=log(i);printf("\n%f",y);}}

    ```


    The logarithm above is the natural one, because, in C, decimal logarithm is log10().
    The use of these functions requires writing #include <math.h> at the beginning
    of the program. To run the mini-program above use, therefore, the stdio.h and
    math.h header-files.


    Inside the parentheses of the for we have three statements (initialization; condition;
    increment). The expression i++ causes the variable i to be increased by 1 per
    spin loop.


    There is a slight difference in the order of evaluation between using i++ and
    ++i. In the first case, the variable i is incremented and then used; in the second
    case, it is incremented and used later with the new value already increased by
    1.


    The for statement in C allows the use of more than one variable at a time. The
    information inside the parentheses is separated by commas for each element where
    this is necessary. Example:


    ```

    main( ) {int k,m,t,x; t=100; for(k=0,m=t; k<m; ++k,m--) {x=k*m; printf("\n%d",x);}}

    ```


    Unlike what happens in Pascal, in C language the for statement allows variables
    as limiters, as in this case, which calculates the number of diagonals of the
    polygon. Example:


    ```

    main() { int d,n,m=50; for(n=m;n>2;n--) {d=n*(n-3)/2; printf("\t n=%d -> d=%d",n,d);}}

    ```


