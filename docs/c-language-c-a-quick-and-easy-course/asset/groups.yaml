    \ else if(...) printf(...);，而直接写 else printf()。\n\n请注意，程序中的 Pascal 三角形构造使用了斯蒂费尔关系：上一行中相邻两数相加得到下一行中的数，例如\
    \ 4 6。\n\n## 位运算符\n\n位运算中使用三种逻辑运算符：连接符 ‘&’（按位与）、‘|’（按位或）和 ‘^’（按位异或）。其他位运算符包括 ‘<<’（向左移位，即\
    \ left shift）、‘>>’（向右移位，即 right shift）和 ‘~’（一的补码，它是单目运算符）。这些运算符都只能用于整数或字符。\n\n\
    设 a = 0x03A1，b = 0x12B0，则有：a&b = 0x12a0，a|b = 0x13B1，a^b = 0x1111。‘&’ 运算符会把两个变量中不同时为\
    \ 1 的位变成 0，而保留两数对应位置上同为 1 的位为 1。对于二进制数 1001 和 1110，它会得到 1000。下面是一个小示例程序：\n\n```\n\
