    programs is the goto statement. Writing at any point in the program the goto statement
    LABEL; causes the control of execution to be diverted unconditionally to the line
    initiated by the label followed by a colon, LABEL:. Obviously, the goto statement
    also works for conditional branches, but it is not the most appropriate way to
    do this. You can have a small program like this below, that, to use an old feature,
