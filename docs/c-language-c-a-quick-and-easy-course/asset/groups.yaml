    # Unconditional jump


    An old programming feature that is not used in the construction of structured
    programs is the goto statement. Writing in any height of the program the goto
    statement LABEL; does the control of the execution to be diverted unconditionally
    to the line initiated by the label followed by a colon, LABEL:. Obviously, the
    goto statement also works for conditional branches, but it is not the most appropriate
    way to do this. You can have a small program like this below, that, to use an
    old feature, takes to spell the incrementing j as “j = j + 1;” instead of “j++”:


    ```

    main() { int j=0;

    RETAKE: if(j<11) {printf("\n%0d",j); j=j+1; goto RETAKE;}}

    ```


    After using an if statement, avoid writing in the same line a second instruction,
    because it can happen to the processor to ignore it. It is the case of the above
    example, whereas the scope of the if goes up to the brace closing.


