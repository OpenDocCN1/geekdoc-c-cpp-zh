    \ 之外的参数。它们是特殊的 argc（“参数计数”）和 argv（“参数向量”），接收程序外部的内容。\n\n例如，命令行中的词项可以通过这些参数传给 main()\
    \ 程序，如下面的小程序所示：\n\n```\nmain(int argc, char *argv[]){int i;printf(\"Number:%d\\\
    n\",argc);\nfor(i=0;i<argc;i++)printf(\"\\n%d: %s\\n\",i,argv[i]);}\n```\n\n如果使用环境（IDE），在“Run”选项卡的“argument”中键入的词，将在下次运行小程序时成为向量\
    \ argv[] 后续位置的内容。argc 和 argv 是变量，可以替换为其他词。\n\n## “交换”技术\n\n编程中使用许多代数技术，有时不得不借助可称为“准代数”的资源，比如在同一问题中给同一变量赋不同值（x\
    \ = 1、x = 2、x = 3）。有些语言为解决代数与编程之间这种处理差异，采用特殊符号，表示这种相等只是值赋值，可能是临时的。因此，它们写成 x: =\
    \ 1、x: = 2 等。在 C 中，程序员只需关注赋值中的等号“=”与比较中的“==”之间的区别。当程序中 x 先为 2，后为 4 时，我们实际有 x₁\
    \ = 2 和 x₂ = 4，只是省略了这些隐含下标的书写。\n\n那么，在任何语言中，当程序员给变量 x 赋了一个给定值，又需要把它改成曾赋给变量 y 的值时，会发生什么？因为如果令\
    \ y = x，y 中先前存储的值就消失了，我们将无法把它取回并放入 x。这可用称为“交换”的技术解决。最常见的是引入第三个变量，例如 w。把 x 的值赋给\
    \ w，然后把 y 的值存入 x。接着把存储在 w 中的值（即 x 的旧值）赋给 y。\n\n这种交换技术的经典用途是程序计算两个数的最大公因数（HCF）。计算该值时，用较大的数除以较小的数，如果结果（商）不为\
