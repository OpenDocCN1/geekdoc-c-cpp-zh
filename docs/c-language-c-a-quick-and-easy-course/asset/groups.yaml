    # CHAPTER 10


    # PREPROCESSOR DIRECTIVES


    # The symbol “#”


    The preprocessor makes analysis and operations in the source code before the program
    is passed to the compiler. Among these tasks they are text strings, mergers, conditional
    compilation execution, directive signaling and including of other files in the
    source program.


    The preprocessor directives should take independent lines in the program and make
    it possible to the processor to inform on the tasks that precede the compilation.
    The following are the default directives: #define, #undef, #include, #if, #ifdef,
    #else, #elif, #ifndef, #if defined(), #endif, #error, #line and #pragma.


    The #include directive is the most used and serves to instruct the processor to
    use in the program the file cited among the symbols ‘<’ and ‘>’. Examples: #include
    <stdlib.h>, #include “calculus.h” #include <C:\clipper\mel.h>. (The symbol ‘#’
    is said “cardinal”, or, simply, “number”.)


    Another directive widely used is #define, whose role is to define a term for the
    compiler and, where appropriate, assign an alphanumeric content to this term.
    Examples: #define CITY Paris, #define FACE, #define MAX 50. (Note that there is
    neither the equal sign nor semi-colon.)


    The #undef directive has the opposite role to that of #define, serving to warn
    the processor to “undefine” a term. Its use is necessary before making a redefinition
    of the same word. The #if and #else directives act as if and else, but, as #ifdef,
    #ifndef, #endif and #elif, deals with the situation of directives, exempts the
    use of parameters in the condition and do not accept other commands on the same
    line. The #ifdef and #ifndef terms mean, respectively, “if defined” and “if non-defined”;
    #elif comes from “else if”.


    The expression #line precedes an integer, which indicates the number of the next
    line in the program and, optionally, a program name, in which also meets the aforementioned
    line. An example is #line 12 “Alphanum.cpp”.


    The #if defined() directive has the role of #ifdef, but admits composite sentences,
    using ‘&&’, ‘||’, etc.'
