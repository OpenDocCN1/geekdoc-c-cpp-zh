    \ (1-12) | %y | year (0-99) |\n| %j | day of the year (1-366) | %Y | year (four\
    \ digits) |\n| %m | month (1-12) | %Z | time zone name |\n| %M | minute (0-59)\
    \ | %% | percent symbol |\n\n## Arguments of functions\n\nWhen a function receives\
    \ a value to be processed, we use to name it ‘argument’. The variables inside\
    \ a function intended to receive external values are called ‘parameters’. In a\
    \ program, variables declared within the function prototypes are automatic variables,\
    \ even if you do not use the word auto, because they act only when the function\
    \ is called, without existing out of it.\n\n## The argc and argv parameters\n\n\
    Also the main() function can take parameters beyond the word void. They are the\
    \ special argc (“argument count”) and argv (“argument vector”), which receive\
    \ content external to the program.\n\nThe terms from the command line, for example,\
    \ may be transferred to the main() program through these arguments, as in the\
    \ mini-program below:\n\n```\nmain(int argc, char *argv[]){int i;printf(\"Number:%d\\\
    n\",argc);\nfor(i=0;i<argc;i++)printf(\"\\n%d: %s\\n\",i,argv[i]);}\n```\n\nIf\
    \ you are using an environment (IDE), the words typed in “argument”, of the Run\
    \ tab, will be the contents of the successive positions of the vector argv[],\
    \ the next time you run the mini-program. The terms argc and argv are variable,\
    \ and can be replaced by other words.\n\n## The technique of “swap”\n\nMany are\
    \ the algebraic techniques used in programming, which sometimes have to resort\
    \ to resources that we might call para-algebraic, like this of assigning different\
    \ values to the same variable (x = 1, x = 2, x = 3) within the same problem. Some\
    \ languages resolve this difference of handling, between algebra and programming,\
    \ adopting a special symbol, indicating that this equality is only a value assignment,\
    \ which may be temporary. Therefore, they do x: = 1 x: = 2, etc. In C, the programmer\
    \ should be concerned only with the difference between the symbol of equality\
    \ in the assigning, which is “=”, and in comparison, which is “==”. When in the\
    \ program x is worth 2, then it is worth 4, what we have is x₁ = 2 and x₂ = 4,\
    \ with the dispensation of the written of these indexes, which are implied.\n\n\
    And what happens, in any language, when the programmer assigns a value given to\
    \ the variable x and needs to change the value by one that was assigned to the\
    \ variable y? Because if we make y = x, the value previously stored in y disappears,\
    \ and we will not have how to rescue it to put it in x. This is solved with the\
    \ techniques named “swap”. The most common is to introduce a third variable, w,\
    \ for example. We attribute the value of x to w, and then deposited in x the value\
    \ of y. Then we attach to y the value that was stored in w, which was the old\
    \ value of x.\n\nA classic use of this swap technique is necessary for the program\
    \ to calculate the Highest Common Factor (HCF) of two numbers. To compute this\
    \ value, we divide the largest of them by the smaller, and, if the result, the\
    \ quotient, is not 1, we return to the division, now of the divider by the remainder.\
    \ We repeat this step, making the division of the divider by the remainder, until\
    \ obtaining quotient 1. The last divider then will be the sought HCF.\n\nIn the\
    \ program example below, establishing a HCF function, the variables m and d, which\
    \ initially store the data values of n and p, need to exchange values between\
    \ them, and then use the auxiliary variable k.\n\n### Example-program #9B\n\n\
    ```c\n#include <stdio.h>\nlong Hcf(int n, int p)\n{\nint m, d, k, r;\nputs(\"\
    Type two integers greater than zero: \");\nscanf(\"%d\",&n); scanf(\"%d\",&p);\n\
    m=n; d=p;\nif(m<d){k=m; m=d; d=k;}\nr=1;\nwhile(r>0){r=m%d; m=d; d=r;}\nreturn\
    \ m;\n}\nmain ()\n{\nint n, p; printf(\"The HCF is %d\",Hcf(n,p));}\n```\n\nAnother\
    \ way to the swap technique is to use a somewhat surprising feature. You assign\
    \ to x the sum of two variables, x + y. Then you assign to y the difference x-y,\
    \ which now means the sum minus y, i.e., x + y - y. At this point, y has the value\
    \ that was in the original x. And as the new x is storing the initial sum, simply\
    \ deduct the new y, which is the old x, making x =x-y. For example, if we have\
    \ x = 7 and y = 5, we do x = 7+5, which gives x = 12; then we do y =x-y, that\
    \ now means 12-5, and then we have y = 7; now, x = x-y, which is 12-7, getting\
    \ x = 5.\n\n### Exercises\n\n- 1) Create a program that, using as arguments the\
    \ integers 1-20, print in a table, with a precision of hundredths (%2f), the square\
    \ root values, sqrt(), of the power of e, exp(), of the decimal logarithm, log10(),\
    \ of the cosine, cos(), and of the arc-tangent, atan(). Note that to print these\
    \ functions it is enough to take only one print statement inside a loop. A suggestion\
    \ for formatting is: \"\n%2d%5.2f%12.2f%9.2f%9.2f%9.2f\"; where %2d is for the\
    \ value of the integer argument (1-20) and the following formats are for the functions\
    \ in the order given above.\n- 2) A curiosity that needs to be explored in programming\
    \ is the feature that allows you to decide which is the greater of two values\
    \ without using a symbol of inequality. This is possible with the use of the absolute\
    \ value function. Assume that the program has generated two digits, a and b, through\
    \ the random function, and you need to know what is the lowest. The mini-program\
    \ below, which uses stdlib.h and time.h, obtains the two numbers. The use of “time”\
    \ is so that the random value depends on the moment when the program is executed,\
    \ otherwise the value of rand() will always be repeated.\n\n```\nmain() { int\
    \ a,b; srand(time(NULL)); a=10*rand()/32767;\n b=10*rand()/32767; printf(\"\\\
    n% d %d\",a,b);}\n```\n\nTo decide the minimum value, the formula in regular algebra,\
    \ is m = (a+b-|a-b|)/2, which translated to C is: m = (a+b-abs(a-b))/2. If we\
    \ want to get the greatest value, not the lowest, just we exchange for “+” the\
    \ minus sign that appears before the abs() function.\n\nThe exercise for the reader\
    \ is to build this program, which, recalling, manages two digits a and b through\
    \ the random function, and then decide which of the two values is the lowest,\
    \ without using the symbol “<”, printing then this result.\n\n## CHAPTER 10\n\n\
    ## PREPROCESSOR DIRECTIVES\n\n### The symbol “#”\n\nThe preprocessor makes analysis\
    \ and operations in the source code before the program is passed to the compiler.\
    \ Among these tasks they are text strings, mergers, conditional compilation execution,\
    \ directive signaling and including of other files in the source program.\n\n\
    The preprocessor directives should take independent lines in the program and make\
    \ it possible to the processor to inform on the tasks that precede the compilation.\
    \ The following are the default directives: #define, #undef, #include, #if, #ifdef,\
    \ #else, #elif, #ifndef, #if defined(), #endif, #error, #line and #pragma.\n\n\
    The #include directive is the most used and serves to instruct the processor to\
    \ use in the program the file cited among the symbols ‘<’ and ‘>’. Examples: #include\
    \ <stdlib.h>, #include “calculus.h” #include <C:\\clipper\\mel.h>. (The symbol\
    \ ‘#’ is said “cardinal”, or, simply, “number”.)\n\nAnother directive widely used\
    \ is #define, whose role is to define a term for the compiler and, where appropriate,\
    \ assign an alphanumeric content to this term. Examples: #define CITY Paris, #define\
    \ FACE, #define MAX 50. (Note that there is neither the equal sign nor semi-colon.)\n\
    \nThe #undef directive has the opposite role to that of #define, serving to warn\
    \ the processor to “undefine” a term. Its use is necessary before making a redefinition\
    \ of the same word. The #if and #else directives act as if and else, but, as #ifdef,\
    \ #ifndef, #endif and #elif, deals with the situation of directives, exempts the\
    \ use of parameters in the condition and do not accept other commands on the same\
    \ line. The #ifdef and #ifndef terms mean, respectively, “if defined” and “if\
    \ non-defined”; #elif comes from “else if”.\n\nThe expression #line precedes an\
    \ integer, which indicates the number of the next line in the program and, optionally,\
    \ a program name, in which also meets the aforementioned line. An example is #line\
    \ 12 “Alphanum.cpp”.\n\nThe #if defined() directive has the role of #ifdef, but\
    \ admits composite sentences, using ‘&&’, ‘||’, etc.\n"
