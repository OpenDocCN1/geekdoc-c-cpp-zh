    \ | 时区名称 |\n| %M | 分（0-59） | %% | 百分号 |\n\n## 函数参数\n\n当函数接收要处理的值时，我们将其称为“实参”。函数内部用于接收外部值的变量称为“形参”。在程序中，函数原型内声明的变量是自动变量，即使不使用\
