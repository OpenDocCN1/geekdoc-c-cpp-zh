    # ## Divide and conquer


    The idea of splitting a set into two halves and, starting from there, to get to
    what you want is not exclusive of the *binary search* algorithm. It is the center
    of one of the most important techniques of programming: the technique of division
    and conquest (*divide and conquer*) transplanted from a famous strategy of the
    generals on the battlefield. When we separate the body of a program into modules,
    whether functions, whether procedures, we are using this famous technique.


    On these algorithms presented just above, the reader needs to be reminded that
    the default file *stdlib.h* contains the *qsort()* (quick sort) and *bsearch()*
    (binary search) functions. They are algorithms important too much to get out of
    the standard library. And they are both too important to be not explicitly within
    this book, so that they can be manipulated by you, reader.


