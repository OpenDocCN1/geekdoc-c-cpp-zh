    | fgets() | ftell() | remove() | ungetc() |

    | fopen() | fwrite() | rename() | vfprintf() |

    | fprintf() | getc() | rewind() | vprintf() |

    |  |  |  | vsprintf() |


    In addition to the above functions in the stdio.h header file, there are also
