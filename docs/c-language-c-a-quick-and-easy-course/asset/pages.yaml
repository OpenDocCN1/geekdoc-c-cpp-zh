    # # Bitwise operators


    Three logical operators are used in bitwise operations. They are the connectives
    ''&'' (bitwise AND), ''|'' (bitwise OR) and ''^'' (bitwise XOR). The other bitwise
    operators are ''<<'' (scroll to the left, ''left shift''), ''>>'' (scroll to the
    right, ''right shift'') and ''~'' (complementary of one, which is unary operator).
    Any of these operators can only be used with integers or characters.


    Taking a 0x03A1 and b = 0x12B0, we have: a&b = 0x12a0, a|b = 0x13B1 and a^b =
    0x1111. What happens is that the operator ''&'' turns into zeros the bits that
    in both variables are not equal to 1 and maintains 1 those that are 1 in equivalent
    positions of the two numbers. Applied to binary numbers 1001 and 1110, it would
    produce the number 1000. We have such a mini-program:


