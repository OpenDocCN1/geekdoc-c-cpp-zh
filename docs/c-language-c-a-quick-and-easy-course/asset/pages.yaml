- pgno: 15
  md: '*assembly language*, although it represented a new step related to the purely
    formal *lambda calculus* system, of Alonzo Church, of 1936. The purpose of Church
    was to develop a language that was compatible with the Turing machine (the famous
    “paper computer”). By the end of 1943 an air raid on Berlin destroyed those machines,
    but Zuse had already started the construction of the Z4. The record of its patents
    came to IBM’s hands in 1946, but the completion of the Z4 in Germany only has
    occurred in 1949.


    Also in 1943 in Pennsylvania, USA, John Von Neumann and his team developed, based
    on ideas of Alan Turing, of whom Neumann was advisor in Princeton, the ENIAC Coding
    System, to the computer that he were building. In 1946, with the machine already
    in operation, Neumann developed with Richard Clippinger a more substantial language,
    the *Short Code*.


    In 1952, Lieutenant Grace Murray Hopper, mathematics professor at Harvard University,
    presented his language *A-0* with the first compiler in the history, as a refinement
    of the *Short Code*, and later she created also more advanced codes such as languages
    *Arith-Matic* (1954) and *Flow-Matic* (1955), using human words of English. In
    1952 the *Speedcoding*, of John W. Backus, also appeared, as predecessor of the
    *Fortran* (formula translator) language, which was conceived in 1954 and launched
    commercially in 1957. Since then, many high-level languages have been developed
    in universities and industry.


    The languages closest of the machine “understanding”, written in numeric code,
    such as as *ARC Assembly*, are called machine languages and are considered low-level
    languages. The faster they are in processing, the less readable they are by the
    human element, for giving heed to the restrictions of the machine.


