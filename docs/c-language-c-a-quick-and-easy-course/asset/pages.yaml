  img_proc: true
- pgno: 26
  md: "| const | float | Short | unsigned |\n|---|---|---|---|\n| continue | for |\
    \ signed | void |\n| default | goto | sizeof | volatile |\n| do | if | static\
    \ | while |\n\nThe reader will see that only 13 of these words have not role of\
    \ type modifiers. They are as follows: break, case, continue, default, do, else,\
    \ for, goto, if, return, sizeof, switch and while.\n\nRemark: In the original\
    \ language, from Kernighan and Ritchie, there were not the words const, enum,\
    \ signed, void and volatile, adopted by ANSI. And there was a word that was never\
    \ implemented: entry.\n\n# More words\n\nIn addition to the 32 reserved words\
    \ defined by ANSI, the Microsoft C compiler (MSC) also uses the words _asm, cdecl,\
    \ far, fortran, huge, near and pascal. The increases in Turbo C to ANSI are: asm,\
    \ cdecl, _cs, _de, _es, far, huge, interrupt, near, pascal and _ss.\n\nThe word\
    \ asm, or _asm, serves to introduce the C programming an Assembly routine, which\
    \ may require its own directive, as #pragma inline. The routine can be as follows:\n\
    \n```\nasm {\n    push es\n    pop es\n}\n```\n\nThe word cdecl tells the compiler\
    \ that in the call of functions of other languages the reading of parameters should\
    \ be done in the normal order of C, from right to left, and not in the order of\
    \ the source language. The word far tells the processor that the modified pointer\
    \ uses 32 bits instead of 16. The modifiers fortran and pascal warn the compiler\
    \ that the passing of function parameters must be made in the order used for those\
    \ languages (left to right). The modifier huge makes the pointer modified by it\
    \ necessarily to use 32 bits."
