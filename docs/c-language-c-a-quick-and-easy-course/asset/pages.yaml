- pgno: 116
  md: '# # APPENDIX C

    ## Binary arithmetic: bits and bytes


    The ENIAC computer, built at the Pennsylvania State University in 1945, already
    used binary arithmetic as base of its architecture. This arithmetic admits only
    two digits, zero and one (hence the name), and was invented by Leibniz, who invented
    also the multiplication machine.


    The representation within the computer is given as follows: Circuit ON corresponds
    to the number 1; circuit OFF corresponds to the number zero.


    As there is no other digit greater than 1, all numbers besides 2 are written with
    the use of two or more digits.


    We have:


    1                        1                        10

    +0                       +1

    +1

    1 (for 1)               10 (for 2)               11 (for 3)


    and so on. Whenever we add 1+1, the result is zero and 1 “goes up”, such as in
    base 10 when we add 9+1, since 9 is the last digit of that base.


    Each space to be occupied by a binary digit is called a bit (contraction of “binary
    digit”), word created for this purpose, by Professor Claude Shannon, of MIT (Massachusetts
    Institute of Technology).


    Each sequence of eight bits form one “byte”.


    Representation of a byte:


    |___|___|___|___|___|___|___|___|


    In binary digits:


    |1|0|1|1|0|0|1|0|


    To convert to the base 10:


    10110010(2) = 1*2^7 + 0*2^6 + 1*2^5 + 1*2^4 + 0*2^3 + 0*2^2 + 1*2 + 0*2 =

    = 2^7 + 2^5 + 2^4 + 2 = 178.'
