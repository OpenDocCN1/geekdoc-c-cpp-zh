  md: '# CHAPTER 1


    # THE COMPILER


    The high-level languages are classified into compiled and interpreted. A program
    written in interpreted language is executed through the reading line by line made
    by the processor. Whereas a program in compiled language runs in a comprehensive
    manner by the processor, which then works much faster.


    The first presentation written and debugged of a program on the screen is called
    a “source program” and in this state the program is executed if the programming
    code is an interpreted language. If, instead, we are working with a compiled language,
    so we need to pass the source program for the compiling phase, which turns it
    into object program and assign it a name that usually has the .OBJ extension,
    as in CONTROL.OBJ. The program that performs this process is called a compiler,
    which exists in different versions, either for C language, C++, Clipper, Delphi,
    Visual Basic, or for many other codes.


    The compilation phase, however, is not the final step in developing a program.
    The program with .OBJ extension, called object program, to become executable must
    go through the process of link-editing, getting an extension as .EXE, .DLL, .COM,
    etc.


    The C language features compiler, and not an interpreter, being therefore a language
    that allows the creation of very fast execution programs. A source program in
    C has the .CPP (C++ or C Plus Plus) or simply .C extensions.


    # Structured languages


    One of the elements that facilitate the work of the compiler in C is that this
    language favors writing structured programs, i. e., programs designed in modules
    that compose or mating themselves, allowing to avoid the use of deviations given
    by the goto statement, although such an instruction still takes part of the language.


    The basic quality criterion for the development of programs is the runtime economy
    and memory usage of the machine. Given two versions of a program, the preferred
    is the one that best meets that criterion and, therefore, a program written in
    a structured form earns points, unless it wastes time and memory for nothing.'
  merge: -1
  img_proc: true
