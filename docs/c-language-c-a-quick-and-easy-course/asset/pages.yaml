  md: '# CHAPTER 7


    # ADDRESS POINTERS - The symbol “&”


    ![](img/a9b60755682bc3cf43c528c679efbca7_54_0.png)


    Whenever a variable is declared, it is immediately allocated in a particular memory
    address, which can be accessed by a numerical reference, as occurs with residences,
    identified by its number in the street. A variable has therefore two kinds of
    value: the left value, which is its address, and the right value, which is its
    content. If we do not give any warning to the processor, the value to be manipulated
    in the variable is that of its content, not the address. To deal with the left
    value of the variable we must declare it as ‘pointer’, an indicator or pointer
    of an address.


    The only difference between a variable of type pointer and any other variable
    is that it must be preceded by an asterisk, ‘*’, at the time of declaration, as
    in int a, b, *pa;. For a pointer indicating the address of the variable, we precede
    this one of the address symbol, ‘&’, like, for example, in:


    ```

    pa = &a;

    ```


    We can have a mini-program with the following features:


    ```

    main() { int a,b,*pa; a=15; pa=&a; b=*pa; printf("\n b=%d",b);}

    ```


    What we have here is the variable a to receive the value 15, with pa pointing
    to the address and then the variable b receiving the content, the number 15, through
    the pointer pa.


    # The idea of dynamic allocation


    The dynamic programming, or dynamic memory allocation, is a very important resource
    in the computation and is only possible with the use of pointers through the functions
    malloc(), calloc(), realloc() and free(). In this system, memory addresses go
    being occupied or dynamically released during the processing phase, to the extent
    possible. In ordinary programming, non-dynamic, variable declarations, especially
    of matrix, reserve enough space in memory, regardless of being used effectively,
    they can not be reallocated for other purposes while the program is running.'
