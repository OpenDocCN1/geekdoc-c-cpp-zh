  md: '# # Chapter 0


    # ## INTRODUCTION - The C language


    At the Bell Laboratories of AT & T in the United States, Ken Thompson used to
    utilize a language called “B”, which he created from another language developed
    by Martin Richards in Cambridge, MA, BCPL programming language (Basic Combined
    Programming Language), derived from Algol 60. From the B language, Dennis M. Ritchie
    (1941-2011) created in 1972 a revolutionary new language, which he called C. When
    Ken Thompson then wrote the UNIX operating system, at the same AT & T, chose to
    do it with the C language, and no longer with the assembly language, as expected.
    The basic book of C has been written by Dennis M. Ritchie and Brian W. Kernighan
    under the name of The C Programming Language (Prentice Hall, 1978).


    # # Human language


    The main packages sold in the market are made in C. This is because it was the
    fastest language processing among high-level languages, because of its constitution
    almost stenographic and its compatibility with the assembly language. We called
    this “high-level language” that language whose codes are similar to human language
    and the first steps in its development were given in 1943, in Berlin, with the
    plankalkül, by civil engineer Konrad Zuse. Once completed his university degree
    in 1935, he, as a Ford''s German subsidiary engineer, began to implement the construction
    of the first binary computer in the history, which he called Z1. Without participation
    of the Nazi government, which has denied support, he had to rely on financing
    from merchants and friends. This first machine failed to work, so he created the
    successor Z2 and Z3, this in 1941, already with some funding from the government,
    pressured by war needs. For the Z3 is that Zuse developed the plankalkül, but
    that machine did not performed conditional jumps (the IF statement) and the plankalkül
    was not much more advanced than what would be the'
  merge: -1
