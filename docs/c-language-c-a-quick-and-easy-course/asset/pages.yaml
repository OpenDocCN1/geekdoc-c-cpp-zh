    The declaration char k; tells the compiler that in the variable k is stored a
    character. Already the char k[30]; statement warns that the variable k stores
    a string of up to 29 characters, always reserving the last position, in case the
    thirtieth, of number 30, to the null character. The statement k[30] establishes,
    therefore, a one-dimensional array of 30 positions, going from zero to 29.


