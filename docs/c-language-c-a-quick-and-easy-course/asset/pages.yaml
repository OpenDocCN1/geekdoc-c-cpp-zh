    # C program


    To write a program in C language we need to use variables, statements, reserved
    words of the language and functions.


    Functions can be user-defined in the program itself or on previously recorded
    files, and can be called of the standard library, which always accompanies C.
    This standard library is, after all, a library of libraries, a sort of necessary
    appendage to the language, and access to it is obtained with the use of directives
    #include <...> at the beginning of the program. Let’s look at a small example:


    # Example-program #1


    ```

    /* Program “Eachname.cpp” */

    #include <stdio.h>


    void main(void)

    {

