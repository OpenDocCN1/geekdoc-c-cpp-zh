  md: '# De Morgan’s laws


    Augustus De Morgan (1806-1871), mathematician friend of Boole, showed that (a)
    NOT (sORp) is equivalent to NOTs AND NOTp and (b) NOT (sANDp) is equivalent to
    NOTs OR NOTp. In programming languages, including C, truth-values, TRUE and FALSE,
    are understood as 1 and 0, respectively. So we can do the first law test this
    example:


    ```

    main() {if(!((1||0)==(!1&&!0)) puts("\n It''s right!");}

    ```


    With the next, we can make the verification of the second law:


    ```

    main() {if(!((1&&0)==(!1||!0)) puts(" This works!");}

    ```


    # Axioms of Aristotle


    Formal Logic was invented by Aristotle from three basic axioms, which he called:


    +   A) Contradiction principle (N(Ns) is equivalent to s);

    +   B) Excluded middle principle (s is valid or Ns);

    +   C) Principle of identity (s is equivalent to s).


    In the above lines, s is any sentence and N means “not”, “denial” or “to deny”
    (principles A and C were already used by other philosophers, then Aristotle has
    brought the principle B). When John Von Neumann directed the construction of the
    ENIAC computer in 1945, he introduced the so-called “Von Neumann architecture”,
    assembly of the processor that operates on the axioms of Aristotle. You can check
    if the current processor maintains that architecture, writing to the first principle:


    ```

    main() {if(!(!!(1<2))==(1<2))puts("\nPrinciple 1 is valid.");}

    ```


    For the second principle, we make:


    ```

    main() {if((1<2)||(!(1<2)))puts("\nPrinciple 2 is valid.");}

    ```'
