  md: '# CHAPTER 8


    # LOGICAL OPERATORS


    # The symbols “& &”, “||” and “|”


    Often, in conditional execution of commands, we need to write compound conditions,
    using the connectives AND and OR and the adverb NOT, which are called Boolean
    operators, because they have been mathematized by George Boole, in 1848 (The Mathematical
    Analysis of Logic). In C language, as we have seen, these words are represented
    by the symbols ‘& &’, ‘||’ and ‘|’, respectively. There are several other connectives
    as derivatives of these three basic relationships, the main among them being the
    implication (or ‘IMP’), the equivalence (or ‘EQU’) and the exclusive OR (“XOR”).


    For two any sentences s and p, we can demonstrate in logic that: (a) sIMPq is
    equivalent to (NOTs) ORp, (b) sEQUv is equivalent to (sIMPp) AND (pIMPs) and (c)
    sXORp is equivalent to (sAND NOTp) OR (pAND NOTs).


    Let’s take in C the sentences k = 1, k! = 1, m%9>0, m%5 = 1 and m%3!= 0. You can
    write the mini-programs below:


    +   - i) main(){int k=1,m=1; while((k==1)||(m%9>0)){for(m=1;m<9;m++)printf("\n
    Hi!");}}

    +   - ii) main(){int k=1,m=1; if(((k!=1)||(m%5==1))&&((m%5!=1)||(k==1)))puts("Hi!");}

    +   - iii) main(){int k=1,m=0; if(!((k==1)&&(m%3!=0))||((m%3==0)&&(!(k==1))))puts("Ok!");}


    The mini-program i exemplifies the use of implication: and, in the case, !(k =
    1) is equal to (k! = 1). The example ii shows the equivalence, while iii shows
    the use of exclusive OR (“XOR”), so-called symmetric difference.


    Much attention in the evaluation of each sentence within a cycle, because, if
    it is always true, the program enters eternal loop, i. e., it will not stop condition.
    In such a situation, just by pressing Ctrl + Break you will be safe.'
