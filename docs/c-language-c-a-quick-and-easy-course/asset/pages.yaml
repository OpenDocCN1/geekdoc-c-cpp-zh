    # The while loop


    Printing the numbers from zero to a thousand is easier than taking candy from
    a baby:


    ```

    main(){int k=0;while(k<=1000){printf("%d ",k);k+=2;}}

    ```


    Stating how integer the variable k; and initializing it to zero, the mini-program
    above tells the processor that while k is lesser than or equal to a thousand it
    should print k, then add 2 to the printed value and return to the word while.
    The instruction "k + 2;" uses the "+=" symbol, exclusive of C, and it would be
    written in Pascal as "k: = k+2," meaning that the value of k should be assigned
    the old variable value plus 2. If you want to run example above, be sure to add
    at the beginning the line #include <stdio.h>.


