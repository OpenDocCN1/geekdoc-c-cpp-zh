  md: 'Nobody learns a serious matter using a single book. If in class the teacher
    adopts a book that the student uses, and that seems enough for learning, this
    sufficiency is because the teacher plays the role of a second book, a talking
    book, elaborating in real time.


    So if this is the first book of programming language for the reader, there is
    not by the author claim to teach you the C language without the aid of any other
    source. However, once what is presented here covers virtually all of the C resources,
    it is enough the player, in case of any doubt, to refer to the Internet, asking
    for examples of the topic in question. The great advantage of having a book in
    your hands is the organized presentation of the subject in didactic order, from
    easy to difficult, from usual to sporadic.


    You learn a programming language from existing programs, either using them as
    a model, or making changes and adaptations in them. If the reader follows the
    proposal of this material without skipping sections, but experiencing playback
    programs and mini-programs here presented, in the order given, preferably typing
    word for word, and doing the exercises at the end of the study, that is, completing
    the reading and application of the projects presented, he will be ready to create
    his own programs, with content domain. If you also want to learn by heart every
    reserved word of the original C language, this will be a good acquisition, since
    in other languages the number of these words is always greater.


    You must be very careful when entering the codes. For the computer, half a word
    is not enough. The lack of a comma, the exchange of a comma by a semi-colon, a
    quotation mark typed with some special formatting, the absence of a directive
    or statement, all that disables the program. The first notice, in the order of
    lines and hits presented in the feedback of a faulty program, is the relevant
    information. One should not spend time with the following lines error codes because
    they are affected by the first error in the order of execution. For example, if
    the word “main” is typed capitalized, they will come several error messages after
    the warning on that word, but the priority is to fix this first failure, so that
    the following messages, if they persist, make sense.


    In the first year of university, programming teachers do not consider the student
    as an entry level apprentice, but see him at least as an individual with average
    preparation, when they do not see him as expert, just as in music colleges. In
    the case of Exact Sciences and Engineering colleges, it is difficult to know the
    origin of so high expectations, but the lesson is that the student has to learn
    to run behind his demands, forgetting the high school time, where teachers demanded
    short tasks and still tolerated delays. The fact is that the first programs ordered
    as exercises are already hearty works, in a whole page or more. If you are that
    situation, you can start practicing here with this book and in your own computer


    The novice programmer eventually learns a new language, used to talk to the machine,
    but also to talk to other developers. While mastering a language, the citizen
    puts the machine to obey his orders, comfortably, unlike what occurs when he who
    receives'
