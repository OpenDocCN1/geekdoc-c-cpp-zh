  md: '# CHAPTER 2


    # RESERVED WORDS AND OTHER CODES


    For the choice of variables in a program is necessary to avoid using any of the
    reserved words of the language, once this would lead to an error message and interrupt
    the execution.


    In C there is a very small number of reserved words since functions are not part
    of this group, whereas they are belonging to the standard library and not to the
    body language. In C, the I/O mechanisms (*input/output*) are part of the set of
    library functions, contrary to what occurs with other languages.


    The C language should not be the first programming code to any student, because
    after get used to the short way to write a statement on it, it is difficult to
    accept the discursive style of other high-level languages. But it is the most
    important language. So to prevent the reader who does not work with another language
    comes to develop such a barrier, this book attempts to draw comparisons with Pascal,
    whenever it is convenient. At this point, it should be said that while in Pascal
    external modules to the main program are *procedures*, much more than functions,
    in C these modules are all handled as functions, with exception to the rule only
    in definitions of parameterized variables. And also in comparison with Pascal,
    it should be noted that braces, *{...}*, modules bounding in C, in Pascal have
    the corresponding form *begin ... end*. The main program, that in Pascal has just
    to come wrapped in these two words, has in C the opening function *main()*, without
    which nothing works in the language.


    Reserved words in C, defined by ANSI (*American National Standards Institute*),
    are these 32, as follows:


    | auto | double | int | struct |

    |------|--------|-----|--------|

    | break | else | long | switch |

    | case | enum | register | typedef |

    | char | extern | return | union |

    |  |  |  |  |'
