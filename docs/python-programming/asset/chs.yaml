  \ number:4\nThe first number is greater than second number\n```\n\n## 4.3 For 语句\n\
  \n`for` 循环用于按固定次数重复执行代码块。在 Python 中，`for` 循环对序列中的所有成员进行重复，每次执行语句块，而 `while` 循环每次都会评估条件。`for`\
  \ 循环的语法如下：\n\n```python\nfor variable in range(val1,val2,inr):\n    #block of statements\n\
  ```\n\n在上述语法中，`val1` 和 `val2` 代表范围的最小值和最大值。`inr` 指定步增值。\n\n![image](img/9789386235633_18.png)\n\
  \n**图 4.5** for 循环流程图\n\n`for` 循环的流程图示如下（此处原文内容重复，已根据翻译逻辑处理）。\n\n示例如下：\n\n```python\n\
  a=int(input(“Enter the number: “))\nfor i in range(a):\n    print(i)\n```\n\n**输出**\n\
  ```\nEnter the number: 5\n0\n1\n2\n3\n4\n```\n\n在上面的示例中，range 中只给了一个值。这将被视为范围的最大值。\n\
  \n示例如下：\n\n```python\na=int(input(“Enter the number: “))\nfor i in range(1,a):\n\
  \    print(i)\n```\n\n**输出**\n```\nEnter the number: 4\n1\n2\n3\n```\n\n\n\n\n\n\
  在上述示例中，指定了范围的最小最大值。`inr` 值未指定；它会被自动赋值为 1。\n\n示例所示：\n\n```python\na=int(input(“Enter\
  \ the number: “))\nfor i in range(1,a,2):\n    print(i)\n```\n\n***Output***\n```\n\
  D:\\PythonPrograms>python a1.py\nEnter the number: 10\n1\n3\n5\n7\n9\n```\n\n##\
  \ 4.4 break 语句\n\n在 Python 编程中，循环用于重复执行一个语句块。当循环条件被求值为 TRUE 时，将执行循环体。在循环执行期间，如果需要紧急退出循环，则使用\
  \ `break` 语句。`break` 语句用于退出正在运行的循环语句。`break` 语句的语法如下：\n\n```python\nloop (condition):\n\
  \    #语句块\n    break\nelse:\n    #语句块\n```\n\n一个示例所示：\n\n```python\na=int(input(“Enter\
  \ the number: “))\ni=0\nwhile(i<a):\n    print(“Entered into while loop with value\
  \ of i=”,i)\n    if(i==2):\n        break\n    i=i+1\nelse:\n    print(“break is\
  \ not executed”)\n```\n\n***Output***\n```\nD:\\PythonPrograms>python a1.py\nEnter\
  \ the number: 5\nEntered into while loop with value of i= 0\nEntered into while\
  \ loop with value of i= 1\nEntered into while loop with value of i= 2\n\nD:\\PythonPrograms>python\
  \ a1.py\nEnter the number: 2\nEntered into while loop with value of i= 0\nEntered\
  \ into while loop with value of i= 1\nbreak is not executed\n```\n\n如果在正在运行的循环中没有执行\
  \ `break` 语句，则循环的 `else` 部分将被执行。\n\n## 4.5 continue 语句\n\n`continue` 语句用于跳过循环的当前迭代。如果循环条件被求值为\
  \ TRUE，则执行循环体。在执行过程中，`continue` 语句会停止当前循环体的执行并继续下一次迭代。语法为：\n\n```python\nloop(condition):\n\
  \    #语句块\n    continue\n```\n\n一个示例所示：\n\n```python\na=int(input(“Enter the number:\
  \ “))\ni=0\nwhile(i<a):\n    if(i==2):\n        i=i+1\n        continue\n    else:\n\
  \        print(“Entered into while loop with value of i=”,i)\n    i=i+1\n```\n\n\
  ***Output***\n```\nD:\\PythonPrograms>python a1.py\nEnter the number: 5\nEntered\
  \ into while loop with value of i= 0\nEntered into while loop with value of i= 1\n\
  Entered into while loop with value of i= 3\nEntered into while loop with value of\
  \ i= 4\n```\n\n## 4.6 pass 语句\n\n`pass` 语句可以被用作空语句来调用。它不执行任何操作。该语句主要用于让 CPU 忙碌一段时间。`pass`\
  \ 关键字用于指定 `pass` 语句。\n\n一个示例所示：\n\n```python\na=int(input(“Enter the number: “))\n\
  i=0\nwhile(i<a):\n    if(i<=2):\n        i=i+1\n        pass\n    else:\n      \
  \  print(“Entered into while loop with value of i=”,i)\n    i=i+1\n```\n\n***Output***\n\
  ```\nD:\\PythonPrograms>python a1.py\nEnter the number: 5\nEntered into while loop\
  \ with value of i= 3\nEntered into while loop with value of i= 4\n```\n\n在此程序中，`pass`\
  \ 语句被用于 `while` 循环。在迭代期间，`pass` 语句不会执行任何内容，看起来与 `continue` 语句相似。然而，`continue` 语句和\
  \ `pass` 语句之间存在差异。`continue` 语句会跳过当前迭代的执行并节省时间，而 `pass` 语句会浪费执行时间。\n\n## 4.7 入口循环\n\
  \n入口循环在进入循环时求值条件。入口循环的流程图所示图 4.6。`while` 循环和 `for` 循环是入口循环的示例。\n\n![image](img/9789386235633_19.png)\n\
  \n**图 4.6** 入口循环的流程图\n\n## 4.8 出口循环\n\n出口循环在离开循环时求值条件。出口循环的流程图所示图 4.7。`do-while`\
  \ 循环被认为出口循环。\n\n![image](img/9789386235633_20.png)\n\n**图 4.7** 出口循环的流程图\n\n在 Python\
  \ 中，`do-while` 循环应该通过入口循环来模拟，如下例例所示：\n\n```python\na=0\nwhile(1):\n    print(“hai”)\n\
  \    a=a+1\n    if(a>3):\n        break\n```\n\n***Output***\n```\nD:\\PythonPrograms>python\
  \ b1.py\nhai\nhai\n```\n\n## 4.9 计数器循环\n\n计数器循环根据计数器值进行迭代。如果达到了计数器值，则循环终止；否则，循环重复。流程图所示图\
  \ 4.8。\n\n![image](img/9789386235633_21.png)\n\n**图 4.8** 计数器循环的流程图\n\n## 4.10 条件循环\n\
  \n条件循环根据条件进行迭代。如果条件被求值为 FALSE，则循环终止；否则，循环重复。流程图所示图 4.9。\n\n![image](img/9789386235633_pt.png)\n\
  \n**图 4.9** 条件循环的流程图\n\n## 4.11 嵌套循环\n\n嵌套循环是指放在另一个循环内部的循环。内部循环在外层循环的每次迭代中完成其所有的迭代。\n\
  \n```python\nfor i in range(3):\n    for j in range(2):\n        print(i, j)\n```\n\
