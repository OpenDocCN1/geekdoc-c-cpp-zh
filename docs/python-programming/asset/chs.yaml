  \n## 8.13 局部变量与全局变量的作用域\n\n变量可以是两种类型。\n\n- 局部变量\nii. 全局变量\n\n局部变量是在用户定义函数内部定义的变量。局部变量仅在给的用户定义函数内部可用。\n\
  \n```python\ndef f1():\n    x=10\n    print(“local variable value in f1(): “,x)\n\
  \nf1()\n\nprint(“local variable value outside f1(): “,x)\n```\n**Output**\n```\n\
  D:\\PythonPrograms>python a1.py\nTraceback (most recent call last):\nFile “a1.py”,\
  \ line 6, in <module>\nprint(“local variable value outside f1(): “,x)\nNameError:\
  \ name ‘x’ is not defined\n```\n\n\n\n\n\n在上面的示例代码中，变量 `x` 是函数 `f1()` 的局部变量。在 `f1()`\
  \ 外部访问变量 `x` 会引发错误。为了解决这个问题，可以将变量 `x` 声明为全局变量。全局变量没有定义在任何函数中，可以在整个程序中被访问。对于局部变量，对其进行的更改仅在相应的函数内部有效。对于全局变量，在任何用户定义函数中进行的更改都将反映并对所有其他用户定义函数可见。下面的示例代码强调了全局变量的使用。\n\
  \n### 示例 1\n```python\nx=10\n\ndef f1():\n    print(\"global variable x value in\
  \ f1(): \",x)\n\nf1()\nprint(\"global variable x value outside f1(): \",x)\n```\n\
  **输出**\n```\nD:\\PythonPrograms>python a1.py\nglobal variable x value in f1(): 10\n\
  global variable x value outside f1(): 10\n```\n\n### 示例 2\n```python\nx=10\n\ndef\
  \ f1():\n    x=20\n    print(\"variable x value in f1(): \",x)\n\nf1()\nprint(\"\
  variable x value outside f1(): \",x)\n```\n**输出**\n```\nD:\\PythonPrograms>python\
  \ a1.py\nvariable x value in f1(): 20\nvariable x value outside f1(): 10\n```\n\n\
  ### 示例 3\n```python\ndef f1():\n    global x\n    x=20\n    print(\"variable x value\
  \ in f1(): \",x)\n\nf1()\nprint(\"variable x value outside f1(): \",x)\n```\n**输出**\n\
  ```\nD:\\PythonPrograms>python a1.py\nvariable x value in f1(): 20\nvariable x value\
  \ outside f1(): 20\n```\n\n### 使用 global 语句\n在 Python 中，`global` 语句用于将变量声明为全局变量。一旦变量被声明为全局变量，相应的变量就可以任何其他函数中可用。\n\
  \n```python\ndef f1():\n    global x\n    x=10\n    print(\"x value inside f1()\
  \ function: \", x)\n\nf1()\nprint(\"x value outside f1() function: \", x)\n```\n\
  **输出**\n```\nD:\\PythonPrograms>python b2.py\nx value inside f1() function: 10\n\
  x value outside f1() function: 10\n```\n\n### 命名解析\n在 Python 中，变量名的作用域解析遵循 `LEGB`\
  \ 规则。因此，对于一个变量名，初始搜索在局部（Local）命名空间中进行。如果没有找到该变量，则在闭包（Enclosed）命名空间中搜索。闭包命名空间包含包含函数或包裹函数中的变量。如果在闭包命名空间中未找到，则在全局（Global）命名空间中搜索。如果在全局命名空间中未找到，最后在内建（Built-in）命名空间中进行搜索。\n\
  \n表 8.1 汇总了全局变量和局部变量的属性。\n\n**表 8.1 全局变量与局部变量的比较**\n\n| 序号 | 局部变量 | 全局变量 |\n| :---\
  \ | :--- | :--- |\n| 1 | 变量声明在函数内部完成 | 变量声明在程序中完成 |\n| 2 | 变量的作用域仅限于声明的函数。 | 变量的作用域限于整个程序。\
  \ |\n| 3 | 变量的值只能在声明的函数内访问。 | 变量的值可以被整个程序访问 |\n\n## 8.14 文档字符串 (Documentation Strings)\n\
  Python 中的文档字符串也称为“docstrings”。它为在 Python 程序中提供文档的一种高效方法。在 Python 中，所有函数都可以拥有 docstrings。它与注释相似，但\
  \ docstring 被视为字符串常量，并描述了函数的功能。Docstrings 具有以下特征：\n\n- 它以 `\"\"\"` 开头和结束\n- 第一个字母应该是大写字母。\n\
  - docstring 应该以 `.` 结尾。\n- 如果 docstring 包含多行，则第二行应该留空。\n- 使用 `__doc__` 来访问 docstring\
  \ 的值。\n\n### 示例 4\n```python\ndef fun1():\n    \"\"\"This is docstring line1.\"\"\
  \"\n    pass\n\nprint(fun1.__doc__)\n```\n**输出**\n```\nD:\\PythonPrograms\\aa>python\
