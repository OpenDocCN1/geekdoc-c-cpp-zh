  []\n10\n[10]\n```\n\n## 5.12 添加列表元素\n\n在列表中，可以使用内置函数添加新元素。这些内置函数如下：\n\n- `append()`\
  \ 方法用于将新列表作为当前列表对象的子列表添加。\n\n```python\n>>> l1=[\"a\",\"b\",\"c\"]\n>>> l2=[\"d\"\
  ,\"e\"]\n>>> l1.append(l2)\n>>> l1\n['a', 'b', 'c', ['d', 'e']]\n>>> l1[0]\n'a'\n\
  >>> l1[1]\n'b'\n>>> l1[2]\n'c'\n>>> l1[3]\n['d', 'e']\n>>> l1[3][0]\n'd'\n>>> l1[3][1]\n\
  'e'\n```\n\n- `extend()` 方法类似于 `append()` 方法，区别在于新列表元素不是作为子列表添加的。\n\n```python\n\
  >>> l1=[\"a\",\"b\",\"c\"]\n>>> l2=[\"d\",\"e\"]\n>>> l1.extend(l2)\n>>> l1\n['a',\
  \ 'b', 'c', 'd', 'e']\n>>> l1[0]\n'a'\n>>> l1[1]\n'b'\n>>> l1[4]\n'e'\n```\n\n-\
  \ `count()` 方法用于统计元素在当前列表对象出现的频率。\n\n```python\n>>> s=[4,8,1,9,2,4,7,1]\n>>> s\n\
  [4, 8, 1, 9, 2, 4, 7, 1]\n>>> s.count(1)\n3\n>>> s.count(7)\n1\n```\n\n- `index()`\
  \ 方法将返回输入元素在列表中的索引。如果列表中存在重复元素，则返回最小索引值。\n\n```python\n>>> x=[\"abc\",\"def\",\"\
  abc\",\"ghi\"]\n>>> x.index(\"abc\")\n0\n>>> x.index(\"ghi\")\n3\n```\n\n- `insert()`\
  \ 方法用于在指定的索引位置向当前列表添加新列表对象。\n\n```python\n>>> x=[\"abc\",\"def\",\"abc\",\"ghi\"\
  ]\n>>> x\n['abc', 'def', 'abc', 'ghi', 'abc']\n>>> y=[\"hello\"]\n>>> y\n['hello']\n\
  >>> x.insert(3,y)\n>>> x\n['abc', 'def', 'abc', ['hello'], 'ghi', 'abc']\n```\n\n\
  - `pop()` 方法删除列表中指定索引的元素。\n\n- `remove()` 方法删除列表中给定的元素。\n\n- `reverse()` 方法用于反转列表中元素的顺序。\n\
  \n- `sort()` 方法返回升序排序的列表。\n\n## 5.13 可变性\n\n在 Python 中，可变性允许更新数据对象。可变对象可以通过新元素进行修改，而不可变元素不接受任何修改。例如，字符串对象是不变对象，修改字符串会导致错误。\n\
  \n```python\n>>> s1=\"def\"\n>>> s1\n'def'\n>>> s1[0]\n'd'\n>>> s1[0]=\"a\"\nTraceback\
  \ (most recent call last):\nFile \"<stdin>\", line 1, in <module>\nTypeError: 'str'\
  \ object does not support item assignment\n```\n\n各种不可变数据类型包括 int、float、complex、string、tuple、frozenset\
  \ 和 bytes。各种可变数据类型包括 list、bytearray、set、dictionary、class 和类实例。\n\n列表项是可变对象。因此，它们可以修改。\n\
  \n```python\n>>> x=[5,1,9,2]\n>>> x.sort()\n>>> x\n[1, 2, 5, 9]\n>>> x.reverse()\n\
  >>> x\n```\n\n\n\n\n```python\n[9, 5, 2, 1]\n>>> x.remove(9)\n>>> x\n[5, 2, 1]\n\
  >>> x.pop()\n1\n```\n\n- `sort()` 方法用于对当前列表对象的元素进行排序。\n- `reverse()` 方法用于返回当前列表对象的反转列表。\n\
  - `remove()` 方法将删除当前列表对象中的指定元素。\n- `pop()` 方法用于弹出栈顶的元素。\n\n## 5.14 列表解包\n\n列表元素可以被解包并存储在对应的变量中。为了避免在输入列表中进行赋值，可以使用\
  \ `*_`。\n\n**输出**\n\n```\nD:\\PythonPrograms\\aa>python a2.py\n(1, 2, 3)\n1\n2\n\
  \nx=(1,2,3)\ny,z,*_=x\nprint(x)\nprint(y)\nprint(z)\n```\n\n## 5.15 栈\n\n栈是一种用于按照后进先出（LIFO）顺序维护数据的数据结构。在栈中，可以执行两种操作：`push()`\
  \ 和 `pop()`。`push()` 操作用于将数据元素插入栈中。`pop()` 操作用于从栈中移除数据元素。执行 `push()` 和 `pop()` 操作时，位置表示为\
  \ `TOP`（栈顶）。栈的各种操作如图 5.1 所示。\n\n![image](img/9789386235633_24.png)\n\n**图 5.1**\
  \ (a) 初始栈 (b) `push(10,20,30)` (c) `pop()`\n\n在图 5.1 (a)中，显示了没有值的原始栈。当栈内部为空时，`TOP`\
  \ 的值为 -1。如果元素被推入栈，则 `TOP` 将增加，并在对应位置推入值，如图 5.1(b)所示。当元素从栈中弹出时，`TOP` 将自动减小，如图 5.1(c)所示。\n\
  \n```python\ns=[]\ntop=-1\nwhile(1):\n    print(\"Menu for Stack operations:\")\n\
  \    print(\"1. Push\")\n    print(\"2. Pop\")\n    print(\"3. Display\")\n    print(\"\
  4. Exit:\")\n    ch=int(input(\"Enter the choice:\"))\n    if(ch==1):\n        top=top+1\n\
  \        x=int(input(\"Enter the number:\"))\n        s.insert(top,x)\n    elif(ch==2):\n\
  \        y=s.pop()\n        print(\"The popped element: \",y)\n        top=top-1\n\
  \    elif(ch==3):\n        print(\"Stack:\",s)\n    elif(ch==4):\n        exit()\n\
  \    else:\n        print(\"Invalid Choice:\")\n```\n\n**输出**\n\n```\nD:\\PythonPrograms>python\
  \ st.py\nMenu for Stack operations:\n1. Push\n2. Pop\n3. Display\n4. Exit:\nEnter\
  \ the choice:1\nEnter the number:10\nMenu for Stack operations:\n1. Push\n2. Pop\n\
  3. Display\n4. Exit:\nEnter the choice:3\nStack: [10]\nMenu for Stack operations:\n\
  1. Push\n2. Pop\n3. Display\n4. Exit:\nEnter the choice:1\nEnter the number:20\n\
  Menu for Stack operations:\n1. Push\n2. Pop\n3. Display\n4. Exit:\nEnter the choice:3\n\
  Stack: [10, 20]\nMenu for Stack operations:\n1. Push\n2. Pop\n3. Display\n4. Exit:\n\
  Enter the choice:2\nThe popped element: 20\nMenu for Stack operations:\n1. Push\n\
