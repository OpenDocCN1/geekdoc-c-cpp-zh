  6. AttributeError: 'builtin_function_or_method' object has no attribute 'mul'\n\
  7. TypeError: can’t multiply sequence by non-int\n\n\n\n\n\n在 Python 中，数据封装允许将实例变量和方法打包，以限制对某些类成员的访问。它将数据和函数封装在一个地方，并通过\
  \ `class` 实现。类同时包含数据和函数。类中的数据用变量表示，并被称为类的成员（members）。可以操作这些成员的函数被称为方法（methods）。在类中，我们可以同时编写成员和方法。\n\
  \n当定义一个包含成员和方法的类时，内存不会被分配。因此，仅通过类定义，我们无法访问类的属性。为了解决这个问题，应该为该类创建一个对象。当对象创建时，内存会被分配。这时，通过这个对象，就可以访问类的属性了。\n\
  \n## 10.2 类体\n\n在 Python 编程中，通过 `class` 支持数据封装。类由数据和函数组成。类中的数据被称为成员，而类中的函数被称为方法。类的定义如下：\n\
  \n```python\nclass class_name:\n    statement1_class\n    statement2_class\n   \
  \ statement3_class\n    statementn_class\n    ....................\n```\n\n类中的语句由数据或函数组成。下面给了一个包含成员的类示例代码。\n\
  \n```python\nclass ex:\n    x=100\n    y=”abadffa”\n    print(“Member value of x=\
  \ “,ex.x)\n    print(“Member value of y= “,ex.y)\n```\n\n**输出**\n```\nD:\\PythonPrograms>python\
  \ a1.py\nMember value of x= 100\nMember value of y= abadffa\n```\n\n## 10.3 对象\n\
  \n在 Python 编程中，可以通过两种不同的方式创建类的对象。它们是：\n\n- 属性引用（Attribute referencing）\n- 实例化（Instantiation）\n\
  \n### 属性引用\n\n在属性引用中，可以使用类名本身访问 Python 类的属性。属性引用的语法为：\n\n`class_name:propertyname`\n\
  \n```python\nclass ex:\n    x=[]\n    ex.x=input(“Enter the value of member x: “)\n\
  \    print(“The value of ex.x is= “,ex.x)\n```\n\n**输出**\n```\nD:\\PythonPrograms>python\
  \ a1.py\nEnter the value of member x: 355\nThe value of ex.x is= 355\n```\n\n###\
  \ 实例化\n\n在实例化过程中，会创建一个空对象并将该对象赋值给定的对象名称。类实例化的语法为：\n\n`object_name=class_name()`\n\
  \n创建类实例后，使用以下语法访问类的属性：\n\n`object_name:propertyname`\n\n下面给出了类实例化的示例代码。\n\n```python\n\
  class ex:\n    x=[]\n    a=ex();\n    a.x=input(“Enter the value of member x: “)\n\
  \    print(“The value of a.x is= “,a.x)\n```\n\n**输出**\n```\nD:\\PythonPrograms>python\
  \ a1.py\nEnter the value of member x: hello\nThe value of a.x is= hello\n```\n\n\
  ## 10.4 类方法\n\n类用于封装函数的数据。函数将对类中提供的数据进行操作。在类中定义的函数被称为方法。在 Python 编程中，函数的定义语法如下：\n\
  \n```python\ndeffunction_name(arguments_list):\n    statement_1\n    statement_2\n\
  \    ...............\n    statement_n\n```\n\n类方法也遵循普通函数的语法。但类方法必须定义在类内部。类方法的语法如下：\n\
  \n```python\nclass class_name:\n    statements_classbody\n    deffunction_name(arguments_list):\n\
  \        statement_1\n        statement_2\n        ...............\n        statement_n\n\
  \    statements_classbody\n```\n\n类方法也可以通过属性引用或实例化来访问。下面是使用属性引用访问类方法的示例代码。\n\n```python\n\
  class ex:\n    def f1():\n        print(“This is class method”)\n    ex.f1()\n```\n\
  \n**输出**\n```\nD:\\PythonPrograms>python a1.py\nThis is class method\n```\n\n下面是类实例化的示例。\n\
  \n```python\nclass ex:\n    def f1():\n        print(“This is class method”)\n \
  \   a=ex()\n    a.f1()\n```\n\n**输出**\n```\nD:\\PythonPrograms>python a1.py\nTraceback\
  \ (most recent call last):\nFile “a1.py”, line 6, in <module>\na.f1()\nTypeError:\
  \ f1() takes 0 positional arguments but 1 was given\n```\n\n上面的程序用于通过类实例化访问类方法。但程序抛出了错误。为了解决这个问题，类方法始终应该至少接收当前对象作为参数。\n\
  \n```python\nclass ex:\n    def f1(ex):\n        print(“This is class method”)\n\
  \    a=ex()\n    a.f1()\n```\n\n**输出**\n```\nD:\\PythonPrograms>python a1.py\nThis\
  \ is class method\n```\n\n## 10.5 Self 变量\n\n在 C++ 和 Java 语言中，使用 `this` 指针指向当前对象。在\
  \ Python 编程中，使用 `self` 指针指向当前对象。通过 `self` 指针，可以访问类的所有属性（即成员）。\n\n\n\n\n\n# 处理类属性的内置函数\n\
  \n用于处理类属性的内置函数有：\n\n- `hasattr(obj, name)`\n- `getattr(obj, name[, default])`\n\
  - `setattr(obj, name, value)`\n- `delattr(obj, name)`\n\n### `hasattr()`\n`hasattr()`\
  \ 函数检查给定的属性是否存在于给定类的属性中。对于该函数，第一个参数应该是类对象，第二个参数应该是属性名。\n\n```python\nclass ex:\n\
  a=100\n\nobj1=ex()\nprint(hasattr(obj1,'a'))\n```\n**输出**\n```\nD:\\PythonPrograms>python\
  \ b2.py\nTrue\n```\n\n### `getattr()`\n`getattr()` 函数返回给定类中给定属性的值。第一个参数应该是类对象，第二个参数应该是属性名。\n\
  \n```python\nclass ex:\na=100\n\nobj1=ex()\nprint(getattr(obj1,'a'))\n```\n**输出**\n\
  ```\nD:\\PythonPrograms>python b2.py\n100\n```\n\n### `setattr()`\n`setattr()` 函数将给定类中给定属性的值设置为给值。第一个参数应该是类对象，第二个参数应该是属性名，第三个参数应该是属性的新值。\n\
  \n```python\nclass ex:\na=100\n\nobj1=ex()\nprint(getattr(obj1,'a'))\nsetattr(obj1,'a',200)\n\
  print(getattr(obj1,'a'))\n```\n**输出**\n```\nD:\\PythonPrograms>python b2.py\n100\n\
  200\n```\n\n### `delattr()`\n`delattr()` 函数删除给定类中的给定属性。第一个参数应该是类对象，第二个参数应该是属性名。\n\
  \n```python\nclass ex:\na=100\nb=200\n\nobj1=ex()\nprint(getattr(obj1,'a','b'))\n\
  delattr(obj1,'a')\nprint(getattr(obj1,'a'))\n```\n**输出**\n```\nD:\\PythonPrograms>python\
  \ b2.py\n100\nTraceback (most recent call last):\nFile “b2.py”, line 7, in <module>\n\
  delattr(obj1,'a')\nAttributeError: a\n```\n\n# 公有方法和私有方法\n\n在类中，方法有两种类型——公有方法和私有方法。公有方法可以在类内外访问。私有方法只能在类内部访问。私有方法应以双下划线\
  \ `__` 开头。\n\n```python\nclass ex:\ndef __init__(self,arg):\n    self.a=arg\n\n\
  def __read(self):\n    self.a=input(\"Enter the new value of a: \")\n\ndef disp(self):\n\
  \    print(\"The value of a= \",self.a)\n\nobj1=ex(300)\nobj1.__read()\nobj1.disp()\n\
  ```\n**输出**\n```\nD:\\PythonPrograms>python b2.py\nTraceback (most recent call last):\n\
  File “b2.py”, line 12, in <module>\nobj1.__read()\nAttributeError: ‘ex’ object has\
  \ no attribute ‘__read’\n```\n在上面的程序中，`read()` 方法是私有方法，`disp()` 方法是公有方法。在类外部调用私有方法，因此会导致错误。\n\
  \n```python\nclass ex:\ndef __init__(self,arg):\n    self.a=arg\n\ndef __read(self):\n\
  \    self.a=input(\"Enter the new value of a: \")\n\ndef disp(self):\n    obj1.__read()\n\
  \    print(\"The value of a= \",self.a)\n\nobj1=ex(300)\nobj1.disp()\n```\n**输出**\n\
  ```\nD:\\PythonPrograms>python b2.py\nEnter the new value of a: 500\nThe value of\
  \ a= 500\n```\n\n# 特殊函数\n\n在 Python 类中，可以定义各种特殊函数。其中包含：\n\n- `__repr__()`\n- `__cmp__()`\n\
  - `__len__()`\n\n### `__repr__()`\n`__repr__()` 是一个用于返回可打印格式对象的方法。\n\n```python\n\
  class ex:\ndef __init__(self,arg):\n    self.a=arg\n\ndef __repr__(self):\n    return(\"\
  the object value is %s\" %(self.a))\n\nobj1=ex(300)\nprint(obj1)\n```\n**输出**\n\
  ```\nD:\\PythonPrograms>python b2.py\nthe object value is 300\n```\n\n### `__cmp__()`\n\
  `__cmp__()` 方法用于比较两个输入对象。当两个对象不相等时，返回 `False`。如果两个对象相等，则返回 `True`。\n\n```python\n\
  class ex:\ndef __init__(self,arg):\n    self.a=arg\n\ndef __repr__(self):\n    return(\"\
  the object value is %s\" %(self.a))\n\ndef __cmp__(self,other):\n    return(cmp(self.a,other.a))\n\
  \nobj1=ex(300)\nobj2=ex(400)\nprint(obj1)\nprint(obj2)\nif(obj1==obj2):\n    print(\"\
  The obj1 and obj2 are not equal\")\n```\n**输出**\n```\nD:\\PythonPrograms>python\
  \ b2.py\nthe object value is 300\nthe object value is 400\nFalse\n```\n\n### `__len__()`\n\
  `len()` 函数返回输入序列或映射对象的长度。`__len__()` 是一个可以在类中定义的特殊方法。\n\n```python\nclass ex:\n\
  def __init__(self,arg):\n    self.a=arg\n\ndef __len__(self):\n    # implementation\
  \ here\n    pass\n```\n\n\n\n\n\n在上述程序中，为类 `ex` 创建了两个对象，即 `obj1` 和 `obj2`。这两个对象调用了方法\
  \ `n`。随后，对象 `obj1` 被删除了。因此，使用对象 `obj1` 调用方法 `f1()` 会引发错误。\n\n### 10.10 构造函数\n\n\
  在 Python 编程中，`__init__` 方法会在对象创建期间执行。因此，该方法被用作类的构造函数。`__init__` 方法或构造函数用于初始化类变量。构造方法始终应该将\
  \ `self` 指针作为第一个参数。其余参数将在对象创建时传递。下面给出了构造函数的示例。\n\n```python\nclass ex:\n    def\
  \ __init__(self,arg):\n        self.a=arg\n\nobj1=ex(300)\nprint(“Value defined\
  \ by the constructor= “,obj1.a)\n```\n\n***Output***\n```\nD:\\PythonPrograms>python\
  \ a1.py\nValue defined by the constructor= 300\n```\n\n### 10.11 方法重写\n\n在 Python\
  \ 编程中，方法重写允许子类和基类中存在相同的方法。在方法重写的情况下，子类对象始终指向子类中提供的定义。基类的定义被子类的定义所覆盖。方法重写的示例所示：\n\
  \n```python\nclass super:\n    def disp(self):\n        print(“Super class method”)\n\
  \nclass sub:\n    def disp(self):\n        print (“Sub class method”)\n\nx=sub()\n\
  x.disp()\n```\n\n***Output***\n```\nD:\\PythonPrograms>python a1.py\nSub class method\n\
  ```\n\n### 10.12 继承\n\n继承用于将一个类的属性派生到另一个类。通常情况下，基类的属性可以派生到子类中。因此，子类包含了基类的属性以及自身的属性。\n\
  \nPython 中有三种继承类型。它们是：\n- 单继承\n- 多重继承\n- 多级继承\n\n### 单继承\n\n在单继承中，子类可以只能派生自一个基类的属性。单继承的语法所示：\n\
  \n```python\nclass base_class:\n    #body of base class\nclass subclass_name(base_class):\n\
  \    #body of the subclass\n```\n\n单继承在图 10.4 中所示。\n\n![image](img/9789386235633_30.png)\n\
  **图 10.4** 单继承的表示\n\n单继承的示例下所示。\n\n```python\nclass a:\n    x=200\nclass b(a):\n\
  \    y=300\n    def f1(self):\n        print(“Properties of sub class: “,self.x,self.y)\n\
  \nobj1=b()\nobj1.f1()\n```\n\n***Output***\n```\nD:\\PythonPrograms>python a1.py\n\
  Properties of sub class: 200 300\n```\n\n基类的隐藏属性无法派生到子类中。如果尝试使用它们，将引发错误。\n\n###\
  \ 多重继承\n\n在多重继承中，子类派生自多个基类的属性。多个基类之间用逗号“，”分隔。多重继承的语法所示：\n\n```python\nclass base_class1:\n\
  \    #body of base class1\nclass base_class2:\n    #body of base class2\nclass subclass_name(base_class1,base_class2):\n\
  \    #body of the sub class\n```\n\n多重继承在图 10.5 中所示。\n\n![image](img/9789386235633_31.png)\n\
  **图 10.5** 多重继承的表示\n\n多重继承的示例下所示。\n\n```python\nclass a:\n    x=200\nclass b:\n\
  \    y=100\nclass c(a,b):\n    z=300\n    def f1(self):\n        print(“Properties\
  \ of sub class: “,self.x,self.y,self.z)\n\nobj1=c()\nobj1.f1()\n```\n\n***Output***\n\
  ```\nD:\\PythonPrograms>python a1.py\nProperties of sub class: 200 100 300\n```\n\
  \n#### 多级继承\n\n在多级继承中，`base_class1` 的属性派生到 `subclass1`。`subclass1` 的属性派生到 `subclass2`。多级继承的语法所示：\n\
  \n```python\nclass base_class1:\n    #body of base class1\nclass sub_class1(base_class1):\n\
  \    #body of subclass1\nclass subclass_name2(sub_class1):\n    #body of the sub\
  \ class2\n```\n\n多级继承在图 10.6 中所示。\n\n![image](img/9789386235633_32.png)\n**图 10.6**\
  \ 多级继承的表示\n\n示例代码下所示。\n\n```python\nclass a:\n    x=200\n    def disp(self):\n \
  \       print(“Properties of base class1: “,self.x)\nclass b(a):\n    y=300\n  \
  \  def f1(self):\n        self.disp()\n        print(“Properties of sub class1:\
  \ “,self.y)\nclass c(b):\n    z=300\n    def f2(self):\n        self.f1()\n    \
  \    print(“Properties of sub class3: “,self.z)\n\nobj1=c()\nobj1.f2()\n```\n\n\
  ***Output***\n```\nD:\\PythonPrograms>python a1.py\nProperties of base class1: 200\n\
  Properties of sub class1: 300\nProperties of sub class3: 300\n```\n\n\n\n\n\n# 10.13\
  \ 组合或包含或复杂对象\n\n组合允许通过其他类的对象来定义一个类。例如，在类 `a` 的定义中，如果包含了类 `b` 的对象，则这被称为“组合”。在这种情况下，类\
  \ `a` 被称为容器类，类 `b` 被称为内容类。容器类的对象被称为复杂对象。\n\n```python\nclass a:\n    def __init__(self,m):\n\
  \        self.x=m\n    def getx(self):\n        return(self.x)\n\nclass a:\n   \
  \ def __init__(self,m):\n        self.x=m\n    def getx(self):\n        return(self.x)\n\
  ```\n\n***Output***\n```\nD:\\PythonPrograms>python b2.py\n15\n```\n\n在上面的程序中，类\
  \ `a` 是内容类，类 `b` 是容器类。如果容器类的对象被删除，那么内容类的对象也会被删除。\n\n# 10.14 抽象类与接口\n\n抽象类是不允许创建对象的类。抽象类应该包含抽象方法。抽象类中不提供抽象方法的定义，而是在实现的子类中提供的。在\
  \ Python 中，`abc` 模块提供了对抽象类的支持。将一个方法声明为抽象方法使用 `@abstractmethod` 语句。在 Python 中，接口只能通过抽象类定义。\n\
  \n```python\nfromabc import abstractmethod\n\nclass a:\n    @abstractmethod\n  \
  \  def getx(self): pass\n\nclass b(a):\n    def getx(self):\n        print(“abstract\
  \ method is implemented in sub class”)\n\nobj2=b()\nobj2.getx()\n```\n\n***Output***\n\
  ```\nD:\\PythonPrograms>python b2.py\nabstract method is implemented in sub class\n\
  ```\n\n在上面的示例中，类 `a` 被视为抽象类或接口。类 `b` 实现了接口。`getx()` 方法是抽象类中的抽象方法，它没有任何定义。因此，抽象方法的定义是在实现类\
  \ `b` 中提供的。\n\n# 10.15 元类 (Metaclass)\n\n元类是类的类。通常，`type()` 函数返回类型为“class”，而使用元类功能时，`type()`\
  \ 函数返回元类的名称作为响应。它包含 `new()` 和 `__init__()` 方法。\n\n```python\nclass abc:\n    def\
  \ __init__(self):\n        pass\n\nclass pqr(type):\n    pass\n\nclass xyz(metaclass=pqr):\n\
  \    def __init__(self):\n        pass\n\nprint(type(abc))\nprint(type(xyz))\n```\n\
  \n***Output***\n```\nD:\\PythonPrograms>python b2.py\n<class ‘type’>\n<class ‘__main__.pqr’>\n\
  ```\n\n# 10.16 运算符重载\n\nPython 中常见的运算符重载方法包括索引和切片、迭代对象、属性访问、字符串表示、右侧和原地使用、调用表达式、比较、布尔测试和对象破坏。在\
  \ Python 编程中，所有运算符都通过魔法方法执行。魔法方法是用于执行运算符重载的特殊方法。它也被**双下方法 (dunder method)**。对于每个运算符，Python\
  \ 解释器都会执行对应的函数。`+` 运算符语法的魔法方法如下所示。\n\n```python\nobject.__add__(self, other)\n```\n\
  \n例如，“a+b”语句被转换为\n```python\na.__add__(self,b)\n```\n`a` 和 `b` 被视为数字对象。\n\n其他方法是\
  \ `__sub__`、`__mul__` 和 `__div__`。要在 Python 中重载运算符，我们可以为对应的魔法方法提供新定义。下面给出了添加两个类对象的示例代码。\n\
  \n```python\nclass ex:\n    def __init__(self,a=0):\n        self.var1=a\n    def\
  \ __add__(self,obj2):\n        return self.var1+obj2.var1\n    def disp(self):\n\
  \        print(“The value of var1= “,self.var1)\n\nx=ex(100)\ny=ex(200)\nx.disp()\n\
  y.disp()\nz=x+y\nprint(“The value of overloaded + operator= “,z)\n```\n\n***Output***\n\
  ```\nD:\\PythonPrograms>python a1.py\nThe value of var1= 100\nThe value of var1=\
  \ 200\nThe value of overloaded + operator= 300\n```\n\n通过运算符重载，用户可以为同一个运算符提供多个定义。因此，运算符重载是\
  \ Python 中实现多态的方式之一。这种多态被称为“特设多态 (adhoc polymorphism)”。\n\n### 示例 1\n```python\n\
  class ex:\n    def __init__(self):\n        self.var1=[10,20]\n    def __add__(self,obj2):\n\
  \        l=list()\n        for i in range(0,len(self.var1)):\n            l.append(self.var1[i]+obj2.var1[i])\n\
  \        return(l)\n    def disp(self):\n        print(“The value of var1= “,self.var1)\n\
  \nx=ex()\ny=ex()\nx.disp()\ny.disp()\nz=x+y\nprint(“The value of overloaded + operator=\
  \ “,z)\n```\n\n***Output***\n```\nD:\\PythonPrograms>python b2.py\nThe value of\
  \ var1= [10, 20]\nThe value of var1= [10, 20]\nThe value of overloaded + operator=\
  \ [20, 40]\n```\n\n### 示例 2\n```python\nclass ex:\n    def __init__(self,a):\n \
  \       self.var1=a\n    def __add__(self,obj2):\n        return(self.var1+“ ”+obj2.var1)\n\
  \    def disp(self):\n        print(“The value of var1= “,self.var1)\n\nx=ex(«good»)\n\
  y=ex(«morning»)\nx.disp()\ny.disp()\nz=x+y\nprint(“The value of overloaded + operator=\
  \ “,z)\n```\n\n***Output***\n```\nD:\\PythonPrograms>python b2.py\nThe value of\
  \ var1= good\nThe value of var1= morning\nThe value of overloaded + operator= good\
  \ morning\n```\n\n### 10.16.1 反向加\n\n在运算符重载期间，重载的运算符可以按照其定义指定的顺序工作。例如，如果 `+` 运算符通过\
  \ `__add__()` 方法重载，那么重载的运算符只能按照其定义工作。如果 A 和 B 是两个对象，则使用 `__add__()` 根据其方法定义执行 `A+B`\
  \ 操作。在这种情况下，带有 `__add__()` 重载的运算符不负责执行反向操作 `B+A`。\n\n```python\nclass ex:\n    def\
  \ __init__(self,a):\n        self.var1=a\n    def __add__(self,a):\n        return(self.var1+a)\n\
  \    def disp(self):\n        print(The value of var1= “,self.var1)\n\nx=ex(10)\n\
  x.disp()\nz=x+2\nprint ofThe value of\n\n\n\nz\n\n\n\n\n\n\n\n\n\n\n\n\n> of\n1\n\
  11\nThe value of11 = 12\nTraceback (most recent call last):\nFile “b2.py”, line\
  \ 19, in <module>\nm=2+x\nTypeError: unsupported operand type(s) for +: ‘int’ and\
  \ ‘ex’\n```\n\n在上面的程序中，`2` 的值被加上 `x`。当尝试执行 `2+x` 时会报错。\n\nPython 支持运算符的反向操作。为了执行反向加，应该使用\
  \ `__radd__()` 方法。\n\n```python\nclass ex:\n    def __init__(self,a):\n        self.var1=a\n\
  \    def __add__(self,a):\n        return(self.var1+a)\n    def __radd__(self,a):\n\
  \        return(self.var1+a)\n    def disp(self):\n        print(“The value of var1=\
  \ “,self.var1)\n\nx=ex(10)\ny=ex(20)\nx.disp()\ny.disp()\nz=x+2\nprint(“The value\
  \ of X+2= “,z)\nm=2+x\nprint(“The value of 2+X= “,m)\n```\n\n***Output***\n```\n\
  D:\\PythonPrograms>python b2.py\nThe value of var1= 10\nThe value of var1= 20\n\
  The value of X+2= 12\nThe value of 2+X= 12\n```\n\n### 10.16.2 getitem() 和 setitem()\n\
  \nPython 支持两个内置函数，`getitem()` 和 `setitem()`。`getitem(listobj,index)` 用于返回输入列表中索引位置的元素。`setitem(listobj,index,value)`\
  \ 用于将值赋值给列表的索引位置。Python 允许重载这两个内置函数。通过重载，这两个函数也可以应用于类对象。\n\n```python\nclass ex:\n\
  \    def __init__(self,a):\n        self.var1=a\n    def __getitem__(self,a):\n\
  \        print(“the item at “,a+1,” position is= “,self.var1[a])\n    def __setitem__(self,a,b):\n\
  \        self.var1[a]=b\n    def disp(self):\n        print(“The value of var1=\
  \ “,self.var1)\n\nx=ex([10,20])\nx.disp()\nx[0]\nx[1]=100\nx.disp()\n```\n\n***Output***\n\
  ```\nD:\\PythonPrograms>python b2.py\nThe value of var1= [10, 20]\nthe item at 1\
  \ position is= 10\nThe value of var1= [10, 100]\n```\n\n### 10.16.3 成员运算符\n\n\n\n\
  \n\nPython 编程包含两个成员运算符。这些运算符用于检查给定的元素是否为输入元素集合的成员。这两个成员运算符是 `in` 和 `not in`。这两个运算符也可以对对象进行重载。要重载成员运算符，应该在类中定义\
  \ `__contains__()` 方法。\n\n```python\nclass ex:\n    def __init__(self,a):\n    \
  \    self.var1=a\n    def __contains__(self,b):\n        if(b in self.var1):\n \
  \           return(True)\n        else:\n            return(False)\n    def disp(self):\n\
  \        print(\"The value of var1= \",self.var1)\n\nx=ex([10,20,30])\nx.disp()\n\
  print(30 in x)\nprint(10 not in x)\n```\n**输出**\n```\nD:\\PythonPrograms>python\
  \ b2.py\nThe value of var1= [10, 20, 30]\nTrue\nFalse\n```\n\n## 10.16.4 杂杂函数\n\n\
  在 Python 编程中，也可以重载各种杂杂函数。\n\n### 1. `abs()` 函数用于返回绝对值。该函数可以通过 `__abs__()` 方法进行重载。\n\
  \n```python\nclass ex:\n    def __init__(self,a):\n        self.var1=a\n    def\
  \ __abs__(self):\n        for i in range(0,len(self.var1)):\n            self.var1[i]=abs(self.var1[i])\n\
  \    def disp(self):\n        print(\"The value of var1= \",self.var1)\n\nx=ex([-10,\
  \ -20])\nx.disp()\nabs(x)\nx.disp()\n```\n**输出**\n```\nD:\\PythonPrograms>python\
  \ b2.py\nThe value of var1= [-10, -20]\nThe value of var1= [10, 20]\n```\n\n###\
  \ 2. `float()` 函数用于将整数参数转换为 float 类型。使用 `__float__()` 来重载 `float()` 函数。\n\n```python\n\
  class ex:\n    def __init__(self,a):\n        self.var1=a\n    def __float__(self):\n\
  \        return(float(self.var1))\n    def disp(self):\n        print(\"The value\
  \ of var1= \",self.var1)\n\nx=ex(3)\nx.disp()\nprint(float(x))\n```\n**输出**\n```\n\
  D:\\PythonPrograms>python b2.py\nThe value of var1= 3\n3.0\n```\n\n### 3. `pow(a,b)`\
  \ 函数用于计算 $a^b$使用 `__pow__()` 来重载 `pow()` 函数。\n\n```python\nclass ex:\n    def __init__(self,a):\n\
  \        self.var1=a\n    def __pow__(self,a):\n        for i in range(0,len(self.var1)):\n\
  \            self.var1[i]=pow(self.var1[i],a)\n    def disp(self):\n        print(\"\
  The value of var1= \",self.var1)\n\nx=ex([3, 4])\nx.disp()\npow(x,2)\nx.disp()\n\
  ```\n**输出**\n```\nD:\\PythonPrograms>python b2.py\nThe value of var1= [3, 4]\nThe\
  \ value of var1= [9, 16]\n```\n\n### 4. Python 编程有函数调用运算符。该运算符可以通过 `__call__()`\
  \ 进行重载。对于对象的每次函数调用，都可以执行此重载方法。\n\n```python\nclass ex:\n    def __init__(self,a):\n\
  \        self.var1=a\n    def __pow__(self,a):\n        for i in range(0,len(self.var1)):\n\
  \            self.var1[i]=pow(self.var1[i],a)\n    def disp(self):\n        print(\"\
  The value of var1= \",self.var1)\n    def __call__(self,a,b=0):\n        print(\"\
  the __call__() is called\")\n\nx=ex(3)\nx.disp()\nx(1)\nx(1,2)\n```\n**输出**\n```\n\
  D:\\PythonPrograms>python b2.py\nThe value of var1= 3\nthe __call__() is called\n\
  the __call__() is called\n```\n\n## 10.17 垃圾回收\n\n在 Python 中，当对象初始化时，内存会自动分配。Python\
  \ 中的内存释放也是自动的。为了这一点，它使用了两种类型的技术。它们是：\n\n- **引用计数**：在引用计数中，为每个对象都维护一个计数器。如果其他任何对象引用当前对象，则当前对象的计数器加\
  \ 1。当对当前对象的引用移除时，其计数器减 1。如果计数值为零，则自动释放相应的对象。虽然这个过程的使用是高效的，但它存在引用循环问题，即对象之间存在依赖关系，当存在强引用时，它们无法被释放。\n\
  - **垃圾回收**：为了克服引用循环问题，使用了垃圾回收。在 Python 中，垃圾回收过程的阈值是预先定义的。如果分配和释放的对象之间的差值大于阈值，则自动执行垃圾回收。Python\
  \ 使用 `gc` 模块执行垃圾回收过程。\n\n## 10.18 示例程序\n\n**程序 1**：编写一个 Python 程序来打印“hello”。**提示**：在创建对象时，构造函数会被调用。\n\
