  PythonPrograms>python s1.py\nhello 1\nthis 2\nfirst 1\nline 2\nhai 1\nsecond 1\n\
  ```\n\n## 13.7 序列化与反序列化\n\n序列化是一个减少数据丢失的过程。在这个过程中，数据不是以名称维护，而是以对象的形式维护。反序列化是序列化的逆过程。它从相应的对象中解组数据。在\
  \ Python 编程中，序列化和反序列化过程通过 `pickle` 模块实现的。该模块包含了对 Python 对象进行序列化和反序列化的各种方法。在序列化过程中，对象被转换为字节流；而在反序列化过程中，字节流被转换为对象。`pickle`\
  \ 模块中的各种函数如下。\n\n■ `dump()` 函数用于执行序列化过程。\n\n```python\nimport pickle\nfruits = [“apple”,\
  \ “orange”, “banana”, “grape”,”papya”]\nfh = open(“ser1.txt”, “wb”)\npickle.dump(fruits,\
  \ fh)\nprint(“Serilization process is completed”)\nfh.close()\n```\n\n**输出**\n```\n\
  D:\\PythonPrograms>python a1.py\nSerilization process is completed\n```\n\n■ 反序列化过程通过\
  \ `load()` 函数执行。\n\n```python\nimport pickle\nfile1 = open (“ser1.txt”, “rb”)\n\
  f = pickle.load(file1)\nprint(“The de-serialized data: “)\nprint(f)\n```\n\n**输出**\n\
  ```\nD:\\PythonPrograms>python a2.py\nThe de-serialized data:\n[‘apple’, ‘orange’,\
  \ ‘banana’, ‘grape’, ‘papya’]\n```\n\n## 13.8 哈希文件\n\n哈希函数用于为文件提供安全性。哈希函数接受变长度文件作为输入并生成固定长度的哈希代码。生成的哈希被称为消息摘要（Message\
  \ Digest）。Python 支持两种哈希函数，即 MD5 和 SHA-1。为此，Python 提供了处理哈函数的 `hashlib` 模块。为了为任何类型的文件生成摘要，必须以二进制模式读取文件。下面的代码讨论了\
  \ MD5 和 SHA-1。\n\n```python\nimport hashlib\nh = hashlib.md5()\nwith open('file.txt',\
  \ 'rb') as f:\n    h.update(f.read())\nprint(h.hexdigest())\n\nh = hashlib.sha1()\n\
  with open('file.txt', 'rb') as f:\n    h.update(f.read())\nprint(h.hexdigest())\n\
  ```\n\n## 13.9 目录访问\n\n目录包含多个文件。在 Python 编程中，`os` 模块提供了处理操作的各种函数。这些函数列如下。\n\n■ `mkdir()`\
