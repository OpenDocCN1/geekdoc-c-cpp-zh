  \n```python\nimport os\nos.chdir(\"newdir\")\n```\n\n■ `getcwd()` 函数用于获取当前目录名称。\n\
  \n```python\nimport os\nprint(os.getcwd())\n```\n\n■ `rmdir()` 函数用于删除指定的目录。\n\n\
  ```python\nimport os\nos.rmdir(\"newdir\")\n```\n\n■ 目录的内容可以通过 `glob` 包中定义的 `glob()`\
  \ 函数访问。\n\n```python\nimport glob\nac = glob.glob(\"**\")\nprint(ac)\n```\n\n##\
