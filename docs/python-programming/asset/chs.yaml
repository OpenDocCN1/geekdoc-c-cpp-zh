  \ AND= True\n```\n\n## 程序 8: 编写一个 Python 程序来执行各种按位操作。\n\n```python\na=int(input(“Enter\
  \ the value of a:”))\nb=int(input(“Enter the value of b:”))\nprint(\"Value of A=\"\
  ,a)\nprint(\"Value of B=\",b)\nprint(\"Result of Bitwise AND=\",(a&b))\nprint(\"\
  Result of Bitwise OR=\",(a|b))\nprint(\"Result of Bitwise EXOR=\",(a^b))\nprint(\"\
