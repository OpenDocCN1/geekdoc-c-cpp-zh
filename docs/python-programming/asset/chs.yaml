  \ |\n| :--- | :--- | :--- |\n\n## D D.1 简介\n\n通用网关接口 (CGI) 是一种用于用户脚本文件与 Web 服务器之间交换信息的标准协议。通过该协议，Web\
  \ 页面可以在 Web 服务器上动态生成。这些页面是通过使用 CGI 脚本生成的。CGI 脚本在 Web 浏览器中执行。Web 浏览器将请求的 CGI 脚本名称发送到\
  \ Web 服务器，由服务器执行并将 CGI 脚本的响应传输到 Web 浏览器。\n\n## D.2 Apache 服务器配置\n\n要执行基于 Python\
  \ 的 CGI 脚本，需要以下步骤。\n\n- Python 安装目录为 `D:\\Python\\Python36-32`\n- 在系统中安装 Web 服务器。在本节中，我们考虑使用\
  \ XAMPP 安装的 Tomcat Web 服务器。XAMPP 安装目录的路径为 `C:\\xampp`\n- 进入 `xampp` 文件夹，进入 `apache`\
  \ 文件夹。\n- 进入 `apache` 文件夹，进入 `conf` 目录。\n- 要配置 Apache Web 服务器并运行 Python CGI 脚本，请在\
  \ `httpd.conf` 文件的末尾添加以下代码行。\n\n```\nAddHandler cgi-script .py\nScriptInterpreterSource\
  \ Registry-Strict\n```\n\n- 然后打开 `xampp` 控制面板并重启 `Apache`\n\n![image](img/9789386235633_99.png)\n\
  \n## D.3 使用 Apache 服务器运行 Python CGI 脚本\n\n在配置了具有 Python CGI 脚本功能的 Apache 服务器后，请执行以下步骤。\n\
  \n- 在 `htdocs` 文件夹中创建一个文件夹 (PP)。\n  `C:\\xampp\\htdocs\\PP`\n- 在此文件夹中创建一个 Python\
  \ CGI 脚本。脚本的第一行应该是 Python 的解释器路径。\n  `C:\\xampp\\htdocs\\PP\\s1.py`\n\n```python\n\
  #!D:/Python/Python36-32/python.exe\nprint(\"Content-Type: text/html\\n\")\nprint\
  \ (\"Hello World!\")\n```\n\n- 打开 Web 浏览器，输入以下 URL。\n  `http://localhost/PP/s1.py`\n\
  \n*输出：*\n\n![image](img/9789386235633_100.png)\n\n## D.4 Python 环境变量\n\n通过 Python\
  \ CGI 脚本，可以访问操作系统的环境变量。为此，应使用 `os` 模块。`os` 模块允许 Python 脚本与操作系统进行交互。\n\n```python\n\
  #!D:/Python/Python36-32/python.exe\nimport os\nprint(\"Content-Type: text/html\\\
  n\")\nprint(\"<h1>CGI Environment Variables </h1><br>\")\nfor p in os.environ.keys():\n\
  \    print(p, \":\" ,os.environ[p], \"</br>\")\n```\n\n*输出：*\n\n![image](img/9789386235633_101.png)\n\
  \n## D.5 使用 Python CGI 脚本处理表单\n\n数据可以在 Web 浏览器和 Web 服务器之间传输。可以使用 \"post\" 或 \"get\"\
  \ 方法进行表单数据通信（分别用于插入/更新或检索远程数据）。下面的示例代码展示了使用 Python CGI 脚本处理表单。\n\n- 创建一个表单 `a.html`\
  \ 来读取用户名。为此，表单包含一个文本框和一个按钮。\n  `C:\\xampp\\htdocs\\PP\\a.html`\n\n```html\n<form\
  \ action=\"/PP/s1.py\" method=\"POST\">\nFirst Name: <input type=\"text\" name=\"\
  name\" </br>\n<input type=\"submit\" value=\"Click\" />\n</form>\n```\n\n- 然后，编写\
  \ Python CGI 脚本通过 \"POST\" 或 \"GET\" 接收表单数据。当前示例使用 \"POST\" 方法。Python 中的 `cgi` 模块用于处理\
  \ \"POST\" 或 \"GET\" 请求的表单数据。`cgi` 模块中的 `FieldStorage()` 函数接收来自表单的数据。\n  `C:\\xampp\\\
  htdocs\\PP\\s1.py`\n\n```python\n#!D:/Python/Python36-32/python.exe\nimport cgi\n\
  f=cgi.FieldStorage()\nname=f.getvalue('name')\nprint(\"Content-Type: text/html\\\
  n\")\nprint(\"Hello\",name)\n```\n\n*输出：*\n\n![image](img/9789386235633_102.png)\n\
