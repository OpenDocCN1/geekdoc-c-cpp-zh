  \ [11, 22, 33, 44]\n```\n\n### `filter()` 函数\n`filter()` 函数接收两个参数。第一个是应用于列表的函数，第二个是要执行函数的列表。生成结果后，`filter()`\
  \ 只保留值为 `True` 的元素。\n\n```python\na = [15,20,24,35]\nc=list(filter(lambda x:x%2==0,\
  \ a))\nprint(\"a:\",a)\nprint(\"filter result:\",c)\n```\n\n**输出**\n\n```\nD:\\\
  PythonPrograms>python a.py\na: [15, 20, 24, 35]\nfilter result: [20, 24]\n```\n\n\
  ### `reduce()` 函数\n`reduce()` 函数反复对输入列表应用自身，并生成单个值作为最终结果。\n\n```python\nfrom functools\
  \ import reduce\na = [15,20,24,35]\nc=reduce(lambda x,y:x+y, a)\nprint(\"a:\",a)\n\
  print(\"filter result:\",c)\n```\n\n**输出**\n\n```\nD:\\PythonPrograms>python a.py\n\
