  \ 1, in <module>\nNameError: name ‘v’ is not defined\n```\n\n**main.py**\n```python\n\
  from sum import(s,v,m)\n\nprint(s(100,200))\n\nprint(v)\n\nprint(m(10,20))\n```\n\
  \n***Output***\n```\nD:\\PythonPrograms>python main.py\n\n300\n\n100\n\n200\n```\n\
  \n## 9.3 创建模块\n\n在 Python 编程中，可以创建一个包含多个定义和执行语句的模块。在其他程序中，我们可以导入模块所需的所需的元素，也可以导入整个模块。\n\
  \n**sum.py**\n```python\ndef add(x,y):\n    return(x+y)\n\ndef mul(a,b):\n    return(a*b)\n\
  \ndef sub(x,y):\n    return(x-y)\n\ndef div(x,y):\n    return(x/y)\n```\n\n在上面的示例代码中，`sum.py`\
  \ 代表一个包含四个定义的模块，即 `add()`、`mul()`、`sub()` 和 `div()`。在其他程序中，可以导入这些定义中的全部或部分定义。在下面的示例代码\
  \ `main.py` 中，导入了所有的定义。\n\n```python\nimport sum\n\nn1=int(input(“Enter the first\
  \ number: “))\n\nn2=int(input(“Enter the second number: “))\n\nprint(“The result\
  \ of add(): “,sum.add(n1,n2))\n\nprint(“The result of sub(): “,sum.sub(n1,n2))\n\
  \nprint(“The result of mul(): “,sum.mul(n1,n2))\n\nprint(“The result of div(): “,sum.div(n1,n2))\n\
  ```\n\n***Output***\n```\nD:\\PythonPrograms>python bb.py\n\nEnter the first number:\
  \ 30\n\nEnter the second number: 10\n\nThe result of add(): 40\n\nThe result of\
  \ sub(): 20\n\nThe result of mul(): 300\n\nThe result of div(): 3.0\n```\n\n在后面的示例代码中，并没有导入所有定义，而是导入了部分定义。在这种情况下，使用\
  \ `from module import(lis_of_element)` 语句作为导入语句。\n\n**示例 1**\n```python\nfrom sum\
  \ import add\n\nn1=int(input(“Enter the first number: “))\n\nn2=int(input(“Enter\
  \ the second number: “))\n\nprint(“The result of add(): “,add(n1,n2))\n```\n\n***Output***\n\
  ```\nD:\\PythonPrograms>python xmain.py\n\nEnter the first number: 40\n\nEnter the\
  \ second number: 50\n\nThe result of add(): 90\n```\n\n**示例 2**\n```python\nfrom\
  \ sum import sub\n\nn1=int(input(“Enter the first number: “))\n\nn2=int(input(“Enter\
  \ the second number: “))\n\nprint(“The result of sub(): “,sub(n1,n2))\n```\n\n***Output***\n\
  ```\nD:\\PythonPrograms>python xmain.py\n\nEnter the first number: 50\n\nEnter the\
  \ second number: 10\n\nThe result of sub(): 40\n```\n\n## 9.4 __name__ 的用法\n\n在\
  \ Python 编程中，没有所谓的主模块。当前执行的程序被视为主模块的内容。当任何其他模块被导入到顶层主模块时，Python 解释器将保持当前使用的模块。为此，使用了\
  \ `__name__` 变量。当执行 Python 程序时，`__name__` 变量的值为 `__main__`。当其他模块导入到程序时，可以调用导入模块的元素。在导入语句之后，`__name__`\
  \ 变量的值为对应模块的名称。下面的示例代码描述了 `__name__` 变量的用法。\n\n**sum.py**\n```python\nprint(__name__)\n\
  \ndef sub(x,y):\n    return(x-y)\n\ndef div(x,y):\n    return(x/y)\n```\n\n**xmain.py**\n\
  ```python\nprint(__name__)\n\nfrom sum import sub\n\nprint(__name__)\n\nn1=int(input(“Enter\
  \ the first number: “))\n\nn2=int(input(“Enter the second number: “))\n\nprint(“The\
  \ result of sub(): “,sub(n1,n2))\n```\n\n***Output***\n```\nD:\\PythonPrograms>python\
  \ xmain.py\n\n__main__\nsum\n__main__\nEnter the first number: 10\nEnter the second\
  \ number: 20\nThe result of sub(): \n```\n\n\n\n第三个命令行参数：5\n\n模块中 `s()` 的结果：9\n\n\
  模块中变量 `v` 的值：100\n\n模块 20 中 `m()` 的结果：20\n\n### 程序 2：编写一个 Python 程序来打印要在 Python\
  \ 中执行的程序层级。\n\n#### `sum.py`\n```python\nprint(\"The top level execution:\",__name__)\n\
  \ndef add(x,y):\n    return(x+y)\n\ndef mul(a,b):\n    return(a*b)\n\ndef sub(x,y):\n\
  \    return(x-y)\n\ndef div(x,y):\n    return(x/y)\n```\n![image](img/9789386235633_pt.png)\n\
  \n**编程提示：**\n一个模块可以有多个函数定义。\n\n#### `xmain.py`\n![image](img/9789386235633_pt.png)\n\
  **编程提示：**\n`import` 语句用于从任何模块导入函数。\n\n```python\nif(__name__==\"__main__\"):\n \
  \   print(\"The top level execution:\",__name__)\n\nfrom sum import div\nprint(\"\
  The top level execution:\",__name__)\n\nn1=int(input(\"Enter the first number: \"\
  ))\nn2=int(input(\"Enter the second number: \"))\nprint(\"The result of div(): \"\
  ,div(n1,n2))\n```\n\n## 输出\n```text\nD:\\PythonPrograms>python xmain.py\nThe top\
