  \n### `hello.text` 的内容\n\n这是第一行\n这是第二行\n这是第三行\n\n```python\nf3=open(“hello.txt”,”a”)\n\
  x=f3.tell()\nf3.write(“ abc”)\nprint(“the current position of f3: “,x)\nf3.close()\n\
  ```\n\n**输出**\n```\nD:\\PythonPrograms>python a1.py\nthe current position of f3:\
  \ 61\n```\n\n**`hello.text` 的内容**\n\n这是第一行\n这是第二行\n这是第三行 abc\n\n- `seek()` 方法用于将文件对象的当前位置重定位到指定位置。它包含两个参数，如文文列表所示：\n\
  \n    - 第一个参数指定要移动的字节数。\n    - 第二个参数指定 `seek()` 方法的工作基准。\n\n通常情况下，它可以从文件的开头、当前或结束位置移动。相应的值是\
  \ {0,1,2}。这些值在 `os` 模块中定义为常量。常量的名称分别为 `SEEK_SET`、`SEEK_CUR` 和 `SEEK_END`。\n\n**`hello.text`\
  \ 的内容**\n\n这是第一行\n这是第二行\n这是第三行\n\n```python\nimport os\n```\n\n\n\n\n\n```python\n\
  f3=open(“hello.txt”,”a”)\nx=f3.tell()\nprint(“the current position of f3: “,x)\n\
