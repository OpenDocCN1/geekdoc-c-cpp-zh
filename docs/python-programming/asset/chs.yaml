  \ b2.py\n\nEnter the ascii code: 97\n\nThe character for the given ascii code of\
  \ 97 is a\n```\n\n## 12.4 字符串格式化\n\n与 C 语言类似，Python 编程也提供了各种格式化符的使用。下面列出了各种格式化符。\n\
  \n■ `%d` 用于格式化整数数据。\n\n```python\na=int(input(“Enter integer value:”))\nprint(“Integer\
  \ value: %d” %a)\n```\n\n**Output**\n```\nD:\\PythonPrograms>python a1.py\n\nEnter\
  \ integer value:10\n\nInteger value: 10\n```\n\n■ `%f` 用于格式化浮点数数据。\n\n```python\n\
  a=float(input(“Enter floating point value:”))\nprint(“Floating Point value: %f”\
  \ %a)\n```\n\n**Output**\n```\nD:\\PythonPrograms>python a1.py\n\nEnter floating\
  \ point value:25.344\n\nFloating Point value: 25.344000\n```\n\n■ `%.<size>f` 用于格式化固定小数位的浮点数。\n\
  \n```python\na=float(input(“Enter floating point value:”))\nprint(“Floating Point\
  \ value: %f” %a)\nprint(“Floating Point value: %.2f” %a)\n```\n\n**Output**\n```\n\
  D:\\PythonPrograms>python a1.py\n\nEnter floating point value:100.56\n\nFloating\
  \ Point value: 100.560000\n\nFloating Point value: 100.56\n```\n\n■ `%s` 用于格式化字符串对象。\n\
  \n```python\na=input(“Enter String value:”)\nprint(“String value: %s” %a)\n```\n\
  \n**Output**\n```\nD:\\PythonPrograms>python a1.py\n\nEnter String value:hello\n\
  \nString value: hello\n```\n\n■ `%s` 也用于处理其他数据对象。\n\n```python\nb=[100,200,300]\n\
  print(“b value: %s” %b)\n```\n\n**Output**\n```\nD:\\PythonPrograms>python a1.py\n\
  \nb value: [100, 200, 300]\n```\n\n### 指定字符串的位置\n\nPython 使用 `format()` 方法根据用户需求格式化输入字符串。`format()`\
  \ 方法使用占位符 `{}` 来指定字符串的位置。\n\n下面列出了四种类型的参数：\n\n- **默认参数：** 按照顺序接收参数。不需要指定参数的索引。\n\
  - **位置参数：** 按照位置接收参数。初始参数索引从 0 开始。\n- **关键字参数：** 根据关键字接收参数。\n- **混合参数：** 同时接收位置参数和关键字参数。\n\
  \n```python\na=int(input(“Enter the Year: “))\nb=input(“Enter the Month Name: “)\n\
  c=int(input(“Enter the Date:”))\nprint(“Default argument data:\\n year {}, month\
  \ {} date {}下.format(a,b,c))\nprint(“Positional argument data:\\n year {0}, month\
  \ {1} date {2}下.format(a,b,c))\nprint(“Keyword argument data:\\n year {x}, month\
  \ {y} date {z}下.format(x=a,z=c,y=b))\nprint(“Mixed argument data:\\n year {0}, month\
  \ {1} date {z}下.format(a,b,z=c))\n```\n\n**Output**\n```\nD:\\PythonPrograms>python\
  \ a1.py\n\nEnter the Year: 2015\n\nEnter the Month Name: sep\n\nEnter the Date:\
  \ 25\n\nDefault argument data:\nyear 2015, month sep date 25.\nPositional argument\
  \ data:\nyear 2015, month sep date 25.\nKeyword argument data:\nyear 2015, month\
  \ sep date 25.\nMixed argument data:\nyear 2015, month sep date 25.\n```\n\n在使用混合参数时，位置参数应该放在关键字参数之前。\n\
  \n## 12.5 正则表达式\n\nPython 编程支持一种名为“正则表达式”的功能。通过它，可以高效地处理文本模式。它们是机器文本处理的基础构建。Python\
  \ 使用 `re` 模块支持正则表达式。为此，输入数据以字符串形式给出。在输入字符串内部，会分析所需的模式。在 Python 编程中，`re` 模块用于处理各种正则表达式函数。\n\
  \n### 12.5.1 re 模块\n\n`re` 模块主要用于提供正则表达式的各种函数。这些函数中的每一个都接受两个参数。它们是 1) 输入字符串和 2)\
  \ 模式。\n\n正则表达式使用的输入字符串不是普通字符串。\n\n\n\n\n\n```python\nm = re.sub( r’(i.*)\\s(.*)\\\
  s(.*)’, “”,a)\nprint(“After matching and substitution result: “,m)\n```\n**输出**\n\
  ```\nD:\\PythonPrograms>python a1.py\nAfter matching and substitution result: th\n\
  ```\n\n### ■ re.split()\n\n`split()` 函数将根据分隔符将输入文本划分成不同的部分。\n\n```python\nimport\
  \ re\na = “this is regular expression program and is a match program”\nm = re.split(\
  \ r’(.*)\\s(e.*)’, a)\nprint(“After matching and substitution result: “)\nfor i\
  \ in m:\nprint(i)\n```\n**输出**\n```\nD:\\PythonPrograms>python a1.py\nAfter matching\
  \ and substitution result:\nthis is regular\nexpression program and is a match program\n\
  ```\n\n### ■ re.findall()\n\n它与 `split()` 函数相似，不同之处在于划分不是基于分隔符进行的。除此之外，划分是基于匹配结果的。\n\
  \n```python\nimport re\na = “this is regular expression program and is a match program”\n\
  m = re.findall( r’(.*)\\s(e.*)’, a)\nprint(“After matching and substitution result:\
  \ “)\nfor i in m:\nprint(i)\n```\n**输出**\n```\nD:\\PythonPrograms>python a1.py\n\
  After matching and substitution result:\n（‘this is regular’, ‘expression program\
  \ and is a match program’)\n```\n\n### 12.6 基于字典的格式化表达式\n\n字典元素也可以作为字符串的一部分放置。为此，使用“%”运算符来表示字典的元素。\n\
  \n```python\ndi={“a”:1,”b”:2.6，“c”:”hai”}\nst1=”%(a)d”%di\nst2=”%(b)f”%di\nst3=”%(c)s”%di\n\
  print(st1)\nprint(st2)\nprint(st3)\n```\n**输出**\n```\nD:\\PythonPrograms>python\
  \ bb.py\n1\n2.600000\nhai\n```\n\n## 12.7 示例程序\n\n**程序 1:** 编写一个 Python 程序检查给定的子字符串是否存在输入字符串中。\n\
