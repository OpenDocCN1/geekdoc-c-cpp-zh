  \ 语句\n\n除了决策语句外，Python 编程还支持循环语句。Python 中有两种循环。它们是 i) `while` 和 ii) `for`。\n\n`while`\
  \ 循环最初检查条件，并重复执行语句块，直到评估结果的条件变为 False。`while` 循环的语法如下：\n\n```python\nwhile(condition):\n\
  \    #block of statements\n```\n\n首先评估条件，如果条件为 TRUE，则执行该语句块。之后，再次评估条件并重复该过程，直到条件变为\
  \ False。\n\n![image](img/9789386235633_17.png)\n\n**图 4.4** while 循环流程图\n\n`while`\
  \ 循环的流程图如图图 4.4 所示。对于 `while` 循环，允许存在多个条件。当控制流到达 `while` 循环时，将评估 `if` 语句中给出的 `condition1`。如果条件的评估结果为\
  \ FALSE，则控制流将进入 FALSE 块并评估 `Condition 2`。如果 `Condition 2` 的评估结果为 FALSE，则执行 `Set\
  \ 1` 语句集。如果 `Condition 2` 的评估结果为 TRUE，则执行 `Set 2` 语句集。在执行完 `Set 1` 或 `Set 2` 语句集后，控制流继续执行\
  \ `Set 5` 语句集。\n\n如果 `Condition 1` 的评估结果为 TRUE，则将评估另一个相应的 `Condition 3`。如果 `Condition\
  \ 3` 的评估结果为 FALSE，则执行 `Set 3` 语句集。如果 `Condition 3` 的评估结果为 TRUE，则执行 `Set 4` 语句集。在执行完\
  \ `Set 3` 或 `Set 4` 语句集后，控制流继续执行 `Set 5` 语句集。\n\n示例如下：\n\n```python\na=int(input(“Enter\
  \ the number: “))\nif(a>0):\n    print(“first true block”)\n    if(a>10):\n    \
  \    print(“second true block”)\n    else:\n        print(“first false block”)\n\
  else:\n    print(“second false block”)\nif(a>-10):\n    print(“third true block”)\n\
