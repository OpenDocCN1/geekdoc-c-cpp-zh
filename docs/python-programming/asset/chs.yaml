  \n\n在上述程序中，定义了三个测试方法，即 {`test_ok()`, `test_fail()`, `test_error()`}。`test_ok()`\
  \ 测试方法检查条件。该条件经过测试且结果为通过。`test_fail()` 测试方法检查条件是否为假输出。然而，测试条件却产生了真结果。因此，结果将抛出 `AssertionError`。`test_error()`\
  \ 会抛出一个名为 `RuntimeError` 的异常。\n\n下面列出了适用于测试用例的各种方法。\n\n-   `assertEqual()` 检查两个输入值是否相等。\n\
  -   `assertNotEqual()` 检查两个输入值是否不等。\n-   `assertTrue()` 检查输入条件的结果是否为真。\n-   `assertFalse()`\
  \ 检查输入条件的结果是否为 `false`。\n-   `assertRaises()` 检查是否抛出了异常。\n-   `assertAlmostEqual()`\
  \ 检查两个输入值是否相似。\n-   `assertNotAlmostEqual()` 检查两个输入值是否不相似。\n-   `assertRegrex()`\
  \ 检查正则表达式搜索结果是否与文本匹配。\n-   `assertIs()` 检查第一个输入是否与第二个输入相同。\n-   `assertIsNot()`\
  \ 检查第一个输入是否与第二个输入不同。\n-   `assertIsNone()` 检查输入表达式是否为 `none`。\n-   `assertIsNotNone()`\
  \ 检查输入表达式是否不是 `none`。\n-   `assertIn()` 检查第一个输入是否在第二个输入中。\n-   `assertNotIn()` 检查第一个输入是否不在第二个输入中。\n\
  \n## 19.3 单元测试中的测试用例分组\n\n在 Python 单元测试中，可以使用“测试套件”（test suite）对多个测试用例进行分组。为此，使用了单元测试模块中的\
  \ `TestSuite` 类。测试用例对象负责具体的测试，而测试套件对象负责将多个测试用例对象进行分组。下面列出了测试套件对象中的各种方法。\n\n-   `addTest()`\
  \ 方法将测试用例或测试套件添加到当前测试套件中。\n-   `addTests()` 方法用于添加测试用例或测试套件的所有测试。\n-   `run()` 将运行测试并将结果存储在结果对象中。\n\
  -   `countTestCases()` 统计测试套件对象中可用的测试数量。\n\n## 19.4 加载和运行测试\n\n在 Python 中，不同的类和模块中提供了多个测试用例。可以使用\
  \ `TestLoader` 类将这些类和模块中的所有测试用例加载到测试套件中。下面列出了该类的各种方法。\n\n-   `loadTestsFromTestCase()`\
  \ 方法将从输入类加载所有测试用例到当前测试套件对象中。\n-   `loadTestsFromModule()` 方法将从输入模块加载所有测试用例到当前测试套件对象中。\n\
  -   `loadTestsFromName()` 方法将从输入名称加载所有测试用例到当前测试套件对象中。\n-   `getTestCaseNames()`\
  \ 方法获取输入类中所有测试用例的名称。结果将按排序排列。\n\n要在 Python 中运行测试套件，使用 `TextTestRunner()` 类。该类包含\
  \ `run()` 方法。`run()` 方法将执行输入的测试套件。\n\n```\nimport unittest\n\nclass t1(unittest.TestCase):\n\
  \    def testm1(self):\n        self.assertAlmostEqual(10,11)\n\n    def testm2(self):\n\
  \        self.assertNotAlmostEqual(10,11)\n\nclass t2(unittest.TestCase):\n    def\
  \ testm3(self):\n        self.assertIsNone(none)\n\n    def testm4(self):\n    \
  \    self.assertisNone(\"hello”)\n\nif __name__ == \"__main__\":\n    l=unittest.TestLoader()\n\
  \    s1=unittest.TestSuite()\n    s2=unittest.TestSuite()\n    r=unittest.TextTestRunner()\n\
  \    s1.addTest(l.loadTestsFromTestCase(t1))\n    r.run(s1)\n    s2.addTest(l.loadTestsFromTestCase(t2))\n\
  \    r.run(s2)\n```\n\n***输出***\n```\nD:\\PythonPrograms>python a1.py\n\nF.\n\n\
