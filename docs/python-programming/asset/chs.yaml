  \ 属性表示鼠标的位置。`x_root`、`y_root` 属性表示鼠标相对于左上角的相对位置。`char` 属性表示来自键盘的按键值。`keysym` 属性表示来自键盘的按键符号。`keycode`\
  \ 属性表示来自键盘的按键代码。`num` 属性表示按下鼠标按钮编号。`width` 表示输入控件的宽度。`height` 表示输入控件的高度。`type` 表示控件的类型。\n\
  \n## 17.2 将回调函数绑定到事件\n\n在 Python 中，绑定（binding）是将控件事件对象连接到相应回调函数的过程。通常，这也被称为“事件处理器（Event\
  \ Handler）”。为此，`tkinter` 模块包含一个名为 `bind()` 的方法。`bind()` 方法适用于四种不同的情况。\n\n### 适用于控件实例\n\
  \n在此情况下，`bind()` 应用于实例。`bind()` 方法的语法为：\n\n`widget_object.bind(event_name,handler)`\n\
  \n```python\nfrom tkinter import *\n\na = Tk()\n\ndef abc(event):\n    x=event.widget\n\
  \    f=Frame(a)\n    f.pack()\n    l1=Label(f, text=x).pack()\n    t1 = Text(a,\
  \ width=30, height=10)\n    t1.bind('<KeyPress>', abc)\n    t1.pack()\n    t1.focus_set()\n\
  a.mainloop()\n```\n\n*输出*\n![image](img/9789386235633_61.png)\n\n### 适用于顶层窗口\n\n\
  在此情况下，`bind()` 方法应用于 GUI 应用程序中的顶层窗口。`bind()` 的语法为：\n\n`top_level_object.bind(event_name,handler)`\n\
  \n```python\nfrom tkinter import *\n\na = Tk()\n\ndef abc(event):\n    print(\"\
  mouse entered\")\n    frame = Frame(a, width=200, height=200)\n    frame.bind('<Enter>',\
  \ abc)\n    frame.pack()\na.mainloop()\n```\n\n*输出*\n![image](img/9789386235633_62.png)\n\
  \n### 适用于控件类\n\n在这种情况下，使用了 `bind_class()` 方法。它将对同类的所有控件执行绑定操作。`bind_class()` 方法应用于\
  \ GUI 应用程序中的顶层窗口。`bind_class()` 的语法为：\n\n`top_level_object.bind_class(\"widget_class\"\
  , event_name,handler)`\n\n```python\nfrom tkinter import *\n\na = Tk()\n\ndef abc(event):\n\
  \    x=event.widget\n    f=Frame(a)\n    f.pack()\n    l1=Label(f, text=x).pack()\n\
  \    b1 = Button(a, text=\"Button1\")\n    b1.bind_class('Button','<Button-1>',\
  \ abc)\n    b1.pack()\n    b2 = Button(a, text=\"Button2\")\n    b2.bind_class('Button','<Button-1>',\
  \ abc)\n    b2.pack()\na.mainloop()\n```\n\n*输出*\n![image](img/9789386235633_63.png)\n\
  \n### 适用于整个 GUI 应用程序\n\n在这种情况下，使用了 `bind_all()`。它将对 GUI 应用程序中的所有控件执行绑定过程。`bind_all()`\
  \ 的语法如下。\n\n`top_level_object.bind_all(event_name,handler)`\n\n```python\nfrom tkinter\
  \ import *\n\na = Tk()\n\ndef abc(event):\n    x=event.widget\n    f=Frame(a)\n\
  \    f.pack()\n    l1=Label(f, text=x).pack()\n    b1 = Button(a, text=\"Button1\"\
  )\n    b1.pack()\n    b2 = Button(a, text=\"Button2\")\n    b2.pack()\n    a.bind_all('<Button-1>',\
  \ abc)\na.mainloop()\n```\n\n*输出*\n![image](img/9789386235633_64.png)\n\n## 17.3\
  \ 事件名称\n\nPython 中的各种事件名称列如下：\n\n- `Button-1`\n- `B1-Motion`\n- `ButtonRelease-1`\n\
  - `Double-Button-1`\n- `Enter`\n- `Leave`\n- `FocusIn`\n- `FocusOut`\n- `Return`\n\
  - `Key`\n- `<Shift-Up>`\n- `<Configure>`\n\n## 17.4 键盘事件\n\n键盘事件将“监听”来自键盘的输入，每当事件发生就会执行关联的操作。\n\
  \n```python\nfrom tkinter import *\n\na = Tk()\n\ndef abc(event):\n    x=\"Key Symbol:\
  \ \"+event.keysym\n    y=\"Key Symbol Number: \"+event.num\n    f=Frame(a)\n   \
  \ f.pack()\n    l4=Label(f, text=\"Key Pressed\").pack()\n    l1=Label(f, text=x).pack()\n\
  \    l2=Label(f, text=y).pack()\n\ndef abc1(event):\n    f=Frame(a)\n    f.pack()\n\
  \    l4=Label(f, text=\"Key Released\").pack()\n    text = Text(a, width=20, height=5)\n\
  \    text.bind('<KeyPress>', abc)\n    text.bind('<KeyRelease>', abc1)\n    text.pack(expand=1,\
  \ fill=\"both\")\n    text.focus_set()\na.mainloop()\n```\n\n*输出*\n![image](img/9789386235633_65.png)\n\
  \n## 17.5 鼠标事件\n\n鼠标事件用于处理鼠标的变化并执行相应的操作。\n\n```python\nfrom tkinter import *\n\n\
  a = Tk()\n\ndef abc(event):\n    x=str(event.x)\n    y=str(event.y)\n    x1=str(event.x_root)\n\
  \    y1=str(event.y_root)\n    f=Frame(a)\n    f.pack()\n    l4=Label(f, text=\"\
  Mouse clicked at (\"+x+\",\"+y)\").pack()\n    l5=Label(f, text=\"Mouse relative\
  \ position(\"+x1+\",\"+y1)\").pack()\n\ndef abc1(event):\n    f=Frame(a)\n    f.pack()\n\
  \    l4=Label(f, text=\"Mouse Entered\").pack()\n\ndef abc2(event):\n    f=Frame(a)\n\
  \    f.pack()\n    l4=Label(f, text=\"Mouse Leaved\").pack()\n\ndef abc3(event):\n\
  \    f=Frame(a)\n    f.pack()\n    l4=Label(f, text=\"Mouse Dragged\").pack()\n\n\
  def abc4(event):\n    f=Frame(a)\n    f.pack()\n    l4=Label(f, text=\"Mouse Released\"\
  ).pack()\n\na.bind('<Enter>', abc1)\na.bind('<Button-1>', abc)\na.bind('<Leave>',\
  \ abc2)\na.bind('<B1-Motion>', abc3)\na.bind('<ButtonRelease-1>', abc4)\na.mainloop()\n\
  ```\n\n*输出*\n![image](img/9789386235633_66.png)\n\n## 17.6 示例程序\n\n**程序 1：** 编写一个\
  \ Python 程序等待线程对象指定时间。\n![image](img/9789386235633_pt.png)\n\n**编程提示：** 事件对象处理各种输入。\n\
  \n```python\nimport threading\nimport time\n\nclass newthread(threading.Thread):\n\
  \    def __init__(self,tname,event):\n        threading.Thread.__init__(self)\n\
  \        self.name=tname\n        self.threadEvent=event\n    def run(self):\n \
  \       print(self.name,\" is running\")\n\ne=threading.Event()\nt1=newthread(\"\
  t1\",e)\nt2=newthread(\"t2\",e)\nt1.start()\nt2.start()\nx=int(input(\"Enter the\
  \ time period for wait: \"))\nprint(\"The thread object is waiting\")\ne.wait(x)\n\
  print(\"The thread object is cleared\")\n```\n\n*输出*\nD:\\PythonPrograms>python\
  \ a1.py\nt1 thread is running\nt2 thread is running\nEnter the time period for wait:\
  \ 5\nThe thread object is waiting\nThe thread object is cleared\n\n**程序 2：** 编写一个\
  \ Python 程序打印鼠标点击是在右侧还是左侧。\n\n```python\nfrom tkinter import *\n\na = Tk()\n\ndef\
  \ abc(event):\n    f=Frame(a)\n    f.pack()\n    l1=Label(f, text=\"Left is clicked\"\
  ).pack()\n\ndef abc1(event):\n    f=Frame(a)\n    f.pack()\n    l1=Label(f, text=\"\
  Middle is clicked\").pack()\n\ndef abc2(event):\n    f=Frame(a)\n    f.pack()\n\
  \    l1=Label(f, text=\"Right is clicked\").pack()\n\na.bind('<Button-1>', abc)\n\
  a.bind('<Button-2>', abc1)\na.bind('<Button-3>', abc2)\na.mainloop()\n```\n\n*输出*\n\
  ![image](img/9789386235633_67.png)\n\n## 词汇\n\n- 事件对象处理各种输入。\n- 绑定是将控件事件对象连接到回调函数的过程。\n\
  - 键盘事件将“监听”来自键盘的输入，每当事件发生就会执行关联的操作。\n- 鼠标事件用于处理鼠标的变化并执行相应的操作。\n\n## 总结\n\n- 事件对象可以处理各种类型。\n\
  - 绑定是将回调函数连接到事件对象。\n- 事件对象在 Python 中可以绑定四种不同的情况。\n\n## 单选题\n\n1. **事件对象可以处理**\n\
