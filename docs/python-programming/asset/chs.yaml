  2. 输入 N 个值并存储在列表 L 中\n3. X← L[0]\n4. I←1\n5. Repeat\n6. 如果 X >L[I]\n7. 则 X←L[I]\n\
  8. 直到 I 小于 N\n9. 打印 X 的值\n10. 停止\n```\n\n\n\n\n## 1.5.9 在排序好的卡片列表中插入一张卡片\n\n1. 开始\n\
  2. 输入 `N` 张排序好的卡片并将其存储在列表 `L` 中\n3. 输入新卡片 `C`\n4. 识别当前位置值 `>C` 且下一个位置值`<C` 的位置\n\
  5. 如果未识别到位置\n6. 则将列表末尾视为该位置\n7. 将 `C` 插入 `L` 的确识别位置\n8. 打印 `X` 的值\n9. 停止\n\n## 1.5.10\
  \ 在范围内猜整数\n\n1. 开始\n2. 输入 `N`\n3. 在 1 到 100 之间生成一个随机数并存储在 `X` 中\n4. 如果 `X` 等于 `N`\n\
  5. 则打印“matched”（匹配）\n6. 或者如果 `X` 小于 `N`\n7. 则打印“less value”（值小）\n8. 否则打印“greater\
  \ value”（值大）\n9. 停止\n\n## 1.5.11 汉诺塔算法\n\n1. 开始\n2. 函数 `H(disk, source, destination,\
  \ aux)`\n3. IF `disk == 0`， THEN\n4. 将 `disk` 从 `source` 移动到 `destination`\n5. ELSE\n\
  6. `H(disk - 1, source, aux, destination)`\n7. 将 `disk` 从 `source` 移动到 `destination`\n\
  8. `H(disk - 1, aux, destination, source)`\n9. END IF\n10. END Function\n11. 停止\n\
  \n## 1.6 程序的构建模块\n\n将一组指令组合在一个地方，称为程序。一个程序由多条指令组成。程序中的每条指令称为语句（statement）。在开发完所需应用的程序后，程序员将保存程序。因此，程序将存储在内存中。经过编译过程后，相应的机器级代码将存储在内存中。在程序执行期间，将逐语句读取内存，处理器将执行相应语句的指令。程序的各种构建模块列如下：\n\
  \n* 语句 (Statements)\n* 数据类型 (Data types)\n* 变量 (Variables)\n* 关键字 (Keywords)\n*\
  \ 表达式 (Expressions)\n* 操作数 (Operands)\n* 算运算符 (Operators)\n* 函数 (Functions)\n* 条件与循环\
  \ (Conditions and loops)\n\n## 1.7 学习编程的背景\n\n* 学习字符集，指的是编程语言中有效的字母表、字母和某些特殊字符的集合。\n\
  * 学习编程语言中有效的标记（tokens）。通过此，程序员将了解有效的单词。\n* 然后，学习编程语言中允许的指令格式。通过此，程序员将能够编写有效的句子。\n\
  * 最后，程序员应该能够将编程语言中的多条有效指令组合成一个程序。\n\n## 1.8 示例算法\n\n### 算法 1：读取一个字符串并检查其是否为回文。\n\
  \n1. 开始\n2. 输入字符串 `S`\n3. `l←length of S`\n4. `i←l-1`\n5. while `i>=0`\n6. 开始\n\
  7. 将 `S` 的当前字符存储到字符串 `T` 中\n8. `i` 值减 1\n9. 结束\n10. 如果 `S` 等于 `T`\n11. 则打印“palindrome”（回文）\n\
  12. 否则打印“not palindrome”（不是回文）\n13. 停止\n\n### 算法 2：读取 N 个值并相加 N 个值\n\n1. 开始\n2.\
  \ 读取 `N` 个数字\n3. `i←0`\n4. `S←0`\n5. while `i<N`\n6. 开始\n7. `S←S+i`\n8. `i←i+1`\n\
  9. 结束\n10. 打印 `S`\n11. 停止\n\n### 算法 3：读取 N 并打印包含 N 个数字的斐波那契数列\n\n1. 开始\n2. 读取 `N`\n\
  3. `Fib[0]←0`\n4. `Fib[1]←1`\n5. `i←2`\n6. while `i<=N`\n7. 开始\n8. `Fib[i]←Fib[i-1]+Fib[i-2]`\n\
  9. `i←i+1`\n10. 结束\n11. 打印 `Fib`\n12. 停止\n\n## 术语表\n\n* 计算机程序由一组指令组成，为给定问题提供解决方案。\n\
  * 算法是开发程序的步步演进的方法。\n* 流程图是程序的图形化表示。\n\n## 总结\n\n* 计算机程序有助于解决复杂问题。\n* 要开发计算机程序，首先应该开发算法，然后使用编程语言为该算法开发程序。\n\
