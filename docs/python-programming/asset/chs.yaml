  \ exception: value of a-b is <0\n```\n\n## 14.11 自定义异常\n\n在 Python 编程中，异常有两种类型。它们是：\n\
  \n- 内置异常\n- 自定义异常\n\n对于内置异常，Python 提供了定义。因此，用户不需要为内置异常提供定义。内置异常可以手动或自动抛出。某些内置异常列如下：\n\
  \n- `BufferedError`: 在执行缓冲区操作时抛出。\n- `LookupError`: 当序列或映射的键或索引无效时抛出。\n- `AssertionError`:\
  \ 在 `assert` 语句执行失败时抛出。\n- `AttributeError`: 引用无效属性时抛出。\n- `PointError`: 在浮点操作失败时抛出。\n\
  - `IOError`: 在 I/O 操作失败时抛出。\n- `ImportError`: 在导入语句失败时抛出。\n\n在 Python 编程中，自定义异常的定义最初应该在程序内以便以便有效处理。每个自定义异常都需要其类定义。通常，自定义异常的类应该非常小。\n\
  \n```python\nclass ne(Exception):\n    pass\n\ntry:\n    a=int(input(\"Enter the\
  \ value of a: \"))\n    b=int(input(\"Enter the value of b: \"))\n    print(\"The\
  \ value of a= \",a)\n    print(\"The value of b= \",b)\n    if(a-b)<0:\n       \
  \ raise ne\nexcept ne:\n    print(\"custom exception is raised\")\n```\n\n***Output***\n\
  ```text\nD:\\PythonPrograms>python a1.py\nEnter the value of a: 5\nEnter the value\
  \ of b: 14\nThe value of a= 5\nThe value of b= 14\ncustom exception is raised\n\
  ```\n\n## 14.12 断言语句\n\n\n\n\n在 Python 编程中，使用 `assert` 语句来捕获用户定义的常量。通过使用 `assert`\
  \ 语句，可以进行逐行调试。`assert` 语句称为条件抛出语句。如果未满足条件，`assert` 语句将抛出一个异常。`assert` 语句的语法为：\n\n\
  ```python\nassert expression[,argument]\n```\n\n`assert` 语句由 `try...except` 块处理。如果抛出的异常未被处理，程序将立即终止。\n\
  \n```python\na=int(input(“Enter the value of a: “))\nb=int(input(“Enter the value\
  \ of b: “))\nprint(“The value of a= “,a)\nprint(“The value of b= “,b)\nassert a<b,\
  \ “custom exception is raised”\n```\n\n**输出**\n\n```text\nD:\\PythonPrograms>python\
  \ a1.py\nEnter the value of a: 9\nEnter the value of b: 5\nThe value of a= 9\nThe\
  \ value of b= 5\nTraceback (most recent call last):\nFile “a1.py”, line 8, in <module>\n\
  assert a<b, “custom exception is raised”\nAssertionError: custom exception is raised\n\
  ```\n\n## 14.13 预定义的清理动作\n\n预定义的清理动作用于通过移除长时间使用的对象来清理内存。\n\n**one.txt**\n```text\n\
  hello\n```\n\n**s1.py**\n```python\nfor i in open(“one.txt”，“r”):\n    print(i)\n\
  ```\n\n**输出**\n\n```text\nD:\\PythonPrograms>python s1.py\nhello\n```\n\n在上述程序中，即使程序执行完毕`one.txt`\
  \ 仍然处于打开状态。因此，为了避免这种情况，使用 `with` 语句执行预定义的清理动作。在执行该语句后，文件将自动关闭。\n\n```python\nwith\
  \ open(“one.txt”,”r”) as x:\n    for i in x:\n        print(i)\n```\n\n**输出**\n\n\
  ```text\nD:\\PythonPrograms>python s1.py\nhello\n```\n\n## 14.14 示例程序\n\n### 程序\
