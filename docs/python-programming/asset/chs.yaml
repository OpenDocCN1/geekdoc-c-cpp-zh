  \ 5.2 序列\n\nPython 编程支持序列来存储多个值，以提高组织效率。共有六种序列类型。它们是：\n\n- 字符串 (Strings)\n- 列表 (Lists)\n\
  - 元组 (Tuples)\n- 字节数组 (Byte arrays)\n- 缓冲区 (Buffers)\n- Range 对象 (Range objects)\n\
  \n### 字符串\n字符串是字符数据的集合。它也被字符数组。\n\n```python\ns=input(“Enter the String:”)\nprint(“The\
  \ entered string is:”,s)\nprint(type(s))\n```\n**输出**\n```\nD:\\PythonPrograms>python\
  \ a1.py\nEnter the String:hello\nThe entered string is: hello\n<class ‘str’>\n```\n\
  \n### 列表\n列表与字符串相似。它用于表示有序的值列表。\n\n```python\nx=[10,20,30]\nprint(“The numbers in\
  \ the list:”)\nfor i in range(0,3):\nprint(x[i])\n```\n**输出**\n```\nD:\\PythonPrograms>python\
  \ a1.py\nThe numbers in the list:\n10\n20\n30\n```\n\n### 元组\n元组与列表相似，不同之处它是不可变的。不允许对元组进行任何更改。\n\
  \n```python\nx=(10,20,30)\nprint(“The numbers in the Tuple:”)\nfor i in range(0,3):\n\
  print(x[i])\n```\n**输出**\n```\nD:\\PythonPrograms>python a1.py\nThe numbers in the\
  \ Tuple:\n10\n20\n30\n```\n\n### 字节\n字节是 0 到 256 之间的小范围整数。它是一个不可变的序列；因此不允许任何更改。Bytearray\
  \ 是用于表示字节的变变序列。\n\n```python\n>>> a=b”100”\n>>> print(a)\nb’100’\n```\n在上面的示例代码中，字节对象\
  \ `a` 初始化为值 100 并显示。在接下来的示例代码中，使用字节对象初始化一个字节数组对象。\n\n```python\n>>> a=bytes([10,\
  \ 20, 30])\n>>> a\nb’\\n\\x14\\x1e’\n>>> b=bytearray(a)\n>>> b\nbytearray(b’\\n\\\
  x14\\x1e’)\n```\n\n### 缓冲区\n缓冲区是用于维护参数值对象的序列。在 Python 3 中，它被重命名为“内存视图”（memory view）。它主要用于提供一个缓冲区，即使应用切片操作也能维护输入值。切片操作用于从给定的输入对象提取元素。\n\
  \n```python\nimport numpy\na = numpy.ndarray(1000000)\nprint(a.data)\n```\n**输出**\n\
  ```\nD:\\PythonPrograms>python a1.py\n<memory at 0x058FFC60>\n```\n\n### Range 对象\n\
  `range()` 函数用于创建 Range 对象。通常，它用于循环中维护范围值。它是一个不可变的序列。\n\n```python\nprint(“The numbers\
  \ from 0 to 10 with increment 3:”)\nfor i in range(0,10,3):\nprint(i)\n```\n**输出**\n\
  ```\nD:\\PythonPrograms>python a1.py\nThe numbers from 0 to 10 with increment 3:\n\
  0\n3\n6\n9\n```\n\n### 字典和集合\n字典和集合不是序列。它们是维护顺序数据的容器。字典用于通过键来维护值。\n\n```python\n\
  d={1:’ab’,2:’cd’,3:’ef’}\nprint(“The elements in the dictionary:”)\nfor i in range(1,4):\n\
  print(d[i])\n```\n**输出**\n```\nD:\\PythonPrograms>python a1.py\nThe elements in\
  \ the dictionary:\nab\ncd\nef\n```\n\n集合是一个无序的列表集合。它不允许重复值。集合是变序列，而冻结集合（frozen set）是不可变的集合。集合通过哈希表实现。\n\
  \n```python\ns={“ghi”，“abc”，“def”}\nprint(“The elements in the set:”)\nprint(s)\n\
  a=”ghi” in s\nif(a==True):\nprint(“ghi is available in the set”)\nelse:\nprint(“ghi\
  \ is not available in the set”)\n```\n**输出**\n```\nD:\\PythonPrograms>python a1.py\n\
  The elements in the set:\n{‘ghi’, ‘abc’, ‘def’}\nghi is avaiable in the set\n```\n\
  \n## 5.3 使用列表\nPython 借助序列支持数据结构。序列主要关注大数据的有效表示和维护。大数据可以有序或无序的形式维护。如果数据是根据序列号维护的，那么它就是以有序的方式维护的。列表类似于\
  \ C、C++ 或 Java 中的数组。\n\n在 Python 中，列表用 `[]`（方括号）表示。列表通过提供用 `,` 分隔的值来创建。列表可以维护同构类型的元素。\n\
  \n```python\n>>> x=[1,2,3]\n>>> x\n[1, 2, 3]\n>>> x=[10.5,23.67,34.87,45.95]\n>>>\
  \ x\n[10.5, 23.67, 34.87, 45.95]\n```\n\n列表允许重复的值集合。\n\n```python\n>>> x=[\"q”,”s”,”e”]\n\
  >>> x\n['q', 's', 'e']\n```\n\n列表包含有序元素集合。因此，可以使用索引访问列表元素。\n\n```python\n>>> li=[20,30]\n\
  >>> li\n[20, 30]\n```\n\n列表的索引从 0 开始。\n\n```python\n>>> l=[54,47,35]\n>>> l[0]\n\
  54\n>>> l[1]\n47\n>>> l[2]\n35\nTraceback (most recent call last):\nFile \"<stdin>”,\
  \ line 1, in <module>\nIndexError: list index out of range\n```\n列表中，如果索引值大于范围，将生成错误。索引值也可以是负数。如果索引值为负数，将从列表的最大索引减去。\n\
  \n```python\n>>> l=[54,47,35]\n>>> l[-1]\n35\n```\n\n有两种方式创建空列表。空列表用 `[]` 表示。\n\n\
  ```python\n>>> a=list()\n>>> a\n[]\n```\n\n列表中，元素可以更新。\n\n```python\n>>> l=[87,65,34]\n\
  >>> l[0]\n87\n>>> l[0]=10\n>>> l\n[10, 65, 34]\n```\n\n## 5.4 列表赋值与等价\n列表赋值用于将一个列表的所有元素赋值给另一个。在这里，两个列表都分配了内存。因此，更新一个列表不会反映另一个列表中。通过使用\
  \ `list()` 函数，可以将一个列表复制到另一个。\n\n```python\n>>> a=[5,2,3]\n>>> c=list(a)\n>>> c\n\
  [5, 2, 3]\n>>> c[0]=10\n>>> c\n[10, 2, 3]\n>>> a\n[5, 2, 3]\n```\n\n在上面的示例中，为 `a`\
  \ 和 `c` 列表分配了内存。要将一个列表的单个元素赋值给另一个，可以使用 `=` 运算符。\n\n```python\n>>> l1=[\"a”,”b”,”c”]\n\
  >>> l2=[\"b”,”d”,”e”]\n>>> l1\n['a', 'b', 'c']\n>>> l2\n['b', 'd', 'e']\n>>> l2[1]=\"\
  x”\n>>> l1\n['a', 'b', 'c']\n>>> l2\n['b', 'x', 'e']\n>>> l1[0]=l2[0]\n>>> l1\n\
  ['b', 'b', 'c']\n>>> l2\n['b', 'x', 'e']\n```\n\n在上面的示例中，两个列表 `l1` 和 `l2` 使用不同的元素创建。我们更新了列表的一些元素。然后将\
  \ `l2` 列表的元素赋值给 `l1` 列表。在一条语句中，也可以为多个变量赋值。\n\n```python\n>>> l1,l3=[\"ab”,”cd”]\n\
  >>> l1\n'ab'\n>>> l3\n'cd'\n```\n\n比较 `list1` 和 `list2` 的元素以检查它们是否相等。为此，使用了等价运算符\
  \ `==`。如果两个列表相同，则将返回 TRUE；否则返回 FALSE。\n\n```python\n>>> a=[1,2,3]\n>>> b=list(a)\n\
  >>> a\n[1, 2, 3]\n>>> b\n[1, 2, 3]\n>>> a==b\nTrue\n>>> a[0]=10\n>>> a==b\nFalse\n\
  ```\n\n可以使用相同的运算符比较列表的单个元素与另一个元素。\n\n```python\n>>> l1=[\"a”,”b”,”a”,”c”]\n>>> l1[0]==l1[1]\n\
  False\n>>> l1[0]==l1[2]\nTrue\n```\n\n除了此运算符，Python 中的所有运算符都可以应用于列表元素。\n\n## 5.5\
  \ 列表边界\n在列表赋值中，两个列表对象都分配了内存。因此，在一个列表对象上进行的更新将反映在另一个列表中。为了解决这个问题，使用了列表边界。在这个过程中，内存中只维护一个列表对象的，并并所有其他多个列表对象共享。因此，如果一个列表对象更新了列表的内容，它将反映在所有其他列表对象中。\n\
  \n```\n>>> lis1=[10,20,30]\n>>> lis2=lis1\n>>> lis1\n[10, 20, 30]\n>>> lis2\n[10,\
  \ 20, 30]\n>>> lis1[0]=100\n>>> lis1\n[100, 20, 30]\n>>> lis2\n[100, 20, 30]\n```\n\
  \n## 5.6 列表切片\n列表切片用于从一个列表复制选定的元素到另一个列表。通过使用 `[:]`，可以将一个列表的所有元素赋值给另一个列表。\n\n```python\n\
  >>> c=[10,2,3]\n>>> d=c[:]\n>>> d\n[10, 2, 3]\n>>> d[1]=20\n>>> d\n[10, 20, 3]\n\
  >>> c\n[10, 2, 3]\n```\n我们可以为切片运算符指定起始位置和结束位置。\n\n```\n>>> lis1=[100,200,300,400,500,600,700,800,900]\n\
  >>> lis2=lis1\n>>> lis1\n[100, 20, 300, 400, 500, 600, 700, 800, 900]\n>>> lis2\n\
  [100, 200, 300, 400, 500, 600, 700, 800, 900]\n>>> lis1\n[100, 200, 300, 400, 500,\
  \ 600, 700, 800, 900]\n>>> lis3=lis1[1:3]\n>>> lis3\n[200, 300]\n```\n\n\n\n\n我们还可以为切片操作指定一个增量值。这被称为扩展切片。在下方的示例代码中，范围从索引\
  \ 3 开始，索引每次增加 2，直到达到索引 8。\n\n```python\n>>> lis1=[100,200,300,400,500,600,700,800,900]\n\
  >>> lis1\n[100, 200, 300, 400, 500, 600, 700, 800, 900]\n>>> lis4=lis1[3:8:2]\n\
  >>> lis4\n[400, 600, 800]\n```\n\n## 5.7 列表克隆\n\n在 Python 中，克隆操作将列表从一个对象复制到另一个对象，对一个列表进行的更改不会反映在另一个列表中。\n\
  \n```python\nx=[1,2,3]\ny=x\nk=x[:]\nz=x.copy()\n\nprint(\"list x:\",x)\nprint(\"\
  list y:\",y)\nprint(\"list k:\",k)\nprint(\"list z:\",z)\n\nprint(\"Results with\
  \ assignment copy:\")\ny[0]=10\nprint(\"list x:\",x)\nprint(\"list y:\",y)\n\nprint(\"\
  Results with clone:\")\nk[0]=1000\nprint(\"list x:\",x)\nprint(\"list k:\",k)\n\n\
  print(\"Results with copy():\")\nz[0]=100\nprint(\"list x:\",x)\nprint(\"list z:\"\
  ,z)\n```\n\n**输出***\n```\nD:\\PythonPrograms>python s1.py\nlist x: [1, 2, 3]\nlist\
  \ y: [1, 2, 3]\nlist k: [1, 2, 3]\nlist z: [1, 2, 3]\nResults with assignment copy:\n\
  list x: [10, 2, 3]\nlist y: [10, 2, 3]\nResults with clone:\nlist x: [10, 2, 3]\n\
  list k: [1000, 2, 3]\nResults with copy():\nlist x: [10, 2, 3]\nlist z: [100, 2,\
  \ 3]\n```\n\n## 5.8 嵌套列表\n\n在 Python 中，列表可以包含另一个或多个列表作为元素。在这种情况下，可以通过子列表的索引以及元素在子列表中的索引来访问项。\n\
  \n```python\nx=[[1,2,3],['a','b','c']]\nfor a in x:\n    for b in a:\n        print(b)\n\
  ```\n\n**输出***\n```\nD:\\PythonPrograms>python s1.py\n1\n2\n3\na\nb\nc\n```\n\n\
  ## 5.9 列表推导式\n\n在 Python 中，列表推导式允许程序员根据数学方程定义列表元素。例如，方程 ![image](img/9789386235633_102.png)\
  \ 的列表推导式为：\n\n```python\n>>> A = [y**2 for y in range(5)]\n>>> print(A)\n[0, 1,\
  \ 4, 9, 16]\n```\n\n## 5.10 列表与函数\n\n我们可以对列表执行各种操作，如下所示。\n\n- `del()` 函数用于删除列表元素。`del()`\
  \ 也用于删除列表对象。一旦列表对象被删除，为列表分配的内存就会被释放。\n\n```python\n>>> lis4=[400,600,800]\n>>> lis4\n\
  [400, 600, 800]\n>>> del lis4[0]\n>>> lis4\n[600, 800]\n>>> del lis4\n>>> lis4\n\
  Traceback (most recent call last):\nFile \"<stdin>\", line 1, in <module>\nNameError:\
  \ name 'lis4' is not defined\n```\n\n- `len()` 函数用于返回列表对象的长度。它指定了列表中元素的个数。\n\n```python\n\
  >>> g=[9.56,6.45,8.94,2.78]\n>>> len(g)\n4\n```\n\n- 两个列表对象可以通过 `+` 运算符进行连接或合并。\n\
  \n```python\n>>> g=[4.8,7.2,6.5,9.2]\n>>> f=[1,2,3]\n>>> e=f+g\n>>> e\n[1, 2, 3,\
  \ 4.8, 7.2, 6.5, 9.2]\n>>> g=[4.8,7.2,6.5,9.2]\n>>> f=[1,2,3]\n>>> h=g[2:5]+f[1:2]\n\
  >>> h\n[6.5, 9.2, 2]\n```\n\n- 可以使用 `*` 运算符重复列表元素。为此，需要提供重复的倍数。\n\n```python\n>>>\
  \ a=[444,77,22]\n>>> b=a*3\n>>> a\n[444, 77, 22]\n>>> b\n[444, 77, 22, 444, 77,\
